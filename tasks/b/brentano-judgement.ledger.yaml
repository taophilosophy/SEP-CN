      On to (ii). Is the intrinsic difference between judgement and presentation one that concerns the content of the mental mental phenomena under consideration? According to the view opposed by Brentano, every judgement is a combining or separating of marks [Merkmale]. The content of a judgement is the combination of at least two marks that are either divided or combined in it. Possessing a content is an intrinsic property of a judgement: every judgement must have a content and the content distinguishes a judgement, in part, from other mental phenomena. Do judgements and presentations differ in content (cf. PES 205 [II 44; SVS 1, 227])? Again Brentano’s answer is NO. If I wonder whether there are red trees, the content of my presentation is a combination of the marks redness and tree(hood). My judgement that there are red trees has the same content as the mere presentation of a red tree.[^note-6]
    step1: |-
      转到（ii）。判断与表象之间的内在差异，是否关涉所论心理现象的内容？按照布伦塔诺所反对的观点，每个判断都是标记〔Merkmale〕的结合或分离。判断的内容是至少两个标记的结合，这些标记在判断中被分离或被结合。具有内容乃判断的内在性质：每个判断都必有内容，而内容在某种程度上把判断与其他心理现象区分开来。那么，判断与表象是否在内容上不同（参 PES 205 [II 44; SVS 1, 227]）？布伦塔诺的回答仍然是否定的。如果我思量“是否有红树”，我表象的内容就是“红”与“树（性）”两个标记的结合。我关于“有红树”的判断，与关于一棵红树的单纯表象具有相同的内容。[^note-6]
