      Brentano takes it to be beyond doubt that such a perception is a judgement, only not a predicative one. This is controversial. For example, Brentano’s *modus ponens* is Moritz Schlick’s (1925, 80/1974, 87) *modus tollens*: perception is not judgement, hence, a perception cannot be knowledge. So****why should one think of seeing a yellow canary or hearing a sound as a judgement in the first place? Consider again your perception of the yellow canary. The canary looks different from its surroundings to you and you can train your attention on it. In this situation you will, to use a non-committal phrase, “take the canary to be real”. Seeing the canary is a particular kind of “taking the canary to be”, namely as something real; in Brentano’s terminology that is “an acknowledging of the canary”. If this is right, there are judgements that do not predicate any properties of an object and merely acknowledge it.
    step1: |-
      布伦塔诺认为，这种知觉是判断——只不过不是述谓判断——这一点无可置疑。这是有争议的。例如，布伦塔诺的 **肯定前件式** 与莫里茨·石里克（1925, 80/1974, 87）的 **否定后件式** 针锋相对：知觉不是判断，因此知觉不可能是知识。那么，人们首先凭什么把看见一只黄色金丝雀或听见一个声音视为判断呢？再想想你对那只黄色金丝雀的知觉。在你看来，金丝雀与其周围环境显得不同，而你可以把注意力集中到它上面。在这种情形中，用一句不作承诺的话说，你会“把金丝雀视为实在的”。看见金丝雀是“把金丝雀视为……”的一种特定方式，即视为某种实在的东西；用布伦塔诺的术语说，这就是“对金丝雀的一种承认”。如果这没错，那么就存在并不把任何性质述谓于对象、而只是承认对象的判断。
