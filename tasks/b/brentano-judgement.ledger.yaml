      Brentano considers three possible ways of conceiving of the difference between presentations and judgements. There may be (i) an intrinsic difference between them, (ii) they may differ in their contents (Inhalte), or (iii) in a perfection [*Vollkommenheit*] with which these objects are thought (PES 204, [II 42f.; SVS 1, 226]).
    step1: |-
      布伦塔诺考察了理解判断与表象之别的三种可能方式。它们之间或许有（i）内在的差异；（ii）内容（Inhalte）上的差异；或（iii）在思考这些对象时所达到的完善程度〔*Vollkommenheit*〕上的差异（PES 204, [II 42f.; SVS 1, 226]）。
    step2: |-
      布伦塔诺考察了理解判断与表象之别的三种可能方式。它们之间或许有（i）内在的差异；（ii）内容（Inhalte）上的差异；或（iii）在思考这些对象时所达到的完善程度〔*Vollkommenheit*〕上的差异（PES 204, [II 42f.; SVS 1, 226]）。
  - id: 27
    kind: body
    source: |-
      Let’s start with (i). What would it mean that the distinction between judgement and presentation is *not* intrinsic, i.e., extrinsic? It would mean that the distinction between judgement and presentation consists in a relational property that one of these mental phenomena has while the other lacks it. In this sense the distinction between a bachelor and a husband is extrinsic: bachelors lack the relational property of being married to someone; husbands have it. Nothing else distinguishes bachelors and husbands from each other: there is no intrinsic property of husbands or bachelors that grounds the relational difference. Is the distinction between judgement and presentation like the distinction between husbands and bachelors? According to Alexander Bain, it is. For Bain there are two kinds of ideas (presentations): those that dispose one to act—this is the extrinsic or relational property—and others that don’t. The former are judgements and beliefs, the latter are mere presentations (see Bain 1872: 372f)[^bain-1872]. Mill (1878: 403–4) criticized Bain’s proposal as incomplete. In general, a dispositional property like disposing one to act on an object is grounded in its categorical properties. Hence, the belief-constituting disposition to act must be grounded in categorical properties of ideas and these properties seem to be intrinsic. The relational difference is not brute as in the husband/bachelor case.
    step1: |-
      先从（i）说起。说判断与表象之别不是内在的，即外在的，会是什么意思？那意味着：判断与表象之别在于一种关系性质，上述两种心理现象之一具有该性质，另一则不具有。在这个意义上，单身汉与丈夫之别是外在的：单身汉缺少“与某人结婚”这一关系性质，丈夫则具有它。除此之外，单身汉与丈夫之间别无区别：并不存在丈夫或单身汉的某种内在性质，作为这一关系差异的根据。判断与表象之别是否像丈夫与单身汉之别？亚历山大·贝恩认为是的。在贝恩看来，观念（表象）有两类：一类使人倾向于行动——这是外在的或关系的性质——另一类则不。前者是判断与信念，后者只是表象（见 Bain 1872: 372f）[^bain-1872]。穆勒（1878: 403–4）批评贝恩的提议不完整。一般来说，像“使人倾向于对某对象行动”这样的倾向性性质，其根据在于对象的直陈性质。因此，构成信念的行动倾向必须以观念的一些直陈性质为根据，而这些性质看来是内在的。这一关系差异并不像丈夫／单身汉一例那样是无根据的。
