      Everyone agrees that in categorical propositions of the form “All *S* are *P*”, “Some *S* are *P*”, “No *S* is *P*” and “Some *S* are not *P*” the copula “is” or “is not” merely indicates the quality of the judgement and has no meaning of itself.
