      The point that Brentano wants to get across is a delicate one and requires a careful wording. It is no coincidence that Brentano prefers here the term “*anerkennen*” over “*annehmen*”, which would be closer to common usage in philosophy. The reason is that Brentano thinks that the more common way of speaking wrongly suggests that one predicates truth when one accepts something as true. According to Brentano, as will become clear later, judgement requires no predication (not even a predication of existence). Hence, the difference in meaning between “accepting (*annehmen*)” and “acknowledging (*anerkennen*)” becomes important for him.[^note-8]
    step1: |-
      布伦塔诺想要传达的这一点颇为微妙，需要谨慎措辞。他在这里宁可选用“*anerkennen*”而不选用更接近哲学通常用法的“*annehmen*”，绝非偶然。原因在于：布伦塔诺认为，更常见的说法会错误地暗示，人在把某物作为真来接受时是在述谓“真”。照布伦塔诺的看法（后文将会清楚），判断并不需要述谓（甚至不需要存在述谓）。因此，“接受（*annehmen*）”与“承认（*anerkennen*）”之间的意义差别，对他而言就变得重要了。[^note-8]
    step2: |-
