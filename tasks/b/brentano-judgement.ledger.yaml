      We have now introduced the idea that animates Brentano’s theory of judgement: predication is one thing, judgement another. We have seen which views inspired Brentano to disentangle judgement and predication. However, so far we lack a reason to follow Brentano’s lead. How can he convince his readers that predication is not necessary for judgement, since we already judge when we merely acknowledge or reject an object?
