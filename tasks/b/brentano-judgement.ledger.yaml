      If judging is either acknowledging or rejecting of contents, the notion of acknowledgement/rejection is fundamental in philosophy of mind. In response to Brentano’s move, philosophers at the end of the 19th and beginning of 20th century engaged with his view of acknowledgement. Wilhelm Jerusalem (1895, 67–72) discussed Brentano’s and Marty’s view of judgement and argues for a view of judgement as a complex activity.[^note-22] Adolf Reinach (1911, sect. I) distinguished different related notions of ‘acknowledgement’ and criticises Brentano for running them together. Karelitzki (1914) is a (short) monograph devoted to find a plausible concept of acknowledgement and takes Brentano’s as its starting point (see ibid., 13–28). The central figure of the Vienna circle, Moritz Schlick (1925, 50/1974, 43) took Brentano to be right about the psychological nature of judgement, but not its logical role. For this reason he argues against the reduction thesis that we will examine below.
    step1: |-
      如果判断无非是对内容的承认或拒绝，那么承认／拒绝概念在心灵哲学中便是根本性的。针对布伦塔诺的举措，19 世纪末、20 世纪初的哲学家参与讨论了他的承认观。威廉·耶路撒冷（1895, 67–72）讨论了布伦塔诺与马蒂的判断观，并主张判断是一种复合活动。[^note-22] 阿道夫·莱纳赫（1911，第一节）区分了“承认”的几种相关概念，并批评布伦塔诺把它们混为一谈。卡雷利茨基（1914）是一部（短篇）专著，致力于寻找一个合理的承认概念，并以布伦塔诺的为出发点（见同上，13–28）。维也纳学派的中心人物莫里茨·石里克（1925, 50/1974, 43）认为布伦塔诺在判断的心理本性上说对了，但在其逻辑作用上说错了。因此他反对我们下文将考察的还原论题。
