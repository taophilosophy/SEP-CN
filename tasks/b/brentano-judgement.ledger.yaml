      > [O]ne must always bear in mind that he [Brentano] used the term ‘judgement’ in a much more general way than most people in ordinary usage. One must remember that for him every perception, inner as well as external, is a judgement, that he already finds in it an elementary assent, a positing [Setzung], and that for him any mental act seems from the very beginning connected with an evident self-affirmation, hence a judgement in this widest sense. This is of course nowhere near the view that only knows verbally framed judgements (statements) with subject and predicate. (Stumpf 1919, 133; author translation)[^stumpf-1919]
    step1: |-
      > 必须时时记住，他〔布伦塔诺〕使用“判断”一词的方式，远比常人在日常用法中宽泛得多。要记住：在他看来，一切知觉，无论内知觉还是外知觉，都是判断；他已经在其中发现了某种初级的赞同，一种设定〔Setzung〕；而且在他看来，任何心理行为从一开始就似乎与一种明证的自我肯定相连，因而在这个最宽泛的意义上就是判断。这当然远非那种只承认有主语和谓语的、以语词表述的判断（陈述）的观点。（Stumpf 1919, 133；作者译）[^stumpf-1919]
