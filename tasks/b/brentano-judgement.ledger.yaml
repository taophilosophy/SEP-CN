      In *Psychology* (PES 212 fn, [II 54 fn; SVS 1, 234 fn 246]) Brentano says in a long footnote that Aristotle hinted at the right conception of existential judgement in *Metaphysics* and in *De Interpretatione*. In *Metaphysics* Book IX (θ) 10 Aristotle is faced with a problem. He has told his readers that one judges truly if one separates in thought what is separated in reality and combines in thought what is combined in reality. For example, if Plato and foolishness are separated—the former does not have the latter—one judges truly if one separates Plato and foolishness in thought, that is, judges that Plato is not foolish. But now Aristotle goes on to tell us that there are *incomposites* that are not combined with anything. How can one make true or false judgements pertaining to such things?[^note-10]
    step1: |-
      在《心理学》中（PES 212 fn, [II 54 fn; SVS 1, 234 fn 246]），布伦塔诺在一条长脚注里说，亚里士多德在《形而上学》与《解释篇》中暗示了存在判断的正确构想。在《形而上学》第九卷（θ）第 10 章，亚里士多德面临一个问题。他曾告诉读者：若人在思想中分离现实中分离的东西，在思想中结合现实中结合的东西，其判断便为真。例如，若柏拉图与愚蠢是分离的——前者不具有后者——那么人在思想中把柏拉图与愚蠢分开，即判断柏拉图不愚蠢，其判断便为真。但接下来亚里士多德告诉我们，有些“不可组合者”（incomposites）不与任何东西结合。人如何能对这类东西作出真或假的判断？[^note-10]
