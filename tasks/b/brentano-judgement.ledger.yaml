      Existential judgements play a fundamental role in Brentano’s arguments against other views of judgement as well as in his positive account of judgement. Brentano’s discussion of existential judgements aims to show that such judgements cannot be conceived as predications of properties (see section 1.1) and that such judgements are either acknowledgments or rejections of objects.
    step1: |-
      存在判断在布伦塔诺反对其他判断观的论证中，以及在他自己关于判断的正面阐述中，都起着根本作用。布伦塔诺对存在判断的讨论旨在表明：这类判断不能被设想为对性质的述谓（见 1.1 节），并且这类判断要么是对对象的承认，要么是对对象的拒绝。
