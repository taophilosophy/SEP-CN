      [^note-33]: Higher-order judgements are still reducible, if one interprets them as claiming that a subject who judges correctly or incorrectly exists or does not exist. But that makes the negative term “incorrect” part of the subject-matter of these judgements, in violation of Brentano’s restriction against negative properties. In line with that restriction, these higher-order judgements may therefore also turn out to be unreducible to the existential form.
