      Brentano must have changed his mind about how to read *Metaphysics*. As Tassone notes, one can find here the roots of Brentano’s reworking of Aristotle’s theory of truth, moving from a substantive to a deflationary account. (see Tassone 2011: 305; and Brandl 2017)[^brandl-2017][^tassone-2011].
