      The one philosopher that came closest to Brentano’s view on judgement was Johann Friedrich Herbart.[^note-16] Herbart does not try to assimilate existential and so-called “subjectless” statements (“It rains”) to categorical one’s of the form “*S* is *P*”.[^note-17] And he takes “is” in “God is” to be the sign of “absolute positing” (*unbedingte Aufstellung*) (Herbart 1813: 49)[^herbart-1813]. While Brentano praises Herbart for holding this view, he does not pick up his terminology, expecting little insight from the associations it encourages.
    step1: |-
      最接近布伦塔诺判断观的哲学家是约翰·弗里德里希·赫尔巴特。[^note-16] 赫尔巴特并不试图把存在陈述与所谓“无主语句”（“下雨了”）归并到“*S* 是 *P*”形式的直言命题中去。[^note-17] 并且，他认为“上帝存在”中的“是”是“绝对设定”（*unbedingte Aufstellung*）的记号（Herbart 1813: 49）[^herbart-1813]。布伦塔诺赞赏赫尔巴特持有这一观点，却没有采用他的术语，因为他不指望那些术语所唤起的联想能带来什么洞见。
