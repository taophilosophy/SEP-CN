      > That predication is not the essence of every judgement emerges quite clearly from the fact that all perceptions are judgements. For it [perception] is either knowledge [*Erkenntnis*] or at least a mistaken taking to be true [*Fürwahrnehmen*]. And this is not denied by those thinkers who hold that every judgement consists in a conjunction of subject and predicate. […] [I]t is hard to think of anything more obvious and unmistakable than the fact that a perception is not a [connection] of a concept of the subject and a concept of a predicate, nor does it refer to such a connection. Rather, the object of an *inner* perception is simply a mental phenomenon, and the object of an *external* perception is simply a physical phenomenon, a sound, odor, or the like. We have here, then, a quite obvious justification of the truth of our assertion. (PES 209 [II 50–51; SVS 1, 232], translation changed.)
    step1: |-
      > 述谓并非每个判断的本质，这一点从“一切知觉都是判断”这一事实中相当清楚地显露出来。因为知觉〔它〕要么是知识〔*Erkenntnis*〕，要么至少是一种错误的视为真〔*Fürwahrnehmen*〕。而这一点，那些主张每个判断都由主词与谓词结合而成的思想家也并不否认。[…] 很难想象还有什么比下述事实更明显、更无可置疑：知觉不是主词概念与谓词概念的〔联结〕，也不指向这样的联结。相反，内知觉的对象只是一个心理现象，而外知觉的对象只是一个物理现象，如声音、气味之类。因此，我们在这里有了一个相当明显的根据，足以证明我们主张的真理性。（PES 209 [II 50–51; SVS 1, 232]，译文有改动）
