      The core idea from which Brentano starts is very simple: traditional logic takes the A-form and the I-form to express positive judgements, and the E-form and the O-form to express negative ones. According to Brentano, that is a confusion. All universal propositions (both A and E) express negative judgements and therefore lack existential import, whereas all particular propositions (both I and O) express positive judgements with existential import. The reduction thesis fits in nicely with this idea, or so it seems. It helps us to correctly interpret the principles of traditional logic and to see which of them one should retain. In turn, the simplification of the square of opposition lends support to the reduction thesis. Everything seems to fit nicely.[^note-23]
    step1: |-
      布伦塔诺的出发点很简单：传统逻辑认为 A 式与 I 式表达肯定判断，E 式与 O 式表达否定判断。在布伦塔诺看来，这是一种混淆。一切全称命题（A 与 E）都表达否定判断，因而没有存在涵义；而一切特称命题（I 与 O）都表达具有存在涵义的肯定判断。还原论题与这一想法颇为契合——至少看起来如此。它有助于我们正确解释传统逻辑的原理，看清其中哪些应当保留。反过来，对当方阵的简化又支持了还原论题。一切似乎都严丝合缝。[^note-23]
    step2: |-
