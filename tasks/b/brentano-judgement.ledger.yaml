  - id: 219
    kind: note
    source: |-
      [^note-34]: Of course, one could try to modify Brentano’s theory in a way that still reaches this goal. Following an idea of Anton Marty, G. Bacigalupo has put forward such a proposal that takes all categorical propositions to express double judgements, combined with a meta-judgement stating that either the whole double-judgement or part of it is incorrect. Bacigalupo concludes that on this version of Brentano’s theory, “the I-form becomes the only primitive form; all other forms may be derived from it by means of the notion of incorrectness” (2018: 256). From Brentano’s point of view, this modification has two shortcomings. It overlooks that simple existential judgements are still more primitive than judgements of the I-form, and one cannot make sense of the notion of “incorrectness” without taking both affirmative and negative judgements as primitive.
