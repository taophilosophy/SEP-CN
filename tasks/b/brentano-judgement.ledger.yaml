      Kant’s slogan “being is not a real predicate” has been interpreted as saying that “exists” is no first-order predicate of objects, but a second-order predicate true of concepts. Whether this is the correct interpretation is not important for our purposes. Primed by Aquinas’s remarks on “to be”, Brentano reads Kant’s remark differently.[^note-14] When I judge that God exists, I posit an omniscient being, but I do not add something to the concept of an omniscient being. Instead of saying “exists” is not a real predicate, Kant should have said that it is not a predicate at all, but a force-indicator: it has positing force.
    step1: |-
      康德的口号“存在不是实在的谓词”一直被解释为：说“存在”不是对象的一阶谓词，而是对概念为真的二阶谓词。这一解释是否正确，对我们的目的并不重要。受阿奎那关于“是”的论述启发，布伦塔诺对康德这句话作了不同的解读。[^note-14] 当我判断上帝存在时，我设定了一个全知的存在者，但并没有给“全知的存在者”这一概念增添什么。康德与其说“存在”不是实在的谓词，不如说它根本不是谓词，而是一个力量指示词：它具有设定的力量。
