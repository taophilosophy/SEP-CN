      Let us now turn to Kant. Brentano disagrees with Kant’s epistemology on almost every single point. With respect to the nature of judgement, Brentano points out that Kant overlooks their essential character by putting them together with presentations into a single category: acts of thinking. He also takes Kant to task for holding on to the mistaken view that a judgement always unifies several representations (*Critique of Pure Reason*, A 68–9/B93–4). Thus it may come as a surprise that there is also a strong agreement between their views. Kant anticipates Brentano’s claim that a “single mark [einzelnes Merkmal] which is the object of a presentation can be acknowledged or denied, too” (PES 208 [II 49; SVS 1, 230]; translation changed). The insight can be found in Kant’s seminal discussion of existence:
    step1: |-
      现在让我们转向康德。布伦塔诺几乎在每一点上都不同意康德的认识论。关于判断的本性，布伦塔诺指出，康德把判断与表象一并归入“思维行为”这一单一范畴，从而忽略了判断的本质特征。他还批评康德固守一个错误观点：判断总是综合多个表象（《纯粹理性批判》，A 68–9/B93–4）。因此，下述情况或许令人惊讶：两人的观点也有强烈的一致之处。康德预见了布伦塔诺的主张：“一个作为表象对象的单一标记〔einzelnes Merkmal〕也可以被承认或被拒绝”（PES 208 [II 49; SVS 1, 230]；译文有改动）。这一洞见见于康德关于存在的开创性讨论：
