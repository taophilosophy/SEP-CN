      This brings us to (iii). Is the intrinsic difference between judgement and presentation one that concerns a perfection in which mental phenomena that have the same object differ? Brentano identifies the perfection as *strength*, *intensity* or *vivacity* of the mental phenomena concerned. Is, as Brentano says, “a judgement a stronger presentation and a presentation a weaker judgement”? (PES 204 [II 44; SVS 1, 226]; author translation) Brentano says NO. A strong presentation is no judgement. This argument, while suggestive, is not persuasive because the notion of strength, vividness or intensity seems unclear. However, in the second edition Brentano adds an important consideration that improves the argument. If presentation and judgement were distinguished in strength, both would need to have positions on a scale of strength. However, Brentano now doubts that there is one scale of intensity or strength on which presentations and judgements both lie. Different degrees of conviction that may accompany an act of judgement should not be confused with the degrees of intensity with which an object can be presented to the mind, e.g., in sensation (PES 286f. [II 151ff.; SVS 1, 401). If there is not one dimension of strength in which both judgement and presentation can differ, strength cannot distinguish between them.
    step1: |-
      这就把我们带到（iii）。判断与表象之间的内在差异，是否关涉具有同一对象的心理现象在其中有所不同的某种完善程度？布伦塔诺把这种完善程度认定为相关心理现象的强度、强烈或生动性。那么，是否如布伦塔诺所说，“判断是较强的表象，表象是较弱的判断”？（PES 204 [II 44; SVS 1, 226]；作者译）布伦塔诺说不。强烈的表象并不是判断。这一论证虽然富有启发，却并不令人信服，因为强度、生动或强烈这些概念似乎并不清楚。不过，在第二版中布伦塔诺补充了一项重要考虑，改进了这一论证。如果表象与判断以强度相区别，两者就都得在强度标尺上占有一席之地。然而布伦塔诺此时怀疑：是否存在一条同时容纳表象与判断的强度或力量标尺。伴随判断行为的种种确信程度，不应与对象呈现于心灵时的强烈程度相混淆，例如在感觉中（PES 286f. [II 151ff.; SVS 1, 401）。如果并不存在一条能让判断与表象都有所不同的强度维度，强度便无法区分二者。
