      > The same object is present to consciousness whether a person affirms it, denies it, or uncertainly asks about it; in the last case it is merely presented, in the first two cases it is simultaneously presented and acknowledged or denied. And every object which is the content of a presentation can possibly also become the content of a judgement. (PES 221 [II 63; SVS 1, 241]; in part authors translation)
    step1: |-
      > 无论一个人肯定、否定还是不确定地询问某对象，这同一个对象都呈现于意识；在后一种情形里它只是被表象，在前两种情形里它同时被表象并被承认或拒绝。而且，凡作为表象内容的每个对象，都可能也成为判断的内容。（PES 221 [II 63; SVS 1, 241]；部分为作者译）
    step2: |-
      > 无论一个人肯定、否定还是不确定地询问某对象，这同一个对象都呈现于意识；在后一种情形里它只是被表象，在前两种情形里它同时被表象并被承认或拒绝。而且，凡作为表象内容的每个对象，都可能也成为判断的内容。（PES 221 [II 63; SVS 1, 241]；部分为作者译）
  - id: 57
    kind: body
    source: |-
      Inner experience is supposed to show us that, when we reject, acknowledge or keeps an open mind about an object, we have ‘the same object in consciousness’. Brentano then moves from ‘same object’ to the conclusion that a judgement, either negative or positive, and a presentation can have exactly the same content so that the difference between judgement and content does not lie in a difference in content. As remarked before, Brentano sometimes talks as if objects are contents. If we read Brentano’s remark charitably, he appeals to introspective knowledge that a presentation can purport to be directed on an object in terms of marks. The judgement that is based on this presentation and rejects the object the presentation purports to be directed on as well as the judgement that acknowledges it, share the content of the presentation (the marks in terms of which the presentation is directed on something). Hence, negative and positive judgements can have the same content. This gives Brentano a reason to endorse claim (5). His argument once more rules out a propositional analysis of these judgements, and may thus buttress his arguments in favor of claim (4). We will encounter further reasons that speak for accepting (5) later (in section 5), where we discuss Brentano’s reasons for rejecting negative properties.
    step1: |-
      内经验应当向我们表明：当我们拒绝、承认或对某个对象持开放态度时，我们拥有“意识中的同一个对象”。布伦塔诺随即从“同一个对象”推出：判断——无论否定还是肯定——与表象可以具有完全相同的内容，因而判断与内容之别并不在于内容之别。如前所述，布伦塔诺有时说起话来仿佛对象就是内容。若善意地解读他的说法，他所诉诸的是一种内省知识：表象可以凭标记而声称指向某个对象。以该表象为基础、拒绝该表象所指向的对象的判断，以及承认它的判断，共享该表象的内容（即表象据以指向某物的那些标记）。因此，否定判断与肯定判断可以具有相同的内容。这为布伦塔诺支持主张（5）提供了理由。他的论证再次排除了对这些判断作命题分析的可能，因而或许能加强他支持主张（4）的论证。后文（第 5 节）讨论布伦塔诺反对否定性质的理由时，我们还会遇到支持（5）的更多理由。
    step2: |-
      内经验应当向我们表明：当我们拒绝、承认或对某个对象持开放态度时，我们拥有“意识中的同一个对象”。布伦塔诺随即从“同一个对象”推出：判断——无论否定还是肯定——与表象可以具有完全相同的内容，因而判断与内容之别并不在于内容之别。如前所述，布伦塔诺有时说起话来仿佛对象就是内容。若善意地解读他的说法，他所诉诸的是一种内省知识：表象可以凭标记而声称指向某个对象。以该表象为基础、拒绝该表象所指向的对象的判断，以及承认它的判断，共享该表象的内容（即表象据以指向某物的那些标记）。因此，否定判断与肯定判断可以具有相同的内容。这为布伦塔诺支持主张（5）提供了理由。他的论证再次排除了对这些判断作命题分析的可能，因而或许能加强他支持主张（4）的论证。后文（第 5 节）讨论布伦塔诺反对否定性质的理由时，我们还会遇到支持（5）的更多理由。
