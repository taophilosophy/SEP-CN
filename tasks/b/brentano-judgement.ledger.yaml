      But a closer look reveals that this tight fit between Brentano’s theory of judgement and his reform of logic is illusory. With the advance of quantificational logic, it became clear that in order to correct the square of oppositions in the way in which Brentano suggests, all one needs to do is to use existentially quantified formulas instead of categorical propositions (see Church 1947: 56)[^church-1947]. This observation contains both good and bad news for Brentano. The good news is that Brentano’s logical intuitions find support in quantificational logic. The bad news is that his reduction thesis ceases to play a role in reforming logic. Surely, a quantified formula *may* express an existential judgement with a non-propositional content, as Brentano conceived it, but it may also express a judgement with a propositional content. To put it in other words: Brentano’s revision of traditional logic can be replicated without making use of his reduction thesis.
    step1: |-
      但细看之下就会发现，布伦塔诺的判断理论与其逻辑改革之间的这种严丝合缝只是假象。随着量化逻辑的进展，人们清楚看到：要按布伦塔诺建议的方式修正对当方阵，只需用存在量化的公式取代直言命题即可（见 Church 1947: 56）[^church-1947]。这一观察对布伦塔诺来说既是好消息也是坏消息。好消息是，他的逻辑直觉在量化逻辑中得到支持。坏消息是，他的还原论题在逻辑改革中不再起作用。当然，一个量化公式可以表达布伦塔诺所设想的、具有非命题内容的存在判断，但它也可以表达具有命题内容的判断。换言之：布伦塔诺对传统逻辑的修订可以不用他的还原论题而照样复现。
    step2: |-
