      In this section, we start with an overview of Brentano’s theory of judgement, as far as it is contained in the first edition of the *Psychology*.[^note-2] It will be convenient to divide the material covered by Brentano in chapter 7 of this work (and the final section of chapter 6) into four parts. The first part tries to establish the fundamental difference between judgements (*Urteile*) and presentations (*Vorstellungen*); the second part pertains to the relation between judgement and truth; the third part deals with existential judgements and their intentional objects; and the fourth part proposes a reduction of categorical and hypothetical judgements to the existential form.
    step1: |-
      在本节中，我们先概述布伦塔诺的判断理论，以《心理学》第一版所包含的内容为限。[^note-2] 为方便起见，我们把布伦塔诺在该书第 7 章（以及第 6 章末节）所处理的材料分为四部分。第一部分力图确立判断（Urteile）与表象（Vorstellungen）之间的根本区别；第二部分关涉判断与真理的关系；第三部分讨论存在判断及其意向对象；第四部分提出把直言判断与假言判断还原为存在形式。
    step2: |-
      本节先概述布伦塔诺的判断理论，范围限于《心理学》第一版所包含的内容。[^note-2] 为方便起见，我们把布伦塔诺在该书第 7 章（以及第 6 章末节）所处理的材料分为四部分。第一部分力图确立判断（Urteile）与表象（Vorstellungen）之间的根本区别；第二部分关涉判断与真理的关系；第三部分讨论存在判断及其意向对象；第四部分提出把直言判断与假言判断还原为存在形式。
