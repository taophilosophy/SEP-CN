      Let us sum up the discussion and put its result into perspective. Brentano tells us that perceiving an object is acknowledging it. Such perceptions are for Brentano the prime example of existential judgements. In such judgements we acknowledge an object without predicating anything of it. Based on this observation, Brentano argues that simple existential judgements are not of the categorical form “*S* is *P*” or “*S* has the property *P*”. In other words, simple judgements do not have a propositional content. In making such judgements we may acknowledge a content, a combination of marks or a single mark and thereby an object that possesses these marks, but we do not affirm *that* the object that is so-and-so exists.
    step1: |-
      让我们总结讨论，并把结果放到应有的位置。布伦塔诺告诉我们：知觉一个对象就是承认它。这类知觉对布伦塔诺而言是存在判断的首要范例。在这类判断中，我们承认一个对象，却不把任何东西述谓于它。基于这一观察，布伦塔诺论证说，简单的存在判断并不具有“*S* 是 *P*”或“*S* 具有性质 *P*”的直言形式。换言之，简单判断不具有命题内容。作出这类判断时，我们可能承认一个内容、诸标记的一种结合或单一标记，从而承认具有这些标记的对象，但我们并不肯定“如此这般的对象存在”这一事实。
