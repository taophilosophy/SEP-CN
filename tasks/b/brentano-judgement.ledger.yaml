      A note of caution: Brentano reiterates here his claim that combining marks is not sufficient to make a judgement. He also raises a new question: what does ‘A’ stand for? If we combine two marks and then acknowledge each element of this combination, ‘A’ must stand for a mark. But sometimes he talks as if ‘A’ designated a particular object. We take this way of talking therefore to be a convenient abbreviation. Now back to the main topic. Acknowledging *A* already does all the work that judging that *A* exists is supposed to do: to commit one to the existence of *A*. Since one cannot judge that *A* exists without acknowledging *A*, judging that *A* exists is necessarily redundant.[^note-9] Thus, we get as an intermediary conclusion of the argument the following claim:
    step1: |-
      需要提醒一点：布伦塔诺在此重申他的主张——结合标记并不足以构成判断。他还提出一个新问题：“A”代表什么？如果我们结合两个标记，然后承认这一结合中的每个要素，那么“A”必定代表一个标记。但有时他说起话来，仿佛“A”指称的是某个特定对象。因此，我们把这种说法当作一种方便的简写。现在回到正题。承认 *A* 已经完成了“判断 *A* 存在”本该完成的全部工作：使人承担 *A* 存在的承诺。既然人不可能在不承认 *A* 的情况下判断 *A* 存在，那么判断 *A* 存在就必然是多余的。[^note-9] 于是，我们得到该论证的一个中间结论：
    step2: |-
