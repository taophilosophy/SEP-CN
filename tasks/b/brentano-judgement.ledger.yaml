      Much of that work which Brentano started in his *Psychology* remained unfinished. It was left to his students to further flesh out his view by drawing on lecture notes, letters, and unpublished material from Brentano’s *Nachlass*. Whether all the claims that have been ascribed to Brentano in this literature actually belong to his theory remains a matter of debate in the literature.[^note-1] From a contemporary perspective, an interesting question is which of the following two claims find support in Brentano’s theory:
    step1: |-
      布伦塔诺在《心理学》中开始的这项工作，大部分未及完成。进一步充实其观点的任务落到了他的学生身上：他们依据讲课笔记、书信以及布伦塔诺遗稿（Nachlass）中的未刊材料来做。这批文献中归于布伦塔诺名下的主张，是否全都真属于他的理论，在学界仍有争论。[^note-1] 从当代的眼光看，一个有趣的问题是：下面两项主张中，哪一项能在布伦塔诺的理论中得到支持：
