      For Brentano the starting point of a theory of judgement is our consciousness of our acceptance — in his terminology the acknowledgement (Annerkennung) — of our own mental acts and the objects of (outer) perception. From this starting point he tries to capture what seems to us to be a propositional attitude. As we will see in section 5 Brentano held (at least for a time) the view that a judgement that something is so-and-so supervenes on some acknowledgments.
    step1: |-
      对布伦塔诺来说，判断理论的出发点是：我们意识到自己对自身心理行为以及（外）知觉对象的接受——用他的术语说，即承认（Anerkennung）。他从这一出发点力图把握在我们看来属于命题态度的东西。我们将在第 5 节看到，布伦塔诺（至少在一段时期内）认为，某物如此这般的判断随附于某些承认之上。
    step2: |-
      对布伦塔诺而言，判断理论的出发点是：我们意识到自己对自身心理行为以及（外）知觉对象的接受——用他的术语说，即承认（Anerkennung）。他从这一出发点力图把握在我们看来属于命题态度的东西。我们将在第 5 节看到，布伦塔诺（至少有一段时间）主张：某物如此这般的判断，随附于某些承认之上。
