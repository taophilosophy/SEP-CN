      It takes a careful reading to fully appreciate the significance of Brentano’s change of mind. While the change is dramatic, it does not undermine Brentano’s theory completely. On the contrary. All of the following claims still remain in place: in perception we make simple existential judgements by affirming or rejecting an object that we perceive (PES 295 [II 164; SVS 1, 413]);[^note-24] categorical propositions can be equivalent with existential propositions (PES 298 [II 168; SVS 1, 416]; existential propositions can express concepts with a complex subject matter (ibid.). While these claims all remain unchanged, what Brentano gives up is the idea of uniformity in the realm of judgement. That is what Brentano’s anti-reduction turn comes to:
    step1: |-
      需要细心阅读，才能充分领会布伦塔诺这一思想转变的意义。转变固然剧烈，却并未彻底瓦解他的理论。恰恰相反。下述主张全都依然成立：在知觉中，我们通过肯定或拒绝所知觉的对象而作出简单的存在判断（PES 295 [II 164; SVS 1, 413]）；[^note-24] 直言命题可以与存在命题相等值（PES 298 [II 168; SVS 1, 416]）；存在命题可以表达具有复合主题的概念（同上）。这些主张都没有改变；布伦塔诺放弃的是判断领域中的统一性观念。他的反还原转向归结起来就是：
