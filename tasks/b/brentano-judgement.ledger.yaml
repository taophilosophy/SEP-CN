      The consequences of this move are indeed far reaching. Even when we predicate a property of an object, Brentano can say that the predication need not change the character of the *judgement* that we are making. One may conceive of predication as a two-step process: one first connects the property *P* with the subject *S*, thus forming a complex representation of an *S*-that-is-*P*; then one acknowledges the complex content and thus forms a judgement. The content is complex, but the judgement itself is the same simple act of acknowledgement.
    step1: |-
      这一举措的后果确实深远。即便当我们把某种性质述谓于对象时，布伦塔诺也可以说，述谓不必改变我们所作判断的性质。人们可以把述谓设想为一个两步过程：第一步把性质 *P* 与主词 *S* 联结起来，从而形成“是 *P* 的 *S*”这一复合表象；第二步承认这一复合内容，从而形成判断。内容是复合的，但判断本身仍是同一个简单的承认行为。
