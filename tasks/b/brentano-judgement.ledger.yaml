      Brentano acknowledges that “accepting as true” or “rejecting as false” is the natural way to describe an act of judgement (PES 201 [II 38; SVS 1, 223]). Meanwhile philosophers have changed their habits. While it is still true, of course, that judgements can be true or false, most philosophers are swayed by Frege’s or Reinach’s argument that all judgements are acceptances as true.[^note-7] When one rejects a proposition as false, e.g., that there is extraterrestrial life, this is still a positive judgement for them, because in making the judgement one takes it to be *true* that no life exists beyond earth. Brentano would contest this by saying that their point only concerns the linguistic expression of our judgements, not the judgements themselves. We can find for each judgement a sentence that is true if and only if the judgement expressed in it is correct, but that does not show that the judgement itself always has a positive quality.
    step1: |-
      布伦塔诺承认，“作为真来接受”或“作为假来拒绝”是描述判断行为的自然方式（PES 201 [II 38; SVS 1, 223]）。与此同时，哲学家们的习惯已经改变。当然，判断有真有假这一点仍然成立；但多数哲学家已被弗雷格或莱纳赫的论证所说服，认为一切判断都是作为真来接受。[^note-7] 当人们把某个命题作为假来拒绝时——例如“存在地外生命”——在他们看来这仍是一个肯定判断，因为作出该判断时，人认定“地球之外不存在生命”为真。布伦塔诺会反驳说：他们的论点只涉及我们判断的语言表达，而不涉及判断本身。我们能为每个判断找到一个句子，该句子为真当且仅当其中表达的判断正确；但这并不表明判断本身始终具有肯定的性质。
