      [^note-32]: A hint towards this possibility is made by Hillebrand in his elaboration of Brentano’s theory of judgement (see Hillebrand 1891: 99)[^hillebrand-1891]. Hillebrand claims that propositions of the A-form may be taken to be logically equivalent with a conjunction of two judgements: “There are *S* and there is no *S* that is not *P*”. Likewise, one might suggest that proposition of the E-form to be equivalent with a conjunction of two judgements: “There are *S* and there is no *S* that is *P*”. While Hillebrand thinks to have thereby shown that such propositions are capable of expressing double judgements, he does not explain how the two judgements might be psychologically conjoined. Something like the following would be required: “There are *S* and all of these *S* are *P*” and “There are *S* and none of these *S* are *P*”. But that leaves the terms “all” and “none” in these formulas unexplained. It therefore remains unclear that Hillebrand has shown, as he claims, how one can re-introduce with the help of the theory of double judgement the rule of subalternation as a valid principle of syllogistic logic (ibid.)
