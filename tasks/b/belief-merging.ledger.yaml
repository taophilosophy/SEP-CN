      The first point states that the distance is symmetric. Suppose there are three belief bases: $K_1 = K_3 = \{a, b, \neg c, d\}$ and $K_2 = \{\neg a, b, c, d\}$. If we denote by $\omega_i$ the interpretation of $K_i$, we have $\omega_1 = \omega_3 = (1,1,0,1)$ and $\omega_2 = (0,1,1,1)$. The first point requires that $d(\omega_1 ,\omega_2) = d(\omega_2 ,\omega_1)$. The second point states that if two interpretations are identical, the distance is 0, so $d(\omega_1 ,\omega_3) = 0$.[^note-2]
    step1: |-
      第一点陈述距离是对称的。设三个信念基：$K_1 = K_3 = \{a, b, \neg c, d\}$ 与 $K_2 = \{\neg a, b, c, d\}$。若以 $\omega_i$ 记 $K_i$ 的解释，我们有 $\omega_1 = \omega_3 = (1,1,0,1)$ 与 $\omega_2 = (0,1,1,1)$。第一点要求 $d(\omega_1 ,\omega_2) = d(\omega_2 ,\omega_1)$。第二点陈述：若两个解释相同，则距离为 0，故 $d(\omega_1 ,\omega_3) = 0$。[^note-2]
    step2: |-
      第一点说的就是距离的对称性。设有三个信念基：$K_1 = K_3 = \{a, b, \neg c, d\}$ 与 $K_2 = \{\neg a, b, c, d\}$。以 $\omega_i$ 记 $K_i$ 的解释，则 $\omega_1 = \omega_3 = (1,1,0,1)$、$\omega_2 = (0,1,1,1)$。第一点要求 $d(\omega_1 ,\omega_2) = d(\omega_2 ,\omega_1)$。第二点则说：两个解释若相同，距离即为 0，于是 $d(\omega_1 ,\omega_3) = 0$。[^note-2]
  - id: 70
