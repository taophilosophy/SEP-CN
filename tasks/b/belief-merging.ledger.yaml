      For the first step, we need to define the distance between an interpretation $\omega$ and a belief base *K*. This is the minimal distance between $\omega$ and the models of *K*. Formally: $d(\omega, K) = \mymin_{\omega'\in \mymod(K)} d(\omega, \omega')$. If *K* has more than one model (e.g., $K_i = \{a \vee b\}$ has three models: $\{(0,1) (1,0), (1,1)\}$), $\omega'$ will be the closest to $\omega$.
    step1: |-
      对第一步，我们须界定解释 $\omega$ 与信念基 *K* 之间的距离。这是 $\omega$ 与 *K* 的诸模型之间的最小距离。形式上：$d(\omega, K) = \mymin_{\omega'\in \mymod(K)} d(\omega, \omega')$。若 *K* 不止一个模型（例如 $K_i = \{a \vee b\}$ 有三个模型：$\{(0,1) (1,0), (1,1)\}$），$\omega'$ 将取离 $\omega$ 最近者。
    step2: |-
      第一步要界定的是解释 $\omega$ 与信念基 *K* 之间的距离，即 $\omega$ 到 *K* 诸模型的最短距离。形式写作：$d(\omega, K) = \mymin_{\omega'\in \mymod(K)} d(\omega, \omega')$。倘若 *K* 有两个以上模型（譬如 $K_i = \{a \vee b\}$ 便有 $\{(0,1) (1,0), (1,1)\}$ 三个模型），则 $\omega'$ 取距 $\omega$ 最近的那个。
  - id: 72
