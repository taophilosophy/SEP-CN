      > “The presentation of the sound and the presentation of the presentation of the sound form one single mental phenomenon; it is only by considering it in its relation to two different objects, one of which is a physical phenomenon and the other a mental phenomenon, that we divide it conceptually into two presentations. In the same mental phenomenon in which the sound is present to our minds we simultaneously apprehend the mental phenomenon itself. What is more, we apprehend it in accordance with its dual nature insofar as it has the sound as content within it, and insofar as it has itself as content at the same time.” (*PES*, 98) [“*Die Vorstellung des Tones und die Vorstellung von der Vorstellung des Tones bilden nicht mehr als ein einziges psychisches Phänomen, das wir nur, indem wir es in seiner Beziehung auf zwei verschiedene Objekte, deren eines ein physisches, und deren anderes ein psychisches Phänomen ist, betrachten, begrifflich in zwei Vorstellungen zergliederten. In demselben psychischen Phänomen, in welchem der Ton vorgestellt wird, erfassen wir zugleich das psychische Phänomen selbst, und zwar nach seiner doppelten Eigentümlichkeit, insofern es als Inhalt den Ton in sich hat, und insofern es zugleich sich selbst als Inhalt gegenwärtig ist.”* (*PES*, 179)]
    step1: |-
      > “声音的表象与声音的表象之表象，构成同一个心理现象；只有当我们把它放在与两个不同对象的关系中考察——其中一个对象是物理现象，另一个是心理现象——我们才在概念上把它分解为两个表象。在声音呈现于我们心灵的同一个心理现象中，我们同时把握到该心理现象本身。不仅如此，我们还按照它的双重特性来把握它：它把声音作为内容包含在自身之中，同时又把自身作为内容呈现出来。”（*PES*, 98）〔“*Die Vorstellung des Tones und die Vorstellung von der Vorstellung des Tones bilden nicht mehr als ein einziges psychisches Phänomen, das wir nur, indem wir es in seiner Beziehung auf zwei verschiedene Objekte, deren eines ein physisches, und deren anderes ein psychisches Phänomen ist, betrachten, begrifflich in zwei Vorstellungen zergliederten. In demselben psychischen Phänomen, in welchem der Ton vorgestellt wird, erfassen wir zugleich das psychische Phänomen selbst, und zwar nach seiner doppelten Eigentümlichkeit, insofern es als Inhalt den Ton in sich hat, und insofern es zugleich sich selbst als Inhalt gegenwärtig ist.*”（*PES*, 179）〕
