      Brentano’s early metaphysics, which is the result of his critical reading of Aristotle, is a form of conceptualism. He does distinguish between substance and accidents, but argues that both are but fictions *cum fundamentum in re*. With this, he wants to suggest that they do not have actual existence, but that we can make judgments about real things that are correct and contain references to substances and accidents. This view is closely connected to his epistemic notion of truth, according to which the question of whether a judgment is true does not depend on its corresponding to reality, but rather on whether it can be judged with evidence. Brentano elucidates the relation between a thing and its properties on the basis of the mereological notions of “logical part” and “metaphysical part,” the former of which account for abstract, repeatable properties, the latter for the concrete properties of a thing. Both are not considered to be denizens of reality in a narrow sense, but rather fictions that have a foundation in reality. (For a reconstruction and discussion of the details of Brentano’s early ontology, cf. Chrudzimski 2004)[^chrudzimski-2004].
    step1: |-
      布伦塔诺的早期形而上学是他批判性研读亚里士多德的结果，是一种概念论。他确实区分实体与偶性，但论证说二者都只是有实在根据的虚构（*cum fundamentum in re*）。借此他想表明：它们没有实际的实在性，但我们可以对实在事物作出正确的判断，其中包含对实体与偶性的指涉。这一观点与其认识论的真理观密切相关：一个判断是否为真，不取决于它是否符合实在，而取决于它是否能在明证中被判断。布伦塔诺以分体论的“逻辑部分”与“形而上学部分”概念来阐明一物与其性质之间的关系：前者说明抽象的、可重复的性质，后者说明事物的具体性质。二者都不被认为是狭义实在中的居民，而是在实在中有其根据的虚构。（关于布伦塔诺早期本体论的重建与细节讨论，参 Chrudzimski 2004）[^chrudzimski-2004]。
