      It has been suggested that Brentano’s fourth *Habilitations*-thesis makes him an advocate of a particular version of the unity of the sciences, according to which there is a unity of method (cf. Haller 1993, 27)[^haller-1993] and that it stands in contrast to “Dilthey’s view according to which the so-called *Geisteswissenschaften* or human or moral sciences would somehow call for a special method of ‘understanding’ or *Verstehen*, as opposed to the ‘explanation’ of the natural sciences.” (Smith 1994, 31)[^smith-1994]. One has to be cautious not to overstate this point, though. While it is true that Brentano uses both the terms “method” [*methodus*] and “natural science” [*scientiae naturarum*] in the singular, there is strong evidence that he had a minimal understanding of what this method should exactly consist in. He never suggested that all scientific disciplines could be reduced to other, more basic disciplines, nor did he argue that all natural sciences should apply exactly the same method, nor that mathematization or the use of a formal language was indispensable for scientificity. For Brentano, a method counts as scientific as long as it fulfills the minimal requirements of applying observation, description of facts, and induction. The specific methodological procedures applied in a given scientific discipline depend first and foremost on the objects studied:
    step1: |-
      有人提出，布伦塔诺的第四条教授资格论纲使他成为某种版本的科学统一论的拥护者，即主张方法的统一（参 Haller 1993, 27）[^haller-1993]；并且这一论纲与“狄尔泰的观点”形成对照——按狄尔泰，所谓精神科学（Geisteswissenschaften），即人文或道德科学，似乎需要一种特殊的“理解”（Verstehen）方法，而与自然科学的“说明”相对（Smith 1994, 31）[^smith-1994]。不过，人们须谨慎，不要夸大这一点。布伦塔诺确实把“方法”〔*methodus*〕与“自然科学”〔*scientiae naturarum*〕二词都用单数，但有强有力的证据表明，他对这一方法究竟应包括什么持一种极简的理解。他从未主张一切科学学科都可还原为其他更基础的学科，也未曾论证一切自然科学都应采用完全相同的方法，更未说过数学化或使用形式语言是科学性的必要条件。对布伦塔诺而言，一种方法只要满足观察、事实描述与归纳这些最低要求，就算科学的。某一科学学科所采用的具体方法程序，首先取决于所研究的对象：
