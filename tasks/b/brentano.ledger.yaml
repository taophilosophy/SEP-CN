    kind: body
    source: |-
      There are notable exceptions to this tendency, though. Roderick Chisholm, for example, made a continuous effort to show Brentano’s significance to contemporary philosophy by adopting his results in his own contributions to the philosophy of mind, but also in presentations of various aspects of Brentano’s thought (cf. Chisholm 1966, 1982, and 1986)[^chisholm-1966]. Moreover, in recent decades the tradition that is often referred to as “Austrian philosophy” has gained increasing interest in a broader philosophical audience, which is due mainly to the work of Rudolf Haller, Barry Smith, Peter Simons, and Kevin Mulligan, among others. By showing the systematic relevance of Brentano’s (and other Austrian philosophers’) contributions to problems discussed in ontology, logic, the theory of emotions, or consciousness, they could counteract the tendency to reduce Brentano’s contributions to the introduction of the notion of intentionality.
    step1: |-
      不过，也有值得注意的例外。例如，罗德里克·齐硕姆持续努力表明布伦塔诺对当代哲学的重要性：他在自己心灵哲学的贡献中采纳布伦塔诺的成果，也从多个方面介绍布伦塔诺的思想（参 Chisholm 1966, 1982, 1986）[^chisholm-1966]。此外，近几十年来，常被称为“奥地利哲学”的传统在更广的哲学听众中日益受到关注，这主要归功于鲁道夫·哈勒、巴里·史密斯、彼得·西蒙斯与凯文·马利甘等人的工作。通过展示布伦塔诺（及其他奥地利哲学家）的贡献对本体论、逻辑学、情感理论或意识中所讨论问题的系统意义，他们得以抵制把布伦塔诺的贡献仅归结为引入意向性概念的趋势。
