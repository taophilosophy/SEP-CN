      Other interprets have taken more cautious lines. Mark Textor (2006), for example, has stressed the ties between Brentano’s notion of secondary consciousness and his thesis of the unity of consciousness. A mental phenomenon, according to Textor’s interpretation of Brentano’s theory, does not become conscious by representing itself, but rather by its being *unified* or fused with an immediately evident cognition of it. Dan Zahavi, on the other hand, has insisted that Brentano does distinguish two levels of perception, which sheds doubts on the one-level interpretation: “It could be argued that Brentano’s claim that every conscious intentional state takes two objects, a primary (external) object and secondary (internal) object, remains committed to a higher-order account of consciousness; it simply postulates it as being implicitly contained in every conscious state” (Zahavi, 2006, 5). In short, Brentano’s distinction between primary and secondary consciousness “introduces some kind of level-distinction into the structure of experience” (Brandl 2013, 61)[^brandl-2013] but does not conceive of higher-perception as a full-fledged mental phenomenon at its own, which is why Brandl has recently proposed to regard it a ‘one-and-a-half-level theory’ (Brandl 2013, 61f)[^brandl-2013].
    step1: |-
      其他解释者则采取更谨慎的路线。例如，Mark Textor（2006）强调布伦塔诺的次要意识概念与其意识统一性论旨之间的联系。按照 Textor 对布伦塔诺理论的解读，一个心理现象之所以成为有意识的，并不是靠表象自身，而是靠它与一种关于自身的直接明证的认知统一或融合。另一方面，Dan Zahavi 坚持认为布伦塔诺确实区分了两个层次的知觉，这使得单层解读令人生疑：“可以论证，布伦塔诺关于每个有意识的意向状态都取两个对象——一个（外在的）主要对象与一个（内在的）次要对象——的主张，仍然忠于一种更高阶的意识理论；它只是把这一点设定为隐含于每个有意识状态之中”（Zahavi, 2006, 5）。简言之，布伦塔诺对主要意识与次要意识的区分“把某种层次区分引入了经验的结构”（Brandl 2013, 61）[^brandl-2013]，但并不把更高阶知觉设想为一个独立自足的完整心理现象——因此 Brandl 最近提议把它视为一种“一层半理论”（Brandl 2013, 61f）[^brandl-2013]。
