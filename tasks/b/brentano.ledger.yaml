      Accordingly, a number of recent interpreters have suggested that Brentano was an advocate of a one-level account of consciousness: “Since the features that make an act conscious are firmly located within the act itself rather than bestowed on it by a second act, this locates Brentano’s view as a one-level view of consciousness” (Thomasson, 2000, 192). This reading has given place to neo-Brentanian theories such as Thomasson’s adverbial account (cf. Thomasson 2000)[^thomasson-2000] or self-representational approaches (cf., for example, Kriegel 2003a, b)[^kriegel-2003a] that build on the thesis that “every conscious state has a dual representational content. Its main content is the normal content commonly attributed to mental representations. But it also has a (rather peripheral) special content, namely, its own occurrence” (Kriegel 2003a, 480)[^kriegel-2003a], which they take as Brentano’s central thesis. Moreover, Kriegel suggests that for Brentano this self-representational aspect is a necessary condition for having a presentation (Kriegel 2013)[^kriegel-2013].
    step1: |-
      据此，若干晚近解释者提出，布伦塔诺主张的是一种单层意识理论：“由于使一个行为成为有意识的那些特征牢固地坐落于行为自身之中，而不是由第二个行为授予它，这就把布伦塔诺的观点定位为一种单层的意识观”（Thomasson, 2000, 192）。这一解读催生了新布伦塔诺式理论，如 Thomasson 的状语理论（参 Thomasson 2000）[^thomasson-2000] 或自我表征进路（参例如 Kriegel 2003a, b）[^kriegel-2003a]；后者的依据是如下论旨：“每一个有意识状态都有双重的表征内容。其主要内容是通常归于心理表征的常规内容。但它还有一个（相当边缘的）特殊内容，即它自身的发生”（Kriegel 2003a, 480）[^kriegel-2003a]——他们把这当作布伦塔诺的核心论旨。此外，Kriegel 提出，对布伦塔诺而言，这种自我表征的方面是拥有一个表象的必要条件（Kriegel 2013）[^kriegel-2013]。
