      In his late philosophy, from 1904 on, Brentano rediscovers the virtue of ontological parsimony and takes up the main insights of his conceptualist period, developing (and radicalizing) them to a form of reism, according to which the only items that exist are individual things (*res*). “While young Brentano tried to ontologically play down certain ways of speaking, late Brentano tried to eliminate them from philosophical discourse” (Chrudzimski 2004, 177)[^chrudzimski-2004] [my translation. “*Der junge Brentano versuchte gewisse Redeweisen ontologisch zu*bagatellisieren*, der späte Brentano versuchte sie aus dem philosophischen Diskurs zu eliminieren”*] . He abandons the notion of *irrealia*, which he now regards as linguistic fictions, and continues to deny the existence of universals or abstract entities. Instead, he conceives both substances and accidents as real things that are related to one another by a particular mereological relation: an accident does not only ontologically depend on the substance, it also contains the substance as a part without, however, containing any supplementary part. A white table, accordingly, is an accident that contains the table as a part. If we were to paint it red, the white table would cease to exist and the red table would come into existence – the continuity between the two being guaranteed by the table, which was part of the white table and is now part of the red table.
    step1: |-
      在其晚期哲学中（1904 年起），布伦塔诺重新发现了本体论节俭的德性，并接续其概念论时期的主要洞见，将其发展（并激进化）为一种实物论（reism）：唯一存在的东西是个别事物（*res*）。“青年布伦塔诺试图在本体论上淡化某些说话方式，而晚期布伦塔诺试图把它们从哲学话语中消除”（Chrudzimski 2004, 177）[^chrudzimski-2004]〔拙译。“*Der junge Brentano versuchte gewisse Redeweisen ontologisch zu bagatellisieren, der späte Brentano versuchte sie aus dem philosophischen Diskurs zu eliminieren*”〕。他放弃了非实在物的概念——此时他视之为语言虚构——并继续否认共相或抽象实体的存在。相反，他把实体与偶性都设想为通过一种特殊分体关系相互关联的实在事物：偶性不仅在存在论上依赖实体，还把实体作为一个部分包含在内，而不包含任何补充部分。因此，一张白色的桌子是一个包含桌子作为部分的偶性。如果我们把它漆成红色，白桌就不复存在，红桌随之产生——二者之间的连续性由桌子保证，它曾是白桌的部分，如今是红桌的部分。
    step2: |-
