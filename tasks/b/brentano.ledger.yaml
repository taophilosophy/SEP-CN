      Brentano’s reflections on time-consciousness illustrate very well his way of doing philosophy, but also the way in which his views have had an influence on others. As Oskar Kraus notes in his *Recollections* (cf. Kraus 1919, 39)[^kraus-1919], Brentano has vividly engaged with the problem of time and the origins of time consciousness throughout his life. He presented it several times to students in class and discussed i in letters with colleagues at different moments in time. He never presented a systematic exposition of his views in publication, though. As a result, Brentano’s views on the topic were very dynamic, as he did not hesitate to revise them when he encountered problems or when changes in other parts of his overall theory made it necessary. As he never published a systematic statement of his views on time-consciousness, interested scholars could learn about it only from the expositions of Brentano’s students like Carl Stumpf, Anton Marty, and in particular Edmund Husserl who, however, used Brentano’s views as departing point for their own reflections, very often in an attempt to overcome the difficulties inherent to the version of Brentano’s theory they were acquainted with. Brentano’s own views were, thus, very influential, but risked to become eclipsed by the contributions of his students, who further developed them.
    step1: |-
      布伦塔诺对时间意识的思考很好地说明了他从事哲学的方式，也说明了他的观点如何影响他人。正如奥斯卡·克劳斯在《回忆录》中所指出的（参 Kraus 1919, 39）[^kraus-1919]，布伦塔诺一生都在热烈地处理时间与时间意识起源的问题。他多次在课堂上向学生讲授，并在不同时期与同行通信讨论。但他从未在出版物中系统阐述自己的观点。结果，布伦塔诺关于这一主题的观点非常动态，因为他在遇到问题、或整体理论其他部分的变化使其必要时，会毫不犹豫地修改它们。由于他从未发表关于时间意识的系统陈述，感兴趣的学者只能从布伦塔诺的学生——如卡尔·斯图姆夫、安东·马蒂，尤其是埃德蒙德·胡塞尔——的阐述中了解它；然而这些学生常常把布伦塔诺的观点当作自己思考的出发点，往往是为了克服他们所熟悉的那一版本布伦塔诺理论的内在困难。因此，布伦塔诺本人的观点影响很大，却有被其学生进一步发展这些观点的贡献所掩盖之虞。
