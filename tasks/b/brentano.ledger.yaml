      Brentano’s ontology is known to a broader audience only through posthumously published works that were edited by his late students Oskar Kraus and Alfred Kastil, who considered his late position most important and accordingly put less emphasis on Brentano’s earlier phases. Only recently the development of Brentano’s views on ontology has gained more attention, mainly through the work of scholars who were able to study unpublished manuscripts in the archives (cf., for example, Chrudzimski 2004)[^chrudzimski-2004]. This underlines once more the need of a critical edition of Brentano’s entire *Nachlass*, which would make it possible for a broader audience to critically assess the development of Brentano’s views in ontology.
    step1: |-
      布伦塔诺的本体论为更广大的读者所知，只是通过由其晚学生奥斯卡·克劳斯与阿尔弗雷德·卡斯蒂尔编辑、在他身后出版的著作；这两位认为他的晚期立场最为重要，因此较少强调布伦塔诺的早期阶段。直到最近，布伦塔诺本体论观点的发展才受到更多关注，这主要归功于得以研究档案中未刊手稿的学者们的工作（参例如 Chrudzimski 2004）[^chrudzimski-2004]。这再次表明，亟需一部布伦塔诺全部遗稿的校勘版，以便更广大的读者能批判性地评估其本体论观点的发展。
