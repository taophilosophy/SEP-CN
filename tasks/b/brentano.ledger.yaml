      由此，布伦塔诺否认存在无意识的​​心理行为：既然每一个心理行为都附带地指向自身作为次要对象，我们就自动意识到每一个发生的心理行为。不过，他承认我们会有强度各异的心理行为。此外，他认为，对象被表象的强度，等于次要对象即行为本身被表象的强度。因此，如果我们有一个强度很低的心理行为，我们对它的内知觉，或如他所说，我们对它的次要意识，也会具有很低的强度。布伦塔诺由此断定：有时我们倾向于说自己有过一个无意识的​​心理现象，而实际上我们有过的是一个强度极低的有意识的​​心理现象。
