      Even though Brentano’s views on ethics and aesthetics are somewhat sketchy and not worked out in detail, we can note that his treatment of the three practical disciplines of logics, ethics, and aesthetics are unified by a common principle: the idea that judgments or emotions not only can be positive or negative, they can also be fitting or appropriate to their object. Moreover, by tying the three disciplines to his tripartition of mental phenomena (presentations, judgments, emotions), he also assigns them an exact collocation in his overall philosophical system. For these reasons, recent commentators have insisted in the systematicity of Brentano’s philosophy, arguing that he “was the last philosopher to have offered a system in the sense of a structurally unified account of the true, the good, and the beautiful.” (Kriegel 2017a, 29)[^kriegel-2017a]. Kriegel acknowledges, however, that “Brentano was not a systematic writer” (*ibid.*, 21). This shows in the fact that Brentano saw his task mainly in sketching the basic views on aesthetics and ethics in lectures, but never presented a longer or systematic treatise of these topics, which can be explained by his conviction that science was a collective enterprise and by his aversion of the cult of the genius that was widespread in his times. Brentano probably hoped that others would continue to work out the details within the parameters he had set. We know about his views on aesthetics and ethics only from lecture notes that have been cut, revised, and amended by his students, who typically did not bother to document their substantial editorial changes in the published text. Moreover, Brentano never presented his philosophical position as a system, probably because he did not want to be associated with German system philosophers of the early and mid-nineteenth century. Thus, the claim that Brentano was a system-philosopher is somewhat questionable, though he definitely was a systematic thinker in the sense that he always kept the overall picture in mind when working on a specific problem.
    step1: |-
      尽管布伦塔诺关于伦理学与美学的看法比较粗略、未及细究，我们仍可注意到：他对逻辑学、伦理学与美学三门实践学科的处理，被一条共同原则统一起来，即判断或情感不仅可以是肯定或否定的，也可以与其对象相称或恰当。此外，通过把三门学科与他的心理现象三分（表象、判断、情感）对应起来，他还为它们在其整体哲学体系中安排了确切的位置。因此，晚近的评论者坚持布伦塔诺哲学的系统性，论证说“他是最后一位提供了体系——即对真、善、美作结构性统一说明——的哲学家”（Kriegel 2017a, 29）[^kriegel-2017a]。不过 Kriegel 承认，“布伦塔诺不是一个系统性的写作者”（同上，21）。这一点体现为：布伦塔诺把他的任务主要看作在讲演中勾勒美学与伦理学的基本观点，而从未就这些主题写出较长或系统的论著；这可以由他的信念——科学是一项集体事业——以及他对当时盛行的天才崇拜的反感来解释。布伦塔诺大概希望他人在他所设定的框架内继续完成细节。我们对其美学与伦理学观点的了解，只来自经其学生删改、修订与增补的讲稿；这些学生通常懒得在出版文本中记录他们实质性的编辑改动。此外，布伦塔诺从未把他的哲学立场呈现为一个体系，这大概是因为他不想与十九世纪早中期的德国体系哲学家为伍。因此，说布伦塔诺是体系哲学家，颇可怀疑；尽管他确实是一位系统性的思想家——始终心怀整体图景来处理具体问题。
