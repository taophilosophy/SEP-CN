      Brentano’s contributions to philosophy were widely discussed among philosophers and psychologists at the end of the nineteenth and the beginning of the twentieth century. Moreover, he had a strong impact on an impressive number of students who became famous philosophers on their own right. Often, these philosophers are referred to as the “School of Franz Brentano,” (cf. Albertazzi e.al. 1996)[^albertazzi-1996] in order to underline that all of them drew explicitly (and when not explicitly, then recognizably) on Brentano’s work. All members of the school have become acquainted with Brentano’s philosophy in his lectures or through conversation or correspondence with him, but they form a quite heterogeneous group that did not make attempts to jointly develop a shared position: there was no general acceptance of a specific unifying doctrine of the “School”, nor did its members make attempts to unite forces and cooperate on specific projects. What unites the School is a vivid interests in the topics that Brentano discussed in his lectures, first and foremost in psychology and in the idea that philosophy should adopt a rigorous, scientific method (cf. Dewalque 2017a, b)[^dewalque-2017a]. In fact, it was Brentano’s methodological maxim that has raised the interest in most members of the school in the first place, cf., for example, Stumpf (1919) and Husserl (1919), both of who suggest that Brentano’s conception of philosophy as a rigorous science had a decisive impact on their decision to pursue a professional career in philosophy.
    step1: |-
      布伦塔诺对哲学的贡献在十九世纪末、二十世纪初的哲学家与心理学家中得到广泛讨论。此外，他对一大批学生产生了强烈影响，这些学生后来都成为独当一面的著名哲学家。这些哲学家常被称为“布伦塔诺学派”（参 Albertazzi 等 1996）[^albertazzi-1996]，以强调他们都明确地（或至少可以辨认地）取资于布伦塔诺的工作。学派的全部成员都是在布伦塔诺的讲演中、或通过与他交谈、通信而了解其哲学的；但他们构成一个相当异质的群体，并未尝试共同发展一个共享的立场：对“学派”的具体统一学说没有普遍接受，成员们也未尝试联合力量、在具体项目上合作。把学派统一起来的，是对布伦塔诺讲演所论题目的浓厚兴趣，首先是心理学，以及“哲学应当采取严格科学方法”的观念（参 Dewalque 2017a, b）[^dewalque-2017a]。事实上，首先引起学派大多数成员兴趣的，正是布伦塔诺的方法论格言；参例如 Stumpf（1919）与 Husserl（1919），两人都指出，布伦塔诺“作为严格科学的哲学”构想对他们决定以哲学为职业起了决定性影响。
