      Brentano has reflected on time consciousness throughout his life, but has never given a systematic exposition of his position that would give it a static form. Rather, he has changed his position several times, often to accommodate it to changes in his overall views. Based on the testimonies of his students and manuscripts contained in the *Nachlass*, we can distinguish different phases of Brentano’s views on time-consciousness (cf. Fréchette 2017)[^fréchette-2017].
    step1: |-
