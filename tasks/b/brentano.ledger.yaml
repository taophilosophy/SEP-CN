      Brentano has presented his model to a larger audience quite late in his life, but he had come up with it very early in his career; Carl Stumpf reports that Brentano first came up with this idea in 1860 and that he used it in his lectures on the history of philosophy already in Würzburg in the mid-sixties (cf. Stumpf 1919, 89f)[^stumpf-1919]. While both the historical accuracy of and the principles of cultural psychology that gave rise to the model can be put in question (cf. Gilson 1976)[^gilson-1976], it definitely tells the reader much about Brentano’s conception of philosophy and his vivid interest in its history. Brentano’s short text can, thus, best be read as a simplifying narrative that allows the author to explain his conviction that philosophy ought to pursue of pure, theoretical interests and to express his fascination for philosophers like Aristotle, Thomas, or Descartes as well as his dislike of Plotinus, Nicolas of Cues, Kant, Hegel, and Schelling.
    step1: |-
      布伦塔诺在晚年才把他的模型呈现给更大的听众，但他在职业生涯很早时就提出了它。卡尔·斯图姆夫报告说，布伦塔诺在 1860 年第一次产生这一想法，并早在 1860 年代中期在维尔茨堡的哲学史讲演中使用它（参 Stumpf 1919, 89f）[^stumpf-1919]。尽管这一模型的历史准确性以及引发它的文化心理学原理都可以受到质疑（参 Gilson 1976）[^gilson-1976]，它无疑向读者说明了许多关于布伦塔诺的哲学构想及其对哲学史的浓厚兴趣。因此，布伦塔诺的短文最好读作一种简化叙事，作者借此解释他的信念——哲学应当追求纯粹的、理论的兴趣——并表达他对亚里士多德、托马斯、笛卡尔等哲学家的着迷，以及他对普罗提诺、库萨的尼古拉、康德、黑格尔与谢林的反感。
