      Brentano’s initial formulation of the intentionality-thesis does not address these problems concerning the ontological status of the intentional object. The first attempt of Brentano’s students to overcome these difficulties was made by Twardowski, who distinguished between content and object of the act, the former of which is immanent to the act, the latter not (cf. Twardowski 1977)[^twardowski-1977]. This distinction strongly influenced other members of the Brentano School, mainly the two students for who the notion of intentionality had the most central place, Meinong and Husserl.
