    kind: body
    source: |-
      It is quite interesting to note, however, that in the last two decades the philosophical contributions of Brentano have gained a new life as an increasing number of philosophers from different fields are rediscovering and elaborating on different themes from Brentano’s work. His contributions to the philosophy of mind have been taken up and play a central role in the debate concerning the nature of consciousness and the relation between consciousness and intentionality, the unity of consciousness and time-consciousness; his views on ethics have been inspired fitting attitude theories of value, which analyze ethical value in terms of correct or incorrect forms of approval or disapproval. Moreover, the recent centenary of Brentano’s death (2017) has given occasion to a number of conferences and publications that put Brentano’s contribution at the center of attention (cf., for example, Kriegel 2017)[^kriegel-2017]. This shows that the interest in Brentano’s systematic contribution to philosophy is still strong and vivid.
    step1: |-
      然而，颇为有趣的是，在过去二十年，布伦塔诺的哲学贡献获得了新的生命：越来越多的不同领域的哲学家重新发现并阐发布伦塔诺著作中的不同主题。他对心灵哲学的贡献被重新接续，并在关于意识本性、意识与意向性关系、意识统一性与时间意识的争论中起核心作用；他的伦理学观点启发了价值的恰当态度理论，后者以赞成或不赞成的正确或不正确形式来分析伦理价值。此外，布伦塔诺去世百年（2017）为一系列会议与出版物提供了契机，把布伦塔诺的贡献置于关注的中心（参例如 Kriegel 2017）[^kriegel-2017]。这表明，对布伦塔诺哲学系统贡献的兴趣依然强烈而鲜活。
    step2: |-
