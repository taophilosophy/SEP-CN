      Logic, according to Brentano, is the practical discipline that is concerned with judgments; i.e. with the class of mental phenomena in which we take a positive or a negative stance towards the (existence of the) object by affirming or denying it. In addition, judgments are correct or not; they have a truth-value. According to Brentano, a judgment is true when it is evident, i.e., when one perceives (in inner perception that is directed towards the judgment) that one judges with evidence. Brentano, thus, rejects the correspondence theory of truth, suggesting that “a person judges truly, if and only if, his judgment agrees with the judgment he would make if we were to judge with evidence” (Chisholm 1986, 38)[^chisholm-1986]. Notwithstanding this dependence on the notion of judgment, however, truth, for Brentano, is not a subjective notion: if one person affirms an object and another person denies the same object, only one of them judges correctly. (For a more detailed discussion of Brentano’s contributions to logic, cf. the entry Brentano’s Theory of Judgement.)
    step1: |-
      按照布伦塔诺，逻辑学是关涉判断的实践学科，即关涉我们在其中通过肯定或否定而对（对象的）存在采取肯定或否定立场的心理现象类别。此外，判断有正确与不正确之分；它们有真值。按照布伦塔诺，当判断是明证的时，它就是真的，也就是说，当人（在指向该判断的内知觉中）知觉到自己在明证中判断时。因此，布伦塔诺拒斥真理符合论，提出“一个人判断为真，当且仅当他的判断与我们在明证中判断时他会作出的判断相一致”（Chisholm 1986, 38）[^chisholm-1986]。然而，尽管有这种对判断概念的依赖，对布伦塔诺而言，真理不是主观概念：如果一个人肯定某对象，另一个人否定同一对象，那么只有其中一人判断正确。（关于布伦塔诺对逻辑学贡献的更详细讨论，参“布伦塔诺的判断理论”词条。）
