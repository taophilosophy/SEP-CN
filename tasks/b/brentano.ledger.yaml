      Moreover, his conception of secondary consciousness, in combination with this thesis of the unity of consciousness have had a strong echo in the philosophy of mind, in particular in the recent debate concerning the nature of consciousness. It has been suggested that Brentano’s notion of secondary consciousness (i.e., the thesis that every mental phenomenon is incidentally directed also towards itself as a secondary object) can provide the means to overcome higher-order theories of consciousness that have been widely discussed in the late twentieth century. In this debate, the exact reading of Brentano’s thesis was often at stake. Some philosophers have suggested that Brentano’s view, according to which every mental phenomenon is object of inner perception, was an early expression of a higher-order perception theory of consciousness (cf., for example, Güzeldere 1997, 789)[^güzeldere-1997]. This interpretation, however, does not pay due attention to the fact that according to Brentano, inner perception is not a self-standing mental phenomenon of a higher level, but rather a structural moment of *every* mental phenomenon. Moreover, with his unity of consciousness thesis Brentano explicitly rejects the basic assumption of all higher-order perception theories of consciousness, i.e., the idea that we can have two mental phenomena (of distinct levels) at the same time, one of them being directed towards the other: higher-order perception theories postulate what Brentano calls ‘inner observation’ (as opposed to inner perception), which according to him was impossible, as we have seen above.
    step1: |-
      此外，他的次要意识构想与意识统一性论旨合在一起，在心灵哲学中引起了强烈反响，特别是在晚近关于意识本性的争论中。有人提出，布伦塔诺的次要意识概念（即每个心理现象都附带地也指向自身作为次要对象这一论旨）可以提供手段，来克服二十世纪晚期广泛讨论的更高阶意识理论。在这场争论中，布伦塔诺论旨的确切读法常成为焦点。一些哲学家提出，布伦塔诺关于每个心理现象都是内知觉对象的看法，是更高阶知觉意识理论的一种早期表达（参例如 Güzeldere 1997, 789）[^güzeldere-1997]。然而，这一解释没有充分注意一个事实：按照布伦塔诺，内知觉并不是一个独立自足的更高层心理现象，而毋宁说是每一个心理现象的结构性环节。此外，借助其意识统一性论旨，布伦塔诺明确拒斥一切更高阶知觉意识理论的基本假定，即我们能在同一时刻拥有两个（不同层次的）心理现象、其中一个指向另一个：更高阶知觉理论设定了布伦塔诺所谓“内观察”（以区别于内知觉），而如上文所见，他认为内观察是不可能的。
