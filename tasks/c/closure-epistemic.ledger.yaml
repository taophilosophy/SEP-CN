      ### 5.3 Safe Indication and Skepticism
    step1: TBD
    step2: TBD
  - id: 175
    kind: body
    source: |-
      Advocates of the safe indication theory accept the gist of the tracking theorist explanation of the appeal of skepticism but retain the principle of closure. One reason skepticism tempts us is that we tend to confuse CR with SI (Sosa 1999, Luper 1984, 1987c, 2003a)[^luper-1984][^sosa-1999]. After all, CR—if *p* were false, *R* would not hold—closely resembles SI—*R* would hold only if *p* were true. When we run the two together, we sometimes apply CR and conclude that we do not know that skeptical scenarios do not hold. Then we shift back to the safe indication account, and go along with skeptics when they appeal to the principle of entailment, which is sustained by the safe indication account, and conclude that ordinary knowledge claims are false. But, as Moore claimed, skeptics are wrong when they say we do not know that skeptical hypotheses are false. Roughly, we know skeptical possibilities do not hold since (given our circumstances) they are remote.
    step1: TBD
    step2: TBD
  - id: 176
    kind: body
    source: |-
      Skepticism might also result from the assumption that, if a belief formation method *M* were, in some situation, to yield a belief without enabling us to know the truth of that belief, then it cannot ever generate bona fide knowledge (of that sort of belief), no matter what circumstances it is used in. (*M* must be strengthened somehow, say with a supplemental method, or with evidence about the circumstances at hand, if knowledge is to be procured.) This assumption might rest on the idea that any belief *M* yields is, at best, accidentally correct, if in any circumstances *M* yields a false or an accidentally correct belief (Luper 1987b,c)[^luper-1987b]. On this assumption, we can rule out a method of belief formation *M* as a source of knowledge merely by sketching circumstances in which *M* yields a belief that is false or accidentally correct. Traditional skeptical scenarios suffice; so do Gettieresque situations. Externalist theorists reject the assumption, saying that *M* can generate knowledge when used in circumstances under which the belief it yields is not accidentally correct. In highly Gettierized circumstances *M* must put us in an especially strong epistemic position if *M* is to generate knowledge; in ordinary circumstances, less exacting methods can produce knowledge. The standards a method must meet to produce knowledge depend on the context in which it is used. This view, on which the requirements for a subject or agent *S* to know *p* vary with *S*’s context (e.g., how exacting *S*’s method of belief formation must be to yield knowledge depend on *S*’s circumstances), might be called *agent-centered* (or *subject*) *contextualism*. Both tracking theorists and safe indication theorists defend agent-centered contextualism.
    step1: TBD
    step2: TBD
  - id: 177
    kind: body
    source: |-
      ### 5.4 Contextualism and Skepticism
    step1: TBD
    step2: TBD
  - id: 178
    kind: body
    source: |-
      Theorists writing under the label “contextualism,” such as David Lewis (1979, 1996), Stewart Cohen (1988, 1999), and Keith DeRose (1995), offer a related way of explaining skepticism without denying closure. For clarity, we might call them *speaker*-centered (or *attributor*) contextualists since they contrast their view with agent-centered contextualism. According to (speaker-centered) contextualists, whether it is correct for a *judge* to attribute knowledge to someone depends on that *judge’s* context, and the standards for knowledge differ from context to context. When the man on the street judges knowledge, the applicable standards are relatively modest. But an epistemologist takes all sorts of possibilities seriously that are ignored by ordinary folk, and so must apply quite stringent standards in order to reach correct assessments. What passes for knowledge in ordinary contexts does not qualify for knowledge in contexts where heightened criteria apply. Skepticism is explained by the fact that the contextual variation of epistemic standards is easily overlooked. Skeptics note that in the epistemic context it is inappropriate to grant anyone knowledge. However, skeptics assume—falsely—that what goes in the epistemic context goes in all contexts. They assume that since those who take skepticism seriously must deny anyone knowledge, then everyone, regardless of context, should deny anyone knowledge. Yet people in ordinary contexts are perfectly correct in claiming that they know all sorts of things.
    step1: TBD
    step2: TBD
  - id: 179
    kind: body
    source: |-
      Furthermore, the closure principle is correct, contextualists say, so long as it is understood to operate within given contexts, not across contexts. That is, so long as we stay within a given context, we know the things we deduce from other things we know. But if I am in an ordinary context, knowing I am in San Antonio, I cannot come to know, via deduction, that I am not a brain in a vat on a distant planet, since the moment I take that skeptical possibility seriously, I transform my context into one in which heightened epistemic standards apply. When I take the vat possibility seriously, I must wield demanding standards that rule out my knowing I am not a brain in a vat. By the same token, these standards preclude my knowing I am in San Antonio. Thinking seriously about knowledge undermines our knowledge.
    step1: TBD
    step2: TBD
