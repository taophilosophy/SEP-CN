    source: |-
      Another anticlosure argument is that there are some sorts of propositions we cannot know unless perhaps we take extraordinary measures, yet such propositions are entailed by mundane claims whose truth we do know. Since this would be impossible if K were correct, K must be false. The same difficulty is sometimes discussed under the heading *problem of easy knowledge*, since some theorists (Cohen 2002)[^cohen-2002] believe that certain things are difficult to know, in the sense that they cannot be known by deduction from banal knowledge. The argument has different versions depending on which propositions are said to be hard knowledge. According to Dretske (and perhaps Nozick as well), we cannot easily know that *limiting propositions* or *heavyweight propositions* are true. These resemble propositions Moore (1959) considered certainly true and that Wittgenstein (1969) declared to be unknowable (but Wittgenstein considered them unknowable on the dubious grounds that they must be true if we are to entertain doubts). Another possibility is that we cannot easily know *lottery propositions*. A special case of the argument from unknowable propositions starts with the claim that we cannot know the falsity of skeptical hypotheses. We will consider this third view in the next section.
    step1: |-
      另一个反闭合论证说：有些命题，除非采取非常手段，我们无法知道；然而这类命题却由我们确知其真的平常断言所蕴涵。若 K 正确，这就不可能，所以 K 必假。同一困难有时在“轻易知识问题”这一标题下讨论，因为一些理论家（科恩 2002）[^cohen-2002] 相信某些事难以知道，意思是它们无法由平庸知识演绎得知。该论证有不同版本，取决于哪些命题被说成难以知道。按德雷茨克（也许还有诺齐克），我们无法轻易知道 *限定性命题* 或 *重量级命题* 为真。这类命题类似于摩尔（1959）视为确定真、而维特根斯坦（1969）宣称不可知的命题（但维特根斯坦判其不可知的理由可疑：若我们要提出怀疑，它们就必须为真）。另一种可能是，我们无法轻易知道 *彩票命题*。不可知命题论证有一个特例，其出发点是：我们无法知道怀疑论假设为假。这一第三观点将在下一节讨论。
    step2: |-
      另一个反闭合论证说：有些命题，除非采取非常手段，我们无法知道；然而这类命题却由我们确知其真的平常断言所蕴涵。若 K 正确，这就不可能，所以 K 必假。同一困难有时在“轻易知识问题”这一标题下讨论，因为一些理论家（科恩 2002）[^cohen-2002] 相信某些事难以知道，意思是它们无法由平庸知识演绎得知。该论证有不同版本，取决于哪些命题被说成难以知道。按德雷茨克（也许还有诺齐克），我们无法轻易知道 *限定性命题* 或 *重量级命题* 为真。这类命题类似于摩尔（1959）视为确定真、而维特根斯坦（1969）宣称不可知的命题（但维特根斯坦判其不可知的理由可疑：若我们要提出怀疑，它们就必须为真）。另一种可能是，我们无法轻易知道 *彩票命题*。不可知命题论证有一个特例，其出发点是：我们无法知道怀疑论假设为假。这一第三观点将在下一节讨论。
