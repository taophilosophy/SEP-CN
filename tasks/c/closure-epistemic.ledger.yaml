  - id: 196
    kind: body
    source: |-
      **(JP)**
    step1: TBD
    step2: TBD
  - id: 197
    kind: body
    source: |-
      If *p* is propositionally justified for *S*, and *p* entails *q*, then *q* is propositionally justified for *S*.
    step1: TBD
