      SI requires that *p* be true in the nearby *R* worlds. When *R* meets this condition, let us say that *R* is a *safe indicator* that *p* is true. (Different versions of the safety condition have been defended; see, for example, Luper 1984; Sosa 1999, 2003, 2007, 2009; Williamson 2000; and Pritchard 2007.)[^luper-1984][^pritchard-2007][^sosa-1999][^williamson-2000] SI is the contraposition of CR, but the contraposition of a subjunctive conditional is not equivalent to the original.
    step1: |-
      SI 要求 *p* 在邻近的 *R* 世界中为真。当 *R* 满足这一条件时，我们不妨说 *R* 是 *p* 为真的 *安全指示*。（安全条件的各种版本都有人辩护，例如见 Luper 1984；索萨 1999、2003、2007、2009；威廉森 2000；普里查德 2007。）[^luper-1984][^pritchard-2007][^sosa-1999][^williamson-2000] SI 是 CR 的换质位命题，但虚拟条件句的换质位命题与原句并不等价。
