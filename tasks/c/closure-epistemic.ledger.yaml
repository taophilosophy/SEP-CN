      K is true; i.e., if, while knowing *p*, *S* believes *q* because *S* knows that *p* entails *q*, then *S* knows *q*.
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      **(2)**
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      *h* entails *not-biv*.
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      **(3)**
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      So if I know *h* and I believe *not-biv* because I know it is entailed by *h* then I know *not-biv*.
