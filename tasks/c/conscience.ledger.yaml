      On a secular account, the external source of moral knowledge that instills moral principles in us is not God, but one’s own culture or upbringing. In this case, the moral knowledge in question is typically understood in a relativistic sense: our conscience is the faculty through which the social norms of our culture or the norms of our upbringing are evoked and exert their influence on our moral psychology. These norms explain our moral feelings and our moral choices, but what conscience tells us in this case is the product of social and cultural dynamics over which we have little control. As the case of Huckleberry Finn’s conscience demonstrates, hardly can conscience so understood be credited any moral authority, since our educators or our culture might be highly immoral (for example our conscience might end up drawing on racist or discriminatory principles, such as the ones which supported slavery in Huck’s social environment). And in fact, unsurprisingly, many are rather skeptical or dismissive of the moral authority of conscience, since they see it as mere opinion about moral principles influenced or even determined by one’s own culture (Montaigne 1580: book 1, ch. 22; Hobbes 1651: ch. 7)[^hobbes-1651]. In this sense, conscience is a merely relativistic notion whose content changes according to social, cultural, and familial circumstances.
