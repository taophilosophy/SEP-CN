      When we talk about conscience, we often refer to reflection about ourselves as moral persons and about our moral conduct. Through conscience we examine ourselves, as if we were our own inner judge. The image of an individual split into two persons, one who acts and the other who observes the former’s conduct, reflects the original conception of “conscience” in the Greek world, at least from the 5ᵗʰ century BCE (Sorabji 2014: 12)[^sorabji-2014]. But such self- knowledge may also be thought of as shared with *others inside of us*, such as God(s) or other imaginary witnesses (for example an admired philosopher according to Epicurus (Sorabji 2014: 24)[^sorabji-2014], or an impartial spectator according to Adam Smith (1759)). The god(s) in question might be the god(s) of a particular religion, such as the God of Christianity, or a postulate of the practical reason, such as in Kant, according to whom reason, in order to be “practical” in the sense of informing moral conduct, needs the idea of a higher authority who sanctions individuals for their actions (Kant 1797)[^kant-1797].
    step1: |-
      当我们谈论良心时，常常指对我们作为道德人格的反思，以及对我们的道德行为的反思。通过良心，我们检视自己，仿佛我们就是自己的内在法官。个体分裂为两个人的意象——一个人行动，另一个人观察前者的行为——反映了希腊世界中“良心”的原初观念，至少从公元前 5 世纪起就是如此（Sorabji 2014: 12）[^sorabji-2014]。但这种自我认识也可以被设想为与 *我们内部的他人* 分享，例如神，或其他想象中的见证者（比如伊壁鸠鲁所说的、我们所敬仰的哲学家（Sorabji 2014: 24）[^sorabji-2014]，或亚当·斯密所说的公正旁观者（Smith 1759））。所涉的神可能是某一特定宗教的神，例如基督教的上帝；也可能是实践理性的悬设，如康德那里那样——在康德看来，理性若要在为道德行为提供依据的意义上成为“实践的”，就需要一个更高权威的观念，由该权威对个人的行为施以裁断（Kant 1797）[^kant-1797]。
