      The concept of conscience does not bear any connection with any particular substantial moral view (Broad 1940)[^broad-1940]. The voice of conscience might suggest different principles and different behaviors to different people. In other words, there is no psychological or conceptual relation between conscience and any particular moral belief. However, as will be explained below, in the Catholic tradition the idea of an erroneous conscience is sometimes used to refer to conscience that fails to recognize the true moral laws which it is naturally predisposed to “witness” within our heart. As for secular accounts of conscience, the independence of the notion of conscience from any substantial moral content can be understood in three senses.
    step1: |-
      良心概念与任何特定的实质道德观点都没有关联（Broad 1940）[^broad-1940]。良心的声音可能向不同的人提示不同的原则与不同的行为。换言之，良心与任何特定的道德信念之间，都没有心理学或概念上的关系。然而，如下文将要解释的，在天主教传统中，“错误良心”的观念有时用来指未能认识到真正道德律的良心——良心按其自然倾向本应在我们心中“见证”这些道德律。至于世俗的良心解释，良心概念独立于任何实质道德内容这一点，可以从三种意义上理解。
    step2: |-
      良心概念与任何特定的实质道德观点都无关联（Broad 1940）[^broad-1940]。良心的声音向不同的人提示不同的原则与行为。换言之，良心与任何特定道德信念之间，并无心理学或概念上的关系。但如下文所释，天主教传统有时用“错误良心”指未能认识真正道德律的良心——而良心按其自然倾向，本应在我们心中“见证”这些道德律。就世俗解释而言，良心概念独立于任何实质道德内容，可从三种意义上理解。
