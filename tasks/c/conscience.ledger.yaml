      Negative feelings and sense of duty are not always successful in prompting agents to do what their moral principles require. But the “bites of conscience”, or just the prospect of bites of conscience, act as motivational force towards aligning our future behavior to those norms. Of course, positive feelings associated with conscience might also have a motivational force. For example, as seen above, Kant associated conscience also with positive feelings about oneself when the agent recognizes he has acted according to his sense of duty. Rousseau, alongside the epistemic account of conscience presented above, also provides in *Emile* a motivational account of conscience based on positive feelings: while reason gives us knowledge of the good, it is conscience, through a sentiment of love for the good, which motivates us to behave morally (Rousseau 1762)[^rousseau-1762].
