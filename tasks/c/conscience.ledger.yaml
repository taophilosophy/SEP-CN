  - id: 10
    kind: body
    source: |-
      Second, conscience is typically a *morally neutral* concept. Appealing to conscience does not usually add anything to the moral justification of any particular conduct or principle. Unless one is committed to the relativistic idea that your belief (or your conscience) about *x* being right or wrong is what makes it right or wrong for you to do *x* (Foot 1979)[^foot-1979], something is not made morally better or worse, acceptable or unacceptable, simply by being a matter of conscience. For example, the morality of abortion has nothing to do with abortion being *conscientiously* opposed by some health practitioners or *conscientiously* supported by others. This neutrality does not exclude, however, that an appeal to conscience can represent itself as a reason for respecting someone’s moral views, for example a reason for granting someone a right to object to carrying out certain activities. While appeals to conscience do not typically provide any moral reason in defense of a certain moral stance (unless one is a relativist), they might ground political reasons for respecting individuals’ moral beliefs, such as for example tolerance or pluralism.
    step1: |-
      第二，良心通常是一个 *道德中立的* 概念。诉诸良心通常不会为任何特定行为或原则的道德辩护增添任何东西。除非一个人信奉这样的相对主义观念：你对 *x* 对错的信念（或你的良心）使 *x* 对你而言成为对的或错的（Foot 1979）[^foot-1979]；否则，一件事不会仅仅因为属于良心问题，就在道德上变得更好或更坏、更可接受或更不可接受。例如，堕胎的道德性与某些医疗从业者 *依良心* 反对堕胎、或另一些人 *依良心* 支持堕胎，毫无关系。然而，这种中立并不排除：诉诸良心可以表现为尊重某人道德观点的理由，例如赋予某人拒绝从事某些活动的权利的理由。诉诸良心通常并不为某一道德立场提供道德上的辩护理由（除非是相对主义者），但可能为尊重个人道德信念提供政治理由，例如宽容或多元主义。
    step2: |-
      第二，良心通常是一个 *道德中立的* 概念。诉诸良心，通常不会为任何特定行为或原则的道德辩护增添什么。除非信奉相对主义——认为你对 *x* 对错的信念（或良心）使 *x* 对你而言成其对错（Foot 1979）[^foot-1979]——否则，一件事不会仅因属于良心问题，就在道德上变得更好或更坏、更可接受或更不可接受。例如，堕胎的道德性，与某些医疗从业者 *依良心* 反对、或另一些人 *依良心* 支持，毫不相干。不过，这种中立并不排除：诉诸良心可以充当尊重某人道德观点的理由，例如赋予某人拒绝从事某些活动的理由。诉诸良心通常不为某一道德立场提供道德辩护（除非是相对主义者），却可能为尊重个人道德信念提供政治理由，如宽容或多元主义。
