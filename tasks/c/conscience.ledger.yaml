      According to Strohm, this article should not be taken to imply freedom to act according to one’s conscience, but it only refers to “matters of inward conviction” (Strohm 2011: 88)[^strohm-2011]. If this interpretation is correct, article 18 does not seem to raise any interesting philosophical or practical problem today, as very few people today would deny freedom in matters of *inward* conviction. More problematic is the moral and political debate about the freedom to *act*, or to *refrain from acting*, according to one’s conscience, especially where there are professional roles or legal obligations that would demand otherwise. In fact, appeals to conscience and freedom of conscience are often deployed to claim and justify “conscientious objection” to certain activities that someone would otherwise be required to perform.
