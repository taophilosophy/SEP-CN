      We have seen above that there is a sense in which, according to some, psychopaths can be said to lack conscience (Hare 1999)[^hare-1999]: psychopaths are not capable of connecting their moral knowledge to their conduct through the feelings of guilt and disapproval which conscience, on some accounts, produces. Interestingly, according to some psychologists, psychopaths are also less likely to base their sense of personal identity on moral traits than normal functioning individuals (Glenn et al. 2010)[^glenn-2010]. More recent psychological studies have suggested that people tend to link the identity of others not so much to their memories, as traditionally believed, but to their morals: it is the loss of one’s moral character and moral beliefs, rather than of one’s memory, that leads us to say that a certain individual is not the same person anymore (Strohminger and Nichols 2015)[^strohminger-2015]. These findings provide empirical support to the idea that conscience is essential to one’s sense of personal identity and to attributions of personal identity
    step1: |-
      上文已见，在某种意义上，按某些人的说法，精神病态者可以说缺乏良心（Hare 1999）[^hare-1999]：精神病态者无法通过内疚与不赞同的情感——良心按某些解释会产生这类情感——把自己的道德知识与行为联系起来。有趣的是，据一些心理学家，精神病态者也比正常运作的个体更不可能把个人认同感建立在道德特征之上（Glenn et al. 2010）[^glenn-2010]。较新的心理学研究表明，人们倾向于把他人的认同与道德而非传统上所认为的记忆相联系：使我们说某个人已不再是从前那个人的，是道德品格与道德信念的丧失，而非记忆的丧失（Strohminger and Nichols 2015）[^strohminger-2015]。这些发现为如下观念提供了经验支持：良心对个人认同感、以及对个人认同的归属至关重要
    step2: |-
