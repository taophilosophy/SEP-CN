      However, at the same time, the negative self-directed feelings must themselves be generated by previous experience of tension between our action and a pre-existing sense of duty. Although it might seem that we are stuck in an infinite regress, where sense of duty and negative self-directed feelings presuppose one another, this need not be the case. It is possible to conceive of an external or independent source of that most fundamental sense of duty that constitutes our conscience, such as for example our moral education and upbringing (Mill 1861: ch. 3)[^mill-1861]. But the sense of duty that identifies a conscientious person can also be conceived as a primitive function, an innate disposition which is not explained by any other more fundamental mechanism. In Kant, for instance, “every human being, as a moral being, has a conscience within him originally” (Kant 1797 [1991: 160])[^kant-1797], and conscience is one of the four “natural predispositions of the mind (…) for being affected by concepts of duty”, the other three being moral feeling, love for one’s neighbors, and respect for oneself (Kant 1797 [1991: 160])[^kant-1797].
