      在世俗解释中，把道德原则注入我们内心的道德知识的外部来源不是上帝，而是个人自己的文化或教养。在此情形中，所涉道德知识通常以相对主义意义来理解：良心是我们借以召唤自身文化的社会规范或自身教养的规范、并使这些规范对我们的道德心理施加影响的官能。这些规范解释我们的道德情感与道德选择，但良心在此情形中告诉我们的东西，是社会与文化动态的产物，而我们对这些动态几乎无法控制。正如哈克贝利·费恩的良心这一案例所表明的，如此理解的良心几乎不能被赋予任何道德权威，因为我们的教育者或我们的文化可能极不道德（例如我们的良心可能最终依据种族主义或歧视性的原则，如哈克的社会环境中支持奴隶制的那些原则）。事实上，毫不奇怪，许多人对良心的道德权威相当怀疑或鄙夷，因为他们视之为关于道德原则的单纯意见，而这类意见受个人文化影响、甚至由之决定（Montaigne 1580: book 1, ch. 22; Hobbes 1651: ch. 7）[^hobbes-1651]。在这种意义上，良心只是一个相对主义的概念，其内容随社会、文化与家庭环境而变。
