      This understanding of conscience as an inner court is well illustrated by the story of Huckleberry Finn in Mark Twain’s famous novel (Twain 1884; Bennett 1974)[^bennett-1974][^twain-1884]. In a well-known episode of the novel, Huck feels guilty and blameworthy for having helped his slave friend Jim to escape from his owner Miss Watson. Blame does not come from some external moral authority, but it is a verdict issued by conscience according to its moral laws. The bites of conscience in Huck’s case were caused by a tension between his feelings supporting what he did and the principles he had inherited from his social environment. At the time when the novel is set, slave-owning was considered a natural type of possession and helping slaves run away meant depriving someone of her private property. This was the “law” (metaphorically speaking) against which Huck’s conscience assessed his behavior.
    step1: |-
      把良心理解为内在法庭，这一点在马克·吐温（Mark Twain）著名小说中哈克贝利·费恩的故事里得到了很好的说明（Twain 1884; Bennett 1974）[^bennett-1974][^twain-1884]。在小说一个著名的片段中，哈克因为帮助他的奴隶朋友吉姆从主人华森小姐那里逃跑而感到内疚、应受责备。责备并非来自某种外在的道德权威，而是良心依据其道德律作出的裁决。哈克身上良心的啃咬，源于他的情感支持他所做的事，而他继承自社会环境的那些原则却不支持，二者之间的张力。小说故事发生的年代，蓄奴被视为一种自然而然的占有形式，帮助奴隶逃跑意味着剥夺某人的私有财产。这就是哈克的良心据以评价其行为的“律法”（打个比方）。
    step2: |-
      把良心理解为内在法庭，马克·吐温（Mark Twain）的著名小说中哈克贝利·费恩的故事便是佳例（Twain 1884; Bennett 1974）[^bennett-1974][^twain-1884]。小说有个著名片段：哈克帮助奴隶朋友吉姆逃离主人华森小姐，为此感到内疚、自觉有罪。责备不来自任何外在的道德权威，而是良心依其道德律所作的裁决。哈克所受良心的啃咬，源于张力：他的情感支持自己的所作所为，而他从社会环境承继的原则不支持。小说所写的年代，蓄奴被视为天经地义的占有，帮奴隶逃跑就等于剥夺某人的私有财产。这便是哈克良心据以评价自身行为的“律法”（打个比方）。
