      In the former sense (conscience as *constituted by* self-evaluative feelings), the feeling is an essential part of conscience. Conscience in this case is better conceived not as a judge who issues sentences, but as a feeling with cognitive content—where the cognitive content concerns the adherence of one’s behavior to a certain moral standard; in such cases, the negative feeling informs me that what I am doing or am contemplating doing is wrong (according to my own moral parameters). In the latter sense (conscience as *occasioning* self-evaluative feelings), the inner judge, when in tension with one’s conduct, generates negative self-directed feelings (Mill 1861: ch 3)[^mill-1861]. For instance, in Freud the “Super-Ego”—the part of our personality that attends to prohibitions, inhibitions and moral constraints—takes “the form of conscience” to exercise its control over one’s impulses and instincts by producing negative evaluative feelings towards the individual, such as aggressiveness towards the Ego and guilt (Freud 1929 [2000: 30])[^freud-1929]. As we shall see below in section 4, these self-directed negative feelings play an essential role in fulfilling the motivational function of conscience.
    step1: |-
      在前一种意义上（良心 *由* 自我评价性情感 *构成*），情感是良心的本质部分。此时，良心最好不被设想为宣判的法官，而被设想为一种带有认知内容的情感——其认知内容关涉一个人的行为是否符合某种道德标准；在此类情形中，负面情感告诉我：我正在做或正考虑去做的事是错的（依据我自己的道德参数）。在后一种意义上（良心 *引发* 自我评价性情感），内在法官在与一个人的行为发生张力时，会产生指向自我的负面情感（Mill 1861: ch 3）[^mill-1861]。例如，在弗洛伊德那里，“超我”——我们人格中关注禁令、抑制与道德约束的部分——采取“良心的形式”，通过产生对个人的负面评价性情感（如对自我的攻击性与内疚），来对一个人的冲动与本能实施控制（Freud 1929 [2000: 30]）[^freud-1929]。下文第 4 节将表明，这些指向自我的负面情感在实现良心的动机功能方面起着本质作用。
    step2: |-
      前一种意义上（良心 *由* 自我评价性情感 *构成*），情感是良心的本质部分。此时，良心与其说像宣判的法官，不如说是一种带认知内容的情感——内容关涉行为是否符合某种道德标准；在此情形下，负面情感告诉我：我正在做或考虑去做的事是错的（依我自己的道德参数）。后一种意义上（良心 *引发* 自我评价性情感），内在法官在行为与其相悖时，会生出指向自我的负面情感（Mill 1861: ch 3）[^mill-1861]。例如弗洛伊德那里，“超我”——人格中掌管禁令、抑制与道德约束的部分——取“良心的形式”，借对个人产生负面评价性情感（如对自我的攻击性与内疚），来管控其冲动与本能（Freud 1929 [2000: 30]）[^freud-1929]。第 4 节将表明，这些指向自我的负面情感，对良心发挥动机功能至关重要。
