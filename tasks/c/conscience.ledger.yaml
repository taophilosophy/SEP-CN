      A second type of argument in defense of violent persecution is the one offered by Augustine (5ᵗʰ Century). He argued that compelling people to follow the true religion—by which he meant persecuting heretics—could open their eyes to the truth (Sorabji 2014: 49–50)[^sorabji-2014]. This thesis implies that sometimes conscience, even if we confine it to matters of inward conviction and not to behavior, can be influenced by some external imposition.
