      据 Strohm，这一条不应被理解为按自己良心行动的自由，它只指“内心信念之事”（Strohm 2011: 88）[^strohm-2011]。如果这一解释正确，第 18 条今天似乎不会引出任何有趣的哲学或实践问题，因为今天极少有人会否认 *内心* 信念方面的自由。更有争议的是关于按自己良心 *行动* 或 *不行动* 之自由的道德与政治争论，尤其是在有职业角色或法律义务要求相反作为的地方。事实上，诉诸良心与良心自由，常被用来主张并证成对某些否则会被要求去做的活动的“依良心拒绝”。
