  - id: 1
    kind: body
    source: |-
      Reading the philosophical and historical literature on conscience, the first thing one would notice is the variety of meanings and psychological and ethical assessments of the concept. Different philosophical, religious and common sense approaches to conscience have emphasized different aspects of the following, broad characterization: through our individual conscience, we become aware of our deeply held moral principles, we are motivated to act upon them, and we assess our character, our behavior and ultimately our self against those principles. The resulting more specific understandings of conscience will be presented in the sections below. On any of these accounts, conscience is defined by its inward looking and subjective character, in the following sense: conscience is always knowledge of ourselves, or awareness of moral principles we have committed to, or assessment of ourselves, or motivation to act that comes from within us (as opposed to external impositions). This inward looking and subjective character of conscience is also reflected in the etymological relation between the notion of “conscience” and that of *consciousness*. Only after the 17ᵗʰ Century did “consciousness” start to be used with a distinct meaning referring to the psychological and phenomenal dimension of the mind, rather than to its moral dimension (for an account of the terminological shift, see Jorgensen 2014)[^jorgensen-2014].
    step1: |-
      阅读关于良心的哲学与历史文献，人们首先会注意到的是这一概念在含义上以及在心理学与伦理学评价上的多样。哲学、宗教与常识对良心的不同进路，各自强调了以下这一宽泛刻画的不同方面：通过我们个人的良心，我们意识到自己深怀的道德原则，受其激励而行动，并依据这些原则评价自己的品格、行为，最终评价我们自己。由此产生的更为具体的良心理解，将在下文各节呈现。无论采用其中哪一种解释，良心都由其向内审视的、主观的品格来界定，具体含义如下：良心总是关于我们自己的知识，或者是对我们所承诺的道德原则的意识，或者是对我们自己的评价，或者是来自我们内心的行动动机（与外部强加相对）。良心这种向内审视的、主观的品格，也反映在“良心”（conscience）这一概念与*意识*（consciousness）概念之间的词源关系上。直到 17 世纪以后，“意识”才开始被用来指心灵的心理与现象维度，而非其道德维度，并具有了独特的含义（关于这一术语变迁的论述，见 Jorgensen 2014）[^jorgensen-2014]。
    step2: |-
      通读关于良心的哲学与历史文献，最先注意到的，是这一概念在含义上、以及在心理学与伦理学评价上的纷繁多样。哲学、宗教与常识对良心的不同进路，各自凸显了下面这一宽泛刻画的不同侧面：借由各人的良心，我们意识到自己深怀的道德原则，受其激励而行动，并依据这些原则评价自己的品格与行为，最终评价我们自己。由此得出的更具体的良心理解，见下文各节。无论取哪一种解释，良心都以其向内审视、主观的品格来界定：良心总是关于我们自身的知识，或是对我们所承诺的道德原则的意识，或是对我们自己的评价，或是发自内心的行动动机（而非外部强加）。这一品格也体现在“良心”（conscience）与*意识*（consciousness）两概念的词源关系上。直到 17 世纪之后，“意识”才开始带有独特含义，指心灵的心理与现象维度而非道德维度（关于这一术语变迁，见 Jorgensen 2014）[^jorgensen-2014]。
  - id: 2
    kind: body
    source: |-
      The term “conscience” translates the Latin “*conscientia*”, which refers to sharing “knowledge” (*scientia*) “with” (*con*-), and which in turns translates the equivalent Greek term *suneidenai* (see Pierce 1955 and Sorabji 2014 for an etymological analysis of the term)[^pierce-1955][^sorabji-2014]. The literal meaning of the term does not specify the type of knowledge involved and whom that knowledge is shared with. However, the concept has traditionally been used to refer to *moral* knowledge (we talk indifferently of conscience and moral conscience) that is shared *with oneself*. This reference to the self does not rule out that the source of the morality in question be external to the self. For example, it might be God, as in the Christian tradition, or the influence of one’s culture or of one’s upbringing, as in the Freudian theory of the Super-Ego. Reference to the self indicates that, from a psychological point of view, conscience involves introspection, awareness of one’s behavior, and self-assessment. As we shall see, although these aspects often overlap, they are psychologically and conceptually distinct functions.
    step1: |-
      “良心”一词译自拉丁文 *conscientia*，其含义是与自己共同（*con*-）分享“知识”（*scientia*）；而这一拉丁词又译自与之对应的希腊词 *suneidenai*（关于该词的词源分析，见 Pierce 1955 与 Sorabji 2014）[^pierce-1955][^sorabji-2014]。该词的字面含义并未限定所涉及的是哪一类知识，也未限定与谁分享这种知识。然而，这一概念传统上用来指 *道德* 知识（我们不加区分地说“良心”与“道德良心”），并且这种知识是 *与自己* 分享的。这一对自我的指涉，并不排除所涉道德的源头在自我之外。例如，源头可能是上帝，如基督教传统中那样；也可能是个人文化或教养的影响，如弗洛伊德式的超我理论中那样。对自我的指涉表明，从心理学观点看，良心涉及内省、对自身行为的意识以及自我评价。正如我们将要看到的，这些方面虽然常常相互重叠，但在心理学与概念上却是彼此不同的功能。
    step2: |-
      “良心”译自拉丁文 *conscientia*，意为共同（*con*-）分享“知识”（*scientia*）；该拉丁词又译自对应的希腊词 *suneidenai*（词源分析见 Pierce 1955 与 Sorabji 2014）[^pierce-1955][^sorabji-2014]。字面上，它既未限定所涉知识的类型，也未限定与谁分享。但这一概念传统上指 *道德* 知识（人们不加区分地说“良心”与“道德良心”），且是 *与自己* 分享的知识。指涉自我，并不排除道德的源头在自我之外：那可能是上帝（如基督教传统），也可能是文化与教养的影响（如弗洛伊德式的超我理论）。对自我的指涉表明，从心理学看，良心涉及内省、对自身行为的意识与自我评价。下文将见，这些方面虽常重叠，却在心理学与概念上是彼此不同的功能。
  - id: 3
    kind: body
    source: |-
      “Sharing moral knowledge with oneself” might mean and imply different things. As for the object of knowledge, for example, it might refer to knowledge of one’s own conduct in view of an assessment of it against a certain moral standard, or it might refer to knowledge of moral standards or principles themselves. As for the “self” with whom knowledge is shared, it might mean sharing knowledge with a part of the self, as if we were split into two persons (Sorabji 2014: 12)[^sorabji-2014], but it might also mean sharing knowledge with an imaginary witness, such as an ideal observer (for instance a god, an imagined moral model, an impartial spectator). Unfortunately, debates in which appeals to conscience are often made—for example the debate about conscientious objection in health care—are often characterized by a lack of clarity as to what it exactly is that we are talking about when we talk about conscience, and therefore about what exactly people are claiming when they put forward a “conscientious objection” to, for example, abortion. In what sense does abortion violate the conscience of a committed Catholic doctor? And is conscience amenable to reason and public discussion, or are appeals to conscience ultimately based on intuitions and private morality? In what sense is a conscientious choice different from a mere moral preference? The notion of conscience is in need of conceptual clarification.
    step1: |-
      “与自己分享道德知识”可能意味着并蕴含不同的事情。例如，就知识的对象而言，它可能指关于自身行为的认识，以便依据某种道德标准对该行为作出评价；也可能指对道德标准或原则本身的认识。而就与之分享知识的那个“自我”而言，它可能指与自我的一部分分享知识，仿佛我们分裂成了两个人（Sorabji 2014: 12）[^sorabji-2014]；但也可能指与一个想象中的见证者分享知识，例如理想观察者（比如神、想象中的道德典范，或公正旁观者）。不幸的是，那些经常诉诸良心的争论——例如医疗领域关于依良心拒绝的争论——往往有一个特点：我们谈论良心时究竟在谈论什么，并不清楚；因此人们针对例如堕胎提出“依良心拒绝”时究竟在主张什么，也不清楚。堕胎在何种意义上侵犯了一位虔诚天主教医生的良心？良心是否服从理性与公共讨论，抑或诉诸良心最终依据的是直觉与私人道德？依良心的选择在何种意义上不同于单纯的道德偏好？良心的概念亟需得到澄清。
    step2: |-
      “与自己分享道德知识”，可能意味并蕴含不同的事。就对象而言：它可指关于自身行为的认识，以便对照某种道德标准评价该行为；也可指对道德标准或原则本身的认识。就与之分享的“自我”而言：它可指与自我的一部分分享知识，仿佛我们分裂成两个人（Sorabji 2014: 12）[^sorabji-2014]；也可指与想象出来的见证者分享，例如理想观察者（神、想象中的道德典范，或公正旁观者）。不幸的是，常诉诸良心的争论——如医疗领域关于依良心拒绝的争论——往往说不清我们在谈的究竟是什么；于是，人们针对堕胎等事提出“依良心拒绝”时究竟在主张什么，也不清楚。堕胎在何种意义上侵犯一位虔诚天主教医生的良心？良心能否交付理性与公共讨论，还是诉诸良心最终只落在直觉与私人道德上？依良心的选择与单纯的道德偏好，区别何在？这一概念亟需澄清。
  - id: 4
    kind: body
    source: |-
      This entry will expound the main features of the notion of conscience as it is used in philosophical discussion, religious teaching and in common language alike. The perspective adopted here will be theoretical, rather than historical. The entry focuses on the Western tradition and some examples are drawn from Christian source. The entry is structured around four possible, but not mutually exclusive, ways of conceptualizing conscience. These will be preceded by an introductory section outlining the pluralistic, morally neutral and subjective nature of the concept of conscience. The four main aspects of conscience that will be described are the following. Section 2 discusses conscience as a faculty for self-knowledge and self-assessment. Section 3 presents the epistemic aspect of conscience that allows the formation of moral beliefs, distinguishing the different possible sources of moral principles that inform such beliefs. In section 4, conscience will be described as a motivational force or as the source of our sense of duty, which already presupposes a body of moral knowledge or of moral beliefs. Finally, section 5 will focus on conscience understood as the body of personal core and self-identifying moral beliefs which is often taken to be the basis of moral integrity (Fuss 1964; Wicclair 2011)[^fuss-1964][^wicclair-2011] and of our sense of personal identity (Childress 1979)[^childress-1979]. As discussed in section 6, this last approach to conscience is often used with a political function to advocate freedom of thought and action in liberal democratic societies, for example, as explained in subsection 6.1, through conscientious objection to practices that one would otherwise be professionally or legally expected to perform.
    step1: |-
      本文阐述良心概念的主要特征，这一概念在哲学讨论、宗教教导与日常语言中同样被使用。此处采取的是理论视角，而非历史视角。本文聚焦于西方传统，部分例证取自基督教文献。全文围绕四种可能但彼此并不排斥的良心概念化方式展开。在此之前，先有一个导论节，概述良心概念的多元、道德中立与主观的本性。将要描述的良心的四个主要方面如下。第 2 节讨论作为自我认识与自我评价官能的良心。第 3 节呈现良心的认识论方面，即良心使道德信念得以形成，并区分可为这类信念提供依据的道德原则的不同可能来源。第 4 节把良心描述为一种动机力量，或我们义务感的来源；这一方面已经预设了一定的道德知识或道德信念。最后，第 5 节聚焦于把良心理解为个人的核心且自我认同的道德信念之整体；这些信念常被视为道德完整性（Fuss 1964; Wicclair 2011）[^fuss-1964][^wicclair-2011] 与个人认同感（Childress 1979）[^childress-1979] 的基础。如第 6 节所论，最后这种良心进路常被赋予政治功能，用以在自由民主社会中倡导思想与行动自由；例如 6.1 小节所说明的，通过依良心拒绝那些否则会因职业或法律而被期待去做的事。
    step2: |-
      本文阐述良心概念的主要特征——这一概念在哲学讨论、宗教教导与日常语言中同样在用。视角是理论的，不是历史的；取材以西方传统为主，部分例证出自基督教文献。全文围绕四种可能而并不互斥的良心概念化方式展开，前面另设导论节，概述良心概念的多元、道德中立与主观本性。四个主要方面如下。第 2 节：良心作为自我认识与自我评价的官能。第 3 节：良心的认识论方面——它使道德信念得以形成，并区分这些信念背后道德原则的不同可能来源。第 4 节：良心作为动机力量，或义务感的来源；此一方面已预设一定的道德知识或道德信念。第 5 节：良心作为个人的核心且自我认同的道德信念之整体；这些信念常被视为道德完整性（Fuss 1964; Wicclair 2011）[^fuss-1964][^wicclair-2011] 与个人认同感（Childress 1979）[^childress-1979] 的基础。如第 6 节所述，这一进路常被赋予政治功能：在自由民主社会中倡导思想与行动自由——例如 6.1 小节所言，通过依良心拒绝那些原本因职业或法律而须做的事。
