      The knowledge we get from conscience, understood as possessing an epistemic function, is often conceived as mediated knowledge. This is not surprising, since, as we have seen, conscience is mostly understood as inward looking, which presupposes that the knowledge to which it gives us access is already *within us* and that we acquired it through some other process not involving conscience. In fact, on many accounts, conscience does not generate its own moral principles. For example, the moral contents we discover within us can be acquired through divine intervention, as is the case with the laws of nature which, according to Christians, God infuses in our heart. As we are going to see in subsection 3.1, the understanding of conscience as having an epistemic function and as the recipient of mediated knowledge is not exclusive to religious views.
    step1: |-
      我们从被理解为具有认识论功能的良心那里获得的知识，常被设想为中介性的知识。这并不奇怪，因为如我们所见，良心多半被理解为向内审视的，这就预设了良心使我们通达的知识已经 *在我们之内*，而且是我们通过某种不涉及良心的其他过程获得的。事实上，按许多解释，良心并不生成自己的道德原则。例如，我们在自身之内发现的道德内容，可以通过神圣的干预而获得，正如自然律的情形：按基督徒的说法，上帝把自然律注入我们心中。我们将在 3.1 小节看到，把良心理解为具有认识论功能、并接受中介性知识，这种理解并非宗教观点所独有。
    step2: |-
      良心被赋予认识论功能，由此获得的知识常被设想为中介性的。这不奇怪：如我们所见，良心多半被理解为向内审视的，这就预设它所通达的知识已经 *在我们之内*，且是通过某种不涉及良心的其他过程获得的。事实上，按许多解释，良心并不生成自己的道德原则。比如，我们在自身之内发现的道德内容，可经神圣干预而获得——如自然律：按基督徒之说，上帝将其注入我们心中。3.1 小节将表明，把良心理解为具有认识论功能、接受中介性知识，并非宗教观点所独有。
