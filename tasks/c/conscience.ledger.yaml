      The role of conscience in this sense is not that of merely gaining knowledge about our behavior or character. The knowledge in question is typically (though, as explained below, not always) the ground for a moral assessment by conscience. When observing one’s behavior, conscience is more like a judge (or sometimes it is identified with the judgment itself) than like a disinterested observer. Thus, for instance, the impartial spectator with which Adam Smith identified conscience, inspired by the Stoic’s notion of conscience as an imagined admired philosopher judging one’s conduct, is not a morally and emotionally neutral observer, but generates a sentiment of approval or disapproval of oneself (Smith 1759 and discussion in Raphael 2007: 34)[^raphael-2007][^smith-1759]. Even in the Catholic view, where the main characterization of conscience is that of a witness of God’s law in our hearts (as described in section 3), conscience is also presented as “a moral judgment about man and his actions, a judgment either of acquittal or condemnation” (John Paul II 1993: 59)[^john-1993]. Analogously, in the Kantian view, conscience is conceived of as an inner court (Wood 2008: 184)[^wood-2008]: it is moral self-awareness that allows one to apply the moral law suggested by practical reason to our moral conduct, and to judge whether we have complied with the moral law. As Kant defines it in the *Metaphysics of Morals*, conscience is
    step1: |-
