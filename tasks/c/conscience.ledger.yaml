      Once again, there are reasons to doubt the epistemic and moral authority of conscience so understood. A lot of work in recent moral psychology aimed at understanding moral disagreement has suggested that there are seemingly irreconcilable differences in fundamental moral intuitions and emotions among people with different worldviews (e.g., Haidt 2012; Greene 2013)[^greene-2013][^haidt-2012]. These differences in fundamental moral intuitions seem to undermine the epistemic status of conscience and, with it, conscience’s moral authority, not least because most of our moral intuitions seem, according to these recent developments in moral psychology, not to be amenable to revision in light of new evidence or new good reasons. Reasoning, on any plausible account, should be an important part of morality; however, what our conscience tells us may have little to do with reasons and evidence. Theoretical work in moral psychology (e.g., Haidt 2012; Graham et al. 2009; Haidt 2001)[^graham-2009][^haidt-2001][^haidt-2012], supported by evidence from neuroscience (Greene 2013)[^greene-2013], suggests that our most fundamental moral beliefs might be based on intuitions and emotions over which our rational capacities have little control. If this account is correct, then we have reasons to be skeptical about the possibility of affecting, let alone changing, people’s conscientious beliefs through dialogue, public discussion and reason giving. Psychological research has focused particularly on the differences between liberal and conservative thinking. For example, it has been suggested that conservative moral and political views are often founded on certain specific emotions, e.g., disgust or fears, and specific intuitions, e.g., intuitive opposition to perceived violations of purity and to authority subversion, whereas liberal views are often driven by other specific emotions, e.g., anger, and intuitions, e.g., intuitive rejection of fairness violations or liberty infringements (Haidt 2001 and 2012)[^haidt-2001][^haidt-2012]. If conscience simply is the expression of moral intuition, and if individuals have significantly different and irreconcilable moral intuitions, then individuals also have significantly different and difficult-to-reconcile conscientious moral consciences.
    step1: |-
      再一次，有理由怀疑如此理解的良心的认识论与道德权威。近来的道德心理学中有大量工作旨在理解道德分歧，它们表明：在世界观不同的人群之间，根本道德直觉与情感存在看似不可调和的差异（例如 Haidt 2012; Greene 2013）[^greene-2013][^haidt-2012]。这些根本道德直觉上的差异似乎损害了良心的认识论地位，并随之损害良心的道德权威——尤其因为按道德心理学的这些新进展，我们的多数道德直觉似乎并不因新的证据或新的好理由而可修正。无论按哪种可信的解释，推理都应当是道德的重要组成部分；然而我们的良心告诉我们的东西，可能与理由和证据关系不大。道德心理学的理论工作（例如 Haidt 2012; Graham et al. 2009; Haidt 2001）[^graham-2009][^haidt-2001][^haidt-2012]，加上神经科学的证据（Greene 2013）[^greene-2013]，表明我们最基本的道德信念可能基于直觉与情感，而我们的理性能力对这些直觉与情感几乎没有控制力。如果这一解释正确，那么我们有理由怀疑：通过对话、公共讨论与说理去影响——更不用说改变——人们良心信念的可能性。心理学研究尤其关注自由派与保守派思维之间的差异。例如，有观点认为，保守派的道德与政治观点常建立在某些特定情感之上，如厌恶或恐惧，以及特定直觉之上，如直觉上反对被视为对纯洁的违反与对权威的颠覆；而自由派的观点常由其他特定情感（如愤怒）与其他特定直觉（如直觉上拒绝违反公正或侵犯自由）所驱动（Haidt 2001 and 2012）[^haidt-2001][^haidt-2012]。如果良心只是道德直觉的表达，而且个人的道德直觉显著不同且不可调和，那么人们依良心持有的道德信念也会显著不同、难以调和。
    step2: |-
      如此理解的良心，其认识论与道德权威同样有可议之处。近来道德心理学旨在理解道德分歧的大量工作表明：不同世界观的人之间，根本道德直觉与情感存在看似不可调和的差异（如 Haidt 2012; Greene 2013）[^greene-2013][^haidt-2012]。这些差异似乎动摇良心的认识论地位，随之动摇其道德权威——尤其因为，按道德心理学这些新进展，我们的多数道德直觉似乎不因新证据或新理由而可修正。无论如何解释，推理都应是道德的重要部分；可良心告诉我们的东西，未必与理由和证据相干。道德心理学的理论工作（Haidt 2012; Graham et al. 2009; Haidt 2001）[^graham-2009][^haidt-2001][^haidt-2012] 加上神经科学证据（Greene 2013）[^greene-2013] 表明：我们最基本的道德信念可能基于直觉与情感，理性能力对其几无控制。若此说成立，我们便有理由怀疑：凭对话、公共讨论与说理能否影响——遑论改变——人们的良心信念。心理学研究尤重自由派与保守派思维之别。例如有研究认为：保守派的道德与政治观点常奠基于特定情感（如厌恶、恐惧）与特定直觉（如直觉反对违反纯洁、颠覆权威）；自由派则常由另一些情感（如愤怒）与直觉（如直觉拒绝违反公正、侵犯自由）驱动（Haidt 2001 and 2012）[^haidt-2001][^haidt-2012]。若良心只是道德直觉的表达，而个人直觉显著不同且不可调和，那么人们依良心持有的道德信念也会显著不同、难以调和。
