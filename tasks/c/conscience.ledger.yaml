      Consistently with this understanding of conscience as self-knowledge and self-assessment, it has been suggested by some that psychopaths—i.e., pathological subjects who display antisocial behavior and systematically act without regard to what they consider to be right or wrong—can be said to lack conscience (Hare 1999)[^hare-1999]. For instance, according to Vujošević (2015), in psychopaths the link between moral knowledge or beliefs and self-directed feelings of condemnation (e.g., guilt) is broken: psychopaths cannot feel the remorse that normal functioning agents feel when they perceive the discrepancy between their moral beliefs and their behavior, and as a consequence psychopaths do not consider themselves accountable for their actions (Gudjonsson and Roberts 1983; Aharoni et al. 2012)[^aharoni-2012][^gudjonsson-1983], although their moral beliefs are often “normal” (Schaich and Sinnott-Armstrong 2013)[^schaich-2013]
    step1: |-
      与这种把良心理解为自我认识与自我评价的观点相一致，一些人提出：精神病态者——即表现出反社会行为、系统性地不顾自己所认为的对错而行动的病态主体——可以说缺乏良心（Hare 1999）[^hare-1999]。例如，据 Vujošević（2015），在精神病态者身上，道德知识或道德信念与指向自我的谴责情感（如内疚）之间的联系断裂了：精神病态者感受不到正常运作的行动者在察觉自身道德信念与行为不一致时所感受的悔恨，因此精神病态者不认为自己应为行为负责（Gudjonsson and Roberts 1983; Aharoni et al. 2012）[^aharoni-2012][^gudjonsson-1983]，尽管他们的道德信念往往是“正常的”（Schaich and Sinnott-Armstrong 2013）[^schaich-2013]
    step2: |-
      与“良心即自我认识与自我评价”这一理解相一致，有人提出：精神病态者——表现出反社会行为、惯常不顾自认为对错而行动的病态主体——可以说没有良心（Hare 1999）[^hare-1999]。例如 Vujošević（2015）认为，精神病态者身上，道德知识或信念与指向自我的谴责感（如内疚）之间的链条断了：正常人察觉道德信念与行为相悖时会生悔恨，他们却感受不到；因此他们不认为自己应为行为负责（Gudjonsson and Roberts 1983; Aharoni et al. 2012）[^aharoni-2012][^gudjonsson-1983]，尽管其道德信念往往“正常”（Schaich and Sinnott-Armstrong 2013）[^schaich-2013]
