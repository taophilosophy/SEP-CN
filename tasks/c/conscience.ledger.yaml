      For example, while some health practitioners raise “conscientious” objection to abortion and refuse to provide the service, someone’s conscience might demand the exact opposite, i.e., to perform abortions in order to respect what is conscientiously believed to be a woman’s right (Joffe 1995)[^joffe-1995].
    step1: |-
