      According to those who are against a right to conscientious objection, professional obligations trump any value conscience might have and any principle that might justify conscientious objection *qua conscientious* (e.g., Giubilini, Schuklenk, Minerva, and Savulescu 2025; Savulescu and Schuklenk 2017)[^savulescu-2017]; according to defenders of conscientious objection, professionals’ conscience must be protected to the largest extent possible, i.e., up to the point where respecting conscience would significantly jeopardize physical or psychological health of patients (e.g., Sulmasy 2008; Wicclair 2011)[^sulmasy-2008][^wicclair-2011], a compromise that, depending on circumstances—for example a too high percentage of objecting practitioners which would make it nearly impossible to refer patients to non-objecting doctors—might be very difficult to achieve (Minerva 2015)[^minerva-2015]. Between these two stances, there are positions that are neither for nor against conscientious objection in principle, but pose tighter restrictions to those who advance conscientious objection (McLeod 2020)[^mcleod-2020], for example the requirement to provide reasons for the objection, and to submit such reasons to public scrutiny or experts’ assessment of the reasonability of one’s objection (Card 2007, Card 2020)[^card-2007][^card-2020], or the qualification that objection can only be justified if consistent with the internal values of the profession (Wicclair 2000; Deans 2013)[^deans-2013][^wicclair-2000].
    step1: |-
      按反对依良心拒绝权利者，职业义务压倒良心可能具有的任何价值，也压倒任何可能仅 *因为* 依良心而证成依良心拒绝的原则（例如 Giubilini, Schuklenk, Minerva, and Savulescu 2025; Savulescu and Schuklenk 2017）[^savulescu-2017]；按依良心拒绝的辩护者，专业人士的良心必须受到尽可能大程度的保护，即保护到尊重良心会显著危及患者身心健康的临界点（例如 Sulmasy 2008; Wicclair 2011）[^sulmasy-2008][^wicclair-2011]；这一折中视情形而定，可能极难实现——例如拒绝者比例过高，会使把患者转诊给不拒绝的医生几乎不可能（Minerva 2015）[^minerva-2015]。在这两种立场之间，还有一些立场既不原则上支持也不原则上反对依良心拒绝，而是对主张依良心拒绝者施加更严格的限制（McLeod 2020）[^mcleod-2020]，例如要求为拒绝提供理由、并把这类理由提交公共审查或由专家评估其合理性（Card 2007, Card 2020）[^card-2007][^card-2020]，或附加限定：拒绝只有在与该职业内在价值一致时才可证成（Wicclair 2000; Deans 2013）[^deans-2013][^wicclair-2000]。
