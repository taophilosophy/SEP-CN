      In the Christian tradition, starting from Paul, the inward looking character of conscience is emphasized by the metaphor of the witness (Romans 2: 14–15). Conscience does not allow us to acquire the knowledge of the moral law directly from an external source (God in this case), but only to witness the presence of God’s laws within us. Conscience cannot directly contemplate God. The idea of a faculty that gives us indirect, and therefore imperfect knowledge of some external moral authority suits religious traditions very well. For example, the idea that through conscience we discover the true divine laws can also be found in Islam (Geaves 1999: 164)[^geaves-1999].
    step1: |-
      在基督教传统中，从保罗（Paul）开始，良心的向内审视品格由见证者的隐喻得到强调（《罗马书》2:14–15）。良心并不让我们从外在来源（在此即上帝）直接获得道德律的知识，而只让我们见证上帝律法在我们之内的临在。良心不能直接观照上帝。有一种官能，使我们获得关于某种外在道德权威的间接、因而不完善的知识——这一观念非常契合宗教传统。例如，通过良心我们发现真正神圣律法这一观念，在伊斯兰教中也能找到（Geaves 1999: 164）[^geaves-1999]。
