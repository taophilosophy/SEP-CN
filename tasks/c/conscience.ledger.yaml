      b) The “*argument from ignorance”,* which might be better labeled “*argument from humility*”, is based on a skeptical approach to the content of conscience. The possibility exists that what we conscientiously believe is wrong and that those holding conscientious beliefs opposite to ours are right. Therefore, there is a reason for not forcing anyone to believe in something or to engage in behaviors that might turn out to be morally wrong. The argument from ignorance or humility started to be put forward quite frequently, and most prominently by Pierre Bayle (1686–1688), after the Catholic Church lost a significant proportion of its religious and moral authority following the Protestant reform in 16ᵗʰ and 17ᵗʰ Century—which was defined by Keith Thomas (1993) as “the age of conscience”. It was at that time that we assisted to the “secularization of conscience” in the modern era (Strohm 2011)[^strohm-2011], although the phenomenon would be better conceived of as a “re-secularization”, since conscience was not related to the voice or the authority of God in the Greek world.
    step1: |-
      b) “*无知论证*”，或许更宜称为“*谦卑论证*”，依据的是对良心内容的怀疑论态度。我们所依良心相信的东西可能是错的，而持相反良心信念的人可能是对的。因此，有理由不强迫任何人相信某事、或从事结果可能在道德上是错误的行为。无知或谦卑论证在 16 与 17 世纪新教改革之后天主教会失去相当比例宗教与道德权威之后，开始被相当频繁地提出，最著名者如皮埃尔·培尔（Pierre Bayle）（1686–1688）——凯斯·托马斯（Keith Thomas）（1993）把这一时期称为“良心的时代”。正是在那时，我们见证到现代“良心的世俗化”（Strohm 2011）[^strohm-2011]；不过这一现象或许更宜设想为“再世俗化”，因为在希腊世界中，良心与上帝的声音或权威并无关联。
    step2: |-
      b) “*无知论证*”——或许更宜称“*谦卑论证*”——依据对良心内容的怀疑论态度：我们所依良心相信的可能是错的，持相反良心信念的人可能是对的。因此，有理由不强迫任何人相信某事，或从事结果可能在道德上错误的行为。这一论证在 16、17 世纪新教改革后、天主教会失去相当一部分宗教与道德权威之际开始频出，最著名者为皮埃尔·培尔（Pierre Bayle）（1686–1688）；凯斯·托马斯（Keith Thomas，1993）称此期为“良心的时代”。也正是在那时，我们见证到现代“良心的世俗化”（Strohm 2011）[^strohm-2011]；不过这一现象更宜视为“再世俗化”，因为在希腊世界，良心与上帝的声音或权威并无关联。
