      On this account—since conscience is only a *witness* and does not have direct epistemic access to the source of knowledge, i.e., to God—conscience is considered fallible and actually often erroneous (1 Corinthians 4:4; Aquinas 1265–1274; Butler 1726: sermon 3 (3)). In particular, conscience might fail to correctly interpret the divine laws when applying them to real cases. According to some 13ᵗʰ Century Catholic theologians, such as Philip the Chancellor, Albert the Great and, most notably, Thomas Aquinas, conscience is the act of applying universal principles (i.e., divine laws) to real situations, i.e., it is the conclusion of the practical syllogism whose first premise is a universal principle provided by a separate faculty called “synderesis” (Aquinas, *Summa Theologiae*, 1 q79; Langston 2000 and 2015; Sorabji 2014: 62–66)[^langston-2000][^langston-2015][^sorabji-2014]: as such, conscience can be erroneous in deriving moral conclusions from first principles (Aquinas, *On Truth*, q17, art. 2, and discussion in D’Arcy 1961: 100–103)[^d’arcy-1961]. However, other Catholic thinkers have emphasized the essential role of conscience in humans search for the truth. Cardinal John Henry Newman, for instance, saw conscience as the moral sense that can lead us to the moral truth. As such, conscience is in his view both epistemic and action guiding, but the two aspects are not distinguishable, to the extent that the moral truth is what guides our actions. As he wrote, “The feeling of conscience … is twofold: it is a moral sense, and a sense of duty; a judgment of the reason and a magisterial dictate. Of course its act is indivisible; still it has these two aspects, distinct from each other, and admitting of a separate consideration” (Newman 1870, 101)[^newman-1870]
    step1: |-
      按这种解释——既然良心只是 *见证者*，并不对知识之源即上帝拥有直接的认识通达——良心被认为会出错，而且实际上常常出错（《哥林多前书》4:4; Aquinas 1265–1274; Butler 1726: sermon 3 (3)）。特别是，良心在把神圣律法应用于实际案例时，可能未能正确解释这些律法。据一些 13 世纪天主教神学家，如菲利普校长（Philip the Chancellor）、大阿尔伯特（Albert the Great），以及最著名的托马斯·阿奎那（Thomas Aquinas），良心是把普遍原则（即神圣律法）应用于实际情境的行为，即实践三段论的结论，其三段论的第一前提由一个称作“良知”（synderesis）的独立官能提供（Aquinas, *Summa Theologiae*, 1 q79; Langston 2000 and 2015; Sorabji 2014: 62–66）[^langston-2000][^langston-2015][^sorabji-2014]：因此，良心在从第一原则推导道德结论时可能出错（Aquinas, *On Truth*, q17, art. 2, 讨论见 D’Arcy 1961: 100–103）[^d’arcy-1961]。然而，另一些天主教思想家强调了良心在人类寻求真理中的本质作用。例如枢机约翰·亨利·纽曼（John Henry Newman）把良心视为能引导我们走向道德真理的道德感。因此，在他看来，良心既是认识性的，又是行动指导性的；但这两个方面不可区分，因为道德真理正是指导我们行动的东西。他写道：“良心的感受……是双重的：它既是道德感，又是义务感；既是理性的判断，又是权威性的命令。其行为当然不可分割；但它仍有这两个方面，彼此不同，可以分别考察”（Newman 1870, 101）[^newman-1870]
    step2: |-
