      As the characterization of conscience as self-assessment here presented suggests, conscience has most often been associated with negative feelings (Arendt 1971)[^arendt-1971], such as shame, guilt, fear, contrition. For most of us, even in our common language, conscience is something that yields negative feelings more often than not—for example we often talk of the “bites of conscience” or of conscience as causing us “remorse” (which derives from the Latin “*remordere*”, i.e., “to bite again”). However, a joyful conscience that praises and takes pride of one’s own moral merit can be conceived as well. Examples of joyful conscience can be found for instance in Cicero and some Latin Stoics, most prominently Seneca (Sorabji 2014: 25–30)[^sorabji-2014]. Also in the Protestant tradition started by Luther we find the idea of a joyful conscience, where joy springs not from pride or self-praise, but from awareness of God’s future remission of sins (Luther 1535; Calvin 1536).
    step1: |-
      正如这里所呈现的“良心即自我评价”的刻画所提示的，良心最常与负面情感联系在一起（Arendt 1971）[^arendt-1971]，例如羞耻、内疚、恐惧、痛悔。对我们大多数人而言，即便在日常语言中，良心也多半产生负面情感——例如我们常说“良心的啃咬”，或说良心使我们“悔恨”（remorse 源自拉丁文 *remordere*，即“再次啃咬”）。不过，赞美并以自己道德功德为荣的喜悦良心，同样可以被设想。喜悦良心的例子可见于西塞罗（Cicero）与一些拉丁斯多亚派，其中最著名的是塞涅卡（Seneca）（Sorabji 2014: 25–30）[^sorabji-2014]。在路德（Luther）开创的新教传统中，也有喜悦良心的观念：其喜悦并非出自骄傲或自我夸耀，而是出自对上帝将来赦罪的意识（Luther 1535; Calvin 1536）。
    step2: |-
      如上文“良心即自我评价”的刻画所示，良心最常与负面情感相连（Arendt 1971）[^arendt-1971]：羞耻、内疚、恐惧、痛悔。即便在日常语言里，良心对我们多数人也多半产出负面情感——我们常说“良心的啃咬”，或说良心使我们“悔恨”（remorse 源自拉丁文 *remordere*，“再次啃咬”）。但喜悦的良心同样可以设想：它赞美并以自己的道德功德为荣。例如西塞罗（Cicero）与一些拉丁斯多亚派，尤以塞涅卡（Seneca）为著（Sorabji 2014: 25–30）[^sorabji-2014]。路德（Luther）开创的新教传统中也有喜悦良心之说：其喜悦不出于骄傲或自夸，而出于意识到上帝将来赦罪（Luther 1535; Calvin 1536）。
