      A powerful motivational source is represented by the feelings that conscience generates in its self-assessment function. As we said at the beginning, the different understandings of conscience presented here are not necessarily mutually exclusive. Conscience as self-assessment and conscience as motivation to act morally constitute a good example of perspectives on conscience which are not only consistent with one another, but which actually complete one another. In Kant, for example, the theory of conscience can be seen as “a motivation theory set in the context of a reflection theory” (Wood 2008: 183)[^wood-2008]: As Wood interprets the Kantian notion of conscience, “conscience is a feeling of pleasure or displeasure associated with myself” that arises when I comply or don’t comply with moral principles and that motivates me to act in one sense rather than the other when the feeling accompanies the contemplation of a certain course of action (Wood 2008: 183–184)[^wood-2008]. Conscience for Kant is therefore not only an inner court, but also a source of motivation to act morally, that is, motivation to follow our sense of duty as determined by reason (Kant 1797 [1991: 161])[^kant-1797].
    step1: |-
      一股强大的动机来源，是良心在其自我评价功能中产生的情感。如我们在开头所说，这里呈现的良心的不同理解并不必然互相排斥。作为自我评价的良心与作为道德行动之动机的良心，是彼此一致、实际上还互相补充的良心视角的好例子。例如在康德那里，良心的理论可以被视为“置于反思理论语境中的动机理论”（Wood 2008: 183）[^wood-2008]：按 Wood 对康德良心概念的解读，“良心是一种与我自己相联系的愉悦或不愉悦的情感”，当我遵守或不遵守道德原则时它便产生，而当这种情感伴随对某一行动路线的思量时，它便激励我按此而非彼的方式行动（Wood 2008: 183–184）[^wood-2008]。因此，对康德而言，良心不仅是内在法庭，也是道德行动的动机来源，即遵循由理性所确定的义务感的动机（Kant 1797 [1991: 161]）[^kant-1797]。
