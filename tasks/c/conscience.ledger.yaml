      This latter approach based on the idea of bringing the truth to conscience by “freeing” conscience from error is consistent with the Catholic peculiar understanding of the notion of freedom of conscience. Philosophically speaking, “freedom of conscience” is typically understood as an individualistic concept that allows for a plurality of moral and religious views (Strohm 2011: 90)[^strohm-2011]. For the Catholic Church, however, *authentic* freedom is inseparable from the notion of truth. Inspired by the works of the English theologian and cardinal John Henry Newman, Joseph Ratzinger writes that in the Catholic view “truth” is the middle term that reconciles authority of God and subjectivity of conscience: the latter, when authentically free, cannot but reveal the truth established by the former (Ratzinger 1991 [2010])[^ratzinger-1991]. Since, as we have seen above, in the Catholic view reason alone can’t create its own values, which are instilled by God into humans’ hearts, “human freedom finds its authentic and complete fulfillment precisely in the acceptance of that law” of God (John Paul II 1993: par. 35)[^john-1993]. So when practical reason is free to exercise its “participation” (John Paul II 1993: sec. 40)[^john-1993] in the divine law, then “in the depths of his conscience, man detects a law which he does not impose upon himself, but which holds him to obedience” (Paul VI 1965: par. 16)[^paul-1965].
    step1: |-
      后一种进路以“把良心从错误中解放出来”、从而把真理带给良心为理念，与天主教对良心自由概念的独特理解相一致。从哲学上说，“良心自由”通常被理解为一个个人主义的概念，容许道德与宗教观点的多元（Strohm 2011: 90）[^strohm-2011]。然而，对天主教会而言，*真正的* 自由与真理概念不可分割。受英国神学家、枢机约翰·亨利·纽曼著作的启发，约瑟夫·拉青格写道：在天主教观点中，“真理”是调和上帝的权威与良心的主体性的中间项：后者在真正自由时，不能不同时揭示前者所确立的真理（Ratzinger 1991 [2010]）[^ratzinger-1991]。既然如上文所见，在天主教观点中，单凭理性不能创造自己的价值——价值是上帝注入人心的——那么“人的自由恰恰在接受上帝的这一律法时，才找到其真正而完满的实现”（John Paul II 1993: par. 35）[^john-1993]。所以，当实践理性自由地“参与”（John Paul II 1993: sec. 40）[^john-1993] 神圣律法时，“人在其良心的深处察觉到一条律法，这律法不是他自己强加于自己的，却使他服从”（Paul VI 1965: par. 16）[^paul-1965]。
