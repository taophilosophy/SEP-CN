      This understanding of conscience as a deeper form of moral knowledge brings us to the second sense in which conscience can be said to have an epistemic role. As well as merely witnessing received opinions or divine laws, conscience can also be conceived as a moral sense giving us direct access to moral principles. Understood in this way, conscience is typically seen as intuitive and influenced by emotions, rather than a reason-based faculty. In particular, 18ᵗʰ Century sentimentalist philosophers often (e.g., Shaftesbury (1711) and Hume (1738–1740)) identified conscience with a moral “sentiment” or moral “sense”. According to Hume’s psychological theory, for instance, “reason is wholly inactive and can never be the source of so active a principle as conscience, or a sense of morals” (Hume 1738–1740: book 3, part 1, section 1)[^hume-1738]. Also on more recent accounts of conscience and of private morality, the dictates of conscience can be understood as expressions of our moral intuitions. According to Thagard and Finn (2011), for instance, “conscience is a kind of moral intuition” (p. 168) that is “both cognitive and emotional”(p.156).
    step1: |-
      这种把良心理解为一种更深的道德知识的观点，把我们引向良心可以说具有认识论作用的第二种意义。除了仅仅见证既受意见或神圣律法之外，良心还可以被设想为一种道德感，使我们直接通达道德原则。按这种理解，良心通常被视为直觉的、受情感影响的，而非基于理性的官能。特别是，18 世纪情感主义哲学家常常（例如沙夫茨伯里（Shaftesbury）（1711）与休谟（Hume）（1738–1740））把良心等同于道德“情感”（sentiment）或道德“感”（sense）。例如，按休谟的心理学理论，“理性是完全不动的，永远不能成为像良心或道德感这样主动的原则的来源”（Hume 1738–1740: book 3, part 1, section 1）[^hume-1738]。在较新的良心与私人道德解释中，良心的命令也可以被理解为我们的道德直觉的表达。例如，据 Thagard 与 Finn（2011），“良心是一种道德直觉”（第 168 页），它“既是认知的又是情感的”（第 156 页）。
