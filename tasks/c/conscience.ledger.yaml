      There are three main arguments that can be used to defend a principle of freedom of conscience. Two of them are frequently found in the 16ᵗʰ and 17ᵗʰ Century philosophical literature: they are the “argument from ineffectiveness or hypocrisy” and the “argument from ignorance” (Sorabji 2014: 139)[^sorabji-2014]. A third argument, which might be called “argument from legitimization”, was put forward by John Stuart Mill. Let us examine them in order.
    step1: |-
      有三项主要论证可用来为良心自由原则辩护。其中两项常见于 16 与 17 世纪的哲学文献：它们是“无效或虚伪论证”与“无知论证”（Sorabji 2014: 139）[^sorabji-2014]。第三项论证可称为“正当化论证”，由约翰·斯图尔特·密尔提出。让我们依次考察。
    step2: |-
      为良心自由原则辩护的主要论证有三。前两项常见于 16、17 世纪哲学文献：“无效或虚伪论证”与“无知论证”（Sorabji 2014: 139）[^sorabji-2014]。第三项可称“正当化论证”，出自约翰·斯图尔特·密尔（John Stuart Mill）。下面依次考察。
