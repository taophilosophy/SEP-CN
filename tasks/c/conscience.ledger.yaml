      Finally, conscience only concerns the *subjective* dimension of morality. Even assuming that there are ethical values that, in some sense, can be considered objective, conscience only refers to what individuals *believe*, independently of any external, objective proof or justification. And when people state what they subjectively and conscientiously believe, they acknowledge that other people might (and probably will) subjectively and conscientiously hold different moral views. Thus, when I say that abortion violates my conscience, I am not saying (although I might be thinking) that abortion is morally wrong by some objective standard, and I’m not necessarily trying to convince others that abortion is wrong by some objective standard. I am simply stating what I deeply believe and what I want others to respect as my conscientious belief, regardless of how good or bad the moral reasons I can provide to defend my claims are or appear to be to others (McGuire 1963: 259)[^mcguire-1963]. In fact, when health practitioners claim conscientious objection to some medical procedures, they are usually not interested in preventing other doctors who hold different moral beliefs from performing the procedure. They are usually only interested in, so to speak, keeping their hands clean according to their subjective moral standard.
    step1: |-
      最后，良心只涉及道德的 *主观* 维度。即便假定存在某种意义上可被视为客观的伦理价值，良心也只指向个人 *相信* 的东西，与任何外在的客观证据或辩护无关。当人们陈述自己主观上、依良心所相信的东西时，他们承认别人可能（而且很可能会）主观上、依良心地持有不同的道德观点。因此，当我说堕胎侵犯了我的良心时，我并不是在说（尽管我可能这样想）堕胎按某种客观标准在道德上是错的，也未必是在试图说服别人相信堕胎按某种客观标准是错的。我只是在陈述我深所相信的东西，以及我希望别人作为我的良心信念予以尊重的东西，无论我能为我的主张提供怎样的道德理由、这些理由在别人看来是好是坏（McGuire 1963: 259）[^mcguire-1963]。事实上，医疗从业者对某些医疗程序主张依良心拒绝时，通常并不想阻止持不同道德信念的其他医生施行该程序。通常，他们只想按自己的主观道德标准“保持双手干净”，可这么说。
