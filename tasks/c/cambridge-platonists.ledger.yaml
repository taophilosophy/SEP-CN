      The oldest member of the group, Benjamin Whichcote, is usually considered to be the founding father of Cambridge Platonism, having tutored seveal of them at Emmanuel College. During the Civil War period, Whichcote was appointed Provost of King’s College, Cambridge, and he served as Vice Chancellor of the University in 1650. However, he was removed from his post at King’s College at the Restoration in 1660, and was obliged to seek employment elsewhere, as a clergyman in London. The interruption to his academic career may explain why he never published any philosophical treatises as such. The main source for his philosophical views are his posthumously-published sermons and aphorisms. Whichcote’s tolerant, optimistic and rational outlook set the intellectual tone for Cambridge Platonism. Whichcote’s philosophical views are coloured by his repudiation of Calvinist theology. He held that God being supremely perfect is necessarily good, wise and loving. Whichcote regarded human nature as rational and perfectible, and he believed that it is through reason as much as revelation that God communicates with man. ‘God is the most knowable of any thing in the world’ (Patrides, 1969, p.58). Without reason we would have no means of demonstrating the existence of God, and no assurance that revelation is from God. By reason Whichcote did not mean the disputatious logic of the schools but discursive, demonstrative and practical reason enlightened by contemplation of the divine. He held that moral principles are immutable absolutes which exist independently of human minds and institutions, and that virtuous conduct is grounded in reason. Whichcote’s *Aphorisms* amount to a manual of practical ethics which amply illustrates his conviction that the fruit reason is not ‘bare knowledge’ but action, or knowledge which ‘doth go forth into act’. It is through reason that we gain knowledge of the natural world, and recognise natural phenomena as ‘the EFFECTS OF GOD’. Although Whichcote’s published writings do not discuss natural philosophy as such, his recognition of the demonstrative value of natural philosophy for the argument from design anticipates the use of natural philosophy in the apologetics of Cudworth and More.
    step1: |
      该群体中最年长的成员本杰明·惠科特（Benjamin Whichcote），通常被视为剑桥柏拉图主义的奠基人，他曾在伊曼纽尔学院指导过他们中的几位。在内战时期，惠科特被任命为剑桥国王学院（King’s College）的院长，并于 1650 年担任该大学副校长。然而，1660 年王政复辟时他被免去国王学院的职位，不得不另谋生计，在伦敦担任牧师。他学术生涯的中断或许解释了他为何从未出版任何名副其实的哲学论著。其哲学观点的主要来源是他身后出版的布道文和格言。惠科特宽容、乐观而理性的视野为剑桥柏拉图主义奠定了思想基调。惠科特的哲学观点染上了他对加尔文主义神学的拒斥色彩。他认为，上帝作为至善完美的存在，必然善良、智慧而慈爱。惠科特视人性为理性的、可完善的，他相信上帝与人沟通，既通过启示，也同样通过理性。“上帝是世间万物中最可知的”（Patrides, 1969, p.58）。没有理性，我们就无法证明上帝的存在，也无法确信启示来自上帝。惠科特所说的理性，不是经院中的争辩逻辑，而是由对神圣之物的沉思所启明的、推演性的、论证性的和实践性的理性。他认为道德原则是不变的绝对物，独立于人的心灵和制度而存在，且德行行为植根于理性。惠科特的《格言》（*Aphorisms*）相当于一部实践伦理学手册，充分说明了他的信念：理性的果实不是“赤裸的知识”，而是行动，或是“付诸行动”的知识。正是通过理性，我们获得自然界的知识，并把自然现象认作“上帝的作为”。尽管惠科特的已出版著作并未讨论自然哲学本身，但他承认自然哲学对设计论证的论证价值，预示了库德沃斯和莫尔在护教学中对自然哲学的运用。
    step2: |
      本杰明·惠科特（Benjamin Whichcote）是群体中最年长的成员，通常被视为剑桥柏拉图主义的奠基者——他曾在伊曼纽尔学院教导过其中数人。内战时期，惠科特被任命为剑桥国王学院（King’s College）院长，并于 1650 年出任该大学副校长。然而 1660 年王政复辟时，他被解除国王学院之职，不得不另寻出路，在伦敦当牧师。其学术生涯的中断，或许正解释了为何他从未出版过任何真正的哲学论著。他哲学观点的主要来源，是他身后刊行的布道文与格言。惠科特宽容、乐观而理性的眼光，为剑桥柏拉图主义定下了思想基调。他的哲学观点带有拒斥加尔文主义神学的色彩。他认为上帝作为至善完美的存在，必然善良、智慧而慈爱。惠科特视人性为理性的、可完善之物，并相信上帝与人交流，既经由启示，同样也经由理性。“上帝是世间万物中最可知的”（Patrides, 1969, p.58）。若无理性，我们既无从证明上帝存在，也无从确信启示源自上帝。惠科特所谓理性，并非经院中好辩的逻辑，而是受神圣沉思启明的、能推演、能论证、能实践的理性。他主张道德原则是不变的绝对物，独立于人的心灵与制度而存在，德行则植根于理性。惠科特的《格言》（*Aphorisms*）无异于一部实践伦理学手册，充分印证他的信念：理性的果实不是“赤裸的知识”，而是行动，或是“付诸行动”的知识。我们正是经由理性认识自然界，并把自然现象认作“上帝的作为”。惠科特的已刊著作虽未直接讨论自然哲学，但他承认自然哲学对设计论证具有论证价值，这预示了库德沃斯与莫尔在护教学中对自然哲学的运用。
