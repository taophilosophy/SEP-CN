      Much of *TISU* amounts to an extended *consensus gentium* argument for the existence God, demonstrated from an analysis of ancient sources which showed that most ancient philosophers were theists, and therefore that theism is compatible with philosophy. Among the non-theists, Cudworth (1678, p. 165) identifies four schools of atheistic philosophy, each of which is a type of materialism: Hylopathian atheism or materialism, ‘Atomical or Democritical’ atheism, Cosmo-plastic atheism (which makes the world-soul the highest numen), and Hylozoic atheism (which attributes life to matter). Each of these ancient brands of atheism has its latter-day manifestations in philosophers such as Hobbes (an example of a Hylopathian atheist) and Spinoza (a latter-day Hylozoist).
    step1: |
      《TISU》的大部分内容相当于一个为上帝存在而作的扩展的*万民共识*论证，它由对古代来源的分析证明，表明大多数古代哲学家是有神论者，因此有神论与哲学相容。在非有神论者中，库德沃斯（1678, p. 165）区分出四种无神论哲学流派，每一种都是一种物质主义：Hylopathian 无神论或物质主义、‘Atomical or Democritical’无神论、Cosmo-plastic 无神论（它把世界灵魂当作最高的神性），以及 Hylozoic 无神论（它把生命归于物质）。这几种古代无神论，每一种都在霍布斯（Hobbes，一位 Hylopathian 无神论者的例子）和斯宾诺莎（Spinoza，一位后世 Hylozoist）等哲学家中有其当代表现。
    step2: |
      《TISU》的大部分，相当于一个为上帝存在而展开的*万民共识*论证；它经由分析古代材料而证成，表明大多数古代哲学家皆是有神论者，从而有神论与哲学相容。在非有神论者当中，库德沃斯（1678, p. 165）辨别出四种无神论哲学流派，每一类皆属物质主义：Hylopathian 无神论（即物质主义）、‘Atomical or Democritical’（原子的或德谟克利特式）无神论、Cosmo-plastic（宇宙塑形）无神论（它把世界灵魂奉为最高神性），以及 Hylozoic（物活）无神论（它赋予物质以生命）。这几种古代无神论，各自在霍布斯（Hobbes，一位 Hylopathian 无神论者之例）与斯宾诺莎（Spinoza，一位后世 Hylozoist）等哲学家身上有其当代化身。
