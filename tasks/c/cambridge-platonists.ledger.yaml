      In his philosophical writings, More elaborated a philosophy of spirit which explained all the phenomena of mind and of the physical world as the activity of spiritual substance controlling inert matter. More conceived of both spirit and body as spatially extended, but defined spiritual substance as the obverse of material extension: where body is inert and solid, but divisible; spirit is active and penetrable, but indivisible. It was in his correspondence with Descartes that he first expounded his view that all substance, whether material or immaterial, is extended. He went on to argue space is infinite (anticipating that other native of Grantham, Isaac Newton) and that God being an infinite spirit is an extended being (*res extensa*). In *Enchiridion metaphysicum*, he argues that the properties of space are analogous to the attributes of God (infinity, immateriality, immobility etc.).
    step1: |
      在他的哲学著作中，莫尔精心阐述了一种精神哲学，把心灵和物理世界的所有现象都解释为控制惰性物质的精神实体的活动。莫尔认为精神和物体都是空间延展的，但把精神实体定义为物质延展的反面：物体是惰性而坚固的，但可分的；精神是能动的、可穿透的，但不可分的。正是他在与笛卡尔的通信中，首次阐述了他的观点：一切实体，无论物质的还是非物质的，都是延展的。他接着论证空间是无限的（预示了另一位格兰瑟姆本地人艾萨克·牛顿（Isaac Newton）），并且上帝作为无限的精神是一个延展的存在（*res extensa*）。在《形而上学手册》（*Enchiridion metaphysicum*）中，他论证空间的属性类似于上帝的属性（无限性、非物质性、不动性等）。
