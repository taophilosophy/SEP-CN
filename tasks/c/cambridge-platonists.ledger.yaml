      A consistent theme of his philosophical writings, are arguments for demonstrating the existence and providential nature of God. The foundation stone of More’s philosophical and apologetic enterprise is his philosophy of spirit, especially his arguments for the existence of incorporeal causal agents, that is, souls or spirits. He attempted to answer materialists like Thomas Hobbes whom he regarded as an atheist. More’s strategy was to show that the same arguments that materialists use demonstrate the existence and properties of body, also support the obverse, the existence of incorporeal substances. In this way More sought to demonstrate that the *idea* of incorporeal substance, or spirit, was as intelligible as that of corporeal substance, i.e. body. Like Plato (*Laws* 10), More argues that the operations of the nature cannot be explained simply in terms of the chance collision of material particles. Rather we must posit some other source of activity, which More identifies as ‘spirit’. It is a short step, he argues, from grasping the concept of spirit, to accepting the idea of an infinite spirit, namely God.
    step1: |
      他哲学著作的一贯主题，是论证上帝的存在与天意性质。莫尔哲学与护教学事业的基石，是他的精神哲学，尤其是他关于无形因果动因（即灵魂或精神）存在的论证。他试图回答像托马斯·霍布斯（Thomas Hobbes）这样的物质主义者，后者被他视为无神论者。莫尔的策略是表明，物质主义者用来证明物体存在和性质的同样论证，也支持其对立面，即无形实体的存在。通过这种方式，莫尔试图表明，无形实体（即精神）的*观念*，与有形实体（即物体）的观念一样可理解。像柏拉图（*Laws* 10）一样，莫尔论证，自然的运作不能简单地用物质粒子的偶然碰撞来解释。相反，我们必须设定某种其他活动来源，莫尔将其识别为“精神”。他论证，从把握精神的概念到接受无限精神（即上帝）的观念，只是一小步。
    step2: |
      其一贯的哲学主题，是论证上帝的存在及其天意性质。莫尔哲学与护教事业的基石是他的精神哲学，尤其是他关于无形因果动因——即灵魂或精神——存在的论证。他试图回应像托马斯·霍布斯（Thomas Hobbes）这样的物质主义者，后者被他视为无神论者。莫尔的策略是表明：物质主义者用以证明物体存在及其性质的论证，同样支持其反面，即无形实体的存在。如此，莫尔力图表明，无形实体（即精神）的*观念*与有形实体（即物体）的观念同样清晰可解。如同柏拉图（*Laws* 10）一样，莫尔主张，自然的运作无法仅凭物质粒子的偶然碰撞来解释；反之，我们必须设定某种别的活动来源，莫尔名之曰“精神”。他断言，从把握精神这一概念，到接受无限精神（即上帝）这一观念，只差一步之遥。
