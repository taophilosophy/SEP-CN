      More underpins these *a priori* arguments for the existence of spirit, with a wide range of *a posteriori* arguments, taken from observed phenomena of nature to demonstrate the actions of spirit. His excursus into observational method drew on a wide variety of data ranging from experiments conducted by Robert Boyle and members of the Royal Society to supernatural effects including cases of witchcraft and demons. He was censured by Boyle for misappropriating his experiments to endorse his hypothesis of the Spirit of Nature. Although his belief in evil spirits appears inconsistent with his otherwise rational philosophy, it should be remembered that belief in witchcraft was (a) not unusual in his time, and (b) was entirely consistent with the theory of spirit according to which to deny the existence of spirits good or evil, leads, logically to the denial of the existence of God. As he put it, alluding to King James VI & I’s defence of episcopacy, “That saying is no less true in Politicks ‘No Bishop, no King,’ than this in Metaphysicks, ‘No Spirit, no God’ ” (More, 1662, *Antidote*, p. 142). His most well-known fellow-believer in witchcraft was Royal Society member, Joseph Glanvill (1636–1680), whose *Sadducismus triumphatus*, More edited.
    step1: |
      莫尔用大量*后验*论证支撑这些关于精神存在的*先验*论证，这些后验论证取自对自然现象的观察，用以证明精神的活动。他对观察方法的涉猎，利用了多种多样的数据，从罗伯特·波义耳（Robert Boyle）和皇家学会成员进行的实验，到包括巫术和魔鬼案例在内的超自然效应。他因挪用波义耳的实验来支持其“自然精神”假说而受到波义耳的谴责。虽然他相信恶灵的存在，似乎与他其他方面理性的哲学不一致，但应当记住，相信巫术（a）在他那个时代并不罕见，（b）与精神理论完全一致，根据该理论，否认精神（无论善恶）的存在，在逻辑上会导致否认上帝的存在。正如他所说，暗指国王詹姆斯六世及一世（King James VI & I）对主教制的辩护：“在政治中‘无主教，无国王’这句话，与在形而上学中‘无精神，无上帝’这句话同样真实”（More, 1662, *Antidote*, p. 142）。他最著名的相信巫术的同道，是皇家学会成员约瑟夫·格兰维尔（Joseph Glanvill，1636–1680），莫尔编辑了他的《萨杜塞主义之胜利》（*Sadducismus triumphatus*）。
