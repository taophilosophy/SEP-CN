      The ‘new psychology’ which Cudworth elaborates in relation to this proposes an integrative power of the soul or *hegemonikon*, which coordinates the higher intellectual functions of the soul, will and reason with the lower, animal, appetites of the soul. Furthermore, Cudworth conceives of the *hegemonikon* not simply as the soul but the whole person, ‘that which is properly we ourselves’ (Cudworth, 1996, p. 178). Cudworth’s concept of *hegemonikon* lays the basis for a concept of self identity founded in a subject that is at once thinking, autonomous and end-directed. His unpublished papers show that he was developing a new psychological theory, which did not complete, Cudworth did not (as far as is known) develop a political philosophy. However, the political implications of his ethical theory set him against Hobbes, but also, in many ways anticipate John Locke.
    step1: |
      库德沃斯就此阐述的“新心理学”，提出一种灵魂的整合能力或*hegemonikon*，它协调灵魂的高级理智功能（意志和理性）与灵魂低级的动物性欲求。此外，库德沃斯认为*hegemonikon*不只是灵魂，而是整个的人，“严格说来就是我们自己”（Cudworth, 1996, p. 178）。库德沃斯的*hegemonikon*概念，为一种建立在既是思维着的、自主的又是目的导向的主体之上的自我同一性概念奠定了基础。他的未出版文稿表明，他正在发展一种新的心理学理论，但未完成；库德沃斯（就所知而言）没有发展政治哲学。然而，其伦理理论的政治含义使他与霍布斯对立，但在许多方面预示了约翰·洛克。
