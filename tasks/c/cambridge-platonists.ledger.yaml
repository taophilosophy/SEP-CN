      Among the immediate philosophical heirs of the Cambridge Platonists, mention should be made of two distinguished women: Henry More’s pupil, Anne Conway (1631–1679) and Cudworth’s daughter, Damaris Masham. Conway’s *Principles of the Most Ancient and Modern Philosophy* (1692) includes a critique of More’s dualistic philosophy of spirit, proposing instead a metaphysical monism. Damaris Masham published two works: *A Discourse Concerning the Love of God* (1696) and *Occasional Thoughts in Reference to a Virtuous and Christian Life* (1705). Another figure linked to More was John Norris (1657–1712) who was to become the leading English exponent of the philosophy of Malebranche. Whichcote’s philosophical wisdom was admired by Anthony Ashley Cooper, third Earl of Shaftesbury who published his *Select Sermons* in 1698.
