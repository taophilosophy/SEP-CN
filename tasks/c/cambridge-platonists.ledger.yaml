      The intellectual legacy of the Cambridge Platonists extends not just to philosophical debate in seventeenth-century England but to the Scottish Enlightenment, the European Enlightenment and into the nineteenth century. The evidence from publication and citation shows that their philosophical influence was more far-reaching than is generally recognised in modern histories of philosophy. Culverwell’s *Discourse* was reprinted four times, including at Oxford. The works of More and Cudworth’s works were known beyond the English-speaking world thanks to Latin translations: More’s *Opera omnia* appeared in 1675–9; a Latin translation of Cudworth’s published writings by Johann Lorenz Mosheim was published in Jena in 1733. The impact of Cudworth on Locke has yet to be fully investigated. Richard Price, and Thomas Reid were both indebted to Cudworth. Leibniz certainly read Cudworth’s theory of Plastic Nature which was taken up in vitalist debates in the French enlightenment.
    step1: |
      剑桥柏拉图主义者的思想遗产，不仅延伸到十七世纪英格兰的哲学论辩，也延伸到苏格兰启蒙运动、欧洲启蒙运动，乃至十九世纪。出版与引用的证据表明，他们的哲学影响比现代哲学史通常承认的更为深远。卡弗韦尔的《论述》被重印了四次，包括在牛津。莫尔和库德沃斯的著作，得益于拉丁文译本而超越了英语世界：莫尔的《全集》（*Opera omnia*）于 1675–9 年间问世；库德沃斯已出版著作的拉丁文译本，由约翰·洛伦茨·莫斯海姆（Johann Lorenz Mosheim）于 1733 年在耶拿出版。库德沃斯对洛克的影响尚待充分研究。理查德·普莱斯（Richard Price）和托马斯·里德（Thomas Reid）都受惠于库德沃斯。莱布尼茨（Leibniz）肯定读过库德沃斯的塑形自然理论，该理论在法国启蒙运动的活力论论辩中被采纳。
