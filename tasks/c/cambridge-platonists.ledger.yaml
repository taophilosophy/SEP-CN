      Whichcote’s optimism about human reason and his view of the compatibility of philosophy and religion are shared by the other Cambridge Platonists, all of whom affirmed the compatibility of reason and faith. The fullest statement of this position is Henry More’s *The Apology of Henry More* (1664) which sets out rules for the application of reason in religious matters, stipulating the use of only those ‘Philosophick theorems’ which are ‘solid and rational in themselves, nor really repugnant to the word of God’. Like Whichcote, Peter Sterry, John Smith and Nathaniel Culverwell are known only through posthumously published writings. The first published treatise by any of the Cambridge Platonists was Nathaniel Culverwell’s *An Elegant and Learned Discourse of the Light of Nature* of 1652. Like the other Cambridge Platonists Culverwell emphasises the freedom of the will and argues that the mind is furnished with ‘clear and indelible Principles’ and reason an ‘intellectual lamp’ placed in the soul by God to enable it to understand God’s will promulgated in the law of nature. These principles of the mind also include moral principles. The soul is a divine spark, which derives knowledge by inward contemplation, and experience. Like the other Cambridge Platonists, Culverwell held that goodness is intrinsic to all things, and that moral principles do not depend on the will of God. He nevertheless underscored the importance of natural law as the foundation of moral obligation. His eclectic range of sources (Aristotelian, scholastic and stoic, as well as Plato and Plotinus) and his criticisms of Plato (e.g. theory of anamnesis)has lead to denial that he was a Cambridge Platonist (Patrides 1980, Gabbey 1980, Laerke 2023). However, these features are common to all them, and characteristic of the Renaissance Platonist, Agostino Steuco’s *De perenni philosophia* was one of Culverwell’s sources.
    step1: |
      惠科特关于人类理性的乐观态度，以及他关于哲学与宗教相容性的观点，为其他剑桥柏拉图主义者所共享，他们都肯定理性与信仰的相容性。这一立场最充分的表述是亨利·莫尔（Henry More）的《亨利·莫尔的辩护》（*The Apology of Henry More*，1664），该书制定了在宗教事务中运用理性的规则，规定只能使用那些“本身坚实而合理、且并不真正违背上帝之道”的“哲学定理”。与惠科特一样，彼得·斯特里（Peter Sterry）、约翰·史密斯（John Smith）和纳撒尼尔·卡弗韦尔（Nathaniel Culverwell）仅通过身后出版的著作为人所知。剑桥柏拉图主义者中最早出版的论著，是纳撒尼尔·卡弗韦尔的《关于自然之光的优雅而博学的论述》（*An Elegant and Learned Discourse of the Light of Nature*，1652 年）。像其他剑桥柏拉图主义者一样，卡弗韦尔强调意志自由，并论证心灵配备有“清晰而不可磨灭的原则”，理性则是上帝置于灵魂之中、使其能够理解上帝在自然法中颁布的旨意的“理智之灯”。心灵这些原则也包括道德原则。灵魂是神圣的火花，通过内在沉思和经验获得知识。像其他剑桥柏拉图主义者一样，卡弗韦尔认为善内在于万物，道德原则不依赖于上帝的意志。尽管如此，他强调自然法作为道德义务的基础的重要性。他来源的折衷范围（亚里士多德的、经院的和斯多亚的，以及柏拉图和普罗提诺的）以及他对柏拉图的批评（例如回忆说），已导致有人否认他是剑桥柏拉图主义者（Patrides 1980, Gabbey 1980, Laerke 2023）。然而，这些特征为所有他们共同具有，并且是文艺复兴柏拉图主义者的特征，阿戈斯蒂诺·斯图科（Agostino Steuco）的《论永恒哲学》（*De perenni philosophia*）是卡弗韦尔的来源之一。
    step2: |
