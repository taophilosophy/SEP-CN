      More also published a short treatise on ethics entitled *Enchiridion Ethicum* (translated as *An Account of Virtue*), which was probably intended for to be used as a textbook. Indebted to Descartes’ theory of the passions this argues that knowledge of virtue is attainable by reason, and the pursuit of virtue entails the control of the passions by the soul. Motivation to good is supplied by rightly-directed emotion, while virtue is achieved by the exercise free will or *autoexousy* (More uses the same term as Cudworth), that is the ‘Power to act or not act within ourselves’. Anticipating Shaftesbury’s concept of moral sense More posits a special faculty of the soul combining reason and sensation which he calls the ‘Boniform Faculty’.
    step1: |
      莫尔还出版了一部题为《伦理学手册》（*Enchiridion Ethicum*，译作《德性之述》（*An Account of Virtue*））的伦理学短论，此书大概意在用作教科书。它受惠于笛卡尔的情感理论，论证德性之知可由理性获得，而追求德性涉及灵魂对激情的控制。向善的动力由正确导向的情感提供，而德性通过行使自由意志或*autoexousy*（莫尔与库德沃斯使用同一术语）来达成，即“在我们自身之内行动或不行动的能力”。预示沙夫茨伯里的道德感概念，莫尔预设灵魂有一种结合理性与感觉的特殊官能，他称之为“德性官能”。
