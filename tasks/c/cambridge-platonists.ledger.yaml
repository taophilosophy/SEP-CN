      Cudworth’s theory of the mind as active is matched by an anti-determinist ethics of action, according to which the soul freely directs itself towards the good. In *TEIM* Cudworth argues not only that ideas exist independently of human minds, but also the principles of morality are eternal and immutable. In a concerted attack on Hobbesian moral relativism, Cudworth, argues that the criteria of right and wrong, good and evil, justice and injustice are not a matter of convention, but are founded in the goodness and justice of God. Like Plato in the *Euthyphro*, Cudworth argues that it is not God’s will that determines goodness, but that God wills things because they are good. The exercise of virtue is not, however, a passive process, but requires the free exercise of the individual will. Cudworth never completed his moral philosophy, which was intended as a second part of *TISU*. A substantial part of this survives in manuscript, from among which *TEIM* and *TFW* were published posthumously. In *TFW* and two still-unpublished manusripts on ‘Liberty and Necessity’, Cudworth sets out his theory of free will, according to which the will is not a faculty of the soul, distinct from reason, but a power of the soul which combines the functions of both reason and will in order to direct the soul towards the good. Cudworth’s use of the terms ‘hegemonikon’ (taken from Stoicism) and ‘autexousion’ (taken from Plotinus) underlines the fact that the exercise of will entails the power to act. It is internal direction, not external compulsion that induces us to act either morally or immorally. Without the freedom (and therefore power) to of act, there would be no moral responsibility. Moral conduct is active, not passive. Virtuous action is therefore a matter of active internal self-determination, rather than determination from without.
