    source: |
      The Cambridge Platonists were a cluster of English seventeenth-century thinkers associated with the University of Cambridge. The most important philosophers among them were Henry More (1614–1687) and Ralph Cudworth (1617–1688). The group also included Benjamin Whichcote (1609–1683), Peter Sterry (1613–1672), John Smith (1618–1652), Nathaniel Culverwell (1619–1651), and John Worthington (1618–1671). All of them studied at Emmanuel College, Cambridge, apart from More who studied at Christ’s College, Cambridge, where Cudworth was later appointed Master. Their wider circle included George Rust, Henry Hallywell, Anne Conway and John Norris, as well as Joseph Glanvill and Nathaniel Ingelo. At a time of political turbulence (Civil Wars and their aftermath), they developed their philosophical views against a background of the Calvinistic scholasticism which prevailed at Cambridge in their formative years. In metaphysics, epistemology, psychology and ethics they contributed original and innovative ideas on major themes of seventeenth-century philosophy: materialism, determinism, scepticism, causation, and such topics as consciousness, the nature of virtue, and infinite space. They held the eternal existence of moral principles and that the truths of the mind are superior to sense knowledge. Their optimistic view of human capacities is underscored by their high regard for human reason and the freedom of the will. Their anti-determinism led them to propose arguments for human autonomy. At a time when philosophy in the universities was considered the handmaid of theology, they devoted their considerable philosophical learning to defending the existence of God and the immortality of the soul, and to formulating a practical ethics.
    step1: |
      剑桥柏拉图学派是一群十七世纪英格兰的思想家，与剑桥大学有联系。他们中最重要的哲学家是亨利·莫尔（Henry More，1614–1687）和拉尔夫·库德沃斯（Ralph Cudworth，1617–1688）。该群体还包括本杰明·惠科特（Benjamin Whichcote，1609–1683）、彼得·斯特里（Peter Sterry，1613–1672）、约翰·史密斯（John Smith，1618–1652）、纳撒尼尔·卡弗韦尔（Nathaniel Culverwell，1619–1651）和约翰·沃辛顿（John Worthington，1618–1671）。他们都在剑桥的伊曼纽尔学院（Emmanuel College）学习，只有莫尔就读于剑桥的基督学院（Christ’s College），库德沃斯后来被任命为该学院院长。他们更广的圈子包括乔治·拉斯特（George Rust）、亨利·哈利韦尔（Henry Hallywell）、安妮·康威（Anne Conway）和约翰·诺里斯（John Norris），以及约瑟夫·格兰维尔（Joseph Glanvill）和纳撒尼尔·英杰洛（Nathaniel Ingelo）。在政治动荡的时代（内战及其余波），他们在其成长期盛行于剑桥的加尔文主义经院哲学背景下发展其哲学观点。在形而上学、认识论、心理学和伦理学中，他们对十七世纪哲学的主要主题贡献了原创而创新的观念：物质主义、决定论、怀疑论、因果关系，以及意识、德性的本质、无限空间等论题。他们认为道德原则永恒存在，并且心灵的真理高于感官知识。他们对人的能力的乐观看法，以他们对人类理性和意志自由的高度尊重为支撑。他们的反决定论促使他们提出人类自主性的论证。在一个哲学在大学中被视为神学侍女的时代，他们将其可观的哲学学识用于捍卫上帝的存在和灵魂的不朽，并用于制定一种实践伦理学。
    step2: |
      剑桥柏拉图学派是十七世纪英格兰一批与剑桥大学相关联的思想家。其中最重要的哲学家是亨利·莫尔（Henry More，1614–1687）与拉尔夫·库德沃斯（Ralph Cudworth，1617–1688）。群体中还有本杰明·惠科特（Benjamin Whichcote，1609–1683）、彼得·斯特里（Peter Sterry，1613–1672）、约翰·史密斯（John Smith，1618–1652）、纳撒尼尔·卡弗韦尔（Nathaniel Culverwell，1619–1651）与约翰·沃辛顿（John Worthington，1618–1671）。他们皆就学于剑桥的伊曼纽尔学院（Emmanuel College），唯莫尔就读于剑桥的基督学院（Christ’s College），库德沃斯后来出任该院院长。其更广泛的交往圈子包括乔治·拉斯特（George Rust）、亨利·哈利韦尔（Henry Hallywell）、安妮·康威（Anne Conway）、约翰·诺里斯（John Norris），以及约瑟夫·格兰维尔（Joseph Glanvill）与纳撒尼尔·英杰洛（Nathaniel Ingelo）。身处政治动荡（内战及其余波）的年代，他们在自己成长岁月里盛行于剑桥的加尔文主义经院哲学背景下形成了哲学见解。在形而上学、认识论、心理学与伦理学诸领域，他们围绕十七世纪哲学的重大主题提出了原创而新颖的看法：物质主义、决定论、怀疑论、因果关系，以及意识、德性的本质、无限空间等论题。他们主张道德原则永恒存在，并认为心灵之真理优于感官之知。他们对人的能力之所以持乐观态度，正由于他们对人类理性与意志自由格外推崇。其反决定论立场促使他们提出关于人类自主性的论证。在那个大学哲学被视为神学附庸的时代，他们倾其渊博的哲学学识，致力于捍卫上帝存在与灵魂不朽，并构建一种实践伦理学。
