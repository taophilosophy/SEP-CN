      They did not self-identify as a group or as Platonists (they only came to be referred to as such in the eighteenth century). But in so far as they held the philosophy of Plato and Plotinus in high regard, and adopted principles of Platonist epistemology and metaphysics, the designation ‘Platonist’ is apt. (I take Platonism to include Neoplatonism, as they did). But their recourse to Platonism was selective and should not be understood as antiquarianism, or antithetical to science. They drew on a wide range of philosophical sources besides Platonism. For example, among ancient philosophers, they were well acquainted with Aristotle and with Stoicism. In this respect they shared the Renaissance Humanists’ regard for the achievements of ancient philosophy, and sense of its relevance of to contemporary life. At the same time, they were very much abreast of new developments in philosophy and science. They engaged with Descartes, Hobbes and Spinoza as well as with Bacon, Boyle and the Royal Society. Smith, Culverwell, Cudworth and More were among the first Englishmen to read Descartes. They accepted post-Galilean science, and were receptive to an atomistic account of matter. But they repudiated the new mechanistic natural philosophy in favour of the view the fundamental causal principle in the operations of nature is some form of immaterial agent or spirit. Both More and Cudworth were fellows of the Royal Society. The framework within which they read and understood both ancient and modern philosophy was that of the ‘perennial philosophy’ (*philosophia perenni*s) adopted by Italian Renaissance philosophers such as Marsilio Ficino, and Agostino Steuco, but also employed by Gottfried Wilhelm Leibniz. They also emphatically repudiated the scholasticism that prevailed in academic philosophy and took a lively interest in the developments that brought about the scientific revolution. They deserve to be considered part of the philosophical revolution of the seventeenth century, especially since they sought an alternative philosophical foundation to Aristotelianism which was waning fast in the face of challenges from scepticism and competing alternative philosophies, notably those of Hobbes and Descartes.
    step1: |
      他们并不自我认同为一个群体或一群柏拉图主义者（他们只是到十八世纪才被如此称呼）。但就他们高度推崇柏拉图（Plato）与普罗提诺（Plotinus）的哲学、并采纳柏拉图主义认识论与形而上学的原则而言，“Platonist”这一称谓是恰当的。（我把柏拉图主义理解为涵盖新柏拉图主义，正如他们所理解的那样。）但他们诉诸柏拉图主义是有选择的，不应被理解为崇古癖，也不应被理解为与科学对立。除了柏拉图主义，他们还利用了广泛的哲学来源。例如，在古代哲学家当中，他们熟谙亚里士多德（Aristotle）与斯多亚主义（Stoicism）。在这方面，他们分享了文艺复兴人文主义者对古代哲学成就的重视，以及其对古代哲学与当代生活相关性的感受。同时，他们非常紧跟哲学与科学的新发展。他们与笛卡尔（Descartes）、霍布斯（Hobbes）和斯宾诺莎（Spinoza）论战，也与培根（Bacon）、波义耳（Boyle）和皇家学会（Royal Society）论战。史密斯、卡弗韦尔、库德沃斯和莫尔是最早阅读笛卡尔的英国人中的几位。他们接受后伽利略科学，并对物质的原子论说明持开放态度。但他们拒斥新的机械论自然哲学，转而赞成这样的观点：自然运作中的基本因果原则是某种无形动因或精神（spirit）。莫尔和库德沃斯都是皇家学会会员。他们阅读和理解古代与现代哲学的框架，是意大利文艺复兴哲学家如马尔西利奥·菲奇诺（Marsilio Ficino）和阿戈斯蒂诺·斯图科（Agostino Steuco）所采纳、也被戈特弗里德·威廉·莱布尼茨（Gottfried Wilhelm Leibniz）所使用的“perennial philosophy”（*philosophia perenni*s）。他们也坚决拒斥学院哲学中盛行的经院哲学，并对带来科学革命的发展抱有浓厚兴趣。他们应当被视为十七世纪哲学革命的一部分，尤其是因为他们寻求为亚里士多德主义（Aristotelianism）提供另一种哲学基础，而亚里士多德主义在面对怀疑论以及霍布斯和笛卡尔等竞争性替代哲学的挑战时正迅速衰落。
    step2: |
      他们并不把自己认同为一个群体或一群柏拉图主义者——他们只是到十八世纪才被如此称呼。但就他们尊崇柏拉图（Plato）与普罗提诺（Plotinus）的哲学、并采纳柏拉图主义认识论与形而上学原则而言，“柏拉图主义者”这一称谓是恰当的。（我与他们一样，把柏拉图主义理解为涵盖新柏拉图主义。）然而，他们对柏拉图主义的援引是有选择的，不应被理解为崇古倾向，也不应视为与科学相悖。除柏拉图主义外，他们还取材于广泛的哲学来源。例如在古代哲学家中，他们熟悉亚里士多德（Aristotle）与斯多亚主义（Stoicism）。在这一方面，他们与文艺复兴人文主义者一样看重古代哲学的成就，并感到它与当代生活息息相关。与此同时，他们又十分紧跟哲学与科学的新进展。他们与笛卡尔（Descartes）、霍布斯（Hobbes）、斯宾诺莎（Spinoza）交锋，也与培根（Bacon）、波义耳（Boyle）和皇家学会（Royal Society）往还。史密斯、卡弗韦尔、库德沃斯与莫尔是最早研读笛卡尔的英国人中的几位。他们接受后伽利略科学，也乐于接纳对物质的原子论说明。但他们拒斥新的机械论自然哲学，转而主张：自然运作中的根本因果原则，是某种无形动因或精神（spirit）。莫尔与库德沃斯均为皇家学会会员。他们阅读并理解古代与现代哲学的框架，是意大利文艺复兴哲学家如马尔西利奥·菲奇诺（Marsilio Ficino）、阿戈斯蒂诺·斯图科（Agostino Steuco）所采纳，也为戈特弗里德·威廉·莱布尼茨（Gottfried Wilhelm Leibniz）所使用的“perennial philosophy”（*philosophia perenni*s）。他们也断然拒斥学院哲学中盛行的经院哲学，并对催生科学革命的种种发展抱有浓厚兴趣。他们有理由被视为十七世纪哲学革命的一部分，尤其是因为他们寻求为亚里士多德主义（Aristotelianism）另立哲学根基，而后者在怀疑论的挑战与霍布斯、笛卡尔等竞争性哲学的冲击下正急速衰落。
