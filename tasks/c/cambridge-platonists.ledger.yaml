      As the first philosophers to write primarily and consistently in the English language (preceded only by Sir Kenelm Digby), the impact of the Cambridge Platonists is still felt in English philosophical terminology, through their coinage of such familiar terms as ‘materialism‘, ‘consciousness‘, and ‘Cartesianism‘. Although their critique of Descartes, Hobbes, Spinoza has ensured that they are never completely ignored in philosophical history, their contribution to philosophy has been under-appreciated especially in the 20th century, when their philosophical interests and style of argument were out of kilter with modern analytic philosophy. Like other non-canonical philosophers they have been poorly served by narrowly canonical approaches to the history of philosophy. They were dismissed as out of touch with mainstream philosophy (most notoriously by Ernst Cassirer and Alexandre Koyré). Their religious interests has led to them being regarded as primarily theologians, or even clergymen or mystics (a tendency which persists even today). Latterly, however, a revival of interest is underway, thanks to better-informed and more historically nuanced approaches to the history of philosophy (see Darwall 1995, Beiser 1996, Gill 2006, Irwin 2008, Pasnau 2011, Hutton 2015, Kaldas 2024)[^beiser-1996][^hutton-2015][^hutton-2015-2][^irwin-2008][^pasnau-2011].
    step1: |
      作为最早主要以英文写作的一批哲学家（仅先于肯内尔姆·迪格比爵士（Sir Kenelm Digby）），剑桥柏拉图主义者的影响至今仍能在英语哲学术语中感受到，通过他们铸造的诸如“物质主义”、“意识”和“笛卡尔主义”等熟悉术语。尽管他们对笛卡尔、霍布斯、斯宾诺莎的批判，确保了他们从未在哲学史上被完全忽视，但他们对于哲学的贡献一直未获足够重视，尤其是在 20 世纪，当时他们的哲学旨趣和论证风格与现代分析哲学不合拍。像其他非正典哲学家一样，他们被狭隘正典式的哲学史研究法所亏待。他们被斥为脱离主流哲学（最著名的是 Ernst Cassirer 和 Alexandre Koyré）。他们的宗教兴趣导致他们主要被视为神学家，甚至牧师或神秘主义者（这种倾向至今犹存）。然而，晚近以来，得益于对哲学史更见多识广、更具历史细化的研究法，兴趣的复兴正在进行（参见 Darwall 1995, Beiser 1996, Gill 2006, Irwin 2008, Pasnau 2011, Hutton 2015, Kaldas 2024）[^beiser-1996][^hutton-2015][^hutton-2015-2][^irwin-2008][^pasnau-2011]。
    step2: |
      作为最早主要且持续用英文写作的哲学家（仅肯内尔姆·迪格比爵士（Sir Kenelm Digby）早于他们），剑桥柏拉图主义者的影响至今仍见诸英语哲学术语，例如他们铸造的“物质主义”“意识”“笛卡尔主义”等习见词汇。尽管他们对笛卡尔、霍布斯、斯宾诺莎的批判，确保他们在哲学史上从未被完全遗忘，但其哲学贡献始终未获应有之重视，尤以 20 世纪为甚——彼时他们的哲学旨趣与论辩风格，与现代分析哲学格格不入。如同其他非正典哲学家，他们被狭隘正典式的哲学史进路所亏待，被斥为脱离主流（最著名者如 Ernst Cassirer 与 Alexandre Koyré）。其宗教旨趣又使人们多半视之为神学家，乃至牧师或神秘主义者（这一倾向至今犹存）。所幸近来，得益于对哲学史更为博洽、更具历史纵深的理解，对它们的兴趣正重新兴起（见 Darwall 1995, Beiser 1996, Gill 2006, Irwin 2008, Pasnau 2011, Hutton 2015, Kaldas 2024）[^beiser-1996][^hutton-2015][^hutton-2015-2][^irwin-2008][^pasnau-2011]。
