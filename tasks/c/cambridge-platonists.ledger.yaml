      Peter Sterry’s only philosophical work, his posthumously-published *A Discourse of the Freedom of the Will* (1675), is the most visionary of all the writings of the Cambridge Platonists. Sterry was deeply involved with events outside Cambridge as chaplain first to the Parliamentary leader, Lord Brooke, and then to the Lord Protector, Oliver Cromwell. After the death of Cromwell he retired to a Christian community in East Sheen. In his *Discourse* Sterry argues that to act freely consists in acting in accordance with ones nature, appropriately to ones level of being, be that plant, animal or intellectual entity. Human liberty is grounded in the divine essence and entails liberty of the understanding and of the will.
