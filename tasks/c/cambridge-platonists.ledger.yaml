      Cudworth’s philosophical system combines atomist natural philosophy with Platonist metaphysics. Cudworth adopts the then current view that atomism originated with Moses from whom it was transmitted via Pythagoras to Greek and other philosophers, including Descartes whom Cudworth regarded as a reviver of Mosaic atomism. For Cudworth, as for Plato, soul is ontologically prior to the physical world. Since motion, life, thought and action cannot be explained in terms of material particles, haphazardly jolted together, there must be some guiding originator, namely soul or spirit. In order to account for movement, life and orderliness in the operations of nature, Cudworth proposed his hypothesis of ‘the Plastick Life of Nature’. Similar in conception to More’s Spirit of Nature, Cudworth’s Plastic Nature is a formative principle which acts as an intermediary between the divine and the natural world, as the means whereby God imprints His presence on his creation and makes His wisdom and goodness manifest (and therefore intelligible) throughout created nature.
    step1: |
      库德沃斯的哲学体系把原子论自然哲学与柏拉图主义形而上学结合起来。库德沃斯采纳了当时流行的观点：原子论起源于摩西，经由毕达哥拉斯传至希腊和其他哲学家，包括笛卡尔，库德沃斯视其为摩西原子论的复兴者。对库德沃斯来说，正如对柏拉图一样，灵魂在本体论上先于物理世界。由于运动、生命、思想和行动不能用力学上胡乱碰撞在一起的物质粒子来解释，必须存在某种引导性创始者，即灵魂或精神。为了说明自然运作中的运动、生命和秩序性，库德沃斯提出了他的“自然的塑形生命”假说。与莫尔的“自然精神”在概念上相似，库德沃斯的“塑形自然”是一个塑形原则，充当神圣者与自然世界之间的中介，是上帝把他的临在印刻在其创造物上、并使其智慧与善良（因而可理解）彰显于整个被造自然的手段。
    step2: |
      库德沃斯的哲学体系，将原子论自然哲学与柏拉图主义形而上学熔为一炉。他采纳当时通行的看法：原子论源自摩西（Moses），经毕达哥拉斯（Pythagoras）传至希腊与其他哲学家，包括被他视为摩西原子论复兴者的笛卡尔（Descartes）。在库德沃斯看来，一如在柏拉图（Plato）看来，灵魂在本体论上先于物理世界。既然运动、生命、思想与行动无法用偶然碰撞在一起的物质粒子来说明，就必有一种引导性的创始者，即灵魂或精神。为了解释自然运作中的运动、生命与秩序，库德沃斯提出“自然的塑形生命”（the Plastick Life of Nature）假说。其构想与莫尔的“自然精神”（Spirit of Nature）相似；库德沃斯的“塑形自然”（Plastic Nature）是一种塑形原则，充当神圣者与自然世界之间的中介，上帝借以把其临在铭印于创造物，使其智慧与善良（因而可理解）彰显于整个被造自然。
