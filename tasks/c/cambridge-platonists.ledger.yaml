      More’s concept of spirit includes not just the souls of living creatures and God himself, but the main intermediate causal agent of the cosmos, the Spirit of Nature (or ‘Hylarchic Principle’). Conceived as the interface between the divine and the material, the Spirit of Nature is a ‘Superintendant Cause’ which combines efficient and teleological causality to ensure the smooth-running of the universe according to God’s plan. It can also be understood as encapsulating ‘certain general Modes and Lawes of Nature’ (More, *A Collection*, Preface, p. xvi) since it is the Spirit of Nature that is responsible for uniting individual souls with bodies, and for ensuring the regular operation of non-animate nature. More sought, by this hypothesis, to account for phenomena that apparently defy the laws of mechanical physics (for example the inter-vortical trajectory of comets, the sympathetic vibration of strings and tidal motion). More underpinned his soul-body dualism by his theory of ‘vital congruity’ which explains soul-body interaction as a sympathetic attraction between soul and body engineered by the operation the Spirit of Nature.
    step1: |
      莫尔的精神概念不仅包括生物的灵魂和上帝本身，还包括宇宙的主要中介因果动因，即“自然精神”（或“质料原则”）。自然精神被构想为神圣与物质之间的界面，是一个“监督因”，它结合动力因和目的论的因果性，以确保宇宙按照上帝的计划顺畅运行。它也可以被理解为包含“自然的一般样式与法则”（More, *A Collection*, Preface, p. xvi），因为正是自然精神负责把个体灵魂与物体结合起来，并确保无生命自然的规则运作。莫尔试图通过这一假说来说明那些显然违背机械物理学规律的现象（例如彗星的旋涡间轨迹、弦的共振振动和潮汐运动）。莫尔用他的“生命契合”理论支撑其心物二元论，该理论把心物相互作用解释为由自然精神运作所设计的灵魂与物体之间的交感吸引。
    step2: |
      莫尔的精神概念，不仅涵盖生物的灵魂与上帝自身，还包括宇宙的主要中介性因果动因——“自然精神”（或“质料原则”）。自然精神被设想为神圣者与物质之间的接界面，是一个“监督因”，兼具动力因与目的论的因果性，以确保宇宙依上帝的计划平稳运行。它亦可被理解为蕴含着“自然的一般样式与法则”（More, *A Collection*, Preface, p. xvi），因为正是自然精神负责把个体灵魂与物体联结起来，并保证无生命自然的常轨运作。莫尔借这一假说，去解释那些显然有违机械物理学规律的现象（如彗星的旋涡间轨迹、弦的共振振动与潮汐运动）。他以其“生命契合”理论为心物二元论奠基——该理论把心物相互作用，解释为灵魂与物体之间、由自然精神之运作所促成的交感吸引。
