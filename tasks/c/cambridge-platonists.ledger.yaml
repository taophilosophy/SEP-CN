      心灵先于世界的柏拉图主义原则，是库德沃斯认识论的基石，该认识论在《TEIM》中讨论。这是剑桥柏拉图主义者中发展得最充分的知识理论，也是任何十七世纪哲学家对天赋观念论最广泛的论述。对库德沃斯来说，正如对柏拉图一样，理念和道德原则“是永恒而自我持存的事物”。外部世界内在地是可理解的，因为它在各组成部分的秩序和关系中带有其创造者的印记，作为原型对摹本。认知依赖于同样的原则，因为正如被造世界是神圣原型的摹本，人的心灵也含有神圣智慧与知识的印记。由于人的心灵映照上帝的心灵，它预先备有理念和推理能力。因此，认知包含回忆，心灵用以思维的事物之理念，因而是“预想”——对此库德沃斯采用斯多亚术语*prolepsis*。认知不是被动的过程，而是包含心灵的主动参与。虽然先天知识是唯一真正的知识，库德沃斯并不拒绝感官知识，因为感官输入对关于物体和外部世界的知识是必不可少的。然而，未经处理的感官数据本身不是知识，因为它需要心智加工才能成为知识。正如库德沃斯所说，除非我们知道如何阅读，否则无法理解自然之书。
