      Like his friend Henry More, Ralph Cudworth spent his entire career as a teacher at the University of Cambridge, ending up as Master of Christ’s College. Cudworth published only one major work of philosophy in his lifetime, *The True Intellectual System of the Universe* (1678) (*TISU*). Among the papers he left at his death, were the treatises published posthumously as *A Treatise Concerning Eternal and Immutable Morality* (1731) (*TEIM*) and his *A Treatise of Freewill* (1848). Two further manuscript treatises on the topic of ‘Liberty and Necessity’, remain unpublished to this day.
    step1: |
      与他的朋友亨利·莫尔一样，拉尔夫·库德沃斯（Ralph Cudworth）一生都在剑桥大学担任教师，最终出任基督学院院长。库德沃斯一生只出版了一部主要哲学著作，《宇宙的真正理智体系》（*The True Intellectual System of the Universe*，1678）（*TISU*）。在他去世时留下的文稿中，有身后出版的《论永恒不变的道德》（*A Treatise Concerning Eternal and Immutable Morality*，1731）（*TEIM*）和《论自由意志》（*A Treatise of Freewill*，1848）。另外两部关于“自由与必然”主题的手稿论著，至今仍未出版。
    step2: |
      如同其友亨利·莫尔，拉尔夫·库德沃斯（Ralph Cudworth）毕生执教于剑桥大学，官至基督学院院长。库德沃斯一生仅刊行一部重要哲学著作，即《宇宙的真正理智体系》（*The True Intellectual System of the Universe*，1678）（*TISU*）。在他身后遗留的文稿中，有身后问世的《论永恒不变的道德》（*A Treatise Concerning Eternal and Immutable Morality*，1731）（*TEIM*），以及《论自由意志》（*A Treatise of Freewill*，1848）。另有两部题为“自由与必然”的手稿论著，至今未刊。
