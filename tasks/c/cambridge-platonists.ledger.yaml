      库德沃斯关于心灵能动的理论，与一种反决定论的行动伦理学相匹配，根据该伦理学，灵魂自由地朝向善。在《TEIM》中，库德沃斯论证，不仅理念独立于人的心灵而存在，而且道德原则是永恒不变的。在对霍布斯式道德相对主义的集中攻击中，库德沃斯论证，对与错、善与恶、正义与不正义的标准不是约定问题，而是建立在上帝的善良与公正之上。像柏拉图在《游叙弗伦》（*Euthyphro*）中一样，库德沃斯论证，不是上帝的意志决定善，而是上帝意愿事物因为它们是善的。然而，德性的践行不是被动的过程，而是需要个体意志的自由行使。库德沃斯从未完成其道德哲学，它原定作为《TISU》的第二部分。其中相当一部分以手稿形式存留下来，《TEIM》和《TFW》从中身后出版。在《TFW》和两部仍未出版的关于“自由与必然”的手稿中，库德沃斯阐述了他的自由意志理论，根据该理论，意志不是与理性相区别的灵魂官能，而是一种灵魂的能力，它结合理性和意志两者的功能，以引导灵魂朝向善。库德沃斯使用‘hegemonikon’（取自斯多亚主义）和‘autexousion’（取自普罗提诺）这两个术语，强调了一个事实：意志的行使蕴含行动的能力。正是内在引导，而非外在强制，促使我们道德地或不道德地行动。没有行动的自由（因而力量），就不会有道德责任。道德行为是能动的，不是被动的。因此，德行行动是主动的内在自我决定问题，而非来自外部的决定。
