      A life-long fellow of Christ’s College, Cambridge, Henry More was the most prolific of the Cambridge Platonists. He was also the most directly engaged in contemporary philosophical debate: he entered into correspondence with Descartes (between 1648 and 1649) and advocated the teaching of Cartesianism in the universities. However, he never wholly accepted Cartesianism, and became increaingly critical of it in later years. He also wrote against Hobbes, and was one of the earliest English critics of Spinoza (whom he attacks in *Demonstrationum duarum propositionum ... confutatio* and *Epistola altera* both published in his *Opera omnia*, 1671). Besides philosophy More’s published writings included, poetry, theology and bible commentary. His main philosophical works are his *An Antidote Against Atheism* (1653), his *Of the Immortality of the Soul* (1659), *Enchiridion metaphysicum* (1671), and *Enchiridion ethicum* (1667). Like the other Cambridge Platonists, More used philosophy in defence of theism against the claims of rational atheists. The most important statement of More’s theological position his *An Explanation of the Grand Mystery of Godliness* appeared in 1660. In opposition to Calvinist pessimistic voluntarism, this propounds a moral, rational providentialism in which he vindicates the goodness and justice of God by invoking the Origenist doctrine of the pre-existence of the soul. It also makes the case for religious toleration.
    step1: |
      作为剑桥基督学院（Christ’s College）的终身院士，亨利·莫尔（Henry More）是剑桥柏拉图主义者中最多产的一位。他也是最直接投入当代哲学论辩的一位：他与笛卡尔（Descartes）通信（1648 至 1649 年间），并倡导在大学中教授笛卡尔主义。然而，他从未完全接受笛卡尔主义，并在晚年越来越批评它。他也著文反对霍布斯（Hobbes），并且是最早批评斯宾诺莎（Spinoza）的英国人之一（他在其《全集》（*Opera omnia*，1671）中发表的《两个命题的证明……驳论》（*Demonstrationum duarum propositionum ... confutatio*）和《第二封信》（*Epistola altera*）中攻击斯宾诺莎）。除了哲学，莫尔的已出版著作还包括诗歌、神学和圣经注释。他的主要哲学著作是《驳无神论》（*An Antidote Against Atheism*，1653）、《论灵魂不朽》（*Of the Immortality of the Soul*，1659）、《形而上学手册》（*Enchiridion metaphysicum*，1671）和《伦理学手册》（*Enchiridion ethicum*，1667）。像其他剑桥柏拉图主义者一样，莫尔运用哲学为有神论辩护，以对抗理性无神论者的主张。莫尔神学立场最重要的表述，是他的《论敬虔的伟大奥秘之解释》（*An Explanation of the Grand Mystery of Godliness*），于 1660 年出版。与加尔文主义悲观的意志主义相对立，该书提出一种道德的、理性的天意论，在其中他通过援引奥利金关于灵魂先在的教义来维护上帝的善良和公正。该书也论证了宗教宽容的理由。
