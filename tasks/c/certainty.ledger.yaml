version: 1
slug: certainty
segments:
  - id: p1
    source: "Certainty, or the attempt to obtain certainty, has played a central role in the history of philosophy. Some philosophers have taken the kind of certainty characteristic of mathematical knowledge to be the goal at which philosophy should aim. In the *Republic*, Plato says that geometry “draws the soul towards truth and produces philosophic thought by directing upwards what we now wrongly direct downwards” (527b). Descartes also thought that a philosophical method that proceeds in a mathematical way, enumerating and ordering everything exactly, “contains everything that gives certainty to the rules of mathematics” (*Discourse on the Method*, PW 1, p. 121). Other philosophers have adopted different models for how to best understand certainty. For example, Aristotle and Aquinas take scientific explanation to be essential to certainty (see Pasnau 2017, pp. 5–7)[^pasnau-2017], while Al-Ghazālī thought that certainty arose out of religious practice (see Albertini 2005)[^albertini-2005]. For many empiricists, certainty with respect to empirical matters is to be found in basic beliefs that are grounded in some fundamental aspect of perceptual experience (see, e.g., Lewis 1952)[^lewis-1952]."
    step1: "确定性，或试图获得确定性，在哲学史上扮演了核心角色。有些哲学家把数学知识所特有的那种确定性当作哲学应当追求的目标。在《理想国》中，柏拉图说几何学“把灵魂引向真理，并通过把我们现在错误地朝下引导的东西朝上引导而产生哲学思想”（527b）。笛卡尔也认为，以数学方式进行的哲学方法，通过精确地枚举和排列一切，“包含了一切给予数学规则以确定性的东西”（《谈谈方法》，PW 1，第 121 页）。其他哲学家采用了不同的模式来最好地理解确定性。例如，亚里士多德和阿奎那认为科学解释对确定性是本质性的（见 Pasnau 2017，第 5–7 页）[^pasnau-2017]，而安萨里认为确定性产生于宗教实践（见 Albertini 2005）[^albertini-2005]。对许多经验论者而言，就经验之事而言的确定性，可以在以知觉经验的某种基本方面为基础的基本信念中找到（例如见 Lewis 1952）[^lewis-1952]。"
    step2: "确定性，或者说获得确定性的努力，在哲学史上一直居于中心地位。有些哲学家把数学知识所特有的那种确定性视为哲学应当瞄准的目标。在《理想国》中，柏拉图指出，几何学“把灵魂引向真理，并通过把我们现在误朝下引导的东西朝上引导而产生哲学思想”（527b）。笛卡尔同样认为，一种按数学方式进行的哲学方法，既然把一切都精确地加以枚举和排列，也就“包含了赋予数学规则以确定性的一切”（《谈谈方法》，PW 1，第 121 页）。另一些哲学家则采用不同的模型来理解确定性。比如，亚里士多德与阿奎那认为科学解释对确定性必不可少（见 Pasnau 2017，第 5–7 页）[^pasnau-2017]，而安萨里认为确定性源自宗教实践（见 Albertini 2005）[^albertini-2005]。对许多经验论者来说，关于经验事项的确定性，见于以知觉经验的某种基本方面为根据的基本信念（例如见 Lewis 1952）[^lewis-1952]。"
  - id: p2
    source: "Like knowledge, certainty is an epistemic property of beliefs. (In a derivative way, certainty is also an epistemic property of subjects: *S* is certain that *p* just in case *S*’s belief that *p* is certain.) Although some philosophers have thought that there is no difference between knowledge and certainty, it has become increasingly common to distinguish them. On this conception, then, certainty is either the highest form of knowledge or is the only epistemic property superior to knowledge. One of the primary motivations for allowing kinds of knowledge less than certainty is the widespread sense that skeptical arguments are successful in showing that we rarely or never have beliefs that are certain (see Unger 1975 for this kind of skeptical argument)[^unger-1975] but do not succeed in showing that our beliefs are altogether without epistemic worth (see, for example, Lehrer 1974, Williams 1999, and Feldman 2003; see Fumerton 1995 for an argument that skepticism undermines every epistemic status a belief might have; and see Klein 1981 for the argument that knowledge requires certainty, which we are capable of having)[^feldman-2003][^fumerton-1995][^klein-1981][^lehrer-1974][^williams-1999]."
    step1: "与知识一样，确定性是信念的一种认识论属性。（在派生的意义上，确定性也是主体的一种认识论属性：*S* 确定 *p*，当且仅当 *S* 对 *p* 的信念是确定的。）尽管有些哲学家认为知识与确定性之间没有区别，但区分它们的做法已日益普遍。于是，按照这种观念，确定性要么是知识的最高形式，要么是唯一高于知识的认识论属性。允许有低于确定性的各种知识的主要动机之一，是普遍的感觉：怀疑论论证成功地表明我们很少或从没有确定的信念（关于这类怀疑论论证见 Unger 1975）[^unger-1975]，但并没有成功地表明我们的信念完全没有认识论价值（例如见 Lehrer 1974、Williams 1999 与 Feldman 2003；关于怀疑论削弱信念可能具有的每一种认识论地位的论证，见 Fumerton 1995；关于知识需要确定性、而我们能够具有确定性的论证，见 Klein 1981）[^feldman-2003][^fumerton-1995][^klein-1981][^lehrer-1974][^williams-1999]。"
    step2: "像知识一样，确定性是信念的一种认识论属性。（在派生的意义上，确定性也是主体的一种认识论属性：*S* 确定 *p*，当且仅当 *S* 对 *p* 的信念是确定的。）尽管一些哲学家认为知识与确定性并无差别，但如今人们越来越普遍地把二者区分开来。于是，在这种观念下，确定性要么是知识的最高形态，要么是唯一优越于知识的认识论属性。允许存在低于确定性的知识种类，其首要动机在于一种普遍的看法：怀疑论论证虽成功地表明我们很少甚至从不具有确定的信念（这类怀疑论论证见 Unger 1975）[^unger-1975]，却未能表明我们的信念完全没有认识论价值（例如见 Lehrer 1974、Williams 1999 与 Feldman 2003；关于怀疑论削弱信念可能具有的任何认识论地位的论证，见 Fumerton 1995；关于知识要求确定性、而我们恰恰能够具有确定性的论证，见 Klein 1981）[^feldman-2003][^fumerton-1995][^klein-1981][^lehrer-1974][^williams-1999]。"
  - id: p3
    source: "As with knowledge, it is difficult to provide an uncontentious analysis of certainty. There are several reasons for this. One is that there are different kinds of certainty, which are easy to conflate. Another is that the full value of certainty is surprisingly hard to capture. A third reason is that there are two dimensions to certainty: a belief can be individually certain at a particular moment, or it can be certain over some greater length of time in a system of beliefs."
    step1: "与知识一样，很难为确定性提供一种没有争议的分析。原因有几个。其一是存在不同种类的确定性，它们很容易被混淆。其二是确定性的全部价值出人意料地难以把握。第三个原因是确定性有两个维度：一个信念可以在某个特定时刻个别地是确定的，或者它可以在一个信念系统中在较长时间内是确定的。"
    step2: "与知识的情形相同，要为确定性提供一种无可争议的分析也相当困难。这有几个原因。其一，确定性分为不同种类，很容易被混为一谈。其二，确定性的全部价值竟出乎意料地难以把握。其三，确定性具有两个维度：一个信念可以在某个时刻单独地确定，也可以在一个信念系统中于较长时段内保持确定。"
  - id: p4
    source: "There are various kinds of certainty (Russell 1948, p. 396)[^russell-1948]. A belief is *psychologically* certain when the subject who has it is supremely convinced of its truth. Certainty in this sense is similar to *incorrigibility*, which is the property a belief has of being such that the subject is incapable of giving it up. But psychological certainty is not the same thing as incorrigibility. A belief can be certain in this sense without being incorrigible; this may happen, for example, when the subject receives a very compelling bit of counterevidence to the (previously) certain belief and gives it up for that reason. Moreover, a belief can be incorrigible without being psychologically certain. For example, a mother may be incapable of giving up the belief that her son did not commit a gruesome murder, and yet, compatible with that inextinguishable belief, she may be tortured by doubt."
    step1: "存在各种不同的确定性（Russell 1948，第 396 页）[^russell-1948]。当一个信念的持有主体对其真理性感到至高的确信时，该信念在*心理上*是确定的。这一意义上的确定性类似于*不可修正性*，即一个信念所具有的、使主体无法放弃它的那种属性。但心理确定性并不等同于不可修正性。一个信念可以在这一意义上是确定的而并非不可修正的；例如，当主体收到针对该（先前）确定的信念的非常有力的反证，并因此放弃它时，就可能发生这种情况。此外，一个信念可以是不可修正的而并非心理上确定的。例如，一位母亲可能无法放弃“她的儿子没有犯下一起可怕的谋杀”这一信念，然而，与这一无法熄灭的信念相容的是，她可能被怀疑所折磨。"
    step2: "确定性有多种（Russell 1948，第 396 页）[^russell-1948]。当持有某一信念的主体对它的真理性抱有至高无上的确信时，该信念在*心理上*是确定的。这一意义上的确定性类似于*不可修正性*，即一个信念所具有的、使主体无力放弃它的那种属性。不过，心理确定性并不等于不可修正性。一个信念可以在此意义上是确定的，却并非不可修正；比如当主体收到针对该（此前）确定的信念的一条极有说服力的反证，并因此放弃它时，就会出现这种情况。反过来，一个信念也可以是不可修正的，却并非心理上确定的。例如，一位母亲可能无法放弃“她的儿子没有犯下那起骇人的谋杀”这一信念，然而，与这一无法熄灭的信念并存，她仍可能备受怀疑的折磨。"
  - id: p5
    source: "A second kind of certainty is *epistemic*. Roughly characterized, a belief is certain in this sense when it has the highest possible epistemic status. Epistemic certainty is often accompanied by psychological certainty, but it need not be. It is possible that a subject may have a belief that enjoys the highest possible epistemic status and yet be unaware that it does. (More generally, a subject’s being certain that *p* does not entail that she is certain that she is certain that *p*; on this point, see Van Cleve 1979, and see Alston 1980 on level confusions in epistemology.)[^alston-1980][^van-1979] In such a case, the subject may feel less than the full confidence that her epistemic position warrants. I will say more below about the analysis of epistemic certainty and its relation to psychological certainty."
    step1: "第二种确定性是*认识论的*。粗略地刻画，一个信念在这一意义上是确定的，当它具有可能最高的认识论地位。认识论确定性常常伴随心理确定性，但并非必然如此。一个主体可能具有享有最高可能认识论地位的信念，却不知道它具有这种地位。（更一般地说，一个主体确定 *p* 并不蕴涵她确定她确定 *p*；关于这一点，见 Van Cleve 1979，并见 Alston 1980 关于认识论中的层次混淆。）[^alston-1980][^van-1979] 在这种情况下，主体可能感到的信任低于其认识论地位所保证的全部信任。下面我将更多地谈论认识论确定性的分析及其与心理确定性的关系。"
    step2: "第二种确定性是*认识论的*。粗略地说，当一个信念具有最高可能的认识论地位时，它在这一意义上是确定的。认识论确定性常常伴有心理确定性，但未必如此。一个主体可能拥有享有最高可能认识论地位的信念，却对此毫无察觉。（更一般地说，主体确定 *p* 并不蕴含她确定自己确定 *p*；这一点见 Van Cleve 1979，关于认识论中的层次混淆另见 Alston 1980。）[^alston-1980][^van-1979] 在此种情形下，主体所感到的信心可能达不到其认识论地位理应保证的全部程度。下文我将进一步讨论认识论确定性的分析及其与心理确定性的关系。"
  - id: p6
    source: "Some philosophers also make use of the notion of *moral* certainty (see Markie 1986; James 2020)[^james-2020][^markie-1986]. For example, in the Latin version of Part IV of the *Principles of Philosophy*, Descartes says that “some things are considered as morally certain, that is, as having sufficient certainty for application to ordinary life, even though they may be uncertain in relation to the absolute power of God” (PW 1, pp. 289–90). Thus characterized, moral certainty appears to be epistemic in nature, though it is a lesser status than epistemic certainty (see Matthen 2014 for a similar account of what he calls “empirical certainty”)[^matthen-2014]. In the French version of this passage, however, Descartes says that “moral certainty is certainty which is sufficient to regulate our behaviour, or which measures up to the certainty we have on matters relating to the conduct of life which we never normally doubt, though we know that it is possible, absolutely speaking, that they may be false” (PW 1, p. 289 n. 2). Understood in this way, it does not appear to be a species of knowledge, given that a belief can be morally certain and yet false (contra Markie 1986, p. 36)[^markie-1986]. Rather, on this view, for a belief to be morally certain is for it to be subjectively rational to a high degree. In a similar way, Spinoza distinguishes moral certainty from mathematical certainty and says that the former should not be rejected when “it is confirmed by the testimonies of so many prophets, is a source of great solace for those whose capacity to reason is limited, is of great value to the state, and may be believed unreservedly without danger or damage” (*Tractatus Theologico-Politicus*, ch. 15; see James 2020, ch. 1)[^james-2020]. Moral certainty understood in this way is not merely a form of psychological certainty, as someone who has the highest degree of confidence in a particular claim might nevertheless do so for manifestly irrational or frivolous reasons."
    step1: "一些哲学家也使用*道德*确定性的概念（见 Markie 1986；James 2020）[^james-2020][^markie-1986]。例如，在《哲学原理》第四部分的拉丁文版本中，笛卡尔说“有些东西被视为道德上确定的，即被认为具有足以应用于日常生活的确定性，尽管它们相对于上帝的绝对权力而言可能是不确定的”（PW 1，第 289–90 页）。如此刻画，道德确定性在性质上似乎是认识论的，尽管它是比认识论确定性较低的地位（关于他所称“经验确定性”的类似说明，见 Matthen 2014）[^matthen-2014]。然而，在这一段落的法文版本中，笛卡尔说“道德确定性是这样的确定性：它足以规范我们的行为，或者它达到我们关于生活事务的、我们通常从不怀疑的确定性，尽管我们知道，严格地说，它们可能是假的”（PW 1，第 289 页注 2）。如此理解，它似乎不是知识的一个种类，因为一个信念可以是道德上确定的却仍然是假的（与 Markie 1986 相反，第 36 页）[^markie-1986]。毋宁说，按照这一看法，一个信念是道德上确定的，当且仅当它在高程度上是主观上合理的。以类似的方式，斯宾诺莎把道德确定性与数学确定性区分开来，并说前者不应被拒斥，当它“得到如此多先知的见证所确证，是那些推理能力有限的人的巨大慰藉之源，对国家有巨大价值，并且可以毫无保留地相信而无危险或损害”时（《神学政治论》，第 15 章；见 James 2020，第 1 章）[^james-2020]。如此理解的道德确定性并不只是心理确定性的一种形式，因为一个对特定主张具有最高程度信心的人，却可能是出于明显非理性或轻率的理由而如此。"
    step2: "一些哲学家也利用*道德*确定性的概念（见 Markie 1986；James 2020）[^james-2020][^markie-1986]。例如，在《哲学原理》第四部分的拉丁文本中，笛卡尔说“有些东西被视为道德上确定的，也就是说，被认为具有足以应用于日常生活的确定性，即使它们相对于上帝的绝对权力而言或许并不确定”（PW 1，第 289–90 页）。这样刻画之下，道德确定性在性质上似乎是认识论的，尽管它是一种低于认识论确定性的地位（关于他所称“经验确定性”的类似说明，见 Matthen 2014）[^matthen-2014]。不过，在该段的法文本中，笛卡尔又说“道德确定性是这样一种确定性：它足以规范我们的行为，或者它达到我们关于生活事务所具有的、通常从不怀疑的那种确定性，尽管我们知道，严格地讲，它们可能是假的”（PW 1，第 289 页注 2）。如此理解，它似乎并非知识的一个种类，因为一个信念可以道德上确定却又为假（与 Markie 1986，第 36 页相反）[^markie-1986]。毋宁说，按照这种看法，一个信念在道德上确定，就在于它在高程度上是主观上合理的。同样地，斯宾诺莎把道德确定性与数学确定性区分开来，并说当道德确定性“得到如此多先知的见证所确证、是推理能力有限之人的巨大慰藉、对国家极有价值、并可毫无保留地相信而无危险或损害”时，就不应拒斥它（《神学政治论》，第 15 章；见 James 2020，第 1 章）[^james-2020]。如此理解的道德确定性并不只是心理确定性的一种形式，因为一个人对某一主张抱有最高程度的信心，却可能是出于明显非理性或轻率的理由。"
  - id: p7
    source: "Although all three kinds of certainty are philosophically interesting, it is epistemic certainty that has traditionally been of central importance. In what follows, then, I shall focus mainly on this kind of certainty."
    step1: "尽管所有三种确定性在哲学上都有趣，但传统上居于核心重要地位的是认识论确定性。因此，在以下内容中，我将主要集中于这一种确定性。"
    step2: "虽然这三种确定性在哲学上都饶有趣味，但传统上具有核心重要性的乃是认识论确定性。因此，下文我将主要聚焦于这一种确定性。"
  - id: p8
    source: "There have been many different conceptions of certainty. Each of them captures some central part of our intuitive understanding of certainty, but, as we shall see, none of them is free from problems."
    step1: "对确定性已有许多不同的观念。每一种都捕捉到我们对确定性的直觉理解的一些核心部分，但是，正如我们将看到的，没有一种是没有问题的。"
    step2: "历史上对确定性有过许多不同的观念。每一种都把握住我们对确定性的直觉理解中的某一部分核心，但正如我们将看到的，没有一种毫无问题。"
  - id: p9
    source: "Certainty is often explicated in terms of *indubitability*. This has been done in a variety of ways (see, e.g., Goodman 1952; Unger 1978, p. 328)[^goodman-1952][^unger-1978]. One prominent account of certainty is suggested by Descartes’s presentation of his famous Archimedean point, the *cogito* (I am thinking, therefore I exist). In the Second Meditation, Descartes reviews the extensive doubts of the First Meditation before saying that even if “there is a deceiver of supreme power and cunning who is deliberately and constantly deceiving me,” still “he will never bring it about that I am nothing so long as I am something” (PW 2, p. 17). Descartes then concludes that the proposition that he himself exists is true whenever he considers it. It is often thought that the *cogito* has a unique epistemic status in virtue of its ability to resist even the “hyperbolic” doubts raised in the First Meditation (see Markie 1992 and Broughton 2002)[^broughton-2002][^markie-1992]. However, even if Descartes took this view of the certainty of the *cogito*, he did not accept the general claim that certainty is grounded in indubitability. In the Third Meditation, Descartes says that he is certain that he is a thinking thing, and he explains the certainty of this “first item of knowledge” (it is unclear whether he regards it as distinct from the *cogito*) as resulting from the fact that it is a clear and distinct perception (PW 2, p. 24). (Matters are complicated, however, by the fact that Descartes also says in the Third Meditation that certainty depends on knowing that God exists and is not a deceiver.)"
    step1: "确定性常常依据*不可怀疑性*来阐明。人们已以各种方式这样做（例如见 Goodman 1952；Unger 1978，第 328 页）[^goodman-1952][^unger-1978]。一个突出的确定性说明由笛卡尔对他的著名阿基米德点、即*我思*（我在思考，因此我存在）的呈现所提示。在《第二沉思》中，笛卡尔回顾了《第一沉思》的广泛怀疑，然后说，即使“有一个具有至高权力和狡猾的骗子，他故意地、持续地欺骗我”，仍然“只要我是某种东西，他就决不会使我成为虚无”（PW 2，第 17 页）。笛卡尔随后得出结论：他自己存在的命题在他考虑它时总是真的。人们通常认为，*我思*具有独特的认识论地位，因为它能够抵抗甚至《第一沉思》中提出的“夸张的”怀疑（见 Markie 1992 与 Broughton 2002）[^broughton-2002][^markie-1992]。然而，即使笛卡尔对*我思*的确定性持这种看法，他并不接受确定性奠基于不可怀疑性这一一般主张。在《第三沉思》中，笛卡尔说他确定他是一个在思考的东西，并把这一“第一知识条目”（不清楚他是否视之为与*我思*不同）的确定性解释为来自它是一个清楚明白的知觉这一事实（PW 2，第 24 页）。（然而，事情因这一事实而复杂化：笛卡尔在《第三沉思》中还说，确定性依赖于知道上帝存在且不是骗子。）"
    step2: "确定性常常依据*不可怀疑性*来阐明。人们从多种途径这样做过（例如见 Goodman 1952；Unger 1978，第 328 页）[^goodman-1952][^unger-1978]。一个引人注目的确定性说明，是笛卡尔对其著名的阿基米德点——*我思*（我在思考，所以我存在）——的呈现所提示的。在《第二沉思》中，笛卡尔回顾了《第一沉思》中那些广泛的怀疑，接着说：即使“有一个拥有至高权力与狡诈、故意且持续地欺骗我的骗子”，仍然“只要我是某种东西，他就绝不会使我化为虚无”（PW 2，第 17 页）。笛卡尔随即断定：他自己存在的那个命题，在他每一次考虑它时都为真。人们通常认为，*我思*之所以具有独特的认识论地位，就在于它能抵抗《第一沉思》中提出的甚至“夸张的”怀疑（见 Markie 1992 与 Broughton 2002）[^broughton-2002][^markie-1992]。不过，即使笛卡尔对*我思*的确定性持此看法，他也并不接受“确定性奠基于不可怀疑性”这一一般主张。在《第三沉思》中，笛卡尔说他确定自己是一个在思考的东西，并把这一“第一知识条目”（他是否视之为与*我思*不同，并不清楚）的确定性解释为：它乃是一个清楚明白的知觉（PW 2，第 24 页）。（然而，事情由于笛卡尔在《第三沉思》中还说确定性依赖于知道上帝存在且非骗子而变得复杂。）"
  - id: p10
    source: "Ludwig Wittgenstein also seems to connect certainty with indubitability. He says that “If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty” (1969, §115). What makes possible doubting is “the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn” (1969, §341). Although Wittgenstein’s view is sometimes taken to be—or to provide the basis for—an epistemically satisfying response to skepticism (see, e.g., Wright 2003 and 2004)[^wright-2003][^wright-2004], it is hard to see the kind of certainty he has characterized as being epistemic, rather than merely psychological or moral, in nature (on this point, see Pritchard 2005; Coliva 2010 and 2012)[^coliva-2010][^coliva-2012][^pritchard-2005]. Thus, when Wittgenstein says, “The difficulty is to realize the groundlessness of our believing” (1969, §166) it seems clear that the so-called hinge propositions are ones that we are psychologically incapable of calling into question. This is, of course, compatible with their being false."
    step1: "路德维希·维特根斯坦似乎也把确定性与不可怀疑性联系起来。他说“如果你试图怀疑一切，你就不会达到怀疑任何东西的地步。怀疑这种游戏本身预设了确定性”（1969，第 115 节）。使怀疑成为可能的是“这样一个事实：有些命题免于怀疑，它们仿佛就是那些怀疑赖以转动的铰链”（1969，第 341 节）。尽管维特根斯坦的看法有时被视为——或被视为提供基础——对怀疑论的、认识论上令人满意的回应（例如见 Wright 2003 与 2004）[^wright-2003][^wright-2004]，但很难把他所刻画的确定性看作认识论的，而不是仅仅心理的或道德的（关于这一点，见 Pritchard 2005；Coliva 2010 与 2012）[^coliva-2010][^coliva-2012][^pritchard-2005]。因此，当维特根斯坦说“困难在于认识到我们信念的无根基性”（1969，第 166 节）时，似乎很清楚，所谓的铰链命题是我们心理上无法加以质疑的那些命题。当然，这与它们为假相容。"
    step2: "路德维希·维特根斯坦似乎也把确定性与不可怀疑性联系起来。他说：“如果你想怀疑一切，你就连怀疑任何东西都做不到。怀疑这种游戏本身就以确定性为前提”（1969，§115）。使怀疑成为可能的，是“这样一个事实：有些命题免于怀疑，它们犹如那些怀疑赖以转动的铰链”（1969，§341）。尽管维特根斯坦的看法有时被视为——或被视为提供了基础——一种对怀疑论而言认识论上令人满意的回应（例如见 Wright 2003 与 2004）[^wright-2003][^wright-2004]，但我们很难把他所刻画的确定性视为认识论性质的，而非仅仅心理的或道德的（这一点见 Pritchard 2005；Coliva 2010 与 2012）[^coliva-2010][^coliva-2012][^pritchard-2005]。所以，当维特根斯坦说“困难在于认识到我们信念的无根基性”（1969，§166）时，似乎很清楚：所谓铰链命题正是我们心理上无法加以质疑的那些命题。当然，这与它们为假是相容的。"
  - id: p11
    source: "In general, every indubitability account of certainty will face a dilemma: when the subject finds herself incapable of doubting one of her beliefs, either she has good reasons for being incapable of doubting it, or she does not. If she does not have good reasons for being unable to doubt the belief, the type of certainty in question can be only psychological, not epistemic, in nature. On the other hand, if the subject does have good reasons for being unable to doubt the belief, the belief may be epistemically certain. But, in this case, what grounds the certainty of the belief will be the subject’s reasons for holding it, and not the fact that the belief is indubitable."
    step1: "一般地说，每一种把确定性解释为不可怀疑性的说明都会面临一个两难：当主体发现自己无法怀疑她的某一个信念时，要么她有很好的理由无法怀疑它，要么她没有。如果她没有很好的理由无法怀疑该信念，那么所讨论的那种确定性就只能是心理的，而不是认识论的。另一方面，如果主体确实有很好的理由无法怀疑该信念，那么该信念可能是认识论上确定的。但是，在这种情况下，为信念的确定性奠基的将是主体持有它的理由，而不是该信念不可怀疑这一事实。"
    step2: "概言之，任何以不可怀疑性来界说确定性的说明都将面临一个两难：当主体发现自己无法怀疑自己的某一信念时，她要么有很好的理由无法怀疑它，要么没有。如果她没有很好的理由无法怀疑该信念，那么这里所说的那种确定性就只能是心理性质的，而非认识论的。另一方面，如果主体确有很好的理由无法怀疑该信念，那么该信念也许是认识论上确定的。但在这种情况下，为这一信念的确定性奠基的，将是主体持有它的理由，而非该信念不可怀疑这一事实。"
  - id: p12
    source: "A second problem for indubitability accounts of certainty is that, in one sense, even beliefs that are epistemically certain can be reasonably doubted. I shall say more about this in §3 below."
    step1: "不可怀疑性说明的确定性的第二个问题是，在一种意义上，即使是认识论上确定的信念也可以被合理地怀疑。我将在下文第 3 节更多地谈论这一点。"
    step2: "以不可怀疑性来说明确定性还有第二个问题：在某种意义上，即使是认识论上确定的信念也能被合理地怀疑。这一点我将在下文第 3 节详谈。"
  - id: p13
    source: "According to a second conception, a subject’s belief is certain just in case it *could not have been mistaken*—i.e., false (see, e.g., Lewis 1929)[^lewis-1929]. Alternatively, the subject’s belief is certain when it is *guaranteed to be true*. This is what Roderick Firth calls the “truth-evaluating” sense of certainty (1967, pp. 7–8). As with knowing that *p*, being certain that *p* entails that it is true that *p*. Certainty is, however, significantly stronger than lesser forms of knowledge (contra Mizrahi 2019, who conflates knowledge with certainty on the grounds that knowledge is factive)[^mizrahi-2019]. In cases where the subject knows without being certain that *p*, it is actually true that *p*, though it could have been false. In that case, of course, the subject would no longer know that *p*. But, where the subject is certain that *p*, it does not merely turn out to be true that *p*—in some sense it could not have been otherwise."
    step1: "按照第二种观念，一个主体的信念是确定的，当且仅当它*不可能曾经是错误的*——即假的（例如见 Lewis 1929）[^lewis-1929]。或者，当主体的信念*被保证为真*时，它是确定的。这就是罗德里克·弗斯所称的确定性的“真理评估”意义（1967，第 7–8 页）。与知道 *p* 一样，确定 *p* 蕴涵 *p* 是真的。然而，确定性比较低形式的知识显著地更强（与 Mizrahi 2019 相反，他以知识是事实性的为由把知识与确定性混同）[^mizrahi-2019]。在主体知道而并不确定 *p* 的情况下，*p* 实际上是真的，尽管它可能是假的。当然，在那种情况下，主体将不再知道 *p*。但是，在主体确定 *p* 的情况下，*p* 并不仅仅是碰巧为真——在某种意义上它不可能不是如此。"
    step2: "按照第二种观念，一个主体的信念是确定的，当且仅当它*不可能出错*——也就是说，不可能为假（例如见 Lewis 1929）[^lewis-1929]。或者，当主体的信念*被保证为真*时，它就是确定的。这就是罗德里克·弗斯（Roderick Firth）所称的确定性之“真理评估”意义（1967，第 7–8 页）。与知道 *p* 一样，确定 *p* 也蕴涵 *p* 为真。不过，确定性要显著地强于较低形式的知识（与 Mizrahi 2019 相反；后者以知识是事实性的为由，把知识与确定性混为一谈）[^mizrahi-2019]。在主体知道 *p* 却并不确定 *p* 的情形下，*p* 事实上为真，尽管它本可以是假的。当然，在那种情形下，主体也就不再知道 *p* 了。但就主体确定 *p* 而言，*p* 并不仅仅是碰巧为真——在某种意义上，它不可能不是如此。"
  - id: p14
    source: "The difficulty for this conception of certainty is specifying the precise sense in which the belief could not have been false. What is meant cannot be what is called metaphysical or broadly logical impossibility. Although some of the paradigmatically certain beliefs are necessarily true in this sense, many others are not. For example, though I am certain of the truth of the *cogito*, it is not necessarily true (in the metaphysical sense) that I exist. That is, it is possible that I might not have existed. We might attempt to solve this difficulty by saying that the belief is guaranteed to be true by the subject’s grounds for it (see, e.g., Audi 1998, pp. 218–9)[^audi-1998]. But this opens up two further problems for this conception of certainty. First, if the truth of the belief is guaranteed by the subject’s grounds for holding it, then it looks as though the certainty of the belief ought to be attributed to those grounds as well. That is to say, the belief would be certain, not in virtue of the fact that it is guaranteed to be true, but rather in virtue of its relation to the grounds that make that guarantee possible. This would be so because the grounds would provide a deeper explanation for the certainty of the belief than would the fact that the belief is guaranteed to be true. Moreover, some further account of the certainty of the grounds will still need to be provided."
    step1: "这种确定性观念的困难在于具体说明信念不可能为假的确切意义。所意味的不可能是所谓的形而上学或广义逻辑的不可能性。尽管一些范式性的确定信念在这一意义上是必然真的，但许多其他信念则不是。例如，虽然我确定*我思*的真理性，但我存在并非（在形而上学意义上）必然真。也就是说，我可能不曾存在。我们可以尝试通过说信念被主体对它的根据所保证为真来解决这一困难（例如见 Audi 1998，第 218–9 页）[^audi-1998]。但这为这种确定性观念打开了两个进一步的问题。第一，如果信念的真理性被主体持有它的根据所保证，那么看起来信念的确定性也应当归于那些根据。也就是说，信念之所以确定，不是因为被保证为真这一事实，而是因为它与使那种保证成为可能的根据的关系。之所以如此，是因为根据将为信念的确定性提供比“信念被保证为真”这一事实更深的解释。此外，还需要对根据的确定性提供某种进一步的说明。"
    step2: "这种确定性观念的难处，在于具体说明信念不可能为假的确切含义。这里所意味的不可能是所谓的形而上学不可能性或广义逻辑不可能性。尽管一些范式性的确定信念在这一意义上是必然真的，但许多别的信念却不是。例如，虽然我确定*我思*为真，但我存在并非（在形而上学意义上）必然为真。也就是说，我可能并未存在过。我们可以尝试这样解决这一困难：说该信念被主体对它所持有的根据所保证为真（例如见 Audi 1998，第 218–9 页）[^audi-1998]。但这又给这种确定性观念带来两个进一步的问题。其一，如果信念的真理性由主体持有它的根据所保证，那么看起来信念的确定性也应当归于那些根据。也就是说，该信念之所以确定，并非由于它被保证为真这一事实，而是由于它与使这种保证成为可能的根据之间的关系。之所以如此，是因为根据对信念的确定性所提供的解释，要比“信念被保证为真”这一事实所提供的更深。此外，对于根据本身的确定性，也还需要某种进一步的说明。"
  - id: p15
    source: "The second problem is very similar to one that arises for philosophers attempting to provide an account of fallibilistic knowledge (i.e., knowledge that is less than certain). According to the standard account, the subject has fallibilistic knowledge that *p* when she knows that *p* on the basis of some justification *j*, and yet the subject’s belief could have been false while still held on the basis of *j* (see, e.g., BonJour 1985, p. 26; Lehrer 1990, p. 45)[^bonjour-1985][^lehrer-1990]. Alternatively, the subject knows that *p* on the basis of some justification *j*, but *j* does not entail the truth that *p* (see, e.g., Cohen 1988, p. 91; Fogelin 1994, pp. 88–9; Jeshion 2000, pp. 334–5; Brown 2018, pp. 15–21)[^brown-2018][^cohen-1988][^fogelin-1994][^jeshion-2000]. The problem with the standard account, in either version, is that it does not allow for fallibilistic knowledge of necessary truths. If it is necessarily true that *p*, then the subject’s belief that *p* could not have been false, regardless of what her justification for it may be like. And, if it is necessarily true that *p*, then everything—including the subject’s justification for her belief—will entail or guarantee that *p*. Our attempt to account for certainty encounters the opposite problem: it does not allow for a subject to have a belief regarding a necessary truth that does *not* count as certain. If the belief is necessarily true, it cannot be false—even when the subject has come to hold the belief for a very bad reason (say, as the result of guessing or wishful thinking). And, given that the beliefs are necessarily true, even these bad grounds for holding the belief will entail or guarantee that it is true."
    step1: "第二个问题与那些试图为可误知识（即低于确定性的知识）提供说明的哲学家所遇到的一个问题非常相似。按照标准说明，当主体基于某种证成 *j* 知道 *p*，然而主体的信念仍可能为假、却仍然基于 *j* 而被持有，那么主体就对 *p* 具有可误的知识（例如见 BonJour 1985，第 26 页；Lehrer 1990，第 45 页）[^bonjour-1985][^lehrer-1990]。或者，主体基于某种证成 *j* 知道 *p*，但 *j* 并不蕴涵 *p* 的真理性（例如见 Cohen 1988，第 91 页；Fogelin 1994，第 88–9 页；Jeshion 2000，第 334–5 页；Brown 2018，第 15–21 页）[^brown-2018][^cohen-1988][^fogelin-1994][^jeshion-2000]。标准说明的这两种版本的问题都在于：它不允许对必然真理具有可误的知识。如果 *p* 是必然真的，那么主体的 *p* 信念就不可能为假，无论她对它的证成如何。而且，如果 *p* 是必然真的，那么一切——包括主体对其信念的证成——都将蕴涵或保证 *p*。我们为确定性提供说明的尝试则遭遇相反的问题：它不允许主体对一个*不*算作确定的必然真理具有信念。如果信念是必然真的，它就不可能为假——即使主体是出于一个非常糟糕的理由（比如说，由于猜测或一厢情愿）而持有该信念。而且，鉴于这些信念是必然真的，即使是这些糟糕的持有理由也将蕴涵或保证它为真。"
    step2: "第二个问题与那些试图为可误知识（即低于确定性的知识）提供说明的哲学家所面临的一个问题十分相似。按照标准说明，当主体基于某种证成 *j* 知道 *p*，而主体的信念却仍可能为假、同时仍基于 *j* 而被持有时，主体就具有关于 *p* 的可误知识（例如见 BonJour 1985，第 26 页；Lehrer 1990，第 45 页）[^bonjour-1985][^lehrer-1990]。或者，主体基于某种证成 *j* 知道 *p*，但 *j* 并不蕴涵 *p* 为真（例如见 Cohen 1988，第 91 页；Fogelin 1994，第 88–9 页；Jeshion 2000，第 334–5 页；Brown 2018，第 15–21 页）[^brown-2018][^cohen-1988][^fogelin-1994][^jeshion-2000]。标准说明的这两种版本，问题都在于它不允许对必然真理具有可误的知识。如果 *p* 必然为真，那么主体的 *p* 信念就不可能为假，无论她对它的证成如何。而且，如果 *p* 必然为真，那么一切——包括主体对其信念的证成——都将蕴涵或保证 *p*。我们为确定性提供说明的尝试则遇到相反的问题：它不允许主体对某个*不*算作确定的必然真理持有一个信念。如果该信念必然为真，它就不可能为假——即便主体是出于一个极糟糕的理由（比如说，出于猜测或一厢情愿）而持有它。而且，既然这些信念必然为真，即便是这些糟糕的持有理由也将蕴涵或保证它为真。"
  - id: p16
    source: "One way to solve the problem for the analysis of fallibilistic knowledge is to focus, not on the entailment relation, but rather on the probabilistic relation holding between the subject’s justification and the proposition believed (see Reed 2002 and 2013)[^reed-2002][^reed-2013]. When the subject knows that *p* on the basis of justification *j*, and *P*(*p*/*j*) is less than 1, the subject’s knowledge is fallibilistic. (Although epistemologists will disagree about what the appropriate conception of probability is, here is a crude example of how probability may figure in a fallibilistic epistemology. A basic historical reliabilist will say that a belief is justified just in case it has been produced by a process that has yielded a preponderance of true beliefs. So, if the process has yielded a true belief, say, 90% of the time, the probability that the next belief will be true is 90%; this is so even if the belief in question is necessarily true and has been logically deduced from a set of beliefs, each of which is necessarily true.) Adapting this solution to the problem for certainty, we can say that the subject is certain that *p* when *P*(*p*/*j*) = 1, where *j* is the justification or grounds for the belief (see Van Cleve 1977 and Lewis 1952)[^lewis-1952][^van-1977]. However, in order for *j* to impart a probability of 1 to *p*, it must also be the case that *P*(*j*) = 1. That is to say, *j* must be certain for the subject before it can make anything else certain. But, if we are to explain the certainty that *p* by appeal to the certainty that *j*, we fall into a vicious regress. The only way to stop it is to allow that some beliefs may have an intrinsic probability of 1 (see Russell 1948, p. 396, and Van Cleve 1977)[^russell-1948][^van-1977]. It is, however, difficult to see how intrinsic probability of this sort is possible (barring, of course, a subjectivist account of probability, which could, in any case, capture only psychological certainty)."
    step1: "解决可误知识分析问题的一个办法，是不聚焦于蕴涵关系，而是聚焦于主体证成与被相信命题之间的概率关系（见 Reed 2002 与 2013）[^reed-2002][^reed-2013]。当主体基于证成 *j* 知道 *p*，且 *P*(*p*/*j*) 小于 1 时，主体的知识就是可误的。（尽管认识论者会对适当的概率观念有分歧，这里是概率如何出现在可误认识论中的一个粗略例子。一个基本的历时的可靠主义者会说，一个信念得到证成，当且仅当它由一种产生了大多数真信念的过程所产生。所以，如果该过程有 90% 的时间产生了真信念，那么下一个信念为真的概率就是 90%；即使所讨论的信念是必然真的、并且是从一组每一成员都必然真的信念中逻辑地推演出来的，也是如此。）把这一解决办法运用于确定性问题，我们可以说：当 *P*(*p*/*j*) = 1 时，主体确定 *p*，其中 *j* 是信念的证成或根据（见 Van Cleve 1977 与 Lewis 1952）[^lewis-1952][^van-1977]。然而，为了使 *j* 把概率 1 赋予 *p*，还必须 *P*(*j*) = 1。也就是说，*j* 必须在使任何其他东西确定之前，对主体而言就是确定的。但是，如果我们要通过诉诸 *j* 的确定性来解释 *p* 的确定性，我们就会陷入一种恶性循环。阻止它的唯一办法是允许一些信念具有内在概率 1（见 Russell 1948，第 396 页，与 Van Cleve 1977）[^russell-1948][^van-1977]。然而，很难看出这种内在概率如何可能（当然，除非诉诸一种主观主义的概率说明，而它在任何情况下都只能把握心理确定性）。"
    step2: "解决可误知识之分析问题的一个办法，不是把焦点放在蕴涵关系上，而是放在主体证成与被相信命题之间的概率关系上（见 Reed 2002 与 2013）[^reed-2002][^reed-2013]。当主体基于证成 *j* 知道 *p*，而 *P*(*p*/*j*) 小于 1 时，主体的知识便是可误的。（认识论者对何为适当的概率观念会有分歧，这里只举一个粗略的例子来说明概率如何在一种可误认识论中起作用。一个基本的历时可靠主义者会说，一个信念得到证成，当且仅当它是由一种产生了绝大多数真信念的过程所产生的。因此，如果该过程有 90% 的时候产生真信念，那么下一个信念为真的概率就是 90%；即便所讨论的信念是必然真的、并且是从一组每个成员都必然真的信念中逻辑地推演出来的，情形也是如此。）把这一解决办法移用于确定性问题，我们可以说：当 *P*(*p*/*j*) = 1 时，主体即确定 *p*，其中 *j* 是信念的证成或根据（见 Van Cleve 1977 与 Lewis 1952）[^lewis-1952][^van-1977]。不过，为了使 *j* 能赋予 *p* 以概率 1，还必须 *P*(*j*) = 1。也就是说，*j* 必须对主体而言是确定的，然后它才能把别的东西变为确定的。但如果我们诉诸 *j* 的确定性来解释 *p* 的确定性，就会陷入一种恶性循环。要阻止它，唯一的办法是允许一些信念具有内在概率 1（见 Russell 1948，第 396 页，以及 Van Cleve 1977）[^russell-1948][^van-1977]。然而，很难看出这类内在概率如何可能（当然，除非诉诸一种主观主义的概率说明，而它无论如何也只能把握心理确定性）。"
  - id: p17
    source: "Timothy Williamson (2000, pp. 213–7) rejects the connection between a belief having probability 1 and its being absolutely certain. (On his view, one’s evidence is identical with what one knows, so what one knows will be evidence for itself. In a trivial sense, then, everything one knows will have probability 1.) He argues that the connection can be broken by denying that beliefs that have probability 1 at a particular time will always thereafter remain at that probability. Further evidence may be acquired that destroys the knowledge in question; when that happens, it is no longer evidence, let alone evidence for itself. Williamson finds this result congenial because, he says, “it is hard to see how *any* empirical proposition could have the intertemporal and intersubjective certainty which the conditionalization account demands of evidence” (p. 215). In breaking the connection between certainty and probability 1, then, it is important to keep in mind that Williamson has done so only for absolute certainty (or certainty over time), but not for certainty at a time. See section 3 below for more on the distinction between these two dimensions of certainty."
    step1: "蒂莫西·威廉姆森（2000，第 213–7 页）拒斥“信念具有概率 1”与“它是绝对确定的”之间的联系。（按照他的看法，一个人的证据与他所知的东西相同，所以他所知道的东西将是它自身的证据。于是，在一种平凡的意义上，他所知道的一切都将具有概率 1。）他论证说，这一联系可以通过否认“在特定时刻具有概率 1 的信念将永远保持该概率”而被打破。可能获得进一步摧毁所讨论知识的证据；当这种情况发生时，它不再是证据，更不必说是它自身的证据。威廉姆森发现这一结果很合意，因为他说“很难看出*任何*经验命题如何能够具有条件化说明对证据所要求的那种跨时间的和主体间的确定性”（第 215 页）。那么，在打破确定性与概率 1 之间的联系时，重要的是记住：威廉姆森只是对绝对确定性（即跨时间的确定性）这样做了，而不是对一时点的确定性。关于这两种确定性维度之间的区别，见下文第 3 节。"
    step2: "蒂莫西·威廉姆森（2000，第 213–7 页）拒绝“一个信念具有概率 1”与“它是绝对确定的”之间的关联。（在他看来，一个人的证据与这个人所知道的东西相同，因此他所知道的东西就是它自身的证据。于是在一种平凡的意义上，他所知道的一切都具有概率 1。）他论证说，只要否认“在某一时刻具有概率 1 的信念此后会永远保持这一概率”，就能打破这一关联。人们可能获得进一步的证据，从而摧毁所讨论的知识；一旦如此，它便不再是证据，更谈不上是它自身的证据。威廉姆森认为这一结果很可取，因为他说“很难看出*任何*经验命题怎么能具有条件化说明所要求于证据的那种跨时段的、主体间的确定性”（第 215 页）。因此，在打破确定性与概率 1 之间的关联时，务必记住：威廉姆森只是对绝对确定性（即跨时间的确定性）这样做了，对一时点上的确定性则没有。关于这两种确定性维度的区别，详见下文第 3 节。"
  - id: p18
    source: "According to a third conception of certainty, a subject’s belief that *p* is certain when it is *inimitable*--i.e., justified in the highest degree (see, e.g., Stanley 2008)[^stanley-2008]. This is what Firth calls the “warrant-evaluating” sense of certainty (1967, pp. 8–12). Thus, Bertrand Russell says that “A proposition is certain when it has the highest degree of credibility, either intrinsically or as a result of argument” (1948, p. 396). There are various ways to understand what it means for a belief to be credible or justified in the highest degree. It could mean simply that the belief in question is justified as highly as any belief the subject happens to hold. But, in cases where the subject does not have any beliefs that are highly justified, this will imply that even a belief with relatively low justification is epistemically certain. Perhaps we could say instead that a belief is justified to the highest degree when it is justified as highly as any belief that *anyone* happens to hold. But this, too, leaves open the possibility that a belief with relatively low justification is epistemically certain: if all the subjects in existence are in a condition of universal ignorance, all of their beliefs—including the best of them—will have only a low level of justification. Perhaps, then, we should say that a belief is justified in the highest degree when it has the highest level of justification *possible*. But even this account is unsatisfactory. Suppose that global skepticism is necessarily true: it is a necessary truth that no subject is capable of having much justification for any of her beliefs; although it may seem to us as though a significant degree of justification is possible, this in fact is incorrect. It would then be intuitively correct to say that every belief falls far short of certainty, though this would not be permitted by the account of certainty under consideration. We may of course doubt that skepticism of this strong variety is correct; nevertheless, it should not be simply ruled out as a matter of definition."
    step1: "按照第三种确定性观念，一个主体对 *p* 的信念当它是*不可超越的*——即得到最高程度的证成——时是确定的（例如见 Stanley 2008）[^stanley-2008]。这就是弗斯所称的确定性的“保证评估”意义（1967，第 8–12 页）。因此，伯特兰·罗素说“当一个命题具有最高程度的可信性时，无论这种可信性是内在的还是作为论证的结果，它就是确定的”（1948，第 396 页）。对于一个信念在最高程度上可信或得到证成意味着什么，有各种理解方式。它可能仅仅意味着：所讨论的信念被证成到与主体恰好持有的任何信念同样高的程度。但是，在主体没有任何高度证成的信念的情况下，这将意味着即使一个证成程度相对较低的信念也是认识论上确定的。也许我们可以改而说：一个信念被证成到最高程度，当它被证成到与*任何人*恰好持有的任何信念同样高的程度。但这也留下了“一个证成程度相对较低的信念是认识论上确定的”这一可能性：如果现存的所有主体都处于普遍无知的状态，那么他们所有的信念——包括其中最好的——都将只有低程度的证成。那么，也许我们应该说：一个信念被证成到最高程度，当它具有*可能的*最高证成程度。但即使是这一说明也不令人满意。假设全球怀疑论是必然真的：没有主体能够为她的任何信念具有很多证成，这是一个必然真理；尽管我们可能觉得显著程度的证成是可能的，但这实际上是不正确的。那么，直觉上正确的说法将是：每一个信念都远远达不到确定性，尽管所考虑的确定性说明不会允许这一说法。我们当然可以怀疑这种强烈的怀疑论是否正确；然而，它不应仅仅作为定义问题而被排除。"
    step2: "按照第三种观念，一个主体对 *p* 的信念是确定的，当且仅当它是*不可超越的*——也就是说，得到最高程度的证成（例如见 Stanley 2008）[^stanley-2008]。这就是弗斯（Firth）所称的确定性之“保证评估”意义（1967，第 8–12 页）。因此，伯特兰·罗素（Bertrand Russell）说：“当一个命题具有最高程度的可信性时，无论这种可信性是内在的，还是作为论证的结果而获得的，它就是确定的”（1948，第 396 页）。对于“一个信念在最高程度上可信或得到证成”意味着什么，可以有多种理解。它可以仅仅意味着：所讨论的信念被证成到与主体恰好具有的任何信念一样高的程度。但在主体没有任何高度证成的信念的情形下，这将意味着：即使一个证成程度相对较低的信念，也是认识论上确定的。也许我们可以改口说：一个信念被证成到最高程度，当它被证成到与*任何人*恰好具有的任何信念一样高的程度。然而，这同样留下了“证成程度相对较低的信念是认识论上确定的”这一可能：如果现存的一切主体都处于普遍无知的状态，那么他们所有的信念——包括其中最好的——都只能具有低程度的证成。那么，也许我们应当说：一个信念被证成到最高程度，当它具有*可能的*最高证成程度。但连这一说明也不能令人满意。假设全球怀疑论必然为真——即“没有任何主体能够为她的任何信念具有很多证成”是一个必然真理；尽管我们可能以为显著程度的证成是可能的，这实际上并不正确。那么，直觉上正确的说法就会是：每一个信念都远未达到确定性，尽管正在考虑的确定性说明并不会允许这一说法。我们当然可以怀疑这种强烈的怀疑论是否正确；然而，它不应仅仅由于定义问题而被排除。"
  - id: p19
    source: "Roderick Chisholm offers a variation on the above approach. According to his first definition of certainty (where *h*, *S*, and *t* are variables for propositions, subjects, and times, respectively):\n\n> *h* is certain for *S* at *t* =_{df} (i) Accepting *h* is more reasonable for *S* at *t* than withholding *h* (i.e., not accepting *h* and not accepting not-*h*) and (ii) there is no *i* such that accepting *i* is more reasonable for *S* at *t* than accepting *h*. (1976, p. 27)"
    step1: "罗德里克·奇泽姆提供了上述进路的一种变体。按照他对确定性的第一个定义（其中 *h*、*S* 和 *t* 分别是命题、主体和时间的变元）：\n\n> 对 *S* 而言，*h* 在 *t* 时是确定的 =_{df} (i) 对 *S* 而言，在 *t* 时接受 *h* 比不接受 *h* 更合理（即不接受 *h* 且不接受非-*h*），并且 (ii) 不存在这样的 *i*：对 *S* 而言，在 *t* 时接受 *i* 比接受 *h* 更合理。（1976，第 27 页）"
    step2: "罗德里克·奇泽姆（Roderick Chisholm）在上述进路之上提出了一种变体。按照他给确定性下的第一个定义（其中 *h*、*S* 和 *t* 分别为命题、主体与时间的变元）：\n\n> 对 *S* 而言，*h* 在 *t* 时是确定的 =_{df} (i) 对 *S* 来说，在 *t* 时接受 *h* 比不接受 *h* 更合理（也就是说，既不接受 *h* 也不接受非-*h*），并且 (ii) 不存在任何 *i*，使得对 *S* 来说在 *t* 时接受 *i* 比接受 *h* 更合理。（1976，第 27 页）"
  - id: p20
    source: "Clause (i) ensures that the subject has some measure of positive justification for *h*—if she had no justification for it, it would be more reasonable for her to withhold with respect to *h*. Clause (ii) then says that those beliefs of the subject are certain which are at the highest levels of justification for her. However, this still leaves open the following possibility: *h* is the most highly justified belief the subject has, but it is still not very highly justified (e.g., it may not even be sufficiently justified to count as knowledge)."
    step1: "条款 (i) 确保主体对 *h* 具有某种程度的正面证成——如果她对它没有证成，那么对她而言，就 *h* 而言不接受将更合理。条款 (ii) 随后说，主体的那些处于对她而言最高证成水平的信念是确定的。然而，这仍然留下了以下可能性：*h* 是主体所具有的证成程度最高的信念，但它仍然不是非常高度证成的（例如，它甚至可能不足以被证成到可算作知识的程度）。"
    step2: "条款 (i) 保证主体对 *h* 具有某种程度的正面证成——倘若她对它毫无证成，那么对她来说，就 *h* 采取不置可否的态度反倒更合理。条款 (ii) 接着指出：主体那些处于她本人证成最高水平的信念，才是确定的。然而，这仍然留下了这样一种可能：*h* 是主体证成程度最高的信念，可它仍然算不上高度证成（例如，它甚至可能没有足够的证成，够不上知识的资格）。"
  - id: p21
    source: "Perhaps for this reason, Chisholm later offered a different definition of certainty:\n\n> *p* is certain for *S* =_{df} For every *q*, believing *p* is more justified for *S* than withholding *q*, and believing *p* is at least as justified for *S* as is believing *q*. (1989, p. 12)"
    step1: "也许正是出于这个原因，奇泽姆后来提出了一个不同的确定性定义：\n\n> 对 *S* 而言，*p* 是确定的 =_{df} 对每一个 *q* 而言，对 *S* 来说相信 *p* 比不接受 *q* 更有证成，并且对 *S* 来说相信 *p* 至少与相信 *q* 一样有证成。（1989，第 12 页）"
    step2: "也许正是出于这一原因，奇泽姆后来给出了另一个确定性定义：\n\n> 对 *S* 而言，*p* 是确定的 =_{df} 对任何 *q*，对 *S* 来说相信 *p* 都比不接受 *q* 更有证成，并且对 *S* 来说相信 *p* 至少与相信 *q* 同样有证成。（1989，第 12 页）"
  - id: p22
    source: "This definition still has the equivalent of clause (ii) above, and therefore requires the belief that is certain for the subject be the one that is most highly justified for her. But the second definition appears to be more successful in requiring that *p* be justified to a significant degree. Now, believing that *p* must not only be more justified for the subject than withholding *p*, it must also be more justified than withholding with respect to any other proposition. There are many propositions that we are capable of entertaining—e.g., the proposition that the number of people alive at this precise moment is even—where there is not the slightest reason for thinking them to be either true or false (though, of course, they must be one or the other). In fact, given the perfect lack of evidence with respect to propositions of this sort, Chisholm’s definition may set the standard for certainty *too* high, for it is hard to see how there could be any proposition one is *more* justified in believing than one is in withholding belief regarding, say, the parity of the number of people alive at this very moment."
    step1: "这个定义仍然具有上述条款 (ii) 的等价物，因此要求对主体而言确定的信念是她那里证成程度最高的那个。但是第二个定义似乎在要求 *p* 得到显著程度的证成方面更成功。现在，相信 *p* 对主体而言不仅必须比不接受 *p* 更有证成，还必须比就任何其他命题而言不接受更有证成。有许多我们能够思及的命题——例如，这一精确时刻活着的人数是偶数的命题——其中没有丝毫理由认为它们是真的或假的（尽管，当然，它们必定是其一）。事实上，鉴于对这类命题证据的完全缺乏，奇泽姆的定义可能把确定性的标准定得*太*高，因为很难看出如何能有一个命题，我们*更*有证成去相信它，而不是去就（比如说）此刻活着的人数的奇偶性持不置可否的态度。"
    step2: "这个定义仍然含有上述条款 (ii) 的等价物，因此要求对主体而言确定的信念，乃是她那里证成程度最高的那一个。但第二个定义似乎在要求 *p* 得到显著程度的证成方面更为成功。如今，对主体来说，相信 *p* 不仅必须比不接受 *p* 更有证成，还必须比就任何其他命题而言不接受更有证成。我们能思及许多命题——例如“此刻活着的人数是偶数”这一命题——对于它们，没有丝毫理由认为其为真或为假（尽管它们当然必居其一）。事实上，鉴于对此类命题证据的完全缺乏，奇泽姆的定义可能把确定性的标准定得*过*高；因为我们很难看出，怎么会有这样一个命题：我们*更*有证成去相信它，而不是就（比方说）此刻活着的人数的奇偶性不置可否。"
  - id: p23
    source: "It should be noted, however, that Chisholm’s definition works only by implicitly relying on what is a contingent feature of our epistemic situation. It so happens that we find ourselves in a position of total ignorance with respect to some propositions. But that need not have been the case. We could have ended up in a world where there is a moderate amount of evidence either for or against every proposition. If one of a subject’s beliefs then happened to have slightly more justification than any of the others, it would meet Chisholm’s definition of certainty, though it might still have what we would intuitively take to be a less than ideal level of justification."
    step1: "然而应当指出，奇泽姆的定义之所以成立，只是因为它隐晦地依赖我们认识论处境的一个偶然特征。我们碰巧发现自己对某些命题处于完全无知的状态。但情况未必如此。我们可能处在一个对每一个命题都有中度证据（或支持或反对）的世界里。如果主体的一个信念随后碰巧比她的任何其他信念稍有更多的证成，它就会满足奇泽姆的确定性定义，尽管它可能仍然具有我们直觉上会认为低于理想程度的证成。"
    step2: "不过应当注意，奇泽姆的定义之所以能成立，仅仅在于它隐含地依赖我们认识论处境的一个偶然特征。我们碰巧发现自己对某些命题一无所知。但情形不必如此。我们本可能身处这样一个世界：对每个命题都存在或支持或反对的中等程度的证据。倘若主体的某一信念那时碰巧比她的其他任何信念稍微多一点证成，它就会满足奇泽姆的确定性定义，尽管它可能仍只具有我们直觉上认为不够理想的证成程度。"
  - id: p24
    source: "There is one further problem with both of Chisholm’s definitions. Because they both relativize certainty to a particular subject, they make possible the following situation. Two subjects each believe that *p*, and in each case the belief is justified to degree *n*. For the first subject, the belief counts as certain because none of her other beliefs have a higher level of justification. But, for the second subject, the belief in question is not certain because she does have another belief that is slightly more justified. If certainty really is grounded in epistemic justification, though, this should not be possible. If a given justification makes a belief certain for one subject, it should do so for everyone."
    step1: "奇泽姆的两个定义还有一个进一步的问题。因为它们都把确定性相对于特定主体，它们使得以下情形成为可能。两个主体都相信 *p*，并且在每种情况下信念都被证成到程度 *n*。对第一个主体而言，该信念算作确定的，因为她的其他信念都没有更高的证成水平。但是，对第二个主体而言，所讨论的信念不是确定的，因为她确实有另一个稍微更有证成的信念。然而，如果确定性真的奠基于认识论证成，这就不应该可能。如果一种给定的证成使一个信念对一个主体是确定的，它就应该对每个人都如此。"
    step2: "奇泽姆的两个定义还有一个进一步的问题。由于两者都把确定性相对化于特定主体，它们使下面这种情形成为可能。两个主体都相信 *p*，且各自的信念都被证成到程度 *n*。对第一个主体来说，该信念算作确定，因为她的其他信念没有更高水平的证成。但对第二个主体来说，所讨论的信念并不确定，因为她确另有某个稍微更有证成的信念。不过，如果确定性果真奠基于认识论证成，这就不该发生。既然一种给定的证成使一个信念对某个主体是确定的，它就应当对所有人都是确定的。"
  - id: p25
    source: "There is another approach that Chisholm might take. According to *particularism*, his favored method in epistemology, we should use particular instances of knowledge and justification as our guide in formulating an epistemology (Chisholm 1973 and 1989, pp. 6–7)[^chisholm-1973][^chisholm-1989]. (By contrast, *methodism* begins with criteria for knowledge and justification and then attempts to ascertain whether, on these criteria, we actually have any knowledge or justified beliefs.) Adapting this approach to our present concern, the suggestion is that we formulate an account of certainty in light of paradigmatic instances of beliefs held with certainty. Thus, after giving the second definition above, Chisholm says that the concept of certainty is illustrated by propositions about what he calls “self-presenting” mental states and by some logical and metaphysical axioms (1989, p. 12)."
    step1: "奇泽姆可能采取的另一种进路。按照*特殊主义*——他在认识论中偏爱的方法——我们应当以知识与证成的特定实例为指导来建构一种认识论（Chisholm 1973 与 1989，第 6–7 页）[^chisholm-1973][^chisholm-1989]。（相比之下，*方法主义*始于知识与证成的标准，然后试图确定在这些标准下我们是否实际上具有任何知识或有证成的信念。）把这一进路运用于我们当前的关切，建议是：我们参照以确定性持有的信念的范式性实例来提出确定性的说明。因此，在给出上述第二个定义之后，奇泽姆说确定性这一概念由关于他所称“自我呈现的”心理状态的命题以及某些逻辑的与形而上学的公理所例示（1989，第 12 页）。"
    step2: "奇泽姆还可能采取另一种进路。按照*特殊主义*——他在认识论中偏爱的方法——我们应当以知识与证成的个别实例为指导，来建构一种认识论（Chisholm 1973 与 1989，第 6–7 页）[^chisholm-1973][^chisholm-1989]。（与此相对，*方法主义*则从知识与证成的标准出发，再试图确定：在这些标准之下，我们是否真的有知识或有证成的信念。）把这一进路移用于我们当前的关切，其建议是：我们参照以确定性持有的信念的范式性实例，来提出确定性的说明。于是，在给出上述第二个定义之后，奇泽姆说：确定性这一概念，由关于他所称“自我呈现的”心理状态的命题，以及某些逻辑的和形而上学的公理所例示（1989，第 12 页）。"
  - id: p26
    source: "Although this particularist approach probably is the way in which most philosophers think of certainty, it faces several difficulties. One is that the epistemology of the *a priori* is far from clear. Given that we do not, apparently, causally interact with necessary truths, it is hard to see how our minds can have access to them. A second difficulty has to do with knowledge of our own mental states—sometimes referred to as knowledge *by acquaintance*. According to the “speckled hen” problem, there are aspects of our mental states, such as the rich detail of one’s present visual experience, that we are not capable of knowing—e.g., if one is looking at a speckled hen, there will be a determinate number of speckles in one’s visual experience, which one will not be able to know just in virtue of having the experience (Ayer 1940, Chisholm 1989, Fumerton 2005)[^ayer-1940][^chisholm-1989][^fumerton-2005]. But those aspects we cannot know merely by being conscious of them are part of our conscious experience in just the same way as those aspects we *are* supposed to be able to know; the difficulty is specifying a principled difference between the two. Much more could be said about the first two problems, but they lie beyond the scope of this article. A third difficulty is that, at least *prima facie*, knowledge of one’s mental states seems to be of a fairly different kind from knowledge of necessary truths. It is not clear, at the outset, that we are warranted in taking them to be paradigmatic instances of a genuine epistemological kind."
    step1: "尽管这种特殊主义进路很可能就是大多数哲学家思考确定性的方式，但它面临几个困难。其一是*先验*的认识论远非清楚。鉴于我们显然并不与必然真理发生因果互动，很难看出我们的心灵如何能通达它们。第二个困难与关于我们自己心理状态的知识有关——有时被称为*亲知*知识。按照“斑点母鸡”问题，我们的心理状态有一些方面——例如一个人当下视觉经验的丰富细节——是我们无法知道的；比如，如果一个人看着一只斑点母鸡，他的视觉经验中斑点将有一个确定的数目，而仅仅凭借拥有该经验，他并不能知道这个数目（Ayer 1940、Chisholm 1989、Fumerton 2005）[^ayer-1940][^chisholm-1989][^fumerton-2005]。但是，那些我们不能仅仅凭借意识到它们而知道的方面，正是我们意识经验的一部分，正如那些我们*理应*能够知道的方面一样；困难在于具体说明二者之间原则性的区别。关于前两个问题可以说得更多，但它们超出了本词条的范围。第三个困难是，至少*初步看来*，关于我们自己心理状态的知识似乎与关于必然真理的知识颇为不同。一开始并不清楚，我们是否有理由把它们当作一种真正认识论种类的范式性实例。"
    step2: "尽管这种特殊主义进路很可能正是大多数哲学家思考确定性的方式，它却面临若干困难。其一，*先验*的认识论远非清楚。既然我们显然并不与必然真理发生因果互动，我们的心灵如何能够通达它们，就难以想见。第二个困难与关于我们自身心理状态的知识有关——有时称之为*亲知*知识。按照“斑点母鸡”问题，我们的心理状态有一些方面——例如某人当下视觉经验的丰富细节——是我们无法知道的：比方说，如果一个人正看着一只斑点母鸡，他的视觉经验中斑点会有一个确定的数目，而仅仅由于拥有这一经验，他并不能知道那个数目（Ayer 1940、Chisholm 1989、Fumerton 2005）[^ayer-1940][^chisholm-1989][^fumerton-2005]。但那些我们不能仅凭意识到它们就知道的方面，恰恰与那些我们*应当*能够知道的方面一样，属于我们意识经验的一部分；困难在于具体说明两者之间原则性的区别。关于前两个问题本可说更多，但它们已超出本词条的范围。第三个困难是，至少*初步看来*，关于自身心理状态的知识似乎与关于必然真理的知识颇为不同。一开始我们并不清楚，是否有理由把它们当作一种真正认识论种类的范式性实例。"
  - id: p27
    source: "According to a fourth conception of certainty, defended by Peter Klein, a belief “is absolutely certain just in case it is *subjectively* and *objectively* immune to doubt” (1992, p. 63; see also Miller 1978)[^miller-1978]. He explicates this in the following way:\n\n> *p* is absolutely certain for *S* if and only if (1) *p* is warranted for *S* and (2) *S* is warranted in denying every proposition, *g*, such that if *g* is added to *S*’s beliefs, the warrant for *p* is reduced (even if only very slightly) and (3) there is no true proposition, *d*, such that if *d* is added to *S*’s true beliefs the warrant for *p* is reduced (even if only very slightly). (1992, p. 63)"
    step1: "按照彼得·克莱因所辩护的第四种确定性观念，一个信念“当且仅当它*主观上*和*客观上*免疫于怀疑时，才是绝对确定的”（1992，第 63 页；另见 Miller 1978）[^miller-1978]。他以如下方式阐明这一点：\n\n> 对 *S* 而言，*p* 是绝对确定的，当且仅当 (1) *p* 对 *S* 是有保证的，并且 (2) *S* 有保证去否定每一个这样的命题 *g*：如果 *g* 被加入 *S* 的信念，*p* 的保证就被削弱（即使只是非常轻微），并且 (3) 不存在这样的真命题 *d*：如果 *d* 被加入 *S* 的真信念，*p* 的保证就被削弱（即使只是非常轻微）。（1992，第 63 页）"
    step2: "按照彼得·克莱因（Peter Klein）所辩护的第四种观念，一个信念“当且仅当它*主观上*和*客观上*免疫于怀疑时，才是绝对确定的”（1992，第 63 页；另见 Miller 1978）[^miller-1978]。他这样来阐明：\n\n> 对 *S* 而言，*p* 是绝对确定的，当且仅当 (1) *p* 对 *S* 有保证，并且 (2) *S* 有保证去否定每一个这样的命题 *g*：倘若把 *g* 加入 *S* 的信念之中，*p* 的保证就会被削弱（即使只是极轻微地），并且 (3) 不存在任何这样的真命题 *d*：倘若把 *d* 加入 *S* 的真信念之中，*p* 的保证就会被削弱（即使只是极轻微地）。（1992，第 63 页）"
  - id: p28
    source: "Klein says that the second condition is what makes the belief subjectively immune to doubt, presumably because it is the beliefs and experiences that constitute *S*’s subjective perspective that render her warranted in denying all propositions that would reduce the warrant for *p*. However, *S*’s belief system might contain false beliefs that could warrant her in denying every *g* relevant to *p*—even, in some cases, where the *g* in question is itself true—and so her belief that *p* might meet condition (2) and yet still be false. Condition (3) is meant to prevent this situation; if *p* is false, the true belief that ~*p* can be added to *S*’s belief system, thereby reducing the warrant *S* has for *p*. In requiring both (2) and (3), then, the account focuses on beliefs where the subject’s subjective situation is in a sense properly aligned with an objective structure of reasons (for a similar view, see Pollock 1986)[^pollock-1986]."
    step1: "克莱因说，第二个条件正是使信念主观上免疫于怀疑的东西，这大概是因为构成 *S* 主观视角的信念和经验，使她有保证去否定所有会削弱 *p* 的保证的命题。然而，*S* 的信念系统可能包含一些错误的信念，这些信念可以使她有保证去否定与 *p* 相关的每一个 *g*——甚至在有些情况下，所讨论的 *g* 本身是真的——所以她对 *p* 的信念可能满足条件 (2) 却仍然是假的。条件 (3) 旨在防止这种情况；如果 *p* 是假的，真信念 ~*p* 可以被加入 *S* 的信念系统，从而削弱 *S* 对 *p* 所具有的保证。因此，同时要求 (2) 和 (3)，这一说明聚焦于主体的主观处境在某种意义上与理由的客观结构恰当对齐的信念（类似看法见 Pollock 1986）[^pollock-1986]。"
    step2: "克莱因说，第二个条件正是使信念在主观上免疫于怀疑的东西，其原因大概是：构成 *S* 主观视角的那些信念与经验，使她有资格去否定所有会削弱 *p* 之保证的命题。然而，*S* 的信念系统中可能含有一些错误的信念，它们使她有权否定与 *p* 相关的每一个 *g*——甚至在有些情况下，所讨论的 *g* 本身为真——于是她对 *p* 的信念虽能满足条件 (2)，却仍然为假。条件 (3) 正是要防止这种情形；倘若 *p* 为假，真信念 ~*p* 就能被加入 *S* 的信念系统，从而削弱 *S* 对 *p* 所拥有的保证。因此，在同时要求 (2) 与 (3) 时，这一说明聚焦于这样一些信念：主体的主观处境在某种意义上与理由的客观结构恰当对齐（类似看法见 Pollock 1986）[^pollock-1986]。"
  - id: p29
    source: "There are two major difficulties facing a view of this sort. First, it is not clear how one belief is supposed to reduce the warrant for another. Suppose that I correctly believe that I have a headache and that my belief is, in an intuitive sense, absolutely certain. The first condition of Klein’s account is satisfied: the belief is warranted in virtue of my experiencing the headache. But is the second condition also satisfied? That is, would I be warranted in denying, say, the proposition that I do not in fact have a headache? If this were to be a belief added to my belief system, I would of course have contradictory beliefs. Would that entail that the warrant for both beliefs should be diminished? If the answer is yes, then my belief that I have a headache is not absolutely certain. Moreover, it is hard to see how *any* belief could then be absolutely certain, given that we can always add to our belief systems the contradictory of any of our beliefs. If the answer is no, however, there should be some explanation for why the proposition that I do not have a headache can be denied. Presumably, the explanation would have something to do with my experiencing the headache. But then what explains the certainty of the belief is the fact that it is grounded in the experience; the belief’s being subjectively immune to doubt is merely a consequence of its certainty, and not the explanation for it. This would mean that the focus of the view has shifted from subjective immunity to doubt to some sort of special warrant. How there could be such a special warrant, though, would need an account. To see the point more clearly, notice that subjective immunity to doubt will be possible only in cases where the subject’s belief is (intuitively) absolutely certain. For any belief *b* that is less than certain, the following belief could be added to the subject’s belief system: the warrant for *b* could be misleading. That belief would reduce the subject’s warrant for *b* (even if only slightly) were it to be added to her belief system, but it is not a proposition the subject can deny without being absolutely certain that *b* is true. The upshot, then, is that subjective immunity to doubt is not well-suited to playing a role in an account of certainty. Instead, it looks as though our understanding of subjective immunity to doubt depends on a prior grasp of what certainty is."
    step1: "这种看法面临两个重大困难。第一，不清楚一个信念应当如何削弱另一个信念的保证。假设我正确地相信我头痛，并且我的信念在直觉意义上是绝对确定的。克莱因说明的第一个条件得到满足：该信念因我经历头痛而有保证。但是第二个条件也得到满足吗？也就是说，我是否有保证去否定，比方说，“我事实上不头痛”这一命题？如果这被加入我的信念系统，我当然就会有矛盾的信念。这是否意味着两个信念的保证都应被削弱？如果答案是肯定的，那么我“我头痛”的信念就不是绝对确定的。此外，鉴于我们总能把我们任何信念的否定加入我们的信念系统，那么很难看出此后*任何*信念如何能是绝对确定的。然而，如果答案是否定的，那么对于“我不头痛”这一命题为何能被否定，应当有一些解释。大概，这种解释与我经历头痛有关。但这样一来，解释信念之确定性的，就是它奠基于经验这一事实；信念主观上免疫于怀疑只是其确定性的一个结果，而非其解释。这意味着这一看法的焦点已从主观上免疫于怀疑转移到某种特殊的保证。然而，这种特殊的保证如何可能存在，需要一种说明。为了更清楚地看到这一点，注意：只有在主体的信念（直觉上）绝对确定的情况下，主观上免疫于怀疑才可能。对于任何低于确定性的信念 *b*，以下信念可以被加入主体的信念系统：*b* 的保证可能是误导的。这个信念若被加入她的信念系统，就会削弱她对 *b* 的保证（即使只是轻微地），但它不是主体在不确定 *b* 为真的情况下能否定的命题。于是，结论是：主观上免疫于怀疑并不适合在确定性说明中扮演角色。相反，看起来我们对主观上免疫于怀疑的理解依赖于对确定性是什么的先行把握。"
    step2: "这类看法面临两大困难。其一，不清楚一个信念究竟应当如何削弱另一个信念的保证。假定我正确地相信自己在头痛，且我的信念在直觉的意义上绝对确定。克莱因说明的第一个条件得到了满足：该信念因我正经历头痛而有保证。但第二个条件是否也得到满足？也就是说，我是否有资格去否定“我事实上并不头痛”这一命题？如果把这个信念加入我的信念系统，我当然就会持有相互矛盾的信念。这是否意味着两个信念的保证都应当被削弱？若答案为是，那么我“我头痛”的信念就不是绝对确定的。此外，既然我们总能把我们任何信念的否定式加入信念系统，那么很难看出此后*任何*信念怎么还能是绝对确定的。但若答案为否，那么对于“我不头痛”这一命题为何能否定，总该有一些解释。这种解释大概与我经历头痛有关。然而这样一来，说明该信念之确定性的，就是它奠基于经验这一事实；信念在主观上免疫于怀疑，只是其确定性的一个结果，而不是它的解释。这意味着这一看法的焦点已经从主观上免疫于怀疑，转移到某种特殊的保证上。不过，这种特殊的保证如何可能存在，尚需一种说明。为更清楚地看到这一点，请注意：只有在主体的信念（直觉上）绝对确定的情形下，主观上免疫于怀疑才是可能的。对任何低于确定性的信念 *b*，以下信念都可以加入主体的信念系统：*b* 的保证可能是误导的。这一信念若被加入她的信念系统，就会削弱她对 *b* 的保证（哪怕只是轻微地），但它不是主体在不绝对确定 *b* 为真的情况下所能否定的命题。于是，结论便是：主观上免疫于怀疑并不适合在确定性说明中扮演角色。相反，看起来我们理解主观上免疫于怀疑，有赖于先行把握确定性是什么。"
  - id: p30
    source: "The second difficulty has to do with condition (3), which is supposed to secure objective immunity to doubt. Although it is undeniable that a subject for whom condition (3) is satisfied would be in a desirable situation, it does not seem to be attributable to her in the right sort of way—and, especially, not in the way that we expect certainty to be attributable to the person who is certain. To see this, suppose that my warrant for the belief that *p* is only moderately good. Nevertheless, my guardian angel protects my belief by making sure that any proposition such that, if it were true, would (when added to my belief system) reduce my warrant for *p*, is false. That is, my guardian angel makes sure that all potential defeaters for my belief are removed. Suppose, for example, that I see from a great distance what looks like a hawk. My guardian angel immediately annihilates all non-hawk flying objects in the area; the potential defeater, that there are flying objects indistinguishable from a hawk in the vicinity, has thus been rendered false. Although this would make my belief that *p* objectively immune to doubt, insofar as (3) is satisfied, it does not seem as though it would carry my belief any closer to certainty. The fact that the warrant for my belief is only moderately good renders irrelevant the work my guardian angel does in the world outsid of my beliefs. (Nor would the situation be helped if we stipulated that condition (2) is also satisfied. Given that my belief system could contain many false beliefs that might warrant me in rejecting all potential defeaters, my belief might be both subjectively and objectively immune to doubt—and yet still have a relatively low degree of warrant.)"
    step1: "第二个困难与条件 (3) 有关，它旨在确保客观上免疫于怀疑。尽管不可否认，一个使条件 (3) 得到满足的主体将处于一种令人向往的处境，但这似乎并不是以正确的方式归属于她——尤其不是以我们所期望的、确定性归属于那个确定者的方式。为看清这一点，假设我对 *p* 信念的保证只是中等程度的好。然而，我的守护天使保护我的信念，方法是确保任何这样的命题——如果它为真，那么（当被加入我的信念系统时）就会削弱我对 *p* 的保证——都是假的。也就是说，我的守护天使确保我的信念的所有潜在挫败者都被移除。例如，假设我从远处看到一只看起来像鹰的东西。我的守护天使立即消灭该地区所有非鹰的飞行物；潜在的挫败者，即“附近有与鹰无法区分的飞行物”，由此被变为假的。尽管这会使我对 *p* 的信念客观上免疫于怀疑，只要 (3) 得到满足，但它似乎并不会使我的信念更接近确定性。我的信念的保证只是中等程度的好，这一事实使我的守护天使在我的信念之外的世界所做的工作变得无关紧要。（即使我们规定条件 (2) 也得到满足，情形也不会改善。鉴于我的信念系统可能包含许多错误的信念，这些信念可能使我有权拒绝所有潜在的挫败者，我的信念可能既主观上又客观上免疫于怀疑——然而仍然只有相对低程度的保证。）"
    step2: "第二个困难与条件 (3) 有关，后者旨在保障客观上免疫于怀疑。尽管不可否认，一位使条件 (3) 得到满足的主体将处于一种令人向往的处境，但这似乎并非以正确的方式归于她——尤其是，并非以我们所期望于确定性归于那个确定者的方式。为看清这一点，假设我对 *p* 这一信念的保证只是中等程度的好。尽管如此，我的守护天使仍保护着我的信念，办法是确保任何这样的命题——倘若它为真，那么（在被加入我的信念系统时）会削弱我对 *p* 的保证——都是假的。也就是说，我的守护天使确保我的信念的一切潜在挫败者都被清除。假设比方说，我从远处看到一只看起来像鹰的东西。我的守护天使立即消灭该区域所有非鹰的飞行物；于是，那个潜在的挫败者，即“附近有与鹰无法区分的飞行物”，便被弄成假的。尽管这会使我对 *p* 的信念在客观上免疫于怀疑（只要 (3) 得到满足），但它似乎并不会把这一信念带得更接近确定性。我的信念的保证只是中等程度的好，这一事实使得我的守护天使在我信念之外的世界里所做的工作变得无关紧要。（即便我们规定条件 (2) 也得到满足，情形也并不会好转。鉴于我的信念系统可能含有许多错误的信念，它们或许使我有权拒绝所有潜在的挫败者，我的信念便可能既主观上又客观上免疫于怀疑——却仍然只有相对低程度的保证。）"
  - id: p31
    source: "It may be that one of the four conceptions of certainty discussed above could be improved so as to answer all objections. But, until that happens, it is safe to say that there is at present no completely satisfactory conception of certainty."
    step1: "可能上述讨论的四种确定性观念之一能够得到改进，从而回答所有反对意见。但是，在那发生之前，可以肯定地说，目前不存在完全令人满意的确定性观念。"
    step2: "上文讨论的四种确定性观念中，或许有某一种能够加以改进，从而回应所有的反对意见。但在此之前，我们可以稳妥地说：目前并不存在一种完全令人满意的确定性观念。"
  - id: p32
    source: "Typically, epistemologists are concerned with the conditions under which a subject may know or be certain that *p* at a particular moment. Interestingly, however, somewhat different issues arise for certainty over time. As this was a primary concern for Descartes, who tells us in the First Meditation that he wants to establish something “in the sciences that was stable and likely to last,” we can best see how those issues arise in the context of Descartes’s epistemology (PW 2, p. 12)."
    step1: "通常，认识论者关注的是主体在某个特定时刻可以知道或确定 *p* 的条件。然而，有趣的是，跨时间的确定性会引发一些颇为不同的问题。由于这是笛卡尔的主要关切——他在《第一沉思》中告诉我们，他想确立某种“在科学中稳定而可能持久”的东西——我们最好在笛卡尔认识论的语境中看这些问题如何产生（PW 2，第 12 页）。"
    step2: "一般而言，认识论者关心的是主体在某一特定时刻得以知道或确定 *p* 的条件。但耐人寻味的是，跨时间的确定性却引发一些颇为不同的议题。由于这正是笛卡尔的头等关切——他在《第一沉思》中告诉我们，他想确立某种“在诸科学中稳固而可能持久”的东西——我们最好在笛卡尔认识论的语境中看出这些问题如何产生（PW 2，第 12 页）。"
  - id: p33
    source: "In the Second Set of Objections, Mersenne poses the following problem: although Descartes has argued that our ability to know anything depends on our first knowing that God exists and is not a deceiver, it seems clear that an atheist mathematician can have the same sort of mathematical knowledge as a theist. In response, Descartes allows that the atheist does have a clear awareness (*cognitio*) of simple mathematical truths, but he denies that this clear awareness is “true knowledge [*scientia*]” (PW 2, p. 101). At first glance, it seems that Descartes draws the distinction between *cognitio* and *scientia* precisely so he can deny certainty to the atheist mathematician. But there is good reason to think that this is not what he has in mind."
    step1: "在《第二组反驳》中，梅森提出以下问题：尽管笛卡尔已论证，我们认识任何东西的能力有赖于我们首先知道上帝存在且不是骗子，但似乎很清楚，一个无神论数学家可以拥有与有神论者同样种类的数学知识。作为回应，笛卡尔承认无神论者确实对简单的数学真理有一种清楚的觉知（*cognitio*），但他否认这种清楚的觉知是“真正的知识［*scientia*］”（PW 2，第 101 页）。乍一看，笛卡尔在 *cognitio* 与 *scientia* 之间作出区分，似乎正是为了拒绝给予无神论数学家以确定性。但有充分理由认为这不是他的本意。"
    step2: "在《第二组反驳》中，梅森（Mersenne）提出这样一个问题：尽管笛卡尔论证过，我们认识任何事物的能力都以我们首先知道上帝存在且非骗子为前提，但似乎很清楚，一位无神论数学家能够拥有与有神论者同类的数学知识。作为回应，笛卡尔承认无神论者确实对简单的数学真理具有一种清楚的觉知（*cognitio*），但他否认这种清楚的觉知是“真正的知识［*scientia*］”（PW 2，第 101 页）。乍看之下，笛卡尔在 *cognitio* 与 *scientia* 之间划界，似乎正是为了拒绝给予无神论数学家确定性。但我们有充分理由认为，这并非他的用意所在。"
  - id: p34
    source: "To see this, notice that, if Descartes does not allow the atheist to be able to acquire knowledge through clear and distinct perception, he will fall into the so-called Cartesian Circle. This problem, first identified by Arnauld in the Fourth Set of Objections, arises if Descartes holds both of the following claims: (i) I can know that my clear and distinct perceptions are true only if I first know that a non-deceiving God exists, and (ii) I can know that a non-deceiving God exists only if I first know that my clear and distinct perceptions are true. Because knowing one thing is a precondition for knowing the other, and *vice versa*, I cannot know either of them. In fact, however, it does not look as though Descartes does fall into the circle. Although it is pretty clear that he is committed to (1)—in the Third Meditation, he says that, “if I do not know [whether there is a non-deceiving God], it seems that I can never be quite certain about anything else” (PW 2, p. 25)—there is no reason to take him to be committed to (ii). Descartes is willing to permit the meditator to use clear and distinct perceptions before knowing that they are generally true. The clearest example, of course, is the *cogito*; the meditator first comes to know that he exists as a thinking thing and only later comes to know that his knowledge of the *cogito* is grounded in its clarity and distinctness. The same, then, can be said for the meditator’s knowledge—grounded in some clearly and distinctly perceived causal principles—that God exists. In using those principles, the meditator does not first need to have the general knowledge that clear and distinct perceptions are true (see Van Cleve 1979)[^van-1979]."
    step1: "为看清这一点，注意：如果笛卡尔不允许无神论者通过清楚明白的知觉获得知识，他就会陷入所谓的笛卡尔循环。这个问题首先由阿尔诺在《第四组反驳》中指出，如果笛卡尔同时持有以下两个主张，它就会产生：(i) 只有当我先知道一个不欺骗的上帝存在时，我才能知道我的清楚明白的知觉是真的；(ii) 只有当我先知道我的清楚明白的知觉是真的时，我才能知道一个不欺骗的上帝存在。因为知道一件事是知道另一件事的前提，反之亦然，所以我无法知道其中任何一件。然而，事实上，笛卡尔看起来并没有陷入循环。尽管很清楚他承诺 (1)——在《第三沉思》中他说，“如果我不知道［是否存在一个不欺骗的上帝］，看来我永远无法对任何别的东西相当确定”（PW 2，第 25 页）——但没有理由认为他承诺 (ii)。笛卡尔愿意允许沉思者在知道清楚明白的知觉普遍为真之前使用它们。最清楚的例子当然是*我思*；沉思者首先知道他作为一个在思考的东西而存在，后来才知道他对*我思*的知识奠基于其清楚明白性。同样，对沉思者基于某些清楚明白地知觉到的因果原则而对上帝存在的知识也可以这样说。在使用这些原则时，沉思者并不首先需要具有“清楚明白的知觉为真”这一普遍知识（见 Van Cleve 1979）[^van-1979]。"
    step2: "为看清这一点，请注意：如果笛卡尔不让无神论者通过清楚明白的知觉获得知识，他就会陷入所谓笛卡尔循环。这个问题最初由阿尔诺（Arnauld）在《第四组反驳》中指出；倘若笛卡尔同时持有以下两个主张，它就会出现：(i) 只有当我知道一个不欺骗的上帝存在时，我才能知道我的清楚明白的知觉为真；(ii) 只有当我知道我的清楚明白的知觉为真时，我才能知道一个不欺骗的上帝存在。既然知道其中一件事是知道另一件事的前提，反之亦然，那么两件事我都无从知道。不过事实上，笛卡尔看起来并没有陷入循环。尽管相当清楚他承诺 (i)——在《第三沉思》中他说，“如果我不知道［是否存在一个不欺骗的上帝］，看来我就永远无法对任何别的东西相当确定”（PW 2，第 25 页）——却没有理由认为他承诺 (ii)。笛卡尔愿意允许沉思者在知道清楚明白的知觉普遍为真之前就使用它们。最清楚的例子当然是*我思*：沉思者先是知道他作为一个在思考的东西而存在，后来才认识到他对*我思*的知识奠基于其清楚明白性。同样，就沉思者基于某些清楚明白地知觉到的因果原则而对上帝存在的知识而言，也可作如是观。在使用这些原则时，沉思者并不先要具有“清楚明白的知觉为真”这一普遍知识（见 Van Cleve 1979）[^van-1979]。"
  - id: p35
    source: "Still, some philosophers might object that the meditator has no business using principles that he does not know to be true. Descartes would not be sympathetic to this objection. As he says in his conversation with Burman, so long as the meditator is using the causal principles, “he is actually paying attention to them. And for as long as he does pay attention to them, he is certain that he is not being deceived, and he is compelled to give his assent to them” (PW 3, p. 334; see also PW 2, pp. 25, 48; see also Cottingham 1986, p. 67)[^cottingham-1986]. So, the doubt that Descartes raises with respect to clear and distinct perceptions does not extend to the moments at which one is actually enjoying them. Rather, it is a doubt that, *in general*, clear and distinct perception may not be a reliable source of beliefs (Kenny 1968, p. 194)[^kenny-1968]. When Descartes introduces the evil demon hypothesis in the First Meditation, it is meant to encapsulate his ignorance of his own origin—and, in particular, ignorance of the construction of his own mind. Without knowing that a non-deceiving God exists, it is possible for the meditator that his mind works in such a way that it falls into error even when it is contemplating the simplest questions. This doubt is chased away when he actually *does* contemplate such a question, but it can easily return at a later time when his thoughts are turned elsewhere. This is the sense in which the atheist mathematician’s *cognitio*, or clear awareness, is imperfect. Although it is certain at the time the atheist has the perception, it can always be rendered doubtful at another time. The theist has *no* advantage over the atheist at the time each enjoys a clear and distinct perception. Rather, the theist’s advantage lies in the fact that, armed with the certainty that a non-deceiving God exists, she will *always* remain free from doubt (Descartes PW 2, p. 48; see also Kenny 1968, p. 193; Reed 2012)[^kenny-1968][^reed-2012]. Consequently, she will be able to construct her scientific theories without ever falling prey to worries about whether her work has value, and—perhaps even more importantly—she will be in a position to definitively put an end to theoretical disagreements with others. (The Stoics make a similar distinction; see Cicero *On Academic Scepticism*, p. 84.)"
    step1: "尽管如此，一些哲学家可能反对：沉思者无权使用他并不知道为真的原则。笛卡尔不会同情这一反对。正如他在与布尔曼的谈话中所说，只要沉思者在使用因果原则，“他实际上就在注意它们。而只要他确实注意它们，他就确定他没有被欺骗，并且不得不对它们表示同意”（PW 3，第 334 页；另见 PW 2，第 25、48 页；另见 Cottingham 1986，第 67 页）[^cottingham-1986]。所以，笛卡尔就清楚明白的知觉所提出的怀疑，并不延伸到人们实际上正在享受它们的时刻。毋宁，它是一种怀疑：*一般地说*，清楚明白的知觉可能不是信念的可靠来源（Kenny 1968，第 194 页）[^kenny-1968]。当笛卡尔在《第一沉思》中引入恶魔假说时，它是为了概括他对自己起源的无知——特别是对他自己心灵构造的无知。在不知道一个不欺骗的上帝存在的情况下，沉思者的心灵可能以这样一种方式运作：即使它正在思考最简单的问题，也会陷入错误。当他实际上*确实*思考这样一个问题时，这种怀疑被驱散，但它可以在后来的某个时刻容易地回来，当他的思绪转向别处时。这就是无神论数学家的 *cognitio*（或清楚觉知）不完善的意义。尽管它在无神论者具有知觉的时刻是确定的，它却可以在另一个时刻总是被弄成可疑的。在每个人享有清楚明白的知觉的时刻，有神论者对无神论者*没有*任何优势。毋宁，有神论者的优势在于：有了“一个不欺骗的上帝存在”这一确定性，她将*永远*免于怀疑（笛卡尔 PW 2，第 48 页；另见 Kenny 1968，第 193 页；Reed 2012）[^kenny-1968][^reed-2012]。结果，她将能够建构她的科学理论，而从不成为“她的工作是否有价值”这一担忧的牺牲品，并且——也许更重要的是——她将处于能够最终地终结与他人理论分歧的地位。（斯多亚派作出类似的区分；见西塞罗《论学院派怀疑论》，第 84 页。）"
    step2: "话虽如此，一些哲学家可能反对：沉思者并无资格使用他并不知道为真的原则。笛卡尔不会认同这一反对。正如他在与布尔曼（Burman）的谈话中所说，只要沉思者在使用那些因果原则，“他实际上就在关注它们。而只要他确实关注它们，他就确定自己没有被欺骗，并且不得不对它们表示同意”（PW 3，第 334 页；另见 PW 2，第 25、48 页；另见 Cottingham 1986，第 67 页）[^cottingham-1986]。因此，笛卡尔针对清楚明白的知觉所提出的怀疑，并不延伸到人们实际上正享有这些知觉的那些时刻。毋宁，它是一种这样的怀疑：*一般地说*，清楚明白的知觉可能不是信念的可靠来源（Kenny 1968，第 194 页）[^kenny-1968]。当笛卡尔在《第一沉思》中引入恶魔假说时，它是为了概括他对自身起源的无知——尤其是对他自己心灵构造的无知。在不知道一个不欺骗的上帝存在的情况下，沉思者的心灵可能以这样一种方式运作：即便它正在思考最简单的问题，也会陷入错误。当他实际上*确实*在思考这样一个问题时，这种怀疑便被驱散；但在后来的某个时刻，当他的思绪转向别处时，它又容易卷土重来。无神论数学家的 *cognitio*（即清楚觉知）之所以不完善，意义正在于此。尽管它在无神论者具有该知觉的时刻是确定的，它在另一个时刻却总可能被弄得可疑。在两人各自享有清楚明白的知觉时，有神论者对无神论者*并无*任何优势。毋宁，有神论者的优势在于：有了“一个不欺骗的上帝存在”这一确定性，她将*永远*免于怀疑（笛卡尔 PW 2，第 48 页；另见 Kenny 1968，第 193 页；Reed 2012）[^kenny-1968][^reed-2012]。结果，她将能够建构自己的科学理论，而从不沦为“她的工作是否有价值”这一忧虑的牺牲品，并且——也许更为重要——她将处于这样一种位置：能够一劳永逸地终结与他人的理论分歧。（斯多亚派作出了类似的区分；见西塞罗《论学院派怀疑论》，第 84 页。）"
  - id: p36
    source: "Given this account of Descartes’s epistemology, we can now see that both *cognitio* and *scientia* are varieties of, not only knowledge, but certainty as well. This is an important point to note, for it means that certainty cannot be straightforwardly characterized in terms of indubitability. For a belief known with certainty to be immune to doubt—not merely at a moment but absolutely—it must be embedded in a coherent system of beliefs, all of which are known with certainty (for a similar account of Descartes’s epistemology, see Sosa 1997, though Sosa takes *cognitio* to be a lower grade of knowledge than *scientia*; also, see Loeb 1992 on the importance of stability for Descartes’s epistemology)[^loeb-1992][^sosa-1997]. *Scientia*, or systematic certainty, represents an admirable, but probably unattainable, goal. If humans are capable of certainty at all, it is surely of the sort that is capable of mixing with doubts."
    step1: "鉴于笛卡尔认识论的这一说明，我们现在可以看到，*cognitio* 和 *scientia* 都不仅是知识的种类，也是确定性的种类。这是一个值得注意的重要之点，因为它意味着不能直截了当地依据不可怀疑性来刻画确定性。一个以确定性被知道的信念要免疫于怀疑——不仅仅在一个时刻，而是绝对地——它就必须被嵌入一个连贯的信念系统，其中所有信念都是以确定性被知道的（关于笛卡尔认识论的类似说明，见 Sosa 1997，尽管索萨把 *cognitio* 视为比 *scientia* 更低等级的知识；另见 Loeb 1992 关于稳定性对笛卡尔认识论的重要性）[^loeb-1992][^sosa-1997]。*Scientia*，即系统性的确定性，代表着一个令人钦佩但很可能无法达到的目标。如果人类终究能够具有确定性，那一定是那种能够与怀疑混合的确定性。"
    step2: "有了对笛卡尔认识论的这一说明，我们现在可以看到：*cognitio* 与 *scientia* 都不只是知识的种类，也是确定性的种类。这是一个值得注意的重要之点，因为它意味着不能直截了当地以不可怀疑性来刻画确定性。一个以确定性被知道的信念若要免疫于怀疑——不是仅在某一时刻，而是绝对地——它就必须嵌入一个连贯的信念系统，其中所有信念都以确定性被知道（关于笛卡尔认识论的类似说明，见 Sosa 1997，尽管索萨把 *cognitio* 看作比 *scientia* 更低等级的知识；另见 Loeb 1992 关于稳定性对笛卡尔认识论的重要性的论述）[^loeb-1992][^sosa-1997]。*Scientia*，即系统性的确定性，代表着一个令人钦佩、但很可能无法达到的目标。如果人类终究能够具有确定性，那必定是那种能够与怀疑相混合的确定性。"
  - id: p37
    source: "Edward Craig (1990) has argued that we can better understand the concept of knowledge by examining the purpose or purposes it serves. In a similar way, perhaps, the concept of certainty can be rendered clearer by looking at the ways in which philosophers have tried to put certainty to use. Most fundamentally, certainties provide us with inputs to inference that are stable and secure. If they are immune to doubt, they can put an end to the demand for reasons that feature in the Pyrrhonist’s argument for general skepticism (see Sextus Empiricus, *Outlines of Scepticism*; Sosa 1997; Sienkiewicz 2019)[^sienkiewicz-2019][^sosa-1997]. If they have probability 1, they can simplify reasoning by allowing the reasoner to treat them as simply given, without having to attend to the risk of error for each individual premise or the accumulation of error as uncertain premises are combined. If they are indefeasible, they can allow us to reject any potential counterevidence as misleading."
    step1: "爱德华·克雷格（1990）论证说，我们可以通过考察知识所服务的那个或那些目的来更好地理解知识概念。类似地，也许我们可以通过考察哲学家们试图运用确定性的方式，使确定性概念变得更清楚。最根本地，确定性为我们提供稳定而可靠的推理输入。如果它们免疫于怀疑，它们就能终结皮浪主义者在一般怀疑论论证中所要求的理由（见塞克斯都·恩披里柯《怀疑论纲要》；Sosa 1997；Sienkiewicz 2019）[^sienkiewicz-2019][^sosa-1997]。如果它们具有概率 1，它们就能通过允许推理者把它们视为理所当然地给予的，而不必注意每个单独前提的错误风险或不确定前提结合时错误的累积，来简化推理。如果它们是不可废止的，它们就能允许我们把任何潜在的反证当作误导的而加以拒斥。"
    step2: "爱德华·克雷格（Edward Craig，1990）论证过，我们可以通过考察知识所服务的那个或那些目的，来更好地理解知识概念。同样地，也许我们可以通过审视哲学家们试图运用确定性的种种方式，来使确定性概念变得更为清晰。最根本地说，确定性为我们提供稳定而牢固的推理输入。如果它们免疫于怀疑，它们就能终止皮浪主义者在一般怀疑论论证中所提出的对理由的要求（见塞克斯都·恩披里柯《怀疑论纲要》；Sosa 1997；Sienkiewicz 2019）[^sienkiewicz-2019][^sosa-1997]。如果它们具有概率 1，它们就能使推理变得简单：让推理者把它们仅仅当作理所当然地给予的，而不必留意每一个单独前提的错误风险，也不必留意不确定前提相结合时错误的累积。如果它们是不可废止的，它们就能让我们把任何潜在的反证当作误导的而加以拒斥。"
  - id: p38
    source: "Some philosophers have argued that certainty is the norm of assertion: one can assert that *p* just in case one is certain that *p* (Stanley 2008; Peterson 2019; Beddor 2020b)[^beddor-2020b][^stanley-2008]. The norm is often defended by adapting Moore’s paradox to certainty (Moore 1942)[^moore-1942]. According to the original form of the paradox, there is something infelicitous about assertions like, “It’s raining, but I don’t believe it is.” Defenders of the certainty norm of assertion argue that assertions like, “Dogs bark, but I’m not certain that they do,” are just as odd (Stanley 2008, p. 47)[^stanley-2008]. The explanation of this infelicity is then provided by the fact that certainty is the norm of assertion. When the speaker asserts, “Dogs bark,” but then goes on to deny being certain of that claim, she has undermined her own assertion, contradicting in practice what she has just said."
    step1: "一些哲学家论证说，确定性是断言规范：一个人可以断言 *p*，当且仅当一个人确定 *p*（Stanley 2008；Peterson 2019；Beddor 2020b）[^beddor-2020b][^stanley-2008]。这一规范常常通过把摩尔悖论改编到确定性来辩护（Moore 1942）[^moore-1942]。按照该悖论的原初形式，像“下雨了，但我不相信它在下”这样的断言有某种不当之处。断言确定性规范的辩护者论证说，像“狗会叫，但我不确定它们会叫”这样的断言同样奇怪（Stanley 2008，第 47 页）[^stanley-2008]。这种不当性的解释随后由“确定性是断言规范”这一事实提供。当说话者断言“狗会叫”，然后又继续否认自己对该主张的确定性时，她已破坏了自己的断言，在实践中与她刚才所说的话相矛盾。"
    step2: "一些哲学家论证过，确定性是断言规范：一个人能够断言 *p*，当且仅当一个人确定 *p*（Stanley 2008；Peterson 2019；Beddor 2020b）[^beddor-2020b][^stanley-2008]。这一规范常通过把摩尔悖论改编到确定性上来加以辩护（Moore 1942）[^moore-1942]。按照该悖论的原初形式，像“下雨了，但我不相信它在下”这样的断言，确有某种不妥之处。断言确定性规范的辩护者主张，像“狗会叫，但我不确定它们会叫”这样的断言，同样地奇怪（Stanley 2008，第 47 页）[^stanley-2008]。这种不妥之处的解释，随后便由“确定性是断言规范”这一事实给出。当说话者断言“狗会叫”，却接着否认自己对此主张的确定时，她实际上是在自我拆台，在实践上与她刚刚所说的话相矛盾。"
  - id: p39
    source: "Williamson (2000) and Turri (2016) reject the certainty norm of assertion. Although a certainty version of Moore’s paradox does sound infelicitous, it doesn’t sound quite so bad as a knowledge version. Moreover, the oddity of the certainty version can be explained by the fact that there is generally “a reluctance to allow the contextually set standards for knowledge and certainty to diverge” (Williamson 2000, p. 254). That is, the standards for what counts as knowledge and as certainty typically match one another. Nevertheless, in some contexts we can pull them apart. When that happens, Williamson suggests that we assess assertions in accordance with the knowledge norm. Turri (2016) reports empirical results confirming that this is in fact the way ordinary speakers assess assertions."
    step1: "威廉姆森（2000）和图里（2016）拒斥断言确定性规范。尽管确定性的摩尔悖论版本听起来确实不当，但它听起来并不像知识版本那么糟。此外，确定性版本之奇怪可以这样解释：一般存在“一种不愿意让语境性地设定的知识与确定性标准发生分歧的倾向”（Williamson 2000，第 254 页）。也就是说，什么算作知识和什么算作确定性的标准通常彼此匹配。然而，在一些语境中我们可以把它们分开。当这种情况发生时，威廉姆森建议我们按照知识规范来评估断言。图里（2016）报告的经验结果证实，这实际上是普通说话者评估断言的方式。"
    step2: "威廉姆森（2000）与图里（Turri，2016）都拒绝断言确定性规范。尽管确定性的摩尔悖论版本听上去确有不妥，但它听起来并不像知识版本那样糟糕。而且，确定性版本的奇怪之处，可以由以下事实来解释：通常存在“一种不愿让语境性地设定的知识与确定性标准相互背离的倾向”（Williamson 2000，第 254 页）。也就是说，什么算作知识的标准与什么算作确定性的标准，通常是彼此吻合的。尽管如此，在某些语境中我们仍能把它们分开。一旦如此，威廉姆森便建议我们按照知识规范来评估断言。图里（2016）报告的经验结果证实，这事实上正是普通说话者评估断言的方式。"
  - id: p40
    source: "Some philosophers have also argued that certainty is the norm of practical reasoning: one can rely on *p* in relevant practical reasoning just in case one is certain that *p* (Beddor 2020a)[^beddor-2020a]. The argument for the certainty norm depends on two premises. First, if one is genuinely relying on the premise that *p*, one is psychologically certain that *p*. If one has a lower credence with respect to whether *p*, one is not in fact relying on *p* but instead on the proposition that it is likely that *p*. Second, the epistemic norm for psychological certainty is epistemic certainty. To be psychologically certain with respect to a proposition for which one does not have epistemic certainty is to violate Hume’s dictum that “A wise man...proportions his belief to the evidence” (Hume 1748 [2007])[^hume-1748]."
    step1: "一些哲学家也论证说，确定性是实践推理的规范：在相关的实践推理中，一个人可以依赖 *p*，当且仅当一个人确定 *p*（Beddor 2020a）[^beddor-2020a]。确定性规范的论证依赖两个前提。第一，如果一个人确实在依赖 *p* 这一前提，那么他在心理上确定 *p*。如果他对 *p* 与否具有较低的信度，那么他实际上并不在依赖 *p*，而是在依赖“*p* 很可能”这一命题。第二，心理确定性的认识论规范是认识论确定性。对一个并不具有认识论确定性的命题在心理上确定，就是违反休谟的箴言“一个明智的人……使他的信念与证据成比例”（Hume 1748 [2007]）[^hume-1748]。"
    step2: "一些哲学家也论证过，确定性是实践推理的规范：在相关的实践推理中，一个人能够依赖 *p*，当且仅当这个人确定 *p*（Beddor 2020a）[^beddor-2020a]。为确定性规范所作的论证依赖两个前提。其一，如果一个人确实在依赖 *p* 这一前提，那么他在心理上确定 *p*。倘若他对 *p* 与否抱有较低的信度，那么他实际上并非依赖 *p*，而是依赖“*p* 很可能”这一命题。其二，心理确定性的认识论规范就是认识论确定性。对一个自己并不具有认识论确定性的命题抱以心理上的确定，就是违反休谟的箴言：“一个明智的人……使他的信念与证据成比例”（Hume 1748 [2007]）[^hume-1748]。"
  - id: p41
    source: "Although the second premise of the argument seems reasonable enough, the first premise is overly rigorous. In many cases, the chance of a premise being false is negligible, though not quite zero. We might well rely on it simply because it isn’t worth the effort to formulate a more precise premise. For example, in choosing a path to walk home on a day when I am in no particular hurry, I might rely on the thought that the path I’m on is as good as any other--and I don’t bother to calculate the possibility that I’m wrong. Even in cases where I am, in fact, trying to be more careful, I’ll often have to rely on an uncertain belief at some point. Suppose I’m trying to decide whether to rely on the proposition that *p* but come to see that it is uncertain. So, I pull back to the claim that it is likely that *p*. But I may not be certain that it’s likely that *p*. If so, I can either pull back even further--to the proposition that it is likely that it is likely that *p*--or I can simply rely, albeit tentatively, on the proposition that *p*. In almost every case, the latter is the more natural course of action to take."
    step1: "尽管该论证的第二个前提似乎足够合理，第一个前提却过于严格。在许多情况下，一个前提为假的机会是可以忽略的，尽管并非完全为零。我们很可能依赖它，仅仅因为不值得花力气去表述一个更精确的前提。例如，在一个我并不特别赶时间的日子里选择走回家的路时，我可能依赖“我正走的路与任何其他路一样好”这一想法——而我不费心去计算我弄错的可能性。即使在我事实上试图更小心的情形下，我也常常不得不在某个时候依赖一个不确定的信念。假设我试图决定是否依赖 *p* 这一命题，但认识到它是不确定的。于是，我退回到“*p* 很可能”这一主张。但我可能不确定“*p* 很可能”。如果是这样，我可以要么更进一步退回到“*p* 很可能很可能”这一命题——要么我可以简单地、尽管试探性地依赖 *p* 这一命题。在几乎每一种情况下，后者是更自然的做法。"
    step2: "尽管论证的第二个前提看起来足够合理，第一个前提却过于严苛。在许多情况下，一个前提为假的机会微乎其微，尽管并非全然为零。我们很可能依赖它，只因不值得费劲去表述一个更精确的前提。例如，在一个我并不赶时间的日子里选择走回家的路线时，我可能依赖“我正走的路与任何别的路一样好”这一想法，而不去费心计算自己弄错的可能性。即便在我事实上想更加小心的场合，我也常常不得不在某一刻依赖某个不确定的信念。假设我正试图决定是否依赖 *p* 这一命题，却认识到它并不确定。于是我便退回到“*p* 很可能”这一主张。但我也许并不确定“*p* 很可能”。倘若如此，我要么进一步退回到“*p* 很可能很可能”这一命题，要么就干脆——尽管是试探性地——依赖 *p* 这一命题。在几乎每一种情形下，后者都是更自然的做法。"
  - id: p42
    source: "A common objection to both the claim that certainty is the norm of assertion and the claim that certainty is the norm of practical action is that certainty is scarce (see Unger 1975)[^unger-1975]. If so, this will mean that we rarely make proper assertions or behave in a practically rational way. Defenders of these norms typically respond by offering a contextualist account of certainty (Stanley 2008, p. 54; Beddor 2020a, p. 722)[^beddor-2020a][^stanley-2008]. On such a view, the epistemic standards governing attributions of certainty can vary from one context to another. (Variations in conversational context will yield a contextualist view of the sort DeRose 1995 defends for knowledge attributions; variations in practical context will yield a subjective-sensitive or interest-relative view like those Hawthorne 2004 and Stanley 2005 defend with respect to knowledge.)[^derose-1995][^hawthorne-2004][^stanley-2005] So, what is certain in one context may fail to be in another, if the relevant standards have risen in the latter context. Although some contexts will have relatively stringent standards for what counts as certain, others may have standards that are relatively lax. In the latter contexts, then, attaining certainty shouldn’t be overly challenging."
    step1: "对“确定性是断言规范”和“确定性是实践行动规范”这两个主张的一个共同反对意见是：确定性是稀缺的（见 Unger 1975）[^unger-1975]。如果如此，这将意味着我们很少作出恰当的断言或以实践理性的方式行事。这些规范的辩护者通常通过提供一种确定性语境主义说明来回应（Stanley 2008，第 54 页；Beddor 2020a，第 722 页）[^beddor-2020a][^stanley-2008]。按照这种看法，支配确定性归属的认识论标准可以随语境而变。（会话语境的变化会产生一种语境主义看法，如 DeRose 1995 为知识归属所辩护的那种；实践语境的变化会产生一种主观敏感的或利益相对的看法，如 Hawthorne 2004 与 Stanley 2005 就知识所辩护的那些。）[^derose-1995][^hawthorne-2004][^stanley-2005] 所以，在一个语境中是确定的东西，如果相关标准在另一个语境中已提高，就可能不再是确定的。尽管一些语境对什么算作确定具有相对严格的标准，另一些语境的标准则可能相对宽松。那么，在后一种语境中，获得确定性不应过于困难。"
    step2: "对“确定性是断言规范”与“确定性是实践行动规范”这两个主张，有一个共同的反对意见：确定性是稀缺的（见 Unger 1975）[^unger-1975]。果真如此，那就意味着我们很少作出恰当的断言，或很少以实践理性的方式行事。这些规范的辩护者通常以下列方式回应：提出一种关于确定性的语境主义说明（Stanley 2008，第 54 页；Beddor 2020a，第 722 页）[^beddor-2020a][^stanley-2008]。按照这种看法，支配确定性归属的认识论标准可以随语境而变。（会话语境的变化，会产生一种如 DeRose 1995 就知识归属所辩护的那种语境主义看法；实践语境的变化，则会产生一种主观敏感的或利益相对的看法，如 Hawthorne 2004 与 Stanley 2005 就知识所辩护的那些。）[^derose-1995][^hawthorne-2004][^stanley-2005] 因此，在一个语境中确定的东西，如果在另一个语境中相关标准已经提高，就可能不再是确定的。尽管某些语境对什么算作确定具有相对严格的标准，另一些语境的标准却可能相对宽松。那么，在后一类语境中，获得确定性就不应过于困难。"
  - id: p43
    source: "The debate regarding contextualism is too enormous to enter into here. Still, it is worth asking whether certainty that is protected by the contextualist strategy really should count as genuine certainty. After all, the idea was that a belief one knew with certainty to be correct was one that made one immune from doubt *full stop*, and not just immune from doubt in the present circumstances. It was supposed to be a belief that one could rely on without hesitation in drawing inferences, evaluating new evidence, and answering questions and challenges from others. Contextually protected certainty is capable of nothing quite so stable and secure. In fact, it looks more like the epistemic version of moral certainty--good enough for most purposes, but not as good as it might be (see Matthen 2014 and Locke 2015 for views that more explicitly eschew the label of “epistemic certainty” in fleshing out this kind of epistemic status)[^locke-2015][^matthen-2014]."
    step1: "关于语境主义的辩论太大，这里无法展开。尽管如此，值得问一问：受语境主义策略保护的确定性，是否真的应当算作真正的确定性。毕竟，其理念是：一个我们以确定性知道为正确的信念，是一个使我们*完全地*免疫于怀疑的信念，而不仅仅是在当下处境中免疫于怀疑。它本应是一个我们在作推理、评估新证据、回答他人的问题和挑战时可以毫无犹豫地依赖的信念。语境保护的确定性却无法做到如此稳定而可靠。事实上，它看起来更像道德确定性的认识论版本——对大多数目的而言足够好，但不如它本可以那么好（关于更明确地抛弃“认识论确定性”标签来充实这类认识论地位的看法，见 Matthen 2014 与 Locke 2015）[^locke-2015][^matthen-2014]。"
    step2: "关于语境主义的争论过于庞大，此处无法展开。尽管如此，仍值得一问：受到语境主义策略保护的确定性，是否真的应当算作货真价实的确定性。毕竟，其理念本在于：一个我们以确定性知道为正确的信念，是一个使我们*完全彻底地*免疫于怀疑的信念，而不只是在当下处境中免疫于怀疑。它本应是一个我们在进行推理、评估新证据、回应他人的问题与挑战时都能毫无迟疑地依赖的信念。而语境保护的确定性，却无法做到这般稳定与牢固。事实上，它看起来更像是道德确定性的认识论版本——对大多数目的而言足够好，却不如它本可以那么好（关于更明确地摒弃“认识论确定性”这一标签、以充实这类认识论地位的看法，见 Matthen 2014 与 Locke 2015）[^locke-2015][^matthen-2014]。"
  - id: p44
    source: "Philosophers who defend fallibilism about knowledge will be untroubled by this outcome (see Hetherington 2001; Reed 2013; Brown 2018)[^brown-2018][^hetherington-2001][^reed-2013]. Others may lament the fading of certainty as an epistemic ideal while arguing that its abandonment is nevertheless better than going down to epistemic defeat (Pasnau 2017)[^pasnau-2017]. A hardy few may continue to press ahead, like Descartes, in the attempt to “scale the heights of human knowledge” (PW 1, p. 11; Klein 1981)[^klein-1981]."
    step1: "为关于知识的可误论辩护的哲学家将不为这一结果所困扰（见 Hetherington 2001；Reed 2013；Brown 2018）[^brown-2018][^hetherington-2001][^reed-2013]。其他人可能会哀叹确定性作为一种认识论理想的消退，同时论证说放弃它仍然比走向认识论失败要好（Pasnau 2017）[^pasnau-2017]。少数坚韧的人可能继续前进，像笛卡尔那样，试图“登上人类知识的高度”（PW 1，第 11 页；Klein 1981）[^klein-1981]。"
    step2: "为关于知识的可误论辩护的哲学家，不会因这一结果而困扰（见 Hetherington 2001；Reed 2013；Brown 2018）[^brown-2018][^hetherington-2001][^reed-2013]。另一些人则可能哀叹确定性作为一种认识论理想正在消退，同时辩称：放弃它仍比堕入认识论失败要好（Pasnau 2017）[^pasnau-2017]。少数坚毅者可能继续奋力前行，像笛卡尔那样，试图“攀登人类知识的高峰”（PW 1，第 11 页；Klein 1981）[^klein-1981]。"
