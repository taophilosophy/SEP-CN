      There was a similar late medieval debate on intentionality, that is, the relation between mental states and their objects. It is no surprise, given Ockham’s arguments about *species*, that he took an externalist line on these, too: he poses the question by asking whether, if an angel saw the contents of my mind when I was thinking about some singular object, could the angel (supposing that it did not know about anything external to my mind) tell which object I was thinking about? Ockham answered no: and this thought experiment seems to show that my mental state (i.e.\ my thinking of this particular object) is not determined by the contents of my mind alone (Panaccio 2010, pp. 242f., William of Ockham 1981, pp. 378f.)[^william-1981][^panaccio-2010]. This is clearly *some sort of* externalist position, but describing this position exactly has proved to be surprisingly difficult (Panaccio 2010, Normore 2010, Brower-Toland 2007)[^brower-toland-2007][^normore-2010][^panaccio-2010]. Correspondingly although many medieval thinkers were sympathetic to arguments of this sort, the details of the positions they adopted were by no means uniform. For example, followers of Scotus, such as Francis of Meyronnes, held positions on intentionality which were intricate, were relational in some sense, but were not straightforwardly externalist (Cesalli 2010)[^cesalli-2010]. Debate on these issues continues into our era, and has invited comparison with, for example, Sellars (1960): Sellars’ position, although interesting, does not seem (as he claims) to reproduce Aquinas’ position on intentionality (King 2010)[^king-2010]. This only shows that there are a very large number of different accounts of intentionality, and that the medievals, even though they were surprisingly inventive in discovering them, did not manage to discover all of them.
    step1: |
      关于意向性，即心理状态与其对象之间的关系，也有一场类似的中世纪晚期辩论。鉴于奥卡姆关于*species*（种相）的论证，他对这些也采取外在论路线，这并不令人意外：他提出这一问题的方式是问，如果一位天使在我思考某个个别对象时看见了我心灵的内容，那么这位天使（假定它不知道关于我心灵之外的任何东西）能否说出我在思考哪个对象？奥卡姆回答不能：而这一思想实验似乎表明，我的心理状态（即我对这一特定对象的思考）并不由我心灵的内容单独决定（Panaccio 2010, pp. 242f., William of Ockham 1981, pp. 378f.）[^william-1981][^panaccio-2010]。这显然是*某种*外在论立场，但精确描述这一立场已被证明出奇地困难（Panaccio 2010, Normore 2010, Brower-Toland 2007）[^brower-toland-2007][^normore-2010][^panaccio-2010]。相应地，尽管许多中世纪思想家同情这类论证，但他们所采取的立场的细节绝非一致。例如，司各脱的追随者，如梅隆的弗朗西斯（Francis of Meyronnes），在意向性上持有复杂、在某种意义上关系论的、但并非直截了当外在论的立场（Cesalli 2010）[^cesalli-2010]。关于这些问题的辩论延续到我们的时代，并引起了与例如 Sellars（1960）的比较：Sellars 的立场虽然有趣，但似乎并不像他声称的那样重现阿奎那关于意向性的立场（King 2010）[^king-2010]。这仅仅表明，关于意向性有非常多的不同说明，而中世纪人尽管在发现它们方面出奇地有创造力，却并未设法发现它们全部。
