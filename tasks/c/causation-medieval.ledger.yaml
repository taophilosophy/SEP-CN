      The “Humean” argument, in addition, makes a detour through psychology: as Adams analyses it, it relies on a premise like “There can be nothing more in concepts than there actually is in intuitions” (Adams 1987, p. 744)[^adams-1987]. But such a detour through psychology, though widely practiced in the eighteenth century, was somewhat foreign to medieval thought (White 1990a)[^white-1990a]. And one should generally be very circumspect in interpreting medieval texts on issues like these: key terms tend to be used in subtly different ways than in the modern literature, and controversies tend to be about issues which are rather different from our controversies (Zupko 2001)[^zupko-2001].
