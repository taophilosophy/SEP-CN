    source: |
      Motions are, in Aristotle’s physics, classified into *natural* and *violent*. A paradigmatic example of natural (local) motion is the motion of a freely falling body, whereas an example of violent (local) motion would be the motion of a thrown body. The motion of a falling body is natural because a heavy body has a natural tendency to move downwards, or, as the thirteenth-century philosopher Peter of Auvergne puts it, “being below is the principal end of a heavy body” (Trifolgi 2015, p. 93)[^trifolgi-2015].
    step1: |
      在亚里士多德的物理学中，运动被分为*自然的*与*强制的*。自然（局域）运动的一个典型例子是自由落体的运动，而强制（局域）运动的一个例子则是抛体的运动。落体的运动是自然的，因为重物有一种向下运动的自然倾向，或者，正如十三世纪哲学家奥弗涅的彼得（Peter of Auvergne）所说，“位于下方是重物的主要目的”（Trifolgi 2015, p. 93）[^trifolgi-2015]。
    step2: |
      在亚里士多德物理学中，运动分为*自然*与*强制*两类。自然（局域）运动的典型例子是自由落体运动，强制（局域）运动的例子则是抛体运动。落体运动之所以是自然的，是因为重物有向下运动的自然倾向；用十三世纪哲学家奥弗涅的彼得（Peter of Auvergne）的话说，“居于下方是重物的首要目的”（Trifolgi 2015, p. 93）[^trifolgi-2015]。
