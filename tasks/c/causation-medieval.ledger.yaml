      Now if we throw a body, then it is, in this framework, relatively unproblematic to account for the motion when it is in contact with our hand: what is difficult is to account for its continued motion thereafter. Aristotle’s theory accounts for it by saying that, when it is moving, a temporary vacuum is caused behind it, and, in order to fill in this vacuum, air rushes around from the front, thus leaving a void in front of the projectile which is filled by the continued motion of the projectile. This explanation was vulnerable to a large number of objections – for example, it is clearly easier to throw a moderately heavy object, such as a stone, than a light object, such as a bean, whereas light objects ought to be more susceptible than others to motions of the air. And Aristotle’s theory, when confronted with the example of two stones thrown in opposite directions so as to pass near to one another, cannot consistently say how the air is supposed to move in the neighbourhood of their close encounter. These objections were made by numerous medieval authors, most significantly by John Buridan (*De Caelo et Mundo* III, qu. 22, pp. 227ff.) and Nicole Oresme (*Du ciel et du monde* II, ch. 25ff., pp. 525ff.).
    step1: |
      现在，如果我们抛出一个物体，那么在这一框架中，当它与我们的手接触时，说明其运动相对不成问题：困难的是说明它在此后的持续运动。亚里士多德的理论这样说明它：当它运动时，其后部被造成一个暂时的真空，而为了填满这一真空，空气从前面绕过来，从而在抛体前面留下一个被抛体的持续运动所填满的虚空。这一解释容易受到大量反对意见的攻击——例如，抛一个中等重量的物体，如石头，显然比抛一个轻的物体，如豆子，更容易，而轻的物体应该比别的物体更容易受空气运动的影响。而且，亚里士多德的理论面对两块石头被朝相反方向抛出以便彼此靠近而过的例子时，无法一贯地说出空气在它们近距离相遇的邻域应当如何运动。这些反对意见由许多中世纪作者提出，最重要的是约翰·布里丹（John Buridan）（《论天与世界》*De Caelo et Mundo* III, qu. 22, pp. 227ff.）和尼科尔·奥雷姆（Nicole Oresme）（《论天与世界》*Du ciel et du monde* II, ch. 25ff., pp. 525ff.）。
    step2: |
