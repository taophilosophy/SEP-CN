      Perception was, throughout the Middle Ages, a contentious topic, and it was also a topic in which the answers to strictly *causal* questions could influence philosophical positions in other areas (for example, on whether certain knowledge of external entities was attainable). The “traditional” view, dating back to Roger Bacon in the mid-thirteenth century, was that physical objects were known because they caused a succession of likenesses, or *species*, first in the medium between the object and the perceiver, then in the senses, and finally in the intellect, of the perceiver (Tachau 1988, pp. 3ff., Normore 2010, pp. 255f.)[^normore-2010][^tachau-1988]. This position was attacked by thinkers such as Henry of Ghent, Peter Olivi, and Duns Scotus. Interestingly, many of these criticisms tend towards a relational account of perception, in which – although *species* still play a role – the role that they play is to be a means by which we know things, and in which the *species* themselves are not known directly but only by reflection. (Tachau 1988, p. 66}. (Panaccio 2010, pp. 242f., Normore 2010, pp. 255f.)[^normore-2010][^panaccio-2010]
    step1: |
      在整个中世纪，感知是一个有争议的话题，而且也是一个严格*因果*问题的答案能够影响其他领域哲学立场的主题（例如，关于能否获得对外部实体的确定知识）。“传统”观点，可追溯到十三世纪中叶的罗吉尔·培根（Roger Bacon），认为物理对象之所以被认识，是因为它们引起一连串的相似物，或*species*（种相），首先在对象与感知者之间的中介中，然后在感知者的感官中，最后在感知者的理智中（Tachau 1988, pp. 3ff., Normore 2010, pp. 255f.）[^normore-2010][^tachau-1988]。这一立场被根特的亨利（Henry of Ghent）、彼得·奥利维和邓斯·司各脱等思想家攻击。有趣的是，许多这些批评倾向于一种关系论的感知说明，在其中——尽管*species*（种相）仍然起作用——它们所起的作用是作为我们认识事物的手段，而*species*（种相）本身不是被直接认识，而只是被反思地认识。（Tachau 1988, p. 66}。（Panaccio 2010, pp. 242f., Normore 2010, pp. 255f.）[^normore-2010][^panaccio-2010]
    step2: |
      在整个中世纪，感知都是一个聚讼纷纭的话题；而且，严格*因果*问题的答案，会牵动其他领域的哲学立场（例如，关于能否获得对外部实体的确定知识）。“传统”观点可上溯至十三世纪中叶的罗吉尔·培根（Roger Bacon）：物理对象之所以被认识，是因为它们引起一连串的相似物（*species*，即种相），先出现在对象与感知者之间的中介中，再出现在感知者的感官中，最后出现在感知者的理智中（Tachau 1988, pp. 3ff., Normore 2010, pp. 255f.）[^normore-2010][^tachau-1988]。这一立场受到根特的亨利（Henry of Ghent）、彼得·奥利维与邓斯·司各脱等人的攻击。有趣的是，其中许多批评倾向于一种关系论的感知说明：尽管*species*（种相）仍起作用，但它们所起的作用是作为我们认识事物的手段，而*species*（种相）本身并不被直接认识，只是被反思地认识。（Tachau 1988, p. 66）。（Panaccio 2010, pp. 242f., Normore 2010, pp. 255f.）[^normore-2010][^panaccio-2010]
