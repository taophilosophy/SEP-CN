    source: |
      The medieval literature is far from unanimous on these questions. William of Ockham, for example, who wrote several commentaries on Aristotle’s *Physics*, and who discusses these questions at numerous places in his commentary on Aristotle’s *Physics*, hardly has a uniform position. He is quite happy with explanations of natural phenomena by means of efficient causes in general, but he will also often speak of final causes: what is unclear is whether the final causes he speaks of (with varying degrees of strength in different works) have any explanatory role to play that cannot be reduced to efficient causality (Adams 1998; cf. Goddu 1999)[^adams-1998][^goddu-1999].
    step1: |
      中世纪文献在这些问题上远非一致。例如，奥卡姆的威廉（William of Ockham），他写了若干关于亚里士多德《物理学》的注疏，并在其关于亚里士多德《物理学》的注疏中的许多地方讨论这些问题，几乎没有统一的立场。他非常满意于一般用动力因来说明自然现象，但他也经常谈到目的因：不清楚的是，他所谈到的目的因（在不同著作中以不同的强度）是否具有任何不能化约为动力因果性的解释作用（Adams 1998; cf. Goddu 1999）[^adams-1998][^goddu-1999]。
    step2: |
      中世纪文献在这些问题上远非众口一词。例如，奥卡姆的威廉（William of Ockham）写了多部关于亚里士多德《物理学》的注疏，并在其中许多地方讨论这些问题，却几乎没有一个统一的立场。他欣然接受一般以动力因解释自然现象，但也常常谈到目的因；不清楚的是：他所谈论的目的因（在不同著作中强度各异）是否具有任何不可还原为动力因果性的解释作用（Adams 1998; cf. Goddu 1999）[^adams-1998][^goddu-1999]。
