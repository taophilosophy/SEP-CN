      Ockham then radicalised these critiques by denying that there are any such *species* at all: perception and other phenomena which were usually explained by *species* – the sun heating or illuminating physical objects, for example – were now explained by action at a distance (Tachau 1988, pp. 130ff., Stump 1999)[^stump-1999][^tachau-1988]. There was a similar debate about the causal mechanisms behind memory, where, again, Ockham denied a *species*-based account; however, in the case of memory, he replaced species not with action at a distance but with habits (Wolter and Adams 1993)[^wolter-1993].
    step1: |
      奥卡姆随后激进化了这些批评，否认有任何这样的*species*（种相）存在：感知和其他通常由*species*（种相）说明的现象——例如太阳加热或照亮物理对象——现在由超距作用说明（Tachau 1988, pp. 130ff., Stump 1999）[^stump-1999][^tachau-1988]。关于记忆背后的因果机制也有一场类似的辩论，在那里，奥卡姆再次否认了基于*species*（种相）的说明；然而，在记忆的情形中，他不是用超距作用而是用习性取代种相（Wolter and Adams 1993）[^wolter-1993]。
