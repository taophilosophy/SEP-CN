      One should note that, although Ockham was very innovative, and altered the landscape of medieval thought quite decisively, there were very few, if any, people who adopted his position without modification: he produced a large number of interesting arguments, but, on the basis of these arguments, he adopted positions which many of his contemporaries were not convinced by (Rode 2016, Courtenay 2008)[^courtenay-2008][^rode-2016]. So, although his arguments forced a reexamination of many philosophical and theological doctrines, the thinkers influenced by him took up a broad spectrum of positions, depending on which of his doctrines they assented to and which of them they rejected. Walter Chatton, for example, denied Ockham’s position on intuitive cognition – namely, that when we know singulars we do so by a separate intellectual faculty distinct from sense perception – in favour of a position that saw intuitive and sensory cognition as very much interrelated, and this, in turn, followed from a rejection of Ockham’s position that the sensitive and intellectual souls were distinct (Schierbaum 2016)[^schierbaum-2016].
    step1: |
      应当注意，尽管奥卡姆非常有创新性，并相当决定性地改变了中世纪思想的图景，但几乎没有人（如果有的话）不加修改地采纳他的立场：他产生了大量有趣的论证，但基于这些论证，他采取的立场是许多同时代人不信服的（Rode 2016, Courtenay 2008）[^courtenay-2008][^rode-2016]。所以，尽管他的论证迫使许多哲学与神学学说重新审查，但受他影响的思想家占据了一个广阔的立场谱系，取决于他们同意他的哪些学说、拒绝哪些。例如，沃尔特·查顿（Walter Chatton）否认奥卡姆关于直观认识的立场——即当我们认识个别事物时，我们是通过一个与感官知觉相分离的独立理智官能来认识的——转而支持一种把直观认识与感性认识视为非常相互关联的立场，而这又源于对奥卡姆关于感性灵魂与理智灵魂相分离这一立场的拒绝（Schierbaum 2016）[^schierbaum-2016]。
