      Scotus follows a modified Anselmian line, speaking of a single will, with two inclinations: one towards self-fulfillment, the other towards justice). It is the presence of these two inclinations which distinguishes willed causes from natural causes: natural causes are determined to perform their acts (unless impeded), whereas the will is not thus determined (Scotus, *Metaphysics* IV, 9: in Scotus, *On the Will and Morality*, pp. 136ff.; Lee 1998; Cross 1999, pp. 84ff.)[^cross-1999][^lee-1998]. The will is thus self-determining, rather than determined by its end, and so Scotus affirms self-motion in psychology. In fact, he goes further, and admits self-motion in physical cases as well: for example, a falling object is actively moving towards its goal, and its motion is caused by itself (because it is heavy); so this, too, is an instance of self-motion (Effler 1962)[^effler-1962].
    step1: |
      司各脱遵循一条修改过的安瑟伦路线，谈到一个单一的意志，具有两个倾向：一个朝向自我实现，另一个朝向正义。正是这两个倾向的存在把意志原因与自然原因区分开来：自然原因被决定去实施其活动（除非受阻），而意志则不是这样被决定（司各脱，《形而上学》IV, 9：见司各脱，《论意志与道德》，pp. 136ff.; Lee 1998; Cross 1999, pp. 84ff.）[^cross-1999][^lee-1998]。意志因而是自我决定的，而不是由它的目的所决定，所以司各脱在心理学中肯定自我运动。事实上，他更进一步，在物理情形中也承认自我运动：例如，一个下落物体正在主动地朝其目标运动，其运动由它自己引起（因为它重）；所以，这也是一个自我运动的实例（Effler 1962）[^effler-1962]。
