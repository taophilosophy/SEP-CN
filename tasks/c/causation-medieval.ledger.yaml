      Next we can look at study of intension and remission of forms: (Goubier and Roques 2017)[^goubier-2017] is a good recent collection of work on this, Sylla (1982) shows how this work was related to, and to some extent originated in, disputations about logic, and Dumont (2009) shows how these debates were related to their theological context. We must not forget, though, that modern scholarship on this topic goes back to at least Anneliese Maier (1964), whose work goes back to the 1930s, and that she was working in the tradition of Pierre Duhem. So there is a vast body of work on this topic, written by people with a variety of agendas. Despite this, it is a very interesting body of literature, and, if it might seem impossibly complex, it is thus because it reflects the variety of medieval and early modern viewpoints on this material.
    step1: |
      接下来我们可以看形式的增强与减弱之研究：（Goubier and Roques 2017）[^goubier-2017] 是关于此的一本好的近期论文集，Sylla（1982）表明这一研究如何与关于逻辑的争论相关，并在一定程度上起源于这些争论，而 Dumont（2009）表明这些辩论如何与其神学语境相关。不过，我们不应忘记，关于这一主题的现代学术至少可以追溯到 Anneliese Maier（1964），其著作可以追溯到 1930 年代，而且她是在 Pierre Duhem 的传统中工作的。因此，关于这一主题有大量的著作，由具有各种议程的人所写。尽管如此，这是一批非常有趣的文献，而且，如果它似乎难以置信地复杂，那正是因为它反映了中世纪与早期近代关于这一材料的各种观点。
    step2: |
      再看形式的增强与减弱研究：（Goubier and Roques 2017）[^goubier-2017] 是这方面近期一部不错的论文集；Sylla（1982）说明这一研究如何与逻辑论辩相关、并在一定程度上发源于逻辑论辩；Dumont（2009）则说明这些辩论如何与其神学语境相关。不过切勿忘记：关于这一主题的现代学术至少可上溯至 Anneliese Maier（1964），她的著作又上溯至 1930 年代，而她属于 Pierre Duhem 的传统。因此，关于这一主题的著作浩如烟海，作者们的旨趣也各不相同。尽管如此，这仍是一批极有趣的文献；若它看似复杂得难以置信，那正是因为其中反映了中世纪与近代早期关于这一材料的种种不同视角。
