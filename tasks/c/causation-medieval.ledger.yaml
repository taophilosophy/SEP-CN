      The term ‘motion’, in Aristotelian philosophy, can stand for a wide range of changes of state, and not simply changes of place (the latter is usually known as *local* motion). Aristotle’s *Physics* is basically an exhaustive study of motion in this very wide sense. In this section, we will first deal with motion in general, and then with local motion.
    step1: |
      在亚里士多德哲学中，“运动”一词可以指广泛的种种状态变化，而不仅仅是位置的变化（后者通常被称为*局域*运动）。亚里士多德的《物理学》基本上是对这一极宽泛意义上的运动的穷尽性研究。在本节中，我们将首先讨论一般的运动，然后讨论局域运动。
    step2: |
      在亚里士多德哲学中，“运动”一词可涵盖多种多样的状态变化，而不只是位置变化（后者通常称作*局域*运动，即位置变化）。亚里士多德的《物理学》基本上就是对这一极宽泛意义上的运动的穷尽式研究。本节先谈一般意义上的运动，再谈局域运动。
