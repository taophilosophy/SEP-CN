      There is a large body of medieval literature which deals with general change of state: it is important because it led to a great deal of careful analysis of continuous change (under the heading of “intension and remission of forms”), and this body of analysis was one of the contributing currents which led to the invention of the calculus in the sixteenth century. So, we can look at this literature from two viewpoints: either from the tradition which it grew out of – that of interpretations on Aristotle’s *Physics* and the picture of change found there – or from the viewpoint of what it led to, that is, the analysis of continuous change. Either viewpoint can be regarded as doing violence to the historical material, either by disregarding what was new in it, or by isolating the innovation from the tradition.
    step1: |
      有大量的中世纪文献处理一般的状态变化：它之所以重要，是因为它导致了对连续变化的许多仔细分析（在“形式的增强与减弱”这一标题下），而这一分析群体是导致十六世纪微积分发明的诸多贡献潮流之一。因此，我们可以从两个角度来考察这一文献：或者从它所由以生长的传统——即对亚里士多德《物理学》的注疏以及那里所发现的变化图景——的角度，或者从它所导致的东西，即对连续变化的分析的角度。无论哪个角度都可以被视为对历史材料的强暴，要么由于无视其中的新东西，要么由于把创新从传统中孤立出来。
    step2: |
      处理一般状态变化的中世纪文献卷帙浩繁：它之所以重要，是因为它催生了对连续变化的大量细致分析（在“形式的增强与减弱”名目之下），而这一分析传统又是推动十六世纪微积分发明的诸股潮流之一。因此，我们可以从两个视角看这一文献：一是它生长于其中的传统——即对亚里士多德《物理学》的注疏以及其中呈现的变化图景；二是它所导致的东西，即对连续变化的分析。无论取哪一视角，都可能对历史材料有所歪曲：要么无视其中新颖之处，要么把创新与传统割裂开来。
