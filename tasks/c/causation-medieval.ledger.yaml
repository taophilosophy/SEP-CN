    source: |
      One might, though, be tempted to argue that this concentration on causality is simply an effect of reading Aristotle, but this would be too hasty. Medieval thinkers were attracted to the problem of causality long before most of Aristotle's texts became available in the thirteenth century: already in the twelfth century the created universe was seen as a rational manifestation of God (Wetherbee 1988, p. 25)[^wetherbee-1988], and, consequently, the rational investigation of the universe was seen as a way of approaching God: “In the creation of things”, says William of Conches, “divine power, wisdom and goodness are beheld” (William of Conches, *Glosa super Platonem*, p. 60). This consideration of the relation between the natural world and God continues throughout the Middle Ages: for example, Duns Scotus’ proof of the existence of God is an *a posteriori* modal proof, based on the notion of causality (Craig 1980; Normore 2003; Ross and Bates 2003)[^craig-1980][^normore-2003][^ross-2003].
    step1: |
      不过，人们也许会忍不住论证说，这种对因果性的专注仅仅是阅读亚里士多德的结果，但这会过于仓促。早在十三世纪大多数亚里士多德文本可得之前，中世纪思想家就已为因果性问题所吸引：早在十二世纪，被造的宇宙就被视为上帝的理性显现（Wetherbee 1988, p. 25）[^wetherbee-1988]，因而，对宇宙的理性探究就被视为接近上帝的一种途径：“在万物的创造中”，孔什的威廉（William of Conches）说，“可见神圣的力量、智慧与善”（孔什的威廉，《柏拉图〈蒂迈欧篇〉注疏》，第 60 页）。这种对自然界与上帝之关系的思考贯穿整个中世纪：例如，邓斯·司各脱（Duns Scotus）关于上帝存在的证明是一个基于因果性概念的 *a posteriori*（后天）模态证明（Craig 1980; Normore 2003; Ross and Bates 2003）[^craig-1980][^normore-2003][^ross-2003]。
    step2: |
      当然，有人或许会忍不住主张，这种对因果性的专注不过是阅读亚里士多德的结果；但这未免过于仓促。早在十三世纪亚里士多德的大部分文本传世之前，中世纪思想家就已为因果性问题所吸引：十二世纪时，被创造的宇宙就被视为上帝的理性显现（Wetherbee 1988, p. 25）[^wetherbee-1988]，因此，对宇宙的理性探究便被视为一条通向上帝的途径——“在万物的创造中”，孔什的威廉（William of Conches）说，“可以看见神圣的权能、智慧与善”（孔什的威廉《柏拉图〈蒂迈欧篇〉注疏》，第 60 页）。这种关于自然世界与上帝之关系的思考贯穿整个中世纪：例如，邓斯·司各脱（Duns Scotus）关于上帝存在的证明，就是一个基于因果性概念的 *a posteriori*（后天）模态证明（Craig 1980; Normore 2003; Ross and Bates 2003）[^craig-1980][^normore-2003][^ross-2003]。
