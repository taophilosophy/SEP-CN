      First we can look at the starting point. There was a great deal of argument, in the thirteenth and fourteenth century, about the precise interpretation of Aristotle’s theory of change: this theory talks about the bringing about of change, by an agent, in a patient, and, furthermore, it talks about the change happening because of the transmission of a form from the agent to the patient. The key text for this is Aristotle, *Physics* III, cc2–3 (202a9–20), and it is very obscure. Because of this obscurity, there is room for a good deal of disagreement about the details: see (Löwe 2017)[^löwe-2017] for a particularly baroque example.
    step1: |
      首先我们可以看起点。在十三世纪和十四世纪，关于亚里士多德变化理论的精确解释有许多争论：这一理论谈论的是由施动者在受动者中引起变化，而且，它还谈论变化之所以发生，是因为形式从施动者传递到受动者。这一理论的关键文本是亚里士多德《物理学》第三卷第二章至第三章（202a9–20），而且它非常晦涩。由于这种晦涩，关于细节有相当大的分歧空间：参见（Löwe 2017）[^löwe-2017] 对特别繁复例子的说明。
    step2: |
      先看起点。十三、十四世纪围绕亚里士多德变化理论的精确解读争论颇多：该理论说的是施动者在受动者中引起变化，并且说变化之发生，是由于形式由施动者传至受动者。此说的关键文本是亚里士多德《物理学》第三卷第 2–3 章（202a9–20），极为晦涩。正因其晦涩，细节上留有相当大的争议余地：尤其繁复的一个例子，见（Löwe 2017）[^löwe-2017]。
