      这里重要的是——尽管宇宙论发生了根本变化——这仍然是一种极其*中世纪*的理论：因果性是由于内在于实体中的形式，并且所涉及的实体被分为施动者与受动者。不是有一个单一的形式参与抛体运动——即重性形式，负责向下的自然运动——而是有两个，重量与冲力，二者相互冲突。基本的存在论仍然相同，而施动者与受动者的划分，尽管其细节可能已经改变，仍然持续存在。此外，尽管有持续的怀疑，静止与运动之间仍有某种区分，而运动只能是施动性的结果。将此与伽利略的——或更甚者，牛顿的——说明对照：在这里，匀速运动与静止被同等对待，因而运动与静止之间不可能有明确的区分。所以，尽管布里丹和奥雷姆在某种意义上——是伽利略的先驱，他们的因果存在论在重要方面仍然是彻底中世纪的（Maier 1964）[^maier-1964]。
