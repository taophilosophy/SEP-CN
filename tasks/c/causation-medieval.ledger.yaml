  - id: 1
    source: |
      Causality plays an important role in medieval philosophical writing: the dominant genre of medieval academic writing was the commentary on an authoritative work, very often a work of Aristotle. Of the works of Aristotle thus commented on, the *Physics* plays a central role. Other of Aristotle's scientific works – *On the Heavens and the Earth*, *On Generation and Corruption*, and, of course, the *Metaphysics* – are also significant for the study of causation: so there is a rather daunting body of work to survey.
    step1: |
      因果性在中世纪哲学著作中扮演着重要角色：中世纪学术著作的主导体裁是对权威作品的注疏，而这类作品往往就是亚里士多德的一部著作。在被如此注疏的亚里士多德著作中，《物理学》居于核心地位。亚里士多德的其他科学著作——《论天》、《论生成与毁灭》，当然还有《形而上学》——对因果性的研究也很重要：因此有一大批相当令人望而生畏的著作需要考察。
    step2: |
      因果性在中世纪哲学著述中举足轻重：中世纪学术著作的主导体裁，是给权威著作——往往是亚里士多德的某部著作——作注疏。在被注疏的亚里士多德著作中，《物理学》居于核心。他的其他科学著作——《论天》《论生成与毁灭》，当然还有《形而上学》——对因果性研究同样重要：因此，有待考察的著作相当可观，令人却步。
