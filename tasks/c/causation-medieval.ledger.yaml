    source: |
      What should become evident during this survey is the extremely tight and complex interconnection between medieval causal theories and medieval ontology. After Aristotle’s texts had been assimilated, almost all medieval academic theories had an ontology which was basically hylomorphic: substances were composites of matter and form, and change was described as the loss of one form and the acquisition of another. Form was not merely shape, but an active principle: the form of a thing was responsible for its causal role (White 1984; Goddu 1999, p. 148)[^goddu-1999][^white-1984]. Furthermore, in any causal interaction, the allocation of active and passive roles to the individuals involved tended to be thought of as unproblematic. Although many aspects of Aristotle’s causal theories were extensively and critically debated, this basic hylomorphism persisted throughout; and it is this, rather than anything more arcane, which often poses the greatest problems in assimilating, or evaluating, medieval thought on these topics.
    step1: |
      在这项考察中应当变得明显的是，中世纪因果理论与中世纪存在论之间极其紧密而复杂的相互关联。在亚里士多德的文本被吸收之后，几乎所有中世纪学术理论的存在论都是基本的形质论的：实体是质料与形式的复合物，变化被描述为一种形式的丧失与另一种形式的获得。形式不仅是形状，而且是一种主动原则：一个事物的形式负责它的因果角色（White 1984; Goddu 1999, p. 148）[^goddu-1999][^white-1984]。此外，在任何因果相互作用中，把主动与被动的角色分配给所涉及的个体，往往被视为不成问题。尽管亚里士多德因果理论的许多方面被广泛而批判性地辩论，但这种基本的形质论贯穿始终；而正是这一点，而非任何更深奥的东西，常常在吸收或评价中世纪关于这些主题的思想时造成最大的困难。
    step2: |
      本项考察应当让人看清：中世纪因果理论与其存在论之间的关联，极其紧密而复杂。亚里士多德的文本被消化吸收之后，几乎所有中世纪学术理论的本体论都是基本的形质论（hylomorphic）：实体是质料与形式的复合体，变化则被描述为失去一种形式而获得另一种形式。形式不只是形状，更是一种主动原则：事物的形式决定了它的因果角色（White 1984; Goddu 1999, p. 148）[^goddu-1999][^white-1984]。再者，在任何因果相互作用中，把主动者与受动者的角色分派给相关个体，通常被认为是不成问题的。尽管亚里士多德因果理论的许多方面都受到广泛而批判性的讨论，这一基本形质论却始终延续；正是它，而非什么更深奥的东西，常常给吸收或评价中世纪在这些主题上的思想造成最大的困难。
