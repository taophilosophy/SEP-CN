      Thus, apart from direct literary influence, the nature of the philosophical and theological themes which were popular in the Middle Ages also led to an emphasis on causality. Writers studied the interrelationship of divine grace and natural processes, the role of the will in ethics, free will and determinism: all of these problems have an important causal component. Similarly, they investigated the nature of the causal processes involved in human and animal perception. These questions were often handled by methods which might seem to us to be extraordinarily naturalistic – naturalistic, of course, in the sense of the modes of natural investigation which were current at the time. It comes as no surprise to know that many medieval thinkers discussed the question of whether divine grace can increase: what *is* surprising is that many of the discussions use the technical tools of Aristotle’s physical and biological works, tools which were originally developed to discuss problems of continuity and change in the natural world. What is even more surprising is the technical proficiency of many of these discussions: fourteenth-century work on this topic gave rise to very acute analyses of the variation of continuous quantities (see Murdoch 1975)[^murdoch-1975], and this study of continuous variation played an important role in the development of the calculus.
    step1: |
      因此，除了直接的文学影响之外，中世纪流行的哲学与神学主题的性质也导致了对因果性的强调。作者们研究了神圣恩典与自然过程之间的相互关系、意志在伦理学中的作用、自由意志与决定论：所有这些问题的因果成分都很重要。同样，他们研究了人类与动物感知所涉及的因果过程的性质。这些问题往往由在我们看来可能极其自然主义的方法来处理——当然，所谓自然主义，是在当时流行的自然探究方式的意义上说的。许多中世纪思想家讨论过神圣恩典能否增强这一问题，这并不令人意外：令人意外的是，许多讨论使用了亚里士多德的物理学与生物学著作中的技术工具，这些工具最初是为讨论自然世界中的连续性与变化问题而发展出来的。更令人意外的是许多这类讨论的技术熟练程度：十四世纪关于这一主题的工作产生了对连续量之变化的非常精细的分析（见 Murdoch 1975）[^murdoch-1975]，而这一对连续变化的研究在微积分的发展中扮演了重要角色。
    step2: |
      因此，除直接的文学影响外，中世纪盛行的哲学与神学主题本身的性质，也促成了对因果性的强调。当时的作者研究上帝恩典与自然过程之间的相互关系、意志在伦理学中的作用、自由意志与决定论：这些问题都含有重要的因果成分。他们也探究人类与动物感知所涉及的因果过程的本性。处理这些问题的方法，在我们看来往往极其自然主义——当然，所谓自然主义，是在当时通行的自然探究方式这一意义上说的。许多中世纪思想家讨论过上帝恩典能否增强，这并不出人意料；真正出人意料的是，其中许多讨论动用了亚里士多德物理学与生物学著作中的技术工具——这些工具本是为讨论自然世界中的连续性与变化问题而发展出来的。更出人意料的是这些讨论在技术上的精湛程度：十四世纪关于这一主题的研究，催生了对连续量变化的极其敏锐的分析（见 Murdoch 1975）[^murdoch-1975]，而这种对连续变化的研究，在微积分的发展中扮演了重要角色。
