      罗莎·卢森堡、卡尔·考茨基和尼古拉·布哈林等马克思主义理论家也探讨了帝国主义问题。考茨基的立场尤其重要，因为他的分析引入的概念至今在世界体系理论和后殖民研究中扮演着突出角色。考茨基质疑帝国主义会带动受经济剥削地区发展的假定。他认为，帝国主义是一种相对持久的关系，构造着两类国家之间的互动。（Young 2001）[^young-2001] 虽然帝国主义最初采取资本主义国家间军事竞争的形式，但它将导致各资本主义利益合谋，以维持一个对不发达世界的稳定剥削体系。这一观点在当代最有影响力的拥护者是伊曼纽尔·沃勒斯坦，他以世界体系论著称。按这一理论，世界体系是中心国家与边缘国家之间相对稳定的一组关系。这一国际分工被构造得有利于中心国家（Wallerstein 1974–1989）[^wallerstein-1974]，并把资源从边缘输往中心。
