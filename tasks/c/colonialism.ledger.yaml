      列宁在《帝国主义：资本主义的最高阶段》（1917）这本小册子中展开了他对西方经济与政治支配的分析（见其他网络资源）。列宁对帝国主义持更明确的批评态度。他指出，帝国主义是一种手段，欧洲国家借此把自身的经济负担转嫁给更弱的国家，以推迟不可避免的国内革命危机。列宁论证说，十九世纪末的帝国主义是晚期资本主义经济逻辑驱动的。利润率的下降造成了一场只有通过领土扩张才能解决的经济危机。资本家康采恩被迫越出国境追逐新市场和新资源。在某种意义上，这一分析与马克思完全一致，后者把欧洲殖民主义视为国家内部以及欧洲范围内内部扩张过程的延续。马克思和列宁都认为，殖民主义和帝国主义源于驱动欧洲边缘地区经济发展与现代化的同一逻辑。但列宁的分析有一个独特之处：由于晚期资本主义围绕国家垄断组织起来，市场之争采取了国家间军事竞争的形式，争夺的是可以为胜者带来独占经济利益的领土。
