      Tocqueville was actively engaged in advancing the project of French colonization of Algeria. Tocqueville’s first analysis of French colonialism was published during his 1837 electoral campaign for a seat in the Chamber of Deputies. As a member of the Chamber of Deputies, Tocqueville argued in favor of expanding the French presence in Algeria. He traveled to Algeria in 1841 composing an “Essay on Algeria” that served as the basis for two parliamentary reports on the topic (Tocqueville 1841)[^tocqueville-1841]. Unlike the more naïve proponents of the “civilizing mission,” Tocqueville admitted that the brutal military occupation did little to introduce good government or advance civilization. In an apparent reversal of the four-stages theory of the Scottish Enlightenment, he acknowledged that “we are now fighting far more barbarously than the Arabs themselves” and “it is on their side that one meets with civilization.” (Tocqueville 1841: 70)[^tocqueville-1841] This realization, however, did not imply a critique of French brutality. Instead, Tocqueville defended controversial tactics such as the destruction of crops, confiscation of land, and seizure of unarmed civilians. His texts, however, provide little in the way of philosophical justification and he dismisses the entire just war tradition by stating, “I believe that the right of war authorizes us to ravage the country.” (Tocqueville 1841: 70)[^tocqueville-1841]. In Tocqueville’s writings on Algeria, the French national interest is paramount and moral considerations are explicitly subordinate to political goals.
    step1: |-
      托克维尔积极参与推进法国殖民阿尔及利亚的事业。托克维尔对法国殖民主义的首次分析发表于他 1837 年竞选众议院席位期间。作为众议院议员，托克维尔主张扩大法国在阿尔及利亚的存在。1841 年他前往阿尔及利亚，撰写了《论阿尔及利亚》，此文成为两份关于该主题的议会报告的基础（Tocqueville 1841）[^tocqueville-1841]。与“文明使命”的天真拥护者不同，托克维尔承认残酷的军事占领对引入善治或推进文明收效甚微。这显然颠倒了苏格兰启蒙运动的四阶段理论，他承认“我们如今的作战远比阿拉伯人自己更野蛮”，“文明是在他们那一方才见得到”。（Tocqueville 1841: 70）[^tocqueville-1841] 然而，这一认识并不意味着对法国暴行的批评。相反，托克维尔为毁坏庄稼、没收土地、抓捕手无寸铁的平民等有争议的战术辩护。不过，他的文本几乎没有提供哲学辩护，他以一句“我相信战争权利授权我们蹂躏这个国家”驳斥了整个正义战争传统（Tocqueville 1841: 70）[^tocqueville-1841]。在托克维尔论阿尔及利亚的文字中，法国的国家利益至上，道德考量明确从属于政治目标。
