      In their essay “Decolonization is Not a Metaphor” (2012) Eve Tuck and Wayne Yang criticize settler worldviews for failing to acknowledge the distinct, totalizing effect of settler colonialism. They emphasize that settler colonialism operates through the exploitation and expropriation of Indigenous worlds by privileging colonial economies while simultaneously involving the use of particularized modes of control, such as schools and policing, to ensure and legitimize progress and development in accordance with settler epistemologies and ontologies. In this sense, settler-colonialism is a structure rather than an event (Wolfe 1999)[^wolfe-1999] that reinforces the total appropriation of Indigenous life and land. Tuck and Yang describe contemporary approaches to reconciliation as “moves to innocence” that reconcile settler guilt while securing the future of settler colonialism.
    step1: |-
      伊芙·塔克和韦恩·杨在《去殖民化并非隐喻》（2012）一文中批评定居者世界观未能承认定居者殖民主义独特的总体化效应。他们强调，定居者殖民主义通过对原住民世界的剥削和剥夺而运作：它优待殖民经济，同时动用特殊化的控制手段——如学校与警务——以符合定居者认识论与存在论的方式确保并合法化“进步”与“发展”。在这个意义上，定居者殖民主义是一种结构而非事件（Wolfe 1999）[^wolfe-1999]，它强化着对原住民生命与土地的总体占有。塔克和杨把当代的和解进路描述为“脱罪之举”：它们调和定居者的负罪感，同时为定居者殖民主义的未来提供保障。
