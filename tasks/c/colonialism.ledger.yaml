      在 19 世纪 50 年代发表于《纽约每日论坛报》（*New York Daily Tribune*）的一组文章中，马克思专门讨论了英国殖民主义对印度的影响。这一分析与其关于政治经济变迁的一般理论一脉相承。他把印度描述为一个本质上属封建社会、正经历现代化阵痛的国度。不过，按马克思之说，印度的“封建主义”是一种独特的经济组织形式。他得出这一结论，是因为他（错误地）相信印度的农业用地属公有。马克思以“东方专制主义”（Oriental despotism）概念描述一种特殊的阶级统治：它利用国家的征税权力从农民身上榨取资源。在他看来，东方专制主义之所以在印度出现，是因为农业生产力依赖于灌溉之类只能由国家出资兴办的大型公共工程；这意味着国家不易被更分散的权威体系所取代。在西欧，封建财产可逐步转化为私人拥有的可转让地产；而在印度，土地公有使这一转变无从发生，商业农业与自由市场的发展亦因此受阻。既然“东方专制主义”抑制了经济现代化的内生发展，英国的支配便成了经济现代化的推手。
