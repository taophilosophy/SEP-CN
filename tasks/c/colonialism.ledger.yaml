      Frantz Fanon was one of the leading theorists of the struggle for decolonization. His two most influential works focused on anti-black racism and the impact of colonial violence. *Black Skin, White Masks* (2008 [1952]) describes racialized subjectivity and the structural conditions that sustain racial domination. Drawing on existentialism, psychoanalysis, and literary theory, Fanon demonstrates the constitutive effects of European colonialism on identity. It details the traumatic consequences of immersion in a cultural framework that pathologizes blackness, thereby dividing the racialized subject. *Wretched of the Earth* (1961) was the most influential philosophical account of the anti-colonial struggle and the challenges of post-colonial governance. The book provides a complex account of the relationship between violence and liberation. Violence is the foundation of the colonial regime, and therefore inevitably plays a role in its overthrow, but Fanon also explores its psychological dimension. Revolutionary violence can be a productive redirection of the internalized violence characteristic of the experience of oppression because it can bring about structural change. It is also a praxis that generates political agency, group cohesion and national identity. *Wretched of the Earth* also includes incisive reflections on the way that colonial states continue to exert economic power after independence. According to Fanon, the economic exploitation typical of colonialism can be secured in a new way through the leadership of the comprador bourgeoisie, a segment of the indigenous managerial class that is allied with foreign economic interests. He also suggests that collective identity based on ethnicity or national consciousness can have harmful effects, when it functions ideologically to mask class differences in service of elite economic interests. Fanon’s Marxist-influenced approach to anti-colonial critique is part of a black radical traditional that includes other Caribbean thinkers such as Eric Williams, whose book *Capitalism and Slavery* (1994) demonstrated that the wealth extracted from sugar plantations bankrolled the industrial revolution and C.L.R James’s *The Black Jacobins* (1989), which retold the story of the Haitian Revolution from the perspective of the victorious revolutionaries. These books were foundational for theories of racial capitalism, a position that holds that racialized exploitation and capital accumulation are mutually reinforcing. (Robinson 2000)[^robinson-2000]
