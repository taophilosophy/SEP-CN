      穆勒是英国东印度公司的终身雇员，他认识到由外族实施的专制政府可能导致不公正和经济剥削。这些弊病若不加以遏制，可能损害帝国事业的正当性和效力。在《代议制政府》（1861）中，穆勒列举了外族（例如欧洲人）不适合治理殖民地的四个理由。第一，外国政治家不太可能具备有效解决公共政策问题所需的地方知识。第二，鉴于殖民者与被殖民者在文化、语言乃至宗教上的差异，殖民者不太可能同情原住民，而更可能施行暴政。第三，即使殖民者真诚地试图公平对待原住民，他们同情与自己相似者（其他外国殖民者或商人）的自然倾向，也可能在冲突情形中导致判断失真。最后，按穆勒的说法，殖民者和商人出国是为了以很少的努力或风险获取财富，这意味着他们的经济活动常常剥削被殖民的国家，而不是发展它。这些论证与埃德蒙·伯克大量论著中抨击印度治理不善的观点相呼应，最著名的是伯克 1783 年论福克斯《东印度法案》的著名演讲。然而，晚近的学术研究质疑把伯克视为帝国主义反对者的看法。丹尼尔·奥尼尔（Daniel O’Neill）论证说，伯克是十八世纪英帝国的坚定支持者（2016）。按奥尼尔的说法，伯克为帝国辩护，在意识形态上与他保守地反对法国革命相一致。
