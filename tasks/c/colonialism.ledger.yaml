      The confusion about the meaning of the term imperialism reflects the way that the concept has changed over time. Although the English word imperialism was not commonly used before the nineteenth century, Elizabethans already described the United Kingdom as “the British Empire.” As Britain began to acquire overseas dependencies, the concept of empire was employed more frequently. Imperialism was understood as a system of military domination and sovereignty over territories. The day to day work of government might be exercised indirectly through local assemblies or indigenous rulers who paid tribute, but sovereignty rested with the British. The shift away from this traditional understanding of empire was influenced by the Leninist analysis of imperialism as a system oriented towards economic exploitation. According to Lenin, imperialism was the necessary and inevitable result of the logic of accumulation in late capitalism. Thus, for Lenin and subsequent Marxists, imperialism described a historical stage of capitalism rather than a trans-historical practice of political and military domination. The lasting impact of the Marxist approach is apparent in contemporary debates about American imperialism, a term which usually means American economic hegemony, regardless of whether such power is exercised directly or indirectly (Young 2001)[^young-2001].
    step1: |-
      关于帝国主义一词含义的混乱，反映了这个概念随时间演变的方式。虽然英文的 imperialism 一词在十九世纪之前并不常用，伊丽莎白时代的人已经把英国描述为“不列颠帝国”。随着英国开始取得海外属地，帝国概念被更频繁地使用。帝国主义被理解为一种对领土的军事支配与主权体系。日常的政府工作可以通过向宗主国纳贡的地方议会或土著统治者间接行使，但主权掌握在英国人手中。偏离这种传统帝国理解的变化，受到列宁主义分析的影响——它把帝国主义视为一种以经济剥削为取向的体系。在列宁看来，帝国主义是晚期资本主义积累逻辑的必然且不可避免的结果。因此，对列宁及其后的马克思主义者而言，帝国主义描述的是资本主义的一个历史阶段，而非一种超历史的政治与军事支配实践。马克思主义进路的持久影响，在关于美国帝国主义的当代辩论中显而易见——这个词通常指美国的经济霸权，无论这种权力是直接还是间接行使的（Young 2001）[^young-2001]。
    step2: |-
      围绕“帝国主义”一词含义的混乱，反映了这一概念随时间的演变。英文的 imperialism 一词虽然在十九世纪之前并不常用，伊丽莎白时代的人却已把英国称作“不列颠帝国”。随着英国不断取得海外属地，“帝国”概念被使用得愈来愈频繁；帝国主义被理解为一种对领土实施军事支配与主权的体系。日常治理可以通过向宗主国纳贡的地方议会或土著统治者间接行使，但主权始终握于英国人之手。对这一传统帝国理解的偏离，受到列宁主义分析的影响——该分析把帝国主义视为以经济剥削为取向的体系。在列宁看来，帝国主义是晚期资本主义积累逻辑必然且不可避免的结果。因此，对列宁及其后的马克思主义者来说，帝国主义描述的是资本主义的一个历史阶段，而非一种超历史的政治与军事支配实践。马克思主义进路的持久影响，在关于“美国帝国主义”的当代辩论中显而易见——这个词通常指美国的经济霸权，无论这种权力是直接还是间接行使（Young 2001）[^young-2001]。
