      复兴学者旨在通过振兴原住民的责任实践及其与自然世界的关系，动摇定居者的文明观。这一领域的理论家拒斥一切人类发展的阶段理论，也拒斥“历史方向不可逆”的观念。与甘地相似，一些原住民思想家把现代文明批评为一种深重的疾患——它摧毁人类生活中有意义之物，把现代文明描绘为病态的、已站在自我毁灭的门槛上（Henderson, 2017）。这些思想家挑战那种由启蒙理性所引导的单一权威政治叙述；相反，他们主张一种新的政治做事方式：通过对经殖民主义摧毁的价值的细致研究，为现代西方社会的唯物主义与消费主义提供替代。例如，约翰·博罗斯（John Borrows，2008）重述许多原住民法律与政治传统中的“七代”（seven generations）观念，以此挑战型构人际关系及人对大地之义务的定居者理解。按此进路，当下作判断时，我们对过去的七代与未来的七代皆负有义务。
