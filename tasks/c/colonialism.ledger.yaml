      马克思把殖民主义视为向落后封建社会输送现代化的进步力量，这听上去像是在为外国支配作直白的辩护。然而，他对英国支配的论述，恰好映照出他对欧洲资本主义的同一种矛盾态度：两种情形下，马克思都一面承认封建社会向资产阶级社会转型所造成的深重苦难，一面坚持这一转型既属必然、且终究是进步的。他论证，外国商业的渗透将在印度引发一场社会革命。对马克思而言，这场剧变兼具积极与消极后果：农民失去传统生计，人间的苦难深重；但他也指出，传统村庄共同体远非田园牧歌，而是种姓压迫、奴役、悲惨与残酷之地。现代化进程的第一阶段完全是消极的：穷人缴纳重税供养英国统治，还要承受廉价英棉倾销造成的经济震荡。然而英国商人终究意识到，印度人若不能高效地生产可供贸易的商品，便付不起进口布匹与英国行政的开销——这为英国投资生产与基础设施提供了动力。尽管马克思相信英国统治由贪婪驱动、借残酷施行，他仍认为它是进步的推手。因此，马克思关于英国在印度统治的论述有三个维度：论述外国统治的进步性，批评其中的人间苦难，并得出结论——若要实现其进步潜能，英国统治必须是暂时的。
