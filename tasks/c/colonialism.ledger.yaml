      Some scholars have begun to question the usefulness of the concept post-colonial theory. Like the idea of the Scottish four-stages theory, a theory with which it would appear to have little in common, the very concept of post-colonialism seems to rely on a progressive understanding of history (McClintock 1992)[^mcclintock-1992]. It suggests, perhaps unwittingly, that the core concepts of hybridity, alterity, particularity, and multiplicity may lead to a kind of methodological dogmatism or developmental logic. Moreover, the term “colonial” as a marker of this domain of inquiry is also problematic in so far as it suggests historically implausible commonalities across territories that experienced very different techniques of domination. Thus, the critical impulse behind post-colonial theory has turned on itself, drawing attention to the way that it may itself be marked by the utopian desire to transcend the trauma of colonialism (Gandhi 1998).
    step1: |-
      一些学者开始质疑后殖民理论这一概念的有用性。正如苏格兰四阶段理论——一个与它似乎毫无共同之处的理论——一样，后殖民主义这一概念本身似乎依赖于一种进步主义的历史理解（McClintock 1992）[^mcclintock-1992]。它或许在无意中暗示，杂糅、他异性、特殊性与多元性这些核心概念可能导致某种方法论的教条主义或发展逻辑。此外，“殖民的”一词作为这一研究领域的标记也有问题，因为它暗示那些经历了迥异支配技术的地域之间存在着历史上难以置信的共性。于是，后殖民理论背后的批判冲动已转向自身，引起人们注意它自身可能也带有超越殖民主义创伤的乌托邦欲望的印记（Gandhi 1998）。
