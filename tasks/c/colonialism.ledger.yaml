      The language of civilization, savagery, and barbarism is pervasive in writers as diverse of Edmund Burke, Karl Marx, and John Stuart Mill. It would therefore be incorrect to conclude that a developmental theory of history is distinctive of the liberal tradition; nevertheless, given that figures of the Scottish Enlightenment such as Ferguson and Smith were among its leading expositors, it is strongly associated with liberalism. Smith himself opposed imperialism for economic reasons. He felt that relations of dependence between metropole and periphery distorted self-regulating market mechanisms and worried that the cost of military domination would be burdensome for taxpayers (Pitts 2005)[^pitts-2005]. The idea that civilization is the culmination of a process of historical development, however, proved useful in justifying imperialism. According to Uday Mehta, liberal imperialism was the product of the interaction between universalism and developmental history (1999). A core doctrine of liberalism holds that all individuals share a capacity for reason and self-government. The theory of developmental history, however, modifies this universalism with the notion that these capacities only emerge at a certain stage of civilization (McCarthy 2009)[^mccarthy-2009]. For example, according to John Stuart Mill (hereafter Mill), savages do not have the capacity for self-government because of their excessive love of freedom. Serfs, slaves, and peasants in barbarous societies, on the other hand, may be so schooled in obedience that their capacity for rationality is stifled. Only commercial society produces the material and cultural conditions that enable individuals to realize their potential for freedom and self-government. According to this logic, civilized societies like Great Britain are acting in the interest of less-developed peoples by governing them. Imperialism, from this perspective, is not primarily a form of political domination and economic exploitation but rather a paternalistic practice of government that exports “civilization” (e.g. modernization) in order to foster the improvement of native peoples. Despotic government (and Mill doesn’t hesitate to use this term) is a means to the end of improvement and ultimately self-government.
    step1: |-
      文明、蒙昧与野蛮的语言，在埃德蒙·伯克、卡尔·马克思和约翰·斯图亚特·穆勒这些风格各异的作者那里都随处可见。因此，断言历史发展理论是自由主义传统的独特标志是不正确的；不过，鉴于弗格森和斯密等苏格兰启蒙人物是它的主要阐述者，它与自由主义有很强的关联。斯密本人基于经济理由反对帝国主义。他认为宗主国与边缘地带之间的依附关系扭曲了自我调节的市场机制，并担心军事支配的成本会成为纳税人的沉重负担（Pitts 2005）[^pitts-2005]。然而，文明是历史发展过程之顶点这一观念，被证明对辩护帝国主义颇为有用。按照乌代·梅塔的说法，自由主义帝国主义是普遍主义与发展史交互作用的产物（1999）。自由主义的一个核心学说主张，所有个体都共享理性与自治的能力。然而，发展史理论用这样一种观念修正了这种普遍主义：这些能力只在文明的特定阶段才出现（McCarthy 2009）[^mccarthy-2009]。例如，按照约翰·斯图亚特·穆勒（下称穆勒）的说法，野蛮人没有自治的能力，因为他们过度热爱自由。另一方面，野蛮社会中的农奴、奴隶和农民所受的服从训练，可能使他们的理性能力受到压抑。只有商业社会才产生使个人得以实现其自由与自治潜力的物质和文化条件。按照这一逻辑，像英国这样的文明社会通过治理欠发达的民族而为其利益行事。从这个视角看，帝国主义主要不是政治支配和经济剥削的一种形式，而是一种家长式的统治实践，它输出“文明”（例如现代化）以促进原住民的改善。专制政府（穆勒毫不犹豫地使用这个词）是通往改善并最终通往自治的手段。
    step2: |-
      文明、蒙昧与野蛮的语汇，在埃德蒙·伯克、卡尔·马克思与约翰·斯图亚特·穆勒这些立场各异的作者笔下俯拾皆是。因此，断言历史发展理论为自由主义传统所独有，并不正确；不过，鉴于弗格森（Ferguson）、斯密等苏格兰启蒙人物是它的主要阐述者，它与自由主义确有深刻关联。斯密本人出于经济理由反对帝国主义：他认为宗主国与边缘地带之间的依附关系会扭曲自我调节的市场机制，又担心军事支配的成本会成为纳税人的重负（Pitts 2005）[^pitts-2005]。然而，“文明是历史发展过程之顶点”的观念，后来却被证明对辩护帝国主义颇为有用。按乌代·梅塔（Uday Mehta）之说，自由主义帝国主义是普遍主义与发展史交互作用的产物（1999）。自由主义的核心学说主张：一切个体皆共享理性与自治的能力。而发展史理论则修正了这种普遍主义——它认为这些能力只在文明的特定阶段才出现（McCarthy 2009）[^mccarthy-2009]。例如，按照约翰·斯图亚特·穆勒（下称穆勒）的说法，野蛮人之所以缺乏自治能力，是因为他们对自由的过度热爱；而野蛮社会中的农奴、奴隶与农民，又可能被驯服得唯命是从，以致理性能力遭到扼杀。唯有商业社会才具备使个人实现其自由与自治潜能的物质与文化条件。依此逻辑，英国这样的文明社会通过治理欠发达民族而为其利益行事。由此观之，帝国主义主要并非政治支配与经济剥削的形式，而是一种家长式统治实践——它输出“文明”（例如现代化），以促成原住民的改善。专制政府（穆勒毫不犹豫地使用这个词）只是达成改善并最终达成自治的手段。
