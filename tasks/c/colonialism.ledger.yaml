      当代文学理论家也提醒人们注意这样一些再现实践：它们复制一种臣服逻辑，这种逻辑甚至在昔日殖民地获得独立之后仍然延续。后殖民研究领域受到爱德华·萨义德的 开创性著作《东方学》的影响。在《东方学》中，萨义德把米歇尔·福柯的话语分析技术应用于关于中东的知识生产。东方主义一词描述了一套结构化的概念、假定和话语实践，它们被用来生产、解释和评价关于非欧洲民族的知识。萨义德的分析使学者们有可能解构文学与历史文本，以理解它们如何反映和强化帝国主义事业。与以往聚焦殖民主义的经济或政治逻辑的研究不同，萨义德把注意力引向知识与权力之间的关系。通过凸显帝国主义的文化与认识论工作，萨义德得以动摇价值无涉的知识这一意识形态假定，并表明“认识东方”就是支配东方这一事业的一部分。《东方学》可以被视为扩展西方认识论的后结构主义批判之地理与历史疆域的一次尝试。
