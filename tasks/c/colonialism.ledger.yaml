      殖民主义的正当性也是十八、十九世纪法国、德国和英国哲学家们争论的一个话题。康德、斯密和狄德罗等启蒙思想家对殖民主义的野蛮性持批评态度，并挑战了欧洲人有义务“教化”世界其余地区这一观念。奴隶制、掠夺土地和封建劳动的殖民体系与自由和自治的原则截然对立。然而，反殖民政治理论的兴起所需要的，不止于一种承认所有人共享人性的普遍主义伦理。鉴于控制原住民土地与剥削原住民劳动的强大经济利益，普遍主义被证明是批判殖民主义的一个相对薄弱的基础。
