      Some of the Spanish missionaries sent to the New World, however, noticed that the brutal exploitation of slave labor was widespread while any serious commitment to religious instruction was absent. Members of the Dominican order in particular noted the hypocrisy of enslaving the indigenous peoples because of their alleged barbarity while practicing a form of conquest, warfare, and slavery that reduced the indigenous population of Hispaniola from 250,000 to 15,000 in two decades of Spanish rule. Given the genocidal result of Spanish “civilization,” they began to question the idea of a civilizing mission. Bartolomé de Las Casas and Franciscus de Victoria were two of the most influential critics of Spanish colonial practice. Victoria gave a series of lectures on Indian rights that applied Thomism to the practice of Spanish rule. He argued that all human beings share the capacity for rationality and have natural rights that stem from this capacity. From this premise, he deduced that the Papal decision to grant Spain title to the Americas was illegitimate. Unlike the position of Pope Innocent IV, Victoria argued that neither the Pope nor the Spaniards could subjugate the Indians in order to punish violations of natural law, such as fornication or adultery. He noted that the Pope had no right to make war on Christians and take their property simply because they were “fornicators or thieves.” If this were the case, then no European king’s dominion would ever be safe. Furthermore, according to Victoria, the pope and Christian rulers acting on his mandate had even less right to enforce laws against unbelievers, because they were outside of the Christian community, which was the domain of Papal authority (Williams 1990)[^williams-1990].
    step1: |-
      然而，一些被派往新大陆的西班牙传教士注意到，奴隶劳动的残酷剥削十分普遍，而严肃的宗教教导却付之阙如。多明我会的成员尤其指出，以原住民据称的野蛮为由奴役他们，同时却实行一种在西班牙统治的二十年间把伊斯帕尼奥拉岛原住民人口从 25 万减少到 1.5 万的征服、战争与奴隶制，这乃是伪善。鉴于西班牙“文明”的种族灭绝性后果，他们开始质疑文明使命的观念。巴托洛梅·德·拉斯·卡萨斯与弗朗西斯科·德·维多利亚是西班牙殖民实践最有影响力的两位批评者。维多利亚发表了一系列关于印第安人权利的演讲，把托马斯主义应用于西班牙统治的实践。他主张，所有人共享理性能力，并拥有源于这种能力的自然权利。由这一前提出发，他推论教皇把美洲授予西班牙的决定是非法的。与教皇英诺森四世的立场不同，维多利亚认为，教皇和西班牙人都不能为了惩罚违反自然法的行为（如奸淫或通奸）而征服印第安人。他指出，教皇无权仅仅因为基督徒是“通奸者或窃贼”就对他们发动战争并夺取其财产。倘若如此，任何欧洲国王的统治都将永无宁日。此外，按维多利亚的说法，教皇和奉其委托行事的基督教统治者更没有权利对不信者强制执行法律，因为不信者处于基督教共同体之外，而后者正是教皇权威的领域（Williams 1990）[^williams-1990]。
