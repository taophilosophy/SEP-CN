      One of the key issues that distinguished critics from proponents of colonialism and imperialism was their view of the relationship between culture, history and progress. Many of the influential philosophers writing in France and England in the eighteenth and nineteenth centuries had assimilated some version of the developmental approach to history that was associated with the Scottish Enlightenment. According to the stadial theory of historical development, all societies naturally moved from hunting, to herding, to farming, to commerce, a developmental process that simultaneously tracked a cultural arc from “savagery,” through “barbarism,” to “civilization.” “Civilization” was not just a marker of material improvement, but also a normative judgment about the moral progress of society. (Kohn and O’Neill 2006)[^kohn-2006]
    step1: |-
      区分殖民主义和帝国主义的批评者与支持者的关键问题之一，是他们如何看待文化、历史与进步之间的关系。十八、十九世纪在法国和英国写作的许多有影响力的哲学家，都吸收了与苏格兰启蒙运动相联系的历史发展进路的某种版本。按照历史发展的阶段理论，所有社会都自然地从狩猎经游牧、农耕走向商业，这一发展过程同时追踪了一条从“野蛮”经“蒙昧”到“文明”的文化弧线。“文明”不仅是物质进步的标志，也是关于社会道德进步的规范性判断。（Kohn and O’Neill 2006）[^kohn-2006]
