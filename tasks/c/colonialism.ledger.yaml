      弗朗茨·法农是去殖民化斗争的主要理论家之一。他最有影响力的两部著作聚焦反黑人的种族主义和殖民暴力的影响。《黑皮肤，白面具》（2008 [1952]）描述了种族化的主体性以及维系种族支配的结构性条件。法农汲取存在主义、精神分析和文学理论，展示了欧洲殖民主义对身份的建构性效应。该书详细描述了浸没于一个把黑性病理化的文化框架的创伤性后果，这种病理化由此分裂了种族化的主体。《全世界受苦的人》（1961）是关于反殖民斗争和后殖民治理挑战的最有影响力的哲学论述。该书对暴力与解放之间的关系提供了复杂的说明。暴力是殖民政权的基础，因此不可避免地在推翻它的过程中扮演角色，但法农也探讨了暴力的心理维度。革命暴力可以是对压迫经验所特有的内化暴力的一种生产性转向，因为它能带来结构性变化。它也是一种生成政治能动性、群体凝聚力和民族认同的实践。《全世界受苦的人》还包含对殖民国家在独立后继续行使经济权力之方式的深刻反思。按法农的说法，殖民主义特有的经济剥削可以通过买办资产阶级的领导以新的方式得到保障，买办资产阶级是原住民管理阶级中与外国经济利益结盟的一部分。他还提出，基于族群或民族意识的集体认同可能产生有害影响，当它在意识形态上起作用、为精英的经济利益而掩盖阶级差异时。法农受马克思主义影响的反殖民批判进路，是黑人激进传统的一部分，这一传统还包括埃里克·威廉斯等其他加勒比思想家——其著作《资本主义与奴隶制》（1994）证明从甘蔗种植园榨取的财富为工业革命提供了资金——以及 C.L.R. 詹姆斯的《黑色雅各宾派》（1989），该书从胜利革命者的视角重述了海地革命的故事。这些著作是种族资本主义诸理论的奠基之作，种族资本主义主张种族化的剥削与资本积累相互强化。（Robinson 2000）[^robinson-2000]
