      托克维尔对阿尔及利亚的分析，很少为其正当性焦虑，而更多地关注有效殖民治理的实操。他认为，政权的稳定取决于殖民行政当局为法国定居者提供善治的能力。托克维尔强调，巴黎过度的决策集中，加上当地军事领导层的专断做法，意味着法国殖民者毫无财产安全，更不用说他们在法国习以为常的政治和公民权利了。对原住民实施军事管制法，托克维尔并不介意；但应用于法国人时，他觉得适得其反。在托克维尔看来，法国在阿尔及利亚事业的成败，全系于能否吸引大批法国永久定居者。既然已不可能赢得原住民的效忠，法国若不建立一个稳定的殖民者共同体，便无法保住阿尔及利亚。原住民要通过军事支配来统治，法国人则要靠在一个尽可能复现法国文化与政治生活的环境中经济获益的许诺来吸引定居。在《论阿尔及利亚第二封信》（Tocqueville 1837: 25）[^tocqueville-1837]中短暂地对种族“融合”表示乐观之后，托克维尔把殖民世界理解为定居者与原住民之间永恒的对立，一种为确保前者经济利益而构建的对立。
