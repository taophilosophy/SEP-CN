      Tocqueville’s analysis of Algeria reflects little anxiety about its legitimacy and much concern about the pragmatics of effective colonial governance. The stability of the regime, he felt, depended on the ability of the colonial administration to provide good government to the French settlers. Tocqueville emphasized that the excessive centralization of decision-making in Paris combined with the arbitrary practices of the local military leadership meant that French colonists had no security of property, let alone the political and civil rights that they were accustomed to France. Tocqueville was untroubled by the use of martial law against indigenous peoples, but felt that it was counterproductive when applied to the French. For Tocqueville, the success of the French endeavor in Algeria depended entirely on attracting large numbers of permanent French settlers. Given that it was proving impossible to win the allegiance of the indigenous people, France could not hold Algeria without creating a stable community of colonists. The natives were to be ruled through military domination and the French were to be enticed to settle through the promise of economic gain in an environment that reproduced, as much as possible, the cultural and political life of France. After a brief period of optimism about “amalgamation” of the races in his “Second Letter on Algeria” (Tocqueville 1837: 25)[^tocqueville-1837], Tocqueville understood the colonial world in terms of the permanent opposition of settler and native, an opposition structured to ensure the economic benefit of the former.
