      在 19 世纪 50 年代发表于《纽约每日论坛报》的一系列报纸文章中，马克思专门讨论了英国殖民主义对印度的影响。他的分析与他关于政治经济变化的一般理论是一致的。他把印度描述为一个正在经历现代化痛苦过程的本质上的封建社会。然而，按马克思的说法，印度的“封建主义”是一种独特的经济组织形式。他得出这一结论，是因为他（错误地）相信印度的农业用地是公有的。马克思用“东方专制主义”概念描述一种特殊类型的阶级统治，它利用国家的征税权力从农民身上榨取资源。按马克思的说法，东方专制主义在印度产生，是因为农业生产力依赖于只能由国家出资兴办的大型公共工程（如灌溉）。这意味着国家无法轻易被一种更分散的权威体系取代。在西欧，封建财产可以逐步转化为私人拥有的、可转让的土地财产。在印度，土地公有制使之不可能，从而阻碍了商业农业和自由市场的发展。由于“东方专制主义”抑制了经济现代化的本土发展，英国的支配便成了经济现代化的推动者。
