      Aijaz Ahmad has argued that, despite Spivak’s claims to be working within the Marxist tradition, her essays exhibit contempt for materialism, rationalism, and progress, the core features of Marxism (Ahmad 1997)[^ahmad-1997]. According to Ahmad, Spivak is concerned with narratives of capitalism rather than the institutional structures and material effects of capitalism as a mode of production. Spivak’s sharp criticism of movements that essentialize subaltern subjects casts doubt on the basic premise of Marxist politics, which privileges the proletariat as a group with shared, true interests that are produced by the capitalist system.
    step1: |-
      艾贾兹·阿赫默德论证说，尽管斯皮瓦克自称在马克思主义传统内工作，她的文章却表现出对唯物主义、理性主义和进步的轻蔑，而这些正是马克思主义的核心特征（Ahmad 1997）[^ahmad-1997]。按阿赫默德的说法，斯皮瓦克关心的是关于资本主义的叙事，而不是作为生产方式的资本主义的制度结构和物质效应。斯皮瓦克对本质化庶民主体的运动的尖锐批评，让人怀疑马克思主义政治学的基本前提，即把无产阶级 privileged 为一个由资本主义制度生产的、拥有共同而真实利益的群体。
    step2: |-
