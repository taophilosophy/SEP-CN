Feder and Vardi studied Schaefer’s dichotomy and conjectured that it holds for all finite-domain Constraint Satisfaction Problems (CSP) [Feder and Vardi, 1999]. A finite-domain CSP, C, consists of a finite domain, D, and a finite set of relations $R_1, \ldots , R_k$ over D. An instance of C consists of a set of variables, $v_1, \ldots v_n$ and a conjunction of atoms $\varphi \equiv \bigwedge R_i(v_{j_1}, \ldots)$. The answer to the instance, $\varphi$, is “yes”, i.e., $\varphi \in C$ iff there is an assignment of the variables to elements of the domain, D, so that $\varphi$ is satisfied.
    step1: |
费德和瓦尔迪研究了谢弗的二分法，并猜想它对所有有限域约束满足问题（CSP）都成立 [Feder and Vardi, 1999]。一个有限域 CSP，C，由一个有限域 D 和 D 上的一个有限关系集 $R_1, \ldots , R_k$ 组成。C 的一个实例由一组变量 $v_1, \ldots v_n$ 和一个原子的合取 $\varphi \equiv \bigwedge R_i(v_{j_1}, \ldots)$ 组成。该实例 $\varphi$ 的答案是“是”，即 $\varphi \in C$，当且仅当存在一个把变量指派到域 D 的元素上的指派，使得 $\varphi$ 被满足。
    step2: |
费德与瓦尔迪研究了谢弗的二分法，并猜想它对所有有限域约束满足问题（Constraint Satisfaction Problems，CSP）都成立 [Feder and Vardi, 1999]。一个有限域 CSP，C，由一个有限域 D 和 D 上的一个有限关系集 $R_1, \ldots , R_k$ 组成。C 的一个实例由一组变量 $v_1, \ldots v_n$ 和一个原子合取式 $\varphi \equiv \bigwedge R_i(v_{j_1}, \ldots)$ 组成。该实例 $\varphi$ 的答案为“是”，即 $\varphi \in C$，当且仅当存在一个把变量指派到域 D 的元素上的指派，使 $\varphi$ 被满足。
