**Primitive recursion**: if $f$ and $g$ are primitive recursive functions of arity $k$ and $k+2$, respectively, then there is a primitive recursive function, $h$, of arity $k+1$ satisfying the following conditions: $$\begin{align} h(0,x_{1},\ldots ,x_{k}) &= f(x_{1},\ldots ,x_{k}); \text{ and,} \\ h(n+1,x_{1},\ldots ,x_{k}) &= g(h(n,x_{1},\ldots ,x_{k}), n,x_{1},\ldots ,x_{k}). \end{align}$$
    step1: |
**原始递归**：如果 $f$ 和 $g$ 分别是元数为 $k$ 和 $k+2$ 的原始递归函数，那么存在一个元数为 $k+1$ 的原始递归函数 $h$，满足下列条件：$$\begin{align} h(0,x_{1},\ldots ,x_{k}) &= f(x_{1},\ldots ,x_{k}); \text{ 以及，} \\ h(n+1,x_{1},\ldots ,x_{k}) &= g(h(n,x_{1},\ldots ,x_{k}), n,x_{1},\ldots ,x_{k}). \end{align}$$
    step2: |
**原始递归**（primitive recursion）：若 $f$ 与 $g$ 分别是元数为 $k$ 与 $k+2$ 的原始递归函数，则存在一个元数为 $k+1$ 的原始递归函数 $h$，满足下列条件：$$\begin{align} h(0,x_{1},\ldots ,x_{k}) &= f(x_{1},\ldots ,x_{k}); \text{ 以及，} \\ h(n+1,x_{1},\ldots ,x_{k}) &= g(h(n,x_{1},\ldots ,x_{k}), n,x_{1},\ldots ,x_{k}). \end{align}$$
