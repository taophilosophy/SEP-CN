In fact, if one looks closer, all of Schaefer’s satisfiability problems are either NP complete, P complete, $\oplus$L complete, NL complete, L complete, or trivial [Allender et al., 2009]. That is the non-trivial problems in P may be P complete, or complete for one of these three complexity classes within P. In other words, if we look closer, the NP/P dichotomy phenomenon problem is really a “multi-chotomoy” phenomenon, namely all non-trivial satisfiability problems are complete for one of five well-known complexity classes.
    step1: |
事实上，如果更仔细地看，谢弗的所有可满足性问题要么是 NP 完全的、P 完全的、$\oplus$L 完全的、NL 完全的、L 完全的，要么是平凡的 [Allender et al., 2009]。也就是说，P 中的非平凡问题可能是 P 完全的，或对 P 内这三个复杂性类之一是完全的。换句话说，如果更仔细地看，NP/P 二分现象问题实际上是“多重二分”现象，即所有非平凡可满足性问题对五个众所周知的复杂性类之一是完全的。
