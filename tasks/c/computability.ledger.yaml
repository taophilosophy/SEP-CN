However, these intermediate problems don’t tend to show up. This phenomenon has received a great deal of attention recently via the dichotomy conjecture of Feder and Vardi [Feder and Vardi, 1999]. Schaefer introduced this work with an insightful paper in which he studied all variants of the boolean satisfiability problem [Schaefer, 1978]. He proved that each such problem was either NP complete or in P, thus Ladner’s intermediate problems cannot occur among such satisfiability problems. Since there were just these two possibilities, Schaefer called this a dichotomy.
    step1: |
然而，这些中间问题往往不会出现。这一现象近来通过费德和瓦尔迪的二分猜想 [Feder and Vardi, 1999] 受到了大量关注。谢弗以一篇富有洞见的论文开创了这一工作，在其中他研究了布尔可满足性问题的所有变体 [Schaefer, 1978]。他证明每个这样的问题要么是 NP 完全的，要么在 P 中，因此拉德纳的中间问题不可能出现在这类可满足性问题之中。由于只有这两种可能，谢弗称之为二分法。
