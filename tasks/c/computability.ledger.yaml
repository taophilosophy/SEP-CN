With a very few exceptions, when a natural problem is in NP, it turns out to be either NP complete, or in P. People wondered whether this was always the case. Ladner proved that if P $\ne$ NP, then there is an intermediate problem $I$ that is in NP but not in P and not NP complete [Ladner, 1975].
    step1: |
除了极少数例外，当一个自然问题在 NP 中时，结果它要么是 NP 完全的，要么在 P 中。人们想知道这是否总是如此。拉德纳证明，如果 P $\ne$ NP，那么存在一个中间问题 $I$，它在 NP 中但不在 P 中，也不是 NP 完全的 [Ladner, 1975]。
    step2: |
