- id: p28
  source: "We therefore see similarities between a cognitive account of the emotions and the Sāṃkhya-Yoga account because both claim that emotions have mental objects but at the same time there is a difference in how emotions can relate to knowledge, with the Sāṃkhya-Yoga philosophers claiming that knowledge and emotions are incompatible."
  step1: "因此，我们看到一种认知式的情感说明与数论—瑜伽说明之间的相似之处，因为两者都主张情感具有心理对象，但同时，在情感如何与知识相关这一点上存在差异：数论—瑜伽哲学家主张知识与情感不相容。"
  step2: "因此，我们看到一种认知式的情感说明与数论—瑜伽说明之间的相似之处，因为两者都主张情感具有心理对象，但同时，在情感如何与知识相关这一点上存在差异：数论—瑜伽哲学家主张知识与情感不相容。"
- id: p29
  source: "While there are many nuances in the accounts of the emotions among Buddhist writers, there are also certain key ideas that are common to all of them. This section, tries to bring out these key ideas by analyzing some of the writings of the Buddhist philosophers Dharmakīrti, Śāntarakṣita and Kamalaśīla. (For a detailed discussion of feelings in earlier Buddhhist texts see Heim 2021. For a discussion of the concept of pain in Buddhist thought see Kachru 2021.)[^heim-2021][^heim-2021-2][^kachru-2021]"
  step1: "虽然佛教作家之间关于情感的说明有许多细微差别，但也有某些为所有说明所共有的关键观念。本节试图通过分析佛教哲学家法称（Dharmakīrti）、寂护（Śāntarakṣita）与莲花戒（Kamalaśīla）的一些著作来揭示这些关键观念。（关于早期佛教文本中感受的详细讨论，见 Heim 2021。关于佛教思想中苦的概念的讨论，见 Kachru 2021。）[^heim-2021][^heim-2021-2][^kachru-2021]"
  step2: "虽然佛教作家之间关于情感的说明有许多细微差别，但也有某些为所有说明所共有的关键观念。本节试图通过分析佛教哲学家法称（Dharmakīrti）、寂护（Śāntarakṣita）与莲花戒（Kamalaśīla）的一些著作来揭示这些关键观念。（关于早期佛教文本中感受的详细讨论，见 Heim 2021。关于佛教思想中苦的概念的讨论，见 Kachru 2021。）[^heim-2021][^heim-2021-2][^kachru-2021]"
- id: p30
  source: "As with other Indian accounts of the emotions, the Buddhist conception of emotion appears in the context of the discussion about the role of cognition (*vijñāna*). Buddhist philosophers argue against the existence of a self (*ātman*). At the same time, they acknowledge the existence of a non-physical momentary consciousness or chain of cognitions (*santāna vijñāna*) which carries over from former births into the present and future rebirths. Thus, Buddhists try to find a middle ground between a permanent non-physical self and the materialism of the Lokāyata school (materialist school of philosophy) which argues that the self is purely the result of bodily processes. According to the materialists, the self comes into existence with the body and ceases to exist when the body ceases to exist."
  step1: "与印度其他关于情感的说明一样，佛教的情感概念出现在关于认知（*vijñāna*，识）之作用的讨论语境中。佛教哲学家论证反对自我（*ātman*）的存在。同时，他们承认一种非物理的刹那意识或认知之链（*santāna vijñāna*，识相续）的存在，它从过去的出生延续到现在与未来的转生。因此，佛教徒试图在常住的非物理自我与顺世派（Lokāyata，唯物论学派）的唯物论之间寻找中间立场，后者主张自我纯粹是身体过程的结果。按照唯物论者，自我随身体而出现，随身体消亡而消亡。"
  step2: "与印度其他关于情感的说明一样，佛教的情感概念出现在关于认知（*vijñāna*，识）之作用的讨论语境中。佛教哲学家论证反对自我（*ātman*）的存在。同时，他们承认一种非物理的刹那意识或认知之链（*santāna vijñāna*，识相续）的存在，它从过去的出生延续到现在与未来的转生。因此，佛教徒试图在常住的非物理自我与顺世派（Lokāyata，唯物论学派）的唯物论之间寻找中间立场，后者主张自我纯粹是身体过程的结果。按照唯物论者，自我随身体而出现，随身体消亡而消亡。"
- id: p31
  source: "In the *Pramāṇa-siddhi*-chapter of the *Pramāṇa-vārttika*, Dharmakīrti argues that past lives exist. We can know this because of the authority of the Buddha and we have reason to accept his authority because of his infinite compassion. This compassion can only be the result of practice over many life times [PV 36]. The Lokāyata philosophers argue that cognitions require the support of a body and therefore cease to exist when the body ceases to exist. Dharmakīrti objects to this by arguing that mental cognitions do not derive from any physical support [PV 49]. Śāntarakṣita and Kamalaśīla state that the relationship between the support and what is supported can be analyzed either as a causal relationship or as the relationship between an object and its capacity [TS and TSP 1858–1859]. In this respect they do not deviate from Dharmakīrti who rejects this position of the Lokāyata philosophers by arguing that the body could be neither the cause of cognition nor could it have the capacity of cognition. Franco explains Dharmakīrti’s argument in the following way:"
  step1: "在《量释论》（*Pramāṇa-vārttika*）的《成量品》（*Pramāṇa-siddhi*）中，法称论证过去世存在。我们可以因为佛陀的权威而知道这一点，我们之所以有理由接受他的权威，是因为他的无限慈悲。这种慈悲只能是许多世修行的结果[PV 36]。顺世派哲学家论证，认知需要身体的支持，因此当身体消亡时认知也消亡。法称反驳这一点，论证心的认知并不来源于任何物理支持[PV 49]。寂护与莲花戒指出，支持者与被支持者之间的关系可以被分析为因果关系，或者对象与其能力之间的关系[TS and TSP 1858–1859]。在这方面，他们并没有偏离法称，后者通过论证身体既不能是认知的因，也不能具有认知的能力，来拒绝顺世派哲学家的这一立场。Franco 以下列方式解释了法称的论证："
  step2: "在《量释论》（*Pramāṇa-vārttika*）的《成量品》（*Pramāṇa-siddhi*）中，法称论证过去世存在。我们可以因为佛陀的权威而知道这一点，我们之所以有理由接受他的权威，是因为他的无限慈悲。这种慈悲只能是许多世修行的结果[PV 36]。顺世派哲学家论证，认知需要身体的支持，因此当身体消亡时认知也消亡。法称反驳这一点，论证心的认知并不来源于任何物理支持[PV 49]。寂护与莲花戒指出，支持者与被支持者之间的关系可以被分析为因果关系，或者对象与其能力之间的关系[TS and TSP 1858–1859]。在这方面，他们并没有偏离法称，后者通过论证身体既不能是认知的因，也不能具有认知的能力，来拒绝顺世派哲学家的这一立场。Franco 以下列方式解释了法称的论证："
