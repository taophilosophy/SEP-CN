  source: "In addition, the text acknowledges that a representation can be about a real object or an imagined object. In the latter case, the question arises in what way we can distinguish between an object and its representation. This suggests that at least some Buddhist traditions distinguish between a cognition, the object of a cognition and the feeling accompanying a cognition. Śāntarakṣita mentions *kleśas* in TS 1955 and it is obvious that he operates within the context of this psychological distinction which becomes clear in his discussion of love (*rāga*) and hatred (*dveṣa*)."
  step1: "此外，该文本承认一个表征可以关于一个真实对象或一个想象对象。在后一种情况下，问题在于我们如何区分一个对象与其表征。这表明，至少某些佛教传统区分了认知、认知的对象与伴随认知的感受。寂护在 TS 1955 中提到烦恼（*kleśas*），显然他是在这种心理区分的语境中运作的，这一点在他对爱（*rāga*）与憎（*dveṣa*）的讨论中变得清楚。"
  step2: "此外，该文本承认一个表征可以关于一个真实对象或一个想象对象。在后一种情况下，问题在于我们如何区分一个对象与其表征。这表明，至少某些佛教传统区分了认知、认知的对象与伴随认知的感受。寂护在 TS 1955 中提到烦恼（*kleśas*），显然他是在这种心理区分的语境中运作的，这一点在他对爱（*rāga*）与憎（*dveṣa*）的讨论中变得清楚。"
