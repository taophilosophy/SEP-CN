  source: "In this passage, Kamalaśīla draws a distinction between the cognition of blue and the feeling of love. His point is that the cognition of blue is a perception and therefore requires an object whereas a feeling of love does not. There is no basis for love in the way that there is a basis for our perception of blue. So, Śāntarakṣita’s argument, as explained by Kamalaśīla, consists of two parts: a) love, hatred etc. are learned through experience and reinforced by repetition and b) love, hatred etc. are not perceptions."
  step1: "在这一段中，莲花戒在关于蓝色的认知与爱的感受之间划出区分。他的要点是，关于蓝色的认知是一种知觉，因此需要一个对象，而爱的感受则不需要。没有爱的依据，就像没有我们知觉蓝色的依据那样。所以，寂护的论证，如莲花戒所解释的，由两部分构成：a）爱、憎等是通过经验习得并由重复强化的；b）爱、憎等不是知觉。"
  step2: "在这一段中，莲花戒在关于蓝色的认知与爱的感受之间划出区分。他的要点是，关于蓝色的认知是一种知觉，因此需要一个对象，而爱的感受则不需要。没有爱的依据，就像没有我们知觉蓝色的依据那样。所以，寂护的论证，如莲花戒所解释的，由两部分构成：a）爱、憎等是通过经验习得并由重复强化的；b）爱、憎等不是知觉。"
