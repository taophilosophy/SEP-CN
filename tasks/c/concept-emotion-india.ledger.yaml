  source: "> As regards the “other world”, there is no such “other world”, apart from the “chain of causes and effects, in the form of cognition and the rest”. What is spoken of as “the other world” or “this world”, that is only by way of a certain limit placed upon the said “chain” which is beginningless and endless. (TS 1872)"
  step1: "至于“其他世界”，除了“认知等形式的因果之链”外，并没有这样的“其他世界”。所谓“其他世界”或“此世界”，只是通过对所述“链”施以某种限定而说的，而这“链”是无始无终的。（TS 1872）"
