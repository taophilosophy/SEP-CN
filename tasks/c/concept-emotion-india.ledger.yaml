  source: "Śāntarakṣita clearly believes that there is something fundamental about the feelings of love and hatred. They are so fundamental that even babies feel them. At the same time, they require experience. So the question is how was the first feeling of love (or hatred) acquired? There might have been a time when humans did not have the feeling of love and they only acquired it at some point in their lives through experience and subsequent repetition of the experience. This sounds like a strange idea precisely because love and hatred are so fundamental to our unenlightened lives that the existence of a time when they did not exist seems impossible. Yet, Śāntarakṣita’s view implies either that there must have been such a time or that there is an infinite chain of these feelings stretching backwards. In TS 1872, Śāntarakṣita makes it clear that he believes in the latter option:"
  step1: "寂护显然相信爱与憎的感受有某种根本性的东西。它们如此根本，以至于连婴儿也能感受到它们。同时，它们需要经验。所以问题是：最初的爱（或憎）的感受是如何获得的？可能有过一个时代，人类没有爱的感受，他们只是在一生中某个时刻通过经验及其后的重复而获得它。这听起来像是一个奇怪的观念，恰恰因为爱与憎对我们的未觉悟生活如此根本，以至于它们不存在的一个时代似乎不可能。然而，寂护的观点意味着要么必有这样一个时代，要么存在一个向后的、这些感受的无限之链。在 TS 1872 中，寂护明确表示他相信后一种选择："
