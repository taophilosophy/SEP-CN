  source: "> All afflictions (*kleśa*) are due to false knowledge (*avidyā*) and can be destroyed by right knowledge. The Yoga, like Spinoza, regards emotions as intellectual disorders which can be cured by true knowledge. [Footnote omitted] (Sinha 1985, p. 97)[^sinha-1985]"
  step1: "一切烦恼（*kleśa*）都源于错误知识（*avidyā*），并可由正确的知识摧毁。瑜伽像斯宾诺莎一样，把情感视为可由真知治愈的理智紊乱。[脚注从略]（Sinha 1985, p. 97）[^sinha-1985]"
