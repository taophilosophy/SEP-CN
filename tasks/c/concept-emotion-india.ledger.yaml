- id: p1
  source: "In Indian literature, emotions are discussed in several different contexts (Bilimoria and Wenta 2015b; Torella 2015)[^bilimoria-2015b][^torella-2015]: first, within aesthetics (*rasa*). The word *rasa* can mean juice, sap, essence, condiment or even flavour and refers to the different sentiments invoked by a work of art, for example a piece of music. Secondly, emotions are discussed within the context of the *bhakti* (devotional) movement. Here particular emphasis is placed on cultivating the emotion of love for a supreme being, e.g., Śiva (see e.g., Stainton 2021)[^stainton-2021]. Thirdly, they are discussed in various tantric traditions. These traditions form a counterbalance to the ascetic ideal of classical philosophical texts (fourth context in which emotions are discussed) in that they encourage “living out” emotions (and desires) without forming any attachment to them. This entry focuses on the emotions in this fourth context, namely classical Indian philosophical thinking, which includes Brāhmaṇical as well as Buddhist texts, among others. While there is no equivalent for the term “emotion” in Sanskrit, the concept nevertheless plays an important role in Indian philosophy. Terms used in Sanskrit texts include *vedanā* (feeling) and *bhāva* (feeling) as well as names of individual emotions, such as *rāga* (love, attraction), *dveṣa* (hatred, aversion), *harṣa* (joy), *bhaya* (fear) and *śoka* (sorrow). One of the reasons why emotions are philosophically interesting in India and the West is their relationship with the mental phenomenon of *vijñāna* or *jñāna* which is translated as “cognition”. The relationship between emotion and cognition is important for any account of reason and rationality. While the importance of the emotions for rational deliberation and decision-making has been acknowledged in recent discussions in the philosophy of mind, the history of Western philosophy contains many views, for example those of Plato, Aristotle, and the Stoics, which emphasize the dangerous and destructive role of the emotions. At the heart of these views lies a division of our mental lives into cognitions and feelings. Cognitions are representational thoughts. They are often regarded as rational because they are capable of representing the external world and therefore they provide us with access to the external world, based on the best available evidence. So, according to this view of rationality, when I think that there is a book on the table, based on my available evidence, and there really is one, then my thought is rational. However, if I am hallucinating that there is a book on the table, my thought that there is a book might also be rational because the available evidence points towards this thought. In order to make sure that our thoughts represent reality correctly, we require an account of what counts as good evidence, which is one of the main foci of epistemology in Indian and Western philosophy. Nevertheless, cognitions derive their status as thoughts capable of rationality from the fact that they have objects which represent the external world. By contrast, feelings are some of the non-representational attitudes one can have towards the objects of the representations of our thoughts. For example, when a person thinks about her daughters, she has a cognition which represents her daughters. The objects of her thought are her daughters and her thought picks them out among various objects and subjects in the world. There are several ways in which these objects can be picked out: one can simply have the thought that one has two daughters or one’s thought can be “coloured” with love and affection. This “colouring” of thought is often regarded as an affect. Together with the thought, it accounts for an emotion. So, the emotion of love, for example, is the thought of the object of love plus an affect. The affect is non-representational and regarded as a “mere” feeling."
  step1: "在印度文献中，情感（emotion）在若干不同语境下被讨论（Bilimoria and Wenta 2015b; Torella 2015）[^bilimoria-2015b][^torella-2015]：首先是美学（*rasa*，味）。*rasa* 一词可指汁液、树液、精华、调料甚至味道，指一件艺术作品（例如一段乐曲）所唤起的种种不同情感。其次，情感在虔信（*bhakti*）运动的语境中被讨论，这里特别强调培养对至高存在（如湿婆 Śiva）的爱（参见 Stainton 2021）[^stainton-2021]。第三，它们被各种怛特罗（tantric）传统所讨论。这些传统构成对古典哲学文本之禁欲理想（情感被讨论的第四种语境）的制衡，因为它们鼓励“活出”情感（与欲望）而不对之形成任何执著。本词条聚焦于这第四种语境中的情感，即古典印度哲学思想，其中既包括婆罗门教（Brāhmaṇical）也包括佛教文本，以及其他。虽然梵语中没有与“情感”（emotion）一词相当的词，这一概念在印度哲学中仍扮演重要角色。梵语文本中使用的词包括 *vedanā*（受）和 *bhāva*（受），以及个别情感的名称，如 *rāga*（爱，贪著）、*dveṣa*（憎，厌离）、*harṣa*（喜）、*bhaya*（怖）和 *śoka*（悲）。情感在印度与西方之所以在哲学上有趣，原因之一在于它们与 *vijñāna*（识）或 *jñāna*（智）这一心智现象的关系，后者被译作“认知”（cognition）。情感与认知的关系对于任何关于理性与合理性的说明都至关重要。虽然情感对于理性思虑与决策的重要性在近来心灵哲学的讨论中已获承认，西方哲学史仍包含许多观点，例如柏拉图、亚里士多德和斯多亚学派的观点，强调情感的危险与破坏作用。这些观点的核心在于把我们的心智生活划分为认知与感受。认知是表征性思想。它们常被视为理性的，因为它们能够表征外部世界，因此基于最可得的证据为我们提供通向外部世界的途径。所以，按照这种理性观，当我基于可得证据而认为桌上有书，而桌上确实有书时，我的思想就是理性的。然而，如果我产生幻觉，以为桌上有书，那么我“桌上有书”的思想可能也是理性的，因为可得证据指向这一思想。为确保我们的思想正确地表征实在，我们需要一种关于什么算作良好证据的说明，这是印度与西方哲学中认识论的主要焦点之一。然而，认知之作为能够具有理性的思想这一地位，来自它们具有表征外部世界的对象。相反，感受是我们对思想之表征对象所能持有的若干非表征态度。例如，当一个人想到她的女儿们时，她有一个表征其女儿们的认知。她思想的对象是她的女儿们，她的思想在世界各种对象与主体中挑出她们。这些对象可以有若干种被挑出的方式：一个人可以只是持有“我有两个女儿”的思想，或者她的思想可以被爱与亲爱所“着色”。这种对思想的“着色”常被视为一种情动（affect）。它与思想一起构成一种情感。所以，例如爱的情感，就是关于爱的对象的思想加上一种情动。情动是非表征性的，被视为一种“单纯”感受。"
  step2: "印度文献在好几种不同语境中讨论情感（emotion；Bilimoria and Wenta 2015b; Torella 2015）[^bilimoria-2015b][^torella-2015]：首先是美学（*rasa*，味）。*rasa* 一词可指汁液、树液、精华、调料甚至味道，指艺术作品（例如一段乐曲）所唤起的种种不同情感。其次，情感在虔信（*bhakti*）运动中被讨论，这里特别强调培养对至高存在（如湿婆 Śiva）的爱（参见 Stainton 2021）[^stainton-2021]。第三，各种怛特罗（tantric）传统也讨论情感。这些传统构成对古典哲学文本之禁欲理想（情感被讨论的第四种语境）的制衡：它们鼓励人“活出”情感（与欲望），却不对此形成任何执著。本词条聚焦于这第四种语境中的情感，即古典印度哲学思想，其中既包括婆罗门教（Brāhmaṇical）也包括佛教文本，以及其他。虽然梵语中没有一个与“情感”（emotion）相当的词，这一概念在印度哲学中仍扮演重要角色。梵语文本所用的词包括 *vedanā*（受）与 *bhāva*（受），以及个别情感的名称，如 *rāga*（爱、贪著）、*dveṣa*（憎、厌离）、*harṣa*（喜）、*bhaya*（怖）与 *śoka*（悲）。情感之所以在印度与西方都具哲学趣味，原因之一在于它们与 *vijñāna*（识）或 *jñāna*（智）这一心智现象的关系，后者常被译作“认知”（cognition）。情感与认知的关系，对于任何关于理性与合理性的说明都至关重要。虽然情感对于理性思虑与决策的重要性，在近来心灵哲学的讨论中已获承认，西方哲学史仍包含许多强调情感之危险与破坏作用的观点，例如柏拉图、亚里士多德与斯多亚学派的观点。这些观点的核心在于把我们的心智生活划分为认知与感受。认知是表征性思想。它们之所以常被视为理性的，是因为它们能表征外部世界，并因此基于最可得的证据为我们提供通向外部世界的途径。按照这种理性观，当我基于可得证据而认为桌上有书，而桌上确实有书时，我的思想就是理性的。然而，如果我产生幻觉，以为桌上有书，那么我“桌上有书”的思想可能也是理性的，因为可得证据指向这一思想。为确保我们的思想正确地表征实在，我们需要一种关于什么算作良好证据的说明，这正是印度与西方哲学中认识论的主要焦点之一。然而，认知之所以能成为具有理性的思想，来自它们具有表征外部世界的对象。相反，感受是我们对思想之表征对象所能持有的若干非表征态度。例如，当一个人想到她的女儿们时，她有一个表征其女儿们的认知。她思想的对象是她的女儿们，她的思想在世界各种对象与主体中挑出她们。这些对象可有若干种被挑出的方式：一个人可以只是持有“我有两个女儿”的思想，她的思想也可以被爱与亲爱所“着色”。这种对思想的“着色”常被视为一种情动（affect）。它与思想一起构成一种情感。所以，例如爱的情感，就是关于爱的对象的思想加上一种情动。情动是非表征性的，被视为一种“单纯”感受。"
- id: p2
  source: "The reason why many philosophers regard the emotions as an obstacle to rational thought is the influence of the non-representational feeling. The fact that feelings do not seem to have objects means, according to some views, that they can interfere with rational thought. According to these views, rational thought, which is representational and therefore object-directed, is subject to disturbing interferences from the feelings. The feelings themselves, however, are non-rational because they arise due to some physical imbalance in the body, for example through an imbalance of the various “humours”. This imbalance can negatively influence rational thought. An example is the person who acts against her better judgment because she is in the grip of some feeling. This is of course also the basis for the term “passion” as something that we “suffer”, which was discussed by many philosophers in the seventeenth and eighteenth centuries, e.g., Descartes, Spinoza and Hume. Since rational thought is an ideal for many philosophers and the feelings can interfere with this ideal, the natural consequence seems to be to advocate for the extinction or at least the control of the feelings and, as a consequence, of the emotions. This is what many philosophers throughout the history of philosophy have done, most notably of course the Stoics. While they often recognize that the emotions contain a cognitive, and therefore potentially rational, element, they try to uncover this element by advocating its separation from the affect. Of course, if the affect were to be purged from the emotion, the resulting cognition would cease to be an emotion."
  step1: "许多哲学家之所以把情感视为理性思想的障碍，原因在于非表征性感受的影响。感受似乎不具有对象，这一事实按照某些观点意味着它们可以干扰理性思想。按照这些观点，理性思想是表征性的、因而指向对象的，它易受来自感受的干扰。然而感受本身是非理性的，因为它们源于身体的某种失衡，例如各种“体液”（humours）的失衡。这种失衡会消极地影响理性思想。一个例子是：一个人因被某种感受所左右而违背自己的明智判断行事。当然，这也是“激情”（passion）一词的基础，即我们“承受”（suffer）的东西，十七、十八世纪许多哲学家（如笛卡尔、斯宾诺莎和休谟）讨论过它。既然理性思想是许多哲学家的理想，而感受可以干扰这一理想，那么自然的结论似乎是主张消灭或至少控制感受，并因而控制情感。这是哲学史上许多哲学家之所为，最著名的当然是斯多亚学派。虽然他们常承认情感包含一种认知的、因而潜在理性的成分，他们仍试图通过主张将该成分与情动分离来揭示它。当然，如果情动被从情感中清除，所剩的认知就不再是情感。"
  step2: "许多哲学家之所以把情感视为理性思想的障碍，原因在于非表征性感受的影响。感受似乎不具有对象，这一事实按照某些观点意味着它们可以干扰理性思想。按照这些观点，理性思想是表征性的、因而指向对象的，它易受来自感受的干扰。然而感受本身是非理性的，因为它们源于身体的某种失衡，例如各种“体液”（humours）的失衡。这种失衡会消极地影响理性思想。一个例子是：一个人因被某种感受所左右而违背自己的明智判断行事。当然，这也是“激情”（passion）一词的基础，即我们“承受”（suffer）的东西，十七、十八世纪许多哲学家（如笛卡尔、斯宾诺莎和休谟）讨论过它。既然理性思想是许多哲学家的理想，而感受可以干扰这一理想，那么自然的结论似乎是主张消灭或至少控制感受，并因而控制情感。这正是哲学史上许多哲学家之所为，最著名的当然是斯多亚学派。虽然他们常承认情感包含一种认知的、因而潜在理性的成分，他们仍试图通过主张将该成分与情动分离来揭示它。当然，如果情动被从情感中清除，所剩的认知就不再是情感。"
- id: p3
  source: "There is a parallel between this Western view and a prejudice that attaches to Indian philosophy. The prejudice is that Indian philosophy, because of its soteriological nature with its emphasis on the attainment of liberation, is about freeing the mind from feelings and emotions because they constitute an attachment to the world (see MacKenzie 2023 for a discussion of the connection between emotion and liberation)[^mackenzie-2023]. While this is true of some schools of Indian philosophy, it is by no means a justified account of Indian philosophy as a whole. The different positions within Indian philosophy on this topic are more complex, as is the case with regard to Western philosophy. This article introduces some of the main positions regarding the emotions and their relation to cognitions in Indian philosophy. The sections of the article roughly correspond to the division into philosophical schools in classical Indian philosophy. Since arguably Buddhist philosophers have paid more attention to those phenomena that Western philosophers would classify as emotions than other Indian philosophers, the Buddhist account of the emotions will be discussed in more detail than the other accounts."
  step1: "这一西方观点与附着于印度哲学的一种偏见之间存在平行关系。这种偏见是：印度哲学由于其救度论（soteriological）性质、强调获得解脱，其要旨在于使心智摆脱感受与情感，因为它们构成对世界的执著（关于情感与解脱之关联的讨论见 MacKenzie 2023）[^mackenzie-2023]。虽然这对印度哲学的某些学派为真，它绝不是对整个印度哲学的合理说明。印度哲学内部在这一问题上的种种立场更为复杂，西方哲学的情形也是如此。本文介绍印度哲学中关于情感及其与认知之关系的若干主要立场。本文的各节大致对应于古典印度哲学中哲学学派的划分。由于可以论证地说，佛教哲学家比印度其他哲学家更关注那些西方哲学家会归类为情感的现象，佛教的情感说明将比其他说明得到更详细的讨论。"
  step2: "这一西方观点与附着于印度哲学的一种偏见之间存在平行关系。这种偏见是：印度哲学由于其救度论（soteriological）性质、强调获得解脱，其要旨在于使心智摆脱感受与情感，因为它们构成对世界的执著（关于情感与解脱之关联的讨论见 MacKenzie 2023）[^mackenzie-2023]。虽然这对印度哲学的某些学派为真，它绝不是对整个印度哲学的合理说明。印度哲学内部在这一问题上的种种立场更为复杂，西方哲学的情形也是如此。本文介绍印度哲学中关于情感及其与认知之关系的若干主要立场。本文的各节大致对应于古典印度哲学中哲学学派的划分。由于可以论证地说，佛教哲学家比印度其他哲学家更关注那些西方哲学家会归类为情感的现象，佛教的情感说明将比其他说明得到更详细的讨论。"
- id: p4
  source: "The discussion of this account will focus on the *Nyāya-sūtras*, Vātsyāyana’s *Nyāya-bhāṣya*, Uddyotakara’s *Nyāya-vārttika* and Jayanta Bhaṭṭa’s *Nyāya-mañjarī*. In addition, the *Vaiśeṣika-sūtras* together with Śaṅkara Miśra’s *Vaiśeṣika-sūtra-upaskāra* will be mentioned. The Nyāya-Vaiśeṣika account of the emotions involves a strict division into cognition (*jñāna*) and mental phenomena that include a feeling aspect, such as love or attraction (*rāga*) and aversion (*dveṣa*). One of the main reasons for this is the acceptance of the existence of a permanent immaterial self (*ātman*) by the Nyāya-Vaiśeṣika philosophers. According to their arguments, the *ātman* is a substance (*dravya*) which possesses several qualities (*guṇas*), such as cognition, desire, effort, aversion, pleasure and pain. This enumeration shows that there is no common Sanskrit term for the concept “emotion” in the Nyāya-Vaiśeṣika texts. One general term used is *saṃvedana* which translates as “feeling”, for example *sukha-saṃvedana* (feeling of pleasure)."
  step1: "对这一说明的讨论将集中于《正理经》（*Nyāya-sūtras*）、筏蹉衍那（Vātsyāyana）的《正理疏》（*Nyāya-bhāṣya*）、乌地陀迦罗（Uddyotakara）的《正理释论》（*Nyāya-vārttika*）与阇衍陀·跋陀（Jayanta Bhaṭṭa）的《正理花环》（*Nyāya-mañjarī*）。此外还将提到《胜论经》（*Vaiśeṣika-sūtras*）连同商羯罗·弥尸罗（Śaṅkara Miśra）的《胜论经疏》（*Vaiśeṣika-sūtra-upaskāra*）。正理—胜论对情感的这一说明涉及一种严格划分：一方面是认知（*jñāna*），另一方面是包含感受成分的心智现象，如爱或贪著（*rāga*）与厌离（*dveṣa*）。其主要原因之一是正理—胜论哲学家接受一种常存非物质的自我（*ātman*）的存在。按照他们的论证，*ātman* 是一种实体（*dravya*），具有若干性质（*guṇas*），如认知、欲望、努力、厌离、乐与苦。这一列举表明，在正理—胜论文本中并无一个通用的梵语词来对应“情感”（emotion）这一概念。一个使用的通用词是 *saṃvedana*，译作“感受”（feeling），例如 *sukha-saṃvedana*（乐的感受）。"
  step2: "对这一说明的讨论将集中于《正理经》（*Nyāya-sūtras*）、筏蹉衍那（Vātsyāyana）的《正理疏》（*Nyāya-bhāṣya*）、乌地陀迦罗（Uddyotakara）的《正理释论》（*Nyāya-vārttika*）与阇衍陀·跋陀（Jayanta Bhaṭṭa）的《正理花环》（*Nyāya-mañjarī*）。此外还将提到《胜论经》（*Vaiśeṣika-sūtras*）连同商羯罗·弥尸罗（Śaṅkara Miśra）的《胜论经疏》（*Vaiśeṣika-sūtra-upaskāra*）。正理—胜论对情感的这一说明涉及一种严格划分：一方面是认知（*jñāna*），另一方面是包含感受成分的心智现象，如爱或贪著（*rāga*）与厌离（*dveṣa*）。其主要原因之一是正理—胜论哲学家接受一种常存非物质的自我（*ātman*）的存在。按照他们的论证，*ātman* 是一种实体（*dravya*），具有若干性质（*guṇas*），如认知、欲望、努力、厌离、乐与苦。这一列举表明，在正理—胜论文本中并无一个通用的梵语词来对应“情感”（emotion）这一概念。一个使用的通用词是 *saṃvedana*，译作“感受”（feeling），例如 *sukha-saṃvedana*（乐的感受）。"
- id: p5
  source: "The important aspect of the Nyāya-Vaiśeṣika account is that the individual emotions, such as attachment and aversion are regarded as defects (*doṣas*) [NB 1.1.18] or impurities (*upadhā*) [VS and VSU 6.2.4]. These defects are the result of ignorance (*mithyājñāna*) and they give rise to actions that lead to the feeling of pleasure or pain. The reason why this is regarded as negative is that the feeling of pleasure and pain is responsible for our attachment to the world and, more importantly, for our attachment to the self and therefore presents an obstacle to liberation. For this reason, any emotion is deemed to have a negative influence on the individual. However, NV 1.1.22 mentions one exception, namely the desire for eternal pleasure and absence from pain which is final liberation. While, strictly speaking, a desire is not an emotion, it usually has the same negative effect because it results in attachment to the object of desire. The desire for eternal pleasure, however, is not detrimental to liberation; in fact it is a precondition for liberation."
  step1: "正理—胜论这一说明的重要方面在于：个别情感，如执著与厌离，被视为过患（*doṣas*）[NB 1.1.18]或杂质（*upadhā*）[VS and VSU 6.2.4]。这些过患是无明（*mithyājñāna*）的结果，它们引起导致乐或苦之感受的行动。之所以被视为消极，是因为乐与苦的感受要为我们对世界的执著负责，更重要的是为对自我的执著负责，因而对解脱构成障碍。基于此，任何情感都被认为对个体有消极影响。然而，NV 1.1.22 提到一个例外，即对永恒之乐与离苦的欲求，也就是最终的解脱。严格地说，欲求不是情感，但它通常有相同的消极效果，因为它导致对欲求对象的执著。然而对永恒之乐的欲求并不损害解脱；事实上它是解脱的一个前提。"
  step2: "正理—胜论这一说明的重要方面在于：个别情感，如执著与厌离，被视为过患（*doṣas*）[NB 1.1.18]或杂质（*upadhā*）[VS and VSU 6.2.4]。这些过患是无明（*mithyājñāna*）的结果，它们引起导致乐或苦之感受的行动。之所以被视为消极，是因为乐与苦的感受要为我们对世界的执著负责，更重要的是为对自我的执著负责，因而对解脱构成障碍。基于此，任何情感都被认为对个体有消极影响。然而，NV 1.1.22 提到一个例外，即对永恒之乐与离苦的欲求，也就是最终的解脱。严格地说，欲求不是情感，但它通常有相同的消极效果，因为它导致对欲求对象的执著。然而对永恒之乐的欲求并不损害解脱；事实上它是解脱的一个前提。"
- id: p6
  source: "The Nyāya-Vaiśeṣika philosophers clearly distinguish between pleasure (*sukha*) and pain (*duḥkha*) on the one hand and the experience of pleasure (*sukha-pratyaya*) and pain (*duḥkha-pratyaya*) on the other hand. Pain and pleasure are qualities of the soul but they need to be cognized by the self in order to be experienced. This means that cognition has a special status among the qualities of self: no other quality can be experienced without cognition."
  step1: "正理—胜论哲学家明确区分了乐（*sukha*）与苦（*duḥkha*）这两者，与对乐的体验（*sukha-pratyaya*）和对苦的体验（*duḥkha-pratyaya*）这两者。苦与乐是灵魂的性质，但它们需要被自我所认知才能被体验。这意味着认知在自我的诸性质中具有特殊地位：没有认知，任何其他性质都无法被体验。"
  step2: "正理—胜论哲学家明确区分了乐（*sukha*）与苦（*duḥkha*）这两者，与对乐的体验（*sukha-pratyaya*）和对苦的体验（*duḥkha-pratyaya*）这两者。苦与乐是灵魂的性质，但它们需要被自我所认知才能被体验。这意味着认知在自我的诸性质中具有特殊地位：没有认知，任何其他性质都无法被体验。"
- id: p7
  source: "Another reason why cognition is an important quality is that it is not necessarily a defect whereas the other qualities are always defects. The defects fall into 3 groups: i) attraction (*rāga*), ii) aversion (*dveṣa*) and iii) illusion (*moha*) [NS 4.1.3]. Among the first group we find love, selfishness and greed. The second group includes anger, jealousy, envy, malice and resentment. The Third group encompasses error, suspicion, pride and negligence. These groupings show that, according to the Nyāya-Vaiśeṣika account, there are no positive emotions. Even love, which is regarded as a positive emotion in many cultures, is ultimately a defect because all emotions lead to attachment and error."
  step1: "认知之所以是重要性质的另一个原因，在于它不一定是一种缺陷，而其他性质则总是缺陷。缺陷分为三组：i）贪著（*rāga*）、ii）厌离（*dveṣa*）与 iii）迷惑（*moha*）[NS 4.1.3]。第一组包括爱、自私与贪婪。第二组包括愤怒、嫉妒、妒忌、恶意与怨恨。第三组包括错误、怀疑、骄傲与疏忽。这些分组表明，按照正理—胜论的说明，不存在积极的情感。即使是爱——它在许多文化中被视为积极情感——最终也是一种缺陷，因为一切情感都导致执著与错误。"
  step2: "认知之所以是重要性质的另一个原因，在于它不一定是一种缺陷，而其他性质则总是缺陷。缺陷分为三组：i）贪著（*rāga*）、ii）厌离（*dveṣa*）与 iii）迷惑（*moha*）[NS 4.1.3]。第一组包括爱、自私与贪婪。第二组包括愤怒、嫉妒、妒忌、恶意与怨恨。第三组包括错误、怀疑、骄傲与疏忽。这些分组表明，按照正理—胜论的说明，不存在积极的情感。即使是爱——它在许多文化中被视为积极情感——最终也是一种缺陷，因为一切情感都导致执著与错误。"
- id: p8
  source: "The opposite of all three types of defect is described in NB 4.1.4 as knowledge of truth (*tattvajñāna*), right knowledge (*samyaṅmati*), truthful cognition (*āryaprajñā*) and right apprehension (*sambodha*). This shows that, according to the Nyāya-Vaiśeṣika philosophers, emotions are defects because they prevent our thinking from turning into right knowledge. This knowledge can thus only be had if we eliminate these defects and thereby our emotions."
  step1: "所有三种缺陷的对立面，在 NB 4.1.4 中被描述为真理之知（*tattvajñāna*）、正知（*samyaṅmati*）、真实认知（*āryaprajñā*）与正觉（*sambodha*）。这表明，按照正理—胜论哲学家，情感是缺陷，因为它们阻止我们的思想转化为正知。因此，只有消除这些缺陷，从而消除我们的情感，才能获得这种知识。"
  step2: "所有三种缺陷的对立面，在 NB 4.1.4 中被描述为真理之知（*tattvajñāna*）、正知（*samyaṅmati*）、真实认知（*āryaprajñā*）与正觉（*sambodha*）。这表明，按照正理—胜论哲学家，情感是缺陷，因为它们阻止我们的思想转化为正知。因此，只有消除这些缺陷，从而消除我们的情感，才能获得这种知识。"
- id: p9
  source: "According to NS 4.1.6, illusion is the worst defect because without it the others are not going to appear. This means that one has to be under an illusion already in order to think that the object of one’s attraction provides pleasure and the object of one’s aversion pain. In fact, NS and NB 4.1.58 state that ordinary pleasure should be regarded as pain:"
  step1: "按照 NS 4.1.6，迷惑是最严重的缺陷，因为没有它，其他缺陷就不会出现。这意味着，一个人必须先处于迷惑之中，才会认为其贪著的对象带来乐、其厌离的对象带来苦。事实上，NS 与 NB 4.1.58 指出，普通的乐应被视为苦："
  step2: "按照 NS 4.1.6，迷惑是最严重的缺陷，因为没有它，其他缺陷就不会出现。这意味着，一个人必须先处于迷惑之中，才会认为其贪著的对象带来乐、其厌离的对象带来苦。事实上，NS 与 NB 4.1.58 指出，普通的乐应被视为苦："
- id: p10
  source: "> The ordinary man, addicted to pleasure, regards pleasure as the highest end of man, and feels that there is nothing better than pleasure; and hence when pleasure has been attained, he feels happy and contented, feeling that all he had to attain had been attained; and under the influence of illusion, he becomes attached to the pleasure, as also to the things that bring about its accomplishment; becoming so attached, he makes an attempt to obtain the pleasure; and while he is trying for it, there come down on him several kinds of pain, in the form of birth, old age, disease, death, the contact of disagreeable things, separation from agreeable things, the non-fulfilment of desires and so forth; and yet all these several kinds of pain he regards as ‘pleasure.’ In fact pain is a necessary factor in pleasure; without suffering some pain no pleasure can be obtained; hence as leading to pleasure, this pain is regarded by the man as pleasure; and such a man, having his mind obsessed by this notion of ‘pleasure’, never escapes from metempsychosis, which consists of a running series of births and deaths. And it is as an antidote of this notion of pleasure that we have the teaching that all this should be looked upon as ‘pain.’ [NB 4.1.58, p. 1553]"
  step1: "耽于乐之凡夫，以乐为人之最高目的，觉得无物胜于乐；故得乐时，他感到快乐与满足，觉得所当得者皆已得之；在迷惑影响下，他执著于乐，也执著于促成其实现之物；既已执著，他便试图获得乐；当他求乐时，种种苦降临其身，以生、老、病、死、怨憎会、爱别离、欲不得等形式出现；然而他仍将这一切苦视为“乐”。事实上，苦是乐的必要因素；不经历某些苦，便不能获得乐；故以此苦导向乐，此人便视苦为乐；这样的人心智被这种“乐”之观念所占据，永不脱离轮回，轮回即一系列相续的生与死。作为对这种乐之观念的解毒剂，我们有这样的教导：这一切都应被视为“苦”。[NB 4.1.58, p. 1553]"
  step2: "耽于乐之凡夫，以乐为人之最高目的，觉得无物胜于乐；故得乐时，他感到快乐与满足，觉得所当得者皆已得之；在迷惑影响下，他执著于乐，也执著于促成其实现之物；既已执著，他便试图获得乐；当他求乐时，种种苦降临其身，以生、老、病、死、怨憎会、爱别离、欲不得等形式出现；然而他仍将这一切苦视为“乐”。事实上，苦是乐的必要因素；不经历某些苦，便不能获得乐；故以此苦导向乐，此人便视苦为乐；这样的人心智被这种“乐”之观念所占据，永不脱离轮回，轮回即一系列相续的生与死。作为对这种乐之观念的解毒剂，我们有这样的教导：这一切都应被视为“苦”。[NB 4.1.58, p. 1553]"
- id: p11
  source: "This quote shows that ultimately the feeling of pleasure is an illusion and that our ordinary existence is necessarily beset with pain. This demonstrates the link between feeling and error, according to the Nyāya-Vaiśeṣika philosophers. Both pleasure and pain are two factors that are responsible for our notion of “I” that prevents us from attaining final liberation. Therefore, the pursuit of pleasure is futile and ought to be abandoned in favour of final liberation."
  step1: "这一引文表明，归根结底，对乐的体验是一种迷惑，我们的日常存在必然被苦所困扰。这展示了正理—胜论哲学家所认为的感受与错误之间的关联。乐与苦两者都是造成我们“我”这一观念的两种因素，而正是这种观念阻止我们获得最终的解脱。因此，追求乐是徒劳的，应当放弃，转而追求最终的解脱。"
  step2: "这一引文表明，归根结底，对乐的体验是一种迷惑，我们的日常存在必然被苦所困扰。这展示了正理—胜论哲学家所认为的感受与错误之间的关联。乐与苦两者都是造成我们“我”这一观念的两种因素，而正是这种观念阻止我们获得最终的解脱。因此，追求乐是徒劳的，应当放弃，转而追求最终的解脱。"
- id: p12
  source: "For the Nyāya-Vaiśeṣika philosophers, pleasure and pain are not forms of cognition because they have different causes than cognitions [VS and VSU 10.1.5–6]. This means that we can have a cognition without a feeling and we can also have a feeling without a cognition. In addition, they are experienced differently [NM, vol. 1, p. 118]. This separation between cognitions and feelings, together with the view that feelings are defects that disturb cognitions, means that feelings are regarded as purely negative. They lead to an attachment to the world which causes a sense of self and this sense of self provides an obstacle to liberation. Wright (2021), however, points out the role of emotion in the formation of a common identity among later Nyāya thinkers in Bengal."
  step1: "对于正理—胜论哲学家来说，乐与苦不是认知的形式，因为它们的因不同于认知的因[VS and VSU 10.1.5–6]。这意味着我们可以有认知而无感受，也可以有感受而无认知。此外，它们被体验的方式也不同[NM, vol. 1, p. 118]。认知与感受之间的这种分离，连同感受是干扰认知之缺陷的观点，意味着感受被视为纯粹消极的。它们导致对世界的执著，这种执著造成一种自我感，而这种自我感为解脱构成障碍。然而，Wright（2021）指出了情感在孟加拉后来的正理论思想家形成共同认同中的作用。"
  step2: "对于正理—胜论哲学家来说，乐与苦不是认知的形式，因为它们的因不同于认知的因[VS and VSU 10.1.5–6]。这意味着我们可以有认知而无感受，也可以有感受而无认知。此外，它们被体验的方式也不同[NM, vol. 1, p. 118]。认知与感受之间的这种分离，连同感受是干扰认知之缺陷的观点，意味着感受被视为纯粹消极的。它们导致对世界的执著，这种执著造成一种自我感，而这种自我感为解脱构成障碍。然而，Wright（2021）指出了情感在孟加拉后来的正理论思想家形成共同认同中的作用。"
- id: p13
  source: "The Nyāya-Vaiśeṣika view shows similarities with the received view of the emotions in Western philosophy with regard to the point that feelings are a disturbance of cognition. However, in many Western accounts cognition is regarded as an end in itself because it coincides with the ideal of rational thinking, whereas according to the Nyāya-Vaiśeṣika philosophers cognition is not an end in itself. Rather, it is supposed to lead to the conclusion that final liberation is the ultimate aim and final liberation means the end of cognition."
  step1: "正理—胜论的观点在感受是认知之干扰这一点上，与西方哲学中关于情感的通行的观点相似。然而，在许多西方说明中，认知因其与理性思想之理想相合而被视为目的本身，而按照正理—胜论哲学家，认知不是目的本身。相反，它应当引向这样的结论：最终的解脱是终极目的，而最终的解脱意味着认知的终结。"
  step2: "正理—胜论的观点在感受是认知之干扰这一点上，与西方哲学中关于情感的通行的观点相似。然而，在许多西方说明中，认知因其与理性思想之理想相合而被视为目的本身，而按照正理—胜论哲学家，认知不是目的本身。相反，它应当引向这样的结论：最终的解脱是终极目的，而最终的解脱意味着认知的终结。"
- id: p14
  source: "In his commentary on the *Brahma-sūtras*, Śaṃkara makes the well-known argument that the self (*ātman*) exists because its existence is the only way to account for the idea of a subject of experience. This argument relies on the idea that the self has certain mental qualities, which are termed *manas* (mind), *buddhi* (intellect), *vijñāna* (cognition) or *citta* (consciousness), depending on what mental function is ascribed to them. Different mental functions are doubt, resolution, egoism or recollection [BSBh 2.4.6]. These mental functions, regardless of how they are referred to, have several qualities or modifications, including desire, imagination, doubt, faith, want of faith, memory, forgetfulness, shame, reflection and fear [BSBh 2.3.32] as well as love, aversion, pleasure and pain [BSBh 2.3.29]. This means that, according to Śaṃkara, the mind’s cognitive and emotional abilities are the qualities of our mental functioning which is different from the self."
  step1: "在其对《梵经》（*Brahma-sūtras*）的注释中，商羯罗（Śaṃkara）提出了一个著名的论证：自我（*ātman*）存在，因为它的存在是说明一个体验之主体的观念的唯一途径。这一论证依赖于这样的观念：自我具有某些心智性质，这些性质被称为意（*manas*）、觉（*buddhi*）、识（*vijñāna*）或心（*citta*），视赋予它们何种心智功能而定。不同的心智功能是疑惑、决断、我慢或回忆[BSBh 2.4.6]。这些心智功能，无论被如何指称，都具有若干性质或变状，包括欲望、想象、疑惑、信仰、无信仰、记忆、遗忘、羞愧、反思与恐惧[BSBh 2.3.32]，以及爱、厌离、乐与苦[BSBh 2.3.29]。这意味着，按照商羯罗，心的认知能力与情感能力是我们的心智运作的性质，而这与自我不同。"
  step2: "在其对《梵经》（*Brahma-sūtras*）的注释中，商羯罗（Śaṃkara）提出了一个著名的论证：自我（*ātman*）存在，因为它的存在是说明一个体验之主体的观念的唯一途径。这一论证依赖于这样的观念：自我具有某些心智性质，这些性质被称为意（*manas*）、觉（*buddhi*）、识（*vijñāna*）或心（*citta*），视赋予它们何种心智功能而定。不同的心智功能是疑惑、决断、我慢或回忆[BSBh 2.4.6]。这些心智功能，无论被如何指称，都具有若干性质或变状，包括欲望、想象、疑惑、信仰、无信仰、记忆、遗忘、羞愧、反思与恐惧[BSBh 2.3.32]，以及爱、厌离、乐与苦[BSBh 2.3.29]。这意味着，按照商羯罗，心的认知能力与情感能力是我们的心智运作的性质，而这与自我不同。"
- id: p15
  source: "At the heart of Śaṃkara’s teaching lies the notion that the true knowledge of the *ātman* is knowledge that is devoid of any of the above-mentioned qualities. In this respect one can find a similarity between the Nyāya school and Śaṃkara because for both of them cognitive and emotional qualities are due to false knowledge or ignorance of the true self. This means that the removal of ignorance results in a removal of emotions as well as cognitions. However, it is clear that the emotions present the main obstacle for the realization of the true self because desire and aversion lead to attachment and clinging which cause us to neglect the search for liberation that is crucial to Vedānta teaching. So, while Śaṃkara distinguishes between what Western philosophers would call cognitions and emotions, he does not present a purely cognitive state of mind without emotions as the ideal state of mind because such a state would be impossible. By definition, any purely cognitive state of mind presupposes the existence of a mind or intellect. For Śaṃkara, however, the problem is that a mind will always have certain qualities that would be called emotive in Western philosophy, such as desire, aversion, hatred, pleasure or pain. So, as long there are cognitions, there will also be emotions. Therefore, both must be eliminated in order for the self to attain liberation. On this point, Śaṃkara agrees with the Nyāya-Vaiśeṣika philosophers. While Śaṃkara distinguishes between emotions and cognitions, his distinction is not as pronounced as that of the Nyāya-Vaiśeṣika philosophers. He regards both as qualities of the mind or intellect."
  step1: "商羯罗教导的核心在于这样的观念：对*ātman*的真正知识，是摆脱上述任何性质的知识。在这方面，可以发现正理学派与商羯罗之间的相似性，因为对他们两者来说，认知性质与情感性质都源于对真正自我的错误知识或无知。这意味着，去除无知导致去除情感以及认知。然而，显然情感是体认真实自我的主要障碍，因为欲望与厌离导致执著与黏附，这使我们忽视了对吠檀多教导至关重要的解脱之寻求。所以，虽然商羯罗区分了西方哲学家所谓认知与情感，他并不把一种纯粹认知的、无情感的心境呈现为理想的心境，因为这样的心境是不可能的。按照定义，任何纯粹认知的心境都以心或觉的存在为前提。然而，对于商羯罗来说，问题在于心总会具有某些在西方哲学中会被称为情感的性质，如欲望、厌离、憎恨、乐或苦。所以，只要有认知，就会有情感。因此，为了自我获得解脱，两者都必须被消除。在这一点上，商羯罗与正理—胜论哲学家一致。虽然商羯罗区分情感与认知，但他的区分不像正理—胜论哲学家那样显著。他把两者都视为心或觉的性质。"
  step2: "商羯罗教导的核心在于这样的观念：对*ātman*的真正知识，是摆脱上述任何性质的知识。在这方面，可以发现正理学派与商羯罗之间的相似性，因为对他们两者来说，认知性质与情感性质都源于对真正自我的错误知识或无知。这意味着，去除无知导致去除情感以及认知。然而，显然情感是体认真实自我的主要障碍，因为欲望与厌离导致执著与黏附，这使我们忽视了对吠檀多教导至关重要的解脱之寻求。所以，虽然商羯罗区分了西方哲学家所谓认知与情感，他并不把一种纯粹认知的、无情感的心境呈现为理想的心境，因为这样的心境是不可能的。按照定义，任何纯粹认知的心境都以心或觉的存在为前提。然而，对于商羯罗来说，问题在于心总会具有某些在西方哲学中会被称为情感的性质，如欲望、厌离、憎恨、乐或苦。所以，只要有认知，就会有情感。因此，为了自我获得解脱，两者都必须被消除。在这一点上，商羯罗与正理—胜论哲学家一致。虽然商羯罗区分情感与认知，但他的区分不像正理—胜论哲学家那样显著。他把两者都视为心或觉的性质。"
- id: p16
  source: "There is an interesting contrast between Advaita Vedānta and Viśiṣṭādvaita Vedānta, where the latter distinguishes between good and bad emotions. Good emotions are those that can serve as preliminary steps on the path to salvation (see Freschi 2021)[^freschi-2021]. “[O]nly those emotions which are obstacles for the attainment of God need to be overcome” (Freschi 2021, p. 51)[^freschi-2021]."
  step1: "不二吠檀多（Advaita Vedānta）与制限不二吠檀多（Viśiṣṭādvaita Vedānta）之间有一个有趣的对比，后者区分好的与坏的情感。好的情感是那些可以作为通向救赎之路的初步阶梯的情感（参见 Freschi 2021）[^freschi-2021]。“只有那些对获得神构成障碍的情感才需要被克服”（Freschi 2021, p. 51）[^freschi-2021]。"
  step2: "不二吠檀多（Advaita Vedānta）与制限不二吠檀多（Viśiṣṭādvaita Vedānta）之间有一个有趣的对比，后者区分好的与坏的情感。好的情感是那些可以作为通向救赎之路的初步阶梯的情感（参见 Freschi 2021）[^freschi-2021]。“只有那些对获得神构成障碍的情感才需要被克服”（Freschi 2021, p. 51）[^freschi-2021]。"
- id: p17
  source: "Unlike the Nyāya-Vaiśeṣika and Vedānta accounts of the emotions, the Sāṃkhya-Yoga account does not draw a fundamental distinction between feelings and cognitions. The reason for this is that the Sāṃkhya account rests on the division between *puruṣa* and *prakṛti*. The former is pure consciousness and does not contain any cognitions or feelings whereas *prakṛti* is primordial matter and has the three qualities (*guṇas*) *sattva*, *rajas* and *tamas*, which are aligned with different feelings: *sattva* with pleasure (*sukha*), *rajas* with pain (*duḥkha*) and *tamas* with confusion or illusion (*moha*). The terms *sattva*, *rajas* and *tamas* are difficult to translate but are sometimes rendered as “reflection”, “activity” and “inertia”. The important point about this dualist structure for the emotions is that, according to the Sāṃkhya account, both cognition and feeling belong to the realm of *prakṛti* which means that they are material. This stands in contrast to many dualist accounts in the history of Western philosophy, for example that of Descartes, according to which cognitions are immaterial whereas emotions or passions are material, thus making it easier to oppose the two. Larson and Bhattacharya (1987) summarize the difference between Western and Sāṃkhya dualism in the following way:"
  step1: "与正理—胜论和吠檀多的情感说明不同，数论—瑜伽的说明并不在感受与认知之间划出根本的区分。原因在于，数论的说明建立于*puruṣa*（神我）与*prakṛti*（原质）的区分之上。前者是纯粹的意识，不包含任何认知或感受，而*prakṛti*是原初物质，具有三种性质（*guṇas*，德）：*sattva*（喜）、*rajas*（忧）与*tamas*（暗），它们与不同的感受相对应：*sattva* 与乐（*sukha*）对应，*rajas* 与苦（*duḥkha*）对应，*tamas* 与困惑或迷惑（*moha*）对应。*sattva*、*rajas* 与*tamas* 这三个词难以翻译，但有时被译为“反射”“活动”与“惰性”。这一二元结构对于情感的重要之处在于，按照数论的说明，认知与感受都属于*prakṛti*的领域，这意味着它们是物质性的。这与西方哲学史上的许多二元论说明（例如笛卡尔的说明）形成对照，在那些说明中认知是非物质的，而情感或激情是物质性的，因而更容易把两者对立起来。Larson and Bhattacharya（1987）以下列方式概括了西方二元论与数论二元论之间的区别："
  step2: "与正理—胜论和吠檀多的情感说明不同，数论—瑜伽的说明并不在感受与认知之间划出根本的区分。原因在于，数论的说明建立于*puruṣa*（神我）与*prakṛti*（原质）的区分之上。前者是纯粹的意识，不包含任何认知或感受，而*prakṛti*是原初物质，具有三种性质（*guṇas*，德）：*sattva*（喜）、*rajas*（忧）与*tamas*（暗），它们与不同的感受相对应：*sattva* 与乐（*sukha*）对应，*rajas* 与苦（*duḥkha*）对应，*tamas* 与困惑或迷惑（*moha*）对应。*sattva*、*rajas* 与*tamas* 这三个词难以翻译，但有时被译为“反射”“活动”与“惰性”。这一二元结构对于情感的重要之处在于，按照数论的说明，认知与感受都属于*prakṛti*的领域，这意味着它们是物质性的。这与西方哲学史上的许多二元论说明（例如笛卡尔的说明）形成对照，在那些说明中认知是非物质的，而情感或激情是物质性的，因而更容易把两者对立起来。Larson and Bhattacharya（1987）以下列方式概括了西方二元论与数论二元论之间的区别："
- id: p18
  source: "> [A]ccording to Sāṃkhya philosophy, the experiences of intellect, egoity, and mind, and the “raw feels” such as frustration or satisfaction—or, in other words, what conventional dualists would consider to be “inherently private”—are simply subtle reflections of primordial materiality, a primordial materiality undergoing continuous transformation by means of its constituent unfolding as spontaneous activity, reflective discerning, and determinate formulation. Thus, the modern reductive materialists’ claim that “sensations are identical with certain brain processes” would have a peculiar counterpart in the Sāṃkhya claim that “awarenesses” [Sanskrit terms omitted] are identical with certain *guṇa* modalities. (Larson and Bhattacharya 1987, p. 76)[^larson-1987]"
  step1: "按照数论哲学，觉、我慢与意（mind）的体验，以及诸如挫折或满足这样的“原始感受”（raw feels）——或者换句话说，常规二元论者会认为“内在地私密”的东西——只不过是原初物质性的细微反射，一种经由其构成性展开（作为自发活动、反思性辨别与确定性构型）而持续转化的原初物质性。因此，现代还原论唯物论者关于“感觉与某些脑过程相同”的主张，会在数论“各种‘觉知’[梵语词从略]与某些 *guṇa*（德）样态相同”的主张中有一个奇特的对应物。（Larson and Bhattacharya 1987, p. 76）[^larson-1987]"
  step2: "按照数论哲学，觉、我慢与意（mind）的体验，以及诸如挫折或满足这样的“原始感受”（raw feels）——或者换句话说，常规二元论者会认为“内在地私密”的东西——只不过是原初物质性的细微反射，一种经由其构成性展开（作为自发活动、反思性辨别与确定性构型）而持续转化的原初物质性。因此，现代还原论唯物论者关于“感觉与某些脑过程相同”的主张，会在数论“各种‘觉知’[梵语词从略]与某些 *guṇa*（德）样态相同”的主张中有一个奇特的对应物。（Larson and Bhattacharya 1987, p. 76）[^larson-1987]"
- id: p19
  source: "The relationship between *puruṣa* and *prakṛti* in Sāṃkhya philosophy is complex: *puruṣa* as pure consciousness is characterized by inaction (*akartṛbhāva*) and pure presence (*sākṣitva*). It does not stand in any relation with *prakṛti*, which comprises the material world, including mental processes. Nevertheless, *puruṣa* forms the foundation of *prakṛti*. This means that *puruṣa* provides the meaning for all material processes. Thus *prakṛti* exists for *puruṣa* and it is only because of this that the world is not simply a collection of meaningless physical processes. In addition, the intellect as part of *prakṛti* is supposed to realize that it is not consciousness and it is to become aware of pure consciousness as the way to liberation. This means that the intellect is supposed to understand the contentless pure consciousness but of course in order to do so it would have to become contentless itself, which seems impossible. Therefore, the intellect can only achieve this in an indirect way without cognition. Instead, we require meditative or yogic exercises to understand the difference between *puruṣa* and *prakṛti*."
  step1: "数论哲学中*puruṣa*与*prakṛti*的关系是复杂的：*puruṣa*作为纯粹的意识，以不活动（*akartṛbhāva*）与纯粹在场（*sākṣitva*）为特征。它不与*prakṛti*（包括物质世界与心理过程）发生任何关系。然而，*puruṣa*构成*prakṛti*的基础。这意味着*puruṣa*为一切物质过程提供意义。因此，*prakṛti*为*puruṣa*而存在，也正因如此，世界才不只是无意义的物理过程的集合。此外，作为*prakṛti*一部分的觉，应当认识到它不是意识，并应当觉知纯粹的意识，作为通向解脱的途径。这意味着，觉应当理解无内容的纯粹意识；但当然，要做到这一点，它自身必须变成无内容的，这似乎不可能。因此，觉只能以间接的方式、无需认知而达成这一点。相反，我们需要禅定或瑜伽的修习来理解*puruṣa*与*prakṛti*之间的区别。"
  step2: "数论哲学中*puruṣa*与*prakṛti*的关系是复杂的：*puruṣa*作为纯粹的意识，以不活动（*akartṛbhāva*）与纯粹在场（*sākṣitva*）为特征。它不与*prakṛti*（包括物质世界与心理过程）发生任何关系。然而，*puruṣa*构成*prakṛti*的基础。这意味着*puruṣa*为一切物质过程提供意义。因此，*prakṛti*为*puruṣa*而存在，也正因如此，世界才不只是无意义的物理过程的集合。此外，作为*prakṛti*一部分的觉，应当认识到它不是意识，并应当觉知纯粹的意识，作为通向解脱的途径。这意味着，觉应当理解无内容的纯粹意识；但当然，要做到这一点，它自身必须变成无内容的，这似乎不可能。因此，觉只能以间接的方式、无需认知而达成这一点。相反，我们需要禅定或瑜伽的修习来理解*puruṣa*与*prakṛti*之间的区别。"
- id: p20
  source: "In spite of the fact that cognition and emotion are both material, emotions have a negative connotation in Sāṃkhya philosophy. In this regard the account is similar to that of many Western philosophers. However, in Western philosophy the idea is to have cognition free from emotion. By contrast, the Sāṃkhya philosophers do not think of cognition as a desirable end in itself. Rather, their idea is that ultimate liberation lies in the recognition of *puruṣa* by *prakṛti*. This means that our everyday experience of ourselves as conscious intellects with cognitions and emotions is an obstacle on the way to realizing what pure contentless consciousness is. In fact, Sāṃkhya philosophers argue that our experience of ourselves as conscious beings is a mistake that needs to be rectified in order to achieve liberation. This realization is extremely difficult to achieve and therefore Sāṃkhya proposes first of all to clear the mind of the passions [SSu 2.15] by separating them from cognition and then to free the mind from cognition in order to comprehend contentless consciousness. So emotions or passions are regarded as negative but they are not contrasted with cognitions because cognitions themselves are supposed to be overcome in order to understand *puruṣa*."
  step1: "尽管认知与情感都是物质性的，情感在数论哲学中仍具有消极的内涵。在这方面，这一说明与许多西方哲学家的说明相似。然而，在西方哲学中，观念是拥有摆脱了情感的认知。相比之下，数论哲学家并不认为认知是值得向往的目的本身。相反，他们的观念是，最终的解脱在于*prakṛti*对*puruṣa*的体认。这意味着，我们日常把自己体验为具有认知与情感的、有意识的觉知者，这本身是通向体认纯粹无内容之意识之路上的障碍。事实上，数论哲学家论证，我们把自己体验为有意识的存在者，这是一个为了获得解脱而需要纠正的错误。这种体认极难达成，因此数论首先提议清除心智中的激情（passions）[SSu 2.15]，将它们与认知分离，然后再使心智摆脱认知，以便理解无内容的意识。所以，情感或激情被视为消极的，但它们并不与认知相对立，因为认知本身也被认为应当被克服，以便理解*puruṣa*。"
  step2: "尽管认知与情感都是物质性的，情感在数论哲学中仍具有消极的内涵。在这方面，这一说明与许多西方哲学家的说明相似。然而，在西方哲学中，观念是拥有摆脱了情感的认知。相比之下，数论哲学家并不认为认知是值得向往的目的本身。相反，他们的观念是，最终的解脱在于*prakṛti*对*puruṣa*的体认。这意味着，我们日常把自己体验为具有认知与情感的、有意识的觉知者，这本身是通向体认纯粹无内容之意识之路上的障碍。事实上，数论哲学家论证，我们把自己体验为有意识的存在者，这是一个为了获得解脱而需要纠正的错误。这种体认极难达成，因此数论首先提议清除心智中的激情（passions）[SSu 2.15]，将它们与认知分离，然后再使心智摆脱认知，以便理解无内容的意识。所以，情感或激情被视为消极的，但它们并不与认知相对立，因为认知本身也被认为应当被克服，以便理解*puruṣa*。"
- id: p21
  source: "In the *Yogasūtras*, Patañjali provides a method for understanding the difference between *puruṣa* and *prakṛti* via a series of exercises that aim at stripping away all of the disturbing influences from the mind, including what Western philosophers would classify as emotions. In fact, Patañjali argues that the mind is affected by afflictions (*kleśas*) that keep it from becoming clear about the difference between *puruṣa* and *prakṛti*. In YS 2.3, Patañjali lists the afflictions:"
  step1: "在《瑜伽经》（*Yogasūtras*）中，波颠阇利（Patañjali）提供了一种通过一系列旨在剥除心智中一切干扰性影响（包括西方哲学家会归类为情感的东西）的修习，来理解*puruṣa*与*prakṛti*之区别的方法。事实上，波颠阇利论证，心受到烦恼（*kleśas*）的影响，这些烦恼使它无法明辨*puruṣa*与*prakṛti*的区别。在 YS 2.3 中，波颠阇利列举了这些烦恼："
  step2: "在《瑜伽经》（*Yogasūtras*）中，波颠阇利（Patañjali）提供了一种通过一系列旨在剥除心智中一切干扰性影响（包括西方哲学家会归类为情感的东西）的修习，来理解*puruṣa*与*prakṛti*之区别的方法。事实上，波颠阇利论证，心受到烦恼（*kleśas*）的影响，这些烦恼使它无法明辨*puruṣa*与*prakṛti*的区别。在 YS 2.3 中，波颠阇利列举了这些烦恼："
- id: p22
  source: "> Ignorance (*avidyā*), egoism (*asmitā*), attachment (*rāga*), aversion (*dveṣa*) and adherence [to mundane existence] (*abhiniveśa*) are afflictions. [YS 2.3]"
  step1: "无明（*avidyā*）、我慢（*asmitā*）、执著（*rāga*）、厌离（*dveṣa*）与[对世俗存在的]执持（*abhiniveśa*）都是烦恼。[YS 2.3]"
  step2: "无明（*avidyā*）、我慢（*asmitā*）、执著（*rāga*）、厌离（*dveṣa*）与[对世俗存在的]执持（*abhiniveśa*）都是烦恼。[YS 2.3]"
- id: p23
  source: "These afflictions need to be removed in order to achieve liberation. Unlike in many Western accounts of the emotions, the removal of the afflictions is not supposed to lead to a form of rational thinking that is divorced from any emotion. Rather, rational thinking itself needs to be overcome, in order to achieve true liberation by separating *puruṣa* from *prakṛti*."
  step1: "为了获得解脱，这些烦恼需要被去除。与许多西方关于情感的说明不同，去除烦恼并不应当导致一种与任何情感相分离的理性思考形式。相反，理性思考本身也需要被克服，以便通过把*puruṣa*从*prakṛti*中分离出来而获得真正的解脱。"
  step2: "为了获得解脱，这些烦恼需要被去除。与许多西方关于情感的说明不同，去除烦恼并不应当导致一种与任何情感相分离的理性思考形式。相反，理性思考本身也需要被克服，以便通过把*puruṣa*从*prakṛti*中分离出来而获得真正的解脱。"
- id: p24
  source: "The main reason why emotions such as attachment and aversion are regarded as afflictions is that they lead to a desire to change our circumstances and therefore to an attachment to the world. This attachment, however, is precisely what is to be given up in order to achieve liberation. So, Patañjali and his commentators argue that emotions lead to desire and therefore have to be given up as one of the root causes of ignorance that causes attachment to the world. Only then can the mind discriminate between *puruṣa* and *prakṛti*."
  step1: "诸如执著与厌离这样的情感之所以被视为烦恼，主要原因在于它们导致改变处境的欲望，并因此导致对世界的执著。然而，这种执著恰恰是为了获得解脱而应当放弃的东西。所以，波颠阇利及其注释者论证，情感导致欲望，因此必须作为造成对世界之执著的无明的根源之一而予以放弃。只有这样，心才能辨别*puruṣa*与*prakṛti*。"
  step2: "诸如执著与厌离这样的情感之所以被视为烦恼，主要原因在于它们导致改变处境的欲望，并因此导致对世界的执著。然而，这种执著恰恰是为了获得解脱而应当放弃的东西。所以，波颠阇利及其注释者论证，情感导致欲望，因此必须作为造成对世界之执著的无明的根源之一而予以放弃。只有这样，心才能辨别*puruṣa*与*prakṛti*。"
- id: p25
  source: "One interesting parallel between Western accounts of the emotions and Patañjali is the use of the “colouring” (*uparāga*) or “coloured” (*uparaktam*) metaphor with regard to the mind [e.g., in YS 4.23]. Patañjali claims that the mind is “coloured” by all of the objects it knows, including cognitions and emotions. This means that in order to understand the difference between itself and pure consciousness (*puruṣa*), it has to free itself from these colourings and become pure. Only then can it recognize that it is different from the *puruṣa* which cannot be known in itself because it cannot become an object of the mind. Vyāsa, in his commentary on YS 4.23, explains that the mind itself is an object that appears as a conscious subject which is why many philosophers mistake it for the subject. However, once the mind becomes empty of all objects the difference between the mind and *puruṣa* reveals itself. Vyāsa makes the argument that a mind which is empty of all objects can still know itself and thus it would have to become an object in the mind, i.e., itself. In other words, cognition would have to be cognized by itself. This, however, is impossible, according to him. Instead, *puruṣa* shows itself as that which makes cognition possible. In this sense, *puruṣa* can be compared to Husserl’s idea of the “transcendental ego”. So, *puruṣa* can only reveal itself indirectly by emptying the mind of all cognitions, including emotions. This means that emotions are regarded as an obstacle to liberation but at the same time, they share this designation with other cognitions of the world."
  step1: "西方关于情感的说明与波颠阇利之间一个有趣的平行之处，在于对心的“着色”（*uparāga*）或“被着色”（*uparaktam*）隐喻的使用[例如，见 YS 4.23]。波颠阇利主张，心被它所知的一切对象所“着色”，包括认知与情感。这意味着，为了理解它自身与纯粹意识（*puruṣa*）之间的区别，它必须摆脱这些着色，变成纯粹的。只有这样，它才能认识到它与*puruṣa*不同，而*puruṣa*本身不能被认识，因为它不能成为心的对象。毗耶娑（Vyāsa）在其对 YS 4.23 的注释中解释说，心本身是一个作为有意识主体而显现的对象，这就是为什么许多哲学家误认它为主体。然而，一旦心变得空无一切对象，心与*puruṣa*之间的区别便显现出来。毗耶娑提出这样一个论证：一个空无一切对象的心仍能认识它自身，因此它必须成为心中的一个对象，即它自身。换句话说，认知必须被其自身所认知。然而，按照他的说法，这是不可能的。相反，*puruṣa*显示自身为使认知成为可能的东西。在这种意义上，*puruṣa*可与胡塞尔（Husserl）的“先验自我”观念相比。所以，*puruṣa*只能通过使心空无一切认知（包括情感）来间接地显示自身。这意味着情感被视为对解脱的障碍，但同时它们与对世界的其他认知共享这一称号。"
  step2: "西方关于情感的说明与波颠阇利之间一个有趣的平行之处，在于对心的“着色”（*uparāga*）或“被着色”（*uparaktam*）隐喻的使用[例如，见 YS 4.23]。波颠阇利主张，心被它所知的一切对象所“着色”，包括认知与情感。这意味着，为了理解它自身与纯粹意识（*puruṣa*）之间的区别，它必须摆脱这些着色，变成纯粹的。只有这样，它才能认识到它与*puruṣa*不同，而*puruṣa*本身不能被认识，因为它不能成为心的对象。毗耶娑（Vyāsa）在其对 YS 4.23 的注释中解释说，心本身是一个作为有意识主体而显现的对象，这就是为什么许多哲学家误认它为主体。然而，一旦心变得空无一切对象，心与*puruṣa*之间的区别便显现出来。毗耶娑提出这样一个论证：一个空无一切对象的心仍能认识它自身，因此它必须成为心中的一个对象，即它自身。换句话说，认知必须被其自身所认知。然而，按照他的说法，这是不可能的。相反，*puruṣa*显示自身为使认知成为可能的东西。在这种意义上，*puruṣa*可与胡塞尔（Husserl）的“先验自我”观念相比。所以，*puruṣa*只能通过使心空无一切认知（包括情感）来间接地显示自身。这意味着情感被视为对解脱的障碍，但同时它们与对世界的其他认知共享这一称号。"
- id: p26
  source: "The Sāṃkhya-Yoga account of the emotions thus shows some similarities with the Nyāya-Vaiśeṣika account in that both regard the emotions as the first obstacle to liberation. Both accounts differ from many Western views in that they regard emotion-free thinking not as an end in itself but as the next obstacle to be removed. For the Sāṃkhya-Yoga philosophers there is a distinction between veridical and non-veridical cognition (*vijñāna*). The latter is classified as ignorance (*avidyā*), which, together with certain emotions, forms the afflictions (*kleśas*). The *Yoga-sūtras* [YS 2.4] emphasize that ignorance is the most fundamental affliction that is the root of all other afflictions. In his commentary on YS 2.3, Vyāsa states that “the afflictions are the five forms of unreal cognition.” So, as Sinha points out:"
  step1: "数论—瑜伽的情感说明因此与正理—胜论的说明显示出一些相似之处，两者都把情感视为对解脱的第一重障碍。两者又与许多西方观点不同，因为它们不把无情感的思想视为目的本身，而是视为需要去除的下一重障碍。对于数论—瑜伽哲学家来说，真确认知与非真确认知（*vijñāna*）之间有区分。后者被归类为无明（*avidyā*），它与某些情感一起构成烦恼（*kleśas*）。《瑜伽经》[YS 2.4]强调，无明是最根本的烦恼，是其他一切烦恼的根源。在其对 YS 2.3 的注释中，毗耶娑指出“烦恼是非真实认知的五种形式。”所以，正如 Sinha 所指出的："
  step2: "数论—瑜伽的情感说明因此与正理—胜论的说明显示出一些相似之处，两者都把情感视为对解脱的第一重障碍。两者又与许多西方观点不同，因为它们不把无情感的思想视为目的本身，而是视为需要去除的下一重障碍。对于数论—瑜伽哲学家来说，真确认知与非真确认知（*vijñāna*）之间有区分。后者被归类为无明（*avidyā*），它与某些情感一起构成烦恼（*kleśas*）。《瑜伽经》[YS 2.4]强调，无明是最根本的烦恼，是其他一切烦恼的根源。在其对 YS 2.3 的注释中，毗耶娑指出“烦恼是非真实认知的五种形式。”所以，正如 Sinha 所指出的："
