  source: "Śāntarakṣita argues that love and hatred exist due to habit and repetition which is ascertained by confirming and disconfirming concomitance. This means that they are learned through experience. For example, love is learned by a person being confronted with objects to which this feeling is attributed and thus reinforced the more of these objects a person encounters. However, we can observe the existence of love and hatred in babies who have not had the repeated experience of these objects in this life. Śāntarakṣita claims that the existence of love and hatred cannot be due to the first encounter with the object of love or hatred because it would be possible, as indeed happens according to him, to encounter this object without the respective feelings of love or hatred or to encounter it with another feeling, such as disgust. As an example, Śāntarakṣita mentions the attraction a man might feel towards a woman. He claims that men are attracted to women if they also attribute “goodness” and “devotedness” to them, even though a particular woman might not possess these qualities. So the qualities that make, for example, a woman “lovable” do not have to exist in the woman and therefore, according to Śāntarakṣita, the woman cannot be said to be the cause of the feeling of love in the man. Love, then is not an object of the senses (*viṣaya*). Therefore, the reason why these feelings exist is through force of habit in previous lives. We have learned over time that women are “lovable”. This argument is meant to demonstrate that love and hatred could not exist if the materialists were right and mental life was simply the result of bodily processes."
  step1: "寂护论证，爱与憎因习惯与重复而存在，这是由确认与否认的相随性（concomitance）所确定的。这意味着它们是通过经验习得的。例如，爱是通过一个人被赋予这种感受的对象所面对而习得的，一个人遇到越多这样的对象，爱就得到越多的强化。然而，我们可以观察到婴儿身上爱与憎的存在，而他们在这一生中并未重复经验过这些对象。寂护主张，爱与憎的存在不能归因于与爱或憎的对象的第一遭遇，因为按照他的说法，确实可能遇到该对象而没有相应的爱或憎的感受，或者带着另一种感受（如厌恶）遇到它。作为例子，寂护提到一个男人可能对一个女人感到的吸引。他主张，如果男人把“善”与“忠贞”也赋予女人，他们就会被女人吸引，即使某个特定的女人可能并不具有这些性质。所以，使一个女人“可爱”的那些性质不必存在于该女人身上，因此，按照寂护，不能说该女人是男人心中爱这种感受的因。那么，爱不是感官的对象（*viṣaya*，境）。因此，这些感受之所以存在，是通过前世习惯的力量。我们随着时间习得了女人是“可爱的”。这一论证旨在表明，如果唯物论者是对的，心理生活纯粹是身体过程的结果，爱与憎就不可能存在。"
