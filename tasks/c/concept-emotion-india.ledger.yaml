  source: "> If the body were one lasting and changeless entity from birth to death, it could not produce cognitions gradually, and thus all the cognitions one has throughout one’s life would be produced at once. If the body were the material cause of the cognition, the cognition would last as long as the body, and thus there could be no dead body (v. 51). If the breaths are considered the cause of cognition, the same inadmissible consequence applies: Because the body is the material cause of the breaths, the breaths would last as long as the body and the cognition as long as the breaths (v. 53). All these inadmissible consequences do not apply if one admits that cognition is the cause of cognition. (Franco 1997, pp. 134–135)[^franco-1997]"
  step1: "如果身体是从出生到死亡的一个持续而恒常的实体，它就不能逐渐产生认知，这样一个人一生中所有的认知就会同时产生。如果身体是认知的质料因，认知就会与身体一样持久，这样就不会有死尸（v. 51）。如果把呼吸视为认知的因，同样的不可接受的结果也适用：因为身体是呼吸的质料因，呼吸会与身体一样持久，而认知会与呼吸一样持久（v. 53）。所有这些不可接受的结果都不适用，如果人们承认认知是认知的因的话。（Franco 1997, pp. 134–135）[^franco-1997]"
  step2: "如果身体是从出生到死亡的一个持续而恒常的实体，它就不能逐渐产生认知，这样一个人一生中所有的认知就会同时产生。如果身体是认知的质料因，认知就会与身体一样持久，这样就不会有死尸（v. 51）。如果把呼吸视为认知的因，同样的不可接受的结果也适用：因为身体是呼吸的质料因，呼吸会与身体一样持久，而认知会与呼吸一样持久（v. 53）。所有这些不可接受的结果都不适用，如果人们承认认知是认知的因的话。（Franco 1997, pp. 134–135）[^franco-1997]"
- id: p33
  source: "Of course, there is no reason why the Lokāyata philosophers should say that the body is changeless. It might precisely be the changes that appear in the body, for example in the brain, which are responsible for cognition. Dharmakīrti argues that if cognition required the support of the body, there is no reason why it should not arise everywhere where there exists a body or matter [PV 37–38]. The obvious objection to this argument is that not any form of matter supports cognition. It has to be a particular kind of matter, ordered in a particular way, as is the case in human beings and many animals."
  step1: "当然，顺世派哲学家没有理由说身体是恒常不变的。可能恰恰是身体中出现的那些变化，例如脑中的变化，才造成认知。法称论证，如果认知需要身体的支持，那么没有理由说明它为什么不应在有身体或有物质的地方出现[PV 37–38]。对这一论证的明显反驳是，并非任何形式的物质都支持认知。它必须是特定种类的物质、以特定方式排列，如人类和许多动物那样。"
  step2: "当然，顺世派哲学家没有理由说身体是恒常不变的。可能恰恰是身体中出现的那些变化，例如脑中的变化，才造成认知。法称论证，如果认知需要身体的支持，那么没有理由说明它为什么不应在有身体或有物质的地方出现[PV 37–38]。对这一论证的明显反驳是，并非任何形式的物质都支持认知。它必须是特定种类的物质、以特定方式排列，如人类和许多动物那样。"
- id: p34
  source: "According to Buddhist “psychology”, love and hatred are two of the afflictions (*kleśas*) that befall human beings and that need to be removed in order to attain liberation. There are a number of sections in the *Yogācāra-bhūmi*, possibly written by either Asaṅga or Maitreya, that discuss these *kleśas*. The text provides several lists, most of which include love (*rāga)* and hatred or enmity (*pratigha*). Other *kleśas* are: *satkāya-dṛṣṭi* (false view with regard to the *satkāya* (five *skandhas*)), attachment to extreme views, attachment to unwholesome views, attachment to practices and observances, pride, ignorance and doubt. These *kleśas* could be associated with one or more of the five possible feelings: pleasant feeling (*sukha*), unpleasant feeling (*duḥkha*), neutral feeling (*upekṣā*), happy mood (*sau-manasya*) or unhappy mood (*daur-manasya*). A translation of the psychological categories of the *Yogācāra-bhūmi* into the categories of Western philosophy of mind would render the following distinctions: a *kleśa* is a mental phenomenon that consists of a representation of an object plus a certain feeling, sensation or affect. For example, in the case of love, the *Yogācāra-bhūmi* states that we have the object of love plus either a pleasant sensation or a happy mood or indifference (neutral feeling). It is interesting to note that the mental phenomenon of love can be connected with indifference. In general, this suggests that a sensation is comparable to a psychological attitude and that we always have to have one attitude or another towards a mental object. This means that our thinking is never without a feeling, even if it is a “neutral” feeling. It is unclear, however, in what way we could experience the emotion of love with the sensation of indifference. It seems that love always requires a positive feeling. The *Yogācāra-bhūmi* allows for a mental phenomenon to count as the experience of love, as long as it does not involve a “negative”, i.e., unhappy or unpleasant, feeling."
  step1: "按照佛教“心理学”，爱与憎是降临于人类、为获得解脱而需要去除的烦恼（*kleśas*）中的两种。《瑜伽师地论》（*Yogācāra-bhūmi*）——可能由无著（Asaṅga）或弥勒（Maitreya）所著——中有若干节讨论这些烦恼。该文本提供了几个列表，其中大多数包括爱（*rāga*）与憎或敌意（*pratigha*）。其他烦恼是：*satkāya-dṛṣṭi*（对有身（*satkāya*，五蕴）的错误见解）、对极端见解的执著、对不善见解的执著、对修行与仪轨的执著、骄傲、无知与疑惑。这些烦恼可与五种可能的感受中的一种或多种相关联：乐受（*sukha*）、苦受（*duḥkha*）、舍受（*upekṣā*）、喜受（*sau-manasya*）或忧受（*daur-manasya*）。把《瑜伽师地论》的心理范畴翻译成西方心灵哲学的范畴，会产生以下区分：一个烦恼是一种心理现象，由一个对象的表征加上某种感受、感觉或情动构成。例如，在爱的情况下，《瑜伽师地论》指出，我们有爱的对象加上或一种乐受、或一种喜受、或一种无动于衷（舍受）。值得注意的是，爱的心理现象可以与无动于衷相联。总的来说，这表明一种感觉与一种心理态度相当，我们总得对某个心理对象采取这种或那种态度。这意味着我们的思维从不缺乏感受，即使是一种“中性”感受。然而，我们以无动于衷的感觉来体验爱这种情感的方式是不清楚的。似乎爱总需要一种积极感受。《瑜伽师地论》允许一个心理现象算作爱的体验，只要它不涉及一种“消极”的、即不悦或不快的感受。"
  step2: "按照佛教“心理学”，爱与憎是降临于人类、为获得解脱而需要去除的烦恼（*kleśas*）中的两种。《瑜伽师地论》（*Yogācāra-bhūmi*）——可能由无著（Asaṅga）或弥勒（Maitreya）所著——中有若干节讨论这些烦恼。该文本提供了几个列表，其中大多数包括爱（*rāga*）与憎或敌意（*pratigha*）。其他烦恼是：*satkāya-dṛṣṭi*（对有身（*satkāya*，五蕴）的错误见解）、对极端见解的执著、对不善见解的执著、对修行与仪轨的执著、骄傲、无知与疑惑。这些烦恼可与五种可能的感受中的一种或多种相关联：乐受（*sukha*）、苦受（*duḥkha*）、舍受（*upekṣā*）、喜受（*sau-manasya*）或忧受（*daur-manasya*）。把《瑜伽师地论》的心理范畴翻译成西方心灵哲学的范畴，会产生以下区分：一个烦恼是一种心理现象，由一个对象的表征加上某种感受、感觉或情动构成。例如，在爱的情况下，《瑜伽师地论》指出，我们有爱的对象加上或一种乐受、或一种喜受、或一种无动于衷（舍受）。值得注意的是，爱的心理现象可以与无动于衷相联。总的来说，这表明一种感觉与一种心理态度相当，我们总得对某个心理对象采取这种或那种态度。这意味着我们的思维从不缺乏感受，即使是一种“中性”感受。然而，我们以无动于衷的感觉来体验爱这种情感的方式是不清楚的。似乎爱总需要一种积极感受。《瑜伽师地论》允许一个心理现象算作爱的体验，只要它不涉及一种“消极”的、即不悦或不快的感受。"
