  source: "In TS 1958, Śāntarakṣita provides a similar example of male animals that become “perturbed” by the touch of female animals even though they do not know anything about any “doings” (*vṛttānta*) or sexual intercourse, yet. His argument is that this feeling must be due to experiences in previous lives. He does not account for the possibility of instinctual behaviour. If Śāntarakṣita allowed for the existence of instinctual behaviour then his observation of babies and animals might have let him to believe that love and hatred are mental phenomena that are not learned through experience."
  step1: "在 TS 1958 中，寂护提供了一个类似的例子：雄性动物因雌性动物的触碰而变得“不安”，尽管它们尚不知道任何“行为”（*vṛttānta*）或性交。他的论证是，这种感受必定源于前世的经验。他没有考虑到本能行为的可能性。如果寂护允许本能行为的存在，那么他对婴儿与动物的观察可能会让他相信爱与憎是并非通过经验习得的心理现象。"
