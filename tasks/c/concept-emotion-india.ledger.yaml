  source: "> For the following reason also, the feelings of Love, etc. cannot be due to presence of the excitants:–Because, if the feelings appeared exactly in accordance with the excitants, they would proceed from the excitant exactly in the same manner as the Cognition of Blue and other things (which always proceeds in accordance with these things);–the feelings however do not proceed in this way; on the contrary, the said feelings appear in regard to the Woman and other things, in men who attribute to the woman the form of their own lasting pleasure, etc. which have not been experienced at all; and yet the objects (woman, etc.) are not actually possessed of the said form of goodness, etc.;–and when a thing is devoid of a certain form, it cannot be the excitant or basis of the Cognition of that form; otherwise it would lead to absurdity. (TSP: 931)"
  step1: "基于以下理由，爱等感受也不能归因于刺激物的在场：——因为，如果感受完全依照刺激物而出现，它们就会完全像蓝色等的认知那样从刺激物产生（后者总是依照这些事物而产生）；——然而感受并不以这种方式产生；相反，所述感受在把女人的形式认作自己的持久乐等（从未经验过的东西）的男人身上，就女人等事物而出现；而对象（女人等）实际上并不具有所述善等的形式；——当一个事物缺乏某种形式时，它就不能成为对该形式的认知的刺激物或基础；否则会导致荒谬。（TSP: 931）"
