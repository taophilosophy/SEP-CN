- id: p43
  source: "So, Śāntarakṣita might argue that love and hatred are just as much part of a “chain of cognitions” that is without beginning and end as all other cognitions. The reason why he postulates the existence of this eternal “chain of cognitions” is the argument that no cognition could be caused by anything other than a previous cognition and hence there cannot be a first cognition for anything we call a particular being. If there was a first cognition for a particular being then, according to Śāntarakṣita (TS 1878–1885), there would be five options: i) the first cognition does not have a cause; ii) it is produced by an eternal cause; iii) it is eternal and unchanging; iv) it is caused by another substance; and v) it is caused by a cognition “from another chain”."
  step1: "所以，寂护可能论证，爱与憎正如所有其他认知一样，是一个无始无终的“认知之链”的一部分。他之所以设定这种永恒的“认知之链”的存在，是基于这样的论证：任何认知都只能由先前的认知所引起，因此，对于我们所称的某个特定存在者来说，不可能有第一个认知。如果某个特定存在者有一个第一认知，那么按照寂护（TS 1878–1885），会有五个选项：i）第一认知没有因；ii）它由永恒的因而产生；iii）它是永恒而不变的；iv）它由另一个实体所引起；v）它由“另一条链”的认知所引起。"
  step2: "所以，寂护可能论证，爱与憎正如所有其他认知一样，是一个无始无终的“认知之链”的一部分。他之所以设定这种永恒的“认知之链”的存在，是基于这样的论证：任何认知都只能由先前的认知所引起，因此，对于我们所称的某个特定存在者来说，不可能有第一个认知。如果某个特定存在者有一个第一认知，那么按照寂护（TS 1878–1885），会有五个选项：i）第一认知没有因；ii）它由永恒的因而产生；iii）它是永恒而不变的；iv）它由另一个实体所引起；v）它由“另一条链”的认知所引起。"
- id: p44
  source: "Śāntarakṣita rejects the first option because he argues that according to this idea the foetus would somehow receive the first cognition without any cause. This means that the cognition would be eternal, rather than momentary. Śāntarakṣita rejects the second option because if the cognition is produced by an eternal non-material cause then it should itself be eternal. The argument is that if something which exists eternally can bring about a cognition then there is no point in time at which this cause could have brought about the effect. So the effect is eternal in the same way as the cause. But an eternal effect cannot exist because something which is eternal does not have a cause. The third option that the cognition is eternal runs counter to our experience which tells us that cognitions are momentary. Śāntarakṣita also dismisses the Lokāyata position that cognitions are produced by physical substances because the Lokāyata philosophers argue that material substances are eternal. So, Śāntarakṣita makes a similar argument to the rejection of option two. An eternal cause has to have an eternal effect but cognitions are not eternal. Option five is rejected in TS 1893–1896 where Śāntarakṣita argues that the first cognition of one chain cannot be solely caused by a cognition from another chain because in that case we would expect the knowledge of parents to carry over into their babies."
  step1: "寂护拒绝第一个选项，因为他论证，按照这一观念，胎儿会在没有任何因的情况下以某种方式获得第一认知。这意味着认知会是永恒的，而不是刹那的。寂护拒绝第二个选项，因为如果认知由永恒的非物质因而产生，那么它自身就应当是永恒的。论证是：如果某个永恒存在的东西能带来一个认知，那么就没有这样一个时间点，这个因本可在这个时间点带来结果。所以结果是像因一样永恒的。但一个永恒的结果不能存在，因为永恒的东西没有因。第三个选项（认知是永恒的）与我们的经验相悖，经验告诉我们认知是刹那的。寂护也驳斥了顺世派的立场，即认知由物理实体所产生，因为顺世派哲学家论证物质实体是永恒的。所以，寂护提出了一个与拒绝选项二类似的论证。永恒的因必须产生永恒的结果，但认知不是永恒的。选项五在 TS 1893–1896 中被拒绝，寂护在那里论证，一条链的第一认知不能仅仅由另一条链的认知所引起，因为在这种情况下，我们会预期父母的知识会传到他们的婴儿身上。"
  step2: "寂护拒绝第一个选项，因为他论证，按照这一观念，胎儿会在没有任何因的情况下以某种方式获得第一认知。这意味着认知会是永恒的，而不是刹那的。寂护拒绝第二个选项，因为如果认知由永恒的非物质因而产生，那么它自身就应当永恒的。论证是：如果某个永恒存在的东西能带来一个认知，那么就没有这样一个时间点，这个因本可在这个时间点带来结果。所以结果是像因一样永恒的。但一个永恒的结果不能存在，因为永恒的东西没有因。第三个选项（认知是永恒的）与我们的经验相悖，经验告诉我们认知是刹那的。寂护也驳斥了顺世派的立场，即认知由物理实体所产生，因为顺世派哲学家论证物质实体是永恒的。所以，寂护提出了一个与拒绝选项二类似的论证。永恒的因必须产生永恒的结果，但认知不是永恒的。选项五在 TS 1893–1896 中被拒绝，寂护在那里论证，一条链的第一认知不能仅仅由另一条链的认知所引起，因为在这种情况下，我们会预期父母的知识会传到他们的婴儿身上。"
- id: p45
  source: "The second part (b) of Śāntarakṣita’s argument, that love and hatred are different from perception, is intriguing in that he claims that there cannot be an external cause for love and hatred because whatever we might want to postulate as this external object can elicit different feelings in different people. The object of one person’s love might be the object of another person’s aversion. For this reason, love and hatred cannot be acquired in this life, like perceptions. So the love and hatred that exist in a baby or young animal must be carried over from another life. This argument assumes that there could not be non-perceptual cognition that can arise without previous experience and therefore faces the same challenges as the claim that all feelings have to be learned through repeated experience. But it goes beyond this discussion in that it raises the question of what the object of love and hatred is. Kamalaśīla uses the term *vaśa* (desire, love) rather than *rāga* in his commentary on TS 1948–1953 which suggests that he does not clearly distinguish between desire and love. If it is true that *rāga* is a *kleśa* then it is plausible that there is no distinction between love and craving. So he could be making the obvious point that we can desire something without a basis in the external world, i.e., what I desire might not exist, or that I might desire something for the wrong reasons. Love, hatred and desire all require the existence of an object. However, unlike a perceptual object, the objects of love and desire can be “merely” mental. I can love the idea of equality or I can desire something which does not exist. This “non-existence” can be two-fold: i) I can desire something which cannot exist either logically or physically, for example, I can desire that I had wings; ii) if I desire something to be the case, then what I desire does not exist, yet. For example, if I desire an ice-cream then the state of affairs in which I have an ice-cream does not exist, yet. In contrast with love and desire, perception, at least on a realist account, requires its object to exist in the external world."
  step1: "寂护论证的第二部分（b），即爱与憎不同于知觉，令人感兴趣之处在于他主张爱与憎不可能有外在的因，因为无论我们可能想设定为何种外在对象，它都能在不同人身上引起不同的感受。一个人的爱的对象可能是另一个人的厌离的对象。出于这个原因，爱与憎不能像知觉那样在这一生中习得。所以，存在于婴儿或年幼动物身上的爱与憎必定从另一世延续而来。这一论证假定，不存在无需先前经验就能生起的非知觉性认知，因此它面临与“一切感受都必须通过重复经验习得”这一主张相同的挑战。但它超越了这一讨论，因为它提出了爱与憎的对象是什么的问题。莲花戒在其对 TS 1948–1953 的注释中使用 *vaśa*（欲望、爱）而不是 *rāga*，这表明他并未明确区分欲望与爱。如果 *rāga* 确实是一种烦恼（*kleśa*），那么很可能爱与渴爱之间没有区别。所以，他可能是在提出一个明显的观点：我们可以欲望某个没有外部世界基础的东西，即我所欲望的可能不存在，或者我可能出于错误的原因而欲望某个东西。爱、憎与欲望都需要一个对象的存在。然而，与知觉对象不同，爱与欲望的对象可以是“仅仅”心理的。我可以爱平等的观念，或者我可以欲望某个不存在的东西。这种“不存在”可以是双重的：i）我可以欲望某个逻辑上或物理上不可能存在的东西，例如，我可以欲望我长有翅膀；ii）如果我欲望某个事态成为事实，那么我所欲望的尚不存在。例如，如果我欲望一个冰淇淋，那么我拥有一个冰淇淋的事态尚不存在。与爱与欲望相反，知觉——至少按照实在论说明——要求其对象存在于外部世界。"
  step2: "寂护论证的第二部分（b），即爱与憎不同于知觉，令人感兴趣之处在于他主张爱与憎不可能有外在的因，因为无论我们可能想设定为何种外在对象，它都能在不同人身上引起不同的感受。一个人的爱的对象可能是另一个人的厌离的对象。出于这个原因，爱与憎不能像知觉那样在这一生中习得。所以，存在于婴儿或年幼动物身上的爱与憎必定从另一世延续而来。这一论证假定，不存在无需先前经验就能生起的非知觉性认知，因此它面临与“一切感受都必须通过重复经验习得”这一主张相同的挑战。但它超越了这一讨论，因为它提出了爱与憎的对象是什么的问题。莲花戒在其对 TS 1948–1953 的注释中使用 *vaśa*（欲望、爱）而不是 *rāga*，这表明他并未明确区分欲望与爱。如果 *rāga* 确实是一种烦恼（*kleśa*），那么很可能爱与渴爱之间没有区别。所以，他可能是在提出一个明显的观点：我们可以欲望某个没有外部世界基础的东西，即我所欲望的可能不存在，或者我可能出于错误的原因而欲望某个东西。爱、憎与欲望都需要一个对象的存在。然而，与知觉对象不同，爱与欲望的对象可以是“仅仅”心理的。我可以爱平等的观念，或者我可以欲望某个不存在的东西。这种“不存在”可以是双重的：i）我可以欲望某个逻辑上或物理上不可能存在的东西，例如，我可以欲望我长有翅膀；ii）如果我欲望某个事态成为事实，那么我所欲望的尚不存在。例如，如果我欲望一个冰淇淋，那么我拥有一个冰淇淋的事态尚不存在。与爱与欲望相反，知觉——至少按照实在论说明——要求其对象存在于外部世界。"
- id: p46
  source: "While the argument about the difference between perception and love does not show that love requires previous experience, it raises, (at least) two interesting questions about the Buddhist account of the emotions: i) why does Śāntarakṣita draw a distinction between perception and feeling on the basis of the non-existence of external objects in the case of love, hatred and desire? ii) why does he make a specific argument about love and hatred when he has already argued in previous verses of the *Lokāyata-parīkṣā* that all cognitions require other cognitions as their causes?"
  step1: "虽然关于知觉与爱之区别的论证并不表明爱需要先前的经验，但它提出了（至少）两个关于佛教情感说明的有趣问题：i）为什么寂护基于爱、憎与欲望情形下外部对象的不存在，而在知觉与感受之间划出区分？ii）当他已经在此前《顺世派考察》（*Lokāyata-parīkṣā*）的偈颂中论证一切认知都需要其他认知作为其因时，为什么还要对爱与憎作出一个具体的论证？"
  step2: "虽然关于知觉与爱之区别的论证并不表明爱需要先前的经验，但它提出了（至少）两个关于佛教情感说明的有趣问题：i）为什么寂护基于爱、憎与欲望情形下外部对象的不存在，而在知觉与感受之间划出区分？ii）当他已经在此前《顺世派考察》（*Lokāyata-parīkṣā*）的偈颂中论证一切认知都需要其他认知作为其因时，为什么还要对爱与憎作出一个具体的论证？"
- id: p47
  source: "In what follows, these questions are addressed briefly in reverse order. The second question raises the general problem of the translatability of the concept of feeling or emotion into Sanskrit. As mentioned in the introduction, there is no general term in Sanskrit for emotion and Śāntarakṣita uses the expression “love and hatred etc.” (*rāga-dveṣa* + *ādi*). In the translation, Jha has taken the “etc.” as referring to other feelings, assuming that Śāntarakṣita was operating with a psychological category such as “feeling”. However, there is no single word in the text which would translate as feeling every time it appears in the translation. In fact, it is clear that Śāntarakṣita does not mean “feelings” in the sense of non-representational attitudes towards objects because love and hatred have objects according to him, albeit mental objects. Since Śāntarakṣita remains within the context of Buddhist psychology and clearly refers to Dharmakīrti, it is plausible that he means “other *kleśas*” instead of “other feelings” because love and hatred are *kleśas* and have objects."
  step1: "在下文中，这些问题的回答按相反顺序简要讨论。第二个问题提出了将感受或情感概念翻译成梵语的一般可译性问题。如导言所述，梵语中没有情感的一般术语，寂护使用“爱与憎等”（*rāga-dveṣa* + *ādi*）这一表达。在译文中，Jha 把“等”理解为指其他感受，假定寂护是在与诸如“感受”这样的心理范畴打交道。然而，文本中没有一个词在每次出现于译文时都可译为感受。事实上，很清楚的是，寂护的意思不是“感受”意义上的、对对象采取的非表征性态度，因为爱与憎在他那里有对象，尽管是心理的对象。由于寂护仍处于佛教心理学的语境中，并且明确地指涉法称，所以更合理的是，他意指的是“其他烦恼”而不是“其他感受”，因为爱与憎是烦恼并且有对象。"
  step2: "在下文中，这些问题的回答按相反顺序简要讨论。第二个问题提出了将感受或情感概念翻译成梵语的一般可译性问题。如导言所述，梵语中没有情感的一般术语，寂护使用“爱与憎等”（*rāga-dveṣa* + *ādi*）这一表达。在译文中，Jha 把“等”理解为指其他感受，假定寂护是在与诸如“感受”这样的心理范畴打交道。然而，文本中没有一个词在每次出现于译文时都可译为感受。事实上，很清楚的是，寂护的意思不是“感受”意义上的、对对象采取的非表征性态度，因为爱与憎在他那里有对象，尽管是心理的对象。由于寂护仍处于佛教心理学的语境中，并且明确地指涉法称，所以更合理的是，他意指的是“其他烦恼”而不是“其他感受”，因为爱与憎是烦恼并且有对象。"
- id: p48
  source: "In this context, it is also important to discuss the translation of the term *vijñāna* as “cognition”. Both terms refer to a mental phenomenon that provides knowledge. This means that they refer to a state of affairs that pertains in the world. Both terms presuppose an external or mental object they are directed towards. One important difference between these two terms, which shows the difficulty with translating *vijñāna* as cognition, is that, according to Śāntarakṣita, a *vijñāna* always has an object but it does not have to have conceptual content. In this sense, even a sensation or feeling, such as the sensation of pleasure, is a *vijñāna* because it has an object but lacks conceptual content, according to Śāntarakṣita. The sensation has an object because it provides knowledge about mental states and therefore has to have an object of knowledge. However, this object is not conceptual. So, according to Śāntarakṣita, a *vijñāna* includes affective mental states, such as feelings, sensations and emotions and therefore *kleśas*. The Western term “cognition”, by contrast, excludes affective mental states."
  step1: "在此语境中，讨论把 *vijñāna* 译为“认知”的问题也很重要。这两个词都指一种提供知识的心智现象。这意味着它们指一种在世界中存在的事态。两个词都以它们所指向的一个外部或心理对象为前提。这两个词之间的一个重要差异（它表明了把 *vijñāna* 译为认知的困难）在于，按照寂护，一个 *vijñāna* 总有对象，但它不必具有概念内容。在这种意义上，即使一种感觉或感受，如乐的感觉，也是一个 *vijñāna*，因为它有一个对象但缺乏概念内容，按照寂护。这种感觉有一个对象，因为它提供关于心理状态的知识，因此必须有一个认识对象。然而，这个对象不是概念的。所以，按照寂护，一个 *vijñāna* 包括情感性心理状态，如感受、感觉与情感，因而也包括烦恼。相比之下，西方术语“认知”排除情感性心理状态。"
  step2: "在此语境中，讨论把 *vijñāna* 译为“认知”的问题也很重要。这两个词都指一种提供知识的心智现象。这意味着它们指一种在世界中存在的事态。两个词都以它们所指向的一个外部或心理对象为前提。这两个词之间的一个重要差异（它表明了把 *vijñāna* 译为认知的困难）在于，按照寂护，一个 *vijñāna* 总有对象，但它不必具有概念内容。在这种意义上，即使一种感觉或感受，如乐的感觉，也是一个 *vijñāna*，因为它有一个对象但缺乏概念内容，按照寂护。这种感觉有一个对象，因为它提供关于心理状态的知识，因此必须有一个认识对象。然而，这个对象不是概念的。所以，按照寂护，一个 *vijñāna* 包括情感性心理状态，如感受、感觉与情感，因而也包括烦恼。相比之下，西方术语“认知”排除情感性心理状态。"
- id: p49
  source: "The whole of the *Lokāyata-parīkṣā* of the *Tattva-saṃgraha* is one argument for the existence of an infinite chain of *vijñānas* that is independent of its physical manifestation. For Śāntarakṣita, “love, hatred and the rest” are examples of *vijñānas.* These *vijñānas* are also *kleśas* but not all *vijñānas* are *kleśas*. Love and hatred are especially useful for his argument because they are fundamental to our experience and emphasize the continuity of the “chain of *vijñānas*”."
  step1: "《摄真实论》（*Tattva-saṃgraha*）的《顺世派考察》整篇就是一个论证，论证存在一个独立于其物理显现的、无限之 *vijñāna* 之链。对于寂护来说，“爱与憎等”是 *vijñāna* 的例子。这些 *vijñāna* 也是烦恼，但并非所有 *vijñāna* 都是烦恼。爱与憎对他的论证特别有用，因为它们对我们的经验是根本性的，并强调了“*vijñāna* 之链”的连续性。"
  step2: "《摄真实论》（*Tattva-saṃgraha*）的《顺世派考察》整篇就是一个论证，论证存在一个独立于其物理显现的、无限之 *vijñāna* 之链。对于寂护来说，“爱与憎等”是 *vijñāna* 的例子。这些 *vijñāna* 也是烦恼，但并非所有 *vijñāna* 都是烦恼。爱与憎对他的论证特别有用，因为它们对我们的经验是根本性的，并强调了“*vijñāna* 之链”的连续性。"
- id: p50
  source: "According to Śāntarakṣita, *vijñānas* can include feelings and emotions whereas in Western psychology and philosophy cognitions are distinct from emotions and feelings. This means that the role of *vijñānas* in Śāntarakṣita’s system is different from the role of cognitions in Western psychology and philosophy. As I mentioned above, in the history of Western philosophy the distinction between feeling and cognition has often been used as the demarcation between feeling and rational thought with the ideal of affectless thought. For Śāntarakṣita and other Buddhist philosophers the ideal is not necessarily that of affectless thought. Instead, their ideal is that of an existence free from afflictions (*kleśas*). So, they try to extinguish one kind of mental phenomenon but their distinction is different from the distinction between feeling and thought. For them, all mental phenomena that provide an obstacle to liberation should be eliminated. This includes what Western psychologists would call emotions or feelings. However, it also includes many affectless cognitions. This means that the Western psychological category “emotions” does not feature prominently in Śāntarakṣita’s account of the mind. In fact, it is not clear that he would even recognize such a category. According to Buddhist psychology, some *kleśas* straddle the Western divide between feeling and thought. They involve both feeling and thought and they are a mental phenomenon, called a *vijñāna*. Whereas for many philosophers in the history of Western philosophy, the ideal has been to purge feeling from thought, in order to attain a standard of rationality, the ideal for Śāntarakṣita and other Buddhist philosophers is to free our mental life from those *vijñānas* which are *kleśas*. The reason is not to attain some standard of rationality because, for Buddhists, most *vijñānas* are suspect in that they involve an attachment to the present life and therefore pose an obstacle to liberation."
  step1: "按照寂护，*vijñāna* 可以包括感受与情感，而在西方心理学与哲学中，认知与情感和感受是分开的。这意味着 *vijñāna* 在寂护体系中的作用不同于认知在西方心理学与哲学中的作用。如我上文所提，在西方哲学史中，感受与认知的区分常被用作感受与理性思想之间的分界，而以无情感的思想为理想。对于寂护与其他佛教哲学家来说，理想不一定是无情感的思想。相反，他们的理想是一种摆脱烦恼（*kleśas*）的存在。所以，他们试图消灭一种心智现象，但他们的区分不同于感受与思想之间的区分。对他们来说，一切对解脱构成障碍的心智现象都应被消除。这包括西方心理学家所谓的情绪或感受。然而，它也包括许多无情感的认知。这意味着，西方心理学的范畴“情绪”在寂护关于心的说明中并不突出。事实上，不清楚他是否会承认这样一个范畴。按照佛教心理学，有些烦恼横跨西方感受与思想之间的分界。它们既涉及感受也涉及思想，它们是一种被称为 *vijñāna* 的心智现象。然而，对于西方哲学史中的许多哲学家来说，理想一直是从思想中清除感受，以达到某种理性标准，而寂护与其他佛教哲学家的理想则是使我们的心理生活摆脱那些是烦恼的 *vijñāna*。原因不在于达到某种理性标准，因为对于佛教徒来说，大多数 *vijñāna* 都是可疑的，因为它们涉及对现世的执著，因而对解脱构成障碍。"
