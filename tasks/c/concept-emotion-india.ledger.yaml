- id: p51
  source: "One question that arises in this context is “why does Śāntarakṣita single out love and hatred, instead of discussing *kleśas* in general?”. One answer might be that they are fundamental to our human experience and therefore lend themselves to Śāntarakṣita’s argument that cognitions in general do not come into existence with the body."
  step1: "此语境中出现的一个问题是“为什么寂护特别挑出爱与憎，而不是讨论一般的烦恼？”。一个回答可能是：它们对我们的经验是根本性的，因此适合寂护的论证，即认知一般并不随身体而出现。"
  step2: "此语境中出现的一个问题是“为什么寂护特别挑出爱与憎，而不是讨论一般的烦恼？”。一个回答可能是：它们对我们的经验是根本性的，因此适合寂护的论证，即认知一般并不随身体而出现。"
- id: p52
  source: "In Western discussions of this topic, feelings are often associated with some physical change, such as a quicker heartbeat or a change in the chemical make up of the brain. For this reason, emotions are regarded as providing some link between the mental and the physical. Śāntarakṣita mentions this link between feeling and physical changes in TS 1960. He claims that phlegm (*balāsa*) and other bodily changes are not responsible for love, hatred or perturbations through sexual arousal because there is no observed concomitance between them. While this claim might be true with regard to phlegm, it is obviously false with regard to other physical changes, especially changes in the brain. However, it would be wrong to completely dismiss Śāntarakṣita’s argument simply because he turned out to be wrong about this empirical claim. After all, the argument raises important questions about the status of mental phenomena, such as love and hatred. This becomes clear when we think about the other question mentioned earlier: why does Śāntarakṣita distinguish between perceptions on the one hand and love and hatred on the other hand based on the existence or non-existence of external objects? While Śāntarakṣita often adopts an idealist position compatible with the Yogācāra standpoint in the *Tattva-saṃgraha*, he seems to switch to a realist position in this case which is compatible with a *Sautāntrika* standpoint. The best explanation for this switch is that Śāntarakṣita and Kamalaśīla are arguing against Lokāyata philosophers (materialists), who do not share the Yogācāra outlook on reality. This means that Śāntarakṣita and Kamalaśīla try to find common ground with these philosophers and therefore share their assumptions about the mind-independent existence of an external world. Śāntarakṣita’s and Kamalaśīla’s argument then is that even with this assumption in place, it does not follow that all cognitions are dependent on or even identical with the body. According to them, the Lokāyata philosophers would have to draw a distinction between perceptions on the one hand and love and hatred on the other hand, and while they might be able to account for perceptions they are not able to account for love and hatred."
  step1: "在西方对这一话题的讨论中，感受常与某种物理变化相关联，如心跳加快或脑内化学成分的变化。出于这个原因，情绪被视为提供心与物之间的某种联系。寂护在 TS 1960 中提到了感受与物理变化之间的这种联系。他主张，痰（*balāsa*）与其他身体变化并不对爱、憎或性唤起引起的不安负责，因为它们之间没有被观察到的相随性。虽然这一主张就痰而言可能是真的，但就其他身体变化，尤其是脑的变化而言，它显然是假的。然而，仅仅因为寂护在这一经验性主张上被证明是错的，就完全否定他的论证，是错误的。毕竟，这一论证提出了关于诸如爱与憎这样的心智现象之地位的重要问题。当我们思考上文提到的另一个问题时，这一点就变得清楚：为什么寂护基于外部对象的存在或不存在，在一方面是知觉、另一方面是爱与憎之间作出区分？虽然寂护在《摄真实论》中常采取一种与瑜伽行派立场相容的唯心论立场，但他在这一情形下似乎转而采取一种与经量部（*Sautāntrika*）立场相容的实在论立场。对这种转变的最好解释是，寂护与莲花戒是在与顺世派哲学家（唯物论者）论争，后者并不认同瑜伽行派对实在的看法。这意味着寂护与莲花戒试图与这些哲学家找到共同立场，因此认同他们关于外部世界独立于心而存在的假定。寂护与莲花戒的论证因而是：即使这一假定成立，也不能推出一切认知都依赖于甚或等同于身体。按照他们，顺世派哲学家必须在一方面是知觉、另一方面是爱与憎之间作出区分，而他们或许能说明知觉，却不能说明爱与憎。"
  step2: "在西方对这一话题的讨论中，感受常与某种物理变化相关联，如心跳加快或脑内化学成分的变化。出于这个原因，情绪被视为提供心与物之间的某种联系。寂护在 TS 1960 中提到了感受与物理变化之间的这种联系。他主张，痰（*balāsa*）与其他身体变化并不对爱、憎或性唤起引起的不安负责，因为它们之间没有被观察到的相随性。虽然这一主张就痰而言可能是真的，但就其他身体变化，尤其是脑的变化而言，它显然是假的。然而，仅仅因为寂护在这一经验性主张上被证明是错的，就完全否定他的论证，是错误的。毕竟，这一论证提出了关于诸如爱与憎这样的心智现象之地位的重要问题。当我们思考上文提到的另一个问题时，这一点就变得清楚：为什么寂护基于外部对象的存在或不存在，在一方面是知觉、另一方面是爱与憎之间作出区分？虽然寂护在《摄真实论》中常采取一种与瑜伽行派立场相容的唯心论立场，但他在这一情形下似乎转而采取一种与经量部（*Sautāntrika*）立场相容的实在论立场。对这种转变的最好解释是，寂护与莲花戒是在与顺世派哲学家（唯物论者）论争，后者并不认同瑜伽行派对实在的看法。这意味着寂护与莲花戒试图与这些哲学家找到共同立场，因此认同他们关于外部世界独立于心而存在的假定。寂护与莲花戒的论证因而是：即使这一假定成立，也不能推出一切认知都依赖于甚或等同于身体。按照他们，顺世派哲学家必须在一方面是知觉、另一方面是爱与憎之间作出区分，而他们或许能说明知觉，却不能说明爱与憎。"
- id: p53
  source: "From the preceding arguments by the Buddhist philosophers Dharmakīrti, Śāntarakṣita and Kamalaśīla it becomes clear that Buddhist philosophers do not operate with the psychological category “emotion”; at least not in the way that other Indian (and Western) philosophers do. For example, Śāntarakṣita and Kamalaśīla do not consider love and hatred to be irrational because they involve non-cognitive feelings that do not represent an external reality. Kamalaśīla in particular makes it clear that for him love and hatred do not require a relationship to objects in the external world. He argues that not having an external object is a salient feature of love and hatred. In Western philosophy of mind we often use the presence or absence of an object of love in order to distinguish between rational and irrational love. Śāntarakṣita and Kamalaśīla, however, do not use this distinction in order to argue that love and hatred should be eliminated. As Buddhists, their concern lies with the afflictions that prevent the mind from becoming liberated and whatever mental state is an affliction ought to be eliminated. Emotions then are *vijñānas* and as such they always have an object. This position stands in contrast to philosophical traditions, be they Indian or Western, in which feelings and emotions are often distinguished from cognitions because they lack an object."
  step1: "从佛教哲学家法称、寂护与莲花戒的前述论证可以清楚地看到，佛教哲学家并不使用“情绪”这一心理范畴；至少不像其他印度（与西方）哲学家那样使用。例如，寂护与莲花戒并不认为爱与憎是非理性的，因为它们涉及不表征外部实在的非认知性感受。特别是莲花戒表明，对他而言，爱与憎不需要与外部世界中的对象的关系。他论证，没有外部对象是爱与憎的一个显著特征。在西方心灵哲学中，我们常用爱的对象的有无来区分理性的与非理性的爱。然而，寂护与莲花戒并不使用这一区分来论证爱与憎应当被消除。作为佛教徒，他们关心的是防止心获得解脱的烦恼，而任何是烦恼的心理状态都应当被消除。那么，情感是 *vijñāna*，并且作为这样的，它们总有对象。这一立场与那些（印度或西方的）哲学传统形成对照，在那些传统中，感受与情感常因缺乏对象而区别于认知。"
  step2: "从佛教哲学家法称、寂护与莲花戒的前述论证可以清楚地看到，佛教哲学家并不使用“情绪”这一心理范畴；至少不像其他印度（与西方）哲学家那样使用。例如，寂护与莲花戒并不认为爱与憎是非理性的，因为它们涉及不表征外部实在的非认知性感受。特别是莲花戒表明，对他而言，爱与憎不需要与外部世界中的对象的关系。他论证，没有外部对象是爱与憎的一个显著特征。在西方心灵哲学中，我们常用爱的对象的有无来区分理性的与非理性的爱。然而，寂护与莲花戒并不使用这一区分来论证爱与憎应当被消除。作为佛教徒，他们关心的是防止心获得解脱的烦恼，而任何是烦恼的心理状态都应当被消除。那么，情感是 *vijñāna*，并且作为这样的，它们总有对象。这一立场与那些（印度或西方的）哲学传统形成对照，在那些传统中，感受与情感常因缺乏对象而区别于认知。"
- id: p54
  source: "A number of themes emerge from this overview: 1) The Western categories of “cognition” and “emotion” do not have equivalents in classical Indian philosophy. This is interesting because it suggests that these concepts are not psychological categories but perhaps social categories. While there has been some anthropological work done by, for example, Catherine Lutz on the differences in the categorization of specific emotions across cultures, there is the possibility that the category as a whole might not translate into all cultures (see Danziger 1997)[^danziger-1997]. 2) One common theme in classical Indian philosophy is that the phenomena that would be labelled as “emotions” in Western philosophy are to be eradicated because they prevent liberation. 3) None of the Indian philosophical schools aim at “emotion-free” cognitions as an end in itself. In fact, those states that would be labelled “cognitions” in Western philosophy are also to be eradicated because they also prevent liberation. 4) Indian schools differ over the inclusion of feeling states under the concept of *vijñāna* (cognition). Some schools distinguish between feeling states and *vijñāna* whereas others, most notably Buddhists, do not. This last point suggests that there is an interesting comparison to be made between Buddhist accounts and cognitive accounts of the emotions. However, any comparison must be sensitive to the difficulties in translating the concepts involved."
  step1: "这一概述中浮现出若干主题：1）西方“认知”与“情感”的范畴在古典印度哲学中没有对应物。这很有趣，因为它表明这些概念不是心理范畴，而也许是社会范畴。虽然已经有一些人类学工作（例如 Catherine Lutz 关于不同文化中具体情感分类之差异的工作），但整个范畴可能无法翻译进所有文化（参见 Danziger 1997）[^danziger-1997]。2）古典印度哲学中的一个共同主题是，在西方哲学中会被标记为“情感”的现象应当被根除，因为它们阻止解脱。3）没有任何印度哲学学派以“无情感”的认知本身为目的。事实上，那些在西方哲学中会被标记为“认知”的状态也应当被根除，因为它们也阻止解脱。4）印度各学派在把感受状态纳入 *vijñāna*（认知）概念这一点上有所不同。有些学派区分感受状态与 *vijñāna*，而另一些学派，尤其是佛教徒，则不区分。最后一点表明，在佛教说明与认知式的情感说明之间可以作出有趣的比较。然而，任何比较都必须对翻译所涉及概念的困难保持敏感。"
