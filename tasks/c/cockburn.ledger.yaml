    source: |-
      Cockburn was born in London on August 16, 1679.[^note-1] As a child, she taught herself to write, became proficient in French, and studied Latin grammar and logic. In addition to her studies, she devoted time to writing plays. In 1695, Cockburn’s first play *Agnes de Castro* was staged, and was published the following year. In 1698, her second play, *Fatal Friendship*, was staged and printed. Both plays were very well received and she enjoyed some celebrity in theatrical circles. Cockburn wrote three more plays over the next three years.
    step1: |-
      考克本于 1679 年 8 月 16 日出生于伦敦。[^note-1] 童年时，她自学写作，精通法语，并研习拉丁语语法与逻辑。除学业外，她还投入时间创作剧本。1695 年，考克本的第一部剧作《阿格尼丝·德·卡斯特罗》（*Agnes de Castro*）上演，并于次年出版。1698 年，她的第二部剧作《致命的友谊》（*Fatal Friendship*）上演并印行。两部剧作都广受好评，她在戏剧界享有一定名声。此后三年间，考克本又创作了三部剧本。
    step2: |-
      考克本于 1679 年 8 月 16 日生于伦敦。[^note-1] 她童年自学写作，通晓法语，并研习拉丁语法与逻辑。除学业之外，她还投入时间撰写剧本。1695 年，考克本的第一部剧作《阿格尼丝·德·卡斯特罗》（*Agnes de Castro*）上演，次年出版。1698 年，她的第二部剧作《致命的友谊》（*Fatal Friendship*）上演并印行。两部剧作均大获好评，她在戏剧圈中声名鹊起。此后三年间，考克本又创作了三部剧本。
