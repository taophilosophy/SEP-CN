    source: |-
      While Catharine Trotter was establishing her reputation as a playwright, she was also studying Locke’s work, *An Essay Concerning Human Understanding*. Trotter was so deeply impressed with his ideas that she felt obliged to take up her pen in defense of Locke. Cockburn’s first philosophical work, published in 1702 and entitled *The Defence of Mr. Locke’s Essay of Human Understanding*, was a response to a series of three anonymously-penned pamphlets critical of Locke’s *Essay*. Locke himself was so impressed with the work, he presented Cockburn with a substantial gift of money and books in appreciation.
    step1: |-
      当凯瑟琳·特洛特（Catharine Trotter）正在建立其剧作家声誉时，她也在研读洛克的著作《人类理解论》（*An Essay Concerning Human Understanding*）。洛克的思想给她留下了极为深刻的印象，以至于她感到不得不提笔为洛克辩护。考克本的第一部哲学著作于 1702 年出版，题为《为洛克〈人类理解论〉一书的辩护》（*The Defence of Mr. Locke's Essay of Human Understanding*），它是对一系列三篇匿名撰写、批评洛克《人类理解论》的小册子的回应。洛克本人对这部著作印象极深，遂赠予考克本一笔可观的金钱与书籍以表谢意。
    step2: |-
      当凯瑟琳·特洛特（Catharine Trotter）正逐步奠定其剧作家声誉时，她也在研读洛克的著作《人类理解论》（*An Essay Concerning Human Understanding*）。洛克的思想令她深受触动，以至于她感到不得不提笔为洛克辩护。考克本的第一部哲学著作于 1702 年出版，题为《为洛克〈人类理解论〉一书的辩护》（*The Defence of Mr. Locke's Essay of Human Understanding*），该书是对一系列三篇匿名撰写、批评洛克《人类理解论》的小册子的回应。洛克本人对这部著作赞赏有加，遂赠予考克本一笔可观的金钱与书籍以示感谢。
