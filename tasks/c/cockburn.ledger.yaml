  - id: 8
    source: |-
      Much of the groundwork for her view is laid in the *Defence*. This was written as a response to the *Remarks Upon an Essay Concerning Humane Understanding*, a series of three pamphlets published between 1697 and 1699 that aimed to expose the deficiencies of Locke’s empiricism. The *Remarks* were published anonymously and their authorship has been the source of some controversy. Long thought to have been written by Thomas Burnet, this attribution has recently been challenged (see Walmsley, *et al*., 2016); the author shall be referred to here as the Remarker. The *Remarks* raised doubts concerning the tenability of Locke’s epistemology as a foundation for, among other things, moral knowledge. In the *Essay* and other works, Locke had suggested that morality could be known by reason and had emphasized the demonstrative character of morality – thereby making a claim to the certainty with which moral ideas could be known. However, Locke never provided an explicit account of how fundamental moral ideas are derived. The Remarker concludes that Locke’s epistemology is simply insufficient to the task, and that moral ideas, on Locke’s system, remain as uncertain as the ideas of God’s nature and the immortality of the soul. The Remarker uses the critique of Locke as the springboard for their own moral position, one best described as a brand of moral sense theory, in which conscience is the human capacity for empirically discerning the moral value of acts. In other words, one can, upon observing a given set of circumstances, know with immediate certainty whether that act is morally good or evil.
    step1: |-
      她的观点的大部分基础工作是在《辩护》中奠定的。这部著作是对《对〈人类理解论〉的评论》（*Remarks Upon an Essay Concerning Humane Understanding*）的回应，后者是一系列三篇出版于 1697 至 1699 年间、旨在揭露洛克经验主义缺陷的小册子。《评论》是匿名出版的，其作者归属一直存在争议。长期以来被认为出自托马斯·伯内特（Thomas Burnet）之手，这一归属近来受到质疑（见 Walmsley, *et al.*, 2016）；此处将称作者为“评论者”（Remarker）。《评论》对洛克认识论作为（除其他外）道德知识基础的可辩护性提出了疑问。在《人类理解论》和其他著作中，洛克曾暗示道德可以凭借理性被认识，并强调了道德的演证性质——从而主张道德观念能够被认识的确定性。然而，洛克从未提供关于基本道德观念如何被推导出来的明确说明。评论者得出结论：洛克的认识论不足以胜任这一任务，而且在洛克体系中，道德观念仍像上帝本性的观念与灵魂不朽的观念一样不确定。评论者以对洛克的批评作为其自身道德立场的跳板，这一立场最恰当的描述是一种道德感理论，其中良心是人类凭经验辨明行为之道德价值的能力。换言之，一个人在观察既定的环境后，能够立刻确切地知道该行为在道德上是善还是恶。
