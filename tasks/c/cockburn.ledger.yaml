    source: |-
      Although primarily concerned with moral issues, Cockburn philosophical writings (which are taken here to include *The Defence of Mr. Locke’s Essay of Human Understanding* (hereafter referred to as the *Defence*), *Remarks upon some Writers* and *Remarks upon the Principles and Reasonings of Dr. Rutherforth’s* Essay) address a range of philosophical issues. In the *Defence*, she addresses a series of issues surrounding Locke’s empiricism, which include not only moral knowledge, but also the knowledge humans can have of God’s veracity and of the immortality of the human soul. There is also a broad range of topics addressed in her work *Remarks upon some Writers*, in which Cockburn begins by addressing several philosophical issues – necessity, the infinitude of space, and the nature and existence of spirits with regard to the notion of substance. The latter discussion revolves generally around epistemological concerns regarding the knowledge of real essences and the nature of substance, in which she argues that spirits must have extension of a sort in order to be proper substances. She makes this argument by appeal to a broadly Lockean view regarding substance.
    step1: |-
      尽管主要关注道德问题，考克本的哲学著作（这里被视为包括《为洛克〈人类理解论〉一书的辩护》（下文简称《辩护》）、*Remarks upon some Writers* 和 *Remarks upon the Principles and Reasonings of Dr. Rutherforth's* Essay）却涉及一系列广泛的哲学问题。在《辩护》中，她讨论了围绕洛克经验主义的一系列问题，这些不仅包括道德知识，还包括人类所能拥有的关于上帝之诚实与人类灵魂不朽的知识。她的著作《评论》也涉及广泛的主题，考克本在其中首先讨论了若干哲学问题——必然性、空间的无限性，以及就实体概念而言的精神体的本性与存在。后一讨论大体围绕关于实在本质的知识与实体本性的认识论关切而展开，在其中她论证，精神体必须具有某种广延，才能成为真正的实体。她通过诉诸一种广义的洛克式实体观来作出这一论证。
