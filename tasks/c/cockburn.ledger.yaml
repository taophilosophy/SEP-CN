      In the *Defence*, Cockburn also introduces the idea of ‘conscience’ as a way of accounting for human moral sentiment. According to Cockburn, conscience is a faculty, which she describes as a “sudden affection.” This idea of conscience as a kind of natural moral affection complements Cockburn’s view that morality is founded upon human nature: Moral *knowledge* arises from reflection upon our own natures and moral *affection* arises out of our natural constitutions. Cockburn uses this notion of conscience as a response to the Remarker’s account of morality. She argues that conscience is not an immediate source of moral knowledge, but a source of moral affection or feeling that complements, and presupposes, a proper (i.e., rational) knowledge of moral laws.
    step1: |-
      在《辩护》中，考克本还引入了“良心”（conscience）这一观念，作为说明人类道德情感的一种方式。根据考克本，良心是一种官能，她将其描述为一种“突然的情感”（sudden affection）。这种把良心视为一种自然道德情感的观念，补充了考克本关于道德植根于人性的观点：道德 **知识** 源于对我们自身本性的反思，而道德 **情感** 源于我们的自然构造。考克本运用这一良心概念来回应评论者的道德说明。她论证说，良心不是道德知识的直接来源，而是道德情感或感受的来源，它补充并预设了对道德法则的恰当（即理性的）认识。
