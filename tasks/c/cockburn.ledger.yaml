    source: |-
      Cockburn was also deeply interested in religious issues and she wrote and published a series of theological works. These included a work, in the form of two letters, that examined Catholic and Protestant doctrine entitled *A Discourse concerning a Guide in Controversies*. This work was first published in 1707. Another work, first published in 1726, entitled *A Letter to Dr. Holdsworth Occasioned by his Sermon*, was mainly a defense of Locke’s orthodoxy against charges of heresy. She wrote and published a second *Vindication* of Locke’s orthodoxy against Holdsworth, in two parts.This work was not published until it was included in Cockburn’s collected works; Cockburn’s work had attracted sufficient attention that Thomas Birch approached her with the idea of a volume of her collected works, including her correspondence. She aided in the editing of this work, but did not live to see its publication in 1751. She died in May of 1749.
    step1: |-
      考克本对宗教问题也怀有浓厚兴趣，她撰写并出版了一系列神学著作。其中包括一部以两封信形式写成的著作，考察天主教与新教教义，题为《论争论中的指南》（*A Discourse concerning a Guide in Controversies*）。这部著作于 1707 年首次出版。另一部于 1726 年首次出版的著作，题为《致霍尔斯沃思博士的信——由其布道所引发》（*A Letter to Dr. Holdsworth Occasioned by his Sermon*），主要是为洛克的正统性辩护，反驳异端指控。她还撰写并出版了为洛克的正统性所作的第二次《申辩》（*Vindication*），针对霍尔斯沃思，分两部分。这部著作直到被收入考克本的文集时才得以出版；考克本的著作已引起足够关注，托马斯·伯奇（Thomas Birch）遂向她提议出版一卷本文集，包括她的书信。她协助编辑了这部文集，但未能亲眼看到它在 1751 年出版。她于 1749 年 5 月去世。
