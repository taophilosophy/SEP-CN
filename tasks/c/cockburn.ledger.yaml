      Cockburn responds to the *Remarks* by showing that Locke’s epistemology can satisfy these concerns. Cockburn approaches the question of Locke’s epistemological foundations by emphasizing an aspect of Locke’s theory of ideas of which Locke himself makes little use in his account of moral knowledge. However, it is a concept that he uses in his proof of God’s existence (the proof of which Cockburn reiterates in her *Defence*). Cockburn’s moral theory employs Locke’s concept of reflection as a foundation not just for our knowledge of God, but also as a means for human moral knowledge. She argues that it is by reflecting upon the operations of our own minds that we can reach an understanding of both human and divine nature. According to Cockburn, morality is grounded in human nature, and the truth of moral laws is guaranteed by the fact that humans are designed by God. This emphasis on human nature leads Cockburn quite naturally into a fitness account of morality that predates Clarke’s own view – human nature entails that certain actions are fit and appropriate for humans and certain are not. In later works, Cockburn explicitly adopts the language of fitness relations to describe the necessary moral order arising from our created natures.
    step1: |-
      考克本通过表明洛克的认识论能够满足这些关切来回应《评论》。考克本通过强调洛克观念论的一个方面来探讨洛克认识论基础的问题，而洛克本人在其道德知识说明中很少利用这一方面。然而，这一概念是他在证明上帝存在时所使用的（考克本在其《辩护》中重申了这一证明）。考克本的道德理论将洛克的反思概念用作基础，不仅用于我们对上帝的认识，也用作人类道德知识的手段。她论证说，正是通过反思我们自身心灵的运作，我们才能获得对人类与神性本性的理解。根据考克本，道德植根于人性，而道德法则的真理性由这一事实所保证：人类是由上帝设计的。这种对人性的强调相当自然地把考克本引向一种早于克拉克本人观点的道德适宜性说明——人性意味着某些行为对人类而言是适宜而恰当的，某些则不然。在后期著作中，考克本明确采用适宜关系的语言来描述由我们被造的本性所产生的必然道德秩序。
