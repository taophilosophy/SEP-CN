      Here again, Cockburn sought to distance herself from Hutcheson’s moral sense theory. For Cockburn, moral sense was an important factor in accounting for moral judgments, but she insisted on its subordination to reason as a guide in moral judgment. She holds this moral sense account in concert with her fitness view. She presents her moral sense theory within the context of a general moral fitness theory, suggesting that Clarkean moral fitness theory could easily accommodate such an account. In this way, Cockburn sees herself as offering an account of moral motivation not entirely obvious in Clarke’s theory, but tempering the suggestion of blind instinct she sees in Hutcheson’s moral sense view. Cockburn’s morality sought to establish a foundation for morality in human nature that sufficiently accounted for the type of natural and seemingly immediate human moral sensibility that the Remarker believed was not accounted for by Locke and that Clarke’s critics saw as lacking in his fitness view.
    step1: |-
      在这里，考克本再次试图与哈奇森的道德感理论保持距离。对考克本而言，道德感是说明道德判断的一个重要因素，但她坚持道德感应服从于理性，作为道德判断的指导。她把这种道德感说明与她的适宜性观点结合在一起。她在一个普遍的道德适宜性理论的语境中呈现她的道德感理论，暗示克拉克式的道德适宜性理论能够轻易容纳这样一种说明。这样，考克本认为自己提供了一种在克拉克理论中并不完全明显的道德动机说明，同时缓和了她所看到的、哈奇森道德感观点中盲目本能的暗示。考克本的道德观试图在人性中确立道德的基础，这种基础充分说明了那种自然的、看似直接的人类道德敏感性，而评论者认为这种敏感性未被洛克所说明，克拉克的批评者则在其适宜性观点中看到其缺失。
