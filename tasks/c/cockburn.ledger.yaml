      In later works, Cockburn adopts the term ‘moral sense’ to describe the affective faculty of conscience, a term which is not meant to signal any affinity with Francis Hutcheson. She understood Hutcheson to found morality exclusively on the moral sense while her own view sees moral sense as only one component within a largely rationalistic account of human moral understanding. It is not surprising that Cockburn developed a proto-moral sense theory in the *Defence* and in later works. She sought early on to establish a foundation for morality in human nature that sufficiently accounted for the type of natural and seemingly immediate human moral sensibility that the Remarker believed was not accounted for by Locke.
    step1: |-
