      Not a great deal hangs on that thesis, at any rate. A great deal more hangs on the thesis that art essentially exercises the expressive imagination. The difference between the imagined lecture and the tune is that the content of the lecture is verbal and cognitive, and brings those departments of mind into play; whilst the tune, among other things, brings the emotional department of the mind much more vividly into play. The substance of Collingwood’s view is largely dependent on his account of this distinction.
