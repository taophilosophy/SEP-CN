      Collingwood begins his account of the relation between artist and spectator by saying that a spectator understands a given work just insofar as his imaginative experience is identical with that had by the artist in creating it. This can never be known with certainty, but so it is with all understanding of language (remember that ‘language’ in Collingwood’s usage means all expressive behaviour). It is also piecemeal: ‘Understanding … is a complex business, consisting of many phases, each complete in itself but each leading on to the next’ (311). Collingwood does speak of *identity* of understanding, but really his real account is more fluid. First, he accepts that any utterance is endlessly interpretable; there no such thing as ‘the’ meaning of a work (*ibid.*). Second, the audience’s role is collaborative, in the sense that the artist is concerned to express emotions that are mutually held; failure in this may rightly cause the artist to doubt whether he expressed anything, and suffers instead from a ‘corruption of consciousness’ as explained earlier. The audience, then, actively participates in re-creating the imaginative experience. This second point flows from his conception of art as a language:

      > The child learning his mother tongue, as we have seen, learns simultaneously to be a speaker and to be a listener; he listens to others speaking, and speaks to others listening. It is the same with artists. They become poets or painters or musicians not by some process of development from within, as they grow beards; but by living in a society where these languages are current. Like other speakers, they speak to those who understand. (317)[^note-1]
    step1: |-
      柯林武德开始论述艺术家与观赏者之间的关系时说，一个观赏者理解一件既定作品，仅仅当其想象经验与艺术家创造它时所具有的经验相同。这永远无法被确实地知道，但对语言的一切理解也是如此（记住，柯林武德用法中的“语言”指一切表现性行为）。它也是零碎的：“理解……是一件复杂的事情，由许多阶段组成，每一个阶段本身完整，但每一个都导向下一个”（311）。柯林武德确实谈到理解的*同一性*，但他的真正说明其实更流动。首先，他承认任何言说都可以无休止地解释；一件作品不存在“那个”意义（同上）。其次，观众的角色是协作性的，因为艺术家所关注的是表现彼此共同持有的情感；在这方面失败可能正当地使艺术家怀疑他是否表现了任何东西，转而遭受前面解释的“意识败坏”。那么，观众积极地参与重新创造想象经验。这第二点源于他把艺术视为一种语言的观念：

      > 孩子学习母语，正如我们所见，同时学会做一个说话者和一个听者；他听别人说话，也对听者说话。艺术家也一样。他们成为诗人、画家或音乐家，不是靠某种从内部发展的过程，如同他们长胡子那样；而是靠生活在这些语言通行的社会中。像其他说话者一样，他们对那些理解的人说话。（317）[^note-1]
    step2: |-
      柯林武德开始论述艺术家与观赏者之间的关系时说，一个观赏者理解一件既定作品，仅当他的想象经验与艺术家创造它时所具有的经验相同。这一点永远无法确知，但对语言的一切理解都是如此（记住，柯林武德用法中的“语言”指一切表现性行为）。它也是零敲碎打的：“理解……是一件复杂的事情，由许多阶段组成，每一阶段自身完整，但每一阶段又导向下一阶段”（311）。柯林武德确实谈到理解的*同一性*，但他的真实说明其实更为流动。首先，他承认任何言说都可以无休止地加以解释；一件作品并不存在“唯一”的意义（同上）。其次，观众的角色是协作性的，因为艺术家所关切的是表现彼此共同持有的情感；在这方面受挫，可能正当地使艺术家怀疑自己是否表现了什么，转而承受前面所解释的“意识败坏”。那么，观众便积极地参与重新创造那想象经验。这第二点源于他把艺术视为一种语言的观念：

      > 孩子学习母语，正如我们所见，同时学会做一个说话者与一个听者；他听别人说话，也对听者说话。艺术家亦然。他们成为诗人、画家或音乐家，不是靠某种从内部发展的过程，如同他们长胡子那样；而是靠生活在这些语言通行的社会之中。像其他说话者一样，他们向那些理解的人说话。（317）[^note-1]
