      An apparent further defect in Collingwood’s case in particular is his account of language. It is full of admirable insights, but it is probably misconceived from back to front. The insistence that language is always expressive is dogmatic, and leads Collingwood to deny that there is any categorical distinction between poetry and scientific writing, which many may take as a *reductio ad absurdum* (298). And more seriously so far as his philosophy of art is concerned, one might wonder about his account of consciousness as tied to language. According to it—the theory of imagination—merely to attend to something is thereby to *express* it, and furthermore is to do something *linguistic.* Even if we allow Collingwood his generalised notion of language as appertaining to gesture and so on, surely there has to be a separation between consciousness or attention and expression. As C. J. Ducasse pointed out, it seems that when we look at a vase full of flowers, do we not create a “work of art” unless we draw or paint it (Ducasse 1929, 52–54)[^ducasse-1929].
    step1: |-
      柯林武德论点中的一个明显的进一步缺陷是他的语言论述。它充满令人钦佩的洞见，但很可能从头到尾都是误解的。坚持语言总是表现性的，是教条主义的，并导致柯林武德否认诗歌与科学写作之间存在任何范畴性的区分，许多人可能把这看作一个*归谬法*（298）。而就他的艺术哲学而言更严重的是，人们可能会对他把意识与语言绑在一起的论述感到疑惑。按照它——想象的理论——仅仅注意某物就因此*表现*了它，而且进一步是做了某种*语言性*的事情。即使我们允许柯林武德那属于手势等等的广义语言概念，意识或注意与表现之间肯定必须有一个分离。正如 C. J. 杜卡斯（C. J. Ducasse）指出的，当我们看着一个装满花的花瓶时，似乎除非我们画下或描绘它，否则我们不会创造一件“艺术作品”（Ducasse 1929, 52–54）[^ducasse-1929]。
    step2: |-
      柯林武德论点中的一个明显的进一步缺陷，是他对语言的论述。其中充满可钦佩的洞见，但它很可能前后颠倒、整个误入歧途。坚持语言总是表现性的，是教条主义的，并导致柯林武德否认诗歌与科学写作之间存在任何范畴性的区分——许多人或可把这视为一个*归谬法*（298）。而就他的艺术哲学而言更严重的是，人们可能会对他把意识与语言相绑缚的论述感到疑惑。按照这一论述——想象的理论——仅仅注意某物便因此*表现*了它，并且进一步是做了某种*语言性*的事情。即使我们允许柯林武德那及于手势等等的广义语言概念，意识或注意与表现之间肯定也得有一个分离。正如 C. J. 杜卡斯（C. J. Ducasse）所指出的：当我们注视一只插满花的花瓶时，除非我们把它画下来或描下来，否则我们似乎并不创造一件“艺术作品”（Ducasse 1929, 52–54）[^ducasse-1929]。
