      无论如何，那个论题并没有太多利害攸关。更重要的利害攸关的是艺术本质上行使表现性想象这一论题。想象的讲座与曲调之间的区别在于：讲座的内容是言语的和认知的，并使心灵的那些部门发挥作用；而曲调则除了其他东西外，更生动地使心灵的情感部门发挥作用。柯林武德观点的实质在很大程度上依赖于他对这一区分的说明。
