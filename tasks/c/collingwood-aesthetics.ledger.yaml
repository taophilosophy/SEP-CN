      Collingwood advances a very liberal notion of representation, such that a great deal more artefacts than one would initially think could rightly qualify as representative. For the standard for fidelity is not resemblance, but that the feeling evoked by the artefact resembles that evoked by the original. Representation comes in three, overlapping degrees. The first is that of the ordinary photograph, or paintings and the like which attempt that sort of literalness. The second is that whereby the painter – he mentions van Gogh – ‘leaves out some things that he sees, modifies others, and introduces some which he not does see in his sitter at all’ (53–4). At the extreme, he may paint mere patterns, for example, of a dance, leaving out the dancers. The third is ‘emotional representation’, which represents the inner aspect of emotion, but which is nevertheless distinct from expression. Some types of music, on this view, represent the mind undergoing its experiences, such the feeling of ‘lying in deep grass on a summer’s day watching clouds drift across the sky’ (56). Collingwood does not say what the exact difference is between representation and expression, but I assume that it depends first of all on whether or not the artist has a clear conception of what he is trying to represent; if he does, then his activity is craft, not art proper. As we will see below, this is not implausible because the artist, at least according to Collingwood, does not literally know the expressive content of his artwork in advance of expressing it. It would be in keeping with Collingwood’s approach to add that the expressed content is *individual*, whereas represented contents are always *general*; perceptually quite different works can represent exactly the same thing.
    step1: |-
      柯林武德提出了一个非常宽泛的再现概念，使得比人们最初想到的多得多的器物都能正当地算作再现性的。因为忠实性的标准不是相似，而是器物所唤起的情感相似于原件所唤起的情感。再现分为三种相互重叠的程度。第一种是普通照片，或试图达到那种字面逼真性的绘画之类。第二种是画家——他提到凡高——“略去他所看到的一些东西，改变另一些，并引入一些他在模特身上根本看不到的东西”（53–4）。在极端情况下，他可能只画单纯的图案，例如一场舞蹈的图案，而略去舞者。第三种是“情感再现”，它再现情感的内在方面，但尽管如此与表现不同。按照这种观点，某些类型的音乐再现心灵正在经历其经验，例如“夏日里躺在深草丛中观看云朵飘过天空”的感觉（56）。柯林武德没有说表现与再现的确切区别是什么，但我假定它首先取决于艺术家是否对自己试图再现的东西有清晰的观念；如果他有，那么他的活动就是技艺，而不是真正的艺术。正如我们下面将看到的，这并非不合理，因为艺术家——至少按照柯林武德——在表现之前并不真正知道他艺术作品的表现内容。与柯林武德的方法相一致，还可以补充说：被表现的内容是*个别的*，而被再现的内容总是*一般的*；知觉上相当不同的作品可以再现完全相同的东西。
