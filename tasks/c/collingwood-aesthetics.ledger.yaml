      Sensa are occurrent phenomena, and therefore fleeting (222): If I hear the bell striking the hour of four, the experience comprises many passing sensa, each no sooner generated than gone. But if I am to be aware of them as a process extended in time with particular morphology, I must retain the sound of the bell, along with the silences in between. The objects that I so retain cannot be the sensa themselves. Instead, the faculty of ‘conscious attention’ generates ‘ideas’ corresponding to the sensa, and which are retained. Sensa alone—or sense data, or impressions—are never sufficient for consciousness. Collingwood cites Kant approvingly in the connection; noting that we have always to ‘fill in’ occurrent perception to generate a complete world of 3-D objects, he writes:

      > Moreover (this is a point Kant has made), it is only so far as I imagine them that I am aware of the matchbook as a solid body at all. A person who could really see, but could not imagine, would see not a solid world of bodies of bodies, but merely (as Berkeley has it) ‘various colours variously disposed’. Thus, as Kant says, imagination is an ‘indispensable function’ for our knowledge of the world around us. (192)
    step1: |-
      Sensa 是偶发现象，因而是短暂的（222）：如果我听到钟敲四点，这一经验包含许多流逝的 sensa，每一个刚刚产生便消失了。但如果我要把它们意识到为一种在时间中延展的、具有特定形态的过程，我就必须保留钟声，连同其间的静默。我如此保留的对象不可能是 sensa 本身。相反，“意识注意”的官能产生对应于 sensa 并被保留的“观念”。单单 sensa——或感觉材料、或印象——绝不足以构成意识。柯林武德在这方面赞同地引用康德；他指出我们必须始终“填补”偶发知觉以生成一个完整的立体对象世界，他写道：

      > 此外（这是康德提出的一个要点），只是在我想象它们的范围内，我才把火柴盒意识到为一个实体。一个真正能看但不能想象的人，看到的不是物体的实体世界，而只是（如贝克莱所说）“以各种方式排列的各种颜色”。因此，正如康德所说，想象对于我们周围世界的知识是一种“不可或缺的功能”。（192）
    step2: |-
      Sensa 是偶发现象，因而转瞬即逝（222）：如果我听到钟敲四点，这一经验包含许多流逝的 sensa，每一个刚一产生便已消失。但如果我要把它们意识到为一种在时间中延展、具有特定形态的过程，我就必须保留那钟声，连同其间的静默。我如此保留的对象不可能是 sensa 本身。相反，“意识注意”的官能产生与 sensa 相对应的、并被保留的“观念”。单单 sensa——或感觉材料、或印象——绝不足以构成意识。柯林武德在这方面赞许地引用康德；他指出，我们总须“填补”偶发知觉，以生成一个完整的立体对象世界，他写道：

      > 此外（这是康德提出的一个要点），唯有在我想象它们的范围内，我才把火柴盒意识到为一个实体。一个真正能看却不能想象的人，看到的不是物体的实体世界，而只是（如贝克莱所说）“以各种方式排列的各种颜色”。因此，正如康德所说，对于我们周围世界的知识，想象是一种“不可或缺的功能”。（192）
