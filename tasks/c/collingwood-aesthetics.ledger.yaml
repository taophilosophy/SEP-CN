      这最后一点表明存在所谓“审美情感”，但它“不是先于其表现而存在的特定种类的情感”（117）。相反，它是“伴随任何情感之表现的情感着色”（同上）。在这种意义上，表现必须与情感的泄露严格区分；可以说一个人的眼泪“表现”他的悲伤，或跺脚表现他的愤怒，但这些可以在没有使情感清晰可解——这是柯林武德意义上的表现所必需的——的情况下发生。泄露甚至可以完全是无意识的；一个人可以在毫不察觉的情况下脸红。表现对象与情感之间的关系是体现或实现的关系，而不是推理的关系。
