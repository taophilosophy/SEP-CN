      What precisely is the motivation for this move, the conception of the work of art as imagined or ideal object? Leave aside the special cases of music and poetry, which Richard Wollheim notes have the special feature that they can be written down (see Wollheim 1972)[^wollheim-1972]. Why not conceive painting, for example, as the creation of certain painted objects? This would be consistent with the thesis that painting is a not craft. The answer given by Collingwood is clear, but leads to trouble when we consider the question of interpretation. An experience of a painting involves a great deal that no one would say is ‘in the painting’, which is, after all, a nearly flat canvas with paint on it. Not only do we see things that are not really present, but for example we have impressions of space and mass, perhaps by means of what Berenson called ‘ideated sensations’—those which involve imaginary motor or kinaesthetic sensations. These phenomena are not literally features of the canvas, but they are in some sense features of the work. So Collingwood, in brief, includes within the work of art proper all that would normally be ascribed to the (correct) interpretation—the (correct) experience—of the artwork. But there is no reason to accept this, any more we should include all the relational facts—sowing, fertilization, watering and so on—that contribute to a growing plant to the plant itself. On contrary, the position makes it impossible for two spectators to disagree on the interpretation of a work. Irrespective of the concern with the privacy of the experience, if they attribute different properties to the object—that is, they find different properties in their respective total imaginative experiences—they are simply concerned with different objects, and their verdicts are compatible. We could set the artist’s own experience as a criterion of understanding the work, but that would make his death significant in way that we do not actually recognize, and would run against the grain of Collingwood’s antipathy to aesthetic individualism and the ‘cult of genius’, discussed below. As a matter of speculation, Collingwood perhaps thought that aesthetically relevant properties—expressive properties—have to be intrinsic properties of the work of art; in that case, perhaps his conclusion does follow. But it is much more satisfactory to hold that what we are arguing over when we disagree over the expressive properties of a work of art is the same object.
    step1: |-
      这一步——把艺术作品设想为想象的对象或观念对象——的确切动机是什么？撇开音乐和诗的特殊情况不谈，理查德·沃尔海姆（Richard Wollheim）指出它们具有可以被写下来的特殊特征（见 Wollheim 1972）[^wollheim-1972]。为什么不把例如绘画设想为某些被画的对象的创造呢？这将与绘画不是技艺这一论题一致。柯林武德给出的答案是清楚的，但当我们考虑解释问题时，它会导致麻烦。对一幅画的体验涉及大量没有人会说“在画中”的东西，而画毕竟是一块近乎平坦、上面涂有颜料的画布。我们不仅看到并非真正在场的东西，而且例如我们还有空间和体量的印象，也许通过贝伦森（Berenson）所称的“观念化感觉”——那些涉及想象的运动或动觉感觉。这些现象并非字面上属于画布的特征，但在某种意义上它们是作品的特征。所以柯林武德，简言之，把通常归于艺术作品之（正确的）解释——（正确的）体验——的一切都包括在真正的艺术作品之内。但没有理由接受这一点，正如我们也不应把一切有助于植物生长的关系性事实——播种、受精、浇水等等——都包括在植物本身之内。相反，这一立场使得两个观赏者不可能在一件作品的解释上意见相左。撇开对体验之私密性的关切不谈，如果他们归于对象不同的属性——即他们在各自的总想象经验中发现不同的属性——那么他们只是关涉不同的对象，他们的判断是相容的。我们可以把艺术家自己的体验当作理解作品的标准，但这会使他的死亡以一种我们实际上并不承认的方式变得重要，并且会与柯林武德对审美个人主义和“天才崇拜”的反感相抵触，下文将讨论这一点。作为一种猜测，柯林武德也许认为审美上相关的属性——表现性属性——必须是艺术作品的内在属性；在那种情况下，也许他的结论确实成立。但更令人满意的是主张：当我们对一件艺术作品的表现性属性意见分歧时，我们所争论的是同一对象。
    step2: |-
      这一步——把艺术作品设想为想象的对象或观念的对象——的确切动机是什么？撇开音乐与诗的特殊情况不谈，理查德·沃尔海姆（Richard Wollheim）指出它们具有可被写下来的特殊特征（见 Wollheim 1972）[^wollheim-1972]。例如，为何不把绘画设想为某些被画之物的创造？这将与“绘画不是技艺”这一论题相一致。柯林武德给出的答案固然清楚，但当我们考虑解释问题时，却会引出麻烦。对一幅画的体验包含大量无人会说是“在画中”的东西，而画毕竟是一块近乎平坦、上面涂着颜料的画布。我们不仅看到并非真实在场的东西，而且例如我们还有关于空间与体量的印象，或许是通过贝伦森（Berenson）所称的“观念化感觉”——那些涉及想象的运动觉或动觉的感觉。这些现象并非字面上属于画布的特征，但在某种意义上它们确是作品的特征。所以柯林武德，简言之，把通常归于艺术作品之（正确的）解释——（正确的）体验——的一切，都纳入真正的艺术作品之内。但没有理由接受这一点，正如我们也不应把一切有助于植物生长的关系性事实——播种、受精、浇水等等——都归入植物本身。相反，这一立场使得两位观赏者不可能在一件作品的解释上意见相左。撇开对体验之私密性的关切不论，如果他们归于对象以不同的属性——即他们在各自的总想象经验中发现不同的属性——那么他们只是关涉不同的对象，他们的判断是相容的。我们固然可以把艺术家自己的体验当作理解作品的标准，但那会使他的死亡以一种我们实际上并不承认的方式显得重要，并与柯林武德对审美个人主义与“天才崇拜”的反感相抵触——下文将讨论。作为一种猜测，柯林武德也许认为审美上相关的属性——表现性属性——必须是艺术作品的内在属性；若如此，也许他的结论确实成立。但更令人满意的主张是：当我们对一件艺术作品的表现性属性意见分歧时，我们所争论的是同一个对象。
