      But the act of ‘preserving them’ has to be understood in a special sense. ‘There is no question’, says Collingwood, “of ‘externalizing’ an inward experience which is complete in itself and by itself” (304). Collingwood is denying that a painter could in point of fact dispense with the medium, even if in principle he could (in sense of ‘could in principle’ in which a man might run a hundred miles per hour). Instead, although ‘you see something in your subject, of course, before you begin to paint it’ (303), the ‘experience develops itself and defines itself in your mind as you paint’ (*ibid.*). The work of art develops by means of positive feedback between painting and experience. What develops is the ‘total imaginative experience’ that Collingwood identifies as the work of art, strictly speaking (304). Again, the work of art proper is not to be identified with the ‘bodily work’—the painted canvas, the sculpted bust—but with the experience of it. What is true that in point of fact the imaginative experiences requires the bodily work; the human imagination is not able to hold within it anything approaching the richness made available by the plastic arts. In particular, the ‘outward element’—the bodily work—provides the sensuous content or impressions out of which the conscious imagination generates ideas, constituting the ‘total imaginative experience’ (see Davies 2008 for more on this issue)[^davies-2008].
    step1: |-
      但“保存它们”的行动必须在一个特殊的意义上来理解。“毫无疑问”，柯林武德说，“把一种自身完整、靠自身完整的内在经验‘外在化’是不可能的”（304）。柯林武德否认画家事实上能省去媒介，即使原则上他能（在“原则上能”的意义上，即一个人可能每小时跑一百英里）。相反，尽管“你在开始画你的题材之前，当然，你在题材中看到某种东西”（303），但“经验在你作画时在你心中发展自身并规定自身”（同上）。艺术作品通过作画与经验之间的正反馈而发展。所发展的，是柯林武德严格说来认定为艺术作品的“总体想象经验”（304）。再说一遍，真正的艺术作品不应当与“物质性作品”——画过的画布、雕成的半身像——等同，而应当与对它的经验等同。确实，事实上想象经验需要物质性作品；人类想象无法在自身中容纳任何接近造型艺术所提供的丰富性的东西。特别是，“外在要素”——物质性作品——提供感觉内容或印象，有意识想象从其中生成观念，从而构成“总体想象经验”（关于这一问题见 Davies 2008）[^davies-2008]。
    step2: |-
      但“保存它们”这一行动必须在一个特殊的意义上来理解。柯林武德说：“把一种自身自足、凭自身而完整的内在经验加以‘外在化’，根本无从谈起”（304）。柯林武德否认画家事实上能够省去媒介，即使原则上他可以（“原则上能”的意义，即一个人也许每小时能跑一百英里）。相反，尽管“在开始画之前，你当然在你题材中看到了某种东西”（303），但“经验在你作画之际在你心中发展自身、规定自身”（同上）。艺术作品借作画与经验之间的正反馈而发展。所发展的，正是柯林武德严格说来认定为艺术作品的“总体想象经验”（304）。再强调一次，真正的艺术作品不应与“物质性作品”——涂过颜料的画布、雕成的半身像——相等同，而应与对它的经验相等同。的确，事实上想象经验需要物质性作品；人类想象无法在自身中容纳任何接近造型艺术所提供的丰富性的东西。特别是，“外在要素”——物质性作品——提供感觉内容或印象，有意识想象从其中生成观念，从而构成“总体想象经验”（关于此问题的更多讨论见 Davies 2008）[^davies-2008]。
