      Finally, it is hard to swallow whole Collingwood’s distinction between art and craft. The consequences are too severe. For example, Collingwood, rigorously applying the distinction, says that insofar as his activity is art in the proper sense, an artist, since he has no idea what he is to express until he expresses it, cannot set out to write, say, a tragedy (116).[^note-2] There is something right in the idea that that the artist cannot ‘plan and execute’ an inspiration. But the distinction Collingwood is after is surely not so cut and dried as that. He needs at any rate a more selective weapon to attack his bugbear of amusement art.
    step1: |-
      最后，很难完全吞下柯林武德对艺术与技艺的区分。后果太严重了。例如，柯林武德严格地应用这一区分说，只要他的活动是恰当意义上的艺术，一个艺术家，既然他在表现之前并不知道他要表现什么，就不能着手写，比如说，一部悲剧（116）。[^note-2] “艺术家不能‘计划和执行’一种灵感”这一观念中有一些正确的东西。但柯林武德所追求的区分肯定不是那么斩钉截铁的。他无论如何需要一个更有选择性的武器来攻击他的眼中钉——娱乐艺术。
    step2: |-
      最后，柯林武德对艺术与技艺的区分实在难以整个接受。后果太过严重。例如，柯林武德严格应用这一区分说，只要一个艺术家的活动是恰当意义上的艺术，那么由于他在表现之前根本不知道自己将要表现什么，他就不能着手去写，比如说，一部悲剧（116）。[^note-2] “艺术家不能‘计划并执行’一种灵感”这一观念确有几分道理。但柯林武德所追求的区分，肯定不是如此一刀切、如此斩钉截铁的。无论如何，他需要一个更有选择性的武器，来攻击他的眼中钉——娱乐艺术。
