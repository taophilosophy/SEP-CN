      There is however one evident mistake in Collingwood’s presentation. Sensa are, as we’ve seen, fleeting. But no idea ‘can be formed as such in consciousness except by a mind whose sense-emotional experience contains the corresponding impression … at that very moment.’ (251). This cannot be right. To understand Othello, we don’t have to actually have an impression of jealousy; we only need to have the idea. In fact, by what we said in section IV, there are no impressions (sensa) of jealousy at all; jealousy is an emotion of consciousness. The solution, which as far as I can see is consistent with everything else Collingwood says, is simply to erase the requirement that the listener must undergo anything at the psychical level, the level of sensa, *coevally* with expression (we leave open the question of whether it must have happened to one in the past).
