  - id: seg-1
    source: |-
      R. G. Collingwood (1889–1943) was primarily a philosopher of history, a metaphysican and archaeologist, and considered his work in aesthetics—the principal work being his *The Principles of Art* (1938)—as secondary (for more about his general philosophy, see the entry on Robin George Collingwood). But the work in aesthetics has enjoyed a persistent readership that continues into the present. In the years after WWII he was probably the most widely read and influential aesthetician to have written in English since Addison, Hutcheson and Hume (not counting Ruskin as an aesthetician), and to this day continues to make his way into anthologies as a principal proponent of the expressive theory of art. In the field of the philosophy of history, Collingwood famously held the doctrine of ‘Re-enactment’: since the subject is human beings in action, the historian cannot achieve understanding by describing what happened from an external point of view, but must elicit in the reader’s own mind the thoughts that were taking place in the principal actors involved in historical events. Similarly, the aesthetic procedure is one whereby the artist and spectator jointly come to realize, to come to know, certain mental states (see Guyer 2018)[^guyer-2018]. Art is fundamentally expression. Collingwood saw two main obstacles to general understanding and acceptance of this: First, the word ‘art’ has surreptitiously acquired multiple meanings among ordinary folk which should be disentangled; second, a philosophical theory of the phenomenon of expression is needed to show that it is an essential part of the life of the mind, not just a special activity that poets go in for. (Collingwood actually published an earlier theory of art in *Outlines of a Philosophy of Art*, but came to regard that theory as mistaken, superseded by the one in *Principles of Art*; what follows, and all references, concern the latter only).
    step1: |-
      罗宾·乔治·柯林武德（R. G. Collingwood，1889–1943）主要是历史哲学家、形而上学家和考古学家，他把自己在美学方面的工作——主要著作是《艺术原理》（*The Principles of Art*，1938）——视为次要的（关于其一般哲学，见“罗宾·乔治·柯林武德”词条）。但他在美学方面的工作一直拥有持久的读者，并延续至今。在二战后的年代里，他大概是自艾迪生（Addison）、哈奇森（Hutcheson）和休谟（Hume）以来用英文写作的最广泛阅读、最具影响的美学家（不算拉斯金（Ruskin）为美学家），并且至今仍作为艺术表现论的主要倡导者进入各种文集。在历史哲学领域，柯林武德以主张“重演”（Re-enactment）学说闻名：由于历史学的对象是行动中的人，历史学家不能通过从外部视角描述所发生的事情来获得理解，而必须在读者自己的心灵中唤起历史事件中主要行动者当时所进行的思想。同样，审美程序是艺术家与观赏者共同实现、共同认识某些心理状态的方式（见 Guyer 2018）[^guyer-2018]。艺术根本上是表现。柯林武德看到这一点的普遍理解和接受面临两个主要障碍：第一，“艺术”一词在普通人中悄悄获得了多种含义，应当予以厘清；第二，需要一个关于表现现象的哲学理论来表明它是心灵生活的本质部分，而不只是诗人所从事的一种特殊活动。（柯林武德其实在《艺术哲学大纲》中发表过一个更早的艺术理论，但后来认为那个理论是错误的，被《艺术原理》中的理论取代；以下所述及所有引用，都只涉及后者。）
    step2: |-
      罗宾·乔治·柯林武德（R. G. Collingwood，1889–1943）主要是一位历史哲学家、形而上学家兼考古学家，他把自己在美学上的工作——主要著作是《艺术原理》（*The Principles of Art*，1938）——视为次要的（关于其一般哲学，见“罗宾·乔治·柯林武德”词条）。然而他在美学上的工作一直拥有绵延不绝的读者，并延续至今。二战后，他大概是自艾迪生、哈奇森与休谟以来用英文写作的最广为人读、最具影响的美学家（拉斯金不算美学家），时至今日，他仍作为艺术表现论的主要倡导者不断进入各类文集。在历史哲学领域，柯林武德以“重演”说闻名：既然历史学的对象是行动中的人，历史学家便不能靠从外部视角描述发生之事来获得理解，而必须在读者自己的心灵中唤起历史事件主要行动者当时所进行的思想。与之相似，审美活动是艺术家与观赏者共同实现、共同认识某些心理状态的方式（见 Guyer 2018）[^guyer-2018]。艺术根本上是表现。柯林武德看到，这一点的普遍理解与接受面临两大障碍：其一，“艺术”一词在普通人中间悄悄获得了多种含义，需要加以厘清；其二，需要一个关于表现现象的哲学理论，以表明它是心灵生活的本质部分，而不只是诗人所从事的特殊活动。（柯林武德其实在《艺术哲学大纲》中提出过一个更早的艺术理论，但他后来认为该理论有误，被《艺术原理》中的理论所取代；下文所述及所有引证，都只针对后者。）
  - id: seg-2
    source: |-
      There are four concepts of human activity which are commonly called ‘art’, but which according to Collingwood, should be sharply distinguished from what he calls ‘art proper’. The implication is that those things are improperly so-called, that is, are commonly but wrongly called art. Since today the tendency in aesthetics is to insist that all things called ‘art’ are rightly so-called, it is important emphasize this fact; the Institutional Theory of Art, and the Theory of Mass Art, would no doubt be viewed by Collingwood as pernicious linguistic confusions. But in fact it is worse than this. Art proper is often found within the context of those other things; even particular works of art (proper) may at the same time be instances of those things. Furthermore, it is not as if ‘art’ once had the true meaning appertaining to art proper, and then got extended to these other things; the word has always been more or less subject to at least some of these confusions. The task, then, is to distinguish the concept from those of many other competing related human activities, and to claim that it alone deserves to be called art.
    step1: |-
      有四种人类活动概念通常被称作“艺术”，但按照柯林武德，它们应与他所称的“真正的艺术”（art proper）严格区分开来。其含义是，那些东西被如此称呼是不恰当的，即它们通常但错误地被称为艺术。由于今天美学中的倾向是坚持所有被称为“艺术”的东西都应当如此称呼，所以强调这一事实是重要的；艺术制度论（Institutional Theory of Art）和大众艺术论（Theory of Mass Art）无疑会被柯林武德视为有害的语言混淆。但事实上情况比这更糟。真正的艺术常常在这些其他东西的语境中被发现；甚至特定的艺术作品（真正的）也可能同时是那些东西的实例。此外，情况并非“艺术”一度具有属于真正艺术的真实含义，然后被扩展到这些其他东西；这个词一直或多或少地至少受到这些混淆中的一些的影响。因此，任务是把这个概念与许多其他相竞争的相关人类活动概念区分开来，并主张只有它才配被称为艺术。
    step2: |-
      有四种人类活动概念通常被称为“艺术”，但按柯林武德之说，它们应与他所称的“真正的艺术”严格区分。其含义是：那些东西被如此称呼并不恰当，即它们通常却被错误地叫做艺术。鉴于当今美学的倾向是坚持所有被称为“艺术”的东西都名副其实，强调这一事实便很重要；艺术制度论与大众艺术论无疑会被柯林武德视为有害的语言混淆。但实际情况比这更糟。真正的艺术常常出现在那些其他东西的语境之中；甚至某些特定的（真正的）艺术作品同时也可能是那些东西的实例。况且，情形也并非“艺术”一度具有属于真正艺术的真实含义、随后才扩展到那些东西上去；这个词向来或多或少地至少受着其中某些混淆的影响。因此，任务在于把这个概念与许多其他相竞争、相关联的人类活动概念区分开来，并主张唯有它配得上“艺术”之名。
  - id: seg-3
    source: |-
      The first of these things that is easily confused with art proper has the recommendation of having been espoused by Plato and Aristotle. This is the ‘technical’ theory of art, or the theory that art is craft (from the Greek word ‘technê’), by which we mean a fully worked out theory of crafts such as watchmaking, joinery, carpentry and so on. In fact, the theory of craft, along with the thesis that art is not craft, suffices to show that art proper is a distinct activity from the other three things, by showing that they are essentially crafts.
    step1: |-
      这些容易与真正的艺术相混淆的东西中，第一个有柏拉图和亚里士多德曾赞同它的优点。这就是艺术的“技艺”论（‘technical’ theory of art），即艺术是技艺（craft，源自希腊词“technê”）的理论，我们指的是一种关于技艺的、充分展开的理论，如制表、细木工、木工等等。事实上，技艺论连同“艺术不是技艺”这一命题，足以表明真正的艺术是与其余三种东西不同的活动，因为它表明它们本质上是技艺。
    step2: |-
      在所有这些容易与真正的艺术相混淆的东西中，第一个曾得到柏拉图和亚里士多德的赞同，这一点是它的可取之处。这就是艺术的“技艺”论，即主张艺术是技艺（craft，源自希腊词“technê”）的理论；这里所说的是关于技艺的、充分展开的理论，诸如制表、细木工、木工之类。事实上，技艺论加上“艺术不是技艺”这一命题，就足以表明真正的艺术是与其余三种东西不同的活动，因为它表明那些东西本质上都是技艺。
  - id: seg-4
    source: |-
      The term ‘craft’ refers to activities which typically exemplify the following six characteristics. None is individually necessary, but the less of them that an activity exemplifies, the less sense there is in calling it a craft: (1) The applicability of a distinction amongst actions as means and actions as ends; a baker, for example, whips the egg whites in course of mixing the batter, for the eventual end of baking a cake. (2) A distinction between planning and execution; a carpenter, for example, may draw up a plan for a table, and then in a separate action or set of actions construct a table. (3) In planning, ends precede means in that the latter are chosen for the sake of the former, but in execution the means precede the end. (4) We can distinguish between raw material and finished product. (5) A distinction can be drawn been form and matter. (6) Crafts stand in three sorts of hierarchy: (a) The raw material of one craft is the finished product of another; for example the sawmill produces plywood, which is in turn the raw material for builders. (b) One craft has as its end product the tools which are employed as means in another. (c) Some trades work in concert to bring about the finished product; for example, the manufacture of a computer may involve separable manufacture of the chip, the hard disc, the monitor and so on, so that the final assembly is ‘only the bringing together of these parts’.
    step1: |-
      “技艺”一词指通常例示以下六个特征的活动。没有一个是单独必要的，但一个活动例示的特征越少，称它为技艺就越没有意义：(1) 在作为手段的行动和作为目的的行动之间作出区分的适用性；例如，面包师在和面糊的过程中搅打蛋清，是为了最终烤制蛋糕这一目的。(2) 计划与执行之间的区分；例如，木匠可能为一张桌子制定计划，然后在另一个行动或一组行动中制作这张桌子。(3) 在计划中，目的先于手段，因为手段是为目的之故而选择的，但在执行中手段先于目的。(4) 我们可以区分原材料和成品。(5) 可以在形式与质料之间作出区分。(6) 技艺处于三种等级关系中：(a) 一种技艺的原材料是另一种技艺的成品；例如，锯木厂生产胶合板，而胶合板又成为建筑者的原材料。(b) 一种技艺的最终产品是另一种技艺中用作手段的工具。(c) 某些行业协同工作以产生成品；例如，计算机制造可能涉及芯片、硬盘、显示器等的可分离制造，以致最终组装“只是把这些部件拼合在一起”。
    step2: |-
      “技艺”一词指通常具备以下六个特征的活动。其中没有一项是单独必要的，但一个活动具备的特征越少，称它为技艺就越说不过去：(1) 可以在作为手段的行动与作为目的的行动之间作出区分；例如面包师在搅和面糊的当口搅打蛋清，是为着最终烤出一只蛋糕这一目的。(2) 计划与执行之间的区分；例如木匠可以先为一张桌子制定计划，随后在另一行动或另一组行动中把桌子做出来。(3) 在计划中，目的先于手段，手段是为目的之故而选定的；但在执行中，手段先于目的。(4) 我们可以区分原材料与成品。(5) 可以在形式与质料之间作出区分。(6) 技艺处于三种等级关系之中：(a) 一种技艺的原材料是另一种技艺的成品；例如锯木厂出产胶合板，胶合板又成为建筑者的原材料。(b) 一种技艺的最终产品是另一种技艺中作为手段使用的工具。(c) 某些行业协同劳作以产出成品；例如，制造一台计算机可能涉及芯片、硬盘、显示器等的分别制造，以致最终装配“只是把这些部件拼合到一起”。
  - id: seg-5
    source: |-
      The point is not that works of art never display any of these features; the point is that some works of art involve none of them, without its detracting from their status as art. Therefore the essence of art cannot have to do with any features correctly treated by a theory of craft. A pure case might be the poet for whom the poem simply comes to mind, unbidden, without its being written down or even said aloud. There is no distinction to be drawn between planning and execution in such a case, and none between actions as means and actions as ends. (If the poet had in mind something analogous to a blueprint for the poem, he would already have composed it.)
    step1: |-
      要点不在于艺术作品从不显示这些特征中的任何一个；要点在于有些艺术作品不涉及其中任何一个，却无损于它们作为艺术的地位。因此艺术的本质不可能与技艺论所正确处理的任何特征有关。一个纯粹的案例可能是这样的诗人：诗径直来到他心中，不请自来，既没有被写下来，甚至也没有被说出声来。在这种情况下，计划与执行之间无可区分，作为手段的行动与作为目的的行动之间也无可区分。（如果诗人心中想着某种类似于诗之蓝图的东西，他就已经把它创作出来了。）
    step2: |-
      要点不在于艺术作品从不显示出这些特征中的任何一个；而在于有些艺术作品丝毫不涉及其中任何一个，却并不因此有损于它们作为艺术的地位。因此，艺术的本质不可能与技艺论所正确处理的任何特征相干。一个纯粹的例子或许是这样的诗人：诗径直涌入他心中，不请自来，既未形诸笔墨，甚至也未曾出声吟诵。在这种情形下，计划与执行无从区分，作为手段的行动与作为目的的行动也无从区分。（倘若诗人心中存着某种类似诗之蓝图的东西，那他其实已经把它作出来了。）
  - id: seg-6
