      Although as we will see in a moment Collingwood holds that there is more to it than this, representation is, in the first instance, the relation that a portrait bears to its sitter. It is plainly a matter of skill, of technique, since one can envisage a successful outcome before undertaking it. So art cannot be representation (or ‘mimesis’, in any straightforward sense). But the theory that it is is so venerable and influential that it demands separate attention. (Not, however, because of Plato and Aristotle; Collingwood holds that despite popular opinion, they did not hold it!).
