      Collingwood’s theory is generally lumped together with that of Benedetto Croce as an expressive and idealist theory. There are of course differences, but the established picture is not inaccurate. And together with Croce’s theory, Collingwood’s has a fatal defect (without questioning the starting-point, that the essence of art to be expressive): In identifying the artwork with what we would normally think of as the experience of the artwork, he makes nonsense of the idea that the spectator *interprets* the artwork, and can do so more or less accurately; that different people can argue about the self-same work of art. It has become a truism that the artist is no better placed than the audience to interpret a work rightly, a truism that Collingwood, with his fulminations again aesthetic individualism, would agree. But then the various imaginative experiences have nothing to conform to, if artwork and experience and hence artwork and interpretation cannot be separated. That would be fatal to the theory; however, it is not clear that anything substantial would be lost, if Collingwood were simply to identify the work of art with the ‘bodily work’, thereby re-establishing room for interpretation to operate. This would seem to sit better with his idea that art is on a level with language, where language is a public phenomenon.
    step1: |-
      柯林武德的理论通常与贝内德托·克罗齐（Benedetto Croce）的理论合并在一起，作为一种表现性的唯心主义理论。当然有差异，但既定的图景并非不准确。而连同克罗齐的理论，柯林武德的理论有一个致命的缺陷（不质疑其出发点，即艺术的本质是表现的）：在把艺术作品与我们通常视为对艺术作品的体验等同起来时，他使“观赏者*解释*艺术作品、并且能或对或错地这样做”这一观念变得荒谬；也使不同的人能够争论同一件艺术作品变得荒谬。“艺术家在正确解释一件作品上并不比观众更有优势”已成为老生常谈，而柯林武德以其对审美个人主义的猛烈抨击会同意这一点。但既然艺术作品与体验、因而艺术作品与解释不能被分开，那么各种想象经验就无所依归。这对该理论将是致命的；然而，如果柯林武德只是把艺术作品与“物质性作品”等同起来，从而为解释的运作重新腾出空间，那会损失什么实质性的东西，并不清楚。这似乎更符合他的观念：艺术与语言处于同一层面，而语言是一种公共现象。
    step2: |-
      柯林武德的理论通常被与贝内德托·克罗齐（Benedetto Croce）的理论归并一处，视为一种表现性的、唯心主义的理论。当然存在差异，但既定的图景并非不准确。然而，连同克罗齐的理论，柯林武德的理论有一个致命的缺陷（且不去质疑其出发点，即艺术的本质在于表现）：在把艺术作品与我们通常视为对艺术作品之体验的东西等同起来时，他使“观赏者*解释*艺术作品、并能或对或错地如此做”这一观念变得荒唐；也使不同的人能够就同一件艺术作品争论不休变得荒唐。“艺术家在正确解释一件作品上并不比观众更具优势”已成为老生常谈，而柯林武德以其对审美个人主义的猛烈谴责，当会对此表示同意。但既然艺术作品与体验、因而艺术作品与解释无从分离，那么种种想象经验便无所依归。这对该理论将是致命的；然而，如果柯林武德只是把艺术作品与“物质性作品”等同起来，从而为解释的运作重新腾出空间，会损失什么实质内容，并不清楚。这似乎更契合他的观念：艺术与语言处于同一层面，而语言是一种公共现象。
