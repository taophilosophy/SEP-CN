      Remember, again, that we are talking of the *expressive* dimension of language, not the referential dimension (about which more in a moment). To understand another person’s emotions is precisely to adopt the person’s expressive language as one’s own, imaginatively experiencing the ideas as if they were one’s own (that is, as if they expressed one’s own emotion; of course the ideas, as analogues of sensation, are necessarily one’s own). This aspect of Collingwood, of the necessary publicity of language and meaning, can be stressed as a potential way out of the threat of the seeming privacy of the work of art as mentioned above, in connection with p. 134 of the *Principles*.
