      That Collingwood has a theory of language might seem tangential to his theory of art, but in fact it is integral to it. For Collingwood’s approach to it comes not from the theory of reference and truth as in Frege or Russell, but from the point of view which regards language as fundamentally or in the first instance expressive behaviour. Concepts of referential semantics—as a ‘symbolism’ in Collingwood’s terminology—become applicable only later, with a certain degree of sophistication is attained. ‘In its original or native state, language in imaginative or expressive … It is imaginative activity whose function is to express emotion.’ (225). Of course ‘imaginative’ must be understood in the broader sense just described, denoting all consciousness of ideated analogues of sensation or feeling. From this angle, we can speak of the ‘totality of our motor activities’ as a ‘parent organism’ (247), from which every type of ‘language (speech, gesture, and so forth)’ is an ‘offshoot’ (246).
    step1: |-
      柯林武德有一种语言理论，这似乎与他的艺术理论无关，但事实上它是艺术理论不可或缺的部分。因为柯林武德处理语言的方式不是来自弗雷格或罗素那样的指称与真理理论，而是来自把语言根本上或首先视为表现性行为的观点。指称语义学的概念——用柯林武德的术语说，是一种“符号体系”——只有后来才变得适用，在达到某种程度的精细之后。“在其原始的或天赋的状态中，语言是想象的或表现的……它是功能在于表现情感的一种想象活动。”（225）。当然，“想象的”必须在上文所述的更宽泛意义上理解，指对感觉或感受的观念化类比物的一切意识。从这个角度，我们可以把“我们运动活动的总体”称为一个“母体”（247），每一种“语言（言语、手势等等）”都是它的一个“分支”（246）。
    step2: |-
      柯林武德有一种语言理论，这似乎与他关于艺术的理论若即若离，但事实上它正是艺术理论不可或缺的一部分。因为柯林武德处理语言的方式，不是来自弗雷格或罗素那样的指称与真理理论，而是来自这样一种立场：它把语言根本上、或首先视为表现性行为。指称语义学的概念——用柯林武德的术语说，是一种“符号体系”——只有达到一定精细程度之后才变得适用。“在其原始的或天赋的状态中，语言是想象的或表现的……它是一种功能在于表现情感之想象活动。”（225）。当然，“想象的”须在上文所述的更宽泛意义上理解，即指对感觉或感受的观念化类比物的一切意识。从这个角度，我们可以把“我们运动活动的总体”称为一个“母体”（247），每一种“语言（言语、手势等等）”都是它的一个“旁枝”（246）。
