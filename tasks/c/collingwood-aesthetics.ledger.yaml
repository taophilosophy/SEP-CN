      The following three points emerge from this. 1. To express is to *become conscious* of an emotion: that is why the distinction between plan and execution cannot be applied. 2. Expression *individualises*; rather than describing the emotion in words whose signification is in principle general, the expression is a intrinsic feature of the utterance, of the ‘utterance itself’ (although he does not credit him, this is an evident example where Collingwood follows Croce). Thus we cannot speak of the emotion embodied in a work of art as if it were the content which the art provides the form. 3. The ‘lightening’ of which Collingwood speaks is not that of catharsis, which provides an outlet for the emotion and may take place without its agents being conscious of it at all. It is the achievement of clarity, of focus of mind, which may indeed intensify what is felt rather than attenuate it (though typically it does not).
    step1: |-
      以下三点由此显现。1. 表现就是*变得意识到*一种情感：这就是为什么计划与执行之间的区分无法适用。2. 表现*个体化*；表现不是用其意义原则上一般的词语来描述情感，而是言说、“言说本身”的内在特征（尽管他没有归功于他，但这是一个明显的柯林武德追随克罗齐的例子）。因此，我们不能把体现在艺术作品中的情感说成似乎是艺术为之提供形式的内容。3. 柯林武德所说的“减轻”不是净化的减轻，净化为情感提供出口，并且可以在其主体完全无意识的情况下发生。它是清晰的达成、心灵专注的达成，它确实可能加强所感受之物，而不是减弱它（尽管通常并不如此）。
