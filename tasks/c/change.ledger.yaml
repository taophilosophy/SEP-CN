    source: "Priest’s third argument (p. 218) is his version of Zeno’s arrow argument mentioned earlier. In the cinematic view of change, there is nothing about the arrow at any instant to contribute to its motion: it is indistinguishable from an arrow at rest. But then there is nothing to constitute its motion: an infinite number of zero motions does not add up to anything but zero motion. In response to the reply that according to measure theory a (nondenumerably) infinite number of points of measure zero can have a non-zero measure, Priest argues that this is just mathematics: “…it does not ease the discomfort … when one tries to understand how the arrow actually achieves its motion. At any point in its motion it advances not at all. Yet in some apparently magical way, in a collection of these it advances. Now a sum of nothings, even infinitely many nothings, is nothing. So how does it do it?” (pp. 218–9)"
    step1: "Priest 的第三个论证（第 218 页）是他对前文提及的芝诺飞矢论证的改写。在电影式变化观中，箭在任何瞬间都没有什么东西有助于其运动：它与静止的箭不可区分。但这样一来也没有什么东西构成其运动：无穷多个零运动加起来，除零运动外什么也不是。针对这样的反驳——按测度论，（不可数）无穷多个测度为零的点可以具有非零测度——Priest 论证说，那不过是数学：“……它并不能减轻那种不适……当一个人试图理解箭究竟如何实现其运动时。在运动中的任何一点，它都毫无推进。然而，以某种看似神奇的方式，在这些点的集合中它却推进了。虚无之和，哪怕是无穷多个虚无之和，仍是虚无。那么它究竟如何做到呢？”（第 218–9 页）"
    step2: "Priest 的第三个论证（第 218 页）是他对前文提及的芝诺飞矢论证的改写。在电影式变化观中，箭在任何瞬间都没有什么东西有助于其运动：它与静止的箭不可区分。但这样一来也没有什么东西构成其运动：无穷多个零运动加起来，除零运动外什么也不是。针对这样的反驳——按测度论，（不可数）无穷多个测度为零的点可以具有非零测度——Priest 论证说，那不过是数学：“……它并不能减轻那种不适……当一个人试图理解箭究竟如何实现其运动时。在运动中的任何一点，它都毫无推进。然而，以某种看似神奇的方式，在这些点的集合中它却推进了。虚无之和，哪怕是无穷多个虚无之和，仍是虚无。那么它究竟如何做到呢？”（第 218–9 页）"
