    source: "(3) A third option takes as its basic minimal idea that the index modifies the whole event: $(a$’s being red) holds at $t$. A variant is to take the index as modifying the exemplification ‘relation’: $a$ exemplifies-at-$t$ redness. Versions of this position were urged by several contributors: Johnston (1987), Lowe (1987), (1988), Haslanger (1989). However, the problem for adverbial-style analyses anywhere is to provide enough semantics, enough logical structure for the event, to account for the logical implications of the sentences under analysis, as Davidson (1967) pointed out. So for example one has things like: $(((Fa)$ at $t) \\amp a=b)$ implies $((Fb)$ at $t)$; or $(((Fa)$ at $t_{1}) \\amp((Ga)$ at $t_{2}) \\amp(F$ is incompatible with $G))$ implies not $t_{1}=t_{2}$; or $(((Fa)$ at $t) \\amp((Gb)$ at $t) \\amp(F$ is incompatible with $G))$ implies not $a=b$. One thus cannot rest with a minimalist position. At least Lewis’ has the merit of providing a viable semantics, a direct parallel with counterpart theory in modal semantics. Of course, the basic ontology of Lewis’ favoured position was Dharmakirti’s though Lewis did not note that fact. More to the point, Dharmakirti’s strategy did not depend on the intrinsic/extrinsic distinction. The problem of contradictory attributions occurs even if the attributions are extrinsic, and Dharmakirti’s argument is a straightforward application of Leibniz’ law to things-at-a-time. If time-slices are admitted at all, and it is hard not to do so if they are sanctioned by relativity theory, then Dharmakirti’s argument goes through."
    step1: "（3）第三种选项以这样一个基本而极简的观念为出发点：索引修饰整个事件：$($$a$ 是红的$)$ 在 $t$ 成立。一个变体是把索引视为修饰“例示”关系：$a$ 在-$t$ 例示红性。这一立场的若干版本由几位学者主张：Johnston（1987）、Lowe（1987）、（1988）、Haslanger（1989）。然而，正如 Davidson（1967）所指出的，副词式分析在何处都会遇到这样的问题：要为事件提供足够的语义学、足够的逻辑结构，以说明被分析句子的逻辑蕴含。例如有：$(((Fa)$ 在 $t$）\\amp a=b)$ 蕴含 $((Fb)$ 在 $t$)$；或 $(((Fa)$ 在 $t_{1}$）\\amp((Ga)$ 在 $t_{2}$）\\amp(F$ 与 $G$ 不相容$))$ 蕴含非 $t_{1}=t_{2}$；或 $(((Fa)$ 在 $t$）\\amp((Gb)$ 在 $t$）\\amp(F$ 与 $G$ 不相容$))$ 蕴含非 $a=b$。因此，人们不能停留在极简主义立场上。至少 Lewis 的解有一个优点：提供了一种可行的语义学，与模态语义学中的对应物理论直接平行。当然，Lewis 所偏好立场的基本本体论正是法称的，尽管 Lewis 没有注意到这一点。更切要的是，法称的策略并不依赖内在/外在之分。矛盾归属的问题即使在归属是外在的时也会出现，而法称的论证是对莱布尼茨律应用于“时间中的物”的直接运用。只要承认时间切片，而若它们得到相对论认可则很难不承认，那么法称的论证就成立。"
    step2: "（3）第三种选项以这样一个基本而极简的观念为出发点：索引修饰整个事件：$($$a$ 是红的$)$ 在 $t$ 成立。一个变体是把索引视为修饰“例示”关系：$a$ 在-$t$ 例示红性。这一立场的若干版本由几位学者主张：Johnston（1987）、Lowe（1987）、（1988）、Haslanger（1989）。然而，正如 Davidson（1967）所指出的，副词式分析在何处都会遇到这样的问题：要为事件提供足够的语义学、足够的逻辑结构，以说明被分析句子的逻辑蕴含。例如有：$(((Fa)$ 在 $t$）\\amp a=b)$ 蕴含 $((Fb)$ 在 $t$)$；或 $(((Fa)$ 在 $t_{1}$）\\amp((Ga)$ 在 $t_{2}$）\\amp(F$ 与 $G$ 不相容$))$ 蕴含非 $t_{1}=t_{2}$；或 $(((Fa)$ 在 $t$）\\amp((Gb)$ 在 $t$）\\amp(F$ 与 $G$ 不相容$))$ 蕴含非 $a=b$。因此，人们不能停留在极简主义立场上。至少 Lewis 的解有一个优点：提供了一种可行的语义学，与模态语义学中的对应物理论（counterpart theory）直接平行。当然，Lewis 所偏好立场的基本本体论正是法称的，尽管 Lewis 没有注意到这一点。更切要的是，法称的策略并不依赖内在/外在之分。矛盾归属的问题即使在归属是外在的时也会出现，而法称的论证是对莱布尼茨律（Leibniz’ law）应用于“时间中的物”的直接运用。只要承认时间切片，而若它们得到相对论认可则很难不承认，那么法称的论证就成立。"
  - id: 26
    source: "Others have taken a different course on the issue of the consistency of change. Herakleitos (C6th BCE) wrote in a suggestive fashion, with his doctrine of the unity of opposites. However, his few surviving sentences are too obscure and fragmentary to give much confidence in interpretation. He spoke of the same river having different waters at different times, but there is no development of the observation. Similarly he spoke of the sea as being at one time both life-preserving (to fish) and death-dealing (to humans), and “the path up and the path down are one and the same.” These examples hardly force one to believe in true contradictions, however."
    step1: "在变化的一致性问题，其他人走了不同的路。赫拉克利特（公元前 6 世纪）以启发性的笔调写作，提出对立统一学说。然而，他留存的寥寥几句过于晦涩零碎，难以对解释抱有太多信心。他说同一条河在不同时间有不同水流，但这一观察没有进一步发展。同样，他说海在同一时间既滋养生命（对鱼）又致人死命（对人），还说“上行的路与下行的路是同一的”。不过，这些例子几乎不能迫使人相信真正的矛盾。"
    step2: "在变化的一致性问题，其他人走了不同的路。赫拉克利特（公元前 6 世纪）以启发性的笔调写作，提出对立统一学说。然而，他留存的寥寥几句过于晦涩零碎，难以对解释抱有太多信心。他说同一条河在不同时间有不同水流，但这一观察没有进一步发展。同样，他说海在同一时间既滋养生命（对鱼）又致人死命（对人），还说“上行的路与下行的路是同一的”。不过，这些例子几乎不能迫使人相信真正的矛盾。"
  - id: 27
    source: "There is also in Herakleitos the idea that everything is in a state of flux, always changing, and that it is the struggle between opposites (opposed tendencies) which drives change. This can be seen as an early version of the Marxist dynamic of dialectical materialism. But without a separate argument for the inconsistency of change, there is no reason to think that it remains anything but a formally consistent theory."
    step1: "在赫拉克利特那里还有这样的观念：万物皆流，无时不变，推动变化的是对立面（相反倾向）之间的斗争。这可被视为辩证唯物主义之马克思主义动力观的早期形态。但若没有关于变化不一致性的独立论证，就没有理由认为它不只是形式上一致的理论。"
    step2: "在赫拉克利特那里还有这样的观念：万物皆流，无时不变，推动变化的是对立面（相反倾向）之间的斗争。这可被视为辩证唯物主义之马克思主义动力观的早期形态。但若没有关于变化不一致性的独立论证，就没有理由认为它不只是形式上一致的理论。"
  - id: 28
    source: "Hegel was more explicit. In *The Science of Logic* he said that only insofar as something has contradiction in itself does it move, have impulse or activity. Indeed, movement is existing contradiction itself. “Something moves not because at one moment of time it is here and at another there, but because at one and the same moment it is here and not here.” (Hegel (1812) p. 440)."
    step1: "黑格尔更明确。在《逻辑学》中他说，一物只有在自身具有矛盾时，才会运动、具有冲动或活动。的确，运动就是存在着的矛盾本身。“某物运动，不是因为它在某一时刻在此处、在另一时刻在彼处，而是因为它在同一个时刻既在此处又不在此处。”（Hegel（1812），第 440 页）。"
    step2: "黑格尔更明确。在《逻辑学》中他说，一物只有在自身具有矛盾时，才会运动、具有冲动或活动。的确，运动就是存在着的矛盾本身。“某物运动，不是因为它在某一时刻在此处、在另一时刻在彼处，而是因为它在同一个时刻既在此处又不在此处。”（Hegel（1812），第 440 页）。"
  - id: 29
    source: "There is something appealing in this argument. As Priest and Routley put it, “in change… there is at each stage a moment when the changing item is both in a given state, because it has just reached that state, but also not in that state, because it is not stationary but moving through and beyond that state” (Priest, Routley and Norman, 1989, p. 7). Think of a body coming to rest at a given time, and compare it with the same body proceeding on to further motion. There must be something about the body at that instant which distinguishes the two scenarios, or there could be nothing at the time to count as continuing change. Cause cannot do it, for a body can continue in its state of motion without being impressed by an external force, as Newton taught us. Nor can mere velocity do it, since velocity is a relation to surrounding points. Indeed, there is no difference in velocity between a body momentarily at rest, and a body at rest for a period around the instant; yet one is changing and the other not."
    step1: "这一论证有某种动人之处。正如 Priest 与 Routley 所说：“在变化中……每一个阶段都有一个时刻，变化着的东西既处于某一给定状态，因为它刚刚达到该状态；又不在该状态，因为它并非静止，而是正在穿过并越过该状态”（Priest、Routley 与 Norman，1989，第 7 页）。设想一个物体在给定时间静止下来，再把它与同一物体继续作进一步运动相比较。在该瞬间，物体上必须有某种东西区分这两种情形，否则当时就没有任何东西可算作继续的变化。原因做不到这一点，因为正如 Newton 教导我们的，物体可以在没有外力作用的情况下保持其运动状态。单纯的速度也做不到，因为速度是与周围点的关系。的确，瞬间静止的物体与在该瞬间前后一段时间内静止的物体，在速度上没有差别；然而一个在变化，另一个则没有。"
    step2: "这一论证有某种动人之处。正如 Priest 与 Routley 所说：“在变化中……每一个阶段都有一个时刻，变化着的东西既处于某一给定状态，因为它刚刚达到该状态；又不在该状态，因为它并非静止，而是正在穿过并越过该状态”（Priest、Routley 与 Norman，1989，第 7 页）。设想一个物体在给定时间静止下来，再把它与同一物体继续作进一步运动相比较。在该瞬间，物体上必须有某种东西区分这两种情形，否则当时就没有任何东西可算作继续的变化。原因做不到这一点，因为正如 Newton 教导我们的，物体可以在没有外力作用的情况下保持其运动状态。单纯的速度也做不到，因为速度是与周围点的关系。的确，瞬间静止的物体与在该瞬间前后一段时间内静止的物体，在速度上没有差别；然而一个在变化，另一个则没有。"
