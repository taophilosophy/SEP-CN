    source: "Taking a far less ambitious view than Hegel, Von Wright (1968) nonetheless proposed an interesting account of conditions in which change would have to be regarded as inconsistent. The account requires two conditions. The first condition is that time is regarded as structured as nested intervals rather than an assemblage of atomic point-instants. This is an attractive proposal, if only because no-one has ever seen a temporal or spatial point. Of course, standard relativity theory proposes that spacetime is punctate, as does the usual mathematics of the continuum. But a successful non-punctate mathematics using intervals instead can be worked out, albeit with considerably extra complexity. (see e.g., Weyl 1960)[^weyl-1960]. Now in the ontology of intervals, since there are no atomic points to attach a unique proposition to, the most one can say is that a proposition holds somewhere in the interval, with the limiting case that it holds throughout the interval."
    step1: "比起黑格尔，Von Wright（1968）的抱负小得多，但他仍提出一个有趣的说明，指出在何种条件下变化不得不被视为不一致。这一说明需要两个条件。第一个条件是：时间被看作由嵌套区间结构而成，而非由原子式的点瞬间聚集而成。这是一个有吸引力的提议，哪怕仅仅因为从来没有人见过时间点或空间点。当然，标准相对论主张时空是点状的，通常的连续统数学亦如此。但可以发展出一种成功的不含点、改用区间的数学，尽管复杂得多（见例如 Weyl 1960）[^weyl-1960]。在区间的本体论中，由于没有原子点可用来附着唯一命题，最多只能说某命题在区间内某处成立，极限情形是它贯穿整个区间成立。"
    step2: "比起黑格尔，Von Wright（1968）的抱负小得多，但他仍提出一个有趣的说明，指出在何种条件下变化不得不被视为不一致。这一说明需要两个条件。第一个条件是：时间被看作由嵌套区间（nested intervals）结构而成，而非由原子式的点瞬间聚集而成。这是一个有吸引力的提议，哪怕仅仅因为从来没有人见过时间点或空间点。当然，标准相对论主张时空是点状的，通常的连续统数学亦如此。但可以发展出一种成功的不含点、改用区间的数学，尽管复杂得多（见例如 Weyl 1960）[^weyl-1960]。在区间的本体论中，由于没有原子点可用来附着唯一命题，最多只能说某命题在区间内某处成立，极限情形是它贯穿整个区间成立。"
