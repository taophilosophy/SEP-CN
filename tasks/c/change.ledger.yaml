    source: "In passing, acceleration detection is also straightforward to explain: split the output from a motion-detector, delay one signal, and compare."
    step1: "顺带一提，加速度探测也易于解释：把运动探测器的输出一分为二，延迟其中一个信号，再作比较。"
    step2: "顺带一提，加速度探测也易于解释：把运动探测器的输出一分为二，延迟其中一个信号，再作比较。"
  - id: 60
    source: "We can see that the sense in which information about different times is compared, is by delaying information from one time. A delay is a kind of buffer. Then the information is “superimposed” on the information from the next time, by presenting the two informations together at the one comparator. A “composite picture” is obtained by subtracting one from the other. This is conjunction of sorts, since it puts two pieces of information together. But it does not obviously make for a state with contradictory content. Indeed, it does not make for a picture of a thing enduring over time, since the same intensity $I$ at different place-times might be due to quite unrelated events. But there is more to be said about perceived motion"
    step1: "我们可以看出，对不同时间信息的比较，是通过延迟来自一个时间的信息来进行的。延迟是一种缓冲器。然后，把这两份信息一同呈现在同一个比较器上，信息便被“叠加”在来自下一时间的信息上。二者相减得到一幅“合成图像”。这是一种合取，因为它把两份信息放在一起。但它显然并不造成具有矛盾内容的状态。的确，它并不造成一幅随时间持续存在的事物的图像，因为不同时空位置上的同一强度 $I$ 可能缘于毫不相关的事件。但关于知觉运动还有更多可说的"
    step2: "我们可以看出，对不同时间信息的比较，是通过延迟来自一个时间的信息来进行的。延迟是一种缓冲器。然后，把这两份信息一同呈现在同一个比较器上，信息便被“叠加”在来自下一时间的信息上。二者相减得到一幅“合成图像”。这是一种合取，因为它把两份信息放在一起。但它显然并不造成具有矛盾内容的状态。的确，它并不造成一幅随时间持续存在的事物的图像，因为不同时空位置上的同一强度 $I$ 可能缘于毫不相关的事件。但关于知觉运动还有更多可说的"
  - id: 61
    source: "We can learn more by considering a family of phenomena known collectively as *phi*, which is in turn more generally classified under the heading of *apparent motion*. The simplest example is of two intermittently illuminated lights, flashing back-and-forth. We naturally represent it as a *single, moving light*. This is not mere sameness of intensity, but representation as an *enduring* thing. Moreover, it is not surprising that we should evolve to have this response, if we are to successfully track game, or danger, through intermittent presentations. Or think of a row of lights, as in a neon sign, with either a single bulb illuminated but its position varying, or a single bulb unilluminated, again with systematically varying position. Or think of a clock dial, with one bulb out, moving around the circle. The content of our experience is as an enduring single thing, having different positions at different times. This is the phi phenomenon. Speed things up (sometimes called *magni-phi*), and it ceases to look discrete, instead presenting as a continuously moving thing, which enhances the effect."
    step1: "考虑统称为*phi*的一族现象，我们能学到更多；它又被更一般地归入*似动*这一标题之下。最简单的例子是两盏间歇照明、来回闪烁的灯。我们自然地把它表象为*单一、移动的光*。这不是单纯的强度相同，而是表象为*持续存在*的东西。再者，如果我们要通过间歇呈现成功地追踪猎物或危险，进化出这一反应并不奇怪。或者想想一排灯，如同霓虹灯招牌，要么单一灯泡点亮而位置变化，要么单一灯泡熄灭而位置也系统性地变化。或者想想钟面，一个灯泡熄灭，绕圆周移动。我们经验的内容是一个持续存在的单一东西，在不同时间具有不同位置。这就是 phi 现象。加快速度（有时称为*magni-phi*），它便不再显得离散，而是呈现为一个连续移动的东西，这增强了效果。"
    step2: "考虑统称为*phi*（phi 现象）的一族现象，我们能学到更多；它又被更一般地归入*似动*（apparent motion）这一标题之下。最简单的例子是两盏间歇照明、来回闪烁的灯。我们自然地把它表象为*单一、移动的光*。这不是单纯的强度相同，而是表象为*持续存在*的东西。再者，如果我们要通过间歇呈现成功地追踪猎物或危险，进化出这一反应并不奇怪。或者想想一排灯，如同霓虹灯招牌，要么单一灯泡点亮而位置变化，要么单一灯泡熄灭而位置也系统性地变化。或者想想钟面，一个灯泡熄灭，绕圆周移动。我们经验的内容是一个持续存在的单一东西，在不同时间具有不同位置。这就是 phi 现象。加快速度（有时称为*magni-phi*），它便不再显得离散，而是呈现为一个连续移动的东西，这增强了效果。"
  - id: 62
    source: "Think of the example of a black dot moving across our visual field. Recalling our general rubric for change at the beginning of this section, we can affirm the first three premisses as statements about the content of our experience: (i) $a$ is at $x_{1}$ at $t_{1}$, (ii) $b$ is at $x_{2}$ at $t_{2}$, (iii) if anything is at place $x_{1}$ at a time $t_{1}$, then it is not at place $x_{2}$ at $t_{2}$. Now add in the content of the phi-experience: (iv) $a=b$, and we deduce that $a$ is also not at $x_{1}$ at $t_{1}$."
    step1: "设想一个黑点穿过我们视野的例子。回想本节开头关于变化的一般纲要，我们可以把前三个前提确认为关于我们经验内容的陈述：（i）$a$ 在 $t_{1}$ 位于 $x_{1}$，（ii）$b$ 在 $t_{2}$ 位于 $x_{2}$，（iii）若某物在 $t_{1}$ 位于 $x_{1}$，则它在 $t_{2}$ 不位于 $x_{2}$。现在加上 phi 经验的内容：（iv）$a=b$，于是我们推出：$a$ 在 $t_{1}$ 也不位于 $x_{1}$。"
    step2: "设想一个黑点穿过我们视野的例子。回想本节开头关于变化的一般纲要，我们可以把前三个前提确认为关于我们经验内容的陈述：（i）$a$ 在 $t_{1}$ 位于 $x_{1}$，（ii）$b$ 在 $t_{2}$ 位于 $x_{2}$，（iii）若某物在 $t_{1}$ 位于 $x_{1}$，则它在 $t_{2}$ 不位于 $x_{2}$。现在加上 phi 经验的内容：（iv）$a=b$，于是我们推出：$a$ 在 $t_{1}$ 也不位于 $x_{1}$。"
  - id: 63
    source: "A consistentist about the phenomenology of motion might support (iii) and challenge (iv), borrowing from Dharmakirti, or from Lewis’ perdurance/counterpart account. An alternative consistentist position would be to challenge (iii) and support (iv). In favour of (iii), it might be said that if the moving black dot is slowed down sufficiently, and particularly if its positions are discrete, or it jumps about, then (iii) finds intuitive assent: $a$ and $b$ just are the sorts of things (events) that occupy distinct places at distinct times. This may be what happens. Again, imagine perception cut off after $t_{1}$ but before $t_{2}$ (close the eyes, or otherwise vanish the dot). Then (iii) holds, the phenomenal dot at $t_{1}$ is a distinct existence from a dot at $t_{2}$. Our cognitive system responds to stimuli both as events, where (iii) holds; and as enduring objects, where (iv) holds. If nothing moves, then there is no contradiction, but when we see motion, the object-recognition mechanism identifies distinct things at different times and so a contradictory content is born. That, I suspect, is the phenomenological content of motion."
    step1: "关于运动现象学的一致主义者可能支持（iii）而质疑（iv），借助法称，或借助 Lewis 的延续/对应物说明。另一可选的一致主义立场是质疑（iii）而支持（iv）。支持（iii）者或可说：若移动的黑点被足够放慢，尤其若其位置是离散的，或它跳来跳去，那么（iii）得到直觉的赞同：$a$ 与 $b$ 正是那种在不同时间占据不同位置的东西（事件）。这或许就是所发生的。再者，设想知觉在 $t_{1}$ 之后、$t_{2}$ 之前被切断（闭上眼睛，或以其他方式使圆点消失）。那么（iii）成立，$t_{1}$ 的现象圆点与 $t_{2}$ 的圆点是不同的存在。我们的认知系统既把刺激当作事件来回应（此时（iii）成立），也当作持续存在的对象来回应（此时（iv）成立）。若没有东西运动，就没有矛盾；但当我们看到运动时，对象识别机制把不同时间的不同东西等同起来，于是一个矛盾内容诞生了。我猜想，这就是运动的现像学内容。"
    step2: "关于运动现象学的一致主义者可能支持（iii）而质疑（iv），借助法称，或借助 Lewis 的延续/对应物（perdurance/counterpart）说明。另一可选的一致主义立场是质疑（iii）而支持（iv）。支持（iii）者或可说：若移动的黑点被足够放慢，尤其若其位置是离散的，或它跳来跳去，那么（iii）得到直觉的赞同：$a$ 与 $b$ 正是那种在不同时间占据不同位置的东西（事件）。这或许就是所发生的。再者，设想知觉在 $t_{1}$ 之后、$t_{2}$ 之前被切断（闭上眼睛，或以其他方式使圆点消失）。那么（iii）成立，$t_{1}$ 的现象圆点与 $t_{2}$ 的圆点是不同的存在。我们的认知系统既把刺激当作事件来回应（此时（iii）成立），也当作持续存在的对象来回应（此时（iv）成立）。若没有东西运动，就没有矛盾；但当我们看到运动时，对象识别机制把不同时间的不同东西等同起来，于是一个矛盾内容诞生了。我猜想，这就是运动的现像学内容。"
  - id: 64
    source: "This model has a number of features, which are only briefly summarised here. A now box is postulated, distinguished by its distinctive multi-modal inputs and outputs. Information enters the now box and is retained for a brief time, the “specious present”. Dismissal from the now box cannot be instantaneous, but takes some time to “fade” or reduce in intensity. Thus the now contains new contents and fading, older contents; and a natural direction of time. The delay and comparisons of Reichardt detectors are enlisted in this process. The endurance or persistence of contents suggests an account of apparent motion, phi or beta, in which identical states close in time and space but not identical, are counted as identical. The important thing for our purposes is that the identity of different and changing temporal stages of a perceptual process (the perceived moving dot), gives the necessary premiss for inconsistency, as discussed earlier."
    step1: "这一模型有许多特征，这里只作简要概括。它设定一个“现在箱”，以其独特的多模态输入输出为特征。信息进入现在箱，并在短暂时间内保留，即“似是而非的现在”。离开现在箱不可能是瞬时的，而是需要一些时间来“消退”或减弱强度。于是，现在既包含新内容，也包含正在消退的较旧内容；并有一种自然的时间方向。赖夏特探测器的延迟与比较被征用于这一过程。内容的持续或持存提示了似动（phi 或 beta）的一种说明：在时间与空间上接近却并不同一的相同状态，被算作同一。就我们的目的而言，重要的是：一个知觉过程的不同而变化着的时间阶段（被知觉的移动圆点）的同一性，提供了不一致性的必要前提，如前述。"
    step2: "这一模型有许多特征，这里只作简要概括。它设定一个“现在箱”（now box），以其独特的多模态输入输出为特征。信息进入现在箱，并在短暂时间内保留，即“似是而非的现在”（specious present）。离开现在箱不可能是瞬时的，而是需要一些时间来“消退”或减弱强度。于是，现在既包含新内容，也包含正在消退的较旧内容；并有一种自然的时间方向。赖夏特探测器的延迟与比较被征用于这一过程。内容的持续或持存提示了似动（phi 或 beta）的一种说明：在时间与空间上接近却并不同一的相同状态，被算作同一。就我们的目的而言，重要的是：一个知觉过程的不同而变化着的时间阶段（被知觉的移动圆点）的同一性，提供了不一致性的必要前提，如前述。"
  - id: 65
    source: "In passing, this model gives natural accounts of akinetopsia, and of the “moving now”. Akinetopsia, that is motion blindness, has a “stop-start” phenomenology where a thing is perceived as distant, then suddenly up close, without any awareness of the in-between. This suggests that something has gone wrong with the fade mechanism, and the contents of the now do not fade, but persist full strength for a time, crowding out new updates. Eventually it collapses, and then no in-between has been registered. As for the moving now, it is noted that the contents of the now change over time, but it seems to the experiencer as if the now is a single thing persisting or enduring over time, and moving from event to event. These matters are expanded on in Mortensen (2013)."
    step1: "顺带一提，这一模型为运动盲和“移动的现在”提供了自然的说明。运动盲即运动失明，有一种“停—启”现象学：一物被知觉为远处，然后突然近在眼前，却对中间过程毫无察觉。这表明消退机制出了问题，现在的内容不消退，而是满强度地持续一段时间，挤掉新的更新。最终它崩溃，于是中间过程没有被登记。至于“移动的现在”，值得注意的是，现在的内容随时间变化，但对体验者而言，仿佛现在是持续存在或持存于时间中的一个单一东西，并从一个事件移到另一个事件。这些问题在 Mortensen（2013）中有更充分的展开。"
    step2: "顺带一提，这一模型为运动盲（akinetopsia）和“移动的现在”提供了自然的说明。运动盲即运动失明，有一种“停—启”现象学：一物被知觉为远处，然后突然近在眼前，却对中间过程毫无察觉。这表明消退机制出了问题，现在的内容不消退，而是满强度地持续一段时间，挤掉新的更新。最终它崩溃，于是中间过程没有被登记。至于“移动的现在”，值得注意的是，现在的内容随时间变化，但对体验者而言，仿佛现在是持续存在或持存于时间中的一个单一东西，并从一个事件移到另一个事件。这些问题在 Mortensen（2013）中有更充分的展开。"
  - id: 66
    source: "An independent account of the flow of time, with striking similarities is to be found in Gruber, Bach and Block (2015). The flow of time has two levels of explanation, and is described as an “illusion” insofar as experience is in conflict with measurement (compare Muller-Lyer). It would appear that the levels, upper and lower, correspond to $A$ and $B$ concepts respectively, so that the upper level, the passage of time, is an illusion. The authors postulate two mechanisms, perceptual completion and object persistence, to account for the flow of time. Perceptual completion involves adding to an experience to complete it some way, for example apparent motion, that is phi or beta. Object persistence requires that an object be perceived as the same (thing) now as it was then. It is essentially the same mechanism that identifies an object at a time, with itself at a later time. This is conceptually necessary for an order of past/present/future, the $A$ series. This account also has a specious present or now, which is similar to our now box."
    step1: "在 Gruber、Bach 与 Block（2015）中可以找到一种独立的时间之流说明，有惊人的相似之处。时间之流有两个解释层次，并在经验与测量相冲突的范围内被描述为一种“错觉”（比较米勒-莱尔错觉）。看来，上、下两层分别对应 $A$ 与 $B$ 概念，因此上层，即时间的流逝，是一种错觉。作者设定两个机制，即知觉完成与对象持存，来说明时间之流。知觉完成涉及给经验添加上某种东西以某种方式完成它，例如似动，即 phi 或 beta。对象持存要求一个对象现在被知觉为与那时相同（的东西）。这本质上是把某一时刻的对象与其后一时刻的自身等同起来的那个机制。这对过去/现在/未来的秩序，即 $A$ 系列，在概念上是必要的。这一说明也有一个似是而非的现在或“现在”，类似于我们的现在箱。"
    step2: "在 Gruber、Bach 与 Block（2015）中可以找到一种独立的时间之流说明，有惊人的相似之处。时间之流有两个解释层次，并在经验与测量相冲突的范围内被描述为一种“错觉”（比较米勒-莱尔错觉）。看来，上、下两层分别对应 $A$ 与 $B$ 概念，因此上层，即时间的流逝，是一种错觉。作者设定两个机制，即知觉完成（perceptual completion）与对象持存（object persistence），来说明时间之流。知觉完成涉及给经验添加上某种东西以某种方式完成它，例如似动，即 phi 或 beta。对象持存要求一个对象现在被知觉为与那时相同（的东西）。这本质上是把某一时刻的对象与其后一时刻的自身等同起来的那个机制。这对过去/现在/未来的秩序，即 $A$ 系列，在概念上是必要的。这一说明也有一个似是而非的现在或“现在”，类似于我们的现在箱。"
  - id: 67
    source: "We cannot hope to do justice to this complex paper here. However, focussing on the theme of inconsistency, one question that could be asked is how much these mechanisms, perceptual completion and object persistence, are really different, as against being species of the same genus. It would seem that the illusion is pervasive because of the mechanism of identification of earlier/later stages. But this is what we saw was sufficient for contradiction. If these models of motion perception are right, it follows that contradiction is pervasive in our experience as the phenomenology of change, which is to say, everywhere."
    step1: "我们无法在此公正对待这篇复杂的论文。然而，聚焦于不一致这一主题，可以问的一个问题是：知觉完成与对象持存这两个机制，究竟有多大差别，而非同属一类的不同种。看来，错觉之所以普遍，是因为较早/较晚阶段的等同机制。但正是这一点我们已看到足以产生矛盾。若这些运动知觉模型为真，那么结论是：矛盾在作为变化现象学的经验中普遍存在，也就是说，无处不在。"
    step2: "我们无法在此公正对待这篇复杂的论文。然而，聚焦于不一致这一主题，可以问的一个问题是：知觉完成与对象持存这两个机制，究竟有多大差别，而非同属一类的不同种。看来，错觉之所以普遍，是因为较早/较晚阶段的等同机制。但正是这一点我们已看到足以产生矛盾。若这些运动知觉模型为真，那么结论是：矛盾在作为变化现象学的经验中普遍存在，也就是说，无处不在。"
  - id: 68
    source: "There remain many loose ends from our discussion. Still, it emerges that the connection between change and inconsistency is deep, and that the case for inconsistencies in motion and other change is surprisingly robust."
    step1: "我们的讨论仍留有许多未了之结。尽管如此，仍可看出：变化与不一致之间的联系是深刻的，而运动及其他变化中不一致性的论证惊人地牢固。"
