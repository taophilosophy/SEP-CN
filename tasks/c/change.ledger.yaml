    source: "To see better what this means, we notice that the above detector can be pulled apart into two even simpler mechanisms."
    step1: "为了更好地理解这意味着什么，我们注意到上述探测器可以拆开成两个更简单的机制。"
    step2: "为了更好地理解这意味着什么，我们注意到上述探测器可以拆开成两个更简单的机制。"
  - id: 56
    source: "The first of these is a *spatial change* or *spatial difference* detector. This consists of two transducers whose outputs *without a delay* are compared by subtraction. If the two input cells have positions $x_{1}$, $x_{2}$, then the *quotient* $(I_{2} - I_{1}) / (x_{2} - x_{1})$ measures the difference in *simultaneous* values of I over the spatial distance $x_{2}-x_{1}$. This can be written as the derivative $dI / dx$. It, and its numerator, are zero iff there is no difference in $I$ measured by the two input cells at the same time. The temporal variable $t$ is fixed here. In passing, we can also see a mechanism here for the perception of spatial relations as emphasised by *Gestalt* psychologists."
    step1: "其一是*空间变化*或*空间差异*探测器。它由两个换能器组成，二者的输出*不加延迟*地相减比较。若两个输入细胞的位置为 $x_{1}$、$x_{2}$，则*商* $(I_{2} - I_{1}) / (x_{2} - x_{1})$ 度量 $I$ 在空间距离 $x_{2}-x_{1}$ 上的*同时*值之差。这可写为导数 $dI / dx$。它及其分子为零，当且仅当两个输入细胞在同一时刻测得的 $I$ 没有差异。此处时间变量 $t$ 固定。顺带一提，这里也可见一个机制，用于知觉*格式塔*心理学家所强调的空间关系。"
    step2: "其一是*空间变化*或*空间差异*探测器。它由两个换能器组成，二者的输出*不加延迟*地相减比较。若两个输入细胞的位置为 $x_{1}$、$x_{2}$，则*商* $(I_{2} - I_{1}) / (x_{2} - x_{1})$ 度量 $I$ 在空间距离 $x_{2}-x_{1}$ 上的*同时*值之差。这可写为导数 $dI / dx$。它及其分子为零，当且仅当两个输入细胞在同一时刻测得的 $I$ 没有差异。此处时间变量 $t$ 固定。顺带一提，这里也可见一个机制，用于知觉*格式塔*（Gestalt）心理学家所强调的空间关系。"
  - id: 57
    source: "The second of these simpler mechanisms is a *temporal change* detector. It consists of a single input cell, whose output $I_{1}$ at $t_{1}$ is split into two, one of which passes through a delay, then compared with the undelayed signal $I_{2}$ from the next moment $t_{2}$. The quotient $(I_{2}-I_{1}) / (t_{2}-t_{1})$ measures change in I at a single input over the time period. This can be written $dI / dt$. This, and its numerator, are zero iff there is no change in the intensities presented to the same cell at different times. The spatial variable $x$ is fixed here."
    step1: "这两个较简单机制中的第二个是*时间变化*探测器。它由单个输入细胞构成，其输出 $I_{1}$ 在 $t_{1}$ 时一分为二，一半经过延迟，然后与下一时刻 $t_{2}$ 的未延迟信号 $I_{2}$ 比较。商 $(I_{2}-I_{1}) / (t_{2}-t_{1})$ 度量单个输入在这一时间段内 $I$ 的变化。这可写为 $dI / dt$。它及其分子为零，当且仅当在不同时间呈现给同一细胞的强度没有变化。此处空间变量 $x$ 固定。"
    step2: "这两个较简单机制中的第二个是*时间变化*探测器。它由单个输入细胞构成，其输出 $I_{1}$ 在 $t_{1}$ 时一分为二，一半经过延迟，然后与下一时刻 $t_{2}$ 的未延迟信号 $I_{2}$ 比较。商 $(I_{2}-I_{1}) / (t_{2}-t_{1})$ 度量单个输入在这一时间段内 $I$ 的变化。这可写为 $dI / dt$。它及其分子为零，当且仅当在不同时间呈现给同一细胞的强度没有变化。此处空间变量 $x$ 固定。"
  - id: 58
    source: "These two mechanisms give ways to register and measure spatial and temporal change. Now it is clear that these two mechanisms, when coupled together, are exactly the original Reichardt detector. But now we can see exactly what that measures. Calculus allows us to write $dx/dt =(dI/dt)/(dI/dx)$. But $dx/dt$ is the rate change of position over time, which is *speed*. Importantly, it is the intensity variable $I$ which is fixed here. Thus what this measures is how a *single intensity*, such as that of a moving dot, an edge, or a shadow, is varying its spatial position over time. This is *motion*. For a given pair of input cells, the direction of the motion is fixed (different detectors for different directions), so we have a register for *velocity*."
    step1: "这两个机制提供了登记与测量空间变化和时间变化的方式。现在很清楚，这两个机制耦合起来，正是最初的赖夏特探测器。但我们现在能确切看到它测量什么。微积分使我们能写出 $dx/dt =(dI/dt)/(dI/dx)$。而 $dx/dt$ 是位置随时间的变化率，即*速率*。重要的是，此处固定的是强度变量 $I$。因此它所测量的是：一个*单一强度*——例如一个移动的圆点、一条边缘或一个阴影的强度——如何随时间改变其空间位置。这就是*运动*。对给定的一对输入细胞，运动的方向是固定的（不同方向对应不同探测器），于是我们有了*速率*（velocity）的登记器。"
    step2: "这两个机制提供了登记与测量空间变化和时间变化的方式。现在很清楚，这两个机制耦合起来，正是最初的赖夏特探测器。但我们现在能确切看到它测量什么。微积分使我们能写出 $dx/dt =(dI/dt)/(dI/dx)$。而 $dx/dt$ 是位置随时间的变化率，即*速率*（speed）。重要的是，此处固定的是强度变量 $I$。因此它所测量的是：一个*单一强度*——例如一个移动的圆点、一条边缘或一个阴影的强度——如何随时间改变其空间位置。这就是*运动*。对给定的一对输入细胞，运动的方向是固定的（不同方向对应不同探测器），于是我们有了*速率*（velocity）的登记器。"
