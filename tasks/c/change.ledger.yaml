    source: "Setting aside questions about the strength of these arguments for the present, how then are we to give an acceptable intrinsic account of motion? According to Priest, the only acceptable answer is Hegel’s: that motion is inconsistent. Support comes from Leibniz’ Continuity Condition (LCC). This is essentially the thesis, suitably qualified, that whatever holds up to a limit, holds at the limit. Priest’s argument for the LCC appeals to causality. He describes change violating the LCC as “capricious” (p. 210). Humeans might be able to accept it, but for them there are no connections, nothing to constitute past states’ determination of future states. He also argues if the LCC fails, change would occur, but “at no time” (p. 210): for a proposition switching values discontinuously at a boundary there would be no instant identifiable by its intrinsic properties alone as the one at which the change occurred."
    step1: "暂且把这些论证的强度问题搁在一边，我们究竟如何给出一个可接受的运动的内在说明？按 Priest，唯一可接受的答案是黑格尔的：运动是不一致的。支持来自莱布尼茨连续性条件（LCC）。这本质上（经适当限定）是这样一个论题：凡在极限之前成立者，也在极限处成立。Priest 为 LCC 的论证诉诸因果性。他把违反 LCC 的变化描述为“任性的”（第 210 页）。休谟主义者或许能接受它，但对他们而言没有联系，没有东西构成过去状态对未来状态的决定。他还论证：若 LCC 失效，变化仍会发生，但“不在任何时间”（第 210 页）：因为一个在边界处不连续地转换值的命题，没有哪个瞬间能仅凭其内在属性被识别为变化发生的那一瞬间。"
    step2: "暂且把这些论证的强度问题搁在一边，我们究竟如何给出一个可接受的运动的内在说明？按 Priest，唯一可接受的答案是黑格尔的：运动是不一致的。支持来自莱布尼茨连续性条件（LCC）。这本质上（经适当限定）是这样一个论题：凡在极限之前成立者，也在极限处成立。Priest 为 LCC 的论证诉诸因果性。他把违反 LCC 的变化描述为“任性的”（capricious）（第 210 页）。休谟主义者或许能接受它，但对他们而言没有联系，没有东西构成过去状态对未来状态的决定。他还论证：若 LCC 失效，变化仍会发生，但“不在任何时间”（第 210 页）：因为一个在边界处不连续地转换值的命题，没有哪个瞬间能仅凭其内在属性被识别为变化发生的那一瞬间。"
