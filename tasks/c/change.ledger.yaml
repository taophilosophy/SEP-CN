    source: "However, one thing can be said about all the above denials of change: they all argue against change on the ground that it implies a contradiction. But the assumption of the consistency of change has been denied by a number of influential figures, as we will see."
    step1: "不过，关于上述种种对变化的否认，有一点可以说：它们都基于“变化蕴含矛盾”这一理由来反对变化。然而，正如下文所见，变化的“一致性”这一假设已被若干有影响的人物所否认。"
