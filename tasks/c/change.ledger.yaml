    source: "Priest’s second argument (p. 217) appeals to causation. It is at least imaginable that the universe is “Laplacean,” by which he means that the state at any time is determined by the states at prior times. But if change is cinematic, then there is no sense to saying that the instantaneous state of the world at the prior time determines its state at subsequent times: for example, not even velocity is determined by the intrinsic instantaneous state of a body. Now a Laplacean universe is possible, but the cinematic view makes Laplacean change *a priori* false. Hence Priest concludes by rejecting the Laplacean view."
    step1: "Priest 的第二个论证（第 217 页）诉诸因果性。至少可以设想宇宙是“拉普拉斯式的”，他指的是：任何时间的状态都由先前时间的状态决定。但若变化是电影式的，那么说世界在先时间的瞬间状态决定其后时间的状态就没有意义：例如，甚至速度也不由物体的内在瞬间状态决定。拉普拉斯式的宇宙是可能的，但电影式观点使拉普拉斯式的变化*先验地*为假。于是 Priest 的结论是拒斥拉普拉斯式观点。"
    step2: "Priest 的第二个论证（第 217 页）诉诸因果性。至少可以设想宇宙是“拉普拉斯式的”（Laplacean），他指的是：任何时间的状态都由先前时间的状态决定。但若变化是电影式的，那么说世界在先时间的瞬间状态决定其后时间的状态就没有意义：例如，甚至速度也不由物体的内在瞬间状态决定。拉普拉斯式的宇宙是可能的，但电影式观点使拉普拉斯式的变化*先验地*（a priori）为假。于是 Priest 的结论是拒斥拉普拉斯式观点。"
