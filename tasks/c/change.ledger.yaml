    source: "In (2006), Priest extends his account to time itself. Hitherto, quantities other than times were regarded as changing to the extent that they were inconsistently smeared out in a small lozenge or spread of time. In 2006, even the identity conditions for times are smeared out: if $t_1$ and $t_2$ are in the same spread then both $t_1 = t_2$ and not-$(t_1 = t_2)$ hold, and in particular not-$(t=t)$ holds for each $t$. Priest proposes that this gives explanations of several perennially puzzling features of time, specifically its flow, how it differs from space, and its direction. Focussing just on flow, it is the fact that not-$(t=t)$ is constant for all t which supplies the intrinsic feature of time necessary in Hegelian terms for its changingness or flow. The view faces some interesting objections, one of which is a sorites-like problem that if times in the same spread are (inconsistently) identical with each other, then since any time will be identical with others in the same spread, and those others identical with further times in other spreads, identity will be spread everywhere. Of course, many replies have been made to the sorites, but one might also observe that none are particularly appealing. At least, the arguments need to be worked through for the particular case."
    step1: "在（2006）中，Priest 把他的说明扩展到时间本身。此前，除时间之外的量被视为变化，其程度是它们被不一致地涂抹在时间的一个小菱形或弥散中。2006 年，连时间的同一性条件也被涂抹：若 $t_1$ 与 $t_2$ 在同一弥散中，则 $t_1 = t_2$ 与非-$(t_1 = t_2)$ 都成立，特别地，对每个 $t$，非-$(t=t)$ 成立。Priest 提出，这给出了时间几个长久令人困惑的特征的解释，特别是它的流、它与空间的不同以及它的方向。仅就“流”而言，正是非-$(t=t)$ 对一切 $t$ 恒成立这一事实，提供了黑格尔意义上时间之流变或流动所必需的内在特征。这一观点面临一些有趣的反对，其一是类似连锁的问题：若同一弥散中的时间彼此（不一致地）同一，那么由于任何时间都与同一弥散中的其他时间同一，而那些时间又与另一弥散中的进一步时间同一，同一性便会弥散到一切地方。当然，对连锁悖论已有许多回应，但人们也会注意到，没有一个特别有吸引力。至少，这些论证需要针对具体情形细加推敲。"
    step2: "在（2006）中，Priest 把他的说明扩展到时间本身。此前，除时间之外的量被视为变化，其程度是它们被不一致地涂抹在时间的一个小菱形或弥散中。2006 年，连时间的同一性条件也被涂抹：若 $t_1$ 与 $t_2$ 在同一弥散中，则 $t_1 = t_2$ 与非-$(t_1 = t_2)$ 都成立，特别地，对每个 $t$，非-$(t=t)$ 成立。Priest 提出，这给出了时间几个长久令人困惑的特征的解释，特别是它的流、它与空间的不同以及它的方向。仅就“流”而言，正是非-$(t=t)$ 对一切 $t$ 恒成立这一事实，提供了黑格尔意义上时间之流变或流动所必需的内在特征。这一观点面临一些有趣的反对，其一是类似连锁（sorites）的问题：若同一弥散中的时间彼此（不一致地）同一，那么由于任何时间都与同一弥散中的其他时间同一，而那些时间又与另一弥散中的进一步时间同一，同一性便会弥散到一切地方。当然，对连锁悖论已有许多回应，但人们也会注意到，没有一个特别有吸引力。至少，这些论证需要针对具体情形细加推敲。"
