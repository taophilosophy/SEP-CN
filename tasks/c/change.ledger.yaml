    source: "As we saw earlier, the basic case for the inconsistency of change turns on the following premisses: (i) $Fa$, (ii) $Gb$, (iii) $Fx \\rightarrow {\\sim}Gx$, (iv) $a=b$. Up to the last premiss all is consistent, but the identification of the entities a and b from different times gives one and the same thing incompatible properties. It was suggested in Section 5, taking a lead from Hegel, that even if we say that change is a consistent process, the *perception* of change might well involve inconsistent representations. It is time to take a closer look at what cognitive science can tell us about this. It turns out that the argument is inconclusive, but suggestive. It is useful to concentrate on the example of the perception of motion. A thorough survey can be found in Palmer (1999), Chapter 10."
    step1: "如我们前文所见，变化不一致性的基本论证取决于以下前提：（i）$Fa$，（ii）$Gb$，（iii）$Fx \\rightarrow {\\sim}Gx$，（iv）$a=b$。直到最后一个前提为止，一切都是一致的；但把来自不同时间的实体 $a$ 与 $b$ 等同起来，便赋予同一个东西不相容的属性。第 5 节曾借鉴黑格尔提出：即使我们说变化是一致的过程，对变化的*知觉*也很可能涉及不一致的表象。现在该仔细看看认知科学能告诉我们什么了。结果表明这一论证没有定论，但有启发性。集中考察运动知觉的例子是有用的。详尽综述见 Palmer（1999）第 10 章。"
    step2: "如我们前文所见，变化不一致性的基本论证取决于以下前提：（i）$Fa$，（ii）$Gb$，（iii）$Fx \\rightarrow {\\sim}Gx$，（iv）$a=b$。直到最后一个前提为止，一切都是一致的；但把来自不同时间的实体 $a$ 与 $b$ 等同起来，便赋予同一个东西不相容的属性。第 5 节曾借鉴黑格尔提出：即使我们说变化是一致的过程，对变化的*知觉*也很可能涉及不一致的表象。现在该仔细看看认知科学能告诉我们什么了。结果表明这一论证没有定论，但有启发性。集中考察运动知觉的例子是有用的。详尽综述见 Palmer（1999）第 10 章。"
  - id: 53
    source: "A basic mechanism for perceived motion is the Reichardt detector. It seems not to be entirely settled whether there are such mechanisms in the CNS. On the other hand, as we see, it is so simple that it is hard to imagine that we don’t have Reichardt detectors in our brains."
    step1: "知觉运动的一个基本机制是赖夏特探测器。中枢神经系统中是否存在这类机制，似乎尚无定论。另一方面，正如我们所见，它如此简单，以至于难以想象我们的大脑中没有赖夏特探测器。"
    step2: "知觉运动的一个基本机制是赖夏特探测器（Reichardt detector）。中枢神经系统中是否存在这类机制，似乎尚无定论。另一方面，正如我们所见，它如此简单，以至于难以想象我们的大脑中没有赖夏特探测器。"
  - id: 54
    source: "The original Reichardt detector involved two spatially-separated retinal transducers responding to intensities $I_{1}$, $I_{2}$ of incident light respectively at times $t_{1}$, $t_{2}$. Essentially, I measures the number of incident photons on a single retinal cell at a time. (For convenience we can regard the input into a given retinal cell as the same as its output, though the output is electrochemical, as befits a transducer.) One of the two inputs, say $I_{1}$, undergoes a delay, and so is compared at a later time $t_{2}$ with the other input $I_{2}$ undelayed. There are different ways to make the comparison: Reichardt suggested both addition and multiplication, but it is more reasonable to consider subtraction of one from the other (a fixed operation for a given Reichardt detector). The difference between $I_{1}$ and $I_{2}$ is then propagated further into the CNS. Thus we have a *change detector*, there is no change in intensity from $I_{1}$ at $t_{1}$ to $I_{2}$ at $t_{2}$ iff $I_{2} - I_{1}=0$."
    step1: "最初的赖夏特探测器涉及两个空间分离的视网膜换能器，它们分别在时间 $t_{1}$、$t_{2}$ 对入射光强度 $I_{1}$、$I_{2}$ 作出反应。本质上，$I$ 测量单个视网膜细胞在某一时刻接收到的入射光子数。（为方便起见，我们可以把某个视网膜细胞的输入视为与其输出相同，尽管如换能器所宜，输出是电化学的。）两个输入之一，例如 $I_{1}$，经历延迟，于是在较晚时刻 $t_{2}$ 与另一个未延迟的输入 $I_{2}$ 比较。比较的方式有不同种：Reichardt 建议用加法与乘法，但更合理的是考虑两者相减（对给定的赖夏特探测器，这是一固定运算）。$I_{1}$ 与 $I_{2}$ 之差随后传入中枢神经系统的更深处。于是我们有了一个*变化探测器*：从 $t_{1}$ 的 $I_{1}$ 到 $t_{2}$ 的 $I_{2}$ 强度没有变化，当且仅当 $I_{2} - I_{1}=0$。"
    step2: "最初的赖夏特探测器涉及两个空间分离的视网膜换能器，它们分别在时间 $t_{1}$、$t_{2}$ 对入射光强度 $I_{1}$、$I_{2}$ 作出反应。本质上，$I$ 测量单个视网膜细胞在某一时刻接收到的入射光子数。（为方便起见，我们可以把某个视网膜细胞的输入视为与其输出相同，尽管如换能器所宜，输出是电化学的。）两个输入之一，例如 $I_{1}$，经历延迟，于是在较晚时刻 $t_{2}$ 与另一个未延迟的输入 $I_{2}$ 比较。比较的方式有不同种：Reichardt 建议用加法与乘法，但更合理的是考虑两者相减（对给定的赖夏特探测器，这是一固定运算）。$I_{1}$ 与 $I_{2}$ 之差随后传入中枢神经系统的更深处。于是我们有了一个*变化探测器*：从 $t_{1}$ 的 $I_{1}$ 到 $t_{2}$ 的 $I_{2}$ 强度没有变化，当且仅当 $I_{2} - I_{1}=0$。"
