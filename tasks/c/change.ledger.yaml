    source: "Whatever we make of this argument, and much has been written about it, it highlights the baffling nature of the apparent passage of time. In particular, if temporal flux is denied then at the least an explanation of its intuitive naturalness is mandatory. For a close analysis, see the entry Savitt (2006) in this Encyclopedia."
    step1: "无论我们如何评价这一论证，关于它已有大量文献，它都凸显了时间表面流逝的令人困惑之处。特别是，若否认时间之流，则至少必须解释它何以在直觉上如此自然。详尽分析见本百科全书中 Savitt（2006）的词条。"
