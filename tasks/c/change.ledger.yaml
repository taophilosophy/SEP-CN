    source: "Now one might endeavour to support Russell’s contrary view by arguing that non-zero speed is both necessary and sufficient for motion. But both sides of this equivalence might be disputed. On the necessity of non-zero speed for motion, a challenge might be mounted that zero speed but non-zero acceleration is motion. On the question of the sufficiency of non-zero speed for motion, Priest in the second edition of In Contradiction (2006) says that he does not deny this. But this opens him up a possible objection, namely that if non-zero (speed or acceleration) is necessary and sufficient for motion, then the extra element of inconsistency would seem to be explanatorily otiose, since there is no need to add the extra element of inconsistency in order to constitute motion. Such an objection does not refute his view, but it would seem to make it unsimple. Moreover, one might still adopt an inconsistent view coupled with the denial of sufficiency, which avoids this objection."
    step1: "现在，有人可能试图支持罗素相反的见解，论证非零速度既是运动的必要条件也是充分条件。但这一等值的两端都可能被质疑。关于运动需要非零速度，可以提出挑战说：速度为零而加速度非零也是运动。关于非零速度对运动的充分性，Priest 在《In Contradiction》第二版（2006）中说他不否认这一点。但这使他面临一个可能的反对：若非零（速度或加速度）是运动的必要且充分条件，那么“不一致”这一额外成分在解释上就是多余的，因为无需为了构成运动而添加不一致这一额外成分。这样的反对并不驳倒他的观点，但似乎使它不够简洁。此外，人们仍可采用一种不一致的观点并连同否认充分性，从而避开这一反对。"
    step2: "现在，有人可能试图支持罗素相反的见解，论证非零速度既是运动的必要条件也是充分条件。但这一等值的两端都可能被质疑。关于运动需要非零速度，可以提出挑战说：速度为零而加速度非零也是运动。关于非零速度对运动的充分性，Priest 在《In Contradiction》第二版（2006）中说他不否认这一点。但这使他面临一个可能的反对：若非零（速度或加速度）是运动的必要且充分条件，那么“不一致”这一额外成分在解释上就是多余的，因为无需为了构成运动而添加不一致这一额外成分。这样的反对并不驳倒他的观点，但似乎使它不够简洁。此外，人们仍可采用一种不一致的观点并连同否认充分性，从而避开这一反对。"
