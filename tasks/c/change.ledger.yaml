    source: "Von Wright’s second condition was then to suppose that an interval might be so structured that a given proposition $p$ and its negation $\\neg p$ are dense in each other throughout the interval. This means that no subinterval, no matter how small, can be found in which just $p$ holds throughout that subinterval, and no subinterval can be found in which just $\\neg p$ holds throughout the subinterval: every subinterval in which one holds, the other holds as well. From an external point of view admitting instants, we can see that this is a genuine consistent possibility, if for example we think of $p$ as the proposition that a rational number of seconds has passed, and $\\neg p$ as the proposition that an irrational number of seconds has passed. These are dense in each other on the classical real line regarded as time. Thus, there is no subinterval which is purely $p$ throughout and no subinterval which is purely $\\neg p$ throughout."
    step1: "Von Wright 的第二个条件于是假设：一个区间可能如此结构，使得给定命题 $p$ 与其否定 $\\neg p$ 在整个区间内彼此稠密。这意味着：无论多小，都找不到一个子区间，使 $p$ 单独贯穿该子区间成立；也找不到一个子区间，使 $\\neg p$ 单独贯穿该子区间成立：在每个其中一个成立的子区间里，另一个也成立。从承认瞬间的外部观点看，这是一种真正一致的可能性——例如，若我们把 $p$ 设想为“已经过去了有理数秒”的命题，把 $\\neg p$ 设想为“已经过去了无理数秒”的命题。在当作时间的经典实数直线上，它们彼此稠密。因此，没有纯粹 $p$ 贯穿的子区间，也没有纯粹 $\\neg p$ 贯穿的子区间。"
    step2: "Von Wright 的第二个条件于是假设：一个区间可能如此结构，使得给定命题 $p$ 与其否定 $\\neg p$ 在整个区间内彼此稠密。这意味着：无论多小，都找不到一个子区间，使 $p$ 单独贯穿该子区间成立；也找不到一个子区间，使 $\\neg p$ 单独贯穿该子区间成立：在每个其中一个成立的子区间里，另一个也成立。从承认瞬间的外部观点看，这是一种真正一致的可能性——例如，若我们把 $p$ 设想为“已经过去了有理数秒”的命题，把 $\\neg p$ 设想为“已经过去了无理数秒”的命题。在当作时间的经典实数直线上，它们彼此稠密。因此，没有纯粹 $p$ 贯穿的子区间，也没有纯粹 $\\neg p$ 贯穿的子区间。"
