    source: "Many of the above themes come together in Graham Priest’s inconsistent account of motion in In Contradiction (1987). Priest sets up the opposing consistent account of change as what he calls the cinematic view of change. This is the view that an object in motion does no more than simply occupy different points of space at different times, like a succession of stills in a film only continuously connected. He attributes the view to Russell and Hume. It is an extrinsic view of change, in the sense that change is seen as a matter of a relation to states at nearby instants of time. The best-worked-out version of this view is the usual mathematical description of change of position by a suitable function of time; and then motion as velocity, that is rate of change of position, is given by the first derivative, which is a relation to nearby intervals."
    step1: "上述许多主题汇聚于 Graham Priest 在《In Contradiction》（1987）中对运动的不一致说明。Priest 把与之对立的、一致的“变化”说明称为“电影式变化观”。这种观点认为，运动中的对象无非在不同时间占据不同空间点，如同电影中一连串仅连续相接的静帧。他把这一观点归于罗素与休谟。这是一种关于变化的外在观点，其意义在于：变化被看作与邻近时间瞬间状态的关系。这一观点打磨得最完善的版本，是通常用时间函数对位置变化的数学描述；于是作为速度（即位置变化率）的运动，由一阶导数给出，而一阶导数是与邻近区间的关系。"
    step2: "上述许多主题汇聚于 Graham Priest 在《In Contradiction》（1987）中对运动的不一致说明。Priest 把与之对立的、一致的“变化”说明称为“电影式变化观”（cinematic view）。这种观点认为，运动中的对象无非在不同时间占据不同空间点，如同电影中一连串仅连续相接的静帧。他把这一观点归于罗素与休谟。这是一种关于变化的外在观点，其意义在于：变化被看作与邻近时间瞬间状态的关系。这一观点打磨得最完善的版本，是通常用时间函数对位置变化的数学描述；于是作为速度（即位置变化率）的运动，由一阶导数给出，而一阶导数是与邻近区间的关系。"
  - id: 36
    source: "Priest wishes instead to have an intrinsic account of change, in which it is a matter of the features of the object solely at the instant whether it is changing at the instant. He offers three arguments against the extrinsic account. First there is the “abutment” argument (p. 203). Taking the usual view of time as a continuously distributed collection of point-instants, in any change there must be an interval throughout which $p$ holds abutting an interval throughout which $\\neg p$ holds. It makes no difference whether there is a last instant for $p$ and no first instant for $\\neg p$, or no last instant for $p$ and a first instant for $\\neg p$; either way there is no room for a time at which the system is changing. For example, if we said that the change was at the boundary point, then there would be nothing about that point to distinguish it from the situation where there was no change at all because the abutting intervals had the same proposition holding throughout each. Hence says Priest there is no change at all in the cinematic view: for change there would have to be a time when change was occurring, and that is absent in this case."
    step1: "Priest 转而想要一种关于变化的内在说明，即：对象在该瞬间是否变化，只取决于该瞬间对象自身的特征。他提出三个反对外在说明的论证。其一是“邻接”论证（第 203 页）。采取通常的时间观，即时间是一连续分布的点瞬间集合，则在任何变化中，必有一个 $p$ 贯穿成立的区间与一个 $\\neg p$ 贯穿成立的区间邻接。无论 $p$ 有最后瞬间而 $\\neg p$ 无最初瞬间，还是 $p$ 无最后瞬间而 $\\neg p$ 有最初瞬间，都没有差别；两种情形都没有为系统正在变化的那个时刻留出余地。例如，若我们说变化在边界点，那么该点没有任何东西能把它与“根本没有变化”的情形区分开，因为邻接区间各自有同一命题贯穿成立。于是 Priest 说，在电影式观点中根本没有变化：变化必须有一个正在发生的时刻，而在此情形中这一时刻付诸阙如。"
    step2: "Priest 转而想要一种关于变化的内在说明，即：对象在该瞬间是否变化，只取决于该瞬间对象自身的特征。他提出三个反对外在说明的论证。其一是“邻接”（abutment）论证（第 203 页）。采取通常的时间观，即时间是一连续分布的点瞬间集合，则在任何变化中，必有一个 $p$ 贯穿成立的区间与一个 $\\neg p$ 贯穿成立的区间邻接。无论 $p$ 有最后瞬间而 $\\neg p$ 无最初瞬间，还是 $p$ 无最后瞬间而 $\\neg p$ 有最初瞬间，都没有差别；两种情形都没有为系统正在变化的那个时刻留出余地。例如，若我们说变化在边界点，那么该点没有任何东西能把它与“根本没有变化”的情形区分开，因为邻接区间各自有同一命题贯穿成立。于是 Priest 说，在电影式观点中根本没有变化：变化必须有一个正在发生的时刻，而在此情形中这一时刻付诸阙如。"
