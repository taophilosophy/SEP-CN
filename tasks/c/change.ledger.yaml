    source: "(1) The basic existents are things indexed by times, that is time-slices. What primarily exist are things-at-a-time: “$a$ is red at $t$” is rendered “$a$-at-$t$ is red”. Things that persist over time are then wholes made up of such parts, and one says that persisting things *perdure* rather than *endure*. This is the solution favoured by Lewis, by the present author, and by space-time theory."
    step1: "（1）基本的存在者是按时间索引的事物，即时间切片。首要存在的是“时间中的物”：“$a$ 在 $t$ 是红的”被改写为“$a$-在-$t$ 是红的”。随时间持续存在的事物，便是由这类部分组成的整体；人们说持续存在的事物是*延续*而非*持存*。这是 Lewis、本文作者以及时空理论所偏好的解。"
    step2: "（1）基本的存在者是按时间索引的事物，即时间切片。首要存在的是“时间中的物”：“$a$ 在 $t$ 是红的”被改写为“$a$-在-$t$ 是红的”。随时间持续存在的事物，便是由这类部分组成的整体；人们说持续存在的事物是*延续*（perdure）而非*持存*（endure）。这是 Lewis、本文作者以及时空理论所偏好的解。"
  - id: 24
    source: "(2) A second option is to say that, instead of indexing things, one indexes properties: “$a$ is red at $t$” is rendered as “$a$ is red-at-$t$”. This option does not seem to have had any defenders, perhaps because those properties which are universals are supposed to be wholly in each of their instances, which the indexing apparently denies."
    step1: "（2）第二种选项是：不是索引事物，而是索引属性：“$a$ 在 $t$ 是红的”被改写为“$a$ 是红-在-$t$”。这一选项似乎没有任何辩护者，也许因为作为共相的属性应当完全存在于它的每个例示之中，而索引显然否认了这一点。"
    step2: "（2）第二种选项是：不是索引事物，而是索引属性：“$a$ 在 $t$ 是红的”被改写为“$a$ 是红-在-$t$”。这一选项似乎没有任何辩护者，也许因为作为共相的属性应当完全存在于它的每个例示之中，而索引显然否认了这一点。"
