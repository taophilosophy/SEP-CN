    source: "One quick objection does not succeed. One might argue that since motion and rest are not relativistically invariant, neither could the contradictoriness in motion be part of the absolute character of reality. This may be so, but it does not prevent the concept being of use in the analysis of phenomena by means of frames: frame-relative inconsistencies would still be a (relational) part of the world. More importantly, the concept may find its natural home in QM rather than GR. It is well-known that there are deep incompatibilities between them as they now stand, but the jury is still out on how to resolve them, and it may well be that absolute motion is a part of the solution."
    step1: "一个仓促的反对意见并不成立。有人可能论证：既然运动与静止不是相对论不变的，那么运动中的矛盾性也就不可能属于实在的绝对特征。这或许如此，但它并不妨碍这一概念在借助参照系分析现象时有用：相对于参照系的不一致仍会是世界的一个（关系的）部分。更重要的是，这一概念的自然归宿可能在量子力学而非广义相对论。众所周知，二者目前存在深刻的不相容，但如何化解尚无定论，而绝对运动很可能是解决方案的一部分。"
