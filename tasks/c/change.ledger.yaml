    source: "Priest’s qualification to the LCC is that it applies only to atomic sentences and their negations: otherwise we would have to admit the case where a disjunction $p \\vee q$ held right up to a limit in virtue of $p$ holding at the rational points and $q$ holding at the irrational points: this would be capricious behaviour in which we can make no sense of the past determining the future. We would also admit problems if we allowed the LCC to apply to tense operators: Future-$p$ can obviously hold up to a limit without holding at the limit."
    step1: "Priest 对 LCC 的限定是：它只适用于原子句及其否定；否则我们就得承认这样的情形：一个析取式 $p \\vee q$ 恰因 $p$ 在有理点成立、$q$ 在无理点成立而一直成立到极限：这是任性行为，我们无法理解过去决定未来。若允许 LCC 适用于时态算子，也会招致问题：未来-$p$ 显然可以成立到极限而不在极限处成立。"
    step2: "Priest 对 LCC 的限定是：它只适用于原子句及其否定；否则我们就得承认这样的情形：一个析取式 $p \\vee q$ 恰因 $p$ 在有理点成立、$q$ 在无理点成立而一直成立到极限：这是任性行为，我们无法理解过去决定未来。若允许 LCC 适用于时态算子，也会招致问题：未来-$p$ 显然可以成立到极限而不在极限处成立。"
  - id: 41
    source: "But now we observe that the LCC so qualified implies that continuous change is contradictory. For consider any particle with equation of motion $x = f(t)$. Then at $t = a$ its position $x = f(a)$. However if it is in motion then in the neighbourhood we have $\\neg(x = f(a))$, so by the LCC at the limit also $\\neg(x = f(a))$, along with of course $x = f(a)$ as well. Priest amplifies this account by proposing that no moving body can be consistently localised. Rather, in moving at time $t$ it inconsistently occupies a small finite (Planck length) lozenge of space, which is made up of the positions it takes in the corresponding lozenge of time surrounding $t$. This gives a natural intrinsic account of motionlessness at $t$, namely that there is no contradiction in its position at $t$. One can propose an account of velocity, as varying with the length of the lozenge or spread of position in the direction of motion. There are applications in Quantum Theory, too. The Heisenberg uncertainty of position may simply be the size of the spread or smeared position. Moreover, there is a possibility for backward causation implicit in the advanced wave front of inconsistency affecting earlier states in the inconsistently identified smear of spatial positions; and backward causation may be the way to go with quantum nonlocality, as Huw Price (1996) has argued."
    step1: "但我们现在看到，如此限定的 LCC 蕴含连续变化是矛盾的。考虑任一运动方程为 $x = f(t)$ 的粒子。在 $t = a$ 时其位置 $x = f(a)$。然而若它在运动，则在其邻域有 $\\neg(x = f(a))$，于是由 LCC，在极限处也有 $\\neg(x = f(a))$，当然同时还有 $x = f(a)$。Priest 扩充这一说明，提出：没有一个运动物体能被一致地定域。相反，在时间 $t$ 运动时，它不一致地占据空间的一个小有限（普朗克长度）菱形，这个菱形由它在围绕 $t$ 的相应时间菱形中所取的各个位置构成。这为 $t$ 时的“静止”给出一个自然的内在说明，即：它在 $t$ 时的位置没有矛盾。还可以提出速度的说明，把它视为随菱形长度或沿运动方向的位置弥散而变化。量子理论中也有应用。海森堡位置不确定或许就是这种弥散或模糊位置的尺寸。此外，在空间位置的这一不一致认同的弥散中，隐含有向后因果性的可能：不一致性的超前波前影响较早的状态；而正如 Huw Price（1996）所论证的，向后因果性也许是处理量子非定域性的途径。"
