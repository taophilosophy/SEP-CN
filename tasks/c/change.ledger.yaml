    source: "If the LCC is to have a chance of being applicable, then it needs further restriction, beyond atomic sentences and their negations. This is because it has implausible consequences when applied to certain atomic sentences. Consider any increasing function $f(t)$. Then sentences of the form $f(t) \\lt f(a)$ will hold for $t \\lt a$. By the LCC then, $f(a) \\lt f(a)$. This is surely a gratuitous conclusion even before the contradicting sentence $-f(a) \\lt f(a)$ is taken into account. The present author (1997) therefore proposed to restrict the application to the atomic sentences of equational theories, that is to sentences of the form $f(t) = 0$. This is not so unreasonable on independent grounds, since the basic laws of nature are expressed in equational form."
    step1: "若 LCC 要有机会适用，就需要进一步限制，超出原子句及其否定。这是因为它适用于某些原子句时会产生不可信的结论。考虑任一递增函数 $f(t)$。则形如 $f(t) \\lt f(a)$ 的句子对 $t \\lt a$ 成立。于是由 LCC，$f(a) \\lt f(a)$。即使不考虑矛盾的句子 $-f(a) \\lt f(a)$，这无疑也是多余的结论。因此本文作者（1997）提议把应用限制在等式理论的原子句，即形如 $f(t) = 0$ 的句子。这独立地看并非不合理，因为自然界的基本定律是以等式形式表达的。"
    step2: "若 LCC 要有机会适用，就需要进一步限制，超出原子句及其否定。这是因为它适用于某些原子句时会产生不可信的结论。考虑任一递增函数 $f(t)$。则形如 $f(t) \\lt f(a)$ 的句子对 $t \\lt a$ 成立。于是由 LCC，$f(a) \\lt f(a)$。即使不考虑矛盾的句子 $-f(a) \\lt f(a)$，这无疑也是多余的结论。因此本文作者（1997）提议把应用限制在等式理论的原子句，即形如 $f(t) = 0$ 的句子。这独立地看并非不合理，因为自然界的基本定律是以等式形式表达的。"
  - id: 50
    source: "So restricted, we can note that far from being unreasonable, it turns out that the LCC is satisfied in a large class of reasonable models, specifically the C-infinity worlds mentioned earlier, in which every function is continuous. These include all those of GR. Now a C-infinity world gives us a kind of half-way house for cause. It might be that all correlations are coincidences, but at least if functions are continuous then causation is a distinctive correlation in that it is transmitted locally. This can be applied beneficially to produce not a general account of inconsistent change, but a particular account of certain inconsistent changes, as follows."
    step1: "如此限制后，我们可以注意到：LCC 远非不合理，它在很大一类合理模型中得到满足，特别是前文提到的 C-无穷世界，其中每个函数都连续。这些包括广义相对论的所有模型。C-无穷世界为我们提供了一种原因的中途站。也许所有关联都是巧合，但至少若函数连续，则因果性就是一种独特的关联，因为它被局部地传递。这可以被有益地运用，产生的不是不一致变化的一般说明，而是某些不一致变化的特殊说明，如下所述。"
    step2: "如此限制后，我们可以注意到：LCC 远非不合理，它在很大一类合理模型中得到满足，特别是前文提到的 C-无穷世界，其中每个函数都连续。这些包括广义相对论的所有模型。C-无穷世界为我们提供了一种原因的中途站（half-way house）。也许所有关联都是巧合，但至少若函数连续，则因果性就是一种独特的关联，因为它被局部地传递。这可以被有益地运用，产生的不是不一致变化的一般说明，而是某些不一致变化的特殊说明，如下所述。"
  - id: 51
    source: "Quantum measurement has long been problematic, for more than one reason. One reason has been that it represents an irreducibly different kind of process from Schrödinger evolution. Another is that it is change which is discontinuous and yet causal: one can make things to happen with measurement, even though one cannot determine the exact outcome. A third reason is nonlocality itself: the nonlocal is *ipso facto* the discontinuous, and yet the nonlocal is governed by a kind of statistical causality. But now, to settle at least some of these issues, it has been proposed to utilise the theory of inconsistent continuous functions. These arise when a function is classically discontinuous, but we inconsistently identify the limit of the function (assuming it has a limit) with its value at the limit. Such functions, by virtue of being continuous, can be shown to satisfy the LCC. But granted that the formal details exist, what reason is there to apply them? It is precisely that we want to preserve a degree of causality, that is LCC-causality, while yet retaining the essential discontinuity and unpredictability of the process. Thus the slogan “nonlocality is inconsistent locality,” which is intended not to apply to change in general but to discontinuous change which we nonetheless have reason to think of as causal."
    step1: "量子测量长期以来成问题，原因不止一个。其一是：它代表一种与薛定谔演化不可还原地不同的过程。其二是：它是一种不连续却又有因果性的变化——人们可以通过测量使事情发生，尽管无法确定确切结果。其三是非定域性本身：非定域的*事实自身*就是不连续的，然而非定域的又受一种统计因果性支配。但现在，为至少解决其中一些问题，有人提议运用不一致连续函数理论。这类函数出现于：一个函数经典地不连续，但我们不一致地把它（假设有）的极限与其在极限处的值等同。这类函数由于连续，可以证明满足 LCC。但即便形式细节存在，有什么理由运用它们呢？恰恰是：我们想保留一定程度的因果性，即 LCC-因果性，同时又保留过程的本质不连续与不可预测性。于是有了口号“非定域性即不一致的定域性”，它并非意在适用于一般变化，而是适用于我们仍有理由认为具有因果性的不连续变化。"
    step2: "量子测量长期以来成问题，原因不止一个。其一是：它代表一种与薛定谔演化不可还原地不同的过程。其二是：它是一种不连续却又有因果性的变化——人们可以通过测量使事情发生，尽管无法确定确切结果。其三是非定域性本身：非定域的*事实自身*（ipso facto）就是不连续的，然而非定域的又受一种统计因果性支配。但现在，为至少解决其中一些问题，有人提议运用不一致连续函数理论。这类函数出现于：一个函数经典地不连续，但我们不一致地把它（假设有）的极限与其在极限处的值等同。这类函数由于连续，可以证明满足 LCC。但即便形式细节存在，有什么理由运用它们呢？恰恰是：我们想保留一定程度的因果性，即 LCC-因果性，同时又保留过程的本质不连续与不可预测性。于是有了口号“非定域性即不一致的定域性”，它并非意在适用于一般变化，而是适用于我们仍有理由认为具有因果性的不连续变化。"
