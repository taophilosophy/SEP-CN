  - id: 14
    source: "Consider a car moving off from rest at exactly noon. What is its state of motion at the instant of change? If it is in motion, when did it start? And if it is motionless, when could it ever begin? This problem was explored by Medlin (1963), Hamblin (1969), and others. Put this way, a solution for at least some special cases is readily available. Locate the time origin $t = 0$ at noon. If the car’s position function $f$ is given by, say, $f(t) = t^{2}$, then its speed is $2t$. If motion is defined as having non-zero speed, then the car is motionless at $t=0$. On the other hand, at all $t \\gt 0$ it is in motion, so there is surely no puzzle about when it could ever begin: there is no first instant of motion."
    step1: "设想一辆汽车恰在正午从静止开始启动。在变化发生的瞬间，它的运动状态如何？若它在运动，它何时开始？若它静止，它又怎能开始？这一问题曾由 Medlin（1963）、Hamblin（1969）等人探讨。如此提出，至少某些特殊情形立即可得解。把时间原点 $t = 0$ 设在正午。若汽车的位置函数 $f$ 例如为 $f(t) = t^{2}$，则其速度为 $2t$。若把运动定义为具有非零速度，则汽车在 $t=0$ 时静止。另一方面，对所有 $t \\gt 0$ 它都在运动，因此关于它何时能够开始，当然没有什么疑难：不存在运动的第一个瞬间。"
    step2: "设想一辆汽车恰在正午从静止开始启动。在变化发生的瞬间，它的运动状态如何？若它在运动，它何时开始？若它静止，它又怎能开始？这一问题曾由 Medlin（1963）、Hamblin（1969）等人探讨。如此提出，至少某些特殊情形立即可得解。把时间原点 $t = 0$ 设在正午。若汽车的位置函数 $f$ 例如为 $f(t) = t^{2}$，则其速度为 $2t$。若把运动定义为具有非零速度，则汽车在 $t=0$ 时静止。另一方面，对所有 $t \\gt 0$ 它都在运动，因此关于它何时能够开始，当然没有什么疑难：不存在运动的第一个瞬间。"
  - id: 15
    source: "However, there are more troublesome special cases. Suppose that the car’s position function is given by: $f(t)=0$ for all $t \\lt 0$, else $f(t)=t$. Then speed is zero for all $t \\lt 0$, and speed is 1 for all $t \\gt 0$. But what of $t = 0$? One should avoid “arbitrary” solutions, which attribute one speed rather than another, but do not give a reason for so privileging. There is of course at least one simple solution that is non-arbitrary, namely that it is neither in motion nor motionless, since its speed is indeterminate at $t = 0$. This solution derives from the fact that according to classical calculus there is no derivative of such a function at $t = 0$."
    step1: "然而有些特殊情形更棘手。设汽车的位置函数为：对所有 $t \\lt 0$，$f(t)=0$；否则 $f(t)=t$。于是对所有 $t \\lt 0$ 速度为零，对所有 $t \\gt 0$ 速度为 1。但 $t = 0$ 呢？应当避免“任意”的解，它们指定一种速度而非另一种，却不给出如此偏爱的理由。当然至少有一个简单而不任意的解，即它既非运动也非静止，因为其速度在 $t = 0$ 时不确定。这一解来自如下事实：按经典微积分，这类函数在 $t = 0$ 处没有导数。"
    step2: "然而有些特殊情形更棘手。设汽车的位置函数为：对所有 $t \\lt 0$，$f(t)=0$；否则 $f(t)=t$。于是对所有 $t \\lt 0$ 速度为零，对所有 $t \\gt 0$ 速度为 1。但 $t = 0$ 呢？应当避免“任意”的解，它们指定一种速度而非另一种，却不给出如此偏爱的理由。当然至少有一个简单而不任意的解，即它既非运动也非静止，因为其速度在 $t = 0$ 时不确定。这一解来自如下事实：按经典微积分，这类函数在 $t = 0$ 处没有导数。"
  - id: 16
    source: "But can we do no better? The present author (1985) proposed to set aside the problem until more is said about various possible constraints on the solution. Unless we had some reason to think that such functions really did describe the world, we might well feel that a solution was less than imperative and less than unique. For example, the world might be described wholly with $C^{\\infty}$ functions $(n$-th derivatives exist for all $n$, e.g., cos, sin, log, exponential functions). The above function is not among these, since its derivative is discontinuous. But then it isn’t clear what we might say of it if the example is counterfactual. There might be different things to say depending on what further principles describe the possible world. Hence we would need to supplement the original statement of the problem with an argument to the effect that we might expect such functions to describe the real world, or alternatively supply additional metaphysical principles to be regarded as constraints on the solution."
    step1: "但我们能否做得更好？本文作者（1985）曾提议把这一问题搁置，直到对解的各种可能约束有更多说明为止。除非我们有理由认为这类函数当真描述了世界，否则我们很可以觉得，一个解既非紧迫，也非唯一。例如，世界或许可以完全用 $C^{\\infty}$ 函数（对一切 $n$ 存在 $n$ 阶导数，如 cos、sin、log、指数函数）来描述。上述函数不在其列，因为它的导数不连续。但若这一例子是反事实的，我们该说它什么呢？视描述该可能世界的进一步原则而定，可有不同说法。因此，我们需要给问题的最初陈述补充一个论证，大意是我们或许可期望这类函数描述真实世界；或者，另须提供额外的形而上学原则，作为对解的约束。"
    step2: "但我们能否做得更好？本文作者（1985）曾提议把这一问题搁置，直到对解的各种可能约束有更多说明为止。除非我们有理由认为这类函数当真描述了世界，否则我们很可以觉得，一个解既非紧迫，也非唯一。例如，世界或许可以完全用 $C^{\\infty}$ 函数（对一切 $n$ 存在 $n$ 阶导数，如 cos、sin、log、指数函数）来描述。上述函数不在其列，因为它的导数不连续。但若这一例子是反事实的，我们该说它什么呢？视描述该可能世界的进一步原则而定，可有不同说法。因此，我们需要给问题的最初陈述补充一个论证，大意是我们或许可期望这类函数描述真实世界；或者，另须提供额外的形而上学原则，作为对解的约束。"
  - id: 17
    source: "A related problem is the fracture problem, described by Medlin. Imagine fracturing a material body such as a piece of wood, regarded as a plenum (full of matter). What is the state of the two new surfaces after the fracture? Unless matter is to be created or destroyed, we seem to have to say that the break is half-open, with one new matter-surface being topologically closed and the other being topologically open. But which surface is which? There seems to be no principle to determine which. In response, it can be asked how seriously we have to take the postulation of a plenum. If for example matter is as Boscovich suggested, punctate and surrounded by fields, then there are no plena, and the problem is no more than hypothetical. Or again, there might be plena but other principles might apply. For example, mass-density functions might drop smoothly to zero at the boundaries between matter and empty space, which would mean that all surfaces were open. On the other hand, it might be instead that as a matter of fact all surfaces are topologically closed. This would need an inconsistent solution (see below, sections 5–7)."
    step1: "一个相关的问题是 Medlin 所描述的断裂问题。设想断裂一个物质体，例如一块木头，把它视为一个充满（物质）的连续体。断裂后两个新表面的状态如何？除非物质要被创造或消灭，否则我们似乎不得不说：断裂处是半开的，一个物质表面拓扑上闭，另一个拓扑上开。但哪个是哪个？似乎没有原则可判定。回应是：可以追问，我们究竟要在多大程度上认真对待“连续体”的设定。例如，若物质如 Boscovich 所暗示，是点状的、被场所包围，那就没有连续体，问题便只是假说性的。又或者，也许存在连续体，但其他原则适用。例如，质量密度函数在物质与空空间交界处可能平滑地降到零，这意味着所有表面都是开的。另一方面，也许事实上所有表面在拓扑上都是闭的。这就需要一种不一致的解（见下文第 5–7 节）。"
    step2: "一个相关的问题是 Medlin 所描述的断裂问题。设想断裂一个物质体，例如一块木头，把它视为一个充满（物质）的连续体（plenum）。断裂后两个新表面的状态如何？除非物质要被创造或消灭，否则我们似乎不得不说：断裂处是半开的，一个物质表面拓扑上闭，另一个拓扑上开。但哪个是哪个？似乎没有原则可判定。回应是：可以追问，我们究竟要在多大程度上认真对待“连续体”的设定。例如，若物质如 Boscovich 所暗示，是点状的、被场所包围，那就没有连续体，问题便只是假说性的。又或者，也许存在连续体，但其他原则适用。例如，质量密度函数在物质与空空间交界处可能平滑地降到零，这意味着所有表面都是开的。另一方面，也许事实上所有表面在拓扑上都是闭的。这就需要一种不一致的解（见下文第 5–7 节）。"
  - id: 18
    source: "If a changing thing has different and incompatible properties then a contradiction is threatened. The obvious move to make when confronted with the fact that things change, is to say with Kant (1781) that they change in relation to time, which avoids the inconsistency. But then another problem emerges. In what sense can one thing persist through change? Identity across time and space is the mark of universals, but we also account particulars such as billiard balls and persons as having self-identity across time."
    step1: "若一个变化着的事物具有不同且不相容的属性，矛盾便迫近。面对事物变化这一事实，显而易见的应对是与 Kant（1781）一道说：它们相对于时间而变化，这便避免了不一致。但随即出现另一个问题：一物以何种意义在变化中持续存在？跨越时间与空间的同一性是共相的标志，但我们同样把台球、人这样的殊相视为具有跨越时间的自我同一性。"
    step2: "若一个变化着的事物具有不同且不相容的属性，矛盾便迫近。面对事物变化这一事实，显而易见的应对是与 Kant（1781）一道说：它们相对于时间而变化，这便避免了不一致。但随即出现另一个问题：一物以何种意义在变化中持续存在？跨越时间与空间的同一性是共相的标志，但我们同样把台球、人这样的殊相视为具有跨越时间的自我同一性。"
  - id: 19
    source: "Aristotle’s views on the persistence of things are worth noting here. At the risk of gross oversimplification of what is treated thoroughly elsewhere (see the entry on Aristotle’s metaphysics, it can be said that early on he took the view that what persists over time and through change, the *substrate*, can be identified with *matter*, and that it is the *form* of matter which is acquired or lost (*Physics* I, 5–7). When he wrote the *Categories*, it is *substance* which is said to be susceptible of contrary attributions; and as such substance itself has no opposites. (Categories 4a10). In the Metaphysics $Z$, a more complex doctrine of substance, that which $is$, is worked out. Substance is not the substrate, matter, since that lacks particularity. *Its* substance, what it is to be *that thing*, that without which it does not exist, is its *essence*. Aristotle then links essence with his theory of causes, being identified variously with its final cause and with its formal cause."
    step1: "亚里士多德关于事物持续存在的看法值得一提。冒着把别处详尽讨论的内容（见“亚里士多德的形而上学”词条）过度简化的风险，可以说：他早期认为，跨越时间、经历变化而持续存在的东西——*基体*——可以等同于*质料*，而获得或失去的则是质料的*形式*（《物理学》I, 5–7）。他写《范畴篇》时，是*实体*被说成能够承受相反的归属；而实体本身没有对立物（《范畴篇》4a10）。在《形而上学》$Z$ 卷中，他发展出更复杂的实体学说，即“是其所是”的东西。实体不是基体即质料，因为后者缺乏个别性。*它*的实体，即成为*那个东西*之所是、没有它就不能存在的东西，是它的*本质*。亚里士多德随后把本质与他的原因理论联系起来，把它分别等同于目的因与形式因。"
    step2: "亚里士多德关于事物持续存在的看法值得一提。冒着把别处详尽讨论的内容（见“亚里士多德的形而上学”词条）过度简化的风险，可以说：他早期认为，跨越时间、经历变化而持续存在的东西——*基体*（substrate）——可以等同于*质料*（matter），而获得或失去的则是质料的*形式*（form）（《物理学》卷一，5–7 章）。他写《范畴篇》时，是*实体*（substance）被说成能够承受相反的归属；而实体本身没有对立物（《范畴篇》4a10）。在《形而上学》$Z$ 卷中，他发展出更复杂的实体学说，即“是其所是”的东西。实体不是基体即质料，因为后者缺乏个别性。*它*的实体，即成为*那个东西*之所是、没有它就不能存在的东西，是它的*本质*（essence）。亚里士多德随后把本质与他的原因理论联系起来，把它分别等同于目的因与形式因。"
  - id: 20
    source: "Although Aristotle’s views about change — in particular, his distinction between essence and accident — have sometimes been thought to contain a solution to the problem of persistent identity through change, it seems to this author that they do not really get a grip on the problem in its most fundamental form. This is perhaps clearest in the Categories, where the ability of substance to admit incompatible accidental features is more-or-less definitional."
    step1: "尽管亚里士多德关于变化的看法——特别是他对本质与偶性的区分——有时被认为包含了对“通过变化的持续同一性”问题的解答，但本文作者看来，它们并未真正抓住该问题最根本的形态。这在《范畴篇》中也许最清楚：在那里，实体接纳不相容的偶有特征的能力几乎是定义性的。"
    step2: "尽管亚里士多德关于变化的看法——特别是他对本质与偶性（accident）的区分——有时被认为包含了对“通过变化的持续同一性”问题的解答，但本文作者看来，它们并未真正抓住该问题最根本的形态。这在《范畴篇》中也许最清楚：在那里，实体接纳不相容的偶有特征的能力几乎是定义性的。"
  - id: 21
    source: "The problem can be made sharper by reflection upon the law of the indiscernibility of identicals. If a thing-at-$t_{1}$ were identical with a thing-at-$t_{2}$, then they should share all their properties. What sort of identity is it, if not that? But if the properties at different times are incompatible, then a contradiction follows. Because they emphatically took the view that contradictions are never true, the great Buddhist logicians Dharmakirti (C7th CE) and his commentator Dharmottara (C8–9th CE), who had certainly read their Aristotle, deduced that identity over time does not exist (see Scherbatsky (1930) vol 2). This is the Buddhist doctrine of moments, essentially an ontology of instantaneous temporal slices. The doctrine of the momentariness of existence is felicitously in accord with the core Buddhist doctrine of the impermanence of all things. The doctrine of moments might seem to be an unnecessarily strong application of impermanence, certainly unnecessary for soteriological purposes, were it not for the evident strength of the argument in its favour, not to mention its accord with the spacetime ontology of modern physics. On the other hand, it is of course psychologically very difficult to believe that one’s own self, as something genuinely self-identical, has not endured from moment-to-moment in the past. Even so, the thesis of the momentariness of human existence has had a recent defender in Derek Parfit (1984), who asks what sort of principle could unify the temporal stages sufficiently closely to be worth calling identity. He argues that none could, and proposes that internalising the momentariness of our lives has a beneficial effect on how we should face our deaths."
    step1: "反思同一物的不可区分律，可使问题更尖锐。若“在 $t_{1}$ 的物”与“在 $t_{2}$ 的物”相同一，它们便应共享一切属性。若不是这样，那又是何种同一性？但若不同时间的属性不相容，便推出矛盾。由于坚决主张矛盾永不真，伟大的佛教逻辑学家法称（Dharmakirti，公元 7 世纪）及其注疏者法上（Dharmottara，公元 8–9 世纪）——他们无疑读过亚里士多德——推断跨越时间的同一性并不存在（见 Scherbatsky（1930）第 2 卷）。这就是佛教的刹那论，本质上是一种瞬时时间切片的本体论。存在的刹那性学说，恰与佛教关于万法无常的核心教义相契合。刹那论似乎是“无常”的不必要之强运用，对解脱目的而言当然不必要——若非支持它的论证显然有力，更不用说它与现代物理学的时空本体论相合了。另一方面，在心理上当然很难相信，作为真正自我同一者的自我，过去未曾从一刹那到另一刹那持续下来。即便如此，人类存在的刹那性论题最近有了一位辩护者 Derek Parfit（1984），他追问：什么原则能把诸时间阶段足够紧密地统一起来，以至于值得称为同一性。他论证说没有这样的原则，并提出：内化我们生命的刹那性，对我们的死亡观有有益影响。"
