    source: "This was von Wright’s proposed account of a continuous change in an ontology of intervals. The state $\\neg p$ changes continuously to $p$ if there is a preceding interval which is $\\neg p$ throughout, then an interval with $\\neg p$ and $p$ dense in each other, then a succeeding interval with p holding throughout. Von Wright described this as a kind of inconsistency. Unfortunately it is not clear from his written words whether he had in mind that the situation was inconsistent or only possibly inconsistent. His argument seems to be this. In an ontology of intervals we begin with descriptions like “It rained here yesterday” which means that it rained sometime here yesterday. The basic description is thus “$p$ holds (somewhere) in the interval $I$.” The special case where $p$ holds throughout $I$ is noted, where to hold throughout is for there to be no subinterval in which $\\neg p$ holds. Now $p$’s holding in $I$ is of course compatible with $\\neg p$’s holding in $I$. But there is no contradiction here, as long as there is a partition of $I$ into subintervals such that $p$ holds throughout the subinterval or $\\neg p$ holds throughout the subinterval. Thus if we take in that a disjunction holds in an interval just in case there is a partition in which each of the disjuncts holds throughout its subintervals, we can say that if there is such a partition for $p$, then the law of excluded middle $p \\vee \\neg p$ holds throughout the interval. Von Wright introduced the modal operator $Np$ for “Necessarily $p$.” If we define “$Np$ holds in $I$” to mean that $p$ holds throughout $I$, we can say that if there is no continuous change in the above sense, then Excluded Middle LEM holds necessarily, $N(p \\vee \\neg p)$. However, defining the modal “Possibly” in the usual way as $M =df \\neg N\\neg$ and assuming de Morgan’s Laws, Double Negation and Commutativity, we get the result that in an interval in which there is continuous change, $M(p \\amp \\neg p)$ holds, i.e.. a contradiction is possible. Presumably it further follows that in a subinterval which has continuous change throughout, $N(p \\amp \\neg p)$ holds. Needless to say this implies that a contradiction is true in that subinterval. We might note that the result that continuous change is a true contradiction follows without the detour through modal logic, since if LEM is false then $\\neg(p \\vee \\neg p)$ holds for some $p$, and so by de Morgan and Double Negation, $p \\amp \\neg p$ holds (throughout)."
    step1: "这就是 von Wright 关于区间本体论中连续变化的拟议说明。若存在一个 $\\neg p$ 贯穿的前置区间，接着一个 $\\neg p$ 与 $p$ 彼此稠密的区间，再接着一个 $p$ 贯穿的后继区间，那么状态 $\\neg p$ 就连续地变为 $p$。Von Wright 把这描述为一种不一致。遗憾的是，从他的文字看，并不清楚他所想的是该情形不一致，还是仅可能不一致。他的论证似乎是这样的。在区间的本体论中，我们从“这里昨天下过雨”这类描述出发，它意为昨天这里某个时候下过雨。因此基本描述是“$p$ 在区间 $I$ 中（某处）成立”。特殊情形是 $p$ 贯穿 $I$ 成立，所谓贯穿成立，即不存在 $\\neg p$ 成立的子区间。$p$ 在 $I$ 中成立当然与 $\\neg p$ 在 $I$ 中成立相容。但这里没有矛盾，只要存在 $I$ 的一个划分成子区间，使得 $p$ 贯穿该子区间成立或 $\\neg p$ 贯穿该子区间成立。于是，若我们规定：一个析取式在区间中成立，当且仅当存在一个划分，使每个析取支贯穿其子区间成立，那么可以说：若对 $p$ 存在这样的划分，则排中律 $p \\vee \\neg p$ 贯穿整个区间成立。Von Wright 引入模态算子 $Np$ 表示“必然 $p$”。若我们把“$Np$ 在 $I$ 中成立”定义为 $p$ 贯穿 $I$ 成立，那么可以说：若上述意义上没有连续变化，则排中律 LEM 必然成立，即 $N(p \\vee \\neg p)$。然而，若按通常方式把模态“可能”定义为 $M =df \\neg N\\neg$，并假定德摩根律、双重否定与交换律，我们得到：在一个有连续变化的区间中，$M(p \\amp \\neg p)$ 成立，即矛盾是可能的。想必还可进一步推出：在一个整体上有连续变化的子区间中，$N(p \\amp \\neg p)$ 成立。不用说，这蕴含在该子区间中矛盾为真。我们可以注意到：连续变化是真矛盾这一结果，无需绕道模态逻辑即可推出，因为若 LEM 为假，则对某个 $p$，$\\neg(p \\vee \\neg p)$ 成立，于是由德摩根律与双重否定，$p \\amp \\neg p$（贯穿地）成立。"
    step2: "这就是 von Wright 关于区间本体论中连续变化的拟议说明。若存在一个 $\\neg p$ 贯穿的前置区间，接着一个 $\\neg p$ 与 $p$ 彼此稠密的区间，再接着一个 $p$ 贯穿的后继区间，那么状态 $\\neg p$ 就连续地变为 $p$。Von Wright 把这描述为一种不一致。遗憾的是，从他的文字看，并不清楚他所想的是该情形不一致，还是仅可能不一致。他的论证似乎是这样的。在区间的本体论中，我们从“这里昨天下过雨”这类描述出发，它意为昨天这里某个时候下过雨。因此基本描述是“$p$ 在区间 $I$ 中（某处）成立”。特殊情形是 $p$ 贯穿 $I$ 成立，所谓贯穿成立，即不存在 $\\neg p$ 成立的子区间。$p$ 在 $I$ 中成立当然与 $\\neg p$ 在 $I$ 中成立相容。但这里没有矛盾，只要存在 $I$ 的一个划分成子区间，使得 $p$ 贯穿该子区间成立或 $\\neg p$ 贯穿该子区间成立。于是，若我们规定：一个析取式在区间中成立，当且仅当存在一个划分，使每个析取支贯穿其子区间成立，那么可以说：若对 $p$ 存在这样的划分，则排中律 $p \\vee \\neg p$ 贯穿整个区间成立。Von Wright 引入模态算子 $Np$ 表示“必然 $p$”。若我们把“$Np$ 在 $I$ 中成立”定义为 $p$ 贯穿 $I$ 成立，那么可以说：若上述意义上没有连续变化，则排中律 LEM 必然成立，即 $N(p \\vee \\neg p)$。然而，若按通常方式把模态“可能”定义为 $M =df \\neg N\\neg$，并假定德摩根律、双重否定与交换律，我们得到：在一个有连续变化的区间中，$M(p \\amp \\neg p)$ 成立，即矛盾是可能的。想必还可进一步推出：在一个整体上有连续变化的子区间中，$N(p \\amp \\neg p)$ 成立。不用说，这蕴含在该子区间中矛盾为真。我们可以注意到：连续变化是真矛盾这一结果，无需绕道模态逻辑即可推出，因为若 LEM 为假，则对某个 $p$，$\\neg(p \\vee \\neg p)$ 成立，于是由德摩根律与双重否定，$p \\amp \\neg p$（贯穿地）成立。"
  - id: 34
    source: "This ingenious construction has its problems. It is certainly dangerous to assume De Morgan’s Laws and Double Negation when the logic of intervals is the case in point. They both fail for open set logic, which is to say intuitionism, just as they both fail for its topological dual, closed set logic. On the other hand, what is one to say if the world is structured as intervals, non-punctate, and if there are subintervals in which propositions and their negations are dense in each other, interspersed with intervals where one of the propositions holds throughout? The latter are clearly periods of non-change, and the former are reasonably described as intervals of change. And yet it would seem that the best one can do is to say that $p \\amp \\neg p$ holds in the transition periods: there appears to be no consistent way of describing what is happening in the situation which adheres to intervals and eschews points."
    step1: "这一精巧的构造有其问题。当问题所涉是区间的逻辑时，假设德摩根律与双重否定当然危险。对开集逻辑即直觉主义而言，二者皆不成立；对其拓扑对偶、闭集逻辑亦然。另一方面，若世界按区间而非点来结构，且存在一些子区间（命题与其否定在其中彼此稠密）与另一些区间（其中一个命题贯穿成立）交错，该怎么说呢？后者显然是无变化的时期，前者则合理地描述为变化的区间。然而，看来我们最多只能说 $p \\amp \\neg p$ 在过渡时期成立：似乎没有一致的方式来描述这一坚守区间、排斥点子的情形中发生了什么。"
    step2: "这一精巧的构造有其问题。当问题所涉是区间的逻辑时，假设德摩根律与双重否定当然危险。对开集逻辑即直觉主义而言，二者皆不成立；对其拓扑对偶、闭集逻辑亦然。另一方面，若世界按区间而非点来结构，且存在一些子区间（命题与其否定在其中彼此稠密）与另一些区间（其中一个命题贯穿成立）交错，该怎么说呢？后者显然是无变化的时期，前者则合理地描述为变化的区间。然而，看来我们最多只能说 $p \\amp \\neg p$ 在过渡时期成立：似乎没有一致的方式来描述这一坚守区间、排斥点子的情形中发生了什么。"
