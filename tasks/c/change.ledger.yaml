    source: "This theme is echoed in a recent debate on the topic of ‘temporary intrinsics’, which also connects with the earlier-mentioned concept of Cambridge change. Cambridge change in a thing is still change in *something or other*, but it is not always change in *the thing itself*. Thus we might seek to isolate change in the thing itself by change in its *intrinsic* properties. But then we have the problem of in what sense it continues to be just one thing through a change in its intrinsic properties. Now obviously this raises the question of how to define the concept of intrinsicality. We do not address that here, since it is discussed elsewhere in this *Encyclopedia*, see Weatherson (2002). So assuming a *prima facie* distinction between the intrinsic and extrinsic properties of a thing, how does a thing persist through changes in its intrinsic properties? David Lewis and others debated this question, e.g., Lewis (1986), (1988). Several options for a solution were canvassed, three of which were as follows."
    step1: "这一主题在最近关于“暂时内在性质”的争论中有所回响，后者也与前文提到的剑桥变化概念相连。一物的剑桥变化仍然是*某个东西或另一个东西*中的变化，但未必是*该物自身*中的变化。于是我们或许想通过其*内在*属性的变化来孤立出该物自身的变化。但随之而来的问题是：在内在属性变化中，它以何种意义继续恰是同一个东西？这显然引出如何定义内在性概念的问题。此处我们不处理它，因为它在本书的另一词条中讨论，见 Weatherson（2002）。因此，假定一物的内在属性与外在属性之间有*初步的*区分，那么一物如何通过其内在属性的变化而持续存在？David Lewis 等人曾争论此问题，例如 Lewis（1986）、（1988）。人们提出了若干解题选项，其中三种如下。"
    step2: "这一主题在最近关于“暂时内在性质”（temporary intrinsics）的争论中有所回响，后者也与前文提到的剑桥变化概念相连。一物的剑桥变化仍然是*某个东西或另一个东西*中的变化，但未必是*该物自身*中的变化。于是我们或许想通过其*内在*（intrinsic）属性的变化来孤立出该物自身的变化。但随之而来的问题是：在内在属性变化中，它以何种意义继续恰是同一个东西？这显然引出如何定义内在性（intrinsicality）概念的问题。此处我们不处理它，因为它在本书的另一词条中讨论，见 Weatherson（2002）。因此，假定一物的内在属性与外在属性之间有*初步的*（prima facie）区分，那么一物如何通过其内在属性的变化而持续存在？David Lewis 等人曾争论此问题，例如 Lewis（1986）、（1988）。人们提出了若干解题选项，其中三种如下。"
