    source: "In asking how strong are the arguments in favour of this well-crafted position, we return to Priest’s three arguments against the rival, consistent, extrinsic, cinematic view. We recall the first argument was the “abutment” argument: consistent change cannot allow that there is a (single) time at which the change takes place. This will not sway the opposition, who will reply that it is the nature of change, even change at a point, that it is relational in that it requires comparison with nearby points; hence the demand for an intrinsic conception of change is a mistake."
    step1: "要问这一精心构筑的立场的论证有多强，我们回到 Priest 反对与之对立的、一致的、外在的、电影式观点的三个论证。回想第一个是“邻接”论证：一致的变化不能容许有（单一）时刻作为变化发生之处。这不会动摇对方，他们会回答说：变化的本质，哪怕是点上的变化，就是关系性的，因为它需要与邻近点比较；因此，对变化的内在概念的要求是错误。"
