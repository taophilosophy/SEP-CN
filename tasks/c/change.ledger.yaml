    source: "The third argument, Zeno’s arrow, has greater force though. How can any number, even an infinite number, of zeros add up to a nonzero? The mathematics of measure theory may say that intervals have a non-zero measure whereas individual points are zero, but so what? What is needed is a story which makes its application intelligible and non-arbitrary. If this is not forthcoming, there is the strong counter-intuition that zero marks the absence of existence; and no number of absent or non-existent things or quantities makes a present, existent thing or quantity."
    step1: "不过，第三个论证，即芝诺的飞矢，更有力。任何数目的零，哪怕是无穷多个零，如何能加起来为非零？测度论的数学可以说区间有非零测度而单个点是零，但那又怎样？需要的是一个使其应用可理解且不任意的说明。若这样的说明不出现，便有强烈的反直觉：零标志存在的缺失；而无论多少缺失的或不存在的物或量，都凑不出一个在场的、存在着的物或量。"
