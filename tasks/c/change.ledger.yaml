version: 1
slug: change
segments:
  - id: 1
    source: "Change is so pervasive in our lives that it almost defeats description and analysis. One can think of it in a very general way as alteration. But alteration in a thing raises subtle problems. One of the most perplexing is the problem of the consistency of change: how can one thing have incompatible properties and yet remain the same thing? Some have held that change is a consistent process, and rendered so by the existence of time. Others have held that the only way to make sense of change is as an inconsistency. This entry surveys the history of this problem and cognate issues, and concludes that the case for change as inconsistency cannot be dismissed so easily."
    step1: "变化在我们的生活中如此普遍，以至于几乎使描述和分析都无从下手。人们可以在一个非常一般的意义上把它视为alteration（变更）。但一个事物中的变更会带来微妙的问题。其中最令人困惑者之一是变化的一致性问题：一个事物如何能具有不相容的属性，却仍然是同一个事物？有些人主张，变化是一个一致的过程，并且因时间的存在而如此。另一些人则主张，使变化有意义的唯一方式是把变化视为一种不一致。本词条考察这一问题及其相关问题的历史，并得出结论：把变化视为不一致的主张不能轻易地被驳回。"
    step2: "变化在我们的生活中无处不在，几乎令描述与分析束手无策。广义地说，它可被理解为一种变更。然而，一物的变更会带来若干微妙的问题。最令人费解者之一，是变化的同一性难题：一个事物如何能同时拥有不相容的属性，却依然是同一个事物？有人认为变化是一致的历程，时间的存在使之如此；另有人认为，唯有把变化看作不一致，才能使它变得可理解。本词条梳理这一问题及其相关问题的历史，并断言：把变化视为不一致的论证，并不能轻易打发。"
  - id: 2
    source: "The most general conception of change is simply difference or nonidentity in the features of things. Thus we speak of the change of temperature from place-to-place along a body, or the change in atmospheric pressures from place-to-place as recorded by isobars, or the change of height of the surface of the earth as recorded by a contour map. Contour lines record sameness in quantities (such as 100 metres) from the same quantity-kind (such as height), and the differences recorded by different contour lines are quantity-differences (100 metres as opposed to 200 metres). The philosophical question here is how to construe such statements of identity and nonidentity, and it seems that the problem of universals is the main issue."
    step1: "变化最一般的概念，就是事物特征上的差异或非同一性。于是我们谈论温度沿一个物体从一处到另一处的变化，或等压线所记录的大气压力从一处到另一处的变化，或等高线所记录的地球表面高度的变化。等高线记录同一数量类（如高度）中的量的同一（如 100 米），而不同等高线记录的差异是数量差异（100 米相对于 200 米）。这里的哲学问题是，如何解释这类同一与非同一的陈述，而看来共相问题是主要问题。"
    step2: "变化的普遍概念，无非是事物属性上的不同或非同。譬如我们说温度沿物体逐点变化，等压线记下气压的逐点变化，等高线记下地表高度的逐点变化。等高线标示同一量类（如高度）里的量的相等（如 100 米），不同等高线之间的差异则是量差（100 米与 200 米之差）。此处哲学问题在于如何理解这类相等与不相等的陈述；核心似乎仍是共相问题。"
  - id: 3
    source: "A narrower usage of “change” is exemplified by change in the properties of a body over time, that is temporal change. This essay will focus on temporal change. We begin by separating the concept of change from several cognate concepts, specifically cause, time and motion. Then we briefly survey attempts by such thinkers as Parmenides and McTaggart to deny change. There follows an account of the problem of the instant of change, where it is concluded that the problem is too general to admit a single solution, but requires specification of further metaphysical principles envisaged as constraints on a type of solution. The final three sections, the bulk of the essay, consider the question of the consistency or inconsistency of change, which in one way or another looms over all our discussions. It emerges that the case for change as an inconsistent process is stronger than might be expected."
    step1: "“变化”的一个较窄的用法，体现于一个物体属性随时间的改变，即时间性变化。本文聚焦于时间性变化。我们首先把变化概念与几个相关概念区分开，特别是原因、时间与运动。然后我们简要考察巴门尼德与 McTaggart 等思想家否认变化的尝试。接着是关于变化瞬间问题的说明，结论是这个间题过于一般化，不能容许单一解法，而需要进一步形而上学原则的详细规定，这些原则被视为对某类解法的约束。最后三节，即本文的主体，考虑变化的一致或不一致问题，这个问题以某种方式笼罩着我们全部的讨论。结果表明，把变化视为不一致过程的主张比可能预想的更强。"
    step2: "“变化”一词较窄的用法，指一物属性随时间的改变，即时间性的变化。本文只讨论这种时间性变化。我们先把变化概念与几个相邻概念——特别是原因、时间与运动——区分开来，继而简要考察巴门尼德、McTaggart 等人否认变化的种种尝试。随后论及变化瞬间的难题，结论是：该问题过于宽泛，没有单一解，必须诉诸更进一步的形而上学原则，把它们视作对某类解法的约束。最后三节为全文主体，讨论变化的一致或不一致问题——它或多或少笼罩着我们全部讨论。结论是：把变化看作不一致过程的论证，比预想的更为有力。"
  - id: 4
    source: "Our interest in this essay will be on the special case of temporal change. So construed, the notion of change is obviously bound up with notions of cause, time and motion. Now a distinction between change and cause can certainly be drawn. It is clear that uncaused change is conceptually possible, and arguably actual in such things as radioactive decay. Conversely, the operation of a sustaining cause results in no change in a thing, if the thing would otherwise be undergoing a change which the sustaining cause prevents. Hence, the operation of a cause on a thing is neither necessary nor sufficient for change in that thing. Accordingly, we put the topic of cause in the background when discussing change."
    step1: "本文的兴趣将是时间性变化的特殊情形。如此理解，变化概念显然与原因、时间与运动的概念紧密相连。当然，变化与原因之间是可以划出区别的。无原因的变化在概念上是可能的，并且在诸如放射性衰变这类事物中可以说是现实的。相反，一个维持性原因的作用不会在一物中产生变化，如果该物否则会经历一种被此维持性原因阻止的变化的话。因此，一个原因对一物的作用，既非该物变化的必要条件，也非充分条件。据此，在讨论变化时，我们把原因这一论题置于背景之中。"
    step2: "本文关注的是时间性变化这一特殊情形。如此界定，变化概念便与原因、时间、运动密不可分。不过，变化与原因之间确可划界。无因的变化在概念上可能成立，放射性衰变等事例中甚至可以说现实如此。反过来，一个维持性原因作用于某物，若该物本将发生被此原因阻止的变化，则此作用并不带来变化。于是，原因作用于一物，既非该物变化的必要条件，亦非充分条件。因此，下文讨论变化时，我们把原因论题搁置一旁。"
  - id: 5
    source: "Time cannot be so backgrounded. The thesis that time could pass without change in anything at all has proved controversial, and we have adopted the usage that change in a thing implies the passage of time. Aristotle nonetheless argued that change is distinct from time because change occurs at different rates, whereas time does not (Physics IV,10). This essay focusses on the topic of change, while not denying that the topic of time is inseparable from it. Motion, as change in place, will figure prominently in our discussion."
    step1: "时间不能这样被置于背景。“时间可以在任何事物都没有变化的情况下流逝”这一论题已证明是有争议的，我们采用了这样的用法：一物的变化意味着时间的流逝。不过，亚里士多德主张变化不同于时间，因为变化以不同速率发生，而时间则不然（《物理学》IV,10）。本文聚焦于变化论题，但不否认时间论题与之不可分离。运动作为位置的变化，将在我们的讨论中占显著地位。"
    step2: "时间却不能这样被搁置。“时间可以在毫无变化的情况下流逝”这一论题颇有争议；我们采取的用法是：一物变化即蕴含时间流逝。亚里士多德仍主张变化与时间有别，因为变化有快慢之分，时间却没有（《物理学》卷四第 10 章）。本文以变化为题，却不否认时间问题与之不可分割。运动即位置的变化，将在下文中占据突出位置。"
  - id: 6
    source: "One well-known idea is that of Cambridge change. This can be arrived at by following the well-tried analytical technique of re-casting philosophically important discussions and concepts in the meta-language. Thus a Cambridge change in a thing is a change in the descriptions (truly) borne by the thing. The phrase “Cambridge change” seems to be due to Geach (1969, 71–2), who so named it to mark its employment by great Cambridge philosophers such as Russell and McTaggart. It is apparent that Cambridge change includes all cases ordinarily thought of as change, such as change of colour, from “red” to “non-red.” But it also includes changes in the relational predicates of a thing, such as when I change from having “non-brother” true of me to having “brother” true of me, just when my mother gives birth to a second son. It might seem faintly paradoxical that there need be no (other) changes in me (height, weight, colouring, memories, character, thoughts) in this circumstance, but it is simply a consequence of the above piece of metalinguistic ascent. It does point up, though, that in attempting to capture the object-language concept, one should take note of the distinction between the monadic or internal or intrinsic properties of a thing, and its relations or external or extrinsic features. Thus the natural view of change is that real, metaphysical change in a thing would be change in the monadic or internal or intrinsic properties of the thing. We will return to this point in Section 5."
    step1: "一个著名的观念是剑桥变化。它可以通过遵循一种久经考验的分析技术而达到，即在元语言中重新表述哲学上重要的讨论和概念。于是一物中的剑桥变化，是该事物（真正）具有的那些描述的变化。“剑桥变化”这个短语似乎出自 Geach（1969, 71–2），他如此命名是为了标示罗素与 McTaggart 等伟大的剑桥哲学家对它的运用。显然，剑桥变化包括通常被认为变化的一切情形，例如颜色从“红”到“非红”的变化。但它也包括一物关系谓词的变化，例如正当我母亲生下第二个儿子时，我从“非兄弟”对我为真变为“兄弟”对我为真。在这种情形下，我身上可以没有任何（其他）变化（身高、体重、肤色、记忆、性格、思想），这似乎略有悖谬，但这不过是上述元语言上升的一个结果。然而它确实表明，在试图把握对象语言概念时，应当注意一物的单元（monadic）或内在（internal）或固有（intrinsic）属性，与其关系或外在（external）或外涉（extrinsic）特征之间的区别。因此，变化的自然观念是：一物中真正的、形而上学的变化，将是该物单元或内在或固有属性的变化。我们将在第 5 节回到这一点。"
    step2: "一个著名的观念是剑桥变化（Cambridge change）。它可以通过遵循一种久经考验的分析技术而达到，即在元语言中重新表述哲学上重要的讨论和概念。于是一物中的剑桥变化，是该事物（真正）具有的那些描述的变化。“剑桥变化”这个短语似乎出自 Geach（1969, 71–2），他如此命名是为了标示罗素与 McTaggart 等伟大的剑桥哲学家对它的运用。显然，剑桥变化包括通常被认为变化的一切情形，例如颜色从“红”到“非红”的变化。但它也包括一物关系谓词的变化，例如正当我母亲生下第二个儿子时，我从“非兄弟”对我为真变为“兄弟”对我为真。在这种情形下，我身上可以没有任何（其他）变化（身高、体重、肤色、记忆、性格、思想），这似乎略有悖谬，但这不过是上述元语言上升的一个结果。然而它确实表明，在试图把握对象语言概念时，应当注意一物的单元（monadic）、内在（internal）或固有（intrinsic）属性，与其关系、外在（external）或外涉（extrinsic）特征之间的区别。因此，变化的自然观念是：一物中真正的、形而上学的变化，将是该物单元、内在或固有属性的变化。我们将在第 5 节回到这一点。"
  - id: 7
    source: "It is on the face of it extremely implausible to deny change, but extreme implausibility has not always deterred philosophers. The Eleatics (C5th BCE), particularly Parmenides, appear to have been the first to do so. Parmenides maintained that whatever one speaks about or thinks about must in some sense exist; if it did not exist then it is nothing, so one would be speaking or thinking about nothing, which would be empty. From this thesis, it is deduced that the existing thing cannot have come into existence, because to say that it could would be to speak of a time when it did not exist. By similar reasoning, existing things are eternal because they cannot go out of existence. It is now a small step to conclude that change is an illusion, on the grounds that a change in a thing implies that there was a time when the thing-as-changed did not exist. However, this argument is not persuasive: the premiss that the non-existent cannot be thought or spoken about is dubious."
    step1: "表面看来，否认变化极其难以置信，但极度的难以置信并不总能吓退哲学家。爱利亚学派（公元前 5 世纪），特别是巴门尼德，似乎是最早这样做的人。巴门尼德主张，凡人们所谈论或思考的东西，都必须在某种意义上是存在的；若它不存在，那便是虚无，于是人们谈论或思考的便是虚无，即空洞无物。由这一论题可推得：存在之物不可能进入存在，因为说它能够如此，等于说有一个它尚不存在的时刻。同理，存在之物是永恒的，因为它们不可能退出存在。由此再进一步，便得出结论：变化是幻觉，理由是一物的变化意味着存在一个“变化后的物”尚未存在的时刻。然而这一论证并无说服力：那“不存在者不能被思考或谈论”的前提是靠不住的。"
    step2: "否认变化，表面看来极其难以置信；但极度的难以置信并不总能吓退哲学家。爱利亚学派（公元前 5 世纪），尤其是巴门尼德，似乎是最早这样做的人。巴门尼德主张，凡人们所谈论或思考的东西，都必须在某种意义上是存在的；若它不存在，那便是虚无，于是人们谈论或思考的便是虚无，即空洞无物。由这一论题可推得：存在之物不可能进入存在，因为说它能够如此，等于说有一个它尚不存在的时刻。同理，存在之物是永恒的，因为它们不可能退出存在。由此再进一步，便得出结论：变化是幻觉，理由是一物的变化意味着存在一个“变化后的物”尚未存在的时刻。然而这一论证并无说服力：那“不存在者不能被思考或谈论”的前提是靠不住的。"
  - id: 8
    source: "Parmenides’ disciples Melissus and Zeno developed this theme. Melissus argued that motion implies empty space to move into, but empty space is a nothing and so cannot exist, so that motion is impossible since it implies a contradiction. This argument requires the dubious premisses (1) that empty space is a nothing (which is denied by realists from Newton to Nerlich), and (2) that motion would have to be change relative to space. Even those who have held that empty space is a nothing (relationists from Leibniz to Mach and onward) have not generally denied motion, proposing instead that motion of a thing is change in the spatial relations between that thing and other things."
    step1: "巴门尼德的弟子麦里梭与芝诺发挥了这一主题。麦里梭论证说，运动意味着要有虚空可供移入，而虚空是虚无，不可能存在，所以运动因蕴含矛盾而不可能。这一论证需要两个可疑的前提：（1）虚空是虚无（从 Newton 到 Nerlich 的实在论者都否认这一点）；（2）运动必须是与空间相对的变化。即使那些主张虚空是虚无的人（从 Leibniz 到 Mach 及其后的关系论者），一般也并不否认运动，而是主张一物的运动是它与其他事物之间空间关系的变化。"
    step2: "巴门尼德的弟子麦里梭（Melissus）与芝诺（Zeno）发挥了这一主题。麦里梭论证说，运动意味着要有虚空可供移入，而虚空是虚无，不可能存在，所以运动因蕴含矛盾而不可能。这一论证需要两个可疑的前提：（1）虚空是虚无（从 Newton 到 Nerlich 的实在论者都否认这一点）；（2）运动必须是与空间相对的变化。即使那些主张虚空是虚无的人（从 Leibniz 到 Mach 及其后的关系论者），一般也并不否认运动，而是主张一物的运动是它与其他事物之间空间关系的变化。"
  - id: 9
    source: "Zeno’s brilliant paradoxes are generally accounted as attempts to defend Parmenides. We will not look at these in detail, but his paradox of the arrow is relevant to what follows. This is the argument that an arrow in flight could not really be moving because at any given instant it would be at a place identical with itself (and not another place); something at just one (self-identical) place could not be described as moving, and an arrow which is motionless at every instant in a temporal interval must be motionless throughout the interval. Discussion of this subtle argument is deferred until discussion in a later section of Graham Priest’s position, which turns on similar premisses."
    step1: "芝诺的著名悖论通常被视为保卫巴门尼德的尝试。我们不详细考察它们，但他的飞矢悖论与下文相关。这论证说：飞行中的箭不可能真的在运动，因为在任一给定瞬间，它都处在一个与自身同一的位置（而非另一位置）；恰处在某一个（自身同一）位置的东西不能被描述为在运动；而在一时间区间内每个瞬间都静止的箭，必然在整个区间内静止。对这一精妙论证的讨论，推迟到后文讨论 Priest 的立场时进行，后者基于相似的前提。"
    step2: "芝诺的著名悖论通常被视为保卫巴门尼德的尝试。我们不详细考察它们，但他的飞矢悖论与下文相关。这论证说：飞行中的箭不可能真的在运动，因为在任一给定瞬间，它都处在一个与自身同一的位置（而非另一位置）；恰处在某一个（自身同一）位置的东西不能被描述为在运动；而在一时间区间内每个瞬间都静止的箭，必然在整个区间内静止。对这一精妙论证的讨论，推迟到后文讨论 Priest 的立场时进行，后者基于相似的前提。"
  - id: 10
    source: "McTaggart’s well-known argument (1908) that time is unreal applies equally to the unreality of (temporal) change it seems. McTaggart distinguished between two ways of attributing temporal characteristics to events. The $A$-series of events is given by the descriptions “past,” “present” and “future,” while the $B$-series is strictly in terms of the relational concepts “earlier,” “simultaneous” and “later.” Now the $B$-series is insufficient to define change, because $B$-series relations apply unchangingly if they apply at all; whatever is earlier than something is always earlier than it. Moreover, the $B$-series presupposes the $A$-series since if $X$ precedes $Y$ then there must be a time when $X$ is past and $Y$ present. This step in the argument is not at all absurd: the discovery of spacetime, the relativistic realisation of the $B$-series, has impelled many from Minkowski on to describe it as a “static” conception of time. A genuinely dynamic conception of change would thus need to have things coming into and going out of existence with the passage of time, whereas spacetime invites quantification over it all “at once” as it were."
    step1: "McTaggart（1908）那著名的“时间不真实”论证，似乎同样适用于（时间性）变化的不真实性。McTaggart 区分了把时间特征归于事件的两种方式。事件的 A-系列由“过去”“现在”“未来”这些描述给出，而 B-系列则严格地以“较早”“同时”“较晚”这些关系概念来表述。B-系列不足以定义变化，因为 B-系列关系若适用，便恒常适用；凡早于某物者，永远早于它。此外，B-系列预设了 A-系列，因为若 X 先于 Y，则必有一个 X 为过去、Y 为现在的时刻。论证中这一步绝无荒谬之处：时空的发现——B-系列的相对论式实现——使从 Minkowski 起的许多人把它描述为时间的“静态”观念。因此，一种真正动态的变化观念，就需要事物随时间的流逝而进入和退出存在，而时空则仿佛邀请人们“一下子”全部量化它。"
    step2: "McTaggart（1908）那著名的“时间不真实”论证，似乎同样适用于（时间性）变化的不真实性。McTaggart 区分了把时间特征归于事件的两种方式。事件的 A-系列由“过去”“现在”“未来”这些描述给出，而 B-系列则严格地以“较早”“同时”“较晚”这些关系概念来表述。B-系列不足以定义变化，因为 B-系列关系若适用，便恒常适用；凡早于某物者，永远早于它。此外，B-系列预设了 A-系列，因为若 X 先于 Y，则必有一个 X 为过去、Y 为现在的时刻。论证中这一步绝无荒谬之处：时空的发现——B-系列的相对论式实现——使从 Minkowski 起的许多人把它描述为时间的“静态”观念。因此，一种真正动态的变化观念，就需要事物随时间的流逝而进入和退出存在，而时空则仿佛邀请人们“一下子”全部量化它。"
  - id: 11
    source: "Thus according to McTaggart the source of time and change must be found in the $A$-series. But the $A$-series implies a vicious regress. Any event must have all three properties, pastness, presentness and futurity, but this is a contradiction. The only way out of the contradiction is to say that the event is past, present and future at different times; but the same question arises about the temporal instants themselves, which would force us to appeal to a further time series to avoid the contradiction."
    step1: "于是，按 McTaggart，时间与变化的根源必须到 A-系列中去寻找。但 A-系列蕴含一个恶性倒退。任何事件都必须具有过去性、现在性与未来性这三个属性，而这是矛盾。摆脱这一矛盾的唯一办法是说：事件在不同的时间是过去、现在与未来；但关于时间瞬间本身又产生同样的问题，这迫使我们诉诸进一步的时间序列以避免矛盾。"
    step2: "于是，按 McTaggart，时间与变化的根源必须到 A-系列中去寻找。但 A-系列蕴含一个恶性倒退。任何事件都必须具有过去性、现在性与未来性这三个属性，而这是矛盾。摆脱这一矛盾的唯一办法是说：事件在不同的时间是过去、现在与未来；但关于时间瞬间本身又产生同样的问题，这迫使我们诉诸进一步的时间序列以避免矛盾。"
