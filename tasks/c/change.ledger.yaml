    source: "We will look more closely at this argument in the next section. However, here we can remind ourselves of Hegel’s idealism. Just about everyone agrees that contradictions within ideas are easier to swallow than contradictions in the external world. In the special case of the phenomenology of motion, it is not such an absurd speculation that what distinguishes the direct perception of motion from the mere static memory of difference in position, is that nearby small variations in the stimulus are read into a kind of buffer where they are not compared as static memory does so much as overlapped or superimposed in the way that contradictions are. After all, we are not at all good at discriminating small intervals of time, as the success of 25 frames per second makes apparent. Thus, the mind constructs a kind of contradictory theory which undergoes constant update. Indeed, this may well be the source of the troublesome intuition we noted earlier, that it is one and the same thing which endures through change, even though it is acknowledged that it has different properties at different (nearby) times. If this is right, then if one thinks with Hegel that the world is a kind of idea, then the contradictoriness of ideas such as motion is apt to spill over to the contradictoriness of their realisations in the world. Indeed, even without the assumption of full-blown idealism, there is always the caution that if a theory (consistent or not) can be made out which describes an epistemic state, i.e., a cognitive state, then how can we be entirely confident that the world simply *could not* be that way?"
    step1: "下一节我们将更仔细地考察这一论证。不过这里可以提醒自己注意黑格尔的观念论。几乎人人都同意，观念内部的矛盾比外部世界中的矛盾更容易吞下。就运动现象学这一特殊情形而言，下述推测并不那么荒唐：把对运动的直接知觉与对位置差异的单纯静态记忆区分开来的，是刺激的近旁微小变化被读入一种缓冲器，在那里它们不像静态记忆那样被比较，而是像矛盾那样被重叠或叠加。毕竟，我们极不善于分辨微小的时间间隔，每秒 25 帧的成功使这一点显而易见。于是，心灵构造出一种不断更新的、带有矛盾性质的理论。这很可能是我们早先注意到的那个麻烦直觉的来源：正是同一个东西在变化中持续存在，尽管人们承认它在不同的（邻近）时间具有不同属性。若如此，那么若随黑格尔认为世界是一种观念，则运动这类观念的矛盾性便易于溢出为它们在世界中实现的矛盾性。的确，即使不假设彻底的观念论，也总有这样的告诫：若能构造出一个理论（无论一致与否）来描述一种认识状态，即认知状态，那么我们怎能完全确信世界就*不可能*是那样呢？"
