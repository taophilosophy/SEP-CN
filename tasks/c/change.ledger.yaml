    source: "The second argument was that the cinematic view is incompatible with the Laplacean view that the past determines the present. The way Priest puts it is not so plausible: he says that Laplaceanism is possible, whereas the cinematic view rules it out “*a priori*” (p. 217). But this is a modal fallacy: the cinematic view is only ruled out when one adopts the Laplacean view, and so that is only relatively apriori."
    step1: "第二个论证是：电影式观点与“过去决定现在”的拉普拉斯式观点不相容。Priest 的表述不那么可信：他说拉普拉斯主义是可能的，而电影式观点把它“*先验地*”（第 217 页）排除。但这是一个模态谬误：只有在采纳拉普拉斯式观点时，电影式观点才被排除，所以那只是相对地先验。"
