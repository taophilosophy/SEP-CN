      Broadly Aristotelian conceptions of childhood can have two further problematic features. They may deflect attention away from thinking about children with disabilities in favour of theorizing solely about normally developing children (see Carlson 2010)[^carlson-2010], and they may distract philosophers from attending to the goods of childhood when they think about the responsibilities adults have towards the children in their care, encouraging focus only on care required to ensure that children develop adult capacities.
    step1: |
      广义的亚里士多德式童年观可能有两个进一步的成问题特征。它们可能使注意力偏离对残疾儿童的思考，转而只关注对正常发展儿童的理论化（见 Carlson 2010）[^carlson-2010]；并且它们可能使哲学家在思考成年人对所照料的儿童所负的责任时，不去关注童年的善，而只鼓励关注确保儿童发展出成人能力所需的照料。
    step2: |
      广义的亚里士多德式童年观还可能有两个成问题的特征。其一，它们可能使注意力偏离对残疾儿童的思考，转而只对正常发展的儿童作理论化探讨（见 Carlson 2010）[^carlson-2010]；其二，它们可能使哲学家在思考成年人对他们所照料的儿童负有何种责任时，忽略对童年之善的关注，只一味鼓励关注确保儿童发展出成人能力所需的照料。
