      Even more recently, some philosophers (Hannan 2018b, Hannan and Leland 2018)[^hannan-2018b][^hannan-2018] have questioned whether there are features of childhood that make childhood bad for children. Candidate bad-making features include children’s impaired practical identity, their being asymmetrically physically and emotionally vulnerable to their parents and needing extensive control by them, and their lack of a fixed practical identity. Any evaluation of features that are particularly valuable in childhood, and either uniquely or more easily accessed in childhood, should be balanced against consideration of features that make it a worse stage of life than adulthood. Bad-making features of childhood may be traced either to aspects of childhood that cannot be changed or to contingent social arrangements that may leave children vulnerable to abuse or neglect at the hands of their intimate caregivers, without much opportunity for recourse.
    step1: |
      更近一些，一些哲学家（Hannan 2018b, Hannan and Leland 2018）[^hannan-2018b][^hannan-2018]质疑，是否有使童年对儿童不好的童年特征。候选的致坏特征包括：儿童受损的实践身份，他们对父母在身体和情感上的不对称脆弱性以及需要父母广泛控制，以及他们缺乏固定的实践身份。对童年中特别有价值、并且要么独特要么更容易在童年中获得的特征的任何评价，都应当与使童年成为比成年更糟的生命阶段的特征的考量相平衡。童年的致坏特征可以追溯到不可改变的童年方面，或追溯到可能使儿童在亲密照料者手中易受虐待或忽视、而没有多少补救机会的偶然社会安排。
