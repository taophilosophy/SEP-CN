      While family law and medical ethics are domains in which children capable of expressing preferences are increasingly encouraged to do so, there remains considerable controversy within philosophy as to the kind of authority that should be given to children’s preferences. There is widespread agreement that most children’s capacity to eventually become autonomous is morally important and that adults who interact with them have significant responsibility to ensure that this capacity is nurtured (Feinberg 1980)[^feinberg-1980]. At the same time it is typical for philosophers to be skeptical about the capacity for children under the age of ten to have any capacity for autonomy, either because they are judged not to care stably about anything (Oshana 2005, Schapiro 1999)[^oshana-2005][^schapiro-1999], lack information, experience and cognitive maturity (Levinson 1999, Ross 1998)[^levinson-1999][^ross-1998], or are too poor at critical reflection (Levinson 1999)[^levinson-1999].
