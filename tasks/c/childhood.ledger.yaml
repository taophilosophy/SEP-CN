      Recent philosophical work on the goods of childhood (Brennan 2014, Gheaus 2014, Macleod 2010)[^brennan-2014][^gheaus-2014][^macleod-2010] stresses that childhood should not be evaluated solely insofar as it prepares the child to be a fully functioning adult. Instead, a good childhood is of intrinsic and not merely instrumental value. Different childhoods that equally prepare children to be capable adults may be better or worse, depending on how children fare qua children. Goods potentially specific to childhood (or, more likely, of greatest importance during childhood) include opportunities for joyful and unstructured play and social interactions, lack of significant responsibility, considerable free time, and innocence, particularly sexual innocence. Play, for instance, can be of considerable value not only as a means for children to acquire skills and capacities they will need as adults, but also for itself, during childhood.
    step1: |
      关于童年之善的近期哲学工作（Brennan 2014, Gheaus 2014, Macleod 2010）[^brennan-2014][^gheaus-2014][^macleod-2010]强调，童年不应仅仅就其使儿童为成为完全发挥功能的成人做准备来评价。相反，一个好的童年具有内在的、而不仅仅是工具性的价值。同样使儿童成为有能力的成人的不同童年，可能更好或更坏，取决于儿童作为儿童时的境况。可能特定于童年的善（或更可能，在童年期间最重要的善）包括：欢乐的、无结构的玩耍和社会互动的机会，缺乏重大责任，相当多的自由时间，以及纯真，特别是性纯真。例如，玩耍不仅作为儿童获得他们成年后所需的技能和能力的手段，而且在童年期间本身，都具有相当大的价值。
