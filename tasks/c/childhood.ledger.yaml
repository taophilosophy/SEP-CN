      It is uncontroversial to judge that what Mary Anne Warren terms paradigmatic humans have moral status (Warren 1992)[^warren-1992]. Paradigmatic humans are adults with relatively standard cognitive capacities for self-control, self-criticism, self-direction, and rational thought, and are capable of moral thought and action. However, the grounds for this status are controversial, and different grounds for moral status have direct implications for the moral status of children. Jan Narveson (1988), for instance, argues that children do not have moral status in their own right because only free rational beings, capable of entering into reciprocal relations with one another, have fundamental rights. While Narveson uses the language of rights in his discussion of moral status (people have direct moral duties only to rights holders on his account), moral status need not be discussed in the language of rights. Many other philosophers recognize children as having moral status because of their potential to become paradigmatic humans without committing to children having rights. For instance, Allen Wood writes: “it would show contempt for rational nature to be indifferent to its potentiality in children.” (Wood 1998, 198)[^wood-1998]
    step1: |
      判断玛丽·安妮·沃伦（Mary Anne Warren）所称的典范人类具有道德地位，是没有争议的（Warren 1992）[^warren-1992]。典范人类是具有相对标准的自我控制、自我批评、自我指导和理性思维认知能力，并且能够进行道德思想和行动的成人。然而，这一地位的根据是有争议的，而道德地位的不同根据对儿童的道德地位有直接影响。例如，扬·纳维森（Jan Narveson, 1988）论证，儿童本身不具有道德地位，因为只有能够相互进入对等关系的自由理性存在物才拥有基本权利。虽然纳维森在其道德地位讨论中使用权利语言（按他的说法，人们只对权利持有者负有直接的道德义务），但道德地位不必以权利语言来讨论。许多其他哲学家承认儿童具有道德地位，因为他们是可能成为典范人类的，而不承诺儿童拥有权利。例如，艾伦·伍德（Allen Wood）写道：“对理性本性在其儿童中的潜能无动于衷，将是对理性本性的蔑视。”（Wood 1998, 198）[^wood-1998]
    step2: |
      判断玛丽·安妮·沃伦（Mary Anne Warren）所称的“典范人类”具有道德地位，是无可争议的（Warren 1992）[^warren-1992]。典范人类是那些具有相对标准的自我控制、自我批评、自我指导与理性思维等认知能力，并能进行道德思考与道德行动的成人。然而，这一地位的根据是有争议的，而道德地位的不同根据，对儿童的道德地位有着直接的影响。例如，扬·纳维森（Jan Narveson, 1988）论证，儿童本身并不具有道德地位，因为只有能够彼此进入对等关系的自由理性存在物，才拥有基本权利。尽管纳维森在讨论道德地位时使用了权利的语言（按照他的说法，人们只对权利持有者负有直接的道德义务），但道德地位不必用权利的语言来讨论。许多其他哲学家之所以承认儿童具有道德地位，是因为儿童有潜力成为典范人类，而不必承诺儿童拥有权利。例如，艾伦·伍德（Allen Wood）写道：“对理性本性在儿童身上的潜能漠不关心，便是对理性本性的轻蔑。”（Wood 1998, 198）[^wood-1998]
