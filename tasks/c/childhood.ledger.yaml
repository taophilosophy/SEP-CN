      When children are judged to have moral status because of their potential to develop the capacities of paradigmatic adults (we might call these paradigmatic children), this leaves questions about the moral status of those children who are not expected to live to adulthood, and those children whose significant intellectual disabilities compromise their ability to acquire the capacities of paradigmatic adults. There are then three common approaches that grant moral status to non-paradigmatic children (and other non-paradigmatic humans). The first approach deems moral consideration to track species membership. On this approach all human children have moral status simply because they are human (Kittay 2005)[^kittay-2005]. This approach has been criticized as being inappropriately speciesist, especially by animal rights activists. The second approach gives moral status to children because of their capacity to fare well or badly, either on straightforwardly utilitarian grounds or because they have subjective experiences (Dombrowski 1997)[^dombrowski-1997]. It has been criticized by some for failing to distinguish between capacities all or almost all human children have that are not also possessed by other creatures who feel pleasure and pain. The third approach gives moral status to non-paradigmatic children because of the interests others with moral status take in them (Sapontzis 1987)[^sapontzis-1987], or the relationships they have with them (Kittay 2005)[^kittay-2005]. Jaworska and Tannenbaum (2018) offer a more recent version of such an account by arguing that children who are human and raised in a person-rearing manner have moral status.
    step1: |
      当儿童因其发展典范成人能力的潜能而被判定具有道德地位（我们可以称之为典范儿童），这便留下了关于那些预计不能活到成年的儿童、以及那些严重智力残疾损害其获得典范成人能力之能力的儿童的道德地位问题。于是，有三种常见进路授予非典范儿童（和其他非典范人类）道德地位。第一种进路认为道德考量跟随物种成员身份。按此进路，所有人类儿童仅因其是人类就具有道德地位（Kittay 2005）[^kittay-2005]。这一进路被批评为不恰当地物种主义，特别是被动物权利活动家批评。第二种进路因儿童能够过得好或坏的能力而给予儿童道德地位，要么出于直接的功利主义理由，要么因为他们有主观经验（Dombrowski 1997）[^dombrowski-1997]。它被一些人批评为未能区分所有或几乎所有人类儿童都具有、而其他感受快乐和痛苦的生物不具有的能力。第三种进路因其他有道德地位者对非典范儿童的兴趣（Sapontzis 1987）[^sapontzis-1987]，或他们与儿童的关系（Kittay 2005）[^kittay-2005]，而给予非典范儿童道德地位。约尔斯卡和坦南鲍姆（Jaworska and Tannenbaum, 2018）提供了这种说明的一个较新版本，论证人类且以抚育成人的方式养大的儿童具有道德地位。
    step2: |
      当儿童因其发展出典范成人能力的潜能而被判定具有道德地位（我们不妨称之为典范儿童），这便留下了这样的问题：那些预计无法活到成年的儿童，以及那些严重智力残疾损害其获得典范成人能力之能力的儿童，其道德地位如何。于是，有三种常见进路授予非典范儿童（及其他非典范人类）道德地位。第一种进路主张，道德考量应随物种成员身份而定。依此进路，所有人类儿童仅因他们是人类便具有道德地位（Kittay 2005）[^kittay-2005]。这一进路被批评为不恰当地物种主义，尤其是受到动物权利活动家的批评。第二种进路因儿童具有过得好或过得坏的能力而赋予儿童道德地位，要么基于直接的功利主义理由，要么因为他们拥有主观经验（Dombrowski 1997）[^dombrowski-1997]。它受到一些人的批评，因为它未能区分所有或几乎所有人类儿童都具有、而其他能感受快乐与痛苦的生物却不具有的那些能力。第三种进路则因其他有道德地位者对非典范儿童的兴趣（Sapontzis 1987）[^sapontzis-1987]，或因他们与这些儿童的关系（Kittay 2005）[^kittay-2005]，而赋予非典范儿童道德地位。约尔斯卡与坦南鲍姆（Jaworska and Tannenbaum, 2018）提供了这类说明的一个较新版本，主张：那些身为人类、并以抚育成人的方式养大的儿童具有道德地位。
