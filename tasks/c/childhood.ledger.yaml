      Sometimes the approaches may be combined. For instance, Warren writes that young children and other non-paradigmatic humans have moral status for two sorts of reasons: “their rights are based not only on the value which they themselves place upon their lives and well-being, but also on the value which other human beings place on them.” (1992. 197) In addition to these three most common approaches, Mullin (2011) develops a fourth: some non-paradigmatic children (and adults) have moral status not simply because others value them but because they are themselves capable of being active participants in morally valuable relationships with others. These relationships express care for others beyond their serving as means for one’s own satisfaction. Approaches to moral status that emphasize children’s capacity to care for others in morally valuable relationships also raise interesting questions about children’s moral responsibilities within those relationships (see Mullin 2010)[^mullin-2010].
    step1: |
      有时这些进路可以结合。例如，沃伦写道，年幼儿童和其他非典范人类因两种理由而具有道德地位：“他们的权利不仅基于他们自己对自身生命和福祉所赋予的价值，也基于其他人类对他们所赋予的价值。”（1992. 197）除了这三种最常见的进路，马林（Mullin, 2011）发展了第四种：一些非典范儿童（和成人）具有道德地位，不仅仅因为其他人珍视他们，而是因为他们自身能够成为与他人进行道德上有价值的关系的积极参与者。这些关系表达了对他人超越其作为自身满足手段的关怀。强调儿童在道德上有价值关系中关怀他人之能力的道德地位进路，也引发了关于儿童在这些关系中的道德责任的有趣问题（见 Mullin 2010）[^mullin-2010]。
