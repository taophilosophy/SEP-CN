      ### 2.2 Complicating the Mechanistic Picture: Tissue Organization, Stem Cells and Systems Theory
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Critics of the somatic mutation theory and the search for mechanisms of cancer at the cell and molecular level have raised a variety of objections, some methodological, some conceptual, and some empirical. Indeed, some critics combine all three. In the late 1990s, and early 2000s, Soto and Sonnenschein proposed an alternative to the “somatic mutation theory” (SMT), the Tissue Organization Field Theory (or, TOFT) (Sonnenschein & Soto 2000)[^sonnenschein-2000]. They object not only to reductionist methodology of advocates of SMT, but also to the empirical claim that mutations are in fact causes of cancer. They argue instead that cancer is a product of “alterations in the communication among cells and tissues that affect tissue architecture” (2013, p. 90). On this view, mutations do not “lead the way” in cancer, but instead follow upon disruptions to tissue organization. It is these alterations of patterns of interaction between cells that leads to “downward causation effects” on cells and cellular components, inducing aneuploidy and mutations (Soto & Sonnenschein 2006; Sonnenschein & Soto 2008)[^sonnenschein-2008][^soto-2008]. Let us address their arguments, turning first to methodological concerns about warranted inference from cell culture or model organism work to general claims about cancer etiology.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Given that the development of cancer is an immensely complex causal process that cannot be observed directly, many scientific claims about cancer’s causes are based on indirect inference, using model organisms or cells in culture. For instance, tumors are grown in nude mice using xenotransplantation, or tumors are observed to grow in mice in which “driver genes” are “knocked out.” Soto and Sonnenschein have argued that these artificial experimental circumstances render judgments about the causal efficacy of mutations in cancer suspect. They are raising methodological questions about the scope and limitations of model organism work. Soto and Sonnenschein further argue that there are other equally adequate explanations of cancer’s emergence, and these explanations can accommodate phenomena that the SMT cannot. For instance, they claim that cancer cells’ normalization when placed in healthy tissue cannot be explained by the SMT. Tissue organization, on their view, exerts “downward causation” on cancer cells, preventing or promoting their development into a tumor. Their claims about “downward causation” have led philosophers to weigh in on the debate (Malaterre 2011; Bertolaso 2016; Green 2021)[^bertolaso-2016][^green-2021][^green-2021-2][^malaterre-2011]. Malaterre (2011) argues that advocates of TOFT need not commit to downward causation (interpreted as an appeal to non-reductive physicalism, or emergent properties). Instead, he argues, dynamic relationships between variables that supervene over molecular and cellular activities can do the same work, via a “higher level,” or less granular explanation of cancer etiology.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Do such cases genuinely count as downward causation in, for instance, Kim’s (2000) sense? After all, strictly speaking, the idea that causation is synchronic across the whole and part of the same entity seems contradictory. Soto and Sonnenschein propose that the kind of causation they are invoking is not synchronic, but “diachronic emergence”: “cellular and tissue events occurring before the expression of a particular set of genes takes place may act downwardly modifying the expression of these genes at a later time” (Soto, et al. 2008, 271). This, however, seems to be not as radical a metaphysical thesis as talk of downward causation may initially suggest. This seems instead a form of constraint. Green (2021) takes “downward causation” in such contexts to refer to : “the role of solid-state tissue properties in tumor progression … understood as constraining relations between tissue-scale and micro-scale variables” (p. 1). While this suggestion is “a ‘weaker’ form of downwards causation than the one Kim (2000) and others oppose,” and so departs from standard use of the expression, the advantage of this weaker notion that it better captures what scientists have in mind when arguing for the “necessity of higher-scale features for the realization and understanding of biological phenomena.” Similarly, Bertolaso (2016) argues that cancer is an instance of synchronic reflexive emergence—“a different mode of causation. In such a mode, effects are not expressed in terms of a progression of events, but of maintenance of states at different levels of biological organization” (Bertolaso 2016, p. 95)[^bertolaso-2016].
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      It seems that each of these authors is pointing to an important role for structural organization of tissues in the maintenance of homeostasis or conversely in carcinogenesis. It seems such examples do not point to “downward causation,” in Kim’s sense, but instead suggest that we simply cannot predict or explain cancer solely in terms of properties of “micro-” level parts but need to expand our understanding of the causes of cancer to include maintenance of tissue integrity. That is, the case of cancer seems to require a richer, more integrative and interdisciplinary approach to investigating causation at multiple levels.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      It seems that each of these authors is pointing to an important role for structural organization in the maintenance of homeostasis as playing an important role in carcinogenesis. Indeed, evidence provided by Bissell’s lab (Weaver, et al. 1997, 2002) seems to indicate that structural features of the extracellular matrix somehow either prevent the emergence of disease, or can accelerate it (on Bissell’s lab, see Plutynski 2018b)[^plutynski-2018b]. It seems such examples do not point to “downward causation,” but instead suggest that we need to expand our understanding of the causes of cancer to include maintenance of tissue integrity. That is, the case of cancer seems to require a richer, more integrative and interdisciplinary approach to investigating cancer.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Soto, Sonnenschein, and others have argued that the SMT and TOFT are mutually incompatible and cancer research needs a paradigm shift (Bizzarri and Cuccina, 2016). Others argue that they can be fruitfully integrated (Bertolaso, 2011; Marcum 2005; Malaterre, 2007; Bedessem and Ruphy, 2015; Baxendale, 2019)[^marcum-2005]. Today, SMT and TOFT represent two extremes along a continuum of views about the central causal role of genetic mutations in cancer. Most researchers grant that mutations are one among many other causal factors in cancer.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      For instance, the tumor microenvironment (TME) is now considered another key factor (see Maman and Witz, 2018 for a historical review). However, there are some open questions about what falls within the TME’s spatial and temporal boundaries, and what causal relevance spatial organization and temporal order have for cancer (Rondeau et al. 2019; Laplane et al., 2018, 2019b)[^rondeau-2019]. Some interesting ambiguous cases are provided by nutrition (Sholl 2022)[^sholl-2022][^sholl-2022-2] and by the microbiota (Sholl et al. 2022)[^sholl-2022][^sholl-2022-2]. Increasingly, there are indications that changes in the microbiome (both of cancer, and of the organism as a whole) may play an important role in cancer initiation and progression, suggesting that data about the microbiome may be relevant to diagnosis, prognosis, and choice of therapies (Sholl et al. 2022)[^sholl-2022][^sholl-2022-2]. Moreover, given that microbes can be transmitted vertically (during cell division) as well as horizontally (between neighboring cells), and are themselves subject to evolution, Sepich-Poore et al. (2022) suggest reconsidering clonal evolution in cancer as a multispecies process. Experimental study of the role of microbes in cancer is difficult, however, raising several questions about pragmatic and epistemic trade-offs. The complexity and heterogeneity on both sides of the microbiome-cancer relationship makes generating robust causal hypotheses difficult (Parke and Plutynski, 2023).
    step1: TBD
    step2: TBD
