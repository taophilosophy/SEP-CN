      ## 4. The Science-Value Interface and Aims of Cancer Research
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      There are several ways in which biomedical and public health research on cancer intersects with debates about the proper role of values in science. First, epidemiological and toxicological research is used in support of regulatory policy and toxic tort law. Decisions about when and what is “carcinogenic” have significant public health import, and thus raise a variety of philosophical questions about evidence, values, risk, precaution, and communication of scientific results (Mayo & Hollander 1994; Cranor, 1993, 2006, 2011, 2017; Valles, 2018; Elliott & Resnick, 2014; John, 2018)[^mayo-1994].
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Evidence for claims about carcinogenicity is often indirect, and underdetermination is rife. In establishing claims about carcinogenicity, there are a variety of choices regarding methodology, source and type of evidence, and standards of significance (Elliott, 2011; Broadbent, 2013; Valles, 2018, 2021). Even optimally done epidemiological studies, or toxicological studies at best lend high probability to claims about health risk, in part because such studies often “black box” the intermediate causes. In such contexts, there is “inductive risk”, or the risk of error either in over- or under-estimation of actual risk of cancer, and thus, room for values to play a role. Several philosophers of science have weighed in on this matter of when and whether values ought to play a role in such contexts, whether precautionary judgments are appropriate, as well as whether “opening” the black box is always ideal (see, e.g., Mayo 1988; Douglas 2000, 2009; Brown 2013; Steel 2007, 2010, 2015; Elliott 2011; Shrader-Frechette 1993, 1994, 2002, 2004; Mitchell 2009; Russo & Williamson, 2007; Broadbent, 2011; DiMarco, 2021)[^brown-2013][^douglas-2000][^elliott-2011][^mitchell-2009][^shrader-frechette-1993][^steel-2007]. As one might imagine, there is also a substantive history of debate among epidemiologists, public health scientists, scholars of the law, around when we have good reason to claim that X or Y is carcinogenic, or what counts as good evidence, going back to the dispute between Doll and Hill and their detractors regarding the causal link between smoking and lung cancer (Hill, 1965). For a compelling history of this literature, see, e.g., Proctor (1996), or more recently, Oreskes and Conway (2011), or Shostack (2013). Problems of underdetermination are no less rife in the context of assessments of “effectiveness” of cancer screening and prevention (see, e.g., Solomon 2015; Stegenga 2018; Plutynski 2017)[^plutynski-2017][^solomon-2015][^stegenga-2018] (For a discussion, see the entry on philosophy of medicine.)
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Second, much of basic cancer research—e.g., research on the cell and molecular bases of the disease—is supported by federal funds, which are allocated in the hopes that such research will (eventually) yield better health outcomes. Yet, the relationship between “bench and bedside” is indirect, and shaped by economic, social, and political factors, some more pernicious than others (Prasad, 2020; Tabery, 2023). So, it’s unclear whether and how “basic” cancer science ought to be evaluated in light of whether or how it leads to better health outcomes. However, this is hard to avoid, particularly when so many lives depend upon a research program’s promised outcomes.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      This whole matter is complicated by the fact that the study of cancer is itself big business. Cancer pharmaceuticals, medical devices, and cancer research are major drivers of the economy. The average annual price for a new cancer medicine is rising rapidly and now approaches $150,000 (Booth, et. al., 2022); and some estimate cost of cancer care is globally to be in the region of $458 billion by 2030 (Callahan & Darzi, 2015). These high costs brings into focus several ethical concerns regarding the economics of cancer prevention and care. Critics have raised questions about the quality of research and regulatory standards, economic incentives misaligned with promoting overall quality of life, misleading representation of public health and clinical information, and rising costs and downstream impact on underserved populations, and equity in access to care (World Health Organization, 2022). Several have expressed concerns regarding whether the vast funds invested in cancer research—at least during the past 25 years or so—have shifted mortality rates sufficiently to warrant the expense. According to one line of thinking, the centrality of cancer in biomedical research is a product of several historical, economic, institutional, and social forces in combination, some of which are self-perpetuating, primarily driving by commercial interests (Proctor 1996; Fujimura 1996; Clarke & Fujimura 2014; World Health Organization, 2022)[^clarke-2014][^fujimura-1996][^proctor-1996]. Ever since Nixon’s 1971 call for a “war” on cancer, advertised implications for cancer treatment or prevention have been used to bolster much of basic research into genetics, genomics, and cell and molecular biology, fostering investment in biotechnology. Some have argued that this has led to an unduly excessive, or disproportionate fear of cancer as a disease, an excess of anxiety, and perhaps also unnecessary or unwarranted use of medical screening and testing (Aronowitz 2007, 2009, 2015; Welch & Black, 2010)[^aronowitz-2007].
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      On the other hand, cancer research has led to important innovations in science and medicine with impacts much wider than cancer itself. In the U.S., excessive regulations on research by, e.g., the FDA on the design and conduct of clinical trials for approval of drugs, some argue, may in part be slowing research. Some argue that we ought to lift restrictions on such tests for novel and more “precise” (or targeted) drugs that might benefit very few. Such matters are of course intertwined with larger debates around when and whether we have sufficient evidence to claim that, e.g., this or that mode of intervention is effective (Ashcroft 2002; Cartwright 2011; Howick 2011; Stegenga 2015; Teira 2011; Teira, et al. 2015; González-Moreno, et al. 2015; Deaton & Cartwright 2018)[^ashcroft-2002][^cartwright-2011][^deaton-2018][^howick-2011][^stegenga-2015].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      One area where such questions are particularly fraught is “precision” medicine. In service of this end, several tools and technologies have been developed. One is simply sequencing of individual cancers, with the idea that a more fine-grained analysis of the molecular and genomic features of each cancer promotes more effective prediction and control of cancer risk, enables detection of cancers at much earlier stages, and promotes less debilitating, more targeted treatments. But it comes with the risk of overdiagnosis and overtreatment (Vogt, et. al., 2019). With sensitive technologies and more fine-tuned risk information, the practice of medicine has been shifting from diagnosis (and treatment) of disease, to constant surveillance and intervention on disease risk, as well as higher rates of overdiagnosis and overtreatment (diagnosis and treatment for a proto-disease state that may never have progressed in the lifetime of a patient) (Welch, et al. 2011; Esserman, et al. 2014). Other tools of precision medicine include models such as organoids and patient-derived xenografts (PDXs). Organoids are 3D cultures developed from tumor samples of individual patients, in service of developing patient-specific drug screening (Huang et al. 2015; Ooft et al. 2019; Sachs et al. 2018). PDXs are immunodeficient mice engrafted with human tumors that are used as surrogate models. Use of these technologies has both immense potential benefit and carries some risks. On the one hand, attention to the particular genetic variation unique to a given patient variation will presumably allow for more targeted, effective prognoses and therapies (Boniolo, 2017). On the other hand, use of these tools involves both setting aside the assumption that sample size is an important component in clinical trials, and assuming or hoping that the organoid or mouse model is representational of the target (Lillie et al. 2011; Green et al. 2019, 2021, 2022). Some question whether the methods of testing new drugs in oncology suffer from systematic problems, leading to less successful outcomes than hoped or advertised. In particular, some have argued that surrogate endpoints used in many clinical trials fail to predict which drugs improve overall survival, accelerated approval is granted for drugs that do not meet the criterion of serving an “unmet” need, approval is granted for drugs that are tested against poor comparators, in unrepresentative populations, or approved for minimal improvements in surrogate outcomes, enthusiasts hype drugs before demonstrated to be effective, and that there is a revolving door between the FDA and the very same pharmaceutical companies that seek approval for new drugs. Moreover, it seems pharmaceutical prices are not determined by clinical benefit, nor are they justified by research and development costs (Prasad, 2020; Prasad & Gale 2016; Prasad, et al. 2016; Beneduce & Bertolasao, 2022)[^prasad-2016][^prasad-2016-2]. Such skepticism should raise genuine concerns—especially given the hopes of patients and families hanging upon the promises of such treatments, and the overall costs of both cancer care, and precision medicine research. However, there are several solutions that have been proposed (Prasad, 2020), such as eliminating consulting payments from the pharmaceutical industry to researchers, conducting trials to study outcomes that matter to patients (such as overall mortality, as opposed to surrogate outcomes), comparing tested drugs to the current standard of care (as opposed to poor comparators), testing drugs in populations that are average type of people with cancer (not exceptionally healthy), or by and large promoting more affordable drugs (globally).
