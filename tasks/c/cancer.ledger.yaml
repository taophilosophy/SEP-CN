      关于干细胞在预防和促进癌症两方面的因果作用，还有若干未决问题。Cairns（1975）最初提出一个假说：组织的层级式组织——组织干细胞产生所有其他细胞——也许能预防癌症，办法是只让少数相对受保护的细胞充当体细胞分裂中的祖细胞，从而降低突变累积的风险（Cairns 1975）[^cairns-1975]。更近些时候，一个类似的想法导致了这样的主张：癌症风险多半是运气问题，与每种组织中干细胞分裂的次数成正比（Tomasetti and Vogelstein 2015; Tomasetti et al. 2017）[^tomasetti-2015][^tomasetti-2017]。这引发了一场激烈的辩论：各组织干细胞分裂次数的差异，对于解释这些组织终生癌症风险的差异有什么相关性。然而，最初的论文及其批评者在概念清晰性和论证一致性上的欠缺，阻碍了这场辩论（Plutynski 2021b）[^plutynski-2021b]。
