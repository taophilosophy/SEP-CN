      In sum, much like genes and species, diseases like cancer lack essences, are heterogeneous, blur together at the edges, are caused in many different ways, and have variable dynamics. Perhaps inconsistent classifications are simply to be expected in such cases. That this is so does not (necessarily) show that we ought to give up on realism about disease kinds; indeed, perhaps we ought to endorse “promiscuous realism” (Dupré 1995). As knowledge has grown, and practical interests shift, classifications can multiply and even cross-classify the same kinds. This is nothing to fear, so long as the kinds we countenance do the predictive or explanatory work intended for them, in the context intended. Others have a somewhat less permissive view, however, though there remains a good deal of dispute over how and which empirical constraints should govern classification of “scientific kinds,” whether or not these categories count as examples of “natural” kinds (Slater 2014; Ereshefsky & Reydon 2015)[^ereshefsky-2015][^slater-2014]. (See the entry on scientific pluralism.)
    step1: |-
      总之，很像基因和物种，癌症这样的疾病缺少本质，彼此异质，在边缘处模糊交融，由许多不同方式引起，并且有可变的动态。也许在这类病例中，不一致的分类本来就该预料到。情况如此并不（必然）表明我们应当放弃关于疾病种类的实在论；事实上，也许我们应当赞同“混杂实在论”（Dupré 1995）。随着知识增长、实践兴趣转移，分类会增殖，甚至对同样的种类交叉分类。只要我们所承认的种类在预期的语境中完成了预期的预测或解释工作，这就没有什么可怕的。不过，另一些人持不那么宽松的看法，尽管关于如何、以及哪些经验约束应当支配“科学种类”的分类，仍有大量争论——无论这些范畴是否算作“自然”种类的例子（Slater 2014; Ereshefsky & Reydon 2015）[^ereshefsky-2015][^slater-2014]。（见“科学多元主义”词条。）
    step2: |-
      总之，很像基因和物种，癌症这类疾病没有本质，彼此异质，边缘处模糊交融，成因多种多样，动态也多变。在这种病例里，分类不一致也许是理所当然的。情况如此并不（一定）说明我们就该放弃关于疾病种类的实在论；事实上，也许我们该赞成“混杂实在论”（Dupré 1995）。知识增长了，实践兴趣转移了，分类就可能增多，甚至把同样的种类交叉分类。只要我们承认的这些种类，在预期的语境里干完了预期的预测活或解释活，就没什么好怕的。不过，另一些人的看法没那么宽松；关于“科学种类”的分类应当受哪些经验约束、怎样受约束，仍有不少争论，不管这些范畴算不算“自然”种类的例子（Slater 2014; Ereshefsky & Reydon 2015）[^ereshefsky-2015][^slater-2014]。（见“科学多元主义”词条。）
