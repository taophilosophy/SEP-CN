      ### 2.2 Complicating the Mechanistic Picture: Tissue Organization, Stem Cells and Systems Theory
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Critics of the somatic mutation theory and the search for mechanisms of cancer at the cell and molecular level have raised a variety of objections, some methodological, some conceptual, and some empirical. Indeed, some critics combine all three. In the late 1990s, and early 2000s, Soto and Sonnenschein proposed an alternative to the “somatic mutation theory” (SMT), the Tissue Organization Field Theory (or, TOFT) (Sonnenschein & Soto 2000)[^sonnenschein-2000]. They object not only to reductionist methodology of advocates of SMT, but also to the empirical claim that mutations are in fact causes of cancer. They argue instead that cancer is a product of “alterations in the communication among cells and tissues that affect tissue architecture” (2013, p. 90). On this view, mutations do not “lead the way” in cancer, but instead follow upon disruptions to tissue organization. It is these alterations of patterns of interaction between cells that leads to “downward causation effects” on cells and cellular components, inducing aneuploidy and mutations (Soto & Sonnenschein 2006; Sonnenschein & Soto 2008)[^sonnenschein-2008][^soto-2008]. Let us address their arguments, turning first to methodological concerns about warranted inference from cell culture or model organism work to general claims about cancer etiology.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Given that the development of cancer is an immensely complex causal process that cannot be observed directly, many scientific claims about cancer’s causes are based on indirect inference, using model organisms or cells in culture. For instance, tumors are grown in nude mice using xenotransplantation, or tumors are observed to grow in mice in which “driver genes” are “knocked out.” Soto and Sonnenschein have argued that these artificial experimental circumstances render judgments about the causal efficacy of mutations in cancer suspect. They are raising methodological questions about the scope and limitations of model organism work. Soto and Sonnenschein further argue that there are other equally adequate explanations of cancer’s emergence, and these explanations can accommodate phenomena that the SMT cannot. For instance, they claim that cancer cells’ normalization when placed in healthy tissue cannot be explained by the SMT. Tissue organization, on their view, exerts “downward causation” on cancer cells, preventing or promoting their development into a tumor. Their claims about “downward causation” have led philosophers to weigh in on the debate (Malaterre 2011; Bertolaso 2016; Green 2021)[^bertolaso-2016][^green-2021][^green-2021-2][^malaterre-2011]. Malaterre (2011) argues that advocates of TOFT need not commit to downward causation (interpreted as an appeal to non-reductive physicalism, or emergent properties). Instead, he argues, dynamic relationships between variables that supervene over molecular and cellular activities can do the same work, via a “higher level,” or less granular explanation of cancer etiology.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Do such cases genuinely count as downward causation in, for instance, Kim’s (2000) sense? After all, strictly speaking, the idea that causation is synchronic across the whole and part of the same entity seems contradictory. Soto and Sonnenschein propose that the kind of causation they are invoking is not synchronic, but “diachronic emergence”: “cellular and tissue events occurring before the expression of a particular set of genes takes place may act downwardly modifying the expression of these genes at a later time” (Soto, et al. 2008, 271). This, however, seems to be not as radical a metaphysical thesis as talk of downward causation may initially suggest. This seems instead a form of constraint. Green (2021) takes “downward causation” in such contexts to refer to : “the role of solid-state tissue properties in tumor progression … understood as constraining relations between tissue-scale and micro-scale variables” (p. 1). While this suggestion is “a ‘weaker’ form of downwards causation than the one Kim (2000) and others oppose,” and so departs from standard use of the expression, the advantage of this weaker notion that it better captures what scientists have in mind when arguing for the “necessity of higher-scale features for the realization and understanding of biological phenomena.” Similarly, Bertolaso (2016) argues that cancer is an instance of synchronic reflexive emergence—“a different mode of causation. In such a mode, effects are not expressed in terms of a progression of events, but of maintenance of states at different levels of biological organization” (Bertolaso 2016, p. 95)[^bertolaso-2016].
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      It seems that each of these authors is pointing to an important role for structural organization of tissues in the maintenance of homeostasis or conversely in carcinogenesis. It seems such examples do not point to “downward causation,” in Kim’s sense, but instead suggest that we simply cannot predict or explain cancer solely in terms of properties of “micro-” level parts but need to expand our understanding of the causes of cancer to include maintenance of tissue integrity. That is, the case of cancer seems to require a richer, more integrative and interdisciplinary approach to investigating causation at multiple levels.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      It seems that each of these authors is pointing to an important role for structural organization in the maintenance of homeostasis as playing an important role in carcinogenesis. Indeed, evidence provided by Bissell’s lab (Weaver, et al. 1997, 2002) seems to indicate that structural features of the extracellular matrix somehow either prevent the emergence of disease, or can accelerate it (on Bissell’s lab, see Plutynski 2018b)[^plutynski-2018b]. It seems such examples do not point to “downward causation,” but instead suggest that we need to expand our understanding of the causes of cancer to include maintenance of tissue integrity. That is, the case of cancer seems to require a richer, more integrative and interdisciplinary approach to investigating cancer.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Soto, Sonnenschein, and others have argued that the SMT and TOFT are mutually incompatible and cancer research needs a paradigm shift (Bizzarri and Cuccina, 2016). Others argue that they can be fruitfully integrated (Bertolaso, 2011; Marcum 2005; Malaterre, 2007; Bedessem and Ruphy, 2015; Baxendale, 2019)[^marcum-2005]. Today, SMT and TOFT represent two extremes along a continuum of views about the central causal role of genetic mutations in cancer. Most researchers grant that mutations are one among many other causal factors in cancer.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      For instance, the tumor microenvironment (TME) is now considered another key factor (see Maman and Witz, 2018 for a historical review). However, there are some open questions about what falls within the TME’s spatial and temporal boundaries, and what causal relevance spatial organization and temporal order have for cancer (Rondeau et al. 2019; Laplane et al., 2018, 2019b)[^rondeau-2019]. Some interesting ambiguous cases are provided by nutrition (Sholl 2022)[^sholl-2022][^sholl-2022-2] and by the microbiota (Sholl et al. 2022)[^sholl-2022][^sholl-2022-2]. Increasingly, there are indications that changes in the microbiome (both of cancer, and of the organism as a whole) may play an important role in cancer initiation and progression, suggesting that data about the microbiome may be relevant to diagnosis, prognosis, and choice of therapies (Sholl et al. 2022)[^sholl-2022][^sholl-2022-2]. Moreover, given that microbes can be transmitted vertically (during cell division) as well as horizontally (between neighboring cells), and are themselves subject to evolution, Sepich-Poore et al. (2022) suggest reconsidering clonal evolution in cancer as a multispecies process. Experimental study of the role of microbes in cancer is difficult, however, raising several questions about pragmatic and epistemic trade-offs. The complexity and heterogeneity on both sides of the microbiome-cancer relationship makes generating robust causal hypotheses difficult (Parke and Plutynski, 2023).
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Another major research program that in some ways challenges a mechanistic picture of cancer is the “cancer stem cell” theory (CSC). Fagan (2016) characterizes the notion of a cancer stem cell, as well as the current state of the field, as follows:
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      > Cancer stem cells (CSCs) are thought to be a small subpopulation of self-renewing stem cells within a tumor or blood-borne cancer, which are responsible for maintaining and growing the malignancy. This idea has significant clinical implications. If the CSC model is correct, the current clinical strategy of seeking to eradicate *all* cancer cells should be revised, to specifically target CSC.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      The cancer stem cell theory in part is descended from the view that cancers are in several ways akin to ordinary tissue (though distorted), containing a mixture of proliferating stem cells and their more differentiated progeny. This view played an important role in cancer research in the 1960s and 1970s and is sometimes called the “developmental” theory of cancer, in light of the fact that it takes cancer to be a disease of “development,” or cellular differentiation in particular (Pierce & Speers 1988, Morange 2015, Laplane 2014)[^laplane-2014][^morange-2015][^pierce-1988]. This model of cancer etiology was revived in the 90s, when Lapidot, Bonnet, and Dick identified “leukemic stem cells” (Lapidot, et al. 1994, Bonnet and Dick 1997)[^bonnet-1997], and was expanded upon in the early 2000s with the identification of an analogous cell population in breast cancer, suggesting that CSCs are a general feature of all cancers (Al-Hajj, et al. 2003). The notion that there are subpopulations of cells within a tumor that play a distinctive role—either in initiating a cancer, or in seeding new cancers, has been influential in current research, suggesting new avenues for both treatment and prevention.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Historically the cancer stem cell theory (CSC) was framed in opposition to the somatic mutation theory and the clonal evolution model, according to which cancer cells diversify and evolve through the acquisition of mutations (e.g. Reya, et al. 2001; Wicha, et al. 2006; Shipitsin, et al. 2007). But soon it appeared that rather than see the two theories as mutually exclusive, we might see the two as complementary, in the process of integration, or overlapping models. Fagan (2016) argues that on a “model-based” approach, it’s not clear that these two theories are inconsistent. Laplane (2018) has pointed out how the CSC can serve to supplement the evolutionary perspective. The presence and number of cancer stem cells can affect the rate and nature of evolutionary change in a population of cancer cells. Essentially, if all cells in a tumor are descended from one or a few cancer stem cells, this restricts population size, and thus suggests that to a large extent cancer progression is driven by drift, rather than selection. Lyne et al. (2021) develop this argument with a mathematical model, and question the ubiquitous assumption that linear evolution, in which each new clone arises from the latest one and tend to almost outcompete it, is the output of natural selection. Such inference can only be warranted if the number of contributing stem cells is high enough to prevent clonal evolution by drift.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      There are several open questions about the causal role of stem cells in both preventing and promoting cancer. Cairns (1975) originally proposed the hypothesis that the hierarchical organization of tissues, with the tissue stem cells producing all the other cells, may prevent cancer, by allowing only a few relatively protected cells to serve as progenitors in somatic cell division, thus reducing the risk of accumulated mutations (Cairns 1975)[^cairns-1975]. More recently, a similar idea led to the claim that the risk of cancer is mostly a matter of bad luck, proportional to the number of stem cell divisions in each tissue (Tomasetti and Vogelstein 2015; Tomasetti et al. 2017)[^tomasetti-2015][^tomasetti-2017]. This has led to a vivid debate on the explanatory relevance of the variation in the number of stem cell divisions by tissues in the variation of the lifetime risk of cancer in these tissues. However, the lack of conceptual clarity and argumentative consistency of the initial papers and its critics has hindered the debate (Plutynski 2021b)[^plutynski-2021b].
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Discussion of the role and nature of cancer stem cells, however, is complicated by the fact that there is a great deal of dispute around what counts as a cancer stem cell (for questions about what counts as a stem cell, outside of cancer, see Fagan’s work, especially Fagan 2013 and Fagan 2021)[^fagan-2013][^fagan-2021]. Laplane (2016), Fagan (2016), and Germain (2014) draw attention to the fact that the concept of cancer stem cell is multiply ambiguous, in at least the following ways:
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      - First, when we speak of cancer stem cells, we may be referring to their capacities, or to their historical role or genealogy, i.e., to the fact that they were the cells from which other cancer cells originate. That is, some take cancer stem cells to be defined in terms of their distinctive capacities and some in terms of their relationship to other cells—in particular, to their ancestor-descendent relationships in a population of cells in a tumor. The “cancer stem cell model” is sometimes simply taken to refer to any model of a tumor that treats the population of cells as having a hierarchical relationship, where one or a few cells propagate the tumor, whether or not those cells have distinctive properties that cause them to stand in that relationship.
      - Second, there are several different kinds of historical role that CSCs might play: They may be all and only those cells that initiate a cancer under natural conditions, they may be those cells which propagate a cancer in situ, or they may be those cells that are capable of propagating a cancer in an experimental animal. Xenotransplantation experiments used to assess CSCs are “highly artificial” contexts, that may or may not warrant the conclusions researchers claim to establish. Xenotransplantation, for instance, has been used to articulate and test hypotheses about “intrinsic tumorigenicity” of CSCs. The problem with using these tools, however, is that the matter of when and whether a cell is “tumorigenic” varies across different backgrounds. For example, CSCs may develop tumors in some mouse models and not others, depending on their immune deficiency. Which experimental context is relevant to understanding how and why cancer is caused by CSCs thus depends upon which causes we wish to isolate, and how.
      - Third, some take the concept of CSC to be restricted to normal stem cells, which some believe are the most likely precursors to cancer. Others hold that cells that originate a tumor have stem-like properties but may or may not derive from normal stem cells.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      What’s clear is that some populations of cells in a tumor appear to have “stemness” properties—the ability to renew oneself. What is less clear is whether these capacities are context sensitive, and how and by which cells they may be acquired. The plasticity of many types of cancer cells suggests that they may acquire a stemness phenotype, and even shift back to non-stem phenotype. Given this, it appears that the CSC is just one of a continuum of general views, some of which take only specific types of cells to be precursors to cancer and others which grant that many different types of cells have the potential to develop such properties. That is, the real question at issue is whether the cells that initiate a tumor are in some way distinctive or require distinctive precursors, and how properties of stemness are acquired. Whether stemness is intrinsic or acquirable, niche-dependent or independent, moreover, will drastically change the therapeutic strategy. The CSC model (the idea that CSC are at the origin of cancer development, resistance to treatment, and relapse) might be true and yet CSC-targeting strategy might fail. Indeed, what kind of property “stemness” is may vary across cancers, and even over time within a cancer (Laplane and Solary 2019a; Laplane 2016)[^laplane-2016][^laplane-2019a].
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      In sum, there appear to remain several open questions about the nature of cancer stem cells, and more generally, how to best intervene upon cancer to successfully eradicate the disease. According to the model of the disease inherited from the latter third of the 20th Century, somatic mutations, acquired over a lifetime, to the acquisition of cancer’s “hallmarks.” So, the best strategy for intervention may be targeting specific pathways associated with these hallmarks. In contrast, according to the TOFT, changes in tissue organization yield carcinogenesis. Thus, the best strategy for intervention might be finding ways to intervene in the tissue microenvironment, so as to create an environment less hospitable to the growth of cancer cells. According to the cancer stem cell theory, cancer arises in cells that have distinctive properties: continuous renewal, and indefinite growth, permitting the emergence of new disease. On this view, eradicating these stem cells seems essential to cancer treatment. Philosophical work on cancer causation and explanation can better illuminate the competing presuppositions of different approaches, clarify their commitments, and offer insights into fruitful integration of new data. It is already clear that philosophical discussions of ambiguities in how we define and measure stemness is essential to understanding how best to prevent recurrence and treat the disease (Clevers 2016)[^clevers-2016].
    step1: TBD
    step2: TBD
