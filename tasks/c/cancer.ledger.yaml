      Khalidi (2013) argues that cancer might be a homeostatic property cluster kind, on the grounds that cancer is driven by “homeostatic” mechanisms—namely, mutations to “caretaker” genes, or genes that play a “gatekeeping” role in preventing or permitting the emergence of a tumor. Acquisition of mutations to specific “caretaker” genes, on this view, serve a function akin to Boyd’s (1999) “homeostatic mechanisms,” in that they permit the further acquisition of “hallmark” properties of cancer cells. Khalidi is drawing upon a very common view of cancer, articulated by two famous cancer researchers, Hanahan and Weinberg (2000, 2011). They identify what they take to be the “hallmarks” of cancer: “a small number of molecular, biochemical, and cellular traits—acquired capabilities—shared by most and perhaps all types of human cancer.” They identified these “six essential alterations in cell physiology that collectively dictate malignant growth” as: self-sufficiency in growth signals, insensitivity to antigrowth signals, evasion of apoptosis (cell death), sustained angiogenesis (the ability to develop a blood supply), tissue invasion and metastasis (Hanahan & Weinberg 2000, 57)[^hanahan-2000]. By way of example of a caretaker, *TP53* is called a tumor suppressor, because it carries the function of responding to signals associated with cell damage by typically inducing apoptosis, or cell death. It is one of the only genes mutated in a majority of cancers sequenced (Bailey, et al. 2018). Thus, Weinberg (2013) characterizes it as “master guardian and executioner,” in that it prevents further mutations by inducing cell death where there are signs of trouble. On Khalidi’s view, one ought to understand disruption of these very capacities as “homeostatic mechanisms” for cancer.
    step1: |-
      Khalidi（2013）论证说，癌症也许是一个稳态属性簇种类，理由是癌症由“稳态”机制驱动——即对“看护”基因的突变，或者对在阻止或允许肿瘤出现中起“守门”作用的基因的突变。照这种看法，特定“看护”基因突变的获得，其作用类似于 Boyd（1999）的“稳态机制”，因为它们允许进一步获得癌症细胞的“标志性”属性。Khalidi 借用了两位著名癌症研究者 Hanahan 和 Weinberg（2000、2011）所阐明的一种非常常见的癌症观。他们确定了他们所认为的癌症“标志性特征”：“少数分子、生化和细胞性状——获得性能力——为大多数、也许是所有类型的人类癌症所共有。”他们把“共同决定恶性生长的六种细胞生理学根本改变”确定为：生长信号上的自给自足、对反生长信号不敏感、逃避凋亡（细胞死亡）、持续的血管生成（发展出血供的能力）、组织侵袭与转移（Hanahan & Weinberg 2000, 57）[^hanahan-2000]。作为一个看护基因的例子，*TP53* 被称为抑癌基因，因为它承担着这样的功能：对与细胞损伤相关的信号作出反应，通常诱导凋亡即细胞死亡。它是被测序的多数癌症中发生突变的少数基因之一（Bailey, et al. 2018）。因此，Weinberg（2013）把它刻画为“总守护者与行刑者”，因为一旦出现麻烦的迹象，它就通过诱导细胞死亡来防止进一步的突变。在 Khalidi 看来，应当把这些能力本身受到的破坏理解为癌症的“稳态机制”。
