      A major complication surrounding classification in the case of cancer is that cancers have variable disease course (Foulds 1958; Cairns 1975; Lynch 2007; Bertolaso & Dupré 2018; Plutynski, 2018)[^bertolaso-2018][^cairns-1975][^foulds-1958]. Not all cancers progress uniformly to metastasis and death; some growths progress slowly or not at all. Some very common cancers (in the prostate and thyroid) are either slow growing, or tend to remain “indolent” (Esserman, et al. 2014; Siegel, et al. 2017). There is some disagreement in the medical community about how to characterize such cases; it’s unclear whether they are best viewed as very slow growing precancerous lesions, or perhaps ought not be characterized as cancer, at all (Schwartz, 2014). Such cases also raise a host of practical questions about the merits of screening, and the risk of overdiagnosis—the diagnosis of disease that might never have progressed in the lifetime of the patient (see, e.g., Walker & Rogers 2016; Hofman 2017; Esserman, et al. 2014; Welch & Black 2010)[^welch-2010]. They also raise interesting philosophical questions about the nature of disease.
    step1: |-
      癌症分类周围的一个主要复杂因素，是癌症的病程多变（Foulds 1958; Cairns 1975; Lynch 2007; Bertolaso & Dupré 2018; Plutynski, 2018）[^bertolaso-2018][^cairns-1975][^foulds-1958]。并非所有癌症都一律进展到转移和死亡；有些肿块进展缓慢，或者根本不进展。一些非常常见的癌症（前列腺癌和甲状腺癌）要么生长缓慢，要么倾向于保持“惰性”（Esserman, et al. 2014; Siegel, et al. 2017）。医学界对于如何刻画这类病例存在一些分歧；不清楚它们最好被看作生长极慢的癌前病变，还是也许根本不应被刻画为癌症（Schwartz, 2014）。这类病例还提出一大堆实际问题，涉及筛查的价值，以及过度诊断的风险——即诊断出一种在患者有生之年可能根本不会进展的疾病（例如见 Walker & Rogers 2016; Hofman 2017; Esserman, et al. 2014; Welch & Black 2010）[^welch-2010]。它们也提出了关于疾病本质的有趣哲学问题。
