      Khalidi（2013）认为，癌症也许是一个稳态属性簇种类，理由是癌症由“稳态”机制驱动，也就是靠“看护”基因的突变，或者靠在阻止、允许肿瘤出现中起“守门”作用的基因发生突变。照这种看法，特定“看护”基因突变的获得，作用类似 Boyd（1999）所说的“稳态机制”：它们放行了癌症细胞“标志性”属性的进一步获得。Khalidi 借用的是一种很常见的癌症观，出自两位著名癌症研究者 Hanahan 和 Weinberg（2000、2011）。他们列出了自己认定的癌症“标志性特征”：“少数分子、生化和细胞性状——获得性能力——为大多数、也许所有类型的人类癌症所共有。”他们把“共同决定恶性生长的六项细胞生理学根本改变”列为：生长信号上自给自足、对反生长信号不敏感、逃避凋亡（细胞死亡）、持续的血管生成（长出供血系统的能力）、组织侵袭与转移（Hanahan & Weinberg 2000, 57）[^hanahan-2000]。看护基因的一个例子是 *TP53*：它被称为抑癌基因，因为它负责对细胞损伤相关信号作出反应，通常诱导凋亡、也就是细胞死亡。在被测序的多数癌症中，它是少数几个发生突变的基因之一（Bailey 等，2018）。Weinberg（2013）因此称它为“总守护者与行刑者”：一出现麻烦迹象，它就诱导细胞死亡，挡住进一步的突变。在 Khalidi 看来，这些能力受到的破坏，本身就该理解为癌症的“稳态机制”。
