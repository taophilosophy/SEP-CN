      What does it mean to explain cancer? The question is ambiguous, and fraught. For, by “cancer” one could have several targets of explanation in mind: the general process of transformation of a cell into a “cancer cell,” a very general characterization of the process of carcinogenesis as a whole, the process of invasion and metastasis in solid tumors in particular, the emergence and roles of intratumor heterogeneity, differential rates of incidence of different cancer types, patterns of cancer incidence or mortality in different environments, socioeconomic groups, races, ages, or sexes. Each of these explanatory targets arguably calls for quite different *kinds* of explanation, and not merely different explanatory information. The fact that these explanations are different in kind may (in part) explain why there appears to be such a variety of views amongst philosophers concerning the aim and character of explanation in cancer research, drawing upon a long history of debate among philosophers of biology concerning norms of explanation (See the entries on 20th century theories of scientific explanation and philosophy of systems and synthetic biology). Perhaps not surprisingly, also, there is also a history of dispute amongst cancer scientists about competing research agendas and norms of explanation.
    step1: |-
      解释癌症意味着什么？这个问题有歧义，也令人忧虑。因为说到“癌症”，人们心里可能有几个不同的解释目标：一个细胞转化为“癌细胞”的一般过程；癌变整个过程的一种非常一般的刻画；尤其是实体瘤中的侵袭与转移过程；肿瘤内异质性的出现与作用；不同癌症类型发病率的差异；不同环境、社会经济群体、种族、年龄或性别中癌症发病率或死亡率的模式。这些解释目标中的每一个，按理说都要求相当不同的*解释种类*，而不只是不同的解释信息。这些解释在种类上不同这一事实，也许（部分地）解释了为什么在癌症研究中解释的目标和特征问题上，哲学家之间似乎有如此多样的看法——这借用了生物学哲学家之间关于解释规范的长期争论史（见“20 世纪的科学解释理论”与“系统与合成生物哲学”词条）。同样也许并不令人意外的是，癌症科学家之间也有关于相互竞争的研究议程和解释规范的争论史。
