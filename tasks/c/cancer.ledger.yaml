      ### 2.1 The Mechanistic Picture of Cancer
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      For most of the last twenty or so years of the 20ᵗʰ Century and the first decades of the 21ˢᵗ, the central concern of the majority of cancer researchers has been identification of mechanisms at the cell and molecular level that regulate cell birth and death. Two characteristic features of cancer cells are their uncontrolled growth, and failure to undergo cell death. This is often associated with changes to the “cellular machinery,” or mutations and associated disruption of causal pathways that affect regulation of cell division or cell death (Hanahan & Weinberg 2000)[^hanahan-2000]. The “somatic mutation theory” (sometimes, SMT) or “multistage” theory of cancer, is roughly the view that changes in cells that lead to these disruptions in regulation are due to a series of mutations, chromosomal alterations, and epigenetic changes to cells acquired during somatic cell division over the course of a lifetime. Onset of cancer, on this view, may be accelerated either by inheritance of “oncogenes” or “tumor suppressors,” or by damage to DNA, for instance, due to smoking or UV radiation.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      This picture of cancer was pieced together over decades from various sources of evidence—from Virchow’s observations of chromosomal abnormalities in cancer cells, to epidemiological patterns of incidence in cancer, to the discovery of the “src” gene—one of the first mutations found to be associated with cancer. This vision of cancer as the product of oncogenes replaced a “regulatory” view of cancer, according to which cancer was a “breakdown in normal constraints on growth” (for a history, see, e.g., Morange 1993, 1997, 2003)[^morange-1993]. The “oncogene paradigm” arose at the same time that some of the first bioengineering technologies, which enabled early cancer researchers to use the techniques of molecular biology to study genes associated with cancer progression (Fujimura 1987)[^fujimura-1987]. While the SMT is often associated with a reductionist research program (see the entry on reductionism in biology), in the sense that many cancer scientists within this program seek to decompose the system of interest and understand the parts in operation in relative isolation, not all early advocates of the multistage theory were cell and molecular biologists. Two of the first advocates of the theory—Armitage and Doll—were epidemiologists. They found that curves of average lifetime incidence of lung cancer in smokers appeared to have the same shape as that of nonsmokers, simply shifted to earlier ages. This suggested that cancer could arise from a rate-limited series of events acquired over the life course. Since it was known that mutations could be acquired during somatic cell division (where “somatic” mutuations are acquired over the course of a lifetime, and “heritable” mutations refer to mutations in germ cells), and chromosomes of cancer cells were disrupted, the obvious implication seemed to be that cancer cells were in part a product of somatic mutations. Since the 1980s, hundreds of genes have been identified, mutations to which are associated with the hallmarks of cancer. Carcinogenesis, on this view, results from damage to DNA, or errors in the process of cell division, as well as either endogenous factors (various hormonal or other factors that promote cell growth), or exogenous factors (infection, and inflammation), which over time can lead to dysregulated cell growth.
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      In one paradigmatic example, Vogelstein and his group collected tissue samples (premalignant polyps) from patients with a familial or inherited form of bowel cancer (FAP, or familial adenomatous polyposis). They discovered that mutations to genes associated with various cancers accumulated in series of steps, what has been called the “Vogelstein cascade.” The study of familial or strongly inherited forms of cancer (cancers that appear at relatively young ages, and occur in families) has enabled the identification of several genes, mutations to which (whether inherited or acquired during somatic cell division) play a role in cancer: APC, RB, and p53 (associated with familial adenomatous polyposis, retinoblastoma, and Li Fraumeni syndrome, respectively).
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      This picture of explaining cancer might be expected to resonate quite well with the picture of scientific explanation advocated by what has been called the “new mechanists.” According to this view, one of the central aims of biological scientists is the identification of mechanisms. The biological sciences do seem to be unique in their focus on mechanisms, rather than laws or general principles, of the sort (typically imagined) to be central to the physical sciences (See the entry on mechanisms in science). A mechanistic explanation identifies parts and processes that typically yield specific outcomes of interest (Machamer, et al. 2000). If we wish to understand regulation of apoptosis (cell death), for instance, we might identify particular genes and proteins that play an important role in cell senescence, and determine how their activity and organization yield (or fail to yield) a given outcome. This mechanistic picture of the aims and character of explanation in the biological sciences seems prima facie to characterize current cancer research quite well, or at least the past 25 years of this research.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      However, several philosophers have argued that this picture fails to capture the diverse explanatory strategies carried out by cancer scientists (Green, et. al., 2018; see also next section). Indeed, even advocates of the mechanistic perspective have argued that it needs to be amended to accommodate the complex causal processes involved in cancer’s etiology. For instance, according to Bechtel (2018), a linear picture of mechanisms for cancer requires “expanding” so as to accommodate the complex organization of mechanisms. He characterizes the mechanisms associated with apoptosis, for instance, as made up of two types: “primary” and “control” mechanisms. Failure to respond to signals promoting apoptosis in cancer may be a result of disruption in either one (or both) such mechanisms. Attention to the complex negative feedback processes of control and constraint affecting primary mechanisms is essential to explaining the emergence of cancer. As evidence of the significance of such control mechanisms, he points out how cancer researchers identify regulatory networks or feedback loops, associated with specific functions. Bechtel’s distinction between “primary” and “control” mechanism raises some interesting conceptual and methodological questions about the role of “organization” in functional explanation, and how organization may be key to biological “autonomy.” Cancer may be a case study drawing attention to the relationships between structural organization and functional behavior in biological systems, tracking insights going back to Aristotle, and continuing in the work of Kant, Bernard and Piaget (see, e.g., Mossio & Bich, 2017; Mossio, et. al., 2009; Montévil & Mossio 2015)[^montévil-2015].
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      The kinds of pathways Bechtel identifies in cancer might either be represented as “purposive” in some sense (in that “controller” versus “primary” mechanism are re-oriented in cancer in service of promoting unlimited growth of cells), or as breakdowns in purposive organization (in that these same mechanisms typically promote survival of the organism as a whole). Relatedly, the same mechanisms might well serve as “controller” in one context, and “primary” in another. That is, this distinction itself may be relatively fluid, or context dependent. In recent work by Bich and Bechtel (2022), and others (see, e.g., Bich, et. al., 2016), this manner in which organization and ‘self-organization’ of biological systems is a product or co-regulation of multiple mechanisms, with larger implications for a variety of diferent biological systems, is developed further.
