      这幅癌症图景，是几十年来用各种证据拼起来的：从魏尔啸观察到癌细胞里的染色体异常，到癌症发病率的流行病学模式，再到“src”基因的发现——最早发现的与癌症相关的突变之一。这种把癌症看成癌基因产物的视野，取代了早先的“调控”观：按那种看法，癌症是“对生长的正常约束垮掉了”（这段历史例如见 Morange 1993, 1997, 2003）[^morange-1993]。“癌基因范式”冒出来的时候，正好赶上最早一批生物工程技术问世；这些技术让早期癌症研究者能用分子生物学的方法，研究跟癌症进展相关的基因（Fujimura 1987）[^fujimura-1987]。SMT 常与一个还原论研究纲领联系在一起（见“生物学中的还原论”词条）：这一纲领里的许多癌症科学家力求把所研究的系统拆开，在相对孤立的状态下弄懂各部分的运作。不过，早期倡导多阶段理论的人，并不都是细胞与分子生物学家。最早的两位倡导者——Armitage 与 Doll——是流行病学家。他们发现，吸烟者肺癌的平均终生发病率曲线，形状似乎与非吸烟者一样，只是整体挪到了更早的年龄。这提示，癌症可能来自一生中陆续获得的、受速率限制的一系列事件。既然人们已经知道突变可以在体细胞分裂期间获得（“体细胞”突变是一生中获得的，“可遗传”突变则指生殖细胞里的突变），而且癌细胞的染色体遭到破坏，那么显而易见的推论似乎是：癌细胞部分地是体细胞突变的产物。1980 年代以来，已经找出几百个基因，它们的突变与癌症的标志性特征有关。照这种看法，癌变源于 DNA 受损、或细胞分裂过程出错，也源于内源因素（各种促进细胞生长的激素等）或外源因素（感染和炎症）；这些东西日久天长，能让细胞生长失调。
