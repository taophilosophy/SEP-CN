      Moreover, the effects of mutations are context-dependent, making their causal relevance to any given cancer difficult to discern. Some mutations may provide low or no advantage to the mutated cells, until conditions change, such as the application of chemotherapies, which can lead to proliferation of cells with specific mutations (Hsu et al. 2018)[^hsu-2018]. Even the order of acquisition of mutations can change the biology and outcome of the disease. For example, depending on which of two genes was first mutated, patients with myeloproliferative neoplasms (MPN) have different risks of different outcomes (Ortmann et al. NEJM 2015; Kent and Green 2017)[^kent-2017][^ortmann-2015].
