      这种统一理论能起什么作用，是个有争议的问题。争论的一个具体来源，围绕着一个以寻找与癌细胞行为相关的遗传机制为纽带的研究纲领的价值（Strauss, et. al., 2021）。这个研究纲领有过许多不同的名称：“癌基因范式”（Bishop 1995; Morange 1997）[^bishop-1995][^morange-1997]、“愿景”（Morange 1997）[^morange-1997]、“理论”或“范式”（Sonnenschein & Soto 2008; Soto and Sonnenschein, 2004, 2005）[^sonnenschein-2008][^soto-2008]、“模型”（Temin 1974; Vogelstein & Kinzler 1993）[^temin-1974][^vogelstein-1993]、“理论—方法组合”（Fujimura 1987, 1992）[^fujimura-1987]，以及“框架”（Blasimme, et al. 2013）。有些人主张，聚焦遗传机制是一个“失败”的范式，或者是一个“退化”的（相对于“进步”的）研究纲领。要解决这类争论，似乎首先得有一些衡量进步的尺度——鉴于科学研究纲领的目标多种多样、而且随时间转变，这绝非简单之事。有些人把研究的中心目标看作生成真的理论，另一些人则着眼于生成新的实验传统、生成富有成果的探究路线、生成对特定模式或过程的局部（相对于一般）解释，或者生成有用的数据分类方式。要更审慎地框定“癌基因”范式失败还是成功的问题，也许可以着眼于：对这一“解释框架”的承诺在哪些方面有用、在哪些方面不那么有用。
