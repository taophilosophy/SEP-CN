      At first blush, this seems a vivid case of a homeostatic property cluster kind; on Khalidi’s view, it is these distinctive “caretaker” mutations that permit or promote cancer. However, where we take a mechanism “for cancer” to begin and end is in large part a pragmatic matter (Craver 2009)[^craver-2009]; arguably, one might carve up the “homeostatic mechanisms for” cancer to yield many or few cancer subtypes (Plutynski, 2018). Hanahan and Weinberg’s initial picture has been complicated since 2001. In 2011, Hanahan and Weinberg updated their hallmarks to include four more: “genome instability, which generates the genetic diversity that expedites their acquisition, and inflammation, which fosters multiple hallmark functions… reprogramming of energy metabolism, and evading immune destruction.” And, “In addition to cancer cells, tumors exhibit another dimension of complexity: they contain a repertoire of recruited, ostensibly normal cells that contribute to the acquisition of hallmark traits by creating the tumor microenvironment” (2011, 646). In other words, hallmarks of cancer appear to no longer involve all and only intrinsic properties of cancer cells, but also dynamic interactions between cancer cells and the immune system and extra-tumor environment. This may not be such a serious challenge to Khalidi’s view that caretaker mutation are mechanisms for cancer. One could, arguably, just expand the mechanisms for homeostasis to the tumor microenvironment. However, such a strategy is complicated by the context-sensitivity of causes of cancer, discussed above. Many cells on the surface of the skin as we age possess as many mutations to “caretaker” genes as those in a breast tumor, but most such skin cells are shed and never eventuate in disease (Martincorena, et al. 2015). The “same” mechanisms may well lead to harm in one context, and be entirely harmless in another.
    step1: |-
      初看之下，这似乎是一个生动的稳态属性簇种类案例；在 Khalidi 看来，正是这些独特的“看护”突变允许或促进了癌症。然而，我们把“针对癌症”的机制从哪里算起、到哪里为止，在很大程度上是一个实用问题（Craver 2009）[^craver-2009]；可以说，人们可以把“针对”癌症的“稳态机制”切分为许多或少数的癌症亚型（Plutynski, 2018）。Hanahan 和 Weinberg 最初的图景自 2001 年以来已经复杂化了。2011 年，Hanahan 和 Weinberg 更新了他们的标志性特征，又加了四项：“基因组不稳定性，它产生加快这些特征获得的遗传多样性；炎症，它促进多种标志性功能……能量代谢的重编程，以及逃避免疫破坏。”而且，“除了癌症细胞，肿瘤还表现出另一维度的复杂性：它们含有一批被招募来的、表面正常的细胞，这些细胞通过营造肿瘤微环境来促进标志性性状的获得”（2011, 646）。换句话说，癌症的标志性特征似乎不再只涉及癌症细胞的所有且仅有的内在属性，而也涉及癌症细胞与免疫系统及肿瘤外环境之间的动态互动。这对 Khalidi 的看法——看护突变是癌症的机制——也许算不上严重挑战。可以说，只要把稳态机制扩展到肿瘤微环境就行了。然而，这种策略因上文讨论过的癌症病因的语境敏感性而复杂化。随着我们变老，皮肤表面的许多细胞拥有的“看护”基因突变，和乳腺肿瘤里的细胞一样多，但大多数这类皮肤细胞会脱落，从不酿成疾病（Martincorena, et al. 2015）。同样的机制，在一种语境中可能导致伤害，在另一种语境中可能完全无害。
    step2: |-
      初看之下，这似乎是一个很生动的稳态属性簇种类案例：在 Khalidi 看来，正是这些独特的“看护”突变放行或促成了癌症。可是，“针对癌症”的机制从哪儿算起、到哪儿为止，很大程度上是个实用问题（Craver 2009）[^craver-2009]；可以说，人们尽可以把“针对”癌症的“稳态机制”切成许多个癌症亚型，也可以切成很少几个（Plutynski, 2018）。Hanahan 和 Weinberg 最初的图景，自 2001 年以来已经变复杂了。2011 年，两人更新了标志性特征，又添了四项：“基因组不稳定性，它产生加快这些特征获得的遗传多样性；炎症，它促成多种标志性功能……能量代谢的重编程，以及逃避免疫破坏。”他们还写道：“除了癌症细胞，肿瘤还多出一层复杂性：里面有一批被招募来的、表面正常的细胞，它们营造出肿瘤微环境，帮着获得标志性性状”（2011, 646）。换句话说，癌症的标志性特征似乎不再只是癌症细胞全部、且仅有的内在属性，还涉及癌症细胞与免疫系统、与肿瘤外环境之间的动态互动。这对 Khalidi 那个看法——看护突变就是癌症的机制——也许算不上严重挑战：只要把稳态机制扩展到肿瘤微环境就是了。可这种策略会碰上上文说过的癌症病因的语境敏感性。人上了年纪，皮肤表面许多细胞带的“看护”基因突变，和乳腺肿瘤里的细胞一样多，但大多数这类皮肤细胞会脱落，从不发展成疾病（Martincorena 等，2015）。同样一套机制，在这个语境里可能造成伤害，在另一个语境里完全无害。
