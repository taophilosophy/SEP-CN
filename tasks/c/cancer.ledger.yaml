      Critics of the somatic mutation theory and the search for mechanisms of cancer at the cell and molecular level have raised a variety of objections, some methodological, some conceptual, and some empirical. Indeed, some critics combine all three. In the late 1990s, and early 2000s, Soto and Sonnenschein proposed an alternative to the “somatic mutation theory” (SMT), the Tissue Organization Field Theory (or, TOFT) (Sonnenschein & Soto 2000)[^sonnenschein-2000]. They object not only to reductionist methodology of advocates of SMT, but also to the empirical claim that mutations are in fact causes of cancer. They argue instead that cancer is a product of “alterations in the communication among cells and tissues that affect tissue architecture” (2013, p. 90). On this view, mutations do not “lead the way” in cancer, but instead follow upon disruptions to tissue organization. It is these alterations of patterns of interaction between cells that leads to “downward causation effects” on cells and cellular components, inducing aneuploidy and mutations (Soto & Sonnenschein 2006; Sonnenschein & Soto 2008)[^sonnenschein-2008][^soto-2008]. Let us address their arguments, turning first to methodological concerns about warranted inference from cell culture or model organism work to general claims about cancer etiology.
    step1: |-
      体细胞突变论的批评者以及细胞和分子层次上寻找癌症机制的批评者，提出了各种各样的反对意见，有些是方法论的，有些是概念的，有些是经验的。事实上，一些批评者把三者结合起来。二十世纪九十年代末和二十一世纪初，Soto 与 Sonnenschein 提出了“体细胞突变论”（SMT）的一种替代方案，即组织场论（TOFT）（Sonnenschein & Soto 2000）[^sonnenschein-2000]。他们反对的不只是 SMT 倡导者的还原论方法论，还有突变事实上是癌症原因这一经验主张。他们反而论证说，癌症是“影响组织结构的细胞与组织间交流改变”的产物（2013, p. 90）。照这种看法，突变在癌症中并不“带路”，而是跟在组织结构破坏之后。正是细胞间互动模式的这些改变，对细胞和细胞组分产生“下向因果效应”，诱发非整倍体和突变（Soto & Sonnenschein 2006; Sonnenschein & Soto 2008）[^sonnenschein-2008][^soto-2008]。让我们来处理他们的论证，首先转向关于从细胞培养或模式生物工作推论到关于癌症病因学的一般主张是否正当的方法论关切。
    step2: |-
      体细胞突变论的批评者、以及反对在细胞和分子层次上找癌症机制的人，提出了各种反对意见：有的针对方法，有的针对概念，有的针对经验证据，有些批评者还把三者合用。二十世纪九十年代末、二十一世纪初，Soto 与 Sonnenschein 给“体细胞突变论”（SMT）提出了一个替代方案：组织场论（TOFT）（Sonnenschein & Soto 2000）[^sonnenschein-2000]。他们反对的不只是 SMT 倡导者的还原论方法，还有“突变事实上就是癌症原因”这个经验主张。他们认为，癌症是“影响组织结构的细胞与组织间交流改变”的产物（2013, p. 90）。照这种看法，突变在癌症里不带路，而是跟在组织结构被破坏之后。正是细胞之间互动模式的这些改变，对细胞和细胞组分产生“下向因果效应”，诱发非整倍体和突变（Soto & Sonnenschein 2006; Sonnenschein & Soto 2008）[^sonnenschein-2008][^soto-2008]。下面来谈他们的论证，先看方法上的担心：从细胞培养或模式生物的工作，推论到关于癌症病因学的一般主张，是否站得住。
