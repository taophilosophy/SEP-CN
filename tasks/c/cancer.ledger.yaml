      Several philosophers have weighed in on these matters (see, e.g., Ereshefsky & Reydon 2015; Lange 2007; Broadbent 2009 and 2014; Williams 2011; Khalidi 2013; Sorenson 2011, Bechtel, 2019)[^broadbent-2009][^broadbent-2014][^ereshefsky-2015][^khalidi-2013][^lange-2007][^sorenson-2011][^williams-2011]. The questions these authors are addressing are both epistemic—what warrants choice of criteria of classification of disease—and metaphysical—given diseases like cancer lack essential properties (or, properties belonging all and only to each type), is it correct to think of diseases as “natural kinds”? Such debates turn on more fundamental questions, such as whether there are any general criteria for “naturalness” of scientific categories, and if so, whether to take underlying causal or constitutive bases, mechanisms, networks, or mere similarity or “feature matching” as sufficient (Slater, 2014; Bechtel, 2019; Boniolo, et. al., 2021; Boniolo et al., 2023).
    step1: |-
      若干哲学家就这些问题发表了意见（例如见 Ereshefsky & Reydon 2015; Lange 2007; Broadbent 2009 and 2014; Williams 2011; Khalidi 2013; Sorenson 2011, Bechtel, 2019）[^broadbent-2009][^broadbent-2014][^ereshefsky-2015][^khalidi-2013][^lange-2007][^sorenson-2011][^williams-2011]。这些作者所讨论的问题既是认识论的——什么为疾病分类标准的选择提供保证——也是形而上学的——既然癌症这样的疾病缺少本质属性（或者说，缺少为每一类型所共有且仅为该类型所有的属性），把它们看作“自然种类”是否正确？这类争论取决于更基本的问题，例如：科学范畴的“自然性”是否有任何一般标准；如果有，是否应把背后的因果基础或构成基础、机制、网络，或者仅仅是相似性或“特征匹配”视为充分（Slater, 2014; Bechtel, 2019; Boniolo, et. al., 2021; Boniolo et al., 2023）。
    step2: |-
      不少哲学家就这些问题表过态（例如见 Ereshefsky & Reydon 2015; Lange 2007; Broadbent 2009 and 2014; Williams 2011; Khalidi 2013; Sorenson 2011, Bechtel, 2019）[^broadbent-2009][^broadbent-2014][^ereshefsky-2015][^khalidi-2013][^lange-2007][^sorenson-2011][^williams-2011]。他们追问的问题，一半是认识论的——凭什么选择疾病分类的标准；一半是形而上学的——癌症这类疾病既然缺少本质属性（或者说，缺少为每一类型所共有、且仅为该类型所有的属性），把它们看作“自然种类”对不对？这类争论又取决于更基本的问题：科学范畴的“自然性”有没有一般标准？如果有，是把背后的因果基础、构成基础、机制、网络，还是仅仅把相似性或“特征匹配”算作充分（Slater, 2014; Bechtel, 2019; Boniolo 等，2021; Boniolo 等，2023）？
