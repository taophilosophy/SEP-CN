      The larger issues raised by this case is whether there is one way to privilege choice of causal basis for classifying disease. Different choice of temporal or spatial scale, or more or less fine-grained characterization of causal processes, might yield multiple, overlapping disease classifications. While some may be willing to bite this bullet, and indeed, endorse pluralism and non-hierarchical classifications (see, e.g., Khalidi 1998, 2013)[^khalidi-1998], others might be concerned that this would yield too permissive an array of disease types, or inconsistent classifications, thus complicating scientific communication. More generally, this case raises some interesting puzzles about the aims and methods of classification in the biomedical sciences more generally. Given that genomic features of cancer are unlikely to unproblematically yield a single natural taxonomy, we might become skeptical of reductive pictures of disease classification and explanation. It seems that classifications of disease like cancer form a kind of ‘hybrid’—they are intended to capture natural regularities and their causes, but also to be of use for a wide array of agents with different purposes. It’s unclear whether all these purposes can be served by one method or set of classificatory criteria.
    step1: |-
      这个案例提出的更大问题是：是否存在一种方式，可以为疾病分类中因果基础的选择赋予优先地位。时间或空间尺度的不同选择，或者对因果过程或粗或细的刻画，可能产生多种相互重叠的疾病分类。有些人也许愿意硬着头皮接受这一点，甚至赞同多元论和非层级分类（例如见 Khalidi 1998, 2013）[^khalidi-1998]；另一些人则可能担心，这会产出一套过于宽松的疾病类型，或者不一致的分类，从而使科学交流变得复杂。更一般地说，这个案例对生物医学科学中分类的目标和方法提出了一些有趣的难题。既然癌症的基因组特征不太可能毫无问题地产生单一的自然分类系统，我们也许会对疾病分类和解释的还原论图景产生怀疑。癌症这类疾病的分类似乎构成一种“混合体”——它们旨在把握自然规律及其原因，同时又要供具有不同目的的各种行动者使用。所有这些目的是否都能由一种方法或一套分类标准来服务，并不清楚。
