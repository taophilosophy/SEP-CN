      清楚的是，肿瘤中的某些细胞群似乎具有“干性”属性——自我更新的能力。不太清楚的是，这些能力是否对语境敏感，以及它们如何、由哪些细胞获得。许多类型癌细胞的可塑性提示，它们可能获得干性表型，甚至转回非干细胞表型。既然如此，CSC 似乎只是从一系列一般看法中的一种；其中有些看法认为只有特定类型的细胞是癌症的前体，另一些则承认许多不同类型的细胞都有发展出这类属性的潜力。也就是说，真正成问题的是：引发肿瘤的细胞是否以某种方式独特，或者是否需要独特的前体；以及干性属性是如何获得的。此外，干性是内在的还是可获得的、依赖龛的还是独立的，将大幅改变治疗策略。CSC 模型（认为 CSC 处于癌症发展、治疗抵抗和复发的源头）可能是真的，而靶向 CSC 的策略仍可能失败。的确，“干性”是何种属性，可能因癌症而异，甚至在同一癌症内随时间而变（Laplane and Solary 2019a; Laplane 2016）[^laplane-2016][^laplane-2019a]。
