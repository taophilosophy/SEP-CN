      Several “extra-genomic” factors also play an important role in cancer causation and thus, arguably, ought to play at least a partial role in informing cancer taxonomy. For instance, it turns out changes in microRNA in cancer cells—non-coding RNA, which affects the expression of genes—can affect cancer initiation, progression, and responses to drugs (Hrovatin, et al. 2018). Life history (e.g. parity, or number of children, and age at first birth), environmental exposures, and histories of infection, and immune response, contribute differentially to cancer’s age of onset, rate of progression, histopathology, and response to treatment. For instance, infectious agents (e.g., HPV- or HCV-) are associated with cervical and liver cancers, and some proportion of esophageal cancers (Cancer Genome Atlas, 2015; Morgan, 2022). Indeed, for several decades, the primary cause of cancer was thought to be viral, and inquiry into viral origins of cancer in part led to many insights into cancer causation, whether originating in viruses or not (see, e.g., Morgan, 2022). Cancers of the prostate and breast are associated with hormones, which are in turn affected by parity. “Pregnancy-associated” breast cancers are cancers that arise during or shortly after pregnancy (see, e.g., Schedin 2006)[^schedin-2006]. The “same” cancer in the same tissue or organ can be classified as either “somatic,” or “familial”—due in part to whether the patient possesses inherited mutations that raise a risk of some cancers, such as those with Li Fraumeni syndrome. Smoking associated lung cancers and non-smoking associated lung cancers are distinct genetically, epigenetically, and phenotypically (e.g., in gross pathology, course of progression, as well as response to treatment).
    step1: |-
      若干“基因组外”因素在癌症病因中也起重要作用，因此可以说，至少应当在癌症分类中起部分作用。例如，结果表明，癌症细胞中微小 RNA 的变化——影响基因表达的非编码 RNA——能够影响癌症的发生、进展和药物反应（Hrovatin, et al. 2018）。生活史（例如产次即子女数、初产年龄）、环境暴露、感染史和免疫反应史，对癌症的发病年龄、进展速率、组织病理学和治疗反应有不同的贡献。例如，传染因子（如 HPV 或 HCV）与宫颈癌、肝癌以及一部分食管癌相关（Cancer Genome Atlas, 2015; Morgan, 2022）。事实上，几十年来，癌症的主要病因曾被认为来自病毒，而对癌症病毒起源的探究，部分地带来了关于癌症病因的许多洞见，无论其起源是否在病毒（例如见 Morgan, 2022）。前列腺癌和乳腺癌与激素相关，而激素又受产次影响。“妊娠相关”乳腺癌是在妊娠期间或产后不久发生的癌症（例如见 Schedin 2006）[^schedin-2006]。同一组织或器官中的“同一种”癌症，可以被分类为“体细胞型”或“家族型”——部分取决于患者是否带有提高某些癌症风险的遗传突变，例如李-弗劳梅尼综合征患者。吸烟相关肺癌与非吸烟相关肺癌在遗传、表观遗传和表型上都各有不同（例如在大体病理、进展过程以及治疗反应上）。
