      The question of what function such a unified theory might serve is a matter of some debate. A particular source of contention surrounds the merits of the research program unified by a search for genetic mechanisms associated with cancer cell behavior (Strauss, et. al., 2021). This research program has received many different names: the “oncogene paradigm,” (Bishop 1995; Morange 1997)[^bishop-1995][^morange-1997] “vision,” (Morange 1997)[^morange-1997], “theory,” or “paradigm,” (Sonnenschein & Soto 2008; Soto and Sonnenschein, 2004, 2005)[^sonnenschein-2008][^soto-2008], “model” (Temin 1974; Vogelstein & Kinzler 1993)[^temin-1974][^vogelstein-1993], “theory-method package” (Fujimura 1987, 1992)[^fujimura-1987], and “framework” (Blasimme, et al. 2013). Some contend that focus on genetic mechanisms is a “failed” paradigm, or a “degenerating” (as opposed to “progressive”) research program. Resolving such debates seems to require first that we have some measure of progress – hardly a straightforward matter, given the variety of goals of a scientific research program, and their transformations, over time. While some see the central goal of research as the generation of true theories, others focus on the generation of novel experimental traditions, the generation of fruitful lines of inquiry, the generation of local (as opposed to general) explanations of particular patterns or processes, or useful ways of classifying data. A more modest way of framing the question surrounding the “oncogene” paradigm’s failure or success might be to focus on how commitment to this “explanatory framework” has been useful in some ways, less so in others.
