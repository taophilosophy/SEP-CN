      相比之下，Broadbent（2009、2014）、Williams（2011）和 Khalidi（2013）虽然同意癌症这类疾病缺少本质属性，却认为疾病分类是自然分类，因为它们挑出的是独特的“对正常功能能力的偏离”，或稳态属性簇。Broadbent（2009、2014）的疾病分类“对比”模型认为，疾病因独特的原因而彼此不同。只要在“对照”与“病例”共有的一组原因中至少有一项不同（病例具有与正常功能能力相偏离的独特“部分与过程”），我们就有一个不同的疾病。Broadbent 认为这一说明解释了为什么“宫颈癌是一种疾病，而 HPV 炎不是”。不过，这个案例提出了一个有趣的问题：对疾病分类而言，是潜在的功能障碍还是明显的功能障碍更居于中心？在公共卫生语境中，控制“无症状”或潜在功能失调的状态往往很重要。目前不致癌的 HPV 毒株完全可能演化出致癌能力。所以，也许从公共卫生的角度看，“HPV 炎”是一个完全正当的疾病范畴，有助于部署更普遍地限制 HPV 传播的干预。也就是说，从预防医学的角度看，重要的是一种疾病范畴是否有利于预测和干预，即使功能破坏并不总是（甚至多数时候并不）发生。我们在划分疾病类型时应当选择哪一种分类，可能不仅取决于我们想回溯解释哪一种对比，也取决于我们想前瞻地促进哪一种干预。
