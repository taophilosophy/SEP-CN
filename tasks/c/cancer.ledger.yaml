      ## 3. Cancer as a Byproduct: Evolution, Development, and Aging
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Dobzhansky (1973) wrote that “nothing in biology makes sense except in light of evolution.” Can evolutionary thinking shed light on cancer? After all, cancer is ordinarily understood to be a case of failure of otherwise functional controls on cell birth and death. At first pass, this view seems fundamentally at odds with taking an evolutionary perspective on cancer. For, how can something that is an exemplary case of “dysfunction” count as an evolutionary process or product of adaptive evolution? Moreover, how ought we to square this picture of cancer with the fact that cancer cells seem to co-opt developmental processes—i.e., the process of “de-differentiation” typical of early embryonic cells? Is cancer a byproduct of development? Finally, cancer seems to increase in incidence as we age. Is cancer simply a byproduct of aging? Relatedly, if—as some argue—aging itself is selected for (a contested question!), is cancer in some sense “adaptive”? All these perspectives on cancer require us to perhaps rethink the nature of function and dysfunction, or at very least, what such terms mean in the context of discussion of cancer. Some argue that there is a straightforward sense to be made of scientists’ talk of cancer cells performing “functions,” insofar as they are involved in activities that contribute to the self-maintenance and continued presence of the systems of interest, namely cancer cells (Goldwasser, 2023, forthcoming). This sense of “function” is a non-evolutionary, but part-function account. On the other hand, some argue that cancer is a product of evolutionary trade-offs in fitness at different temporal and spatial scales over the course of our life and evolutionary history. On this view, the best perspective to take on cancer’s “functions” may be a “multilevel” evolutionary perspective—i.e., thinking of evolution by natural selection as operating at different temporal and spatial scales, both sequentially, and in some cases, simultaneously, sometimes yielding unfortunate “cross-level byproducts” of selection at one temporal and spatial scale, for entities or processes at other temporal or spatial scales (cf. Okasha 2006)[^okasha-2006]. Can such apparently contradictory accounts of cancer’s “functional” status be reconciled?
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      First, it is relatively uncontroversial that understanding a species’ evolutionary history, and the selective trade-offs they face over the course of their life history, can inform our understanding of how and why they are more or less vulnerable to disease. For instance, some species are more vulnerable to cancer than others. Why? Comparative biology—the comparison of different species—may help us identify mechanisms associated with disease vulnerability, onset and progression, when they arose, where and why they are shared, as well as how they have diverged (Aktipis, et al. 2015; Aktipis, 2020). Comparing and contrasting how development, immunity, and other mechanisms of suppression of cancer across species can help cancer researchers identify targets of opportunity for either treatment or prevention of cancer. In addition, we can look to unique features of our own evolutionary history in order to explain patterns of disease incidence, suggesting selective “mismatches” with our ancestral environment, a kind of “byproduct” explanations of our vulnerability to diseases. This enterprise is broadly characterized as “evolutionary medicine” (Crespi & Summers 2005; Gluckman, et al. 2009; Stearns & Koella 2007; Sun, et al. 2014)[^crespi-2005][^stearns-2007].
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      While the broad principles behind evolutionary medicine are relatively uncontroversial—we all are evolved organisms after all—philosophers of biology have been skeptical of particular claims about how our evolutionary history has shaped our vulnerability to disease, either because evidence in support of evolutionary “mismatch” with our ancestral environment is both scant and disputed, or because many arguments in evolutionary medicine make “adaptationist” assumptions, i.e., assumptions that a given trait is adaptive, or selectively advantageous, founded on at best “just so” stories (Valles 2012; see also Murphy 2006)[^valles-2012]. Others offer more nuanced accounts of the variety of senses in which evolutionary ‘mismatch’ explanations go forward, and are supported by a variety of evidence (Bourrat and Griffiths forthcoming).
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Of course, there are better and worse such arguments; the best arguments consider not only the widest array of evidence, but also trade offs in fitness, as well as the role of constraints arising out of development and life history. Selective trade-offs are long known to play a causal role in disease. In the case of cancer, some have speculated that traits adaptive early in life may yield fitness costs later in life. A vivid example may be early rapid growth, which can both increase reproductive fitness, but also apparently increase risk of prostate cancer in men and breast cancer in women (Giles, et. al., 2003; Ahlgren, et. al., 2004; Summers, et al., 2008; Alvarado, 2013; Boddy, et. al., 2015). In contrast, “mismatch” hypotheses suggest that traits that may have been adaptive in the past leave us vulnerable to disease in our current environment. For instance, many advocates of evolutionary medicine have argued that the high correlation between nulliparity and cancer risk might be explained by our evolutionary history. The argument relies on the hypothesis that women in the evolutionary past were pregnant for much of their lives, starting at an earlier age; breast development and differentiation was thus adapted to a lifetime of frequent pregnancy and nursing. Delaying or avoiding pregnancy thus changes the developmental processes typical for our species, which could increase breast cancer risk. Of course, such hypotheses are contentious; there is always the potential for confounding causes (in this case, of increased cancer risk due to a variety of risk factors at work in modern society) (Greaves 2001)[^greaves-2001]. Nonetheless, in a 1970 case-control study conducted at eight different locations around the globe, a WHO group led by McMahon et al., estimated that “breast cancer risk for women having their first birth under the age of 20 years is about half that for nulliparous women,” and that “women having their first child when aged under 18 years have only about one-third the breast cancer risk of those whose first birth is delayed until the age of 35 years or more.” Evolutionary “byproduct” explanations appeal to our evolutionary history to explain this observation. Both the above arguments may be making speculative assumptions about the adaptive advantage of size or early age of sexual maturity in our evolutionary past. Sex differences in various aspects of cancer risk, mortality, and progression thus provide an interesting case study for developing more sophisticated means of both defining and operationalizing sex differences in scientific research, and testing hypotheses about role of sex in disease (Mauvais-Jarvis, et. al., 2020, DiMarco, et. al., 2022)
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Another type of “byproduct” explanation of cancer—though one that appeals to a much more distant event in our evolutionary history—is that cancer is a product (or perhaps byproduct, or re-enactment) of the emergence of multicellularity. At one point in the very distant past, single celled organisms formed collectives that cooperate; these collectives eventually became multicellular organisms. Any collective of cells, especially collectives whose survival and reproductive success depends on functional organization, are potentially vulnerable to breakdown in cooperative organization. On this view, then, cancer is a product of breakdown in mechanisms that permitted the emergence of multicellularity—the mechanisms that protect us from “revolt from within” are not error-free, and over time will fail. Such discussions raise interesting questions about the nature of individuality (For a vivid discussion, see, e.g., Okasha 2006; Godfrey-Smith 2009; Bouchard & Huneman 2013; Clarke 2011, 2013; Love & Brigandt 2017; Bueno, et al. 2019; Pradeu 2012, 2013, 2016, 2019)[^bouchard-2013][^clarke-2011][^godfrey-smith-2009][^love-2017][^okasha-2006][^pradeu-2012]. Pradeu (2019, chapter 4) has distinguished two ways in which the immune system can contribute to cancer seen as a breakdown of individuality: either through a breakdown of its normal functioning (e.g. the immune system should eliminate cancer cells but fails to do so) or “the immune system acts normally and immune-mediated decohesion is due to an abnormal context” (e.g. the tumor produces an abnormal context that stimulates an immune response such as healing when there is no wound to heal).
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      According to some (Greaves & Maley 2012; Merlo, et al. 2006)[^greaves-2012] the evolutionary picture of cancer dovetails nicely with the somatic mutation theory; somatic cells divide and acquire mutations during our lifetimes; some of these mutations involve failures in regulatory pathways that ordinarily “enforce” functional organization, and thus cooperation. In this way, an evolutionary perspective—understanding how evolution of multicellularity required the emergence of cooperative organization—is essential to understanding cancer. Moreover, on this view, cancer itself may be viewed as an evolutionary process—the emergence of adaptive features of cancer cells, where these “adaptations” enable short term “fitness,” or relative success at survival and reproduction. Several scientists have developed theoretical models of this process, linking it to empirical data, e.g., on the emergence of chemotherapy resistance (Frank 2007; Wodarz & Komarova 2015)[^frank-2007]. On this view, cancer is both a process and byproduct of multi-level selection, where selection may be understood as operating at several levels of biological organization simultaneously, or sequentially (Damuth & Heisler 1988; Lean & Plutynski 2016)[^damuth-1988][^lean-2016]. That is, cancer cells may bear adaptations, and they are also evolutionary byproducts of selective processes at other levels of organization. It appears that cancer cells co-opt or hijack otherwise adaptive features of organisms. Signaling pathways that are ordinarily in service of adaptive functions in early stages of development or wound healing are reactivated in (some) cancer cells, in service of the transition to metastasis.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      This is a classic example of a cross-level selective byproduct (Okasha 2005, 2006)[^okasha-2005]. Traits advantageous at one level in the organization of multicellular organisms may be coopted by component parts. Some of the capacities that invasive cancer cells acquire (the capacity to invade and metastasize) are in fact due to a change in phenotype from epithelial to mesenchymal type cells, and losing adhesive properties enables such cells to invade the lymph and blood system. Lean and Plutynski (2016) have argued that cancer may in some ways parallel the patterns of emergence of multicellularity as characterized by Damuth and Heisler (1988), shifting over the course of emergence of disease from a simple selective process between individual cells to several kinds of multilevel selective process (MLS1 to MLS2). Critics contest that the process of metastasis only weakly mimics MLS2, however (Germain & Laplane 2017)[^germain-2017].
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Whether or in what sense cancer cells are “selfish” or “cheat” is a topic of debate (Aktipis 2020; Okasha forthcoming; Pradeu et al. 2023)[^aktipis-2020][^pradeu-2023]. Critics argue that the analogy is misleading, given that non-transmissible cancers are evolutionary dead-ends (Gardner, 2015; Shpak and Lu, 2016). Okasha (2021) argues that cancer cells could be genuine case of cheaters if the atavistic theory is true (which is by itself a matter of debate), i.e., if cancer cells revert to a unicellular mode of life that have been repressed during the transition to multicellularity. To be sure, there are both analogies and disanalogies between evolution in whole organisms, and the evolving population of cancer cells in a tumor (Germain 2012)[^germain-2012]. However, thinking of cancer as a dynamic, evolutionary process, has great potential for applications in cancer treatment, and perhaps also, in prevention. For instance, some have suggested that we might give young girls drugs or nutritional supplements that remodel the breast in ways akin to pregnancy, as a way to prevent the emergence of breast cancer (Katz, et al. 2015). Others suggest that modeling the evolution of multi-drug resistance may help prevent one of the major causes of cancer mortality. Drugs can be more or less effective in different patients and lose their effectiveness over time. An evolutionary perspective on cancer may shed light on how drug resistance comes about, in patients with more or less intratumor heterogeneity (Greaves 2001, 2007; Frank & Nowak 2004; Merlo, et al. 2006; Greaves & Maley, 2012)[^frank-2004][^greaves-2001].
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      A third type of byproduct explanation for cancer is the view that cancer is a disease of aging—that is, cancer incidence by and large increases as we age, perhaps in part as a byproduct of breakdowns in mechanisms associated with immune response and tissue integrity. This claim raises some broader questions about how we assess function and dysfunction, or how we assess function at different temporal and spatial scales of analysis, as well as how we understand the role of the immune system and the integrity of the organism as an individual. Indeed, all evolutionary and byproduct explanations of cancer raise similar philosophical questions about hypothesis testing, as well as definitions of “function” and “individuality,” both at the individual and group level, and over the course of one’s life history. On the evolutionary view of cancer, for instance, cancer cells are in some sense highly adaptive (Hausman 2012; Germain 2012; Godfrey-Smith 2009)[^germain-2012][^godfrey-smith-2009][^hausman-2012]. One relatively controversial view of aging, first proposed by August Weisman, is that aging has the evolutionary advantage—effectively clearing the way for the young. If indeed cancer is a necessary byproduct of aging, and aging is selected for, then on one view, cancer may be thought of as adaptive. Such a view raises a variety of questions about evidence and adaptationist explanations.(see the entry on “adaptationism”).
