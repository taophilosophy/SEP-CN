      Some philosophers (Schwartz 2014)[^schwartz-2014], drawing upon the biostatistical theory of disease as departure from age and sex-typical function (Boorse 1977), argue that we ought to classify such early-stage cancers as risk factors, rather than disease. Such growths are not disease, on this view, because they are not atypical and do not yet impair function—in fact as many as one half of men over 60 have some lesions of the prostate (Welch & Black 2010)[^welch-2010]. Reclassification of such cancers as mere risk factors, Schwartz argues, will prevent overdiagnosis and overtreatment. Other philosophers (e.g., Reid 2017)[^reid-2017] argue that this approach fails to acknowledge how the practice of diagnosis is itself a sort of risk-benefit calculation, informed in part by our knowledge of the prevalence of early-stage or indolent disease, and in part by more or less precautionary values. It seems this debate is not only a scientific one, but also a normative one; much like debates about PTSD or obesity, there are normative dimensions to how we diagnose and classify disease. Labeling can have both positive and negative consequences for patients, clinicians, insurers, not to mention developers and producers of screening, medical device, and pharmaceuticals (Ereshefsky 2009)[^ereshefsky-2009]. Overdiagnosis of early-stage disease can lead to serious harms; treating a condition that may or may not progress to invasive disease in the lifetime of a patient is costly and harmful.
    step1: |-
      一些哲学家（Schwartz 2014）[^schwartz-2014]依据疾病即偏离年龄与性别典型功能的生物统计理论（Boorse 1977），论证说我们应当把这类早期癌症分类为风险因素，而不是疾病。照这种看法，这类肿块不是疾病，因为它们并不非典型，也尚未损害功能——事实上，60 岁以上的男性中多达一半有某种前列腺病变（Welch & Black 2010）[^welch-2010]。Schwartz 论证说，把这类癌症重新归类为单纯的风险因素，将防止过度诊断和过度治疗。其他哲学家（如 Reid 2017）[^reid-2017]论证说，这种进路未能承认诊断实践本身就是一种风险—收益计算，它部分地由我们关于早期或惰性疾病流行程度的知识所启发，部分地由或多或少预防性的价值所启发。看来这场辩论不仅是科学的，也是规范性的；很像关于创伤后应激障碍或肥胖的辩论，我们如何诊断和分类疾病，带有规范性的维度。贴标签对患者、临床医生、保险方，更不用说对筛查、医疗器械和药物的开发者和生产者，都可能既有正面也有负面后果（Ereshefsky 2009）[^ereshefsky-2009]。早期疾病的过度诊断可能带来严重伤害；治疗一种在有生之年也许进展、也许不进展为侵袭性疾病的情况，既昂贵又有害。
