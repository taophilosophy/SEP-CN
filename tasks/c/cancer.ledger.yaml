      解释癌症是什么意思？这个问题既含糊，又让人犯难。因为一说到“癌症”，人们心里可能有好几个不同的解释目标：一个细胞变成“癌细胞”的一般过程；癌变整个过程的一个很一般的刻画；特别是实体瘤里的侵袭与转移过程；肿瘤内异质性怎么出现、起什么作用；不同癌症类型发病率为何不同；不同环境、社会经济群体、种族、年龄或性别中癌症发病率或死亡率的模式。这些解释目标，按理说各自要求相当不同的*解释种类*，而不只是不同的解释信息。这些解释在种类上不同，也许（部分）说明了：在癌症研究里解释的目标和性质是什么，哲学家为何看法如此多样——这背后是生物学哲学家关于解释规范的长期争论（见“20 世纪的科学解释理论”与“系统与合成生物哲学”词条）。同样不奇怪的是，癌症科学家之间也一直为研究议程和解释规范争论不休。
