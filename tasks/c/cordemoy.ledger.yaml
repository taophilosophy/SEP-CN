      热罗（或热罗尔）·德·科尔德穆瓦（Géraud (or Gerauld) de Cordemoy）于 1626 年 10 月出生，是巴黎大学一位教授之子。他是热罗与妮可·德·科尔德穆瓦所生四个孩子中的第三个，也是唯一的儿子。他九岁时父亲去世；除此之外，关于科尔德穆瓦的早年岁月几乎一无所知。他与玛丽·德·沙泽勒（Marie de Chazelles）的结婚日期虽无记录，但已知他五个孩子中的第一个生于 1651 年 12 月 7 日，时科尔德穆瓦二十五岁。
  - id: 3
    source: |
      Cordemoy earned a living as a lawyer, but was very active in Parisian philosophical circles. He attended various philosophy salons, and was acquainted with the Minim Emmanuel Maignan and the physicist Jacques Rohault, both organizers of philosophical conferences. In 1664, Cordemoy’s essay *Discours de l’áction des corps (A Discourse on the action of bodies)* was included, along with a discourse by Rohault, in the posthumous publication of Descartes’ *Le Monde (The World)* by Claude Clerselier. That essay would later become the second of the six discourses which make up one of Cordemoy’s two most important works, *Le Discernement du corps et de l’âme en six discours pour servir à l’éclaircissement de la physique (The Distinction of the body and the soul in six discourses, in order to be useful for the clarification of physics)* (1666). In this work, Cordemoy presents his atomism, his arguments for occasionalism, and his accounts of the distinction of and the interaction between the mind and the body.
    step1: |
      科尔德穆瓦以律师谋生，但在巴黎哲学圈中十分活跃。他参加各种哲学沙龙，并结识了米尼姆会士埃马纽埃尔·马尼昂（Emmanuel Maignan）与物理学家雅克·罗奥（Jacques Rohault），两人都是哲学会议的组织者。1664 年，科尔德穆瓦的论文《论物体的作用》（*Discours de l’áction des corps*）与罗奥的一篇谈话一起，被收入克洛德·克莱尔瑟利耶（Claude Clerselier）编辑的笛卡尔《世界》（*Le Monde*）的遗著出版中。那篇论文后来成为组成科尔德穆瓦最重要的两部著作之一的六篇谈话中的第二篇，即《论身体与灵魂之辨别——六篇谈话，为阐明物理学而作》（*Le Discernement du corps et de l’âme en six discours pour servir à l’éclaircissement de la physique*）（1666）。在这部著作中，科尔德穆瓦陈述了他的原子论、他对偶因论的论证，以及他对心灵与物体之区分及其相互作用的说明。
    step2: |
      科尔德穆瓦以律师为业谋生，却在巴黎哲学圈中十分活跃。他出入各种哲学沙龙，并结识了米尼姆会士埃马纽埃尔·马尼昂（Emmanuel Maignan）与物理学家雅克·罗奥（Jacques Rohault），二人皆为哲学会议的组织者。1664 年，科尔德穆瓦的论文《论物体的作用》（*Discours de l’áction des corps*）与罗奥的一篇谈话一同，被收入克洛德·克莱尔瑟利耶（Claude Clerselier）所编笛卡尔《世界》（*Le Monde*）的遗著之中。该文后来成为科尔德穆瓦两部最重要著作之一所收六篇谈话中的第二篇，即《论身体与灵魂之辨别——六篇谈话，为阐明物理学而作》（*Le Discernement du corps et de l’âme en six discours pour servir à l’éclaircissement de la physique*）（1666）。在这部著作中，科尔德穆瓦陈述其原子论、其对偶因论的论证，以及他对心灵与物体之区分及其相互作用的说明。
