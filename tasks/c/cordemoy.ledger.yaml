    source: |
      With regard to the conceivability of dividing any extended things, matter *or* body, Nadler, echoing a similar question raised by Leibniz back in the seventeenth century, asks:

      > Why should [Cordemoy] find the notion of the infinite divisibility of body in principle inconceivable? … [I]f Cordemoy’s atoms are extended, if they have ‘extremities’ and a ‘middle,’ then in what sense is it not possible to at least conceive of the parts of an atom, and thus conceive of its division? (Nadler, Introduction to Cordemoy [SDD], 22–23)
    step2: |
      关于任何广延之物的可分性的可构想性——无论物质**或**物体——纳德勒（Nadler）呼应莱布尼茨（Leibniz）早在十七世纪提出的一个类似问题，问道：

      > 科尔德穆瓦为何会在原则上认为物体无限可分的观念不可构想？……如果科尔德穆瓦的原子是广延的，如果它们有‘两端’和‘中间’，那么在什么意义上我们至少不能构想一个原子的部分，从而构想它的分割？（Nadler，《科尔德穆瓦导论》[SDD]，22–23）[^cordemoy-nd-2]
