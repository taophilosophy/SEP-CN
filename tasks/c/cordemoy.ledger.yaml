      There is disagreement among scholars as to whether Cordemoy’s occasionalism is complete, applying to minds and the mind’s own modes as well. Nadler (2005) writes that “those who believe that Cordemoy is a thoroughgoing occasionalist who denies all causal efficacy to minds and bodies are correct” (41). Battail (1973) is one such believer. On the other hand, Pyle (2003) holds that Cordemoy is not a complete occasionalist. Prost (1907) concludes likewise. Schmaltz (2017) is more cautious, maintaining only that “the case for a complete occasionalism remains to be made” (204).
