      Like Descartes’ *Meditations*, the *Discernement* contains six sections, and also like the *Meditations*, it concludes with discussions of the union of and the distinction between the mind and the body (though while Cordemoy addresses them in this order, Descartes, in the 6ᵗʰ Meditation, first tackles the distinction, and later the nature of the union). But unlike Descartes, who had gone to some length to argue that the nature of the mind is to think, Cordemoy’s Fifth Discourse accepts this as a given. Further, Cordemoy does not provide an argument that the mind and body form a substantial union, but gives an example to show that they are united, that of the body moving when the mind wills that it do so. In fact, the union is *defined* in terms of this sort of interaction: to say that the mind and body are united simply is to say that they interact. (Thus the question of whether the problem of the mind-body union is distinct from that of mind-body interaction, which has been much discussed in Descartes scholarship, does not arise for Cordemoy.) The Fifth Discourse also contains Cordemoy’s expansion of his occasionalism to cover interaction between the mind and the body. God’s activity is required here on the grounds that as the union is defined in terms of the interaction of essentially distinct substances with mutually exclusive essences, we must go outside that union to account for the ability of one substance to effect change in the other.
    step2: |
      与笛卡尔的《沉思集》一样，《辨别》包含六个部分，也与《沉思集》一样，它以对心灵与身体的结合与区分的讨论作结（尽管科尔德穆瓦按这一顺序处理它们，而笛卡尔在第 6 沉思中先处理区分，后处理结合的本性）。但与笛卡尔不同——笛卡尔曾大费周章地论证心灵的本性是思维——科尔德穆瓦的第五篇谈话把这一点视为理所当然。此外，科尔德穆瓦并没有提供心灵与身体构成实体性结合的论证，而是给出一个例子表明它们是结合的，即当心灵意愿身体如此运动时，身体便运动。事实上，结合正是**定义**为这种相互作用：说心灵与身体相结合，无非是说它们相互作用。（因此，心灵—身体结合的问题是否不同于心灵—身体相互作用的问题——这一问题在笛卡尔研究中被广泛讨论——对科尔德穆瓦而言并不存在。）第五篇谈话还包含科尔德穆瓦把其偶因论扩展到涵盖心灵与身体之间的相互作用。这里需要上帝的活动，理由是：既然结合被定义为本质相异、且具有互斥本质的实体的相互作用，我们就必须超出这一结合之外，才能说明一个实体作用于另一个实体、使其发生变化的能力。
