      As for the first mover, it could not itself be a body, since if it were, it would have to have motion of itself (for as first mover, where else would it get it?), and this has been shown to be impossible for bodies. Thus we may also conclude that the first mover is not a body. But there being only two kinds of substances (Cordemoy’s third axiom), bodies and minds, only a mind remains as a candidate for the first mover. Further, it is clear that our (finite) minds are not the source of motion in bodies. In the first place, our minds cannot effect our bodies in certain ways, either because they are immune to such influence (e.g., I cannot will the cells in my liver to cease dividing) or because of old age or injury (e.g., a crippled man cannot will himself to walk). Second—and noteworthy in that it anticipates both Malebranche and Hume—if we restrict ourselves to what we observe, we never experience a causal connection but only temporal succession between our volitions at one moment and our body’s actions the next. Third, if we could produce motion in bodies at will, it would, says Cordemoy, upset God’s plan for the quantity of motion which God conserves in the world. Thus he concludes that an infinite will must be the first mover.
    step2: |
      至于第一推动者，它本身不可能是一个物体，因为如果它是，它就不得不从自身拥有运动（因为作为第一推动者，它还能从哪里获得运动呢？），而这已表明对物体而言不可能。因此我们也可以得出结论：第一推动者不是物体。但既然只有两种实体（科尔德穆瓦的第三条公理），即物体与心灵，那么唯一可能作为第一推动者的候选者便是心灵。此外，显然我们（有限的）心灵并不是物体中运动的来源。首先，我们的心灵无法以某些方式作用于我们的身体，要么因为它们不受这种影响（例如，我无法意愿我的肝细胞停止分裂），要么因为年老或受伤（例如，一个瘸子无法意愿自己行走）。其次——值得一提，因为这预示了马勒布朗士与休谟——如果我们只限于我们所观察到的东西，我们便从未经验到因果联系，而只经验到我们某一时刻的意愿与我们身体下一刻动作之间的时间相继。第三，如果我们能随意在物体中产生运动，那么科尔德穆瓦说，这将打乱上帝为世界所保存的运动量所定的计划。于是他得出结论：一个无限的意志必定是第一推动者。
