      Cordemoy employs a second argument for the distinction, one which, while much less rigorous than Descartes’, follows in spirit the argument from the *Discourse on Method* by appealing to doubt: “I even see that when I wish to doubt everything that I know when I think of bodies, I am not able at the same time to doubt my thought. For let it be false, if you will, that there are any bodies in the world; it cannot be that there are no thoughts, inasmuch as I would be thinking. How could I believe that my thought might be the same thing that I call ‘body’? I can suppose that there aren’t any bodies, and I cannot suppose that I do not think, the supposition itself being a thought. Thus I know firstly that the soul, or that which thinks, is different from the body” (1968, 153). Cordemoy goes on to argue along similar lines that he can be assured of the existence of his mind, but that the existence of his body, and all other bodies, must be taken as an article of faith.
    step2: |
      科尔德穆瓦采用第二个论证来论证这一区分，这个论证虽远不如笛卡尔的严密，却在精神上追随《谈谈方法》中的论证，诉诸怀疑：“我甚至看到，当我想怀疑我在思考物体时所知的一切时，我不能同时怀疑我的思维。因为姑且让你假定世界没有任何物体；不可能没有任何思维，因为我正在思考。我怎能相信我的思维可能与我所称为‘物体’的是同一回事呢？我可以假定没有任何物体，却不能假定我不思考，因为这一假定本身就是一个思维。因此我首先知道，灵魂，即那个思考的东西，与物体不同”（1968, 153）[^cordemoy-1968]。科尔德穆瓦接着按类似思路论证，他可以确信他的心灵存在，但他的身体以及一切其他物体的存在，则必须作为一项信条来接受。
