Theories of *qi* and *yin* and *yang* also are importantly pursued in early philosophical works. Several Warring States texts contain references to the nature of *qi*, *yin* and *yang*, and their relation to health and longevity. The *Zhuangzi* clearly identifies qi as the basis of the physical constitution of the body: “Human birth is caused by the gathering together of *qi*” (22, 733, misleadingly translated by Watson (2013, 180) as “purity”). The *Zhuangzi* also describes harmonizing or taking charge of the six *qi*.

> The *qi* of heaven is not in harmony, the *qi* of earth is tangled and snarled. The six *qi* are maladjusted, the four seasons are disordered. *Now I want to harmonize the essences of the six qi in order to nurture life* (Zhuangzi 11, 386, emphasis added, cf. Watson 2013, 80)[^watson-2013].
    step1: |
气与阴阳的理论在早期哲学著作中也得到重要探讨。若干战国文本包含关于气、阴阳的性质及其与健康和长寿关系的论述。《庄子》明确把气视为身体形体构成的基础：“人的出生，是由气的聚集引起的”（22，733；Watson（2013，180）误译为“purity”）。《庄子》还描述了调和或掌管六气。

> 天气不和谐，地气纠缠郁结。六气失调，四季紊乱。如今我想要调和六气之精华，以养育生命（《庄子》11，386；着重号为原文所加，参见 Watson 2013，80）[^watson-2013]。
