According to Zhang Xichun 張錫純 (1860–1933), one of the leading reformers of Chinese medicine in the early twentieth century:

> Many recent medical journal reports take the view that [traditional Chinese] philosophy holds back the progress of medicine, but their authors do not understand the use of philosophy, nor do they understand that philosophy is actually the basis of medicine. (Zhang Xichun 1918–1934, 296)[^zhang-1918].
    step1: |
据二十世纪初中国医学的主要改革者之一张锡纯（1860–1933）称：

> 近来许多医学期刊的报道都认为，[传统中国]哲学阻碍了医学的进步，但这些报道的作者既不懂哲学的用途，也不明白哲学实际上正是医学的基础。（张锡纯 1918–1934，296）[^zhang-1918]。
    step2: |
据二十世纪初中国医学的主要改革者之一张锡纯（1860–1933）称：

