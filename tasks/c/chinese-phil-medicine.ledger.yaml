Although Robinet (1997) insists that Ge Hong was only interested in pharmacology as an adjunct to alchemy, the *Baopuzi* also includes important material on medicine and pharmacology. Other pharmacological treatises attributed to him are no longer extant: *Prescriptions for Rescuing the Dying after the Pulse-takin*g (*Zhou hou jiu zu Fang* 肘後救卒方), *Prescriptions from the Jade Box* (玉函方 *Yu han fang*), Herbal Recipes from the Gold Cabinet (*Jin gui yaofang* 金匱藥方), and Prescriptions for Emergencies after Taking the Pulses (*Zhou hou bei ji fang* 肘后備急方), which is said to be the first Chinese text to mention smallpox (*tian hua bing* 天花病). Thirteen texts attributed to Ge Hong are preserved in the Daoist Canon (*Dao zang* 道藏), but most are probably later works (Robinet 1997, 78–113, Theobald 2013)[^robinet-1997][^theobald-2013].
    step1: |
尽管 Robinet（1997）坚持认为葛洪只对作为炼丹术辅助的药理学感兴趣，但《抱朴子》也包含关于医学与药理学的重要材料。归于他的其他药理学论著已不存世：《肘后救卒方》（*Zhou hou jiu zu Fang* 肘後救卒方）、《玉函方》（*Yu han fang* 玉函方）、《金匮药方》（*Jin gui yaofang* 金匱藥方）与《肘后备急方》（*Zhou hou bei ji fang* 肘后備急方），后者据称是中国最早提到天花（*tian hua bing* 天花病）的文本。归于葛洪的十三种文本保存在《道藏》（*Dao zang* 道藏）中，但大多可能是后世作品（Robinet 1997，78–113，Theobald 2013）[^robinet-1997][^theobald-2013]。
