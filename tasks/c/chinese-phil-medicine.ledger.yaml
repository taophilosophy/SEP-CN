We find a different account of these concepts in technical works. The apocryphal “founder” of scientific thought in China was Zou Yan 鄒衍 (305–240 BCE), who is credited with combining and systematizing *yin-yang* and *wuxing* theory. No works attributed to him survive. Sima Qian’s biography in *Shi ji* 76 describes him as a member of the Jixia 稷下 Academy, originally from the state of Qi in present day Shandong (Needham 1956: 231–34)[^needham-1956]. By contrast, the *Han shu* describes him as a Recipe Master (*fang shi*). This is important because of the connection between *fang shi* and medicine.
