“Recipes for Nurturing Life” (*Yang sheng fang* 養生方) consists of eighty-seven recipes, including food, drugs, and beverages, along with several sexual cultivation exercises. “Eliminating Grain and Eating Vapor” (*Que gu shi qi* 卻榖食氣) specifies diet and breathing exercises to be performed in the morning and evening, and a seasonal regimen of breath cultivation through consuming six qi and avoiding another five (Harper 1998, 25–30)[^harper-1998]. Another text, the “Ten Questions” (*Shi wen* 十問) gives advice on techniques for nurturing life (Harper 1998, 22–30)[^harper-1998], for example:

> Yao asked Shun: “In Under-heaven what is most valuable?”
>
> Shun replied: “Life is most valuable.”
>
> Yao said: “How can life be cultivated?” Shun said: “Investigate yin and yang.” (Zhou Yimou and Xiao Zuotao 1989, 379; Harper 1998, 399)[^harper-1998]
