Other passages in the *Zhuangzi* extol the abilities of specialized craftsmen who possess highly technical skills. These stories liken mastery of the Way to mastery of a craft. They also emphasize the technical skills of commoners. Commoners, rather than rulers, are presented as sage-like figures. These technical experts include arrow makers, bell-stand carvers, boatmen, butchers, cicada catchers, potters, sword makers, and wheelwrights (Raphals 2005)[^raphals-2005]. It is curious that these passages never include physicians.
