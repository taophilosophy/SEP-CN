Key to this amalgam were several concepts shared by both groups but deployed in very different ways. Early medical – and cosmological – thinking depicts a cosmos ultimately composed of *qi* 氣 (the energy that constitutes and organizes matter and causes growth and change) in processes of constant change, based on the interactions of *yin* and *yang* 陰陽 and the “Five Agents” or “Five Powers” (*wuxing*. See Graham 1986, Raphals 1998 and 2013)[^graham-1986][^raphals-1998][^raphals-2013].
    step1: |
这一融合的关键在于两个群体共有、却以非常不同的方式运用的若干概念。早期医学——以及宇宙论——思想把宇宙描绘为最终由气（*qi* 氣，即构成并组织物质、引起生长与变化的能量）构成，处于不断变化的过程中，这些变化基于阴阳（*yin* 与 *yang* 陰陽）的相互作用以及“五行”或“五德”（*wuxing*。参见 Graham 1986，Raphals 1998 与 2013）[^graham-1986][^raphals-1998][^raphals-2013]。
    step2: |
这一融合的关键在于两个群体共有、却以非常不同的方式运用的若干概念。早期医学——以及宇宙论——思想把宇宙描绘为最终由气（*qi* 氣，即构成并组织物质、引起生长与变化的能量）构成，处于不断变化的过程中，这些变化基于阴阳（*yin* 与 *yang* 陰陽）的相互作用以及“五行”或“五德”（*wuxing*。参见 Graham 1986，Raphals 1998 与 2013）[^graham-1986][^raphals-1998][^raphals-2013]。
