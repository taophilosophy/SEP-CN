As an alchemist, Ge Hong experimented with drugs and minerals. The “Gold Elixir” (*Jin dan* 金丹) and “Yellow and White” (*Huang bai* 黄白) chapters of the *Baopuzi* *neipian* survey the history of alchemy and describe in detail a method for “alloying cinnabar,” quoting from ancient recipes and “cinnabar methods.” The “Immortal Herbs” (*Xian yao* 仙藥) chapter gives information on medical herbs (Gao 1996, Qing 1994, Theobald 2013)[^gao-1996][^qing-1994][^theobald-2013].
