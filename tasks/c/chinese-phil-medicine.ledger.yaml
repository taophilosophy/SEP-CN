His point is that, although the *neijing* is an exposition of medicine: “it necessarily begins with philosophy and takes philosophy as the study of how to safeguard one’s person. People must first be able themselves to protect their own persons; only then can they represent to others how to protect their persons. Taking philosophy as the way to protect one’s person, it is by means of the principles of philosophy that we are able to preserve our bodies by transforming our *qi*. Taking medicine is the way to protect other people’s bodies, it is by first completely understanding the transformation of qi in one’s own person that [the physician] is able to represent to others how to adjust the transformation of qi in their own bodies.” He concludes: “from this we understand that philosophy is the true source of medicine, or rather that medicine is the natural outcome of philosophy. This is why the Neijing states explicitly that the study of medicine must start from philosophy.” How, he concludes, could philosophy obstruct medicine? (Zhang Xichun 1918–1934, 296–98)[^zhang-1918].
    step1: |
他的论点是，尽管《内经》是一部医学论著：“它必然始于哲学，并把哲学作为如何保全自身的研究。人们必须首先能够自己保护自身；然后才能向他人示范如何保护自身。把哲学作为保全自身之道，我们正是凭借哲学的原理，通过转化我们的气来保全我们的身体。把医学作为保护他人身体之道，[医家]首先彻底理解自身之气的转化，然后才能向他人示范如何调整他们体内的气的转化。”他总结道：“由此我们明白，哲学是医学的真正源头，或者说医学是哲学的自然产物。这就是为什么《内经》明确说医学研究必须始于哲学。”他最后问道，哲学怎能阻碍医学？（张锡纯 1918–1934，296–98）[^zhang-1918]。
