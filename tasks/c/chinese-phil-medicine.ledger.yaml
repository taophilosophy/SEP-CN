Finally, physicians and philosophers created textual lineages and accounts of textual authority. The most important medical works of this kind are the *Yellow Emperor’s Classic of Internal Medicine* and the *Materia Medica of Shen Nong* (*Shen Nong bencao*), ascribed to the “Divine Husbandmen” Shen Nong, who, according to legend, tested hundred of herbs and plants to ascertain their curative properties. By contrast, the evidence of recently excavated texts indicates that the *Huang Di neijing* derived from prior textual traditions that were subsequently lost (Harper 1998)[^harper-1998] and that the extant version is a composite of several earlier texts (Keegan 1988, Unschuld 2003, Unschuld and Tessenow 2011, Yamada 1979)[^keegan-1988][^unschuld-2003][^unschuld-2011][^yamada-1979].
    step1: |
最后，医家与哲学家创造了文本谱系与文本权威的记述。这类最重要的医学著作是《黄帝内经》与《神农本草经》（*Shen Nong bencao*），后者归于“神农氏”（Shen Nong）——传说中神农曾试验数百种草药与植物以确定其治疗特性。相比之下，近年出土文本的证据表明，《黄帝内经》源自此前随后亡佚的文本传统（Harper 1998）[^harper-1998]，且现存版本是若干更早文本的合成（Keegan 1988，Unschuld 2003，Unschuld 与 Tessenow 2011，Yamada 1979）[^keegan-1988][^unschuld-2003][^unschuld-2011][^yamada-1979]。
    step2: |
最后，医家与哲学家创造了文本谱系与文本权威的记述。这类最重要的医学著作是《黄帝内经》与《神农本草经》（*Shen Nong bencao*），后者归于“神农氏”（Shen Nong）——传说中神农曾试验数百种草药与植物以确定其治疗特性。相比之下，近年出土文本的证据表明，《黄帝内经》源自此前随后亡佚的文本传统（Harper 1998）[^harper-1998]，且现存版本是若干更早文本的合成（Keegan 1988，Unschuld 2003，Unschuld 与 Tessenow 2011，Yamada 1979）[^keegan-1988][^unschuld-2003][^unschuld-2011][^yamada-1979]。
