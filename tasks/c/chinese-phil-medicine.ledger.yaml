The third chapter of the *Zhuangzi* is titled “The Lord of Nurturing Life” (*Yang sheng zhu* 養生主). In it, the expert butcher Pao Ding instructs Duke Hui of Liang. Pao Ding describes the process of mastering his skill. His method is initially analytic; he begins by studying oxen as wholes, next as parts, and finally with faculties beyond ordinary vision. This discourse is presented as an instruction to the Lord Wenhui, who ends by saying that: “Pao Ding has taught me how to nurture life” (*yang sheng*, *Zhuangzi* 3, 124, cf. Watson 2013, 20)[^watson-2013].
    step1: |
《庄子》第三章题为“养生主”（*Yang sheng zhu* 養生主）。其中，技艺精湛的屠夫庖丁向梁惠王授业。庖丁描述了他掌握其技艺的过程。他的方法起初是分析性的；他开始把牛作为整体来研究，接着作为部分来研究，最后凭超越普通视觉的官能来研究。这一论述被呈现为对文惠君（Lord Wenhui）的教导，文惠君最后说道：“庖丁告诉我如何养生”（*yang sheng*，《庄子》3，124；参见 Watson 2013，20）[^watson-2013]。
