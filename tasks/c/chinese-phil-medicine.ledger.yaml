Secondly, medical works, like other scientific works, were classified as technical specialties, distinct from generalist works, including the “Masters” texts associated with Chinese philosophy (Raphals 2008–2009, forthcoming)[^raphals-2008]. Medicine and its related disciplines appear in the last section of the Bibliographic Treatise (chapter 30) of the Standard History of the Han Dynasty (*Han shu*). This Treatise consists of six sections. The first two (“Six Classics” and “Masters”) contain philosophical works. The last two are technical: “Numbers and Techniques” (S*hu shu* 數術), and “Recipes and Methods” (F*ang ji* 方技). The latter includes works on medicine and longevity, including the categories of medical classics (*yi jing* 醫經), classical recipes (*jing fang* 經方), sexual arts (*fang zhong* 房中, also referred to as “arts of the bedchamber”), and immortality practices (*shen xian* 神仙). These chapters reflect the concerns and expertise of the technical and ritual specialists closely associated with the “Recipe Masters” (*fang shi* 方士) associated with the Han court. But their concerns also appear in early philosophical texts to such an extent that any separation of their philosophical from their religious and technical content is arbitrary and artificial (Harper 1998 and 1999; Kalinowski 2004)[^harper-1998][^harper-1999][^kalinowski-2004].
    step1: |
其次，医学著作与其他科学著作一样，被归类为技术专门类，区别于通论性著作，包括与中国哲学相关的“诸子”文本（Raphals 2008–2009，forthcoming）[^raphals-2008]。医学及其相关学科见于汉代正史《汉书》（*Han shu*）的《艺文志》（卷 30）的最后一节。此《志》包含六个部分。前两部分（“六艺”与“诸子”）包含哲学著作。最后两部分是技术性的：“数术”（*Shu shu* 數術）与“方技”（*Fang ji* 方技）。后者包含论医学与长寿的著作，包括医经（*yi jing* 醫經）、经方（*jing fang* 經方）、房中术（*fang zhong* 房中，亦称“bedchamber 之术”）与神仙（*shen xian* 神仙）等类别。这些篇章反映了与汉廷紧密相关的“方士”（*fang shi* 方士）的技术与仪式专门家的关切与专长。但他们的关切也出现在早期哲学文本中，以至于把他们的哲学内容与其宗教和技术内容截然分开是任意且人为的（Harper 1998 与 1999；Kalinowski 2004）[^harper-1998][^harper-1999][^kalinowski-2004]。
    step2: |
