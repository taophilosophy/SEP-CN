Medical and mantic texts excavated from tombs make it clear that a wide range of longevity techniques had been developed before the Han dynasty (Harper 1998, 33)[^harper-1998]. Most important is a corpus of medical manuscripts excavated from Mawangdui 馬王堆 (Changsha, Hubei), dated to 169 BCE. This tomb is best known for its two versions of the *Daode jing*, but it is meaningful to locate those texts among other texts of a scientific provenance found in the tomb (Harper 1998 and 2000, Ma Jixing 1992, Zhou Yimou 1994, Zhou Yimou and Xiao Zuotai 1987)[^harper-1998][^ma-1992][^zhou-1987][^zhou-1994].
    step1: |
从墓葬出土的医学与占卜文本表明，在汉代之前已发展出多种多样的长寿技术（Harper 1998，33）[^harper-1998]。最重要的是从马王堆（*Mawangdui* 馬王堆，湖北长沙）出土的一批医学手稿，断代为公元前 169 年。此墓以其两个版本的《道德经》最为著名，但把这些文本置于墓中发现的其他科学来源文本之中是有意义的（Harper 1998 与 2000，Ma Jixing 1992，Zhou Yimou 1994，Zhou Yimou 与 Xiao Zuotai 1987）[^harper-1998][^ma-1992][^zhou-1987][^zhou-1994]。
