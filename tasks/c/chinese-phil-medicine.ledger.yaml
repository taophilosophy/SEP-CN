Theories of *qi*, *yin-yang* and *wuxing* also inform medical works. New systematic medical theories based on these ideas were systematized in a cosmological framework in the *Huang Di neijing*, a complex and multi-layered text, probably compiled in the first century BCE (Keegan 1988, Unschuld 2003, Yamada 1979)[^keegan-1988][^unschuld-2003][^yamada-1979]. It presents a systematic cosmology that analogizes the body, the state, and the cosmos in systems of “correlative cosmology” (Graham 1986b, Sivin 1995, Lloyd and Sivin 2002)[^graham-1986b][^lloyd-2002][^sivin-1995]. It describes relations and analogies between the body (including the emotions), the state and the cosmos in terms of *yin-yang* and *wuxing*. For example, the *Huang Di neijing* describes correspondence between the articulations of the body and the cosmos, specifically between heaven and earth and the upper and lower parts of the body:

> Heaven is round, earth is square; people’s heads are round, their feet are square and thereby correspond to them. Heaven has the sun and moon, people have two eyes; Earth has nine regions, people have nine orifices. Heaven has wind and rain, people have joy and anger; Heaven has thunder and lightning, people have the notes and sounds. Heaven has four seasons, people have four limbs. Heaven has five tones, people have the five depots; Heaven has six pitches, people have six palaces. Heaven has winter and summer, people have cold and hot [ailments]. Heaven has ten days, people have the hands’ ten fingers … Heaven has yin and yang; people have man and wife. The year has 365 days; the body has 360 joints (*Huang Di neijing ling shu* 71.2, 446, cf. Wong Ming 1987, 336–338 (French). There is no good English translation of this text.).
    step1: |
气、阴阳与五行理论也贯穿医学著作。基于这些观念的新系统化医学理论，在《黄帝内经》中被纳入一个宇宙论框架加以系统化；《黄帝内经》是一部复杂、多层的文本，可能编纂于公元前一世纪（Keegan 1988，Unschuld 2003，Yamada 1979）[^keegan-1988][^unschuld-2003][^yamada-1979]。它呈现一种系统化的宇宙论，在“关联性宇宙论”（“correlative cosmology”）体系中将身体、国家与宇宙相类比（Graham 1986b，Sivin 1995，Lloyd 与 Sivin 2002）[^graham-1986b][^lloyd-2002][^sivin-1995]。它以阴阳与五行的术语描述身体（包括情感）、国家与宇宙之间的关系与类比。例如，《黄帝内经》描述了身体关节与宇宙之间的对应，特别是天与地同身体上下部位之间的对应：

> 天圆地方，人头圆足方以应之。天有日月，人有两目。地有九州，人有九窍。天有风雨，人有喜怒。天有雷电，人有音声。天有四时，人有四肢。天有五音，人有五脏；天有六律，人有六腑。天有冬夏，人有寒热[之疾]。天有十日，人有手十指……天有阴阳，人有夫妻。岁有三百六十五日，人有三百六十节（《黄帝内经灵枢》71.2，446；参见 Wong Ming 1987，336–338（法文）。此文本无佳英译。）。
