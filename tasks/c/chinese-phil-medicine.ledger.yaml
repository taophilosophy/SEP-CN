Ge Hong 葛洪 (283–343 or 363 CE, a physician and Daoist from of the Eastern Jin (317–420 CE), was the first of several explicitly Daoist physicians to write about the practice of alchemy. He was the author of the *Teachings of the Master Who Embraces Simplicity* (*Baopuzi* 抱樸子). The *Baopuzi* consists of seventy chapters (*pian* 篇): twenty “Inner Chapters” (*Baopuzi* *neipian* 抱樸子内篇) and fifty “Outer Chapters” (*Baopuzi* *waipian* 抱樸子外篇). The two were effectively different books that were not combined under one title until a thousand years after Ge Hong’s time (Sivin1969, 389. For a partial translation of the *waipian* see Sailey 1978)[^sailey-1978]. Ge Hong was also the author of the *Collected Life Stories of Immortals* (*Shen xian zhuan* 神仙傳, trans. Campany 2002)[^campany-2002] and *Biographies of Recluses* (*Yin yi zhuan* 隱逸傳).
    step1: |
葛洪（*Ge Hong* 葛洪，公元 283–343 或 363，东晋（317–420）医家与道士）是若干位明确以道教身份著书论述炼丹术的医家中的第一位。他是《抱朴子》（*Baopuzi* 抱樸子）的作者。《抱朴子》由七十篇（*pian* 篇）组成：二十篇“内篇”（*Baopuzi neipian* 抱樸子内篇）与五十篇“外篇”（*Baopuzi waipian* 抱樸子外篇）。两者实际上是不同的书，直到葛洪之后一千年才被合于一个书名之下（Sivin1969，389。关于《外篇》的部分英译，见 Sailey 1978）[^sailey-1978]。葛洪也是《神仙传》（*Shen xian zhuan* 神仙傳，Campany 2002 英译）[^campany-2002]与《隐逸传》（*Yin yi zhuan* 隱逸傳）的作者。
