The introduction to the *Qianjin fang* (ch. 1) describes the characteristics of a great physician and describes inappropriate conduct, especially the desire for wealth or reputation. According to Sun, a great physician should not pay attention to status, wealth or age; he should not care whether a person is attractive, a friend or enemy, or whether the person is (Han) Chinese or educated. He should meet everyone on equal grounds and should always act as if he were thinking of a close relative (ch.1. For translation see Unschuld 1979, 29–33)[^unschuld-1979].
