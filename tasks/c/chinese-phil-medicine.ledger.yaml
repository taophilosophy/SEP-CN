It is almost impossible to separate Chinese ideas of body, state, cosmos from concepts of “nature,” though, as Nathan Sivin points out, there is no indigenous Chinese term for “nature” before the nineteenth century. Over the course of the last three centuries BCE, Chinese understandings of the physical world developed to reflect, and mirror, political consolidation (Sivin 1995, 2007)[^sivin-1995]. These new ideas of cosmic order—correspondence between microcosm (the body) and macrocosm (the cosmos)—appeared in new representations of the body, the state, and the cosmos that were based on systematic applications and correlations of the ideas of *yin-yang* and *wuxing*. They are prominent in Warring States politico-philosophical writings such as the *Springs and Autumns of Master Lü* (*Lü Shi chunqiu*) of Lü Buwei (291?-235 BCE) and the *Luxuriant Dew of the Springs and Autumns* (*Chunqiu fanlü*), attributed to Dong Zhongshu (179–104 BCE).
    step1: |
要把中国关于身体、国家、宇宙的观念与“自然”（“nature”）概念分开几乎不可能，尽管正如 Nathan Sivin 所指出的，在十九世纪之前中国并无本土的“自然”一词。在公元前最后三个世纪的过程中，中国人对物理世界的理解发展为反映并映照政治整合（Sivin 1995，2007）[^sivin-1995]。这些关于宇宙秩序的新观念——微观宇宙（身体）与宏观宇宙（宇宙）之间的对应——出现在关于身体、国家与宇宙的新表征中，这些表征基于阴阳与五行观念的系统运用与关联。它们在战国时期的政治哲学著作中十分突出，如吕不韦（公元前 291?–235）的《吕氏春秋》（*Lü Shi chunqiu*）与归于董仲舒（公元前 179–104）的《春秋繁露》（*Chunqiu fanlü*）。
