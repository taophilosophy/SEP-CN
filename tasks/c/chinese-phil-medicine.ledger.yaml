Within a Chinese historical context, medicine (*yi* 醫) was one of several qualitative sciences. It included “nurturing life” (*yang sheng* 養生), a broad category that comprised a wide range of self-cultivation techniques. In later periods, medicine also included materia medica (*bencao* 本草) and internal (*nei dan* 內丹) and external (*wai dan* 外丹) alchemy. The early Chinese qualitative and quantitative sciences were specific, with no unified notion of science (Sivin 1982 and 1990)[^sivin-1982][^sivin-1990].
    step1: |
在中国历史语境中，医学（*yi* 醫）是若干定性科学之一。它包含“养生”（*yang sheng* 養生），这是一个涵盖多种自我修养技术的宽泛范畴。在较晚时期，医学还包括本草学（*bencao* 本草）以及内丹（*nei dan* 內丹）与外丹（*wai dan* 外丹）炼金术。早期中国的定性科学与定量科学都是专门的，没有统一的“科学”观念（Sivin 1982 与 1990）[^sivin-1982][^sivin-1990]。
