Ge Hong was the first to systematically describe the history and theory of Daoist immortality techniques such as “preserving unity” (*shou yi* 守一), circulating energy (*xing qi* 行氣), “guiding and pulling” (*dao yin*), and sexual longevity techniques (*fang zhong*房中, *Baopuzi neipian,* ch. 2; Lai Chi-tim 1998, 203-204)[^lai-1998]. But his accounts of these techniques clearly reflect an interest in self-cultivation according to broadly Confucian principles. For example, he considered moral self-cultivation a precondition for the search for immortality; self-cultivation included such Confucian virtues as benevolence (*ren*), trustworthiness (*xin*), loyalty (*zhong*) and filiality (*xiao*). Ge Hong criticized Daoist “pure conversation” (*qing tan*) and emphasized the importance of both moral virtue and Daoist study. His specifically Daoist writings emphasize the importance of both “mystery” (*xuan* 玄) and emptiness (*xu* 虛), and all-embracing unity, which the Daoist must actively preserve by meditation practices, techniques of “preserving the essence” (*bao jing* 保精) and consuming medicinal herbs (*fu yao* 服藥).
    step1: |
葛洪是第一位系统描述道教神仙术历史与理论的人，这些技术包括“守一”（*shou yi* 守一）、行气（*xing qi* 行氣）、“导引”（*dao yin*）与性长寿术（*fang zhong* 房中；《抱朴子内篇》，第 2 章；Lai Chi-tim 1998，203-204）[^lai-1998]。但他对这些技术的记述明显反映出按照大致儒家原则进行自我修养的兴趣。例如，他认为道德自我修养是追求成仙的前提；自我修养包括仁（*ren*）、信（*xin*）、忠（*zhong*）、孝（*xiao*）等儒家德性。葛洪批评道教的“清谈”（*qing tan*），并强调道德德性与道学研究两者都重要。他专门的道教著作强调“玄”（*xuan* 玄）与“虚”（*xu* 虛）以及包罗万象的统一的重要性，这种统一须由道士通过冥想实践、“保精”（*bao jing* 保精）术与服食药草（*fu yao* 服藥）来积极保持。
