This passage is an invitation to explore the moral nuances of reciprocity, or “returning in kind.” What might a group of 10–11 year-olds have to say about this? Here is a sampling from a lengthy discussion of the *Lisa* passage by a group of fifth graders (Pritchard 1996)[^pritchard-1996]. With very little prompting from the teacher, the students raised and vigorously pursued questions such as the following:

- What is likely to happen when we retaliate? Will this simply start a long chain of trying to “get things even” that no one (other than perhaps the initiator) wants?
- Can retaliating really “get things even”? Can we even make sense of “getting things even”?
- Is it really right to respond to a wrong by returning in kind? Is this trying to make a right out of two wrongs?
- What alternatives to trying to “get things even” might there be? What would happen if you just ignore someone who is trying to get a rise out of you?
- When is self-defense the best strategy?
- Is there a difference between trying to “get things even” and trying to “teach someone a lesson”?
- Can something like the Golden Rule help us here? What does the Golden Rule *mean*? Is it a *good* rule?
    step1: |
这段话邀请我们探讨互惠（reciprocity）的道德细微差别，即“以同样的方式回报”（returning in kind）。一组 10–11 岁的儿童对此会说些什么？这是一组五年级学生就《丽莎》这段文字进行的长篇讨论的节选（Pritchard 1996）[^pritchard-1996]。在老师几乎不加以引导的情况下，学生们提出并积极追问了如下问题：

- 我们报复时会发生什么？这是否会开启一条长长的“扯平”链条，而没有人（或许除了始作俑者）想要它？
- 报复真的能“扯平”吗？我们甚至能理解“扯平”是什么意思吗？
- 以同样的方式回应一个错误真的对吗？这是不是试图把两个错误变成一个是正确？
- 除了试图“扯平”，还有哪些选择？如果你只是不理睬那个想激怒你的人，会怎样？
- 什么时候自卫是最好的策略？
- 试图“扯平”和试图“给某人一个教训”有区别吗？
- 像黄金法则这样的东西能帮到我们吗？黄金法则*意味着*什么？它是一条*好*规则吗？
