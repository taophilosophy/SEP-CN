Picking up on the idea that critical thinking is sensitive to context, some critics challenge the notion that critical thinking can be usefully taught independently of specific disciplinary areas (McPeck, 1985). While conceding that there are some generic features of critical thinking that cut across disciplines, they maintain that even these features acquire their meanings only in specific contexts that vary across disciplines (such as history, sociology, biology, chemistry). However, unless the different disciplines ask questions about their own basic assumptions and their relationships to one another, critical thinking within those disciplines will overlook important questions that need attention. Philosophy does ask such questions about the different disciplines, including itself.
    step1: |
抓住批判性思维对语境敏感这一观念，一些批评者质疑批判性思维可以脱离具体学科领域而有效教授的观点（McPeck, 1985）。虽然他们承认批判性思维有一些贯穿各学科的普遍特征，但他们坚持认为，即使是这些特征也只有在各学科（如历史、社会学、生物学、化学）各不相同 的具体语境中才获得意义。然而，除非各学科对自身的基本假设以及彼此之间的关系提出问题，否则这些学科内部的批判性思维将忽略需要注意的重要问题。哲学确实就各学科提出这样的问题，包括它自己。
