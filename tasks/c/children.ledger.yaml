这段话邀请我们探讨互惠（reciprocity）的微妙道德之处，即“以同样的方式回报”。一组 10–11 岁的儿童对此会说些什么？以下是一组五年级学生就《丽莎》这段文字进行的长篇讨论的节选（Pritchard 1996）[^pritchard-1996]。在老师几乎不加引导的情况下，学生们提出并热烈追问了如下问题：

