The true sentence, “All oaks are trees” becomes false when reversed. So does, “All carrots are vegetables.” Can we say that *every* true sentence beginning with ‘all’ becomes false when reversed? The children in *Harry Stottlemeier’s Discovery* initially are tempted to say, yes. But at least as early as the 3ʳᵈ grade, children easily find exceptions. What about “All tigers are tigers”, many will ask. Others may respond that this is an uninteresting sentence, offering something like “All rabbits are hares,” or “All mothers have children” as alternatives. With relatively little encouragement, they can come up with good definitions of geometric figures and differentiate them from proposed definitions that cannot be reversed. For example, “All squares are rectangles” is true, but it becomes false when reversed. “All squares are rectangles with equal sides,” however, can be reversed.
    step1: |
真的句子“所有橡树都是树”倒过来就变假。“所有胡萝卜都是蔬菜”也一样。我们能说，每一个以“所有”开头的真句子倒过来都变假吗？《哈利·斯托特迈耶的发现》中的孩子们起初倾向于说：是的。但至少早在三年级，孩子们就能轻易找到例外。许多人会问：那“所有老虎都是老虎”呢？另一些人可能会回答说，这是一个无趣的句子，并提出像“所有兔子都是野兔”或“所有母亲都有孩子”这样的替代。只要稍加鼓励，他们就能给出几何图形的恰当定义，并把它们与那些不能倒转的定义区分开来。例如，“所有正方形都是矩形”是真的，但倒过来就变假。然而“所有正方形都是等边的矩形”则可以倒转。
