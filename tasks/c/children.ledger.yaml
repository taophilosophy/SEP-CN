Although there is continued use of IAPC materials, recent years have been marked by a proliferation of alternative teaching resources and ways of engaging children in philosophical discussions. For years Gareth Matthews contributed reviews of children’s stories to *Thinking*, then IAPC’s official journal (even though IAPC’s own teaching materials made no use of other children’s literature). This inspired Tom Wartenberg (2009, 2013) to develop his highly successful pre-college philosophy program at Mt. Holyoke College (MA), a prize winning program that is built around classic children’s stories. His website offers a wealth of materials on children’s literature that are designed to provide guidance for those wishing to pursue philosophy with children. Karen Murris was an early objector to Lipman’s resistance to using illustrated materials (Morris, 1992). She and Johana Haynes offer a detailed account of the philosophical importance of picture books (Murris and Haynes, 2012 and Murris, 2016). Peter Worley, head of England’s Philosophy Foundation has written several stimulating books for teachers and students that make no use of IAPC materials. Australia’s Phil Cam has assembled a variety of stories suitable for philosophical use with children. In short, there is a rapidly growing list of resources that show great promise for engaging children in philosophical discussions. (See, for example, DeHaan et al. 1995; Fisher 1998; Keen 1997; Lewis and Chandley 2012; Lone 2012 & 2021; McCall 2009; Murris 1992, 2016; Sprod 2001, and White 2000)[^dehaan-1995][^fisher-1998][^keen-1997][^lewis-2012][^lone-2012][^lone-2012-2][^lone-2021][^mccall-2009][^murris-1992][^sprod-2001][^white-2000]. *Questions: Philosophy for Young People*, a periodical sponsored by the American Philosophical Association’s Pre-College Philosophy Committee, features young people’s writings on special philosophical topics. The first issue (Spring 2001) focused on children’s rights.
    step1: |
尽管 IAPC 的材料仍在使用，但近年来以替代性教学资源和吸引儿童参与哲学讨论的方式大量涌现为标志。多年来，Gareth Matthews 为《思考》（当时 IAPC 的官方期刊）撰写儿童故事评论（尽管 IAPC 自己的教学材料并未使用其他儿童文学）。这启发了 Tom Wartenberg（2009, 2013）在马萨诸塞州曼荷莲学院（Mt. Holyoke College）开发他极为成功的大学预科哲学项目，这是一个围绕经典儿童故事建立的获奖项目。他的网站提供了大量关于儿童文学的材料，旨在为那些希望与儿童一起进行哲学思考的人提供指导。Karen Murris 是早期反对 Lipman 拒绝使用插图材料的人之一（Morris, 1992）。她和 Johana Haynes 对图画书的哲学重要性提供了详细论述（Murris and Haynes, 2012 and Murris, 2016）。英格兰哲学基金会负责人 Peter Worley 为教师和学生撰写了几本引人入胜的著作，这些著作不使用 IAPC 的材料。澳大利亚的 Phil Cam 汇集了各种适合与儿童进行哲学思考的故事。简言之，有大量资源正在迅速增长，显示出吸引儿童参与哲学讨论的巨大前景。（例如，见 DeHaan et al. 1995; Fisher 1998; Keen 1997; Lewis and Chandley 2012; Lone 2012 & 2021; McCall 2009; Murris 1992, 2016; Sprod 2001, and White 2000）[^dehaan-1995][^fisher-1998][^keen-1997][^lewis-2012][^lone-2012][^lone-2012-2][^lone-2021][^mccall-2009][^murris-1992][^sprod-2001][^white-2000]。《问题：青年哲学》是由美国哲学协会大学预科哲学委员会主办的期刊，刊载年轻人关于特定哲学主题的著述。第一期（2001 年春季）以儿童权利为主题。
