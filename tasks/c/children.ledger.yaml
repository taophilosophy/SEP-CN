The educational movement known as Philosophy for Children got its start in the early 1970s with the publication of Matthew Lipman’s philosophical novel for children, *Harry Stottlemeier’s Discovery*. In 1970 *Harry* made its entry into the Montclair Public Schools in New Jersey. By the mid-70s the Institute for the Advancement of Philosophy for Children (IAPC) was formally in place at Montclair State College (now Montclair State University). The media quickly picked up on reports of significant improvements in the reading and critical thinking skills of middle school children who were involved in IAPC programs. Subsequently, IAPC produced materials consisting of Lipman’s children’s novels and, under the leadership of IAPC colleague Ann Margaret Sharp, accompanying teacher workbooks for the entire K-12 curriculum. Thousands of children in New Jersey, across the United States, and even around the world have subsequently been introduced to IAPC educational programs.
