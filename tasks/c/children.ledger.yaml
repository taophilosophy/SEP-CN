For this to work, it must be possible for children in the classroom to engage in sustained philosophical discussion with others. As already noted, Gareth Matthew’s writings provide ample evidence that children are capable of having interesting, if not profound, philosophical thoughts. Less obvious, however, is children’s ability to sustain and develop this with others. Anecdotes of young children spontaneously sharing a philosophical thought with an observant adult are not sufficient. Matthews’ *Dialogues With Children* provides good evidence that children can go well beyond this. Other examples of substantial philosophical conversations of children found in Lone (2012, 2021), McCall (2009), Pritchard (1996, 2022), Shapiro (2012), and Wartenberg (2009, 2013), among many others, should leave little doubt that children have this ability.
    step1: |
要使这一点成立，教室里儿童必须能够与他人进行持续的哲学讨论。如前所述，Gareth Matthews 的著作提供了充足证据，表明儿童能够产生有趣（即使不深刻）的哲学思想。然而，不那么明显的是儿童与他人一起持续并发展这一点的能力。年幼儿童自发地与一位观察细致的成年人分享哲学思想的轶事并不足以证明这一点。Matthews 的《与儿童对话》提供了很好的证据，表明儿童能够远远超出这一点。在 Lone（2012, 2021）、McCall（2009）、Pritchard（1996, 2022）、Shapiro（2012）和 Wartenberg（2009, 2013）等许多著作中找到的儿童实质性哲学对话的其他例子，应能让人毫不怀疑儿童具备这种能力。
