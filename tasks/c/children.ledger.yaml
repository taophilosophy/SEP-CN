However, it might be objected, commonly observable as they might be, more than such anecdotes are needed to show that children are capable of serious philosophical thinking. What is needed is evidence that children are capable of *sustained* philosophical discussion. Matthews (1984) provides illustrations of this, too. For example, meeting with a group of 8–11 year olds, he used the following example to develop a story for discussion:

> Ian (six years old) found to his chagrin that the three children of his parents’ friends monopolized the television; they kept him from watching his favorite program. “Mother,” he asked in frustration, “why is it better for three children to be selfish than one?” (Matthews 1984, 92–3)[^matthews-1984]
    step1: |
然而，也许有人会反驳说，尽管这些轶事颇为常见，但要证明儿童能够进行严肃的哲学思考，还需要比这类轶事更多的东西。所需要的，是儿童能够进行*持续性*哲学讨论的证据。Matthews（1984）也提供了这方面的例证。例如，在与一组 8–11 岁儿童会面时，他利用下面的例子编写了一个供讨论的故事：

> 伊恩（Ian，六岁）懊恼地发现，他父母朋友的三个孩子霸占了电视；他们让他看不成心爱的节目。“妈妈，”他沮丧地问，“为什么三个孩子自私就比一个孩子自私更好呢？”（Matthews 1984, 92–3）[^matthews-1984]
    step2: |
然而，也许有人会反驳：这类轶事虽然俯拾即是，但要证明儿童能够进行严肃的哲学思考，仅靠它们还不够。所需要的是儿童能够进行*持续*哲学讨论的证据。Matthews（1984）也提供了这方面的例证。例如，在与一组 8–11 岁的儿童会面时，他利用下面的例子编写了一个供讨论的故事：

> 伊恩（Ian，六岁）懊恼地发现，他父母朋友的三个孩子霸占了电视；他们让他看不成心爱的节目。“妈妈，”他沮丧地问，“为什么三个孩子自私就比一个孩子自私更好呢？”（Matthews 1984, 92–3）[^matthews-1984]
  - id: 5
    source: |
This generated a lively discussion in which children commented on the inconsiderateness of the three visiting children, the desirability of working out a solution that would satisfy all four children, the importance of respecting people’s rights, and how one might feel if he or she were in Ian’s place. Matthews then posed a possible utilitarian approach: “What about this argument, that if we let the three visitors have their way, three people will be made happy instead of just one?” One reply was that it would not be fair for three people to get what they want at the expense of a fourth. This triggered a discussion of fairness that addressed more specific concerns about the relative ages of the children, whether they are friends, siblings, or strangers—and what types of television programs are involved.
    step1: |
这引发了一场热烈的讨论，孩子们评论了那三个来访孩子的不体谅、找到一个让四个孩子都满意的解决办法的可取性、尊重他人权利的重要性，以及如果自己处在 Ian 的位置会作何感受。Matthews 随后提出了一个可能的功利主义思路：“这个论证怎么样：如果我们让那三个来访者如愿以偿，就会有三个人而非一个人得到快乐？”一个回答是，让三个人以牺牲第四个人为代价来满足自己的愿望是不公平的。这引发了一场关于公平的讨论，涉及更具体的问题：孩子们的相对年龄、他们是否是朋友、兄弟姐妹或陌生人——以及涉及哪些类型的电视节目。
    step2: |
这引发了一场热烈的讨论，孩子们评论了那三个来访孩子的不体谅、找出一个让四个孩子都满意的解决办法的可取性、尊重他人权利的重要性，以及自己若处在 Ian 的位置会作何感受。Matthews 随后提出一个可能的功利主义思路：“这个论证如何：如果我们让那三个来访者如愿以偿，就会有三人而非一人获得快乐？”一个回答是：让三个人以牺牲第四个人为代价来满足自己的愿望，并不公平。这引发了一场关于公平的讨论，涉及更具体的问题：孩子们的相对年龄、他们彼此是朋友、兄弟姐妹还是陌生人——以及涉及哪些类型的电视节目。
