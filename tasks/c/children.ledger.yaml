Facilitating a Philosophy for Children discussion does not mean dominating it; it is important for teachers to allow their students to develop their own ideas. Teachers are not expected to provide, or even have, answers to all the questions. They can share puzzlement with their students, be open to unexpected but suggestive responses to the questions they and their students pose, and take pleasure in observing the exchanges students have with each other. This means shedding the traditional role of teacher as lecturer and answer-giver. Especially for teachers who are uncertain about what this entails, workshops like those offered by IAPC provide a good introduction to the pedagogy of Philosophy for Children. However, there is a growing number of organizations around the world (some of which are mentioned below) also providing assistance for teachers.
