Philosophy for Children encourages children to think *for* themselves at the same time that it encourages them to think *with* others. However, philosophy is often viewed as more a matter of solitary reflection, perhaps involving exchanges between a few other solitary thinkers—something to which the “masses” are neither privy nor attracted. Perhaps many would claim that this is philosophy at its best. Even if this were so (a controversial view), it would not undermine arguments for including philosophy in the K-12 curricula. However esoteric physics and mathematics at their best may be, the schools nevertheless recognize the importance of making these subjects available in some form to all students. Similarly, Philosophy for Children advocates can counter that there should be a place for all students—whether labelled “gifted and talented,” “underachieving,” or “ordinary”—pursuing philosophical questions together.
