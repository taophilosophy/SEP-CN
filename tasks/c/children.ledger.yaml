In the United States, philosophy typically makes its formal entry into the curriculum at the college level. A growing number of high schools offer some introduction to philosophy, often in special literature courses for college bound students. In Europe and many other countries, it is much more common to find philosophy in the high school curriculum. However, philosophy prior to high school seems relatively uncommon around the world. This may suggest that serious philosophical thinking is not for pre-adolescents. At least three reasons might be offered for accepting this view. First, philosophical thinking requires a level of cognitive development that, one may believe, is beyond the reach of most pre-adolescents. Second, especially in the United States, the school curriculum is already crowded; and introducing a subject like philosophy, it may be thought, will distract students from what they need to learn. Third, given that philosophical inquiry raises questions that more often than not resist definitive answers, it may encourage students to become skeptics rather than learners. However, as shall be seen, these reasons can be challenged.
    step1: |
在美国，哲学通常要到大学阶段才正式进入课程。越来越多的中学提供某种哲学入门，往往是为准备升入大学的学生开设的专门文学课程。在欧洲和许多其他国家，中学课程中见到哲学则常见得多。然而，在全世界范围内，中学之前的哲学似乎相对少见。这可能表明，严肃的哲学思考并不适合青春期之前的儿童。人们至少可以提出三条理由来支持这一看法。第一，哲学思考要求一定水平的认知发展，人们可能认为，这超出了大多数青春期前儿童的能力范围。第二，尤其是在美国，学校课程已经十分拥挤；引入哲学这样的科目，人们或许会认为，会使学生从他们需要学习的内容上分心。第三，既然哲学探究提出的问题多半没有确定的答案，它可能使学生变成怀疑论者而非学习者。然而，如下文所见，这些理由是可以被质疑的。
