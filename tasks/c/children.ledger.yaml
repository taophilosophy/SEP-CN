Jean Piaget’s (1933) well-known theory of cognitive development suggests that prior to age 11 or 12, most children are not capable of philosophical thinking. This is because, it holds, prior to this time, children are not capable of “thinking about thinking,” the sort of meta-level thinking that philosophical thinking requires. This level of cognitive development includes analogical reasoning about relationships, such as: “Bicycle is to handlebars as ship is to rudder, with ‘steering mechanism’ being the similar relationship” (Goswami, p. xxi). However, there is a solid body of psychological research that indicates Piaget’s account seriously underestimates children’s cognitive abilities (Astington, 1993; Gopnik, et al., 1999; Gopnik, 2009).
    step1: |
Jean Piaget（1933）著名的认知发展理论认为，在 11 或 12 岁之前，大多数儿童没有能力进行哲学思考。这是因为，该理论认为，在此之前儿童没有能力“对思考进行思考”，即哲学思考所要求的那种元层次思考。这一认知发展水平包括关于各种关系的类比推理，例如：“自行车之于车把，正如船之于舵，其中‘转向装置’是相似的关系”（Goswami, p. xxi）。然而，有大量心理学研究指出，Piaget 的说明严重低估了儿童的认知能力（Astington, 1993; Gopnik, et al., 1999; Gopnik, 2009）。
    step2: |
Jean Piaget（1933）著名的认知发展理论认为，在 11 或 12 岁之前，大多数儿童没有能力进行哲学思考。这是因为，该理论认为，在此之前儿童没有能力“对思考进行思考”，而这正是哲学思考所要求的那种元层次思考。这一认知发展水平包括关于各种关系的类比推理，例如：“自行车之于车把，正如船之于舵，其中‘转向装置’是相似的关系”（Goswami, p. xxi）。然而，有大量心理学研究指出，Piaget 的说明严重低估了儿童的认知能力（Astington, 1993; Gopnik, et al., 1999; Gopnik, 2009）。
