In the mid-1960s, Matthew Lipman became dismayed at the low quality of argumentation employed by presumably well-educated citizens discussing the Vietnam war and society’s ills in general. Convinced that the teaching of logic should begin long before college, he tried to figure out a way to do this that would stimulate the interest of 10–11 year olds. Leaving his secure position of teaching philosophy at Columbia University for an open ended one at Montclair State College, he undertook work on his first children’s novel, *Harry Stottlemeier’s Discovery*. Lipman’s concerns about the level of critical thinking in society in general, and the schools in particular, were not his alone. By the 1970s the hue and cry for teaching critical thinking in the schools was, if not clear, at least loud; and it has continued largely unabated to the present.
    step1: |
在 1960 年代中期，Matthew Lipman 对据称受过良好教育的公民在讨论越南战争和社会种种弊病时所采用的论证的低劣质量感到震惊。他深信逻辑教学应当远在大学之前就开始，于是试图找出一种能激发 10–11 岁儿童兴趣的方法。他放弃了在哥伦比亚大学教授哲学的稳固职位，接受了蒙特克莱尔州立学院一个不固定的职位，开始创作他的第一部儿童小说《哈利·斯托特迈耶的发现》。Lipman 对全社会、特别是学校里批判性思维水平的担忧，并非他一人独有。到 1970 年代，在中学教授批判性思维的呼声即使算不上明确，也至少十分响亮；这种呼声很大程度上一直延续至今。
