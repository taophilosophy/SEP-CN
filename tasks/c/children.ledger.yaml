Lipman was a member of this panel, and it is clear that his novels and teacher’s manuals all strive to meet these objectives. His briefer depiction of critical thinking is that it involves judgments based on criteria, or reasons. Criteria, he says, can be appraised in terms of “megacriteria” such as reliability, relevance, strength, coherence, and consistency (Lipman 1991, p. 119)[^lipman-1991]. Critical thinking, he adds, is characterized as “thinking that (1) facilitates judgment because it (2) relies on criteria, (3) is self-correcting, and (4) is sensitive to context.” (Lipman 1991, p. 116)[^lipman-1991]
