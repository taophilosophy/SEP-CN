What is meant by ‘critical thinking’? Characterizations range in complexity from Robert Ennis’s admirably brief, “reasonable reflective thinking that is focused on deciding what to believe or do” (Ennis 1987)[^ennis-1987] to a complex statement by a group of 46 panelists convened by the American Philosophical Association’s Committee on Pre-College Philosophy to employ the Delphi Method of striving for consensus:

> We understand critical thinking to be purposeful, self-regulatory judgment which results in interpretation, analysis, evaluation, and inference, as well as explanation of the evidential, conceptual, methodological, criteriological, or contextual considerations upon which that judgment is based…. The ideal critical thinking is habitually inquisitive, well-informed, trustful of reason, open-minded, flexible, fair-minded in evaluation, honest in facing personal biases, prudent in making judgments, willing to reconsider, clear about issues, orderly in complex matters, diligent in seeking relevant information, reasonable in the selection of criteria, focused in inquiry, and persistent in seeking results which are as precise as the subject and the circumstances of inquiry permit. (Facione, 1989)
    step1: |
“批判性思维”指的是什么？各种界定在复杂程度上有所不同，从 Robert Ennis 令人钦佩地简洁的“专注于决定相信什么或做什么的合理反思性思维”（Ennis 1987）[^ennis-1987]，到美国哲学协会大学预科哲学委员会召集的、采用德尔菲法力求达成共识的 46 位小组成员的复杂陈述：

> 我们把批判性思维理解为有目的的、自我调节的判断，这种判断导致解释、分析、评估和推理，以及对作为该判断之基础的证据性、概念性、方法论、标准学或语境性考虑的说明……理想的批判性思维是习惯性好奇的、见多识广的、信任理性的、开放包容的、灵活的、评估时公正的、面对个人偏见时诚实的、作出判断时审慎的、愿意重新考虑的、对问题有清晰认识的、处理复杂事务有条理的、勤于寻求相关信息的、选择标准时合理的、专注探究的、并执着寻求尽可能精确——在主题和探究环境允许的范围内——的结果。（Facione, 1989）
    step2: |
“批判性思维”指的是什么？各种界定在复杂程度上各不相同，从 Robert Ennis 那令人赞叹的简洁表述——“专注于决定相信什么或做什么的合理反思性思维”（Ennis 1987）[^ennis-1987]——到美国哲学协会大学预科哲学委员会召集的、采用德尔菲法力求达成共识的 46 位小组成员所作出的复杂陈述：

> 我们把批判性思维理解为有目的的、自我调节的判断，它导致解释、分析、评估和推理，以及对作为该判断之基础的证据性、概念性、方法论、标准学或语境性考虑的说明……理想的批判性思维是：习惯性好奇，见多识广，信任理性，胸襟开阔，灵活变通，评估时公正不阿，面对个人偏见时诚实，作出判断时审慎，愿意重新考虑，对问题有清晰认识，处理复杂事务有条理，勤于寻求相关信息，选择标准时合理，专注于探究，并执着地寻求尽可能精确的结果——只要主题和探究环境允许。（Facione, 1989）
