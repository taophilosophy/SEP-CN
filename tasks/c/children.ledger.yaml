儿童哲学鼓励儿童为自己思考，同时鼓励他们与他人一起思考。然而，哲学常常被视为更多是独自沉思的事情，也许涉及少数几个其他孤独思想家之间的交流——“大众”对此既无缘得知也不感兴趣。也许许多人会声称这是哲学最好的样子。即使如此（这是一个有争议的观点），它也不会削弱把哲学纳入 K-12 课程的理由。无论高深物理学和数学在其最佳状态多么深奥，学校仍然承认以某种形式向所有学生提供这些科目的重要性。同样，儿童哲学倡导者可以反驳说，应当为所有学生——无论被贴上“资优”、“成绩不佳”还是“普通”的标签——提供一个共同追求哲学问题的位置。
