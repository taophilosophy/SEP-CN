Lipman’s hope was that philosophy would acquire a central place in the K-12 curriculum, thus enabling students to develop their critical thinking skills through philosophical questioning. At the same time, he claimed, philosophy can help students make better sense of their educational experiences. By seeking to develop comprehensive perspectives, philosophy attempts to understand connections. A curriculum that divides students’ education into discrete, self-contained disciplines without encouraging philosophical questions about the nature of those disciplines and their relationships to one another invites a fragmented view of education. Lipman’s proposed alternative is described in the next section, which describes the K-12 program developed by the Institute for the Advancement of Philosophy for Children (IAPC) that he and Ann Margaret Sharp founded.
