Even after the passing of IAPC pioneers Matthew Lipman (2010) and Ann Margaret Sharp (2011), now led by Maughn Gregory and others, IAPC retains a strong presence in ICPIC. However, many ICPIC members now have established their own institutional structures and have developed centers, associations, and programs. In North America, there is the North American Association of Community of Inquiry (NAACI), which gathers every other year (years when ICPIC is not meeting). With initial support from the American Philosophical Association’s Pre-College Philosophy Committee, PLATO (Philosophy Learning and Teaching Organization) was formed. Now a non-profit organization supported by the Squire Family Foundation, PLATO sponsors annual meetings, and in 2022 the University of Washington Center for Philosophy for Children and PLATO were joined. PLATO also sponsors two periodicals: *Questions* and the online *Precollege Philosophy and Public Practice*. Australia and New Zealand are organized under the Federation of Australasian Philosophy in Schools Associations (FAPSA), which meets annually and publishes *Journal for Philosophy in Schools* as its official journal (Burgh and Thornton, 2016). In 1992 the Society for the Advancement of Philosophical Enquiry and Reflection in Education (SAPERE) was established in Oxford, England. In 2007 England’s Philosophy Foundation was established (Worley, 2011). Since 2005, the journal *Philosophy and Childhood* has been sponsored by ICPIC and the graduate program in education at the State University of Rio De Janeiro (UERJ). These organizations, along with many other centers and experienced practitioners around the world, continue to support training programs for teachers that enable them to introduce thousands of children to philosophy, both inside and outside regular classrooms.
    step1: |
即使在 IAPC 先驱 Matthew Lipman（2010）和 Ann Margaret Sharp（2011）去世之后，如今由 Maughn Gregory 等人领导的 IAPC 在 ICPIC 中仍然保持着强大的存在。然而，许多 ICPIC 成员现在已经建立了自己的机构结构，并发展出中心、协会和项目。在北美，有北美探究共同体协会（NAACI），它每两年（在 ICPIC 不开会的年份）聚会一次。在美国哲学协会大学预科哲学委员会的最初支持下，成立了 PLATO（哲学学习与教学组织）。PLATO 现在是一个由 Squire 家族基金会支持的非营利组织，主办年度会议，并于 2022 年与华盛顿大学儿童哲学中心合并。PLATO 还主办两份期刊：《问题》和在线期刊《大学预科哲学与公共实践》。澳大利亚和新西兰在澳大拉西亚学校哲学协会联合会（FAPSA）下组织，该联合会每年开会，并出版《学校哲学杂志》作为其官方期刊（Burgh and Thornton, 2016）。1992 年，教育中哲学探究与反思促进协会（SAPERE）在英格兰牛津成立。2007 年，英格兰的哲学基金会成立（Worley, 2011）。自 2005 年以来，期刊《哲学与童年》由 ICPIC 和里约热内卢州立大学（UERJ）教育学研究生项目主办。这些组织，连同世界各地许多其他中心和经验丰富的实践者，继续支持教师培训项目，使他们能够在正规课堂内外向成千上万名儿童介绍哲学。
