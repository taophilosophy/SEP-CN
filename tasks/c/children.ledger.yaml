Short of the ambitious program Lipman and his IAPC colleagues had in mind for the schools, there are more modest, but worthwhile, ways of bringing philosophical inquiry into the already existing disciplinary structure in the schools. Teachers can invite their students to reflect on philosophical aspects of their subjects of study. At the same time they study history, students can take some time to ask questions about the extent to which historical accounts can be objective—and questions about what ‘objectivity’ might mean, and why it is or is not important to seek it. Similar questions can be asked about the natural and social sciences, including questions about the extent to which science is, or ought to be, “value-free”. In fact, if room for such questions is not encouraged, one might well ask to what extent critical thinking itself is encouraged.
    step1: |
除了 Lipman 和他的 IAPC 同事为学校所设想的雄心勃勃的项目之外，还有更温和但值得做的方式，把哲学探究引入学校已有的学科结构。教师可以邀请学生反思他们所学学科的哲学方面。在学习历史的同时，学生可以花些时间提问：历史叙述在多大程度上可以是客观的——以及“客观性”可能意味着什么，为什么寻求它重要或不重要。关于自然科学和社会科学也可以提出类似的问题，包括：科学在多大程度上是、或应当是无涉价值的。事实上，如果不鼓励为这类问题留出空间，那么人们很可能会问：批判性思维本身又在多大程度上受到鼓励。
