      然而，并非所有人都赞同这种关于审美与艺术彼此分离的自由主张[^note-7]。倘若艺术不以具有审美价值为鹄的，那么有人或许会问：是什么把它与非艺术区分开来？在这一点上支持哪种立场，很可能最终变成一个关于定义的问题。若想依据审美经验来定义艺术，该问题便有了明确的答案：观念艺术简直不能被视为一种艺术。不过，那种立场的不利之处，是一整套棘手的关注，涉及像自然或人这样的东西——它们尽管招来审美经验，却几乎算不上艺术。如果一个人被这些担忧打动，又看不出任何决定性的哲学理由来维持审美观点，那么几乎没有什么能阻挡一种不必然审美的艺术观念。于是，人们或许可以把审美价值视为**一种**艺术价值，与道德、宗教、政治、历史、金融价值并列，有些艺术作品具有，有些则不具有。[^note-8]
