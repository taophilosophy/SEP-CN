      The most fundamentally revisionary feature of conceptual art is the way in which it proclaims itself to be an art of the mind rather than the senses: it rejects traditional artistic media because it locates the artwork at the level of *ideas* rather than that of *objects*. Because more weight tends to given to creative process than physical material, and because art should be about intellectual inquiry and reflection rather than beauty and aesthetic pleasure (as traditionally conceived), the identity of the work of art is said to lie in the idea at the heart of the piece in question. In the words of Kosuth, ‘[t]he actual works of art are ideas’ (Lippard 1973, 25)[^lippard-1973]. For conceptual art, ‘the idea or concept is the most important aspect of the work’ (LeWitt 1967, 166). Art is ‘de-materialised’, and in this sense held to be prior to its materialisation in any given object.
    step1: |-
      观念艺术最具根本修正性的特征，是它宣称自己是一种心灵的艺术而非感官的艺术：它拒斥传统艺术媒介，因为它把艺术作品定位在**观念**（*ideas*）层面而非**对象**（*objects*）层面。由于人们往往更重视创作过程而非物质材料，又由于艺术应当关乎理智的探询与反思，而非美与审美愉悦（如传统所理解的），艺术作品的身份据说就在于所论作品核心处的观念。用科苏斯的话说，“真正的艺术作品就是观念”（Lippard 1973, 25）[^lippard-1973]。对观念艺术而言，“观念或概念是作品最重要的方面”（LeWitt 1967, 166）。艺术是“去物质化”的，在这个意义上被视为先于其在任何给定对象中的物质化。
    step2: |-
