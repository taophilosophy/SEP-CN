      However, not everyone has endorsed such a liberal view about the separation between the aesthetic and the artistic[^note-7]. If art does not aim at having aesthetic value, what, one might argue, will set it apart from non-art? Which view one decides to favour on this point may well end up being an issue about definition. If one wishes to define art in terms of aesthetic experience, the question finds a clear-cut answer, namely that conceptual art simply cannot be considered a kind of art. The down-side of that position is, however, a whole set of difficult concerns to do with things, such as nature or persons, that hardly qualify as art even though they invite aesthetic experiences. If one is impressed by these worries and cannot see any decisive philosophical reason to uphold the aesthetic view, there is little, if anything, to block a conception of art which is not necessarily aesthetic. One may, then, think of aesthetic value as *one* kind of artistic value that, alongside with moral, religious, political, historical and financial value, some artworks have and others do not.[^note-8]
    step1: |-
      然而，并非每个人都赞同这种关于审美与艺术相分离的自由观点[^note-7]。如果艺术不以具有审美价值为目标，那么有人或许会问，是什么把它与非艺术区分开来？在这一点上决定支持哪种观点，很可能最终成为一个关于定义的问题。如果人们希望依据审美经验来定义艺术，那么该问题有一个明确的答案，即观念艺术简直不能被视为一种艺术。然而，那种立场的不利之处在于一整套困难的关注，它们涉及诸如自然或人这样的东西——这些东西几乎算不上艺术，尽管它们唤起审美经验。如果人们被这些担忧所打动，又看不到任何决定性的哲学理由来坚持审美观点，那么几乎没有什么能阻挡一种不必审美的艺术观念。于是，人们或许可以把审美价值视为**一种**艺术价值，它与道德、宗教、政治、历史与金融价值并列，有些艺术作品具有，有些则不具有。[^note-8]
