      In the first instance, conceptual art drives us to review the common assumption that appropriate appreciation and engagement with an artwork must involve a direct first-hand experience of that piece itself. The idea here, to use Frank Sibley’s words, is that

      > [p]eople have to *see* the grace or unity of a work, *hear* the plaintiveness or frenzy in the music, *notice* the gaudiness of colour scheme, *feel* the power of a novel, its mood, or its uncertainty of tone. They may be struck by these qualities at once, or they may come to perceive them only after repeated viewings, hearings, or readings, and with the help of critics. But unless they do perceive them for themselves, aesthetic enjoyment, appreciation, and judgement are beyond them… the crucial thing is to see, hear, or feel. (Sibley 1965, 137)[^sibley-1965].
    step1: |-
      首先，观念艺术促使我们重新审查这样一个常见假设：对艺术作品的适当欣赏与参与，必须包括对该作品本身的一次直接的第一手经验。这里的思想，用弗兰克·西布利（Frank Sibley）的话说，是

      > 人们必须**看**到一件作品的优雅或统一，**听**到音乐中的哀婉或狂热，**注意**到配色方案的俗艳，**感受**到一部小说的力量、它的基调，或它音调的犹疑。他们可能立刻被这些性质打动，也可能只有经过反复观看、聆听或阅读，并在批评家的帮助下，才逐渐感知到它们。但除非他们亲自感知到这些性质，否则审美享受、欣赏与判断都与他们无缘……关键就在于去**看**、**听**或**感受**。（Sibley 1965, 137）[^sibley-1965]
    step2: |-
      首先，观念艺术驱使我们重新检讨那个常见的假定：对一件艺术作品的适当欣赏与参与，必定包含对那件作品本身的一次直接的第一手经验。这里的观念，借用弗兰克·西布利（Frank Sibley）的话来说，就是

      > 人们必须**看到**一件作品的优雅或统一，**听到**音乐中的哀婉或狂乱，**注意到**配色方案的俗艳，**感受到**一部小说的力量、它的基调，或它音调的犹疑。他们可能一下子就被这些性质击中，也可能要经过反复的观看、聆听或阅读，并在批评家的帮助下，才渐渐感知到它们。但除非他们亲自感知到这些性质，否则审美享受、欣赏与判断都与他们无缘……关键就在于去看、去听、去感受。（Sibley 1965, 137）[^sibley-1965]
