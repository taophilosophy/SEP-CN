      On a strict historical reading, the expression ‘conceptual art’ refers to the artistic movement that reached its pinnacle between 1966 and 1972 (Lippard 1973)[^lippard-1973].[^note-1] Among its most famous adherents at its early stage we find artists such as Joseph Kosuth, Robert Morris, Joseph Beuys, Adrian Piper, to name but a few. What unites the conceptual art of this period is the absorption of the lessons learnt from other twentieth-century art movements such as Dadaism, Surrealism, Suprematism, Abstract Expressionism and the Fluxus group, together with the ambition once and for all to ‘free’ art of the Modernist paradigm. Most importantly, perhaps, conceptual art of the 1960s and 70s sought to overcome a backdrop against which art’s principal aim is to produce something beautiful or aesthetically pleasing. Art, early conceptual artists held, is redundant if it does not make us think. In their belief that most artistic institutions were not conducive to reflection but merely promoted a conservative and even consumerist conception of art and artists, conceptual artists in the mid-1960s to the early 1970s instead tried to encourage a revisionary understanding of art, the artist, and artistic experience.
    step1: |-
      在严格的历史解读下，“观念艺术”这个表述指的是在 1966 年到 1972 年间达到顶点的艺术运动（Lippard 1973）[^lippard-1973]。[^note-1] 在其早期阶段最著名的拥护者中，我们发现约瑟夫·科苏斯、罗伯特·莫里斯、约瑟夫·博伊斯、阿德里安·派珀等艺术家，仅举几例。将这一时期观念艺术统一起来的，是对从二十世纪其他艺术运动——如达达主义、超现实主义、至上主义、抽象表现主义和激浪派——所学到的教训的吸收，以及一劳永逸地将艺术“解放”出现代主义范式的抱负。也许最重要的是，20 世纪 60 和 70 年代的观念艺术寻求克服这样一种背景，在这种背景下艺术的主要目标是生产出美的或令人愉悦的东西。早期观念艺术家主张，艺术如果不能使我们思考，就是多余的。由于他们相信大多数艺术机构不利于反思，而只是促进一种保守的、甚至消费主义的艺术和艺术家观念，20 世纪 60 年代中期到 70 年代初的观念艺术家反而试图鼓励一种修正性的艺术、艺术家和艺术经验的理解。
    step2: |-
      按严格的历史读法，“观念艺术”一词指的是在 1966 年至 1972 年间达到顶峰的艺 术运动（Lippard 1973）[^lippard-1973]。[^note-1] 其早期阶段最著名的拥护者中有约瑟夫·科苏斯（Joseph Kosuth）、罗伯特·莫里斯（Robert Morris）、约瑟夫·博伊斯（Joseph Beuys）、阿德里安·派珀（Adrian Piper）等艺术家，仅举数例。将这一时期观念艺术联结在一起的，是对达达主义、超现实主义、至上主义、抽象表现主义与激浪派等二十世纪其他艺术运动所吸取的教训的消化，再加上一劳永逸地把艺术“解放”出现代主义范式的抱负。或许最重要的是，20 世纪 60、70 年代的观念艺术力图克服这样一种背景：在该背景下，艺术的主要目标是创造出美的或令人愉悦的东西。早期观念艺术家主张，艺术如果不能使我们思考，便是多余的。由于他们相信大多数艺术机构不利于反思，而仅仅助长一种保守、甚至消费主义的艺术与艺术家观念，20 世纪 60 年代中期至 70 年代初的观念艺术家转而试图倡导一种修正性的艺术、艺术家与艺术经验理解。
