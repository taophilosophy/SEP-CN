      As a direct result of its examination of what may properly qualify as art, and of the markedly broad conception of what may constitute an art object resulting from this examination, conceptual art tends to reject traditional artistic media such as conventional painting or sculpture. Instead, it has found itself drawn to alternative means of expression, including performances, photography, films, videos, events, bodies, new ready-mades and new mixed media. In a nutshell, nothing can be ruled out in principle for use as possible artistic media, as can be seen, for example, in Richard Long’s photograph of a line made in the grass by walking[^note-2], Bruce Nauman’s nine minute film of the artist himself playing one note on a violin whilst walking around in his studio[^note-3], Janine Antoni’s use of chocolate and soap, Marina Abramovic’s display of an array of everyday objects, including knives, torches and feathers, which the audience is invited to apply directly on to the artist’s body, and Piero Manzoni’s act of signing a woman’s arm[^note-4].
    step1: |-
      由于观念艺术对什么可以适当算作艺术的考察，以及由此考察所产生的、关于什么可构成一件艺术对象的显著宽泛的观念，它倾向于拒斥传统的艺术媒介，如传统的绘画或雕塑。相反，它发现自己被吸引到替代性的表达手段，包括表演、摄影、电影、录像、事件、身体、新的现成品与新的混合媒介。简言之，原则上没有任何东西可以被排除在可能的艺术媒介之外，例如理查德·朗（Richard Long）关于一条在草地上行走而成的线的照片[^note-2]、布鲁斯·瑙曼（Bruce Nauman）那部艺术家本人在工作室中一边踱步一边用小提琴拉一个音、长达九分钟的电影[^note-3]、雅尼娜·安东尼（Janine Antoni）对巧克力和肥皂的使用、玛丽娜·阿布拉莫维奇（Marina Abramovic）展示的一批日常物品——包括刀、手电筒与羽毛——观众被邀请将这些物品直接应用于艺术家身体上，以及皮耶罗·曼佐尼（Piero Manzoni）在一位妇女手臂上签名的行为[^note-4]。
    step2: |-
      观念艺术既考察什么可适当算作艺术，又因此得出一种显著宽泛的、关于什么可构成一件艺术对象的观念，这两者的直接结果是：它倾向于拒斥传统的艺术媒介，如通常所说的绘画或雕塑。相反，它发现自己被吸引到一些替代性的表达手段，包括表演、摄影、电影、录像、事件、身体、新的现成品与新的混合媒介。简言之，原则上没有什么东西能被排除在可能的艺术媒介之外。例如理查德·朗（Richard Long）拍摄的一张在草地上行走而成之线的照片[^note-2]、布鲁斯·瑙曼（Bruce Nauman）那部艺术家本人在工作室里边走边用提琴拉出一个单音、长达九分钟的电影[^note-3]、雅尼娜·安东尼（Janine Antoni）对巧克力与肥皂的运用、玛丽娜·阿布拉莫维奇（Marina Abramovic）展示的一批日常物件——刀、手电筒、羽毛等——观众被邀将这些物件直接贴在艺术家身上，以及皮耶罗·曼佐尼（Piero Manzoni）在一位妇女手臂上签名的举动[^note-4]，都是明证。
