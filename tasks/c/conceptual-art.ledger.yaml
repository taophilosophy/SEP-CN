      Clearly, conceptual art is not the first kind of art to raise ontological concerns of this kind. After all, music and literary art, be it traditional or *avant*-*garde*, hardly present straightforward cases either. The question of what exactly constitutes, say, a novel or a musical work have been widely discussed for some time (e.g. Davies 2001; Ingarden 1973; Wollheim 1980)[^davies-2001][^ingarden-1973][^wollheim-1980] Building on the suggestion that artworks such as musical pieces and literary works are best understood in terms of universals or ‘types’, one view that has been widely discussed in the last two decades or so is based on the idea that not only musical and literary artworks, but *all* artworks, are types. More specifically, they are to be conceived of as ‘event- or action-types’ (Currie 1988)[^currie-1988]. According to this theory, the artwork is thus not the material thing itself but, rather, the way in which the artist arrived at the underlying structure shared by all instances or performances of that work.
    step1: |-
      显然，观念艺术并非第一种引发这类本体论关注的艺术。毕竟，音乐与文学艺术，无论传统还是**先锋派**（*avant*-*garde*），也几乎不是直截了当的案例。什么确切地构成，比如说，一部小说或一件音乐作品，这一问题已被广泛讨论了一段时间（例如 Davies 2001；Ingarden 1973；Wollheim 1980）[^davies-2001][^ingarden-1973][^wollheim-1980]。基于音乐作品与文学作品等艺术作品最好依共相或“类型”来理解这一建议，一个在过去二十年左右被广泛讨论的观点基于这样的观念：不仅音乐与文学艺术作品，而且**一切**艺术作品，都是类型。更具体地说，它们应被设想为“事件类型或行动类型”（Currie 1988）[^currie-1988]。按照这一理论，艺术作品因而不是物质事物本身，而是艺术家达到为该作品所有实例或表演所共享的底层结构的那种方式。
