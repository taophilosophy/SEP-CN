      The first difficulty that a philosophical investigation of conceptual art encounters has to do with identifying the object of examination, or at least the category of objects under scrutiny. In the words of the art historian Paul Wood,

      > [i]t is not at all clear where the boundaries of ‘conceptual art’ are to be drawn, which artists and which works to include. Looked at in one way, conceptual art gets to be like Lewis Carroll’s Cheshire cat, dissolving away until nothing is left but a grin: a handful of works made over a few short years by a small number of artists… Then again, regarded under a different aspect, conceptual art can seem like nothing less than the hinge around which the past turned into the present. (Wood 2002, 6)[^wood-2002]
    step1: |-
      哲学对观念艺术的研究所遇到的第一个困难与确定考察对象，或至少确定所审查对象的范畴有关。用艺术史家保罗·伍德的话说：

      > 一点也不清楚“观念艺术”的边界应画在哪里，应包含哪些艺术家、哪些作品。以一种方式看，观念艺术变得像刘易斯·卡罗尔的柴郡猫，消融掉直到什么也不剩下，只剩一个咧嘴笑：一小批艺术家在短短几年中创作的少量作品……再者，从另一个角度看，观念艺术似乎正是过去转变为现在的枢纽。（Wood 2002, 6）[^wood-2002]
    step2: |-
      哲学对观念艺术的考察所遇到的第一个困难，与确定考察对象、或至少确定所审视对象的范畴有关。用艺术史家保罗·伍德（Paul Wood）的话说：

      > 根本不清楚“观念艺术”的边界应当画在哪里，应当包括哪些艺术家、哪些作品。从一个角度看，观念艺术变得像刘易斯·卡罗尔（Lewis Carroll）的柴郡猫，渐渐消融，直到只剩下一副咧嘴的笑容：一小批艺术家在短短几年里创作的屈指可数的作品……然而，换一个角度看，观念艺术又似乎正是过去转向现在的枢纽。（Wood 2002, 6）[^wood-2002]
