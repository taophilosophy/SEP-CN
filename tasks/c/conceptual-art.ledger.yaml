      Picking up on this concern, Arthur Danto has famously suggested that it is in fact a non-manifest relation that makes something an artwork rather than an observable property (Danto 1981)[^danto-1981]. That is to say, artworks acquire that status in virtue of their relations to the historical and social setting constituted by the practices and conventions of art, our artistic heritage, the intentions of artists, and so on — the ‘artworld’ (see also Dickie 1974)[^dickie-1974]. The general idea here is that artworks are generated within a social and artistic context, and so being an artwork is a function of certain social relations. Conceptual art reinforces the idea that art and non-art can be perceptually indistinguishable and so cannot be marked off from each other by ‘exhibited’ properties alone.[^note-5]
    step1: |-
      针对这一关注，阿瑟·丹托（Arthur Danto）曾著名地提出，使某物成为一件艺术作品的实际上是一种非显现的关系，而非一种可观察的属性（Danto 1981）[^danto-1981]。也就是说，艺术作品之所以获得那种地位，是由于它们与由艺术实践与惯例、我们的艺术遗产、艺术家的意图等所构成的历史与社会境况的关系——“艺术世界”（另见 Dickie 1974）[^dickie-1974]。这里的总体观念是：艺术作品产生于一个社会与艺术语境之中，因此成为一件艺术作品是某些社会关系的函项。观念艺术强化了这样的观念：艺术与非艺术可以在知觉上难以区分，因而不能仅凭“显现的”属性相互区分开来。[^note-5]
    step2: |-
      针对这一担忧，阿瑟·丹托（Arthur Danto）曾提出一个著名论断：使某物成为艺术作品的，实际上是一种非显现的关系，而非某种可观察的属性（Danto 1981）[^danto-1981]。这就是说，艺术作品之所以获得这种地位，是由于它们与那个由艺术实践与惯例、我们的艺术遗产、艺术家的意图等构成的历史与社会境况之间的关系——“艺术世界”（另见 Dickie 1974）[^dickie-1974]。此处的一般观念是：艺术作品生发于一个社会与艺术的语境之中，因此，成为一件艺术作品乃是某些社会关系的函项。观念艺术强化了这一点：艺术与非艺术在知觉上可能难以区分，因而不能仅仅凭借“显现的”属性来把二者区分开。[^note-5]
