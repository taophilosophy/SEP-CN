      A more promising line of enquiry has been developed by David Davies. Taking his cue from the problems posed by conceptual art, Davies argues that a unified definition of art can only be found if we think of art primarily in terms of the creative process or series of actions resulting in a material thing or other ‘focus of appreciation’. In that sense, the artwork is primarily identified with the intentional acts through which it comes into being rather than with the end-product of that process (Davies 2004)[^davies-2004]. Art, on this view, is better understood as a kind of performance than as a manifest object. By shifting the focus of our attention in this way, we can overcome many of the difficulties associated with defining art, most notably that of its heterogeneity. It may be, then, that the most enduring lesson to be learnt from conceptual art with regards to the definition of art is not so much that a conceptual analysis of art is completely unattainable, as that we simply have been looking in the wrong place.
    step1: |-
      大卫·戴维斯（David Davies）提出了一条更有前景的探究路线。他受观念艺术所提出的问题启发，主张：只有当我们主要从导致一件物质事物或其他“欣赏的焦点”的创作过程或系列行动来思考艺术时，才能找到艺术的统一定义。在这个意义上，艺术作品主要与其得以产生的意向性行为相等同，而非与该过程的最终产物相等同（Davies 2004）[^davies-2004]。按照这一观点，艺术更宜被理解为一种表演，而非一件显现的对象。通过以这种方式转移我们关注的焦点，我们可以克服许多与定义艺术相关的困难，尤其是其异质性带来的困难。那么，从观念艺术中可学到的、关于艺术定义的最持久的教训，或许与其说是对艺术的观念分析完全无法实现，不如说我们只是找错了地方。
    step2: |-
      大卫·戴维斯（David Davies）开辟了一条更有希望的探究路线。他从观念艺术所提出的问题出发，主张：只有当我们主要从导致一件物质事物或某个其他“欣赏焦点”的创作过程或系列行动来思考艺术时，才能获得艺术的统一定义。就此而言，艺术作品主要与其得以产生的那些意向性行为相等同，而不是与该过程的最终产物相等同（Davies 2004）[^davies-2004]。照此看法，艺术更宜被理解为一种表演，而非一件显现的对象。通过这样转移我们注意力的焦点，我们可以克服许多与定义艺术相关的困难，最突出的是艺术异质性所带来的困难。那么，就艺术定义而言，从观念艺术那里学到的最持久的教训，或许与其说是对艺术的观念分析根本不可企及，不如说我们只是找错了地方。
