      Perhaps the most pressing question, however, has to do with the extent to which we are to take conceptual art’s claim of de-materialisation seriously. Does the de-materialisation of such art not suggest that there is not only a rejection of traditional artistic media in conceptual art, but an outright refutation of artistic media in general? One possible way of making sense of this idea is with a distinction outlined by Davies, namely that between *physical medium* and *vehicular medium* (Davies 2004)[^davies-2004]. Crucially, a vehicular medium is said to incorporate not only physical objects (such as paintings and sculptures, say) but also actions, events, and generally more complex entities. In Davies’ words, ‘[t]he product of an artist’s manipulation of a vehicular medium will then be the *vehicle* whereby a particular artistic statement is articulated… The vehicle may, as in the case of Picasso’s *Guernica*, be a physical object, or, as in the case of Coleridge’s *Kubla Kahn*, a linguistic structure-type, or, as arguably in the case of Duchamp’s *Fountain,* an action of a particular kind.’ (Davies 2004, 59)[^davies-2004]. Adhering to this vehicular medium in art, may then at least equip philosophers with a notion that can deflate the concern of whether conceptual art, by rejecting physical media, denies the need for *all* artistic media.
    step1: |-
      然而，或许最紧迫的问题与我们在多大程度上认真对待观念艺术的去物质化主张有关。这种艺术的去物质化，难道不意味着观念艺术不仅拒斥传统艺术媒介，而且干脆否弃了一般意义上的艺术媒介吗？理解这一观念的一种可能方式，是借助戴维斯所勾勒的区分，即**物理媒介**（*physical medium*）与**载体媒介**（*vehicular medium*）之间的区分（Davies 2004）[^davies-2004]。关键在于，载体媒介据说不仅包含物理对象（比如说绘画和雕塑），还包含行动、事件，以及一般而言更复杂的实体。用戴维斯的话说，“艺术家对一种载体媒介的操纵的产物，将是借以表达某一特定艺术陈述的**载体**……这一载体，如毕加索（Picasso）的 *Guernica* 的情形那样，可以是一件物理对象；或者，如柯勒律治（Coleridge）的 *Kubla Kahn* 的情形那样，可以是一种语言结构类型；或者，如杜尚（Duchamp）的 *Fountain* 的情形那样，可以是一种特定类型的行动。”（Davies 2004, 59）[^davies-2004]。坚持艺术中的这种载体媒介，至少可以使哲学家获得一种能够消解如下关注的概念：观念艺术通过拒斥物理媒介，是否否认了对**一切**艺术媒介的需要。
    step2: |-
