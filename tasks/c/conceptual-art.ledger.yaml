      There have been no shortages of attempts to define art in this manner. Most prominently perhaps, it has been suggested that art ought to be defined in terms of its aesthetic character, so that, roughly, *x* is an artwork if and only if *x* gives rise to an aesthetic experience (e.g., Beardsley 1958). Notwithstanding the difficulties that this particular suggestion entails (we shall return to this in §3.3), the advent of a kind of art that is as profoundly revisionary and difficult to classify as conceptual art renders the attempt to provide a general definition applicable to *all* art particularly complex. It is no coincidence, then, that a neo-Wittgensteinian approach came to dominate the philosophy of art in the late 1950s and 1960s. Drawing support from anti-essentialist theories of language, it was suggested that art was numbered among the various concepts that are, by their very nature, ‘essentially contested’ (Gallie 1948; see also Weitz 1956)[^weitz-1956]. That is to say, some concepts – such as that pertaining to sports, for example– simply do not allow for definitions in terms of necessary and sufficient conditions, and art is best as understood as one of them. In the words of Morris Weitz, art may be

      > an open concept. New conditions have constantly arisen and will undoubtedly constantly arise; new art forms, new movements will emerge, which will demand decisions on the part of those interested… as to whether the concept should be extended or not. (Weitz 1956, 32)[^weitz-1956]
    step1: |-
      以这种方式定义艺术的尝试不乏其例。或许最突出的是，有人主张艺术应当根据其审美特性来定义，即大致而言，*x* 是一件艺术作品当且仅当 *x* 引起一种审美经验（例如 Beardsley 1958）。尽管这一特定主张带来种种困难（我们将在 §3.3 回到这一点），但一种像观念艺术这样深刻修正、难以归类的艺术的出现，使得提供一种适用于**一切**艺术的普遍定义的尝试变得尤为复杂。因此，新维特根斯坦主义进路在二十世纪五十年代末和六十年代主导艺术哲学，绝非巧合。它从反本质主义的语言理论中汲取支持，主张艺术属于各种就其本性而言“本质上可争议的”概念之列（Gallie 1948；另见 Weitz 1956）[^weitz-1956]。也就是说，有些概念——例如与体育相关的概念——根本不允许用必要且充分条件来定义，而艺术最好被理解为其中之一。用莫里斯·韦茨（Morris Weitz）的话说，艺术可以是

      > 一个开放的概念。新的条件不断出现，而且无疑将继续不断出现；新的艺术形式、新的运动将涌现，这将要求相关人士作出决定……即这一概念是否应当扩展。（Weitz 1956, 32）[^weitz-1956]
    step2: |-
      以这种方式给艺术下定义的尝试从不匮乏。最显眼的或许是：有人提出，艺术应当依据其审美品格来定义，即粗略地说，*x* 是一件艺术作品，当且仅当 *x* 引起一种审美经验（如 Beardsley 1958）。尽管这一特定主张有其困难（我们稍后将在 §3.3 再回到这一点），但像观念艺术这样一种深刻修正、难以归类的艺术的出现，使得提供一条适用于**所有**艺术的普遍定义的尝试变得尤为复杂。于是，新维特根斯坦主义进路在二十世纪五十年代末至六十年代主导艺术哲学，绝非偶然。它从反本质主义的语言理论汲取支持，主张艺术属于某些就其本性而言“本质上可争议”的概念（Gallie 1948；另见 Weitz 1956）[^weitz-1956]。也就是说，有些概念——譬如与体育相关的概念——根本无法用必要且充分条件来定义，而艺术最好被理解为其中之一。用莫里斯·韦茨（Morris Weitz）的话说，艺术或许是

