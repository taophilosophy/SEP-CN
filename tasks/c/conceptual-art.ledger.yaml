      然而，观念艺术最显著的特征之一，在于它着手以语义再现取代描绘性再现，因而不以传统意义上的审美经验为优先。观念艺术被意图为一种心灵的艺术：它通常诉诸理智之事，并强调艺术的**认知的**而非**审美的**价值。用蒂莫西·宾克利（Timothy Binkley）的话说，传统美学专注于“感知实体”，而这“使美学得以颂扬并考察‘艺术作品’，同时几乎完全把注意力从我们称之为‘艺术’的那种复杂文化活动的无数其他方面移开”（Binkley 1977, 271）[^binkley-1977]。
