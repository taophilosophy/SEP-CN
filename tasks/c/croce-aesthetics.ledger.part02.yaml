      在二十世纪初的意大利，流行的哲学或“世界观”并非如英格兰那样是上文已提及的后黑格尔唯心主义，而是与孔德、马赫等人物相联系的早期经验主义实证主义形式。部分出于对这些观点的机械论与物质崇拜的厌恶，部分出于他对黑格尔哲学（既有肯定也有否定）的反应，克罗齐信奉他所谓的“绝对唯心主义”或“绝对历史主义”。克罗齐哲学中的一个恒常主题是：他在“先验主义”的斯库拉与“感觉主义”的卡律布狄斯之间寻求一条道路，这两者就大多数目的而言可以被视为分别与理性主义和经验主义共外延。对克罗齐来说，它们归根到底是同一个错误——把日常经验抽象为某种无法被实际经验到的东西。先验主义把感觉世界视为不真实的、混乱的或次等的，而正是哲学家坐在扶手椅上，以*先验*方式反思世界，才看到世界之外的实在。另一方面，克罗齐所谓的“感觉主义”只把颜色等瞬间印象视为存在，其余的东西在某种意义上只是由它们所作出的纯粹逻辑构造，没有独立的实在。正确的道路是克罗齐所谓的*内在主义*：唯有被经历的人类经验，具体地、不加还原地发生，才是实在的。因此，一切名副其实的哲学都是精神（或心灵）哲学，并且与历史不可分离。克罗齐所偏好的称谓——“绝对唯心主义”或“绝对历史主义”——即由此而来。
