Nuclear transfer can also be done using a donor cell from an embryo instead of from an organism after birth. Cloning mammals using embryonic cells has been successful since the mid-1980s (for a history of cloning, see Wilmut et al. 2001)[^wilmut-2001]. Another technique to produce genetically identical offspring or clones is embryo twinning or embryo splitting, in which an early embryo is split *in vitro* so that both parts, when implanted in the uterus, can develop into individual organisms genetically identical to each other. This process occurs naturally with identical twins.
    step1: |
    step2: |
核移植也可以使用来自胚胎、而非出生后机体的供体细胞。使用胚胎细胞克隆哺乳动物自 20 世纪 80 年代中期以来已获成功（克隆史见 Wilmut 等 2001）[^wilmut-2001]。另一种产生基因相同后代或克隆体的技术是胚胎孪生或胚胎分裂：早期胚胎在 *in vitro* 条件下被一分为二，两部分植入子宫后都可发育成彼此基因相同的个体。同卵双胞胎的自然发生即属此过程。
核移植也可以使用胚胎供体细胞，而不必取自出生后的机体。用胚胎细胞克隆哺乳动物自 20 世纪 80 年代中期起即已成功（克隆史参见 Wilmut 等，2001）[^wilmut-2001]。另一种产生基因相同后代（即克隆体）的技术是胚胎孪生或胚胎分裂：将早期胚胎在 *in vitro* 条件下分为两半，两部分植入子宫后各能发育成彼此基因相同的个体。同卵双胞胎的形成就属于这一自然过程。
