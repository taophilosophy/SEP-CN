These concerns have been challenged on several grounds. Some believe that it is plausible that, through adequate information, we could largely correct mistaken beliefs about the link between genetic and personal identity, and thus reduce the risk of problematic expectations toward the clone (Harris 1997, 2004; Tooley 1998, 84–5; Brock 1998, Pence 1998)[^brock-1998][^harris-1997][^pence-1998][^tooley-1998]. Brock (1998) and Buchanan et al. (2000, 198) have argued that even if people persist in these mistaken beliefs and their attitudes or actions lead to cloned individuals *believing* they do not have an open future, this does not imply that the clone’s right to ignorance about one’s personal future or to an open future has *actually* been violated. Pence (1998, 138) has argued that having high expectations, even if based on false beliefs, is not necessarily a bad thing. Parents with high expectations often give their children the best chances to lead a happy and successful life. Brock (2002, 316) has argued that parents now also constantly restrict the array of available life plans open to their children, for example, by selecting their school or by raising them according to certain values. Though this may somewhat restrict the child’s autonomy, there will always be enough decisions to take for the child to be autonomous, and to realize this. According to Brock, it is not clear why this should be different in the case of cloning. He also points out that there may be advantages to being a ‘delayed twin’ (154). For example, one may acquire knowledge about the progenitor’s medical history and use this knowledge to live longer, or to increase one’s autonomy. One could, for example, use the information to reduce the risk of getting the disease or condition, or to at least postpone its onset, by behavioral changes, an appropriate diet and/or preventive medication. This would not be possible, however, if the disease is untreatable (for example, Huntington’s Disease). Harris (2004, Ch.1) has stressed that information about one’s genetic predispositions for certain diseases would also allow one to take better informed reproductive decisions. Cloning would allow us to give our child a ‘tried and tested’ genome, not one created by the genetic lottery of sexual reproduction and the random combination of chromosomes.
    step1: |
    step2: |
  - id: 45
