有人认为，胚胎从受孕那一刻起就具有与普通成年人同等的道德地位，即同一套基本道德权利、主张或利益。这种观点有时表述为：早期胚胎是一个人。按此观点，为获取干细胞而制造并杀死胚胎是严重的道德错误，即使能拯救许多生命也不被允许（Deckers 2007）[^deckers-2007]。另一些人认为，早期胚胎不过是一团细胞或人体组织，没有任何道德地位。持此立场者的一种常见看法是：鉴于其可观的潜力，胚胎干细胞研究与克隆研究是道德命令（Devolder & Savulescu 2006）[^devolder-2006]。许多人持介于两种对立立场之间的观点。例如，他们认为早期胚胎应得到尊重，因为它具有中间道德地位：低于人，但高于普通体细胞。持此立场者中流行的一种看法是，把胚胎用于研究有时可以是正当的。通常的论证是，尊重的体现方式是：只把胚胎用于无法以争议更小的手段完成的极重要研究，并以遗憾或失落之感承认对胚胎的使用（Robertson 1995; Steinbock 2001）[^robertson-1995][^steinbock-2001]。持中间道德地位观点者的一种常见看法是：利用废弃的 IVF 胚胎获取干细胞，与我们欠胚胎的尊重相容；而制造并使用克隆胚胎则不然。支撑这一看法的论点是：与 IVF 胚胎不同，克隆胚胎是仅为工具性用途而制造的；它们被当作物件制造和对待，有人认为这与尊重胚胎不相容（NBAC 1999）。另一些人（胚胎研究的支持者与反对者皆有）否认把废弃 IVF 胚胎与克隆胚胎用作干细胞来源之间存在重大的道德差别。他们论证说，**如果** 为研究杀死胚胎是错的，那么无论胚胎的来源如何都是错的（Doerflinger 1999; Fitzpatrick 2003; Devolder 2005, 2015）[^devolder-2005][^doerflinger-1999]。Douglas 与 Savulescu（2009）论证说，研究中摧毁“不想要的”胚胎——即无人希望用于生殖目的的胚胎——是允许的。由于废弃的 IVF 胚胎与为衍生干细胞而制造的克隆胚胎在这个意义上都是不想要的胚胎，按他们的观点，两类胚胎都可用于研究。
