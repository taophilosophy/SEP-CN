One version of this concern states that cloning would, from the outset, constitute a problematic form of eugenics. However, critics have argued that this is implausible: the best explanations of what was wrong with immoral cases of eugenics, such as the Nazi eugenic programs, are that they involved coercion and were motivated by objectionable moral beliefs or false non-moral beliefs. This would not necessarily be the case were cloning to be implemented now (Agar 2004; Buchanan 2007)[^agar-2004][^buchanan-2007]. Unlike the coercive and state-directed eugenics of the past, new ‘liberal eugenics’ defends values such as autonomy, reproductive freedom, beneficence, empathy and the avoidance of harm (Agar, 2004). Enthusiasts of so-called ‘liberal eugenics’ are interested in helping individuals to prevent or diminish the suffering and increase the well-being of their children by endowing them with certain genes.
    step1: |
    step2: |
  - id: 55
    source: |
Another version of the eugenics concern points out the risk of a slippery slope: the claim is that cloning will lead to objectionable forms of eugenics—for example, coercive eugenics—in the future. After all, historical cases of immoral eugenics often developed from earlier well intentioned and less problematic practices (for a history of eugenics as well as an analysis of philosophical and political issues raised by eugenics, see Kevles 1985 and Paul 1995)[^kevles-1995][^paul-1995]. According to Sandel (2007, Ch.5), for example, ‘liberal eugenics’ might imply more state compulsion than first appears: just as governments can force children to go to school, they could require people to use genetics to have ‘better’ children.
    step1: |
    step2: |
  - id: 56
    source: |
A related concern expressed by Sandel (2007, 52–7) is that cloning, and enhancement technologies in general, may result in a society in which parents will not accept their child for what it is, reinforcing an already existing trend of heavily managed, high-pressure child-rearing or ‘hyper-parenting’. Asch and Wasserman (2005, 202) have expressed a similar concern; arguing that having more control over what features a child has can pose an “affront to an ideal of unconditioned devotion”. Another concern, most often expressed by disability rights advocates, is that if cloning is used to have ‘better’ children, it may create a more intolerant climate towards those with a disability or a serious disease, and that such practices can express negative judgments about people with disabilities. This argument has also been advanced in the debate about selective abortion, prenatal testing, and preimplantation genetic diagnosis. Disagreement exists about whether these effects are likely. For example, Buchanan et al. (2002, 278) have argued that one can devalue disability while valuing existing disabled people and that trying to help parents who want to avoid having a disabled child does not imply that society should make no efforts to increase accessibility for existing people with disabilities.
    step1: |
