Some authors have argued that a *regulated* market in oocytes could minimize ethical concerns raised by the commercialization of oocytes and could be consistent with respect for women (Resnik 2001; Gruen 2007)[^gruen-2007][^resnik-2001]. Researchers are also investigating the use of alternative sources of oocytes, including animal oocytes, fetal oocytes, oocytes from adult ovaries obtained post mortem or during operation, and stem cell-derived oocytes. Scientists have already succeeded in creating human oocytes from embryonic stem cells (Ma et al. 2017; Saitou & Miyauchi 2016)[^saitou-2016]. Finally, another option is ‘egg-sharing’ where couples who are undergoing IVF for reproductive purposes have the option to donate one or two of their oocytes in return for a reduced fee for their fertility treatment. The advantage of this system is that it avoids exposing women to extra risks – these women were undergoing IVF in any case (Roberts & Throsby 2008)[^roberts-2008].
