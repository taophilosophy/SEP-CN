    step2: |
一种较少见的观点认为，从克隆胚胎获取干细胞所引起的伦理问题比从废弃 IVF 胚胎获取更 **少**。Hansen（2002）提出这一观点，论证说 SCNT 产生的胚胎不具有我们通常赋予其他胚胎的那种道德地位：他把体细胞核与去核卵的结合称为“跨核卵”，说它只是一种“人工制品”，既无“自然目的”，也无“发育成胚胎并最终成为人”的潜能，因而落在人类范畴之外。McHugh（2004）与 Kiessling（2001）提出类似论证。按他们的看法，从克隆胚胎获取干细胞在道德上问题较小，因为 SCNT 产生的胚胎（尚）不能进一步发育，因而更宜视为组织培养物；而 IVF 是对人类生殖的工具性支持。他们论证说，既然产生后代并非目的，用“胚胎”或“合子”来指称 SCNT 的产物便有误导之嫌。他们建议改称“克隆体”（clonote，McHugh）与“卵体”（ovasome，Kiessling）。
一种较为少见的观点认为，从克隆胚胎获取干细胞引发的伦理问题比从废弃 IVF 胚胎获取更 **少**。Hansen（2002）持此说：SCNT 产生的胚胎不具备我们通常赋予其他胚胎的道德地位。他把体细胞核与去核卵的结合体称为“跨核卵”（transnuclear egg），认为它只是“人工制品”，既无“自然目的”，也不具备“发育为胚胎并最终成为人”的潜能，因而不属于人类之列。McHugh（2004）与 Kiessling（2001）提出类似论证。在他们看来，从克隆胚胎获取干细胞的道德麻烦较小，因为 SCNT 胚胎（尚）无法进一步发育，更宜视作组织培养物；IVF 则是对人类生殖的工具性支持。他们据此认为，既然目的不在产生后代，用“胚胎”或“合子”指称 SCNT 的产物便是误导；不如改用“克隆体”（clonote，McHugh）与“卵体”（ovasome，Kiessling）。
