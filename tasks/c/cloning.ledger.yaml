Given the risks to the donor, the absence of direct medical benefit for the donor, and the uncertain potential of cloning research, it is not surprising that the number of altruistic oocyte donations for such research is very low. Financial incentives might be needed to increase the supply of oocytes for cloning research. In some countries, including the US, selling and buying oocytes is legal. Some object to these practices because they consider oocytes as integral to the body and think they should be kept out of the market: on their view, the value of the human body and its parts should not be expressed in terms of money or other fungible goods. Some also worry that, through commercialization of oocytes, women themselves may become objects of instrumental use (Alpers &Lo 1995)[^alpers-1995]. Many agree, however, that a concern for commodification does not justify a complete ban on payment of oocyte donors and that justice requires that they be financially compensated for the inconvenience, burden, and medical risk they endure, as is standard for other research subjects (Steinbock 2004; Mertes &Pennings 2007)[^mertes-2007][^steinbock-2004]. A related concern is the effect of financial or other offers of compensation on the voluntariness of oocyte donation. Women, especially economically disadvantaged women from developing countries, might be unduly induced or even coerced into selling their oocytes (Dickinson 2002)[^dickinson-2002]. Baylis and McLeod (2007) have highlighted how difficult it is concomitantly to avoid both undue inducement and exploitation: a price that is too low risks exploitation; a price that avoids exploitation risks undue inducement.
