Some believe that an embryo, from the moment of conception, has the same moral status, that is, the same set of basic moral rights, claims or interests as an ordinary adult human being. This view is sometimes expressed by saying that the early embryo is a person. On this view, creating and killing embryos for stem cells is a serious moral wrong. It is impermissible, even if it could save many lives (Deckers 2007)[^deckers-2007]. Others believe that the early embryo is merely a cluster of cells or human tissue lacking any moral status. A common view among those who hold this position is that, given its promising potential, embryonic stem cell and cloning research is a moral imperative (Devolder & Savulescu 2006)[^devolder-2006]. Many defend a view somewhere in between these opposing positions. They believe, for example, that the early embryo should be treated with respect because it has an intermediate moral status: a moral status lower than that of a person but higher than that of an ordinary body cell. A popular view amongst those who hold this position is that using embryos for research might sometimes be justified. Respect can be demonstrated, it is typically argued, by using embryos only for very important research that cannot be done using less controversial means, and by acknowledging the use of embryos for research with a sense of regret or loss (Robertson 1995; Steinbock 2001)[^robertson-1995][^steinbock-2001]. One common view among those who hold the intermediate moral status view is that the use of discarded IVF embryos to obtain stem cells is compatible with the respect we owe to the embryo, whereas the creation and use of cloned embryos is not. An argument underlying this view is that, unlike IVF embryos, cloned embryos are created for instrumental use only; they are created and treated as a mere means, which some regard as incompatible with respectful treatment of the embryo (NBAC 1999). Others (both proponents and opponents of embryo research) have denied that there is a significant moral difference between using discarded IVF embryos and cloned embryos as a source of stem cells. They have argued that *if* killing embryos for research is wrong, it is wrong regardless of the embryo’s origin (Doerflinger 1999; Fitzpatrick 2003; Devolder 2005, 2015)[^devolder-2005][^doerflinger-1999]. Douglas and Savulescu (2009) have argued that it is permissible to destroy ‘unwanted’ embryos in research, that is, embryos that no one wishes to use for reproductive purposes. Since both discarded IVF embryos and cloned embryos created for the purpose of stem cell derivation are unwanted embryos in that sense, it is, on their view, permissible to use both types of embryos for research.
