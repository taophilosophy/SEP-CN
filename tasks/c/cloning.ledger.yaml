The concern that cloning threatens the clone’s identity and individuality has been criticized for relying on the mistaken belief that who and what we become is entirely determined by our genes. Such genetic determinism is clearly false. Though genes influence our personal development, so does the complex and irreproducible context in which our lives take place. We know this, among others, from studying monozygotic twins. Notwithstanding the fact that such twins are genetically identical to each other and, therefore, sometimes look very similar and often share many character traits, habits and preferences, they *are* different individuals, with different identities (Segal 2000)[^segal-2000]. Thus, it is argued, having a genetic duplicate does not threaten one’s individuality, or one’s distinct identity.
