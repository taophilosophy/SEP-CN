Cloning arouses people’s imagination about the clone, but also about those who will choose to have a child through cloning. Often dubious motives are ascribed to them: they would want a child that is ‘just like so-and-so’ causing people to view children as objects or as commodities like a new car or a new house (Putnam 1997, 7–8)[^putnam-1997]. They would want an attractive child (a clone of Scarlett Johansson) or a child with tennis talent (a clone of Victoria Azarenka) purely to show off. Dictators would want armies of clones to achieve their political goals. People would clone themselves out of vanity. Parents would clone their existing child so that the clone can serve as an organ bank for that child, or would clone their deceased child to have a replacement child. The conclusion is then that cloning is wrong because the clone will be used as a mere means to others’ ends. These critiques have also been expressed with regard to other forms of assisted reproduction; but some worry that individuals created through cloning may be more likely to be viewed as commodities because their total genetic blueprint would be chosen – they would be “fully made and not begotten” (Ramsey 1966; Kass 1998; PCBE 2002, 107)[^kass-1998][^ramsey-1966].
    step1: |
    step2: |
  - id: 46
    source: |
Strong (2008) has argued that these concerns are based on a fallacious inference. It is one thing to desire genetically related children, and something else to believe that one owns one’s children or that one considers one’s children as objects, he writes. Other commentators, however, have pointed out that even if parents themselves do not commodify their children, cloning might still have an impact on society as a whole, thereby increasing the tendency of others to do so (Levy & Lotz 2005; Sandel 2007)[^levy-2005][^sandel-2007]. A related concern expressed by Levick (2004, 184–5) is that allowing cloning might result in a society where ‘production on demand’ clones are sold for adoption to people who are seeking to have children with special abilities – a clearer case of treating children as objects.
    step1: |
    step2: |
  - id: 47
    source: |
But suppose some people create a clone for instrumental reasons, for example, as a stem cell donor for a sick sibling. Does this imply that the clone will be treated merely as a means? Critics of this argument have pointed out that parents have children for all kinds of instrumental reasons, including the benefit for the husband-wife relationship, continuity of the family name, and the economic and psychological benefits children provide when their parents become old (Harris 2004, 41–2, Pence 1998)[^harris-2004][^pence-1998]. This is generally not considered problematic as long as the child is also valued in its own right. What is most important in a parent-child relationship is the love and care inherent in that relationship. They stress the fact that we judge people on their attitudes toward children, rather than on their motives for having them. They also deny that there is a strong link between one’s intention or motive to have a child, and the way one will treat the child.
    step1: |
    step2: |
  - id: 48
    source: |
Another concern is that clones may be the victims of unjustified discrimination and will not be respected as persons (Deech 1999; Levick 2004, 185–187)[^deech-1999][^levick-2004]. Savulescu (2005, Other Internet Resources) has referred to such negative attitudes towards clones as ‘clonism’: a new form of discrimination against a group of humans who are different in a non-morally significant way. But does a fear for ‘clonism’ constitute a good reason for rejecting cloning? Savulescu and others have argued that, if it is, then we must conclude that racist attitudes and discriminatory behavior towards people with a certain ethnicity provides a good reason for people with that ethnicity not to procreate. This, according to these critics, is a morally objectionable way to solve the problem of racism. Instead of limiting people’s procreative liberty we should combat existing prejudices and discrimination. Likewise, it is argued, instead of prohibiting cloning out of concern for clonism, we should combat possible prejudices and discrimination against clones (see also Pence 1998, 46; Harris 2004, 92–93)[^harris-2004][^pence-1998]. Macintosh (2005, 119–21) has warned that by expressing certain concerns about cloning one may actually reinforce certain prejudices and misguided stereotypes about clones. For example, saying that a clone would not have a personal identity prejudges the clone as inferior or fraudulent (the idea that originals are more valuable than their copies) or even less than human (as individuality is seen as an essential characteristic of human nature).
    step1: |
    step2: |
  - id: 49
    source: |
Some worry that cloning will threaten traditional family structures; a fear that has come up in debates about gay people adopting children, IVF and other assisted reproduction techniques. But in cloning the situation would be more complex as it may blur generational boundaries (McGee 2000)[^mcgee-2000] and the clone would likely be confused about her kinship ties (Kass 1998; O’Neil 2002, 67–68)[^kass-1998][^o’neil-2002]. For example, a woman who has a child conceived through cloning would actually be the twin of her child and the woman’s mother would, genetically, be its mother, not grandmother. Some have argued against these concerns, replying that a cloned child would not necessarily be more confused about her family ties than other children. Many have four nurturing parents because of a divorce, never knew their genetic parents, have nurturing parents that are not their genetic parents, or think that their nurturing father is also their genetic father when in fact he is not. While these complex family relationships can be troubling for some children, they are not insurmountable, critics say. Harris (2004, 77–78) argues that there are many aspects about the situation one is born and raised in that may be troublesome. As with all children, the most important thing is the relation with people who nurture and educate them, and children usually know very well who these people are. There is no reason to believe that with cloning, this will be any different. Onora O’Neil (2002, 67–8) argues that such responses are misplaced. While she acknowledges that there are already children now with confused family relationships, she argues that it is very different when prospective parents seek such potentially confused relationships for their children from the start.
