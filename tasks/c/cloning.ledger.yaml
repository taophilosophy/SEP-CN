However, the reference to twins as a model to think about reproductive cloning has been criticized, for example, because it fails to reflect important aspects of the parent-child relationship that would incur if the child were a clone of one of the rearing parents (Jonas 1974; Levick 2004)[^jonas-1974][^levick-2004]. Because of the dominance of the progenitor, the risk of reduced autonomy and confused identity may be greater in such a situation than in the case of ordinary twins. Moreover, just *because* the clone would be a delayed twin, she may have the feeling that her life has already been lived or that she is predetermined to do the same things as her progenitor (Levy & Lotz 2005)[^levy-2005]. This problem may be exacerbated by others constantly comparing her life with that of the progenitor, and having problematic expectations based on these comparisons. The clone may feel under constant pressure to live up to these expectations (Kass 1998; Levick 2004, 101; Sandel 2007, 57–62)[^kass-1998][^levick-2004][^sandel-2007], or may have the feeling she leads ‘a life in the shadow’ of the progenitor (Holm 1998; PCBE 2002, Ch.5)[^holm-1998]. This may especially be the case if the clone was created as a ‘replacement’ for a deceased child. (Some private companies already offer to clone dead pets to create replacements pets.) The fear is that the ‘ghost of the dead child’ will get more attention and devotion than the replacement child. Parents may expect the clone to be like the lost child, or some idealized image of it, which could hamper the development of her identity and adversely affect her self-esteem (Levick 2004, 111–132)[^levick-2004]. Finally, another reason why the clone’s autonomy may be reduced is because she would be involuntarily informed about her genetic predispositions. A clone who knows that her genetic parent developed a severe single gene disease at the age of forty will realise it is very likely that she will undergo the same fate. Unlike individuals who *choose* to have themselves genetically tested, clones who know their genetic parent’s medical history will be involuntarily informed.
