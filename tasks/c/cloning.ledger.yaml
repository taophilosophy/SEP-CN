However, what many people find disturbing is the idea of creating a genetic duplicate of an existing person, or a person who has existed. That is why the potential application of SCNT in humans set off a storm of controversy. Another way to produce a genetic duplicate from an existing person is by cryopreserving one of two genetically identical embryos created *in vitro* for several years or decades before using it to generate a pregnancy. Lastly, reproductive cloning of humans could, in theory, also be achieved by combining the induced pluripotent stem cell technique with tetraploid complementation. Several research teams have succeeded in cloning mice this way (see, for example, Boland et al. 2009)[^boland-2009]. The technique involves injecting mouse iPS cells in tetraploid embryos, i.e. embryos with twice the normal number of chromosomes that cannot result in live offspring. The resulting mouse pups are derived solely from the iPS cells, which means that the tetraploid embryos only acted as a substitute trophectoderm, which forms the placenta and other nourishing membranes but which does not contribute to the ‘embryo proper’.
    step1: |
    step2: |
然而，令许多人感到不安的，是为一个现存的人、或曾经存在的人制造基因复制品的念头。正因如此，SCNT 在人类中的潜在应用掀起了一场轩然大波。从现存之人产生基因复制品的另一种方式，是把 *in vitro* 制造的两个基因相同胚胎之一冷冻保存数年或数十年，然后再用它促成妊娠。最后，人类生殖性克隆在理论上还可以通过把诱导多能干细胞技术与四倍体补偿结合起来实现。若干研究团队已用这种方式成功克隆小鼠（例如见 Boland 等 2009）[^boland-2009]。该技术是把小鼠 iPS 细胞注入四倍体胚胎，即染色体数为正常两倍、无法产生存活后代的胚胎。所得幼鼠完全源自 iPS 细胞，这意味着四倍体胚胎只充当替代的滋养外胚层：它形成胎盘及其他营养膜，却不参与“胚胎本体”。
然而，令许多人不安的，是为一个现存的人或曾经存在的人制造基因复制品这一念头。正因如此，SCNT 用于人类的前景才掀起轩然大波。从现存之人制造基因复制品还有另一条路径：把 *in vitro* 培育出的两个基因相同胚胎之一冷冻保存数年乃至数十年，再解冻用于促成妊娠。最后，人类生殖性克隆在理论上还可以把诱导多能干细胞（iPS）技术与四倍体补偿结合起来实现。已有若干研究团队用这种方法成功克隆出小鼠（例如 Boland 等，2009）[^boland-2009]。做法是把小鼠 iPS 细胞注入四倍体胚胎——此类胚胎的染色体数为正常的两倍，本身无法产生存活后代。所得幼鼠完全由 iPS 细胞发育而来；四倍体胚胎只充当替身滋养外胚层，负责形成胎盘及其他营养膜，并不构成“胚胎本体”。
