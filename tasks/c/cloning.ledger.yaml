Dolly is a case of reproductive cloning, the aim of which is to create offspring. Reproductive cloning is to be distinguished from cloning for therapy and research, sometimes also referred to as ‘therapeutic cloning’. Both reproductive cloning and cloning for research and therapy involve SCNT, but their aims, as well as most of the ethical concerns they raise, differ. I will first discuss cloning for research and therapy and will then proceed to outline the ethical debate surrounding reproductive cloning.
    step1: |
    step2: |
多利属于生殖性克隆，其目的在于产生后代。生殖性克隆须与为治疗与研究而进行的克隆（有时也称“治疗性克隆”）区分开来。二者都涉及 SCNT，但目的不同，所引发的大多数伦理关切也不同。我先讨论为研究与治疗而进行的克隆，然后概述围绕生殖性克隆的伦理争论。
多利属于生殖性克隆，其目标是产生后代。生殖性克隆须与为治疗与研究而进行的克隆（有时称作“治疗性克隆”）区分开来。两者都涉及 SCNT，但目的不同，引发的多数伦理关切也不同。下文先讨论为研究与治疗而进行的克隆，再概述围绕生殖性克隆的伦理争论。
  - id: 12
    source: |
Cloning for research and therapy involves the creation of an embryo via SCNT, but instead of transferring the cloned embryo to the uterus in order to generate a pregnancy, it is used to obtain pluripotent stem cells. It is thus not the intention to use the embryo for reproductive purposes. Embryonic stem cells offer powerful tools for developing therapies for currently incurable diseases and conditions, for important biomedical research, and for drug discovery and toxicity testing (Cervera & Stojkovic 2007)[^cervera-2007]. For example, one therapeutic approach is to induce embryonic stem cells to differentiate into cardiomyocytes (heart muscle cells) to repair or replace damaged heart tissue, into insulin-producing cells to treat diabetes, or into neurons and their supporting tissues to repair spinal cord injuries.
    step1: |
    step2: |
为研究与治疗而进行的克隆涉及通过 SCNT 制造胚胎，但不把克隆胚胎移植入子宫以促成妊娠，而是用它获取多能干细胞。因此，这里并不打算把胚胎用于生殖目的。胚胎干细胞为开发目前无法治愈的疾病与病症的疗法、为重要的生物医学研究、为药物发现与毒性检测提供了强有力的工具（Cervera & Stojkovic 2007）[^cervera-2007]。例如，一种治疗思路是诱导胚胎干细胞分化为心肌细胞（心脏肌肉细胞）以修复或替换受损的心脏组织，分化为产生胰岛素的细胞以治疗糖尿病，或分化为神经元及其支持组织以修复脊髓损伤。
为研究与治疗而进行的克隆同样通过 SCNT 制造胚胎，但不把克隆胚胎移入子宫促成妊娠，而是用它获取多能干细胞。因此，其意图并不在于把胚胎用于生殖。胚胎干细胞是强有力的工具，可用于开发目前尚无法治愈的疾病与病症的疗法，支撑重要的生物医学研究，并服务于药物发现与毒性检测（Cervera & Stojkovic，2007）[^cervera-2007]。例如，一种治疗思路是诱导胚胎干细胞分化为心肌细胞以修复或替换受损的心肌组织，分化为分泌胰岛素的细胞以治疗糖尿病，或分化为神经元及其支持组织以修复脊髓损伤。
  - id: 13
    source: |
A potential problem with embryonic stem cells is that they will normally *not* be genetically identical to the patient. Embryonic stem cells are typically derived from embryos donated for research after *in vitro* fertilization (IVF) treatment. Because these stem cells would have a genetic identity different from that of the recipient – the patient – they may, when used in therapy, be rejected by her immune system. Immunorejection can occur when the recipient’s body does not recognize the transplanted cells, tissues or organs as its own and as a defense mechanism attempts to destroy the graft. Another type of immunorejection involves a condition called graft-versus-host disease, in which immune cells contaminating the graft recognize the new host – the patient – as foreign and attack the host’s tissues and organs. Both types of immunorejection can result in loss of the graft or death of the patient. It is one of the most serious problems faced in transplant surgery.
