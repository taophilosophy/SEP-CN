一些作者认为，**受监管的** 卵母细胞市场可以把卵母细胞商业化引发的伦理关切降到最低，并且可以与对女性的尊重相容（Resnik 2001; Gruen 2007）[^gruen-2007][^resnik-2001]。研究者也在探索替代性卵母细胞来源，包括动物卵母细胞、胎儿卵母细胞、死后或手术中取自成人卵巢的卵母细胞，以及干细胞来源的卵母细胞。科学家已成功从胚胎干细胞制造出人类卵母细胞（Ma 等 2017; Saitou & Miyauchi 2016）[^saitou-2016]。最后，还有一种选择是“共享卵子”：因生殖目的接受 IVF 的夫妇可以选择捐出一两个卵母细胞，以换取生育治疗费用的减免。这一制度的好处在于避免让女性承受额外风险——这些女性本来就在接受 IVF（Roberts & Throsby 2008）[^roberts-2008]。
