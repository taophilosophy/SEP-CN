为研究与治疗而进行的克隆需要大量高质量供体卵母细胞。如何获得这些卵母细胞便引出伦理问题。卵母细胞捐赠涉及各种风险与不适（关于风险的评述，见 Committee on Assessing the Medical Risks of Human Oocyte Donation for Stem Cell Research，2007）。参与此类捐赠所引发的最紧迫伦理问题之一，是应采用何种知情同意模式。与考虑 IVF 的女性不同，非医学目的的卵母细胞捐赠者不是临床患者。她们本身并不从捐赠中获得任何生殖或医学利益（不过 Kalfoglou & Gittelsohn，2000，认为她们可能获得心理上的好处）。Magnus 与 Cho（2005）认为，捐赠女性不应被归为研究对象，因为与其他研究不同，捐赠者面临的风险不在研究本身，而在获取研究所需材料的过程中。他们建议为这样一类人新设“研究捐赠者”范畴：他们仅为他人的利益（在此是未来无法识别的他人）而承受重大风险，且风险不产生于实际研究，而产生于研究材料的获取。活体捐赠者向陌生人无偿捐献器官的知情同意，也被提议作为一种模式，因为两种情况下受益者都是陌生人而非捐赠者。然而，后一提议的批评者指出，两类捐赠之间存在不可类比之处：有关无偿捐赠的法规所体现的一般伦理规则——即必须对患者有很高的良好结局可能性——在为克隆研究捐赠卵母细胞的情形中被违反（George 2007）[^george-2007]。
