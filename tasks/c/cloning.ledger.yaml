Some are skeptical about the claimed benefits of cloning for research and therapy. They stress that for many diseases in which cloned embryonic stem cells might offer a therapy, there are alternative treatments and/or preventive measures in development, including gene therapy, pharmacogenomical solutions and treatments based on nanotechnology. It is often claimed that other types of stem cells such as adult stem cells and stem cells from the umbilical cord blood might enable us to achieve the same aims as cloning. Especially induced pluripotent stem cells (iPSCs) have raised the hope that cloning research is superfluous (Rao & Condic 2008)[^rao-2008]. iPSCs are created through genetic manipulation of a body cell. iPSCs are similar to embryonic stem cells, and in particular to embryonic stem cells from cloned embryos. However, iPSC research could provide tissue- and patient-specific cells without relying on the need for human oocytes or the creation and destruction of embryos. iPSC research could thus avoid the ethical issues raised by cloning. This promise notwithstanding, scientists have warned that it would be premature to stop cloning research as iPSCs are not identical to embryonic stem cells (Pera & Trounson 2013)[^pera-2013]. Cloning research may teach us things that iPSC research cannot teach us. Moreover, iPSC research has been said to fail to completely avoid the issue of embryo destruction (Brown 2009, Devolder 2015)[^brown-2009][^devolder-2015].
