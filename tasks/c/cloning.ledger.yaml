鉴于捐赠者面临风险、捐赠者本人没有直接医学利益、克隆研究潜力未定，此类研究的无偿卵母细胞捐赠数量极低并不奇怪。增加克隆研究卵母细胞供应，或许需要经济激励。在一些国家（包括美国），买卖卵母细胞是合法的。有人反对这类做法，因为他们把卵母细胞视为身体不可分割的部分，认为应将其排除在市场之外：在他们看来，人体及其部分的价值不应以金钱或其他可替代物品来表达。还有人担心，卵母细胞商业化可能使女性本人沦为工具性使用的对象（Alpers & Lo 1995）[^alpers-1995]。不过许多人同意，对商品化的担忧并不足以完全禁止向卵母细胞捐赠者付酬；正义要求就她们所承受的不便、负担与医学风险给予经济补偿，这与对待其他研究对象的常规做法一致（Steinbock 2004; Mertes & Pennings 2007）[^mertes-2007][^steinbock-2004]。一个相关关切是，金钱或其他补偿提议对卵母细胞捐赠自愿性的影响。女性，尤其是来自发展中国家的经济弱势女性，可能被不当诱导甚至被胁迫出售卵母细胞（Dickinson 2002）[^dickinson-2002]。Baylis 与 McLeod（2007）指出，同时避免不当诱导与剥削十分困难：价格过低有剥削之虞，避免剥削的价格又有不当诱导之虞。
