关于为研究与治疗而进行的克隆之伦理的许多争论，都取决于一个基本分歧：我们应当如何对待早期人类胚胎。就现行做法而言，分离胚胎干细胞要破坏囊胚阶段的胚胎（受精后第五天，此时胚胎由 125–225 个细胞组成）。而为研究与治疗而进行的克隆不仅涉及破坏胚胎，还涉及 **仅仅** 为衍生干细胞的目的而制造胚胎。对于何时以及是否允许仅为获取干细胞而制造胚胎，人们的看法大相径庭。
