Concerns about exploitation are not limited to concerns about payment, as became clear in the ‘Hwang scandal’ (for a review, see Saunders & Savulescu 2008)[^saunders-2008]. In 2004, Woo-Suk-Hwang, a leading Korean stem cell scientist, claimed to be the first to clone human embryos using SCNT and to extract stem cells from these embryos. In addition to finding that Hwang had fabricated many of his research results, Korea’s National Bioethics Committee also found that Hwang had pressured junior members of his lab to donate oocytes for his cloning experiments.
