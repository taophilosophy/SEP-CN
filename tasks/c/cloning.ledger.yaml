个性化克隆疗法很可能费工且昂贵。这引发了社会正义关切：克隆疗法也许只会是极富者的现实选择？有人回应说，克隆疗法随着时间推移可能变得更便宜、更省工、更可及。此外，克隆可能 **治愈** 疾病而不只是缓解症状。当然，无论经济成本如何，克隆程序耗时这一点仍然成立，这使它不适合某些需要紧急干预的临床应用（如心肌梗死、急性肝衰竭或创伤性、感染性脊髓损伤）。因此，若治疗性克隆成为现实，其应用很可能限于慢性病。克隆出多利的 Wilmut（1997）曾建议，克隆治疗可以定向以最大化收益：患心脏病的年长者可以用基因不匹配的干细胞治疗，终身服药抑制免疫系统，并忍受副作用；较年轻者则可能受益于完全匹配的克隆胚胎干细胞。Devolder 与 Savulescu（2006）认为，关于经济成本的反对意见，对“自体移植克隆”比对“为建立人类疾病细胞模型而克隆”更有力。后者将推动人类疾病研究，并可能带来可负担的疗法与治愈手段，惠及癌症、心脏病等多种困扰世界各地人们的常见病。最后，有人指出，克隆研究是否必然比目前在动物身上进行的细胞与组织实验更费工，并不清楚。
个性化克隆疗法很可能费时费力、价格高昂，由此引发社会正义关切：克隆疗法会不会只是极富者的现实选项？有人的回应是，随着时间推移，克隆疗法可能变得更便宜、更省人力、更易普及；况且克隆或许能 **治愈** 疾病，而不只是缓解症状。当然，无论成本高低，克隆程序都耗时较长，因而不适合需要紧急干预的临床应用（如心肌梗死、急性肝衰竭，或创伤性、感染性脊髓损伤）。治疗性克隆一旦可行，其应用很可能限于慢性病。克隆出多利的 Wilmut（1997）曾建议让克隆治疗定向发挥最大效益：患心脏病的年长者可用基因不匹配的干细胞治疗，终身服药抑制免疫并忍受副作用；较年轻者则可用完全匹配的克隆胚胎干细胞。Devolder 与 Savulescu（2006）认为，经济成本方面的反对意见，对“自体移植克隆”比对“为建立人类疾病细胞模型而克隆”更有力；后者能推进人类疾病研究，并可能带来可负担的疗法乃至治愈手段，惠及癌症、心脏病等困扰世界各地的常见病。最后，也有人指出，克隆研究未必就比目前在动物身上做的细胞与组织实验更费人力。
