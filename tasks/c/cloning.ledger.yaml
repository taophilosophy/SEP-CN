Cloning for research and therapy is, however, still in its infancy stages. In 2011, a team of scientists from the New York Stem Cell Foundation Laboratory was the first to have succeeded in creating two embryonic stem cell lines from human embryos produced through SCNT (Noggle et al. 2011)[^noggle-2011]. Three years earlier, a small San Diego biotechnological company created human embryos (at the blastocyst stage) via SCNT but did not succeed in deriving embryonic stem cells from these cells (French et al. 2008)[^french-2008]. Cloning for research and therapy is thus not likely to bear fruit in the short term though progress is made (Tachibana et al. 2013; Zhang et al. 2020)[^tachibana-2013]. Apart from unsolved technical difficulties, much more basic research in embryonic stem cell research is needed. The term ‘therapeutic cloning’ has been criticized precisely for this reason. It suggests that therapy using embryonic stem cells from cloned embryos is already reality. In the phase before clinical trials, critics say, it is only reasonable to refer to research on nuclear transfer as ‘research cloning’ or ‘cloning for biomedical research’ (PCBE, 2002).
