Cloning for research and therapy requires a large number of high-quality donor oocytes. Ethical issues arise regarding how these oocytes could be obtained. Oocyte donation involves various risks and discomforts (for a review of the risks, see Committee on Assessing the Medical Risks of Human Oocyte Donation for Stem Cell Research*,* 2007). Among the most pressing ethical issues raised by participating in such donation is what model of informed consent should be applied. Unlike women who are considering IVF, non-medical oocyte donors are not clinical patients. They do not stand to derive any reproductive or medical benefit themselves from the donation (though Kalfoglou & Gittelsohn, 2000, argue that they may derive a psychological benefit). Magnus and Cho (2005) have argued that donating women should not be classified as research subjects since, unlike in other research, the risks to the donor do not lie in the research itself but in the procurement of the materials required for the research. They suggest that a new category named ‘research donors’ be created for those who expose themselves to substantial risk only for the benefit of others (in this case unidentifiable people in the future) and where the risk is incurred not in the actual research but in the procurement of the materials for the research. Informed consent for altruistic organ donation by living donors to strangers has also been suggested as a model, since, in both cases, the benefits will be for strangers and not for the donor. Critics of this latter suggestion have pointed out, however, that there is a disanalogy between these two types of donation. The general ethical rule reflected in regulations concerning altruistic donation, namely that there must be a high chance of a good outcome for the patient, is violated in the case of oocyte donation for cloning research (George 2007)[^george-2007].
