有些人对克隆研究与治疗所宣称的益处持怀疑态度。他们强调，对于克隆胚胎干细胞可能提供疗法的许多疾病，已有替代疗法和/或预防措施在研发中，包括基因治疗、药物基因组学方案与基于纳米技术的治疗。人们常说，其他类型的干细胞（如成体干细胞与脐带血干细胞）或许能实现与克隆相同的目标。尤其是诱导多能干细胞（iPSC）让人们希望克隆研究变得多余（Rao & Condic 2008）[^rao-2008]。iPSC 是通过对体细胞进行遗传操作而产生的。iPSC 与胚胎干细胞相似，尤其与克隆胚胎来源的胚胎干细胞相似。然而，iPSC 研究可以提供组织特异与患者特异的细胞，而无需人类卵母细胞，也无需制造和破坏胚胎。因此，iPSC 研究可以避开克隆引发的伦理问题。尽管有这一前景，科学家警告说，现在就停止克隆研究为时过早，因为 iPSC 与胚胎干细胞并不相同（Pera & Trounson 2013）[^pera-2013]。克隆研究可能教给我们 iPSC 研究无法教给我们的东西。此外，据说 iPSC 研究也未能完全避开破坏胚胎的问题（Brown 2009, Devolder 2015）[^brown-2009][^devolder-2015]。
有些人对克隆研究与治疗所宣称的益处持怀疑态度。他们强调，对许多或许能用克隆胚胎干细胞治疗的疾病，已有替代疗法和/或预防措施在研发中，包括基因治疗、药物基因组学方案与纳米技术治疗。人们常说，成体干细胞、脐带血干细胞等其他类型的干细胞或许能实现与克隆相同的目标；尤其是诱导多能干细胞（iPSC），让人以为克隆研究已属多余（Rao & Condic，2008）[^rao-2008]。iPSC 由体细胞经遗传操作而来，性质上接近胚胎干细胞，尤其接近克隆胚胎来源的胚胎干细胞；但 iPSC 研究可提供组织特异、患者特异的细胞，既不需人类卵母细胞，也不需制造和破坏胚胎，因而能避开克隆引发的伦理问题。尽管前景可观，科学家仍警告说，现在就停止克隆研究为时过早，因为 iPSC 与胚胎干细胞并不等同（Pera & Trounson，2013）[^pera-2013]。克隆研究或许能教给我们 iPSC 研究教不了的东西；况且也有人指出，iPSC 研究并未完全避开破坏胚胎的问题（Brown，2009；Devolder，2015）[^brown-2009][^devolder-2015]。
