    source: |-
      One of the more important contributions of Crescas to the history of philosophy is his critique of Aristotelian science.[^note-19] This critique takes place in the second part of the first essay in *Or Hashem*. Crescas’s opinions regarding natural science are influenced by the new Christian physics of the 14ᵗʰ century, and especially by thinkers like Ockham, Buridan, and Oresme (Pines 1967)[^pines-1967]. Another source of Crescas’s science appears to be the lost book of Abner, *The New Philosophy*. But in this case, as in others, Crescas weaves together different sources and utilizes them freely in his goal to build one unified opinion. This original thought influenced occidental philosophy, finding its way via translation into Pico della Mirandola’s book *Examen Vanitas Doctrinae Gentium*, and later into Spinoza. Some of his most well known opinions include the existence of the void, the existence of infinitude of worlds, and the existence of time without movement.
    step1: |-
      克雷斯卡斯对哲学史的较重要贡献之一，是他对亚里士多德科学的批判。[^note-19] 这一批判见于《上主之光》第一篇第二部分。克雷斯卡斯关于自然科学的观点，受十四世纪新的基督教物理学的影响，尤其受奥卡姆、布里丹与奥雷姆等思想家的影响（Pines 1967）[^pines-1967]。克雷斯卡斯科学的另一个来源似乎是阿布内尔的佚书《新哲学》。但无论此处还是别处，克雷斯卡斯都把不同来源编织在一起，并在构建统一观点的目标下自由地利用它们。这一原创思想影响了西方哲学，经翻译进入皮科·德拉·米兰多拉的著作《异教徒学说之虚荣的检验》，后来又进入斯宾诺莎。他最著名的观点包括：虚空的存在、世界之无限的存在、无运动之时间的存在。
    step2: |-
      克雷斯卡斯对哲学史较重要的贡献之一，是他对亚里士多德科学的批判。[^note-19] 批判见于《上主之光》第一篇第二部分。他关于自然科学的观点，受十四世纪新的基督教物理学影响，尤其受奥卡姆（Ockham）、布里丹（Buridan）与奥雷姆（Oresme）诸家的影响（Pines 1967）[^pines-1967]。其科学的另一来源，似乎是阿布内尔的佚书《新哲学》。但无论此处抑或别处，克雷斯卡斯都把不同来源编织起来，为构建统一观点而自由取用。这一原创思想影响了西方哲学：经翻译进入皮科·德拉·米兰多拉的《异教徒学说之虚荣的检验》（*Examen Vanitas Doctrinae Gentium*），后来又进入斯宾诺莎。他最负盛名的观点包括：虚空的存在、世界之无限的存在、无运动之时间的存在。
