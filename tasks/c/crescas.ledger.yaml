      In these topics Crescas demonstrates a good understanding of the Christian theology of his time. In the majority of these subjects he uses philosophical and logical arguments against Christian dogma and not quotations from the Bible. This book was probably one of the more philosophical works of the Jewish critics of Christianity.[^note-9] Interestingly, Crescas utilizes in his polemical book some of the very Aristotelian opinions that he himself critiques in his philosophical oeuvre *Or Hashem.* The reason for this contradiction is probably that the aim of Crescas in his polemic works is to convince Jews not to convert to Christianity, and Jewish apostates to return to Judaism. The most effective method of attaining this goal was to utilize the most popular science in his time, and not necessarily what he considered to be closest to the truth. We can summarize that in his polemic works Crescas has a polemical goal, and in his philosophical works he has a philosophical goal.[^note-10] The Hebrew translator explains that the reason for this divergence was that the philosophical works were written before the polemical ones, but after writing *Or Hashem*, Crescas returned to Aristotelian science. But this explanation doesn’t accord with the chronological order of the writing, and we don’t have any reason to suppose that Crescas retreated from his anti-Aristotelian critiques.
    step1: |-
      在这些主题上，克雷斯卡斯表现出对他那个时代基督教神学的良好理解。在大多数主题上，他使用哲学与逻辑论证来反对基督教教义，而非引用《圣经》。这本书大概是犹太人批判基督教的著作中较具哲学性的一种。[^note-9] 有趣的是，克雷斯卡斯在其论战著作中使用了某些他在哲学著作《上主之光》中亲自批判的亚里士多德观点。这一矛盾的原因大概是：克雷斯卡斯在论战著作中的目的是说服犹太人不改宗基督教、并说服犹太叛教者回归犹太教。达到这一目标最有效的方法是使用他那个时代最流行的科学，而不一定是他认为最接近真理的东西。我们可以总结说：在论战著作中，克雷斯卡斯有论战的目标；在哲学著作中，他有哲学的目标。[^note-10] 希伯来语译者解释说，这一分歧的原因在于哲学著作写于论战著作之前，但写完《上主之光》之后，克雷斯卡斯又回到了亚里士多德科学。但这一解释与写作的先后次序不合，而且我们没有任何理由假定克雷斯卡斯放弃了他的反亚里士多德批判。
    step2: |-
      在这些主题上，克雷斯卡斯表现出对当时基督教神学的良好理解。多数主题上，他针对基督教教义使用哲学与逻辑论证，而非引用《圣经》。此书大概是犹太人批判基督教的著作中较富哲学性的一种。[^note-9] 有趣的是，克雷斯卡斯在论战著作中使用的某些亚里士多德学说，正是他自己在哲学著作《上主之光》中所批判的。这一矛盾的原因大概是：论战著作意在说服犹太人不改宗基督教、并劝犹太叛教者回归犹太教；而要达此目的，最有效的手段是援用当时最流行的科学，未必是他认为最接近真理的东西。可由是总结：论战著作有其论战目标，哲学著作有其哲学目标。[^note-10] 希伯来语译者解释说，这一分歧源于哲学著作写于论战著作之前，而写完《上主之光》之后，克雷斯卡斯又回到了亚里士多德科学。然而这一解释与写作时序不合，我们也没有任何理由假定克雷斯卡斯放弃过他的反亚里士多德批判。
