    source: |-
      Rabbi Hasdai Crescas (ca. 1340–1410/11) was the head of the Jewish community of Aragon, and in some ways all of Hispanic Jewry, during one of its most critical periods. Crescas was one of the leading rabbinic authorities of his time,[^note-1] the political leader of the Jews of Aragon, and a philosophical polemicist against Christianity. As one of the main medieval Jewish philosophers, Crescas critiques the radical Aristotelian philosophy of Maimonides and some of his philosophical heirs. He denounces the different Aristotelian opinions as contradicting not only the Jewish tradition, but also the true empirical and rational understanding of the world. Crescas assembles traditional Jewish opinion, the diverse Aristotelian sources, the neo-platonic thought of the apostate Abner of Burgos and the new science of scholastics of the 14ᵗʰ century to create an original philosophical opinion and critique of Aristotelianism known to the medieval period. His philosophical book *Or Hashem* was an important oeuvre of both Judaic thought and of the criticism of Aristotelian science which spurred the growth of the new science of the modern period, which arguably started in the 14ᵗʰ century. Until recently this book hadn’t been translated completely in any occidental languages, though it had influenced general occidental philosophy, especially via thinkers like Pico della Mirandola and Spinoza.
    step1: |-
      拉比哈斯代·克雷斯卡斯（约 1340–1410/11）是阿拉贡犹太共同体的首领，在某种意义上也是整个西班牙系犹太人的首领，其时正值犹太史上最危急的时期之一。克雷斯卡斯是他那个时代最主要的拉比权威之一，[^note-1] 是阿拉贡犹太人的政治领袖，也是一位反基督教的哲学论辩家。作为中世纪主要犹太哲学家之一，克雷斯卡斯批判迈蒙尼德的激进亚里士多德主义哲学及其若干哲学后裔。他痛斥各种亚里士多德学说，认为它们不仅与犹太传统相抵触，也与对世界的真正经验性、理性性理解相抵触。克雷斯卡斯汇集传统犹太观点、各色亚里士多德来源、叛教者布尔戈斯的阿布内尔的新柏拉图主义思想以及十四世纪经院学者的新科学，创造出中世纪所知的一种原创性哲学观点和对亚里士多德主义的批判。他的哲学著作《上主之光》既是犹太思想的重要作品，也是对亚里士多德科学之批判的重要作品，而这一批判推动了现代时期新科学的成长——新科学可以说正始于十四世纪。直到最近，这本书尚未以任何西方语言完整译出，尽管它已经影响了广义的西方哲学，尤其是经由皮科·德拉·米兰多拉与斯宾诺莎这样的思想家。
    step2: |-
      拉比哈斯代·克雷斯卡斯（Hasdai Crescas，约 1340–1410/11）是阿拉贡犹太共同体的首领，在某种意义上也是整个西班牙系犹太人的首领——其时正值犹太史上最危急的时期之一。克雷斯卡斯是他那个时代最主要的拉比权威之一，[^note-1] 是阿拉贡犹太人的政治领袖，也是一位反基督教的哲学论辩家。作为中世纪主要犹太哲学家之一，他批判迈蒙尼德（Maimonides）的激进亚里士多德主义哲学及其若干哲学后嗣，痛斥各种亚里士多德学说不仅与犹太传统相抵触，也与对世界的真正经验性、理性的理解相抵触。克雷斯卡斯汇集传统犹太观点、各色亚里士多德来源、叛教者布尔戈斯的阿布内尔（Abner of Burgos）的新柏拉图主义思想以及十四世纪经院学者的新科学，创造出一个中世纪所知的、最具原创性的哲学观点与对亚里士多德主义的批判。他的哲学著作《上主之光》（*Or Hashem*）既是犹太思想的重要作品，也是对亚里士多德科学之批判的重要作品——正是这类批判推动了现代时期新科学的成长，而新科学可以说始于十四世纪。直到晚近，此书尚无任何西方语言的完整译本，尽管它已影响广义的西方哲学，尤其是经由皮科·德拉·米兰多拉（Pico della Mirandola）与斯宾诺莎（Spinoza）这样的思想家。
