      Some scholars understand these chapters as a departure from the deterministic opinion of Crescas.[^note-26] According to their interpretation, Crescas describes the true conscience of man, wherein the inner self can observe the actions of the deterministic external person and either be happy or unhappy with his or her actions. If the external person does something bad and the inner self is unhappy, it is not truly a sin because the true person does not want to sin. Instead, a deterministic process has coerced the external person into performing the act of sin against his conscience and his true will. According to this interpretation, the inner will of humans is under their control, but the regular will that decides their actions is the conclusion of a deterministic psychological process. Such is the usual interpretation, and in and of itself this interpretation is accurate. However other scholars understand these chapters as Crescas is that Crescas is not concerned here with finding a morsel of free choice in a highly deterministic world, but is rather addressing a very different problem: He only wants to answer the question of external obligation and the parallel issue of culpability. Back in the fifth chapter, Crescas had described punishment as a natural consequence of sin. After this rational assertion, it would seem that there is no logical difference between a voluntary and involuntary sin in terms of punishment.[^note-27] However, such a lack of moral distinction is unacceptable to Crescas. Therefore, in these chapters he wants to tell us, indeed reassure us, that an externally forced man doesn’t have any punishment for his sin (it is for certain that he is speaking to and about the Jews that were forcibly converted in 1391). According to these scholars in these chapters Crescas is not speaking about how man is ultimately distinct and free of determinist processes of the soul, but rather about how man through this determinist process wants to do good, yet due to some cause, external to the determinist psychologist processes, is forced to sin, and hence is not culpable — if indeed there was such a negative external cause that led to his sinning. Crescas thinks that the retribution of humans is a function of the interior psychological process of choice. If this process exists the man can be reattributed for his act. However if this process does not exist there is no retribution. The fact that choice and will are entirely deterministic in the view of Crescas has nothing to do with retribution. According to this opinion Crescas thinks that the use of will and choice are the criteria for retribution but are not free at all.
    step1: |-
      一些学者把这两章理解为对克雷斯卡斯决定论观点的偏离。[^note-26] 按他们的解释，克雷斯卡斯描述了人的真正良知：内在的自我可以观察决定论式的外在人格的行为，并对其行为感到满意或不满意。如果外在的人做了坏事而内在自我不满意，那就不算真正的罪，因为真正的人并不想犯罪。相反，一个决定论的过程迫使外在的人违背其良知与真实意志而施行罪行。按这一解释，人的内在意志在其控制之下，但决定其行动的常规意志是决定论式心理过程的结论。这是通常的解释，而这一解释本身是准确的。但其他学者把这两章理解为：克雷斯卡斯在此关心的并非在一个高度决定论的世界中寻找一小块自由选择，而是处理一个非常不同的问题：他只想回答外在义务的问题以及与之平行的罪责问题。在第五章中，克雷斯卡斯曾把惩罚描述为罪的自然后果。在这一理性主张之后，看来在惩罚方面，自愿之罪与非自愿之罪之间没有逻辑差异。[^note-27] 然而，这种道德区分的缺失对克雷斯卡斯来说是不可接受的。因此，在这两章中，他想告诉我们、确切地说是向我们保证：一个被外力强制的人不会因其罪而受任何惩罚（可以肯定，他是在对 1391 年被强制改宗的犹太人说话，并且说的是他们）。按这些学者的看法，在这两章中，克雷斯卡斯不是在说人如何最终区别于灵魂的决定论过程而获得自由，而是在说：人如何通过这一决定论过程想要行善，却由于某个外在于决定论心理过程的原因而被迫犯罪，因而不负有罪责——如果真的存在这样一个导致他犯罪的负面外在原因的话。克雷斯卡斯认为，人的报应取决于内在的心理选择过程。若这一过程存在，人就要为其行为被归责；若这一过程不存在，就没有报应。在克雷斯卡斯看来，选择与意志完全是决定论的，这一事实与报应无关。按这一观点，克雷斯卡斯认为意志与选择之运用是报应的判准，但它们根本不是自由的。
    step2: |-
      一些学者把这两章视为对克雷斯卡斯决定论立场的偏离。[^note-26] 依其解释，克雷斯卡斯在此描述人的真正良知：内在自我可以旁观决定论式的外在人格之所为，并对其行为或喜或忧。若外在之人作恶而内在自我不悦，那就并非真正的罪，因为真正的人并不愿犯罪；是决定论的过程迫使外在之人违背良知与真实意志而行此罪。按这一解释，人的内在意志在其掌控之中，而决定其行动的常规意志则是决定论式心理过程的结论。这是通常的解释，本身也准确。但另一些学者把这两章读作：克雷斯卡斯在此并不关心如何在高度决定论的世界中寻觅一寸自由选择，而是处理另一个迥异的问题——他只想回答外在义务的问题，以及与之平行的罪责问题。第五章中，克雷斯卡斯曾把惩罚说成罪的自然后果；这一理性主张既立，则在惩罚方面，自愿之罪与非自愿之罪似乎并无逻辑差异。[^note-27] 然而这种道德区分的阙如，克雷斯卡斯不能接受。故在这两章中，他要告诉我们——确切说是向我们保证：被外力强制的人，不因其罪受任何惩罚（可以肯定，他所对所言，正是 1391 年被强制改宗的犹太人）。按这些学者之见，克雷斯卡斯在此并非申说人如何终能区别于灵魂的决定论过程而得自由，而是申说：人如何经此决定论过程而愿行善，却因某个外在于该过程的原因而被迫犯罪，因而不负罪责——倘若真有这样一个导致其犯罪的负面外在原因。克雷斯卡斯认为，人的报应取决于内在的心理选择过程：此过程存在，人便须为其行为被归责；此过程不存在，即无报应。在他看来，选择与意志全然是决定论的，而这一事实与报应无关。按此说，克雷斯卡斯以意志与选择之运用为报应判准，却并不认为它们自由。
