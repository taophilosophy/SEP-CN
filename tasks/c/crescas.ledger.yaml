      1. The opinion that human attributes and divine attributes are common in essence but divergent in quantity. Crescas’s most probable source here is Gersonides.[^note-18]
      2. The infinity of the divine attributes both in number and in strength. His source here is probably Duns Scotus.
      3. The differentiation between the indefinable essence of God and the attributes that are related to that essence. His source for this position is the apostate Abner of Burgos.
    step1: |-
      1. 认为人的属性与神的属性本质相同而数量有别的观点。克雷斯卡斯此处最可能的来源是格森尼德斯。[^note-18]
      2. 神性属性在数量与力量两方面的无限性。其来源可能是邓斯·司各脱。
      3. 上帝不可定义的本质与关涉该本质的属性之间的区分。他这一立场的来源是叛教者布尔戈斯的阿布内尔。
    step2: |-
      1. 人的属性与神的属性本质相同而数量有别。此处最可能的来源是格森尼德斯。[^note-18]
      2. 神性属性在数量与力量上皆无限。其来源可能是邓斯·司各脱（Duns Scotus）。
      3. 区分上帝不可定义的本质与关涉该本质的属性。此一立场的来源是叛教者布尔戈斯的阿布内尔。
  - id: 33
    kind: body
    source: |-
      The three elements of this approach existed before Crescas in the writings of different thinkers, but no one had put them all together. In Crescas’s opinion, humans cannot understand the true essence of God, and nor can they speak of him but negatively (like the opinion of Maimonides). But according to Crescas, there is another kind of attribute: those that are relative to the divine essence. These attributes do not describe the divine essence, but they do describe things that always accompany the divine essence, in much the same way a flame accompanies a live coal. These attributes have the same essence as human attributes, but they are infinite in both number and strength. With this position Crescas pulls together the Aristotelian anti-Maimonidean opinion of Gersonides, Duns Scotus’s Franciscan critique of Aquinas’s understanding of Aristotle, and the Neo-Platonic opinion of Abner in his formulation of a new anti-Aristotelian critique of Maimonides (Sadik 2011)[^sadik-2011].
    step1: |-
      这一进路的三个要素在克雷斯卡斯之前已存在于不同思想家的著作中，但无人把它们全部合在一起。按克雷斯卡斯的观点，人无法理解上帝的真本质，也只能以否定的方式言说上帝（如迈蒙尼德的观点）。但按克雷斯卡斯的说法，还有另一种属性：相对于神性本质的属性。这些属性并不描述神性本质，但它们描述始终伴随神性本质的东西，正如火焰伴随着燃烧的煤。这些属性与人的属性本质相同，但它们在数量与力量上都是无限的。借助这一立场，克雷斯卡斯把格森尼德斯的反迈蒙尼德式亚里士多德观点、司各脱对阿奎那理解亚里士多德之方式的方济各会批判、以及阿布内尔的新柏拉图主义观点合为一体，形成一种新的反亚里士多德式、反迈蒙尼德的批判（Sadik 2011）[^sadik-2011]。
    step2: |-
      这一进路的三个要素，在克雷斯卡斯之前已散见于不同思想家，却无人将三者合炉。按克雷斯卡斯之见，人无法理解上帝的真本质，也只能以否定的方式言说上帝（一如迈蒙尼德之见）；但还存在另一种属性——相对于神性本质的属性：它们不描述神性本质，却描述始终伴随神性本质者，正如火焰伴随燃烧之煤。这类属性与人的属性本质相同，但在数量与力量上都无限。借此立场，克雷斯卡斯把格森尼德斯的反迈蒙尼德式亚里士多德观点、司各脱对阿奎那亚里士多德理解之方济各会批判、阿布内尔的新柏拉图主义观点熔于一炉，锻造出一种新的、反亚里士多德亦反迈蒙尼德的批判（Sadik 2011）[^sadik-2011]。
