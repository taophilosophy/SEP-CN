      This is without a doubt the major philosophical work (and indeed the magnum opus) of Crescas.[^note-11] This book was supposed to be the first part of a two-volume work that Crescas intended to write. The set was to be named *Ner Elohim* (Candle of God). The second book was to have been a work on Jewish law. The original aim of Crescas’s project was to counter the two major works of Maimonides by writing: I. A philosophical book against Maimonides’ *Guide of the Perplexed*. II. A legal book against his *Mishneh Torah*, in which Crescas would critique Maimonides’ legal method, and especially his lack of citations from earlier authorities. In fact, probably in part because of his communal role after 1391, he only had time to write the first book of the series, along with the general introduction to both volumes.
    step1: |-
      这无疑是克雷斯卡斯的主要哲学著作（亦是其集大成之作）。[^note-11] 这本书本应是克雷斯卡斯打算撰写的两卷本著作的第一部分。全书拟名为 *Ner Elohim*（《上帝之灯》）。第二卷本应是一部关于犹太律法的著作。克雷斯卡斯这一计划的原初目的，是通过写作两部书来对抗迈蒙尼德的两大著作：I. 一部反对迈蒙尼德《迷途指津》的哲学书。II. 一部反对其《重述托拉》（*Mishneh Torah*）的律法书，克雷斯卡斯将在其中批判迈蒙尼德的律法方法，尤其是他征引早期权威不足。事实上，大概部分由于其 1391 年之后的共同体职责，他只有时间写出这套书的第一部，以及两卷的总导言。
    step2: |-
      这无疑是克雷斯卡斯的主要哲学著作（亦是其 magnum opus）。[^note-11] 此书原拟为两卷本著作的第一部分，全书拟名《上帝之灯》（*Ner Elohim*）；第二卷本应写犹太律法。克雷斯卡斯这一计划的原初目的，是以两部书对抗迈蒙尼德的两大著作：一为哲学书，以及对迈蒙尼德的《迷途指津》（*Guide of the Perplexed*）；一为律法书，以及对其《重述托拉》（*Mishneh Torah*），克雷斯卡斯将在其中批判迈蒙尼德的律法方法，尤其是他疏于征引早期权威。事实上，大约部分由于 1391 年之后的共同体职责，他只有余暇写出这套书的第一部，以及两卷共用的总导言。
