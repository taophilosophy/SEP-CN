      Jewish philosophy: As has been pointed out, Crescas was considered the major leader of the Jewish community of Aragon and to a certain extent all of Spanish Jewry (It should be noted that at the time, the Spanish Jewish community was the biggest in the Jewish world.). He was both the most important political leader and one of the major legal authorities of his time. A significant proportion of the major rabbis in Aragon in the generation following Crescas were in fact his immediate pupils or people within his circle of scholars.[^note-31] Crescas was also one of the most original Jewish philosophers in the Middle Ages. His critiques of Aristotelian science and of the Maimonidean integration of Aristotelianism into Judaism have an honored place in the history of the disintegration of the influence of Aristotle – a disintegration that laid the groundwork for the development of a new science. These kinds of critiques were very popular in the Renaissance and at the beginning of the modern period. Additionally, in the majority of the subjects that Crescas deals with, his opinion is closer to the traditional point of view than is Maimonides’ opinion. But contrary to what we might have expected from this situation, Crescas did not create an important Jewish current of thought as did Maimonides and the Kabbala. The majority of his direct students and of the people in his circle came back to either a different kind of Aristotelian view or else a regular traditional point of view, and did not continue Crescas’s philosophical project.
    step1: |-
      犹太哲学：正如已经指出的，克雷斯卡斯被视为阿拉贡犹太共同体——以及在某种程度上全西班牙系犹太人——的主要领袖（应当指出，当时西班牙犹太共同体是犹太世界中最大的）。他既是当时最重要的政治领袖，也是主要的律法权威之一。克雷斯卡斯之后一代中阿拉贡的相当一部分主要拉比，实际上都是他的直接弟子或他学术圈子内的人。[^note-31] 克雷斯卡斯也是中世纪最具原创性的犹太哲学家之一。他对亚里士多德科学、以及对迈蒙尼德把亚里士多德主义融入犹太教之做法的批判，在亚里士多德影响解体史上有光荣的位置——而这种解体为新科学的发展奠定了基础。这类批判在文艺复兴和现代时期之初非常流行。此外，在克雷斯卡斯处理的多数主题上，他的观点比迈蒙尼德的观点更接近传统看法。但与我们从这一情形所可能预期的相反，克雷斯卡斯并未像迈蒙尼德和喀巴拉那样开创一个重要的犹太思想潮流。他的大多数直接弟子与圈内人，后来都回到了另一种亚里士多德观点或寻常的传统观点，而没有继续克雷斯卡斯的哲学事业。
    step2: |-
      犹太哲学方面：如前所述，克雷斯卡斯被视为阿拉贡犹太共同体——某种程度上也是整个西班牙系犹太人——的主要领袖（应当指出，当时西班牙犹太共同体是犹太世界中最大的）。他既是当时最重要的政治领袖，也是主要律法权威之一；克雷斯卡斯之后一代阿拉贡的主要拉比，相当一部分正是他的直接弟子或学术圈内之人。[^note-31] 他同时是中世纪最具原创性的犹太哲学家之一。他对亚里士多德科学、以及对迈蒙尼德把亚里士多德主义融入犹太教之做法的批判，在亚里士多德影响解体史上占有尊荣位置——而这一解体为新科学的发展奠定了基础；此类批判在文艺复兴与现代时期之初甚为流行。此外，在克雷斯卡斯处理的多数主题上，其观点都比迈蒙尼德更近传统。然而与由此可能预期者相反，克雷斯卡斯并未像迈蒙尼德与喀巴拉那样开创一个重要的犹太思想流派。其大多数直接弟子与圈内人，后来都回到另一种亚里士多德观点或寻常的传统立场，未曾延续他的哲学事业。
