      In the early stage of his writing[^note-16] Crescas accepted the opinion of Maimonides that the attributes of God do not have any relation to the attributes of humans, and indeed Crescas defended this position against the arguments of Gersonides. But in the later stage Crescas constructed a new opinion. This final opinion serves as an exemplar of Crescas’s use of compilation from different sources with the goal of constructing a new and original theory.[^note-17]
    step1: |-
      在其写作的早期阶段，[^note-16] 克雷斯卡斯接受迈蒙尼德的观点：上帝的属性与人的属性没有任何关系；事实上，克雷斯卡斯还针对格森尼德斯的论证为这一立场辩护。但在后期阶段，克雷斯卡斯建构了一种新观点。这一最终观点堪称克雷斯卡斯从不同来源汇编材料以建构一种新颖而原创的理论的范例。[^note-17]
    step2: |-
      写作的早期阶段，[^note-16] 克雷斯卡斯接受迈蒙尼德之说：上帝的属性与人的属性毫无关系；他事实上还针对格森尼德斯（Gersonides）的论证为这一立场辩护。但在后期，他建构出一种新说。这一最终观点，堪称克雷斯卡斯杂取诸源、熔铸新论的范例。[^note-17]
