      The book known by the name “Refutation of Christian Principles” (we don’t know the original name of this work). This book was originally written in Catalan around 1397–1398, and is available only in the medieval Hebrew translation of Rabbi Josef Ibn Shem Tov[^note-8] and in modern English and Spanish translations of the Hebrew. The target audience of the Catalan work is probably the Jews of Aragon who didn’t read Hebrew, and the Jewish descendants of the conversos of 1391. In his book, Crescas critiques ten principles of the Christian faith: 1. Original sin. 2. The liberation from this sin. 3. The Trinity. 4. Incarnation. 5. The virginity of Maria. 6. Transubstantiation. 7. Baptism. 8. The coming of the Messiah. 9. The new laws. 10. Demons.
    step1: |-
      这本书以“驳基督教诸原理”之名传世（我们不知道原书名）。该书原作以加泰罗尼亚语写于约 1397–1398 年，现存仅有约瑟夫·伊本·谢姆·托夫拉比的中世纪希伯来语译本[^note-8]以及据该译本而来的现代英译与西班牙语译本。这部加泰罗尼亚语著作的预期读者，大概是阿拉贡不读希伯来语的犹太人，以及 1391 年改宗者的犹太后裔。在书中，克雷斯卡斯批判基督教信仰的十条原理：1. 原罪。2. 从此罪中的解放。3. 三位一体。4. 道成肉身。5. 玛利亚的童贞。6. 变体论。7. 洗礼。8. 弥赛亚的降临。9. 新律法。10. 魔鬼。
    step2: |-
      此书以“驳基督教诸原理”（*Refutation of Christian Principles*）之名传世，原书名已不可考。原作以加泰罗尼亚语写于约 1397–1398 年，今仅存约瑟夫·伊本·谢姆·托夫拉比（Rabbi Josef Ibn Shem Tov）的中世纪希伯来语译本，[^note-8] 以及据此而来的现代英译与西班牙语译本。这部加泰罗尼亚语著作的预期读者，大概是阿拉贡不读希伯来语的犹太人，以及 1391 年改宗者的犹太后裔。书中，克雷斯卡斯批判基督教信仰的十条原理：1. 原罪；2. 从此罪中得解放；3. 三位一体；4. 道成肉身；5. 玛利亚的童贞；6. 变体论；7. 洗礼；8. 弥赛亚的降临；9. 新律法；10. 魔鬼。
