      1. The existence of God (and relevant topics like his unity, his attributes, etc.). This is the foundation of all religious belief.[^note-14]
      2. The six foundations of the law, without which the existence of the Torah (and in general of all revealed law) is impossible (*Or Hashem*, 123). These six foundations are:
      3. God’s knowledge of all things in existence (including all particulars)
      4. God’s providence
      5. God’s power
      6. Prophecy
      7. Free will
      8. The purpose of the Torah
      9. Obligatory beliefs. The existence of the Torah is possible without them, but if someone denies them he is a heretic. There are eight general beliefs in the obligatory category:
      10. The creation of the world
      11. The survival of the soul after death
      12. Reward and Punishment (as per degree of conformity to the divine commandments)
      13. Resurrection
      14. The eternity of the Torah
      15. The prophetic stature of Moses
      16. The *Urim and Tumim* (a mystical tool of the High Priest through which he could ask God questions)
      17. The Messiah There are three specific obligatory beliefs related to special religious obligations:
      18. Prayer and the priestly benediction
      19. Repentance
      20. Rosh Hashana, The Fast of Kippur and the three pilgrimage festivals.
      21. Fourteen beliefs for which the Torah does not clearly establish what the correct opinions are. Regarding these beliefs Crescas explores the different options and tries, using the interpretation of the traditional Jewish sources together with philosophical enquiry, to establish the correct view.
