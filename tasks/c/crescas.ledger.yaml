      In the third part of the second essay, Crescas analyzes the true meaning of these three beliefs and asks whether we can prove them. He comes to the conclusion that he can prove the existence of God. In his opinion the only way to prove the existence of God is via the need for a first cause. If every single thing in the universe is caused, their existence is only possible (just as is their inexistence) and so we need a first cause that necessitates their existence as opposed to their non-existence.[^note-15]
    step1: |-
      在第二篇第三部分中，克雷斯卡斯分析这三项信念的真正含义，并追问我们能否证明它们。他的结论是：他可以证明上帝的存在。在他看来，证明上帝存在的唯一途径是通过对第一因的需要。如果宇宙中每一件事物都是被造成的，那么它们的存在就只是可能的（恰如它们的不存在也是可能的），因此我们需要一个第一因，它使它们的存在而非不存在成为必然。[^note-15]
    step2: |-
      第二篇第三部分，克雷斯卡斯分析这三项信念的真义，并追问它们可否被证明。他的结论是：上帝的存在可以证明。在他看来，证明上帝存在的唯一途径，是诉诸对第一因的需要。倘若宇宙中每一事物皆是被造成的，其存在便只是可能（其不存在亦然）；于是我们需要一个第一因，使它们的存在而非不存在成为必然。[^note-15]
