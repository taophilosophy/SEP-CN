      In the aftermath of the tumultuous events surrounding the 1391 riots against the Jews in Spain a considerable portion of the Jewish population in Spain underwent conversion to Christianity. From the early 15th century until the Expulsion of 1492, the Spanish Jewish community coexisted with the conversos, marking a unique period in which a Jewish community lived in close proximity to a population of converts. Crescas emerged as the inaugural Jewish philosopher and community leader to grapple with this inherently challenging new circumstance. It is evident that some of his original philosophical tenets bear profound implications for the relationship between the Jewish community and the conversos. Crescas posited that the primary criterion for religious perfection resides in human decision and sentiment, specifically, the love of God. This characterization of religious perfection as independent of human actions, such as adherence to commandments (as posited by Rabbi Yehuda Halevi) or acquisition of knowledge (as proposed by Maimonides and his adherents), offers conversos the prospect of achieving religious perfection as Jews even while outwardly living as converts. Given the constraints faced by conversos in adhering to Jewish commandments and engaging in an in-depth study of Jewish sources and philosophy, the assertions by prominent Jewish thinkers predating Crescas that religious perfection is contingent on the observance of commandments (Halevi) or the pursuit of knowledge (Maimonides) may have been disheartening for conversos. Such individuals may have perceived an insurmountable barrier to leading a profoundly religious life as Jews, potentially resulting in discouragement and a proclivity towards Christianity, especially for those unwilling or unable to relocate to a setting where they could openly practice Judaism. Even the more devout Jewish conversos likely lost incentive to transmit any semblance of Jewish identity to their offspring. Moreover, Crescas emphasized that the performance of a few Jewish commandments by conversos would yield significant religious reward, considering the associated costs and dangers. Conversely, the obligatory observance of Christian rituals is deemed by Crescas and his student Albo to lack meaningful religious significance. With this perspective, which is likely to resonate with the majority of conversos, Crescas also articulated a stern critique of those conversos who embraced Christianity (Sadik 2021)[^sadik-2021].
    step1: |-
      在 1391 年西班牙反犹暴乱这一动荡事件的余波中，西班牙相当一部分犹太人口改宗了基督教。从十五世纪初直到 1492 年的驱逐，西班牙犹太共同体与改宗者共处，这标志着犹太共同体与改宗者群体比邻而居的一个独特时期。克雷斯卡斯是第一位着手应对这一内蕴艰难的新处境的犹太哲学家与共同体领袖。显然，他的某些原创哲学信条对犹太共同体与改宗者的关系有深远意涵。克雷斯卡斯主张，宗教完善的首要判准在于人的抉择与情感，具言之即对上帝的爱。这种把宗教完善界定为独立于人的行为——如遵行诫命（如耶胡达·哈列维拉比所主张）或获取知识（如迈蒙尼德及其追随者所主张）——的说法，为改宗者提供了前景：即便外表上过改宗者的生活，也能作为犹太人达到宗教完善。鉴于改宗者在遵行犹太诫命、深入研究犹太来源与哲学方面所受的限制，克雷斯卡斯之前那些著名犹太思想家关于宗教完善取决于遵守诫命（哈列维）或追求知识（迈蒙尼德）的主张，可能令改宗者沮丧。这类人或许觉得自己作为犹太人过一种深切宗教的生活有着不可逾越的障碍，结果可能导致灰心以及对基督教的倾向，尤其是那些不愿或不能迁往可公开奉行犹太教之处的人。即便更虔诚的犹太改宗者，大概也失去了把任何犹太认同的痕迹传给后代的动力。此外，克雷斯卡斯强调，鉴于相关的代价与危险，改宗者履行少数几条犹太诫命也会产生可观的宗教奖赏。反过来说，克雷斯卡斯及其弟子阿尔博认为，强制遵行基督教礼仪并无有意义的宗教意义。以这一大概会引起多数改宗者共鸣的立场，克雷斯卡斯还对那些拥抱基督教的改宗者作了严厉批判（Sadik 2021）[^sadik-2021]。
    step2: |-
      1391 年西班牙反犹暴乱这一动荡的余波之中，西班牙相当一部分犹太人口改宗基督教。自十五世纪初至 1492 年驱逐，西班牙犹太共同体与改宗者（conversos）共处，构成犹太共同体与改宗者群体比邻而居的一段独特时期。克雷斯卡斯是第一位着手应对这一内蕴艰难之新处境的犹太哲学家与共同体领袖。他的一些原创哲学信条，显然对犹太共同体与改宗者的关系有深远意涵。克雷斯卡斯主张，宗教完善的首要判准在于人的抉择与情感，具体言之即对上帝的爱。把宗教完善界定为独立于人的行为——既不同于遵行诫命（耶胡达·哈列维拉比〔Rabbi Yehuda Halevi〕之说），也不同于获取知识（迈蒙尼德及其追随者之说）——便为改宗者开出前景：纵然外表上过着改宗者的生活，仍可作为犹太人达致宗教完善。改宗者在遵行犹太诫命、深研犹太典籍与哲学上备受限制；相形之下，克雷斯卡斯之前那些著名犹太思想家所谓宗教完善取决于遵守诫命（哈列维）或追求知识（迈蒙尼德）之说，于改宗者或为打击。此辈或觉作为犹太人过一种深切宗教的生活障碍不可逾越，遂至灰心而倾向基督教——对于那些不愿或不能迁往可公开奉行犹太教之地者，尤为如此。即便较为虔诚的犹太改宗者，大概也失去了把犹太认同的任何痕迹传给后代的动力。此外，克雷斯卡斯强调：鉴于其间代价与危险，改宗者履行少数几条犹太诫命，也会产生可观的宗教奖赏；反之，强制遵行基督教礼仪，在克雷斯卡斯及其弟子阿尔博看来并无有意义的宗教意义。以此一大概能引起多数改宗者共鸣的立场，克雷斯卡斯还对那些拥抱基督教的改宗者严加批判（Sadik 2021）[^sadik-2021]。
