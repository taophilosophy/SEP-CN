      Crescas devotes an important portion of the sixth part of the second essay to the question of the soul’s essence.[^note-29] The general subject of this part is the goal of the Torah, which is for Crescas also the goal of humanity and of the entire world. In this discussion, Crescas speaks of the different goals that the Torah fulfills. The Torah helps people to fulfill their different worldly goals, such as their relation to themselves (health, morality, etc.), to their family, and to their country. In this part of the essay, Crescas’s explanation is close to Maimonides’ rational explanation of the divine commandments. But the Torah also helps humans to get a spiritual reward in the hereafter. On the subject of the essence of the soul along with reward and punishment after death, Crescas builds a philosophical critique of the Maimonidean-Aristotelian opinion and proposes instead a more traditional view.
    step1: |-
      克雷斯卡斯把第二篇第六部分的重要篇幅用于讨论灵魂本质的问题。[^note-29] 这一部分的总体主题是《托拉》的目的，而在克雷斯卡斯看来，这也是人类与整个世界的目的。在这一讨论中，克雷斯卡斯谈到《托拉》所实现的各种目的。《托拉》帮助人实现其不同的世俗目的，如与自身的关系（健康、道德等）、与家庭的关系、与国家的关系。在本文这一部分，克雷斯卡斯的解释接近迈蒙尼德对神诫的理性解释。但《托拉》也帮助人在来世获得精神奖赏。关于灵魂本质以及死后赏罚的问题，克雷斯卡斯对迈蒙尼德—亚里士多德式观点提出哲学批判，转而提出一种更传统的看法。
