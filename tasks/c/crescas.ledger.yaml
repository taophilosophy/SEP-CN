      We know that *Or Hashem* was written over a long period of Crescas’s life – no less than fifteen years, and perhaps more. Because of his communal activity, Crescas didn’t finish the final edition of the book himself. Due to the extended period of writing, we can see the development of his thought in the different parts of the work. In some cases, as with the attributes of God, there are some contradictions between the different layers of the book’s development. Additionally, the pupil who edited the last edition of the book introduced some changes and additions with the goal of unifying Crescas’s seemingly opposing positions while moderating his openly radical opinions.[^note-12] Examples of these kinds of additions are clearly visible in the question of free will, and are found especially in the Florence manuscript.
