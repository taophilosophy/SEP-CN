      In this short book, which is a based on a sermon that Crescas probably gave on the night of Passover, he explores his opinion about some philosophical questions regarding the subject of the basis of belief in miracles.[^note-5] These questions arise because of the description of the different miracles experienced by the Jews in Egypt. The first question asksif belief is an act of free will, or if the miracle in fact obliges the believer to believe in it (and in the idea that the miracle worker wants to prove through the miracle). After this question, Crescas addresses the subject of the essence of miracles, the essence of free will, and the relation between free will and reward and punishment. The sermon’s conclusion is also the only legalist work of Crescas in our possession.
    step1: |-
      在这部短书中——它基于克雷斯卡斯大概在逾越节之夜所作的一次布道——他探讨了自己对若干哲学问题的看法，这些问题关涉信仰奇迹之根据的主题。[^note-5] 这些问题的产生，是因为《圣经》描述了犹太人在埃及经历的种种奇迹。第一个问题问：信仰是否是自由意志的行为，还是奇迹实际上强制信仰者相信它（以及奇迹施行者想借奇迹证明的观念）。在此问题之后，克雷斯卡斯讨论了奇迹的本质、自由意志的本质，以及自由意志与赏罚的关系。这篇布道的结论也是我们所拥有的克雷斯卡斯唯一的律法著作。
