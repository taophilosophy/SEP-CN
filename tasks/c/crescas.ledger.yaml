      Modern scholars have given a number of explanations for this phenomenon, most prominent of which is the disintegration of Spanish Jewry caused by the pogrom of 1391 and the persecutions at the beginning of the 15ᵗʰ century. Because of this disintegration, the Spanish Jewish community did not integrate the new and original mode of thinking of Crescas, and instead went back after his death to different more traditional opinions. Another explanation is that his opinions were ahead of their time, and people (including his own pupils) did not completely understand them. Another explanation attributes the general rejection of Crescas to his citation of Christian scholars, and especially the apostate Abner of Burgos. According to this opinion, the Jewish community knew Abner’s ideas and was dismayed by Crescas’s utilization of the apostate’s views.[^note-32] Some scholars also claim that the major goal of Crescas was to refute the Aristotelian interpretation of Judaism, so following the collapse of this interpretation, caused by the general fall of Aristotle, there was simply no more need for Crescas’s critiques. Perhaps the most probable explanation is that Crescas did not realize his original project of writing another legalistic book against the *Mishneh Torah* of Maimonides. If Crescas had written this book, he probably would have become not only one of the major Jewish philosophers, but also one of the major legal authorities of both his generation and succeeding generations. The combination of legal works, philosophical tracts, and political leadership was undoubtedly of great help to the philosophical reception of Maimonides within Judaism.
    step1: |-
      现代学者对这一现象给出了若干解释，其中最突出的是 1391 年大屠杀与十五世纪初迫害所造成的西班牙犹太人的解体。由于这一解体，西班牙犹太共同体未能吸纳克雷斯卡斯新颖而原创的思维方式，反而在他死后回到了不同的、更为传统的观点。另一种解释是，他的观点超前于其时代，人们（包括他自己的弟子）没有完全理解它们。还有一种解释把克雷斯卡斯之普遍被拒归于他引用基督教学者、尤其是叛教者布尔戈斯的阿布内尔。按这一看法，犹太共同体了解阿布内尔的思想，并对克雷斯卡斯利用叛教者的观点感到不安。[^note-32] 一些学者还主张，克雷斯卡斯的主要目的是驳斥对犹太教的亚里士多德式解释，因此随着这一解释在亚里士多德普遍衰落中崩塌，克雷斯卡斯的批判便再无需要。或许最可能的解释是：克雷斯卡斯未能实现其原初计划，即再写一部反对迈蒙尼德《重述托拉》（*Mishneh Torah*）的律法书。如果克雷斯卡斯写了这部书，他大概不仅会成为主要犹太哲学家之一，还会成为他那一代及后代的主要律法权威之一。律法著作、哲学论著与政治领导三者的结合，无疑大大有助于迈蒙尼德哲学在犹太教内部的接受。
    step2: |-
      现代学者对这一现象给出了若干解释，最突出者，是 1391 年大屠杀与十五世纪初迫害所造成的西班牙犹太人解体。经此解体，西班牙犹太共同体未能吸纳克雷斯卡斯新颖而具原创性的思维方式，反而在他身后回到不同的、更为传统的观点。另一种解释是：他的观点超前于时代，人们（包括他自己的弟子）未能完全领会。还有一种解释把他之普遍被拒归于其征引基督教学者，尤其是叛教者布尔戈斯的阿布内尔——按此说，犹太共同体了解阿布内尔的思想，对克雷斯卡斯取用叛教者之说深感不安。[^note-32] 亦有学者主张：克雷斯卡斯的主要目的是驳斥对犹太教的亚里士多德式解释，而随着这一解释在亚里士多德普遍失势中崩解，他的批判便再无需要。或许最可能的解释是：克雷斯卡斯未能实现其原初计划，即再写一部反对迈蒙尼德《重述托拉》的律法书。若此书得成，他大概不仅会成为主要犹太哲学家之一，还会成为他那一代及后代的主要律法权威之一；律法著作、哲学论著与政治领导三者兼备，无疑大大有助于迈蒙尼德哲学在犹太教内部的接受。
