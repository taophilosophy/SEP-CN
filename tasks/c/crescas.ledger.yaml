      10. 世界的创造
      11. 灵魂在死后继续存在
      12. 赏与罚（依与神诫相符的程度）
      13. 复活
      14. 《托拉》的永恒性
      15. 摩西的先知地位
      16. 乌陵与土明（大祭司的一种神秘工具，借之可向上帝求问）
      17. 弥赛亚
      此外还有三项与特殊宗教义务相关的特定必信信念：
      18. 祈祷与祭司的祝福
      19. 悔改
      20. 新年节、赎罪日斋与三大朝圣节
      21. 十四项《托拉》未明确规定正确观点的信念。关于这些信念，克雷斯卡斯探讨各种选项，并试图借助对传统犹太来源的解释与哲学探究，确立正确的观点。
    step2: |-
      1. 上帝的存在（及其独一性、属性等相关主题）。这是一切宗教信仰的基础。[^note-14]
      2. 律法的六项基础；无此六者，《托拉》——以及一般而言一切启示律法——便无由存在（《上主之光》，123）。此六项基础为：
      3. 上帝对一切存在之物的知识（包括一切个别事物）；
      4. 上帝的护佑；
      5. 上帝的大能；
      6. 预言；
      7. 自由意志；
      8. 《托拉》的目的。
      9. 必须相信的信念。无之，《托拉》的存在仍属可能；但若有人否认，即为异端。此类必信信念共八项普遍者：
      10. 世界的创造；
      11. 灵魂死后继续存在；
      12. 赏与罚（依与神诫相符之程度）；
      13. 复活；
