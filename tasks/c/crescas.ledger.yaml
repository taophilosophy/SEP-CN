      ## 5. The question of choice and free will
    step1: |-
      ## 5. 选择与自由意志问题
    step2: |-
      ## 5. 选择与自由意志问题
  - id: 53
    kind: body
    source: |-
      Crescas devotes the sixth part of the second essay to the question of free will.[^note-24] Crescas begins this sixth part by explaining why the lack of choice can be so problematic for pious Jews: The Torah is based on the commandments of God to man, yet these commandments do not seem to make any sense if humans do not have control over their actions. After all, why should God tell humans what to do if He knows that they have to break the law? It would seem that a robust freedom of choice is essential to maintaining the significance of God’s commandments. Nevertheless, the pious Crescas does not accept this reasoning. To refute the above supposition while maintaining the relevance of the commandments, Crescas uses the first four chapters of Part Six to develop an uncompromising determinism that lives in harmony with human choice and a system of reward and punishment that are restricted to the realm of personal feelings and self-judgment. Ironically, in developing his theory of choice, Crescas quotes frequently from Abner’s book *Ofrenda de Zelos* (without citing him by name).
    step1: |-
      克雷斯卡斯把第二篇第六部分用来讨论自由意志问题。[^note-24] 他以解释缺乏选择何以对虔诚的犹太人如此成问题，来开始第六部分：《托拉》以上帝对人的诫命为基础，但若人不能控制自己的行为，这些诫命似乎就毫无意义。毕竟，如果上帝知道人必会违法，何必还告诉人该做什么？看来，一种强健的选择自由，对于维护上帝诫命的意义至关重要。然而，虔诚的克雷斯卡斯并不接受这一推理。为了在维护诫命相关性的同时驳斥上述假定，克雷斯卡斯用第六部分前四章发展出一种不折不扣的决定论，它与人的选择协调一致；同时又发展出一套赏罚体系，其范围仅限于个人感受与自我判断之内。具有讽刺意味的是，在阐发其选择理论时，克雷斯卡斯频繁引用阿布内尔的著作《热忱的奉献》（*Ofrenda de Zelos*），却不提其名。
    step2: |-
      克雷斯卡斯把第二篇第六部分用来讨论自由意志。[^note-24] 他先解释：缺乏选择何以便对虔诚的犹太人如此棘手——《托拉》以上帝对人的诫命为据，而人若不能控制自身行为，这些诫命似乎就毫无意义。毕竟，上帝既知人必违法，何必再吩咐人当行何事？看来，强健的选择自由对维护神诫之意义不可或缺。然而虔诚的克雷斯卡斯并不接受这一推理。为在维护诫命相关性的同时驳倒上述假定，他用第六部分前四章发展出一种不折不扣的决定论：它与人的选择并行不悖，而赏罚体系则被限定在个人感受与自我判断的范围之内。讽刺的是，阐发其选择理论时，克雷斯卡斯频繁引用阿布内尔的著作《热忱的奉献》（*Ofrenda de Zelos*），却不称其名。
