      In this book, Crescas deals with the subject of free will in a less profound manner than in his philosophical magnus opum *Or Hashem*, but his opinions here do not contradict his opinion in *Or Hashem*. The difference between the two books on this subject can be attributed to the development of the thought of Crescas. According to one view, the sermon represents an anterior stage of Crescas and *Or Hashem* a posterior one (*Sermon on the Passover*, pp. 34–68). Another explanation of these differences could be the difference of style between the two books (a sermon versus a profound philosophical tract). The difference between the two books is clearer with regard to the question of the essence of miracles. Crescas’s opinion in his sermon is that miracles by themselves don’t oblige people to believe in something (as opposed to rational proofs that oblige belief). The reason for inherent doubt in the validity of any given miracle is that the people cannot be sure that God and not a human is the author of the miracle. In *Or Hashem* (P. 312) Crescas asserts the opposite position. Humans cannot do miracles by themselves.[^note-6] This is the reason that Crescas claims that the miracle is the best way to verify if a prophet is a true one or an impostor.[^note-7] This difference between the two works is a very good argument for the opinion that the sermon is anterior to *Or Hashem*. Ravitzky has said that in the sermon, Crescas followed the ideas of Rabbi Nissim Girondi, his teacher who believed in the possibility of men performing miracles, while years later, in *Or Hashem*, Crescas retreated from this opinion and now held that only God could perform miracles.
    step1: |-
      在这本书中，克雷斯卡斯处理自由意志问题的方式不如在其哲学巨著《上主之光》中深刻，但他在这里的观点与《上主之光》中的观点并不矛盾。两书在这一主题上的差异可以归于克雷斯卡斯思想的发展。按一种观点，布道代表克雷斯卡斯的前期，《上主之光》代表后期（《逾越节布道》，34–68 页）。对这些差异的另一种解释是两书文体的差异（布道与深刻的哲学论著）。就奇迹本质的问题而言，两书的差异更为明显。克雷斯卡斯在布道中的观点是：奇迹本身并不强制人们相信什么（与强制信仰的理性证明相对）。任何特定奇迹之有效性存在固有怀疑的原因在于：人们无法确定奇迹的作者是上帝而非人。在《上主之光》（312 页）中，克雷斯卡斯主张相反的立场：人凭自身不能行奇迹。[^note-6] 正因如此，克雷斯卡斯主张奇迹是检验先知为真先知还是骗子的最佳途径。[^note-7] 两部著作之间的这一差异，是布道先于《上主之光》这一观点的极好论证。拉维茨基说过，在布道中，克雷斯卡斯遵循其师赫罗尼的拉比尼西姆的思想——后者相信人行奇迹的可能性；而多年之后，在《上主之光》中，克雷斯卡斯放弃了这一观点，转而认为唯有上帝能行奇迹。
