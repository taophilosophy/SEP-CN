      Regarding the two latter chapters of Part Six, my opinion differs from that of most scholars. In these chapters Crescas tries to answer the question of whether there is a difference between people that sin happily and those who are forced to sin and feel sad about doing their evil actions. Crescas also addresses the question of the obligation of various beliefs. These chapters are not based on the determinist book of Abner, and Ravitzky thinks that they are anterior to the other chapters and exist almost verbatim in the Passover sermon.[^note-25]
