      ### 4.2 物质的定义
  - id: 45
    kind: body
    source: |-
      In Aristotle’s opinion, all actual matter exists with certain properties like dimension, quality (cold, warm, humid and dry) and weight. Crescas distinguishes between the different properties. In his opinion there are three different levels of material existence.[^note-22] Matter in and of itself has no properties. The body is the unification of matter and dimensionality (i.e. matter in corporeal form). It is possible that a pure body without any other quality has actual existence. The third level of material existence is the unification of the corporeal form (matter) with some other unique form. This latter unification affords matter the additional properties of weight and quality.
    step1: |-
      按亚里士多德的看法，一切现实物质都带有某些属性，如维度、质（冷、热、湿、干）与重量。克雷斯卡斯把这些不同的属性区分开来。在他看来，物质存在有三个不同的层次。[^note-22] 物质自身没有任何属性。物体是物质与维度性的统一（即以有形形式存在的物质）。一个不带任何其它性质的纯粹物体可能拥有现实存在。物质存在的第三个层次是有形形式（物质）与某种其它独特形式的统一。后一种统一赋予物质重量与质这两个附加属性。
    step2: |-
      按亚里士多德之见，一切现实物质都带有某些属性：维度、质（冷、热、湿、干）与重量。克雷斯卡斯将这些属性区分开来。在他看来，物质存在有三个层次。[^note-22] 物质自身没有任何属性；物体是物质与维度性的统一（即以有形形式存在的物质）；一个不带任何其它性质的纯粹物体，可以拥有现实存在；物质存在的第三个层次，是有形形式（物质）与某种独特形式的统一——后者赋予物质重量与质两项附加属性。
  - id: 46
    kind: body
    source: |-
      One example of the way that Crescas uses this new definition is to refute the proofs of Aristotle against the existence of infinity. In Aristotle’s opinion, two bodies cannot share the same space because of the property of dimension. The Greek philosopher concludes from this observation the impossibility of the existence of a void. The definition of a void is dimensional space without matter inside. Now if matter can fill a void, and matter itself has dimensions, then it follows that the dimensions of the matter can go inside the dimensions of the void. Aristotle concludes that this cannot be, for if dimensions can be shared, then we have to assume that two physical bodies could be in the same place at the same time — an absurdity that would lead to other apparent absurdities, such as the entire world fitting inside a grain of mustard.
    step1: |-
      克雷斯卡斯运用这一新定义的一个例子，是驳斥亚里士多德反对无限存在诸证明。按亚里士多德的看法，两个物体不能共享同一空间，因为维度是一种属性。这位希腊哲人由这一观察得出虚空不可能存在的结论。虚空的定义是其中无物的维度性空间。现在，如果物质可以填入虚空，而物质自身又有维度，那么物质的维度就能进入虚空的维度。亚里士多德断定这不可能，因为如果维度可以共享，我们就必须假定两个物理物体可以同时同地存在——一个荒谬，它还会引出其它显然的荒谬，比如整个世界装进一粒芥子。
    step2: |-
      克雷斯卡斯运用这一新定义的一个例子，是驳斥亚里士多德反对无限存在的诸证明。按亚里士多德之见，两个物体不能共享同一空间，因为维度是物体的属性。这位希腊哲人由此得出虚空不可能存在的结论——虚空的定义是其中无物的维度性空间。那么，若物质可填入虚空，而物质自身又有维度，则物质的维度便可进入虚空的维度。亚里士多德断定这不可能：若维度可以共享，就必须假定两个物理物体可同时同地存在——一谬既出，余谬随之，比如整个世界装进一粒芥子。
  - id: 47
    kind: body
    source: |-
      Crescas refutes these proofs with his new definition of the different levels of material existence. In his opinion, only the common existence of matter and dimension cause the impermeability of the body. A body (matter and dimension) can go inside a void (only dimension), but not inside another body. In this argument we see Crescas utilize the work of the Jewish apostate Abner. Abner explained the birth of Jesus (and transubstantiation) by the argument that Jesus is body without dimension and can go inside other bodies. Abner separated the different properties of a body from the body itself for both a philosophical goal (to prove that infinity exists) and a theological goal (to strengthen certain Christian dogmas). Crescas refutes this possibility by explaining the difference between a body that has both matter and dimension and therefore cannot go inside another such body and pure matter. Crescas distinguishes all properties only from matter and not from bodies. In this way, Crescas can utilize Abner’s critiques of Aristotelian science without accepting the theological implications. (See Sadik 2008 for Abner’s opinions.)[^sadik-2008]
    step1: |-
      克雷斯卡斯以他关于物质存在不同层次的新定义驳斥这些证明。在他看来，只有物质与维度的共同存在才造成物体的不可透入性。一个物体（物质与维度）可以进入一个虚空（仅有维度），但不能进入另一个物体。在这一论证中，我们看到克雷斯卡斯利用犹太叛教者阿布内尔的著作。阿布内尔以如下论证解释耶稣的诞生（以及变体论）：耶稣是没有维度的物体，可以进入其它物体。阿布内尔把物体的诸属性从物体本身分离出来，既有哲学目的（证明无限存在），也有神学目的（强化某些基督教教义）。克雷斯卡斯通过解释兼有物质与维度的物体不能进入另一此类物体与纯粹物质之间的区别，驳斥了这种可能性。克雷斯卡斯把一切属性仅仅同物质相区分，而不同物体相区分。这样，克雷斯卡斯就能利用阿布内尔对亚里士多德科学的批判，而不接受其神学意涵。（阿布内尔的观点见 Sadik 2008。）[^sadik-2008]
    step2: |-
      克雷斯卡斯以其关于物质存在层次的新定义驳斥这些证明。在他看来，唯有物质与维度的共同存在才造成物体的不可透入：物体（物质＋维度）可进入虚空（仅有维度），却不能进入另一个物体。在这一论证中，可见克雷斯卡斯对犹太叛教者阿布内尔著作的取用：阿布内尔以此解释耶稣的诞生（以及变体论）——耶稣是没有维度的物体，故可进入其它物体。阿布内尔把物体的诸属性从物体本身剥离，既有哲学目的（证明无限存在），也有神学目的（强化某些基督教教义）。克雷斯卡斯通过区分兼有物质与维度的物体（不能进入另一此类物体）与纯粹物质，驳斥了这种可能。他把一切属性仅仅同物质相区分，而不同物体相区分。如此，克雷斯卡斯便可利用阿布内尔对亚里士多德科学的批判，而不接受其神学意涵。（阿布内尔的观点见 Sadik 2008。）[^sadik-2008]
