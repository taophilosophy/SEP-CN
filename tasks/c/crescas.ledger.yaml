      我们知道，《上主之光》是在克雷斯卡斯一生中很长的一段时期内写成的——不少于十五年，或许更久。由于他的共同体活动，克雷斯卡斯未能亲自完成此书的定本。由于写作期漫长，我们可以在该书各部分看到其思想的发展。在某些情况下，例如上帝的属性问题，书中不同发展层次之间存在一些矛盾。此外，编辑此书最后一版的弟子引入了一些改动与增补，目的是统一克雷斯卡斯看似对立的立场，同时缓和其公开的激进观点。[^note-12] 这类增补的例子在自由意志问题上清晰可见，尤其见于佛罗伦萨抄本。
