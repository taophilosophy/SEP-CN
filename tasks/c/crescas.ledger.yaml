    source: |-
      Crescas is not a part of the very limited group of medieval Jewish philosophers whose major philosophical works have been translated into Latin (in particular Maimonides, Rabbi Isaac Israeli, and Rabbi Shlomo Ibn Gabirol). The non-Jewish occidental philosopher had no possibility of direct access to any of his works until the very recent translation of Or Hashem into French. Despite this fact, his philosophical opinions influenced occidental philosophy, especially through their adoption by two important authors: Pico della Mirandola and Spinoza. Pico translated some of Crescas’s critiques on Aristotelian science in his book *Examen Vanitas Doctrinae Gentium*, and it is possible that Crescas may have influenced some of the Italian philosopher’s other opinions as well. The main influence of Crescas on general occidental philosophy is undoubtedly via his influence on Spinoza. Spinoza, himself Jewish, probably studied *Or Hashem* as a young student, for Crescas’s book had a profound influence on his opinions. Indeed, Crescas is one the few medieval philosophers that Spinoza quotes with sympathy.[^note-33] There is some controversy among Spinoza scholars regarding the subject of the influence of Jewish thought on Spinoza’s opinions, but it is very probable that Crescas had a significant influence on at least two of his most important views: the essence of God and determinism. We can conclude that in spite of the lack of direct influence, Crescas definitely had an important indirect influence on occidental philosophy, especially via his influence on Spinoza.
    step1: |-
      克雷斯卡斯不属于那个极为有限的中世纪犹太哲学家群体——其主要哲学著作已被译为拉丁文（尤其是迈蒙尼德、伊萨克·以色列拉比与所罗门·伊本·加比罗罗拉比）。直到晚近《上主之光》法译本问世之前，非犹太的西方哲学家没有任何直接接触其任何著作的可能。尽管如此，他的哲学观点仍影响了西方哲学，尤其是通过两位重要作者的采纳：皮科·德拉·米兰多拉与斯宾诺莎。皮科在其著作《异教徒学说之虚荣的检验》中翻译了克雷斯卡斯对亚里士多德科学的一些批判，而且克雷斯卡斯也可能影响了这位意大利哲学家的其它一些观点。克雷斯卡斯对一般西方哲学的主要影响，无疑是通过他对斯宾诺莎的影响。斯宾诺莎本人是犹太人，大概年轻时研读过《上主之光》，因为克雷斯卡斯的书对其观点有深刻影响。事实上，克雷斯卡斯是斯宾诺莎以同情态度引用的少数中世纪哲学家之一。[^note-33] 斯宾诺莎研究者之间就犹太思想对斯宾诺莎观点之影响这一主题存在一些争议，但克雷斯卡斯很可能至少对斯宾诺莎两个最重要的观点有显著影响：上帝的本质与决定论。我们可以总结说：尽管缺乏直接影响，克雷斯卡斯无疑对西方哲学有重要的间接影响，尤其是通过他对斯宾诺莎的影响。
    step2: |-
      克雷斯卡斯不属于那个极为有限的中世纪犹太哲学家群体——其主要哲学著作已译为拉丁文（尤其是迈蒙尼德、伊萨克·以色列拉比与所罗门·伊本·加比罗罗拉比）。直到晚近《上主之光》法译本问世之前，非犹太的西方哲学家无从直接接触其任何著作。尽管如此，他的哲学观点仍影响了西方哲学，尤其是经由两位重要作者的采纳：皮科·德拉·米兰多拉与斯宾诺莎。皮科在《异教徒学说之虚荣的检验》中移译了克雷斯卡斯对亚里士多德科学的一些批判，或许还受其影响而持有其它某些观点。克雷斯卡斯对一般西方哲学的主要影响，无疑经由斯宾诺莎：斯宾诺莎本人是犹太人，大概年轻时即研读过《上主之光》，因为克雷斯卡斯之书对其观点影响甚深。事实上，克雷斯卡斯是斯宾诺莎以同情笔调引用的少数中世纪哲学家之一。[^note-33] 斯宾诺莎研究者就犹太思想对其观点之影响尚有争议，但克雷斯卡斯很可能至少显著影响了斯宾诺莎两个最重要的观点：上帝的本质与决定论。可以说，尽管缺乏直接影响，克雷斯卡斯无疑对西方哲学有重要的间接影响，尤其是经由他对斯宾诺莎的影响。
