  - id: 3
    kind: body
    source: |-
      Crescas was born in Barcelona to a revered family of merchants and rabbis around 1340. In the first period of his life (i.e. before 1391) Crescas lived in Aragon during a relatively quiet period for the Jews. He learned in the yeshiva (Jewish academy) of the town, which was headed by Rabbi Nissim of Gerondi. In this yeshiva, Crescas learned not only the traditional Jewish corpus of Bible, Talmud, and the other parts of the Oral Law, but also Kabbala, science, and philosophy, including the Jewish philosophy of Maimonides and his followers as well as classical philosophy and perhaps even Christian scholastics.[^note-2]
    step1: |-
      克雷斯卡斯约于 1340 年生于巴塞罗那一个受人尊敬的商人与拉比世家。其人生第一阶段（即 1391 年之前），克雷斯卡斯生活在阿拉贡犹太人相对平静的时期。他在该城的犹太经学院（yeshiva）学习，学院由赫罗纳的拉比尼西姆主持。在这所经学院里，克雷斯卡斯不仅学习传统的犹太文献——《圣经》、《塔木德》与口传律法的其他部分——还学习喀巴拉、科学与哲学，包括迈蒙尼德及其追随者的犹太哲学，以及古典哲学，或许还有基督教经院学者。[^note-2]
    step2: |-
      克雷斯卡斯约于 1340 年生于巴塞罗那一个受人尊敬的商人与拉比世家。其人生第一阶段（即 1391 年之前），阿拉贡的犹太人正处于相对平静的岁月。克雷斯卡斯在该城的犹太经学院（yeshiva）学习，学院由赫罗纳的尼西姆拉比（Rabbi Nissim of Gerondi）主持。在这所经学院里，他不仅修习传统犹太文献——《圣经》、《塔木德》与口传律法的其余部分——还修习喀巴拉（Kabbala）、科学与哲学：既包括迈蒙尼德及其追随者的犹太哲学，也包括古典哲学，或许还有基督教经院学术。[^note-2]
  - id: 4
    kind: body
    source: |-
      We know that by the year 1370 Crescas was a proficient young scholar, a Talmudist, and a judge in Barcelona. Following the death of Rabbi Nissim of Gerondi, Crescas and his friend Rabbi Isaac bar Sheshet (Ribash) became the main Jewish authorities of Aragon, and possibly of all Spain. People from all over the occidental Jewish World would ask them legalist questions (Harvey 2010, 20)[^harvey-2010]. In 1387, Pierre the Fourth of Aragon died, and his son Juan became the new king. This king and his French queen, Violant de Bar, loved culture, and their palace in Saragossa became the center of culture and science. In this palace Crescas could have met Bernard Matege, a humanist employed as the court scribe. Through him, Crescas may have become aware of the humanist movement in Italy, and indeed Warren Harvey has speculated that there was a considerable amount of mutual influence between the two intellectuals.[^note-3] In 1389, Crescas left Barcelona and became the rabbi of the capital of the crown of Aragon: Saragossa. A year later the King and Queen appointed him as the highest judge of all the Jews in the crown, and bestowed him with a high degree of authority over the Jewish community.
    step1: |-
      我们知道，到 1370 年，克雷斯卡斯已是熟练的青年学者、塔木德学者和巴塞罗那的法官。赫罗纳的拉比尼西姆去世后，克雷斯卡斯与其友人伊萨克·巴·谢谢特拉比（Ribash）成为阿拉贡——或许也是全西班牙——最主要的犹太权威。西方犹太世界各地的民众会向他们提出律法问题（Harvey 2010, 20）[^harvey-2010]。1387 年，阿拉贡的佩德罗四世去世，其子胡安继位。这位国王与其法国王后巴尔的维奥兰特热爱文化，他们在萨拉戈萨的宫廷成为文化与科学的中心。在这座宫廷里，克雷斯卡斯可能结识了受聘为宫廷文书的人文主义者贝尔纳·马特赫。经由他，克雷斯卡斯可能了解了意大利的人文主义运动；事实上，沃伦·哈维曾推测这两位知识分子之间存在相当多的相互影响。[^note-3] 1389 年，克雷斯卡斯离开巴塞罗那，出任阿拉贡王权首都萨拉戈萨的拉比。一年后，国王与王后任命他为王权治下全体犹太人的最高法官，并授予他对犹太共同体的极大权威。
    step2: |-
      我们知道，到 1370 年，克雷斯卡斯已是成熟的青年学者、塔木德学者，并任巴塞罗那的法官。赫罗纳的尼西姆拉比去世后，克雷斯卡斯与其友人伊萨克·巴·谢谢特拉比（Isaac bar Sheshet，通称 Ribash）成为阿拉贡——或许也是全西班牙——最主要的犹太权威，西方犹太世界各地的人都向他们提出律法问题（Harvey 2010, 20）[^harvey-2010]。1387 年，阿拉贡的佩德罗四世（Pedro IV）去世，其子胡安（Juan）继位。这位国王与其法国王后巴尔的维奥兰特（Violant de Bar）热爱文化，他们在萨拉戈萨（Saragossa）的宫廷遂成文化与科学中心。在这座宫廷里，克雷斯卡斯可能结识了受聘为宫廷文书的、人文主义者贝尔纳·马特赫（Bernard Matege）；经由他，克雷斯卡斯或许得知了意大利的人文主义运动。事实上，沃伦·哈维（Warren Harvey）曾推测这两位知识分子之间有相当多的相互影响。[^note-3] 1389 年，克雷斯卡斯离开巴塞罗那，出任阿拉贡王权之都萨拉戈萨的拉比。一年后，国王与王后任命他为王权治下全体犹太人的最高法官，并授予他对犹太共同体的极大权威。
  - id: 5
    kind: body
    source: |-
      The pogroms of 1391 had a decisive influence on the life of Crescas and on the entire Spanish Jewish community.[^note-4] In those pogroms thousands of Jews perished and around a hundred fifty thousand converted to Christianity. The pogroms began in Castilla, but the rioters crossed the Aragon border. Almost half of the Jews of Spain after 1391 became Christian. Aragon’s major Jewish communities in Barcelona, Valencia and Gerona disappeared. A son of Crescas died in Barcelona, and the yeshiva of Barcelona, one of the most important in the Middle Ages, disappeared. In the Crown of Aragon, the King and Queen tried to save the Jews and to prevent the pogrom, but they were successful only in Aragon, whereas the communities of Valencia, Catalonia and the Baleares Island were destroyed. Amongst the reasons for the success of the pogrom in Castilla was the fact that the king was a child at the time and the Castilian government was inefficient.
    step1: |-
      1391 年的大屠杀对克雷斯卡斯的一生和整个西班牙犹太共同体都有决定性的影响。[^note-4] 在那些大屠杀中，成千上万的犹太人丧生，约十五万人改宗基督教。大屠杀始于卡斯蒂利亚，但暴乱者越过了阿拉贡边界。1391 年之后，西班牙的犹太人几乎有一半成了基督徒。阿拉贡在巴塞罗那、巴伦西亚与赫罗纳的主要犹太共同体消失了。克雷斯卡斯的一个儿子死在巴塞罗那，巴塞罗那的经学院——中世纪最重要的经学院之一——也不复存在。在阿拉贡王权之下，国王与王后力图保护犹太人、阻止大屠杀，但他们只在阿拉贡境内成功，巴伦西亚、加泰罗尼亚与巴利阿里群岛的共同体则被摧毁。大屠杀在卡斯蒂利亚得逞的原因之一，是国王当时尚年幼，卡斯蒂利亚政府效率低下。
    step2: |-
      1391 年的大屠杀（pogroms）对克雷斯卡斯的一生和整个西班牙犹太共同体都有决定性的影响。[^note-4] 在那些屠杀中，成千上万的犹太人丧生，约十五万人改宗基督教。屠杀始于卡斯蒂利亚（Castilla），但暴徒越过了阿拉贡边界。1391 年之后，西班牙的犹太人几乎半数成了基督徒；阿拉贡在巴塞罗那、巴伦西亚（Valencia）与赫罗纳（Gerona）的主要犹太共同体湮灭无存。克雷斯卡斯的一个儿子死在巴塞罗那，巴塞罗那的经学院——中世纪最重要的经学院之一——也不复存在。在阿拉贡王权之下，国王与王后力图保护犹太人、阻止屠杀，但他们只在阿拉贡境内得手；巴伦西亚、加泰罗尼亚与巴利阿里群岛的共同体则被摧毁。屠杀在卡斯蒂利亚得逞的原因之一，是国王当时尚在冲龄，卡斯蒂利亚政府又效率低下。
  - id: 6
    kind: body
    source: |-
      After these events, Crescas became the leader of the Spanish community in its fight to survive. With the help of the King and Queen of Aragon, he tried to restore the Jewish community of Barcelona (without success). He helped *converso* Jews who wanted to come back to Judaism to leave Spain for Muslim countries in North Africa. He ultimately wanted to find a safer place for the Spanish Jews, possibly in the Kingdom of Navarre.
    step1: |-
      这些事件之后，克雷斯卡斯成为西班牙共同体求生存斗争的领袖。在阿拉贡国王与王后的帮助下，他力图重建巴塞罗那的犹太共同体（未果）。他帮助想回归犹太教的 *converso* 改宗者离开西班牙，前往北非的穆斯林国家。他最终想为西班牙犹太人寻找一个更安全的居所，可能在纳瓦拉王国。
    step2: |-
      这些事件之后，克雷斯卡斯成为西班牙共同体求存斗争的领袖。在阿拉贡国王与王后的帮助下，他力图重建巴塞罗那的犹太共同体（未果）；他帮助想要回归犹太教的 *converso*（改宗者）离开西班牙，前往北非的穆斯林国家；他还想为西班牙犹太人寻找一个更安全的居所——可能在纳瓦拉（Navarre）王国。
