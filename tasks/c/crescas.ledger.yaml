      Regarding the topic of soul’s essence, Crescas holds a platonic opinion: The soul naturally continues its life after its separation from the body. The reason for this immortality of the soul is that the soul is a spiritual substance with a potential for knowledge. As a spiritual substance, the soul has no opponent between its different parts and any causes of loss. In his proofs that this definition of the soul is right, Crescas critiques the different opinions of Aristotelianism. The main stream of the medieval Arab Aristotelian opinion on this topic (apart from Ibn Sina) is that only human knowledge can survive the death of the body. But there are very different opinions in the Aristotelian school about this subject. An example of this divergence is the opinion of Gersonides, who understands that the knowledge of immaterial law accords the possibility of life after death for the individual. In spite of this, Averroes (as Crescas understand his view) claims that no individual immortal existence is possible after death (all the knowledge of all people returns to its source in the active intellect). In his critique of the Aristotelian opinions, Crescas uses the different arguments[^note-30] that diverse Aristotelians attack each other with to ultimately refute all Aristotelian opinions.
    step1: |-
      关于灵魂本质这一主题，克雷斯卡斯持柏拉图式观点：灵魂与身体分离之后自然地继续其生命。灵魂之所以不死，是因为灵魂是一种具有知识潜能的精神实体。作为精神实体，灵魂的各部分之间没有对立者，也没有任何致其丧失的原因。在证明这一定义正确时，克雷斯卡斯批判了亚里士多德主义的各种观点。中世纪阿拉伯亚里士多德派在这一主题上的主流观点（伊本·西那除外）是：只有人的知识能在身体死后留存。但亚里士多德学派内部在这一主题上观点极为分歧。格森尼德斯的观点即是这种分歧之一例：他认为对非物质律法的知识赋予个体死后生命的可能。尽管如此，阿威罗伊（按克雷斯卡斯的理解）主张，死后不可能有个别的不朽存在（所有人的一切知识都回归其源头，即能动理智）。在批判亚里士多德诸观点时，克雷斯卡斯利用不同亚里士多德派互相攻击时所用的各种论证，[^note-30] 最终驳倒一切亚里士多德观点。
