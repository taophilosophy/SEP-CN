      在批判亚里士多德派在这些主题上的立场时，克雷斯卡斯试图为他所认为的传统犹太观点建构一种哲学辩护。他先试图证明亚里士多德派的观点在哲学上是错误的，然后论证他所认为的传统观点在哲学上是真的。这一对犹太亚里士多德派观点的批判，是克雷斯卡斯较重要的成就之一。在犹太正统共同体中，履行诫命是宗教生活中最重要的方面。在迈蒙尼德看来，大多数诫命（以及一切实践性诫命）只是达到哲学知识这一人类努力最高目标的中间环节。从传统的观点看，这是迈蒙尼德较成问题的方面之一。通过批判亚里士多德派观点，克雷斯卡斯为他所认为的传统观点——诫命是达到最高宗教与精神目标的途径——建构了一种辩护。
