      It was noted above that Cassirer’s early historical works interpret the development of modern thought as a whole (embracing both philosophy and the sciences) from the perspective of the philosophical principles of Marburg neo-Kantianism, as initially articulated in [Cohen 1871][^cohen-1871]. On the “genetic” conception of scientific knowledge, in particular, the a priori synthetic activity of thought – the activity Kant himself had called “productive synthesis” – is understood as a temporal and historical developmental process in which the object of science is gradually and successively constituted as a never completed “X” towards which the developmental process is converging. For Cohen, this process is modelled on the methods of the infinitesimal calculus (in this connection, especially, see [Cohen 1883])[^cohen-1883]. Beginning with the idea of a continuous series or function, our problem is to see how such a series can be a priori generated step-by-step. The mathematical concept of a differential shows us how this can be done, for the differential at a point in the domain of a given function indicates how it is to be continued on succeeding points. The differential therefore infinitesimally captures the rule of the series as a whole, and thus expresses, at any given point or moment of time, the general form of the series valid for all times,
    step1: |
      上文已指出，卡西尔的早期历史著作从马堡新康德主义哲学原理的视角来阐释现代思想的整体发展（涵盖哲学与科学两方面），这些原理最初表述于 [Cohen 1871][^cohen-1871]。尤其按“发生论的”科学知识观，思想的先天综合活动——康德本人称之为“生产性综合”的活动——被理解为一种时间性、历史性的发展过程，在这一过程中，科学之对象被逐渐而相继地构成为一个永不完成的“X”，发展过程正朝着它收敛。对柯亨而言，这一过程以无穷小微积分的方法为范本（在这方面尤其参见 [Cohen 1883]）[^cohen-1883]。从一个连续序列或函数出发，我们的问题在于弄清这样一个序列如何能先天地一步步生成。微分的数学概念向我们展示了这如何能做到，因为一个给定函数定义域中某一点上的微分，指示着它如何在后续各点上被延续。因此，微分以无穷小方式把握了整个序列的规则，从而在任一给定点或时刻，表达着该序列对一切时刻都有效的一般形式，
