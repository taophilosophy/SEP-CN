      In 1919 Cassirer was finally offered professorships at two newly founded universities at Frankfurt and Hamburg under the auspices of the Weimar Republic. He taught at Hamburg from 1919 until emigrating from Germany in 1933. During these years Cassirer completed his three-volume *Philosophy of Symbolic Forms* [Cassirer 1923, 1925, 1929b], which broke fundamental new ground beyond the neo-Kantianism of the Marburg School and articulated his own original attempt to unite scientific and non-scientific modes of thought (“symbolic forms”) within a single philosophical vision. In 1928 Cassirer offered a defense of Weimar [Cassirer 1929a] at the University’s celebration of the tenth anniversary of the Republic, and in 1929–30 he served as the rector of the University, as the first Jew to hold such a position in Germany. In the Spring of 1929 Cassirer took part in a famous disputation with Martin Heidegger in Davos, Switzerland, where Heidegger explicitly took Cohen’s neo-Kantianism as a philosophical target and defended his radical new conception of an “existential analytic of Dasein” in the guise of a parallel interpretation of the philosophy of Kant [Heidegger 1929][^heidegger-1929]. Cassirer, for his part, defended his own new understanding of Kant in the philosophy of symbolic forms – against Heidegger’s insistence on the ineluctability of human finitude – by appealing to genuinely objectively valid, necessary and eternal truths arising in both moral experience and mathematical natural science (see [Friedman 2000] [Gordon 2010])[^friedman-2000][^gordon-2010].
    step1: |
      1919 年，在魏玛共和国支持下，卡西尔终于获得法兰克福与汉堡两所新创大学的教授职位。他自 1919 年起在汉堡执教，直至 1933 年离开德国。在这些年间，卡西尔完成了三卷本《符号形式哲学》（*Philosophy of Symbolic Forms*）[Cassirer 1923, 1925, 1929b]，该书在马堡学派新康德主义之外开辟了根本性的新天地，并表达了他自己那种独创的尝试：把科学性的与非科学性的思维方式（“符号形式”）统一在单一哲学视野之中。1928 年，卡西尔在该大学纪念共和国成立十周年的庆典上为魏玛辩护 [Cassirer 1929a]，并于 1929 至 1930 年间担任该大学校长，成为德国第一位担任此职的犹太人。1929 年春，卡西尔在瑞士达沃斯参加了与马丁·海德格尔的一场著名论辩；在那里海德格尔明确把柯亨的新康德主义当作哲学靶子，并以对康德哲学的平行解释为外衣，为“此在的存在论分析”这一激进的崭新观念辩护 [Heidegger 1929][^heidegger-1929]。卡西尔这边则为他自己在符号形式哲学中对康德的新理解辩护——针对海德格尔对人类有限性之不可避免的坚持——方法是诉诸道德经验与数学自然科学中同样出现的、真正客观有效、必然而永恒的真（参见 [Friedman 2000] [Gordon 2010]）[^friedman-2000][^gordon-2010]。
