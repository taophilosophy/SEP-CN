      Cassirer’s next important contribution to scientific epistemology [Cassirer 1921] explores the relationship between Einstein’s general theory of relativity and the “critical” (Marburg neo-Kantian) conception of knowledge. Cassirer argues that Einstein’s theory in fact stands as a brilliant confirmation of this conception. On the one hand, the increasing use of abstract mathematical representations in Einstein’s theory entirely supports the attack on Aristotelian abstractionism and philosophical empiricism. On the other hand, however, Einstein’s use of non-Euclidean geometry presents no obstacle at all to our purified and generalized form of (neo-)Kantianism. For we no longer require that any particular mathematical structure be fixed for all time, but only that the historical-developmental sequence of such structures continuously converge. Einstein’s theory satisfies this requirement perfectly well, since the Euclidean geometry fundamental to Newtonian physics is indeed contained in the more general geometry (of variable curvature) employed by Einstein as an approximate special case (as the regions considered become infinitely small, for example). Moritz Schlick published a review of Cassirer’s book immediately after its first appearance [Schlick 1921][^schlick-1921], taking the occasion to argue (what later became a prominent theme in the philosophy of logical empiricism) that Einstein’s theory of relativity provides us with a decisive refutation of Kantianism in all of its forms. This review marked the beginnings of a respectful philosophical exchange between the two, as noted above, and it was continued, in the context of Cassirer’s later work on the philosophy of symbolic forms, in [Cassirer 1927b] (see [Friedman 2000, chap. 7])[^friedman-2000].
    step1: |
      卡西尔对科学认识论的下一项重要贡献 [Cassirer 1921] 探讨了爱因斯坦的广义相对论与“批判的”（马堡新康德主义的）知识观之间的关系。卡西尔论证说，爱因斯坦的理论实际上是对这一观念的光辉确证。一方面，爱因斯坦理论中日益增多的抽象数学表征运用，完全支持了对亚里士多德抽象论与哲学经验论的攻击。另一方面，爱因斯坦对非欧几何的运用却对我们的（新）康德主义的精炼而一般化的形式毫无障碍。因为我们不再要求任何特定的数学结构被永恒固定，只要求这类结构的历史-发展序列持续收敛。爱因斯坦的理论完全满足这一要求，因为牛顿物理学所依据的欧几里得几何确实作为近似特例包含于爱因斯坦所采用的更一般的（变曲率）几何之中（例如，当所考虑的区域变得无限小时）。莫里茨·石里克在卡西尔这部著作问世后立即发表书评 [Schlick 1921][^schlick-1921]，借机论证说（这一点后来成为逻辑经验主义哲学的一个突出主题）爱因斯坦的相对论为我们提供了对一切形式的康德主义的决定性反驳。如前所述，这篇书评标志着两人之间相互尊重的哲学交流的开端，而这一交流在卡西尔后来关于符号形式哲学的著作语境中，于 [Cassirer 1927b] 得到延续（参见 [Friedman 2000, chap. 7]）[^friedman-2000]。
