      Cassirer must thus be ranked as one of the very greatest intellectual historians of the twentieth-century – and, indeed, as one of the founders of this discipline as it came to be practiced after 1900. He continued to contribute to intellectual history broadly conceived throughout his career (most notably, perhaps, in his fundamental studies of the Renaissance and the Enlightenment [Cassirer 1927a, 1932]), and he had a major influence on intellectual history throughout the century. Aside from the history of science (see above), Cassirer also decisively influenced intellectual historians more generally, including, notably, the eminent intellectual and cultural historian Peter Gay and the distinguished art historian Erwin Panofsky (see, e.g., [Gay 1977], [Panofsky 1939])[^gay-1977][^panofsky-1939]. As we shall see below, intellectual (and later cultural) history is an integral part of Cassirer’s distinctive philosophical methodology, so that, in his case, the standard distinction between “historical” and “systematic” work in philosophy ends up looking quite artificial.
    step1: |
      因此，卡西尔必须被列为二十世纪最伟大的思想史家之一——而且事实上是这一学科在 1900 年后逐渐实践时的一位奠基者。他在整个学术生涯中持续为广义的思想史作出贡献（其中最引人注目的或许是他关于文艺复兴与启蒙运动的基础性研究 [Cassirer 1927a, 1932]），并且对整个世纪的思想史都有重大影响。除科学史外（见上文），卡西尔也决定性地影响了更一般意义上的思想史家，其中尤著者是杰出的思想史与文化史家彼得·盖伊（Peter Gay）与著名艺术史家欧文·潘诺夫斯基（Erwin Panofsky）（参见，例如 [Gay 1977]、[Panofsky 1939]）[^gay-1977][^panofsky-1939]。我们下面会看到，思想史（以及后来的文化史）是卡西尔独特哲学方法论的组成部分，因此就他而言，哲学中“历史性”工作与“体系性”工作的标准区分最终显得颇为人为。
