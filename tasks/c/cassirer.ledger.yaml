      As indicated above, Cassirer’s first writings were largely historical in character – including a discussion of Leibniz’s philosophy in its scientific context [Cassirer 1902] and a large-scale work on the history of modern thought from the Renaissance through Kant, *Das Erkenntnisproblem in der Philosophie und Wissenschaft der neueren Zeit* [Cassirer 1906, 1907a]. The latter, in particular, is a magisterial and deeply original contribution to both the history of philosophy and the history of science. It is the first work, in fact, to develop a detailed reading of the scientific revolution as a whole in terms of the “Platonic” idea that the thoroughgoing application of mathematics to nature (the so-called mathematization of nature) is the central and overarching achievement of this revolution. And Cassirer’s insight was explicitly acknowledged by such seminal intellectual historians as E. A. Burtt, E. J. Dijksterhuis, and Alexandre Koyré, who developed this theme later in the century in the course of establishing the discipline of history of science as we know it today (see, e.g., [Burtt 1925], [Koyré 1939], [Dijksterhuis 1959])[^burtt-1925][^dijksterhuis-1959][^koyré-1939]. Cassirer, for his part, simultaneously articulates an interpretation of the history of modern philosophy as the development and eventual triumph of what he calls “modern philosophical idealism.” This tradition takes its inspiration, according to Cassirer, from idealism in the Platonic sense, from an appreciation for the “ideal” formal structures paradigmatically studied in mathematics, and it is distinctively modern in recognizing the fundamental importance of the systematic application of such structures to empirically given nature in modern mathematical physics – a progressive and synthetic process wherein mathematical models of nature are successively refined and corrected without limit. For Cassirer, it is Galileo, above all, in opposition to both sterile Aristotelian-Scholastic formal logic and sterile Aristotelian-Scholastic empirical induction, who first grasped the essential structure of this synthetic process; and the development of “modern philosophical idealism” by such thinkers as Descartes, Spinoza, Gassendi, Hobbes, Leibniz, and Kant then consists in its increasingly self-conscious philosophical articulation and elaboration.
    step1: |
      如上所述，卡西尔最初的著作大体上是历史性的——其中包括对莱布尼茨哲学及其科学语境的讨论 [Cassirer 1902]，以及一部关于从文艺复兴到康德的现代思想史的大型著作《近代哲学与科学中的认识问题》（*Das Erkenntnisproblem in der Philosophie und Wissenschaft der neueren Zeit*）[Cassirer 1906, 1907a]。后者尤其对哲学史与科学史都是一项权威而极具原创性的贡献。事实上，它是第一部从“柏拉图式”观念出发详细解读整个科学革命的著作；这一观念认为，把数学彻底运用于自然界（所谓自然的数学化）是这场革命核心而统摄性的成就。卡西尔的洞见得到 E. A. 伯特（E. A. Burtt）、E. J. 戴克斯特霍伊斯（E. J. Dijksterhuis）与亚历山大·柯瓦雷（Alexandre Koyré）等开创性思想史家明确承认，他们在本世纪稍晚时候发展了这一主题，并在确立我们今天所知的科学史学科的过程中做到了这一点（参见，例如 [Burtt 1925]、[Koyré 1939]、[Dijksterhuis 1959]）[^burtt-1925][^dijksterhuis-1959][^koyré-1939]。卡西尔这边则同时表达了一种对现代哲学史的阐释，把它视为他所称“现代哲学唯心论”的发展与最终胜利。据卡西尔，这一传统从柏拉图意义上的唯心论中汲取灵感，来自对数学中所典范研究的“观念性”形式结构的欣赏，并且它之所以具有典型的现代性，在于认识到把这类结构系统地应用于现代数学物理学中经验给定的自然界所具有的根本重要性——这是一个进步而综合的过程，其中关于自然的数学模型被无限地不断精炼与修正。对卡西尔而言，正是伽利略——与贫乏的亚里士多德-经院形式逻辑和贫乏的亚里士多德-经院经验归纳相对立——最先把握了这一综合过程的本质结构；而“现代哲学唯心论”经由笛卡尔、斯宾诺莎、伽桑狄、霍布斯、莱布尼茨与康德等思想家的进一步发展，则在于其日益自觉的哲学阐发与精微化。
