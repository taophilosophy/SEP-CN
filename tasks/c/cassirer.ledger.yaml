      Cassirer emphasizes the kinship between his *Philosophy of Symbolic Forms* and Hegel’s *Phenomenology of Spirit* in the Prefaces to both the second (1925) and third (1929) volumes. Recent commentators ([Skidelsky 2008] [Moss 2015])[^moss-2015][^skidelsky-2008] have illuminatingly built on this circumstance in further articulating the relationship between Cassirer and Hegel. Considerable light is shed on this relationship by Cassirer’s treatment of the problem of the *Naturwissenschaften* and *Geisteswissenschaften* in *The Logic of the Cultural Sciences* (1942). We shall return to this situation in the next section.
    step1: |
      卡西尔在《符号形式哲学》第二卷（1925）与第三卷（1929）的序言中都强调他的著作与黑格尔《精神现象学》之间的亲缘关系。晚近评论者（[Skidelsky 2008] [Moss 2015]）[^moss-2015][^skidelsky-2008] 就这一情形作了富有启发的引申，进一步阐明卡西尔与黑格尔的关系。卡西尔在《文化科学的逻辑》（1942）中对自然科学（*Naturwissenschaften*）与精神科学（*Geisteswissenschaften*）问题的处理，为这一关系投下相当多的光亮。我们将在下一节回到这一情形。
    step2: |
