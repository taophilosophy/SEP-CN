      After his emigration Cassirer spent two years lecturing at Oxford and then six years at the University of Göteborg in Sweden. During this time he developed his most sustained discussion of morality and the philosophy of law as a study of the Swedish legal philosopher Axel Hägerström [Cassirer 1939a] (see [Krois 1987, chap. 4])[^krois-1987]. He also articulated his major statement on the relationship between the natural sciences and the “cultural sciences” [Cassirer 1942], which contained, among other things, an explicit rejection of Rudolf Carnap’s “physicalism” (see [Friedman 2000, chap. 7])[^friedman-2000]. Cassirer, like so many German émigrés during this period (including Carnap) then finally settled in the United States. He taught at Yale from 1941 to 1944 and at Columbia in 1944–45. During these years he produced two books in English [Cassirer 1944, 1946], where the first, *An Essay on Man*, serves as a concise introduction to the philosophy of symbolic forms (and thus Cassirer’s distinctive philosophical perspective) as a whole and the second, *The Myth of the State*, offers an explanation of the rise of fascism on the basis of Cassirer’s conception of mythical thought. Two important American philosophers were substantially influenced by Cassirer during these years: Arthur Pap, whose work on the “functional a priori” in physical theory [Pap 1946][^pap-1946] took shape under Cassirer’s guidance at Yale, and Susanne Langer, who promulgated Cassirer’s philosophy of symbolic forms in aesthetic and literary circles (see, e.g., [Langer 1942])[^langer-1942]. Cassirer’s American influence thus embraced both sides of his philosophical personality. One can only speculate on what this influence might have been if his life had not been cut short suddenly by a heart attack while walking on the streets of New York City on April 13, 1945.
    step1: |
      移居国外后，卡西尔在牛津讲学两年，随后在瑞典哥德堡大学（University of Göteborg）任教六年。在此期间，他写出了自己对道德与法哲学最绵长的论述，形式是对瑞典法哲学家阿克塞尔·哈格斯特伦（Axel Hägerström）的研究 [Cassirer 1939a]（参见 [Krois 1987, chap. 4]）[^krois-1987]。他还阐明了关于自然科学与“文化科学”之关系的主要论述 [Cassirer 1942]，其中包含对鲁道夫·卡尔纳普（Rudolf Carnap）之“物理主义”的明确拒绝（参见 [Friedman 2000, chap. 7]）[^friedman-2000]。卡西尔与这一时期许多德国流亡者（包括卡尔纳普）一样，最终定居美国。他于 1941 至 1944 年在耶鲁任教，1944 至 1945 年在哥伦比亚任教。这些年里他用英文写出两部著作 [Cassirer 1944, 1946]：第一部《人论》（*An Essay on Man*）作为对整个符号形式哲学（亦即卡西尔独特哲学视角）的简明导论；第二部《国家神话》（*The Myth of the State*）则依据卡西尔的神话思维概念对法西斯主义的兴起作出解释。两位重要的美国哲学家在这几年深受卡西尔影响：阿瑟·帕普（Arthur Pap），其关于物理理论中“功能先验”的著作 [Pap 1946][^pap-1946] 是在卡西尔耶鲁时期的指导下成形的；以及苏珊·朗格（Susanne Langer），她在美学与文学圈中传播卡西尔的符号形式哲学（参见，例如 [Langer 1942]）[^langer-1942]。卡西尔在美国的影响由此涵盖了他哲学个性的两面。人们只能推测，倘若他 1945 年 4 月 13 日走在纽约街头时没有因心脏病突发而猝然离世，这种影响会达到何种程度。
