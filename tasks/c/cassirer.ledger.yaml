      We can further illuminate Cassirer’s evolving attempt to situate himself between Kant and Hegel by considering his evolving relationship to Heidegger. In the 1929 Disputation at Davos Cassirer challenged Heidegger’s radical “finitism” by appealing to the presumed necessary and eternal validity found in both the mathematical sciences and morality. And after the Disputation Cassirer added five footnotes to *Being and Time* (1927) in *The Phenomenology of Knowledge* before its publication, where he suggested that his attempt to begin the Hegelian phenomenology with mythical thought rather than ordinary sense perception could also address Heidegger’s concerns. In 1931, however, Cassirer published a review of [Heidegger 1929][^heidegger-1929], which took a different approach from his remarks at Davos. Instead of primarily emphasizing the “eternal” validity found in the mathematical sciences, Cassirer now placed his main emphasis on the ethical and aesthetic dimensions of Kant’s thought, as expressed in the *Critique of Practical Reason* (1788) and the *Critique of the Power of Judgement* (1790). His main point was that, whereas the Transcendental Analytic of the *Critique of Pure Reason*(1781/1787) may indeed be written from the perspective of human finitude, the rest of Kant’s system embeds this perspective within a wider conception of “the intelligible substrate of humanity.”
    step1: |
      我们可以通过考虑卡西尔与海德格尔之间不断演变的关系，进一步阐明卡西尔在康德与黑格尔之间为自己定位这一不断演进的尝试。在 1929 年达沃斯论辩中，卡西尔以数学科学与道德中据认为必然而永恒的效力为据，挑战海德格尔激进的“有限论”。论辩之后，卡西尔在《认识现象学》出版前给《存在与时间》（1927）加上了五个脚注，在那里他提出：他试图以神话思维而非日常感性知觉来开始黑格尔式现象学的做法，也能回应海德格尔的关切。然而 1931 年，卡西尔发表了对 [Heidegger 1929][^heidegger-1929] 的书评，采取了与他在达沃斯发言不同的进路。卡西尔不再主要强调数学科学中发现的“永恒”效力，而是把主要重点放在康德思想的伦理与审美维度上，如《实践理性批判》（1788）与《判断力批判》（1790）所表达的。他的主旨是：尽管《纯粹理性批判》（1781/1787）的先验分析论确实可能是从人类有限性的视角写成的，但康德体系的其余部分把这一视角嵌入于“人之智思基体”（the intelligible substrate of humanity）这一更宽泛的构想之中。
