      Cudworth’s moral philosophy reflects his concerns about the moral implications of theological voluntarism, the doctrine of liberty of indifference, Hobbesian command morality, and scholastic faculty psychology. He repudiates moral conventionalism and denies that the principles of morality can be deduced from sense knowledge, arguing that moral principles are modifications of mind and therefore more “real and substantial things than the modifications of mere senseless matter” (*TISU*, 248. Cudworth grounds the eternal unchanging nature of moral principles in the goodness and justice in God. As “a being absolutely perfect”, God is “the very idea or essence of good” (*TISU*, 204), whose essential goodness is manifest in all things. Like Socrates in Plato’s *Euthyphro* (10a) he argues that things are not good because God wills them, but God wills them because they are good. So “the goodness, or justice, or righteousness is intrinsecall to the thing itself” (*TISU*, 897). Moral principles are discernible by reason and available to all by virtue of the mind’s “participation” in God. However, he recognises that mere knowledge of the good is insufficient to guarantee virtuous behaviour, and that account must be taken of moral fallibility. Cudworth also argues that we are motivated by desire for the good (“that which first moveth in us, and is the spring and principle of all deliberative action, can be no other than a constant, restless, uninterrupted desire, or love of good as such, and happiness”, *FW*, 173). And we apprehend the good by sensing it, that it is something which “touches and is felt in us” (Cudworth MS, 4979, fol. 243). Of key importance in his moral philosophy is the attention he gives to moral psychology, in particular, his theory of moral autonomy grounded in his conception of free will (Darwall 1995, Irwin 2008, Leisinger 2019, 2021)[^darwall-1995][^irwin-2008][^leisinger-2019].
