      The taxonomical structure of *TISU*, is such that it may be regarded as a history of philosophy, or compendium of the arguments of the philosophers of antiquity—which is one reason why Locke recommended it (Locke 1693 [1989: 247])[^locke-1693]. But to interpret the book merely as a compendium of the arguments of other philosophers is to miss the essentials of Cudworth’s metaphysics and natural philosophy embedded in its heavily annotated pages, which reveal the Platonist core of his philosophy. Central to Cudworth’s metaphysics is the Platonist principle that mind is “first in the order of nature”. Thus mind precedes the world and stands in causal relation to it: “knowledge is older than all sensible things; mind senior to the world, and the architect thereof” (*TISU*, 847–8). The mind in question is the mind of God, which “containeth its immediate intelligibles within it self” as “the paradigm or platform according to which this sensible world was made” (*TISU*, 734). The intellectual is ontologically prior to the physical, as form to copy, “archetype” to “ectype”. The sensible world, or nature, is therefore “a living stamp or signature of the divine wisdom” (*TISU*, 155). The ontological relation of intellectual to physical structures his dualistic view of all being as a descending hierarchy of entities, from angels and human beings, to animals, plants and plastic nature.
    step1: |-
      《TISU》的分类结构，使其可被视为一部哲学史，或古代哲学家论证的汇编——这是洛克推荐它的原因之一（Locke 1693 [1989: 247]）[^locke-1693]。但把该书仅仅解读为其他哲学家论证的汇编，就会错过嵌入其注释繁密书页中的库德沃斯形而上学与自然哲学的要旨，这些书页揭示了他哲学的柏拉图主义核心。库德沃斯形而上学的核心是柏拉图主义原则：心灵“在自然秩序中居首”。因此心灵先于世界，并与之处于因果关系之中：“知识比一切可感事物更古老；心灵先于世界，且为其建筑师”（*TISU*，847–8）。此处所言心灵是上帝的心灵，它“把其直接的可理知之物包含于自身之内”，作为“据以创造这个可感世界的范型或平台”（*TISU*，734）。理智的东西在本体论上先于物理的东西，正如形式先于摹本，“原型”先于“摹本”。可感世界，即自然，因此是“神圣智慧的活的印记或签名”（*TISU*，155）。理智对物理的本体论关系，建构了他对一切存在者的二元论看法，即存在物构成一个下降的层级，从天使与人，到动物、植物与塑形自然。
    step2: |-
