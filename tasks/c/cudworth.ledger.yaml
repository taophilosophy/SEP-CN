      Accordingly, Cudworth posits Plastic Nature as the instrument of God for maintaining the mundane operations of the physical universe in an orderly fashion, regulating the processes of life, in order to sustain a conception of the natural world as an harmonious, unified and purposive system which reflects the goodness and wisdom of the architect. Plastic Nature is a kind of force or energy which infuses material things, and combines efficient, final and formal causality, while, at the same time allowing for contingency and the possibility of error: although it is a copy of the divine mind, it is only a faint one (“the mere umbrage of intellectuality, a faint and shadowy imitation of mind and understanding”, *TISU*, 172). By virtue of its imperfections Plastic Nature is liable to errors (“bungles”). It also operates without awareness of its actions. (A major difference between the human mind and Plastic Nature is that Plastic Nature operates unconsciously). In this way Cudworth attempted to sought to give a providential account of natural causality, avoiding occasionalism (which requires the direct intervention of God in the minutiae of day-to-day operations of nature), determinism and chance.
    step1: |-
      据此，库德沃斯把塑形自然设定为上帝的工具，用以有序地维持物理宇宙的世俗运作，调节生命过程，以维系这样一种自然观：自然世界是一个和谐、统一而有目的的系统，反映着造物主的善性与智慧。塑形自然是一种注入物质事物的力量或能量，它结合动力因、目的因与形式因，同时又允许偶然性与错误的可能性：尽管它是神圣心灵的摹本，却只是一个暗淡的摹本（“智性性的纯粹阴影，对心灵与理解的一种暗淡而朦胧的模仿”，*TISU*，172）。由于它的不完善，塑形自然易于出错（“拙劣之作”）。它也在不觉察其行动的情况下运作。（人的心灵与塑形自然的一个重大差别，在于塑形自然无意识地运作。）如此，库德沃斯试图为自然因果性提供一种天意的说明，避免偶因论（它要求上帝直接干预自然日常运作的细枝末节）、决定论与偶然。
    step2: |-
      据此，库德沃斯把塑形自然立为上帝的工具，以有序地维持物理宇宙的尘世运作，调节生命历程，从而维系这样一种自然观：自然世界是一个和谐、统一而合目的的系统，映现着造物主的善性与智慧。塑形自然是一种灌注于物质事物的力量或能量，兼综动力因、目的因与形式因，同时又容受偶然性与错误的可能：它虽是神圣心灵的摹本，却只是淡薄的摹本（“智性性的纯粹阴影，对心灵与理解的一种暗淡而朦胧的模仿”，*TISU*，172）。因其不完善，塑形自然易致谬误（“拙作”）。它又在对自身行动无所察觉的情形下运作。（人的心灵与塑形自然的一大区别，正在于塑形自然无意识地运作。）如此，库德沃斯力图对自然因果性作出一种天意的说明，既避开偶因论（它要求上帝直接干预自然日常运作的种种细节），也避开决定论与偶然。
