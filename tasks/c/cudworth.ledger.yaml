  - id: s1
    source: |-
      The English philosopher, Ralph Cudworth (1618–1688) defies classification within customary categories of the history of philosophy. At a time when mainstream philosophers announced their modernity by breaking with the past, Cudworth is a figure of continuity, steeped in ancient philosophy, yet abreast of contemporary philosophy and science. He shared the anti-scholastic agenda of self-styled modernisers like Bacon, Hobbes and Descartes, with whose philosophy he engaged, but framed his most original ideas by recourse to antiquity. Cudworth is usually regarded as a Cambridge Platonist, though he himself would not have recognised the label. Although he is normally classified as a rationalist, it is now apparent that this designation is based on too limited a view of his philosophical writings.
    step1: |-
      英国哲学家拉尔夫·库德沃斯（Ralph Cudworth，1618–1688）难以归入哲学史惯常的分类范畴。在主流哲学家以决裂于过去来宣告其现代性的时代，库德沃斯却是一个延续性的人物，他浸淫于古代哲学，同时又不落后于当代哲学与科学。他与培根（Bacon）、霍布斯（Hobbes）和笛卡尔（Descartes）等自封的现代主义者共享反经院哲学的议程，并与他们的哲学相交往，但他最具原创性的观念却是诉诸古代而构建的。库德沃斯通常被视为剑桥柏拉图主义者，尽管他本人不会承认这个标签。虽然他通常被归类为理性主义者，但现在看来，这一称谓是基于对其哲学著作过于狭隘的理解。
    step2: |-
      英国哲学家拉尔夫·库德沃斯（Ralph Cudworth，1618–1688）难以归入哲学史惯常的分类。在一个主流哲学家纷纷以与过去决裂来宣告自身现代性的时代，库德沃斯却代表着延续：他既深浸于古代哲学，又紧随时当世哲学与科学。他与培根、霍布斯、笛卡尔等自命的现代主义者同样怀有反经院哲学的意图，并与他们的哲学相切磋，但他最具独创性的思想却诉诸古代而立论。库德沃斯通常被称作剑桥柏拉图主义者，尽管他本人并不认同这一标签。虽然他通常被归为理性主义者，但如今已显而易见，这一定性建立在其哲学著作过于狭窄的理解之上。
  - id: s2
    source: |-
      Cudworth’s written output was substantial, but much of it was never published and his philosophical system is incomplete. Broadly, his philosophy combines Platonist ethics and metaphysics with an atomist natural philosophy. He is chiefly remembered for his epistemological nativism, and his ethical idealism. Distinctive elements of his philosophy include his theory of consciousness and unconsciousness, his conception of free will as a power of self-determination, and his causal hypothesis of what he called the “plastic power of nature”. The immense humanist learning which fills his published writings has tended to obscure his achievements as a philosopher in post-humanist times, but it did not prevent him from having a considerable legacy in eighteenth and nineteenth-century philosophy.
    step1: |-
      库德沃斯的著述颇丰，但其中大部分从未出版，其哲学体系并不完整。总体而言，他的哲学将柏拉图式的伦理学与形而上学同原子论的自然哲学相结合。他主要以认识论上的天赋论（nativism）和伦理观念论而著称。他哲学的独特要素包括其意识与无意识理论、把自由意志理解为一种自我决定能力的观念，以及他所谓的“自然的塑形力量”（plastic power of nature）这一因果假说。充塞其已刊著作的渊博人文主义学识，在后人文主义时代往往掩盖了他作为哲学家的成就，但这并未妨碍他在十八、十九世纪哲学中留下相当可观的影响。
    step2: |-
      库德沃斯著述宏富，但其中大部分生前未刊，其哲学体系因此并不完整。概言之，他的哲学以柏拉图式的伦理学与形而上学，糅合原子论的自然哲学。他主要因认识论上的天赋论（nativism）与伦理上的唯心论而为人铭记。其哲学的独到之处包括：他的意识与无意识理论；把自由意志理解为自我决定能力的观念；以及他所谓“自然的塑形力量”（plastic power of nature）的因果假说。他已刊著作中充塞的渊博人文主义学识，在后人文主义时代往往掩盖了他作为哲学家的成就，但这并未妨碍他在十八、十九世纪哲学中留下可观的影响。
  - id: s3
    source: |-
      Born in Aller, Somerset, Cudworth was educated at Emmanuel College, Cambridge, where he was elected to a fellowship in 1639. His academic career at the University of Cambridge advanced during the upheavals of the English Civil War: he was appointed as Master of Clare College (1645), Regius Professor of Hebrew (1645), and Master of Christ’s College (1654). Although associated with the interregnum regime, he retained both his college and university appointments at the restoration of the monarchy in 1660, remaining in post in Cambridge until his death in 1688 (Pailin 2020)[^pailin-2020]. His daughter, Damaris, Lady Masham, who became a close friend of John Locke, was the only one of his children to follow in his footsteps as a philosopher (Hutton 2024)[^hutton-2024].
    step1: |-
      库德沃斯生于萨默塞特郡的阿尔勒（Aller），在剑桥的伊曼纽尔学院接受教育，并于1639年当选为该院研究员。在英国内战动荡期间，他在剑桥大学的学术生涯不断升进：他被任命为克莱尔学院院长（1645）、钦定希伯来语教授（1645），以及基督学院院长（1654）。尽管与共和政体（interregnum regime）有关联，他在1660年王政复辟后仍保留学院的大学教职，在剑桥任职直至1688年去世（Pailin 2020）[^pailin-2020]。他的女儿达玛丽斯（Damaris），即马沙姆夫人（Lady Masham），后来成为约翰·洛克（John Locke）的密友，是他子女中唯一继承其哲学家衣钵的人（Hutton 2024）[^hutton-2024]。
    step2: |-
      库德沃斯生于萨默塞特郡的阿尔勒（Aller），在剑桥伊曼纽尔学院就读，1639年当选该院院士。在英国内战的风云变幻中，他在剑桥大学的学术生涯步步高升：1645年出任克莱尔学院院长与钦定希伯来语教授，1654年任基督学院院长。尽管他与共和政体关系密切，1660年王政复辟后他仍保住了学院的大学教职，在剑桥任职直到1688年去世（Pailin 2020）[^pailin-2020]。其女达玛丽斯，即马沙姆夫人（Lady Masham），后成为约翰·洛克（John Locke）的密友，是他子女中唯一以哲学为业者（Hutton 2024）[^hutton-2024]。
  - id: s4
    source: |-
      The only philosophical work which Cudworth published in his lifetime was *The True Intellectual System of the Universe* (1678) (hereafter *TISU*). Two works were published posthumously: *A Treatise Concerning Eternal and Immutable Morality* (hereafter *TEIM*) in 1731 and *Of Freewill* (hereafter *FW*) in 1838. A substantial body of manuscripts on “Liberty and Necessity”, remain unpublished to this day, though these may have circulated in the seventeenth century. Prior to the publication of *TISU*, Cudworth’s philosophical ideas were known primarily through a handful of sermons, the most notable of which was the sermon preached before Parliament in 1647, which anticipates the Platonising outlook of his philosophical writings, and has come to be considered a classic for its message of peace and reconciliation.
    step1: |-
      库德沃斯生前出版的唯一哲学著作是《宇宙的真正理智体系》（*The True Intellectual System of the Universe*，1678）（以下简称 *TISU*）。两部著作在其身后出版：1731年的《论永恒不变的道德》（*A Treatise Concerning Eternal and Immutable Morality*，以下简称 *TEIM*）和1838年的《论自由意志》（*Of Freewill*，以下简称 *FW*）。关于“自由与必然”（Liberty and Necessity）的一大批手稿至今仍未出版，尽管它们在十七世纪或已流传。在《TISU》出版之前，库德沃斯的哲学思想主要通过少数几篇布道文为人所知，其中最著名的是1647年在国会前宣讲的那篇，它预示了他哲学著作的柏拉图化取向，并因其和平与和解的信息而被视为经典。
    step2: |-
      库德沃斯生前唯一刊行的哲学著作是《宇宙的真正理智体系》（*The True Intellectual System of the Universe*，1678；下称 *TISU*）。身后出版的有两部：1731年的《论永恒不变的道德》（*A Treatise Concerning Eternal and Immutable Morality*；下称 *TEIM*）与1838年的《论自由意志》（*Of Freewill*；下称 *FW*）。论“自由与必然”的大量手稿至今未刊，尽管它们在十七世纪或已私下流传。在《TISU》问世之前，库德沃斯的哲学思想主要经由少数几篇布道文为人所知，其中最著者是1647年在国会前的布道，它预示其哲学著作的柏拉图化取向，并因其和平与和解的讯息而被奉为经典。
