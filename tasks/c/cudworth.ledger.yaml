      Cudworth’s conception of free will is an essential element of the new moral psychology adumbrated in his unpublished manuscripts. Dispensing with the traditional scholastic faculties of the mind, he proposes a unitary conception of the soul, the operations of which involve a complex interplay of active and passive powers associated with. This conglomerate of powers or energies includes both rational powers (intellection, deliberation and practical reason) along with sense perception, desires, and appetites (*FW*, 193–4) (Hutton 2017)[^hutton-2017]. Like Plato’s Phaedran charioteer (*Phaedrus* 246a–254e) the hegemonikon acts to co-ordinate these various powers to make them work together. As the unifying power of the soul (“the soul as comprehending itself, all its concerns and interests, its abilities and capacities”), the hegemonikon is the whole person—“that which is properly we ourselves” (*FW*, 178). However, given the complex interplay of active and passive powers, the scope free will as self-determination is markedly circumscribed. It is therefore incorrect to consider Cudworth a libertarian. And the combination of both reason and emotion in Cudworth’s account of moral action means that he can’t be unproblematically classified as an ethical rationalist.
    step1: |-
      库德沃斯的自由意志观念，是其未刊手稿中所预示的新道德心理学的一个本质要素。他弃绝传统的经院心灵官能，提出一种统一的灵魂观，其运作涉及与它相关联的能动与被动力量的复杂相互作用。这一力量或能量的聚合既包括理性力量（理智直观、深思与实践理性），也包括感官知觉、欲望与嗜欲（*FW*，193–4）（Hutton 2017）[^hutton-2017]。如同柏拉图《斐德罗篇》中的驭手（*Phaedrus* 246a–254e），统辖原则（hegemonikon）协调这些不同力量，使它们协同运作。作为灵魂的统一力量（“灵魂作为涵摄自身、其一切关切与利益、其能力与容量的东西”），统辖原则就是整个的人——“那恰是我们自己者”（*FW*，178）。然而，鉴于能动与被动力量的复杂相互作用，作为自我决定的自由意志的范围明显受限。因此把库德沃斯视为自由意志论者是不正确的。而库德沃斯对道德行动中理性与情感的结合，意味着他不能被无保留地归类为伦理理性主义者。
