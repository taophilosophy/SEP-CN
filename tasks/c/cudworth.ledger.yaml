      他同意笛卡尔，即当我们思考时，我们意识到自己的思想；并且像笛卡尔一样，他把思维（cogitation）宽泛地理解为包括感觉、想象、理智与意志的一切运作（*TISU*，831）。与笛卡尔不同，他不接受灵魂或心灵始终有意识——如前所述，他论证灵魂的许多活动（例如塑形自然所进行的活动）是无意识地进行的。此外，即使有意识，灵魂也并不总是对其思想有清晰而分明的觉察。对库德沃斯而言，意识有不同的等级，与不同类型的思维活动相应，从理智直观所涉及的“明确意识”的清晰知觉，到感官的“昏沉欲睡的知觉”（*TEIM*，56），再到半意识状态（“半睡半醒”），或我们漫不经心地做事时（“不专注地”或“以半个思维”）（*TISU*，160）。事实上，库德沃斯的意识理论更得益于普罗提诺而非笛卡尔（*Enneads* 4.4, Aubry 2020）[^aubry-2020]。正是普罗提诺是他把意识视为内在知觉或内在感觉这一观点的来源——他为此采用普罗提诺的术语 *synaesthesis* 或“共感”（con-sense，如他所译）。*Synaesthesis* 是意识的最高形式，它涉及库德沃斯所谓“duplication”（重叠或加倍）——这一术语源于他把灵魂视为具有“duplicity”（二重性）的观念，即灵魂有上与下两个区域，分别与其理智能力和感性或塑形能力相对应。*Synaesthesis* 是自我反思的活动，其中统辖原则俯瞰整个灵魂，仿佛把灵魂的较高能力弯折到较低能力之上。如此“叠合于自身之上”的灵魂，是“涵摄自身、其一切关切与利益的灵魂”，进行深思、“自我回忆与注意”（*FW*，178）。事实上，库德沃斯主张 *只有* “有自由意志的存在者”才有这种意识，因为只有统辖原则才能引导注意，并对灵魂的能力有全面的俯瞰。恰当地，库德沃斯把统辖原则描述为灵魂的“守望者”。统辖原则对其自身运作的觉察，使它“与自身同在”并能够“知觉自身”，这可合理地称为 *自我* 意识，因为它所觉察的对象，正是构成其为“完整的人”的力量。相比之下，较低灵魂的力量与能力只是简单的能量，其觉察水平相应较低。
