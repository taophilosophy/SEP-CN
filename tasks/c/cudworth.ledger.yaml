      A signature feature of Cudworth’s system is his hypothesis of “Plastic Nature”, which he posits as an intermediary causal entity between God and the natural world (Lähteenmäki 2010, Allen 2014)[^lähteenmäki-2010]. This is contained in a long section of *TISU* entitled “Digression concerning the Plastick Life of Nature”. Cudworth formulated his hypothesis in the light of the inadequacies, as he saw them, of the mechanical philosophy, which, he thought, could not explain movement and change, the union of soul and body or life itself or the order and harmony of nature. Against the Cartesian view that the essence of the soul is cogitation, Cudworth objects that the operations of the soul include life-processes which cannot be accounted for in terms of cogitation, or referred to corporeal explanation. He argues that Descartes’ equation of cogitation with consciousness, is absurd since on such a view we would be permanently conscious, even when asleep.
    step1: |-
      库德沃斯体系的标志性特征是他关于“塑形自然”（Plastic Nature）的假说，他把塑形自然设定为上帝与自然世界之间的一种居间因果实体（Lähteenmäki 2010, Allen 2014）[^lähteenmäki-2010]。这包含在《TISU》题为“关于自然塑形生命的离题”（Digression concerning the Plastick Life of Nature）的一个长节中。库德沃斯是在机械哲学的种种缺陷——据他之见——的光照下提出其假说的，他认为机械哲学不能解释运动与变化、灵魂与身体的结合或生命本身，也不能解释自然的秩序与和谐。针对“灵魂的本质是思维”这一笛卡尔式观点，库德沃斯反驳说，灵魂的活动包括生命过程，它们不能以思维来解释，也不能归于有形物的说明。他论证，笛卡尔把思维等同于意识是荒谬的，因为按此观点，我们即使睡眠时也会一直有意识。
    step2: |-
      库德沃斯体系的一大标志，是他关于“塑形自然”（Plastic Nature）的假说，他把它设定为介于上帝与自然世界之间的居间因果实体（Lähteenmäki 2010, Allen 2014）[^lähteenmäki-2010]。此说见于《TISU》题为“关于自然塑形生命的离题”的一个长节。库德沃斯是就机械哲学的种种缺陷——据他之见——而提出此说的：他认为机械哲学既不能解释运动与变化、灵魂与身体的结合或生命本身，也不能解释自然的秩序与和谐。针对“灵魂的本质即思维”这一笛卡尔式观点，库德沃斯反驳道，灵魂的运作包括生命过程，这些过程既不能以思维来解释，也无法归于有形的说明。他论证，笛卡尔把思维与意识等同起来是荒谬的，因为按此见，我们即便熟睡时也会一直有意识。
