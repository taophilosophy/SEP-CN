      The main discussion of Cudworth’s conception of free will is contained in *FW* and the unpublished manuscripts on “Liberty and Necessity”. A central the concern for Cudworth is that to act morally, we must be accountable for our actions. This would not be possible if we were not free to act, since we are not accountable for actions determined by factors outside our control—such as divine decrees, the dictates of tyrants, or physical circumstances like illness or imprisonment. For Cudworth, an essential pre-condition for moral accountability, and therefore for virtuous behaviour, is the freedom to choose between one course of action rather than another. At a minimum that means not being constrained by external impediments from pursuing a particular course of action. However, freedom of action requires more than absence of constraint, and mere knowledge of the good is no guarantee of the pursuit of virtue. To act virtuously requires that we are able to pursue the course of action which we choose to follow. Accordingly, Cudworth re-conceives the idea of freedom of the will as a power of self-determination (Chappell, 2005, Jaffro 2009, Hutton 2017)[^hutton-2017][^jaffro-2009]. This “self-power” is a ruling principle of the soul for which he adopts such Greek terms as the *autexousion* or the *eph hemin* or the *hegemonikon*. This ruling principle is *self*-power both in the sense that it is a principle of action internal to the soul which governs the whole composite of body and soul (“the whole man”), and in the sense that it is the individual human being who determines how it is exercised.
