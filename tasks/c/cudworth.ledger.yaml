      Cudworth invokes other philosophers in support of his hypothesis, including Aristotle whose conception of nature as art (*techne*—*Physics*, 2.8) he interpreted as a version of it. But his most important debt is to Plotinus, especially for his idea of unconscious living nature, and his conception of sympathy as a kind of bonding agent in the universe (see *Enneads* 4.4)(Hutton 2021)[^hutton-2021][^hutton-2021-2]. The notion of an intermediary causal agency in nature was not unprecedented in the seventeenth century, especially in medical thought. There are strong affinities between Plastic Nature and Henry More’s concept of the Spirit of Nature. However, a main difference from More is that Plastic Nature is not extended—for Cudworth extension is a property of body, not immaterial entities
    step1: |-
      库德沃斯援引其他哲学家以支持其假说，包括亚里士多德，他把亚里士多德关于自然作为技艺（*techne*—《物理学》，2.8）的概念解释为这种假说的一个版本。但他最重要的思想来源是普罗提诺，尤其是普罗提诺关于无意识的活的自然观念，以及他把同情（sympathy）视为宇宙中一种结合剂的概念（见《九章集》4.4）（Hutton 2021）[^hutton-2021][^hutton-2021-2]。自然中存在居间因果力量的观念，在十七世纪并非前所未有，尤其在医学思想中。塑形自然与亨利·莫尔（Henry More）的“自然精神”（Spirit of Nature）概念有很强的相似性。然而，与莫尔的一个主要差别是，塑形自然不是广延的——对库德沃斯而言，广延是物体的属性，而非非物质实体的属性。
    step2: |-
      库德沃斯援引其他哲学家以佐其说，其中包括亚里士多德：他把亚里士多德关于自然即技艺（*techne*——《物理学》2.8）的概念，解读为这一假说的一种变体。但他最重要的思想负债在于普罗提诺，尤其关于无意识的活的自然之观念，以及把同情（sympathy）视为宇宙中一种黏合剂的构想（见《九章集》4.4）（Hutton 2021）[^hutton-2021][^hutton-2021-2]。自然界存在居间因果力量这一观念，在十七世纪并非史无前例，尤其在医学思想中。塑形自然与亨利·莫尔（Henry More）的“自然之灵”（Spirit of Nature）概念有强烈亲缘。但与莫尔的一大不同在于：塑形自然并非广延的——在库德沃斯看来，广延是物体的属性，而非非物质实体的属性。
