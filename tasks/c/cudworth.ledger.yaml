      He agrees with Descartes, that when we think we are conscious of our thoughts, and, like Descartes, he construes cogitation broadly to include all the operations of sense, imagination, intellect, and the will (*TISU*, 831). Unlike Descartes, he does not accept that the soul or mind is always conscious—as already noted, he argues that many activities of the soul (e.g., those performed by Plastic Nature) are performed unconsciously. Furthermore, even when conscious, the soul does not always have clear and distinct awareness of its thoughts. For Cudworth, there are different grades of consciousness, appropriate to the different types of cogitative activity, from the clear perception of “express consciousness” involved in intellection, to the “drowsy and somnolent perception” of the senses (*TEIM*, 56), to states of semi-consciousness (“half asleep and half-awake”), or when we do things without concentrating (“non-attendingly” or “by Half a Cogitation”) (*TISU*, 160). Cudworth’s theory of consciousness in fact owes more to Plotinus than Descartes (*Enneads* 4.4, Aubry 2020)[^aubry-2020]. It is Plotinus who is the source of his view of consciousness as inner perception or inward sense—for which he adopts Plotinus’ term *synaesthesis* or “con-sense” (as he translates it). *Synaesthesis* is the highest form of consciousness, which involves what Cudworth calls “duplication” or doubling—a term which derives from his conception of the soul as having “duplicity”, that is having upper and lower regions corresponding respectively to its intellectual and sensible or plastic powers. *Synaesthesis* is the act of self-reflection, in which the hegemonikon overlooks the whole soul, by as it were, bending the higher powers of the soul over the lower. The soul “redoubled upon itself” in this way is “the soul as comprehending itself, all its concerns and interests”, exercising deliberation, “self-recollection and attention” (*FW*, 178). In fact, Cudworth holds that *only* “freewilled-beings” have this kind of consciousness, because it is only the hegemonikon which is able to direct attention and have a comprehensive over-view of the capacities of the soul. Appropriately Cudworth describes the hegemonikon as the “watchman” of the soul. The hegemonikon’s awareness of its own operations which makes it “present with itself” and able “to perceive itself” may reasonably be called *self*-consciousness because the object of its awareness are the powers that constitute it as the “whole person”. By contrast, the powers and capacities of the lower soul are simple energies with a correspondingly lower level of awareness.
