      *FW* (1838) is one of the three manuscripts on the subject of “Of Liberty and Necessity”, which were unpublished when Cudworth died. These are drafts for the planned third part of his system. Although, taken together they do not make up a complete draft of this, they show that Cudworth was attempting something new, by developing an anti-determinist moral psychology, the key features of which are his conception of free will as self-determination, his idea of the *hegemonikon* or ruling principle of the soul, and his conception of consciousness.
    step1: |-
      《FW》（1838）是论“自由与必然”的三部手稿之一，这些手稿在库德沃斯去世时尚未出版。它们是他计划中体系第三部分的草稿。尽管合在一起它们并未构成这一部分的完整草稿，但它们表明库德沃斯正在尝试某种新的东西，即发展一种反决定论的道德心理学，其关键特征是他把自由意志理解为自我决定、他的灵魂统辖原则（*hegemonikon*）观念，以及他的意识概念。
    step2: |-
      《FW》（1838）是论“自由与必然”的三部手稿之一，在库德沃斯去世时均未付梓。它们是原计划体系第三部分的草稿。虽然合在一起仍非该部分的完整草稿，却表明库德沃斯正尝试创新：发展一种反决定论的道德心理学，其要旨在于把自由意志理解为自我决定、灵魂之统辖原则（*hegemonikon*）的观念，以及他的意识概念。
  - id: s11
    source: |-
      Cudworth’s legacy of bulky and incomplete writings, testifies to his comprehensive knowledge of both ancient, and contemporary philosophy. He subscribed to the Renaissance view of philosophy as *philosophia perennis* (perennial philosophy), which presupposes a single timeless core of philosophical truth, which is the shared goal of both ancient and modern philosophical enquiry. Heir to the Renaissance Humanist recovery of almost the entire corpus of ancient philosophy known today, his recourse to antique learning, especially the philosophy of Plato and Plotinus, but also Stoicism, is in many ways a typically Humanist move to ground authority in the tried and tested wisdom of ancient philosophers (Sellars 2011)[^sellars-2011]. However, he turned to ancient philosophy, especially Greek philosophy, as a fund of pre-scholastic philosophical ideas and the source for a new conceptual vocabulary. As one of the first to write philosophy entirely in English, he coined many new terms, many of them adapted from Greek. Some (e.g., *autexousion*, *antitypous*) have not stood the test of time, while others (e.g., “Cartesianism”, “self-determinism”, “consciousness”) are common currency in English philosophy to this today. At the same time, his philosophy was deeply influenced by contemporary philosophy, especially Cartesianism (Passmore 1951, Hutton 2019c)[^hutton-2019c][^passmore-1951]. He had high regard for Descartes as “an acute philosopher” and his philosophy registers the impact of Descartes in multifarious ways. He admired Cartesianism as system of philosophy combining physics with metaphysics, which posited both corporeal and incorporeal substance. He accepted clear and distinct perception as the criterion of epistemological certainty, and the Cartesian account of sense perception. Sensation, for Cudworth, as for Descartes, is a “passion” of the soul, at best a confused perception (*TEIM*, 85). He embraced both the idea of consciousness and the idea of God as a fully perfect, self-existing being, and adopted Descartes’s conception of body as inert extension. However, he was highly critical of Descartes on many counts. He denied that mechanical rules of impact were sufficient to explain natural causality and criticised Descartes’ repudiation of final causes. He critiques Descartes’s proof of the existence God “from his idea” as circular (*TISU*, 717) and his voluntarist conception of God as conducive to scepticism. He rejected Descartes’ machine-model of animals and denied that conscious cogitation exhausted the properties of immaterial substance.
