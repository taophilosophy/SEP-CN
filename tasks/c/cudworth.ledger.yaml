      The operative principles which distinguish immaterial from material substances are activity and passivity (Passmore 1951, Lähteenmäki 2010)[^lähteenmäki-2010][^passmore-1951]. The active principle, for which he uses the term *energeia* (from the Greek for “activity”, or Latin for “energy”), is the principle of life (Hutton 2017)[^hutton-2017]. This is an *internal* principle, or “self activity”, capable of initiating movement or thought. Minds, souls and mental powers are all forms of *energeia*, as is Plastic Nature (see below). All energies are in some sense cogitative, but different energies have different powers such as “the power of moving matter”. Life may be either conscious or unconscious (“Life or internal self-activity, is to be subdivided into such as either acts with express consciousness and *synaesthesis,* or such as is without it”, *TISU*, 159). Energy is furthermore necessarily incorporeal and non-extended, since body, as inert extension, is by definition incapable of originating movement, life or thought.
    step1: |-
      区分非物质实体与物质实体的运作原则是能动性与被动性（Passmore 1951, Lähteenmäki 2010）[^lähteenmäki-2010][^passmore-1951]。能动原则，他为此使用 *energeia*（源于希腊语“活动”，或拉丁语“能量”）一词，是生命的原则（Hutton 2017）[^hutton-2017]。这是一种 *内在的*（internal）原则，或“自我活动”，能够发起运动或思想。心灵、灵魂与心理能力都是 *energeia* 的形式，塑形自然（Plastic Nature）亦然（见下）。一切能量在某种意义上都是思维的，但不同能量有不同的能力，如“推动物质的能力”。生命可以是意识的或无意识的（“生命或内在自我活动，可细分为或带明确意识与 *synaesthesis*（共感）而行动者，或不带者”，*TISU*，159）。能量还必然是非物质、非广延的，因为物体作为惰性广延，按定义不能发起运动、生命或思想。
    step2: |-
      区分非物质实体与物质实体的运行原则，是能动与被动（Passmore 1951, Lähteenmäki 2010）[^lähteenmäki-2010][^passmore-1951]。能动原则他名之为 *energeia*（源自希腊语的“活动”，或拉丁语的“能量”），它是生命的原则（Hutton 2017）[^hutton-2017]。这是一种 *内在*（internal）原则，即“自我活动”，能发起运动或思想。心灵、灵魂与心智能力皆为 *energeia* 的形态，塑形自然（Plastic Nature）亦不例外（见下文）。一切能量在某种意义上皆具思维性，但不同能量有不同的能力，例如“推动物质的力量”。生命或为意识，或为无意识（“生命即内在自我活动，可分为或带明确意识与 *synaesthesis*（共感）而运作，或不带而运作两类”，*TISU*，159）。能量又必然是非物质、非广延的，因为物体作为惰性广延，依定义不能自行发起运动、生命或思想。
