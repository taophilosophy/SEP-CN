      Cudworth’s critique of Hobbes is the most extensive and philosophical of contemporary responses to Hobbes, whom he attacks as an atheist materialist (Mintz 1962, Zarka 1997)[^mintz-1962][^zarka-1997]. He accuses Hobbes of “villanizing of human nature”, and treating morality is a matter of convention. He attacks his natural law theory as merely “artificiall justice” without foundation in natural goodness, charging that Hobbes’s negative conception of human nature renders civil government a necessary evil, void of true justice. He regarded Hobbes’s natural philosophy as a paradigm case of deterministic materialism. And he attacked Hobbes’s mechanistic account of mental operations, arguing that if all mental activity reduces to matter in motion, we could never stop the flow of thoughts, focus our minds on anything, or direct our attention. The fact that we can do so tells against Hobbesian psychology and confirms the agency non-material powers.
    step1: |-
      库德沃斯对霍布斯的批判，是当代对霍布斯回应中最广泛、最具哲学性的，他攻击霍布斯为无神论唯物论者（Mintz 1962, Zarka 1997）[^mintz-1962][^zarka-1997]。他指责霍布斯“诋毁人性”，并把道德视为约定之事。他攻击霍布斯的自然法理论仅仅是“人为的正义”，缺乏自然善性的根基，指控霍布斯对人性的消极看法使公民政府成为必要的恶，没有真正的正义。他认为霍布斯的自然哲学是决定论唯物论的一个典型。他攻击霍布斯对心理活动的机械论说明，论证如果一切心理活动都还原为运动中的物质，我们就永远无法停止思想的流动、把心灵聚焦于任何事物、或引导我们的注意。我们能够做到这些，正说明霍布斯式心理学的错误，并证实了非物质力量的能动性。
    step2: |-
      库德沃斯对霍布斯的批判，是时人对霍布斯诸回应中最详尽、最具哲学性的；他抨击霍布斯为无神论的唯物论者（Mintz 1962, Zarka 1997）[^mintz-1962][^zarka-1997]。他指斥霍布斯“诋毁人性”，把道德仅仅当作约定俗成之事。他攻击霍布斯的自然法理论不过是“人为的正义”，缺乏自然善性的根基，并指责霍布斯对人性的消极看法使公民政府沦为必要之恶，不具真正的正义。他认为霍布斯的自然哲学是决定论唯物论的典型范例。他又抨击霍布斯对心理活动的机械论说明：倘若一切心理活动都化约为运动中的物质，我们就永不能止住思想的奔流、将心神凝注于某物、或调转我们的注意。而我们竟能做到这一切，这正反驳了霍布斯式心理学，并证实了非物质力量的能动性。
