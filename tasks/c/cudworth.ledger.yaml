      Cudworth’s main published work, *TISU*, consists in large part of a critical survey of philosophy, in which the philosophers of antiquity and some moderns (principally Descartes and Hobbes), are classified according to the degree to which their philosophy correlates with theism or atheism. As such it constitutes a *consensus gentium* defence of the naturality of the idea of God to all mankind, in which pagan polytheism is presented as corrupt forms of monotheism, and atheism explained as a failure in philosophical reason. Cudworth identifies four categories of atheist: Hylopathian (materialism), “Atomical or Democritical” atheism, Cosmo-plastic atheism (according to which the world-soul is the highest power), and Hylozoist atheism (which attributes life to matter) (*TISU*, 165). These have their latter-day manifestations in philosophers such as Hobbes (an example of a Hylopathian atheist) and Spinoza (a latter-day Hylozoist). The final chapter of *TISU*, which takes up a third of its almost 900 pages, attempts a comprehensive survey and refutation of atheistic arguments, which are grouped under fifteen subsections. Cudworth also targets what he sees as erroneous forms of monotheism which misconceive the deity by emphasising divine power and will at the expense of divine goodness and justice. Such voluntaristic conceptions of God have far-reaching and destructive implications for both philosophy and religion, since such a God could, by arbitrary fiat, decree falsity to be true, and wrong to be right, resulting in false philosophy with atheistic implications.
    step1: |-
      库德沃斯的主要已刊著作《TISU》，很大程度上是一部对哲学的批判性考察，其中古代哲学家与一些现代哲学家（主要是笛卡尔和霍布斯）按其哲学与有神论或无神论的关联程度而被分类。就此而言，它构成一种 *consensus gentium*（万民共识）的辩护，论证上帝观念对全人类而言的自然性，其中多神教被呈现为一神论的腐化形式，而无神论被解释为哲学理性的失败。库德沃斯区分四类无神论者：体质论的（Hylopathian，唯物论）、“原子论或德谟克利特式”无神论、宇宙塑形无神论（按此说，世界灵魂是最高力量），以及物活论无神论（把生命归于物质）（*TISU*，165）。它们在霍布斯（体质论无神论的一例）和斯宾诺莎（当代的物活论者）等哲学家中有其晚近表现。《TISU》最后一章，约占其近900页的三分之一，试图对无神论论证进行全面的考察与反驳，这些论证被归入十五个分节。库德沃斯还针对他所认为的、错误的一神论形式，它们以强调神圣力量与意志、牺牲神圣善性与公正来误解神性。这种意志主义的上帝观对哲学与宗教都有深远而具破坏性的影响，因为这样的上帝可凭任意旨意把虚假宣布为真实，把错误宣布为正确，导致带有无神论意涵的虚假哲学。
