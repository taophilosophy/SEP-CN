      库德沃斯卷帙浩繁而未完成的著述遗产，证明了他对古代哲学与当代哲学的广博了解。他赞同文艺复兴的哲学观，即哲学是 *philosophia perennis*（永恒哲学），它预设一个单一、无时间的哲学真理核心，这是古代与现代哲学探究的共同目标。作为文艺复兴人文主义几乎恢复今所知全部古代哲学遗产的继承者，他诉诸古代学问，尤其是柏拉图与普罗提诺（Plotinus）的哲学，也包括斯多亚主义，在许多方面是一种典型的人文主义举动，即在古代哲学家久经考验的智慧中确立权威（Sellars 2011）[^sellars-2011]。然而，他把古代哲学，尤其是希腊哲学，当作经院哲学之前哲学观念的宝库和一种新的概念词汇的来源。作为最早完全以英文写作哲学的人之一，他创造了大量新词，其中许多改编自希腊语。有些（如 *autexousion*、*antitypous*）未经受住时间的考验，而另一些（如“Cartesianism”、“self-determinism”、“consciousness”）至今仍是英文哲学的通用语。与此同时，他的哲学深受当代哲学影响，尤其是笛卡尔主义（Passmore 1951, Hutton 2019c）[^hutton-2019c][^passmore-1951]。他高度评价笛卡尔为“一位敏锐的哲学家”，他的哲学在多方面记录了笛卡尔的影响。他赞赏笛卡尔主义作为一种结合物理学与形而上学的哲学体系，它同时设定有形实体与无形实体。他接受清晰而分明的知觉作为认识论确定性的标准，以及笛卡尔对感官知觉的说明。对库德沃斯而言，正如对笛卡尔，感觉是灵魂的一种“激情”（passion），至多是一种混淆的知觉（*TEIM*，85）。他既拥抱意识观念，也拥抱上帝作为完全完美、自存的存在者的观念，并采纳笛卡尔把物体视为惰性广延的概念。然而，他在许多方面高度批判笛卡尔。他否认机械的撞击规则足以解释自然因果性，并批评笛卡尔对目的因的摒弃。他批评笛卡尔“从观念”证明上帝存在的论证是循环的（*TISU*，717），并批评其意志主义的上帝观易于导向怀疑论。他拒斥笛卡尔的动物机器模型，并否认有意识的思维穷尽了非物质实体的属性。
