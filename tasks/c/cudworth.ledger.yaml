      Although knowledge can be generated by the intellect without reference to the world outside, sense perception does have a role in cognition. But it is only a secondary one, since, without the input of mind, sense perceptions are unintelligible, rather as the shape of writing on a page make no sense except to someone who knows how to read. Cudworth explains our capacity to understand the external world by means of correspondence, between the mind and nature, since both bear the imprint (*ectype*) of God’s wisdom. It is this “stamp of intellectuality”, manifest in the order and relations of its constituent parts, which renders the external world intelligible. Cognition is therefore is an act of recognition akin to the process by which we recognise the portrait of a friend because we have a prior idea of what he looks like (*TEIM* 106–7). Thus recollection and reflection are also elements in the process of cognition. In comprehending the external world, the mind focuses not on the external appearance of things but the relational constants which reveal their immutable essences. Cudworth illustrates this with the example of a watch held up to a mirror (*TEIM* 85–6). The difference between an observing eye and the mirror is that the former is conscious of what is reflected in it. To the human mind, however, the watch is not simply an assemblage of discrete metal shapes (“different colours, figures, protuberencies, cavities, sculptures, local motions”), but a unified whole, the constituent parts of which these are designed and arranged for a particular purpose. By comparing these elements in relation to each other and in the light of the ideas it raises from within itself (e.g., ideas of cause and effect), the mind is able to understand how it works, and to recognise that the object is a time-piece (Passmore 1951, Hutton 2019b)[^hutton-2019b][^passmore-1951].
    step1: |-
      尽管知识可由理智在无须参照外部世界的情况下产生，感官知觉在认知中确实有一席之地。但它只是次要的，因为若无心灵的输入，感官知觉就是不可理知的，正如书页上字迹的形状，除非识读者，否则毫无意义。库德沃斯以心灵与自然之间的对应来解释我们理解外部世界的能力，因为两者都带着上帝智慧的印记（*ectype*）。正是这种“智性性的印记”，体现在其构成部分的有序与关联之中，使外部世界成为可理知的。因此，认知是一种再认活动，类似于我们认出朋友肖像的过程，因为我们对他模样的样貌先有观念（*TEIM* 106–7）。因此，回忆与反思也是认知过程的要素。在领会外部世界时，心灵所聚焦的不是事物的外部表象，而是揭示其不变本质的关系性常量。库德沃斯以举镜照表为例说明此点（*TEIM* 85–6）。观察之眼与镜子的差别在于，前者对其所映现之物有意识。然而对人心而言，表并不仅仅是离散金属形状的集合（“不同的颜色、图形、凸起、凹陷、雕饰、局部运动”），而是一个统一的整体，其构成部分为某一特定目的而被设计与安排。通过把这些要素彼此关联地比较，并借助它从自身之内唤起的观念（如原因与结果的观念），心灵得以理解表如何运作，并认出该对象是一计时器（Passmore 1951, Hutton 2019b）[^hutton-2019b][^passmore-1951]。
    step2: |-
      尽管知识可由理智在无须关涉外部世界的情况下生成，感官知觉在认知中毕竟有其作用。但那只是一种次要作用，因为若无心灵的输入，感官知觉便不可理知——恰如书页上字迹的形状，除非识者，否则不具意义。库德沃斯以心灵与自然之间的对应来说明我们理解外部世界的能力：二者都带着上帝智慧的印记（*ectype*）。正是这种“智性性的印痕”，显现在其构成部分的有序与关联之中，才使外部世界成为可理知的。认知因而是种再认活动，类似我们认出友人肖像的过程——因为我们对他相貌先有观念（*TEIM* 106–7）。故回忆与反思亦是认知过程的环节。在把握外部世界时，心灵注目的不是事物的外部形貌，而是揭示其不变本质的关系性常项。库德沃斯以对镜观表为例说明（*TEIM* 85–6）。观照之眼与镜子的不同，在于前者对其映现之物有所意识。然而对人心来说，表并非散乱金属形状的堆积（“种种颜色、图形、凸起、凹陷、雕饰、局部运动”），而是一个统一的整体，其部件为特定目的而设计编排。通过将这些要素相互比较，并参照它自内唤起之观念（如因果观念），心灵便能理解表如何运作，并认出该物乃一计时器（Passmore 1951, Hutton 2019b）[^hutton-2019b][^passmore-1951]。
