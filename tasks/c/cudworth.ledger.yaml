    source: |-
      This division of the subject-matter corresponds to what he regarded as the essentials of both true philosophy and true religion, namely, the existence of God (that there is “an omnipotent, understanding being presiding over all…[which is] essentially good and just”), the real existence of the principles of morality which are grounded in divine goodness rather than divine will (that there is, “something in its own nature, immutably and eternally just, and unjust; and not by arbitrary will, law, and command only”), and the moral autonomy of human beings (“that we are so far forth principles or masters of our own actions, as to be accountable to justice for them”) (*TISU* A4⁵). Cudworth explains the term “intellectual” in the title of this system as being intended distinguish it from astronomical theories or systems of the world. The term also indicates that his “system” is conceived along Platonist lines as the eternal, unchanging model or paradigm, of all things, the “intellectual system” being the intelligible realm which reveals the metaphysical framework of all existence. (In all likelihood Plato’s *Timaeus*, was the inspiration here). For Cudworth the system of nature is the intelligible product of divine intellect. He conceived his system to be true both in the sense that it is philosophically true, and also because its philosophical principles are compatible with religious truth.
    step1: |-
      这种对主题的划分，与他视为真正哲学与真正宗教之要旨的东西相对应，即：上帝的存在（存在“一个全能而有理解力的存在者统摄万有……[它]本质上善且公义”）、以神性善性而非神性意志为根基的道德原则的真实存在（存在“某种在其本性上不变而永恒地公正，亦不公正的东西；而非仅凭任意意志、法律与命令”），以及人的道德自律（“我们在何等程度上成为自身行动的本原或主宰，就须向正义负责”）（*TISU*，A4⁵）。库德沃斯解释该体系标题中“理智的”（intellectual）一词，意在将其与天文学理论或世界体系区分开来。该词还表明，他的“体系”是循柏拉图路线构想为万物的永恒不变模型或范型，“理智体系”即揭示一切存在之形而上学框架的可知领域。（此处很可能是以柏拉图的《蒂迈欧篇》为蓝本。）对库德沃斯而言，自然体系是神圣理智的可知产物。他构想其体系为真，既在哲学意义上为真，也因为其哲学原则与宗教真理相容。
    step2: |-
      这种对题材的划分，与他所认为的真正哲学与真正宗教的要义相契合，即：上帝的存在（“有一个全能、有理智的存在者统摄万有……[它]本质上善良而公正”）；植根于神性之善而非神性之意志的道德原则的真实存在（“存在某种东西，其本性不变地、永恒地既公正又不公正；而非仅凭任意意志、法律与命令”）；以及人的道德自律（“我们之为自身行动的本原或主人，达到何种程度，就须向正义负责”）（*TISU*，A4⁵）。库德沃斯说明，该体系标题中的“理智的”（intellectual）一词，旨在使它与天文学理论或世界体系相区分。该词也表明，他的“体系”循柏拉图路线而被设想为万物的永恒不变模型或范型，“理智体系”即揭示一切存在之形而上学架构的可理知领域。（此处所本，很可能即柏拉图的《蒂迈欧篇》。）对库德沃斯而言，自然体系是神圣理智的可理知产物。他认为其体系之为真，既在于哲学上为真，也在于其哲学原则与宗教真理相容。
  - id: s8
    source: |-
      *TISU* as published in 1678 is only the first of three volumes which Cudworth had planned to write with the same over-all title, but he defends it as a self-standing work. In it he seeks to provide an anti-determinist defence of theism against scepticism, atheism and materialism, and to demonstrate the compatibility of true philosophy with true religion. In so arguing, he probably had in mind the anti-atheist arguments of book X of Plato’s *Laws*. The last chapter, in particular, contains many, often extensive, arguments with his philosophical contemporaries (Descartes, Hobbes and Spinoza). *TISU* also broaches a number of epistemological and ethical themes which are more fully treated in the manuscript writings unpublished at the time of his death.
    step1: |-
      1678年出版的《TISU》只是库德沃斯计划以同一总标题撰写的三卷中的第一卷，但他捍卫它作为一部独立自足之作。在其中，他力图提供一种反决定论的对有神论的辩护，以反对怀疑论、无神论和唯物论，并证明真正哲学与真正宗教的相容性。在如此论证时，他心中所想的很可能是柏拉图《法律篇》第十卷的反无神论论证。特别是最后一章，包含了许多与其同时代哲学家（笛卡尔、霍布斯和斯宾诺莎）的、往往篇幅宏大的论辩。《TISU》还触及若干认识论与伦理学主题，这些主题在他去世时未出版的手稿著作中得到更充分的处理。
    step2: |-
      1678年问世的《TISU》，只是库德沃斯原拟以同一总标题撰写的三卷本中的第一卷，但他力主其作为一部独立自足之作。书中，他为有神论提供一种反决定论的辩护，以回应怀疑论、无神论与唯物论，并证明真正哲学与真正宗教可以相容。在作此论证时，他心中所念很可能是柏拉图《法律篇》第十卷反无神论的论证。尤其最后一章，包含了许多与其同时代哲学家（笛卡尔、霍布斯、斯宾诺莎）的论辩，往往篇幅宏富。《TISU》还涉猎若干认识论与伦理学主题，这些在其去世时尚未刊行的手稿著作中得到了更充分的阐发。
  - id: s9
    source: |-
      *TEIM* (1731) was the first of Cudworth’s works to be published posthumously. It was probably originally intended as a propaedeutic to his unpublished writings on ethics. Although its title suggests otherwise, it is in large part a work of epistemology, containing the fullest treatment of nativist epistemology by any British philosopher of the seventeenth century. Following Plato, Cudworth argues that ideas and moral principles “are eternal and self-subsistent things”, pitching his arguments against the moral relativism and sense-based epistemology of Protagoras and Hobbes. Cudworth’s enduring legacy in moral philosophy, and as a moral rationalist derives from this work (Raphael 1969, Schneewind 2003)[^raphael-1969][^schneewind-2003].
    step1: |-
      《TEIM》（1731）是库德沃斯身后出版的第一部著作。它最初很可能原拟作为其未刊伦理学著作的入门导论。尽管书名暗示相反，但它很大程度上是一部认识论著作，包含十七世纪任何英国哲学家对天赋认识论最充分的论述。循柏拉图，库德沃斯论证观念与道德原则“是永恒而自存的东西”，将其论证指向普罗泰戈拉（Protagoras）和霍布斯的道德相对主义与基于感觉的认识论。库德沃斯在道德哲学上以及作为道德理性主义者的持久影响，即源于此书（Raphael 1969, Schneewind 2003）[^raphael-1969][^schneewind-2003]。
    step2: |-
      《TEIM》（1731）是库德沃斯身后问世的第一部著作。它原本很可能只是其未刊伦理学著作的入门准备。尽管书名似乎另有所指，它却在很大程度上是一部认识论著作，对天赋认识论的论述之充分，为十七世纪任何英国哲学家所不及。库德沃斯遵循柏拉图，论证观念与道德原则“是永恒而自存的东西”，其矛头直指普罗泰戈拉与霍布斯的道德相对主义和基于感官的认识论。库德沃斯在道德哲学领域、以及作为道德理性主义者的恒久影响，皆源于此书（Raphael 1969, Schneewind 2003）[^raphael-1969][^schneewind-2003]。
