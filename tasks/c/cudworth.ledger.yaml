      Cudworth’s place in the history of philosophy is complicated by the fact that prior to the publication of *A Treatise of Freewill* in 1838, he was considered a rationalist in the manner of Samuel Clarke, largely on the basis of *TEIM*—this is how Hume viewed him, for instance. Since John Passmore’s seminal study of his unpublished manuscript writings (Passmore 1951)[^passmore-1951], such a classification is no longer tenable. It is increasingly recognised that Cudworth anticipates later developments in moral philosophy, especially moral sentimentalism (Gill 2004, Hutton 2012, Kaldas 2019)[^gill-2004][^hutton-2012][^kaldas-2019]. Nevertheless Passmore’s insights have still not fed through fully to assessments of Cudworth’s moral philosophy today, and he has also been mis-characterised as primarily a theologian, a libertarian, and even as a clergyman, and a *mystic*. Latterly Cudworth’s immense learning and baroque wordiness tend to be viewed as obstructive encumbrances, and modern readers are out of sympathy with the syncretic conception of a perennial philosophy which frames his thinking. Nevertheless, from the seventeenth through the nineteenth century, Cudworth’s philosophy has attracted a distinguished array of philosophical readers, among them Locke, Shaftesbury, Leibniz, Reid, Hume and other philosophers of the Scottish Enlightenment. Newton made extensive notes on Cudworth, preserved in his MS “Out of Cudworth” (Newton, q.v.). Richard Price’s *Review of the Principal Questions and Difficulties in Morals* (Price 1758)[^price-1758] is indebted to Cudworth’s posthumous *TEIM*. Cudworth’s admirers also included Alexander Pope, Samuel Taylor Coleridge and the American Transcendentalists. He was held in high regard by the Scottish historian of philosophy, Dugald Stewart. His hypothesis of Plastic Nature had a lengthy afterlife: it was the subject of a dispute between Pierre Bayle and Jean Le Clerc (Rosa 1994, Simonutti 1993)[^rosa-1994][^simonutti-1993], who defended Cudworth at the instigation of his daughter, Damaris. It was taken up by the botanist, John Ray, as well as the German Idealists (Wormald, 2025). Denis Diderot included an entry on it in the *Encyclopédie* and it was defended by Paul Janet in the mid nineteenth century.
    step1: |-
      库德沃斯在哲学史中的地位因下述事实而复杂化：在1838年《论自由意志》出版之前，他大体上因《TEIM》而被视为塞缪尔·克拉克（Samuel Clarke）式的理性主义者——例如休谟（Hume）就是这么看他的。自约翰·帕斯莫尔（John Passmore）对其未刊手稿著作的开创性研究（Passmore 1951）[^passmore-1951]以来，这样的分类不再成立。人们日益认识到，库德沃斯预示了道德哲学后来的发展，尤其是道德情感主义（Gill 2004, Hutton 2012, Kaldas 2019）[^gill-2004][^hutton-2012][^kaldas-2019]。尽管如此，帕斯莫尔的洞见至今仍未充分渗透到对库德沃斯道德哲学的评价中，而且他还被误述为主要是一位神学家、一个自由意志论者，甚至是一名牧师、一位 *神秘主义者*（mystic）。晚近以来，库德沃斯的渊博学识与巴洛克式的冗长文风往往被视为碍事的累赘，现代读者对其框架性思想的永恒哲学之融合观也缺乏共鸣。然而，从十七世纪到十九世纪，库德沃斯的哲学吸引了一批卓越的哲学读者，其中有洛克、沙夫茨伯里、莱布尼茨（Leibniz）、里德（Reid）、休谟及其他苏格兰启蒙运动哲学家。牛顿（Newton）对库德沃斯作了大量笔记，保存于其手稿“Out of Cudworth”（Newton, q.v.）。理查德·普莱斯（Richard Price）的《道德主要问题与疑难之评论》（*Review of the Principal Questions and Difficulties in Morals*）（Price 1758）[^price-1758]得益于库德沃斯身后出版的《TEIM》。库德沃斯的仰慕者还包括亚历山大·蒲柏（Alexander Pope）、塞缪尔·泰勒·柯勒律治（Samuel Taylor Coleridge）与美国超验主义者。苏格兰哲学史家杜格尔德·斯图尔特（Dugald Stewart）对他评价很高。他的塑形自然假说有漫长的后效：它是皮埃尔·培尔（Pierre Bayle）与让·勒克莱尔（Jean Le Clerc）之间争论的主题（Rosa 1994, Simonutti 1993）[^rosa-1994][^simonutti-1993]，后者在其女达玛丽斯的鼓动下为库德沃斯辩护。这一假说为植物学家约翰·雷（John Ray）以及德国唯心论者所采纳（Wormald, 2025）。德尼·狄德罗（Denis Diderot）在《百科全书》（*Encyclopédie*）中收录了一个相关词条，保罗·雅内（Paul Janet）在十九世纪中叶为之辩护。
    step2: |-
      库德沃斯在哲学史中的地位之所以复杂，在于：在1838年《论自由意志》问世之前，他大体上凭《TEIM》而被视作塞缪尔·克拉克（Samuel Clarke）式的理性主义者——例如休谟即作如是观。自约翰·帕斯莫尔（John Passmore）对其未刊手稿的开创性研究（Passmore 1951）[^passmore-1951]以来，此种归类便不再成立。人们日渐认识到，库德沃斯预示了道德哲学的后来发展，尤其道德情感主义（Gill 2004, Hutton 2012, Kaldas 2019）[^gill-2004][^hutton-2012][^kaldas-2019]。尽管如此，帕斯莫尔的洞见至今仍未全然渗入对库德沃斯道德哲学的评价；他还被误述为主要为神学家、自由意志论者，甚至牧师，一位 *神秘主义者*（mystic）。晚近以来，库德沃斯的渊博学识与巴洛克式的冗赘文风，往往被视为碍事的负担；现代读者对他思想框架中永恒哲学的融合观念也难有共鸣。然而，自十七世纪至十九世纪，库德沃斯的哲学吸引了一批卓著的哲学读者，包括洛克、沙夫茨伯里、莱布尼茨、里德（Reid）、休谟，以及苏格兰启蒙的其他哲学家。牛顿（Newton）曾为库德沃斯作大量笔记，存于其手稿“Out of Cudworth”（Newton, q.v.）。理查德·普莱斯（Richard Price）的《道德主要问题与疑难之评论》（*Review of the Principal Questions and Difficulties in Morals*）（Price 1758）[^price-1758]，得益于库德沃斯身后刊行的《TEIM》。库德沃斯的推崇者还包括亚历山大·蒲柏（Alexander Pope）、塞缪尔·泰勒·柯勒律治（Samuel Taylor Coleridge）与美国超验主义者。苏格兰哲学史家杜格尔德·斯图尔特（Dugald Stewart）对他推崇备至。他的塑形自然假说有着绵长的身后影响：它成为皮埃尔·培尔（Pierre Bayle）与让·勒克莱尔（Jean Le Clerc）之争的主题（Rosa 1994, Simonutti 1993）[^rosa-1994][^simonutti-1993]，后者在其女达玛丽斯的敦促下为库德沃斯辩护。此说为植物学家约翰·雷（John Ray）及德国唯心论者所承续（Wormald, 2025）。德尼·狄德罗（Denis Diderot）在《百科全书》（*Encyclopédie*）中收录了相关条目，保罗·雅内（Paul Janet）于十九世纪中叶为之辩护。
