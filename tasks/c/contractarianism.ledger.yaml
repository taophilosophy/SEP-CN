      This critique has an analog for theories (such as Gauthier’s) that claim that without the contract individuals will be stuck in some social sub-optimal situation that is bad enough to motivate them to make concessions to each other for some agreement, yet the reason for their inability to cooperate without the contract cannot continue to operate after the contract is made. A potential solution to this problem is to argue that individuals will choose to dispose themselves to be constrained (self-interest) maximizers rather than straightforward (self-interest) maximizers, that is, to retrain themselves not to think first of their self-interest but rather to dispose themselves to keep their agreements, provided that they find themselves in an environment of like-minded individuals (Gauthier 1986, 160–166)[^gauthier-1986]. But this solution has been found dubitable by many commentators (see Vallentyne 1991)[^vallentyne-1991]. Michael Moehler argues that this move by Gauthier to constrained maximization moralizes the account of practical reasoning, and in doing so, moves outside the bounds of traditional contractarianism (Moehler 2020)[^moehler-2020].
    step1: |-
      这一批评对那些理论（如戈蒂耶的理论）有一个类似物：它们主张没有契约个体就会困于某种社会次优情形，这一情形足够糟糕，足以促使他们为达成某种协议而相互让步；然而他们未立约时无法合作的原因，在立约之后不能继续起作用。这一问题的一个潜在解法是论证：个体会选择使自己成为受约束的（自利）最大化者，而非直截了当的（自利）最大化者，即重新训练自己不要先想自利，而是使自己倾向于信守协议，只要它们发现自己身处志同道合者的环境之中（Gauthier 1986, 160–166）[^gauthier-1986]。但这一解法被许多评论者认为可疑（见 Vallentyne 1991）[^vallentyne-1991]。Michael Moehler 认为，戈蒂耶转向受约束最大化的这一举动把实践推理的说明道德化了，从而越出了传统契约主义的边界（Moehler 2020）[^moehler-2020]。
    step2: |-
      这一批评对另一类理论（如戈蒂耶的理论）有一个对应物：这类理论主张，没有契约，个体就会困于某种社会次优情形，其糟糕程度足以促使他们相互让步以达成协议；可他们立约前无法合作的原因，在立约后不得继续起作用。一个潜在解法是：个体会选择使自己成为受约束的（自利）最大化者，而非直来直去的（自利）最大化者——即重新训练自己，不先想自利，而是使自己倾向信守协议，只要身处志同道合者的环境（Gauthier，1986，160–166）[^gauthier-1986]。但许多评论者认为此解可疑（见 Vallentyne，1991）[^vallentyne-1991]。Michael Moehler 认为，戈蒂耶转向受约束最大化，把实践推理的说明道德化了，从而越出传统契约主义的边界（Moehler，2020）[^moehler-2020]。
