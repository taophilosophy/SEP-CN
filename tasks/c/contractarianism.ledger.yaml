      契约主义理论的第二个要素刻画潜在的缔约者。它分两层：其一，缔约者拥有最低限度的指向他人的欲望或偏好；其二，缔约者有能力与他人进行理性互动。契约主义理论（有别于非自利契约论）为达成并信守协议的动机设定了高标准：它不假设人天然偏好道德行为，以便把道德或正义规则奠基于理性的自利。既然人的利益未必包含他人福祉，契约主义的主要挑战便是表明：即使没有这类指向他人的偏好，讲道德仍是理性的。这类指向自身的偏好称作“非利他的”（non-tuistic，Gauthier，1986，87）[^gauthier-1986]。然而有理由认为，把缔约者的偏好收窄为仅含非利他偏好，既无必要，也无助益。一个理由是：假定人不具有如此狭义的偏好，那么这种限制就意味着实际的人不会愿意遵守已达成的协议（Hubin，1991）[^hubin-1991]。另一方面，允许正面的利他偏好在道德与正义的谈判中发挥作用，则可能让个体因恻隐之心而遭利用（Dimock，1999）[^dimock-1999]；Dimock 指出这对女性尤其成问题——多数文化自幼便以性别主义规范与性别角色规训女性，使她们把他人福祉置于自身之上。至于负面的利他偏好，则作为一种道德怀疑论对契约主义理论构成另一种挑战，无论将其排除还是纳入，都要面对难题（Superson，2009）[^superson-2009]。排除派有罗尔斯与戈蒂耶：他们论证，负面的利他偏好（嫉妒、猜忌、怨毒、报复）使互利合作不可能，因而不合理性（Rawls，1971，142–150、530–534；Gauthier，1986，311、329）[^gauthier-1986][^rawls-1971]；但这类情绪很常见，此回应大大收窄了理论的适用范围。纳入派则要说明互利如何克服这些负面的、指向他人的情绪。
