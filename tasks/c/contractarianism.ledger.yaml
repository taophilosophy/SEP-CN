      Two further critiques can be raised against contractarianism (Southwood 2010)[^southwood-2010]. According to the normativity objection, contractarian morality is not sufficiently other-regarding because it motivates morality by appeal to one’s self-interest rather than any concern of others. Because of this, the theory gives one no reason to feel guilt or remorse for wrongdoing, but rather, at most, self-directed anger or disappointment at acting irrationally. Southwood’s objection can be seen as one way of filling out Superson’s claim, mentioned above, that Gauthier’s theory cannot respond to the motive skeptic. This objection overlooks the fact that some appeal to others’ concerns is built into both the Lockean Proviso and the bargaining theory from which the content of the moral norms are derived. Furthermore, Kantian moral theory would seem to be subject to the same objection insofar as it appeals to autonomous rationality as the motive for acting morally. Gauthier can be seen as providing a response to the objection in the final chapter of *Morals by Agreement*, where he describes the “liberal individual,” whose moral psychology is shaped by living the moral life that mutual advantage contractarianism prescribes.
