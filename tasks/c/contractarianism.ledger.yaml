      社会契约理论还要求有若干规则来指导协议的形成。这些规则既先于契约，就必须有先在道德规范的某种来源——或是自然的，或是理性的，或是约定的。通常规定的第一条规则是：订立协议不得有强制或欺诈，任何人不得以人身暴力相威胁而“被强迫”进入协议。其理由纯属审慎：若允许使用暴力，则对受威胁的一方而言，达成的“契约”与自然状态便无实质区别，协议也就毫无保障。然而，因暴力威胁而被迫放弃权利，与因贫困威胁而接受不利协议，两者之间只有一线之隔；正因如此，戈蒂耶等契约主义者才能主张一个公平而无偏私的谈判起点，以达成有保障且稳定的协议。契约的第二条规则是：凡契约的正当当事人，都必须同意作为契约结果的正义规则。
