      契约主义者力图表明：如果没有正义规则来支持合作，人们按自己的判断会过得更糟。因此采纳某些道德与正义规则是理性的。契约主义个体的这两个方面——自利与从与他人互动中获益的能力——加上适度稀缺的条件，蕴含了罗尔斯跟随休谟所称的“正义的环境”：正义规则既可能又必要的那些条件（1971, 109–112）。正义与社会契约只有在每个人都能从合作中获益时才可能。
