      Contractarianism has also been criticized on racial grounds (Williams 1991)[^williams-1991]. Contracts require independent agents who are able to make and carry out promises without the aid of others. Historically, while white men have been treated as these pure wills of contract theory, Blacks and women have been treated as anti-will: dependent and irrational. Both ideals are false; whole people, she says, are dependent on other whole people. But by defining some as contractors and others as incapable of contract, whole classes of people can be excluded from the realm of justice. This point has been explored by other critics of contractarianism, first by Allen Buchanan (1993) and more recently by Eva Kittay (1999), who points out that not only are dependents such as children and disabled people left out of consideration by contractarian theories, but their caretakers’ needs and interests will tend to be underestimated in the contract, as well.
