      Disability rights activists, however, would still seem to have a serious complaint to lodge against normative contractarianism, since it is surely the case that there are persons who cannot reciprocate benefits to others. Such persons would be, on the normative contractarian view, beyond the scope of the rules of justice. Recent literature on disability argues that, to the contrary, contractarianism can be inclusive of the disabled. For example, it may be argued that in fact most disabled persons and all caregivers would be included in the bargaining group for clear strategic reasons (Becker 2005)[^becker-2005]. The basic contractarian insight that cooperation is mutually advantageous implies that whenever someone can be included as a contributing cooperator there are gains to be realized for all. Many disabled people are either already capable of contributing or could be so with accommodation or rehabilitation, and thus it is to the advantage of society to provide accommodations or rehabilitation at some level, requiring reciprocal contributions from those thus benefited. For those disabled persons who cannot be rehabilitated, contractarianism provides a different solution, namely a “mutually advantageous” social insurance scheme that offers a dignified standard of care for anyone who needs it (Becker 2005)[^becker-2005]. One might object that the currently healthy contractors would not see the need to pay premiums as high as the already disabled, since they have a lower probability of needing the care. For this insurance scheme to work (and to avoid adverse selection problems), everyone would need to agree to equal premiums without prior knowledge of their condition. But it is hard to see how a contractarian can justify this agreement. A contractualist, on the other hand, could argue that such an agreement could not be reasonably rejected. This line of argument would have to show that a similar argument could not be made for any form of bad luck, on pain of this view devolving into egalitarianism.
