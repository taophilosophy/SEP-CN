      Hampton 还反对当代契约主义的一个假定：互动仅有工具价值。她论证，若互动只因给自利的合作者带来合作果实而有价值，这些合作者就不太可能成功解决遵守问题；总之，若没有对道德的某种自然倾向，他们多半无法在自己心中确立道德动机。有趣的是，Hampton 在一点上与戈蒂耶一致：契约主义要求任何道德或政治规范诉诸个体自利，以此限制自我牺牲或对任何个体的剥削，这是对的。
