    source: |-
      “Contractarianism” names both a political theory of the legitimacy of political authority and a moral theory about the origin or legitimate content of moral norms. The political theory of authority claims that legitimate authority of government must derive from the consent of the governed, where the form and content of this consent derives from the idea of contract or mutual agreement. The moral theory of contractarianism claims that moral norms derive their normative force from the idea of contract or mutual agreement. Contractarians are skeptical of the possibility of grounding morality or political authority in either divine will or some perfectionist ideal of the nature of humanity. Social contract theorists from the history of political thought include Hobbes, Locke, Kant, and Rousseau. The most important contemporary political social contract theorist is John Rawls, who effectively resurrected social contract theory in the second half of the 20th century, along with David Gauthier, who is primarily a moral contractarian. There is no necessity for a contractarian about political theory to be a contractarian about moral theory, although most contemporary contractarians are both. It has been more recently recognized that there are two distinct strains of social contract thought, which now typically go by the names *contractarianism* and *contractualism*.
    step1: |-
      “契约主义”（contractarianism）既指一种关于政治权威之正当性的政治理论，也指一种关于道德规范之起源或正当内容的道德理论。政治权威理论主张，政府的正当权威必须来自被统治者的同意，而这种同意的形式与内容来自契约或相互同意的观念。契约主义的道德理论主张，道德规范的规范力量来自契约或相互同意的观念。契约主义者怀疑：道德或政治权威能否立足于神的意志，或立足于某种关于人性本性的完善论理想。政治思想史中的社会契约理论家包括霍布斯、洛克、康德与卢梭。最重要的当代政治社会契约理论家是约翰·罗尔斯（John Rawls），他在 20 世纪下半叶切实复兴了社会契约理论；与之并立的还有大卫·戈蒂耶（David Gauthier），后者主要是道德契约主义者。政治理论上的契约主义者未必在道德理论上也是契约主义者，尽管当代多数契约主义者两者兼是。较晚近人们才认识到，社会契约思想有两个不同的支脉，如今通常以 *contractarianism*（自利契约论）与 *contractualism*（非自利契约论）之名相区别。
    step2: |-
      “契约主义”（contractarianism）既指一种关于政治权威正当性的政治理论，也指一种关于道德规范之起源或正当内容的道德理论。政治权威理论主张，政府的正当权威必须来自被统治者的同意，而这种同意的形式与内容源于契约或相互同意的观念。契约主义的道德理论则主张，道德规范的规范力量源于契约或相互同意的观念。契约主义者对下述做法持怀疑态度：把道德或政治权威奠基于神的意志，或奠基于某种关于人性本性的完善论理想。政治思想史上的社会契约理论家包括霍布斯、洛克、康德与卢梭；当代最重要的政治社会契约理论家是约翰·罗尔斯——他在 20 世纪下半叶切实复兴了社会契约理论——与之并立的是大卫·戈蒂耶，后者主要是道德契约主义者。政治理论上的契约主义者未必在道德理论上也是契约主义者，不过当代多数契约主义者两者兼是。人们较晚近才认识到，社会契约思想有两个不同的支脉，如今通常以 *contractarianism*（自利契约论）与 *contractualism*（非自利契约论）之名相区别。
  - id: 2
    kind: body
    source: |-
      Contractarianism, which stems from the Hobbesian line of social contract thought, holds that persons are primarily self-interested, and that a rational assessment of the best strategy for attaining the maximization of their self-interest will lead them to act morally (where the moral norms are determined by the maximization of joint interest) and to consent to governmental authority. Contractarianism argues that we each are motivated to accept morality “first because we are vulnerable to the depredations of others, and second because we can all benefit from cooperation with others” (Narveson 1988, 148)[^narveson-1988]. Contractualism, which stems from the Kantian line of social contract thought, holds that rationality requires that we respect persons, which in turn requires that moral principles be such that they can be justified to each person. Thus, individuals are not taken to be motivated by self-interest but rather by a commitment to publicly justify the standards of morality to which each will be held. Where Gauthier, Narveson, or economist James Buchanan are the paradigm Hobbesian contractarians, Rawls or Thomas Scanlon would be the paradigm Kantian contractualists. The rest of this entry will specifically pertain to the contractarian strain wherever the two diverge.
    step1: |-
      自利契约论源自社会契约思想的霍布斯式路线，主张人首先是自利的，而对实现自身利益最大化之最佳策略的理性评估，将引导他们道德地行事（道德规范由共同利益的最大化决定）并同意政府权威。契约主义论证说，我们每个人都出于两个动机接受道德：“首先因为我们容易遭受他人的掠夺，其次因为我们都能从与他人的合作中获益”（Narveson 1988, 148）[^narveson-1988]。非自利契约论源自社会契约思想的康德式路线，主张理性要求我们尊重人，而这又要求道德原则能够对每个人得到证成。因此，个体不被认为受自利推动，而是受一种承诺推动：公开证成每个人都要遵守的道德标准。戈蒂耶、纳维森或经济学家 James Buchanan 是霍布斯式契约主义者的典范，罗尔斯或托马斯·斯坎伦则是康德式非自利契约论者的典范。本词条以下在两者分歧之处，将专门讨论契约主义这一支。
    step2: |-
      自利契约论源自社会契约思想的霍布斯式路线：人首先是自利的；只要理性地评估何种策略最能实现自利最大化，人便会道德地行事（道德规范由共同利益的最大化来定）并同意政府权威。用契约主义的话说，我们每个人都基于两个理由接受道德：“首先因为我们易遭他人掠夺，其次因为我们都能从与他人的合作中获益”（Narveson，1988，148）[^narveson-1988]。非自利契约论则源自康德式路线：理性要求我们尊重人，而这进一步要求道德原则必须能向每个人证成。因此，个体并非受自利驱动，而是受一种承诺驱动——公开证成每个人都须受其约束的道德标准。戈蒂耶、纳维森或经济学家 James Buchanan 是霍布斯式契约主义者的典范；罗尔斯或托马斯·斯坎伦则是康德式非自利契约论者的典范。凡两者分歧之处，本词条以下专门讨论自利契约论这一支。
