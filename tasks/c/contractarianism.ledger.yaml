version: 1
slug: contractarianism
segments:
  - id: 1
    source: "“Contractarianism” names both a political theory of the legitimacy of political authority and a moral theory about the origin or legitimate content of moral norms. The political theory of authority claims that legitimate authority of government must derive from the consent of the governed, where the form and content of this consent derives from the idea of contract or mutual agreement. The moral theory of contractarianism claims that moral norms derive their normative force from the idea of contract or mutual agreement. Contractarians are skeptical of the possibility of grounding morality or political authority in either divine will or some perfectionist ideal of the nature of humanity. Social contract theorists from the history of political thought include Hobbes, Locke, Kant, and Rousseau. The most important contemporary political social contract theorist is John Rawls, who effectively resurrected social contract theory in the second half of the 20th century, along with David Gauthier, who is primarily a moral contractarian. There is no necessity for a contractarian about political theory to be a contractarian about moral theory, although most contemporary contractarians are both. It has been more recently recognized that there are two distinct strains of social contract thought, which now typically go by the names *contractarianism* and *contractualism*."
    step1: "“自利契约论”既命名一种关于政治权威之正当性的政治理论，也命名一种关于道德规范之起源或正当内容的道德理论。政治权威理论主张，政府的正当权威必须源于被统治者的同意，而这种同意的形式与内容源于契约或相互同意的观念。自利契约论的道德理论主张，道德规范从契约或相互同意的观念获得其规范力。自利契约论者对把道德或政治权威建立在神圣意志或某种关于人性本性的至善论理想之上的可能性持怀疑态度。政治思想史上的社会契约理论家包括霍布斯、洛克、康德与卢梭。最重要的当代政治社会契约理论家是约翰·罗尔斯（John Rawls），他在 20 世纪下半叶有效地复兴了社会契约理论；与之并列的是 David Gauthier，他主要是一位道德自利契约论者。政治理论上的自利契约论者不必同时也是道德理论上的自利契约论者，尽管大多数当代自利契约论者两者皆是。近来人们已认识到，社会契约思想存在两种不同的脉络，它们如今通常分别称为自利契约论（*contractarianism*）与非自利契约论（*contractualism*）。"
    step2: "“自利契约论”既指一种关于政治权威之合法性的政治理论，也指一种关于道德规范之起源或正当内容的道德理论。作为政治理论，它主张政府的合法权威必须来自被统治者的同意，而这种同意的形式和内容又来自契约或相互合意这一观念。作为道德理论，它主张道德规范是从契约或相互合意的观念中获得其规范力量的。自利契约论者对能否把道德或政治权威建立在神意或某种关于人性的至善论理想之上，持怀疑态度。政治思想史上的社会契约理论家包括霍布斯、洛克、康德与卢梭。当代最重要的政治社会契约理论家是约翰·罗尔斯（John Rawls），他在 20 世纪下半叶有效地复兴了社会契约理论；与此并列的还有 David Gauthier，他主要是一位道德自利契约论者。一个政治理论上的自利契约论者不必同时也是道德理论上的自利契约论者，尽管大多数当代自利契约论者两者都是。近来人们已认识到，社会契约思想有两条不同的谱系，如今通常分别称为自利契约论（*contractarianism*）与非自利契约论（*contractualism*）。"
  - id: 2
    source: "Contractarianism, which stems from the Hobbesian line of social contract thought, holds that persons are primarily self-interested, and that a rational assessment of the best strategy for attaining the maximization of their self-interest will lead them to act morally (where the moral norms are determined by the maximization of joint interest) and to consent to governmental authority. Contractarianism argues that we each are motivated to accept morality “first because we are vulnerable to the depredations of others, and second because we can all benefit from cooperation with others” (Narveson 1988, 148)[^narveson-1988]. Contractualism, which stems from the Kantian line of social contract thought, holds that rationality requires that we respect persons, which in turn requires that moral principles be such that they can be justified to each person. Thus, individuals are not taken to be motivated by self-interest but rather by a commitment to publicly justify the standards of morality to which each will be held. Where Gauthier, Narveson, or economist James Buchanan are the paradigm Hobbesian contractarians, Rawls or Thomas Scanlon would be the paradigm Kantian contractualists. The rest of this entry will specifically pertain to the contractarian strain wherever the two diverge."
    step1: "自利契约论源于社会契约思想的霍布斯谱系，它主张人主要是自利的，而对获取自我利益之最大化这一最佳策略的理性评估，将引导他们道德地行动（此时道德规范由共同利益的最大化所决定），并同意接受政府权威。自利契约论论证说，我们每个人都受动机驱使去接受道德，“首先是因为我们易受他人掠夺之害，其次是因为我们都能从与他人的合作中获益”（Narveson 1988, 148）[^narveson-1988]。非自利契约论源于社会契约思想的康德谱系，它主张理性要求我们尊重人，而这又要求道德原则必须能够向每一个人得到证成。因此，个体不被认为是由自我利益所驱动，而是由一种对所有人都会遵守的道德标准加以公开证成的承诺所驱动。如果说 Gauthier、Narveson 或经济学家 James Buchanan 是霍布斯式自利契约论的典范，那么 Rawls 或托马斯·斯坎伦（Thomas Scanlon）则是康德式非自利契约论的典范。本词条其余部分在两派分歧之处，将专门针对自利契约论这一脉。"
    step2: "自利契约论源于社会契约思想的霍布斯谱系，它主张人主要是自利的，而对如何实现自我利益最大化这一最佳策略作理性评估，将引导人们道德地行动（此时道德规范由共同利益的最大化来规定），并同意接受政府权威。自利契约论论证说，我们每个人之所以接受道德，都是受动机驱使，“首先是因为我们容易受到他人掠夺的侵害，其次是因为我们都能从与他人的合作中获益”（Narveson 1988, 148）[^narveson-1988]。非自利契约论源于社会契约思想的康德谱系，它主张理性要求我们尊重人，而这又要求道德原则必须能够向每一个人证成。因此，个体并不被看作受自我利益驱动，而是受一种承诺驱动，即公开证成每个人都须遵守的那些道德标准。如果说 Gauthier、Narveson 或经济学家 James Buchanan 是霍布斯式自利契约论的典范，那么 Rawls 或托马斯·斯坎伦（Thomas Scanlon）则是康德式非自利契约论的典范。本词条其余部分在两派分道扬镳之处，将专门针对自利契约论这一脉展开。"
  - id: 3
    source: "The social contract has two fundamental elements: a characterization of the initial situation, called variously the “state of nature” by the modern political philosophers, the “original position” by Rawls (1971, 17–22, 118–193), or the “initial bargaining position” by Gauthier (1986, 14–16, 131–134, passim), and a characterization of the parties to the contract, particularly in terms of their rationality and motivation to come to agreement. The initial situation posits what in bargaining theory is called the “no agreement position,” the situation to which the individuals return in case of failure to make an agreement or contract. This situation may be more or less hostile, and more or less social, depending on how the theorist characterizes human life in the absence of rules of morality or justice. But crucial to all contractarian theories, there is some scarcity or motivation for competition in the initial situation and there is some potential for gains from social interaction and cooperation."
    step1: "社会契约包含两个基本要素：其一，对初始情境的刻画——近代政治哲学家称之为“自然状态”，Rawls（1971, 17–22, 118–193）称之为“原初状态”，Gauthier（1986, 14–16, 131–134, passim）称之为“初始谈判地位”；其二，对契约各方的刻画，尤其是就他们的理性与达成协议的动机而言。初始情境设定了博弈论所称的“无协议地位”，即个体在未能达成协议或契约时所回到的那种情境。这一情境可能更敌对或更温和，更少或更多社会性，取决于理论家如何刻画在缺乏道德或正义规则时的人类生活。但就所有自利契约论理论而言至关重要的是：初始情境中存在某种稀缺或竞争的动机，并且存在从社会互动与合作中获利的可能。"
    step2: "社会契约包含两个基本要素：一是对初始情境的刻画——近代政治哲学家称之为“自然状态”，Rawls（1971, 17–22, 118–193）称之为“原初状态”，Gauthier（1986, 14–16, 131–134, passim）称之为“初始谈判地位”；二是对契约各方的刻画，尤其是就他们的理性与达成协议的动机而言。初始情境设定了讨价还价理论所称的“无协议地位”，即个体在未能达成协议或契约时所回到的那种情境。这一情境可能更敌对或更温和，更少或更多社会性，取决于理论家如何刻画在缺乏道德或正义规则时的人类生活。但就所有自利契约论理论而言至关重要的是：初始情境中存在着某种稀缺或竞争的动机，也存在着从社会互动与合作中获利的可能。"
  - id: 4
    source: "In contemporary normative contractarian theories, that is, theories that attempt to ground the legitimacy of government or theories that claim to derive a moral ought, the initial position represents the starting point for a fair, impartial agreement. While contractualists justify the requirement of a fair, impartial agreement by reasons external to the contract, contractarians hold that the success of the contract in securing cooperative interaction itself requires that the starting point and procedures be fair and impartial."
    step1: "在当代规范性的自利契约论理论中——即试图为政府之合法性奠基的理论，或声称能推出道德上之“应当”的理论——初始地位代表着一个公平、公正协议的起点。非自利契约论者用契约之外的理由来为公平、公正协议这一要求作辩护，而自利契约论者则认为，契约在保障合作性互动方面的成功本身，就要求其起点与程序是公平且公正的。"
    step2: "在当代规范性的自利契约论理论中——即那些试图为政府的合法性奠定基础的理论，或那些声称能推出道德“应当”的理论——初始地位代表着公平、公正协议的出发点。非自利契约论者用契约之外的理由来证成公平、公正协议这一要求，而自利契约论者则认为，契约要成功保障合作性互动，本身就要求其出发点与程序是公平且公正的。"
  - id: 5
    source: "Some of the more recent literature focuses on how contractarian theories can ensure the fairness and impartiality of the initial bargaining situation without appealing to any external, independent moral norms as the contractualist does. For the contractarian, all moral norms are supposed to be the result of agreement by rational agents, but if the contractarian has to appeal to prior moral norms in order to secure agreement then it’s not clear what sort of work the agreement is actually doing in establishing the content of the moral norms. At the same time, if there are no constraints at all over the initial situation then the outcome agreed to may fail to be a moral outcome, and may instead be an outcome according to the principle, as Rawls puts it, “to each according to his threat advantage” (1971, 141). Two potential strategies are to argue that assumptions designed to ensure the fairness and impartiality of the initial situation, such as the assumption that the contractors are symmetrically situated, either follow as a condition of rationality or are justified on strategic grounds. The idea that certain assumptions like symmetry follow as implications from the exercise of rationality has attracted recent criticism on grounds that such assumptions represent substantive constraints theoretically inaccessible to contractarians (Thrasher 2014)[^thrasher-2014]. Others have attempted to defend the presence of such assumptions in contractarian theory (Thoma 2015)[^thoma-2015]."
    step1: "较近的一些文献关注：自利契约论理论如何能在不诉诸非自利契约论者所诉诸的那种外在、独立道德规范的情况下，确保初始谈判情境的公平与公正。对自利契约论者而言，一切道德规范都应当是理性主体达成协议的结果；但如果自利契约论者必须诉诸先在的道德规范才能确保协议达成，那么协议在确立道德规范内容方面实际上起了什么作用，就不清楚了。与此同时，如果对初始情境没有任何约束，那么所同意的结果可能就不是一个道德的结果，而可能是如罗尔斯所说的、依据“各按各的威胁优势来分配”（to each according to his threat advantage）这一原则的结果（1971, 141）。两种可能的策略是：论证那些旨在确保初始情境公平与公正的假设——例如缔约者处于对称地位的假设——要么作为理性的一个条件而得出，要么在策略性理由上得到辩护。认为某些假设（如对称性）是运用理性的推论结果这一观念，近来遭到批评，理由是这些假设代表了对自利契约论者而言在理论上不可及的那种实质性约束（Thrasher 2014）[^thrasher-2014]。另一些人则试图为这类假设在自利契约论理论中的存在作辩护（Thoma 2015）[^thoma-2015]。"
    step2: "较近的一些文献关注：自利契约论理论如何能在不诉诸非自利契约论者所援引的那种外在、独立的道德规范的情况下，确保初始谈判情境的公平与公正。对自利契约论者而言，一切道德规范都应当是理性主体达成协议的结果；但如果自利契约论者必须诉诸先在的道德规范才能确保协议达成，那么协议在确立道德规范内容方面究竟起了什么作用，就不清楚了。与此同时，如果对初始情境毫无约束，那么所达成的结果可能就不是一个道德结果，而可能是如罗尔斯所说的、依据“各按各的威胁优势来分配”（to each according to his threat advantage）这一原则得出的结果（1971, 141）。有两种可能的策略：一是论证那些旨在确保初始情境公平与公正的假设——例如缔约者处于对称地位这一假设——要么作为理性的一个条件而成立，要么在策略性根据上得到辩护。认为某些假设（如对称性）是运用理性所推出的含义这一观念，近来招致批评，理由是这些假设代表了自利契约论者在理论上无法企及的那种实质性约束（Thrasher 2014）[^thrasher-2014]。另一些人则试图为这类假设在自利契约论理论中的存在作辩护（Thoma 2015）[^thoma-2015]。"
  - id: 6
    source: "Some points of controversy among contractarians concern the role of the initial situation in the theory: is it to be considered an actual historical situation, a possible historical moment, or is the contract situation completely hypothetical? David Hume (1987/1777, 470–1) was the first to raise the decisive objection to any normative moral or political theory based on a historical contract: the consent of one's ancestors do not bind oneself. Contemporary political philosophers have raised similar concerns about a hypothetical contract: insofar as the agreement is *hypothetical* then it cannot be said to represent agreement at all (Dworkin 1975)[^dworkin-1975]. In response to these sorts of objections, some contractarians defend the hypothetical contract on heuristic grounds by insisting that the point of the contract device is not to directly bind the contractors but rather to provide a kind of thought experiment by which to discover the requirements of practical rationality (Gauthier 1986, ch. VII)[^gauthier-1986]. That is, they argue that if one is rational, and among rational others in circumstances in which agreement is both possible and beneficial, then rationality requires that one abide by the terms of the contract. While mainstream contractarian theories are hypothetical contract theories, an interesting and powerfully subversive use of contractarianism (Mills 1997; Pateman 1989; Pateman & Mills 2007—see section on Subversion of Contractarianism below)[^mills-1997][^pateman-1989][^pateman-2007] reads the contract situation as historical agreements to erect and maintain white supremacy and patriarchy or male dominance. These latter contractarian theories are not justifications of the status quo, of course, but rather explanations and condemnations, and therefore do not face Hume's objection. Other questions that divide contemporary contractarians include: What are the ideal conditions and who are the ideal contractors that will make obligatory the outcomes of the contract for actual persons? What is the content of the hypothetical agreement?"
    step2: "自利契约论者之间存在争议的若干要点，涉及初始情境在理论中的作用：它应被视为一个实际的历史情境、一个可能的历史时刻，还是说契约情境完全是假设性的？大卫·休谟（1987/1777, 470–1）是第一个对基于历史契约的任何规范性道德或政治理论提出决定性异议的人：祖先的同意并不约束我们自己。当代政治哲学家对假设性契约提出了类似的担忧：只要协议是 *hypothetical*（假设性）的，就不能说它代表了任何真正的同意（Dworkin 1975）[^dworkin-1975]。面对这类异议，一些自利契约论者从启发性的根据出发为假设性契约辩护，坚称契约装置的要义并不在于直接约束缔约者，而在于提供一种思想实验，借以发现实践理性的要求（Gauthier 1986, ch. VII）[^gauthier-1986]。也就是说，他们论证：如果一个人是理性的，并且身处理性他者之间、处于协议既可能又有益的情境中，那么理性就要求他遵守契约的条款。尽管主流自利契约论理论都是假设性契约理论，但自利契约论有一种有趣而极具颠覆性的用法（Mills 1997; Pateman 1989; Pateman & Mills 2007——见下文“颠覆性自利契约论”一节）[^mills-1997][^pateman-1989][^pateman-2007]，它把契约情境解读为建立并维持白人至上与父权制或男性统治的历史性协议。这些后一种自利契约论理论当然不是对现状的辩护，而是解释与谴责，因此并不面临休谟的异议。其他使当代自利契约论者产生分歧的问题包括：什么样的理想条件与理想的缔约者，会使契约的结果对实际的人具有约束力？假设性协议的内容是什么？"
  - id: 7
    source: "The second element of a contractarian theory characterizes the potential contractors. There are two subparts to this: first, contractors have minimal other-directed desires or preferences, and second, contractors have a capacity for rational interaction with others. Contractarian (as opposed to contractualist) theories embrace a high standard for motivating making (and keeping) agreements. They avoid assuming that persons have preferences for moral behavior as such in order to ground rules of morality or justice in rational self-interest. Since persons' interests do not necessarily include the well-being of others, the main challenge for contractarianism is to show that even without such other-directed preferences, it would be rational to be moral. Such self-directed preferences are called \"non-tuistic\" (Gauthier 1986, 87)[^gauthier-1986]. However, there are reasons to think that narrowing the preferences of contractors to include only non-tuistic preferences is neither necessary nor helpful in grounding morality. One reason is because such a restriction of preferences means that actual persons will not be willing to comply with the bargain that is made, under the assumption that they do not have such narrowly construed preferences (Hubin 1991)[^hubin-1991]. On the other hand, allowing positive tuistic preferences to play a role in bargaining on morality and justice may create the possibility for individuals to be exploited for their fellow feelings (Dimock 1999)[^dimock-1999]. This is especially a problem for women, as Dimock points out, since in most cultures women are trained from childhood by sexist norms and gender roles to prefer the well-being of others to their own. Negative tuistic preferences pose a different challenge as a type of moral skepticism for either theorists who would exclude them or those who would include them in a contractarian theory (Superson 2009)[^superson-2009]. The former group include Rawls and Gauthier, who have argued that negative tuistic preferences (envy, jealousy, spite, vengeance) make cooperation for mutual advantage impossible and therefore are irrational (Rawls 1971, 142–150, 530–534; Gauthier 1986, 311, 329)[^gauthier-1986][^rawls-1971]. But this response significantly narrows the scope of application of the theory, since such emotions are common. The latter group faces the challenge of showing how mutual advantage overcomes these negative, other-directed emotions."
    step2: "自利契约论理论的第二个要素刻画潜在的缔约者。它包含两个子部分：其一，缔约者具有最低限度的指向他者的欲望或偏好；其二，缔约者具有与他人进行理性互动的能力。自利契约论（区别于非自利契约论）理论对促使达成（并遵守）协议抱持一种高标准。它们避免假定人具有对道德行为本身的偏好，以便把道德或正义规则奠定在理性自利之上。既然人的利益未必包含他人的福祉，自利契约论的主要挑战就在于表明：即使没有这种指向他者的偏好，成为有道德的人也是理性的。这种指向自我的偏好被称为“非他涉”（non-tuistic）（Gauthier 1986, 87）[^gauthier-1986]。然而，有理由认为，把缔约者的偏好限定为只含非他涉偏好，对奠定道德既非必要也无助益。理由之一是：这种对偏好的限制意味着，在假定实际的人并不具有这种狭隘设定的偏好的情况下，他们就不会愿意遵守所达成的协议（Hubin 1991）[^hubin-1991]。另一方面，让积极的他涉偏好（positive tuistic preferences）在关于道德与正义的讨价还价中发挥作用，可能造成个体因自己的同类情感而遭剥削的可能（Dimock 1999）[^dimock-1999]。正如 Dimock 所指出的，这对女性尤其成问题，因为在大多数文化中，女性从小就受性别歧视规范与性别角色的训练，倾向于把他人的福祉置于自己的福祉之上。消极的他涉偏好（negative tuistic preferences）则构成另一种挑战：作为一种道德怀疑论，它既困扰那些想把它们排除在外的理论家，也困扰那些想把它们纳入自利契约论理论的理论家（Superson 2009）[^superson-2009]。前一组包括罗尔斯与 Gauthier，他们论证过：消极的他涉偏好（嫉妒、猜忌、怨恨、复仇）使互利的合作不可能，因而都是非理性的（Rawls 1971, 142–150, 530–534; Gauthier 1986, 311, 329）[^gauthier-1986][^rawls-1971]。但这种回应显著收窄了理论的适用范围，因为这些情感相当常见。后一组则面临这样的挑战：表明互利如何克服这些消极的、指向他者的情感。"
  - id: 8
    source: "Second, persons are presumed to be instrumentally rational and so capable of understanding how the satisfaction of their desires can be helped by cooperative social interaction. Contractarians characterize practical rationality instrumentally, subjectively, and preferentially. Acting rationally entails maximizing satisfaction of one's own subjective preferences. Contractarians rely on the crucial fact about humans that we are able to cooperate to produce more than each working alone, thus making it rational to cooperate under at least some terms. Self-interest and rationality imply a desire to cooperate provided that cooperators can do so without sacrificing their self-interest. The desire to benefit from cooperation in turn makes persons rationally concerned about their reputations for adhering to the moral norms that make cooperation possible and rational. (See feminist perspectives on the self (Section 1, Critique) for a critique of this conception of the rational person.)"
    step2: "其次，人被假定为工具理性的，因而能够理解合作性社会互动如何有助于其欲望的满足。自利契约论者从工具性、主观性与偏好性的角度刻画实践理性。理性地行动意味着使自己对自身主观偏好的满足最大化。自利契约论者依赖于人类这样一个关键事实：我们能够合作，从而比各自单独劳作生产得更多，这使合作在至少某些条款下成为理性的。自我利益与理性蕴含着合作的欲望，条件是合作者能够在不牺牲自我利益的情况下进行合作。从合作中获益的欲望，反过来又使人理性地关心自己遵守那些使合作成为可能、成为理性的道德规范的声誉。（对这种理性人观念的批判，见论自我的女性主义视角（第 1 节，批判）。）"
  - id: 9
    source: "Contractarians seek to show that without rules of justice for cooperation, persons are worse off by their own lights. Hence it is rational to adopt some rules for morality and justice. These two aspects of the contractarian individual—self-interest and the ability to benefit from interaction with others—along with the conditions of moderate scarcity imply what Rawls following Hume called the \"circumstances of justice\": the conditions under which rules for justice could be both possible and necessary (1971, 109–112). Justice, and a social contract, is only possible where there is some possibility of benefit to each individual from cooperation."
    step2: "自利契约论者力图表明：如果没有用于合作的正义规则，按人们自己的判断，他们就会变得更糟。因此，采纳某些道德与正义规则是理性的。自利契约论个体的这两个方面——自我利益与从与他人互动中获益的能力——再加上适度稀缺的条件，蕴含着罗尔斯追随休谟所称的“正义环境”（circumstances of justice）：即正义规则既可能又必要的那些条件（1971, 109–112）。正义以及社会契约，只有在每个个体都有从合作中获益的某种可能的地方，才是可能的。"
  - id: 10
    source: "Contractarian social contract theories take individuals to be the best judges of their interests and the means to satisfy their desires. For this reason, there is a close connection between liberalism and contractarianism. However, that is not to say that all contractarian thought is liberal. Hobbes, for example, argued in favor of what Jean Hampton has called the \"alienation contract\" (1986, 3, 103, 256–265), that is, a contract on the part of a people to alienate their rights to adjudicate their own disputes and self-defense to a sovereign, on the grounds that that was the only way to keep the peace given the nature of the alternative, which he famously characterized as life that would be \"solitary, poore, nasty, brutish, and short.\" Thus, given a bad enough initial situation, contractarianism may lead to the legitimation of totalitarianism. Another point of criticism that arises from the characterization of the parties to the contract is that they must be able to contribute to the social product of interaction, or at least to threaten to destabilize it. This is because each individual has to be able to benefit from the inclusion of all those included. But this threatens to leave many, such as the severely disabled, the global poor, and animals outside the realm of justice, an implication that some find completely unacceptable (Kittay 1999; Nussbaum 2006)[^kittay-1999][^nussbaum-2006]."
    step2: "自利契约论的社会契约理论把人视为自身利益以及满足欲望之手段的最佳判断者。正因如此，自由主义与自利契约论之间有着密切的联系。但这并不是说所有自利契约论思想都是自由主义的。例如，霍布斯为 Jean Hampton 所称的“让渡契约”（alienation contract）作了辩护（1986, 3, 103, 256–265）——即人民把裁决自身争端与自卫的权利让渡给主权者的契约，理由是鉴于替代方案的秉性，这是维持和平的唯一途径；而他对替代方案的著名刻画是：生活将“孤独、贫穷、肮脏、野蛮而短暂”。因此，只要初始情境足够糟糕，自利契约论就可能导向极权主义的合法化。由对契约各方的刻画引出的另一个批评之点是：他们必须能够对互动的社会产品作出贡献，或至少能够以破坏稳定相威胁。这是因为每个个体都必须能够从把所有人都包括进来中获益。但这有可能使许多人——如严重残障者、全球贫困者与动物——被排除在正义领域之外，这一含义在有些人看来完全不可接受（Kittay 1999; Nussbaum 2006）[^kittay-1999][^nussbaum-2006]。"
  - id: 11
    source: "Social contract theories also require some rules to guide the formation of agreement. Since they are prior to the contract, there must be some source of prior moral norms, whether natural, rational, or conventional. The first rule that is normally prescribed is that there must be no force or fraud in the making of the agreement. No one is to be \"coerced\" into agreement by the threat of physical violence. The reasoning for this is quite straightforwardly prudential: if one is allowed to use violence, then there is no real difference between the \"contract\" arrived at and the state of nature for the threatened party, and hence no security in the agreement. However, there is a fine line between being coerced by the threat of violence into giving up one's rights and being convinced by the threat of penury to make an unfavorable agreement. For this reason contractarians like Gauthier are able to argue for a fair and impartial starting point for bargaining that will lead to secure and stable agreements. The second rule of contract is that each individual who is a legitimate party to the contract must agree to the rules of justice, which are the outcomes of the contract."
    step2: "社会契约理论还需要一些规则来指导协议的形成。由于这些规则先于契约而存在，就必须存在某种先在道德规范的来源，无论是自然的、理性的还是习俗的。通常规定的第一条规则是：在达成协议时不得有暴力或欺诈。任何人都不得因身体暴力的威胁而被“胁迫”进入协议。其中的推理相当直白地出于审慎：如果允许使用暴力，那么对受威胁的一方而言，所达成的“契约”与自然状态就没有真正区别，因而协议中也就没有保障。然而，因暴力威胁而被迫放弃权利，与因贫困的威胁而被说服作出不利的协议，二者之间有一条细微的界线。正因如此，像 Gauthier 这样的自利契约论者能够为讨价还价论证一个公平而公正的起点，从而导向稳固而稳定的协议。契约的第二条规则是：每一个作为合法缔约方的个体，都必须同意正义规则，而这些规则正是契约的结果。"
  - id: 12
    source: "The metaphor of the social contract requires some interpretation in order to apply it to the situation of morality or politics. The interpretation can be specified by determining answers to three questions. First, what is the agreement on? Possible answers include the principles of justice (Rousseau, Rawls), the design of the basic social institutions (Rawls), the commitment to give up to a sovereign government (some or all of) one's rights (Hobbes, Locke), the adoption of a disposition to be (conventionally) moral (Gauthier, Hampton). The second question is how the agreement is to be thought of: as a hypothetical agreement? An actual historical agreement? An implicit historical situation? The third question is whether the contract device is to be used as justification or explanation. As discussed above, normative contractarianism uses the contract device primarily as justification, but it may be that Hobbes and Locke thought that there was an explanatory element to the contract device. As will be discussed below (Subversive Contractarianism), an important contemporary contractarianism uses an implicit contract to explain the origin of oppression."
    step2: "社会契约的隐喻需要一定的诠释，才能把它应用于道德或政治情境。这一诠释可以通过确定三个问题的答案来加以规定。第一，协议是关于什么的？可能的答案包括：正义原则（卢梭、罗尔斯）、基本社会制度的设计（罗尔斯）、把（部分或全部）权利让渡给主权政府的承诺（霍布斯、洛克）、采纳一种（习俗性地）有道德的倾向（Gauthier、Hampton）。第二个问题是，协议应如何被设想：是作为一项假设性协议？一项实际的历史性协议？还是一种隐含的历史情境？第三个问题是，契约装置是应被用作证成还是解释。如上所述，规范性自利契约论主要把契约装置用作证成，但霍布斯与洛克或许认为契约装置具有一种解释性成分。如下文（颠覆性自利契约论）将要讨论的，一种重要的当代自利契约论用隐含契约来解释压迫的起源。"
  - id: 13
    source: "A brief sketch of the most complete and influential contemporary contractarian theory, David Gauthier's, is in order. Gauthier's project in *Morals By Agreement* is to employ a contractarian approach to grounding morality in rationality in order to defeat the moral skeptic. (However, Anita Superson (2009) points out that Gauthier attempts to answer only the skeptic who asks \"why should I be moral?\" but leaves both the motive skeptic, who argues that it is enough to act morally but need not be motivated by morality, and the amoralist, who denies that there is any such thing as morality, that is, that there are true moral statements.) It is generally assumed that humans can have no perfect natural harmony of interests (otherwise morality would be largely superfluous), and that there is much for each individual to gain through cooperation. However, moral constraint on the pursuit of individual self-interest is required because cooperative activities almost inevitably lead to a prisoner's dilemma: a situation in which the best individual outcomes can be had by those who cheat on the agreement while the others keep their part of the bargain. This leads to the socially and individually sub-optimal outcome wherein each can expect to be cheated by the other. But by disposing themselves to act according to the requirements of morality whenever others are also so disposed, they can gain each others' trust and cooperate successfully."
    step2: "此处有必要对最完备、最具影响力的当代自利契约论理论——David Gauthier 的理论——作一简要勾勒。Gauthier 在《协议道德》（*Morals By Agreement*）中的计划是，采用一种把道德奠定在理性之上的自利契约论进路，以击败道德怀疑论者。（然而，Anita Superson（2009）指出，Gauthier 只想回答那个问“我为什么要讲道德？”的怀疑论者，却既放过了动机怀疑论者——他主张只要道德地行动就够了，而不必由道德来驱动——也放过了非道德主义者——他否认存在道德这样一种东西，即否认存在真的道德陈述。）人们通常假定，人类不可能拥有完美的自然利益和谐（否则道德在很大程度上就是多余的），而且每个个体都能通过合作获得大量好处。然而，对追求个体自我利益施加道德约束是必要的，因为合作活动几乎不可避免地导向囚徒困境：在这种情境中，那些违反协议、而其他人信守自己一方的交易者，能获得最佳个体结果。这导致社会与个体次优的结果，其中每个人都可以预期会被对方作弊。但只要使自己倾向于在他人也同样倾向于道德要求时按道德要求行动，他们就能获得彼此的信任并成功合作。"
  - id: 14
    source: "The contractarian element of the theory comes in the derivation of the moral norms. The compliance problem—the problem of justifying rational compliance with the norms that have been accepted—must drive the justification of the initial situation and the conduct of the contracting situation. It is helpful to think of the contract situation as a bargain, in which each party is trying to negotiate the moral rules that will allow them to realize optimal utility, and this has led philosophers to apply a number of bargaining solutions to the initial contract situation. Gauthier's solution is the \"minimax relative concession\" (1986, ch. V). The idea of minimax relative concession is that each bargainer will be most concerned with the concessions that she makes from her ideal outcome relative to the concessions that others make. If she sees her concessions as reasonable relative to the others, considering that she wants to ensure as much for herself as she can while securing agreement (and thereby avoiding the zero-point: no share of the cooperative surplus) and subsequent compliance from the others, then she will agree to it. What would then be the reasonable outcome? The reasonable outcome, according to this view, is the outcome that minimizes the maximum relative concessions of each party to the bargain (Gauthier 1986, ch. V)[^gauthier-1986]."
    step2: "该理论的自利契约论要素体现在道德规范的推导中。服从问题——即证成对已被接受的规范的理性服从的问题——必须推动对初始情境的证成，以及缔约情境的进行。把契约情境设想为一桩讨价还价是有益的，其中每一方都在试图商定那些能使其实现最优效用的道德规则，而这使哲学家们把一系列讨价还价解应用于初始契约情境。Gauthier 的解是“极小极大相对让步”（minimax relative concession）（1986, ch. V）。极小极大相对让步的观念是：每个讨价还价者最关心的是，她自己从其理想结果所作的让步相对于他人所作让步的比率。如果她认为自己的让步相对于他人是合理的——考虑到她希望在确保协议（从而避免零点：对合作剩余的零份额）以及他人随后的服从的同时，尽可能为自己多争取——那么她就会同意这一结果。那么合理的结果是什么？依此观点，合理的结果是使讨价还价每一方的最大相对让步最小化的结果（Gauthier 1986, ch. V）[^gauthier-1986]。"
  - id: 15
    source: "In a more recent article and in contrast to his previous view, Gauthier rejects the idea that the problem of grounding morality in rationality should be framed as a bargaining problem at all (2013). When the problem is framed in this way, the solution depends on assuming that the parties participating in the contract negotiations are all rational maximizers. Under his revised view, however, he neither sees the problem as a bargaining problem nor the parties as (constrained) rational maximizers; instead, he conceives of them as Pareto-optimizers. As Pareto-optimizers or rational cooperators, the parties seek to produce a Pareto-optimal outcome, which is an outcome where it is not possible to increase the payoff to one party without decreasing the payoff to another party. If it is possible to move to another outcome to increase the payoff accruing to one party without decreasing the payoff to another party, then the current outcome is not Pareto-optimal. It is important to note that this change is not meant to attach additional motives to the parties in addition to the motive of self-interest. Rational cooperation, according to Gauthier, provides an alternative conception of what constitutes rational action. Rational cooperators do not want to leave the additional benefits of cooperation on the table. How do these changes solve the original problem of grounding morality in (this conception of) rationality? The answer is to calculate the payoffs for each outcome in terms of cooperative benefits or the absence of cooperative benefits. For example, the cooperative minimum is a payoff which provides one party with none of benefits generated through cooperation. In contrast, the cooperative maximum is the payoff which affords a single party all of the possible benefits generated through cooperation. The potential cooperative gain is the difference between these two. The actual cooperative gain is then the difference between its payoff and the party's cooperative minimum. Next, the actual cooperative gain is then to be divided by the party's potential cooperative gain. This generates the party's proportionate gain, which shows the actual gain as a proportion of the party's potential gain from cooperation. Each outcome is then represented as a proportionate gain from cooperation. Finally, the goal is to select that outcome generating the maximum minimum proportionate gain to any single party. This principle, which Gauthier calls maximin proportionate gain, selects a Pareto-optimal outcome that would be rational for parties to select."
    step2: "在较近的一篇文章中，Gauthier 一改先前的观点，拒绝把奠定道德于理性的问题框定为讨价还价问题（2013）。当问题如此框定时，其解依赖于假定参与契约谈判的各方都是理性最大化者。然而，在他的修正观点下，他既不看该问题为讨价还价问题，也不把各方看作（受约束的）理性最大化者；相反，他把他们设想为帕累托优化者。作为帕累托优化者或理性合作者，各方寻求产生一个帕累托最优结果，即这样一种结果：不减少某一方的收益，就不可能增加另一方的收益。如果可以转向另一结果，在不减少另一方的收益的情况下增加某一方的收益，那么当前结果就不是帕累托最优的。重要的是要注意，这一改变并非要在自我利益动机之外，再给各方附加额外的动机。按 Gauthier 的说法，理性合作提供了另一种关于什么构成理性行动的构想。理性合作者不想把合作的额外好处留在桌上。这些改变如何解决把道德奠定于（这种意义上的）理性的原初问题？答案是：依据合作收益或合作收益的缺失，来计算每个结果的收益。例如，合作最小是一种收益，它使一方从合作中产生的收益一无所获。相比之下，合作最大是一种收益，它使单独一方获得合作所产生的全部可能收益。潜在合作收益是这两者之差。实际合作收益则是该方的收益与其合作最小之差。接着，实际合作收益要除以该方的潜在合作收益。这产生该方的比例收益，它表明实际收益作为该方从合作中潜在收益的一个比例。然后，每个结果都被表示为从合作中所得的比例收益。最后，目标是选取使任何单独一方的最大最小比例收益（maximin proportionate gain）最大的那个结果。这一原则——Gauthier 称之为最大最小比例收益——选取的是一个各方选择起来理性的帕累托最优结果。"
  - id: 16
    source: "Equally important to the solution as the procedure is the starting point from which the parties begin. For some contractarians (like Gauthier) there is no veil of ignorance—each party to the contract is fully informed of their personal attributes and holdings. However, without the veil of ignorance, contractors will be aware of the differences in bargaining power that could potentially affect the outcome of the bargain. It is important, then, that the initial position must have been arrived at non-coercively if compliance to the agreement is to be secured. A form of the \"Lockean proviso\" (modeled after Locke's description of the initial situation of his social contract): that one cannot have bettered himself by worsening others, may turn out to be beneficial in cases without a veil of ignorance. In sum, the moral norms that rational contractors will adopt (and comply with) are those norms that would be reached by the contractors beginning from a position each has attained through her own actions which have not worsened anyone else, and adopting as their principle for agreement the rule of minimax relative concession (Gauthier 1986, ch. VII)[^gauthier-1986]."
    step2: "与解本身同样重要的是各方开始时的起点。对某些自利契约论者（如 Gauthier）而言，不存在无知之幕——契约的每一方都充分了解自己的个人属性与所有物。然而，没有无知之幕，缔约者就会意识到讨价还价能力的差异，这些差异可能影响讨价还价的结果。因此，重要的是：如果要确保对协议的服从，初始地位就必须是以非强制的方式达到的。一种“洛克式限制”（Lockean proviso）（模仿洛克对其社会契约初始情境的描述）：一个人不能通过使他人变糟而使自己变好，在没有无知之幕的情形下可能是有益的。总之，理性缔约者将采纳（并遵守）的那些道德规范，是这样一些规范：缔约者从各自通过自己的行动——这些行动没有使任何其他人变糟——所达到的地位出发，并采纳极小极大相对让步规则作为其协议原则，从而达成的规范（Gauthier 1986, ch. VII）[^gauthier-1986]。"
  - id: 17
    source: "On one line of thought, contractarianism produces liberal individuals who seem well suited to join the kind of society that Rawls envisioned (Gauthier 1986, ch. XI)[^gauthier-1986]. On another line, the Hobbesian contractarian argument leads towards the sparse government of libertarianism (Narveson 1988)[^narveson-1988]. The controversy here turns on the primary motivation for individuals to make agreements and cooperate. As we said before, there are two such motivations for the Hobbesian contractarian: fear of the depredations of others and benefits from cooperation with others. Libertarianism results when the first of these is primary, whereas when the second is primary, the kind of reciprocity and supportive government that will be discussed in the final section becomes possible."
    step2: "一条思路认为，自利契约论产生出自由主义的个体，他们似乎很适合加入罗尔斯所设想的那种社会（Gauthier 1986, ch. XI）[^gauthier-1986]。另一条思路中，霍布斯式自利契约论论证导向自由至上主义那种最小的政府（Narveson 1988）[^narveson-1988]。这里的争议在于个体作出协议并进行合作的首要动机。如前所述，对霍布斯式自利契约论者而言有两种这样的动机：对他人掠夺的恐惧，以及与他人合作带来的好处。当前者是首要动机时，就得出自由至上主义；而当后者是首要动机时，最后一节所讨论的那种互惠与支持性政府就成为可能。"
  - id: 18
    source: "Many critiques have been leveled against particular contractarian theories and against contractarianism as a framework for normative thought about justice or morality. (See the entry on contemporary approaches to the social contract.) Jean Hampton criticized Hobbes in her book *Hobbes and the Social Contract Tradition*, in a way that has direct relevance to contemporary contractarianism. Hampton argues that the characterization of individuals in the state of nature leads to a dilemma. Hobbes' state of nature as a potential war of all against all can be generated either as a result of passions (greed and fear, in particular) or rationality (prisoner's dilemma reasoning, in which the rational players each choose to renege on agreements made with each other). But if the passions account is correct, then contractors will still be motivated by these passions after the social contract is drawn up, and so will fail to comply with it (Hampton 1986)[^hampton-1986]. And if the rationality account is correct, then rational actors will not comply with the social contract any more than they will cooperate with each other before it is made."
    step2: "人们针对特定的自利契约论理论，以及针对作为关于正义或道德的规范性思想框架的自利契约论，提出了许多批评。（见“社会契约论的当代方法”一词条。）Jean Hampton 在她的著作《霍布斯与社会契约传统》（*Hobbes and the Social Contract Tradition*）中，以一种与当代自利契约论直接相关的方式批评了霍布斯。Hampton 论证，对自然状态中个体的刻画会导致一个两难。霍布斯的自然状态作为一场一切人对一切人的潜在战争，可以由激情（尤其是贪婪与恐惧）产生，也可以由理性产生（囚徒困境式的推理，其中理性的玩家都选择背弃彼此达成的协议）。但如果激情的说明是对的，那么在社会契约订立之后，缔约者仍会受这些激情驱动，因而将不遵守它（Hampton 1986）[^hampton-1986]。如果理性的说明是对的，那么理性行动者不会遵守社会契约，正如他们在契约订立之前不会彼此合作一样。"
  - id: 19
    source: "This critique has an analog for theories (such as Gauthier's) that claim that without the contract individuals will be stuck in some social sub-optimal situation that is bad enough to motivate them to make concessions to each other for some agreement, yet the reason for their inability to cooperate without the contract cannot continue to operate after the contract is made. A potential solution to this problem is to argue that individuals will choose to dispose themselves to be constrained (self-interest) maximizers rather than straightforward (self-interest) maximizers, that is, to retrain themselves not to think first of their self-interest but rather to dispose themselves to keep their agreements, provided that they find themselves in an environment of like-minded individuals (Gauthier 1986, 160–166)[^gauthier-1986]. But this solution has been found dubitable by many commentators (see Vallentyne 1991)[^vallentyne-1991]. Michael Moehler argues that this move by Gauthier to constrained maximization moralizes the account of practical reasoning, and in doing so, moves outside the bounds of traditional contractarianism (Moehler 2020)[^moehler-2020]."
    step2: "这一批评对某些理论（如 Gauthier 的理论）有一个对应版本，这些理论主张：没有契约，个体将陷入某种糟糕到足以促使他们为达成协议而彼此让步的社会次优情境；然而，他们不借助契约就无法合作的原因，在契约订立之后却不能继续起作用。解决这一问题的一个可能方案是论证：个体会选择使自己倾向于成为受约束的（自我利益）最大化者，而非径直的（自我利益）最大化者，也就是说，重新训练自己，使其不首先考虑自我利益，而是使自己倾向于遵守协议，前提是他们发现自己身处志同道合者的环境之中（Gauthier 1986, 160–166）[^gauthier-1986]。但许多评论者认为这一方案可疑（见 Vallentyne 1991）[^vallentyne-1991]。Michael Moehler 论证，Gauthier 向受约束最大化的这一转向，把实践推理的说明道德化了，并由此越出了传统自利契约论的界限（Moehler 2020）[^moehler-2020]。"
  - id: 20
    source: "Hampton also objects to the contemporary contractarian assumption that interaction is merely instrumentally valuable. She argues that if interaction were only valuable for the fruits of cooperation that it bears for self-interested cooperators, then it would be unlikely that those cooperators could successfully solve the compliance problem. In short, they are likely not to be able to motivate morality in themselves without some natural inclination to morality. Interestingly, Hampton agrees with Gauthier that contractarianism is right to require any moral or political norms to appeal to individuals' self-interest as a limitation on self-sacrifice or exploitation of any individual."
    step2: "Hampton 还反对当代自利契约论的这个假设：互动仅仅具有工具性价值。她论证，如果互动只对自利的合作者所结出的合作果实才有价值，那么这些合作者就不太可能成功地解决服从问题。简言之，如果没有某种对道德的自然倾向，他们很可能无法在自己身上激发道德。有趣的是，Hampton 同意 Gauthier：自利契约论要求任何道德或政治规范都诉诸个体的自我利益，把这一点作为对任何个体的自我牺牲或剥削的限制，这是正确的。"
  - id: 21
    source: "Two further critiques can be raised against contractarianism (Southwood 2010)[^southwood-2010]. According to the normativity objection, contractarian morality is not sufficiently other-regarding because it motivates morality by appeal to one's self-interest rather than any concern of others. Because of this, the theory gives one no reason to feel guilt or remorse for wrongdoing, but rather, at most, self-directed anger or disappointment at acting irrationally. Southwood's objection can be seen as one way of filling out Superson's claim, mentioned above, that Gauthier's theory cannot respond to the motive skeptic. This objection overlooks the fact that some appeal to others' concerns is built into both the Lockean Proviso and the bargaining theory from which the content of the moral norms are derived. Furthermore, Kantian moral theory would seem to be subject to the same objection insofar as it appeals to autonomous rationality as the motive for acting morally. Gauthier can be seen as providing a response to the objection in the final chapter of *Morals by Agreement*, where he describes the \"liberal individual,\" whose moral psychology is shaped by living the moral life that mutual advantage contractarianism prescribes."
    step2: "可以针对自利契约论提出两项进一步的批评（Southwood 2010）[^southwood-2010]。根据规范性异议，自利契约论的道德不够关注他人，因为它通过诉诸自我利益而非对他人的任何关切来激发道德。正因如此，该理论不给人任何理由为做错事感到内疚或悔恨，而顶多是对自己非理性行动的自我指向的愤怒或失望。Southwood 的异议可被视为充实上述 Superson 主张的一种方式：Gauthier 的理论无法回应动机怀疑论者。这一异议忽视了一个事实：对他人关切的某种诉诸，已经同时内建于洛克式限制条款与从中推导出道德规范内容的讨价还价理论。此外，康德式道德理论似乎也受制于同样的异议，因为它诉诸自主理性作为道德地行动的动力。Gauthier 可被视为在《协议道德》的最后一章提供了对这一异议的回应，在那里他描述了“自由的个体”（liberal individual），其道德心理由过互利自利契约论所规定的道德生活所塑造。"
  - id: 22
    source: "According to the impartiality objection, all human persons are owed certain duties regardless of their powers or abilities, and because it relies on an instrumental and subjective conception of practical reason, contractarianism cannot explain how this would be so. Contractarianism, on the contrary, holds it to be irrational to treat truly powerless persons equally, since it is not mutually advantageous to do so. This problem, which is similar to the exclusion problem discussed above and in section 6 below, is a serious problem. Gauthier's Lockean Proviso was meant to rule out taking historical patterns of dominance into account, but even if all such dominance relations were eliminated and bargaining were conditioned on undominated assets, the inequality in natural talents and abilities would reintroduce the possibility of dominance."
    step2: "根据公正性异议，所有的人都负有某些义务，无论其力量或能力如何；而由于它依赖一种工具性、主观性的实践理性观念，自利契约论无法解释这一点为何成立。相反，自利契约论认为，平等地对待真正无力的人是非理性的，因为这样做并不互利。这个问题——与上文及下文第 6 节所讨论的排斥问题相似——是一个严重的问题。Gauthier 的洛克式限制条款本意是要排除对历史性支配模式的考量；但即使所有这类支配关系都被消除，并且讨价还价以不受支配的资产为条件，自然天赋与能力上的不平等仍会重新引入支配的可能。"
  - id: 23
    source: "Contractarianism has also been criticized on racial grounds (Williams 1991)[^williams-1991]. Contracts require independent agents who are able to make and carry out promises without the aid of others. Historically, while white men have been treated as these pure wills of contract theory, Blacks and women have been treated as anti-will: dependent and irrational. Both ideals are false; whole people, she says, are dependent on other whole people. But by defining some as contractors and others as incapable of contract, whole classes of people can be excluded from the realm of justice. This point has been explored by other critics of contractarianism, first by Allen Buchanan (1993) and more recently by Eva Kittay (1999), who points out that not only are dependents such as children and disabled people left out of consideration by contractarian theories, but their caretakers' needs and interests will tend to be underestimated in the contract, as well."
    step2: "自利契约论还受到种族方面的批评（Williams 1991）[^williams-1991]。契约要求独立的行动者，他们能够不借助他人而作出并履行承诺。历史上，白人男性一直被当作契约理论的这些纯粹意志，而黑人（Blacks）与女性则被当作反意志（anti-will）：依赖的、非理性的。这两种理想都是错的；她说，完整的人是依赖其他完整的人的。但通过把一些人界定为缔约者、把另一些人界定为无缔约能力者，整个阶层的人都能被排除在正义领域之外。这一点已被自利契约论的其他批评者所探讨，先有 Allen Buchanan（1993），最近又有 Eva Kittay（1999）——她指出，不仅儿童与残障者这类被抚养者被自利契约论理论排除在考虑之外，而且他们的照料者的需要与利益也往往会在契约中被低估。"
  - id: 24
    source: "A descriptive use to which contractarianism has been put is to exploit the exclusionary, in-group/out-group nature of the contractarian project to illuminate the phenomenon of oppression. Carole Pateman's *The Sexual Contract* (1989) uses contractarian theory to argue that there has been an implicit contract among men to enforce patriarchy. She calls her approach a \"conjectural history,\" which she uses both to illuminate the actual history of patriarchal oppression of women and the ideology of social contract theory. Similarly, Charles Mills argues in *The Racial Contract* (1997) that whites have had an actual, historical, sometimes explicit, though often only implicit, contract to enforce white supremacy. The arguments are similar in their contractarian outlines, though they differ in the historical and factual details. According to both philosophers' theories, there are moral, political, and epistemological terms of the contract, and its effect has been to allow one group of persons effectively to dominate, subordinate, and exploit another group. The moral terms require the dominant group to evaluate the lives of their group more highly than those of the subordinated, the political to deprive the subordinate group of effective political power, and the epistemological terms require the members of the dominant group to see themselves as intellectually superior to the dominated. The social contract then can be seen as a justification by the parties to the contract of their interaction, and of their exploitation of those who are not parties to the contract, but only if the fundamental division of in-group and out-group is accepted. If the racial and sexual contracts were to be shown to be rational, they would constitute prima facie critiques of normative contractarianism, since they would then seem to justify racism and sexism. Pateman and Mills have more recently teamed up in *Contract and Domination* (2007) to explore their similarities and ways in which they diverge. Pateman extends her critique of the ideology of contract to the case of colonial appropriation of native peoples' lands with what she calls the \"settler contract.\" Mills also extends his analysis both in scope to include gender and class, and to give a normative application of the descriptive contract to the issue of reparations for slavery. He calls this more general contract the \"domination contract.\" While Pateman holds that contractarianism essentially permits domination, Mills holds that contract theory can be salvaged by beginning with a more realistic non-ideal starting point and asking how existing injustice ought, rationally be eliminated. However, his positive theory is contractualist rather than contractarian, as it begins with the premise of moral equality."
    step2: "自利契约论被用于的一种描述性用途，是利用自利契约论计划那种排斥性的、内群体/外群体（in-group/out-group）性质来阐明压迫现象。Carole Pateman 的《性契约》（*The Sexual Contract*）（1989）运用自利契约论理论论证：男性之间一直存在一项强制执行父权制的隐含契约。她把她的进路称为“推想的历史”（conjectural history），既用它来阐明对女性之父权制压迫的实际历史，也用它来阐明社会契约理论的意识形态。同样，查尔斯·米尔斯（Charles Mills）在《种族契约》（*The Racial Contract*）（1997）中论证：白人一直有一项实际存在的、历史性的、有时公开、往往只是隐含的契约，用以强制推行白人至上。这些论证在自利契约论的轮廓上相似，尽管它们在历史与事实细节上有所不同。根据两位哲学家的理论，契约有道德的、政治的认识论的条款，其效果一直是使一个人群有效地支配、臣服并剥削另一个人群。道德条款要求支配人群把其群体成员的生命评价得高于被臣服者的生命；政治条款要求剥夺被臣服人群的有效政治权力；认识论条款则要求支配人群的成员把自己视为在智力上优越于被支配者。于是，社会契约可被视为契约各方对他们互动、以及对他们剥削非缔约方的一种证成——但前提是内群体与外群体的根本划分得到接受。如果种族契约与性契约被证明是理性的，它们就构成对规范性自利契约论的初步（prima facie）批评，因为它们似乎就会证成种族主义与性别歧视。Pateman 与米尔斯最近在《契约与支配》（*Contract and Domination*）（2007）中联手，探讨它们的相似之处与分歧所在。Pateman 把她对契约意识形态的批评扩展到殖民地征用原住民土地的情形，她称之为“定居者契约”（settler contract）。米尔斯也扩展了他的分析，既在范围上把性别与阶级包括进来，也把描述性契约规范性地应用于奴隶制赔偿问题。他把这一更一般的契约称为“支配契约”（domination contract）。Pateman 认为自利契约论本质上允许支配，而米尔斯则认为契约理论可以通过从一个更现实的非理想起点出发、并追问现存不正义应如何理性地加以消除，来得到挽救。然而，他的肯定性理论是非自利契约论的而非自利契约论的，因为它以道德平等这一前提为出发点。"
  - id: 25
    source: "Several of the critiques surveyed above, then, center on the questions: who is allowed to be a party to the contract, and how are those who are excluded from the contract to be treated? On the normative contractarian view, it is only rational to include all of those who can both benefit and reciprocate benefits to others. Normative contractarianism, then, on the assumption that non-whites and women can both benefit and reciprocate benefits to others, shows the sexual and racial contracts to be fundamentally irrational. Gauthier, in fact, explicitly argued that his contractarianism aids the feminist project of ending exploitative intimate relationships. Contractarian morality disapproves of relationships that are not mutually advantageous without assuming ties of affection. He writes, \"sociality … becomes a source of exploitation if it induces persons to acquiesce in institutions and practices that but for their fellow-feelings would be costly to them\" (1984, 11). This theme is taken up in some defenses of feminist contractarianism (Hampton 1993)[^hampton-1993]. In the debate over contractarianism in feminist thought, there is a concern that contractualists beg the question of intrinsic value, and it is thought, in contrast, that (Hobbesian) contractarianism can underwrite feminist claims about the exploitative nature of caring relationships without the intrinsic value assumption (Sample 2002)[^sample-2002]. Lastly, in the hands of some philosophers social contract theory becomes a device for combating oppression, especially gender oppression, by uncovering adaptive preferences formed under conditions of oppression (Walsh 2015)[^walsh-2015]."
    step2: "于是，上文所考察的若干批评都集中在这样一些问题：谁被允许成为契约的一方？那些被排除在契约之外的人应如何被对待？按规范性自利契约论的观点，只把所有既能获益又能向他人回报利益的人都包括进来，才是理性的。于是，在非白人（non-whites）与女性既能获益又能向他人回报利益的假设下，规范性自利契约论表明性契约与种族契约根本上是非理性的。事实上，Gauthier 明确论证过，他的自利契约论有助于结束剥削性亲密关系这一女性主义事业。自利契约论的道德不赞成那些并非互利的关系，而不必假定情感纽带。他写道：“社会性……如果它诱使人们默许那些若非出于他们的同类情感就会使他们付出代价的制度与做法，那么它就成为一种剥削的根源”（1984, 11）。这一主题在一些对女性主义自利契约论的辩护中被接续（Hampton 1993）[^hampton-1993]。在女性主义思想关于自利契约论的争论中，有一种担忧：非自利契约论者在内在价值问题上循环论证；相反，人们认为（霍布斯式）自利契约论能够在不做内在价值假设的情况下，为女性主义关于照料关系之剥削性质的断言提供支撑（Sample 2002）[^sample-2002]。最后，在有些哲学家手中，社会契约理论成为反对压迫——尤其是性别压迫——的一种装置，其途径是揭示在压迫条件下形成的适应性偏好（Walsh 2015）[^walsh-2015]。"
  - id: 26
    source: "Disability rights activists, however, would still seem to have a serious complaint to lodge against normative contractarianism, since it is surely the case that there are persons who cannot reciprocate benefits to others. Such persons would be, on the normative contractarian view, beyond the scope of the rules of justice. Recent literature on disability argues that, to the contrary, contractarianism can be inclusive of the disabled. For example, it may be argued that in fact most disabled persons and all caregivers would be included in the bargaining group for clear strategic reasons (Becker 2005)[^becker-2005]. The basic contractarian insight that cooperation is mutually advantageous implies that whenever someone can be included as a contributing cooperator there are gains to be realized for all. Many disabled people are either already capable of contributing or could be so with accommodation or rehabilitation, and thus it is to the advantage of society to provide accommodations or rehabilitation at some level, requiring reciprocal contributions from those thus benefited. For those disabled persons who cannot be rehabilitated, contractarianism provides a different solution, namely a \"mutually advantageous\" social insurance scheme that offers a dignified standard of care for anyone who needs it (Becker 2005)[^becker-2005]. One might object that the currently healthy contractors would not see the need to pay premiums as high as the already disabled, since they have a lower probability of needing the care. For this insurance scheme to work (and to avoid adverse selection problems), everyone would need to agree to equal premiums without prior knowledge of their condition. But it is hard to see how a contractarian can justify this agreement. A contractualist, on the other hand, could argue that such an agreement could not be reasonably rejected. This line of argument would have to show that a similar argument could not be made for any form of bad luck, on pain of this view devolving into egalitarianism."
    step2: "然而，残障权利活动家似乎仍有一项严重的不满要针对规范性自利契约论提出，因为确实存在一些不能向他人回报利益的人。按规范性自利契约论的观点，这样的人将落在正义规则的范围之外。关于残障的近期文献则论证，恰恰相反，自利契约论能够包容残障者。例如，可以论证：事实上大多数残障者与所有照料者都会因明确的策略性理由而被纳入讨价还价群体（Becker 2005）[^becker-2005]。合作互利这一基本自利契约论洞见意味着：只要有人能被作为作出贡献的合作者而纳入，所有人都有可实现的收益。许多残障者要么已经能够作出贡献，要么通过便利或康复能够如此，因此，社会在某种程度上提供便利或康复、并要求由此受益者作出互惠贡献，是有利的。对那些无法康复的残障者，自利契约论提供另一种方案，即一种“互利的”社会保险计划，它为任何需要者提供有尊严的照护标准（Becker 2005）[^becker-2005]。有人可能会反对：当前健康的人不会认为需要支付与已残障者一样高的保费，因为他们需要照护的概率更低。为使这一保险计划运作（并避免逆向选择问题），每个人都需要在不知道自己状况的情况下同意支付相同的保费。但很难看出自利契约论者如何能证成这一协议。另一方面，非自利契约论者可以论证，这样的协议不可能被合理地拒绝。这一论证思路必须表明，对任何形式的坏运气都不能提出类似的论证，否则这种观点就会退化为平等主义。"
  - id: 27
    source: "Such a view thus raises the objection that there is a level of need for rehabilitation or accommodation that goes beyond any possible future expected contribution for a given disabled person. And disabled persons are not well placed to hold out a threat to destabilize society, so the motivation to contract with them must be the expected benefit. Relying on only ideas of mutual advantage and reciprocity would continue to leave these people—the \"outliers\"—outside the contract, languishing below an acceptable level of functioning which they could, given another moral theory, rightfully claim. According to some, contracting need not be essentially adversarial (Francis & Silvers 2005)[^silvers-2005]. Since the benefits of mutual agreement are best achieved by \"promoting stable compliance with mutual expectations\" (Francis & Silvers 2005, 60)[^silvers-2005], the essential element of contract is the development of trust, and the deeper and more widespread the trust, the lower the enforcement costs to contracting. Granting the importance of trust development, then, the disabled are as capable of contributing to this climate, perhaps more so because of their greater vulnerability, as the able-bodied. By this they mean that disabled persons who rely on others for care can decide to put aside fears of betrayal or neglect and remain positive and forward looking, and thereby bring about a positive affective climate in themselves and their caregivers. This affective work toward trust building becomes their contribution to the social good. Thus by focusing on the motivation of cooperation for mutual advantage rather than fear of the depredations of others, a more inclusive and positive contractarian political theory comes into view. This view depends on the assumption (similar to one made by Gauthier) that our moral psychology is such that, once we develop our disposition to cooperate, we lose the disposition to cheat on agreements we have made or harm others to satisfy our immediate self interest. As mentioned earlier, this assumption has often been questioned by critics of contractarianism."
    step2: "于是，这样一种观点就提出这样的反对意见：对某一特定残障者而言，存在一个超出其任何可能的未来预期贡献水平的康复或便利需求。而且，残障者并不处于能够以破坏社会稳定相威胁的地位，因此与他们缔约的动机必须是预期收益。只依赖互利与互惠观念，会继续使这些人——“局外人”（outliers）——留在契约之外，在低于可接受功能水平的状态下苦苦挣扎，而他们本可以凭借另一种道德理论正当地主张这一水平。有些人认为，缔约本质上不必是敌对的（Francis & Silvers 2005）[^silvers-2005]。既然相互协议的利益最好通过“促进对相互期望的稳定遵从”（Francis & Silvers 2005, 60）[^silvers-2005]来达成，那么契约的要素就是信任的发展，而信任越深越广，缔约的执法成本就越低。那么，承认信任发展的重要性，残障者与健全者一样能够为这种氛围作出贡献，而且也许因其更大的脆弱性而更能。他们的意思是：依赖他人照护的残障者可以决定放下对背叛或忽视的恐惧，保持积极与前瞻的态度，从而在自己与照料者身上营造一种积极的情感氛围。这种朝向信任建设的情感工作，成为他们对社会善的贡献。因此，通过聚焦于互利合作的动机而非对他人掠夺的恐惧，一种更具包容性、更积极的自利契约论政治理论就显现出来。这一观点依赖于这样一个假设（与 Gauthier 所作的假设相似）：我们的道德心理是这样的——一旦我们形成合作倾向，我们就会丧失背弃已订协议、或为满足眼前自我利益而伤害他人的倾向。如前所述，这一假设常常受到自利契约论批评者的质疑。"
  - id: 28
    source: "The case for including animals within the scope of the rules of justice produced by the contract is more difficult to make because, unlike the disabled who may only require and depend on appropriate accommodations in order to reciprocate, animals may be considered incapable of reciprocating benefits to others and are also incapable of rational interaction. If contractarianism is at all able to account for the moral standing of animals, then it has to do so in a more indirect way than in the case of the disabled. It may be possible to ground the moral standing of animals as part of a contract agreed to by other contractors who are capable of rational interaction (Cohen 2007, 2009)[^cohen-2007]. Suppose that Bob agrees to form a contract with Jane only on the condition that Jane also attributes direct moral standing to Bob's pet dog, Rosko. As a result of the contract between Bob and Jane, Rosko gains intrinsic moral standing that imposes correlative moral duties on Jane. If Jane were to harm Rosko in some way, she would not only violate a duty to Rosko's owner, Bob, but she would also violate a duty that she has *to* Rosko who possesses intrinsic moral standing of his own. In this way bilateral agreements between contractors could potentially extend the scope of the rules of justice to apply to beings both incapable of rational interaction and arguably incapable of reciprocating benefits to others."
    step2: "把动物纳入契约所产生的正义规则范围之内的论证更难成立，因为与可能只需并依赖适当便利就能回报的残障者不同，动物可被视为既不能向他人回报利益，也不能进行理性互动。如果自利契约论真能说明动物的道德地位，那么它就必须以一种比残障者情形更为间接的方式来做到。把动物的道德地位作为一项由其他能够进行理性互动的缔约者所同意的契约的一部分来奠定，也许是可能的（Cohen 2007, 2009）[^cohen-2007]。假设鲍勃（Bob）同意与简（Jane）订立契约，条件只是简也把直接的道德地位赋予鲍勃的宠物狗罗斯科（Rosko）。由于鲍勃与简之间的契约，罗斯科获得了内在的道德地位，这给简施加了相应的道德义务。如果简以某种方式伤害了罗斯科，她不仅违反了对罗斯科的主人鲍勃的义务，也违反了她对 *to* 罗斯科本人所负的义务，因为罗斯科拥有其自身的内在道德地位。这样，缔约者之间的双边协议就有可能扩展正义规则的范围，使之适用于既不能进行理性互动、也大概不能向他人回报利益的存在者。"
  - id: 29
    source: "Deriving the moral standing of beings from agreements reached by other contractors not only assumes that contractors have tuistic preferences, an assumption rejected by many contractarians, but it also potentially makes the moral standing of those beings contingent on the nature of the tuistic preferences and interests held by others (Tanner 2013)[^tanner-2013]. Contractors may agree to protect only certain kinds of animals, and they may make agreements to protect animals only when doing so does not conflict with their own, more narrowly construed interests. As a result, the status of those who cannot participate in the initial situation for various reasons, such as the disabled and animals, remains a contentious issue in contractarian thought."
    step2: "从其他缔约者达成的协议中推导出存在者的道德地位，不仅假定缔约者具有他涉偏好——这一假定被许多自利契约论者所拒绝——而且还可能使这些存在者的道德地位依赖于他人所持有的他涉偏好与利益的性质（Tanner 2013）[^tanner-2013]。缔约者可能同意只保护某些种类的动物，而且他们可能只在这样做不与自身更为狭隘界定的利益相冲突时，才达成保护动物的协议。其结果是，那些因各种原因——如残障者与动物——不能参与初始情境者的地位，在自利契约论思想中仍是一个有争议的问题。"
