      Equally important to the solution as the procedure is the starting point from which the parties begin. For some contractarians (like Gauthier) there is no veil of ignorance—each party to the contract is fully informed of their personal attributes and holdings. However, without the veil of ignorance, contractors will be aware of the differences in bargaining power that could potentially affect the outcome of the bargain. It is important, then, that the initial position must have been arrived at non-coercively if compliance to the agreement is to be secured. A form of the “Lockean proviso” (modeled after Locke’s description of the initial situation of his social contract): that one cannot have bettered himself by worsening others, may turn out to be beneficial in cases without a veil of ignorance. In sum, the moral norms that rational contractors will adopt (and comply with) are those norms that would be reached by the contractors beginning from a position each has attained through her own actions which have not worsened anyone else, and adopting as their principle for agreement the rule of minimax relative concession (Gauthier 1986, ch. VII)[^gauthier-1986].
    step1: |-
      与解的程序同样重要的是各方出发的起点。对某些契约主义者（如戈蒂耶）来说，没有无知之幕——契约的每一方都充分知晓自己的个人属性与持有。然而，没有无知之幕，缔约者就会意识到谈判实力上的差异，这可能影响谈判结果。因此重要的是，如果要确保对协议的遵守，初始位置必须是非强制地达成的。“洛克式限制条款”的一种形式（仿照洛克对其社会契约初始情形的描述）：即一个人不能以恶化他人来改善自己，在无无知之幕的情形中可能有其益处。总之，理性缔约者将采纳（并遵守）的道德规范，是这样一些规范：缔约者从各自通过未恶化任何他人的自身行动所达到的位置出发，并以最小最大相对让步规则作为其协议原则而达到的规范（Gauthier 1986, 第七章）[^gauthier-1986]。
