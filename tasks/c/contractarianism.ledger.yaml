      On one line of thought, contractarianism produces liberal individuals who seem well suited to join the kind of society that Rawls envisioned (Gauthier 1986, ch. XI)[^gauthier-1986]. On another line, the Hobbesian contractarian argument leads towards the sparse government of libertarianism (Narveson 1988)[^narveson-1988]. The controversy here turns on the primary motivation for individuals to make agreements and cooperate. As we said before, there are two such motivations for the Hobbesian contractarian: fear of the depredations of others and benefits from cooperation with others. Libertarianism results when the first of these is primary, whereas when the second is primary, the kind of reciprocity and supportive government that will be discussed in the final section becomes possible.
    step1: |-
      按一种思路，契约主义产生出看似很适合加入罗尔斯所设想的那种社会的自由个体（Gauthier 1986, 第十一章）[^gauthier-1986]。按另一种思路，霍布斯式契约主义论证导向自由至上主义的稀薄政府（Narveson 1988）[^narveson-1988]。此处的争论取决于个体订约与合作的根本动机。如前所述，霍布斯式契约主义者有两种这样的动机：对他人掠夺的恐惧与从与他人合作中获得的利益。当第一种动机居首时产生自由至上主义；当第二种居首时，最后一节将讨论的那种互惠与支持性政府就成为可能。
