      Many critiques have been leveled against particular contractarian theories and against contractarianism as a framework for normative thought about justice or morality. (See the entry on contemporary approaches to the social contract.) Jean Hampton criticized Hobbes in her book *Hobbes and the Social Contract Tradition*, in a way that has direct relevance to contemporary contractarianism. Hampton argues that the characterization of individuals in the state of nature leads to a dilemma. Hobbes’ state of nature as a potential war of all against all can be generated either as a result of passions (greed and fear, in particular) or rationality (prisoner’s dilemma reasoning, in which the rational players each choose to renege on agreements made with each other). But if the passions account is correct, then contractors will still be motivated by these passions after the social contract is drawn up, and so will fail to comply with it (Hampton 1986)[^hampton-1986]. And if the rationality account is correct, then rational actors will not comply with the social contract any more than they will cooperate with each other before it is made.
    step1: |-
      针对特定契约主义理论、以及针对契约主义作为正义或道德规范性思考框架的批评有很多。（见“社会契约的当代方法”词条。）Jean Hampton 在其著作《霍布斯与社会契约传统》（*Hobbes and the Social Contract Tradition*）中对霍布斯的批评，与当代契约主义有直接关联。Hampton 论证说，对自然状态中个体的刻画会导致一个两难。霍布斯的自然状态作为一种可能的一切人对一切人的战争，既可以由激情（尤其是贪婪与恐惧）产生，也可以由理性（囚徒困境推理，其中理性的玩家各自选择背弃彼此达成的协议）产生。但如果激情的解释是正确的，那么社会契约订立后，缔约者仍会受这些激情驱动，因而不会遵守契约（Hampton 1986）[^hampton-1986]。而如果理性的解释是正确的，那么理性行动者不会比订立契约之前更遵守社会契约，正如他们此前不会彼此合作一样。
    step2: |-
      针对特定契约主义理论、以及针对作为正义或道德规范性思考框架的契约主义本身，批评为数甚多。（另见“社会契约论的当代方法”词条。）Jean Hampton 在《霍布斯与社会契约传统》（*Hobbes and the Social Contract Tradition*）中对霍布斯的批评，与当代契约主义有直接关联。Hampton 论证，对自然状态中个体的刻画会导致一个两难。霍布斯的自然状态作为可能的“一切人对一切人的战争”，既可由激情（尤其是贪婪与恐惧）产生，也可由理性（囚徒困境推理：理性的玩家各自选择背弃彼此间的协议）产生。若激情解释成立，则社会契约订立后，缔约者仍受这些激情驱动，故不会遵守契约（Hampton，1986）[^hampton-1986]；若理性解释成立，则理性行动者订立契约后照样不会遵守，一如其订立之前不会彼此合作。
