      Such a view thus raises the objection that there is a level of need for rehabilitation or accommodation that goes beyond any possible future expected contribution for a given disabled person. And disabled persons are not well placed to hold out a threat to destabilize society, so the motivation to contract with them must be the expected benefit. Relying on only ideas of mutual advantage and reciprocity would continue to leave these people—the “outliers”—outside the contract, languishing below an acceptable level of functioning which they could, given another moral theory, rightfully claim. According to some, contracting need not be essentially adversarial (Francis & Silvers 2005)[^silvers-2005]. Since the benefits of mutual agreement are best achieved by “promoting stable compliance with mutual expectations” (Francis & Silvers 2005, 60)[^silvers-2005], the essential element of contract is the development of trust, and the deeper and more widespread the trust, the lower the enforcement costs to contracting. Granting the importance of trust development, then, the disabled are as capable of contributing to this climate, perhaps more so because of their greater vulnerability, as the able-bodied. By this they mean that disabled persons who rely on others for care can decide to put aside fears of betrayal or neglect and remain positive and forward looking, and thereby bring about a positive affective climate in themselves and their caregivers. This affective work toward trust building becomes their contribution to the social good. Thus by focusing on the motivation of cooperation for mutual advantage rather than fear of the depredations of others, a more inclusive and positive contractarian political theory comes into view. This view depends on the assumption (similar to one made by Gauthier) that our moral psychology is such that, once we develop our disposition to cooperate, we lose the disposition to cheat on agreements we have made or harm others to satisfy our immediate self interest. As mentioned earlier, this assumption has often been questioned by critics of contractarianism.
