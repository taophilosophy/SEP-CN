      The contractarian element of the theory comes in the derivation of the moral norms. The compliance problem—the problem of justifying rational compliance with the norms that have been accepted—must drive the justification of the initial situation and the conduct of the contracting situation. It is helpful to think of the contract situation as a bargain, in which each party is trying to negotiate the moral rules that will allow them to realize optimal utility, and this has led philosophers to apply a number of bargaining solutions to the initial contract situation. Gauthier’s solution is the “minimax relative concession” (1986, ch. V). The idea of minimax relative concession is that each bargainer will be most concerned with the concessions that she makes from her ideal outcome relative to the concessions that others make. If she sees her concessions as reasonable relative to the others, considering that she wants to ensure as much for herself as she can while securing agreement (and thereby avoiding the zero-point: no share of the cooperative surplus) and subsequent compliance from the others, then she will agree to it. What would then be the reasonable outcome? The reasonable outcome, according to this view, is the outcome that minimizes the maximum relative concessions of each party to the bargain (Gauthier 1986, ch. V)[^gauthier-1986].
    step1: |-
      该理论的契约主义成分体现在道德规范的推导中。遵守问题——即为“理性地遵守已被接受的规范”提供证成的问题——必须驱动对初始情形的证成与缔约情形的进行。把契约情形想成一场谈判是有帮助的：每一方都试图谈判出能使其实现最优效用的道德规则；这促使哲学家们把若干谈判解应用于初始契约情形。戈蒂耶的解是“最小最大相对让步”（1986, 第五章）。最小最大相对让步的观念是：每个谈判者最关心的是，她从自己理想结果作出的让步相对于他人所作让步的比率。如果她认为自己的让步相对于他人的让步是合理的——考虑到她想在确保协议（从而避免零点：分不到合作剩余）并使他人随后遵守的同时，尽可能为自己争取更多——那么她就会同意这一结果。那么什么才是合理的结果？按此观点，合理的结果是使谈判各方最大相对让步最小化的结果（Gauthier 1986, 第五章）[^gauthier-1986]。
