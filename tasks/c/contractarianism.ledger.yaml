      其次，人被假定为在工具意义上是理性的，因而能够理解合作性的社会互动如何有助于其欲望的满足。契约主义者以工具性、主观性与偏好性的方式刻画实践理性。理性行动意味着最大化自身主观偏好的满足。契约主义者依赖关于人类的一个关键事实：我们能够合作以生产出多于各自单干之和，这使得在至少某些条件下合作是理性的。自利与理性蕴含合作的欲望，只要合作者能不牺牲自利而合作。从合作中获益的欲望，又使人理性地关注自己信守道德规范的名声——正是这些规范使合作既可能又理性。（关于对这一理性人概念的批判，见女性主义对自我的视角（第一节，批判）。）
