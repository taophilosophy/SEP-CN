      Contractarian social contract theories take individuals to be the best judges of their interests and the means to satisfy their desires. For this reason, there is a close connection between liberalism and contractarianism. However, that is not to say that all contractarian thought is liberal. Hobbes, for example, argued in favor of what Jean Hampton has called the “alienation contract” (1986, 3, 103, 256–265), that is, a contract on the part of a people to alienate their rights to adjudicate their own disputes and self-defense to a sovereign, on the grounds that that was the only way to keep the peace given the nature of the alternative, which he famously characterized as life that would be “solitary, poore, nasty, brutish, and short.” Thus, given a bad enough initial situation, contractarianism may lead to the legitimation of totalitarianism. Another point of criticism that arises from the characterization of the parties to the contract is that they must be able to contribute to the social product of interaction, or at least to threaten to destabilize it. This is because each individual has to be able to benefit from the inclusion of all those included. But this threatens to leave many, such as the severely disabled, the global poor, and animals outside the realm of justice, an implication that some find completely unacceptable (Kittay 1999; Nussbaum 2006)[^kittay-1999][^nussbaum-2006].
    step1: |-
      契约主义的社会契约理论把个体视为其利益与满足欲望之手段的最佳判断者。因此自由主义与契约主义联系紧密。但这不等于说一切契约主义思想都是自由主义的。例如霍布斯主张一种 Jean Hampton 所谓的“让渡契约”（1986, 3, 103, 256–265）：人民订约把自己的裁决争端与自卫的权利让渡给主权者，理由是鉴于另一种选择的性质——他将其著名地刻画为“孤独、贫困、卑污、残忍而短寿”的生活——这是维持和平的唯一办法。因此，只要初始情形足够糟糕，契约主义可能导致极权主义的正当化。从契约当事人刻画中产生的另一个批评是：当事人必须能对社会互动的产物有所贡献，或至少能威胁使之不稳定。这是因为每个个体都必须能从所有被纳入者的纳入中获益。但这有可能把许多人——如重度残障者、全球穷人与动物——排除在正义领域之外，有人认为这一含义完全不可接受（Kittay 1999; Nussbaum 2006）[^kittay-1999][^nussbaum-2006]。
