    kind: body
    source: |-
      Some of the more recent literature focuses on how contractarian theories can ensure the fairness and impartiality of the initial bargaining situation without appealing to any external, independent moral norms as the contractualist does. For the contractarian, all moral norms are supposed to be the result of agreement by rational agents, but if the contractarian has to appeal to prior moral norms in order to secure agreement then it’s not clear what sort of work the agreement is actually doing in establishing the content of the moral norms. At the same time, if there are no constraints at all over the initial situation then the outcome agreed to may fail to be a moral outcome, and may instead be an outcome according to the principle, as Rawls puts it, “to each according to his threat advantage” (1971, 141). Two potential strategies are to argue that assumptions designed to ensure the fairness and impartiality of the initial situation, such as the assumption that the contractors are symmetrically situated, either follow as a condition of rationality or are justified on strategic grounds. The idea that certain assumptions like symmetry follow as implications from the exercise of rationality has attracted recent criticism on grounds that such assumptions represent substantive constraints theoretically inaccessible to contractarians (Thrasher 2014)[^thrasher-2014]. Others have attempted to defend the presence of such assumptions in contractarian theory (Thoma 2015)[^thoma-2015].
    step1: |-
      较新的文献有一部分聚焦于：契约主义理论如何能不诉诸任何外在的、独立的道德规范（如非自利契约论者所做的那样）而确保初始谈判情形的公平与无偏私。对契约主义者来说，一切道德规范都应当是理性主体协议的结果；但如果契约主义者为达成协议而不得不诉诸先在的道德规范，那么协议在确立道德规范内容时究竟起了什么作用，就不清楚了。与此同时，如果对初始情形毫无约束，那么所达成的结果可能不是道德结果，而可能是——如罗尔斯所说——“按威胁优势分配给每个人”（1971, 141）这一原则下的结果。两种潜在策略是：论证那些旨在确保初始情形公平无偏私的假定——例如当事人处于对称地位的假定——要么作为理性性的条件随之而来，要么基于策略性理由得到证成。“对称之类假定是理性运用之推论”这一想法，近来受到批评，理由是此类假定代表着契约主义者在理论上无法触及的实质性约束（Thrasher 2014）[^thrasher-2014]。另一些人则尝试为这类假定在契约主义理论中的存在辩护（Thoma 2015）[^thoma-2015]。
    step2: |-
      较新的文献有一部分聚焦于一个问题：契约主义理论能否不诉诸任何外在的、独立的道德规范（如非自利契约论者所做的那样），而确保初始谈判情形的公平与无偏私。对契约主义者来说，一切道德规范都应当是理性主体协议的产物；可如果契约主义者为确保协议而不得不求助于先在的道德规范，那么协议在确立道德规范内容时究竟做了什么，便不清楚了。另一方面，倘若初始情形毫无约束，所达成的结果就可能不成其为道德结果，反倒可能——用罗尔斯的话说——遵循“按各自的威胁优势分配给每个人”（1971，141）的原则。有两种潜在策略：或论证那些旨在确保初始情形公平无偏私的假定（例如当事人地位对称的假定）是理性的条件使然，或以策略性理由为其辩护。“对称之类假定可从理性的运用中推出”这一想法近来遭到批评，理由是这类假定代表契约主义者在理论上无法企及的实质约束（Thrasher，2014）[^thrasher-2014]；另一些人则为这类假定在契约主义理论中的地位辩护（Thoma，2015）[^thoma-2015]。
  - id: 7
    kind: body
    source: |-
      Some points of controversy among contractarians concern the role of the initial situation in the theory: is it to be considered an actual historical situation, a possible historical moment, or is the contract situation completely hypothetical? David Hume (1987/1777, 470–1) was the first to raise the decisive objection to any normative moral or political theory based on a historical contract: the consent of one’s ancestors do not bind oneself. Contemporary political philosophers have raised similar concerns about a hypothetical contract: insofar as the agreement is *hypothetical* then it cannot be said to represent agreement at all (Dworkin 1975)[^dworkin-1975]. In response to these sorts of objections, some contractarians defend the hypothetical contract on heuristic grounds by insisting that the point of the contract device is not to directly bind the contractors but rather to provide a kind of thought experiment by which to discover the requirements of practical rationality (Gauthier 1986, ch. VII)[^gauthier-1986]. That is, they argue that if one is rational, and among rational others in circumstances in which agreement is both possible and beneficial, then rationality requires that one abide by the terms of the contract. While mainstream contractarian theories are hypothetical contract theories, an interesting and powerfully subversive use of contractarianism (Mills 1997; Pateman 1989; Pateman & Mills 2007—see section on Subversion of Contractarianism below)[^mills-1997][^pateman-1989][^pateman-2007] reads the contract situation as historical agreements to erect and maintain white supremacy and patriarchy or male dominance. These latter contractarian theories are not justifications of the status quo, of course, but rather explanations and condemnations, and therefore do not face Hume’s objection. Other questions that divide contemporary contractarians include: What are the ideal conditions and who are the ideal contractors that will make obligatory the outcomes of the contract for actual persons? What is the content of the hypothetical agreement?
    step1: |-
      契约主义者之间的一些争论点涉及初始情形在理论中的角色：它应被视为实际的历史情形、可能的历史时刻，还是契约情形完全是假设性的？大卫·休谟（1987/1777, 470–1）最先对任何以历史契约为基础的规范性道德或政治理论提出决定性反驳：祖先的同意并不约束后人。当代政治哲学家对假设性契约提出了类似担忧：只要协议是 *假设性的*，它就根本不能算是协议（Dworkin 1975）[^dworkin-1975]。为回应这类反驳，一些契约主义者以启发式理由为假设性契约辩护，坚持契约装置的要旨不在于直接约束缔约者，而在于提供一种思想实验，借以发现实践理性的要求（Gauthier 1986, 第七章）[^gauthier-1986]。也就是说，他们论证：如果一个人是理性的，并且身处协议既可能又有益的理性人群之中，那么理性要求他遵守契约条款。主流契约主义理论是假设性契约理论，而契约主义还有一种有趣且极具颠覆性的用法（Mills 1997; Pateman 1989; Pateman & Mills 2007——见下文“契约主义的颠覆”一节）[^mills-1997][^pateman-1989][^pateman-2007]：把契约情形解读为建立并维护白人至上与父权制或男性支配的历史协议。当然，这些后起的契约主义理论不是对现状的辩护，而是解释与谴责，因而不面对休谟的反驳。当代契约主义者之间的其他分歧包括：什么样的理想条件、哪些理想缔约者能使契约结果对实际的人具有约束力？假设性协议的内容是什么？
    step2: |-
      契约主义者之间的若干争论，关乎初始情形在理论中的角色：它应被视为实际的历史情形、可能的历史时刻，还是说契约情形纯属假设？大卫·休谟（1987/1777，470–1）最先对一切以历史契约为根基的规范性道德或政治理论提出决定性反驳：祖先的同意约束不了后人。当代政治哲学家对假设性契约提出类似的疑虑：协议既然是 *假设性的*，就根本谈不上是协议（Dworkin，1975）[^dworkin-1975]。为回应这类反驳，一些契约主义者以启发性为由为假设性契约辩护：契约装置的要旨不在于直接约束缔约者，而在于提供一种思想实验，借以发现实践理性的要求（Gauthier，1986，第七章）[^gauthier-1986]——若人是理性的，且身处协议既可行又有益的理性人群之中，理性便要求其遵守契约条款。主流契约主义理论是假设性契约理论；但契约主义另有一种有趣而极具颠覆性的用法（Mills，1997；Pateman，1989；Pateman & Mills，2007——见下文“契约主义的颠覆”一节）[^mills-1997][^pateman-1989][^pateman-2007]：把契约情形解读为建立并维护白人至上与父权制或男性支配的历史协议。这类契约主义理论当然不是为现状辩护，而是解释与谴责，故不面对休谟的反驳。当代契约主义者的其他分歧还包括：什么样的理想条件、哪些理想缔约者，能使契约结果对实际的人具有约束力？假设性协议的内容是什么？
  - id: 8
    kind: body
    source: |-
      The second element of a contractarian theory characterizes the potential contractors. There are two subparts to this: first, contractors have minimal other-directed desires or preferences, and second, contractors have a capacity for rational interaction with others. Contractarian (as opposed to contractualist) theories embrace a high standard for motivating making (and keeping) agreements. They avoid assuming that persons have preferences for moral behavior as such in order to ground rules of morality or justice in rational self-interest. Since persons’ interests do not necessarily include the well-being of others, the main challenge for contractarianism is to show that even without such other-directed preferences, it would be rational to be moral. Such self-directed preferences are called “non-tuistic” (Gauthier 1986, 87)[^gauthier-1986]. However, there are reasons to think that narrowing the preferences of contractors to include only non-tuistic preferences is neither necessary nor helpful in grounding morality. One reason is because such a restriction of preferences means that actual persons will not be willing to comply with the bargain that is made, under the assumption that they do not have such narrowly construed preferences (Hubin 1991)[^hubin-1991]. On the other hand, allowing positive tuistic preferences to play a role in bargaining on morality and justice may create the possibility for individuals to be exploited for their fellow feelings (Dimock 1999)[^dimock-1999]. This is especially a problem for women, as Dimock points out, since in most cultures women are trained from childhood by sexist norms and gender roles to prefer the well-being of others to their own. Negative tuistic preferences pose a different challenge as a type of moral skepticism for either theorists who would exclude them or those who would include them in a contractarian theory (Superson 2009)[^superson-2009]. The former group include Rawls and Gauthier, who have argued that negative tuistic preferences (envy, jealousy, spite, vengeance) make cooperation for mutual advantage impossible and therefore are irrational (Rawls 1971, 142–150, 530–534; Gauthier 1986, 311, 329)[^gauthier-1986][^rawls-1971]. But this response significantly narrows the scope of application of the theory, since such emotions are common. The latter group faces the challenge of showing how mutual advantage overcomes these negative, other-directed emotions.
    step1: |-
      契约主义理论的第二个要素刻画潜在缔约者。这有两个子部分：其一，缔约者拥有最低限度的指向他人的欲望或偏好；其二，缔约者有与他人理性互动的能力。契约主义理论（有别于非自利契约论）为达成（并信守）协议的动机设定了高标准。它们不假设人有对道德行为本身的偏好，以便把道德或正义规则建立在理性的自利之上。由于人的利益不必包含他人的福祉，契约主义面临的主要挑战是表明：即使没有这类指向他人的偏好，道德地行事也是理性的。这类指向自身的偏好被称为“非利他的”（non-tuistic）（Gauthier 1986, 87）[^gauthier-1986]。然而，有理由认为，把缔约者的偏好收窄为仅含非利他偏好，既无必要也无助益。原因之一是，这种偏好限制意味着，在不具有如此狭义偏好的假定下，实际的人不会愿意遵守达成的协议（Hubin 1991）[^hubin-1991]。另一方面，允许正面的利他偏好在道德与正义的谈判中起作用，可能使个体因恻隐之心而被利用（Dimock 1999）[^dimock-1999]。Dimock 指出，这对女性尤其成问题，因为在多数文化中，女性自幼受性别主义规范与性别角色的规训，把他人福祉置于自身之上。负面的利他偏好则作为道德怀疑论的一种类型，对契约主义理论构成另一种挑战，无论把它们排除还是纳入都是如此（Superson 2009）[^superson-2009]。前者包括罗尔斯与戈蒂耶，他们论证说，负面的利他偏好（嫉妒、猜忌、怨恨、报复）使互利合作不可能，因而是不理性的（Rawls 1971, 142–150, 530–534; Gauthier 1986, 311, 329）[^gauthier-1986][^rawls-1971]。但这一回应大大收窄了理论的适用范围，因为这类情绪很常见。后者则面临如下挑战：说明互利如何克服这些负面的、指向他人的情绪。
