      在一篇较新的文章中，戈蒂耶一改前说，拒绝把“把道德奠基于理性”这一问题框定为谈判问题（2013）。问题一旦如此框定，其解就依赖于假定参与契约谈判的各方都是理性最大化者。而按其修正后的看法，他既不视之为谈判问题，也不把各方看作（受约束的）理性最大化者，而是把他们设想为帕累托最优化者。作为帕累托最优化者或理性合作者，各方追求帕累托最优的结果——即不可能在不减少一方收益的情况下增加另一方收益的结果。若能转至另一结果，在不减少任何一方收益的前提下增加某方收益，则当前结果便非帕累托最优。要注意，这一改动并非要在自利之外给各方另加动机：按戈蒂耶的说法，理性合作提供了“何为理性行动”的另一种构想——理性合作者不愿把合作的额外收益白白留在桌上。这些改动如何解决“把道德奠基于（这种构想的）理性”这一原初问题？答案是：按合作收益的有无来计算每个结果的收益。合作最小值，是使一方得不到任何合作收益的收益；合作最大值，则是让一方独享合作全部可能收益的收益；潜在合作收益即两者之差。实际合作收益，则是该结果之收益与该方合作最小值之差。再将实际合作收益除以该方的潜在合作收益，便得到该方的比例收益——实际收益占其潜在合作收益的比例。于是每个结果都表现为一个来自合作的比例收益。最后，目标是选出使任何单方的最小比例收益最大化的结果。戈蒂耶称这一原则为最大最小比例收益，它所选出的帕累托最优结果，是各方选择起来都理性的结果。
