      The second book of *On the Revolutions* elaborated the concepts in the first book; book 3 dealt with the precession of the equinoxes and solar theory; book 4 dealt with the moon’s motions; book 5 dealt with the planetary longitude and book 6 with latitude.[^note-9] Copernicus depended very much on Ptolemy’s observations, and there was little new in his mathematics. He was most successful in his work on planetary longitude, which, as Swerdlow and Neugebauer (77) commented, was “Copernicus’s most admirable, and most demanding, accomplishment…It was above all the decision to derive new elements for the planets that delayed for nearly half a lifetime Copernicus’s continuation of his work – nearly twenty years devoted to observation and then several more to the most tedious kind of computation – and the result was recognized by his contemporaries as the equal of Ptolemy’s accomplishment, which was surely the highest praise for an astronomer.” Surprisingly, given that the elimination of the equant was so important in the *Commentariolus*, Copernicus did not mention it in book 1, but he sought to replace it with an epicyclet throughout *On the Revolutions*. Nevertheless, he did write in book 5 when describing the motion of Mercury:

      > …the ancients allowed the epicycle to move uniformly only around the equant’s center. This procedure was in gross conflict with the true center [of the epicycle’s motion], its relative [distances], and the prior centers of both [other circles]…However, in order that this last planet too may be rescued from the affronts and pretenses of its detractors, and that its uniform motion, no less than that of the other aforementioned planets, may be revealed in relation to the earth’s motion, I shall attribute to it too, [as the circle mounted] on its eccentric, an eccentric instead of the epicycle accepted in antiquity (*Revolutions*, 278–79).
    step1: |-
      《天体运行论》第二卷详细阐发了第一卷的概念；第三卷处理二分点的岁差和太阳理论；第四卷处理月球的运动；第五卷处理行星经度，第六卷处理纬度。[^note-9] 哥白尼非常依赖托勒密的观测，他的数学中很少有新东西。他最成功的是行星经度的工作，正如 Swerdlow 和 Neugebauer (77) 所评论的，这是「哥白尼最令人钦佩、也最艰巨的成就……尤其是为行星推导出新要素的决定，使哥白尼中断他的工作近半生——近二十年用于观测，然后又数年用于最繁琐的计算——其成果被同时代人视为与托勒密的成就相当，这无疑是天文学家的最高赞誉。」令人惊讶的是，鉴于消除偏心匀速点在《短论》中如此重要，哥白尼在第一卷中却未提及它，但他在《天体运行论》全书中试图用小本轮取代它。尽管如此，他在第五卷描述水星运动时确实写道：
      > ……古人只允许本轮绕偏心匀速点的中心作均匀运动。这一做法与[本轮运动的]真正中心、其相对[距离]、以及两个[其它圆的]先前中心严重冲突……然而，为使这最后一颗行星也免于其诋毁者的侮辱与虚饰，并使其均匀运动——不亚于前述其它行星——相对于地球的运动而显现，我也将赋予它，[作为安装在]其偏心上[的圆]一个偏心，以取代古代所接受的本轮（*Revolutions*, 278–79）。
