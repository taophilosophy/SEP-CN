slug: copernicus
segments:
  - id: "1"
    source: |-
      Nicolaus Copernicus (1473–1543) was a mathematician and astronomer who proposed that the sun was stationary in the center of the universe and the earth revolved around it. Disturbed by the failure of Ptolemy’s geocentric model of the universe to follow Aristotle’s requirement for the uniform circular motion of all celestial bodies. Copernicus decided that he could achieve his goal only through a heliocentric model. He thereby created a concept of a universe in which the distances of the planets from the sun bore a direct relationship to the size of their orbits. At the time Copernicus’s heliocentric idea was very controversial; nevertheless, it was the start of a change in the way the world was viewed, and Copernicus came to be seen as the initiator of what is commonly known as the Scientific Revolution.
    step1: |-
      哥白尼（Nicolaus Copernicus，1473–1543）是一位数学家和天文学家，他提出太阳静止于宇宙中心，而地球围绕它公转。由于托勒密（Ptolemy）的宇宙地心模型未能遵循亚里士多德（Aristotle）关于所有天体做均匀圆周运动的要求，哥白尼感到不安。哥白尼认定，只有通过日心模型才能达成他的目标。他由此创造了一个宇宙概念，在该概念中，行星与太阳的距离与其轨道的大小直接相关。当时，哥白尼的日心思想极具争议；然而，它却是世人看待世界的方式开始转变的起点，哥白尼后来被视为通常所称「科学革命」的开创者。
    step2: |-
      哥白尼（Nicolaus Copernicus，1473–1543）是数学家和天文学家，他提出太阳静止于宇宙中心，地球环绕太阳运行。托勒密（Ptolemy）的宇宙地心模型未能满足亚里士多德（Aristotle）关于一切天体作均匀圆周运动的要求，这令哥白尼深感不安；他认为唯有日心模型才能实现自己的目标。由此他构建起这样一个宇宙图景：行星与太阳的距离同其轨道的大小直接相关。在当时，哥白尼的日心说颇具争议，然而它标志着人们看待世界的方式开始转变，哥白尼也因此被视为通常所谓「科学革命」的开启者。
  - id: "2"
    source: |-
      Nicolaus Copernicus was born on 19 February 1473, the youngest of four children of Nicolaus Copernicus, Sr., a well-to-do merchant who had moved to Torun from Cracow, and Barbara Watzenrode, the daughter of a leading merchant family in Torun. The city, on the Vistula River, had been an important inland port in the Hanseatic League. However, fighting between the Order of the Teutonic Knights and the Prussian Union in alliance with the Kingdom of Poland ended in 1466, and West Prussia, which included Torun, was ceded to Poland, and Torun was declared a free city of the Polish kingdom. Thus the child of a German family was a subject of the Polish crown.
    step1: |-
      尼古拉·哥白尼于1473年2月19日出生，是尼古拉·哥白尼（父，Nicolaus Copernicus, Sr.）与芭芭拉·瓦岑罗德（Barbara Watzenrode）四个孩子中最年幼的一个；其父是位殷实的商人，从克拉科夫（Cracow）迁居托伦（Torun），其母出身托伦一个显赫的商人家庭。这座城市位于维斯瓦河（Vistula River）畔，曾是汉萨同盟（Hanseatic League）的重要内陆港口。然而，条顿骑士团（Teutonic Knights）与同波兰王国结盟的普鲁士联盟（Prussian Union）之间的战事于1466年结束，包括托伦在内的西普鲁士（West Prussia）被割让给波兰，托伦被宣布为波兰王国的自由城市。因此，这个德国家庭的孩子成了波兰王室的臣民。
    step2: |-
      尼古拉·哥白尼生于1473年2月19日，是尼古拉·哥白尼（父，Nicolaus Copernicus, Sr.）与芭芭拉·瓦岑罗德（Barbara Watzenrode）四个孩子中最年幼者。其父是位殷实商人，由克拉科夫（Cracow）迁居托伦（Torun）；其母出身托伦一个显赫的商人家庭。托伦坐落于维斯瓦河（Vistula River）畔，曾是汉萨同盟（Hanseatic League）的重要内陆港口。1466年，条顿骑士团（Teutonic Knights）与结盟波兰王国的普鲁士联盟（Prussian Union）之间的战争告终，含托伦在内的西普鲁士（West Prussia）划归波兰，托伦被宣布为波兰王国的自由城市。于是，这个德国家庭的孩子便成了波兰王室的臣民。
  - id: "3"
    source: |-
      The father died in 1483, and the children’s maternal uncle, Lucas Watzenrode (1447–1512), took them under his protection. Watzenrode was a very successful cleric – he was to become bishop of Warmia (Ermland in German) in 1489 – and he both facilitated his nephew’s advancement in the church and directed his education. In 1491 Copernicus enrolled in the University of Cracow. There is no record of his having obtained a degree, which was not unusual at the time as he did not need a bachelor’s degree for his ecclesiastical career or even to study for a higher degree. But the University of Cracow offered courses in mathematics, astronomy, and astrology (see Goddu 25–33 on all the university offerings), and Copernicus’s interest was sparked, which is attested to by his acquisition of books in these subjects while at Cracow.[^note-1]
    step1: |-
      父亲于1483年去世，孩子们的舅父卢卡斯·瓦岑罗德（Lucas Watzenrode，1447–1512）将他们置于自己的保护之下。瓦岑罗德是一位非常成功的教士——他于1489年成为瓦尔米亚（Warmia，德语作 Ermland）主教——他既推动了侄子在教会中的晋升，也指导了他的学业。1491年，哥白尼进入克拉科夫大学（University of Cracow）。没有记录显示他获得过学位，这在当时并不罕见，因为他并不需要学士学位来从事教会事业，甚至不需要它来攻读更高的学位。但克拉科夫大学开设了数学、天文学和占星术课程（关于大学的全部课程设置，见 Goddu 25–33），哥白尼的兴趣被点燃，这可由他在克拉科夫期间购得这些学科的书籍得到证明。[^note-1]
    step2: |-
      父亲于1483年去世，舅父卢卡斯·瓦岑罗德（Lucas Watzenrode，1447–1512）把孩子们收归自己保护。瓦岑罗德是位极有成就的教士——他于1489年出任瓦尔米亚（Warmia，德语作 Ermland）主教——既促成侄子在教会中的升迁，也亲自安排其学业。1491年，哥白尼入克拉科夫大学（University of Cracow）就读。没有记录表明他获得过学位；这在当时并不稀奇，因为他的教会生涯乃至攻读更高学位都无须学士文凭。不过克拉科夫大学设有数学、天文学与占星术课程（关于该校全部课程设置，见 Goddu 25–33），哥白尼由此萌生兴趣——他在克拉科夫期间购得这些学科的书籍便是明证。[^note-1]
  - id: "4"
    source: |-
      In 1495 Watzenrode arranged Copernicus’s election as canon of the chapter of Frombork (Frauenberg in German) of the Cathedral Chapter of Warmia, an administrative position just below that of bishop. He assumed the post two years later, and his financial situation was secure for life. In the meantime, following in his uncle’s footsteps, Copernicus went to the University of Bologna in 1496 to study canon law (see Goddu part 2 on what Copernicus may have encountered in Italy). While at Bologna he lived with the astronomy professor Domenico Maria Novara and made his first astronomical observations. In addition, as Rosen (1971, 323) noted, “In establishing close contact with Novara, Copernicus met, perhaps for the first time in his life, a mind that dared to challenge the authority of [Ptolemy] the most eminent ancient writer in his chosen fields of study.” Copernicus also gave a lecture on mathematics in Rome, which may have focused on astronomy.
    step1: |-
      1495年，瓦岑罗德安排哥白尼当选为弗龙堡（Frombork，德语作 Frauenberg）议事会、即瓦尔米亚主教座堂议事会的议事司铎，这是一个仅低于主教的行政职位。两年后他就任此职，其经济状况终生无忧。与此同时，哥白尼追随舅父的足迹，于1496年前往博洛尼亚大学（University of Bologna）学习教会法（关于哥白尼在意大利可能遇到的情况，见 Goddu 第二部分）。在博洛尼亚期间，他同天文学教授多梅尼科·马里亚·诺瓦拉（Domenico Maria Novara）住在一起，并完成了他的首次天文观测。此外，正如 Rosen (1971, 323) 所指出的，「通过与诺瓦拉建立密切联系，哥白尼或许平生第一次遇见一个敢于挑战[托勒密]这一他所选研究领域中最杰出古代作家之权威的心灵。」哥白尼还在罗马作了一次数学讲座，其中可能以天文学为主。
    step2: |-
      1495年，瓦岑罗德为哥白尼谋得弗龙堡（Frombork，德语作 Frauenberg）议事会、即瓦尔米亚主教座堂议事会的议事司铎一职——这是一个仅低于主教的行政职位。哥白尼两年后就任，从此生计无忧。与此同时，他追随舅父的足迹，于1496年入博洛尼亚大学（University of Bologna）研习教会法（关于哥白尼在意大利可能有的见闻，见 Goddu 第二部分）。在博洛尼亚，哥白尼与天文学教授多梅尼科·马里亚·诺瓦拉（Domenico Maria Novara）同住，并做了平生最初的几次天文观测。此外，正如 Rosen (1971, 323) 所言，「通过与诺瓦拉亲密往来，哥白尼或许有生以来第一次遇到一个敢于质疑[托勒密]——他所钻研领域中最杰出的古代作家——权威的头脑。」哥白尼还在罗马作过一次数学演讲，其内容或许集中于天文学。
  - id: "5"
    source: |-
      Copernicus’s studies at Bologna provided an advantage he did not have at Cracow – a teacher of Greek. Humanism began to infiltrate the Italian universities in the fifteenth century. As Grendler (510) remarked, “By the last quarter of the century, practically all universities had one or several humanists, many of them major scholars.” Antonio Cortesi Urceo, called Codro, became professor at Bologna in 1482 and added Greek several years later. Copernicus may have studied with him, for Copernicus translated into Latin the letters of the seventh-century Byzantine author Theophylactus Simocatta (*MW* 27–71) from the 1499 edition of a collection of Greek letters produced by the Venetian humanist printer Aldus Manutius. Aldus had dedicated his edition to Urceo. Copernicus had his translation printed in 1509, his only publication prior to the *On the Revolutions* (*De revolutionibus*). It is important to note that Copernicus’s acquisition of a good reading knowledge of Greek was critical for his studies in astronomy because major works by Greek astronomers, including Ptolemy, had not yet been translated into Latin, the language of the universities at the time.
    step1: |-
      在博洛尼亚的学业为哥白尼带来一个他在克拉科夫所没有的优势——一位希腊语教师。人文主义在十五世纪开始渗入意大利的大学。正如 Grendler (510) 所言，「到该世纪最后四分之一，几乎所有的大学都有一名或数名人文主义者，其中许多是重要的学者。」安东尼奥·科尔泰西·乌尔切奥（Antonio Cortesi Urceo，人称科德罗 Codro）于1482年成为博洛尼亚的教授，数年后增设希腊语。哥白尼可能曾随他学习，因为哥白尼曾把七世纪拜占庭作家泰奥菲拉克图斯·西莫卡塔（Theophylactus Simocatta）的书信译成拉丁语（*MW* 27–71），所据是1499年版的一部希腊书信集，由威尼斯人文主义印刷商阿尔杜斯·马努蒂乌斯（Aldus Manutius）印行。阿尔杜斯把他的版本题献给乌尔切奥。哥白尼于1509年印行了他的译本，这是他此前唯一发表的著作，早于《天体运行论》（*De revolutionibus*）。重要的是应注意到，哥白尼获得良好的希腊语阅读能力对他的天文学研究至关重要，因为包括托勒密在内的希腊天文学家的重要著作当时尚未译成拉丁语——即当时大学的通用语言。
    step2: |-
      在博洛尼亚的学业带给哥白尼一个克拉科夫所没有的优势——一位希腊语教师。十五世纪，人文主义开始渗入意大利的大学。正如 Grendler (510) 所说，「到该世纪最后二十五年，几乎每一所大学都有一名或数名人文主义者，其中不乏重要学者。」安东尼奥·科尔泰西·乌尔切奥（Antonio Cortesi Urceo，人称科德罗 Codro）1482年任博洛尼亚教授，数年后又增设希腊语。哥白尼或许曾师从他，因为哥白尼把七世纪拜占庭作家泰奥菲拉克图斯·西莫卡塔（Theophylactus Simocatta）的书信译成了拉丁语（*MW* 27–71），底本是1499年威尼斯人文主义印刷商阿尔杜斯·马努蒂乌斯（Aldus Manutius）印行的一部希腊书信集。阿尔杜斯把这一版本题献给了乌尔切奥。哥白尼的译本于1509年付印，这是他在《天体运行论》（*De revolutionibus*）之前唯一的出版物。值得注意的是，哥白尼获得良好的希腊语阅读能力对其天文学研究至关重要，因为包括托勒密在内的希腊天文学家的重要著作当时尚未被译成拉丁语——即当时大学的通用语言。
