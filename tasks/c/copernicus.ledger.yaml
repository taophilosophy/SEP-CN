      As the rejection of the equant suggests a return to the Aristotelian demand for true uniform circular motion of the heavenly bodies, it is unlikely that Copernicus adopted the heliocentric model because philosophies popular among Renaissance humanists like Neoplatonism and Hermetism compelled him in that direction.[^note-6] Nor should we attribute Copernicus’s desire for uniform circular motions to an aesthetic need, for this idea was philosophical not aesthetic, and Copernicus’s replacing the equant with epicyclets made his system more complex than Ptolemy’s. Most importantly, we should bear in mind what Swerdlow and Neugebauer (59) asserted:

      > Copernicus arrived at the heliocentric theory by a careful analysis of planetary models – and as far as is known, he was the only person of his age to do so – and if he chose to adopt it, he did so on the basis of an equally careful analysis.
    step1: |-
      既然拒绝偏心匀速点暗示回归亚里士多德对天体真正均匀圆周运动的要求，那么哥白尼采纳日心模型，不大可能因为文艺复兴人文主义者中流行的哲学——如新柏拉图主义（Neoplatonism）和赫尔墨斯主义（Hermetism）——把他推向那个方向。[^note-6] 我们也不应把哥白尼对均匀圆周运动的渴望归于审美需要，因为这个观念是哲学性的而非审美性的，而且哥白尼用本轮小圆（epicyclets）取代偏心匀速点，使他的系统比托勒密的更复杂。最重要的是，我们应牢记 Swerdlow 和 Neugebauer (59) 所断言的：
      > 哥白尼是通过对行星模型的仔细分析而得出日心说的——就所知而言，他是那个时代唯一这样做的人——如果他选择采纳它，那也是基于同样仔细的分析。
