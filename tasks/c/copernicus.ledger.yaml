      The manuscript of *On the Revolutions* was basically complete when Rheticus came to visit him in 1539. The work comprised six books. The first book, the best known, discussed what came to be known as the Copernican theory and what is Copernicus’s most important contribution to astronomy, the heliocentric universe (although in Copernicus’s model, the sun is not truly in the center). Book 1 set out the order of the heavenly bodies about the sun: “[The sphere of the fixed stars] is followed by the first of the planets, Saturn, which completes its circuit in 30 years. After Saturn, Jupiter accomplishes its revolution in 12 years. The Mars revolves in 2 years. The annual revolution takes the series’ fourth place, which contains the earth…together with the lunar sphere as an epicycle. In the fifth place Venus returns in 9 months. Lastly, the sixth place is held by Mercury, which revolves in a period of 80 days” (*Revolutions*, 21–22). This established a relationship between the order of the planets and their periods, and it made a unified system. This may be the most important argument in favor of the heliocentric model as Copernicus described it.[^note-8] It was far superior to Ptolemy’s model, which had the planets revolving around the earth so that the sun, Mercury, and Venus all had the same annual revolution. In book 1 Copernicus also insisted that the movements of all bodies must be circular and uniform, and noted that the reason they may appear nonuniform to us is “either that their circles have poles different [from the earth’s] or that the earth is not at the center of the circles on which they revolve” (*Revolutions*, 11). Particularly notable for Copernicus was that in Ptolemy’s model the sun, the moon, and the five planets seemed ironically to have different motions from the other heavenly bodies and it made more sense for the small earth to move than the immense heavens. But the fact that Copernicus turned the earth into a planet did not cause him to reject Aristotelian physics, for he maintained that “land and water together press upon a single center of gravity; that the earth has no other center of magnitude; that, since earth is heavier, its gaps are filled with water…” (*Revolutions*, 10). As Aristotle had asserted, the earth was the center toward which the physical elements gravitate. This was a problem for Copernicus’s model, because if the earth was no longer the center, why should elements gravitate toward it?
    step1: |-
      当雷蒂库斯于 1539 年来访时，《天体运行论》的书稿基本完成。该书包含六卷。第一卷最为著名，论述了后来所称的哥白尼理论，以及哥白尼对天文学最重要的贡献——日心宇宙（尽管在哥白尼模型中，太阳并非真正位于中心）。第一卷列出诸天体围绕太阳的次序：「[恒星天球]之后是行星中的第一个——土星，它在 30 年内完成一周。土星之后，木星在 12 年内完成其公转。火星在 2 年内公转。周年公转占据序列的第四位，其中包含地球……连同作为本轮的月球天球。第五位是金星，在 9 个月内回归。最后，第六位由水星占据，它在 80 天的周期内公转」（*Revolutions*, 21–22）。这确立了行星次序与其周期之间的关系，并构成一个统一的系统。这或许是支持哥白尼所描述的日心模型的最重要论据。[^note-8] 它远优于托勒密的模型——托勒密模型让行星绕地球公转，因此太阳、水星、金星都具有相同的周年公转。在第一卷中，哥白尼还坚持所有物体的运动必须是圆周的、均匀的，并指出它们在我们看来可能显得不均匀的原因是「要么它们的圆之极点不同于[地球的]，要么地球不是它们所绕以运转的圆的中心」（*Revolutions*, 11）。对哥白尼而言尤其值得注意的是，在托勒密模型中，太阳、月球和五大行星似乎具有与其它天体不同的运动——具有讽刺意味的是——让渺小的地球运动比让浩瀚的天界运动更说得通。但哥白尼把地球变成一颗行星，并没有使他抛弃亚里士多德物理学，因为他主张「陆与水共同压向单一的重力中心；地球没有其它的体积中心；由于土更重，其空隙由水填充……」（*Revolutions*, 10）。正如亚里士多德所断言，地球是物理元素向其倾斜的中心。这对哥白尼的模型是一个问题，因为如果地球不再是中心，元素为何还要向它倾斜？
