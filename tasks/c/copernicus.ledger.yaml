      During the European Middle Ages, the Islamic world was the center of astronomical thought and activity. During the ninth century several aspects of Ptolemy’s solar theory were recalculated. Ibn al-Haytham in the tenth-eleventh century wrote a scathing critique of Ptolemy’s work: “Ptolemy assumed an arrangement that cannot exist, and the fact that this arrangement produces in his imagination the motions that belong to the planets does not free him from the error he committed in his assumed arrangement, for the existing motions of the planets cannot be the result of an arrangement that is impossible to exist” (quoted in Rosen 1984, 174)[^rosen-1984]. Swerdlow and Neugebauer (46–48) stressed that the thirteenth-century Maragha school was also important in finding errors and correcting Ptolemy: “The method of the Maragha planetary models was to break up the equant motion in Ptolemy’s models into two or more components of uniform circular motion, physically the uniform rotation of spheres, that together control the direction and distance of the center of the epicycle, so that it comes to lie in nearly the same position it would have in Ptolemy’s model, and always moves uniformly with respect to the equant.” They found that Copernicus used devices that had been developed by the Maragha astronomers Nasir al-Din Tusi (1201–1274), Muayyad al-Din al-Urdi (d. 1266), Qutb al-Din al-Shirazi (1236–1311), and Ibn al-Shatir (1304–1375). In addition, Ragep, 2005, has shown that a theory for the inner planets presented by Regiomontanus that enabled Copernicus to convert the planets to eccentric models had been developed by the fifteenth-century, Samarqand-trained astronomer ali Qushji (1403–1474).[^note-4]
    step1: |-
      在欧洲中世纪，伊斯兰世界是天文学思想与活动的中心。公元九世纪，托勒密太阳理论的若干方面被重新推算。十至十一世纪，伊本·海什木（Ibn al-Haytham）对托勒密的工作写了尖锐的批评：「托勒密假设了一种不可能存在的安排；这种安排在想象中产生出属于行星的运动，并不能使他免于在他所假设的安排中犯下的错误，因为行星的实际运动不可能源于一种不可能存在的安排」（转引自 Rosen 1984, 174）[^rosen-1984]。Swerdlow 和 Neugebauer (46–48) 强调，十三世纪的马拉盖学派（Maragha school）在发现错误和修正托勒密方面也很重要：「马拉盖行星模型的方法是，把托勒密模型中的偏心匀速点运动分解为两个或多个均匀圆周运动分量，在物理上即诸天球的均匀转动；这些分量共同控制本轮中心的方向与距离，使其大致处于托勒密模型中它应处的位置，并始终相对于偏心匀速点作均匀运动。」他们发现哥白尼使用了由马拉盖天文学家纳西尔丁·图西（Nasir al-Din Tusi，1201–1274）、穆阿亚德·丁·乌尔迪（Muayyad al-Din al-Urdi，卒于1266）、古特布丁·设拉子（Qutb al-Din al-Shirazi，1236–1311）和伊本·沙提尔（Ibn al-Shatir，1304–1375）发展出来的装置。此外，Ragep, 2005 表明，雷乔蒙塔努斯提出的一种内行星理论——它使哥白尼能够把行星转换成偏心模型——是由十五世纪接受撒马尔罕训练的（Samarqand-trained）天文学家阿里·库什吉（ali Qushji，1403–1474）发展出来的。[^note-4]
    step2: |-
      在欧洲中世纪，伊斯兰世界是天文学思想与活动的中心。公元九世纪，托勒密太阳理论的若干方面被重新推算。十至十一世纪，伊本·海什木（Ibn al-Haytham）对托勒密的工作写下了尖锐的批评：「托勒密假设了一种不可能存在的安排；这种安排在想象中产生出属于行星的运动，并不能使他免于在假定的安排中所犯的错误，因为行星的实际运动不可能源于一种不可能存在的安排」（转引自 Rosen 1984, 174）[^rosen-1984]。Swerdlow 与 Neugebauer (46–48) 强调，十三世纪的马拉盖学派（Maragha school）在发现错误、修正托勒密方面同样重要：「马拉盖行星模型的方法，是把托勒密模型中的偏心匀速点运动分解为两个或多个均匀圆周运动分量——在物理上即诸天球的均匀转动；这些分量共同控制本轮中心的方向与距离，使其大体处于托勒密模型中它应有的位置，并始终相对于偏心匀速点作均匀运动。」他们发现，哥白尼使用了马拉盖天文学家纳西尔丁·图西（Nasir al-Din Tusi，1201–1274）、穆阿亚德·丁·乌尔迪（Muayyad al-Din al-Urdi，卒于1266）、古特布丁·设拉子（Qutb al-Din al-Shirazi，1236–1311）与伊本·沙提尔（Ibn al-Shatir，1304–1375）所发展的装置。此外，Ragep, 2005 表明，雷乔蒙塔努斯提出的一种内行星理论——它使哥白尼得以把诸行星转换成偏心模型——是由十五世纪受教于撒马尔罕（Samarqand）的天文学家阿里·库什吉（ali Qushji，1403–1474）发展出来的。[^note-4]
