      我们无法确切知道哥白尼为何开始主张日心宇宙论。尽管他在哲学史上十分重要，关于哥白尼的第一手资料却很少。他唯一的天文学著作是《短论》、《致维尔纳的信》和《天体运行论》；他印行了泰奥菲拉克图斯书信的译本，并撰写了论铸币一文的多个版本；其他著作与教区事务有关，现存的少数书信也大多如此。遗憾的是，雷蒂库斯所写的传记——本应给学者提供海量信息——已经失传。因此，关于哥白尼思想与著作最有趣问题的许多答案，都是猜测和推论的结果，我们只能猜测哥白尼为何采纳日心体系。
