      《短论》本只是作为哥白尼思想的导论而写，他写道「为简略起见，我本想用于那部较大著作的数学证明应予省略……」（*MW* 82）。从某种意义上说，这是对哥白尼已经着手的那部更大著作的预告。《短论》在哥白尼生前从未出版，但他把手稿副本分寄给多位天文学家和哲学家。他受到一些打击，因为日心体系似乎与《圣经》相悖，但大体上仍受到鼓励。哥白尼对官方历法改革的参与，仅限于一封现已失传的信；不过，那项努力使得一种新的、严肃的天文学理论备受欢迎。对教会当局反应的恐惧，很可能只是他延迟出版著作的诸多原因中最次要的一个。[^note-7] 延迟的最重要原因是：这部更大的著作既需要天文观测，也需要错综复杂的数学证明。他的行政职责无疑干扰了研究与写作。他无法进行所需的定期观测，而经常笼罩浓雾的弗龙堡也不是进行这些观测的好地方。此外，正如 Gingerich (1993, 37) 所指出的：
      > [哥白尼] 远离主要的国际印刷中心——那些中心本可有利可图地处理像《天体运行论》这样庞大而专业的书。另一方面，他的手稿仍充斥着数值上的不一致，他也很清楚自己并未充分利用日心观点所提供的机会……再者，哥白尼远离学术中心，因而缺少受过技术训练的同事的切磋激励，无法同他们讨论自己的工作。
