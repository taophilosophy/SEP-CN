      Although Copernicus received encouragement to publish his book from his close friend, the bishop of Chelmo Tiedemann Giese (1480–1550), and from the cardinal of Capua Nicholas Schönberg (1472–1537), it was the arrival of Georg Joachim Rheticus in Frombork that solved his needs for a supportive and stimulating colleague in mathematics and astronomy and for access to an appropriate printer. Rheticus was a professor of mathematics at the University of Wittenberg, a major center for the student of mathematics as well as for Lutheran theology. In 1538 Rheticus took a leave of absence to visit several famous scholars in the fields of astronomy and mathematics. It is not known how Rheticus learned about Copernicus’s theory; he may have been convinced to visit Copernicus by one of the earlier scholars he had visited, Johann Schöner, though, as Swerdlow and Neugebauer (16) noted, by “the early 1530’s knowledge of Copernicus’s new theory was circulating in Europe, even reaching the high and learned circles of the Vatican.” Rheticus brought with him some mathematical and astronomical volumes, which both provided Copernicus with some important material and showed him the quality of the mathematical printing available in the German centers of publishing.[^note-10] Rheticus’s present of the 1533 edition of Regiomontanus’s *On all Kinds of Triangles* (*De triangulis omnimodis*), for example, convinced Copernicus to revise his section on trigonometry. But Rheticus was particularly interested in showing Copernicus the work of the Nuremberg publisher Johann Petreius as a possible publisher of Copernicus’s volume. Swerdlow and Neugebauer (25) plausibly suggested that “Petreius was offering to publish Copernicus’s work, if not advertising by this notice that he was already committed to do so.” Rheticus wrote the *Narratio prima* in 1540, an introduction to the theories of Copernicus, which was published and circulated. This further encouraged Copernicus to publish his *Revolutions*, which he had been working on since he published the *Commentariolus*.
    step1: |-
      尽管哥白尼从密友、海乌姆诺（Chelmo）主教蒂德曼·吉泽（Tiedemann Giese，1480–1550）以及卡普阿（Capua）红衣主教尼古拉斯·申贝格（Nicholas Schönberg，1472–1537）那里得到出版其著作的鼓励，但真正解决他对一位在数学和天文学上支持与激励他的同事以及接触合适印刷商的需求的，是格奥尔格·约阿希姆·雷蒂库斯来到弗龙堡。雷蒂库斯是维滕贝格大学的数学教授，该校是数学研究与路德宗神学的重要中心。1538 年，雷蒂库斯请假拜访天文学和数学领域的几位著名学者。我们不知道雷蒂库斯如何得知哥白尼的理论；他可能是被他此前拜访过的学者之一约翰·舍纳（Johann Schöner）说服去拜访哥白尼的，尽管正如 Swerdlow 和 Neugebauer (16) 所指出的，到「1530 年代初，关于哥白尼新理论的知识已在欧洲流传，甚至传到梵蒂冈高层博学的圈子。」雷蒂库斯随身带来一些数学和天文学书籍，这些书既为哥白尼提供了一些重要材料，也向他展示了德语出版中心所能提供的数学印刷质量。[^note-10] 例如，雷蒂库斯赠送的雷乔蒙塔努斯《论各种三角形》（*De triangulis omnimodis*）1533 年版，说服哥白尼修订他的三角学部分。但雷蒂库斯特别想向哥白尼展示纽伦堡出版商约翰·彼得雷乌斯（Johann Petreius）的工作，把他作为哥白尼著作的可能出版商。Swerdlow 和 Neugebauer (25) 有说服力地提出，「彼得雷乌斯提出出版哥白尼的著作，如果不是借此通告宣示他已承诺这样做的话。」雷蒂库斯于 1540 年写了《初论》，这是哥白尼理论的导论，出版并流传开来。这进一步鼓励哥白尼出版他的《天体运行论》，自他出版《短论》以来他一直在写这部书。
    step2: |-
      尽管哥白尼从密友、海乌姆诺（Chelmo）主教蒂德曼·吉泽（Tiedemann Giese，1480–1550）与卡普阿（Capua）红衣主教尼古拉斯·申贝格（Nicholas Schönberg，1472–1537）那里得到出版其著作的鼓励，但真正满足他对一位数学与天文学上支持并激励他的同事、以及接触合适印刷商之需求的，是格奥尔格·约阿希姆·雷蒂库斯抵达弗龙堡。雷蒂库斯是维滕贝格大学的数学教授；该校既是数学研究的重要中心，也是路德宗神学的重要中心。1538 年，雷蒂库斯请假走访天文学与数学领域的几位著名学者。我们不知道雷蒂库斯如何得知哥白尼的理论；他可能是被他先前拜访过的学者之一约翰·舍纳（Johann Schöner）说服去拜访哥白尼的，尽管正如 Swerdlow 与 Neugebauer (16) 所指出的，到「1530 年代初，关于哥白尼新理论的知识已在欧洲流传，甚至传到梵蒂冈高层博学的圈子。」雷蒂库斯随身带来若干数学与天文学书籍，这些书既为哥白尼提供了一些重要材料，也向他展示了德语出版中心所能达到的数学印刷水准。[^note-10] 例如，雷蒂库斯所赠雷乔蒙塔努斯《论各种三角形》（*De triangulis omnimodis*）1533 年版，就说服哥白尼修订其三角学部分。但雷蒂库斯尤其想向哥白尼展示纽伦堡出版商约翰·彼得雷乌斯（Johann Petreius）的工作，把他列为哥白尼著作的可能出版者。Swerdlow 与 Neugebauer (25) 有说服力地提出，「彼得雷乌斯提出出版哥白尼的著作——如果不是借此通告宣示他已承诺这样做的话。」雷蒂库斯于 1540 年写了《初论》，作为哥白尼理论的导论，随即出版流传。这进一步鼓励哥白尼出版他的《天体运行论》——自出版《短论》以来他一直在撰写此书。
