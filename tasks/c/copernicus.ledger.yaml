      离开舅父、迁居弗龙堡并未使哥白尼从此摆脱行政与政治职责。他负责管理多处领地，包括主持供给基金、裁定纠纷、出席会议、掌管账目与档案。他发现当地货币问题后，起草了一篇论铸币的文章（*MW* 176–215），谴责货币成色下降，并提出改革建议。普鲁士与波兰的领袖在整顿货币时都曾参考他的手稿。在1520至1525年对条顿骑士团的战争中，他是西普鲁士一方的首领。他担任主教（舅父已于1512年去世）及议事会成员的医生，并为东西普鲁士的显要人物充当顾问医师。
