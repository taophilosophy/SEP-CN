      The *Commentariolus* was only intended as an introduction to Copernicus’s ideas, and he wrote “the mathematical demonstrations intended for my larger work should be omitted for brevity’s sake…” (*MW* 82). In a sense it was an announcement of the greater work that Copernicus had begun. The *Commentariolus* was never published during Copernicus’s lifetime, but he sent manuscript copies to various astronomers and philosophers. He received some discouragement because the heliocentric system seemed to disagree with the Bible, but mostly he was encouraged. Although Copernicus’s involvement with official attempts to reform the calendar was limited to a no longer extant letter, that endeavor made a new, serious astronomical theory welcome. Fear of the reaction of ecclesiastical authorities was probably the least of the reasons why he delayed publishing his book.[^note-7] The most important reasons for the delay was that the larger work required both astronomical observations and intricate mathematical proofs. His administrative duties certainly interfered with both the research and the writing. He was unable to make the regular observations that he needed and Frombork, which was often fogged in, was not a good place for those observations. Moreover, as Gingerich (1993, 37) pointed out,

      > [Copernicus] was far from the major international centers of printing that could profitably handle a book as large and technical as *De revolutionibus*. On the other [hand], his manuscript was still full of numerical inconsistencies, and he knew very well that he had not taken complete advantage of the opportunities that the heliocentric viewpoint offered…Furthermore, Copernicus was far from academic centers, thereby lacking the stimulation of technically trained colleagues with whom he could discuss his work.
    step1: |-
      《短论》只是作为哥白尼思想的导论而写，他写道「为简略起见，我本想用于较大著作的数学证明应予省略……」（*MW* 82）。从某种意义上说，这是对哥白尼已开始的更大著作的预告。《短论》在哥白尼生前从未出版，但他把手稿副本寄给了多位天文学家和哲学家。他受到一些挫折，因为日心体系似乎与《圣经》相悖，但总体上是受到鼓励的。虽然哥白尼参与官方历法改革仅限于一封已失传的信，但那项努力使得一种新的、严肃的天文学理论受到欢迎。对教会当局反应的恐惧，很可能只是他延迟出版著作的原因中最次要的。[^note-7] 延迟的最重要原因是，这部更大的著作既需要天文观测，也需要复杂的数学证明。他的行政职责无疑干扰了研究和写作。他无法进行所需的定期观测，而经常大雾弥漫的弗龙堡也不是进行这些观测的好地方。此外，正如 Gingerich (1993, 37) 指出的：
      > [哥白尼] 远离主要的国际印刷中心，那些中心本可有利可图地处理像《天体运行论》这样庞大而专业的书。另一方面，他的手稿仍充满数值上的不一致，而且他深知自己没有充分利用日心观点所提供的机会……此外，哥白尼远离学术中心，因此缺乏受过技术训练的同事的激励，无法与他们讨论自己的工作。
