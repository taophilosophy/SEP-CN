      Copernicus left Bologna for Frombork in 1501 without having obtained his degree. The chapter then approved another leave of absence for Copernicus to study medicine at the University of Padua. The medical curriculum did not just include medicine, anatomy, and the like when Copernicus studied it. Siraisi (1990, 16) noted that “the reception in twelfth-century western Europe of Greek and Islamic technical astronomy and astrology fostered the development of medical astrology…the actual practice of medical astrology was greatest in the West between the fourteenth and the sixteenth centuries.” Astrology was taught in the medical schools of Italy. “The importance attached to the study of the stars in medieval medical education derived from a general and widely held belief that the heavenly bodies play an intermediary role in the creation of things here below and continue to influence them throughout their existence. The actual uses of astrology in medical diagnosis and treatment by learned physicians were many and various. ‘Astrological medicine’ is a vague and unsatisfactory term that can embrace any or all of the following: first, to pay attention to the supposed effect of astrological birth signs or signs at conception on the constitution and character of one’s patients; second, to vary treatment according to various celestial conditions…third, to connect the doctrine of critical days in illness with astrological features, usually phases of the moon; and fourth, to predict or explain epidemics with reference to planetary conjunctions, the appearance of comets, or weather conditions” (Siraisi 1981, 141–42)[^siraisi-1981]. It is true that astrology required that medical students acquire some grounding in astronomy; nevertheless, it is likely that Copernicus studied astrology while at the University of Padua.[^note-2]
    step1: |-
      1501年，哥白尼未获学位便离开博洛尼亚返回弗龙堡。随后，议事会批准哥白尼再次休假，前往帕多瓦大学（University of Padua）学习医学。在哥白尼学习之时，医学课程并非只包括医学、解剖学之类。Siraisi (1990, 16) 指出，「十二世纪西欧对希腊和伊斯兰技术天文学与占星术的接受促进了医学占星术的发展……医学占星术的实际运用在十四至十六世纪之间的西方最为兴盛。」占星术在意大利的医学院校中讲授。「中世纪医学教育重视对星辰的研究，源于一种普遍而广为持有的信念，即天体在创造此下万物中扮演中介角色，并持续影响其全部存续期间。有学问的医生在实际诊断和治疗中对占星术的运用多种多样。『医学占星术』是一个含糊而不令人满意的术语，可涵盖以下任何一种或全部：其一，关注占星学出生星座或受孕星座对患者体质与性格的假定影响；其二，根据种种天象变化治疗……其三，把疾病危重日学说与占星特征、通常是月相联系起来；其四，参照行星会合、彗星出现或天气状况来预言或解释流行病」（Siraisi 1981, 141–42）[^siraisi-1981]。诚然，占星术要求医学生具备一定的天文学基础；然而，哥白尼很可能在帕多瓦大学期间学习了占星术。[^note-2]
    step2: |-
      1501年，哥白尼未及取得学位便离开博洛尼亚回到弗龙堡。议事会随后又批准他请假，赴帕多瓦大学（University of Padua）学医。在哥白尼就读的年代，医学课程并不限于医学、解剖学之类。Siraisi (1990, 16) 指出，「十二世纪西欧对希腊与伊斯兰技术天文学和占星术的接受，促成了医学占星术的发展……十四至十六世纪之间，医学占星术在西方实践得最为兴盛。」意大利的医学院校教授占星术。「中世纪医学教育之所以看重对星辰的研究，出于一种普遍而广泛持有的信念：天体在创造世间万物中起中介作用，并在万物整个存在期间持续施加影响。有学问的医生把占星术用于临床诊断与治疗，方式繁多。『医学占星术』一词含混而难以令人满意，可指代以下任意一项或全部：其一，留意出生或受孕时的占星星座对患者体质与性格的假定影响；其二，依种种天象变化调整治疗……其三，把疾病中的危重日学说同占星特征（通常为月相）相联系；其四，参照行星会合、彗星出没或天气状况预言或解释流行病」（Siraisi 1981, 141–42）[^siraisi-1981]。诚然，占星术要求医学生具备一定的天文学根基；尽管如此，哥白尼在帕多瓦大学期间很可能学习过占星术。[^note-2]
  - id: "7"
    source: |-
      Copernicus did not receive his medical degree from Padua; the degree would have taken three years, and Copernicus had only been granted a two-year leave of absence by his chapter. Instead he matriculated in the University of Ferrara, from which he obtained a doctorate in canon law. But he did not return to his chapter in Frombork; rather he went to live with his uncle in the episcopal palace in Lidzbark-Warminski (Heilsberg in German). Although he made some astronomical observations, he was immersed in church politics, and after his elderly uncle became ill in 1507, Copernicus was his attending physician. Rosen (1971, 334–35) reasonably conjectured that the bishop may have hoped that his nephew would be his successor, but Copernicus left his uncle because his duties in Lidzbark-Warminski interfered with his continuing pursuit of his studies in astronomy. He took up residence in his chapter of Frombork in 1510 and stayed there the rest of his life.
    step1: |-
      哥白尼没有从帕多瓦获得医学学位；该学位本需三年，而议事会只批给他两年假期。于是他在费拉拉大学（University of Ferrara）注册，并由此获得教会法博士学位。但他没有返回弗龙堡的议事会；而是前往利兹巴克-瓦尔明斯基（Lidzbark-Warminski，德语作 Heilsberg）的主教宫与舅父同住。尽管他做了一些天文观测，他却深陷教会政治；1507年舅父年迈患病后，哥白尼成了他的主治医生。Rosen (1971, 334–35) 合理地推测，这位主教或许希望侄儿成为他的继任者，但哥白尼离开了舅父，因为他在利兹巴克-瓦尔明斯基的职责干扰了他继续钻研天文学。1510年，他定居于弗龙堡的议事会，并在那里度过余生。
    step2: |-
      哥白尼并未在帕多瓦取得医学学位——该学位需三年修习，而议事会只准了他两年假。于是他转入费拉拉大学（University of Ferrara），在那里获得教会法博士学位。但他没有回到弗龙堡的议事会，而是前往利兹巴克-瓦尔明斯基（Lidzbark-Warminski，德语作 Heilsberg）的主教宫，与舅父同住。他虽做过一些天文观测，却深陷于教会政治；1507年舅父年迈病倒后，哥白尼成了他的主治医师。Rosen (1971, 334–35) 合理推断，主教或许盼望侄儿继任，但哥白尼终究离开了舅父，因为在利兹巴克-瓦尔明斯基的公务妨碍了他继续钻研天文学。1510年，他在弗龙堡议事会安顿下来，此后终生居住于此。
