      斯多亚式世界主义以其各种面貌在整个希腊—罗马世界极具说服力。这一成功部分可以这样解释：当时的世界本身就极为世界主义。亚历山大大帝的征服以及随后其帝国分裂为继业者诸王国，抽空了地方城市的大量传统权威，促进了城市之间接触的增加；后来罗马帝国的兴起又把整个地中海统一在一个政治权力之下。但若说世界主义是作为对城邦衰落或罗马帝国兴起的*回应*而产生的——这是常被重复的说法——那就错了。首先，城邦的衰落被大大夸张了：在继业者诸王国治下，甚至（程度虽轻）在罗马治下，地方上仍留有相当大的空间可供重要的政治参与。其次，更具决定性的理由是：在所谓希腊化时代与罗马帝国时期如此有说服力的世界主义，实际上植根于*早于*亚历山大征服的思想发展。尽管如此，无疑正是斯多亚主义在其中发展并繁荣的那些帝国，使许多人对世界主义理想更易接受，从而大大促成了斯多亚式世界主义的广泛影响。

