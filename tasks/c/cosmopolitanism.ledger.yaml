      不少理论家反对政治世界主义辩论里那种对国家角色的关注。在他们看来，一种真正世界主义的理论应当直接回应人类个体的需要和利益——把他们当作世界公民——而不是间接地、通过他们对特定国家的成员身份来回应。真正需要的是这样一种理论：它不只关心个体的道德义务或国家之间的政治关系，而是关心世界范围的社会制度是否正义，以及实现正义需要哪些措施。这种在*全球分配正义*辩论中的「世界主义」立场，特别尖锐地批评他们所理解的约翰·罗尔斯：不管在《正义论》还是后来的《万民法》里，罗尔斯都把国家利益置于个体利益之上。他们指责说，要确立全球正义的原则，罗尔斯本该把「原初状态」这个著名的思想实验用在全体人类个体的层面上，而不是像他那样论证一个「第二次原初状态」，由所有「诸民族」的代表参加。罗尔斯和他的世界主义批评者之间的争论，指向国家应当扮演什么角色、占什么地位的问题：国家是追求正义不可缺少的工具（理想情况下体现诸民族的民主自决原则），还是恰恰妨碍正义，因为它们以有需要者的利益为代价巩固国家利益？
