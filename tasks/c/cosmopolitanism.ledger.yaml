      Yet most eighteenth-century defenders of cosmopolitanism did not recognize their own view in these critical descriptions. They understood cosmopolitanism not as a form of ultra-individualism, but rather, drawing on the Stoic tradition, as implying the positive moral ideal of a universal human community, and they did not regard this ideal as inimical to more particular attachments. Some, like the German author Christoph Martin Wieland, stayed quite close to Stoic views. Others developed a cosmopolitan moral theory that was distinctively new. According to Kant, all rational beings are members in a single moral community. They are analogous to citizens in the political (republican) sense in that they share the characteristics of freedom, equality, and independence, and that they live under their own laws. Their common laws, however, are the laws of morality, grounded in reason. Early utilitarian cosmopolitans like Jeremy Bentham, by contrast, defended their cosmopolitanism by pointing to the “common and equal utility of all nations.” Moral cosmopolitanism could be grounded in human reason, or in some other characteristic universally shared among humans (and in some cases other kinds of beings) such as the capacity to experience pleasure or pain, a moral sense, or the aesthetic imagination. Moral cosmopolitans regarded all humans as ‘brothers’ – an analogy with which they aimed to indicate the fundamental equality of rank of all humans, which precluded slavery, colonial exploitation, feudal hierarchy, and tutelage of various sorts. As the term ‘brothers’ indicates, however, this does not mean that their own thought was always free from bias and inconsistency. Indeed, numerous authors combined their moral cosmopolitanism with a defense of the superiority of men over women, or that of “whites” over other “races.” A notable example is Kant, who defended European colonialism before he became very critical of it in the mid 1790s (Kleingeld 2014)[^kleingeld-2014], and who never gave up the view that women were inferior to men in morally relevant respects.
