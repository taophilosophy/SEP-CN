      The defenders of the loose, voluntary and noncoercive federation warn that a world-state easily becomes despotic without there being any competing power left to break the hold of despotism (Rawls). Defenders of the world-state reply that a stronger form of federation, or even merger, is the only way to truly exit the state of nature between states, or the only way to bring about international distributive justice (Nielsen, Cabrera). Other authors have argued that the focus among many political cosmopolitans on only these two alternatives overlooks a third cosmopolitan position, and that a concern for human rights should lead one to focus instead on institutional reform that disperses sovereignty vertically, rather than concentrating it in all-encompassing international institutions. On this view, peace, democracy, prosperity, and the environment would be better served by a system in which the political allegiance and loyalties of persons are widely dispersed over a number of political units of various sizes, without any one unit being dominant and thus occupying the traditional role of the state (Pogge).
    step1: |-
      松散、自愿、非强制联邦的辩护者警告说，世界国家很容易变成专制，因为不再有任何竞争力量能打破专制的控制（罗尔斯）。世界国家的辩护者回应说，更强形式的联邦甚至合并，是真正走出诸国自然状态的唯一办法，或者说，是实现国际分配正义的唯一办法（Nielsen, Cabrera）。另一些作者论证说，许多政治世界主义者只盯着这两个选项，忽略了第三种世界主义立场；对人权的关切应当使人转而关注在纵向上分散主权的制度改革，而不是把主权集中于包罗万象的国际机构。照这种看法，一种让人们的政治效忠和忠诚广泛分散在许多大小不一的政治单位之上、而没有任何一个单位占主导地位并因此占据国家传统角色的体系，会更有利于和平、民主、繁荣和环境（Pogge）。
