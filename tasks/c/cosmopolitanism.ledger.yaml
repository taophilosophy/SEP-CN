      A fuller exploration of positively committed philosophical cosmopolitanism arrives only with the Socratizing and Cynic-influenced Stoics of the third century CE. These Stoics are fond of saying that the cosmos is, as it were, a polis, because the cosmos is put in perfect order by law, which is right reason. They also embrace the negative implication of their high standards: conventional poleis do not, strictly speaking, deserve the name, and human beings who are not wise and virtuous do not count as citizens of the cosmos. But the Stoics do not believe that living in agreement with the cosmos – as a (virtuous) citizen of the cosmos – requires maintaining critical distance from conventional poleis. Rather, as the traces of Chrysippus’ *On Lives* make clear, the Stoics believe that goodness requires serving other human beings as best one can, that serving all human beings equally well is impossible, and that the best service one can give typically requires political engagement. Of course, the Stoics recognize that political engagement will not be possible for everyone, and that some people will best be able to help other human beings as private teachers of virtue rather than as politicians. But in no case, the Stoics insist, is consideration of political engagement to be limited to one’s own polis. The motivating idea is, after all, to help human beings as such, and sometimes the best way to do that is to serve as a teacher or as a political advisor in some foreign place. In this fashion, the Stoics introduce clear, practical content to their metaphor of the cosmopolis: a cosmopolitan considers moving away in order to serve, whereas a non-cosmopolitan does not.
    step1: |-
      对一种具有肯定承诺的哲学世界主义的更充分探索，要到公元三世纪受苏格拉底影响、受犬儒影响的斯多亚派那里才出现。这些斯多亚派乐于说，宇宙可以说就是一个城邦，因为宇宙被法——即正当理性——安排进了完美的秩序。他们也接受其高标准所含的否定性意涵：严格说来，约定俗成的城邦并不配此名，而并非智慧而有德的人也不算是宇宙的公民。但斯多亚派并不认为，与宇宙保持一致地生活——作为（有德的）宇宙公民——就要求同约定俗成的城邦保持批判性的距离。相反，正如克律西波《论生活方式》的残篇所表明的，斯多亚派相信：善要求尽其所能服务他人；同等良好地服务一切人是不可能的；而人能提供的最佳服务通常要求政治参与。当然，斯多亚派承认政治参与并非人人可能，也承认有些人作为私人的德性教师而非政治家，反而最能帮助他人。但斯多亚派坚持，在任何情况下，对政治参与的考量都不应局限于自己的城邦。毕竟，其激励性的观念是帮助作为人的人；而有时做到这一点的最好办法，就是在某个外邦地方做教师或政治顾问。斯多亚派就这样为其世界城邦的隐喻引入了明确而实践性的内容：世界主义者会考虑为服务而迁居，非世界主义者则不会。
    step2: |-
      要更充分地探讨一种有肯定承诺的哲学世界主义，得等到公元三世纪受苏格拉底和犬儒派影响的斯多亚派。这些斯多亚派喜欢说，宇宙可以说就是一个城邦，因为宇宙被法——也就是正当理性——安排得井然有序。他们也接受自己那套高标准带来的否定性含义：严格说来，约定俗成的城邦并不配叫这个名字，而不智慧、无德性的人也算不上宇宙的公民。但斯多亚派并不认为，与宇宙保持一致地生活——作为（有德性的）宇宙公民——就要求与约定俗成的城邦保持批判性的距离。相反，正如克律西波《论生活方式》的残篇所表明的，斯多亚派相信：善要求人尽其所能服务其他的人；同等地服务好所有人在不可能；而人能提供的最好的服务通常要求参与政治。当然，斯多亚派也承认，并非人人都有可能参与政治，有些人以私人身份做德性教师、而不是做政治家，反而最能帮到别人。但斯多亚派坚持，无论哪种情况，考虑政治参与时都不能只限于自己的城邦。毕竟，他们的出发点是要帮助作为人的人，而有时做到这一点的最好办法，就是到某个外邦去做教师或政治顾问。斯多亚派就这样给「世界城邦」这个隐喻加进了明确而实际的内容：世界主义者会考虑为了服务他人而搬走，非世界主义者不会。
