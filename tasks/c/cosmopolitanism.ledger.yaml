      In addition to moral and political forms of cosmopolitanism, there emerged an economic form of cosmopolitan theory. The freer trade advocated by eighteenth-century anti-mercantilists, especially Adam Smith, was developed further into the ideal of a global free market by Dietrich Hermann Hegewisch (Kleingeld 2012)[^kleingeld-2012]. His ideal was a world in which tariffs and other restrictions on foreign trade are abolished, a world in which the market, not the government, takes care of the needs of the people. Against mercantilism, he argued that it is more advantageous for everyone involved if a nation imports those goods which are more expensive to produce domestically, and that the abolition of protectionism would benefit everyone. If other states were to gain from their exports, they would reach a higher standard of living and become even better trading partners, because they could then import more, too. Moreover, on Hegewisch’s view, after trade will have been liberalized world-wide, the importance of national governments will diminish dramatically. As national governments are mostly focused on the national economy and defense, he argued, their future role will be at most auxiliary. The freer the global market becomes, the more the role of the states will become negligible.
