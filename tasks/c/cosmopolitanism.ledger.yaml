      不过，有两个因素确实有时把近代自然法理论推向世界主义方向。第一，某些自然法理论家假定，自然在人与上除了植入自我保存的倾向，*还*植入了同类之情，一种把一切人在根本层次上联合成某种世界共同体的合群性。然而，对这种共享人性纽带的诉诸非常单薄，而且它绝非必然导向世界主义。事实上，自然合群性这一概念有时反倒被用来为对世界其他地方民族的战争作辩护，据说这些民族以「不自然」的方式违反了这一共同纽带，或者轻易便可说成因其「野蛮」习俗而自置于共同人类道德的领域之外。第二，近代早期自然法理论常与社会契约论相联系；尽管多数社会契约论者阐发其观点时主要是——若非唯一地——针对国家层面而非国际关系层面，但社会契约论背后的观念本身却适于适用到后一层面。格劳秀斯、普芬多夫等人确实引出了这些意涵，从而为国际法奠定了基础。格劳秀斯设想了一个「诸国的伟大社会」，它受一部「万民法」约束，而该法「在一切国家之间」有效（《战争与和平法》，1625，绪论第 17 节；普芬多夫《自然法与万民法》，1672）。
