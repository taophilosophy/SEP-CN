      Moreover, there are several other concerns that lead critics to regard economic cosmopolitanism as undesirable. First among these is the lack of effective democratic control by the vast majority of the world’s population, as large multinationals are able to impose demands on states that are in a weak economic position and their populations, demands that they cannot reasonably refuse to meet, although this does not mean that they meet them fully voluntarily. This concerns, for example, labor conditions or the use of raw materials in developing countries.
    step1: TBD
