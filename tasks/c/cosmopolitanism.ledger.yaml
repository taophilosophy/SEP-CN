      The second inheritance from eighteenth century cosmopolitanism is found in the two centuries’ worth of attempts to create peace. It has often been noted that there are parallels between Kant’s peace proposal in *Toward Perpetual Peace* and the structure of the League of Nations as it existed in the early part of the 20th century as well as the structure of the current United Nations, although it should also be pointed out that essential features of Kant’s plan were not implemented, such as the abolition of standing armies. After the end of the cold war, discussion about the most appropriate world order to promote global peace resurged, just as it did after the first and second world wars.
