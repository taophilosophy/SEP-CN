      ## 2. Taxonomy of Contemporary Cosmopolitanisms
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Even this brief glance backwards reveals a wide variety of views that can be called cosmopolitan. Every cosmopolitan argues for some community among all human beings, regardless of social and political affiliation. For some, what should be shared is simply moral community, which means only that living a good human life requires serving the universal community by helping human beings as such, perhaps by promoting the realization of justice and the guarantee of human rights. Others conceptualize the universal community in terms of political institutions to be shared by all, in terms of cultural expressions that can be shared or appreciated by all, or in terms of economic markets that should be open to all.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      The most common cosmopolitanism – *moral* cosmopolitanism – does not always call itself such. But just as ancient cosmopolitanism was fundamentally a ‘moral’ commitment to helping human beings as such, much contemporary moral philosophy insists on the duty to aid foreigners who are starving or otherwise suffering, or at least on the duty to respect and promote basic human rights and justice.  One can here distinguish between strict and moderate forms of cosmopolitanism. The *strict* cosmopolitans in this sphere operate sometimes from utilitarian assumptions (e.g., Singer, Unger), sometimes from Kantian assumptions (e.g., O’Neill), and sometimes from more ancient assumptions (e.g., Nussbaum), but always with the claim that the duty to provide aid neither gets weighed against any extra duty to help locals or compatriots nor increases in strength when locals or compatriots are in question. Among these strict cosmopolitans some will say that it is permissible, at least in some situations, to concentrate one’s charitable efforts on one’s compatriots, while others deny this – their position will depend on the details of their moral theory. Other philosophers whom we may call *moderate* cosmopolitans (including, e.g., Scheffler) acknowledge the cosmopolitan scope of a duty to provide aid, but insist that we also have special duties to compatriots. Among the moderate cosmopolitans, many further distinctions can be drawn, depending on the reasons that are admitted for recognizing special responsibilities to compatriots and depending on how the special responsibilities are balanced with the cosmopolitan duties to human beings generally.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Moral cosmopolitanism has sometimes led to *political* cosmopolitanism. Again, we can draw useful distinctions among the political cosmopolitans. Some advocate a centralized world state, some favor a federal system with a comprehensive global body of limited coercive power, some would prefer international political institutions that are limited in scope and focus on particular concerns (e.g., war crimes, environmental preservation), and some defend a different alternative altogether. Prominent philosophical discussions of international political arrangements have recently clustered around the heirs of Kant (e.g., Habermas, Rawls, Beitz, and Pogge) and around advocates of ‘cosmopolitan democracy’ (e.g., Held) or ‘republican cosmopolitanism’ (Bohman 2001, Laborde 2010, Pettit 2010, 2016)[^bohman-2001][^laborde-2010][^pettit-2010].
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      A number of theorists have objected to the focus, in much of the debate over political cosmopolitanism, on the role of states. In their view, a genuinely cosmopolitan theory should address the needs and interests of human individuals directly – as world citizens – instead of indirectly, as state citizens, that is via their membership in particular states. What is needed instead is a theory that focuses not merely on the moral duties of individuals or on the political relations among states, but on the justice of social institutions world-wide and the measures required to attain it. This ‘cosmopolitan’ position in the debate over *global distributive justice*, is especially critical of what they see as John Rawls’ privileging of the interests of states over those of individuals, in his *Theory of Justice* as well as in his subsequent *Law of Peoples*. In order to establish principles of global justice, Rawls should have applied his famous thought experiment of the ‘original position’ at the global level of all human individuals, they charge, instead of arguing, as Rawls does, for a second original position, one that involves representatives of all ‘peoples’. The debate between Rawls and his cosmopolitan critics points to the issue of the proper role and status of states: are they indispensable instruments in the pursuit of justice (ideally embodying the principle of the democratic self-determination of peoples), or are they rather inimical to it, because they entrench state interests at the expense of individuals in need?
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Furthermore, there has been a good deal of debate over *cultural* cosmopolitanism, with disputes over multiculturalism in educational curricula and with resurgent nationalisms. The cosmopolitan position in these disputes rejects exclusive attachments to a particular culture. So on the one hand, the cosmopolitan encourages cultural diversity and appreciates a multicultural mélange, and on the other hand, the cosmopolitan rejects a strong nationalism. In staking out these claims, the cosmopolitan must be wary about very strong ‘rights to culture,’ respecting the rights of minority cultures while rebuffing the right to unconditional national self-determination. Hence, recent advocates of ‘liberal nationalism’ (e.g., Margalit and Raz, Tamir) or of the rights of minority cultures (e.g., Kymlicka) generally seem to be anti-cosmopolitan. But the cosmopolitan’s wariness towards very strong rights to culture and towards national self-determination need not be grounded in a wholesale skepticism about the importance of particular cultural attachments. Cosmopolitanism can acknowledge the importance of (at least some kinds of) cultural attachments for the good human life (at least within certain limits), while denying that this implies that a person’s cultural identity should be defined by any bounded or homogeneous subset of the cultural resources available in the world (e.g., Waldron).
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      *Economic* cosmopolitanism is perhaps less often defended among philosophers and more often among economists (e.g., Hayek, Friedman) and certain politicians, especially in the richer countries of this world. It is the view that one ought to cultivate a single global economic market with free trade and minimal political involvement. It tends to be criticized rather than advanced by philosophical cosmopolitans, as many of them regard it as at least a partial cause of the problem of vast international economic inequality. These debates about the desirability of a fully globalized market have intensified in recent years, as a result of the end of the Cold War and the increasing reach of the market economy.
