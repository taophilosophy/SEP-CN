      The word ‘cosmopolitan’, which derives from the Greek word *kosmopolitēs* (‘citizen of the world’), has been used to describe a wide variety of important views in moral and socio-political philosophy. The nebulous core shared by all cosmopolitan views is the idea that all human beings, regardless of their political affiliation, are (or can and should be) citizens in a single community. Different versions of cosmopolitanism envision this community in different ways, some focusing on political institutions, others on moral norms or relationships, and still others focusing on shared markets or forms of cultural expression. In most versions of cosmopolitanism, the universal community of world citizens functions as a positive ideal to be cultivated, but a few versions exist in which it serves primarily as a ground for denying the existence of special obligations to local forms of political organizations. Versions of cosmopolitanism also vary depending on the notion of citizenship they employ, including whether they use the notion of ‘world citizenship’ literally or metaphorically. The philosophical interest in cosmopolitanism lies in its challenge to commonly recognized attachments to fellow-citizens, the local state, parochially shared cultures, and the like.
    step1: |-
      「世界主义的」（cosmopolitan）一词源自希腊语 *kosmopolitēs*（「世界公民」），历来被用来描述道德哲学与社会政治哲学中形形色色的重要观点。所有这些世界主义观点共享的朦胧核心是这样一个观念：一切人，无论其政治归属如何，都是（或能够且应当是）单一共同体中的公民。不同版本的世界主义以不同方式构想这一共同体：有的聚焦于政治制度，有的聚焦于道德规范或关系，还有的聚焦于共同市场或文化表达形式。在多数版本的世界主义中，世界公民的普遍共同体作为有待培育的正面理想发挥作用；但也有少数版本中，它主要被用作否认对本地形式政治组织负有特殊义务的根据。世界主义诸版本还因其动用的公民身份概念而不同，包括它们是在字面还是隐喻意义上使用「世界公民身份」这一概念。世界主义在哲学上的趣味，在于它挑战了人们通常认可的种种依附——对同胞公民、对地方国家、对狭隘共享的文化等等。

    step2: |-
      「世界主义者」（cosmopolitan）一词出自希腊语 *kosmopolitēs*（「世界公民」），在道德哲学与社会政治哲学中历来指称形形色色的重要主张。诸种世界主义共享一个朦胧内核：一切人无论政治归属如何，皆为（或能够、且应当成为）单一共同体之公民。各版本对这种共同体的构想不同：或重政治制度，或重道德规范与关系，或重共享市场与文化表达。多数版本把世界公民的普遍共同体视为有待培育的正面理想；少数版本则主要用它来否认对本地政治组织负有特殊义务。诸版本的另一差异在于所取的公民身份概念，包括「世界公民身份」是照字面还是作隐喻解。世界主义的哲学意义，恰在于它挑战了人们习以为常的依附：对同胞、对地方国家、对褊狭共享的文化等等。
