    kind: body
    source: |-
      There are, however, serious and philosophically interesting challenges to cosmopolitanism itself, and they come in two main forms. The first calls into question the possibility of realizing the cosmopolitan ideal, while the second queries its desirability. We discuss these two challenges to the different forms of cosmopolitanism in turn.
