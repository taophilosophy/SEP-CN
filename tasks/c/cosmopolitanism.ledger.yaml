      Another common objection to cosmopolitanism associates it with imperialism, colonialism, and paternalism. Some cosmopolitans, despite taking themselves to be opposed to imperialism, colonialism, and paternalism, are charged with focusing too narrowly on the responsibilities (and perspectives) of the affluent while conceiving of those living in poverty mainly as the passive recipients of their “aid.” Such focus indeed shows little sensitivity to questions of epistemic justice and to the wide range of perspectives that merit being taken seriously (Flikschuh 2017)[^flikschuh-2017]. These charges are often *internal* to cosmopolitanism, however, as they do not so much call into question the cosmopolitan ideal itself as reject certain limited instantiations of it. Cosmopolitans can and do examine the entitlements of those living in poverty (Caney 2015) and argue in favor of poor-led social movements (Deveaux 2018)[^deveaux-2018] and alternative forms of cosmopolitanism “from below” (Bailey 2017)[^bailey-2017]. Others point to the relevance, for cosmopolitan theorizing, of poverty-driven labor migration and migrant activism as acts of world citizenship (Caraus and Paris 2018)[^caraus-2018].
    step1: |-
      对世界主义另一种常见的反对把它与帝国主义、殖民主义和家长制联系起来。一些世界主义者尽管自认为反对帝国主义、殖民主义和家长制，却被指责把注意力过窄地放在富人的责任（和视角）上，而把穷人主要设想为他们「援助」的被动接受者。这种关注确实表明对认知正义问题和值得认真对待的广泛视角缺乏敏感（Flikschuh 2017）[^flikschuh-2017]。不过，这些指责常常是世界主义*内部*的，因为它们与其说质疑世界主义理想本身，不如说是拒绝它的某些有限的实例。世界主义者能够并且确实在考察穷人的权利要求（Caney 2015），并为以穷人为先导的社会运动（Deveaux 2018）[^deveaux-2018]和「自下而上」的另类世界主义形式（Bailey 2017）[^bailey-2017]辩护。还有人指出，贫困驱动的劳动迁移和移民行动主义作为世界公民的行为，与世界主义理论建构相关（Caraus and Paris 2018）[^caraus-2018]。
