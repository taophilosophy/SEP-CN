      此外，围绕*文化*世界主义也有不少辩论：教育课程里的多元文化主义引起争论，民族主义也重新抬头。在这些争论中，世界主义立场拒绝排他性地依附于某个特定文化。所以一方面，世界主义者鼓励文化多样性，欣赏多元文化的混合；另一方面，世界主义者反对强民族主义。在亮明这些主张时，世界主义者必须当心过强的「文化权利」：尊重少数文化的权利，同时拒绝无条件的民族自决权。因此，近来「自由民族主义」的倡导者，如玛格利特（Avishai Margalit）与拉兹（Joseph Raz）、塔米尔（Yael Tamir），以及少数文化权利的倡导者金里卡（Will Kymlicka），一般说来似乎都是反世界主义的。但世界主义者对过强文化权利和民族自决的警惕，不必来自对特定文化依附之重要性的整体怀疑。世界主义可以承认（至少某些种类的）文化依附对好的人类生活（至少在一定限度内）的重要性，同时否认这意味着一个人的文化身份应当由世界上现有文化资源中任何一个有边界的、同质的子集来规定，沃尔德伦（Jeremy Waldron）就持这种看法。
