      也可以说，苏格拉底对这种把人本身作为认同对象、更具世界主义意味的取向是敏感的。至少在柏拉图的刻画中，苏格拉底尽其所能避开传统的政治参与，转而从事一种非凡的事业：考察自己与他人；他坚持说，这些考察既是真正政治性的（《高尔吉亚》521d6–8），又面向所有人——雅典人与外邦人一视同仁（《申辩》23b4–6、30a3–7；参《欧绪弗洛》3d5–9）。当然，苏格拉底选择不广泛游历；但这一决定很可能与世界主义理想并不冲突，因为他或许认为，服务于人类总体而言的最佳办法就是留在国内——讽刺的是，这恰恰因为雅典有优越的言论自由（《高尔吉亚》461e1–3；参《申辩》37c5–e2、《美诺》80b4–7）。无论苏格拉底是否以这种方式自觉地做个世界主义者，毫无疑问，他的思想加速了世界主义的发展，而且他在后世古代被奉为世界公民。
