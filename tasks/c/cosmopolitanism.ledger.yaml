      Enlightenment cosmopolitanism continued to be a source of debate in the subsequent two centuries. First, in the nineteenth century, economic globalization provoked fierce reactions. Marx and Engels tag cosmopolitanism as an ideological reflection of capitalism. They regard market capitalism as inherently expansive, breaking the bounds of the nation-state system, as evidenced by the fact that production and consumption had become attuned to faraway lands. In their hands, the word ‘cosmopolitan’ is tied to the effects of capitalist globalization, including especially the bourgeois ideology which legitimizes ‘free’ trade in terms of the freedom of individuals and mutual benefit, although this very capitalist order is the cause of the misery of millions, indeed the cause of the very existence of the proletariat. At the same time, however, Marx and Engels also hold that the proletariat in every country shares essential features and has common interests, and the Communist movement aims to convince proletarians everywhere of these common interests. Most famously, the *Communist Manifesto* ends with the call, “Proletarians of all countries, unite!” This, combined with the ideal of the class-less society and the expected withering away of the states after the revolution, implies a form of cosmopolitanism of its own.
    step1: |-
      启蒙世界主义在此后两个世纪里继续是争论的来源。首先，在十九世纪，经济全球化引发了激烈的反应。马克思和恩格斯把世界主义标为资本主义的意识形态反映。他们认为市场资本主义本质上是扩张性的，会打破民族国家体系的界限，其证据就是生产和消费已经适应了遥远的国度。在他们手里，「世界主义的」一词与资本主义全球化的后果绑在一起，尤其包括那种以个人自由和互利为「自由」贸易辩护的资产阶级意识形态，尽管正是这种资本主义秩序造成了千百万人的苦难，甚至造成了无产阶级本身的存在。然而与此同时，马克思和恩格斯也认为，每个国家的无产阶级都具有本质特征并拥有共同利益，而共产主义运动旨在让各地的无产者相信这些共同利益。最著名的是，《共产党宣言》以这样的号召结尾：「全世界无产者，联合起来！」这一点，加上无阶级社会的理想以及革命后国家将消亡的预期，蕴含着一种它自己的世界主义形式。
