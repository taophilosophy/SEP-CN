      Things are a bit different for at least some of the Stoics at Rome. On the one hand, the cosmopolis becomes less demanding. Whereas Chrysippus limits citizenship in the cosmos to those who in fact live in agreement with the cosmos and its law, Roman Stoics extend citizenship to all human beings by virtue of their rationality. On the other hand, local citizenship becomes more demanding. There is no doubt that the Stoicism of Cicero’s *De Officiis* or of Seneca’s varied corpus explicitly acknowledges obligations to Rome in addition to obligations to the cosmos. This is a moderate Stoic cosmopolitanism, and empire made the doctrine very easy for many Romans by identifying the Roman *patria* with the cosmopolis itself. But neither imperialism nor a literal interpretation of world citizenship is required for the philosophical point. The maximally committed cosmopolitan looks around to determine whom he can best help and how, knowing full well that he cannot help all people in just the same way, and his decision to help some people far more than others is justified by cosmopolitan lights if it is the best he can do to help human beings as such.
