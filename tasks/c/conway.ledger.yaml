    source: |-
      Lady Anne Conway (nee Anne Finch) was one of a tiny minority of seventeenth-century women who was able to pursue an interest in philosophy. She was associated with the Cambridge Platonists, particularly Henry More (1614–1687). Her only surviving treatise, *Principia philosophiae antiquissimae ac recentissimae (The Principles of the Most Ancient and Modern Philosophy)*, was published posthumously and anonymously in 1690. This propounds a vitalist ontology of spirit, derived from the attributes of God, which she sets out in opposition to More, Descartes, Hobbes and Spinoza. Her philosophy was received favorably by Leibniz.
    step1: |-
      安妮·康威夫人（娘家姓芬奇）是十七世纪极少数能够追求哲学兴趣的女性之一。她与剑桥柏拉图主义者有联系，尤其是亨利·莫尔（Henry More，1614–1687）。她唯一留存的论著《最古老与现代哲学的原理》（*Principia philosophiae antiquissimae ac recentissimae* (The Principles of the Most Ancient and Modern Philosophy)），于 1690 年在她身后匿名出版。该书提出一种源于上帝属性的精神活力论本体论，她是作为莫尔、笛卡尔、霍布斯和斯宾诺莎的对立面而提出这一点的。她的哲学受到莱布尼茨的青睐。
    step2: |-
      安妮·康威夫人（娘家姓芬奇）是十七世纪极少数得以追求哲学志趣的女性之一。她与剑桥柏拉图主义群体交往密切，尤其与亨利·莫尔（Henry More，1614–1687）相善。她唯一留存的论著《最古老与现代哲学的原理》（*Principia philosophiae antiquissimae ac recentissimae* (The Principles of the Most Ancient and Modern Philosophy)）于 1690 年在她身后匿名出版。此书提出一种源自上帝属性的精神活力论本体论，她是作为莫尔、笛卡尔、霍布斯与斯宾诺莎的对立面而提出这一学说的。她的哲学得到莱布尼茨的好评。
