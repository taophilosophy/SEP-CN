      1651 年，安妮·康威嫁给爱德华（Edward），即第三代康威子爵，他是沃里克郡与爱尔兰安特里姆郡两地产业的继承人。他们唯一的儿子赫尼奇（Heneage）在襁褓中夭折。康威家族拥有当时最精良的私人藏书楼之一，她的丈夫似乎也鼓励妻子的智识兴趣。然而，她从少女时代起就饱受周期性疾患之苦，随着年龄渐长，病情愈发沉重、愈发频繁。正是为了寻求病痛的解脱，她得以结识佛兰德医师兼哲学家弗朗西斯·默库里·范·海尔蒙特（Francis Mercury van Helmont），他是化学医学家扬·巴普蒂斯特·范·海尔蒙特（Jan Baptiste van Helmont）之子。在她生命中的最后十年，小范·海尔蒙特一直住在她家中。正是经由范·海尔蒙特，安妮·康威得以接触到卡巴拉思想与贵格会。这些际遇为她开启了根本性的新方向：一方面，她对犹太卡巴拉的研究促成了她与自身哲学教育所浸染的笛卡尔主义彻底决裂；另一方面，她与范·海尔蒙特的贵格会朋友的交往，使她在 1679 年去世前不久皈依了贵格会。
