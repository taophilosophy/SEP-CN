    source: |-
      Anne Conway is known to be the author of a single treatise of philosophy. This was written at the end of her life and published anonymously in Amsterdam in 1690 in a Latin translation with the title, *Principia philosophiae antiquissimae et recentissimae*. It was translated back into English and printed in London in 1692 as *The Principles of the Most Ancient and Modern Philosophy*. The other source for her philosophical activities is her correspondence with Henry More.
    step1: |-
      安妮·康威据知是一部哲学论著的唯一作者。此书写于她生命晚期，于 1690 年在阿姆斯特丹匿名出版，以拉丁文译本行世，题为《最古老与现代哲学的原理》（*Principia philosophiae antiquissimae et recentissimae*）。它被译回英文，于 1692 年在伦敦印行，题作《最古老与现代哲学的原理》（*The Principles of the Most Ancient and Modern Philosophy*）。她哲学活动的另一来源是她与亨利·莫尔的通信。
    step2: |-
      据我们所知，安妮·康威只写过一部哲学论著。此书撰写于她生命的晚期，于 1690 年在阿姆斯特丹以拉丁文译本匿名出版，书名为《最古老与现代哲学的原理》（*Principia philosophiae antiquissimae et recentissimae*）。后来它被译回英文，于 1692 年在伦敦印行，题作《最古老与现代哲学的原理》（*The Principles of the Most Ancient and Modern Philosophy*）。她哲学活动的另一项材料来源，是她与亨利·莫尔的通信。
  - id: 5
    source: |-
      Anne Conway’s treatise is a work of Platonist (Neoplatonist) metaphysics in which she derives her system of philosophy from the existence and attributes of God. The title of her treatise presents her system as an answer to the dominant philosophies of her time. Several chapters are devoted to a refutation of the dualism of Henry More and Descartes. (She does, however, express her admiration for Descartes’ physics). She also takes issue with Hobbes and Spinoza, whom she charges with material pantheism, which confounds God and created substance. Her concept of substance probably owes much to Platonism and Kabbalism (which, in the version she encountered was heavily Platonised). Her thinking also shows the impact of the teachings of the heterodox Christian theologian, Origen, who was much admired by her teacher, Henry More. In many respects, her system anticipates the philosophy of Gottfried Wilhelm Leibniz, who recognized affinities with his own philosophy.
    step1: |-
      安妮·康威的论著是一部柏拉图主义（新柏拉图主义）形而上学的著作，其中她从上帝的存在与属性推导出她的哲学体系。这部论著的标题把她呈现为对当时主流哲学的一种回答。好几章专门用来反驳亨利·莫尔与笛卡尔的二元论。（不过，她确实对笛卡尔的物理学表示钦佩。）她也与霍布斯和斯宾诺莎论争，她指控他们主张物质泛神论，这种理论混淆了上帝与受造实体。她的实体概念很可能在很大程度上得益于柏拉图主义与卡巴拉主义（她所接触到的那个版本已高度柏拉图化）。她的思想也显示出异端基督教神学家奥利金（Origen）的教导的影响，奥利金深受她的老师亨利·莫尔推崇。在许多方面，她的体系预示了戈特弗里德·威廉·莱布尼茨（Gottfried Wilhelm Leibniz）的哲学，后者承认自己的哲学与她有亲缘关系。
    step2: |-
      安妮·康威的论著是一部柏拉图主义（新柏拉图主义）的形而上学著作，其中她从上帝的存在与属性中推导出她的哲学体系。这部论著的标题把她呈现为对当时主流哲学的一种回答。书中好几章专事反驳亨利·莫尔与笛卡尔的二元论。（不过，她确实对笛卡尔的物理学表示赞赏。）她也与霍布斯和斯宾诺莎相争锋，她指责二人主张物质泛神论，这种理论混淆了上帝与受造实体。她的实体概念很可能在很大程度上得益于柏拉图主义与卡巴拉主义（她所接触到的那个版本已高度柏拉图化）。她的思想还显示出异端基督教神学家奥利金（Origen）之教导的影响，奥利金深受她的老师亨利·莫尔推崇。在许多方面，她的体系都预示了戈特弗里德·威廉·莱布尼茨（Gottfried Wilhelm Leibniz）的哲学，后者承认自己的哲学与她颇有相通之处。
  - id: 6
    source: |-
      The framework of Conway’s system is a tripartite ontological hierarchy of “species”, the highest of which is God, the source of all being. Christ, or “Middle Nature”, links God and the third species, called “Creature”. God as the most perfect being is infinitely good, wise, and just communicates key attributes in a continuous process of emanative creation. Created substance, like God, consists of spirit. Since God is good and just, his creation too is good and just. All created substance is living, capable of motion and perception. Anne Conway denies the existence of material body as such, arguing that inert corporeal substance would contradict the nature of God, who is life itself. All created substance is, however, differentiated from the divine, principally by mutability and multiplicity, and, unlike God, is constituted of infinite multiples of spirit particles. As unities in multiplicity, these may be described as monadic (though not in a Leibnizian sense). The infinite number and constant mutability of created things may be seen as an obverse reflection of the unity, infinity, eternity and unchangeableness of God. The continuity between God and creatures is made possible through “Middle Nature”, an intermediary being, through which God communicates life, action, goodness and justice. “Middle Nature”, partakes of the nature of both God and creation, and is therefore both a bridge and a buffer between God and created things. Thus, although she conceives of created substance as a continuum, and understands mutability as capacity for increased perfection, she sought to avoid the charge of pantheism. The spiritual perfectionism of Anne Conway’s system has a dual aspect: metaphysical and moral. On the one hand all things are capable of becoming more spirit-like, that is, more refined *qua* substance. At the same time, all things are capable of increased goodness. She explains evil as a falling away from the perfection of God, and understands suffering as part of a longer term process of spiritual recovery. She denies the eternity of hell, since for God to punish finite wrong-doing with infinite and eternal hell punishment would be manifestly unjust and therefore a contradiction of the divine nature. Instead she explains pain and suffering as purgative, with the ultimate aim of restoring creatures to moral and metaphysical perfection. Anne Conway’s system is thus not just an ontology and but a theodicy.
    step1: |-
      康威体系的框架是一个三元本体论层级，其最高者是上帝，即一切存在的根源。基督，即“中间自然”，连接上帝与被称为“受造物”的第三元。上帝作为最完善的存在者，是无限善、无限智慧、无限公义的，他在一个连续的流溢式创造过程中传达关键属性。受造实体像上帝一样，由精神构成。既然上帝是善且公义的，他的创造物也是善且公义的。一切受造实体都是有生命的，能够运动与知觉。安妮·康威否认物质性形体本身的存在，她论证说，惰性的有形实体将违背上帝的本性，而上帝就是生命本身。然而，一切受造实体都与神圣者相区别，主要通过可变性与多重性，而且，与上帝不同，受造实体由无限多的精神微粒构成。作为多重性中的统一体，这些可以被描述为单子式的（尽管不是莱布尼茨意义上的）。受造物的无限数量与恒常可变性，可以被视为上帝的统一性、无限性、永恒性与不变性的反向反映。上帝与受造物之间的连续性，通过“中间自然”——一个居间存在者——而成为可能，上帝藉之传达生命、活动、善与公义。“中间自然”兼有上帝与创造物两者的本性，因此既是上帝与受造物之间的桥梁，也是缓冲。这样，尽管她把受造实体设想为一个连续体，并把可变性理解为增进完善的能力，她还是力图避免泛神论的指控。安妮·康威体系的精神至善论具有双重面相：形而上学的与道德的。一方面，一切事物都有能力变得更加精神化，即作为实体而言更加精微。同时，一切事物都有能力增进善。她把恶解释为对上帝之完善的偏离，并把受苦理解为精神康复这一更长远过程的一部分。她否认地狱的永恒性，因为上帝若以无限而永恒的地狱惩罚来惩罚有限的恶行，将明显不公，因而违背神圣本性。相反，她把痛苦与受苦解释为净化性的，其最终目标是使受造物恢复到道德与形而上学的完善。安妮·康威的体系因而不只是本体论，而且是神义论。
