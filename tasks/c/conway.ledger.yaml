      The mutable state of creatures raises the question of how far a creature can change and still be the same individual thing? Conway’s answer is that outwardly every creature may change radically, though not to such an extent that it exceeds the ontological boundaries of the third species/created nature (e.g., by acquiring the attributes of a higher species, God or Christ, or losing the attribute of life). Creaturely change occurs across successive life-times, rather than in the course of a single life span. The identity of a creature is not co-terminous with its natural life span, but persists throughout its existence in time. Thus a horse (to use the example she gives) may transform into a human being through incremental changes across successive life spans. But its identity as a living being persists through these changes. Conway explains the continuous identity of an individual creature from one state to another and across time, partly through her conception of the composition of living creatures, which are structured as organized orderly composites, the unity of which is sustained by a dominant spirit:
