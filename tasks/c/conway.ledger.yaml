      As a female philosopher of the seventeenth century, Anne Conway is unusual by virtue of the fact that her philosophy achieved publication. It is known that it was well-received by Leibniz (who in fact owned a copy of her treatise—probably a gift to him by their mutual friend, Van Helmont). But the commendations of Leibniz notwithstanding, the anonymity of Conway’s work has ensured that she suffered the same neglect that has been the lot of most pre-modern female philosophers. However, this situation changed in the late twentieth century with the growth of interest in women philosophers. After the publication of a modern edition (by Loptson, Conway1998) and new translation (by Corse and Coudert, Conway 1996)[^conway-1996], together with a revised edition of her correspondence (*The Conway Letters* 1992), Conway’s philosophical fortunes transformed dramatically. With some exceptions (Broad 2003, Hutton 2004, Head 2020)[^broad-2003][^head-2020][^hutton-2004], the growing body of studies on her philosophy focus largely on its relationship to canonical philosophers. It is perhaps reflective of the dominance of the teaching canon, that her Platonism (Neoplatonism) remains relatively neglected (but see Hutton 2018 and 2022, Mercer 2012 and 2019 , and Branscum 2023)[^branscum-2023][^hutton-2018][^mercer-2019]. For an overview of approaches to her philosophy see Rodriguez 2024.
    step1: |-
      作为十七世纪的一位女性哲学家，安妮·康威因其哲学得以出版而显得不同寻常。据知，她的哲学受到莱布尼茨的好评（他实际上拥有一部她的论著——很可能是他们的共同朋友范·海尔蒙特赠予他的）。但是，尽管有莱布尼茨的赞许，康威著作的匿名性还是确保了她遭受了大多数前现代女性哲学家所遭遇的同样的忽视。然而，这种情况在二十世纪后期随着对女性哲学家的兴趣增长而改变了。在现代版本（Loptson，Conway 1998）与新译本（Corse 与 Coudert，Conway 1996）[^conway-1996]，以及她书信集的修订版（《康威书信集》1992）出版之后，康威的哲学命运急剧转变。除少数例外（Broad 2003、Hutton 2004、Head 2020）[^broad-2003][^head-2020][^hutton-2004]，关于她哲学的日益增长的研究在很大程度上集中在其与经典哲学家的关系上。也许反映了教学经典的主导地位，她的柏拉图主义（新柏拉图主义）仍然相对被忽视（但见 Hutton 2018 与 2022、Mercer 2012 与 2019，以及 Branscum 2023）[^branscum-2023][^hutton-2018][^mercer-2019]。关于研究她哲学的各种进路的概述，见 Rodriguez 2024。
    step2: |-
      作为十七世纪的一位女性哲学家，安妮·康威因其哲学得以出版而显得不同寻常。据知，她的哲学深受莱布尼茨好评（他实际上拥有一部她的论著——很可能是他们的共同朋友范·海尔蒙特所赠）。但是，尽管有莱布尼茨的赞许，康威著作的匿名性仍使她被大多数前现代女性哲学家所遭遇的那种忽视所笼罩。然而，这种情况在二十世纪后期随着人们对女性哲学家的兴趣日增而改变。在现代版本（Loptson，Conway 1998）与新译本（Corse 与 Coudert，Conway 1996）[^conway-1996]，连同她书信集的修订版（《康威书信集》1992）出版之后，康威的哲学命运发生了戏剧性的转变。除少数例外（Broad 2003、Hutton 2004、Head 2020）[^broad-2003][^head-2020][^hutton-2004]，关于她哲学的日益增多的研究，在很大程度上聚焦于其与经典哲学家的关系。也许正反映了教学经典的主导地位，她的柏拉图主义（新柏拉图主义）仍然相对被忽视（但见 Hutton 2018 与 2022、Mercer 2012 与 2019，以及 Branscum 2023）[^branscum-2023][^hutton-2018][^mercer-2019]。关于研究她哲学之各种进路的概述，见 Rodriguez 2024。
