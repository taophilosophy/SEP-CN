      康威体系的骨架是一个三元本体论层级，居于其顶点的就是上帝，即一切存在的本原。基督，即“中间自然”，连接上帝与被称为“受造物”的第三元。上帝作为最完善的存在者，是无限善、无限智、无限公义的，他在一个连续的流溢式创造过程中传达关键属性。受造实体与上帝一样，由精神构成。既然上帝是善而公义的，他的创造物也善而公义。一切受造实体皆有生命，能够运动与知觉。安妮·康威否认物质性形体本身的存在，她论证说，惰性的有形实体将抵触上帝的本性，而上帝即生命本身。然而，一切受造实体都与神圣者相区别，主要在于可变性与多重性；而且，与上帝不同，受造实体由无限多的精神微粒构成。作为多重性中的统一体，这些微粒可以被描述为单子式的（尽管不是莱布尼茨意义上的）。受造物的无限数目与恒常可变性，可以看作上帝之统一性、无限性、永恒性与不变性的对应反映。上帝与受造物之间的连续性，系由“中间自然”——一个居间存在者——所促成，上帝藉之传达生命、活动、善与公义。“中间自然”兼具上帝与创造物二者的本性，因此既是上帝与受造物之间的桥梁，也是缓冲。这样，尽管她把受造实体设想为一个连续体，并把可变性理解为增进完善的能力，她还是力图回避泛神论的责难。安妮·康威体系的精神至善论具有双重面相：形而上的与道德的。一方面，一切事物都有能力变得更加精神化，即作为实体而言更加精微；同时，一切事物都有能力增进善。她把恶解释为对上帝之完善的偏离，并把受苦理解为精神康复这一更为长远的过程的一部分。她否认地狱的永恒性，因为上帝若以无限而永恒的地狱惩罚去惩罚有限的恶行，将显然不公，从而与神圣本性相矛盾。反之，她把痛苦与受苦解释为具有净化作用，其终极目标在于使受造物复归于道德与形而上学的完善。安妮·康威的体系因而不只是本体论，更是神义论。
  - id: 7
    source: |-
      Strictly speaking, Conway’s metaphysics is an ontology of three kinds of being, which she calls “species”. Each of these is a single substance distinguished by a particular set of properties which determine its essence, and set its ontological boundaries. Conway holds that there can only be three species, and one species cannot transform into another. The species are nevertheless inter-connected through their shared properties (principally the “communicable” attributes of God), and differentiated by others (principally mutability which is a property of the second and third species). The second species (Christ or Middle Nature) is differentiated from both God and other created things because it also retains God’s immutability. As a causal intermediary between God and Created Nature, Middle Nature is analogous to Cudworth’s Plastic Nature and More’s Spirit of Nature, but a divinized version.
    step1: |-
