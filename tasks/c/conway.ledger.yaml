      However, the mutability of the creatures’ condition means that they may change for the worse. There is no inevitability about this, since moral corruption in creatures results from either a deliberate act of will or indifference of will (a failure to pursue the good) (Lascano 2018)[^lascano-2018]. The moral degeneration of the creature is mitigated by the fact that no creature can become so corrupt as to lose its God-given goodness entirely. (A creature utterly lacking in goodness would be so unlike God that it could not exist). The residual goodness of the creature holds out the possibility of recovery from its degenerate state. To understand how this comes about, let us recall, first, that the change in creatures is physical as well as moral, such that as a creature degenerates, it becomes more corporeal (“hardened”). Furthermore, just as a creature can never become utterly evil, so it can never be reduced to mere corporeality, because that would be a lifeless condition, so unlike to God as not to exist.
    step1: |-
      然而，受造物状况的可变性意味着它们可能变坏。这一点并无必然性，因为受造物的道德败坏源于意志的蓄意行为或意志的漠然（未能追求善）（Lascano 2018）[^lascano-2018]。受造物的道德退化因这样一个事实而得到缓解：没有一个受造物会变得如此败坏，以至于完全丧失上帝所赐的善。（一个完全缺乏善的受造物会与上帝如此不相像，以至于不能存在。）受造物残余的善使它有可能从其退化状态中恢复。为了理解这是如何发生的，让我们首先回想，受造物的变化既是物理的也是道德的，因此，随着一个受造物退化，它会变得更具形体性（“硬化”）。再者，正如一个受造物永远不会变得彻底邪恶，它也永远不会被还原为纯粹的形体性，因为那将是一种无生命的状态，与上帝如此不相像，以至于不能存在。
    step2: |-
      然而，受造物状况的可变性意味着它们可能向坏处变化。这一点并非不可避免，因为受造物的道德败坏要么源于意志的蓄意行为，要么源于意志的漠然（即未能追求善）（Lascano 2018）[^lascano-2018]。受造物的道德退化由于这样一个事实而得到缓和：没有一个受造物会变得如此腐败，以至于完全丧失上帝所赐的善。（一个彻底缺乏善的受造物会与上帝如此不相像，以至于无法存在。）受造物所余的善，使它有可能从其退化状态中恢复。为了理解这一过程如何发生，让我们首先回想：受造物的变化既是物理的，也是道德的，因此，随着一个受造物退化，它会变得更加具形体性（“硬化”）。再者，正如一个受造物永远不会变得彻底邪恶，它也永远不会被还原为纯粹的形体性，因为那将是一种无生命的状态，与上帝如此不相像，以至于不能存在。
