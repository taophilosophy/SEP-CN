      The second factor in the regenerative process is punishment for sin: here pain has a crucial role. Conway holds that the disequilibrium between corporeality and spirit, whereby it becomes more corporeal, is a painful condition. The pain so experienced is punishment for the sin which brought it to this condition (in that respect sin is its own punishment). But Conway holds, further, that the purpose of punishment is not merely retributive; pain has a purgative effect on the degenerate creature, leading to its release from its overly corporeal, inactive condition, and enabling it to reset itself on a trajectory of recovery of its original godlikeness. In this process its constitutional composition becomes increasingly refined (spirit-like) in tandem with its increase in goodness. The trajectories of degeneration, on the one hand, and amelioration echo Plato’s account of immortality of the soul in the *Phaedo* 80d–84b. In Conway’s version, pain and suffering are beneficial because they have a restorative function, thereby playing a crucial role in sustaining the over-all dynamic towards perfectibility in her metaphysical system. In this way Conway vindicates the justice of God. Conway’s system is thus a theodicy, which explains pain and suffering as a transient conditions, contributory to the amelioration and recovery of creatures. The consequences in terms of religious belief are that Conway denies the eternity of hell punishment and upholds the doctrine the universal salvation or *apocotastasis*.
    step1: |-
      再生过程的第二个因素是罪的惩罚：这里痛苦起着关键作用。康威主张，形体性与精神之间的失衡，即它变得更具形体性，是一种痛苦的状况。所经受的痛苦是对导致它陷入这种状况的罪的惩罚（就此而言，罪本身就是它自己的惩罚）。但康威进一步主张，惩罚的目的不仅仅是报应性的；痛苦对退化中的受造物有一种净化作用，使之摆脱其过分形体化、不活动的状况，并使之能够重新走上恢复其原初神似的轨迹。在这一过程中，其构造性的构成变得越来越精微（精神化），与其增进之善同步。退化与改善的轨迹，呼应了柏拉图在《斐多篇》80d–84b 中对灵魂不朽的论述。在康威的版本中，痛苦与受苦是有益的，因为它们具有恢复功能，从而在她的形而上学体系中维持走向可完善性的总体动力方面起着关键作用。这样，康威就维护了上帝的公义。康威的体系因此是一种神义论，它把痛苦与受苦解释为一种暂时的状况，有助于受造物的改善与恢复。就宗教信仰而言，其结果是：康威否认地狱惩罚的永恒性，并支持普世救赎或*apocotastasis*（万有复原）的教义。
