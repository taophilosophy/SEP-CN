      One of the most important debates at Oxford around 1320–30 concerned the proper object of scientific knowledge. When we know something scientifically, is our knowledge about external things (the earth interposed between the sun and the moon), propositions (‘The moon is eclipsed’), or some other more complex state of affairs? Crathorn is believed to have participated in the development of the idea that the proper object of science is neither the external thing nor the proposition (as Ockham and Holkot had argued), but the ‘total significate’ of that proposition (Tachau 1987)[^tachau-1987]. Typically, the total significate would include not only external things but also the premises and other assumptions that generate our assent to the proposition as the conclusion of a piece of demonstrative reasoning.
    step1: |-
      约 1320–30 年间，牛津最重大的争论之一涉及科学知识的恰当对象。当我们科学地认识某物时，我们的知识是关于外部事物（介于太阳与月亮之间的地球）、命题（“月亮被蚀”），还是某种其他更复杂的状况？克雷索恩被认为参与了如下观念的发展：科学的恰当对象既不是外部事物，也不是命题（正如奥卡姆与霍尔柯特所主张的），而是该命题的“总意谓”（*total significate*）（Tachau 1987）[^tachau-1987]。典型地，总意谓不仅包括外部事物，还包括那些使我们赞同该命题、视之为某段证明性推理之结论的前提与其他假设。
