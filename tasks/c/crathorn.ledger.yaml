      Crathorn is less well known than other fourteenth-century atomists such as the Oxford thinkers Henry of Harclay (d. 1317) and Walter Chatton (c. 1285–1344), or the Parisians Gerard of Odo (1290–1349), Nicolas Bonet (d. 1343), and Nicolas of Autrecourt (1299–1369) (Murdoch 1974, 1982; Grellard and Robert 2009)[^grellard-2009][^murdoch-1974], yet we find several questions on the divisibility of the continuum in his *Sentences* commentary (particularly I *Sent*., q. 3, but also qq. 4 and 14–16). He affirms that a continuum is divisible into a finite number of atoms that are not mathematical points but its real, physical parts (I *Sent*., q. 3; for discussion, see Wood 1988, Robert 2009a)[^robert-2009a][^wood-1988]. Atoms are thus real singular entities with discrete magnitude or quantity and a proper nature. For example, he says that there are atoms of gold and atoms of lead, and that these are different kinds of things (I *Sent*., q. 14). Crathorn’s atomism is far from that of Democritus.
    step1: |-
      克雷索恩不如其他十四世纪原子论者那样为人所知，如牛津思想家亨利·哈克莱（Henry of Harclay，卒于 1317 年）与沃尔特·查顿（Walter Chatton，约 1285–1344），或巴黎人热拉尔·奥多（Gerard of Odo，1290–1349）、尼古拉·博内（Nicolas Bonet，卒于 1343 年）与奥特雷库尔的尼古拉（Nicolas of Autrecourt，1299–1369）（Murdoch 1974, 1982; Grellard and Robert 2009）[^grellard-2009][^murdoch-1974]，然而我们在他的《箴言四书评注》（*Commentary on the Sentences*）中发现几个关于连续体可分性的论题（尤其是 I *Sent.*, q. 3，但也有 qq. 4 与 14–16）。他断言，连续体可以被分割为有限数目的原子，这些原子不是数学点，而是其真实的、物理的部分（I *Sent.*, q. 3; for discussion, see Wood 1988, Robert 2009a）[^robert-2009a][^wood-1988]。因此，原子是具有离散的量或数量以及特定本性的真实个别实体。例如，他说有金的原子和铅的原子，而它们是不同种类的事物（I *Sent.*, q. 14）。克雷索恩的原子论与德谟克利特（Democritus）的大相径庭。
    step2: |-
      与其他十四世纪原子论者相比，克雷索恩不那么知名，这些原子论者包括牛津思想家亨利·哈克莱（Henry of Harclay，卒于 1317 年）与沃尔特·查顿（Walter Chatton，约 1285–1344），以及巴黎人热拉尔·奥多（Gerard of Odo，1290–1349）、尼古拉·博内（Nicolas Bonet，卒于 1343 年）与奥特雷库尔的尼古拉（Nicolas of Autrecourt，1299–1369）（Murdoch 1974, 1982; Grellard and Robert 2009）[^grellard-2009][^murdoch-1974]。然而，在他的《箴言四书评注》（*Commentary on the Sentences*）中，我们发现若干关于连续体可分性的论题（尤其是 I *Sent.*, q. 3，亦有 qq. 4 与 14–16）。他断言：连续体可分割为有限数目的原子，这些原子不是数学点，而是它真实而物理的部分（I *Sent.*, q. 3; for discussion, see Wood 1988, Robert 2009a）[^robert-2009a][^wood-1988]。因此，原子是具有离散的量或数量与特定本性的真实个别实体。例如，他说存在金的原子与铅的原子，且它们是不同种类的事物（I *Sent.*, q. 14）。克雷索恩的原子论与德谟克利特（Democritus）的相去甚远。
