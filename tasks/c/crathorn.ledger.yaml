      Very little is known about Crathorn’s life. He might have been born in the village of Crathorne in north Yorkshire. He became a Dominican friar before going to Oxford, where he lectured on the first book of Peter the Lombard’s *Sentences* in the years 1330–32, a work we can date because of a passage in which Crathorn mentions an eclipse that we know occurred on July 16, 1330. His Dominican contemporary, Robert Holkot, also tells us that that he lectured at the same time (1331–33) as a Dominican named Crathorn (Courtenay 1978; Schepers 1970 and 1972)[^courtenay-1978][^schepers-1970][^schepers-1972]
    step1: |-
      关于克雷索恩的生平，我们所知甚少。他可能出生于北约克郡的克雷索恩村（Crathorne）。他在前往牛津之前成为多明我会修士，并在 1330–32 年间讲授彼得·伦巴德（Peter Lombard）《箴言四书》（*Sentences*）第一卷，这部著作之所以能确定年代，是因为其中一段话提到一次我们知道发生于 1330 年 7 月 16 日的日食。他的多明我会同时代人罗伯特·霍尔柯特也告诉我们，他在同一时间（1331–33）作为一位名叫克雷索恩的多明我会士进行讲授（Courtenay 1978; Schepers 1970 and 1972）[^courtenay-1978][^schepers-1970][^schepers-1972]
    step2: |-
      关于克雷索恩的生平，我们几乎一无所知。他可能生于北约克郡的克雷索恩村（Crathorne）。他在前往牛津之前已成为多明我会修士，并于 1330–32 年间讲授彼得·伦巴德（Peter Lombard）《箴言四书》（*Sentences*）第一卷。这部著作能够确定年代，是因为其中一段话提到一次日食，而我们知道该次日食发生于 1330 年 7 月 16 日。他的多明我会同时代人罗伯特·霍尔柯特也告诉我们，一位名叫克雷索恩的多明我会士在同一时期（1331–33）进行讲授（Courtenay 1978; Schepers 1970 and 1972）[^courtenay-1978][^schepers-1970][^schepers-1972]
