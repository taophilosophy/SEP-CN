      The problem of knowledge is at the very heart of Crathorn’s thought. Going back to Roger Bacon, he held that the only way the human mind is able to know the external world is through *species* that resemble it (I *Sent.* q. 1, concl. 4). Bacon’s theory of the multiplication of species (*multiplicatio specierum*) was developed to explain causality using the model of optics. A thing *c* has an effect on another thing *e* through the multiplication of species *s* from *c* towards *e*, just as light is multiplied through the air when it illuminates an object. According to Bacon, the species *s* is a representative of *c* but with a lesser mode of being. Thus, the species is multiplied through the medium of air again and again until it arrives at *e*. The causal power of *c* is in this way conserved through the medium until it acts on *e*. The species is therefore both the cause (i.e., the same thing as the cause but with a diminished mode of being) and a likeness of that cause. Applying Bacon’s theory to epistemology, Crathorn asserts that we have no direct access to things in the external world and that we immediately perceive only their mental likenesses or representations, i.e., their species. These mental entities, whether we call them ‘species“ or ‘concepts” (the terms are equivalent for Crathorn), have the same nature as the things they resemble (*ibid.* concl. 8). Contrary to Bacon, the Dominican considers that the species has the same mode of being — i.e., material being — outside and inside the mind. As a consequence, all the species we have in the mind belong to the category of quality, for no real substance or quantity can exist materially in the human soul. Since concepts can only belong to the category of quality according to Crathorn, they must be mental qualities having the same nature as non-mental qualities and they must exist subjectively in the mind, which is to say that they exist in some part of the brain (Pasnau 1997)[^pasnau-1997]. Crathorn writes, “the word ‘cognition’ (*cognitio*) stands for the idea (*verbum*) of the thing known, and that idea is the quality existing subjectively (*subiective existens*) in the mind or in some part of the brain” (I *Sent.* q. 1, concl. 1). Therefore, cognition is nothing but the species itself or the part of the soul where it is received and stored. From an ontological point of view, nothing distinguishes sensible cognition, imagination and intellection except the distinct part of the soul where the species is received. There is no difference between sensible and intelligible species.
    step1: |-
      知识问题是克雷索恩思想的核心。追溯至罗吉尔·培根（Roger Bacon），他主张人类心灵能够认识外部世界的唯一途径，是经由与之相似的*种相*（*species*）（I *Sent.* q. 1, concl. 4）。培根关于种相增殖（*multiplicatio specierum*）的理论，是为了以光学为模型说明因果性而发展出来的。一个事物 *c* 通过种相 *s* 从 *c* 朝 *e* 的增殖而对另一事物 *e* 产生作用，正如光在照亮对象时经由空气增殖。在培根看来，种相 *s* 是 *c* 的再现者，只是存在样态较低。于是，种相经由空气这一媒介不断增殖，直到抵达 *e*。*c* 的因果力就这样经由媒介保存下来，直至作用于 *e*。因此，种相既是原因（即与原因同一回事，但以减损的存在样态存在），又是该原因的相似物。将培根的理论应用于认识论，克雷索恩断言，我们无法直接通达外部世界中的事物，我们直接知觉到的只是它们的心理相似物或表象，即它们的种相。这些心理实体，无论我们称之为“种相”还是“概念”（这两个词对克雷索恩而言是等价的），都具有它们所相似之物的相同本性（*ibid.* concl. 8）。与培根相反，这位多明我会士认为，种相在心灵内外具有相同的存在样态——即物质的存在样态。其结果是，我们心中所有的种相都属于性质范畴，因为没有任何真实的实体或数量能够物质地存在于人的灵魂之中。既然根据克雷索恩概念只能属于性质范畴，它们就必须是心理性质，具有与非心理性质相同的本性，并且必须主观地存在于心灵之中，也就是说，它们存在于大脑的某个部分（Pasnau 1997）[^pasnau-1997]。克雷索恩写道，“‘认识’（*cognitio*）一词意指所知事物的观念（*verbum*），而该观念是主观地（*subiective existens*）存在于心灵或大脑某一部分的性质”（I *Sent.* q. 1, concl. 1）。因此，认识无非是种相本身，或是灵魂中接收并储存种相的那个部分。从本体论的观点看，除了接收种相的灵魂的特定部分不同之外，没有任何东西区分感性认识、想象与理智作用。可感种相与可理智种相之间没有区别。
