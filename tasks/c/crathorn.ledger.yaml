      Another debate concerned the nature of mental language, specifically whether it is conventional or natural (Gelber 1984; Panaccio 1996)[^gelber-1984][^panaccio-1996] Ockham had argued that thinking occurs in a universal language made of concepts acquired naturally, i.e. through natural relations of causality and similitude. All conventional languages used for human communication are subordinated to this mental language, which is shared by everyone. But Crathorn could not accept such a position because of his cognitive theory according to which there are only qualities in the mind. So there can be natural signs of extra-mental qualities. What about substance-terms (the equivalent of proper and common names), verbs, and syncategorems, i.e., logical particles and connectives such as ‘or’, ‘but’, ‘all’, and ‘if’? Accordingly, Crathorn argues that except for natural signs of qualities, no natural likeness in the mind can explain the signification of these terms. Mental language is therefore as conventional as spoken and written languages and is in fact derived from conventional languages (I *Sent*., q. 2; Cf. Panaccio 1996, Perler 1997, Robert 2009b and 2010b)[^panaccio-1996][^perler-1997][^robert-2009b][^robert-2010b]. Just as thought depends on the *species* or likenesses of external things, mental words are likenesses of conventional words and have exactly the same semantic properties. Depending upon which language(s) you learn to speak, your mental language will be a likeness of Latin, English, French, etc. This does not mean that we do not have natural representations of the external world, but these mental *qualia* do not form a language. Crathorn was the only thinker of his time to affirm that conventional words are prior to their mental counterparts. Meaning is first given by a community of speakers; mental language is simply the internalization of these spoken and written languages. When we think about the world with propositions and syllogisms, we always think in a conventional language or, more precisely, in its mental reflection.
    step1: |-
      另一场争论涉及心理语言的本性，特别是它是约定的还是自然的（Gelber 1984; Panaccio 1996）[^gelber-1984][^panaccio-1996]。奥卡姆曾主张，思维发生在一门由自然获得的（即经由自然的因果性与相似性关系获得的）概念构成的全人类语言之中。所有用于人类交流的约定语言都从属于这门人人共有的心理语言。但克雷索恩无法接受这样的立场，因为根据他的认识理论，心灵中只有性质。所以，可以有心理外性质的自然符号。那么实体词项（专名与通名的等价物）、动词和助范畴词，即诸如“或”“但是”“所有”“如果”之类的逻辑小品词与连接词又怎样呢？据此，克雷索恩论证，除了性质的自然符号之外，心灵中没有任何自然相似物能够说明这些词项的意谓。因此，心理语言与口头和书面语言一样是约定的，并且事实上派生于约定语言（I *Sent.*, q. 2; Cf. Panaccio 1996, Perler 1997, Robert 2009b and 2010b）[^panaccio-1996][^perler-1997][^robert-2009b][^robert-2010b]。正如思想依赖于外部事物的*种相*或相似物，心理语词是约定语词的相似物，并具有完全相同的语义性质。取决于你学会说哪种语言，你的心理语言将是拉丁语、英语、法语等的相似物。这并不意味着我们没有关于外部世界的自然表象，但这些心理*感质*（*qualia*）并不构成一门语言。克雷索恩是他那个时代唯一断言约定语词先于其心理对应物的思想家。意义首先由一个说话者共同体给出；心理语言不过是这些口头与书面语言的内化。当我们用命题与三段论思考世界时，我们总是用一种约定语言来思考，或者更确切地说，用它在我们心中的映像来思考。
