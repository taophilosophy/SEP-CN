    source: |-
      William Crathorn (fl. 1330s), like Adam Wodeham (d. 1358) and Robert Holkot (c. 1290–1349), belonged to the first generation of Oxford philosophers after William of Ockham (c. 1285–1347), who sought to criticize and develop Ockham’s philosophy. Crathorn is remembered for his theories of language and cognition, and for some anti-skeptical arguments strikingly similar to those found in Descartes’ *Meditations*. The radical ontology of his works is also noteworthy, though it has not yet been closely studied.
    step1: |-
      威廉·克雷索恩（William Crathorn，活跃于 1330 年代），与亚当·沃德汉姆（Adam Wodeham，卒于 1358 年）和罗伯特·霍尔柯特（Robert Holkot，约 1290–1349）一样，属于威廉·奥卡姆（William of Ockham，约 1285–1347）之后的第一代牛津哲学家，这批人试图批判并发展奥卡姆的哲学。克雷索恩因其语言与认识理论，以及一些与笛卡尔（Descartes）的《第一哲学沉思集》（*Meditations*）中发现的论证惊人相似的反对怀疑论论证而为人们所铭记。他著作中激进的本体论同样值得注意，尽管它尚未被仔细研究。
    step2: |-
      威廉·克雷索恩（William Crathorn，活跃于 1330 年代），与亚当·沃德汉姆（Adam Wodeham，卒于 1358 年）和罗伯特·霍尔柯特（Robert Holkot，约 1290–1349）一样，属于威廉·奥卡姆（William of Ockham，约 1285–1347）之后的第一代牛津哲学家，他们致力于批判并发展奥卡姆的哲学。克雷索恩以其语言理论与认识理论，以及一些与笛卡尔（Descartes）《第一哲学沉思集》（*Meditations*）中论证惊人相似的反对怀疑论论证而著称。他著作中激进的本体论同样值得注意，尽管迄今尚未得到深入研究。
