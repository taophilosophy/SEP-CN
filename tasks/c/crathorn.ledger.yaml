      The implications of Crathorn’s atomism are truly astonishing. First, every movement boils down to local motion of atoms in the void. Thus, Crathorn affirms that a continuous motion has only one possible speed, which is the greatest speed it could ever reach (Murdoch 1984)[^murdoch-1984]. In other words, movement is continuous when an atom changes from one atomic place to another contiguous atomic place. The proportion of time and place (i.e., the speed) is always equal to one. So how can he explain the fact that things appear to move at different speeds? The answer is quite simple: to every varying speed there corresponds a discontinuous motion, with times of rest between some of the atomic places occupied by the moving atoms (I *Sent.*, q. 16, concl. 6). For example, the normal speed of an atom *a* corresponds to its local motion from a place *p1* to another contiguous place *p2* in a given atomic time. Variation of speed occurs if *a* moves from *p1* to *p2* but with a time of rest equivalent to two atoms of time. We may infer that speed can also vary if *a* goes from *p1* to another place *p3* that is not directly contiguous with *p1*.
    step1: |-
      克雷索恩原子论的含义确实令人惊异。首先，一切运动都归结为原子在虚空中的局部运动。因此，克雷索恩断言，连续运动只有一种可能的速度，即它所能达到的最大速度（Murdoch 1984）[^murdoch-1984]。换言之，当一个原子从一个原子场所变为另一个邻接的原子场所时，运动就是连续的。时间与场所的比例（即速度）总等于一。那么，他如何解释事物看起来以不同速度运动这一事实呢？答案相当简单：每一个变化的速度都对应于一种不连续运动，其间在运动原子所占的某些原子场所之间有静止时间（I *Sent.*, q. 16, concl. 6）。例如，原子 *a* 的正常速度对应于它在给定的原子时间内从场所 *p1* 到另一个邻接场所 *p2* 的局部运动。如果 *a* 从 *p1* 移动到 *p2*，但有一个相当于两个原子时间的静止时间，则发生速度变化。我们可以推断，如果 *a* 从 *p1* 到另一个不与 *p1* 直接邻接的场所 *p3*，速度也可以变化。
    step2: |-
      克雷索恩原子论的含义确实令人震惊。首先，一切运动都可归结为原子在虚空中的局部运动。于是，克雷索恩断言：连续运动只有一种可能的速度，即它所能达到的最大速度（Murdoch 1984）[^murdoch-1984]。换言之，当一个原子从一个原子场所转变到另一个邻接的原子场所时，运动便是连续的。时间与场所之比（即速度）恒等于一。那么，他如何解释事物似乎以不同速度运动这一事实呢？答案颇为简单：每一个变化的速度都对应一种不连续运动，其间在运动原子所占的某些原子场所之间存在静止时段（I *Sent.*, q. 16, concl. 6）。例如，原子 *a* 的正常速度，对应于它在给定原子时间内从场所 *p1* 到另一邻接场所 *p2* 的局部运动。若 *a* 从 *p1* 移至 *p2*，却伴有一个相当于两个原子时间的静止时段，便发生速度变化。我们可推知，若 *a* 从 *p1* 移至另一个不与 *p1* 直接邻接的场所 *p3*，速度同样可以变化。
