      Although Crathorn does not describe himself this way, he seems to be one of the most radical atomists of the fourteenth century (Robert 2010a)[^robert-2010a], sharing with his Parisian contemporary Nicholas of Autrecourt much of the same anti-Aristotelian bent in his metaphysics and natural philosophy. Combined with his epistemology and philosophy of language, his philosophy is certainly one of the most original forms of reductionism in later medieval philosophy.
    step1: |-
      尽管克雷索恩并不这样描述自己，他似乎是十四世纪最激进的原子论者之一（Robert 2010a）[^robert-2010a]，与他的巴黎同时代人奥特雷库尔的尼古拉在其形而上学与自然哲学中分享了许多相同的反亚里士多德倾向。结合其认识论与语言哲学，他的哲学无疑是中世纪晚期哲学中最具独创性的还原论形式之一。
    step2: |-
      虽然克雷索恩并不如此描述自己，但他似乎确是十四世纪最激进的原子论者之一（Robert 2010a）[^robert-2010a]，与其巴黎同时代人奥特雷库尔的尼古拉在形而上学与自然哲学上共享许多同样的反亚里士多德倾向。结合其认识论与语言哲学，他的哲学无疑属于中世纪晚期哲学中最具独创性的还原论形态。
