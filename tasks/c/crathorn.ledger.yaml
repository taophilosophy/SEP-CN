      Crathorn’s *Sentences* commentary is of great philosophical and historical interest for the study of the first generation of Oxford thinkers after Ockham because he develops his own provocative positions by discussing the major issues of his day and criticizing the views of his contemporaries (Courtenay 1978, Gelber 2004)[^courtenay-1978][^gelber-2004]. His favorite target was Ockham, but he also argued against the views of Thomas Aquinas (Krauss 1933)[^krauss-1933], John Duns Scotus, Richard Fitzralph, and Robert Holkot (Schepers 1970, 1972)[^schepers-1970].
    step1: |-
      克雷索恩的《箴言四书》评注对于研究奥卡姆之后的第一代牛津思想家具有极大的哲学与历史意义，因为他通过讨论他那个时代的主要问题并批判其同时代人的观点，来提出自己富有争议的立场（Courtenay 1978, Gelber 2004）[^courtenay-1978][^gelber-2004]。他最喜欢的靶子是奥卡姆，但他也反对托马斯·阿奎那（Thomas Aquinas）（Krauss 1933）[^krauss-1933]、邓斯·司各脱（John Duns Scotus）、理查德·腓茨拉尔夫（Richard Fitzralph）和罗伯特·霍尔柯特的观点（Schepers 1970, 1972）[^schepers-1970]。
    step2: |-
      克雷索恩的《箴言四书》评注对于研究奥卡姆之后的第一代牛津思想家具有重大的哲学与历史意义，因为他通过讨论其时代的主要议题并批评同时代人的观点，来发展自己富有争议的立场（Courtenay 1978, Gelber 2004）[^courtenay-1978][^gelber-2004]。他最喜欢的靶子是奥卡姆，但他也反对托马斯·阿奎那（Thomas Aquinas）（Krauss 1933）[^krauss-1933]、邓斯·司各脱（John Duns Scotus）、理查德·腓茨拉尔夫（Richard Fitzralph）与罗伯特·霍尔柯特等人的观点（Schepers 1970, 1972）[^schepers-1970]。
  - id: 5
    source: |-
      Although Crathorn criticized Ockham, he remained a nominalist (he admits only individuals in his ontology and subscribes to the same kind of theory of predication as Ockham). Above all, he worked out some of the consequences of Ockham’s views in epistemology, the philosophy of language, and ontology, to show what problems they created. We do not know whether he knew Ockham personally, or only indirectly, through his younger disciple, Adam Wodeham. Indeed, Wodeham frequently refers to a Dominican *socius*, who could have been Crathorn himself or a certain John Grafton, another Oxford Dominican of this time.
    step1: |-
      尽管克雷索恩批评奥卡姆，他仍然是唯名论者（他在其本体论中只承认个体，并赞同与奥卡姆同一种类的谓述理论）。最重要的是，他推演了奥卡姆在认识论、语言哲学和本体论方面的一些观点的后果，以表明它们造成了什么问题。我们不知道他是亲自认识奥卡姆，还是仅仅通过其年轻弟子亚当·沃德汉姆间接认识。事实上，沃德汉姆经常提到一位多明我会同伴（*socius*），他可能是克雷索恩本人，也可能是当时另一位牛津多明我会士约翰·格拉夫顿（John Grafton）。
    step2: |-
      尽管克雷索恩批评奥卡姆，他依然是一位唯名论者（他在本体论中只承认个体，并赞同与奥卡姆同类的谓述理论）。他尤其推演了奥卡姆在认识论、语言哲学与本体论方面若干观点的后果，以揭示它们所带来的问题。我们不知道他是亲自认识奥卡姆，还是仅仅经由其年轻弟子亚当·沃德汉姆间接认识。事实上，沃德汉姆屡次提到一位多明我会同伴（*socius*），此人可能是克雷索恩本人，也可能是当时另一位牛津多明我会士约翰·格拉夫顿（John Grafton）。
