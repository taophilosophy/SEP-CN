      William Crathorn also lectured on the Bible, and Holkot is presumably responding to Crathorn’s arguments in his *Sex articuli*. A manuscript in Vienna contains what could be Crathorn’s forty-two quodlibetal questions (Richter 1972)[^richter-1972], but most of these questions are similar to the ones contained in his *Questions on the Sentences* (*Quaestiones super librum sententiarum*).
    step1: |-
      威廉·克雷索恩也讲授《圣经》，而霍尔柯特在他的《六条论纲》（*Sex articuli*）中大概是在回应克雷索恩的论证。维也纳的一部手稿包含了可能是克雷索恩的四十二个自由论题（Richter 1972）[^richter-1972]，但这些论题大多与其《箴言四书问答》（*Questions on the Sentences*；即 *Quaestiones super librum sententiarum*）中所含的论题相似。
    step2: |-
      威廉·克雷索恩还讲授《圣经》，霍尔柯特在其《六条论纲》（*Sex articuli*）中大概正是在回应克雷索恩的论证。维也纳藏有一部手稿，其中可能是克雷索恩的四十二个自由论题（Richter 1972）[^richter-1972]，但这些论题大多与其《箴言四书问答》（*Questions on the Sentences*；即 *Quaestiones super librum sententiarum*）中的论题相似。
