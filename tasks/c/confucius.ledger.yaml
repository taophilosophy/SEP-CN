      思想史家陈来指出了在战国晚期变得杂糅的两组理想品质。第一组品质描述源于政治取向的对周文王等人物的描述的君主之德，包括直（*zhi*）和刚（*gang*）。第二组品质基于特定于亲族群体的纽带，包括孝和慈（*ci*）。随着亲族群体被纳入更大的政治单位，文本开始呈现从两组中汲取的混合理想品质清单。因此，孔子不得不有效地整合氏族优先性和国家优先性，这种调和在《韩诗外传》中由他坚持孝并不仅仅是顺从长者来体现。当他的弟子曾子因过失甘受其父杖责的严厉殴打时，孔子责备曾子，说即使圣王舜也不会忍受如此严厉的杖责。他接着解释，孩子负有双重义务，既对父亲也对君主，前者是孝，后者是忠。因此，保护自己的身体是君主之义务，也是顺从父母之义务的平衡（8）。在《孝经》（*Xiaojing*）中，类似的推理被应用于重新定义孝，它拒绝像这种极端顺从的行为，因为保护自己的身体是父母之义务。这种限定表明，随着孝进一步离开其原初的家庭语境，它必须被限定才能融入一种珍视多种品格特征的观念。
