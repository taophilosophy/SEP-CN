      仁德意味着与他人互动时，以从其视角何为善的感觉为指导。有时《论语》一般地把仁定义为“爱人”（12.22），但在某些语境中它与更具体的行为相联系。仁的语境性定义包括：把路上的人当作贵宾、把普通民众当作祭祀时的侍者（12.2），言语谨慎（12.3）和拒绝使用巧言（1.3），以及居处恭敬、执事敬、与人忠（13.19）。它是最宽泛的德性，然而君子宁可死也不愿损害它（15.9）。仁包含一种无私，或者，正如 David Hall 和 Roger Ames 所提示的，它涉及从自我与他人的综合视角形成道德判断。
