      Different sources identify Confucius as having held a large number of different offices in Lu. Entries in the *Zuo Commentary* (*Zuozhuan* 左傳) to the *Spring and Autumn Annals* for 509 and 500 BCE identify him as Director of Corrections (*Sikou* 司寇), and say he was charged with assisting the ruler with the rituals surrounding a visiting dignitary from the state of Qi, respectively. The *Mencius* (*Mengzi* 孟子), a text centered on a figure generally regarded as the most important early developer of the thought of Confucius, Mencius (trad. 372–289 BCE), says Confucius was Foodstuffs Scribe (*Weili* 委吏) and Scribe in the Field (*Chengtian* 乘田), involved with managing the accounting at the granary and keeping the books on the pasturing of different animals (11.14).[^note-1] In the first biography, Sima Qian mentions these offices, but then adds a second set of more powerful positions in Lu including Steward (*Zai* 宰) managing an estate in the district of Zhongdu, Minister of Works (*Sikong* 司空), and even acting Chancellor (*Xiang* 相). Following his departure from Lu, different stories place Confucius in the kingdoms of Wei, Song, Chen, Cai, and Chu. Sima Qian crafted these stories into a serial narrative of rulers failing to appreciate the moral worth of Confucius, whose high standards forced him to continue to travel in search of an incorrupt ruler.
