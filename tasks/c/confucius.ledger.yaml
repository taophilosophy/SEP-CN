      如此，谦逊、孝或敬老等个人品质被视为胜任官职的证明。治国的资格，由在“五伦”（*wulun*）所定义的社会角色中的得体行为来彰显，这一表述见于孟子著作，成为汉代解释与孔子相关著作的关键特征。西汉皇帝是刘氏宗族成员，像《春秋》的《穀梁传》（*Guliang zhuan*）这样的著作强调植根于五伦的规范性家庭行为，五伦在此为（此处改编为包括母亲和姐妹）：君臣、父子、夫妇、兄弟、朋友。Henry Rosemont 和 Roger Ames 在特别参照《孝经》写作时论证，规定的社会角色是“儒家传统”的界定性特征，这类角色是适当行为的规范性指南。他们把这一点与“德性伦理学”的方法相对照，后者他们称需要理性计算来确定道德行为，而孝仅仅是履行家庭义务之事。正如五种德性被置于后来道德发展理论的中心，一旦社会角色以这种方式体系化，与它们一致的孔子情境性教诲就可以成为更抽象、更系统化道德理论的基础。然而，没有对“天命”这一抽象古典政治理论的改编——该学说最初支持统治宗族——来论证天的影响通过个体德性的特定具体表达而呈现，这一切不可能发生。在孔子相关著作中，这一改编的结果是，君主举行帝国礼仪、践行孝道或展现其他个人德性，提供了证明道德称职性的凭证，从而使其政治权威合法化。正如礼仪和德性一样，孝与天命在通过孔子及其时代君主和弟子的声音与经典整合的过程中被转化。
