      先前未知的孔子对话和语录也被发掘出来。定州遗址还出土了题为《儒家者言》（*Rujiazhe yan*）和《哀公问五义》（*Aigong wen wuyi*）的文本。1977 年在安徽省阜阳的一座汉墓中发现了一部同样名为《儒家者言》但内容显著不同的文本。1973 年，在湖南省马王堆遗址发掘出数部断代为公元前 168 年、记录孔子关于《易经》（*Yijing*）的论述的文本。此外，一些以特定弟子为中心的战国时期对话文本，以及一部名为《孔子诗论》（*Kongzi shilun*）、包含孔子对《诗经》诠释性评论的文本，在 1990 年代被盗掘出墓，在黑市出售，最终入藏上海博物馆。公元前 59 年的海昏侯墓也包含多部先前未知的、关于礼仪和孝道的孔子对话和语录，以及与传世文本（包括《论语》、《礼记》和《大戴礼记》）部分重叠的材料。另一部无出土地点信息、现由安徽大学收藏的手稿《仲尼曰》（*Zhong Ni yue*）约有二十四则语录，其中七则与现代《论语》重叠。最近，关于 2021 年湖北省王家嘴发掘的初步报告称，出土了数目不详的题为《孔子曰》（*Kongzi yue*）的语录，表明它仅与《论语》部分重叠。这些新发现表明，归名于孔子的更多语录曾一起流传，其中某些被挑选出来，收入《礼记》和《论语》等著作。
