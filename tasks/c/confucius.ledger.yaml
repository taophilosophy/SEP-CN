      这段文字所表达的周代政治理论，基于一种有限道德宇宙的观念：它可能不会孤立地奖赏有德之人，但其中上帝（*Shangdi*，*Di*）或天会介入，以一位德行卓著之人取代一位坏君主。《书经》是一部包含归于往昔圣王及其大臣的训词的文集，其论述常关注道德权威，聚焦于往昔典范君主的方略和品格。《康诰》（*Kanggao*）章是写给文王的一位儿子的，为他提供了作为圣王行事的指南，也提供了那些君主曾被经验证明有效的方略。就文王所传的天命而言，该章坚持天命并非一成不变，因此作为君主的儿子在决定如何行动时必须时时念及它。此外，天并非总能理解，但“民情可见”，所以君主必须体恤其臣民。孔子所继承的周代政治观，基于超自然介入以把一位有个人德性的人置于国家之首位，但随着时间的推移，重心转向了善政的种种效果可被视为该安置持续道德正当性之证明的方式。
