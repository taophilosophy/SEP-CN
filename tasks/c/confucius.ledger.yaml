      因此，将孔子语录和对话的文献库扩展到《论语》之外，需要关注三类额外的来源。第一，传世文献如《礼记》、《大戴礼记》（*DaDai Liji*）以及汉代文集如《孔子家语》（*Kongzi jiayu*）中保存的对话，包含大量多样的教诲。第二，附着于经典段落诠释的引文，保存在如《左传》对《春秋》的注疏，或《韩诗外传》（*Han Shi waizhuan*）中，对于历史和诗歌的解读而言是特别丰富的来源。最后，一批新近考古发掘的汉代及更早的文本也扩大了文献库。
