segments:
  - id: 1
    source: "Cognitive science is the interdisciplinary study of mind and intelligence, embracing philosophy, psychology, artificial intelligence, neuroscience, linguistics, and anthropology. Its intellectual origins are in the mid-1950s when researchers in several fields began to develop theories of mind based on complex representations and computational procedures. Its organizational origins are in the mid-1970s when the Cognitive Science Society was formed and the journal *Cognitive Science* began. Since then, more than one hundred universities in North America, Europe, Asia, and Australia have established cognitive science programs, and many others have instituted courses in cognitive science."
    step1: "认知科学是对心灵与智能的跨学科研究，涵盖哲学、心理学、人工智能、神经科学、语言学与人类学。其思想起源在 20 世纪 50 年代中期，当时若干领域的研究者开始基于复杂的表征与计算程序发展心灵理论。其组织起源在 20 世纪 70 年代中期，当时认知科学学会成立，《认知科学》期刊创刊。自那以来，北美、欧洲、亚洲与澳大利亚的一百多所大学设立了认知科学项目，许多其他大学开设了认知科学课程。"
    step2: "认知科学是研究心灵与智能的跨学科领域，涵盖哲学、心理学、人工智能、神经科学、语言学与人类学。其思想渊源可追溯至 20 世纪 50 年代中期，当时若干领域的研究者开始发展基于复杂表征与计算程序的心灵理论。其建制渊源则在 20 世纪 70 年代中期，认知科学学会成立，《认知科学》期刊随之创刊。此后，北美、欧洲、亚洲与澳大利亚的一百余所大学设立了认知科学专业，另有众多大学开设了认知科学课程。"
  - id: 2
    source: "Attempts to understand the mind and its operation go back at least to the Ancient Greeks, when philosophers such as Plato and Aristotle tried to explain the nature of human knowledge. The study of mind remained the province of philosophy until the nineteenth century, when experimental psychology developed. Wilhelm Wundt and his students initiated laboratory methods for studying mental operations more systematically. Within a few decades, however, experimental psychology became dominated by behaviorism, a view that virtually denied the existence of mind. According to behaviorists such as J. B. Watson, psychology should restrict itself to examining the relation between observable stimuli and observable behavioral responses. Talk of consciousness and mental representations was banished from respectable scientific discussion. Especially in North America, behaviorism dominated the psychological scene through the 1950s."
    step1: "理解心灵及其运作的努力至少可追溯至古希腊人，当时像柏拉图与亚里士多德这样的哲学家试图解释人类知识的本性。心灵研究一直是哲学的领地，直到 19 世纪实验心理学发展起来。威廉·冯特及其学生开创了更系统地研究心理运作的实验室方法。然而，几十年内，实验心理学被行为主义所主导，这种观点几乎否认心灵的存在。按照像 J. B. 沃森这样的行为主义者的说法，心理学应限于考察可观察刺激与可观察行为反应之间的关系。关于意识与心理表征的谈论被逐出体面的科学讨论。尤其在北美，行为主义主导了心理学界直到 20 世纪 50 年代。"
    step2: "理解心灵及其运作的尝试至少可追溯到古希腊人，当时像柏拉图与亚里士多德这样的哲学家力图解释人类知识的本性。心灵研究长期属于哲学的领域，直到 19 世纪实验心理学兴起。威廉·冯特（Wilhelm Wundt）及其学生开创了实验室方法，更系统地研究心理运作。然而短短数十年间，实验心理学便为行为主义所主导——这种观点几乎全然否认心灵的存在。按照 J. B. 沃森（J. B. Watson）等行为主义者的主张，心理学应限于考察可观察刺激与可观察行为反应之间的关系。关于意识与心理表征的谈论，被逐出了体面的科学讨论。尤其是在北美，行为主义直至 20 世纪 50 年代都主导着心理学界。"
  - id: 3
    source: "Around 1956, the intellectual landscape began to change dramatically. George Miller summarized numerous studies which showed that the capacity of human thinking is limited, with short-term memory, for example, limited to around seven items. He proposed that memory limitations can be overcome by recoding information into chunks, mental representations that require mental procedures for encoding and decoding the information. At this time, primitive computers had been around for only a few years, but pioneers such as John McCarthy, Marvin Minsky, Allen Newell, and Herbert Simon were founding the field of artificial intelligence. In addition, Noam Chomsky rejected behaviorist assumptions about language as a learned habit and proposed instead to explain language comprehension in terms of mental grammars consisting of rules. The six thinkers mentioned in this paragraph can be viewed as the founders of cognitive science."
    step1: "1956 年前后，思想景观开始剧变。乔治·米勒总结了大量研究表明人类思维的能力有限，例如短时记忆限于约七个项目。他提出记忆局限可以通过把信息重新编码为组块来克服，组块是需要心理程序来编码与解码信息的心理表征。此时，原始计算机才出现没几年，但像约翰·麦卡锡、马文·明斯基、艾伦·纽厄尔与赫伯特·西蒙这样的先驱正创立人工智能领域。此外，诺姆·乔姆斯基拒斥把语言视为习得习惯的行为主义假设，转而主张依据由规则构成的心理语法来解释语言理解。本段提到的六位思想家可被视为认知科学的奠基人。"
    step2: "约在 1956 年，思想图景开始发生剧变。乔治·米勒（George Miller）总结了大量研究，表明人类思维的能力是有限的，例如短时记忆大约只限于七个项目。他提出，记忆的限制可以通过把信息重新编码为组块（chunks）来克服；组块是心理表征，需要心理程序来编码与解码信息。彼时，原始计算机才问世数年，但约翰·麦卡锡（John McCarthy）、马文·明斯基（Marvin Minsky）、艾伦·纽厄尔（Allen Newell）与赫伯特·西蒙（Herbert Simon）等先驱正在创立人工智能领域。此外，诺姆·乔姆斯基（Noam Chomsky）拒斥把语言视为习得习惯的行为主义假设，转而主张用由规则构成的心理语法来解释语言理解。本段提到的六位思想家可视为认知科学的奠基人。"
  - id: 4
    source: "Cognitive science has unifying theoretical ideas, but we have to appreciate the diversity of outlooks and methods that researchers in different fields bring to the study of mind and intelligence. Although cognitive psychologists today often engage in theorizing and computational modeling, their primary method is experimentation with human participants. People, often undergraduates satisfying course requirements, are brought into the laboratory so that different kinds of thinking can be studied under controlled conditions. For example, psychologists have experimentally examined the kinds of mistakes people make in deductive reasoning, the ways that people form and apply concepts, the speed of people thinking with mental images, and the performance of people solving problems using analogies. Our conclusions about how the mind works must be based on more than “common sense” and introspection, since these can give a misleading picture of mental operations, many of which are not consciously accessible. Increasingly, psychologists draw their experimental participants from Amazon’s Mechanical Turk and from culturally diverse sources. Psychological experiments that carefully approach mental operations from diverse directions are therefore crucial for cognitive science to be scientific. Experimentation is also a methodology employed by experimental philosophy."
    step1: "认知科学有统一的理论观念，但我们必须认识到不同领域的研究者给心灵与智能研究带来的观点与方法的多样性。尽管今天的认知心理学家常从事理论建构与计算建模，他们的首要方法是与人类参与者做实验。人们，通常是满足课程要求的本科生，被带进实验室，以便在受控条件下研究不同种类的思维。例如，心理学家以实验考察人们在演绎推理中犯的错误的种类、人们形成与应用概念的方式、人们用心理意象思考的速度、以及人们用类比解决问题时的表现。我们关于心灵如何运作的结论必须建立的基础不止是“常识”与内省，因为这些可能对心理运作给出误导性的图景，而许多心理运作并非意识可及的。越来越多的心理学家从 Amazon 的 Mechanical Turk 以及文化多样的来源招募实验参与者。因此，从多样方向仔细逼近心理运作的心理实验，对认知科学成为科学至关重要。实验也是实验哲学采用的一种方法论。"
    step2: "认知科学拥有统一的理论观念，但我们也须看到，不同领域的研究者为心灵与智能研究带来了各异的观点与方法。今天的认知心理学家虽然常从事理论建构与计算建模，其首要方法仍是与人类参与者进行实验。人们——多为满足课程要求的本科生——被请进实验室，以便在受控条件下研究不同类型的思维。例如，心理学家以实验考察人们在演绎推理中犯错的类型、人们形成与运用概念的方式、人们借助心理意象思考的速度，以及人们运用类比解题时的表现。我们关于心灵如何运作的结论，不能仅仅建立在“常识”与内省之上，因为二者都可能对心理运作给出误导性的图景，而许多心理运作并非意识所能触及。越来越多的心理学家从 Amazon 的 Mechanical Turk 以及文化多元的来源招募实验参与者。因此，从多个方向仔细逼近心理运作的心理实验，对认知科学成为一门科学至关重要。实验也是实验哲学所采用的方法论之一。"
  - id: 5
    source: "Although theory without experiment is empty, experiment without theory is blind. To address the crucial questions about the nature of mind, the psychological experiments need to be interpretable within a theoretical framework that postulates mental representations and procedures. One of the best ways of developing theoretical frameworks is by forming and testing computational models intended to be analogous to mental operations. To complement psychological experiments on deductive reasoning, concept formation, mental imagery, and analogical problem solving, researchers have developed computational models that simulate aspects of human performance. Designing, building, and experimenting with computational models is the central method of artificial intelligence (AI), the branch of computer science concerned with intelligent systems. Ideally in cognitive science, computational models and psychological experimentation go hand in hand, but much important work in AI has examined the power of different approaches to knowledge representation in relative isolation from experimental psychology."
    step1: "没有实验的理论是空洞的，没有理论的实验是盲目的。要解决关于心灵本性的关键问题，心理实验须能在设定心理表征与程序的理论框架内得到解释。发展理论框架的最佳方式之一是构造并检验意在类比心理运作的计算模型。为了补充关于演绎推理、概念形成、心理意象与类比问题求解的心理实验，研究者已发展出模拟人类表现某些方面的计算模型。设计、构建并实验计算模型，是人工智能（AI）的核心方法，人工智能是计算机科学中关注智能系统的分支。在认知科学中，理想的情形是计算模型与心理实验携手并进，但人工智能中的许多重要工作，是在相对脱离实验心理学的情况下考察不同知识表征进路的力量。"
    step2: "没有实验的理论是空洞的，没有理论的实验是盲目的。要解决关于心灵本性的关键问题，心理实验必须能够在一种设定心理表征与程序的理论框架内得到解释。发展理论框架的最佳途径之一，是构造并检验旨在类比心理运作的计算模型。为补充关于演绎推理、概念形成、心理意象与类比问题求解的心理实验，研究者已开发出模拟人类表现某些侧面的计算模型。设计、构建并实验计算模型，是人工智能（AI）的核心方法——人工智能是计算机科学中研究智能系统的分支。理想上，认知科学中的计算模型与心理实验应携手并进；但人工智能中的许多重要工作，是在相对脱离实验心理学的情况下，考察不同知识表征进路的效力。"
  - id: 6
    source: "While some linguists do psychological experiments or develop computational models, most currently use different methods. For linguists in the Chomskian tradition, the main theoretical task is to identify grammatical principles that provide the basic structure of human languages. Identification takes place by noticing subtle differences between grammatical and ungrammatical utterances. In English, for example, the sentences “She hit the ball” and “What do you like?” are grammatical, but “She the hit ball” and “What does you like?” are not. A grammar of English will explain why the former are acceptable but not the latter. An alternative approach, cognitive linguistics, puts less emphasis on syntax and more on semantics and concepts."
    step1: "尽管一些语言学家做心理实验或发展计算模型，大多数目前使用不同方法。对乔姆斯基传统的语言学家而言，主要理论任务是识别为人类语言提供基本结构的语法原则。识别通过注意合乎语法与不合乎语法的言语之间的细微差别而进行。例如在英语中，“She hit the ball”与“What do you like?”是合乎语法的，但“She the hit ball”与“What does you like?”则不是。英语语法将解释为何前者可接受而后者不可。另一种进路，认知语言学，较少强调句法而较多强调语义与概念。"
    step2: "尽管有些语言学家从事心理实验或发展计算模型，多数人目前采用不同的方法。对乔姆斯基传统的语言学家而言，主要理论任务是识别为人类语言提供基本结构的语法原则。识别通过察觉合乎语法与不合乎语法的言语之间的细微差异而完成。例如，英语中“She hit the ball”与“What do you like?”合乎语法，而“She the hit ball”与“What does you like?”不合语法。英语语法将解释前者为何可接受而后者为何不可。另一种进路是认知语言学，它较少强调句法，而更多强调语义与概念。"
  - id: 7
    source: "Like cognitive psychologists, neuroscientists often perform controlled experiments, but their observations are very different, since neuroscientists are concerned directly with the nature of the brain. With nonhuman subjects, researchers can insert electrodes and record the firing of individual neurons. With humans for whom this technique would be too invasive, it is now common to use magnetic and positron scanning devices to observe what is happening in different parts of the brain while people are doing various mental tasks. For example, brain scans have identified the regions of the brain involved in mental imagery and word interpretation. Additional evidence about brain functioning is gathered by observing the performance of people whose brains have been damaged in identifiable ways. A stroke, for example, in a part of the brain dedicated to language can produce deficits such as the inability to utter sentences. Like cognitive psychology, neuroscience is often theoretical as well as experimental, and theory development is frequently aided by developing computational models of the behavior of groups of neurons."
    step1: "与认知心理学家一样，神经科学家常做受控实验，但他们的观察非常不同，因为神经科学家直接关注大脑的本性。对非人类受试者，研究者可以插入电极记录单个神经元的放电。对这项技术过于侵入性的人类，如今常用磁性与正电子扫描装置来观察人们在从事各种心理任务时大脑不同部分发生了什么。例如，脑扫描已识别出参与心理意象与词语解释的大脑区域。关于大脑运作的进一步证据，通过观察大脑以可识别方式受损的人的表现来收集。例如，中风于专门负责语言的大脑部位，可产生诸如无法说出句子的缺陷。与认知心理学一样，神经科学常常既是理论的也是实验的，而理论发展常通过发展神经元群体行为的计算模型来辅助。"
    step2: "与认知心理学家相似，神经科学家常进行受控实验，但其观察颇为不同，因为神经科学家直接关切大脑的本性。对非人类受试者，研究者可插入电极，记录单个神经元的放电。对于这项技术过于侵入性的人类受试者，如今普遍采用磁性与正电子扫描装置，观察人们在从事各种心理任务时大脑不同部位的活动。例如，脑扫描已识别出参与心理意象与词语理解的大脑区域。关于大脑运作的更多证据，来自对大脑以可辨识方式受损者表现的观察。例如，发生在专司语言的大脑区域的中风，可造成无法说出完整句子等缺陷。与认知心理学一样，神经科学常常既重理论也重实验，而理论发展常借助开发神经元群体行为的计算模型来推进。"
  - id: 8
    source: "Cognitive anthropology expands the examination of human thinking to consider how thought works in different cultural settings. The study of mind should obviously not be restricted to how English speakers think but should consider possible differences in modes of thinking across cultures. Cognitive science is becoming increasingly aware of the need to view the operations of mind in particular physical and social environments. For cultural anthropologists, the main method is ethnography, which requires living and interacting with members of a culture to a sufficient extent that their social and cognitive systems become apparent. Cognitive anthropologists have investigated, for example, the similarities and differences across cultures in words for colors."
    step1: "认知人类学扩展对人类思维的考察，以考虑思想在不同文化环境中如何运作。心灵研究显然不应限于英语使用者如何思考，而应考虑跨文化思维模式的可能差异。认知科学日益认识到需要在特定物理与社会环境中看待心灵的运作。对文化人类学家而言，主要方法是民族志，它要求与一种文化的成员共同生活并互动到足够程度，使其社会与认知系统显现出来。例如，认知人类学家已考察跨文化中颜色词的异同。"
    step2: "认知人类学扩展了对人类思维的考察，以探究思想在不同文化情境中如何运作。对心灵的研究显然不应局限于英语使用者如何思考，而应考察跨文化思维模式的可能差异。认知科学日益意识到，必须在具体的物理与社会环境中看待心灵的运作。对文化人类学家而言，主要方法是民族志，它要求与某文化的成员共同生活并充分互动，直至其社会与认知系统得以显现。例如，认知人类学家已考察不同文化中颜色词的异同。"
  - id: 9
    source: "Traditionally, philosophers do not perform systematic empirical observations or construct computational models, although there has been a rise in work in experimental philosophy. But philosophy remains important to cognitive science because it deals with fundamental issues that underlie the experimental and computational approach to mind. Abstract questions such as the nature of representation and computation need not be addressed in the everyday practice of psychology or artificial intelligence, but they inevitably arise when researchers think deeply about what they are doing. Philosophy also deals with general questions such as the relation of mind and body and with methodological questions such as the nature of explanations found in cognitive science. In addition, philosophy concerns itself with normative questions about how people should think as well as with descriptive ones about how they do. Besides the theoretical goal of understanding human thinking, cognitive science can have the practical goal of improving it, which requires normative reflection on what we want thinking to be. Philosophy of mind does not have a distinct method, but should share with the best theoretical work in other fields a concern with empirical results."
    step1: "传统上，哲学家不做系统的经验观察或构建计算模型，尽管实验哲学的工作有所增长。但哲学对认知科学仍然重要，因为它处理的是支撑心灵实验与计算方法的基本问题。表征与计算的本性这类抽象问题，在心理学或人工智能的日常实践中不必处理，但当研究者深入思考自己所做之事时，它们必然出现。哲学也处理一般问题，如心灵与身体的关系，以及方法论问题，如认知科学中说明的本性。此外，哲学关注人们应当如何思维的规范问题，也关注人们实际上如何思维的描述问题。除了理解人类思维的理论目标，认知科学还可有改进它的实践目标，这要求对我们希望思维成为什么进行规范反思。心灵哲学没有独特的方法，但应与其他领域最优秀的理论工作共享对经验结果的关切。"
    step2: "传统上，哲学家并不进行系统的经验观察，也不构建计算模型，尽管实验哲学的研究正在增长。但哲学对认知科学仍至关重要，因为它处理的是支撑心灵之实验与计算方法的基础问题。诸如表征与计算的本性这类抽象问题，在心理学或人工智能的日常实践中或许无需处理；但当研究者深入省思自己所做之事时，这些问题必然浮现。哲学还处理一般问题，如心灵与身体的关系，以及方法论问题，如认知科学中说明的本性。此外，哲学既关注人们应当如何思维的规范问题，也关注人们实际上如何思维的描述问题。除了理解人类思维这一理论目标，认知科学还可抱有改进思维这一实践目标，而这要求对我们希望思维成为何种样态进行规范反思。心灵哲学并无独特的方法，但它应当与其他领域最优秀的理论工作一样，关切经验结果。"
  - id: 10
    source: "In its weakest form, cognitive science is just the sum of the fields mentioned: psychology, artificial intelligence, linguistics, neuroscience, anthropology, and philosophy. Interdisciplinary work becomes much more interesting when there is theoretical and experimental convergence on conclusions about the nature of mind. For example, psychology and artificial intelligence can be combined through computational models of how people behave in experiments. The best way to grasp the complexity of human thinking is to use multiple methods, especially psychological and neurological experiments and computational models. Theoretically, the most fertile approach has been to understand the mind in terms of representation and computation."
    step1: "在最弱的意义上，认知科学只是所提及诸领域之和：心理学、人工智能、语言学、神经科学、人类学与哲学。当关于心灵本性的结论出现理论与实验的汇聚时，跨学科工作就变得更有趣得多。例如，心理学与人工智能可以通过人们在实验中如何行为的计算模型来结合。把握人类思维复杂性的最佳方式是使用多种方法，尤其是心理与神经实验以及计算模型。理论上，最富有成果的进路一直是依据表征与计算来理解心灵。"
    step2: "在最弱的意义上，认知科学只是上述诸领域的简单相加：心理学、人工智能、语言学、神经科学、人类学与哲学。当关于心灵本性的结论出现理论与实验的汇聚时，跨学科工作便大为有趣。例如，心理学与人工智能可通过人们在实验中的行为之计算模型而结合起来。把握人类思维复杂性的最佳途径，是运用多种方法，尤其是心理与神经实验以及计算模型。在理论上，最丰饶的进路一直是依据表征与计算来理解心灵。"
  - id: 11
    source: "The central hypothesis of cognitive science is that thinking can best be understood in terms of representational structures in the mind and computational procedures that operate on those structures. While there is much disagreement about the nature of the representations and computations that constitute thinking, the central hypothesis is general enough to encompass the current range of thinking in cognitive science, including connectionist theories which model thinking using artificial neural networks."
    step1: "认知科学的中心假设是：思维最好依据心灵中的表征结构与作用于这些结构的计算程序来理解。尽管对构成思维的表征与计算的本性存在许多分歧，这一中心假设足够一般，足以涵盖认知科学当前的思想范围，包括用人工神经网络为思维建模的联结主义理论。"
    step2: "认知科学的中心假设是：思维最好依据心灵中的表征结构以及作用于这些结构的计算程序来理解。尽管对构成思维的表征与计算的本性存在诸多分歧，这一中心假设已足够宽泛，足以涵盖认知科学当前的思想谱系，包括用人工神经网络为思维建模的联结主义理论。"
  - id: 12
    source: "Most work in cognitive science assumes that the mind has mental representations analogous to computer data structures, and computational procedures similar to computational algorithms. Cognitive theorists have proposed that the mind contains such mental representations as logical propositions, rules, concepts, images, and analogies, and that it uses mental procedures such as deduction, search, matching, rotating, and retrieval. The dominant mind-computer analogy in cognitive science has taken on a novel twist from the use of another analog, the brain."
    step1: "认知科学中的多数工作假设心灵具有类似于计算机数据结构的心理表征，以及类似于计算算法的计算程序。认知理论家已提出，心灵包含逻辑命题、规则、概念、意象与类比这样的心理表征，并使用演绎、搜索、匹配、旋转与提取这样的心理程序。认知科学中主导的心-计算机类比，因使用另一类比项——大脑——而呈现出新的转向。"
    step2: "认知科学中的多数工作假定，心灵具有类比于计算机数据结构的心理表征，以及类比于计算算法的计算程序。认知理论家提出，心灵包含逻辑命题、规则、概念、意象与类比等心理表征，并运用演绎、搜索、匹配、旋转与提取等心理程序。认知科学中占主导地位的心—计算机类比，由于引入另一类比项——大脑——而呈现出新颖的转折。"
  - id: 13
    source: "Connectionists have proposed novel ideas about representation and computation that use neurons and their connections as inspirations for data structures, and neuron firing and spreading activation as inspirations for algorithms. Cognitive science then works with a complex 3-way analogy among the mind, the brain, and computers. Mind, brain, and computation can each be used to suggest new ideas about the others. There is no single computational model of mind, since different kinds of computers and programming approaches suggest different ways in which the mind might work. The computers that most of us work with today are serial processors, performing one instruction at a time, but the brain and some recently developed computers are parallel processors, capable of doing many operations at once."
    step1: "联结主义者已提出关于表征与计算的新观念，以神经元及其连接为数据结构之灵感，以神经元放电与扩散激活为算法之灵感。于是认知科学在心灵、大脑与计算机之间运用一种复杂的三方类比。心灵、大脑与计算都可被用来为彼此提示新观念。不存在单一的心灵计算模型，因为不同种类的计算机与编程进路提示心灵可能运作的不同方式。我们今天多数人使用的计算机是串行处理器，一次执行一条指令，但大脑与一些新近开发的计算机是并行处理器，能同时进行许多运算。"
    step2: "联结主义者提出了关于表征与计算的新观念：以神经元及其连接为数据结构的灵感，以神经元放电与激活扩散为算法的灵感。于是认知科学在心灵、大脑与计算机之间展开一种复杂的三方类比。心灵、大脑与计算，皆可用来为其他两者提示新观念。并不存在单一的心灵计算模型，因为不同种类的计算机与编程进路提示了心灵可能运作的不同方式。我们今天多数人使用的计算机是串行处理器，一次执行一条指令；但大脑与一些新近开发的计算机是并行处理器，能同时完成许多运算。"
  - id: 14
    source: "A major trend in current cognitive science is the integration of neuroscience with many areas of psychology, including cognitive, social, developmental, and clinical. This integration is partly experimental, resulting from an explosion of new instruments for studying the brain, such as functional magnetic resonance imaging, transcranial magnetic stimulation, and optogenetics. The integration is also theoretical, because of advances in understanding how large populations of neurons can perform tasks usually explained with cognitive theories of rules and concepts."
    step1: "当前认知科学的一大趋势是神经科学与心理学许多领域的整合，包括认知、社会、发展与临床。这种整合部分是实验性的，源于研究大脑的新仪器激增，如功能性磁共振成像、经颅磁刺激与光遗传学。这种整合也是理论性的，因为对大量神经元群体如何完成通常用规则与概念的认知理论解释的任务的理解有所进展。"
    step2: "当前认知科学的一大趋势，是神经科学与心理学众多领域的整合，涵盖认知、社会、发展与临床心理学。这种整合部分是实验性的，源于研究大脑的新仪器大量涌现，如功能性磁共振成像、经颅磁刺激与光遗传学。它也是理论性的，因为人们对大量神经元群体如何完成那些通常以规则与概念的认知理论来解释的任务，理解已有进展。"
