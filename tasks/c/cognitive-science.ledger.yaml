  - id: 43
    source: "Predictive processing is an approach to theoretical neuroscience that views the brain as constantly generating and updating models of the environment in order to predict the results of perceptions and actions. Active inference is a version of predictive processing that hypothesizes that the brain uses Bayesian calculations to minimize “free energy” consisting of discrepancies between expectations and actual observations. Organisms survive when brains reduce prediction errors by changing their models of the environment or by changing the environment through action."
    step1: "预测加工是理论神经科学的一种进路，它把大脑视为不断生成与更新环境模型，以便预测知觉与行动的结果。主动推断是预测加工的一个版本，它假设大脑使用贝叶斯计算来最小化由期望与实际观察之间的差异构成的“自由能”。当大脑通过改变其环境模型、或通过行动改变环境来减少预测误差时，有机体得以生存。"
    step2: "预测加工是理论神经科学的一种进路，它将大脑视为不断生成并更新环境模型，以预测知觉与行动的结果。主动推断是预测加工的一个版本，它假设大脑运用贝叶斯计算，把由期望与实际观察之间的差异所构成的“自由能”最小化。当大脑通过改变环境模型、或通过行动改变环境来减少预测误差时，生物体便能存活。"
