    source: "Artificial intelligence has been a central part of cognitive since the 1950s, and the most dramatic recent advances in AI have come from the approach of deep learning, which has produced major breakthroughs in fields that include game playing, object recognition, and translation. Deep learning builds on ideas from connectionism and theoretical neuroscience, but uses neural networks with more layers and improved algorithms, benefitting from faster computers and large data bases of examples. Another important innovation is combining learning from examples with reinforcement learning, resulting by 2016 in the world’s leading Go player, AlphaGo. Ideas from deep learning are spreading back into neuroscience and also beginning to influence research in cognitive psychology. The explanatory schema for deep learning is:"
    step1: "自 20 世纪 50 年代以来，人工智能一直是认知科学的核心部分，而人工智能最近最戏剧性的进展来自深度学习进路，它在包括游戏、物体识别与翻译在内的领域产生了重大突破。深度学习建立在联结主义与理论神经科学的观念之上，但使用层数更多、算法更优的神经网络，得益于更快的计算机与大型示例数据库。另一项重要创新是把从示例学习与强化学习相结合，至 2016 年产生了世界领先的围棋棋手阿尔法狗。深度学习的观念正在回流到神经科学，并开始影响认知心理学的研究。深度学习的解释图式是："
