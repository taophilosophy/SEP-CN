    source: "Cognitive science raises many interesting methodological questions that are worthy of investigation by philosophers of science. What is the nature of representation? What role do computational models play in the development of cognitive theories? What is the relation among apparently competing accounts of mind involving symbolic processing, neural networks, and dynamical systems? What is the relation among the various fields of cognitive science such as psychology, linguistics, and neuroscience? Are psychological phenomena subject to reductionist explanations via neuroscience? Are levels of explanation best characterized in terms of ontological levels (molecular, neural, psychological, social) or methodological ones (computational, algorithmic, physical)?"
    step1: "认知科学提出许多有趣的、值得科学哲学家研究的方法论问题。表征的本性是什么？计算模型在认知理论的发展中扮演什么角色？涉及符号加工、神经网络与动力系统的明显竞争的心灵说明之间是什么关系？认知科学各领域（如心理学、语言学与神经科学）之间是什么关系？心理现象可经由神经科学作还原论说明吗？说明的层次最好以本体论层次（分子、神经、心理、社会）还是方法论层次（计算、算法、物理）来刻画？"
    step2: "认知科学提出许多有趣的方法论问题，值得科学哲学家研究。表征的本性是什么？计算模型在认知理论的发展中起什么作用？涉及符号加工、神经网络与动力系统的、显然彼此竞争的心灵说明之间是什么关系？心理学、语言学、神经科学等认知科学各领域之间是什么关系？心理现象能否接受经由神经科学的还原论说明？说明的层次，最好以本体论层次（分子、神经、心理、社会）还是方法论层次（计算的、算法的、物理的）来刻画？"
  - id: 55
    source: "The increasing prominence of neural explanations in cognitive, social, developmental, and clinical psychology raises important philosophical questions about explanation and reduction. Anti-reductionism, according to which psychological explanations are completely independent of neurological ones, is becoming increasingly implausible, but it remains controversial to what extent psychology can be reduced to neuroscience and molecular biology. Crucial to answering questions about the nature of reduction are answers to questions about the nature of explanation. Explanations in psychology, neuroscience, and biology in general are plausibly viewed as descriptions of mechanisms, which are combinations of connected parts that interact to produce regular changes. In psychological explanations, the parts are mental representations that interact by computational procedures to produce new representations. In neuroscientific explanations, the parts are neural populations that interact by electrochemical processes to produce new neural activity that leads to actions. If progress in theoretical neuroscience continues, it should become possible to tie psychological to neurological explanations by showing how mental representations such as concepts are constituted by activities in neural populations, and how computational procedures such as spreading activation among concepts are carried out by neural processes."
    step1: "神经说明在认知、社会、发展与临床心理学中日渐突出，引发关于说明与还原的重要哲学问题。反还原论——按照它心理说明完全独立于神经说明——正变得日益不可信，但心理学能在多大程度上还原为神经科学与分子生物学仍有争议。回答关于还原本性的问题，关键在于回答关于说明本性的问题。心理学、神经科学以及一般生物学中的说明，可合理被视为对机制的描述，机制是相互作用的连接部件之组合，以产生规则的变化。在心理说明中，部件是心理表征，它们通过计算程序相互作用以产生新的表征。在神经科学说明中，部件是神经群体，它们通过电化学过程相互作用以产生导致行动的新神经活动。如果理论神经科学继续进步，应当有可能通过表明诸如概念之类的心理表征如何由神经群体中的活动构成、以及诸如概念间激活扩散之类的计算程序如何由神经过程执行，从而把心理说明与神经说明联系起来。"
    step2: "神经说明在认知、社会、发展与临床心理学中日渐突出，引发出关于说明与还原的重要哲学问题。反还原论——即认为心理说明完全独立于神经说明——正变得日益不可信；但心理学能在多大程度上还原为神经科学与分子生物学，仍有争议。回答关于还原本性的问题，关键在于回答关于说明本性的问题。心理学、神经科学乃至一般生物学中的说明，可以合理地视为对机制的描述；机制是相互作用的连接部件之组合，它们相互作用以产生规则的变化。在心理说明中，部件是心理表征，它们通过计算程序相互作用，产生新的表征。在神经科学说明中，部件是神经群体，它们通过电化学过程相互作用，产生导致行动的新神经活动。倘若理论神经科学继续进步，我们应当有可能把心理说明与神经说明联系起来。具体而言，即说明心理表征（如概念）如何由神经群体中的活动构成，以及计算程序（如概念间的激活扩散）如何由神经过程执行。"
  - id: 56
    source: "The increasing integration of cognitive psychology with neuroscience provides evidence for the mind-brain identity theory according to which mental processes are neural, representational, and computational. Other philosophers dispute such identification on the grounds that minds are embodied in biological systems and extended into the world. However, moderate claims about embodiment are consistent with the identity theory because brain representations operate in several modalities (e.g. visual and motor) that enable minds to deal with the world. Another materialist alternative to mind-brain identity comes from recognizing that explanations of mind employ molecular and social mechanisms as well as neural and representational ones."
    step1: "认知心理学与神经科学日益增长的整合，为心脑同一论提供证据，按照该理论心理过程是神经的、表征性的与计算性的。其他哲学家基于心灵被具身于生物系统并延伸入世界而反驳这种同一。然而，关于具身的温和主张与同一论相容，因为大脑表征在若干模态（如视觉与运动）中运作，使心灵能够与世界打交道。心脑同一的另一种唯物论替代，来自承认对心灵的说明既运用分子与社会机制，也运用神经与表征机制。"
    step2: "认知心理学与神经科学日益加深的整合，为心脑同一论提供了证据；按照该理论，心理过程是神经过程，也是表征过程与计算过程。其他哲学家则否认这种同一，理由是心灵具身于生物系统之中，并延伸入世界。不过，关于具身的温和主张与同一论是相容的，因为大脑表征在若干模态（如视觉与运动）中运作，使心灵得以与世界打交道。心脑同一的另一条唯物论替代进路，来自承认对心灵的说明既运用分子与社会机制，也运用神经与表征机制。"
