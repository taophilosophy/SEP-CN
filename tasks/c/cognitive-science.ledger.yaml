  - id: 47
    source: "Some philosophy, in particular naturalistic philosophy of mind, is part of cognitive science. But the interdisciplinary field of cognitive science is relevant to philosophy in several ways. First, the psychological, computational, and other results of cognitive science investigations have important potential applications to traditional philosophical problems in epistemology, metaphysics, and ethics. Second, cognitive science can serve as an object of philosophical critique, particularly concerning the central assumption that thinking is representational and computational. Third and more constructively, cognitive science can be taken as an object of investigation in the philosophy of science, generating reflections on the methodology and presuppositions of the enterprise."
    step1: "某些哲学，尤其是自然主义的心灵哲学，是认知科学的一部分。但认知科学这一跨学科领域在多个方面与哲学相关。第一，认知科学研究在心理学、计算及其他方面的结果，对认识论、形而上学与伦理学中的传统哲学问题有重要的潜在应用。第二，认知科学可作为哲学批判的对象，尤其是关于思维是表征性与计算性这一中心假设。第三，更具建设性地，认知科学可被当作科学哲学的研究对象，引发对该事业的方法论与预设的反思。"
    step2: "有些哲学，尤其是自然主义的心灵哲学，是认知科学的一部分。但认知科学这一跨学科领域与哲学有多方面的关联。其一，认知科学研究在心理学、计算等方面的成果，对认识论、形而上学与伦理学中的传统哲学问题具有重要的潜在应用。其二，认知科学可以作为哲学批判的对象，特别是针对“思维是表征性的、计算性的”这一中心假设。其三，更具建设性的是，认知科学可以被当作科学哲学的研究对象，引发对这门事业的方法论与前提预设的反思。"
  - id: 48
    source: "Much philosophical research today is naturalistic, treating philosophical investigations as continuous with empirical work in fields such as psychology. From a naturalistic perspective, philosophy of mind is closely allied with theoretical and experimental work in cognitive science. Metaphysical conclusions about the nature of mind are to be reached, not by a priori speculation, but by informed reflection on scientific developments in fields such as psychology, neuroscience, and computer science. Similarly, epistemology is not a stand-alone conceptual exercise, but depends on and benefits from scientific findings concerning mental structures and learning procedures. Ethics can benefit by using greater understanding of the psychology of moral thinking to bear on ethical questions such as the nature of deliberations concerning right and wrong. Here are some philosophical problems to which ongoing developments in cognitive science are highly relevant. Links are provided to other relevant articles in this *Encyclopedia.*"
    step1: "今天许多哲学研究是自然主义的，把哲学研究视为与心理学等领域中的经验工作相连续。从自然主义视角看，心灵哲学与认知科学中的理论与实验工作密切结盟。关于心灵本性的形而上学结论，不应通过先验思辨达到，而应通过对心理学、神经科学与计算机科学等领域中科学发展的知情反思达到。类似地，认识论不是独立的概念练习，而是依赖并受益于关于心理结构与学习程序的科学发现。伦理学可以通过把对道德思维心理学的更深入理解应用于伦理问题（如关于对错的思考的本性）而受益。以下是一些认知科学中的持续发展与之高度相关的哲学问题。链接指向本百科全书中其他相关条目。"
    step2: "今天的许多哲学研究是自然主义的，把哲学探究视为与心理学等领域的经验工作连续不断。从自然主义的视角看，心灵哲学与认知科学的理论与实验工作紧密结盟。关于心灵本性的形而上学结论，不应当通过先验思辨得出，而应当通过对心理学、神经科学与计算机科学等领域科学进展的知情反思来得出。同样，认识论也不是一项独立的纯概念训练，而是依赖并得益于关于心理结构与学习程序的科学发现。伦理学也能受益，只要把对道德思维心理学的更深入理解运用于对错之辨等伦理问题。以下列举一些哲学问题，认知科学的持续进展与它们高度相关。文中附有指向本百科全书其他相关条目的链接。"
