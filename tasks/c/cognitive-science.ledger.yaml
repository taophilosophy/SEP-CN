    source: "Theoretical neuroscience is the attempt to develop mathematical and computational theories and models of the structures and processes of the brains of humans and other animals. It differs from connectionism in trying to be more biologically accurate by modeling the behavior of large numbers of realistic neurons organized into functionally significant brain areas. Computational models of the brain have become biologically richer, both with respect to employing more realistic neurons such as ones that spike and have chemical pathways, and with respect to simulating the interactions among different areas of the brain such as the hippocampus and the cortex. These models are not strictly an alternative to computational accounts in terms of logic, rules, concepts, analogies, images, and connections, but should mesh with them and show how mental functioning can be performed at the neural level. The explanatory schema for theoretical neuroscience is:"
    step1: "理论神经科学是发展关于人类与其他动物大脑的结构与过程的数学与计算理论与模型的尝试。它与联结主义的不同之处在于，它通过为组织成具有功能意义的大脑区域的大量真实神经元的行径建模，试图更生物学地精确。大脑的计算模型在生物学上已变得更丰富，无论是就采用更真实的神经元（如会放电、具有化学通路的神经元）而言，还是就模拟海马体与皮层等大脑不同区域之间的相互作用而言。这些模型并非严格地替代以逻辑、规则、概念、类比、意象与连接为基础的计算说明，而应与之相互契合，并表明心理功能如何在神经层面被实现。理论神经科学的解释图式是："
    step2: "理论神经科学是发展关于人类及其他动物大脑结构与过程的数学与计算理论与模型的努力。它与联结主义的不同在于，它试图更具生物学精确性，为组织成具有功能意义的大脑区域的大量真实神经元的行为建模。大脑的计算模型在生物学上已日益丰富，无论就采用更真实的神经元（如会放电、具有化学通路的神经元）而言，还是就模拟海马体与皮层等大脑不同区域之间的相互作用而言。这些模型并非严格地替代以逻辑、规则、概念、类比、意象与连接为基础的计算说明，而应与之相互契合，并表明心理功能如何在神经层面得以实现。理论神经科学的解释图式是："
