    source: "Imagery can aid learning, and some metaphorical aspects of language may have their roots in imagery. Psychological experiments suggest that visual procedures such as scanning and rotating employ imagery, and neurophysiological results confirm a close physical link between reasoning with mental imagery and perception. Imagery is not just visual, but can also operate with other sensory experiences such as hearing, touch, smell, taste, pain, balance, nausea, fullness, and emotion."
    step1: "意象可辅助学习，语言的一些隐喻方面可能扎根于意象。心理实验表明，扫描与旋转等视觉程序运用意象，而神经生理结果确认了用心理意象推理与知觉之间存在密切的物理联系。意象不只是视觉的，也可与听觉、触觉、嗅觉、味觉、痛觉、平衡、恶心、饱胀与情绪等其他感觉经验运作。"
    step2: "意象有助于学习，语言的一些隐喻层面可能植根于意象。心理实验表明，扫描与旋转等视觉程序运用了意象；神经生理学的结果则确认，用心理意象进行推理与知觉之间存在紧密的物理关联。意象并不限于视觉，还可与听觉、触觉、嗅觉、味觉、痛觉、平衡、恶心、饱胀与情绪等其他感官经验一同运作。"
