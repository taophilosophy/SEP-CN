    source: "Active inference is open to numerous challenges. Is brain functioning really Bayesian updating rather than connectionist constraint satisfaction or deep reinforcement learning? Can predictive processing subsume other brain functions that include pattern recognition, explanation, emotional evaluation, memory, and communication? Does active inference explain high-level cognitive operations such as causal reasoning, language, and creativity?"
