    source: "Bayesian models are prominent in cognitive science, with applications to such psychological phenomena as learning, vision, motor control, language, and social cognition. They have also had effective applications in robotics. The Bayesian approach assumes that cognition is approximately optimal in accord with probability theory, especially Bayes’ theorem, which says that the probability of a hypothesis given evidence is equal to the result of multiplying the prior probability of the hypothesis by the conditional probability of the evidence given the hypothesis, all divided by the probability of the evidence. The explanatory schema for Bayesian cognition is:"
    step1: "贝叶斯模型在认知科学中十分突出，应用于学习、视觉、运动控制、语言与社会认知等心理现象。它们也在机器人学中有有效应用。贝叶斯进路假设认知依据概率论而近似最优，尤其是贝叶斯定理，它说：给定证据时假设的概率，等于假设的先验概率乘以给定假设时证据的条件概率，再除以证据的概率。贝叶斯认知的解释图式是："
    step2: "贝叶斯模型在认知科学中十分显赫，其应用遍及学习、视觉、运动控制、语言与社会认知等心理现象，并在机器人学中也有有效应用。贝叶斯进路假定，认知依据概率论而近似最优，尤其是贝叶斯定理：给定证据时某一假设的概率，等于该假设的先验概率乘以给定该假设时证据的条件概率，再除以证据的概率。贝叶斯认知的解释图式是："
