  - id: 52
    source: |-
      1. The emotion challenge: Cognitive science neglects the important role of emotions in human thinking.
      2. The consciousness challenge: Cognitive science ignores the importance of consciousness in human thinking.
      3. The world challenge: Cognitive science disregards the significant role of physical environments in human thinking, which is embedded in and extended into the world.
      4. The body challenge: Cognitive science neglects the contribution of embodiment to human thought and action.
      5. The dynamical systems challenge: The mind is a dynamical system, not a computational system.
      6. The social challenge: Human thought is inherently social in ways that cognitive science ignores.
      7. The mathematics challenge: Mathematical results show that human thinking cannot be computational in the standard sense, so the brain must operate differently, perhaps as a quantum computer.
      8. The interdisciplinarity challenge: Cognitive science has failed to go beyond multidisciplinary interactions by developing a core theory that unifies work in its many disciplines.
    step1: |-
      1. 情绪挑战：认知科学忽视了情绪在人类思维中的重要作用。
      2. 意识挑战：认知科学忽略了意识在人类思维中的重要性。
      3. 世界挑战：认知科学无视物理环境在人类思维中的重要作用，而人类思维是嵌入世界并延伸入世界的。
      4. 身体挑战：认知科学忽视了具身对人类思想与行动的贡献。
      5. 动力系统挑战：心灵是动力系统，而非计算系统。
      6. 社会挑战：人类思维本质上是社会的，而认知科学忽视了这一点。
      7. 数学挑战：数学结果表明，人类思维不可能是标准意义上的计算的，因此大脑必须以不同方式运作，或许作为量子计算机。
      8. 跨学科挑战：认知科学未能超越多学科互动，通过发展一种统一其众多学科工作的核心理论。
