  - id: 53
    source: "The first five challenges are increasingly addressed by advances that explain emotions, consciousness, action, and embodiment in terms of neural mechanisms. The social challenge is being met by the development of computational models of interacting agents. The mathematics challenge is based on misunderstanding of Gödel’s theorem and on exaggeration of the relevance of quantum theory to neural processes. Response to the interdisciplinary challenge must recognize that cognitive science still has many contending theoretical approaches, without the unification that theories of evolution and genetics provide for biology. Nevertheless, interactions among psychology, neuroscience, linguistics, philosophy, anthropology, and computer modeling have contributed to theoretical and empirical progress concerning many aspects of cognition. For example, [computational philosophy](https://plato.stanford.edu/entries/computational-philosophy/#Intr) uses programmed models to address questions in epistemology, ethics, and other areas of philosophy."
    step1: "前五个挑战正日益被以神经机制说明情绪、意识、行动与具身的进展所应对。社会挑战正通过发展相互作用主体的计算模型而应对。数学挑战基于对哥德尔定理的误解，以及夸大量子理论与神经过程的相关性。对跨学科挑战的回应必须承认，认知科学仍有许多相互竞争的理论进路，缺少进化论与遗传学为生物学提供的统一。然而，心理学、神经科学、语言学、哲学、人类学与计算机建模之间的互动，已对关于认知许多方面的理论与经验进步作出贡献。例如，[计算哲学](https://plato.stanford.edu/entries/computational-philosophy/#Intr) 使用程序化模型来处理认识论、伦理学与哲学其他领域中的问题。"
    step2: "前五个挑战，正日益被那些以神经机制说明情绪、意识、行动与具身的进展所回应。社会挑战则通过发展关于相互作用主体的计算模型来应对。数学挑战建立在对哥德尔定理的误解之上，也建立在对量子理论与神经过程之相关性的夸大之上。回应跨学科挑战时，必须承认认知科学仍有众多相互竞争的理论进路，缺少进化论与遗传学为生物学所提供的那种统一。尽管如此，心理学、神经科学、语言学、哲学、人类学与计算机建模之间的互动，已为认知诸多方面的理论与经验进步作出贡献。例如，[计算哲学](https://plato.stanford.edu/entries/computational-philosophy/#Intr) 运用程序化模型处理认识论、伦理学及其他哲学领域的问题。"
