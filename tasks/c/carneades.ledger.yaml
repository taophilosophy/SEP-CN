      斯多亚派主张，万事皆由命运而生。他们把命运界定为“原因的有序序列：原因与原因相连，相继产生每一事物，永恒地川流不息”（Cicero *De divinatione* I 125; Gellius *Noctes Atticae* 7.2.1-3 = L&S 55 K）。在此语境中断言万物皆被命定，就是主张每个事件都是足以产生它的先行原因的结果。换言之，斯多亚派是决定论者。他们也接受决定论的一些熟知蕴含，例如：一个足够强大的理智，只要对世界状态有完备把握，就能预言每个未来事件（*De divinatione* I 127 = LS 55 O）。他们还面对决定论似乎呈现的那些熟悉难题。倘若人是决定论宇宙的一部分，且其每个行动都是先于他们存在的那些原因的预定结果，那么便有一种貌似有理的论证：我们的一切行动都不自愿；用古代论争中常说的话，没有什么取决于我们，或在我们的力量之内。在任何情形下我们都不可能作出异于我们实际所作的事。由此似乎可以推出，我们不对自己的行动负责；而随之而来的是，谴责或惩罚便无由成立，因为谴责与惩罚以我们至少对所作所为的某些部分负有道德责任为前提。他们为这一难题辩护了一种第一个得到充分阐述的相容论理论——据之，自愿行动与决定论相容——从而自认为圆满地解决了它。
