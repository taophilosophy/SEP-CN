      Our principal source for the Hellenistic phase of the first debate and Carneades’ contributions to it is Cicero’s *De fato*, which has survived only in an incomplete form. (A Latin text with an English translation and helpful notes is found in Sharples, 1991; older but still useful is Bayer, 1963 with a German translation and notes. On the debate as a whole, see Bobzien, 1998). It is clear from the *De fato* that Carneades took on both the Stoics and the Epicureans. Cicero’s presentation suggests that he may have defended a consistent position distinct from theirs. If he did, here as elsewhere we do not need to decide whether he endorsed it *in propria persona* or put it forward as an alternative to challenge to the positions on offer. It was at least the latter, serving to show the Epicureans and the Stoics that there was another, arguably better, way to tackle the issues, one that avoided the most troubling and implausible choices to which they had been led in the construction of their own theories.
    step1: |
      关于第一场争论的希腊化阶段及卡涅阿德斯对其的贡献，我们的主要文献是西塞罗的《论命运》，它仅以不完整的形式传世。（拉丁文本连同英译与有用注释见 Sharples, 1991；较早但仍有用的是 Bayer, 1963，附德译与注释。关于整场争论，见 Bobzien, 1998。）从《论命运》可以清楚看出，卡涅阿德斯同时向斯多亚派与伊壁鸠鲁派发难。西塞罗的呈现表明，他可能辩护了一种与他们不同的、前后一致的立场。如果他确实如此，那么在这里与在其他地方一样，我们无需判定他是以本人身份（*in propria persona*）认可它，还是把它作为挑战现成立场的一个替代方案提出。它至少是后者：用以向伊壁鸠鲁派与斯多亚派表明，还有另一种、可以说更好的处理这些问题的方式，一种避免他们建构自己理论时被引向的最令人困扰、最不可信的抉择的方式。
