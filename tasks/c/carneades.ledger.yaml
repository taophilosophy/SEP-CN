      着手处理伦理学，卡涅阿德斯采取了他在认识论中同样的做法，构建了一个旨在把握并公正对待伦理理论背后动机的框架。他的框架不仅对人们曾经持有的一切关于人生目的或终极目的的观点作了分类，也对人们可能持有的一切此类观点作了分类（Cicero, *Fin.* 5.16–21 = L&S 64EG; cf. Algra, 1997）。他从一个假定出发：实践智慧——我们成功经营生活所需的知识——必须有一个对象。也就是说，它必须是关于某种非其自身的东西的知识。这立即排除了那些把人的善等同于知识、却对除此之外它可能是关于什么的知识避而不谈的观点（循环性的威胁早已被柏拉图注意到，*Republic* 505bc）。他进一步假定，这一对象必须是人类对其有自然冲动的东西。他主张，这样的对象有三种可能：快乐、免除痛苦、以及健康与力量等自然的优势。德性的原则与这一初始选择相对应：有德就是着眼于获得其中之一而行动。关于人生目的有六种简单观点，其中三种把目的等同于德性，即着眼于获得快乐、免除痛苦或自然的优势而行动；另三种则把它等同于实际获得其中一个对象。三种复合观点把目的视为德性与实际获得相应对象的结合。因此共有九种观点。斯多亚派的立场——德性是唯一的善——是所提及的第三种观点，即目的是着眼于获得自然的优势而行动，无论是否获得它们。
