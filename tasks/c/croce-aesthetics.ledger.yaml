      就我们的目的而言，最简单的做法是把克罗齐视为一个唯心论者，对他来说除了心灵别无他物。所以在那种意义上，艺术作品是一个观念的对象或心理对象，与其他一切并列；这并不令人惊讶，但也没有兴味。但他仍坚持通常的、平凡的对心理之物（思想、希望、梦想）与物理之物（桌子、树）的区分。而在这条分界线上，对克罗齐而言，艺术作品*仍然*是心理之物。换言之，艺术作品是*双重*观念的；换一种说法，*即使克罗齐是二元论者*——或是一个拥有某种重建物理—心理区分之手段的物理主义者——艺术作品仍将是心理的。因此，在以下论述中，除另有说明外，我们将把克罗齐视为在唯心论、物理主义或二元论之间持不可知态度（见 *PPH* 227）。
