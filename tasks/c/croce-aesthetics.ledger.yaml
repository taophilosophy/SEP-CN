  - id: seg-001
    source: |-
      The Neapolitan Benedetto Croce (1860–1952) was a dominant figure in the first half of the twentieth century in aesthetics and literary criticism, and to lesser but not inconsiderable extent in philosophy generally. But his fame did not last, either in Italy or in the English speaking world. He did not lack promulgators and willing translators into English: H. Carr was an early example of the former, R. G. Collingwood was perhaps both, and D. Ainslie did the latter service for most of Croce’s principal works. But his star rapidly declined after the Second World War.
    step1: |-
      那不勒斯的贝内德托·克罗齐（Benedetto Croce，1860–1952）是二十世纪上半叶美学与文学批评领域的主导人物，在一般哲学领域也有一定但并非微不足道的影响。但他的名声并未持久，无论在意大利还是在英语世界。他并不缺少宣扬者与自愿将其译为英文的人：H. Carr 是前者的早期例子，R. G. Collingwood 或许两者兼是，而 D. Ainslie 则为克罗齐的大部分主要著作做了后者这项工作。但他的星运在第二次世界大战后迅速衰落。
    step2: |-
      那不勒斯的贝内德托·克罗齐（Benedetto Croce，1860–1952）是二十世纪上半叶美学与文学批评领域的主导人物，在一般哲学上也有一定影响，虽并非微不足道。然而他的名声并未持久，无论意大利还是英语世界皆然。他从不缺少宣扬者，也不缺少自愿将其译成英文的人：H. Carr 是前者的早期例子，R. G. Collingwood 或许两者兼之，而 D. Ainslie 则为克罗齐的大部分主要著作做了后一项工作。但第二次世界大战后，他的光芒迅速黯淡。
  - id: seg-002
    source: |-
      Indeed it is hard to find a figure whose reputation has fallen so far and so quickly; this is somewhat unfair not least because Collingwood’s aesthetics is still studied, when its many of its main ideas are often thought to have been borrowed from Croce. The causes are a matter for speculation, but two are likely. First, Croce’s general philosophy was very much of the preceding century. As the idealistic and historicist systems of Bradley, Green, and Joachim were in Britain superseded by Russell, Moore and Ayer, and analytical philosophy in general, Croce’s system was swept away by new ideas on the continent—from Heidegger and Sartre on the one hand to deconstructionism on the other. Second, Croce’s manner of presentation in his famous early works now seems, not to put too fine a point on it, dismissively dogmatic; it is full of the youthful conviction and fury that seldom wears well. On certain key points, opposing positions are characterized as foolish, or as confused expressions of simple truths that only waited upon Croce to articulate properly (yet his later exchange with John Dewey—see Croce 1952, Douglas 1970, Vittorio 2012—finds him more earnestly accountable)[^douglas-1970][^vittorio-2012].
    step1: |-
      的确，很难找到一个声誉跌落得如此之远、如此之快的人物；这多少有些不公平，尤其是因为柯林武德的美学至今仍被研究，而它的许多主要观念常被认为借自克罗齐。其原因只能推测，但有两项很可能。第一，克罗齐的一般哲学非常属于前一个世纪。当布拉德利、格林与约阿希姆的唯心主义与历史主义体系在英国被罗素、摩尔、艾耶尔及一般的分析哲学所取代时，克罗齐的体系则被欧洲大陆的新观念扫荡而去——一边是海德格尔与萨特，另一边是解构主义。第二，克罗齐在其著名早期著作中的表达方式，如今看来（说得直白些）是轻蔑独断的；它充满了年轻人的自信与激情，而这种东西很少经得住时间。在某些关键点上，对立立场被描绘为愚蠢，或被描绘为简单真理的混乱表达，而这些真理只等着克罗齐来恰当地阐明（然而他后来与约翰·杜威的交流——见 Croce 1952, Douglas 1970, Vittorio 2012——使他显得更认真地承担责任）[^douglas-1970][^vittorio-2012]。
    step2: |-
      的确，很难再找到一位声誉跌落得如此之远、如此之快的人物；这多少有些不公，尤其是因为柯林武德的美学至今仍有人研究，而它的许多主要观念常被看作借自克罗齐。原因只能猜测，但有两项很有可能。其一，克罗齐的一般哲学非常属于前一个世纪。当布拉德利、格林与约阿希姆的唯心主义与历史主义体系在英国被罗素、摩尔、艾耶尔以及一般的分析哲学取代时，克罗齐的体系则被欧洲大陆的新观念扫荡而去——一边是海德格尔与萨特，另一边是解构主义。其二，克罗齐在其著名早期著作中的表达方式，如今看来（说得直白些）带有轻蔑的独断；它充满了年轻人的自信与激情，而这类东西很少能经得起岁月的考验。在某些关键点上，对立立场被说成是愚蠢的，或是简单真理的混乱表达——这些真理只等克罗齐来恰当地道出（不过他后来与约翰·杜威的交流——见 Croce 1952, Douglas 1970, Vittorio 2012——倒使他显得更为恳切地负责）[^douglas-1970][^vittorio-2012]。
  - id: seg-003
