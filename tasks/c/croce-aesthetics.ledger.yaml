      正因如此，克罗齐把形式与内容之区分的某些美学应用贬为混乱。这一区分只在一个理论层面适用，即对一种被设定的*先验*综合（*EA* 39–40）。在那个层面，一个直觉的突现*就是*一种形式的出现（我们有权谈论直觉的*形成*，即直觉是*被形成的*）。在美学层面——或可说在现象学层面——不存在独立于我们所遇之形式的内容识别，也不存在独立于内容的形式识别。说一件艺术作品形式好而内容差，或内容好而形式差，是毫无意义的。
