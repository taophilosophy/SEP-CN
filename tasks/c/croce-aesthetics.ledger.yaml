      事实上，绝大多数概念——房屋、爬行动物、树——只是对事物的偶然集合，是为回应实践需要而形成的，因而无论相应科学的结果多么精确，它们都无法达到真或知识。数学的概念也未能逃脱“伪”的标签。相比之下，克罗齐所谓的纯概念的特征在于它们具有表现性、普遍性与具体性，并通过*先验*综合来履行其职能（这说明了上文提到的*性质*）。这意味着，我们所能知觉或想象的一切——每一个表象或直觉——必然具有这三者：没有一种可能的经验不是关于某个具体的东西，不是就其为某个绝对一般之物的实例而言是普遍的，不是表现性的（即容许言语表达）。那么，经验概念如*热*，是具体的但不是普遍的；数学概念如*数*，是普遍的但不是具体的。纯概念的例子很少，但克罗齐所承认的有*目的性*、*性质*与*美*。在克罗齐的方案中，这就是逻辑的领域。
