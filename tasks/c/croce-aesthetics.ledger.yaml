      The painting of pictures, the scrape of the bow upon strings, the chanting or inscription of a poem are, for Croce, only contingently related to the work of art, that is, to the expressed intuition. By this Croce does not mean to say that for example the painter could get by without paint in point of fact; the impossibility of say the existence of Leonardo’s *Last Supper* without his having put paint on the wall of Santa Maria delle Grazie is not an impossibility in principle, but it is a factual impossibility, like that of a man jumping to the Moon. What he is doing is always driven by the intuition, and thereby making it possible for others to have the intuition (or rather, *an* intuition). First, the memory—though only contingently—often requires the physical work to sustain or develop the intuition. Second, the physical work is necessary for the practical business of the *communication* of the intuition.
    step1: |-
      对克罗齐而言，绘画、琴弓在弦上的刮擦、诗歌的吟诵或书写，都与艺术作品（即被表现的直觉）只有偶然的关系。克罗齐并非此意：例如，画家事实上并非没有颜料也能应付；说列奥纳多的《最后的晚餐》（*Last Supper*）若没有他把颜料涂在圣玛丽亚感恩教堂的墙上就不可能存在，这并不是原则上的不可能，而是事实上的不可能，如同一个人跳上月球的不可能。他所做的总是由直觉所驱动，并由此使他人有可能拥有这一直觉（或更确切地说，拥有*一个*直觉）。首先，记忆——尽管只是偶然地——常常需要物理作品来维持或发展直觉。其次，物理作品对于直觉的*交流*这一实际事务是必要的。
    step2: |-
