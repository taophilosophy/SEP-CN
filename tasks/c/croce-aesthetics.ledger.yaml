      就我们的目的而言，克罗齐的观念与其表面上的追随者柯林武德的观念之间有一个关键差别，它出现在我们追问：直觉的构成要素是什么？对柯林武德——他在 1930 年代中期写作——而言，直觉由感觉材料构成，罗素学说的唯一重要修订在于：感觉材料从不简单，而是包含分析所揭示的感觉性与情感性成分。对克罗齐而言，直觉是一个有机整体，把它分析为原子总是一种错误的抽象：直觉永远无法用这类要素重建。（尽管是形式逻辑的死敌，克罗齐确实分享弗雷格的洞见：语言中真正有意义的单位是句子；弗雷格在 1884 年写道：“只有在句子的语境中，词才有意义”。）
