version: 1
slug: condemnation
segments:
  - id: 1
    source: |
On March 7, 1277, the Bishop of Paris, Stephen Tempier, prohibited the teaching of 219 philosophical and theological theses that were being discussed and disputed in the faculty of arts under his jurisdiction. Tempier's condemnation has gained great symbolic meaning in the minds of modern intellectual historians, and possibly for this reason, there is still considerable disagreement about what motivated Tempier to promulgate his prohibition, what exactly was condemned, and who the targets were. In addition, the effects of Tempier's action on the course of medieval thought in the thirteenth and fourteenth centuries, and even beyond, has been the subject of much debate. The lack of a commonly accepted standard account of Tempier's actions plus the enormous amount of literature and of textual evidence that either directly or indirectly bears on the events of 1277, puts specific limitations to the present entry. It will be confined to presenting those historical facts that are uncontroversial and to indicating the main issues of current debate with respect to Tempier's condemnation.
    step1: |
1277 年 3 月 7 日，巴黎主教斯蒂芬·唐皮耶禁止讲授 219 条在其管辖之下的文学院中被讨论和争辩的哲学与神学命题。唐皮耶的谴责在现代思想史家心中获得了巨大的象征意义，可能正因如此，关于是什么促使唐皮耶颁布其禁令、究竟谴责了什么、以及目标是谁，仍然存在相当大的分歧。此外，唐皮耶的行动对十三、十四世纪乃至更晚时期中世纪思想进程的影响，一直是大量辩论的主题。缺乏一个普遍接受的关于唐皮耶行动的标准化叙述，加上直接或间接涉及 1277 年事件的巨量文献与文本证据，给本词条带来了特定限制。它将仅限于呈现那些无争议的历史事实，并指出当前关于唐皮耶谴责之争论的主要问题。
    step2: |
1277 年 3 月 7 日，巴黎主教斯蒂芬·唐皮耶（Stephen Tempier）下令禁止讲授 219 条在其辖下文学院中被人讨论、争辩的哲学与神学命题。唐皮耶的这次谴责，在现代思想史家心目中获得了巨大的象征意义；也正因如此，关于究竟是什么促使唐皮耶颁布此项禁令、所谴责的究竟为何物、其矛头又指向谁，至今仍存在相当大的分歧。此外，唐皮耶此举对十三、十四世纪乃至更后世中世纪思想进程所产生的影响，也一直是聚讼纷纭的课题。由于缺乏一个普遍认可的、关于唐皮耶行动的标准化叙述，再加上直接或间接涉及 1277 年事件的文献与文本证据浩如烟海，本词条因此受到特定限制：它只呈现那些没有争议的历史事实，并指明当前围绕唐皮耶谴责之争论的主要问题。
  - id: 2
    source: |
The traditional picture of the events leading to Bishop Tempier's condemnation looks something like this. On January 18, 1277 Pope John XXI informed Stephen Tempier, Bishop of Paris, in a letter that he had heard rumors of heresy and charged him with the task of examining (*facias inspici vel inquiri*) where and by whom these errors had been disseminated (CUP 1: 541). On March 7, 1277, Bishop Tempier published his list of 219 theological and philosophical theses (*articuli*) and of some books that were condemned. Anyone teaching or listening to the listed errors would be excommunicated, unless they turned themselves in to the bishop or the chancellor within seven days, in which case the bishop would inflict proportionate penalties (CUP 1: 543).
    step1: |
关于导致唐皮耶主教谴责之事件的传统图景大致是这样的。1277 年 1 月 18 日，教皇约翰二十一世在信中告知巴黎主教斯蒂芬·唐皮耶，他听说了异端的谣言，并委派他调查（*facias inspici vel inquiri*）这些错误在何处、由谁传播（CUP 1: 541）。1277 年 3 月 7 日，唐皮耶主教公布了他的 219 条神学与哲学命题（*articuli*）以及一些被谴责的书籍的清单。任何讲授或听讲所列错误的人将被绝罚，除非他们在七天内向主教或校监自首，在这种情况下主教将处以相应的惩罚（CUP 1: 543）。
    step2: |
关于导致唐皮耶主教谴责的事件，传统图景大致如下。1277 年 1 月 18 日，教皇约翰二十一世（Pope John XXI）致函巴黎主教斯蒂芬·唐皮耶，告知他自己听闻了异端的传言，并责成他查明（*facias inspici vel inquiri*）这些错误是在何处、由何人散布（CUP 1: 541）。1277 年 3 月 7 日，唐皮耶主教公布了他的清单，列有 219 条神学与哲学命题（*articuli*），以及若干遭谴责的书籍。任何讲授或听讲所列错误者，都将被处以绝罚；除非他们在七日内向主教或校监自首，此种情况下主教将课以相应的惩罚（CUP 1: 543）。
  - id: 3
    source: |
Since this papal letter precedes Tempier's condemnation, it has been generally assumed that Tempier acted on papal initiative, and moreover, acted in an overzealous and hasty way. In his letter, the pope merely requested Tempier to investigate rumors of false teaching, whereas the latter responded by drawing up a list of 219 false propositions. Furthermore, only about six weeks elapsed between the papal instructions and Tempier's publication of this list, a list which has been characterized by historians as repetitious and disorderly.
    step1: |
由于这封教皇书信先于唐皮耶的谴责，人们普遍假定唐皮耶是奉教皇之命行事，而且行事过于热心、仓促。教皇在信中只是要求唐皮耶调查虚假教导的谣言，而后者却以拟定一份 219 条虚假命题的清单作为回应。此外，从教皇的指示到唐皮耶公布这一清单，只过了约六周；这份清单被历史学家描述为重复而杂乱。
    step2: |
由于这封教皇书信早于唐皮耶的谴责，人们普遍认定唐皮耶是奉教皇之命行事，而且行事过于热切、过于仓促。教皇在信中不过是要求唐皮耶去调查有关虚假教导的传言，而唐皮耶却以拟定一份列有 219 条虚假命题的清单作为回应。再者，从教皇指示到唐皮耶公布这份清单，中间只隔了约六周；而这份清单被历史学家评为重复冗杂、毫无条理。
  - id: 4
    source: |
Unfortunately, the chain of events leading up to Tempier's condemnation still is not totally clear. If Tempier, indeed, acted on a papal mandate, it is surprising that he does not mention it in the introduction to his syllabus of errors, but merely indicates that he had received information from important people (Who these "important people" may have been is a question that will be addressed below).
    step1: |
不幸的是，导致唐皮耶谴责的事件链条至今仍不完全清楚。如果唐皮耶确实奉教皇之命行事，那么令人惊讶的是，他在其谬误纲要的导言中并未提及此事，而只是表示他从重要人物那里收到了信息（这些“重要人物”可能是谁，是下文将讨论的问题）。
    step2: |
可惜的是，通向唐皮耶谴责的那条事件链条至今仍非全然明晰。倘若唐皮耶确曾奉教皇之命行事，那么奇怪的是，他在其谬误纲要的导言里对此只字未提，而仅仅表示他从若干要人处获得了情报（这些“要人”究竟是谁，是下文要处理的问题）。
  - id: 5
    source: |
Another puzzling aspect concerning the course of events sketched above is the papal letter "*Flumen aquae vivae*" of April 28, 1277, that is, more than forty days after Tempier had promulgated his list of condemned articles. Curiously enough, this letter gives no indication whatsoever that the pope knew about Tempier's action. On the contrary, the pope grants a mandate to Tempier to notify him, the pope, about new errors, and to inform him about the names of the propagators of these errors, about their followers, and about their writings. Pope John's second letter is a further specification of his first: he now indicates the culprits, namely "some scholars of arts and in the faculty of theology at Paris" (*nonnulli tam in artibus quam in theologica facultate studentes Parisius*). In addition, its purpose is more focused. The pope will use the dossier that he has requested from the bishop to establish – with the help of an advisory committee – the nature of the errors and to decide whether they will have to be recanted, or condemned and whether the University of Paris will need to be reformed.
    step1: |
关于上述事件进程的另一个令人困惑之处，是 1277 年 4 月 28 日的教皇书信“*Flumen aquae vivae*”，也就是说，在唐皮耶公布其被谴责条目清单四十多天之后。奇怪的是，这封信完全没有表明教皇知道唐皮耶的行动。相反，教皇授权唐皮耶向他（教皇）通报新的错误，并告知他这些错误的传播者、其追随者及其著作的名字。约翰教皇的第二封信是其第一封信的进一步具体化：他现在指出了肇事者，即“巴黎文学院与神学院的一些学者”（*nonnulli tam in artibus quam in theologica facultate studentes Parisius*）。此外，其目的更加集中。教皇将利用他向主教索取的材料，在咨询委员会的帮助下，确定这些错误的性质，并决定它们是必须被撤回，还是被谴责，以及巴黎大学是否需要改革。
    step2: |
上述事件进程的另一个令人费解之处，是 1277 年 4 月 28 日的教皇书信“*Flumen aquae vivae*”——那已是唐皮耶公布其被谴责条目清单四十多天之后。说来奇怪，这封信丝毫未表明教皇知晓唐皮耶的行动。恰恰相反，教皇授权唐皮耶向他（教皇）通报新出现的错误，并告知他这些错误的传播者、其追随者及其著作的名号。约翰教皇的第二封信是其第一封的进一步细化：他现在点明了肇事者，即“巴黎文学院与神学院的一些学者”（*nonnulli tam in artibus quam in theologica facultate studentes Parisius*）。此外，其用意更为集中。教皇将借助他向主教索取的材料，并在一个咨询委员会的协助下，确定这些错误的性质，并裁决它们是需要被撤回、还是遭谴责，以及巴黎大学是否需要改革。
  - id: 6
    source: |
In short, the evidence also allows another scenario, namely that Tempier did not act on the pope's instigation, but was already in the process of preparing his condemnation when he received the papal letter of January 18, 1277. In this scenario of events, the papal letter *Flumen aquae vivae* crossed the letter in which Tempier announced the condemnation.
    step1: |
简言之，证据也允许另一种情形，即唐皮耶并非奉教皇的唆使行事，而是在收到 1277 年 1 月 18 日的教皇书信时，已经在准备他的谴责。在这种事件情形中，教皇书信 *Flumen aquae vivae* 与唐皮耶宣布谴责的信件交错而过。
    step2: |
简言之，证据也容许另一种情形：唐皮耶并非受教皇唆使而行，而是在接到 1277 年 1 月 18 日的教皇书信时，就已着手准备他的谴责。在这一事件情形下，教皇书信 *Flumen aquae vivae* 与唐皮耶宣告谴责的那封信，是在途中交错的。
  - id: 7
    source: |
Tempier's condemnation is only one of the approximately sixteen lists of censured theses that were issued at the University of Paris during the thirteenth and fourteenth centuries. Most of these lists of propositions were put together into systematic collections of prohibited articles. One of the earliest of these collections of medieval condemned articles originated towards the end of the thirteenth century under the name of Parisian Articles or also *Collectio errorum in anglia et parisius condempnatorum*. Initially this collection consisted of twenty-two chapters presenting the errors condemned in 1277 by Archbishop Robert Kilwardby at Oxford, in 1241 by Bishop William of Alvernia in Paris, and in 1270 and 1277 by Bishop Stephen Tempier in Paris (in this order).
    step1: |
唐皮耶的谴责只是十三、十四世纪巴黎大学发布的约十六份被谴责命题清单之一。这些命题清单大多被汇编成系统的被禁条目集成。这些中世纪被谴责条目集成中最早的一批之一，起源于十三世纪末，名为“巴黎条目”或 *Collectio errorum in anglia et parisius condempnatorum*。最初，这个集成由二十二章组成，呈现了 1277 年罗伯特·基尔沃比大主教在牛津谴责的错误、1241 年阿韦尔尼亚的威廉主教在巴黎谴责的错误，以及 1270 年和 1277 年斯蒂芬·唐皮耶主教在巴黎谴责的错误（按此顺序）。
    step2: |
唐皮耶的谴责，不过是十三、十四世纪间巴黎大学发布的约十六份被谴责命题清单中的一份。这些命题清单大多被汇编为若干系统的被禁条目集成。这批中世纪被谴责条目集成中最早的一种，源自十三世纪末，名为“巴黎条目”，亦称 *Collectio errorum in anglia et parisius condempnatorum*。该集成最初由二十二章组成，依次呈现了 1277 年罗伯特·基尔沃比（Robert Kilwardby）大主教在牛津谴责的错误、1241 年阿韦尔尼亚的威廉（William of Alvernia）主教在巴黎谴责的错误，以及 1270 年与 1277 年斯蒂芬·唐皮耶主教在巴黎谴责的错误（按此顺序）。
  - id: 8
    source: |
During the fourteenth century, this Collection grew significantly, so that, in fact, a second, augmented Collection came into existence. All the propositions that were added to the first compilation had been condemned in the fourteenth century at the University of Paris. It can be seen as a collection of verdicts, which at the opening of each new set of verdicts provides information about the parties involved and the date. The verdicts are not motivated, nor does the collection provide an account of the events (*narratio*).
    step1: |
在十四世纪，这个集成显著增长，以至于事实上出现了一个增补的第二集成。所有添加进第一汇编的命题，都是十四世纪在巴黎大学被谴责的。它可以被视为一份判决集成，在每一组新判决的开头提供有关涉案各方和日期的信息。这些判决没有说明理由，集成也没有提供事件的叙述（*narratio*）。
    step2: |
到了十四世纪，这一集成大为扩充，以致事实上形成了一个增补的第二集成。凡添入第一汇编的命题，皆为十四世纪在巴黎大学遭谴责者。它可视为一份判决集成，在每一组新判决的开端，都载明涉案各方与日期。这些判决并不说明理由，集成也未提供对事件经过的叙述（*narratio*）。
  - id: 9
    source: |
The collection of Parisian Articles must have had some kind of official status, and must have circulated among medieval scholars. Bachelors in theology were required by oath not to maintain anything "in favor of articles that have been condemned at the Roman curia or in Paris." Moreover, many medieval philosophical and theological texts contain references to and quotations from the "Parisian articles," which by no means should always be identified with Tempier's list of condemned articles.
    step1: |
巴黎条目集成必定具有某种官方地位，并必定在中世纪学者中流传。神学学士被要求宣誓不坚持任何“有利于在罗马教廷或巴黎被谴责的条目”的东西。此外，许多中世纪哲学与神学文本都包含对“巴黎条目”的引用和引文，而这些绝不能总是等同于唐皮耶的被谴责条目清单。
    step2: |
巴黎条目集成想必具有某种官方地位，也必在中世纪学者间流传。神学学士须宣誓，不得坚持任何“有利于在罗马教廷或巴黎遭谴责的条目”的主张。此外，许多中世纪哲学与神学文本都含有对“巴黎条目”的征引与引文，而这些条目绝非总能等同于唐皮耶的那份被谴责条目清单。
  - id: 10
    source: |
If one compares Tempier's 1277 syllabus to the other lists of errors assembled in the compilation of Parisian Articles two features stand out, namely the anonymity of its targets and its promulgation by a bishop. Tempier does not specify the persons behind the false views, but merely states that the errors were disseminated by "certain scholars at the faculty of arts." The other condemnations, however, all concern specific scholars whose names are explicitly mentioned in the *Collectio errorum*. In addition, it is one of the few censures in which a bishop was involved right from the start, and not, for instance, at a later stage of the proceedings as judge of an appeal.
    step1: |
如果将唐皮耶的 1277 年纲要与巴黎条目汇编中的其他错误清单相比较，有两个特征突出，即其目标匿名以及由一位主教颁布。唐皮耶没有指明这些虚假观点背后的人物，而只是说这些错误是由“文学院的一些学者”传播的。然而，其他谴责都涉及特定学者，他们的名字在 *Collectio errorum* 中被明确提及。此外，这是少数几个从一开始就有主教介入的谴责之一，而不是例如在诉讼的较后阶段作为上诉法官介入。
    step2: |
若将唐皮耶的 1277 年纲要与巴黎条目汇编中的其他错误清单相比较，有两项特征格外醒目：其目标人物的匿名性，以及它是由一位主教颁布的。唐皮耶并未指明这些虚假观点背后的具体人物，而只是说这些错误系由“文学院的若干学者”所散布。相比之下，其他谴责皆指向特定学者，其姓名在 *Collectio errorum* 中都被明确载明。此外，这也是少数几桩从一开始就有主教介入的谴责之一——而非如上诉法官那样，在程序的后一阶段才介入。
  - id: 11
    source: |
In his introductory letter to the syllabus of errors, Tempier indicates that he responded to information received from important people (*magnarum et gravium personarum crebra zeloque fidei accensa insinuavit relatio*). The allegations were that "some scholars of arts at Paris" (*nonnulli Parisius studentes in artibus*) had been transgressing the limits of their own faculty (*proprie facultatis limites excedentes*). In all likelihood, this complaint stemmed from theological circles.
    step1: |
在致谬误纲要的导言信中，唐皮耶表示他回应了从重要人物那里收到的信息（*magnarum et gravium personarum crebra zeloque fidei accensa insinuavit relatio*）。指控是“巴黎的一些文学院学者”（*nonnulli Parisius studentes in artibus*）一直在逾越他们本学院的界限（*proprie facultatis limites excedentes*）。这起投诉很可能源自神学圈子。
    step2: |
在为其谬误纲要所写的导言信中，唐皮耶表示他是针对从若干要人处获得的情报而作出回应的（*magnarum et gravium personarum crebra zeloque fidei accensa insinuavit relatio*）。指控的内容是：“巴黎的若干文学院学者”（*nonnulli Parisius studentes in artibus*）一直在逾越其本学院的界限（*proprie facultatis limites excedentes*）。这起告发，很可能出自神学界的圈内人。
  - id: 12
    source: |
In his introductory letter, Tempier also reports that he sought the advice "not only of the doctors of Sacred Scripture, but also of other wise men" (*tam doctorum sacrae Scripturae, quam aliorum prudentium virorum communicato consilio*). From other cases of suspect teaching we know that the task of the theologians was to examine certain works and draw up a list of errors. In cases where a list of alleged errors already existed, the theologians were charged with assessing the degree of error of the listed propositions. The theologian John of Pouilly reports that sixteen masters of theology were Tempier's assessors for the condemnation. One of the members of the commission was Henry of Ghent, as he himself testifies in his *Quodlibet* II. It is unknown when these masters met, but it must have been after Henry of Ghent had become a regent master in theology, a position that he obtained in 1276. That there were some tensions between Tempier and the theologians is attested by Giles of Rome, a contemporary witness of the events of 1277: he claimed that some articles were condemned not on the basis of the advice of the masters, but rather due to the "obstinacy of a few." This observation has been taken to concern Tempier, but it might also have included some of the "wise men" who had assisted him.
    step1: |
在导言信中，唐皮耶还报告说，他征求了“不仅是《圣经》博士，还有其他贤人”的建议（*tam doctorum sacrae Scripturae, quam aliorum prudentium virorum communicato consilio*）。从其他可疑教学的案例中我们知道，神学家的任务是审查某些著作并拟定错误清单。在已经存在一份被指控错误清单的情况下，神学家的职责是评估所列命题的错误程度。神学家普伊的约翰报告说，十六位神学硕士是唐皮耶谴责的评审员。委员会成员之一是根特的亨利，正如他本人在其 *Quodlibet* II 中所作证的那样。这些硕士何时会面尚不清楚，但必定是在根特的亨利成为神学执政硕士之后，他于 1276 年获得这一职位。唐皮耶与神学家之间存在某些紧张关系，这由 1277 年事件的当代见证人罗马的吉尔斯所证明：他声称一些条目不是基于硕士们的建议而被谴责，而是由于“少数人的固执”。这一观察被认为涉及唐皮耶，但也可能包括了一些协助他的“贤人”。
    step2: |
