Recently, Sylvain Piron has argued that Tempier's list of condemned articles does exhibit an encyclopedic organization, which suggests that Tempier had a deliberate plan. Articles 25–183 can be divided into sub-sections which respectively touch upon the topics of God, angels, the world, the soul, the intellect, the will, philosophy, the will again (due to the misplacement of a rubric), and ethics. The same global order is also present in articles 1–24. The final articles, 184–219, seem to be a miscellaneous collection. Possibly, Tempier's list actually consists of three separate lists.
