      As Nathan Sivin (1990 and 1995) has argued, Chinese accounts focused on specific sciences, rather than on one unified notion of science. These Chinese sciences were both quantitative and qualitative. Sivin (1982 and 1990) breaks down the quantitative sciences into three disciplines: mathematics (*suan* 算), mathematical harmonics or acoustics (*lü* 律 or l*ü lü* 律呂) and mathematical astronomy (*li* 歷 or *li fa* 歷法), considered related to harmonics. Sivin describes the qualitative sciences as: astronomy or astrology (*tian wen* 天文), medicine (*yi* 醫) and siting (*feng shui* 風水). *Tian wen* included the observation of celestial and meteorological events whose proper reading could be used to rectify the political order. Medicine included “Nurturing Life” (*yang sheng* 養生), a broad category that included a wide range of self-cultivation techniques with important philosophical implications. In later periods, medicine also included materia medica (*ben cao* 本草) and internal (*nei dan* 內丹) and external (*wai dan* 外丹) alchemy.
    step1: |-
      正如席文（Sivin）（1990 与 1995）所论证的，中国的叙述聚焦于具体的诸科学，而不是一个统一的科学概念。这些中国科学既有定量的，也有定性的。席文（1982 与 1990）把定量科学分为三个学科：数学（*suan* 算）、数学和声学或声学（*lü* 律或 *lü lü* 律呂），以及与和声学相关的数学天文学（*li* 歷或 *li fa* 歷法）。席文把定性科学描述为：天文学或占星术（*tian wen* 天文）、医学（*yi* 醫）与相地术（*feng shui* 風水）。*Tian wen* 包括对天象与气象事件的观测，其正确解读可用于矫正政治秩序。医学包括“养生”（*yang sheng* 養生），这是一个宽泛范畴，涵盖多种具有重要哲学意涵的自我修养技术。在后来的时期，医学还包括本草学（*ben cao* 本草）以及内丹（*nei dan* 內丹）与外丹（*wai dan* 外丹）炼金术。
    step2: |-
      一如席文（Nathan Sivin，1990 与 1995）所论，中国的记述聚焦于具体诸科学，而非某个统一的科学概念。这些中国科学兼有定量与定性两类。席文（1982 与 1990）把定量科学分为三科：算学（*suan* 算）、数理律学或声学（*lü* 律，或 *lü lü* 律呂），以及与律学相关的数理天文学（*li* 歷，或 *li fa* 歷法）。定性科学，席文列举为：天文（*tian wen* 天文）、医学（*yi* 醫）与风水（*feng shui* 風水）。天文包括观测天体与气象事件——对其作出正确解读，可用于匡正政治秩序。医学包括“养生”（*yang sheng* 養生），这一宽泛范畴涵盖多种自我修养技术，且有重要的哲学意涵。其后各代，医学又包括本草（*ben cao* 本草），以及内丹（*nei dan* 內丹）与外丹（*wai dan* 外丹）炼金术。
