      Information on medicine and pharmacology appears in the sixth section, Recipes and Methods. It includes works on medicine and longevity, including medical classics, classical recipes, sexual arts, and immortality practices. These chapters reflect the concerns and expertise of the technical and ritual specialists closely associated with the “Recipe Masters” (*fang shi* 方士) associated with the Han court. But their concerns also appear in early philosophical texts, and the separation of philosophy from the categories of religion and science is artificial and problematic (Harper 1998 and 1999; Kalinowski 2004)[^harper-1998][^harper-1999][^kalinowski-2004]. Recipes and Methods (*fang ji* 方技) includes: Medical Classics (*yi jing* 醫經), Classical Recipes (*jing fang* 經方), Sexual arts (*fang zhong* 房中) and Immortality practices (*shen xian* 神仙).
    step1: |-
      关于医学与药物学的信息见于第六部分“方技”。它包括关于医学与长生的著作，其中有医学经典、经方、房中术与神仙术。这些篇章反映了与汉代宫廷相关的“方士”（*fang shi* 方士）密切联系的技术与礼仪专家的关切与专长。但他们的关切也见于早期哲学文本，而把哲学与宗教和科学的范畴分开，是人为的、成问题的（Harper 1998 and 1999; Kalinowski 2004）[^harper-1998][^harper-1999][^kalinowski-2004]。方技（*fang ji* 方技）包括：医经（*yi jing* 醫經）、经方（*jing fang* 經方）、房中（*fang zhong* 房中）与神仙（*shen xian* 神仙）。
