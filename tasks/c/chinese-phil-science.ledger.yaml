      Several things are striking about this categorization. The first is the relative confinement of “Chinese philosophy” to the first two (or arguably three) sections of the Treatise, particularly the Masters section. The eight sections of the Masters category include most of the texts of early Chinese philosophy. They are grouped under the rubrics of: “Ru” (*Ru jia* 儒家, often mistranslated as “Confucian”), Daoists (*Dao jia* 道家), *Yin-yang* (*Yin-yang jia* 陰陽家), Legalists (*Fa jia* 法家), Names (*Ming jia* 名家) Mohists (*Mo jia* 墨家), vertical and horizontal alliances (*Zong heng jia* 縱橫家, also known as “Militarists”), Miscellaneous (*Za jia* 雜家), the school of Shen Nong (S*hen Nong jia* 神農家) and Smaller Teachings (*Xiao Shuo* 小說). But it is important to note that these are the “schools” of Han anthologists and commentators. Recent scholarship and the evidence of texts excavated from tombs has shown the arbitrariness of these classifications. For example, texts excavated from Guodian 郭店 and the so-called Shanghai Museum texts resist classification as Ru or Daoist (*Shi ji*, 130, 3288–92; Csikszentmihalyi and Nylan 2003, Smith 2003)[^csikszentmihalyi-2003][^smith-2003].
    step1: |-
      这一分类有几点引人注目。第一是“中国哲学”相对被局限于《艺文志》的前两节（或者说三节），尤其是诸子一节。诸子类的八个节包括早期中国哲学的大部分文本。它们被归入如下名目：“儒”（*Ru jia* 儒家，常被误译为“Confucian”）、道家（*Dao jia* 道家）、阴阳家（*Yin-yang jia* 陰陽家）、法家（*Fa jia* 法家）、名家（*Ming jia* 名家）、墨家（*Mo jia* 墨家）、纵横家（*Zong heng jia* 縱橫家，亦称“Militarists”）、杂家（*Za jia* 雜家）、神农家（*Shen Nong jia* 神農家）与小说（*Xiao Shuo* 小說）。但须注意，这些是汉代选家与注疏者的“学派”。晚近学术研究与墓葬出土文本的证据已表明这些分类的任意性。例如，郭店与所谓上海博物馆藏文本便难以归类为儒家或道家（*Shi ji*, 130, 3288–92; Csikszentmihalyi and Nylan 2003, Smith 2003）[^csikszentmihalyi-2003][^smith-2003]。
    step2: |-
      这一分类有几点值得注意。第一，“中国哲学”相对被局限在《艺文志》的前两略（或可算三略），尤以诸子一略为然。诸子类的八节容纳了早期中国哲学的大部分文本，归在如下名目之下：“儒”（*Ru jia* 儒家，常被误译为“Confucian”）、道家（*Dao jia* 道家）、阴阳家（*Yin-yang jia* 陰陽家）、法家（*Fa jia* 法家）、名家（*Ming jia* 名家）、墨家（*Mo jia* 墨家）、纵横家（*Zong heng jia* 縱橫家，亦称“Militarists”）、杂家（*Za jia* 雜家）、神农家（*Shen Nong jia* 神農家）与小说（*Xiao Shuo* 小說）。但须记住，这些只是汉代选家与注疏者眼中的“学派”。晚近研究与墓葬出土文献的证据，已显出此类分类的任意：郭店与所谓上海博物馆所出文本，便难以归入儒家或道家（*Shi ji*, 130, 3288–92; Csikszentmihalyi and Nylan 2003, Smith 2003）[^csikszentmihalyi-2003][^smith-2003]。
