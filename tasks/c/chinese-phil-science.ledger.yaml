      But a perception that the history of engagement between philosophy and science is limited to “Confucianism,” would present only a partial picture. It is widely recognized that the earliest of what we would call scientific studies were conducted by the early Mohists, who wrote treatises on logic, optics and mechanics (Graham 1978, Needham 1956b, Fung 1922)[^fung-1922][^graham-1978][^needham-1956b]. Mohism did not persist beyond the Han dynasty as a textual lineage, but at least some Mohist texts are preserved in the *Daoist Canon* (discussed below). As such, while Mohism is fundamentally important to any history of science in China, it is not central to an account of the engagement between science and Chinese philosophy.
    step1: |-
      但认为哲学与科学接触的历史仅限于“儒学”，只会呈现图景的一部分。人们普遍认为，我们所称的最早科学研究由早期墨家完成，他们写下了关于逻辑、光学与力学的论文（Graham 1978, Needham 1956b, Fung 1922）[^fung-1922][^graham-1978][^needham-1956b]。墨家作为一个文本谱系并未延续到汉代以后，但至少有一些墨家文本保存在《道藏》中（见下文讨论）。因此，墨家对任何中国科学史固然根本重要，对科学与中国哲学之接触的描述却并不居中心。
    step2: |-
      然而，若认为哲学与科学的接触史仅限于“儒学”，所见只是一半图景。学界普遍认为，我们所称最早的科学研究出自早期墨家——他们写下了关于逻辑、光学与力学的论篇（Graham 1978, Needham 1956b, Fung 1922）[^fung-1922][^graham-1978][^needham-1956b]。墨家作为一个文本谱系未能延续到汉代以后，但至少若干墨家文本保存在《道藏》（*Dao zang* 道藏）之中（说见下文）。所以，墨家对任何中国科学史固然至关重要，对“科学与中国哲学之接触”的叙述却并不居于中心。
