      It is almost impossible to separate Chinese ideas of body, state, cosmos and “nature.” Nathan Sivin (1995, 3n1) points out that there is no indigenous term for “nature” in China before the nineteenth century. Over the course of the last three centuries BCE, Chinese understandings of the physical world developed to reflect, and mirror, political consolidation (Sivin 1995)[^sivin-1995]. These new ideas of cosmic order—correspondence between microcosm (the body) and macrocosm (the cosmos)—appeared in new representations of the body, the state, and the cosmos that were based on systematic applications and correlations of the ideas of yin and yang and of the Five Agents (*wuxing*). They appear in medical texts such as the *Huang Di neijing*, in calendrics, in observational astronomy and the study of astronomical portents with political implications, and in the “correlative cosmologies” of many Han dynasty texts (Lloyd 1996, Lloyd and Sivin 2002)[^lloyd-1996][^lloyd-2002].
    step1: |-
      中国的身体、国家、宇宙与“自然”诸观念几乎无法分离。席文（1995, 3n1）指出，十九世纪以前中国没有“自然”的本土术语。在公元前最后三个世纪中，中国对物理世界的理解发展得反映并映照政治的统一（Sivin 1995）[^sivin-1995]。这些关于宇宙秩序的新观念——微观宇宙（身体）与宏观宇宙（天地）之间的感应——出现在对身体、国家与宇宙的新表述中，这些表述基于阴阳观念与五行（*wuxing*）观念的系统应用与配合。它们见于《黄帝内经》之类的医学文本，见于历法，见于观测天文与具有政治含义的天象占候，也见于许多汉代文本的“关联性宇宙论”（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。
    step2: |-
      中国的身体、国家、宇宙与“自然”诸观念几乎无从分割。席文（1995, 3n1）指出，十九世纪以前中国并无“自然”的本土词语。在公元前的最后三个世纪，中国对物理世界的理解日益反映——也映照——政治上的整合（Sivin 1995）[^sivin-1995]。有关宇宙秩序的这些新观念——微观宇宙（身体）与宏观宇宙（天地）之间的相应——便出现在身体、国家与宇宙的新表述之中，而此类表述又以阴阳、五行（*wuxing* 五行）两说的系统推演与配合为据。它们见于《黄帝内经》一类医学文本，见于历法，见于观测天文与政事攸关的天象占候，也见于汉代诸多文本的“关联性宇宙论”（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。
