      An important source for our knowledge of their interests and expertise is the collected biographies of *fang shi* are recorded in the *Standard History of the Later Han* (*Hou Han shu*) under the heading “Fang Techniques” (*fang sh*u 方術). The preface lists their expertise and interests as: fate calculation and prognostication, including astrology and the prediction of eclipses), medicine and a variety of magical practices. Over half of the fifty-seven specialists listed in the collected biography (twenty-nine) practiced some form of astrology (biographies 1, 11, 12,16, 18–20, 22, 23, 26, 27, 30–33, 35, 38–41, 43–46, 49, 51–53 and 55, as listed in Kalinowski 2010, 359–66)[^kalinowski-2010]. But they were also credited with expertise in classical texts and in Huang-Lao and Daoist lore. (*Hou Han shu* 82A and 82B. Most of these techniques date from the late Zhou. See Li Ling 1995 and Kalinowski 2010, especially Appendix 2.)[^kalinowski-2010]
