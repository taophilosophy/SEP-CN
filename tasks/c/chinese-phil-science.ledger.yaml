      The *Han shu* describes Zou Yan as a “Recipe Master” or *fang shi* 方士. This term was applied to a wide range of practitioners of medical, mantic and technical arts. (The titles of their mostly lost works are listed in the *shu shu* and *fang ji* sections of the *Han shu* Bibliographic Treatise, discussed above.) *Fang sh*i practiced divination and claimed to possess secret texts and formulae. They gained great influence during the earlier part of the Han dynasty, though their influence waned by the later Han (Kalinowski 2010; Ngo 1976)[^kalinowski-2010][^ngo-1976]. They used yin-yang and Five Agents cosmology, and seem to have originated from the Shandong peninsula. They were particularly associated with the mantic arts, including the use of the sexagenary cycle of stems and branches, the *Yi jing*, and divination by stars, dreams, physiognomy, the winds, and by the use of pitch pipes (Li Ling 1993, 2000)[^li-1993]. The *fang shi* became an important force in the Han court during the reign of Han Wu Di (r. 141–29 BCE), but their origins are probably much older. Practices attributed to them have clear antecedents in Warring States philosophical texts such as the *Zhuangzi* and the “Inner Cultivation” (*Nei ye*) chapter of the G*uanzi*.
    step1: |-
      《汉书》把邹衍描述为“方士”（*fang shi* 方士）。这个词被施用于范围广泛的医学、术数与技术技艺的实践者。（他们大多已亡佚的著作篇目，列于上文讨论过的《汉书·艺文志》数术与方技两节。）方士行占卜，声称拥有秘传文本与方诀。他们在汉代前期获得了很大的影响力，虽然其影响到东汉后期已然衰落（Kalinowski 2010; Ngo 1976）[^kalinowski-2010][^ngo-1976]。他们使用阴阳与五行宇宙论，似乎源出山东半岛。他们尤与术数技艺相联系，包括使用干支六十循环、《易经》，以及借星辰、梦、相人、风与律管作占（Li Ling 1993, 2000）[^li-1993]。方士在汉武帝（公元前 141–前 29 年在位）治下成为汉廷中的一股重要力量，但其起源可能远为古老。归于他们的实践，在《庄子》与《管子》“内业”（*Nei ye*）篇等战国哲学文本中有清晰的先例。
    step2: |-
      《汉书》把邹衍列为“方士”（*fang shi* 方士）。此名施于范围甚广的医学、术数与技术技艺的实践者（其书大多亡佚，篇目著录于上文所论《汉书·艺文志》数术、方技两略）。方士行占卜，自称握有秘文与方诀。他们在汉初影响甚大，至东汉后期乃衰（Kalinowski 2010; Ngo 1976）[^kalinowski-2010][^ngo-1976]。方士用阴阳五行宇宙论，似源出山东半岛；尤精于术数之艺，包括干支六十循环、《易经》，以及星占、梦占、相人、风角与律管之占（Li Ling 1993, 2000）[^li-1993]。汉武帝（前 141–前 29 年在位）之世，方士成为汉廷中的一股重要势力，然其源起或甚古远。归于方士的种种实践，在《庄子》与《管子·内业》（*Nei ye*）篇等战国哲学文本中早有清晰先例。
