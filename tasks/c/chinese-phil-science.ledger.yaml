      Another area of potential Ru interest in astronomy is calendrics, based on detailed observation of seasonal changes. One example is the Monthly Ordinance (Yueling 月令) calendars of the *Huainanzi*. Monthly Ordinances use Five Agents correlations to specify the correct social, ritual, and agricultural activities for each season. Rulers could use these texts to regulate state ritual activities over the course of the year. The ordinances cover such topics as state activities (fortification, planting, etc.) and the consequences of performing activities at incorrect times. These are the first texts in the received tradition to link the twenty-eight Lunar Lodges to the months of the year, associating each month with a lodge, which indicates the position of the sun among the stars for that month. (Ancient Chinese astronomers divided the celestial equator around the pole star into twenty-eight “lodges” (*xiu* 宿), each named by a star within it and each comprising some 13 degrees (*du* 度) of the circle.) The calendric tables list the days of the year in stem-branch sexagenary order, with annotations on the nature of different kinds of days, and which days were auspicious or inauspicious for particular activities. (Such calendars also appear in almost identical form in the *Guanzi* and *Lü* *Shi chunqiu*, and were incorporated into the *Li ji* in the Later Han dynasty. See *Guanzi*, chs. 3.8 and 3.9, Rickett 1985, 148–192)[^rickett-1985] They also included monthly and seasonal correlates. For example, the lodges were associated with the position of the sun, and dusk and dawn correlated to the five pentatonic tones, pitch pipe notes, numbers, tastes, smells, color of the emperor’s clothing, presiding deity, and yin and yang sacrificial organs, all described in terms of the Five Agents (Major 1993, 220–225)[^major-1993].
    step1: |-
      儒家对天文学可能感兴趣的另一个领域是历法，它以对季节变化的细致观测为基础。一个例子是《淮南子》的月令（*Yueling* 月令）历表。月令用五行的对应来规定每一季节正当的社会、礼仪与农事活动。统治者可以用这些文本在一年之中安排国家礼仪活动。这些月令涉及国家事务（筑城、播种等）以及在错误时间行事之所招致后果。这些是传世文献中头一批把二十八宿与一年十二月联系起来、把每一月配于一宿的文本，该宿标示该月中日在诸星之间的位置。（古代中国天文学家把围绕极星的赤道分为二十八个“宿”（*xiu* 宿），每一宿以内的一颗星命名，每宿约占圆周十三度（*du* 度）。）历表以干支六十顺序列出一年之日，附注各类日子之性质，以及何日为特定事务的宜与忌。（此类历表也以几乎相同的形式见于《管子》与《吕氏春秋》，并在东汉时被并入《礼记》。见《管子》3.8 与 3.9 章，Rickett 1985, 148–192）[^rickett-1985] 它们还包含按月按季的相应项。例如，宿与日的位置相配，而早晚与五音、律管之音、数、味、臭、天子服色、所主之神以及阴阳祭脏相联系，皆以五行描述（Major 1993, 220–225）[^major-1993]。
    step2: |-
      儒家于天文学或有兴趣的另一领域是历法，其基础是对季节变化的细致观测。一例即《淮南子》中的月令（*Yueling* 月令）历表。月令以五行之配，规定每一季节应当施行的社会、礼仪与农事活动；统治者可用此类文本在全年中调度国家礼仪。其内容涉及国家事务（筑城、播种之类），以及在失时行事所招致的后果。这是传世文献中最早把二十八宿与一年之月相连的文本：每月配一宿，宿即标示该月中太阳在诸星之间的位置。（古代中国天文学家把绕极星的赤道带划分为二十八个“宿”（*xiu* 宿），各以内中一星为名，每宿约占圆周十三度（*du* 度）。）历表以干支六十序列出全年之日，附注各类日子的性质，以及某事以某日为宜、为忌。（此类历表亦以几乎相同的形式见于《管子》与《吕氏春秋》，东汉时被纳入《礼记》。见《管子》3.8、3.9 章，Rickett 1985, 148–192）[^rickett-1985] 其中还列有按月、按季的相应项：例如宿与日位相配，晨昏则与五音、律管之音、数、味、臭、天子服色、所主之神、阴阳祭脏相联系，一概以五行说之（Major 1993, 220–225）[^major-1993]。
