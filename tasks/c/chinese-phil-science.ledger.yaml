    source: |-
      *Yin-yang,* *q*i and the Five Agents also informed medical theories, which were systematized in a cosmological framework in the Yellow Emperor’s Classic of Internal Medicine or *Huang Di neijing* (Veith 1972, Unschuld and Tessenow 2011)[^unschuld-2011][^veith-1972]. This complex and multi-layered text, probably compiled in the first century BCE, presents a systematic cosmology that analogizes the body, the state, and the cosmos in complex systems of “correlative cosmology” (Graham 1986; Sivin 1995; Lloyd and Sivin 2002)[^graham-1986][^lloyd-2002][^sivin-1995]. For example, the *Huang Di neijing* describes correspondence between the articulations of the body and the cosmos, specifically between heaven and earth and the upper and lower parts of the body, including relations and analogies between body, state and the cosmos, all expressed in terms of yin-yang and the Five Agents (*Huang Di neijing lingshu,* 71.2, 446). Such correlations seem a far cry from either cosmological speculation or empirical science in any modern sense. Between those extremes stand the mostly lost arts of technical traditions described in the *Han shu* Bibliographic Treatise: astronomy, medical, pharmacological, and mantic arts, whose practitioners were the counterparts and potential competitors of the Masters textualists or philosophers (Lloyd and Sivin 2002)[^lloyd-2002]. Expertise initially developed by diviners and technical specialists became part of the *Daode jing*, *Zhuangzi*, and *Huainanzi*. It was also incorporated into the systematic cosmology and medicine of the Han (Lloyd 1996, Lloyd and Sivin 2002)[^lloyd-1996][^lloyd-2002]. The *Huang Di neijing* is listed (and first appears) in the Recipes and Methods section of the *Han shu* Bibliographic Treatise under the heading of Medical Classics (*Han shu* 30, 1776).
    step1: |-
      阴阳、气与五行也支撑医学理论，而医学理论在《黄帝内经》（*Huang Di neijing*，Veith 1972, Unschuld and Tessenow 2011）[^unschuld-2011][^veith-1972]中被系统化在一个宇宙论框架内。这一复杂而多层的文本大概编纂于公元前第一世纪，它呈现一个系统的宇宙论，把身体、国家与宇宙类比于复杂的“关联性宇宙论”系统（Graham 1986; Sivin 1995; Lloyd and Sivin 2002）[^graham-1986][^lloyd-2002][^sivin-1995]。例如，《黄帝内经》描述了身体关节与宇宙的对应，具体说就是天地与身体上下部分的对应，包括身体、国家与宇宙之间的关系与类比，皆以阴阳与五行表达（《黄帝内经·灵枢》71.2, 446）。此类对应看似与宇宙论思辨或任何现代意义上的经验科学都相去甚远。居其两极之间的，是《汉书·艺文志》所述技术传统中那些大多亡佚的技艺：天文、医学、药物学与术数之艺，其实践者是诸子文本家或哲学家的对应者，也是其潜在竞争者（Lloyd and Sivin 2002）[^lloyd-2002]。最初由占卜者与技术专家发展出的专长，成为《道德经》《庄子》与《淮南子》的一部分。它也被纳入汉代系统的宇宙论与医学（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。《黄帝内经》著录（并首次出现）在《汉书·艺文志》方技一节“医经”的名目之下（*Han shu* 30, 1776）。
    step2: |-
      阴阳、气与五行也支撑着医学理论；医学理论在《黄帝内经》（*Huang Di neijing*，Veith 1972, Unschuld and Tessenow 2011）[^unschuld-2011][^veith-1972]中被系统纳入一个宇宙论框架。这部复杂而多层的文本大约编纂于公元前 1 世纪，呈现出一个系统的宇宙论：身体、国家与宇宙，在种种复杂的“关联性宇宙论”系统中彼此类比（Graham 1986; Sivin 1995; Lloyd and Sivin 2002）[^graham-1986][^lloyd-2002][^sivin-1995]。例如，《黄帝内经》述及身体骨节与宇宙的对应：天地与身体上下部位相应，身体、国家与宇宙之间亦有关系与类比，皆以阴阳、五行出之（《黄帝内经·灵枢》71.2, 446）。此类对应，不论与宇宙论思辨相较，还是与任何现代意义上的经验科学相较，都相去甚远。而居此两极之间、且大多亡佚的，正是《汉书·艺文志》所著录的技术诸艺：天文、医学、药物与术数；其实践者既是诸子文本家（哲学家）的对应者，也是其潜在的竞争者（Lloyd and Sivin 2002）[^lloyd-2002]。这些最初由占卜者与技术人员发展出的专长，一部分进入《道德经》《庄子》与《淮南子》，另被纳入汉代系统化的宇宙论与医学（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。《黄帝内经》即著录（并首次出现）于《汉书·艺文志》方技一略的“医经”名目之下（*Han shu* 30, 1776）。
