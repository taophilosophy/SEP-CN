      这场关于中国科学之性质的争论被称为“李约瑟问题”，其焦点是那个重要问题的种种变体：使欧洲科学学科发生变革的科学革命，为何（或究竟是否）未曾在中国发生。按李约瑟的说法，答案就在中国科学史本身之中；而冯友兰给出的答案性质全然不同，李约瑟大概根本不会予以考虑。（李约瑟本人（1956b）关于中国哲学与科学史的叙述屡屡称引冯友兰的著作，尤其是 Fung 1983，却对 Fung 1922 只字未提。）
