      References to *yang sheng* techniques appear in both accounts of self-cultivation in Masters texts and in the titles of (lost) recipes in the *Han shu* Bibliographic Treatise. Mark Csikzentmihalyi has argued that “material virtue” traditions drawing on *yang sheng* techniques appear prominently in the *Mencius* and in two versions of *the Wu xing* 五行 or “Five Kinds of Action” recovered from Guodian and Mawangdui. These texts provide “a detailed moral psychology describing the process of the cultivation of the virtues” (Csikszentmihalyi 2004, 7). Mencius (2A2) famously refers to “cultivating flood-like qi” and the third chapter of the *Zhuangzi* is titled “The Lord of Nurturing Life” (*Yang sheng zhu*). By contrast, references to *yang sheng* in popular culture and in the recipes in the “Recipes and Methods” section of the Treatise seem directly concerned with health and longevity (V. Lo 2001 and 2005, Raphals 2008–2009)[^raphals-2008].
    step1: |-
      关于养生技术的记载见于两处：一在诸子文本中关于自我修养的论述，二在《汉书·艺文志》（亡佚）方技的篇目之中。齐思敏（Mark Csikzentmihalyi）论证，取资养生技术的“ material virtue”传统在《孟子》以及从郭店与马王堆出土的两本《五行》（*Wu xing* 五行，或“五种德行之行”）的两版本中显著出现。这些文本提供了“一种细密的道德心理学，描述诸德培养的过程”（Csikszentmihalyi 2004, 7）。《孟子》（2A2）有“养气”之说，以“浩然之气”著称；《庄子》第三章题为“养生主”（*Yang sheng zhu*）。相比之下，养生在通俗文化中、以及在《艺文志》“方技”一节的诸方中的记载，似乎直接关涉健康与长寿（V. Lo 2001 and 2005, Raphals 2008–2009）[^raphals-2008]。
    step2: |-
      关于养生技术的记载见于两处：一是诸子文本中论自我修养者，二是《汉书·艺文志》所著录（今已亡佚）的方技书目。齐思敏（Mark Csikszentmihalyi）论证，取材养生技术的“物质德性”（material virtue）传统，在《孟子》与郭店、马王堆所出两种《五行》（*Wu xing* 五行，或“五德之行”）写本中都颇为显要。这些文本提供了“一种细密的道德心理学，述明诸德培育的过程”（Csikszentmihalyi 2004, 7）。《孟子》（2A2）有著名的“养浩然之气”之说，《庄子》第三章题为“养生主”（*Yang sheng zhu*）。相形之下，养生在通俗文化中、以及在《艺文志》“方技”一略诸方中的记载，则似直接关乎健康与长寿（V. Lo 2001 and 2005, Raphals 2008–2009）[^raphals-2008]。
