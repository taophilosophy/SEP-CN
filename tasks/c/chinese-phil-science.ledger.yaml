    source: |-
      The two halves of the treatise also differ in their authorship. The first three sections were compiled by Liu Xiang. The last three, by contrast, were compiled by technical experts. The fourth “Military Works” section of the Bibliographic Treatise was compiled by Ren Hong 任宏, a Colonel of Foot Soldiers under Han Chengdi (Yates 1988)[^yates-1988]. The “*Shu shu*” category was compiled by an astronomical official: the *Taishi* 太史 Yin Xian 尹咸 (*Han shu*, 30, 1775). The Recipes and Methods section was compiled by the imperial physician Li Zhuguo 李柱國. This distinction between what appear to be three generalist and three specialist categories of the Treatise can be seen as a continuation of Warring States claims for the superiority of a flexible and general intellect over specific and technical arts. In this kind of Warring States argumentation, claims for comprehensive wisdom and universality sought to establish sole possession of way of the sage kings of antiquity, of which competing traditions possessed only part. Such claims appear in the *Zhuangzi* and in attacks on competing schools by Xunzi and Han Fei (Lewis 1999, Raphals 2008–2009)[^lewis-1999][^raphals-2008]. Thus the authors of Han collectanea privileged generalists in their comprehensive syntheses of competing traditions (Lewis 1999)[^lewis-1999]. In this way, the organization of the Treatise asserted the superiority of general and universal knowledge over military, mantic, and medical knowledge, deliberately framed as technical and limited in nature.
    step1: |-
      《艺文志》的两半在编纂者上也有差异。前三节由刘向编纂。相比之下，后三节由技术专家编纂。《艺文志》第四部分“兵书”由汉成帝时的步兵校尉任宏编纂（Yates 1988）[^yates-1988]。“数术”一类由天文官员编纂：太史尹咸（*Han shu*, 30, 1775）。“方技”一节由太医李柱国编纂。三节通才类目与三节专家类目之间的这一区分，可视为战国时期那种主张灵活而通达的智力优于具体技术技艺之说的延续。在这一类战国论说中，对全面智慧与普遍性的主张，力图确立对古代圣王之道——而相互竞争的传统各只得其一偏——的独占。此类主张见于《庄子》，也见于荀子与韩非对竞争学派的攻击（Lewis 1999, Raphals 2008–2009）[^lewis-1999][^raphals-2008]。于是，汉代纂辑之书的作者在对竞争传统的综合整理中优待通才（Lewis 1999）[^lewis-1999]。通过这种方式，《艺文志》的组织宣示了通行的、普遍的知识优于军事的、术数的与医学的知识——后者被刻意框定为技术的、性质有限的。
    step2: |-
      《艺文志》的两半，编纂者亦异。前三略由刘向纂辑；后三略则由技术专家纂成：第四略“兵书”系汉成帝时步兵校尉任宏所辑（Yates 1988）[^yates-1988]；“数术”一略系天文官员太史尹咸所辑（*Han shu*, 30, 1775）；“方技”一略系太医李柱国所辑。前三略为通才类目、后三略为专家类目，这一区分可视为战国旧说之延续：灵活而通达的智力优于具体的技术技艺。在战国此类论说中，对周全智慧与普遍性的主张，意在独占古代圣王之道——而相互竞争的传统各只得其偏。此类主张见于《庄子》，亦见于荀子、韩非对竞争学派的攻击（Lewis 1999, Raphals 2008–2009）[^lewis-1999][^raphals-2008]。因此，汉代纂辑者在综理竞争传统时优待通才（Lewis 1999）[^lewis-1999]。《艺文志》的编排就这样宣示了通行而普遍的知识优于军事的、术数的与医学的知识——后者被刻意判为技术的、格局有限的。
