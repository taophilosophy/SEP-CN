      Key to this amalgam were several concepts shared by both groups but deployed in very different ways. Early cosmological thinking depicts a cosmos ultimately composed of *qi* 氣 (the energy that constitutes and organizes matter and causes growth and change) in processes of constant change, based on the interactions of yin and yang 陰陽 and the Five Agents (*wu xing* 五行, Graham 1986, Raphals 1998 and 2013)[^graham-1986][^raphals-1998][^raphals-2013].
    step1: |-
      这一合成的关键是若干两组共享但部署方式迥异的概念。早期宇宙论思想描绘一个最终由 *qi* 氣（构成并组织物质并引起生长与变化的能量）构成、处于不断变化过程中的宇宙，其基础是阴阳 陰陽 的互动与五行（*wu xing* 五行, Graham 1986, Raphals 1998 and 2013）[^graham-1986][^raphals-1998][^raphals-2013]。
    step2: |-
      这一合成的关键，是两组共享、却以迥异方式使用的几个概念。早期宇宙论把宇宙描绘为最终由气（*qi* 氣）构成——气是构成并组织物质、引起生长与变化的能量——并处于永恒流变的过程之中；其根据是阴阳（*yin-yang* 陰陽）的交互与五行（*wu xing* 五行）（Graham 1986, Raphals 1998 and 2013）[^graham-1986][^raphals-1998][^raphals-2013]。
