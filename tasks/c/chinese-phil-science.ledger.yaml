      > If you wish to know the figures for the breadth and length of east, west, north, and south set up four gnomons to make a right-angled figure one li square. More than ten days before the spring or autumn equinox sight along the northern gnomons of the square on the sun from its first appearance to its rise above the horizon. Wait for [the day when] they coincide. When they coincide they are in line with the sun. Each time take a sight on it [the sun] with the southern gnomons, and take the amount by which it is within the forward gnomons as the divisor. Divide the whole width and divide the length [between] the standing gnomons in order to know the measurements east and west from here (*Huainanzi* 3, 53–54, translation after Cullen 1976, 116)[^cullen-1976].
    step1: |-
      > 若要知晓东西南北广与长的数字，立四表成一个方一里的直角图形。在春分或秋分前十余天，从方形北边的表望太阳，自其初现至升出地平。等到（两者）重合。重合时它们与日相直。每次用南边的表望它（太阳），取它在前行表内的量为除数。以全长为被除数，以立表之间的距离除之，以知从这里起东西方向的度数（《淮南子》3, 53–54，译据 Cullen 1976, 116）[^cullen-1976]。
    step2: |-
      > 欲知东西南北广与长之数，立四表以成方一里的直角图形。于春分或秋分前十余日，自方形北边之表望日，从其初现直至升出地平。待两者相合；相合之时，表与日相直。每次以南边之表望日，取其在前行表内的量为除数；以全长被除，再以两立表之间的距离除之，即可知由此向东、西方向的度数（《淮南子》3, 53–54，译文据 Cullen 1976, 116）[^cullen-1976]。
