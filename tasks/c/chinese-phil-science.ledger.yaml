      These questions partake of an ongoing debate on the nature of Chinese science, which initially arose from the pioneering work of Joseph Needham. This debate focuses on the problematic question of why (or whether) the revolution that transformed scientific disciplines in Europe did not take place in China. It has tended to focus on the mathematization of science and on the activities of court astronomical officials (Needham 1956b, 1979)[^needham-1956b]. But these debates do little to clarify the relations between the origins and development of the sciences in China and Chinese philosophy.
