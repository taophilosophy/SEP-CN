      There were important differences between the social and institutional contexts of early philosophy and science, as well as important differences between sciences. Masters textualists were private individuals who often sought, but rarely achieved political influence. By contrast, astronomy and calendrics in particular were closely linked to government and court patronage, and from Han times on, located in the Bureau of Astronomy (Loewe 1994, Raphals 2013, Sivin 2009)[^loewe-1994][^raphals-2013][^sivin-2009].
    step1: |-
      早期哲学与科学在社会与制度语境上有重要差异，诸科学之间也有重要差异。诸子文本家是一些私人个体，他们常常谋求、却很少获得政治影响力。相比之下，天文学与历法则尤其密切地联系于政府与宫廷庇护，并且从汉代起便设于天文机构（Loewe 1994, Raphals 2013, Sivin 2009）[^loewe-1994][^raphals-2013][^sivin-2009]。
    step2: |-
      早期哲学与科学的社会、制度语境颇有差异，诸科学彼此亦不相同。诸子文本家是一些私家著述者，常谋求而很少得到政治影响。相形之下，天文学与历法尤为紧密地系于政府与宫廷庇护：自汉代起，它们便隶属于天文官署（Loewe 1994, Raphals 2013, Sivin 2009）[^loewe-1994][^raphals-2013][^sivin-2009]。
