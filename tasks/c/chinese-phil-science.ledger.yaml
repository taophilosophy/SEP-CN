      These activities were not invented by the *fang shi*. The *Han shu Bibliographic Treatise* also provides evidence of *fang* activity through the titles of lost books. Other evidence comes from late Warring States and Han texts such as the *Lü Shi chunqiu* and *Huainanzi*. The *Huainanzi* contains several chapters of astronomical interest (Major 1993)[^major-1993]. One passage describes the technical interests of the sage emperor Yu, who ordered his officials to measure the distances to the ends of the earth by pacing the distance to the eastern, western, northern and southern extremities of the earth (*Huainanzi* 4, 56). The exact numbers given are problematic to say the least, but the point is that the sage rulers of antiquity, in legendary accounts, interested themselves in the physical observation of the earth.
    step1: |-
      这些活动不是方士发明的。《汉书·艺文志》也通过亡佚书籍的篇目提供 *fang* 方家活动的证据。其他证据来自战国晚期与汉代的文本，如《吕氏春秋》与《淮南子》。《淮南子》包含若干有天文学意义的章节（Major 1993）[^major-1993]。一段描述了圣王禹的技术兴趣，他命官员以步测东西南北四极的距离来测定到大地的尽头（《淮南子》4, 56）。所给的确切数字至少是有问题的，但要点在于，传说中的上古圣王关心对大地的物理观测。
    step2: |-
      这些活动并非方士所创。《汉书·艺文志》也以亡佚书籍的篇目为方家活动提供证据。另外的证据来自战国晚期与汉代的文本，如《吕氏春秋》与《淮南子》（*Huainanzi* 淮南子）。《淮南子》含有数章具天文意义的文字（Major 1993）[^major-1993]。其中一段述及圣王禹的技术兴趣：他命臣下以步测之法测定大地上东西南北四极的距离（《淮南子》4, 56）。所载的确切数字无论如何都有问题，要点在于：传说中的上古圣王竟也关心对大地的实测。
