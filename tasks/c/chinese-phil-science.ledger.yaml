      A closer examination of what we know of some of the early “scientists” shows close links to philosophical traditions. The apocryphal founder of scientific thought in China was Zou Yan 鄒衍 (305–240 BCE), who is associated with the so-called “Yin-Yang school” (Yin-yang jia). Zou Yan is credited with combining and systematizing yin-yang and the theory of Five Agents (Needham 1956b: 231–34)[^needham-1956b], but none of his works survive. Sima Qian’s biography in *Shi ji* 76 describes Zou Yan as a member of the Jixia 稷下 Academy, originally from the state of Qi (in present day Shandong). The Jixia Academy is also associated with Warring States philosophers. Figures associated with it include Mencius, Xunzi, the Mohist philosopher Song Xing, as well as Tian Pian, Shen Dao, Peng Meng, and possibly Zhuangzi (Needham 1956a, 93; Sato 2003, 75–77)[^needham-1956a][^sato-2003]. The Jixia Academy is also associated with the growth of Huang-Lao Daoism (Graziani 2008)[^graziani-2008]. According to the *Shi ji* biography of Zou Yan:
