      > he examined deeply into the phenomena of the increase and decrease of yin and yang, and wrote essays totaling more than 100,000 words about their strange permutations, and about the cycles of the great sages from beginning to end. His sayings were vast and far-reaching, and not in accord with the accepted beliefs of the classics. First he had to examine small objects, and from these he drew conclusions about large ones, until he reached what was without limit. First he spoke about modern times, and from this he went back to the time of Huang Di. The scholars all studied his arts. Moreover he followed the great events in the rise and fall of ages, and by means of their omens and (an examination into their systems), extended his survey (still further) backwards to the time when the heavens and the earth had not yet been born, (in fact) to what was profound and abstruse and impossible to investigate.
      >
      > He began by classifying China’s notable mountains, great rivers and connecting valleys; its birds and beasts; the fruitfulness of its water and soils, and its rare products; and from this extended his survey to what is beyond the seas, and men are unable to observe. Then starting from the time of the separation of the Heavens and the Earth, and coming down, he made citations of the revolutions and transmutations of the Five Powers (Virtues), arranging them until each found its proper place and was confirmed (by history). (*Shi ji* ch 76, slightly modified from Needham 1956b, 232–33)[^needham-1956b].
    step1: |-
      > 他深入探究阴阳消长的现象，写下十万余字论述其奇异变化、以及大圣自始至终循环的论文。其言广大而深远，不与经典所公认的信念相合。他先考察小物，由此推知大物，直到抵达无限之处。他先论当世，由此上溯黄帝之时。学者都研习他的方术。他更推究历代兴衰的大势，借其征兆（并考察其系统），把他的考察（进一步）向前推至天地尚未诞生之时，（实际上）推到幽深玄奥、无从探究之处。
      >
      > 他先从中国名山大川与通谷的条列开始，及其鸟兽、水土的丰饶与珍异物产；由此把他的考察推及海外、人所不能观察之处。然后自天地剖判之时起往下推，历数五德（五行）的转移变化，排列之使各得其位，并以史事加以验证。（*Shi ji* 卷 76，据 Needham 1956b, 232–33 稍作修改）[^needham-1956b]。
