      Finally, both groups created textual lineages and accounts of textual authority. In a scientific context, authoritative texts were nominally attributed to a culture hero or divine source. Examples include the medical “classic” *The Yellow Emperor's Classic of Internal Medicine* (*Huang Di nei jing*, Unschuld 2003, Unschuld and Tessenow 2011)[^unschuld-2011] and the *Zhou [dynasty] Classic of Gnomon Calculation* (*Zhou bi suan jing*, Cullen 1976 and 1996)[^cullen-1976][^cullen-1996]. By contrast, the evidence of recently excavated texts indicates that such texts derived from prior textual traditions that were subsequently lost (Harper 1998)[^harper-1998]. Other Masters created their own texts and apocryphal lineages, but did not appear to have debated each other extensively or to have taken self-consciously critical stances toward their human or textual predecessors (Lloyd 1996, Lloyd and Sivin 2002)[^lloyd-1996][^lloyd-2002].
    step1: |-
      最后，两组都创造了文本谱系与文本权威的叙述。在科学语境中，权威文本名义上归属于一个文化英雄或神圣来源。例如医学的“经”《黄帝内经》（*Huang Di nei jing*, Unschuld 2003, Unschuld and Tessenow 2011）[^unschuld-2011]和《周〔代〕髀算经》（*Zhou bi suan jing*, Cullen 1976 and 1996）[^cullen-1976][^cullen-1996]。相比之下，新出土文本的证据表明，此类文本出自其前的一些后来失传的文本传统（Harper 1998）[^harper-1998]。其他诸子创造自己的文本与伪托谱系，但似乎并未彼此广泛辩论，也似乎并未对其人或文本的前驱采取自觉的批判立场（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。
    step2: |-
      最后，两组都创造了文本谱系，也都创造了关于文本权威的叙述。在科学语境中，权威文本名义上归诸某位文化英雄或神圣来源，例如医学之“经”《黄帝内经》（*Huang Di nei jing*，Unschuld 2003, Unschuld and Tessenow 2011）[^unschuld-2011]，以及《周髀算经》（*Zhou bi suan jing*，Cullen 1976 and 1996）[^cullen-1976][^cullen-1996]。相形之下，新出土文献的证据表明：此类文本实出自某些先前、后来失传的文本传统（Harper 1998）[^harper-1998]。其他诸子则自造文本与伪托谱系，但似乎既未彼此广泛论辩，也未对其人间或文本上的前驱采取自觉的批判立场（Lloyd 1996, Lloyd and Sivin 2002）[^lloyd-1996][^lloyd-2002]。
