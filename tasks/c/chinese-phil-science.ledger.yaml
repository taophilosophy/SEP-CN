      A particular problem raised by the application of yin-yang theory to medicine was the implications of yin-yang theories for accounts of gender (Furth 1986, Raphals 1998, Yates 2005)[^furth-1986][^raphals-1998][^yates-2005], including the problem of the androgyny of what Charlotte Furth calls “the Yellow Emperor’s body.” Furth argues that the human body is understood as androgynous before the development of gynecology in the Song dynasty. These models of the body inform the early history of *yin-yang* theory, and the gender analogies that form part of that discourse. A central text to these analogies is the *Huang Di neijing*, which is striking for its overall androgyny. Overall, women are not specified as medically distinct from men, and where they do occur, discussions of sexual difference are usually linked to specific questions of fertility and reproduction (e.g., *Huang Di neijing suwen* 1.3.8 and 7.2.26).
    step1: |-
      阴阳理论应用于医学所引发的一个特殊问题，是阴阳理论对性别叙述的意涵（Furth 1986, Raphals 1998, Yates 2005）[^furth-1986][^raphals-1998][^yates-2005]，包括费侠莉（Charlotte Furth）所谓“黄帝之身”的两性一体问题。费侠莉论证，在妇科发展之前，人体被理解为两性一体的。这些身体模型构成阴阳理论早期史的一部分，也构成作为该论述一部分的性别类比。对这些类比而言的一部中心文本是《黄帝内经》，其总体的两性一体性令人瞩目。大体言之，女子并未被指明在医学上不同于男子；而凡有涉及性差异之处，讨论通常系于生育与生殖的具体问题（例如《黄帝内经·素问》1.3.8 与 7.2.26）。
    step2: |-
      阴阳理论应用于医学，引出一个特殊问题：它对性别论述的意涵（Furth 1986, Raphals 1998, Yates 2005）[^furth-1986][^raphals-1998][^yates-2005]——其中包括费侠莉（Charlotte Furth）所谓“黄帝之身”具两性一体性的问题。费侠莉论证：在妇科学出现之前，人体一直被理解为本具两性一体性的。这些身体模型构成阴阳理论早期史的一环，也构成该论述中性别类比的一环。对此诸类比而言，《黄帝内经》是一部中心文本，其总体上的两性一体性颇为醒目。大体而言，女子并未被视作医学上异于男子；凡涉性差异之处，讨论通常只系于生育与生殖的具体问题（如《黄帝内经·素问》1.3.8 与 7.2.26）。
