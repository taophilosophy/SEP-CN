  - id: 3
    kind: body
    source: |-
      > Two cultural genes have passed through generations of Chinese intellectuals for more than 2,000 years. The first is the thoughts of Confucius, who proposed that intellectuals should become loyal administrators. The second is the writings of Zhuang Zhou, who said that a harmonious society would come from isolating families so as to avoid exchange and conflict, and by shunning technology to avoid greed. Together, these cultures have encouraged small-scale and self-sufficient practices in Chinese society, but discouraged curiosity, commercialization and technology. They helped to produce a scientific void in Chinese society that persisted for millennia. And they continue to be relevant today (Gong 2012)[^gong-2012].
    step1: |-
      > 两种文化基因在两千多年间传承于一代代中国知识分子。其一是孔子的思想，他主张知识分子应当成为忠顺的行政官员。其二是庄周的著述，他说一个和谐的社会来自把家族彼此隔绝，以避免交换与冲突，并回避技术以避免贪欲。合在一起，这些文化鼓励了中国社会中小规模、自给自足的实践，却压制了好奇心、商业化与技术。它们有助于在中国社会中造成一个延续千年的科学真空。而且它们在今天依然切题（Gong 2012）[^gong-2012]。
    step2: |-
      > 两种文化基因在中国知识分子中间传承了两千余年。其一是孔子的思想：他主张知识分子应当成为忠顺的行政官员。其二是庄周的著述：他说一个和谐的社会应把家族彼此隔绝，以避免交换与冲突，并回避技术以避免贪欲。合而观之，这些文化鼓励了中国社会中小规模、自给自足的实践，却压制了好奇心、商业化与技术。它们在中国社会中造成了延续千年的科学真空，而且至今依然切题（Gong 2012）[^gong-2012]。
