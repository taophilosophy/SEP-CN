      Needham, himself an eminent embryologist (Needham 1931, 1934)[^needham-1931] was the primary author of the multi-volume ongoing *Science and Civilisation in China* (1954- ). His approach to the problem of the history of science in China was to try to fit the Chinese scientific tradition into the categories of twentieth-century western science. On the one hand, this approach enabled Needham and his collaborators to engage the wealth and variety of the many Chinese sciences from a perspective that took them seriously as contributors to an ongoing and universal history of science. This approach also allowed Needham's group to consistently and coherently refute “orientalist” claims or prima facie assumptions that science was the sole property of a European tradition extending backward in time to ancient Greece, with little or no influence from any other cultural tradition. On the other hand, Needham's “universalist” approach to the history of science in China has been rejected as anachronistic and culturally inappropriate (Yates 2003, 658)[^yates-2003].
    step1: |-
      李约瑟本人是杰出的胚胎学家（Needham 1931, 1934）[^needham-1931]，是持续出版的多卷本《中国科学技术史》（1954– ）的主要作者。他处理中国科学史问题的方法是，试图把中国科学传统纳入二十世纪西方科学的范畴。一方面，这一方法使李约瑟及其合作者得以从一种认真对待中国诸科学、视其为持续而普遍的科学史之贡献者的视角，去接触众多中国科学的丰富与多样。这一方法也使李约瑟的团队能够一贯而融贯地驳斥“东方主义”的论调，或驳斥那种表面假定：科学是欧洲传统的独占财产，该传统上溯古希腊，而其影响几乎不来自任何其他文化传统。另一方面，李约瑟处理中国科学史的“普遍主义”方法被斥为时代错置、在文化上不得体（Yates 2003, 658）[^yates-2003]。
    step2: |-
      李约瑟本人是杰出的胚胎学家（Needham 1931, 1934）[^needham-1931]，也是持续出版的多卷本《中国科学技术史》（*Science and Civilisation in China*，1954– ）的主要作者。他处理中国科学史的路数，是设法把中国科学传统纳入二十世纪西方科学的范畴。一方面，这一路数使李约瑟及其合作者得以从一个认真看待中国诸科学、视之为持续展开的普遍科学史之贡献者的视角，去把握众多中国科学的丰富与多样；也使他们能够一贯而融贯地驳斥“东方主义”论调，以及那种想当然的假定——科学是欧洲传统的独占财产，该传统上溯古希腊，几乎不受任何其他文化传统影响。另一方面，李约瑟这种“普遍主义”的中国科学史路数，也被斥为时代错置、在文化上失当（Yates 2003, 658）[^yates-2003]。
