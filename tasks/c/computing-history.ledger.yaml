      对于那些熟悉 1936 年通用图灵机及相关存储程序概念的人来说，弗劳尔斯的电子设备架证明了使用大量真空管来实现高速通用存储程序计算机的可行性。战争结束后，纽曼不失时机地在曼彻斯特大学建立了皇家学会计算器实验室，正是为了这个目的。在到达曼彻斯特几个月后，纽曼致函普林斯顿数学家约翰·冯·诺依曼（John von Neumann，1946 年 2 月）如下：
      > 我……希望在这里着手建立一个计算机器部门，因为在过去两三年里，我对这类电子装置产生了浓厚的兴趣。大约十八个月前，我已决定在我出来时试着动手建立一个机器单位。……我当然与图灵保持密切联系。
