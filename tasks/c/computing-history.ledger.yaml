      The earliest extensive use of vacuum tubes for digital data-processing appears to have been by the engineer Thomas Flowers, working in London at the British Post Office Research Station at Dollis Hill. Electronic equipment designed by Flowers in 1934, for controlling the connections between telephone exchanges, went into operation in 1939, and involved between three and four thousand vacuum tubes running continuously. In 1938–1939 Flowers worked on an experimental electronic digital data-processing system, involving a high-speed data store. Flowers' aim, achieved after the war, was that electronic equipment should replace existing, less reliable, systems built from relays and used in telephone exchanges. Flowers did not investigate the idea of using electronic equipment for numerical calculation, but has remarked that at the outbreak of war with Germany in 1939 he was possibly the only person in Britain who realized that vacuum tubes could be used on a large scale for high-speed digital computation. (See Copeland 2006 for m more information on Flowers' work.)[^copeland-2006]
    step1: |-
      真空管用于数字数据处理的最早广泛使用，似乎是由工程师托马斯·弗劳尔斯（Thomas Flowers）进行的，他在伦敦的多利斯山的英国邮政局研究站工作。弗劳尔斯 1934 年设计的用于控制电话交换机之间连接的电子设备，于 1939 年投入使用，涉及三四千只连续运转的真空管。1938–1939 年，弗劳尔斯研究了一种实验性电子数字数据处理系统，涉及一个高速数据存储器。弗劳尔斯的目标——战后得以实现——是让电子设备取代现有的、较不可靠的、由继电器构建并用于电话交换机的系统。弗劳尔斯没有研究将电子设备用于数值计算的想法，但曾表示，在 1939 年对德战争爆发时，他可能是英国唯一认识到真空管可以大规模用于高速数字计算的人。（关于弗劳尔斯工作的更多信息，见 Copeland 2006。）[^copeland-2006]
