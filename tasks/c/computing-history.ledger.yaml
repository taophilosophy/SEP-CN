      美国提议的第一台电子存储程序数字计算机是 EDVAC（见下文）。由冯·诺依曼撰写的《关于 EDVAC 的报告初稿》（1945 年 5 月）几乎没有工程细节，特别是关于电子硬件的（由于美国的限制）。另一方面，图灵的《建议的电子计算器》提供了详细的电路设计和硬件单元的规格、机器代码的样本程序，甚至对建造该机器的成本作了估算（11200 英镑）。ACE 和 EDVAC 彼此根本不同；例如，ACE 采用分布式处理，而 EDVAC 具有集中式结构。
