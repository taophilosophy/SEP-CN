      Turing saw that speed and memory were the keys to computing. Turing's colleague at NPL, Jim Wilkinson, observed that Turing ‘was obsessed with the idea of speed on the machine’ [Copeland 2005, p. 2][^copeland-2005]. Turing's design had much in common with today's RISC architectures and it called for a high-speed memory of roughly the same capacity as an early Macintosh computer (enormous by the standards of his day). Had Turing's ACE been built as planned it would have been in a different league from the other early computers. However, progress on Turing's Automatic Computing Engine ran slowly, due to organisational difficulties at NPL, and in 1948 a ‘very fed up’ Turing (Robin Gandy's description, in interview with Copeland, 1995) left NPL for Newman's Computing Machine Laboratory at Manchester University. It was not until May 1950 that a small pilot model of the Automatic Computing Engine, built by Wilkinson, Edward Newman, Mike Woodger, and others, first executed a program. With an operating speed of 1 MHz, the Pilot Model ACE was for some time the fastest computer in the world.
    step1: |-
      图灵看到速度和内存是计算的关键。图灵在 NPL 的同事吉姆·威尔金森（Jim Wilkinson）观察到，图灵“痴迷于机器上速度的想法” [Copeland 2005, p. 2][^copeland-2005]。图灵的设计与今天的 RISC 架构有很多共同之处，它要求一种大约与早期 Macintosh 计算机容量相当的高速存储器（按他那个时代的标准是巨大的）。如果图灵的 ACE 按计划建成，它将与早期其他计算机处于不同的层级。然而，由于 NPL 的组织困难，图灵自动计算引擎的进展缓慢，1948 年，一个“非常厌烦”的图灵（罗宾·甘迪（Robin Gandy）的描述，接受 Copeland 访谈，1995）离开 NPL，前往曼彻斯特大学的纽曼计算器实验室。直到 1950 年 5 月，一台由威尔金森、爱德华·纽曼（Edward Newman）、迈克·伍杰（Mike Woodger）等人建造的自动计算引擎小型试验型号才首次执行了程序。Pilot Model ACE 以 1 MHz 的工作速度，在一段时间内是世界上最快的计算机。
