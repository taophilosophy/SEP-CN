      In another place, Bondi makes a similar point: “Comparison with observation becomes then possible and renders the PCP liable to observational disproof. This possibility of a clear-cut disproof establishes the scientific status of PCP” (Bondi 1957, p. 198)[^bondi-1957]. Comments such as this make clear Bondi’s committment to a Popperian addition to the basic deductive methodology he inherited from Milne.
    step1: |
      在另一处，邦迪表达了类似的看法：“与观察的比较于是成为可能，并使 PCP 可遭观察否证。这种干净利落的否证之可能，确立了 PCP 的科学地位”（Bondi 1957, p. 198）[^bondi-1957]。诸如此类的评论清楚表明：邦迪致力于在他从米尔恩那里继承的基本演绎方法论之上，添入一个波普尔式的成分。
