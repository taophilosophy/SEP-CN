      Dingle’s article appeared back-to-back with an appraisal of kinematic relativity by the important American cosmologist H. P. Robertson (Robertson 1933a)[^robertson-1933a]. Robertson focussed upon Milne’s hypothetico-deducivism as well, noting that the cosmological principle in kinematic relativity functions as an *a priori* rule, rather than as an empirical generalization, its status in relativistic cosmology. Robertson otherwise is not especially taken with Milne’s theory, limiting himself to remarks suggesting that, where they can be compared, kinematic relativity and relativistic cosmology apparently are similar in physical content. As we shall shortly see, Robertson’s later work strongly belied this earlier apparent indifference to Milne’s theory.
    step1: |
      丁格尔的文章与重要的美国宇宙学家 H. P. 罗伯逊（H. P. Robertson）对运动学相对论的评价背靠背刊出（Robertson 1933a）[^robertson-1933a]。罗伯逊也聚焦于米尔恩的假说—演绎主义，指出运动学相对论中的宇宙学原理是作为*先验*规则、而非作为经验概括而起作用的，后者才是它在相对论宇宙学中的地位。罗伯逊对米尔恩的理论并不特别欣赏，仅限于提出一些看法，暗示在可以比较的地方，运动学相对论与相对论宇宙学在物理内容上似乎相似。我们很快会看到，罗伯逊后来的工作有力地反驳了他先前对米尔恩理论这种表面上的漠然。
