      皇家学会会员、著名地质学家与天文学家、广受好评的科学哲学著作《科学推理》（*Scientific Inference*，1957）的作者哈罗德·杰弗里斯率先开火，来了一记漂亮的人身攻击（*ad hominem*）：“不使用归纳，米尔恩与爱丁顿连一天的日子都安排不了；他们真正主张的是，自己有权在物理学中使用特殊公理，而对于这种需要，从未有人表明过。”当然，杰弗里斯此处的批评忽略了演绎观察在证成那些“特殊”公理中的作用。在他看来，问题源于作祟者的“这样一种信念：数学中自有某种特殊德性”。伦敦大学副校长、皇家学会会员 L. N. G. 菲隆（L.N.G. Filon）在这一点上表示同意，指出“有些科学人士似乎以为，他们能凭某种包罗万象的数学直觉解决自然的全部问题”。皇家天文学家 R. A. 桑普森（R.A. Sampson）则聚焦于“现代亚里士多德主义者”的理性主义面向，即他们“脱离经验而构设理论——正如丁格尔博士文中所谴责的”，这种工作产出的东西，与“诗人或其他文人所能给我们的至多若干示例性事例”并无二致。
