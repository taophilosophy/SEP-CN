      Above and beyond his extreme language, Dingle makes certain substantive claims bearing directly upon central philosophical questions. The issue, as he sees it, is nothing more than the question “Whether the *foundation* of science shall be observation or invention” (Dingle 1937, p. 786)[^dingle-1937]. As always, talk about ‘foundations’ is philosophical talk. The two opposing positions Dingle here calls “foundational” involve views on both method and epistemology, suitably tangled together. Dingle delineates the opposed alternatives as follows. The way of true science, he claims, shows that “the first step in the study of Nature should be sense observation, no general principles being admitted which are not derived by induction therefrom” (Dingle 1937, p. 784)[^dingle-1937]. Stated more explicitly, Dingle here argues that authentic science is **empiricist** in epistemology (scientific knowledge is founded in sensory observation), and **inductivist** in method (general principles are reached via inductive logic). Opposed to this view, he argues, is “the doctrine that Nature is the visible working-out of general principles known to the human mind apart from sense perception” (Dingle 1937, p. 787)[^dingle-1937]. As representative of this latter view Dingle cites Milne, and refers in particular to Milne’s claim that “it is, in fact, possible to derive the laws of dynamics rationally…without recourse to experience” (Milne 1937, p. 329)[^milne-1937]. Obviously, Dingle is here arguing against the view, Milne’s view, that authentic science may be **rationalist** in epistemology (scientific knowledge is founded in pure theoretical reasoning apart from sense perception), and **hypothetico-deductive** in method (general principles are justified by their deductively implying correct observations).
    step1: |
      超出其极端措辞之外，丁格尔还提出了一些直接触及核心哲学问题的实质性主张。在他看来，问题不是别的，正是“科学的基础应当是观察还是发明”（Dingle 1937, p. 786）[^dingle-1937]。一如既往，关于“基础”的谈论就是哲学谈论。丁格尔在此称为“基础性”的两种对立立场，涉及关于方法与认识论的看法，二者适当地纠缠在一起。丁格尔把对立的两造勾画如下。真正的科学之路表明，“研究自然的第一步应当是感官观察，凡不是由归纳从其中得出的普遍原则都不予承认”（Dingle 1937, p. 784）[^dingle-1937]。说得更明白些，丁格尔在此主张：真正的科学在认识论上是**经验主义的**（科学知识奠基于感官观察），在方法上是**归纳主义的**（普遍原则经由归纳逻辑达到）。他论证说，与此对立的，是“这样一种学说：自然是人类心灵脱离感官知觉所知的普遍原则的可见展开”（Dingle 1937, p. 787）[^dingle-1937]。作为后一种观点的代表，丁格尔举出米尔恩，并特别引用米尔恩的说法：“事实上，有可能理性地推演出动力学定律……而无须诉诸经验”（Milne 1937, p. 329）[^milne-1937]。显然，丁格尔在此所反对的，正是米尔恩的观点：真正的科学在认识论上可以是**理性主义的**（科学知识奠基于脱离感官知觉的纯粹理论推理），在方法上可以是**假说—演绎的**（普遍原则之得到证成，在于它们演绎地蕴涵正确的观察）。
