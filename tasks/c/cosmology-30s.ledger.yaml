      One year later, Milne received his ultimate accolade, election as president of the Royal Astronomical Society. In his inaugural lecture, Milne again reviews his work, but adds two remarks of interest. First, he modifies his earlier view that theories are acceptable solely on the basis of their successful predictive power; to this, he now adds that a theory cannot be accepted as satisfactory unless it is philosophically satisfying (Milne 1943, p. 120)[^milne-1943]. Secondly, on a personal note, he admits that he is still amazed at the outcry that his theory and its philosophy caused. Milne here is being a bit disingenuous. In many places in his letters he not only recognizes the outcry, he delights in it, and seeks to provoke it even more (Milne 1932–37, 12 May 35; 28 Jul 36)[^milne-1932].
    step1: |
      一年后，米尔恩获得了他最终的殊荣：当选皇家天文学会会长。在就职演讲中，米尔恩再次回顾了自己的工作，但补充了两点值得注意的言论。第一，他修正了先前的看法，即理论仅凭其成功的预测能力便可被接受；现在他补充说，一个理论除非在哲学上令人满意，否则不能被接受为令人满意的理论（Milne 1943, p. 120）[^milne-1943]。第二，就个人而言，他承认自己仍对其理论及哲学所引起的强烈抗议感到惊讶。米尔恩在此有点言不由衷。在他的书信中，多处不仅承认这场抗议，而且乐在其中，还设法进一步挑起它（Milne 1932–37, 12 May 35; 28 Jul 36）[^milne-1932]。
