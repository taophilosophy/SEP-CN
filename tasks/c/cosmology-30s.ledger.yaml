      Hence, or so Bondi’s argument goes, since there is reason **not** to trust the laws of physics if the universe is evolving, let us presume that the universe is **not** evolving and changing; that is, let us presume PCP. Although the principle (and the theory which results from it—steady state cosmology) is, as McVittie remarked, “much more restrictive than general relativity”; (McVittie 1990, p. 45)[^mcvittie-1990] it is this very restrictiveness which satisfies Bondi’s Popperian wishes:
    step1: |
      因此，邦迪的论证是：既然若宇宙在演化，我们就有理由**不**相信物理定律，那么就让我们假定宇宙**不**在演化、不在变化；也就是说，让我们假定 PCP。尽管这一原理（以及由它得出的理论——稳恒态宇宙学）如麦克维蒂所说，“比广义相对论严格得多”（McVittie 1990, p. 45）[^mcvittie-1990]，但正是这种严格性满足了邦迪的波普尔式愿望：
    step2: |
