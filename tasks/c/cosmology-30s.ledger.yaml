      During the next several years, it became evident that Milne’s methods, and kinematic relativity as well, had reached respectability. One important sign of this progress was exhibited at an early 1939 joint meeting between the Royal Astronomical Society and the Physical Society of London, The meeting had as its goal a thorough review of the situation in cosmology. McVittie was chosen to present the observational situation; his report was soon published (McVittie, 1939). Reviewing the theoretical situation was George Temple, one of the most highly respected mathematicians of the time. Temple’s report saw print almost immediately (Temple 1939)[^temple-1939]. Within a short time, Temple’s paper took on the role of successor to Robertson’s definitive 1933 “Relativistic Cosmology” (Robertson 1933b)[^robertson-1933b].
