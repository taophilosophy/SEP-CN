      Few others would ever go so far as Eddington’s ontological heroism; yet epistemological and methodological heroism in the fight against Milne was not rare. Chief hero in this aspect of the attack on Milne was Herbert Dingle, a highly respected astrophysicist, and then-secretary of the Royal Astronomical Society. Dingle’s initial foray appeared as a response to Milne’s first detailed presentation of kinematic relativity (Milne 1933)[^milne-1933]. After claiming that while kinematic relativity did not differ appreciably from relativistic cosmology in its mathematical formalism or observable consequences, Dingle asserted that, on the other hand, it invited special criticism because it renounced “the fundamental principles of scientific method”, namely, “Newton’s principle of induction from phenomena” (Dingle 1933, p. 178)[^dingle-1933]. Dingle was never to relent in his attacks upon Milne’s hypothetico-deductivism, at all times rejecting the methodology as even a possible candidate for acceptance by genuine science.
    step1: |
      几乎没有人会像爱丁顿那样走那么远，达到本体论的英勇；但在反对米尔恩的斗争中，认识论与方法论的英勇却并不罕见。这场对米尔恩攻击的主角，是赫伯特·丁格尔（Herbert Dingle），一位备受尊敬的天体物理学家，时任皇家天文学会（Royal Astronomical Society）秘书。丁格尔的初次出击，是对米尔恩首次详细阐述运动学相对论的回应（Milne 1933）[^milne-1933]。丁格尔在声称运动学相对论在数学形式或可观测结果上与相对论宇宙学并无显著差异之后，又断言它招致特殊批评，因为它抛弃了“科学方法的基本原则”，即“牛顿从现象归纳的原理”（Dingle 1933, p. 178）[^dingle-1933]。丁格尔对米尔恩假说—演绎主义的攻击从未松懈，始终拒绝把这一方法论视为真正科学可能接受的候选。
