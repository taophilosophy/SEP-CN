  - id: p1
    source: |
      Sometimes, philosophy drives science. Cosmology between 1932–48 provides an excellent example how explicitly philosophical considerations directed the evolution of a modern science during a crucial period of its development. The following article exhibits these philosophical aspects of cosmological thinking in detail, beginning with a brief sketch of the historical development of general relativity cosmology until 1932. Following this, the historical participants in the philosophical debate are introduced, along with the basic ideas of their competing positions. Then the critical stages of the debate — 1935–37 — are closely explored by focussing directly upon the arguments of the participating scientists and philosophers. Finally, the concluding stage of the philosophical debate, namely, the emergence of the steady-state theory of the Universe, is presented in the context of its development from Popper’s philosophy of science.
    step1: |
      有时，哲学驱动着科学。1932 至 1948 年间的宇宙学提供了一个极好的例子，说明在这一门现代科学发展的关键时期，明确的哲学考量如何引导了它的演进。本文详细展示了宇宙学思想中这些哲学方面，先简要勾勒 1932 年之前广义相对论宇宙学的历史发展。接着，介绍这场哲学辩论中的历史参与者，以及他们彼此对立立场的基本观念。然后，通过直接聚焦参与其中的科学家与哲学家的论证，深入考察这场辩论的关键阶段——1935 至 1937 年。最后，呈现这场哲学辩论的收尾阶段，即宇宙稳恒态理论的兴起，并置于它从波普尔科学哲学中发展而来的语境之中。
    step2: |
      有时，哲学驱动科学。1932 至 1948 年间的宇宙学提供了一个绝佳例证，说明在某一现代科学发展的关键时期，明确的哲学考量如何引导了它的演进。本文详细展示宇宙学思想中的这些哲学面向：先简要勾勒 1932 年之前广义相对论宇宙学的历史发展；接着介绍这场哲学辩论的历史参与者，以及他们彼此对立立场的基本观念；随后深入考察这场辩论的关键阶段——1935 至 1937 年——直接聚焦参与其中的科学家与哲学家的论证；最后呈现这场哲学辩论的收尾阶段，即宇宙稳恒态理论的兴起，并置于它从波普尔科学哲学中发展而来的语境之中。
  - id: p2
    source: |
      One of the most vigorous philosophical debates of the century broke out among cosmologists during the 1930s and 1940s. At the peak of the debate, 1936–37, many of the most prominent scientists in Britain, as well as several leading philosophers of science, had gotten themselves publicly involved. Their arguments, attacks and rebuttals were chronicled in many of the leading scientific journals, including a special edition of the foremost general scientific journal, *Nature*, devoted entirely to philosophical arguments and counter-arguments.
    step1: |
      20 世纪 30 年代和 40 年代，宇宙学家之间爆发了本世纪最激烈的哲学辩论之一。在辩论的高峰期，1936 至 1937 年，英国许多最杰出的科学家，以及几位顶尖的科学哲学家，都公开卷入了这场争论。他们的论证、攻击和反驳被许多顶级科学期刊记录下来，其中包括最重要的综合性科学期刊《自然》（*Nature*）的一期特刊，整期专门用于刊载哲学论证和反驳。
    step2: |
      20 世纪 30 年代和 40 年代，宇宙学家之间爆发了本世纪最激烈的哲学辩论之一。在辩论的高峰期，即 1936 至 1937 年，英国许多最杰出的科学家，以及几位顶尖的科学哲学家，都公开卷入了这场争论。他们的论证、攻击与反驳被许多顶级科学期刊刊载，其中还包括最重要的综合性科学期刊《自然》（*Nature*）的一期特刊，整期专门刊载哲学论证与反驳。
  - id: p3
    source: |
      Methodology was the central issue of the debate, although metaphysical questions also arose, particularly those concerning the actual reality of certain structures and forces imputed to the Universe by the new cosmological theories and observations. But in the end, methodology was the real goad spurring on most of the participants.
    step1: |
      方法论是这场辩论的核心问题，尽管形而上学问题也出现了，尤其是关于新的宇宙学理论与观测赋予宇宙的某些结构和力的实际实在性的问题。但归根结底，方法论才是真正激励大多数参与者的动力。
