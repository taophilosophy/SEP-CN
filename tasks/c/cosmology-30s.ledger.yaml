      To begin with, the cosmological thinking of the majority of scientists—including Eddington, de Sitter, Robertson, Tolman, and their colleagues—had betrayed a relatively unexamined, and apparently uncontroversial cluster of philosophical perspectives: on the metaphysical side they held a modest sort of *explanatory realism*—if an accepted theory referred to entity *x*, then *x* was acceptable as a genuinely, physically real object; to this metaphysical stance was coupled a methodology exhibiting a classic sort of *inductive empiricism*—scientific knowledge consisted of generalizations built up from individual empirical observations. But this cluster of views did not go long unchallenged. In early July 1932, just nine months after relativistic cosmology became the consensus during the British Association meeting, Oxford astrophysicist E. A. Milne published a short article in *Nature* which directly attacked the current philosophical tenets, proposing their replacement by a new cluster of views, one as radical as the new science it purported to undergird.
    step1: |
      首先，大多数科学家——包括爱丁顿（Eddington）、德西特、罗伯逊、托尔曼及其同事——的宇宙学思想，已经显露出一个相对未经审视、且显然没有争议的哲学观点群：在形而上学方面，他们持有一种温和的*说明性实在论*——如果一个被接受的理论指称实体 *x*，那么 *x* 就可以被接受为一个真正、物理上实在的对象；与这一形而上学立场相耦合的，是一种体现经典*归纳经验主义*的方法论——科学知识由从个别经验观察中建立起来的概括构成。但这个观点群并没有长期不受挑战。1932 年 7 月初，就在相对论宇宙学于英国科学促进会会议期间成为共识的九个月后，牛津天体物理学家 E. A. 米尔恩（E. A. Milne）在《自然》上发表了一篇短文，直接攻击当时的哲学信条，提议用一个新观点群取而代之，其激进程度不亚于它所声称要支撑的新科学。
