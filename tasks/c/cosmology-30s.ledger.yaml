      Controversy over Milne and his philosophy reached a crescendo in mid-1937. Dingle, his stew having finally boiled over, wrote privately to the editor of *Nature*, first castigating the rampant cosmological ‘mysticism’ passing itself off for science, and then offering to produce an article taking the sword to the mystics themselves. His offer was immediately accepted. The result was Dingle’s notorious “Modern Aristotelianism”, a polemical diatribe chiefly against Milne, but aimed as well at Eddington and Dirac on account of their “betrayal” of the scientific method of Newton and his fellow members of the Royal Society (Dingle 1937)[^dingle-1937].
