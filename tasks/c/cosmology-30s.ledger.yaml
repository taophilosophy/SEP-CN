      Right from the start, cosmologists differed in their opinions about both the physical content of Milne’s theory, and its underlying philosophy. Dingle disliked Milne’s methods, but found the theory itself of not much interest. Robertson initially agreed with Dingle, but within a short time had significant changes of heart. Eddington disliked both the theory and its philosophy, finding them far too deviant from what was typical, i.e., relativistic cosmology and its mainstream philosophy. Younger cosmologists such as McVittie and McCrea, students, respectively, of Eddington and Whittaker, soon joined the fray. McVittie initially found the physics of kinematic relativity quite interesting, and quite different from the physics of relativistic cosmology (McVittie 1933b)[^mcvittie-1933b]. But Milne’s philosophy was something else; the strict empiricism McVittie had earlier revealed (McVittie 1933a)[^mcvittie-1933a] made him equally unhappy with both Milne’s rationalism and his hypothetico-deductivism.
