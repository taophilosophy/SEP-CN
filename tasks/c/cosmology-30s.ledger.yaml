      Here Bondi speaks of Milne’s cosmological principle. According to Milne’s principle, every observer in the universe should get the same world picture, that is, should make precisely the same observations of the universe at the same moment as any other observer (Milne 1934b)[^milne-1934b]. Uniformity over spatial slices is guaranteed by Milne’s invoking of the principle. Yet Milne’s universe evolves, it changes its form over time. Hence it has no temporal uniformity. Bondi felt that this raised the possibility that physics itself might change over time. Because of this risk, Bondi generalized Milne’s cosmological principle into what he called the *perfect cosmological principle* [= PCP]. According to this principle, all observers at all places and **at all times** will look out upon the same unchanging, unevolving, universe. Such a universe is a universe in a steady-state—hence the name.
    step1: |
      这里邦迪谈的是米尔恩的宇宙学原理。按照米尔恩的原理，宇宙中每个观察者都应当得到相同的世界图景，也就是说，任一观察者在同一时刻对宇宙所作的观察，都应与任何其他观察者所作的完全一样（Milne 1934b）[^milne-1934b]。空间切片上的均匀性，由米尔恩对该原理的援引而获得保证。然而米尔恩的宇宙是演化的，其形态随时间而变。因此它没有时间上的均匀性。邦迪觉得，这就带来了物理学本身可能随时间改变的可能性。由于这一风险，邦迪把米尔恩的宇宙学原理推广为他所称的*完美宇宙学原理*［＝PCP］。按照这一原理，位于一切地点、**在一切时刻**的一切观察者，都将望见同一个不变化、不演化的宇宙。这样的宇宙是处于稳恒态的宇宙——名称即由此而来。
    step2: |
