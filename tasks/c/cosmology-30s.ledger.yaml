      Both McVittie and Temple presented kinematic relativity and relativistic cosmology as equal competitors in accounting for the cosmological observations. Unfortunately, as McVittie noted, observations could not, at that time, discriminate between the two theories. Temple’s analysis of Milne’s work praises its simplicity and elegance, and refers in particular to its operationalism and axiomatization, which “start from a completely novel discussion of the correlation of measurements made by different observers in terms of light signals only” (Temple 1939, p. 468)[^temple-1939]. Throughout the rest of his discussion of the two theories, Temple utilizes Milne’s light-signal correlation method, explicitly rejecting rigid-rod transport for distance measurement. Milne’s methods have triumphed.
