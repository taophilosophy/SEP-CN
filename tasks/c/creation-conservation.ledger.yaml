      The alternative to this view is that the act of conserving beings that already exist differs from calling beings into existence from nothing. Some argue that each persisting creature plays a causal role in its ongoing existence, so that God is not the sole agent as in an *ex nihilo* creation. Some also argue that conservation must be an ongoing act, whereas creation occurs at an instant.
    step1: |
      这一观点的替代方案是，保全已经存在的存在者的行动，不同于从无中召唤存在者进入存在。有些人论证，每个持续存在的受造物在其持续存在中扮演因果角色，因此上帝不是如在*从无中*创造中那样的唯一动因。也有人论证，保全必须是一个持续进行的行动，而创造则发生在一个瞬间。
    step2: |
      与这一观点相对立的方案是：保全那些已经存在的存在者，不同于从无中召唤存在者进入存在。有些人论证，每一个持续存在的受造物在其持续存在中都扮演着因果角色，因此上帝并非如*从无中*创造那样是唯一的动因。也有人论证，保全必须是一个持续进行的行动，而创造则发生于一个瞬间。
  - id: 4
    source: |
      A large part of what is at stake in the debate is the relationship between divine action and creaturely action. Continuous creation theorists may reject a distinction between creation and conservation as an attempt to attribute a divine prerogative to created things. On the other hand, those who endorse a distinction may regard continuous creation theory as (to borrow a phrase) “one of those high-minded philosophical depreciations of God’s works that come disguised as compliments to God’s person” (van Inwagen 1988, 46 n4)[^inwagen-1988]. The debate also raises a number of interesting questions about causation, time, and their relations.
    step1: |
      这场论辩中利害攸关的一大部分，是神圣行动与受造物行动之间的关系。连续创造论者可能拒斥创造与保全之间的区分，认为这是把神圣特权归于受造物的企图。另一方面，那些赞同区分的人可能把连续创造论视为（借用一句话）“那种伪装成对上帝位格的恭维、实则是对上帝工作的崇高哲学贬损之一”（van Inwagen 1988, 46 n4）[^inwagen-1988]。这场论辩也提出了许多关于因果、时间及其关系的有趣问题。
    step2: |
      在这场论辩中，利害攸关的一个重大方面，是神圣行动与受造物行动之间的关系。连续创造论者可能拒斥创造与保全的区分，认为这是把一种神圣特权归于受造物的企图。另一方面，赞同这一区分的人则可能把连续创造论视为（借用一句话）“那种伪装成对上帝位格的恭维、实则是对上帝之工的高蹈哲学贬损之一”（van Inwagen 1988, 46 n4）[^inwagen-1988]。这场论辩还提出了许多关于因果、时间及其相互关系的有趣问题。
