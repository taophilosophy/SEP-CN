      One recent objection to continuous creation theory maintains that it implies that time is not real (Pavelich 2007, 16–19)[^pavelich-2007]. Pavelich argues that for time to be real, it must have a kind of “temporal inertia,” a natural tendency to move from each moment to succeeding moments. This inertia would include a natural tendency of things existing at times to continue existing. But it is this very sort of inertia that continuous creation theory denies, since it says that the existence of times and objects in time depend solely on divine acts.
