      Apart from any particular argument for continuous creation theory, Philip Quinn argues that the view itself does not imply occasionalism (Quinn 1988)[^quinn-1988]. Whether causal relations are understood as Humean regularities, Lewisian counterfactual dependences, or necessary connections, the proposition that God is the sole cause of the existence of contingent beings does not entail that God is the only cause of events. It remains possible that contingent beings nonetheless have causal influence over the qualities and behavior of other such beings. The result is a cooperative picture of the evolving state of the world. “God and the lit match collaborate to produce the heated water: God provides the water, and the lit match provides the heat” (Quinn 1988, 70)[^quinn-1988].
