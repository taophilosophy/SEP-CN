      Is the idea of an innate self-sustaining quality tenable? Kvanvig and McCann consider a number of possible construals and argue that they are of dubious coherence. They also give an argument with an Edwardsian flavor. A power to perpetuate one’s own existence would be an ability to cause something to occur at a future time, a time at which the exercise of the power would no longer exist. No physical sequence of events could be the basis for such a time-jumping power, since such a sequence would itself depend on a power of this sort. So the power would need to bring about a future effect without the aid of any intervening events to connect them. But nothing that no longer exists can be causally operative, so there can be no such power (Kvanvig and McCann 1988, 42–3)[^kvanvig-1988].
    step1: |
      天赋的自我维持性质这一观念站得住脚吗？克万维格和麦卡恩考虑了几种可能的解释，并论证它们的一致性可疑。他们还给出了一个带有爱德华兹色彩的论证。使自己存在永续的力量，将是一种能在未来某个时间引起某物发生的能力，而那将是行使这一力量不再存在的时间。没有任何物理事件序列能成为这种跨越时间的力的基础，因为这样的序列本身将依赖于这种力量。因此，这种力量需要不经任何中介事件连接而带来未来结果。但任何不再存在的东西都不能因果地发挥作用，因此不可能有这种力量（Kvanvig and McCann 1988, 42–3）[^kvanvig-1988]。
    step2: |
      “天赋的自我维持性质”这一观念站得住脚吗？克万维格与麦卡恩考察了若干可能的解释，并论证它们的一致性是可疑的。他们还提出一个带爱德华兹色彩的论证。使自己存在得以永续的力量，将是一种能在未来某个时刻引起某物发生的能力——而那恰是行使这一力量已不再存在的时刻。没有任何物理事件序列能够充当这种跨越时间之力的基础，因为这样的序列本身也将依赖这类力量。因此，这种力量须得在没有任何中介事件加以连接的情况下带来未来结果。但任何已不存在之物都无法因果地发挥作用，故不可能存在这样的力量（Kvanvig and McCann 1988, 42–3）[^kvanvig-1988]。
