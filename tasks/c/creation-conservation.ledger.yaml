      This difference between creation and conservation also makes it clear, Craig argues, that the two occur at different times. Creation is instantaneous; it occurs at the moment that the created thing first exists. Though the creation of a thing is generally preceded by the thing’s nonexistence, the act itself is not an extended process of moving something from nonexistence to existence. Until it exists the thing is not there to be acted upon. But conservation is the act of preserving a thing in existence from one time to another, so it must occur over an interval of time (Craig 1998, 186–7)[^craig-1998]. In other words, creation is synchronic, but conservation is diachronic. In several ways, then, reflection on the very notions of creation and conservation lead us to see that the two are to be distinguished.
    step1: |
      克雷格论证，创造与保全之间的这一差异也表明，二者发生在不同的时间。创造是瞬间的；它发生在被造物首次存在的时刻。虽然一物的创造通常为该物的不存在所先行，但行动本身不是把某物从不存在移至存在的延展过程。直到它存在，该物才在那里被作用。但保全是把一物从某一时间保存于存在之中直到另一时间的行动，所以它必须发生在一个时间间隔上（Craig 1998, 186–7）[^craig-1998]。换言之，创造是共时性的，而保全历时性的。那么，在几个方面，对创造与保全这些概念本身的反思，使我们看到二者应当被区分。
