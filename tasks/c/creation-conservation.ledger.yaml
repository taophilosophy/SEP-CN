      Miller’s own objection to the agent-patient theory is that it does not allow God to conserve continuously (2009, 478–483). Though conservation is in general diachronic on the agent-patient theory, God’s initial act of conservation must occur at the moment the patient first exists. This act either brings about the existence of the patient at a later moment or through a later interval. If at a later moment, then the patient will not exist at the times between its creation and the moment in question. If through a later interval,[^note-3] then during that interval God would not need to conserve the patient, since its existence over that interval then would have already been secured by God’s conserving act at its first moment. Any conserving act during the interval would be redundant. Beyond the interval the dilemma arises again, suggesting that conservation on the agent-patient theory would need to be discontinuous, something like a person pushing a merry-go-round every few seconds to keep it spinning.
    step1: |
      米勒自己对施动者-承受者理论的反驳是，它不允许上帝连续保全（2009, 478–483）。虽然在施动者-承受者理论中保全一般是历时性的，上帝最初的保全行动必须发生在承受者首次存在的时刻。这一行动要么在较晚的时刻带来承受者的存在，要么通过较晚的间隔。如果在较晚的时刻，那么承受者在其创造与该时刻之间的时间里不存在。如果通过较晚的间隔，[^note-3]那么在该间隔期间上帝就不需要保全承受者，因为它在该间隔期间的存在那时已由上帝在其最初时刻的保全行动所确保。间隔期间的任何保全行动都将是多余的。超出该间隔，两难再次出现，表明施动者-承受者理论中的保全需要是不连续的，有点像一个人每隔几秒推一次旋转木马以保持它转动。
    step2: |
      米勒自己对施动者-承受者理论的反驳是：它不允许上帝连续保全（2009, 478–483）。尽管在施动者-承受者理论中保全一般是历时性的，上帝最初的保全行动却必须发生在承受者首次存在的时刻。这一行动要么在较晚的时刻带来承受者的存在，要么通过一个较晚的间隔。若在较晚的时刻，则承受者在其创造与该时刻之间的诸时间便不存在。若通过一个较晚的间隔，[^note-3]那么在该间隔期间上帝便无须保全承受者，因为它在该间隔期间的存在，届时已由上帝在其最初时刻的保全行动所确保。间隔期间的任何保全行动都将成为多余。超出该间隔，两难便再度出现，这表明施动者-承受者理论中的保全将需要是不连续的，正如一个人每隔几秒推一次旋转木马以使其保持转动。
