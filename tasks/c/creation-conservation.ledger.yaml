slug: creation-conservation
segments:
  - id: 1
    source: |
      In the philosophy of religion, *creation* is the action by which God brings an object into existence, while *conservation* is the action by which God maintains the existence of an object over time. The major monotheisms unambiguously affirm that God both created the world and conserves it. It is less clear, however, whether creation and conservation are to be conceived as distinct kinds of actions. The question has its roots in medieval and early modern characterizations of divine action, and it has received renewed attention in recent decades.
    step1: |
      在宗教哲学中，*创造*是上帝使一个对象进入存在的行动，而*保全*是上帝随时间推移维持一个对象存在的行动。主要的诸一神教明确肯定：上帝既创造了世界，又保全着它。然而，创造与保全是否应被构想为不同种类的行动，这一点却不那么清楚。这一问题根植于中世纪和早期近代对神圣行动的刻画，近几十年来又重新受到关注。
    step2: |
      在宗教哲学中，*创造*是上帝使某一对象进入存在的行动，而*保全*是上帝随时间推移维持某一对象存在的行动。主要的诸一神教都明确肯定：上帝既创造了世界，又保全着世界。然而，创造与保全是否应当被设想为不同种类的行动，这一点却不那么清楚。这一问题根植于中世纪与早期近代对神圣行动的刻画，近几十年来又重新受到关注。
  - id: 2
    source: |
      On the predominant traditional view, conservation is continuous creation. Adherents of this view typically say with Francisco Suárez that God’s creation and conservation of things are “only conceptually distinct” (Suárez 1597, 120). Jonathan Edwards, for example, says, “God’s upholding created substance, or causing its existence in each successive moment, is altogether equivalent to an immediate production out of nothing, at each moment…. So that this effect differs not at all from the first creation, but only circumstantially…” (Edwards 1758, 402)[^edwards-1758]. In other words, there is no real difference between the act of creation and the act of conservation, though different words may be used for them. Descartes, Malebranche, Leibniz, and Berkeley all express similar views. More recently, Philip Quinn likewise treats both God’s creating and God’s conserving as species of bringing about a thing’s existence. We call the act ‘creation’ if it occurs at the first time at which the creature exists, and we call it ‘conservation’ if it occurs at a later time, but the action is the same (e.g., Quinn 1988, 54)[^quinn-1988].
    step1: |
      在占主导地位的传统观点看来，保全就是连续创造。这一观点的信奉者通常随弗朗西斯科·苏亚雷斯（Francisco Suárez）一起说，上帝对万物的创造与保全“只是在概念上相区别”（Suárez 1597, 120）。例如，乔纳森·爱德华兹（Jonathan Edwards）说，“上帝维持被造实体，或使其在每个相继时刻存在，完全等同于在每个时刻从无中直接产生……因此这一结果与最初的创造毫无差别，只是在环境上不同……”（Edwards 1758, 402）[^edwards-1758]。换言之，创造的行动与保全的行动之间没有真正的区别，尽管可能用不同的词来描述它们。笛卡尔（Descartes）、马勒布朗士（Malebranche）、莱布尼茨（Leibniz）和贝克莱（Berkeley）都表达了类似的观点。晚近以来，菲利普·奎因（Philip Quinn）同样把上帝的创造和上帝的保全都视为带来某物存在的种类。如果行动发生在受造物首次存在的时刻，我们称之为‘创造’；如果发生在较晚的时刻，我们称之为‘保全’，但行动是相同的（例如 Quinn 1988, 54）[^quinn-1988]。
    step2: |
      在占主导地位的传统观点看来，保全就是连续创造。这一观点的信奉者通常随弗朗西斯科·苏亚雷斯（Francisco Suárez）一起说，上帝对万物的创造与保全“只是在概念上相区别”（Suárez 1597, 120）。例如，乔纳森·爱德华兹（Jonathan Edwards）说，“上帝维持被造实体，或使其于每个相继时刻存在，完全等同于在每个时刻从无中直接产生……因此这一结果与最初的创造毫无差异，只在环境上有所不同……”（Edwards 1758, 402）[^edwards-1758]。换言之，创造的行动与保全的行动并无真正的区别，尽管可用不同的词语来指称它们。笛卡尔（Descartes）、马勒布朗士（Malebranche）、莱布尼茨（Leibniz）与贝克莱（Berkeley）都表达了类似的看法。晚近以来，菲利普·奎因（Philip Quinn）同样把上帝的创造与上帝的保全视为带来某物之存在的不同种类。若行动发生在受造物首次存在的时刻，我们称之为“创造”；若发生在较晚的时刻，则称之为“保全”——但行动本身是相同的（例如 Quinn 1988, 54）[^quinn-1988]。
