      Vallicella observes first that if conservation has a patient, God’s conservation of it must be diachronic. If the act of conservation were simultaneous with the effect of the object’s existence, then God’s act at a time would both cause and presuppose the existence of that object at that time. So the act must occur at an earlier time or over an earlier interval. Next Vallicella argues that if God creates an object *ex nihilo* at *t*, God cannot conserve it at *t* since it does not yet exist. Clearly God cannot begin to conserve an object at a time after it is created, since the object would only exist at that time if it had already been conserved. So there is no time at which God can begin to conserve an object. Miller responds by wondering why the object would not exist at *t*. Vallicella’s distinction between the time of an object’s coming into existence and the first time at which it exists is dubious, since a nonexistent object could not undergo a process of coming into existence (Miller 2009, 477)[^miller-2009].
    step1: |
      瓦利切拉首先观察到，如果保全有一个承受者，上帝对它的保全必须是历时性的。如果保全行动与对象存在的效果同时发生，那么上帝在某一时间的行动就会既引起又预设该对象在那时间的存在。所以行动必须发生在较早的时间或较早的间隔上。接着瓦利切拉论证，如果上帝在*t*创建了一个对象，上帝不能在*t*保全它，因为它还不存在。显然，上帝不能在被创造之后的时间开始保全一个对象，因为该对象只有已被保全才在那时间存在。所以没有上帝能开始保全一个对象的时间。米勒回应道，他想知道为什么对象在*t*不存在。瓦利切拉关于“对象进入存在的时间”与“它首次存在的时间”之间的区分是可疑的，因为一个不存在的对象不可能经历进入存在的过程（Miller 2009, 477）[^miller-2009]。
    step2: |
      瓦利切拉首先指出：如果保全有一个承受者，上帝对它的保全必须是历时性的。倘若保全行动与对象存在的效果同时发生，那么上帝在某一时间的行动便会既引起又预设该对象在那时间的存在。因此，该行动必须发生在较早的时间或较早的间隔上。接着瓦利切拉论证：若上帝在*t*创造了一个对象，上帝便不能在*t*保全它，因为它尚不存在。显然，上帝也不能在被创造之后的某个时间开始保全一个对象，因为该对象只有在已被保全的情况下才于那时间存在。因此，不存在上帝能够开始保全一个对象的时间。米勒回应道，他想知道为何对象在*t*不存在。瓦利切拉关于“对象进入存在的时间”与“它首次存在的时间”的区分是可疑的，因为一个不存在的对象不可能经历进入存在的过程（Miller 2009, 477）[^miller-2009]。
