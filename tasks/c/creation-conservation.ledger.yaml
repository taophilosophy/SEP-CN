      Andrew Pavelich poses what we may call the first-moment objection to such a view. If we consider the moment at which God creates a universe of objects in motion, it seems that the causal powers of the created objects could not account for the character of other objects, including their motion. At the first moment, only God’s creative power could affect their state. But if each later time is one at which God creates the world *ex nihilo*, then each time is relevantly similar to the first. At no time will a created thing be able to exercise its causal powers (Pavelich 2007, 12–13)[^pavelich-2007].
    step1: |
      安德鲁·帕维利奇（Andrew Pavelich）对这一观点提出了我们可以称之为“第一时刻反驳”的质疑。如果我们考虑上帝创造一个有运动对象的宇宙的时刻，被造对象的因果能力似乎无法说明其他对象的性质，包括它们的运动。在第一时刻，只有上帝的创造能力能影响它们的状态。但如果每一个较晚的时刻都是上帝*从无中*创造世界的时刻，那么每个时刻都与第一时刻在相关方面相似。在任何时刻，被造物都将无法行使它的因果能力（Pavelich 2007, 12–13）[^pavelich-2007]。
    step2: |
      安德鲁·帕维利奇（Andrew Pavelich）对这一观点提出了可称之为“第一时刻反驳”的质疑。倘若我们考察上帝创造一个有运动对象之宇宙的那个时刻，被造对象的因果能力似乎无法说明其他对象的性质，包括它们的运动。在第一时刻，只有上帝的创造能力能够影响它们的状态。但若每一个较晚的时刻都是上帝*从无中*创造世界的时刻，那么每个时刻都与第一时刻在相关方面相似。于是没有任何时刻，被造物能够行使它的因果能力（Pavelich 2007, 12–13）[^pavelich-2007]。
