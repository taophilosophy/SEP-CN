      Contemporary philosophers Jonathan Kvanvig and Hugh McCann argue for continuous creation theory on the basis of divine immutability. They defend their case against replies of two sorts: (1) attempts to limit the object of divine creation so as to exclude the continuing existence of creatures (while granting divine immutability), and (2) objections to divine immutability. As Kvanvig and McCann acknowledge, the notion of divine immutability faces a non-trivial challenge from the argument that an omniscient being must know what time it is, and must therefore change (see Kretzmann 1966)[^kretzmann-1966]. For this reason they suggest bolstering the case for continuous creation theory with additional arguments.
    step1: |
      当代哲学家乔纳森·克万维格（Jonathan Kvanvig）和休·麦卡恩（Hugh McCann）基于上帝的不变性为连续创造论辩护。他们针对两类回应为自己的主张辩护：（1）限制神圣创造对象的企图，以便排除受造物的持续存在（同时承认上帝的不变性），以及（2）对上帝不变性的反驳。正如克万维格和麦卡恩所承认的，上帝不变性的概念面临一个不小的挑战，即一个全知的存在者必须知道现在是什么时间，因此必须变化（见 Kretzmann 1966）[^kretzmann-1966]。为此，他们建议用额外的论证来加强连续创造论的论据。
    step2: |
