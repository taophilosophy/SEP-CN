      时间部分理论可能提示另一条防线。威廉·瓦利切拉（William Vallicella）简短地说，偶因论者可以通过主张时间是连续的、且持续存在的对象由连续统多个时间部分构成，来肯定受造物的持续存在（Vallicella 1996, 353 n. 20）[^vallicella-1996]。如果这是正确的，那么连续创造论者想必也能这样做。大卫·范德兰（David Vander Laan）考虑了一种时间部分策略，并发现它有困难。他论证，给定一个足够包容的组合理论，一系列对象确实可能组成一个在不同时间存在并由此持续存在的对象，但如果这些对象之间没有因果联系，那么它们的总和似乎不能是例如一个人格。任意的跨时间总和不一定由内在因果联系统一起来，但人格必须如此（Vander Laan 2006, 164）[^vander-2006]。
