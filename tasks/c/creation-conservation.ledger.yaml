      According to Craig, it is intuitively clear that creation and conservation are distinct actions since conservation has a patient (or object) and creation does not. To conserve a thing in being is to act *on* that thing. In contrast, to create a thing is not to act on it or on any other thing, but to bring it into existence from nothing. Thus the “circumstantial” distinction between creation and conservation (i.e., causing the existence of something that did not exist earlier vs. causing the existence of something that did exist earlier) requires a deeper distinction between the natures of the actions themselves (Craig 1998, 183)[^craig-1998]. We may call this an agent-patient theory of conservation (Miller 2009)[^miller-2009]. Craig finds this intuitive distinction expressed in Scotus, though Timothy Miller disputes this interpretation (2009, 475).
    step1: |
      根据克雷格，直觉上很清楚，创造与保全是不同的行动，因为保全有一个承受者（或对象），而创造没有。把一物保全于存在之中，就是*作用于*该物。相比之下，创造一物不是作用于它或任何其他物，而是从无中把它带入存在。因此，创造与保全之间的“环境性”区分（即引起某物之存在，而某物先前不存在 vs. 引起某物之存在，而某物先前已存在）要求行动本身的本性之间有更深的区分（Craig 1998, 183）[^craig-1998]。我们可以称之为保全的施动者-承受者理论（Miller 2009）[^miller-2009]。克雷格发现这一直觉区分在司各脱那里得到表达，尽管蒂莫西·米勒（Timothy Miller）质疑这一解释（2009, 475）。
    step2: |
