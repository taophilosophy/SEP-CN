      Occasionalism is the theory that there is no genuine secondary causation, since God is not only the first cause but the only cause. We might be tempted to regard a fire beneath a pot of water as a created cause, but its presence is merely an occasion for God to cause the water to boil. The worry about the sole-source thesis, then, is that it implies occasionalism. William Lane Craig, for example, says that continuous creation theory “runs the risk of falling into the radical occasionalism of certain medieval Islamic theologians …” (Craig 1998, 183)[^craig-1998].[^note-1] The Ash’arites, for example, believed on scriptural grounds that only God has agency (McGinnis 2006)[^mcginnis-2006]. They offered a variety of arguments for occasionalism and against Avicenna’s position that created objects have natures as Aristotle conceived of them and thus have causal powers essentially.
    step1: |
      偶因论是这样一种理论：不存在真正的第二性因果作用，因为上帝不仅是第一因，而且是唯一的原因。我们可能会被诱惑把锅下的火视为受造动因，但它的在场只是上帝使水沸腾的一个机缘。那么，对唯一源泉论题的担忧就是它蕴含偶因论。例如，威廉·莱恩·克雷格（William Lane Craig）说，连续创造论“有陷入某些中世纪伊斯兰神学家的激进偶因论的危险……”（Craig 1998, 183）[^craig-1998]。[^note-1] 例如，艾什尔里派基于经文理由相信只有上帝有能动性（McGinnis 2006）[^mcginnis-2006]。他们提出了各种论证支持偶因论，反对阿维森纳的立场——即被造对象具有亚里士多德所设想的那种本性，因而本质上具有因果能力。
