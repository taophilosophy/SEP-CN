      这篇论文的主干于 1879 年首次发表在《心灵》上，1882 年刊于《普林斯顿评论》，1897 年又重刊于《信仰的意志及其他大众哲学论文》。尽管他从未完全明说理性是一种情感，但詹姆斯认为，一种情感——其实是一组情感——是理性的一个“标志”。詹姆斯写道，哲学家将认识一个概念的合理性，“正如他认识其他一切事物一样，凭借某些它作用于他的主观标志。当他获得这些标志时，他就可以知道自己已经把握了合理性。”这些标志包括一种“轻松、平和、安息的强烈感受”（WB 57），以及一种“当下时刻的充足感、其绝对性”（WB 58）。还有对“简约的激情”（WB 58），在把握理论统一时感受到；以及一种区分辨异的激情，一种“对知觉的清晰与完整性的忠诚，对模糊轮廓、含混认同的厌恶”（WB 59）。詹姆斯认为，理想的哲学家把理性的这两种激情熔于一炉，而即使一些伟大的哲学家也在某一方向上走得过头：斯宾诺莎把万物统一于一个实体是“贫瘠的”，休谟的“‘松散分离’的万物”亦然（WB 60）。
