      詹姆斯论“实用主义与人文主义”的章节阐述了他的唯意志论认识论。“我们雕刻出一切，”詹姆斯说，“正如我们雕刻出星座，为的是服务于我们人类的目的”（P 100）。然而，他承认“每一次真理制造的经验中都有抵抗因素”（P 117），这不仅包括我们当下的感觉或经验，也包括我们全部先前的信念。詹姆斯既不主张我们凭空创造真理，也不主张真理完全独立于人类。他拥抱“人文主义原则：你不能剔除人类的贡献”（P 122）。他还拥抱一种过程形而上学，主张“对实用主义而言，[实在]仍在制造之中”，而对“理性主义而言，实在从永恒中就已现成而完整”（P 123）。《实用主义》论“实用主义与宗教”的末章，沿袭《宗教经验种种》的路线，攻击“先验绝对主义”那不可验证的上帝说明，并为一种基于人类经验的“多元论的道德主义宗教”辩护（144）。“按照实用主义原则，”詹姆斯写道，“如果上帝的假设在‘真’字最宽泛的意义上令人满意地起作用，那么它就是真的”（143）。
