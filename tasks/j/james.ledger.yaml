      实用主义真理论是本书第六章（某种程度上也是第二章）的主题。詹姆斯认为，真理是“一种善”，就像健康。真理是善，因为我们能“乘着”它们驶向未来而不被不愉快地惊吓。它们“引导我们进入有用的言辞与概念区域，也直接把我们带到有用的感性终点。它们导向一致、稳定与流畅的人际交流。它们使我们远离偏执与孤立，远离受挫而贫瘠的思维”（103）。尽管詹姆斯认为真理是在人类经验进程中“*被制造*”（104）的，而且大部分情况下它们靠“信贷体系”生活，即它们当下并未被验证；但他也持经验论的观点：“被*某人*具体验证过的信念，是整个上层建筑的支柱”（P 100）。
