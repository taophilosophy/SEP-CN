      正如在他论斯宾塞的文章中一样，詹姆斯探讨了气质与哲学理论化之间的关系。他认为，唯心论“将被一种情感构造的人选择，唯物论被另一种人选择。”唯心论提供一种与宇宙的亲昵感，那种最终我“即一切”的感受。但唯物论者在唯心论中发现了“一种狭隘、逼仄、病房般的空气”，并宁愿设想一个不确定、危险而狂野、对“我们的自我毫无尊重”的宇宙。让“潮水奔涌”，唯物论者想，“即使它们从我们身上漫过”（WB 76）。詹姆斯既同情“宇宙是我们可以与之亲昵的东西”这一观念，也同情“它是狂野而不可预测的”这一观念。如果他批评唯心论有“病房般的空气”，他也批评还原论的唯物论形式，因为后者否认“我们最亲密的官能……在宇宙事务中的任何相关性”（WB 71）。这些对照的哲学所刻画的亲昵与狂野，回应着人类身上的倾向、激情与官能；詹姆斯预言，这两种“心理气质”形式之间的“纷争”，将永远在哲学中看到（WB 76）。当然，在威廉·詹姆斯的哲学中它总是能看到。
