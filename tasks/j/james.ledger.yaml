      这部身后出版的文集收录了詹姆斯论“纯粹经验”的开创性论文，最初发表于 1904–5 年。詹姆斯的基本观念是：心灵与物质都是一个更基本的质料——纯粹经验——的方面，或由它所形成的结构；纯粹经验（尽管被称为“经验”）既非心灵的也非物理的。詹姆斯解释说，纯粹经验是“生活的直接流变，它为我们后来的反思及其概念范畴提供材料……一个尚非任何确定的‘什么’的‘那个’，尽管准备成为种种‘什么’……”（ERE 46）。纯粹经验可能成为的那些“什么”，是心灵与身体、人与物质对象；但这并不取决于这些“纯粹经验”之间根本的本体论差异，而取决于它们所进入的*关系*。某些纯粹经验的序列构成物理对象，另一些构成人；但一个纯粹经验（比如说一把椅子的知觉）可能既是构成椅子的序列的一部分，也是构成一个人的序列的一部分。事实上，一个纯粹经验可能是两个不同心灵的一部分，正如詹姆斯在题为“两个心灵如何能认识同一事物”的章节中所解释的。
