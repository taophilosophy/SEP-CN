      詹姆斯在早期论“健康心灵之宗教”与“病态灵魂”的章节中确立了本书的一个核心区分。健康心灵的宗教人——沃尔特·惠特曼是詹姆斯的主要例子之一——对“生命之善”有深刻的感受（V 79），并拥有“天蓝色调”的灵魂（V 80）。健康心灵可以是非自愿的，对某人来说只是自然而然；但它常以更执意的形式出现。例如，自由派基督教代表着一种对健康心灵的坚定虔诚对病态的“旧地狱之火神学”的胜利（V 91）。詹姆斯还援引了玛丽·贝克·埃迪的“心灵疗法运动”，对她而言“恶不过是一个谎言，任何提及它的人都是说谎者”（V 107）。相反，对于“病态灵魂”，“根本的恶获得了它的出场机会”（V 163）。无论一个人感到多么安全，病态灵魂都会发现：“正如老诗人所说，不知不觉地从每一道快乐之泉的底部，有苦涩的东西涌起：一丝恶心，快乐的猝然沉寂，一阵忧郁的气息……”这些状态不只是不愉快的感受，因为它们带来“一种来自更深区域的感受，并常常具有惊人的说服力”（V 136）。詹姆斯的主要例子是列夫·托尔斯泰的《我的忏悔》、约翰·班扬的自传，以及一份关于可怖“恐惧”的报告——据称来自一位法国通讯员，实际上出自詹姆斯本人。有些病态灵魂从未痊愈，另一些则康复甚至凯旋：这些是“重生者”。在论“分裂的自我及其统一过程”与论“皈依”的章节中，詹姆斯讨论了圣奥古斯丁、亨利·艾林、班扬、托尔斯泰以及一系列通俗布道家，聚焦于他所称他们达到的“确信状态”（V 247）。这一状态的核心是“一切忧虑的消失，那种最终一切都好的感受，那平静，那和谐，那*愿意存在*，即使外部条件保持不变”（V 248）。
