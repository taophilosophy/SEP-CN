      James was still working on objections to his “pure experience” doctrine, replying to critics of *Pragmatism*, and writing an introduction to philosophical problems when he died in 1910. His legacy extends into psychology and the study of religion, and in philosophy not only throughout the pragmatist tradition that he founded (along with Charles Peirce), but into phenomenology and analytic philosophy. Edmund Husserl incorporated James’s notions of the “fringe” and “halo” into his phenomenology (Moran, pp. 276–80), Bertrand Russell’s *The Analysis of Mind* is indebted to James’s doctrine of “pure experience,” (Russell, 1921, pp. 22–6), Ludwig Wittgenstein learned about “the absence of the will act” from James’s *Psychology* (Goodman, *Wittgenstein and William James*, p. 81), and the versions of “neopragmatism” set out by Nelson Goodman, Richard Rorty and Hilary Putnam are saturated with James’s ideas. In physics, James’s humanistic pragmatism, and his suggestion that “new being come[s] in local spots and patches” (P 138; Fuchs 2017, p. 33)[^fuchs-2017] have inspired the version of quantum theory known as QBism (see Healey). James is one of the most attractive and endearing of philosophers: for his vision of a “wild,” “open” universe that is nevertheless shaped by our human powers and answers to some of our deepest needs, but also, as Russell observed in his obituary, because of the “large tolerance and … humanity” with which he sets that vision out. (*The Nation* (3 September 1910: 793–4).
    step1: |-
      詹姆斯 1910 年去世时，仍在研究针对其“纯粹经验”学说的反驳意见、回应《实用主义》的批评者，并撰写一篇哲学问题导言。他的遗产延伸到心理学与宗教研究；在哲学中，不仅贯穿他（与查尔斯·皮尔士一道）创立的实用主义传统，也延伸进现象学与分析哲学。埃德蒙德·胡塞尔把詹姆斯的“边缘”与“光晕”概念纳入他的现象学（Moran，第 276–80 页），伯特兰·罗素的《心的分析》受惠于詹姆斯的“纯粹经验”学说（Russell，1921，第 22–6 页），路德维希·维特根斯坦从詹姆斯的《心理学》得知“意志行为的缺失”（Goodman，《维特根斯坦与威廉·詹姆斯》，第 81 页），而纳尔逊·古德曼、理查德·罗蒂与希拉里·普特南提出的“新实用主义”版本则浸透着詹姆斯的思想。在物理学中，詹姆斯的人文主义实用主义，以及他“新存在以局部的点与片进入”（P 138；Fuchs 2017，第 33 页）[^fuchs-2017]的提示，启发了被称为 QBism 的量子理论版本（见 Healey）。詹姆斯是最有魅力、最令人喜爱可亲的哲学家之一：因为他所见的那个“狂野”、“开放”却仍由我们人类力量塑造、回应我们某些最深切需要的宇宙；同时，正如罗素在他的讣告中所观察到的，也因为他展现这一视野时那“宽大的宽容与……人道”。（《民族》，1910 年 9 月 3 日：第 793–4 页。
