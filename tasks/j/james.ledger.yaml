      James passes from critical discussions of Josiah Royce’s idealism and the “vicious intellectualism” of Hegel to philosophers whose visions he admires: Gustav Fechner and Henri Bergson. He praises Fechner for holding that “the whole universe in its different spans and wave-lengths, exclusions and developments, is everywhere alive and conscious” (PU, 70), and he seeks to refine and justify Fechner’s idea that separate human, animal and vegetable consciousnesses meet or merge in a “consciousness of still wider scope” (PU 72). James employs Henri Bergson’s critique of “intellectualism” to argue that the “concrete pulses of experience appear pent in by no such definite limits as our conceptual substitutes are confined by. They run into one another continuously and seem to interpenetrate” (PU 127). James concludes by embracing a position that he had more tentatively set forth in *The Varieties of Religious Experience*: that religious experiences “point with reasonable probability to the continuity of our consciousness with a wider spiritual environment from which the ordinary prudential man (who is the only man that scientific psychology, so called, takes cognizance of) is shut off” (PU 135). Whereas in *Pragmatism* James subsumes the religious within the pragmatic (as yet another way of successfully making one’s way through the world), in *A Pluralistic Universe* he suggests that the religious offers a superior relation to the universe.
