      《宗教经验种种》中经典的论“神秘主义”章节提出“四个标志，当一个经验具备它们时，就可以证成我们称它为神秘的……”（V 380）。第一是不可言说性：“它无法言说……其品质必须被直接经验；它不能被传授或转达给他人。”第二是一种“认知品质”：神秘状态呈现为知识状态。第三，神秘状态是短暂的；第四，主体对它们是被动的：他们无法控制它们的来去。詹姆斯以这一问题结束本章：这些状态是“心灵据以向外眺望一个更广阔、更包容世界的窗户吗[？]”（V 428）。
