      尽管《论某种盲目》讲的是宽容与对不同观点的欣赏，詹姆斯在论文中对英雄的选择展现了他自己的浪漫主义观点：华兹华斯、雪莱、爱默生和 W. H. 哈德逊，据说他们都有一种对“自然事物中无限意义”的感受（TT 244）。即使在城市中，街道的日常事件、河流与人流中也存在“不可测度的意义与重要性”（TT 254）。詹姆斯赞扬沃尔特·惠特曼，“一个白发苍苍的浪荡子”，因为他知道如何从生活的寻常机遇中获益：一个上午的写作和沐浴之后，惠特曼乘公共马车沿百老汇从第 23 街到保龄格林再返回，只为其中的乐趣与景象。“谁知道更多的真理，”詹姆斯问道，“是站在马车顶上、充满景象在他心中激起的内心喜悦的惠特曼，还是你——充满他那职业的徒劳所激起的轻蔑？”（TT 252）。詹姆斯对他人内心生活的兴趣，以及对像托尔斯泰这样与他同样理解其“神秘潮汐涨落”（TT 255）的作家的兴趣，引导他走向对宗教经验的长久研究，即 1901–2 年他所作的吉福德讲座，1902 年以《宗教经验种种》出版。
