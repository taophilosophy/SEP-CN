      实用主义气质出现在书的开篇章节，在那里（遵循他最初在《评斯宾塞的〈心灵即对应〉定义》中提出的方法）詹姆斯按气质对哲学家分类：此处是“硬心肠的”或“软心肠的”。实用主义者是这两个极端之间的调解者，像詹姆斯本人一样，既对事实有“科学的忠诚”，又有“对人类价值的旧日信心及由此而来的自发性，无论宗教型的还是浪漫型的”（P 17）。解决争端的方法与意义论，展现在詹姆斯关于一个争论的讨论中：一个人绕树追松鼠，是否也在绕松鼠？把意义当作“对象可能涉及的、实践类型的可设想结果”，实用主义哲学家发现“绕”有两个“实践”意义在起作用：要么这人在松鼠的北、东、南、西方向移动，要么他先面对松鼠的头，然后是一侧，然后是尾巴，然后是另一侧。“作出这一区分，”詹姆斯写道，“就没有任何进一步争论的余地了。”
