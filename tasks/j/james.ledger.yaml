      詹姆斯论“习惯”的章节位于书前部，以习惯作为物理问题开始，而以考虑其伦理意涵结束。詹姆斯论证，自然律本身就是习惯，“不过是不同基本种类物质在其相互作用与反作用中所遵循的不变习惯”（PP 109）。在我们的大脑中，习惯是神经能量的路径，正如河流溪水是水流的路径。在皮肤层面，甚至伤疤也是一种习惯，“比邻近部位更容易被擦伤、发炎、遭受疼痛与寒冷”（PP 111）。在心理层面也一样，“任何已被频繁重复的心理动作序列，都倾向于自我延续……”（PP 116）。习惯在减少我们必须投入行动的注意方面很有用，从而让我们得以发展“我们心灵的更高能力”（PP 126）。在社会层面，习惯是“社会的巨大飞轮，它最珍贵的保守剂。唯有它使我们所有人保持在法令的界限之内，并保护命运之骄子免受穷人嫉妒的起事”（PP 125）。在詹姆斯看来，“习惯律的伦理意涵”（PP 124）关乎我们选择发展哪些习惯，以及何时发展。许多习惯必须早年养成：“二十岁以后学会的语言，几乎没有不带外国口音被说出的”（PP 126）。我们应该努力使“神经系统成为我们的盟友而非敌人”，办法是尽可能多地、尽可能早地养成好习惯。即使在晚年，我们也应保持决断能力的状态，每隔一两天做一件“除了你宁可不做之外别无理由的事”（PP 130）。
