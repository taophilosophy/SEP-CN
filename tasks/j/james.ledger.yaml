      在理所当然著名的论“思想流”的章节中，詹姆斯认为自己提供了比休谟等传统经验论者更丰富的经验说明。他相信关系、模糊的边缘和倾向是被直接经验到的（这一观点他后来作为“彻底经验主义”的一部分加以辩护）。詹姆斯发现意识是一条流，而不是一系列“观念”。其水流相互交融，而我们个别的意识——或者，如他有时更愿意称呼的，我们的“意识性”（sciousness）——是“浸染、着色”在环绕它的意识性或思想的流水之中的。我们的心理生活有节奏：它是一系列过渡与停歇，一系列“飞翔与栖息”（PP 236）。当我们记起一直在寻找的名字时，我们歇息；当我们听到可能是婴儿从午睡中醒来的声响时，我们又出发。
