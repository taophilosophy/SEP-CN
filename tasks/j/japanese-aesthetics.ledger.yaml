      The opening shots of *Tokyo Story* (1953), which some consider Ozu’s greatest film, are also exemplary with respect to the cutting. The first shot shows a shrine sculpture to the left of center and behind it an estuary with a boat chugging along to the right, in the direction of a gradual rise of hills on the horizon. After ten seconds, just as the boat is about to disappear beyond the frame—there is a cut to the pavement on the side of a street. A cart now occupies the left foreground of the frame, and beside it stand two large bottles (Ozu’s signature shapes). Eight small children in school uniform walk away from the camera to the right. Continuity is provided by a parallel between the river and horizon of the first scene and the horizontal lines of the pavement and houses in the second, as well as by the movement toward the right. Continuity is also provided aurally by the continuing sound of the boat’s putt-putting. A ninth child appears and as he passes the bottles and reaches the center of the frame—there is a cut to a shot over the roofs of houses of a train traveling to the right, with behind it the buildings of a shrine or temple, and then hills behind those. The putting sound of the boat continues before being drowned out by the sound of the train, and the almost horizontal line of the train’s passage continue to be congruent with those of the street, descending gradually to the right. Smoke issues from two chimneys at left and center, the scene lasting fifteen seconds.
    step1: |-
      《东京物语》（1953）的开场镜头——有人认为是小津最伟大的影片——在切方面同样是典范。第一个镜头显示画面中偏左的一座神社雕塑，其后是河口，一艘船向右突突驶去，朝地平线缓缓升起的山丘方向。十秒后，正当船即将消失在画框之外——切到街边的路面。一辆车现在占据画面左前景，旁边立着两个大瓶子（小津的标志性形状）。八个穿校服的小孩背对摄影机向右走去。连续性由第一场景的河流与地平线与第二场景的路面与房屋的水平线之间的平行关系提供，也由向右的运动提供。连续性还由船持续不断的突突声在听觉上提供。第九个孩子出现，当他经过瓶子到达画面中央——切到越过房屋屋顶的镜头，一列火车向右行驶，其后是神社或寺庙的建筑，再后是山丘。船的突突声继续，随后被火车声淹没，火车几乎水平的行进线继续与街道的线一致，向右缓缓下降。左侧与中央的两个烟囱冒烟，场景持续十五秒。
    step2: |-
      《东京物语》（1953）的开场镜头——有人认为是小津最伟大的影片——在切方面同样是典范。第一个镜头显示画面中偏左的一座神社雕塑，其后是河口，一艘船向右突突驶去，朝地平线缓缓升起的山丘方向。十秒后，正当船即将消失在画框之外——切到街边的路面。一辆车现在占据画面左前景，旁边立着两个大瓶子（小津的标志性形状）。八个穿校服的小孩背对摄影机向右走去。连续性由第一场景的河流与地平线与第二场景的路面与房屋的水平线之间的平行关系提供，也由向右的运动提供。连续性还由船持续不断的突突声在听觉上提供。第九个孩子出现，当他经过瓶子到达画面中央——切到越过房屋屋顶的镜头，一列火车向右行驶，其后是神社或寺庙的建筑，再后是山丘。船的突突声继续，随后被火车声淹没，火车几乎水平的行进线继续与街道的线一致，向右缓缓下降。左侧与中央的两个烟囱冒烟，场景持续十五秒。
