      ## 3. *Wabi*: Simple, Austere Beauty
    step1: |-
      ## 3 Wabi：简素枯淡之美
    step2: |-
      ## 3 Wabi：简素枯淡之美
  - id: 18
    kind: body
    source: |-
      In the aforementioned *Essays in Idleness* Kenkō asks, “Are we to look at cherry blossoms only in full bloom, at the moon only when it is cloudless?” (Keene, 115). If for the Buddhists the basic condition is impermanence, to privilege as consummate only certain moments in the eternal flux may signify a refusal to accept that basic condition. Kenkō continues: “To long for the moon while looking on the rain, to lower the blinds and be unaware of the passing of the spring—these are even more deeply moving. Branches about to blossom or gardens strewn with faded flowers are worthier of our admiration.” This is an example of the idea of *wabi*, understated beauty, which was first distinguished and praised when expressed in poetry. But it is in the art of tea, and the context of Zen, that the notion of *wabi* is most fully developed.
    step1: |-
      在前述《徒然草》中，兼好问：“赏花，惟当盛放之时？观月，惟当无云之夜？”（Keene, 115）。如果对佛教徒而言根本境况是无常，那么只把永恒流变中的某些时刻特选为完满，可能意味着拒斥接受那一根本境况。兼好接着说：“观雨而思月，垂帘而不知春之逝——这更加动人心怀。枝头将绽之蕾、园中落花狼藉，更值得我们的欣赏。”这是侘之念的一个例子——内敛不露之美；它最初在诗歌中被分辨出来并受到赞美。但在茶艺与禅的语境中，侘这一观念得到最充分的发展。
    step2: |-
      前引《徒然草》，兼好问曰：“花惟当盛放而观乎？月惟当无云而观乎？”（Keene, 115）。使佛家以根本境况为无常，而独举恒流中某刻为至极，殆即拒其根本境况矣。兼好继曰：“观雨而慕月，垂帘而不觉春去——是尤动人。将绽之蕾，落英之庭，尤足观也。”此即侘之一例：敛而不露之美；其初见辨于诗而见称。然侘之念最展其义者，在茶艺与禅之境。
  - id: 19
    kind: body
    source: |-
      In the *Nampōroku* (1690), a record of sayings by the tea master Sen no Rikyū, we read: “In the small [tea] room, it is desirable for every utensil to be less than adequate. There are those who dislike a piece when it is even slightly damaged; such an attitude shows a complete lack of comprehension” (Hirota, 226). Implements with minor imperfections are often valued more highly, on the *wabi* aesthetic, than ones that are ostensibly perfect; and broken or cracked utensils, as long as they have been well repaired, more highly than the intact. The *wabi* aesthetic does not imply asceticism but rather moderation, as this passage from the *Nampōroku* demonstrates: “The meal for a gathering in a small room should be but a single soup and two or three dishes; sakè should also be served in moderation. Elaborate preparation of food for the *wabi* gathering is inappropriate” (Hirota, 227).
    step1: |-
      在《南方录》（1690）——对茶人千利休言行的记录——中我们读到：“在小〔茶〕室中，每件器物最好都略欠充分。有人因一件器物稍有残损便不喜欢它；这种态度表明全然不理解〔茶道〕”（Hirota, 226）。在侘美学之下，有小瑕疵的器物常常比表面上完美的更受珍视；只要修复得当，破损或有裂纹的器物比完好的更受推重。侘美学并非苦行主义，而是节制，正如《南方录》的这段话所表明的：“小室之会，其餐惟一汁二三菜足矣；酒亦当节饮。为侘之聚会而精心备膳，殊不相宜”（Hirota, 227）。
    step2: |-
      《南方录》（1690）记茶人千利休之言曰：“小〔茶〕室之中，器物贵乎略欠其足。或有微损即不悦者，此全不解〔茶道〕者也”（Hirota, 226）。依侘之美，微瑕之器，每愈于外观之完；修之善者，损裂之器愈于完好之器。侘之美非苦行，乃中节，《南方录》之言曰：“小室之会，馔惟一汁二三菜；酒亦当节。为侘之会而精治其馔，非宜也”（Hirota, 227）。
