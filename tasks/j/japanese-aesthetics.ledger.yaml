      Sesshū’s life and work are exemplary for Japanese aesthetics given that his practice was not aesthetic in a restricted sense, but also encompassed the religious and philosophical principles of Daoist-inspired Zen Buddhism. “Splashed ink landscape” was composed in Sesshū’s 76ᵗʰ year, a time when he claimed that his eyes “were growing misty” and Daoism was increasingly influential for his painting. As a painter-priest, both his meditative as well as his artistic practice would have aimed at self-negation, at achieving “non-self” as per the goal of Zen training. As Yukio Lippit writes, “Splashed Ink Landscape thus showcases a mode of ink painting that projects both cultivated artistic agency and a state of subjectlessness. This condition of the permeable subject would prove pitch-perfect for the Japanese monk painter of the late medieval period” (Lippit 2012, 71)[^lippit-2012]. To disclose how this aesthetic-religious goal was approached in painting practice reveals the Daoist roots of Zen Buddhism.
    step1: |-
      雪舟的生平与创作，对日本美学而言堪称范例：他的实践并非狭义上的审美实践，还包容了受道家启发的禅佛教的宗教与哲学原理。“泼墨山水”作于雪舟七十六岁那年，他当时自称眼睛“渐渐蒙雾”，而道家思想对他的画作影响日深。作为画僧，他的冥想修行与艺术实践都以自我否定为目标，都要达到禅修目标所说的“无我”。正如李普特（Yukio Lippit）所写：“《泼墨山水》由此展示了一种水墨画模式，它既投射出修养有素的艺术能动性，又投射出一种无主体的状态。这种可渗透主体的状态，对中世纪晚期的日本僧侣画家来说堪称恰到好处”（Lippit 2012, 71）[^lippit-2012]。揭示这一审美—宗教目标如何在绘画实践中被趋近，也就揭示出禅佛教的道家根源。
