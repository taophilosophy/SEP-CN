      Kuki distinguishes two further “moments” of *iki* in addition to its basis in seductiveness or coquetry (*bitai*): “brave composure” (*ikiji*) and “resignation” (*akirame*). Insofar as *iki* as seductiveness is concerned “to maintain a dualistic relationship, protecting the possibility as possibility”—an allusion to Heidegger’s existential conception of death as ultimate possibility—it already embraces impermanence and mortality. The first sense in which iki preserves the possibility as possibility, and thus maintains a dualistic relationship, is that the act of sexual union is not consummated (or at least postponed). This preservation of possibility is further enhanced by brave composure, which for Kuki is exemplified in the attitude toward death (his own and others’) on the part of the samurai warrior and his way of living (*bushidō*). It is enhanced too by the moment of resignation, which Kuki understands as the Buddhist attitude of non-attachment to a world of impermanence. All together they enable a kind of aesthetic “play”, thanks to a (phenomenological) “bracketing” of the concerns of everyday life (Nara, 18–23).
    step1: |-
      九鬼在“意气”以诱惑性或媚态（bitai）为基础之外，还区分出两个进一步的“契机”：“勇敢的从容”（ikiji）与“断念”（akirame）。就作为诱惑性的“意气”而言，“维持一种二元关系，把可能性作为可能性来保护”——这是对海德格尔把死亡视为终极可能性的存在论概念的暗示——它已经拥抱无常与有死性。意气把可能性作为可能性加以保存、从而维持二元关系的第一层意义在于：性结合的行为并未完成（或至少被推迟）。这种对可能性的保存又因勇敢的从容而增强；在九鬼看来，武士及其生活方式（bushidō）对死亡（自己与他人的死亡）的态度，正是其例。断念的契机也增强了这一点；九鬼把断念理解为佛教对无常世界的不执著态度。它们合在一起，凭借对日常生活关切的（现象学）“悬置”，促成一种审美“游戏”（Nara, 18–23）。
