      While Rikyū’s impact on the subsequent history of Japanese tea and culture at large is irrefutable, his legacy is complicated. His ritual suicide was appropriated for a subsequent aestheticization of hyper-nationalistic tendencies, thereby setting an early standard for an “aesthetic” death as sacrifice to one’s nation at time of war (Cross, 163–166). Thus, his tragic moment was promoted as a means to rationalize some of the empire’s most egregious brutalities. A memory that should have remained untarnished became attached to Japan’s calamitous aestheticization of imperialism, warfare, and self-sacrifice—values fundamentally at odds to those that Rikyū introduced to Japanese culture through the *wabi* aesthetic in the tea ceremony.
    step1: |-
      利休对后世日本茶道乃至整个文化的影响无可否认，但他的遗产是复杂的。他的切腹为后来的超民族主义倾向所挪用而加以审美化，由此早早确立了一种“审美化”死亡的标准——战时为国捐躯（Cross, 163–166）。于是，他的悲剧时刻被抬举出来，为帝国某些最骇人的暴行提供理据。一段本应保持清白的记忆，就此同日本对帝国主义、战争与自我牺牲的灾难性审美化绑在一起——而这些价值，与利休借茶道中的侘美学引入日本文化的价值，根本相悖。
    step2: |-
      利休之于后世日本之茶与文化全体，其影响无可置疑；然其遗业则颇为复杂。其切腹为后来超民族主义倾向所挪用而审美化，遂早立“审美化”死亡之格——战时以死殉国（Cross, 163–166）。于是其悲剧一刻，被抬举为帝国若干最酷烈暴行之理据。一段本应皭然无滓之记忆，遂与日本帝国主义、战争与自我牺牲之灾难性审美化相缠——此诸价值，与利休以茶道侘美学输入日本文化者，根本相悖。
