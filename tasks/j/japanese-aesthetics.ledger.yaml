      The term *sabi* occurs often in the *Manyōshū*, where it has a connotation of desolateness (*sabireru* means “to become desolate”), and later it seems to acquire the meaning of something that has aged well, grown rusty (another word pronounced *sabi* means “rust”), or has acquired a patina that makes it beautiful.
    step1: |-
      sabi 一语常见于《万叶集》，在那里带有荒凉之意（sabireru 意为“变得荒凉”）；后来它似乎获得如下含义：某物经年而变好、生锈（另一个读作 sabi 的词意为“锈”），或获得了使其美丽的包浆。
    step2: |-
