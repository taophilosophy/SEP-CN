  - id: 110
    kind: body
    source: |-
      For each cut Ozu has arranged for at least one formal element to provide continuity (*kire-tsuzuki*) between the adjacent scenes. Ozu’s inconspicuous switches remain among the most stylish cuts in world cinema, and his work continues to be a source of inspiration.
    step1: |-
      对每一次切，小津都安排了至少一个形式要素在相邻场景之间提供连续性（kire-tsuzuki）。小津不显眼的转换仍是世界电影中最有风格的切之一，他的作品继续是灵感的源泉。
    step2: |-
      对每一次切，小津都安排了至少一个形式要素在相邻场景之间提供连续性（kire-tsuzuki）。小津不显眼的转换仍是世界电影中最有风格的切之一，他的作品继续是灵感的源泉。
