      The second observation is that the arts in Japan have tended to be closely connected with Confucian practices of self-cultivation, as evidenced in the fact that they are often referred to as “ways [of living]”: *chadō*, the way of tea (tea ceremony), *shodō*, the way of writing (calligraphy), and so forth. And since the scholar official in China was expected to be skilled in the “Six Arts”—ceremonial ritual, music, calligraphy, mathematics, archery, and charioteering—culture and the arts tend to be more closely connected with intellect and the life of the mind than in the western traditions.
    step1: |-
      第二点观察是：日本的艺术往往与儒家修身实践紧密相连，其证据是它们常被称为“道（生活方式）”：茶道（chadō，即饮茶之道）、书道（shodō，即书写之道），等等。由于中国的士大夫被期望精通“六艺”——礼、乐、书、数、射、御——日本的文化与艺术往往比西方传统更紧密地与智识和心灵生活相连。
