      A distinctive notion in Japanese aesthetic discourse is that of the “cut” (*kire*) or “cut-continuity” (*kire-tsuzuki*). The “cut” is a basic trope in the Rinzai School of Zen Buddhism, especially as exemplified in the teachings of the Zen master Hakuin (1686–1769). For Hakuin the aim of “seeing into one’s own nature” can only be realized if one has “cut off the root of life”: “You must be prepared to let go your hold when hanging from a sheer precipice, to die and return again to life” (Hakuin, 133–35). The cut appears as a fundamental feature in the distinctively Japanese art of flower arrangement called *ikebana*. The term means literally “making flowers live”—a strange name, on first impression at least, for an art that begins by initiating their death. There is an exquisite essay by Nishitani Keiji on this marvelous art, in which organic life is cut off precisely in order to let the true nature of the flower to come to the fore (Nishitani, 23–7). There is something curiously deceptive, from the Buddhist viewpoint of the impermanence of all things, about plants, which, lacking locomotion and by sinking roots into the earth, assume an appearance of being especially “at home” wherever they are. In severing the flowers from their roots, Nishitani suggests, and placing them in an alcove (itself cut off from direct light, as Tanizaki remarks), one is letting them show themselves as they truly are, namely, as absolutely rootless as every other being in this world of radical impermanence.
    step1: |-
      日本美学话语中一个独特的观念是“切”（kire）或“切续”（kire-tsuzuki）。“切”是临济宗禅佛教的基本修辞，尤其在禅宗大师白隐（1686–1769）的教法中得到体现。对白隐而言，“见性”的目标只有“切断生命之根”才能实现：“你必须准备好，在悬崖峭壁上松手，死去再活过来。”（Hakuin, 133–35）切也作为根本特征出现在日本特有的花道艺术（ikebana）中。该词字面意为“使花活起来”——至少初看之下，这对一门以促花死亡开始的艺术是个奇怪的名字。西谷启治有一篇论这门奇妙艺术的精妙文章；其中，有机生命恰恰被切断，以便让花的真正本性凸显出来（Nishitani, 23–7）。从万物无常的佛教观点看，植物有某种奇特的欺骗性：它们没有移动能力，把根扎入大地，因而显得无论身在何处都特别“自在”。西谷提示，把花从根上切下，置于壁龛（按谷崎所说，壁龛本身也切断了直射光），就是让它们如其所是地显现，即如同这个彻底无常世界中的其他一切存在一样，绝对无根。
