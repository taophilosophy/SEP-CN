      The ostentation of the *Shoin* style found further reinforcement in what was called the “*basara*” attitude (婆娑羅), characterized by tasting contests (*tōcha* 闘茶) and lavish tea parties (*chayoriai* 茶寄合) orchestrated for grandiose demonstrations of wealth. As the *Shoin* style was in ascendency, the tea world was simultaneously evolving in the opposite direction, in a version of the ceremony known as the *Sōan* (草庵) style, an aesthetic that extolled austerity and poverty rather than opulence and affluence. In place of grand halls of the aristocracy and gatherings with dozens or even hundreds of guests, the so called “grass-hut” *Sōan* style aestheticized the world of the farmer and hermit and sought the intimacy of a gathering in a tiny unadorned hut, typically attended by a mere handful of guests. Shukō and Jōō were some of the progenitors of this style and it was tea as the “grass hut” ideal that Rikyū inherited and eventually honed to perfection.
    step1: |-
      书院风格的炫耀，在所谓“婆娑罗”（basara）态度中得到进一步强化；这种态度以斗茶（tōcha）与奢华的茶会（chayoriai）为特征，旨在盛大展示财富。正当书院风格盛行之际，茶道世界同时朝相反方向发展，形成一种称为草庵（Sōan）风格的仪式；这种美学推崇朴素与贫寒，而非奢华与富裕。草庵风格以所谓“草庵”取代贵族的大厅与数十乃至数百宾客的聚会，把农夫与隐士的世界审美化，追求在狭小无饰的草庵中聚会的亲密感，通常只有寥寥数位宾客。珠光与绍鸥是这种风格的先驱之一，而利休继承的正是作为“草庵”理想的茶道，并最终将其磨砺至完美。
