      > The sound of the Gion *shōja* bells echoes the impermanence of all things; the color of the *sōla* flowers reveals the truth that the prosperous must decline. The proud do not endure, they are like a dream on a spring night; the mighty fall at last, they are as dust before the wind. (McCullough 1988)[^mccullough-1988]
    step1: |-
      > 祇园精舍钟声，有诸行无常之响；娑罗双树花色，显盛者必衰之理。骄奢者不久留，恰如春夜之梦；雄强者终泯灭，正若风前之尘。（McCullough 1988）[^mccullough-1988]
    step2: |-
