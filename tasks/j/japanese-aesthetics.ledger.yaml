      Sesshū does not seek to render every detail of the landscape to achieve representational verisimilitude, to depict an object that would be discernible for a subject. The aim is to give only a suggestion or a trace of trees, mountains, or waters, which appear to negate themselves as objects. Accordingly, Sesshū does not circumscribe forms but offers the impression of poetic immediacy by breaking them down. Extreme abbreviation and abstraction are employed such that any form, if even discernible, is pushed as far as possible from objectivity without disappearing completely into formlessness. As Jullien writes regarding Chinese painters who influenced Sesshū, they paint the “landscape in the tonality of *as if*, in the mode of appearing-disappearing, at once ‘as if there were’ and ‘as if there were not.’”(Jullien, 2009. 8)[^jullien-2009] The central grouping of trees, the inn blending into their trunks, and the tiny oarsman all appear but feel as though they are about to be lost, maybe already transitioning into a vague memory, only a brushstroke away from dissolving completely. A sensitive viewer does not simply perceive a representation of this event but can sense the sweeping and spontaneous gestures that gave rise to the ephemerality of the scene. To appreciate this aesthetic feature of the painting invokes Buddhist principles Sesshū would have cultivated as a Zen monk.
    step1: |-
      雪舟并不追求渲染山水的每个细节以取得再现的逼真，也不追求描绘一个对主体而言可辨认的客体。其目标只是给出树木、山峦或水流的暗示或痕迹，而这些似乎否定自身作为客体。因此，雪舟不勾勒形态，而是通过分解形态来提供诗意直接性的印象。极端的简省与抽象得到运用，以致任何形态即便可辨，也被尽可能推离客体性，却又不完全消失为无形。正如 Jullien 在论及影响雪舟的中国画家时所写，他们以“仿佛”的调性、以显现-消失的方式画“山水”，既“仿佛有”，又“仿佛没有”。（Jullien, 2009, 8）[^jullien-2009] 中央的树丛、融入树干的旅舍，以及小小的桨手，都出现了，却仿佛即将消失，也许已转入一段模糊的记忆，只差一笔便会彻底消融。敏感的观者不仅感知到对这一事件的再现，还能感受到赋予场景瞬逝性的挥洒而自发的笔势。欣赏画作这一美学特征，会唤起雪舟作为禅僧所培养的佛教原理。
    step2: |-
