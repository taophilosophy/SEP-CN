      What distinguished Rikyū’s *Wabicha* from his mentors’ ceremonies was its resolution of the tensions between competing aesthetic undercurrents coursing through the 16th-century practice of tea and broader Japanese cultural worlds (Slusser 55–57). Before the advent of *Wabicha*, medieval tea was becoming increasingly polarized in two directions. The *Shoin* (書院) style orchestrated ostentatious displays of wealth carried out in opulent domiciles of the powerful aristocracy. Within this milieu, the most cherished tea utensils (*meibutsu* 名物) were rare and precious wares imported from China, their aesthetic value predominantly gauged by how well they displayed the host’s affluence and power, rendering *Shoin* tea an intentionally non-egalitarian ceremony.
    step1: |-
      利休的侘茶区别于其导师茶会之处，在于它化解了 16 世纪茶道实践与更广阔的日本文化世界中相互竞争的美学暗流之间的张力（Slusser 55–57）。在侘茶出现之前，中世茶道日益朝两个方向极化。书院（Shoin）风格在权贵富丽的宅邸中铺陈财富的炫耀。在此环境中，最受珍视的茶具（名物，meibutsu）是从中国输入的稀有珍贵器物，其美学价值主要取决于它们能多好地展示主人的富裕与权力，遂使书院茶成为一种有意非平等的仪式。
    step2: |-
