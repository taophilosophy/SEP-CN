      What distinguished Rikyū’s *Wabicha* from his mentors’ ceremonies was its resolution of the tensions between competing aesthetic undercurrents coursing through the 16th-century practice of tea and broader Japanese cultural worlds (Slusser 55–57). Before the advent of *Wabicha*, medieval tea was becoming increasingly polarized in two directions. The *Shoin* (書院) style orchestrated ostentatious displays of wealth carried out in opulent domiciles of the powerful aristocracy. Within this milieu, the most cherished tea utensils (*meibutsu* 名物) were rare and precious wares imported from China, their aesthetic value predominantly gauged by how well they displayed the host’s affluence and power, rendering *Shoin* tea an intentionally non-egalitarian ceremony.
    step1: |-
      利休的侘茶之所以有别于其师们的茶会，在于它化解了贯穿十六世纪茶道实践与更广日本文化世界之间相互竞争的审美暗流的张力（Slusser 55–57）。在侘茶兴起之前，中世的茶日益向两个方向极化。*书院*风格在权势贵族的华丽宅邸中排演财富的炫示。在这一氛围中，最受珍视的茶道具（名物）是从中国进口的珍稀器物，其审美价值主要以它们能在多大程度上彰显主人的富足与权势来衡量，这使得书院茶成为一种有意非平等主义的仪式。
    step2: |-
      利休侘茶之所以异于其师之茶会，在其解十六世纪茶事与广日本文化界诸竞流间之张（Slusser 55–57）。侘茶未起之先，中世之茶日趋两极。*书院*之风，于权门华堂排演富厚之炫。此风中见重之茶道具（名物），多中国输入之珍器，其审美之值，率以彰主人富势之程度为准，故书院茶为有意不平等之仪。
  - id: 35
    kind: body
    source: |-
      The ostentation of the *Shoin* style found further reinforcement in what was called the “*basara*” attitude (婆娑羅), characterized by tasting contests (*tōcha* 闘茶) and lavish tea parties (*chayoriai* 茶寄合) orchestrated for grandiose demonstrations of wealth. As the *Shoin* style was in ascendency, the tea world was simultaneously evolving in the opposite direction, in a version of the ceremony known as the *Sōan* (草庵) style, an aesthetic that extolled austerity and poverty rather than opulence and affluence. In place of grand halls of the aristocracy and gatherings with dozens or even hundreds of guests, the so called “grass-hut” *Sōan* style aestheticized the world of the farmer and hermit and sought the intimacy of a gathering in a tiny unadorned hut, typically attended by a mere handful of guests. Shukō and Jōō were some of the progenitors of this style and it was tea as the “grass hut” ideal that Rikyū inherited and eventually honed to perfection.
    step1: |-
      书院风格的炫示又得到所谓“婆娑罗”风气的强化，其特征是品茶竞赛（闘茶）与奢华茶会（茶寄合），皆为夸富的大场面而设。正当书院风格上升之际，茶的世界同时朝相反方向演化，出现一种称为“草庵”风格的茶会：一种颂扬枯淡与贫素、而非富丽丰足的美学。取代贵族的宏大厅堂与数十乃至数百宾客的集会，所谓“草屋”的草庵风格把农夫与隐者的世界审美化，追求在一间小小的素朴小屋中集会的亲密，来客通常不过寥寥数人。珠光与绍鸥是这一风格的先驱者之一，而利休继承并最终磨至圆满的，正是这种“草屋”理想的茶。
    step2: |-
      书院之炫，复得“婆娑罗”之风所助：品茶之赛（闘茶）与豪奢茶会（茶寄合），皆为夸富之大观而设。书院方盛，茶界同时反向而化，是为*草庵*之式：颂枯淡贫素而非富厚丰盈之美学。舍贵族之广堂与数十数百宾之会，“草屋”之草庵乃审美化农人与隐者之界，求小素屋中数人集会之亲。珠光、绍鸥为此式之开先者；而利休所承、终磨至纯者，即此“草屋”理想之茶也。
