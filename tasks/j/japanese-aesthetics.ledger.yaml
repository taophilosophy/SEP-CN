      The mysterious grace of his most celebrated landscape painting derives as much from the space that is left un-touched, the invisible and absent (often referred to as the “dragon’s veins” of a painting) as from what is painted and visible. The work appears incomplete, still in the act of formation, and the dramatic negative spaces created by the mists allow the various forms to dissolve and blend into one another, but more decisively, according to the yūgen dynamic, this negativity invites the viewer into the painting to actively complete it. As artists employing yūgen principles in other genres have shown, the incompleteness and allusiveness of the artwork summons the viewer into the scene. In Ghilardi’s words, “the onlooker must merge in the image, completing the empty spaces, making it a lively element of nature itself, ‘between’ visible and invisible” (Ghilardi, 2015, 99)[^ghilardi-2015].
    step1: |-
      他最著名山水画的神秘优雅，既来自被留白、不可见与缺席的空间（常被称为画作的“龙脉”），也来自被画出、可见的部分。作品显得未完成，仍处于形成过程之中；雾霭造成的戏剧性负空间使各种形态消散并彼此融合；但更具决定性地，按照幽玄的动态，这种否定性邀请观者进入画中，主动将其完成。正如在其他体裁中运用幽玄原则的艺术家所表明的，作品的不完整与暗示性把观者召入场景。用 Ghilardi 的话说，“观看者必须融入图像，补全空无的空间，使其成为自然本身的一个活泼要素，处于可见与不可见‘之间’”（Ghilardi, 2015, 99）[^ghilardi-2015]。
