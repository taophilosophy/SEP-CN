      A second polarizing cultural tendency in 16ᵗʰ century Japan, which cut across the *Shoin* and *Sōan* divide, was a tension between warrior and religious aesthetic sensitivities. Rikyū’s *Wabicha* dissolved this tension by melding elements of Samurai gatherings with those cultivated in Zen monasteries. His ceremony avoided exclusive alignment with religiosity or militarism and employed the *wabi* aesthetic to infuse an egalitarianism counterbalancing hierarchical divisions entrenched within both spheres, re-casting *wabi* as a “non-hierarchical awareness of the real” (Hirota 95).
    step1: |-
      十六世纪日本的第二种极化的文化倾向——横跨书院与草庵之分——是武士的与宗教的审美感受之间的张力。利休的侘茶通过熔铸武家集会与禅寺所修习的要素而化解了这一张力。他的茶会避免专一地附属于宗教性或军事性，而以侘美学注入一种平等主义，以抗衡两个领域中根深蒂固的等级划分，把侘重铸为一种“对真实的非等级觉知”（Hirota 95）。
    step2: |-
      十六世纪日本第二种极化之文化倾向，横跨书院草庵之判，则武士之与宗教之审美感受间之张也。利休侘茶熔武家之会与禅寺所修而一之，以解其张。其茶会不专附于宗教或武备，而以侘之美注一平等之义，以抗两界深固之等级，重铸侘为“于真实之非等级觉知”（Hirota 95）。
