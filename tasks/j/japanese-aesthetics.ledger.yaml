      “切续”这一观念，体现在能剧演员高度程式化的步态中。演员脚尖抬起，贴地滑行，然后急速把脚尖落地，“切”断这一动作——就在那一刻，另一只脚又开始贴地滑行。对人类自然行走的这一程式化，把注意力引向生命的片段性；这种片段性也反映在每次呼气与下一次吸气之间的停顿中。在禅修中留意呼吸，人就会察觉：呼气与吸气之间的停顿，与吸气与呼气之间的停顿不同——更像一刀切断。这映现出生命随时可能被切断：那一次呼气之后没有吸气，即所谓“断气”。
