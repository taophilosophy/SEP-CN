      An additional dimension of the *Wabicha* aesthetic, which reinforces egalitarian ideals is Rikyū’s embrace of the local. He opposed the trend of importing expensive Chinese tea ware and instead championed locally crafted articles reflecting the agrarian lifestyle outside the bustling urban city centre. Amidst Rikyū’s manifold innovations, the most famous—renowned for epitomizing the very quintessence of *wabi*—was the inception of an entirely novel pottery style known as *Raku* (楽焼, *raku-yaki*). Rikyū enlisted a local potter Sasaki “Raku” Chōjirō (長次郎) to give form to tea ware embodying the *wabi* aesthetic. As opposed to highly sophisticated Chinese porcelain, *Raku* was rustic earthenware, utilitarian, un-adorned, often asymmetrical and imperfect in form and finish – celebrating the grace of a humble existence, an ode to local hermit and farmer. Firing and drying techniques were developed to grant leeway to the atmosphere, nature, and gravity to express themselves in the clay body as it heated then cooled. The aesthetic evoked the monk or farmer in the vicinity working with what was at hand rather than the worldly aristocrat importing treasures from foreign shores. Aligned with the ethos of *wabi*, *Raku* ware was valued for its exposition of the simple beauty of meagre existence, accentuating the aesthetics of paucity over opulence. Thus, *Raku* played a levelling role that made a previously exclusive material culture surrounding the tea ceremony more egalitarian.
    step1: |-
      侘茶美学的另一个维度强化了平等主义理想，那就是利休对本土的拥抱。他反对输入昂贵中国茶具的潮流，转而倡导反映繁华都市中心之外农耕生活的本土制作器物。在利休的众多创新中，最著名的——因体现侘的精髓而闻名——是一种全新陶艺风格乐烧（Raku，楽焼）的创立。利休延请当地陶工长次郎（Sasaki “Raku” Chōjirō）为体现侘美学的茶具赋予形式。与高度精致的中国瓷器相对，乐烧是质朴的陶器，实用、无饰，形状与完成往往不对称、不完美——它颂扬谦卑存在的优雅，是一首献给当地隐士与农夫的颂歌。烧制与干燥技术得到发展，以便让大气、自然与重力在陶土加热继而冷却的过程中自行表达。这种美学唤起的，是附近使用手边材料劳作的僧人或农夫，而非从海外输入珍宝的世俗贵族。与侘的精神相一致，乐烧器物因其展现贫寒存在的简单之美而受珍视，强调匮乏而非奢华的美学。因此，乐烧发挥了拉平等级的作用，使此前围绕茶道的排他性物质文化更具平等主义。
