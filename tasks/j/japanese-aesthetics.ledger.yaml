      Rikyū’s aesthetic decisions were guided by a veneration of the meagre existence of the agrarian lifestyle, the strict economy of the mountain hermit, and the austere lack of adornment of the poor farmer. He thus had a predilection for rough un-hewn materials, which meant walls and timber within the tea hut were left raw and unfinished, with straw and cob visibly protruding. Costly Chinese porcelain, ivory flower vases and tea scoops were replaced by locally produced bamboo versions. Colorful flowers were almost entirely excluded, while an “aniconic” ceremony emerged, characterized by the absence of imagery within the hut and surrounding garden.
    step1: |-
      利休的美学决定，受一种对农耕生活贫寒存在的尊崇所引导：对山中隐士严格节用的尊崇，对贫苦农夫质朴无饰的尊崇。因此他偏爱粗糙未加砍削的材料，这意味着茶庵的墙壁与木料保持原始未完成状态，稻草与泥巴清晰可见。昂贵的中国瓷器、象牙花瓶与茶勺，被当地生产的竹制品取代。色彩鲜艳的花几乎完全被排除，一种“无偶像的”仪式随之出现，其特征是茶庵内与周围庭园中没有图像。
