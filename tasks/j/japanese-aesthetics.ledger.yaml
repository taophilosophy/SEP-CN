      Another important innovation that curtailed signs of wealth involved transformations in design and emphasis of the hanging scroll (*Kakemono* 掛物). Once a peripheral piece, Rikyū elevates the scroll, recalibrates its aesthetics toward egalitarian ideals, and installs it as the centrepiece of the tea hut and the ceremony as a whole (Hirota, 217–218). Rikyū not only elevated the scroll to the aesthetic forefront of the ceremony, (a role previously occupied by the tea caddy in the *Shoin* style) but also shifted scroll aesthetics away from costly and exclusive Chinese versions. Under Rikyū’s patronage, scrolls were for the first time commissioned from local Zen Buddhist calligraphers and painters.
