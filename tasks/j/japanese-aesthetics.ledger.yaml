      （日语中“山水”一词，*sansui*，字面意思是“山与水”：见 Berthier 2000。）[^berthier-2000] 在龙安寺，石庭被一道漂亮的墙从外部切开，墙却低得足以让人看见周围的自然。这一“切”在某种意义上被沿墙顶延伸、似乎把墙切断的斜屋顶加了一倍，而它在动与静的对照中最为明显。墙的上方与远方是运动中的自然：枝条摇曳，云朵飘过，偶有飞鸟掠过。但除非落雨下雪，或有落叶被吹过，庭内能见的运动都只是影子或幻象——日月把树枝的缓慢影子投在静止的砂上。
