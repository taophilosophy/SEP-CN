      In the Japanese Buddhist tradition, awareness of the fundamental condition of existence is no cause for nihilistic despair, but rather a call to vital activity in the present moment and to gratitude for another moment’s being granted to us.
    step1: |-
      在日本佛教传统中，对存在之根本境况的觉知并非虚无主义式绝望的原因，而是对当下一刻积极活动的召唤，是对又一刻生命被赐予我们的感恩。
    step2: |-
      日本佛教之传统，于存在根本境况之觉知，不以为虚无绝望之因，而以为当下活动之召，与夫又一刻得赐之恩。
  - id: 6
    kind: body
    source: |-
      The second observation is that the arts in Japan have tended to be closely connected with Confucian practices of self-cultivation, as evidenced in the fact that they are often referred to as “ways [of living]”: *chadō*, the way of tea (tea ceremony), *shodō*, the way of writing (calligraphy), and so forth. And since the scholar official in China was expected to be skilled in the “Six Arts”—ceremonial ritual, music, calligraphy, mathematics, archery, and charioteering—culture and the arts tend to be more closely connected with intellect and the life of the mind than in the western traditions.
    step1: |-
      第二个观察是：日本的艺术往往与儒家式的自我修习紧密相连，其明证是：它们常被称为诸“道[之生活]”：*chadō*，茶之道（茶道），*shodō*，书之道（书法），等等。而且，既然中国的士人被要求精通“六艺”——礼仪、音乐、书法、数学、射箭与驾车——文化与艺术就倾向于比西方传统更紧密地与智性及心灵生活相连。
    step2: |-
      其二，日本之艺每与儒者自修之功密接，其证即诸艺多称“道[之生活]”：*chadō*，茶之道（茶道），*shodō*，书之道（书道），是已。且中国之士必精“六艺”——礼仪、乐、书、数、射、御——故文化与艺之系于智性心灵之生活，较西方之统尤为密。
