      The garden at Ryōanji makes a brief but significant appearance in one of the classics of Japanese cinema, Ozu Yasujirō’s *Late Spring* (1949). It comes right after one of the film’s most famous images: a vase standing on a tatami mat in front of a window on which silhouettes of bamboo are projected. The scene in question consists of eight shots, seven of which show the Ryōanji rocks (of which there are fifteen in total), and which are separated and joined by seven cuts. (Ozu hardly ever uses any other transition than the cut, such as the wipe.) After two shots of rocks in the garden, the camera angle reverses, and we see the main protagonist with his friend—they are both fathers of daughters—sitting on the wooden platform with the tops of two rocks occupying the lower part of the frame. Two rocks and two fathers. Cut to a close-up of the fathers from their left side, with no rocks in view. In their dark suits, seated in the classic Ozu “overlapping triangles” configuration, and leaning forward toward the garden with their arms around knees drawn up toward their chins, they resemble two rocks. They talk about how they raise children who then go off to live their own lives. As they invoke such manifestations of impermanence, they remain motionless except for the occasional nod or turn of the head.
    step1: |-

    step2: |-

