      In the “free art” of design, parallel lines, and especially vertical stripes, are expressive of *iki*: almost all the other beautiful patterns developed by Japanese fabric arts, since they often involve curved lines, are un-*iki*. The only colors that embody *iki* are certain grays, browns, and blues. In architecture the small (four-and-a-half mat) Zen teahouse is a paradigm of *iki*, especially insofar as it initiates an interplay between wood and bamboo. Lighting must be subdued: indirect daylight or else the kind of illumination provided by a paper lantern. The scales, melodies, and rhythms of various kinds of music are correspondingly *iki*, insofar as (alluding to Goethe, Schelling, and Schopenhauer) “[a]rchitecture is frozen music, and music is flowing architecture” (Nara, 41–51).
    step1: |-
      在设计这门“自由艺术”中，平行线、尤其是竖条纹，是 *iki* 的表现：日本织物艺术发展出的几乎所有其他美丽纹样都不具 *iki*，因为它们往往含曲线。能体现 *iki* 的颜色，只有某些灰、褐与蓝。在建筑中，那座四叠半的小禅茶室是 *iki* 的典范，尤其是就它开启木与竹的相互作用而言。照明必须幽暗：要么是间接的日光，要么是纸灯笼提供的那种光。各类音乐的调式、旋律与节奏也相应地是 *iki*，因为（这里暗指歌德、谢林与叔本华）“建筑是凝固的音乐，音乐是流动的建筑”（Nara, 41–51）。
    step2: |-
      在设计这门“自由艺术”中，平行线、尤其是竖条纹，最能表现 *iki*：日本织物艺术发展出的其他美丽纹样几乎都不具 *iki*，因为它们往往带曲线。能体现 *iki* 的颜色，只有某些灰、褐与蓝。建筑上，四叠半的小禅茶室是 *iki* 的典范，尤其因为它开启了木与竹的交互。照明必须幽暗：要么是间接日光，要么是纸灯笼那种光。各类音乐的调式、旋律与节奏也相应地是 *iki*，因为（这里暗指歌德、谢林与叔本华）“建筑是凝固的音乐，音乐是流动的建筑”（Nara, 41–51）。
