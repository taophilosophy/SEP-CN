      ## 4. Rikyū’s Tea and the Equalizing Aesthetic of *Wabi*
    step1: |-
      ## 4 千利休之茶与侘的齐一美学
    step2: |-
      ## 4 千利休之茶与侘的齐一美学
  - id: 32
    kind: body
    source: |-
      Few figures in Japanese history emerge as more formidable artists than Sen no Rikyū (千利休, 1522–1591), and few aesthetic movements are more transformative than his rendition of the tea ceremony, *Wabicha* (侘茶). While Rikyū is recognized as the preeminent Japanese tea master, his role as an aesthete extends much farther. A consummate painter and poet, a practitioner of *ikebana*, an accomplished calligrapher and landscape artist, Rikyū in time became an influential government dignitary advising the Shogunate on cultural and artistic matters. Through countless inventions and innovations, the impact of the aesthetic world he created, and some say perfected, stretches far beyond the boundaries of the tea ceremony itself, unearthing novel prospects for Japanese identity and citizenship, pioneering new social virtues, original visions of human existence and religious salvation, and ultimately, opening new possibilities for equality (Suzuki 278–9), all rooted in the *wabi* aesthetic.
    step1: |-
      日本史上少有人物能以更可畏的艺术家身份出现，胜过千利休（1522–1591）；也少有美学运动比他对茶道的改造——*侘茶*——更具转变性。虽然利休被公认为最杰出的日本茶人，他作为审美家的角色远不止于此。作为完满的画家与诗人、插花的践行者、有造诣的书家与造园家，利休后来成为有影响的政府显贵，就文化与艺术事务向幕府进言。通过数不清的发明与创新，他创造——有人说完善——的审美世界的影响，远远超出茶道本身的边界：为日本的认同与公民身份发掘新的前景，开创新的社会德性、人类存在与宗教救赎的新图景，并最终开启平等的新可能（Suzuki 278–279），而这一切都植根于侘美学。
    step2: |-
      日本史上鲜有以艺术家之姿出而令人畏服如千利休（1522–1591）者；亦鲜有美学运动之转移人心如其所改茶道之*侘茶*者。利休虽以日本第一茶人之名著，其为审美家所及，远不止此。利休兼为画家、诗人、插花之践行者、书家与造园名家，后为政府显要，以文化艺事佐幕府。以无量之发明新创，其所创——或云所完——审美之界，其影响远出茶道之外：为日本之认同与国民之义开新途，辟社会之新德、人生与宗教救赎之新图，而终开平等之新可能（Suzuki 278–279）；凡此皆根于侘之美。
