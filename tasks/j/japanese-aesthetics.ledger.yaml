      Beyond the realm of the martial and the monastic, the populace of 16th-century Japan was deeply stratified, from Samurai at the top all the way down to farmers, peasants, and merchants at the bottommost social rung. These divisions were absolute, and upward mobility to higher social strata was virtually inconceivable. Nevertheless, Rikyū deployed the *wabi* aesthetic to challenge social stratification (Sen Sōshitsu 182–183). In his *Wabicha*, all patrons of tea were considered equal, and his aesthetic innovations concretized this principle, ensuring this was not simply a lofty ideal. In the text attributed to him, the *Nampōroku* (1690), he claims that “worldly rank is ignored” in the tea room.
    step1: |-
      在军事与寺院的领域之外，16 世纪日本的民众深深分层，从顶端的武士一直到最底层的农民、佃农与商人。这些区分是绝对的，向上流动到更高社会阶层几乎不可想象。然而，利休运用侘的美学挑战社会分层（Sen Sōshitsu 182–183）。在他的侘茶中，所有茶会参与者都被视为平等，他的美学创新把这一原则具体化，确保它不只是一项高远理想。在归于他名下的《南方录》（1690）中，他声称在茶室中“世俗等级被置诸不顾”。
