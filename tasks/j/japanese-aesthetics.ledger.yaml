      While Rikyū’s reputation has come to eclipse that of his predecessors, his aesthetic innovations were part of a lineage born in the port city of Sakai, comprising the tea master Murata Shukō (村田珠光, 1423–1502) and his student Takeno Jōō (武野 紹鴎, 1502–1555), both Zen adherents, the latter of whom would later mentor Rikyū. Both of his forerunners began pioneering tea aesthetics, which laid the groundwork for Rikyū’s eventual refinement, and both harnessed fresh aesthetic stratagems aimed at incorporating the *wabi* aesthetic into the tea ceremony (Ludwig, 387–390. Sen Sōshitsu, 123–157).
    step1: |-
      利休的声誉逐渐盖过其前辈，但他的美学创新属于一个诞生于港口城市堺的谱系：其中包括茶道大师村田珠光（1423–1502）及其弟子武野绍鸥（1502–1555），二人都是禅宗信徒，后者后来成为利休的导师。两位先驱都开始开创茶道美学，为利休日后的精炼奠定基础；二人也都运用新的美学策略，旨在把侘的美学融入茶道（Ludwig, 387–390；Sen Sōshitsu, 123–157）。
