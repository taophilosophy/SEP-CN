      武人与寺域之外，十六世纪日本之民，等级至严：上自武士，下逮农佃商贾，判然不易，跻上流者几不可想。虽然，利休以侘之美抗世之等级（Sen Sōshitsu 182–183）。其侘茶中，凡茶客皆视以为等；其美之新创，使此义具体而著，非徒高远之理想而已。托名其名之《南方录》（1690）云：茶室之中，“世俗之等，置而不问”。
