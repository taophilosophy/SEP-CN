      (The Japanese word for landscape, *sansui*, means literally “mountains waters”: see Berthier 2000.)[^berthier-2000] At Ryōanji the rock garden is cut off from the outside by a splendid wall that is nevertheless low enough to permit a view of the natural surroundings. This cut, which is in a way doubled by the angled roof that runs along the top of the wall and seems to cut it off, is most evident in the contrast between movement and stillness. Above and beyond the wall there is nature in movement: branches wave and sway, clouds float by, and the occasional bird flies past. But unless rain or snow is falling, or a stray leaf is blown across, the only movement visible within the garden is shadowed or illusory, as the sun or moon casts slow-moving shadows of tree branches on the motionless gravel.
