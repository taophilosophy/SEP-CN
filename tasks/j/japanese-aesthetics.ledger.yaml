      While his interventions may have succeeded in challenging the rigid societal stratification beyond the confines of the tea world, they might have also set the stage for his own tragic downfall. The markers of social hierarchy he sought to dismantle were crucial for justifying and maintaining the Shogunate’s power. As a governmental official, Rikyū had little latitude to deny Hideyoshi’s wishes, which often diverged drastically from the austerities of *Wabicha* (for instance, building the golden Tai-an (待庵) tearoom). His egalitarianism was undermining a vital symbol the Shogun relied on to showcase his supremacy, and threatened to subvert power structures that maintained his position atop the social-political hierarchy (Slusser, 56-57). Rikyū’s *Wabicha* and the hierarchy-nullifying symbols and structures he shaped countered the power politics embraced by the Shogunate and challenged the militaristic interests of the elite he served. Rikyū would be ordered to commit ritual suicide (*seppuku* 切腹), and following his last tea ceremony in 1591, he wrote his death poem before taking his own life.
    step1: |-
      尽管他的干预或许成功挑战了茶道世界之外的僵硬社会分层，却也可能为他自己的悲剧性垮台埋下伏笔。他试图拆解的社会等级标记，对于证成与维持幕府的权力至关重要。作为政府官员，利休几乎没有余地拒绝秀吉的意愿，而秀吉的意愿常常与侘茶的严峻大相径庭（例如建造黄金茶室待庵）。他的平等主义在削弱幕府将军赖以展示至高地位的重要象征，并威胁颠覆维持其处于社会政治等级顶端的权力结构（Slusser, 56–57）。利休的侘茶以及他所塑造的取消等级的标志与结构，对抗幕府所拥抱的权力政治，并挑战他所效忠的精英的军国主义利益。利休最终被命令切腹（seppuku），在 1591 年举行最后一次茶会后，他写下辞世诗，然后自尽。
