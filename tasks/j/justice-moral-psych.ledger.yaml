      This second result is grossly out of line with what the random flipping of a coin would have predicted. At least some of the participants in the second group must have flipped in a way that went in favor of the *other* person, but still assigned themselves the positive task. Self-interest seemed to have crept into their decision making process in a significant way. Yet, and perhaps most surprisingly, those who flipped rated what they had done much more morally right (7.30 on a 1–9 scale) than those who did not flip (4.00) (Batson et al. 1997: 1341)[^batson-1997].
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
