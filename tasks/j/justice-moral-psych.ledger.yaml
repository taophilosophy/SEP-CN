      What is the best explanation for the contribution made by the mirror? Batson appeals to research on the psychology of self-awareness, in which objects like mirrors can,
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      > heighten awareness of discrepancies between behavior and salient personal standards, creating pressure to act in accord with standards. (Batson et al. 1999: 529; for more on the psychology of self-awareness, see Wicklund 1975)[^batson-1999][^wicklund-1975]
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      In this case, the mirror served to highlight to the person the difference between what he believed was morally correct in this situation, and the opposing temptation to act out of self-interest. This heightened awareness seemed to either create extra motivation to comply with the fairness norm or lessen motivation to do the self-interested thing (or perhaps both). Thus the mirror can be said to increase the salience of the self’s own personal standards of evaluation (Another hypothesis, though, is that it increases the salience of standards of social evaluation, i.e., how others might judge him. Batson tested this possibility and did not find support for it (2002: 331–334)).
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      Self-awareness also provides a clue about where to find a plausible explanation for how moral hypocrisy is possible. That clue has to do with a particular form of self-deception (Batson et al. 1997: 1336, 1346, 1999: 526–527.)[^batson-1997]. Rather than thinking that participants simply revised their fairness standards to make their behavior look acceptable in their own eyes, perhaps instead they were engaging (often unconsciously) in an act of self-deception whereby they avoided comparing their behavior to the relevant moral standards. If the two are kept apart from each other, that mitigates the perceived costs of not acting fairly while doing nothing to mitigate the perceived benefits of acting self-interestedly. But with increased self-awareness, the discrepancy between the fairness norm and the self-interested option was made especially salient so that it became psychologically difficult for many participants to employ this particular form of self-deception (Batson et al. 1999: 527, 529, 531–532, 2002: 331; Batson and Thompson 2001: 55)[^batson-1999][^batson-2001].
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      The other variable which Batson found to increase motivation associated with the fairness norms had to do with perspective taking. Take the usual setup, but with the caveat that the default starting point is for the participant to be awarded two raffle tickets for every correct response, while the other participant gets zero tickets. Then the task assignment becomes whether the participant is willing to change the assignment so that it is symmetrical with both people receiving one ticket each. For controls, 38% changed the task consequences to symmetrical. However, for the experimental group, 83% did (Batson et al. 2003: 1199)[^batson-2003]. The difference? This group was instructed to adopt the perspective of the other person—“we would like for you to imagine yourself in the place of the other participant” (Batson et al. 2003: 1198, emphasis deleted)[^batson-2003]. This is different from imagining what the other person is feeling or experiencing—the instructions here are very much in line with the Biblical mandate to, “Do unto others as you would have them do unto you” (Matthew 7:12).
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      There is one additional implication from Batson’s work which I want to highlight here. Consider again those participants who are about to flip the coin. At that point before they see what the outcome is, what is the nature of their motivation? Perhaps for the moment at least some of them want to do the morally right thing (follow the dictate of the coin, however it ends up landing) for its own sake. If the coin lands in their favor, then the outcome also aligns with their self-interest, which is so much the better. But if it lands in the other person’s favor, then they might see what being fair would cost them, and their self-interested motives end up outweighing their initial moral motivation. Or perhaps this is all fanciful—perhaps when they are flipping the coin, all they want is what they think is ultimately in their self-interest, which at the moment is just flipping the coin so as to benefit from appearing to be moral.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      One way to test these hypotheses, Batson reasoned, is to see if participants cared about whether the flipping of the coin and so the task assignment was done by themselves or by the experimenter. If the egoistic hypothesis is correct, then they should want to flip the coin themselves so that they can rig the outcome. If the other hypothesis involving an ultimate desire to be moral is correct, however, it should not matter who flips. When the experiment was actually run with this choice option, 80% of those who used a coin wanted the experimenter to flip it. This initial evidence thus favors postulating a motive to follow the fairness norm (and perhaps moral norms more generally) for its own sake (Batson and Thompson 2001: 55–56)[^batson-2001].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Suppose this hypothesis about motivation is correct. How strong and psychologically powerful of a force does it typically seem to be in cases involving fairness? The evidence suggests, at least given the current state of research, that for many of us it is only weak in strength. We can already see this from the studies cited above when so many participants do not actually follow their moral principle about what is a fair task assignment. In addition, Batson varied the previous setup so that the assignment was between a positive and a *negative* task, where the latter involved receiving “mild but uncomfortable” electric shocks for each incorrect response. With this change, only 25% of participants offered to let the experimenter flip the coin, and another 25% flipped themselves, with 91% choosing the positive task. The remaining 50% of participants simply bypassed the pretense of the coin flip and gave themselves the positive task while readily admitting that this was not morally right (Batson and Thompson 2001: 56.)[^batson-2001]. The implication is that moral motivation caused by our fairness norms seems to be weak and highly susceptible to being outweighed in cases of this type where the person’s self-interest is at stake.
    step1: TBD
    step2: TBD
