      Given these results, a diverse array of more sophisticated motivational accounts has been offered in the recent literature (For additional results and discussion, see also Roth 1995; Kagel et al. 1996; Pillutla and Murnighan 2003; Camerer 2003; Murnighan and Wang 2016; Barber and English 2019; Park et al. 2021; Ye et al. 2022)[^barber-2019][^camerer-2003][^kagel-1996][^murnighan-2016][^park-2021][^pillutla-2003][^roth-1995]. One thing they have in common is that they are egoistic accounts, appealing in some way to what would advance a person’s self-interest. In the case of offerers, here are some of the motivational proposals that have been made:
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      1. Larger offers are made due to fear of rejection of smaller offers (Pillutla and Murnighan 1995: 1410–1411)[^pillutla-1995].
      2. Larger offers are made so long as one can enjoy appearing to be fair; otherwise smaller offers are made (Pillutla and Murnighan 1995: 1424; Camerer and Thaler 1995: 212)[^camerer-1995][^pillutla-1995].
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      In the case of responders, here is an example of an egoistic proposal:
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      Small offers are rejected because of wounded pride. Although responders may appeal to considerations of fairness, this only serves as post-hoc confabulation (Straub and Murnighan 1995: 360–361; Pillutla and Murnighan 2003: 253–254)[^pillutla-2003][^straub-1995].
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
