      ## 4. Possible Implications of Batson’s Research for the Empirical Reality of the Virtue of Justice
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Having reviewed this extensive research project by Batson, one natural direction some philosophers might go in next is to examine what it suggests about people’s moral character. This is especially true for philosophers engaged in recent discussions of situationism and the empirical reality of virtue and vice (Harman 1999, 2000; Doris 1998, 2002; Snow 2010; Miller 2014)[^doris-1998][^harman-1999][^miller-2014][^snow-2010].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Given the focus of this essay, we will only look at the virtue of fairness. It seems clear that Batson’s results do not inspire much confidence in this virtue being widely held. For instance, something like the following seems plausible:
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
