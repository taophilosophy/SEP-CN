      Willibald Ruch and his colleagues (2017) had participants play a number of economic games, including dictator, ultimatum, public goods, and prisoner’s dilemmas. To assess personality, they used the HEXACO-60 questionnaire, but also the 240-item Values in Action Inventory of Strengths, which aims to capture 24 character strengths with respect to which people can differ. The researchers found a significant improvement in predicting performance on the games using the VIA classification, even beyond what was learned from the HEXACO.
    step1: |-
      Willibald Ruch 及其同事（2017）让参与者玩若干经济博弈，包括独裁者、最后通牒、公共物品与囚徒困境。为评估人格，他们使用了 HEXACO-60 问卷，还使用了 240 题的“优势价值行动问卷”（VIA），后者旨在刻画人们可能有所不同的 24 种品格优势。研究者发现，使用 VIA 分类显著改善了对博弈表现的预测，甚至超出从 HEXACO 中学到的东西。
    step2: |-
      Willibald Ruch 及其同事（2017）让参与者玩了好几种经济博弈：独裁者、最后通牒、公共物品以及囚徒困境。人格评估用的是 HEXACO-60 问卷，外加 240 题的“优势价值行动问卷”（VIA）——它旨在刻画 24 种因人而异的品格优势。研究者发现，用 VIA 分类来预测博弈表现，效果显著提升，甚至超出了 HEXACO 所提供的信息。
