      More specifically, we will examine the distributive motives and behavior of individuals by consulting the empirical literature on economic games. Other topics, including the relationship between empirical results and specific theories of distributive justice such as John Rawls’s or Robert Nozick’s, will have to be addressed on another occasion (Lamont and Favor 2014)[^lamont-2014].
    step1: |-
