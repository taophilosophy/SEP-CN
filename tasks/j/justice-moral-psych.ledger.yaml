      *A Few Additional Personality Findings.* In addition to the Big Five, HEXACO, and justice sensitivity, other aspects of personality have been studied in relation to economic games. For instance, Gewnhi Park and colleagues (2021) measured both trait gratitude and momentary state gratitude for their participants, and found that only the former predicted willingness to accept unfair offers in the ultimatum game, both when the offers were only moderately unfair (like $3 out of $10 for the participant) or grossly unfair (like $1 out of $10 for the participant).
    step1: |-
      *其他几项人格发现*。除大五、HEXACO 与正义敏感性之外，人格的其他方面也与经济博弈的关系得到研究。例如，Gewnhi Park 及其同事（2021）同时测量了参与者的特质感恩与瞬时状态感恩，发现只有前者能预测最后通牒博弈中接受不公平出价的意愿——无论出价只是中等不公平（如参与者只得 10 美元中的 3 美元）还是严重不公平（如参与者只得 10 美元中的 1 美元）。
    step2: |-
      **其他几项人格发现**。除大五、HEXACO 与正义敏感性之外，人格的别的方面也有人拿经济博弈来研究。例如，Gewnhi Park 及其同事（2021）同时测量了参与者的特质感恩与一时性的状态感恩，结果只有前者能预测最后通牒博弈中接受不公出价的意愿——不管出价是中等不公（比如 10 美元里参与者只得 3 美元），还是严重不公（比如 10 美元里只得 1 美元）。
