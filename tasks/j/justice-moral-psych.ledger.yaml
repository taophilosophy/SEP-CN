      Our focus will be on empirical results, rather than armchair considerations of what the psychology of people might be like or what it should be like. The SEP entry on the virtue of justice discusses the moral psychology of a just person (LeBar 2020)[^lebar-2020]. But whether people actually are motivated by justice or have the virtue of justice is an empirical question.
    step1: |-
      我们的焦点将放在经验结果上，而不是扶手椅式的思辨——即人们心理可能是什么样的、应当是什么样的。SEP 关于正义之德的词条讨论了正义之人的道德心理学（LeBar 2020）[^lebar-2020]。但人们是否真的受正义驱动、是否拥有正义之德，这是一个经验问题。
    step2: |-
      我们聚焦经验结果，而不是凭空思量人们的心理可能怎样、应当怎样。SEP 关于正义之德的词条讨论了正义之人的道德心理学（LeBar 2020）[^lebar-2020]。但人们事实上是否受正义驱动、是否具有正义之德，则是一个经验问题。
