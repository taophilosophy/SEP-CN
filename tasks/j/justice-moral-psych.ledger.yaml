      Three of these—observer, beneficiary, and perpetrator sensitivity—are other-focused aspects of justice sensitivity, whereas victim sensitivity is self-focused on one’s being treated fairly (Stavrova and Schlösser 2015: 3; Schlösser et al. 2018: 76–77)[^schlösser-2018][^stavrova-2015]. This makes a difference statistically. For instance, victim sensitivity tends to correlate with anti-social personality traits—such as Machiavellianism—in a way that the first three do not.
    step1: |-
      其中三个——旁观者、受益者与施害者敏感性——是正义敏感性中以他人为焦点的方面，而受害者敏感性则以自我为焦点，关注自己是否受到公平对待（Stavrova and Schlösser 2015: 3; Schlösser et al. 2018: 76–77）[^schlösser-2018][^stavrova-2015]。这在统计上有差别。例如，受害者敏感性往往与反社会人格特质——如马基雅维利主义——相关，而前三个则不然。
    step2: |-
      其中三个——旁观者、受益者、施害者敏感性——是正义敏感性中指向他人的方面；受害者敏感性则指向自己，关注自己是否受到公平对待（Stavrova and Schlösser 2015: 3; Schlösser et al. 2018: 76–77）[^schlösser-2018][^stavrova-2015]。这在统计上会造成差别。例如，受害者敏感性往往与反社会人格特质——比如马基雅维利主义——相关，而前三者则不然。
