    kind: body
    source: |-
      This might be too strong a characterization of an unfair person in an ordinary sense, but again we are focusing on the viciously unfair person. Yet it turned out that the participants seemed to be experiencing motivation to do the right thing. Furthermore, if they were motivationally conflicted but gave in to self-interested motivation, they would be weak of will or incontinent on the Aristotelian picture, rather than vicious.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      So one could argue Batson’s results do not sit comfortably either with the widespread possession of the virtue of fairness or the vice of unfairness. Instead they suggest that we have beliefs and desires like these:
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      - Beliefs about what is fair and what is not fair, and the importance of being fair.
      - Beliefs about the relationship between not complying with certain fairness norms and various personal benefits such as increased time, money, alternative activities, and so forth.
      - Desires in favor of being fair when doing so will contribute towards complying with the relevant fairness norms, provided the benefits of doing so are not (significantly) outweighed by the costs.
      - Desires in favor of not being fair when the benefits of complying with the relevant fairness norms are (significantly) outweighed by the costs, while also desiring to as much as possible still appear to be fair both to others and to oneself.
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      While certainly not an exhaustive list, these mental states do seem like a mixed bag, morally speaking. Some of them are quite morally admirable, such as those in the first set, and by themselves could give rise to positive moral behavior. Others, of course, are not morally admirable, and they can help to explain the unfair behavior we see in Batson’s studies (For the development of a Mixed Trait approach to character along these lines, see Miller 2013, 2014, 2015)[^miller-2013].
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      ## 5. Personality Traits, Economic Games, and Justice
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Here is a general observation about the results we have seen in this essay. For each of the studies, there was rarely uniformity in behavior by all the participants in a particular situation. Indeed, in some cases there were striking differences. For instance, we saw that in the Forsythe study of dictator games, 21% gave nothing and 21% gave the equal amount of $10, leaving 58% somewhere in-between (Forsythe et al. 1994: 362)[^forsythe-1994]. We also saw that many people would pay $9 to take an exit option in Dana’s dictator studies, but many people also would not (Dana et al. 2006)[^dana-2006]. Or in Batson’s studies, many participants would assign themselves to the positive consequence task, but rarely would everyone do this.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      So there appear to be important individual differences in behavior among participants in these game environments. Since the situation a given group of participants is confronting is the same, it is only natural to think that the ensuing differences in behavior might be explained, at least in part, by differences in their underlying personality traits. If this turns out to be the case, then if we learn something about their personality, we could more accurately predict how they would subsequently behave in these games, as well as in other relevant situations. In other words, individual differences in the moral psychology of a person’s justice relevant traits, can translate into individual differences in justice relevant behavior. And knowing something about the former can help us predict the latter.
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      It turns out that there is in fact some evidence linking certain personality traits with behavior in these games. Here I briefly mention four such instances where evidence has been found. Spending a moment on each of them is also worthwhile because of what we can learn more generally about the moral psychology of justice beyond what economic games tell us (for a massive meta-analysis of 60 years of research on the relationship between personality traits and behavior in six economic games, including the dictator and ultimatum games, see Thielmann et al. 2020)[^thielmann-2020].
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      *The Big Five*. The Big Five personality traits (or Five-Factor model) have come to dominate the field of personality, with thousands of relevant papers appearing in the past few decades (for an overview, see John et al. 2008)[^john-2008]. Results from these studies have repeatedly pointed in the direction of five basic dimensions of personality with the following most commonly used labels:
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      - Extraversion (also labeled Surgency, Energy, Enthusiasm)
      - Agreeableness (also labeled Altruism, Affection)
      - Conscientiousness (also labeled Constraint, Control of Impulse)
      - Neuroticism (also labeled Emotional Instability, Negative Emotionality, Nervousness)
      - Openness (also labeled Intellect, Culture, Originality, Open-Mindedness)
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      The idea, then, is that in a typical group there will be people who differ in their ratings on each of these five dimensions. Some, for instance, might be high on extraversion, which can be interpreted as involving an energetic approach towards social interaction manifested in, for instance, the behavior of attending more parties and introducing themselves to strangers (John et al. 2008: 120)[^john-2008]. Others might be quite introverted instead.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Advocates of this approach typically have hierarchical models of personality traits in mind, where the Big Five are subdivided into different “facets” that are less broad and so are claimed to have increased accuracy (for details, see Paunonen 1998)[^paunonen-1998]. To cite one example, here are the 30 facets from Robert McCrae and Paul Costa’s version of the Five-Factor Model (Costa and McCrae 1995: 28)[^costa-1995]:
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      - Neuroticism: Anxiety, Angry Hostility, Depression, Self-Consciousness, Impulsiveness, Vulnerability
      - Extraversion: Warmth, Gregariousness, Assertiveness, Activity, Excitement Seeking, Positive Emotions
      - Openness to Experience: Fantasy, Aesthetics, Feelings, Actions, Ideas, Values
      - Agreeableness: Trust, Straightforwardness, Altruism, Compliance, Modesty, Tender-Mindedness
      - Conscientiousness: Competence, Order, Dutifulness, Achievement Striving, Self-Discipline, Deliberation
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      In their 240 item survey instrument, the NEO-PI-R, 8 items are designed to measure each of these facets. For instance, “I keep my belongings neat and clean” and “I like to keep everything in its place so I know just where it is” are two items for the consciousness facet of order (Costa and McCrae 1992: 73)[^costa-1992].
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      It is noteworthy that there is nothing on the list of Big Five traits or their facets that seems directly related to justice. But in recent years connections have been established between performance on economic games and the Big Five (for a review, see Zhao and Smillie 2015)[^zhao-2015]. The most pronounced finding among the Big Five traits is that higher agreeableness is correlated with higher allocations to the recipient in a dictator game. In one meta-analysis, the sample weighted average correlation was $r_{wa} = .18$. A negative correlation of $r_{wa} = -.10$ was also found for rejecting fewer offers in ultimatum games (Zhao and Smillie 2015: 288)[^zhao-2015]. Conscientiousness has also been linked to lower allocations in dictator games (Ben-Ner et al. 2004)[^ben-ner-2004]. Studies on the other Big Five traits have been more inconsistent in their results, and are also few and far between (see also Ben-Ner and Kramer 2011)[^ben-ner-2011].
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      *The HEXACO*. Michael Ashton and Kibeom Lee have proposed a six-factor model of personality (Ashton & Lee 2001, 2005 and Lee & Ashton 2004)[^ashton-2001][^lee-2004]. Five of the factors carry over with minor modifications from the Big Five taxonomy. The key addition is a sixth factor which they call honesty-humility, and which they describe this way:
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      > Persons with very high scores on the Honesty-Humility scale avoid manipulating others for personal gain, feel little temptation to break rules, are uninterested in lavish wealth and luxuries, and feel no special entitlement to elevated social status. Conversely, persons with very low scores on this scale will flatter others to get what they want, are inclined to break rules for personal profit, are motivated by material gain, and feel a strong sense of self-importance. (Lee & Ashton 2015, Other Internet Resources).
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Honesty-humility in turn has four facets: sincerity, fairness, greed avoidance, and modesty. Most relevant for our purposes is naturally the fairness facet. As part of the 100-item HEXACO-PI-R inventory, the following are the items which are labeled under fairness:
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      **12.**
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      If I knew that I could never get caught, I would be willing to steal a million dollars.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      **36.**
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      I would be tempted to buy stolen property if I were financially tight.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      **60.**
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      I would never accept a bribe, even if it were very large.
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      **84.**
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      I’d be tempted to use counterfeit money, if I were sure I could get away with it.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Now one might wonder about whether these are really best understood as *fairness* items. They might seem to relate at the conceptual level more to honesty than to justice. But let’s leave that terminological point to one side.
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      For it turns out that significant statistical relationships have been found with behavior in bargaining games (for a review, see Zhao and Smillie 2015)[^zhao-2015]. In the same meta-analysis, for instance, the sample weighted average correlation was $r_{wa} = .24$ between dictator allocation amount and honesty-humility (291). Another meta-analysis reported a correlation of $r_{wa} = .29$ (Hilbig et al. 2015: 92)[^hilbig-2015]. So too was there a negative correlation between HEXACO agreeableness and rejecting offers in ultimatum games ($r_{wa}= -.16$) (Zhao and Smillie 2015: 288)[^zhao-2015]. Furthermore, one study found that of those who were high in honesty-humility, 64.4% chose the 50/50 allocation in the dictator game, while only 34.6% did who were low on this dimension (Hilbig et al. 2015: 92)[^hilbig-2015].
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Benjamin Hilbig and Ingo Zettler (2009) provide a nice experimental demonstration of this relationship. Participants completed the HEXACO-PI and played a dictator game and an ultimatum game with an initial allocation of 100 points for each game. As expected, those who were higher in honesty-humility gave fewer points to themselves in both games (518). More interesting was the consistency in allocations *between* the two games. Those lowest in honesty-humility allocated an almost equal amount of points to themselves and the other person in the ultimatum game. But in the dictator game, where there was no threat of rejection by the other person, the average allocation for participants to keep was almost 80 points. By way of contrast, those highest in honesty-humility showed no significant difference in their allocations in the two games. In other words, they were consistently fair, whereas the other group of participants was only being fair when it was to their advantage (518–519).
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      Kun Zhao and his colleagues (2016) used Big Five and HEXACO personality measures for participants playing a variety of dictator games, and found as expected that Big Five agreeableness and honesty-humility both predicted higher monetary payoffs for the participant’s partner. Interestingly, it was the politeness facet of Big Five agreeableness that predicted the allocations, and not the compassion facet. Also interesting were the results from the generosity games that Zhao had participants play as well. Here participants knew that their own payoff was going to be $5 no matter what, and they only got to choose how much their partner would receive (ranging from $0 to $10). It turned out that HEXACO agreeableness and not honesty-humility that predicted generous allocations.
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      *Justice Sensitivity*. A relatively new and particularly exciting development in personality psychology has been the study of what is being called “justice sensitivity”. The basic idea is that individuals differ in general on this trait, which can be understood at its heart as a motive for justice (Stavrova and Schlösser 2015: 3)[^stavrova-2015]. After several refinements, consensus seems to be emerging around four facets for this trait (Schmitt et al. 2010; Stavrova and Schlösser 2015)[^schmitt-2010][^stavrova-2015]:
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      JS_{Victim}: Sensitivity to becoming a victim of injustice.
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      JS_{Observer}: Sensitivity to witnessing injustice.
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      JS_{Beneficiary}: Sensitivity to passively benefiting from injustice.
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      JS_{Perpetrator}: Sensitivity to actively committing injustice.
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      (Stavrova and Schlösser 2015: 3)[^stavrova-2015]
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      Three of these—observer, beneficiary, and perpetrator sensitivity—are other-focused aspects of justice sensitivity, whereas victim sensitivity is self-focused on one’s being treated fairly (Stavrova and Schlösser 2015: 3; Schlösser et al. 2018: 76–77)[^schlösser-2018][^stavrova-2015]. This makes a difference statistically. For instance, victim sensitivity tends to correlate with anti-social personality traits—such as Machiavellianism—in a way that the first three do not.
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      But all four of these facets are indeed statistically related to each other, and at the same time are distinguishable pieces of a stable trait of justice sensitivity. While they do correlate with other personality traits such as the Big Five, the correlations are typically on the low side, which can be taken as evidence that justice sensitivity itself is a distinct trait (for a review, see Schmitt et al. 2010)[^schmitt-2010].
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      A well validated measure of justice sensitivity has been developed by Manfred Schmitt and his colleagues, with 10 items for each of the four facets (Schmitt et al. 2010)[^schmitt-2010]. For instance, here are the items for beneficiary sensitivity:
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      - It disturbs me when I receive what others ought to have.
      - I have a bad conscience when I receive a reward that someone else has earned.
      - I cannot easily bear it to unilaterally profit from others.
      - It takes me a long time to forget when others have to fix my carelessness.
      - It disturbs me when I receive more opportunities than others to develop my skills.
      - I feel guilty when I am better off than others for no reason.
      - It bothers me when things come easily to me that others have to work hard for.
      - I ruminate for a long time about being treated nicer than others for no reason.
      - It bothers me when someone tolerates things with me that other people are being criticized for.
      - I feel guilty when I receive better treatment than others.
      - (Schmitt et al. 2010: 234)[^schmitt-2010]
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      Participants complete these items using a scale which ranges from 0 (not at all) to 5 (exactly).
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      Using this measure of justice sensitivity, some interesting work is being done. For instance, Gollwitzer and his colleagues (2005) examined the willingness of West Germans to contribute to East Germany to help improve living conditions, as there is a large disparity even years after the wall came down. Some particular proposals included an automatic deduction from the salaries of West Germans that would be used for job creation in East Germany, and the implementation of affirmative action hiring policies which would favor East over West Germans for new positions. It turned out that beneficiary sensitivity, for instance, was found to predict solidarity with East Germans, whereas victim sensitivity did not (Gollwitzer et al. 2005: 191)[^gollwitzer-2005].
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      In another study, Thomas Schlösser and his colleagues (2018) examined whether justice sensitivity predicts wealth distribution. They used a version of the welfare state game in which participants were assigned to be an upper, middle, or lower class subject in a hypothetical society which they got to help shape. Specifically they chose between a society with lower inequality (person A received €5, B received €4, and C received €3) versus higher overall wealth but greater inequality (A received €10, B received €6, and C received €1). As expected, participants who were high on JS_{Victim} (sensitivity to becoming a victim of injustice) were more likely to go with greater inequality if they were A or B, but greater equality if they were C. Participants who were high on the other three dimensions of justice sensitivity were more likely to choose less inequality regardless of whether they were A, B, or C (Schlösser et al. 2018: 79)[^schlösser-2018].
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Turning to cheating behavior, Alexander Götmann and his colleagues (2021) found that those higher in victim sensitivity cheated at a higher rate on a laboratory task, whereas when it came to perpetrator sensitivity those high on this dimension were less likely to cheat. The task involved solving matrices, seeing what your overall score was, and then having to manually type the score into a computer.
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      Most relevant for our purposes, participants who are high on victim sensitivity are less likely to allocate 50/50 in dictator games, whereas the opposite is true for the other facets of justice sensitivity. Hence Detlef Fetchenhauer and Xu Huang (2004) found that observer sensitivity correlated .21 with an equal allocation, and perpetrator sensitivity correlated .30. On the other hand, victim sensitivity was negatively correlated at −.18 (Fetchenhauer and Huang 2004: 1024)[^fetchenhauer-2004].
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      Further research in this area of the moral psychology of justice looks to be especially promising in the years to come (for additional noteworthy studies, see Dalbert and Umlauft 2009; Lotz et al 2013; Edele et al. 2013)[^dalbert-2009][^edele-2013][^lotz-2013].
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      *A Few Additional Personality Findings.* In addition to the Big Five, HEXACO, and justice sensitivity, other aspects of personality have been studied in relation to economic games. For instance, Gewnhi Park and colleagues (2021) measured both trait gratitude and momentary state gratitude for their participants, and found that only the former predicted willingness to accept unfair offers in the ultimatum game, both when the offers were only moderately unfair (like $3 out of $10 for the participant) or grossly unfair (like $1 out of $10 for the participant).
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      Willibald Ruch and his colleagues (2017) had participants play a number of economic games, including dictator, ultimatum, public goods, and prisoner’s dilemmas. To assess personality, they used the HEXACO-60 questionnaire, but also the 240-item Values in Action Inventory of Strengths, which aims to capture 24 character strengths with respect to which people can differ. The researchers found a significant improvement in predicting performance on the games using the VIA classification, even beyond what was learned from the HEXACO.
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      ## 6. Conclusion
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      At this point, it is tempting to speculate about what some of the broader implications might be of these empirical findings. For instance, what can they tell us about how to design a just society? If we should assume that most of us suffer from moral hypocrisy to enough of an extent that we are not fair people, does that support more active monitoring by the state to detect unfair behavior? How might we practically implement the findings about mirrors (should they be strategically placed around the public square to encourage fair behavior?) and empathy (should there be regular public reminders to imagine what others are going through who are less fortunate?)? And what other lessons can we extrapolate from this research to help us improve society? This is not the place to explore these questions, but they are a natural next step.
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      Of course, allocation decisions in real life tend to be much more complicated than simple dictator or ultimatum games. But as we have seen, these games and their many different variations can shed important light on the moral psychology of justice. Clearly no simple story about our motives to be just or fair is going to be plausible. We are more complex creatures than that.
    step1: TBD
    step2: TBD
