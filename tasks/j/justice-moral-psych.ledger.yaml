      Here is the setup Batson typically used. Participants were told that they were part of a task assignment study. Individually, they were given the choice of whether to assign a positive consequences task or a neutral consequences task to either themselves or another participant, who (they were told) would simply assume the assignment was made by chance. The positive consequences task was such that for each correct response, the participant would receive one ticket for a raffle with a prize of $30 at the store of his or her choice. In the neutral consequences task, there would be no consequences for correct or incorrect responses but, “most participants assigned to the neutral consequences task find it rather dull and boring” (Batson et al. 1997: 1339)[^batson-1997]. After making the assignment privately and anonymously, participants were asked about what was the morally right way to assign the task consequences, and to rate on a 9-point scale whether they thought the way they had actually made the task assignment was morally right.
    step1: |-
      以下是 Batson 通常采用的设定。参与者被告知，他们参与一项任务分配研究。他们各自单独选择：把一项“正面后果”任务或一项“中性后果”任务分配给自己或另一名参与者——他们被告知，对方会以为这项分配纯属随机。正面后果任务是这样的：每答对一题，参与者就获得一张抽奖券，奖品是在他或她自选的商店价值 30 美元的奖品。在中性后果任务中，答对答错都没有后果，但“被分配到中性后果任务的大多数参与者都觉得它相当枯燥无聊”（Batson et al. 1997: 1339）[^batson-1997]。在私下匿名做出分配之后，参与者被问及：分配任务后果在道德上正确的做法是什么？并在 9 点量表上评价自己实际做出分配的方式在道德上是否正确。
    step2: |-
      Batson 通常用的设定如下。参与者被告知自己参加的是“任务分配研究”。他们各自单独作选择：把一项正面后果任务或一项中性后果任务分给自己，还是分给另一名参与者——对方会以为分配纯属随机（他们这样被告知）。正面后果任务是：每答对一题，参与者就得到一张抽奖券，凭券可在自选商店兑换价值 30 美元的奖品。中性后果任务则答对答错都无后果，不过“分到中性后果任务的大多数参与者都觉得这活儿相当枯燥”（Batson et al. 1997: 1339）[^batson-1997]。分配在私密、匿名的情况下完成后，参与者被问到：分配任务后果在道德上的正确做法是什么？并用 9 点量表评价自己实际做出的分配在道德上是否正确。
