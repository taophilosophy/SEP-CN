      ## 2. Dictator Games and Fairness
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      It turns out that this trend is not specific to ultimatum games—research on dictator games went through the same evolution. We said that ultimatum games are relatively simple two person games with an offerer and a responder. In the standard dictator setup, things are even simpler. Call the two people involved the “dictator” and the “recipient”, Using our $10 example, the dictator is told that she can give any amount between $0 and $10, inclusive, to another person. And whatever the dictator decides, that is the end of the story. So if the dictator wants to keep $8 and give $2 to the recipient, then that is what each person walks away with.
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Beginning with the traditional game-theoretic framework, the prediction for what participants serving as dictators would do is straightforward—keep all the money (Forsythe et al. 1994: 348; Dana et al. 2006: 193)[^dana-2006][^forsythe-1994]. Since there is no threat of rejection by the recipient, and since all that matters is promoting one’s self-interest, there is every reason to keep all of the money. Or so one might think.
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      But once again, that is not what most participants actually did. In the same Forsythe study, while 21% gave nothing to the recipient, the remaining 79% gave something, with 21% giving an equal amount of the $10 (Forsythe et al. 1994: 362)[^forsythe-1994]. Kahneman also ran a version of a dictator game where students in a psychology course could divide $20 with an anonymous fellow student, or keep $18 for themselves and give $2 to the other student. Strikingly, 76% choose the even division (Kahneman et al. 1986: S291)[^kahneman-1986]. In addition, 74% of participants were subsequently willing to pay $1 to punish an unfair dictator and in the process reward a fair one, even though this would reduce their own monetary payment in the process (1986: S291). Van Dijk and Vermunt (2000) found that information asymmetries were not as prevalent as in ultimatum games. Specifically, there wasn’t a significant effect observed based on whether dictators knew that recipients were aware of the total amount dictators had to allocate. As they conclude,
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      > whereas the dictator game evokes a true concern for fairness, allocators in the ultimatum game only appear to behave fairly…. (2000: 19; for a review of results in dictator games, see Camerer 2003; Murnighan and Wang 2016)[^camerer-2003][^murnighan-2016]
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Overall, according to one review of the literature, giving in dictator games amounted to roughly 15–20% of what a participant received in the first place (Camerer 2003: 57–58)[^camerer-2003]. Another 2011 meta-analysis found an average of 28.35% allocated (Engel 2011)[^engel-2011], and a recent 2022 meta-analysis found an average of 29.65% (Umer et al. 2022)[^umer-2022].
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      All these are less than fair, but more than completely self-interested.
    step1: TBD
    step2: TBD
  - id: 34
