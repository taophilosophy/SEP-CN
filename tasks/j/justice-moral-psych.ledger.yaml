  - id: 7
    kind: body
    source: |-
      > Economic games have become widely adopted within the psychological sciences, where they are used to model complex social interactions and allow for rigorous empirical investigations. As behavioral paradigms, they are well-controlled, manipulable, and replicable…making them ideal for bridging the gap between theory and naturalistic data. In personality research, they provide behavioral paradigms that may complement and help validate self-report measures, and offer sharp operationalizations of somewhat slippery concepts. (2015: 277–278, see also Fetchenhauer and Huang 2004: 1018)[^fetchenhauer-2004]
    step1: |-
      > 经济博弈已在心理科学中得到广泛采用：它们被用来建模复杂的社会互动，并支持严格的经验研究。作为行为范式，它们控制良好、可操纵、可重复……这使它们成为弥合理论与自然情境数据之间鸿沟的理想工具。在人格研究中，它们提供了可以补充并帮助验证自我报告测量的行为范式，并为一些相当难以把握的概念提供锐利的操作化。（2015: 277–278，另见 Fetchenhauer and Huang 2004: 1018）[^fetchenhauer-2004]
    step2: |-
      > 经济博弈如今在心理科学中被广泛采用：研究者用它刻画复杂的社会互动，并开展严格的经验研究。作为行为范式，它们控制良好、可操纵、可重复……正是沟通理论与自然情境数据的理想桥梁。在人格研究中，这些行为范式可以补充并帮助验证自我报告测量，还能为一些难以把握的概念提供锐利的操作化。（2015: 277–278，另见 Fetchenhauer and Huang 2004: 1018）[^fetchenhauer-2004]
  - id: 8
    kind: body
    source: |-
      There are two general kinds of economic games. *Social dilemmas* typically juxtapose short-term self-interest with long-term group interests, and include the prisoner’s dilemma and the public goods game. *Bargaining games* typically involve two players distributing a specific payoff (usually money), and will be our focus here, as they are especially helpful for examining the moral psychology of justice. Examples include the ultimatum game and dictator game. We will also look at a novel twist on the dictator game by the psychologist Daniel Batson, which has fostered a large experimental literature on what he calls “moral hypocrisy”. Finally we will connect this discussion of economic games to the virtue of justice and to other personality traits such as agreeableness, honesty-humility, and justice sensitivity.
    step1: |-
      经济博弈大体有两类。**社会困境**（*social dilemmas*）通常把短期自利与长期群体利益并置，包括囚徒困境与公共物品博弈。**讨价还价博弈**（*bargaining games*）通常由两名玩家分配一笔特定收益（通常是钱），这正是本文的焦点，因为它们特别有助于考察正义的道德心理学。例子包括最后通牒博弈与独裁者博弈。我们还会考察心理学家 C. Daniel Batson 对独裁者博弈的一个新颖变式，它催生了围绕他所称“道德伪善”的大量实验文献。最后，我们会把这一关于经济博弈的讨论与正义之德以及宜人性、诚实-谦逊、正义敏感性等人格特质联系起来。
    step2: |-
      经济博弈大体有两类。**社会困境**（*social dilemmas*）把短期自利与长期群体利益摆在对立位置，典型例子是囚徒困境和公共物品博弈。**讨价还价博弈**（*bargaining games*）通常由两名玩家分一笔特定收益（通常是钱），这正是本文的焦点，因为它们特别有助于考察正义的道德心理学，典型例子是最后通牒博弈和独裁者博弈。我们还会看心理学家 C. Daniel Batson 给独裁者博弈设计的一个新颖变式——它催生了围绕他所称“道德伪善”的大量实验文献。最后，我们会把关于经济博弈的讨论接到正义之德，以及宜人性、诚实-谦逊、正义敏感性等人格特质上。
