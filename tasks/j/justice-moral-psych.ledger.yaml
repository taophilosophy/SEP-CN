      Let me end this section with two cautionary notes about this larger body of research. The first is that for many years experiments using both dictator and ultimatum games relied heavily on student participants, and were conducted largely in Western, developed countries. But of course caution (and empirical testing) are needed before drawing any conclusion about what people are like worldwide. Some recent work has indeed suggested that there is significant cross-cultural variation in the moral psychologies of participants playing these games. For instance, one meta-analysis of dictator games found that participants in lower-income countries make higher allocations to their partners (Umer et al. 2022; see also Engel 2011)[^engel-2011][^umer-2022]. Similarly, Cochard and his colleagues (2021) ran a meta-analysis of 144 dictator game experiments, and using a multi-faceted measure of economic development, they found that the development of a country was inversely proportional to donation amount. However, when they turned to 96 ultimatum experiments, there was no effect found for economic development. It is worth noting that they take this finding to be trouble for the fairness hypothesis as an explanation for allocation decisions in the two kinds of games, since on their view the hypothesis would require there to be no difference in distributions between the games (Cochard et al. 2021: 2)[^cochard-2021]. Fairer people in general were found to live in less developed countries.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      The second cautious note is that there have been some doubts raised about the external validity of dictator games, or the extent to which the results generated in these lab studies carry over to non-artificial or natural settings. For instance, Jeffrey Winking and Nicholas Mizer (2013) had a confederate approach an individual at a bus stop in Las Vegas, and “pretended to notice chips in his pocket, stopped briefly and claimed to the participant that he was late for a ride to the airport and asked the individual if he/she wanted the casino chips, which he did not have time to cash in,” and which were worth $20 (2013: 290). Ten feet away with his back turned to the participant was another confederate. The confederate with the chips would also add, “I don’t know, you can split it with that guy however you want” while pointing towards the second confederate (2013: 290). However, in stark contrast to the results earlier, here every single participant kept all $20 for themselves (2013: 291). Several writers have claimed that external validity might be limited because the laboratory results for dictator games could be heavily influenced by experimenter demand effects (Zizzo 2010, 2013, Winking and Mizer 2013)[^winking-2013][^zizzo-2010].
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      ## 3. Batson’s Modified Dictator Game and Moral Hypocrisy
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      For the past twenty years, the psychologist Daniel Batson and his colleagues have developed a novel experimental approach which closely resembles the dictator game. Because this approach has been explored using a number of interesting modifications by the same researcher in the course of constructing a sophisticated motivational story about resource allocation, and because his findings have attracted a great deal of interest and attention, it is worth delving into them in some detail (For the studies, see Batson et al. 1997, 1999, 2002, 2003. For reviews, see Batson and Thompson 2001 and Batson 2008. For related studies and discussion, see Valdesolo and DeSteno 2007, 2008 and Watson and Sheikh 2008. For Batson’s exploration of the implications of this research for moral psychology, see Batson 2015.).
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Here is the setup Batson typically used. Participants were told that they were part of a task assignment study. Individually, they were given the choice of whether to assign a positive consequences task or a neutral consequences task to either themselves or another participant, who (they were told) would simply assume the assignment was made by chance. The positive consequences task was such that for each correct response, the participant would receive one ticket for a raffle with a prize of $30 at the store of his or her choice. In the neutral consequences task, there would be no consequences for correct or incorrect responses but, “most participants assigned to the neutral consequences task find it rather dull and boring” (Batson et al. 1997: 1339)[^batson-1997]. After making the assignment privately and anonymously, participants were asked about what was the morally right way to assign the task consequences, and to rate on a 9-point scale whether they thought the way they had actually made the task assignment was morally right.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      We can see that one of the differences between Batson’s setup and a typical dictator game is that here the recipient would not know where the allocation came from, nor that there was another possible allocation that could have been made to him instead. Now such information is not an essential feature of dictator games; in fact we just saw a similar setup in one of Dana’s studies. But in the usual configuration dictators typically know that recipients will know how they received their allocation.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      What ends up happening when participants are placed into this situation? Well, they tend to assign themselves the positive task. Out of twenty participants, Batson found (Batson et al. 1997: 1340)[^batson-1997]:
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      | Assigned self to positive consequences task | 16 |
      | --- | --- |
      | Assigned other to positive consequences task | 4 |
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      Furthermore, only 1 out of the 16 said that assigning oneself to the positive task was morally correct. Yet even these 16 participants rated the morality of their assignment in the middle of the 9-point scale (4.38), which was significantly lower than the 8.25 rating for the 4 participants who assigned the other participant to the positive consequences task (Batson et al. 1997: 1340)[^batson-1997].
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      From here Batson performed many additional studies which were variations of this initial setup. Suppose, for instance, that we make the moral norm at work here salient to participants just before they make their assignment by including a statement that,
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      > Most participants feel that giving both people an equal chance—by, for example, flipping a coin—is the fairest way to assign themselves and the other participant to the tasks (we have provided a coin for you to flip if you wish). But the decision is entirely up to you. (Batson et al. 1997: 1341)[^batson-1997]
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      10 participants flipped and 10 did not. 8 out of 10 in the first group said flipping was the morally right procedure, and 6 out of 10 said so in the second group. Most importantly, Batson found (Batson et al. 1997: 1342)[^batson-1997]:
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      | Assigned self to positive consequences task out of 10 who did not flip | 9 |
      | --- | --- |
      | Assigned self to positive consequences task out of 10 who *did* flip | 9 |
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
