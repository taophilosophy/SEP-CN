      In another study, Thomas Schlösser and his colleagues (2018) examined whether justice sensitivity predicts wealth distribution. They used a version of the welfare state game in which participants were assigned to be an upper, middle, or lower class subject in a hypothetical society which they got to help shape. Specifically they chose between a society with lower inequality (person A received €5, B received €4, and C received €3) versus higher overall wealth but greater inequality (A received €10, B received €6, and C received €1). As expected, participants who were high on JS_{Victim} (sensitivity to becoming a victim of injustice) were more likely to go with greater inequality if they were A or B, but greater equality if they were C. Participants who were high on the other three dimensions of justice sensitivity were more likely to choose less inequality regardless of whether they were A, B, or C (Schlösser et al. 2018: 79)[^schlösser-2018].
    step1: |-
      在另一项研究中，Thomas Schlösser 及其同事（2018）考察了正义敏感性是否预测财富分配。他们使用了福利国家博弈的一个版本：参与者被分配到假想社会中的上层、中层或下层，并参与塑造这个社会。具体地说，他们要在两个社会之间选择：一个不平等程度较低（A 得 5 欧元、B 得 4 欧元、C 得 3 欧元），另一个总体财富更高但更不平等（A 得 10 欧元、B 得 6 欧元、C 得 1 欧元）。如所预期，JS_{Victim} 高（即对成为不公受害者敏感）的参与者，如果自己是 A 或 B，更可能选择更大的不平等；如果自己是 C，则更可能选择更大的平等。正义敏感性另外三个维度高的参与者，无论自己是 A、B 还是 C，都更可能选择不平等较小的社会（Schlösser et al. 2018: 79）[^schlösser-2018]。
    step2: |-
      另一项研究中，Thomas Schlösser 及其同事（2018）考察正义敏感性是否预测财富分配。他们用的是福利国家博弈的一个版本：参与者在假想社会中被分派为上层、中层或下层，并参与塑造这个社会。他们要在一个不平等程度较低的社会（A 得 5 欧元、B 得 4 欧元、C 得 3 欧元）与一个总财富更高但不平等更甚的社会（A 得 10 欧元、B 得 6 欧元、C 得 1 欧元）之间作选择。如所预期，JS_{Victim} 高（即对成为不公受害者敏感）的人，若自己是 A 或 B，更倾向于更大的不平等；若自己是 C，则更倾向于更大的平等。正义敏感性另外三个维度高的人，不论自己是 A、B 还是 C，都更倾向于选择不平等较小的社会（Schlösser et al. 2018: 79）[^schlösser-2018]。
