      Furthermore, only 1 out of the 16 said that assigning oneself to the positive task was morally correct. Yet even these 16 participants rated the morality of their assignment in the middle of the 9-point scale (4.38), which was significantly lower than the 8.25 rating for the 4 participants who assigned the other participant to the positive consequences task (Batson et al. 1997: 1340)[^batson-1997].
    step1: |-
      此外，16 人中只有 1 人认为自己把正面任务分给自己在道德上是正确的。然而，即便这 16 名参与者，对自己分配的道德性评分也只在 9 点量表的中段（4.38），显著低于把正面后果任务分给他人的那 4 名参与者的 8.25 分（Batson et al. 1997: 1340）[^batson-1997]。
    step2: |-
      而且，16 人里只有 1 人承认把正面任务分给自己在道德上正确。可即便这 16 人，对自己所做分配的道德评价也只落在 9 点量表的中段（4.38），显著低于把正面任务分给他人的那 4 人（8.25）（Batson et al. 1997: 1340）[^batson-1997]。
