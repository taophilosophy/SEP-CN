      Here is a general observation about the results we have seen in this essay. For each of the studies, there was rarely uniformity in behavior by all the participants in a particular situation. Indeed, in some cases there were striking differences. For instance, we saw that in the Forsythe study of dictator games, 21% gave nothing and 21% gave the equal amount of $10, leaving 58% somewhere in-between (Forsythe et al. 1994: 362)[^forsythe-1994]. We also saw that many people would pay $9 to take an exit option in Dana’s dictator studies, but many people also would not (Dana et al. 2006)[^dana-2006]. Or in Batson’s studies, many participants would assign themselves to the positive consequence task, but rarely would everyone do this.
    step1: |-
      关于本文所见结果，这里有一个一般性观察。对每一项研究来说，特定情境中所有参与者的行为很少一致。实际上，有些情形差异惊人。例如，我们看到在 Forsythe 的独裁者博弈研究中，21% 什么都不给，21% 给出 10 美元的平分，其余 58% 介于两者之间（Forsythe et al. 1994: 362）[^forsythe-1994]。我们也看到，许多人愿意付 9 美元换取 Dana 的独裁者研究中的退出选项，但也有许多人不愿意（Dana et al. 2006）[^dana-2006]。或者在 Batson 的研究中，许多参与者会把正面后果任务分给自己，但很少是所有人。
    step2: |-
      本文的结果有一个总的观察。在每一项研究里，同一情境下所有参与者的行为很少整齐划一；有些情形差异还相当惊人。例如，Forsythe 的独裁者博弈研究里，21% 的人分文不给，21% 的人给出 10 美元平分，中间还有 58%（Forsythe et al. 1994: 362）[^forsythe-1994]。Dana 的独裁者研究里，许多人愿意付 9 美元买退出选项，许多人却不愿意（Dana et al. 2006）[^dana-2006]。Batson 的研究里，许多人把正面后果任务分给自己，但很少是人人如此。
