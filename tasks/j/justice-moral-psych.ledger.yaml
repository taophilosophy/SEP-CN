      For what it’s worth, my view is that it is unlikely any one of the proposed motives in the ultimatum and dictator literatures is going to be sufficient by itself to explain the observed patterns of behavior. Nor, to be fair, are they usually intended by researchers to be sufficient either. Rather, motives concerned with good (monetary) outcomes for the self are no doubt part of the story. But so too are motives concerned with fairness. And so too are one or more additional egoistic motives, such as not wanting to appear selfish. Even altruistic motives can play a role in some cases (Zhao et al. 2016; García-Gallego et al. 2019; Umer et al. 2022; Livingston and Rasulmukhamedov 2023)[^garcía-gallego-2019][^livingston-2023][^umer-2022][^zhao-2016]. A complex, multi-motive model is what is needed going forward (see also Forsythe et al. 1994: 362; Roth 1995; Güth 1995; Kagel et al. 1996: 102; Pillutla and Murnighan 2003: 254; Dana et al. 2006: 195; Dana et al. 2007: 78; Murnighan and Wang 2016: 87; García-Gallego et al. 2019: 8; Ye et al. 2022)[^dana-2006][^dana-2007][^forsythe-1994][^garcía-gallego-2019][^güth-1995][^kagel-1996][^murnighan-2016][^pillutla-2003][^roth-1995].
    step1: |-
      就我个人而言，我认为最后通牒与独裁者文献中提出的任何单一动机，都不大可能独自充分解释所观察到的行为模式。说句公道话，研究者通常也并不打算让它们单独充分。更确切地说，关切自身良好（金钱）结果的动机无疑是故事的一部分；但关切公平的动机同样如此；此外还有一两种别的利己动机，比如不想显得自私。在某些情况下，利他动机也能起作用（Zhao et al. 2016; García-Gallego et al. 2019; Umer et al. 2022; Livingston and Rasulmukhamedov 2023）[^garcía-gallego-2019][^livingston-2023][^umer-2022][^zhao-2016]。往前走，需要的是一个复杂的多动机模型（另见 Forsythe et al. 1994: 362; Roth 1995; Güth 1995; Kagel et al. 1996: 102; Pillutla and Murnighan 2003: 254; Dana et al. 2006: 195; Dana et al. 2007: 78; Murnighan and Wang 2016: 87; García-Gallego et al. 2019: 8; Ye et al. 2022）[^dana-2006][^dana-2007][^forsythe-1994][^garcía-gallego-2019][^güth-1995][^kagel-1996][^murnighan-2016][^pillutla-2003][^roth-1995]。
    step2: |-
      依我之见，最后通牒与独裁者两支文献提出的任一动机，恐怕都难以单独充分解释观察到的行为模式。平心而论，研究者通常也不指望它们单独够用。更可能的情形是：关心自身（金钱）好处的动机无疑是故事的一部分，关心公平的动机同样是；此外还有一两种别的利己动机，比如不想显得自私。某些情况下，甚至利他动机也能起作用（Zhao et al. 2016; García-Gallego et al. 2019; Umer et al. 2022; Livingston and Rasulmukhamedov 2023）[^garcía-gallego-2019][^livingston-2023][^umer-2022][^zhao-2016]。往前走，需要的是一个复杂的多动机模型（另见 Forsythe et al. 1994: 362; Roth 1995; Güth 1995; Kagel et al. 1996: 102; Pillutla and Murnighan 2003: 254; Dana et al. 2006: 195; Dana et al. 2007: 78; Murnighan and Wang 2016: 87; García-Gallego et al. 2019: 8; Ye et al. 2022）[^dana-2006][^dana-2007][^forsythe-1994][^garcía-gallego-2019][^güth-1995][^kagel-1996][^murnighan-2016][^pillutla-2003][^roth-1995]。
