      Most relevant for our purposes, participants who are high on victim sensitivity are less likely to allocate 50/50 in dictator games, whereas the opposite is true for the other facets of justice sensitivity. Hence Detlef Fetchenhauer and Xu Huang (2004) found that observer sensitivity correlated .21 with an equal allocation, and perpetrator sensitivity correlated .30. On the other hand, victim sensitivity was negatively correlated at −.18 (Fetchenhauer and Huang 2004: 1024)[^fetchenhauer-2004].
    step1: |-
      与本文最相关的是：受害者敏感性高的参与者在独裁者博弈中更不可能做出 50/50 分配，而正义敏感性的其他层面则相反。因此，Detlef Fetchenhauer 与 Xu Huang（2004）发现，旁观者敏感性与均等分配的相关为 .21，施害者敏感性为 .30。另一方面，受害者敏感性呈负相关，为 −.18（Fetchenhauer and Huang 2004: 1024）[^fetchenhauer-2004]。
    step2: |-
      与本文最相关的是：受害者敏感性高的人在独裁者博弈里较少做 50/50 分配，正义敏感性其他层面的情形恰好相反。Detlef Fetchenhauer 与 Xu Huang（2004）因而发现，旁观者敏感性与均等分配的相关为 .21，施害者敏感性为 .30；受害者敏感性则为负相关，−.18（Fetchenhauer and Huang 2004: 1024）[^fetchenhauer-2004]。
