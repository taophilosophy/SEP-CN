      Using this measure of justice sensitivity, some interesting work is being done. For instance, Gollwitzer and his colleagues (2005) examined the willingness of West Germans to contribute to East Germany to help improve living conditions, as there is a large disparity even years after the wall came down. Some particular proposals included an automatic deduction from the salaries of West Germans that would be used for job creation in East Germany, and the implementation of affirmative action hiring policies which would favor East over West Germans for new positions. It turned out that beneficiary sensitivity, for instance, was found to predict solidarity with East Germans, whereas victim sensitivity did not (Gollwitzer et al. 2005: 191)[^gollwitzer-2005].
    step1: |-
      利用这套正义敏感性测量，人们正在做一些有趣的工作。例如，Gollwitzer 及其同事（2005）考察了西德人援助东德改善生活条件的意愿，因为即便在柏林墙倒塌多年之后，两地仍存在巨大差距。一些具体提案包括：从西德人的薪水中自动扣款，用于在东德创造就业；以及实施赞助性招聘政策，在新增职位上优先录用东德人而非西德人。结果表明，例如受益者敏感性能够预测对东德人的团结意愿，而受害者敏感性则不能（Gollwitzer et al. 2005: 191）[^gollwitzer-2005]。
    step2: |-
      有了这套正义敏感性测量，一些有趣的研究正在展开。例如，Gollwitzer 及其同事（2005）考察了西德人援助东德、帮助改善生活条件的意愿——毕竟柏林墙倒塌多年之后，两地差距仍然巨大。具体提案包括：从西德人的工资中自动扣款，用来在东德创造就业；以及实行平权行动式的招聘政策，新增职位优先录用东德人。结果显示，比如受益者敏感性可以预测对东德人的团结意愿，受害者敏感性却不能（Gollwitzer et al. 2005: 191）[^gollwitzer-2005]。
