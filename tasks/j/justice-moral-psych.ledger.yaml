      For what it’s worth, my view is that it is unlikely any one of the proposed motives in the ultimatum and dictator literatures is going to be sufficient by itself to explain the observed patterns of behavior. Nor, to be fair, are they usually intended by researchers to be sufficient either. Rather, motives concerned with good (monetary) outcomes for the self are no doubt part of the story. But so too are motives concerned with fairness. And so too are one or more additional egoistic motives, such as not wanting to appear selfish. Even altruistic motives can play a role in some cases (Zhao et al. 2016; García-Gallego et al. 2019; Umer et al. 2022; Livingston and Rasulmukhamedov 2023)[^garcía-gallego-2019][^livingston-2023][^umer-2022][^zhao-2016]. A complex, multi-motive model is what is needed going forward (see also Forsythe et al. 1994: 362; Roth 1995; Güth 1995; Kagel et al. 1996: 102; Pillutla and Murnighan 2003: 254; Dana et al. 2006: 195; Dana et al. 2007: 78; Murnighan and Wang 2016: 87; García-Gallego et al. 2019: 8; Ye et al. 2022)[^dana-2006][^dana-2007][^forsythe-1994][^garcía-gallego-2019][^güth-1995][^kagel-1996][^murnighan-2016][^pillutla-2003][^roth-1995].
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      An important recent paper by Li and colleagues (2022) makes a powerful empirical case for such a multi-motive model. While not employing a pure dictator approach, the researchers develop a related game which is also designed to better understand the moral psychology of wealth distribution. In their redistribution game, the participant does not receive any money themselves, but they have to redistribute an initial distribution already made to two strangers. To take Li’s own example, suppose initially Person A received ¥15 and Person B ¥3. Then in the first condition of the study, some participants have to choose between two redistributions which would promote greater equality, but one more than the other (so, e.g., the first might be ¥14 and ¥4, and the second ¥10 and ¥8). For participants in the Rank-reversal condition, on the other hand, everything is the same except the second offer is reversed (so in the example, Person A would receive ¥8 and Person B ¥10). One goal was to experimentally disentangle the potential role of three different motives: inequality aversion, harm aversion, and rank reversal aversion. And indeed, it turned out that all three motives seemed to make a difference. For instance, the probability of choosing the offer that would lead to greater equality was lower when it would involve reversing the ranking of Person A and B, so that now B would receive more. And Li found that “[i]mportantly, participants also chose the more equal offer less frequently when it entailed larger transfers of money from the advantaged to the disadvantaged party, showing that harm aversion also affected choices on top of rank reversal aversion” (Li et al. 2022: 3). Using fMRI approaches, they were even able to shed light on the neural mechanisms responsible for the different motives.
