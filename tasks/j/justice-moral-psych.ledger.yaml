  - id: 12
    kind: body
    source: |-
      ## 1. Ultimatum Games and Fairness
    step1: |-
      ## 1 最后通牒博弈与公平
    step2: |-
      ## 1 最后通牒博弈与公平
  - id: 13
    kind: body
    source: |-
      Ultimatum games have the following setup. Call one person the “offerer” and the other the “responder”, The offerer is informed that she can allocate a certain amount of a good. Suppose the good is money, such as $10, since that is the usual good chosen by experimenters in the literature. Next the offerer is instructed to make some offer to the responder—in our example, the offer could range between $0 and $10, inclusive. So the offerer can give away all the money, none of it, or something in-between. The only other piece of information that the offerer knows, standardly, is that the responder’s reaction matters when he is presented with her offer. If the responder accepts the offer, then both parties keep whatever the offer says (unless it is $0, in which case only one side keeps any money). But if the responder rejects the offer, then neither side gets any money at all, and the game is done. Hence if the offer is to keep $8 and give $2, and the responder accepts this offer, then that is in fact the amount of money with which each side walks away. But if the responder rejects the offer, then each side walks away with $0.
    step1: |-
      最后通牒博弈的设定如下。我们把一方称为“提议者”，另一方称为“回应者”。提议者被告知，她可以分配一定数量的某种物品。不妨假设这种物品是钱，比如 10 美元——这是文献中实验者通常选用的物品。接着，提议者被指示向回应者提出某个出价——在本例中，出价可以在 0 美元到 10 美元之间（含两端）。因此提议者可以把钱全部送出、一分不给，或者介于两者之间。提议者按标准设定知道的另一条信息是：当回应者面对她的出价时，回应者的反应很重要。如果回应者接受出价，那么双方各得该出价所示的钱（除非出价是 0 美元，那样只有一方拿到钱）。但如果回应者拒绝出价，那么双方都拿不到一分钱，博弈结束。所以，如果出价是“自己留 8 美元、给对方 2 美元”，而回应者接受了这个出价，那么双方带走的钱正是这个数目；但如果回应者拒绝，双方都两手空空。
    step2: |-
      最后通牒博弈的设定如下。一方称为“提议者”（offerer），另一方称为“回应者”（responder）。提议者被告知：她可以分配一定数量的某种物品。不妨假设这种物品是钱，比如 10 美元——这也是文献中实验者通常选用的物品。接下来提议者要向回应者报出一个出价：在本例中，出价可以是 0 到 10 美元之间的任何数（含两端）。也就是说，提议者可以把钱全部送出去、一分不给，或者取其中的任意一个数。按标准设定，提议者唯一还知道的信息是：回应者面对出价时，其反应至关重要。回应者接受出价，双方就各得该出价所示的数额（出价为 0 时例外，只有一方能拿到钱）；回应者拒绝出价，则双方都两手空空，博弈就此结束。举例来说，出价为“自己留 8 美元、给对方 2 美元”：回应者接受，双方就各按此数拿钱走人；回应者拒绝，双方都空手而归。
  - id: 14
    kind: body
    source: |-
      A couple of observations are important here. First, it is not essential to the game that the offerer know anything about the responder—he or she could be a complete stranger. Second and, as we will see, very importantly, it is not an essential feature of the game that the responder know how much money the offerer has to work with in the first place. So when the offer comes in at $2, the responder might have no idea whether that is all the money that the offerer has to allocate, or whether it is just a small amount out of $100, $10,000, or even higher. In many versions of the ultimatum game, the responder *is* told what the offerer has available. But the point to stress here is that this is an optional feature of the game. Finally, it is worth noting that the power dynamic in this game favors the offerer. The responder cannot make any counteroffers back in the hope of getting a bigger offer. He only has the threat of veto power. But if he does veto the offer, then he comes away with nothing himself. That is not a great negotiating position to be in.
    step1: |-
      这里有几点重要观察。第一，博弈的要点并不在于提议者了解回应者的任何信息——他或她可能完全是个陌生人。第二（这一点如后文所见，非常重要），回应者是否知道提议者一开始有多少钱可供分配，也不是博弈的必备特征。所以当出价是 2 美元时，回应者可能完全不知道这是提议者全部可分配的钱，还是 100 美元、10,000 美元甚至更多之中的一小部分。在最后通牒博弈的许多版本中，回应者*确实*被告知提议者有多少钱。但这里要强调的是：这只是博弈的可选特征。最后，值得注意的是，博弈中的权力态势有利于提议者。回应者不能反过来还价以期获得更大的出价；他只有否决权这一威胁。但如果他真的否决了出价，自己也将一无所获。这并不是一个好的谈判位置。
    step2: |-
      这里有几点值得注意。第一，提议者对回应者一无所知并不妨碍博弈成立——对方完全可能是陌生人。第二，也是最要紧的一点（后文将看到）：回应者是否知道提议者手里有多少钱可供分配，同样不是博弈的必备要素。当出价是 2 美元时，回应者可能根本不知道这是提议者所能分配的全部，还是 100 美元、10,000 美元乃至更多里的一小部分。许多版本的最后通牒博弈**确实**会告诉回应者提议者有多少钱，但必须强调：这只是可选设定。最后还要注意，这场博弈的权力格局偏向提议者：回应者无法还价、争取更大的出价，手里只有“否决”这张牌；可一旦真的动用否决，他自己也将一无所获。这不是什么好的谈判处境。
  - id: 15
    kind: body
    source: |-
      Given this last thought, a natural prediction to make about how ultimatum games will go is the following. Offerers will want to maximize their self-interest, and so maximize their take-home payment. They might think that, from a responder’s perspective, any money is better than no money. So we might predict that the offer itself will be as low as possible, say 1 cent or 5 cents in our example involving $10. For the responder to reject this offer would be irrational, since he would come away with nothing, whereas accepting the offer would make him better off than he would otherwise have been.
    step1: |-
      鉴于最后这一点，关于最后通牒博弈会如何进行的一个自然预测如下。提议者会想最大化自身利益，因而最大化自己的到手收益。他们可能认为，从回应者的角度看，有钱总比没钱好。于是我们可以预测，出价本身会尽可能低，比如在本例 10 美元的情境中出 1 美分或 5 美分。回应者拒绝这个出价是非理性的，因为他将一无所获，而接受出价则会使他好于原本的处境。
    step2: |-
      顺着这层考虑，对最后通牒博弈结局的自然预测是：提议者想最大化自身利益，也就是最大化自己到手的钱；他们大概会想，对回应者来说，有钱总比没钱强。于是可以预测，出价会压到最低——在本例 10 美元的情境中，比如出 1 美分或 5 美分。对回应者来说，拒绝这种出价是不理性的：拒绝了就一无所有，接受了则好过原本的处境。
  - id: 16
    kind: body
    source: |-
      This is, indeed, what many economists in the early days of research on the ultimatum game predicted would happen, on the basis of standard game theoretic assumptions (Kahneman et al. 1986: S285–286; Pillutla and Murnighan 1995: 1409; Güth 1995: 329; Camerer and Thaler 1995: 210)[^camerer-1995][^güth-1995][^kahneman-1986][^pillutla-1995]. In other words, given a concern to promote one’s own self-interest, the prediction is that minimal offers will be made in ultimatum games to maximize one’s take-home amount—which is the subgame perfect Nash equilibrium (Kahneman et al. 1986: S289; Forsythe et al. 1994: 348; Güth 1995: 331; Pillutla and Murnighan 1995: 1409, 2003: 248; Straub and Murnighan 1995: 345–346)[^forsythe-1994][^güth-1995][^kahneman-1986][^pillutla-1995][^straub-1995].
    step1: |-
      事实上，在最后通牒博弈研究的早期，许多经济学家基于标准博弈论假设，确实预测了这样的结果（Kahneman et al. 1986: S285–286; Pillutla and Murnighan 1995: 1409; Güth 1995: 329; Camerer and Thaler 1995: 210）[^camerer-1995][^güth-1995][^kahneman-1986][^pillutla-1995]。换句话说，给定促进自身利益的考量，预测是最后通牒博弈中会开出极小的出价，以最大化自己的到手金额——这就是子博弈完美纳什均衡（Kahneman et al. 1986: S289; Forsythe et al. 1994: 348; Güth 1995: 331; Pillutla and Murnighan 1995: 1409, 2003: 248; Straub and Murnighan 1995: 345–346）[^forsythe-1994][^güth-1995][^kahneman-1986][^pillutla-1995][^straub-1995]。
    step2: |-
      事实上，研究最后通牒博弈的早期，许多经济学家正是基于标准博弈论假设做出了这一预测（Kahneman et al. 1986: S285–286; Pillutla and Murnighan 1995: 1409; Güth 1995: 329; Camerer and Thaler 1995: 210）[^camerer-1995][^güth-1995][^kahneman-1986][^pillutla-1995]。换言之，如果人人求自利，预测就是：最后通牒博弈中会开出极小的出价，把自己的到手金额最大化——这就是子博弈完美纳什均衡（Kahneman et al. 1986: S289; Forsythe et al. 1994: 348; Güth 1995: 331; Pillutla and Murnighan 1995: 1409, 2003: 248; Straub and Murnighan 1995: 345–346）[^forsythe-1994][^güth-1995][^kahneman-1986][^pillutla-1995][^straub-1995]。
