      But once again, that is not what most participants actually did. In the same Forsythe study, while 21% gave nothing to the recipient, the remaining 79% gave something, with 21% giving an equal amount of the $10 (Forsythe et al. 1994: 362)[^forsythe-1994]. Kahneman also ran a version of a dictator game where students in a psychology course could divide $20 with an anonymous fellow student, or keep $18 for themselves and give $2 to the other student. Strikingly, 76% choose the even division (Kahneman et al. 1986: S291)[^kahneman-1986]. In addition, 74% of participants were subsequently willing to pay $1 to punish an unfair dictator and in the process reward a fair one, even though this would reduce their own monetary payment in the process (1986: S291). Van Dijk and Vermunt (2000) found that information asymmetries were not as prevalent as in ultimatum games. Specifically, there wasn’t a significant effect observed based on whether dictators knew that recipients were aware of the total amount dictators had to allocate. As they conclude,
    step1: |-
      但再次地，大多数参与者实际做的并非如此。在同一个 Forsythe 研究中，21% 的独裁者什么都没给受赠者，其余 79% 给了些什么，其中 21% 给出了 10 美元的平分（Forsythe et al. 1994: 362）[^forsythe-1994]。Kahneman 还运行了一个独裁者博弈版本：心理学课程的学生可以把 20 美元与一位匿名同学分配，或者自己留 18 美元、给对方 2 美元。引人注目的是，76% 选择了平分（Kahneman et al. 1986: S291）[^kahneman-1986]。此外，74% 的参与者随后愿意支付 1 美元去惩罚一个不公平的独裁者，并在此过程中奖励一个公平的独裁者，尽管这会减少他们自己的金钱所得（1986: S291）。Van Dijk 与 Vermunt（2000）发现，信息不对称不像最后通牒博弈中那么普遍。具体地说，独裁者是否知道受赠者会察觉独裁者可分配的总额，并未产生显著效应。正如他们所总结的，
