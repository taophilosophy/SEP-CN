      So in this experiment, only 22.5% of participants ended up with the neutral task. Yet for the 17 participants in the first group, on average they felt they had acted just as morally right (7.06 on a 9-point scale) as the 11 participants in the second group (7.91) (Batson et al. 1997: 1343)[^batson-1997].
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      What these results have suggested to Batson is that most of us (at least in these kinds of situations) are disposed towards a kind of *moral hypocrisy*, or appearing to be moral to oneself and others but avoiding the costs of actually being so if one can (try to) get away with it. After all, many participants were typically eager to flip the coin and report after the fact that this was the morally right course of action, but then distorted the process so that the results came out in their favor. Note that it is not the mere fact that they choose the positive consequences task for themselves that is hypocritical by itself—there could be cases where a person thinks of acts like this as being in line with her self-interest, and is not even aware of their moral ramifications. Nor is their hypocrisy captured here by the additional fact that the participants also seemed to believe in the moral principle that flipping the coin is the morally fair way to assign the task consequences. For then we would just have a perfectly familiar case of weakness of will, in which you believe that something is right but fail to be sufficiently motivated to do it. Rather, their hypocrisy arises when they (i) choose the positive consequences for themselves, while (ii) seeming to believe that flipping the coin and following what it indicates is morally correct, *and* (iii) still claiming to themselves and others to have made the morally right task assignment (For more on characterizing moral hypocrisy, see Batson et al. 1997: 1335–1336, 1999: 525–526, 2002: 330; Batson and Thompson 2001; Batson 2008, 2011: 222–224.)[^batson-2008][^batson-1997][^batson-2001].
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      How is it really possible for these participants to pull off this combination? In particular, it is one thing to appear to be acting morally to others. But these participants are also appearing to be moral *to* *themselves* *too*. How are they able to downplay the costs associated with guilt, regret, and hypocritical behavior for acting immorally by going against what they know to be right, and also experience the self-rewards for moral behavior? One possibility is that the participants in question have come to deny any moral responsibility in this situation, thereby deactivating the moral norm. Or perhaps they have come to deny that they are able to carry out the task, or that they are no longer aware of the likely consequences of their actions. But there is no evidence to suggest that these background conditions have failed to apply in these particular cases (Batson 2008: 57)[^batson-2008]. Another possibility is that these participants have come to think that their behavior is in line with their moral standards, thereby allowing them to not feel guilt and to even perhaps take pride in their behavior. This could be because they have revised the content of the moral principle to create an exception clause for this one kind of situation. Or it might be that they lie to or deceive themselves about what the principle says in the first place.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      But the results already cited above cast doubt on these hypotheses as well (see in particular Batson et al. 1999: 526; this is not to say that these hypotheses are not accurate in other cases, but the focus here is only on understanding the data generated by Batson’s studies)[^batson-1999]. Batson also introduced another variety of the setup whereby the moral principle is made salient, a coin is provided, and the coin is clearly marked on one side with “SELF to POS[ITIVE]” and “OTHER to POS” for the opposite side (Batson et al. 1999: 527)[^batson-1999]. In those cases when the coin lands on OTHER, it seems very hard to think, in spite of what the moral principle and the coin both say, that a person who still assigns himself to the positive consequences task would take that to be morally acceptable. Furthermore, only 2 out of 40 participants reported afterwards that the most morally right thing to do is to assign themselves to the positive consequences task (Batson et al. 1999: 529)[^batson-1999]. Yet of the 28 who chose to flip, Batson found (Batson et al. 1999: 528)[^batson-1999]:
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      | Assigned self to positive consequences task | 24 |
      | --- | --- |
      | Assigned other to positive consequences task | 4 |
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Furthermore, those who assigned themselves to the positive consequences task after flipping the coin again thought that they were being highly moral (7.42 on a 9-point scale), while those who made the same assignment without flipping the coin did not (3.90) (Batson et al. 1999: 529)[^batson-1999]. So marking the coin and thereby reducing the ambiguity as to what the fair assignment should have been, did nothing to undermine moral hypocrisy. We are still without an explanation for how it seems to work—more on that in a moment.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      A natural thought here is that this last result does not distinguish between those participants who flip, win, and then rate the morality of their action, versus those who flip, lose, change the task assignment to favor themselves, and then rate the morality of their action. It could be that the former group (rightly) rates the morality of their action highly, since they are following the fair procedure, whereas the second group rates it low, perhaps around 4.0 as do those who do not even bother flipping the coin and just assign themselves the positive task. If the results came out this way, then we would have evidence for moral weakness of will, to be sure, but not for moral hypocrisy, since the second group would be honest about the moral failure of their action.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      In a later study, Batson tested this possibility using secret observations of how each participant who flipped ended up having his or her coin fall (Batson et al. 2002: 334–338)[^batson-2002]. Of the 32 who flipped the coin, 16 got OTHER to POS or otherwise fiddled the coin flip so that it came out in their favor (i.e., repeated flipping). For this group, the mean rated morality of their action was 5.56, which was significantly higher than the 3.89 for the group which assigned itself to the positive task without using the coin. On the other hand, it was also lower than the 7.45 for the group which flipped, won SELF to POS, and assigned themselves to the positive task (2002: 336). The upshot is that,
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      > even though the coin had no more effect on their decision than it had on the decision of those who did not claim to use the coin at all, the fiddlers still said they thought the way they made the task assignment decision was more moral. Their sham reference to use of the coin seems to have provided sufficient appearance of morality that they could claim to have acted, if not totally morally, at least moderately so. (2002: 337)
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      To summarize, the studies mentioned above suggest that participants could have had their relevant fairness norm activated—in this case, the norm that flipping a coin and conforming to its results is the morally right way to behave—and even be motivated to some extent to do so. But this motivation must have been so weak that, once the cost/benefit analysis was done on an alternative action of secretly ignoring the coin when it went against the person and instead assigning oneself to the positive task, it became fairly easy to outweigh or undercut the motivation to do the right thing. So our fairness norms look to have little enhancing power after all, or at least in these kinds of cases.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      But all is not lost for fairness norms. Batson was able to discover two variables which separately helped to ensure that motivation to be fair did win out. The first variable was the introduction of a mirror. The setup was as usual with no labeling of the coin, but now a mirror was propped up against a wall on the only table where participants could fill out their forms. For one group of participants, the mirror was facing them; for the other, it was turned to the wall. This ended up making a significant difference (Batson et al. 1999: 530)[^batson-1999]:
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      *Assigned Self to Positive Consequences Task*
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      |   | No Facing Mirror | Facing Mirror |
      | --- | --- | --- |
      | Did Not Flip Coin (29) | 85% | 62% |
      | Flipped Coin (23) | 85% | 50% |
    step1: TBD
    step2: TBD
