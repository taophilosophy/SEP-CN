      *Justice Sensitivity*. A relatively new and particularly exciting development in personality psychology has been the study of what is being called “justice sensitivity”. The basic idea is that individuals differ in general on this trait, which can be understood at its heart as a motive for justice (Stavrova and Schlösser 2015: 3)[^stavrova-2015]. After several refinements, consensus seems to be emerging around four facets for this trait (Schmitt et al. 2010; Stavrova and Schlösser 2015)[^schmitt-2010][^stavrova-2015]:
    step1: |-
      *正义敏感性*。人格心理学中一个相对较新、尤其令人兴奋的发展，是所谓“正义敏感性”的研究。基本想法是：个体在这一特质上普遍存在差异，其核心可以理解为一种正义动机（Stavrova and Schlösser 2015: 3）[^stavrova-2015]。经过几次改进，共识似乎正围绕这一特质的四个层面形成（Schmitt et al. 2010; Stavrova and Schlösser 2015）[^schmitt-2010][^stavrova-2015]：
    step2: |-
      **正义敏感性**。人格心理学里一个相对较新、也格外令人兴奋的方向，是所谓“正义敏感性”研究。基本想法是：个体在这一特质上普遍存在差异，而它的核心可以理解为一种正义动机（Stavrova and Schlösser 2015: 3）[^stavrova-2015]。经过几轮改进，共识似乎正围绕这一特质的四个层面形成（Schmitt et al. 2010; Stavrova and Schlösser 2015）[^schmitt-2010][^stavrova-2015]：
