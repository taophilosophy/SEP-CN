    source: |-
      But something surprising happened. Beginning with Werner Güth’s famous paper in 1982 (Güth et al. 1982)[^güth-1982], the first empirical studies that were actually conducted to see what people would do in this situation found a rather different result. Robert Forsythe and his colleagues, for instance, found that not one offerer kept the entire amount of $10, and that offers were instead distributed around the 50/50 split amount with 75% offering at least an equal amount (1994: 362). As we noted, this behavior by offerers is not what standard game theory would have predicted. Similarly, in a well-known paper Daniel Kahneman and his colleagues found that out of $10, the mean amount offered was $4.76 with 81% making equal split offers (1986: S291, see also Güth 1995)[^güth-1995].
    step1: |-
      但令人意外的事情发生了。自 Werner Güth 1982 年的著名论文（Güth et al. 1982）[^güth-1982]起，第一批真正考察人们在这种情境下会怎么做的经验研究发现了一个相当不同的结果。例如，Robert Forsythe 及其同事发现，没有一个提议者把全部 10 美元据为己有，出价反而围绕 50/50 对半分分布，75% 的提议者至少平分（1994: 362）。如前所述，提议者的这种行为并非标准博弈论所预测的。类似地，Daniel Kahneman 及其同事在一篇著名论文中发现，在 10 美元中，平均出价为 4.76 美元，81% 的人选择平分（1986: S291，另见 Güth 1995）[^güth-1995]。
    step2: |-
      但意外发生了。自 Werner Güth 1982 年那篇著名论文（Güth et al. 1982）[^güth-1982]起，第一批真正考察人们在此情境中如何行动的实验研究，得到了颇为不同的结果。例如，Robert Forsythe 及其同事发现：没有一个提议者独吞全部 10 美元；出价围绕 50/50 平分分布，75% 的提议者至少给出平分（1994: 362）。如前所述，标准博弈论预测不了提议者的这种行为。类似地，Daniel Kahneman 及其同事在一篇广为人知的论文中发现：在 10 美元里，平均出价为 4.76 美元，81% 的人给出平分出价（1986: S291，另见 Güth 1995）[^güth-1995]。
  - id: 18
    kind: body
    source: |-
      Surprising results were found for responders too. Kahneman also reports, for instance, that the mean of minimally acceptable (i.e., not rejected) offers was $2.59, with 58% demanding more than $1.50 (Kahneman et al. 1986: S291)[^kahneman-1986].
    step1: |-
      回应者一方也有令人意外的结果。例如，Kahneman 还报告说，最低可接受出价（即未被拒绝的出价）的均值是 2.59 美元，58% 的人要求高于 1.50 美元（Kahneman et al. 1986: S291）[^kahneman-1986]。
    step2: |-
      回应者一方同样出现了意外。例如 Kahneman 报告：最低可接受出价（即未遭拒绝的出价）的均值是 2.59 美元，58% 的回应者要求高于 1.50 美元（Kahneman et al. 1986: S291）[^kahneman-1986]。
  - id: 19
    kind: body
    source: |-
      To explain these puzzling results, several researchers began to move beyond standard game theoretic assumptions and appeal to a justice motive. With offerers, this could be a desire to be fair in allocating goods, together with a belief that the fair allocation in the game is an equal split. With responders, it could be a desire to not be treated unfairly. This could lead to different explanations of rejection behavior, such as a desire to not participate in unfair deals or a desire to punish someone who is behaving unfairly (Kahneman et al. 1986: S290, see also Forsythe et al. 1994; Güth et al. 1982; Güth 1995; Camerer and Thaler 1995)[^camerer-1995][^forsythe-1994][^güth-1995][^güth-1982][^kahneman-1986].
    step1: |-
      为了解释这些令人困惑的结果，一些研究者开始超出标准博弈论假设，诉诸正义动机。对提议者而言，这可能是一种公平分配物品的愿望，再加上一种认为博弈中的公平分配就是平分的信念。对回应者而言，这可能是一种不愿被不公平对待的愿望。这可以导向对拒绝行为的不同解释，例如不愿参与不公平交易的愿望，或者惩罚行不公者的愿望（Kahneman et al. 1986: S290，另见 Forsythe et al. 1994; Güth et al. 1982; Güth 1995; Camerer and Thaler 1995）[^camerer-1995][^forsythe-1994][^güth-1995][^güth-1982][^kahneman-1986]。
    step2: |-
      为了解释这些令人费解的结果，一些研究者开始跳出标准博弈论假设，转而诉诸正义动机。提议者一方，可能是公平分配物品的愿望，再加上“此博弈中公平的分配就是平分”这一信念；回应者一方，则可能是不愿遭受不公对待的愿望。由此可以对拒绝行为给出不同解释：不愿参与不公平交易的愿望，或者惩罚不公行为者的愿望（Kahneman et al. 1986: S290，另见 Forsythe et al. 1994; Güth et al. 1982; Güth 1995; Camerer and Thaler 1995）[^camerer-1995][^forsythe-1994][^güth-1995][^güth-1982][^kahneman-1986]。
