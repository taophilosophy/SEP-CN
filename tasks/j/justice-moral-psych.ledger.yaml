    source: |-
      But all four of these facets are indeed statistically related to each other, and at the same time are distinguishable pieces of a stable trait of justice sensitivity. While they do correlate with other personality traits such as the Big Five, the correlations are typically on the low side, which can be taken as evidence that justice sensitivity itself is a distinct trait (for a review, see Schmitt et al. 2010)[^schmitt-2010].
    step1: |-
      但这四个层面在统计上确实彼此相关，同时又是一个稳定的正义敏感性特质中可以区分的部分。它们虽然与其他人格特质（如大五）相关，但相关通常偏低，这可以看作正义敏感性本身是一个独立特质的证据（综述见 Schmitt et al. 2010）[^schmitt-2010]。
    step2: |-
      不过这四个层面在统计上确实彼此相关，同时又是一个稳定的正义敏感性特质中彼此可分的部分。它们虽与其他人格特质（比如大五）相关，但相关通常偏低——这可以当作正义敏感性本身是一种独立特质的证据（综述见 Schmitt et al. 2010）[^schmitt-2010]。
