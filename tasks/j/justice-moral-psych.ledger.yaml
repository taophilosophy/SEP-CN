      But this is not the end of the story about the research done to try to explain and predict ultimatum game behavior. In the 1990s, a wave of new studies began to cast doubt on these fairness explanations. Here are some of the interesting results from this research:
    step1: |-
      但关于试图解释与预测最后通牒博弈行为的研究，故事还没有结束。20 世纪 90 年代，一波新研究开始对这些公平解释提出质疑。以下是这项研究中一些有趣的结果：
    step2: |-
      但关于最后通牒博弈行为的研究故事并未就此结束。20 世纪 90 年代，一波新研究开始质疑这些公平解释。下面是其中一些有趣的结果：
  - id: 21
    kind: body
    source: |-
      1. Paul Straub and J. Keith Murnighan (1995) varied the amount of information given to offerers and responders. Some offerers were told that responders would know the amount that the offerer had to work with, while other offerers were told that responders would not have this piece of information at their disposal when presented with the offer. If the fairness hypothesis is correct, this change of information should not matter. The average offer should be roughly the same in both conditions. But it wasn’t. In the scenario where the starting amount is $10, the mean offer made to responders was $4.05 in the complete information condition, but $3.14 in the partial information condition. When the amount was $80, the means were $30.73 and $23.00 respectively (Straub and Murnighan 1995: 353)[^straub-1995]. A similar disparity emerged when participants were responders, some of whom were told the amount that the offerer had to work with, and some of whom were kept in the dark about this. For the ignorant group, the mean lowest acceptable offer was $1.04, and 29 out of 45 participants accepted an offer of $0.01. For the fully informed $10 group, it was $1.92. For the fully informed $80 group, it was $17.43 (1995: 351–352). This result, though, need not be out of line with what the fairness models above predict. The troublesome results for fairness models arise here with respect to the offerers, not the responders.
      2. Madan Pillutla and J. Keith Murnighan (1995) also varied partial versus complete information for offerers, and again found a significant difference. When the starting amount to be divided was $10, the mean offer given partial information was $3.54, whereas for complete information it was $4.66 (1995: 1415). The two new wrinkles were (i) whether offers would come with a label “this is fair” or not, and (ii) whether an independent third party would evaluate offers and decide if they were fair or not. Pillutla and Murnighan reasoned that if offerers really were motivated predominantly by fairness, then these variations should not matter significantly. But they did. For instance, in the partial information condition, it was already noted that the mean offer was $3.54, but it dropped to $2.61 in the fair label variation (1995: 1415). Hence, [t]hey acted as if labeling an offer as fair would lead respondents to accept smaller offers—even when the latter had complete information. (1995: 1417) On the other hand, the mean offer increased all the way to $4.67 in the third-party label variation, with 72% making 50–50 offers (1995: 1415–1416). These are effects that are easier to explain given a self-interested motivational story, than they are on a fairness motivational story. As the researchers note, “It seems that offerers only made equal offers when it was worth their while to appear fair” (1995: 1416). For responders, Pillutla and Murnighan found that again small offers were rejected much more frequently in complete information versus partial information conditions. The rejection rate increased even more when the information was complete and the offer was labeled as unfair by a third party (1995: 1420).
      3. Pillutla and Murnighan (1996) and Terry Boles and his colleagues (2000) were among several researchers who introduced the variation of giving outside options to responders, or options which they knew they would receive if they rejected an offer. For instance, a responder might reject an offer of $1 if he knows that he has an outside option of receiving $2 when rejecting an offer. With this new twist, researchers can then introduce additional conditions in which offerers know or do not know whether there is an outside option for responders, or what the value of that offer is, or what the range of the offer could be, and so forth. Without getting into all the various permutations, one important result that Boles found was that offerers made lower offers when they knew the size of the outside option, which does not seem to be what fairness would predict (Boles et al. 2000: 247)[^boles-2000]. Furthermore, Boles introduced a wrinkle whereby offerers could send a message with their offer, allowing them to be deceptive about the size of the allocation they had available to them in partial information conditions. The game was repeated with the same participants as offerers and responders for four rounds, and after each round, any deceit that offerers used was revealed to responders. It turned out that offerers were deceptive 13.6% of the time (2000: 247). Boles also discovered that when responders felt deceived, in the next round they were much more likely to reject a new offer, even at the expense of their self-interest. In other words, they wanted to punish the offender for deceiving them (Boles et al. 2000: 249–250)[^boles-2000].
