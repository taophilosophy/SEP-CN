      To clarify, this is not a point about being honest rather than lying about one’s behavior. Rather, the point with this criteria is that a fair person would likely not be deceived or be of two minds about the unfairness of his behavior in such instances. He would clearly recognize and acknowledge that his behavior was unfair. But again the participants did not tend to live up to this fairness standard. As we saw, in one study those who flipped and assigned themselves the positive consequence task rated what they had done as highly moral (7.30 on a 1 to 9 scale), and their rating was much higher than for those who assigned themselves to this task without flipping (4.00) (Batson et al. 1997: 1341)[^batson-1997].
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
