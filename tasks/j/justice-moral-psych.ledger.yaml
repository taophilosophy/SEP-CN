      As a quick aside, it is worth noting the implicit assumption in much of this literature that a 50/50 split is the fair distribution, whereas keeping most of the money for oneself would be considered unfair. Philosophically this might be a contested matter, and there could also be some variability in terms of which cultures tend to accept this assumption more so than others.
    step1: TBD
    step2: TBD
