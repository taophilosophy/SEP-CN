      Before diving in, it is worth saying something very briefly about why empirical results might be of interest to philosophers as they theorize about distributive justice. One might think, after all, that philosophers tend to focus less on what people actually tend to do and be like, as opposed to what they should do and be like. Nevertheless, in recent years philosophers in general have paid increasing attention to empirical research, and with respect to matters of distributive justice, a few important reasons for doing so are the following:
    step1: |-
      在深入之前，值得非常简短地说明：哲学家在思考分配正义理论时，为什么会对经验结果感兴趣。有人可能会想，哲学家关注的毕竟是人们应当做什么、应当成为什么样，而不是人们实际上倾向于做什么、实际是什么样。不过，近年来哲学家总体上越来越重视经验研究；就分配正义而言，这样做的理由有以下几个重要的：
    step2: |-
      在进入正题之前，先简短交代：哲学家研究分配正义理论，为什么要关心经验结果？有人或许以为，哲学家关注的是人们应当做什么、应当成为什么样，而不是人们实际上做什么、实际是什么样。不过近年来，哲学家整体上越来越重视经验研究；就分配正义而言，这样做的理由至少有四：
  - id: 10
    kind: body
    source: |-
      1. Ethical egoism claims that a person’s central goal ought to be the promotion of his or her long-term self-interest. Most philosophers reject ethical egoism. But is it psychologically realistic to expect most people to act on motives other than self-interested ones, such as motives of fairness and justice? Empirical results, such as those reviewed in the first three sections of this article, would bear on this question.
      2. Relatedly, moral philosophers have developed rich conceptions of the virtue of justice and what a just person would do. But are these conceptions empirically adequate and psychologically realistic for human beings like us? Empirical results would bear on this question, and if the answer is no, then perhaps those conceptions are problematized (Doris 2002; Miller 2014)[^doris-2002][^miller-2014].
      3. Philosophers might come up with normative criteria for when actions and institutions are just or not. But to actually apply those criteria to real world concerns, they need empirical data about how people and institutions are in fact behaving.
      4. Empirical data is also highly relevant to philosophers interested in developing strategies for improvement, so that just actions, just institutions, and just character are increasingly promoted.
    step1: |-
      1. 伦理利己主义主张，个人的核心目标应当是促进自己的长期自利。多数哲学家拒斥伦理利己主义。但指望多数人按自利以外的动机（如公平与正义的动机）行事，这在心理上现实吗？本文前三节所评述的经验结果，正关系到这一问题。
      2. 相关地，道德哲学家已经发展出关于正义之德以及正义之人会做什么的丰富构想。但这些构想对像我们这样的人类来说，在经验上恰当、在心理学上现实吗？经验结果关系到这一问题；若答案是否定的，那么这些构想或许就成了问题（Doris 2002; Miller 2014）[^doris-2002][^miller-2014]。
      3. 哲学家可能提出行动与制度何时正义、何时不正义的规范性标准。但要把这些标准实际应用于现实世界的问题，就需要关于人们与制度实际如何行事的经验数据。
      4. 经验数据也与想要发展改进策略的哲学家高度相关，以便让正义行动、正义制度与正义品格得到越来越多的促进。
    step2: |-
      1. 伦理利己主义主张，个人的核心目标就是增进自身长远利益。多数哲学家不接受伦理利己主义。可是，期待大多数人按公平、正义这类非自利动机行事，在心理学上现实吗？本文前三节评述的经验结果正与这个问题相关。
      2. 与此相关，道德哲学家对正义之德、对正义之人会如何行事，已有丰富的构想。但这些构想对像我们这样的人来说，经验上是否站得住、心理学上是否现实？经验结果能给出回答；如果答案是否定的，这些构想本身就可能成问题（Doris 2002; Miller 2014）[^doris-2002][^miller-2014]。
      3. 哲学家可以提出规范标准，判定行动与制度何时正义、何时不正义。但要把标准真正用到现实关切上，就需要经验数据——关于人和制度实际上如何行事。
      4. 经验数据对另一类哲学家同样重要：他们想设计改进策略，让正义的行动、制度与品格得到越来越多的促进。
