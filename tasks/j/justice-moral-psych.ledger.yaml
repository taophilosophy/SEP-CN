      Turning to cheating behavior, Alexander Götmann and his colleagues (2021) found that those higher in victim sensitivity cheated at a higher rate on a laboratory task, whereas when it came to perpetrator sensitivity those high on this dimension were less likely to cheat. The task involved solving matrices, seeing what your overall score was, and then having to manually type the score into a computer.
    step1: |-
      转向作弊行为，Alexander Götmann 及其同事（2021）发现，受害者敏感性较高的人在实验室任务中作弊率更高；而就施害者敏感性而言，这一维度高的人反而更不可能作弊。该任务要求解矩阵，看到自己的总分，然后手动把分数录入电脑。
    step2: |-
      再说作弊行为。Alexander Götmann 及其同事（2021）发现，受害者敏感性较高的人在实验室任务中作弊更多；而施害者敏感性高的人反而更少作弊。任务内容是：解矩阵题，看到自己的总分，然后手动把分数输进电脑。
