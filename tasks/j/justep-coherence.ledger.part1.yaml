      As we shall see, most, if not all, influential coherence theorists try to avoid these traditional objections by assigning some beliefs that are close to experience a special role, whether they are called “supposed facts asserted” (Lewis, 1946), “truth-candidates” (Rescher, 1973), “cognitively spontaneous beliefs” (BonJour, 1985) or something else. Depending on how this special role is construed, these theories are often classified as versions of *weak foundationalism*. An advocate of weak foundationalism typically holds that while coherence is incapable of justifying beliefs from scratch, it can provide justification for beliefs that already have some initial, perhaps minuscule, degree of warrant, e.g., observational beliefs.
    step1: |-
      正如我们将看到的，大多数——如果不是全部——有影响的融贯论者都试图通过赋予某些接近经验的信念一种特殊角色来避免这些传统反对意见，无论这些信念被称为“被断定的所谓事实”（Lewis, 1946）、“真理候选者”（Rescher, 1973）、“认知自发信念”（BonJour, 1985）还是别的什么。取决于如何理解这种特殊角色，这些理论常被归类为*弱基础主义*的版本。弱基础主义的支持者通常认为，尽管融贯无力从零开始证成信念，它却可以为已经具有某种初始的、也许极其微小的证成度的信念提供证成，例如观察信念。
