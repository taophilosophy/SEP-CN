      The mere rejection of foundationalism is not itself an alternative theory because it leaves us with no positive account of justification, save a suggestive metaphor about webs of belief. A more substantial contrasting proposal is that what justifies our beliefs is ultimately the way in which they hang together or dovetail so as to produce a coherent set. The fact that our beliefs cohere can establish their justification, even though each individual belief may lack justification entirely if considered in splendid isolation, or so it is thought. Following C. I. Lewis (1946), some proponents think of this situation as analogous to how agreeing testimonies in court can lead to a verdict although each testimony by itself would be insufficient for that purpose.
    step1: |-
      单纯拒绝基础主义本身并不是一种替代理论，因为它没有给我们留下任何关于证成的正面说明，只剩下一个关于信念之网的启发性的比喻。一个更具实质内容的对立主张是：最终证成我们信念的，是它们相互联结或契合从而产生一个融贯集合的方式。我们的信念彼此融贯这一事实可以确立它们的证成，尽管若孤立地考虑，每个个别信念可能完全缺乏证成——或者人们是这样认为的。沿循 C. I. 刘易斯（1946），一些支持者把这种情形视为与法庭上相互一致的证词可以导致裁决相类似，尽管每份证词本身不足以达到该目的。
    step2: |-
      单纯拒绝基础主义本身并不是一种替代理论，因为它没有给我们留下任何关于证成的正面说明，只剩一个关于信念之网的启发性比喻。一个更具实质内容的对立主张是：最终证成我们信念的，是它们相互联结或契合从而形成一个融贯集合的方式。我们的信念彼此融贯这一事实可以确立它们的证成，尽管若孤立地加以考虑，每个个别信念可能完全缺乏证成——或者人们是这样认为的。沿循 C. I. 刘易斯（1946），一些支持者把这种情形视为与法庭上相互一致的证词可导致裁决相类似，尽管每份证词本身都不足以达到该目的。
  - id: 5
    source: |-
      There is a serious objection that any coherence theory of justification must immediately face. It is called the *isolation objection*: how can the mere fact that a system is coherent, if the latter is understood as a purely system-internal matter, provide any guidance whatsoever to truth and reality? Since a coherence theory, in its basic form, does not assign any essential role to experience, there is little reason to think that a coherent system of belief will accurately reflect the external world. A variation on this theme is presented by the equally notorious *alternative systems objection*. For each coherent system of beliefs there exist, conceivably, other systems that are equally coherent yet incompatible with the first system. If coherence is sufficient for justification, then the beliefs in each of these incompatible systems would be justified if the system was believed. But this observation, of course, thoroughly undermines any claim suggesting that coherence is indicative of truth.
    step1: |-
      任何融贯论证成理论都必须立即面对一个严重的反对意见。它被称为*孤立性反驳*：如果一个系统是融贯的，而后者被理解为纯粹系统内部之事，那么系统融贯这一单纯事实如何能对真理与现实提供任何指引？由于融贯理论在其基本形式上不赋予经验任何本质角色，因此几乎没有理由认为一个融贯的信念系统会准确地反映外部世界。这一主题的一个变体由同样著名的*替代系统反驳*提出。对于每个融贯的信念系统，可以设想存在其他同样融贯却与第一个系统不相容的系统。如果融贯足以构成证成，那么若该系统的信念被相信，则这些不相容系统中的每一个信念都将是得到证成的。但这一观察当然彻底削弱了任何主张融贯是真理之标志的说法。
    step2: |-
      任何融贯论证成理论都必须立即面对一个严重的反对意见，它被称为*孤立性反驳*：如果一个系统的融贯被理解为纯粹系统内部之事，那么系统融贯这一单纯事实如何能对真理与现实提供任何指引？由于融贯理论在其基本形式上不赋予经验任何本质角色，因此几乎没有理由认为一个融贯的信念系统会准确地反映外部世界。这一主题的一个变体由同样著名的*替代系统反驳*提出。对于每个融贯的信念系统，可以设想存在其他同样融贯、却与第一个系统不相容的系统。如果融贯足以构成证成，那么若这些不相容系统中的任一系统被相信，其中每个信念都将得到证成。但这一观察当然彻底削弱了任何主张融贯是真理之标志的说法。
