  - id: 1
    source: |-
      An *epistemically justified belief* is one that is properly held, given the believer’s perspective, for the sake of believing the truth. According to a coherence theory of epistemic justification, also known as coherentism, a belief is epistemically justified by cohering with other beliefs. The nature of the coherence has been variously explained, as is discussed below. This coherentism is distinct from a coherence theory of *truth*, that is, a theory saying that a proposition is made true by being in some sort of coherent system. Modern coherence theorists, in contrast to some earlier writers in the British idealist tradition, typically subscribe to a coherence theory of justification without advocating a coherence theory of truth. Rather, they either favor a correspondence theory of truth or take the notion of truth for granted, at least for the purposes of their epistemological investigations. This does not prevent many authors from claiming that coherence justification is an indication or criterion of truth.
    step1: |-
      一个*在认识论上证成的信念*，是指就相信者自身的立场而言、为相信真理之故而得到恰当持守的信念。按照知识证成的融贯理论（又称融贯论），一个信念之所以在认识论上得到证成，在于它与其他信念相融贯。融贯的本性有种种不同解释，下文将予讨论。这种融贯论不同于关于*真理*的融贯理论，即认为一个命题因其处于某种融贯系统中而成为真的理论。与英国唯心主义传统中的某些早期作者不同，现代融贯论者通常赞成一种关于证成的融贯理论，而不提倡关于真理的融贯理论。毋宁说，他们要么赞成真理符合论，要么把真理概念视为当然，至少就其认识论研究的目的而言是如此。这并不妨碍许多作者宣称，融贯性证成是真理的一个标志或判准。
    step2: |-
      一个*在认识论上证成的信念*，是指就相信者自身的立场而言、为相信真理之故而得到恰当持守的信念。按照知识证成的融贯理论（亦称融贯论），一个信念之所以在认识论上得到证成，在于它与其他信念相融贯。至于融贯的本性，则有种种不同解释，下文将予讨论。这种融贯论有别于关于*真理*的融贯理论——后者认为，一个命题之所以为真，就在于它处于某种融贯系统之中。与英国唯心主义传统中的某些早期作者不同，现代融贯论者通常接受关于证成的融贯理论，而不提倡关于真理的融贯理论。毋宁说，他们要么赞成真理符合论，要么把真理概念视为当然，至少就认识论探究的目的而言是如此。这并不妨碍许多作者宣称，融贯性证成是真理的一个标志或判准。
  - id: 2
    source: |-
      A central problem in epistemology is to explain when we are justified in holding a proposition to be true. It is not at all evident what epistemic justification is, and classical accounts of that notion have turned out to be severely problematic. A foundationalist tradition inspired by Descartes holds that justified beliefs are those that are either self-evidently true or deduced from self-evident truths. But, as is often argued, little of what we take ourselves to justifiably believe satisfies these austere conditions: many of our apparently justified beliefs, it is commonly thought, are neither based on self-evident truths nor derivable in a strict logical sense from other things we believe in. Thus, the Cartesian rationalist picture of justification seems far too restrictive. Similar problems hound empiricist attempts to ground all our knowledge in the allegedly indubitable data of the senses. Depending on how they are understood, sense data are either not indubitable or else not informative enough to justify a sufficient portion of our purported knowledge. Cartesian foundationalism has its rivals. There is another form of foundationalism according to which some beliefs have some non-doxastic source of epistemic support that requires no support of its own. This support can be defeasible and it can require supplementation to be strong enough for knowledge. This sort of non-doxastic support would terminate the regress of justification. To do so it may not have to appeal to self-evidence, indubitability or certainty. Such foundationalist views vary on the source of the non-doxastic support, how strong the support is on its own, and what role in justification coherence plays, if any. This sort of foundationalism too has been criticized. Some critics of this position have questioned the intelligibility of the non-doxastic support relation. Thus, Davidson (1986) complains that advocates have been unable to explain the relation between experience and belief that allows the first to justify the second.
    step1: |-
      认识论的一个核心问题是说明我们何时有资格（证成）把某个命题视为真。认识论上的证成究竟是什么并不显然，而关于这一概念的经典说明已被证明存在严重问题。一种受笛卡尔启发的基础主义传统认为，被证成的信念或是自明为真的，或是从自明真理演绎出来的。但正如人们常常论证的，我们自认为合理地相信的东西中，几乎没有满足这些严苛条件的：我们许多表面上被证成的信念，人们通常认为，既非基于自明真理，也不能从我们所相信的其他东西中在严格逻辑意义上推出。因此，笛卡尔式的理性主义证成图景似乎过于狭隘。类似的问题也困扰着经验主义把我们的全部知识建立于所谓不可怀疑的感觉材料之上的种种尝试。取决于如何理解，感觉材料要么不是不可怀疑的，要么不足以提供充分信息来证成我们所谓知识的足够部分。笛卡尔式基础主义有其竞争者。还有另一种形式的基础主义，按照它，某些信念具有某种不依赖信念状态的认识论支持来源，而这种支持本身不需要支持。这种支持可以是可废止的，并且可能需要补充才能强到足以构成知识。这种非信念状态的支持将终止证成回溯。要如此做，它未必需要诉诸自明性、不可怀疑性或确实性。这类基础主义观点在非信念状态支持的来源、这种支持本身有多强、以及融贯在证成中（如果有的话）扮演什么角色上各不相同。这种基础主义也受到了批评。这一立场的一些批评者质疑非信念状态支持关系是否可理解。因此，戴维森（1986）抱怨说，支持者们一直未能说明经验与信念之间那种使前者证成后者的关系。
    step2: |-
      认识论的一个核心问题是说明我们何时有资格把某个命题视为真（即它何时得到证成）。认识论上的证成究竟是什么并不显然，而关于这一概念的经典说明已被证明问题重重。一种受笛卡尔启发的基础主义传统认为，被证成的信念要么是自明为真的，要么是从自明真理中演绎出来的。但正如人们常常指出的，我们自认为合理地相信的东西中，几乎没有任何一项满足这些严苛条件：人们普遍认为，我们许多表面上得到证成的信念，既非基于自明真理，也不能从我们所相信的其他东西中在严格逻辑意义上推出。因此，笛卡尔式的理性主义证成图景似乎过于狭隘。类似的困难也困扰着经验主义把我们的全部知识奠定在所谓不可怀疑的感觉材料之上的种种尝试。取决于如何理解，感觉材料要么并非不可怀疑，要么不足以提供充分信息来证成我们所谓知识的足够部分。笛卡尔式基础主义有其竞争者。还有另一种形式的基础主义，按照它，某些信念具有某种不依赖于信念状态的认识论支持来源，而这种支持本身无需任何支持。这种支持可以是可废止的，也可能需要补充才能强到足以构成知识。这种非信念状态的支持将终止证成回溯；要如此做，它未必需要诉诸自明性、不可怀疑性或确实性。这类基础主义观点在非信念状态支持的来源、这种支持本身有多强、以及融贯在证成中（如果有的话）扮演什么角色上各不相同。这种基础主义同样遭到了批评。这一立场的一些批评者质疑非信念状态支持关系是否可理解。因此，戴维森（1986）抱怨说，支持者们始终未能说明经验与信念之间那种使前者得以证成后者的关系。
