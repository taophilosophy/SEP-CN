      A further much discussed measure is that proposed in Fitelson (2003). It is based on the intuition that the degree of coherence of a set $E$ should be “a quantitative, probabilistic generalization of the (deductive) logical coherence of $E$” (ibid., 194). Fitelson takes it to be a consequence of this idea that a maximum (constant) degree of coherence is attained if the propositions in $E$ are all logically equivalent (and consistent). This is in accordance with $C_1$ but not with $C_2$, which as we saw is sensitive to the specificity (prior probability) of the propositions involved. Fitelson, who approached the subject from the standpoint of confirmation theory, proposed a complex coherence measure based on Kemeny and Oppenheim’s (1952) measure of factual support. A further innovative idea is that Fitelson extends this measure to take into account support relations holding between *all* subsets in the set $E$, whereas Lewis, we recall, only considered the support relation holding between one element and the rest. The degree of coherence of a set, finally, is defined as the mean support among the subsets of $E$. An alleged counterexample to this measure can be found in Siebel (2004) and criticisms and proposed amendments in Meijs (2006). An extended critique of “subset measures”, i.e. measures that require extensive computation of support relations between subsets, can be found in Olsson (2022). Olsson’s criticism focuses on problems of epistemic access (computational complexity), probability assessment and excessive support. The reader may wish to consult Bovens and Hartmann (2003), Douven and Meijs (2007), Roche (2013a), Shippers (2014a), Koscholke (2016) and Hartmann and Trpin (forthcoming) for further coherence measures and how they fare in relation to test cases in the literature, and Koscholke and Jekel (2017) for an empirical study of coherence assessments drawing on similar examples. The latter study indicates that the measures by Douven and Meijs and by Roche are more in line with intuitive judgement than other established measures. Olsson’s 2022 treatise is an updated defense of the Glass-Olsson measure ($C_1$), not as a conceptual analysis but as an explication in the sense of Carnap (1950). Finally, some authors have applied coherence measures to inconsistent sets, e.g., Schippers (2014b) and Schippers and Siebel (2015).
    step1: |-
      另一个广受讨论的测度是菲特尔森（2003）提出的。它基于这一直觉：一个集合 $E$ 的融贯度应当是“$E$ 的（演绎的）逻辑融贯性的一个定量的、概率性的推广”（ibid., 194）。菲特尔森认为，这一观念的一个后承是：如果 $E$ 中的命题全部逻辑等价（且一致），就达到一个极大（恒定）的融贯度。这与 $C_1$ 一致，却不与 $C_2$ 一致——正如我们看到的，$C_2$ 对所涉命题的特殊性（先验概率）敏感。菲特尔森从确认理论的立场接近这一主题，提出了一种基于凯梅尼与奥本海姆（1952）的事实支持测度的复杂融贯测度。另一个创新之处在于，菲特尔森把这一测度扩展到考虑集合 $E$ 中*所有*子集之间的支持关系，而我们记得，刘易斯只考虑一个元素与其余元素之间的支持关系。最后，一个集合的融贯度被定义为 $E$ 的各子集之间的平均支持。这一测度的一个所谓反例见西贝尔（2004），批评与修正建议见迈斯（2006）。对“子集测度”即要求大量计算子集间支持关系的测度的一个详细批评，见奥尔森（2022）。奥尔森的批评聚焦于认知可及问题（计算复杂性）、概率评估与过度支持。读者可参见博文斯与哈特曼（2003）、杜文与迈斯（2007）、罗奇（2013a）、席佩斯（2014a）、科朔尔克（2016）与哈特曼和特平（即将出版），以了解进一步融贯测度及其在文献测试案例中的表现；并参见科朔尔克与耶克尔（2017）关于利用类似例子的融贯评估的实证研究。后一项研究表明，杜文与迈斯以及罗奇的测度比其他既有测度更符合直觉判断。奥尔森 2022 年的专论是对格拉斯—奥尔森测度（$C_1$）的更新辩护，不是作为概念分析，而是作为卡尔纳普（1950）意义上的阐释。最后，一些作者把融贯测度应用于不一致的集合，例如席佩斯（2014b）与席佩斯和西贝尔（2015）。
