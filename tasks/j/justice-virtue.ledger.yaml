        As indicated earlier, today justice is very often first thought of as a property of societies or states, rather than of individual characters. Such views may, however, also offer an account of justice as an individual virtue. Such accounts will be what we have called norm-prior, as the norms for the virtue will derive from an antecedent theory of social justice. An excellent example of this structure is provided by john Rawls, in his highly-influential *A Theory of Justice*.
