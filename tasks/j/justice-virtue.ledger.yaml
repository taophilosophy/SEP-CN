        Michael Slote accepts care ethics as well-situated as a virtue ethical theory, but argues for the necessity of conceiving such a theory as “agent-based” – holding that motivation or motives are “the ultimate bases for evaluation of action, institutions, laws, and societies” (Slote 1998, p. 173)[^slote-1998]. As he has developed his view, empathic motivation has come to take an increasing role (Slote 2010, p. 124)[^slote-2010]. As with Noddings and Held, for Slote the relevant questions about justice are about forms of social organization, the allocation of rights, and so on. If there is a vestige of the Platonic/Justinian model of justice as a virtue, it would appear to figure in only as a rationale for the shape of some social policies reflecting e.g. social (or perhaps global) distributive justice. But empathy is the focal normative concern throughout. The justice of a society constitutively depends on the motives of the individuals who make it up (Slote 1998, p. 187; 2010, p. 128)[^slote-1998]. If the relevant motives are caring or empathic ones, then Slote’s analysis would seem to collapse the distinction between caring and justice as virtues of individual character (or motivation). That is, individuals would count as just exactly to the degree that their motivations are empathic, and they thus contribute to the laws, policies, institutions, and so on in ways that are reflective of similar motivations across society. But that is just to say that they are caring motivations as well.
    step1: |-
        Michael Slote 接受关怀伦理作为德性伦理理论的位置是恰当的，但论证了必须把这样一种理论设想为“基于行动者的”——主张动机或动因是“评价行动、制度、法律与社会的终极基础”（Slote 1998, p. 173）[^slote-1998]。随着他发展其观点，移情动机已开始发挥越来越大的作用（Slote 2010, p. 124）[^slote-2010]。与 Noddings 和 Held 一样，对 Slote 而言，关于正义的相关问题是关于社会组织形式、权利分配等等的问题。如果说柏拉图式/查士丁尼式的“正义作为德性”模式还有残迹，它似乎只是作为某些社会政策（反映例如社会的或也许全球的分配正义）之形态的一个理据而出现。但移情是贯穿始终的焦点性规范关切。一个社会的正义，构成性地依赖于构成它的个体的动机（Slote 1998, p. 187; 2010, p. 128）[^slote-1998]。如果相关动机是关怀性或移情性的，那么 Slote 的分析似乎就会把“关怀与正义作为个体品格（或动机）之德”的区分取消掉。也就是说，个体算作正义，恰恰取决于他们的动机是移情性的，并因此以反映全社会相似动机的方式，对法律、政策、制度等等作出贡献。但那不过是在说，它们也是关怀性的动机。
