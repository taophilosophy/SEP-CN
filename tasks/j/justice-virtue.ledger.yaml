        More significantly, perhaps, the evidence for Kohlberg’s stage sequence was drawn from studies of boys, and when one applies the sequence to the study of young girls, it turns out that girls on average end up at a less advanced stage of moral development than boys do. As indicated above, Carol Gilligan argued that her own studies of women’s development indicated that the moral development of girls and women proceeds and ends in a different fashion from that of boys and men, but that that proves nothing about inferiority or superiority: it is merely a fact of difference. But Jean Hampton, among others, responded that Gilligan’s critique was itself a distortion, and that concerns for justice and individual rights are as significant for and in the moral lives of women as for men (Hampton 1993)[^hampton-1993].
    step1: |-
        也许更显著的是，Kohlberg 阶段序列的证据来自对男孩的研究，而当把这一序列应用于年轻女孩的研究时，结果发现女孩平均停留在比男孩更不先进的道德发展阶段。如上所述，Carol Gilligan 论证说，她自己对女性发展的研究表明，女孩与女性的道德发展以与男孩和男性不同的方式进行和结束，但那证明不了优劣之分：那只是一个差异的事实。但 Jean Hampton 等人回应说，Gilligan 的批评本身就是一种歪曲，对正义与个体权利的关注对女性的道德生活与对男性同样重要（Hampton 1993）[^hampton-1993]。
