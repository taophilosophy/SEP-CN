        Aristotle does not see the virtue of justice in quite the comprehensive sense Plato does, though like Plato he sees virtue generally as a crucial constituent of the good life. At the same time Aristotle insists that virtue is desirable for its own sake, as well as for the sake of happiness. He treats justice as a virtue of character (in the entirety of one of the ten books of the *Nicomachean Ethics*, also common to the *Eudemian Ethics*), and as a virtue of constitutions and political arrangements (in *Politics*). The question naturally arises as to the relation between these forms of justice. Aristotle seems to think they are closely related, without clearly being applications of the same concept. As the latter is a conception of political justice, we will focus here on the former. Justice as a personal virtue follows Aristotle’s model for virtues of character, in which the virtue lies as an intermediate or mean between vices of excess and defect (*Nicomachean Ethics* V). While he grants that there is a “general” sense of justice in which justice is coincident with complete virtue, there is a “particular” sense in which it is concerned with not overreaching (*pleonexia*). It is not clear, however, exactly how Aristotle understands this arrangement, or the nature of the vices of excess and defect which this “particular” justice is to counteract. One very plausible reading has it that justice is opposed to a desire for maldistribution of “goods of fortune” such as money, fame, or honor (Williams 1980; Curzer 1995)[^curzer-1995][^williams-1980]. On another it is opposed to an insufficient attention to others’ rights (Foot 1988, p. 9). On still another it focuses on the goods of others, or common goods (O’Connor 1988; Miller 1995; Jagannaathan 2021, 2024)[^miller-1995][^o’connor-1988], perhaps tied to law as a matter of the norms of society (Lee 2014)[^lee-2014], or distributions congruent to the stability of society (Hirji 2018)[^hirji-2018].
    step1: |-
        亚里士多德对正义之德的理解，不像柏拉图那样具有包罗万象的意义，尽管他像柏拉图一样，把德性一般地视为好生活的一个关键构成要素。与此同时，亚里士多德坚持认为，德性既因其本身、也因幸福之故而可欲。他把正义当作一种品格之德（在《尼各马可伦理学》十卷中整整一卷讨论，也见于《欧德谟伦理学》），并当作宪法与政治安排之德（在《政治学》中）。自然会产生的问题是：这些形式的正义之间是什么关系。亚里士多德似乎认为它们密切相关，却又并非同一概念的不同应用。由于后者是一种政治正义观，这里我们将聚焦于前者。正义作为个人之德，遵循亚里士多德关于品格之德的模式：德性作为过度之恶与不足之恶之间的中项或中道（《尼各马可伦理学》卷五）。虽然他承认有一种“一般”意义的正义，在其中正义与完满的德性相合，但还有一种“特殊”意义的正义，它所关注的是一不“过度索取”（*pleonexia*）。然而，亚里士多德究竟如何理解这一安排，或这一“特殊”正义所要克服的过度与不足之恶的本性，并不清楚。一种很合理的读法是：正义所反对的是对“幸运之善”（如金钱、名声或荣誉）的分配不公的欲望（Williams 1980; Curzer 1995）[^curzer-1995][^williams-1980]。另一种读法是：正义所反对的是对他人权利关注不足（Foot 1988, p. 9）。还有一种读法：正义关注的是他人之善或共同善（O'Connor 1988; Miller 1995; Jagannaathan 2021, 2024）[^miller-1995][^o'connor-1988]，也许还与作为社会规范之事的法律相连（Lee 2014）[^lee-2014]，或与有利于社会稳定的分配相连（Hirji 2018）[^hirji-2018]。
