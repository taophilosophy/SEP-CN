        柏拉图在别处对正义作了稍有不同的处理。在《高尔吉亚》中，正义在于恰当地对待其他人（507b）。在《克里同》中，苏格拉底那位与他同名的朋友试图说服苏格拉底接受他（克里同）的提议，即用贿赂买通一条逃避苏格拉底正等待执行之死刑的路。这里，柏拉图的论证首先把正义的生活与好的生活联系起来，因而也就是苏格拉底最有理由去过的那种生活。这里与《理想国》一样，对柏拉图而言，正义作为德性之所以可欲，不是作为达到幸福的手段，而是作为幸福的内在构成核心。然后他论证说，正义不仅要求不向他人施加错待或伤害——即使是对他们施加的错待作出回应时也是如此——而且要求履行自己的约定，尤其是遵守自己（默示或明示的）遵守城邦法律的约定，除非能说服城邦改变这些法律。当然，正义不能要求人遵守那些要求他行不义的法律，正如苏格拉底自己的情况（按《申辩》中的刻画）所表明的那样（Kraut 1984）[^kraut-1984]。
