        It is worth noting (as Johnston 2011 observes)[^johnston-2011] that even if Plato’s is the first *philosophical* discussion of justice, a concern with what an individual is due as a matter of justice is a driving issue in Homer’s *Iliad*, though there is no counterpart concern there with justice as a property of a society or tribe. So even Plato’s philosophical concerns are building on well-established questions about what justice requires of us in our treatment of one another.
