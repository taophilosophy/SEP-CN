        More recently, David Schmidtz and John Thrasher suggest rethinking the relationship between social justice and individual justice (Schmidtz and Thrasher 2014)[^schmidtz-2014]. Turning Plato’s account of justice in *Republic* on its head, they depict justice as a bridge between a virtue of the soul and of the *polis*: because we are essentially social, we need community, and justice is a matter of harmony with the community. On their view this is (largely) a matter of compliance with rules and institutions that enable people to live in harmony and flourish together.
