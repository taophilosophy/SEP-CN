        Recent work ties the virtue of justice intimately to the experiences we have as emotional creatures. On this approach, instead of justice standing as distinct from “natural virtues” motivated by passions (as on Hume’s account), or needing to be replaced by sentimentally-driven attitudes such as care or compassion, justice is to be seen as a virtue largely *constituted* by emotion (Solomon 1994, Roberts 2010)[^roberts-2010]. The virtue amounts to a stable disposition of character to respond in the relevant ways to instances of injustice, perhaps consisting in those occasions in which one does not receive his or her due, and on the other hand to be disposed to a “will to give each his due” (Roberts 2010, p. 38)[^roberts-2010]. For Roberts, this is a will to realize “objective justice,” and as on other recent accounts, the virtue (and the passion) are theoretically subsidiary to this primary notion of “objective justice.”
    step1: |-
        晚近的工作把正义之德与我们作为情感存在物的经验紧密相连。在这一进路中，正义不是像（休谟论述中的）由激情所推动的“自然之德”那样独立存在，也不是需要被关怀或同情这类由情感驱动的态度所取代；相反，正义应被视为一种在很大程度上由情感 **构成** 的德性（Solomon 1994, Roberts 2010）[^roberts-2010]。这种德性是一种稳定的品格性情，以相关方式回应不义的情形——也许包括那些自己没有收到应得之物的场合——另一方面又倾向于一种“给予每个人应得之物的意志”（Roberts 2010, p. 38）[^roberts-2010]。对 Roberts 而言，这是一种实现“客观正义”的意志，而且像其他晚近论述一样，这种德性（以及激情）在理论上是附属的，从属于这一首要的“客观正义”概念。
