        In fact, this point — that “public utility is the sole origin of justice” — is the point of Hume’s discussion of justice in the *Enquiries* (III.I, ¶145). Scarcity imposes a need for us to distinguish mine from thine, and we have not sufficient generosity in our natures to do without property rules (as we might, say, in our families). And once again Hume argues that our recognition of the utility and necessity of justice provides “entire command over our sentiments” (*E* III.II, ¶163). As David Johnston observes (Johnston 2011, p. 138)[^johnston-2011], Hume’s understanding of the value of justice as instrumental in the promotion of utility marks a sharp shift from earlier understandings.
    step1: |-
        事实上，这一点——“公共效用是正义的唯一起源”——正是休谟在《道德原则研究》中讨论正义的要点（III.I, ¶145）。稀缺迫使我们区分我的与你的，而我们的天性没有足够的慷慨，以致不能没有财产规则（正如我们也许可以在家庭中做到的那样）。休谟再次论证说，我们对正义之效用与必要性的认识，提供了“对我们情感的完全支配”（*E* III.II, ¶163）。正如 David Johnston 所观察（Johnston 2011, p. 138）[^johnston-2011]，休谟把正义之价值理解为在促进效用上的工具性，这标志着与早期理解的尖锐断裂。
