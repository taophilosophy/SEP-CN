        The nadir of fixing the nature of justice through virtue occurs in Kant’s account of justice, in which justice is contrasted with virtue. The two are complementary elements in the “metaphysics of morals,” establishing a distinction between justice as a virtue and justice as a norm to which a virtue may or may not correspond.. Moreover, the doctrine of justice itself has two parts, roughly corresponding to the distinction present since Plato’s work, between the role of justice in the individual and the role of justice in the state. Kant calls these “private right” and “public right,” respectively. But right in either case is irrelevant to Kant’s conception of virtue; instead, right is a “condition” that can obtain between the moral agents comprising a moral or legal community, in virtue of their principles of choice in acting (Kant 1797)[^kant-1797].
