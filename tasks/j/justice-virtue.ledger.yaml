        Lisa Tessman, on the other hand, accepts the basic framework of Aristotelian thinking about virtues of character, and with it the virtue of justice (Tessman 2005)[^tessman-2005]. However, she argues that oppressive social conditions can interfere in ways Aristotle did not anticipate with the formation of virtues of character and consequently (given Aristotle’s framework) with prospects for happiness (eudaimonia). One point of amendment, then, to Aristotelian thought is to recognize that oppressive social conditions may make other traits — traits that are important for liberatory struggle — into virtues. Another, congruent with other lines of feminist critique, is that Aristotle is insufficiently appreciative of the need for sensitivity to and response to suffering, so that something like the kind of supplementation recommended by care ethics is appropriate. A different model of response to the development of the virtue of justice specifically under non-ideal or unjust social conditions, one modeled on Kohlberg’s original architectonic understanding of the virtue, is defended by Jon Garthoff (Garthoff 2018)[^garthoff-2018].
    step1: |-
        另一方面，Lisa Tessman 接受了关于品格之德的亚里士多德式思考的基本框架，并随之接受正义之德（Tessman 2005）[^tessman-2005]。然而，她论证说，压迫性的社会条件能以亚里士多德未曾预料的方式干扰品格之德的形成，并因此（在亚里士多德框架下）干扰幸福（eudaimonia）的前景。那么，对亚里士多德式思想的一个修正点，是承认压迫性的社会条件可能把其他特质——那些对解放斗争重要的特质——变成德性。另一个与女性主义批评的其他线索相符的修正是：亚里士多德对“对苦难的敏感与回应之需要”认识不足，因此像关怀伦理所建议的那种补充是恰当的。Jon Garthoff 则为一种不同的、回应“正义之德在非理想或不正义社会条件下的发展”的模式辩护，这种模式仿照 Kohlberg 对这一德性的原创架构性理解（Garthoff 2018）[^garthoff-2018]。
