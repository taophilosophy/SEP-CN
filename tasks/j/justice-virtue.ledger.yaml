        John Hacker-Wright argues that what is needed to replace a “legalistic” concern with moral status (as on modern liberal conceptions of justice) is instead an ethic of virtue with a different conception of the virtue of justice. Instead of a concern for the resolution of claims in something like reciprocal, contractual relations, Hacker-Wright’s conception of the virtue of justice is a matter of sensitivity to “vulnerability of value” in things, animate and otherwise. Thus, the threat of unjust — vicious – wronging hangs not only over people who are sufficiently cognitively impaired so as not to perceive insults, but also corpses, animals, and even rare and valuable rock formations (p. 463). This counts as a sense of justice in that, on Hacker-Wright’s view it is not merely that we can act wrongly or viciously toward such entities, but (following Midgley 1983) that they can be wronged by us by our doing so. Justice thus construed is a matter of non-reciprocal moral relations. However, while Hacker-Wright claims that on a virtue ethic “The character of the agent is recognized as ineliminable in picking out facts as they figure in our moral deliberation,” this does not strictly speaking seem to be true, as prior to virtue there is *value* which it is up to the just or virtuous person to respond with sensitivity (Hacker-Wright 2007, pp. 461, 463, 464)[^hacker-wright-2007]. In this way Hacker-Wright’s view seems in the end to be an instance of a norm-prior view of the virtue of justice.
    step1: |-
        John Hacker-Wright 论证说，要取代对道德地位（如现代自由主义正义观）的“法条主义”关切，需要的是具有一种不同正义之德概念的德性伦理。Hacker-Wright 的正义之德概念，不是对某种类似互惠的契约关系中的主张之解决的关切，而是对事物（有生命的与无生命的）中“价值的脆弱性”的敏感。因此，不义——即恶意的——错待所构成的威胁，不仅高悬于那些认知受损到无法察觉侮辱的人之上，也高悬于尸体、动物、甚至稀有珍贵的岩层之上（p. 463）。这之所以算作一种正义的意义，是因为在 Hacker-Wright 看来，我们不仅可能对这类存在者采取错误或恶意的行动，而且（沿 Midgley 1983）它们可能因我们这样做而受到我们的错待。如此理解的正义，关乎非互惠的道德关系。然而，尽管 Hacker-Wright 主张，在德性伦理中“行动者的品格被承认是不可避免的，就它在我们的道德考量中识别事实而言”，严格说来这似乎并不成立，因为在德性之前就存在 **价值**，而正义或有德之人正是要敏感地回应它（Hacker-Wright 2007, pp. 461, 463, 464）[^hacker-wright-2007]。如此，Hacker-Wright 的观点最终似乎是一种对正义之德的规范优先观点。
