        A somewhat different critique of a focus on a virtue of justice comes from Robin Dillon. Like Slote, her concern is more with social institutions, structures, and hierarchies than with traits of character, and in fact these priorities lead her to be critical of virtue ethical theories which, she believes, cannot ask the right questions about virtues and vices (Dillon 2012, p. 86)[^dillon-2012]. However, she does accept the point that character traits matter, though she believes attending to the vices that allow and support social structures that allow for oppression and domination is more pertinent to feminist moral philosophy.
