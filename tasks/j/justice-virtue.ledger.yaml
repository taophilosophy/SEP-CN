        From the start, the idea of justice as a virtue of individuals faced several challenges. First, “justice as a virtue” is ambiguous as between individual and social applications. Rawls and others regard justice as “the first virtue of social institutions” (1971, p. 3), but Rawls is not the first to think of justice as a virtue of social institutions or societies — Plato was there long before him. So the application to individuals has always been subject to eclipse. That said, individuals typically live as members of political communities, so the societal dimension of justice as a virtue will never be long out of view (Woodruff 2018)[^woodruff-2018].
    step1: |-
        从一开始，“正义作为诸个体的一种德性”这一观念就面临几重挑战。第一，“正义作为一种德性”在个体应用与社会应用之间是含混的。罗尔斯等人把正义视为“社会制度的首要德性”（1971, p. 3），但罗尔斯并不是第一个把正义看作社会制度或社会的德性的人——柏拉图远在他之前就已如此。因此，正义应用于个体这一面，始终有被遮蔽之虞。话虽如此，个体通常作为政治共同体的成员而生活，所以正义作为德性的社会之维，绝不会长久地淡出视野（Woodruff 2018）[^woodruff-2018]。
    step2: |-
