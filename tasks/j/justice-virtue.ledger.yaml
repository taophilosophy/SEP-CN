        Plato gives a somewhat different treatment of justice elsewhere. In *Gorgias*, it is a matter of treating other human beings appropriately (507b). In *Crito*, Socrates’ eponymous friend attempts to persuade Socrates to accept his (Crito’s) offer to bribe a way out of the death sentence Socrates is waiting to have executed. Here Plato’s arguments first associate the just life with the good life, thus the life Socrates has most reason to live. Here as in the *Republic* for Plato justice as a virtue is desirable not as a means to happiness but as the constitutive heart of it. And justice, he then argues, requires not only not inflicting wrong or injury on others, even in response to wrongs from them, but fulfilling one’s agreements, and — in particular — abiding by one’s (tacit or explicit) agreement to abide by the laws of the city unless one can persuade it to change them. Of course, justice cannot require one to abide by laws that require one to act unjustly, as Socrates’ own case (as characterized in *Apology*) shows (Kraut 1984)[^kraut-1984].
