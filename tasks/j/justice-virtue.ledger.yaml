        Whereas on theories of virtue along the lines of ancient accounts such as Plato’s and Aristotle’s, virtue is seen as valuable for its own sake, in a second category of theories an individual virtue of justice is construed as valuable instrumentally, to the achievement of other goods. Epicurus and Hume offer notable theories of this sort.
    step1: |-
        在柏拉图与亚里士多德这类古代学说所代表的那种德性论中，德性被视为因其本身而有价值；而在第二类理论中，一种个体正义之德则被理解为只具有工具性的价值，即作为达成其他善好的手段。伊壁鸠鲁与休谟提供了这类理论的著名例子。
