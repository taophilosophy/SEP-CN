        According to Rawls, individual justice is theoretically derivative from social justice because the just individual is to be understood as someone with an effective or “regulative” desire to comply with the principles of justice. However, it is not merely social justice that Rawls understands in (predominantly) rationalist fashion. When he explains how individuals (within a just society) develop a sense and/or the virtue of justice, he invokes the work of Piaget (below, §4). Rawls lays more stress than Piaget does on the role our affective nature (sympathy and the desire for self-mastery) plays in the acquisition of moral virtue. But, like Piaget, he stresses the need for a *sufficiently general appreciation and rational understanding* of social relations as the grounding basis of a sense of duty or of justice and he explicitly classifies his account of moral development as falling within the “rationalist tradition.”
    step1: |-
        按照罗尔斯，个体正义在理论上派生于社会正义，因为正义的个体应被理解为具有一种有效的或“规约性的”遵守正义原理的欲望。然而，罗尔斯并不只是以（占主导地位的）理性主义方式理解社会正义。当他解释（在正义社会中）个体如何发展正义感或正义之德时，他援引了皮亚杰的著作（下文 §4）。罗尔斯比皮亚杰更强调我们的情感本性（同情与自我主宰的欲望）在获得道德德性中的作用。但是，像皮亚杰一样，他强调需要对诸社会关系有一种 **充分普遍的理解与理性把握**，作为义务感或正义感的根基，并明确把他的道德发展论述归类为属于“理性主义传统”。
