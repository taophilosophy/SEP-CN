        Like Noddings, Virginia Held frames much of the point of the ethics of care against a historical theoretical backdrop of attention to justice (Held 1995, 2004, 2006)[^held-1995]. To some extent, like Noddings, for Held the relevant notion of justice is not a virtue of character but a concern with fairness, equality, and individual rights, or perhaps more generally impartial universal principles (Held 2004, p. 144; 2006, p. 14)[^held-2004]. In fact, Held more clearly poses an ethics of care as an alternative to virtue ethics (Held 2004, 143; 2006, 14)[^held-2004]. This is for two reasons. First, virtue ethical theories focus on dispositions and traits of individuals, whereas an ethics of care focuses on relations between individuals. Second, an ethics of care sees people as partially constituted by their relations with others, as opposed to the individualism characteristic of virtue ethics. Held does not think an ethics of care can do without a concern for justice as a value, however (Held 1995, 129)[^held-1995]. More generally, she believes, caring provides a “wider network” within which concerns for justice and virtue (as well as utility) should be fitted (2004, 147; 2006, 72). Margaret McLaren (2001), on the other hand, responds on the basis of commonalities between care ethics and virtue ethics that care ethics actually is most attractive when situated as an ethics of virtue. Marilyn Friedman (1987) similarly seems accepting of the general framework of virtue ethics, and of crucial places for virtues of both caring and justice within such a framework, responsive to different degrees and in different ways to gender differences she believes actually do hold, though not falling along a caring/justice fault line.
    step1: |-
        像 Noddings 一样，Virginia Held 在很大程度上把关怀伦理的要点置于对正义之关注的历史理论背景之下（Held 1995, 2004, 2006）[^held-1995]。在某种程度上，像 Noddings 一样，对 Held 而言，相关的正义概念不是一种品格之德，而是对公平、平等与个体权利的关注，或更一般地说是对不偏不倚的普遍原理的关注（Held 2004, p. 144; 2006, p. 14）[^held-2004]。事实上，Held 更明确地把关怀伦理作为德性伦理的一种替代而提出（Held 2004, 143; 2006, 14）[^held-2004]。这有两个理由。第一，德性伦理理论聚焦于个体的性情与特质，而关怀伦理聚焦于个体之间的关系。第二，关怀伦理把人视为部分地由他们与他人的关系所构成，这与德性伦理所特有的个体主义相对。然而，Held 并不认为关怀伦理可以没有对正义作为一种价值的关注（Held 1995, 129）[^held-1995]。更一般地说，她认为，关怀提供了一个“更宽的网络”，对正义与德性（以及效用）的关注应在其中得到安放（2004, 147; 2006, 72）。另一方面，Margaret McLaren（2001）基于关怀伦理与德性伦理之间的共同点回应说，当关怀伦理被安置为一种德性伦理时，它实际上最有吸引力。Marilyn Friedman（1987）同样似乎接受了德性伦理的一般框架，并接受了关怀与正义两种德性在这一框架中的关键位置，它们以不同程度、不同方式回应她确实相信存在的性别差异，尽管并不沿着一条关怀/正义的分界线。
