        第二，它们以什么方式进入“在特殊意义上正义的人”的本性，它们又如何与正义的规范相关？亚里士多德似乎在两种观念之间摇摆：一是把正义理解为一种德性，按他自己对德性是什么的独特理解——一种植根于中道学说、并要求拥有全部德性才算拥有任何一种德性的理解（《尼各马可伦理学》卷六第 13 节）——二是把正义当作具有一种形式规范结构的形式。关于亚里士多德的解释，可以落在上述德性优先/规范优先分类的任一边。在规范优先一边，Curzer（2016）与 Williams（1980）把亚里士多德的正义之德理解为对各类独立规范的回应，Curzer 甚至主张，其他德性所回应的规范（规则）**也** 是从正义的规范中推导出来的。另一方面，Berryman（2019）为一种我们称之为德性优先的进路（就亚里士多德的实践思想一般而言）辩护，Russell（2009）也是如此。LeBar（2020, 2025）论证说，亚里士多德本人在《尼各马可伦理学》卷五中对“特殊”正义之德提供了规范优先的进路，但对其他品格之德则提供了德性优先的进路，而且对正义也采取德性优先的进路，会更符合他的根本承诺。所有这些都是要搁置如下问题：这一“特殊”意义的正义与政治正义的关系，以及个体身上的正义之德在促成城邦正义中的作用（Jagannathan, 2024）。
