        There are also recent ventures in the spirit of the ancient Greek thinking about the individual virtue of justice. Rasmussen and Den Uyl (2005) argue for two interpersonal senses of justice (pp. 160–63). One is the familiar Aristotelian virtue. The second is a “metanormative” principle governing the institutions and legal frameworks in which individual agents (just and otherwise) live their lives and exercise their practical agency. The second of these senses of interpersonal justice does not draw its content from the exercise of virtue, but rather makes a place for it, in a norm-prior way. The former does depend on virtue overall (including the exercise of practical wisdom) for its demands, but these are construed broadly in the traditional way of rendering to each his due. Bloomfield (2011, 2024) similarly suggests extending the Aristotelian virtue of justice, arguing that self-respect is necessary for happiness, and treating oneself fairly requires treating oneself fairly, as one treats others fairly – a single standard for self and others – as a property of justice as individuals.
    step1: |-
        也有一些晚近的探索，延续了古希腊关于个体正义之德的思想精神。Rasmussen and Den Uyl（2005）主张两种人际的正义意义（pp. 160–63）。一种是常见的亚里士多德式德性。第二种是支配个体行动者（无论正义与否）在其间生活并运用其实践能动性的制度与法律框架的“元规范性”原理。人际正义的这第二种意义，其内容并非来自德性的运用，而是以规范优先的方式为德性留出位置。前一种则就其要求而言确实依赖于德性整体（包括实践智慧的运用），但这些要求是以“给予每个人他应得之物”这一传统方式宽泛地理解的。Bloomfield（2011, 2024）同样建议扩展亚里士多德的正义之德，论证说自尊对幸福是必要的，而公平对待自己需要像公平对待他人那样对待自己——对自我与他人用同一标准——这是正义作为个体之德的一种属性。
