        Second, in what way do they figure into the nature of the person who is just in the particular sense, and how are they related to the norms of justice? Aristotle seems torn between a conception of justice as a virtue in his distinctive understanding of what a virtue is — one rooted in the doctrine of the mean, and with a requirement that one have all the virtues to have any (*Nicomachean Ethics* VI.13) — and justice as having the form of a formal normative structure. Interpretations of Aristotle here can be found on both sides of the virtue-prior/norm-prior taxonomy mentioned above. On the norm-prior side, Curzer (2016) and Williams (1980) understand Aristotle’s conception of the virtue of justice as one responsive to independent norms of various sorts, with Curzer going so far as to maintain that the norms (rules) to which the other virtues respond are *also* derived from the norms of justice. On the other hand, Berryman (2019) argues for what we are calling a virtue-prior approach to Aristotle’s practical thought more generally, as does Russell (2009). LeBar (2020, 2025) argues that Aristotle himself offers a norm-prior approach to the “particular” virtue of justice in *Nicomachean Ethics* V, but a virtue-prior approach to the other virtues of character, and that a virtue-prior approach to justice as well would be more consistent with his fundamental commitments. All this is to leave aside questions of the relation between this “particular” sense of justice and political justice, and the role of the virtue of justice in the individual as it contributes to justice in the polis (Jagannathan, 2024).
