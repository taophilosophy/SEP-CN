        By way of comparison with the other Greek eudaimonists, Epicurus’ conception of the role of the virtue of justice reflects in part his distinctive understanding of *eudaimonia*, or happiness. For Epicurus this consisted in *ataraxia* — tranquility, or freedom from disturbance. Given that the good life is the life without disturbance, justice plays a key instrumental role. One might, Epicurus thinks, withdraw entirely from human society to avoid disturbance, but the alternative is to live socially under terms which secure the avoidance of disturbance. This is the structure of the ideal Epicurean community, in which each forbears aggression (Armstrong 1997, Thrasher 2013)[^armstrong-1997][^thrasher-2013]. Justice is a matter of keeping agreements generally, and in particular the agreement not to harm or transgress social norms.
    step1: |-
        与其他希腊幸福论者相比，伊壁鸠鲁关于正义之德之作用的看法，部分反映了他对 *eudaimonia*（即幸福）的独特理解。对他而言，幸福在于 *ataraxia*——宁静，即免于烦扰。既然好的生活是无烦扰的生活，正义就扮演关键的工具性角色。伊壁鸠鲁认为，一个人可以完全退出人类社会以避开烦扰，但另一种选择是在保障避开烦扰的条件下过社会生活。这就是理想的伊壁鸠鲁共同体的结构，在其中每人克制侵略（Armstrong 1997, Thrasher 2013）[^armstrong-1997][^thrasher-2013]。正义在于一般地遵守约定，尤其是遵守不伤害他人或不违反社会规范的约定。
