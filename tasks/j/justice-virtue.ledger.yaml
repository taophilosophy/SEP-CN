        LeBar (2013, 2014, 2020, 2025) takes a similar tack in attempting to incorporate Kantian and post-Kantian insights into just demands on the treatment of others into an Aristotelian virtue framework. On his view, there is no way to specify the contents of the demands of justice, or to spell out its norms, independently of the wider possession and exercise of the virtues, including the virtue of practical wisdom. At the same time, what the virtuous and just person sees, in inhabiting a social world with equals in moral standing, are the norms which have become associated with the liberal conception: the equal authority to obligate others and hold them accountable. In that way his view typifies the virtue-prior approach.
    step1: |-
        LeBar（2013, 2014, 2020, 2025）在试图把康德及后康德关于“对待他人的正当要求”的洞见纳入亚里士多德式德性框架时，采取了类似的进路。在他看来，若不诉诸更广泛的德性的拥有与运用（包括实践智慧之德），就无法阐明正义要求的内容，也无法讲清其规范。与此同时，德性与正义的人所看到的——当他栖身于一个道德地位平等者所构成的社会世界时——正是与自由主义观念相关联的那些规范：平等地有权使他人承担义务并让他们负责。如此，他的观点就是德性优先进路的典型。
