        Justice as a virtue was originally understood to be a property of individuals or, more precisely, of an individual’s character. Today, we tend to think of the virtue of justice primarily as attaching to social institutions. And insofar as we do think of justice as an individual virtue, we regard it as having a (grounding) reference to social justice. But the original idea, that justice is an individual virtue, remains worthy of attention and is the focus of this entry. (Justice as a virtue of societies, polities, and their institutions is addressed in the entry on distributive justice; see, also, the general entry on justice.)
    step1: |-
        正义作为一种德性，最初被理解为个体的一种属性，更确切地说，是个体品格的一种属性。如今，我们往往首先把正义的德性视为附着于社会制度之上。而只要我们确实把正义看作一种个体德性，我们便把它视为对（作为其根基的）社会正义有所指涉。然而，“正义是一种个体德性”这一原初观念，仍值得我们关注，也正是本词条的主旨所在。（正义作为社会、政体及其制度的德性，在“分配正义”词条中讨论；另见“正义”总词条。）
