        In recent decades there have been secular challenges to the primacy of justice among virtues. Carol Gilligan argues for a “different voice” for women in coming to grips with moral problems. Instead of a rights-based understanding of morality that gave special consideration to the individual, women see relationships between people as primary (Gilligan 1983, pp. 19, 29). Educational psychologist Lawrence Kohlberg had offered a thought experiment about a man (“Heinz”) tempted to steal a life-saving drug to save his sick wife (Kohlberg 1981, p. 12d; §4 below). Whereas boys are more likely to think of Heinz’ dilemma in terms of what is the right thing to do, girls, Gilligan argues, see the world as “a world of relationships and psychological truths where an awareness of the connection between people gives rise to a recognition of responsibility for one another” (Gillian 1983, p. 30). Gilligan carefully frames this contrast as one between voices, not a matter of ranking of dispositions or virtues, but her work can and did provide a basis for making that sort of assessment between virtues, one on which (as in Aquinas’ case) love and care for others turns out to be more important than considerations of justice.
    step1: |-
        近几十年来，对正义在诸德性中首要地位的世俗挑战已经出现。Carol Gilligan 主张女性在处理道德问题时有“不同的声音”。她认为，女性并不采取那种给予个体特别考虑的权利本位的道德理解，而是把人与人之间的关系视为首要（Gilligan 1983, pp. 19, 29）。教育心理学家 Lawrence Kohlberg 曾提出一个关于一个男人（“海因茨”）被诱惑去偷救命药以拯救病妻的思想实验（Kohlberg 1981, p. 12d; 下文 §4）。Gilligan 论证说，男孩更可能从“什么是正确的做法”来思考海因茨的困境，而女孩则把世界看作“一个关系与心理真理的世界，在其中对人与人之间联系的认识，引起对彼此责任的承认”（Gillian 1983, p. 30）。Gilligan 谨慎地把这一对照框定为声音之间的对照，而非对性情或德性之排序的裁定，但她的工作能够——而且确实——为在德性之间作出那类评估提供了基础，一种（如阿奎那的情形那样）对他人的爱与关怀最终被证明比正义考量更重要的评估。
