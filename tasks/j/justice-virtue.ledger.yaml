        The solution, Hume argues, is that we naturally fall into a “convention” by which we observe that rules of property — the observance of which is key to the virtue of justice — is good for all of us. This convention is no formal agreement; Hume argues that it cannot be something like the product of promise or compact (*T* III.ii.II). Instead, “it arises gradually, and acquires force by a slow progression, and by our repeated experience of the inconveniences of transgressing it” (*T* III.ii.II, p. 490). Much as two men pulling the oars in a boat together need no explicit agreement to find they prosper by such an arrangement, so do we generally. (Wilson 2018 explores support for Hume’s hypothesis through work in experimental economics.)[^wilson-2018] So in the end it is self-interest that drives us to comply with the requirements of justice, though Hume adds that sympathy with the public interest induces our endorsement of it once justice has become established. This endorsement, however, is reserved for a scheme of property rules taken generally; as Hume observes, individual instances of compliance may frequently be “contrary to public interest,” though such compliance is still required of us. Hume believes the benefit of the system overall, both to society and to individual, requires that rules not admit of exceptions (*T* III.ii.II, *E* Appendix III, §256). Self-interest accounts for the possibility of our being motivated to act as the virtue of justice requires, and both the utility and the agreeableness, both to ourselves and others, of a resulting social order with respected property rules, leads to our approbation of that motivation as a virtue.
    step1: |-
        休谟论证说，解决办法在于我们自然而然地陷入一种“惯例”，据此我们观察到，财产规则——其遵守是正义之德的关键——对我们所有人都有利。这一惯例不是正式的协议；休谟论证说，它不可能是诸如承诺或契约之类的产物（*T* III.ii.II）。相反，“它逐渐产生，并通过缓慢的进程、以及我们反复体验到违反它的不便而获得力量”（*T* III.ii.II, p. 490）。正如两个人在船上同划桨，不需要明确协议就会发现这种安排让他们受益，我们一般也是如此。（Wilson 2018 通过实验经济学的工作探讨了对休谟假说的支持。）[^wilson-2018] 所以最终是自利驱使我们遵守正义的要求，尽管休谟补充说，一旦正义确立，对公共利益的同情就会诱使我们认可它。然而，这种认可只留给一般地看待的财产规则体系；正如休谟所观察到的，个别的遵守实例可能常常“违背公共利益”，尽管这种遵守仍然是我们所被要求的。休谟相信，整个体系对社会的利益（对个体亦然）要求规则不容例外（*T* III.ii.II, *E* Appendix III, §256）。自利解释了“我们被正义之德所要求的方式所推动”这一可能性，而一个尊重财产规则的既成社会秩序，无论对我们自己还是对他人，其效用与可悦性都导致我们赞许这一动机为德性。
