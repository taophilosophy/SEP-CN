        These issues remain open in part because Aristotle seems most interested in establishing a conception of the formal *structure* of “particular” justice, which seems to reflect a conception of desert. He distinguishes between justice in distribution and justice in rectification. The former, he claims, adheres to a kind of proportionality, in which what each deserves is proportional to the relationship between the contributions. If A contributes twice as much as B (of whatever the metric of merit is relevant in some particular case), then A’s return ought also to be twice B’s. This conception of distributive justice obviously lends itself to “goods of fortune” — and to some goods, like wealth, more obviously than others — but it need not in principle be confined to such goods, although the examples Aristotle provides suggest such applications. Similarly, justice in rectification involves a sort of “arithmetical proportion.” If C defrauds D by amount X, then justice requires depriving C of X and restoring X to D, as a matter of reestablishing a kind of equality between them.
    step1: |-
        这些问题之所以悬而未决，部分是因为亚里士多德似乎最有兴趣确立“特殊”正义的形式 **结构** 概念，而这似乎反映了某种应得（desert）概念。他区分了分配正义与矫正正义。前者，他主张，遵循一种比例性：每人应得之物与贡献之间的关系成比例。如果 A 的贡献是 B 的两倍（无论以何种与特定情形相关的功绩尺度衡量），那么 A 的回报也应是 B 的两倍。这一分配正义概念显然适用于“幸运之善”——而且对某些善（如财富）比其他善更明显——但原则上它不必局限于这类善，尽管亚里士多德所提供的例子表明这类应用。同样，矫正正义涉及一种“算术比例”。如果 C 以数量 X 欺诈 D，那么正义就要求剥夺 C 的 X 并把它归还 D，以此在他们之间重建某种平等。
