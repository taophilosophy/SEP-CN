        Another instrumentalist approach is offered by Jon Drydyk, who builds on the “capability approach” to human welfare to make a case for a capabilities-based account of the justice of individual agents, in particular as against an “Aristotelian” approach that stresses justice as a matter of response to merit. Acting justly involves “striving to reduce and remove inequalities in people’s capabilities to function in ways that are elemental” to a truly human life (Drydyk 2012, pp. 31, 33)[^drydyk-2012]. This is a norm-prior account, in that we begin with a prior conception of the content of the requirements of justice, and conform the virtue to this conception. However, Drydyk emphasizes justice as a virtue of individuals, rather than institutions or societies. Drydyk’s strategy offers a counterpoint both to the Rawlsian way of thinking about just societies (below, §3) and to the ancient Greek way of thinking about justice as a virtue of individuals.
    step1: |-
        另一种工具主义进路由 Jon Drydyk 提出，他建立在人类福祉的“可行能力进路”之上，为个体行动者之正义的一种基于可行能力的论述辩护，尤其是反对那种强调正义是对功绩之回应的“亚里士多德式”进路。行正义涉及“努力减少并消除人们以对真正属人的生活而言是根本的方式发挥功能的能力上的不平等”（Drydyk 2012, pp. 31, 33）[^drydyk-2012]。这是一种规范优先的论述，因为我们始于一个关于正义要求之内容的先行概念，并使德性符合这一概念。然而，Drydyk 强调正义是个体的德性，而非制度或社会的德性。Drydyk 的策略，既为罗尔斯式的思考正义社会的方式（下文 §3）提供了对照，也为古希腊把正义思考为个体之德的方式提供了对照。
