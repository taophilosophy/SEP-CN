        Finally, in recent work Talbot Brewer has argued that a “revisionist” version of Aristotelian virtue ethics does a better job than competitors (including Kantian and contractualist theories) at recognizing the “irreplaceable value” of each human being (Brewer 2018)[^brewer-2018]. Brewer believes that a robust conception of the virtue of justice does important work for such a theory, not just focusing on distribution and allocation, but more generally establishing the space for virtuous recognition of ways that others can demand that we treat them (Brewer 2018, p. 25)[^brewer-2018]. Still, Brewer invokes Aquinas to argue that such justice is not enough, that that what is required is a recognition of a virtue of love to unify and perfect the other virtues of character.
