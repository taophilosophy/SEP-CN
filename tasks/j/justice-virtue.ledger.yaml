        亚里士多德式正义论述的显著要素在阿奎那那里重现。第一，正义首先是品格之德而非制度之德，尽管阿奎那在这些德性之间作出了一种亚里士多德所没有的区分。对阿奎那而言，正义作为德性是意志的完善之事，而非激情之事（ST II-II 58.4）。阿奎那没有提供“正义作为社会或制度之德”的论述，尽管他把从亚里士多德那里借来的“一般”意义的正义解释为个体为共同善而意愿与行动之事。“特殊”正义（与亚里士多德的论述一样，是他大部分关注的焦点）与作为个体与个体之间——尤其但不限于交换——的关系有关（ST II-II 58.8）。
