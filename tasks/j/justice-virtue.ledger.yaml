        Nel Nodding’s pioneering work in laying out an “ethic of care” takes a similar step. Following Gilligan, she sees much ethical theory as missing a feminine voice, one which grounds moral concern for the concrete other in caring for them and their needs, and thus as relational rather than individualistic (Noddings 1983, 1999). Yet some caution is required before seeing her as taking up something like a Thomistic stance on the priority of love over justice. For one thing, to a significant degree she wants to emphasize the importance of the concrete and particular as opposed to the abstract and general (or the reliance on universal principles) in thinking and acting morally. But that is an emphasis which animates some particularistic forms of virtue ethics, and does not distinguish justice from love or other virtues. Moreover, where she explicitly argues that care “‘picks up’ where justice leaves off” (Noddings 1999, p. 12), she is thinking of justice as a property of institutions (e.g. Rawls’ theory of justice as fairness), and institutional implementations of those theories, not a virtue of character. She is clearly concerned about the limits of “rights-talk,” but that at least historically has not been a prominent part in thinking about justice as a virtue of character. Thus she does not clearly take a side in this matter.
    step1: |-
        Nel Noddings 在提出“关怀伦理”方面的开创性工作也迈出了类似的一步。沿 Gilligan，她认为许多伦理理论缺少一种女性声音，这种声音把对具体他者的道德关怀建立在对他们及其需要的关怀之上，因此是关系性的而非个体主义的（Noddings 1983, 1999）。然而，在把她视为采取某种类似托马斯式“爱先于正义”的立场之前，需要谨慎。首先，在相当程度上，她想要强调具体与特殊（而非抽象与一般，或对普遍原理的依赖）在道德思考与行动中的重要性。但那种强调是某些特殊主义德性伦理形式所激发的，并不把正义与爱或其他德性区分开来。此外，在她明确论证关怀“‘接续’正义停下的地方”时（Noddings 1999, p. 12），她所想的正义是制度的一种属性（例如罗尔斯的“作为公平的正义”理论），以及那些理论的制度实现，而不是一种品格之德。她显然关切“权利话语”的局限，但那至少在历史上并不是思考“正义作为品格之德”的突出部分。因此，她并没有在这一问题上明确表态。
