        Hume advances a similar account of the value of the virtue of justice, in both the *Treatise* and the *Enquiries*. Virtue, Hume maintains, is a matter of “some quality or character,” produced in one by “durable principles of the mind” (*T*III.iii.I, p. 575). We deem such qualities virtues not, as on the ancient Greek view, because they conduce to the happiness of the person who has them, but because they have a “tendency to the good of mankind” or society. (*T*III.iii.I). This service renders them pleasing to our “moral tastes”: our approbation, Hume tells us, has its source in “view of a character, which is naturally fitted to be useful to others, or to the person himself, or which is agreeable to others, or to the person himself” (*T* III.iii.I, 591). We can think of that as the criterion some quality of character must have to be deemed a virtue. What counts as virtuous is an upshot of, and not the source of, the normative foundations of this view.
    step1: |-
        休谟在《人性论》与《道德原则研究》两部著作中都提出了关于正义之德之价值的类似论述。休谟主张，德性在于“某种性质或品格”，由“心灵中持久的原理”在一个人身上产生（*T*III.iii.I, p. 575）。我们之所以认为这类性质是德性，不是像古希腊观点那样因为它们有助于拥有者自身的幸福，而是因为它们具有“增进人类之善”或社会之善的“倾向”（*T*III.iii.I）。这种服务使它们对我们的“道德趣味”感到可悦：休谟告诉我们，我们的赞许源于“对一种性质的看法，这种性质天然地适于对他人或对自己有用，或对他人或自己令人愉悦”（*T* III.iii.I, 591）。我们可以把这看作某种品格性质要被认定为德性所必须满足的标准。什么算作有德，是这一观点之规范性基础的后果，而不是其来源。
