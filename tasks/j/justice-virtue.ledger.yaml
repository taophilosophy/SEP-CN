        The legacy of the ancients — Aristotle in particular — continued into the medieval period, notably in the work of Thomas Aquinas, who appropriated much of Aristotle’s philosophy while setting it into a Christian theological framework. As in Aristotle, virtue and virtues are prominent parts of his ethical theory. And, like Aristotle justice is an important virtue, though for Aquinas it less important than the virtue of charity, a Christian virtue that did not appear among the virtues recognized by Aristotle. There are other elements of his account that situate the virtue of justice in an interesting way in the transition from ancient eudaimonist accounts of virtue, in which virtue was the primary locus of moral assessment, to later views in which that locus shifted. But to the extent Christian writers allied themselves with Plato and Aristotle, they downplayed another central element in Christian thought and morality, the emphasis on agapic love. Such love seems to be a matter of motivationally active feeling rather than response to rational norms, and some writers on morality (eventually) allowed this side of Christianity to have a major influence on what they had to say about virtue.
    step1: |-
        古人的遗产——尤其是亚里士多德——延续到了中世纪，尤其是在托马斯·阿奎那的著作中，他吸收了亚里士多德哲学的许多内容，同时把它置于基督教神学框架之中。与亚里士多德一样，德性与诸德性是他伦理理论中的突出部分。而且，像亚里士多德一样，正义是一种重要德性，尽管对阿奎那而言，它不如仁爱之德重要，后者是一种未出现在亚里士多德所承认之德性中的基督教德性。他的论述中还有其他要素，把正义之德安置在“从古代幸福论式的德性论述（德性是道德评价的首要所在）到后来那种评价中心发生转移的观点”这一过渡中的一个有趣位置。但就基督教作者与柏拉图、亚里士多德结盟而言，他们淡化了基督教思想与道德中另一个核心要素，即对圣爱的强调。这种爱似乎是一种动机上活跃的情感，而非对理性规范的回应，而一些论道德的作者（最终）让基督教的这一面对他们关于德性所说的话产生了重大影响。
