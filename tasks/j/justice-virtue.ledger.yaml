        Finally, since justice is so important in just about every moral theory, and just about every moral theory has an account of virtue, in one sense there are as many accounts of a virtue of justice as there are moral theories. Consider, for example, an account like Rawls’s (§3 below) in which specifying the norms of justice is the primary task of theory, and an individual virtue follows in a subsidiary way as a matter of serving and supporting those norms (Anderson 2010, p. 2; LeBar 2014)[^anderson-2010][^lebar-2014]. Call such a structure (following LeBar 2025)[^lebar-2025] a “norm-prior” account. But the first treatments of justice as a virtue of individuals in Western sources were in Plato and Aristotle, who treated justice as one of a number of virtues of character and intellect. They modeled a kind of ethical theory that is distinctive in making virtue — rather than outcomes or principles of action — the fundamental locus of moral assessment. Watson (1990, §4) calls this the “claim of explanatory primacy” for virtue. Here the focus will be on such virtue ethical accounts, in which traits of character are the primary locus of moral assessment (Hursthouse and Pettigrove 2023)[^hursthouse-2023]. Even among these, however, we find a divide between norm-prior accounts and those that take the notion of virtue to somehow help determine the contents of the norms of justice. Call such a structure a “virtue-prior” account. Accounts on which the value of a virtue of justice is instrumental to realizing some other value are always norm-prior. Non-instrumental virtue ethical theories include both norm-prior and virtue-prior frameworks.
    step1: |-
        最后，由于正义在几乎每一种道德理论中都极为重要，而几乎每一种道德理论都有一种德性论，所以在一种意义上，有多少种道德理论，就有多少种“正义之德”的学说。试看像罗尔斯那样的学说（见下文 §3）：在其中，阐明正义的规范是理论的首要任务，而一种个体德性只是以附随的方式，作为服务与支持那些规范的事情而出现（Anderson 2010, p. 2; LeBar 2014）[^anderson-2010][^lebar-2014]。我们（沿 LeBar 2025）[^lebar-2025] 把这样的结构称为“规范优先”学说。但西方文献中关于“正义是个体的一种德性”的最早处理，见于柏拉图与亚里士多德，他们把正义视为品格之德与理智之德中的一种。他们塑造了一种独特的伦理理论，这种理论把德性——而非行动的结果或行动的原则——当作道德评价的根本所在。Watson（1990, §4）称之为德性的“解释优先性主张”。这里将聚焦于这类德性伦理学说，在这类学说中，品格特质是道德评价的首要所在（Hursthouse and Pettigrove 2023）[^hursthouse-2023]。然而，即便在这些学说内部，我们也看到规范优先学说与那些认为德性概念（以某种方式）有助于决定正义规范之内容的学说之间的分歧。我们把这样的结构称为“德性优先”学说。那些认为正义之德的价值在于实现其他某种价值、因而只具工具意义的学说，总是规范优先的。非工具性的德性伦理理论则兼含规范优先与德性优先两种框架。
