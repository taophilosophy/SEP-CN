        An example may be seen in the view of W.D. Ross, in taking virtue to be good for its own sake — and indeed, among goods of that kind (along with pleasure and knowledge) the greatest of goods — but characterizing justice independently of it. For Ross, justice consists in “the apportionment of pleasure and pain to the virtuous and the vicious respectively” (Ross 1930, 138)[^ross-1930], and we have a duty to promote it. Virtue, in turn, consists in part in a disposition to desire to do one’s duty (134). In that sense we arrive at a virtue of justice, desirable for its own sake, but little remains of the notion of justice as a virtue of individuals as it began with the ancient Greeks.
