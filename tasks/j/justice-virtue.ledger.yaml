        As indicated above, Western philosophical discussion of justice begins with Plato, who treats the topic in a variety of dialogues, most substantially in *Republic*. There Plato offers the first sustained discussion of the nature of justice (*dikaiosune*) and its relation to *eudaimonia* (happiness), as a departure from three alternatives receiving varying degrees of attention. First, there is a traditionalist conception of justice (speaking the truth and paying your debts). Second, Plato has Socrates rebut the Sophist conception of justice which built on a distinction between nature (*phusis*) and convention (*nomos*) As Plato has this conception articulated by Thrasymachus in Book I, justice is simply the “advantage of the stronger,” not tracking anything like the sort of value attributed to it by traditionalists. Finally, Plato has Socrates confront a conventionalist conception of justice that anticipates modern contractarian views, in which justice — forbearing preying on others in exchange for not being preyed on by them — is a “second-best alternative,” not as good as being able to prey at will upon others, but better than being the prey of others (338e). These last two challenges give rise to the central question of the book: to whose advantage is justice? Would we really be better off being unjust if we could get away with it? Plato’s negative answer to that question is the project of the balance of the work.
    step1: |-
        如上所述，西方哲学对正义的讨论始于柏拉图，他在多篇对话中处理这一主题，而最充分地体现在《理想国》中。在那里，柏拉图首次对正义（*dikaiosune*）的本性及其与 *eudaimonia*（幸福）的关系作出了持续讨论，以区别于三种受到不同程度关注的备选方案。第一，有一种传统主义的正义观（说真话、偿还欠债）。第二，柏拉图让苏格拉底驳斥智者的正义观，后者建立在自然（*phusis*）与约定（*nomos*）的区分之上。柏拉图让色拉叙马霍斯在第一卷中阐述这一观念：正义不过是“强者的利益”，并不追踪传统主义者赋予它的那种价值。最后，柏拉图让苏格拉底面对一种约定论的正义观，它预示了现代的契约论观点：在其中，正义——克制自己不掠夺他人，以换取不被他们掠夺——是“次优选择”，不如能随意掠夺他人那么好，但总比沦为他人猎物要好（338e）。这后两个挑战引出了全书的中心问题：正义对谁有利？如果我们能不受惩罚地行不义，我们是否会过得更好？柏拉图对该问题的否定回答，构成本书其余部分的工作。
