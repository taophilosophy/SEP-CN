        Such a sentimentalist account of justice is also found in Adam Smith; in fact, a focus on the sentiments almost completely swamps concern for virtue. Our judgments of virtue and vice, he says, are compounded by consideration of two different “relations” in a sentiment: “the cause or object which excites or causes it, and … the end which it proposes” (TMS II.i.introduction). His focus on those two “relations” obviates any independent discussion of virtue per se. He does however explicitly countenance a virtue of justice, developed in contrast with the virtue of beneficence. In Smith, even more clearly than in Hume, one can see that this virtue consists in conformity to “rules” or “laws” of justice that appear to exist antecedently to the realization of the virtue itself, unlike ancient accounts — a paradigm example of a norm-prior conception of the virtue. Smith indicates that justice merits resentment when absent, that it may be “extorted by force,” and that in the main it requires forbearing from harming others.. Smith calls justice a “negative virtue” in this respect: often all it requires is that we sit still and do nothing (Smith 1759, II.ii.I.5, 9)[^smith-1759]. It is essential to the subsistence of society, Smith tells us (Smith 1759, II.ii.3.3–4)[^smith-1759], but — in contrast to Hume — is not reducible in its motivational basis to regard for society. Instead, our just concern for “multitudes” is compounded of our concern for individuals, which arises from “fellow-feeling,” which is yet short of “love, esteem, and affection” (Smith 1759, II.ii.3.7)[^smith-1759].
    step1: |-
        这样一种对正义的情感主义论述，也见于亚当·斯密；事实上，对情感的关注几乎完全压倒了对德性的关切。他所说，我们对德与恶的判断，由对一种情感中两种不同“关系”的考虑所复合而成：“引起或造成它的原因或对象，……以及它所要达到的目的”（TMS II.i.introduction）。他对这两种“关系”的关注，使任何对德性本身的独立讨论都成为多余。然而，他确实明确认可了一种正义之德，它是与仁慈之德相对照而发展出来的。在斯密那里，比在休谟那里更清楚，人们可以看到这种德性在于对正义之“规则”或“法律”的遵从，而这些规则或法律似乎在德性实现之前就已存在，这与古代论述不同——这是规范优先德性观的典型例子。斯密指出，正义缺席时应得怨恨，它也许可以“以强力逼取”，而且它主要要求不伤害他人。就此而言，斯密称正义为“消极德性”：它常常只要求我们静坐不动、什么都不做（Smith 1759, II.ii.I.5, 9）[^smith-1759]。它对社会的存续至关重要，斯密告诉我们（Smith 1759, II.ii.3.3–4）[^smith-1759]，但——与休谟相对照——它的动机基础不能化约为对社会的关切。相反，我们对“众人”的正义关切，由我们对个体的关切所复合而成，后者源于“同感”，而“同感”又尚不及“爱、尊重与情爱”（Smith 1759, II.ii.3.7）[^smith-1759]。
