        A second challenge is that even the idea of justice as a virtue of individuals seems ill-defined in regard to scope. Plato in the *Republic* treats justice as an overarching virtue of both individuals and societies, so that almost every issue he (or we) would regard as ethical comes in under the notion of justice. But in later usages justice covers only part of individual morality, and we don’t readily think of someone as *unjust* if they lie or neglect their children — other epithets more readily spring to mind. We have come to think of individual justice as first and most readily regarding moral issues having to do with distributions of goods or property. It is, we think, unjust for someone to steal from people or not to give them what he owes them, and it is also unjust if someone called upon to distribute something good (or bad or both) among members of a group uses an arbitrary or unjustified basis for making the distribution. Discussion of justice as an individual virtue often centers on questions, therefore, about property and other distributable goods, though the broader sense first broached by Plato never entirely disappears. Still there is disagreement over whether the broader distributive questions associated with political morality have subordinated or obscured the earlier Greek concerns with justice as a virtue of individual character (Hursthouse 1999, pp. 5–6; Coope 2007; Lu 2017)[^coope-2007][^hursthouse-1999].
    step1: |-
        第二重挑战在于，即便“正义是个体的一种德性”这一观念，在范围上似乎也界定不清。柏拉图在《理想国》中把正义视为同时涵盖个体与社会的统摄性德性，以至于他（或我们）几乎会看作伦理问题的每一件事，都归到正义这一概念之下。但在后来的用法中，正义只涵盖个体道德的一部分，而我们并不轻易把说谎或忽视子女的人视为 *unjust*（不义的）——更易浮上心头的，是别的称号。我们已渐渐认为，个体正义首先且最直接涉及的，是与财物或财产分配有关的道德问题。我们认为，一个人偷窃他人财物、或不如数偿还所欠，是不义的；同样，如果某人受托在群体成员之间分配某种善（或恶，或兼而有之），却以任意或缺乏正当性的理由来分配，那也是不义的。因此，对正义作为一种个体德性的讨论，常常集中在财产及其他可分配之善的问题上，尽管柏拉图首度提出的那种更宽泛的意义从未完全消失。然而，对于与政治道德相关的那些更宽泛的分配问题，是否已让早期希腊人对“正义作为个体品格的德性”的关切相形见绌或将其遮蔽，仍有分歧（Hursthouse 1999, pp. 5–6; Coope 2007; Lu 2017）[^coope-2007][^hursthouse-1999]。
