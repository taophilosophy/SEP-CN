        Few would doubt that justice is a virtue of character. But there are other moral virtues. How is justice related to them? Is it more important? Even in *Republic*, in which Plato makes justice a “master virtue” of sorts, there are other virtues (wisdom, courage, and self-discipline), and elsewhere (notably *Gorgias*) Plato makes self-discipline (*sophrosune*) the “master virtue,” so it is not clear that justice has any sort of priority over these other virtues (Woodruff 2012)[^woodruff-2012]. Likewise, though the texts we have show Aristotle devoting more space to justice, it is not clear that the particular form of the virtue of justice has any sort of pre-eminence. On the other hand, Cicero claims that justice is the “crowning glory” of the virtues (*De Officiis* I.7). If we take virtue of character to have the moral centrality the ancients (perhaps in contrast to the moderns), how much importance should we accord to justice among the virtues?
    step1: |-
        很少有人怀疑正义是一种品格之德。但还有其他道德德性。正义如何与它们相关？它更重要吗？即便在《理想国》中——柏拉图在那里使正义成为某种“主德”——也还有其他德性（智慧、勇敢与自律），而在别处（尤其是《高尔吉亚》）柏拉图使自律（*sophrosune*）成为“主德”，所以正义是否对这些其他德性有任何优先性，并不清楚（Woodruff 2012）[^woodruff-2012]。同样，尽管现存的文本显示亚里士多德为正义留出了更多篇幅，但正义之德这一特殊形式是否具有某种卓著性，并不清楚。另一方面，西塞罗声称正义是诸德性的“冠冕”（*De Officiis* I.7）。如果我们像古人那样（也许与现代人相对照）赋予品格之德道德中心地位，那么我们应在诸德性中给予正义多少重要性？
