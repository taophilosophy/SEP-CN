        In this way Epicurus offers a conception of the virtue of justice that harmonizes both its personal and its political dimensions. The personal virtue consists in the motivation to abide by a contract not to aggress against or harm others. The political virtue inheres in a polity in which such norms regulate the conduct of its citizens, and these two dimensions of justice as a virtue reinforce each other. However, its value is as merely instrumental to this further good of happiness.
