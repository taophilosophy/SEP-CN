        Recent thinkers have grappled with the question of priority between formal normative principle and virtue that vexes our reading of Aristotle, and offered solutions that for the most part subordinate the virtue of justice to the prior notion of the justice of distributions, as Aristotle himself seems to have suggested. As indicated above, Bernard Williams claims explicitly that this is so (Williams 1980, p. 197)[^williams-1980], as does David Wiggins, in an attempt to bring a “pre-liberal,” Aristotelian conception of justice to bear on modern liberal conceptions, a la Kant and Rawls (Wiggins 2004)[^wiggins-2004]. To do so, Wiggins distinguishes three senses of justice: (A) a matter of outcomes or states of affairs in which each gets what is due; (B) a disposition to promote justice (A); (C) a condition of the polis in virtue of which (A) is realized. Wiggins claims that the proper outcome of this collision of conceptions is one that recognizes a form of *logical* priority of justice (A) over justice (B) (p. 489). At the same time, against Williams he insists that the normative demands of justice (A) are “comprehensible” only within the perspective of a person with justice (B). And in fact he claims that a necessary condition on acts and outcomes satisfying the norms of justice (A) is that they be recognized to be so by those with the virtue of justice (B). Wiggins’ thinking here is not transparent, but perhaps the thought is that the logical point is purely formal: someone with justice (B) must, in act or judging justly, be responding to some norm which counts as justice (A). But, as *merely* formal, that tells us nothing about the substantive content of that norm. To get that, we have ineliminable need to refer to the judgment of the person with justice (B). That marks a way perhaps of returning to a virtue-prior understanding of the standards for justice as a virtue.
    step1: |-
        晚近的思想家一直在艰难处理那个困扰我们对亚里士多德解读的“形式规范原理与德性孰先”的问题，并提出了一些解决方案，这些方案大多把正义之德置于先行的分配正义概念之下，正如亚里士多德本人似乎已暗示的那样。如上所述，Bernard Williams 明确主张这一点（Williams 1980, p. 197）[^williams-1980]，David Wiggins 亦然，他试图把一种“前自由主义”的亚里士多德式正义观运用于现代自由主义观念，如康德与罗尔斯（Wiggins 2004）[^wiggins-2004]。为此，Wiggins 区分了正义的三种意义：（A）一种关于结果或事态的意义，在其中每人得到应得之物；（B）一种促进正义（A）的性情；（C）一种城邦的状态，凭此（A）得以实现。Wiggins 主张，这一观念碰撞的恰当结果，是承认正义（A）对正义（B）具有一种 **逻辑** 优先性（p. 489）。与此同时，针对 Williams，他坚持认为，正义（A）的规范性要求只有在具有正义（B）的人的视角内才是“可理解的”。事实上，他主张，行动与结果满足正义（A）之规范的一个必要条件，是它们被那些具有正义之德（B）的人承认为如此。Wiggins 这里的思路并不透明，但也许其想法是：这一逻辑论点纯粹是形式的：具有正义（B）的人，在行动或作出正义判断时，必须回应某种可算作正义（A）的规范。但这一点 **仅仅是形式** 的，它并未告诉我们该规范的实质内容。要获得这一点，我们不可避免地需要诉诸具有正义（B）的人之判断。这或许标志着一条回到“对正义作为德性之标准的德性优先理解”的道路。
