        Twentieth-century developmental psychology drew deeply on Kant’s moral-philosophical legacy. Piaget (1932 [1948]) treated moral development as principally involving increasing cognitive sophistication. More particularly, Piaget saw that sophistication as a matter of taking more and more general or universal views of moral issues, and endorsed the Kantian and rationalist idea that morality rests on and can be justified in terms of considerations of justice. Piaget saw a “law of evolution” in moral development, from an understanding of rules (including moral rules) as being “heteronomous” impositions of authority, to which one is objectively responsible, to a grounding in mutual respect, accompanied by subjective responsibility to others (Piaget 1932 [1948, p. 225])[^piaget-1932]. This transition is fostered through social interaction, and attention to norms of equality and reciprocity replace those of mere obedience.
    step1: |-
        二十世纪的发展心理学深深汲取了康德的道德哲学遗产。皮亚杰（1932 [1948]）把道德发展主要视为涉及不断增长的认知成熟。更具体地说，皮亚杰把这种成熟视为对道德问题采取越来越一般或普遍的观点，并赞同康德式与理性主义的观念：道德建立在正义的考量之上，并可用正义的考量来证明。皮亚杰在道德发展中看到一种“进化法则”：从把规则（包括道德规则）理解为权威的“他律”强加（对此我们客观地负责），到植根于相互尊重、并伴随对他人主观责任的理解（Piaget 1932 [1948, p. 225]）[^piaget-1932]。这一转变通过社会互动而促成，而对平等与互惠规范的关注取代了单纯服从。
