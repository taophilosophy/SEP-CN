      All these things can be consistently questioned. But the question is: at what cost? We have already seen that there are strong systematic reasons for explicating independence in terms of conditional independence in the standard way. Furthermore, the Content Determination Thesis is deeply entrenched in just about all work on coherence that takes agreeing witnesses to be the prototypical case. Giving up Content Determination would mean purging the coherence theory of one of its clearest and most distinctive pre-systematic intuitions: that coherence is a property at the level of report *contents*. The worry is that coherentism is saved at the cost of robbing it of almost all its significance, as Ewing put it almost a century ago in response to a similar worry (Ewing 1934, 246)[^ewing-1934].
    step1: |-
      所有这些都可以一致地质疑。但问题是：代价是什么？我们已经看到，有强有力的系统性理由以标准方式用条件独立来阐释独立性。此外，内容决定论题几乎在一切把一致证人视为典型情形的融贯研究中都根深蒂固。放弃内容决定意味着把融贯理论中最清晰、最独特的系统前直觉之一清除掉：融贯是报告*内容*层面的一种性质。正如尤因在近一个世纪前回应类似担忧时所说，问题在于融贯论以几乎剥夺其全部意义为代价而得救（Ewing 1934, 246）[^ewing-1934]。
