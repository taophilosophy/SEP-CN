      There are various ways to save the coherence theory from this probabilistic attack. The most radical strategy would be to dismiss the probabilistic framework as altogether unsuitable for coherentism. Independent reasons for this response can be found in Thagard’s work (e.g., Thagard 2000 and 2005)[^thagard-2000][^thagard-2005]. A less radical approach would be to refrain from any blanket dismissal of probability theory in this context but reject one of the premises of the troublesome proof. This is the strategy recently taken by Huemer, who now considers his 1997 probabilistic refutation of coherentism to be mistaken (Huemer 2011, 39, footnote 6)[^huemer-2011]. While he thinks that Coherentist Justification correctly captures a minimal sense of coherentism, he reports dissatisfaction with both Conditional Independence and Nonfoundationalism (his term for the latter is “Strong Nonfoundationalism”). Huemer now thinks independence, in the intuitive sense, is better captured by the condition $P(E_2 \mid E_1, A) \gt P(E_2 \mid E_1, \neg A)$. Moreover, he takes the condition $P(A \mid E_1, \neg E_2) = P(A)$, or “Weak Nonfoundationalism” in his terminology, to be a more suitable explication of nonfoundationalist intuitions than the condition $P(A \mid E_1) = P(A)$. He goes on to show that they are jointly consistent with Coherentist Justification: there are probability distributions satisfying all three conditions. Thus the immediate threat to coherentism presented by the observed inconsistency of the three original conditions has been neutralized, even though a critic might point out that the defense is incomplete since it has not been shown that Coherence Justification follows from the two new conditions.
    step1: |-
      有多种方式可以把融贯理论从这一概率攻击中拯救出来。最激进的策略是拒绝这一概率框架，认为它完全不适用于融贯论。这一回应的独立理由可以在萨加德的工作中找到（例如 Thagard 2000 and 2005）[^thagard-2000][^thagard-2005]。一个不那么激进的做法是：在此语境下不作任何一概而论的拒绝，而是拒绝那个令人困扰的证明的一个前提。这正是休默最近采取的策略，他现在认为自己 1997 年对融贯论的概率反驳是错的（Huemer 2011, 39, footnote 6）[^huemer-2011]。尽管他认为融贯论者的证成正确地把握了融贯论的一个最低限度的意义，他却表示对条件独立与非基础主义二者都不满意（他对后者的用语是“强非基础主义”）。休默现在认为，在直觉意义上，独立性由条件 $P(E_2 \mid E_1, A) \gt P(E_2 \mid E_1, \neg A)$ 更好地把握。此外，他把条件 $P(A \mid E_1, \neg E_2) = P(A)$，或按他的术语称为“弱非基础主义”，视为对非基础主义直觉的更适合的阐释，而非条件 $P(A \mid E_1) = P(A)$。他进而表明它们与融贯论者的证成是联合一致的：存在满足全部三个条件的概率分布。于是，由原三个条件的不一致性所呈现的对融贯论的直接威胁已被化解，尽管批评者可能指出这一辩护并不完整，因为并未证明融贯性证成从这两个新条件中推出。
