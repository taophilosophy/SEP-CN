      Bovens and Olsson demonstrated that the answer to the general question is in the negative by giving an example of a more coherent extended set that is also more probable, on the revised understanding of what this means, than the original smaller set. Klein and Warfield’s reasoning is based on a problematic understanding of the joint probability of a set of reported propositions. In the end, they have not shown that coherence is not truth conducive.
    step1: |-
      博文斯与奥尔森通过给出一个例子——一个更融贯的扩展集合，按照修正后的理解，也比原来的较小集合更可能——证明一般问题的答案是否定的。克莱因与沃菲尔德的推理基于对被报告命题集合之联合概率的一个有问题理解。归根结底，他们并未证明融贯不导向真理。
