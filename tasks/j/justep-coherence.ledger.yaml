      Paul Thagard’s theory is clearly influenced by the traditional concept of coherence but the specific way in which the theory is developed gives it a somewhat non-traditional flavor, in particular considering its strong emphasis on explanatory relations between beliefs. Like Rescher, Thagard takes the fundamental problem to be which elements of a given set of typically conflicting claims that have the status of *prima facie* truths to single out as acceptable. However, where Rescher proposes to base the choice of acceptable truths on considerations of plausibility, Thagard suggests the use of explanatory coherence for that purpose. According to Thagard, *prima facie* truths can cohere (fit together) or “incohere” (resist fitting together). The first type of relation includes relations of explanation and deduction, whereas the second type includes various types of incompatibility, such as logical inconsistency. If two propositions cohere, this gives rise to a positive constraint. If they incohere, the result is a negative constraint. A positive constraint between two propositions can be satisfied either by accepting both or by rejecting both. By contrast, satisfying a negative constraint means accepting one proposition while rejecting the other. A “coherence problem”, as Thagard sees it, is one of dividing the initial set of propositions into those that are accepted and those that are rejected in such a way that most constraints are satisfied. Thagard presents several different computational models for solving coherence problems, including a model based on neural networks.
    step1: |-
      保罗·萨加德的理论显然受到传统融贯概念的影响，但该理论得以发展的特定方式赋予了它某种非传统的色彩，尤其是考虑到它强烈强调信念之间的解释关系。与雷谢尔一样，萨加德认为根本问题是：在给定的一组通常相互冲突的、具有*初显真理*地位的主张中，挑出哪些作为可接受者。不过，雷谢尔提出以合理性考量为基础来选择可接受的真理，而萨加德则建议为此目的运用解释性融贯。按照萨加德，*初显*真理可以相融贯（契合在一起）或“不相融贯”（抗拒契合在一起）。第一种关系包括解释与演绎的关系，第二种关系包括各种不相容，例如逻辑不一致。如果两个命题相融贯，就产生一个正向约束；如果他们不相融贯，结果就是一个负向约束。两个命题之间的正向约束可以通过同时接受二者或同时拒斥二者来满足。相比之下，满足一个负向约束意味着接受一个命题而拒斥另一个。在萨加德看来，“融贯问题”是这样一种问题：把初始命题集合划分为被接受与被拒斥的两部分，使得大多数约束得到满足。萨加德提出了若干种解决融贯问题的不同计算模型，其中包括一种基于神经网络的模型。
