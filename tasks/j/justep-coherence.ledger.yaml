      Weak Foundationalism, which states that each testimony confirms at least some justification upon A by itself, does not entail Coherence Justification: it is common knowledge in probability theory that even if two pieces of evidence each support a given conclusion, that support may disappear, or even turn into disconfirmation, if they are combined. However, in the context of Conditional Independence, Weak Foundationalism does imply Coherence Justification. Indeed, the combined testimonies will, in this case, confer more support upon the conclusion than the testimonies did individually. As confirmed by James Van Cleve (2011), the conclusions supported by these considerations are that coherence can boost justification or credibility that is already there without being able to create such justification or credibility from scratch.
    step1: |-
      弱基础主义表明每项证词都独自赋予 A 至少某些证成，它并不蕴含融贯性证成：概率论中众所周知，即使两条证据各自支持一个给定结论，如果把它们结合起来，这种支持也可能消失，甚至变成否定支持。然而，在条件独立的语境下，弱基础主义确实蕴含融贯性证成。事实上，在这种情况下，结合起来的证词将比各自单独的证词赋予结论更多支持。正如詹姆斯·范·克利夫（2011）所确认的，这些考量所支持的结论是：融贯能够增强已经存在的证成或可信性，却不能从零开始创造这种证成或可信性。
