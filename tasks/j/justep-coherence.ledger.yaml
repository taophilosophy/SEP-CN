      The difficulties pertaining to both rationalism and empiricism about justification have led many epistemologists to think that there must be something fundamentally wrong with the way in which the debate has been framed, prompting their rejection of the foundationalist justificatory structure underlying rationalism and empiricism alike. Rather than conceiving the structure of our knowledge on the model of Euclidean geometry, with its basic axioms and derived theorems, these epistemologists favor a holistic picture of justification which does not distinguish between basic or foundational and non-basic or derived beliefs, treating rather all our beliefs as equal members of a “web of belief” (Quine and Ullian 1970, cf. Neurath 1983/1932 and Sosa 1980)[^neurath-1983][^quine-1970][^sosa-1980].
    step1: |-
      关于证成的理性主义与经验主义两者所遭遇的困难，已使许多认识论者认为，这场争论的框架必定存在某种根本性的错误，促使他们拒绝理性主义与经验主义所共有的基础主义证成结构。这些认识论者不是以欧几里得几何为模型来构想我们知识的结构（其基本公理与推出定理），而是赞成一种整体主义的证成图景，这种图景不区分基本的或基础的信念与非基本的或派生的信念，而是把我们的全部信念当作“信念之网”的平等成员（Quine and Ullian 1970, cf. Neurath 1983/1932 and Sosa 1980）[^neurath-1983][^quine-1970][^sosa-1980]。
    step2: |-
      关于证成的理性主义与经验主义双双遭遇的困难，已使许多认识论者认为，这场争论的框架必定存在某种根本性的错误，从而促使他们拒绝理性主义与经验主义所共有的基础主义证成结构。这些认识论者不以欧几里得几何为模型来构想我们知识的结构（其基本公理与推出定理），而是赞成一种整体主义的证成图景：这种图景不区分基本的或基础的信念与非基本的或派生的信念，而是把我们的全部信念当作“信念之网”的平等成员（Quine and Ullian 1970, cf. Neurath 1983/1932 and Sosa 1980）[^neurath-1983][^quine-1970][^sosa-1980]。
