      Olsson defines truth conduciveness in the standard fashion. His impossibility theorem is based on the following alternative proof strategy (Olsson 2005, appendix B)[^olsson-2005]: Consider a situation of two witnesses both reporting that $A$, represented by $S = \langle A, A\rangle$. Take a measure $C$ of coherence that is informative with respect to $S$, in the sense that it does not assign the same degree of coherence to $S$ regardless of which probability assignment is used. This means that the measure is non-trivial in the situation in question. Take two assignments $P$ and $P'$ of probabilities to the propositions in $S$ that give rise to different coherence values. Olsson shows that a counter example to the truth conduciveness of $C$ can be constructed through a strategic choice of the probability of reliability. If $P$ makes $S$ more coherent than does $P'$ according to $C$, we fix the probability of reliability in such a way that $S$ comes out as more probable on $P'$ than on $P$. If, on the other hand, $P'$ makes $S$ more coherent, then we choose a value for the probability of reliability so that $P$ makes $S$ more probable. It follows that no coherence measure is both truth conducive and informative.
    step1: |-
      奥尔森以标准方式定义导向真理。他的不可行性定理基于以下替代证明策略（Olsson 2005, appendix B）[^olsson-2005]：考虑两位证人都报告 $A$ 的情形，由 $S = \langle A, A\rangle$ 表示。取一个关于 $S$ 是“有信息量”的融贯测度 $C$，即它并不无论使用哪个概率赋值都给 $S$ 相同的融贯度。这意味着该测度在所讨论的情形中是非平凡的。取 $S$ 中命题的两个概率赋值 $P$ 与 $P'$，它们产生不同的融贯值。奥尔森表明，通过对可靠性概率作出策略性选择，可以构造 $C$ 导向真理的反例。如果按 $C$，$P$ 使 $S$ 比 $P'$ 更融贯，我们就把可靠性概率固定为使 $S$ 在 $P'$ 下比在 $P$ 下更可能。反之，如果 $P'$ 使 $S$ 更融贯，我们就为可靠性概率选择一个值，使 $P$ 使 $S$ 更可能。由此推出，没有融贯测度既是导向真理的又是有信息量的。
