      Whatever merits Huemer’s new conditions might have, their standing in the literature is hardly comparable to that of the original conditions. Conditional Independence, for instance, is an extremely powerful and intuitive concept which has been put to fruitful use in many areas in philosophy and computer science, the most spectacular example being the theory of Bayesian networks (Pearl, 1985). Similarly, the Nonfoundationalist condition is still the most widely used—and many would say most natural—way of stating, in the language of probability theory, that a testimony fails to support that which is testified. Thus, it would seem that coherentism is saved at the price of disconnecting it from the way in which probability theory is standardly applied. Roche (2010) criticizes Nonfoundationalism from another perspective. In his view, a close reading of BonJour reveals that the latter requires only that the witness reports lack individual credibility in the sense that $P(A \mid E_i) = 0.5$ and not in the sense of $P(A \mid E_i) = P(A)$, which is the condition we called Nonfoundationalism. Since the former does not entail the latter, coherentists, to the extent that they follow BonJour, need not worry about the joint inconsistency of Conditional Independence, Nonfoundationalism and Coherence Justification. Still, this account of what it means to lack initial credibility is non-standard if taken as a general characterization, and it may in the end be more charitable to interpret BonJour as not having subscribed to it. For an elaboration of this point the reader is referred to Olsson (2005, 65), footnote 4. In later works, BonJour has gradually distanced himself his original coherentist position (e.g., BonJour 1989 and 1999)[^bonjour-1989][^bonjour-1999].
    step1: |-
      无论休默的新条件有何优点，它们在文献中的地位几乎无法与原条件相比。例如，条件独立是一个极其强大而直观的概念，在哲学与计算机科学的许多领域都得到了富有成果的运用，最惊人的例子是贝叶斯网络理论（Pearl, 1985）。同样，非基础主义条件仍然是——许多人会说最自然的——用概率论语言表述“一项证词未能支持所证之事”的最广泛使用的方式。因此，融贯论似乎是以下列代价得救的：把它与概率论的标准应用方式脱钩。罗奇（2010）从另一个角度批评非基础主义。在他看来，仔细阅读邦茹可以发现，后者只要求证人报告在 $P(A \mid E_i) = 0.5$ 的意义上缺乏个别可信性，而非在 $P(A \mid E_i) = P(A)$ 的意义上——后者才是我们称为非基础主义的条件。由于前者不蕴含后者，融贯论者就他们遵循邦茹的程度而言，不必担心条件独立、非基础主义与融贯性证成的联合不一致。尽管如此，如果把这种对“缺乏初始可信性”意味什么的说明当作一般刻画，它却是非标准的，而且最终更宽容的做法是把邦茹解释为并未接受它。关于这一点的详述，读者可参见奥尔森（2005, 65）脚注 4。在后来的著作中，邦茹已逐渐疏远他最初的融贯论立场（例如 BonJour 1989 and 1999）[^bonjour-1989][^bonjour-1999]。
