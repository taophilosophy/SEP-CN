      C. I. Lewis’s definition of coherence, or “congruence” to use his term, can be seen as a refinement and improvement of Ewing’s basic idea. As Lewis defines the term, a set of “supposed facts asserted” is coherent (congruent) just in case every element in the set is supported by all the other elements taken together, whereby “support” is understood not in logical terms but in a probabilistic sense. In other words, $P$ supports $Q$ if and only if the probability of $Q$ is raised on the assumption that $P$ is true. As is readily appreciated, Lewis’s definition is less restrictive than Ewing’s: more sets will turn out to be coherent on the former than on the latter. (There are some uninteresting limiting cases for which this is not true. For instance, a set of tautologies will be coherent in Ewing’s but not in Lewis’s sense, since the probabiity of any tautology is maximal and cannot be raised. These cases are not significant parts of anyone’s actual body of beliefs.)
    step1: |-
      C. I. 刘易斯关于融贯的定义，或按他的用语称为“一致（congruence）”，可以被视为对尤因基本理念的提炼与改进。按刘易斯的定义，一个“被断定的所谓事实”集合是融贯的（一致的），当且仅当集合中每个元素都被其余所有元素合在一起所支持，其中“支持”不是从逻辑意义而是从概率意义上来理解的。换言之，$P$ 支持 $Q$，当且仅当在假定 $P$ 为真的条件下 $Q$ 的概率被提高。不难看出，刘易斯的定义不如尤因的那么严格：按前者，会有更多集合被视为融贯的。（有一些无趣的极限情形并不如此。例如，一个重言式集合在尤因的意义上会是融贯的，但在刘易斯的意义上则不然，因为任何重言式的概率都是极大的，不能被提高。这些情形并不构成任何人的实际信念体中意义重大的部分。）
