      Principle E4 (Data Priority) reveals that Thagard’s theory is not a pure coherence theory, as it gives some epistemic priority to observational beliefs, making it rather a form of weak foundationalism, i.e., the view that some propositions have some initial epistemic support apart from coherence. Moreover, Thagard’s theory is based on binary coherence/incoherence relations, i.e., relations holding between two propositions. His basic theory does not handle incompatibilities that involve, in an essential way, more than two propositions. But incompatibilities of that sort may very well arise, as exemplified by the three propositions “Jane is taller than Martha”, “Martha is taller than Karen” and “Karen is taller than Jane”. Nevertheless, Thagard reports the existence of computational methods for converting constraint satisfaction problems whose constraints involve more than two elements into problems that involve only binary constraints, concluding that his characterization of coherence “suffices in principle for dealing with more complex coherence problems with nonbinary constraints” (Thagard 2000, 19)[^thagard-2000]. Thagard (2009) argues that there is a connection between explanatory coherence and (approximate) truth, where explaining consists in describing causal mechanisms. Several other authors have advocated coherence theories that emphasize the importance of explanatory relations. See, for example, Lycan (1988, 2012) and, for a book-length defense of explanatory coherentism, Poston (2014). Also related to Thagard’s work is Susan Haack’s so-called foundherentist theory, which draws on a proposed analogy between coherence justification (with foundationalist ingredients) and crossword puzzle-solving (Haack, 2009).
    step1: |-
      原则 E4（数据优先性）表明萨加德的理论不是一种纯粹的融贯理论，因为它赋予观察信念某种认识论上的优先性，从而使其毋宁成为一种弱基础主义的形式，即认为某些命题除融贯之外还具有某种初始的认识论支持。此外，萨加德的理论建立在二元的融贯/不相融贯关系之上，即两个命题之间的关系。他的基本理论不处理本质上涉及两个以上命题的不相容。但这类不相容很可能出现，例如这三个命题“简比玛莎高”“玛莎比凯伦高”“凯伦比简高”。尽管如此，萨加德报告说，存在一些计算方法，可以把约束涉及两个以上元素的约束满足问题转化为只涉及二元约束的问题，并总结说他的融贯刻画“原则上足以处理具有非二元约束的更复杂的融贯问题”（Thagard 2000, 19）[^thagard-2000]。萨加德（2009）论证说，解释性融贯与（近似）真理之间存在联系，其中解释在于描述因果机制。还有其他几位作者提倡强调解释关系之重要性的融贯理论。例如见 Lycan (1988, 2012)，关于解释性融贯论的整书辩护见 Poston (2014)。与萨加德的工作相关的还有苏珊·哈克所谓的“基础融贯论”（foundherentism），它借用了融贯性证成（带有基础主义成分）与解填字游戏之间的类比（Haack, 2009）。
