      The impossibility results for coherence draw on all three debates summarized above: the Lewis-BonJour controversy, the debate over probabilistic measures of coherence and also the dispute in *Analysis* regarding truth conduciveness. Before we can discuss the results we need to make one further observation. Given the conclusion of the Lewis-BonJour dispute, it is a reasonable expectation that no coherence measure is truth conducive, in the relevant conditional sense, unless the reports (beliefs, memories etc.) in question are individually credible and collectively independent. See Olsson (2017) for a discussion of the plausibility of these conditions in the original Lewisian context of the justification of memory. But assuming this is not sufficient for coherence to stand a reasonable chance of being truth conducive. We must also require that when we compare two different sets of reports, we do so while keeping the degree of individual credibility fixed. Otherwise, we could have a situation in which one set of report contents is more coherent than another set but still fails to give rise to a higher likelihood of truth simply because the reporters delivering the propositions in the less coherent set are individually more reliable. Thus, truth conduciveness must be understood in a *ceteris paribus* sense. The question of interest, then, is whether more coherence implies a higher probability (given independence and individual credibility) *everything else being equal*. We are now finally in a position to state the impossibility theorems. What they show is that no measure of coherence is truth conducive even in a weak *ceteris paribus* sense, under the favorable conditions of (conditional) independence and individual credibility.
    step1: |-
      关于融贯的不可行性结果借鉴了上述三场争论：刘易斯—邦茹之争、关于概率性融贯测度的争论，以及《分析》中关于导向真理的争论。在讨论这些结果之前，我们需要再作一个观察。鉴于刘易斯—邦茹之争的结论，一个合理的预期是：除非所涉报告（信念、记忆等）各自可信且集体独立，否则没有融贯测度在相关条件意义上是导向真理的。参见奥尔森（2017）对这些条件在原初刘易斯式记忆证成语境中之合理性的讨论。但仅此假定并不足以使融贯有合理机会导向真理。我们还必须要求：当比较两组不同的报告时，我们在保持个别可信度固定的情况下来比较。否则可能出现这样的情况：一组报告内容比另一组更融贯，却仍然不能带来更高的为真可能，仅仅因为给出较不融贯集合中命题的报告者各自更可靠。因此，导向真理必须在*其余条件相同*（ceteris paribus）的意义上来理解。于是，有趣的问题是：更多融贯（在独立与个别可信度给定下）是否意味着更高概率——*其他一切都相同*。我们现在终于可以陈述不可行性定理。它们表明：即使在（条件）独立与个别可信度这些有利条件下，也没有融贯测度是导向真理的，即使在一种弱的*其余条件相同*意义上也是如此。
