      BonJour’s account also raises another general issue. The third criterion stipulates that the degree of coherence increases with the number of inferential connections between different parts of the system. Now as a system grows larger the probability that there will be relatively many inferentially connected beliefs is increased simply because there are more possible connections to be made. Hence, one could expect there to be a positive correlation between the size of a system and the number of inferential connections between the beliefs contained in the system. BonJour’s third criterion, taken at face value, entails therefore that a bigger system will generally have a higher degree of coherence due to its sheer size. But this is at least not obviously correct. A possible modified coherence criterion could state that what is correlated with higher coherence is not the number of inferential connections but rather the inferential *density* of the system, where the latter is obtained by dividing the number of inferential connections by the number of beliefs in the system.
    step1: |-
      邦茹的说明还提出另一个一般性问题。第三判准规定，融贯程度随系统不同部分之间推理联系的数量而增加。现在，随着系统变大，存在相对较多推理上相联的信念的概率增加，原因很简单：可以建立的联系更多了。因此，人们可以预期系统的大小与系统所含信念之间推理联系的数量之间存在正相关。于是，邦茹的第三判准若按字面理解，就蕴含着一个更大的系统因其纯粹规模而一般具有更高的融贯程度。但这至少并非显然正确。一个可能的修改过的融贯判准可以规定：与更高融贯相关的不是推理联系的数量，而是系统的推理*密度*，后者由推理联系的数量除以系统中的信念数量而得到。
