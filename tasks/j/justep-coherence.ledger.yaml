      至于应对不可行性结果的另一进路（质疑其推导所用的前提），我们已经看到，休默（2007, 2011）在刘易斯—邦茹之争的语境中，对以条件概率形式化独立性的标准方式表示过怀疑。因此毫不奇怪，他以同样的理由反对这些不可行性结果（同上）。在他 2011 年的文章中，休默甚至质疑在结果推导中起关键作用的内容决定论题，理由在此我们只好略过。
