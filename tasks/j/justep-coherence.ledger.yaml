      这看起来比循环理论更有希望。如果认识论上的证成在这一意义上是整体性的，那么回溯背后的一项核心假定就确实为假，于是回溯根本不会开始。即便如此，这一整体主义进路提出了许多新问题，融贯论者将需要加以回应。首先，我们需要更清楚地把握融贯概念应用于一个信念系统时涉及什么。这是下一节的主题。其次，一个单一信念仅仅因其是一个得到证成的总体的成员而得到证成，这一主张可以受到质疑，因为一个信念完全可以是某个足够融贯系统的成员，却丝毫不增加该系统的融贯性，例如，如果该信念是唯一一个与原本极为融贯的系统不太契合的成员的话。一个信念当然必须*贡献*于系统的融贯性，才能被该系统证成。换言之，一个特定信念需要*与*它所属的系统*相融贯*，才能被认为得到证成。我们将在第 4 节结合基思·莱勒的认识论工作回到这一问题。最后，我们已经看到，大多数融贯理论赋予某些接近经验的信念一种特殊角色，以避免孤立性与替代系统这两个反驳。这一事实提出了这些特殊信念具有何种地位的问题：它们本身必须具有某种可信性，还是可以完全缺乏可信性？关于这一主题的一个特别清晰的争论，是刘易斯与邦茹之间关于能否从零开始由融贯证成的争论，我们将在第 5 节更仔细地考察它。
