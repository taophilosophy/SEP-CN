      Central in Rescher’s account, as laid out in Rescher (1973), his most influential book on the subject, is the notion of a truth-candidate. A proposition is a truth-candidate if there is something that speaks in its favor. Rescher’s truth-candidates are related to Lewis’s “supposed facts asserted”. In both cases, the propositions of interest are *prima facie* rather than *bona fide* truths. Although Rescher’s 1973 book is entitled *A Coherence Theory of Truth*, the purpose of Rescher’s investigation is not to investigate the possibility of *defining* truth in terms of coherence but to find a truth *criterion*, which he understands to be a systematic procedure for selecting from a set of conflicting and even contradictory truth-candidates those elements which it is rational to accept as *bona fide* truths. His solution amounts to first identifying the maximal consistent subsets of the original set, i.e., the subsets that are consistent but would become inconsistent if extended by further elements of the original set, and then choosing the most “plausible” among these subsets. Plausibility is characterized in way that reveals no obvious relation to the traditional concept of coherence. While the traditional concept of coherence plays a role in the philosophical underpinning of Rescher’s theory, it does not figure essentially in the final product. In a later book, Rescher develops a more traditional “system-theoretic” view on coherence (Rescher 1979)[^rescher-1979].
    step1: |-
      雷谢尔说明的核心，正如他在其关于该主题最有影响的著作雷谢尔（1973）中所述，是真理候选者的概念。一个命题是真理候选者，如果有某种东西为其说话。雷谢尔的真理候选者与刘易斯的“被断定的所谓事实”相关。在两种情形中，所关注的命题都是*初显的*而非*真正的*真理。尽管雷谢尔 1973 年的著作题为《一种真理的融贯理论》，雷谢尔探究的目的却不是考察以融贯来*定义*真理的可能性，而是要找到一种真理*判准*，他把它理解为一种系统性的程序，用于从一组冲突甚至矛盾的真理候选者中挑选出那些理性地接受为*真正的*真理的元素。他的解答在于：先确定原集合的最大一致子集，即那些一致、但若再添加原集合的进一步元素就会变得不一致的子集，然后在这些子集中选择最“合理的”一个。合理性（plausibility）的刻画没有显示出与传统融贯概念的任何明显关联。尽管传统融贯概念在雷谢尔理论的哲学基础中扮演一定角色，它却并不本质地出现在最终产物中。在后来的一本书中，雷谢尔发展出一种更传统的“系统论”的融贯观（Rescher 1979）[^rescher-1979]。
