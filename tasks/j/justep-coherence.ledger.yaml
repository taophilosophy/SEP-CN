      Let us start with responses from the first camp. Dietrich and Moretti (2005) show that coherence in the sense of the Glass-Olsson measure is linked to the practice of indirect confirmation of scientific hypotheses. That measure turns out to be, in the terminology of Moretti (2007), “confirmation conducive”. Glass (2007) argues, similarly, that coherence can provide the key to a precise account of inference to the best explanation, the main idea being to use a coherence measure for ranking competing hypotheses in terms of their coherence with a given piece of evidence. Furthermore, Olsson and Schubert (2007) observe that, while coherence falls short of being truth conducive, it can still be “reliability conducive”, i.e., more coherence, according to some measures, entails a higher probability that the sources are reliable, at least in a paradigmatic case (cf. Schubert 2012a, 2011)[^schubert-2012a]. Nevertheless, Schubert has proved an impossibility theorem to the effect that no coherence measure is reliability conducive in general (Schubert 2012b)[^schubert-2012b]. For yet another example, Angere (2007, 2008) argues, based on computer simulations, that the fact that coherence fails to be truth conducive, in the above sense, does not prevent it from being connected with truth in a weaker, defeasible sense. In fact, almost all coherence measures that have an independent standing in the literature satisfy the condition that *most* cases of higher coherence are also cases of higher probability, although they do so to different degrees. Moreover, Roche (2013b) has demonstrated that assuming a set to be coherent implies an increase in the probability of truth of any of its elements. This is a weak form of truth-conduciveness as this increase may be modest, and Roche is right to point out that it should not give the coherentist much comfort. It has also been noted that coherence plays an important negative role in our thinking. If our beliefs show signs of incoherence, this is often a good reason for contemplating a revision. See chapter 10 in Olsson (2005) for an elaboration of this point and McGrew (2021) for some complications in the context of witness testimony.
