      These concerns do not obviously carry over to another dialectical move: questioning the *ceteris paribus* conditions employed in the impossibility results, i.e., the conditions that determine what to hold fixed as the degree of coherence is varied. This line of criticism has been taken up by several authors, including Douven and Meijs (2007), Schupbach (2008) and Huemer (2011), and it may well be the internally least problematic strategy to explore for those who are inclined to challenge the premises upon which the impossibility results are based. It should be borne in mind, though, that the tendency to offer ever stronger *ceteris paribus* conditions may in the end be self-defeating. As more things are held fixed, it becomes easier for a coherence measure to be truth conducive. Hence, researchers pursuing this line of defense ultimately run the risk of trivializing the debate by making coherence truth conducive by definition (cf. Schubert 2012b)[^schubert-2012b].
    step1: |-
      这些担忧并不明显地转移到另一论辩策略上：质疑不可行性结果所使用的*其余条件相同*条件，即那些决定在融贯度变化时保持什么固定的条件。这一批评路线已被几位作者采纳，包括杜文与迈斯（2007）、舒普巴赫（2008）与休默（2011），而对于那些倾向于质疑不可行性结果之基础前提的人来说，它很可能是内部问题最少的探索策略。不过应当记住，提供越来越强的*其余条件相同*条件的倾向最终可能弄巧成拙。随着越多东西被固定，融贯测度就越容易导向真理。因此，沿着这一辩护路线前进的研究者最终冒着以定义方式使融贯导向真理从而使争论琐碎化的风险（cf. Schubert 2012b）[^schubert-2012b]。
