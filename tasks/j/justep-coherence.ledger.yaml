      $C_1$ and $C_2$ can also be contrasted with regard to their sensitivity to the specificity of the propositions involved. Consider two cases. The first case involves two witnesses both claiming that John committed the crime. The second case involves two witnesses both making the weaker disjunctive claim that John, Paul or Mary committed the crime. Which pair of witnesses are delivering the more coherent set? One way to reason is as follows. Since both cases involve fully agreeing testimonies, the degree of coherence should be the same. This is also the result we get if we apply $C_1$. But one could maintain instead that since the first two witnesses agree on something more specific—a particular individual’s guilt—the degree of coherence should be higher. This is what we get if we apply $C_2$. In an attempt at reconciliation, Olsson (2002) suggested that $C_1$ and $C_2$ may capture two different concepts of coherence. While $C_1$ measures the degree of agreement of a set, $C_2$ is more plausible as a measure of how *striking* the agreement is. See Olsson (2022) for an extended discussion of this point.
    step1: |-
      $C_1$ 与 $C_2$ 也可以在它们对所涉命题之特殊性的敏感度上加以对照。考虑两种情形。第一种情形涉及两位证人都主张约翰犯了罪。第二种情形涉及两位证人都作出更弱的选言主张：约翰、保罗或玛丽犯了罪。哪一对证人给出了更融贯的集合？一种推理方式如下：既然两种情形都涉及完全一致的证词，融贯度应当相同。这也是我们应用 $C_1$ 所得到的结果。但人们可以转而主张：既然前两位证人在更特殊的东西——某个特定个体的罪行——上一致，融贯度应当更高。这正是我们应用 $C_2$ 所得到的结果。为了调和，奥尔森（2002）提出 $C_1$ 与 $C_2$ 可能把握了两种不同的融贯概念：$C_1$ 度量一个集合的一致程度，而 $C_2$ 作为对一致有多*惊人*的度量更为合理。关于这一点的详细讨论，见奥尔森（2022）。
