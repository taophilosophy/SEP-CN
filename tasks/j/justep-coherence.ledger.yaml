      It is fair to say that coherence theorists have yet to reach anything like consensus on how best to define coherence in probabilistic terms. Nevertheless, the debate so far has given rise to a much more fine-grained understanding of what the options are and what consequences they have. The probably most notable result of this debate outside philosophy is the application of probabilistic coherence measures to “topic coherence” in AI, where a topic is viewed as a set of keywords giving the gist of a text (e.g. a blog entry or a newspaper article). Newman et al. (2010) are credited for the idea of the coherence of a topic being a significant factor aiding understanding. However, their article does not refer to the philosophical literature on coherence measures. Ideally, evaluating the coherence of a topic should be automatic. Röder et al. (2015) suggested using known probabilistic coherence measures for this purpose, taking as their point of departure the measures proposed by Bovens and Hartmann (2003), Douven and Meijs (2007), Fitelson (2003), Olsson (2002) and Shogenji (1999). Röder et al. proceed to define the concept of a coherence measures abstractly, and they show that a new measure they construct performs better (in terms of giving rise to a stronger correlation with user assessments of topic coherence) than the above known measures. Returning to philosophy, some quite surprising conclusions can be drawn for epistemological purposes even without philosophers agreeing on how to measure coherence: all we need to assume in order to prove that no coherence measure can be truth conducive, in a sense to be explained, is that those measures respect the aforementioned Content Determination Thesis.
    step1: |-
      可以公正地说，融贯论者尚未就如何以概率术语最好地定义融贯达成任何共识。尽管如此，迄今的争论已使人们更精细地理解有哪些选项及其后果。这一争论在哲学之外最显著的成果，也许是概率性融贯测度在人工智能中“主题融贯”上的应用，其中主题被视为给出文本要旨的一组关键词（例如一篇博客或一篇报纸文章）。纽曼等人（2010）因提出“主题的融贯是促进理解的一个重要因素”这一观念而受到赞誉。然而，他们的文章并未参考关于融贯测度的哲学文献。理想情况下，评估一个主题的融贯应当是自动的。勒德等人（2015）建议为此目的使用已知的概率性融贯测度，其出发点是博文斯与哈特曼（2003）、杜文与迈斯（2007）、菲特尔森（2003）、奥尔森（2002）与将司（1999）提出的测度。勒德等人进而抽象地定义了融贯测度的概念，并表明他们所构造的一个新测度表现优于上述已知测度（在与用户对主题融贯之评估产生更强相关方面）。回到哲学，即使哲学家们未就如何度量融贯达成一致，也能为认识论目的得出一些相当令人惊讶的结论：为了证明没有融贯测度能导向真理（其意义后文说明），我们只需假定这些测度尊重前述内容决定论题。
