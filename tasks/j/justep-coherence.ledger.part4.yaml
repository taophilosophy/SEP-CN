      Keith Lehrer employs the concept of coherence in his definition of justification, which in turn is a chief ingredient in his complex definition of knowledge. According to Lehrer, a person is justified in accepting a proposition just in case that proposition coheres with the relevant part of her cognitive system. This is the relational concept of coherence alluded to earlier. In Lehrer (1990), the relevant part is the “acceptance system” of the person, consisting of propositions to the effect that the subject accepts this and that. Thus, “$S$ accepts that $A$” would initially be in $S$’s acceptance system, but not $A$ itself. In later works, Lehrer has emphasized the importance of coherence with a more complex cognitive entity which he calls the “evaluation system” (e.g., Lehrer 2000 and 2003)[^lehrer-2000][^lehrer-2003]. The starting point of Lehrer’s account of coherence is the fact that we can think of all sorts of objections an imaginative critic may raise to what a person accepts. These objections might be directly incompatible with what that person accepts or they might threaten to undermine her reliability in making assessments of the kind in question. For instance, a critic might object to her claim that she sees a tree by suggesting that she is merely hallucinating. That would be an example of the first sort of objection. An example of the second sort would be a case in which the critic replies that the person cannot tell whether she is hallucinating or not. Coherence, and (personal) justification, results when all objections have been met. Lehrer’s concept of coherence does not seem to have much in common with the traditional concept of mutual support. If one takes it as essential that such a theory make use of a concept of systematic or global coherence, then Lehrer’s theory is not a coherence theory in the traditional sense because, in Lehrer’s view, “[c]oherence … is not a global feature of the system” (1997, 31), nor does it depend on global features of the system (31). Olsson (1999) has objected to this view by pointing out that it is difficult to understand what it means for a belief to fit into a system unless the former does so in virtue of adding to the global coherence of the latter.
    step1: |-
      基思·莱勒在其证成定义中运用融贯概念，而证成又是其复杂知识定义中的主要成分。按照莱勒，一个人有资格（证成地）接受一个命题，当且仅当该命题与她认知系统的相关部分相融贯。这就是前文提到的关系性融贯概念。在莱勒（1990）中，相关部分是人的“接受系统”，由这样的命题组成：主体接受这个那个。于是“$S$ 接受 $A$”起初会在 $S$ 的接受系统中，但 $A$ 本身不在其中。在后来著作中，莱勒强调了与一种更复杂的认知实体相融贯的重要性，他把这种实体称为“评价系统”（例如 Lehrer 2000 and 2003）[^lehrer-2000][^lehrer-2003]。莱勒融贯说明的出发点是：我们可以设想一位富有想象力的批评者对一个人所接受的东西可能提出种种反对。这些反对可能与该人所接受的东西直接不相容，也可能威胁到她在作出此类评估时的可靠性。例如，批评者可能通过提示她只是在幻觉中来反对她“看到一棵树”的主张。这是第一种反对的例子。第二种反对的例子是批评者回应说，该人无法辨别自己是否在幻觉中。当所有反对都得到回应时，就产生了融贯与（个人的）证成。莱勒的融贯概念似乎与传统相互支持概念没有多少共同之处。如果人们把这类理论必须使用某种系统的或整体的融贯概念视为本质，那么莱勒的理论就不是传统意义上的融贯理论，因为按照莱勒的看法，“[融贯]……不是系统的整体特征”（1997, 31），它也不依赖于系统的整体特征（31）。奥尔森（1999）反对这一看法，他指出：除非一个信念因增加后者的整体融贯而契合于系统，否则很难理解“一个信念契合于一个系统”是什么意思。
