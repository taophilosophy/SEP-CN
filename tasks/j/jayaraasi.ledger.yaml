      A typical charge against Jayarāśi’s affiliation to materialists (Cārvāka / Lokāyata), known for two main claims – that there is only one cognitive criterion (pramāṇa), namely perception, and the four elements compose all the universe, including consciousness – would the apparent paradox: Jayarāśi seems to acknowledge neither. This led Bhattacharya (2017: 353–354) to dispute, on philologically implausible grounds, that Jayarāśi refers to Bṛhaspati and the Bṛhaspati-sūtra as his own tradition. However, the earliest external recipients of Jayarāśi’s ideas, the Jaina thinkers Vidyānanda and Anantavīrya, importantly ascribe to Jayarāśi or to his immediate materialist tradition a saying that ‘Bṛhaspati’s aphorisms are primarily meant to refute the opponents with respect to all [issues].’[^note-4] This serves as an external evidence that Jayarāśi did acknowledge the authority of  Bṛhaspati and his aphorisms but interpreted them in the spirit of his own methodological scepticism.
