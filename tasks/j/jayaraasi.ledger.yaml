      > ‘Even [all] such unshakeable reductio arguments (vikalpa) that escaped the attention of the  preceptor of gods (i.e. Bṛhaspati) find their way into this lucid [treatise] that crushes the conceit of charlatans. This [lucid treatise], titled “The Lion [Destroying] the Delusion of Categories”, which contributes to great advantage and will gain excellent reputation, has been composed by [me], the preceptor of deities (gods) [known as] Bhaṭṭa Śrī Jayarāśi.[^note-2] [These] reductio arguments of Jayarāśi [found] in this [treatise] are efficacious in annihilating the charlatans, are elaborated by [Jayarāśi who is] the ocean of knowledge, [and are meant to] vanquish disputants.’
    step1: |-
      > “连天神之师（即 Bṛhaspati）未曾留意的那些无懈可击的归谬论证（vikalpa），也都进入了这部粉碎骗子骄慢的明畅〔论书〕之中。这部明畅的〔论书〕题为‘破诸谛迷妄之狮子’，有助于大利益，将赢得美名，其作者是我——天众之师、名为跋陀室利阇耶罗师的人。[^note-2] 阇耶罗师在此〔论书〕中的这些归谬论证，能够歼灭骗子，由知识之海的〔阇耶罗师〕精心阐述，〔旨在〕降伏论敌。”
    step2: |-
      > “天神之师（即 Bṛhaspati）所未及之诸坚不可摧之归谬论式（vikalpa），亦皆入此碎骗子骄慢之明畅〔论书〕。此明畅之〔论书〕，题曰‘破诸谛迷妄之狮子’，利于大益，且将获令名，其作者则〔我〕——号跋陀室利阇耶罗师之天众之师也。[^note-2] 阇耶罗师此〔书〕中归谬诸论式，足以歼骗子，知识之海之〔阇耶罗师〕所精撰，〔用〕降伏论敌。”
