      There could hardly be a better source of information on the true affiliation of Jayarāśi than the author himself. He nowhere states in his work that he is a Cārvāka / Lokāyata, in which he does not differ from all other Indian authors who nowhere mention their philosophical affiliations in the form: ‘The author of the present work is Buddhist’ or ‘I am a follower of the Nyāya school’. In most cases, such affiliations are communicated through the opening sections, e.g. in the introductory verses (maṅgalâcaraṇa), or in the colophons, but usually an indirect manner, e.g. by paying homage to the Awakened One (buddha) or to a guru or Mahêśvara, or through some other hint, but it is hardly ever done directly, in an unequivocal manner. Unfortunately, the preserved text of Tattvôpaplava-siṁha does not contain any introductory verses (probably there were none). The only concealed information in the opening section of the work could be found the first verse that occurs in the very beginning which says: ‘The worldly path (laukiko mārgaḥ) should be followed…/ With respect to everyday practice of the world (loka-vyavahāra), the fool and the wise are similar’ (TUS, p.1.9–10 = Franco (1987: 68–6–7)  = Solomon (2010: 1–2) = Jha (2013: 2)), quoted from some other source, taken as authoritative by Jayarāśi. The expression ‘the worldly path’ (laukiko mārgaḥ) often occurs as a reference to the Lokāyata (‘the followers of the worldly [practice]’), e.g. by Haribhadra in his ŚVS1.64. Most importantly, however, Jayarāśi on several occasions quotes verses of Bṛhaspati in order to either support his own opinion or to show that there is no disagreement between the Tattvôpaplava-siṁha and the tradition of Bṛhaspati  (cf. Franco (1987: 5)). Further, he explicitly mentions the materialist teacher by name and refers to him with reverence ‘Honourable Bṛhaspati’ (bhagavān bṛhaspatiḥ, TUS, p.45.10–11 = Franco (1987: 228.10)  = Solomon (2010: 229) = Jha (2013: 187)),[^note-1] the reverential term occurring only once in the whole work. This is rather unique, for Jayarāśi does not seem to follow any authorities or to quote passages and opinions which he unreservedly views in favourable light. There can hardly be any doubt, that Jayarāśi placed himself within that tradition and apparently acknowledged that he was originally trained within it.
    step1: |-
      论及阇耶罗师真正归属，没有比作者本人更好的信息来源。他的著作中没有任何地方说他是一个 Cārvāka / Lokāyata；这一点上，他与所有其他印度作者并无不同——印度作者从不以“本书作者是佛教徒”或“我是正理学派信徒”这样的形式标明自己的哲学归属。多数情况下，这类归属是通过开篇部分（例如吉祥偈 maṇgalâcaraṇa）或卷末题记来传达的，而且通常是间接的方式，例如礼敬觉者（buddha）或礼敬一位上师或 Maheśvara，或通过别的暗示；几乎不曾见到直接的、毫不含糊的声明。不幸的是，《谛坏狮子论》传存的文本不含任何吉祥偈（很可能原本就没有）。开篇部分唯一隐藏的线索，可见于最开头的第一颂：“应遵循世俗之道（laukiko mārgaḥ）……/ 就世间日常实践（loka-vyavahāra）而言，愚者与智者相似”（TUS, p.1.9–10 = Franco (1987: 68–6–7) = Solomon (2010: 1–2) = Jha (2013: 2)），此颂是从另一处引来的，而那一处为阇耶罗师所取信。“世俗之道”（laukiko mārgaḥ）这一表述常用作对 Lokāyata（“随顺世间〔实践〕者”）的指称，例如 Haribhadra 在 ŚVS1.64 中就这样用。而最重要的是：阇耶罗师多次引用 Bṛhaspati 的偈颂，或为支持自己的观点，或为表明《谛坏狮子论》与 Bṛhaspati 的传统之间没有分歧（cf. Franco (1987: 5)）。再者，他明确提到这位唯物论师的名字，并怀着敬意称他为“尊者 Bṛhaspati”（bhagavān bṛhaspatiḥ, TUS, p.45.10–11 = Franco (1987: 228.10) = Solomon (2010: 229) = Jha (2013: 187)）[^note-1]——这一敬称在全书中仅出现一次。这相当独特，因为阇耶罗师似乎不遵奉任何权威，也不引用他毫无保留地加以好评的文句与观点。几乎可以肯定：阇耶罗师把自己置于那一传统之内，并且显然承认自己最初是在那一传统中受训的。
    step2: |-
      若问阇耶罗师之真归属，无胜于作者本人之材料。其书未尝一言己为 Cārvāka / Lokāyata，此节与诸印度作者无异——印度作者初不以“此书作者某宗徒也”“我隶正理派”之类自标其属。此类归属，多由开篇（如吉祥偈 maṇgalâcaraṇa）或卷末题记传出，且率用间接之法：礼觉者（buddha）、礼一师、礼 Maheśvara，或以他端微示之；直接而绝无含糊之声明，殆未之见。所憾者：《谛坏狮子论》存文不载吉祥偈（想原本即无）。开首一段，惟一一处隐然可味者，在最前之第一颂：“当行世俗之道（laukiko mārgaḥ）……／若论世间寻常之行事（loka-vyavahāra），愚与智无异”（TUS, p.1.9–10 = Franco (1987: 68–6–7) = Solomon (2010: 1–2) = Jha (2013: 2)）。此颂自他处引来，而他处者，正阇耶罗师所取信也。“世俗之道”（laukiko mārgaḥ）之语，每用为 Lokāyata（“随顺世间〔行事〕者”）之指称，如 Haribhadra 于 ŚVS1.64 之用法。要者尤在：阇耶罗师数引 Bṛhaspati 之颂，或以助己义，或以明《谛坏狮子论》与 Bṛhaspati 之统无所乖（cf. Franco (1987: 5)）。又其显举此唯物论师之名，且敬而称之曰“尊者 Bṛhaspati”（bhagavān bṛhaspatiḥ, TUS, p.45.10–11 = Franco (1987: 228.10) = Solomon (2010: 229) = Jha (2013: 187)）[^note-1]，此敬称通篇惟一遇。此为罕见，盖阇耶罗师若不奉任何权威，亦不引其无所保留而赞许之文句意见。其自处在此统之内，且显然自认初学于此统，殆无可疑。
