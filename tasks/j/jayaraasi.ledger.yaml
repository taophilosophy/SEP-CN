      > [(~*p*→*q*) ∧ ~*q*] → *p*,
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      or like other typical laws of the proof by contradiction, i.e.,
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      > [(~*p*→*q*) ∧ (~*p*→~*q*)] → *p*,
      >
      > [~*p* → (*q*∧~*q*)] → *p*, or
      >
      > [~*p* → (*q*≡~*q*)] → *p* ,
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      seems at first closely mirrored by Jayarāśi. However, his approach is significantly different in one particular aspect. First, Jayarāśi analyses positive theses in order to disprove them. Secondly, the reductio or the proof by contradiction, whereby p is rejected, does not commit one to admitting ~p in the sense of accepting a positive state of affairs contrary to p. Jayarāśi is satisfied merely with a rejection of a thesis, without postulating his own solution to a problem. In other words, when Jayarāśi disproves thesis T by demonstrating that its conclusions C₁, C₂, C₃, … Cₙ are all wrong (either false or doctrinally inadmissible), he does not commit himself to the contrary thesis ~T with some kind of ontological entailment. The better way to describe his method would be the following patterns:
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      > [(*p*→*q*) ∧ ~*q*] → ~*p*,
      >
      > [(*p*→*q*) ∧ (*p*→~*q*)] → ~*p*,
      >
      > [*p* → (*q*∧~*q*)] → ~*p*, or
      >
      > [*p* → (*q*≡~*q*)] → ~*p* ,
    step1: TBD
    step2: TBD
