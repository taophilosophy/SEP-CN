      Jayarāśi may be arguably claimed to represent what has been once labelled epistemological scepticism, or ontological scepticism (Hankinson 1995, 13ff)[^hankinson-1995], i.e., the position in which one refuses to accept the truth of some proposition or to affirm the existence of something, without denying it, as distinguished from negative (ontological) dogmatism, i.e., the attitude in which one actually rejects the truth of some proposition and denies the existence of the alleged objects. Further, Jayaraśi’s qualified methodological scepticism should not be confused with what is covered by the term e.g. in the case of Descartes’ approach to seek ultimately firm foundations after all beliefs liable to doubt have been successfully eliminated. Jayarāśi seeks neither ultimate foundations for his system or firm basis for his epistemology, ontology or ethics, because he never, even vaguely, intimates he would have any. He is satisfied with demonstrating that all we, the philosophers, have so far established, does not hold. But contrary to Descartes’ methodological scepticism, Jayarāśi does not really cast doubt on what comes to us from the senses.
    step1: |-
      可以说，阇耶罗师代表了一种曾被称作认识论怀疑主义或本体论怀疑主义的立场（Hankinson 1995, 13ff）[^hankinson-1995]，即：不接受某个命题的真、不肯定某个东西的存在，但也不否认它；这与否定的（本体论）独断论不同——后者实际拒绝某命题的真，并断言所谓对象不存在。此外，阇耶罗师那种有保留的方法论怀疑主义，不应与笛卡尔式进路所包含的内容相混淆：笛卡尔在成功地消除了所有可疑的信念之后，寻求最终稳固的基础。阇耶罗师既不为其体系寻求终极基础，也不为其认识论、本体论或伦理学寻求可靠根据，因为他甚至从未含糊地暗示自己会有这样的东西。他满足于表明：我们这些哲学家迄今所建立的一切，都不成立。但与笛卡尔的方法论怀疑主义相反，阇耶罗师并不真的对我们由感官得来的东西提出怀疑。
    step2: |-
      得言阇耶罗师之所表，即旧时所谓认识论怀疑主义、或本体论怀疑主义（Hankinson 1995, 13ff）[^hankinson-1995]：不许一命题之真、不判一物之有，而亦不非之；此与否定之（本体论）独断异——独断者实斥命题之真、断言所谓对象之无。又阇耶罗师有保留之方法论怀疑，不得与笛卡尔进路之所含相乱：笛卡尔尽祛可疑之信念而后求至固之基。阇耶罗师于己系统不求终极之基，于认识论、本体论、伦理学亦不求坚固之本，以其未尝微露己当有之也。所乐道者，惟吾曹哲学家素之所建者皆不立而已。然与笛卡尔之方法论怀疑相反，阇耶罗师于吾人自感官而至者，实不置之疑。
