      As little as we know of the exact dates of his life even less we know about the place where he flourished, and we are actually left to speculations, for no hard evidence, such as inscriptions etc., can be found to help us. There are three points that might suggest Jayarāśi was of South India, all being rather weak. The strongest evidence is the circulation and reception of the Tattvôpaplava-siṁha: the first mention of the work is made by South Indian Digambara authors Vidyānanda (c. 850) and Anantavīrya (turn of 10th and 11th centuries). Another equally weak piece of evidence is that Jayarāśi’s critical method of argument (see below), which the Jainas adopt, first penetrates the works of South Indian Digambara authors, incidentally the same who are the first to make reference to Jayarāśi. This method of critique becomes the standard one among Gujarati Jainas only at a later stage. The third argument in favour of South Indian origin of Jayarāśi (Saṁghavī–Pārīkh 1940, xi)[^saṁghavī-1940], even weaker that the two above, is his title Bhaṭṭa, regularly appended to the names of a number of South Indian philosophers and often used as an official title of South Indian Digambara high rank clerics (bhaṭṭa, bhaṭṭāraka). Jayarāśi’s title might suggest he was both South Indian and a Brahmin by social class (varṇa). However, the title Bhaṭṭa is not exclusively used by Brahmins or exclusively in South India, though there is indeed a certain tendency of this kind. However, since there seems nothing at all to suggest that Jayarāśi was born in North India, even such slight hints gain some evidential weight.
    step1: |-
      我们对他确切生卒年代的了解既如此之少，对他活跃之地的了解就更少了，实际上只能付诸推测：碑铭之类的硬证据，一概找不到，无从借力。有三点或可暗示阇耶罗师出于南印度，但都相当薄弱。最强的证据是《谛坏狮子论》的流传与接受：最早提及此书的，是南印度天衣派作者毗提耶难陀（约 850）与阿难陀维罗（十、十一世纪之交）。另一条同样薄弱的证据是：阇耶罗师的批判论证方法（见下文）——即耆那教徒所采用的那种方法——最先渗透进南印度天衣派作者的著作，而这些人恰好也是最早指涉阇耶罗师的人。这种批判方法要到更晚的阶段才成为古吉拉特耆那教徒中的标准方法。第三个有利于阇耶罗师南印度出身的论证（Saṁghavī–Pārīkh 1940, xi）[^saṁghavī-1940]，比上述两条更弱，是他的称号“跋陀”（Bhaṭṭa）：这一称号经常缀于若干南印度哲学家名字之后，并且常用作南印度天衣派高层僧侣的正式头衔（bhaṭṭa、bhaṭṭāraka）。阇耶罗师的称号或可暗示：他既是南印度人，又按社会等级（varṇa）属婆罗门种姓。然而，“跋陀”这一称号并非婆罗门所专用，也并非南印度所专用，尽管确实存在某种这类倾向。不过，既然似乎完全没有东西暗示阇耶罗师生于北印度，这些微弱的暗示也就获得了一定的证据分量。
    step2: |-
      其确切年代吾人所知既鲜，其活跃之地所知尤尠，实际惟付诸测度：碑铭之属，硬证全无，无可借力。有三点或可暗示阇耶罗师出于南印度，而皆甚弱。最强之证，为《谛坏狮子论》之流传与受容：首提此书者，南印度天衣派作者毗提耶难陀（约 850）与阿难陀维罗（十、十一世纪之交）也。另一证之弱与此相等者：阇耶罗师之批判论证之法（见下文）——即耆那教徒所采者——先入南印度天衣派作者之书，而此辈适为最早指涉阇耶罗师之人。此批判之法，至晚后之期，始为古吉拉特耆那教徒之常法。其三，利于阇耶罗师南印度出身之论证（Saṁghavī–Pārīkh 1940, xi）[^saṁghavī-1940]，又弱于上二者：其号“跋陀”（Bhaṭṭa）——此号常缀于若干南印度哲人名后，且常用为南印度天衣派高阶僧侣之正式头衔（bhaṭṭa、bhaṭṭāraka）。阇耶罗师之号，或暗示其人为南印度人，且依种姓（varṇa）为婆罗门。然“跋陀”之号非婆罗门所专，亦非南印度所专，惟此倾向固有之。虽然，既似全无一事暗示阇耶罗师生于北印度，则此微末之暗示，亦稍得证据之重。
