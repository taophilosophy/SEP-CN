      To give an example, Jayarāśi first skillfully demonstrates that the universal cannot exist by mentioning three possible conclusions: If (T) the universal exists, then (C₁) the universal is different from the individuals in which it is instantiated, (C₂) it is not different from the individuals, or (C₃) it is different from the individuals in some aspects and it is not different from the individuals in other aspects. Each of these options is then analysed into further options, all being eventually shown as wrong or impossible. Since all the three conclusions C₁, C₂ and C₃ are rejected, the initial thesis T (‘the universal exists’) is also rejected. However, he does not say what at all exists, if there are no universals.
    step1: TBD
    step2: TBD
