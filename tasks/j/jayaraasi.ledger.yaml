      He demonstrates that no one so far has offered an irrefutable definition of perception (which does not have to mean that perception as such has to be completely unreliable). All definitions of perception are seriously flawed and we cannot rely on it in the way it is defined: we do not have even a reliable method or a dependable criterion to distinguish a genuine perception from a mirage, optical illusion or a mental image (e.g. in hallucination, reminiscence or dream). However, Iit is not the case that Jayarāśi argues that ‘there is simply no way … to know that our sense-perceptions are true’ (King 1999: 19)[^king-1999]. What he is up to is to demonstrate that, given our present definitions of perception and categories on which our epistemology rests, there is no way to determine which of our sense-perceptions are true.
    step1: |-
      他表明：至今无人提出过一个不可驳倒的知觉定义（这并不必然意味着知觉本身完全不可靠）。一切知觉定义都有严重缺陷，我们无法按其所被定义的方式依赖知觉：我们甚至没有可靠的方法或可依赖的判准，把真正的知觉与阳焰、视错觉或心中影像（例如幻觉、回忆或梦）区分开来。但情形并非如此：阇耶罗师并没有主张“我们根本无法……知道我们的感官知觉是真的”（King 1999: 19）[^king-1999]。他所要做的，是表明：以我们现今关于知觉的定义、以及我们认识论所依赖的范畴而言，无从判定我们的哪些感官知觉是真的。
    step2: |-
      其所示者：知觉之定义，迄今无有一不可破者（此不必谓知觉自身全不可恃）。凡知觉定义大疵皆具，吾人不得即其所定义者而赖之：即一真正知觉之区别于阳焰、视幻、心象（如幻觉、追忆、梦幻），并无可靠之法或可恃之准。然非谓阇耶罗师主张“吾人绝无由……知感官知觉之为真”（King 1999: 19）[^king-1999]。其所为，在示：即吾人今之知觉定义，及吾人认识论所赖之范畴而论，吾人何者感官知觉为真，无从判定。
