      ### 2.1 Use of Reductio Arguments
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      The point of departure of his methodology is a sophisticated and highly elaborated reductio type of argument (prasaṅga), developed earlier within the Madhyamaka school of Buddhism and its prominent adherent Nagārjuna (c. 150 CE).
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      In his method, Jayarāśi analyses a particular thesis T of his opponent by, first, listing all logical implications or all doctrinally possible conclusions C₁, C₂, C₃, … C_{*n*}, admissible within the opponent’s system, that follow from thesis T. Then he demonstrates how and why each of such conclusions C₁, C₂, C₃, … C_{*n*} either leads to an undesired consequence (logically problematic or unwelcome within the opponent’s system) or contradicts the initial thesis T:
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      > | (1) | T → C₁ ∧ C₂ ∧ C₃ ∧ … ∧ C_{*n*} |
      > | --- | --- |
      > | (2) | \|C₁\| = 0 \|C₂\| = 0 \|C₃\| = 0 … \|C_{*n*}\| = 0 |
      > | (3) | \|T\| = 0 |
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      where ‘0’ stands not simply for ‘false’ (logically), but may also stand for ‘not admissible within the opponent’s specific set of beliefs’, or ‘not compatible with the opponent’s specific set of beliefs’. To analyse the truth value or admissibility of each of the conclusions C₁, C₂, C₃, … C_{*n*}, if their structure is complex, Jayarāśi analyses the conclusions in their turn using exactly the same method.
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      What may look like a well-known logical law that underlies the reductio ad absurdum argument, i.e.,
    step1: TBD
    step2: TBD
  - id: 39
