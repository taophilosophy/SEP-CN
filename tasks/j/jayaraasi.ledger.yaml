      于是，另一组研究者（例如 Koller (1977)、Matilal (1985: 482)、Matilal (1986: 27)、Solomon (2010: xvi)、Jha (2013: vii)、Gokhale (2015: 156–157)、Mills (2018)）把阇耶罗师归类为怀疑论者——或宽松地隶属 Cārvāka / Lokāyata 传统，或全不隶属；甚至有人把他当作反宗教的怀疑论者（Matilal (1985: 482)）、彻底的怀疑论者（Franco (1987: 3–8)）、“印度怀疑论的充分形态”（Solomon (2010: xvi)）、代表“价值领域中一种无政府主义”的极端怀疑论者（Gokhale (2015: 180, 155)）；有时也把他当作不可知论者（Ruben (1958)；Matilal (1985: 483, n. 10)），或二者兼而有之，说他是“一部为怀疑论、顶好也是为不可知论辩护的著作的作者”（Debiprasad Chattopadhyaya 为 Chattopadhyaya–Gangopadhyaya (1990: xiv) 所加“编者按”）。关于阇耶罗师的归属，K.K. Dixit（1962: 103）/（1990: 529）持一相当异常立场：他主张阇耶罗师既是唯物论者，又是……“非逻辑的崇拜者”（原文如此！）。
