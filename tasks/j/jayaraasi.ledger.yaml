      Of significance is that Vidyānanda puts Jayarāśi on par with the Buddhist doctrine of Emptiness (śūnya-vāda), as represented by Nāgārjuna, and with Vedāntic idealists (brahma-vāda), as three kinds of self-refuting theories (TŚVA 80.22–81.14; 195.14–16). This might theoretically be taken as evidence that all three represented scepticism. However, since there is no hint that Vedāntic idealists were sceptics at all at that time,[^note-5] and we have strong evidence that Jayarāśi was not a sceptic, what Mills (2018) takes to be the three pillars of skepticism in classical India, namely Nāgārjuna, Jayarāśi and Śriharṣa, represented here by a forerunner, cannot be classified as sceptics, despite their commonalities, as noticed by Vidyānanda.
    step1: |-
      值得注意的是，毗提耶难陀把阇耶罗师与以龙树为代表的佛教空论（śūnya-vāda）、以及吠檀多的唯心论者（brahma-vāda）并列为三种自毁的理论（TŚVA 80.22–81.14; 195.14–16）。在理论上，这可以当作三者皆属怀疑论的证据。然而，既然没有任何迹象表明当时的吠檀多唯心论者是怀疑论者，[^note-5] 而我们又有强有力的证据表明阇耶罗师不是怀疑论者，那么 Mills（2018）所举古典印度怀疑论的三根支柱——龙树、阇耶罗师与室利诃奢（此处由一位先驱者代表）——尽管如毗提耶难陀所察觉的那样有种种共通之处，却都不能归类为怀疑论者。
    step2: |-
      可注意者：毗提耶难陀置阇耶罗师与佛教空宗（śūnya-vāda，龙树所表）、吠檀多唯心之伦（brahma-vāda）并列，为三种自毁之说（TŚVA 80.22–81.14; 195.14–16）。此于理论上可引为三者皆怀疑论之证。然既无丝毫之证谓当时吠檀多唯心者为怀疑论者，[^note-5] 又有坚证谓阇耶罗师非怀疑论者，则 Mills（2018）所举古印度怀疑论之三柱——龙树、阇耶罗师、室利诃奢（此处以一先驱者当之）——虽有毗提耶难陀所察之共通处，终不得列为怀疑论者。
