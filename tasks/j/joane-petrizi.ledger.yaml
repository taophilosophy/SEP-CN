      Petrizi’s commentary on Proclus’s *Elementatio theologica* consists of a Preface (Introduction) and the commentaries on each chapter of this work. In Sh. Nutsubidze and S. Kaukhchishvili’s edition of Petrizi’s *Proclus Commentary*, these commentaries are followed by an epilogue (Petrizi, *Opera II*).
    step1: |-
      佩特里齐对普罗克洛斯《神学要素论》的评注由一篇序言（导论）和对该著作各章的评注构成。在 Sh. Nutsubidze 与 S. Kaukhchishvili 编辑的佩特里齐《普罗克洛斯评注》版本中，这些评注之后附有一篇结语（Petrizi, *Opera II*）。
    step2: |-
      佩特里齐评注普罗克洛斯《神学要素论》的著作，由一篇序言（导论）与对全书各章的评注构成。在 Sh. Nutsubidze 与 S. Kaukhchishvili 整理编辑的佩特里齐《普罗克洛斯评注》中，这些评注之后还附有一篇结语（Petrizi, *Opera II*）。
