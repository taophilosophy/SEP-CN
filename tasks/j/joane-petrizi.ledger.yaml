      Joane Petrizi is the most widely read Georgian philosopher. All of the works (both translations and commentaries) definitively attributed to Petrizi were originally written by him in 11-12th century Georgian. Petrizi’s *Proclus Commentary* with his Georgian translation of the *Elementatio theologica* had a major influence not only on Georgian philosophy and culture, but also outside of Georgia. In 1248, the Armenian monk Svimeon translated Petrizi’s Proclus work into Armenian, thus contributing to the dissemination of the philosophy of Proclus there. In the 17ᵗʰ century, Armenian philosophers devoted intensive work to Proclus’s thought, which they regarded as relevant to philosophy in their own time; in 1651, the Armenian bishop Svimeon Dshughaezi wrote commentaries to facilitate the understanding of the *Elementatio theologica*. The basis for his commentary was the 13ᵗʰ-century Armenian translation by the monk Svimeon of Petrizi’s Georgian translation (Khidasheli 1956, Marr 1909)[^khidasheli-1956][^marr-1909].
    step1: |-
      乔安·佩特里齐是读者最广的格鲁吉亚哲学家。所有确定归于佩特里齐名下的著作（无论翻译还是评注），原本都以 11 至 12 世纪的格鲁吉亚语写成。佩特里齐的《普罗克洛斯评注》连同他对《神学要素论》的格鲁吉亚语翻译，不仅对格鲁吉亚的哲学与文化，也对格鲁吉亚之外产生了重大影响。1248 年，亚美尼亚修士斯维梅翁（Svimeon）将佩特里齐的普罗克洛斯著作译为亚美尼亚语，从而促进了普罗克洛斯哲学在那里的传播。17 世纪，亚美尼亚哲学家倾注大量精力研究普罗克洛斯的思想，认为它与他们自己时代的哲学相关；1651 年，亚美尼亚主教斯维梅·朱加耶齐（Svimeon Dshughaezi）撰写评注以便利《神学要素论》的理解。其评注的底本，是修士斯维梅翁 13 世纪对佩特里齐格鲁吉亚语译本的亚美尼亚语翻译（Khidasheli 1956, Marr 1909）[^khidasheli-1956][^marr-1909]。
