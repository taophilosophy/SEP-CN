      Petrizi names the philosophers whom he treated in his *Interpretation*: Orpheus, Parmenides, Zeno, Plato, Aristotle, Alexander of Aphrodisias, Porphyry and the Fathers of the Church (Petrizi, *Opera I*, pp. XXVI–LII; Alexidse 1997). He held Platonic philosophy in particularly high esteem. Its representatives included in his view both Plato’s predecessors (Orpheus, Pythagoras, etc.) and the neo-Platonists. He calls Plato “the philosopher of the day” (Petrizi, *Opera I*, p. XXVII). When Petrizi speaks of the ‘philosopher’, he means Proclus. By contrast, in the Latin Middle Ages, the designation *philosophus* was reserved for Aristotle (Tevzadze 2006)[^tevzadze-2006].
    step1: |-
      佩特里齐在《诠释》中列举了他所论及的哲学家：俄耳甫斯（Orpheus）、巴门尼德（Parmenides）、芝诺（Zeno）、柏拉图、亚里士多德、阿弗罗狄西亚的亚历山大（Alexander of Aphrodisias）、波菲利（Porphyry）以及教父们（Petrizi, *Opera I*, pp. XXVI–LII; Alexidse 1997）。他特别推崇柏拉图哲学。在他看来，柏拉图哲学的代表既包括柏拉图的前辈（俄耳甫斯、毕达哥拉斯等），也包括新柏拉图主义者。他称柏拉图为“当今的哲学家”（Petrizi, *Opera I*, p. XXVII）。当佩特里齐说起“哲学家”时，他指的是普罗克洛斯。相比之下，在拉丁中世纪，*philosophus*（哲学家）这一称号是专属于亚里士多德的（Tevzadze 2006）[^tevzadze-2006]。
    step2: |-
      佩特里齐在《诠释》中列出了他所论及的哲学家：俄耳甫斯（Orpheus）、巴门尼德（Parmenides）、芝诺（Zeno）、柏拉图、亚里士多德、阿弗罗狄西亚的亚历山大（Alexander of Aphrodisias）、波菲利（Porphyry）以及教父们（Petrizi, *Opera I*, pp. XXVI–LII; Alexidse 1997）。他对柏拉图哲学尤为崇敬。在他看来，柏拉图哲学的代表人物既包括柏拉图的前辈（俄耳甫斯、毕达哥拉斯等），也包括新柏拉图主义者。他称柏拉图为“当今的哲学家”（Petrizi, *Opera I*, p. XXVII）。当佩特里齐言及“哲学家”时，他指的正是普罗克洛斯。相比之下，在拉丁中世纪，*philosophus*（哲学家）这一称号却是专为亚里士多德保留的（Tevzadze 2006）[^tevzadze-2006]。
