      Although Joane Petrizi’s work received increasing attention in the course of time and Georgian thinkers always emphasized his intellectual heritage, a thorough-going scholarly treatment of Petrizi’s works only really began in the 20ᵗʰ century. Without a doubt, the most important stage in Petrizi research is represented by the publication of a scholarly edition of Petrizi’s philosophical works. The edition began in 1937 with the publication of the second volume of Petrizi’s Proclus work—the *Intertpretation of the “Elementatio theologica” of Proclus*. This volume was edited by Sh. Nutsubidze and S. Kaukhchishvili; it includes a comprehensive and valuable study of Petrizi’s philosophy in which the teaching of the Georgian philosopher is viewed as reflected by his contemporaries and analysed with reference to Byzantine and Georgian medieval thought (cf. Petrizi 1984).
    step1: |-
      尽管乔安·佩特里齐的著作随时间推移受到越来越多的关注，格鲁吉亚思想家也始终强调他的思想遗产，但对佩特里齐著作的彻底的学术处理直到 20 世纪才真正开始。毫无疑问，佩特里齐研究最重要的阶段，是佩特里齐哲学著作学术版的出版。这一版本工作始于 1937 年佩特里齐普罗克洛斯著作第二卷的出版，即《普罗克洛斯〈神学要素论〉诠释》。该卷由 Sh. Nutsubidze 与 S. Kaukhchishvili 编辑；其中包括一项对佩特里齐哲学的全面而有价值的研究：格鲁吉亚哲学家的学说被置于其同时代人的反响之中来考察，并参照拜占庭与格鲁吉亚中世纪思想加以分析（cf. Petrizi 1984）。
    step2: |-
      尽管乔安·佩特里齐的著作日渐受到关注，格鲁吉亚思想家也一向推重其思想遗产，但对佩特里齐著作真正的学术研究，直到 20 世纪才起步。毫无疑问，佩特里齐研究最重要的里程碑，是佩特里齐哲学著作学术版的刊行。这项版本工作始于 1937 年佩特里齐普罗克洛斯著作第二卷的出版，即《普罗克洛斯〈神学要素论〉诠释》。该卷由 Sh. Nutsubidze 与 S. Kaukhchishvili 编辑；卷内附有一篇全面而有价值的佩特里齐哲学研究：这位格鲁吉亚哲学家的学说，既被置于其同时代人的反响之中来观照，也参照拜占庭与格鲁吉亚中世纪思想来分析（cf. Petrizi 1984）。
