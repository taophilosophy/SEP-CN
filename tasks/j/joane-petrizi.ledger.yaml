      善是存在本身的原型，而存在作为它的影像，也通过分有善而在宇宙中获得其地位。之所以如此，是因为善与太一的同一。既然一切存在者都只是凭借对太一的分有才显现，而太一就其自身而言是纯粹的善，善也就被视为宇宙的终极本原与超单纯的参照点。为了刻画善，佩特里齐援引并使用了柏拉图《斐德罗》中的原则，处理善的各种等级。首要的善居于善的顶端，其后跟着善的各种层级。善也被视为存在的秩序与结构的原则。最先与之联结的东西具有*善本身*的痕迹，最初的单子也具有这样的本性。恰恰在这些最初的存在者中，美与善被找到（Petrizi, *Opera II*, prop. 8, p. 34）。
