      According to authoritative reports, Petrizi translated Nemesius of Emesa’s work *On the Nature of Man* into Georgian (Petrizi, *Opera II*, p. 223). Petrizi apparently encountered numerous difficulties and obstacles put in his way by both Greeks and Georgians in his work. Based on the current state of research and his biography, together with a detailed study of his Proclus Commentary, Petrizi can be characterized as a 12ᵗʰ-century thinker. The character of Georgian thought in the 12ᵗʰ century is manifested in his style of philosophizing and in his manner of presenting arguments, as well as in his knowledge of ancient philosophy and in his intellectual interest in maintaining ancient thought in its rightful place (Tevzadze 1996, pp. 181–249)[^tevzadze-1996].
    step1: |-
      根据权威的记载，佩特里齐将尼梅西乌斯的著作《论人的本性》译为格鲁吉亚语（Petrizi, *Opera II*, p. 223）。显然，佩特里齐在其工作中遇到了希腊人与格鲁吉亚人给他设置的重重困难与阻碍。基于当前的研究状况与他的生平，再结合对他的普罗克洛斯评注的详细研究，佩特里齐可以被刻画为一位 12 世纪的思想家。12 世纪格鲁吉亚思想的特性，表现在他的哲学化风格与论证呈现方式上，也表现在他对古代哲学的知识以及他让古代思想保有应有一定之位的智识兴趣上（Tevzadze 1996, pp. 181–249）[^tevzadze-1996]。
    step2: |-
      根据权威记载，佩特里齐将尼梅西乌斯的著作《论人的本性》译成了格鲁吉亚语（Petrizi, *Opera II*, p. 223）。显然，佩特里齐在这项工作中遇到了希腊人与格鲁吉亚人给他设置的重重困难与阻碍。基于当前的研究状况与他的生平，再加上对《普罗克洛斯评注》的细致研究，可以把佩特里齐刻画为一位 12 世纪的思想家。12 世纪格鲁吉亚思想的品格，既体现在其哲思风格与论证呈现方式上，也体现在他对古代哲学的通晓，以及他欲使古代思想保有应然地位的智识旨趣上（Tevzadze 1996, pp. 181–249）[^tevzadze-1996]。
