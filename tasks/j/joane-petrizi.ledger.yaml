      To date there is no reliable information on Petrizi’s dates and biography. According to older Georgian research, he lived in the second half of the 11ᵗʰ century and the first half of the 12ᵗʰ century. More recent research, however, tends to date him to the second half of the 12ᵗʰ century. The state of research has been adversely affected by the lack of information on Petrizi (cf. Zakaradze 2011, pp. 125–132)[^zakaradze-2011]. The little personal information that is known about him stems from remarks scattered through his works in which Petrizi briefly speaks about himself. In his Proclus commentary—the *Interpretation of the Elementatio theologica of Proclus*—and in the *Postscript*, which is traditionally ascribed to him, the author mentions his own cares and problems (cf. Tschelidze 1994, pp. 113–126, Tschelidze 1995, pp. 125–132)[^tschelidze-1994][^tschelidze-1995].
    step1: |-
      迄今为止，关于佩特里齐的生卒年代与生平，尚无可靠的信息。根据较早的格鲁吉亚研究，他生活在 11 世纪后半叶与 12 世纪前半叶。然而，较新的研究倾向于将他定年在 12 世纪后半叶。关于佩特里齐信息的缺乏，对研究状况造成了不利影响（cf. Zakaradze 2011, pp. 125–132）[^zakaradze-2011]。关于他个人的少量已知信息，来自散见于其著作中的评论，佩特里齐在其中简要地谈到自己。在他的普罗克洛斯评注——《普罗克洛斯〈神学要素论〉诠释》（*Interpretation of the Elementatio theologica of Proclus*）——以及传统上归于他名下的《后记》（*Postscript*）中，作者提到了自己的忧虑与问题（cf. Tschelidze 1994, pp. 113–126, Tschelidze 1995, pp. 125–132）[^tschelidze-1994][^tschelidze-1995]。
    step2: |-
      迄今为止，关于佩特里齐的生卒年代与生平，尚无可靠信息。根据较早的格鲁吉亚研究，他生活在 11 世纪后半叶至 12 世纪前半叶；然而，较新的研究倾向于将他定年在 12 世纪后半叶。佩特里齐相关信息的匮乏，使研究状况受到不利影响（cf. Zakaradze 2011, pp. 125–132）[^zakaradze-2011]。关于他本人的点滴已知信息，源自散见于其著作中的评语——佩特里齐在其中简要谈及自己。在他的普罗克洛斯评注——《普罗克洛斯〈神学要素论〉诠释》（*Interpretation of the Elementatio theologica of Proclus*）——以及传统上归于他名下的《后记》（*Postscript*）中，作者提到了自己的忧虑与难题（cf. Tschelidze 1994, pp. 113–126, Tschelidze 1995, pp. 125–132）[^tschelidze-1994][^tschelidze-1995]。
