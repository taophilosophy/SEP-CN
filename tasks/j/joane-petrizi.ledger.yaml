      Petrizi treats the problem of the cause and the caused from various perspectives, for the treatment of this topic proved to be of fundamental importance for the logical structure of his philosophical project. In Proposition 30, he treats the traditional view of the dialectic of causality in detail, examining the etymological meanings of the terms characteristically used in Greek for this relationship (Petrizi, *Opera II*, prop. 30, pp. 79–81). The dialectic of causality becomes manifest in the process of the descent from the One to the Many and the ascent from the Many to the One. The cause is the phase within the entirety of emanation that generates, that which thus has priority both in ontological and axiological terms vis-à-vis the caused inasmuch as in the neo-Platonic system of generation the generator is better than the generated.
    step1: |-
      佩特里齐从多个视角处理原因与被产生者的问题，因为对这一论题的处理，已被证明对他的哲学方案的逻辑结构具有根本性的重要意义。在命题 30 中，他详细讨论了因果性辩证法的传统观点，考察了希腊语中用来表示这种关系的那些特有术语的词源含义（Petrizi, *Opera II*, prop. 30, pp. 79–81）。因果性的辩证法在从太一下降到多、又从多上升到太一的进程中显露出来。原因是流溢整体中实施生成的那一环节，因而在存在论与价值论两方面都相对于被产生者具有优先性，因为在新柏拉图主义的生成体系中，生成者优于被生成者。
    step2: |-
      佩特里齐从多个视角处理原因与被产生者的问题，因为事实证明，这一论题的处理对于其哲学事业的逻辑结构具有根本意义。在命题 30 中，他细致讨论了因果性辩证法的传统观点，考察希腊语中惯常用来表达这层关系的那些术语的词源含义（Petrizi, *Opera II*, prop. 30, pp. 79–81）。因果性的辩证法，在从太一下降为多、又从多上升到太一的进程中得以显露。原因，是流溢整体之中实施生成的那一环节；无论在存在论还是价值论上，它都优先于被产生者——因为在新柏拉图主义的生成体系中，生成者优于被生成者。
