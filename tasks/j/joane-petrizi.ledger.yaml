    source: |-
      Joane Petrizi (12ᵗʰ century)—the most significant Georgian medieval philosopher—devoted intensive work to neo-Platonic philosophy. He translated Nemesius of Emesa’s *On the Nature of Man* into Georgian, a work which in that day attracted considerable attention. Of particular importance is his Georgian translation of Proclus’s *Elementatio theologica*, on which he also wrote a step-by-step commentary. Petrizi’s commentary on the *Elementatio theologica* represents a significant effort at reception inasmuch as the Georgian philosopher interprets the work immanently, that is, on the basis of Proclus’s philosophy itself. Therefore, he definitely deserves to receive increased attention in presentations and reconstructions of the philosophy of Proclus, and especially in research on medieval Proclus commentaries. Up to now, the standard editions of the *Elementatio theologica* only mention Petrizi’s Proclus work in passing (if at all), or even criticize it unjustly (Dodds 1963, pp. xli–xlii, 343; cf. in more detail Iremadze 2004a, pp. 225–231)[^dodds-1963][^iremadze-2004a]. Research on the Georgian translation and interpretation of the *Elementatio theologica* in the context of Byzantine and Latin Proclus interpreters—Nicholas of Methone (12ᵗʰ century), Berthold of Moosburg (14ᵗʰ century), Henry Bate of Mechelen (13ᵗʰ century)—will close this gap in Proclus research (cf. Mojsisch 2002, pp. 175–182)[^mojsisch-2002]. Furthermore, the reception of Proclus by Byzantine philosophers of the 11ᵗʰ and 12ᵗʰ centuries (Psellos, Italos) should not be overlooked (cf. Jeck 2010, Jeck 2017, pp. 243–270)[^jeck-2010][^jeck-2017].
    step1: |-
      乔安·佩特里齐（Joane Petrizi，12 世纪）——最重要的格鲁吉亚中世纪哲学家——将大量精力投入新柏拉图主义哲学。他把埃美萨的尼梅西乌斯（Nemesius of Emesa）的《论人的本性》（*On the Nature of Man*）译为格鲁吉亚语，这部著作在当时引起了相当大的关注。尤其重要的是他对普罗克洛斯（Proclus）《神学要素论》（*Elementatio theologica*）的格鲁吉亚语翻译，他还为此撰写了一部逐条评注。佩特里齐对《神学要素论》的评注代表了一项重要的接受工作，因为这位格鲁吉亚哲学家以内在于该著作自身的方式、即以普罗克洛斯哲学本身为根据来解释这部著作。因此，在呈现与重构普罗克洛斯哲学时，尤其在中世纪普罗克洛斯评注的研究中，他绝对值得获得更多的关注。迄今为止，《神学要素论》的标准版本只是顺带提及（如果有所提及的话）佩特里齐的普罗克洛斯著作，甚至对它作出不公正的批评（Dodds 1963, pp. xli–xlii, 343; cf. in more detail Iremadze 2004a, pp. 225–231）[^dodds-1963][^iremadze-2004a]。在拜占庭与拉丁普罗克洛斯评注者——梅托涅的尼古拉（Nicholas of Methone，12 世纪）、莫斯堡的贝特霍尔德（Berthold of Moosburg，14 世纪）、梅赫伦的亨利·巴特（Henry Bate of Mechelen，13 世纪）——的语境下研究《神学要素论》的格鲁吉亚语翻译与解释，将填补普罗克洛斯研究中的这一空白（cf. Mojsisch 2002, pp. 175–182）[^mojsisch-2002]。此外，11 世纪与 12 世纪拜占庭哲学家（普塞洛斯、伊塔洛斯）对普罗克洛斯的接受也不应被忽视（cf. Jeck 2010, Jeck 2017, pp. 243–270）[^jeck-2010][^jeck-2017]。
    step2: |-
      乔安·佩特里齐（Joane Petrizi，12 世纪）是格鲁吉亚中世纪最重要的哲学家，倾注大量心力研究新柏拉图主义哲学。他将埃美萨的尼梅西乌斯（Nemesius of Emesa）的《论人的本性》（*On the Nature of Man*）译成格鲁吉亚语，这部著作在当时引起了相当大的关注。尤为重要的是他对普罗克洛斯（Proclus）《神学要素论》（*Elementatio theologica*）的格鲁吉亚语翻译，他还为此撰写了一部逐条评注。佩特里齐的《神学要素论》评注代表着一次意义重大的接受努力，因为这位格鲁吉亚哲学家以内在的方式解释这部著作，也就是说，以普罗克洛斯哲学自身为根据来解释它。因此，在呈现与重构普罗克洛斯哲学时，尤其是在中世纪普罗克洛斯评注的研究中，他无疑应当得到更多的关注。迄今为止，《神学要素论》的标准版本只是顺带提及（如果有所提及的话）佩特里齐的普罗克洛斯著作，甚至不公正地批评它（Dodds 1963, pp. xli–xlii, 343; cf. in more detail Iremadze 2004a, pp. 225–231）[^dodds-1963][^iremadze-2004a]。结合拜占庭与拉丁的普罗克洛斯评注者——梅托涅的尼古拉（Nicholas of Methone，12 世纪）、莫斯堡的贝特霍尔德（Berthold of Moosburg，14 世纪）、梅赫伦的亨利·巴特（Henry Bate of Mechelen，13 世纪）——来研究《神学要素论》的格鲁吉亚语翻译与解释，将填补普罗克洛斯研究中的这一空白（cf. Mojsisch 2002, pp. 175–182）[^mojsisch-2002]。此外，11 世纪与 12 世纪拜占庭哲学家（普塞洛斯、伊塔洛斯）对普罗克洛斯的接受也不应被忽视（cf. Jeck 2010, Jeck 2017, pp. 243–270）[^jeck-2010][^jeck-2017]。
