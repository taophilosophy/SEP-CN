      In 1757, these commentaries, together with the Armenian version of the *Elementatio theologica*, were translated into Georgian; they have made a clear mark on Georgian culture. Therefore, in the 18ᵗʰ century there were at least two different commentaries on the *Elementatio theologica* in Georgian (cf. Zakaradze 2025)[^zakaradze-2025]. It should be noted that the “Armenian version” of the *Elementatio theologica* was translated back into Georgian. Thus, in Georgian, both the original version (i.e., the original “Georgian version” by Joane Petrizi) and a Georgian translation of the “Armenian version” (dated 1248, based on Joane Petrizi’s Georgian translation) existed. This modern Georgian translation has provoked considerable criticism in Georgia. Its aim, however, was to facilitate a better and easier understanding of the complex contents of Proclus’s *Elementatio theologica* using a more modern Georgian language. However, this doesn't seem to have been achieved.
