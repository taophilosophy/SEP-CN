      In his *Proclus Commentary*, Joane Petrizi analyses the dialectic hidden in the ‘cause’ and the ‘caused’ more thoroughly and in more detail than does Proclus himself in the corresponding chapters of his *Elementatio theologica*. In Petrizi’s exegesis, the abstract, mathematical style of this work is augmented with a wealth of material. Petrizi operates very often with visually illustrative examples, and is careful to illuminate the theorems set forth in the *Elementatio theologica* by means of human experience. This resulted from the goals of his *Interpretation*. It primarily addressed a broad public and served the study of this significant work from Greek antiquity.
