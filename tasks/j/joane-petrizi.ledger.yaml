      The first volume of Petrizi’s Proclus work (*The Elementatio theologica of the Platonic Philosopher Proclus*) was published in 1940. This volume contains the Georgian translation of the *Elementatio theologica* from the Greek. The editor was S. Kaukhchishvili; M. Gogiberidze wrote an introduction to the volume. It also contains a comprehensive vocabulary for both volumes, also compiled by S. Kaukhchishvili. In the 20ᵗʰ century, Petrizi’s *Interpretation* was translated into Russian. The Russian translation of 1984 with an introduction and annotations by G. Tevzadze is of particular importance. After the publication of scholarly editions of Petrizi’s works, both philosophical and philological problems in the Proclus commentary have been subject to thorough-going research (for a detailed account of the state of Petrizi research, cf. Iremadze 2004a, pp. 13–27)[^iremadze-2004a].
    step1: |-
      佩特里齐普罗克洛斯著作的第一卷（《柏拉图哲学家普罗克洛斯的〈神学要素论〉》（*The Elementatio theologica of the Platonic Philosopher Proclus*））于 1940 年出版。该卷收录了由希腊文译出的《神学要素论》格鲁吉亚语翻译。编辑者是 S. Kaukhchishvili；M. Gogiberidze 为该卷撰写了导言。该卷还包含一份涵盖两卷的详尽词汇表，同样由 S. Kaukhchishvili 编制。20 世纪，佩特里齐的《诠释》被译为俄语。1984 年的俄语译本附有 G. Tevzadze 的导言与注释，尤为重要。在佩特里齐著作学术版出版之后，普罗克洛斯评注中的哲学问题与语文学问题都得到了透彻的研究（关于佩特里齐研究状况的详细叙述，cf. Iremadze 2004a, pp. 13–27）[^iremadze-2004a]。
    step2: |-
      佩特里齐普罗克洛斯著作的第一卷——《柏拉图哲学家普罗克洛斯的〈神学要素论〉》（*The Elementatio theologica of the Platonic Philosopher Proclus*）——于 1940 年出版。该卷收录自希腊文迻译的《神学要素论》格鲁吉亚语译文。编辑为 S. Kaukhchishvili，导言出自 M. Gogiberidze 之手；卷内还附有一份兼摄两卷的详尽词汇表，同样由 S. Kaukhchishvili 编成。20 世纪，佩特里齐的《诠释》被译成俄语；1984 年刊行的俄语译本附有 G. Tevzadze 的导言与注释，尤为紧要。自佩特里齐著作学术版问世以来，《普罗克洛斯评注》中的哲学问题与语文学问题均已得到透彻研究（关于佩特里齐研究状况的详细综述，cf. Iremadze 2004a, pp. 13–27）[^iremadze-2004a]。
