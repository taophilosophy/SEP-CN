      (1) Sulkhan-Saba Orbeliani (1658–1726) integrated numerous theorems from Petrizi’s Proclus work into his *Georgian Dictionary*. In the definition and discussion of the problem of knowledge, he refers to the 20ᵗʰ proposition of the *Interpretation* and determines reason as the simple, bodiless knowledge of the known (Orbeliani, vol. I, p. 166, col. 1–2). Other important philosophical definitions—for example the determination of real being (Orbeliani, vol. I, p. 574, col. 1), of production (Orbeliani, vol. II, p. 366, col. 2; p. 367, col. 1), of causality (Orbeliani, vol. I, p. 480, col. 1–2), of motion (Orbeliani, vol. I, p. 479, col. 2)—are taken from Petrizi’s *Proclus Commentary*. In his *Georgian Dictionary*, Sulkhan-Saba Orbeliani made equally extensive reference to Petrizi’s Georgian translation of the work *On the Nature of Man* by Nemesius of Emesa.
