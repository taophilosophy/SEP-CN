      Among Plato’s works, Petrizi refers to the dialogues *Parmenides*, the *Laws, Phaedrus, Phaedo* and *Timaeus.* Although he does not mention them, he also quotes from *Theaetetus* and the *Symposium* (Petrizi, *Opera II*, pp. 34, 84). Petrizi also mentions various works of Aristotle’s, but not the pseudo-Aristotelian works used by Scholastic philosophers (Iremadze 2004a, p. 57)[^iremadze-2004a]. It can be gathered from his *Interpretation* that in addition to the *Elementatio theologica* he also knew other works by Proclus (for example the *Parmenides* and *Timaeus* commentaries as well as the *Platonic Theology*) and drew on them as he saw fit in commenting on the *Elementatio theologica* (Iremadze 2004a, p. 57)[^iremadze-2004a].
    step1: |-
      在柏拉图的著作中，佩特里齐提到了对话录《巴门尼德》、《法律篇》（*Laws*）、《斐德罗》（*Phaedrus*）、《斐多》（*Phaedo*）与《蒂迈欧》（*Timaeus*）。尽管他没有提到《泰阿泰德》（*Theaetetus*）与《会饮》（*Symposium*），他也引用了这两部作品（Petrizi, *Opera II*, pp. 34, 84）。佩特里齐还提到亚里士多德的多部著作，但没有提到经院哲学家们所使用的伪亚里士多德著作（Iremadze 2004a, p. 57）[^iremadze-2004a]。从他的《诠释》可以得知，除《神学要素论》外，他还知道普罗克洛斯的其他著作（例如《巴门尼德》与《蒂迈欧》的注疏以及《柏拉图神学》（*Platonic Theology*）），并在评注《神学要素论》时视需要利用了它们（Iremadze 2004a, p. 57）[^iremadze-2004a]。
    step2: |-
      在柏拉图的著作中，佩特里齐提到的对话录有《巴门尼德》、《法律篇》（*Laws*）、《斐德罗》（*Phaedrus*）、《斐多》（*Phaedo*）与《蒂迈欧》（*Timaeus*）。他虽未提及《泰阿泰德》（*Theaetetus*）与《会饮》（*Symposium*），却也引用了这两部对话（Petrizi, *Opera II*, pp. 34, 84）。佩特里齐还提及亚里士多德的多种著作，但未提经院哲学家所用的那些伪亚里士多德著作（Iremadze 2004a, p. 57）[^iremadze-2004a]。从《诠释》可以看出，除《神学要素论》之外，他还熟悉普罗克洛斯的其他著作（例如《巴门尼德》与《蒂迈欧》的注疏，以及《柏拉图神学》（*Platonic Theology*）），并在评注《神学要素论》时视需要加以利用（Iremadze 2004a, p. 57）[^iremadze-2004a]。
