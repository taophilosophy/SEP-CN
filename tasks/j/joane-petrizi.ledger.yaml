      In Proposition 75 of his commentary, Petrizi distinguishes five different modes of *causa*, characterizing them in a nutshell. He adds a fifth kind of *causa* to the traditional system of causes. In addition to the material, formal, final and efficient causes he conceives a creative cause (Petrizi, *Opera II*, prop. 75, p. 136). It was, he claims, neglected in the Aristotelian’s theoretical work, who, in contrast to Proclus, had underestimated the relevance of the creative cause. This applies both to Aristotle and his interpreters, above all Alexander of Aphrodisias, whom Petrizi criticizes in this connection (Petrizi, *Opera II*, prop. 11, p. 38).
    step1: |-
      在其评注的命题 75 中，佩特里齐区分了五种不同的 *causa*（原因）样式，并以寥寥数语刻画它们。他在传统的原因体系中增添了第五种 *causa*。除质料因、形式因、目的因与动力因之外，他还构想了一种创造因（Petrizi, *Opera II*, prop. 75, p. 136）。他声称，这种创造因在亚里士多德的理论工作中受到了忽视；与普罗克洛斯不同，亚里士多德低估了创造因的相关性。这一点既适用于亚里士多德本人，也适用于他的解释者，尤其是阿弗罗狄西亚的亚历山大——佩特里齐正是在这层关联上批评他（Petrizi, *Opera II*, prop. 11, p. 38）。
