      In 1790, Mill enrolled in the University of Edinburgh, where by day he pursued a full course of studies and in the evenings tutored young Wilhelmina. Each experience left its mark. The Scottish universities at Edinburgh and Glasgow (and to a lesser extent Aberdeen and St. Andrews) had earlier been the hub of the Scottish Enlightenment and were still the premier universities in Britain. They had numbered among their faculty such luminaries as Francis Hutcheson, Thomas Reid, John Millar, Adam Ferguson, Adam Smith, and—had the orthodox town council of Edinburgh not forbade his admission—would have included David Hume as well. At Edinburgh Mill took particular delight in the tutelage of Dugald Stewart, who carried on the tradition of Scottish moral philosophy. In addition to moral philosophy, Mill’s course of studies included history, political economy, and the classics, including Mill’s favorite philosopher, Plato (Loizides 2013a, ch. 3; Loizides 2013b)[^loizides-2013a][^loizides-2013b]. Mill’s mind never lost the stamp of his Scottish education (Cumming 1962)[^cumming-1962]. As his eldest son was later to remark, James Mill was “the last survivor of this great school” (J.S. Mill 1843, 566)[^mill-1843].
    step1: |-
      1790 年，密尔入爱丁堡大学，白天修读全部课程，晚间为小威廉明娜授课。两种经历都留下了印记。爱丁堡与格拉斯哥的苏格兰大学（阿伯丁与圣安德鲁斯次之）此前曾是苏格兰启蒙运动的中心，当时仍是英国首屈一指的大学。其教席上曾有弗朗西斯·哈奇森、托马斯·里德、约翰·米拉、亚当·弗格森、亚当·斯密等名人；若非爱丁堡正统的市议会禁止，还会包括大卫·休谟。在爱丁堡，密尔尤其喜欢受教于杜格尔德·斯图尔特，后者继承了苏格兰道德哲学的传统。除道德哲学外，密尔的课程还包括历史、政治经济学与古典学，其中有他最喜爱的哲学家柏拉图（Loizides 2013a, ch. 3; Loizides 2013b）[^loizides-2013a][^loizides-2013b]。密尔的心灵从未失去苏格兰教育所打下的印记（Cumming 1962）[^cumming-1962]。正如其长子后来所说，詹姆斯·密尔是“这个伟大传统的最后遗老”（J.S. Mill 1843, 566）[^mill-1843]。
    step2: |-
      1790 年，密尔入爱丁堡大学：昼则尽修课业，夜则为幼女威廉明娜授读。二者皆留痕迹。爱丁堡、格拉斯哥之苏格兰大学（阿伯丁、圣安德鲁斯次之）昔为苏格兰启蒙运动之枢，其时仍为不列颠首善之庠。其讲席上有弗朗西斯·哈奇森、托马斯·里德、约翰·米拉、亚当·弗格森、亚当·斯密诸名流；使非爱丁堡正统市议会禁其入，大卫·休谟亦当在列。在爱丁堡，密尔尤喜从杜格尔德·斯图尔特受业，斯氏承苏格兰道德哲学之绪。课目之外，兼治历史、政治经济学与古典之学，而尤好柏拉图——其最所心折之哲人（Loizides 2013a, ch. 3; Loizides 2013b）[^loizides-2013a][^loizides-2013b]。苏格兰教育之印，密尔之心终其身未尝去（Cumming 1962）[^cumming-1962]。其长子后尝言：詹姆斯·密尔乃“此一大学统之最后遗老”（J.S. Mill 1843, 566）[^mill-1843]。
