      Unlike his famous first-born son, James Mill never wrote an autobiography or even a sketch of his early life, the details of which remained unknown even to his children. What we do know is this. James Mill was born on 6 April 1773 at Northwater Bridge in the county of Forfarshire in the parish of Logie Pert in Scotland. His father, James Milne, was a shoemaker and small farmer of modest means who was quiet, mild-mannered, and devout. His mother, Isabel Fenton Milne, was a more forceful figure. Determined that her first-born son should get ahead in the world, she changed the family name from the Scottish “Milne” to the more English-sounding “Mill,” and kept young James away from other children, demanding that he spend most of his waking hours immersed in study. His “sole occupation,” as his biographer Alexander Bain remarks, “was study” (Bain 1882, 7)[^bain-1882]. (A regimen rather like that imposed by his mother upon her eldest son was later to be imposed upon his first-born son, John Stuart Mill.) In this occupation young James clearly excelled. Before the age of seven he had shown a talent for elocution, composition, and arithmetic, as well as Latin and Greek. The local minister saw to it that James received special attention at the parish school. At age ten or eleven, he was sent to Montrose Academy, where his teachers “were always overflowing with the praises of Mill’s cleverness and perseverance” (Bain 1882, 8)[^bain-1882]. Before leaving Montrose Academy at the age of seventeen, Mill was persuaded by the parish minister and his mother to study for the ministry. Mill’s decision evidently pleased Lady Jane Stuart, wife of Sir John Stuart of Fettercairn, who headed a local charity founded for the purpose of educating poor but bright boys for the Presbyterian ministry. Mill, eminently qualified in both respects, became the recipient of Lady Jane’s largesse. As it happened, she and Sir John were just then looking for a tutor for their fourteen-year old daughter Wilhelmina. They offered the job to James Mill; he accepted; and when the Stuart family moved to Edinburgh, he accompanied them.
    step1: |-
      与他的著名长子不同，詹姆斯·穆勒从未写过自传，甚至没有写过早期生活的梗概，其细节连他的孩子也不得而知。我们确实知道的是这些。詹姆斯·穆勒于 1773 年 4 月 6 日出生于苏格兰福法尔郡洛吉珀特教区的北水桥。他的父亲詹姆斯·米爾恩是一名鞋匠和收入微薄的小农场主，为人安静、温和、虔诚。他的母亲伊莎贝尔·芬顿·米尔恩则是个更强势的人物。她决心让头生长子出人头地，便把家族姓氏从苏格兰式的“米尔恩”改成更带英语味道的“穆勒”，并让小詹姆斯远离别的孩子，要求他把醒着的大部分时间都浸在学业里。他的“唯一职业”，正如其传记作者亚历山大·贝恩所说，“就是学习”（Bain 1882, 7）[^bain-1882]。（一种与其母加于长子者颇为相似的管教，日后也被加于他的头生长子约翰·斯图亚特·穆勒。）小詹姆斯显然在此职业上出类拔萃。七岁之前他就已显露出演说、作文和算术的才能，拉丁文与希腊文也是如此。当地牧师设法让詹姆斯在教区学校得到特别关照。十岁或十一岁时，他被送往蒙特罗斯学院，那里的老师们“总是对穆勒的聪明与毅力赞不绝口”（Bain 1882, 8）[^bain-1882]。在十七岁离开蒙特罗斯学院之前，穆勒被教区牧师和母亲说服去攻读神职。穆勒的决定显然令费特凯恩的约翰·斯图尔特爵士之妻简·斯图尔特夫人感到满意，她主持着一家为培养贫寒而聪颖的男孩成为长老会牧师而设立的本地慈善机构。穆勒在这两方面都极为合格，遂成为简夫人慷慨资助的受益者。恰巧的是，她与约翰爵士当时正在为十四岁的女儿威尔赫敏娜物色一位家庭教师。他们把这份工作给了詹姆斯·穆勒；他接受了；当斯图尔特一家迁往爱丁堡时，他随行前往。
