      From 1790 to 1794 Mill served young Wilhelmina Stuart not only as a teacher but as a companion and confidant. Her admiration for her tutor quite likely turned to love, and the feeling was apparently reciprocated. But, however promising his prospects, Mill was no aristocrat, a social fact which he was not allowed to forget. In 1797 Wilhelmina married a member of her own class, Sir William Forbes (to the disappointment of Walter Scott, not least). Wilhelmina died in 1810, soon after the birth of her second son. She was said to have called out Mill’s name “with her last breath.” Mill never forgot her; he spoke of her always with wistful affection and named his first-born daughter after her in 1809. But this was not the only incident worthy of note in the Mill-Forbes family affair. In July 1806, soon after the birth of John Stuart Mill (named in honor of Mill’s Scottish patron), the first of nine children, Mill challenged Forbes to “a fair race … in the education of a son.” The “contest” would be decided “twenty years hence.” Should Mill’s be “the most accomplished & virtuous young man” of the two first-born sons, the proud father confessed, “I shall not envy you that you can have yours the richest” (Mill to Forbes, 1806). Ironically, twenty years later, the virtuous son would fall in a state of dejection, forcing him to question the efficacy of the father’s scheme of education (see further, Loizides 2024)[^loizides-2024].
    step1: |-
      1790 至 1794 年，密尔为小威廉明娜·斯图亚特效力，不仅是教师，还是同伴与知己。她对家庭教师的仰慕很可能转为爱情，而这种感情显然得到了回应。然而，无论前途多么有望，密尔都不是贵族，这个社会事实不容他忘记。1797 年，威廉明娜嫁给了同阶层的威廉·福布斯爵士（至少令沃尔特·司各特失望）。威廉明娜于 1810 年去世，时在其次子出生后不久。据说她“在最后一息”呼唤着密尔的名字。密尔从未忘记她；他提起她时总是带着怅惘的深情，并于 1809 年把长女取名为她。但这并非密尔—福布斯两家纠葛中唯一值得注意的事。1806 年 7 月，约翰·斯图亚特·密尔（以密尔的苏格兰恩主命名）出生后不久——这是九个孩子中的第一个——密尔向福布斯挑战，要“在为儿子教育上作一场公平竞赛”。这场“较量”将在“二十年后”见分晓。倘若密尔之子成为两个长子中“最有教养且最有德性的青年”，这位自豪的父亲承认，“我不会羡慕你能让你的儿子最富有”（Mill to Forbes, 1806）。具有讽刺意味的是，二十年后，这位有德之子却陷入消沉，迫使他质疑父亲教育方案的效力（详见 Loizides 2024）[^loizides-2024]。
    step2: |-
      1790 至 1794 年，密尔事幼女威廉明娜·斯图亚特，不独为师，兼为伴侣与知交。女之慕其师，或转为情爱，而情意似亦有答。然密尔虽前程可期，终非贵族——此一社会事实，时人未尝许其忘之。1797 年，威廉明娜嫁于同阶层的威廉·福布斯爵士（沃尔特·司各特亦为之怅然）。1810 年，威廉明娜卒，时在其次子生后未久。相传其“最后一息”犹呼密尔之名。密尔终身不能忘之，言及辄有怅惘之情，1809 年以之名其长女。然密尔—福布斯两家之事，可记者不止此。1806 年 7 月，约翰·斯图亚特·密尔（以密尔之苏格兰恩主命名）生后未几——是为九子之长——密尔乃向福布斯挑战，约“于教子之事作一场公平之赛”，胜负“二十年而后”定。苟密尔之子为两家长子中“最有教养而有德之青年”，则此自得之父自承：“吾不羡君之能令子最富也。”（Mill to Forbes, 1806）乃二十年后，此有德之子竟陷于消沉，遂使乃父教子之方见疑（详见 Loizides 2024）[^loizides-2024]。
