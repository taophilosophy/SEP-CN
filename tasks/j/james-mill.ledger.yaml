      ### 6.3 Education, Power and Liberty of the Press
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      In short, Mill thought character depends on “the direction given to the desires and passions of men.” To this effect, the “business of good education” is to associate the “grand objects of desire” – e.g., wealth, power, dignity – with “admirable qualities” in individuals (e.g. “great intelligence, perfect self-command, and over-ruling benevolence”), not wicked ones (e.g. “flattery, back-biting, treachery”) (Mill 1992, 193; Mill 1829a, II, 245). Since the political (and legal) arrangements in a society are very powerful in solidifying such associations through various institutions and practices, “Political Education,” as we saw, is “the key-stone of the arch” (Mill 1992, 193). Not only is government responsible for fostering proper habits and associations with good laws, justice and the eradication of corruption, according to Mill; but also, government should be held accountable when it failed to do so.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Given that “our opinions are the fathers of our actions,” Mill argued amidst the debate on parliamentary representation, it is vital that individuals do not take the opinions of others upon trust or let others choose for them what is in their interest to pursue. It was thus quite an important educational task to foster habits of examining the evidence which grounds opinions (Mill 1826, 10–11, 13–14; Mill 1992, 122, 126–130). Inattention to evidence made the detection of fallacious thinking, lying underneath a host of prejudices, impossible. Especially since those “who stand on the vantage ground of power,” Mill warned, had made an art of defending power through, what he called, “the logic of power”: the misrepresentation of facts, suppression of evidence, begging the question, argument from authority, appealing to fear, and *inter alia*, ridicule (Mill 1824, 465). Due to the ever-present danger that political, legal and social institutions might foster “habits of servility and toleration of arbitrary power,” the “Liberty of the Press” is a vital counteracting social influence, and, for that reason, “an inestimable blessing” by securing good government (Mill 1813b, 211–212, Mill 1992, 117–123; Grint 2017)[^grint-2017]. The press functions thus as a sort of “high and constant observer” of government acts (Mill 1992, 107) through apt diffusion of praise and blame to public functionaries.
