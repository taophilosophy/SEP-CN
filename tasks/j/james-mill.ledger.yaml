      James Mill always attempted to write, he said, with “manly plainness,” and in that endeavor he certainly succeeded. The reader is never at a loss to know just what his views are or where his sympathies lie. Mill’s manly plainness is especially evident in his massive three-volume *History of British India*, which begins with a remarkable preface in which he asserts that his objectivity is guaranteed by the fact that he has never visited India. His is, he says, a “critical, or judging history,” and his judgments on Hindu customs and practices are particularly harsh (Mill 1818, I, x). He denounces their “rude” and “backward” culture for its cultivation of ignorance and its veneration of superstition, and leaves no doubt that he favors a strong dose of Utilitarian rationalism as an antidote. Although his *History* is in part a Utilitarian treatise and in part a defense of British intervention in Indian affairs, it is more than the sum of those two parts. Mill’s *History* shows, perhaps more clearly than any of his other works, the continuing influence of his Scottish education (Rendall 1982; Plassart 2015)[^plassart-2015][^rendall-1982]. The criteria according to which Mill judges and criticizes Indian practices and customs derive from the view of historical progress that he had learned from Dugald Stewart and John Millar, amongst others. According to this view “man is a progressive being” and education is the chief engine of progress. And this in turn helps to explain not only Mill’s harsh judgments on the Hindus but his continually reiterated emphasis on education (Mill 1992, 139–84).
    step1: |-
      詹姆斯·密尔说，他总是试图以“刚健的朴实”写作，而在这方面他确实成功了。读者从不会不知道他的观点是什么、他的同情在哪里。密尔的刚健朴实在其三卷本巨著《英属印度史》中尤为明显。该书以一篇引人注目的序言开篇，其中他宣称，他的客观性由他从未访问过印度这一事实得到保证。他说，这是一部“批判的、亦即评判的历史”，而他对印度教习俗与实践的评判尤为严厉（Mill 1818, I, x）。他谴责其“粗陋”“落后”的文化培养无知、崇奉迷信，并毫不含糊地表示，他赞成用一剂功利主义理性主义作为解药。虽然他的《历史》部分是功利主义论著、部分是为英国干预印度事务的辩护，它却不止于这两部分之和。密尔的《历史》或许比他的任何其他著作都更清楚地显示其苏格兰教育的持续影响（Rendall 1982; Plassart 2015）[^plassart-2015][^rendall-1982]。密尔据以评判和批评印度实践与习俗的标准，来自他从杜格尔德·斯图尔特、约翰·米拉等人那里学到的历史进步观。按照这种观点，“人是一种进步的存在者”，而教育是进步的主要引擎。这又有助于解释密尔对印度人的严厉评判，以及他一再强调教育（Mill 1992, 139–84）。
