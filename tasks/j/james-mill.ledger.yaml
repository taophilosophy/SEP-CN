      因此，密尔接着说，设计可行的政治制度的首要问题，是通过把某些成员侵占并享用他人劳动果实的程度降至最低，来使共同体的幸福最大化。密尔主张，这在君主制（其中单一统治者剥削其臣民）或贵族制（其中统治精英剥削平民）中都无法实现。共同体的幸福在直接民主制中也不能最大化，因为统治所需的时间与精力将从用于生产劳动的时间与精力中扣除（Mill 1992, 7–9）。唯一可作为个人与共同体幸福之手段的体制是代议制民主，其中公民选举代表，代表为他们并为其利益而审议和立法。然而，问题随即出现：如何使代表为人民的利益而非自己的利益而统治？密尔的回答是，频繁的选举与短暂的任期使当选代表不太可能只为自身利益立法。毕竟，代表出自人民阶层，任期结束后可以指望回到其中。鉴于我们今天或许会称之为代议制政府的激励结构，代表有充分理由促进人民的利益而非自己的利益。事实上，在一个结构良好的制度中，代表与选民之间将存在一种“利益同一性”（Mill 1992, 22）。
