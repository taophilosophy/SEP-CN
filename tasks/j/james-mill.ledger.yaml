      Sometime in 1808 James Mill met Jeremy Bentham (Bain 1882, 72)[^bain-1882] with whom he soon formed a political and philosophical alliance. The two were in some respects kindred spirits. Both wished and worked for religious toleration and legal reform; both favored freedom of speech and press; both feared that the failure to reform the British political system—by, among other things, eliminating rotten boroughs and extending the franchise—would give rise to reactionary intransigence on the one hand, and revolutionary excess on the other. But the two men were of vastly different temperaments and backgrounds. Bentham, a wealthy bachelor, was an eccentric genius and closet philosopher. The poor, harried and hard-working Mill was the more practical and worldly partner in that peculiar partnership. He was also a much clearer writer and more persuasive propagandist for the Utilitarian cause.
    step1: |-
      1808 年某个时候，詹姆斯·穆勒遇到了杰里米·边沁（Bain 1882, 72）[^bain-1882]，并很快与之结成政治与哲学同盟。两人在某些方面是志同道合者。他们都希望并致力于宗教宽容与法律改革；都赞成言论与新闻自由；都担心英国政治体制改革失败——通过清除腐败选区、扩大选举权等手段——会一方面导致反动的不妥协，另一方面导致革命的过激。但两人在气质和背景上大相径庭。边沁，一位富有的单身汉，是个古怪的天才和隐修的哲学家。贫穷、忙碌而勤勉的穆勒则是这个奇特搭档中更实际、更世故的一方。他也是功利主义事业中更清晰的写作者和更有说服力的宣传家。
    step2: |-
      1808 年某时，詹姆斯·穆勒结识了杰里米·边沁（Bain 1882, 72）[^bain-1882]，并很快与他结成政治与哲学同盟。两人在某些方面堪称同道：他们都向往并致力于宗教宽容与法律改革，都赞成言论与新闻自由，都担心英国政治体制若不改革——比如清除腐败选区、扩大选举权——就会一方面滋生反动势力的顽固不化，另一方面催生革命的过激之举。但两人在气质与出身背景上大相径庭。边沁，一位富有的单身汉，是个古怪的天才、书斋里的哲学家。贫穷、终日操劳而勤勉的穆勒，则是这对奇特搭档中更务实、更通晓世故的一方。他也是功利主义事业中更明晰的写作者、更有说服力的宣传家。
