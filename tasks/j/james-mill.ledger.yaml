      等到 1798 年他获准布道时，穆勒显然已经开始失去信仰；到 1800 年代初，他已变得坐立不安、心灰意冷。1802 年，二十九岁的他前往伦敦，指望改善自己的处境。此后好几年，他作为独立作家、记者和编辑谋生。从 1802 年到 1819 年被任命为东印度公司函件助理审查员为止，穆勒的文学劳作令人惊叹：除约 1400 篇社论外，他还写了数百篇内容扎实的文章与书评，以及好几部书，其中包括三卷本的《英属印度史》。这些作品有些无疑出于热爱，但多数是出于生计——穆勒必须养活自己、1805 年与他成婚的妻子哈丽雅特，还有一个人丁兴旺、快速增长的家庭。
