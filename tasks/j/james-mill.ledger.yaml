      Besides being a tireless reformer and prolific writer, James Mill supplied his son John with one of the most strenuous educations ever recorded in the annals of pedagogy. The elder Mill gave young John daily lessons in Latin, Greek, French, history, philosophy, and political economy. Literature and poetry were also taught, although with less enthusiasm (James Mill, like Plato, distrusted poets and poetry). John was in turn expected to tutor his younger brothers and sisters in these subjects. Each was examined rigorously and regularly by their unforgiving father, and the nine children, like their mother, lived with in fear of his rebuke. As John Stuart Mill later wrote, “I … grew up in the absence of love and in the presence of fear” (J.S. Mill 1873, 612)[^mill-1873].
