      从 1790 年到 1794 年，穆勒不只是年轻威尔赫敏娜·斯图尔特的家庭教师，也是她的同伴与知己。她对这位老师的仰慕很可能化作了爱情，而这份感情显然也是双向的。可是，无论前程多么光明，穆勒终非贵族——这是一个他无权忘怀的社会事实。1797 年，威尔赫敏娜与自己阶层的一位成员威廉·福布斯爵士结婚（令沃尔特·司各特尤为失望）。1810 年，威尔赫敏娜在生下第二个儿子后不久去世。据说她“用最后一口气”喊出了穆勒的名字。穆勒从未忘记她，谈起她时总带着怅惘的深情，并于 1809 年以她的名字为头生女儿命名。但这并非米尔-福布斯家族事件中唯一值得一提的事。1806 年 7 月，在约翰·斯图亚特·穆勒（以穆勒的苏格兰恩主命名）出生后不久——那是九个孩子中的第一个——穆勒向福布斯下了“一场公平的赛跑……看谁的儿子受教更好”的战书。这场“竞赛”将在“二十年后”见分晓。倘若穆勒的儿子能成为两位头生长子中“最有教养且最有德行的青年”，这位自豪的父亲坦言，“我不会嫉妒你能让你的儿子最富有”（Mill to Forbes, 1806）。讽刺的是，二十年后，这位有德行的儿子竟陷入万念俱灰之境，迫使他质疑父亲那套教育方案究竟有没有用（另见 Loizides 2024）[^loizides-2024]。
