      After completing his first degree in 1794, Mill began studying for the ministry. For the next four years he supported himself by tutoring the sons and daughters of several noble families. One such family even set up a small pension which complemented Mill’s income for years (Lazenby 1972, 309)[^lazenby-1972]. Yet, the experience was not a happy one. For repeatedly forgetting his “place” in “polite society” he suffered one insult after another. He harbored ever after an abiding hatred for an hereditary aristocracy.
    step1: |-
      1794 年完成第一个学位后，密尔开始为牧师职业学习。此后四年，他靠给几个贵族家庭的子女授课维持生计。其中一个家庭甚至为他设立了一笔小额年金，多年间补贴他的收入（Lazenby 1972, 309）[^lazenby-1972]。然而，这段经历并不愉快。由于屡次忘记自己在“上流社会”中的“位置”，他遭受了一次又一次的侮辱。此后他对世袭贵族始终怀有深切的憎恨。
    step2: |-
      1794 年既得初阶学位，密尔始为牧师之业而学。此后四年，恃教读贵族子女以自给。有一家且为之设薄年金，历年补助其用（Lazenby 1972, 309）[^lazenby-1972]。然此段经历殊不愉快：以其屡忘自身在“上流社会”中之“位置”，遂屡受折辱。自此以后，于世袭贵族深怀憎恶，终其身不解。
