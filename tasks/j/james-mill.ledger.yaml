      1790 年，穆勒进入爱丁堡大学，白天修读完整课程，晚上辅导年轻的威尔赫敏娜。这两种经历都留下了印记。爱丁堡与格拉斯哥的苏格兰大学（以及稍逊的阿伯丁与圣安德鲁斯）早先曾是苏格兰启蒙运动的中心，当时仍是英国首屈一指的学府。它们教席上曾有弗朗西斯·哈奇森、托马斯·里德、约翰·米勒、亚当·弗格森、亚当·斯密等贤哲，而且——若非爱丁堡正统市议会拒绝其入学——本应还有大卫·休谟。在爱丁堡，穆勒尤为醉心于杜格尔德·斯图尔特的教导，后者承续了苏格兰道德哲学的传统。除道德哲学外，穆勒的课程还包括历史、政治经济学和古典学，其中便有他最喜欢的哲学家柏拉图（Loizides 2013a, ch. 3; Loizides 2013b）[^loizides-2013a][^loizides-2013b]。穆勒的心灵从未褪去其苏格兰教育的印记（Cumming 1962）[^cumming-1962]。正如他的长子后来所言，詹姆斯·穆勒是“这一伟大学派的最后一位幸存者”（J.S. Mill 1843, 566）[^mill-1843]。
