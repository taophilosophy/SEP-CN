      Peter Klein and Ted Warfield’s 1994 paper in *Analysis* initiated a lively and instructive debate on the relationship between coherence and probability (e.g., Klein and Warfield 1994 and 1996, Merricks 1995, Shogenji 1999, Cross 1999, Akiba 2000, Olsson 2001, Fitelson 2003 and Siebel 2004)[^akiba-2000][^cross-1999][^fitelson-2003][^klein-1994][^klein-1996][^merricks-1995][^olsson-2001][^shogenji-1999][^siebel-2004]. According to Klein and Warfield, just because one set of beliefs is more coherent than another set, this does not mean that the first set is more likely to be true. On the contrary, a higher degree of coherence can, so they claimed, be associated with a lower probability of the whole set. The idea behind their reasoning is simple: We can often raise the coherence of an informational set by adding more information that explains the information already in the set. But as more genuinely new information is added, the probability that all the elements of the set are true is correspondingly diminished. This, Klein and Warfield wrote, follows from the well-known inverse relationship between probability and informational content. They concluded that coherence is not truth conducive.
    step1: |-
      彼得·克莱因与特德·沃菲尔德 1994 年在《分析》（*Analysis*）上发表的论文，引发了一场关于融贯与概率之关系的生动而富有教益的争论（例如 Klein and Warfield 1994 and 1996, Merricks 1995, Shogenji 1999, Cross 1999, Akiba 2000, Olsson 2001, Fitelson 2003 and Siebel 2004）[^akiba-2000][^cross-1999][^fitelson-2003][^klein-1994][^klein-1996][^merricks-1995][^olsson-2001][^shogenji-1999][^siebel-2004]。按照克莱因与沃菲尔德，一个信念集合比另一个集合更融贯，并不表示第一个集合更可能为真。相反，他们声称，更高的融贯度可以与整个集合更低的概率相关联。他们推理背后的观念很简单：我们常常可以通过添加更多信息来提高一个信息集合的融贯，这些新信息解释集合中已有的信息。但随着真正新的信息被添加，集合所有元素都为真的概率相应地降低。克莱因与沃菲尔德写道，这来自概率与信息内容之间众所周知的逆关系。他们得出结论：融贯不导向真理。
