      所谓传统的融贯说明，我们指的是把融贯构想为给定材料（命题、信念、记忆、证词等）之间的相互支持或一致关系的说明。早期的刻画出自布兰德·布兰沙德（1939）与 A. C. 尤因（1934）等人。按照尤因，一个融贯集合部分地由一致性、部分地由如下性质所刻画：集合中每个信念都从其余信念合在一起逻辑地推出。因此，像 $\{A_1, A_2, A_1 \amp A_2\}$ 这样的集合，如果一致，按此看法就是高度融贯的，因为每个元素都由其余元素协同一致地逻辑演绎出来。
