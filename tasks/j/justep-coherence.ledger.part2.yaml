      On the traditional justified true belief account of knowledge, a person cannot be said to know that a proposition $p$ is true without having good reasons for believing that $p$ is true. These good reasons would be justification for believing $p$. If Lucy knows that she will pass tomorrow’s exam, she must have good reasons for thinking that this is so. Consider now Lucy’s reasons. They will presumably consist of other beliefs she has, e.g., beliefs about how well she did earlier, about how well she has prepared, and so on. For Lucy to know that she will pass the exam, these other beliefs, upon which the first belief rests, must also be things that Lucy knows. Knowledge, after all, cannot be based on something less than knowledge, i.e., on ignorance (cf. Rescher 1979, 76)[^rescher-1979]. Since the reasons are themselves things that Lucy knows, those reasons must in turn be based on reasons, and so on. Thus, any knowledge claim requires a never-ending chain, or “regress”, of reasons for reasons. This seems strange, or even impossible, because it involves reference to an infinite number of beliefs. We seem unable to have infinitely many beliefs, much less justified ones. But most of us think that knowledge is possible.
    step1: |-
      按照传统的被证成的真信念知识观，一个人不能说是知道命题 $p$ 为真，除非他有好的理由相信 $p$ 为真。这些好的理由就是对相信 $p$ 的证成。如果露西知道她将通过明天的考试，她必须有好的理由认为情况如此。现在考虑露西的理由。它们大概由她所拥有的其他信念构成，例如关于她先前考得如何的信念、关于她准备得如何的信念，等等。露西要知道她将通过考试，这些第一信念所依据的其他信念也必须为露西所知。知识毕竟不能建立在比知识更少的东西之上，即不能建立在无知之上（cf. Rescher 1979, 76）[^rescher-1979]。既然理由本身是露西所知的东西，那些理由就必须依次建立在理由之上，如此无穷递进。因此，任何知识主张都要求一条永无尽头的链条，或“回溯”，即理由的理由。这看起来奇怪，甚至不可能，因为它涉及对无限多个信念的指涉。我们似乎无法拥有无限多的信念，更不用说被证成的信念了。但我们大多数人都认为知识是可能的。
