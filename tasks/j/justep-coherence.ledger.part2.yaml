      What is the coherentist’s response to the regress? The coherentist might be thought to propose that nothing prevents the regress from proceeding in a circle. Thus, $A$ can be a reason for $B$ which is a reason for $C$ which is a reason for $A$. If this is acceptable, then what we have is a chain of reasons that is never-ending but which does not involve an infinite number of beliefs. It is never-ending in the sense that for each belief in the chain there is a reason for that belief also in the chain. Yet there is an immediate problem with this response due to the fact that justificatory circles are usually thought to be vicious ones. If someone claims $C$ and is asked why she believes it, she may reply that her reason is $B$. If asked why she believes $B$, she may assert $A$. But if prompted to justify her belief in $A$, she is not allowed to refer back to $C$ which in the present justificatory context is still in doubt. If she did justify $A$ in terms of $C$ nonetheless, her move would lack any justificatory force whatsoever.
    step1: |-
      融贯论者对回溯的回应是什么？人们可能认为融贯论者主张，没有任何东西阻止回溯以循环的方式进行。于是 $A$ 可以是 $B$ 的理由，$B$ 可以是 $C$ 的理由，而 $C$ 又可以是 $A$ 的理由。如果这是可接受的，那么我们所有的就是一条永无尽头的理由链条，但它并不涉及无限多个信念。说它永无尽头，是指对于链条中的每个信念，链条中也有为该信念提供的一个理由。然而这一回应立即面临一个问题，因为证成循环通常被认为是恶性循环。如果有人主张 $C$ 并被问及为何相信它，她可能回答说她的理由是 $B$。如果被问及为何相信 $B$，她可能断言 $A$。但如果被要求证成她对 $A$ 的信念，她就不允许再引回 $C$，因为 $C$ 在当前的证成语境中仍然存疑。倘若她仍以 $C$ 来证成 $A$，她的举动将完全缺乏任何证成效力。
