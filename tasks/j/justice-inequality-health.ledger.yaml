      ## 8. Justice and Global Health Inequalities
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Discussions of justice and health inequality often focus on inequalities among members of the same polity. However, scholars have also addressed the justice of international health disparities, which, depending on the countries of comparison, can be drastic. As we note above, life expectancy in low-income countries in 2016 was 62.7 years, compared to 80.8 years in high-income countries, a gap of 18.1 years (WHO 2020)[^who-2020]. These disparities are no doubt driven by the wide income differences among these countries, and so questions regarding their justice are tightly connected to questions of global distributive justice (see entries on international distributive justice and global justice). However, global health inequalities are also driven by war, climate change, healthcare worker migration, and the funding decisions of sponsors of medical research, among other factors. Positions regarding the justice of global health disparities may therefore have far-reaching implications for a diverse set of policy spheres.
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      Given the tight connection between global health justice and global distributive justice, it is no surprise that approaches to the former piggy-back on approaches to the latter. Briefly, *cosmopolitans* start from the premise that all humans are moral equals and argue on this basis that high-income states have robust distributive obligations to people regardless of their nationality or relation to them. Some cosmopolitans defend a sufficientarian position (Brock 2009)[^brock-2009], while others argue that global justice demands equality since national membership is a morally arbitrary factor on the basis of which people should not be disadvantaged (Caney 2005)[^caney-2005]. *Institutionalists* do not reject the claim that all humans are moral equals but argue that robust distributive obligations—as opposed to a duty of assistance—are contingent on the existence of certain types of institutions, whether a coercive legal system (Nagel 2005; Blake 2001)[^blake-2001][^nagel-2005] or institutions establishing substantial economic interdependence (Sangiovanni 2007; J. Cohen & Sabel 2006)[^cohen-2006][^sangiovanni-2007].
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      Turning to theories of global health justice, a number of scholars defend sufficientarian accounts, according to which all people are entitled to some minimum level of health or opportunity to be healthy. Sridhar Venkatapuram (2011: 224) defends a cosmopolitan account of global health justice according to which all people have an entitlement to the capability to be healthy, secured at a threshold sufficient to ensure their equal human dignity. Jennifer Prah Ruger (2018: 82) defends an institutionalist sufficientarian approach, “provincial globalism”, according to which states and the broader global community have an obligation to ensure that all people enjoy a threshold level of central health capabilities. Others defend the human right to health, understood as a right to “protection against ‘standard threats’ to health” (Wolff 2012: 27)[^wolff-2012], or as a right to those things necessary for a basic minimum of health and so for a minimally good life (Hassoun 2020; see also Powers & Faden 2006: 85)[^hassoun-2020][^powers-2006].
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      Segall (2010) defends a cosmopolitan luck prioritarian account of global health justice. National membership is a morally arbitrary feature of one’s identity, Segall argues, and so disadvantages in people’s opportunities for health that are due to national membership should be addressed, with priority given to those who are worse off. While luck egalitarian or prioritarian positions often permit deficits in health due to voluntary choices in the domestic context, Segall (2010) rejects appeals to national responsibility to justify global health disparities on the grounds that not all residents of a polity can be held responsible for national policies. Even in an ideal world of democratic countries operating in the context of a just global economic order, policy decisions will be made on behalf of children and against the wishes of dissenters.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Hausman (2012) criticizes luck egalitarian and prioritarian accounts on the grounds that they may imply policies that exacerbate international inequalities in income or opportunity. Since citizens of some low-income countries experience better health than citizens of some middle- and high-income countries, policies aimed at addressing the poor health outcomes of the latter may exacerbate income inequalities among these countries. Luck egalitarian and prioritarian views therefore face difficult questions regarding the prioritization of health equality over equality of income or equality of opportunity. As an alternative to these accounts, Hausman (2012: 45) proposes a relational egalitarian account of global health justice, positing that some health inequalities across borders may be drastic enough to
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      > render individuals in one nation vulnerable to domination by other nations and diminish their voice in international co-operation.
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Although Hausman’s proposal is more of a sketch than an account of global health justice, it faces the above-mentioned problem with domestic relational egalitarian approaches, namely, identifying the health inequalities which in fact undermine equal relations. For example, when are the difference in life expectancy among citizens of two countries large enough to imply that they do not have equal status when representatives negotiate a trade deal?
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      Daniels (2008) develops an institutionalist approach to global health justice. He rejects the cosmopolitan idea that national membership is morally arbitrary on the grounds that co-nationals stand in a morally relevant set of institutionally mediated relationships which establish sustainable claims of egalitarian justice. Co-nationals are subject to the same coercively enforced rules of social cooperation of which they are the putative co-authors (see Nagel 2005)[^nagel-2005]. While Daniels (2008) rejects Segall’s claim that global inequalities due to national membership are unjust, he follows Joshua Cohen and Charles Sabel (2006) in arguing that international organizations and agreements establish morally relevant relationships and so must be designed in accordance with principles of justice. Thus, Daniels (2008) argues, the World Health Organization must show equal concern to all in its distribution of public health expertise and technology, and international property rights regimes must be designed to better address the global burden of disease.
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Gopal Sreenivasan (2007b: 221) side steps the above-mentioned debates in global distributive justice, and instead offers a non-ideal account of global health justice, one which anticipates the “minimum requirements that *any plausible and complete* ideal theory of justice will include”. He argues that the richest nations have an obligation to transfer 1% of GDP to the poorest nations with priority given to spending it on the determinants of health, including health care and public health, income and nutrition support, and education. This transfer is neither too demanding, nor, if spent on the determinants of health, too minimal for it promises to substantially improve the life expectancy of the world’s poorest people (Sreenivasan 2007b)[^sreenivasan-2007b].
