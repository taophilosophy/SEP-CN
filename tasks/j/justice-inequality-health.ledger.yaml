      Among American men, there is a 14.6 year difference in life expectancy between the top 1% and the bottom 1% of the income distribution (Chetty et al. 2016)[^chetty-2016]. Among American women, the corresponding difference is 10.1 years. In a recent survey, 38.2% of U.S. respondents in the bottom third of the income distribution reported fair or poor health, compared to 21.4% of respondents in the middle third, and 12.3% of respondents in the top third (Hero, Zaslavsky, & Blendon 2017). These disparities were reduced but not eliminated by adjustment for health insurance status.
    step1: |-
      在美国男性中，收入分布最上层 1% 与最底层 1% 之间的预期寿命相差 14.6 年（Chetty et al. 2016）[^chetty-2016]。在美国女性中，相应差距为 10.1 年。在最近一项调查中，收入分布处于最下三分之一的美国受访者中，有 38.2% 报告健康状况一般或差；中间三分之一的受访者中这一比例为 21.4%，最上三分之一为 12.3%（Hero, Zaslavsky, & Blendon 2017）。对医疗保险状况作调整后，这些差距有所缩小，但并未消除。
    step2: |-
      在美国男性中，收入分布顶层 1% 与底层 1% 的预期寿命相差 14.6 年（Chetty et al. 2016）[^chetty-2016]；美国女性的相应差距是 10.1 年。最近一项调查显示，收入分布最下三分之一的美国受访者里，38.2% 自评健康状况一般或差；中间三分之一为 21.4%，最上三分之一为 12.3%（Hero, Zaslavsky, & Blendon 2017）。控制医疗保险状况之后，这些差距有所收窄，但没有消除。
  - id: 2
    kind: body
    source: |-
      Americans also experience health disparities along racial and ethnic lines. In 2019, the life expectancy at birth for Hispanic Americans was 81.8 years, while it was 78.8 years for non-Hispanic white Americans, and 74.7 years for non-Hispanic Black Americans (Arias, Tejada-Vera, & Ahmad 2021). A recent study estimates that the COVID-19 pandemic disproportionately reduced the life expectancy (at birth) for Hispanic and non-Hispanic Black Americans from 2018 to 2020: 3.88 years for Hispanic Americans, 3.25 years for non-Hispanic Black Americans, compared to 1.36 years for non-Hispanic white Americans (Woolf, Masters, and Aron 2021).
    step1: |-
      美国人在种族与族裔层面上也经历着健康差距。2019 年，西班牙裔美国人的出生时预期寿命为 81.8 年，非西班牙裔白人为 78.8 年，非西班牙裔黑人为 74.7 年（Arias, Tejada-Vera, & Ahmad 2021）。最近一项研究估计，2018 至 2020 年间，COVID-19 大流行不成比例地降低了西班牙裔与非西班牙裔美国黑人的（出生时）预期寿命：西班牙裔美国人减少 3.88 年，非西班牙裔美国黑人减少 3.25 年，而非西班牙裔白人只减少 1.36 年（Woolf, Masters, and Aron 2021）。
    step2: |-
      美国人在种族与族裔层面也经历着健康差距。2019 年，西班牙裔美国人的出生时预期寿命为 81.8 岁，非西班牙裔白人为 78.8 岁，非西班牙裔美国黑人为 74.7 岁（Arias, Tejada-Vera, & Ahmad 2021）。最近一项研究估计：2018 到 2020 年间，COVID-19 疫情对西班牙裔与非西班牙裔美国黑人的（出生时）预期寿命打击尤重——西班牙裔减少 3.88 岁，非西班牙裔黑人减少 3.25 岁，而非西班牙裔白人只减少 1.36 岁（Woolf, Masters, and Aron 2021）。
  - id: 3
    kind: body
    source: |-
      If one turns to the international context, significant inequalities in life expectancy can be observed between people in low-income and high-income countries. In 2016, life expectancy in low-income countries was 62.7 years, compared to 80.8 years in high-income countries, a gap of 18.1 years (WHO 2020)[^who-2020].
    step1: |-
      再看国际层面，低收入国家与高收入国家人民的预期寿命存在显著不平等。2016 年，低收入国家的预期寿命为 62.7 年，高收入国家为 80.8 年，相差 18.1 年（WHO 2020）[^who-2020]。
    step2: |-
      转向国际层面：低收入国家与高收入国家人民的预期寿命差距可观。2016 年，低收入国家的预期寿命为 62.7 岁，高收入国家为 80.8 岁，相差 18.1 岁（WHO 2020）[^who-2020]。
  - id: 4
    kind: body
    source: |-
      On the face of it, these inequalities in life expectancy and self-reported health are seriously unjust. But whether the appearances of injustice here will withstand close scrutiny is a separate question. Not all inequalities in life expectancy seem unjust. For example, in 2018, life expectancy for all American women was 81.2 years, whereas for all American men it was only 76.2 years (Xu et al. 2020). Presumably, little (if any) of this 5 year inequality in life expectancy represents an injustice. However, if some inequalities in health are not unjust, then inequalities in health are not unjust *per se*.
    step1: |-
      表面上，这些预期寿命与自评健康上的不平等极不正义。但这些不正义的外观能否经得起细究，是另一个问题。并非所有预期寿命上的不平等都显得不正义。例如 2018 年，全体美国女性的预期寿命为 81.2 年，而全体美国男性只有 76.2 年（Xu et al. 2020）。这一 5 年的预期寿命不平等，其中（若有）恐怕很少有哪部分构成不正义。然而，如果有些健康不平等并不不正义，那么健康不平等就并非**本身**就不正义。
    step2: |-
      乍看之下，这些预期寿命与自评健康上的不平等严重不正义。但这种不正义的外观能否经得起细看，是另一个问题。并非所有预期寿命的不平等都显得不正义。比如 2018 年，全体美国女性的预期寿命为 81.2 岁，全体美国男性只有 76.2 岁（Xu et al. 2020）。这 5 岁的差距里，恐怕很少有哪部分构成不正义。然而，如果有些健康不平等并不不正义，那健康不平等就并非**本身**不正义。
  - id: 5
    kind: body
    source: |-
      So what makes a health inequality an injustice, when it is one? Do *health* inequalities have some significance in justice that differs from other important inequalities? Or is the injustice of an unjust inequality in health simply due to the application of general principles of equality and justice to the case of health?
    step1: |-
      那么，健康不平等在什么情况下才构成不正义？与其他重大不平等相比，**健康**不平等在正义中是否具有某种不同的意义？或者，一项不义的健康不平等之不义，只是把一般的平等与正义原则应用于健康情形所使然？
    step2: |-
      那么，健康不平等在何时、因何构成不正义？与别的重大不平等相比，**健康**不平等是否在正义中别具意义？抑或，一项不义的健康不平等，其不义仅仅来自把平等与正义的一般原则套到健康情形上？
  - id: 6
    kind: body
    source: |-
      To answer these questions, one has to examine two rather different literatures. On the one hand, there is an empirical literature concerning the underlying determinants of health; on the other hand, there is a philosophical literature concerned with the ethics of population health. The former literature is considerably more extensive and developed than the latter. Even there, however, the answers on offer are hardly complete or fully established.
    step1: |-
      要回答这些问题，须考察两支相当不同的文献：一支是关涉健康深层决定因素的经验文献，另一支是关涉人口健康伦理的哲学文献。前一支远比后一支广泛、成熟。但即便在前者中，可提供的答案也远非完备或充分确立。
    step2: |-
      要回答这些问题，就得考察两支相当不同的文献：一支是关于健康深层决定因素的经验文献，另一支是关于人口健康伦理的哲学文献。前者远比后者广泛、成熟；但即便在那里，现成答案也远不完备、远未确立。
  - id: 7
    kind: body
    source: |-
      ## 1. Introduction
    step1: |-
      ## 1 导论
    step2: |-
      ## 1 导论
  - id: 8
    kind: body
    source: |-
      One possible explanation for health disparities among the rich and poor is that the rich can afford better health care. Were this explanation correct, questions regarding the justice of health inequalities could be answered by resolving familiar debates about access to health care.
    step1: |-
      对贫富之间健康差距的一种可能解释是：富人负担得起更好的医疗。若此解释正确，那么关于健康不平等是否正义的问题，就可以通过解决关于医疗服务可及性的熟悉争论来回答。
    step2: |-
      对贫富健康差距的一种可能解释是：富人负担得起更好的医疗。若果真如此，那么关于健康不平等正义与否的问题，就可以归结为医疗可及性的那些熟悉争论，迎刃而解。
  - id: 9
    kind: body
    source: |-
      While unequal access to health care certainly contributes to health inequalities, epidemiologists argue that the principal causes of these inequalities lie outside of the health care system. These inequalities are largely due to the “social determinants of health”, which we will understand as the socially controllable factors outside the traditional health care system that are independent partial causes of an individual’s health status. Candidate examples of the social determinants of health include income, education, occupational rank, racism, and social class (for a brief corrective against the natural tendency to reserve a privileged position for health care here, see Marmot 2005)[^marmot-2005][^marmot-2005-2].
    step1: |-
      虽然医疗可及性的不平等确实助长了健康不平等，但流行病学家主张，这些不平等的首要原因在医疗体系之外。这些不平等主要源于“健康的社会决定因素”。我们把它理解为：医疗体系之外、可由社会控制、并且是个人健康状况之各自独立的部分原因的那些因素。健康的社会决定因素的候选例子包括收入、教育、职业等级、种族主义与社会阶层（关于克服凡事优先看待医疗之自然倾向的简要纠正，见 Marmot 2005）[^marmot-2005][^marmot-2005-2]。
    step2: |-
      医疗可及性的不平等确实助长了健康不平等，但流行病学家指出，这些不平等的主因不在医疗体系之内。它们主要出自“健康的社会决定因素”。我们把它理解为：医疗体系之外、可由社会控制、且各自构成个人健康状况之独立部分原因的因素。候选的健康社会决定因素包括收入、教育、职业等级、种族主义与社会阶层（对“凡事优先归因于医疗”这一自然倾向的简要纠正，见 Marmot 2005）[^marmot-2005][^marmot-2005-2]。
  - id: 10
    kind: body
    source: |-
      In this entry, we provide an overview of the empirical literature regarding the social determinants of health, and the philosophical literature concerning the justice of health inequalities. Although the health care system is itself a determinant of health, we largely set aside questions regarding access to health care for it is covered elsewhere (see entry on justice and access to health care). We begin with a discussion of the social gradient in health, proposed social determinants of health, and possible causal pathways by which these socially controllable factors could affect people’s health. We also discuss the normative question of whether health inequalities should be understood and measured as differences among *social groups* or differences among *individuals*.
    step1: |-
      本词条概述关涉健康社会决定因素的经验文献，以及关涉健康不平等正义性的哲学文献。医疗体系本身也是健康的决定因素，但我们基本搁置医疗可及性的问题，因为别处已有讨论（见“正义与医疗可及性”词条）。我们先讨论健康的社会梯度、被提出的健康社会决定因素，以及这些可由社会控制的健康因素可能影响人们健康的因果路径。我们还会讨论一个规范性问题：健康不平等应当被理解为并测量为社会**群体**之间的差异，还是**个体**之间的差异。
    step2: |-
      本词条概述健康社会决定因素方面的经验文献，以及健康不平等正义性方面的哲学文献。医疗体系本身也是健康的决定因素，但我们大体搁置医疗可及性问题——那里已有专文讨论（见“正义与医疗可及性”词条）。我们先讨论健康的社会梯度、被提出的各类健康社会决定因素，以及这些可由社会控制的因素影响健康之可能的因果路径。我们还将讨论一个规范性问题：健康不平等应当按社会**群体**之间的差异来理解和测量，还是按**个体**之间的差异？
  - id: 11
    kind: body
    source: |-
      We then address the central question of this entry: what makes a health inequality unjust, when it is unjust? We first focus on the justice of domestic health inequalities, providing an overview of prominent theoretical approaches to this question. Since many propose that health inequalities are not unjust when due to the voluntary choices of individuals, we next explore the issue of individual responsibility for health and its implications for health policy. We conclude with a discussion of the justice of global health inequalities.
    step1: |-
      随后我们处理本词条的中心问题：健康不平等在何时、以何种方式成为不正义？我们先聚焦国内健康不平等的正义性，概述这一问题上几种重要的理论进路。由于许多人主张，由个人自愿选择所致的健康不平等并不不正义，我们接着探讨个人对健康的责任问题及其对卫生政策的含义。最后讨论全球健康不平等的正义性。
    step2: |-
      随后处理本词条的中心问题：健康不平等何时、因何不正义？我们先聚焦国内健康不平等的正义性，概述几种重要的理论进路。不少人主张：个人自愿选择所致的健康不平等不算不正义；因此我们接着探讨个人对健康的责任及其对卫生政策的含义。最后讨论全球健康不平等的正义性。
  - id: 12
    kind: body
    source: |-
      ## 2. A Social Gradient in Health
    step1: |-
      ## 2 健康的社会梯度
    step2: |-
      ## 2 健康的社会梯度
  - id: 13
    kind: body
    source: |-
      The empirical literature’s most significant and powerful reported finding can actually be replicated with *a number of the* listed candidate social determinants of health, including income, education, occupational rank, and social class. This is the existence, within a given society, of a *social gradient* in health. The most significant evidence on the relation between a socially controllable factor and health comes from the Whitehall studies, conducted in England by Michael Marmot and his colleagues (1978). In these studies, the candidate social determinant of health is occupational rank.
    step1: |-
      经验文献最要紧、最有力的报告发现，其实可以用所列候选健康社会决定因素中的**若干项**——包括收入、教育、职业等级与社会阶层——重复出来。这就是：在任一给定社会中，健康存在一种*社会梯度*。关于某个可由社会控制的因素与健康之间关系的最重要证据，来自 Michael Marmot 及其同事（1978）在英格兰开展的白厅研究。在这些研究中，候选的健康社会决定因素是职业等级。
    step2: |-
      经验文献中最要紧、最有力的报告发现，其实可以用所列候选健康社会决定因素中的**好几项**——收入、教育、职业等级、社会阶层——各自重现。这就是：任一给定社会内部，健康都存在一种*社会梯度*。关于“可由社会控制的因素与健康之关系”的最有力证据，来自 Michael Marmot 及其同事（1978）在英格兰做的白厅研究。在这批研究中，候选的健康社会决定因素是职业等级。
  - id: 14
    kind: body
    source: |-
      Between 1967 and 1969, Marmot examined some 18,000 male civil servants aged between 40 and 69 years old. By placing a flag on their records at the National Health Service (NHS) Central Registry, Marmot was able to track the cause and date of death for each subject who later died. His data are unusually good data. To begin with, they are generated from data-points on specific individuals. Each datum reports the relation between the occupational rank of a particular person and the life-span (and cause of death) of the very same person. By contrast, almost every other study begins from aggregate data. In addition, a number of important background factors are held constant for this study population. Notably, all the subjects in this study are stably employed, they live in the same region (greater London), and all have free access to health care provided by the NHS.
    step1: |-
      1967 至 1969 年间，Marmot 考察了约 18,000 名 40 至 69 岁的男性公务员。Marmot 在国家卫生署（NHS）中央登记处给他们的档案插上标记，从而能够追踪后来去世的每位研究对象的死因与死亡日期。他的数据好得出奇。首先，这些数据来自具体个人的数据点：每一条记录报告的是某个特定人物的职业等级与同一个人寿命（及死因）之间的关系。相比之下，几乎其他所有研究都从汇总数据出发。此外，这一研究人群的若干重要背景因素被保持恒定：值得注意的是，研究对象都有稳定工作，都住在同一地区（大伦敦），并且都能免费获得 NHS 提供的医疗服务。
    step2: |-
      1967 到 1969 年间，Marmot 考察了约 18,000 名 40–69 岁的男性公务员。他在国家卫生署（NHS）中央登记处给每人的档案做了标记，后来谁去世了，就能查到死因与死亡日期。他的数据好得出奇。首先，这些数据来自具体个人的数据点：每条记录报告的都是某个人物的职业等级与同一人寿命（及死因）之间的关系；相比之下，几乎其他所有研究都从汇总数据出发。此外，这一研究人群的若干重要背景因素保持恒定：所有研究对象都有稳定工作、同住一个地区（大伦敦），且都可免费使用 NHS 的医疗服务。
