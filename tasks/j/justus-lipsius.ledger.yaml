      对利普修斯而言，理性是引导人过德性生活的那部分本性（《导论》II.17）。然而并不奇怪的是，他用《约翰福音》中基督教的 *logos* 或“上帝之道”取代了斯多亚的 *logos*。我们各自的本性作为自然或上帝的部分，其作用如同灵魂在人体中：它们就是寓于人身之中的上帝（《导论》II.19）。通过把斯多亚的 *logos* 等同于基督教的上帝，利普修斯得以与西塞罗和亚历山大的克莱门一道得出结论：斯多亚的至善等同于对上帝的信仰。德性与智慧来自一切知识的源泉：上帝。柏拉图对善的沉思与斯多亚对个体本性与普遍本性之关系的探索，都等同于对上帝及其 *logos*（基督）的研究。因此，斯多亚视为至善的德性，就是对上帝的正确态度；而这一德性是达到善的生活的唯一途径（《导论》II.19）。
    step2: |-
      利普修斯以理性为导人于德性生活之本性（《导论》II.17）。然而不奇者，彼以《约翰福音》中基督教之 *logos*（“上帝之道”）易斯多亚之 *logos*。吾人各自之本性，既为自然或上帝之部分，其用如灵魂之于人身：是即上帝寓于人身（《导论》II.19）。利普修斯既以斯多亚之 *logos* 即基督教之上帝，遂得与西塞罗、亚历山大的克莱门同断：斯多亚之至善即信上帝。德与智出于一切知识之源，即上帝。柏拉图之观善，斯多亚之究个体本性与普遍本性之关系，皆无异于研究上帝及其 *logos*（基督）。故斯多亚所谓至善之德，即对上帝之正态度；而此德乃达善生之唯一途（《导论》II.19）。
