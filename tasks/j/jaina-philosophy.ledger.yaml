      Around the 16ᵗʰ c., the world is presented in the form of a human being, thus emphasizing the similarities between the structure of the world and the inner struggle faced by each individual. Moreover, the extremely detailed depiction of the world provides a backdrop, both for the initiation tales of pious Jains found in narrative literature, and for meditative practices, some of which involve the contemplation of a holy object. Ultimately, the precision with which the authors describe the world allowed Jainism to stand out more clearly from other worldviews. Indeed, only the values of Jainism prevail in these descriptions of the universe. In this sense, the universe thus represented becomes an emblem of religious identity, as well as a guide to religious practice, because, above all else, the Jaina world is the abode of beings on the path of liberation (Dundas 2005)[^dundas-2005].
