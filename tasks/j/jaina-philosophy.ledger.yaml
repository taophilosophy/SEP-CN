      最后，时间是说明生成者。时间不与其他实体同列处理，因为它没有广延。由此，它并不被当作严格意义上的实体，只在某些方面被如此看待。尤其，它的存在只能从我们对现象的觉知中外推。有一种绝对时间（*kāla*），它是永恒的；还有一种相对时间（*samaya*），有开端、有变易，由事物中的运动所决定。时间被称为毁灭者，因为一切事物在时间的循环进程中都难逃形态的解体。
