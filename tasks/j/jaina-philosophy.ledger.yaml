      Besides, after Mahāvīra’s liberation, liberation is not possible anymore in our realm for cosmic reasons. However, there are other realms, in which gods and demons notably live. Jainas have developed a complex model of the universe (Dundas 2005)[^dundas-2005]. Canonical literature (3ʳᵈ century BCE—6ᵗʰ century CE) already includes description of the universe, but it is between the 3ʳᵈ and the 13ᵗʰ centuries CE that specialized texts specifically dedicated to cosmography are composed, amongst them, the influential *Compendium of Middle Earth* (*Jambūdvīpasaṃgrahaṇī* [JDS]) of Haribhadra Sūri (770 CE). There, the universe is described as being constituted of two parts. On one hand, the world (*loka*), extremely vast, but finite, is occupied by living beings and by things; on the other hand, the rest (*aloka*) surrounds the world with its infinite and empty space.
