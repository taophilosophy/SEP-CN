  - id: 1
    kind: body
    source: |-
      The Jains are those who consider that the teaching of the omniscient Jinas is the expression of the eternal essential nature of the universe. The only extant teaching is that of Mahāvīra (traditional dates 599–527/510 BCE, in Magadha, South of modern Bihar), the last Jina of the current cosmic period.
    step1: |-
      耆那教徒是这样一些人：他们认为，全知的耆那（胜者）们的教法，乃是宇宙永恒本质的表达。现存唯一的教法是大雄的教法（传统纪年公元前 599–527/510 年，活动于摩揭陀，今比哈尔邦南部），他是当前宇宙周期的最后一位耆那。
    step2: |-
      耆那教徒认为：全知的耆那（Jina，胜者）之教法，即是宇宙永恒本质的表达。现存于世的唯一教法出自大雄（Mahāvīra；传统纪年为公元前 599–527/510 年，活动于摩揭陀，即今比哈尔邦南部）——他是当前宇宙周期的最后一位耆那。
  - id: 2
    kind: body
    source: |-
      In their practice, Jaina renunciants follow a rigorous method towards salvation, in which a non-violent way of life, the renunciation from a worldly ego, the dissociation of self and non-self, and a gradual purification of the self towards unobstructed knowledge, become as many different facets of the same effort to access to a superior order of being in which each self manifests its true nature.
    step1: |-
      在实践中，耆那教出家人遵循一种趋向救赎的严格方法：非暴力的生活方式、舍弃世俗自我、自我与非我的分离，以及自我向无碍之知的逐步净化——这些都构成同一努力的诸多不同侧面，即通达一种高等的存在秩序，在其中每个自我都显现其真实本性。
    step2: |-
      在实践中，耆那教出家者遵循一套趋向解脱的严格方法：非暴力的生活方式、舍弃世俗自我、自我与非我的分离、自我朝无碍之知的逐步净化——凡此种种，皆是同一种努力的诸多侧面：通达一种更高的存在秩序，使每个自我在其中显现其真实本性。
  - id: 3
    kind: body
    source: |-
      This path came to involve structured monastic and lay communities; sets of practices—ritual and devotional acts, ascetic practices, rules of life; as well as conceptions of the world deposited in canonical and post-canonical corpuses, in systematic treatises, or in narrative literature. Jaina Philosophy is the set of philosophical investigations developed by thinkers as they appear in these different corpuses (Malvania & Soni 2007; Potter & Balcerowicz 2013, 2014)[^malvania-2007][^potter-2013]. While several trends can be observed from the canonical period to modern thinkers via the mystics, the following principles are shared: Jaina metaphysics is an atomist and dualist conception of the world, it focuses on the nature of the self, on that of karmic matter, as well as on their principles of association. Jaina ethics consists of practices focused on non-violence, non-absolutism and non-attachment, which aim to disentangle the self and karmic matter and which help one to reach omniscience. Besides, Jaina philosophers are particular renown for developing a realist epistemology centered on “many-sidedness”.
    step1: |-
      这条道路逐渐发展出组织化的僧团与在家信众社群、一整套实践——仪轨与虔敬行为、苦行、生活规条——以及贮存于正典与后正典文献群、系统论书或叙事文学中的世界观。耆那教哲学就是思想家们在这些不同文献群中展开的哲学探究之总和（Malvania & Soni 2007; Potter & Balcerowicz 2013, 2014）[^malvania-2007][^potter-2013]。从正典时期经神秘主义者直到近代思想家，虽可辨出若干不同思潮，但以下原则为共享：耆那教形而上学是一种原子论与二元论的世界观，聚焦于自我的本性、业质的本性，以及二者结合的原理。耆那教伦理学由聚焦于非暴力、非绝对主义与不执著的实践构成，其目标在于解开自我与业质的纠缠，并助人达到全知。此外，耆那教哲学家尤以发展一种围绕“多面性”的实在论知识论而著称。
    step2: |-
      这条道路逐渐发展出组织化的僧团与在家社群、成套的实践——仪轨与虔敬行为、苦行、生活规条——以及沉淀于正典与后正典文献、系统论书和叙事文学中的种种世界构想。耆那教哲学，就是思想家们在这些不同文献群中展开的诸种哲学探究（Malvania & Soni 2007; Potter & Balcerowicz 2013, 2014）[^malvania-2007][^potter-2013]。从正典时期、经神秘主义者、直至近代思想家，虽可见若干不同思潮，但以下原则为各家所共享：耆那教形而上学是一种原子论而二元论的世界构想，聚焦于自我的本性、业质的本性，以及二者相结合的原理。耆那教伦理学则由聚焦非暴力、非绝对主义与不执著的实践构成，旨在解开自我与业质的纠缠，助人达于全知。此外，耆那教哲学家尤以发展出一种以“多面性”为中心的实在论知识论而著称。
