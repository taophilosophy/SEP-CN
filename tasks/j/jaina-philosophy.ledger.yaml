      Third, we said that liberated beings were absolutely isolated not interacting life-monads. However, one reaches a state of experience of absolute cognition before reaching liberation. More precisely, when all knowledge obscuring karmas are removed, one still has to wait for a long time for non-harming karmas to also be exhausted. This is within this laps of time that the teaching of the Jinas happens.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Fourth, direct disciples of the liberated beings also experience extra mundane types of cognition, although lesser ones. This make them the perfect medium to interpret the sacred teaching and transmit it to us. In such a way that “correct interpretation depends upon a teacher-pupil lineage or upon one”s own seniority and wisdom’ (Jyväsjärvi 2010)[^jyväsjärvi-2010]. Indeed, an advanced monk is by definition both more knowledgeable and less deceptive (Flügel 2010 [2016])[^flügel-2010]. The fact that one can access soteriological relevant knowledge thanks to monks who are living members of a lineage of interpretation is in part what explains the importance of theories of interpretation in Jaina philosophy, as well as the fact that the commentaries are regularly more important than the canon itself.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      In the *Manual for the behavior of laymen which is casket of jewel* (*Ratna-karaṇḍa-śrāvakâcāra* [RKŚĀ]), Samantabhadra (530–590 CE) characterizes the authoritative teacher in the following way:
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      > - RKŚĀ 1.6. This one is called the reliable one who has no hunger, thirst, old age, affliction (of body and of mind), birth, death, fear, pride, attachment, aversion, delusion.
    step1: TBD
    step2: TBD
  - id: 96
