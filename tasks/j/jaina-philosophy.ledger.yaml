      We have just seen that the Jaina ethical effort is focused on distinguishing what is the self from what it is not. This is what explains that Jaina metaphysics is regularly presented as a dualism that conceives the world a resulting from the activity of the elements belonging to these two everlasting uncreated coexisting and independent categories (Dixit 1971)[^dixit-1971]. This conception is close to that of Sāṃkhya philosophy, which admits of two irreducible categories, namely the Experiencer (*puruṣa*) and the Experienced (*prakṛti*), and which considers philosophy as the activity whose main goal is the disentanglement of these two categories. Now, besides these shared fundamental conceptions, both classifications deeply diverge (Bronkhorst 2007)[^bronkhorst-2007].
    step1: |-
      我们刚看到，耆那教的伦理努力聚焦于区分何为自我、何者不是。这解释了为何耆那教形而上学常被呈现为一种二元论：它把世界构想为源自这两大永恒、非受造、并存且独立之范畴的元素的活动（Dixit 1971）[^dixit-1971]。这一构想接近数论哲学（Sāṃkhya）：数论承认两个不可还原的范畴，即经验者（*puruṣa*）与被经验者（*prakṛti*），并视哲学为一种活动，其主要目标是解开这两大范畴的纠缠。不过，在这些共有的基本构想之外，两种分类深刻分歧（Bronkhorst 2007）[^bronkhorst-2007]。
    step2: |-
      上文刚看到，耆那教的伦理努力聚焦于区分何为自我、何者不是。这解释了为何耆那教形而上学常被呈现为一种二元论：世界被构想为源自这两大永恒、非受造、并存且独立之范畴的诸元素的活动（Dixit 1971）[^dixit-1971]。这一构想接近数论（Sāṃkhya）：数论承认两个不可还原的范畴，即经验者（*puruṣa*）与被经验者（*prakṛti*），并视哲学为一种活动，其主旨在于解开这两大范畴的纠缠。不过，在共有这些基本构想之外，两种分类学深刻分歧（Bronkhorst 2007）[^bronkhorst-2007]。
