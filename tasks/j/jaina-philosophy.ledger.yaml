  - id: 7
    kind: body
    source: |-
      Jaina teaching firstly aims to promote a type of behavior, a method to concretely modify an unsatisfying situation, not by modifying one’s environment, but by modifying oneself. More precisely, individuals aim at freeing themselves from the infinite cycle of painful rebirths. In order to achieve this, they are meant to progress within a spiritual path thanks to an internal sacrifice based on ascetic practices of renunciation. The Jain who aspires to final emancipation abandons worldly life, notably all her possession. This correct behavior (*samyak carita*) consists in an extreme self-control. Jainism is an arduous path, in which the disciple needs methods to assist her, as described in length notably in the *Later Chapters* (*Uttarādhyayana*, 2ⁿᵈ century BCE–1ˢᵗ century CE [Utt.]). One such method is an incitement to cultivate a pessimistic attitude towards the world. For example, the twelve contemplations (*anuprekṣā*), which are pre-meditative states, are incitements towards the contemplation of human beings and of their relation to the surrounding world, which prompt the awareness that:
    step1: |-
      耆那教教法首先志在推行一种行为方式，一种具体改善不满处境的方法：不是改造环境，而是改造自身。更确切地说，个体志在将自己从无尽的痛苦转生循环中解放出来。为此，他们应当依托一种基于出离苦行的内在牺牲，沿一条精神道路逐步前进。志在最终解脱的耆那教徒放弃世俗生活，尤其是放弃其全部所有。这种正确行为（*samyak carita*）在于极度的自我克制。耆那教是一条艰难的道路，门徒需要辅助方法，这一点在《后章》（*Uttarādhyayana*，公元前 2 世纪—公元 1 世纪［Utt.］）中有详尽描述。方法之一，是劝勉人对世界持一种悲观态度。例如十二随念（*anuprekṣā*）——它们是禅定前的心境——劝勉人观照人及其与周围世界的关系，促生如下觉知：
    step2: |-
      耆那教教法首先志于塑造一种行为方式——一种具体改善不满意处境的方法：不是改造环境，而是改造自己。确切说，个体志在挣脱无尽而痛苦的转生循环。为此，他们须沿一条精神之路渐次前行，所依是一种以出离苦行为基础的内在牺牲。志在最终解脱的耆那教徒舍弃世俗生活，尤其是舍弃自己的全部所有。这种正行（*samyak carita*）就在于极度的自我克制。耆那教是一条艰辛之路，门徒需要种种方法相助，这一点在《后章》（*Uttarādhyayana*，公元前 2 世纪—公元 1 世纪［Utt.］）中有长篇描述。其中一种方法，是劝人对世界培养一种悲观的态度。例如“十二随念”（*anuprekṣā*）——它们是入禅前的心境——引人观照人与其周遭世界的关系，促生如下觉知：
  - id: 8
