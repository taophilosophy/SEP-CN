      Concretely, to get closer to the realization of our real nature consists of being aware of the presence of other selves in living beings around oneself and of acting in a non-harming way towards them. This gave rise to practices of renunciation:
    step1: |-
      具体而言，更接近我们真实本性的实现，在于觉知周遭有情之中其他自我的在场，并以不加害的方式对待他们。由此生发出种种出离实践：
    step2: |-
      具体而言，欲更接近真实本性之实现，就要觉知周遭有情之中其他自我的在场，并以不加害的方式对待它们。由此生出种种出离实践：
  - id: 13
    kind: body
    source: |-
      1. practices of non-violence, such as not eating meat, not drinking non-filtered water containing microscopic forms of life, or walking with extreme caution and restrictions;
      2. practices towards self-control, like meditation or mortification of the flesh;
      3. practices of abstinence, in the line of no sexual intercourse, no food for given periods of time, non-possession up to the nudity of some monks; and
      4. penances, today mainly consisting in fasts and recitation of prayers.
    step1: |-
      1. 非暴力的实践，例如不食肉、不饮未经滤净的含微生物之水，或以极度的谨慎与限制行走；
      2. 自我克制的实践，如禅定或苦磨肉体；
      3. 禁绝的实践，包括不行淫、按时绝食、以至于某些沙门的无所有与裸形；以及
      4. 苦行，今日主要以斋戒与诵祷构成。
    step2: |-
      1. 不害的实践，例如不食肉类、不饮未滤净的含微生物之水、行走时极端谨慎且多所限制；
      2. 趋向自我克制的实践，如禅定或苦磨肉体；
      3. 禁绝的实践：不行房事、定期绝食、弃绝所有——某些沙门直至裸形；以及
      4. 苦行，今日主要表现为斋戒与诵祷。
  - id: 14
    kind: body
    source: |-
      One can only notice the strict character of these norms of action. Jaina thinkers have developed thorough classifications as a backdrop of these norms (Balbir 1999)[^balbir-1999]. First, classifications on the types of violence to be avoided, that include not only direct harmful acts, but also delegated ones, as well as the bare fact of permitting a harmful act by letting it happen. Besides, acts can be physical, verbal or mental ones. This forms the ground of a moral theory in which our responsibility extends far beyond commonly shared conceptions.
    step1: |-
