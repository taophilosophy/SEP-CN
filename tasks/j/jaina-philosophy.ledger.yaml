      2. Metaphysical investigations focus on the world *qua* knowable. For example, Jainas derive the expression “*loka*”, “the universe”, not from the Sanskrit etymology “open space”, but from the root “*lok*-”, “to see”, inasmuch as the universe is conceived as “that which is seen by the omniscient one” (Dundas 2002)[^dundas-2002]. In general, theories of karma blur the distinction between epistemology and metaphysics.
