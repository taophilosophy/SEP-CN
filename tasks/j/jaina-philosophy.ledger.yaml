      The beginning of an answer to this question can be found in a second tradition, next to that of the *Treatise on What There Is*. This tradition is that of Kundakunda. “Kundakunda” is actually not a single author, but the name that stands for the collective authorship of a Jaina textual tradition composed in Prakrit (Jaina Śaurasenī) between the third and the eighth centuries CE around Karnataka in the South of India (Balcerowicz 2017)[^balcerowicz-2017]. Kundakunda’s textual tradition is as influent as the TS, and is regularly revered as sacred texts in Jaina temples. This textual tradition represents within Jainism a movement focused on the self, in which the religious practice that matters is the inward experience that is self-knowledge. The central teaching of Kundakunda in his *Essence of the self* (*Samayasāra* [SSā]) is that karmic matter is never genuinely mixed with the self. Therefore, it is close to Sāṃkhya conceptions, while keeping the Jaina specificity of an essentially active self (Bronkhorst 2010)[^bronkhorst-2010]. There, the self is modified by modifications of consciousness (*adhyavasāna*) and by states (*bhāva*). However, it is possible to distinguish between different types of activities, some of them not bringing about karmic retribution. And this is exactly Kundakunda’s move when he redefines the self as not the agent of what happens in the material world of karma. For him, the self is active only in its own domain. Concretely, the self is the material cause only of the modifications of consciousness, while karmic matter is the indirect instrumental cause of wrong modifications of it. In turn, the self is the indirect instrumental cause of karmic modifications, but only as a king indirectly causes the virtue in his subjects when he acts in a virtuous way and is taken as a model.
