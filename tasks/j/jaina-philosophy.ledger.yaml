      #### 3.4.1 On making distinctions
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      This complexity of the object of knowledge in Jaina philosophy has a deeply ramified history. At the time of Mahāvīra around the fifth–sixth centuries BCE, a practice was observed in the numerous movements of wandering mendicants: instead of answering philosophical questions in a one-sided way, the teacher was analyzing (*vibhajya*) them, showing their different presuppositions and possible meanings. Probably inherited from exegetical practices of interpretation of sacred texts, which dominantly consisted in analyzing the many perspectives that one could have on a single sentence. In Jainism, one of the most famous examples of this practice is to be found in the *Venerable Exposition of teaching* (*Bhagavatīsūtra*, or *Vyākhyāprajñaptisūtra* [Viy.]; old parts 5ᵗʰ–2ᵗʰ centuries BCE, new 2ⁿᵈ century BCE to 1ˢᵗ century CE), in which the disciple Indrabhūti Gautama asks to the monk Jamāli:
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      > > Is the “*loka*” (here meaning both “world” and “self”) eternal or is it, Jamāli, non-eternal?
      >
      > Being asked in this manner, Jamāli was doubtful and wanted to know, but was overwhelmed with confusion. He was unable to speak in reply and remained silent. When Jamāli was confused, Bhagavān Mahāvīra addressed him as follows:
      >
      > > The world is, Jamāli, eternal […] it was, it is and it will be […].
      > >
      > > The world is, Jamāli, non-eternal. For it becomes progressive after being regressive. And it becomes regressive after being progressive.
      > >
      > > The soul is, Jamāli, eternal. For it did not cease to exist at any time.
      > >
      > > The soul is, Jamāli, non-eternal. For it becomes animal after being a hellish creature, becomes a man after becoming an animal and it becomes a god after being a man.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      So in this example, the Jaina teacher insists on the fact that:
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      - with respect to its substance, the self is eternal, like atoms are.
      - but with respect to its modes, the self is non-eternal, like combinations of atoms.
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      Here, Mahāvīra does not make contradictory predications, but he refutes extremes views, which are considered as wrong, by making explicit the parameters of the different predications. It is interesting to notice that at the same period, the Buddha, who also uses distinctions of the sort in his speech, is known to refuse to answer questions of the sort (Matilal 1981)[^matilal-1981].
    step1: TBD
