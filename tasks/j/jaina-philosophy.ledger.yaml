    source: |-
      A peculiarity of Jainism is to essentially associate these renunciatory liberating practices with the imperative of non-violence (*ahiṃsā*) (Donaldson & Bajželj 2021)[^donaldson-2021]. More precisely, at the heart of Jainism is the belief according to which each living being is the transitory embodiment of a permanent divine-like self (*jīva*), which is unobstructed consciousness. In this conception, a human being can clear her self from all the obstructions she currently experiences until she becomes the unobstructed consciousness she essentially is. Now, this conception also implies the non-harming (*ahiṃsā*) of the other divine-like selves which, in turns, implies a constant awareness of their presence and true nature, as well as self-mastery and careful behavior. In one of the most ancient Jaina texts, the *Canonical Text on Behavior* (*Ācārāṅgasūtra*, ĀS), written in early Ardhamāgadhī around the 4ᵗʰ–3ʳᵈ centuries BCE, practices conducive to liberation are presented in the following way:
    step1: |-
      耆那教的一个独特之处，在于把这些出离性的解脱实践与非暴力的诫命本质性地关联起来（*ahiṃsā*）（Donaldson & Bajželj 2021）[^donaldson-2021]。更确切地说，耆那教的核心信念是：每个有情都是一种恒常的、似神的自我（*jīva*）的暂时化身，而此自我即是无碍的意识。在这一构想中，人可以清除其自我当下经历的一切障碍，直至成为其本质所是的那个无碍意识。这一构想同时蕴涵着对其他似神自我的不加害（*ahiṃsā*），而这又蕴涵着对其在场与真实本性的恒常觉知，以及自我克制与谨慎的行为。在 最古老的耆那教文献之一、《行为经典》（*Ācārāṅgasūtra*，ĀS；以早期半摩揭陀语写成于约公元前 4–3 世纪）中，导向解脱的实践被呈现如下：
    step2: |-
      耆那教的一大特质，是把这类出离性的解脱实践与非暴力（*ahiṃsā*，不害）的诫命本质地绑在一起（Donaldson & Bajželj 2021）[^donaldson-2021]。确切地说，耆那教的核心信念是：每个有情都是其恒常的、似神的自我（*jīva*）的暂时化身，而这自我本是无碍的意识。按这一构想，人可以一层层清除其自我当下所受的障碍，直至成为其本质所是的无碍意识。此构想同时蕴涵：对其他似神自我不加害（*ahiṃsā*）；而这又蕴涵对它们之在场与真实本性的恒常觉知，以及自我克制与谨慎行事。在最古老的耆那教文献之一——《行为经典》（*Ācārāṅgasūtra*，ĀS；以早期半摩揭陀语写成于约公元前 4–3 世纪）——之中，导向解脱的诸实践被呈现如下：
