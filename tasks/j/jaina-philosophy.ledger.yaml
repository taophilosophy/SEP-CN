      #### 3.4.2 From the paradoxes of causation to accounting for change and persistence
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Now, this way of making distinctions in predication should be thought of in close connection with considerations about causation. Indeed, the Jaina teacher also insists on the fact that one can give a proper account of a causal process only when one acknowledges both persistence and change.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      To explain, it is not so obvious that we are legitimate in considering ourselves as being the same individual in time, since after all, the cells in our body are continuously replaced, none of the cells that currently constitute me will exist in seven years, each will have been renewed. Conversely, how are we to account for change? Any mechanical explanation of it fails, like Zeno’s arrow that has to travel half the way before it meets its target, but before it meets the half, it has to travel half the half, and before that, half of the half of the half, and so, *ad infinitum*, without being able to even start the movement. There is a problem with our way of accounting for change. Noticing this state of affair, South Asian philosophers engaged in raging debates around the paradoxes of causality at the turn of the CE. In a nutshell, if someone says “the potter makes the pot”, there are several types of possible stance on this:
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      - one can say that the effect “pot” already exists prior to the fruition of its immediate cause;
      - one can say that it does not, hence the relevance of the causation process;
      - some that it is neither existent, nor non-existent before the causation process;
      - and one can also say that it both exists and does not exist prior to that.
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      While philosophers from different lineages have been variously depicted as holding one or the other of these alternatives, Jainas are consistently depicted as holding the last one and it is regularly considered as a Jaina specificity to hold that something both exists and does not exist prior to the causation process. But of course, Jains are far from being the only ones to claim so. Besides, they claim more precisely that what exists is at once originating, decaying and persisting in an essential and simultaneous way:
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      > - TS 5.29. Existence is endowed with production, decay and duration.
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      Indeed, any existing entity is both made of permanent atoms, sometimes including a permanent self; and partaking to the manifold and changing world we experience (Soni 1991)[^soni-1991]. Here, while it is produced:
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      - the pot is already existent with respect to its substance (*dravya*), the clay;
      - yet formerly non-existent with respect to its particular modes (*paryāya*; *guṇa*): shape, function, etc.
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      Jaina philosophers insist on the fact that none of these aspects is more important than the other one. This means that substance and mode co-exist not *in*, but *as* a single discrete entity in Jainism. This single discrete entity is called a many-sided object of knowledge (*prameya*, *vastu*). This is the famous doctrine of the many-sidedness of things (*anekāntavāda*). It notably goes against the Vaiśeṣika conception, according to which qualities, like “being ochre”, exist independently of substances like “pots”, and are linked with them thanks to a relation of inherence. It also goes against the Buddhist conception, according to which only what is a non-complex unity is real (Gorisse 2022b)[^gorisse-2022b]. By the way, Jainas are realist philosophers who consider that human beings know a world that exists in its particularity independently of their knowledge of it, in such a way that the fact that our assertions can be specified following many perspectives can only come from the fact that the known object itself has many aspects.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      #### 3.4.3 Existence, non-existence, and the modes of predication
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      Now, this conception led Jaina thinkers to claim that what surrounds us is at the same time existent and non-existent. Because, this complex object is existent as permanent with respect to its substance, yet non-existent as permanent with respect to its states. The Jaina author who spends the most time on elucidating in which sense existence and non-existence can be predicated to an object is probably Haribhadrasūri in his *Victory banner of the theory of non-one-sidedness* (*Anekāntajayapatākā* [AJP]) (Mundra 2022; Van Den Bossche 1995)[^mundra-2022][^van-1995]. Now, Jainas are known to go further and to introduce not two, but seven modes of predication. Haribhadra is deeply influenced by the *Investigation on Authority* (*Āptamīmāṃsā* [Āmī]) of Samantabhadra, which is amongst the first to teach that:
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      > - Āmī 14. An entity is somehow possessed of the character “being”, somehow possessed of the character “non-being”, somehow possessed of both, and somehow indescribable—all these four features characterizing it in accordance with the speaker’s intention and not in an absolute fashion.
      > - Āmī 15. Certainly, who will not allow that an entity is possessed of the character “being” so far as its own form etc. are concerned; while it is possessed of the character “non-being” so far as opposite is the case? For if that be not so, this entity will not be viewed as having a fixed nature of its own.
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      This means that existence is a property of something, inasmuch as this thing exists in relation to the substance, locus, time and state that are its own. In this dynamic, existence is identity with oneself. While non-existence is difference, and accounts for change. We need to recognize the non-existence of the thing in relation with forms, etc. which are alien to it. As such, the not-being blue is part of the essence of the red pot. Only thanks to this can the thing have that particular essence, because something is what it is *as opposed to* what it is not. This is close to the Mīmāṃsā doctrine of identity in difference (*bhedābheda*) (Uno 1997)[^uno-1997]. Now, when we act in our every day life, our decisions involve objects more complex than that, i.e., objects which are existent with respect to some parameters and non-existent with respect to other parameters. Besides, also inexpressibility is somehow a property of the thing, in the sense that sometimes, existence and non-existence are considered simultaneously, and that this is impossible to express. In my everyday life, I act being surrounded by things which are all this, this is why existence, non-existence and inexpressible combine into not two, but seven modes of predication, namely, I can say that something exist; does not exist; exist and does not exists; is inexpressible; exist and is inexpressible; does not exist and is inexpressible; or exist, does not exist and is inexpressible.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
