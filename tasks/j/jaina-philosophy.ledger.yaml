      To summarize, we have seen in the *Treatise on What There Is* that karmic matter and the self intermingle in the same way some liquids do, since their respective nature is not modified by this mixture and can get separated. Indeed, in muddy water, water actually stays water; while sedimentary dust actually stays sedimentary dust. Then, we have seen that in the *Essence of the self*, the association between the self and karmic matter can be though of in terms of kings acting as models. Another metaphor is that of a mirror-like crystal: if a flower reflected in a crystal is red, we see the crystal as if it was red, while it is not. Likewise, the self sees attachment and wrong notions superposed with it, not being it. All in all, in both textual lineages, what really matters is that the two—self and karmic matter—keep their essential distinct natures. Besides, the world is a whole in which things are mechanically combined together. Even though the types of substances are radically separated, they co-exist within the same conditions and so they experience synchronized modifications (Gorisse 2019)[^gorisse-2019].
