      The fact that the authoritative speaker is presented as a God-like entity who has moral aptitudes before he has intellectual ones, since, as we have seen, this is a step to reach unobstructed, absolute, knowledge, has a series of consequences on Jaina epistemology (Gorisse 2022a)[^gorisse-2022a]. Especially, since these liberated beings have no intention, an authoritative teacher who gives instructions does good to the people without being motivated by passions. He acts for the benefit of humanity on account of his very nature, like a drum giving out sound at the touch of a beater does not want anything for itself:
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      > - RKŚĀ 1.8. Un-egoistically and dispassionately a teacher instructs from truth what is suitable. What (else) does a *muraja*-drum require to sound but the touch of a skillful hand?
    step1: TBD
    step2: TBD
  - id: 98
