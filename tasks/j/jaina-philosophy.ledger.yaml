      In Jainism, the self (*jīva*) is more precisely unobstructed consciousness that concretely experiences cognition and perception. It is also what desires pleasure, reads pain, acts beneficially or harmfully and experiences the fruit thereof. In other words, being an influential active self is a condition of possibility for the individual to make or unmake herself in the world, which is perceived by Jains as a condition of possibility for ethical responsibility. Here, their conception differs from the one of Sāṃkhya philosophers, who consider that in deepest reality, the self has never acted, and that all perceived activity is actually performed by non-self stuff trying to imitate the self. From this, selves have never genuinely been bound by karma, and realizing this proper nature of things thanks to the yogic practice of meditation is alone sufficient to free from rebirth and karmic retribution. For more on yoga and meditative practices in Jainism, see the *Treatise on yoga* (*Yogaśāstra* [YŚ]) by Hemacandra (1089–1172) (Chapple 2016; Tatia 1951)[^chapple-2016][^tatia-1951].
    step1: |-
      在耆那教中，自我（*jīva*）更确切地说是无碍的意识，它具体地经验认知与知觉。它也是欲求快乐、感受痛苦、行益行害并经验其果者。换言之，作为一个有影响的能动自我，是个体在世界中成就自己或毁弃自己的可能条件——耆那教徒视之为伦理责任的可能条件。在此，他们的构想有别于数论哲学家：数论认为在最深的实在中，自我从未行动，一切被知觉的活动实则由试图模仿自我的非我之质所执行。由此，自我从未真正被业系缚；凭借禅定的瑜伽修习认识到这一事物的本性，便足以解脱于转生与业的报应。关于耆那教的瑜伽与禅修实践的更多内容，见诃摩旃陀罗（Hemacandra，1089–1172）的《瑜伽论》（*Yogaśāstra*［YŚ］）（Chapple 2016; Tatia 1951）[^chapple-2016][^tatia-1951]。
    step2: |-
      在耆那教中，自我（*jīva*）更确切地说，是无碍的意识，具体地经验着认知与知觉。它也是欲求快乐、感受痛苦、行益行害并经验其果者。换言之，作为一个有影响力的能动自我，是个体在世界中成就自己或毁弃自己的可能条件——耆那教徒视之为伦理责任的可能条件。在此，他们的构想有别于数论哲学家：数论认为，在最深的实在中，自我从未行动；一切被知觉的活动，实则由试图模仿自我的非我之质所执行。由此，自我从未真正被业系缚；凭禅定这一瑜伽修习认识到事物的这一本性，便足以解脱于转生与业的报应。关于耆那教瑜伽与禅修实践的更多内容，见诃摩旃陀罗（Hemacandra，1089–1172）《瑜伽论》（*Yogaśāstra*［YŚ］）（Chapple 2016; Tatia 1951）[^chapple-2016][^tatia-1951]。
