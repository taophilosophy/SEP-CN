      It is now clear that Jaina philosophy is essentially directed at the individual effort of distinguishing the self and non-self stuff, until one reaches liberation. Besides, the self is traditionally defined as experience of consciousness, which consists in cognition (*jñāna*) and indeterminate perception (*darśana*). This will bring epistemological considerations at the core of Jaina philosophical investigations. First, there are many classifications of the different types of knowledge recognized by Jaina philosophers. The *Treatise of What There Is* attempts at collecting and organizing the types of knowledge mentioned in earlier literature into four types of indeterminate perception, whose study is not developed; and eight types of cognition, namely ordinary cognition of the senses, testimonial cognition, mental cognition, cosmic cognition, absolute cognition, and their faulty counterparts, namely wrong ordinary cognition of the senses, wrong testimonial cognition and wrong mental cognition (Shastri 1990; Balcerowicz 2017; den Boer 2020)[^balcerowicz-2017][^boer-2020][^shastri-1990].
    step1: TBD
    step2: TBD
