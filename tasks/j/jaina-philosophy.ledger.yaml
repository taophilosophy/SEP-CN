      Finally, atoms can contract and expand. When in subtle state, innumerable atoms occupy the space of one gross atom. Matter is an eternal substance undetermined with regards to quantity and quality. It is because the atoms in it can expand that matter may increase or diminish in volume without addition or loss of particles. For a self, which also is an atom and which has dimensions although it is not material, this means that it is capable of expansion and contraction. The self is actually co-extensive with the physical body it occupies. This is what explains that we have sensations from the top of the head to the tip of the toes. This means that the self is of a very small size when it starts in the womb, then it expands and, at the end of each earthly life, it contracts again into the seed of the next birth. To explain how this works, Jaina philosophers use metaphors such as that of a lamp: whether placed in a small pot or in a larger room, a lamp illumines the whole space. In the same way, the self imparts consciousness according to the dimensions of the body it occupies. Another specificity of Jainism is the belief according to which, under special circumstances, an embodied self can expand beyond its body, up to the size of the universe, and act outside of it. This projection, called “*samudghāta*”, “extermination”, enables her to annihilate specific karmic matter (Pragya 2021)[^pragya-2021].
    step1: |-
      最后，极微能收缩与膨胀。处于精微状态时，无数极微占据一个粗大极微的空间。质料是一种在量与质上皆未确定的永恒实体。正因为其中的极微能够膨胀，质料才能在不增减微粒的情况下增减体积。至于自我——它也是极微，虽非质料却有广延——这意味着它能膨胀与收缩。自我实际上与它所占据的身体同其广延。这解释了为何我们的感觉从头顶直达脚尖。这意味着：自我在子宫中初成时尺寸极小，随后膨胀，而在每段尘世生命终结时又收缩为下一次转生的种子。为说明这一点，耆那教哲学家使用灯的比喻：无论置于小罐还是较大的房间，一盏灯照亮整个空间。同样，自我按其所占据身体的广延来赋予意识。耆那教的另一特质是如下信念：在特殊情形下，具身自我能膨胀到身体之外、直至宇宙之大，并在其外行动。这种投射称为 *samudghāta*（“消灭”），使她能消灭特定的业质（Pragya 2021）[^pragya-2021]。
