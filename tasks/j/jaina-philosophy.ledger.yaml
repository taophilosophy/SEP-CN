      遵循这些行为规范之困难，在耆那教的世界构想中引发了两个重要变化（Johnson 1995）[^johnson-1995]。其一，早期正典中，暴力行为是系缚的唯一直接因素；而后出的正典文献中，激情开始扮演重要角色——这意味着伤害的意图被纳入系缚的计核。在这一动态中，非故意伤害行为可以得到宽恕。其二，遵循这些规范之困难，正是耆那教哲学家的多面视角立场得以出现的领域之一：同一行为从某一视角可被判定为有害，从另一视角却可被判定为无害——因而被许可。
