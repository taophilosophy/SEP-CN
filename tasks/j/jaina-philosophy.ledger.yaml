      The difficulty of following these norms of action gave rise to two important changes in Jaina conceptions of the world (Johnson 1995)[^johnson-1995]. First, in early canons, violent acts are the only direct factors of bondage; while in later canonical texts, passions came to play an important role, which means that one’s intention to harm is valued in the calculus of one’s bondage. In this dynamic, non-intentional harmful act can be forgiven. Second, the difficulty to follow these norms is one of the fields in which the many-sided perspectival stance of Jaina philosophers emerged, since an action can be qualified as harmful from a given perspective, while qualified as non-harmful—therefore permitted—from another perspective.
