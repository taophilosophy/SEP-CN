    source: |-
      Jaina philosophy is composed in Ardhamāgadhī, Jaina Māhārāṣṭrī, Śaurasenī, Sanskrit, Apabhraṃśa, Braj Bhāṣā, Kannada, Tamil, Gujarati, Hindi, to quote only the main languages. This entry provides Sanskrit terms only, because Sanskrit became the *lingua franca* of philosophical inter-doctrinal discussions in South Asia at the turn of the common era.
    step1: |-
      耆那教哲学以多种语言写成——仅举主要者：半摩揭陀语（Ardhamāgadhī）、耆那马哈拉施特里语（Jaina Māhārāṣṭrī）、绍拉塞尼语（Śaurasenī）、梵语、阿帕布朗舍语（Apabhraṃśa）、布拉贾语（Braj Bhāṣā）、坎纳达语、泰米尔语、古吉拉特语、印地语。本词条只提供梵语术语，因为在公元前后之交，梵语已成为南亚哲学教义论辩的通用语（*lingua franca*）。
    step2: |-
      耆那教哲学以多种语言写成，仅举其要者：半摩揭陀语（Ardhamāgadhī）、耆那马哈拉施特里语（Jaina Māhārāṣṭrī）、绍拉塞尼语（Śaurasenī）、梵语、阿帕布朗舍语（Apabhraṃśa）、布拉贾语（Braj Bhāṣā）、坎纳达语、泰米尔语、古吉拉特语与印地语。本词条只给出梵语术语：因为自公元前后之交起，梵语已成为南亚诸学说哲学论辩的通用语（*lingua franca*）。
