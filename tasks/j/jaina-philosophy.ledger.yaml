      One consequence is that in Jainism, testimonial cognition can be considered as a proper means of knowledge, because knowledge acquired thanks to the teaching of an authoritative person is proper knowledge of what exists *as it is*, and not knowledge of what exists *as intended*. Now, this holds only if he authoritative speaker belongs to the very specific category of speakers that we have seen. This has the consequence that what is recognized as an authoritative discourse are the Jaina sacred Scriptures and their commentaries.
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Finally, we should keep in mind that this is consistently within an apologetic objective to defend one’s own scriptural tradition (Qvarnström 2006)[^qvarnström-2006] and to attack the one of others that the different philosophico-traditions of India aimed to rationally justify a given set of claims and that they developed their logical frameworks in the form of what can rightfully be called a “systematic philosophy”, as we will investigate in the next paragraph. One issue in which the co-existence of a more systematic and a more dogmatic approach is manifest is the shift that happened with notably the Buddhist Dharmakīrti (550–610) in his *Considerations on knowledge* (*Pramāṇavārttika* [PV]), when a transition was made from external criteria for the reliability of a discourse, like the existence of an authoritative utterer; to internal criteria, like soundness of the assertions themselves, or ability of the proponent to show a proof for these assertions. The Jaina tradition experiences this shift especially with the author Samantabhadra in his *Investigation on Authority* (*Āpta-mīmāṁsā* [ĀMī]) (Balcerowicz 2016a)[^balcerowicz-2016a].
    step1: TBD
