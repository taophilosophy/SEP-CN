      Third, whatever enters our cognitive apparatus is a result of a contact with what exists. The senses, which include the mind, are an intermediary between our self and the object of knowledge, but the self can also know the object of knowledge directly. Mental, cosmic and absolute cognitions are such direct types of knowledge, while ordinary cognition and testimonial cognition are mediated ones. For Jainas, direct knowledge of the soul is called “*pratyakṣa*” (directly present to the soul); while in other systems, “*pratyakṣa*” (present before the eyes) is what stands for everyday life perception, therefore mediated by the organs of senses. This leads to competitive classifications by Jaina authors in their attempts at being understood by their non-Jaina interlocutors (Clavel 2015)[^clavel-2015].
