      至于质料（*pudgala*），它是身、语、意、息的质料因。这意味着：在这一构想中，不仅身体（*śārira*），连物理性的意、语词、思想与呼吸，也是精微质料实体的类型。质料尤其是说明业之存在者——业是一种精微的质料。解释一下：泛印度有一种构想，认为凡有部分者皆无常。在耆那教中，质料是唯一能结合或分离的实体，因此也是唯一有部分的实体。于是，无常仅来自人与质料的结合。与质料相反：（i）自我是一个无部分的单原子，完全独立于其他自我与其他实体；（ii）虚空、运动之媒介与静止之媒介各是一个占据全部宇宙空间的单一不可分整体；（iii）时间没有广延。
