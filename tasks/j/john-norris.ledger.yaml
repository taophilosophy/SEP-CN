      In 1690, Norris issued criticisms of Locke’s *An Essay concerning Human Understanding*¸ the first edition of which was published in December 1689. Norris’ review, entitled *Cursory Reflections upon a Book called An Essay concerning Human Understanding*, prompted Locke to modify the second edition of the *Essay* at 2.10.2. Otherwise, Locke did not reply publicly to Norris’ criticisms. It was only after Locke and Norris quarreled that Locke published his estimation of Norris’ works. Lady Masham had entrusted a letter for Locke to Norris, but news reached Locke that Norris had opened the letter. Locke suspected Norris in spite of his protests, and from that time forward, which was the end of 1692, they were not on friendly terms (Cranston 1957, 364–365)[^cranston-1957]. Shortly thereafter (1693), Locke wrote *Remarks upon some of Mr. Norris’ Books, Wherein he asserts P. Malebranche’s Opinion of seeing all Things in God and Examination of Malebranche*. Charlotte Johnston has argued that the impetus and target for Locke’s critical evaluation of Malebranche’s thought was Norris, whom he viewed as reiterating Malebranche’s thought (1958). In the *Cursory Reflections*, Norris stated that he would soon publish a treatise, in which he would present his own philosophy at length.
    step1: |-
      1690 年，诺里斯发表了对洛克《人类理解论》的批评——该书第一版于 1689 年 12 月刊行。诺里斯的评论题为《对一部名为〈人类理解论〉的书的匆匆反思》（Cursory Reflections upon a Book called An Essay concerning Human Understanding），促使洛克在《人类理解论》第二版 2.10.2 处作了修改。除此之外，洛克并未公开答复诺里斯的批评。只是在洛克与诺里斯争执之后，洛克才发表了他对诺里斯著作的评价。马沙姆夫人曾托诺里斯转交一封给洛克的信，但洛克得知诺里斯拆开了那封信。尽管诺里斯抗议，洛克仍怀疑他；自此以后——时在 1692 年末——两人便不再友善（Cranston 1957, 364–365）[^cranston-1957]。此后不久（1693 年），洛克写了《对诺里斯先生若干著作的评注：其中他主张马勒布朗士关于在上帝中看见万物的意见，以及对马勒布朗士的考察》。夏洛特·约翰斯顿论证说，洛克批判评估马勒布朗士思想的动力与靶子正是诺里斯，因为洛克视诺里斯为在重述马勒布朗士的思想（1958）。在《匆匆反思》中，诺里斯表示他不久将出版一部论著，在其中详尽陈述自己的哲学。
    step2: |-
      1690 年，诺里斯出文以驳洛克《人类理解论》——其书初版刊于 1689 年 12 月。诺里斯之评，题曰《对一部名为〈人类理解论〉的书的匆匆反思》，使洛克于《人类理解论》第二版 2.10.2 处有所改。此外洛克未公答其评。至二人相失之后，洛克乃出其评诺里斯书之论。马沙姆夫人尝托诺里斯转书于洛克，而洛克闻其私发之。诺里斯虽自辩，洛克终疑之；自是以后——时在 1692 年末——二人不复相善（Cranston 1957, 364–365）[^cranston-1957]。未几（1693 年），洛克作《对诺里斯先生若干著作之评注：其中主张马勒布朗士“于上帝中见万物”之说，并考察马勒布朗士》。夏洛特·约翰斯顿谓洛克评骘马勒布朗士之思，其发其的皆在诺里斯，以洛克视之为复述马勒布朗士之说者（1958）。诺里斯于《匆匆反思》中自言将刊一论著，详陈己之哲学。
