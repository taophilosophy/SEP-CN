      John Norris (1657 – 1711) continued the broadly Cartesian project in late 17ᵗʰ Century England despite the ever-growing prominence of Lockean empiricism. Norris wrote on numerous topics, including politics, religion, philosophy and the Christian life. He also composed poetry. This entry describes several of Norris’ most noteworthy advances and insights.
    step1: |-
      约翰·诺里斯（John Norris，1657–1711）在十七世纪晚期的英格兰延续了广义上的笛卡尔式事业，尽管洛克式经验论日益显赫。诺里斯著述涉及众多题目，包括政治、宗教、哲学与基督徒生活。他也写诗。本词条叙述诺里斯若干最值得注意的推进与洞见。
    step2: |-
      约翰·诺里斯（1657–1711）当十七世纪晚叶之英格兰，犹续笛卡尔一路之业，虽洛克式经验论日益显赫而不顾。诺里斯所著，遍及政治、宗教、哲学与基督徒之生活，兼工于诗。本词条述其最可注意之数端推进与洞见。
  - id: 2
    kind: body
    source: |-
      One important goal of his philosophical writing was the completion of Malebranche’s project. Norris believed Malebranche did not prove the existence of the intelligible world, viz. the mind of God. Nor did Malebranche offer a full account of the nature of the intelligible world. Norris adopted Descartes’ view of the structure of thought, and a Malebranchean view of the contents of thought. He also elaborated a version of Descartes’ real distinction proof in order to weaken Locke’s thinking matter hypothesis. Proving the existence and immortality of the soul was a prime concern for Norris. Moreover, he was troubled by the heterodox theological views of the Enthusiasts (Quakers) and Socinians. He constructed numerous arguments against their doctrines by utilizing the “divine light,” characterized within what he called his “Ideal Philosophy.”
    step1: |-
      他哲学写作的一个重要目标，是完成马勒布朗士的事业。诺里斯认为，马勒布朗士没有证明可理解世界——即上帝之心——的存在；马勒布朗士也没有对可理解世界的本性给出完整的说明。诺里斯采纳了笛卡尔关于思想结构的看法，以及马勒布朗士关于思想内容的看法。他还详细阐发了笛卡尔“实在区别”证明的一个版本，以削弱洛克的“思想物质”假说。证明灵魂的存在与不朽，是诺里斯的首要关切。此外，他为狂热派（贵格会）与索齐尼派的不正统神学观点所困扰。他运用“神圣之光”——在他所谓“观念哲学”中得到刻画——构造了大量论证来反驳他们的学说。
    step2: |-
      其哲学之著，一要旨在成马勒布朗士之业。诺里斯以为马勒布朗士未证可理解之世界——即上帝之心——之存在，亦未备陈可理解世界之性。诺里斯取笛卡尔论思想结构之说，而取马勒布朗士论思想内容之说；又详演笛卡尔“实在区别”之证一版，以弱洛克“思想即物质”之假说。证灵魂之存在与不朽，乃诺里斯首务。又为狂热派（贵格会）与索齐尼派之异端神学所扰，乃假“神圣之光”——于其所谓“观念哲学”中见其义——构诸论证以攻其说。
