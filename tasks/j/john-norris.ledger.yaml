      It is puzzling that a figure as popular and widely-read as Norris has received such little recognition from intellectual historians of the early modern period. Perhaps Norris has not been paid much attention because his philosophical writings appear to contain an eclectic mixture of many divergent, incompatible sources rather than a coherent synthesis of those sources. Charles McCracken notes that Norris has been dubbed in a variety of ways, but that the “English Malebranche” seems most appropriate (179). Norris was heavily influenced by Malebranche, and goes so far as advising his own children that Malebranche’s *Search after Truth* should “always be read, studied, dwelt and fed upon till it be digested, made your own, and converted as it were into the very Substance of your Souls” (*Spiritual Counsel* 501). Norris was also a follower of Descartes, whom Norris viewed as constructing “the only intelligible Frame of Natural Science that has yet appear’d in the World, and the only intire System that deserves the name of *Philosophy*” (500). Norris also draws liberally from his Scholastic background, and frequently uses theoretical tools borrowed from the canonical thinkers taught at the universities, such as Aquinas, Augustine and Suarez. His heavy reliance on diverse intellectual sources, especially Descartes and Malebranche, is apparent in his writings. Nonetheless, his arguments are tremendously valuable for understanding better the debates of his time. His rehearsal of Descartes’ real distinction proof and his evaluation of Locke’s thinking matter hypothesis exposes some critical Lockean assumptions, bringing into sharp relief the disagreements between the rationalists and empiricists of that era. He also influenced the views of other minor figures, most notably, Mary Astell and Arthur Collier. Finally, Norris’ adaptation and expansion of Malebranche’s twin doctrines of Vision in God and occasionalism are also central to understanding the continuation of the Cartesian project in late 17ᵗʰ and early 18ᵗʰ century England.
