      Many such ambiguities emerge from Italos’ writings. His stringent and succinct arguments, the dialectical style, and the fragmentary and esoteric nature of his extant writings pose a challenge to the modern reader. The difficulty to reconstruct Italos’ thought is further compounded by the hostile testimonies and by the reasonable assumption that he used at least some degree of dissimulation (Siniossoglou 2011, 82–85; Kaldellis 2012, 141–142)[^kaldellis-2012][^siniossoglou-2011]. In view of these difficulties, it is not surprising that we still lack a reliable critical edition of the *Quaestiones*, which distinguishes Italos’ genuine writings from his students’ lecture notes, on the one hand, and from spurious works, on the other. A comprehensive study of Italos’ thought, which remains a desideratum, will also have to examine his philosophical progeny, Eustratios of Nicaea and Ioane Petritsi, who are important witnesses to the thought of Italos’ school.
    step1: |-
      这样的含糊之处在伊塔洛斯的著作中屡见不鲜。其论证之谨严简截、其辩证文体、其现存著作之残断与秘传性质，都对现代读者构成挑战。重构伊塔洛斯思想的困难，又因敌意的证词以及一个合理的假定而更甚：他至少在一定程度上作了掩饰（Siniossoglou 2011, 82–85; Kaldellis 2012, 141–142）[^kaldellis-2012][^siniossoglou-2011]. 鉴于这些困难，我们至今仍缺一部可靠的《问答集》批评本——既能区分伊塔洛斯本人的真作与其学生的听课笔记，又能甄别伪作——也就不足为奇。对伊塔洛斯思想的全面研究仍是待为之举，它也须考察其哲学后劲尼西亚的欧斯特拉提奥斯与约阿内·佩特里齐，此二人是伊塔洛斯学派思想的重要见证。
    step2: |-
      此类含糊在伊塔洛斯书中触处可见。论证谨严而简截、文体纯属辩证、现存之作既残断又秘传，凡此皆令现代读者犯难。重构其思想之难，又益以两事：证词出于敌手，且有一合理假定——他至少在一定程度上故加文饰（Siniossoglou 2011, 82–85; Kaldellis 2012, 141–142）[^kaldellis-2012][^siniossoglou-2011]。既有此诸难，则《问答集》至今尚无可靠批评本（既辨伊塔洛斯真作与学生听课笔记之别，又别乎伪作），亦不足怪。全面研究伊塔洛斯思想，仍是学界待为之举；届时亦须考察其哲学后劲尼西亚的欧斯特拉提奥斯与约阿内·佩特里齐——二人于伊塔洛斯学派之思想，最为重要的见证。
