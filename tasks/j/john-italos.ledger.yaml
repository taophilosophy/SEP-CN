      It stands to reason to assume that many of Italos’ writings were destroyed following his condemnation. The practice of destroying the works of the anathematized is documented in the case of Italos’ student Eustratios of Nicaea (Joannou 1954, 378)[^joannou-1954]; however, we lack such explicit information in Italos’ case. Be that as it may, what has come down to us are his *Quaestiones quodlibetales*, a variety of logical treatises (*De dialectica*, *De syllogismis*, *In Aristotelis Topicorum commentaria*, *Synopsis minor in Porphyrii Isagogem*), a manual on rhetorics (*De rhetorica*), a few scholia on Pseudo-Dionsyius, and – possibly – an apologetic letter addressed to the Patriarch (*Epistula apologetica ad patriarcham*). The epistle describes a situation that resembles Italos’ condemnation: the author complains that he was convicted in an unfair trial, in which his statements were deliberately distorted. Yet there are some incongruities with what we know of Italos’ two trials, which call into question its authenticity (Gouillard 1985a)[^gouillard-1985a]. Likewise, the authenticity of the summary on Porphyry’s *Isagoge* (*Synopsis minor in Porphyrii Isagogem*) has been impugned (Rigo 2001, 65)[^rigo-2001]. But its succinct style, the explicit attribution to Italos in the manuscript tradition, and the preference for the Aristotelian example of “goat-stag” (traghelaphos; a fictional animal), which Italos employs also in *Qu* 3 and *Qu* 28 (cf. Romano 1994)[^romano-1994], speak in favor of its authenticity. The text briefly defines the five voices (genus, species, difference, property, and accident – the universals distinguished by Porphyry) and discusses their interrelationship (Romano 1992)[^romano-1992]. Probably also by Italos are the three scholia on the first chapter of Ps-Dionysios’ *De Coelesti Hierarchia* that are contained in a single Florentine manuscript (Laur. plut. V.13) (Rigo 2006)[^rigo-2006]. The scholia point out – among other issues – that the celestial hierarchy is an intelligible realm that is completely devoid of matter and thus does not undergo generation and corruption.
    step1: |-
      有理由设想，伊塔洛斯的许多著述在其被谴责后遭到销毁。销毁受绝罚者著作的做法，在伊塔洛斯的学生、尼西亚的欧斯特拉提奥斯那里有案可查（Joannou 1954, 378）[^joannou-1954]；但就伊塔洛斯本人而言，我们缺乏这样的明确信息。尽管如此，传世的有他的《问答集》（*Quaestiones quodlibetales*）、若干逻辑论著（*De dialectica*、*De syllogismis*、*In Aristotelis Topicorum commentaria*、*Synopsis minor in Porphyrii Isagogem*）、一部修辞学手册（*De rhetorica*）、几条关于伪狄奥尼修斯的旁注，以及——可能——一封呈牧首的申辩信（*Epistula apologetica ad patriarcham*）。这封书信描述的情境类似伊塔洛斯的受谴：作者抱怨自己在不公正的审判中获罪，其陈述被蓄意歪曲。但书中有些情节与我们所知的伊塔洛斯两次受审不一致，令人怀疑其真实性（Gouillard 1985a）[^gouillard-1985a]。同样，波菲利《导论》摘要（*Synopsis minor in Porphyrii Isagogem*）的真实性也受到质疑（Rigo 2001, 65）[^rigo-2001]。但其文风简洁、抄本传统明确署名伊塔洛斯，且偏好亚里士多德的“山羊鹿”（traghelaphos，一种虚构动物）之例——伊塔洛斯在 *Qu* 3 与 *Qu* 28 中也用到此例（参 Romano 1994）[^romano-1994]——这些都支持其真实性。该文本简要界定了五个谓词（属、种、差、特性、偶性——波菲利所区分的普遍者），并讨论其相互关系（Romano 1992）[^romano-1992]。很可能同样出自伊塔洛斯的，还有收于一份佛罗伦萨抄本（Laur. plut. V.13）的伪狄奥尼修斯 *De Coelesti Hierarchia* 第一章的三条旁注（Rigo 2006）[^rigo-2006]。这些旁注指出——除其他问题外——天上等级是一个全然无质的理智领域，因而不经历生成与坏灭。
    step2: |-
      有理由认为，伊塔洛斯的许多著述在其定罪后即遭销毁。销毁受绝罚者著作的做法有案可查：伊塔洛斯的弟子、尼西亚的欧斯特拉提奥斯即是一例（Joannou 1954, 378）[^joannou-1954]；至于伊塔洛斯本人，却缺少这样的明文记载。无论如何，传世之作有：《问答集》（*Quaestiones quodlibetales*）、一批逻辑论著（*De dialectica*、*De syllogismis*、*In Aristotelis Topicorum commentaria*、*Synopsis minor in Porphyrii Isagogem*）、一部修辞学手册（*De rhetorica*）、数条伪狄奥尼修斯旁注，以及——或许——呈牧首的申辩信（*Epistula apologetica ad patriarcham*）。信中所述情境与伊塔洛斯的受谴颇为相似：作者自陈在不公正的审判中被定罪，陈述遭蓄意歪曲。但信中若干情节与我们所知的两次审判不合，其真实性遂成疑问（Gouillard 1985a）[^gouillard-1985a]。同理，波菲利《导论》摘要（*Synopsis minor in Porphyrii Isagogem*）的真实性亦遭质疑（Rigo 2001, 65）[^rigo-2001]。不过，其文笔简净、抄本传统明确标归伊塔洛斯名下，且偏好亚里士多德“山羊鹿”（traghelaphos，虚构动物）之例——伊塔洛斯在 *Qu* 3 与 *Qu* 28 亦用此例（参 Romano 1994）[^romano-1994]——皆为其真作之证。该文简要界定了五个谓词（属、种、差、特性、偶性——即波菲利区分的诸普遍者），并讨论其相互关系（Romano 1992）[^romano-1992]。另有三条关于伪狄奥尼修斯 *De Coelesti Hierarchia* 首章的旁注，仅见于佛罗伦萨一份抄本（Laur. plut. V.13），很可能也出自伊塔洛斯之手（Rigo 2006）[^rigo-2006]。旁注指出——除其他议题外——天上等级是全然无质的理智领域，故不经历生成与坏灭。
  - id: 6
    kind: body
    source: |-
      Italos’ undisputed writings include *De rhetorica*. It has been shown that this work is not an actual summary of Aristotle’s *Rhetoric* but rather a compilation from commentaries and prolegomena that were available to Italos (Conley 1998; 2004)[^conley-1998]. In particular, it is remarkable that Italos does not mention *enthymēmata* (rhetorical demonstrations), which indicates that he did not have first-hand knowledge of the *Rhetoric*. Similarly, Italos’ commentary on books II-IV of Aristotle’s *Topics* (*In Aristotelis Topicorum commentaria*) does not offer an independent exposition of the Aristotelian work but draws heavily on Alexander of Aphrodisias’ commentary (Wallies 1891; Kotzabassi 1999)[^kotzabassi-1999][^wallies-1891]. Italos’ interest in the *Topics* is evident also in his *De dialectica* and *De syllogismis*. In the former work he defines dialectics as the intermediary between the demonstrative and sophistic arts. Its purpose is to train the mind and to reason well – relying on common beliefs (endoxa) – whenever demonstrative proof cannot be given (§6). By drawing consistently on Aristotle’s *Topics* and *Prior Analytics*, he offers an introduction to Aristotelian dialectics and syllogistic, which he dedicated to the co-emperor Andronikos Doukas. He continued his introduction in *De syllogismis*, which starts by distinguishing the matter (premises) from the form (figures) of syllogisms. He goes on to differentiate ten kinds (topoi) to construct syllogisms (§7), which he discusses in detail (§§8–32) before providing a synopsis of Aristotle’s *Topics* II-VI (§§33-89). The logical treatises show Italos as an author who – much like Aristotle – shunned redundancy, expressing himself succinctly to the point of occasional obscurity. They also show him as a teacher who composed epitomes for the courtly intelligentsia.
    step1: |-
      伊塔洛斯无可争议的传世著作包括 *De rhetorica*。已经证明，这部著作并不是对亚里士多德《修辞学》的真正提要，而是从伊塔洛斯可得的注疏与导论中辑成的汇编（Conley 1998; 2004）[^conley-1998]。尤其值得注意的是，伊塔洛斯没有提到省略三段论（enthymēmata，修辞性论证），这表明他没有直接研读过《修辞学》。类似地，伊塔洛斯对亚里士多德《论题篇》第二至四卷的注疏（*In Aristotelis Topicorum commentaria*）也没有对该著作作独立阐述，而是大量取材于阿弗罗狄西亚的亚历山大的注疏（Wallies 1891；Kotzabassi 1999）[^kotzabassi-1999][^wallies-1891]。伊塔洛斯对《论题篇》的兴趣在其 *De dialectica* 与 *De syllogismis* 中也很明显。在前一部著作中，他把辩证法定义为证明术与诡辩术之间的中介技艺。其目的是训练心智、进行良好的推理——依靠公认意见（endoxa）——在证明性证明无法给出之时（§6）。他一以贯之地取材于亚里士多德的《论题篇》与《前分析篇》，写出了一部亚里士多德辩证术与三段论的导论，献给共治皇帝安德罗尼科斯·杜卡斯。他在 *De syllogismis* 中续写这一导论：开篇区分三段论的质料（前提）与形式（格），继而分出构造三段论的十种论题（topoi）（§7），逐条详论（§§8–32），末尾给出亚里士多德《论题篇》第二至六卷的提要（§§33-89）。这些逻辑论著表明，伊塔洛斯如同亚里士多德一样避忌冗赘，表达简洁到偶或晦涩的地步。它们也表明，他是一位为宫廷知识界编撰提要的教师。
    step2: |-
      无可争议的传世之作中有 *De rhetorica*。研究表明，它并非亚里士多德《修辞学》的真正提要，而是从伊塔洛斯当时可得的注疏与导论辑成的汇编（Conley 1998; 2004）[^conley-1998]。尤其值得注意的是，伊塔洛斯只字未提省略三段论（enthymēmata，修辞性论证），这表明他并未直接研读过《修辞学》。同样，伊塔洛斯对亚里士多德《论题篇》第二至四卷的注疏（*In Aristotelis Topicorum commentaria*）也没有对该书作独立阐述，而是大量倚重阿弗罗狄西亚的亚历山大的注疏（Wallies 1891；Kotzabassi 1999）[^kotzabassi-1999][^wallies-1891]。伊塔洛斯对《论题篇》的兴趣在其 *De dialectica* 与 *De syllogismis* 中同样明显。在前一部著作中，他把辩证法定义为证明术与诡辩术之间的中介技艺：凡证明性证明无从给出之时，便依靠公认意见（endoxa）训练心智、进行良好的推理（§6）。他始终以亚里士多德《论题篇》与《前分析篇》为本，写出一部亚里士多德辩证术与三段论的导论，题献给共治皇帝安德罗尼科斯·杜卡斯。他又在 *De syllogismis* 中续写这一导论：开篇区分三段论的质料（前提）与形式（格），继而分出构造三段论的十种论题（topoi）（§7），逐一细论（§§8–32），末尾附亚里士多德《论题篇》第二至六卷提要（§§33-89）。这些逻辑论著显示，伊塔洛斯如亚里士多德一样避忌冗赘，行文简约，偶或晦涩；它们也显示，他是一位为宫廷知识界编撰提要的教师。
