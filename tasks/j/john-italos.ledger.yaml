      Italos’ (Neo-)Platonism is apparent also in his theology. The notions of the hierarchy of causes and of the great chain of being permeate his writings. In *Qu* 51, when explaining solar eclipses, he asserts that the primary cause of the natural phenomenon is God the Creator, while the secondary cause is the moon that covers the sun (Pontikos 1992, 91)[^pontikos-1992]. In *Qu* 68, he gives an account of the three divine hypostases (of the great chain of being) and their triple movement of rest, procession, return (monē, proodos, epistrophē). He identifies the three hypostases with the Trinity, which he makes clear by describing the second hypostasis (nous) in Christological terms. He alludes to John 8:42, thereby equating the second hypostasis with Christ. It is true that the treatise starts by claiming that he merely expounds the teachings of “the best theologians among the pagans”. Yet the scriptural reference and the fact that he used the same terminology in his confession of faith, as recorded in the trial records (Gouillard 1985b, 145.164–168)[^gouillard-1985b], prove that Italos gives an overview of his own theology in *Qu* 68 (cf. Shchukin 2008, 250; *pace* Stéphanou 1949, 91)[^shchukin-2008][^stéphanou-1949].
    step1: |-
      伊塔洛斯的（新）柏拉图主义在其神学中也显而易见。原因等级与存在巨链的观念渗透于他的著作。在 *Qu* 51 中，他在解释日食时断言，这一自然现象的首要原因是造物主上帝，次要原因则是遮住太阳的月亮（Pontikos 1992, 91）[^pontikos-1992]。在 *Qu* 68 中，他叙述三个神圣位格及其静驻、流出、回返（monē, proodos, epistrophē）的三重运动。他把三个位格等同于三位一体，并通过以基督论术语描述第二位格（nous）来表明这一点。他暗引《约翰福音》8:42，从而把第二位格等同于基督。诚然，该论著开篇声称他只是在阐述异教徒中最好的神学家的学说。然而，经文引用以及他在审判记录所载的信纲中使用同样的术语（Gouillard 1985b, 145.164–168）[^gouillard-1985b]，证明伊塔洛斯在 *Qu* 68 中概述的是他自己的神学（参见 Shchukin 2008, 250；与 Stéphanou 1949, 91 相反）[^shchukin-2008][^stéphanou-1949]。
    step2: |-
      伊塔洛斯之（新）柏拉图主义，于其神学亦显然。原因等级与存在巨链之念，遍见于其书。*Qu* 51 释日食，谓此自然现象之首要原因为造物主上帝，次要原因则为蔽日之月（Pontikos 1992, 91）[^pontikos-1992]。*Qu* 68 述三个神圣位格及其静驻、流出、回返（monē, proodos, epistrophē）之三重运动，以三位一体当之；其证在以基督论术语状第二位格（nous），并暗引《约翰福音》8:42，以第二位格即基督。该篇开宗明义，自称不过阐述异教徒中最好的神学家之说；然经文之引，加之其信纲（见审判记录）用同一套术语（Gouillard 1985b, 145.164–168）[^gouillard-1985b]，足证 *Qu* 68 所概述者乃伊塔洛斯自家神学（参见 Shchukin 2008, 250；与 Stéphanou 1949, 91 相反）[^shchukin-2008][^stéphanou-1949]。
