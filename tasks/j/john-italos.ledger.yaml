    source: |-
      Our knowledge of Italos’ life rests largely on the account of Anna Komnēnē, who describes his origin and character in her *Alexiad* (V.8–9), which was written in hindsight in the 1140s. She gives an overtly hostile account of the philosopher and presents him as the exact opposite of what an acculturated Byzantine was supposed to be (Arabatzis 2002)[^arabatzis-2002]. Notwithstanding her bias, Komnēnē’s account relates the key milestones of Italos’ life, with the exception of his dates of birth and death, which are unknown. Italos was probably born in southern Italy in c. 1030, at a time when the region was still under Byzantine control. He spent his formative years in the company of his father, who was a soldier. As a battle-hardened youth, who had undergone some kind of elementary education, Italos moved to Constantinople around 1050, possibly as a refugee. In the capital he received a literary education and joined the circle of the polymath Michael Psellos. Psellos praised Italos’ forceful use of argumentation, which compensated for his lack of linguistic elegance (*Or. min.* 19). Elsewhere (*Or. min.* 18), he reprimanded his student’s utilitarian approach, which aided his dialectical exploration and profitable advancement but precluded him from properly examining and teaching certain disciplines, such as geometry.
    step1: |-
      我们对伊塔洛斯生平的了解主要依据安娜·科穆宁娜的记述。她在写于 1140 年代的《阿莱克修斯传》（V.8–9）中以追忆口吻描述了伊塔洛斯的出身与品性。她对这位哲学家的记述充满明显的敌意，把他描绘成一个教养有素的拜占庭人的反面（Arabatzis 2002）[^arabatzis-2002]。尽管有此偏见，科穆宁娜的记述仍交代了伊塔洛斯生平的关键节点，唯生卒年不详。伊塔洛斯约于 1030 年前后出生在南意大利，当时该地区仍在拜占庭治下。他早年随父生活，父亲是一名士兵。这个身经战阵的青年受过某种初等教育，约于 1050 年前后移居君士坦丁堡，可能是作为难民而来。在首都他接受了文学教育，并加入博学之士米海尔·普塞洛斯的圈子。普塞洛斯称赞伊塔洛斯有力地运用论证，弥补了他在语言典雅方面的欠缺（*Or. min.* 19）。在别处（*Or. min.* 18），他申斥这位学生的功利取向：它有助于其论辩探索与进身晋升，却使他不能恰当考察并讲授几何学之类的学科。
    step2: |-
      我们关于伊塔洛斯生平的知识，主要来自安娜·科穆宁娜的记述。她于 1140 年代追述往事，在《阿莱克修斯传》（V.8–9）中描写了他的出身与品性。她对这位哲学家的叙述毫不掩饰敌意，把他写成一个有教养的拜占庭人的截然反面（Arabatzis 2002）[^arabatzis-2002]。尽管带有偏见，她的记述仍交代了伊塔洛斯生平的关键节点——只有生卒年无从得知。伊塔洛斯约在 1030 年前后生于拜占庭治下的南意大利，早年随从军的父亲生活。这个历经行伍的青年受过某种初等教育，约于 1050 年前后移居君士坦丁堡，或系逃难而至。在首都，他受了文学教育，并入博通之才米海尔·普塞洛斯的门下。普塞洛斯称许伊塔洛斯论证锋利有力，足以弥补其文辞之欠雅驯（*Or. min.* 19）；又在别处（*Or. min.* 18）申斥这位弟子的功利取向——它虽有助其论辩探求与进身，却使他无法好好考察、讲授几何学之类的学科。
