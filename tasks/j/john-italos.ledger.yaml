      A key approach to Italos’ philosophy is to compare the condemnations with his extant writings (Stéphanou 1933; Gouillard 1967, 194–200; Clucas 1981; Shchukin 2010)[^clucas-1981][^shchukin-2010][^stéphanou-1933]. Scholars are in disagreement as to whether Italos did, in fact, deviate from the orthodox norms of his day. It matters little in this respect that Michael Psellos vouched for Italos’ orthodoxy (*Or. min.* 19). Those who accept the veracity of the ecclesiastical verdict see Italos as a subversive philosopher, whose teachings and methods challenged the orthodox establishment with crypto-pagan wisdom (Nicolaidis 2011, 64–67; Siniossoglou 2011, 82–85)[^nicolaidis-2011][^siniossoglou-2011]. But those who disagree with the verdict see him as a dialectician who explored theological issues with philosophical methods without, however, endorsing any heretical view (Joannou 1956b; Clucas 1981)[^clucas-1981][^joannou-1956b]. Accordingly, it was Italos’ philosophical methodology – and not any particular doctrine – that motivated his condemnation (Stéphanou 1949, 117; Ierodiakonou 2007, 24–28; Gutas/Siniossoglou 2017, 290–291)[^gutas-2017][^ierodiakonou-2007][^ierodiakonou-2007-2][^stéphanou-1949]. Italos’ legacy ranges from a subversive heretic to a Socratic free-thinker. The large discrepancy in interpretation is in part due to the nature of the sources (didactic treatises and hostile testimonies). In part, it is due to the assumption that Italos’ command of the Greek language was deficient and that he cannot be held fully accountable for his statements (Gouillard 1976, 309; Clucas 1981, 40)[^clucas-1981][^gouillard-1976]. It is true that Anna Komnēnē, Michael Psellos, and the *Timarion* all criticize Italos’ lack of rhetorical eloquence, but this can hardly be taken as a justification of the claim that Italos could not have fully understood the meaning of his own propositions. In fact, the extant writings do not substantiate the view that he did not know Greek proficiently. To be sure, there are occasional textual difficulties, but these are probably due to scribal errors rather than to any linguistic shortcomings of the author.
    step1: |-
      研究伊塔洛斯哲学的一个关键进路，是把谴责条文与其存世著述加以比较（Stéphanou 1933；Gouillard 1967, 194–200；Clucas 1981；Shchukin 2010）[^clucas-1981][^shchukin-2010][^stéphanou-1933]。学者们对伊塔洛斯是否真的偏离了当时的正统规范意见不一。米海尔·普塞洛斯为伊塔洛斯的正统性担保（*Or. min.* 19），这一点在此无关紧要。接受教会判决真实性的人，把伊塔洛斯看作一个颠覆性的哲学家：其学说与方法以隐秘的异教智慧挑战正统建制（Nicolaidis 2011, 64–67；Siniossoglou 2011, 82–85）[^nicolaidis-2011][^siniossoglou-2011]。不认同判决的人则把他看作论辩家：他以哲学方法探究神学问题，却不持任何异端观点（Joannou 1956b；Clucas 1981）[^clucas-1981][^joannou-1956b]。据此，促成其谴责的是伊塔洛斯的哲学方法论，而非任何具体学说（Stéphanou 1949, 117；Ierodiakonou 2007, 24–28；Gutas/Siniossoglou 2017, 290–291）[^gutas-2017][^ierodiakonou-2007][^ierodiakonou-2007-2][^stéphanou-1949]。伊塔洛斯的身后评价从颠覆性异端到苏格拉底式自由思想者不等。解释上的巨大分歧，部分源于文献的性质（教学论著与敌对证词），部分源于这一假定：伊塔洛斯希腊语文娴熟不足，不能对其言论负完全责任（Gouillard 1976, 309；Clucas 1981, 40）[^clucas-1981][^gouillard-1976]。诚然，安娜·科穆宁娜、米海尔·普塞洛斯与《蒂马里翁》都批评伊塔洛斯缺乏修辞的雄辩，但这很难成为“伊塔洛斯不能完全理解自己命题含义”这一主张的依据。事实上，存世著述并不支持他不通希腊语的说法。诚然偶有文本困难，但多半出于抄写错误，而非作者的语言缺陷。
    step2: |-
      研究伊塔洛斯哲学的一个关键进路，是把谴责条文与其存世著述对勘（Stéphanou 1933；Gouillard 1967, 194–200；Clucas 1981；Shchukin 2010）[^clucas-1981][^shchukin-2010][^stéphanou-1933]。至于伊塔洛斯是否真偏离了当时的正统规范，学界并无定论。普塞洛斯曾为他担保正统（*Or. min.* 19），但这在这里无关紧要。采信教会判决者视他为颠覆性的哲学家：其学说与方法以隐秘的异教智慧挑战正统建制（Nicolaidis 2011, 64–67；Siniossoglou 2011, 82–85）[^nicolaidis-2011][^siniossoglou-2011]。不认可判决者则视他为辩证家：以哲学方法探究神学问题，却不持任何异端之说（Joannou 1956b；Clucas 1981）[^clucas-1981][^joannou-1956b]。照后一种读法，招致谴责的是伊塔洛斯的哲学方法论，而非任何具体教义（Stéphanou 1949, 117；Ierodiakonou 2007, 24–28；Gutas/Siniossoglou 2017, 290–291）[^gutas-2017][^ierodiakonou-2007][^ierodiakonou-2007-2][^stéphanou-1949]。伊塔洛斯的身后形象，从颠覆性异端到苏格拉底式自由思想者，跨度极大。解释分歧如此之大，一半因文献的性质（教学论著与敌对证词并存），一半因一个假设：伊塔洛斯希腊语不精，不能对其言论负全责（Gouillard 1976, 309；Clucas 1981, 40）[^clucas-1981][^gouillard-1976]。安娜·科穆宁娜、普塞洛斯与《蒂马里翁》确实都批评他缺乏修辞上的雄辩，但这远不足以证明“伊塔洛斯无法完全理解自己命题的含义”。存世著述并不能支持他不通希腊语之说。文本偶有疑难，多半出于抄工之误，而非作者语言功力不足。
