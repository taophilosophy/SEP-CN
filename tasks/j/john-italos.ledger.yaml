      Yet another passage of his credo (Gouillard 1985b, 153.315–316)[^gouillard-1985b] stipulates to “worship” (latreuein) the icon of Christ. The unexpected choice of the word “worship” (latreia) should not be seen as a slip of tongue. Italos probably had Heb. 8:5 in mind and held that icons are mere sensible shadows of the intelligible archetype (Christ), which need to be transcended by worshipping the archetype (Shchukin 2008)[^shchukin-2008]. Elsewhere (*Qu* 87), Italos chose to quote virtually verbatim from John of Damascus’ first speech of his *Orationes de imaginibus tres*, which explores the different meanings of images (Nikolaou 2012)[^nikolaou-2012]. That paraphrase shows no indication that he deviated from orthodox icon theology and may have served an apologetic purpose.
    step1: |-
      他的信纲还有一段（Gouillard 1985b, 153.315–316）[^gouillard-1985b] 规定要崇拜（latreuein）基督的圣像。崇拜（latreia）一词的意外选择不应被视为口误。伊塔洛斯可能想到了《希伯来书》8:5，并认为圣像是可知原型（基督）的单纯可感影子，必须通过崇拜原型来超越（Shchukin 2008）[^shchukin-2008]。在别处（*Qu* 87），伊塔洛斯选择几乎逐字引用大马士革的约翰《三论圣像》（*Orationes de imaginibus tres*）第一篇讲辞，该文探讨图像的不同含义（Nikolaou 2012）[^nikolaou-2012]。这一改写没有显示出他偏离正统圣像神学的任何迹象，可能服务于护教目的。
    step2: |-
      其信纲又有一段（Gouillard 1985b, 153.315–316）[^gouillard-1985b]，命人崇拜（latreuein）基督之圣像。崇拜（latreia）一词之择，出人意表，然不可视为口误。伊塔洛斯或念及《希伯来书》8:5，谓圣像不过可知原型（基督）的可感影子，须由崇拜原型而超越之（Shchukin 2008）[^shchukin-2008]。*Qu* 87 又几近逐字引用大马士革的约翰《三论圣像》（*Orationes de imaginibus tres*）第一篇，该篇究论图像之诸义（Nikolaou 2012）[^nikolaou-2012]。此一改写未见其偏离正统圣像神学之处，或出于护教之用。
