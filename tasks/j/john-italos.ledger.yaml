    kind: body
    source: |-
      Italos’ argumentative fervor earned him both praise and criticism. His alleged temperament (cf. Hunger 1987, 38)[^hunger-1987] and strict argumentativeness endeared him to his students, who included members of the ecclesiastical hierarchy and the imperial court. Due to his political network and Italian provenance, he was sent on a diplomatic mission to the Normans in the mid-1070s. During his mission, he was accused of treason, whereupon he fled to Rome. He was pardoned shortly thereafter by Emperor Michael VII and returned to Constantinople. Around the year 1076, he succeeded Psellos as Consul of the philosophers (hypatos tōn philosophōn), i.e., as the head of the school of philosophy. About this time, he was accused of heterodoxy, but the emperor, whose patronage he enjoyed, intervened on his behalf and ensured that he was acquitted. Yet the bad repute stayed with Italos. Following the usurpation of Emperor Alexios I in 1081, Italos was put on trial again and was found guilty of heterodoxy in March 1082. Most significantly, his dialectical method and his Platonic teachings were judged objectionable. Thereafter, Italos disappeared from the public sphere. Although there is some evidence that suggests he may have been partially rehabilitated (Magdalino 1996, 23, cf. *Alexiad* V.9.7)[^magdalino-1996], he was never reinstated in his teaching position.
    step1: |-
      伊塔洛斯好辩的热忱，为他既赢得赞誉，也招来批评。据说他的性情（参见 Hunger 1987, 38）[^hunger-1987] 与严格的论辩作风令学生爱戴，其学生中包括教会高层与帝国宫廷的成员。由于他的政治人脉与意大利出身，他在 1070 年代中期被派往诺曼人处执行外交使命。出使期间，他被控叛国，于是逃往罗马。不久后他获米海尔七世皇帝赦免，返回君士坦丁堡。约 1076 年，他继普塞洛斯之后任哲学家执政（hypatos tōn philosophōn），即哲学学派的首脑。大约此时，他被控异端，但对他加以庇护的皇帝出面干预，使他获判无罪。然而恶名始终伴随伊塔洛斯。1081 年阿莱克修斯一世篡位之后，伊塔洛斯再度受审，并于 1082 年 3 月被判犯有异端之罪。最重要的一点是，他的辩证方法与柏拉图式学说被判为不可接受。此后，伊塔洛斯从公共领域消失。尽管有些证据表明他可能获得了部分恢复名誉（Magdalino 1996, 23；参见 *Alexiad* V.9.7）[^magdalino-1996]，但他从未恢复教职。
    step2: |-
      伊塔洛斯好辩的激情，既为他赢得赞誉，也招致非议。据说正是他的性情（参见 Hunger 1987, 38）[^hunger-1987] 与一丝不苟的论辩作风，使门下弟子倾心向慕——这些弟子中不乏教会高层与宫廷中人。凭借政治人脉与意大利出身，他在 1070 年代中期奉命出使诺曼人。使命期间他被控叛国，遂出走罗马；不久获米海尔七世皇帝赦免，重返君士坦丁堡。约 1076 年，他接替普塞洛斯出任哲学家执政（hypatos tōn philosophōn），即哲学学派的首脑。差不多同时，异端之控再度袭来；赖皇帝庇护，他得以无罪开释。但恶名始终不去。1081 年阿莱克修斯一世篡位后，伊塔洛斯再受审判，1082 年 3 月被判定犯有异端。其中最要紧的一条，是判其辩证方法与柏拉图式学说为不可接受。自此，伊塔洛斯退出公共领域。虽有某些证据显示他或曾部分恢复名誉（Magdalino 1996, 23；参见 *Alexiad* V.9.7）[^magdalino-1996]，但其教席终未复得。
  - id: 5
    kind: body
    source: |-
      It stands to reason to assume that many of Italos’ writings were destroyed following his condemnation. The practice of destroying the works of the anathematized is documented in the case of Italos’ student Eustratios of Nicaea (Joannou 1954, 378)[^joannou-1954]; however, we lack such explicit information in Italos’ case. Be that as it may, what has come down to us are his *Quaestiones quodlibetales*, a variety of logical treatises (*De dialectica*, *De syllogismis*, *In Aristotelis Topicorum commentaria*, *Synopsis minor in Porphyrii Isagogem*), a manual on rhetorics (*De rhetorica*), a few scholia on Pseudo-Dionsyius, and – possibly – an apologetic letter addressed to the Patriarch (*Epistula apologetica ad patriarcham*). The epistle describes a situation that resembles Italos’ condemnation: the author complains that he was convicted in an unfair trial, in which his statements were deliberately distorted. Yet there are some incongruities with what we know of Italos’ two trials, which call into question its authenticity (Gouillard 1985a)[^gouillard-1985a]. Likewise, the authenticity of the summary on Porphyry’s *Isagoge* (*Synopsis minor in Porphyrii Isagogem*) has been impugned (Rigo 2001, 65)[^rigo-2001]. But its succinct style, the explicit attribution to Italos in the manuscript tradition, and the preference for the Aristotelian example of “goat-stag” (traghelaphos; a fictional animal), which Italos employs also in *Qu* 3 and *Qu* 28 (cf. Romano 1994)[^romano-1994], speak in favor of its authenticity. The text briefly defines the five voices (genus, species, difference, property, and accident – the universals distinguished by Porphyry) and discusses their interrelationship (Romano 1992)[^romano-1992]. Probably also by Italos are the three scholia on the first chapter of Ps-Dionysios’ *De Coelesti Hierarchia* that are contained in a single Florentine manuscript (Laur. plut. V.13) (Rigo 2006)[^rigo-2006]. The scholia point out – among other issues – that the celestial hierarchy is an intelligible realm that is completely devoid of matter and thus does not undergo generation and corruption.
    step1: |-
      有理由假定，伊塔洛斯的许多著作在他被定罪后遭毁弃。毁弃被绝罚者著作的做法，在伊塔洛斯的学生尼西亚的欧斯特拉提奥斯一案中有文献可证（Joannou 1954, 378）[^joannou-1954]；不过在伊塔洛斯本人这里，我们缺乏如此明确的记载。无论如何，流传下来的是他的《随意问答集》（*Quaestiones quodlibetales*）、若干逻辑论著（*De dialectica*、*De syllogismis*、*In Aristotelis Topicorum commentaria*、*Synopsis minor in Porphyrii Isagogem*）、一部修辞学手册（*De rhetorica*）、几篇关于伪狄奥尼修斯的注疏，以及——可能还有——一封写给牧首的辩护书信（*Epistula apologetica ad patriarcham*）。这封书信描述的情境与伊塔洛斯被定罪的情形相似：作者抱怨自己在一场不公正的审判中被定罪，其中他的陈述遭到刻意歪曲。然而，它与我们所知的伊塔洛斯两次审判之间存在一些不相合之处，这令人怀疑其真实性（Gouillard 1985a）[^gouillard-1985a]。同样，关于波菲利《导论》（*Isagoge*）的提要（*Synopsis minor in Porphyrii Isagogem*）的真实性也受到质疑（Rigo 2001, 65）[^rigo-2001]。但其简洁的文风、抄本传统中对伊塔洛斯的明确归属，以及对亚里士多德羊鹿（traghelaphos，一种虚构动物）例子的偏好——伊塔洛斯在 *Qu* 3 与 *Qu* 28 中也使用该例（参见 Romano 1994）[^romano-1994]——都有利于其真实性。该文本简要定义了五个词项（属、种、种差、固有属性与偶性，即波菲利所区分的那些共相），并讨论了它们之间的相互关系（Romano 1992）[^romano-1992]。可能同样出自伊塔洛斯之手的，还有三篇关于伪狄奥尼修斯《天阶体系》（*De Coelesti Hierarchia*）第一章的注疏，它们见于一份佛罗伦萨抄本（Laur. plut. V.13）（Rigo 2006）[^rigo-2006]。这些注疏指出——除其他问题外——天阶是一个完全无质料的可知领域，因而既不生成也不朽坏。
    step2: |-
      可以合理推断，伊塔洛斯的许多著作在其被定罪后同遭毁弃。毁弃被绝罚者之作，在伊塔洛斯门生尼西亚的欧斯特拉提奥斯身上有明文可考（Joannou 1954, 378）[^joannou-1954]；至于伊塔洛斯本人，则无此类明确记载。尽管如此，今存者仍有《随意问答集》（*Quaestiones quodlibetales*）、数种逻辑论著（*De dialectica*、*De syllogismis*、*In Aristotelis Topicorum commentaria*、*Synopsis minor in Porphyrii Isagogem*）、一部修辞学手册（*De rhetorica*）、若干关于伪狄奥尼修斯的注疏，或许还有一封致牧首的辩护书（*Epistula apologetica ad patriarcham*）。此信所述情境与伊塔洛斯受谴之事相类：作者诉称自己在一场不公的审判中被定罪，其言论遭人刻意曲解。但它与我们所知的两次审判颇有出入，故其真伪可疑（Gouillard 1985a）[^gouillard-1985a]。波菲利《导论》（*Isagoge*）提要（*Synopsis minor in Porphyrii Isagogem*）之真伪，同样受到质疑（Rigo 2001, 65）[^rigo-2001]。然而，其文风简洁，抄本传统明署伊塔洛斯之名，又偏好亚里士多德羊鹿（traghelaphos，一种虚构动物）之例——此例亦见于 *Qu* 3 与 *Qu* 28（参见 Romano 1994）[^romano-1994]——皆可为其真品佐证。该文简要界定五个词项（属、种、种差、固有属性与偶性，即波菲利所区分之共相），并论其相互关系（Romano 1992）[^romano-1992]。或亦出自伊塔洛斯之手者，为伪狄奥尼修斯《天阶体系》（*De Coelesti Hierarchia*）第一章的三篇注疏，见于佛罗伦萨抄本 Laur. plut. V.13（Rigo 2006）[^rigo-2006]。这些注疏指出（于诸问题之外）：天阶乃全无质料之可知领域，故不生成、不朽坏。
  - id: 6
    kind: body
    source: |-
      Italos’ undisputed writings include *De rhetorica*. It has been shown that this work is not an actual summary of Aristotle’s *Rhetoric* but rather a compilation from commentaries and prolegomena that were available to Italos (Conley 1998; 2004)[^conley-1998]. In particular, it is remarkable that Italos does not mention *enthymēmata* (rhetorical demonstrations), which indicates that he did not have first-hand knowledge of the *Rhetoric*. Similarly, Italos’ commentary on books II-IV of Aristotle’s *Topics* (*In Aristotelis Topicorum commentaria*) does not offer an independent exposition of the Aristotelian work but draws heavily on Alexander of Aphrodisias’ commentary (Wallies 1891; Kotzabassi 1999)[^kotzabassi-1999][^wallies-1891]. Italos’ interest in the *Topics* is evident also in his *De dialectica* and *De syllogismis*. In the former work he defines dialectics as the intermediary between the demonstrative and sophistic arts. Its purpose is to train the mind and to reason well – relying on common beliefs (endoxa) – whenever demonstrative proof cannot be given (§6). By drawing consistently on Aristotle’s *Topics* and *Prior Analytics*, he offers an introduction to Aristotelian dialectics and syllogistic, which he dedicated to the co-emperor Andronikos Doukas. He continued his introduction in *De syllogismis*, which starts by distinguishing the matter (premises) from the form (figures) of syllogisms. He goes on to differentiate ten kinds (topoi) to construct syllogisms (§7), which he discusses in detail (§§8–32) before providing a synopsis of Aristotle’s *Topics* II-VI (§§33-89). The logical treatises show Italos as an author who – much like Aristotle – shunned redundancy, expressing himself succinctly to the point of occasional obscurity. They also show him as a teacher who composed epitomes for the courtly intelligentsia.
    step1: |-
      伊塔洛斯无可争议的著作包括《修辞学》（*De rhetorica*）。已有研究表明，此书并非亚里士多德《修辞学》（*Rhetoric*）的实际提要，而是对伊塔洛斯所能见到的评注与导论的汇编（Conley 1998; 2004）[^conley-1998]。尤须注意，伊塔洛斯没有提及 *enthymēmata*（修辞论证），这表明他并未直接读过《修辞学》原典。同样，伊塔洛斯对亚里士多德《论题篇》（*Topics*）第二至四卷的评注（*In Aristotelis Topicorum commentaria*）并非对亚氏著作的独立阐发，而是大量取材于阿弗罗狄西亚的亚历山大的评注（Wallies 1891; Kotzabassi 1999）[^kotzabassi-1999][^wallies-1891]。伊塔洛斯对《论题篇》的兴趣，也见于其《论辩证法》（*De dialectica*）与《论三段论》（*De syllogismis*）。在前一部著作中，他把辩证法界定为证明技艺与诡辩技艺之间的中介。其目的在于训练心智、善于推理——依据共同意见（endoxa）——凡在不能给出证明之处（§6）。通过一贯地依据亚里士多德的《论题篇》与《前分析篇》，他提供了一部亚里士多德辩证法与三段论导论，并题献给共治皇帝安德罗尼科斯·杜卡斯。他在《论三段论》中续作导论，开篇即区分三段论的质料（前提）与形式（格）。接着他区分出构造三段论的十种方式（topoi）（§7），详加讨论（§§8–32），然后提供亚里士多德《论题篇》第二至六卷的概要（§§33-89）。这些逻辑论著表明，伊塔洛斯像亚里士多德一样避忌冗赘，行文简洁乃至偶有晦涩。它们也表明他是一位为宫廷知识界编纂纲要的教师。
    step2: |-
      伊塔洛斯确凿无疑的著作有《修辞学》（*De rhetorica*）。研究已表明，此书并非亚里士多德《修辞学》（*Rhetoric*）的提要，而是汇集了伊塔洛斯手边可用的评注与导论（Conley 1998; 2004）[^conley-1998]。尤其值得注意的是，伊塔洛斯未提及 *enthymēmata*（修辞论证），可见他并未亲读《修辞学》。与此相类，他对亚里士多德《论题篇》（*Topics*）第二至四卷的评注（*In Aristotelis Topicorum commentaria*）亦非独立阐发，而多本阿弗罗狄西亚的亚历山大的评注（Wallies 1891; Kotzabassi 1999）[^kotzabassi-1999][^wallies-1891]。伊塔洛斯对《论题篇》的措意，于《论辩证法》（*De dialectica*）与《论三段论》（*De syllogismis*）中亦可见。在前书中，他把辩证法规定为证明术与诡辩术之间的中道，其用在于训练心智、凡不能给出证明时便依据共同意见（endoxa）作善巧推理（§6）。他始终以亚里士多德《论题篇》与《前分析篇》为据，撰成一部亚里士多德辩证法与三段论导论，题献给共治皇帝安德罗尼科斯·杜卡斯。《论三段论》续其绪，开篇即分三段论之质料（前提）与形式（格），继而辨明构造三段论的十种论式（topoi）（§7），详论于 §§8–32，最后撮述亚里士多德《论题篇》第二至六卷（§§33-89）。这些逻辑论著显示，伊塔洛斯与亚里士多德一样力避冗赘，文字简练，间或流于晦涩；也显示他是一位为宫廷知识阶层编纂提要的教师。
