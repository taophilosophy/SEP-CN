      Italos taught a coherent theory on ethics. In *Qu* 63, he differentiates between different types of virtues: natural virtues, which animals possess and, thus, do not really count as virtues; ethical virtues, which are the first human ones, as they require reason; and higher forms of virtues, which are essential for the union with the One. Italos draws on Aristotle’s *Nicomachean Ethics* (Book II) and establishes that ethical virtues constitute a mean between two extremes. Ethical virtues include the four cardinal virtues: prudence, justice, fortitude, and temperance. These virtues do not constitute a capacity or passion but a habitual state (hexis), which is attained through the use of the rational part of the soul. Italos uses Plato’s tripartite division of the soul into reason (logismos), passion (thymos), and desire (epithymia) (*Republic* 435c–441c) and the chariot allegory (*Phaedrus* 246a–254e) to describe the leading role that reason holds in acquiring virtues. In *Qu* 81, he integrates his views on ethical virtues into the larger framework of the Neoplatonic hierarchy of virtues. Accordingly, Italos identifies Aristotle’s ethical virtues with Plotinus’ political virtues. The political (or civic) virtues are the lowest kinds of (human) virtues and are superseded by the purgative, contemplative, and paradigmatic virtues (cf. Stéphanou 1949, 104–107)[^stéphanou-1949]. Italos closely follows here Plotinus (*Enn*. I.2) and Porphyry (*Sentences*, chap. 32) and notes that the notion that political virtue is a mean between extremes does not apply to the higher forms of virtue. By subsuming Aristotelian ethics into the Neoplatonic hierarchy of virtues, Italos promotes a Neoplatonic anthropology: humans are rational souls that seek to return to the intelligible and incorporeal God. Ethical (or political) virtues apply to mankind’s current embodied existence, which forms a mere transitory stage in the preparation of the soul’s return (O’Meara 2021, 145)[^o’meara-2021]. Thus, when expounding Christ’s injunction to turn the other cheek (Matt. 5:39) in *Qu* 77, he argues that what Christ meant was to renounce the worldly duality (hylikē dyada) of opinion and reason, matter and form. Overcoming the dualistic (or binary) condition of embodied souls – a result of the Fall – is the ultimate goal of ethical training.
    step1: |-
      伊塔洛斯讲授了一套连贯的伦理学说。在 *Qu* 63 中，他区分了几种德性：自然德性，动物也具有，因而并不真正算是德性；伦理德性，这是人的第一种德性，因为它们需要理性；以及更高的德性形式，它们对于与太一的合一必不可少。伊塔洛斯取材于亚里士多德《尼各马可伦理学》（卷二），确立伦理德性是两个极端之间的中道。伦理德性包括四种枢德：明智、正义、坚毅与节制。这些德性不是一种能力或情感，而是一种习性状态（hexis），须通过运用灵魂的理性部分而获得。伊塔洛斯采用柏拉图把灵魂分为推理（logismos）、激情（thymos）与欲望（epithymia）的三分（《理想国》435c–441c），以及御车比喻（《斐德罗篇》246a–254e），来描述理性在获得德性中的主导作用。在 *Qu* 81 中，他把伦理德性的观点纳入新柏拉图主义德性等级的更大框架。据此，伊塔洛斯把亚里士多德的伦理德性等同于普罗提诺的政治德性。政治（或公民）德性是（人类）德性中最低的一级，为净化德性、观照德性与范型德性所超越（参 Stéphanou 1949, 104–107）[^stéphanou-1949]。伊塔洛斯在这里紧随普罗提诺（《九章集》I.2）与波菲利（《箴言集》第 32 章），并指出政治德性是极端之间的中道这一说法不适用于更高的德性形式。通过把亚里士多德伦理学归摄于新柏拉图主义的德性等级，伊塔洛斯抬出了一种新柏拉图主义的人类学：人是寻求回归理智性、无形体之上帝的理性灵魂。伦理（或政治）德性适用于人类当下具身的生存，而这只是灵魂回归准备中的一个过渡阶段（O’Meara 2021, 145）[^o’meara-2021]。因此，在 *Qu* 77 中阐述基督“转另一颊”的诫命（Matt. 5:39）时，他论证基督的本意是弃绝由意见与理性、质料与形式构成的尘世二元（hylikē dyada）。克服具身灵魂的二元（或两分）处境——堕落的后果——是伦理训练的终极目标。
    step2: |-
      伊塔洛斯讲授了一套成体系的伦理学说。*Qu* 63 区分数种德性：自然德性，动物亦有，故不算真正的德性；伦理德性，人的第一种德性，因为它以理性为前提；还有更高的德性形式，与太一合一所必需。伊塔洛斯本于亚里士多德《尼各马可伦理学》第二卷，确立伦理德性为两极之间的中道，包括四种枢德：明智、正义、坚毅、节制。它们不是能力，也不是情感，而是一种习性状态（hexis），须凭灵魂理性部分的运用而养成。伊塔洛斯借柏拉图对灵魂的三分——推理（logismos）、激情（thymos）、欲望（epithymia）（《理想国》435c–441c）——与御车比喻（《斐德罗篇》246a–254e），描述理性在德性养成中的主导地位。在 *Qu* 81 中，他把伦理德性安放进新柏拉图主义德性等级的大框架：亚里士多德的伦理德性被他等同于普罗提诺的政治德性。政治（公民）德性是人类德性中最低的一级，其上是净化德性、观照德性与范型德性（参 Stéphanou 1949, 104–107）[^stéphanou-1949]。这里他紧随普罗提诺（《九章集》I.2）与波菲利（《箴言集》第 32 章），并指出“政治德性是两极间的中道”之说并不适用于更高的德性形式。把亚里士多德伦理学归摄于新柏拉图主义德性等级，伊塔洛斯便抬出了一种新柏拉图主义人类学：人是理性灵魂，力求回归理智性的、无形体的上帝。伦理（政治）德性属于人类当下具身的生存——这在灵魂回归的准备中只是过渡一站（O’Meara 2021, 145）[^o’meara-2021]。所以在 *Qu* 77 阐发基督“打另一边脸也转过去由他打”的训诫（Matt. 5:39）时，他论证基督的本意是弃绝由意见与理性、质料与形式构成的尘世二元（hylikē dyada）。克服具身灵魂的二元（或两分）处境——堕落的后果——才是伦理训练的终极目标。
