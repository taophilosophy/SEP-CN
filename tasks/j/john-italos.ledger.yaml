      Italos’ teachings aroused considerable attention among his contemporaries and were subject of repeated debates. His views were investigated twice by ecclesiastical synods; first in 1076/77, when he was acquitted, and again in 1082, when he was anathematized. The latter trial was a major event at the time. We know about it not only from narrative sources, i.e., Anna Komnēnē (Reinsch/Kambylis 2001, 165–167)[^reinsch-2001] and Nikētas Chōniatēs (Tafel 1832, 2–3)[^tafel-1832], but also from legal and liturgical documents, i.e., the trial records (Gouillard 1985b)[^gouillard-1985b] and the *Synodikon of Orthodoxy* (Gouillard 1967, 57–61). The *Synodikon* is a liturgical text that was originally composed in the ninth century to commemorate the restoration of icon veneration at the end of the iconoclast controversy. It was repeatedly updated starting from the second half of the eleventh century, with the condemnations against Italos marking the first major addition. The condemnations consist of ten articles (an eleventh, personal condemnation is contained in some manuscripts), which claim that Italos held divergent views on cosmology, theology, and eschatology. It is unlikely that all the accusations were baseless, although we have to assume that they contain simplifications and distortions of Italos’ actual views.
    step1: |-
      伊塔洛斯的学说在其同时代人中引起了相当大的关注，并一再成为争论的对象。教会会议两次审查他的观点：第一次在 1076/77 年，他被判无罪；第二次在 1082 年，他被绝罚。后一次审判在当时是重大事件。我们了解它，不仅通过叙述性文献，即安娜·科穆宁娜（Reinsch/Kambylis 2001, 165–167）[^reinsch-2001]与尼基塔斯·霍尼亚提斯（Tafel 1832, 2–3）[^tafel-1832]，也通过法律与礼仪文献，即庭审记录（Gouillard 1985b）[^gouillard-1985b]与《正教会议文献》（Gouillard 1967, 57–61）。《正教会议文献》是一部礼仪文献，最初编于九世纪，用以纪念圣像破坏运动结束时圣像崇拜的恢复。自十一世纪下半叶起，它被多次增订，针对伊塔洛斯的谴责是第一次重大增补。谴责由十条条文构成（某些抄本中还有第十条针对其个人的谴责），声称伊塔洛斯在宇宙论、神学与末世论上持歧见。不太可能所有指控都毫无根据，尽管我们必须假定其中包含对伊塔洛斯实际观点的简化与歪曲。
    step2: |-
      伊塔洛斯的学说在当时引起相当大的关注，争论一再发生。教会会议两次审查其观点：第一次在 1076/77 年，获判无罪；第二次在 1082 年，被处绝罚。后一次审判在当时是件大事。我们知道它，不仅靠叙述文献——安娜·科穆宁娜（Reinsch/Kambylis 2001, 165–167）[^reinsch-2001]与尼基塔斯·霍尼亚提斯（Tafel 1832, 2–3）[^tafel-1832]——也靠法律与礼仪文献：庭审记录（Gouillard 1985b）[^gouillard-1985b]与《正教会议文献》（Gouillard 1967, 57–61）。《正教会议文献》初编于九世纪，本为纪念圣像破坏运动落幕、圣像崇拜恢复而设；十一世纪下半叶起屡经增订，针对伊塔洛斯的谴责是第一次重大增补。谴责共十条（部分抄本另有第十条、针对其个人的谴责），指他在宇宙论、神学与末世论上持论歧异。所有指控不可能全然无据，尽管其中无疑含有对其真实观点的简化与歪曲。
