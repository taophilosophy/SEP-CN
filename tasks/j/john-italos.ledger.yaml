      Italos’ most important work is his *Quaestiones quodlibetales* (*Questions and Answers* or *Ἀπορίαι καὶ λύσεις*). It comprises a collection of 93 aporetic chapters, in which Italos discusses various issues related to logic, epistemology, ethics, physics, and theology. The collection stands in the tradition of eleventh-/twelfth-century erōtapokriseis (e.g., Michael Psellos’ *De omnifaria doctrina*, Symeōn Sēth’s *Conspectus rerum naturalium*). Ιt was not compiled by Italos himself, given that it contains spurious works (*Qu* 59) and lecture notes by his students (*Qu* 44). Yet the bulk of the miscellany is authentic. It contains references to Italos’ oral teachings (e.g., *Qu* 63, 68) and a number of works dedicated to members of the imperial court. *Qu* 43 was written in response to an inquiry by co-emperor Andronikos Doukas regarding a Homeric passage (Trizio 2013)[^trizio-2013], *Qu* 50 instructs Emperor Michael VII on the post-mortem fate of the soul, and *Qu* 71 proves to an unspecified emperor (possibly Alexios I) that the world is not everlasting. The work also contains a letter to an unspecified Abkhazian grammarian (*Qu* 64), who may be identified with the Georgian philosopher Ioane Petritsi (Kechagmadze 1967)[^kechagmadze-1967]. The *Quaestiones* comprise a miscellany whose compositional technique and variegated contents remain to be studied.
    step1: |-
      伊塔洛斯最重要的著作是他的《问答集》（*Quaestiones quodlibetales*，或 *Ἀπορίαι καὶ λύσεις*）。它辑有 93 个疑难章节，伊塔洛斯在其中讨论逻辑、认识论、伦理学、物理学与神学的各种问题。该集属于十一/十二世纪问答体著作（erōtapokriseis）的传统（如米海尔·普塞洛斯的 *De omnifaria doctrina*、西美翁·塞特的 *Conspectus rerum naturalium*）。它并非伊塔洛斯本人所编，因为其中收有伪作（*Qu* 59）与其学生的听课笔记（*Qu* 44）。但杂集的主体是真实的。其中包含对伊塔洛斯口授教义的引用（如 *Qu* 63、68），以及若干题献给帝国宫廷成员的著作。*Qu* 43 为回答共治皇帝安德罗尼科斯·杜卡斯关于荷马一段诗文的询问而作（Trizio 2013）[^trizio-2013]；*Qu* 50 就灵魂死后的命运教导米海尔七世；*Qu* 71 向一位不知名的皇帝（可能是阿莱克修斯一世）证明世界并非永恒。书中还有一封写给一位身份不明的阿布哈兹语法家的信（*Qu* 64），此人或可考订为格鲁吉亚哲学家乔安·佩特里齐（Kechagmadze 1967）[^kechagmadze-1967]。《问答集》是一部杂集，其编纂技巧与驳杂内容尚待研究。
    step2: |-
      伊塔洛斯最重要的著作是《问答集》（*Quaestiones quodlibetales*，或希腊文 *Ἀπορίαι καὶ λύσεις*）。全书辑为 93 个疑难章节，遍及逻辑、认识论、伦理学、物理学与神学诸题。它承袭十一、十二世纪问答体（erōtapokriseis）的写作传统（如米海尔·普塞洛斯的 *De omnifaria doctrina*、西美翁·塞特的 *Conspectus rerum naturalium*）。此集并非伊塔洛斯亲手所编：书中收有伪作（*Qu* 59）与其学生的听课笔记（*Qu* 44）。不过杂集的主体确为真作，其中既见伊塔洛斯口授教义之迹（如 *Qu* 63、68），也有多篇幅题献给帝国宫廷成员。*Qu* 43 为答共治皇帝安德罗尼科斯·杜卡斯询问荷马一段诗文而作（Trizio 2013）[^trizio-2013]；*Qu* 50 就灵魂死后的归宿教诲米海尔七世；*Qu* 71 则向一位身份不明的皇帝（或即阿莱克修斯一世）证明世界并非永恒。书中还有致一位不具名阿布哈兹语法家的书信（*Qu* 64），其人或即格鲁吉亚哲学家乔安·佩特里齐（Kechagmadze 1967）[^kechagmadze-1967]。《问答集》体例驳杂，其编纂技法与纷繁内容尚待研究。
