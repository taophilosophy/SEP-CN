      While views depart on whether Italos actually held heterodox views, there is virtual unanimity in scholarship that he was condemned, at least in part, for political reasons. As head of the school of philosophy, Italos enjoyed the direct patronage of the imperial court under the Doukas dynasty (1059–1081). When Emperor Alexios I usurped the throne in 1081, those connections became disadvantageous. Italos was seen as a threat to the early rule of Alexios I. His daughter, Anna Komnēnē, later recalled that Italos – allegedly – incited his students to insurrection (*Alexiad* V.9.4; Buckley 2014, 125–129)[^buckley-2014]. Other political considerations, such as Italos’ Latin origin and the emperor’s intention to distract public attention from military setbacks, certainly disfavored the philosopher’s position. Moreover, factional rivalry within the school of philosophy (Anastasi 1975, 531)[^anastasi-1975] and the tacit socio-economic implications of his Christian Platonism (Kraft 2021)[^kraft-2021] further contributed to his downfall, which should be seen as the outcome of a confluence of several factors.
    step1: |-
      虽然在伊塔洛斯是否真的持有异端观点上意见分歧，但学界几乎一致承认，他之被定罪至少部分出于政治原因。作为哲学学派的首脑，伊塔洛斯在杜卡斯王朝（1059–1081）治下享有帝国宫廷的直接庇护。1081 年阿莱克修斯一世篡位之后，这些关系反成不利。伊塔洛斯被视为阿莱克修斯一世初期统治的威胁。其女安娜·科穆宁娜后来回忆说，伊塔洛斯——据称——曾煽动其学生作乱（*Alexiad* V.9.4; Buckley 2014, 125–129）[^buckley-2014]。其他政治考量，如伊塔洛斯的拉丁出身，以及皇帝欲转移公众对军事失利的注意，当然也使这位哲学家的处境更为不利。此外，哲学学派内部的派系之争（Anastasi 1975, 531）[^anastasi-1975]，及其基督教柏拉图主义不言自明的社会经济意涵（Kraft 2021）[^kraft-2021]，进一步促成了他的败落——此事宜看作数种因素汇流的结果。
    step2: |-
      伊塔洛斯是否果持异端之见，论者纷纭；至于其被定罪至少部分出于政治之因，则学界几无异词。身为哲学学派首脑，杜卡斯王朝（1059–1081）治下的伊塔洛斯径受帝国宫廷庇护。1081 年阿莱克修斯一世以篡夺登位，此等渊源遂转为不利，伊塔洛斯被视作其初政之威胁。其女安娜·科穆宁娜后来追述，谓伊塔洛斯尝煽动门生作乱（此说据称，见 *Alexiad* V.9.4; Buckley 2014, 125–129）[^buckley-2014]。另有若干政治考量——如其拉丁出身，又如皇帝欲移公众之目于军事失利之外——当然也使这位哲学家的地位愈形危殆。加之学派内部派系相倾（Anastasi 1975, 531）[^anastasi-1975]，其基督教柏拉图主义又有不宣而自明的社会经济意涵（Kraft 2021）[^kraft-2021]，凡此皆助推其败；其倾覆宜作数因汇流之果观之。
