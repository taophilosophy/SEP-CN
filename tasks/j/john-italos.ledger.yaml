    source: |-
      Italos’ extant writings are mostly didactic treatises written for his students. The esoteric nature of these writings explains in part their succinct and unadorned style. Moreover, the treatises presume the reader’s familiarity not only with the school curriculum but also with Italos’ own views. As has been noted, it is difficult to reconstruct a philosophical system on the basis of didactic epitomes and commentaries alone (Stéphanou 1957, 433)[^stéphanou-1957]. Notwithstanding this limitation, the *Quaestiones* are our best source for piecing together Italos’ teachings. Supplementary sources are the trial records, the *Synodikon* anathemas, the *Alexiad*, and the *Timarion*. These sources provide crucial testimonies, but they are hostile towards the philosopher and must be taken *cum grano salis*. The reconstruction of Italos’ teachings largely rests on one’s decision about 1) the reliability of those hostile accounts and 2) the trustworthiness of Italos’ own statements. For instance, the *Alexiad* and the *Synodikon* anathemas both claim that Italos taught the transmigration of souls and the eternity of Platonic ideas, while holding a blasphemous attitude towards the saints. However, these views cannot be corroborated with Italos’ own statements, unless one allows for some degree of distortion and/or dissimulation. One way of making sense of the discrepancies between Italos’ writings and later testimonies is to assume that Italos took part in an intellectual struggle between two factions: on the one end stood radical Hellenizers and, on the other, orthodox fundamentalists (e.g., the authors of the *Synodikon* anathemas). Italos represented a middle position, which sought to harmonize Hellenic learning with the Christian faith (Masai 1956, 292)[^masai-1956]. Owing to his tightrope position, he was vilified by extremists on both sides. The following exposition of Italos’ teachings on logic, the cosmos, ethics, the soul, and God reflects his coherent and eclectic Christian Platonism.
    step1: |-
      伊塔洛斯现存著作大多是为学生撰写的教学论著。这些著作的秘传性质，部分解释了其简洁无华的文风。此外，这些论著预设读者不仅熟悉学校课程，也熟悉伊塔洛斯本人的观点。如前所述，仅凭教学纲要与评注很难重构一个哲学体系（Stéphanou 1957, 433）[^stéphanou-1957]。尽管有这一限制，《问答集》仍是我们拼合伊塔洛斯学说的最佳材料。补充材料包括审判记录、《正教汇编》（*Synodikon*）中的绝罚条款、《阿莱克修斯传》以及《提马里翁》（*Timarion*）。这些材料提供了关键证词，但它们对这位哲学家抱有敌意，必须 *cum grano salis*（有所保留地）对待。对伊塔洛斯学说的重构，在很大程度上取决于两点判断：1）这些敌意记述的可靠性；2）伊塔洛斯本人陈述的可信度。例如，《阿莱克修斯传》与《正教汇编》的绝罚条款都声称，伊塔洛斯教导灵魂转世与柏拉图理念的永恒，并对圣徒持亵渎态度。然而，这些观点无法用伊塔洛斯本人的陈述来印证，除非我们容许某种程度的歪曲和/或掩饰。要理解伊塔洛斯著作与后世证词之间的分歧，一种办法是假定伊塔洛斯卷入了一场两个派别之间的思想斗争：一端是激进的希腊化派，另一端是正统派基要主义者（例如《正教汇编》绝罚条款的作者们）。伊塔洛斯代表一种中间立场，试图调和希腊学问与基督教信仰（Masai 1956, 292）[^masai-1956]。由于这种如履钢丝的立场，他遭到双方极端分子的诋毁。以下对伊塔洛斯关于逻辑、宇宙、伦理、灵魂与上帝的学说的阐述，反映了他那融贯而折衷的基督教柏拉图主义。
    step2: |-
      伊塔洛斯现存之作，多为写给学生的教学论著。其秘传性格，部分解释了何以文风简洁无饰。再者，这些论著预设读者既熟稔学校课程，也了解伊塔洛斯本人的见解。前已提及，单凭教学提要与评注，殊难重构一套哲学体系（Stéphanou 1957, 433）[^stéphanou-1957]。尽管有此局限，《问答集》仍是拼合伊塔洛斯学说的首要材料；审判记录、《正教汇编》（*Synodikon*）的绝罚条款、《阿莱克修斯传》与《提马里翁》（*Timarion*）则可作补充。这些材料提供了关键证词，然其立场敌视这位哲学家，读时必须 *cum grano salis*（打些折扣）。伊塔洛斯学说的重构，大体取决于两项判断：其一，这些敌意记述是否可靠；其二，伊塔洛斯本人的陈述是否可信。譬如，《阿莱克修斯传》与《正教汇编》的绝罚条款均称伊塔洛斯主张灵魂转世、柏拉图理念永恒，且对圣徒口出不敬。但这些说法在伊塔洛斯本人的言论中得不到印证，除非我们容许相当程度的歪曲与（或）文饰。欲疏通伊塔洛斯著作与后世证词之间的抵牾，一种解释是：伊塔洛斯置身于两派的思想角力之中，一端是激进的希腊化派，一端是正统派基要主义者（如《正教汇编》绝罚条款的撰者）。伊塔洛斯持中间立场，力求调和希腊学问与基督教信仰（Masai 1956, 292）[^masai-1956]。正因处境如履钢丝，他才被两端的极端分子一并诋毁。下文依次陈述伊塔洛斯在逻辑、宇宙论、伦理学、灵魂论与神学上的学说，可见其融贯而折衷的基督教柏拉图主义。
