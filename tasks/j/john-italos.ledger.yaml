      Italos’ indebtedness to the Alexandrian tradition is also apparent in his cosmology. In *Qu* 71, he sets out to demonstrate the non-eternity of the world, drawing extensively on John Philoponus. The issue whether the world is everlasting or created in the beginning of time was hotly debated among pagan and Christian philosophers of Late Antiquity. John Philoponus (d. c. 570) devoted a number of works to the dispute, refuting the arguments by Aristotle, Porphyry, and Proclus, who all had argued in favor of an everlasting world. Following the sixth century, discussions over the world’s eternity became rare. The debate was revived in the eleventh century in the Constantinopolitan school of philosophy. Italos contributed to the revival with a treatise (*Qu* 71) that argues that the current world will come to an end and be reconstituted at the resurrection, whereby the world’s form will guarantee its identity (Kraft/Perczel 2018)[^kraft-2018]. Italos advances a two-fold argumentation. His first approach is to refute Aristotelian and Proclean arguments and to show that the cosmos must have been created by God’s arbitrary will rather than by divine nature. His refutations manifestly draw on Philoponus (Bydén 2013, 168)[^bydén-2013]. One key argument holds that all matter is corruptible and that the notion of an incorruptible matter (i.e., aether) entails a logical contradiction, as two different kinds of matter (corruptible and incorruptible) would require a formal distinction that cannot be attributed to formless matter. In *Qu* 42, he examines what Plato and Aristotle had to say about the heavens and, in particular, about the fifth element (quintessence, aether). Italos takes a classical reconciliatory approach, arguing that both philosophers were in agreement regarding the body of the heavens: while Plato associated the heavens with a fifth mathematical figure (dodecahedron), Aristotle focused on the physical qualities of the heavens, from which he inferred a fifth element (aether). Italos concludes that it makes no difference whether one talks about a fifth figure (schēma) or a fifth element (stoixeion) (Mariev/Marchetto 2017, 57–62)[^mariev-2017]. *Qu* 42 is a hermeneutical exercise and may not fully reflect Italos’ personal view because, for him, all matter is equally indefinite and inherently non-existent; it is privation, non-being, and the cause of the decay in (and of) the world. Elsewhere (*Qu* 92), Italos examined in detail the Plotinian and Proclean views of matter. It has been argued that this discussion presents another scholastic exercise, in which Italos opposes two prominent Neoplatonic theories of matter and shows their inconsistency (Stéphanou 1949, 92; Trizio 2014)[^stéphanou-1949][^trizio-2014]. Thus, it is important to keep in mind the argumentative strategy of a given treatise when interpreting and decoding Italos’ contentions. In regard to *Qu* 71, Italos’ strategy was to refute eternalist arguments in order to uphold Christian morals. This is made explicit in his second approach, which asserts that Christian piety necessitates the belief in the end of the world. An everlasting world would preclude the last judgment, which is foundational for Christian piety and ethics.
    step1: |-
      伊塔洛斯对亚历山大里亚传统的亏欠，在其宇宙论中也显而易见。在 *Qu* 71 中，他着手证明世界并非永恒，大量取资于约翰·菲洛波努斯。世界是永恒的，还是在时间之始被创造的，这一问题在古代晚期的异教与基督教哲学家之间曾激烈争论。约翰·菲洛波努斯（卒于约 570 年）为这场争论写下多部著作，驳斥亚里士多德、波菲利与普罗克洛斯的论证，他们三人都主张世界永恒。六世纪之后，关于世界永恒的讨论变得稀少。十一世纪，这场辩论在君士坦丁堡的哲学学派中复兴。伊塔洛斯以一篇论文（*Qu* 71）参与了复兴，该文论证当前的世界将会终结，并在复活时重新构成，而世界的形相将保证其同一性（Kraft/Perczel 2018）[^kraft-2018]。伊塔洛斯提出双重论证。他的第一种进路是驳斥亚里士多德式与普罗克洛斯式的论证，并表明宇宙必定是上帝任意意志的创造，而非出于神圣本性。他的驳论明显取资于菲洛波努斯（Bydén 2013, 168）[^bydén-2013]。一个关键论证是：一切质料都是可朽坏的；而不可朽坏的质料（即以太）这一概念包含逻辑矛盾，因为两种不同的质料（可朽坏的与不可朽坏的）将要求一种形式上的区分，而这种区分不能归于无形式的质料。在 *Qu* 42 中，他考察柏拉图与亚里士多德关于天界、尤其是关于第五元素（第五本质，以太）的论述。伊塔洛斯采取古典的调和进路，认为两位哲学家关于天之物体的看法是一致的：柏拉图把天界与第五种数学图形（十二面体）相联系，亚里士多德则着眼于天界的物理性质，并由此推断出第五元素（以太）。伊塔洛斯的结论是，谈第五种图形（schēma）还是谈第五种元素（stoixeion）并无区别（Mariev/Marchetto 2017, 57–62）[^mariev-2017]。*Qu* 42 是一项诠释练习，未必完全反映伊塔洛斯的个人观点，因为在他看来，一切质料同样是不定的、内在地非存在的；它是匮乏、非存在，是世界衰败的原因。在别处（*Qu* 92），伊塔洛斯详细考察了普罗提诺式与普罗克洛斯式的质料观。有论者认为，这一讨论是另一项经院式练习，伊塔洛斯在其中对立两种著名的新柏拉图主义质料理论，并表明它们不一致（Stéphanou 1949, 92; Trizio 2014）[^stéphanou-1949][^trizio-2014]。因此，在解读和破译伊塔洛斯的论点时，切记某一论著的论证策略，这一点很重要。就 *Qu* 71 而言，伊塔洛斯的策略是驳斥永恒论论证，以维护基督教道德。他的第二种进路明确道出了这一点：基督教的虔敬必然要求信仰世界的终结。一个永恒的世界将排除最后审判，而最后审判是基督教虔敬与伦理的基石。
    step2: |-
      伊塔洛斯之于亚历山大里亚传统的亏欠，于其宇宙论亦灼然可见。*Qu* 71 中，他力图证明世界并非永恒，所据多出约翰·菲洛波努斯。世界究竟永恒，抑或在时间之始受造，此问题在古代晚期的异教与基督教哲学家之间争论甚烈。约翰·菲洛波努斯（卒于约 570 年）为此撰有多部著作，驳亚里士多德、波菲利与普罗克洛斯之说——三家皆主世界永恒。六世纪以降，关于世界永恒的讨论渐稀；至十一世纪，此辩在君士坦丁堡的哲学学派中重振。伊塔洛斯以 *Qu* 71 与之：此文论证当前世界终将终结，并于复活时重新构成，世界的形相则保证其同一性（Kraft/Perczel 2018）[^kraft-2018]。其论证分两路。第一路驳亚里士多德式与普罗克洛斯式论证，以明宇宙必出于上帝任意之意志，而非出于神圣本性；其驳论明显取资菲洛波努斯（Bydén 2013, 168）[^bydén-2013]。其中一要旨为：凡质料皆可朽坏，而不可朽坏之质料（即以太）之说含逻辑矛盾——两种不同质料（可朽与不可朽）将要求一种形式上的区别，此种区别却不能加于无形式之质料。*Qu* 42 考察柏拉图与亚里士多德关于天界、尤其关于第五元素（第五本质，以太）的言论。伊塔洛斯取古典调和之路，谓二家论天之物体实相一致：柏拉图以天界系于第五种数学图形（十二面体），亚里士多德则着眼于天界之物理性质，由是推得第五元素（以太）。伊塔洛斯断言，言第五图形（schēma）抑或言第五元素（stoixeion），并无分别（Mariev/Marchetto 2017, 57–62）[^mariev-2017]。*Qu* 42 乃诠释之练习，未必尽映其个人之见；盖在伊塔洛斯看来，一切质料同属不定，内在地非存在——质料是匮乏，是非存在，是世界衰败之因。*Qu* 92 又详考普罗提诺与普罗克洛斯之质料观；论者以为，此亦一经院式练习：伊塔洛斯并置两种显赫的新柏拉图主义质料论，以显其自相抵牾（Stéphanou 1949, 92; Trizio 2014）[^stéphanou-1949][^trizio-2014]。是故解读伊塔洛斯之论，须先明某一论著的论证策略。就 *Qu* 71 而言，其策略在驳永恒论以护基督教道德；第二路论证即明言此点：基督教之虔敬必以信仰世界终结为前提。世界若永恒，则最后审判无从谈起，而最后审判正是基督教虔敬与伦理的基石。
