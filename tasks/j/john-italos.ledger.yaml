    source: |-
      Italos’ argumentative fervor earned him both praise and criticism. His alleged temperament (cf. Hunger 1987, 38)[^hunger-1987] and strict argumentativeness endeared him to his students, who included members of the ecclesiastical hierarchy and the imperial court. Due to his political network and Italian provenance, he was sent on a diplomatic mission to the Normans in the mid-1070s. During his mission, he was accused of treason, whereupon he fled to Rome. He was pardoned shortly thereafter by Emperor Michael VII and returned to Constantinople. Around the year 1076, he succeeded Psellos as Consul of the philosophers (hypatos tōn philosophōn), i.e., as the head of the school of philosophy. About this time, he was accused of heterodoxy, but the emperor, whose patronage he enjoyed, intervened on his behalf and ensured that he was acquitted. Yet the bad repute stayed with Italos. Following the usurpation of Emperor Alexios I in 1081, Italos was put on trial again and was found guilty of heterodoxy in March 1082. Most significantly, his dialectical method and his Platonic teachings were judged objectionable. Thereafter, Italos disappeared from the public sphere. Although there is some evidence that suggests he may have been partially rehabilitated (Magdalino 1996, 23, cf. *Alexiad* V.9.7)[^magdalino-1996], he was never reinstated in his teaching position.
    step1: |-
      伊塔洛斯好辩的热情既为他赢得赞扬，也招致批评。相传他性情好斗（参 Hunger 1987, 38）[^hunger-1987]、论辩苛刻，这使教会等级与帝国宫廷中的学生对他心生亲近。凭借政治人脉与意大利出身，他于 1070 年代中期被派往诺曼人处执行外交使命。使命期间他被控叛国，遂逃往罗马。此后不久，皇帝米海尔七世赦免了他，他回到君士坦丁堡。约 1076 年，他接替普塞洛斯出任哲学家执政（hypatos tōn philosophōn），即哲学学园的主持人。大约此时他被控异端，但庇护他的皇帝出面干预，确保他获判无罪。然而坏名声从此缠住了伊塔洛斯。阿莱克修斯一世于 1081 年篡位之后，伊塔洛斯再次受审，并于 1082 年 3 月被判犯有异端罪。最受指摘的，是他的论辩方法与柏拉图主义的讲授。此后伊塔洛斯从公共领域消失。虽有证据表明他可能获得部分平反（Magdalino 1996, 23，参《阿莱克修斯传》V.9.7）[^magdalino-1996]，但他从未复任教职。
    step2: |-
      伊塔洛斯好辩的热忱令他毁誉交加。相传他性情好斗（参 Hunger 1987, 38）[^hunger-1987]、论辩苛刻，教会层级与帝国宫廷中的弟子反而因此亲近他。凭借政治人脉与意大利出身，他于十一世纪七十年代中期奉派出使诺曼人。使命期间他被控叛国，出走罗马；不久皇帝米海尔七世赦免了他，他重返君士坦丁堡。约 1076 年，他接替普塞洛斯出任哲学家执政（hypatos tōn philosophōn），即哲学学园之长。就在此时前后，他被控持异端之说；所赖庇护的皇帝亲自过问，使他获判开释。然而恶名从此缠住伊塔洛斯。阿莱克修斯一世 1081 年篡夺帝位后，他再度受审，1082 年 3 月被判异端罪成立；最受非议者，正是他的论辩方法与柏拉图主义的讲授。此后伊塔洛斯便从公共舞台消失。虽有迹象表明他或曾获部分平反（Magdalino 1996, 23，参《阿莱克修斯传》V.9.7）[^magdalino-1996]，却始终未复教职。
