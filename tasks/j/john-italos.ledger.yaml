      Italos’ trial in 1082 has been presented as a watershed event not only in Italos’ career but also in the history of science. Accordingly, the condemnation is thought to have inhibited further philosophical exploration of theology and cosmology and contributed to the scientific decline in the Eastern Roman Empire (Stéphanou 1949, 119–121; Browning 1975, 15; Clucas 1981, 172–177)[^browning-1975][^clucas-1981][^stéphanou-1949]. This view can be seen as an inverted mirror image of the ‘Pierre Duhem thesis’, which argued that the Condemnation of 1277 in the Latin West led to the development of modern science. But while the ‘Duhem thesis’ has been met with substantial criticism, the thesis that Italos’ condemnation foreclosed scientific development in Byzantium still awaits refutation.
    step1: |-
      伊塔洛斯 1082 年的审判，曾被说成不仅是他个人生涯、也是科学史上的一次分水岭。据此说，那次谴责抑制了对神学与宇宙论的进一步哲学探究，并助长了东罗马帝国的科学衰落（Stéphanou 1949, 119–121; Browning 1975, 15; Clucas 1981, 172–177）[^browning-1975][^clucas-1981][^stéphanou-1949]。这一观点可以看作“皮埃尔·杜恒命题”的倒影镜像：后者主张拉丁西方 1277 年的谴责促成了近代科学的兴起。但是，尽管“杜恒命题”已遭到实质性的批评，伊塔洛斯的谴责断绝了拜占庭科学发展这一命题，至今仍待批驳。
    step2: |-
      1082 年之审，论者不仅视之为伊塔洛斯个人生涯的分水岭，且视之为科学史上的分水岭。依此说，其谴责遏止了对神学与宇宙论的 further 哲学探究，并助成东罗马帝国的科学衰歇（Stéphanou 1949, 119–121; Browning 1975, 15; Clucas 1981, 172–177）[^browning-1975][^clucas-1981][^stéphanou-1949]。此说恰如“皮埃尔·杜恒命题”的倒置镜像——彼命题谓拉丁西方 1277 年之谴责导促近代科学之兴起。然则“杜恒命题”早经实质性的批难，而谓伊塔洛斯之谴责断绝拜占庭科学之路者，至今尚无驳之者。
