    source: |-
      The greater part of the *Quaestiones* discusses logic. In *Qu* 7, Italos explains that substances (ousiai) are authyparkta, that is, they are entities that exist on their own, independently from accidents. He follows Michael Psellos in holding that, on the one hand, substances are created beings and thus dependent on divine causality, yet on the other hand, they are autonomous entities with regard to accidents (Walter 2021)[^walter-2021]. A recurrent issue is the nature of universals. Italos follows the Alexandrian tradition in assuming three modes of existence for universals: they exist as separate entities prior to the particulars (*ante res*, pro tōn pollōn), they exist together with the particulars (*in rebus*, en tois pollois), and they exist after the particulars as abstractions of the mind (*post res*, epi tois pollois). The latter derive from the apprehension of common characteristics in the particulars. Given that all universals exist in the mind of God (*ante res*), their absence from particulars (*in rebus*) precludes only their existence in our mind (*post res*) and not their absolute non-existence. This tripartite mode of being, which was championed by Ammonius Hermiae (d. c. 526), was adopted by John Italos. In *Qu* 5, Italos discusses the differences between those three kinds, noting that universals (*ante res*) exist in God’s mind and that they are the paradigms of perceptible individuals. He remarks that universals in the particulars (*in rebus*) are themselves particulars. In *Qu* 58, he argues that universals are neither corporeal nor incorporeal and, thus, are not beings (but mere concepts). Elsewhere (*Qu* 3 & 4), however, he demonstrates that universals are incorporeal in nature and do belong among beings. Universals are beings that subsist in something else (enhypostata, *Qu* 19) – i.e., either in the particular and/or in the mind. Italos’ repeated discussion of universals testifies to the importance of the topic in the school curriculum and to his adherence to the moderate (or conceptual) realism of the Alexandrian tradition (Benakis 1982, 85; Ierodiakonou 2007; *pace* Joannou 1956b, 140–146)[^benakis-1982][^ierodiakonou-2007][^ierodiakonou-2007-2][^joannou-1956b].
    step1: |-
      《问答集》的大部分篇幅讨论逻辑。在 *Qu* 7 中，伊塔洛斯解释说，实体（ousiai）是 authyparkta，也就是说，它们是独立存在、不依赖于偶性的东西。他追随米海尔·普塞洛斯，认为一方面实体是被造物，因而依赖于神圣因果性；另一方面，就偶性而言，它们又是自主的实体（Walter 2021）[^walter-2021]。一个反复出现的问题是共相的本性。伊塔洛斯遵循亚历山大里亚传统，假定共相有三种存在方式：它们作为分离的实体存在于个别事物之先（*ante res*，pro tōn pollōn）；它们与个别事物共存（*in rebus*，en tois pollois）；它们作为心智的抽象物存在于个别事物之后（*post res*，epi tois pollois）。后者来自对个别事物中共同特征的把握。既然一切共相都存在于上帝心中（*ante res*），那么它们不在个别事物中（*in rebus*）只排除了它们在我们心中的存在（*post res*），而不排除其绝对不存在。这种三重存在方式由赫尔弥亚的阿摩尼奥斯（卒于约 526 年）倡导，为约翰·伊塔洛斯所采纳。在 *Qu* 5 中，伊塔洛斯讨论这三类共相的区别，指出共相（*ante res*）存在于上帝心中，是可感知个体的范式。他指出，个别事物中的共相（*in rebus*）本身也是个别事物。在 *Qu* 58 中，他论证共相既非有形也非无形，因此不是存在者（而只是概念）。然而在别处（*Qu* 3 与 4），他表明共相在本性上是无形的，确实属于存在者之列。共相是依附于他物而存在者（enhypostata，*Qu* 19）——即或依附于个别事物，或依附于心智。伊塔洛斯对共相的反复讨论，既证明该主题在学校课程中的重要性，也证明他信奉亚历山大里亚传统的温和（或概念）实在论（Benakis 1982, 85; Ierodiakonou 2007；与 Joannou 1956b, 140–146 相反）[^benakis-1982][^ierodiakonou-2007][^ierodiakonou-2007-2][^joannou-1956b]。
    step2: |-
      《问答集》过半篇幅论逻辑。*Qu* 7 中，伊塔洛斯释实体（ousiai）为 authyparkta，即自存自立、不倚偶性而有者。他承米海尔·普塞洛斯之说：实体一面是被造物，故依赖神圣因果；一面就偶性而言又是自主者（Walter 2021）[^walter-2021]。共相之本性是屡见之题。伊塔洛斯循亚历山大里亚传统，立共相三种存在方式：作为分离实体先于个别事物而在（*ante res*，pro tōn pollōn）；与个别事物同在（*in rebus*，en tois pollois）；作为心智之抽象后于个别事物而在（*post res*，epi tois pollois）。末者源于对个别事物中共同特征的把握。既然一切共相皆在上帝心中（*ante res*），则其不在个别事物中（*in rebus*）仅排除其在吾人心中的存在（*post res*），并不排除其绝对不存在。此三重存在方式由赫尔弥亚的阿摩尼奥斯（卒于约 526 年）倡导，约翰·伊塔洛斯承之。*Qu* 5 辨此三类之别，谓共相（*ante res*）在上帝心中，为可感个体之范式；又谓个别事物中的共相（*in rebus*）本身即个别事物。*Qu* 58 则论共相既非有形亦非无形，故非存在者，仅为概念。然 *Qu* 3 与 4 又证共相本性无形，确在存在者之列。共相乃寄寓他物而存者（enhypostata，*Qu* 19），或寓于个别事物，或寓于心智。伊塔洛斯反复论共相，既见该题在课程中之要，亦见其服膺亚历山大里亚传统的温和实在论（或概念论）（Benakis 1982, 85; Ierodiakonou 2007；与 Joannou 1956b, 140–146 相反）[^benakis-1982][^ierodiakonou-2007][^ierodiakonou-2007-2][^joannou-1956b]。
