      After the condemnation, Italos disappeared from the public sphere. Yet his legacy was not immediately forgotten. The *Timarion*, a Lucianic satire of the twelfth century, presents a fictitious narrative in which Italos is rejected by ancient Greek philosophers in Hades for his incorrigible “Galilean” (Christian) mindset. He is also said to be hated by the Christians. Thus, the *Timarion* depicts Italos as a heretic, who is repelled by both ancient philosophers and contemporary Christians. With regard to the transmission history of his works, we have about two dozen manuscripts that transmit his writings. Two of the earliest manuscript copies date to the thirteenth century and are of southern Italian provenance (Vat. gr. 316 and Marc. gr. Z.265). It has been suggested that Nicholas of Otranto (d. 1235) may have brought Italos’ works from Byzantium to Italy (Romano 1988)[^romano-1988]. No work has yet been done on the reception history of Italos in late Byzantium and beyond, although heuristic comparisons with the late Byzantine philosophers Barlaam the Calabrian (Magdalino 2017)[^magdalino-2017] and Gemistos Plēthōn (Siniossoglou 2011)[^siniossoglou-2011], as well as with Ibn Rushd (Lauritzen 2007, 82)[^lauritzen-2007] and the Renaissance (Dujčev 1939)[^dujčev-1939] have been made. The impact Italos had on medieval intellectual history, if any, still remains to be established. In modern times, Italos does not seem to have been read until his rediscovery by nineteenth-century Russian and Georgian scholars (Uspenskiy 1893, 14–18, 46–67; Bezobrazov 1896; Cereteli 1924 & 1926)[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]. Thereupon, Hussey (1937, 89–94)[^hussey-1937], Stéphanou (1949)[^stéphanou-1949], Tatakis (1949, 210–215, 226–227), and Joannou (1956b)[^joannou-1956b] introduced him to Western scholarship. In recent decades, Italos has gained prominence among historians of the Byzantine world, first and foremost because of his trial and its assumed significance for the relationship between faith and reason in the Greek Middle Ages. The examination of his philosophical views has received less attention and is still in its infancy.
    step1: |-
      谴责之后，伊塔洛斯从公共领域消失。但他的遗产并未被立刻遗忘。十二世纪模仿琉善的讽刺作品《蒂马里翁》讲述了一个虚构故事：伊塔洛斯在冥府被古希腊哲学家拒之门外，因为他那不可救药的“加利利人”（基督教）心态；据说他也为基督徒所憎。于是《蒂马里翁》把伊塔洛斯描绘成一个为古代哲学家与当代基督徒共同排斥的异端。就其著作的流传史而言，约有二十余种抄本传世。两份最早的抄本可溯至十三世纪，出自南意大利（Vat. gr. 316 与 Marc. gr. Z.265）。有人提出，奥特朗托的尼古拉（卒于 1235 年）可能把伊塔洛斯的著作从拜占庭带到意大利（Romano 1988）[^romano-1988]。伊塔洛斯在拜占庭晚期及以后的接受史尚无研究，尽管已有人与拜占庭晚期哲学家卡拉布里亚的巴拉姆（Magdalino 2017）[^magdalino-2017]、杰米斯托斯·普勒东（Siniossoglou 2011）[^siniossoglou-2011]，以及伊本·鲁世德（Lauritzen 2007, 82）[^lauritzen-2007]和文艺复兴（Dujčev 1939）[^dujčev-1939]作了启发性比较。伊塔洛斯对中世纪思想史的影响——如果有——仍待确立。近代以来，伊塔洛斯似乎直到十九世纪俄国与格鲁吉亚学者重新发现之前无人问津（Uspenskiy 1893, 14–18, 46–67；Bezobrazov 1896；Cereteli 1924 与 1926）[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]。此后，Hussey（1937, 89–94）[^hussey-1937]、Stéphanou（1949）[^stéphanou-1949]、Tatakis（1949, 210–215, 226–227）与 Joannou（1956b）[^joannou-1956b]把他引介给西方学界。近几十年来，伊塔洛斯在拜占庭世界史家中间声望渐起，首要原因是他受审一案，以及人们赋予它在希腊中世纪信仰与理性关系问题上的意义。对其哲学观点的考察受到的关注较少，仍处于起步阶段。
    step2: |-
      定罪之后，伊塔洛斯从公共视野消失，但他的遗产并未随即被遗忘。十二世纪拟琉善体的讽刺之作《蒂马里翁》虚构了一个故事：伊塔洛斯在冥府遭到古希腊哲学家的拒斥，因为他无可救药的“加利利人”（基督教）心智；据说基督徒也憎恶他。《蒂马里翁》笔下的伊塔洛斯，是被古代哲学家与同时代基督徒两头拒斥的异端。就著作流传而言，传世抄本约有二十余种，其中最早的两件可溯至十三世纪，均出自南意大利（Vat. gr. 316 与 Marc. gr. Z.265）。有人推测，奥特朗托的尼古拉（卒于 1235 年）或许把伊塔洛斯的著作自拜占庭携回意大利（Romano 1988）[^romano-1988]。伊塔洛斯在拜占庭晚期乃至其后的接受史尚无人问津；虽然已有若干启发性的比较——与拜占庭晚期哲学家卡拉布里亚的巴拉姆（Magdalino 2017）[^magdalino-2017]、杰米斯托斯·普勒东（Siniossoglou 2011）[^siniossoglou-2011]，以及与伊本·鲁世德（Lauritzen 2007, 82）[^lauritzen-2007]和文艺复兴（Dujčev 1939）[^dujčev-1939]——他对中世纪思想史的影响（如果有的话）仍有待确立。进入近代，伊塔洛斯似乎无人问津，直到十九世纪俄国与格鲁吉亚学者把他重新发掘出来（Uspenskiy 1893, 14–18, 46–67；Bezobrazov 1896；Cereteli 1924 与 1926）[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]。此后 Hussey（1937, 89–94）[^hussey-1937]、Stéphanou（1949）[^stéphanou-1949]、Tatakis（1949, 210–215, 226–227）与 Joannou（1956b）[^joannou-1956b]把他引介给西方学界。近几十年，伊塔洛斯在拜占庭史家中间声名渐起，首要原因就是那次审判，以及人们加于它的意义——希腊中世纪信仰与理性关系的意义。对其哲学观点的考察反而关注较少，仍在起步阶段。
