      The nature of the soul constitutes a key issue for Italos; he examined it repeatedly (Stéphanou 1933)[^stéphanou-1933]. As a Christian, he believed in the immortality of the soul, but as a Platonist he had to qualify that belief. In *Qu* 36, Italos contests Plato’s arguments that the soul is immortal because it is a self-moving (*Phaedrus* 245c–246a) and life-giving (*Phaedo* 105c–e) principle. The soul’s dependence on the body necessitates its corruptibility. If anything in the soul is immortal then it must be something that operates independently from the body. The only such thing is the intellect. Italos endorses Aristotle’s argument that only the intellect is unaffected by the body and thus incorruptible (*De Anima* III.5). Accordingly, Italos holds that the intellect survives the body’s death while the other parts of the soul perish. Man is essentially intellect (nous) – a conviction that he reiterates throughout his writings. For instance, in *Qu* 50 he reaffirms that only the intellectual part of the soul is immortal. When the rational part of the soul detaches itself from the body at the moment of death it loses its ability to undergo motion and change. Italos follows Proclus (*Institutio theologica* §191) in asserting that the post-mortem soul becomes inactive. Thus, the dead cannot experience any further progress (epidosis, anabasis), and even the deceased saints cannot perform miracles. That is why, his opponents counted Italos among the so-called “deadsoulers” (thnētopsychitai) (Gouillard 1976, 311–312; Krausmüller 2015, 11–15)[^gouillard-1976][^krausmüller-2015]. But Italos concedes that divine grace could, in theory, overcome this incapacity and assist the deceased in their quest for the remission of sin. *Qu* 86 explores further the perennial issue of the fate of the soul by questioning the identity of our post-resurrection selves with our current selves. Italos argues that identity is a formal principle; corporeality and matter do not play any part in it. After all, our bodies are in constant change and thus cannot safeguard our identity. Italos was well aware of the food-chain argument (*Qu* 71) and thus rejected the assumption that the resurrection occurs in the very bodies that we currently live in. He held that form (eidos) is the only principle of identity (Stéphanou 1949, 93; Shchukin 2010, 120)[^shchukin-2010][^stéphanou-1949]. At the resurrection this form will be clothed anew in matter, taking on better, less corruptible properties that render the resurrected body a spiritual entity. Italos is consistent in asserting that man’s embodied nature is due to the Fall and that the rational soul strives to return to its original, prelapsarian state as intellect. Put differently, Italos promoted a Christian Platonist (dubbed “Origenist”) psychology and eschatology that postulated a spiritual resurrection and the soul’s gradual return to its intelligible, divine origin (Kraft 2021)[^kraft-2021].
    step1: |-
      灵魂的本性是伊塔洛斯的一个关键问题；他反复考察过它（Stéphanou 1933）[^stéphanou-1933]。作为基督徒，他相信灵魂不朽；但作为柏拉图主义者，他必须限定这一信念。在 *Qu* 36 中，伊塔洛斯质疑柏拉图关于灵魂不朽的论证——灵魂因为是自己推动自己的（《斐德罗篇》245c–246a）并赋予生命的（《斐多》105c–e）本原而不朽。灵魂对身体的依赖使其可坏。如果灵魂中有不朽的东西，那必是某种独立于身体运作的东西。唯一这样的东西是理智。伊塔洛斯认可亚里士多德的论证：只有理智不受身体影响，因而不可坏（《论灵魂》III.5）。据此，伊塔洛斯主张理智在身体死后存续，而灵魂的其他部分则消亡。人在本质上就是理智（nous）——他在全部著述中反复申说这一信念。例如在 *Qu* 50 中，他重申只有灵魂的理智部分不朽。当灵魂的理性部分在死亡时刻脱离身体时，它失去运动与变化的能力。伊塔洛斯跟随普罗克洛斯（《神学要义》*Institutio theologica* §191），主张死后灵魂变得不活动。因此，死者不能再有任何进步（epidosis, anabasis），甚至已故圣徒也不能行神迹。正因为如此，他的对手把伊塔洛斯算作所谓“死魂论者”（thnētopsychitai）之列（Gouillard 1976, 311–312；Krausmüller 2015, 11–15）[^gouillard-1976][^krausmüller-2015]。但伊塔洛斯承认，神圣恩典在理论上可以克服这一无能，协助死者求得罪的赦免。*Qu* 86 进一步探究灵魂命运这一永恒问题：我们复活后的自我与当下的自我是否同一？伊塔洛斯论证，同一性是一个形式原则；身体性与质料在其中不起任何作用。毕竟，我们的身体始终在变化，因而不能保障我们的同一性。伊塔洛斯清楚地知道食物链论证（*Qu* 71），因此拒绝复活发生在我们当下所居身体之中的假定。他主张形式（eidos）是唯一的同一性原则（Stéphanou 1949, 93；Shchukin 2010, 120）[^shchukin-2010][^stéphanou-1949]。复活时，这一形式将重新披上质料，取得更好、更不易坏的属性，使复活后的身体成为一个精神实体。伊塔洛斯一贯主张，人的具身本性源于堕落，理性灵魂力求回归其本原的、堕落前的状态，即作为理智。换言之，伊塔洛斯倡导一种基督教柏拉图主义的（被称为“俄里根主义”的）心理学与末世论，它设定一种精神的复活以及灵魂向其理智的、神圣本原的逐步回归（Kraft 2021）[^kraft-2021]。
    step2: |-
      灵魂的本性是伊塔洛斯的关键论题，他反复加以考察（Stéphanou 1933）[^stéphanou-1933]。身为基督徒，他信灵魂不朽；身为柏拉图主义者，他却不得不为这一信念设限。*Qu* 36 中，伊塔洛斯质疑柏拉图的两个论证：灵魂因是自我推动的本原而不朽（《斐德罗篇》245c–246a），因是赋生的本原而不朽（《斐多》105c–e）。灵魂对身体的依赖决定了它的可坏性。灵魂中若有不朽之物，它必得独立于身体而运作——那只能是理智。伊塔洛斯接受亚里士多德的论证：唯理智不为身体所动，故不可坏（《论灵魂》III.5）。于是他主张：身体死后理智犹存，灵魂其余部分则消亡。人的本质是理智（nous）——这一信念贯穿其全部著述。*Qu* 50 中他重申，唯灵魂的理智部分不朽。灵魂理性部分于死亡之际脱离身体后，便失去了运动与变化的能力。伊塔洛斯循普罗克洛斯（《神学要义》*Institutio theologica* §191），主张死后的灵魂归于不活动。死者不能再有任何长进（epidosis，anabasis），连已故圣徒也不能行神迹。他的论敌因此把伊塔洛斯归入所谓“死魂论者”（thnētopsychitai）（Gouillard 1976, 311–312；Krausmüller 2015, 11–15）[^gouillard-1976][^krausmüller-2015]。不过伊塔洛斯承认，神圣恩典在理论上可以胜过这种无能，帮助死者求得赦罪。*Qu* 86 进一步追问那个古老问题：复活后的我们与当下的我们是否同一？伊塔洛斯论证，同一性是形式原则；身体性与质料在其中毫无位置——我们的身体无时不在变化，本就担保不了同一性。他熟知食物链论证（*Qu* 71），因此拒绝“复活发生于我们当下栖居的身体”的假定。他主张唯有形式（eidos）是同一性的原则（Stéphanou 1949, 93；Shchukin 2010, 120）[^shchukin-2010][^stéphanou-1949]。复活时，这形式将重新披上质料，换得更好、更不易坏的属性，使复活的身体成为精神实体。伊塔洛斯始终主张：人的具身本性出于堕落，理性灵魂奋力回归其本原的、堕落前的状态——即作为理智而存在。换言之，伊塔洛斯倡导一种基督教柏拉图主义的（被贴上“俄里根主义”标签的）心理学与末世论：精神复活，灵魂逐步回到其理智的、神圣的本原（Kraft 2021）[^kraft-2021]。
