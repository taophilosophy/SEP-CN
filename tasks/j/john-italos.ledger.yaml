      After the condemnation, Italos disappeared from the public sphere. Yet his legacy was not immediately forgotten. The *Timarion*, a Lucianic satire of the twelfth century, presents a fictitious narrative in which Italos is rejected by ancient Greek philosophers in Hades for his incorrigible “Galilean” (Christian) mindset. He is also said to be hated by the Christians. Thus, the *Timarion* depicts Italos as a heretic, who is repelled by both ancient philosophers and contemporary Christians. With regard to the transmission history of his works, we have about two dozen manuscripts that transmit his writings. Two of the earliest manuscript copies date to the thirteenth century and are of southern Italian provenance (Vat. gr. 316 and Marc. gr. Z.265). It has been suggested that Nicholas of Otranto (d. 1235) may have brought Italos’ works from Byzantium to Italy (Romano 1988)[^romano-1988]. No work has yet been done on the reception history of Italos in late Byzantium and beyond, although heuristic comparisons with the late Byzantine philosophers Barlaam the Calabrian (Magdalino 2017)[^magdalino-2017] and Gemistos Plēthōn (Siniossoglou 2011)[^siniossoglou-2011], as well as with Ibn Rushd (Lauritzen 2007, 82)[^lauritzen-2007] and the Renaissance (Dujčev 1939)[^dujčev-1939] have been made. The impact Italos had on medieval intellectual history, if any, still remains to be established. In modern times, Italos does not seem to have been read until his rediscovery by nineteenth-century Russian and Georgian scholars (Uspenskiy 1893, 14–18, 46–67; Bezobrazov 1896; Cereteli 1924 & 1926)[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]. Thereupon, Hussey (1937, 89–94), Stéphanou (1949), Tatakis (1949, 210–215, 226–227), and Joannou (1956b) introduced him to Western scholarship. In recent decades, Italos has gained prominence among historians of the Byzantine world, first and foremost because of his trial and its assumed significance for the relationship between faith and reason in the Greek Middle Ages. The examination of his philosophical views has received less attention and is still in its infancy.
    step1: |-
      定罪之后，伊塔洛斯从公共领域消失，但其遗产并未即刻被遗忘。十二世纪仿路吉阿诺斯的讽刺作品《提马里翁》，虚构了一段叙事：伊塔洛斯在冥界被古希腊哲学家拒斥，因为他执迷不悟的“加利利人”（基督教）心态；又说基督徒也憎恨他。于是《提马里翁》把伊塔洛斯描绘成一个异端，为古代哲学家与当代基督徒两方面所共斥。至于其著作的流传史，传写其作的抄本约有二十余种。两份最早的抄本属于十三世纪，出自意大利南部（Vat. gr. 316 与 Marc. gr. Z.265）。有论者提出，奥特朗托的尼古拉（卒于 1235 年）或许把伊塔洛斯的著作从拜占庭带到了意大利（Romano 1988）[^romano-1988]。关于伊塔洛斯在拜占庭晚期及其后的接受史，迄今尚无研究，虽然已有人作过启发性的比附：与拜占庭晚期的哲学家卡拉布里亚的巴拉姆（Magdalino 2017）[^magdalino-2017] 与格弥斯托斯·普莱东（Siniossoglou 2011）[^siniossoglou-2011] 相比，也与伊本·鲁世德（Lauritzen 2007, 82）[^lauritzen-2007] 及文艺复兴（Dujčev 1939）[^dujčev-1939] 相比。伊塔洛斯对中世纪思想史的影响——如果有的话——仍有待断定。在近世，伊塔洛斯似乎一直无人问津，直到十九世纪为俄国与格鲁吉亚学者重新发现（Uspenskiy 1893, 14–18, 46–67; Bezobrazov 1896; Cereteli 1924 & 1926）[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]。其后，Hussey（1937, 89–94）、Stéphanou（1949）、Tatakis（1949, 210–215, 226–227）与 Joannou（1956b）把他介绍给西方学界。近数十年来，伊塔洛斯在拜占庭世界史研究者中日渐重要，首要原因是他的审判，以及该审判对希腊中世纪信仰与理性关系之意义的那种假定。而对其哲学观点的考察，关注较少，尚处于起步阶段。
    step2: |-
      定罪以后，伊塔洛斯退出公共舞台，但其遗产旋即未被遗忘。十二世纪那篇仿路吉阿诺斯笔法的讽刺文《提马里翁》，虚构一段叙事：伊塔洛斯在冥界遭古希腊哲学家摈拒，理由是他那不可救药的“加利利人”（基督徒）心态；又云基督徒亦复憎之。于是《提马里翁》笔下的伊塔洛斯成了两下不容的异端——为古代哲学家所摈，亦为当代基督徒所斥。论及其著作流传，传写之作约有抄本二十余部。最早之二件属十三世纪，出自意大利南部（Vat. gr. 316、Marc. gr. Z.265）。有说奥特朗托的尼古拉（卒于 1235 年）或曾携伊塔洛斯之作由拜占庭入意大利（Romano 1988）[^romano-1988]。至于伊塔洛斯在拜占庭晚期及其后的接受史，至今罕有专门研究，虽已作了若干启发性的比附：如与拜占庭晚期的卡拉布里亚的巴拉姆（Magdalino 2017）[^magdalino-2017]、格弥斯托斯·普莱东（Siniossoglou 2011）[^siniossoglou-2011] 相比，又与伊本·鲁世德（Lauritzen 2007, 82）[^lauritzen-2007] 及文艺复兴（Dujčev 1939）[^dujčev-1939] 相比。其于中世纪思想史之影响——如其果有影响——尚待论定。近世以来，伊塔洛斯长久无人寓目，迨十九世纪为俄国与格鲁吉亚学者重新发见（Uspenskiy 1893, 14–18, 46–67; Bezobrazov 1896; Cereteli 1924 & 1926）[^cereteli-1924][^bezobrazov-1896][^uspenskiy-1893]。继而由 Hussey（1937, 89–94）、Stéphanou（1949）、Tatakis（1949, 210–215, 226–227）与 Joannou（1956b）绍介入西方学界。近数十年，他在拜占庭世界史研究者中地位日重，主因其审判，以及该审判之于希腊中世纪信仰与理性关系意义的某种假定；至于其哲学观点本身，研讨尚疏，方在草创。
