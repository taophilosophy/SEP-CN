      Another section of his confession of faith (Gouillard 1985b, 147.218–149.223)[^gouillard-1985b] has been shown to be an adaptation of the Ps-Athanasian (*Quicumque*) creed, which was commonly used among the Latins (Grumel 1938)[^grumel-1938]. It contains subtle modifications that were understood at the time as indicative of a heretical Trinitology. According to one modern interpretation, Italos followed Philoponus in holding that God’s unity cannot lie on the level of secondary substance (natures or universals) but only on the level of primary substance (hypostases or concrete beings). Accordingly, God’s unity is a *hypostatic* function, which could be viewed as Tritheism, i.e., the view that three separate divine hypostases exist. This contradicts the standard Cappadocian formula, according to which God’s oneness is due the common divine substance (or nature) of the three hypostases. Thus, Italos sought to counterbalance his Tritheism with a Sabellian solution, merging the three hypostases into one and emphasizing their hypostatic union (Krausmüller 2016)[^krausmüller-2016]. Conversely, it has also been argued that Italos’ application of philosophical terms was in complete harmony with Christian Trinitology (Joannou 1956b; Clucas 1981; Niarchos 1996, 250–258)[^clucas-1981][^joannou-1956b][^niarchos-1996]. Such an apologetic reading, however, brushes aside many of Italos’ more subtle remarks.
    step1: |-
      他信仰告白的另一段（Gouillard 1985b, 147.218–149.223）[^gouillard-1985b]已被证明是伪亚大纳西信经（*Quicumque*）的改写，该信经在拉丁人中通用（Grumel 1938）[^grumel-1938]。其中包含一些微妙的改动，在当时被理解为带有异端三一论色彩的信号。按一种现代解释，伊塔洛斯跟随菲洛波努斯，主张上帝的统一性不能立于第二实体（本性或普遍者）的层面，而只能立于第一实体（位格或具体存在者）的层面。据此，上帝的统一性是一个位格性的功能，这可以被看作三神论，即认为三个彼此分离的神圣位格存在的观点。这与标准的卡帕多西亚公式相矛盾，后者认为上帝的合一源于三位格共同的神圣实体（或本性）。于是，伊塔洛斯试图以撒伯里乌式的解决方案来平衡其三神论：把三位格合而为一，强调其位格性联合（Krausmüller 2016）[^krausmüller-2016]。反之，也有论者认为伊塔洛斯对哲学术语的运用与基督教三一论完全相合（Joannou 1956b；Clucas 1981；Niarchos 1996, 250–258）[^clucas-1981][^joannou-1956b][^niarchos-1996]。但这样的辩护式读法却抹去了伊塔洛斯许多更微妙的言说。
    step2: |-
      他信仰告白的另一段（Gouillard 1985b, 147.218–149.223）[^gouillard-1985b]被证明是伪亚大纳西信经（*Quicumque*）的改写——这份信经在拉丁人中间通用（Grumel 1938）[^grumel-1938]。改写中藏着几处微妙的变动，在当时即被读出异端三一论的意味。按一种现代解释，伊塔洛斯追随菲洛波努斯：上帝的统一性不能立于第二实体（本性或普遍者）的层面，只能立于第一实体（位格或具体存在者）的层面。如此一来，上帝的统一性便是位格性的功能——这可以读作三神论，即主张三个彼此分立的神圣位格实存。这与卡帕多西亚的标准公式相抵牾：后者以上三位格共有的神圣实体（或本性）说明上帝的合一。于是伊塔洛斯试图用撒伯里乌式的方案平衡自己的三神论——把三位格合并为一，强调其位格性联合（Krausmüller 2016）[^krausmüller-2016]。反过来，也有人论证伊塔洛斯对哲学术语的运用与基督教三一论完全合拍（Joannou 1956b；Clucas 1981；Niarchos 1996, 250–258）[^clucas-1981][^joannou-1956b][^niarchos-1996]。但这种辩护式读法把伊塔洛斯许多更微妙的言说轻轻抹去了。
