      The coherence theory of justification represents an initially suggestive solution to some deeply rooted problems of epistemology. Perhaps most significantly, it suggests a way of thinking about epistemic justification as arising in a “web of belief”. As such, it competes with, and could potentially replace, the historically dominating, but increasingly disreputable, foundationalist picture of the justification needed for knowledge as resting on a secure base of indubitable fact. Coherentism may also be more promising than alternative foundationalist views with their reliance on non-doxastic support. Unfortunately, coherence theorists have generally struggled to provide the details necessary for their theory to advance beyond the metaphorical stage, something which has not gone unnoticed by their critics. Following the seminal work of C. I. Lewis, contemporary scholars have taken on that challenge with considerable success in terms of clarity and established results, although a fair number of the latter are to the coherentist’s disadvantage. Some results support a weak foundationalist theory according to which coherence can boost credibility that is already there, without creating it from scratch. However, on the face of it, the impossibility results negatively affect this less radical form of coherence theory as well. It is often observed that while it is relatively easy to put forward a convincing theory in the outline, the ultimate test for any philosophical endeavor is whether the product will survive detailed specification (the devil is in the details, and so on). What the recent developments in this area have shown, if nothing else, is that this is very much true for the coherence theory of epistemic justification.
    step1: |-
      证成的融贯理论代表了对认识论一些根深蒂固问题的初看很有启发性的解答。也许最重要的是，它提出了一种把知识证成视为产生于“信念之网”的思考方式。正因如此，它与历史上占支配地位、却日益声名狼藉的基础主义图景相竞争，并可能取代后者——后者认为知识所需的证成奠基于不可怀疑事实的可靠基础之上。融贯论也可能比依赖非信念状态支持的其他基础主义观点更有前途。遗憾的是，融贯论者一般难以提供其理论超越隐喻阶段所需的具体细节，而这一点并未逃过其批评者的眼睛。沿循 C. I. 刘易斯的开创性工作，当代学者以相当的成就承担了这一挑战——就清晰性与已确立的结果而言，尽管其中相当一部分对融贯论者不利。有些结果支持一种弱基础主义理论，按照它，融贯能够增强已经存在的可信性，却不能从零开始创造这种可信性。然而，表面看来，不可行性结果也对这一较不激进的融贯理论形式产生不利影响。人们常观察到，虽然在一开始提出一个有说服力的理论相对容易，但任何哲学事业的最终考验是它的产物能否经受住详细的规格化（魔鬼在细节中，如此等等）。这一领域近来的发展所表明的，如果说有什么的话，就是这一点对知识证成的融贯理论尤为真实。
