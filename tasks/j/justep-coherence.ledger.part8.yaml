      There are some attempts to explain or come to grips with the impossibility results that do not easily fit into the two camps identified above or represent a combination of ideas from both. For an example of the latter, Wheeler (2012; see also Wheeler and Scheines, 2013) both suggest focusing on reliability conduciveness as opposed to truth conduciveness (camp 1) and question the assumptions, primarily independence but also the Content Determination Thesis, used in the derivation of the impossibility results (camp 2). Shogenji (2007, 2013) and McGraw (2016) are other complex and insightful attempts to deepen the Bayesian analysis and diagnose of those results. Specifically, Lydia McGrew argues for a shift in focus from the coherence of contents of reports to coherence of the evidence for a hypothesis $H$ (which need not coincide with the conjunction of the report contents). If the conjunction of the members of a set of evidence supports, in the sense of raising the probability of, some hypothesis $H$, and if all members of that set are playing a role in that epistemic effect, then that set of evidence is, McGrew shows, indeed confirmatory of $H$ and in that sense truth-conducive for $H$ (McGrew 2016)[^mcgrew-2016]. McGrew offers several proposals for how to spell out “coherence for $H$”.
    step1: |-
      有些解释或应对不可行性结果的尝试并不容易归入上述两个阵营，或代表了来自两个阵营的观念的结合。后者的一例是惠勒（2012；另见 Wheeler and Scheines, 2013），他既建议关注可靠性导向而非导向真理（阵营一），也质疑推导不可行性结果所用的假定，主要是独立性，也有内容决定论题（阵营二）。将司（2007, 2013）与麦格鲁（2016）是深化对这些结果的贝叶斯分析与诊断的其他复杂而富有洞见的尝试。具体而言，莉迪娅·麦格鲁主张把焦点从报告内容的融贯转向支持假说 $H$ 之证据的融贯（后者无需与报告内容的合取重合）。如果一组证据的成员的合取支持（即提高其概率）某个假说 $H$，并且该集合的所有成员都在这一认识论效应中起作用，那么麦格鲁表明，这组证据确实确证 $H$，并在此意义上对 $H$ 是导向真理的（McGrew 2016）[^mcgrew-2016]。麦格鲁提出了若干种如何阐明“对 $H$ 的融贯”的主张。
