      这种对宗教探究的批判—复原态度，是雅斯贝尔斯所参与的许多公共争论的根本。其工作中的宗教要素遭到加尔文宗神学家卡尔·巴特的攻击；巴特谴责其超越概念缺乏客观的宗教内容。但更重要的是，雅斯贝尔斯还与鲁道夫·布尔特曼进行了一场冗长而有影响的争论，其余响至今仍影响自由主义神学论辩。这场论辩的中心，是雅斯贝尔斯对布尔特曼经文“祛神话化”（*de-mythologization*）策略的批评：即布尔特曼试图通过剔除新约中的历史或神话要素，并在一种带生存论语调的释经中聚焦于圣经中永久有效且当下相关的方面，来澄清经文的真理内容。布尔特曼最初提出这一祛神话化进路时，雅斯贝尔斯被广泛（尽管是错误地）视为属于新教神学的自由主义一翼；人们或许期待他会表示同情布尔特曼的解释学进路。然而，雅斯贝尔斯却尖锐地转而反对布尔特曼。他首先指责他在宗教论辩中传播一种虚假的理性主义；其次，指责他武断地摒弃寓于神话之中的、属于较早历史时代之人的精神经验的表现；第三，指责他把一切超越经验都对齐到一套相对价值的标准化图式上，从而在神学中强加一套新的正统体系，损害超越的多样可能性。因此，与布尔特曼相反，雅斯贝尔斯断定：唯有基于绝对自由开放（*liberality*）、排除一切正统的宗教解释学，才适合于解释人类生活的超越内容这一任务。他主张，那些从超越中抹去历史偶然性痕迹、把超越化约为某一预定宗教真理的解释方法，未能反思超越可被解释的多样而歧异的形式；它们错误地预设超越可以被封入某一排他教义的范畴之中，并低估了超越在建构上的历史可变性。因此，雅斯贝尔斯隐含地主张神话或象征形式在宗教探究中的重要性，并指出神话与宗教同样含有超越的被解释残余。他对宗教的分析最后归结为对三位一体神学的讨论；他呼应路德维希·费尔巴哈的人类学分析，断言三位一体的三个位格不应被解释为神性的实存要素，而应被解释为人类可能性的象征密码。在此，他赋予三位一体第二位格耶稣基督以特殊意义：作为人类内在改变、翻转与转化的生存可能性的密码。然而他断定：凡此密码被位格化地规定为单纯肯定性的信仰事实之处，通过同情地解释与复原这一密码而获得的超越自由，便受到阻碍。
