      雅斯贝尔斯宗教哲学的中心观念，是哲学信仰（*philosophical faith*）概念，最详尽地展开于《哲学信仰》（*Der Philosophische Glaube*，1948）与《面对基督教启示的哲学信仰》（*Der Philophische Glaube angesichts der christlichen Offenbarung*，1962）。这一以艰深著称的概念包含若干颇为不同的含义。第一，它意味着真正的哲学必须受一种对人类生存之本源超越性的信仰引导；那种否定式地排除或无视其超越起源的哲学，未能承担哲学的最高任务。然而第二，它也意味着真正的哲学不能简单地为肯定地揭示出来的真理内容或教义而抛弃哲学理性；理性的批判功能在绝对知识的形成中具有建构作用。在此意义上，雅斯贝尔斯重新审视了 1830 年代青年黑格尔派哲学中那些塑造宗教与哲学关系之争的若干争论。与青年黑格尔派一样，他坚持信仰需要哲学；凡信仰内容被教条地或肯定地宣告之处，信仰便贬损了这些内容。第三，这一概念还表明：信仰的明证总是悖论性的、不确定的，追求这些内容之知识者必须接受哲学相对主义与话语交换的态度——若信仰导致教条主义，它便立刻损害自身提供超越知识的主张。因此，哲学信仰概念被提议为：不是关于事实性启示或已完成的超越的学说，而是对超越性交往的指引——它在信仰的揭示要素与对宗教主张之绝对主义的哲学批判否决之间取得平衡，并因此坚持超越知识必须被接受为相对的、不完整的。在此，雅斯贝尔斯把其哲学的宗教面向置于神学断言与人类学断言之间的细致辩证之中。在一个层面上，他暗示纯粹世俗主义对人类生活的说明，会把生存封闭于其本源性的超越可能性与自由之外。但同时也暗示：纯粹神学分析会把人封闭于其真理的相对性与可危性之外，也封闭于这些真理借以被揭示的交往过程之外。唯有既能拥抱又相对化世俗主义、既能拥抱又相对化宗教的哲学，才能承担充分的生存探究；而在任一方向上放弃这两种承诺之间辩证锋刃的哲学，便不再是真正的哲学。
