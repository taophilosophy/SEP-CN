      The main publication of Jaspers’s earlier period, and probably of his entire career, is the three-volume work: *Philosophy* (1932). In this work, he retained the partly Hegelian focus of his earlier publications, and he followed the spirit of Hegelian phenomenology in providing an account of the formation of human consciousness, which grasps consciousness as proceeding from the level of immediate knowledge and progressing through a sequence of antinomies towards a level of truthfully unified reflection and self-knowledge. In this, Jaspers again accentuated the claim that the antinomies which reason encounters and resolves in its unfolding as truth are at once both cognitive and experiential antinomies, and that the lived moments of human existence are always of cognitively constitutive relevance for the formation of consciousness. These ideas in fact remained central to Jaspers’s philosophy throughout its subsequent evolution. In his later philosophical works, especially *Von der Wahrheit* (*Of Truth*, 1947), he continued to give prominence to cognitive models derived from Hegelian phenomenology, and he proposed a concept of *the encompassing* (*das Umgreifende*) to determine the phenomenological gradations of thought and being. However, in addition to its concern with Hegelian themes, *Philosophy* also contains a fundamental reconstruction of Kantian themes, it has its foundation in a critical reconstruction of Kant’s doctrine of transcendental ideas, and it is built around an endeavour to explain the elements of Kantian idealism as a systematic doctrine of subjective-metaphysical experience.
    step1: |-
      雅斯贝尔斯早期（也可能是其整个生涯）的主要出版物，是三卷本著作《哲学》（1932）。在此书中，他保留了早期出版物部分黑格尔式的焦点，循黑格尔现象学的精神，对人类意识的形成给出说明：意识从直接知识的层面出发，经由一连串二律背反而前进，走向真确统一的反思与自我认知层面。在此，雅斯贝尔斯再次强调：理性在其作为真理的展开中所遭遇并解决的二律背反，既是认知的二律背反，也是经验的二律背反；人类生存的亲历环节对意识的形成总具有认知建构上的相关性。这些观念事实上贯穿其后续演化的整个哲学。在其后期哲学著作，尤其《论真理》（*Von der Wahrheit*，1947）中，他继续突出源自黑格尔现象学的认知模型，并提出“包摄者”（*das Umgreifende*）概念，以规定思想与存在的现象学层级。然而，除黑格尔主题外，《哲学》还包含对康德主题的根本重构：它奠基于对康德先验理念学说的批判性重构，并围绕一个目标构建——把康德观念论的诸要素解释为一种关于主观—形而上学经验的系统学说。
