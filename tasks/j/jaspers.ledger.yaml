      Jaspers’s metaphysical reconstruction of Kantian idealism has been denounced by other philosophers, most notably those in the broad milieu of the Frankfurt School, as a stage in a wider course of a cognitive degeneration, which falsely translates absolute metaphysical contents into moments of human inner experience. Despite this, there are good grounds for arguing that Jaspers’s metaphysics is an important critique of the fully autonomist accounts of rationality proposed by neo-Kantianism, and it even coincides with the critiques of Kantian formalism which underpinned the philosophies widely associated with the Frankfurt School. Jaspers intuited that Kantian transcendentalism suppressed a deep-lying impulse for transcendence, and this aspect of Kant’s thought was badly neglected by interpreters who saw Kant’s philosophy as a doctrine of pure immanence or autonomy. Adorno’s later argument that Kant’s transcendental idealism always contains a lament over the closure of reason against transcendence was thus anticipated by Jaspers, albeit in subjectivist terms, and Jaspers and Adorno—for all their political differences—can be placed close together as thinkers who endeavoured to revitalize the metaphysical traces in idealism. In any case, Jaspers’s insistence, *contra* Kant and the neo-Kantians, that reason itself is not the sole source of knowledge, and that the task of reason is not proscriptively to circumscribe the sphere of its validity against transcendence, but to overcome its cognitive limits and to envision contents which cannot be generated by its own autonomous functions, deserves to be rehabilitated as an abidingly significant contribution to modern debates on metaphysics and epistemology.
    step1: |-
      雅斯贝尔斯对康德观念论的形而上学重构，遭到其他哲学家的谴责——最著名的是法兰克福学派广大圈子里的那些人——他们视之为一场更广的认知堕落进程中的一个阶段：它把绝对的形而上学内容虚假地转译为人类内在经验的环节。尽管如此，有充分的理由主张：雅斯贝尔斯的形而上学是对新康德主义所提完全自律的理性说明的一种重要批判；它甚至与支撑法兰克福学派诸哲学的康德形式主义批判相重合。雅斯贝尔斯直觉到，康德的先验论压制了一种深藏的超越冲动；而把康德哲学看作纯粹内在性或自律学说的解释者，严重忽视了康德思想的这一面向。因此，阿多诺后来的论点——康德的先验观念论总含着对理性封闭于超越之外的哀歌——已为雅斯贝尔斯所先声，尽管用的是主观主义的表述。抛开政治分歧不论，雅斯贝尔斯与阿多诺可并列为力图重振观念论中形而上学痕迹的思想家。无论如何，雅斯贝尔斯坚持认为——与康德及新康德派相反——理性本身并非知识的唯一来源；理性的任务不是划界式地圈定其有效性范围以对抗超越，而是克服其认知界限，设想那些无法由其自律功能生成的内容。这应当被重新确认为他对形而上学与知识论现代论争的一个持久而重要的贡献。
