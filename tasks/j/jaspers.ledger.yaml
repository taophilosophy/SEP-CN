      谢林对雅斯贝尔斯哲学那零散却重要的影响，也为理解其宗教哲学提供了线索。在一个层面上，雅斯贝尔斯在哲学上致力于友善地重新拾取宗教内容。他坚持：真理只能被解释为理性中彻底他异性（radical alterity）的要素，或理性对自身界限的经验。同样，他坚持：人类自由的条件并非仅由人的理性所生成，而是作为超越在理性思想中的侵入而被经验。因此，他的哲学同情启示神学的首要蕴涵，并谨慎地维护启示的如下根本哲学主张：真理是他者（超越）向理性的揭示，或至少是理性中他者的被解释环节。但同时，雅斯贝尔斯无论如何都不能被描述为宗教哲学家。事实上，他在若干彼此独立的方面，对启示神学以及更一般意义上的正统宗教都持严厉批评。第一，他主张宗教的中心总由一种伪客观化或绝对化的真理主张所构成；这种主张不承认超越以多种方式发生，也不承认超越的真理不能被具体化为一套事实陈述或叙事。因此，宗教世界观是受限心态的实例：它们追求在统一教义中有所依凭，以回避与超越之不确定性和不稳定性的对峙。宗教把超越设定为启示中已实现的要素，实则阻碍了人人皆有的超越能力；宗教声称提供超越，实际却阻碍它。第二，作为教条与教义正统的基础，启示性的真理主张取消了人类理性的自我批判与交往面向，损害了超越与生存性自我认知的对话前提。因此，雅斯贝尔斯把正统宗教看作对交往的阻碍：它为人类共有的求真与超越能力设下教条限制。然而，作为超越的哲学家，他也清楚：若不恢复宗教式的解释进路，若不承认哲学的奠基性内容是超越的，就无法设想人的求真，或更一般地说，人的人性。因此，其工作的很大部分可被理解为一种尝试：把宗教思想的内容，从以组织化宗教之名强加于这些内容之上的教条正统中解放出来。
