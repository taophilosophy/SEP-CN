      在海德堡任精神病学家期间，雅斯贝尔斯结识了马克斯·韦伯，也结识了围绕韦伯的其他知识分子，包括恩斯特·布洛赫、埃米尔·拉斯克、格奥尔格·齐美尔与卢卡奇。他的思想形成在若干方面打上了这一知识圈子的印记。在政治层面，他把韦伯对英雄式自由主义、负责任民族主义与精英民主的热忱之若干方面，融入自己的思想与态度。在更理论的层面，他的观念由对新康德哲学日益批判的回应所决定——这种回应支配着围绕韦伯与卢卡奇的方法论讨论，随后又渲染了第一次世界大战期间与整个魏玛共和国的思想气候。这一时期见证了新康德主义作为德国学术建制之哲学正统的废黜，也见证了哲学模型的激增：这些模型拒斥康德式形式主义，并寻求把经验、历史乃至社会学要素纳入哲学话语。把康德哲学从以海因里希·李凯尔特与威廉·文德尔班为中心的西南德新康德学派之律法式形式主义中解救出来，成为雅斯贝尔斯工作的核心特征之一；在许多方面，他整个哲学演化的动力，正是要重构康德思想——不是作为自我立法的形式主义学说，而是作为关于形而上学经验、自发决断的自由与真实内在生活的阐述。他早期作为哲学教授的经历，也深受新康德派对之作敌意的影响（且是负面的影响）。确实，新康德派与现象学哲学家在其哲学道路的早期阶段都对之作尖锐批评；两派中人，尤其李凯尔特与埃德蒙德·胡塞尔，指责他把人类学与经验性的问题引入哲学，从而以本属其他学科的内容污染了哲学分析。
