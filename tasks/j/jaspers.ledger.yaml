    source: |-
      Jaspers received an extremely diverse and broad-ranging education. He initially enrolled as a student of law at the University of Heidelberg for three semesters (1901–1902). Despite his already vivid interest in philosophy, which he explored through Spinoza’s *Ethics* (1677) and Kant’s *Critique of Pure Reason* (1781), his decision to pursue medicine was based on his belief that it best illuminated life itself and the challenges of human existence. Jaspers began his medical studies in Berlin (1902/1903), then moved to Gottingen (1903–1906), and eventually finished them in Heidelberg (1906–1908). He submitted his dissertation, *Heimweh und Verbrechen* in 1908 and graduated M.D. in 1909. He was a research assistant in the psychiatric clinic of the university of Heidelberg from 1909–1915, where he worked with some of the most famous psychiatrists in Germany, including Nissl, Wilmanned, Gruhle, and Mayer-Gross. Due to his illness with bronchiectasis, he was incapable of carrying out heavy duties in the clinic. The director of the psychiatric clinic of the university of Heidelberg, Franz Nissl, permitted him to spend the majority of his time at the library rather than in the clinic and the laboratory. Indeed, his extraordinary skills of critical thinking and abstract observation on human situations were evident already then. From 1913 onward, Jaspers read philosophy systematically. In 1913 he published his *Allgemeine Psychopathologie* (*General Psychopathology*) which already made apparent the viewpoints and methods that belong to the world of the humanities and social studies that were regarded by him as converging into psychopathology. In the same year, he obtained his second doctorate (*Habilitation*) in psychology from the Philosophy Faculty at the University of Heidelberg, supervised by Wilhelm Windelband. He was a lecturer and later an Associate Professor of Psychology (*Privatdozent*) from 1913 to 1921. During this period, in 1919, he published his *Psychologie der Weltanschauungen* (*Psychology of World Views*). This work is considered as a transitional work, in which his psychological method was clearly shaped by philosophical influences and objectives, and was already evolving into a consistent philosophical doctrine and acquiring some of the main issues that were to be explored later within his philosophy of existence. Then, in 1922, he took over the full professorial chair of philosophy in the University of Heidelberg (after Heinrich Maier), a position from which he was dismissed in 1937 by the Nazis. To a large extent, the two first major publications were works of psychology that contain many elements, albeit in inchoate form, of his later philosophy. Following his nomination as professor, he wrote nothing for ten years, except for two small works—a patholography *Strindberg and van Gogh* in 1922 and *Die Idee der Universität* (The Idea of the University) in 1923.
    step1: |-
      雅斯贝尔斯所受教育极为多样而广博。他最初在海德堡大学注册学习法律三个学期（1901–1902）。尽管他早已对哲学有浓厚兴趣——通过斯宾诺莎的《伦理学》（1677）与康德的《纯粹理性批判》（1781）来探究——他决定改学医学，是基于一种信念：医学最能照亮生命本身与人的生存之难题。雅斯贝尔斯 1902/1903 年在柏林开始医学学习，后转至哥廷根（1903–1906），最终在海德堡完成学业（1906–1908）。1908 年他提交学位论文《乡愁与犯罪》（*Heimweh und Verbrechen*），1909 年获医学博士学位。1909 至 1915 年，他在海德堡大学精神病诊所任研究助理，与德国一些最著名的精神病学家共事，包括尼斯尔、维尔曼、格鲁勒与迈尔—格罗斯。由于支气管扩张症，他无法承担诊所的重体力工作。海德堡大学精神病诊所主任弗朗茨·尼斯尔（Franz Nissl）允许他把大部分时间花在图书馆，而不是诊所与实验室。确实，他那非凡的批判思维与对人类处境的抽象观察能力，当时就已显露。1913 年起，雅斯贝尔斯系统研读哲学。1913 年他出版《普通精神病理学》（*Allgemeine Psychopathologie*），其中已显露出他视为汇入精神病理学的人文与社会科学世界的观点与方法。同年，他在海德堡大学哲学系取得心理学第二博士学位（教授资格，*Habilitation*），导师为威廉·文德尔班。1913 至 1921 年，他任讲师，后任心理学编外副教授（*Privatdozent*）。此期间，他于 1919 年出版《世界观心理学》（*Psychologie der Weltanschauungen*）。这部作品被视为过渡之作：他的心理学方法在其中明显受到哲学影响与目标的塑造。
