      The influence of Kant over Jaspers is widely acknowledged in the literature, to the extent that he has been depicted as “The first and the last Kantian” (Heinrich Barth, quoted in Ehrlich 1975, 211)[^ehrlich-1975]. Usually this evaluation is based on his reliance on the subjective-experiential transformation of Kantian philosophy, which reconstructs Kantian transcendentalism as a doctrine of particular experience and spontaneous freedom, and emphasizes the constitutive importance of lived existence for authentic knowledge. However, current commentators of his philosophy have started questioning this view. Jaspers obtained his widest influence, not through his philosophy, but through his writings on governmental conditions in Germany, and after the collapse of National Socialist regime he emerged as a powerful spokesperson for moral-democratic education and reorientation in the Federal Republic of Germany.
    step1: |-
      康德对雅斯贝尔斯的影响在文献中得到广泛承认，以至于他被描绘为“第一位也是最后一位康德主义者”（Heinrich Barth 语，转引自 Ehrlich 1975, 211）[^ehrlich-1975]。这一评价通常基于他依托康德哲学的主观—经验式改造：这种改造把康德先验论重构为一种关于特定经验与自发自由的学说，并强调亲历的存在对于真知具有建构性的重要。然而，当今研究其哲学的评论者已开始质疑这一看法。雅斯贝尔斯获得最广泛的影响，并非通过其哲学，而是通过他关于德国政治状况的著述；纳粹政权崩溃之后，他成为联邦德国道德—民主教育与精神重定向的有力代言人。
    step2: |-
      康德对雅斯贝尔斯的影响，文献中公认极深，以致他被称作“第一位也是最后一位康德主义者”（Heinrich Barth 语，转引自 Ehrlich 1975, 211）[^ehrlich-1975]。此评价通常基于一点：他把康德哲学作主观—经验的改造，将先验论重构为关于特定经验与自发自由的学说，并强调亲历存在对真知的建构作用。不过，当代评论者已开始质疑这一看法。雅斯贝尔斯影响最广者，并非其哲学，而是他论德国政治状况的著述；纳粹政权崩溃后，他成为联邦德国道德—民主教育与精神重定向的有力代言人。
