      Despite his importance in the evolution of both philosophy and political theory in twentieth-century Germany, today Jaspers is to a large extent a neglected thinker. The explanations that are given for this are various. In the first place, it is argued that he did not found a particular philosophical school. For him, philosophy is a way of thought, which uses expert knowledge while going beyond it. He believed that by means of devoting oneself to philosophy, individuals do not cognize objects but explicate and actualize their being as thinkers and thus become themselves. Consequently, he did not attract a cohort of apostles, and, outside Germany at least, his works are not often the subject of high philosophical discussion. This is partly the result of the fact that the philosophers who now enjoy undisputed dominance in modern German philosophical history, especially Martin Heidegger, Georg Lukács and Theodor W. Adorno, wrote disparagingly about Jaspers, and they were often unwilling to take his work entirely seriously. Another explanation for Jaspers’s relative marginality relates to problematic nature of the English translations of his writings that render his thinking rather incommunicable to readers from English speaking countries. To be sure, he was extremely fortunate with his many translators, the most prominent of whom are Ralph Manheim and E.B. Ashton. But the translations often use misleading expressions and use different words to express the very same word in the original German, thereby confusing the readers. Also, unindicated omissions and other problems that result from favouring aesthetic considerations over accuracy all contribute to falsifying the original. It has been argued that Jaspers could not appeal to the English-speaking philosophical mind due to being too speculative and metaphysical or simply beyond the reach of the Anglo-American cultural horizons. To all these factors, one might add the fact of Jaspers’s association with the more prosaic periods of German political life, and of his name being tarred with an aura of staid bourgeois common sense. Nonetheless, Jaspers’s work set the parameters for a number of different philosophical debates, the consequences of which remain deeply influential in contemporary philosophy, and in recent years there have been signs that a more favourable reconstructive approach to his work is beginning to prevail.
    step1: |-
      尽管他在二十世纪德国哲学与政治理论的演进中都很重要，雅斯贝尔斯在今天很大程度上仍是一位被忽视的思想家。对此有种种解释。首先，有人说他没有创立一个特定的哲学学派。在他看来，哲学是一种思想方式：它运用专门知识，又超出专门知识。他相信，人潜心于哲学，并非去认知对象，而是显明并实现自身作为思想者的存在，从而成为自己。因此，他没有吸引来一批门徒；至少在美国之外，他的著作不常成为高等哲学讨论的主题。这在一定程度上是因为，如今在现代德国哲学史中享有无可争议支配地位的哲学家——尤其是马丁·海德格尔、格奥尔格·卢卡奇与特奥多尔·W. 阿多诺——都对他有所贬抑，且往往不愿完全认真对待他的工作。另一种解释关涉其著作英译的问题性质：这些译文使他的思想对英语读者颇难沟通。诚然，他在译者方面极为幸运，其中最著名的是拉尔夫·曼海姆与 E.B. 阿什顿。但译文常常使用误导性的表达，并用不同的词去对应德文原文中同一个词，从而令读者困惑。此外，未加标示的删略，以及为迁就审美考虑而牺牲准确所生的其他问题，都使原文失真。也有人认为，雅斯贝尔斯之所以不能吸引英语哲学界，是因为他过于思辨、过于形而上学，或干脆超出英美文化视野之外。除这些因素外，还可加上一点：雅斯贝尔斯与德国政治生活中较为平庸的时期相关联，其名字也沾上了保守市民常识的气息。尽管如此，雅斯贝尔斯的工作仍为若干不同的哲学论域设定了参数。
