      然而，在纳粹主义与战争的创伤之后，可以公允地说：雅斯贝尔斯的政治哲学从未最终走出对纯粹民主的怀疑态度；其政治著作也从未完全放弃这样一种感觉——德国社会尚未充分演化到足以支撑民主，德国人需要教育与引导，民主才能扎根。即便在其 1960 年代最后的著作中——他在其中对 1968 年前后学生运动的活动表示初步的支持——仍留有精英民主同情的痕迹。因此，尽管他在现代德国政治中十分重要，其政治哲学始终略显不合时宜；他的立场仍嵌于那种人格主义式的国家理想之中——这种理想是德意志帝国旧自由主义政治文化的特征，并在魏玛共和国的保守—自由主义边缘持续存在。
