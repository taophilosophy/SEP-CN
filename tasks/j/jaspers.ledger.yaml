      《哲学》中的每一存在层面，对应康德的一个先验理念；规定每一存在层面的思考与认识方式，则阐明了康德这些理念的智识内容。世界中的定向层面，对应世界统一的理念；生存层面，对应灵魂不朽的理念；超越层面，对应上帝必然存在的理念。然而，康德把先验理念看作理性的形式—范导性理念——至多为理性的内在运作赋予系统组织；雅斯贝尔斯则把先验理念看作亲历知识的领域：意识穿越其间，并在其被经验的二律背反中形成、被引向关于自身作为超越者的知识。因此，雅斯贝尔斯赋予先验理念一种实质的、经验的内容。理念不像在康德那里那样，仅仅标记知识的形式界限，为思辨的或形而上学的问题划定意义的边界；相反，理念为理性提供持续的推动，促其克服自身界限，寻求对自身、其内容与可能性愈发超越的知识。因此，在其成熟哲学中，雅斯贝尔斯把康德的先验理念改造为超越之理念：意识在其中把握并展开实质的或形而上学的知识与自我认知之可能性。对康德理念概念作这一调整的核心，还含一项隐含却相当根本的批判，针对康德对超越者与先验者之间那一关键区分。与同时代的新康德主义解读相反——那些解读至多承认康德观念论中的观念要素是一个范导性框架，由理性自身的自律功能所生成——雅斯贝尔斯主张，康德哲学总是同时包含又压制着一种对被经验的超越的展望；康德的诸理念应被看作对理性的挑战：督促理性思考其自律之外，走向更新、更本真的内容、自我经验与自由。
