      这些关于宗教哲学的人文主义反思，并非雅斯贝尔斯工作中孤立的组成部分。事实上，他对宗教教条主义的批评，是与一种更广的人文主义学说一同演化的；后者最终成为其后期工作的界定性成分。可以说，雅斯贝尔斯始终是人文主义者；当然，若把人文主义定义为一种试图说明人类生活之特殊性、唯一性与尊严的学说，那么他的工作从一开始就可被视为哲学人文主义的一个变体。其全部早期著作贯穿着这一论点：人的独特之处在于拥有生存与超越的本真属性——即有能力提出关于自身及其自由的问题，而这些问题无法以物质或科学的措辞提出；并因此具有决断性翻转、自我转化与超越的能力。因此，真正的人性是一种自由自我占有与超越本真性的状态。总体而言，生存主义可在哲学家之间分为两类：一类如让-保罗·萨特，把生存主义定义为一种人文主义；另一类如海德格尔，把围绕人类规定性分析来组织哲学视为对哲学的形而上学败坏。雅斯贝尔斯显然属于第一类生存哲学家。
