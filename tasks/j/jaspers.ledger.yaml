      1910 年，他与格特鲁德·迈尔（Gertrud Mayer，1879–1974）结婚。她出身于虔诚的德国犹太商人家庭，当时在神经学家兼精神病学家奥斯卡·科恩施塔姆（Oskar Kohnstamms，1871–1917）的疗养院任助手，也是他密友古斯塔夫·迈尔（Gustav Mayer）与哲学家恩斯特·迈尔（Ernest Mayer）的姐妹。正是由于与已具名望的哲学家卡尔·雅斯贝尔斯结婚，格特鲁德·迈尔才得以在纳粹时期留在德国。
