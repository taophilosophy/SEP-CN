      The three volumes of *Philosophy* bear the titles *Philosophical World Orientation* (volume I), *The Illumination of Existence* (volume II), and *Metaphysics* (volume III). It was written during the 1920s after Jaspers obtained the full professorship at Heidelberg University. Each volume of this book describes a particular way of being: *orientation*, *existence* and metaphysical *transcendence* are the three essential existential modalities of human life. At the same time, each volume also describes a particular way of knowing, which is correlated with a way of being: orientation is cognitively determined by objectively verifiable knowledge or by positive or scientific proof-forms, existence is determined by subjective/existential self-reflection, and transcendence is determined by the symbolic interpretation of metaphysical contents. Together, the three volumes of *Philosophy* are designed to show how human existence and human knowledge necessarily progress from one level of being and one level of knowledge to another, and how consciousness gradually evolves, through confrontation with its own antinomies, from an immediate and unformed state towards a condition of unity and integral self-experience. The three volumes are consequently bound together by the argument that at the level of immediate objective knowledge—of orientation in the world—human consciousness raises subjective-existential questions about itself and the grounds of its truth which it cannot resolve at this level of consciousness, and it encounters antinomies which call it to reflect existentially upon itself and to elevate it to the level of existence or existentially committed self-reflection. At this higher level of consciousness, then, existence raises metaphysical questions about itself and its origin which it cannot begin to answer without an awareness that existence is, at an originary or authentic level, *transcendent*, and that its truth is metaphysical.
    step1: |-
      《哲学》三卷的书名是：《哲学的世界定向》（第一卷）、《生存之澄明》（第二卷）与《形而上学》（第三卷）。它写于雅斯贝尔斯获得海德堡大学正教授职位之后的 1920 年代。此书每卷描述一种特定的存在方式：定向、生存与形而上学超越，是人类生活的三种本质生存样态。同时，每卷也描述一种特定的认识方式，与存在方式相关联：定向在认知上由客观可验证的知识或实证的、科学的证明形式所决定；生存由主观／生存性的自我反思所决定；超越由对形而上学内容的象征性解释所决定。合起来，《哲学》三卷旨在表明：人的生存与人的知识如何必然地从一存在层面与一知识层面推进到另一层面；意识如何在与自身二律背反的对峙中，从直接的、未成形的状态，逐步演化为统一而完整的自我经验。三卷由此被一个论点绑在一起：在直接客观知识的层面——即对世界的定向——人的意识就自身及其真理根据提出主观—生存性的问题，而在这一意识层面无法解决；它遭遇的二律背反召唤它在生存上反思自身，并把自己提升到生存的层面或有生存担当的自我反思。在这一更高的意识层面，生存又就自身及其起源提出形而上学问题；而若无对如下事实的觉知，这些问题便无从着手回答：生存在本源或本真的层面上是超越的，其真理是形而上学的。
