      雅斯贝尔斯介入哲学论辩的第一部作品《世界观心理学》，建构了心态的类型学；它接近韦伯的理想类型模型，旨在对基本心理倾向作出解释性说明。此书的底层论点是：人类心理生活的构成性事实，是主体与客体之分（*Subjekt-Objekt-Spaltung*）。人的心理形式——或世界观——被安置为这一原初二律背反之中的二律背反环节，并对人的主观倾向与自由同主体所遇客观现象之间的关系，给出各自不同的范式性表达。然而，与韦伯不同，雅斯贝尔斯主张世界观的建构并非纯然中立的过程，不能用非评价的方式来判断。相反，一切世界观都含有病理因素；它们纳入防御、压抑与遁词的策略，并聚集于虚假的确定性或伪客观化的理性样态周围——人的心智退入其中，以便在人类存在那令人恐惧的无尽可能性中取得安全。因此，世界观通常采取客观化笼子（*Gehäuse*）的形式，存在在其中硬化自身，以对抗那些威胁要超越或打乱它为自身运作所设防御限制的内容与经验。尽管某些世界观具有无条件成分，多数世界观则作为已成形的心理装置的界限而存在。因此雅斯贝尔斯主张，心理学干预的任务，是引导人的存在超越它借以自我稳定的那些受限的二律背反，并让它果决地面对更本真的可能性——主观生活与客观生活的可能性——而这些可能性正是它借正常的理性倾向与态度所抹去的。
