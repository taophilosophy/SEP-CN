      Jaspers left unfinished *Die Großen Philosophen*, whose declared aim was “promoting the happiness that comes of meeting great men and sharing in their thoughts”, and employed his personal method of constant questioning and struggle. This is a monumental project of universal history of philosophy, whose creators were the outstanding philosophers who inspired the human thought. Jaspers, who believed that only through communication with others can we come to ourselves and to wisdom, regarded the philosophers he discusses in this book as his “eternal contemporaries” and “the disturbers” in the sense of thinkers for whom doubt and despair loomed large. The first two volumes of this work appeared in 1958, while the third and fourth have been gathered from the vast material of his posthumous papers. The editors Ermarth and Ehrlich have, however, been able to stitch together a coherent book that, in accordance with Jaspers’s plan, primarily covers the philosophers whom he termed “the disturbers”: thinkers for whom doubt and despair loomed large. The English translations were developed by Ralf Manheim, edited by Hannah Arendt, and published in parts, until 1994.
    step1: |-
      雅斯贝尔斯留下未完成的《大哲学家》，其公开目标是“促进那种因遇见伟人并分享其思想而来的幸福”，并采用他那种不断提问与挣扎的个人方法。这是一项世界哲学史的宏伟工程，其创造者是启发了人类思想的杰出哲学家。雅斯贝尔斯相信，唯有通过与他人的交往，我们才能抵达自身与智慧；因此他把本书所讨论的哲学家视为自己的“永恒同时代人”与“扰动者”——就怀疑与绝望在这些思想家身上格外凸显而言。此书前两卷于 1958 年问世，第三、四卷则从其遗稿的浩瀚材料中整理而成。不过，编者埃尔马斯与埃利希得以缝合出一部连贯的著作；按雅斯贝尔斯的计划，它主要涵盖他称为“扰动者”的哲学家：那些怀疑与绝望格外凸显的思想家。英译本由拉尔夫·曼海姆翻译、汉娜·阿伦特编订，分册出版，直至 1994 年。
