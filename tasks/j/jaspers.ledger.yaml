      如果说韦伯是影响雅斯贝尔斯的第一位关键人物、康德是第一位关键哲学影响，那么在二十世纪二十年代初，他又遇到了在其形成中起决定作用的另一人：马丁·海德格尔。不能不加限定地说，海德格尔直接决定了雅斯贝尔斯工作的概念结构或底层前提，也不能说他把雅斯贝尔斯思想的若干方面吸收进自己的哲学。在两人的理论轨迹中，差异在许多方面都大于相似。确实，他们的理论争执最终酿成一场苦涩的个人与政治决裂，起因是海德格尔 1933 年公开宣布同情纳粹。海德格尔支持纳粹的恶名昭彰的决定，使雅斯贝尔斯感到自身受到威胁：他娶了犹太女子，且先前依附于卓越的自由派政治家与哲学家——尤其是韦伯——而这些人如今正遭到海德格尔及依附于国家社会主义德国工人党的知识分子的诋毁。1933 年，雅斯贝尔斯本人也曾短暂动摇，对希特勒政权说过一些不谨慎的乐观话。这些话与他三十年代初的其他出版言论并非全不相称。在魏玛共和国最后几年，他出版了一部有争议的政治著作《时代的精神状况》（*Die geistige Situation der Zeit*，1931），其中——令他后来极为难堪——包含对议会民主制措辞谨慎的批评。在整个这一时期，他还强调韦伯式强有力领导的思想，对维持德国政治秩序的相关性。然而，他与海德格尔关系的恶化，似乎使他的心肠硬化为对国家社会主义严格而持续的反对；与海德格尔不同，他三十年代的著作避开政治主题，而主要致力于阐发其哲学的内在或宗教方面。1932 年，他出版了三部曲《哲学》（*Philosophie*），由三卷构成，各以自己的超越对象为据：世界定向（*Weltorientierung*）、生存澄明（*Existenzerhellung*）与形而上学（*Metaphysik*）。这部书被普遍视为他的代表作；他事后回忆说，这是最贴近他内心的一部书。尽管大量使用“生存哲学”（*Existenzphilosophie*）一词，他却未授予此书人们期待的“生存哲学”之名——这一选择反映他的不满：他不愿此名窄化其“永恒哲学”（*Philosophia Perennis*）的指导理想。在其《我们时代的理性与反理性》（*Vernunft und Widervernunft in unserer Zeit*，1950）中，他后来更表达了对“理性哲学”这一表述的偏爱。
