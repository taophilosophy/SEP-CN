      粗略重构起来，在其后期政治工作中，他主张欧洲极权主义——纳粹主义与共产主义皆为其例——的兴起，是政治人性衰退、技术性或工具性理性样态日益占据首位的结果；这些样态侵蚀了人类生活的本真资源。因此，他试图为人类的政治体提供一种说明，使其能够成为抵御极权非人性的持久堡垒。第一，他主张，人类政治体必须由一个完整统一的文化传统来维系，使人们能在民族文化的伦理内容中解释自身完整性的密码。他提出，对人类的背叛在政治上通常伴随——事实上也预设了——对人类的背叛在文化上的发生；而极权治理通常起于文化的侵蚀或文化被工具化地臣服。十九世纪，马克思曾主张，德国政治的落后弊病源于一点：德国社会惯于让文化代替政治，并把相对去政治化的有教养市民精英（*Bildungsbürgertum*）规定为社会秩序的支柱与进步的仲裁者。雅斯贝尔斯回应这一德国特征化描述时主张：破坏市民精英文化角色的社会，本身就不稳定；有教养的市民阶层在维护民主文化前提方面具有首要作用。第二，他主张人类政治体必须奠基于公民之间的自由交往：交往自由是公共德性的先决条件。因此他暗示，人类政治体很可能是某种民主制，以某种程度的公共形成的共识为基础。事实上，他像阿伦特一样断定：社会原子化会造成极权易于滋生的文化；唯有公共领域中不受规制的论辩，才能抵消大众社会这一潜在病理。第三，他主张，政治系统所运用的技术、科学与经济规划资源应保持最低限度；一个未被规划的人类互动领域，对维持人类政治秩序是必要的。就此而言，他激烈反对一切技术官僚治理的倾向——他在东欧共产主义阵营中，以及在阿登纳治下迅速扩张的联邦德国福利国家中，都指认出了这种倾向。他断言，技术官僚统治是人类理性中工具性倾向的客观形式；若不以文化或理性交往的整体人类资源来平衡，它很可能导致压迫性政府。就此而言，他接近政治自由主义的相当标准的变体，赞同有限政府、相对的文化与经济自由，以及保护社会免受不可问责的政治指挥。第四，他还主张人类政治体需要一套宪制装置，确立基本权利，为国家运作施加道德—法律秩序，并限制政治机构的特权。因此他像康德一样，倡导建立国家间的国际联邦，共享宪法、法律与国际法庭。第五，他也保留了最初从韦伯那里继承的精英民主观的若干方面，继续主张人类政治体必须由通情达理的人或负责任的精英来支持与引导。
