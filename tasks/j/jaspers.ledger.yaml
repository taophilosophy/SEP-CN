      至少对英语精神病学界而言，较少为人所知的是雅斯贝尔斯在哲学工作之前对精神病学领域的最后一项贡献；回顾看来，它与其哲学并非全无关联，至少在共通的主导精神上如此。在其卓越的精神病学生涯中，雅斯贝尔斯对该领域的思维作出了杰出贡献，后来被称为“海德堡学派”，由库尔特·施奈德领导。年轻时，他写过若干科学论文，论乡愁与犯罪、论智力测验、论幻觉——皆附详细病史。他还发表过关于凡·高与斯特林堡精神病理的报告。其中特别重要者，是 1910 年那篇杰出论文：他在其中提出关于“心理过程”与“人格发展”的方法与基本原理；以及 1912 年论精神病学中现象学方法的论文，此文确立了他作为意识层面主观经验现象学研究首位评论者的先驱地位。1913 年，年方三十、在海德堡精神病院行医的雅斯贝尔斯出版《普通精神病理学：学生、医生与心理学家指南》（*Allgemeine Psychopathologie: Ein Leitfaden für Studierenden, Ärzte und Psychologen*）。此书旨在为精神病理学的科学领域及其相关事实与方法提供框架，不仅面向该领域的从业者，也面向有兴趣的知识人。这一框架涵盖该领域知识总体的问题与方法，而非经验证据或以某种理论为基础的系统。他不在当时既有的各种进路之间作裁决，而是强调它们各自的特性，以及它们内在的理据、彼此互补并共同描绘精神病理学之诸多侧面的方式。其生存哲学的精神虽尚未显明，却已隐约可见于该书前言中的宣告：“在精神病理学中，仅仅学习材料是危险的；我们的任务不是‘学习精神病理学’，而是学会观察、提问、分析，并以精神病理学的术语思考。”然而，尽管此书成就令人印象深刻——在德语世界被一流精神病学家公认为该领域的丰碑——它却标志着雅斯贝尔斯精神病学创造力的顶点。仅两年后，他便永远离开精神科实践与一般医学，先转向心理学，再转向哲学。有趣的是，雅斯贝尔斯认为有必要在若干版次中修订并扩充文本。第一版最短；第二、三版变动较小；修订与扩充最大的是 1942 年问世的第四版。在很大程度上，把三十年代以后已趋成熟的生存哲学的许多观念整合进来，使文本篇幅增加一倍以上，实则相当于该书的新版本。此时，早先各版所带的副标题被去掉；在前言中，雅斯贝尔斯指明其崇高目标：满足求知的要求，不仅为医生，也为一切以人为主题的人。在这一扩充版中，胡塞尔描述心理学的印记显而易见：书中试图处理精神病患（主要是精神分裂症患者）的内在心理经验，并把它们视为人类意识一般现象（即妄想、自我意识样态与情感样态）的指示。同时，威廉·狄尔泰（1833–1911）的印记亦可见于一点：书中以“理解心理学”（*Verstehende Psychologie*，关乎人格与生平中固有的有意义、可理解的关联）与“说明心理学”（*Erklärende Psychologie*，聚焦主要根植于生物学的因果关联）之分为中心。[^note-1]
