      从 1933 年起的纳粹时期，雅斯贝尔斯被排除于大学行政的一切协作之外，直到 1937 年被解除教授讲席，并受出版禁令（*Publikationsverbot*）约束。战争期间，他与妻子并无人身危险。但他始终自感是被盯上的人，直到第二次世界大战结束。雅斯贝尔斯曾间接听说，有一项计划要在 1945 年 4 月中旬把他与妻子解往集中营。所幸美军提前两周，于 1945 年 4 月 1 日进驻海德堡。1945 年之后，他的命运剧变：他显要地列于美国占领军的白名单——即被认为未受任何与纳粹党勾连玷污的政治家与知识分子名单，被允许在德国政治重建进程中扮演公开角色。从此，雅斯贝尔斯主要把自己定义为大众哲学家与教育者。在前一角色中，他贡献了大量关于政治定向与公民道德的启发性评论——先在 1945–1949 年的过渡时期，后在 1949 年之后联邦德国的最初几年。在后一角色中，作为负责重开海德堡大学的教授之一——他被美国占领军任命为当代校长——他长篇论述大学改革的必要性，强调自由主义人文教育作为在德国全境传播民主观念之手段的作用，并对恢复有纳粹历史关联的教授职位采取坚决反对立场。1946 年，《大学之理念》出版，其形态已与 1923 年同名著作迥异。后一著作把大学呈现为从事求真任务的学者与学生的自由共同体。据此，大学与其中栖身的学者能够且应当发挥决定性作用，以启蒙最高贵理念为基础重建欧洲。在当时以及其后，雅斯贝尔斯都是少数有资格公允地为如下立场申辩其价值与必要的人：面对威胁自由与人性的势力，坚持这一立场。战后最初几年，人们承认其高贵人文主义的明显证据，是授予他的众多荣誉：1947 年歌德奖、1958 年德国书业和平奖、1959 年伊拉斯谟奖，以及奥登堡基金会荣誉市民奖。
