      Karl Theodor Jaspers was born on 23ʳᵈ February 1883 in the North German town of Oldenburg near the North Sea, where his ancestors had lived for generations. He was the son of a banker and a representative of the parliament (Landtagesabgeordneten), Carl Wilhelm Jaspers (1850–1940) and Henriette Tantzen (1862–1941), who also came from a family that was involved in local parliament. Jaspers’s family milieu was strongly influenced by the political culture of North German liberalism, and he often referred to the climate of early liberal democratic thought as a formative aspect of his education. Moreover, although he claimed not to have been influenced by any specifically ecclesiastical faith, his thought was also formed by the spirit of North German Protestantism, and his philosophical outlook can in many respects be placed in the religiously inflected tradition of Kant and Kierkegaard.
    step1: |-
      卡尔·特奥多尔·雅斯贝尔斯于 1883 年 2 月 23 日出生在北海之滨的北德小城奥登堡，其祖先已在此居住了好几代。他是银行家、州议会议员（Landtagesabgeordneten）卡尔·威廉·雅斯贝尔斯（1850–1940）与亨丽埃特·坦岑（Henriette Tantzen，1862–1941）之子；后者也出身于参与地方议会的家庭。雅斯贝尔斯的家庭氛围深受北德自由主义政治文化的影响，他常把早期自由民主思想的气候称为自身教育中具有塑造作用的方面。此外，尽管他自称未受任何特定教会信仰的影响，其思想也由北德新教精神所塑造；他的哲学视野在许多方面都可归入康德与克尔凯郭尔那种带宗教色彩的传统。
