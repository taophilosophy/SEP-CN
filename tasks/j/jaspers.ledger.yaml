      尽管两人之间时而有毒的关系，海德格尔与雅斯贝尔斯却通常被并称为德国生存哲学的两位奠基人。对他们哲学地位与关系的这一解读，至少是可疑的。海德格尔不愿被称作生存主义者；雅斯贝尔斯至少在 1933 年之后，不愿与海德格尔相提并论。即便在早期友好时期，海德格尔对雅斯贝尔斯的哲学也相当挑剔：他为《世界观心理学》写过评论，声称雅斯贝尔斯的方法论进路仍陷于主观主义形而上学与笛卡尔存在论的谬误之中，且不合规矩地把韦伯社会学的范畴引入哲学分析。同样，雅斯贝尔斯终生保存着一册关于海德格尔的批判笔记，惯以一种道德—人文主义的不赞成口吻描述海德格尔的基础存在论。尽管如此，把海德格尔与雅斯贝尔斯相并提仍有其有效残余；虽需限定，这种关联并非在每一方面都误导。生存主义过去与现在都是一个高度弥散的理论运动，不能期待与此运动相连的两位哲学家在一切方面持相似观点。但生存主义有某些统一特征，其中许多为雅斯贝尔斯与海德格尔所共有。因此，在其演化初期，生存主义可被描述为这样一种理论立场：a) 使哲学话语离开康德式形式主义，并强调如下信念：思想的内容必须寓于特定经验与决定之中；b) 承克尔凯郭尔，把哲学定义为一种激情而深度投入的活动，人的完整性与本真性在其中被决定性地牵连；c) 寻求克服决定古典形而上学传统的二律背反（理性／经验；理论／实践；超越／内在；纯粹理性／实践理性），办法是把人类生活的一切方面（认知的、实践的与感性的）纳入一个涵盖理性与经验生存的整体说明。如果接受这一定义，那么雅斯贝尔斯与海德格尔之间的家族联系便不能被完全否认：两人都曾以符合此定义的方式，参与 1920 年代哲学提问方式的重构。然而，两人关系最终恶化至彻底僵局；二战之后，雅斯贝尔斯拒绝解释或开脱海德格尔在纳粹年间的政治行为，甚至向一个去纳粹化委员会建议暂停海德格尔的大学教职。
