      Sturm draws extensively on Aristotelian thinkers ranging from medieval scholastic authors, such as Gabriel Biel, to Renaissance and late early modern scholastic authors. The latter include Italian philosophers, for instance, Julius Caesar Scaliger, Andrea Caesalpino, Jacopo Zabarella, Giulio Pace, and Francisco Lana de Terzi; Dutch philosophers, such as Gijsbert Voet (Voetius); Spanish and Portuguese philosophers such as Gómez de Pereira, Pedro da Fonseca, Francisco de Toledo, Antonio Rubio, Francisco Suárez, Gabriel Vásquez, Pedro Hurtado de Mendoza, and Rodrigo de Arriaga; French philosophers, such as Samuel Maresius, Honoré Fabri, Jean Baptiste Du Hamel, and Pierre Daniel Huet; English philosophers, such as John Case and Gilbert Jack (Jacchaeus); and German Philosophers, such as Daniel Sennert, Christoph Scheibler, Johannes Zeisold, Johann Sperling, Jakob Thomasius, and Erhard Weigel. Sturm knows the German academic philosophical landscape very well, since these philosophers were influential in their respective fields (see Wundt 1938)[^wundt-1938], or since they were either Sturm’s colleagues or teachers. The latter is true of Zeisold and Weigel.
    step1: |-
      施图尔姆大量取资亚里士多德派思想家，从中世纪经院作者如加布里埃尔·比尔，直到文艺复兴与近代早期晚期的经院作者。后者包括意大利哲学家，例如朱利奥·切萨雷·斯卡利杰、安德烈亚·切萨尔皮诺、雅各波·扎巴雷拉、朱利奥·帕切与弗朗西斯科·拉纳·德·泰尔齐；荷兰哲学家，如吉斯贝尔特·福伊特（福伊提乌斯）；西班牙与葡萄牙哲学家，如戈麦斯·德·佩雷拉、佩德罗·达·丰塞卡、弗朗西斯科·德·托莱多、安东尼奥·鲁维奥、弗朗西斯科·苏亚雷斯、加布里埃尔·巴斯克斯、佩德罗·乌尔塔多·德·门多萨与罗德里戈·德·阿里亚加；法国哲学家，如萨缪尔·马雷修斯、奥诺雷·法布里、让·巴蒂斯特·迪阿梅尔与皮埃尔·丹尼尔·于埃；英国哲学家，如约翰·凯斯与吉尔伯特·杰克（雅凯乌斯）；以及德国哲学家，如丹尼尔·森纳特、克里斯托夫·沙伊布勒、约翰·蔡索尔德、约翰·施佩林、雅各布·托马修斯与埃哈德·魏格尔。施图尔姆对德国学院哲学界极为熟悉，因为这些哲学家在各自领域颇具影响（参 Wundt 1938）[^wundt-1938]，或因为他们或是施图尔姆的同事，或是他的老师。后一点于蔡索尔德与魏格尔为真。
    step2: |-
      施图尔姆取资亚里士多德派甚广：上起中世纪经院作者加布里埃尔·比尔，下逮文艺复兴与近代早期晚期的经院学者。意大利有尤利乌斯·凯撒·斯卡利杰、安德烈亚·切萨尔皮诺、雅各波·扎巴雷拉、朱利奥·帕切、弗朗切斯科·拉纳·德·泰尔齐。荷兰有吉斯贝尔特·福伊特（福伊提乌斯）。西班牙与葡萄牙有戈麦斯·德·佩雷拉、佩德罗·达·丰塞卡、弗朗西斯科·德·托莱多、安东尼奥·鲁维奥、弗朗西斯科·苏亚雷斯。加布里埃尔·巴斯克斯、佩德罗·乌尔塔多·德·门多萨、罗德里戈·德·阿里亚加亦在其列。法国有萨缪尔·马雷修斯、奥诺雷·法布里、让·巴蒂斯特·迪阿梅尔、皮埃尔·丹尼尔·于埃。英国有约翰·凯斯、吉尔伯特·杰克（雅凯乌斯）。德国有丹尼尔·森纳特、克里斯托夫·沙伊布勒、约翰·蔡索尔德、约翰·施佩林、雅各布·托马修斯、埃哈德·魏格尔。施图尔姆对德国学院哲学界了如指掌：这些人在各自领域都有影响（参 Wundt 1938）[^wundt-1938]，何况有的还是他的同事或业师——蔡索尔德与魏格尔即属后者。
