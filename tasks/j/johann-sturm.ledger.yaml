      The *Physica Electiva* is Sturm’s masterpiece. It is divided into three parts: a *physica generalis* (general physics) that lays down the foundations of Sturm’s system and includes his discussion of key metaphysical themes such as the nature of matter, form, and causation; a *physica specialis* (special physics) that covers the main phenomena of the supralunary and the sublunary world; and a *physica specialissima* (very special physics) that is devoted to the study of life and human beings. During his life, Sturm managed to published only the *physica generalis*. The *physica specialis* was published posthumously by Christian Wolff in 1722. The third part has never been published. It has been alleged that it were held in manuscript form by the city library of Nuremberg (Gaab, in Gaab et al. 2004)[^gaab-2004]. Based on archival research conducted by one of the authors (C. Henkel) in the city library of Nuremberg in October 2019, he thinks no such manuscript exists there. However, the city library of Nuremberg holds what he takes to be study notes of Sturm’s students on courses in natural philosophy.[^note-1]
    step1: |-
      《择取物理学》是施图尔姆的代表作。全书分三部分：一为“普通物理学”（*physica generalis*），奠立施图尔姆体系的根基，并包含他对质料、形式与因果等关键形而上学主题的讨论；二为“特殊物理学”（*physica specialis*），涵盖月上与月下世界的主要现象；三为“最特殊物理学”（*physica specialissima*），专究生命与人。生前，施图尔姆只来得及出版“普通物理学”。“特殊物理学”由克里斯蒂安·沃尔夫于 1722 年身后刊行。第三部分从未出版。据称其稿本曾藏于纽伦堡市立图书馆（Gaab，载 Gaab et al. 2004）[^gaab-2004]。作者之一（C. Henkel）于 2019 年 10 月在纽伦堡市立图书馆作档案调查，认为该馆并无此稿。不过，纽伦堡市立图书馆藏有他认定为施图尔姆学生自然哲学课程笔记的本子。[^note-1]
    step2: |-
      《择取物理学》乃其代表作。全书分三：一曰“普通物理学”（*physica generalis*），立其体系之基，旁及质料、形式、因果诸形而上学要题；二曰“特殊物理学”（*physica specialis*），尽月上与月下世界之主要现象；三曰“最特殊物理学”（*physica specialissima*），专论生命与人。生前仅刊“普通物理学”，“特殊物理学”则由克里斯蒂安·沃尔夫于 1722 年身后付梓；第三部分终未刊行。或谓其稿本藏纽伦堡市立图书馆（Gaab，载 Gaab et al. 2004）[^gaab-2004]；作者之一（C. Henkel）2019 年 10 月在该馆稽考档案，谓馆中实无此稿，然藏有彼认定为施图尔姆学生自然哲学课程笔记之本。[^note-1]
