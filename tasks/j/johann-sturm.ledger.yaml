      Throughout his life as professor of mathematics and physics at the University of Altdorf, Sturm produced a variety of works, including mathematical textbooks, a colorful set of disputations, works on astronomy (aimed at discrediting astrology), and calendars. However, Sturm’s core interest concerned natural philosophy. He published three systematic treatises on physics, the *Physica Conciliatrix* (PC, 1684), the *Physica Electiva sive Hypothetica* (PE, 1697/1722) and the posthumously published *Compendium Physicae Modernae Sanioris* (CPMS, 1704).
    step1: |-
      施图尔姆在阿尔特多夫大学任数学与物理学教授的整个生涯中，著述宏富，包括数学教科书、一批色彩纷繁的论辩文、旨在破除占星术的天文学著作以及历书。然而，施图尔姆的核心兴趣在自然哲学。他出版了三部系统性的物理学论著：《调停物理学》（*Physica Conciliatrix*，PC，1684）、《选择物理学或假设物理学》（*Physica Electiva sive Hypothetica*，PE，1697/1722），以及身后刊行的《较健全的近代物理学纲要》（*Compendium Physicae Modernae Sanioris*，CPMS，1704）。
    step2: |-
      施图尔姆执教阿尔特多夫、讲授数学与物理学的岁月里，著作颇丰：数学教科书、五花八门的论辩文、意在破除占星术的天文学著作，还有历书。但他的心思主要在自然哲学。他刊行三部成体系的物理学论著：《调停物理学》（*Physica Conciliatrix*，PC，1684）、《选择物理学或假设物理学》（*Physica Electiva sive Hypothetica*，PE，1697/1722），以及身后刊行的《较健全的近代物理学纲要》（*Compendium Physicae Modernae Sanioris*，CPMS，1704）。
