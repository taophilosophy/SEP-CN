      The clash of fundamental philosophical intuitions that surfaces in the exchange between Leibniz and Sturm is particularly interesting with regard to the complex evolution of early modern philosophy across the seventeenth and eighteenth centuries (Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b)[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]. In a sense, Leibniz voices the main objection that can be raised against Sturm; namely, without some active principle “mechanical forms” are just idle constructions that cannot perform any genuine explanatory role. However, Sturm’s consistent way of maintaining that explanation does *not* require any reference to intrinsic causal powers points, in fact, to an alternative account of causation and causal explanations altogether, which was emerging at the time (Carraud 2002; Sangiacomo 2019, 2020c)[^sangiacomo-2019][^carraud-2002].
    step1: |-
      莱布尼茨与施图尔姆交锋中显露的根本哲学直觉的冲突，对于理解十七、十八世纪近代早期哲学的复杂演变特别有意义（Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b）[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]。在某种意义上，莱布尼茨说出了针对施图尔姆所能提出的主要反对意见：没有某种能动本原，“机械形式”就只是闲置的构造，不能起任何真正的解释作用。然而，施图尔姆一贯主张解释并*不*需要诉诸内在的因果力，这实际上指向一种关于因果与因果解释的替代性说明，而这一说明当时正在兴起（Carraud 2002; Sangiacomo 2019, 2020c）[^sangiacomo-2019][^carraud-2002]。
    step2: |-
      二人交锋所显之根本哲学直觉之冲突，于理解十七、十八世纪近代哲学的复杂嬗变，关系甚大（Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b）[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]。就一义言，莱布尼茨所发，正是施图尔姆可受之要难：苟无某种能动本原，“机械形式”不过虚设，无解释之实功。然施图尔姆始终谓解释*不*待于内在因果力；此说实指向一种因果与因果解释的替代之论——其论方兴于当时（Carraud 2002; Sangiacomo 2019, 2020c）[^sangiacomo-2019][^carraud-2002]。
