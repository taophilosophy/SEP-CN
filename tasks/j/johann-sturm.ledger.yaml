      Today, Sturm is most commonly remembered as the polemical target of Leibniz’s essay *De Ipsa Natura* (1698), which is part of an articulated controversy between Sturm and Leibniz on whether nature can be considered endowed with active principles (a claim denied by Sturm and defended by Leibniz). In fact, Leibniz and Sturm knew of one another, since they were both students of Erhard Weigel (Lemanski 2018)[^lemanski-2018]. Presumably, they met in the 1660s, maybe when Leibniz was at Altdorf University in 1666 or when he was the secretary of the alchemical society in Nuremberg in 1667 (for Leibniz’s life, see Arthur 2014: x–xvi)[^arthur-2014]. The controversy between Leibniz and Sturm commenced in 1694–95 through correspondence (Palaia 1990) and continued later in the 1690s through academic dissertations and journal articles published in the *Acta eruditorum* (Henkel 2024, ch.2)[^henkel-2024].
    step1: |-
      今天，施图尔姆最为人记住的，多半是作为莱布尼茨《论自然本身》（*De Ipsa Natura*，1698）一文的论战靶子。该文属于施图尔姆与莱布尼茨之间一场层次分明的论争，争点是自然是否可以被认为具有能动本原（施图尔姆否认，莱布尼茨主张）。事实上，莱布尼茨与施图尔姆彼此相知，因为二人皆出自埃哈德·魏格尔门下（Lemanski 2018）[^lemanski-2018]。他们大概在 1660 年代见过面，或是在 1666 年莱布尼茨就读阿尔多夫大学时，或是在 1667 年他担任纽伦堡炼金术学会秘书时（关于莱布尼茨生平，见 Arthur 2014: x–xvi）[^arthur-2014]。莱布尼茨与施图尔姆的论争自 1694–95 年的通信开始（Palaia 1990），其后在 1690 年代通过学术论文与发表于《学人学报》（*Acta eruditorum*）的期刊文章继续进行（Henkel 2024, ch.2）[^henkel-2024]。
    step2: |-
      今人忆及施图尔姆，多因其为莱布尼茨《论自然本身》（*De Ipsa Natura*，1698）的论战之的。此文乃二人一场层次分明之争的一环，所争在自然是否可被赋予能动本原：施图尔姆否认，莱布尼茨主张。二人实相知，盖同出埃哈德·魏格尔门下（Lemanski 2018）[^lemanski-2018]。其相遇或在 1660 年代，或在 1666 年莱布尼茨就读阿尔多夫大学之时，或在 1667 年其任纽伦堡炼金术学会秘书之时（莱布尼茨生平见 Arthur 2014: x–xvi）[^arthur-2014]。二人之争始于 1694–95 年间的通信（Palaia 1990），至 1690 年代复以学术论文及《学人学报》（*Acta eruditorum*）所刊文章续之（Henkel 2024, ch.2）[^henkel-2024]。
