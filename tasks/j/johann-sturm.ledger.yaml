      More generally, Sturm’s project is diametrically opposed to Leibniz’s. At the core of Leibniz’s criticisms is his commitment to the traditional scholastic view that the notions of substance and action are deeply interconnected (e.g. Leibniz 1989, 160)[^leibniz-1989]. The commitment to the notion of action as the fundamental ground to think about the very nature of substances underpins Leibniz’s main objections to Sturm’s account of the passivity of forms. Leibniz objects to the idea that any natural being could ever be adequately conceived, or taken to have any ontological consistency, without referring to some kind of activity. However, Sturm, in turn, rejects precisely Leibniz’s fundamental commitment to activity as the ontological ground of substances. As a result, Sturm hardly offers Leibniz any answer that would be satisfying from the latter’s point of view.
    step1: |-
      更一般地说，施图尔姆的规划与莱布尼茨的规划方向相反。莱布尼茨批评的核心，是他坚持传统的经院观点：实体与行动这两个概念深度相联（例如 Leibniz 1989, 160）[^leibniz-1989]。莱布尼茨主要反对施图尔姆关于形式被动性的说明，其根据正是把行动当作思考实体本性的根本基础。莱布尼茨反对这样的想法：任何自然存在者都可以在不涉及某种活动的情况下被充分设想，或被赋予任何存在论上的一贯性。然而，施图尔姆恰恰拒斥莱布尼茨这一根本承诺——以活动为实体的存在论根据。因此，施图尔姆几乎无法给莱布尼茨提供任何从后者立场看会令人满意的回答。
    step2: |-
      进而言之，施图尔姆之规划与莱布尼茨适相背驰。莱布尼茨之讥弹，根柢在守经院旧说：实体与行动二义深相绾结（如 Leibniz 1989, 160）[^leibniz-1989]。其所以力攻施图尔姆“形式被动”之说者，正以行动为思实体本性之本。莱布尼茨不取此说：自然存在者可不涉任何活动而被充分设想，或具有存在论上的一贯性。而施图尔姆所拒者，恰是莱布尼茨这一根本主张——以活动为实体之存在论根据。故施图尔姆之答，自莱布尼茨观之，殆无一处可惬其意。
