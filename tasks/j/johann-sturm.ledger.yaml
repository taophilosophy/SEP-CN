      Despite Leibniz opposing Sturm’s metaphysics and natural philosophy, he was appreciative of and influenced by Sturm’s (and Weigel’s) developments in logic (Lemanski 2018)[^lemanski-2018]. Furthermore, Leibniz’s major philosophical ally in Germany, Christian Wolff, was very much fond of Sturm himself. So much so that it was Wolff who supported the publication of the *pars specialis* of Sturm’s PE and provided a preface to it. Wolff was probably familiar with Sturm due to Wolff’s former teacher, Georg Albrecht Hamberger (1662–1716), who in turn had studied with Sturm (Gaab, in Gaab et al. 2004: 48f)[^gaab-2004].
    step1: |-
      尽管莱布尼茨反对施图尔姆的形而上学与自然哲学，他仍欣赏施图尔姆（以及魏格尔）在逻辑学上的推进，并受其影响（Lemanski 2018）[^lemanski-2018]。此外，莱布尼茨在德国的主要哲学盟友克里斯蒂安·沃尔夫本人非常喜爱施图尔姆。以至于正是沃尔夫支持刊行施图尔姆《选择物理学》的特殊部分，并为之作序。沃尔夫之熟悉施图尔姆，大概经由其师格奥尔格·阿尔布雷希特·哈姆贝格尔（1662–1716），而哈姆贝尔格又曾从学于施图尔姆（Gaab, in Gaab et al. 2004: 48f）[^gaab-2004]。
    step2: |-
      莱布尼茨虽在形而上学与自然哲学上与施图尔姆相左，却欣赏后者（连同魏格尔）在逻辑学上的推进，并受其沾溉（Lemanski 2018）[^lemanski-2018]。更有甚者，莱布尼茨在德国的主要哲学盟友克里斯蒂安·沃尔夫对施图尔姆本人极为倾倒：正是沃尔夫促成《选择物理学》特殊部分的刊行，并为之撰序。沃尔夫之知施图尔姆，大概经由其师格奥尔格·阿尔布雷希特·哈姆贝格尔（1662–1716），而哈姆贝格尔又曾受业于施图尔姆（Gaab, in Gaab et al. 2004: 48f）[^gaab-2004]。
