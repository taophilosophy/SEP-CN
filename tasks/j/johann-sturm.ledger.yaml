      Sturm draws extensively on Aristotelian thinkers ranging from medieval scholastic authors, such as Gabriel Biel, to Renaissance and late early modern scholastic authors. The latter include Italian philosophers, for instance, Julius Caesar Scaliger, Andrea Caesalpino, Jacopo Zabarella, Giulio Pace, and Francisco Lana de Terzi; Dutch philosophers, such as Gijsbert Voet (Voetius); Spanish and Portuguese philosophers such as Gómez de Pereira, Pedro da Fonseca, Francisco de Toledo, Antonio Rubio, Francisco Suárez, Gabriel Vásquez, Pedro Hurtado de Mendoza, and Rodrigo de Arriaga; French philosophers, such as Samuel Maresius, Honoré Fabri, Jean Baptiste Du Hamel, and Pierre Daniel Huet; English philosophers, such as John Case and Gilbert Jack (Jacchaeus); and German Philosophers, such as Daniel Sennert, Christoph Scheibler, Johannes Zeisold, Johann Sperling, Jakob Thomasius, and Erhard Weigel. Sturm knows the German academic philosophical landscape very well, since these philosophers were influential in their respective fields (see Wundt 1938)[^wundt-1938], or since they were either Sturm’s colleagues or teachers. The latter is true of Zeisold and Weigel.
    step1: |-
      施图尔姆广泛取资于亚里士多德主义思想家，从中世纪经院作者（如 Gabriel Biel）直到文艺复兴与近代早期晚段的经院作者。后者包括意大利哲学家，例如 Julius Caesar Scaliger、Andrea Caesalpino、Jacopo Zabarella、Giulio Pace 与 Francisco Lana de Terzi；荷兰哲学家，如 Gijsbert Voet（Voetius）；西班牙与葡萄牙哲学家，如 Gómez de Pereira、Pedro da Fonseca、Francisco de Toledo、Antonio Rubio、Francisco Suárez、Gabriel Vásquez、Pedro Hurtado de Mendoza 与 Rodrigo de Arriaga；法国哲学家，如 Samuel Maresius、Honoré Fabri、Jean Baptiste Du Hamel 与 Pierre Daniel Huet；英国哲学家，如 John Case 与 Gilbert Jack（Jacchaeus）；以及德国哲学家，如 Daniel Sennert、Christoph Scheibler、Johannes Zeisold、Johann Sperling、Jakob Thomasius 与 Erhard Weigel。施图尔姆对德国学院哲学的全貌极为熟悉，因为这些哲学家在各自领域颇具影响（见 Wundt 1938）[^wundt-1938]，或者曾是施图尔姆的同事或老师。后一种情况适用于 Zeisold 与 Weigel。
    step2: |-
      施图尔姆取资于亚里士多德主义诸家甚广：上自中世纪经院作者如 Gabriel Biel，下逮文艺复兴与近代早期晚段之经院学者。后者同意大利有 Julius Caesar Scaliger、Andrea Caesalpino、Jacopo Zabarella、Giulio Pace、Francisco Lana de Terzi；荷兰有 Gijsbert Voet（Voetius）；西班牙、葡萄牙有 Gómez de Pereira、Pedro da Fonseca、Francisco de Toledo、Antonio Rubio、Francisco Suárez、Gabriel Vásquez、Pedro Hurtado de Mendoza、Rodrigo de Arriaga；法国有 Samuel Maresius、Honoré Fabri、Jean Baptiste Du Hamel、Pierre Daniel Huet；英国有 John Case、Gilbert Jack（Jacchaeus）；德国有 Daniel Sennert、Christoph Scheibler、Johannes Zeisold、Johann Sperling、Jakob Thomasius、Erhard Weigel。施图尔姆于德国学院哲学之全局知之甚稔：诸家各擅其域，影响甚著（见 Wundt 1938）[^wundt-1938]；或则为施图尔姆之同僚、师门，Zeisold 与 Weigel 即其例。
