      In this three-step method, the presentation of phenomena establishes the *explanandum*, the hypotheses cover some ground towards approximating a solution. But since these different hypotheses either contradict or run parallel to one another, a true explanation has to select from existing theories what is true, reject what is false, and add what needs be added. This brings us to Sturm’s eclecticism.[^note-3]
    step1: |-
      在此三步方法中，呈现现象确立了被解释项，假说则朝逼近解答推进了一段。但既然这些不同假说或相互矛盾、或彼此并行，真正的解释就必须从既有理论中选取真者、排除假者、补入须补者。这就把我们引向施图尔姆的折衷主义。[^note-3]
    step2: |-
      三步之中，呈现现象确立起被解释项，假说则向解答逼近一程。然而诸家假说或相矛盾，或相平行；真正的解释须从既有理论中取其真、去其假、补其所缺。这就引出了施图尔姆的折衷主义。[^note-3]
