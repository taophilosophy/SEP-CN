      Sturm’s scientific method aims at providing a complete system of natural philosophy in which (potentially) all natural phenomena can receive satisfying causal explanations based on available observations and by taking into account the most perspicuous hypotheses advanced. Sturm’s method consists of three main steps, which also provide the recurrent pattern used to discuss all topics covered in the *Physica Electiva*.[^note-2]
    step1: |-
      施图尔姆的科学方法旨在提供一套完整的自然哲学体系，使（潜在的）一切自然现象都能依据可得的观察、并顾及所提出的最明晰的假说，获得令人满意的因果解释。施图尔姆的方法分三个主要步骤，这三步也构成讨论《选择物理学》所涉一切题目的反复出现的程式。[^note-2]
    step2: |-
      施图尔姆的科学方法意在给出一套完整的自然哲学：举凡自然现象，皆可凭可得观察、参酌最明晰的假说，获得令人满意的因果解释。其方法分三大步；《选择物理学》讨论一切题目，都循此三步的程式。[^note-2]
  - id: 33
    kind: body
    source: |-
      The first step consists in collecting phenomena, either reported by other natural philosophers or encountered by means of observation or experimentation itself. They need to be reported faithfully (*fideliter*), by accurately presenting the circumstances under which the phenomena obtained (PE I: preface, art. 3.4).
    step1: |-
      第一步是收集现象，或由其他自然哲学家报告，或由自己借观察、实验而遇到。报告必须忠实（*fideliter*），须准确交代现象所得以出现的种种情形（PE I：序言，第 3.4 条）。
    step2: |-
      第一步，收集现象——或取他人所报，或由自己观察、实验而得。报告务求忠实（*fideliter*），须准确交代现象出现时的种种情形（PE I：序言，第 3.4 条）。
