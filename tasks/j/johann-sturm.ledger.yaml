      Sturm is well-versed in the Aristotelian commentary tradition including the Greek commentators rediscovered in the Renaissance (Schmitt 1983)[^schmitt-1983], such as Iamblichus, Alexander of Aphrodisias, Themistius, Ammonius Hermeae, Simplicius of Cilicia, Philoponus (John the Grammarian), and Olympiodorus the Younger; the Arab commentators, such as Avicenna and Averroës; as well as the Latin commentators, such as Albertus Magnus, Thomas Aquinas, Duns Scotus, Durandus of St. Pourçain, and William of Ockham. Following a general line of thought manifesting itself in the Renaissance among both Aristotelian and Humanist thinkers (Schmitt 1983)[^schmitt-1983], Sturm takes the Greek commentators to be more reliable and true to the views of Aristotle himself than the Latin commentators (PE I: preface).
    step1: |-
      施图尔姆精通亚里士多德注疏传统，包括文艺复兴时期重新发现的希腊注家（Schmitt 1983）[^schmitt-1983]，如扬布利科斯、阿弗洛狄西亚的亚历山大、忒米斯提乌斯、赫尔米亚的阿莫尼俄斯、奇里乞亚的辛普利丘斯、菲洛波努斯（即文法学家约翰）与小奥林匹奥多罗斯；阿拉伯注家，如阿维森纳与阿威罗伊；以及拉丁注家，如大阿尔伯特、托马斯·阿奎那、邓斯·司各脱、圣普尔坎的杜兰都斯与奥卡姆的威廉。遵循文艺复兴时期亚里士多德派与人文主义者中普遍显露的一条思路（Schmitt 1983）[^schmitt-1983]，施图尔姆认为希腊注家比拉丁注家更可靠，也更忠于亚里士多德本人的观点（PE I：序言）。
    step2: |-
      施图尔姆深谙亚里士多德注疏传统。其一是文艺复兴时期重见天日的希腊注家（Schmitt 1983）[^schmitt-1983]：扬布利科斯、阿弗洛狄西亚的亚历山大、忒米斯提乌斯、赫尔米亚的阿莫尼俄斯。奇里乞亚的辛普利丘斯、菲洛波努斯（文法学家约翰）、小奥林匹奥多罗斯也在其列；其二是阿拉伯注家阿维森纳与阿威罗伊；其三是拉丁注家大阿尔伯特、托马斯·阿奎那、邓斯·司各脱、圣普尔坎的杜兰都斯、奥卡姆的威廉。文艺复兴时期亚里士多德派与人文主义者中流行一种看法（Schmitt 1983）[^schmitt-1983]：希腊注家比拉丁注家更可靠，也更得亚氏本旨。施图尔姆从之（PE I：序言）。
