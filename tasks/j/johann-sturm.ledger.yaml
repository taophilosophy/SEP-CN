      God did not establish to elicit effects absolutely by his mere act of free will. Rather, God freely subordinated his own actions to the obtainment of certain specific conditions, namely, certain states of natural beings or of human minds. Sturm does not extensively use the Malebranchian terminology of occasional causes, but he does explicitly equate occasional causes with *sine quibus non* causes (PE I: 117). A *sine qua non* cause is a (counterfactually) necessary condition for the production of a certain effect, although the *sine qua non* cause does not truly contribute to its production in virtue of any active power it possesses (see Sangiacomo 2019)[^sangiacomo-2019]. Sturm’s account of God’s hypothetical power entails that all natural forms are *sine quibus non* conditions for the production of natural effects, in the sense that they do not contribute in virtue of any active power they might have (since they have none), but rather because God (freely) established to bring about certain effects as consequences of certain modifications (i.e., forms) of matter. Since (what Malebranche calls) ‘occasional causes’ can be understood in terms of *sine qua non* causation, and since Sturm maintains that all natural forms work as *sine quibus non* causes of natural effects, it seems safe to conclude that Sturm supports a version of occasionalism.
    step1: |-
      上帝并未确立要凭其自由意志的单纯活动去绝对地引出效果。毋宁说，上帝自由地把自己的行动置于某些特定条件的获得之下，即自然存在者或人的心灵的某些状态之下。施图尔姆不大量使用马勒布朗士式的偶因术语，但他确实明确把偶因等同于必要条件因（*sine quibus non*）（PE I: 117）。必要条件因是某一效果产生的（反事实）必要条件，尽管该原因并不凭其拥有的任何主动力量真正促成该效果（参 Sangiacomo 2019）[^sangiacomo-2019]。施图尔姆论上帝这种能力的说法蕴含：一切自然形式都是自然效果产生的必要条件。它们不凭自己可能拥有的任何主动力量有所贡献（本无此种力量），而是因为上帝（自由地）立定：物质的某些变形（即形式）一旦具备，某些效果便随之而来。既然（马勒布朗士所谓的）“偶因”可借必要条件因式的因果来说明，又既然施图尔姆主张一切自然形式都作为自然效果的必要条件因起作用，那么可以稳妥地断定：施图尔姆支持一种偶因论版本。
