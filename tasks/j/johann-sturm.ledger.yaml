      Concerning seventeenth-century philosophers, Sturm builds upon Francis Bacon and Gerrit Janszoon Vos (Vossius) regarding his eclectic philosophy and scientific method. He argues against Spinoza’s and Leibniz’s conception of nature, and mentions Thomas Hobbes, Kenelm Digby, Blaise Pascal, and Isaac Newton in passing. Sturm also argues against the Cambridge Platonists, such as Henry More and Ralph Cudworth. In contrast, he builds upon Cartesian thought, using René Descartes, Johann Clauberg, Géraud de Cordemoy, Louis de la Forge, Antoine le Grand, and Nicolas Malebranche as sources. Cordemoy, La Forge Malebranche, and the Christian mystic Pierre Poiret inspire Sturm’s case in favor of occasionalism.
    step1: |-
      至于十七世纪哲学家，施图尔姆在折衷哲学与科学方法上取资于 Francis Bacon 与 Gerrit Janszoon Vos（Vossius）。他反驳 Spinoza 与 Leibniz 的自然观，并顺带提及 Thomas Hobbes、Kenelm Digby、Blaise Pascal 与 Isaac Newton。施图尔姆也反驳剑桥柏拉图主义者，如 Henry More 与 Ralph Cudworth。相反，他在笛卡尔思想上有所取资，以 René Descartes、Johann Clauberg、Géraud de Cordemoy、Louis de la Forge、Antoine le Grand 与 Nicolas Malebranche 为来源。Cordemoy、La Forge、Malebranche 以及基督教神秘主义者 Pierre Poiret，启发了施图尔姆支持偶因论的论据。
    step2: |-
      十七世纪哲学家中，施图尔姆于折衷哲学与科学方法取资于 Francis Bacon 与 Gerrit Janszoon Vos（Vossius）。于 Spinoza、Leibniz 的自然观则加驳难，又顺笔及于 Thomas Hobbes、Kenelm Digby、Blaise Pascal、Isaac Newton。剑桥柏拉图主义者 Henry More、Ralph Cudworth，亦在所驳之列。至于笛卡尔一系，则有所取：René Descartes、Johann Clauberg、Géraud de Cordemoy、Louis de la Forge、Antoine le Grand、Nicolas Malebranche，皆其来源。其偶因论之论据，则得 Cordemoy、La Forge、Malebranche 与基督教神秘主义者 Pierre Poiret 之启。
