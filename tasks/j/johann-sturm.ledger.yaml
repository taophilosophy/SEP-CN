      The clash of fundamental philosophical intuitions that surfaces in the exchange between Leibniz and Sturm is particularly interesting with regard to the complex evolution of early modern philosophy across the seventeenth and eighteenth centuries (Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b)[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]. In a sense, Leibniz voices the main objection that can be raised against Sturm; namely, without some active principle “mechanical forms” are just idle constructions that cannot perform any genuine explanatory role. However, Sturm’s consistent way of maintaining that explanation does *not* require any reference to intrinsic causal powers points, in fact, to an alternative account of causation and causal explanations altogether, which was emerging at the time (Carraud 2002; Sangiacomo 2019, 2020c)[^sangiacomo-2019][^sangiacomo-2020c][^carraud-2002].
    step1: |-
      莱布尼茨与施图尔姆交锋中显露的根本哲学直觉冲突，对于理解十七、十八世纪近代早期哲学的复杂演变尤具意义（Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b）[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]。在某种意义上，莱布尼茨说出了对施图尔姆所能提出的主要反驳：没有某种主动本原，“机械形式”就只是闲置的构造，不能起任何真正的解释作用。然而施图尔姆一贯主张解释并不需要援引内在因果力，这一点实际上指向一种关于因果与因果解释的替代性说明；此种说明当时正在兴起（Carraud 2002; Sangiacomo 2019, 2020c）[^sangiacomo-2019][^sangiacomo-2020c][^carraud-2002]。
    step2: |-
      二人交锋所显露的根本哲学直觉冲突，恰是理解十七、十八世纪近代早期哲学复杂演变的一把钥匙（Henkel 2021 and 2024, especially ch. 2; Sangiacomo 2020a and 2020b）[^henkel-2021][^henkel-2024][^sangiacomo-2020a][^sangiacomo-2020b]。从某种意义上说，莱布尼茨道出了对施图尔姆最要紧的诘难：若无某种主动本原，“机械形式”不过是无所事事的构造，担不起真正的解释之责。可施图尔姆始终主张，解释并不需要援引内在的因果力；这一坚持实际上指向另一种因果与因果解释的说明——当时正在萌发（Carraud 2002; Sangiacomo 2019, 2020c）[^sangiacomo-2019][^sangiacomo-2020c][^carraud-2002]。
