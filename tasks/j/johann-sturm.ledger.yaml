      Sturm is well-versed in the Aristotelian commentary tradition including the Greek commentators rediscovered in the Renaissance (Schmitt 1983)[^schmitt-1983], such as Iamblichus, Alexander of Aphrodisias, Themistius, Ammonius Hermeae, Simplicius of Cilicia, Philoponus (John the Grammarian), and Olympiodorus the Younger; the Arab commentators, such as Avicenna and Averroës; as well as the Latin commentators, such as Albertus Magnus, Thomas Aquinas, Duns Scotus, Durandus of St. Pourçain, and William of Ockham. Following a general line of thought manifesting itself in the Renaissance among both Aristotelian and Humanist thinkers (Schmitt 1983)[^schmitt-1983], Sturm takes the Greek commentators to be more reliable and true to the views of Aristotle himself than the Latin commentators (PE I: preface).
    step1: |-
      施图尔姆精通亚里士多德评注传统，包括文艺复兴时期被重新发现的希腊注家（Schmitt 1983）[^schmitt-1983]，如 Iamblichus、Alexander of Aphrodisias、Themistius、Ammonius Hermeae、Simplicius of Cilicia、Philoponus（即“语法学家约翰”）与 Olympiodorus the Younger；阿拉伯注家，如 Avicenna 与 Averroës；以及拉丁注家，如 Albertus Magnus、Thomas Aquinas、Duns Scotus、Durandus of St. Pourçain 与 William of Ockham。遵循文艺复兴时期亚里士多德派与人文主义者共同呈现的一条思想路线（Schmitt 1983）[^schmitt-1983]，施图尔姆认为希腊注家比拉丁注家更可靠，也更忠于 Aristotle 本人的观点（PE I: 序言）。
    step2: |-
      施图尔姆深于亚里士多德评注之统绪。文艺复兴时重现的希腊注家（Schmitt 1983）[^schmitt-1983]，若 Iamblichus、Alexander of Aphrodisias、Themistius、Ammonius Hermeae、Simplicius of Cilicia、Philoponus（“语法学家约翰”）、Olympiodorus the Younger；阿拉伯注家若 Avicenna、Averroës；拉丁注家若 Albertus Magnus、Thomas Aquinas、Duns Scotus、Durandus of St. Pourçain、William of Ockham，皆所谙悉。文艺复兴以降，亚里士多德派与人文主义者同趋一途（Schmitt 1983）[^schmitt-1983]；施图尔姆沿之，谓希腊注家视拉丁注家更为可信，亦更得 Aristotle 之本旨（PE I: 序言）。
