      Ward made the best out of the difficult challenge of beginning a new life at the age of thirty. In 1874 he obtained a first in his Tripos; one year later, he won a fellowship with a dissertation entitled ‘The Relation of Physiology to Psychology,’ part of which was published in the first issue of *Mind* in 1876. These successes marked the beginning of a distinguished career. He first became known for his article on ‘Psychology’ (1886) in the *Encyclopaedia Britannica*, in which he criticised Mill and Bain’s associationism, and in the years 1896–98 he delivered the prestigious Gifford Lectures, later published under the title *Naturalism and Agnosticism* (1899). In this book, Ward attacked the various forms of scientific materialism that were current in the second half of the nineteenth century. The lectures were well received by his contemporaries and there was a widespread agreement that Ward had been effective in his refutation. According to Alfred Edward Taylor, who reviewed the book in *Mind* in 1900, “one may assert without much fear of contradiction that Prof. Ward’s Gifford Lectures are the philosophical book of the last year” (Taylor 1900: 244)[^taylor-1900].
    step1: |-
      三十岁开始新生活的艰巨挑战，沃德应对得很好。1874 年，他在荣誉学位考试（Tripos）中获得一等成绩；一年后，他凭一篇题为《生理学与心理学的关系》（'The Relation of Physiology to Psychology'）的论文赢得研究员职位，该文的一部分发表于 1876 年《心灵》（*Mind*）创刊号。这些成功标志着一个卓越生涯的开端。他最初因《不列颠百科全书》（*Encyclopaedia Britannica*）“心理学”条目（1886）而闻名，在文中他批评了穆勒与贝恩的联想主义；1896 至 1898 年间，他开设了负有盛名的吉福德讲座（Gifford Lectures），讲座后来以《自然主义与不可知论》（*Naturalism and Agnosticism*，1899）为题出版。在这本书里，沃德抨击了十九世纪下半叶流行的各种形式的科学唯物论。讲座广受同时代人好评，人们普遍认为沃德的驳斥是有力的。据 1900 年在《心灵》上评论此书的阿尔弗雷德·爱德华·泰勒（Alfred Edward Taylor）说：“人们可以放心大胆地断言，沃德教授的吉福德讲座是上一年度的哲学之书”（Taylor 1900: 244）[^taylor-1900]。
    step2: |-
      三十岁才开始新人生，挑战艰巨，但沃德把它经营到了最好。1874 年，他在荣誉学位考试（Tripos）中拿到一等成绩；一年后，又凭一篇题为《生理学与心理学的关系》（'The Relation of Physiology to Psychology'）的论文赢得研究员职位，其中一部分发表于 1876 年《心灵》（*Mind*）创刊号。这些成功标志着一段卓越生涯的开端。他最先为人所知，是因为《不列颠百科全书》（*Encyclopaedia Britannica*）“心理学”条目（1886）——他在文中批评了穆勒与贝恩的联想主义；1896 至 1898 年间，他开设了负有盛名的吉福德讲座（Gifford Lectures），讲稿后来以《自然主义与不可知论》（*Naturalism and Agnosticism*，1899）为题出版。在这本书里，沃德抨击了十九世纪下半叶流行的形形色色的科学唯物论。讲座广受同时代人好评，人们普遍认为他的驳斥是有力的。据 1900 年在《心灵》上书评此书的阿尔弗雷德·爱德华·泰勒（Alfred Edward Taylor）说：“人们可以放心大胆地断言，沃德教授的吉福德讲座是上一年度的哲学之书”（Taylor 1900: 244）[^taylor-1900]。
