      沃德的形而上学对后来的英美哲学影响甚微，但在二十世纪头二三十年的剑桥哲学界却并非没有影响。伯特兰·罗素在其 1900 年的学术研究《莱布尼茨哲学的批判考察》（*A Critical Examination of the Philosophy of Leibniz*）中明确承认自己受惠于老师。尽管他在给奥托琳·莫雷尔（Ottoline Morrell）的信中抱怨沃德的哲学“乏味而过时”（Griffin 1991: 39）[^griffin-1991]，但可以说影响其实更深：罗素长期培育了对自然哲学、心灵哲学与形而上学交界处那些问题的兴趣，而这些恰恰是沃德最为关切的问题。只要想到罗素不仅是《论指称》（1905）与《数学原则》（1903）的名作者，还是《心的分析》（1921）与《物的分析》（1927）的作者，这一点就清楚了。
