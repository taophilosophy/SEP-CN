      Ward’s theory of monads is a radical form of panpsychism; on this view, experience is not solely ubiquitous—it is all there truly is. In the last decades of the nineteenth century, the debate on panpsychism was launched by the publication in 1878 of William Kingdon Clifford’s ‘On the Nature of Things-in-Themselves.’ This essay was perfectly attuned to the *Zeitgeist*, since it linked panpsychism with evolutionary theory. Clifford appeals to the non-emerge argument: the transition from inert matter to conscious beings would be unintelligible, a kind of unfathomable *creatio ex nihilo*; hence, we are forced to conclude that ‘experience’ is an intrinsic, aboriginal feature of matter.
