      沃德是通过批判他那个时代的两大哲学倾向——科学唯物论与“绝对”（或“一元论的”）唯心论——而达到他的形而上学的，即一种相互作用的单子的理论。对唯物论的批判在第一轮吉福德讲座《自然主义与不可知论》中得到相当充分的展开。沃德在这里指出，把实在看作受严格决定论定律支配的惰性物质粒子系统的观点，无法解释世界的偶然性——而被经验的实在的这一根本方面必须按其表面价值来对待。此外，唯物论不能为生物学提供充分的本体论，因为它无法解释生命从无生命物质中的产生。这一学说也与物理学的最新进展不一致：物理学正在告别十七世纪德谟克利特式的原子观，即把原子看作惰性粒子——一种微观的、不可分的“物”。
