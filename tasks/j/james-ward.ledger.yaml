      British idealism was the dominant philosophical movement in the closing decades of the nineteenth century. Its best-known representatives—philosophers of the like of Thomas Hill Green and Francis Herbert Bradley—held a version of Absolute idealism, the theory that reality is a single unified consciousness or cosmic experience. The doctrine has its roots in the philosophies of Spinoza, Kant and Hegel, but the British idealists elaborated it in independent, original ways. In this, they were motivated by a desire to oppose materialism and vindicate our instinctive belief that human life has a meaning. As Bradley forcefully put it in his *Logic*, “that the glory of this world in the end is appearance leaves the world more glorious, if we feel it is a show of some fuller splendor; but the sensuous curtain is a deception and a cheat, if it hides some colourless movement of atoms […]” (Bradley 1883: 590)[^bradley-1883].
    step1: |-
      英国唯心论是十九世纪最后几十年间占主导地位的哲学运动。其最著名的代表人物——托马斯·希尔·格林（Thomas Hill Green）与弗朗西斯·赫伯特·布拉德雷（Francis Herbert Bradley）这样的哲学家——持有一种绝对唯心论的立场，即认为实在是单一统一的意识或宇宙性的经验。这一学说植根于斯宾诺莎、康德与黑格尔的哲学，但英国唯心论者以独立的、原创的方式阐发了它。他们这样做，是出于反对唯物论、为我们关于人生有意义的本能信念辩护的愿望。正如布拉德雷在其《逻辑学》（*Logic*）中有力地指出的：“这个世界到头来是显现，这一荣耀使世界更加荣耀，如果我们感到它是某种更圆满光辉的演出；但感性帷幕就是一种欺骗与诓诈，如果它掩盖了原子的某种无色运动 […]”（Bradley 1883: 590）[^bradley-1883]。
    step2: |-
      十九世纪最后几十年，英国唯心论是哲学界占主导地位的思潮。其最知名的代表——托马斯·希尔·格林（Thomas Hill Green）、弗朗西斯·赫伯特·布拉德雷（Francis Herbert Bradley）等哲学家——都持有一种绝对唯心论：实在乃是单一统一的意识，即宇宙性的经验。这一学说植根于斯宾诺莎、康德与黑格尔的哲学，但英国唯心论者以独立而原创的方式将它发扬光大。他们这样做，是要反对唯物论，并为我们认为人生自有意义的本能信念辩护。正如布拉德雷在《逻辑学》（*Logic*）中有力写下的那样：“这个世界到头来只是显现，这一点使世界愈发荣耀——倘若我们感到它是某种更圆满光辉的演出；但倘若它掩盖的是原子的某种无色运动，那么感性的帷幕便是一场欺骗与诓诈 […]”（Bradley 1883: 590）[^bradley-1883]。
