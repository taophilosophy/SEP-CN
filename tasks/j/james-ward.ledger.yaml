      沃德的说明不妨同查尔斯·桑德斯·皮尔士（Charles Sanders Peirce）在 1891 年重要论文《理论的体系构造》（'The Architecture of Theories'）中提出的类似说明作一有益的比较。在那里，皮尔士主张：“唯一可理解的宇宙理论是客观唯心论的理论，即物质是精疲力竭的心灵，积重难返的习惯成为物理定律”（153）。他还进而主张：“说明自然定律以及一般齐一性的唯一可能途径，就是假定它们是演化的结果。这假定它们不是绝对的，不是被精确遵守的；它在自然中引入了一种非决定性、自发性或绝对偶然的要素”（148）。
