      沃德的总体结论是：唯物论困难重重，以至于真正的问题不是它是否为真，而是它究竟为什么会起初被人相信。沃德把这一学说的起源追溯到一种把抽象与具体实在混为一谈的倾向。探究之初，科学家面对的是一个具体的经验整体，却只注意到其中某些方面。这样做完全正当，但如果他忽视他的概念所由出的经验基础的丰富性，就容易犯错。这时他会易于“把他那套描述装置与它被设计来描述的实际现象混为一谈”（1899: Vol. 1, 81）。唯物论就是对自己的研究程序缺乏理解的科学家所持的形而上学。
