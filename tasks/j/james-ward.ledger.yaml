      Other Cambridge thinkers that might have been influenced by Ward are John Ellis McTaggart, C. D. Broad, and Alfred North Whitehead. In *The Nature of Existence* (1921/1927) McTaggart developed a system of idealistic metaphysics that bears some resemblance with Leibniz’s theory of monads. Broad says in his ‘Autobiography’ (1959) that his idealist professor had ‘little influence’ on his thought (50), yet he favorably (and acutely) reviewed Ward’s *The Realm of Ends* and devoted an important study to Leibniz’s philosophy. Arguably, the greatest ascertained influence was exerted on Alfred North Whitehead; the system of metaphysics that he exposed in *Process and Reality* (1929) incorporates all the crucial ideas of Ward’s philosophy of nature, while his conception of the God-World relationship is a way of bringing to completion Ward’s fragmentary account. (Basile 2009: 61–62, 142–43)[^basile-2009] One might reasonably expect that, outside of Cambridge, his philosophy should have been taken into serious consideration by thinkers with an interest in *Naturphilosophie*, and especially so by a philosopher usually referred to as an ‘idealist’ such as Robin G. Collingwood, but there seems to be no documentary evidence of this. American process philosopher and theologian Charles Hartshorne, whose speculative system approximates to Whitehead’s, displays in print knowledge of Ward’s works. (1963: 19)
