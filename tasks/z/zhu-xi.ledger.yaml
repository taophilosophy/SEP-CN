      While Zhu stressed making careful observations in situations in order to tailor the most fitting responses in context, at the same time he envisioned a cultivation process whereby one discerns ever more fundamental and yet far-reaching patterns (*li*) that shape nature and moral value. That is, Zhu sometimes construed the project of investigating things to extend knowledge as an ascendant movement whereby the learner finally arrives at the pinnacle—*taiji* (supreme polarity) that embraces and subsumes all derived patterns. To Zhu, grasping *taiji* in this sense was tantamount to grasping the master key, for it represented to him the apex of being and value, and bestowed realization and sagehood on those who sincerely and authentically comprehended and embraced it.[^note-10] While this conception charts an ideal path to the pure, compassionate mind-set of sagehood, it obscures Zhu Xi’s usual emphasis on fine-tuning and sharpening one’s moral discernment and responsiveness in the midst of things—in full view of the situatedness of people in their daily life. This conception also neglects Zhu’s equal emphasis on the claim that patterns as inborn propensities (*xing*) are manifested only in concrete specific *qi* formations, and thus that 1) patterns are to be discerned in their fine particularity, that 2) the moral impulses are to be nurtured in the stream of human life, and that 3) the emotions, when not obscured by desires or obsessions, for the most part are immediate expressions of the basic natural impulses.
    step1: |-
      朱熹一面强调在情境中作仔细观察以便因应裁制最贴切的回应，一面也设想了一个修养进程：人在其中不断辨明越来越根本而又影响深远的条理（理），这些条理塑造着自然与道德价值。也就是说，朱熹有时把格物致知的事业构想为一种上升的运动：学习者最终抵达顶点——太极（*taiji*，最高极性），它包含并统摄一切派生的条理。对朱熹来说，在这种意义上把握太极，就等于把握了那把总钥匙；太极在他那里代表存在与价值的顶点，凡真诚而本真地领会并拥抱它的人，便获得体认与圣境。[^note-10]这一构想固然画出了一条通往圣人纯粹悲悯心态的理想路径，却也遮蔽了朱熹一贯的强调：在事物之中——在人的生活处境的全部可见性之中——微调并磨砺人的道德明察与回应能力。这一构想同样忽视了朱熹同等强调的另一个主张：作为先天禀赋的条理（性）只在具体特定的气之构形中显现；因此，其一，条理要在其细微的特殊性中被辨明；其二，道德冲动要在人类生活的川流中涵养；其三，情感只要不为欲望或执迷所蔽，大体上就是基本自然冲动的直接表达。
