  - id: 4
    kind: body
    source: |-
      Zhu Xi was born in Youqi in Fujian in October 1130. Many anecdotes attest that he was a highly precocious child. It was recorded that at age five he ventured to ask what lay beyond Heaven, and by eight he understood the significance of the *Classic of Filiality* (*Xiaojing*). As a youth, he was inspired by Mencius’ proposition that all people could become a sage. In Zhu Xi’s childhood, his father Zhu Song (1097–1143) arranged for several old friends to educate Zhu Xi after his imminent passing. Consequently, Zhu Xi was educated by several eclectic scholars who had delved into Daoism and Buddhism as well as Confucianism, and inclined him to be deep and wide-ranging in his intellectual predilections and cultural interests. Later he studied Chan (Zen) Buddhism with the monk Dao Qian of the Kaishan Temple, and reputedly met with the Chan master Da Hui (Dahui Zonggao, 1089–1163).[^note-2] Traces of Huayan’s holistic thought can also be discerned in the formation of Zhu Xi’s system (Makeham 2018)[^makeham-2018]. Remarkably, Zhu passed the official *jinshi* exam (the “presented scholar” exam) at just nineteen, drawing on Chan Buddhism in his answers.[^note-3] He continued to pursue Daoism and Buddhism until he met the Neo-Confucian master Li Tong (1093–1163) a decade later, and formally became his student in 1160. In fact, Zhu’s father had recommended that he conduct his advanced studies under Li Tong, but Zhu postponed seeing Li for years until he finally admitted to himself that he was not making progress in his eclectic cultivation and suffered spiritual doubts. Li Tong was a master in the southern Yang Shi (1053–1135) lineage of the Cheng brothers’ school, partial to the teachings of Cheng Yi. Importantly, Li Tong convinced Zhu of the cogency and superiority of the Confucian Way and cultivation. Meanwhile, having passed the *jinshi* examination, Zhu was eligible to hold office, and had been assigned to several prefectural administrative posts. But, since he disagreed with central court policy on several major issues, he preferred to hold temple guardianships, which gave him the leisure to conduct Confucian studies and cultivation in earnest, and shielded him from the cutthroat court politics. Having chosen this career path, Zhu Xi had the leisure to study and reflect, and over time he made numerous contributions through his classical studies, historical inquiries, literary studies, and philosophic reflections. He moreover developed into a man of letters and wrote subtle prose and elegant verse.
    step1: |-
      朱熹于 1130 年 10 月生于福建尤溪。许多轶事都证明他是个极为早慧的孩子。据记载，五岁时他竟敢问天之外为何物；八岁时已能领会《孝经》的要义。少年时代，孟子「人皆可以为尧舜」的命题激励了他。朱熹幼年时，父亲朱松（1097–1143）在自知不久人世之际，安排几位旧友教导朱熹。于是，朱熹受教于几位兼涉道教、佛教与儒学的博杂学者，这使他思想上的偏好与文化兴趣趋于深广。后来他跟随开善寺道谦禅师学习禅（Zen）佛教，据说还曾与大慧禅师（大慧宗杲，1089–1163）会面。[^note-2]华严宗整体性思维的痕迹，同样可以在朱熹体系的形成中辨认出来（Makeham 2018）[^makeham-2018]。引人注目的是，朱熹年仅十九便考中进士（「进士科」），对策中还援引禅佛教。[^note-3]此后十年间他仍修习道教与佛教，直到遇见新儒家大师李侗（1093–1163），并于 1160 年正式拜入其门下。其实，父亲早已嘱托他向李侗问学，但朱熹拖延数年未去，直到终于承认自己在博杂修养上并无进展、内心已有精神疑虑。李侗属二程学派南支杨时（1053–1135）一系，偏向程颐的教导。重要的是，李侗使朱熹信服儒家之道及其修养功夫的正当与优越。与此同时，考中进士的朱熹已有出仕资格，并被派任过几处州县行政职位；但因在数个重大问题上与朝廷政策不合，他宁愿担任祠禄监庙之职——这既给他从容治儒学与修养的余裕，也使他免于凶险的朝廷党争。选择了这条道路，朱熹便有闲暇读书与思考，并经由经学研究、史学探究、文学研究与哲学反思，陆续做出诸多贡献。他还成长为一位文人，写出精微的散文与雅正的诗篇。
