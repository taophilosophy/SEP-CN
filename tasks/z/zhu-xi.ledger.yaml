      Known in the seventeenth and eighteenth centuries in the West through the work of Jesuits in China, Zhu Xi’s thought and texts were made more widely available to western scholarship in the late nineteenth century. Notably, James Legge (1815–1897) based his translations of the Chinese Classics on Zhu Xi’s commentaries, which he quoted and discussed at length in his footnotes to the texts. Early in the twentieth century, a Chinese student of John Dewey (1859–1951) at Cornell, Hu Shi (1891–1962), initially followed the empirical, textual Qing scholars in viewing Zhu as a scholastic metaphysician. But, after reading Zhu’s *Dialogues* for himself in old age, Hu contended that Zhu’s method of observation was not scholastic but essentially scientific in nature. J.P. Bruce, who translated a book of Zhu’s collected writings in the 1920s, viewed Zhu’s notion of *li* (pattern; principle) in light of Stoic natural law. From the 1930s, the eminent historian of Chinese philosophy, Feng Youlan, interpreted *li* along the lines of platonic Forms making Zhu Xi appear to be an idealist and abstract thinker. In the 1950s, Carsun Chang naturalized the notion of *li* by aligning it with the Aristotelian “nature” or “essence”, thereby locking Zhu’s thought into a sort of naturalistic metaphysics.
    step1: |-
      十七、十八世纪，朱熹的思想与文本经由在华耶稣会士的工作而为西方所知；到十九世纪末，它们才更广泛地进入西方学术。值得注意的是，James Legge（理雅各，1815–1897）基于朱熹的注疏翻译中国经典，并在其文本脚注中长篇引用与讨论这些注疏。二十世纪初，胡适（1891–1962）——康奈尔大学 John Dewey（1859–1951）的中国学生——起初追随清代实证的文献学者，把朱熹看作经院式形而上学家。但晚岁亲自读了朱熹的《语类》之后，胡氏主张：朱熹的观察方法并非经院式的，本质上具有科学的性质。J.P. Bruce 在二十世纪二十年代翻译了朱熹文集的一卷，他把朱熹的理（条理；原理）观念放在斯多亚自然法的框架下来看。从三十年代起，中国哲学史的杰出史家冯友兰按柏拉图型相的路线诠释理，使朱熹显得像一个唯心论的、抽象的思想家。五十年代，张君劢（Carsun Chang）把理的观念自然化，使之与亚里士多德的「自然」或「本质」相配，从而把朱熹的思想锁进了一种自然主义的形而上学。
