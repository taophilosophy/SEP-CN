      这一对四书的偏重固然提高了朱熹在教育上的地位，却也以牺牲其更深、更细腻的著述与语录为代价，并为过度的哲学批评打开了方便之门。朱熹四书注疏背后那幅理（条理）与气（宇宙之气）的宏阔理论图景，其纲要式的呈现，很容易使人指责他是二元论者，指责他把抽象范畴读进本平实而重实践的古代文本。由于他的注疏专注于读出四书的意义、意图与修养信息，批评者便概括说：朱熹及其方法本质上是经院式的，面对实际情境时会近视而僵硬。然而，任何通读朱熹著述与语录全集的人都会发现：他的本体论不是粗糙的二元论，而是一个由互补的、互相蕴含的、从不分离存在的要素构成的整体论。而且，他的反思总是贯注着历史知识、时事、实践观察与个人反思：他的观察方法普遍适用于对象（与自我）及现象，同时又尊重文本——他把文本视为伦理洞见与实践的手册。连朱熹关于孔子与孟子的评论也常常回指其人与言语语境，因此并非全然经院式。他的观察方法为突破经典的「定论」打开了门径，尽管他谨慎地不强调这一点——因为他的多数思想同道主要在文本中求真理，认为经验事实是对自然之理（*tianli*，天理）的干扰；而天理在他们看来最充分地反映在经典文本之中。
