      Humaneness is not just a matter of being thoughtful and considerate and paying one’s due respect to others; Zhu Xi underscores the rigors of conducting oneself sincerely and authentically with humaneness, citing Confucius’ examples of not only ministers who had declined official posts to maintain their integrity but of times when the exemplary person is willing to sacrifice his or her own life to fulfill humanity (*Analects* 15.8). Nonetheless, the animating spirit of Zhu Xi’s *Treatise* remains: “love people gently and benefit things,” as reflected in Mencius’ four incipient ethical impulses and Confucius’ four cardinal virtues.[^note-15]
