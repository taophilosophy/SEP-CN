    source: |-
      Zhu Xi erected a philosophical synthesis that has been compared broadly to the systems of Plato, Aristotle, Thomas Aquinas, Whitehead, and others. These “Great Chain” systems are hierarchical and rooted in the distinction between form and matter. Recent immanental readings of Zhu Xi’s thought have stirred comparisons with Spinoza and even Husserl (Choi 1999; Yeo 2013)[^choi-1999][^yeo-2013]. Zhu Xi preserved the immanental character of his hierarchy by incorporating Zhou Dunyi’s conception of world (and self) as shown in the *Diagram of the Supreme Polarity* (*Taiji tu*), as a way to combine the Cheng brothers’ concept of *li* (pattern) with Zhang Zai’s notion of *qi* (cosmic vapor) as organically integrated in a holistic system. In Zhou’s treatise, *Explanation of the Diagram of the Supreme Polarity* (*Taiji tu shuo*) (Adler 2014)[^adler-2014], Zhu discerned a viable account of the formation of the world in stages from the original unformed *qi*, to *yin* and *yang*, the five phases, earth, wood, fire, water, and metal, and on to heaven, earth and the ten thousand things. Zhu blended this conception with ideas from the *Book of Change* and its commentaries in setting forth a comprehensive philosophy of cosmic and human creativity and providing philosophical grounds for the received Confucian concepts of human nature and self-cultivation.
    step1: |-
      朱熹构筑了一个哲学综合体系，人们把它与柏拉图、亚里士多德、托马斯·阿奎那、怀特海等人的体系作广泛的比较。这些「大存在链」体系是层级性的，植根于形式与质料的区分。近世对朱熹思想的内在论解读，又引出了与斯宾诺莎甚至胡塞尔的比较（Choi 1999; Yeo 2013）[^choi-1999][^yeo-2013]。朱熹通过纳入周敦颐在《太极图》（*Taiji tu*）中展示的世界（与自我）构想，保存了其层级的内在论品格；这一纳入把二程的理（条理）概念与张载的气（宇宙之气）观念有机地整合于一个整体系统。在周氏的论著《太极图说》（*Taiji tu shuo*）（Adler 2014）[^adler-2014]中，朱熹辨认出一份关于世界之逐阶形成的可行说明：从原初无形的气，到阴与阳，到五行——土、木、火、水、金——再到天地与万物。朱熹把这一构想与《易经》及其注疏中的观念相融合，提出了一套关于宇宙与人的创生力的综合哲学，并为传世的儒家的人性与修养概念提供了哲学根据。
