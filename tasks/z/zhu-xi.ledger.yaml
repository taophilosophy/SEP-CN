      Zhu Xi on occasion modeled his ethical conception of observing situations and fashioning the most appropriate response naturalistically on the butcher character, Cook Ding, portrayed in the Zhuangzi as a skilled artisan: just as the sure blade of Cook Ding’s cleaver goes straight to the cartilage between the bones, the cultivated sense of appropriateness (*yi*) of Zhu Xi’s moral adept strikes right at the heart of interpersonal situations (see Thompson 1988: 39–40)[^thompson-1988]. A.C. Graham once contrasted Zhu’s perception/response model (*gan-ying*) of ethical action with that of Zhuangzi by suggesting that Zhu’s notion of appropriate response was informed by rigorous adherence to rules and principles, whereas Zhuangzi’s was relatively intuitive and spontaneous (Graham 1986a: 143–145)[^graham-1986a]. This apparent contrast can be resolved by separating the stages of cultivation and mastery: Zhuangzi’s skilled artisans, such as Butcher Ding, all had already undergone prolonged periods of rigorously controlled apprenticeship before they could “forget” the “knowing that” in an integrated, spontaneous process of “knowing how”. For his part, Zhu Xi knew that the years of learning and practice—one’s moral apprenticeship—culminates in a responsive moral agent who can operate as intuitively and spontaneously in his or her personal and social ethical sphere as do Zhuangzi’s skilled artisans in theirs.[^note-11] Zhu’s moral adept is in effect an artisan of interpersonal intercourse. Zhu could rightfully claim Confucius as a prime model for this view. After decades of cultivation, Confucius could say, “At sixty, my ear was attuned. At seventy, I could give my heart free rein and without overstepping the mark” (*Analects* 2.4).
    step1: |-
      朱熹偶尔以自然主义的方式，借《庄子》中描写为熟练匠人的屠夫庖丁，来示范他「观察情境并塑造最适宜回应」的伦理构想：正如庖丁之刀确然的刀锋直入骨节之间的软骨，朱熹道德学人经修养而得的适宜之感（义）也正中人际情境的要害（见 Thompson 1988: 39–40）[^thompson-1988]。A.C. Graham 曾把朱熹以感应（*gan-ying*）为框架的知觉/回应伦理行动模型与庄子相对照，提出：朱熹的适宜回应观念受严格的规则与原理的约束，而庄子的相应观念则相对直觉与自发（Graham 1986a: 143–145）[^graham-1986a]。这一表面上的对照，可以通过区分修养与 mastery 的阶段来化解：庄子的那些熟练匠人——例如庖丁——都先经历了长期严格控制的学徒期，然后才能在整合的、自发的「知道如何」过程中「忘记」「知道什么」。就朱熹而言，他明白多年的学习与实践——人的道德学徒期——最终造就一个能回应的道德行动者，此人在其个人与社会的伦理领域中运作起来，可以像庄子的熟练匠人在其领域中那样直觉而自发。[^note-11]朱熹的道德学人实际上就是人际交往的匠人。朱熹有理由把孔子奉为这一观点的首要典范：历经数十年修养，孔子可以说，「六十而耳顺，七十而从心所欲，不逾矩」（*Analects* 2.4）。
