      显然，这些考量把我们带进未经测绘的伦理地带。这种对通行适用规范与礼仪行动的规避，可以正当地走多远？需要哪些限定与限制？就朱熹而言，他至少提到两条限定：较弱的一条是，所采取的权宜手段不得另有伦理上的可非议之处；较强的一条则规定，所采取的权宜手段须合乎道，也就是说，须满足某种基本的道德价值，至少与相关通行规范及礼仪行动所表达的价值同等基本。因此，凡是凭适宜之感（义，*yi*）而施行的斟酌，只要行使时足够正直与谨慎，就应当比循规蹈矩地遵行标准规范更能充分满足道所体现的道德价值。仁是儒学的核心道德价值，在这类情形中最常被援引；但还有其他许多：孝、悌、诚信、同理、怜悯、适宜等等。儒家传统中的著名例子包括：孟子提醒说，为了救援溺水的嫂子，应当推翻「男女授受不亲」之礼（《孟子》4A.17）；还有程颐的侄女与其侄之妻改嫁而不失其正当的事例。Li-hsiang Rosenlee 记述说，程颐曾自豪地谈到他父亲如何安置并操办其侄孙女改嫁（Rosenlee 2006: 133）[^rosenlee-2006]。同样，苏格拉底也表明：正义并非总是靠恪守说真话、原样归还朋友财物这类礼俗来实现（Plato *Republic* 331c）。
