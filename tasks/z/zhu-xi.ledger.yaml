      Several features of Zhu Xi’s thought and his notion of observation discouraged him from forming a reductive scientific theory or making scientific observations. Zhu was loath to investigate the sorts of fundamental abstract concepts, such as element, compound, infinity, space, time, void, causality, and law, that were necessary for making breakthroughs in the scientific revolution. Because of the Confucian commonsense approach to things, Zhu was disinclined to pursue or investigate such abstract, intangible, and seemingly ephemeral notions. He tended to think that focusing on concepts like void, nothingness, infinity, and space would draw people away from the world of human affairs and ultimately incline them toward pointless introspection. Zhu’s concern with the real world itself stymied his investigations into the very abstract concepts necessary for constructing a better grasp of this so-called real world.
    step1: |-
      朱熹思想的若干特征及其观察观念，使他不倾向于形成还原性的科学理论或作科学观察。朱熹不愿考察那类根本性的抽象概念——元素、化合物、无限、空间、时间、虚空、因果性、定律——而要在科学革命中取得突破恰恰需要这些概念。由于儒家对事物的常识性取径，朱熹不倾向于追问或考察这类抽象的、无形的、看似短暂易逝的观念。他倾向于认为，聚焦于虚空、无、无限、空间这类概念会把人从人事世界引开，最终使他们趋向无益的内省。朱熹对现实世界本身的关切，反而阻碍了他对构造这个所谓现实世界的更佳把握所必需的那些抽象概念的考察。
