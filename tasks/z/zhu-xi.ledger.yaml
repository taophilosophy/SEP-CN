      Again, Zhu Xi conceived the world as a patterned (*li*) totality made up of a cosmic vapor (*qi*) that under various conditions condenses and solidifies into countless permutations, from the purest transparent *yuanqi* (primordial *qi*), to the *Yin-Yang* poles modulated by the primal *taiji* (supreme polarity) pattern, to the *wuxing* (five phases), each of which bears an identifying inner pattern and set of propensities (*xing*) that involve interconvertability and recombination with the other four phases, and finally to the phenomenal world: Heaven, Earth, and the myriad things (*tiandi wanwu*).[^note-6]
    step1: |-
      再者，朱熹把世界构想为由宇宙之气（气，*qi*）构成的、具有条理（理）的整体：气在各种条件下凝结、固化成无数形态，从最纯粹的透明元气（*yuanqi*，原初之气），到受原初太极（*taiji*，最高极性）样式调节的阴阳两极，到五行（*wuxing*）——其中每一行都带有标识性的内在条理与一套禀性（性，*xing*），涉及与其他四行的互相转化与重新组合——最后到现象世界：天地万物（*tiandi wanwu*）。[^note-6]
