      In summary, the depth and range of Zhu Xi’s thought have been unparalleled in the Chinese intellectual tradition and around East Asia. Zhu Xi studies globally continue to be vital, wide-ranging, and contentious. Moreover, they continue to grow and attract increasing interest around the world.
    step1: |-
      总之，朱熹思想的深度与广度在中国思想传统中以及东亚各地是无与伦比的。全球的朱熹研究继续是活跃的、广泛的、有争议的；而且，它们继续增长，在世界各地吸引越来越多的兴趣。
