      A Neo-Confucian master of the Ming dynasty, Wang Shouren (Yangming; 1472–1529), spurned Zhu’s method of inquiry altogether after he made a futile attempt to observe the *li* (patterning) in the bamboo growing outside his gate. Holding that facts are obvious to a perceptive observer and do not require endless further investigation, Wang went on to formulate an idealist pragmatism that became widely influential. Intending to counter the scholasticism and careerism of his day, Wang, a military man, stressed volitionism and activism and spurned the sort of careful objective inquiry Zhu thought necessary to making balanced judgments and appropriate responses.
    step1: |-
      明代新儒家大师王守仁（阳明；1472–1529），在徒劳地试图观察自家门外生长之竹中的理（条理）之后，全盘摒弃了朱熹的探究方法。王氏认为，事实对一个有洞察力的观察者来说是显然的，不需要无穷无尽的进一步考察；他由此发展出一种唯心主义的实用主义，影响极为广泛。意在反击当时的经院习气与求仕之风，身为军人的王氏强调唯意志论与行动主义，摈弃了朱熹认为对作出均衡判断与适宜回应必不可少的细致客观探究。
