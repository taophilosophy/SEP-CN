      Zhu Xi’s teacher, Li Tong, and friend, Zhang Shi (1133–1180), presented him with different approaches to cultivation based on the premise of basic still and active mindsets, respectively. But, Zhu found that both of these approaches were one-sided and flawed. How is one to leap from quiet-sitting and stillness to making timely moral responses? When does one have the composure to introspect morally when their mind is constantly active and engaged? If neither the meditative approach nor the active approach to cultivation and practice were efficacious, what path remained open to Zhu Xi? Recent research shows that Zhu Xi embarked on a careful reading of the works of Zhou Dunyi during this period of spiritual-philosophical crisis in the course of which he rediscovered Zhou’s doctrine of “the interpenetration of stillness and activity” for the human mind and spirit (Adler 2014)[^adler-2014]. With this idea, Zhou Dunyi was advocating that whereas the states of action and rest are mutually exclusive in the case of physical objects, such states interpenetrate and are mutually implicative in the case of human mental and spiritual phenomena (Adler 2014)[^adler-2014]. This doctrine piqued Zhu Xi’s interest, and he came to see it as offering a way out of the dilemma between Li Tong’s stress on stillness and Hu Hong’s stress on activity in cultivation and practice, and their respective shortcomings. Zhou Dunyi’s doctrine was particularly exciting to Zhu Xi for it highlighted the distinctness and potential religiosity of the human mind and spirit, which Zhou describes as not subject to the same limitations and restrictions as are physical phenomena. Zhou Dunyi moreover associates this idea with a vital and well integrated model of human mind and spirit, self-cultivation, and cosmos. Inspired by Zhou Dunyi’s doctrine of the interpenetration of stillness and activity and related ideas, Zhu Xi worked out a twofold cultivation effort that incorporated at once nurturing one’s feeling of reverence (*jing*) to purify the original nature while investigating things to discern their determinate or defining patterns (*li*). Cultivation of reverence, originally a religious virtue associated with ancestor worship and ceremonial rites, as described in the classics and taught by Confucius (551–479 BCE), serves to purify the nature, attune one to the promptings of the nature, and set one to act with appropriateness (*yi*). Moreover, by grasping the defining patterns (*li*) of relationship and intercourse that constitute the world, society, people, and proper conduct, one gains the master key to acting with utmost propriety (*zhongyong*). The mind that is imbued with reverence and comprehends these patterns will develop into a good will (*zhuzai*) dedicated to acting appropriately and with utmost propriety. Since *jing* takes on connotations of focus, concentration, and alertness, as well as reverence in Zhu Xi’s discourses, mindfulness has been suggested as the English translation that covers the fullness of the term *jing* (Kalton 1988)[^kalton-1988] in Zhu Xi’s thought.
    step1: |-
      朱熹的老师李侗与朋友张栻（1133–1180）各自基于「基本心态是静」与「基本心态是动」的前提，向他提出了不同的修养进路。但朱熹发现，这两种进路都是片面的、有缺陷的。人如何能从静坐与静定一跃而作出及时的道德回应？心思不断运作与投入之际，人何时才有道德内省的从容？如果静的进路与动的进路对于修养与实践都无效，朱熹还剩下什么道路可走？近来的研究表明，在这一精神哲学危机时期，朱熹细读周敦颐著作，并在此过程中重新发现了周氏关于人心与精神「动静互贯」的学说（Adler 2014）[^adler-2014]。借这一观念，周敦颐主张：物理对象的动与静两态互斥，而人的精神现象中，两态却互相贯通、互相蕴含（Adler 2014）[^adler-2014]。这一学说引起了朱熹的兴趣；他逐渐把它视为走出李侗主静与胡宏主动两种修养实践主张及其各自缺陷之间两难的一条出路。周敦颐的学说对朱熹格外令人振奋，因为它凸显了人心与精神的独特性与潜在的宗教性：周氏描述道，人心与精神不像物理现象那样受制于同样的限制与约束。周敦颐还将这一观念同一个富有生命力且整合良好的模型相连：人的心神、修养与宇宙三者一体。受周敦颐动静互贯学说及相关观念的启发，朱熹发展出一套双轨修养功夫：一面涵养敬畏之感（敬，*jing*）以净化本原之性，一面格物以辨识事物确定的、规定性的条理（理，*li*）。敬的修养原是祭祖与礼仪相关的宗教德性，如经典所载、孔子（前 551–前 479）所教；它用来净化本性，使人调适于本性的驱动，并使人以适宜（义，*yi*）行事。此外，把握构成世界、社会、人与正当行为的关系与交往的规定性条理（理），便掌握了以最高适宜（中庸，*zhongyong*）行事的钥匙。充满敬畏又领会这些条理的心灵，将发展成致力于以适宜与最高中庸行事的主宰（*zhuzai*）善意。由于在朱熹的讲论中，敬兼有专注、凝敛与警觉以及敬畏的含义，有学者建议以 mindfulness（正念）作为涵盖 *jing* 一词全部意涵的英文翻译（Kalton 1988）[^kalton-1988]。
