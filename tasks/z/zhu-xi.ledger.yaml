      Zhu Xi was an active scholar-intellectual who held discussions and disputes with other scholars, both in correspondence and in person. His thought can be understood by contrast with the thought of his intellectual rivals as well as through his positive views. For example, his series of letters with Zhang Shi on the topic of self-cultivation and moral psychology, preserved in the *Collected Writings of Master Zhu* (*Zhuzi wenji*), provides an illuminating record of these two dedicated Confucians’ quest for a well-grounded, efficacious approach to self-cultivation and practice. He debated with Lü Zuqian (1134–1181) on the nature of education. Zhu focused on the Confucian Way and moral practice in education while Lu argued for a broader-based humanities approach. Zhu held a series of debates with Lu Jiuyuan (Xiangshan: 1139–93) on the nature of realization and moral conduct. Whereas Zhu advocated regimens of study, reflection, observation, and practice, Lu spoke simply of reflecting on the self and clarifying the mind, considering that once the mind was clear one would know spontaneously what to do in any situation. Zhu also corresponded with the “utilitarian” Confucian scholar Chen Liang (1143–94), who disputed Zhu’s focus on individual moral realization and the received “Way” with a broader institutional approach that was more sensitive to empirical facts and conditions. Zhu generally eclipsed all of the other scholars of his day, partly because he outlived them and had so many students, but mainly because his system was so compelling. It was comprehensive yet nuanced, tightly reasoned yet accommodating of individual differences. It preserved the essential Confucian Way, yet ramified it to meet the challenges of Buddhism and Daoism as spiritual teachings. Zhu’s influence rose at the end of the Southern Song dynasty and became decisive during the Yuan dynasty when his edition of the *Four Books* was adopted as the basis of the imperial examination system arranged by scholars trained in his approach.
    step1: |-
      朱熹是一位活跃的学者型知识分子，通过书信与当面讨论、辩论与其他学者交往。他的思想既可通过其正面观点来理解，也可通过与思想对手的对照来理解。例如，他与张栻就修养与道德心理学问题往还的书信系列，保存在《朱子文集》中，为这两位专注于道的儒者寻求有根据、有效验的修养与实践进路的努力，提供了一份发人深省的记录。他与吕祖谦（1137–1181）就教育的本性辩论：朱熹聚焦于教育中的儒家之道与道德实践，吕氏则主张更宽泛的人文进路。朱熹与陆九渊（象山；1139–93）就体认与道德行为的本性举行过系列辩论：朱熹主张学习、反思、观察与实践的功夫，陆氏则只谈省察自身与澄明此心，认为心一旦澄明，便会在任何情境中自发地知道该做什么。朱熹还与「功利」派的儒家学者陈亮（1143–94）通信；陈氏以更宽泛的制度取径——对经验事实与条件更敏感——质疑朱熹对个人道德体认与传世「道」的偏重。朱熹大体上使同时代的其他学者都黯然失色，部分原因是他比他们长寿、学生众多，但主要还是因为他的体系如此令人信服：它全面而细腻，论证严密而容纳个体差异。它保全了儒家的根本之道，又使之分衍发展，以应对佛教与道教作为精神教义提出的挑战。朱熹的影响在南宋末年上升，在元代变得决定性——其四书定本被采用为科举制度的基础，主持其事的学者皆受其学术取径的训练。
