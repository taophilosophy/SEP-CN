      Zhu Xi’s ethical thought presupposes the classical Confucian notion of an original human nature as the ground of responsive human goodness. In classical Confucianism, heaven was deemed a moral force; Confucius speaks of the virtue endowed in him by heaven (*Analects* 7.23), Mencius of realizing heaven by realizing one’s nature (7A.1), and the *Mean* of the nature endowed in humans by heaven (ch. 1). Cheng Yi declares, “the original nature is just [a matter of] *li*” (Chan 1963, 560)[^chan-1963]. This view suggests that, at root, every human being partakes of heaven or *li* in a fundamental sense. Aware that *li* involves pattern and coherence, Diana Arghirescu makes a comparison between Levinas’ ethics of the other based on the face and Zhu Xi’s ethics of relationship based on the original nature. She writes (Arghirescu 2022b: 586)[^arghirescu-2022b]:
    step1: |-
      朱熹的伦理思想以古典儒学关于本原人性的观念为前提：本原人性是人以善相回应的根据。在古典儒学中，天被视为一种道德力量。孔子谈到天赋予他的德（《论语》7.23），孟子谈通过实现一己之性而实现天（7A.1），《中庸》谈天赋予人的性（第 1 章）。程颐说：「本原之性即是理」（Chan 1963, 560）[^chan-1963]。这一看法意味着：从根本上说，每个人都在根本意义上分有天或理。意识到理兼有条理与融贯之意，Diana Arghirescu 把列维纳斯基于面容的他者伦理学与朱熹基于本原之性的关系伦理学作了比较。她写道（Arghirescu 2022b: 586）[^arghirescu-2022b]：
    step2: |-
