      > 人类擅长……建立关联：取来信息……并看出它如何与其他信息相互作用。每当我们遇到新信息，大脑会把它放进一个概念框架，然后设法把它与经历过的其他事物关联起来。大脑是一台巨大的样式探测器……我们的大脑还具备形成类比的能力，……〔进行〕类比推理。我们在老年人身上看到的智慧，正来自……这四样东西：联想、经验、样式识别，以及类比的使用。这就是为什么随着年岁增长，我们收获越来越多的智慧。智慧来自我们见过、经历过的事物之积累，来自我们在那些经验中识别样式的能力，以及我们据此预测未来结局的能力。（如果说这不是智力，那什么才是？）自然，你经历得越多，能调用的智慧就越多……〔老手们〕见证过太多似乎一再循环往复的事情。智慧使你比青年人的生猛火力更快、更有效地处理某些问题。〔总而言之，〕建立关联是学习的基础。要吸纳新信息，我们需要把它与以前见过的东西关联起来。生活经验给我们更多可供建立的关联、更多可供识别的样式（理）。（Levitin 2020, pp. 119–120）[^levitin-2020]
