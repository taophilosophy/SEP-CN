      In 1956, Joseph Needham, originally a chemist, later a historian of Chinese science, made a significant breakthrough by interpreting Zhu’s system in terms of a process philosophy, Whitehead’s organic naturalism. Needham successfully recast much of Zhu’s language in naturalistic rather than metaphysical terms. The cultural, moral dimension of Needham’s account has been developed by Cheng-ying Cheng and John Berthrong while the scientific dimension has been examined by Yung Sik Kim. In the 1980s, A.C. Graham offered the most insightful and apt account of Zhu’s terminology and pattern of thought in, “What Was New in the Ch’eng-Chu Theory of Human Nature?” and other writings. Graham showed decisively that the term *li* refers to an embedded contextual “pattern”, rather than to any sort of abstract form or principle. He reminded us that the term *li* never figures in propositions or logical sequences, as would be natural for “principle”. Rather, *li* are always conceived as structuring, balancing, modulating, guiding phenomena, processes, reflection and human discernment and response. For example, one never finds moral syllogisms in Zhu Xi’s writings. Many of Zhu’s discussions thus concern moral emotional intelligence: attunement, sensitivity, discernment, and response. Joseph Adler views *li* as indicative of an “ordering” tendency that may be manifested as “pattern” or as “principle” in differing contexts. (We might say that people devise principles in the light of observed patterns.) Adler also examines the key roles played by the *Book of Change* and Zhou Dunyi in the formation of Zhu’s thought, and joins Thomas Wilson and Hoyt Tillman in showing the extent to which Zhu re-visioned, revised, and recast the Confucian Way. Adler shows how Zhu made Zhou Dunyi a pivotal figure in the succession of the Confucian Way while Wilson is interested in Zhu’s account of the Way as a sort of educational-ideological revision, and Tillman is interested in how Zhu’s account of the Way eventually outlasted other competing versions that might have offered more practical and liberal openings in late imperial China.
    step1: |-
      1956 年，原本学化学、后为中国科学史家的 Joseph Needham 作出了重要突破：以过程哲学——怀特海的有机自然主义——诠释朱熹的体系。Needham 成功地把朱熹的许多语言改写为自然主义的而非形而上学的语言。Needham 阐释的文化与道德维度，由成中英与 John Berthrong 加以发展；其科学维度则由金永植考察。八十年代，A.C. Graham 在〈程朱人性论何者为新？〉（What Was New in the Ch'eng-Chu Theory of Human Nature?）及其他著述中，对朱熹的术语与思想样式给出了最具洞见、最为贴切的说明。Graham 决定性地表明：理一词指的是一种嵌入语境的「样式」，而非任何形式的抽象型相或原理。他提醒我们：理从不出现在命题或逻辑序列中——若是「原理」一语本应如此；理总是被构想为在结构化、平衡、调节、引导现象、过程、反思以及人的明察与回应。例如，人们在朱熹的著述中从找不到道德三段论。朱熹的许多讨论因此关乎道德情感智力：调适、敏感、明察与回应。Joseph Adler 把理视为一种「秩序化」倾向的指示——在不同语境中可显现为「样式」或「原理」。（我们或许可以说：人们是依据观察到的样式来制定原理的。）Adler 还考察了《易经》与周敦颐在朱熹思想形成中的关键作用，并与 Thomas Wilson 和 Hoyt Tillman 一起，显示朱熹在多大程度上重新构想、修订并重塑了儒家之道。Adler 显示朱熹如何把周敦颐立为儒家之道传承中的枢纽人物；Wilson 关心的是朱熹对道的叙述作为一种教育—意识形态的修订；Tillman 关心的则是朱熹的道之叙述如何最终胜过其他竞争性的版本——那些版本本可能为帝制晚期中国提供更实用、更开放的选项。
