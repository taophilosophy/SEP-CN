      Zhu also applies this *li* pattern creatively to number, speech, objects, and games. According to this pattern, “One complements two”, “above forms” complements “within forms”. Any word will bear its semantic complement within.[^note-19] And, this object before your eyes has its complements of back, front, top, and bottom. Moreover, each side has its complement…. Any single thing bears its complement within.[^note-20] For example, the paths on a checkerboard form series of complementary pairs. In the end, when only one path remains open and it seems that no other complement remains, this very path still complements the 360 other paths.[^note-21] This is called a ‘one-many complement’, like the ‘Way-implement complement’ (*Zhuzi yulei*, *juan* 95).
