      *Li* also structure the human mind, thought, and language, such that human beings are predisposed to grasp and attempt to respond appropriately to the things and situations they encounter.[^note-7] Objective learning on this view can be understood as a facet of self-learning: indeed, by the principle of continuity, objective understanding enhances self-understanding, for by comprehending the warp and woof of the outer *li* of things, one gains insight into the inner *li* constituting one’s mind and character (Qian Mu 1971: II 31–38)[^qian-1971]. For Zhu Xi, while *li* structure the mind, thought, and language, this is not just at the cognitive level: *li* also structure the inner patterning (*xing*) and basic impulses that predispose us to have characteristically human emotions (*qing*), relationships, and responses (*ganying*) under various sets of conditions (Graham 1986a: 152–154; Qian Mu 1971: II. 25–30)[^qian-1971][^graham-1986a]. In Zhu’s Confucian view, *li* and *xing* predispose one to be sensitive and responsive; metaphorically, they provide the hardware of human nature. Self-cultivation and moral reflection are the means by which one actively conditions and fine-tunes these predispositions of sensitivity and response. They thus function as indispensable software for cultivating personhood.
    step1: |-
      理也结构着人的心灵、思想与语言，使人类天生就倾向于把握其所遇之物与情境，并试图作出恰当回应。[^note-7]据此，客观的学习可以理解为自我学习的一个侧面：确实，由连续性原理，客观的理解会增进自我的理解——因为领会了外在的物之理的经纬，人就洞悉了构成自己心灵与品格的内在之理（Qian Mu 1971: II 31–38）[^qian-1971]。在朱熹看来，理虽然结构着心灵、思想与语言，但这不只是在认知层面：理也结构着内在的样式（性，*xing*）与基本冲动，使我们在各种条件组合下产生典型的人之情（*qing*）、关系与回应（*ganying*，感应）（Graham 1986a: 152–154; Qian Mu 1971: II. 25–30）[^qian-1971][^graham-1986a]。在朱熹的儒家观点中，理与性使人天生敏感而能回应；打个比方，它们提供了人性的硬件。修养与道德反思则是人主动调适并微调这些敏感与回应禀赋的手段；它们因而是培养人格不可或缺的软件。
