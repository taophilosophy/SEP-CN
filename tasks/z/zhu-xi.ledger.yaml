    source: |-
      Zhu Xi, the preeminent Neo-Confucian (*daoxue*) master of the Southern Song (1126–1271), is generally ranked as second only to Confucius (551–479 BCE) in influence and as rivaling Zhuangzi (fourth century BCE) in philosophic acumen in the Chinese philosophical tradition. A leading scholar and classicist as well as sharp intellect and devoted practitioner, Zhu Xi worked out a philosophically compelling synthesis of the ideas of the Northern Song (960–1126 CE) masters Zhou Dunyi (1017–73), Zhang Zai (1020–77), and the brothers Cheng Yi (1033–1107) and Cheng Hao (1032–85). Intriguingly, his idea of a holistic synthetic approach itself may have been inspired in part by Huayan Buddhism (Ivanhoe 2000: 47–49)[^ivanhoe-2000].[^note-1] Over time, Zhu Xi’s Neo-Confucian synthesis proved to be a potent philosophic catalyst for his intellectual supporters and opponents alike, until the fall of Imperial China in 1911 and beyond. His influence gradually extended to Korea, Japan, and Vietnam, as well, each of which adapted his thought along with the Confucian classics and traditions in its own distinctive way. Besides synthesizing key Northern Song Neo-Confucian ideas, Zhu researched and reflected on the received *Five Classics* (*Changes, Odes, History, Rites*, and *Spring and Autumn Annals*), and compiled, edited, and commented on a compendium of essential Confucian texts, the *Great Learning* (*Daxue*), the *Analects* (*Lunyu*) of Confucius, the *Book of Mencius* (*Mengzi*), and the *Doctrine of the Mean* (*Zhongyong*), titled the *Four Books* (*Sishu*). He also prepared an edition of the *Songs of the South* (*Chuci*) that he recommended be appended to the *Odes*.
    step1: |-
      朱熹是南宋（1126–1271）最杰出的新儒家（道学，*daoxue*）大师，人们通常认为，就影响力而言，他在中国哲学传统中仅次于孔子（前 551–前 479），在哲学锐思方面则可与庄子（公元前 4 世纪）比肩。朱熹既是领先的学者与经典学者，又是敏锐的思想者与虔诚的实践者，他构造出一个在哲学上令人信服的综合体系，融汇了北宋（960–1126）诸位大师的思想：周敦颐（1017–73）、张载（1020–77）与程颐（1033–1107）、程颢（1032–85）兄弟。耐人寻味的是，他这种整体性取径的观念本身，部分可能受到华严宗佛教的启发（Ivanhoe 2000: 47–49）[^ivanhoe-2000]。[^note-1]随着时间推移，朱熹的新儒家综合对他思想上的支持者与反对者同样都是一种有力的哲学催化剂，其影响一直延续到 1911 年帝制中国覆灭之后。他的影响还逐渐扩展到韩国、日本与越南，各地都以自己独特的方式，将他的思想与儒家经典与传统一并吸收。除了综合北宋新儒学的关键观念之外，朱熹还研究并反思了传世的五经（《易》《诗》《书》《礼》与《春秋》），并编纂、校订、注解了一部儒家核心文本汇编——四书（《大学》《论语》《孟子》《中庸》）。他还整理了一种《楚辞》本子，建议将其附于《诗经》之后。
