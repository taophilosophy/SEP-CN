      朱熹发展了一套关于人的基本禀赋（性，*xing*）的理论，用以同时解释人为恶的可能与人为善及可臻完善的可能。依照这一理论，他（承孟子，前 372–前 289）坚持人性本善（善意待人与敏于他人之苦），同时接受每个人的基本气质受其特定的气禀（天生才具，*qizhi*）、家庭与社会环境及其他因素的制约。这些因素共同塑造其经验人格、智力与精神伦理修养的资质。朱熹承认，由于气禀与环境等的个体差异，人的气质、品格以及伦理修养与体认的资质确实存在实际差别。此外，他论证说，人会变坏乃至为恶，原因例如可以是粗糙或感官化的气禀、冷酷亲人与朋友的坏影响、自私或严酷的社会环境、残忍的性情倾向等等。尽管如此，他承孟子而坚定相信：凡真诚献身于道德修养、热忱践行道德的人，纵使未必成圣，也必会在道德体认上取得进步。
