      Zhu conceptualized nature and natural phenomena in terms of *li* (pattern, patterning) and *gewu* (the investigation of things), *qi* (primal vapor), *yin-yang*, *wuxing* (five phases), *shu* (number, probability, ratio), *xiang* (images); figures from the *Book of Changes*), ghosts and spirits (*gui-shen*), heaven and the sage (*tian-shengren*), stimulus-response (*ganying*), and transformation and change (*bianhua*). In this context, it was important to treat *li* matter-of-factly as the intrinsic patterning of things and events. While the *li* involved with the identities of things are those facets of intrinsic patterning that pertain to their basic interactive propensities and functions, the *li* of a concrete thing form “a gestalt totality” (Kim 2000)[^kim-2000], nearly as complex as the thing itself. Thus, whereas scholars tend to take Zhu’s assertion that “for a certain (kind of) thing to exist, there first must be that *li*” or “there must be this *li* for there to be that (kind of) thing” as indicative of a metaphysical principle of sufficient reason, in this context *li* simply affirm that things of identifiable kinds bear identifying patterns (*xing*) that make them what they are and interact as they do. *Li* indicate reference points for identities of things that influence their typical patterns of interaction with other things. *Li* thus conceived do not amount to principles of explanation and are more involved with definition, so references to the *li* of phenomena do not add anything cognitive or scientific.[^note-16] At times, Zhu did present the idea of investigating things in chapter 5 of the *Great Learning* (*Daxue*) as involving a step-by-step approach, with an eye to discerning ever higher levels of commonality among the myriad *li* (patterns), aiming at an ultimate comprehension of the most basic form of pattern, *taiji* (supreme polarity). Although this approach lacks the rigor of a logical categorical system, when viewed together with Zhu’s comments on Zhou Dunyi’s *Diagram of the Supreme Polarity* (*Taiji tu*), it is suggestive for viewing phenomena and forms in a developmental, almost evolutionary context. As Needham comments:
    step1: |-
      朱熹以理（样式、条理）与格物（格物）、气（原初之气）、阴阳、五行（*wuxing*）、数（*shu*，数、概率、比率）、象（*xiang*；《易经》之卦象图形）、鬼神（*gui-shen*）、天与圣人（*tian-shengren*）、感应（*ganying*）、变化（*bianhua*）这些概念来构想自然与自然现象。在这一语境中，重要的是把理当作事物与事件内在条理来平实地处理。与事物的同一性相关的理，是其基本互动禀性与功能方面的内在条理；一个具体事物的理构成「一个格式塔整体」（Kim 2000）[^kim-2000]，其复杂程度几乎不亚于该事物本身。因此，学者们往往把朱熹「必有一理，方有此（类）物」或「有此理，方有彼（类）物」的断言，理解为一种充足理由的形而上学原理；而在此语境中，理只是表明：可辨识种类的物带有标识性的样式（性），正是这些样式使物成为其所是、并如其那样互动。理指示着事物的同一性的参照点，这些参照点影响事物与他物互动的典型样式。如此构想的理并不构成解释原理，而更多与定义相关；因此，诉诸现象之理并不增加任何认知或科学的内容。[^note-16]有时，朱熹确实把《大学》第五章中的格物观念呈现为一种循序渐进的取径，着眼于在万理（样式）之中辨别越来越高的共同性层级，以求最终领悟最基本的形式——太极（*taiji*，最高极性）。这一取径虽缺乏逻辑范畴体系的严格性，但若与朱熹关于周敦颐《太极图》（*Taiji tu*）的评注合观，它提示了一种发展性的、近乎演化式的视角来观照现象与形式。Needham 评述道：
