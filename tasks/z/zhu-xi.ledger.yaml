      A final reason why Zhu Xi’s ideas of *li* and *qi* ought to be taken as horizontal and not vertical complements, that is, as a complex unity and not as a metaphysical duality, is found when Zhu makes two seemingly contradictory claims about *li* and *qi*: (1) *Li* is prior to *qi.* 2) *Li* is not present apart from *qi* formations. Whereas 1) is usually regarded as a positive metaphysical claim, it means rather that *li* in this sense refers to “permanent possibilities of *qi* formation”. For example, for any particular *qi* formation to have come about, it had to have been possible for the *qi* constituents to combine in that particular way to yield those properties and capacities.[^note-24] Whereas (2) is often taken to mean that *li* subsist until instantiated, it means rather that *li* are the patterning of real processes and things; they exist immanently in processes and things, though they can be analyzed and discussed separately from their real contexts. This is why, methodologically, Zhu insists that learners acquaint themselves with the *li* of things, processes, affairs, ethics, etc., by examining actual things, processes, phenomena, etc. He regards the study of *li* in abstraction from phenomena to be wooden, hollow, empty, etc. Hence, Zhu’s claims (1) and (2) and his methodological strategy all indicate that, for him, the relation of complementarity between *li* and *qi* is essentially horizontal.
    step1: |-
      朱熹的理气观念应当被理解为横向而非纵向的互补——即一个复杂统一体而非形而上学的二元论——最后一个理由在于：朱熹对理与气作过两条看似矛盾的断言：其一，理先于气；其二，理不离气之构形而存在。其一通常被视为一个肯定的形而上学主张，但它毋宁是说：在此意义上的理指的是「气之构形的恒常可能性」。例如，任何一个特定的气之构形要发生，气的构成成分必须*有可能*按那一特定方式组合，以产生那些性质与能力。[^note-24]其二常被理解为理在被例示之前即已持存；它毋宁是说：理是真实过程与事物的条理化；理内在地存在于过程与事物之中，尽管可以被分析并脱离其实际语境来讨论。这就是为什么在方法上，朱熹坚持学习者应当通过考察实际的事物、过程、现象等来认识事物、过程、事务、伦理等的理。他认为脱离现象来研究理是刻板的、空洞的、空疏的。因此，朱熹的断言一、断言二及其方法策略都表明：在他看来，理与气的互补关系本质上是横向的。
