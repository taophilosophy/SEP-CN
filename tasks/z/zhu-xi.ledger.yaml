      Under this premise, Zhu cites Confucius’ advice to Yan Hui, “Master the self by practicing ritual propriety” (*Analects* XII.1). For Zhu Xi, one masters oneself to rein in one’s naïve self-centeredness by paying ritual respect to others, which in turn spurs a change in the axis of one’s moral concern to other people, especially those with whom one is related and daily interacts. What is important, then, is *the moral-ethical axis of one’s motivations*. But, how is one to sustain and manifest this humanity consistently in attitude and practice? Zhu Xi does not appeal to philosophic reflection but recommends mindful (*jing*) daily cultivation and practice, i.e., being calm and focused, respectful in personal life, diligent in conducting affairs, and dedicated to upholding interpersonal relations.[^note-14] Moreover, he considers that the emotions play a fundamental role in ethical cultivation and performance. After stressing serving one’s parents with filiality and one’s elder brother with fraternal respect, Zhu Xi urges: “Be loving in dealing with all things.” which goes well beyond standard filtered and restrained “graded” Confucian love.
    step1: |-
      在这一前提下，朱熹援引孔子对颜回的告诫：「克己复礼」（*Analects* XII.1）。对朱熹而言，克己是为了约束人天真的自我中心：以礼敬待人，这又反过来促使人的道德关切之轴转向他人，尤其是与自己有关系、日常互动的人。重要的于是是*动机的道德—伦理之轴*。但是，人如何能在态度与实践中持续地体现并显现这种仁？朱熹不求助于哲学反思，而是建议以敬（*jing*）作日用的修养与实践：即平和而专注，居处恭，执事敬，与人忠。[^note-14]此外，他认为情感在伦理修养与践行中起着根本作用。在强调以孝事亲、以悌敬兄之后，朱熹敦促：「泛爱众」。这大大超出了标准的、经过过滤与节制的「差等」儒家之爱。
