      Throughout his career, Zhu Xi focused on the twin problems of 1) determining the conditions of moral agency, and 2) setting forth a viable program of moral self-cultivation on that basis. Zhu saw moral agency as the expression of a moral will, which he understood to be the achievement of an inner self-mastery (*zhuzai*) that forms the core of one’s moral character, perceptivity, cognizance, and responsiveness. On this view, self-cultivation that is aimed at nurturing self-mastery must include forming a concentrated, reverential mind-set (*jing*) and a discerning sense of appropriateness. Early on, Zhu had emphasized the need to attain a working knowledge of the constitutive patterning (*li*) of reality and society in the light of which the norms and ritual action (*li*) prescribed for proper interpersonal relationships and intercourse are devised. He later found that establishing the determination (*lizhi*) to seek self-realization and conduct oneself appropriately counted for as much as the long-term cultivation process itself, during which one can lose sight of one’s purpose and be side-tracked (see Qian Mu 1986: 123–127)[^qian-1986]. Moreover, while still maintaining the importance of the norms and ritual action for character-building and the social order, Zhu began to emphasize the need to build up a sympathetic but realistic grasp of the warp and woof of actual daily human life viewed in the perspective of such broad Confucian ethical ideals as humaneness (*ren*) and fairness (*gong*). He understood that, although the norms and ritual action are broadly applicable and reliable, many situations call for specifically tailored responses.[^note-4]
    step1: |-
      纵观其学术生涯，朱熹始终聚焦两个孪生问题：其一，确定道德行动者的成立条件；其二，在此基础上提出一套可行的道德自我修养方案。朱熹把道德行动视为道德意志的表达；他把道德意志理解为内在自我主宰（*zhuzai*）的成就，而主宰构成一个人道德品格、感知力、认知与回应能力的核心。据此，以涵养主宰为目标的修养，必须包括形成专注而敬畏的心态（敬，*jing*）与明辨适宜之感。早期，朱熹强调需要获得对现实与社会的构成性条理（理，*li*）的实用认识；人际关系的规范与礼仪行动（礼，*li*）正是据此而制定的。后来他发现，确立求自我实现与正当行事的立志（*lizhi*），其分量不亚于长期的修养过程本身——在这一过程中，人可能迷失目标、误入歧途（见 Qian Mu 1986: 123–127）[^qian-1986]。此外，虽然仍然坚持规范与礼仪行动对品格塑造与社会秩序的重要性，朱熹开始强调：需要以仁（*ren*，humaneness）与公（*gong*，fairness）这类宽广的儒家伦理理想为视角，建立起对日常生活经纬的同情而切实的把握。他明白，规范与礼仪行动虽然大体适用且可靠，许多情境却要求专门裁制的回应。[^note-4]
