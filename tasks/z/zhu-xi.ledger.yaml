      Consequently, against the moral intuitionism prevalent at the time in Neo-Confucianism, as espoused by his teacher Li Tong (1093–1163), his intellectual rival Lu Jiuyuan (1139–1193), and others, Zhu argued that intuitionism is inadequate for dealing effectively with the complex human affairs that people are apt to encounter in their lives.[^note-5] Rather, he advocated devoting oneself to the observation and study of the patterning/patterns (*li*) of relationship, interaction, and change among all things, among human beings in particular. He regarded “investigating things to extend knowledge” as the surest way to deepen and broaden one’s discernment of the patterns that constitute the lived-world. Such knowledge, importantly, would sharpen one’s sense of appropriateness by attuning oneself to the actual, subtle, distinguishing features of particular situations.
    step1: |-
      因此，与当时新儒家中盛行的道德直觉主义——其倡导者包括他的老师李侗（1093–1163）、思想对手陆九渊（1139–1193）等人——相对立，朱熹论证说：直觉主义不足以有效处理人们生活中容易遇到的复杂人事。[^note-5]相反，他主张献身于观察与研究万物之间——尤其是人与人之间——关系、互动与变化的条理（理）。他把「格物致知」视为深化与拓展自己对构成生活世界之条理的明察的最可靠途径。重要的是，这样的知识能使人调适于具体情境中实际存在的、细微的辨别特征，从而磨砺人的适宜之感。
