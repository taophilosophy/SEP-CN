      Why did Zhu Xi go to the trouble of constructing his elaborate system and making and discussing all these observations if they didn’t carry him beyond common sense to a deeper and more accurate perception and account of reality, to go beyond the details of particular cases to more general principles and truths? Zhu’s ultimate purpose was pragmatic rather than epistemic; that is, he was laying out the concepts, framework, and practices that he deemed most conducive to self-cultivation, self-realization, and ethical practice, rather than formulating objectively accurate concepts, systems, and methods for ascertaining objective truths about the world. So, he did not have a practical interest in pushing his inquiries in purely scientific directions. But, this way of putting it is not completely right because Zhu had considered a variety of philosophic positions and did think he had selected the best and most accurate of the concepts and systems at his disposal. And, he did attempt to render his ideas in a manner that was faithful to reality, the devotion to which was one of his core cultivation themes.[^note-17] Clearly, he did not have the requisite concepts, framework, or style of thinking through which to conceive the world under overarching scientific principles and abstract generalities.
    step1: |-
      既然这些观察与讨论并没有把朱熹带出常识，去获得对实在更深、更准确的知觉与说明；既然它们没有越出个别案例的细节而抵达更一般的原理与真理——他为何还要费心构造其精巧的体系、作出并讨论所有这些观察？朱熹的终极目的是实用的而非认识的：也就是说，他铺陈的是他认为最有利于自我修养、自我实现与伦理实践的概念、框架与实践，而不是制定客观准确的概念、体系与方法去确证关于世界的客观真理。所以，他没有把探究推向纯科学方向的实践兴趣。但这样说并不完全对：因为朱熹考虑过多种哲学立场，也确实认为自己在可用的概念与体系中选出了最好、最准确的那些；而且，他确实力求以忠于实在的方式表达他的观念——这种忠于实在正是其修养主题之一。[^note-17]显然，他没有那种必要的概念、框架或思维方式，无法在统摄性的科学原理与抽象的普遍性之下构想世界。
