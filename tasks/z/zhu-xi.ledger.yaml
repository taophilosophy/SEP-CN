      > Chu Hsi [Zhu Xi] wrote:
      >
      > > If one peers into the mystery, the *thai chi* [*taiji*, supreme polarity] seems a chaotic and disorderly wilderness lacking all signs of an arranger…, yet the *Li* (fundamental pattern) of motion and rest, and of Yin and Yang, is fully contained within it.
      >
      > Innumerable smaller organisms were also contained within it, and indeed composed it. Some of them more highly organized than others. In fact, the world was no more undifferentiated for the Neo-Confucians than for modern organic philosophy; it manifested a series of integrative levels of organization, wholes at one level being parts on the next. A clear statement of this conception appears in the ninth paragraph of the *Thai chi Thu Shuo* [Explanation of the diagram of the supreme polarity], which indicated the inapplicability of categories outside the level to which they belong. (Needham 1956a: 466)[^needham-1956a]
