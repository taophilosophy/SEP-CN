      Zhu Xi’s appropriateness approach to ethics has several distinct features. First, one is to be well-versed in the received norms and rituals that circumscribe interpersonal relationships and prescribe proper behavior in family and society. Second, one is to have made ample observations and responses in real life situations. Third, one is to have examined and reflected on ways in which others act and respond in situations, for reference. Fourth, through extensive observation and experience, one is to be cognizant of the range of considerations that come into play in real life situations: moral principle, utility, fairness, sympathy, compassion, and so forth.[^note-12] Fifth, one is to remain flexible and open-minded as well as avoid making surmises, being insistent, stubborn, or self-centered (*Analects* 9.4). According to this view, while observing the ethical norms and rules of thumb in his or her community, the moral adept possesses a store of personal ethical sensitivity, responsiveness, and resourcefulness, by which to fashion the most fitting responses to situations.
