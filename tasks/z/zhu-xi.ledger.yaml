      While this original nature is the ground of sympathy and responsiveness, Zhu Xi advocates conducting the “investigation of things to attain/extend knowledge” (*gewu zhih* = *zhi*) for achieving perspicacity (*ming*) in ethical judgment and ‘appropriateness’ (*yi*) in moral practice. Zhu advocates this methodology to underscore the need for people, as prospective moral agents, to notice the fine details, the distinguishing features of particular situations in order to to fashion on that basis the most discerning, appropriate responses. These distinguishing features can suggest alternative moral considerations to be weighed (Pincoffs 1986)[^pincoffs-1986]. This call lay behind Zhu’s promotion of the *Great Learning* (*Daxue*) and his devotion to life-long learning and moral reflection in a bid to achieve fairness and objectivity in moral judgment and response, and break free of the moral intuitionism and resultant subjectivism typical of Neo-Confucians of his generation.
    step1: |-
      本原之性固然是同情与回应的根据，但朱熹主张行「格物致知」（*gewu zhizhi*，格物致知）以求伦理判断的明察（*ming*）与道德实践的「适宜」（义，*yi*）。他倡导这一方法论，是要强调：作为准道德行动者的人必须注意细微之处，注意具体情境的辨别特征，以便在此基础上形成最有明察力、最适宜的回应。这些辨别特征可以提示出需要权衡的其他道德考量（Pincoffs 1986）[^pincoffs-1986]。朱熹之所以提倡《大学》并毕生致力于学习与道德反思，正是为了这一呼吁：在道德判断与回应上求得公平与客观，摆脱他那一代新儒家典型的道德直觉主义及其导致的主体主义。
    step2: |-
