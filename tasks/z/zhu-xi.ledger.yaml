      As to textual grounds, Wang and Dai argued that Zhu was so enamored of his metaphysics of pattern and *qi* that he constantly read them into the classical texts. For example, Dai said Zhu blandly associated Confucius’ term *tian* (heaven) with his own notion of *li* (pattern), quoting *Analects* 11:9 where Confucius, in sorrow over the death of his disciple Yan Hui, cried that “Heaven has forsaken me”. Dai questioned how Zhu Xi could reasonably claim that Confucius was crying that *li* had forsaken him? Critics tend to find this counter-intuitive example of Dai’s against Zhu’s approach to be compelling. However, consulting Zhu’s original commentary, we find that he noted that this phrase was not literally about heaven but rather expressed Confucius’ utmost sorrow, that Confucius felt Yan Hui’s death as if it was his own son’s, without mentioning “pattern”. This example does not support Wang and Dai’s claim in the least. It illustrates that Zhu’s commentary was nuanced and sensitive to pragmatic, situational usages despite his penchant to see his own notion of “pattern” in some of Confucius’ usages of “heaven”. Moreover, as the intellectual historian Daniel Gardner shows, Zhu’s commentary was not intended as simply a glossary with comments. It was intended as a guide to self-cultivation. Hence, Zhu sometimes recast passages in the *Analects* more generally to show their broader implications for self-cultivation and realization, often with the isolated countryside student in mind. Gardner shows how Zhu had effectively enriched the text as a tool for self-cultivation whereas earlier commentaries of the Han and Tang dynasties had just given glosses necessary for answering examination questions.
    step1: |-
      在文献方面，王氏与戴氏争论说：朱熹太醉心于自己的理气形而上学，以致不断把它们读进古典文本。例如，戴震说朱熹轻率地把孔子的天（*tian*）概念与自己的理（条理）概念相连，并引《论语》11:9——孔子因弟子颜回之死而悲恸，哭喊「天丧予」。戴氏质问：朱熹怎么能有理地说，孔子是在哭喊理丧予？批评者们往往觉得戴氏这个反直觉的例子对朱熹的取路有说服力。然而，查核朱熹的原注，我们发现他指出：这句话并非字面上关于天，而是表达了孔子极度的悲伤——孔子感到颜回之死如同丧己之子——全然未提「理」。这个例子丝毫不支持王氏与戴氏的主张。它说明：朱熹的注疏是细腻而敏感于语用与情境用法的，尽管他确实偏好在孔子的某些「天」的用法中看出自己的「理」。此外，正如思想史家 Daniel Gardner 所示，朱熹的注疏并不打算做一部附注的词汇表；它打算做一部修养指南。因此，朱熹有时把《论语》中的段落更一般化地改述，以显示其对修养与体认的更广意涵——心中常想着僻居乡野的学生。Gardner 显示：朱熹实际上把文本丰富为修养的工具，而汉唐的早期注疏只给出回答考试问题所必需的训诂。
