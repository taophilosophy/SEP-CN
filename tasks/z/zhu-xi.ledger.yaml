      Soon thereafter, after undertaking a careful study of Zhu’s dialogues (*Zhuzi yulei*), Hu Shih presented Zhu’s method of inquiry, *gewu zhizhi* (investigate things to attain knowledge) as essentially a process of “hypothesis and verification by evidence” (Chan 1989: 566)[^chan-1989], consistent in spirit with a scientific approach to inquiry. Needham and Hu effectively cast Zhu’s thought and method in a new light, as more creative, scientific, holistic, and practical than previously thought. Since then, many have discussed Zhu as a process thinker, but little has been written to consider the extent to which his system could accommodate a scientific worldview, and the extent to which his method of inquiry was consistent with a scientific approach. Yung Sik Kim offers an in-depth inquiry into the extent to which Zhu Xi anticipated genuine scientific methods of observation and conceptualization in *The Natural Philosophy of Chu Hsi* (2000).
    step1: |-
      此后不久，胡适在仔细研究朱熹的语录（《朱子语类》）之后，把朱熹的探究方法——格物致知（investigate things to attain knowledge）——呈现为本质上一个「假说与以证据检验」的过程（Chan 1989: 566）[^chan-1989]，精神上与科学的探究取径一致。Needham 与胡适实际上把朱熹的思想与方法投射到了新的光线下：比以往所认为的更有创造性、更科学、更整体、更实用。从那以后，许多人把朱熹当作过程思想家来讨论；但关于他的体系能在多大程度上容纳一种科学的世界观、他的探究方法在多大程度上与科学取径相一致，却很少有论著认真考量。金永植在《朱熹的自然哲学》（2000）中，对朱熹在何种程度上预示了真正的科学观察与概念化方法，作了深入探究。
