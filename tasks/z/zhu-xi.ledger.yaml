  - id: 5
    kind: body
    source: |-
      A renowned teacher in later life, Zhu taught the classics and Neo-Confucian thought and practice to hundreds if not thousands of students. His oral discourses and discussions are preserved in the *Classified Dialogues of Master Zhu* (*Zhuzi yulei*), and his poetry, essays, correspondence, and other prose works are collected in the *Collected Works of Master Zhu* (*Zhuzi wenji*). He also published critical, annotated editions of several classics, including the *Book of Change* (*Yijing*) and the *Book of Odes* (*Shijing*), essential works of Neo-Confucianism, including by Zhou Dunyi, Zhang Zai, and the Cheng brothers, and a vital Neo-Confucian anthology, *Reflections on Things at Hand* (*Jinsilu*). He also edited and annotated an important early text of inner alchemy Daoism; the *Cantong qi* (*Unity of the Three*) by Wei Boyang (3ʳᵈ cent. CE), which combines the cosmology of the *Yijing* and the Daoist teaching of *wuwei* (non-intentional action) with inner alchemy. Zhu Xi remained devoted to his spiritual and intellectual work virtually to his last breath, pondering and discussing problematic passages in the *Great Learning* during the last several days of his life. Throughout his life, Zhu Xi sought to reestablish the fundamental concepts and values of Confucianism to restore China’s cultural and political integrity as a Confucian society, especially since people in search of spiritual guidance and solace were increasingly looking to Daoism and Buddhism rather than Confucianism, which was perceived as a state ideology and orthodoxy and had lost spiritual and ethical purchase in their eyes. Moreover, Zhu believed that the empire needed the spiritual *élan* of Confucius’ original ethical ideas and values to meet the challenge of barbarian encroachments in culture as well as land. His own sincere patriotism, commitment to the tradition, and devotion to learning and scholarship have remained an inspiration to this day around East Asia and throughout the world.
    step1: |-
      朱熹晚年是负有盛名的教师，向数百乃至数千学生讲授经典与新儒家的思想与实践。他的讲论与问答保存在《朱子语类》中；其诗、文、书信及其他散文作品则收于《朱子文集》。他还刊行了几部经典的校勘注释本，包括《易经》与《诗经》，以及新儒家的几部要籍——周敦颐、张载与二程的著作——和一部重要的新儒家选本《近思录》。他还编注了道教内丹学的一部重要早期文本：魏伯阳（公元 3 世纪）的《参同契》，此书把《易经》的宇宙论与道家无为（非刻意行动）之教同内丹术结合在一起。朱熹几乎至死都在尽力于他的精神与思想工作：生命的最后几天仍在思考与讨论《大学》中的疑难段落。纵观一生，朱熹致力于重建儒家的根本概念与价值，以恢复中国作为儒家社会的文化与政治完整；尤其是，当时寻求精神指引与慰藉的人们越来越转向道教与佛教，而非被视作国家意识形态与正统、在他们眼中已失去精神与伦理感召力的儒学。此外，朱熹认为，帝国需要孔子原本伦理观念与价值的精神活力，以应对文化与人地两方面的夷狄侵凌。他自己真诚的爱国情怀、对传统的担当以及对学问的献身，至今仍是东亚乃至全世界的灵感源泉。
