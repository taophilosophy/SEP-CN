      In his watershed essay, *A Treatise on Humanity* (*Renshuo*), Zhu Xi discourses on the classical Confucian teaching of humanity (*ren*) in a unified cosmic and human perspective. In concluding, he criticizes alternative accounts of humanity, i.e., Confucius’ spirit of humaneness, on various conceptual and ethical grounds.[^note-13] Following the early Han tradition, Zhu opens by associating humaneness with cosmic creativity. In its most basic manifestation, humaneness is characterized as the impulse of “heaven and earth” (the cosmos) to produce things. By extension, this impulse yields the cycle of seasons and the pervasive fecundity of nature. Advocates of this doctrine had found confirmation in the rich, productive Chinese soil and temperate climate, which supported their assumption that nature was generally fertile and afforded the right conditions for human flourishing. Pervasive, the impulse to produce appears in each and every one of the myriad creatures while in human beings it is refined into the virtue of “humaneness”, which, when fully realized, involves one’s caring attitude and dedicated responsibility toward others. Zhu Xi moreover correlates “origination, growth, flourishing and firmness”, the fourfold initial stages of creativity and production in the cosmos and human nature first mentioned in early commentaries on the *Book of Change*, with humaneness, appropriateness, ritual conduct and wisdom, the four cardinal virtues enunciated by Confucius. Zhu Xi thus portrays the fully cultivated person as at once a complement to heaven and earth, a vital participant in cosmic creativity, and a catalyst for the flourishing and self-realization of others. On this basis, he goes on to formulate the definition of *ren* (humanity, humaneness) for the subsequent tradition: “the essential character of mind” and “the essential pattern of love.” The virtue of humaneness thus grounds the disposition of mind as commiserative and describes the core of moral self-realization as love for others (other-directed concern), to be appropriately manifested.
    step1: |-
      在其里程碑式的论文《仁说》（*Renshuo*）中，朱熹在统一的宇宙与人的视角下，阐发古典儒学关于仁（*ren*）的教诲。文章结尾处，他从概念与伦理两方面批评了关于仁的其他解说，也就是批评对孔子仁之精神的种种替代性诠释。[^note-13]承汉初传统，朱熹开篇即把仁与宇宙的创生力相连。仁在其最基本的显现中，被刻画为「天地」（宇宙）生成万物的冲动。推而广之，这一冲动带来四季的循环与自然无处不在的生殖力。这一学说的倡导者在中国肥沃多产的土壤与温和的气候中找到了佐证；这种环境支持了他们的假定：自然大体上是丰饶的，为人类的昌盛提供了合适的条件。这种生成冲动无处不在，显现于每一种造物之中；而在人身上，它被精炼为「仁」这一德性。仁得到完全实现时，包含人对他人关怀的态度与专心的责任。此外，朱熹把「元、亨、利、贞」——最早见于《易经》早期注疏的宇宙与人性中创生与生成的四个初始阶段——与孔子阐发的四种核心德性仁、义、礼（礼之践行）、智相配。于是朱熹把充分修养之人描绘为：既是天地的补位，又是宇宙创生活动的活泼参与者，还是他人昌盛与自我实现的催化剂。在此基础上，他为后来传统给出了仁（humanity，humaneness）的定义：「心之德」与「爱之理」。仁这一德性由此把心灵的状态落实在恻隐之上，并把道德自我实现的核心描述为对他人之爱（他者取向的关怀），以适宜的方式表现出来。
