      Zhu Xi considered the issue of how to tailor responses that would be appropriate in problematic situations under the rubric of *quan* (weighing things up, discretion, expedient means).[^note-8] He noted several kinds of situations in which recourse to discretion and expedient means might be advisable: 1) extraordinary situations that cannot be covered by the standard norms and ritual actions, 2) urgent situations that require a direct violation of the received norms and ritual actions to be satisfactorily resolved, and 3) situations in which it would be more humane and prudent not to observe the relevant norms and ritual actions (see Wei 1986)[^wei-1986]. Situations of the first kind include those that call for a disruption of the given human order, for example the removal of an evil authority figure, such as a psychotic parent or a sociopathic tyrant. For situations of the second kind, Zhu had in mind emergencies when one would have to violate a norm in order to perform an positive emergency action, such as grasping the hand of a drowning sister-in-law, or shoving an old lady out of the path of a runaway oxcart.[^note-9] Finally, the third kind of situation includes those in which it would be more compassionate to waive or overlook the ritual prescriptions, such as in case of condoning the remarriage of a widow who would otherwise be destined to isolation and destitution.
    step1: |-
      如何在有问题的情境中裁制出适宜的回应？朱熹在权（*quan*，权衡、斟酌、权宜手段）这一名目下处理这个问题。[^note-8]他指出了几种可以诉诸斟酌与权宜手段的情形：其一，标准规范与礼仪行动无法涵盖的反常情境；其二，需要直接违反传世规范与礼仪行动才能妥善解决的紧急情境；其三，不遵行相关规范与礼仪行动反而更合乎人道、更为审慎的情形（见 Wei 1986）[^wei-1986]。第一类情形包括需要打破既定人间秩序者，例如罢黜邪恶的当权者，如患精神失常的父亲或反社会的暴君。第二类情形，朱熹心中想的是紧急情况：必须违反规范才能施行积极的救助，例如抓住溺水嫂子的手，或把老妇人推离失控牛车的路径。[^note-9]最后，第三类情形包括：宽免或不顾礼仪规定反而更合乎怜悯者，例如允许一位不然注定孤苦无依的寡妇改嫁。
