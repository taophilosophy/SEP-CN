      Zhu Xi posits an ontological and causal continuity between the celestial and terrestrial realms, as well as between the animal and plant species and humanity. Indeed, there is no categorical difference between human beings and other life forms. Against this backdrop, Zhu carefully observed anomalies and sketched explanations based on the general ideas available to him. For example, when observing fossils of seashells atop a mountain, Zhu noted that the area had once been a seabed and hypothesized that the earth formerly was softer and more fluid and that, through wave motions, this seabed later rose to become a mountain top. Meanwhile, the entire earth dried as it grew older. While this explanation was not rigorous or determinate enough to count as a scientific hypothesis; Zhu appealed only to naturalistic concepts and principles in his comments. Zhu also made quantitative measurements of plant growth. Zhu once heard about a monk’s claim that oould see evidence of the nourishing powers of “night vapor” by observing bamboo sprouts, which grow twice as fast at night as during the day. Later, during a stay at a Buddhist residence on Jade Mountain, Zhu observed that the bamboo sprouts there displayed the “same rate of growth day and night, exactly the opposite of the monk’s claim”. Qian Mu observes that Zhu’s practice of *gewu* (investigating things) was fruitful because he made observations with questions or hypotheses in mind, adding that Wang Shouren’s observations of bamboo had been fruitless and in vain because he had no question or hypothesis in mind to test. Wang was just undertaking bland looking (Qian 1986: 215f, 219)[^qian-1986].
    step1: |-
      朱熹设定了天界与地界之间的本体论与因果连续性，也设定了动植物物种与人类之间的连续性。确实，在他看来，人与其他生命形式之间没有范畴性的差别。以此为背景，朱熹仔细观察异常现象，并基于可得的普遍观念勾画解释。例如，观察到山顶上的贝壳化石时，朱熹指出该地区曾是海底，并假说大地昔日更软更流动，后来经由波浪运动，这片海底隆升为山顶；与此同时，整个大地随年岁增长而干燥。这一解释虽然不够严格、不够确定，够不上科学假说，但朱熹在评论中只诉诸自然主义的概念与原理。朱熹还做过植物生长的定量测量。他曾听说一位僧人的主张：通过观察竹笋可以看见「夜气」滋养之力的证据，因为竹笋夜间的生长速度是白天的两倍。后来，朱熹寓居玉山一处佛寺时，观察到那里的竹笋「昼夜生长速度相同，与僧人所言恰恰相反」。钱穆指出，朱熹的格物实践卓有成效，因为他带着问题或假说进行观察；他还补充说，王守仁对竹子的观察之所以徒劳无功，是因为他心中没有待检验的问题或假说，只是做呆板的观看（Qian 1986: 215f, 219）[^qian-1986]。
