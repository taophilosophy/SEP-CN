      > Humans excel at … making associations, taking information … and seeing how it interacts with other information. Whenever we encounter new information, our brains place it in a conceptual frame and then seek to associate it with other things we have experienced. The brain is a giant pattern detector…. Our brains add to that the ability to form analogies, … [to perform] analogical reasoning. The wisdom we find in older adults follow[s] from … these four things: association, experience, pattern recognition, and the use of analogies. And, this is why we we gain more and more wisdom as we age. Wisdom comes from the accumulated sets of things we’ve seen and experienced, our ability to detect patterns in those experiences, and our ability to predict future outcomes based on them. (And what is intelligence if not that?) Naturally, the more you have experienced, the more wisdom you are able to tap into…. [Old-timers] have been witness to so many things that seem to cycle around again and again. Wisdom enables you to handle some problems more quickly and effectively than the raw firepower of youth. [In sum, m]aking associations underpins learning. To assimilate new information we need to associate it with what we’ve seen before. Life experience gives us more associations to make, more patterns (*li*) to recognize. (Levitin 2020, pp. 119–120)[^levitin-2020]
