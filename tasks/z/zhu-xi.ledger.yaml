      Advances in Zhu Xi studies continue to be made in Zhu Xi studies in the present century. On the one hand, intellectual historians, such as Yingshi Yu, examine Zhu Xi’s historical, political, and cultural backgrounds, as well as his intellectual milieu. Other intellectual historians, such as Hoyt Tilman and Hans van Ess study Zhu Xi’s intellectual collaborators and rivals. Still others, such as Chun-chieh Huang and his colleagues examine the differing receptions and adaptations of Zhu Xi’s thought by Confucian scholars around East Asia. On the other hand, philosophical interpreter Brook Ziporyn has developed a “coherence” reading of *li* (pattern). Drawing on the parallel model of *li* and *shi* in Huayan Buddhism, he views Zhu’s *li* as the organizing, cohering element in *qi* phenomena, writ large and small. Given the intimate connection between *li* and truth in Zhu’s thought, the coherence account of *li* recalls the coherence theory of truth in 20th century Western philosophy. Moreover, in several recemt studies, Diana Arghirescu demonstrates that “principle of coherence” captures the organizing propensity of *li* in ontology as well as in ethics. She explains:
    step1: |-
      本世纪朱熹研究仍在推进。一方面，像余英时这样的思想史家考察朱熹的历史、政治与文化背景，以及其知识环境。另一些思想史家——如 Hoyt Tilman 与 Hans van Ess——研究朱熹的知识合作者与对手。还有另一些学者——如黄俊杰及其同事——考察东亚各地儒者对朱熹思想的不同接受与调适。另一方面，哲学诠释者 Brook Ziporyn 发展了对理（条理）的一种「融贯」（coherence）读法。借助华严佛教中理与事（*shi*）的平行模型，他把朱熹的理看作气之现象中起组织、融贯作用的要素，不论其尺度大小。鉴于朱熹思想中理与真理的亲密联系，理的融贯解读令人回想起二十世纪西方哲学的真理融贯论。此外，在若干新近研究中，Diana Arghirescu 论证：「融贯原则」（principle of coherence）既捕捉了理在本体论中的组织倾向，也捕捉了其在伦理学中的组织倾向。她解释说：
