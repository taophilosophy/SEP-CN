    kind: body
    source: |-
      Notably, from the *Great Learning* Zhu adapted and distilled the methodology of investigating things to extend knowledge while from the *Mean* he stressed attuning oneself to attain utmost propriety. Investigating things incorporated reading and classical studies but ensured one’s practical grasp of and personal resonance with the pulse of life: nature and phenomena as well as society and human relations and concerns (Gardner 1986, 1990)[^gardner-1990][^gardner-1986]. Attuning oneself involved maintaining reverent concentration and conducting mindful reflection and practice. A century later, Yuan dynasty (1271–1368) officialdom adopted Zhu Xi’s edition of the *Four Books* as the basis for the Imperial Examination System, in effect canonizing it until the termination of the imperial examination system toward the end of the Qing dynasty (1644–1911) in 1908. The change from the *Five Classics* to the *Four Books* as the basis of the imperial examination system resulted in a reform and renewal of the Confucian tradition and outlook. It effected a restoration of Confucius’ original concern with personal ethical cultivation, realization, and practice from the more bureaucratic, careerist approach taken by many Confucians of the preceding Han and Tang dynasties (206 BCE–905 CE) that had weakened the tradition spiritually. Zhu Xi’s spirit and thought were deeply rooted in the original teachings of Confucius and his early school, as well as in the seminal ideas of the Northern Song masters, and exerted a profound influence in China and around East Asia for centuries.
    step1: |-
      值得注意的是，朱熹从《大学》中汲取并提炼出格物致知的方法论，又从《中庸》中强调自我调适以达至最高适宜。格物包含读书与经典研习，同时确保人对生命脉搏的切实把握与切身共鸣：自然与现象，以及社会、人际关系与人事关切（Gardner 1986, 1990）[^gardner-1990][^gardner-1986]。调适自我则要求保持诚敬专注，并作正念的反思与实践。一个世纪后，元代（1271–1368）官府采用朱熹编定的四书作为科举制度的基础，事实上将其正典化，直到 1908 年清末（1644–1911）科举制度终止。以五经到四书作为科举基础这一转变，带来儒家传统与观念的革新与更新。它恢复了孔子对个人伦理修养、体认与实践的原初关切，扭转了此前汉唐（前 206–905）许多儒者偏于官僚化、求仕进取的取径——那种取径已在精神上削弱了这一传统。朱熹的精神与思想深深植根于孔子及其早期学派的原本教导，也植根于北宋大师们的开创性观念，其影响在中国及东亚各地绵延数百年。
