      In contrast to reductive analytical Western concepts used in studying the natural world, including matter, material quality, motion, and change, Zhu Xi adopted a holistic approach to understanding the physical world and phenomena. He drew upon received notions of *li* (pattern) and *qi* (cosmic vapor) to describe and account for the material, dynamic, and formal features of perceived phenomena. *Li* (pattern) refer to the inner patterns of both interaction and identifying form. As noted, *li* are not general overarching principles, but inner patternings implicated in things and events, from the discernible textures—grains in wood, veins in leaves—to the postulated identifying forms, *xing*, of things. In terms of dynamic interaction, *li* structure the primal *yin-yang* intercourse as *taiji*, and the intercourse among the five phases as their constitutive identifying forms. Zhu thus conceived of the cosmos as emerging from incipient *yin-yang* interaction in the initially formless primal *qi* (*yuanqi*). *Yin-yang* interaction and further permutations give rise to the five phases, which bear the full range of material and perceptual qualities and whose interaction gives rise to heaven, earth, and the myriad things, i.e., the cosmos.
    step1: |-
      与用于研究自然世界的还原性分析概念——包括物质、材料性质、运动与变化——相对，朱熹采用整体取进路来理解物理世界与现象。他调用传世的理（样式）与气（宇宙之气）观念，来描述并说明所感知现象的质料的、动态的与形式的特征。理（样式）既指互动的内在样式，也指标识形式的内在样式。如前所述，理不是包举一切的一般原理，而是牵连于事物与事件之中的内在条理：从可辨的纹理——木之纹理、叶之脉络——到被设定的标识形式（事物的性）。就动态互动而言，理把原初的阴阳交往结构为太极，也把五行之间的交往结构为其构成性的标识形式。朱熹由此把宇宙构想为：从最初无形太初之气（元气）中的肇始阴阳互动中生成。阴阳互动及其进一步的变型产生五行；五行带有全部的质料性质与知觉性质，其互动又产生天地万物，即宇宙。
