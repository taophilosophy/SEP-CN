  - id: 96
    kind: body
    source: |-
      Jeremy Lent presents Zhu’s holistic *li-qi* approach as instructive for ecological understanding as well as ethics. Notably, he characterizes resilient ecosystens as *cheng* or authentic for fulfilling their bio-ecological potential, just as exemplary persons realize *cheng* by forming lasting arrays of human relationship. Ethicists, such as Stephen Angle, Yong Huang, and Justin Tiwald examine Confucian ethics in general and Zhu’s ethics in particular as species of virtue ethics, as conceived in recent Anglo-American ethical thought. They have identified overlaps and similarities between these ethical approaches. Other scholars, such as Ming-huei Lee and the present author have identified Kantian elements in Zhu’s efforts to justify Confucian ethics and cultivation. Finally, while Shui Chuen Lee and others find support in Zhu’s system for a viable Confucian approach to environmental ethics, Chen Yu-Chuan explores Zhu’s lived approach to ecological understanding through his investigations of and engagement with the fengshui of the marvelous terrain of the Wuyi mountains, especially along the Wuyi Nine-Bend River. Research in progress explores Zhu’s proposal to establish a committee of experts of high moral character to review and enhance imperial decision making. Their mission would be to examine whether proposed imperial decisions would, in principle, be necessary, feasible, and in the public interest. While his call for such a “check and balance” institution to rein in arbitrary imperial descion making would have benefited the people and imperial court, as well as the empire, it would not have been countenanced by an all-powerful emperor and their high officials. Zhu’s proposal is breathtaking; it resonates with us in an era when the perils of arbritrary authoritatian decision making are all too evident.
    step1: |-
      Jeremy Lent 把朱熹的整体论理气取路呈现为对生态理解与伦理都有教益的进路。值得注意的是，他把有韧性的生态系统刻画为*诚*（*cheng*）——因其实现了自身生物生态的潜能而为「本真的」，正如典范之人通过缔结持久的人的关系之阵列而实现诚。伦理学者——如 Stephen Angle、Yong Huang（黄勇）与 Justin Tiwald——把儒家伦理一般地、把朱熹伦理特殊地考察为美德伦理的种类，一如近来英美伦理思想所构想的。他们已识别出这些伦理取路之间的重叠与相似。另一些学者——如李明辉与本文作者——已在朱熹为儒家伦理与修养所作的辩护中识别出康德式的要素。最后，李瑞全（Shui Chuen Lee）等人在朱熹的体系中为一种可行的儒家环境伦理找到支持，而 Chen Yu-Chuan 则通过朱熹对武夷山——尤其沿武夷九曲溪——奇异地貌之风水的研究与投入，探讨其活生生的生态理解取路。进行中的研究探讨朱熹设立由高道德品格的专家组成委员会的提议，以审议并改进皇帝的决策：其使命是审查拟议的决策是否在原则上必要、可行且合乎公共利益。他呼吁这样一个「制衡」机构来约束任意的帝制决策，这本会有利于人民、朝廷乃至帝国；但它不会得到全能皇帝及其高官的容许。朱熹的提议令人惊叹；在一个任意专断决策之危险显而易见的时代，它与我们发生共鸣。
