      For Zhu Xi, the world presents a vital tapestry of relationships, cycles, processes, events, and things that are spontaneously arrayed in aesthetic order. In the nexus of these arrays, *li* are manifested three dimensionally and present different faces from different angles (Graham 1986a: 148; Qian Mu 1986: 133)[^graham-1986a][^qian-1986]. *Li* are inherently perspectival. Zhu adopts metaphors of the grains in wood, the lines in jade, the “veins” in a leaf, the lines in marble, and even the sinewy texture of beef, to stress that *li* are manifested immanently rather than abstractly, and thus are to be sought concretely by observing phenomena in the world, not by pure, disengaged, abstract ratiocination (Needham 1956a: 473)[^needham-1956a]. Moreover, *li* are never presented in their putative optimal pure form. They always appear conditioned by the degree of purity of the *qi* through which they are manifested and of the environing conditions (Wade 2003)[^wade-2003].
    step1: |-
      在朱熹看来，世界呈现为一幅生机勃勃的织锦：关系、循环、过程、事件与事物自发地排列成审美秩序。在这些排列的纽结中，理以三维方式显现，并从不同角度呈现不同面貌（Graham 1986a: 148; Qian Mu 1986: 133）[^graham-1986a][^qian-1986]。理本质上是有视角的。朱熹采用木之纹理、玉之线条、叶之「脉络」、大理石之纹路乃至牛肉之筋腱质地等比喻，强调理是内在地显现的，而非抽象地显现；因此要具体地在观察世界现象中寻求理，而不是通过纯粹超离的抽象推理（Needham 1956a: 473）[^needham-1956a]。而且，理从不会以其推定的最优纯粹形态出现。理总是受其得以显现的气的纯净程度以及环境条件的制约而出现（Wade 2003）[^wade-2003]。
