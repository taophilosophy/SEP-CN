      > By comparison, the Latin *cohaerentia* “organic order, structure,” emphasizes the quality of constituting a unified whole. The Latin *principium*, “source, foundations” is morally not ontologically signficant. That is, it does not imply here a transcendent meaning, but has a moral resonance … exactly as *li* does. (Arghirescu, 2020: 3)[^arghirescu-2020]
    step1: |-
      > 相比之下，拉丁语 *cohaerentia*（「有机的秩序、结构」）强调构成统一整体的性质；拉丁语 *principium*（「源头、根基」）则在道德上而非本体论上有意义。也就是说，它在此并不蕴含超越的含义，而是带有道德的共鸣……恰如理之所为。（Arghirescu, 2020: 3）[^arghirescu-2020]
