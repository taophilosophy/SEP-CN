      Zabarella’s conclusion about the relationship between the art of medicine and natural philosophy is that the latter must consider the universal qualities of health and sickness, while the former concentrates on finding remedies for particular diseases. Zabarella suggests that Aristotle wrote a book of health and sickness of which nothing but a small fragment remains. These fragments are on the borderline of these two disciplines. Zabarella sums this up: where the philosopher ends, there the physician begins (*ubi desinit philosophus, ibi incipit medicus*). From the universal consideration of sickness and health the physician descends to the treatment of all particular diseases and to knowledge of their causes. While discussing the principles of medical art Zabarella compares anatomical principles with principles derived from natural philosophy. In his view, only the philosophy of nature, not anatomy, can provide a solid basis for medical practitioners (Mikkeli 1997, pp. 221–225)[^mikkeli-1997].
    step1: |-
      萨巴雷拉关于医学技艺与自然哲学关系的结论是：后者必须考虑健康与疾病的普遍性质，而前者专注于为特殊疾病寻找疗法。萨巴雷拉提出，亚里士多德写过一部论健康与疾病的书，如今只余一篇小残篇。这些残篇正处于这两门学科的边界上。萨巴雷拉对此总结道：哲学家止步之处，正是医生开始之处（*ubi desinit philosophus, ibi incipit medicus*）。从对疾病与健康的普遍考虑出发，医生下降到对一切特殊疾病的治疗及其原因的认识。在讨论医学技艺的原理时，萨巴雷拉把解剖学原理与源自自然哲学的原理相比较。在他看来，只有自然哲学而非解剖学，能够为行医者提供坚实的基础（Mikkeli 1997, pp. 221–225）[^mikkeli-1997]。
    step2: |-
      关于医学技艺与自然哲学的关系，萨巴雷拉的结论是：后者必须考察健康与疾病的普遍性质，前者则专注为具体疾病寻找疗法。他还提出，亚里士多德写过一部论健康与疾病的书，如今仅存残篇数行，恰落在两门学科的交界上。萨巴雷拉将此总结为一句：哲学家止步之处，即医生开始之处（*ubi desinit philosophus, ibi incipit medicus*）。医生由对疾病与健康的普遍考察，下降到对一切具体疾病的治疗及其原因的认识。在讨论医学技艺的原理时，萨巴雷拉把解剖学原理与来自自然哲学的原理加以比较；在他看来，能为行医者提供坚实基础的，只有自然哲学而非解剖学（Mikkeli 1997, pp. 221–225）[^mikkeli-1997]。
