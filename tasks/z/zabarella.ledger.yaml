      In his *De natura logicae* (part of the *Opera logica*) Zabarella attacks writers who put medicine alongside the philosophy of nature among the sciences. Contemplative philosophy appropriates nothing from the productive arts, but instead the arts adopt everything from philosophy. No matter how valuable and precise medicine may be, it could never be a science because it is practised not for the sake of knowledge, but for an end product: that is, the maintenance or restoration of health. If knowledge of the human body is considered purely for its own sake, rather than for curative purposes, it should be called natural philosophy rather than medicine. Even if it were admitted that medicine could be practised for the sake of knowledge, it could not be called a pure science, because it does not explain the first causes, and without this comprehension the other causes cannot be clearly apprehended. Health cannot be fully comprehended and the goal of medicine cannot be achieved, if a physician does not comprehend all the parts of a human body and their nature, composition, purpose, and function.
    step1: |-
      在其《论逻辑的本性》（*De natura logicae*，《逻辑著作》的一部分）中，萨巴雷拉抨击那些把医学与自然哲学并列于诸科学之中的作者。静观哲学不从生产性技艺那里拿取任何东西，倒是诸技艺从哲学那里采纳一切。无论医学多么有价值、多么精确，它都绝不能成为科学，因为它被实践不是为了知识，而是为了一个最终产品：即健康的维持或恢复。如果对人体知识的考虑纯粹是为了知识自身，而不是为了治疗的目的，那就应称之为自然哲学而非医学。即使承认医学可以为了知识而被实践，它也不能被称为纯粹的科学，因为它不解释第一原因；而若无这种理解，其余的原因便不能被清晰地把握。健康不能被充分理解、医学的目的无法达成，如果医生不理解人体的所有部分及其本性、构造、目的与功能。
    step2: |-
      在《论逻辑的本性》（*De natura logicae*，《逻辑著作》之一部分）中，萨巴雷拉抨击那些把医学与自然哲学并列为科学的作者。静观哲学不向生产性技艺索取分毫，倒是诸技艺从哲学采纳一切。医学无论多么有价值、多么精密，都永远成不了科学：它的施行不为知识，而为最终产品——健康的维持或恢复。若对人体知识的考量纯粹为知识自身、而非为疗治之用，那就该叫自然哲学，不该叫医学。即便退一步承认医学可以为知识而行，它也称不上纯粹的科学：它不解释第一原因，而缺了这种理解，其余原因便无从清晰把握。医生若不通晓人体的所有部分及其本性、构造、目的与功能，健康便无从被充分理解，医学的目的也无从达成。
