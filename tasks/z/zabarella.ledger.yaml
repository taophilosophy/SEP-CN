      Natural philosophy has to know and teach the very essence of natural beings. First, it has to deal with their basic principles, such as matter and motion, which are not natural beings themselves. These principles of natural philosophy are discussed in Aristotle’s *Physics*. Moreover, natural philosophy has to deal with the accidents of natural beings understood through their causes. These are the subject of Aristotle’s other writings on nature, from *On the Heavens* to *On the Soul* (on Zabarella’s ideas on *Physics*, see Biard 2005)[^biard-2005].
    step1: |-
      自然哲学必须认识并讲授自然存在者的本质本身。首先，它必须处理自然存在者的基本原理，如质料与运动——它们本身不是自然存在者。自然哲学的这些原理在亚里士多德的《物理学》（*Physics*）中得到讨论。此外，自然哲学还必须处理通过原因而被理解的自然存在者的诸偶性。这些是亚里士多德从《论天》（*On the Heavens*）到《论灵魂》（*On the Soul*）的其他论自然著作的主题（关于萨巴雷拉对《物理学》的看法，见 Biard 2005）[^biard-2005]。
