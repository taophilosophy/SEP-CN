      贾科莫·萨巴雷拉 1533 年 9 月 5 日生于帕多瓦一个古老而高贵的家族，从父亲尤利奥·萨巴雷拉（Giulio Zabarella）手中继承了宫廷伯爵（palatine count）头衔。他受过人文主义教育，进入帕多瓦大学，1553 年获博士学位，先后师从多位名师：人文学科的弗朗切斯科·罗贝尔泰洛（Francesco Robortello）、逻辑学的贝尔纳迪诺·托米塔诺（Bernardino Tomitano）、物理学与形而上学的马尔坎托尼奥·真纳（Marcantonio Genua）、数学的彼得罗·卡泰纳（Pietro Catena）。与多数研习自然哲学的同代人不同，萨巴雷拉从未修读医学学位。他的教学生涯全部在家乡大学度过：1564 年接替托米塔诺出任逻辑学第一教席（即教授职位），五年后转任声望更高、俸禄更厚的自然哲学编外教授第二教席，1577 年晋升自然哲学第一编外教席，1585 年终获自然哲学第二常任教席，并执掌此席直至离世。依帕多瓦大学章程，土生土长的帕多瓦人不得出任自然哲学第一常任教席，萨巴雷拉因此与该席无缘。1589 年 10 月 15 日，萨巴雷拉去世，享年 56 岁。
