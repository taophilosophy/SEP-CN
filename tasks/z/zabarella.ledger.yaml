      Instead of overemphasizing the connection between Zabarella and Galileo, a more meaningful historical issue is whether Zabarella significantly influenced seventeenth-century investigators of nature, and this must be answered in the affirmative. The range and extent of this influence, however, has yet to be fully explored. Zabarella’s thought had a large impact among Protestant Aristotelians in Germany and in the Low Countries during the late sixteenth century and first part of the seventeenth century (Backus 1989; Maclean 2002)[^backus-1989][^maclean-2002]. Zabarella’s books were known even in the remote Scandinavian countries surprisingly early already at the turn of the seventeenth-century (Mikkeli 2002)[^mikkeli-2002]. Zabarella’s clear and systematic interpretation of Aristotle’s logic and natural philosophy was used as a basis for numerous Aristotelian textbooks printed in Germany. Moreover, the Protestant academics found Zabarella’s instrumentalist view of logic useful for their theological purposes (Kusukawa 2002)[^kusukawa-2002]. Also in the British Isles the Scholastic revival of the early seventeenth century owed much to Zabarella’s writings (Sgarbi 2012; Sgarbi 2013, 53–78)[^sgarbi-2012][^sgarbi-2013]. Recently there has been some considerations whether Zabarella’s distinction between the objects of science (*res considerata*) and the way of considering (*modus considerandi*) had an impact on the distinction between matter and form in Immanuel Kant’s philosophy (Sgarbi 2010)[^sgarbi-2010]. Zabarella’s influence on Leibniz has been noted (Blank 2015; Lærke 2019)[^blank-2015][^lærke-2019]. Even some modern scholars of Aristotle have continued to consult his commentaries with profit.
    step1: |-
      与其过分强调萨巴雷拉与伽利略的联系，更有意义的历史问题是：萨巴雷拉是否显著影响了十七世纪的自然研究者？对此必须作肯定的回答。不过，这一影响的范围与程度仍有待充分探究。在十六世纪末至十七世纪前期的德国与低地国家，萨巴雷拉的思想在新教亚里士多德主义者中间影响巨大（Backus 1989; Maclean 2002）[^backus-1989][^maclean-2002]。萨巴雷拉的著作甚至早在十七世纪之交就令人惊讶地早早为遥远的斯堪的纳维亚诸国所知（Mikkeli 2002）[^mikkeli-2002]。萨巴雷拉对亚里士多德逻辑与自然哲学的清晰而系统的诠释，被用作在德国印行的众多亚里士多德教科书的基础。此外，新教学者发现萨巴雷拉的逻辑工具主义观点对他们的神学目的有用（Kusukawa 2002）[^kusukawa-2002]。在不列颠诸岛，十七世纪早期的经院哲学复兴也在很大程度上受惠于萨巴雷拉的著作（Sgarbi 2012; Sgarbi 2013, 53–78）[^sgarbi-2012][^sgarbi-2013]。晚近还有若干讨论：萨巴雷拉关于科学对象（*res considerata*）与考虑方式（*modus considerandi*）的区分，是否影响了伊曼努尔·康德哲学中质料与形式的区分（Sgarbi 2010）[^sgarbi-2010]。萨巴雷拉对莱布尼茨的影响已被注意到（Blank 2015; Lærke 2019）[^blank-2015][^lærke-2019]。甚至一些现代亚里士多德学者仍在查阅他的评注并从中受益。
    step2: |-
      与其夸大萨巴雷拉与伽利略的联系，不如换一个更有意义的历史问题：萨巴雷拉是否深刻影响了十七世纪的自然研究者？答案必须是肯定的，尽管这一影响的范围与程度尚待充分探究。十六世纪末至十七世纪前期，萨巴雷拉的思想在德国与低地国家的新教亚里士多德主义者中间影响巨大（Backus 1989; Maclean 2002）[^backus-1989][^maclean-2002]；甚至远在斯堪的纳维亚诸国，他的著作也早在十七世纪之交就出人意料地为人所知（Mikkeli 2002）[^mikkeli-2002]。萨巴雷拉对亚里士多德逻辑与自然哲学清晰而系统的诠释，被德国刊行的众多亚里士多德教科书奉为基础；新教学者们还发现，他那种视逻辑为工具的观点正合神学之用（Kusukawa 2002）[^kusukawa-2002]。在不列颠群岛，十七世纪早期的经院哲学复兴同样大大受惠于他的著作（Sgarbi 2012; Sgarbi 2013, 53–78）[^sgarbi-2012][^sgarbi-2013]。晚近还有讨论追问他关于科学对象（*res considerata*）与考虑方式（*modus considerandi*）的区分，是否影响了伊曼努尔·康德哲学中质料与形式的区分（Sgarbi 2010）[^sgarbi-2010]；他对莱布尼茨的影响也已进入研究视野（Blank 2015; Lærke 2019）[^blank-2015][^lærke-2019]。甚至一些当代亚里士多德学者至今仍在查考他的评注，并屡有收获。
