    source: |-
      Zabarella’s introductory treatise on the nature of logic, *De natura logicae*, is basic to his teaching in logic. He defines logic as being neither a science nor an art, but, in keeping with the traditional meaning of the word *organon*, just an instrument (*instrumentum*) of the arts and sciences. As an instrumental discipline it furnishes a useful tool of inquiry for all the arts and sciences. Logic does not have a real subject of its own, but deals with concepts, which stand for real beings. In this it is comparable to grammar. The difference between grammar and logic is that the former is concerned with the perfect verbal expression of concepts, and hence is a linguistic discipline, while the latter invents second notions (*notiones secundae*) or second intentions, that are able to create order among concepts. Therefore logic serves to recognize the truth and distinguish it from falsehood in every instance. Logic is thus a rational discipline (*disciplina rationalis*) that is not itself philosophy, but springs from philosophy and is devoted to philosophical ends (Vasoli 2011)[^vasoli-2011].
    step1: |-
      萨巴雷拉论述逻辑本性的导论性专题著作《论逻辑的本性》（*De natura logicae*）是他逻辑教学的基础。他把逻辑定义为既非科学亦非技艺，而依 *organon* 一词的传统含义，只是诸技艺与诸科学的一个工具（*instrumentum*）。作为一种工具性学科，逻辑为一切技艺与科学提供有用的探究工具。逻辑没有自己的实在对象，而是处理代表实在存在者的概念。在这一点上它可与语法相比。语法与逻辑的差别在于：前者关心概念的完善语言表达，因而是一门语言学科；后者则发明第二概念（*notiones secundae*）即第二意向，它们能在诸概念之间建立秩序。因此，逻辑的作用是在每一个事例中认出真理并将其与谬误区分开来。逻辑由此是一门理性学科（*disciplina rationalis*）：它本身不是哲学，却发自哲学并献身于哲学的目的（Vasoli 2011）[^vasoli-2011]。
    step2: |-
      萨巴雷拉论逻辑本性的导论之作《论逻辑的本性》（*De natura logicae*）是其逻辑教学的根基。他给逻辑的定位是：既非科学亦非技艺，而按 *organon* 一词的传统含义，只是诸技艺与诸科学共用的一个工具（*instrumentum*）。作为工具性学科，逻辑为一切技艺与科学提供有用的探究手段。逻辑没有专属于自己的实在对象，处理的是代表实在存在者的概念；就此而言它可与语法类比。但语法与逻辑有别：前者关心概念的完善的语言表达，属语言学科；后者则发明第二概念（*notiones secundae*），即第二意向，用以在诸概念之间建立秩序。因此，逻辑的任务是在每一事例中识别真理、使之与谬误分别开来。由此，逻辑是一门理性学科（*disciplina rationalis*）：它本身不是哲学，却从哲学中生发出来，并献身于哲学的目的（Vasoli 2011）[^vasoli-2011]。
  - id: 14
    kind: body
    source: |-
      Zabarella followed Averroes in dividing logic into two parts: universal logic, which is common to all subjects; and particular logic, which is specific to particular subjects. The first three books of Aristotle’s Organon, the *Categories, On Interpretation* and the *Prior Analytics* constitute the universal part of logic. Aristotle’s *Posterior Analytics, Topics* and *Sophistical Refutations* are said to deal with particular logic as much as they deal respectively with the demonstrative syllogism, the dialectical syllogism and the sophistical syllogism. Following the Neoplatonic commentators (above all Simplicius), Zabarella also included Aristotle’s *Rhetoric* and *Poetics* within logic. The former is included because it teaches the use of the rhetorical syllogism or enthymeme, and rhetorical induction or example; the latter because it also teaches the use of example, not to persuasive ends, but for imitation.
    step1: |-
      萨巴雷拉追随阿威罗伊把逻辑分为两部分：普遍逻辑，为一切题材所共有；特殊逻辑，为特定题材所特有。亚里士多德《工具论》的前三书——《范畴篇》（*Categories*）、《解释篇》（*On Interpretation*）与《前分析篇》（*Prior Analytics*）——构成逻辑的普遍部分。据说亚里士多德的《后分析篇》（*Posterior Analytics*）、《论题篇》（*Topics*）与《辨谬篇》（*Sophistical Refutations*）处理特殊逻辑，同样也分别处理证明三段论、辩证三段论与诡辩三段论。追随新柏拉图主义注释家（尤其是辛普里丘），萨巴雷拉还把亚里士多德的《修辞学》（*Rhetoric*）与《诗学》（*Poetics*）也纳入逻辑。前者之被纳入是因为它讲授修辞三段论或省略三段论以及修辞归纳或例证的用法；后者之被纳入是因为它也讲授例证的用法，不过不是为说服服务，而是为模仿服务。
    step2: |-
      萨巴雷拉追随阿威罗伊，将逻辑一分为二：一是为一切题材共有的普遍逻辑，二是为特定题材所特有的特殊逻辑。亚里士多德《工具论》的前三书——《范畴篇》（*Categories*）、《解释篇》（*On Interpretation*）与《前分析篇》（*Prior Analytics*）——构成逻辑的普遍部分；《后分析篇》（*Posterior Analytics*）、《论题篇》（*Topics*）与《辨谬篇》（*Sophistical Refutations*）据说处理特殊逻辑，同时也分别处理证明三段论、辩证三段论与诡辩三段论。他又追随新柏拉图主义注释家（首推辛普里丘），把亚里士多德的《修辞学》（*Rhetoric*）与《诗学》（*Poetics*）也划入逻辑：前者之入，因它讲授修辞三段论（即省略三段论）与修辞归纳（即例证）的用法；后者之入，因它同样讲授例证的用法，只是不为说服，而为模仿。
  - id: 15
