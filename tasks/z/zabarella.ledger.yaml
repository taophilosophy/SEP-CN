      Zabarella also developed a theory of the middle (or mixed) sciences that, contrary to the prevailing view, afforded sciences such as astronomy and optics full demonstrative status despite their borrowing principles from pure mathematics. Nevertheless, Zabarella’s approach to the study of nature remained causal and qualitative in the traditional Aristotelian vein rather than mathematical. Therefore he gave little attention to the possible uses of mathematics as a tool for understanding the physical world (Laird 1983, Ch. 8)[^laird-1983].
    step1: |-
      萨巴雷拉还发展了一种关于中间（或混合）科学的理论：与流行的看法相反，这一理论赋予天文学和光学这类科学以完全的证明性地位，尽管它们从纯粹数学借取原理。尽管如此，萨巴雷拉研究自然的进路仍是传统亚里士多德式的因果与定性进路，而非数学的。因此，他很少注意把数学用作理解物理世界之工具的可能用途（Laird 1983, Ch. 8）[^laird-1983]。
    step2: |-
      萨巴雷拉还发展出一种关于中间（或混合）科学的理论：与流行看法相反，天文学、光学这类科学虽从纯粹数学借取原理，却照样享有完全的证明性地位。尽管如此，他研究自然的进路仍属传统亚里士多德式的因果与定性进路，而非数学化的；因此，他几乎不关心把数学用作理解物理世界的工具（Laird 1983, Ch. 8）[^laird-1983]。
