      Zabarella’s position here can be interpreted as an attempt to raise the status of an independent natural philosophy by emphasizing the nobility of the science of the soul. In fact, it seems that he wanted to elevate the status of *De anima* to that of a special science among other natural disciplines that is the noblest and most precise of all natural sciences on which all the other parts of natural philosophy could rely. What in the medieval times had perhaps been considered to be part of metaphysics was now the most valuable part of natural philosophy. Following the Alexandrian tradition, Zabarella himself left the question of the immortality of the soul to the theologians, because it did not belong to natural philosophy, and since Aristotle, as a natural philosopher, had not been explicit about it (Kessler 2011, p. 52)[^kessler-2011]. It is, in fact, hard to be sure, whether Zabarella himself thought that the soul was mortal. However, in his commentary on Aristotle’s treatise *On the Soul* Zabarella tried at least to prove that Aristotle himself did not consider it immortal (Mitrovic 2009; Valverde 2012)[^mitrovic-2009][^valverde-2012].
    step1: |-
      萨巴雷拉在此的立场可以被解读为一种尝试：通过强调灵魂科学的高贵性来提高一门独立的自然哲学的地位。实际上，他似乎想提升《论灵魂》（*De anima*）的地位，使之成为诸自然学科之间的一门特殊科学——一切自然科学中最高贵、最精确者，自然哲学的一切其余部分都可以依赖它。中世纪时或许曾被当作形而上学一部分的东西，如今成了自然哲学中最有价值的部分。追随亚历山大传统，萨巴雷拉本人把灵魂不朽的问题留给神学家，因为这一问题不属于自然哲学，而且亚里士多德作为自然哲学家对此也未尝明言（Kessler 2011, p. 52）[^kessler-2011]。事实上，很难确定萨巴雷拉本人是否认为灵魂是会死的。不过，在其亚里士多德《论灵魂》评注中，萨巴雷拉至少试图证明：亚里士多德本人并不认为灵魂不朽（Mitrovic 2009; Valverde 2012）[^mitrovic-2009][^valverde-2012]。
    step2: |-
      萨巴雷拉在此的立场，可解读为一次为独立自然哲学抬升地位的努力：借助对灵魂科学高贵性的强调。事实上，他似乎想让《论灵魂》（*De anima*）升格为诸自然学科间的一门特殊科学——众自然科学中最高贵、最精确者，自然哲学的其余一切部分皆可靠它支撑。中世纪或许还被归入形而上学的这片领地，如今成了自然哲学中最有价值的部分。萨巴雷拉本人追随亚历山大传统，把灵魂不朽问题留给神学家：它不属于自然哲学，何况身为自然哲学家的亚里士多德对此也未曾明言（Kessler 2011, p. 52）[^kessler-2011]。要说萨巴雷拉本人是否认为灵魂有死，其实难有定论；不过在其《论灵魂》评注中，他至少力图证明：亚里士多德本人并不主张灵魂不朽（Mitrovic 2009; Valverde 2012）[^mitrovic-2009][^valverde-2012]。
