      Through their rival claims about *ordo doctrinae* Zabarella and Piccolomini revealed as well very different perceptions of academic and civil order, and very different ways of conceiving and pursuing the office of philosopher within that order. Zabarella wholeheartedly endorsed the purely contemplative nature of philosophy and the superiority of the contemplative life (Mikkeli 1992, pp. 25–35)[^mikkeli-1992]. He also was frequently dismissive in his treatment of the disciplines he regarded as active or operative, for example law, medicine, ethics, politics and mechanics. Piccolomini’s position was sharply opposed. For him, philosophy is, indeed, crucial for the spiritual perfection of man. However, in the form of *scientia civilis* it is also the key to the this-wordly perfection that can be attained in the just administration of the Venetian republic (Jardine 1997)[^jardine-1997].
    step1: |-
      通过他们关于教学秩序（*ordo doctrinae*）的对立主张，萨巴雷拉与皮科洛米尼也显露出对学术秩序与公民秩序的迥异理解，以及在这一秩序中构想并践行哲学家职分方式的巨大差异。萨巴雷拉全心全意地赞同哲学纯然静观的性质与静观生活的优越性（Mikkeli 1992, pp. 25–35）[^mikkeli-1992]。对于他视为行动性或操作性的学科——例如法学、医学、伦理学、政治学和机械学——他常常态度轻蔑。皮科洛米尼的立场针锋相对。在他看来，哲学对于人的精神完善固然至关重要；但以公民科学（*scientia civilis*）的形态，它也是尘世完善的关键——这种完善可以在威尼斯共和国的公正治理中达到（Jardine 1997）[^jardine-1997]。
    step2: |-
      借着在教学秩序（*ordo doctrinae*）上的对垒主张，萨巴雷拉与皮科洛米尼还显露出两人对学术秩序与公民秩序的迥异理解，以及在那一秩序中构想并践行哲学家职分的两种路数。萨巴雷拉全然赞同哲学纯然静观的品格与静观生活的优越（Mikkeli 1992, pp. 25–35）[^mikkeli-1992]；对他视为行动性或操作性的学科——法学、医学、伦理学、政治学、机械学——他则动辄轻慢。皮科洛米尼的立场针锋相对。在他那里，哲学对人的精神完善固然关键；但以公民科学（*scientia civilis*）之形，它同样通向尘世的完善——这种完善可在威尼斯共和国的公正治理中达成（Jardine 1997）[^jardine-1997]。
