      Therefore with the metaphysical requirements of intellection taken for granted, the main epistemological problem shifted to the manner in which the intelligible *species* was turned into a known object. Zabarella, considering the agent intellect as the divine cause of general intelligibility, could renounce innate principles and retain the Aristotelian teaching of the inductive acquisition of the first principles themselves. But Zabarella had instead the problem of restoring to the human mind an active faculty which would account for the act of judgement. Therefore he redefined the possible intellect as an active faculty as well. This equally active and passive human intellect (which Zabarella called *patibilis* instead of *possibilis*) considered all that was offered to it by the illuminated *phantasma*, contemplated whatever it wanted to, and in doing so selected and abstracted those structures it wished to know and through judging understood them and became itself the object of knowledge. For Zabarella intellection therefore was not a process automatically determined whenever an exterior impulse was given, but rather depended essentially on human will and intention. In Zabarella’s view, the science of the soul was concerned with what was necessary and therefore always equally present in any human mind, even if unconsciously. Methodology, on the other hand, was concerned with the use a human being made of these natural faculties. Since this use could be true or false, better or worse, truth and error depended entirely on whether or not the correct method was being used (Kessler 1988, pp. 530–534)[^kessler-1988].
    step1: |-
      因此，在理智认识的形而上学要求被视作理所当然之后，主要的认识论问题就转移到可理解种相被转变成被知对象的方式上。萨巴雷拉把能动理智看作普遍可理解性的神圣原因，由此可以放弃天赋原理，保留亚里士多德关于第一原理本身经由归纳而获得的学说。但萨巴雷拉随之面临另一个问题：如何为人类心灵恢复一种能动官能以说明判断行为。因此他把可能理智重新定义为一种同样是能动性的官能。这种既能动又被动的人类理智（萨巴雷拉称其为 *patibilis* 而非 *possibilis*）考量被照亮的幻象向它呈现的一切，静观它所想静观的东西，并在此过程中选择和抽象它想要认识的那些结构，通过判断来理解它们，并使自身成为知识的对象。因此对萨巴雷拉来说，理智认识并非每当外部冲动给出就自动被决定的过程，而在本质上取决于人的意志与意图。在萨巴雷拉看来，灵魂科学关乎必然的东西——它们因此总是同等地存在于任何人类心灵之中，哪怕是无意识地。方法论则关乎人对这些自然官能的使用。由于这种使用可以是真是假、或好或坏，真理与错误便完全取决于是否使用了正确的方法（Kessler 1988, pp. 530–534）[^kessler-1988]。
    step2: |-
      于是，在理智认识的形而上学条件被视作当然之后，认识论的主要问题便转移到：可理解种相如何被转变为被知对象。萨巴雷拉把能动理智视为普遍可理解性的神圣原因，据此可以放弃天赋原理，保留亚里士多德关于第一原理本身经归纳而获致的学说。但如此一来，他反而要面对另一个问题：为人类心灵找回一种能说明判断行为的能动官能。为此，他把可能理智重新定义为一种同样具有能动性的官能。这既主动又被动的人类理智（萨巴雷拉以 *patibilis* 替换 *possibilis* 称呼它）考量被照亮的幻象所呈现的一切，随己意静观所愿，并在这一过程中拣选、抽取出它想要认识的那些结构，经由判断理解它们，又使自身成为知识的对象。故在萨巴雷拉那里，理智认识并非外部冲动一到便自动定形的过程，而在本质上有赖于人的意志与意图。在他看来，灵魂科学关乎必然的东西——这类东西因此总是同等地临在于任何人类心灵，哪怕不为人所自觉。方法论则关乎人对这些自然官能的运用；运用或有真假、或有高下，真理与错误便全系于所用方法是否正确（Kessler 1988, pp. 530–534）[^kessler-1988]。
