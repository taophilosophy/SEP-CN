      The interminable discussion of the methodology of arts and sciences in the sixteenth century may be seen as an attempt to defend the scientific status of either the recently found autonomous sciences, like natural philosophy, or, on the other hand, the empirically based productive arts. The discussions of orders and methods, resolutions, compositions and the *regressus*-method are, therefore, not merely further elaborations of an old Aristotelian tradition, but also expressions of opinions in a lively debate concerning the changing relationships between various arts and sciences in sixteenth-century Italian universities (Mikkeli 1997, p. 228)[^mikkeli-1997].
    step1: |-
      十六世纪关于诸技艺与诸科学之方法论的无休止讨论，可以被视为一种辩护尝试：或是为新近获得自主地位的科学（如自然哲学）辩护，或是为另一方面以经验为基础的生产性技艺辩护。因此，关于秩序与方法、分解、组合以及回归法的种种讨论，不只是对古老亚里士多德传统的进一步阐发，也是一场活跃论战中各方意见的表达——这场论战关乎十六世纪意大利诸大学中各门技艺与科学之间变动不居的关系（Mikkeli 1997, p. 228）[^mikkeli-1997]。
    step2: |-
      十六世纪关于诸技艺与诸科学方法论的无尽讨论，可视为一种辩护的尝试：一方要为新近获得自主地位的科学（如自然哲学）确立其科学身份，另一方则要为立足经验的生产性技艺如此辩护。因此，围绕秩序与方法、分解、组合乃至回归法的种种讨论，不只是古老亚里士多德传统的进一步铺展，也是一场热烈论战中各方立场的表达——论战的主题，是十六世纪意大利诸大学中各门技艺与科学之间不断变动的相互关系（Mikkeli 1997, p. 228）[^mikkeli-1997]。
