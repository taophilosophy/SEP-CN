    source: |-
      Since logic, viewed as the universal instrument for distinguishing between the true and the false, differs according to the objects to which it is applied and the ends for which it is used, its nature depends on the realm of possible objects and ends. Rhetoric and poetics are special cases because they deal not with knowledge but with the political disciplines in so far as they are concerned with the good of the people. Sophistical syllogistic is another special case, because it is directed towards deception and prefers to use falsehood as its material. Dialectic and demonstration, however, are directed towards the expression of truth. Dialectic is aimed at the production of opinion, and deals with probable and contingent material; demonstration is dedicated to the acquisition of truth, and so it is exclusively occupied with necessary, true objects (Kessler 1998, p. 837)[^kessler-1998].
    step1: |-
      由于逻辑作为区分真假的普遍工具，随其被应用于的对象与被使用的目的之不同而不同，它的本性取决于可能的对象与目的的领域。修辞学与诗学是特殊情形，因为它们处理的不是知识，而是在涉及人民之善的范围内处理政治学科。诡辩三段论是另一种特殊情形，因为它指向欺骗，宁可使用谬误作为其材料。然而，辩证术与证明指向真理的表达。辩证术以意见的产生为目标，处理或然的与偶然的材料；证明则致力于真理的获取，因而只同必然的、真实的对象打交道（Kessler 1998, p. 837）[^kessler-1998]。
    step2: |-
      逻辑作为分辨真假的普遍工具，会随所施对象与所用目的而变化，其本性便取决于可能的对象与目的所构成的领域。修辞学与诗学是两个特例：它们处理的不是知识，而是在关乎人民之善的范围内处理政治学科。诡辩三段论是另一个特例：它以欺骗为指向，宁取谬误为材料。辩证术与证明则指向真理的表达。辩证术旨在产生意见，处理或然与偶然的材料；证明专务获取真理，因而只与必然、真实的对象相关（Kessler 1998, p. 837）[^kessler-1998]。
