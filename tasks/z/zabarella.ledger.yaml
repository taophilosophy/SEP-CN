      Zabarella reconstructed the process of intellection on the lines of sense-perception, that is that the intelligible *species*, produced concurrently by the *phantasma* and the illuminating agent intellect, moved the possible intellect into cognition. To be known, the *phantasma*, which was gained by sense-perception, had to undergo a double process. Itself material and consequently containing the universal structure needed in science only in a confused and unintelligible way, it had to be illuminated by the agent intellect, so that the universal in the individual was rendered distinct and intelligible. Since the illumination was generally required for any act of knowledge in the same way, its agent did not have to be an individual operating individually in the different acts of intellection, but rather could be an universal one, which rendered reality in general intelligible, thus serving as an all-embracing guarantee of intelligibility. The agent intellect could therefore be identified with God himself as the principle of intelligibility. When identifying the active intellect with God as the first cause of all that exists and can be known, Zabarella has clearly in his mind that the active intellect does no longer play a substantial role in this naturalistic philosophy of nature after this initial act of intellection (Kessler 2011, pp. 56–57)[^kessler-2011].
    step1: |-
      萨巴雷拉比照感觉知觉来重构理智认识的过程：可理解种相（intelligible *species*）由幻象（*phantasma*）与照亮的能动理智同时产生，推动可能理智进入认识。幻象由感觉知觉获得，为了被认识，它必须经历一个双重过程。它自身是物质性的，因而只是以混淆的、不可理解的方式包含科学所需要的普遍结构；它必须被能动理智照亮，从而使个体中的普遍者变得清晰而可理解。既然这种照亮以同样的方式为任何认识行为所一般地需要，其实施者不必是会在不同认识行为中逐一个体地运作的个体，而可以是普遍的一个：它使实在整体成为可理解的，从而充当可理解性的无所不包的保证。因此，能动理智可以被等同于作为可理解性原则的上帝本身。当把主动理智等同于作为一切存在者与可知者的第一因的上帝时，萨巴雷拉心中清楚的是：在这一初始的认识行为之后，主动理智便不再在这种自然主义的自然哲学中扮演实质性的角色（Kessler 2011, pp. 56–57）[^kessler-2011]。
    step2: |-
      萨巴雷拉比照感觉知觉重构理智认识的过程：可理解种相（intelligible *species*）由幻象（*phantasma*）与施予照亮的能动理智一并产生，推动可能理智进入认识。幻象得自感觉知觉，要被认识就必须经历一个双重过程：它自身是物质性的，只是以混淆而不可理解的方式携带着科学所需的普遍结构，故必须经能动理智照亮，个体中的普遍者才得以变得清晰可解。既然任何认识行为都以同样方式普遍需要这种照亮，实施照亮者就不必是逐个认识行为中分别运作的个体，而可以是普遍的一个——它使实在整体成为可理解，从而充当可理解性包罗一切的保证。于是，能动理智可以被等同于作为可理解性本原的上帝本身。而当萨巴雷拉把能动理智等同于作为一切存在与可知者的第一因的上帝时，他心里清楚的是：在这初始的认识行为之后，能动理智便不再在这套自然主义的自然哲学中扮演实质角色（Kessler 2011, pp. 56–57）[^kessler-2011]。
