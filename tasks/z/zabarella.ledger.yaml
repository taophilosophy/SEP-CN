      Zabarella, then, did not give one decisive criterion according to which all arts and sciences could be arranged into one single hierarchy. However, when dealing with the place of the science of the soul among the other sciences, Zabarella gives an description of the nobility of this part of natural philosophy. Zabarella opposed the definition of the science of the soul as a middle discipline between physics and metaphysics. He states that Aristotle did not only wish to compare the science of the soul with other sciences, but to compare it with other parts of natural science. In Zabarella’s view it is obvious that the science of the soul is the most noble part of natural philosophy, the king and emperor of every other part, which are all dependent upon it, because it shows the first cause and the sum of everything that is in animals and in plants. The science of the soul is more exquisite and certain than all the parts of natural philosophy, because the causes of the science of the soul are more exact, not only to us, but also according to nature (Mikkeli 1997, p. 220)[^mikkeli-1997].
    step1: |-
      这样看来，萨巴雷拉并没有给出一条决定性的标准，使一切技艺与科学得以据此排成一个单一的等级序列。不过，在处理灵魂科学在其他诸科学中的位置时，萨巴雷拉对自然哲学这一部分的高贵性作了描述。萨巴雷拉反对把灵魂科学定义为物理学与形而上学之间的一门中间学科。他声明，亚里士多德不仅想把灵魂科学与别的科学相比较，也想把它与自然科学的别的部分相比较。在萨巴雷拉看来，显而易见，灵魂科学是自然哲学最高贵的部分，是其余一切部分的君王与皇帝——那些部分全都依赖于它，因为它展示第一原因以及动物与植物中一切东西的总和。灵魂科学比自然哲学的一切部分都更精妙、更确定，因为灵魂科学的原因更精确——不仅对我们而言如此，按自然本身而言也如此（Mikkeli 1997, p. 220）[^mikkeli-1997]。
