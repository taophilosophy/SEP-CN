      The question of whether Zabarella can be considered as a precursor of modern experimental science should be understood in the context of early and mid-twentieth century efforts to locate and understand the origins of modern science in the seventeenth century. More recently, historians of science and philosophy have generally challenged or abandoned the notion that the seventeenth century gave birth to either modern science itself or some fundamental intellectual framework from which modern science would inevitably unfold. “Modern science” is arguably a moving target, and the actual roles that experiments play in twentieth and twenty-first century science are still being investigated and debated. Zabarella’s stated positions on experience and experiment certainly do not line up with the dominant mid-twentieth-century positions held by philosophers. For example, Zabarella arguably holds experiments ought to find their place in the productive arts rather than in natural philosophy, and he does not, in his methodological writings, advocate for the use of experience or experiment to verify or falsify theories (Schmitt 1969)[^schmitt-1969]. According to some, he made observations of natural things only to exemplify and illustrate the demonstrative reasoning used in the theoretical natural philosophy (Rossi 1983, p. 146; Heßbrüggen-Walter 2014)[^heßbrüggen-walter-2014][^rossi-1983]. On the other hand, Zabarella clearly rejected, on the basis of his own experience, certain positions held by Aristotle (Palmieri 2007)[^palmieri-2007], and he also attacked Galen’s extramission theory of vision partly on the basis of anatomical observations, including optical experiments on the parts of a dead eye (Baker 2015; Baker 2019)[^baker-2015].
    step1: |-
      萨巴雷拉能否被视为现代实验科学的先声，这一问题应放在二十世纪早中期寻找并理解现代科学之十七世纪起源的努力的语境中来理解。晚近以来，科学史与哲学史家普遍质疑或放弃了这样一种观念：十七世纪诞生了现代科学本身，或某种现代科学将从中必然展开的根本思想框架。“现代科学”可以说是一个移动的靶子，实验在二十与二十一世纪科学中所扮演的实际角色仍在被研究与争论之中。萨巴雷拉关于经验与实验的明确立场，当然与哲学家们在二十世纪中期所持的主导立场不相吻合。例如，萨巴雷拉可以说主张实验应安身于生产性技艺而非自然哲学之中；而且在其方法论著作中，他并不主张用经验或实验来验证或否证理论（Schmitt 1969）[^schmitt-1969]。有人认为，他观察自然事物，只是为了例示并说明理论自然哲学中所用的证明推理（Rossi 1983, p. 146; Heßbrüggen-Walter 2014）[^heßbrüggen-walter-2014][^rossi-1983]。另一方面，萨巴雷拉又分明基于自身经验拒绝了亚里士多德的某些立场（Palmieri 2007）[^palmieri-2007]，他也曾攻击盖伦的视觉外射说，部分依据便是解剖观察，包括对死眼各部分所做的光学实验（Baker 2015; Baker 2019）[^baker-2015]。
    step2: |-
      能否把萨巴雷拉视为现代实验科学的先声？这一问题的恰当语境，是二十世纪早中期寻找并理解现代科学之十七世纪起源的努力。晚近以来，科学史与哲学史家普遍质疑乃至放弃了这样一种观念：现代科学本身、或某种现代科学注定由之展开的根本思想框架，诞生于十七世纪。“现代科学”可以说是一个移动的靶标，实验在二十与二十一世纪科学中的实际作用至今仍被研究与争论。萨巴雷拉就经验与实验表明的立场，显然与哲学家们在二十世纪中期的主流看法不合。例如，他可以说主张实验应栖身于生产性技艺而非自然哲学；在其方法论著作中，他也从不主张以经验或实验去验证或否证理论（Schmitt 1969）[^schmitt-1969]。有人认为，他观察自然事物只为举例说明理论自然哲学所用的证明推理（Rossi 1983, p. 146; Heßbrüggen-Walter 2014）[^heßbrüggen-walter-2014][^rossi-1983]。但另一方面，萨巴雷拉又分明基于亲身经验拒绝了亚里士多德的某些立场（Palmieri 2007）[^palmieri-2007]；他还曾攻击盖伦的视觉外射说，部分依据正是解剖观察——包括对死眼各部分做的光学实验（Baker 2015; Baker 2019）[^baker-2015]。
