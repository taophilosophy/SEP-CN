      ## 2 技艺与科学
  - id: 7
    kind: body
    source: |-
      The Aristotelian distinction between arts (*artes*) and sciences (*scientiae*) serves as the starting-point for Zabarella’s philosophical system. At the beginning of his *Opera logica*, Zabarella draws a distinction between the eternal world of nature and the contingent human world. From this distinction he proceeds to two corresponding kinds of knowledge, and two distinct methods of defining them. Zabarella maintained that, properly speaking, sciences are concerned with the eternal world of nature and thus are contemplative disciplines, whereas arts are concerned with the contingent world of human beings and thus are non-contemplative, being productive instead. The sciences in the proper sense of that term, as pertaining to demonstrative knowledge, are limited to those disciplines that deal with the necessary and eternal or with what can be deduced from necessary principles. Zabarella notes that Aristotle requires two kinds of certainty from science. One is in the knowable things, which are necessary as such (*simpliciter*); the other is in the mind of the scientist, who must be absolutely sure that things cannot be otherwise. The necessity involved is therefore both ontological, with respects to the objects known, and cognitive, with respect to the knowing subject (Kessler 1998, p. 837)[^kessler-1998].
    step1: |-
      亚里士多德对技艺（*artes*）与科学（*scientiae*）的区分是萨巴雷拉哲学体系的出发点。在其《逻辑著作》的开篇，萨巴雷拉区分了永恒的自然世界与偶然的人类世界。由这一区分出发，他进而区分两种相应的知识，以及界定这两种知识的两种不同方法。萨巴雷拉主张，严格说来，科学关乎永恒的自然世界，因而是静观的学科；而技艺关乎偶然的人类世界，因而是非静观的，是生产性的。严格意义上的科学，作为属于证明性知识的学问，仅限于那些处理必然且永恒之物、或处理可从必然原理中演绎出来的东西的学科。萨巴雷拉指出，亚里士多德要求科学具备两种确定性。一种在于可知事物——它们就其自身而言（*simpliciter*）是必然的；另一种在于科学家的心灵——他必须绝对确信事物不可能别样。因此，这里涉及的必然性既是本体论的（就被知的对象而言），也是认知的（就认知主体而言）（Kessler 1998, p. 837）[^kessler-1998]。
    step2: |-
      亚里士多德对技艺（*artes*）与科学（*scientiae*）的区分，是萨巴雷拉哲学体系的起点。他在《逻辑著作》开篇先区分永恒的自然世界与偶然的人类世界，再由此引出与之相应的两种知识，以及界定二者的两种不同方法。他的主张是：严格说来，科学关乎永恒的自然世界，属静观学科；技艺则关乎偶然的人类世界，非属静观，而是生产性的。作为证明性知识的严格意义上的科学，只限于研究必然而永恒之物、或可由必然原理演绎所得者的那些学科。萨巴雷拉指出，亚里士多德要求科学具备两重确定性：一重在于可知事物——它们就其自身（*simpliciter*）而言是必然的；一重在于科学家的心灵——他必须绝对确信事情不可能别样。故此处的必然性既是本体论的（就被知对象而言），又是认知的（就认知主体而言）（Kessler 1998, p. 837）[^kessler-1998]。
  - id: 8
    kind: body
    source: |-
      The hierarchy of different disciplines was a widely debated topic in Renaissance philosophy. Also Zabarella emphasized the hierarchical nature of the division between different disciplines; the whole of active philosophy aiming ultimately at the higher sphere of contemplation. According to Zabarella, both in Plato and Aristotle happiness in the active life is not the ultimate goal for a human being. Instead it is contemplation, which is man’s finest objective that may lead to total perfection. In Zabarella’s view the purpose of active philosophy is to remove hindrance to the acquisition of knowledge and therefore contemplative philosophy is the ultimate end and master of all active philosophy. In productive disciplines (i.e., arts) it is not necessary to define the objects under production as strictly as in the contemplative sciences, because the productive arts do not aim at knowledge, and thus the knowledge they need do not have to be perfect.
    step1: |-
      不同学科的等级秩序是文艺复兴哲学中广受争论的话题。萨巴雷拉也强调不同学科之间划分的等级性质：行动哲学的整体最终指向更高的静观领域。在萨巴雷拉看来，无论在柏拉图还是亚里士多德那里，行动生活中的幸福都不是人的终极目标；终极目标是静观——它是人最高贵的目的，可引人达于完全的完善。按萨巴雷拉的观点，行动哲学的目的在于排除获取知识的障碍，因此静观哲学是一切行动哲学的终极目的与主宰。在生产性学科（即技艺）中，不必像在静观科学中那样严格地界定被生产的对象，因为生产性技艺不以知识为目标，因而它们所需的知识也不必是完善的。
    step2: |-
      各学科的等级次序是文艺复兴哲学中聚讼纷纭的论题。萨巴雷拉同样强调学科划分的等级性：行动哲学整体最终指向更高的静观领域。在他看来，无论柏拉图还是亚里士多德，行动生活中的幸福都不是人的终极目标；终极目标是静观——这是人最高贵的目的，能使人达于完全的完善。行动哲学的目的在于扫除获取知识的障碍，故静观哲学是一切行动哲学的终极目的与主宰。在生产性学科（即技艺）中，无须像静观科学那样严格界定其生产对象：生产性技艺不求知识，所需的知识也就不必完备。
