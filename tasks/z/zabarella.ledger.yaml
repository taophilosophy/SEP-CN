      In parallel view Zabarella thinks that Aristotle’s natural philosophy can be called perfect, since it deals with all the knowledge that is possible for human intellect to obtain, either in practice or at least in theory. Also in his logical works Zabarella emphasizes the idea of a perfect natural philosophy, which consists of a perfect and distinct knowledge of natural beings through their causes. Zabarella reminds that scientific knowledge can never be called confused or imperfect. Therefore the scientific ideal Zabarella presents is profoundly different from the modern view of a scientist making new discoveries. According to Zabarella, science can be “new” only in a restricted sense; the work of a scientist is more like correcting the mistakes and filling the gaps in a ready-made Aristotelian world-system (Mikkeli 1992; 1997, pp. 214–215; 2010, p. 189)[^mikkeli-1992]
    step1: |-
      在平行的观点中，萨巴雷拉认为亚里士多德的自然哲学可以被称为完善的，因为它处理人类理智所能获得的一切知识——或在实践中，或至少在理论上。在其逻辑著作中，萨巴雷拉同样强调完善自然哲学的观念：完善的自然哲学在于通过原因而拥有关于自然存在者的完善且清晰的知识。萨巴雷拉提醒说，科学知识绝不能被称为混淆的或不完善的。因此，萨巴雷拉所呈现的科学理想，与关于科学家作出新发现的现代观点深刻不同。按照萨巴雷拉的说法，科学只能在有限的意义上是“新”的；科学家的工作更像是在一个现成的亚里士多德世界体系中纠正错误、填补空缺（Mikkeli 1992; 1997, pp. 214–215; 2010, p. 189）[^mikkeli-1992]
