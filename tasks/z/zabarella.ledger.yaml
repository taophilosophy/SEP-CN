      The so-called *regressus-*method is a model for combining composition and resolution: the idea of this combinatory process is found in the Aristotelian tradition from Averroes on, and it was vitally revived among the Italian Aristotelians and medical authors. According to this method, the natural philosopher should first infer from the known effect the existence of the cause of this very effect. Sometimes he may use induction, but usually resolution, which was also called *demonstratio quia* or demonstration from the fact. Then in the second step, in the so-called *demonstratio propter quid* or demonstration from the reasoned fact (or composition), the natural philosopher should infer from the cause to the effect. The effect is now known through its cause, and hence in a scientific manner (Risse 1983)[^risse-1983]. The crucial problem with this procedure is how to avoid mere circular reasoning, or rather, how to make sure that the cause, whose existence is demonstrated in the first step, is indeed the cause of this very effect. From the beginning of the sixteenth century, it had become clear that it was necessary to introduce a third, intermediary step, which involved some kind of intellectual consideration (*negotiatio intellectus*) (Kessler 1998, p. 838)[^kessler-1998].
    step1: |-
      所谓回归法（*regressus*）是组合与分解相结合的一个模型：这一组合过程的观念在亚里士多德传统中自阿威罗伊以降即已存在，并在意大利亚里士多德主义者与医学作者中间活跃地复兴起来。按照这一方法，自然哲学家首先应当从已知的结果推出该结果之原因的存在。他有时可用归纳，但通常用分解，后者也被称为所然证明（*demonstratio quia*）或“从事实出发的”证明。然后在第二步，即在所谓所以然证明（*demonstratio propter quid*）或“从所以然出发的”证明（或组合）中，自然哲学家应当从原因推出结果。此时结果通过其原因而被知道，因而是以科学的方式被知道（Risse 1983）[^risse-1983]。这一程序的关键难题在于如何避免单纯的循环论证，或者更确切地说，如何确保第一步中被证明其存在的原因确实就是该结果的原因。自十六世纪初以来，人们已经清楚：有必要引入第三个中介性步骤，它涉及某种智性运作（*negotiatio intellectus*）（Kessler 1998, p. 838）[^kessler-1998]。
    step2: |-
      所谓回归法（*regressus*），是把组合与分解结合起来的一个模型：这一组合过程的观念自阿威罗伊以降便见于亚里士多德传统，其后在意大利亚里士多德主义者与医学作者中间生机勃勃地复兴。依此方法，自然哲学家首先从已知结果推知该结果之原因的存在——他偶或用归纳，但通常用分解，后者亦称所然证明（*demonstratio quia*），即“从事实出发”的证明；继而在第二步，即所谓所以然证明（*demonstratio propter quid*）——“从所以然出发”的证明（或组合）——中，自然哲学家从原因推出结果。此时结果经由其原因而被认识，因而是以科学的方式被认识（Risse 1983）[^risse-1983]。这一程序的关键难题在于：如何避免沦为单纯的循环论证？换言之，如何确保第一步中被证明确有其存在的原因，恰恰就是这一结果的原因？自十六世纪初以来，人们渐已明白：必须引入第三个中介性步骤，它涉及某种智性运作（*negotiatio intellectus*）（Kessler 1998, p. 838）[^kessler-1998]。
