      Zabarella also had to face the question, how the intellect in fact made this mental consideration. He solves the problem in terms of his psychology of knowledge and calls this third step a mental examination (*examen mentale*). Since for him the task of this intermediary step is to make distinct the confused knowledge of the cause that was acquired through the first step, he refers to his work on the agent mind (*Liber de mente agente*) in which he develops an account of the transformation of confused into distinct knowledge through the analysis of a given whole in terms of its parts. He presents this process as the specific ability of the human mind. Thus once more method as a means of acquiring knowledge is based on the cognitive structure of knowing subject rather than on the ontological structure of the object of knowledge. In his commentary on the *Posterior Analytics* Zabarella identified Aristotle’s proofs that the planets are near and that the moon is a sphere as instances of the *regressus-*method. Other examples of the same method he analyzed are Aristotle’s proof of the existence of “first matter” (*materia prima*) from substantial change and his proof of an “eternal first mover” (*primus motor aeternus*) from local motion (Wallace 1999, p. 338)[^wallace-1999].
    step1: |-
      萨巴雷拉还必须面对这样一个问题：理智究竟如何作出这一心智考量。他借助自己的知识心理学来解决这一问题，并把这第三个步骤称为心智检验（*examen mentale*）。由于在他看来这一中介步骤的任务是使第一步中获得的原因之混淆知识变得清晰，他援引自己论能动心智的著作《论能动心智》（*Liber de mente agente*），其中他通过把给定整体分析为其诸部分，阐述了一种从混淆知识到清晰知识的转变。他把这一过程呈现为人类心灵的特有能力。于是，方法作为获取知识的手段再一次奠基于认知主体的认知结构，而非知识对象的本体论结构。在其《后分析篇》评注中，萨巴雷拉把亚里士多德关于行星很近和月亮是球体的证明认定为回归法的实例。他分析过的同一方法的其他例子还有：亚里士多德从实体变化证明“第一质料”（*materia prima*）的存在，以及从位置运动证明“永恒的第一推动者”（*primus motor aeternus*）的存在（Wallace 1999, p. 338）[^wallace-1999]。
    step2: |-
      萨巴雷拉还须直面一个问题：理智究竟如何实施这一心智考量。他以自己的知识心理学作解，并将这第三个步骤称为心智检验（*examen mentale*）。在他看来，中介步骤的任务是使第一步所获得的原因之混淆知识变得清晰，为此他援引自己论能动心智的著作《论能动心智》（*Liber de mente agente*）：书中通过把给定整体分析为它的诸部分，阐述了由混淆知识到清晰知识的转变。他将这一过程呈现为人类心灵的特有能力。于是，作为求取知识之手段的方法，再一次奠基于认知主体的认知结构，而非知识对象的本体论结构。在《后分析篇》评注中，萨巴雷拉把亚里士多德关于行星距离很近、月亮为球体的证明，认定为回归法的实例；他分析过的同一方法的其他例证，还有亚里士多德从实体变化证明“第一质料”（*materia prima*）之存在、从位置运动证明“永恒的第一推动者”（*primus motor aeternus*）之存在（Wallace 1999, p. 338）[^wallace-1999]。
