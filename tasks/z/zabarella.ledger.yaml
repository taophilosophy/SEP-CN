      Among the Paduan Aristotelians Zabarella was probably the author who discussed most thoroughly the relationship between the philosophy of nature and medical art. While in subject-matter these disciplines were close to each other, in their essence and methodology they were far apart. Unlike many of his contemporaries, Zabarella did not consider medicine to be subalternated to the philosophy of nature. Nor did he see the distinction between theoretical and practical medicine as accidental; instead he wanted to consider the whole art of medicine as operational. In spite of medicine’s prominent place among the arts; Zabarella sharply denied its scientific status, and insisted that writers who claim that medicine is a science are mistaken. Neither the art of medicine nor its singular parts can be considered as science. For him it was enough to admit that it is the noblest of all arts.
    step1: |-
      在帕多瓦的亚里士多德主义者中间，萨巴雷拉大概是把自然哲学与医学技艺之间的关系讨论得最彻底的作者。这两门学科在题材上彼此接近，在实质与方法论上却相距甚远。与许多同代人不同，萨巴雷拉并不认为医学从属于自然哲学。他也不把理论医学与实践医学的区分视为偶然的；相反，他想把整个医学技艺看作操作性的。尽管医学在诸技艺中地位显要，萨巴雷拉却断然否认其科学地位，坚持认为主张医学是科学的作者是错误的。无论医学技艺还是它的任何个别部分都不能被看作科学。在他看来，承认医学是一切技艺中最高贵的，这就够了。
    step2: |-
      在帕多瓦的亚里士多德主义者中，萨巴雷拉大概是把自然哲学与医学技艺之关系谈得最透彻的一位。这两门学科题材相近，实质与方法却相去甚远。与许多同代人不同，萨巴雷拉并不认为医学从属于自然哲学；他也不把理论医学与实践医学之分看作偶然——他宁可把整门医学技艺视为操作性的。尽管医学在诸技艺中地位显赫，萨巴雷拉仍断然否认其科学身份，并坚称：凡是主张医学是一门科学的作者都错了。无论医学技艺整体，还是它的任何个别部分，都不能算作科学。在他看来，承认医学是一切技艺中最高贵者，足矣。
