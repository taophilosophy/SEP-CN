      Zabarella identifies therefore the basic difference between arts and sciences. Science deals with what already exists, but art is concerned with creation. The subject-matter of a science is immutable, but the subject-matter of an art is the formation of things as yet non-existent, but which can be made by human being. The contemplative philosopher is not interested in initiating anything, but rather wants to comprehend and arrange the forms of existing, eternal things. Moreover, the ultimate purpose of the contemplative science is the pursuit of knowledge for its own sake, but in the productive arts the end-result is an actual product (Mikkeli 1997, pp. 212–213)[^mikkeli-1997].
    step1: |-
      萨巴雷拉由此指明技艺与科学的基本差异。科学研究已然存在的东西，技艺则关乎创造。科学的题材不可改变，技艺的题材则是尚不存在、但可由人制作出来的东西的形成。静观哲学家无意开启什么，而是要理解并安排既有永恒之物的诸形式。此外，静观科学的终极目的是为知识自身而追求知识，而生产性技艺的最终结果是一个实际的产品（Mikkeli 1997, pp. 212–213）[^mikkeli-1997]。
    step2: |-
      萨巴雷拉由此点明技艺与科学的根本差异：科学研究已然存在之物，技艺则关乎创造。科学的题材不可变易，技艺的题材却是把尚不存在、但可由人力制作的东西造形出来。静观哲学家无意开创什么，只求理解并整列既有永恒之物的诸形式。而且，静观科学的终极目的是为知识本身而求知识，生产性技艺的最终结果则是一件实实在在的产品（Mikkeli 1997, pp. 212–213）[^mikkeli-1997]。
