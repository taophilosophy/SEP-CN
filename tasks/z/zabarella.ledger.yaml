      It is this very distinction between the method of inquiry and the order of teaching that led Zabarella to a bitter controversy with his Paduan college Francesco Piccolomini (1523–1607). They both agreed that ethical inquiry must proceed by deduction from an understanding of the end. In Zabarella’s view all the disciplines whose end is action should be explained in this same way. But Piccolomini could not bring himself to admit that the order of teaching, in ethics as well as in in other practical disciplines, should follow this order of apprehension. Thus the fundamental question embedded in this dispute is the following: Is the order of teaching a particular discipline necessary or contingent? Zabarella argued for the former: both in discovery and in teaching, one should follow the synthetic order in the sciences and the analytic order in the arts. By making a sharp distinction between the method of discovery and the order of teaching, Piccolomini instead embraced a contingent view of pedagogical method. Wishing to teach others, Piccolomini saw his duty as that of starting out from first principles (*a primis principiis*). In such a case it is better to begin with the simpler matters and progress toward the end or goal. (Lines 2002, pp. 254–263)[^lines-2002]
    step1: |-
      正是探究方法与教学秩序之间的这一区分，使萨巴雷拉与他的帕多瓦同事弗朗切斯科·皮科洛米尼（1523–1607）陷入一场激烈的论战。两人都同意，伦理探究必须从对目的的理解出发通过演绎来进行。在萨巴雷拉看来，一切以行动为目的的学科都应以同样的方式得到说明。但皮科洛米尼无法承认，伦理学以及其他实践学科中的教学秩序应当遵循这一把握的秩序。因此，这场论战所蕴含的根本问题是：一门学科的教授秩序是必然的还是偶然的？萨巴雷拉主张前者：无论在发现中还是在教学中，都应在科学中遵循综合秩序，在技艺中遵循分析秩序。皮科洛米尼则通过在发现方法与教学秩序之间作出严格区分，转而采纳了一种视教学方法为偶然的观点。由于想要教导他人，皮科洛米尼把自己的职责视为从第一原理出发（*a primis principiis*）。在这种情况下，最好从较简单的事项开始，向目的或目标推进。（Lines 2002, pp. 254–263）[^lines-2002]
    step2: |-
      正是探究方法与教学秩序的这一区分，使萨巴雷拉与帕多瓦同事弗朗切斯科·皮科洛米尼（1523–1607）爆发了激烈的论战。两人都同意：伦理探究必须从对目的的理解出发、经演绎而推进。在萨巴雷拉看来，一切以行动为目的的学科皆应如此说明。但皮科洛米尼无论如何不肯承认：伦理学以及其他实践学科的教学秩序应当遵循这一把握的秩序。于是，这场论战埋藏的根本问题是：一门学科的教授秩序究竟是必然的还是偶然的？萨巴雷拉取前者：无论发现还是教学，都应在科学中循综合秩序，在技艺中循分析秩序。皮科洛米尼则在发现方法与教学秩序之间划下严格界线，转而持一种视教学方法为偶然的立场。既然志在教导他人，皮科洛米尼便把职责视为从第一原理（*a primis principiis*）出发；此时更好的做法是由较简单的事项起步，朝目的或目标推进。（Lines 2002, pp. 254–263）[^lines-2002]
