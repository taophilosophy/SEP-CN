      Zabarella’s name has been linked to the development of modern science since the beginning of the twentieth century. John Herman Randall published already in 1940 (and again in 1961) his famous thesis that “the School of Padua” was a precursor of modern science. Following Ernst Cassirer, Randall referred to the Renaissance discussions of *regressus-*method up to Zabarella as a preparation for Galileo Galilei’s new method of natural science. Randall’s thesis has been defended since, most notably by William A. Wallace (Wallace, 1988). However, the Aristotelian terminology and doctrines that Zabarella and Galileo share seem for the most part to have been commonplaces of late medieval and Renaissance thought. Galileo may have known Zabarella’s writings, but far more important source for Galileo was the Jesuit scholars, above all Paolo della Valle, working at the Collegio Romano at Rome (Wallace 1999, p. 338)[^wallace-1999].
    step1: |-
      自二十世纪初以来，萨巴雷拉的名字便与现代科学的发展联系在一起。约翰·赫尔曼·兰德尔早在 1940 年（1961 年又再度）发表其著名论题：“帕多瓦学派”是现代科学的先声。追随恩斯特·卡西尔，兰德尔把直至萨巴雷拉的文艺复兴回归法（*regressus*）讨论称为伽利略·伽利莱自然科学新方法的准备。兰德尔的论题此后不断有人辩护，最著名者为威廉·A·华莱士（Wallace, 1988）。不过，萨巴雷拉与伽利略所共享的亚里士多德式术语与学说，大体上似乎是晚期中世纪与文艺复兴思想中的老生常谈。伽利略或许读过萨巴雷拉的著作，但对伽利略来说远为重要的来源，是在罗马学院（Collegio Romano）工作的耶稣会学者，首先是保罗·德拉瓦莱（Paolo della Valle）（Wallace 1999, p. 338）[^wallace-1999]。
    step2: |-
      自二十世纪初以来，萨巴雷拉的名字便与现代科学的兴起缠绕在一起。约翰·赫尔曼·兰德尔早在 1940 年（1961 年重申）便发表了那项著名论题：“帕多瓦学派”是现代科学的先声。他追随恩斯特·卡西尔，把文艺复兴时期直至萨巴雷拉的回归法（*regressus*）讨论，视为伽利略·伽利莱自然科学新方法的先导。此后为兰德尔论题辩护的代不乏人，最有力者是威廉·A·华莱士（Wallace, 1988）。不过，萨巴雷拉与伽利略共享的那些亚里士多德式术语与学说，大体只是晚期中世纪与文艺复兴思想的公共资源。伽利略也许读过萨巴雷拉的著作，但对他远为重要的来源，是在罗马学院（Collegio Romano）执教的耶稣会学者，首推保罗·德拉瓦莱（Paolo della Valle）（Wallace 1999, p. 338）[^wallace-1999]。
