    source: |-
      However, Zabarella was not concerned solely with the separation between the theoretical sciences and the practical and productive disciplines, but dealt also with the relationships and hierarchy among the theoretical sciences themselves. The contemplative or speculative sciences, for Zabarella, are in Aristotelian manner only three in number: divine science, also called metaphysics, mathematics, and natural philosophy. Zabarella presents these contemplative sciences as being the only defenders of true knowledge. Zabarella emphasised in many instances that each speculative science should demonstrate their own principles and not borrow them from metaphysics. According to Zabarella, each discipline can be distinguished from others either with respect to the object considered (*res considerata*) or with respect to the way of considering (*modus considerandi*) (Pozzo 1998)[^pozzo-1998]. Natural philosophy, which deals with corporeal beings that have an inner principle of movement, differs from metaphysics (which contemplates being as being) and from mathematics (which deals with abstracted beings) in both ways. As a result, natural philosophy is autonomous and independent of both the other contemplative sciences. Zabarella’s philosophical position is in line with general sixteenth-century trends, especially the rise of the natural philosophy textbook and the development of natural philosophy as an autonomous discipline within the universities (Schmitt 1988; Lines 2001)[^lines-2001][^schmitt-1988].
    step1: |-
      不过，萨巴雷拉并非只关心理论科学与实践、生产学科之间的分立，他也处理理论科学自身之间的关系与等级。在萨巴雷拉看来，静观的或思辨的科学依亚里士多德式的方式只有三门：神圣科学（亦称形而上学）、数学和自然哲学。萨巴雷拉把这些静观科学呈现为真知的唯一捍卫者。他多次强调，每门思辨科学应当证明自己的原理，而不应从形而上学借取原理。按萨巴雷拉的说法，每门学科都可以在两个方面与其他学科区分开来：或是就被考虑的对象（*res considerata*）而言，或是就考虑的方式（*modus considerandi*）而言（Pozzo 1998）[^pozzo-1998]。自然哲学处理具有内在运动原则的形体存在者，在这两个方面都既不同于形而上学（它静观作为存在的存在），也不同于数学（它处理被抽象的存在者）。因此，自然哲学是自主的，独立于另外两门静观科学。萨巴雷拉的哲学立场与十六世纪的整体趋势一致，尤其是自然哲学教科书的兴起以及自然哲学作为一门自主学科在大学中的发展（Schmitt 1988; Lines 2001）[^lines-2001][^schmitt-1988]。
    step2: |-
      不过，萨巴雷拉关注的并不只是理论科学与实践、生产学科的分立，也处理理论科学内部的关系与等级。在他看来，静观（或思辨）的科学依亚里士多德的方式仅有三门：神圣科学（亦称形而上学）、数学与自然哲学。他把这些静观科学呈现为真知唯一的守护者，并一再强调每门思辨科学都应证明自己的原理，而不向形而上学借取。依萨巴雷拉之见，学科之间的区分要么系于所考虑的对象（*res considerata*），要么系于考虑的方式（*modus considerandi*）（Pozzo 1998）[^pozzo-1998]。自然哲学处理具有内在运动原则的形体存在者，在这两方面都既异于形而上学（后者静观作为存在的存在），也异于数学（后者处理被抽象的存在者）。因此自然哲学是自主的，不依附于另外两门静观科学。这一哲学立场与十六世纪的整体趋势合拍，尤其是自然哲学教科书的兴起与自然哲学作为一门自主学科在大学中的成长（Schmitt 1988; Lines 2001）[^lines-2001][^schmitt-1988]。
