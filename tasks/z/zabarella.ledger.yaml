    source: |-
      Giacomo (or Jacopo) Zabarella was born into an old and noble Paduan family on the 5ᵗʰ of September in 1533. From his father Giulio Zabarella he inherited the title of palatine count. Zabarella enjoyed a humanist education and entered the University of Padua, where he received the doctorate in 1553. Zabarella had many famous teachers, like Francesco Robortello in the humanities, Bernardino Tomitano in logic, Marcantonio Genua in physics and metaphysics, and Pietro Catena in mathematics. Unlike most of his contemporaries who had studied natural philosophy, Zabarella never took a degree in medicine. His entire teaching career was spent at his native university. He began his career in 1564 when he obtained the first chair (or professorship) of logic succeeding Bernardino Tomitano. Five years later he moved to the more prestigious and more lucrative second chair of the extraordinary professor of natural philosophy. In 1577 he was promoted to the first extraordinary chair of natural philosophy. Finally, in 1585, Zabarella obtained the second ordinary chair of natural philosophy, which he held until his death. The statutes of the University of Padua prevented him, as a native Paduan, from obtaining the first ordinary chair in natural philosophy. Zabarella died at the age of 56 on the 15ᵗʰ of October in 1589.
    step1: |-
      贾科莫（或雅各波）·萨巴雷拉 1533 年 9 月 5 日出生于帕多瓦一个古老而高贵的家族。他从父亲尤利奥·萨巴雷拉（Giulio Zabarella）那里继承了宫廷伯爵（palatine count）的头衔。萨巴雷拉接受了人文主义教育，进入帕多瓦大学，并于 1553 年获得博士学位。萨巴雷拉有许多著名的老师：人文领域的弗朗切斯科·罗贝尔泰洛（Francesco Robortello）、逻辑领域的贝尔纳迪诺·托米塔诺（Bernardino Tomitano）、物理学与形而上学领域的马尔坎托尼奥·真纳（Marcantonio Genua），以及数学领域的彼得罗·卡泰纳（Pietro Catena）。与大多数研习过自然哲学的同代人不同，萨巴雷拉从未取得医学学位。他的整个教学生涯都在家乡大学度过。他于 1564 年开始其教学生涯，是年他接替贝尔纳迪诺·托米塔诺获得逻辑学第一教席（或教授职位）。五年后，他转任声望更高、俸禄更丰的自然哲学编外教授第二教席。1577 年他晋升为自然哲学第一编外教席。最终在 1585 年，萨巴雷拉获得自然哲学第二常任教席，并保有该席位直至去世。帕多瓦大学的章程使这位土生土长的帕多瓦人无法获得自然哲学第一常任教席。萨巴雷拉于 1589 年 10 月 15 日去世，享年 56 岁。
