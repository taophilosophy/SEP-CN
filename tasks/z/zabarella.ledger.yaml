    source: |-
      The publications of Zabarella reflect his teaching in the Aristotelian tradition. The first of his publications was *Opera logica*, which appeared in Venice in 1578. Zabarella had time to write this collection of logical works in 1576, when a plague raged in Veneto sending Zabarella into the countryside with his family. This was one of the very few times in his life when he left the city of Padua. Zabarella’s next published work, *Tabula logicae*, came out two years later and his commentary on Aristotle’s *Posterior Analytics* appeared in 1582. *De doctrinae ordine apologia*, which appeared in 1584, was a reply to Francesco Piccolomini who had criticised Zabarella’s ideas on logic. The first of Zabarella’s works in natural philosophy, *De naturalis scientiae constitutione*, came out in 1586. This introduction to the field was connected to his major opus in natural philosophy, *De rebus naturalibus*, the first edition of which was published posthumously in 1590. It contained 30 different treatises on Aristotelian natural philosophy and Zabarella wrote the introduction of the book only few weeks before his death. Zabarella’s two sons edited two of his incomplete commentaries on Aristotle’s texts, which were also published posthumously: the commentary on *Physics* (1601), and the commentary on *On the Soul* (1605) (Mikkeli 1992, p. 19)[^mikkeli-1992]. Commentaries on *On Generation and Corruption* and *Meteorology IV* were also appended to his commentary on the *Physics* (1602) .
    step1: |-
      萨巴雷拉的出版著作反映了他在亚里士多德传统中的教学。他的第一部出版物是《逻辑著作》（*Opera logica*），1578 年在威尼斯问世。1576 年，威内托瘟疫肆虐，萨巴雷拉携家人避居乡间，他才得空写出这部逻辑著作汇编。这是他一生中极少数离开帕多瓦城的时机之一。萨巴雷拉下一部出版的著作《逻辑表》（*Tabula logicae*）两年后刊行，他为亚里士多德《后分析篇》（*Posterior Analytics*）所作的评注则于 1582 年出版。1584 年问世的《为学说之序辩护》（*De doctrinae ordine apologia*）是对弗朗切斯科·皮科洛米尼的回击，后者曾批评萨巴雷拉关于逻辑的想法。萨巴雷拉第一部自然哲学著作《论自然科学的构造》（*De naturalis scientiae constitutione*）于 1586 年刊行。这部该领域的导论性著作与他的自然哲学主要著作《论自然事物》（*De rebus naturalibus*）相关联，后者的第一版于 1590 年在他死后出版。该书包含论亚里士多德自然哲学的 30 篇不同专题论文，而萨巴雷拉仅在去世前几周才写下该书的导言。萨巴雷拉的两个儿子整理了他为亚里士多德文本所作的两部未完成评注，同样在他身后出版：《物理学》评注（1601）与《论灵魂》评注（1605）（Mikkeli 1992, p. 19）[^mikkeli-1992]。《论生灭》与《气象学》第四卷的评注也附于其《物理学》评注（1602）之后。
    step2: |-
      萨巴雷拉的著述处处映照其亚里士多德传统中的教学。首部刊行之作是《逻辑著作》（*Opera logica*），1578 年在威尼斯问世。1576 年威内托暴发瘟疫，萨巴雷拉携家避居乡间，方才腾出时间写成这部逻辑著作汇编——这是他一生中极少数几次离开帕多瓦城之一。两年后，《逻辑表》（*Tabula logicae*）刊行；1582 年出版的则是他注疏亚里士多德《后分析篇》（*Posterior Analytics*）的评注。1584 年的《为学说之序辩护》（*De doctrinae ordine apologia*）回击了弗朗切斯科·皮科洛米尼——此人此前批评过萨巴雷拉的逻辑学说。萨巴雷拉第一部自然哲学著作《论自然科学的构造》（*De naturalis scientiae constitutione*）于 1586 年刊行；这部领域导论与他的自然哲学主要著作《论自然事物》（*De rebus naturalibus*）相关联，后者第一版于 1590 年他身后出版，收有论亚里士多德自然哲学的专题论文三十篇，而全书的导言是萨巴雷拉在去世前几周写就的。他的两个儿子编成他两部未完成的亚里士多德文本评注，同样在身后刊行：《物理学》评注（1601）与《论灵魂》评注（1605）（Mikkeli 1992, p. 19）[^mikkeli-1992]。《论生灭》和《气象学》第四卷的评注也附于《物理学》评注（1602）之后。
  - id: 5
    kind: body
    source: |-
      Giacomo Zabarella followed a very systematic style of writing in his publications. His idea was to build a coherent body of Aristotelian logic and natural philosophy. Therefore he was also interested in the classification of the disciplines and the relationships between various areas of academic learning. His use of Aristotle and other authorities was both eclectic and critical. Zabarella’s sources thus included newly recovered Greek commentators such as Alexander of Aphrodisias, Philoponus, Simplicius and Themistius, as well as medieval commentators such as Thomas Aquinas, Walter Burley and Averroes. In Zabarella’s view, Averroes, unlike his followers, accurately understood Aristotle’s philosophy despite not knowing the original texts or even the Greek language (Martin 2007, p. 15)[^martin-2007]. Zabarella himself read Greek and could therefore consult the Greek text of Aristotle and the commentators. He devoted much effort to presenting what he considered to be the true meaning of Aristotle’s texts. However, he resisted the tendency of the humanists to expunge all medieval barbarisms, preferring philosophical precision to classical elegance (W.R. Laird 2000, p. 695)[^laird-2000].
    step1: |-
      贾科莫·萨巴雷拉在其出版物中遵循一种非常系统化的写作风格。他的想法是构建一个连贯的亚里士多德逻辑与自然哲学体系。因此他也关注诸学科的分类以及各学术领域之间的关系。他对亚里士多德和其他权威的运用既是折中性的，也是批判性的。因此，萨巴雷拉的资料来源既包括新近重新面世的希腊注释家，如阿弗罗狄西亚的亚历山大、菲洛波努斯、辛普里丘和特米斯提乌斯，也包括中世纪注释家，如托马斯·阿奎那、沃尔特·伯利和阿威罗伊。在萨巴雷拉看来，阿威罗伊与其追随者不同，尽管不识原始文本、甚至不懂希腊语，却准确理解了亚里士多德的哲学（Martin 2007, p. 15）[^martin-2007]。萨巴雷拉本人通晓希腊语，因此能够查考亚里士多德与注释家们的希腊文文本。他投入大量心力来阐明他所认定的亚里士多德文本的真义。不过，他抵制人文主义者清除一切中世纪蛮风的倾向，宁要哲学上的精确，不要古典的典雅（W.R. Laird 2000, p. 695）[^laird-2000]。
    step2: |-
      贾科莫·萨巴雷拉的著述风格极为系统：他要为亚里士多德逻辑与自然哲学构筑一个融贯的整体，因而也关心诸学科的分类与各学术领域之间的关系。他对亚里士多德及其他权威的取用兼具折中与批判两面。他的资料来源既有新近重光的希腊注释家——阿弗罗狄西亚的亚历山大、菲洛波努斯、辛普里丘、特米斯提乌斯，也有中世纪注释家——托马斯·阿奎那、沃尔特·伯利、阿威罗伊。在萨巴雷拉看来，阿威罗伊不同于其追随者：虽未读过原始文本、甚至不懂希腊语，却准确把握了亚里士多德的哲学（Martin 2007, p. 15）[^martin-2007]。萨巴雷拉本人通希腊文，可以直接查考亚里士多德与注释家的希腊文原文，并花大力气阐明他所认定的文本真义。但他抵制人文主义者扫除一切中世纪蛮风的倾向——宁取哲学之精确，不取古典之典雅（W.R. Laird 2000, p. 695）[^laird-2000]。
