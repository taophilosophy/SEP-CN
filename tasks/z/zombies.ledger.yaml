      The first is verificationism, according to which a (declarative) sentence is meaningful just in case its truth or falsity can be verified. This entails that unverifiable sentences are literally meaningless, so that no metaphysical claim according to which unobservable nonphysical items exist can be true. However, since our ability to think and talk about our experiences is itself a problem for verificationism, to presuppose this view when attacking the zombie idea would beg the question. The second view appeals to Wittgenstein’s private language argument. Although not crudely verificationistic, it depends on the assumption that in order for words to be meaningful, their use must be open to public checking. But since this checkability assumption, if sound, would prove that we cannot talk about qualia in the ways defenders of the zombie possibility think we can, it too seems question-begging in the present context. According to the third view, behaviorism, there is no more to having mental states than being disposed to behave in certain ways. As a possible basis for attacking the zombie idea, behaviorism is in a similar situation to verificationism and the private language argument. Zombies would satisfy all behavioral conditions for full consciousness, so that if we could know a priori that behaviorism was correct, zombie worlds would be inconceivable for that reason. It seems unlikely, though, that behaviorism can be shown to be correct. (Dennett 1991 defends a position with strong affinities to behaviorism, though it might be better classified as a variety of functionalism)[^dennett-1991].
    step1: |-
      第一种是证实主义，按其说法，一个（陈述）句子是有意义的，当且仅当其真假可以被证实。这就蕴涵不可证实的句子字面上无意义，因此任何主张存在不可观察的非物理项目的形而上学主张都不可能是真的。然而，由于我们思考和谈论自身经验的能力本身就是证实主义的一个难题，在攻击僵尸观念时预设这种看法就是循环论证。第二种看法诉诸维特根斯坦的私人语言论证。它虽然不是粗俗的证实主义，却依赖如下假定：词语要有意义，其使用必须经得起公开核查。但既然这个可核查性假定如果成立，就会证明我们无法以僵尸可能性捍卫者所想的方式谈论感质，它在本语境中似乎也是循环论证。按照第三种看法行为主义，具有心理状态无非就是倾向于以某些方式行动。作为攻击僵尸观念的可能基础，行为主义处于与证实主义和私人语言论证相似的境地。僵尸会满足完全意识的一切行为条件，因此如果我们能先天地知道行为主义正确，僵尸世界就因这个理由而不可设想。不过，行为主义似乎不太可能被证明正确。（Dennett 1991 为一个与行为主义有强烈亲缘性的立场辩护，尽管把它归类为功能主义的一种可能更恰当）[^dennett-1991]。
    step2: |-
      第一种是证实主义：一个（陈述）句子有意义，当且仅当其真假可以证实。这蕴涵着不可证实的句子字面上没有意义，于是任何主张存在不可观察的非物理项目的形而上学学说都为假。然而，我们思考和谈论自身经验的能力，本身就是证实主义的难题；在攻击僵尸观念时预设这一学说，便是循环论证。第二种看法诉诸维特根斯坦的私人语言论证。它虽非粗陋的证实主义，却依赖一个假定：语词要有意义，其使用必须容得下公开核查。可是这个“可核查性”假定若成立，恰恰证明我们无法以僵尸可能性辩护者所想的那种方式谈论感质——在本语境中，它同样有循环论证之嫌。第三种看法是行为主义：具有心理状态，无非就是倾向于以某些方式行动。作为攻击僵尸观念的可能根据，行为主义与证实主义、私人语言论证处境相仿：僵尸会满足完全意识的一切行为条件，故而倘若我们能先天地知道行为主义正确，僵尸世界便因此不可设想。只是，行为主义似乎不大可能被证明正确。（Dennett 1991 所辩护的立场与行为主义高度亲缘，尽管归入功能主义的一种或许更贴切）[^dennett-1991]。
