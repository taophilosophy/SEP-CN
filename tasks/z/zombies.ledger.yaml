      *Can we really imagine zombies?* Daniel Dennett thinks those who accept the conceivability of zombies have failed to imagine them thoroughly enough: ‘they invariably underestimate the task of conception (or imagination), and end up imagining something that violates their own definition’ (1995, p. 322. Marcus 2004 makes a related point)[^marcus-2004]. Given his broadly functionalist model of consciousness, he argues, we can see why the ‘putative contrast between zombies and conscious beings is illusory’ (325. See also his 1991; 1999). Consciousness is ‘not a single wonderful separable thing … but a huge complex of many different informational capacities’ (1995, 324. Cottrell 1999 supports this approach)[^cottrell-1999].
    step1: |-
      *我们真的能想象僵尸吗？*丹尼尔·丹尼特认为，接受僵尸可设想的人没有足够彻底地想象它们：“他们总是低估构想（或想象）的任务，结果想象出来的东西违反了他们自己的定义”（1995, p. 322。Marcus 2004 提出了一个相关的论点）[^marcus-2004]。鉴于他大体上是功能主义的意识模型，他论证说，我们可以看出为什么“僵尸与有意识的存在者之间的所谓对照是幻觉”（325。另见他的 1991; 1999）。意识“不是单一的可分离的奇妙之物……而是一个由许多不同的信息能力构成的庞大复合体”（1995, 324。Cottrell 1999 支持这一进路）[^cottrell-1999]。
    step2: |-
      *我们真能想象僵尸吗？*丹尼尔·丹尼特认为，接受僵尸可设想的人把想象做得不够彻底：“他们无一例外低估了构想（或想象）这件差事，结果想象出来的东西违反了他们自己的定义”（1995, p. 322。Marcus 2004 提出过相关论点）[^marcus-2004]。他的意识模型大体是功能主义的；照此看来，“僵尸与有意识的存在者之间那道表面的对照是幻觉”（325。另见其 1991; 1999）。意识“不是单一的、可分离的奇妙之物……而是一个由形形色色信息能力组成的庞大复合体”（1995, 324。Cottrell 1999 支持这一进路）[^cottrell-1999]。
