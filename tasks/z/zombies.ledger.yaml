      In the nineteenth century scientists began to think that physics was capable of explaining all physical events that were explicable at all. It seemed that every physical effect has a physical cause: that the physical world is ‘closed under causation’. The developing science of neurophysiology was set to extend such explanations to human behavior. But if human behavior is explicable physically, how does consciousness fit into the story? One response — physicalism (or materialism) — is to insist that consciousness too involves only physical processes. However, the phenomena of consciousness are hard to account for in those terms, and some thinkers concluded with Descartes that something nonphysical must be involved. Given they accepted the causal closure of the physical, they were forced to conclude that consciousness has no effects on the physical world. On this view human beings are ‘conscious automata’, as T. H. Huxley put it: all physical events, human behavior included, are explicable in terms of physical processes; and the phenomena of consciousness are causally inert by-products — epiphenomena (see James 1890, Chapter 5)[^james-1890]. It eventually became clear that this view entailed there could be purely physical organisms exactly like us except for lacking consciousness. G. F. Stout argued that if epiphenomenalism (the more familiar name for the ‘conscious automaton’ theory) is true,
    step1: |-
      到了十九世纪，科学家们开始认为，物理学能够解释一切可解释的物理事件。似乎每个物理结果都有一个物理原因：物理世界在“因果上封闭”。正在发展的神经生理学准备把这类解释扩展到人类行为。但如果人类行为可以在物理上解释，意识如何进入这幅图景？一种回应——物理主义（或唯物论）——是坚持意识也只涉及物理过程。然而，意识现象很难用这些术语来说明，一些思想家与笛卡尔一样得出结论：必定有某种非物质的东西参与其中。既然他们接受物理的因果闭合，他们就被迫得出结论：意识对物理世界没有作用。按照这种观点，人是“有意识的自动机”，如 T. H. 赫胥黎所言：一切物理事件，包括人类行为，都可以用物理过程来解释；而意识现象是因果上惰性的副产品——副现象（见 James 1890, Chapter 5）[^james-1890]。人们最终清楚地看到，这种观点蕴涵着：可能存在纯粹物理的有机体，与我们完全一样，只是缺乏意识。G. F. 斯托特论证说，如果副现象主义（“有意识的自动机”理论更为人熟知的名称）是真的，
    step2: |-
      到了十九世纪，科学家开始相信：凡物理学能解释的物理事件，它都能解释。看起来，每个物理结果都有一个物理原因——物理世界“在因果上封闭”。方兴未艾的神经生理学正要把这类解释推广到人类行为。可是，倘若人类行为在物理上可解释，意识在这幅图景中置于何处？一种回应是物理主义（或唯物论）：坚持意识同样只涉及物理过程。然而，意识现象很难用这类术语说清，于是一些思想家步笛卡尔之后尘，断定必有某种非物质的东西参与其中。既然他们接受物理的因果闭合，便不得不承认：意识对物理世界没有任何作用。照此看法，人是“有意识的自动机”，T. H. 赫胥黎如此称呼：一切物理事件——人类行为在内——都可用物理过程解释；意识现象则是因果上惰性的副产品，即副现象（见 James 1890, Chapter 5）[^james-1890]。人们最终看清，这一看法蕴涵着：可以存在纯然物理的有机体，与我们毫无差别，唯独没有意识。G. F. 斯托特论证道：倘若副现象主义（“有意识的自动机”理论更为人熟知的名字）为真，
