      *“力量性质”。*对僵尸观念的另一个有趣反驳基于（有争议的）“力量性质”观念：一切性质既是倾向性的又是质性的，而且一个事物的诸倾向与它的诸性质同一。例如 Alexander Carruth（2016）论证说，可设想论证预设：物理性质是倾向性的，而现象性质是质性的。在此基础上，我们世界的一个僵尸复制品将例示我们世界的倾向性性质，但不例示其现象性质。力量性质观点先天地排除了这一点，使之甚至不可设想。因为如果一个事物的诸倾向与它的诸性质同一，那么没有东西能够例示某些倾向性性质而不例示所有据称与它们同一的性质。Henry Taylor（2017）反驳这一论证路线，主张它依赖于对物理与现象之区分的一个不可信的说明，特别是论证物理不能被局限于倾向性的。
