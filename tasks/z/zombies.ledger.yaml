      Those who exploited the zombie idea in the 1970s typically assumed without argument that zombies are not just conceivable but possible (e. g. Campbell 1970, Nagel 1970)[^campbell-1970][^nagel-1970]. When Chalmers reactivated the idea he found the conceivability of zombies ‘obvious’, remarking that ‘it certainly seems that a coherent situation is described; I can discern no contradiction in the description’ (1996, p. 96). However, he also recognized that this intuition cannot be relied on. The nature of conscious experience is after all hard to understand: what strikes some people as obviously possible could still turn out to harbour hidden contradictions (Nagel 1998; Stoljar 2001)[^nagel-1998][^stoljar-2001]. Clearly, those who maintain that zombies are conceivable must provide justification, recognizing that, being an epistemic claim dependent on our cognitive abilities, it is defeasible.
    step1: |-
      那些在 1970 年代利用僵尸观念的人，通常不加论证地假定僵尸不仅可设想而且可能（如 Campbell 1970, Nagel 1970）[^campbell-1970][^nagel-1970]。查尔莫斯重新激活这一观念时，发现僵尸的可设想性是“显而易见的”，并评论说：“看起来确实描述了一个融贯的情境；我在这个描述中看不出任何矛盾”（1996, p. 96）。然而，他也认识到这一直觉不可依赖。意识经验的性质毕竟难以理解：在某些人看来明显可能的东西，仍可能暗藏矛盾（Nagel 1998; Stoljar 2001）[^nagel-1998][^stoljar-2001]。显然，主张僵尸可设想的人必须提供辩护，并且承认：作为一个依赖我们认知能力的认识论主张，它是可驳倒的。
