      *Knowing about and referring to qualia*. Recall that by definition a zombie world is just like our world as physicalists suppose it to be, but without consciousness. Since this implies that consciousness depends on something nonphysical, it follows that zombies (assuming they are possible in the first place) could be made conscious by the addition of something nonphysical, which might as well be qualia. And given that a zombie world would be causally closed, these qualia would have to be causally inert: perhaps still caused by the correlated physical processes, perhaps just parallel to them. It therefore seems that if a zombie world is conceivable, so is epiphenomenalism. (Of course this does not require epiphenomenalism to be *actually* true as well as conceivable.) If that is correct, objections to the conceivability of epiphenomenalism are also objections to the conceivability of zombies, the most obvious of these being simply that experiences have effects on behavior. A less obvious objection starts from the fact that we *refer to and know about* our conscious experiences — which can hardly be denied, since otherwise we could not be discussing these ideas in the first place. The objection appeals to the widely held view that whatever we can know about or refer to must have effects on us, if only indirectly (Kripke 1972/80)[^kripke-1972]. On that basis our counterparts in epiphenomenalistic worlds could not know about or refer to their qualia, with the consequence that (given the above reasoning) neither epiphenomenalistic worlds nor zombie worlds are conceivable.
