  - id: 13
    kind: body
    source: |-
      A metaphor of Saul Kripke’s helps to show how the zombie idea threatens physicalism (Kripke 1972/80, 153f.)[^kripke-1972]. Imagine God creating the world and deciding to bring into existence the whole of the purely physical universe. Having created this physical universe, did he have to do any more work to provide for consciousness? Answering yes to this question implies there is more to consciousness than the physical facts alone can supply. If nothing else, it implies that consciousness depends at least partly on nonphysical properties, ones that would not exist in a purely physical world; it would be a zombie world. Physicalists, on the other hand, are committed to answering no. They have to say that by fixing the purely physical facts, God did everything necessary to fix the mental facts about the organisms thereby created, including their thoughts, feelings, emotions, and experiences. In other words, it seems that physicalists must say that in some sense the purely physical truths entail the mental truths (Kirk 1974a, 1974b argued that physicalism requires an ‘Entailment Thesis’ to that effect)[^kirk-1974a]. If indeed fixing the physical facts alone is enough to fix the mental facts, then a zombie world is impossible.
    step1: |-
      索尔·克里普克的一个比喻有助于说明僵尸观念如何威胁物理主义（Kripke 1972/80, 153f.）[^kripke-1972]。设想上帝创造世界，并决定使整个纯粹物理的宇宙存在。在创造这个物理宇宙之后，他还需要做更多工作来提供意识吗？对此回答“是”，就意味着意识所需要的东西不止物理事实所能供给的。至少这意味着意识至少部分地依赖于非物理性质——那些在纯粹物理世界中不会存在的性质；那样就会是一个僵尸世界。另一方面，物理主义者必须回答“否”。他们必须说，通过固定纯粹物理的事实，上帝已经做了固定由此创造的有机体的一切心理事实所需的一切，包括他们的思想、情感、情绪与经验。换言之，物理主义者似乎必须说，纯粹物理的真理在某种意义上蕴涵心理真理（Kirk 1974a, 1974b 论证物理主义需要一种此意义上的“蕴涵论题”）[^kirk-1974a]。如果单靠固定物理事实确实足以固定心理事实，那么僵尸世界就是不可能的。
