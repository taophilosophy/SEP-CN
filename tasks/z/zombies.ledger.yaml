      1970 年代那些借用僵尸观念的人，通常不加论证便假定：僵尸不仅可设想，而且可能（如 Campbell 1970, Nagel 1970）[^campbell-1970][^nagel-1970]。查尔莫斯重新激活这一观念时，觉得僵尸的可设想性“显而易见”，并评论说：“看来确实描述了一个融贯的情境；我在这个描述里看不出任何矛盾”（1996, p. 96）。然而他也清楚，这一直觉靠不住。意识经验的性质毕竟晦暗难明：在某些人眼里明明白白的可能性，说不定暗藏矛盾（Nagel 1998; Stoljar 2001）[^nagel-1998][^stoljar-2001]。显然，主张僵尸可设想的人必须给出辩护，并承认这一点：这是一个依赖我们认知能力的认识论主张，因而是可推翻的。
