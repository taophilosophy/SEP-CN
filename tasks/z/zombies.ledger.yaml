      *认识接触问题。*刚才似乎表明：如果僵尸是可设想的，那么副现象主义世界与平行论世界也是可设想的。在那种情况下，僵尸的朋友们必须解释：这类世界中的副现象感质如何可能成为亲知的对象，或者确实对人们的生活做出任何亲密的贡献；柯克（2005; 2008）在这里提出，僵尸观念面临进一步的困难。当我们考虑注意、思考、比较、尤其是回忆我们的经验这类活动时，这一困难显现出来。这些活动使我们与经验发生“认识接触”，并且涉及认知加工，而认知加工又涉及引起其他变化的变化。副现象感质因因果惰性而不可能完成这种加工；因此，如果它们实际构成我们的经验（正如副现象主义与平行论所蕴涵的），那么必要的加工必定是纯粹物理的。麻烦在于，僵尸的故事似乎使这种加工不可能使我们与副现象感质发生认识接触。这是因为它为此目的所能诉诸的全部资源，只是假定的神经过程对感质的因果作用以及感质与它们的同构：这些因素无法完成必要的认知工作（Kirk 2005; 2008）[^kirk-2005]。如果这是对的，副现象感质与僵尸的观念就导致矛盾。它们蕴涵这样一种意识概念：要求人们与他们的感质处于认识接触之中，同时又排除这种接触的可能性。
