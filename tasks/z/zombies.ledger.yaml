      Many physicalists hold that both the zombie idea and Frank Jackson’s knowledge argument can be dealt with through a proper understanding of the nature of phenomenal concepts (roughly, the concepts we use when conveying the character of our experiences: for example ‘sweet’, ‘the way I see blue’). Exponents of the conceivability argument hold that the supposed ‘explanatory gap’ between the physical and the phenomenal — which is expressed in the idea that zombies are conceivable — brings with it an ontological gap. According to the ‘phenomenal concept strategy’ (Stoljar 2005)[^stoljar-2005] there is really only a conceptual gap: phenomenal concepts have features which mislead us into supposing there is an ontological gap in addition to an epistemic one, when there isn’t.
