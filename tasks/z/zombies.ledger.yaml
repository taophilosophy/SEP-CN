      These ideas are exploited in what Chalmers calls ‘Russellian monism’ (a variety of neutral monism). In our world, he suggests, the underlying intrinsic properties might be ‘phenomenal properties, or they might be protophenomenal properties: properties that collectively constitute phenomenal properties when organized in the appropriate way’ (2010: p. 151); while in some other worlds the corresponding intrinsic physical properties did not provide for consciousness. If the intrinsic properties which supposedly provide for our consciousness are nevertheless classified as physical, exponents can deny the possibility of zombies if these are understood to be our ‘full’ physical duplicates. At the same time they can concede the possibility of zombies which duplicate us only in their structural properties. As he points out, this view is ‘a highly distinctive form of physicalism that has much in common with property dualism and that many physicalists will want to reject’ (Chalmers 2010, p. 152; see also Pereboom 2011)[^chalmers-2010][^pereboom-2011]. One obstacle to counting it as physicalism is that it seems unable to explain why the special intrinsic properties in our world should provide for consciousness, while those which perform the same functions in those other worlds do not: this has to be accepted as a brute fact.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Philip Goff (2010; see also his 2017) suggests that this loophole for Russellian versions of physicalism weakens the zombie argument. He recommends instead an argument from ghosts: pure subjects of experience without any physical nature. He argues that such ghosts are conceivable and possible, and that they provide an argument against physicalism which leaves no loophole for Russellian monism. (Physicalists are likely to object that arguments against the conceivability of zombies can also be mobilized against ghosts.)
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      ### 5.4 Other objections
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      *Special factors*. It has been suggested that there are special factors at work in the psychophysical case which have a strong tendency to mislead us. For example it is claimed that what enables us to imagine or conceive of states of consciousness is a different cognitive faculty from what enables us to conceive of physical facts: ‘there are significant differences between the cognitive factors responsible for Cartesian intuitions [such as those about zombies] and those responsible for modal intuitions of a wide variety of other kinds’ (Hill and McLaughlin 1999, p. 449. See also Hill 1997)[^hill-1997][^hill-1999]. The suggestion is that these differences help to explain the ease with which we seem able to conceive of zombies, and the difficulty we have in understanding the claim that they are nevertheless impossible.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      *Conditional analysis*. Another line of objection rests on conditional analyses of the concept of qualia. Roughly, the idea is that *if* there actually are certain nonphysical properties which fit our conception of qualia, then that is what qualia are, in which case zombies are conceivable; but *if* there are no such nonphysical properties, then qualia are whichever physical properties perform the appropriate functions, and zombies are not conceivable. It is argued that this approach enables physicalists to accept that the possibility of zombies is conceivable, while denying that zombies are conceivable (Hawthorne 2002a; Braddon-Mitchell 2003. For criticism see Alter 2007; Chalmers 2010, pp. 159–59)[^alter-2007][^braddon-mitchell-2003][^chalmers-2010][^hawthorne-2002a].
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      *Causal essentialism*. According to the theory of causal essentialism, the causal properties of physical properties are essential to them. Brian Garrett (2009) exploits this theory to argue that the zombie argument against physicalism depends on broadly Humean assumptions about the laws of nature and property identity which presuppose the falsity of causal essentialism. If we reject those assumptions and accept that some physical properties have essentially the capacity to produce consciousness, then ‘we cannot accept the genuine possibility of zombie worlds’ even if such worlds are conceivable (see also Aranyosi 2010)[^aranyosi-2010].
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      *More on zombies’ utterances*. Consider a zombie world that is an exact physical duplicate of our world and contains zombie twins of all philosophers, including some who appeal to the conceivability argument. Katalin Balog (1999) argues that while their utterances would be meaningful, their sentences would not always mean what they do in our mouths. She further argues — to oversimplify — that if the conceivability argument were sound in actual philosophers’ mouths, then it would be sound in the mouths of zombie philosophers too. But since by hypothesis physicalism is true in their world, their argument is not sound. Therefore the conceivability argument used by actual philosophers is not sound either. If this argument works, it has the piquant feature that ‘the zombies that antiphysicalists think possible in the end undermine the arguments that allege to establish their possibility’ (502. Chalmers offers brief replies in his 2003; 2010, pp. 159–60)[^chalmers-2003].
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      *The anti-zombie argument for physicalism*. The conceivability argument — which assumes physicalism entails that zombies are impossible — purports to refute it by showing they are possible. As we saw, the simplest version of this argument goes: (1) zombies are conceivable; (2) whatever is conceivable is possible; (3) therefore zombies are possible. However, ‘anti-zombies’ — duplicates of ourselves made conscious by the purely physical facts (Frankish 2007)[^frankish-2007] — also seem conceivable. So we have a parallel argument: (1*) anti-zombies are conceivable; (2) whatever is conceivable is possible; (3*) therefore anti-zombies are possible. But (3) and (3*) cannot both be true, since if the purely physical facts about anti-zombies make them conscious, then the exactly similar physical facts about zombies make them conscious too, and they are not zombies after all (Frankish 2007; Marton 1998; Piccinini 2017; Sturgeon 2000, pp. 114–116)[^frankish-2007][^marton-1998][^piccinini-2017][^sturgeon-2000]. One moral is that we should reject the inference from conceivability to possibility. (Brown 2010 argues that if anti-zombies are conceivable, then zombies are inconceivable.)[^brown-2010] The most promising reply for exponents of the conceivability argument seems to be to deny that anti-zombies are conceivable (Chalmers 2010, 180)[^chalmers-2010].
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
