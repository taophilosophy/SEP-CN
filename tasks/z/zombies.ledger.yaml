      ## 6. Other issues
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      The list of ‘Related Entries’ below indicates the range and depth of the issues raised by the zombie idea, only some of which have been touched on in this entry. If zombies are really possible, then not only is physicalism problematic, so are widely held views on other topics. Here are three striking examples.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      ### 6.1 Mental causation
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Descartes accepted the common assumption that not only do physical events have mental effects, but mental events have physical effects (for example, thinking about the political situation makes me write a letter). The difficulty for his dualism, it was thought, was to understand how the nonphysical could have effects on the physical. But if zombies are possible — which requires the physical world to be causally closed — there is no work for nonphysical qualia to do. In that case the difficulty is to understand how, in spite of appearances, the nonphysical could *fail* to have effects on the physical. Still supposing zombies are possible, it then becomes hard to see any alternative to parallelism or epiphenomenalism, with the radical revision of common assumptions about mental causation that those views entail. True, the friends of zombies do not seem compelled to be epiphenomenalists or parallelists about the *actual* world. They may be interactionists, holding that our world is not physically closed, and that as a matter of actual fact nonphysical properties do have physical effects. Or they may adopt some variety of panpsychism, according to which what is metaphysically fundamental is not physical properties, but phenomenal or perhaps ‘protophenomenal’ ones (Chalmers 1991, 297—299; 1999, 492; Goff 2017; Strawson 2008)[^goff-2017][^strawson-2008] — a view arguably compatible with the causal closure of the physical. But neither of those options is easy. Abandoning causal closure appears to conflict with empirical evidence; while the idea that phenomenal or quasi-phenomenal properties are fundamental remains obscure.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      ### 6.2 The function of consciousness
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      The apparent possibility of zombies also seems to pose a problem for evolutionary theory. Why did creatures with qualia survive rather than those creatures’ zombie counterparts? If zombies could have survived, what’s the use of consciousness? Owen Flanagan and Thomas Polger have used the apparent possibility of zombies to support the claim that ‘There are as yet no credible stories about why subjects of experience emerged, why they might have won — or should have been expected to win — an evolutionary battle against very intelligent zombie-like information-sensitive organisms’ (1995, 321): a problem not faced by those who reject the possibility of zombies. One response on behalf of those who do accept it is to suggest that there might be fundamental laws linking the phenomenal to the physical. Such laws would not depend on whether conscious creatures ever happened to evolve, in which case, arguably, evolution raises no special problem (Chalmers 1996, 171)[^chalmers-1996] — although the existence of such laws would pose its own problems.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      ### 6.3 Other minds
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      If qualia have no physical effects, then nothing will enable anyone to establish for certain that anyone else actually has qualia. Philosophers who believe they have a solid response to skepticism about other minds may therefore conclude that this consequence of the zombie idea is enough to condemn it. Others may draw the opposite conclusion and take the skeptical consequence as ‘a confirmation’, on the ground that we really are ignorant of others’ minds (Campbell 1970, 120)[^campbell-1970]. (Of course not all responses to other minds skepticism imply that zombies are inconceivable.)
    step1: TBD
    step2: TBD
