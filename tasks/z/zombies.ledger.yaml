      Not everyone agrees that physicalism entails the impossibility of zombies. One suggestion is that physicalists can concede there are possible worlds which are exact duplicates of our world in all purely physical respects, but where the physical properties which give rise to consciousness in our world are prevented from doing so by nonphysical items which block consciousness. That would let physicalists consistently allow the possibility of zombie worlds (Leuenberger 2008. On such ‘blockers’ see Hawthorne 2002b; Chalmers 2010, 163–165)[^chalmers-2010][^hawthorne-2002b][^leuenberger-2008]. This approach, however, is inconsistent with maintaining that actual conscious states are either identical with or constituted by physical or functional states. If my conscious state is the same as or constituted by a physical state, then there is no possible world where the latter exists without the former. It is therefore not clear that physicalists can consistently allow the possibility of consciousness-blockers. Lei Zhong 2021 takes a very different approach, challenging the widely held view that physicalism commits one to the supervenience of the mental on the physical.
