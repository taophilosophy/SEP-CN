      > it ought to be quite credible that the constitution and course of nature would be otherwise just the same as it is if there were not and never had been any experiencing individuals. Human bodies would still have gone through the motions of making and using bridges, telephones and telegraphs, of writing and reading books, of speaking in Parliament, of arguing about materialism, and so on. There can be no doubt that this is *prima facie* incredible to Common Sense (Stout 1931: 138f.)[^stout-1931].
    step1: |-
      > 那么，即使不存在、也从未存在过任何有经验的个体，自然的构造与进程竟然仍与现在完全一样，这应当是相当可信的。人的身体仍然会做出制造和使用桥梁、电话与电报，书写和阅读书籍，在议会发言，争论唯物论等等动作。毫无疑问，这对常识来说是初看之下难以置信的（Stout 1931: 138f.）[^stout-1931]。
    step2: |-
      > 那么以下情形应当相当可信：即便不存在、也从未存在过任何具有经验的个体，自然的构造与进程依然与现状完全相同。人的身体照旧会做出那一连串动作——架桥用桥，打电话拍电报，写书读书，在议会演讲，争论唯物论，如此等等。毫无疑问，常识初听之下会觉得这难以置信（Stout 1931: 138f.）[^stout-1931]。
