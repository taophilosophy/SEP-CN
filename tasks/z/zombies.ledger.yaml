      Similar ideas were current in discussions of physicalism in the 1970s. As a counterexample to the psychophysical identity theory there was an ‘imitation man’, whose ‘brain-states exactly paralleled ours in their physico-chemical properties’ but who felt no pains and saw no colors (Campbell 1970)[^campbell-1970]. Zombies were put forward as a counterexample to physicalism in general, and arguments devised to back up the intuition that they are possible (Kirk 1974a, 1974b)[^kirk-1974a]. However, these arguments fell short of their target because they depended on much the same cluster of intuitions as the original idea.
    step1: |-
      类似的观念在 1970 年代关于物理主义的讨论中很流行。作为对心理物理同一论的反例，有“模仿人”的说法：其“大脑状态在物理化学性质上与我们的完全平行”，却感觉不到疼痛，也看不见颜色（Campbell 1970）[^campbell-1970]。僵尸被提出作为对一般物理主义的反例，并为支持其可能的直觉而设计论证（Kirk 1974a, 1974b）[^kirk-1974a]。然而这些论证没有击中目标，因为它们依赖的想法与原初观念所依赖的直觉大体是同一簇。
    step2: |-
      1970 年代讨论物理主义时，类似的观念同样流行。当时有一个“模仿人”（imitation man），用作心理物理同一论的反例：其“大脑状态在物理化学性质上与我们的完全平行”，却感觉不到疼痛、看不见颜色（Campbell 1970）[^campbell-1970]。僵尸则被提出来作为针对一般物理主义的反例，还专门设计了论证，为“它们可能”这一直觉撑腰（Kirk 1974a, 1974b）[^kirk-1974a]。然而这些论证未能击中目标：它们依赖的那一簇直觉，与原初观念本身所依赖的并无二致。
