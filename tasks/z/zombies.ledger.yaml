      His first argument goes roughly as follows. Suppose a population of tiny people disable your brain and replicate its functions themselves, while keeping the rest of your body in working order (see Block 1980a)[^block-1980a]; each homunculus uses a cell phone to perform the signal-receiving and -transmitting functions of an individual neuron. Would such a system be conscious? Intuitively one may be inclined to say not. Some, notably functionalists, bite the bullet and answer yes. However, the argument does not depend on assuming that the homunculus-head would not be conscious. It depends only on the assumption that its not being conscious is *conceivable* — which many people find reasonable. In Chalmers’s words, all that matters here is that when we say the system might lack consciousness, ‘a meaningful possibility is being expressed, and it is an open question whether consciousness arises or not’ (1996, p. 97). If he is right, then conceivably the system is not conscious. In that case it is already very much like a zombie, the only difference being that it has little people where a zombie has neurons. And why should that make a difference to whether the situation is conceivable? Why should switching from homunculi to neurons necessarily switch on the light of consciousness? (For doubts about the assumption that it is conceivable that the homunculus-head lacks consciousness, see e.g. Loar 1990/1997, pp. 613f.)[^loar-1990]
    step1: |-
      他的第一个论证大致如下。设想一群小人使你的大脑失能，并自己复制其功能，同时让你身体的其他部分保持运转（见 Block 1980a）[^block-1980a]；每个小人用一部手机来执行单个神经元的信号接收与发送功能。这样一个系统会有意识吗？直觉上人们倾向于说不会。一些人——特别是功能主义者——硬着头皮回答会。然而，这个论证并不依赖于假定小人头没有意识。它只依赖于这样一个假定：小人头没有意识是*可设想的*——许多人觉得这是合理的。用查尔莫斯的话说，这里要紧的只是：当我们说该系统可能缺乏意识时，“所表达的是一种有意义可能性，而意识是否产生是一个开放问题”（1996, p. 97）。如果他是对的，那么可以设想该系统没有意识。在那种情况下，它已经非常像僵尸，唯一的区别是它有小人，而僵尸有神经元。可为什么那会造成差别，影响情境是否可设想？为什么从小人换成神经元就必然点亮意识之光？（对该假定——小人头缺乏意识是可设想的——的怀疑，见如 Loar 1990/1997, pp. 613f.）[^loar-1990]
    step2: |-
      他的第一个论证大致如下。设想一群小人儿让你的大脑停摆，由他们自己来复制其功能，同时让你身体的其余部分照常运转（见 Block 1980a）[^block-1980a]；每个小人儿拿一部手机，充当单个神经元，执行信号的接收与发送。这样一个系统会有意识吗？直觉上人们倾向于说不会。有些人——尤其是功能主义者——硬着头皮答“会”。然而这个论证并不依赖“小人儿头（homunculus-head）没有意识”这一假定，它只依赖一个弱得多的假定：小人儿头没有意识是*可设想的*——许多人觉得这合乎情理。用查尔莫斯的话说，这里要紧的只是：当我们说该系统可能没有意识时，“所表达的是一个有意义的可能性，而意识是否产生是一个开放问题”（1996, p. 97）。他若正确，该系统没有意识便是可设想的。果如此，它已非常接近僵尸，唯一的差别是：它里面是小人儿，僵尸里面是神经元。可这凭什么会影响情境是否可设想？凭什么从小人儿换成神经元，就必定点亮意识之光？（对“小人儿头缺乏意识是可设想的”这一假定存疑者，见如 Loar 1990/1997, pp. 613f.）[^loar-1990]
