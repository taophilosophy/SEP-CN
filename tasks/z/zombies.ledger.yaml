      Other kinds of systems were envisaged which behaved like normal human beings, or were even functionally like human beings, but lacked the ‘qualia’ we have (Block 1980a, 1980b, 1981; Shoemaker 1975, 1981)[^block-1980a][^shoemaker-1975]. (Roughly, qualia are the properties by which we classify experiences according to ‘what they are like’: what it is like to smell roasting coffee beans, for example. Even physicalists can use this expression, although unlike dualists they take qualia to be physical.) The most systematic use of the zombie idea against physicalism is by David Chalmers 1996, whose important contributions to the debate will be considered shortly.
    step1: |-
      还设想了其他类型的系统，它们表现得像正常人，甚至在功能上像人，但缺乏我们所拥有的“感质”（Block 1980a, 1980b, 1981; Shoemaker 1975, 1981）[^block-1980a][^shoemaker-1975]。（大致说来，感质是我们依据“它们是什么样子”对经验进行分类时所依凭的性质：例如闻到烘焙咖啡豆是什么样子。物理主义者也可以使用这个表达式，只是与二元论者不同，他们认为感质是物理的。）对僵尸观念最系统的反物理主义运用出自大卫·查尔莫斯 1996 年的著作，他对这场辩论的重要贡献稍后即将讨论。
    step2: |-
      人们还设想了另一些系统：它们表现得与正常人无异，甚至在功能上与人类相仿，却缺乏我们所拥有的“感质”（qualia）（Block 1980a, 1980b, 1981; Shoemaker 1975, 1981）[^block-1980a][^shoemaker-1975]。（大致说来，感质就是我们据以按“它们是什么样子”来为经验分类的那些性质：比如闻到咖啡豆在烘焙时散发气味是什么样子。物理主义者同样可以用这个词，只是与二元论者不同，他们认为感质是物理的。）把僵尸观念最有系统地用于反物理主义的，是大卫·查尔莫斯 1996 年的著作；他对这场辩论的重要贡献，稍后即将讨论。
  - id: 10
    kind: body
    source: |-
      If zombies are to be counterexamples to physicalism, it is not enough for them to be behaviorally and functionally like normal human beings: plenty of physicalists accept that merely behavioral or functional duplicates of ourselves might lack qualia. Zombies must be like normal human beings in *all* physical respects, and they must have the physical properties that physicalists suppose we have. This requires them to be subject to the causal closure of the physical, which is why their supposed lack of consciousness is a challenge to physicalism. If instead they were to be conceived of as creatures whose behavior could not be explained physically, physicalists would have no reason to bother with the idea: there is plenty of evidence that, as epiphenomenalists hold, our movements actually are explicable in physical terms (see e.g. Papineau 2002)[^papineau-2002].
    step1: |-
      如果僵尸要成为物理主义的反例，仅仅在行为上和功能上像正常人是不够的：许多物理主义者都承认，仅仅行为或功能上与我们相同的东西可能缺乏感质。僵尸必须在*所有*物理方面都像正常人，并且必须具有物理主义者认为我们所具有的那些物理性质。这就要求它们受物理的因果闭合约束，这正是它们假想的意识缺乏对物理主义构成挑战的原因。相反，如果把它们设想为其行为无法在物理上解释的生物，物理主义者就没有理由费心理会这个观念：有大量证据表明，正如副现象主义者所主张的，我们的运动实际上可以在物理上解释（见如 Papineau 2002）[^papineau-2002]。
    step2: |-
      僵尸若要充当物理主义的反例，仅在行为与功能上像正常人是不够的：许多物理主义者本就承认，单纯行为或功能上的复制品可能没有感质。僵尸必须在*一切*物理方面都像正常人，且必须具有物理主义者认为我们所具有的物理性质。这就要求僵尸同样受制于物理的因果闭合——唯其如此，它们假想的意识缺乏才构成对物理主义的挑战。反过来，若把僵尸设想为其行为无法用物理解释的生物，物理主义者根本不必理会：大量证据表明，正如副现象主义者所言，我们的运动实际上的确可在物理层面解释（见如 Papineau 2002）[^papineau-2002]。
