      Many philosophers are willing to concede that zombies are conceivable in some sense (e.g. Hill 1997; Hill and McLaughlin 1999; Loar 1999; Yablo 1999)[^hill-1997][^hill-1999][^loar-1999][^yablo-1999]. However, that sense is sometimes quite broad. For example, a claim that ‘there are no substantive a priori ties between the concept of pain and the concept of C-fiber stimulation’ has been backed up by the point that ‘it is in principle possible to master either of these concepts fully without having mastered the other’ (Hill 1997, 76)[^hill-1997]. By that standard, though, it would be conceivable that the ratio of a circle’s circumference to its diameter is a rational number, when it isn’t. If conceivability in that sense entailed possibility, it would be both possible and impossible for the ratio to be rational; which would make such conceivability useless for the purposes of the conceivability argument. So understood, premiss (1) would be easy to swallow; but (2) would have to be rejected. Evidently, the lower the threshold for conceivability, the easier it is to accept (1) — but the harder it is to accept (2). So the kind of conceivability invoked in premisses (1) and (2) needs to be strongly constrained. A common and useful definition, which will be followed here, is: *something is conceivable if and only if it cannot be ruled out a priori.* (For sophistication of these and related ideas see Chalmers 1999, 477; 2002; 2007; 2010; and 5.1 below.)[^chalmers-1999]
    step1: |-
      许多哲学家愿意承认僵尸在某种意义上是可设想的（如 Hill 1997; Hill and McLaughlin 1999; Loar 1999; Yablo 1999）[^hill-1997][^hill-1999][^loar-1999][^yablo-1999]。然而那种意义有时相当宽泛。例如，“在疼痛概念与 C 纤维刺激概念之间没有实质性的先天联系”这一主张，得到了如下论点的支持：“原则上可以完全掌握这两个概念中的任何一个而未掌握另一个”（Hill 1997, 76）[^hill-1997]。但按这个标准，圆的周长与直径之比是有理数也是可设想的，而它并非如此。如果那种意义上的可设想性蕴涵可能性，那么这个比为有理数就既可能又不可能；这种可设想性对可设想论证的目的也就没有用了。如此理解，前提（1）容易接受；但（2）就必须被拒绝。显然，可设想性的门槛越低，（1）就越容易接受——而（2）就越难接受。因此前提（1）与（2）所援引的那种可设想性需要严格的限定。一个常用且有用的定义（本文将遵循它）是：*某物是可设想的，当且仅当它不能被先天地排除。*（关于这些观念及相关观念的精细化，见 Chalmers 1999, 477; 2002; 2007; 2010；及下文 5.1。）[^chalmers-1999]
