      To this attack Chalmers replies that the crucial consideration is that we are ‘acquainted’ with our experiences. This ‘intimate epistemic relation’ both ensures that we can refer to experiences and also justifies our claims to know about them. Since, in contrast, our zombie twins have no experiences, what appear to be their judgments about experience are unjustified. Chalmers suggests that even if qualia have no causal influence on our judgments, their mere presence in the appropriate physical context ensures that our thoughts are about those qualia. He thinks it also constitutes justification for our knowledge claims even if experiences are not explanatorily relevant to making the judgments in question (Chalmers 1996, 172—209; 1999, 493f; see also his 2003, 2010)[^chalmers-1996].
