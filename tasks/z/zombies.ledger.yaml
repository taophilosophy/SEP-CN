      Functionalism is a much more widely supported approach to the mental. According to it, mental states are not just a matter of behavior and dispositions, but of causal or other functional relations among sensory inputs, internal states, and behavioral outputs. (It is important to take account of internal functions not necessarily reflected in behavioral dispositions, otherwise functionalism falls to the usual objections to behaviorism, such as the ‘homunculus-head’ described in the last section (Kirk 2005, 2013, 2017)[^kirk-2005].) Now, since zombies would satisfy all the functional conditions for full consciousness, functionalism entails that zombies are impossible — though it would obviously be question-begging to presuppose it when attacking the zombie idea. Increasingly sophisticated versions of functionalism are being developed, however, and any arguments for it are a fortiori arguments against the possibility of zombies. (For defenses of functionalism against zombies see Dennett 1991; 1995; 1999; Kirk 2017; Shoemaker 1999; Tye 2006; 2008; for doubts about functionalism’s capacity to deal with zombies see for example Harnad 1995.)[^dennett-1991][^harnad-1995][^kirk-2017][^shoemaker-1999][^tye-2006]
    step1: |-
      功能主义是一种得到广泛得多的支持的心灵研究进路。按照它，心理状态不仅关乎行为与倾向，而且关乎感觉输入、内部状态与行为输出之间的因果的或其他功能的关系。（重要的是要考虑到内部功能，它们不一定反映在行为倾向中；否则功能主义就会落入针对行为主义的惯常反驳，例如上一节描述的“小人儿头”（Kirk 2005, 2013, 2017）[^kirk-2005]。）既然僵尸会满足完全意识的一切功能条件，功能主义就蕴涵僵尸是不可能的——不过，在攻击僵尸观念时预设功能主义显然是循环论证。然而，越来越精致的功能主义版本正在发展，任何支持功能主义的论证都更是反对僵尸可能性的论证。（功能主义对僵尸的辩护见 Dennett 1991; 1995; 1999; Kirk 2017; Shoemaker 1999; Tye 2006; 2008；对功能主义处理僵尸的能力的怀疑见如 Harnad 1995。）[^dennett-1991][^harnad-1995][^kirk-2017][^shoemaker-1999][^tye-2006]
    step2: |-
      功能主义在心灵哲学中得到的支持要广泛得多。按其主张，心理状态不仅关乎行为与倾向，还关乎感觉输入、内部状态与行为输出之间的因果或其他功能关系。（内部功能未必体现在行为倾向中，这一点必须计入；否则功能主义就会重蹈行为主义的覆辙，招致那些惯常反驳——例如上一节的“小人儿头”（Kirk 2005, 2013, 2017）[^kirk-2005]。）既然僵尸会满足完全意识的一切功能条件，功能主义便蕴涵僵尸不可能——不过，攻击僵尸观念时预设功能主义，显然又是循环论证。而日益精致的功能主义版本正在发展；任何支持功能主义的论证，都顺理成章地是反对僵尸可能性的论证。（功能主义对僵尸的辩护见 Dennett 1991; 1995; 1999; Kirk 2017; Shoemaker 1999; Tye 2006; 2008；怀疑功能主义能否处理僵尸者，见如 Harnad 1995。）[^dennett-1991][^harnad-1995][^kirk-2017][^shoemaker-1999][^tye-2006]
