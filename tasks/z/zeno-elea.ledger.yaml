      尽管如此，正如苏格拉底最初的那句话——芝诺的论证全都旨在表明实际上不存在许多事物——基本上仍然可信，芝诺关于自己意图的说明中也有一些成分带有历史真相的味道，并且与其他证据相合。柏拉图让芝诺继续他对苏格拉底的第二次回答（见上文所引）说：“这部书是我年轻时以这样一种好斗的精神写成的。……那么，苏格拉底，你在这一点上错了：你以为这部书的写成不是出于年轻气盛的争胜之心，而是出于更成熟的抱负”（Pl. *Prm*. 128d6–e3）。文中反复强调，芝诺的书是以年轻气盛的争胜精神即“好胜”（*philonikia*, *Prm*. 128d7, e2）写成的。更年长的芝诺对自己年轻时论证中显露的争胜姿态似乎有点难为情——这也在情理之中，因为这种精神后来会被视为智术师时代兴起的那类争胜论辩者的典型特征。柏拉图还再次暗示芝诺是争胜论辩之先声：他让芝诺说自己的书“反驳（*antilegei*）那些说多存在的人”（*Prm*. 128d2–3）。这一提示——芝诺是后来所谓“反论术”即对立论证之术的实践者——与柏拉图在其他对话中把他多少当作智者来描绘是一致的。在《阿尔基比亚德篇》中，苏格拉底报道说，皮托多鲁斯与卡利阿斯各付给芝诺一百米那，以变得聪明而精于论证（*Alc*. 119a3–6；参见 *Prm*. 126b–c）。收费授业当然是那些自封为智慧专家的职业教师的标志之一。柏拉图视芝诺为反论术这一特定论辩品牌的实践者，其证据是《斐德罗篇》那段著名的描述：芝诺被称为“爱利亚的帕拉墨得斯”，因为他有能力使同样的东西在听众面前显得既相似又不相似、既一又多、既动又静（*Phdr*. 261d6–8）。此外，《智者篇》开头，当泰奥多洛把来自爱利亚的客人介绍为巴门尼德与芝诺及其追随者的同道时，苏格拉底表示担心这位客人也许是“某个驳斥之神”，直到泰奥多洛向他保证：这位客人比那些把时间花在争胜论辩与竞逐驳难上的人更为温和（*Sph*. 216a–b）。柏拉图的这些指涉一致地把芝诺与争胜论辩的兴起联系起来；他的反对众多与运动的论证，完全可能是“使弱论证显得强”的著名范例。
