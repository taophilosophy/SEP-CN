      后来的传统虽不可靠地把其他著作归于芝诺，雅典的新柏拉图主义者普罗克洛斯（公元 5 世纪）的《巴门尼德篇》评注中却有一处有趣的证据，表明他熟悉一部以芝诺之名流传的著作，内含四十个论证即 *logoi*（Procl. *in Prm*. 694, 17–18 Steel）。普罗克洛斯评注中关于芝诺的话，多半只是改写上引对话已有内容；但他这一评论——芝诺此书包含四十个论证——连同他说的其他几处，暗示他得见一部带有某种芝诺派系谱的著作，更早的注释家们也知道它（Procl. *in Prm*. 630.26ff.，尤其 631.25–632.3 可以为证）。不过，若古代晚期确有一部题为《芝诺的四十论证》的著作行世，它也不太可能是芝诺原初论著的忠实复本。首先，普罗克洛斯对该书的某些表面援引暗示：它把一些与巴门尼德本人在《巴门尼德篇》后文那套精巧辩证操练相类的论证，安到了芝诺头上。此外，亚里士多德暗示，芝诺的论证刚一提出就有人在改作。在《物理学》8.8 里，亚里士多德先按《物理学》6.9 的呈现给出所谓运动场悖论（见下文 2.2.1 节）的一个基本重构，随后指出有人以另一种方式提出同一论证；他接着描述的替代性重构（Arist. *Ph*. 8.8, 263ᵃ7–11）实际上就是原初论证的一个新版本。
