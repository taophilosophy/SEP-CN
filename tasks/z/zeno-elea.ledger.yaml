      Toward the end of the introduction to his analysis of place, Aristotle notes that “Zeno’s difficulty requires some explanation; for if every thing that is is in a place, it is clear that there will also be a place of the place, and so on to infinity” (Arist. *Ph*. 4.1, 209ᵃ23–5). His subsequent statement of the problem is even briefer but adds one key point: “Zeno raises the problem that, if place is something, it will be in something” (Arist. *Ph*. 4.3, 210ᵇ22–3; cf. Eudemus fr. 78 Wehrli, [Arist.] *De Melisso Xenophane Gorgia* 979ᵇ23–7, Simp. *in Ph*. 562, 3–6). Zeno would appear to have argued as follows. Everything that is is in something, namely a place. If a place is something, then it too must be in something, namely some further place. If this second place is something, it must be in yet another place; and the same reasoning applies to this and each successive place *ad infinitum*. Thus, if there is such a thing as place, there must be limitless places everywhere, which is absurd. Therefore, there is no such thing as place. This argument could well have formed part of a more elaborate argument against the view that there are many things, such as that if there are many things, they must be somewhere, i.e. in some place; but there is no such thing as place and thus no place for the many to be; therefore, there are not many things. This is, however, only speculation.
    step1: |-
      在其处所分析导言的结尾处，亚里士多德指出：“芝诺的难题需要一些解释；因为如果每一个存在者都在一个处所中，那么显然也将有一个处所的处所，以至于无穷”（Arist. *Ph*. 4.1, 209ᵃ23–5）。他随后对问题的陈述更加简短，但补充了一个关键之点：“芝诺提出难题：如果处所是某种东西，它将在某个东西之中”（Arist. *Ph*. 4.3, 210ᵇ22–3；参见 Eudemus fr. 78 Wehrli, [Arist.] *De Melisso Xenophane Gorgia* 979ᵇ23–7, Simp. *in Ph*. 562, 3–6）。芝诺看来如下论证：每一个存在者都在某个东西之中，即在一个处所中。如果处所是某种东西，那么它也必须在某个东西之中，即某个进一步的处所中。如果这第二个处所是某种东西，它就必须在又一个处所之中；同样的推理适用于它以及每一个相继的处所，以至无穷。因此，如果有处所这样的东西，那么处处都会有无限的处所，这是荒谬的。所以，没有处所这样的东西。这个论证完全可能曾是一个更精巧的反对“存在许多事物”之观点的论证的一部分，例如：如果存在许多事物，它们必定在某个地方，即某个处所中；但没有处所这样的东西，因而众多事物没有处所可在；所以，不存在许多事物。不过，这只是推测。
