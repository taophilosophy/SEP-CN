      Aristotle’s discussion of the relation of motion and time in *Physics* 6.8 prepares the way for his objection to the Zenonian paradox of motion he mentions at the very beginning of *Physics* 6.9: “Zeno reasons fallaciously; for he says that if every thing always is resting whenever it is against what is equal, and what moves is always in the now, then the moving arrow is motionless” (*Ph*. 6.9, 239ᵇ5–7). Aristotle remarks that Zeno relies on the false supposition that time is composed of indivisible “nows” or instants (ᵇ8–9), a point he soon repeats in identifying the argument purporting to show that “the moving arrow is standing still” as the third of Zeno’s paradoxes of motion (ᵇ30–3). In his *Life of Pyrrho*, Diogenes Laertius reports, “Zeno abolishes motion, saying, ‘What moves moves neither in the place it is nor in a place it is not” (D.L. 9.72 = Zeno B4 DK; cf. Epiphanius, *Against the Heretics* 3.11). This report, which Diels and Kranz took to preserve a genuine fragment of Zeno’s book, appears to suggest how the argument that the moving arrow is at rest may have figured as part of a broader argument against motion. Diogenes, however, is not a particularly good source for Zeno’s arguments: his *Life of Zeno* notes only that he was the first to propound the “Achilles” argument, along with many others (D.L. 9.29). It is just as likely, therefore, that Diogenes’ report depends on an intervening attempt to couch the paradoxes of motion reported by Aristotle in the dilemmatic form Plato indicates was typical of Zenonian argumentation.
    step1: |-
      亚里士多德在《物理学》6.8 中对运动与时间关系的讨论，为他反驳芝诺运动悖论铺平了道路；他在《物理学》6.9 一开始就提到那一悖论：“芝诺推理有误；因为他说，凡事物凡是与等量者相并就总是静止，而运动着的东西总是在现在之中，所以运动着的箭是静止的”（*Ph*. 6.9, 239ᵇ5–7）。亚里士多德评论说，芝诺依赖一个错误的假定，即时间由不可分的“现在”即瞬间组成（ᵇ8–9）；这一点他不久又重复了一遍，当时他把那个意在表明“运动着的箭静止不动”的论证认定为芝诺运动悖论中的第三个（ᵇ30–3）。在其《皮浪传》中，第欧根尼·拉尔修报道说：“芝诺取消运动，说‘运动者在它所在的地方不动，也不在它不在的地方动’”（D.L. 9.72 = Zeno B4 DK；参见 Epiphanius, *Against the Heretics* 3.11）。这一报道——第尔斯与克兰茨认为它保存了芝诺书中一个真实残篇——似乎提示：运动之箭静止的论证，可能曾作为一个更宽泛的反对运动的论证的一部分。不过，第欧根尼并不是芝诺论证的特别好的来源：其《芝诺传》只提到他是“阿基里斯”论证以及许多其他论证的第一个提出者（D.L. 9.29）。因此，同样可能的是：第欧根尼的报道依赖于某个中间环节的尝试，即把亚里士多德所报道的运动悖论改写为柏拉图提示为芝诺论证典型的两难形式。
    step2: |-
      亚里士多德在《物理学》6.8 中对运动与时间关系的讨论，为他反驳芝诺运动悖论铺了路；他在《物理学》6.9 开篇便提到那一悖论：“芝诺推理有误；因为他说，凡事物凡是与等量者相并就总是静止，而运动着的东西总是在现在之中，所以运动着的箭是静止的”（*Ph*. 6.9, 239ᵇ5–7）。亚里士多德评论说，芝诺依赖一个错误假定——时间由不可分的“现在”即瞬间组成（ᵇ8–9）；此点他不久又重复一遍，当时他把意在表明“运动着的箭静止不动”的论证认定为芝诺运动悖论中的第三个（ᵇ30–3）。在其《皮浪传》中，第欧根尼·拉尔修报道：“芝诺取消运动，说‘运动者在它所在的地方不动，也不在它不在的地方动’”（D.L. 9.72 = Zeno B4 DK；参见 Epiphanius, *Against the Heretics* 3.11）。这一报道——第尔斯与克兰茨认为它保存了芝诺书中一个真实残篇——似乎提示：运动之箭静止的论证，可能曾作为一个更宽泛的反对运动之论证的一部分。不过第欧根尼并非芝诺论证的上佳来源：其《芝诺传》只说他是“阿基里斯”论证以及许多其他论证的第一个提出者（D.L. 9.29）。因此同样可能的是：第欧根尼的报道依赖某个中间环节的尝试——把亚里士多德报道的运动悖论改写为柏拉图所示芝诺论证典型的两难形式。
