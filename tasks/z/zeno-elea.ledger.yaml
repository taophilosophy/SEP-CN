      爱利亚的芝诺，公元前 5 世纪思想家，仅以其提出的一系列精巧悖论而为人所知。其中最著名的几个悖论意在表明运动是不可能的，办法是揭示关于运动发生的通常假定中显见的或潜在的矛盾。芝诺也反对存在许多事物这一常识假定，办法是以各种方式表明它同样导致矛盾。我们或许永远不会知道究竟是什么促使芝诺发展出他那些著名的悖论。虽然人们通常说，他旨在为其爱利亚导师巴门尼德的悖论性一元论辩护，但这一观点所依据的柏拉图证据最终并不能支持它。由于芝诺的论证实际上倾向于把量化概念之于物理物体以及之于通常所构想的空间广延的应用问题化，这些悖论可能起源于对毕达哥拉斯派把数学概念应用于自然世界之努力的反思。从亚里士多德直到今天，人们为回应芝诺悖论所提出的问题而做出的种种尝试，使这些悖论产生了持久的影响。由于本文的主题是芝诺本人，本文力图对他的思想提供一幅历史上准确的概览，而不是叙述哲学家、数学家和物理学家如何回应他那挑动性的论证。
