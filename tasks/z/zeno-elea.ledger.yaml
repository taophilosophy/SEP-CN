      回到《巴门尼德篇》那段文字，还应指出：苏格拉底对芝诺之书的描述——柏拉图让芝诺对此表示认可——表明这些论证有一定的结构与目的。具体而言，这一段落表明芝诺的所有论证都反对“存在许多事物”这一常识假定。它也可能暗示，这些论证取苏格拉底特别援引的那种二律背反的形式，因而芝诺论证的一般模式应当是：如果存在许多事物，它们必定既是 *F* 又不是 *F*；但事物不可能既是 *F* 又不是 *F*；所以，不存在许多事物。虽然这一描述促使有人尝试把现存的诸悖论（关于运动、众多与处所的悖论）纳入一个统一的架构，让它充当芝诺原书——如果他确实只写了一部的话——的规划，但这些尝试没有一个被证明是令人信服的。既然柏拉图的描述在若干方面难以与我们从其他来源得知的芝诺实际论证相吻合，我们就应当警惕把它当作关于该书组织规划的假设之基础。首先，亚里士多德报道的运动悖论并不明显针对“存在许多事物”这一假定，也不取二律背反的形式。此外，在别处报道的反对众多的论证中，只有一个——有限与无限的二律背反——符合柏拉图笔下苏格拉底所描述的相似与不相似二律背反所 exemplify 的论证模式（见下文 2.1.1）。余下的那个论证，大与小的二律背反（见 2.1.2），不仅意在表明“存在许多事物”这一假定导致一个显见的矛盾，而且更有雄心：它意在把每一个矛盾的后果都归约为荒谬。当然，柏拉图实际上并没有说芝诺的所有论证都取二律背反的形式。归根结底，如果柏拉图笔下苏格拉底在上引段落中对芝诺论著的刻画并不十分准确，那么——就芝诺可能确有一部单独论著而言——古人关于其论证总体趋向的说法中，仍没有比这更可信的观点。而且，人们可以轻易地把苏格拉底所指定的靶子放宽，以涵盖反对运动与处所的论证：只需把它改成略微复杂一点的论旨——存在许多从一处移动到另一处的事物。苏格拉底很可能理所当然地认为，对芝诺来说，这种移动是与众多一同自动而来的。我们关于芝诺论证所知的一切，确实与这样的看法相合：它们意在挑战关于众多与运动的通常假定。这些论证字面上就是“para-doxes”（悖论）——源自希腊语 *para*（“相反于”或“反对”）与 *doxa*（“信念”或“意见”）——即得出与人们通常所信相反之结论的论证。关于芝诺的意图还能说些什么，将在下文呈现我们所知的其实际论证之后讨论。
