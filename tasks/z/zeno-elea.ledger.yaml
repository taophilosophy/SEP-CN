      Before *S* reaches *p*₂, *S* must first reach the point half way between *p*₀ and *p*₂, namely *p*₃. Again, before *S* reaches *p*₃, *S* must first reach the point half way between *p*₀ and *p*₃, namely *p*₄. There is a half way point again to be reached between *p*₀ and *p*₄. In fact, there is always another half way point that must be reached before reaching any given half way point, so that the number of half way points that must be reached between any *p*ₙ and any *p*ₙ₋₁ is unlimited. But it is impossible for *S* to reach an unlimited number of half way points within a limited amount of time. Therefore, it is impossible for *S* to traverse the stadium or, indeed, for *S* to move at all; in general, it is impossible to move from one place to another.
    step1: |-
