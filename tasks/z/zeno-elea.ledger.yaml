      柏拉图对话《巴门尼德篇》（*Parmenides*）的戏剧性背景，是德高望重的哲学家巴门尼德与其较为年轻的追随者芝诺到访雅典，参加大泛雅典娜节。柏拉图把巴门尼德描述为约六十五岁，芝诺将近四十岁，而与他们交谈的苏格拉底“那时相当年轻”——这通常被理解为约二十岁。鉴于苏格拉底于公元前 399 年被雅典人处死时已年过七旬，这一描述暗示芝诺约生于公元前 490 年。他似乎在公元前五世纪中叶活跃于大希腊，即南意大利的希腊语地区。除此之外，关于其生平境况的可信信息寥寥。第欧根尼·拉尔修的简短《芝诺传》（D.L. 9.25–9）大部分篇幅用于拼合关于他参与一桩推翻当地僭主之英勇密谋的互相冲突的报道，但这些报道包含多少真相已无法确定。虽然第欧根尼也说芝诺如此热爱自己的家乡爱利亚，以致无意移居雅典，但这一报道与他曾在雅典逗留过一段时间并不冲突；而普鲁塔克的报道说伯里克利听过芝诺以巴门尼德的方式讲论万物的本性（Plu. *Pericles* 4.5），这暗示芝诺可能确实到访过雅典，并如柏拉图《巴门尼德篇》所暗示的那样，向一群求知欲旺盛的雅典人宣读了他那部著名的书。芝诺论证之文化冲击力的生动证据，见于在伊特鲁里亚城市法勒里伊出土、断代为公元前五世纪中叶的一只红绘式饮杯（罗马，朱利亚别墅博物馆，藏号 3591）的内部：它描绘一个英雄人物轻盈地跑在一只大龟前面，样子极像是对阿基里斯悖论的最早的已知“回应”。
