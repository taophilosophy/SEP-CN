      重构芝诺论证的任务，有时未被充分地与发展对它们的回应的任务区分开来。人们如何重构芝诺的推理，当然在某种程度上决定了什么才算得上有效的回应。危险在于：关于如何构造有效回应的想法，可能反过来影响人们对芝诺实际推理的重构，尤其是当人们把比他实际使用的概念更发达或更精确的概念引入其论证时。在某些情形中——比如所谓阿基里斯悖论——悖论的力量在很大程度上恰恰来自它所使用的概念之简单。因此，这里提供的重构力求保留芝诺本人论证方式的某些风貌，正如我们从对保留下来的至少某些悖论的字面引用中所知的那样。更形式化的重构是可能的，也有现成的。如前所述，至少有一种改进芝诺论证的努力早已为亚里士多德所知。但这类努力可能以牺牲历史准确性为代价，而历史准确性正是本文的首要目标。如何改进芝诺的论证，留待他人去做。由于同样重要的是领会我们对芝诺论证所知的多寡，每个主要论证的首要证据将连同重构一并给出。
