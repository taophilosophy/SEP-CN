      虽然后来的传统不可靠地把其他著作归于芝诺，雅典的新柏拉图主义者普罗克洛斯（公元 5 世纪）的《巴门尼德篇》评注中却有有趣的证据，表明他熟悉一部以芝诺之名流传的著作，其中包含四十个论证即 *logoi*（Procl. *in Prm*. 694, 17–18 Steel）。普罗克洛斯在评注中关于芝诺所说的话，大多只是改写了上面那段对话中已有的内容，但他关于芝诺这部著作包含四十个论证的评论，连同他说的某些其他东西，暗示普罗克洛斯得见一部具有某种芝诺派系谱的著作，一部更早的注释家们也知道的作品（Procl. *in Prm*. 630.26ff.,尤其是 631.25–632.3 可以为证）。不过，如果古代晚期确实有一部题为《芝诺的四十论证》的著作行世，它也不太可能是芝诺原初论著的忠实复本。首先，普罗克洛斯对这部著作的某些表面上的援引暗示，它把一些论证安在了芝诺头上，这些论证与巴门尼德本人在《巴门尼德篇》后文那套精巧的辩证操练中的论证相类。此外，亚里士多德暗示，芝诺的论证刚一提出就有人在改作它们。在《物理学》8.8 中，亚里士多德在给出所谓运动场悖论（见下文 2.2.1 节）的一个基本重构、回忆其在《物理学》6.9 中的呈现之后，接着指出有人以另一种方式提出同一论证；他随后描述的替代性重构（Arist. *Ph*. 8.8, 263ᵃ7–11）实际上是原初论证的一个新版本。
