      那么，我们应当把芝诺看作智者吗？柏拉图的同时代人、修辞学家伊索克拉底肯定毫不犹豫地把高尔吉亚、芝诺与麦里梭一并归入普罗塔戈拉时代兴盛的那些“智者”，说他们全都在写冗长的论著、鼓吹最骇人听闻的主张（Isoc. *Hel*. [*Orat*. 10] 2–3）。虽然给“智者”一词下一个精确定义颇有困难，但通常归入此类的人物有一个共同特征是芝诺所缺乏的：对文化规范与价值的探究的兴趣。不过，芝诺对其同时代伟大智者的影响，以及更一般地，他对在智者中间传播的论证技艺的影响，似乎无可否认。普罗塔戈拉对反论术诸技艺的发展——根植于他关于每个问题上都有两个相反论证的主张（D.L. 9.51）——看来既受到芝诺新奇论证形式的启发，也受到他对最反直觉的论旨之倡导的启发。此外，芝诺的影响在高尔吉亚的论著《论自然，或论非存在》中尤为清晰：既在其经由对立与归谬进行论证的癖好之中，也在其径直取自芝诺本人的前提的使用之中（见 [Arist.] *MXG* 979ᵃ23, ᵇ25, ᵇ37）。甚至可能，这位伟大雅典政治家伯里克利聚集在自己周围的当代智者的著名圈子，为芝诺影响第一代智者提供了主要渠道。至少普鲁塔克记载：“伯里克利听过爱利亚的芝诺以巴门尼德的方式论自然，并练习一种盘诘的技艺、一种借对立论证把对手逼入角落的技艺”（Plu. *Per*. 4.5）。普鲁塔克归于芝诺的这种技艺——在其论证的残篇遗存中仍清晰可见——正是大量智者实践中表现出来的那种论辩技艺。虽然有人怀疑普鲁塔克关于芝诺与达蒙、阿那克萨戈拉一样属于伯里克利热切结交的众多当代智者这一报道的可靠性，但没有什么严肃的证据真正反对它。因此，乔治·克尔弗德既论证了伯里克利的赞助及其对当代思想发展的热切关注必定对智者运动至关重要，又论证了芝诺的悖论对智者反论术方法的发展有深刻影响；他把后者视为“或许整个时代思想最具特征的特征”（Kerferd 1981, 18–23, 59ff., 85）[^kerferd-1981]。
