      从柏拉图的指涉中浮现的芝诺形象及其论辩策略，使亚里士多德在其一部佚失对话《智者》中称芝诺为辩证法的发明者显得顺理成章（D.L. 8.57；参见 9.25；S.E. *M*. 7.7）。鉴于亚里士多德也把辩证法的发明归于苏格拉底（Arist. *Metaph*. M.4, 1078ᵇ25–30）与柏拉图（*Metaph*. A.6, 987ᵇ31–3），并说自己发明的是它的*理论*（*SE* 34, 183ᵇ34–184ᵇ8），他这话的确切含义仍属猜测。还有一个问题：亚里士多德是否认为芝诺的论证更多是争胜论辩的而非真正辩证的。按亚里士多德的说法，区别在于：辩证论证从公认意见即“众人或多数人或贤哲所持的看法，也就是全体、多数或最著名受敬重的贤哲的看法”出发，而争胜论辩的论证则从仅仅是貌似公认意见的东西、或貌似从公认意见推出的东西出发（*Top*. 1.1, 100ᵃ29–30, ᵇ22–5）。亚里士多德显然认为芝诺的某些假定只有似是而非的说服力（见 *Top*. 8.8, 160ᵇ7–9, *SE* 24, 279ᵇ17–21, *Ph*. 1.2, 233ᵃ21–31, *Metaph*. B.4.1001ᵇ13–16），因此按亚里士多德自己的标准，这些论证应当算作争胜论辩而非真正的辩证论证。于是在亚里士多德看来，芝诺是一个论战者与悖论贩子，其论证却精致得足以使他有资格成为辩证法的发明者，并且对迫使自然科学的基本概念得到澄清起了重要作用。亚里士多德的芝诺观因此大体与柏拉图把他描绘为对立论证之术的大师相一致。
