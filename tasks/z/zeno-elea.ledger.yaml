      “Zeno’s argument is not correct, that any portion of millet seed whatsoever makes a sound” (Arist. *Ph*. 7.5, 250ᵃ20–1). The version of this argument known to Simplicius represents Zeno as engaged in a fictional argument with Protagoras, wherein he makes the point that if a large number of millet seeds makes a sound (for example, when poured out in a heap), then one seed or even one ten-thousandth of a seed should also make its own sound (for example, in that process) (Simp. *in Ph*. 1108.18–28). Aristotle’s report is too slight a basis for reconstructing how Zeno may in fact have argued, and Simplicius is evidently reporting some later reworking. The evidence nonetheless suggests that Zeno anticipated reasoning related to that of the sorites paradox, apparently invented more than a century later.
    step1: |-
      “芝诺的论证不正确，他说无论多么小的一份黍粒都会发出声响”（Arist. *Ph*. 7.5, 250ᵃ20–1）。辛普里丘所知的这个论证的版本，把芝诺描写成在与普罗塔戈拉进行一场虚构的论辩：他的要点是，如果大量黍粒发出声响（例如在倾倒成堆时），那么一粒黍、甚至一粒黍的万分之一也应当发出自己的声响（例如在同一过程中）（Simp. *in Ph*. 1108.18–28）。亚里士多德的报道作为重构芝诺实际如何论证的基础实在过于单薄，辛普里丘显然是在报道某个后来的改作。不过，这一证据表明芝诺预见了与堆垛悖论相关的推理——那类悖论显然是一个多世纪之后才被发明出来的。
