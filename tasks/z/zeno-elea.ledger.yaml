      The argument here may be reconstructed as follows. Its overall structure is: If there are many things, then there must be finitely many things; and if there are many things, then there must be infinitely many things. The assumption that there are many things is thus supposed to have been shown to lead to contradiction, namely, that things are both finitely and infinitely many. The particular argument for the first arm of the antinomy seems to be simply: If there are many things, then they must be just so many as they are. If the many things are just so many as they are, they must be finitely many. Therefore, if there are many things, then there must be finitely many things. Simplicius somewhat loosely describes the antinomy’s second arm as demonstrating numerical infinity through dichotomy (Simp. *in Ph*. 140.33–4). In fact, the argument depends on a postulate specifying a necessary condition upon two things being distinct, rather than on division *per se*, and it may be reconstructed as follows: If there are many things, they must be distinct, that is, separate from one another. Postulate: Any two things will be distinct or separate from one another only if there is some other thing between them. Two representative things, *x*₁ and *x*₂, will be distinct only if there is some other thing, *x*₃, between them. In turn, *x*₁ and *x*₃ will be distinct only if there is some other thing, *x*₄, between them. Since the postulate can be repeatedly applied in this manner unlimited times, between any two distinct things there will be limitlessly many other things. Therefore, if there are many things, then there must be limitlessly many things.
    step1: |-
      这里的论证可以重构如下。其总体结构是：如果存在许多事物，那么必定有有限多的事物；而如果存在许多事物，那么必定有无限多的事物。于是，“存在许多事物”这一假定被表明导致矛盾，即事物既有限多又无限多。二律背反第一臂的论证似乎很简单：如果存在许多事物，那么它们必定恰好是那么多。如果众多事物恰好是那么多，它们必定是有限多的。所以，如果存在许多事物，那么必定有有限多的事物。辛普里丘有些不严格地把二律背反的第二臂描述为通过二分法证明数的无限（Simp. *in Ph*. 140.33–4）。实际上，该论证依赖的是一个规定两物相区别之必要条件的公设，而非依赖分割本身，它可以重构如下：如果存在许多事物，它们必定相互区别，即彼此分离。公设：任何两个事物，只有当它们之间有某个别的事物时，才会相互区别或分离。两个代表性的事物 *x*₁ 与 *x*₂，只有当有某个别的事物 *x*₃ 在它们之间时才会相互区别。反过来，*x*₁ 与 *x*₃ 相互区别，又只有当有某个别的事物 *x*₄ 在它们之间。既然公设可以按此方式无限次地重复应用，那么任意两个相互区别的事物之间就会有无限多的别的事物。所以，如果存在许多事物，那么必定有无限多的事物。
