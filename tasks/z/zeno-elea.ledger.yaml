      爱利亚的芝诺（公元前 5 世纪思想家）为人所知，仅因他提出过一系列精巧的悖论。其中最著名的几个，意在借揭示运动发生之通常假定中显见或潜在的矛盾，表明运动是不可能的；芝诺同样以各种方式表明“存在许多事物”这一常识假定也通向矛盾，从而反对这一假定。究竟是什么促成了芝诺那些著名悖论，我们或许永远无从得知。人们通常说，他意在为其爱利亚学派导师巴门尼德的悖论性一元论辩护，但这一说法所依托的柏拉图证据最终并不足以支撑它。既然芝诺的论证实际上倾向于使“把量的概念应用于物理物体和通常所构想的空间广延”成为问题，这些悖论可能正是源起于对毕达哥拉斯派将数学概念运用于自然世界之努力的反思。自亚里士多德以降直至今天，人们为回应这些悖论所提出的问题而做的种种尝试，令芝诺悖论影响绵延不绝。本文的主题是芝诺本人，故此力求对他的思想给出一幅合乎历史的概览，而非记述哲学家、数学家与物理学家如何回应他那富有挑衅性的论证。
