      The evidence of Plato’s *Parmenides*, then, does not license the conventional view that Zeno’s arguments against plurality and motion were intended to support the strict monism of Parmenides. Claims to the contrary have rested upon selective and prejudicial use of this evidence due to the tendency to privilege Socrates’ remarks on Zeno’s purposes over Zeno’s own qualifications and corrections of that analysis. What Plato actually suggests is that Zeno aimed to show those whose superficial understanding of Parmenides had led them to charge him with flying in the face of common sense, that common sense views concerning unity and plurality are themselves riddled with latent contradictions. Such is, essentially, the judgment of Jonathan Barnes: “Zeno was not a systematic Eleatic solemnly defending Parmenides against philosophical attack by a profound and interconnected set of reductive argumentations. Many men had mocked Parmenides: Zeno mocked the mockers. His *logoi* were designed to reveal the inanities and ineptitudes inherent in the ordinary belief in a plural world; he wanted to startle, to amaze, to disconcert. He did not have the serious metaphysical purpose of supporting an Eleatic monism” (Barnes 1982, 236)[^barnes-1982]. However, whether the historical Zeno was actually involved in anything like the dialectical context Plato envisages for him must remain uncertain. Even if there were already in Zeno’s day individuals who mistook Parmenides’ position for the thesis that only one thing exists, the idea that Zeno’s arguments were motivated by a desire to respond to such individuals in kind is as historically unverifiable as the claim Plato puts in his mouth that his book was stolen and circulated before he could decide for himself whether to make his arguments public (Pl. *Prm*. 128d7–e1).
    step1: |-
      于是，柏拉图《巴门尼德篇》的证据并不许可那种通行观点：芝诺反对众多与运动的论证意在支持巴门尼德的严格一元论。相反的主张依赖于对这一证据的选择性且有偏袒的使用，其根源在于人们倾向于看重苏格拉底关于芝诺意图的评论，而轻视芝诺本人对那一分析的限制与纠正。柏拉图实际上提示的是：芝诺意在向那些人表明——他们对巴门尼德的表面理解促使他们指责他公然违抗常识——关于统一与众多的常识观点本身就充满潜在矛盾。这在本质上就是乔纳森·巴恩斯的判断：“芝诺不是一个系统的爱利亚主义者，并不是以一套深刻而相互关联的归约论证来庄严地为巴门尼德抵御哲学攻击。许多人嘲讽过巴门尼德：芝诺嘲讽那些嘲讽者。他的 *logoi* 旨在揭示对复多世界的通常信念中所固有的空洞与笨拙；他想惊吓、想令人惊奇、想使人不安。他没有那种支持爱利亚一元论的严肃形而上学意图”（Barnes 1982, 236）[^barnes-1982]。不过，历史上的芝诺是否真的参与了某种类似于柏拉图为他设想的辩证语境的东西，仍须存疑。即便在芝诺的时代已有一些人把巴门尼德的立场误认作“只有一物存在”这一论旨，“芝诺的论证出于以牙还牙回应这些人之愿望”这一想法，也与柏拉图借他之口说出的那个主张同样无从历史验证——即他的书被人偷走并流传，而他还没能自己决定是否公开其论证（Pl. *Prm*. 128d7–e1）。
