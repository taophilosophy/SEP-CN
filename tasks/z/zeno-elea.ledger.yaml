      “First,” Aristotle says, “there is the argument about its being impossible to move because what moves must reach the half-way point earlier than the end” (*Ph*. 6.9, 239ᵇ11–13). He says no more about this argument here but alludes to his earlier discussion of it in *Physics* 6.2, where, after arguing that both time and magnitude are continuous, he asserts: “Therefore the argument of Zeno falsely presumes that it is not possible to traverse or make contact with unlimited things individually in a limited time” (233ᵃ21–3). Subsequently, in *Physics* 8.8, he again raises the question of how to respond “to those posing the question of Zeno’s argument, if one must always pass through the half-way point, and these are unlimited, and it is impossible to traverse things unlimited” (263ᵃ4–6), and he proceeds to offer what he claims is a more adequate solution than the one presented in *Physics* 6.2. The argument Aristotle is alluding to in these passages gets its name from his mention in *Topics* 8.8 of “Zeno’s argument that it is not possible to move or to traverse the stadium” as a prime example of an argument opposed to common belief yet difficult to resolve (160ᵇ7–9).
    step1: |-
      “第一，”亚里士多德说，“是关于运动不可能的论证：运动着的东西必须先到达中点，然后才到终点”（*Ph*. 6.9, 239ᵇ11–13）。他在此对此论证没有再多说什么，只是提到他早先在《物理学》6.2 中的讨论；在那里，他在论证时间与大小皆为连续之后断言：“因此，芝诺的论证错误地预设：不可能在有限的时间内逐个地遍历或接触无限的东西”（233ᵃ21–3）。随后在《物理学》8.8 中，他再次提出如何回应“芝诺论证所提出的问题，即如果必须总是先经过中点，而这些中点又是无限的，就不可能遍历无限的东西”（263ᵃ4–6），并进而给出了他自称比《物理学》6.2 中的方案更充分的解决。亚里士多德在这些段落所指的论证得名于他在《论题篇》8.8 中的提及——“芝诺的论证：不可能移动或遍历运动场”——他将其作为反对通常信念却又难以解决的论证的首要例子（160ᵇ7–9）。
