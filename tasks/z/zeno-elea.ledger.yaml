      Immediately after his brief presentation of the Stadium, Aristotle introduces the most famous of Zeno’s paradoxes of motion, that of Achilles and the Tortoise: “Second is the one called ‘Achilles’: this is that the slowest runner never will be overtaken by the fastest; for it is necessary for the one chasing to come first to where the one fleeing started from, so that it is necessary for the slower runner always to be ahead some” (*Ph*. 6.9, 239ᵇ14–18). Simplicius adds the identification of the slowest runner as the tortoise (*in Ph*. 1014, 5). Aristotle remarks that this argument is merely a variation on the Dichotomy, with the difference that it does not depend on dividing in half the distance taken (*Ph*. 6.9, 239ᵇ18–20), and his analysis, such as it is, emphasizes that this paradox is to be resolved in the same way as the first paradox of motion. Whether this is actually the case is debatable.
    step1: |-
      在简短呈现运动场之后，亚里士多德立即引入芝诺最著名的运动悖论，阿基里斯与龟的悖论：“第二是所谓‘阿基里斯’：这就是说跑得最慢的永远不会被跑得最快的追上；因为追赶者必须先到达被追赶者出发的地方，所以跑得较慢者必定总是在前面一段”（*Ph*. 6.9, 239ᵇ14–18）。辛普里丘补充指明跑得最慢者就是龟（*in Ph*. 1014, 5）。亚里士多德评论说，这一论证只是二分法的一个变体，不同之处在于它不依赖于把走过的距离对半分割（*Ph*. 6.9, 239ᵇ18–20）；他的分析——就其而言——强调这一悖论应当以与第一个运动悖论相同的方式解决。实际情况是否如此，是可以争论的。
