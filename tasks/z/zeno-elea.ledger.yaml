      Aristotle’s ensuing discussion of what he takes to be Zeno’s mistakes is based on an *exempli gratia* scenario normally taken as a basis for reconstruction, as it is here. “For example,” Aristotle says, “let the resting equal masses be those marked AA, let those marked BB be beginning from the middle, being equal in number and size to these, and let those marked CC be beginning from the end, being equal in number and size to these, and moving at the same speed as the *B*s” (Arist. *Ph*. 6.9, 240ᵃ4–8).
