      “Fourth,” Aristotle says, “is the one about the things in the stadium moving from opposite directions, being of equal bulk, alongside things of equal size, with some moving from the end of the stadium and some from the middle, at equal speed, in which case he supposes it turns out that half the time is equal to its double” (*Ph*. 6.9, 239ᵇ33–240ᵃ1).
