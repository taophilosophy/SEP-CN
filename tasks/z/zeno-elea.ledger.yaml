      在其亚里士多德《物理学》第一卷评注中，亚历山大里亚的新柏拉图主义者辛普里丘（公元 6 世纪）逐字引用了芝诺“如果存在许多事物，它们既有限又无限”的论证，如下：“如果存在许多事物，那么它们必定恰好是那么多，既不比自身多，也不比自身少。但如果它们恰好是那么多，它们就会是有限的。如果存在许多事物，存在者就是无限的；因为在这诸存在者之间总有别的东西，而在那些东西之间又有别的。所以存在者是无限的”（Zeno fr. 3 DK，即 Simp. *in Ph*. 140.29–33 Diels）。这是唯一一个看起来被完整保存下来的芝诺式二律背反。
