      The conclusion also follows from the necessity of the past. Suppose I make a decision *D* at time *t*. Since God is omniscient, he has always believed that *D* occurs at *t*. Since he can't be mistaken, God's believing at some earlier time *t*_{*n*} that *D* occurs at *t* entails that *D* occurs at *t*. But God's forebelief is past in relation to *t* and is therefore “now necessary” in the sense that nothing done at *t* can alter it. What is entailed by a necessary fact is itself necessary, however. Therefore, *D* could not fail to occur at *t*. Nor can one evade this conclusion by appealing to God's timelessness as some do. For even if God's ‘forebeliefs’ are timeless and so don't precede the events they are about, divinely inspired prophecies are not. Yet divinely inspired prophecies, too, are necessarily connected with the human actions they foretell and they are clearly past (and hence necessary) in relation to them.
