      他的看法简言之如下。“现前观念”是生动、清晰、分明的观念。思想有一种倾向：用“符号”（即语词或意象）替代现前观念。这种倾向有用且通常无害，但当“我们对［诸观念之间的］联结或推论茫然无措，或要引出新推断，或想看清某个新论证的力量”时，它便妨碍推理（《杂记》，第 782 则；Edwards 1957–，第 18 卷，457）。既然对一题材作准确推理须注意其现前观念，缺乏相关现前观念者便不能准确推理宗教。例如，要对上帝有一个现前观念，就必须对其组成部分有现前观念。但我们多数人没有。人人都有的上帝观念的诸部分（如关于知识、力量与公义的观念）要么未被注意，即使注意了，也不能引起恰当的情感反应。此外，我们没有经历过的诸情感的观念，我们便不能完全理解；故我们自己若不仁爱，便不能恰当地理解上帝的仁爱。而没有真正的美的简单观念，人既不能理解上帝的圣洁，也不能理解依赖它的事实。
