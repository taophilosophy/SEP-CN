    source: |-
      Thomas of Erfurt was the most influential member of a group of later medieval philosophers known as the speculative grammarians or *Modistae* (Modists), after the central place they assigned to the *modi significandi* (modes of signifying) of a word in their analyses of human discourse. The notion that a word, once it has been imposed to signify, carries with it all of its syntactical modes, or possible combinations with other words, had been around since the twelfth century. What the *Modistae* did was to posit the origins of the *modi significandi* in terms of parallel theories of *modi intelligendi* (modes of understanding) and *modi essendi* (modes of being). The result was a curious amalgam of philosophy, grammar, and linguistics. Thomas of Erfurt’s *De modis significandi* became the standard Modist textbook in the fourteenth century, though it has since enjoyed even greater fame later thanks to its misidentification as a work of Duns Scotus. The text appeared in early printed editions of Scotus’s *Opera Omnia*, where it was read and commented upon by later figures such as Charles S. Peirce and Martin Heidegger, whose 1916 doctoral thesis, *Die Kategorien- und Bedeutungslehre des Duns Scotus*, should have been titled, *Die Kategorienlehre des Duns Scotus und die Bedeutungslehre des Thomas von Erfurt*.
    step1: |-
      埃尔福特的托马斯是晚期中世纪哲学家群体中最有影响的一员，这个群体被称为思辨语法学家或 *Modistae*（摩迪斯泰派），得名于他们赋予语词之 *modi significandi*（意指方式）在人类话语分析中的核心地位。语词一经被施加而有所意指，便带有其全部句法方式、即与其他语词的可能组合，这一观念自十二世纪以来便已存在。*Modistae* 所做的是以 *modi intelligendi*（理解方式）与 *modi essendi*（存在方式）的平行理论来设定 *modi significandi* 的起源。结果是哲学、语法与语言学的一种奇特的混合。埃尔福特托马斯的《论意指方式》在十四世纪成为摩迪斯泰派的标准教科书，尽管它后来因被误认为邓斯·司各脱的著作而享有更大的名声。该文本出现在司各脱《全集》的早期印本中，后来的学者如查尔斯·桑德斯·皮尔士与马丁·海德格尔都曾阅读并评论它，海德格尔 1916 年的博士论文《邓斯·司各脱的范畴学说与意义学说》本应题为《邓斯·司各脱的范畴学说与托马斯·冯·埃尔福特的意义学说》。
