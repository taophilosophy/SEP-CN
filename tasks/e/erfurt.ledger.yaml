    source: |-
      For more recent influence, we need look no further than Jacques Derrida, who mentions Thomas of Erfurt (this time dressed as himself) in connection with the old Peircean idea that logic is a branch of semiotics: “As in Husserl (but the analogy, although it is most thought-provoking, would stop there and one must apply it carefully), the lowest level, the foundation of the possibility of logic (or semiotics) corresponds to the project of the *Grammatica speculativa* of Thomas d’Erfurt, falsely attributed to Duns Scotus” (1976: 48). What impresses Derrida is not so much the reduction of logic to grammar as the deconstructive potential of Husserl’s phenomenology of signs. The idea of deconstructing the science of language would have struck Thomas as absurd, of course, though he probably would have felt some affinity with the highly variegated notion of the sign in modern semiotics.
    step1: |-
      至于更晚近的影响，我们只需看雅克·德里达（Jacques Derrida），他在谈及皮尔士式的旧观念——逻辑是符号学的一个分支——时提到埃尔福特的托马斯（这次是作为他自己）：‘正如在胡塞尔那里（但这一类比，尽管极具启发性，也到此为止，必须谨慎运用），逻辑（或符号学）之可能性的最低层面、其基础，对应于埃尔福特的托马斯的《思辨语法》这一计划，后者被错误地归于邓斯·司各脱’（1976: 48）。给德里达留下深刻印象的，与其说是把逻辑还原为语法，不如说是胡塞尔符号现象学的解构潜能。当然，解构语言科学的观念在托马斯看来会显得荒谬，不过他很可能会对现代符号学中高度多样的符号观念感到某种亲缘。
