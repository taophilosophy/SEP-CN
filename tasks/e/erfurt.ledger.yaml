      > *每一个意指方式都源于事物的某个属性*。关于第二点需要指出：既然这类观念或意指方式并非虚构，那么每一个意指方式都必然从根本上源于事物的某个属性。其理如下：既然理智为了意指而在某种意指方式之下施加语音，它就考察它最初据以获得该意指方式的事物的那个属性本身；这是因为理智作为一种就其自身而言不确定的被动能力，除非被另一来源所规定，否则不会进展到确定的活动。既然它在确定的意指方式之下施加语音以作意指，它就必然被事物的某个确定的属性所推动；因此，事物的某个属性、或事物的某个存在方式，对应于任何一个意指方式。（*DMS*，2.4；Bursill-Hall: 3）
