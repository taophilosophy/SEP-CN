      Modist explanations of semantic phenomena tended to be extremely complicated. Indeed, if we consider the manifold ways in which a word can be a signifier together with its potential for combination with other words in expressions, there could be infinitely many *modi significandi* — a proliferation of modes repeated all over again at the level of *modi intelligendi*. Philosophers today think of Meinong’s theory of objects as a paradigm of ontological incontinence. These philosophers have never met the *Modistae*, who would make even Meinong seem parsimonious. But in a way this is unfair, of course, since the *Modistae* were not ontologists and had no interest in the ontological consequences of their theories. They were first and foremost concerned with the phenomenon of linguistic meaning, and invoked whatever entities they felt could best explain what they observed.
    step1: |-
      摩迪斯泰对语义现象的解释往往极其复杂。的确，如果我们考虑一个语词作为意指者的多种方式、连同它在表达式中与其他语词组合的潜能，那么 *modi significandi* 可能有无限多个——这种方式的大量增殖在 *modi intelligendi* 层面再次重复。今天的哲学家把迈农（Meinong）的对象理论视为本体论失禁（ontological incontinence）的范式。这些哲学家从未遇到过 *Modistae*，后者会让迈农也显得节俭。但当然，在某种意义上这是不公平的，因为 *Modistae* 并非本体论者，对他们的理论的本体论后果毫无兴趣。他们首要关注的是语言意义这一现象，并援引他们认为最能解释其所观察之物的任何实体。
