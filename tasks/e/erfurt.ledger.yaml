      In 1922, however, Grabmann conclusively demonstrated that it was Thomas of Erfurt who wrote *De modis significandi*, not Duns Scotus.[^note-27] So the claim that Heidegger wrote his *Habilitationsschrift* on Duns Scotus is only partly true. The first half, *die Kategorienlehre*, is correctly addressed to Scotus’s theory of the categories as developed in his authentic commentaries on Porphyry’s *Isagoge*, and Aristotle’s *Categories* and *De sophisticis elenchis*. But the second half, *die Bedeutungslehre*, is based almost entirely on Thomas of Erfurt.[^note-28]
    step1: |-
      然而，1922 年，格拉布曼决定性地证明了写作《论意指方式》的是埃尔福特的托马斯，而非邓斯·司各脱。[^note-27] 因此，海德格尔就邓斯·司各脱撰写其教授资格论文的说法只有部分为真。前半部分《范畴学说》（*die Kategorienlehre*）正确地处理了司各脱的范畴理论，这一理论在他对波菲利《导论》、亚里士多德《范畴篇》与《辩谬篇》的可靠注释中得到发展。但后半部分《意义学说》（*die Bedeutungslehre*）几乎完全基于埃尔福特的托马斯。[^note-28]
