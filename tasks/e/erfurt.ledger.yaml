      Some copies of *De modis significandi* attribute the work to an early fourteenth-century English cleric named Thomas of Occam, but scholars have been skeptical about this because it occurs in just a handful fifteenth-century manuscripts.[^note-4] The vast majority of the manuscript evidence, and all of the earliest witnesses, refer to its author as Thomas of Erfurt.
    step1: |-
      《论意指方式》的一些抄本把该著作归于十四世纪早期一位名叫奥卡姆的托马斯（Thomas of Occam）的英国教士，但学者们对此持怀疑态度，因为它只出现在寥寥几部十五世纪抄本中。[^note-4] 绝大多数抄本证据、以及所有最早的见证，都称其作者为埃尔福特的托马斯。
    step2: |-
      《论意指方式》的一些抄本把这部著作归于十四世纪早期一位名为奥卡姆的托马斯（Thomas of Occam）的英国教士，但学者们对此持怀疑态度，因为它仅见于寥寥几部十五世纪抄本。[^note-4] 绝大多数抄本证据，以及所有最早的见证，都称其作者为埃尔福特的托马斯。
