      One of the many later figures to have unwittingly admired Thomas was the American philosopher, Charles Sanders Peirce (1839–1914), who regarded Duns Scotus as a fellow traveler in metaphysics and whose own semiotic theory resembles the Modist program in certain respects.[^note-23] Peirce quotes verbatim the first six chapters of *De modis significandis* in an 1869 lecture comparing (what he took to be) the views of Duns Scotus and William of Ockham on names and signification. But the lecture is introductory in character, leaving it uncertain whether Peirce fully appreciated what was at stake in Modistic grammar, rather than viewing it, say, as some sort of linguistic addendum to Scotus’s metaphysics.[^note-24]
    step1: |-
      在众多无意中钦佩托马斯的后世人物中，有一位是美国哲学家查尔斯·桑德斯·皮尔士（Charles Sanders Peirce，1839–1914），他把邓斯·司各脱视为形而上学中的同道，其自己的符号学理论在某些方面与摩迪斯泰计划相似。[^note-23] 皮尔士在 1869 年的一次演讲中逐字引用了《论意指方式》的前六章，那场演讲比较了（他所认为的）邓斯·司各脱与威廉·奥卡姆（William of Ockham）关于名称与意指的观点。但该演讲具有导论性质，使人无法确定皮尔士是否充分领会了摩迪斯泰语法中的要旨，而非把它看作，比如说，司各脱形而上学的一种语言学附录。[^note-24]
