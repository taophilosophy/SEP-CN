      Almost nothing is known about the life of Thomas of Erfurt except that he was active as a teacher and philosopher in the first quarter of the fourteenth century.[^note-1] Presumably, he came from the city of Erfurt in present-day Germany. His work shows the influence of the Paris Arts Masters Radulphus Brito (ca. 1270–1320) and Siger of Courtrai (ca. 1280–1341), which suggests that he was educated and perhaps also taught at the University of Paris.[^note-2] Later documents associate him with the school of St. Severus and the *Schottenkloster* of St. Jacob at Erfurt.[^note-3] His most famous grammatical text, *De modis significandi* (On the Modes of Signifying) was known by 1310 and was already being commented upon by 1324. It is possible that he returned to Paris a number of times over the course of his academic career, although there are no records attesting to this.
    step1: |-
      关于埃尔福特托马斯生平所知甚少，只知道他在十四世纪头二十五年作为教师与哲学家活跃。[^note-1] 据推测，他来自今德国境内的埃尔福特城。他的著作显示出巴黎艺学大师拉杜尔弗斯·布里托（Radulphus Brito，约 1270–1320）与库特赖的西热（Siger of Courtrai，约 1280–1341）的影响，这暗示他曾在巴黎大学求学，或许也在那里任教。[^note-2] 后来的文献把他与圣塞维鲁斯学校以及埃尔福特圣雅各的 *Schottenkloster*（苏格兰修道院）联系起来。[^note-3] 他最著名的语法文本《论意指方式》（On the Modes of Signifying）至 1310 年已为人所知，至 1324 年已有人为其作注。他在学术生涯中可能数度返回巴黎，尽管没有记录证明此事。
    step2: |-
      关于埃尔福特托马斯的生平，除了他于十四世纪头二十五年作为教师与哲学家活跃之外，几乎一无所知。[^note-1] 据推测，他来自今德国境内的埃尔福特城。他的著作带有巴黎艺学大师拉杜尔弗斯·布里托（Radulphus Brito，约 1270–1320）与库特赖的西热（Siger of Courtrai，约 1280–1341）的影响，这暗示他曾在巴黎大学受教，或许也在那里执教。[^note-2] 后来的文献把他与圣塞维鲁斯学校以及埃尔福特圣雅各的 *Schottenkloster*（苏格兰修道院）联系在一起。[^note-3] 他最著名的语法文本《论意指方式》（On the Modes of Signifying）至 1310 年已为人所知，至 1324 年已有人为其作注。他在学术生涯中可能数度返回巴黎，尽管并无记录佐证此事。
