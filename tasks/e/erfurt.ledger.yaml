      Thomas’s *De modis significandi* was the last work to develop Modist doctrine to any significant degree.[^note-15] Its clarity and relative brevity led to its adoption as the standard Modist text in medieval universities, replacing the earlier *Modi significandi* of Martin of Dacia. But by 1330 and for reasons that remain unclear, Modism had completely disappeared from Paris, pushed aside by the more powerful and comprehensive approach of the *Summulae de dialectica* of John Buridan (ca. 1300–1361).[^note-16] Modism was never able to overcome certain difficulties, such as its refusal to recognize extra-linguistic context, as a result of which it could not explain how meaning can be communicated via incongruous or imperfect expressions.[^note-17] But the most likely reason for its demise was that it no longer provided satisfying explanations of the phenomena it was supposed to explain. The one thing it could do, provide an account of the syntax of Latin grammar, could be achieved more economically by other means. In addition, the theory became absurdly complicated in order to save the phenomena of the *modi significandi*, suggesting that the *modi* finally collapsed under their own weight, like so many Ptolemaic epicycles.
    step1: |-
      托马斯的《论意指方式》是最后一部把摩迪斯泰学说发展到任何显著程度的著作。[^note-15] 它的清晰与相对简洁使它被中世纪大学采纳为标准摩迪斯泰文本，取代了达契亚的马丁更早的《意指方式》。但到 1330 年，出于至今不明的原因，摩迪斯泰已完全从巴黎消失，被让·布里丹（John Buridan，约 1300–1361）《辩证术纲要》（*Summulae de dialectica*）更强有力、更全面的进路所排挤。[^note-16] 摩迪斯泰始终未能克服某些困难，例如它拒绝承认语言之外的语境，结果无法解释意义如何能通过不协调或不完整的表达式来传达。[^note-17] 但其消亡最可能的原因是，它不再对它本应解释的现象提供令人满意的说明。它所能做的唯一一件事——为拉丁语法的句法提供说明——可以通过其他手段更经济地实现。此外，为了拯救 *modi significandi* 的现象，这一理论变得荒谬地复杂，这暗示 *modi* 最终在其自身重量下崩塌，就像众多托勒密本轮一样。
