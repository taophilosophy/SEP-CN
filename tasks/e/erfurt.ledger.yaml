      *De modis significandi* proved to be so popular that it became the standard (and later, the representative) text for the Modist tradition (see next section), surviving in over 40 fourteenth- and fifteenth-century manuscripts. A printed edition appeared in the late fifteenth century that was reprinted a remarkable 11 times before its ‘definitive’ reprinting in Luke Wadding’s 1639 edition of the complete works of Duns Scotus.[^note-6]
    step1: |-
      《论意指方式》极为流行，以致成为摩迪斯泰传统的标准（后来是代表性）文本（见下节），在超过 40 部十四与十五世纪抄本中保存下来。十五世纪晚期出现了一个印本，在卢克·沃丁 1639 年编邓斯·司各脱全集的‘定本’重印之前，被惊人地重印了 11 次。[^note-6]
