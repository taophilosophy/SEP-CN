      Tidy conceptual schemes tend to become less so when confronted with the empirical facts, and the *Modistae* spent a great deal of time trying to explain recalcitrant linguistic data. After sketching the origins of the *modi significandi* in the first chapters of his treatise, Thomas immediately considers a few objections: how can ‘goddess [*dea*]’ be signified with a feminine noun, which connotes passivity? Answer: a mode of signifying need not always be drawn from the thing signified, for sometimes it “can be taken from the property of the thing of another utterance;” thus, when we say ‘in God’, we do not mean to attribute passivity to God, who suffers not, but only to “imagine him as if being affected by our prayers.” When we use a passive or feminine mode of signifying in relation to God, what we are really doing is signifying our own passive or feminine conception of some *other* thing that *is* a genuine recipient, i.e., something that does correspond to a determinate mode of being *qua* recipient, and then imposing the same word to signify God. In the same way, we impose names on things we cannot sense via the properties of sensible things, thereby attributing “active modes of signifying to their names” (*DMS* 2.5; Bursill-Hall: 4).
    step1: |-
      整齐的概念方案在面对经验事实时往往不再整齐，*Modistae* 花了大量时间试图解释倔强的语言材料。在论著前几章勾勒了 *modi significandi* 的起源之后，托马斯随即考虑几个反驳：‘女神 [*dea*]’怎么能用暗示被动性的阴性名词来意指？答：意指方式不必总是从被意指事物中抽取，因为有时它‘可以从另一语音的事物的属性中取得’；因此，当我们说‘在上帝之中’，我们并不想把这被动性归于不受苦的上帝，而只是想‘把他想象为仿佛受我们祈祷的影响’。当我们对上帝使用被动的或阴性的意指方式时，我们实际上所做的事情是：意指我们对某个*其他*事物的、自己的被动或阴性观念，而那个事物*是*一个真正的承受者，即它确实对应于作为*承受者*的确定存在方式，然后把同一个词施加于上帝。同样，我们通过可感事物的属性给无法感知的事物命名，从而把‘主动的意指方式归于它们的名称’（*DMS* 2.5；Bursill-Hall: 4）。
