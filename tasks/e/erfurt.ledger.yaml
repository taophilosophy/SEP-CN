      埃尔福特的托马斯是晚期中世纪哲学家群体中最具影响的一员，这一群体被称为思辨语法学家或 *Modistae*（摩迪斯泰派），其得名源于他们赋予语词之 *modi significandi*（意指方式）在人类话语分析中的核心地位。语词一经被施加而有所意指，便随之带有其全部句法方式、即与其他语词的可能组合——这一观念自十二世纪以来便已流传。*Modistae* 的工作在于以 *modi intelligendi*（理解方式）与 *modi essendi*（存在方式）的平行理论来设定 *modi significandi* 的起源。其结果是一种哲学、语法与语言学的奇特混合。埃尔福特托马斯的《论意指方式》在十四世纪成为摩迪斯泰派的标准教科书，尽管它后来因被误认为邓斯·司各脱的著作而声名更著。该文本见于司各脱《全集》的早期印本中，后来的学者如查尔斯·桑德斯·皮尔士与马丁·海德格尔都曾研读并评论它；海德格尔 1916 年的博士论文《邓斯·司各脱的范畴学说与意义学说》本应题为《邓斯·司各脱的范畴学说与托马斯·冯·埃尔福特的意义学说》。
