      Thomas of Erfurt had a famous contemporary, Meister Eckhart (c. 1260–1328), the German Dominican philosopher and mystical theologian. Meister Eckhart was not only present in Erfurt at roughly the same time as Thomas, but also lived only a few streets away. It seems incredible that they could not have known each other personally and academically, though there is no explicit evidence that they did. Despite this, there is indirect evidence that Meister Eckhart was influenced by Thomas in his grammatical approach to interpreting scripture. Their intellectual relationship is the subject of a recent volume of essays.[^note-22]
    step1: |-
      埃尔福特托马斯有一位著名的同时代人，迈斯特·艾克哈特（Meister Eckhart，约 1260–1328），德国多明我会哲学家与神秘主义神学家。迈斯特·艾克哈特不仅在约与托马斯同时期住在埃尔福特，而且只住在几条街之外。他们竟然不曾私下或学术上相识，这似乎令人难以置信，尽管没有明确证据表明他们相识。尽管如此，有间接证据表明，迈斯特·艾克哈特在解释圣经的语法进路上受过托马斯的影响。他们的思想关系是近期一部论文集的主题。[^note-22]
