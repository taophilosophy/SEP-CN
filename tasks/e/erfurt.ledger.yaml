      It is easy to see how such an account of meaning could lead to a *bona fide* theory of grammar, what Jan Pinborg called “the first systematic syntax developed in western linguistics”.[^note-10] Indeed, speculative grammarians of both periods have attracted the attention of linguists and philosophers alike.[^note-11] But the stakes were higher for the *Modistae* because the influx of Aristotle’s writings on metaphysics and natural philosophy in the late twelfth and early thirteenth centuries forced everyone to think in terms of a new paradigm of knowledge. Could grammar be reconceived as the science of language (*scientia sermocinalis*)? The question here was whether grammar could count as an Aristotelian speculative science, i.e., whether it is demonstrative in the sense of being a knowledge-producing activity ordained by a single subject whose principles are universal and necessary.[^note-12] Concerns of this sort clearly underlie Boethius of Dacia’s appraisal of traditional grammar:
    step1: |-
      不难看出，这样一种关于意义的说明如何能导向一种真正的语法理论，扬·平堡（Jan Pinborg）称之为‘西方语言学中发展出的第一个系统句法学’。[^note-10] 的确，两个时期的思辨语法学家都吸引了语言学家与哲学家的关注。[^note-11] 但对 *Modistae* 而言，风险更高，因为十二世纪末、十三世纪初亚里士多德关于形而上学与自然哲学的著作的涌入，迫使所有人以一种新的知识范式来思考。语法能否被重新构想为语言科学（*scientia sermocinalis*）？这里的问题是，语法能否算作一种亚里士多德式的思辨科学，即它是否在如下意义上是演证的：一种由单一主题所规定的、产生知识的活动，其原则是普遍而必然的。[^note-12] 这类关切显然构成了波爱修斯对传统语法之评价的基础：
