      Thomas of Erfurt’s *De modis significandi* has enjoyed more attention than it might otherwise have received thanks to its early misidentification as a work of Duns Scotus.[^note-18] As a result, it was printed along with authentic works on logic in volume 1 of Luke Wadding’s seventeenth-century edition of the *Opera Omnia* of Duns Scotus (Lyons 1639), and again in the nineteenth-century reprint of Wadding by Juan-Luis Vivès (Paris 1891).[^note-19] Until recently, the Wadding-Vivès edition was the definitive source for the works of Scotus, so anyone consulting it would have associated *De modis significandi* with him.[^note-20] Complicating the story somewhat is the fact that Scotus was influenced by Modism early in his career, though this was probably due to his exposure to Modist authors such as Simon of Faversham and Andrew of Cornwall.[^note-21] It is unlikely that he was influenced by Thomas of Erfurt, because *De modis significandi* did not circulate widely until after Scotus’s death.
    step1: |-
      埃尔福特托马斯的《论意指方式》享有比它本应得到的更多关注，这要归功于它早期被误认为邓斯·司各脱的著作。[^note-18] 因此，它被印在卢克·沃丁十七世纪所编邓斯·司各脱《全集》第一卷中，与讨论逻辑的可靠著作一起（里昂 1639），并在十九世纪由胡安-路易斯·比韦斯（Juan-Luis Vivès）重印（巴黎 1891）。[^note-19] 直到不久前，沃丁-比韦斯版本都是司各脱著作的权威来源，因此任何查阅它的人都会把《论意指方式》与他联系起来。[^note-20] 使这一故事略显复杂的是，司各脱在其生涯早期受过摩迪斯泰的影响，尽管这很可能是因为他接触了诸如法弗舍姆的西蒙（Simon of Faversham）与康沃尔的安德鲁（Andrew of Cornwall）等摩迪斯泰作者。[^note-21] 他不太可能受埃尔福特托马斯的影响，因为《论意指方式》直到司各脱死后才广泛流传。
