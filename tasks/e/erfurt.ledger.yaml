      Note the phrase, “since such notions or modes of signifying are not fictions.” The *modi significandi* could not play any causal role in determining the parts of speech, nor the corresponding *modi intelligendi* in determining the *modi significandi*, nor the *modi essendi* in determining the *modi intelligendi*, unless they all actually exist. Here the *Modistae* drew on the Aristotelian idea that although spoken sounds and written marks differ from language to language, “what these are in the first place signs of — affections of the soul — are the same for all; and what these affections are likenesses of — actual things — are also the same” (*De interpretatione* 1.16a3–9).[^note-14] Likewise, the ordering of modes was intended to replicate the ordering of disciplines in an Aristotelian speculative science: just as psychology, the study of moving things *qua* animate, is subordinate to physics, the study of things *qua* moving, and physics is subordinate to metaphysics, the study of things *qua* existing, so the principles of grammar (*modi significandi*) are derived from mental acts of signifying (*modi intelligendi*), which reflect the way things really are (*modi essendi*).
    step1: |-
      注意‘既然这类观念或意指方式并非虚构’这一短语。*modi significandi* 不能在规定词类中扮演任何因果角色，相应的 *modi intelligendi* 不能在规定 *modi significandi* 中扮演因果角色，*modi essendi* 不能在规定 *modi intelligendi* 中扮演因果角色——除非它们都实际存在。在这里，*Modistae* 援引了亚里士多德的观念：尽管语音与书写记号因语言而异，但‘这些记号首先所指的东西——灵魂的受动——对所有人是相同的；而这些受动之所摹状——实际事物——也是相同的’（《解释篇》1.16a3–9）。[^note-14] 同样，方式的秩序旨在复制亚里士多德式思辨科学中各学科的秩序：正如心理学（对运动事物 *qua* 有生命的研究）从属于物理学（对事物 *qua* 运动的研究），而物理学从属于形而上学（对事物 *qua* 存在的研究），语法诸原则（*modi significandi*）源于意指的心智活动（*modi intelligendi*），后者反映了事物真实的存在方式（*modi essendi*）。
