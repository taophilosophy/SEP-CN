      Another figure so influenced was Martin Heidegger, whose *Habilitationsschrift* was published in 1916 under the title, *Die Kategorien- und Bedeutungslehre des Duns Scotus*. This book is only beginning to be studied by Heidegger scholars, which is a pity because it is really about Heidegger’s own project of advancing the Husserlian notion of *a priori* grammar. A work of historical scholarship it is not. In what now seems a classic understatement, the historian of medieval philosophy Martin Grabmann wrote of this book in 1926, “Martin Heidegger has demonstrated the continuity of the *Grammatica speculativa* hitherto attributed to Duns Scotus with the terminology and overall intellectual outlook of Husserl, so that the structure and distinctiveness of the medieval original is somewhat obscured”.[^note-25] In his defense, Heidegger never pretends to be doing history of philosophy in *Die Kategorien- und Bedeutungslehre des Duns Scotus*. On the contrary, he states at the beginning of Part II that he is mostly interested in exploring the implications of *De modis significandi* for the broader theory of meaning, and that he is following scholarly consensus in attributing it to Duns Scotus.[^note-26]
    step1: |-
      另一位如此受影响的人物是马丁·海德格尔（Martin Heidegger），其教授资格论文（*Habilitationsschrift*）于 1916 年以《邓斯·司各脱的范畴学说与意义学说》为题出版。这本书只是刚开始被海德格尔研究者研究，这很可惜，因为它实际上关涉海德格尔自己的计划：推进胡塞尔式的 *a priori*（先天）语法观念。它并非一部历史学术著作。用如今看来堪称经典的低调陈述，中世纪哲学史家马丁·格拉布曼（Martin Grabmann）在 1926 年论及此书时写道：‘马丁·海德格尔已证明，迄今归于邓斯·司各脱的《思辨语法》与胡塞尔的术语及总体思想视野具有连续性，以至于中世纪原作的独特性与结构多少被遮蔽了’。[^note-25] 为海德格尔辩护，他在《邓斯·司各脱的范畴学说与意义学说》中从不假装自己在做哲学史。相反，他在第二部分的开头声明，他主要感兴趣的是探究《论意指方式》对更广泛意义理论的意义，并且他遵循学术共识把它归于邓斯·司各脱。[^note-26]
