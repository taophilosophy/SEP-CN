      Six works have been attributed to Thomas of Erfurt. In addition to the aforementioned grammatical treatise, whose full title is *Tractatus de modis significandi seu Grammatica speculativa* (ed. Bursill-Hall 1972)[^bursill-hall-1972],[^note-5] there are four short *expositiones*, or literal commentaries: on Porphyry’s *Isagoge*, Aristotle’s *Categories*, Aristotle’s *De interpretatione*, and the anonymous *Liber sex principiorum* (Book of Six Principles). Finally, there is a very brief work of mnemonic verses for teaching grammar to schoolboys, *Commentarius in carmen ‘Fundamentum puerorum’* (ed. Gansiniec 1960)[^gansiniec-1960], although its editor believes that it is actually an anonymous abridgement of *De modis significandi*. In any case, Thomas’s reputation derives from *De modis significandi*, which remains his only work to have been studied in detail.
    step1: |-
      归于埃尔福特托马斯名下的著作有六部。除了前述语法论著（其全名为《论意指方式或思辨语法》（*Tractatus de modis significandi seu Grammatica speculativa*），Bursill-Hall 1972 年编）[^bursill-hall-1972]，[^note-5] 还有四部简短的 *expositiones*（逐字注释）：对波菲利《导论》、亚里士多德《范畴篇》、亚里士多德《解释篇》以及无名氏的《六原理书》（Book of Six Principles）的注释。最后，还有一部用于向学童教授语法的记忆诗句的极简著作《儿童基础之歌注》（*Commentarius in carmen ‘Fundamentum puerorum’*），Gansiniec 1960 年编[^gansiniec-1960]，尽管编者认为它实际上是《论意指方式》的匿名节本。无论如何，托马斯的声望源于《论意指方式》，它仍然是其唯一一部被详细研究的著作。
    step2: |-
      归于埃尔福特托马斯名下的著作共六部。除前述语法论著（全名为《论意指方式或思辨语法》（*Tractatus de modis significandi seu Grammatica speculativa*），Bursill-Hall 1972 年编）[^bursill-hall-1972]，[^note-5] 外，另有四部简短的 *expositiones*（逐字注释）：对波菲利《导论》、亚里士多德《范畴篇》、亚里士多德《解释篇》以及无名氏《六原理书》（Book of Six Principles）的注释。最后还有一部用于向学童教授语法的记忆诗句的极简著作《儿童基础之歌注》（*Commentarius in carmen ‘Fundamentum puerorum’*），Gansiniec 1960 年编[^gansiniec-1960]，尽管编者认为它实际上是《论意指方式》的匿名节本。无论如何，托马斯的声望源于《论意指方式》，它至今仍是其唯一一部被详细研究的著作。
