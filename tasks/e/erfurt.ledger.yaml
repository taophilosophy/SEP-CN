      There was already a grammatical concept of the *modi significandi* by the time the first *Modistae*, Martin of Dacia and Boethius of Dacia, appeared in Paris sometime before 1270.[^note-8] Originally, the idea referred to the different ways in which a word or expression (*dictio*) is able to signify something. Words themselves are the product of a primary act of imposition by which a particular utterance is connected to some thing or property of a thing, the utterance providing the matter, which is said to be ‘informed’ by the act of imposition. The word acquires its *modi significandi* through a second act of imposition encoding all of the general syntactic roles it can play in connection with other words and expressions, such as the various parts of speech it can fulfill (e.g., noun, verb, adverb) and the grammatical forms of these parts (e.g., the gender, number, and case of nouns; the tense and mood of verbs). These modes are said to cause the various lexical forms exhibited by the word in spoken and written languages. Thus, Latin uses the word ‘*canis*’ to signify what English speakers mean by ‘dog’, but the same modes of signifying determine their function as singular and as nouns.[^note-9] We might think of *modi significandi* metaphorically as hooks or fasteners on a word because they reflect its potential for combination with other words in propositions and other grammatically well-formed constructions.
    step1: |-
      到最早的 *Modistae*——达契亚的马丁（Martin of Dacia）与达契亚的波爱修斯（Boethius of Dacia）——于 1270 年前的某个时候出现在巴黎之时，*modi significandi* 的语法概念已经存在。[^note-8] 最初，这一观念指语词或表达式（*dictio*）能够意指某物的不同方式。语词本身是第一次命名行为（imposition）的产物，通过这一行为，一个特定的语音被联系到某个事物或事物的属性上，语音提供质料，据说这质料被命名行为所‘赋形’。语词通过第二次命名行为获得其 *modi significandi*，这一行为编码了它与其他语词和表达式相连接时所能扮演的全部一般句法角色，例如它能充当的各种词类（如名词、动词、副词）以及这些词类的语法形式（如名词的性、数、格；动词的时态与语气）。据说这些方式造成了语词在口语与书面语中所展现的各种词汇形式。因此，拉丁语用‘*canis*’一词来意指英语使用者所说的‘dog’，但同样的意指方式决定了它们作为单数、作为名词的功能。[^note-9] 我们可以把 *modi significandi* 隐喻地设想为语词上的钩子或扣件，因为它们反映了语词在命题及其他语法上良好的构造中与其他语词组合的潜能。
    step2: |-
