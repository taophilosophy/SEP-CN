      Thomas of Erfurt belonged to an interesting though somewhat obscure group of late thirteenth- and early fourteenth-century philosophers known as the speculative grammarians or *Modistae*. The term ‘speculative grammarian’ is ambiguous because it is also used by historians of medieval philosophy to refer to twelfth-century Parisian grammar masters such as William of Conches, Peter Helias, and Ralph of Beauvais, who systematically revised the ancient grammars of Donatus and Priscian — textbooks used to teach Latin to schoolboys — to produce a universal semantics.[^note-7] The two groups are related, as it turns out, since these latter-day grammarians adopted many of the theories as well as the universalizing tendencies of their twelfth-century predecessors. Foremost among them was the theory of the *modi significandi*, or modes of signifying. The term ‘*Modistae*’ or ‘Modist’ properly refers to the later group.
    step1: |-
      埃尔福特的托马斯属于一个有趣但多少有些模糊的十三世纪末、十四世纪初哲学家群体，他们被称为思辨语法学家或 *Modistae*。‘思辨语法学家’一词是有歧义的，因为中世纪哲学史家也用它指十二世纪的巴黎语法大师，如孔什的威廉（William of Conches）、彼得·埃利亚斯（Peter Helias）与博韦的拉尔夫（Ralph of Beauvais），他们系统地修订了多纳图斯与普里西安的古代语法——这些教科书用于向学童教授拉丁语——以产生一种普遍语义学。[^note-7] 这两个群体是相关的，事实证明，因为这些晚出的语法学家采纳了其十二世纪先驱的许多理论以及普遍化倾向。其中最重要的是 *modi significandi*（意指方式）理论。‘*Modistae*’或‘Modist’一词恰当地指后一个群体。
    step2: |-
      埃尔福特的托马斯属于一个有趣但多少有些模糊的哲学家群体，活跃于十三世纪末至十四世纪初，被称为思辨语法学家或 *Modistae*。‘思辨语法学家’一词含混有歧义，因为中世纪哲学史家也用它指十二世纪的巴黎语法大师，如孔什的威廉（William of Conches）、彼得·埃利亚斯（Peter Helias）与博韦的拉尔夫（Ralph of Beauvais），他们系统地修订了多纳图斯与普里西安的古代语法——这些用于向学童教授拉丁语的教科书——以产生一种普遍语义学。[^note-7] 事实证明，这两个群体彼此相关，因为这些晚出的语法学家采纳了其十二世纪先驱的许多理论以及普遍化倾向，其中最重要的是 *modi significandi*（意指方式）理论。‘*Modistae*’或‘Modist’一词恰当地指后一个群体。
