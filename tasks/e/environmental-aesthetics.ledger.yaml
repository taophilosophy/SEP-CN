      In an aside, Hepburn attributed the decline in philosophical interest in the aesthetics of nature, in part, to a degradation of our experience of nature itself, referring to the “forced ecstasies and hypocrisies of a fashionable and trivialized nature-cult” (1966: 286). Hepburn’s swipe at the standardized “scenic aesthetic” of motorized tourism was an oblique one, but Allen Carlson developed this theme into an explicit analysis and critique (Carlson 1977, 1979)[^carlson-1977][^carlson-1979]. The foundation of the “scenic aesthetic”, Carlson argued, was what he called “the landscape model” of nature appreciation, which proposes appreciating nature more or less as we appreciate landscape paintings. This requires treating the environment as if it were a series of two-dimensional scenes and focusing either on artistic qualities dependent upon romantic images of the kind associated with the idea of the picturesque or simply on its formal aesthetic qualities. Carlson further argued that the VLQA techniques used to measure aesthetic value for the purposes of environmental management were in fact premised on this model and were therefore inadequate (Carlson 1977; see also Sagoff 1974)[^carlson-1977][^sagoff-1974]. Carlson’s critique of VLQA methodology connected directly to debates within the field itself over the supposed lack of an adequate conceptual framework to support empirical work, or what one critic called the field’s “theoretical vacuum” (Appleton 1975b; see also Sparshott 1972, Ribe 1982, Carlson 1984b)[^appleton-1975b][^carlson-1984b][^ribe-1982][^sparshott-1972]. Despite this overlap, philosophical and empirical debates concerning nature’s aesthetic value have largely continued to play out independently (though see the discussion of “ecological aesthetics” in section 4.1, below).
    step1: |-
      Hepburn 在附论中把哲学界对自然美学的兴趣衰落部分归因于我们自身自然经验退化，提到“时尚而庸俗化的自然崇拜所强加的狂喜与虚伪”（1966: 286）。Hepburn 对机动旅游标准化“风景美学”的抨击较为间接，Allen Carlson 则把这一主题发展为明确的分析与批判（Carlson 1977, 1979）[^carlson-1977][^carlson-1979]。Carlson 主张，“风景美学”的基础是他所谓自然欣赏的“景观模式”，即大致像欣赏风景画那样欣赏自然。这要求把环境当作一系列二维场景，并聚焦于依赖浪漫图像（与如画观念相关）的艺术品质，或仅聚焦其形式审美品质。Carlson 进一步主张，用于环境管理目的测量审美价值的 VLQA 技术，实际上以此模型为前提，因此并不充分（Carlson 1977; 亦见 Sagoff 1974）[^carlson-1977][^sagoff-1974]。Carlson 对 VLQA 方法论的批判，直接关联该领域内部关于缺乏足够概念框架支持经验工作的争论，或被一位批评者称为该领域“理论真空”的问题（Appleton 1975b; 亦见 Sparshott 1972, Ribe 1982, Carlson 1984b）[^appleton-1975b][^carlson-1984b][^ribe-1982][^sparshott-1972]。尽管存在重叠，关于自然审美价值的哲学与经验争论在很大程度上仍各自独立展开（不过见下文 4.1 节对“生态美学”的讨论）。
