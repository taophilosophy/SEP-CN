      The study of nature aesthetics was ultimately rejuvenated in the 1960s after a sense of environmental crisis took hold of popular consciousness, leading to the emergence of the modern environmental movement. One important practical development was the passage of protective environmental legislation in the US and UK. Since some of these laws made reference to “natural beauty” or “aesthetic values”, clarifying these notions and determining how to measure them became matters of practical, rather than merely philosophical, importance. This led to the development of empirical methods for “visual landscape quality assessment” (VLQA) and to attempts to provide a theoretical framework for their use (on the origin of VLQA see Zube, Sell, & Taylor 1982; for recent overviews of the field see Daniel 2001; C. Thompson & Tarvlou 2009)[^daniel-2001][^thompson-2009]. The latter included appeals to ideas in developmental and environmental psychology (Kaplan & Kaplan 1989; Bourassa 1991)[^bourassa-1991][^kaplan-1989] as well as evolutionary psychology (Appleton 1975a, 1982; Orians 1986; Orians & Heerwagen 1992)[^appleton-1975a][^orians-1986][^orians-1992], an approach that has attracted much philosophical attention (Davies 2012; Paden, Harmon, & Milling 2012; Bartalesi & Portera 2015; Paden 2015a, 2016)[^bartalesi-2015][^davies-2012][^paden-2015a].
    step1: |-
      自然美学的研究最终在二十世纪六十年代复兴，其时环境危机的意识抓住了公众心灵，促成了现代环境运动。一项重要的实践进展是美国与英国通过了保护性环境立法。由于其中一些法律提到“自然美”或“审美价值”，澄清这些概念并确定如何测量它们，便成了具有实践意义而不仅是哲学意义的事情。这促成了“视觉景观质量评估”（VLQA）的经验方法的发展，也促成了为其使用提供理论框架的尝试（关于 VLQA 的起源见 Zube, Sell, & Taylor 1982；该领域的近期概览见 Daniel 2001; C. Thompson & Tarvlou 2009）[^daniel-2001][^thompson-2009]。后者包括诉诸发展心理学与环境心理学的观念（Kaplan & Kaplan 1989; Bourassa 1991）[^bourassa-1991][^kaplan-1989]，以及进化心理学（Appleton 1975a, 1982; Orians 1986; Orians & Heerwagen 1992）[^appleton-1975a][^orians-1986][^orians-1992]，这一进路引起了大量哲学关注（Davies 2012; Paden, Harmon, & Milling 2012; Bartalesi & Portera 2015; Paden 2015a, 2016）[^bartalesi-2015][^davies-2012][^paden-2015a]。
    step2: |-
      自然美学的研究到二十世纪六十年代终于复兴。那时环境危机的感觉攫住了公众意识，现代环境运动由此兴起。一项重要的实践进展是美英两国相继通过保护环境的法律。这类法律有些提到“自然美”或“审美价值”，于是澄清这些概念、确定其测量方式，就不再只是哲学问题，而成了实务上的当务之急。由此发展出“视觉景观质量评估”（VLQA）的实证方法，也出现了为这类方法提供理论框架的努力（VLQA 的起源见 Zube, Sell, & Taylor 1982；领域概览见 Daniel 2001; C. Thompson & Tarvlou 2009）[^daniel-2001][^thompson-2009]。后者包括援引发展心理学与环境心理学的理论（Kaplan & Kaplan 1989; Bourassa 1991）[^bourassa-1991][^kaplan-1989]，以及进化心理学（Appleton 1975a, 1982; Orians 1986; Orians & Heerwagen 1992）[^appleton-1975a][^orians-1986][^orians-1992]；这条进路招来了不少哲学讨论（Davies 2012; Paden, Harmon, & Milling 2012; Bartalesi & Portera 2015; Paden 2015a, 2016）[^bartalesi-2015][^davies-2012][^paden-2015a]。
