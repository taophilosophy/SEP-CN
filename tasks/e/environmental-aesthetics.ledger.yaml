      A defender of Aesthetic Protectionism might respond that this last set of concerns ultimately stems from the scenic aesthetic, a view that should be rejected. Indeed, Hepburn and Carlson’s early critiques of the Picturesque have been echoed by many writers concerned with environmental protection, who have dismissed the scenic aesthetic as anthropocentric (Godlovitch 1994)[^godlovitch-1994], scenery-obsessed (Saito 1998a; Gobster 1999)[^gobster-1999][^saito-1998a], trivial (Callicott 1994)[^callicott-1994], subjective (J. Thompson 1995)[^thompson-1995], and/or morally vacuous (Andrews 1989)[^andrews-1989]. But even granting the case against the scenic aesthetic, it remains an open question how its replacement would fare with respect to the problems just cited. How widely will we find aesthetic value in nature? Will focusing protective efforts on aesthetics help or hinder environmental protection, from an ecological perspective? The most promising candidate on many of these scores would seem to be the NEM and its variants, given that these approaches take ecological understanding to be critically relevant to aesthetic appreciation. Nonetheless, some have questioned the extent to which even ecologically-informed approaches can successfully address these issues (Budd 2002; Hettinger 2005, 2008; Berleant 2010a, 2016; Bannon 2011; Stecker 2012; Herguedas 2018; Mikkonen 2018)[^bannon-2011][^berleant-2010a][^budd-2002][^herguedas-2018][^hettinger-2005][^mikkonen-2018][^stecker-2012].
    step1: |-
      审美保护主义的辩护者可以回应说，最后一组担忧归根结底源自风景美学，而那种观点应当被抛弃。事实上，赫伯恩与卡尔森早期对如画的批判，得到了许多关心环境保护的作者的呼应，他们把风景美学斥为人类中心主义的（Godlovitch 1994）[^godlovitch-1994]、痴迷于景色的（Saito 1998a; Gobster 1999）[^gobster-1999][^saito-1998a]、琐碎的（Callicott 1994）[^callicott-1994]、主观的（J. Thompson 1995）[^thompson-1995]，以及/或在道德上空洞的（Andrews 1989）[^andrews-1989]。但即便承认反对风景美学的理由成立，其替代方案在刚刚提到的那些问题上表现如何，仍是一个悬而未决的问题。我们在自然中能多广泛地发现审美价值？从生态观点看，把保护努力集中于美学是有助于还是有碍于环境保护？在许多方面最有希望的候选者似乎是 NEM 及其变体，因为这些进路把生态理解视为与审美欣赏批判性地相关。尽管如此，一些人质疑即便以生态学为依据的进路能在多大程度上成功处理这些问题（Budd 2002; Hettinger 2005, 2008; Berleant 2010a, 2016; Bannon 2011; Stecker 2012; Herguedas 2018; Mikkonen 2018）[^bannon-2011][^berleant-2010a][^budd-2002][^herguedas-2018][^hettinger-2005][^mikkonen-2018][^stecker-2012]。
    step2: |-
      为审美保护主义辩护的人可以这样答复：最后一类顾虑说到底是风景美学带来的，而风景美学本就该被摈弃。事实上，赫伯恩与卡尔森早年对如画的批评，得到不少关心环境保护的学者响应，他们把风景美学指为人类中心主义（Godlovitch 1994）[^godlovitch-1994]、眼里只有景色（Saito 1998a; Gobster 1999）[^gobster-1999][^saito-1998a]、琐屑无聊（Callicott 1994）[^callicott-1994]、主观任意（J. Thompson 1995）[^thompson-1995]，或者道德上空空洞洞（Andrews 1989）[^andrews-1989]。可即便反对风景美学的理由成立，换上替代方案之后能否应付上述难题，仍是未定之数：我们在自然中究竟能多普遍地发现审美价值？从生态角度看，把保护的力气押在美学上，是帮了环境保护还是添了乱？就其中许多指标而言，最有希望的候选者看来是 NEM 及其变体，因为它们都认为生态理解与审美欣赏有要紧的关联。不过也有人怀疑，即便这类以生态学为据的路向，也只能在有限程度上解决这些问题（Budd 2002; Hettinger 2005, 2008; Berleant 2010a, 2016; Bannon 2011; Stecker 2012; Herguedas 2018; Mikkonen 2018）[^bannon-2011][^berleant-2010a][^budd-2002][^herguedas-2018][^hettinger-2005][^mikkonen-2018][^stecker-2012]。
