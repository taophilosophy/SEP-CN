      A second source of theoretical work was the nascent field of environmental philosophy, which produced works that appealed to beauty and aesthetics as elements in a wider environmental philosophy (see, e.g., Shepard 1967 [1991])[^shepard-1967]. Within philosophical aesthetics itself, however, the impetus for renewed attention to nature came largely from Ronald Hepburn’s essay “Contemporary Aesthetics and the Neglect of Natural Beauty” (Hepburn 1966)[^hepburn-1966], which is widely recognized as setting the agenda for the aesthetics of nature for the late twentieth century (Brook 2010; Sepänmaa 2010; Carlson 2014; Saito 2014)[^brook-2010][^carlson-2014][^saito-2014][^sepänmaa-2010]. After noting that analytic aesthetics had virtually ignored the natural world, Hepburn argued that an account of the appreciation of nature would have to do more than simply extend principles appropriate to the appreciation of art: it would need to acknowledge the features distinctive to nature as an object of appreciation . He claimed that in the aesthetic appreciation of nature, as in the appreciation of art, there is a distinction between appreciation that is only trivial and superficial and that which is “serious” and “deep”. Hepburn suggested that the latter must acknowledge not only nature’s indeterminate and varying character, but also both our multi-sensory experience and our diverse understanding of it. In short, nature is of no less aesthetic interest than art, and ought to be appreciated based on principles appropriate to it, rather than principles arbitrarily imported from the Arts.
    step1: |-
      理论工作的第二个来源是新兴的环境哲学领域，其作品把美与美学作为更广泛环境哲学的要素（例如见 Shepard 1967 [1991]）[^shepard-1967]。然而在哲学美学内部，重新关注自然的动力主要来自 Ronald Hepburn 的论文《当代美学与自然美的忽视》（Hepburn 1966）[^hepburn-1966]；该文被广泛认为为 20 世纪晚期自然美学设定了议程（Brook 2010; Sepänmaa 2010; Carlson 2014; Saito 2014）[^brook-2010][^carlson-2014][^saito-2014][^sepänmaa-2010]。Hepburn 指出分析美学几乎忽视了自然世界，随后主张：自然欣赏的论述不能只是把适用于艺术欣赏的原则延伸过来，而必须承认自然作为欣赏对象的独有特征。他主张，在自然审美欣赏中，如同在艺术欣赏中，存在仅属琐碎肤浅的欣赏与“严肃”“深刻”的欣赏之别。Hepburn 建议，后者必须承认自然的不确定与变化特征，也必须承认我们的多感官经验与对它的多样理解。简言之，自然的审美趣味不亚于艺术，应当依据适合自然的原则来欣赏，而不是任意从艺术输入的原则。
