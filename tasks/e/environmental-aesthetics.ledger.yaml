      In this concluding section we discuss six themes that represent new directions pursued in recent work in environmental aesthetics. Beyond those mentioned here, other issues include the social and quasi-institutional dimensions of environmental appreciation (Lopes 2020)[^lopes-2020], the expressiveness of landscape (Wollheim 1991 [1993]; Howarth 1995; Pérez-Carreño 2021)[^howarth-1995][^pérez-2021][^wollheim-1991], the role of sound in environmental appreciation (J. Fisher 1998, 1999; Dyck 2016; Prior 2017)[^dyck-2016][^fisher-1998][^fisher-1999][^prior-2017][^prior-2017-2], the connection between environmental aesthetics and feminist thought (W. Lee 2006; Lintott 2010)[^lee-2006][^lintott-2010], and the role of consumer aesthetics in causing environmental damage (Lintott 2006; Saito 2007, 2018; Maskit 2011; for an unvarnished historical overview, see Richardson 2019)[^lintott-2006][^maskit-2011][^richardson-2019][^saito-2007][^saito-2018].
    step1: |-
      在本结论性部分，我们讨论代表环境美学近期工作新方向的六个主题。除此之外，其他问题还包括环境欣赏的社会与准制度维度（Lopes 2020）[^lopes-2020]、景观的表现性（Wollheim 1991 [1993]; Howarth 1995; Pérez-Carreño 2021）[^howarth-1995][^pérez-2021][^wollheim-1991]、声音在环境欣赏中的作用（J. Fisher 1998, 1999; Dyck 2016; Prior 2017）[^dyck-2016][^fisher-1998][^fisher-1999][^prior-2017][^prior-2017-2]、环境美学与女性主义思想的联系（W. Lee 2006; Lintott 2010）[^lee-2006][^lintott-2010]，以及消费美学在造成环境损害中的作用（Lintott 2006; Saito 2007, 2018; Maskit 2011; 不加粉饰的历史综述见 Richardson 2019）[^lintott-2006][^maskit-2011][^richardson-2019][^saito-2007][^saito-2018]。
