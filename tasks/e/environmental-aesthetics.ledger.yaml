      A final point of interest regarding the aesthetics of animals has been the multitude of specific ways in which people aesthetically encounter them, such as in the wild (Rolston 1987)[^rolston-1987], in the “rewild” (Prior & Brady 2017)[^prior-2017][^prior-2017-2], in scientific or quasi-scientific displays such as aquaria (Leddy 2012b; Semczyszyn 2013a)[^leddy-2012b][^semczyszyn-2013a], in zoos (Tafalla 2017; Parsons 2023b)[^parsons-2023b][^tafalla-2017] and as parts of certain artworks (Cross 2018; Brady 2010)[^brady-2010][^cross-2018].
