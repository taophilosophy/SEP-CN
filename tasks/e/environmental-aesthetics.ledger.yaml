      This entry describes philosophical work on the aesthetics of environments understood in this broad sense. Such vast philosophical terrain has, understandably, also been surveyed from more particular perspectives. So-called “everyday aesthetics”, for instance, considers various elements of the environment from the perspective of ordinary life experiences (for an overview see Saito 2015 [2024])[^saito-2015]. The aesthetics of architecture focuses on the built structures that shape much of that experience (S. Fisher 2015 [2016])[^fisher-2015]. Nature aesthetics, in contrast, focuses upon environments where non-human forces and elements predominate (see, for example Budd 2002; Moore 2008; Parsons 2023b)[^budd-2002][^moore-2008][^parsons-2023b]. Other approaches foreground more specific concepts such as landscape (Benovsky 2016; Brook 2013; Andrzejewski & Salwa 2020)[^andrzejewski-2020][^benovsky-2016][^brook-2013] or place (Haapala 2005; Nomikos 2018)[^haapala-2005][^nomikos-2018]. This entry, however, focuses on the issues of most general significance to environmental aesthetics.
    step1: |-
      本文考察的是在如此宽泛意义上理解的环境美学方面的哲学工作。这样一片广阔的哲学领域，自然也有人从更为具体的视角加以勘察。例如，所谓“日常美学”从日常生活经验的角度考察环境中的各种要素（概览见 Saito 2015 [2024]）[^saito-2015]。建筑美学关注塑造了这类经验之大部分的建成结构（S. Fisher 2015 [2016]）[^fisher-2015]。自然美学则相反，关注非人力量与要素占主导的环境（例如见 Budd 2002; Moore 2008; Parsons 2023b）[^budd-2002][^moore-2008][^parsons-2023b]。另一些进路凸显更为具体的概念，如风景（Benovsky 2016; Brook 2013; Andrzejewski & Salwa 2020）[^andrzejewski-2020][^benovsky-2016][^brook-2013]或场所（Haapala 2005; Nomikos 2018）[^haapala-2005][^nomikos-2018]。不过，本文聚焦于对环境美学最具普遍意义的问题。
    step2: |-
      本文所描述的哲学工作，正是在这种宽泛意义上理解的环境美学。面对如此辽阔的哲学领域，研究者自然会从更专门的视角分头勘察。比如所谓“日常美学”，就是从日常生活经验出发考察环境中的各类要素（概览见 Saito 2015 [2024]）[^saito-2015]；建筑美学着眼于塑造了这种经验之大半的建成结构（S. Fisher 2015 [2016]）[^fisher-2015]；自然美学则把目光投向非人力量与要素占优势的环境（例如见 Budd 2002; Moore 2008; Parsons 2023b）[^budd-2002][^moore-2008][^parsons-2023b]。还有一类进路突出更具体的概念，诸如风景（Benovsky 2016; Brook 2013; Andrzejewski & Salwa 2020）[^andrzejewski-2020][^benovsky-2016][^brook-2013]或场所（Haapala 2005; Nomikos 2018）[^haapala-2005][^nomikos-2018]。本文则集中于那些对环境美学具有最普遍意义的问题。
