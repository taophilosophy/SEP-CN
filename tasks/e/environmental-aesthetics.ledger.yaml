      From a more philosophical point of view, some have suggested alternative perspectives on animal beauty. One approach focuses on the sentient movement or “animation” of animals as their most aesthetically salient feature (for variations on this theme see Ruskin 1846; Rolston 1987; Vice 2017; Greaves 2019)[^greaves-2019][^rolston-1987][^ruskin-1846][^vice-2017]. Others argue that animals should be appreciated not merely for cuteness or animation, but in light of the biological and ecological function of their form and behavior (Parsons 2007; Parsons & Carlson 2008)[^carlson-2008][^parsons-2007][^parsons-2008][^parsons-2008-2]. This view holds that though many creatures have features that strike us as odd, sinister, or grotesque, an understanding of the adaptedness of their morphology and behavior to their particular environment reveals a satisfying aptness. Proponents also argue that such appreciation is more appropriate, from an ethical point of view, than the usual ranking of species according to their cuteness and possession of human-like qualities (for critical discussion see Davies 2010)[^davies-2010].
    step1: |-
      从更哲学的角度，一些人提出关于动物美的替代视角。一种进路聚焦动物的有感觉运动或“生动性”，视其为最突出的审美特征（该主题的变体见 Ruskin 1846; Rolston 1987; Vice 2017; Greaves 2019）[^greaves-2019][^rolston-1987][^ruskin-1846][^vice-2017]。另一些人主张，动物不应仅因可爱或生动而受欣赏，而应依据其形式与行为的生物学和生态功能来欣赏（Parsons 2007; Parsons & Carlson 2008）[^carlson-2008][^parsons-2007][^parsons-2008][^parsons-2008-2]。这一观点认为，尽管许多生物的特征令我们觉得古怪、阴险或怪诞，但理解其形态与行为对特定环境的适应，会揭示一种令人满足的贴切性。支持者还主张，从伦理角度看，这种欣赏比通常按可爱程度和拥有人类般品质来给物种排名更恰当（批判讨论见 Davies 2010）[^davies-2010]。
