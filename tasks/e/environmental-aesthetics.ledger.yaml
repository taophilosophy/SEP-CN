      Still another interpretation of “ecological aesthetics” can be found in recent Chinese philosophy, where several writers have developed robust versions of “ecoaesthetics” (two prominent versions available in English translation are Cheng 2013a, 2016 and Zeng 2017)[^cheng-2013a][^cheng-2016][^zeng-2017]. Cheng embraces, as his “four keystones of ecological aesthetic appreciation”, not only the centrality of ecological knowledge and the rejection of the duality of humanity and the natural world, but also the over-arching value of ecosystem biodiversity and health and the continued guidance of ecological ethics (Cheng 2013c)[^cheng-2013c]. While the first of Cheng’s “keystones” is redolent of the NEM and the standard scientific understanding of ecology, the others invoke a more philosophical conception of “ecology” that has closer affinities to Berleant’s notion of engagement, the Continentalist ideas discussed above, and elements of traditional Chinese philosophy (Carlson 2017, 2018, Parsons & Zhang 2018; for further discussion of the relation between ecoaesthetics and Berleant’s view, see Berleant 2016, Cheng 2021)[^berleant-2016][^carlson-2017][^carlson-2018][^cheng-2021][^parsons-2018][^parsons-2018-2].
    step1: |-
      “生态美学”的另一种解释可见于近期中国哲学，若干作家发展了有力的“生态美学”版本（两个有英译的重要版本是 Cheng 2013a, 2016 与 Zeng 2017）[^cheng-2013a][^cheng-2016][^zeng-2017]。程相占把生态知识的核心性、对人与自然二分的拒绝，以及生态系统生物多样性与健康的总体价值、生态伦理的持续引导，接纳为其“生态审美欣赏的四块基石”（Cheng 2013c）[^cheng-2013c]。程相占“基石”中的第一块令人想起 NEM 与标准科学生态理解，其余则援引更哲学化的“生态”概念，与 Berleant 的介入观念、上述大陆思想以及中国传统哲学要素更接近（Carlson 2017, 2018, Parsons & Zhang 2018; 关于生态美学与 Berleant 观点关系的进一步讨论，见 Berleant 2016, Cheng 2021）[^berleant-2016][^carlson-2017][^carlson-2018][^cheng-2021][^parsons-2018][^parsons-2018-2]。
