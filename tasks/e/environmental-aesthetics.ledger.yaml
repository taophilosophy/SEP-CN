      Indeed, the stark dichotomy between the NEM and the aesthetics of engagement evolved into a set of distinctions widely used to organize the field, with positions being categorized as either “cognitive” or “non-cognitive” (Godlovitch 1994; Eaton 1998; Carlson & Berleant 2004)[^berleant-2004][^carlson-2004][^eaton-1998][^godlovitch-1994], “conceptual” or “non-conceptual” (Moore 1999)[^moore-1999], or “narrative” and “ambient” (Foster 1998)[^foster-1998]. Roughly, such distinctions marked a division between positions that take knowledge and information to be essential to aesthetic appreciation of environments, as per the NEM, and those that, like the aesthetics of engagement, downplay this aspect and emphasize other dimensions of appreciation. On the “cognitive” side we find, in addition to the NEM, views that require the belief that nature has a non-human origin (e.g., Budd 2002)[^budd-2002] as well as views that highlight other sources of belief such as local and regional narratives, folklore, art, and mythological stories about nature (Sepänmaa 1986 [1993], 2004; Saito 1998b; Heyd 2001; Leddy 2005; Tafalla 2010)[^heyd-2001][^leddy-2005][^saito-1998b][^sepänmaa-1986][^tafalla-2010]. Because of this diversity amongst the “cognitivist” views, the term “scientific cognitivism” was introduced as a name for the NEM. On the “non-cognitive side” of the ledger, we find views that emphasize the role of emotion (Carroll 1993)[^carroll-1993], a sense of mystery in nature’s otherness (Godlovitch 1994)[^godlovitch-1994], “formal qualities” (Zangwill 2001, 2005a, 2005b, 2013)[^zangwill-2001], metaphysical ideas and insights (Hepburn 1996)[^hepburn-1996], and imagination (Brady 1998, 2003)[^brady-1998].
    step1: |-
      事实上，NEM 与介入美学之间的鲜明二分，后来演化为一套被广泛用来组织该领域的区分：各种立场被归类为“认知的”或“非认知的”（Godlovitch 1994; Eaton 1998; Carlson & Berleant 2004）[^berleant-2004][^carlson-2004][^eaton-1998][^godlovitch-1994]、“概念的”或“非概念的”（Moore 1999）[^moore-1999]，或“叙事的”与“氛围的”（Foster 1998）[^foster-1998]。大致说来，这类区分标示出两种立场之间的分界：一种如 NEM 那样，认为知识与信息对环境审美欣赏至关重要；另一种则如介入美学那样，贬低这一方面而强调欣赏的其他维度。在“认知”一侧，除 NEM 之外，还有要求相信自然具有非人起源的观点（例如 Budd 2002）[^budd-2002]，以及强调其他信念来源的观点，如关于自然的本地与区域叙事、民间传说、艺术与神话故事（Sepänmaa 1986 [1993], 2004; Saito 1998b; Heyd 2001; Leddy 2005; Tafalla 2010）[^heyd-2001][^leddy-2005][^saito-1998b][^sepänmaa-1986][^tafalla-2010]。由于“认知主义”观点之间存在这种多样性，人们引入“科学认知主义”一词来指称 NEM。在账本的“非认知”一侧，则有强调情感作用的观点（Carroll 1993）[^carroll-1993]、强调自然之异己性中神秘感的观点（Godlovitch 1994）[^godlovitch-1994]、强调“形式品质”的观点（Zangwill 2001, 2005a, 2005b, 2013）[^zangwill-2001]、强调形而上学观念与洞见的观点（Hepburn 1996）[^hepburn-1996]，以及强调想象的观点（Brady 1998, 2003）[^brady-1998]。
    step2: |-
      NEM 与介入美学之间这种壁垒分明的对立，后来演变成一套用来整理整个领域的区分：立场或被归为“认知的”与“非认知的”（Godlovitch 1994; Eaton 1998; Carlson & Berleant 2004）[^berleant-2004][^carlson-2004][^eaton-1998][^godlovitch-1994]，或被归为“概念的”与“非概念的”（Moore 1999）[^moore-1999]，或被归为“叙事的”与“氛围的”（Foster 1998）[^foster-1998]。大体上，这些区分划出的是这样一道界线：一边像 NEM 那样，主张知识、信息是环境审美欣赏的必备条件；另一边则像介入美学那样，淡化这一层面而看重欣赏的其他维度。“认知”一方除了 NEM，还包括要求人们相信自然源自非人力量的观点（如 Budd 2002）[^budd-2002]，以及强调其他信念来源的观点，比如关于自然的乡土叙事与区域叙事、民间传说、艺术和神话故事（Sepänmaa 1986 [1993], 2004; Saito 1998b; Heyd 2001; Leddy 2005; Tafalla 2010）[^heyd-2001][^leddy-2005][^saito-1998b][^sepänmaa-1986][^tafalla-2010]。鉴于“认知主义”阵营内部如此分歧，人们又造出“科学认知主义”一名专指 NEM。账本的另一边，“非认知”一方则包括重视情感的观点（Carroll 1993）[^carroll-1993]、重视自然之异在中那种神秘感的观点（Godlovitch 1994）[^godlovitch-1994]、重视“形式品质”的观点（Zangwill 2001, 2005a, 2005b, 2013）[^zangwill-2001]、重视形而上学观念与洞见的观点（Hepburn 1996）[^hepburn-1996]，以及重视想象的观点（Brady 1998, 2003）[^brady-1998]。
