      这些问题与环境伦理学的问题有显著重叠，后者大约在同一时期兴起（见下文第 3 节）。更广泛地说，环境美学的关切在某种程度上与哲学之外的若干学科相互交织，尤其是环境心理学、恢复生态学与景观建筑学，以及文化地理学、环境史、生态批评文学研究，还有其他被归入所谓“环境人文”的研究领域（Emmett & Nye 2017；关于面向跨学科读者的环境美学近期综述，见 Brady & Prior 2020）[^brady-2020][^emmett-2017]。
