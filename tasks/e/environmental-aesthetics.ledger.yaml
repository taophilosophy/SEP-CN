      以 Zangwill 为例，他认为审美欣赏（至少对无机自然而言）只能涉及关于知觉形式的信念（2001）。也有人主张，自然欣赏所受到的唯一约束，是意识到所欣赏的东西属于自然而非人工制品（J. Fisher 1998; Budd 2002）[^budd-2002][^fisher-1998]，并不需要什么更深的科学理解。斋藤百合子（Yuriko Saito）提出的则是道德标准：只要欣赏让自然及其起源成为一则叙事的中心，而这一叙事又照亮了我们对自然的经验，它就是恰当的（1998a; 1998b）。她认为这种态度含有道德维度，因为它表明欣赏者承认被欣赏之物自有其价值（另见 Parsons 2018）[^parsons-2018][^parsons-2018-2]。赫伯恩给出的标准带有准伦理意味，方向却相反：欣赏只要是为着对自我作某种实质性的探索而亲近自然，而不是“琐屑的消遣”，就算“严肃”（Hepburn 1993）[^hepburn-1993]。埃米莉·布雷迪（Emily Brady）在阐发以想象为核心的学说时，乞灵于“好好地想象”（imagining well）这一约束性理想（1998, 2003）。Robert Stecker 最后提出的判准关乎信念上的可责错误：如果我作为本文化的一员，本可合理地被期待知道鲸属于哺乳动物而非鱼类，那么怀着“鲸是鱼”的信念去欣赏鲸，就是一种审美错误（2019）。
