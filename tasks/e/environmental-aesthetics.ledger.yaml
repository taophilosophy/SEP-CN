      A defender of Aesthetic Protectionism might respond that this last set of concerns ultimately stems from the scenic aesthetic, a view that should be rejected. Indeed, Hepburn and Carlson’s early critiques of the Picturesque have been echoed by many writers concerned with environmental protection, who have dismissed the scenic aesthetic as anthropocentric (Godlovitch 1994)[^godlovitch-1994], scenery-obsessed (Saito 1998a; Gobster 1999)[^gobster-1999][^saito-1998a], trivial (Callicott 1994)[^callicott-1994], subjective (J. Thompson 1995)[^thompson-1995], and/or morally vacuous (Andrews 1989)[^andrews-1989]. But even granting the case against the scenic aesthetic, it remains an open question how its replacement would fare with respect to the problems just cited. How widely will we find aesthetic value in nature? Will focusing protective efforts on aesthetics help or hinder environmental protection, from an ecological perspective? The most promising candidate on many of these scores would seem to be the NEM and its variants, given that these approaches take ecological understanding to be critically relevant to aesthetic appreciation. Nonetheless, some have questioned the extent to which even ecologically-informed approaches can successfully address these issues (Budd 2002; Hettinger 2005, 2008; Berleant 2010a, 2016; Bannon 2011; Stecker 2012; Herguedas 2018; Mikkonen 2018)[^bannon-2011][^berleant-2010a][^berleant-2016][^budd-2002][^herguedas-2018][^hettinger-2005][^hettinger-2008][^mikkonen-2018][^stecker-2012].
    step1: |-
      审美保护主义的辩护者可能回应：最后一组关切最终源于风景美学，而这一观点应被拒绝。事实上，Hepburn 与 Carlson 对如画的早期批判，得到许多关心环境保护的作家呼应，他们把风景美学斥为人类中心主义（Godlovitch 1994）[^godlovitch-1994]、执迷于景色（Saito 1998a; Gobster 1999）[^gobster-1999][^saito-1998a]、琐碎（Callicott 1994）[^callicott-1994]、主观（J. Thompson 1995）[^thompson-1995]和／或在道德上空洞（Andrews 1989）[^andrews-1989]。但即便承认对风景美学的反驳成立，其替代方案在刚才所列问题上表现如何，仍是开放问题。我们会在自然中发现多少审美价值？从生态视角看，把保护努力集中于审美会有助于还是会阻碍环境保护？在许多方面最有希望的候选似乎是 NEM 及其变体，因为这些进路认为生态理解与审美欣赏批判性地相关。尽管如此，一些人质疑即便以生态为依据的进路能在多大程度上成功处理这些问题（Budd 2002; Hettinger 2005, 2008; Berleant 2010a, 2016; Bannon 2011; Stecker 2012; Herguedas 2018; Mikkonen 2018）[^bannon-2011][^berleant-2010a][^berleant-2016][^budd-2002][^herguedas-2018][^hettinger-2005][^hettinger-2008][^mikkonen-2018][^stecker-2012]。
