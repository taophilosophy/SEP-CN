    source: |-
      The boundaries of environmental aesthetics are rather loose, a fact that reflects the flexibility of its central concept of environment. “Environment” can refer to an extensive, large-scale background or setting in which particular events occur (Sparshott 1972; Carlson 1979)[^carlson-1979][^sparshott-1972]: a forest, an ocean, a wetland. But talk about the particular things that make up that background or setting—a species of fish, an underground thermal vent, a heron—is also, in a sense, talk about the environment (on the significance of the two senses of “environment”, see Parsons 2015a)[^parsons-2015a]. Thus environmental aesthetics has naturally come to include the examination of everything save art—all that exists within various environments, including not only places and things but also events, processes, and activities, both natural and human-made.
    step1: |-
      环境美学的边界颇为松散，这一事实反映了其核心概念“环境”的灵活性。“环境”可以指特定事件发生于其中的那种广延的、大尺度的背景或场合（Sparshott 1972; Carlson 1979）[^carlson-1979][^sparshott-1972]：一片森林、一片海洋、一片湿地。但谈论构成这一背景或场合的那些特定事物——某种鱼类、一处地下热泉、一只苍鹭——在某种意义上也是谈论环境（关于“环境”两义的重要性，见 Parsons 2015a）[^parsons-2015a]。因此，环境美学自然而然地扩展到对除艺术以外一切事物的考察——一切存在于各种环境中的东西，不仅包括场所和事物，也包括事件、过程和活动，无论自然的还是人造的。
    step2: |-
      环境美学的边界相当宽松，这恰恰反映了其核心概念“环境”的弹性。“环境”可以指特定事件发生于其间的、广延而大尺度的背景或场合（Sparshott 1972; Carlson 1979）[^carlson-1979][^sparshott-1972]：森林、海洋、湿地。然而，谈论组成这一背景或场合的特定事物——一种鱼、一处海底热泉、一只苍鹭——在某种意义上也仍然是在谈论环境（关于“环境”两义的意义，见 Parsons 2015a）[^parsons-2015a]。于是，环境美学很自然地涵盖了除艺术之外的一切：存在于各类环境之中的所有东西，其中不仅有场所与事物，还有事件、过程与活动，无论出于自然还是人为。
