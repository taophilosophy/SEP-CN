      A different approach is suggested by Jennifer Welchman, who argues that biodiversity is connected to aesthetic value in a more indirect way. Since aesthetic experience is a basic good, she argues, the state has an obligation to protect the means for obtaining it. Since a satisfying aesthetic life requires a rich and diverse array of things to appreciate, this obligation requires protecting the diverse array of natural environments and species that we possess. Thus broadly aesthetic considerations mandate the protection of biodiversity, just as they mandate the state’s preservation and promotion of wide array of different types of Art (Welchman 2018, 2020; for a critical response, see Linquist 2020)[^linquist-2020][^welchman-2018][^welchman-2020].
    step1: |-
      Jennifer Welchman 提出另一种进路，主张生物多样性以更间接的方式与审美价值相连。她认为，由于审美经验是一种基本善，国家有义务保护获得它的手段。由于令人满足的审美生活需要丰富多样的欣赏对象，这一义务要求保护我们所拥有的多样自然环境与物种。因此，宽泛的审美考量要求保护生物多样性，正如它们要求国家保存与促进多种不同类型的艺术（Welchman 2018, 2020; 批判回应见 Linquist 2020）[^linquist-2020][^welchman-2018][^welchman-2020]。
