      Another phenomenon raising similar conceptual difficulties is animal predation. The relentless violence and bloodshed that characterizes animal existence in nature strikes many as profoundly ugly. Here, however, the “ugliness” appears to have an important moral dimension. What makes the cheetah’s killing and eating of a young impala ugly is that an innocent sentient being has been made to suffer pain and death, an event which seems clearly bad and a source of disvalue in the world. This analysis, however, raises deep questions about the cogency of applying moral categories to animal behavior. Given a lack of the kinds of reflective capacities humans possess, cheetahs cannot be considered moral agents or blamed for the act of killing their natural prey (see Carlson 2018)[^carlson-2018]. As such, it is unclear what aesthetic significance should be given to the apparent “ugliness” of natural animal behavior.
    step1: |-
      另一个引起类似概念困难的现象是动物捕食。许多人对自然界动物生存中那种不停的暴力与血腥印象极深，视之为深刻的丑。然而这里的“丑”似乎有一个重要的道德维度。让猎豹捕杀并吞食一只小羚羊显得丑陋的东西，是一个无辜的有感觉者被施以痛苦与死亡，这一事件显然恶劣，是世界中的一种负价值。不过，这一分析提出了深层问题：把道德范畴应用于动物行为是否有效。鉴于缺乏人类所有的那类反思能力，猎豹不能被视为道德主体，也不能因杀死其自然猎物而受责备（见 Carlson 2018）[^carlson-2018]。因此，动物自然行为那种明显的“丑”应具有何种审美意义，尚不清楚。
    step2: |-
      动物捕食是另一桩引出同等概念难题的现象。自然中动物的生存充斥着不间断的暴力与血腥，这在许多人看来是彻里彻外的丑。可是这里的“丑”似乎带着一个要紧的道德维度：猎豹咬杀并吞食一只小羚羊之所以显得丑，是因为一个无辜的、有感受力的生灵被拖入痛苦与死亡——这件事明白地是恶，是世界中的一笔负价值。然而这样一来，深层问题就出现了：把道德范畴用在动物行为上究竟站不站得住。猎豹并不具备人类那种反思能力，因而不能算道德主体，也不能因猎杀其自然猎物而被追责（见 Carlson 2018）[^carlson-2018]。既然如此，动物自然行为表面上的“丑”该给予多少审美上的分量，就很难说清。
