      The notion of the sublime has also seen a rejuvenation. In seminal discussions, Guy Sircello (1993)[^sircello-1993] and Ronald Hepburn (1988)[^hepburn-1988] asked why the sublime fell into desuetude, and suggested that, despite its neglect by philosophers, it might still have relevance to contemporary experience. Understanding of the former issue has been advanced by recent historical work on both the decline of sublime discourse in the context of modern tourism (e.g., Colley 2010)[^colley-2010] and its persistence in more extreme pursuits such as mountaineering (Macfarlane 2003; Hollis 2019)[^hollis-2019][^macfarlane-2003].
    step1: |-
      崇高观念也经历复兴。在开创性讨论中，Guy Sircello（1993）[^sircello-1993] 与 Ronald Hepburn（1988）[^hepburn-1988] 追问崇高为何被废弃，并建议尽管哲学家忽视它，它仍可能与当代经验相关。晚近历史工作推进了对前一问题的理解：既包括现代旅游语境中崇高话语的衰落（如 Colley 2010）[^colley-2010]，也包括它在登山等更极端追求中的持续（Macfarlane 2003; Hollis 2019）[^hollis-2019][^macfarlane-2003]。
