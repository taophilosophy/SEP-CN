      Alongside his critique of the “scenic aesthetic”, Carlson developed the ideas of environmental thinkers such as Leopold and Muir into an alternative view that he originally called the “natural environmental model” of aesthetic appreciation (hereafter “NEM”; Carlson 1979)[^carlson-1979]. On this view, appropriately appreciating a natural environment requires regarding it as the particular sort of environment that it is: that is to say, in terms of the characterization of that environment provided by natural science. Though this view rejects the appreciation of nature as if it were art (as on the Picturesque-inspired “landscape model”), Carlson argued for it by appealing to a general analogy *between* nature and art. Just as “serious” or appropriate aesthetic appreciation of art requires some knowledge of art history and art criticism, such appreciation of nature requires some knowledge of natural history: that is, knowledge provided by the natural sciences, especially geology, biology, and ecology. For instance, appropriate appreciation of a work such as Picasso’s *Guernica* (1937) requires that we experience it as what it is—a cubist painting—and therefore that we appreciate it in light of our knowledge of paintings in general and of cubist paintings in particular (Walton 1970)[^walton-1970]. The NEM applies the same reasoning to natural things, asserting that scientific understanding of nature can reveal the aesthetic qualities of natural objects and environments in the way in which knowledge about art history and art criticism so for works of art. In addition to this analogical argument, Carlson and other defenders of this approach also offered broadly ethical reasons to support it, holding, for instance, that ecologically-informed appreciation of nature leads to better treatment of the environment or greater support for more progressive environment protection (Carlson 1981, Saito 1998b; for critical discussion see Stecker 2012, Parsons 2018)[^carlson-1981][^parsons-2018][^parsons-2018-2][^saito-1998b][^stecker-2012]. Following his initial presentation of the NEM, Carlson further developed and qualified the view (Carlson 1981, 2000, 2007)[^carlson-1981]: variations of it have been defended by a number of other philosophers (Callicott 1994, 2003; Rolston 1995; Eaton 1998; Fudge 2001; Matthews 2002; Parsons 2002, 2006a, 2006b; Parsons & Carlson 2004, 2008)[^callicott-1994][^carlson-2004][^eaton-1998][^fudge-2001][^matthews-2002][^parsons-2002][^parsons-2004][^parsons-2004-2][^parsons-2002-2][^rolston-1995].
    step1: |-
      在批判“风景美学”的同时，卡尔森把利奥波德与缪尔等环境思想家的观念发展为一种替代性观点，他最初称之为审美欣赏的“自然环境模式”（以下称“NEM”；Carlson 1979）[^carlson-1979]。按此观点，恰当地欣赏一个自然环境，要求把它视为它所是的那种特定环境：也就是说，依据自然科学对该环境所作的刻画来欣赏。尽管这一观点拒斥像欣赏艺术那样欣赏自然（如如画所启发的“景观模式”），卡尔森却通过诉诸自然与艺术*between*（之间）的一般类比来为之辩护。正如对艺术“严肃”或恰当的审美欣赏需要一些艺术史与艺术批评知识，对自然的此种欣赏也需要一些自然史知识：即自然科学、尤其是地质学、生物学与生态学所提供的知识。例如，恰当欣赏毕加索的*Guernica*（《格尔尼卡》，1937）这样的作品，要求我们把它作为它所是的东西——一幅立体主义绘画——来经验，因此要求我们依据关于一般绘画、尤其是立体主义绘画的知识来欣赏它（Walton 1970）[^walton-1970]。NEM 把同样的推理用于自然事物，主张对自然的科学理解能够揭示自然对象与环境的审美品质，就像艺术史与艺术批评知识之于艺术作品那样。除了这一类比论证，卡尔森与该进路的其他辩护者还提出了宽泛的伦理理由来支持它，例如主张以生态学为依据的自然欣赏会带来对环境的更好对待，或对更进步的环境保护给予更大支持（Carlson 1981, Saito 1998b；批判性讨论见 Stecker 2012, Parsons 2018）[^carlson-1981][^parsons-2018][^parsons-2018-2][^saito-1998b][^stecker-2012]。在最初提出 NEM 之后，卡尔森进一步发展和限定这一观点（Carlson 1981, 2000, 2007）[^carlson-1981]：其各种变体得到了不少其他哲学家的辩护（Callicott 1994, 2003; Rolston 1995; Eaton 1998; Fudge 2001; Matthews 2002; Parsons 2002, 2006a, 2006b; Parsons & Carlson 2004, 2008）[^callicott-1994][^carlson-2004][^eaton-1998][^fudge-2001][^matthews-2002][^parsons-2002][^parsons-2004][^parsons-2004-2][^parsons-2002-2][^rolston-1995]。
    step2: |-
      卡尔森在批判“风景美学”的同时，又把利奥波德、缪尔等环境思想家的想法推进为另一种观点，最初命名为审美欣赏的“自然环境模式”（下称“NEM”；Carlson 1979）[^carlson-1979]。照这种观点，要恰当地欣赏一处自然环境，就得把它当作它所是的那种环境来看，也就是按照自然科学对这一环境的刻画来看。这个立场虽然反对照搬艺术欣赏的路子去欣赏自然（即如画所启发的“景观模式”），卡尔森却借自然与艺术*between*（之间）的一般类比为之张目：对艺术的“严肃”或恰当的审美欣赏需要具备若干艺术史与艺术批评的知识，同样，对自然的此类欣赏也需要若干自然史的知识，即自然科学、特别是地质学、生物学与生态学所提供的知识。举例来说，要恰当欣赏毕加索的*Guernica*（《格尔尼卡》，1937），就得把它当作它所是的东西——一幅立体主义绘画——来经验，因而须借助关于绘画一般、尤其是立体主义绘画的知识（Walton 1970）[^walton-1970]。NEM 把这套推理移用于自然之物：对自然的科学理解能够揭示自然对象与环境的审美品质，情形恰如艺术史与艺术批评知识之于艺术作品。除这层类比论证之外，卡尔森及该路向的辩护者还给出宽泛的伦理理由：以生态学为依据的自然欣赏会促成对环境的更好对待，或为更进步的环境保护赢得更多支持（Carlson 1981, Saito 1998b；批评性讨论见 Stecker 2012, Parsons 2018）[^carlson-1981][^parsons-2018][^parsons-2018-2][^saito-1998b][^stecker-2012]。NEM 初倡之后，卡尔森本人又作了发展与限定（Carlson 1981, 2000, 2007）[^carlson-1981]；其各种变体也得到不少哲学家的辩护（Callicott 1994, 2003; Rolston 1995; Eaton 1998; Fudge 2001; Matthews 2002; Parsons 2002, 2006a, 2006b; Parsons & Carlson 2004, 2008）[^callicott-1994][^carlson-2004][^eaton-1998][^fudge-2001][^matthews-2002][^parsons-2002][^parsons-2004][^parsons-2004-2][^parsons-2002-2][^rolston-1995]。
