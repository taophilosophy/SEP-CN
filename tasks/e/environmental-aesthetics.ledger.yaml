      Some are pessimistic about our future encounters with the environment. Jukka Mikkonen, for example, argues that concepts once central to our appreciation of the environment, such as awe and wonder, will yield to a “new aesthetics of strangeness and uncertainty” (Mikkonen 2022, see also Auer 2019)[^auer-2019][^mikkonen-2022]. Others see more room for optimism, arguing that, the “moral taint” of our damaged environments notwithstanding, there will remain the possibility for positive experiences of beauty and aesthetic value (Alcaraz León 2011; Brady 2014b, 2022; Ciccarelli 2014; Nomikos 2018; Fudge 2021)[^alcaraz-2011][^brady-2014b][^ciccarelli-2014][^fudge-2021][^nomikos-2018].
    step1: |-
      有些人对我们未来与环境的相遇持悲观态度。例如，Jukka Mikkonen 论证说，曾经处于我们环境欣赏核心的概念，如惊异与惊叹，将让位于一种“陌生与不确定之美学”（Mikkonen 2022；另见 Auer 2019）[^auer-2019][^mikkonen-2022]。另一些人则看到更多乐观的余地，论证说，尽管我们受损的环境带有“道德污点”，对美与审美价值的正面经验仍将可能（Alcaraz León 2011; Brady 2014b, 2022; Ciccarelli 2014; Nomikos 2018; Fudge 2021）[^alcaraz-2011][^brady-2014b][^ciccarelli-2014][^fudge-2021][^nomikos-2018]。
    step2: |-
      有人对人与环境未来的照面持悲观态度。Jukka Mikkonen 即主张，曾经核心地支撑我们环境欣赏的那些概念——敬畏、惊奇——将会让位于一种“陌生与不确定之美学”（Mikkonen 2022；另见 Auer 2019）[^auer-2019][^mikkonen-2022]。另一些人则觉得乐观的余地还大：即便我们受损的环境带着“道德污点”，关于美与审美价值的正面经验仍会存在（Alcaraz León 2011; Brady 2014b, 2022; Ciccarelli 2014; Nomikos 2018; Fudge 2021）[^alcaraz-2011][^brady-2014b][^ciccarelli-2014][^fudge-2021][^nomikos-2018]。
