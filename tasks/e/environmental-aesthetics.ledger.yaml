      These issues overlap significantly with those of environmental ethics, a field that originated at roughly the same time (see section 3 below). More broadly, the concerns of environmental aesthetics mesh, to some degree, with those of several academic fields beyond philosophy, notably environmental psychology, restoration ecology, and landscape architecture, as well as cultural geography, environmental history, ecocritical literary studies and those other areas of study grouped into the so-called “Environmental Humanities” (Emmett & Nye 2017; for a recent review of environmental aesthetics aimed at an interdisciplinary audience, see Brady & Prior 2020)[^brady-2020][^emmett-2017].
