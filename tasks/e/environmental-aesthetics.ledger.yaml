      Recent writers have explored this general idea in relation to traditional media such as landscape painting (Paden 2015b; Matthes 2020)[^matthes-2020][^paden-2015b], as well as nature photography and film (Parsons 2022; Hanich 2023; for a interesting auditory example see Matthes 2018)[^matthes-2018][^parsons-2022][^parsons-2022-2]. The latter furnish examples of ways in which new technologies have radically expanded the possibilities for aesthetic engagement with the natural world by providing new ways of seeing (Lopes 2003)[^lopes-2003]. High speed and time lapse cinematography, for instance, allow for the perception of events that unfold too rapidly or too slowly for humans to witness in unmediated experience, such as the strike of a chameleon’s tongue or the recession of a glacier. A more recent form of such “generative mediation” is digital astrophotography, a technology that allows for the visualization of faint celestial objects such as nebulae (on the aesthetics of astrophotography see Chadwick 2017, 2019; Parsons 2023a; see also Kessler 2012)[^chadwick-2017][^kessler-2012][^parsons-2023a].
    step1: |-
      晚近作者把这一般想法延伸到传统媒介，如风景绘画（Paden 2015b; Matthes 2020）[^matthes-2020][^paden-2015b]，以及自然摄影与电影（Parsons 2022; Hanich 2023；一个有趣的听觉例子见 Matthes 2018）[^matthes-2018][^parsons-2022][^parsons-2022-2]。后者提供了例证，显示新技术如何通过提供新的观看方式，极大地扩展了与自然世界审美接触的可能性（Lopes 2003）[^lopes-2003]。例如，高速摄影与延时摄影使人得以知觉那些展开得太快或太慢、人在无中介经验中无法目击的事件，例如变色龙舌头的弹射，或冰川的退缩。此类“生成性中介”的一种更新形式是数字天文摄影，这种技术使得暗弱天体（如星云）的可视化成为可能（关于天文摄影的美学，见 Chadwick 2017, 2019; Parsons 2023a；另见 Kessler 2012）[^chadwick-2017][^kessler-2012][^parsons-2023a]。
    step2: |-
      近来的作者把这层意思推向了传统媒介，如风景绘画（Paden 2015b; Matthes 2020）[^matthes-2020][^paden-2015b]，也推向自然摄影与电影（Parsons 2022; Hanich 2023；一个别开生面的听觉例子见 Matthes 2018）[^matthes-2018][^parsons-2022][^parsons-2022-2]。后一类例子表明，新技术凭借提供新的观看方式，大大拓展了人与自然世界进行审美接触的可能（Lopes 2003）[^lopes-2003]。比如，高速摄影与延时摄影让人得以知觉那些发生得太快或太慢、凭无中介的经验根本看不到的事件——变色龙弹舌的一瞬，冰川后退的数年。这类“生成性中介”更晚近的一种形态是数字天文摄影，它让星云这类暗弱天体也能成像可见（关于天文摄影的美学，见 Chadwick 2017, 2019; Parsons 2023a；另见 Kessler 2012）[^chadwick-2017][^kessler-2012][^parsons-2023a]。
