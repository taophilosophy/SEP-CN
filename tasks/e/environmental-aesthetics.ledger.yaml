      Kant’s writings ignored the picturesque, but of the three aesthetic concepts listed above, it was arguably the one that ultimately left the greatest legacy. In its initial use, the term “picturesque” seems to have simply meant “painterly”, as in “the sort of landscape painted by artists”. But the term took on added resonance in light of the close connections that came to be established between art and the appreciation of landscape in the late seventeenth century. The British aristocrats who reshaped their estates around picturesque ideals sought not only varied and irregular landscapes, but a *view* that in essence replicated the single-point perspective of a Lorrain canvas. Thus in practice the term “picturesque” often meant “picture-like”, and picturesque appreciation typically equated the experience of a landscape with the experience of a set of views, rather as if it were a set of large, out of doors paintings. This involved assessing the view’s “subject matter”, “composition”, “balance”, and so on. Thus, although philosophical theorists of the picturesque, such as Uvedale Price (1796)[^price-1796], took a more nuanced view (see section 4.3 below), in practice the popular ideal of the Picturesque often equated nature and the environment, from an aesthetic point of view, with scenery. This ideal provided the paradigm for the nascent industry of scenic tourism, as travelers pursued picturesque views in the Lake District, the Scottish Highlands, and the Wye valley with the help of guidebooks by popular authors such as William Gilpin (for a history of the Picturesque movement in Britain see Andrews 1989; for an analysis of its key philosophical texts see Costelloe 2013)[^andrews-1989][^costelloe-2013].
    step1: |-
      康德的著作忽略了如画，但在上述三个审美概念中，如画可以说是最终留下最大遗产的一个。在其最初用法中，“如画”一词似乎只表示“像画一样”，即“艺术家所画的那类景观”。但随着 17 世纪末艺术与景观欣赏之间建立紧密联系，该词获得额外共鸣。围绕如画理想改造庄园的英国贵族，不仅寻求多变而不规则的景观，还寻求一种本质上复制 Lorrain 画布单点透视的 **视图**。因此在实践中，“如画”常意味着“像图画”，如画欣赏通常把景观经验等同于一组视图的经验，仿佛它是一组巨大的户外绘画。这涉及评价视图的“题材”“构图”“平衡”等。因此，尽管如画的哲学理论家如 Uvedale Price（1796）[^price-1796] 采取更细致的观点（见下文 4.3 节），在实践中，如画的流行理想常从审美角度把自然与环境等同于风景。这一理想为新兴的风景旅游业提供了范式：旅行者在 William Gilpin 等畅销作家指南书的帮助下，在湖区、苏格兰高地与 Wye 河谷追寻如画景色（英国如画运动史见 Andrews 1989; 其关键哲学文本分析见 Costelloe 2013）[^andrews-1989][^costelloe-2013]。
