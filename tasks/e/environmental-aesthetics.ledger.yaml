      A similar array of aesthetic, ontological, and ethical issues are raised by restored environments. If a polluted wetland is restored to look (and perhaps function) much as it did before it was damaged by industry, is it thereby aesthetically equivalent to the original? Is the idea of nature restoration conceptually coherent, or does “restoring” nature simply turn it into an artifact? (Elliot 1997; Ross 2006; Katz 2012)[^elliot-1997][^katz-2012][^ross-2006] Should restoration be guided purely by ecological concerns, or do aesthetic considerations also have a role? (Heyd 2002; Brady, Brook, & Prior 2018)[^heyd-2002]. A recent twist on restoration is the idea of “rewilding”: simply leaving an area free from future human intervention so that natural forces can reassert themselves, rather than actively engineering the environment to “restore” it to an original state. Prior and Brady (2017) argue that rewilded spaces present new aesthetic possibilities and challenges. This same theme emerges in recent suggestions that anthropogenic climate change is creating unprecedented and unpredictable types of “mixed environments” that may not fit the aesthetic concepts of the past (see section 4.6, below).
    step1: |-
      被修复的环境也提出了类似的一系列审美、本体论与伦理问题。如果一片被污染的湿地被修复得看起来（或许功能上也）很像它在被工业破坏之前的样子，它是否因此在审美上等同于原初？自然修复的观念在概念上是否融贯，抑或“修复”自然只是把它变成了人工制品？（Elliot 1997; Ross 2006; Katz 2012）[^elliot-1997][^katz-2012][^ross-2006]修复应当纯粹由生态关切引导，还是审美考虑也有其角色？（Heyd 2002; Brady, Brook, & Prior 2018）[^heyd-2002]。修复的一个晚近变体是“再野化”观念：干脆让一片区域免于未来的人类干预，使自然力量重新施展，而不是主动工程化环境以把它“修复”到原初状态。Prior 与 Brady（2017）论证说，再野化的空间呈现出新的审美可能性与挑战。同一主题也出现在晚近的提法中：人为气候变化正在创造前所未有、难以预测的“混合环境”类型，它们可能不契合过去的审美概念（见下文第 4.6 节）。
    step2: |-
      经过修复的环境同样带出审美、本体论与伦理上的一连串问题。假如一片被污染的湿地经修复后，看上去（也许功能上也）与遭工业破坏之前相差无几，它在审美上是否就与原初等价？自然修复这个概念本身是否融贯，抑或所谓“修复”自然不过是把它变成了人工制品？（Elliot 1997; Ross 2006; Katz 2012）[^elliot-1997][^katz-2012][^ross-2006]修复该完全听凭生态方面的考虑，还是审美考虑也有一席之地？（Heyd 2002; Brady, Brook, & Prior 2018）[^heyd-2002]。近年又出现一个变奏：“再野化”——索性让一片区域脱离今后的人类干预，任自然力量重新施展，而不是用工程手段把环境“修复”回原初状态。Prior 与 Brady（2017）认为，再野化的空间带来了新的审美可能与新的难题。同样的主题也见于晚近的一种说法：人为气候变化正在造就前所未有的、难以预料的“混合环境”，过去的审美概念或许已不足以应对（见下文第 4.6 节）。
