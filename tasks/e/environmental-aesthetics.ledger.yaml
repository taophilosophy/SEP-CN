      However, though the Picturesque proved a resilient—indeed dominant—force, some early conservationists viewed the Park system’s fixation on scenery as a mistake. In their struggle to reorient park policies toward ecological aims and priorities, they sought different ways of understanding nature’s aesthetic value. Though they too applied the categories inherited from eighteenth century aesthetics, in their hands these were altered and reshaped by a growing awareness of the ecological relationships connecting humans, animals, and the land. John Muir, the most prominent public advocate of nature protection in nineteenth century America, is a case in point. In his well-known essay “A Near View of the High Sierra”, Muir contrasted his own experience of nature with that of his artist companions, who, guided by the idea of the picturesque, focused only on finding suitable views (Muir 1894)[^muir-1894]. Muir’s own aesthetic, in contrast, incorporated a blend of religious feeling for, and geological interest in, the mountain environment. Muir also used the traditional idea of the sublime in describing his experience of nature, reinterpreting it to fit his own experience of this “new world” environment (Brady 2018)[^brady-2018][^brady-2018-2]. Similar ideas about natural beauty and its relation to the naturalist’s perspective were pursued by later environmental thinkers, notably the forestry scientist Aldo Leopold (1966).
    step1: |-
      不过，尽管如画被证明是一股有韧性——甚至主导性——的力量，一些早期保护主义者却认为，公园体系对风景的执迷是个错误。在努力把公园政策转向生态目标与优先事项的过程中，他们寻求理解自然审美价值的不同方式。他们同样运用从十八世纪美学继承来的范畴，但在他们手中，这些范畴因日益增长的生态意识而被改变和重塑——那是一种把人类、动物与土地联系起来的生态关系的意识。十九世纪美国最著名的自然保护公众鼓吹者约翰·缪尔（John Muir）就是一个例子。在其名文《远眺高塞拉》（“A Near View of the High Sierra”）中，缪尔把自己对自然的体验与他的艺术家同伴的体验作了对比：后者在如画观念的引导下，只专注于寻找合适的视野（Muir 1894）[^muir-1894]。相比之下，缪尔本人的美学融合了对山地环境的宗教情感与地质学兴趣。缪尔在描述自己的自然体验时也使用了传统的崇高观念，并重新解释它，使之契合他对这个“新世界”环境的体验（Brady 2018）[^brady-2018][^brady-2018-2]。关于自然美及其与自然主义者视角之关系的类似想法，后来为环境思想家所继承，尤其是林业科学家奥尔多·利奥波德（Aldo Leopold，1966）。
    step2: |-
      如画固然经久不衰，甚至一度占据主导，但一些早期保护主义者仍把公园体系对风景的执念视为失误。他们力图让公园政策转向生态目标与生态优先，为此需要另找理解自然审美价值的途径。他们所用的范畴同样承自十八世纪美学，只是在手中被改塑了——因为他们的生态意识日益增强，意识到人类、动物与土地之间的生态关联。十九世纪美国最突出的自然保护倡导者约翰·缪尔（John Muir）即为一例。他在名文《远眺高塞拉》（“A Near View of the High Sierra”）中，把自己对自然的体验与同行的艺术家作了对照：后者受如画观念指引，一心只寻找合适的视野（Muir 1894）[^muir-1894]。缪尔自己的美学则兼有对山地环境的宗教情怀与地质学兴趣。他描述自然体验时也借用了传统的崇高概念，并加以重新诠释，使之符合他对这一“新世界”环境的亲身感受（Brady 2018）[^brady-2018][^brady-2018-2]。关于自然美以及它与自然主义者眼光之关联的相近看法，后来在环境思想家中得到延续，其中尤以林业科学家奥尔多·利奥波德（Aldo Leopold，1966）为代表。
