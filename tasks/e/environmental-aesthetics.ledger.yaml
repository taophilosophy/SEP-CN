      The question of our future response to humanly damaged environments is not merely a question of psychology, but also a normative one (Parsons 2023b)[^parsons-2023b]. Assuming it is possible to set aside the moral taint of the “Anthropocene world”, *should* we do so? The question echoes a familiar debate concerning the appreciation of “morally tainted” artworks (Gaut 2013)[^gaut-2013]. A traditional view holds that moral considerations are distinct from, and not relevant to, the aesthetic evaluations of an artwork. Others argue that setting aside a novel’s racism when evaluating its aesthetic value would be a kind of conceptual mistake. We may raise the analogous question: Would ignoring the moral taint of the degraded environments of the Anthropocene be a similar sort of error?
    step1: |-
      我们未来如何回应人类损害的环境，不仅是心理学问题，也是规范问题（Parsons 2023b）[^parsons-2023b]。假定可以搁置“人类世世界”的道德污点，我们 **应当** 这样做吗？这一问题呼应关于欣赏“道德上有污点”艺术作品的熟悉争论（Gaut 2013）[^gaut-2013]。传统观点认为，道德考量与艺术作品的审美评价不同且不相关。另一些人主张，评价小说审美价值时搁置其种族主义，会是一种概念错误。我们可提出类似问题：忽视人类世退化环境的道德污点，会是类似错误吗？
