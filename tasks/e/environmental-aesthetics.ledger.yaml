      It was aesthetic values, however, that played a central, though controversial, role in these events (Hargrove 1979)[^hargrove-1979]. The protection of Yellowstone and eventual creation of a system of National Parks based on its model were primarily driven, not by love of wilderness or the aim of ecological protection, but by the desire to preserve America’s most impressive scenery. This aim was both nationalistic, being a means for the young Republic to assert its “visual supremacy” over Europe, and commercial, given the tantalizing possibilities for recreational and scenic tourism via the nation’s emerging railways (Runte 2022)[^runte-2022]. Yellowstone and Yosemite were often discussed in an explicitly art-like fashion as “Nature’s masterpieces”, and renderings of the Western landscape by painters such as Moran, Hill, and Bierstadt helped translate Western landscapes into the visual idiom of the European Picturesque (Conron 2000; Wilton & Barringer 2002)[^conron-2000][^wilton-2002]. As the National Park system took shape in the twentieth century, the Picturesque mutated into new forms, with Gilpin’s toolkit of sketchpad, Claude glass, and hiking boots evolving into the pocket camera, the automobile, and the roadside viewpoint: the tourist trope that Donald Crawford called the “postcardesque” (Crawford 2004)[^crawford-2004]. Indeed, the “scenic tourism” paradigm—the legacy of the eighteenth century Picturesque—not only spurred development of the Park system but dominated park management thinking for roughly a century (Sellars 1997)[^sellars-1997].
    step1: |-
      然而，审美价值在这些事件中扮演了核心而有争议的角色（Hargrove 1979）[^hargrove-1979]。Yellowstone 的保护以及以其为模型最终建立国家公园体系，主要驱动力不是对荒野的热爱或生态保护目标，而是保存美国最壮观景色的愿望。这一目标既是民族主义的——作为年轻共和国对欧洲宣示“视觉优势”的手段——也是商业性的，因为新兴铁路为休闲与风景旅游提供了诱人可能（Runte 2022）[^runte-2022]。Yellowstone 与 Yosemite 常以明确类似艺术的方式被称为“自然的杰作”，Moran、Hill 与 Bierstadt 等画家对西部景观的描绘，帮助把西部风景转译成欧洲如画的视觉语汇（Conron 2000; Wilton & Barringer 2002）[^conron-2000][^wilton-2002]。随着国家公园体系在 20 世纪成形，如画演变为新形态：Gilpin 的速写本、克劳德镜与登山靴工具箱，演化为袖珍相机、汽车与路边观景点。Donald Crawford 把这种旅游套路称为“明信片式”（Crawford 2004）[^crawford-2004]。事实上，“风景旅游”范式——18 世纪如画的遗产——不仅推动公园体系发展，还主导公园管理思维约一个世纪（Sellars 1997）[^sellars-1997]。
