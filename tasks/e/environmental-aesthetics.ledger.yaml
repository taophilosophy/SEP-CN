      Carlson’s approach to the appreciation of human environments mirrors the NEM, with the difference that for human environments it is knowledge provided by the social sciences and history that is taken to be essential for appropriate appreciation (Carlson 2009)[^carlson-2009]. What is needed is to properly assess human artifacts such as buildings, cities, bridges, and farms is information about their histories, their functions, and their roles in our lives (Carlson 1985, 2001; Parsons & Carlson 2008)[^carlson-1985][^carlson-2008][^parsons-2008][^parsons-2008-2]. A related approach emphasizes the aesthetic potential of cultural traditions, which seem especially relevant to the appreciation of what might be termed cultural landscapes—environments that constitute important places in the cultures and histories of particular groups of people. What is often called a “sense of place”, together with ideas and images from folklore, mythology, and religion, frequently plays a significant role in individuals’ aesthetic experience of their own home landscapes (Saito 1985; Sepänmaa 1986 [1993]; Carlson 2000; Sandrisser 2007; Firth 2008; Nomikos 2018)[^carlson-2000][^firth-2008][^nomikos-2018][^saito-1985][^sandrisser-2007][^sepänmaa-1986].
    step1: |-
      卡尔森对人类环境欣赏的进路与 NEM 相仿，差别在于：对人类环境而言，社会科学与历史所提供的知识被视为恰当欣赏的本质条件（Carlson 2009）[^carlson-2009]。要恰当评价建筑物、城市、桥梁与农场等人造物，所需要的是关于其历史、功能以及它们在我们生活中角色的信息（Carlson 1985, 2001; Parsons & Carlson 2008）[^carlson-1985][^carlson-2008][^parsons-2008][^parsons-2008-2]。一条相关的进路强调文化传统的美学潜能，这似乎尤其适用于欣赏可称为文化景观的环境——那些在特定群体的文化与历史中构成重要场所的环境。所谓“场所感”，连同来自民间传说、神话与宗教的观念和意象，常常在个人对其家乡景观的审美经验中起重要作用（Saito 1985; Sepänmaa 1986 [1993]; Carlson 2000; Sandrisser 2007; Firth 2008; Nomikos 2018）[^carlson-2000][^firth-2008][^nomikos-2018][^saito-1985][^sandrisser-2007][^sepänmaa-1986]。
    step2: |-
      卡尔森处理人类环境的方式与 NEM 如出一辙，区别只在于：讲到人类环境，他把社会科学与历史提供的知识当作恰当欣赏的必要条件（Carlson 2009）[^carlson-2009]。要妥当评价建筑物、城市、桥梁、农场这类人造物，需要了解它们的历史、功能，以及它们在我们生活中扮演的角色（Carlson 1985, 2001; Parsons & Carlson 2008）[^carlson-1985][^carlson-2008][^parsons-2008][^parsons-2008-2]。与此相关的一种路径强调文化传统的美学潜能，这对于欣赏所谓文化景观似乎尤为贴切——这类环境在特定群体的文化与历史中构成重要场所。“场所感”这个常被提起的说法，连同民间传说、神话与宗教中的观念和意象，往往在人们对自己家乡景观的审美经验中占据重要位置（Saito 1985; Sepänmaa 1986 [1993]; Carlson 2000; Sandrisser 2007; Firth 2008; Nomikos 2018）[^carlson-2000][^firth-2008][^nomikos-2018][^saito-1985][^sandrisser-2007][^sepänmaa-1986]。
