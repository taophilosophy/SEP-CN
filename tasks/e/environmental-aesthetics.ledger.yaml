      After flowering in the eighteenth century, the aesthetics of nature went into decline. The cultish enthusiasms that had developed around the picturesque and the sublime subsided as these notions faded into clichés and ultimately blended into one another. The change is vividly illustrated by shifting attitudes toward the Alps, which in the early 1800s filled Romantic poets such as Byron and Shelley with sublime feeling. By the second half of the century, visitors found such feelings elusive quarry amid the tourists swarming Swiss towns like Chamonix on packaged tours (Colley 2010)[^colley-2010]. In philosophy, Kant’s influential successor Hegel viewed art, along with religion and philosophy, as an important embodiment of “Absolute Spirit” and saw it, rather than nature, as the favored subject of philosophical aesthetics. In the nineteenth century, both on the continent and in the United Kingdom, relatively few philosophers and only a scattering of thinkers of the Romantic movement seriously pursued theoretical study of the aesthetics of nature.
    step1: |-
      自然美学在 18 世纪开花后走向衰落。围绕如画与崇高发展起来的狂热崇拜，随着这些观念沦为陈词滥调并最终相互融合而消退。态度转变生动体现在对阿尔卑斯山的变化上：19 世纪初，这些山令 Byron 与 Shelley 等浪漫主义诗人充满崇高感；到该世纪下半叶，游客在 Chamonix 等瑞士城镇随团蜂拥而至，却发现这种感受难以寻觅（Colley 2010）[^colley-2010]。在哲学中，康德有影响力的后继者黑格尔把艺术连同宗教与哲学视为“绝对精神”的重要体现，并把艺术而非自然视为哲学美学的偏爱主题。19 世纪，无论在欧洲大陆还是英国，都只有相对少数哲学家和零星浪漫主义思想家认真从事自然美学的理论研究。
