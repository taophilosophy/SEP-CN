      Critics of positive aesthetics have offered a variety of objections to these views. Some find the idea problematic because it appears to undercut the possibility of the comparative assessments thought to be necessary for environmental planning and protection (J. Thompson 1995; Godlovitch 1998a; Newman, Varner, & Linquist 2017)[^godlovitch-1998a][^thompson-1995]. Others have objected that the idea itself seems unintuitive, obscure, and/or inadequately justified (Godlovitch 1998b; Budd 2002; Alcaraz León 2010; Brady 2011; Stecker 2012)[^alcaraz-2010][^brady-2011][^budd-2002][^godlovitch-1998b][^stecker-2012]. Even philosophers open to the idea of positive aesthetics have expressed reservations about some of its formulations, arguing that these depend too heavily on an out-dated conception of ecology and/or fail to stress an evolutionary understanding of nature (Simus 2008a; Paden, Harmon, & Milling 2012; Paden 2015a)[^paden-2015a][^simus-2008a].
    step1: |-
      肯定美学的批评者提出了各种反对。有些人认为这一观念有问题，因为它似乎削弱了环境规划与保护所必需的比较性评估的可能性（J. Thompson 1995; Godlovitch 1998a; Newman, Varner, & Linquist 2017）[^godlovitch-1998a][^thompson-1995]。另一些人反对说，这一观念本身似乎不合直觉、晦涩难解、或辩护不足（Godlovitch 1998b; Budd 2002; Alcaraz León 2010; Brady 2011; Stecker 2012）[^alcaraz-2010][^brady-2011][^budd-2002][^godlovitch-1998b][^stecker-2012]。即便是对肯定美学持开放态度的哲学家，也对其某些表述表示保留，认为它们过于依赖过时的生态学观念，且/或未能强调对自然的进化论理解（Simus 2008a; Paden, Harmon, & Milling 2012; Paden 2015a）[^paden-2015a][^simus-2008a]。
    step2: |-
      批评肯定美学的人提出了一连串反驳。有人觉得这个观念本身就有问题，因为它似乎取消了环境规划与保护所必需的比较评估（J. Thompson 1995; Godlovitch 1998a; Newman, Varner, & Linquist 2017）[^godlovitch-1998a][^thompson-1995]。也有人反驳说，该观念本身就不合直觉、含混难解，或者缺乏足够论证（Godlovitch 1998b; Budd 2002; Alcaraz León 2010; Brady 2011; Stecker 2012）[^alcaraz-2010][^brady-2011][^budd-2002][^godlovitch-1998b][^stecker-2012]。甚至对肯定美学抱开放态度的哲学家，也对其中某些表述有所保留，认为它们过分依赖过时的生态学观念，或者未能突出对自然的进化论理解（Simus 2008a; Paden, Harmon, & Milling 2012; Paden 2015a）[^paden-2015a][^simus-2008a]。
