      Mention of the role of Chinese philosophy in Cheng’s ecoaesthetics points to a second theme: growing interest in a diversity of cultural perspectives. This trend follows recent calls for the globalization of aesthetics in general (Li & Cauvel 2006; Gandolfo & Worth 2015; Higgins 2017)[^gandolfo-2015][^higgins-2017] and of environmental aesthetics in particular (Saito 2014; Liu & Carter 2014b)[^liu-2014b][^saito-2014]. Some non-western perspectives have been considered in the Anglo-American literature: in addition to recent engagement with Chinese perspectives (Xue & Carlson 2010; Cheng et al. 2013; Liu & Carter 2014a; Chen 2007 [2015]; Brubaker 2018; Xue 2018)[^brubaker-2018][^carlson-2010][^chen-2007][^cheng-2013][^liu-2014a][^xue-2018][^xue-2010], Japanese aesthetics has also been discussed (Saito 1985, 1992, 1996, 2002, 2014; Carlson 1997; Odin 2017; Callicott & McRae 2017; Chung 2018; Nguyen 2018)[^callicott-2017][^carlson-1997][^chung-2018][^nguyen-2018][^odin-2017][^saito-1985][^saito-1992][^saito-1996][^saito-2002][^saito-2014]. Also, within the “Western perspective” itself, some have considered the particular attitudes to landscape in specific regions or countries (Finland, for example: see Sepänmaa & Heikkilä-Palo 2005; Sepänmaa, Heikkilä-Palo, & Kaukio 2007)[^sepänmaa-2005][^sepänmaa-2007][^sepänmaa-2005-2][^sepänmaa-2007-2].
    step1: |-
      提到中国哲学在程相占生态美学中的作用，指向第二个主题：对文化视角多样性的兴趣增长。这一趋势追随晚近对美学整体全球化（Li & Cauvel 2006; Gandolfo & Worth 2015; Higgins 2017）[^gandolfo-2015][^higgins-2017]以及环境美学尤其全球化（Saito 2014; Liu & Carter 2014b）[^liu-2014b][^saito-2014]的呼吁。英美文献已考虑一些非西方视角：除晚近对中国视角的介入（Xue & Carlson 2010; Cheng et al. 2013; Liu & Carter 2014a; Chen 2007 [2015]; Brubaker 2018; Xue 2018）[^brubaker-2018][^carlson-2010][^chen-2007][^cheng-2013][^liu-2014a][^xue-2018][^xue-2010]外，日本美学也得到讨论（Saito 1985, 1992, 1996, 2002, 2014; Carlson 1997; Odin 2017; Callicott & McRae 2017; Chung 2018; Nguyen 2018）[^callicott-2017][^carlson-1997][^chung-2018][^nguyen-2018][^odin-2017][^saito-1985][^saito-1992][^saito-1996][^saito-2002][^saito-2014]。此外，在“西方视角”内部，一些人也考察了特定地区或国家对景观的独特态度（例如芬兰：见 Sepänmaa & Heikkilä-Palo 2005; Sepänmaa, Heikkilä-Palo, & Kaukio 2007）[^sepänmaa-2005][^sepänmaa-2007][^sepänmaa-2005-2][^sepänmaa-2007-2]。
