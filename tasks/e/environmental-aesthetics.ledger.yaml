      Another contemporary type of humanized environment hearkens back to the heyday of Picturesque gardening: the sites of environmental artworks (Ross 1993, 1998)[^ross-1993]. Large-scale artworks such as Michael Heizer’s *Double Negative*, Robert Smithson’s *Spiral Jetty*, and Christo’s *Running Fence* raise pertinent issues given that they are not only located in the environment, but include some portion of it as a constitutive part of the work. Adapting a term originally used by Smithson, Donald Crawford described such works as involving different forms of “dialectical relationship” between nature and culture (Crawford 1983)[^crawford-1983]. Some argue that there is an ethical problem with altering the environment in the way that environmental artworks do: Allen Carlson refers to such works as “aesthetic affronts” to nature (Carlson 1986, see also Humphrey 1985; Nannicelli 2018; Parsons 2023b)[^carlson-1986][^humphrey-1985][^nannicelli-2018][^parsons-2023b] In response, others have defended the possibility of more ethical forms of environmental art, and explored its potential benefits for raising environmental awareness (Heyd 2002; Brady 2007; Brook 2007; J. Fisher 2007; Lintott 2007; Simus 2008b; Brady, Brook, & Prior 2018)[^brady-2007][^brook-2007][^fisher-2007][^heyd-2002][^lintott-2007][^simus-2008b].
    step1: |-
      另一类当代人化环境可以追溯到如画式园艺的鼎盛时期：环境艺术作品的场地（Ross 1993, 1998）[^ross-1993]。迈克尔·海泽（Michael Heizer）的*Double Negative*（《双重否定》）、罗伯特·史密森（Robert Smithson）的*Spiral Jetty*（《螺旋防波堤》）与克里斯托（Christo）的*Running Fence*（《奔跑的栅栏》）等大型作品提出了相关问题，因为它们不仅位于环境之中，还把环境的一部分纳入作品，作为其构成部分。唐纳德·克劳福德（Donald Crawford）借用史密森最初使用的一个术语，把这类作品描述为涉及自然与文化之间不同形式的“辩证关系”（Crawford 1983）[^crawford-1983]。有人主张，以环境艺术的方式改造环境存在伦理问题：艾伦·卡尔森把这类作品称为对自然的“审美冒犯”（Carlson 1986；另见 Humphrey 1985; Nannicelli 2018; Parsons 2023b）[^carlson-1986][^humphrey-1985][^nannicelli-2018][^parsons-2023b]。作为回应，另一些人捍卫更为伦理的环境艺术形式的可能性，并探讨它在提升环境意识方面的潜在益处（Heyd 2002; Brady 2007; Brook 2007; J. Fisher 2007; Lintott 2007; Simus 2008b; Brady, Brook, & Prior 2018）[^brady-2007][^brook-2007][^fisher-2007][^heyd-2002][^lintott-2007][^simus-2008b]。
    step2: |-
      还有一类当代人化环境，可以回溯到如画式造园的黄金时代，那就是环境艺术作品的场所（Ross 1993, 1998）[^ross-1993]。迈克尔·海泽（Michael Heizer）的*Double Negative*（《双重否定》）、罗伯特·史密森（Robert Smithson）的*Spiral Jetty*（《螺旋防波堤》）、克里斯托（Christo）的*Running Fence*（《奔跑的栅栏》）这类大型作品之所以引出棘手问题，是因为它们不仅坐落于环境之中，还把环境的一部分当作作品的构成要素。唐纳德·克劳福德（Donald Crawford）借用了史密森原先的一个说法，把这类作品描述为自然与文化之间各种形式的“辩证关系”（Crawford 1983）[^crawford-1983]。有人认为，以环境艺术的方式改动环境本身就带有伦理问题：艾伦·卡尔森径称这类作品是对自然的“审美冒犯”（Carlson 1986；另见 Humphrey 1985; Nannicelli 2018; Parsons 2023b）[^carlson-1986][^humphrey-1985][^nannicelli-2018][^parsons-2023b]。对此，另一些人为更合乎伦理的环境艺术形式辩护，并探讨它在唤起环境意识方面的潜在好处（Heyd 2002; Brady 2007; Brook 2007; J. Fisher 2007; Lintott 2007; Simus 2008b; Brady, Brook, & Prior 2018）[^brady-2007][^brook-2007][^fisher-2007][^heyd-2002][^lintott-2007][^simus-2008b]。
