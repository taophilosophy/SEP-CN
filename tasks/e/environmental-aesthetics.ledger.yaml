      Still another interpretation of “ecological aesthetics” can be found in recent Chinese philosophy, where several writers have developed robust versions of “ecoaesthetics” (two prominent versions available in English translation are Cheng 2013a, 2016 and Zeng 2017)[^cheng-2013a][^zeng-2017]. Cheng embraces, as his “four keystones of ecological aesthetic appreciation”, not only the centrality of ecological knowledge and the rejection of the duality of humanity and the natural world, but also the over-arching value of ecosystem biodiversity and health and the continued guidance of ecological ethics (Cheng 2013c)[^cheng-2013c]. While the first of Cheng’s “keystones” is redolent of the NEM and the standard scientific understanding of ecology, the others invoke a more philosophical conception of “ecology” that has closer affinities to Berleant’s notion of engagement, the Continentalist ideas discussed above, and elements of traditional Chinese philosophy (Carlson 2017, 2018, Parsons & Zhang 2018; for further discussion of the relation between ecoaesthetics and Berleant’s view, see Berleant 2016, Cheng 2021)[^berleant-2016][^carlson-2017][^cheng-2021][^parsons-2018][^parsons-2018-2].
    step1: |-
      “生态美学”还有一种解释见于晚近的中国哲学，若干学者在那里发展出强有力的“生态美学”（ecoaesthetics）版本（两部有英译的著名版本是 Cheng 2013a, 2016 与 Zeng 2017）[^cheng-2013a][^zeng-2017]。Cheng 把生态知识的核心地位、对人与自然二分的拒斥，以及生态系统生物多样性与健康的总体价值、生态伦理的持续引导，一并纳入其“生态审美欣赏的四大基石”（Cheng 2013c）[^cheng-2013c]。Cheng 的第一块“基石”令人想到 NEM 与标准的生态科学理解，其余的则援引一种更具哲学意味的“生态”概念，它与伯林特的介入观念、上述欧陆观念以及中国传统哲学的要素有更近的亲缘（Carlson 2017, 2018, Parsons & Zhang 2018；关于生态美学与伯林特观点之关系的进一步讨论，见 Berleant 2016, Cheng 2021）[^berleant-2016][^carlson-2017][^cheng-2021][^parsons-2018][^parsons-2018-2]。
    step2: |-
      “生态美学”还有一种读法见于晚近的中国哲学：好几位学者在那里建构了相当完整的“生态美学”理论（已有英译的两个重要版本是 Cheng 2013a, 2016 与 Zeng 2017）[^cheng-2013a][^zeng-2017]。Cheng 把他所谓的“生态审美欣赏四大基石”并举：生态知识居于核心、拒斥人与自然的二分、生态系统生物多样性与健康的总体价值、生态伦理的持续引导（Cheng 2013c）[^cheng-2013c]。四块基石中的第一块让人联想到 NEM 与标准的生态科学理解；其余几块所援引的“生态”概念则更具哲学意味，与伯林特的介入观念、上文提到的欧陆思路以及中国传统哲学的若干要素都更为亲近（Carlson 2017, 2018, Parsons & Zhang 2018；关于生态美学与伯林特学说之关系的进一步讨论，见 Berleant 2016, Cheng 2021）[^berleant-2016][^carlson-2017][^cheng-2021][^parsons-2018][^parsons-2018-2]。
