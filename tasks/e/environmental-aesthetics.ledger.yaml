      Carlson’s approach to the appreciation of human environments mirrors the NEM, with the difference that for human environments it is knowledge provided by the social sciences and history that is taken to be essential for appropriate appreciation (Carlson 2009)[^carlson-2009]. What is needed is to properly assess human artifacts such as buildings, cities, bridges, and farms is information about their histories, their functions, and their roles in our lives (Carlson 1985, 2001; Parsons & Carlson 2008)[^carlson-1985][^carlson-2001][^carlson-2008][^parsons-2008][^parsons-2008-2]. A related approach emphasizes the aesthetic potential of cultural traditions, which seem especially relevant to the appreciation of what might be termed cultural landscapes—environments that constitute important places in the cultures and histories of particular groups of people. What is often called a “sense of place”, together with ideas and images from folklore, mythology, and religion, frequently plays a significant role in individuals’ aesthetic experience of their own home landscapes (Saito 1985; Sepänmaa 1986 [1993]; Carlson 2000; Sandrisser 2007; Firth 2008; Nomikos 2018)[^carlson-2000][^firth-2008][^nomikos-2018][^saito-1985][^sandrisser-2007][^sepänmaa-1986].
    step1: |-
      Carlson 对人类环境欣赏的进路与 NEM 平行，区别在于：对人类环境，他认为社会科学与历史提供的知识对恰当欣赏必不可少（Carlson 2009）[^carlson-2009]。要恰当评价建筑、城市、桥梁与农场等人类人工物，需要关于其历史、功能及在我们生活中角色的信息（Carlson 1985, 2001; Parsons & Carlson 2008）[^carlson-1985][^carlson-2001][^carlson-2008][^parsons-2008][^parsons-2008-2]。一种相关进路强调文化传统的审美潜力，这似乎与所谓文化景观——在特定群体文化与历史中构成重要地点的环境——的欣赏尤其相关。所谓“场所感”，连同来自民间传说、神话与宗教的观念和意象，常常在个体对自己家乡景观的审美经验中起重要作用（Saito 1985; Sepänmaa 1986 [1993]; Carlson 2000; Sandrisser 2007; Firth 2008; Nomikos 2018）[^carlson-2000][^firth-2008][^nomikos-2018][^saito-1985][^sandrisser-2007][^sepänmaa-1986]。
