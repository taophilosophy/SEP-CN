      In the wake of the work done by Hepburn and Carlson, and in the context of growing general interest in environmental issues, the dismissal of nature as of little aesthetic interest no longer seemed so compelling. In the discussions that followed, there were some rearguard attempts to defend the neglect of natural beauty. One line of thought, for example, argued that because nature is not intentionally designed, it cannot be aesthetically appreciated (Mannison 1980; Elliot 1982; though see Elliot 1997)[^elliot-1982][^elliot-1997][^mannison-1980]. However, such views found little support, in part because so many of our fundamental paradigms of aesthetic experience seem to involve nature: for example, our delight in a sunset or in a bird in flight (Sibley 2001a)[^sibley-2001a]. Moreover, one important strand in the Western tradition of aesthetics—the idea that anything that can be viewed can be viewed aesthetically—rendered the exclusion of the natural world arbitrary (Stolnitz 1960, Ziff 1979)[^stolnitz-1960][^ziff-1979].
    step1: |-
      在赫伯恩与卡尔森的工作之后，加之公众对环境问题的兴趣日增，把自然斥为几乎无审美趣味的说法不再那么有说服力了。随后的讨论中，出现了一些为忽视自然美辩护的守旧尝试。例如，一种思路主张，由于自然并非有意设计，它就不能被审美欣赏（Mannison 1980; Elliot 1982；不过见 Elliot 1997）[^elliot-1982][^elliot-1997][^mannison-1980]。然而这类观点鲜有支持，部分原因在于我们许多根本的审美经验范式似乎都涉及自然：例如我们对日落或飞鸟的喜悦（Sibley 2001a）[^sibley-2001a]。此外，西方美学传统中一条重要的脉络——凡可观看之物皆可作审美观看——也使把自然世界排除在外显得任意（Stolnitz 1960, Ziff 1979）[^stolnitz-1960][^ziff-1979]。
    step2: |-
      赫伯恩与卡尔森的工作之后，加上公众对环境议题的兴趣日增，再把自然贬为几乎没有审美趣味，已不那么令人信服。此后的讨论中还出现过几番守势的辩护，试图为忽视自然美开脱。比如有一种说法：自然并非有意设计，故而不能成为审美欣赏的对象（Mannison 1980; Elliot 1982；但见 Elliot 1997）[^elliot-1982][^elliot-1997][^mannison-1980]。这类主张却少有附和，一个原因是我们最根本的一些审美经验范式似乎都离不开自然，譬如对落日或飞鸟的欣喜（Sibley 2001a）[^sibley-2001a]。再者，西方美学传统中本有一条重要线索——凡能观看之物皆可作审美观看——有了它，把自然世界排除在外就显得武断（Stolnitz 1960, Ziff 1979）[^stolnitz-1960][^ziff-1979]。
