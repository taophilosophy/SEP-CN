      In many ways, the theoretical issues here parallel those in long-standing controversies about the “art” status of traditional artifacts from pre-industrial, tribal cultures (for an overview of this debate, see Dutton 2008 and Shiner 2008)[^dutton-2008][^shiner-2008]. In the context of the environment, however, different understandings of the “aesthetic” meaning and value of the land can have very real political and economic implications, such as the dispossession of land used by indigenous North Americans to facilitate the creation of parks where “nature”s beauty’ could be preserved and enjoyed (Cronon 1996; Spence 1999)[^cronon-1996][^spence-1999]. Similar cross-cultural issues continue to play out across the so-called “developing world” (for recent discussions that bring out many of the relevant issues, see Saunders 2013; Maduka 2014; Vice 2023)[^maduka-2014][^saunders-2013][^vice-2023].
