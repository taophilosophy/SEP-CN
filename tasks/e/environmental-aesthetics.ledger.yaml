      Recent years have seen a reappraisal of the moribund notions of the picturesque and sublime. As described above, philosophers and historians have often castigated the Picturesque as the fountainhead of the problematic “scenic aesthetic”. Recently, however, some have highlighted more nuanced versions of the concept, such as that employed by the eighteenth-century thinker Uvedale Price (1796)[^price-1796]. Roger Paden argues that Price’s notion of the picturesque did not involve treating nature in a formalist or art-like fashion, and further emphasizes an important interrelation with the distinct aesthetic qualities of beauty and sublimity (Paden 2013; Paden, Harmon, & Milling 2013)[^paden-2013][^paden-2013-2]. Paden concludes that that suitably understood, the concept has an important role to play in the aesthetics of nature, providing the basis for a normative account of appreciation rooted in evolutionary biology (Paden 2015a, 2016; Paden, Harmon, & Milling 2012)[^paden-2015a][^paden-2016][^paden-2012]. In a similar vein, Isis Brook argues that the picturesque is particularly apt for appreciating gardens and the rural landscape, expressing “a love of wild nature in a small compass” (Brook 2008)[^brook-2008].
    step1: |-
      近年来，垂死的如画与崇高观念得到重估。如上所述，哲学家与历史学家常把如画斥为有问题“风景美学”的源头。然而晚近一些人突出了该概念更细致的版本，如 18 世纪思想家 Uvedale Price（1796）[^price-1796] 所用者。Roger Paden 主张，Price 的如画观念并不涉及以形式主义或类似艺术的方式对待自然，并进一步强调它与美和崇高这些不同审美品质的重要相互关系（Paden 2013; Paden, Harmon, & Milling 2013）[^paden-2013][^paden-2013-2]。Paden 结论说，若得到恰当理解，该概念在自然美学中可扮演重要角色，为植根于进化生物学的规范性欣赏论述提供基础（Paden 2015a, 2016; Paden, Harmon, & Milling 2012）[^paden-2015a][^paden-2016][^paden-2012]。类似地，Isis Brook 主张如画尤其适合欣赏花园与乡村景观，表达“在狭小范围内对野生自然的热爱”（Brook 2008）[^brook-2008]。
