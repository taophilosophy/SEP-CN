      In these discussions, some specific types of humanized or “mixed” environments have emerged as the subject of particular interest: for example, the urban cityscape (von Bonsdorff 2002; Macauley 2007; Sepänmaa 2005, 2007; Parsons 2008; Erzen & Milani 2013; Frydryczak 2015)[^erzen-2013][^frydryczak-2015][^macauley-2007][^parsons-2008][^parsons-2008-2][^sepänmaa-2005][^sepänmaa-2005-2][^bonsdorff-2002] and specific elements within it (shopping centers, e.g.; see Brottman 2007)[^brottman-2007]. Industrial and post-industrial sites have also garnered attention. As cities ponder what to do with massive derelict sites such as Detroit’s defunct auto plants, citizens have come to see them as aesthetically interesting elements in the urban landscape, industrial “ruins” that evoke responses reminiscent of the Picturesque or the sublime (Maskit 2007; Kover 2014; Scarbrough 2018; Conroy 2019; Herrington & Lopes 2019)[^conroy-2019][^herrington-2019][^kover-2014][^maskit-2007][^scarbrough-2018].
    step1: |-
      在这些讨论中，某些特定类型的人化或“混合”环境成为特别关注的对象：例如城市景观（von Bonsdorff 2002; Macauley 2007; Sepänmaa 2005, 2007; Parsons 2008; Erzen & Milani 2013; Frydryczak 2015）[^erzen-2013][^frydryczak-2015][^macauley-2007][^parsons-2008][^parsons-2008-2][^sepänmaa-2005][^sepänmaa-2005-2][^bonsdorff-2002]以及其中的特定要素（例如购物中心；见 Brottman 2007）[^brottman-2007]。工业与后工业场地也引起了关注。当城市思忖如何处理底特律废弃汽车厂之类大规模荒废场地时，市民们开始把它们视为城市景观中有审美趣味的要素——唤起如画或崇高般反应的工业“废墟”（Maskit 2007; Kover 2014; Scarbrough 2018; Conroy 2019; Herrington & Lopes 2019）[^conroy-2019][^herrington-2019][^kover-2014][^maskit-2007][^scarbrough-2018]。
    step2: |-
      讨论中逐渐浮现出几类特别受关注的人化或“混合”环境。其一是城市景观（von Bonsdorff 2002; Macauley 2007; Sepänmaa 2005, 2007; Parsons 2008; Erzen & Milani 2013; Frydryczak 2015）[^erzen-2013][^frydryczak-2015][^macauley-2007][^parsons-2008][^parsons-2008-2][^sepänmaa-2005][^sepänmaa-2005-2][^bonsdorff-2002]，以及其中的具体要素（比如购物中心，见 Brottman 2007）[^brottman-2007]。工业与后工业场地也进入了视野。当城市为底特律那些废弃汽车厂之类的大片荒地发愁时，市民反倒把它们看作城市景观中饶有审美兴味的成分——唤起如画或崇高之感的工业“废墟”（Maskit 2007; Kover 2014; Scarbrough 2018; Conroy 2019; Herrington & Lopes 2019）[^conroy-2019][^herrington-2019][^kover-2014][^maskit-2007][^scarbrough-2018]。
