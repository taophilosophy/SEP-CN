      More recently the label “ecological aesthetics” has also been adopted by some philosophers working in the so-called “Continental tradition” (Toadvine 2009)[^toadvine-2009]. Drawing on figures such as Husserl, Heidegger, and Merleau-Ponty, this perspective overlaps in some ways with Berleant’s aesthetics of engagement, which in turn was influenced by ideas from Phenomenology (see Berleant 1985, 2013a)[^berleant-1985][^berleant-2013a]. In this work, the label “ecological” is connected to the philosophical claim that organisms cannot be distinguished from their environment, except through an abstraction that distorts the ontologically primary reality of their embodied experience (for related Continentalist perspectives, see Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019)[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011].
    step1: |-
      更近期，“生态美学”标签也被一些在所谓“大陆传统”中工作的哲学家采用（Toadvine 2009）[^toadvine-2009]。这一视角借鉴 Husserl、Heidegger 与 Merleau-Ponty 等人物，在某些方面与 Berleant 的介入美学重叠，而后者又受现象学观念影响（见 Berleant 1985, 2013a）[^berleant-1985][^berleant-2013a]。在这项工作中，“生态”标签与如下哲学主张相连：有机体不能与其环境区分，除非通过一种扭曲其具身经验之本体论首要实在的抽象（相关大陆视角见 Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019）[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011]。
    step2: |-
      更近期，“生态美学”标签也被一些在所谓“大陆传统”中工作的哲学家采用（Toadvine 2009）[^toadvine-2009]。这一视角借鉴 Husserl、Heidegger 与 Merleau-Ponty 等人物，在某些方面与 Berleant 的介入美学重叠，而后者又受现象学观念影响（见 Berleant 1985, 2013a）[^berleant-1985][^berleant-2013a]。在这项工作中，“生态”标签与如下哲学主张相连：有机体不能与其环境区分，除非通过一种扭曲其具身经验之本体论首要实在的抽象（相关大陆视角见 Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019）[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011]。
