      Alongside his critique of the “scenic aesthetic”, Carlson developed the ideas of environmental thinkers such as Leopold and Muir into an alternative view that he originally called the “natural environmental model” of aesthetic appreciation (hereafter “NEM”; Carlson 1979)[^carlson-1979]. On this view, appropriately appreciating a natural environment requires regarding it as the particular sort of environment that it is: that is to say, in terms of the characterization of that environment provided by natural science. Though this view rejects the appreciation of nature as if it were art (as on the Picturesque-inspired “landscape model”), Carlson argued for it by appealing to a general analogy *between* nature and art. Just as “serious” or appropriate aesthetic appreciation of art requires some knowledge of art history and art criticism, such appreciation of nature requires some knowledge of natural history: that is, knowledge provided by the natural sciences, especially geology, biology, and ecology. For instance, appropriate appreciation of a work such as Picasso’s *Guernica* (1937) requires that we experience it as what it is—a cubist painting—and therefore that we appreciate it in light of our knowledge of paintings in general and of cubist paintings in particular (Walton 1970)[^walton-1970]. The NEM applies the same reasoning to natural things, asserting that scientific understanding of nature can reveal the aesthetic qualities of natural objects and environments in the way in which knowledge about art history and art criticism so for works of art. In addition to this analogical argument, Carlson and other defenders of this approach also offered broadly ethical reasons to support it, holding, for instance, that ecologically-informed appreciation of nature leads to better treatment of the environment or greater support for more progressive environment protection (Carlson 1981, Saito 1998b; for critical discussion see Stecker 2012, Parsons 2018)[^carlson-1981][^parsons-2018][^parsons-2018-2][^saito-1998b][^stecker-2012]. Following his initial presentation of the NEM, Carlson further developed and qualified the view (Carlson 1981, 2000, 2007)[^carlson-1981][^carlson-2000][^carlson-2007]: variations of it have been defended by a number of other philosophers (Callicott 1994, 2003; Rolston 1995; Eaton 1998; Fudge 2001; Matthews 2002; Parsons 2002, 2006a, 2006b; Parsons & Carlson 2004, 2008)[^callicott-1994][^callicott-2003][^carlson-2004][^carlson-2008][^eaton-1998][^fudge-2001][^matthews-2002][^parsons-2002][^parsons-2004][^parsons-2006a][^parsons-2006b][^parsons-2008][^parsons-2004-2][^parsons-2008-2][^parsons-2002-2][^rolston-1995].
    step1: |-
      除了对“风景美学”的批判，Carlson 还把 Leopold 与 Muir 等环境思想家的观念发展为另一种观点，他最初称之为审美欣赏的“自然环境模式”（以下简称 NEM；Carlson 1979）[^carlson-1979]。按此观点，恰当地欣赏自然环境要求把它视为它所是的那种特定环境：也就是说，依据自然科学对该环境的刻画来欣赏。尽管这一观点拒绝把自然当作艺术来欣赏（如受如画启发的“景观模式”），Carlson 仍通过诉诸自然与艺术之间的一般类比来为它辩护。正如对艺术的“严肃”或恰当审美欣赏需要一些艺术史与艺术批评知识，对自然的此类欣赏也需要一些自然史知识：即自然科学、尤其是地质学、生物学与生态学提供的知识。例如，恰当欣赏毕加索《格尔尼卡》（1937）这样的作品，要求我们把它作为它所是的东西——一幅立体主义绘画——来经验，因此要求我们依据对绘画一般、尤其是立体主义绘画的知识来欣赏它（Walton 1970）[^walton-1970]。NEM 把同样的推理应用于自然物，主张对自然的科学理解能够揭示自然对象与环境的审美品质，正如艺术史与艺术批评知识对艺术作品所做的那样。除这一类比论证外，Carlson 与该进路的其他辩护者还提出宽泛的伦理理由：例如，以生态学为依据的自然欣赏会带来更好的环境对待，或对更进步的环境保护给予更大支持（Carlson 1981, Saito 1998b; 批判讨论见 Stecker 2012, Parsons 2018）[^carlson-1981][^parsons-2018][^parsons-2018-2][^saito-1998b][^stecker-2012]。在最初提出 NEM 之后，Carlson 进一步发展并限定了这一观点（Carlson 1981, 2000, 2007）[^carlson-1981][^carlson-2000][^carlson-2007]：其变体得到许多其他哲学家的辩护（Callicott 1994, 2003; Rolston 1995; Eaton 1998; Fudge 2001; Matthews 2002; Parsons 2002, 2006a, 2006b; Parsons & Carlson 2004, 2008）[^callicott-1994][^callicott-2003][^carlson-2004][^carlson-2008][^eaton-1998][^fudge-2001][^matthews-2002][^parsons-2002][^parsons-2004][^parsons-2006a][^parsons-2006b][^parsons-2008][^parsons-2004-2][^parsons-2008-2][^parsons-2002-2][^rolston-1995]。
