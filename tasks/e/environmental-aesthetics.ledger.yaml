      On that issue, a number of philosophers have argued that such scientifically informed beliefs are *not* necessary for appropriate appreciation, on grounds many and various: that the NEM’s appeal to science simply confuses facts and values (Berleant 2016; Newman, Varner, & Linquist 2017)[^berleant-2016]; that it conflicts with the disinterestedness of aesthetic experience (Zangwill 2013)[^zangwill-2013]; that the potential range of such belief is too great (Stecker 1997; Budd 2002)[^budd-2002][^stecker-1997]; that it unduly limits the scope of aesthetic experience (Heyd 2001; Brady 2003; Zangwill 2005b)[^brady-2003][^heyd-2001][^zangwill-2005b]; and that such beliefs are too abstract to affect aesthetic experience (Heyd 2001; Hill & Daniel 2008)[^heyd-2001]. Some proponents of these criticisms see science as incompatible with aesthetic appreciation altogether, whereas others allow that scientifically-informed appreciation is possible, though merely one of a plurality of valid forms of appreciation (see, e.g., Ross 2005)[^ross-2005].
    step1: |-
      在这个问题上，不少哲学家论证说，此类科学上有所依据的信念对恰当欣赏而言*not*（并不）必要，理由多种多样：NEM 诉诸科学只是混淆了事实与价值（Berleant 2016; Newman, Varner, & Linquist 2017）[^berleant-2016]；它与审美经验的无利害性相冲突（Zangwill 2013）[^zangwill-2013]；这类信念的可能范围过于宽泛（Stecker 1997; Budd 2002）[^budd-2002][^stecker-1997]；它不适当地限制了审美经验的范围（Heyd 2001; Brady 2003; Zangwill 2005b）[^brady-2003][^heyd-2001][^zangwill-2005b]；以及此类信念过于抽象，无法影响审美经验（Heyd 2001; Hill & Daniel 2008）[^heyd-2001]。这些批评的某些支持者认为科学与审美欣赏全然不相容，另一些人则承认以科学为依据的欣赏是可能的，只不过它是众多有效欣赏形式之一（例如见 Ross 2005）[^ross-2005]。
    step2: |-
      针对这一点，许多哲学家主张这类有科学依据的信念对于恰当欣赏*not*（并非）必需，所举理由五花八门：NEM 求助于科学，无非把事实与价值混作一谈（Berleant 2016; Newman, Varner, & Linquist 2017）[^berleant-2016]；这样做与审美经验的无利害性相抵触（Zangwill 2013）[^zangwill-2013]；这类信念可能涵盖的范围太大（Stecker 1997; Budd 2002）[^budd-2002][^stecker-1997]；它过度压缩了审美经验的余地（Heyd 2001; Brady 2003; Zangwill 2005b）[^brady-2003][^heyd-2001][^zangwill-2005b]；况且这类信念过于抽象，难以影响审美经验（Heyd 2001; Hill & Daniel 2008）[^heyd-2001]。持这些批评的人当中，有的认为科学与审美欣赏根本水火不容，有的则允许以科学为依据的欣赏成立，只把它看作诸多有效欣赏方式之一（例如见 Ross 2005）[^ross-2005]。
