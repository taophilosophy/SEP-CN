      Indeed, the stark dichotomy between the NEM and the aesthetics of engagement evolved into a set of distinctions widely used to organize the field, with positions being categorized as either “cognitive” or “non-cognitive” (Godlovitch 1994; Eaton 1998; Carlson & Berleant 2004)[^berleant-2004][^carlson-2004][^eaton-1998][^godlovitch-1994], “conceptual” or “non-conceptual” (Moore 1999)[^moore-1999], or “narrative” and “ambient” (Foster 1998)[^foster-1998]. Roughly, such distinctions marked a division between positions that take knowledge and information to be essential to aesthetic appreciation of environments, as per the NEM, and those that, like the aesthetics of engagement, downplay this aspect and emphasize other dimensions of appreciation. On the “cognitive” side we find, in addition to the NEM, views that require the belief that nature has a non-human origin (e.g., Budd 2002)[^budd-2002] as well as views that highlight other sources of belief such as local and regional narratives, folklore, art, and mythological stories about nature (Sepänmaa 1986 [1993], 2004; Saito 1998b; Heyd 2001; Leddy 2005; Tafalla 2010)[^heyd-2001][^leddy-2005][^saito-1998b][^sepänmaa-1986][^tafalla-2010]. Because of this diversity amongst the “cognitivist” views, the term “scientific cognitivism” was introduced as a name for the NEM. On the “non-cognitive side” of the ledger, we find views that emphasize the role of emotion (Carroll 1993)[^carroll-1993], a sense of mystery in nature’s otherness (Godlovitch 1994)[^godlovitch-1994], “formal qualities” (Zangwill 2001, 2005a, 2005b, 2013)[^zangwill-2001][^zangwill-2005a][^zangwill-2005b][^zangwill-2013], metaphysical ideas and insights (Hepburn 1996)[^hepburn-1996], and imagination (Brady 1998, 2003)[^brady-1998][^brady-2003].
    step1: |-
      事实上，NEM 与介入美学之间的鲜明二分，演化为一套广泛用于组织该领域的区分：立场被归类为“认知”或“非认知”（Godlovitch 1994; Eaton 1998; Carlson & Berleant 2004）[^berleant-2004][^carlson-2004][^eaton-1998][^godlovitch-1994]、“概念”或“非概念”（Moore 1999）[^moore-1999]，或“叙事”与“氛围”（Foster 1998）[^foster-1998]。大致上，这些区分标志着两种立场之间的分界：一种如 NEM 那样认为知识与信息对环境审美欣赏至关重要；另一种如介入美学那样淡化这一方面而强调欣赏的其他维度。在“认知”一方，除 NEM 外，还有要求相信自然具有非人起源的观点（如 Budd 2002）[^budd-2002]，以及突出地方与区域叙事、民间传说、艺术和关于自然的神话故事等其他信念来源的观点（Sepänmaa 1986 [1993], 2004; Saito 1998b; Heyd 2001; Leddy 2005; Tafalla 2010）[^heyd-2001][^leddy-2005][^saito-1998b][^sepänmaa-1986][^tafalla-2010]。由于“认知主义”观点内部如此多样，“科学认知主义”一词被引入，作为 NEM 的名称。在“非认知”一方，有强调情感作用（Carroll 1993）[^carroll-1993]、自然他者性中的神秘感（Godlovitch 1994）[^godlovitch-1994]、“形式品质”（Zangwill 2001, 2005a, 2005b, 2013）[^zangwill-2001][^zangwill-2005a][^zangwill-2005b][^zangwill-2013]、形而上学观念与洞见（Hepburn 1996）[^hepburn-1996]以及想象（Brady 1998, 2003）[^brady-1998][^brady-2003]的观点。
