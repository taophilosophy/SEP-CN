      While this idea is obviously closed related to the NEM, the qualification “beneficial” introduces a subtle difference: appropriate appreciation of a landscape requires not only an understanding of its ecological *operation*, but also positive appraisal of its ecological *value*. On this view, the ecologically harmful—invasive species, for example—cannot be aesthetically good, regardless of their showy looks or interesting biology (for critical discussion see Parsons & Daniel 2002; on other recent discussions of the alignment of ecological and aesthetic value, see section 4.6 below)[^parsons-2002][^parsons-2002-2]
    step1: |-
      这一观念显然与 NEM 密切相关，但“有益的”这一限定引入了微妙的差别：对景观的恰当欣赏不仅要求理解其生态*operation*（运作），还要求对其生态*value*（价值）作出正面评价。按此观点，生态上有害的东西——例如入侵物种——不可能在审美上是好的，无论它们外表多么艳丽、生物学上多么有趣（批判性讨论见 Parsons & Daniel 2002；关于生态价值与审美价值之对齐的其他晚近讨论，见下文第 4.6 节）[^parsons-2002][^parsons-2002-2]
    step2: |-
      这个看法显然与 NEM 关系密切，但“有益的”这一限定带来了细微差别：恰当欣赏一处景观，既要懂得它生态上的*operation*（运作），又要对其生态*value*（价值）作出肯定评价。照此说来，凡是生态上造成危害的东西——入侵物种即为一例——都不可能是审美上好的，无论它外表多么惹眼、生物学上多么有意思（批评性讨论见 Parsons & Daniel 2002；关于生态价值与审美价值相协调的其他近期讨论，见下文第 4.6 节）[^parsons-2002][^parsons-2002-2]
