      However, though the Picturesque proved a resilient—indeed dominant—force, some early conservationists viewed the Park system’s fixation on scenery as a mistake. In their struggle to reorient park policies toward ecological aims and priorities, they sought different ways of understanding nature’s aesthetic value. Though they too applied the categories inherited from eighteenth century aesthetics, in their hands these were altered and reshaped by a growing awareness of the ecological relationships connecting humans, animals, and the land. John Muir, the most prominent public advocate of nature protection in nineteenth century America, is a case in point. In his well-known essay “A Near View of the High Sierra”, Muir contrasted his own experience of nature with that of his artist companions, who, guided by the idea of the picturesque, focused only on finding suitable views (Muir 1894)[^muir-1894]. Muir’s own aesthetic, in contrast, incorporated a blend of religious feeling for, and geological interest in, the mountain environment. Muir also used the traditional idea of the sublime in describing his experience of nature, reinterpreting it to fit his own experience of this “new world” environment (Brady 2018)[^brady-2018][^brady-2018-2]. Similar ideas about natural beauty and its relation to the naturalist’s perspective were pursued by later environmental thinkers, notably the forestry scientist Aldo Leopold (1966)[^leopold-1966].
    step1: |-
      然而，尽管如画被证明是顽强乃至主导的力量，一些早期保护主义者认为公园体系对景色的执迷是个错误。在努力把公园政策转向生态目标与优先事项时，他们寻求理解自然审美价值的不同方式。尽管他们也使用从 18 世纪美学继承的范畴，但在他们手中，这些范畴因对连接人类、动物与土地的生态关系日益增长的意识而被改变与重塑。19 世纪美国最著名的自然保护公共倡导者 John Muir 便是一例。在其名文《远观高山》中，Muir 把自己对自然的经验与艺术家同伴的经验相对照；后者受如画观念引导，只专注于寻找合适视图（Muir 1894）[^muir-1894]。相比之下，Muir 自己的美学融合了对山地环境的宗教情感与地质兴趣。Muir 也用传统的崇高观念描述自然经验，并重新解释它以契合自己对这个“新世界”环境的体验（Brady 2018）[^brady-2018][^brady-2018-2]。后来环境思想家，尤其是林业科学家 Aldo Leopold（1966）[^leopold-1966]，继续探讨关于自然美及其与自然主义者视角关系的类似观念。
