      A different approach is suggested by Jennifer Welchman, who argues that biodiversity is connected to aesthetic value in a more indirect way. Since aesthetic experience is a basic good, she argues, the state has an obligation to protect the means for obtaining it. Since a satisfying aesthetic life requires a rich and diverse array of things to appreciate, this obligation requires protecting the diverse array of natural environments and species that we possess. Thus broadly aesthetic considerations mandate the protection of biodiversity, just as they mandate the state’s preservation and promotion of wide array of different types of Art (Welchman 2018, 2020; for a critical response, see Linquist 2020)[^linquist-2020][^welchman-2018].
    step1: |-
      Jennifer Welchman 提出另一条进路，认为生物多样性以一种更间接的方式与审美价值相连。她论证说，既然审美经验是一种基本善，国家就有义务保护获得它的手段。而令人满足的审美生活需要丰富多样的欣赏对象，因此这一义务要求保护我们所拥有的多样自然环境与物种。于是，宽泛意义上的审美考虑要求保护生物多样性，正如它们要求国家保存并促进多种多样的艺术类型（Welchman 2018, 2020；批判性回应见 Linquist 2020）[^linquist-2020][^welchman-2018]。
