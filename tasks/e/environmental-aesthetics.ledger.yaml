      Other writers have looked instead to contemporary psychology to frame new theories of the sublime and related emotions, such as awe. Arcangeli and Dokic, for example, analyze sublime experience in terms of “radical limit experience”, in which awareness of an insurmountable cognitive obstacle triggers a temporary feeling of self-negation (2021; see also Cochrane 2012; McShane 2018; Clewis 2019a)[^clewis-2019a][^cochrane-2012][^mcshane-2018]. Despite their differences, these theories all characterize sublimity as a response to some form of cognitive failure. In contrast, Parsons (2023a)[^parsons-2023a] proposes a reinterpretation of the concept in terms of a form of cognitive success—a qualitative increase in perceptual ability which he calls “epistemic expansion”—arguing that so reconstrued, the sublime provides an apt vocabulary for certain aesthetic dimensions of contemporary experimental science.
    step1: |-
      其他作家则转向当代心理学，以构建关于崇高及相关情感（如敬畏）的新理论。例如，Arcangeli 与 Dokic 把崇高经验分析为“激进极限经验”：对不可逾越认知障碍的意识触发暂时的自我否定感（2021; 亦见 Cochrane 2012; McShane 2018; Clewis 2019a）[^clewis-2019a][^cochrane-2012][^mcshane-2018]。尽管存在差异，这些理论都把崇高性刻画为对某种认知失败的反应。相比之下，Parsons（2023a）[^parsons-2023a] 提出以某种认知成功——他称为“认识论扩展”的知觉能力质的提升——重新解释该概念，并主张如此重构后，崇高为当代实验科学的某些审美维度提供了贴切词汇。
