      Recent years have seen a reappraisal of the moribund notions of the picturesque and sublime. As described above, philosophers and historians have often castigated the Picturesque as the fountainhead of the problematic “scenic aesthetic”. Recently, however, some have highlighted more nuanced versions of the concept, such as that employed by the eighteenth-century thinker Uvedale Price (1796). Roger Paden argues that Price’s notion of the picturesque did not involve treating nature in a formalist or art-like fashion, and further emphasizes an important interrelation with the distinct aesthetic qualities of beauty and sublimity (Paden 2013; Paden, Harmon, & Milling 2013)[^paden-2013][^paden-2013-2]. Paden concludes that that suitably understood, the concept has an important role to play in the aesthetics of nature, providing the basis for a normative account of appreciation rooted in evolutionary biology (Paden 2015a, 2016; Paden, Harmon, & Milling 2012)[^paden-2015a]. In a similar vein, Isis Brook argues that the picturesque is particularly apt for appreciating gardens and the rural landscape, expressing “a love of wild nature in a small compass” (Brook 2008)[^brook-2008].
    step1: |-
      近年来，行将就木的如画与崇高观念得到了重新评价。如上所述，哲学家与史家常把如画斥为成问题的“风景美学”的源头。然而近来有人凸显该概念更细致的版本，例如十八世纪思想家乌弗代尔·普赖斯（Uvedale Price，1796）所使用的那样。Roger Paden 论证说，普赖斯的如画观念并不涉及以形式主义或艺术化的方式对待自然，并进一步强调它与美和崇高这些不同审美品质之间的重要相互关联（Paden 2013; Paden, Harmon, & Milling 2013）[^paden-2013][^paden-2013-2]。Paden 的结论是：只要理解得当，这一概念在自然美学中自有重要作用，可为一种植根于进化生物学的规范性欣赏说明提供基础（Paden 2015a, 2016; Paden, Harmon, & Milling 2012）[^paden-2015a]。同样地，Isis Brook 论证说，如画尤其适合欣赏园林与乡村景观，它表达的是“在狭小范围内对野性自然的热爱”（Brook 2008）[^brook-2008]。
    step2: |-
      近年来，几近废弃的如画与崇高概念又受到重新评估。前面说过，哲学家与史家往往把如画当作问题丛生的“风景美学”的祸根。不过近来也有人着力发掘这一概念更为细致的版本，例如十八世纪思想家乌弗代尔·普赖斯（Uvedale Price，1796）所持的那种。Roger Paden 认为，普赖斯的如画观念并未把自然当作形式主义的对象或准艺术品来处理，他还特别指出这一概念同美、崇高这两种不同审美品质之间的重要关联（Paden 2013; Paden, Harmon, & Milling 2013）[^paden-2013][^paden-2013-2]。Paden 的结论是：只要理解得法，如画在自然美学中仍可发挥重要作用，足以为一种奠基于进化生物学的规范性欣赏学说提供基础（Paden 2015a, 2016; Paden, Harmon, & Milling 2012）[^paden-2015a]。Isis Brook 的看法相近：如画特别宜于欣赏园林与乡村景观，它表达的是“在小小一方天地里对野性自然的热爱”（Brook 2008）[^brook-2008]。
