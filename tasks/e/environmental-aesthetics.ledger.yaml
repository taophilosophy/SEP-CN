      Some are pessimistic about our future encounters with the environment. Jukka Mikkonen, for example, argues that concepts once central to our appreciation of the environment, such as awe and wonder, will yield to a “new aesthetics of strangeness and uncertainty” (Mikkonen 2022, see also Auer 2019)[^auer-2019][^mikkonen-2022]. Others see more room for optimism, arguing that, the “moral taint” of our damaged environments notwithstanding, there will remain the possibility for positive experiences of beauty and aesthetic value (Alcaraz León 2011; Brady 2014b, 2022; Ciccarelli 2014; Nomikos 2018; Fudge 2021)[^alcaraz-2011][^brady-2014b][^brady-2022][^ciccarelli-2014][^fudge-2021][^nomikos-2018].
    step1: |-
      一些人对我们未来与环境相遇持悲观态度。例如，Jukka Mikkonen 主张，曾在我们环境欣赏中居核心的概念（如敬畏与惊奇）将让位于“一种关于陌生与不确定的新美学”（Mikkonen 2022, 亦见 Auer 2019）[^auer-2019][^mikkonen-2022]。另一些人看到更多乐观空间，主张尽管受损环境带有“道德污点”，仍会有积极体验美与审美价值的可能（Alcaraz León 2011; Brady 2014b, 2022; Ciccarelli 2014; Nomikos 2018; Fudge 2021）[^alcaraz-2011][^brady-2014b][^brady-2022][^ciccarelli-2014][^fudge-2021][^nomikos-2018]。
