      Mention of the role of Chinese philosophy in Cheng’s ecoaesthetics points to a second theme: growing interest in a diversity of cultural perspectives. This trend follows recent calls for the globalization of aesthetics in general (Li & Cauvel 2006; Gandolfo & Worth 2015; Higgins 2017)[^gandolfo-2015][^higgins-2017] and of environmental aesthetics in particular (Saito 2014; Liu & Carter 2014b)[^liu-2014b][^saito-2014]. Some non-western perspectives have been considered in the Anglo-American literature: in addition to recent engagement with Chinese perspectives (Xue & Carlson 2010; Cheng et al. 2013; Liu & Carter 2014a; Chen 2007 [2015]; Brubaker 2018; Xue 2018)[^brubaker-2018][^carlson-2010][^chen-2007][^cheng-2013][^liu-2014a][^xue-2018][^xue-2010], Japanese aesthetics has also been discussed (Saito 1985, 1992, 1996, 2002, 2014; Carlson 1997; Odin 2017; Callicott & McRae 2017; Chung 2018; Nguyen 2018)[^callicott-2017][^carlson-1997][^chung-2018][^nguyen-2018][^odin-2017][^saito-1985]. Also, within the “Western perspective” itself, some have considered the particular attitudes to landscape in specific regions or countries (Finland, for example: see Sepänmaa & Heikkilä-Palo 2005; Sepänmaa, Heikkilä-Palo, & Kaukio 2007)[^sepänmaa-2005][^sepänmaa-2005-2].
    step1: |-
      提到中国哲学在 Cheng 的生态美学中的作用，便指向第二个主题：对多元文化视角的兴趣日增。这一趋势呼应了晚近对美学整体全球化（Li & Cauvel 2006; Gandolfo & Worth 2015; Higgins 2017）[^gandolfo-2015][^higgins-2017]以及环境美学全球化（Saito 2014; Liu & Carter 2014b）[^liu-2014b][^saito-2014]的呼吁。英美文献中已经考虑了一些非西方视角：除了晚近对中国视角的接触（Xue & Carlson 2010; Cheng et al. 2013; Liu & Carter 2014a; Chen 2007 [2015]; Brubaker 2018; Xue 2018）[^brubaker-2018][^carlson-2010][^chen-2007][^cheng-2013][^liu-2014a][^xue-2018][^xue-2010]之外，日本美学也得到了讨论（Saito 1985, 1992, 1996, 2002, 2014; Carlson 1997; Odin 2017; Callicott & McRae 2017; Chung 2018; Nguyen 2018）[^callicott-2017][^carlson-1997][^chung-2018][^nguyen-2018][^odin-2017][^saito-1985]。此外，在“西方视角”内部，也有人考察了特定区域或国家对风景的特定态度（例如芬兰：见 Sepänmaa & Heikkilä-Palo 2005; Sepänmaa, Heikkilä-Palo, & Kaukio 2007）[^sepänmaa-2005][^sepänmaa-2005-2]。
    step2: |-
      说到中国哲学在 Cheng 的生态美学中所占的位置，就引出了第二个主题：对不同文化视角的兴趣与日俱增。这一风气呼应着近来两方面的呼吁：一是美学整体的全球化（Li & Cauvel 2006; Gandolfo & Worth 2015; Higgins 2017）[^gandolfo-2015][^higgins-2017]，二是环境美学的全球化（Saito 2014; Liu & Carter 2014b）[^liu-2014b][^saito-2014]。英美文献已留意到若干非西方视角：除近年对中国视角的引介（Xue & Carlson 2010; Cheng et al. 2013; Liu & Carter 2014a; Chen 2007 [2015]; Brubaker 2018; Xue 2018）[^brubaker-2018][^carlson-2010][^chen-2007][^cheng-2013][^liu-2014a][^xue-2018][^xue-2010]之外，日本美学也进入讨论（Saito 1985, 1992, 1996, 2002, 2014; Carlson 1997; Odin 2017; Callicott & McRae 2017; Chung 2018; Nguyen 2018）[^callicott-2017][^carlson-1997][^chung-2018][^nguyen-2018][^odin-2017][^saito-1985]。此外，即便在“西方视角”内部，也有人考察过某些地区或国家对风景的特殊态度（例如芬兰，见 Sepänmaa & Heikkilä-Palo 2005; Sepänmaa, Heikkilä-Palo, & Kaukio 2007）[^sepänmaa-2005][^sepänmaa-2005-2]。
