      Much of this debate concerning the normativity of nature appreciation parallels familiar discussions in the philosophy of art concerning the possibility of correctness and error in judgments of artistic value. For instance, Carlson’s claim that appreciators versed in natural history are best poised to appreciate nature echoes Hume’s famous claim that in evaluating art we should look to the verdicts of properly informed and qualified “ideal critics” (Hume 1757; see Carlson 1977)[^carlson-1977][^hume-1757]. This view has been at the center of much recent discussion of art (see, e.g., Levinson 2002; Ross 2008; Lopes 2015)[^levinson-2002][^lopes-2015][^ross-2008]. However, important aspects of the analogy between Hume’s ideal critics and the NEM’s ideal appreciators remain underexplored. For instance, Nick Riggle has recently questioned the Humean approach, suggesting that the “aesthetic ideal” may not be fully informed connoisseurship but rather the cultivation of a more personally invested relationship to art (Riggle 2015)[^riggle-2015]. An analogue of Riggle’s suggestion might also be applied to our “taste for nature” (Parsons 2023b)[^parsons-2023b]. Should we aim to experience and appreciate the widest variety of environments, or should we instead cultivate our attachments to those select few places to which we feel some special, affective attachment? (on loving nature see Jamieson 2018)[^jamieson-2018]
    step1: |-
      关于自然欣赏之规范性的这场争论，许多方面与艺术哲学中关于艺术价值判断可有正确与错误之别的熟悉讨论相平行。例如，卡尔森关于熟谙自然史者最善于欣赏自然的主张，呼应了休谟的著名论断：评价艺术时，我们应当求助于得到适当信息与资格的“理想批评家”的裁决（Hume 1757; see Carlson 1977）[^carlson-1977][^hume-1757]。这一观点一直是晚近艺术讨论的中心（例如见 Levinson 2002; Ross 2008; Lopes 2015）[^levinson-2002][^lopes-2015][^ross-2008]。然而，休谟的理想批评家与 NEM 的理想欣赏者之间类比的某些重要方面，仍未得到充分探讨。例如，Nick Riggle 近来质疑休谟式进路，提出“审美理想”或许并非充分见多识广的鉴赏力，而是培养一种更具个人投入的艺术关系（Riggle 2015）[^riggle-2015]。Riggle 建议的类似物也可以应用于我们的“自然趣味”（Parsons 2023b）[^parsons-2023b]。我们应当力求体验和欣赏尽可能多样的环境，还是应当培养对那些我们怀有特殊情感依恋的少数地方的归属感？（关于热爱自然，见 Jamieson 2018）[^jamieson-2018]
    step2: |-
      围绕自然欣赏之规范性的这场争论，有相当一部分与艺术哲学里一个老话题彼此呼应：艺术价值的判断能否有对错之分。比如卡尔森说，熟习自然史的人最能欣赏自然，这让人想起休谟的名论：评判艺术时，应当听从见闻广博、资格具备的“理想批评家”的裁断（Hume 1757; see Carlson 1977）[^carlson-1977][^hume-1757]。这一思路近来在艺术讨论中一直居于中心（例如见 Levinson 2002; Ross 2008; Lopes 2015）[^levinson-2002][^lopes-2015][^ross-2008]。不过，休谟的理想批评家与 NEM 的理想欣赏者之间的类比，仍有若干重要侧面未获充分探讨。Nick Riggle 最近就对休谟式路径提出疑问：所谓“审美理想”，也许并不是见多识广的鉴赏能力，而是养成一种个人投入更深的艺术关系（Riggle 2015）[^riggle-2015]。这一想法或可类推到我们的“自然趣味”上（Parsons 2023b）[^parsons-2023b]：我们究竟应当力求体验、欣赏尽可能多样的环境，还是应当悉心培育自己对少数几处地方的特殊情感依恋？（关于热爱自然，见 Jamieson 2018）[^jamieson-2018]
