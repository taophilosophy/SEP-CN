      Welchman’s analysis helpfully situates discussions of aesthetics and environmental protection in a broader political context. Such contexts, however, are often not as idealized as her argument suggests. As mentioned above, environmental legislation does sometimes make reference to aesthetic considerations, but often in ways that are far removed from theoretical considerations of basic goods and distributive justice. Levi Tenen has documented the important role played in US environmental protection by the “National Monuments” designation created in the 1906 Antiquities Act (Tenen 2023)[^tenen-2023]. Strictly speaking, declaring a forest or a mesa a “monument” makes little sense; moreover, it arbitrarily imposes, at least tacitly, an existing aesthetic framework (that relevant to memorial statuary) upon the natural entity being protected. Yet, for contingent historical reasons having to do with the balance of powers in the US government, monument designation emerged as an important way in which aesthetically motivated environmental protection unfolds in practice. Understanding the limits and possibilities of aesthetic protection will require further investigation of the legal institutions of environmental policy and the ways in which aesthetic values are embedded in them (see especially Richardson 2019; but also Saito 2007; Berleant 2010b, 2012; Sepänmaa 2010; Robinson & Elliott 2011)[^berleant-2010b][^berleant-2012][^richardson-2019][^robinson-2011][^saito-2007][^sepänmaa-2010].
    step1: |-
      Welchman 的分析有助于把美学与环境保护的讨论置于更广阔的政治语境中。然而这些语境往往不像她的论证所暗示的那样理想化。如上所述，环境立法有时确实提及审美考量，但方式常与关于基本善与分配正义的理论考量相去甚远。Levi Tenen 记录了 1906 年《古迹法》创设的“国家纪念地”称号在美国环境保护中扮演的重要角色（Tenen 2023）[^tenen-2023]。严格说来，把一片森林或一座台地宣布为“纪念物”意义不大；此外，它至少默然地把我现存的审美框架（与纪念雕像相关）任意强加于受保护的自然实体。然而，由于与美国政府权力平衡相关的偶然历史原因，纪念地称号成为审美驱动的环境保护在实践中展开的重要方式。理解审美保护的限度与可能，需要进一步研究环境政策的法律制度以及审美价值嵌入其中的方式（尤其见 Richardson 2019; 亦见 Saito 2007; Berleant 2010b, 2012; Sepänmaa 2010; Robinson & Elliott 2011）[^berleant-2010b][^berleant-2012][^richardson-2019][^robinson-2011][^saito-2007][^sepänmaa-2010]。
