      Though meant to emphasize the importance of the analysis of language, the remark also reveals the art-dominated construal of aesthetics of that time. Some of the major figures working in the field in the second half of the century portrayed aesthetic judgments, or important aspects of them, as conceptually dependent upon the cultural constraints, norms, and conventions that apply to works of art (Walton 1970; Dickie 1974)[^dickie-1974][^walton-1970]. Nature, by definition existing beyond this “cultural matrix”, therefore was, when considered at all, viewed as problematic as an object of aesthetic appreciation.
