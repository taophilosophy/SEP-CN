      Another contemporary type of humanized environment hearkens back to the heyday of Picturesque gardening: the sites of environmental artworks (Ross 1993, 1998)[^ross-1993][^ross-1998]. Large-scale artworks such as Michael Heizer’s *Double Negative*, Robert Smithson’s *Spiral Jetty*, and Christo’s *Running Fence* raise pertinent issues given that they are not only located in the environment, but include some portion of it as a constitutive part of the work. Adapting a term originally used by Smithson, Donald Crawford described such works as involving different forms of “dialectical relationship” between nature and culture (Crawford 1983)[^crawford-1983]. Some argue that there is an ethical problem with altering the environment in the way that environmental artworks do: Allen Carlson refers to such works as “aesthetic affronts” to nature (Carlson 1986, see also Humphrey 1985; Nannicelli 2018; Parsons 2023b)[^carlson-1985][^carlson-1986][^humphrey-1985][^nannicelli-2018][^parsons-2023b] In response, others have defended the possibility of more ethical forms of environmental art, and explored its potential benefits for raising environmental awareness (Heyd 2002; Brady 2007; Brook 2007; J. Fisher 2007; Lintott 2007; Simus 2008b; Brady, Brook, & Prior 2018)[^brady-2007][^brady-2018][^brady-2018-2][^brook-2007][^fisher-2007][^heyd-2002][^lintott-2007][^simus-2008b].
    step1: |-
      另一种当代人类化环境可追溯到如画园艺的鼎盛期：环境艺术作品的场地（Ross 1993, 1998）[^ross-1993][^ross-1998]。Michael Heizer 的《双重否定》、Robert Smithson 的《螺旋堤》与 Christo 的《奔跑的栅栏》等大型艺术作品提出相关问题，因为它们不仅位于环境中，还把环境的一部分作为作品的构成部分。Donald Crawford 借用 Smithson 最初使用的术语，把这类作品描述为涉及自然与文化之间不同形式的“辩证关系”（Crawford 1983）[^crawford-1983]。一些人主张，以环境艺术作品的方式改变环境存在伦理问题：Allen Carlson 把这类作品称为对自然的“审美冒犯”（Carlson 1986, 亦见 Humphrey 1985; Nannicelli 2018; Parsons 2023b）[^carlson-1985][^carlson-1986][^humphrey-1985][^nannicelli-2018][^parsons-2023b]。作为回应，另一些人捍卫更伦理的环境艺术形式的可能性，并探讨其提高环境意识的潜在益处（Heyd 2002; Brady 2007; Brook 2007; J. Fisher 2007; Lintott 2007; Simus 2008b; Brady, Brook, & Prior 2018）[^brady-2007][^brady-2018][^brady-2018-2][^brook-2007][^fisher-2007][^heyd-2002][^lintott-2007][^simus-2008b]。
