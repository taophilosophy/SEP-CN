      The notion of the sublime has also seen a rejuvenation. In seminal discussions, Guy Sircello (1993) and Ronald Hepburn (1988) asked why the sublime fell into desuetude, and suggested that, despite its neglect by philosophers, it might still have relevance to contemporary experience. Understanding of the former issue has been advanced by recent historical work on both the decline of sublime discourse in the context of modern tourism (e.g., Colley 2010)[^colley-2010] and its persistence in more extreme pursuits such as mountaineering (Macfarlane 2003; Hollis 2019)[^hollis-2019][^macfarlane-2003].
    step1: |-
      崇高观念也经历了复兴。在奠基性的讨论中，Guy Sircello（1993）与罗纳德·赫伯恩（1988）追问崇高为何陷入废弃，并提出：尽管哲学家忽视了它，它也许仍与当代经验相关。对前一问题的理解，因晚近的历史研究而推进：一方面研究崇高话语在现代旅游语境中的衰落（例如 Colley 2010）[^colley-2010]，另一方面研究它在登山等更极端追求中的延续（Macfarlane 2003; Hollis 2019）[^hollis-2019][^macfarlane-2003]。
    step2: |-
      崇高概念同样重获生机。在几篇奠基性的讨论中，Guy Sircello（1993）与罗纳德·赫伯恩（1988）都追问崇高何以被弃置不用，并提出：尽管哲学家不再理会它，它或许仍与当代经验相干。前一问题上的认识，得益于晚近两项史学研究：一是崇高话语在现代旅游背景下的衰落（如 Colley 2010）[^colley-2010]，二是它在登山这类更极端的活动中延续下来（Macfarlane 2003; Hollis 2019）[^hollis-2019][^macfarlane-2003]。
