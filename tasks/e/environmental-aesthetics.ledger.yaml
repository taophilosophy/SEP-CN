      The study of nature aesthetics was ultimately rejuvenated in the 1960s after a sense of environmental crisis took hold of popular consciousness, leading to the emergence of the modern environmental movement. One important practical development was the passage of protective environmental legislation in the US and UK. Since some of these laws made reference to “natural beauty” or “aesthetic values”, clarifying these notions and determining how to measure them became matters of practical, rather than merely philosophical, importance. This led to the development of empirical methods for “visual landscape quality assessment” (VLQA) and to attempts to provide a theoretical framework for their use (on the origin of VLQA see Zube, Sell, & Taylor 1982; for recent overviews of the field see Daniel 2001; C. Thompson & Tarvlou 2009)[^daniel-2001][^thompson-2009][^zube-1982]. The latter included appeals to ideas in developmental and environmental psychology (Kaplan & Kaplan 1989; Bourassa 1991)[^bourassa-1991][^kaplan-1989] as well as evolutionary psychology (Appleton 1975a, 1982; Orians 1986; Orians & Heerwagen 1992)[^appleton-1975a][^appleton-1982][^orians-1986][^orians-1992], an approach that has attracted much philosophical attention (Davies 2012; Paden, Harmon, & Milling 2012; Bartalesi & Portera 2015; Paden 2015a, 2016)[^bartalesi-2015][^davies-2012][^paden-2015a][^paden-2016][^paden-2012].
    step1: |-
      自然美学研究最终在 20 世纪 60 年代复兴，此前环境危机感抓住了公众意识，导致现代环境运动兴起。一个重要实践发展是美国与英国通过保护性环境立法。由于其中一些法律提到“自然美”或“审美价值”，澄清这些概念并确定如何测量它们，成为具有实践意义而非仅哲学意义的事情。这导致“视觉景观质量评估”（VLQA）经验方法的发展，以及为其使用提供理论框架的尝试（VLQA 的起源见 Zube, Sell, & Taylor 1982; 该领域近期综述见 Daniel 2001; C. Thompson & Tarvlou 2009）[^daniel-2001][^thompson-2009][^zube-1982]。后者包括诉诸发展与环境心理学（Kaplan & Kaplan 1989; Bourassa 1991）[^bourassa-1991][^kaplan-1989]以及进化心理学（Appleton 1975a, 1982; Orians 1986; Orians & Heerwagen 1992）[^appleton-1975a][^appleton-1982][^orians-1986][^orians-1992]的观念；这一进路吸引了大量哲学关注（Davies 2012; Paden, Harmon, & Milling 2012; Bartalesi & Portera 2015; Paden 2015a, 2016）[^bartalesi-2015][^davies-2012][^paden-2015a][^paden-2016][^paden-2012]。
