      As is clear from early collections of essays in environmental aesthetics (e.g., Kemal & Gaskell 1993; Carlson & Berleant 2004)[^berleant-2004][^carlson-2004][^kemal-1993], the field initially concentrated on natural environments. However, discussion quickly extended to humanized and human-influenced environments (see von Bonsdorff & Haapala 1999; Berleant & Carlson 2007; Arntzen & Brady 2008)[^arntzen-2008][^berleant-2007][^carlson-2007][^bonsdorff-1999]. Here too the views of Carlson and Berleant were influential. From early on, Berleant applied his aesthetics of engagement to urban environments (Berleant 1978, 1984, 1986)[^berleant-1978][^berleant-1984][^berleant-1986], later extending it to differing contexts such as rural countrysides, small towns, theme parks, gardens, and museums (1997, 2004, 2005, 2010b, 2012). Rejecting the common treatment of city aesthetics as mere visual amenity, Berleant instead portrays it as involving an intimate engagement producing a “mutual fashioning of person and place” (Berleant 1986)[^berleant-1986]. Subsequent researchers have drawn on Berleant’s ideas in exploring the experience of urban and other humanly shaped environments (see, e.g., Haapala 1998; von Bonsdorff 2002; Blanc 2013; Paetzold 2013; Łukaszewicz Alvarez 2017)[^blanc-2013][^haapala-1998][^alvarez-2017][^paetzold-2013][^bonsdorff-2002].
    step1: |-
      从环境美学的早期论文集（如 Kemal & Gaskell 1993; Carlson & Berleant 2004）[^berleant-2004][^carlson-2004][^kemal-1993]可以清楚看出，该领域最初集中于自然环境。然而讨论很快扩展到人化与受人类影响的环境（见 von Bonsdorff & Haapala 1999; Berleant & Carlson 2007; Arntzen & Brady 2008）[^arntzen-2008][^berleant-2007][^carlson-2007][^bonsdorff-1999]。在这里，Carlson 与 Berleant 的观点同样有影响力。Berleant 从一开始就把其介入美学应用于城市环境（Berleant 1978, 1984, 1986）[^berleant-1978][^berleant-1984][^berleant-1986]，后来扩展到乡村、小镇、主题公园、花园与博物馆等不同语境（1997, 2004, 2005, 2010b, 2012）。他拒绝把城市美学仅当作视觉舒适性的常见做法，而把它描绘为涉及一种产生“人与地方的相互塑造”的亲密介入（Berleant 1986）[^berleant-1986]。后续研究者借鉴 Berleant 的观念，探索城市及其他人类塑造环境的经验（例如见 Haapala 1998; von Bonsdorff 2002; Blanc 2013; Paetzold 2013; Łukaszewicz Alvarez 2017）[^blanc-2013][^haapala-1998][^alvarez-2017][^paetzold-2013][^bonsdorff-2002]。
