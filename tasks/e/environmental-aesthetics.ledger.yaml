      然而，在这些事件中扮演核心角色——尽管充满争议——的是审美价值（Hargrove 1979）[^hargrove-1979]。黄石的保护以及最终以其为样板建立国家公园体系，其首要动力并非热爱荒野，也不是生态保护的目标，而是保存美国最壮观风景的愿望。这一目标既是民族主义的——让年轻的共和国得以宣示其对欧洲的“视觉优越”，也是商业性的——借助新兴铁路发展休闲与风景旅游，前景诱人（Runte 2022）[^runte-2022]。黄石与约塞米蒂常常被以明确类比艺术的方式称为“大自然的杰作”，莫兰（Moran）、希尔（Hill）与比尔斯塔特（Bierstadt）等画家对西部风景的再现，帮助把西部景观转译为欧洲如画的视觉语汇（Conron 2000; Wilton & Barringer 2002）[^conron-2000][^wilton-2002]。随着国家公园体系在二十世纪成形，如画又演变为新的形态：吉尔平的速写本、克劳德镜与登山靴，变成了袖珍相机、汽车与路旁观景点——唐纳德·克劳福德（Donald Crawford）把这种游客套路称为“明信片式”（postcardesque）（Crawford 2004）[^crawford-2004]。事实上，“风景旅游”范式——十八世纪如画的遗产——不仅推动了公园体系的发展，还支配了公园管理思路约一个世纪之久（Sellars 1997）[^sellars-1997]。
