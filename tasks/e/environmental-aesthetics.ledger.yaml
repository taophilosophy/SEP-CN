      Some see here not only an aesthetic, but a moral error. One view, for instance, holds that finding beauty in the environmental damage brought about by our negligent practices represents a tacit approval and encouragement of those very practices (Foster 1992)[^foster-1992]. An alternative position, in contrast, is that such appreciation is morally innocuous and may in fact make us *more* responsive to environmental issues (Alcaraz León 2011; Brady 2014b, 2022)[^alcaraz-2011][^brady-2014b][^brady-2022]. This debate grapples with an issue—how our aesthetic attitudes might shape future treatment of our environment—that is as difficult as it is important, entangling us not only in philosophy but also with still unsettled matters of empirical psychology and environmental science. As is characteristic of the questions posed by environmental aesthetics, a shift from the familiar experience of art to our responses to the wider world around us at once complicates the theoretical issues and vastly raises the stakes.
    step1: |-
      一些人在这里看到的不仅是审美错误，还有道德错误。例如，一种观点认为，在我们疏忽实践造成环境损害中发现美，代表对那些实践的默然认可与鼓励（Foster 1992）[^foster-1992]。相反，另一种立场认为，这种欣赏在道德上无害，事实上可能使我们 **更** 回应环境问题（Alcaraz León 2011; Brady 2014b, 2022）[^alcaraz-2011][^brady-2014b][^brady-2022]。这场争论所处理的问题——我们的审美态度如何塑造未来对环境的对待——既困难又重要，不仅把我们卷入哲学，也卷入经验心理学与环境科学尚未解决的议题。正如环境美学所提问题的典型特征，从熟悉的艺术经验转向我们周围更广阔世界的反应，既复杂化了理论问题，也极大提高了赌注。
