      自然美学在十八世纪开花之后走向衰落。围绕如画与崇高形成的狂热渐渐平息，这些观念沦为陈词滥调，最终彼此混融。态度的变化鲜明地体现在对阿尔卑斯山的看法上：十九世纪初，阿尔卑斯山令拜伦与雪莱这样的浪漫主义诗人满怀崇高之感；到该世纪下半叶，游客们却在成群结队参加套餐游、涌入夏蒙尼之类瑞士市镇的观光客中间，发现这种感受已难寻觅（Colley 2010）[^colley-2010]。在哲学中，康德那位颇有影响的继承人黑格尔把艺术连同宗教与哲学视为“绝对精神”的重要体现，并认为哲学美学的宠儿是艺术而非自然。十九世纪，无论在欧洲大陆还是在英国，都只有相当少的哲学家、以及浪漫主义运动中零星的几位思想家，认真从事自然美学的理论研究。
    step2: |-
      自然美学在十八世纪盛极一时，随后便衰落下去。依附于如画与崇高的那种近乎狂热的兴致逐渐消退，这些观念沦为俗套，最后彼此混淆难分。阿尔卑斯山所引发的态度变迁就是生动的例证：十九世纪初，拜伦、雪莱一类浪漫主义诗人面对它满怀崇高之感；到了该世纪后半叶，游客在夏蒙尼等瑞士市镇随着旅行团蜂拥而至，那种感受反倒成了难以寻觅的猎物（Colley 2010）[^colley-2010]。哲学方面，康德那位影响深远的后继者黑格尔把艺术与宗教、哲学并列为“绝对精神”的重要体现，并且认为哲学美学所偏爱的主题是艺术而不是自然。在十九世纪，欧洲大陆与英国都只有寥寥可数的哲学家，加上浪漫主义运动中的零星几人，真正下功夫对自然美学作理论研究。
