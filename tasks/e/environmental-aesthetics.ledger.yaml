      On the whole, subsequent work in environmental aesthetics has accepted the possibility that nature and the environment in general can be aesthetically appreciated and has sought to understand such appreciation. The result has been the mapping of a wide range of possibilities concerning what the appreciation of nature involves, how it ought to be cultivated, and what it implies about our treatment of, and relationship to, nature and the environment. Nevertheless, the thought that environmental appreciation remains in some way subordinate to, or conceptually dependent upon, the appreciation of art has persisted as a lingering, if rarely explicit, theme (for a sophisticated version of the “art-first” thesis, see Gaut 2007: 34–41)[^gaut-2007].
    step1: |-
      总体而言，此后环境美学的工作接受了自然与环境一般可被审美欣赏的可能性，并试图理解这种欣赏。其结果描绘出一系列可能性：自然欣赏涉及什么、应如何培养、以及它对我们对待自然与环境的方式和关系意味着什么。尽管如此，认为环境欣赏仍从属于艺术欣赏或在概念上依赖艺术欣赏的想法，仍作为挥之不去却少被明说的主题持续存在（对“艺术优先”论题的精细版本，见 Gaut 2007: 34–41）[^gaut-2007]。
