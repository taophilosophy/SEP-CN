      This ecological perspective brought thinkers like Muir to see the whole of the natural environment, and especially wild nature, as beautiful and to find ugliness primarily where nature was subject to human intrusion. The range of things that Muir regarded as aesthetically valuable seemed to encompass the entire natural world, from creatures considered hideous in his day, such as snakes and alligators, to natural disasters thought to ruin the environment, such as floods, fires, and earthquakes. This view, which has come to be known as “positive aesthetics”, eschews humanity’s marks on the natural environment. As such, it represents a sort of converse of the Picturesque, which found interest and delight in evidence of human presence (Carlson 1984a)[^carlson-1984a].
    step1: |-
      这种生态视角使缪尔这样的思想家把整个自然环境——尤其是野性自然——视为美的，并把丑主要定位于自然遭受人类侵入之处。缪尔认为具有审美价值的东西，其范围似乎涵盖整个自然世界：从当时被视为丑陋的生物，如蛇与短吻鳄，到被认为会毁坏环境的自然灾害，如洪水、火灾与地震。这种观点后来被称为“肯定美学”，它回避人类在自然环境上留下的痕迹。就此而言，它可以说是如画的反面——如画恰恰在人类在场的证据中发现趣味与愉悦（Carlson 1984a）[^carlson-1984a]。
