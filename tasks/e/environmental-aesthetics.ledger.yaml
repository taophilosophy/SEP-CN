      Kant’s writings ignored the picturesque, but of the three aesthetic concepts listed above, it was arguably the one that ultimately left the greatest legacy. In its initial use, the term “picturesque” seems to have simply meant “painterly”, as in “the sort of landscape painted by artists”. But the term took on added resonance in light of the close connections that came to be established between art and the appreciation of landscape in the late seventeenth century. The British aristocrats who reshaped their estates around picturesque ideals sought not only varied and irregular landscapes, but a *view* that in essence replicated the single-point perspective of a Lorrain canvas. Thus in practice the term “picturesque” often meant “picture-like”, and picturesque appreciation typically equated the experience of a landscape with the experience of a set of views, rather as if it were a set of large, out of doors paintings. This involved assessing the view’s “subject matter”, “composition”, “balance”, and so on. Thus, although philosophical theorists of the picturesque, such as Uvedale Price (1796), took a more nuanced view (see section 4.3 below), in practice the popular ideal of the Picturesque often equated nature and the environment, from an aesthetic point of view, with scenery. This ideal provided the paradigm for the nascent industry of scenic tourism, as travelers pursued picturesque views in the Lake District, the Scottish Highlands, and the Wye valley with the help of guidebooks by popular authors such as William Gilpin (for a history of the Picturesque movement in Britain see Andrews 1989; for an analysis of its key philosophical texts see Costelloe 2013)[^andrews-1989][^costelloe-2013].
    step1: |-
      康德的著作忽略了如画，但在上述三个审美概念中，如画可以说是最终留下最大遗产的一个。“如画的”一词最初似乎只是“画意的”，意即“画家所画的那类风景”。但随着十七世纪晚期艺术与风景欣赏之间建立起紧密联系，这个词又获得了额外的共鸣。那些按如画理想改造庄园的英国贵族，寻求的不仅是多变而不规则的景致，更是一种本质上复制了洛兰画布单点透视的*view*（景观视野）。于是在实践中，“如画的”常常意味着“像画一样”，而如画的欣赏通常把对一片风景的经验等同于对一组视野的经验，仿佛那是一组巨大的户外绘画。这就要求评判该视野的“题材”“构图”“平衡”等等。因此，尽管如画的哲学理论家如乌弗代尔·普赖斯（Uvedale Price，1796）持有更为细致的看法（见下文第 4.3 节），实践中流行的如画理想却常常从审美观点把自然与环境等同于风景。这一理想为新兴的风景旅游业提供了范式：旅行者依据威廉·吉尔平（William Gilpin）等通俗作者的导游书，在湖区、苏格兰高地与怀伊河谷追寻如画的视野（关于英国如画运动的历史见 Andrews 1989；关于其关键哲学文献的分析见 Costelloe 2013）[^andrews-1989][^costelloe-2013]。
    step2: |-
      康德未曾理会如画；可是在上述三个审美概念里，如画大概要算遗产最丰厚的一个。“如画的”起初似乎只等于“画意的”，即“画家画出来的那类风景”。然而，十七世纪后期艺术与风景欣赏之间结成的紧密关系，赋予这个词额外的意味。依照如画理想改造庄园的英国贵族，要的不只是多变而不规则的景致，更是一种*view*（景观视野）——本质上复制洛兰画布那种单点透视的视野。所以，在实践中“如画的”往往就等于“像一幅画”，而如画的欣赏也通常把对风景的体验等同于对一系列视野的体验，仿佛面对的是一批巨幅的露天绘画，须就视野的“题材”“构图”“平衡”等逐项评断。于是，尽管像乌弗代尔·普赖斯（Uvedale Price，1796）这样的如画哲学理论家持论更为细致（见下文第 4.3 节），流行于实践的如画理想仍往往从审美角度把自然与环境等同于风景。这一理想为方兴未艾的风景旅游业立下了范式：游客带着威廉·吉尔平（William Gilpin）等通俗作家的导游书，到湖区、苏格兰高地与怀伊河谷去寻觅如画的视野（英国如画运动史见 Andrews 1989；其重要哲学文本的分析见 Costelloe 2013）[^andrews-1989][^costelloe-2013]。
