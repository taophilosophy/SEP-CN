      Even admitting these as relevant to ugliness, Parsons (2023b)[^parsons-2023b] questions whether Brady’s particular counterexamples would refute the positive aesthetics claim, given that aesthetically positive features (the Aye-Aye’s adaptedness, the toad’s beguiling eyes, for example) also merit consideration. Setting aside this dispute about vertebrates, the most promising candidates for ugly species are surely to be found among those of our relatives that seem most alien to us: the insects. Here again, however, the key issue is how we should relate the instinctive (and presumably adaptive) fear and repulsion triggered by “creepy crawlies” to the notion of aesthetic appreciation.
