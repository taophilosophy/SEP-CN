      A fourth area of recent interest is the aesthetic appreciation and value of non-human animals. (Hettinger 2010; Davies 2012)[^davies-2012][^hettinger-2010] As mentioned in section 3.2 above, aesthetic considerations sometimes play a role in debates over the protection of species and their habitats. Empirical research confirms the intuitive thought that a species’ perceived attractiveness is an important factor in its garnering public support for protection (see, e.g., Landová et al. 2018; Richardson 2019)[^landová-2018][^richardson-2019]. Cuteness, of course, constitutes one of the central elements of this perceived attractiveness (Lorenz 1950 [1971]; Morreall 1991; Sanders 1992)[^lorenz-1950][^morreall-1991][^sanders-1992].
    step1: |-
      第四个晚近关注的领域是非人动物的审美欣赏与价值。（Hettinger 2010; Davies 2012）[^davies-2012][^hettinger-2010]如上文第 3.2 节所述，审美考虑有时在关于物种及其栖息地保护的争论中起作用。经验研究证实了一个直觉想法：一个物种被感知到的吸引力，是它赢得公众保护支持的重要因素（例如见 Landová et al. 2018; Richardson 2019）[^landová-2018][^richardson-2019]。可爱当然是这种被感知吸引力的核心要素之一（Lorenz 1950 [1971]; Morreall 1991; Sanders 1992）[^lorenz-1950][^morreall-1991][^sanders-1992]。
    step2: |-
      近期受到关注的第四个领域，是非人动物的审美欣赏与审美价值（Hettinger 2010; Davies 2012）[^davies-2012][^hettinger-2010]。如前面第 3.2 节所说，审美考虑有时会参与关于物种及其栖息地保护的争论。实证研究证实了一个直觉判断：一个物种在人们眼中的吸引力，是它争取到公众支持保护的重要因素（例如见 Landová et al. 2018; Richardson 2019）[^landová-2018][^richardson-2019]。而所谓吸引力，核心成分之一当然是可爱（Lorenz 1950 [1971]; Morreall 1991; Sanders 1992）[^lorenz-1950][^morreall-1991][^sanders-1992]。
