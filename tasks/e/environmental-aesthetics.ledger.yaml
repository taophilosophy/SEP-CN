      In response to this view, Hettinger argues that even if amoral, animal suffering caused by predation remains something bad, a form of disvalue that colors our aesthetic experience of the animal world. But he suggests that predation’s negative aspects must be considered alongside the essential evolutionary and ecological role it plays in the development of life on earth. Balancing these conflicting aspects of predation, he sees in it a kind of beauty, albeit a “a sad beauty, perhaps even a terrible one” (Hettinger 2010)[^hettinger-2010].
    step1: |-
      针对这一观点，Hettinger 论证说，即便捕食是无道德的，捕食造成的动物受苦仍是某种恶，是一种为我们的动物世界审美经验染上色彩的负价值。但他建议，必须把捕食的负面面相与其在地球生命演化中所起的本质生态作用放在一起考虑。在这两个冲突面相之间权衡之后，他在捕食中看到了一种美，尽管是“一种悲哀的美，也许还是可怕的美”（Hettinger 2010）[^hettinger-2010]。
    step2: |-
      Hettinger 针对这一看法回应道：就算捕食无所谓道德与否，它所造成动物之苦仍是一桩坏事，是一种负价值，会给我们对动物世界的审美经验着色。但他主张，必须把捕食的阴暗面同它在地球生命演化与生态运转中不可缺少的角色一并放在天平上。在这两种彼此冲突的面向之间权衡之后，他竟在捕食中看出一种美——尽管如他所言，“一种悲哀的美，甚至可能是可怕的美”（Hettinger 2010）[^hettinger-2010]。
