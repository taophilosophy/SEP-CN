      One issue arises when this notion is used to ground the preservation of *natural* environments specifically, since in some contexts measures that preserve the beauty of an environment may arguably also render it something that is no longer natural (Godlovitch 1989; K. Lee 1995)[^godlovitch-1989][^lee-1995]. A longstanding national park policy, for instance, was to protect park forests from the devastation of naturally occurring wildfire; in this case, one might question whether the beauty retained could quite be called “natural”. In other contexts, Aesthetic Protectionism may appear self-defeating for a different reason: for remote and ecologically fragile areas, focusing protection efforts around aesthetic considerations may actually put the area further at risk of degradation by attracting increased sight-seeing traffic (Parsons 2015b; Tenen 2020)[^parsons-2015b][^tenen-2020]. Further, if aesthetic value is appraised through some version of the still-popular “scenic aesthetic”, the upshot of Aesthetic Protectionism is apt to be highly selective protection of those areas and species considered “nature’s masterpieces”: spectacular mountains and “charismatic megafauna” like the polar bear and panda. Less impressive specimens—wetlands, prairie, insects, and rodents—will be left out, even though their ecological significance may in fact be much greater (Saito 1998a, Rolston 2000, Callicott 2003; Hettinger 2010)[^callicott-2003][^hettinger-2010][^rolston-2000][^saito-1998a]. A related concern is the way in which aesthetic considerations can provide an equally ready tool for those *opposing* environmentally beneficial policies, such as wind farming (Saito 2004; for further discussion of this case see Boone 2005, Gray 2012)[^boone-2005][^gray-2012][^saito-2004]. Such concerns might lead one to the skeptical conclusion that aesthetic value actually conflicts with the aims of environmentalism or is, at best, too superficial to ground policies of action on matters of environmental protection (Loftis 2003; Stewart & Johnson 2018; for further discussion of the philosophical issues involved see Doran 2022)[^doran-2022][^loftis-2003][^stewart-2018].
    step1: |-
      当这一观念被用来专门为 **自然** 环境的保存奠基时，会出现一个问题：在某些语境中，保护环境之美的措施可能也会使它不再自然（Godlovitch 1989; K. Lee 1995）[^godlovitch-1989][^lee-1995]。例如，一项长期的国家公园政策是保护公园森林免受自然野火的毁灭；在此情形中，人们可能质疑所保留的美是否还能被称为“自然的”。在其他语境中，审美保护主义可能因另一理由显得自挫：对偏远且生态脆弱的地区，围绕审美考量集中保护努力，实际上可能因吸引更多观光人流而使该地区进一步面临退化风险（Parsons 2015b; Tenen 2020）[^parsons-2015b][^tenen-2020]。此外，若审美价值通过仍很流行的“风景美学”某种版本来评价，审美保护主义的结果往往是高度选择性地保护那些被视为“自然杰作”的地区与物种：壮观的山脉以及北极熊、熊猫等“有魅力的巨型动物”。不那么引人注目的样本——湿地、草原、昆虫与啮齿动物——会被遗漏，尽管它们的生态意义事实上可能大得多（Saito 1998a, Rolston 2000, Callicott 2003; Hettinger 2010）[^callicott-2003][^hettinger-2010][^rolston-2000][^saito-1998a]。一个相关关切是，审美考量同样可以轻易成为 **反对** 环境有益政策（如风力发电）的工具（Saito 2004; 关于此案例的进一步讨论见 Boone 2005, Gray 2012）[^boone-2005][^gray-2012][^saito-2004]。这些关切可能使人得出怀疑论结论：审美价值实际上与环境主义目标冲突，或至多过于肤浅，不足以支撑环境保护行动政策（Loftis 2003; Stewart & Johnson 2018; 相关哲学问题的进一步讨论见 Doran 2022）[^doran-2022][^loftis-2003][^stewart-2018]。
