      More recently the label “ecological aesthetics” has also been adopted by some philosophers working in the so-called “Continental tradition” (Toadvine 2009)[^toadvine-2009]. Drawing on figures such as Husserl, Heidegger, and Merleau-Ponty, this perspective overlaps in some ways with Berleant’s aesthetics of engagement, which in turn was influenced by ideas from Phenomenology (see Berleant 1985, 2013a)[^berleant-1985]. In this work, the label “ecological” is connected to the philosophical claim that organisms cannot be distinguished from their environment, except through an abstraction that distorts the ontologically primary reality of their embodied experience (for related Continentalist perspectives, see Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019)[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011].
    step1: |-
      更晚近些，“生态美学”这一标签也为一些在所谓“欧陆传统”中工作的哲学家所采用（Toadvine 2009）[^toadvine-2009]。这一视角借重胡塞尔、海德格尔与梅洛-庞蒂等人物，在某些方面与伯林特的介入美学重叠，而后者又受到现象学观念的影响（见 Berleant 1985, 2013a）[^berleant-1985]。在这项工作中，“生态的”这一标签与一个哲学主张相连：有机体不能与其环境分离，除非通过一种抽象，而这种抽象扭曲了它们具身经验在存在论上的原初实在（相关欧陆视角见 Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019）[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011]。
    step2: |-
      更晚一些，“生态美学”这个名号也被一些属于所谓“欧陆传统”的哲学家拿去使用（Toadvine 2009）[^toadvine-2009]。这条路径倚重胡塞尔、海德格尔、梅洛-庞蒂等人，在某些方面与伯林特的介入美学相叠合——伯林特本人也受过现象学观念的影响（见 Berleant 1985, 2013a）[^berleant-1985]。在这类著作中，“生态的”一名系于这样一个哲学主张：有机体与其环境无法分开，除非借助一种抽象，而那种抽象恰恰扭曲了它们具身经验在存在论上的原初实在（相关欧陆视角见 Tafalla 2011; Leddy 2012a; Maskit 2014; Seel 2015; Jóhannesdóttir 2016; Greaves 2019）[^greaves-2019][^jóhannesdóttir-2016][^leddy-2012a][^maskit-2014][^seel-2015][^tafalla-2011]。
