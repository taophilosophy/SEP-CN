  - id: 8
    kind: body
    source: |-
      The eighteenth century was a period of unprecedented expansion in both the scope of appreciation of the environment and its theoretical articulation. Prior to this time, the environment had of course figured in various kinds of art. The rural landscape was a conventional setting for the Pastoral tradition in poetry, and painters had always rendered landscapes as part of their work. In these artistic traditions, however, landscape played a subsidiary role, typically serving as a backdrop for exploration of historical, religious, and moral themes. An early break with this relegation came in the work of seventeenth century painters such as Lorrain, Rosa, and Dughet, who brought landscape to the fore, positioning it as an interesting artistic subject in its own right (Clark 1949)[^clark-1949]. The works of Lorrain, in particular, exerted a powerful pull on the British imagination and fueled a craze in landscaping and gardening, as aristocrats sought to cultivate Lorrain’s dreamy pastoral on their own estates. By the early nineteenth century, nature’s wilder side also took on a new allure as Europeans, warming to Romantic conceptions of nature, found an edgy fascination in the Alps, a landscape that had previously been regarded with various combinations of revulsion and fear.
    step1: |-
      十八世纪是一个在环境欣赏的范围与理论表述两方面都空前扩张的时期。在此之前，环境当然已经在各类艺术中出现。乡村风景是诗歌中牧歌传统的惯常场景，画家也一向把风景绘制纳入其作品。然而在这些艺术传统中，风景只扮演辅助角色，通常作为探究历史、宗教与道德主题的背景。对这种贬置的早期突破，出现在洛兰（Lorrain）、罗萨（Rosa）与迪盖（Dughet）等十七世纪画家的作品中：他们把风景推到前台，使之本身成为引人入胜的艺术题材（Clark 1949）[^clark-1949]。尤其是洛兰的作品，对英国人的想象施加了强大的牵引力，并激发了一场造园与园艺的热潮，贵族们纷纷在自己的庄园里培植洛兰式的梦幻田园。到十九世纪初，自然更为野性的一面也获得了新的魅力：欧洲人逐渐亲近浪漫主义的自然观念，在阿尔卑斯山那里发现了一种刺激的迷恋——而在之前，这片风景一直接受着厌恶与恐惧的各种混合目光。
    step2: |-
      十八世纪，环境的欣赏范围与相关理论表述都经历了空前的扩张。在此之前，环境当然早已进入各类艺术。乡村风景是诗歌牧歌传统的惯常场景，画家也历来把风景纳入自己的作品。不过，在这些艺术传统中，风景只居于辅助地位，通常充当探索历史、宗教与道德主题的背景。十七世纪的洛兰（Lorrain）、罗萨（Rosa）、迪盖（Dughet）等画家较早打破了这种贬抑：他们把风景提到前台，使其作为引人入胜的题材而自成一格（Clark 1949）[^clark-1949]。其中洛兰的作品对英国人的想象影响尤大，掀起了一股造园与园艺的热潮，贵族们竞相在自家庄园里营造洛兰笔下的梦幻田园。到十九世纪初，大自然更野性的一面又添新魅：欧洲人亲近浪漫主义的自然观，在阿尔卑斯山那里体会到一种近乎刺激的迷恋，而此前这片山地得到的目光，往往是厌恶与恐惧的种种混合。
  - id: 9
    kind: body
    source: |-
      Philosophers of this period attempted to map and understand these changes in Taste. In an important conceptual shift, eighteenth century philosophers pushed the traditional concept of the beautiful away from its classical associations with love, possession, and desire, emphasizing instead its *disinterested* character. This meant that a thing’s beauty was to be appraised apart from the appreciator’s particular personal, religious, economic, or utilitarian interests (a classic historical overview is Stolnitz 1961; for a recent reappraisal of the role of distinterestedness during the eighteenth century, see Guyer 2003, 2014)[^guyer-2003][^stolnitz-1961] . However, the classical connotations of “beauty”—including not only love, but also order, proportion, and harmony—were sufficiently persistent to render it ill-suited for describing the new attractions listed above. Thus eighteenth-century writers reached for alternative vocabularies. Surroundings like those shown in Lorrain’s canvasses—subtly varied, irregular, delicate, and “fair” in color—came to be described as “picturesque” (Andrews 1989)[^andrews-1989]. Alpine peaks, in contrast, were understood in terms of the sublime, a concept that had been used in ancient rhetoric to describe the sort of expression accompanying great minds and powerful thoughts (Monk 1935; Nicholson 1959)[^monk-1935]. Into the category of the sublime fell instances of the powerful, vast, intense, terrifying, and formless: storms, great voids, powerful waterfalls, and the like. Thus by century’s end there existed a triad of what were later recognized to be “aesthetic concepts”—the beautiful, the sublime, and the picturesque—each focusing on a contrasting aspect of nature’s perceptible character.
    step1: |-
      这一时期的哲学家试图描绘并理解趣味上的这些变化。在一次重要的概念转变中，十八世纪哲学家把传统的“美”概念从它与爱、占有和欲望的古典关联中推开，转而强调其*disinterested*（无利害）的品格。这意味着，一事物的美应当离开欣赏者个人在宗教、经济或功利方面的特定兴趣来评价（经典的历史概述见 Stolnitz 1961；关于十八世纪无利害性作用的近期重估，见 Guyer 2003, 2014）[^guyer-2003][^stolnitz-1961]。然而，“美”的古典意涵——不仅包括爱，还包括秩序、比例与和谐——足够持久，使它不适合用来描述上述新的吸引物。于是十八世纪的作者转而寻求别的词汇。洛兰画布上那样的周遭景致——微妙多变、不规则、精致，色调“明媚”——被描述为“如画的”（picturesque）（Andrews 1989）[^andrews-1989]。与之相对，阿尔卑斯山峰则被理解为崇高（sublime），这一概念在古代修辞学中曾用来描述伴随伟大心灵与强大思想的那种表达（Monk 1935; Nicholson 1959）[^monk-1935]。归入崇高范畴的，是那些有力、浩大、强烈、可怖而无形式的东西：风暴、巨大的虚空、磅礴的瀑布之类。于是到该世纪末，便形成了后来被认作“审美概念”的三元组——美、崇高与如画——各自着眼于自然可感品格中一个彼此对照的方面。
    step2: |-
      这一时期的哲学家力图把握并理解趣味上的种种变化。十八世纪哲学家的一个关键概念举措，是把传统的“美”从它与爱、占有、欲望的古典联想中剥离出来，转而强调其*disinterested*（无利害）的特征。照此理解，评价一物之美，须撇开欣赏者自身在个人、宗教、经济或功利上的特殊利益（经典的历史梳理见 Stolnitz 1961；对十八世纪无利害性之作用的近期重新评价，见 Guyer 2003, 2014）[^guyer-2003][^stolnitz-1961]。可是，“美”的古典涵义——爱之外，还有秩序、比例、和谐——实在过于根深蒂固，用它来描述上述新的吸引对象并不合适。十八世纪的作者于是另觅词汇。像洛兰画布上那样的景致——细腻多变、不守规矩、纤巧，颜色“明丽”——被称作“如画的”（picturesque）（Andrews 1989）[^andrews-1989]。阿尔卑斯山峰则被纳入崇高（sublime）来理解：这个概念曾见于古代修辞学，用以描述伴随伟大心灵与雄强思想的那种表达（Monk 1935; Nicholson 1959）[^monk-1935]。凡是强有力、浩大、激烈、令人惊惧而又无形的东西，都被归入崇高一类：风暴、巨壑、奔腾的瀑布，等等。到该世纪末，便形成了后来所谓的“审美概念”三元组——美、崇高、如画——三者各自把握自然可感性格中一个对照性的侧面。
  - id: 10
    kind: body
    source: |-
      Philosophical treatises of the period by figures such as Shaftesbury, Hutcheson, Burke, and Alison analyzed these concepts and related them to one another, frequently discussing the appreciation of nature and landscape. Particularly influential was the account given by Kant in his *Critique of the Power of Judgement* (1790), in which nature was taken to be the exemplary object of aesthetic experience. Kant’s analysis of the idea of disinterestedness led him to emphasize the role of formal elements in the beauty of nature: a flower’s beauty is a matter of its shape and has nothing to do with its biological role in plant reproduction, or even its color. Alongside this account of beauty, Kant also offered a sophisticated analysis of the sublime that distinguished the experience of powerful natural objects (which he called the “dynamical sublime”) from the experience of vastness (the “mathematical sublime”). Despite the formalist bent of his account, Kant gave priority to natural beauty over that of art and argued that the experience of natural beauty and sublimity had a deep moral significance.
    step1: |-
      这一时期的哲学论著——如沙夫茨伯里（Shaftesbury）、哈奇森（Hutcheson）、伯克（Burke）与艾利森（Alison）等人的作品——分析了这些概念，并把它们相互关联起来，其中常常讨论对自然与风景的欣赏。尤其有影响的是康德在《判断力批判》（*Critique of the Power of Judgement*，1790）中给出的论述，他把自然视为审美经验的典范对象。康德对无利害性观念的分析，使他强调形式要素在自然美中的作用：一朵花的美在于其形状，与它在植物繁殖中的生物学作用无关，甚至与其颜色也无关。在美的论述之外，康德还对崇高作了精细的分析，把对有力自然对象的经验（他称之为“力学的崇高”）与对浩大无垠的经验（“数学的崇高”）区分开来。尽管其论述有形式主义倾向，康德仍把自然美置于艺术美之上，并主张对自然美与崇高的经验具有深刻的道德意义。
    step2: |-
      这一时期的哲学论著分析了上述概念并说明其相互关系，作者包括沙夫茨伯里（Shaftesbury）、哈奇森（Hutcheson）、伯克（Burke）、艾利森（Alison）等人，行文中常常论及对自然与风景的欣赏。影响最大的当属康德《判断力批判》（*Critique of the Power of Judgement*，1790）中的论述：他把自然看作审美经验的典范对象。康德对无利害性的分析，使他特别看重形式要素在自然美中的位置——一朵花之所以美，关乎它的形状，而同它在植物繁殖中的生物学功能无关，甚至同它的颜色也无关。除美的学说之外，康德对崇高也有细密的分析，把对强有力的自然对象的经验（他名为“力学的崇高”）同对浩大无垠的经验（“数学的崇高”）区别开来。尽管带有形式主义的倾向，康德仍然让自然美高于艺术美，并论证对自然美与崇高的经验含有深刻的道德意蕴。
