      Some see here not only an aesthetic, but a moral error. One view, for instance, holds that finding beauty in the environmental damage brought about by our negligent practices represents a tacit approval and encouragement of those very practices (Foster 1992)[^foster-1992]. An alternative position, in contrast, is that such appreciation is morally innocuous and may in fact make us *more* responsive to environmental issues (Alcaraz León 2011; Brady 2014b, 2022)[^alcaraz-2011][^brady-2014b]. This debate grapples with an issue—how our aesthetic attitudes might shape future treatment of our environment—that is as difficult as it is important, entangling us not only in philosophy but also with still unsettled matters of empirical psychology and environmental science. As is characteristic of the questions posed by environmental aesthetics, a shift from the familiar experience of art to our responses to the wider world around us at once complicates the theoretical issues and vastly raises the stakes.
    step1: |-
      一些人认为这里不仅是审美错误，也是道德错误。例如一种观点主张，在我们疏忽大意所造成的环境破坏中发现美，代表对那种做法的默认鼓励（Foster 1992）[^foster-1992]。相反的一种立场则是，这样的欣赏在道德上并无害处，甚至可能使我们*more*（更）关注环境议题（Alcaraz León 2011; Brady 2014b, 2022）[^alcaraz-2011][^brady-2014b]。这场争论所面对的问题——我们的审美态度可能如何塑造对未来环境的对待——既困难又重要，它不仅把我们卷入哲学，还牵涉经验心理学与环境科学中尚无定论的问题。正如环境美学所提出的问题的 characteristic：从熟悉的艺术经验转向我们对周围更广阔世界的反应，既使理论问题复杂化，又极大地提高了利害关系。
    step2: |-
      在一些人看来，这里错的不仅是审美，还有道德。比如一种意见认为，从我们的疏忽所酿成的环境破坏中发现美，等于对这些做法的默认与打气（Foster 1992）[^foster-1992]。另一派的看法恰恰相反：这样的欣赏在道德上无害，甚至可能使我们*more*（更加）对环境议题作出回应（Alcaraz León 2011; Brady 2014b, 2022）[^alcaraz-2011][^brady-2014b]。这场争论所啃的硬骨头是：我们的审美态度会怎样塑造今后对待环境的方式——问题既难又要紧，它不但把我们牵进哲学，还牵扯经验心理学与环境科学中远未有定论的部分。环境美学提出的问题向来如此：一旦从烂熟的艺术经验转向我们对身周更大世界的反应，理论难题便随之复杂，赌注也随之剧增。
