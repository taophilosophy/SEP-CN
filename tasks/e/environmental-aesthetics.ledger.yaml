      Philosophers of this period attempted to map and understand these changes in Taste. In an important conceptual shift, eighteenth century philosophers pushed the traditional concept of the beautiful away from its classical associations with love, possession, and desire, emphasizing instead its *disinterested* character. This meant that a thing’s beauty was to be appraised apart from the appreciator’s particular personal, religious, economic, or utilitarian interests (a classic historical overview is Stolnitz 1961; for a recent reappraisal of the role of distinterestedness during the eighteenth century, see Guyer 2003, 2014)[^guyer-2003][^guyer-2014][^stolnitz-1961] . However, the classical connotations of “beauty”—including not only love, but also order, proportion, and harmony—were sufficiently persistent to render it ill-suited for describing the new attractions listed above. Thus eighteenth-century writers reached for alternative vocabularies. Surroundings like those shown in Lorrain’s canvasses—subtly varied, irregular, delicate, and “fair” in color—came to be described as “picturesque” (Andrews 1989)[^andrews-1989]. Alpine peaks, in contrast, were understood in terms of the sublime, a concept that had been used in ancient rhetoric to describe the sort of expression accompanying great minds and powerful thoughts (Monk 1935; Nicholson 1959)[^monk-1935]. Into the category of the sublime fell instances of the powerful, vast, intense, terrifying, and formless: storms, great voids, powerful waterfalls, and the like. Thus by century’s end there existed a triad of what were later recognized to be “aesthetic concepts”—the beautiful, the sublime, and the picturesque—each focusing on a contrasting aspect of nature’s perceptible character.
    step1: |-
      这一时期的哲学家试图描绘并理解趣味中的这些变化。在一次重要的概念转变中，18 世纪哲学家把传统的“美”概念从与爱、占有和欲望的古典关联中推开，转而强调其 **无利害** 特征。这意味着，事物的美应脱离欣赏者特定的个人、宗教、经济或功利兴趣来评价（经典历史综述见 Stolnitz 1961; 对 18 世纪无利害性角色的近期重估，见 Guyer 2003, 2014）[^guyer-2003][^guyer-2014][^stolnitz-1961]。“美”的古典内涵——不仅包括爱，还包括秩序、比例与和谐——足够顽固，使它不适合描述上述新吸引力。于是 18 世纪作家转而寻求替代词汇。像 Lorrain 画布中那样的环境——微妙变化、不规则、精致，色彩“fair”——被描述为“如画”（Andrews 1989）[^andrews-1989]。相比之下，阿尔卑斯山峰则通过崇高来理解；这一概念曾在古代修辞学中用来描述伴随伟大心灵与有力思想的表现（Monk 1935; Nicholson 1959）[^monk-1935]。强大、广袤、强烈、恐怖与无形的事物落入崇高范畴：风暴、巨大虚空、有力瀑布等。到该世纪末，已出现后来被认作“审美概念”的三元组——美、崇高与如画——各自聚焦自然可感特征的一个对比面向。
