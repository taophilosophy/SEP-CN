      While these views aimed to extend accepted ideas about art appreciation to nature, Arnold Berleant’s approach was based instead on a radical rejection of many traditional ideas about aesthetic appreciation. According to his “aesthetics of engagement”, disinterested appreciation, with its isolating, distancing, and objectifying gaze, is out of place in the aesthetic experience of nature, wrongly abstracting both natural objects and appreciators from the environments in which they properly belong and in which appropriate appreciation is achieved. Instead, the aesthetics of engagement stresses the contextual dimensions of nature and our multi-sensory experiences of it. Viewing the environment as a seamless unity of places, organisms, and perceptions, it challenges the importance of traditional dichotomies, such as that between subject and object. It beckons appreciators to immerse themselves in the natural environment and to reduce to as small a degree as possible the distance between themselves and the natural world. In short, appropriate aesthetic experience involves the total immersion of the appreciator in the object of appreciation (Berleant 1985, 1988, 1992, 2013b; for critical discussion see Carlson 1993, Budd 2002)[^berleant-1985][^berleant-1988][^berleant-1992][^berleant-2013b][^budd-2002][^carlson-1993]. Like Carlson’s NEM, Berleant’s approach was taken up by later writers (on the reception of Berleant’s views, see the essays in Łukaszewicz Alvarez 2017 and Gladden-Obidzińska 2021)[^gladden-obidzińska-2021][^alvarez-2017].
    step1: |-
      尽管这些观点旨在把关于艺术欣赏的既定观念延伸到自然，Arnold Berleant 的进路却基于对许多传统审美欣赏观念的激进拒绝。按其“介入美学”，无利害欣赏及其孤立、疏离与对象化的凝视，在自然的审美经验中不合时宜，错误地把自然对象与欣赏者从他们本属的、恰当欣赏得以实现的环境中抽象出来。相反，介入美学强调自然的语境维度以及我们对自然的多感官经验。它把环境视为地点、有机体与知觉的无缝统一，挑战主体与客体等传统二分的重要性。它召唤欣赏者沉浸于自然环境，尽可能缩小自身与自然世界之间的距离。简言之，恰当的审美经验涉及欣赏者完全沉浸于欣赏对象之中（Berleant 1985, 1988, 1992, 2013b; 批判讨论见 Carlson 1993, Budd 2002）[^berleant-1985][^berleant-1988][^berleant-1992][^berleant-2013b][^budd-2002][^carlson-1993]。与 Carlson 的 NEM 一样，Berleant 的进路也被后来作者采纳（关于 Berleant 观点的接受，见 Łukaszewicz Alvarez 2017 与 Gladden-Obidzińska 2021 中的论文）[^gladden-obidzińska-2021][^alvarez-2017]。
