      Welchman’s analysis helpfully situates discussions of aesthetics and environmental protection in a broader political context. Such contexts, however, are often not as idealized as her argument suggests. As mentioned above, environmental legislation does sometimes make reference to aesthetic considerations, but often in ways that are far removed from theoretical considerations of basic goods and distributive justice. Levi Tenen has documented the important role played in US environmental protection by the “National Monuments” designation created in the 1906 Antiquities Act (Tenen 2023)[^tenen-2023]. Strictly speaking, declaring a forest or a mesa a “monument” makes little sense; moreover, it arbitrarily imposes, at least tacitly, an existing aesthetic framework (that relevant to memorial statuary) upon the natural entity being protected. Yet, for contingent historical reasons having to do with the balance of powers in the US government, monument designation emerged as an important way in which aesthetically motivated environmental protection unfolds in practice. Understanding the limits and possibilities of aesthetic protection will require further investigation of the legal institutions of environmental policy and the ways in which aesthetic values are embedded in them (see especially Richardson 2019; but also Saito 2007; Berleant 2010b, 2012; Sepänmaa 2010; Robinson & Elliott 2011)[^berleant-2010b][^richardson-2019][^robinson-2011][^saito-2007][^sepänmaa-2010].
    step1: |-
      Welchman 的分析有助于把美学与环境保护的讨论置于更广阔的政治语境中。然而，这类语境往往并不像她的论证所设想的那样理想化。如上所述，环境立法确实有时会提到审美考虑，但往往其方式与关于基本善和分配正义的理论考虑相去甚远。Levi Tenen 记录了 1906 年《文物法》所创设的“国家纪念地”指定在美国环境保护中所扮演的重要角色（Tenen 2023）[^tenen-2023]。严格说来，把一片森林或一座台地宣布为“纪念物”并没有多少道理；此外，它至少默认地把一套既有的审美框架（与纪念性雕塑相关的框架）任意地强加于受保护的自然实体之上。然而，由于与美国政府权力平衡相关的偶然历史原因，纪念地指定成为审美动机的环境保护在实践中展开的重要方式。要理解审美保护的限度与可能性，需要进一步考察环境政策的法制机构，以及审美价值嵌入其中的方式（尤其见 Richardson 2019；另见 Saito 2007; Berleant 2010b, 2012; Sepänmaa 2010; Robinson & Elliott 2011）[^berleant-2010b][^richardson-2019][^robinson-2011][^saito-2007][^sepänmaa-2010]。
    step2: |-
      Welchman 的分析有个好处：它把美学与环境保护的讨论放进了更宽的政治脉络。只是这类脉络往往不像她设想的那般理想。前面说过，环境立法有时确实会援引审美考虑，但援引的方式常常离基本善、分配正义之类的理论考量很远。Levi Tenen 就梳理过 1906 年《文物法》所设“国家纪念地”制度在美国环境保护中所起的重要作用（Tenen 2023）[^tenen-2023]。严格讲，把一片森林或一座台地宣告为“纪念物”并不怎么讲得通；而且这种做法至少暗中把一套现成的审美框架（与纪念性雕像相干的框架）硬套在受保护的自然对象上。然而，由于美国政府权力格局方面的一些偶然历史缘由，纪念地指定反倒成了审美动机的环境保护在实际中推进的重要途径。要想弄清审美保护的边界与可能，就得进一步研究环境政策的法制机构，以及审美价值嵌入其中的方式（尤见 Richardson 2019；另见 Saito 2007; Berleant 2010b, 2012; Sepänmaa 2010; Robinson & Elliott 2011）[^berleant-2010b][^richardson-2019][^robinson-2011][^saito-2007][^sepänmaa-2010]。
