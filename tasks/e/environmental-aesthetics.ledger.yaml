      In an aside, Hepburn attributed the decline in philosophical interest in the aesthetics of nature, in part, to a degradation of our experience of nature itself, referring to the “forced ecstasies and hypocrisies of a fashionable and trivialized nature-cult” (1966: 286). Hepburn’s swipe at the standardized “scenic aesthetic” of motorized tourism was an oblique one, but Allen Carlson developed this theme into an explicit analysis and critique (Carlson 1977, 1979)[^carlson-1977]. The foundation of the “scenic aesthetic”, Carlson argued, was what he called “the landscape model” of nature appreciation, which proposes appreciating nature more or less as we appreciate landscape paintings. This requires treating the environment as if it were a series of two-dimensional scenes and focusing either on artistic qualities dependent upon romantic images of the kind associated with the idea of the picturesque or simply on its formal aesthetic qualities. Carlson further argued that the VLQA techniques used to measure aesthetic value for the purposes of environmental management were in fact premised on this model and were therefore inadequate (Carlson 1977; see also Sagoff 1974)[^carlson-1977][^sagoff-1974]. Carlson’s critique of VLQA methodology connected directly to debates within the field itself over the supposed lack of an adequate conceptual framework to support empirical work, or what one critic called the field’s “theoretical vacuum” (Appleton 1975b; see also Sparshott 1972, Ribe 1982, Carlson 1984b)[^appleton-1975b][^carlson-1984b][^ribe-1982][^sparshott-1972]. Despite this overlap, philosophical and empirical debates concerning nature’s aesthetic value have largely continued to play out independently (though see the discussion of “ecological aesthetics” in section 4.1, below).
    step1: |-
      在一处旁注中，赫伯恩把哲学界对自然美学兴趣的衰退，部分归因于我们对自然本身经验的退化，他提到“时髦而庸俗化的自然崇拜之强迫性狂喜与虚伪”（1966: 286）。赫伯恩对机动化旅游那种标准化“风景美学”的抨击是间接的，但艾伦·卡尔森把这一主题发展为明确的分析与批判（Carlson 1977, 1979）[^carlson-1977]。卡尔森论证说，“风景美学”的基础是他所谓的自然欣赏“景观模式”，该模式主张多少像欣赏风景画那样去欣赏自然。这要求把环境当作一系列二维场景，并专注于依附于浪漫意象的艺术品质（那类意象与如画观念相关），或者干脆专注于其形式审美品质。卡尔森进一步论证，用于为环境管理测量审美价值的 VLQA 技术，实际上正是以此模式为前提，因而并不充分（Carlson 1977；另见 Sagoff 1974）[^carlson-1977][^sagoff-1974]。卡尔森对 VLQA 方法论的批判，与该领域内部关于缺乏足够概念框架以支撑经验研究的争论直接相关，或者用一位批评者的话说，与该领域的“理论真空”相关（Appleton 1975b；另见 Sparshott 1972, Ribe 1982, Carlson 1984b）[^appleton-1975b][^carlson-1984b][^ribe-1982][^sparshott-1972]。尽管有这种重叠，关于自然审美价值的哲学争论与经验争论，大体上仍各自独立地展开（不过可参看下文第 4.1 节关于“生态美学”的讨论）。
    step2: |-
      赫伯恩在一处顺带的评论里说，哲学界对自然美学的兴趣之所以衰退，部分原因在于我们对自然本身的体验退化了，他称之为“时髦而庸俗的自然崇拜所强作的狂喜与虚伪”（1966: 286）。赫伯恩对机动化旅游所推行的标准化“风景美学”只是旁敲侧击，艾伦·卡尔森则把这一话题展开为明确的分析与批判（Carlson 1977, 1979）[^carlson-1977]。卡尔森认为，“风景美学”的根基是他所称的自然欣赏的“景观模式”，即大体上照着欣赏风景画的路子去欣赏自然。这样一来，环境被当成一连串二维景面，人们要么专注于那些依附于浪漫意象（与如画观念相联系）的艺术品质，要么干脆只盯着它的形式审美品质。卡尔森还指出，环境管理用来测量审美价值的 VLQA 技术，实际上正以此模式为前提，因此并不充分（Carlson 1977；另见 Sagoff 1974）[^carlson-1977][^sagoff-1974]。卡尔森对 VLQA 方法论的批评，与该领域内部的一场争论直接相连：有人认为它缺乏足以支撑实证研究的概念框架，用一位批评者的话说，这个领域存在“理论真空”（Appleton 1975b；另见 Sparshott 1972, Ribe 1982, Carlson 1984b）[^appleton-1975b][^carlson-1984b][^ribe-1982][^sparshott-1972]。尽管两边的议题相互交叠，关于自然审美价值的哲学讨论与实证讨论，大体上仍旧各行其道（不过可参见下文第 4.1 节论“生态美学”的部分）。
