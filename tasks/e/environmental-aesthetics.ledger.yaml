      While these views aimed to extend accepted ideas about art appreciation to nature, Arnold Berleant’s approach was based instead on a radical rejection of many traditional ideas about aesthetic appreciation. According to his “aesthetics of engagement”, disinterested appreciation, with its isolating, distancing, and objectifying gaze, is out of place in the aesthetic experience of nature, wrongly abstracting both natural objects and appreciators from the environments in which they properly belong and in which appropriate appreciation is achieved. Instead, the aesthetics of engagement stresses the contextual dimensions of nature and our multi-sensory experiences of it. Viewing the environment as a seamless unity of places, organisms, and perceptions, it challenges the importance of traditional dichotomies, such as that between subject and object. It beckons appreciators to immerse themselves in the natural environment and to reduce to as small a degree as possible the distance between themselves and the natural world. In short, appropriate aesthetic experience involves the total immersion of the appreciator in the object of appreciation (Berleant 1985, 1988, 1992, 2013b; for critical discussion see Carlson 1993, Budd 2002)[^berleant-1985][^budd-2002][^carlson-1993]. Like Carlson’s NEM, Berleant’s approach was taken up by later writers (on the reception of Berleant’s views, see the essays in Łukaszewicz Alvarez 2017 and Gladden-Obidzińska 2021)[^gladden-obidzińska-2021][^alvarez-2017].
    step1: |-
      与这些旨在把公认的艺术欣赏观念推广到自然的观点不同，阿诺德·伯林特（Arnold Berleant）的进路立足于对许多传统审美欣赏观念的激进拒斥。按照他的“介入美学”，无利害的欣赏连同其孤立、疏离与对象化的凝视，在自然的审美经验中是错置的：它错误地把自然对象与欣赏者从其本来所属、并在其中达成恰当欣赏的环境中抽象出来。相反，介入美学强调自然的语境维度以及我们对自然的多感官经验。它把环境视为场所、有机体与知觉的无缝统一体，从而挑战主体与客体之类传统二分的重要性。它召唤欣赏者沉浸于自然环境之中，尽可能缩小自身与自然世界之间的距离。简言之，恰当的审美经验要求欣赏者完全沉浸于欣赏对象之中（Berleant 1985, 1988, 1992, 2013b；批判性讨论见 Carlson 1993, Budd 2002）[^berleant-1985][^budd-2002][^carlson-1993]。与卡尔森的 NEM 一样，伯林特的进路也为后来的作者所采纳（关于伯林特观点的接受，见 Łukaszewicz Alvarez 2017 与 Gladden-Obidzińska 2021 中的论文）[^gladden-obidzińska-2021][^alvarez-2017]。
    step2: |-
      上述观点是想把既有的艺术欣赏观念延伸到自然，阿诺德·伯林特（Arnold Berleant）的进路却恰恰相反：它以对传统审美欣赏观念的大幅否弃为起点。他的“介入美学”认为，无利害的欣赏带着那种孤立、拉开距离、把对象客体化的凝视，在自然的审美经验里并不合宜——它把自然对象与欣赏者一并从他们本来所属、也唯有在其中才能恰当欣赏的环境里抽离出来。介入美学转而突出自然的语境性，以及我们对自然的多种感官经验。它把环境看成场所、有机体与知觉的连续统一体，因而质疑主体与客体这类传统二分是否还那么要紧。它要求欣赏者投身于自然环境，尽可能缩小自己与自然世界之间的间隔。简言之，恰当的审美经验意味着欣赏者完全沉浸到欣赏对象中去（Berleant 1985, 1988, 1992, 2013b；批评性讨论见 Carlson 1993, Budd 2002）[^berleant-1985][^budd-2002][^carlson-1993]。同卡尔森的 NEM 一样，伯林特的路向也被后来的学者接了过去（关于伯林特观点的接受情况，见 Łukaszewicz Alvarez 2017 与 Gladden-Obidzińska 2021 所收论文）[^gladden-obidzińska-2021][^alvarez-2017]。
