      A wider form of globalization, however, would look beyond the major global cultures (the Western and Chinese, e.g.) and their variants to the world’s many small scale “traditional” cultures. An understanding of this broader diversity in aesthetics need not be solely of anthropological interest. Nanda Jarosz, for instance, argues that philosophical theories in environmental aesthetics should consider not only scientific knowledge, but also the role of indigenous and local knowledge in aesthetic appreciation of the environment (Jarosz 2023)[^jarosz-2023]. The challenge for such projects, however, is to connect the European/North American ideas of “the aesthetic”, which remain the touchstone of much contemporary philosophizing, to sets of ideas, values and practices from very different cultural contexts.
    step1: |-
      然而，更广泛的全球化形式会超越主要全球文化（如西方与中国）及其变体，看向世界上众多小规模“传统”文化。理解这种更广泛的审美多样性不必只具人类学趣味。例如，Nanda Jarosz 主张，环境美学的哲学理论不仅应考虑科学知识，还应考虑原住民与地方知识在环境审美欣赏中的作用（Jarosz 2023）[^jarosz-2023]。然而此类项目的挑战在于，把仍是许多当代哲学化试金石的欧洲／北美“审美”观念，与来自非常不同文化语境的思想、价值与实践集合连接起来。
