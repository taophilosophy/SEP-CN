      Of all humanized environments, however, the one with the most profound resonance remains, perhaps, the garden. Biblical narratives around the “Garden of Eden” and the role of gardens in Islamic art offer familiar illustrations of the garden’s hold on the imagination. Another example is the ancient poetry of Theocritus and Virgil, which established the literary convention of the pastoral, in which shepherds loll in fruit-laden groves and sing love songs as they follow their flocks across a tamed, carefree landscape. Though the literary conventions of the pastoral had grown stale by the eighteenth century, its fantasy of escape from corrupt urban life into bucolic nature found new life in a passion for gardening and landscape design, fueled in part by the Picturesque (Ross 1998)[^ross-1998]. Recent philosophical discussions have considered the meaning and aesthetics of contemporary gardening in general (Crawford 1983; Miller 1993; Cooper 2006; Salwa 2014, 2019; Parsons 2023b)[^cooper-2006][^crawford-1983][^miller-1993][^parsons-2023b][^salwa-2014][^salwa-2019], as well as the nature of specific types of gardens, such as Japanese (Saito 1996; Carlson 1997; Heyd 2002; Brady, Brook, & Prior 2018; Chung 2018)[^brady-2018][^brady-2018-2][^carlson-1997][^chung-2018][^heyd-2002][^saito-1996] and botanical gardens (Heyd 2006)[^heyd-2006], and the relation of contemporary gardens to the Arts (Leddy 1988; Ross 2006)[^leddy-1988][^ross-2006]. Philosophers have also discussed the related topics of the rural landscape and the agricultural environment, with an eye to the moral and environmental ramifications of the shift away from small-scale agriculture to industrialized farming (on the rural landscape see von Bonsdorff 2005; Andrews 2007; Benson 2008; Brook 2008; Leddy 2008; on agriculture see Carlson 1985; Schauman 1998; Brady 2006; Herguedas 2018)[^andrews-2007][^benson-2008][^brady-2006][^brook-2008][^carlson-1985][^herguedas-2018][^leddy-2008][^schauman-1998][^bonsdorff-2005].
    step1: |-
      然而在所有人类化环境中，最能引起深刻共鸣的也许仍是花园。《创世记》中“伊甸园”的圣经叙事，以及花园在伊斯兰艺术中的角色，是花园占据想象力的熟悉例证。另一个例子是 Theocritus 与 Virgil 的古代诗歌，它们确立了田园的文学惯例：牧羊人在果实累累的树林中闲卧，随羊群穿过驯化而无忧的景观，唱着情歌。尽管田园的文学惯例到 18 世纪已陈旧，其从腐化城市生活逃入田园自然的幻想，在园艺与景观设计热情中获得新生，部分由如画推动（Ross 1998）[^ross-1998]。近期哲学讨论考察了一般当代园艺的意义与美学（Crawford 1983; Miller 1993; Cooper 2006; Salwa 2014, 2019; Parsons 2023b）[^cooper-2006][^crawford-1983][^miller-1993][^parsons-2023b][^salwa-2014][^salwa-2019]，以及特定类型花园的性质，如日本庭园（Saito 1996; Carlson 1997; Heyd 2002; Brady, Brook, & Prior 2018; Chung 2018）[^brady-2018][^brady-2018-2][^carlson-1997][^chung-2018][^heyd-2002][^saito-1996]与植物园（Heyd 2006）[^heyd-2006]，还有当代花园与艺术的关系（Leddy 1988; Ross 2006）[^leddy-1988][^ross-2006]。哲学家也讨论了乡村景观与农业环境的相关主题，关注从小规模农业转向工业化耕作的道德与环境后果（关于乡村景观见 von Bonsdorff 2005; Andrews 2007; Benson 2008; Brook 2008; Leddy 2008; 关于农业见 Carlson 1985; Schauman 1998; Brady 2006; Herguedas 2018）[^andrews-2007][^benson-2008][^brady-2006][^brook-2008][^carlson-1985][^herguedas-2018][^leddy-2008][^schauman-1998][^bonsdorff-2005]。
