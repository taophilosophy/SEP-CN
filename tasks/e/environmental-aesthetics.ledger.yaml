      The call for renewed philosophical attention to the sublime has been taken up by philosophers such as Emily Brady, who surveys early philosophical discussions of the concept and defends a broadly Kantian view of the sublime, on which it blends “aesthetic self-reflection with admiration that is externally directed” (Brady 2013: 118; for discussion see Mahoney 2016)[^brady-2013][^mahoney-2016]. Also reanalyzing the classical theories of the eighteenth-century, Sandra Shapshay attempts to reconcile the approaches of Kant and Edmund Burke in a “two-tiered” theory by distinguishing between a “thick” and “thin” sublime. The Burkean “thin sublime” is an unreflective, awe-like response whereas the thick involves reflection, a la Kant, on the challenge posed to our cognitive capacities by the sublime object (2013, 2019, 2021). Shapshay argues that this distinction allows an explanation of the cross-cultural occurrence of sublime experience, as well as its cultural variation and historical evolution.
    step1: |-
      要求重新给予崇高哲学关注的呼吁，得到 Emily Brady 等哲学家响应；她梳理该概念的早期哲学讨论，并捍卫一种宽泛康德式崇高观，其中崇高融合“审美自我反思与向外指向的钦佩”（Brady 2013: 118; 讨论见 Mahoney 2016）[^brady-2013][^mahoney-2016]。Sandra Shapshay 也重新分析 18 世纪古典理论，试图通过区分“厚”与“薄”崇高，在“两层”理论中调和康德与 Edmund Burke 的进路。Burke 式“薄崇高”是未经反思的敬畏式反应，而厚崇高则如康德那样涉及对我们认知能力所受挑战的反思（2013, 2019, 2021）。Shapshay 主张，这一区分可解释崇高经验的跨文化出现及其文化变异与历史演化。
