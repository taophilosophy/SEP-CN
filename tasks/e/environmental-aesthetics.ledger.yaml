      Meanwhile, however, a different perspective was taking shape across the Atlantic. North American pioneers had viewed the “wilderness” landscape that greeted them with a mixture of fear and hostility and saw its conquest as their main priority (Nash 2001)[^nash-2001]. But by the mid nineteenth-century Americans were confronted with a landscape that, within living memory, had gone from “forest primeval” to a frontier swiftly receding under the advance of industry and colonization. Scientific figures such George Perkins Marsh (Marsh 1865)[^marsh-1865] raised concerns that the continued destruction of American wilderness would have disastrous consequences on critical resources such as forest watersheds. Philosophers such as Emerson and Thoreau put forth the novel view that wilderness had a crucial spiritual value that demanded its protection. The shift in attitudes toward wilderness ultimately took form in the US government’s designation of the first protected areas in Yosemite and Yellowstone in the late 1800s (Nash 2001)[^nash-2001].
    step1: |-
      然而与此同时，大西洋彼岸正在形成另一种视角。北美拓荒者曾以恐惧与敌意的混合看待迎接他们的“荒野”景观，并把征服它视为首要任务（Nash 2001）[^nash-2001]。但到 19 世纪中叶，美国人面对的是这样一个景观：在活着的人记忆里，它已从“原始森林”变为在工业与殖民推进下迅速后退的边疆。George Perkins Marsh（Marsh 1865）[^marsh-1865] 等科学人物担忧，持续破坏美国荒野将对森林流域等关键资源造成灾难性后果。Emerson 与 Thoreau 等哲学家提出新观点：荒野具有关键的精神价值，因而需要保护。对荒野态度的转变最终体现为美国政府在 19 世纪末把 Yosemite 与 Yellowstone 划为首批保护区（Nash 2001）[^nash-2001]。
