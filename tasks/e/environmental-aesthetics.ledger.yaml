      A number of different approaches to articulating and defending the idea of positive aesthetics have been taken. Allen Carlson argues that because scientific understanding brings order, regularity, and pattern to natural phenomena, environments viewed in light of such understanding, as per the NEM, will appear aesthetically good (Carlson 1984a; see also Parsons 2002)[^carlson-1984a][^parsons-2002][^parsons-2002-2]. Yuriko Saito argues that everything in a natural environment takes on aesthetic interest when made the focus of a story, whether scientific, cultural, or mythological, that illuminates and explains its origins (Saito 1998a)[^saito-1998a]. Another approach traces the lack of aesthetic failure in natural environments to the absence of normative functions in inorganic systems (Parsons 2004; Parsons & Carlson 2008; for discussion see Zangwill 2005a)[^carlson-2008][^parsons-2004][^parsons-2008][^parsons-2004-2][^parsons-2008-2][^zangwill-2005a]. Holmes Rolston offers a holistic explanation by way of the larger ecological role played by individual elements of an environment. Though a dead animal carcass or a forest burned by natural wildfire may appear ugly when considered in isolation, this ugliness is ameliorated once these elements are considered in their wider context (Rolston 1988; Hettinger 2017a)[^hettinger-2017a][^rolston-1988].
    step1: |-
      人们采取多种不同进路来阐述与捍卫肯定美学。Allen Carlson 主张，由于科学理解给自然现象带来秩序、规律与模式，依据这种理解（如 NEM 所要求）看待的环境会显得审美上良好（Carlson 1984a; 亦见 Parsons 2002）[^carlson-1984a][^parsons-2002][^parsons-2002-2]。斋藤百合子主张，自然环境中的一切，当成为照亮并解释其起源的叙事（无论科学、文化还是神话）焦点时，都会获得审美趣味（Saito 1998a）[^saito-1998a]。另一进路把自然环境中审美失败的缺失追溯到无机系统缺乏规范功能（Parsons 2004; Parsons & Carlson 2008; 讨论见 Zangwill 2005a）[^carlson-2008][^parsons-2004][^parsons-2008][^parsons-2004-2][^parsons-2008-2][^zangwill-2005a]。Holmes Rolston 通过环境中个别要素所起的更大生态作用提供整体论解释。尽管动物尸体或被自然野火烧毁的森林孤立看可能显得丑，但一旦把这些要素放入更广阔语境，这种丑便得到缓解（Rolston 1988; Hettinger 2017a）[^hettinger-2017a][^rolston-1988]。
