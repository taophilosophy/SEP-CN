      A similar array of aesthetic, ontological, and ethical issues are raised by restored environments. If a polluted wetland is restored to look (and perhaps function) much as it did before it was damaged by industry, is it thereby aesthetically equivalent to the original? Is the idea of nature restoration conceptually coherent, or does “restoring” nature simply turn it into an artifact? (Elliot 1997; Ross 2006; Katz 2012)[^elliot-1997][^katz-2012][^ross-2006] Should restoration be guided purely by ecological concerns, or do aesthetic considerations also have a role? (Heyd 2002; Brady, Brook, & Prior 2018)[^brady-2018][^brady-2018-2][^heyd-2002]. A recent twist on restoration is the idea of “rewilding”: simply leaving an area free from future human intervention so that natural forces can reassert themselves, rather than actively engineering the environment to “restore” it to an original state. Prior and Brady (2017) argue that rewilded spaces present new aesthetic possibilities and challenges. This same theme emerges in recent suggestions that anthropogenic climate change is creating unprecedented and unpredictable types of “mixed environments” that may not fit the aesthetic concepts of the past (see section 4.6, below).
    step1: |-
      修复环境也提出一系列类似的审美、本体论与伦理问题。如果一片被污染的湿地经修复后看起来（或许功能上也）很像工业破坏之前的样子，它在审美上是否因此等同于原初？自然修复的观念在概念上是否融贯，还是“修复”自然只是把它变成人工物？（Elliot 1997; Ross 2006; Katz 2012）[^elliot-1997][^katz-2012][^ross-2006] 修复应纯由生态关切引导，还是审美考量也有作用？（Heyd 2002; Brady, Brook, & Prior 2018）[^brady-2018][^brady-2018-2][^heyd-2002]。修复的一个近期变体是“再野化”观念：让一片区域免于未来人类干预，使自然力量重新发挥作用，而不是主动工程化环境以“恢复”原初状态。Prior 与 Brady（2017）主张，再野化空间呈现新的审美可能性与挑战。同一主题也出现在近期建议中：人为气候变化正在创造前所未有的、不可预测的“混合环境”，它们可能不适合过去的审美概念（见下文 4.6 节）。
