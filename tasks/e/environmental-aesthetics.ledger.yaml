      Other writers have looked instead to contemporary psychology to frame new theories of the sublime and related emotions, such as awe. Arcangeli and Dokic, for example, analyze sublime experience in terms of “radical limit experience”, in which awareness of an insurmountable cognitive obstacle triggers a temporary feeling of self-negation (2021; see also Cochrane 2012; McShane 2018; Clewis 2019a)[^clewis-2019a][^cochrane-2012][^mcshane-2018]. Despite their differences, these theories all characterize sublimity as a response to some form of cognitive failure. In contrast, Parsons (2023a) proposes a reinterpretation of the concept in terms of a form of cognitive success—a qualitative increase in perceptual ability which he calls “epistemic expansion”—arguing that so reconstrued, the sublime provides an apt vocabulary for certain aesthetic dimensions of contemporary experimental science.
    step1: |-
      另一些作者转而求诸当代心理学，以框定关于崇高及相关情感（如敬畏）的新理论。例如，Arcangeli 与 Dokic 以“激进极限经验”来分析崇高经验：对一种不可逾越的认知障碍的意识，触发了暂时的自我否定感（2021；另见 Cochrane 2012; McShane 2018; Clewis 2019a）[^clewis-2019a][^cochrane-2012][^mcshane-2018]。尽管存在差异，这些理论都把崇高刻画为对某种认知失败的反应。与之相反，Parsons（2023a）提出以某种认知成功来重新解释这一概念——即他所谓的“认知扩展”，一种知觉能力的质性提升——并论证说，如此重构之后，崇高为当代实验科学的某些审美维度提供了恰当的词汇。
    step2: |-
      还有些作者转向当代心理学，用它来搭建关于崇高及敬畏之类情感的新理论。比如 Arcangeli 与 Dokic 把崇高经验分析为“激进极限经验”：人意识到横着一道无法逾越的认知障碍，于是生出短暂的自我否定之感（2021；另见 Cochrane 2012; McShane 2018; Clewis 2019a）[^clewis-2019a][^cochrane-2012][^mcshane-2018]。这些理论固然互有出入，却都把崇高说成是对某种认知失败的反应。Parsons（2023a）则反其道而行，主张从一种认知成功来重新解释这一概念，即他所说的“认知扩展”——知觉能力在质上的提升；他还论证，经此重构，崇高恰好为当代实验科学的某些审美面向提供了合适的语汇。
