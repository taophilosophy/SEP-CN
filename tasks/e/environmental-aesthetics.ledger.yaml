      Zangwill, for instance, holds that aesthetic appreciation (about inorganic nature at least) must involve only beliefs about perceptual form (2001). Others argue that nature appreciation is constrained only by an awareness that what is appreciated is natural, rather than artifactual (J. Fisher 1998; Budd 2002)[^budd-2002][^fisher-1998], without any deeper scientific understanding being necessary. Yuriko Saito proposes a moral criterion; appreciation is appropriate so long as it makes nature and its origins the center of a narrative that informs our experience of it (1998a; 1998b). Such an attitude has a moral dimension, in Saito’s view, insofar as it expresses a recognition of the autonomous value of that which is appreciated (see also Parsons 2018)[^parsons-2018][^parsons-2018-2]. Hepburn also suggests a quasi-ethical, if also opposed criterion, holding that appreciation is “serious” so long as it engages with nature for the purposes of some kind of substantial exploration of the self, as opposed to “trivial amusement” (Hepburn 1993)[^hepburn-1993]. In developing an account focused on imagination, Emily Brady appeals to the constraining ideal of “imagining well” (1998, 2003). Finally, Robert Stecker suggests a criterion of culpable error in belief: appreciating a whale in the belief that it is a fish counts as an aesthetic mistake, if I could reasonably be expected, as a member of my culture, to know that whales are mammals, not fish (2019).
    step1: |-
      例如，Zangwill 认为审美欣赏（至少就无机自然而言）必须只涉及关于知觉形式的信念（2001）。另一些人主张，自然欣赏仅受“所欣赏者是自然而非人工制品”这一意识的约束（J. Fisher 1998; Budd 2002）[^budd-2002][^fisher-1998]，无须任何更深的科学理解。斋藤百合子（Yuriko Saito）提出一种道德标准：只要欣赏把自然及其起源置于一个为我们的自然经验提供信息的叙事的中心，它就是恰当的（1998a; 1998b）。在斋藤看来，这种态度具有道德维度，因为它表达了对所欣赏之物自主价值的承认（另见 Parsons 2018）[^parsons-2018][^parsons-2018-2]。赫伯恩提出的标准带有准伦理意味，方向却相反：欣赏只要为着对自我作某种实质性的探索而介入自然，而非“琐碎的消遣”，便是“严肃的”（Hepburn 1993）[^hepburn-1993]。在构建一种以想象为中心的说明时，埃米莉·布雷迪（Emily Brady）诉诸“好好地想象”（imagining well）这一约束性理想（1998, 2003）。最后，Robert Stecker 提出一种关于信念之可责错误的判准：若我作为本文化的成员本可合理地期望知道鲸是哺乳动物而非鱼，那么相信鲸是鱼而欣赏它，便算一种审美错误（2019）。
