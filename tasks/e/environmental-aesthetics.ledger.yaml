      Reflection on nature’s beauty prompts the intuitive idea of *Aesthetic Protectionism*: nature should be protected for, amongst other things perhaps, its aesthetic value (see Leopold 1966; Carlson 1976; Godlovitch 1989; Hargrove 1989; Rolston 2002; Hettinger 2008, 2010, 2017b; Robinson & Elliott 2011; Cheng 2017a)[^carlson-1976][^cheng-2017a][^godlovitch-1989][^hargrove-1989][^hettinger-2008][^leopold-1966][^robinson-2011][^rolston-2002]. As mentioned above, this idea was a key motivation behind the National Park idea in North America and it continues to be an effective tool for environmental causes today. Protecting the magnificent polar bear from habitat loss is a powerful argument for restricting human development projects in the north, for example. Moreover, from a philosophical point of view, this idea allows one to ground nature protection, when merely prudential grounds will not suffice, on a familiar and uncontroversial kind of value—aesthetic value (Sober 1986)[^sober-1986]. Despite its initial attractiveness, however, Aesthetic Protectionism faces some important complications and significant objections (Carlson 2010; Hettinger 2017b; Parsons 2023b; for a collection of relevant papers see Carlson & Lintott 2008)[^carlson-2010][^carlson-2008][^hettinger-2017b][^parsons-2023b].
    step1: |-
      对自然美的反思引出一个直觉观念：*Aesthetic Protectionism*（审美保护主义）——自然应当（除其他理由外或许）因其审美价值而受到保护（见 Leopold 1966; Carlson 1976; Godlovitch 1989; Hargrove 1989; Rolston 2002; Hettinger 2008, 2010, 2017b; Robinson & Elliott 2011; Cheng 2017a）[^carlson-1976][^cheng-2017a][^godlovitch-1989][^hargrove-1989][^hettinger-2008][^leopold-1966][^robinson-2011][^rolston-2002]。如上所述，这一观念是北美国家公园理念背后的关键动力，如今仍是环境事业的有效工具。例如，保护壮丽的北极熊免于栖息地丧失，是限制北方人类开发项目的有力论据。此外，从哲学观点看，这一观念使人得以在仅有审慎理由不足时，把自然保护建立在一种熟悉而无争议的价值——审美价值——之上（Sober 1986）[^sober-1986]。然而，尽管最初颇具吸引力，审美保护主义仍面临一些重要纠葛与重大反对（Carlson 2010; Hettinger 2017b; Parsons 2023b；相关论文汇编见 Carlson & Lintott 2008）[^carlson-2010][^carlson-2008][^hettinger-2017b][^parsons-2023b]。
    step2: |-
      对自然之美的思考自然引出一个直观的想法，即*Aesthetic Protectionism*（审美保护主义）：自然应当因其审美价值（或许还因别的价值）而受到保护（见 Leopold 1966; Carlson 1976; Godlovitch 1989; Hargrove 1989; Rolston 2002; Hettinger 2008, 2010, 2017b; Robinson & Elliott 2011; Cheng 2017a）[^carlson-1976][^cheng-2017a][^godlovitch-1989][^hargrove-1989][^hettinger-2008][^leopold-1966][^robinson-2011][^rolston-2002]。如前所述，北美国家公园的构想正以此为主要动力，这一想法至今仍是环境运动的得力工具。举例说，保护壮观的北极熊不致失去栖息地，就是限制北方开发项目的有力理由。而且从哲学上看，在单纯的审慎理由不够用时，这个想法能让我们把自然保护奠基于一种习见而无争议的价值——审美价值（Sober 1986）[^sober-1986]。不过，审美保护主义初看虽吸引人，却也有若干棘手之处，并招致重要的反对意见（Carlson 2010; Hettinger 2017b; Parsons 2023b；相关论文见 Carlson & Lintott 2008 所编文集）[^carlson-2010][^carlson-2008][^hettinger-2017b][^parsons-2023b]。
