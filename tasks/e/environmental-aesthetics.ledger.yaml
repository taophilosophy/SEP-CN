      The functionalist approach to animal beauty suggests an argument for a form of Positive Aesthetics as applied to species, given that all species have form and behavior adapted to their particular environmental niche, for to find a species ugly might seem to require judging its form and behavior as deviant or unfitting (see Sibley 2001b)[^sibley-2001b]. On the other hand, some insist that ugly species exist. Emily Brady argues that many species, such as toads and the Madagascan Aye-Aye lemur, qualify as ugly in virtue of possessing unappealing or disgusting features such as sliminess, being foul smelling, and being oddly proportioned (Brady 2014a)[^brady-2014a]. This issue turns, in part, on how the concept of ugliness is understood; on the traditional account of ugliness as involving deformity, the afore-mentioned qualities, though perhaps disgusting, would not constitute ugliness (Sibley 2001b; for discussion of ugliness, see Sauchelli 2014, Paris 2017)[^paris-2017][^sauchelli-2014][^sibley-2001b].
    step1: |-
      对动物美的功能主义进路暗示了一种应用于物种的肯定美学论证。既然所有物种的形式与行为都适应其特定生态位，把一个物种视为丑似乎就要求判断其形式与行为异常或不合适（见 Sibley 2001b）[^sibley-2001b]。另一方面，一些人坚持丑的物种确实存在。Emily Brady 主张，许多物种，如蟾蜍与马达加斯加指猴，因具有黏滑、恶臭、比例古怪等不吸引人或令人反感的特征而算得上丑（Brady 2014a）[^brady-2014a]。这一问题部分取决于如何理解丑的概念；按传统把丑理解为涉及畸形，上述品质虽可能令人厌恶，却不构成丑（Sibley 2001b; 关于丑的讨论见 Sauchelli 2014, Paris 2017）[^paris-2017][^sauchelli-2014][^sibley-2001b]。
