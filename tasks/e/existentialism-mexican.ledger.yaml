      In other words, the subject of Mexican existentialism—the person that takes responsibility, that commits, that exists in nepantla, that suffers relajo, that deploys irony, and so on—is itself abstract and ideal. Mexican existentialism does not account, according to this critique, for the multiple identities and ethnicities that make up the historical and social space which is Mexico. This is a fair critique and much more can be said about it as well as other critiques levelled against the tradition (Pereda 2006)[^pereda-2006].
    step1: |-
      换句话说，墨西哥存在主义的主体——那个承担责任、作出承诺、在 *nepantla* 中存在、遭受 *relajo*、运用反讽等等的人——本身就是抽象的、理想的。按这一批评，墨西哥存在主义并未说明构成墨西哥这一历史与社会空间的多种身份与族群。这是一条公允的批评；关于它以及针对该传统的其他批评，还有许多可说（Pereda 2006）[^pereda-2006]。
    step2: |-
      换句话说，墨西哥存在主义所说的主体——那个担责的人、承诺的人、在 *nepantla* 中存在的人、受 *relajo* 摆布的人、会玩反讽的人——本身就是个抽象的理想人。按这一批评，墨西哥存在主义说不清构成墨西哥这一历史与社会空间的多元身份与族群。这条批评是公允的；关于它，关于针对这一传统的种种批评，还有不少话可讲（Pereda 2006）[^pereda-2006]。
