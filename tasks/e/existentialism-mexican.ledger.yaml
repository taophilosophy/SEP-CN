      In *The Labyrinth of Solitude*, published in 1951, Octavio Paz (1914–1998)—one of Mexico’s literary icons and a Nobel prize winner—echoes Uranga’s sentiment: “there are two attitudes toward death: one, pointing forward, that conceives of it as creation; the other, pointing backward, that expresses itself as a fascination with nothingness or as a nostalgia for limbo” (1985: 61). Paz goes on to say that the forward-pointing attitude belongs to the peoples of Europe and North America; the backward-pointing attitude to the peoples of Mexico and Latin America. We may call the forward-pointing attitude, the “instrumental attitude”; the backward-pointing attitude may be referred to as the “historical attitude”; the instrumental is Anglo-European, the historical, Mexican (Sánchez 2013)[^sánchez-2013].
