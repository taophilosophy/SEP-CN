      Freedom is intimately involved in the choice between living life as economy, as disinterest, or as charity. One can chose to live life as economy and never care about others, about art, or about the world. But “goodness” itself depends on choosing charity over economy: “a good man sacrifices egoism in favor of helping his fellow man, and such a sacrifice is free.” (Caso 2017: 38)[^caso-2017]. But, again, charity is irrational; no rational calculus can conclude that giving away what one has is good for the self. So existence as charity is both a free act and an irrational choice, since reason is fundamentally egoist. “Life says: do not give what is your own. Reason says: to give is foolish. The good says: give what your egoism asks you to hold on to because reason does not discover your true, deep self, your real, autonomous personality emancipated from biological life” (Caso 1986: 51)[^caso-1986]. Charity is thus a category of existence to which person ought to aspire if they wish to be good. The moral imperative attached to this aspiration is simple: “Go, commit acts of charity!” (Caso 2017: 45)[^caso-2017].
    step1: |-
      自由与在“作为经济、作为无利害或作为爱”之间作选择这件事密不可分。人可以选择以经济的方式生活，从不关心他人、艺术或世界。但“善”本身取决于选择爱德而非经济：“一个善人为帮助同类而牺牲利己主义，而这种牺牲是自由的”（Caso 2017: 38）[^caso-2017]。但话说回来，爱德是不理性的；没有任何理性算计能得出结论说，把自己所有的给出去对自己有好处。因此，作为爱的存在既是自由的行为，又是不理性的选择，因为理性从根本上说是利己的。“生活说：不要给出你自己的东西。理性说：给予是愚蠢的。善说：把你利己主义要求你守住的东西给出去，因为理性发现不了你真正而深层的自我，你那从生物生命中解放出来的、真正自主的人格”（Caso 1986: 51）[^caso-1986]。于是，爱德是人若想成为善人就应当向往的一种存在范畴。与这一向往相系的道德律令很简单：“去吧，行爱德之事！”（Caso 2017: 45）[^caso-2017]。
    step2: |-
      在“作为经济”“作为无利害”“作为爱”这三种活法之间作选择，自由深深卷入其中。人尽可以选经济式的生活，对他人、对艺术、对世界一概不关心。但“善”本身就取决于选择爱德而非经济：“善人为帮助同类而牺牲利己，这种牺牲是自由的”（Caso 2017: 38）[^caso-2017]。可话说回来，爱德不合理性：任何理性盘算都得不出“把自己所有的给出去对自己有好处”的结论。所以，作为爱的存在既是自由的行为，又是不理性的选择，因为理性骨子里是利己的。“生活说：别把自己的东西给出去。理性说：给予是愚蠢的。善说：把你利己之心紧紧攥住的东西给出去吧，因为理性找不到你真正深层的自我，找不到你那从生物生命中解放出来的、真正自主的人格”（Caso 1986: 51）[^caso-1986]。因此，爱德是人想要为善就该向往的一种存在范畴。这一向往所附的道德律令很简单：“去吧，去行爱德！”（Caso 2017: 45）[^caso-2017]。
