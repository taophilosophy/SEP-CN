      According to Mexican existentialists, then, the fear of death is removed with the thought that there’s nothing that I have that death wants. Our co-existence is not transactional, it is marked, rather by togetherness and conviviality. We thus co-live with death in acceptance. Uranga says, “We exist on the edge of death. There is in the life of the Mexican a permanent availability, or resolution, to death” (Uranga 2021: 511)[^uranga-2021]. Again, the focus is not on the forthcomingness of death, on its future, although death is both here and it can always kill me; the focus is, rather, on its presence, or on its persistence in the present (Carrion 1951).
