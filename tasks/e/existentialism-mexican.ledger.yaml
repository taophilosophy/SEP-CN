      Finding oneself in this mood, or in the emotive state of *zozobra*, is not unlike finding oneself overcome with Kierkegaardian anxiety. Unlike Kierkegaardian anxiety, however, zozobra names the specific feeling of sinking and drowning (a going “over and under”), of being overwhelmed and undermined by thoughts of the future; or, what’s the same, it names the feeling of being pulled to pieces by the many possibilities of existence, none of which is presented as valuable or trustworthy. Uranga’s definition of *zozobra* highlights the accompanying feeling of hopelessness: is a “mode of being that incessantly oscillates between two possibilities, between two affects, without knowing on which of these to depend, on which of these to cling to for justification” (1952 [2021: 180]). In this way, Mexican existentialism posits that *zozobra* manifests the *nepantla* nature of Mexican identity, as unsettled, undefined, and accidental, while also free (see also Villoro 1949: 242). But it is a freedom that condemns us to a perpetual disquiet, feeling ourselves standing without “a fixed and solid ground” [*punto fijo y roqueño*], or always on “quicksand on which nothing firm can stand” (Uranga 1952 [2021: 181])[^uranga-1952][^uranga-1952-2].
    step1: |-
      发现自己处在这种心情中、或处在 *zozobra* 的情感状态中，与发现自己被克尔凯郭尔式的焦虑所压倒并无不同。然而，与克尔凯郭尔式焦虑不同的是，zozobra 命名的是那种下沉与淹没（“上上下下”）的特定感受，是被关于未来的念头所压倒、所蛀蚀的感受；或者，同一回事，它命名的是被存在的诸多可能性撕成碎片的感受——这些可能性没有一个被呈现为有价值的或可信赖的。乌兰加对 *zozobra* 的定义突出了与之相随的无望感：它是一种“在两极可能、两种情感之间不停地摆荡的存在方式，不知道应当依靠其中哪一个，应当攀住其中哪一个来求得证成”（1952 [2021: 180]）。这样，墨西哥存在主义提出，*zozobra* 显现了墨西哥身份的 *nepantla* 本性：不安定、未被界定、偶在，但同时也是自由的（另参 Villoro 1949: 242）。但这是一种把我们判给永久不安的自由：觉得自己站在没有“固定而坚实的根基”［*punto fijo y roqueño*］的地方，或永远站在“什么牢固的东西都立不住的流沙”之上（Uranga 1952 [2021: 181]）[^uranga-1952][^uranga-1952-2]。
    step2: |-
      落进这种心情，或者说落进 *zozobra* 的情感状态，与克尔凯郭尔式的焦虑颇为相似。但克尔凯郭尔式的焦虑不是它：zozobra 特指下沉与淹没的感受（“上来又下去”），被关于未来的念头压垮、掏空的感受；换个说法，它指被存在的种种可能撕成碎片的感受——这些可能，没有一个显得可贵或可信。乌兰加给 *zozobra* 下的定义，点出了随之而来的无望感：它是“一种在两极可能、两种情感之间不停摆荡的存在方式，不知道该靠哪一个，该攀住哪一个来求个证成”（1952 [2021: 180]）。于是，墨西哥存在主义主张：*zozobra* 显现了墨西哥身份那种 *nepantla* 本性——不安定、未界定、偶在，同时又自由（另参 Villoro 1949: 242）。可这种自由把我们判给了永无休止的不安：觉得自己脚下没有“固定坚实的根基”［*punto fijo y roqueño*］，或者始终站在“什么牢固东西都立不住的流沙”上（Uranga 1952 [2021: 181]）[^uranga-1952][^uranga-1952-2]。
