      Caso identifies three possible forms of existence: existence as economy, existence as disinterest, and existence as charity. Regarding the first: Caso’s existentialism is situated in the context of Mexico’s anti-positivist movement of the first decades of the 20ᵗʰ century. In fact, Caso’s early texts responds to the positivism of August Comte, Herbert Spencer and the Social Darwinism popularized in Mexico toward the end of the 19ᵗʰ century. According to that tradition, existence is nothing but a “struggle for life,” that is, a struggle for survival and the continuation of the species—this is existence as mere transaction, power, or economy. All that the person does, in this case, is for self-benefit. This is the height of egoism: all accumulation and all excess of vital energy, material wealth, power and so on is re-invested in oneself or accumulated for one’s profit. Other selves are there *for me* and for *my* needs*.* The formula for this way of existing is this: “life=maximum benefit + minimum effort.” According to Caso, existence as economy is the *most* rational way to life.
    step1: |-
      卡索指出存在的三种可能形式：作为经济的存在、作为无利害的存在与作为爱的存在。关于第一种：卡索的存在主义处于 20 世纪最初几十年墨西哥反实证主义运动的语境中。事实上，卡索的早期文本回应的是奥古斯特·孔德、赫伯特·斯宾塞的实证主义，以及 19 世纪末在墨西哥流行的社会达尔文主义。按那一传统，存在不过是一场“生存斗争”，即为生存与物种延续而斗争——这就是作为纯粹交易、权力或经济的存在。在这种情况下，人所做的一切都是为了自身利益。这是利己主义的顶峰：一切积累、一切多余的生命能量、物质财富、权力等等，都被再投资于自身，或为自身利益而囤积。其他自我是*为我*而在、为*我的*需要而在。这种存在方式的公式是：“生活＝最大收益＋最小努力。”按卡索所说，作为经济的存在是生活的*最*合理方式。
