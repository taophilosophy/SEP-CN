      > The accident is fragility: oscillation between being and nothingness. This means that its “fit” in being, its adhesion to being expressed in the modality of being-in, is not protected by an inalienable right, but rather whatever may be the form of its inherence, it is always revocable. The accident is constantly threatened by displacement [*desalojamiento*]. Attached to being, it can always be torn off from its “there,” exterminated. Whatever it holds on to, whatever handle it grabs on to, can be removed. It was born to be-in and at the same time to not-be-in. (Uranga 1952 [2021: 116])[^uranga-1952][^uranga-1952-2]
    step1: |-
      > 偶性即脆弱：在有与无之间摆荡。这意味着，它在存在中的“贴合”、它以“在之中”这一模态对存在的依附，并不受一项不可剥夺的权利的保护；相反，无论其内属的形式为何，它总是可被撤销的。偶性时刻受到错位［*desalojamiento*］的威胁。它依附于存在，却随时可能从其“那里”被撕下、被消灭。它抓住什么、攀住什么把手，都可能被移走。它生来就是要“在之中”，同时又“不在之中”。（Uranga 1952 [2021: 116]）[^uranga-1952][^uranga-1952-2]
    step2: |-
      > 偶性就是脆弱：在有与无之间来回摆荡。也就是说，它在存在中的“贴合”、它以“在之中”的方式对存在的附着，并没有什么不可剥夺的权利来保障；不管它以何种方式内属于存在，这份内属随时可被撤销。偶性时时面临错位［*desalojamiento*］的威胁：它附着于存在，却随时可能从自己的“那里”被撕下来、被消灭。它抓住什么、攀住什么，都可能被夺走。它生来就要“在之中”，同时又要“不在之中”。（Uranga 1952 [2021: 116]）[^uranga-1952][^uranga-1952-2]
