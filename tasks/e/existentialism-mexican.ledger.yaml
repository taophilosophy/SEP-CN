      A key concept in Mexican existentialism is “accidentality.” Accidentality refers to the *being of the accident,* or to the mode of existence belonging to concrete beings lacking in “substantial consistency” (Portilla 1949 [2017: 186])[^portilla-1949]. In the context of this tradition, what is substantially consistent is unaffected by space, time, or circumstance (by “history”); importantly, substantial consistency is central to the Eurocentric ideal of humanity, or the idea of “the human” or “humanity in general” (Uranga 1952 [2021: 107])[^uranga-1952][^uranga-1952-2]. To be an accident in relation to this ideal is thus to be an insufficient, and even dependent, instantiation of that ideal. Accidentality—*insubstantial inconsistency*—is a being “less than” the ideal of humanity and any of the ways this ideal is represented in culture, history, or society.
    step1: |-
      墨西哥存在主义的一个关键概念是“偶在性”。偶在性指*偶性的存在*，或者说，指缺乏“实体性一贯”的具体存在者所拥有的存在方式（Portilla 1949 [2017: 186]）[^portilla-1949]。在这一传统的语境中，具有实体性一贯的东西不受空间、时间或境遇（即“历史”）的影响；重要的是，实体性一贯对欧洲中心的人性理想、即“人”或“一般人性”的观念来说居于核心（Uranga 1952 [2021: 107]）[^uranga-1952][^uranga-1952-2]。因此，相对于这一理想而作为偶性存在，就是作为该理想的一种不充分的、甚至依赖性的实例化。偶在性——*非实体的不一贯*——是一种“低于”人性理想以及该理想在文化、历史或社会中之任何表现的存在。
    step2: |-
      墨西哥存在主义的一个关键概念是“偶在性”。它指的是*偶性的存在*，即缺乏“实体性一贯”的具体存在者所处的存在方式（Portilla 1949 [2017: 186]）[^portilla-1949]。在这一传统里，“实体性一贯”意味着不受空间、时间或境遇（即“历史”）影响；要紧的是，实体性一贯乃是欧洲中心的人性理想——“人”或“一般人性”——的支柱（Uranga 1952 [2021: 107]）[^uranga-1952][^uranga-1952-2]。所以，相对于这个理想而作为偶性存在，就是充当该理想的一种不充分、甚至依赖性的实例。偶在性——*非实体的不一贯*——是一种“低于”人性理想的存在，也低于该理想在文化、历史、社会中的任何表现。
