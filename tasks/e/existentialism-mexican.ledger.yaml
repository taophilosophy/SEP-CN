      To be free is to become aware of my determination in a circumstance and choosing to commit myself to it in responsible ways—in other words, to engage my world. This means that freedom cannot be radical in the sense of a being unconstrained by any obstacle; the circumstance is an obstacle, it stands before us and must be dealt with—the way we deal with it determines us as free (Uranga 1947: 6)[^uranga-1947]. Thus, in freedom I affirm my subjectivity and I do this in responsibility committing myself to my circumstance. For Mexican existentialists, this takes the form of choosing to commit myself to the world *as I find it* and taking responsibility for it (for the sake of “saving” it) precisely because of the state in which I find it.
    step1: |-
      自由就是意识到我在境遇中的被规定性，并选择以负责任的方式献身于它——换句话说，投入我的世界。这意味着自由不能是“不受任何障碍约束的”那种意义上的激进的自由；境遇就是障碍，它立在我们面前，必须被处理——我们处理它的方式把我们规定为自由的（Uranga 1947: 6）[^uranga-1947]。因此，在自由中我肯定自己的主体性，而这是通过负责任地献身于我的境遇来做的。对墨西哥存在主义者来说，这采取这样的形式：选择献身于*我所发现的世界*，并为它承担责任（为了“拯救”它）——恰恰因为我在其中所发现的状况。
    step2: |-
      自由，就是意识到自己在境遇中受到规定，并选择以负责任的方式献身于它——也就是投入自己的世界。可见自由不能是“不受任何障碍约束”的那种激进自由：境遇本身就是障碍，它挡住去路，必须应对；而我们应对它的方式，恰恰把我们规定为自由的（Uranga 1947: 6）[^uranga-1947]。于是，我在自由中肯定自己的主体性，而这是靠负责任地献身于自己的境遇来完成的。对墨西哥存在主义者而言，这就是选择献身于*我所发现的世界*，并为之担责（为了“拯救”它）——恰恰因为世界在我眼前呈现出的这副样子。
