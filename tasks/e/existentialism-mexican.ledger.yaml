      For finite beings, substantiality is not an aspirational ideal. No one can ever *become* substance. Now, while Uranga has in mind the harm caused by the myth of substantiality to the Mexican sense of self, today we can see it play out, for instance, in the United States, in those cultural and social conceptions of immigrants and refugees as “insufficiently” human, or insufficiently civilized, compared to “true” or “real” or “authentic” “American” citizens. As insufficient, immigrants and refugees are thus treated as inessential to life itself, and as accidental to it (see Mendoza 2016; Sánchez 2014)[^mendoza-2016][^sánchez-2014]. The truth is, however, that insufficiency is the essence of the concrete, so even the rich, the powerful, “Americans,” or “citizens,” and so on, can never achieve, nor can they aspire to, the substantial being that they may claim for themselves. We are all insufficient, inessential, and accidental to life, to the planet, to the universe.
    step1: |-
      对有限的存在者来说，实体性不是值得追求的理想。没有人能*成为*实体。现在，虽然乌兰加心中想的是实体性神话对墨西哥人自我感造成的伤害，但今天我们也能在美国看到它的上演：在那些把移民与难民看成“不够”人、或不够文明的观念中——与“真正”或“真实”或“正宗”的“美国”公民相比。于是，作为不充分者，移民与难民被视为对生命本身而言非本质的、对生命而言偶性的（参 Mendoza 2016；Sánchez 2014）[^mendoza-2016][^sánchez-2014]。然而，真相是：不充分正是具体者的本质；因此，即便是富人、权势者、“美国人”或“公民”等等，也永远无法达到、甚至不能奢望他们为自己所声称的那种实体性存在。我们对生命、对行星、对宇宙而言，都是不充分的、非本质的、偶性的。
