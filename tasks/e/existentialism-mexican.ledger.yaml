      ### 2.1 Freedom, Circumstance, and Responsibility
    step1: |-
      ### 2.1 自由、境遇与责任
    step2: |-
      ### 2.1 自由、境遇与责任
  - id: 8
    kind: body
    source: |-
      Søren Kierkegaard’s definition of freedom as “the possibility of possibility” prefigures what 20ᵗʰ century existentialists will say about this topic (Kierkegaard 1844 [2015])[^kierkegaard-1844]. In broad strokes, it is said that freedom makes possible a subject’s capacity to choose one course of action among many. This freedom to choose, however, is constrained, according to existentialists such as Simone de Beauvoir and Jean-Paul Sartre. In her view, de Beauvoir thinks the possibilities afforded by freedom are always limited by something external to the agent, e.g., traditions, situations, history (Beauvoir 2004). Mexican existentialists further particularize this view, proposing that for the Mexican subject freedom is enacted in a conscious choosing among possibilities availed to it by the *Mexican circumstance*. For Mexican existentialists, the goal of thinking of freedom in this way (as a movement toward possibilities) is freedom itself, or the intellectual liberation from the colonial inheritance and its various manifestations. Mexican existentialists thus understand freedom in the context of historical determinations (colonial oppression) and as the capacity to transcend them, which happens when they are affirmed in acts of criticism, commitment, and responsibility. In this sense, freedom only makes sense as a choosing to commit oneself to the circumstance into which on is thrown and assuming the responsibilities that this thrownness requires. Freedom, commitment, and responsibility thus go hand in hand. Let’s consider these ideas one at a time.
    step1: |-
      索伦·克尔凯郭尔把自由定义为“可能性之可能性”，预示了 20 世纪存在主义者将就这一主题所说的话（Kierkegaard 1844 [2015]）[^kierkegaard-1844]。粗略地说，自由使主体能够在诸多行动路线中选择其一。然而，按西蒙娜·德·波伏娃与让-保罗·萨特等存在主义者的看法，这种选择的自由是受约束的。在波伏娃看来，自由所提供的可能性总是受行动者之外的某种东西限制，例如传统、处境、历史（Beauvoir 2004）。墨西哥存在主义者进一步具体化了这一看法：他们提出，对墨西哥主体而言，自由是在*墨西哥境遇*所提供的可能性之中作有意识选择的行为。对墨西哥存在主义者来说，如此思考自由（作为朝向可能性的运动）的目的就是自由本身，或者说，是从殖民遗产及其种种表现中获得的思想解放。因此，墨西哥存在主义者在历史规定（殖民压迫）的语境中理解自由，并把它理解为超越这些规定的力量——当这些规定在批判、承诺与责任的行为中被确认时，这种超越就发生了。在这个意义上，自由只有作为这样一种选择才有意义：献身于自己被抛入其中的境遇，并承担这种被抛性所要求的责任。于是，自由、承诺与责任三者携手并进。下面逐一考察这些观念。
    step2: |-
      克尔凯郭尔把自由界定为“可能性之可能性”，这已预示了 20 世纪存在主义者的说法（Kierkegaard 1844 [2015]）[^kierkegaard-1844]。大体说来，自由使主体得以在许多行动路线中择一而行。但在波伏娃与萨特等人看来，这种选择的自由是有约束的：波伏娃认为，自由所提供的可能性总被行动者之外的某种东西限制着，比如传统、处境、历史（Beauvoir 2004）。墨西哥存在主义者把这层意思说得更具体：对墨西哥主体来说，自由是在*墨西哥境遇*所给予的各种可能之中作出的自觉选择。在他们看来，这样理解自由（把它看作朝向可能性的运动），目标就是自由本身，或者说，是从殖民遗产及其种种表现中求得的思想解放。于是，他们既在历史规定（殖民压迫）的脉络里理解自由，又把自由理解为超越这些规定的力量——当这些规定在批判、承诺与责任的行为中被确认下来，超越便发生了。就此而言，自由只有作为一种选择才讲得通：选择献身于自己被抛入的境遇，并承担这种被抛性所要求的责任。自由、承诺、责任，三者并肩而行。下面逐一来看。
