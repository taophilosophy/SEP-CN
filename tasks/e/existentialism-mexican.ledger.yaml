      Rosario Castellanos (2017) similarly proposes that inherited values—this time in the form of patriarchal relations—oppress and marginalize. In this case, only an ironic attitude can liberate one (women, in particular) to a future freedom. Reflecting on how women have been excluded from both literature and philosophy, Castellanos ironically announces that such exclusion is appropriate because women “would be bored to death” by that sort of pursuit (2017). Castellanos’ ironic observation, however, is refuted by her own literary and philosophical endeavors. Her extensive bibliography attests to this. In saying that women would be bored to do such work, moreover, she is calling attention to the fact that this is the way that patriarchal narratives represent women’s attitudes towards learning and academic life. Irony is here a key existential moment in the liberation of the oppressed in general and women in particular (see Hierro 1997)[^hierro-1997].
    step1: |-
      罗萨里奥·卡斯特利亚诺斯（2017）同样提出，继承价值——这次以父权关系的形式——压迫并边缘化人。在这种情况下，只有反讽态度才能把人（尤其是女性）解放到未来的自由。反思女性如何被排除在文学与哲学之外，卡斯特利亚诺斯反讽地宣称，这种排除是恰当的，因为女性会被这类追求的“无聊得要死”（2017）。然而，卡斯特利亚诺斯这一反讽的观察，被她自己的文学与哲学努力所驳倒。她丰硕的著述书目就是证明。而且，在说女性做这种事会觉得无聊时，她是在提醒注意一个事实：这正是父权叙事表现女性对学习与学术生活之态度的方式。在此，反讽是受压迫者（一般而言）与女性（尤其）解放中的一个关键存在时刻（参 Hierro 1997）[^hierro-1997]。
