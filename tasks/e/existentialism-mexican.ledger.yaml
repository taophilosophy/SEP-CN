      What follows will not be a detailed historical outline of this effort (a lot of this history is included in the entry on philosophy in Mexico—see also Hurtado 2006; Merrim 2023)[^merrim-2023][^hurtado-2006]. Instead, we consider its results, presented here as a (non-exhaustive) conceptual inventory referencing some of the most important insights of this tradition—the contents of what has previously been called “(M)existentialism” (Sánchez 2019, 2023)[^sánchez-2019].
    step1: |-
      下文并不是对这一努力的详尽历史勾勒（这段历史很大一部分已收入“墨西哥哲学”词条——另参 Hurtado 2006；Merrim 2023）[^merrim-2023][^hurtado-2006]。相反，我们考察它的成果，以一份（非穷尽的）概念清单呈现，涉及该传统一些最重要的洞见——即此前所谓“（M）existentialism”（Sánchez 2019, 2023）[^sánchez-2019] 的内容。
    step2: |-
      下文不打算对这场努力作详尽的历史勾勒（其大半已见“墨西哥哲学”词条，另参 Hurtado 2006；Merrim 2023）[^merrim-2023][^hurtado-2006]。我们要看的是它的成果——以一份（并不穷尽的）概念清单列出，涉及该传统最重要的若干洞见，也就是此前被称作“（墨）存在主义”（(M)existentialism）的那些内容（Sánchez 2019, 2023）[^sánchez-2019]。
