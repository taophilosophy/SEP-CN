      #### 2.1.1 自由
  - id: 10
    kind: body
    source: |-
      Freedom reveals itself in the willingness both to commit and to assume responsibility for our commitments. Because commitment requires taking an exclusionary position on certain values or norms, and because making such choices is only available in freedom, choosing to commit oneself to the *right* values or norms is the best expression of our freedom. The right values or norms will be those that, in choosing to commit ourselves to them, make us responsible for the wellbeing of our neighbors, for the future of our community, or for the health of our circumstance. Leopoldo Zea says: “our freedom is expressed in the form in which we assume the inevitable commitment to our circumstance” (1952 [2017: 126]). In this way, the end of freedom is something other than freedom. Freedom is not an end in itself (Muñoz 1953: 78), but always a means to empower our circumstance, conceived not as an abstract, universal ideal, but as a real and concrete *place*.
    step1: |-
      自由显露于这样两种意愿之中：作出承诺，并为自己的承诺承担责任。因为承诺要求对某些价值或规范采取排他性立场，而作出这类选择只有在自由中才可能，所以选择献身于*正确的*价值或规范，是我们自由的最好表达。所谓正确的价值或规范，就是那些：当我们选择献身于它们时，会使我们对邻人的福祉、对共同体的未来、或对我们境遇的健康负责。莱奥波尔多·塞亚说：“我们的自由表现在我们承担对境遇之不可避免的承诺的形式中”（1952 [2017: 126]）。这样看来，自由的目的不是自由本身。自由不是目的本身（Muñoz 1953: 78），而始终是增强我们境遇的手段；而境遇不是抽象的普遍理想，而是一个真实而具体的*地方*。
    step2: |-
      自由显露在两种意愿里：愿意承诺，也愿意为自己的承诺担责。承诺总要对某些价值或规范采取排他立场；而这类选择又只能在自由中作出。因此，选择献身于*正确的*价值或规范，正是自由的最佳表达。什么是正确的价值或规范？就是那些一旦我们选择献身其中，便让我们对邻人的福祉、对共同体的未来、对自身境遇的健全负起责任的东西。塞亚说：“我们的自由，表现在我们承担对境遇那不可避免的承诺的方式之中”（1952 [2017: 126]）。由此可见，自由的目的并不是自由本身。自由不是目的（Muñoz 1953: 78），它始终是增强境遇的手段；而境遇不是抽象的普遍理想，而是一处真实、具体的*地方*。
  - id: 11
    kind: body
    source: |-
      Historical systems of oppression operative since the time of conquest and colonization of Mexico have rendered the Mexican person indecisive and “unwilling” (see below). Liberation from these long-standing oppressions requires reclaiming one’s power, understood as the subject’s ability to properly choose and to act on those choices. Emilio Uranga says that liberation is possible when we “dislodge [ourselves] from systems of inferior motivations” (1951 [2017: 170]), while Jorge Portilla writes that it involves dismantling the totalizing and objectifying “perspective of the stranger” (1949 [2017: 182]). Being properly free or liberated thus involves a recognition of one’s oppression (Macgregor 1948: 278) and, on this basis, the performance of “morally determining” actions (Uranga 1951 [2017: 170])[^uranga-1951][^uranga-1951-2] that "dislodge" us from it (our various constraints or objectifications) so that we may positively contribute to the well-being of our neighbor or our circumstance. Because they are to be *morally* determining, our actions will take the form of responsible commitments to concrete others and not to ideals or abstractions—for instance, to “humanity in general.” Freedom is thus to be understood, then, as “situated” and “committed” (Zea 1952 [2017: 135])[^zea-1952]. This is a “[r]esponsible freedom, [one] aware of its limits” (135). On such an account, freedom and responsibility are two sides of the same coin; or as Zea puts it, “[w]here there is no responsibility, there is no freedom” (135). Portilla concurs: “To the extent that this person becomes responsible,” he writes, “he or she becomes free, and to the extent that this person becomes free, he or she affirms themselves as a human being” (Portilla 1966 [2012: 162])[^portilla-1966][^portilla-1966-2]. In other words, liberation from oppression—physical or psychological, colonial or otherwise—depends on taking responsibility for, and acting on behalf of, the concrete situation or circumstance in which one finds oneself. Choosing responsible and committed action is the essence of freedom.
    step1: |-
      自墨西哥被征服与殖民以来一直运作的历史性压迫体系，使墨西哥人变得优柔寡断且“不欲”（见下文）。从这些长期压迫中获得解放，要求夺回自己的力量，即主体正确选择并依照选择行动的能力。埃米利奥·乌兰加说，当我们“（把自己）从低劣动机的体系中驱逐出去”时，解放就是可能的（1951 [2017: 170]）；豪尔赫·波蒂利亚则写道，解放意味着拆除那种总体化、对象化的“陌生人视角”（1949 [2017: 182]）。因此，真正自由或获得解放，涉及对自己所受压迫的承认（Macgregor 1948: 278），并在此基础上施行“道德上具有规定性”的行动（Uranga 1951 [2017: 170]）[^uranga-1951][^uranga-1951-2]，把我们从中“驱逐”出去（我们的种种约束或对象化），以便我们能对邻人或境遇的福祉作出积极贡献。由于这些行动要在*道德上*具有规定性，它们将采取对具体他人、而非对理想或抽象（比如“一般的人性”）作出负责任承诺的形式。因此，自由应被理解为“处境中的”与“承诺性的”（Zea 1952 [2017: 135]）[^zea-1952]。这是一种“负责任的自由，一种意识到自身界限的自由”（135）。按这种说法，自由与责任是同一枚硬币的两面；用塞亚的话说，“哪里没有责任，哪里就没有自由”（135）。波蒂利亚表示同意：“这个人变得负责任到什么程度，”他写道，“他或她就自由到什么程度；而这个人自由到什么程度，他或她就作为人肯定自己到什么程度”（Portilla 1966 [2012: 162]）[^portilla-1966][^portilla-1966-2]。换句话说，从压迫中解放——不论是身体上的还是心理上的、殖民的还是其他形式的——取决于为自己所处的具体处境担责并为之行动。选择负责任而有所承诺的行动，正是自由的本质。
    step2: |-
      自征服与殖民以来，历史性的压迫制度一直在运作，把墨西哥人弄得优柔寡断、“不欲”（见下文）。要从这些经年累月的压迫中解放，就得夺回自己的力量——主体正确选择并照着选择去行动的能力。乌兰加说，一旦我们“（把自己）从低劣动机的系统中撵出去”，解放便有可能（1951 [2017: 170]）；波蒂利亚则写道，解放意味着拆掉那种总体化、对象化的“陌生人视角”（1949 [2017: 182]）。所以，真正自由或获得解放，先要承认自己所受的压迫（Macgregor 1948: 278），再在此基础上做出“道德上具有规定作用”的行为（Uranga 1951 [2017: 170]）[^uranga-1951][^uranga-1951-2]，把自己从压迫（种种约束或对象化）中“撵”出去，从而对邻人或境遇的福祉作出积极贡献。这些行为既然是*道德上*具有规定作用的，便采取对具体他人而非理想或抽象（比如“一般的人性”）负责的承诺形式。因此，自由应当理解为“处境中的”“承诺性的”（Zea 1952 [2017: 135]）[^zea-1952]。这是一种“负责任的自由，一种意识到自身界限的自由”（135）。照此说法，自由与责任是同一枚硬币的两面；用塞亚的话说：“没有责任，就没有自由”（135）。波蒂利亚也赞同：“一个人越是负起责任，”他写道，“就越是自由；越是自由，就越是作为人肯定自身”（Portilla 1966 [2012: 162]）[^portilla-1966][^portilla-1966-2]。换句话说，从压迫（身体或心理的、殖民的或别的）中解放，取决于为自己所处的具体处境担起责任、为之行动。选择负责任而有承诺的行动，就是自由的本质。
