      About *nepantla*, Uranga (1952 [2013]) writes: “This is *nepantla*. Not a ‘synthesis,’ but an ‘oscillation,’ to ‘go from one end to another without rest.’ The *mood* [*estado de animo*] that communicates this *structure of being* is precisely ‘zozobra.’ In the *mood* of zozobra we do not know what to depend on, we vacillate between one and another ‘law,’ we are ‘neutral,’ ‘in between,’ ‘nepantla’” (149; emphasis added). What this tells us is that *zozobra*—a term Uranga inherits from the Mexican poet Ramón Lopéz Velarde (1888–1921), whose 1919 masterwork *Zozobra* serves as inspiration—and *nepantla* are not identical or interchangeable terms. *Zozobra* is the emotive expression of nepantla; it is the *feeling* of uncertainty, unease, anxiety, and despair that Uranga calls an “estado de animo” (a “mood”—see Gallegos 2023).
    step1: |-
      关于 *nepantla*，乌兰加（1952 [2013]）写道：“这就是 *nepantla*。不是‘综合’，而是‘摆荡’，是‘不歇地从一端到另一端’。传达这种*存在结构*的*心情*［*estado de animo*］正是‘zozobra’。在 zozobra 的*心情*中，我们不知道可以依靠什么，我们在这样一条与那样一条‘法则’之间摇摆不定，我们‘中立’，‘在之间’，‘nepantla’”（149；着重为引者所加）。这告诉我们：*zozobra*——乌兰加从墨西哥诗人拉蒙·洛佩斯·贝拉尔德（1888–1921）那里继承的词，后者 1919 年的杰作《忧悬》正是灵感来源——与 *nepantla* 并不是同一或可互换的术语。*Zozobra* 是 nepantla 的情感表达；它是乌兰加所谓“estado de animo”（一种“心情”——参 Gallegos 2023）的那种不确定、不安、焦虑与绝望的*感受*。
    step2: |-
      谈到 *nepantla*，乌兰加（1952 [2013]）写道：“这就是 *nepantla*。不是‘综合’，而是‘摆荡’，是不歇气地‘从一端荡到另一端’。传达这种*存在结构*的*心情*［*estado de animo*］，恰恰就是‘zozobra’。处在 zozobra 的*心情*里，我们不知道该靠什么，在一条又一条‘法则’之间来回摇摆，我们‘中立’，‘在之间’，‘nepantla’”（149；着重为引者所加）。由此可见：*zozobra* 与 *nepantla* 并非同一回事，也不能互换。*zozobra* 一词承自墨西哥诗人拉蒙·洛佩斯·贝拉尔德（1888–1921），其 1919 年的杰作《忧悬》正是灵感所自。*Zozobra* 是 nepantla 的情感表达：那种不确定、不安、焦虑与绝望的*感受*，乌兰加称之为“estado de animo”（一种“心情”——参 Gallegos 2023）。
