      Existentialism in Mexico grows in popularity in the late 1940s. The groundwork for this growth, however, was laid decades before, with the introduction into Mexico of José Ortega y Gasset’s (1883–1955) notion of “vital reason” in the 1920s. Ortega’s doctrine of vital reason privileges perspective and situatedness over abstractness and rational detachment, proposing that what matters is how human beings respond to their own particular circumstance. In his *Meditations on Quixote*, written in 1914, the Spanish philosopher introduces the centrality of circumstance in his anti-Cartesian “circumstantialist” principle: “I am myself and my circumstance, and if I don’t save it, I don’t save myself” (Ortega 1999: 45; see also Romanell 1951)[^romanell-1951]. What this principle conveys is that what is truly meaningful about one’s life is not something intangible, but something concrete, namely the place where one stands, the everyday details that make one up, or those things that create one’s identity in context. In a brief, illuminating phrase, it describes the nature of one’s identity (which is a marriage of *self* and *circumstance*) and, also, what one needs to do on its behalf (namely, “save it,” or preserve it by understanding it, advocating for it, or loving it). Circumstance, or in its Latin, *circum* and *stantia*, refers to that which *stands around*, including mountains, streets, forests, sky, or the totality of the environment…these are all “circumstance.” But “circumstance” is also language, culture, tradition, history, existing social relations. In sum, the circumstance is the totality of that *habitat* in which I find myself and that could identify me, inform me, or constitute me.
    step1: |-
      墨西哥的存在主义在 1940 年代末日益流行。然而，这一成长的基础早在几十年前就已奠定：1920 年代，何塞·奥尔特加·加塞特（1883–1955）的“生命理性”概念被引入墨西哥。奥尔特加的生命理性学说赋予视角与处境以优先地位，而贬低抽象与理性超脱；它提出，要紧的是人如何回应自己特定的境遇。这位西班牙哲学家在 1914 年写成的《堂吉诃德沉思》中，以他那反笛卡尔的“境遇主义”原则引入了境遇的中心地位：“我就是我自己加上我的境遇；如果我不拯救它，我也就拯救不了我自己”（Ortega 1999: 45；另参 Romanell 1951）[^romanell-1951]。这一原则所传达的是：一个人生命中真正有意义的东西不是不可捉摸的，而是具体的，即他所站立的地方、构成他的日常细节，或在语境中造就其身份的那些事物。它用一句简短而富有启发的话，既描述了一个人身份的本性（身份是*自我*与*境遇*的结合），也描述了一个人为此需要做什么（即“拯救它”，或通过理解它、为它主张、爱它来保存它）。境遇，其拉丁文词源为 *circum* 与 *stantia*，指的是*环绕而立*的东西，包括群山、街道、森林、天空，或环境的整体……这些都是“境遇”。但“境遇”也是语言、文化、传统、历史、现存的社会关系。总之，境遇是我身处其中、可能识别我、告知我或构成我的那整个*栖居地*。
    step2: |-
      墨西哥存在主义在 1940 年代末走红。但它的根扎得更早：1920 年代，何塞·奥尔特加·加塞特（1883–1955）的“生命理性”（razón vital）概念传入墨西哥。奥尔特加这套学说抬举视角与处境，贬低抽象与理性超脱，主张要紧的是人如何回应自己那份特定的境遇。1914 年写成的《堂吉诃德沉思》里，这位西班牙哲学家以反笛卡尔的“境遇主义”原则把境遇摆到中心：“我就是我自己加上我的境遇；若不拯救它，我便拯救不了自己”（Ortega 1999: 45；另参 Romanell 1951）[^romanell-1951]。这句话的意思是：人生中真正有意义的东西并不缥缈，它很具体——你站立的地方、构成你的日常细节、在具体脉络中造就你身份的那些事物。短短一句话，既点明身份的本性（身份是*自我*与*境遇*的结合），也点明你该为它做什么（“拯救它”：靠理解、主张与爱来保全它）。境遇，拉丁文作 *circum* 加 *stantia*，指*环绕而立*的一切：山峦、街道、森林、天空，或整个环境……这些都是“境遇”。但“境遇”也是语言、文化、传统、历史与现存的社会关系。总而言之，境遇就是我身处其中、可能识别我、塑造我或构成我的那整个*栖居地*。
