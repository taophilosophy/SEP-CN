      Accidentality has an established philosophical historiography. Aristotle says that substance is primary and self-sufficient and that the accident is secondary and dependent. Accidents are accidental attributes of substance. Applied to persons, these categories and distinctions mean that those who are substantial are self-sufficient and necessary while those that are accidental are inessential, dependent, and insufficient. Persons defined by accidentality will be those that “through a thousand accidents of history, of culture or society, have been framed by the catastrophic” (1952 [2021: 185]). Those framed by the catastrophic are familiar with historical violence and finitude and understand the world through their accidentality, that is, as precarious and finite. Uranga suggests that Mexicans in particular, but also, and in general, peoples living in the peripheries of world history, in its margins and undersides, have been framed—and frame themselves—in this way. (An alternative reconstruction of accidentality is offered by Vargas 2020)[^vargas-2020].
    step1: |-
      偶在性有一套既定的哲学史编纂。亚里士多德说实体是第一位的、自足的，偶性是第二位的、依赖的。偶性是实体的偶性属性。把这些范畴与区分应用于人，就意味着：实体性的东西是自足的、必然的，而偶性的东西则是非本质的、依赖的、不充分的。由偶在性定义的人，将是那些“经由历史、文化或社会的千百次偶变，被灾难所框定”的人（1952 [2021: 185]）。被灾难框定的人熟悉历史暴力与有限性，并通过自己的偶在性——即作为不安定的、有限的——来理解世界。乌兰加认为，墨西哥人尤其如此；但一般而言，居于世界历史边缘、处在边缘与底层的人民也是如此：他们被这样框定，也这样框定自己。（另一种对偶在性的重构见 Vargas 2020）[^vargas-2020]。
    step2: |-
      偶在性在哲学史上自有脉络。亚里士多德认为实体是第一位的、自足的，偶性是第二位的、依赖的；偶性只是实体的偶性属性。把这对范畴用在人身上就意味着：实体性的存在者自足而必然，偶性的存在者则非本质、依赖、不充分。由偶在性来定义的人，就是“被历史、文化或社会的千百次偶变所框定、被灾难所塑造”的那些人（1952 [2021: 185]）。被灾难塑造的人，熟悉历史暴力与有限性，也通过自身的偶在性——即作为不安定、有限的存在——来理解世界。乌兰加认为，墨西哥人尤其如此；推而广之，凡居于世界历史边缘、处在边缘和底层的人民，都是这样被塑造、也这样塑造自己的。（另一种对偶在性的重构见 Vargas 2020）[^vargas-2020]。
