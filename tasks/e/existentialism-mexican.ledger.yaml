      Mexican existentialism is currently in a state of recovery. In Mexico, the recovery process begins in earnest at the turn of the present century with Guillermo Hurtado’s edited volume *El* *Hiperión* (2006), which brings together the most significant figures of this movement as well as fragments of their best-known writings. This is followed by Jaime Vieyra’s “Emilio Uranga: la existencia como accidente” (2007) and Guillermo Hurtado’s edition of Emilio Uranga’s master work, *Análisis del ser del mexicano* together with various other of Uranga’s writings (1952 [2013]). Most recently, works by Hurtado, Aurelia Valero, José Manuel Cuéllar, Mario Teodoro Ramírez, Jaime Vieyra, and Hector Aparicio offer contemporary interpretations of existential writings of Portilla, Uranga, Villoro, and Zea (Hurtado 2019; Pie 2012; Cuéllar 2020; Ramírez 2022; Aparicio 2023; Garcia Torres 2024)[^garcia-2024][^torres-2024][^cuéllar-2020][^hurtado-2019][^ramírez-2022]. The Mexican project of recovery continues and it is sure continue well into the 21ˢᵗ century.
