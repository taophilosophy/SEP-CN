      墨西哥存在主义眼下正在复兴。在墨西哥，这场复兴在本世纪之交真正起步：吉列尔莫·乌尔塔多（Guillermo Hurtado）主编的《许珀里翁》（2006）把这一运动最重要的人物及其代表作选段汇于一编。接着是海梅·比耶拉的《埃米利奥·乌兰加：作为偶性的存在》（2007），以及乌尔塔多编订的乌兰加代表作《墨西哥存在之分析》及乌兰加其他若干文字（1952 [2013]）。晚近以来，乌尔塔多、奥雷利亚·瓦莱罗、何塞·曼努埃尔·奎利亚尔、马里奥·特奥多罗·拉米雷斯、海梅·比耶拉和埃克托尔·阿帕里西奥等人的著作，为波蒂利亚、乌兰加、比略罗、塞亚的存在主义文本提供了当代解读（Hurtado 2019；Pie 2012；Cuéllar 2020；Ramírez 2022；Aparicio 2023；Garcia Torres 2024）[^garcia-2024][^torres-2024][^cuéllar-2020][^hurtado-2019][^ramírez-2022]。墨西哥的复兴工程仍在推进，且必定会延续到 21 世纪深处。
