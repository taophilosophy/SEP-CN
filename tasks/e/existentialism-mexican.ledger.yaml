      墨西哥存在主义目前正处于复兴之中。在墨西哥，复兴进程在本世纪之交认真启动，起于吉列尔莫·乌尔塔多主编的《许珀里翁》（2006）；该书汇集了这一运动最重要的人物，以及他们最著名著作的片段。随后是海梅·比耶拉的《埃米利奥·乌兰加：作为偶性的存在》（2007），以及乌尔塔多对乌兰加的代表作《墨西哥存在之分析》连同乌兰加其他若干著作的编订（1952 [2013]）。最近，乌尔塔多、奥雷利亚·瓦莱罗、何塞·曼努埃尔·奎利亚尔、马里奥·特奥多罗·拉米雷斯、海梅·比耶拉与埃克托尔·阿帕里西奥的著作，对波蒂利亚、乌兰加、比略罗与塞亚的存在主义文本提供了当代解读（Hurtado 2019；Pie 2012；Cuéllar 2020；Ramírez 2022；Aparicio 2023；Garcia Torres 2024）[^garcia-2024][^torres-2024][^cuéllar-2020][^hurtado-2019][^ramírez-2022]。墨西哥的复兴工程仍在继续，而且必定会一直继续到 21 世纪以后。
