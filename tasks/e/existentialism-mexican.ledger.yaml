      1. *Nepantla* is an ontological concept that refers to a *suspension between commitments or worlds* that is indicative of the “postmodern” tendency toward indetermination, fluidity, and accidentality.
      2. *Nepantla* captures the *always being on the way*, i.e., the nomadism of those in-between worlds, but of also of the world-less, those who have been displaced by social, political, or other forces. It is sometimes referred to as a *never again/never yet* structure (Sánchez 2023, 53–68)[^sánchez-2023].
      3. *Nepantla* describes an existential *refusal* to commit, a *neutrality* regarding direct action on the circumstances in which some find themselves, circumstances which oftentimes offer no true living option. This can describe persons who exist with inherited oppressive existential situations and who, considering them as inadequate, refuse to commit themselves to them.
      4. Finally, *nepantla* is the “in between” temporalities, worlds, processes; it is being “in the middle,” as in “on the way,” in transit, from one place to another, or “in the middle” as in “in the midst of” a crisis or a paradigm shift.
    step1: |-
      1. *Nepantla* 是一个本体论概念，指*诸承诺或诸世界之间的悬置*，它标示出一种朝向不确定、流动与偶在的“后现代”倾向。
      2. *Nepantla* 捕捉到*永远在途中*，即那些处于诸世界之间者的游牧状态，也包括那些无世界者——被社会、政治或其他力量所驱逐的人。它有时被称为一种*永不重来／尚未来临*的结构（Sánchez 2023, 53–68）[^sánchez-2023]。
      3. *Nepantla* 描述一种存在上的*拒绝*承诺，一种对直接作用于某些人所处境况的*中立*——而这些境况常常并不提供真正的生存选项。它可以描述这样的人：他们存在于继承而来的压迫性存在处境之中，并因认为这些处境不充分而拒绝献身于它们。
      4. 最后，*nepantla* 是诸时间性、诸世界、诸过程“之间”；它是“在中间”——“在路上”、在中转、从一处到另一处；或者“在中间”意为处在危机或范式转换的“当中”。
