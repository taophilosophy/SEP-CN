      At “the absolute opposite pole” of the *relajiento* is the “apretado.” The *apretado*, a term we can loosely translate as “goody-two-shoes,” “stick-in-the-mud,” or even “snobbish” is not just serious, but is *burdened with seriousness*. Colloquially we say that they are “tightly wound,” zealous, fully determined in and committed to their beliefs. We may even call them fanatics (Sánchez 2024b)[^sánchez-2024b]. According to Portilla, *apretados* are “afflicted with the spirit of seriousness” (1966 [2012: 190]). This affliction shows up as a commitment to *being* serious. Being serious set *apretados* apart. Unlike *relajientos* who do as they please, *apretados* do only what is demanded by their values. Ultimately, *apretados* value order and obedience more than freedom. One finds in this individual, Portilla writes, “no distance…between being and value”—the *apreatado is* what the *apratado* values, and this identity will be reflected in how they represent themselves to others. How they portray themselves is, moreover, is “an expression of [their] internal being” (191). *Apretados* “carry their value in the same way that they carry with them their legs or their liver: as a silent and solid cause of pleasure that they caress in their private moments” (191). They are, Portilla says, “[c]ompact masses of value.” (191).
    step1: |-
      在 *relajiento* 的“绝对对立极”上是“apretado”。*apretado* 这个词大致可译作“一本正经的好孩子”“死板的人”，甚至“势利眼”；他们不只是严肃，而是*被严肃压着*。口语里我们说他们“绷得紧”、狂热、在信念上完全确定并全心投入。我们甚至可以把他们称为狂热者（Sánchez 2024b）[^sánchez-2024b]。按波蒂利亚所说，*apretados* “被严肃精神所折磨”（1966 [2012: 190]）。这种折磨表现为一种对“*成为*严肃”的承诺。严肃使他们与众不同。与随心所欲的 *relajientos* 不同，*apretados* 只做其价值所要求的事。归根结底，*apretados* 重视秩序与服从甚于自由。波蒂利亚写道，在这种人身上，“存在与价值之间没有距离”——*apretado* 之所是，就是 *apretado* 所重视的东西；这种同一会反映在他们如何向他人表现自己上。而且，他们如何描绘自己，是“［其］内在存在的表达”（191）。*Apretados* “带着他们的价值，就像带着他们的腿或肝一样：作为一种静默而坚实的快乐之源，在私下的时刻抚摸着它”（191）。波蒂利亚说，他们是“价值的一团团紧实块体”（191）。
    step2: |-
      与 *relajiento* 正相反的另一极，是 *apretado*。这个词勉强可译作“乖宝宝”“死脑筋”，甚至“势利眼”；他们不但严肃，而且*被严肃压得喘不过气*。口语里，我们说他们“绷得很紧”、较真，对信念完全笃定、全心投入。叫他们狂热分子也无不可（Sánchez 2024b）[^sánchez-2024b]。波蒂利亚说，*apretados* 是“被严肃精神缠上了”（1966 [2012: 190]）。这毛病表现为：一心要*做个*严肃的人。严肃把他们与旁人区分开来。*relajientos* 为所欲为，*apretados* 则只做价值要求他们做的事。说到底，*apretados* 重秩序与服从，轻自由。波蒂利亚写道，这种人身上“存在与价值之间……没有距离”——*apretado* 是什么，就是他重视什么；这种同一，会体现在他们向他人展示自己的方式上。而且，他们的自我描绘是“［其］内在存在的表现”（191）。*Apretados* “把价值带在身边，就像带着自己的腿、自己的肝一样：那是一种无声而坚实的快乐之源，他们在私下里摩挲着”（191）。波蒂利亚说，他们就是“一团团紧实的价值”（191）。
