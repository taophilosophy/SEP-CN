      In the US, this project of recovery is simultaneously a project of discovery. It involves a synergistic approach to Mexican philosophy involving translation, interpretation, publication and teaching. These efforts include Carlos Alberto Sanchéz’s introduction and translation of Jorge Portilla’s *La fenomenología del relajo* (1966 [2012, 2023]) and *Emilio Uranga’s* *Analysis of Mexican Being* (1952 [2021]), as well as Sánchez’s *Contingency and Commitment: Mexican Existentialism and the Place of Philosophy* (2016). These works begin a conversation of Mexican existentialism, it’s breadth, scope, and also its blind-spots—Andrea Pitts (2016), for instance, points out the complete lack of the feminist perspective internal to this project. The project is spurned on by the editorial work of Robert Eli Sanchez and Carlos Alberto Sánchez, who publish *Mexican Philosophy in the 20ᵗʰ Century: Essential Readings* in 2017 and launch the *Journal of Mexican Philosophy* a few years later in 2022. More recent scholarship seeks to engage Mexican existentialism with a less historical, more analytical, approach. Stephanie Merrim’s *A Latin American Existentialist Ethos* (2023) zeroes in on the influence of Mexican existentialism on literary figures of the time, including Juan Rulfo and Rosario Castellanos; Sergio Gallegos-Ordonica engages Uranga’s humanism (2020); Manuel Vargas offers an analysis and interpretation of “accidentality” (2020); Juan Carlos Gonzalez (2024) thinks of Mexican existentialism in relation to the various crises plaguing “America” in the 21ˢᵗ century; Francisco Gallegos gives us a contemporary reading of the phenomenology of zozobra (2023); and Juan Garcia Torres (2023) brings these Mexican existentialists into conversation with the popular decolonial approaches. It is thus safe to say that Mexican existentialism is a not merely a historical artifact, but a living, breathing philosophical archive with much to offer contemporary scholars.
    step1: |-
      在美国，这一复兴工程同时是一项发现工程。它涉及一种协同的进路：翻译、解释、出版与教学。这些努力包括卡洛斯·阿尔贝托·桑切斯对波蒂利亚《relajo 现象学》（1966 [2012, 2023]）与*埃米利奥·乌兰加*《墨西哥存在之分析》（1952 [2021]）的导论与翻译，以及桑切斯的《偶然性与承诺：墨西哥存在主义与哲学的位置》（2016）。这些著作开启了关于墨西哥存在主义的对话，涉及它的广度、范围，以及它的盲点——例如，安德里亚·皮茨（2016）指出，这一计划内部完全缺乏女性主义视角。该工程得到罗伯特·埃利·桑切斯与卡洛斯·阿尔贝托·桑切斯编辑工作的推动：他们于 2017 年出版《20 世纪墨西哥哲学：基本读本》，并于几年后、2022 年创办《墨西哥哲学杂志》。更晚近的研究寻求以较少历史性、更多分析性的进路介入墨西哥存在主义。斯蒂芬妮·梅里姆的《拉丁美洲存在主义精神》（2023）聚焦墨西哥存在主义对当时文学人物的影响，包括胡安·鲁尔福与罗萨里奥·卡斯特利亚诺斯；塞尔吉奥·加列戈斯-奥尔多里卡探讨乌兰加的人本主义（2020）；曼努埃尔·巴尔加斯对“偶在性”作了分析与解释（2020）；胡安·卡洛斯·贡萨莱斯（2024）把墨西哥存在主义与 21 世纪困扰“美国”的种种危机联系起来思考；弗朗西斯科·加列戈斯（2023）对 zozobra 现象学作了当代解读；胡安·加西亚·托雷斯（2023）让这些墨西哥存在主义者与流行的去殖民进路展开对话。因此，可以有把握地说，墨西哥存在主义不只是历史遗物，而是一个活生生的哲学档案，对当代学者大有可提供之处。
    step2: |-
      在美国，这场复兴同时也是发现。它走的是协同并进的路子：翻译、解释、出版、教学齐头并举。其中包括桑切斯（Carlos Alberto Sánchez）为波蒂利亚《relajo 现象学》（1966 [2012, 2023]）和乌兰加《墨西哥存在之分析》（1952 [2021]）所作的导论与译文，以及他本人的《偶然性与承诺：墨西哥存在主义与哲学的位置》（2016）。这些著作打开了关于墨西哥存在主义的对话——谈它的广度、范围，也谈它的盲点：例如皮茨（Andrea Pitts，2016）就指出，这一计划内部完全缺少女权主义视角。这项工作又因罗伯特·埃利·桑切斯与卡洛斯·阿尔贝托·桑切斯的编辑之功而加速：他们 2017 年出版《20 世纪墨西哥哲学：基本读本》，2022 年又创办《墨西哥哲学杂志》。较近的研究则尝试以更重分析、较少历史的方式介入墨西哥存在主义。梅里姆（Stephanie Merrim）的《拉丁美洲存在主义精神》（2023）专论墨西哥存在主义对当时文学人物的影响，包括胡安·鲁尔福与罗萨里奥·卡斯特利亚诺斯；加列戈斯-奥尔多里卡（Sergio Gallegos-Ordorica）深入乌兰加的人本主义（2020）；巴尔加斯（Manuel Vargas）对“偶在性”作了分析与解释（2020）；贡萨莱斯（Juan Carlos Gonzalez，2024）把墨西哥存在主义同 21 世纪困扰“美国”的种种危机对照来想；加列戈斯（Francisco Gallegos，2023）给出 zozobra 现象学的当代读解；加西亚·托雷斯（Juan Garcia Torres，2023）则让这些墨西哥存在主义者与流行的去殖民进路对话。可以说，墨西哥存在主义并非一件历史旧物，而是一个活生生的哲学档案，可供当代学者取用的东西很多。
