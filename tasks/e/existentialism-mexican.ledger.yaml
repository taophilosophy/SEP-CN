      *Nepantla* is mentioned only twice in the main text of Emilio Uranga’s *Analysis of Mexican Being* (1952 [2021]), yet he argues that it is *the* key “ontological” concept in Mexican existentialism. Uranga writes that “[t]he Mexican character does not install itself over…two agencies, but between [*entre*] them. The nahuatl term *”nepantla*“ captures this phenomenon perfectly; it means ‘in between,’ in the middle, in the center. We thus have before us, in all its purity, the central category of our ontology, autochthonous, one that does not borrow from the Western tradition…” (Uranga 1952 [2021]: 167)[^uranga-1952][^uranga-1952-2]. As “the central category” of this tradition, *nepantla* defies the Western philosophical tradition by insisting on the ontological priority of indeterminateness and fluidity. Proposing it as such is an important strategic move, since motivating Mexican existentialists is an attempt to confront and overcome suffocating colonial prejudices regarding who and what they are.
    step1: |-
      *nepantla* 在埃米利奥·乌兰加《墨西哥存在分析》（1952 [2021]）正文中只被提到两次，然而他论证说，它是墨西哥存在主义中*那个*关键的“本体论”概念。乌兰加写道：“墨西哥性格并不安顿于……两种机构之上，而是位于它们*之间*［*entre*］。纳瓦特尔语词 *nepantla* 完美地捕捉了这一现象；它的意思是‘在之间’，在中间，在中心。于是，我们面前就有了我们本体论的核心范畴，纯粹无杂、原生的，并不借自西方传统……”（Uranga 1952 [2021]: 167）[^uranga-1952][^uranga-1952-2]。作为这一传统的“核心范畴”，*nepantla* 坚持不确定性、流动性的本体论优先性，从而抗拒西方哲学传统。如此提出它是一步重要的策略性举措，因为驱动墨西哥存在主义者的，正是要面对并克服那些关于他们是谁、是什么的令人窒息的殖民偏见。
    step2: |-
      在乌兰加《墨西哥存在分析》（1952 [2021]）的正文里，*nepantla* 只出现过两次；可乌兰加偏说，它才是墨西哥存在主义*那个*关键的“本体论”概念。他写道：“墨西哥性格不把自己安在……两种机制之上，而是安在二者*之间*［*entre*］。纳瓦特尔词 *nepantla* 把这个现象抓得极准：它的意思就是‘在之间’、在中间、在中心。于是，我们面前就摆着我们本体论的核心范畴——纯然原生，不借自西方传统……”（Uranga 1952 [2021]: 167）[^uranga-1952][^uranga-1952-2]。作为这一传统的“核心范畴”，*nepantla* 坚持不确定性与流动性的本体论优先地位，从而与西方哲学传统相抗。这样提出它，是一步重要的策略棋：墨西哥存在主义者所图者，正是面对并克服那些关于“他们是谁、是什么”的、令人窒息的殖民偏见。
