      Critiques for Mexican existentialism abound and vary from rigorous critique of methodology (Gaos 1952 and Villegas 1979)[^gaos-1952][^villegas-1979] to dismissal on political or other-than-philosophical grounds (Bartra 1987 and Santos Ruiz 2015)[^santos-2015]. While Gaos himself helps articulate the Mexican existentialist project with his mentorship and courses on Heidegger and others, he’s also one of the first to critique their approach on the basis that the Mexican being to which the philosophers refer *does not exist*, calling their method “arbitrary” (Gaos 1952)[^gaos-1952]. Villegas likewise criticizes the method, observing that Mexican existentialist confuse history for being, historicism for ontology (Villegas 1979)[^villegas-1979]. Other critics simply propose that the Mexican existentialists didn’t understand existentialism (Díaz 2024)[^díaz-2024].
    step1: |-
      对墨西哥存在主义的批评比比皆是，从对方法论进行严格批评（Gaos 1952 与 Villegas 1979）[^gaos-1952][^villegas-1979]，到以政治或其他非哲学理由加以否定（Bartra 1987 与 Santos Ruiz 2015）[^santos-2015]。高斯本人虽然以导师身份、通过关于海德格尔等人的课程帮助阐明了墨西哥存在主义计划，却也是最早批评其进路的人之一，理由是他们所说的墨西哥存在*并不存在*；他称这种方法为“任意的”（Gaos 1952）[^gaos-1952]。维列加斯同样批评这一方法，指出墨西哥存在主义者把历史误认为存在、把历史主义误认为本体论（Villegas 1979）[^villegas-1979]。其他批评者则干脆说，墨西哥存在主义者并不理解存在主义（Díaz 2024）[^díaz-2024]。
    step2: |-
      对墨西哥存在主义的批评很多，有对方法论的严格批评（Gaos 1952；Villegas 1979）[^gaos-1952][^villegas-1979]，也有从政治上或其他非哲学理由出发的否定（Bartra 1987；Santos Ruiz 2015）[^santos-2015]。高斯本人虽以师承和关于海德格尔等人的课程帮衬过这个计划，却也是最早批评其进路的人之一：他说哲学家们所谈的墨西哥存在*根本不存在*，并称其方法“任意”（Gaos 1952）[^gaos-1952]。维列加斯同样批评这种方法，指出墨西哥存在主义者把历史当成了存在，把历史主义当成了本体论（Villegas 1979）[^villegas-1979]。还有批评者干脆说：墨西哥存在主义者压根没弄懂存在主义（Díaz 2024）[^díaz-2024]。
