      *Relajo* is a core concept in the existential philosophy of Jorge Portilla (Hurtado 2006, 2023; Sánchez 2012, 2016, 2023; Portilla 1966 [2012, 2023])[^portilla-1966][^sánchez-2012][^hurtado-2006][^portilla-1966-2]. In a general sense, *relajo* refers to an action or behavior that undermines prescribed or expected attitudes toward established values (social, aesthetic, historical, legal, and so on)*.* Portilla defines *relajo* as a “suspension of seriousness,” which is equivalent, he says, to saying “no” to values. To say “no” to values is to deny the demands of the social world itself. In normal situations, I attend to the values of the world, saying “yes” to them and doing as they demand—*I behave appropriately*. Doing so maintains a social status quo and things go on as they should. “The mere grasping of the value carries with it the fulfillment of that demand… [and its] realization in the world; and in order for this demand…to be realized, the subject, in turn, performs an act, a movement of loyalty [to the value] that is a kind of ‘yes’” (Portilla 1966 [2012, 129])[^portilla-1966][^portilla-1966-2]. *Relajo* is a non-normal response to those same values. It is a rejection of their demands: “[t]he sense of *relajo* is precisely to frustrate the effectiveness of [a] spontaneous response that accompanies the grasping of the value. *Relajo* suspends seriousness; that is to say, it cancels the normal response to the value, freeing me from the commitment to its realization” (129–30).
    step1: |-
      *Relajo* 是豪尔赫·波蒂利亚存在哲学的核心概念（Hurtado 2006, 2023；Sánchez 2012, 2016, 2023；Portilla 1966 [2012, 2023]）[^portilla-1966][^sánchez-2012][^hurtado-2006][^portilla-1966-2]。一般地说，*relajo* 指一种削弱对既定价值（社会的、审美的、历史的、法律的等等）的规定态度或预期态度的行动或行为。波蒂利亚把 *relajo* 定义为“严肃性的悬置”，他说这等同于对价值说“不”。对价值说“不”，就是否认社会世界本身的要求。在正常情形中，我关注世界的价值，对它们说“是”，并照它们的要求去做——*我的举止合宜*。这样做维持着一种社会现状，事情按应有的方式继续。“仅仅把握到价值，就伴随着对该要求的履行……［以及它］在世界中的实现；而为了使这一要求……得到实现，主体反过来要施予一种行为，一种［对价值的］忠诚运动，那就是一种‘是’”（Portilla 1966 [2012, 129]）[^portilla-1966][^portilla-1966-2]。*Relajo* 是对同样这些价值的一种非正常回应。它是对其要求的拒绝：“*relajo* 的意义恰恰在于挫败伴随价值把握而来的那个自发回应的效力。*relajo* 悬置严肃性；也就是说，它取消了对价值的正常回应，把我从实现它的承诺中解放出来”（129–30）。
    step2: |-
      *Relajo* 是波蒂利亚存在哲学的核心概念（Hurtado 2006, 2023；Sánchez 2012, 2016, 2023；Portilla 1966 [2012, 2023]）[^portilla-1966][^sánchez-2012][^hurtado-2006][^portilla-1966-2]。大体上说，*relajo* 指某种行动或行为：它拆解人对既定价值（社会、审美、历史、法律等价值）所应有的、被期待的态度。波蒂利亚把 *relajo* 界定为“严肃性的悬置”，并说这等于对价值说“不”。对价值说“不”，就是对社会的世界本身的要求说不。在寻常情形下，我关注世上的价值，对之说“是”，照它的要求去做——*举止合宜*。这样一来，社会现状得以维持，事情按部就班。“单单把握到价值，就已经伴随着对该要求的履行……［以及它］在世的实现；而为了让这一要求……落实，主体反过来要做出一个行为，一种［对价值的］忠诚之举，那是一种‘是’”（Portilla 1966 [2012, 129]）[^portilla-1966][^portilla-1966-2]。*Relajo* 则是对同样这些价值作出的非寻常回应，是对其要求的拒斥：“*relajo* 的要义，恰恰是让那个伴随价值把握而来的自发回应失效。*relajo* 悬置严肃性；也就是说，它取消了面对价值的正常回应，把我从‘务必实现它’的承诺中解脱出来”（129–30）。
