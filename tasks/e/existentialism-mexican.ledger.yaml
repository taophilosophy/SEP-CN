      “Insufficiency” [*Insuficiencia*] is a mode of accidentality. It is the ontological correlate to the psychological “complex of inferiority.” The latter is the *feeling* of impotence and inadequacy that can overwhelm a person in the presence of something that appears superior or “better than.” It is originally posited in response to Samuel Ramos (1934) suggestion that an essential characteristic of the Mexican people was a shared feeling of inferiority explained much of their behavior toward themselves and one another. Against Ramos, Uranga argues that the Mexican inferiority complex is but a symptom of a much deeper *human* condition, namely, accidentality experienced as insufficiency. In other words, the Mexican experience as inferiority is really a foundational (or ontological) insufficiency that describes every finite, mortal, and bounded human experience (Uranga 1952 [2021])[^uranga-1952][^uranga-1952-2]. Recognition of insufficiency is, as is the case with accidentality, empowering. By recognizing and accepting this existential and ontological insufficiency, Mexicans are always closer to the truth of being human and, in in doing so, are far more authentic than their European/North American counterparts. In short, insufficiency describes the mode of being of the human as always already deficiency in being—in existential terms, it describes the human being’s perpetual project of becoming.
    step1: |-
      “不足”［*Insuficiencia*］是偶在性的一种模态。它是心理学“自卑情结”的本体论对应物。后者是一种无力与不称职的*感受*，当人面对某种显得优越或“更好”的东西时，这种感受可能压倒人。这一概念最初是为回应萨穆埃尔·拉莫斯（1934）的提议而提出的：拉莫斯认为，墨西哥民族的一个本质特征是一种共同的卑下感，它解释了墨西哥人对自己、对彼此的大部分行为。针对拉莫斯，乌兰加论证说，墨西哥人的自卑情结只是一种更深层的*人的*状况的症状，即作为不足而被经验的偶在性。换句话说，墨西哥人作为卑下的经验，其实是一种基础性的（或本体论的）不足，它描述着每一种有限的、有死的、受限的人类经验（Uranga 1952 [2021]）[^uranga-1952][^uranga-1952-2]。对不足的认出，与偶在性的情形一样，具有赋能作用。通过认出并接受这种存在论与本体论上的不足，墨西哥人始终更接近“作为人”的真理，也因此比他们的欧洲／北美同行本真得多。简言之，不足描述的是人这种存在者的存在方式：总是已经在存在上有所欠缺；用存在主义的话说，它描述的是人这种存在者永不停歇的“生成”计划。
    step2: |-
