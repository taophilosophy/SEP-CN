      But how does one choose one’s commitments and responsibilities? Leopoldo Zea proposes a hierarchy of commitments and responsibilities, where commitment to and responsibility for one’s concrete situation or circumstance sits at the top, while commitment to or responsibility for ideas or abstractions fall somewhere below that. He writes: “Committing ourselves to the universal and the eternal, without making a single concrete commitment, does not commit us to anything” (Zea 1952 [2017: 138])[^zea-1952]. For instance, as philosophers, it is possible to commit ourselves to ideals or abstractions, such as universal moral imperatives. However, it is more valuable and worthwhile, Zea proposes, if we commit ourselves to ideas and concepts connected to what we actually see and experience. This is because for Zea, “existentialism does not wish to elude reality, does not evade it, it confronts it, assuming it with all of its consequences” (Zea 1949)[^zea-1949].
    step1: |-
      但人如何选择自己的承诺与责任呢？莱奥波尔多·塞亚提出一种承诺与责任的层级：对自己的具体处境或境遇的承诺与责任居于顶端，而对观念或抽象的承诺与责任则居于其下某处。他写道：“献身于普遍与永恒，却不作任何一项具体承诺，那不会使我们承诺于任何东西”（Zea 1952 [2017: 138]）[^zea-1952]。例如，作为哲学家，我们有可能献身于理想或抽象，比如普遍的道德律令。然而塞亚提出，如果我们献身于与实际所见所经验之物相联系的观念与概念，那就更有价值、更值得。因为对塞亚来说，“存在主义不愿逃避现实，它不回避现实，而是面对现实，连同其一切后果一起承担它”（Zea 1949）[^zea-1949]。
    step2: |-
      可人怎么选择自己的承诺与责任？塞亚给出一个层级：对自身具体处境或境遇的承诺与责任居首，对观念或抽象的承诺与责任则排在下面。他写道：“献身于普遍与永恒，却不肯作出哪怕一项具体承诺，这不会使我们承诺于任何东西”（Zea 1952 [2017: 138]）[^zea-1952]。举例来说，身为哲学家，我们当然可以献身于理想或抽象，比如普遍的道德律令。但塞亚认为，若献身于与实际所见所经验之物相关的观念与概念，那更有价值、更值得。因为在他看来，“存在主义不愿逃避现实，也不回避现实；它直面现实，连同一切后果一起承担”（Zea 1949）[^zea-1949]。
