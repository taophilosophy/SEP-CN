      Emilio Uranga defines human fragility as “the quality of always being threatened by nothingness, by the threat of falling into non-being” (1951 [2017: 167]). Fragility is an “ontological condition” like insufficiency that defines the “being of Mexican being.” For Mexicans (or so say the Mexican existentialists), this fragility is manifested as “melancholy” and “unwillingness” (*desgana*). Importantly, melancholy is more fundamental than either fragility and unwillingness, as it exposes us as beings without ground and without reason for being (Ramírez 2022: 53)[^ramírez-2022]. Unwillingness differs from melancholy in that it is a response to it; it does not refer to a *lack of will*, but to a *willingness to refuse* to exercise it because *there is no point* in doing so. Said differently, it is not that one lacks the will to do X, but that one refuses to do X for some reason, including “repulsion,” “disgust,” or procrastination—“leaving everything for ‘tomorrow’” (Uranga 1951 [2017: 167])[^uranga-1951][^uranga-1951-2]. One sees the world as disgusting, for example, when participating in its rituals bring me closer to something that I hate or with which I don’t want to associate. “Unwillingness is precisely the disgust that overtakes us when we foresee that our action might contribute to a consolidation of the abject sense of things. All action is therefore valued, in unwillingness, within the horizon of its contribution to depravity and corruption” (168). Uranga’s notion of unwillingness could be interpreted as laziness, which the term seems to imply; but unwillingness here is thought to be imbued with power. It is a form of resistance to *not* participate in the world. The unwilling man, writes Uranga, “sees a meaningful process that beckons his collaboration, his decision, his action, and that demands to be fulfilled by a *surplus* of determination” (167); in spite of this call, however, or against it, the unwilling person refuses to act, or *chooses not to choose*. Unwillingness is an intentional indifference having less to do with incapacity or inability and more to do with power, or resistance. However, for the Mexican existentialists, the downside of unwillingness is that the unwilling lose out on the opportunity to be historical, to impact the world. On the other hand, the willing (or the “generous”) make “a determined choice to collaborate, a will to sympathize, to enter into auxiliary contact with things, with history, with social movements, of adding or synthesizing the capacity for teleological determination that emanates from freedom with the causality that weighs things down, with the dialectical course of the world that straightens itself toward a goal but which without that *surplus* of determination can degrade or minimize itself into inadequate compromises” (167). Mexican existentialists point to unwillingness so that it may be avoided. It should be avoided because nothing changes if one is unwilling to “collaborate.” And if nothing changes, everything stays the same, including whatever oppressive conditions one may be presently enduring.
    step1: |-
      埃米利奥·乌兰加把人的脆弱定义为“总是受到虚无之威胁、受到坠入非存在之威胁的品质”（1951 [2017: 167]）。脆弱是一种“本体论状况”，与不足一样，定义着“墨西哥存在的存在”。对墨西哥人来说（墨西哥存在主义者如是说），这种脆弱表现为“忧郁”与“不欲”（*desgana*）。重要的是，忧郁比脆弱与不欲都更根本，因为它把我们就暴露为无根据、无存在理由的存在者（Ramírez 2022: 53）[^ramírez-2022]。不欲与忧郁不同：它是对忧郁的一种回应；它并不指*意志的缺乏*，而指一种*拒绝*行使意志的*意愿*，因为这样做*没有意义*。换句话说，不是人缺乏做 X 的意志，而是人出于某种理由——包括“厌恶”“恶心”或拖延——“把一切都留给‘明天’”——而拒绝做 X（Uranga 1951 [2017: 167]）[^uranga-1951][^uranga-1951-2]。比如，当参与世界的仪式使我更接近我所憎恨、或不愿与之往来之物时，我就觉得这世界令人恶心。“不欲恰恰是当我们预见自己的行动可能有助于巩固事物的卑劣意义时，将我们攫住的那种恶心。因此，在不欲中，一切行动都在其对堕落与腐败的贡献这一视野内被评价”（168）。乌兰加的不欲概念可以被解释为懒惰，该词似乎也暗示这一点；但这里的不欲被认为充满了力量。它是一种*不*参与世界的抵抗形式。乌兰加写道，不欲的人“看见一个有意义的过程，召唤着他的合作、他的决定、他的行动，并要求以一种*盈余*的规定来充实它”（167）；然而，尽管有这一召唤、或逆着它，不欲的人仍拒绝行动，或*选择不选择*。不欲是一种有意向的漠然，与其说关乎无能力或不能，不如说关乎力量或抵抗。然而，对墨西哥存在主义者来说，不欲的缺点是：不欲者错失了成为历史性的、影响世界的机会。另一方面，有意愿者（或“慷慨者”）作出“一种合作的坚决选择，一种共情的意愿，愿与事物、与历史、与社会运动建立辅助性接触，愿把从自由中流出的目的论规定能力，与压住事物的因果性、与世界那朝目标自我校正的辩证进程结合起来——若无那份规定的*盈余*，这一进程可能退化为或缩水为不充分的妥协”（167）。墨西哥存在主义者指出不欲，是为了让人避开它。之所以应当避开，是因为人若不欲“合作”，就什么都不会变。而若什么都不变，一切就照旧，包括人当下可能正在忍受的任何压迫状况。
    step2: |-
      乌兰加把人的脆弱界定为“总受虚无威胁、总有坠入非存在之虞的品质”（1951 [2017: 167]）。脆弱是一种“本体论状况”，同“不足”一样，规定着“墨西哥存在之存在”。墨西哥存在主义者说，在墨西哥人身上，这种脆弱表现为“忧郁”与“不欲”（*desgana*）。要紧的是，忧郁比脆弱和不欲都更根本：它把我们暴露为没有根基、没有存在理由的存在者（Ramírez 2022: 53）[^ramírez-2022]。不欲不同于忧郁：它是对忧郁的回应；它并不指*没有意志*，而指*不愿*动用意志，因为这么做*没有意义*。换句话说，不是人没有意志去做某事，而是人为某个理由拒绝去做——“厌恶”“恶心”，或者拖延，把那件事“留给明天”（Uranga 1951 [2017: 167]）[^uranga-1951][^uranga-1951-2]。比如，参加世上的仪式若使我更靠近我所憎恶、不愿沾染的东西，我就会觉得这世界令人恶心。“不欲恰恰就是那种恶心：当我们预见自己的行动可能帮着把事物的卑劣意义夯实，它便攫住我们。所以在不欲里，一切行动都要按其助长堕落与腐败的程度来估价”（168）。乌兰加说的“不欲”容易被读成懒惰——这个词看似有此含义；但在这里，不欲被看成充满力量的东西。它是一种*不*参与世界的抵抗。乌兰加写道，不欲的人“看见一个有意义的过程在召唤他去合作、去决定、去行动，要求他以一份*盈余*的决断去充实它”（167）；可面对这一召唤、甚至顶着它，不欲的人偏偏拒绝行动，或者*选择不选择*。不欲是一种有意的漠然：与其说关乎无能或无力，不如说关乎力量、关乎抵抗。不过，在墨西哥存在主义者看来，不欲的坏处在于：不欲者失去了成为历史性存在、影响世界的机会。反过来，有意志的人（“慷慨者”）会“坚决地选择合作，怀着共情之意，与事物、历史、社会运动建立辅助性的联系，把源自自由的目的论规定能力，加在压住事物的因果性上、加在世界那朝目标自我校正的辩证进程上——若无这份规定的*盈余*，这一进程就会退化成、萎缩成不充分的妥协”（167）。墨西哥存在主义者标出不欲，是为了让人避开它。之所以要避开，是因为人若不肯“合作”，就什么都不会变；而什么都不变，一切照旧，包括你眼下正在忍受的那些压迫。
