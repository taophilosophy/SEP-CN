      Echoing Sartre and the European existentialist tradition, Zea says that “every person is a committed agent, that is, inserted, *thrown*, or placed in a world in which they must act and for which they must be responsible” (Zea 1952 [2017: 126])[^zea-1952]. Where Zea diverges is in suggesting that the world in which we are thrown is not “the world,” or that abstract landscape where “mankind” or “humankind” makes its home; the world of Zea and the Mexican existentialists is the non-European world, the conquered, colonized, and peripheral world of the non-European “other”—the Americas (Larroyo 1951)[^larroyo-1951]. As Uranga puts it: “There is no world which is pure, neither is there pure consciousness; rather, there is always a consciousness in a situation, or commitment, which means at once a thrownness toward the world and the possibility to return to it so as to acquire a consciousness of the sense and essence of our commitment” (Uranga 1949: 227)[^uranga-1949]. Once consciousness of the particularity of this, Mexican, world is “acquired” then the choice becomes clear: to commit or to flee, to be responsible or to be unwilling. For Zea, as with the rest of the Mexican existentialist, fleeing and unwillingness are not authentic options: “We have to take responsibility for a past not of our making: yet at the same time, with our attitude, whatever it might be, we commit and take responsibility for a future that must be made by us. In this way, we are responsible for others in the presence of others. This, in short, is the essence of commitment” (1952 [2017: 127]). In Mexico, as in other historical geographies with a defined colonial inheritance, the sort of commitments and responsibilities that Zea and Uranga have in mind involve confronting the colonial past, challenging it, and, ultimately overcoming it, while keeping a firm grasp on the future. This sort of work is done via political action, journalism, speaking for those who cannot speak for themselves, and the kind of critical unmasking of which philosophy is capable. In this sense, commitment to philosophy is a form of responsibility.
    step1: |-
      呼应萨特与欧洲存在主义传统，塞亚说“每个人都是一个有所承诺的行动者，也就是说，被插入、*被抛*或安置在一个世界中，他必须在那里行动，并必须为之负责”（Zea 1952 [2017: 126]）[^zea-1952]。塞亚的不同之处在于：我们被抛入的世界并不是“世界”，也不是“人类”或“人性”安家的那个抽象景观；塞亚与墨西哥存在主义者的世界是非欧洲的世界，是被征服、被殖民的边缘世界，是非欧洲“他者”的世界——美洲（Larroyo 1951）[^larroyo-1951]。正如乌兰加所说：“没有纯粹的世界，也没有纯粹的意识；有的始终是处境中的、或承诺中的意识，这同时意味着一种朝向世界的被抛性，以及回到世界、从而获得关于我们承诺之意义与本质的意识的可能性”（Uranga 1949: 227）[^uranga-1949]。一旦“获得”对这个特定的、墨西哥的世界的特殊性的意识，选择就变得清楚了：承诺还是逃离，负责还是不欲。对塞亚以及其余墨西哥存在主义者来说，逃离与不欲都不是本真的选项：“我们必须为一个并非我们所造的过去负责；但同时，无论我们的态度如何，我们都在承诺并为一个必须由我们造就的未来负责。这样，我们在他人的在场中为他人负责。简言之，这就是承诺的本质”（1952 [2017: 127]）。在墨西哥，如同在其他具有明确殖民遗产的历史地域，塞亚与乌兰加所想的那种承诺与责任，涉及直面殖民的过去、挑战它、并最终克服它，同时牢牢把握未来。这类工作通过政治行动、新闻写作、为不能为自己发声者代言，以及哲学所能做的那种批判性揭蔽来完成。在这个意义上，对哲学的承诺是一种责任形式。
