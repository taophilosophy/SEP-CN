      塞亚呼应萨特与欧洲存在主义传统：每个人都是“有所承诺的行动者”——被插入、*被抛*或安置在一个世界里，他必须在那里行动，也必须为之负责（Zea 1952 [2017: 126]）[^zea-1952]。塞亚的不同在于：我们被抛入的这个世界，不是“世界”，不是“人类”安家的那片抽象风景。塞亚与墨西哥存在主义者的世界，是非欧洲的世界，是被征服、被殖民的边缘世界，是非欧洲“他者”——美洲——的世界（Larroyo 1951）[^larroyo-1951]。乌兰加说得好：“没有纯粹的世界，也没有纯粹的意识；有的永远是处境中的意识、承诺中的意识。这既是朝世界而去的一种被抛，也是回到世界、以取得对我们承诺之意义与本质的意识的可能性”（Uranga 1949: 227）[^uranga-1949]。一旦“取得”对这个特定的墨西哥世界之特殊性的意识，选择就清楚了：承诺还是逃离，负责还是“不欲”。对塞亚和其余墨西哥存在主义者来说，逃离与“不欲”都不是本真选项：“我们必须为一个并非自己造就的过去担责；但与此同时，无论采取什么态度，我们都在承诺，并为一个必须由我们造就的未来担责。我们就以这种方式，在他人的面前为他人负责。简言之，这就是承诺的本质”（1952 [2017: 127]）。在墨西哥，如同在其他有着明确殖民遗产的历史地域，塞亚与乌兰加心目中的承诺与责任，意味着直面殖民的过去、挑战它，最终克服它，同时牢牢抓住未来。这类活计靠政治行动、新闻写作、为无法发声者发声，以及哲学特有的批判性揭蔽来完成。就此而言，对哲学的承诺本身就是一种担责。
