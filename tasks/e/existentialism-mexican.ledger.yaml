  - id: 3
    kind: body
    source: |-
      European existentialism made its way into Mexico in the late 1930s. A growing enthusiasm among young Mexican intellectuals for philosophical analyses of situated existence helped its spread. By the early 1940s, popular seminars on Martin Heidegger’s *Being and Time* fueled a growing interest into a “Mexican Dasein,” or Mexican existence. These seminars were led by recent European arrivals, Spanish exiles fleeing the Spanish Civil War (1936–1939). Crucial amongst these are José Gaos and Juan David García Bacca (1901–1992) who, through lectures, books, and translations laid the groundwork for a unique and impassioned appropriation of existentialism that would come to define Mexican philosophy for years to come. Ultimately, what is now called “Mexican existentialism” emerges from readings and reaction to Heidegger and the French existentialists (particularly Sartre, Merleau-Ponty, and others) originally introduced by Gaos, Bacca, and others. Key to its growth were the efforts of *el* *grupo Hiperión*, or the Hyperion Group (named after one of the twelve Greek Titan gods [Reyes 2004: 15])[^reyes-2004]. Between 1947 and 1952, Hyperion read, interpreted, and promoted a version of French and German existentialism that they then applied to their own and unique historical, cultural, and existential moment. Some members of the Group believed that existentialism offered the conceptual resources necessary to bring about “*moral, social, and religious transformations*” in Mexican society (Uranga 1952 [2021: 94])[^uranga-1952][^uranga-1952-2] and “the very instrument with which to interpret Mexican reality” (Zea 1968: 12)[^zea-1968]. Others, like Portilla, were a bit more dramatic, suggesting that the existentialist attitude was the natural attitude of Mexicans, especially given their history of struggle and overcoming, writing, “it might be said that we Mexicans are existentialist from birth” (Portilla 1949 [2017: 186])[^portilla-1949].
    step1: |-
      欧洲存在主义于 1930 年代末传入墨西哥。年轻的墨西哥知识分子对“处境中的存在”之哲学分析日益热情，助长了它的传播。到 1940 年代初，关于马丁·海德格尔《存在与时间》的通俗研讨班催生了对“墨西哥此在”或墨西哥存在的日渐兴趣。这些研讨班由新近到来的欧洲人主持，他们是为躲避西班牙内战（1936–1939）而流亡的西班牙人。其中最关键的是何塞·高斯与胡安·大卫·加西亚·巴卡（1901–1992）：他们通过讲座、著作与翻译，为一种独特而充满激情的存在主义挪用奠定了基础，而这种挪用后来定义了此后多年的墨西哥哲学。最终，如今所谓“墨西哥存在主义”，正是出自对海德格尔与法国存在主义者（尤其是萨特、梅洛-庞蒂等人）的阅读与回应，而这些最初是由高斯、巴卡等人引入的。其成长的关键是 *el grupo Hiperión*（许珀里翁小组）的努力（得名于希腊十二提坦神之一 [Reyes 2004: 15]）[^reyes-2004]。1947 至 1952 年间，许珀里翁小组阅读、解释并推广了一种法德存在主义版本，随后把它应用于他们自己独特的历史、文化与存在时刻。小组的一些成员相信，存在主义提供了必要的概念资源，足以在墨西哥社会中促成“*道德的、社会的与宗教的转变*”（Uranga 1952 [2021: 94]）[^uranga-1952][^uranga-1952-2]，并成为“用来解释墨西哥现实的工具本身”（Zea 1968: 12）[^zea-1968]。另一些人如波蒂利亚则更戏剧化一些，认为存在主义态度是墨西哥人的自然态度——尤其考虑到他们抗争与克服的历史——他写道：“或许可以说，我们墨西哥人天生就是存在主义者”（Portilla 1949 [2017: 186]）[^portilla-1949]。
    step2: |-
      欧洲存在主义在 1930 年代末传入墨西哥，借助的是年轻墨西哥知识分子对“处境中的存在”之哲学分析日益高涨的热情。1940 年代初，关于海德格尔《存在与时间》的通俗研讨班又催生了对“墨西哥此在”即墨西哥存在的兴趣。主讲者多为新近抵墨的欧洲人——为躲避西班牙内战（1936–1939）而流亡的西班牙人；其中最关键的是何塞·高斯与胡安·大卫·加西亚·巴卡（1901–1992）。他们通过讲座、著作和翻译，为一种独特而炽烈的存在主义挪用铺好了路，此后多年的墨西哥哲学由此定型。归根结底，今日所谓“墨西哥存在主义”，来自后来的墨西哥人对海德格尔与法国存在主义者（尤其是萨特、梅洛-庞蒂等人）的阅读与回应，而这些人最初是由高斯、巴卡等人引进的。推动它成长的，是“许珀里翁小组”（*el grupo Hiperión*，得名于希腊十二提坦神之一 [Reyes 2004: 15]）[^reyes-2004]。1947 至 1952 年间，小组阅读、阐释并推介一种法德存在主义版本，再把它用于自身独特的历史、文化与存在处境。有些成员相信，存在主义提供了在墨西哥社会促成“*道德、社会与宗教转变*”所需的概念资源（Uranga 1952 [2021: 94]）[^uranga-1952][^uranga-1952-2]，是“诠释墨西哥现实的现成工具”（Zea 1968: 12）[^zea-1968]。波蒂利亚等人则更戏剧化：他们主张，存在主义态度就是墨西哥人的自然态度——尤其考虑到墨西哥人抗争与克服的历史——他写道：“或许可以说，我们墨西哥人生来就是存在主义者”（Portilla 1949 [2017: 186]）[^portilla-1949]。
