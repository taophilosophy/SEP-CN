      #### 4.2.4 Metrically Amorphous Time
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      Richard Swinburne originally defends timelessness (Swinburne 1965)[^swinburne-1965], but then switches allegiance to a temporal view. According to his later view, before creation God lives alone in a metrically amorphous time (Swinburne 1977, 1993, 1994)[^swinburne-1977]. (Padgett also describes God’s time as metrically amorphous.) Once God creates the world and institutes the laws of nature, time acquires a metric. There then begin to be facts of the matter about how long temporal intervals are.
