      Various versions of this argument have been defended (Craig 2000, 2001; DeWeese 2004; Hasker 2002; Kretzmann 1966; Padgett 1992, 2001; Wolterstorff 1975; Mullins 2016: Ch. 4)[^craig-2000][^deweese-2004][^hasker-2002][^kretzmann-1966][^mullins-2016][^padgett-1992][^wolterstorff-1975]. Since many participants of the debate think the A-theory is true, it is treated as an argument for divine temporality. In response, advocates of timelessness challenge one or more of the argument’s premises (Wierenga 1989, 2002; Alston 1989a; Ganssle 1993, 1995, 2002)[^alston-1989a][^ganssle-1993][^wierenga-1989]. Others respond by giving up on the A-theory and accepting the B-theory (Helm 1988, 2001; Rogers 2000)[^helm-1988][^rogers-2000]. The thought is that this argument can’t be run for the B-theory, since on the B-theory, the fundamental (tenseless) temporal facts don’t change. The parallel argument would get stuck at the analogue of step (5): it’s not the case that if God knows fundamental tenseless facts, then what God knows changes. So while the argument itself is silent on whether the B-theory allows one to combine timelessness with omniscience, part of the point of making it is that the parallel argument can’t be run for the B-theory.
    step1: TBD
    step2: TBD
