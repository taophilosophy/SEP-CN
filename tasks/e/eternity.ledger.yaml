      ## 2. 方法论
  - id: 9
    kind: body
    source: |-
      This discussion inherits the complexities of two very intricate philosophical debates (about God, and about time). Given the nature of the topic, it is perhaps not unreasonable to wonder what methodology can be fruitfully employed here.
    step1: |-
      这一讨论继承了两场极为繁难的哲学辩论（关于上帝与关于时间）的种种复杂性。鉴于论题的性质，想知道在这里能够卓有成效地运用什么方法论，或许并非不合理的疑问。
    step2: |-
      本题坐拥两场出了名繁难的哲学辩论（上帝与时间）的全部复杂性。题目如此，想知道这里能有什么方法论派得上用场，也就情有可原。
  - id: 10
    kind: body
    source: |-
      As the topic is the God of Western theism, there are constraints arising from relevant passages in Western Scripture. Much of the discussion focuses on the Judeo-Christian, especially the Christian, tradition. (But note that specific Christian doctrines such as the doctrine of the Trinity or the Incarnation, while closely related, are not the focus here; for more on these, see, e.g., (Le Poidevin 2023).) The Bible contains many passages calling God eternal, as well as ones that elaborate on God’s eternality. For example, there are passages telling us that God’s “years have no end” (Ps. 102:27, all quotations are from the New Revised Standard Version) and that God exists “from everlasting to everlasting” (Pss. 90:2, 103:17). God says, “let there be lights in the dome of the sky to separate the day from the night, and let them be for signs and for seasons and for days and years” (Gen. 1:14), and “I am the first and I am the last” (Isa. 44:6). Moreover, we are told that God promised us eternal life “before the ages began” (Titus 1:2), and that “He himself is before all things” (Col. 1:17). These passages require interpretation, and that’s where the philosophical work begins (see, e.g., Leftow 2005 for a formulation of constraints based on these passages)[^leftow-2005].
    step1: |-
      由于论题是西方有神论的上帝，西方圣经中的相关经文便构成约束。讨论大多聚焦于犹太—基督教传统，尤其是基督教传统。（但要注意，三位一体、道成肉身这类特定基督教教义虽与本论题密切相关，却不是这里的焦点；欲知其详，可参见 Le Poidevin 2023。）圣经中有许多称上帝为永恒的段落，也有详述上帝永恒性的段落。例如，有经文告诉我们，上帝的“年数没有穷尽”（诗 102:27；引文均出自新修订标准版，中译参用和合本），上帝存在“从亘古到永远”（诗 90:2, 103:17）。上帝说：“要有天穹的光体，可以分昼夜，作记号，定节令、日子、年岁”（创 1:14），又说“我是首先的，我是末后的”（赛 44:6）。此外，经文告诉我们，上帝在“万古之先”便应许了我们永生（多 1:2），“他在万有之先”（西 1:17）。这些段落需要诠释，哲学工作正由此开始（关于基于这些段落的约束表述，见如 Leftow 2005）[^leftow-2005]。
    step2: |-
      论题既然是西方有神论的上帝，西方圣经里的相关经文就成了绕不开的约束。讨论多落在犹太—基督教传统上，尤以基督教传统为重。（要留意：三位一体、道成肉身这类特定教义虽与本论题近亲，却不在本文焦点之列；详参 Le Poidevin 2023。）圣经里称上帝为永恒的段落俯拾即是，铺陈上帝永恒性的段落也不少。比如：上帝的“年数没有穷尽”（诗 102:27；引文均出自新修订标准版，中译参用和合本）；上帝存在“从亘古到永远”（诗 90:2, 103:17）；上帝说“要有天穹的光体，可以分昼夜，作记号，定节令、日子、年岁”（创 1:14）、“我是首先的，我是末后的”（赛 44:6）；还有经文说，上帝在“万古之先”就应许了永生（多 1:2），“他在万有之先”（西 1:17）。这些段落等着被诠释——哲学的活儿就从这里起步（基于这些段落的约束表述，参 Leftow 2005）[^leftow-2005]。
  - id: 11
    kind: body
    source: |-
      One broad methodological choice concerns whether or not to let one’s theological commitments determine one’s views about the metaphysics, or even the physics of time. A salient alternative would be to do the opposite, for example by taking as one’s starting point the metaphysical view of time suggested by our best physical theories and then drawing out any theological implications. A third approach might involve giving equal weight to both poles and seeking to come to a coherent and adequate conception of both time and God as part of the same endeavor. There probably exist a variety of stances across the philosophical and theological landscapes (for explicit reflection on related methodological questions see, e.g., Murray & Rea 2008: 47; Mullins 2016: Ch. 1)[^mullins-2016][^murray-2008].
    step1: |-
      一个宽泛的方法论抉择，涉及是否让自己的神学承诺来决定自己关于时间形而上学乃至时间物理学的观点。一个显著的替代做法是反其道而行：例如以我们最好的物理理论所提示的时间形而上学观为出发点，再引出神学蕴涵。第三条路或许是对两极等量齐观，在同一场事业中力求对时间与上帝都得到一个融贯而充分的构想。哲学与神学版图上大概存在多种多样的立场（对相关方法论问题的明述反思，见如 Murray & Rea 2008: 47；Mullins 2016: 第 1 章）[^mullins-2016][^murray-2008]。
    step2: |-
      头一个大的方法论抉择：要不要让你的神学承诺反过来支配你对时间形而上学——甚至时间物理学——的看法。也有人反着来：从最好的物理理论所暗示的时间形而上学出发，再倒推神学蕴涵。还有第三条路：两端等量齐观，把时间和上帝放进同一场事业里，一并求一个融贯而充分的图景。哲学家与神学家的阵地上，各种站位大概都有（对这类方法论问题的明说，参 Murray & Rea 2008: 47；Mullins 2016: 第 1 章）[^mullins-2016][^murray-2008]。
