      For every $x$ and every $y$, $x$ and $y$ are ET-simultaneous if and only if i. either $x$ is eternal and $y$ is temporal, or vice versa (for convenience, let $x$ be eternal and $y$ temporal); and
    step1: TBD
    step2: TBD
