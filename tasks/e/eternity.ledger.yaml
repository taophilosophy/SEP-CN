      #### 4.2.3 Timeless Without and Temporal With Creation
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      William Lane Craig’s view is that God is timeless without creation, and temporal with creation (Craig 2000)[^craig-2000]. God exists timelessly “without” creation rather than before creation, because there isn’t literally a before. And so it can’t literally be the case that God becomes temporal, since becoming anything involves being first one thing and then the other. Nonetheless, God is “timeless without creation and temporal subsequent to creation ”, God “enters time at the moment of creation” (Craig 2000: 33)[^craig-2000]. God exists changelessly and timelessly, but by creating, God undergoes an extrinsic change “which draws Him into time” (Craig 2000: 29)[^craig-2000].
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      The problem is that even extrinsic change still presupposes a before and after (Leftow 2005: 66)[^leftow-2005]. Craig is aware of the difficulty:
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      > [O]n such a view, there seem to be two phases of God’s life, a timeless phase and a temporal phase, and the timeless phase seems to have existed earlier than the temporal phase. But this is logically incoherent, since to stand in a relation of *earlier than* is by all accounts to be temporal. (Craig 2000: 32)[^craig-2000]
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      His solution is
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      > that “prior” to creation there literally are no intervals of time […] no earlier and later, no enduring through successive intervals and, hence, no waiting, no temporal becoming. This state would pass away, not successively, but as a whole, at the moment of creation, when time begins.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      And this state, he says, “looks suspiciously like a state of timelessness” (Craig 2000: 33)[^craig-2000].
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      But this solution looks suspiciously like a re-statement of the view. The problem was that we could only talk of a “before” in quotation marks. Yet we needed there to literally be such a before on the view in question. (This is unless we decline to make literal sense of all this, but that is not Craig’s approach.) What can it mean to say God underwent a change at the end of which God was temporal? Craig’s answer seems to be that there is timelessness before time’s beginning, or rather, “before” time’s beginning.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Craig endorses Padgett’s distinction between “Measured Time” and “Ontological Time” (God’s time). Unlike Padgett, he identifies the latter with Newton’s absolute time. He defends a “neo-Lorentzian” interpretation of special relativity, according to which there is a privileged reference frame that is in principle undetectable due to the effective Lorentz invariance of the dynamical laws. In addition, he points to the cosmic time of some general relativistic spacetime models as a candidate for absolute time. Each of these claims is made in support of a strong prior commitment to the A-theory, shared with Padgett. However, each claim faces problems, and their connection is unclear, since the “neo-Lorentzian” approach to special relativity doesn’t allow for as natural a development in the direction of general relativity as does the standard approach (see, e.g., Balashov & Janssen 2003, Wüthrich 2013)[^balashov-2003][^wüthrich-2013].
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Craig and Padgett differ over whether cosmic time gives a “proper measure” of God’s time, and thus effectively over whether, on this kind of view, we have any epistemic access to God’s time (which we are also in). Craig answers in the affirmative, but still hesitates to identify cosmic time with God’s time, preferring instead to say that the two “coincide” (Craig 1990: 344)[^craig-1990].
    step1: TBD
    step2: TBD
