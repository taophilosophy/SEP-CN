    kind: body
    source: |-
      According to the B-theory (tenseless theory, block universe view), (a) all times and/or events exist and are equally real (this is known as eternalism—not to be confused with divine timelessness which has also sometimes gone by the same name); and (b) there is a complete tenseless description of temporal reality. A tenseless description is one that stays accurate, because it mentions only such things as which events happen when, and how they are temporally related to one another. So it mentions only facts about B-relations like simultaneity and succession. Call these tenseless facts. The B-theory combines eternalism with the claim that there is a complete description of temporal reality, a description of temporal reality at its most fundamental, that doesn’t mention any tensed facts, like that it’s 12:00 now.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Opposed to this are various versions of the A-theory, which deny one or both of (a) and (b). What these A-theoretic views (including eternalist and non-eternalist ones, like presentism or the growing block view) have in common is that they metaphysically privilege one time. Fundamental tensed facts capture this privilege. One prominent motivation for the A-theory is the conviction that time passes (robustly—i.e. in a sense that goes beyond mere B-theoretic temporal succession (see Skow 2015: 2)[^skow-2015]; in what follows that’s what I mean by “temporal passage”). As time passes, the tensed facts change: first it’s a fundamental fact that it’s 12:00, then that it’s 12:01.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Now return to Leftow’s view. Let A-occurring be occurring now, and let B-occurring be occurring at a certain temporal location *t* that is now. (This is intended to be continuous with McTaggart’s distinction.) B-occurring entails A-occurring: if something occurs at a temporal B-location *t* that is now, it occurs now. But not vice versa. Something can occur now without occurring at a temporal B-location *t* that is now. Something can, that is, A-occur without B-occurring. Now define A-simultaneity as occurring “at the same now”. B-simultaneity, by contrast, is having the same temporal B-location in some B-series. If two events are B-simultaneous and they B-occur (i.e. they are located at the same B-temporal location that is now), they are A-simultaneous. And if two events occur at the same atemporal now and A-occur (i.e. occur now), they are also A-simultaneous.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      The upshot is that
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      > the A-simultaneity that obtains between a timeless God and temporal entities is univocal with the A-simultaneity that obtains between temporal entities. (Leftow 1991: 239)[^leftow-1991]
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      This would make the relation between temporal entities and the timeless God less mysterious than it is on the Stump & Kretzmann proposal, on which ET-simultaneity is sui generis, obtaining only between one temporal and one eternal relatum.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      But this seems to be an advance that was gained by stipulation, because the discussion started thus: “[L]et us so understand ‘now’ that occurring now does not entail having a position in a B-series of earlier and later events. That is, let us in effect take ‘now’ and ‘occurring now’ as primitive terms univocally applicable to temporal and eternal or timeless things” (Leftow 1991: 239)[^leftow-1991]. It’s not surprising that given this initial stipulation, the ensuing definitions allow one to say that the A-simultaneity that obtains between temporal entities is the same relation that obtains between a timeless God and temporal entities.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      According to Leftow, there can be no change in (timeless) eternity, and in eternity, all events happen (A-) simultaneously. However, in some places eternity is instead described as involving succession, namely as consisting of a number of different B-series corresponding to different temporal reference frames (Leftow 1991: 239)[^leftow-1991]. *Prima facie*, these are different, incompatible ideas. B-theorists, who hold that time, fundamentally, consists of events standing in B-relations of precedence and simultaneity, do not also hold that all of time collapses to a single time.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      This is relevant to the notion of Quasi-Temporal Eternality (QTE, Leftow 1991: 120–2)[^leftow-1991]. Unlike Stump & Kretzmann, Leftow holds that atemporal duration, understood as QTE, involves distinct points but not parts. These points are (at least in some sense) earlier and later than one another, but they do not stand in the relation of succession. This seemingly paradoxical claim is partly defended via appeals to the B-theory. The idea is that Boethian eternity is like an extension in B-time, and that a QTE being’s life contains earlier and later points with no succession between them. In this respect, we are told, it is like life in B-time, only without an illusion of temporal passage.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      There is a danger here of misinterpreting the B-theory. While the B-theory doesn’t posit temporal passage, it does posit succession. Relatedly, the traditional project of squaring our temporal experience with the B-theory is about explaining away an illusion of temporal passage, not about explaining away an illusion of temporal succession (see the entry on the temporal consciousness). Since the B-theory posits succession (a B-relation), an experience of succession is non-illusory, on the B-theory. This makes trouble for Leftow’s appeals to the B-theory. After all, Leftow holds that a QTE being’s life, in which all times are experienced at once, is what a non-illusory experience of B-time would be like (Leftow 1991: 122)[^leftow-1991]. In other words, the thought is that an experience of temporal succession is illusory, on the B-theory.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Leftow also suggests that the sense in which QTE involves earlier and later points is not a temporal one, but a logical one. However, logical priority is not temporal priority, nor is it relevantly like temporal priority (Rogers 1994: 11)[^rogers-1994].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      A more recent idea is that of a typically temporal property (TTP). A property is a TTP if a term predicating it is “part of a definition of being temporal or figures appropriately in the right sort of nondefining sufficient condition for being temporal” (Leftow 2002)[^leftow-2002]. The right sort is for example “necessarily, whatever is past was temporal” rather than “necessarily, whatever is a pig is temporal”. The thought is that just like being bipedal helps make us human without being sufficient for making us human, so, e.g., being present helps make things temporal without being sufficient for making things temporal (and so there can be an timeless eternal present a la Boethius).
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      ### 4.2 Divine Temporality
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      In recent times, there has been a notable shift away from divine timelessness. There are many different kinds of views that fall under the heading of divine temporality; many of these could also be classified as “intermediate” views. As in 4.1, the list is of course far from exhaustive.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Note that while Open Theism has been part of the shift away from divine timelessness, the position arises specifically in relation to the topic of divine foreknowledge. Open Theism says that God does not know which choices we will freely make in the future, because there is nothing yet to be known; here, free choice is understood along libertarian lines and the future is taken to be genuinely open in some metaphysically significant sense. For more on Open Theism, see Pinnock et al. 1994, Zimmerman 2010, Rice 2020, Rissler (Other Internet Resources), and the SEP entry on divine foreknowledge.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      #### 4.2.1 Pure Temporalism
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      On this view, God is located at all times, God experiences succession, and God has lived through and will live through a non-finite past and future. The idea here is that God is in (our, physical) time/spacetime, and God is a temporal being in just the way we are, except that the temporal extent of God’s life is infinite. Compared to other temporal views, this one is conceptually straightforward. Arguably, however, it is in tension with current cosmology, which suggests that the universe has a finite past. Insofar as the view implies that God is bound by, or has no power over time, it may also be at odds with some of the constraints arising from Western Scripture (see section 2). The view is found at least in process theologians like Charles Hartshorne (Hartshorne 1947)[^hartshorne-1947].
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      #### 4.2.2 Relative Timelessness
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      On Alan Padgett’s view, God changes, so God is temporal. However, timelessness is not abandoned; instead, it is redefined.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      > […] I have not abandoned timelessness. Instead, I have redefined “God is timeless” to mean that God is relatively timeless, i.e. he is not measured by time nor is he affected by the negative aspects of temporal passage. (Padgett 1992: 146; also 2001)[^padgett-1992]
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      The idea is that God’s time is non-identical with our, “Measured Time”.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      “Measured Time” is “the specifically human time of our history and our universe: the time of seconds, days, and centuries; the time of our space-time” (Padgett 1992: 130)[^padgett-1992]. In that sense of “time”, God is timeless. However, God is not timeless in the strict sense in which “time” refers to any kind of temporality, because God is in his own time. Does that mean God is only in his time and not in ours? No, he is in our time too (p. 131—at least saying this is “philosophically acceptable” (p. 126)), as we are in his. It’s just that he transcends our time. What does it mean to transcend our time? It means that God is the ground of time, that he is not negatively affected by the passage of time, and (things get a little circular here), that he is relatively timeless.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      One question one might have about this is what “Measured Time” and “God’s time” are, and how plausible it is to think there are both. Padgett maintains that in everyday speech, “time” refers “not to an ontological category” but to “the human time of our history and our universe” (1992: 130). The distinction is supported by appeals to the differences between this sense of “time” and “the strict ontological sense of ‘time’ used in philosophy” (p. 140). But this may still leave one wondering about the distinction. For one thing, few contemporary ontologists take themselves to be investigating a time distinct from “the human time of our history and our universe”. Nor do they tend to think of the time of the universe as specifically human. For another, there are a number of different philosophical views about time.
    step1: TBD
    step2: TBD
