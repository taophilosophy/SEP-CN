      Does this provide an answer to the objection, or does it rely on one? As pointed out by Brian Leftow in a similar context (Leftow 1991: 173; also Fales 1997)[^fales-1997][^leftow-1991], on the view proposed, the temporal and the eternal can enter into causal relations only if they are in some sense simultaneous. That is the reason ET-simultaneity is invoked. If one then relies on a notion of ET-causality in the definition of ET-simultaneity one faces a problem of circularity.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Third, what role, if any, is special relativity playing in the proposal? The intended role is a considerable one. Considerations of the relativity of simultaneity are supposed to show that the difficulties with the notion of ET-simultaneity are “by no means unique” and “cannot be assumed to be difficulties in the concepts of ET-simultaneity or of eternity themselves” (S&K 1981: 439). But it is hard to see how they could show this. Stump and Kretzmann emphasize the finding that simultaneity is a three-place relation and present it as a response to a threat of incoherence (two distant events being both “simultaneous […] and not simultaneous” (S&K 1981: 437)). But the difficulties with ET-simultaneity arise whether it is two-place or three-place. They pertain to spelling out what an eternal present and the unique eternal frame of reference might be, and how there can be causal relations, including observational ones, between a being in it and us. No comparable difficulties are involved in special relativity (Fales 1997; also Padgett 1992: 71; Craig 2009)[^craig-2009][^fales-1997][^padgett-1992].
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
