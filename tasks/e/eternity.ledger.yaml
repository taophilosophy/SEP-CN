      ### 5.2 Arguments from Divine Action
    step1: TBD
    step2: TBD
  - id: 168
    kind: body
    source: |-
      One might reason as follows. When God creates the universe, God begins to stand in the relation of *coexisting with* to the universe, and also in the relation of *sustaining it in existence*. Acquiring these and other relations to the universe makes God temporal, because it constitutes a change that God undergoes at the moment of creation. Even if God was timeless before, God is temporal after creation (Craig 2009)[^craig-2009].
    step1: TBD
    step2: TBD
  - id: 169
    kind: body
    source: |-
      The problem with this line of thought is again that it is not clear how to understand the notions of before and after, of acquiring, and of beginning, as applied to a timeless God.
    step1: TBD
    step2: TBD
  - id: 170
    kind: body
    source: |-
      However, the point can be made in another way. God is thought to be causally active in the world, where those causal relations include God’s responding to petitionary prayer and being actively involved in world history. Similarly, God coexists with the world and sustains it in existence at every moment. God loves, and knows about the lives of, God’s creatures. All these are relations. God stands in causal and other relations to a temporal world. Doesn’t this make God temporal (Mullins 2016, Ch. 5)[^mullins-2016]?
    step1: TBD
    step2: TBD
  - id: 171
    kind: body
    source: |-
      Each version of divine timelessness tries to address this concern in some way. One somewhat radical response, given by Aquinas and others, is that while the world is related to God, God is not related to the world.
    step1: TBD
    step2: TBD
  - id: 172
    kind: body
    source: |-
      ### 5.3 Arguments from Divine Personhood
    step1: TBD
    step2: TBD
  - id: 173
    kind: body
    source: |-
      Suppose that whatever is a person does at least some of the following: remembering, anticipating, reflecting, deliberating, deciding, intending, and acting intentionally. If timelessness precludes one from doing any of these, then being timeless is incompatible with being a person. Since God is a person, God is not timeless.
    step1: TBD
    step2: TBD
  - id: 174
    kind: body
    source: |-
      But is it the case that being a person requires one to do at least some of the above? Instead one might hold that at most, it requires one to be *capable* of doing at least some of the above. And perhaps a timeless God is capable of doing some of the above, even if God does not do them.
    step1: TBD
    step2: TBD
  - id: 175
    kind: body
    source: |-
      Alternatively, one might question the grounds for thinking that these activities tend to be precluded by timelessness. It is true that they all seem to involve change, namely a change in one’s mental states. But defenders of timelessness may think we should leave room in our conceptual scheme for a timeless, changeless version of each of these activities (Craig 2009; Murray & Rea 2008: Ch. 2)[^craig-2009][^murray-2008].
    step1: TBD
    step2: TBD
  - id: 176
    kind: body
    source: |-
      ## 6. Arguments for Divine Timelessness
    step1: TBD
    step2: TBD
  - id: 177
    kind: body
    source: |-
      ### 6.1 Arguments from Divine Perfection
    step1: TBD
    step2: TBD
  - id: 178
    kind: body
    source: |-
      There are a number of considerations speaking in favor of divine timelessness that arise out of perfect being theology. Perfect being theology is the approach to theology that involves figuring out what God is like on the basis of God’s being the most perfect (or greatest possible) being. A general argument goes as follows. The most perfect being, God, has the most perfect mode of existence. But temporal existence is a less perfect mode of existence than timeless existence. Therefore, God has a timeless mode of existence.
    step1: TBD
    step2: TBD
  - id: 179
    kind: body
    source: |-
      Why think that temporal existence is less perfect than timeless existence? Note that we’re here mostly concerned with the second issue distinguished at the beginning of section 4, namely the nature of God’s experience (rather than the first, namely whether or not God is located in time/spacetime). The thought is that ordinary temporal experience involves gain and loss, and an awareness of the inescapable passage of time. Relatedly, for ordinary temporal beings, neither the distant past nor the future are perceptually accessible. We remember parts of the past, but imperfectly, and we merely anticipate the future. We know much less about the future than the past. We can’t change or re-experience the past, nor can we skip ahead to later moments, except one at a time.
    step1: TBD
    step2: TBD
  - id: 180
    kind: body
    source: |-
      But then again, God is no ordinary temporal being. The defender of temporality can reply that while God’s life has temporal features, in that God experiences succession, God’s temporal experience is otherwise very much unlike ours (Mullins 2014)[^mullins-2014]. For example, God is omniscient, so God forgets no part of the past and already knows all about the future. It’s true that experiencing succession means experiencing things one at a time. But, the defender of temporality might add, this very feature is necessary for, e.g., the ability to enjoy music, which is good and therefore something the most perfect being would have.
    step1: TBD
    step2: TBD
  - id: 181
    kind: body
    source: |-
      There are more indirect ways of arguing from perfection to timelessness. For example, suppose that the most perfect mode of existence involves immutability, and that immutability requires timelessness. Or suppose that perfection requires divine simplicity, and that simplicity requires timelessness (for more, see the SEP entries on divine simplicity and immutability).
    step1: TBD
    step2: TBD
  - id: 182
    kind: body
    source: |-
      ### 6.2 Arguments from Divine Foreknowledge
    step1: TBD
    step2: TBD
  - id: 183
    kind: body
    source: |-
      One line of thought is that complete knowledge of future contingent events is impossible for beings in time. Since God is omniscient, and therefore knows all that will happen, God is timeless.
    step1: TBD
    step2: TBD
  - id: 184
    kind: body
    source: |-
      Another line of thought is that while God is omniscient, and therefore knows all that will happen, some of our actions are genuinely free. But these two facts are in tension with one another, and the tension can be resolved by thinking of God as timeless.
    step1: TBD
    step2: TBD
  - id: 185
    kind: body
    source: |-
      Here is this line of thought in more detail. First consider an argument for theological fatalism, the view that divine foreknowledge and freedom are incompatible (Pike 1965; Murray & Rea 2008: Ch. 2)[^murray-2008][^pike-1965]. God is omniscient. So God knows all that is true and believes nothing false. Now consider the proposition *p* that you will read this section 1,000 years hence. Suppose *p* was true 1,000 years ago. Then God believed *p* then. And you never had a choice about whether God believed *p* 1,000 years ago. Nor have you ever had a choice about anything that follows from God’s believing *p* 1,000 years ago, including that you read this section today. So you never had a choice about whether you read this section today, which means you’re not doing it freely.
    step1: TBD
    step2: TBD
  - id: 186
    kind: body
    source: |-
      One proposed solution is to deny that *p* was true 1,000 years ago. (Aristotle responds in this way to a similar, non-theological argument for logical fatalism.) For more on this solution, see the SEP entries on foreknowledge and free will and fatalism.
    step1: TBD
    step2: TBD
  - id: 187
    kind: body
    source: |-
      A defender of divine timelessness may attempt another solution (inspired by Boethius). God is not located in time, so God does not know or believe things at times. So it is not the case that God believed *p* 1,000 years ago. Rather, all temporal events are before God’s mind “at once”, or in an atemporal present. However, some argue that a similar problem still arises (Zagzebski 1991: Ch. 2)[^zagzebski-1991].
    step1: TBD
    step2: TBD
  - id: 188
    kind: body
    source: |-
      ### 6.3 Arguments from Relativity Theory
    step1: TBD
    step2: TBD
  - id: 189
    kind: body
    source: |-
      God is immaterial. Suppose it follows from this that God is not in space. Then one might argue that relativity theory implies that God is not in time either, because according to relativity theory, anything that is in time is also in space (Leftow 1991: 272)[^leftow-1991].
    step1: TBD
    step2: TBD
  - id: 190
    kind: body
    source: |-
      While the basic thought is clear enough, one might worry about the details of this argument. In relativity theory, there are no such things as times or spatial locations, at the fundamental level. So it would be at least misleading to say that according to relativity theory, anything that is located at times is located at spatial locations. But a defender of the argument probably has in mind precisely this implication of (special) relativity, that spatiotemporal regions are fundamental, because there is no unique decomposition of spacetime into space at times. Presumably the lesson of relativity theory for the present debate can be suitably reformulated.
    step1: TBD
    step2: TBD
  - id: 191
    kind: body
    source: |-
