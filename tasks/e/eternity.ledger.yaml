      #### 4.1.3 The time of timeless eternity
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      For Brian Leftow, the central idea is that all things in time are also, with God, in timeless eternity. He finds this idea in Anselm. Like in the Stump and Kretzmann proposal, the idea is given a contemporary twist through appeals to the notion of a reference frame and special relativity.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Consider the claim that God has no spatial location. Since there can be a spatial distance only between things or locations in space, this implies that there is no spatial distance between God and things in space. From this, Leftow infers that the distance between God and any thing in space is zero (the “Zero Thesis”) (Leftow 1991: 222)[^leftow-1991].
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      The Zero Thesis says not only that the distance between God and any spatial thing is zero, but also that it always is zero. Therefore nothing ever moves with respect to God. Moreover, all change supervenes on motion, e.g., change in color supervenes on motion in microparticles. So there is no change with respect to God (Leftow 1991: 227)[^leftow-1991]. Therefore, God and all spatial things share a frame of reference, the reference frame of eternity, in which nothing changes. In this reference frame, all events are simultaneous, including God’s actions and their effects. That is, they all occur at eternity, and eternity is something like another time, so they are all simultaneous. But in other, temporal reference frames, this is not the case. In these, God’s actions occur at eternity but their effects occur at particular points in time. So in these frames, they are nonsimultaneous. And this is where special relativity comes in. After all, the relativity of simultaneity shows that events simultaneous in one frame of reference may be nonsimultaneous in others.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Unfortunately, the Zero Thesis and Leftow’s case for it are problematic. From the fact that there is no spatial distance between spatial things and God, it does not follow that the spatial distance between spatial things and God is zero. A similar inference leads one to claim that all spatial things are spatially contiguous with yellow and the number 3. Leftow is of course aware of this consequence, and accepts it as a surprising finding about yellow and the number 3; he argues that the Zero Thesis only seems problematic because one fails to notice that a distance of zero is just an absence of distance (Leftow 1991: 225)[^leftow-1991]. However, a distance of zero would seem to be a distance, not an absence of distance (Oppy 1998, in Other Internet Resources).
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      As before, it’s hard to see how talk of reference frames and appeals to the relativity of simultaneity can be helpful or even relevant. A reference frame is a system of physical devices such as measuring rods and clocks that allow an observer to fix the positions of events. It’s not clear how timeless eternity can be such a system. Nor is it clear how timeless eternity can, in addition, be (like) a time, simultaneity with which can be the outcome of measurements.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Before turning to further elements of Leftow’s view, it is useful to pause to describe some background on the metaphysics of time (see also the SEP entries on time, John M.E. McTaggart, and being and becoming in modern physics). McTaggart distinguished between the A-series and the B-series of events. The A-series runs from the future through the present and into the past, while the B-series runs from earlier to later (McTaggart 1908)[^mctaggart-1908]. This distinction survives in the form of the contemporary opposition between the B-theory and (various versions of) the A-theory of time.
    step1: TBD
    step2: TBD
