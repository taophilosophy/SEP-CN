      However, the observed levels of genetic polymorphism presented an insurmountable problem for the mathematical theory of evolutionary genetics. The amount of genetic variation was much too large to be explained by the type of balancing selection observed by Ford and his colleagues for conspicuous phenotypic polymorphisms in natural populations. The basic problem was that the numbers of selective deaths necessary to account for the observed levels of allozyme polymorphism exceeded the reproductive excess of almost all species. This where the focus on genetics must be coupled with the ecology of reproduction and viability. Haldane (1957) called this the “cost of natural selection” and it is also referred to as the substitutional load. Differently put, the mortality of homozygous genotypes, if independently selected, (also known as the “segregation load”) would exceed the total numbers of offspring produced by a population. For this reason, Kimura (1983) proposed his neutral theory of molecular evolution, founded on the theoretical observation that the probability of fixation of a novel mutant allele with selective coefficient, $s \gt 0$, was approximately $2s$ (Wright 1931: 133)[^wright-1931]. Since $s$ was generally believed to be in the range of 0.001 to 0.0001, the likelihood of loss of a new favorable mutation by chance is quite high, only slightly smaller than the probability of loss by chance for a truly neutral allele.
    step1: |-
      然而，观察到的遗传多态性水平给进化遗传学的数学理论出了一个无法逾越的难题。遗传变异的量太大，无法用福特及其同事为自然种群中醒目表现型多态现象所观察到的那类平衡选择来解释。基本问题在于：要解释观察到的等位酶多态性水平，所需的选择性死亡数目超过了几乎所有物种的繁殖盈余。正是在这里，对遗传学的关注必须与繁殖和存活的生态学相结合。霍尔丹（1957）称之为“自然选择的代价”，它也被称为替换负荷。换句话说，纯合基因型的死亡率（如果被独立选择，也称“分离负荷”）会超过一个种群产生的后代总数。因此，木村（1983）提出其分子进化中性理论，其理论基础是这样一个理论观察：选择系数 $s \gt 0$ 的新型突变等位基因固定概率约为 $2s$（Wright 1931: 133）[^wright-1931]。既然一般认为 $s$ 在 0.001 到 0.0001 的范围内，一个新的有利突变因偶然而丢失的可能性就相当高，只比真正中性等位基因因偶然丢失的概率略小。
    step2: |-
      可是，观测到的遗传多态性水平，给进化遗传学的数学理论出了一道无法逾越的难题。遗传变异的量实在太大，福特及其同事在自然种群醒目表现型多态现象中观察到的那类平衡选择，无论如何解释不了。根本困难在于：要撑起观测到的等位酶多态水平，所需的选择性死亡数目会超过几乎所有物种的繁殖盈余。正是在这里，对遗传学的关注必须同繁殖与存活的生态学接驳起来。霍尔丹（1957）把这称作“自然选择的代价”，它另有名字叫替换负荷。换个说法：纯合基因型的死亡（若被独立选择，又称“分离负荷”）所造成的损耗，将超过一个种群所能产生的后代总数。正因如此，木村资生（1983）提出了分子进化中性理论；其理论支点是：选择系数 $s \gt 0$ 的新突变等位基因，其固定概率约为 $2s$（Wright 1931: 133）[^wright-1931]。既然 $s$ 通常被认为介于 0.001 与 0.0001 之间，一个有利的新突变因偶然而丢失的概率就相当可观，只比真正中性等位基因偶失的概率略低一点。
