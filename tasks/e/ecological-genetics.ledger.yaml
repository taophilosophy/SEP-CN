      在此，他提出了一个权衡：无迁移时对局部条件的特化适应，与有迁移时对全局条件的泛化适应之间的权衡。用现代术语来说，这就是基因型×环境互作，其中基因的选择效应 $s$ 随环境改变而改变。一个基因在一种环境背景下可能有利（即 $s \gt 0)$，在另一种环境下却可能不利（即 $s \lt 0)$。不同局部环境之间的迁移把对选择的适应性与非适应性反应混合起来，降低了基因频率变化的平均幅度。在这个意义上，适合度的基因型×环境互作被视为一种进化约束，因为它限制了基因频率变化的速率。只要停止基因流和基因在不同局部环境之间的混合，这种约束就可以消除。因此，图 1 所示的固定选择效应，必须被理解为跨环境可变选择效应的一个平均值。显然，当生境之间存在基因流时，符号相反的大局部效应必须被平均，而平均往往降低基因选择效应的量值。福特还提出，其遗传机制涉及“平衡以适应自身局部环境的基因复合体”。也就是说，他主张基因之间的相互作用即上位性促成局部适应。因此，福特在其快速进化的案例中既援引了适合度的基因型×环境互作，也援引了适合度的基因-基因互作，尽管这两者都会降低基因的平均选择效应。这一论证也与他断言基因的适应优势在自然种群中通常为 25% 相抵触。两类互作都改变图 1 中分隔自然选择与随机遗传漂变的阈值的描绘方式；事实上，它们倾向于抬高这一阈值，从而扩大随机遗传漂变的领域。在转向互作效应之前，我将利用来自一个自然种群的数据，考察一场关于随机遗传漂变的生态遗传学的代表性讨论。
    step2: |-
      福特在此实际上提出了一个权衡问题：没有迁移时对局部条件的特化适应，与有迁移时对全局条件的泛化适应，二者难以兼得。用现代术语说，这就是基因型×环境互作：基因的选择效应 $s$ 会随环境改变而变动。同一个基因，在这种环境里可能有利（即 $s \gt 0)$，换个环境却可能有害（即 $s \lt 0)$。局部环境之间的迁移会把对选择的适应性与非适应性反应搅在一起，拉低基因频率变化的平均幅度。就此而言，适合度上的基因型×环境互作被看成一种进化约束——它限制了基因频率变化的速率。而要解除这条约束，办法简单：切断基因流，不再让基因在不同局部环境之间混流。于是，图 1 所画的那条固定选择效应，必须当作跨环境变动着的选择效应的一种平均来理解。显然，只要生境之间存在基因流，符号相反的大局部效应就得被拉平平均，而平均化往往缩小基因选择效应的量值。福特还提示，其遗传机制牵涉“平衡以契合自身局部环境的基因复合体”：他主张，基因之间的互作——即上位性——助成了局部适应。这样，福特在快进化的案例里同时求助于两种互作：适合度上的基因型×环境互作与基因-基因互作；尽管这两种互作都会压低基因的平均选择效应。这一论证还与他那个断言——基因的适应优势在自然种群中通常达 25%——相抵牾。两类互作都改写了图 1 中分隔自然选择与随机遗传漂变的那条阈值的画法；实际上它们倾向于抬高阈值，从而扩大随机遗传漂变的领地。在转入互作效应之前，我先借助一个自然种群的数据，考察一场关于随机遗传漂变的生态遗传学代表性讨论。
