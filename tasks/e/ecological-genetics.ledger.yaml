  - id: 5
    kind: body
    source: |-
      In this entry, I review briefly the history of ecological genetic research and its recent integration with molecular genetic methods in the sub-field of molecular ecology. Most studies in ecological genetics begin with one or the other of the two most prominent patterns in nature:
    step1: |-
      在本词条中，我简要回顾生态遗传学研究的历史，及其最近在分子生态学这个子领域里与分子遗传方法的整合。生态遗传学的大多数研究都从自然界最突出的两种模式之一出发：
    step2: |-
      本词条简要回顾生态遗传学研究的历史，以及它近来在分子生态学这一子领域内与分子遗传方法的整合。生态遗传学的研究大多从自然界最突出的两类模式之一入手：
  - id: 6
    kind: body
    source: |-
      1. adaptation, the “fit” between an organism and its environment (see the entry on fitness); or,
      2. polymorphism, the maintenance of two or more phenotypic or genetic forms within a single population by natural selection.
    step1: |-
      1. 适应，即生物与其环境之间的“契合”（参见“适合度”词条）；或者，
      2. 多态性，即自然选择在单一种群内维持两种或更多表现型或遗传型形式。
    step2: |-
      1. 适应，也就是生物与其环境之间的“契合”（参见“适合度”词条）；或者，
      2. 多态性，也就是自然选择使两种或更多表现型形式或遗传形式在同一个种群内得到维持。
  - id: 7
    kind: body
    source: |-
      With the development of molecular ecology, the latter can be significantly extended to explore phenotypic differences between species in a phylogenetic context. This permits a more incisive investigation of the environments that favor adaptive divergence of phenotypes between species. Moreover, the same molecular methods useful in phylogenetics can often be modified to identify the genes or chromosomal regions responsible for those inter-specific phenotypes (Gibson et al. 2021)[^gibson-2021].
    step1: |-
      随着分子生态学的发展，后者可以在系统发生的背景下显著扩展，用来探索物种之间的表现型差异。这使得我们能够更犀利地考察那些促成物种之间表现型适应性趋异的环境。此外，系统发生学中使用的分子方法常常经过修改，就可以鉴定对那些种间表现型负责的基因或染色体区域（Gibson et al. 2021）[^gibson-2021]。
    step2: |-
      随着分子生态学的发展，后一类研究得以在系统发生的框架中大幅扩展，转而考察物种之间的表现型差异。这让我们能够更锐利地追问：哪些环境有利于物种之间表现型的适应性分化。不仅如此，系统发生学里那些好用的分子方法，稍加改造往往就能用来鉴定造成种间表现型差异的基因或染色体区域（Gibson et al. 2021）[^gibson-2021]。
  - id: 8
    kind: body
    source: |-
      The earliest studies attempted to document the action of natural selection in wild populations in support of Darwinian’s theory. In so doing, these studies attempted to demonstrate that evolution by natural selection was not only an historical causal force, but that it also continued to act on the characteristics of wild populations in the present day. Under the assumption of gradualism, it was not clear whether natural selecting acting on phenotypes in wild populations could be detected, let alone account for between species phenotypic differences. The starting observations of many of the earliest ecological genetic investigations, i.e., the phenotypes of most interest, were conspicuous phenotypic polymorphisms, such as the spotting patterns on butterfly wings or banding patterns of snail shells or polymorphisms of chromosomal rearrangements. These were either known to have a genetic basis or could safely be assumed to have one.
    step1: |-
      最早的研究试图记录野生种群中自然选择的作用，以支持达尔文的理论。这样做的过程中，这些研究力图证明：自然选择造成的进化不仅是历史上的一种因果力量，而且今天仍在作用于野生种群的性状。在渐变论的假设下，当时并不清楚作用于野生种群表现型的自然选择能否被检测出来，更不用说解释物种之间的表现型差异了。许多最早的生态遗传学考察的起始观察对象，也就是最受关注的表现型，是醒目的表现型多态现象，例如蝴蝶翅膀上的斑点图案、蜗牛外壳的条带图案，或染色体重排的多态现象。这些性状要么已知有遗传基础，要么可以稳妥地假定有遗传基础。
    step2: |-
      最早的一批研究试图记录自然选择在野生种群中的运作，以此为达尔文的理论提供支持。它们力图证明：由自然选择驱动的进化不只是历史上的一份因果力量，它至今仍在塑造野生种群的性状。可是在渐变论的假设下，作用于野生种群表现型的自然选择究竟能否被检测到，本身就很成问题，更遑论用它去解释物种之间的表现型差异。许多最早的生态遗传学考察都从醒目的表现型多态现象起步——比如蝴蝶翅面的斑点图案、蜗牛壳的条带图案，或染色体重排的多态——这些也正是研究者最关心的表现型。这些性状要么已知有遗传基础，要么可以被稳妥地假定为有。
  - id: 9
    kind: body
    source: |-
      Although natural selection is the only evolutionary force that can account for adaptation, several evolutionary forces, acting alone or in combination, can sustain a genetic polymorphism, at least transiently. Thus, assigning causal agency to a single evolutionary force is often a more difficult problem when explaining polymorphism within species than it is for adaptations. In these studies of conspicuous polymorphisms, natural selection was “privileged” among the four evolutionary forces as an explanation for their maintenance, at least in part, because one of the founders of ecological genetics, E. B. Ford, collaborated extensively with R. A. Fisher (see Ford 1975)[^ford-1975]. In the early period (1928–1950), much of the problem of assigning causal agency to the maintenance of genetic polymorphism was resolved by definition rather than by empirical observation (see section 2 below: Classical Ecological Genetics and Polymorphism). That is, only those polymorphisms where the rarest form was deemed “too common” to be accounted for by recurrent mutation were considered suitable for study. Moreover, if the species was abundant, then random genetic drift could similarly be eliminated as a relevant process. Indeed, the longest standing controversies in ecological genetics centered on whether natural selection could account for the observed frequencies of polymorphism or whether the variation in those frequencies indicated a significant role of random genetic drift (see, for example, Schemske and Bierzychudek [2001] regarding the interpretation of flower color polymorphism in the desert annual, *Linanthus parryae*).
    step1: |-
      尽管自然选择是唯一能解释适应的进化力量，几种进化力量单独或联合作用却能维持一个遗传多态性，至少暂时如此。因此，在解释种内多态现象时，把因果作用归于某一种进化力量往往比解释适应更难。在这些对醒目多态现象的研究中，自然选择在四种进化力量中被“优先”选为解释其维持的力量，这部分是因为生态遗传学的奠基人之一 E. B. 福特与 R. A. 费希尔有过广泛合作（见 Ford 1975）[^ford-1975]。在早期（1928–1950），维持遗传多态性的因果归属问题在很大程度上靠定义而非经验观察来解决（见下文第 2 节：经典生态遗传学与多态性）。也就是说，只有那些最稀有形式也被认为“过于常见”、无法用反复突变来解释的多态现象才被视为适于研究的对象。此外，如果物种本身数量丰富，随机遗传漂变同样可以被排除在相关过程之外。的确，生态遗传学中持续时间最长的争论，正是围绕自然选择能否解释观察到的多态频率，还是这些频率的变异表明随机遗传漂变起了重要作用（例如，关于沙漠一年生植物 *Linanthus parryae* 花色多态现象的解释，见 Schemske and Bierzychudek [2001]）。
    step2: |-
      自然选择固然是唯一能解释适应的进化力量，但若干种进化力量，无论单独还是联合作用，都能让一个遗传多态性维持下去——至少能维持一时。所以与解释适应相比，解释种内多态现象时，把因果作用归给某一种特定的进化力量往往更加困难。在关于醒目多态现象的研究中，四种进化力量里被“优先”用作维持机制解释的是自然选择，部分缘由在于生态遗传学的奠基人之一 E. B. 福特曾与 R. A. 费希尔密切合作（见 Ford 1975）[^ford-1975]。在早期阶段（1928–1950），维持遗传多态性的因果归属问题在很大程度上是靠定义、而非靠经验观察解决的（见下文第 2 节“经典生态遗传学与多态性”）。换句话说，只有那些最稀有形式也“常见”到无法用反复突变交代的多态现象，才被认定值得研究。再者，倘若物种数量丰富，随机遗传漂变也照样可以被排除出相关过程之列。事实上，生态遗传学中最旷日持久的争论恰恰是：观察到的多态频率究竟能否由自然选择解释，抑或这些频率的波动说明随机遗传漂变扮演了重要角色（例如，关于沙漠一年生植物 *Linanthus parryae* 花色多态的解释之争，见 Schemske and Bierzychudek [2001]）。
  - id: 10
    kind: body
    source: |-
      In the later period (1966–present), the advent of allozymes and molecular genetics permitted investigation of a less biased sample of genetic polymorphism. The modern characterization and analyses of allozymes and single nucleotide polymorphisms still retains the early emphasis on natural selection as the single most important evolutionary force shaping the hereditary material. Differently put, adaptive explanations for patterns of species divergence tend to be favored over non-adaptive explanations (see recent review of the causes of the rapid diversification among species of reproductive genes by Dapper and Wade [2020].)
    step1: |-
      在较晚的时期（1966 至今），同工酶与分子遗传学的出现使人们能够考察偏差较小的遗传多态性样本。对同工酶和单核苷酸多态性的现代刻画与分析，仍然保留了早期的重点：把自然选择视为塑造遗传材料的最重要进化力量。换句话说，对物种分化格局，适应性解释往往比非适应性解释更受青睐（关于生殖基因物种快速多样化原因的近期综述，见 Dapper and Wade [2020]）。
    step2: |-
      在较晚的阶段（1966 年至今），等位酶（allozyme）与分子遗传学的到来让研究者得以考察一份偏向小得多的遗传多态性样本。等位酶与单核苷酸多态性的现代刻画及分析依旧承袭了早年的侧重：把自然选择当作塑造遗传材料的首要进化力量。换个说法，面对物种分化的格局，适应性解释总是比非适应性解释更受偏爱（关于生殖基因在物种间快速多样化的原因，近期综述见 Dapper and Wade [2020]）。
  - id: 11
    kind: body
    source: |-
      Ecological genetics began at a time when the major theoretical aspects of the Modern Synthesis were in place, when the marvels of adaptation were clear, but when few empirical examples of natural selection in action were available. Achieving adaptive perfection by gradualism requires long periods of time wherein
    step1: |-
      生态遗传学起步之时，现代综合的主要理论方面已经就位，适应的奇妙之处有目共睹，但自然选择实际运作的经验实例却寥寥无几。要靠渐变论达到适应的完善，需要漫长的时间，其间——
    step2: |-
      生态遗传学诞生之际，现代综合的主要理论构件均已就位，适应之精妙有目共睹，可自然选择实际运作的经验实例却屈指可数。渐变论要达成适应的完善，必须有漫长的时间，其间——
  - id: 12
    kind: body
    source: |-
      > … a very slight selective effect acting for a correspondingly long time will be equivalent to a much greater effect acting for a proportionately shorter time. (R. A. Fisher 1921, in correspondence with S. Wright, quoted by Provine [1986: 247])
    step1: |-
      > ……一个极其微弱的选择效应只要作用相应长的时间，就等同于一个在成比例更短时间内作用的强大得多的效应。（R. A. Fisher 1921，致 S. Wright 的通信，转引自 Provine [1986: 247]）
    step2: |-
      > ……一个极其微弱的选择效应，只要作用相应长的时间，其效果便等同于一个强大得多、但作用时间成比例缩短的效应。（R. A. Fisher 1921，与 S. Wright 通信，转引自 Provine [1986: 247]）
  - id: 13
    kind: body
    source: |-
      Very weak natural selection, however, is an impediment to the goal of ecological genetics to illuminate natural selection in action in the wild. Thus, the shift in focus toward understanding the role of strong natural selection in maintaining visible genetic polymorphisms is understandable. As put by its founder, E. B. Ford,
    step1: |-
      然而，极其微弱的自然选择对生态遗传学的目标——阐明自然选择在野外的实际运作——构成了障碍。因此，研究焦点转向理解强自然选择在维持可见遗传多态性中的作用，这是可以理解的。正如其奠基人 E. B. 福特所说：
    step2: |-
      可是，要达成生态遗传学的目标——阐明自然选择在野外的实际运作——极其微弱的自然选择恰恰是一块绊脚石。由此便不难理解，研究焦点为何转向强自然选择在维持可见遗传多态性中的角色。用其奠基人 E. B. 福特的话说：
  - id: 14
    kind: body
    source: |-
      > It [ecological genetics] supplies the means, and the only direct means, of investigating the actual process of evolution taking place in the present time. (1975: 3)
    step1: |-
