    source: |-
      A very similar effect on the “gene”s eye view’ of selection is caused by additive-by-additive epistasis (Goodnight & Wade 2000; Wade 2001, 2002)[^goodnight-2000][^wade-2001]. The simplest model of this kind of $\rG \times \rG$, with interaction between loci A and B, each with alternative alleles, results in an average genic selection coefficient acting on the A allele of $s(p_B - p_b)$, where $p_B$ and $p_b$ are the frequencies of alternative alleles at the B-locus that interact in the additive-by-additive model with alleles at the A locus. The relative frequencies of the alternative alleles at the B locus, determine whether the A allele is a “good” gene or a “bad” gene with respect to fitness, a gene of major effect or minor fitness effect, or even a neutral gene when the background alleles are equally abundant (i.e., $p_B = p_b)$. Whenever allele frequencies of its epistatic partner change, either by drift or selection, the A allele’s selective effect also changes and, like the case of $\rG \times \rE$, it moves the boundary between the domains of natural selection and random drift (Fig. 2), increasing the domain of the latter at the expense of the former.
    step1: |-
      加性-加性上位性对选择之“基因之眼”视角的影响也极为类似（Goodnight & Wade 2000; Wade 2001, 2002）[^goodnight-2000][^wade-2001]。这类 $\rG \times \rG$ 的最简单模型假定座位 A 与座位 B 互作，各自带有备选等位基因；其结果是作用于 A 等位基因的平均单基因选择系数为 $s(p_B - p_b)$，其中 $p_B$ 与 $p_b$ 是 B 座位上备选等位基因的频率，它们在加性-加性模型中与 A 座位上的等位基因发生互作。B 座位上备选等位基因的相对频率决定 A 等位基因是适合度意义上的“好”基因还是“坏”基因，是对适合度有大影响还是小影响的基因；当背景等位基因同样丰富（即 $p_B = p_b)$）时，它甚至可以是中性基因。只要其上位性伙伴的等位基因频率发生变化——无论是通过漂变还是选择——A 等位基因的选择效应也随之改变；与 $\rG \times \rE$ 的情形一样，它会移动自然选择领域与随机漂变领域之间的边界（图 2），扩大随机漂变的领域，压缩自然选择的领域。
    step2: |-
      对选择的“基因之眼”视角，加性-加性上位性造成的效果几乎如出一辙（Goodnight & Wade 2000; Wade 2001, 2002）[^goodnight-2000][^wade-2001]。设想座位 A 与 B 互作，各自带有备选等位基因——这类 $\rG \times \rG$ 的最简模型给出：作用于 A 等位基因的平均单基因选择系数为 $s(p_B - p_b)$，其中 $p_B$ 与 $p_b$ 是 B 座位上备选等位基因的频率，它们按加性-加性模型与 A 座位上的等位基因互作。B 座位上两种备选等位基因的相对频率，决定着 A 等位基因在适合度意义上是“好”基因还是“坏”基因，是对适合度影响居大还是居小的基因；背景等位基因若恰好一样多（即 $p_B = p_b)$），它甚至可以是中性基因。它的上位性伙伴的等位基因频率一旦变动——不管这种变动出于漂变还是选择——A 等位基因的选择效应就跟着变；与 $\rG \times \rE$ 的情形相同，这会挪动自然选择领域与随机漂变领域之间的那条边界（图 2）：扩大随机漂变的领域，压缩自然选择的领域。
