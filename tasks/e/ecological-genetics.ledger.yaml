    source: |-
      Two new patterns in particular have been recognized by these DNA-based methods. The first is the preponderance of “purifying selection”, wherein the conservative power of natural selection is seen as a barrier to diversity. It is this conservative aspect of natural selection acting at the molecular level that lends power to the investigation of the genetic architecture of model organisms *vis à vis* human genetics. The second pattern is the discovery of the existence of *ancient polymorphisms*, molecular genetic variation whose age may be greater than that of the species or taxon in which it occurs. Natural selection remains the privileged explanatory force in modern sequence studies. Indeed, the search for, characterization, and explanation of uniquely molecular patterns, such as codon bias (Behura & Severson 2013)[^behura-2013] and selective sweeps, has, if anything, elevated the focal explanatory power of natural selection in evolutionary studies. That is, nonrandom or biased use of redundant codons in DNA sequences is seen as evidence that, although they have no effect on amino acid sequence, redundant codons are not all functionally equivalent in that some permit more efficient gene expression. This is taken as evidence that natural selection is all powerful, reaching down into the genome to affect even the smallest and least significant components of the hereditary material.
    step1: |-
      这类基于 DNA 的方法特别识别出两种新模式。第一种是“净化选择”的普遍存在，其中自然选择的保守力量被视为多样性的屏障。正是在分子层面起作用的自然选择的这种保守面向，让以模式生物为对象的遗传结构考察获得了相对于人类遗传学的力量。第二种模式是“古老多态性”的发现，即分子遗传变异的年龄可能大于它所在的物种或分类单元。在现代序列研究中，自然选择依然占据优先解释地位。事实上，对密码子偏倚（Behura & Severson 2013）[^behura-2013]与选择性清扫这类独特分子模式的寻找、刻画与解释，即便有什么影响的话，也是提升了自然选择在进化研究中的核心解释力。也就是说，DNA 序列中对冗余密码子的非随机或有偏使用被当作证据，表明冗余密码子虽然不影响氨基酸序列，却并非都在功能上等价，因为其中一些能支持更高效的基因表达。这被视为自然选择无所不在的证据：它深入基因组，乃至影响遗传材料中最微小、最不重要的组成部分。
    step2: |-
      这类基于 DNA 的方法尤其辨认出两种新模式。其一是“净化选择”的盛行：自然选择的保守力量在这里被当作多样性的屏障。自然选择在分子层面施展的这种保守面向，正是比较模式生物与人类遗传结构的研究得以立足的力量来源。其二是“古老多态性”的发现——某些分子遗传变异的年龄，可能超过它们所栖身的物种或分类单元本身。在现代序列研究中，自然选择依旧稳居首选解释的地位。毋宁说，围绕密码子偏倚（Behura & Severson 2013）[^behura-2013]、选择性清扫这类独有分子模式所做的搜寻、刻画与解释，非但没有削弱自然选择的地位，反而抬高了它在进化研究中的核心解释力。所谓密码子偏倚，是指 DNA 序列对冗余密码子的使用并非随机、而是有偏向的；这被当作一条证据，说明冗余密码子虽然不改变氨基酸序列，功能上却未必等价——其中一些能支持更高效的基因表达。人们由此认定，自然选择威力无边，一直深入到基因组内部，连遗传材料里最细小、最不显眼的组件也不放过。
