      ## 5. Interactions and their Effect on the Threshold between Natural Selection and Random Drift
    step1: |-
      ## 5. 互作及其对自然选择与随机漂变之间阈值的影响
    step2: |-
      ## 5. 互作对自然选择与随机漂变之分界阈值的影响
  - id: 59
    kind: body
    source: |-
      The existence of either genotype-by-environment interaction $(\rG \times \rE)$ or gene-by-gene interaction (epistasis or $\rG \times \rG$) greatly complicates the estimation of selection coefficients. Ecological geneticists like Ford postulated interactions of the sort that could change the sign of genic selection coefficients with changes in the environment (including density) or in the genetic background. This kind of reversal of selective effect requires what is known as a “crossing-type” norm of reaction for $\rG \times \rE$ or additive-by-additive epistasis for $\rG \times \rG$ (Wade 2002)[^wade-2002]. The simplest model of crossing-type $\rG \times \rE$, consists of additive selection (i.e., genotypic fitnesses of $1 + 2s, 1 + s$, and 1 for genotypes AA, Aa, and aa, in one environment and the opposite order in the second environment) in each of two alternative environments, $E_1$ and $E_2$, with frequencies, $f_{E_1}$ and $f_{E_2}$, respectively. As the two environments fluctuate in frequency, spatially or temporally, the selective effect of an A allele changes in both magnitude and sign (see Fig. 2). Depending upon the relative frequencies of the alternative environments and the amount of gene flow or migration between them, the A allele on average can be a “good” gene or a “bad” gene with respect to fitness, a gene of major effect or minor effect on fitness, or even a neutral gene if the two environments are equally abundant. The smaller the amount of migration between the environments, the greater is the degree of local adaptation to each as theory and Ford suggested (see above). However, the *average* selective effect of the gene in the sense of Fisher’s theory must be smaller than the average observation in a particular locality at a particular time because the long-term average contains both positive and negative values of $s$. Furthermore, to the extent that the local value of $s$ changes sign owing to continuous fluctuations in local environmental conditions, the average effect on fitness A allele will also move downwards, from the domain of selection to the domain of drift as Wright suggested. Thus, the very kind of population subdivision imagined by Ford, with selection acting in every locality albeit in different directions, creates, rather than eliminates, an increased opportunity for random genetic drift.
    step1: |-
      基因型×环境互作 $(\rG \times \rE)$ 或基因-基因互作（上位性或 $\rG \times \rG$）的存在，大大复杂化了选择系数的估计。像福特这样的生态遗传学家设想了这样一类互作：随着环境（包括密度）或遗传背景的变化，单基因选择系数可以改变符号。这种选择效应的反转需要所谓“交叉型”反应规范（对 $\rG \times \rE$ 而言）或加性-加性上位性（对 $\rG \times \rG$ 而言）（Wade 2002）[^wade-2002]。交叉型 $\rG \times \rE$ 的最简单模型是在两个备选环境 $E_1$ 与 $E_2$（频率分别为 $f_{E_1}$ 与 $f_{E_2}$）的每一个中都有加性选择（即基因型 AA、Aa 和 aa 的适合度分别为 $1 + 2s, 1 + s$ 和 1，而在第二种环境中次序相反）。随着两种环境在空间或时间上频率的变动，A 等位基因的选择效应在量值与符号上都发生变化（见图 2）。依据备选环境的相对频率以及它们之间基因流或迁移的量，A 等位基因平均而言可以是适合度意义上的“好”基因或“坏”基因，可以是对适合度有大影响或小影响的基因，如果两种环境同样丰富，甚至可以是中性基因。环境之间迁移量越小，对每一环境的局部适应程度就越高，理论与福特的看法皆是如此（见上文）。然而，费希尔理论意义上该基因的平均选择效应必须小于在特定时间特定地点观察到的平均值，因为长期平均同时包含 $s$ 的正值与负值。此外，只要局部 $s$ 值因局部环境条件的持续波动而变号，A 等位基因对适合度的平均效应也会下移——如赖特所提示的，从选择的领域移入漂变的领域。因此，福特所设想的那种种群分划——选择在每个局部都在起作用，只是方向各异——非但没有消除、反而制造了随机遗传漂变更多的机会。
    step2: |-
      基因型×环境互作 $(\rG \times \rE)$ 与基因-基因互作（上位性，$\rG \times \rG$）一经登场，选择系数的估计就大大复杂化了。以福特为代表的生态遗传学家所设想的互作，能够随环境（包括密度）或遗传背景的变动，令单基因选择系数改变符号。选择效应的这种反转，需要所谓“交叉型”反应规范（对 $\rG \times \rE$ 而言），或加性-加性上位性（对 $\rG \times \rG$ 而言）（Wade 2002）[^wade-2002]。交叉型 $\rG \times \rE$ 最简单的模型是这样的：设有两个备选环境 $E_1$ 与 $E_2$，频率分别为 $f_{E_1}$ 与 $f_{E_2}$；在每个环境中选择都是加性的，即基因型 AA、Aa 与 aa 的适合度依次为 $1 + 2s, 1 + s$ 和 1，而在第二种环境中次序正好颠倒。随着两种环境的频率在空间或时间上此消彼长，A 等位基因的选择效应在量值与符号两个方向上都跟着变（见图 2）。A 等位基因平均而言是好是坏，要看两种备选环境的相对频率，以及二者之间基因流或迁移的多寡：它可以是适合度意义上的“好”基因或“坏”基因，可以是对适合度影响或大或小的基因；两种环境若恰好一样多，它甚至可以是中性基因。环境之间的迁移越少，各环境内的局部适应就越彻底——理论与福特的判断一致（见上文）。然而，费希尔理论所谈论的基因平均选择效应，必须小于特定时间、特定地点观察到的平均值，因为长期平均把 $s$ 的正值与负值一并计入。此外，只要局部 $s$ 值随局部环境条件的持续波动而变号，A 等位基因对适合度的平均效应就会如赖特所提示的那样下移——从选择的领域滑入漂变的领域。所以说，福特设想的那种种群分划——选择在每个局部都在运转，只是方向彼此不同——非但没有消除随机遗传漂变的机会，反而为其敞开了更大的空间。
