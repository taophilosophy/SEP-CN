      Figure 1. The interaction of Random Genetic Drift and Natural Selection. The strength of selection is measured by the selective effect, $s$, of a single gene and the strength of random genetic drift is indicated by $(1/2N_e)$, where the population has effective size, $N_e$. When $s$ exceeds $(1/2N_e)$, then the evolutionary fate of a gene is determined primarily by Natural Selection. When $s$ is less than $(1/2N_e)$, then the evolutionary fate of a gene is determined primarily by Random Genetic Drift. Thus, the evolutionary domains of natural selection (upper) and random genetic drift (lower) are separated by the wavy boundary determined by the effective population size. [An extended description of figure 1 is in the supplement.]
    step1: |-
      图 1. 随机遗传漂变与自然选择的互动。选择的强度由单个基因的选择效应 $s$ 度量，随机遗传漂变的强度由 $(1/2N_e)$ 表示，其中种群有效大小为 $N_e$。当 $s$ 超过 $(1/2N_e)$ 时，基因的进化命运主要由自然选择决定；当 $s$ 小于 $(1/2N_e)$ 时，基因的进化命运主要由随机遗传漂变决定。因此，自然选择（上部）与随机遗传漂变（下部）的进化作用域由有效种群大小决定的波浪形边界分开。［图 1 的扩展描述见补充材料。］
    step2: |-
      图 1：随机遗传漂变与自然选择的互动。选择强度以单个基因的选择效应 $s$ 来度量；随机遗传漂变的强度则以 $(1/2N_e)$ 标示，$N_e$ 为种群的有效大小。当 $s$ 大于 $(1/2N_e)$，基因的进化命运主要归自然选择掌管；当 $s$ 小于 $(1/2N_e)$，命运则主要交由随机遗传漂变裁断。于是，自然选择的领域（上部）与随机遗传漂变的领域（下部），由一条随有效种群大小起伏的波浪形边界隔开。［图 1 的扩展描述见补充材料。］
