      Ford (1940) further distinguished two types of selective polymorphism, transient polymorphism and balanced polymorphism. *Transient polymorphism*, caused by a new favorable mutation in the process of displacing its ancestral allele by natural selection, was considered unlikely, because “…advantageous genes will usually have been already incorporated into the genetic constitution of the species” (Ford 1975: 110)[^ford-1975]. This and statements like it reflect the viewpoint that organisms in nature are exquisitely adapted to their environments by the long-acting process of Fisherian gradualistic natural selection (see the entry on natural selection). It is a prelude to the more explicitly adaptationist views found in the current behavioral literature (see review in Shuster & Wade 2003)[^shuster-2003]. This view of the evolutionary process as primarily one of refinement of existing organismal adaptation is an essential part of the Fisherian theory of evolutionary genetics (Wade & Goodnight 1998)[^wade-1998].
    step1: |-
      福特（1940）进一步区分了两类选择性多态现象：暂态多态性与平衡多态性。暂态多态性由一个新的有利突变在自然选择作用下取代其祖先等位基因的过程造成，被认为不太可能，因为“有利基因通常早已被纳入物种的遗传构成之中”（Ford 1975: 110）[^ford-1975]。这一论断及类似说法反映了一种观点：自然界中的生物经过费希尔式渐变论的自然选择的长期作用，已与其环境达成精妙的适应（参见“自然选择”词条）。它是一段前奏，通向当前行为学文献中更直白的适应主义观点（综述见 Shuster & Wade 2003）[^shuster-2003]。把进化过程视为对既有生物适应的完善，这一看法是费希尔进化遗传学理论的必要部分（Wade & Goodnight 1998）[^wade-1998]。
    step2: |-
      福特（1940）又把选择性多态现象分作两类：暂态多态性与平衡多态性。暂态多态性起于一个新有利突变，它正在自然选择的推动下取代祖先等位基因——这类多态性被认为不大可能出现，因为“有利的基因通常早已被纳入物种的遗传构成”（Ford 1975: 110）[^ford-1975]。这句话以及同类论断背后，是这样一种观点：在费希尔式渐变论自然选择的长期作用下，自然界中的生物已与其环境达成精微的适应（参见“自然选择”词条）。它还为当下行为学文献里更露骨的适应主义观点做了铺垫（综述见 Shuster & Wade 2003）[^shuster-2003]。把进化过程主要理解为对生物既有适应的打磨与完善，正是费希尔进化遗传学理论不可或缺的组成部分（Wade & Goodnight 1998）[^wade-1998]。
