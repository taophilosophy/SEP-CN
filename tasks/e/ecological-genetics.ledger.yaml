    source: |-
      Tests of the theory using DNA sequence data consist of comparisons of the relative evolutionary rates of different kinds of sites (base pairs) within codons and take advantage of the redundancy in the genetic code. The rate of neutral evolution is estimated from levels of polymorphism or numbers of segregating sites within species or the divergence between species in silent or redundant site substitutions (e.g., Dapper & Wade 2020)[^dapper-2020]. Silent sites are those that do not result in an amino acid change in the protein and, hence, are non-functional in the usual sense. In contrast, the rate of selective change or selective constraint is evaluated relative to the neutral rate using replacement sites, those base pair changes that result in amino acid changes. If the rate of substitution or polymorphism is lower than neutral, it is evidence of selective constraint or purifying natural selection acting to prevent change and preserve function in the face of mutational damage. If the rate of substitution is higher than neutral, then it is evidence of adaptive substitution.
    step1: |-
      用 DNA 序列数据检验该理论，需要对密码子内不同类型位点（碱基对）的相对进化速率进行比较，并利用遗传密码的冗余性。中性进化的速率由如下量估计：种内多态性水平或分离位点数目，或物种间在沉默位点或冗余位点替换上的分歧（如 Dapper & Wade 2020）[^dapper-2020]。沉默位点指那些不导致蛋白质氨基酸改变的位点，因而在通常意义上是非功能性的。与此相对，选择性变化或选择约束的速率则参照中性速率、利用替换位点（即引起氨基酸改变的碱基对变化）来评估。若替换或多态性速率低于中性速率，这是选择约束或净化自然选择起作用的证据——它阻止变化、在突变损伤面前保存功能。若替换速率高于中性速率，便是适应性替换的证据。
    step2: |-
      用 DNA 序列数据检验中性理论，办法是比较密码子内部不同类型位点（碱基对）的相对进化速率，并借力遗传密码的冗余性。中性进化的速率这样估得：或取种内多态性水平、分离位点的数目，或取物种之间在沉默位点与冗余位点替换上的分歧（如 Dapper & Wade 2020）[^dapper-2020]。所谓沉默位点，是不会引起蛋白质氨基酸改变的位点，按通常的意义也就是非功能的。与之相对，选择性变化或选择约束的速率，则借替换位点（引起氨基酸改变的碱基对变化）对照中性速率来评估。替换或多态速率若低于中性速率，即证明存在选择约束或净化选择——它遏制变化，在突变的破坏面前保全功能。替换速率若高于中性速率，则为适应性替换之明证。
