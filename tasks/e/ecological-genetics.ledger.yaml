      Figure 2. The interaction of Random Genetic Drift and Natural Selection, when there is either genotype-by-environment interaction or additive-by-additive epistasis (see text). The selective effect, $s$, of a single gene changes magnitude as the frequency of the alternative environments, $f_{E_1}$ and $f_{E_2}$, connected by gene flow, changes *or* as the frequency of alternative alleles, $p_B$ and $p_b$, change at an interacting locus. Thus, neither the selective effect of a gene nor the effective population size remains constant. As a result, relative to Figure 1, the threshold boundary between the domains of Natural Selection and Random Genetic Drift is greatly widened, meaning that both forces play more or less equal evolutionary roles over a broad range of values of $s$ and $N_e$. Furthermore, interactions of this sort open the possibility that changes in the relative frequencies of alternative environments or alternative alleles at other loci can move a gene’s selective effect from the domain of selection that of drift or vice versa during the course of its evolution. [An extended description of figure 2 is in the supplement.]
    step1: |-
      图 2. 存在基因型×环境互作或加性-加性上位性时随机遗传漂变与自然选择的互动（见正文）。单个基因的选择效应 $s$ 随着由基因流连接的备选环境频率 $f_{E_1}$ 与 $f_{E_2}$ 的变化而改变量值，*或者*随着互作座位上备选等位基因频率 $p_B$ 与 $p_b$ 的变化而改变量值。因此，基因的选择效应与有效种群大小都不再恒定。其结果是，与图 1 相比，自然选择领域与随机遗传漂变领域之间的阈值边界大大加宽，这意味着在很宽的 $s$ 与 $N_e$ 值范围内，两种力量都扮演着多少均等的进化角色。此外，这类互作还开启了如下可能：备选环境或其他座位上备选等位基因相对频率的变化，可以在基因进化的进程中把其选择效应从选择的领域移到漂变的领域，或者相反。［图 2 的扩展描述见补充材料。］
    step2: |-
      图 2：当存在基因型×环境互作或加性-加性上位性时，随机遗传漂变与自然选择的互动（见正文）。单个基因的选择效应 $s$，或者随基因流相连的备选环境频率 $f_{E_1}$、$f_{E_2}$ 的变动而改变量值，*或者*随互作座位上备选等位基因频率 $p_B$、$p_b$ 的变动而改变量值。于是，基因的选择效应与有效种群大小二者皆不再恒定。结果，相对于图 1，自然选择领域与随机遗传漂变领域之间的阈值边界大大加宽：在相当宽的 $s$ 与 $N_e$ 取值范围内，两种力量扮演的进化角色相差无几。这类互作还打开了一种可能：备选环境之间、或其他座位上备选等位基因之间相对频率的变动，能够在基因进化的进程中，把它的选择效应从选择的领域搬到漂变的领域，或者反向搬回。［图 2 的扩展描述见补充材料。］
