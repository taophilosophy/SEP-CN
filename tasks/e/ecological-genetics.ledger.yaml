      > Biodiversity evolution, even in small isolated populations, is primarily driven by natural selection, including diversifying, balancing, cyclical, and purifying selective regimes, interacting with, but ultimately overriding, the effects of mutation, migration, and stochasticity [random genetic drift]. (Nevo 2001: 6223)[^nevo-2001]
    step1: |-
      > 生物多样性的进化，即使在小的隔离种群中，也主要由自然选择驱动，包括多样化、平衡、周期与净化等选择体制，它们与突变、迁移和随机性［随机遗传漂变］的效应相互作用，但最终压倒后者。（Nevo 2001: 6223）[^nevo-2001]
    step2: |-
      > 生物多样性的进化，哪怕发生在很小的隔离种群中，也主要受自然选择驱动：多样化、平衡、周期与净化诸般选择体制同突变、迁移与随机性［随机遗传漂变］的效应交互作用，但最终把后者压倒。（Nevo 2001: 6223）[^nevo-2001]
