      The central problem with using conspicuous polymorphisms for investigating the relative roles of the variety of different evolutionary forces is that they not an unbiased sample of genetic diversity with respect to either adaptive function or amount of genetic variation. Indeed, the definition of genetic polymorphism adopted by Ford (see above) incorporates the essence of both of these biases. For a period, it was believed that “The solution to our dilemma lies in the development of molecular genetics” (Lewontin 1974: 99)[^lewontin-1974]. With the advent of electrophoresis, the amino acid sequence of a random sample of proteins from almost any organism could be studied and, for the first time, the level of genetic diversity, in the form of amino acid substitutions, across the genome could be quantified.
    step1: |-
      用醒目多态现象来考察各种不同进化力量的相对作用，其核心问题在于：无论就适应功能还是遗传变异量而言，它们都不是遗传多样性的无偏样本。事实上，福特采用的遗传多态性定义（见上文）同时容纳了这两种偏倚的实质。有一个时期，人们曾相信“我们两难困境的解决在于分子遗传学的发展”（Lewontin 1974: 99）[^lewontin-1974]。随着电泳的出现，几乎任何生物体蛋白质随机样本的氨基酸序列都可以研究，人们首次能够量化以氨基酸替换形式表现的整个基因组的遗传多样性水平。
    step2: |-
      拿醒目多态现象去考察各种进化力量的相对作用，核心症结在于：无论按适应功能衡量，还是按遗传变异量衡量，它们都不是遗传多样性的无偏样本。事实上，福特采纳的那个遗传多态性定义（见上文），恰恰把这两种偏倚的实质一并收进了定义本身。曾有一段时间，人们寄望于“我们这个两难困境的出路在于分子遗传学的发展”（Lewontin 1974: 99）[^lewontin-1974]。电泳一经问世，几乎任何生物的蛋白质随机样本，其氨基酸序列都可以拿来研究；以氨基酸替换形式呈现的基因组整体遗传多样性水平，也第一次得到了量化。
