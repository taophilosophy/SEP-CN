      The focus of traditional ecological genetic research on the current action of natural selection has been broadened in several ways over the last two decades. First, whereas the early studies tended to focus on evolution in single populations, there is now a significant emphasis in ecological genetics on the population genetic structure of metapopulations and the roles of migration, extinction, and colonization on evolutionary and adaptive processes (e.g., Goodacre 2002)[^goodacre-2002]. Secondly, whereas the earliest studies emphasized conspicuous polymorphisms or chromosomal rearrangements and their influence on fitness, the advent of biochemical genetics in the late 1960s significantly broadened the phenotype, beginning with the application of electrophoretic methods to population studies. These studies revealed abundant “hidden polymorphism” in the new, biochemical phenotype of enzyme mobility. These methods extended the domain of ecological genetics from the classic “conspicuous phenotypic polymorphisms” in color, shape and behavior to the physiological domain of enzyme function. The new emphasis on functional biochemical phenotypes, however, did not change the explanatory or causal framework of the field. Determining the role of natural selection in maintaining enzyme polymorphisms, such as the fast/slow polymorphisms of alcohol dehydrogenase (an enzyme involved in the detoxification of environmental alcohols), superoxide dismutase (which catalyzes the removal of free oxygen radicals), or the esterases (which are involved in the detoxification of pesticides in many insects), became a primary focus of investigation with the goal of finding a *selective* basis for the enzyme variants in terms of differences in their physical and kinetic properties. Indeed, the roots of controversy between the selectionist and neutralist schools over the maintenance of “balanced” polymorphisms (see Lewontin 1974)[^lewontin-1974] lie in the controversy over random genetic drift versus natural selection in early ecological genetic research (see below).
    step1: |-
      传统生态遗传研究聚焦自然选择的当下作用，这一焦点在最近二十年间以多种方式得到拓宽。第一，早期研究多着眼于单一种群内的进化，而如今生态遗传学相当重视集合种群的种群遗传结构，以及迁移、灭绝与拓殖在进化和适应过程中的作用（如 Goodacre 2002）[^goodacre-2002]。第二，最早的研究强调醒目的多态现象或染色体重排及其对适合度的影响，而二十世纪六十年代末生化遗传学的出现显著拓宽了表现型的范围，开端是把电泳方法应用于种群研究。这些研究揭示了酶迁移率这一新的生化表现型中丰富的“隐蔽多态性”。这些方法把生态遗传学的领域从颜色、形状和行为方面经典的“醒目表现型多态性”扩展到酶功能的生理领域。不过，对功能性生化表现型的新侧重并没有改变这个领域的解释或因果框架。确定自然选择在维持酶多态性中的作用，比如乙醇脱氢酶（一种参与环境酒精解毒的酶）的快/慢多态现象、超氧化物歧化酶（催化清除自由氧自由基）或酯酶（在许多昆虫中参与对杀虫剂的解毒）等，成为研究的主要焦点，目标是从酶变体物理与动力学性质的差异中找到其“选择”基础。事实上，选择论学派与中性论学派围绕“平衡”多态性维持的争论（见 Lewontin 1974）[^lewontin-1974]，其根源正是早期生态遗传研究中随机遗传漂变与自然选择之争（见下文）。
    step2: |-
      传统生态遗传研究聚焦自然选择的当下作用；在最近二十年里，这一焦点从多个方向得到拓宽。其一，早期研究大多着眼于单一种群内的进化，如今生态遗传学则相当重视集合种群的种群遗传结构，重视迁移、灭绝与拓殖在进化及适应过程中的作用（如 Goodacre 2002）[^goodacre-2002]。其二，最早的研究强调醒目的多态现象或染色体重排及其对适合度的影响，而二十世纪六十年代末生化遗传学的兴起把表现型的范围大大拓宽，起点是电泳方法在种群研究中的应用。这类研究在酶迁移率这一新型生化表现型中揭示出大量“隐蔽多态性”。生态遗传学的疆域由此从颜色、形状、行为层面的经典“醒目表现型多态性”，延伸到酶功能的生理领域。不过，侧重功能性生化表现型这一转变，并未触动该领域的解释框架与因果框架。查明自然选择在维持酶多态性中的作用——例如乙醇脱氢酶（参与环境酒精解毒的酶）的快/慢多态、超氧化物歧化酶（催化清除自由氧自由基）或酯酶（在许多昆虫体内参与对杀虫剂的解毒）——成为研究的首要焦点，目标是从酶变体在物理与动力学性质上的差异出发，为其找到一个“选择”基础。事实上，选择论学派与中性论学派围绕“平衡”多态性维持问题的争端（见 Lewontin 1974）[^lewontin-1974]，正发端于早期生态遗传研究中随机遗传漂变与自然选择的旧有对峙（见下文）。
  - id: 16
    kind: body
    source: |-
      The more recent advent of DNA sequencing initiated the growth of molecular phylogenetics and molecular ecology. The new technology added not only a new phenotype, but also a more pronounced historical (phylogenetic) dimension to ecological genetic research. Molecular phylogenics and comparative sequence analysis have become the primary modern tools for the investigation of the evolutionary patterns and processes that shape DNA sequences. These methods have strengthened inferences regarding biogeography, speciation, and adaptation, especially in regard to the diversification of taxonomic lineages that attends ecological release and adaptive radiations. They have shifted the focus from polymorphism within species to diversification among clades (e.g., Kostyun et al. 2019)[^kostyun-2019] and permitted the investigation of the history of individual genes (Gibson et al. 2021)[^gibson-2021]. For example, ecological genomic data have permitted the reconstruction of the invasion of the Galapagos Islands by the wild tomato species, *Solanum pimpinellifolium*, through hybridization and introgression with a closely related endemic species, *Solanum cheesmaniae*. Moreover, an adaptive phenotype, orange fruit color similar to the endemic species, is associated with two introgressed regions of the *Solanum* genome which contain known fruit color loci, supporting the inference that adaptive convergence was genetically facilitated by introgression (Gibson et al. 2021)[^gibson-2021].
    step1: |-
      较晚出现的 DNA 测序技术引发了分子系统发生学与分子生态学的成长。这项新技术不仅带来一种新的表现型，还为生态遗传研究添上了更明显的历史（系统发生）维度。分子系统发生学与比较序列分析已成为研究塑造 DNA 序列的进化格局与过程的首要现代工具。这些方法强化了关于生物地理学、物种形成和适应的推断，尤其是在伴随生态释放与适应辐射的分类谱系多样化方面。它们把焦点从种内多态性转移到支系之间的多样化（如 Kostyun et al. 2019）[^kostyun-2019]，并使研究单个基因的历史成为可能（Gibson et al. 2021）[^gibson-2021]。例如，生态基因组数据使我们得以重构野生番茄物种 *Solanum pimpinellifolium* 对加拉帕戈斯群岛的入侵：它通过与近缘特有种 *Solanum cheesmaniae* 杂交并发生基因渗入而实现。此外，一种适应性表现型——与特有种相似的橙色果色——与 *Solanum* 基因组中两个渗入区域相关联，这两个区域含有已知的果色位点，支持了如下推断：适应性趋同在遗传上因基因渗入而得到促进（Gibson et al. 2021）[^gibson-2021]。
    step2: |-
      更晚些时候，DNA 测序技术问世，带动了分子系统发生学与分子生态学的成长。新技术不只添了一种新的表现型，还为生态遗传研究补上了更浓重的历史（系统发生）维度。如今，刻画 DNA 序列进化格局与过程，主要靠分子系统发生学与比较序列分析。这些方法加固了生物地理、物种形成与适应方面的推断，在分类谱系伴随生态释放与适应辐射而多样化的问题上尤其如此。它们把注意力从种内多态性移向支系之间的多样化（如 Kostyun et al. 2019）[^kostyun-2019]，还让追踪单个基因的历史成为可能（Gibson et al. 2021）[^gibson-2021]。举个例子，凭借生态基因组数据，我们可以重构野生番茄 *Solanum pimpinellifolium* 入侵加拉帕戈斯群岛的过程：它与近缘特有种 *Solanum cheesmaniae* 杂交并发生基因渗入。而且，那里有一种适应性表现型——与特有种相仿的橙色果色——正好落在 *Solanum* 基因组两个渗入区域上，区域内含已知的果色位点；这支持如下推断：适应性趋同之所以实现，遗传上得益于基因渗入（Gibson et al. 2021）[^gibson-2021]。
