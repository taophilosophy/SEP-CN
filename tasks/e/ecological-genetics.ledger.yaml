  - id: 33
    kind: body
    source: |-
      Fisher (1930) first argued that, because every individual has a mother and a father, the mean fitness of males must be equal to the mean fitness of females multiplied by the sex ratio, expressed as the number of females to males (i.e., the mean number of mates per male; see also Shuster and Wade 2003, Chapter 1)[^shuster-2003]. As a result, fitness increases with rarity, and, in this circumstance, whenever the population sex ratio deviates from unity, a gene that increases the numbers of the minority sex at birth will have a selective advantage. Thus, a sex ratio of unity is a stable, balanced polymorphism, achieved in many species by chromosomal determination of sex, which Ford referred to as a “‘built-in’ genetic switch-mechanism”, characteristic of other genetic polymorphisms, like Batesian mimicry. In general, the fitnesses of two different types constituting a phenotypic polymorphism must be equal to be maintained within a population by natural selection at a intermediate equilibrium frequency (a point recognized in Darwin 1871, Vol. II, Chapter 14)[^darwin-1871]. However, the balance of selective forces for non-sex related (or even sex-linked) polymorphisms is very different from that required to maintain an equal sex ratio. Using the existence of the separate sexes as an example of a balanced polymorphism is misleading or, at least unrepresentative, of the selective forces necessary to sustain balanced polymorphisms in general.
    step1: |-
      费希尔（1930）最先论证：既然每个个体都有一位母亲和一位父亲，雄性的平均适合度必然等于雌性的平均适合度乘以性比（以雌比雄表达，即每个雄性的平均配偶数；另见 Shuster and Wade 2003，第一章）[^shuster-2003]。因此，适合度随稀有性而增加；在这种情况下，只要种群性比偏离 1:1，一个在出生时增加少数性别数量的基因就会具有选择优势。于是，1:1 的性比是一个稳定的平衡多态性，在许多物种中由染色体的性别决定机制实现；福特称之为“‘内置的’遗传开关机制”，贝氏拟态等其他遗传多态性也有同样的特征。一般而言，构成表现型多态性的两种不同类型，其适合度必须相等，才能靠自然选择在一个中间平衡频率上维持在种群之中（这一点在 Darwin 1871 的第二卷第十四章已得到承认）[^darwin-1871]。然而，与非性别相关（甚至伴性）多态现象有关的选择力量的平衡，与维持均等性比所需的平衡大不相同。拿两性的存在来充当平衡多态性的例子，会使人误解、至少不能代表一般平衡多态性得以维持所需要的选择力量。
    step2: |-
      费希尔（1930）率先论证：每个个体都有一位母亲、一位父亲，因此雄性的平均适合度必然等于雌性平均适合度乘以性比——性比以雌比雄计，即每头雄性的平均配偶数（另见 Shuster and Wade 2003，第一章）[^shuster-2003]。由此可知，适合度随稀有而升高；于是，只要种群性比偏离 1:1，任何在出生时增加少数性别数量的基因都会获得选择优势。如此一来，1:1 的性比就是一个稳定的平衡多态性，在许多物种里靠染色体性别决定机制来实现；福特称之为“‘内置的’遗传开关机制”，并认为贝氏拟态等其他遗传多态性同样具有这种特征。一般而言，构成一个表现型多态性的两种类型，只有适合度相等，才能靠自然选择在某个中间平衡频率上维持于种群之内（这一点在 Darwin 1871 的第二卷第十四章已得到确认）[^darwin-1871]。可是，与性别无关的（乃至伴性的）多态现象，其选择力量的制衡方式，与维持均等性比所需要的制衡截然不同。以两性的存在为例来说明平衡多态性，会误导人，至少不能代表维持一般平衡多态性所需的选择力量。
