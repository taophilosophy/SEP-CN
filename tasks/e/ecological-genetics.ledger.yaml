      Thus, throughout its founding period, ecological genetics was relentlessly supportive of natural selection as unitary explanation for evolutionary change. (Later laboratory research has shown that the expression of the color patterns is sensitive or plastic to the thermal environment during development and thus the gene frequency estimates may be subject to significant measurement error, owing to the misclassification of genotypes. This is yet another source of variation, not accounted for in the Ford analyses. It tends to weaken the link between genotype and phenotype and thereby weaken the relationship between selection acting on phenotypes and the underlying genotypes. In addition, empirical evidence has found, as Wright expected, that temporal fluctuations in population size, large variance among females in fecundity, and sexual selection reduce the effective number to less than half the Fisher-Ford estimate. In addition, more careful studies have reduced Ford’s estimates of the magnitude of the average genic selection coefficient by about two thirds [see Cook & Jones 1996][^cook-1996].)
    step1: |-
      因此，在整个奠基时期，生态遗传学始终不遗余力地支持把自然选择作为进化变化的元解释。（后来的实验室研究表明，翅色图案的表达对发育期间的热环境敏感或可塑，因此基因频率的估计可能因基因型误判而受显著的测量误差影响。这是福特分析未曾计入的又一方差来源。它倾向于削弱基因型与表现型之间的联系，从而削弱作用于表现型的选择与底层基因型之间的关系。此外，经验证据发现，正如赖特所预期的，种群大小的时间波动、雌体繁殖力之间的大方差以及性选择，使有效数量降到费希尔-福特估计的一半以下。另外，更精细的研究已把福特对平均单基因选择系数量值的估计削减了约三分之二［见 Cook & Jones 1996］[^cook-1996]。）
    step2: |-
      于是，在整个奠基时期，生态遗传学始终不遗余力地把自然选择奉为解释进化变化的单一法宝。（后来的实验室研究显示：翅色图案的表达对发育期热环境敏感而可塑，故而基因频率的估计可能因基因型误判而掺入显著的测量误差。这是福特分析未曾计入的又一方差来源，它倾向于松弛基因型与表现型之间的纽带，从而松动作用于表现型的选择同底层基因型之间的关系。此外，经验证据证实了赖特的预料：种群大小的时间波动、雌体繁殖力的巨大方差以及性选择，把有效数量压到费希尔-福特估计值的一半以下。再者，更精细的研究已把福特对平均单基因选择系数量值的估计砍掉约三分之二［见 Cook & Jones 1996］[^cook-1996]。）
