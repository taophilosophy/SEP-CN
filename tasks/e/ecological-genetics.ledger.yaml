    source: |-
      *Ecological genetics* is the broad field of studies that investigates the relationship between genetic change and features of the biotic and abiotic environment. In population genetic theory, the role of the environment in adaptive evolution tends to be hidden in the recursion equations for gene frequency dynamics, where the common assumption of a constant selection coefficient implies a constant relationship between genotype, phenotype and fitness irrespective of environment. For *ecological genetics*, in contrast, the central focus is the causal relationship between genetic variation and environmental variation, where conspicuous (especially discrete) phenotypic variation is assumed to have an underlying genetic component. The advent of molecular tools and the development of molecular ecology within ecological genetics has greatly broadened the conceptual scope of the field within the last fifteen years.
    step1: |-
      “生态遗传学”是研究遗传变化与生物环境及非生物环境特征之间关系的宽泛研究领域。在群体遗传学理论中，环境在适应性进化中的作用往往隐藏在基因频率动态的递归方程之中，那里通常假定选择系数恒定，这意味着基因型、表现型与适合度之间的关系不随环境而变。与此不同，“生态遗传学”的核心焦点是遗传变异与环境变异之间的因果关系，其中引人注目的（尤其是离散的）表现型变异被假定具有某个潜在的遗传成分。分子工具的出现以及生态遗传学内部分子生态学的发展，在最近十五年里极大地拓宽了该领域的概念范围。
    step2: |-
      “生态遗传学”是一个宽泛的研究领域，考察遗传变化与生物及非生物环境特征之间的关系。在群体遗传学理论中，环境在适应性进化中的作用往往隐藏在基因频率动态的递归方程里：那里通常假定选择系数恒定，等于假定基因型、表现型与适合度三者的关系不随环境改变。与之相对，“生态遗传学”的核心焦点是遗传变异与环境变异之间的因果关系，并假定醒目的（尤其是离散的）表现型变异背后有遗传成分支撑。近十五年来，分子工具的出现与分子生态学在生态遗传学内部的发展，大大拓宽了这个领域的概念范围。
  - id: 2
    kind: body
    source: |-
      The origins of *ecological genetics* are founded in the “modern synthesis” (Huxley 1942)[^huxley-1942], where the integration of genetics and Darwinian evolution was achieved through the theoretical works of R. A. Fisher, S. Wright, and J. B. S. Haldane and the conceptual works and influential writings of J. Huxley, T. Dobzhansky, and H. J. Muller. From these genetic beginnings, it was natural for much evolutionary research to be concentrated on the forces that cause changes in gene and genotype frequencies within populations. In this genetics-centered view, the four evolutionary forces (mutation, random genetic drift, natural selection, and gene flow) act within and among populations to cause micro-evolutionary change. Those same forces act in concert to convert the genetic variation within populations into more or less permanent genetic variation between species. Given enough time, the micro-evolutionary forces are believed to be sufficient to account for macro-evolutionary patterns characteristic of the higher taxonomic groups. In short, the central challenge of the field of *evolutionary genetics* has been to describe how the four evolutionary forces shape patterns of gene, genome and species diversity, with a particular emphasis on the predominant role of natural selection among the several evolutionary forces.
    step1: |-
      “生态遗传学”的起源奠基于“现代综合”（Huxley 1942）[^huxley-1942]，通过 R. A. 费希尔、S. 赖特和 J. B. S. 霍尔丹的理论工作，以及 J. 赫胥黎、T. 杜布赞斯基和 H. J. 穆勒的概念工作与有影响的著述，遗传学与达尔文式进化在那里实现了整合。从这些遗传学的开端出发，大量进化研究自然集中到在种群内部引起基因与基因型频率变化的各种力量上。在这种以遗传学为中心的观点看来，四种进化力量（突变、随机遗传漂变、自然选择与基因流）在种群内部和种群之间起作用，引起微观进化变化。同样这些力量协同作用，把种群内部的遗传变异转化为物种之间或多或少持久的遗传变异。只要有足够时间，人们相信这些微观进化力量就足以解释高等分类群特有的宏观进化格局。简言之，“进化遗传学”这个领域的核心挑战一直是描述四种进化力量如何塑造基因、基因组与物种多样性的格局，尤其强调自然选择在诸进化力量中的主导地位。
    step2: |-
      “生态遗传学”的起源可以追溯到“现代综合”（Huxley 1942）[^huxley-1942]：遗传学与达尔文式进化在其中完成整合，靠的是 R. A. 费希尔、S. 赖特与 J. B. S. 霍尔丹的理论工作，以及 J. 赫胥黎、T. 杜布赞斯基与 H. J. 穆勒的概念工作及其影响深远的著述。有了这样的遗传学起点，大量进化研究把注意力集中到种群之内改变基因与基因型频率的力量上，也就顺理成章。在这种以遗传学为中心的视角下，四种进化力量（突变、随机遗传漂变、自然选择、基因流）在种群内外发挥作用，造成微观进化层面的变化；也正是这几种力量协同运作，把种群内部的遗传变异转化为物种之间多少算得上持久的遗传变异。只要时间足够，这些微观进化的力量被认为足以解释高等分类群所特有的宏观进化格局。简言之，“进化遗传学”这一领域的核心挑战，始终是刻画四种进化力量如何塑造基因、基因组与物种多样性格局，其中又特别强调自然选择在诸力量之中的主导地位。
  - id: 3
    kind: body
    source: |-
      However, the gene-centered viewpoint was not the primary research focus or challenge for a large subset of field researchers, consisting of naturalists, zoologists and ecologists. Their focus was similarly on natural selection as the only evolutionary force which can produce adaptation, the fit between an organism and its environment. However, its focus is on the role of environment in adaptation. *Ecological genetics* is the study of evolutionary processes, especially adaptation by natural selection, in an ecological context in order to account for phenotypic patterns observed in nature. Where evolutionary genetics tends toward a branch of applied mathematics founded on Mendelian axioms, *ecological genetics* is grounded in the reciprocal interaction between theory and empirical observations from field and laboratory.
    step1: |-
      然而，以基因为中心的视角并非一大批田野研究者——包括博物学家、动物学家和生态学家——的首要研究焦点或挑战。他们同样把自然选择视为唯一能产生适应的进化力量，即生物与环境之间的契合；不过，他们的关注点在于环境在适应中所起的作用。“生态遗传学”是在生态背景中研究进化过程、尤其是自然选择造成的适应，以解释自然界中观察到的表现型格局。“进化遗传学”倾向于成为一门建立在孟德尔公理之上的应用数学分支，“生态遗传学”则扎根于理论与来自田野和实验室的经验观察之间的相互作用。
    step2: |-
      不过，对一大批田野研究者——博物学家、动物学家和生态学家——来说，以基因为中心的视角从来不是首要的研究焦点，也算不上他们面对的挑战。他们同样认定自然选择是唯一能产生适应（即生物与其环境之间的契合）的进化力量，但关心的重点放在环境在适应中的角色上。“生态遗传学”研究生态背景下的进化过程，尤其是自然选择带来的适应，以此解释在自然界观察到的表现型格局。如果说“进化遗传学”趋近于一门以孟德尔公理为基础的应用数学，那么“生态遗传学”的根基则是理论与田野、实验室经验观察之间的往复互动。
