    source: |-
      Changes in the pattern of neutral variation in the vicinity of a selected site(s) are also informative because, during an adaptive substitution, neutral variants linked to the piece of selected DNA are carried or “swept” to fixation along with it. This “selective sweep” temporarily reduces the level of neutral variation in the vicinity of selected sites until it can be replaced by mutation. The degree of reduction in neutral variation or the “footprint of selection” depends upon the strength of selection, the frequency of recombination during selection, and the time since the initiation of selection. The footprint is most conspicuous when a selective sweep is initiated by the advent of a single, novel favorable mutation. To the extent that novel selection results from a change of environment and begins to act on existing or standing variation already in the population, the impact on neutral polymorphisms may be quite minimal.
    step1: |-
      受选位点附近中性变异格局的变化也能提供信息，因为在适应性替换过程中，与这段受选 DNA 相连的中性变异体被一并携带或“清扫”至固定。这种“选择性清扫”会暂时降低受选位点附近的中性变异水平，直到突变将其补回。中性变异缩减的程度或“选择足迹”取决于选择的强度、选择期间重组的频率，以及选择开始以来经过的时间。当选择性清扫由单个新有利突变的出现引发时，足迹最为醒目。至于新选择源于环境改变并开始作用于种群中已有的存量变异的情况，它对中性多态性的影响可能相当轻微。
    step2: |-
      受选位点附近中性变异格局的变动同样富含信息：适应性替换发生时，连在受选 DNA 片段上的中性变异体会被一道携带、一道“清扫”到固定。这场“选择性清扫”会暂时压低受选位点附近的中性变异水平，直到突变把亏损补回来为止。中性变异缩减的幅度，即所谓“选择足迹”，其大小取决于三件事：选择的强度、选择进行期间重组的频率，以及选择启动至今的时间。选择性清扫若由单个新有利突变的出现所引发，足迹最为醒目；新选择若是出于环境改变、一开始就作用于种群中既有的存量变异，那么它给中性多态性留下的冲击就可能相当轻微。
  - id: 78
    kind: body
    source: |-
      Balancing selection of the sort observed by Ford leaves its own unique “reverse” footprint on neutral diversity (Kreitman & Di Rienzo 2004)[^kreitman-2004] . Because the segments of DNA constituting the balanced polymorphism are held in the population by selection much longer than expected based on random drift, these segments have a higher effective population size (owing to lower variation in offspring numbers than random). As a result, they have a longer time to accumulate mutational variation at nearby neutral sites. In some cases, the time is longer than that required to create new species, resulting in *trans-specific polymorphisms* (Cho et al. 2006)[^cho-2006]. Thus, levels of neutral diversity are expected to be enhanced in the vicinity of a molecular balanced polymorphism. When the mating system restricts recombination (e.g., selfing or inbreeding species), the region of elevated neutral diversity in the vicinity of a balanced polymorphism can be extensive (e.g., *Arabiodopsis thaliana* [Tian et al. 2002])[^tian-2002].
    step1: |-
      福特观察到的那类平衡选择，会在中性多样性上留下自己独特的“反向”足迹（Kreitman & Di Rienzo 2004）[^kreitman-2004]。由于构成平衡多态性的 DNA 片段被选择保留在种群中的时间远比基于随机漂变的预期长，这些片段拥有更高的有效种群大小（因为后代数量变异低于随机）。其结果是，它们有更长的时间在附近的中性位点积累突变变异。在某些情况下，这段时间比创造一个新物种所需的时间还要长，从而产生跨种多态性（Cho et al. 2006）[^cho-2006]。因此，在分子平衡多态性附近，中性多样性水平预计会升高。当交配系统限制重组时（例如自交或近交物种），平衡多态性附近中性多样性升高的区域可以相当广阔（如拟南芥 *Arabiodopsis thaliana* [Tian et al. 2002]）[^tian-2002]。
    step2: |-
      福特观察到的那类平衡选择，会在中性多样性上留下自己特有的“反向”足迹（Kreitman & Di Rienzo 2004）[^kreitman-2004]。构成平衡多态性的那些 DNA 片段，被选择拘留在种群中的时间远超随机漂变所预期的长度；由于后代数量的变异低于随机情形，它们便拥有较高的有效种群大小，也就有更长的时间在邻近的中性位点积累突变变异。有些时候，这段时间甚至超过诞生一个新物种所需的时间，于是形成跨种多态性（Cho et al. 2006）[^cho-2006]。因此可以预期：分子平衡多态性附近的中性多样性水平会有所抬升。当交配系统限制重组时（比如自交或近交的物种），平衡多态性附近那片中性多样性升高的区域可以延展得很广（如拟南芥 *Arabiodopsis thaliana* [Tian et al. 2002]）[^tian-2002]。
