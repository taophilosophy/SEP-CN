      在对费希尔和福特分析的回应中，赖特（1948）首先指出，他的进化理论明确涉及几种力量的同时作用（选择、漂变、突变和迁移），并断然拒绝了费希尔与福特的范式，即“要么”选择、要么漂变必须单独对观察到的基因频率波动负全责（参见“群体遗传学”词条）。赖特指出，为了得出其统计结论，福特和费希尔不得不纳入一个更早十年（即更为谨慎的研究之前）的基因频率数据，那是一段没有任何种群大小估计的时期。若去掉这个较早的数据点，平均波动要小得多，也不显著。他指出，正如标记-重捕法估计的种群数量一样，基因频率本身也是估计值；根据报告的样本量，其变异占了费希尔和福特试图解释的观察方差的一半以上（55.2%）。他还表明，如果只假定自然选择这一元解释，那么即便不计抽样方差，观察到的基因频率波动也大得惊人，以致等位基因选择系数的时间变异必须在接近致死（或不育）到巨大优势之间摆动（即从 −0.50 到 +0.50）。然而，费希尔和福特（1947）并未提供任何迹象表明，存在任何环境因素可充当选择动因并具有可比的时间变异水平。赖特论证说，分析所用的有效种群大小几乎肯定过大，可能大出一个数量级；而且费希尔和福特并未尝试估计那些预期会降低有效大小的因素，如繁殖数量的时间变异、幼虫中非随机的死亡（死亡在家庭内成群出现，正如可能影响一个因病毒感染而蛹期死亡率超过 85% 的物种），或后代数量方差的其他原因（如雌体产卵数之间的变异或雄体配偶数之间的变异）。在一篇寸步不让的回复中，费希尔和福特（1950）把基因频率的偶然或随机波动贴上“塞瓦尔·赖特效应”的标签——这一术语作为随机遗传漂变的同义词一直沿用至今。
    step2: |-
      赖特（1948）在回应中首先指出：他的进化理论本就明确涉及几种力量的同时作用（选择、漂变、突变、迁移），并且他断然拒绝费希尔与福特那套“要么”选择、“要么”漂变独自扛起全部基因频率波动的二元框架（参见“群体遗传学”词条）。赖特还点破：要得出那个统计结论，福特和费希尔必须把比精细研究早十年的基因频率数据也塞进分析，而那段时期恰恰没有任何种群大小估计。若抽掉这个较早的数据点，平均波动便小得多，也不再显著。他又指出，基因频率同标记-重捕估计的种群数量一样，本身就是估计值；按其报告的样本量核算，估计误差引起的方差已占去费希尔和福特想解释的观察方差的一大半（55.2%）。他接着演示：若只认自然选择这一元解释，那么观察到的基因频率波动——即便不计抽样方差——也大到令等位基因选择系数的时间变动必须在近乎致死（或不育）与巨大优势之间来回摆荡（即从 −0.50 摆到 +0.50）。可是，对于任何充当选择动因的环境因素，费希尔和福特（1947）都没有出示过拥有可堪比较的时间变异水平的迹象。赖特进而论证：分析所用的有效种群大小几乎肯定定得过大，可能大出一个数量级；而且费希尔和福特压根没有尝试估计那些预期会拉低有效大小的因素——繁殖数量的时间波动、幼虫期非随机的死亡（同一家族内聚集发生的死亡，正如可能影响一个因病毒感染而蛹期死亡率超过 85% 的物种的那样），或后代数量方差的其他来源（比如雌体之间产卵数的差异，或雄体之间配偶数的差异）。费希尔和福特（1950）寸步不让，在回复中给基因频率的偶然波动或随机波动贴上“塞瓦尔·赖特效应”的标签；这个术语作为随机遗传漂变的同义词，一直沿用至今。
