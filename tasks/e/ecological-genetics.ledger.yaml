      The founding ecological geneticists dismissed any significant role for random genetic drift in evolution (see the entry on genetic drift). The theoretical interaction of random genetic drift and natural selection for single genes with constant effects can be seen in Figure 1. Fisher in his evolutionary theory assumed that natural populations achieved or sustained very large sizes as seen in his correspondence with S. Wright (letter from R. A. Fisher to S. Wright, August 13, 1929, as quoted in Provine 1986: 255)[^provine-1986] where he stated that “I believe *N* must usually be the total population on the planet, enumerated at sexual maturity”. Similarly, according to his intellectual biographer W. Ewens:
    step1: |-
      生态遗传学的奠基者们否认随机遗传漂变在进化中起任何重要作用（参见“遗传漂变”词条）。单基因在效应恒定时，随机遗传漂变与自然选择的理论互动见图 1。费希尔在其进化理论中假定自然种群达到或维持极大的规模，这见于他与 S. 赖特的通信（R. A. Fisher 致 S. Wright 的信，1929 年 8 月 13 日，转引自 Provine 1986: 255）[^provine-1986]：他在信中说，“我相信 *N* 通常必须是地球上该物种的种群总数，在性成熟时清点”。同样，据其思想传记作者 W. 尤文斯（W. Ewens）：
    step2: |-
      生态遗传学的奠基者否认随机遗传漂变在进化中扮演任何重要角色（参见“遗传漂变”词条）。就效应恒定的单个基因而言，随机遗传漂变与自然选择之间的理论互动见图 1。费希尔的进化理论假定，自然种群的规模达到或维持着极大的水平；这见于他写给 S. Wright 的一封信（1929 年 8 月 13 日，转引自 Provine 1986: 255）[^provine-1986]：“我相信 *N* 通常必须是性成熟时清点的全球种群总数。”同样的话也出自其思想传记作者 W. 尤文斯（W. Ewens）：
