      爱默生在道德与真理上的若干最惊人的想法，都是从他的过程形而上学推出来的：德性没有哪一种具有最终性或永恒性，全部都是“初始的”（CW2: 187）；真理是一瞥一瞥得来的，而不是可以稳稳端详的。他在《智性》（“Intellect”）里写道，我们只能“在真理与安息之间”二选一，不能兼得（CW2: 202）。新的真理像天才的念头，总是猝然降临，即爱默生所谓的“新”（CW3: 40）。所以他寻找的是“某种短短的体验，它在大路上、在市场里，在某个地方、某个时刻，让我吃了一惊……”（CW1: 213）。这样的体验，无法靠重返原地或重看某件东西（比如一幅画）而复得。爱默生觉得，人生的一大遗憾正在这里：有些画只能“看”一次；那些用欢乐和洞见充实过我们一天或一个钟头的故事与人，也没法把那场面再演一遍。
