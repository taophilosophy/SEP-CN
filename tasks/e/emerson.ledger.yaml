      爱默生晚年以《教育》一文重返教育主题，那是他在 1860 年代毕业典礼上以不同版本所作的演说。自立这一主题在该文中出现于他关于尊重的讨论里。他说，“教育的秘密”“在于尊重学生”。学生将知道什么、做什么，不由教师来选择，而要由学生自己去发现“他自己的秘密”。因此教师必须“等待，并观看自然的新产物”（E: 143），在适当的时候加以引导与约束——目的不是鼓励重复或模仿，而是发现每个孩子献给世界的那份新力量。教育的目标是“保持”孩子的“天性，并顺着它所指的方向以知识武装它”（E: 144）。爱默生警告说，这一目标在大众教育中被牺牲了。我们不该教育“大众”，而应“怀着敬意，一个一个地”教育，抱持这样的态度：“每个学生的学费都需要整个世界来支付”（E: 154）。
