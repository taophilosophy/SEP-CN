      尽管语调与侧重上有重要差异，爱默生对我们处境的评估在全部写作中大体如一。对普通人生活最严厉的控诉，莫过于早期作品《美国学者》：爱默生在那里说，“历史中的人、今日世界中的人，是虫子，是鱼卵，被称作‘群众’和‘群氓’。一个世纪里、一千年里，有一两个人；也就是说，有一两个接近每个人应有状态的人”（CW1: 65）。反过来，他早期作品中也没有比《命运》里那句更唯心论的陈述：“[思]想把心灵带到一个一切皆可塑的领域，从而消解了物质宇宙”（CW6: 15）。总而言之，早期作品对人类可能性表达了更明朗的希望，即爱默生及其同代人正待迈出向上、向前的一大步；晚期作品仍然怀抱希望、仍然自信，却在一种重负或压力之下运作，对世界那种沉默的抵抗有更强的感受。
