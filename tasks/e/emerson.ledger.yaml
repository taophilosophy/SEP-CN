      1850 年的《逃奴法》实际上把奴隶制全国化了，它要求自由州的官员与公民协助把逃跑的奴隶送还其主人。爱默生 1851 年的《致康科德市民书》既呼吁废除该法，也呼吁在该法仍然有效时违抗它。1854 年，逃跑奴隶 Anthony Burns 依马萨诸塞州最高法院首席大法官的命令被船运回弗吉尼亚，该命令由美国海军陆战队执行，依据的正是这部新法。这个“马萨诸塞州的奴隶制”的例子（亨利·梭罗在一篇著名演说中如此称之），是爱默生 1855 年《论奴隶制》演说的背景；他在其中把 1787 年原初宪法对奴隶制的承认称为“罪行”。从 1840 年代末到内战爆发，爱默生曾在不同地方多次发表这些及其他反奴隶制演说。战争前夕，爱默生支持约翰·布朗——这位暴力的废奴主义者 1859 年袭击了西弗吉尼亚州哈珀斯费里的美国军械库，随后被美国政府处死。战争期间，爱默生为联邦军的黑人团队筹款（Wirzbicki, 251–2），并向庆祝林肯总统 1863 年《解放宣言》的三千名听众朗诵了他的《波士顿颂》。爱默生写道：“向主人支付赎金，把袋子装得满满。谁是主人？奴隶才是主人。从来都是。付钱给他”（CW9: 383）。
