      爱默生的道德观，与他的过程形而上学交织在一起，也与他的至善论交织在一起——所谓至善论，是说人生有一个目标：过渡到“更高的形式”（CW3:14）。目标固然还在，人类生活的种种形式（包括诸德性）却全是“初始的”（CW2: 187）。“初始的”这个词让人想到动词“开创”；对爱默生“一切德性都是初始的”一语，有一种读法是：德性开创出历史地生长着的生活形式，比如罗马贵族的生活方式，或儒家 *junxi*（君子）的生活方式。爱默生确实有道德随历史发展的意识；但在《圆圈》一文的具体语境里，他推向的是一个更激进、更怀疑的立场：我们的德性往往必须被舍弃，而不是被培育。他写道：“改革的恐怖，就在于发现我们必须把自己的德性——或者我们一直当作德性的东西——丢进那个早已吞掉我们更粗野恶习的深坑”（CW2: 187）。加上的限定语“或者我们一直当作德性的东西”，说明爱默生并不赞同一种省事的相对主义：那种相对主义认为，任何时代被当成德性的，就必定真是德性。但他确实给一切既成的思考方式与行为方式蒙上了一层疑云。审视德性的恰当立足点是“新的时刻”——他在别处把这叫作真理而非安息（CW2:202）——在这一刻，过去显得重要的东西，也许会显得“琐屑”或“虚妄”（CW2:189）。从这个视角看（更确切地说，从这样一组不断生成的视角看），德性并没有消失，只是可能被根本改变、重新排布。
