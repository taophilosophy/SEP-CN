      爱默生的作品在他那个时代已为全美国与全欧洲所熟知。尼采读过爱默生随笔的德译本，把《历史》与《自立》中的段落抄进自己的笔记本，并这样谈到《随笔集》：他从未“在一本书里如此自在过”。爱默生关于“强大而满溢的”英雄、作为战斗的友谊、教育、以及为获得控制而放弃控制的观念，都可以在尼采的著作中找到踪迹。其他爱默生式的观念——关于过渡、关于寻常事物中的理想、关于人类意志的力量——则渗透在威廉·詹姆斯与约翰·杜威等古典美国实用主义者的著作中。
