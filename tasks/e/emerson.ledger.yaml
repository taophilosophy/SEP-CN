      《经验》是一篇关键的过渡性随笔。它开篇的问题是：“我们在何处找到自己？”答案并不令人愉快，因为爱默生发现我们身处一个错位而晦暗的位置：“睡眠在我们一生中萦绕于眼际，如同白昼里夜色整天盘桓在冷杉的枝头”（CW3: 27）。一件事悬在这篇随笔之上，直到第三段才揭晓，那就是他五岁儿子沃尔多的死。爱默生从这一事件及自己对它的反应中，看到了存在的一种“不美”的一般性格的例证——它永远从我们身边滑走，就像他的小男孩一样。
