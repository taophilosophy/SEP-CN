      The corporeal nature of the soul has two crucial consequences for Epicureanism. First, it is the basis of Epicurus’ demonstration that the soul does not survive the death of the body (other arguments to this effect are presented in Lucretius 3.417–614). The soul’s texture is too delicate to exist independently of the body that contains it, and in any case the connection with the body is necessary for sensation to occur. From this it follows that there can be no punishment after death, nor any regrets for the life that has been lost. Second, the soul is responsive to physical impressions, whether those that arrive from without in the form of laminas or simulacra, or those that arise from internal motions of the body. No phenomena are purely mental, in the sense of being disembodied states or objects of pure consciousness conceived as separate from embodiment. The elementary sensations of pleasure and pain, accordingly, rather than abstract moral principles or abstract concepts of goodness or badness, are the fundamental guides to what is good and bad, since all sentient creatures are naturally attracted to the one and repelled by the other. The function of the human mind — that part of the soul that is located in our chest — is not to seek higher things, but to maximize pleasure and minimize pain. That is its entire objective; the risk (a substantial one) is that it may miscalculate, since it is subject to false beliefs and errors in cognitive processes.
    step1: |-
      灵魂的物体性对伊壁鸠鲁主义有两个关键后果。第一，它是伊壁鸠鲁证明灵魂不随身体死亡而存在的根据（卢克莱修 3.417–614 另有支持此说的论证）。灵魂的质地过于纤细，无法离开容纳它的身体而独立存在；无论如何，与身体的联结是感觉发生的必要条件。由此推出：死后不可能有惩罚，也不会有对已逝生命的悔恨。第二，灵魂能对物理印象作出反应，不论这些印象是以薄膜或影像的形式由外而来，还是由身体内部运动引起。没有纯粹心理的现象，即没有脱离身体的状态，也没有被设想为与身体分离的纯意识对象。因此，快乐与痛苦这些基本感觉——而非抽象的道德原则或关于善恶的抽象概念——才是善恶的根本指南，因为一切有感觉的生物天然趋向前者、避开后者。人的心灵——灵魂中位于我们胸部的那个部分——的功能不是追求更高的事物，而是使快乐最大化、痛苦最小化。这就是它的全部目标；风险（而且是相当大的风险）在于它可能算错，因为它易受虚假信念与认知过程错误的影响。
    step2: |-
      灵魂有形体，这在伊壁鸠鲁主义里引出两个要命的结论。第一，它成了“灵魂不随肉体而亡”这一证明的根据（卢克莱修 3.417–614 另给了一批论证）。灵魂质地太细，离了承载它的身体便无法存在；何况要有感觉，本来就非与身体相连不可。由此可知：死后无罚，也无人为失去的生命而悔恨。第二个结论：灵魂对物理印象有反应，不管印象是外来的薄膜或影像，还是身体内部运动所生。没有哪种现象是纯心理的——既非脱离身体的状态，也非可与身体分离的纯意识对象。于是，善恶的根本指南不是抽象的道德原则，也不是关于好坏的空泛概念，而是苦与乐这两样基本感觉。一切有感觉的生灵，天然趋乐避苦。人的心灵（灵魂落在胸口的那一部分）所图不是高远之物，而是乐极苦尽。它的全部任务仅此一端。风险不小：它会算错，因为它受制于假信念，也受制于认知过程中的种种错误。
