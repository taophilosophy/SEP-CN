      First, he distinguished between the atom, which by its nature cannot be broken apart, and the minimum conceivable expanse of matter: atoms have such minima as parts, but are not minima themselves — there can be no free-standing entity one minimum expanse in size. This resolves the problem of atomic edges, and also that of how atoms can come in different shapes and sizes (though never large enough to be seen): to have the hooks and crevices needed to form compounds, they can scarcely be theoretically partless. Second, Epicurus agreed that time too is discontinuous, as is motion: Simplicius (p. 934.23–30 Diels; translation in Konstan 1989)[^konstan-1989] quotes him as affirming that it is untrue to say that an atom is moving over a minimum interval, but only that it has moved (some scholars maintain that this is a later innovation in the school; see especially Verde 2013)[^verde-2013][^verde-2013-2]. What is more, as Aristotle had argued must be the case, atoms all move at the same velocity (the principle of *isotakheia*). This last claim entailed difficulties of its own, such as how atoms ever overtake each other, if they are moving in the same direction. (Lucretius invoked the idea of a random swerve to solve this one; see below.) But it also provided a solution to another problem, that of entropy: for since atoms can never slow down, the universe can never come to a halt (in modern terms, there is no loss of energy). As for gravity, Epicurus may have had a solution to this too, and in a novel form. If an atom just on its own cannot slow down or alter its direction of motion, then an atom that is rising or moving in an oblique direction cannot at some point begin to tilt or fall, unless something blocks its progress and forces it to do so. If, however, after a collision atoms tended to emerge in a statistically favored direction — that is, if the motions of all atoms after collisions did not cancel each other out but on average produced a vector, however small, in a given direction, then that direction would by definition be down. The absence of a global orientation in the universe was thus immaterial. Due to this vector, any given world will, like our own, be similarly oriented in respect to the direction “down.” (Given the infinite expanse of the universe on Epicurean theory — see below — we must expect there to be a plurality of worlds, some like ours, some — within limits — different.)
    step1: |-
      第一，他区分了原子与可设想的最小物质广延：原子按本性不可打碎，最小广延则是物质的最小尺度。原子以这类最小量为部分，但原子本身不是最小量——不存在仅有单一最小广延大小的独立实体。这就解决了原子边缘的问题，也解决了原子何以有不同形状与大小的问题（尽管从不大到可见）：原子若要具有形成化合物所需的钩与凹槽，在理论上就很难完全没有部分。第二，伊壁鸠鲁同意时间与运动一样不连续：辛普里丘（第 934.23–30 页 Diels；译文见 Konstan 1989）[^konstan-1989] 引述他的主张：说一个原子在最小间隔内“正在运动”并不真确，只能说它“已经运动”（有些学者认为这是该学派后来的创新；尤其参 Verde 2013）[^verde-2013][^verde-2013-2]。再者，正如亚里士多德所论证的必然后果，所有原子都以相同速度运动（*isotakheia* 即等速性原则）。这后一主张本身也带来困难，例如：若原子朝同一方向运动，它们如何能彼此超越？（卢克莱修引入随机偏斜的想法来解决这一点；详见下文。）但它也解决了另一个问题，即熵的问题：既然原子永远不会减速，宇宙就永远不会停下来（用现代的话说，没有能量损失）。至于重力，伊壁鸠鲁或许也有解决办法，而且形式新颖。若一个孤立的原子既不能减速，也不能改变运动方向，那么一个上升或斜行的原子就不可能在某处开始倾斜或下落，除非有什么东西阻挡其进程、迫使它如此。然而，如果碰撞之后原子倾向于朝统计上占优的方向逸出——也就是说，如果碰撞后所有原子的运动并不相互抵消，而是平均而言在某个方向上产生一个无论多小的矢量——那么按定义，这个方向就是“下”。宇宙缺少整体定向，于是无关紧要。有了这个矢量，任何一个世界都会像我们的世界一样，相对于“下”这个方向获得类似的定向。（鉴于伊壁鸠鲁理论中宇宙的无限广延——见下文——我们必须预期存在多个世界，有些像我们的，有些则在限度之内有所不同。）
    step2: |-
      首先，他把原子与“可设想的最小物质广延”分开来看。原子按本性打不碎；最小广延则是物质所能有的最小尺度。原子以这种最小量为部分，自身却不是最小量——世上不存在只有一个最小广延那么大的独立实体。原子边缘的难题由此化解；原子为何能有种种形状、种种大小（尽管从不大到肉眼可见）也一并得解：原子要长出成化合物所需的钩子与凹槽，理论上就不能没有部分。其次，伊壁鸠鲁同样认为时间不连续，运动亦然。辛普里丘（第 934.23–30 页 Diels；译文见 Konstan 1989）[^konstan-1989] 引述他说：讲一个原子“在最小间隔内正在运动”并不真确，只能说它“已经运动”（有学者以为这是学派后来的新说；尤其参 Verde 2013）[^verde-2013][^verde-2013-2]。再次，所有原子速度相同（*isotakheia*，等速性原则）——亚里士多德论证过，这是必有的结果。这条主张自己也惹麻烦：原子若同向而行，如何能彼此赶超？（卢克莱修搬出随机偏斜来救场；详见下文。）不过它也顺手解决了另一个问题——熵。原子从不减速，宇宙便永不停摆（用今天的话说：能量没有损耗）。重力方面，伊壁鸠鲁可能也有答案，而且很新鲜。一个孤零零的原子既不能减速，也不能转向；那么上升或斜行的原子，就不会半途忽然倾斜、下坠，除非有外物挡住去路、逼它如此。反过来设想：碰撞之后，原子若倾向于朝某个统计上占优的方向逸出——碰撞后全体原子的运动不相抵消，平均起来在某方向上留下一个矢量，无论多小——那么按定义，该方向就是“下”。宇宙有没有整体定向，便无关紧要了。靠着这个矢量，任何世界都会像我们这个世界一样，相对于“下”取得定向。（伊壁鸠鲁理论中的宇宙无限延展，详见下文；据此必须设想世界不止一个：有的与我们相似，有的则在限度之内另有模样。）
