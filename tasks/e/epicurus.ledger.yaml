      This early form of social life had various advantages: among others, the relative scarcity of goods prevented excessive competition (sharing was obligatory for survival) and thereby set limits on those unnatural desires that at a later, richer phase of society would lead to wars and other disturbances. It would appear too that, before language had developed fully, words more or less conformed to their original or primitive objects, and were not yet a source of mental confusion. But thanks to a gradual accumulation of wealth, the struggle over goods came to infect social relations, and there emerged kings or tyrants who ruled over others not by virtue of their physical strength but by dint of gold. These autocrats in turn were overthrown, and after a subsequent period of violent anarchy people finally saw the wisdom of living under the rule of law. This might seem to represent the highest attainment in political organization, but that is not so for the Epicureans. For with law came the generalized fear of punishment that has contaminated the blessings of life (Lucretius 5.1151; cf. [Philodemus] *On Choices and Avoidances* col. XII). Lucretius at this point gives an account of the origin of religious superstition and dread of the gods, and although he does not relate this anxiety directly to the fear of punishment under human law, he does state that thunder and lightning are interpreted as signs that the gods are angry at human sins (5.1218–25). While primitive people in the presocial or early communal stages might have been awed by such manifestations of natural power and ascribed them to the action of the gods, they would not necessarily have explained them as chastisement for human crimes before the concept of punishment became familiar under the regime of law. People at an early time knew that gods exist thanks to the simulacra that they give off, although the precise nature of the gods according to Epicurus remains obscure (for contrasting intepretations, see Konstan 2011 and Sedley 2011)[^konstan-2011][^sedley-2011]; but the gods, for him, do not interest themselves in human affairs, since this would compromise their beatitude (see Obbink 1996: 321–23)[^obbink-1996].
    step1: |-
      这种早期的社会生活有各种好处：其中之一是，财货相对稀缺，防止了过度竞争（分享乃生存所迫），从而为那些不自然的欲望设定了限度——在社会较富裕的后期阶段，这类欲望会引向战争与其他扰动。看来在语言充分发展之前，词语大体符合其原初或朴素的指称对象，还不至于成为心灵混乱的来源。但由于财富逐渐积累，围绕财货的争夺开始侵蚀社会关系，于是出现了国王或僭主，他们统治他人靠的不是体力，而是黄金。这些专制者随后又被推翻，在经历一段暴力的无政府状态之后，人们终于看出在法治下生活的智慧。这似乎代表了政治组织的最高成就，但对伊壁鸠鲁派而言并非如此。因为随着法律而来的，是普遍化的对惩罚的恐惧，它污染了生活的福分（卢克莱修 5.1151；比较[菲洛德穆]《论选择与回避》第十二栏）。卢克莱修在此处讲述了宗教迷信与对神之畏惧的起源；虽然他并未把这种焦虑直接联系到人在世俗法律下对惩罚的恐惧，但他确实说，雷鸣闪电被解释为神对人罪行发怒的征兆（5.1218–25）。前社会或早期共同体阶段的原始人，固然可能对这些自然力量的显示感到敬畏，并把它们归因于神的活动，但在惩罚观念随法治而为人熟知之前，他们未必会把这些现象解释为对人类罪行的惩处。人在早期就知道神存在，这要归功于神发出的影像，尽管按伊壁鸠鲁，神的确切本性仍不清楚（对立的解释见 Konstan 2011 与 Sedley 2011）[^konstan-2011][^sedley-2011]；但在他看来，神不关心人间事务，因为那样会损害神的至福（见 Obbink 1996: 321–23）[^obbink-1996]。
    step2: |-
      早期社会生活自有其长处。其一，物产稀薄，争逐无从过度——不分享便活不成——于是那些不合自然的欲望被卡住了限度；到了社会更富足的后来阶段，这类欲望便会引出战争与种种纷乱。另一长处是：语言尚未充分发达时，词语大体贴着它们原初的所指，还不至于搅乱人的心灵。可财富慢慢积了起来，夺物之争于是渗进社会关系，国王与僭主应运而生。他们支配他人，靠的不是力气，是金子。这类专权者后来又被推翻；一段暴力无政府的混乱之后，人们才看明白：还是该活在法律之下。在旁人看来，这已是政治组织的顶点；伊壁鸠鲁派偏不这么看。因为法律一到，人人怕罚的普遍恐惧也随之而来，生活的福分就此染了毒（卢克莱修 5.1151；参[菲洛德穆]《论选择与回避》第十二栏）。卢克莱修接着讲宗教迷信与畏神之情的起源。他没有把这份焦虑直接系于世俗法律下的刑罚之惧，却明说：雷轰电闪被解作神因人间罪过而动怒的征兆（5.1218–25）。尚无社会、或只在早期共同体阶段的人，面对这类自然威能，固然会心生敬畏，归之神力；但在“惩罚”观念随法治变得熟悉之前，他们未必会把雷霆说成是对人类罪行的惩处。人之早知有神，靠的是神所发出的影像；至于神的确切本性，在伊壁鸠鲁那里仍属暗昧（两种相反的解读见 Konstan 2011、Sedley 2011）[^konstan-2011][^sedley-2011]。不过在他看来，神决不干预人事——一干预，神的至福就保不住了（见 Obbink 1996: 321–23）[^obbink-1996]。
