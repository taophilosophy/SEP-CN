      Epicurus now has in place the fundamental constituents of his natural world, and he might have stopped here, with atoms and void and the denial, on the grounds of inconceivability, of any other kind of basic physical principle. All secondary properties, such as color and taste, will be explained as epiphenomena of atomic combinations, and perception of things at a distance by the continual emission of infinitesimally thin laminas from objects, which maintain the relevant features of the source (in the case of vision, for example, the laminas will preserve the atomic patterns specific to the color and shape of the object) and directly stimulate the relevant sense organ. This is a tricky thesis, and again posed puzzles: how do the lamina or simulacra, as Lucretius called them, of a mountain enter the eye, for example? In fragments? By somehow shrinking? We do not know the answer to this one, but there are some plausible hypotheses (see Leone 2012; Konstan 2020)[^leone-2012][^konstan-2020]. A few more concepts fill in the picture of the natural world: thus, Epicurus denies that there can be infinitely many kinds of atoms, for then all shapes (which define the kinds) at any given magnitude would be exhausted and atoms would have to reach visible proportions, which we know that they do not (this argument depends on the idea of minima, discussed further below); instead, the number of kinds (i.e., shapes of various microscopic sizes) is inconceivably large but “not strictly infinite,” whereas the number of each kind of atom is simply infinite (*LH* 55–56). This condition is also invoked to explain why there is a limit on possible types of combinations of atoms, and hence on the number of viable species of things in the perceptible world: if there were infinitely many kinds of atoms, Epicurus believed, they could combine to generate absolutely anything — an infinity of different sorts of thing.
    step1: |-
      至此，伊壁鸠鲁已备齐其自然世界的基本构成物；他本可以就此止步：原子与虚空，并以不可设想为由否认任何其他种类的基本物理原理。一切次级属性，如颜色与味道，都将被解释为原子结合的附带现象；对远处事物的感知，则由物体不断发射无限薄的薄膜来解释——这些薄膜保持源物的相关特征（例如在视觉中，薄膜会保存物体颜色与形状所特有的原子图案），并直接刺激相应的感觉器官。这是个棘手的主张，又带来难题：比方说，一座山的薄膜——或按卢克莱修的叫法，影像——如何进入眼睛？以碎片形式？靠某种收缩？我们不知道这个问题的答案，但有一些貌似合理的假说（见 Leone 2012；Konstan 2020）[^leone-2012][^konstan-2020]。还有几个概念补足了自然世界的图景：伊壁鸠鲁否认原子种类可以无限多，因为那样一来，任何给定大小上的全部形状（形状界定种类）都会被耗尽，原子就不得不到达可见的尺度，而我们明知它们并未如此（这一论证依赖最小量观念，下文将进一步讨论）；他认为，种类的数目（即各微观尺寸的形状）大到不可设想，却“并非严格无限”，而每一种原子的数目则简直是无限的（*LH* 55–56）。这一条件也被用来解释：为什么原子的可能结合类型有限，因而可感知世界中可存活的物种数目也有限。伊壁鸠鲁相信，若原子种类无限多，它们结合就能生成任何东西——无限多种不同的事物。
    step2: |-
      自然世界的基本构件，到此已归伊壁鸠鲁掌握。他本可在此搁笔：有原子，有虚空，再以“不可设想”为由，把别种基本物理原理一概否掉。次级属性（颜色、滋味之类）都可解作原子结合的附带现象。远处之物的感知，则解作物体持续发射的极薄薄膜：薄膜保持着源物的相关特征（以视觉为例，薄膜会保留物体颜色与形状特有的原子图案），径直刺激相应的感官。此说棘手，又生疑窦。一座山的薄膜——卢克莱修称之为影像——如何进入眼睛？碎成片？缩得很小？答案无从知晓，但颇有几种说得通的假说（见 Leone 2012、Konstan 2020）[^leone-2012][^konstan-2020]。还有几个概念可以补全这幅自然图景。伊壁鸠鲁否认原子种类可以无穷多。若真是无穷多，则任一给定大小上的形状（形状即种类）必被穷尽，原子便须大到肉眼可见；而原子分明未至此（此论证依托最小量观念，下文再议）。所以他主张：种类之数（即各微观尺寸的形状）大到不可设想，却“并非严格无限”；而每一类的原子之数，则是地道的无限（*LH* 55–56）。这一条件还用来解释两件事：原子的可能结合为何有上限，可感世界中能存续的物种之数何以有限。伊壁鸠鲁以为，倘若原子种类无穷多，它们一结合便能生出任何东西——无限种事物。
