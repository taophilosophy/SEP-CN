      If one does not fear the gods, what motive is there for living justly? Where law obtains, Epicurus indicates, it is preferable not to commit crimes, even secret ones, since there will always be anxiety over the possibility of detection, and this will disrupt the tranquillity or ataraxy that is the chief basis of happiness in life (see *Principal Beliefs* = *KD* 34–35). Justice, for Epicurus, depends on the capacity to make compacts neither to harm others nor be harmed by them, and consists precisely in these compacts; justice is nothing in itself, independent of such arrangements (*KD* 31–33). According to Epicurus (*LM* 132, *KD* 5), someone who is incapable of living prudently, honorably, and justly cannot live pleasurably, and vice versa. Moreover, prudence or wisdom (*phronêsis*) is the chief of the virtues: on it depend all the rest. This again sounds calculating, as though justice were purely a pragmatic and selfish matter of remaining unperturbed. Epicurus does not entertain the thought experiment proposed by Plato in the *Republic* (359C–360D), in which Plato asks whether a person who is absolutely secure from punishment would have reason to be just. Did Epicurus have an answer to such a challenge? He may simply have denied that anyone can be perfectly confident in this way. Perhaps, however, he did have a reply, but it was derived from the domain of psychology rather than of ethics. A person who understands what is desirable and what is to be feared would not be motivated to acquire inordinate wealth or power, but would lead a peaceful life to the extent possible, avoiding politics and the general fray. An Epicurean sage, accordingly, would have no motive to violate the rights of others. Whether the sage would be virtuous is perhaps moot; what Epicurus says is that he would live virtuously, that is prudently, honorably, and justly (the adverbial construction may be significant). He would do so not because of an acquired disposition or *hexis*, as Aristotle had it, but because he knows how to reason correctly about his needs. Hence his desires would be limited to those that are natural (not empty), and so easily satisfied, or at least not a source of disturbance if sometimes unsatisfied.
    step1: |-
      人若不惧神，还有什么动机促使他正义地生活？伊壁鸠鲁指出，在有法律的地方，不犯罪更好，即使暗中犯罪也不可取，因为人总会担心被发现，这种担心会搅乱心神宁静，而心神宁静是幸福人生的主要基础（见《主要学说》＝*KD* 34–35）。对伊壁鸠鲁来说，正义依赖于缔结契约的能力——既不伤害他人，也不被他人伤害——正义恰恰就在这些契约之中；正义本身并非独立于这类安排而存在的东西（*KD* 31–33）。按照伊壁鸠鲁（*LM* 132，*KD* 5），不能审慎地、高尚地、正义地生活的人，也不能快乐地生活，反之亦然。而且，审慎或智慧（*phronêsis*）是诸德性之首：其余一切皆依它而立。这听起来又像是算计，仿佛正义纯粹是保持内心不受扰的务实而自私之事。伊壁鸠鲁没有考虑柏拉图在《理想国》中提出的思想实验（359C–360D）：一个绝对确保不受惩罚的人是否有理由正义。伊壁鸠鲁对这种挑战有无答复？他也许干脆否认有人能如此绝对自信。不过，他也许确实有答复，但那答复出自心理学而非伦理学。懂得何为可欲、何为当惧的人，不会有动机去获取过度的财富或权力，而会尽可能过平静的生活，避开政治与一般的纷扰。因此，伊壁鸠鲁派的智者没有侵犯他人权利的动机。智者是否富有德性，也许是可争议的问题；伊壁鸠鲁所说的是，他会德性地生活，即审慎地、高尚地、正义地生活（副词结构也许有意义）。他这样做，不是因为养成了某种习性状态或 *hexis*（如亚里士多德所说），而是因为他懂得如何就自己的需要正确推理。所以，他的欲望将限于自然（而非空洞）的欲望，因而容易满足；即使有时不得满足，也不至于成为扰乱的来源。
    step2: |-
      倘若不怕神，人还有什么理由正直地活着？伊壁鸠鲁的回答是：凡有法律之处，最好别犯罪，暗中犯的也最好别有。因为人总要提心吊胆怕被发觉，而这份心惊会打破心神宁静——那正是幸福人生的主要根基（见《主要学说》＝*KD* 34–35）。正义在伊壁鸠鲁这里，取决于立约的能力：约定互不伤害。正义不是别的，就是这些约定本身；离开这类安排，正义一无所有（*KD* 31–33）。他又说（*LM* 132、*KD* 5）：不能审慎地、高尚地、正义地生活的人，也快活不起来；反过来同样成立。审慎或智慧（*phronêsis*）且为诸德之首，余德皆系于此。这话听着又像是盘算：仿佛正义无非是保内心不扰的务实私计。柏拉图在《理想国》里设过一个思想实验（359C–360D）：若一个人绝对保证不受惩罚，他还有没有理由正义？伊壁鸠鲁并未接这个招。他大概压根否认有人能对自己如此有把握。不过，他也许另有答复，只是答复在心理学一边，不在伦理学一边。懂得什么可欲、什么当惧的人，不会想去捞取过度的财富与权力；他会尽可能安静度日，避开政治，避开人堆。这样的伊壁鸠鲁派智者，自然没有侵犯他人权利的由头。至于他是不是有德之人，问题或可存疑；伊壁鸠鲁的原话是：他会德性地生活，亦即审慎地、高尚地、正义地生活（用副词，也许别有意味）。他这么做，不是靠养成的品质或 *hexis*（那是亚里士多德的说法），而是靠懂得如何就自身需要作正确的推理。因此，他的欲望只限自然者、不含空洞者：既易满足，纵偶有不足，也成不了扰乱的来路。
