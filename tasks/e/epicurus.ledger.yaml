      Epicurus held that the elementary constituents of nature are undifferentiated matter, in the form of discrete, solid and indivisible particles (“atoms”) below the threshold of perception, plus empty space, that is, the complement of matter or where matter is not (Inwood 1981, Konstan 2014; contra Sedley 1982, who argues that space, for Epicurus, is a continuous matrix extending uniformly throughout the universe, and is either occupied by matter or empty)[^inwood-1981][^konstan-2014][^sedley-1982]. In its broad outline, Epicurus inherited this scheme from the earlier atomists, above all Democritus. But Democritus’ version had been the object of critiques by later thinkers, especially Aristotle, in part for incoherencies in the notion of an infinite void, in part for problems attaching to his idea of minima, or entities of the smallest conceivable size (see especially *Physics* Book 6). First, freestanding entities of minimal size could have no edges, and so no shapes, or rather would be all edge: thus, if two minima touched, they would wholly overlap. (The same argument applies to points in a line, which is why a line contains points but is not composed of them, according to Aristotle.) Further, if atoms really are conceptually indivisible, and not just physically unsplittable, then when two atoms pass by each other it is impossible that they should at any time be only partway past, for this would imply a point partway along the length of the atom, which contradicts the premise that it is a minimum. Although Aristotle does not state the argument precisely in this form, it is apparent that a strict conception of minimal-sized atoms entails that motion too must consist of discontinuous quanta; and if motion, then time. Atoms must, then, Aristotle inferred, move in discrete hops (*kinêmata*), each one occupying a single temporal minimum — and hence, all atoms must move at a uniform speed. An infinite void, with atoms distributed throughout it, led to problems of its own, for it permits no intrinsic spatial orientation and hence no account of why things fall, as they are observed to do.
    step1: |-
      伊壁鸠鲁认为，自然的元素性构成物有两种：一是无差别的物质，以离散、坚实而不可分的粒子（“原子”）形式存在，位于感知阈限之下；二是虚空，即物质的补足者，或物质不在之处（Inwood 1981、Konstan 2014；反对意见见 Sedley 1982，他认为在伊壁鸠鲁那里，空间是一种连续基质，均匀延伸于宇宙之中，或为物质占据，或为空）[^inwood-1981][^konstan-2014][^sedley-1982]。就大致轮廓而言，伊壁鸠鲁从早期原子论者尤其是德谟克利特那里继承了这一方案。但德谟克利特的版本曾受到后世思想家尤其亚里士多德的批评：一半因为无限虚空的概念内部不自洽，一半因为其“最小量”观念——即可设想的最小尺寸的实体——所带来的问题（尤其参《物理学》第 6 卷）。第一，最小尺寸的独立实体不可能有边缘，因而没有形状，或者简直可以说全是边缘：这样一来，若两个最小量相接触，它们就会完全重合。（同一论证适用于直线上的点；据亚里士多德，这正是直线包含点、却不由点构成的原因。）第二，如果原子在概念上确实不可分，而不只是物理上不可劈开，那么当两个原子彼此错过时，它们在任何时刻都不可能只走完一半路程；因为那将意味着原子长度上有一个中途之点，而这与“原子是最小量”的前提相矛盾。亚里士多德虽未精确地以此形式陈述该论证，但显而易见：若严格坚持最小尺寸的原子，运动就必须由不连续的量子构成；运动如此，时间亦然。亚里士多德由此推断，原子必以离散的“跳跃”（*kinêmata*）运动，每一跳占据一个时间最小量；于是所有原子必以同一速度运动。无限虚空加上遍布其中的原子，又有其自身的问题：它不允许任何内在的空间定向，因而无法说明事物为何像人们观察到的那样下落。
    step2: |-
      照伊壁鸠鲁的看法，自然的基本成分无非两样。其一是无差别的物质，表现为离散、坚实、不可分的粒子，即“原子”，小到落在感知阈限以下。其二是虚空：它是物质的补足面，是物质所不在之处（Inwood 1981、Konstan 2014；Sedley 1982 持异议，主张伊壁鸠鲁的空间是一种连续基质，均匀铺展于全宇宙，或为物质占据，或空无一物）[^inwood-1981][^konstan-2014][^sedley-1982]。这套方案的大轮廓承自早期原子论者，首推德谟克利特。可德谟克利特的版本后来招致批评，批评者主要是亚里士多德。批评有两处着力：一是无限虚空之说前后不一贯；二是“最小量”观念惹出的麻烦——所谓最小量，即可以设想的最小尺寸的实体（尤其参《物理学》第 6 卷）。先看第一处。最小尺寸的独立实体不会有边缘，于是也就没有形状；说得更绝些，它整个就是边缘：两个最小量一旦相接，必然完全重合。（同样的论证也适用于直线上的点。据亚里士多德，正因如此，直线包容点，却不由点组成。）再看第二处。假若原子在概念上真的不可分，而不只是物理上劈不开，那么两个原子交错而过时，绝不可能在某一时刻只走过一半：那等于说原子长度上存在一个中途之点，与“最小量”的前提直接冲突。亚里士多德并未把话讲到这个份上，但结论显豁：严格按最小尺寸设想原子，运动就只能由不连续的量子组成；运动如此，时间也如此。由此他推断，原子以离散的“跳跃”（*kinêmata*）前行，每一跳占去一个时间最小量；既然如此，所有原子必以同一速度运动。至于无限虚空，原子散布其间，麻烦另有一堆：它给不出任何内在的空间定向，于是物体为何下坠（人们分明见其下坠）也就无从解释。
