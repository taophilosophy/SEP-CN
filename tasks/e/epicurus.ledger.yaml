      “Epicurus, the son of Neocles and Chaerestrata, was an Athenian from the deme of Gargettus and the lineage of the Philaïdes, as Metrodorus says in his *On Noble Families*. Heraclides, among others, in his epitome of Sotion, says that he was raised in Samos, since the Athenians were given parcels of land there, but came to Athens when he was eighteen, when Xenocrates was head of the Academy and Aristotle was still in Chalcis” (where he died in 322). So begins the account by Diogenes Laertius (10.1). The dates for Epicurus’ birth and first move to Athens are thus 341 B.C.E. and 323 respectively. Diogenes adds that after the death of Alexander (323), when the Athenians were expelled from Samos, Epicurus left Athens and joined his father in Colophon (in 321), on the coast of what is now Turkey. Here he studied philosophy under the tutelage of Nausiphanes, a Democritean philosopher with skeptical leanings, and author of a work called the *Tripod*, on which Epicurus reportedly drew for his *Canon*, his principal work on epistemology; in ethics, Nausiphanes substituted the term *akataplêxia* (“undauntability”) for Democritus’ *athambiê*, “fearlessness,” as crucial to the good life, which invites comparison with Epicurus’ *ataraxia* or “imperturbability,” though Epicurus is said to have denied having been influenced by him (On Nausiphanes’ role in transmitting elements of Democritean doctrine to Epicurus, see Warren 2002: 160–92.)
