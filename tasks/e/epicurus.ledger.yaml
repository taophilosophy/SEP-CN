      Epicurus operated with a highly limited number of elementary principles in nature — he did not know the concept of force, for example, or the associated ideas of attraction and repulsion among atoms, not to mention more arcane properties — and for all his efforts to account for all the physical features of the world on the basis of this theory, paradoxes remained. An excellent one is posed by Sextus Empiricus (*Against the Physicists* = *M* 10.144–48), which at the same time gives an idea of how Epicurean atoms were understood to behave (at least in Sextus’ time, late 2ⁿᵈ century C.E.). Sextus imagined two atoms separated by a distance of nine minima, traveling at the same speed (as atoms must) toward each other; after four temporal minima, the atoms would be one spatial minimum apart. Then what? They cannot meet in the middle of the remaining distance, by the very concept of a minimum. Nor can one cross the interval before the other, without violating the rule of equal velocity. But how, then, can they meet at all? We do not know an Epicurean reply to this conundrum. Perhaps atoms are always an even number of minimal spaces apart from one another. Or else, minima are always bundled in such large quantities that it is meaningless to speak of an odd or even number of minima between atoms; the Stoics, at all events, held that whether the number of stars, for example, is odd or even is absolutely or naturally non-evident (*kathapax adela*, Sextus Empiricus *Outline of Pyrrhonism* = *PH* 2.97, *M* 8.147; *physei adela*, *M* 8.317–18). But Epicurus believed that motion at the atomic level obeyed different laws from those that appear to operate at the level of macroscopic objects (that atomic motion is discontinuous is an example). Perhaps, then, motions over small numbers of minima were in some sense indiscernible. Finally, it is possible that he discounted such a puzzle as a purely mathematical paradox, since it is recorded that he had little interest in mathematics as a separate science from physics and believed it to be irrelevant to the proper study of physics.
    step1: |-
      伊壁鸠鲁所运用的自然基本原理数目极为有限——例如，他不知道力的概念，也不知道与之相关的原子间吸引与排斥的观念，更不用说更玄奥的属性——尽管他竭力依据这一理论说明世界的一切物理特征，悖论仍然存在。塞克斯都·恩披里柯（《驳物理学家》＝*M* 10.144–48）提出了一个极好的例子，同时也让人了解伊壁鸠鲁的原子被理解为如何活动（至少在塞克斯都的时代，即公元 2 世纪晚期）。塞克斯都设想两个原子相隔九个最小量的距离，以相同速度（原子必然如此）相向而行；经过四个时间最小量后，两原子相距一个空间最小量。然后呢？按最小量的概念本身，它们不可能在剩余距离的中点相遇。若没有违反等速规则，其中一个也不可能先于另一个越过这段间隔。可是这样一来，它们究竟如何相遇？我们不知道伊壁鸠鲁派对此难题的答复。也许原子彼此之间总是相隔偶数个最小空间。或者，最小量总是以极大的数量成束出现，以至于谈论原子之间最小量数目是奇是偶毫无意义；无论如何，斯多葛派认为，例如星辰的数目是奇是偶，绝对地或自然地不可明见（*kathapax adela*，塞克斯都·恩披里柯《皮浪主义纲要》＝*PH* 2.97，*M* 8.147；*physei adela*，*M* 8.317–18）。但伊壁鸠鲁相信，原子层面的运动遵循与宏观物体层面似乎起作用的规律不同的规律（原子运动不连续即为一例）。那么，也许在少数几个最小量上的运动在某种意义上不可分辨。最后，也有可能他视这类谜题为纯数学悖论而不予重视，因为记载表明他对作为独立于物理学的数学兴趣不大，并认为数学与正当的物理研究无关。
    step2: |-
      伊壁鸠鲁手里的自然基本原理少得可怜。他不知道力的概念，也没有原子间相互吸引、相互排斥这类配套观念，更玄奥的属性更谈不上。他以这套理论去说明世上一切物理特征，用力虽勤，悖论依然留存。塞克斯都·恩披里柯（《驳物理学家》＝*M* 10.144–48）拈出的一个例子极妙，同时也让人看到伊壁鸠鲁的原子被设想成怎样活动（至少塞克斯都所见的公元 2 世纪晚期是如此）。他设想两个原子相距九个最小量，以同一速度迎面而行（原子必得如此）；过了四个时间最小量，两原子之间只剩一个空间最小量。接下来呢？按最小量的定义，它们不能在余下距离的正中相遇；不违反等速规则，谁也不抢先越过这一格。然则它们究竟如何相遇？伊壁鸠鲁派的答复，今已不传。也许原子之间永远隔着偶数个最小空间。也许最小量总是成捆成束，数目大到“奇偶”二字无从谈起；斯多葛派便有类似之论：星辰的数目是奇是偶，绝对地或本性地不可明见（*kathapax adela*，见塞克斯都·恩披里柯《皮浪主义纲要》＝*PH* 2.97、*M* 8.147；*physei adela*，*M* 8.317–18）。但伊壁鸠鲁相信，原子层面的运动自有规律，与宏观物体层面显见的规律不同（原子运动不连续即是一例）。那么，在几个最小量上完成的运动，也许在某种意义上不可分辨。最后还有一种可能：他把这种谜题当作纯数学悖论，搁置不问。史载他对独立于物理学的数学兴趣寡淡，且认为数学于正当的物理研究无所助益。
