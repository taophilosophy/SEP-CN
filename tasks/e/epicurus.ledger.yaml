    source: |-
      The major source for Epicurean doctrine is Diogenes Laertius’ third-century C.E. *Lives of Eminent Philosophers*, a compilation of information on the lives and doctrines of the philosophers of classical Greece (see “Doxography of Ancient Philosophy”). In the tenth and final book, devoted to Epicureanism, Diogenes preserves three of Epicurus’ letters to his disciples, in which he presents his basic views in a concise and handy form. The *Letter to Herodotus* summarizes Epicurus’ physical theory, the *Letter to Menoeceus* offers a précis of Epicurean ethics, and the *Letter to Pythocles* treats astronomical and meteorological matters. (There is some doubt about whether the last is by Epicurus himself or a follower, but there seems to be sufficient reason to attribute it to the founder himself.) Diogenes also quotes a collection of brief sayings, called the “Principal Beliefs” or “Principal Doctrines” (*Kuriai Doxai*), excerpted from the writings of Epicurus or, in some cases, of his close associates; another such collection, partially overlapping with the first, survives in an independent manuscript and is conventionally called the Vatican Sayings. The purpose of both sets, like that of the Letters, was to make the core doctrines easy to remember. Diogenes also fills in topics not covered in the Letters, and provides a list of Epicurus’ writings and other biographical information (for the text, see Dorandi 2013; for an English translation, Mensch 2018)[^dorandi-2013][^mensch-2018].
    step1: |-
      伊壁鸠鲁派学说的主要来源，是第欧根尼·拉尔修公元 3 世纪的《名哲言行录》，该书汇编了古典希腊哲学家的生平与学说资料（参“古代哲学的学说汇编”词条）。在专论伊壁鸠鲁主义的第十卷即末卷中，第欧根尼保存了伊壁鸠鲁写给门徒的三封信，信中他以简洁便用的形式陈述了自己的基本观点。《致希罗多德书》概述伊壁鸠鲁的物理理论，《致美诺寇书》提纲领述伊壁鸠鲁伦理学，《致皮托克勒斯书》讨论天文与气象问题。（末一封信究竟出自伊壁鸠鲁本人还是某位追随者，尚有疑问，但似乎有充分理由把它归于这位创始人。）第欧根尼还引录了一部简短格言集，题为“主要学说”（*Kuriai Doxai*），摘自伊壁鸠鲁本人的著作，某些条目则出自其亲密同道；另有一部部分重合的同类格言集存于一份独立抄本，通常称为《梵蒂冈格言》。两集与三封信的用意相同：使核心学说易于记诵。第欧根尼还补述了信中未及的话题，并列出伊壁鸠鲁的著作目录及其他生平信息（原文见 Dorandi 2013；英译见 Mensch 2018）[^dorandi-2013][^mensch-2018]。
    step2: |-
      伊壁鸠鲁派学说的头号来源，是第欧根尼·拉尔修所著《名哲言行录》（公元 3 世纪）。此书汇集古典希腊哲人的生平与学说资料（参“古代哲学的学说汇编”词条）。第十卷即末卷专论伊壁鸠鲁主义，其中保存了伊壁鸠鲁致门徒的三封信，基本观点以简洁便用的形式陈于信中。《致希罗多德书》撮述物理理论；《致美诺寇书》以提纲形式概述伦理学；《致皮托克勒斯书》处理天文与气象。末一封是否出自伊壁鸠鲁本人，学界尚有疑问；不过把它归给创始人，理由似乎充分。第欧根尼另外引录了一部短格言集，称“主要学说”（*Kuriai Doxai*）。这些格言摘自伊壁鸠鲁本人的文字，有些则出自其亲近同道之手。另有一部同类格言集，与前者部分重合，靠一份独立抄本流传下来，通称《梵蒂冈格言》。两集与三封信用意一致：让核心学说便于记诵。信中未及的话题，第欧根尼也作了补述；他还开列伊壁鸠鲁的著作目录，并留下其他生平材料（原文见 Dorandi 2013，英译见 Mensch 2018）[^dorandi-2013][^mensch-2018]。
  - id: 4
    kind: body
    source: |-
      Short citations of Epicurus’ works appear in other writers (e.g., Plutarch, Sextus Empiricus, and the Greek commentators on Aristotle), often taken out of context or presented in a polemical and distorted fashion. (The standard edition of Epicurus’ works in Greek is Arrighetti 1973; the fullest collection of fragments and testimonies is still Usener 1887, repr. with Italian translation, Ramelli 2002; for translations, see Bibliography: Editions, Translations, Commentaries)[^arrighetti-1973][^usener-1887]. In addition, several works of Epicurus, including parts of his major treatise, *On Nature* (*Peri phuseôs*) — a series of lectures running to 37 papyrus rolls — have been recovered in damaged condition from the library of a villa in the town of Herculaneum, which was buried in the eruption of Mt. Vesuvius in 79 C.E. The library almost certainly contained the working collection of Philodemus, an Epicurean philosopher from Syria who studied in Athens and moved to Italy in the first century B.C.E. Many of the rolls consist of Philodemus’ own writings, and provide valuable information about later issues in the history of Epicureanism. One must be cautious about ascribing these views to the founder himself, although the school tended to be conservative and later thinkers embellished rather than altered Epicurus’ own teachings. New editions and translations are now making these difficult texts available to a wider readership.
    step1: |-
      伊壁鸠鲁著作的简短引文见于其他作家（如普鲁塔克、塞克斯都·恩披里柯，以及亚里士多德的希腊注疏家），往往脱离语境，或以论辩、扭曲的方式呈现。（伊壁鸠鲁著作希腊文的标准版本是 Arrighetti 1973；最全的残篇与证言汇编仍是 Usener 1887，附意大利文译文的翻印本为 Ramelli 2002；译本见“参考文献：校勘本、译本与注疏”。）[^arrighetti-1973][^usener-1887] 此外，伊壁鸠鲁的若干著作——包括其重要论著《论自然》（*Peri phuseôs*）的部分内容，那是一套多达 37 卷纸草的系列讲稿——已从赫库兰尼姆城一座别墅的藏书室中以残损状态复原；该城在公元 79 年维苏威火山爆发时被掩埋。这处藏书室几乎肯定收藏着菲洛德穆的工作藏书；菲洛德穆是来自叙利亚的伊壁鸠鲁派哲学家，曾在雅典学习，公元前 1 世纪迁往意大利。许多纸草卷是菲洛德穆本人的著作，为伊壁鸠鲁主义后来的问题提供了宝贵信息。把这些观点归于创始人本人时必须谨慎，尽管该学派趋于保守，后世思想家多是增饰而非改动伊壁鸠鲁本人的教导。新的校勘本与译本正使这些艰深文本可供更广的读者使用。
    step2: |-
      其他作家（普鲁塔克、塞克斯都·恩披里柯、亚里士多德的希腊注疏家等）也引用伊壁鸠鲁的短句，但多脱离语境，或经论辩性的扭曲。（希腊文标准本为 Arrighetti 1973；残篇与证言收录最全者仍推 Usener 1887，附意大利文译文的翻印本为 Ramelli 2002；译本见“参考文献：校勘本、译本与注疏”。）[^arrighetti-1973][^usener-1887] 还有一批伊壁鸠鲁的著作是从纸草中复原的，包括其重要论著《论自然》（*Peri phuseôs*）的部分内容。那是系列讲稿，原多达 37 卷。出土地点是赫库兰尼姆一座别墅的藏书室；该城于公元 79 年维苏威火山爆发时被埋。藏书室几乎可以肯定就是菲洛德穆的实用藏书。菲洛德穆是叙利亚人，伊壁鸠鲁派哲学家，曾求学于雅典，公元前 1 世纪移居意大利。卷子中不少是菲洛德穆自己的著作，为伊壁鸠鲁主义此后的发展提供了珍贵信息。把这些观点径直归到创始人名下，须格外谨慎：该学派虽偏于保守，后人却多是增饰师说，而非另起炉灶。如今新校勘本与新译本迭出，这些难读的文本正走向更多读者。
