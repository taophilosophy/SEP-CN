      As for bodies (note the plural: Epicurus does not typically speak of matter per se) and void as the basic physical principles, the senses, Epicurus affirms, testify to the existence of bodies, and by calculation on the basis of the senses we infer the nature of what is invisible, for example the atoms (*LH* 39). Here the reasoning is based on analogy: what is evident to our senses must be true on the microscopic level as well, at least in some respects. Void must exist, in turn, if bodies are to be able to move, as they are seen to do. Thus motion is the counterwitness to the non-existence of void — an indirect argument is required since one cannot perceive empty space. What is more, since bodies, being “full,” offer resistance and void, being empty, offers no resistance, they complement each other and exhaust the possibilities; hence it is impossible to conceive of anything besides these two principles, apart from things that are accidents of them — accidents that arise from unions of elementary bodies in the void. (Inconceivability is another tool in Epicurus’ method of demonstration.) These elementary bodies, then, are the atoms, which are indivisible and inalterable, if things are not to dissolve into nothingness. The *Letter to Herodotus* is an epitome of Epicurean doctrine, and the arguments are crisp and abbreviated, but the reasoning is clear, and is confirmed by the more detailed treatment in Lucretius, which almost certainly follows Epicurus’ *On Nature* (see Leone 2012)[^leone-2012]. Epicurus appeals to some elementary intuitions concerning bodies and their movement through space in order to establish the structure of imperceptibly small things; he concludes that these must be inalterable if nature is not to dissolve into nothing (creation back out of nothing having already been eliminated by the argument cited above from regularity in generation); and the basic features of the atomic system are then in place. A similar appeal to the senses establishes the infinity of the universe, since what is finite must have an edge, and an edge is conceived in reference to something beyond it. But the universe — in Greek, the “all” — contains everything, and so there is nothing outside it by which to conceive an edge. Hence, it is infinite. And if the all is infinite, so is the void and the number of atoms as well, for otherwise atoms would be too widely dispersed ever to meet (*LH* 41–42).
    step1: |-
      至于物体（注意是复数：伊壁鸠鲁通常不谈物质本身）与虚空作为基本物理原理，伊壁鸠鲁断言，感觉为物体的存在作证；我们又在感觉的基础上通过计算，推断不可见之物的本性，例如原子（*LH* 39）。这里的推理依据类比：对我们感官显明的东西，在微观层面也必定为真，至少在某些方面如此。反过来说，物体若要能像人们见到的那样运动，虚空就必须存在。于是运动成了虚空不存在的反证——由于人无法感知空处，这里需要一种间接论证。再者，物体既“充实”，便有阻抗；虚空既空，便无阻抗；二者互补，穷尽了可能性；因此，除这两条原理之外，不可能设想别的基本原理，除非是它们的偶性——由虚空中的基本物体结合而产生的偶性。（不可设想性是伊壁鸠鲁论证方法中的又一工具。）这些基本物体就是原子；若事物不要消解为无，原子就必须不可分、不可改变。《致希罗多德书》是伊壁鸠鲁学说的提要，论证简洁而压缩，但推理清楚，并得到卢克莱修更详尽论述的印证；后者几乎肯定依据伊壁鸠鲁的《论自然》（见 Leone 2012）[^leone-2012]。伊壁鸠鲁诉诸若干关于物体及其在空间中运动的朴素直觉，以确立不可感知的微小之物的结构；他得出结论：若自然不要消解为无，这些微小之物就必须不可改变（而从无中重新产生，已由上引依据生殖之规律性的论证排除）；原子体系的基本特征于是确立。类似的诉诸感觉确立了宇宙的无限性：凡有限者必有边缘，而边缘总是相对于其外之物来设想的。但宇宙——希腊语叫“万有”——包含一切，因而在它之外没有任何东西可用来设想边缘。所以它是无限的。若万有无限，则虚空与原子数目也无限；否则原子将过于分散，永远无法相遇（*LH* 41–42）。
    step2: |-
      基本物理原理有二：物体与虚空。这里说“物体”用的是复数，因为伊壁鸠鲁一般不讲物质本身。物体存在，他说，自有感觉作证；至于不可见者（原子即其一）的本性，则由感觉出发、凭计算推知（*LH* 39）。推理靠的是类比：凡感官所显明者，在微观层面也当为真，至少在若干方面为真。虚空则非得有不可，否则物体无从运动；而物体运动，是眼见的事实。于是运动成了“虚空不存在”的反证。此处须绕个弯：空处本不可感知，只能间接取证。再说，物体“充实”，故有阻抗；虚空空无一物，故无阻抗。二者互补，把可能性占尽。于是这两条原理之外，除了它们的偶性——虚空中的基本物体结合而生者——再无可设想的基本原理。（不可设想性，又是伊壁鸠鲁论证的一件利器。）所谓基本物体，就是原子。事物若不要散归为无，原子便须不可分、不可改。《致希罗多德书》乃伊壁鸠鲁学说的缩本，论证干净利落，篇幅极简而理路分明；卢克莱修的详论可为印证，而卢克莱修几乎肯定依据伊壁鸠鲁的《论自然》（见 Leone 2012）[^leone-2012]。伊壁鸠鲁借几条关于物体及其在空间中运动的朴素直觉，立起不可感知的微小之物的结构；由此断定：自然若不要散归为无，这类微小之物便须不可改（至于“从无中生”，前引依据生殖规律性的论证已将其排除）。原子体系的要旨至此具备。宇宙无限一义，同样靠诉诸感觉而立。凡有限者必有边缘；而边缘云云，总要参照其外之物方能设想。可宇宙——希腊语称“万有”——囊括一切，其外无物，边缘便无从设想。故宇宙无限。万有既无限，虚空与原子之数亦无限；否则原子分布过疏，永无相遇之日（*LH* 41–42）。
