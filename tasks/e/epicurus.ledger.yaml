      When Epicurus spoke of friendship, he may have had at least partly in mind specifically the relationship among his followers, who seem to have thought of themselves as friends. Epicureans were encouraged to form communities and to observe certain rituals, although most of these practices, such as the celebration each month of the day (the 20ᵗʰ) on which Epicurus was born or wearing rings bearing an image of Epicurus, may have originated after the founder’s death. The Epicureans paid attention to problems of pedagogy as well, laying out the best way to correct the ideas of people new to the school and its community without cajoling or discouraging them. It must be remembered that Epicurus understood the task of philosophy first and foremost as a form of therapy for life, since philosophy that does not heal the soul is no better than medicine that cannot cure the body (Usener 1887, frag. 221)[^usener-1887]. A life free of mental anxiety and open to the enjoyment of other pleasures was deemed equal to that of the gods. Indeed, it is from the gods themselves, via the simulacra that reach us from their abode, that we derive our image of blessed happiness, and prayer for the Epicureans consisted not in petitioning favors but rather in a receptivity to this vision. (Epicurus encouraged the practice of the conventional cults.) Although they held the gods to be immortal and indestructible (how this might work in a materialist universe remains unclear), human pleasure might nevertheless equal divine, since pleasure, Epicurus maintained (*KD* 19), is not augmented by duration (compare the idea of perfect health, which is not more perfect for lasting longer); the catastematic pleasure experienced by a human being completely free of mental distress and with no bodily pain to disturb him or her is at the absolute top of the scale. Nor is such pleasure difficult to achieve: it is a mark precisely of those desires that are neither natural nor necessary that they are hard to satisfy. Epicurus was famously content with little, since on such a diet a small delicacy is as good as a feast, in addition to which it is easier to achieve self-sufficiency, and “the greatest benefit of self-sufficiency is freedom” (VS 77).
    step1: |-
      伊壁鸠鲁谈友爱时，至少部分地想到的是他的追随者之间的关系，这些人似乎把自己看作朋友。伊壁鸠鲁派被鼓励组成共同体并遵守某些仪式，尽管这些做法中的大多数——例如每月庆祝伊壁鸠鲁的生日（20 日）、佩戴刻有伊壁鸠鲁像的戒指——可能始于创始人去世之后。伊壁鸠鲁派也关注教育学问题，详细说明如何纠正初入学派及其共同体者的观念，而不谄媚也不气馁。必须记住，伊壁鸠鲁首先把哲学的任务理解为对人生的一种治疗，因为不能治愈灵魂的哲学，不比不能医治身体的医学更好（Usener 1887, frag. 221）[^usener-1887]。一种心灵无扰、并向其他快乐敞开的生活，被认为与神的生活相等。事实上，我们关于幸福至福的表象正来自神本身，经由从神的居所到达我们的影像；对伊壁鸠鲁派来说，祈祷不在于请求恩惠，而在于对这一景象的接受。（伊壁鸠鲁鼓励按惯例奉祀。）虽然他们认为神是不朽且不可毁灭的（这在唯物主义宇宙中如何可能，仍不清楚），人的快乐仍可与神的快乐相等，因为快乐（伊壁鸠鲁在 *KD* 19 主张）不因持续时间而增加（好比完美的健康，并不因持续更久而更完美）；一个完全摆脱心灵痛苦、又没有身体之痛来打扰的人所经验的静态快乐，处在尺度的绝对顶端。这种快乐也并非难以达成：恰恰那些既不自然又不必要的欲望，才难以满足。伊壁鸠鲁以知足寡欲著名：如此饮食，一点美味便等同盛宴；何况这样更容易做到自足，而“自足最大的好处是自由”（*VS* 77）。
    step2: |-
      伊壁鸠鲁讲友爱，心里至少有一部分想的是自家门人之间的关系——这些人似乎就以朋友自居。伊壁鸠鲁派被鼓励结成共同体，奉行若干仪式。不过多数做法或许是创始人去世后才有的，例如每月二十日庆祝伊壁鸠鲁诞辰，或佩戴刻有其像的戒指。学派也留心教法，细究怎样纠正新入门者的观念，既不哄骗，也不使人气馁。要记住一点：在伊壁鸠鲁看来，哲学首要的任务是治疗人生。治不了灵魂的哲学，比医不好身体的医术好不了多少（Usener 1887, frag. 221）[^usener-1887]。心灵无扰、又向种种快乐敞开的生活，被认为与神的生活齐平。我们对至福的表象，其实正来自神本身——凭的是从神居所飘到我们这里的影像。所以对伊壁鸠鲁派而言，祈祷不是求恩，而是敞开心神、领受这幅景象。（伊壁鸠鲁鼓励依惯例奉行祭祀。）他们主张神不朽、不可毁；这在一元唯物的宇宙里何以可能，至今不明。但人的快乐不妨与神的快乐相等。按伊壁鸠鲁的说法（*KD* 19），快乐不因时间长而增多——正如完美的健康，持续更久并不就更完美。一个人若心中毫无烦扰、身上又无痛可扰，他所体验的静态快乐便立于尺度的最高处。这样的快乐也不算难得到手：难满足的，恰恰是那些既不自然、又不必要的欲望。伊壁鸠鲁素以知足闻名：粗茶淡饭之间，一点小美味便抵得上一场盛宴；况且如此生活更易自足，而“自足最大的好处，就是自由”（*VS* 77）。
