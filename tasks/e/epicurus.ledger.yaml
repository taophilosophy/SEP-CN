      Having established the physical basis of the world, Epicurus proceeds to explain the nature of the soul (this, at least, is the order in which Lucretius sets things out). This too, of course, consists of atoms: first, there is nothing that is not made up of atoms and void (secondary qualities are simply accidents of the arrangement of atoms), and second, an incorporeal entity could neither act on nor be moved by bodies, as the soul is seen to do (e.g., it is conscious of what happens to the body, and it initiates physical movement). Epicurus maintains that soul atoms are particularly fine and are distributed throughout the body (*LH* 64), and it is by means of them that we have sensations (*aisthêseis*) and the experience of pain and pleasure, which Epicurus calls *pathê* (a term used by Aristotle and others to signify emotions instead). Body without soul atoms is unconscious and inert, and when the atoms of the body are disarranged so that it can no longer support conscious life, the soul atoms are scattered and no longer retain the capacity for sensation (*LH* 65). There is also a part of the human soul that is concentrated in the chest, and is the seat of the higher intellectual functions. The distinction is important, because it is in the rational part that error of judgment enters in. Sensation, like pain and pleasure, is incorrigible just because it is a function of the non-rational part, which does not modify a perception — that is, the reception of lamina emitted from macroscopic bodies — by the addition of opinion or belief.
    step1: |-
      确立了世界的物理基础之后，伊壁鸠鲁接着解释灵魂的本性（至少卢克莱修的陈述顺序如此）。灵魂当然也由原子构成。第一，凡物无不由原子与虚空构成（次级性质不过是原子排列的偶性）。第二，无形体的实体既不能作用于物体，也不能被物体推动，而灵魂显然能如此（例如，它意识到身体发生的事情，并引发身体运动）。伊壁鸠鲁主张，灵魂原子格外精细，分布全身（*LH* 64）；正是借助它们，我们才有感觉（*aisthêseis*），才有痛苦与快乐的体验——伊壁鸠鲁称之为 *pathê*（亚里士多德等人则用该词指情感）。没有灵魂原子的身体无意识、无生机；当身体原子被打乱，以致不再能支撑有意识的生命时，灵魂原子便四散，不再保有感觉能力（*LH* 65）。人的灵魂还有一部分集中于胸部，是较高理智功能的所在。这一区分很重要，因为判断的错误正出在理性部分。感觉与苦乐一样不可纠正，原因恰恰在于它是非理性部分的功能；非理性部分不会借意见或信念的附加而改变一次感知——即对宏观物体发出的薄膜的接收。
    step2: |-
      世界的物理底子既已立定，伊壁鸠鲁转而论灵魂（卢克莱修大体也按这个次序铺陈）。灵魂同样是原子。理由有两条。其一，凡存在者不是原子加虚空，就是原子的排列方式；次级性质不过后者而已。其二，无形体之物既不能施作用于物体，也不能受物体推动，而灵魂分明两样都做：它知道身体出了什么事，又能发起身体运动。伊壁鸠鲁主张，灵魂原子极其精细，散布全身（*LH* 64）；靠了它们，我们才有感觉（*aisthêseis*），才有苦乐之感——他称之为 *pathê*（亚里士多德等人倒拿这个词指情感）。身体若没了灵魂原子，便无意识，也不能动。身体原子一旦错乱到无法再维持意识生活，灵魂原子就四散而去，感觉之力随之丧失（*LH* 65）。灵魂另有一部分聚在胸口，是高级理智活动的大本营。这个区分不可小觑：判断上的错，正是从理性部分进来的。感觉则不可纠正，苦乐亦然。原因很简单：它们属于非理性部分。这个部分不会拿意见或信念去给感知加料——所谓感知，就是接收宏观物体射来的薄膜。
