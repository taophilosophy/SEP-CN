      More or less contemporary with Philodemus is Lucretius (first century B.C.E.), who composed in Latin *De rerum natura* (“On the Nature of Things”; the title, if it is Lucretius’ own, is an adaptation of “On Nature”) in six books of hexameter verse, the meter characteristic of epic and didactic poetry. As a dedicated Epicurean, passionate to promulgate the message of the founder, Lucretius reproduced Epicurean doctrine faithfully (Sedley 1998; Clay 1983 allows Lucretius more originality)[^clay-1983][^sedley-1998][^clay-1983-2]. His poem concentrates principally on the physical and psychological or epistemological aspects of Epicureanism, and to a great extent omits the ethical. From a hostile point of view, Cicero rehearsed and criticized Epicurus’ ideas, especially concerning ethics, in several of his philosophical works, including *On Moral Ends* (*De finibus*) and the *Tusculan Disputations*. Still later, in the second century C.E., another Diogenes erected a large inscription, to this day only partially excavated, in the city of Oenoanda (in southwestern Turkey), which contained the basic tenets of Epicureanism (authoritative edition by Smith 1993, but new fragments have been published subsequently; see also Gordon 1996, Hammerstaedt et alii, 2017)[^smith-1993][^gordon-1996].
    step1: |-
      与菲洛德穆大致同时的是卢克莱修（公元前 1 世纪）。他以拉丁文撰成《物性论》（*De rerum natura*；“论事物的本性”；这个标题若出自卢克莱修本人，则是对“论自然”的改写），共六卷，用六音步诗体——史诗与教诲诗的特征格律。作为热忱传播创始人讯息的虔诚伊壁鸠鲁派，卢克莱修忠实地复述了伊壁鸠鲁派学说（Sedley 1998；Clay 1983 认为卢克莱修更具独创性）[^clay-1983][^sedley-1998][^clay-1983-2]。他的长诗主要集中于伊壁鸠鲁主义的物理方面以及心理或认识论方面，很大程度上略去了伦理部分。西塞罗则从敌对立场的角度，在《论至善与至恶》（*De finibus*）与《图斯库鲁姆论辩集》等几部哲学著作中复述并批评了伊壁鸠鲁的观念，尤其涉及伦理学。再晚些，公元 2 世纪，另一位第欧根尼在俄诺安达城（位于今土耳其西南部）立起一块巨大的铭文——至今只部分发掘——上面载有伊壁鸠鲁主义的基本教义（权威版本为 Smith 1993，但此后又有新残篇刊布；另见 Gordon 1996，Hammerstaedt 等 2017）[^smith-1993][^gordon-1996]。
    step2: |-
      卢克莱修（公元前 1 世纪）与菲洛德穆大致同时。他用拉丁文写了《物性论》（*De rerum natura*，即“论事物的本性”），六卷，六音步诗体——史诗与教诲诗的典型格律。这个题目若为卢克莱修自拟，应是从“论自然”翻改而来。他是虔诚的伊壁鸠鲁派，热切传扬创始人的讯息，对师说复述得忠实不二（Sedley 1998；Clay 1983 则给卢克莱修留出更多独创空间）[^clay-1983][^sedley-1998][^clay-1983-2]。长诗的重心在伊壁鸠鲁主义的物理层面，以及心理与认识论层面；伦理部分大多略过。西塞罗的态度则是敌对的。他在《论至善与至恶》（*De finibus*）、《图斯库鲁姆论辩集》等几部哲学著作中复述并批评伊壁鸠鲁的观念，伦理问题谈得尤多。再往后，公元 2 世纪，又有一位第欧根尼在俄诺安达城（今土耳其西南）立起一块大铭文，至今仅部分发掘，其上刻着伊壁鸠鲁主义的基本教义（权威版本见 Smith 1993；此后又有新残篇刊布，另见 Gordon 1996、Hammerstaedt 等 2017）[^smith-1993][^gordon-1996]。
