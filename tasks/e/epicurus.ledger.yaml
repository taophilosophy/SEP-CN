      “伊壁鸠鲁是尼奥克勒斯与凯瑞斯特拉塔之子，雅典人，属伽格图斯乡，出自菲莱德斯家族，如梅特罗多鲁斯在《论高贵家族》中所说。赫拉克利德等人在其索提翁节本中说，他在萨摩斯长大，因为雅典人曾在那里分得土地；十八岁时来到雅典，当时色诺克拉底主持学园，亚里士多德仍在卡尔基斯”（亚里士多德于公元前 322 年卒于该地）。第欧根尼·拉尔修（10.1）的记述就这样开头。于是，伊壁鸠鲁出生与初次赴雅典的年份分别为公元前 341 年与公元前 323 年。第欧根尼补充说，亚历山大死后（公元前 323 年），雅典人被逐出萨摩斯，伊壁鸠鲁便离开雅典，前往科洛丰（公元前 321 年）与父亲会合；科洛丰位于今土耳其海岸。他在那里师从瑙西芬尼研习哲学。瑙西芬尼是带有怀疑论倾向的德谟克利特派哲学家，著有《三脚架》一书，据说伊壁鸠鲁写其主要认识论著作《规范》时曾取材于此；在伦理学上，瑙西芬尼用 *akataplêxia*（“无畏”）一词取代德谟克利特的 *athambiê*（“不怕”），作为良善生活的关键，这让人想到伊壁鸠鲁的 *ataraxia* 即“心神宁静”，不过据说伊壁鸠鲁否认受过他的影响（论瑙西芬尼在向伊壁鸠鲁传递德谟克利特学说要素方面的作用，见 Warren 2002: 160–92）。
    step2: |-
      第欧根尼·拉尔修（10.1）的记述开头是一段引文：“伊壁鸠鲁乃尼奥克勒斯与凯瑞斯特拉塔之子，雅典人，属伽格图斯乡，出自菲莱德斯家族——此说见梅特罗多鲁斯《论高贵家族》。赫拉克利德等人所编索提翁节本则说：他在萨摩斯长大，因雅典人曾在该岛分得土地；十八岁赴雅典，时值色诺克拉底主持学园，亚里士多德尚在卡尔基斯”（亚里士多德于公元前 322 年卒于该地）。据此，伊壁鸠鲁生于公元前 341 年，初次赴雅典在公元前 323 年。第欧根尼接着说：亚历山大死后（前 323），雅典人被逐出萨摩斯，伊壁鸠鲁遂离雅典，于公元前 321 年前往今土耳其海岸的科洛丰投奔父亲。他在那里从瑙西芬尼学哲学。瑙西芬尼属德谟克利特一派，带怀疑论色彩，著有《三脚架》；据说伊壁鸠鲁撰写其主要认识论著作《规范》时取资于此。伦理学方面，瑙西芬尼用 *akataplêxia*（“无所畏惧”）代替德谟克利特的 *athambiê*（“不怕”），视之为良善生活的关键；这自然令人想到伊壁鸠鲁的 *ataraxia*（“心神宁静”）。不过据说伊壁鸠鲁否认受过他的影响。（瑙西芬尼如何把德谟克利特学说的要素传给伊壁鸠鲁，参 Warren 2002: 160–92。）
