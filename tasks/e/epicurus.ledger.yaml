      Fascinating as these questions are in their own right, Epicurus himself does not proceed by creating an abstract model, exploring its internal coherence, and determining its applicability to phenomena, in the ideal manner of modern science. Rather, he begins with the testimony of the senses, which he thinks are always reliable. These provide a basis on which to draw conclusions either with respect to things that still await confirmation or those that are by nature imperceptible (*Letter to Herodotus* = *LH* 38). Thus, in beginning his account of the physical world in this Letter, he argues that things cannot arise out of nothing, since otherwise there would be no need of specific seeds for specific plants and animals, and anything whatsoever could be generated out of just any types of material elements. Since this is not seen to happen, but reproduction in things we can observe with our senses is in fact orderly and determinate, spontaneous generation at any level is ruled out. The logic is what Epicurus calls counterwitnessing: a hypothetical premise (here, that things sometimes arise out of nothing) is eliminated because experience tells against its conclusion (here, that the coming into being of visible objects does not require determinate seeds or materials). More simply, if *A* then *B*; but not *B*, hence not *A*. One might, of course, challenge the implication: something might arise from nothing, even if there are no cases of chickens giving birth to horses. The important point, however, is that Epicurus invokes the data of perception to testify for or against the nature of elementary phenomena; he assumes a certain uniformity of nature at all levels. So too with his next postulate: things are not destroyed into what is not, since in that case everything would cease to exist (and would have ceased to exist before now, given infinite past time — recall that nothing is created out of nothing); but things do exist, hence the premise is false.
    step1: |-
      这些问题本身固然引人入胜，但伊壁鸠鲁本人并不按现代科学的理想方式行事：先造一个抽象模型，探究其内部一致性，再判定它是否适用于现象。他毋宁从感觉的证言出发，认为感觉总是可靠的。感觉提供了一个基础，据此可对尚待确认之物、或本性上不可感知之物作出结论（《致希罗多德书》＝*LH* 38）。于是，在这封信里开始叙述物理世界时，他论证说，事物不可能从无中产生；否则特定的植物与动物就不需要特定的种子，任何东西都可以由随便哪类物质元素生成。既然从未见到这种事发生，而我们凭感官可观察到的事物之生殖实际上又有秩序、有定准，那么任何层面上的自然发生都被排除。这一逻辑就是伊壁鸠鲁所称的反证：一个假设性前提（此处是“事物有时从无中产生”）被排除，是因为经验否证了它的结论（此处是“可见物体的生成不需要特定的种子或质料”）。说得更简单：若 *A* 则 *B*；但非 *B*，故非 *A*。当然，有人可以质疑这个蕴涵：即使从未有母鸡生马之事，某物仍可能从无中产生。要紧的一点却是：伊壁鸠鲁援引感知材料，为基本现象的本性作证或反证；他假定自然在各层面具有某种齐一性。他的下一个公设也是如此：事物不会毁灭为“无”；因为若如此，万物早就停止存在了（而且鉴于过去时间无限，早就该停止了——记得无物能从无中产生）；但万物确实存在，所以该前提为假。
    step2: |-
      这些问题自有其魅力，但伊壁鸠鲁的做法并不合现代科学的理想套路——先立抽象模型，再测其内部是否自洽，最后看它能否套上现象。他从感觉的证言起步，认定感觉永远可靠。有感觉作底，便可对两类事情下判断：一类尚待证实，一类本性上不可感知（《致希罗多德书》＝*LH* 38）。这封信开篇讲物理世界，他先论证事物不可能生于无。理由：若万物可从无中生出，特定的草木鸟兽就用不着特定的种子，随便什么质料都能长出随便什么东西。可事实并非如此；凭感官可见的生殖，分明有秩序、有定准。于是，任何层面的自然发生都站不住。这套逻辑，伊壁鸠鲁称为反证：先设一个前提（此处是“事物有时生于无”），再由经验否掉它的结论（此处是“可见之物生成无需特定种子或质料”），前提遂被排除。说白些：若 *A* 则 *B*；今非 *B*，故非 *A*。当然，蕴涵本身也可能受质疑：纵然从未见过鸡生马，谁又担保一定没有“生于无”的事？要紧的是另一层：伊壁鸠鲁拿感知材料来为基本现象的本性作证或反证，他预设自然在各层面齐一。下一条公设同样如此。事物不会毁归为“无”。若毁归为无，万物早该不存在了——过去时间无限，无物能生于无，万物岂能撑到今天？可万物分明还在，前提自假。
