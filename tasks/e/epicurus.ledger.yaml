      But an infinite number of solid and therefore indivisible atoms of finitely many kinds, such as Epicurus’ theory provides, are enough to avoid the possibility of the universe crumbling into nothing. Why did Epicurus complicate matters still further with the doctrine that atoms themselves consist of still smaller parts in the form of mathematically minimal expanses, as we saw above that he does? Finite bodies, according to Epicurus, had to be composed of smaller expanses, and if there were no lower limit in size to such expanses, one would have to imagine traversing such a body in an infinite number of moves — but then, however small these infinitesimals might be, the object that contained them, Epicurus reasoned, would have to be infinitely large (*LH* 56–57). What are such minima like? Epicurus asks us to think of the smallest perceptible thing. It differs from larger visible entities in that it has no sub-parts to be traversed with the eye: if you do attempt to visualize such sub-parts, they simply coincide with the original perceptible minimum. Since such minimal visible entities have no parts, they do not touch edge to edge (edges are parts), and yet they measure out the body that contains them, larger bodies having more such minima. By analogy with the visible, then, we conceive of the smallest part of an atom (*LH* 58–59). This conception resembles the way points exist in a line, according to Aristotle, since they too do not touch, nor can they exist independently. But Epicurean minima differ from points in that they are physical expanses and so have extension. This looks like a contradictory state of affairs: can we imagine, for example, an atom consisting of just two minima? Or ten? It would be like counting up the least visible bits of a perceptible object. Geometrical problems arise as well, since it was known that the side and diagonal of a cube, for example, were incommensurable, yet both must, it would appear, be composed of finite and hence commensurable numbers of minima. On the assumption that Epicurus was aware of and cared about such puzzles, it has been suggested that he thought any atom consists of a not strictly infinite, but inconceivably large — and so “not strictly finite” — number of minima (see Konstan 1989a)[^konstan-1989a]: thus, the minimum may be imagined as the inverse of the number of kinds of atoms postulated by Epicurus, a quantity that takes on a quasi-technical status as a special order of magnitude. But sufficient evidence for this hypothesis is lacking.
    step1: |-
      但是，有限多种类的无限数目的坚实——因而不可分——原子，如伊壁鸠鲁的理论所提供的那样，已足以避免宇宙化为乌有。伊壁鸠鲁为何还要更进一步，主张原子本身由以数学上最小广延形式存在的更小部分构成（如上文所见）？按伊壁鸠鲁，有限物体必由更小的广延构成；若这类广延在大小上没有下限，人就不得不设想以无限多次移动穿过这样一个物体——但这样一来，伊壁鸠鲁推论，无论这些无穷小多么小，容纳它们的物体都必须是无限大的（*LH* 56–57）。这样的最小量是什么样子？伊壁鸠鲁要我们想一想最小的可感知之物。它与更大的可见实体的区别在于：它没有可以用眼睛穿行的子部分；你若试图想象这样的子部分，它们只会与原来的可感最小量重合。既然这类最小可见实体没有部分，它们就不以边缘相接（边缘也是部分），然而它们量度着容纳它们的物体，较大的物体含有更多这样的最小量。于是，我们通过类比可见之物，设想原子的最小部分（*LH* 58–59）。按亚里士多德的说法，这一构想类似于点存在于直线中的方式，因为点也不相接，也不能独立存在。但伊壁鸠鲁的最小量与点不同：它们是物理广延，因而有延展。这看起来是一种矛盾的事态：比方说，我们能想象一个只由两个最小量构成的原子吗？或者十个？那就像数一个可感物体中最小可见的碎块。几何问题也随之而来：人们已知立方体的边与对角线不可通约，可二者似乎都必须由有限、因而可通约的最小量数目构成。假定伊壁鸠鲁意识到并关心这类难题，有学者提出，他认为任何原子都由并非严格无限、却大到不可设想——因而“并非严格有限”——数目的最小量构成（见 Konstan 1989a）[^konstan-1989a]：于是，最小量可以设想为伊壁鸠鲁所设原子种类数目的倒数，这个量带有准技术性的地位，属于一种特殊的数量级。但支持这一假说的充分证据尚缺。
    step2: |-
      伊壁鸠鲁的理论若只给到有限种类、无限数目的坚实而不可分的原子，已足以防住宇宙散归为无。那他何必再添一层麻烦，声称原子本身还有更小的部分，即数学上的最小广延（前文已见）？在伊壁鸠鲁看来，有限物体必由更小的广延合成；这些广延若在大小上全无下限，穿过一个物体就得走无限多步。可若真如此，伊壁鸠鲁推论，无论那些无穷小多小，容纳它们的物体都得是无限大（*LH* 56–57）。这种最小量是什么模样？他请我们设想最小的可感之物。它与较大的可见实体之别在于：它没有可用眼睛逐一遍历的子部分。你若偏要想象其子部分，那些子部分只会与原初的可感最小量重合。这类最小可见实体既无部分，便不以边缘相接（边缘也是部分）；但它们照样量度着容纳它们的物体：物体越大，所含最小量越多。据此，我们类比可见之物，设想出原子的最小部分（*LH* 58–59）。按亚里士多德的说法，这与点存在于直线中的情形类似：点亦不相接，亦不能独立自存。但伊壁鸠鲁的最小量毕竟不是点：它是物理广延，有延展。于是局面显得自相矛盾。比如，能想象一个只由两个最小量组成的原子吗？十个呢？那简直像去数一个可感物最细碎的可见部分。几何上的麻烦也冒出来。立方体的边与对角线不可通约，人尽知之；可照此说，二者似乎都该由有限、因而可通约的最小量之数构成。有学者假定伊壁鸠鲁知晓并看重这类难题，遂提出：他认为任何原子所含最小量之数并非严格无限，只是大到不可设想——故“并非严格有限”（见 Konstan 1989a）[^konstan-1989a]。照此，最小量可设想为伊壁鸠鲁所设原子种类数的倒数；这个量于是取得准技术性的身份，自成一档数量级。只是支持此说的证据尚不充分。
