      For Epicurus, there are some fears that are perfectly legitimate; so too are some desires. Epicurus offers a classification of desires into three types: some are natural, others are empty; and natural desires are of two sorts, those that are necessary and those that are merely natural (see Cooper 1999)[^cooper-1999]. Natural and necessary are those that look to happiness, physical well-being, or life itself (*LM* 127). Unnecessary but natural desires are for pleasant things like sweet odors and good-tasting food and drink (and for various pleasurable activities of sorts other than simple smelling, touching and tasting). Empty desires are those that have as their objects things designated by empty sounds, such as immortality, which cannot exist for human beings and do not correspond to any genuine need. The same holds for the desire for great wealth or for marks of fame, such as statues: they cannot provide the security that is the genuine object of the desire. Such desires, accordingly, can never be satisfied, any more than the corresponding fears — e.g., the fear of death — can ever be alleviated, since neither has a genuine referent, i.e., death as something harmful (when it is present, we do not exist) or wealth and power as salves for anxiety. Such empty fears and desires, based on what Epicurus calls *kenodoxia* or empty belief, are themselves the main source of perturbation and pain in civilized life, where more elementary dangers have been brought under control, since they are the reason why people are driven to strive for limitless wealth and power, subjecting themselves to the very dangers they imagine they are avoiding.
    step1: |-
      在伊壁鸠鲁看来，有些恐惧完全正当；有些欲望亦然。伊壁鸠鲁把欲望分为三类：有些是自然的，另一些是空洞的；自然欲望又分两种，必要的与仅仅自然的（见 Cooper 1999）[^cooper-1999]。自然且必要的欲望，着眼于幸福、身体福祉或生命本身（*LM* 127）。非必要而自然的欲望，指向宜人之物，如芬芳的气味、美味的饮食（以及除单纯嗅、触、尝之外的各种愉快活动）。空洞的欲望则以空洞声音所指称的东西为对象，例如不朽——它对人不可能存在，也不对应任何真实需要。对巨额财富或名声标志（如雕像）的欲望亦然：它们无法提供欲望真正所求的安全感。因此，这类欲望永远无法满足，正如相应的恐惧——例如对死亡的恐惧——永远无法缓解，因为二者都没有真正的指涉物：死并非有害之物（它出现时，我们已不存在），财富与权力也并非焦虑的解药。这类空洞的恐惧与欲望，基于伊壁鸠鲁所称的 *kenodoxia* 即空洞信念，本身就是文明生活中扰动与痛苦的主要来源——在文明生活中，较基本的危险已得到控制——因为正是它们驱使人追逐无限的财富与权力，使自己陷入他们自以为在躲避的危险之中。
    step2: |-
      伊壁鸠鲁并不认为恐惧一概该除，有些恐惧完全正当；欲望亦然。他把欲望分为三类。一类出于自然，一类出自空洞；出于自然者又分两等：必要者与仅属自然者（见 Cooper 1999）[^cooper-1999]。自然且必要的欲望，关乎幸福、身体安康，乃至性命本身（*LM* 127）。仅属自然而并非必要的欲望，求的是悦人之物：香气、美食美饮，以及嗅、触、尝之外的各种乐事。空洞的欲望，则以空洞声音所标示之物为对象。不朽即一例：人不可能不朽，这欲望也不对应任何真实需要。求巨富、求雕像之类名声标记，同样如此：它们给不了欲望真正想要的安全。于是，这类欲望永无餍足之日；与之相应的恐惧——如惧死——也永无消除之时。缘由相同：二者都没有真正的所指。死并非祸害——死临之时，人已不在；财富与权力亦非解忧之药。这类空洞的恐惧与欲望，根子在伊壁鸠鲁所谓 *kenodoxia*，即空洞信念。文明生活里，较原始的威胁多已受控，扰动与痛苦反而主要由此而来：正因它们作祟，人才拼命追逐无尽的财富与权力，一头扎进本想躲开的危险里。
