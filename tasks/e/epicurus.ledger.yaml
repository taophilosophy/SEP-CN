      Unlike other Hellenistic schools, such as those of Aristotle and the Stoics, the Epicureans were not greatly interested in formal logic, but they certainly needed a theory of the formation of beliefs. As far as the ideational content of thinking — that is, the thought of something — is concerned, Epicurus proposed a radically reductive hypothesis: just as sensations occur as a result of thin films emitted by objects that enter the appropriate sense organ, so too some of these simulacra are fine enough to penetrate directly to the mind (located in the chest), and that is how we imagine such objects (e.g., gods). This process is invoked to explain not only dream images, but many kinds of mental impression, including impressions constituting voluntary thought: the latter occurs when we attend to one or another of the exiguous physical films that are continuously floating through the air. (How we manage to attend voluntarily to whichever of these films we choose is not explained in the surviving sources.) Imagining a thing is thus nothing more than picking out the simulacra that have been emitted by it, and which may endure beyond the life of the thing itself (hence we can imagine the dead). These mental images have no privileged status, such as Plato gave to his noetic Ideas or Forms; they are always true, but in this do not differ from the information provided by the senses. Mistakes occur here too when the wrong beliefs are associated with such impressions, for example, that because we have a mental image of a dead person it follows that he or she still exists in a ghostly form. Epicurean physics proves that this is impossible.
    step1: |-
      与亚里士多德派、斯多葛派等其他希腊化学派不同，伊壁鸠鲁派对形式逻辑兴趣不大，但他们确实需要一种信念形成理论。就思维的观念内容——即对某物的思想——而言，伊壁鸠鲁提出了一个极端还原论的假说：正如感觉由物体发出、进入相应感觉器官的薄薄膜而产生，这些影像中也有一些精细到能直接穿透到心灵（位于胸部），我们就以此想象这类对象（例如神）。这一过程不仅用于解释梦中影像，也用于解释多种心理印象，包括构成自愿思维的印象：当人留意于持续飘浮在空气中的某一缕极细微的物理薄膜时，自愿思维便发生了。（我们究竟如何自愿地留意于所选择的薄膜，现存材料未作解释。）于是，想象一物不过是挑出该物发出的影像，而这些影像在事物本身消亡后仍可存留（因此我们可以想象死者）。这类心理影像没有柏拉图赋予其理智理念或形式的那种特权地位；它们总是真的，但在这一点上与感官提供的信息并无不同。这里也会出错：当错误的信念与这类印象相连时，例如，因为我们对一个死者有心理影像，就推论他或她仍以幽灵形式存在。伊壁鸠鲁的物理学证明这是不可能的。
    step2: |-
      伊壁鸠鲁派与亚里士多德派、斯多葛派这些希腊化学派不同，对形式逻辑素无大兴趣；但信念如何形成，他们非有一套说法不可。说到思维的观念内容——即“想到某物”——伊壁鸠鲁拿出的假说极端还原：感觉之生，源于物体射出的薄膜进入相应感官；同样，某些影像精细得能直透心灵（在胸口），我们便是这样想象那类对象（神即一例）。这套机制不只用来解释梦中的形象，也解释各式心理印象，包括构成自愿思维的那些：只要人留意到空气中不断飘过的某一缕极薄薄膜，自愿思维就出现了。（至于人如何能自愿地留意自己选中的那一缕，现存材料并未交代。）所以，想象一物无非是拣出它射出的影像；影像在物亡之后仍可存在，故我们能想象死者。这类心理影像并无特权地位——柏拉图给他的理智理念或形式的那种地位，这里没有。它们永远为真；不过在这点上，它们与感官所给的信息并无二致。错仍会出，出在错误信念与印象挂错了钩：例如，只因心里有死者的影像，便推论那人仍以鬼魂之形存在。伊壁鸠鲁的物理学证明，此事断无可能。
