      *The Manual of Reason* says that space is ‘ubiquitous’ (*vibhu*), which it defines as ‘being in contact with every sample of earth, air, fire, water (and ‘mind’) (TS14). This raises the question: is space infinite in dimension, or the same size as the cosmos? If space is defined in terms of the relations between physical objects, then it would seem to have the same size as the cosmos. There are however Vaiśeṣika arguments that it is infinite. The Vaiśeṣikas say that most bodies are either ‘long’ (*dīrgha*) or ‘short’ (*hrasva*) in dimension (TS25, Bhaduri 1947: 118)[^bhaduri-1947], but that a body’s having ‘long’ or ‘short’ dimension is unintelligible unless it has bounding, perimeter parts. Space, however, has no parts and hence no boundary. Some Vaiśeṣikas conclude that space has no finite dimension (i.e. is infinite); others that it has a special dimension called ‘*paramadīrgha*’ or ‘maximal length’.
    step1: |-
      《理性手册》说空间是“遍在的”（*vibhu*），并将其定义为“与土、风、火、水（以及‘意’）的每一个样品相触”（TS14）。这引出一个问题：空间在维度上是无限的，还是与宇宙同大？若空间是按物理对象之间的关系来定义的，它似乎就与宇宙同大。然而胜论有论证说它是无限的。胜论师说，大多数物体在维度上或是“长”（*dīrgha*）或是“短”（*hrasva*）（TS25，Bhaduri 1947: 118）[^bhaduri-1947]，但除非物体具有界定的周边部分，说它有“长”或“短”的维度便不可理解。空间却没有部分，因而没有边界。一些胜论师由此断定空间没有有限维度（即无限）；另一些则断定它具有一种特殊维度，称为“极大长度”（*paramadīrgha*）。
    step2: |-
      《理性手册》说空间“遍在”（*vibhu*），并把遍在定义为“与土、风、火、水的每一个样品（以及‘意’）相触”（TS14）。问题随之而来：空间的维度是无限的，还是与宇宙一样大？若按物理对象之间的关系来定义空间，它似乎应与宇宙同大。但胜论另有一套论证，说它是无限的。胜论师指出，大多数物体在维度上非“长”（*dīrgha*）即“短”（*hrasva*）（TS25，Bhaduri 1947: 118）[^bhaduri-1947]；然而，一个物体若没有界定范围的周边部分，说它“长”或“短”便无从谈起。空间恰恰没有部分，也就没有边界。一些胜论师因此断定：空间没有有限维度（也就是无限）；另一些则说，它有一种特殊维度，叫“极大长度”（*paramadīrgha*）。
