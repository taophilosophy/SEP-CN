      ### 7.1 ‘Qualificative Perception’ and the Role of Concepts
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      A structured perception, of an object a as having a certain property *f* (e.g. seeing the thing in the corner as being a piece of rope), is called by the Naiyāyikas ‘qualificative’ (*savikalpaka = saprakāraka*), for it a perception of an object, the ‘qualificand’ (*viśeṣya*) as having a certain feature or ‘qualifier’ (*prakāra*; *viseṣaṇa*) (cf. TS 47). It is alleged by the Naiyāyikas that any piece of perceptual *knowledge* must be of this form, and further that most cases in which we claim just to be seeing an object (e.g. “I see the car”) are really cases of seeing something as a car. In a ‘qualificative’ perception, it is the qualificand which is in sensory connection with the perceiver. How then does the qualifier enter the picture? The Nyāya claim that:
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      > **Principle 2**: In every case of perception, the qualifier is a previously perceived entity (substance, quality, motion or universal) which is recalled by the perceiver and ‘superimposed’ upon the qualificand.
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      The intuitive idea is that the qualifying feature is a concept, empirically acquired by the perceiver, and now used to categorise the object perceived. To see that the passing animal is a horse, one must first possess the concept *horse*, by means of previous acquaintance with the type. (Use of the term ‘concept’ here does not imply that the features are in any sense subjective—for the Nyāya they are objective entities or constructions out of objective entities). The Nyāya thus use their theory of memory (initial experience causing dispositional trace causing memory event) as a theory of concept-possession.
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      Principle 2 has a number of consequences:
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      1. If every case of seeing an object *a* as *f* is preceded by a prior perception of *f*, and if that prior perception were itself of *f* as qualified by some qualifier *g*, we would get an infinite regress. The Nyāya (cf. TS 47) therefore state that, in addition to qualificative perceptions, there are also ‘non-qualificative’ (*nirvikalpaka = niṣprakāraka*) perceptual experiences. In such experiences, on sees both the object and its qualifier, but not as being qualified by the qualifier.
      2. To illustrate the general theory, suppose I perceive for the first time a vase having a particular shade of blue which I have never before seen. The theory states that, prior to seeing the vase as being qualified by that shade, I first see the vase, together with (but not qualified by) the shade, and then, recalling that shade, impose it upon the vase.
      3. Perceptual illusions, hallucinations, etc., are all explained as cases in which a wrong feature is recalled from memory (or the concept bank). Suppose I misperceive the coiled object in the corner as being a snake. The account given by the Nyāya is that I recall and superimpose the feature snakehood, on the basis presumably of its close similarity with the true feature ropehood. Similarly, if I hallucinate a dagger, the account entails that I am superimposing the memory of some previously encountered dagger upon the region of space in front of me (there must be *some* qualificand, by Principle 1). This is called the ‘mislocation’ (*anyathākhyāti*) theory of perceptual error. Note that, if all error is a product of qualifier-mislocation, then no error is possible with respect to the qualificand with which one is in sensory connection. Note too that the Nyāya make no appeal to ‘images’, ‘ideas’ or any other subjective content to explain illusion—it is an externalist account of error. This shows that the so-called argument from illusion, from the phenomenal indistinguishability of veridical and non-veridical perceptual experiences to their having a shared subjective content, is false. It is not clear, however, that one can always find a suitable qualificand (is a region of space really perceived in a hallucination?) or a suitable qualifier (e.g. when one sees a stick as bent, because partially submerged in water, where does the feature ‘being bent thus’ come from?—the Nyāya actually claim that it is an objective feature causally produced by the act of perceiving!)
      4. This theory allows the Nyāya to say that locutions like “I see (visually) that the air is cold” or “I see that the mango is sweet”, in which the qualifier, though perceptible is not a visible property, are genuine cases of perception. They classify them as a type of ‘extra-ordinary’ perception, called *jñāna-lakṣaṇā-pratyāsatti*. (The other types of extra-ordinary perception sometimes admitted are ‘*sāmānyalakṣaṇa*’, in which all the bearers of a property are perceived by perceiving the property, and yogic perception.)
      5. The Nyāya state that experience amounts to a knowledge-episode when and only when it is true, i.e. when the qualifier actually qualifies the qualificand. *The Manual of Reason* (TS 69 iii) says that the *guṇa* or special causal factor for perceptual knowledge when the qualifier imposed by the perceiver onto the sensorily connected qualificand is actually present in the qualificand. There may, however, be scope for Gettier-style counter-examples to this definition.
    step1: TBD
    step2: TBD
