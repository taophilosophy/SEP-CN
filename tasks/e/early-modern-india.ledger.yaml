      1. At time *t*₀ the fruit is stationary at place *s*₀. Its weight is counterbalanced by its contact with its stalk. At *t*₁, its stalk breaks and its weight causes it to move to point *s*₁. At this time too there is produced in the fruit a dispositional ‘impetus’. At *t*₂, the impetus in the fruit causes a second motion, from *s*₁ to *s*₂, and so on for all subsequent times. Note that the ‘weight’ of the fruit is the cause of its initial motion, but then ceases to be operative. The cause of all subsequent motion is the ‘impetus’ impressed into the fruit by the initial motion. It is this idea, that the subsequent motion of the fruit is the result, not of an external force, but of the internally impressed *vega*, which licenses us to describe the Vaiśeṣika account as an impetus theory.
      2. When the javelin is thrown, the initial volitional push imparts into the javelin an initial motion and an impetus. The upwards impetus counteracts the javelin’s weight and causes its upwards motion. When this impetus is exhausted by contact with the air, the javelin’s weight imparts a downwards impetus and the javelin falls. The horizontal motion of the javelin is caused by its having a horizontal impetus which again decreases as a result of contact with the air. The amount of impetus initially acquired by the javelin is proportional to the applied volitional push. Once again, its is the javelin’s having impetus, rather than the action of some external force, which accounts for its continued motion through the air.
    step1: |-
      1. 设时刻 *t*₀ 果实静止于位置 *s*₀。其重量与果柄的接触相抵。至 *t*₁，果柄断，其重量使之移动到点 *s*₁。此时果实中也产生了一种倾向性的“冲力”。至 *t*₂，果实中的冲力引起第二次运动，从 *s*₁ 到 *s*₂，其后诸时刻依此类推。注意，果实的“重量”是其初始运动的原因，但随后即不再起作用。此后一切运动的原因，是最初运动注入果实的“冲力”。正是这一观念——果实的后续运动不是外力所致，而是内注的 *vega* 之果——使我们有资格把胜论的说法称为冲力理论。
      2. 标枪掷出时，最初的意志性推动把一种初始运动与一份冲力注入标枪。向上的冲力对抗标枪的重量并引起其向上运动。当这份冲力因与空气接触而耗尽时，标枪的重量注入一份向下的冲力，标枪遂落下。标枪的水平运动由其拥有的水平冲力引起，该冲力又因与空气接触而衰减。标枪最初获得的冲力之量，与所施的意志性推动成正比。再一次，是标枪之拥有冲力——而非某个外力的作用——解释了它在空气中的持续运动。
