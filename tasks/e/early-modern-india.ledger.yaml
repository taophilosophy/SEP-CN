      where *S*′ is used to denote the complement of *S*. This definition is traceable both to the early Nyāya notion of a ‘deviating’ pseudo-reason (i.e. one which occurs somewhere where the inferable property *S* is absent), and to Diṅnāga’s ‘triple-condition’ theory of the inferential sign, his third condition being that H must not be located in any “disagreeing case” (cf. ‘*vipakṣa*’), i.e. a place where *S* is absent. In either case, the intuition is that a relation expressed by “where there is smoke there is fire” obtains just in case there is no place where fire is absent but smoke is present, i.e. no counter-example. The first definition which Gaṅgeśa considers is of just this form. It is that *S* pervades *H* iff *H* has “non-occurrence in the loci of absence of *S*” (*sādhyābhāvavad-avṛttitvam*), i.e. V₁.
    step1: |-
      其中 *S*′ 用来表示 *S* 的补集。这一定义既可追溯到早期正理“偏离”似因的观念（即出现在可推断性质 *S* 缺席之处的似因），也可追溯到陈那的推断标记“三相”理论——其第三相是 H 必须不出现于任何“不同意的情形”（参见“*vipakṣa*”，异品），即 *S* 缺席之处。无论哪种情形，直觉都是：“有烟处即有火”所表达的关系成立，当且仅当没有火缺席而烟在场的场所，即没有反例。甘格沙考虑的第一个定义正是这种形式。它说：*S* 遍充 *H*，当且仅当 *H* “于 *S* 之阙无处不转”（*sādhyābhāvavad-avṛttitvam*），即 V₁。
    step2: |-
      式中 *S*′ 表 *S* 之补。此定义一可溯早期正理“偏离”似因之观念——即见于可立性质 *S* 缺席处之似因；二可溯陈那推断标记“三相”说——其三相者，H 不得出现于任何“异品”（*vipakṣa*），即 *S* 缺席之处。二途之直觉皆同：“有烟处即有火”所表之关系成立，当且仅当无火缺席而烟在场之场所——即无反例。甘格沙所考第一定义正取此形：*S* 遍充 *H*，当且仅当 *H*“于 *S* 之阙无处不转”（*sādhyābhāvavad-avṛttitvam*），即 V₁。
