      Pervades (*S*, *H*) iff i. ∃*x* (*Hx* & *P*′*x*) → (*P* ≠ *S*), and
    step1: TBD
    step2: TBD
  - id: 191
    kind: body
    source: |-
      **ii.**
    step1: TBD
    step2: TBD
  - id: 192
    kind: body
    source: |-
      ∃*x* (*Hx* & *Sx*).
    step1: TBD
    step2: TBD
  - id: 193
