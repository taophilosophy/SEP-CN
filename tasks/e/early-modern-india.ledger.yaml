      The term ‘cognition’ is used by the Naiyāyikas to refer to any intentional (*sa-viṣayaka*; object-directed) mental state, including states of perceiving, inferring, doubting, guessing, remembering, etc., but excluding desiring, hoping, suffering, etc. (cf. Matilal 1968: 7–8)[^matilal-1968]. Because we say that the subject has such states, they are thought to be ‘qualities’ (in the technical Vaiśeṣika sense) of the soul. *The Manual of Reason* states that a cognition is the “ground for all linguistic practice” (TS 34), reflecting the Nyāya conception of language as primarily an instrument for transmitting true thoughts from speaker to hearer.
    step1: |-
      正理论者用“认知”一词指称任何意向性的（*sa-viṣayaka*；指向对象的）心灵状态，包括知觉、推断、怀疑、猜测、回忆等状态，但排除欲求、希望、受苦等（参见 Matilal 1968: 7–8）[^matilal-1968]。由于我们说主语拥有这类状态，它们被想作灵魂的“性质”（按胜论的技术意义）。《理性手册》说认知是“一切语言实践的根据”（TS 34），这反映了正理派把语言首先看作从说者向听者传递真思想的工具的概念。
    step2: |-
      “认知”一词，正理论者用以指称任何意向性的（*sa-viṣayaka*；指向对象）心灵状态：知觉、推断、怀疑、猜测、忆念等皆在其列，欲求、希望、受苦等则除外（参见 Matilal 1968: 7–8）[^matilal-1968]。因吾人说主语“有”此等状态，它们遂被视作灵魂的“性质”（按胜论技术义）。《理性手册》称认知为“一切语言实践之根据”（TS 34），正见其语言观：语言首要是说者向听者传递真思想之工具。
