    source: |-
      Two older Indian philosophical traditions, the early Nyāya (grounded in Gautama Akṣapāda’s *Nyāya-sūtra*, c. 100 C.E., and dealing mainly with logic, epistemology, and the theory of debate) and the Vaiśeṣika (grounded in Kaṇāda’s *Vaiśeṣika-sūtra*, c. 100 B.C.E., dealing mainly with ontology), developed in parallel until, at some point in the 11th or 12th century, they merged to form a new school, called “Navya-Nyāya”, the new Nyāya or “new reason” school (Ganeri 2011)[^ganeri-2011]. Despite its name, Navya-Nyāya incorporates and develops classical Vaiśeṣika metaphysics as well as classical Nyāya epistemology. The Navya-Nyāya authors also develop a precise technical language through the employment of which many traditional philosophical problems could be clarified and resolved. Navya-Nyāya techniques proved to be so versatile that they were employed, not just by philosophers, but also in poetics, linguistics, legal theory, and other domains of medieval Indian thought. The foundational text of this school was Gaṅgeśa’s brilliant and innovative *Jewel of Reflection on the Truth* (*Tattvacintāmaṇi*). The school continued to develop for about four centuries, reaching its heights with the works of Raghunātha, Jagadīśa and Gadādhara (Ganeri 2014). The sophisticated use this school made of its technical vocabulary made it increasingly inaccessible, and so, in the 17th and 18th centuries, several manuals or compendia were written to explain in simplified language the basic tenets of the school. I will describe the philosophical principles of Navya-Nyāya based on a synopsis of the most successful of these, Annambhaṭṭa’s *The Manual of Reason* (*Tarkasaṃgraha*; henceforth TS), together with its auto-commentary, the *Dīpikā* (henceforth TSD), This text was nicknamed *Bāla-gādādharī*, a sort of ‘Beginners Guide to Gadādhara’. As well as presenting the Vaiśeṣika theory of categories (a mixture of physical theory, metaphysics and philosophy of psychology), and the epistemological, methodological, and logical techniques of the new Nyāya system, *The Manual of Reason* interjects fascinating discussions on a wide variety of topics of philosophical interest, making the text an enjoyable and informative introduction to later Indian analytical philosophy (trans. G. Bhattacharya 1983; for discussion of the text, see also Athalye 1930, Atreya 1948, C. Bhattacharya 1966, Foucher 1949, Shastri 1961)[^athalye-1930][^atreya-1948][^bhattacharya-1966][^foucher-1949][^shastri-1961].
    step1: |-
      两个较古老的印度哲学传统——早期正理派（Nyāya，奠基于乔答摩·足目（Gautama Akṣapāda）约公元 100 年的《逻辑经》（*Nyāya-sūtra*），主要处理逻辑、知识论与论辩理论）与胜论派（Vaiśeṣika，奠基于迦那陀（Kaṇāda）约公元前 100 年的《胜论经》（*Vaiśeṣika-sūtra*），主要处理存在论）——并行发展，直到 11 或 12 世纪的某一时刻，二者合并而形成一个新学派，即所谓“新正理”（Navya-Nyāya）——新的正理派或“新理由”学派（Ganeri 2011）[^ganeri-2011]。尽管有此名称，新正理既吸收并发展了古典胜论的形而上学，也吸收并发展了古典正理的知识论。新正理的作者们还发展出一种精确的技术性语言，借助这种语言，许多传统哲学问题可以得到澄清和解决。新正理的技巧被证明如此多用，以至于不仅哲学家，诗学、语言学、法理论以及中世纪印度思想的其他领域也使用它们。这一学派的奠基文本是甘格沙（Gaṅgeśa）才华横溢且富于创新的《真理思择摩尼》（*Tattvacintāmaṇi*）。该学派持续发展了约四个世纪，在罗怙那陀（Raghunātha）、贾迦迪沙（Jagadīśa）与迦达陀罗（Gadādhara）的著作中达到顶峰（Ganeri 2014）。这一学派对其技术词汇的精妙运用使其日益难以进入，因此在 17 与 18 世纪，出现了数部手册或纲要，用简化的语言解释该学派的基本义理。我将基于其中最成功的一部——阿南跋塔（Annambhaṭṭa）的《理性手册》（*Tarkasaṃgraha*；下称 TS）连同其自注《明灯疏》（*Dīpikā*；下称 TSD）——的提要来描述新正理的哲学原则。此文本得到一个绰号《童蒙迦达陀罗》（*Bāla-gādādharī*），某种“迦达陀罗初学者指南”。除了陈述胜论的句义理论（物理理论、形而上学与心理哲学的混合物）以及新正理体系的知识论、方法论与逻辑技巧之外，《理性手册》还穿插了对诸多哲学上有趣话题的引人入胜的讨论，使这部文本成为晚期印度分析哲学的一部令人愉悦且信息丰富的导论（英译本见 G. Bhattacharya 1983；对该文本的讨论另见 Athalye 1930、Atreya 1948、C. Bhattacharya 1966、Foucher 1949、Shastri 1961）[^athalye-1930][^atreya-1948][^bhattacharya-1966][^foucher-1949][^shastri-1961]。
    step2: |-
      早期正理派（Nyāya）与胜论派（Vaiśeṣika）是两个并行的古老印度哲学传统：前者奠基于乔答摩·足目（Gautama Akṣapāda）约公元 100 年的《逻辑经》（*Nyāya-sūtra*），主要关注逻辑、知识论与论辩理论；后者奠基于迦那陀（Kaṇāda）约公元前 100 年的《胜论经》（*Vaiśeṣika-sūtra*），主要关注存在论。两条传统并流而下，至 11、12 世纪的某个时刻终于合流为一门新学派——“新正理”（Navya-Nyāya），即新的正理派、“新理由”学派（Ganeri 2011）[^ganeri-2011]。名为“新”正理，它实兼收并蓄：既承续古典胜论的形而上学，也承续古典正理的知识论，并将二者推向前进。新正理诸家还锻造出一套精确的技术语言；借这套语言之力，许多传统哲学问题得以澄清和解决。其方法之灵便，连诗学、语言学、法理论等中世纪印度思想的其他领域也乐于取用。学派的奠基之作，是甘格沙（Gaṅgeśa）那部才华横溢、锐意创新的《真理思择摩尼》（*Tattvacintāmaṇi*）。此后学派又发展了约四个世纪，至罗怙那陀（Raghunātha）、贾迦迪沙（Jagadīśa）与迦达陀罗（Gadādhara）的著作而臻于极盛（Ganeri 2014）。然而技术词汇用得越精微，学派就越是难以接近；于是 17、18 世纪出现数部手册与纲要，用浅易语言讲解其基本义理。本文即以其中最成功的一部——阿南跋塔（Annambhaṭṭa）的《理性手册》（*Tarkasaṃgraha*；下称 TS）——连同其自注《明灯疏》（*Dīpikā*；下称 TSD）为据，撮述新正理的哲学原则。此书别号《童蒙迦达陀罗》（*Bāla-gādādharī*），堪称一部“迦达陀罗入门”。它不仅陈述胜论的句义理论（融物理理论、形而上学与心理哲学于一炉），传授新正理体系的知识论、方法论与逻辑技巧，还穿插大量饶有兴味的哲学讨论，读来既令人愉悦又获益良多，是晚期印度分析哲学的一部理想导论（英译本见 G. Bhattacharya 1983；关于该文本的讨论另见 Athalye 1930、Atreya 1948、C. Bhattacharya 1966、Foucher 1949、Shastri 1961）[^athalye-1930][^atreya-1948][^bhattacharya-1966][^foucher-1949][^shastri-1961]。
