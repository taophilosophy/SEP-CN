      ### 6.1 Overview of Causation
    step1: |-
      ### 6.1 因果性概观
    step2: |-
      ### 6.1 因果性概观
  - id: 129
    kind: body
    source: |-
      The study of causation is an important part of Indian philosophical thought. One reason for this is the early interest in cosmological speculation: “We should remember that philosophic activity in India arose out of the cosmogonic speculations of the Vedas and the Upaniṣads. The all-important business of philosophy was to attempt to discover some simple, unitary cause for the origin of this complex universe” (Matilal 1985: 287)[^matilal-1985]. Another reason is that Indian linguistics (especially the Pāṇinian system of ‘*kārakas*’ or relations between verb and noun, which greatly influenced Nyāya, Mīmāṃsā and Buddhist thinkers) is based on an underlying causal model, in which the verb in a sentence designates an event, for the production of which each such object as is designated by a noun has a particular causal role. This same model informed and influenced Indian epistemology, and led to the development of the theory of ‘*pramāṇas*’, the causal means or processes leading to an epistemically accredited awareness-event (*pramā*). In the Nyāya tradition, four such *pramāṇas* are recognised: perception (*pratyakṣa*), inference (*anumāna*), ‘analogical identification’ or ‘comparison’ (*upamāna*) and testimony (*śabda*). The accounts given of each of these employ an extremely causalistic idiom, typical questions being ‘what causes a perceptual experience?’, ‘what are the distinguishing causal factors of true and false perceptual experiences?’, ‘under what conditions does knowledge of the premises of an argument cause knowledge of the conclusion?’, etc.
    step1: |-
      因果性研究是印度哲学思想的重要部分。原因之一是对宇宙论思辨的早期兴趣：“我们应当记得，印度的哲学活动产生于《吠陀》与《奥义书》的宇宙发生论思辨。哲学的头等大事，是试图为这个复杂宇宙的起源发现某种简单的、单一的原因”（Matilal 1985: 287）[^matilal-1985]。另一原因是印度语言学（尤其是波你尼的“作业格”体系——动词与名词之间的关系，它深刻影响了正理、弥曼差与佛教思想家）建立在一个潜在的因果模型之上：句中动词标示一个事件，而名词所标示的每个对象都对该事件的产生有特定的因果角色。同一模型塑造并影响了印度知识论，导致了“*pramāṇas*”（量）理论的发展：通向一个得到知识论认可的觉知事件（*pramā*）的因果手段或过程。正理传统承认四个这样的 *pramāṇas*：知觉（*pratyakṣa*）、推断（*anumāna*）、“类比同一”或“比较”（*upamāna*）与证言（*śabda*）。对每一者的说明都采用极端因果主义的语言，典型问题如“什么引起知觉经验？”“真假知觉经验的区别性因果要素是什么？”“在什么条件下对论证前提的知识引起对结论的知识？”等等。
    step2: |-
      因果性之研究，印度哲学思想之要目也。其故有二。一在早期对宇宙论思辨之兴趣：“应记印度哲学活动出于《吠陀》与《奥义书》之宇宙发生论思辨；哲学之头等大事，是为复杂宇宙之起源寻一简单而单一之原因”（Matilal 1985: 287）[^matilal-1985]。二在印度语言学（尤以波你尼“作业格”（*kārakas*）体系——动名关系之学——深刻影响正理、弥曼差与佛家诸师）立于一个潜在因果模型：句中动词标示一事，而名词所指之对象各当一特定因果之职，以成此事。同一模型浸润并影响了印度知识论，遂有“量”（*pramāṇas*）之论——通向一个知识论认可之觉知事件（*pramā*）的因果手段或过程。正理传统立四量：知觉（*pratyakṣa*）、推断（*anumāna*）、譬喻量（*upamāna*，“类比同一”或“比较”）与声量（*śabda*，证言）。四者之说皆用极端因果主义之语言，典型问题如：“何者致知觉经验？”“真假知觉经验之区别性因果要素为何？”“于何条件下，论证前提之知识致成结论之知识？”等等。
