    step1: |-
      若把这一系列定义当作对句义的*先验*重构来读，会有一些问题。尤其“实体”与“性质”的定义似乎联合成环，除非我们预设诸如实体性之类的普遍者已被给定——而这又使定义变得有些空洞。我将给出另一个重构，一个大致追随正理—胜论大家优陀耶那（Udayana）的重构（参见 Tachikawa 1981）[^tachikawa-1981]。
