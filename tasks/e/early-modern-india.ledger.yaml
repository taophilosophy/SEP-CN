      The idea here is that the possibility of recognitive experience presupposes the existence of a unitary enduring self. There are really two arguments compressed here. One is this: I cannot *remember* an object unless I have seen it earlier—I cannot remember what you have seen (cf. Locke’s account of personal identity in terms of a continuity of memory experiences). The other argument is more intricate. The Abhidharma Buddhist claims that a person is just an aggregate of experiences, some visual, some tactile, etc. The problem raised for such an account by the Naiyāyika is that it is possible to make trans-modality judgements, in which the deliverances of one sense-faculty are compared with another. Suppose that *V*(*o*₁) is a visual experience of an object *o*₁, and *T*(*o*₂) is a tactile experience of an object *o*₂. It is possible to judge “*o*₁ = *o*₂”, but this judgement does not belong to the sphere of any one sense-faculty. Hence, it must be located in some other substance. The self is here conceived of as that which collates, organises and compares the deliverances of the individual senses. See Ganeri 2012, chapters 11, 15, 16 for an expanded discussion.
    step1: |-
      这里的想法是：再认性经验的可能性预设了一个单一而持存的自我。这里其实压缩了两个论证。其一是：除非我先前见过某物，否则我不能记得它——我不能记得你所见过的（参洛克以记忆经验的连续性说明人格同一性）。另一论证更曲折。阿毗达磨佛教主张，人只是经验的聚合，有些是视觉的，有些是触觉的，等等。正理论师对这种说法提出的问题是：跨感官的判断是可能的，即把一种感官的所与同另一种感官的所与相比较。设 *V*(*o*₁) 是对对象 *o*₁ 的视觉经验，*T*(*o*₂) 是对对象 *o*₂ 的触觉经验。我们可以判断“*o*₁ = *o*₂”，但这个判断不属于任何单一感官的领域。因此，它必定位于某种其他实体之中。自我在这里被设想为汇集、组织并比较各别感官所与者。扩展讨论见 Ganeri 2012 第 11、15、16 章。
