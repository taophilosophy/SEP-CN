      There are certain problems with this series of definitions, read as an *apriori* reconstruction of the categories. In particular, the definitions of ‘substance’ and ‘quality’ seem to be jointly circular, unless we take as already given universals such as substance-hood, which make the definitions somewhat vacuous. I will give another reconstruction, one which roughly follows the great Nyāya-Vaiśeṣika author Udayana (cf. Tachikawa 1981)[^tachikawa-1981].
    step1: |-
      把这串定义读作句义的先验重构，会遇到一些困难。特别是“实体”与“性质”的定义似乎合起来构成循环，除非我们把实体性这类普遍当作已给的前提——可这样一来，定义就有些空洞了。下面我给出另一种重构，它大体遵循正理胜论一脉的大家优陀耶那（参 Tachikawa 1981）[^tachikawa-1981]。
    step2: |-
      把这串定义当作对句义的先验重构来读，问题不小。最扎眼的是：“实体”与“性质”的定义合在一起看是循环的；要打破循环，就得把实体性这类普遍当作已经给定的前提，可这样一来，定义本身又显得空洞无物。下面我给出另一种重构，它大体沿袭正理胜论传统的大家优陀耶那的思路（参考 Tachikawa 1981）[^tachikawa-1981]。
