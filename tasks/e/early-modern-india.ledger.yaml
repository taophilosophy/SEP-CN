      (3) The argument might be thought of as an argument based on induction, induction from the class of artefacts to the class of natural products. What licenses the induction from things seen to have a maker to things not so seen? Dharmakīrti (cf. Vattanky 1984: 56–8)[^vattanky-1984] says that we are licensed to infer that an object has a maker only if we have seen other objects of the same type being made. Thus, we can infer that the Pyramids had a maker, not because we can see that maker, but because the Pyramids belong to a type (buildings) other instances of which we have seen made. The Naiyāyika makes a bolder inductive claim, that two object belong to the same ‘type’, in this sense, if they are both effects.
