    source: |-
      *The Manual of Reason* says of time that it is the ground for statements about the past, present and future, that it is unique, eternal and ubiquitous, and that it is the container of everything and a instrumental cause of every effect (TS15+D). The conception of time mirrors that of space: it is that in virtue of which statements of the form “A is earlier than B” are objectively true of false. Time is said to differ from space, and thus not be identical with it, in the following respect: whereas what is spatially near or far varies from person to person, what is temporally near or far is the same for all persons (cf. Bhaduri 1947, Mohanty 1992)[^bhaduri-1947][^mohanty-1992]. But why should we restrict our attention only to presently existing persons?
    step1: |-
      《理性手册》论时间：时间是关于过去、现在与未来之陈述的根据；它唯一、恒常、遍在；它容纳一切，并且是一切结果的工具因（TS15+D）。时间的构想与空间相映：凭借它，“A 早于 B”这类陈述才有客观真假。据说时间在以下方面有别于空间，因而与空间不同一：空间上的近远因人而异，时间上的近远则对一切人相同（参 Bhaduri 1947、Mohanty 1992）[^bhaduri-1947][^mohanty-1992]。可是，我们为何只把注意力限于现在存在的人？
    step2: |-
