      ### 6.3 What is a Cause?
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      The Naiyāyikas build up in this way a model of causation, in which different causal factors have different types of causal role. The model reflects (or is reflected in) the Indian grammatical analysis of causal statements, such as “The potter throws a pot with her stick”, “The lumberjack fells a tree with her axe”, in which one distinguishes, apart from the verb designating the event, an agent (*kartṛ*), object (*karman*), instrument (*karaṇa*), and so on. We do not yet know, however, how to distinguish between causes and non-causes. *The Manual of Reason* (TS 41) provides the Navya-Nyāya answer. Given two entities, *c* and *e*,
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      *c* is a causal factor for *e* iff
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      1. *c* exists before *e*,
      2. *c* exists ‘regularly’ (*niyata*) with *e*, and
      3. *c* is ‘relevant’ (*ananyathāsiddha*) to *e*.
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      The first clause is to prevent self-causation. The import of the second condition is that entities similar to *c* must always exist with entities similar to *e*. There must be an invariable or constant conjunction between *c*-type entities and *e*-type entities. This rules out objects which just happen to be there, such as, to give the Naiyāyikas’ example, a donkey happening to wander past the pottery just as the potter goes to work. This feature of the account, the insistence that a causal relation instantiates a regularity, resembles a Humean account of causation. The Naiyāyika, however, recognised the possibility of ‘accidental’, non-causal regularities, such as day always preceding night, or (the example given by *The Manual of Reason*), the colour of the thread always preceding the cloth. Although the occurrence of a cloth is invariably preceded, not just by threads, but by the presence of thread-colour as well, we would not want to say that thread-colour is a cause of cloth. The third clause is their attempt to eliminate such accidental regularities. The same clause is supposed to stop the cause of a cause (e.g. the potter’s parents) from being a cause. Its meaning, however, is not quite clear. Literally, it states that a cause must be ‘not established otherwise’. Kalidas Bhattacharya says that “an invariable antecedent is irrelevant if knowledge of it is not required for any anticipative knowledge of the origination of the effect” (see Potter 1977: 67)[^potter-1977]. Matilal says that an antecedent is irrelevant if “it is possible to find a reasonable explanation of its appearance” (1985: 290). *The Manual of Reason* states that an antecedent is irrelevant if its antecedence is only established along with some other entity. We know that thread-colour precedes cloth only because we know that it occurs with the thread (which we know to precede cloth); hence the thread-colour is irrelevant in this sense. This highlights an asymmetry between the two regularities, the threadcolour-cloth regularity and the thread-cloth regularity. For while we can establish the latter directly by observing correlations between thread and cloth, we establish the former by observing the correlation between threadcolour and thread. Thus the former supposedly depends on the latter but not vice versa. It is not clear, however, that the dependence does not run the other way too. In any case, in using this criterion to block transitivity, the Naiyāyikas seem to seeking a definition not of causality per se (which most regard as a transitive relation), but rather an epistemic notion of ‘causal explanation’ or ‘causal salience’.
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      ### 6.4 Causation and Knowledge
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      Cognitions that are not memories are classified under two headings: true and false. If we can find factors invariably preceding *true* cognitions, then we will have the beginnings of a causal theory of knowledge. We will be able to say that a cognition is a knowledge-episode iff it is (i) true and (ii) preceded by a causal factor which invariably precedes true cognitions (i.e. its truth will not be an accident). The Nyāya (TS 39) claim to find four, and only four, invariable correlations: perception, inference, comparison, and testimony. To each they apply the model of causation outlined above. In particular, they isolate, in each case, a ‘special’ instrumental cause (*karaṇa*), to which they give the name ‘*pramāṇa*’. In the case of perception, for example, it is the senses. Note that an invariable correlation between two entities, in the sense defined above, does not entail that whenever the first is present, so is the second—the potter is invariably connected with a pot, but only causes a pot when he is actually ‘operating’. Similarly, a *pramāṇa*, e.g. the eyes, only causes a true cognition when it is actually operating. In other words, the *pramāṇa* is a necessary but not a sufficient cause for true cognitions. To get a sufficient cause, the Nyāya (TSD 69 iii) says:
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      > The causal condition that is ‘special’ to true cognition is called a ‘*guṇa*’ [an epistemic excellence]; the causal condition that is ‘special’ to false cognition is called ‘*doṣa*’ [an epistemic defect]. In the perceptual case, the *guṇa* [of a true cognition ‘*x* is *F*’] is the sensory connection with an object [*x*] possessing a property [*F*], etc.
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      This is, in effect, the operative condition for true perceptual cognitions. Thus, the occurrence of all the usual factors (substrate causes, non-substrate causes, general instrumental causes, etc.) together with an epistemic excellence (*guṇa*) is a necessary and sufficient causal condition for the occurrence of a true cognition (see also Philips and Tatacharya 2003).
