      Gaṅgeśa’s trick implicitly trades on the theorem “*A* → *B* ≡ ¬ (*A* & ¬ *B*)”. Thus clause (i) is virtually equivalent to V₁. This shows too that we do not yet have a definition which can deal with the partially locatable properties, for which we need something more like V₂. Hence Gaṅgeśa’s final definition is:
