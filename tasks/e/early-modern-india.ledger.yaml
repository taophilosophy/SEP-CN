    source: |-
      *Vyāpti* or pervasion, is that relation between the inferential sign (*hetu*) and the inferred property (*sādhya*), which legitimises the inference. It would typically be expressed by a sentence such as “wherever there is smoke there is fire”, or “whatever exists is transitory”. Knowledge of this relation, according to the Nyāya, is the instrumental cause in the inferential process—it is that relation knowledge of which, when combined with observation of the inferential sign, will permit us to make a sound or knowledge-yielding inference. Gaṅgeśa therefore attaches great importance to the precise definition of this relation. He notes as many as twenty-one definitions all of which he rejects for some reason or other, and then he goes on to give seven further formulations, each of which he considers acceptable. Of the definitions he rejects, the first five came to be known as the ‘*vyāpti-pañcaka*’, and inspired a huge literature both among the Sanskrit commentators and their modern interpreters. These definitions are traceable to the earlier Buddhist and Nyāya literature. Two more rejected definitions, known as the ‘Lion and Tiger’ definitions, are apparently due to Gaṅgeśa’s Navya-Nyāya predecessors (Wada 2007, ch. 5)[^wada-2007]. The definition Gaṅgeśa finally accepts is called his ‘*siddhānta-lakṣaṇa*’.
    step1: |-
      *Vyāpti* 或遍充，是推断标记（*hetu*）与所推断性质（*sādhya*）之间使推断合法化的关系。它通常由诸如“凡有烟处皆有火”或“凡存在者皆无常”这样的句子表达。按正理派，对这一关系的知识是推断过程中的工具因——正是对这一关系的知识，结合对推断标记的观察，使我们能够做出健全的或产生知识的推断。因此甘格沙极为重视对这一关系的精确定义。他记下多达二十一个定义，都因这种那种理由被他拒绝；然后他进一步给出七个表述，每一个他都认为可接受。在他拒绝的定义中，前五个后来被称为“*vyāpti-pañcaka*”（遍充五定义），在梵语注释家及其现代诠释者中都激发了大量文献。这些定义可追溯到更早的佛教与正理文献。另外两个被拒绝的定义称为“狮与虎”定义，显然出自甘格沙的新正理前辈（Wada 2007，第 5 章）[^wada-2007]。甘格沙最终接受的定义称为他的“*siddhānta-lakṣaṇa*”（宗义相）。
    step2: |-
      *Vyāpti*（遍充）者，推断标记（*hetu*）与所立性质（*sādhya*）之间使推断合法之关系也。通常以“凡有烟处皆有火”“凡存在者皆无常”一类句子表之。按正理派，此关系之知识乃推断过程之工具因——惟有此关系之知识，辅以对推断标记之观察，吾人方能成健全而生知之推断。故甘格沙于此关系之精确定义用力极深。他录定义多至二十一个，皆以种种理由拒之；继而另出七种表述，自认可接受。所拒定义之前五者，后世称“*vyāpti-pañcaka*”（遍充五定义），于梵语注家与其现代诠释者两界皆激起浩繁文献。此五定义可上溯早期佛教与正理文献。另两被拒者称“狮与虎”定义，显出自甘格沙之新正理前辈（Wada 2007，第 5 章）[^wada-2007]。甘格沙最终所取之定义，称其“*siddhānta-lakṣaṇa*”（宗义相）。
