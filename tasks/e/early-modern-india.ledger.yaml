      这番意思无非是说：要有再认的经验，就得先有一个单一而持存的自我。这里其实挤着两个论证。第一个：我不可能记得某物，除非此前见过它；你见过的东西，我记不得（可参洛克用记忆经验的连续性来讲人格同一性）。第二个更绕。阿毗达磨佛教说，人只是经验的堆积，其中有些是视觉的、有些是触觉的，如此等等。正理论师反问：跨感官的判断分明是可能的——人会把这一感官给出的东西同另一感官给出的东西拿来比较。设 *V*(*o*₁) 是对 *o*₁ 的视觉经验，*T*(*o*₂) 是对 *o*₂ 的触觉经验；我们可以判断“*o*₁ = *o*₂”，可这个判断不属于任何一个感官的辖区。于是它只能落在别的实体里。这里，自我被设想为那样的东西：它把各个感官的所与汇集起来、组织起来、加以比较。详细讨论见 Ganeri 2012 第 11、15、16 章。
