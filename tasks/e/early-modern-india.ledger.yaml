      Gaṅgeśa’s *Tattvacintāmaṇi* is divided into four parts, one for each of the four knowledge-sources or *pramāṇa*s recognised by the Nyāya school. The post-Gaṅgeśa scholars focused more and more exclusively on the second part, concerning inference, and wrote increasingly detailed commentaries on a comparatively small portion of the book, namely the part where Gaṅgeśa examines the relation between inferential sign and property-to-be-inferred, which is called the *vyāpti*, ‘pervasion’ or ‘inference-warranting’ relation (Ingalls 1951, Goekoop 1977, Wada 2007)[^goekoop-1977][^ingalls-1951][^wada-2007]. Even today, in a traditional Indian education, study of these sub-commentaries on various subsections of the *vyāpti* section of Gaṅgeśa forms an essential part of the curriculum.
    step1: |-
      甘格沙的《真理思择摩尼》分为四部分，正理学派承认的四个知识来源即四量各得其一。甘格沙之后的学者越来越专注于第二部分——论推断——并对书中一个相对较小的部分写下越来越详细的注释，即甘格沙考察推断标记与所欲推断性质之间关系的部分，这一关系称为 *vyāpti*、“遍充”或“推断凭据”关系（Ingalls 1951、Goekoop 1977、Wada 2007）[^goekoop-1977][^ingalls-1951][^wada-2007]。甚至在今天，在传统的印度教育中，研读这些关于甘格沙 *vyāpti* 节各子节的疏注仍是课程的必要部分。
    step2: |-
      甘格沙《真理思择摩尼》析为四部，正理学派所认四知识来源（四量）各当一部。甘格沙以后诸家日趋专精于第二部——论推断——于书中较小一段反复作注，愈注愈细：即甘格沙考察推断标记与所立性质间关系之处，此关系名曰 *vyāpti*，“遍充”或“推断凭据”关系（Ingalls 1951、Goekoop 1977、Wada 2007）[^goekoop-1977][^ingalls-1951][^wada-2007]。直至今日，传统印度教育中，研读甘格沙 *vyāpti* 节诸子节之疏注，仍为课程之大端。
