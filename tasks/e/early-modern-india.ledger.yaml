      The main effect of admitting partially located properties into the system is that it is no longer the case that a property, *P*, and its complement, *P*′, are disjoint: they may now intersect. If the inferred property is partially located, then the class of “agreeing cases” (*sapakṣas* - places where the inferred property is present) and the class of “disagreeing cases” (*vipakṣas*—places where the inferred property is absent) overlap rather than being distinct classes. To put it another way, a property *P* should be thought of as having both a “presence range” (*P*+) and an “absence range” (*P*−), and the two may overlap. Consider now the standard inference “The mountain has fire, because it has smoke”. Suppose we find a place where smoke is present, and fire is both absent and also present, e.g. the kitchen. Does this show the inference to be faulty? According to definition V₁, it does, because the kitchen will be a counter-example, a place where smoke is present and fire absent. But this is wrong: since fire is also present there, it is not a real counter-example to the rule “where there is smoke there is fire”. The upshot is that we must examine the “presence ranges” of the reason property and inferred properties, not their “absence ranges”. A real counter-example to rule is a case which is in the presence-range of the reason property but not in the presence range of the inferred property.
    step1: |-
      把部分位于的性质纳入体系的显著后果是：性质 *P* 与其补集 *P*′ 不再必然不相交，它们现在可能交叉。如果所立性质是部分位于的，那么“同意的情形”（*sapakṣas*——所立性质在场的场所）一类与“不同意的情形”（*vipakṣas*——所立性质缺席的场所）一类便会重叠而非判然有别。换言之，性质 *P* 应被想作既有“在场域”（*P*+）又有“缺席域”（*P*−），二者可能重叠。试看标准推断“山有火，因为它有烟”。假设我们发现一处所，烟在场而火既缺席又在场，例如厨房。这是否表明推断有误？按定义 V₁，是的，因为厨房将是一个反例：烟在场而火缺席之处。但这是错的：由于火也在那里在场，它并不是“有烟处即有火”这一规则的真正反例。结论是：我们必须考察因性质与所立性质的“在场域”，而非其“缺席域”。规则的真正反例是这样一个情形：处于因性质的在场域中，却不处于所立性质的在场域中。
    step2: |-
      纳部分位于性质于体系之中，其显要后果为：性质 *P* 与其补 *P*′ 未必互斥，二者今可相交。若所立性质局部位于，则“同品”（*sapakṣas*，所立在场之处所）与“异品”（*vipakṣas*，所立缺席之处所）两类遂相重叠，不复判然分立。换言之，性质 *P* 宜想作既有“在场域”（*P*+）复有“缺席域”（*P*−），二者可交。试取标准推断“山有火，以其有烟”。设吾得一处所，烟在场而火既缺席亦在场，如厨房。此足证推断有失乎？按 V₁，然也：厨房将成反例——烟在场而火缺席之处。然此非也：火既亦在场，则于“有烟处即有火”之规则，此非真反例。故结论为：吾人所须考察者，乃因性质与所立性质之“在场域”，非其“缺席域”。规则之真反例，乃是处于因性质在场域而不处于所立性质在场域之情形。
