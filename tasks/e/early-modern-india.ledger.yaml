      Nyāya epistemology is in effect a theory of the true nonrecollective cognitions, and their division into four types on the basis of the different accredited epistemic means (*pramāṇa-s*) by which they are produced. (What about accidentally true cognitions, e.g. the result of a lucky guess? There are well-discussed problems with incorporating them into the above schema). It is clear that, no matter how generally reliable are our epistemic methods, it will always be possible for misfires to issue occasionally in false cognitions (e.g. perceptual illusions, beliefs resulting from a reporting error, etc.). *The Manual of Reason*’s example (TS 72) is of the false pseudo-perceptual judgement “This is a piece of silver” on seeing an oyster-shell. I will discuss the epistemology of perception, inference and testimony in §§ 7, 8 and 9 respectively. Here, I will examine in more detail three types of cognition which, though very important within the Nyāya framework, are subsidiary to its epistemology. They are: memory, ‘doubt’ and *tarka*. (Where do dreams fit in the schema? TS 70 states that they belong in the category of ‘false’ cognitions. This, however, is odd, since they are not the product of any of the four *pramāṇa*s misfiring. Neither are they memories or states of doubt. According to Praśastapāda, dreams are the result of the free movement of the ‘mind’ when it is not connected with the external sense-faculties, influenced by *adṛṣṭa*, ‘unseen’ forces.)
    step1: |-
      正理知识论实际上是一套关于真的非忆性认知的理论，并依据产生它们的不同的、得到认可的认知凭据（*pramāṇa-s*）把它们分为四类。（那么碰巧为真的认知呢，例如侥幸猜中的结果？把它们纳入上述图式存在讨论充分的问题。）显然，无论我们的认知方法一般而言多么可靠，失误仍有可能偶尔产生假认知（例如知觉错觉、因报道错误而生的信念等）。《理性手册》的例子（TS 72）是看到牡蛎壳时产生的假拟知觉判断“这是一块银子”。我将分别在 §§ 7、8 与 9 讨论知觉、推断与证言的知识论。此处我将更详细地考察三种认知，它们在正理框架内虽然非常重要，却居于其知识论的辅助地位：记忆、“疑”与 *tarka*。（梦在图式中处于何处？TS 70 说它们属于“假”认知一类。然而这很奇怪，因为梦不是四个 *pramāṇa* 任何一个失误的产物，也不是记忆或疑的状态。按普拉夏斯塔帕达，梦是“意”不与外部感官官能相连时的自由运动的结果，受 *adṛṣṭa*（“不可见”之力）的影响。）
    step2: |-
      正理知识论实质上是一套关于真的非忆性认知的理论：依产生它们的诸种得到认可的认知凭据（*pramāṇa-s*）分为四类。（碰巧为真的认知——如侥幸猜中——又如何？将其纳入上述图式，向有讨论充分之难题。）显然，无论认知方法总体多么可靠，失误仍可能偶发假认知（知觉错觉、因转述之误而生的信念等）。《理性手册》的例（TS 72）是见牡蛎壳而生的假拟知觉判断“这是一块银子”。知觉、推断与证言的知识论将分别在 §§ 7、8、9 讨论。此处则详察三种认知：忆、“疑”与 *tarka*——它们在正理框架中地位重要，却居于其知识论的辅助位置。（梦置于图式何处？TS 70 谓其属“假”认知一类。此说却颇为奇怪：梦并非四 *pramāṇa* 任一失误之产物，亦非忆或疑。按普拉夏斯塔帕达，梦是“意”未与外感官相连时的自由运动所致，其间受 *adṛṣṭa*（“不可见”之力）影响。）
