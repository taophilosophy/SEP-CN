    source: |-
      The term ‘*tarka’* is often used loosely in the sense of hypothetical or reductio-ad-absurdum reasoning, but *The Manual of Reason* gives it a much more precise and technical sense:
    step1: |-
      “*tarka*”一词常在假设性推理或归谬推理的宽松意义上使用，但《理性手册》赋予它一个远为精确且技术性的意义：
    step2: |-
      “*tarka*”一词常泛用作假设推理或归谬推理之义；《理性手册》则予之以远为精确、远为技术性的含义：
  - id: 123
    kind: body
    source: |-
      > *Tarka* is the ‘ascription’ (*āropa*) of the ‘pervader’ (*vyāpaka*) by the ascription of the ‘pervaded’ (*vyāpya*). For example, ‘if there is no fire, then there is no smoke’(TS 73).
    step1: |-
      > *Tarka* 是借对“所遍充”（*vyāpya*）的赋予而对“能遍充”（*vyāpaka*）的赋予（*āropa*）。例如“若无火，则无烟”（TS 73）。
    step2: |-
      > *Tarka* 者，由赋予“所遍充”（*vyāpya*）而赋予“能遍充”（*vyāpaka*）之谓（*āropa*）。例如：“若无火，则无烟”（TS 73）。
  - id: 124
    kind: body
    source: |-
      The terms in this definition require explanation. The technical sense of ‘ascription’ (*āropa*) is ‘counterfactual or suppositional cognition’ (*āhāryāropa*), defined as a cognition whose qualifier is an property the opposite of which is known to reside in the qualificand. In other words, it is a counterfactual assumption. ‘Pervader’ and ‘pervaded’ are notions taken from the Nyāya theory of inference. When we say that wherever there is smoke, there is fire, this can be re-expressed as that fire pervades smoke, i.e. that the property of being a smoke-possessing-thing has a narrower extension than the property of being a fire-possessing-thing. So here, fire is the pervader and smoke is the pervaded. Thus, *tarka* consists in a cognition of smoke’s absence given the counterfactual assumption that fire is absent. It is the cognition of a conditional “if *p* then *q*”, or “were *p* to be true then *q* would be true”, assuming that ‘*p*’ is false.
    step1: |-
      这一定义中的术语需要解释。“赋予”（*āropa*）的技术意义是“反事实的或假设性的认知”（*āhāryāropa*），定义为其能别是一个其对立面已知居于所别的性质。换言之，它是一个反事实的假定。“能遍充”与“所遍充”取自正理派推理理论。当我们说凡有烟处皆有火时，这可以重新表述为：火遍充烟，即“是有烟之物”这一性质的外延窄于“是有火之物”这一性质的外延。所以此处，火是能遍充者，烟是所遍充者。于是 *tarka* 在于：在火缺席这一反事实假定下对烟之缺席的认知。它是对一个条件句“如果 *p* 则 *q*”或“若 *p* 为真则 *q* 为真”的认知，其中假定“*p*”为假。
    step2: |-
      此定义诸名目须予疏释。“赋予”（*āropa*）之技术义为“反事实或假设性认知”（*āhāryāropa*）：其能别为一性质，而其对立面已知居于所别。换言之，即一反事实假定。“能遍充”“所遍充”乃正理推理理论之名。凡言“有烟处皆有火”，可重述为：火遍充烟——即“有烟之物”一性之外延，窄于“有火之物”一性之外延。故此处火为能遍充，烟为所遍充。于是 *tarka* 即：在“火缺席”这一反事实假定下，对烟之缺席的认知。它乃对一个条件句的认知——“若 *p* 则 *q*”，或“若 *p* 为真则 *q* 为真”——而假定“*p*”为假。
  - id: 125
    kind: body
    source: |-
      One main function of *tarka* is said to be the elimination of doubt. Suppose one has the doubt “Is *x* *F*?”. One might then judge “if *x* is not *F* then *x* is not *G*”, and if one also knows that *x* is *G*, it will follow that *x* is *F*. The Naiyāyikas recognise this function but deny nevertheless that *tarka* is a source of knowledge (*pramāṇa*). Their reason, it seems, is that there is a distinction between citing positive empirical evidence for a thesis and merely eliminating the contrary possibility by a priori methods. This is reflected, perhaps, in the fact that no example is cited in arguments based on *tarka* to buttress the inference. *The Manual of Reason*, it seems, goes even further and denies that the counterfactual conditional is a true cognition, which implies, since they are not false either, that counterfactual conditionals do not have a truth-value.
    step1: |-
      据说 *tarka* 的一个主要功能是消除疑。设有人有疑“*x* 是 *F* 吗？”。此人随后可以判断“如果 *x* 不是 *F*，那么 *x* 不是 *G*”；如果他还知道 *x* 是 *G*，那么将推出 *x* 是 *F*。正理论者承认这一功能，但仍然否认 *tarka* 是一个知识来源（*pramāṇa*）。他们的理由似乎是：为一个论题举出正面的经验证据，与仅用先验方法排除相反的可能性，二者之间有区别。这一点或许也反映在如下事实中：基于 *tarka* 的论证不举例子来支持推断。《理性手册》看来走得更远，否认反事实条件句是一个真认知；既然反事实条件句也不假，这就意味着它们没有真值。
    step2: |-
      *tarka* 之主要功能，据称在除疑。设吾有疑“*x* 是 *F* 乎？”，则可判曰“若 *x* 非 *F*，则 *x* 非 *G*”；若又知 *x* 为 *G*，则可推得 *x* 为 *F*。正理论者承认此功能，却仍不认 *tarka* 为一认知凭据（*pramāṇa*）。其理由似在：为论题举正面经验证据，与仅凭先验方法排除反面可能，二者有别。此事或亦见于下情：基于 *tarka* 之论证从不举例以佐其推断。《理性手册》似更进一步，否认反事实条件句为真认知；而反事实条件句既亦非假，便意味着它们没有真值。
  - id: 126
    kind: body
    source: |-
      Udayana claims that *tarka* is of five types, namely ‘self-dependence’ (*ātmāśraya*), ‘mutual dependence’ (*anyonyāśraya*), ‘circle’ (*cakraka*), ‘infinite regress’ (*anavasthā*), and ‘having an undesirable consequence’ or reductio-ad-absurdum (*aniṣṭāprasaṅga*). These are basically self-explanatory – the fifth, ‘*prasaṅga*’ is the one used to great effect by Nāgārjuna and other Mādhyamika Buddhists. Other authors give slightly different lists (see S. Bagchi 1953 for details)[^bagchi-1953].
    step1: |-
      优陀耶那主张 *tarka* 有五种：“自依”（*ātmāśraya*）、“互依”（*anyonyāśraya*）、“循环”（*cakraka*）、“无穷倒退”（*anavasthā*）与“有不欲之后果”或归谬（*aniṣṭāprasaṅga*）。这些基本无需解释——第五种“*prasaṅga*”是龙树及其他中观佛教徒运用得卓有成效的一种。其他作者所列略有不同（详见 S. Bagchi 1953）[^bagchi-1953]。
    step2: |-
      优陀耶那谓 *tarka* 有五种：自依（*ātmāśraya*）、互依（*anyonyāśraya*）、循环（*cakraka*）、无穷倒退（*anavasthā*）、有不欲之后果（*aniṣṭāprasaṅga*），即归谬。此五者大意自明——其五“*prasaṅga*”一式，龙树与诸中观论师用之最见功效。他家所列略异（详见 S. Bagchi 1953）[^bagchi-1953]。
