      ### 1.2 What is the Vaiśeṣika System of Categories?
    step1: |-
      ### 1.2 胜论的句义体系是什么？
    step2: |-
      ### 1.2 何为胜论的句义体系？
  - id: 8
    kind: body
    source: |-
      The Vaiśeṣika system of ‘categories’ (*padārtha*) is an attempt to classify in a systematic way all the different types of existent. Navya-Nyāya lists seven ‘categories’ of object: substance (*dravya*), quality (*guṇa*), motion or action (*karma*), universal (*sāmānya*), particularity or differentiator (*viśeṣa*), inherence (*samavāya*), and absence (*abhāva*). Of these, the first six comprise the classical list of categories, found even in the *Vaiśeṣika-sūtra*, while the seventh (absence) is a distinctive addition by the later school. Most of these types are themselves subject to sub-division: thus, there are nine types of substance, twenty four types of quality, etc.
    step1: |-
      胜论的“句义”（*padārtha*）体系试图以系统的方式对一切存在者的不同类型进行分类。新正理列出七种对象“句义”：实体（*dravya*）、性质（*guṇa*）、运动或动作（*karma*）、普遍（*sāmānya*）、特殊或别异者（*viśeṣa*）、和合（*samavāya*）与非存在（*abhāva*）。其中前六项构成古典句义清单，甚至见于《胜论经》，而第七项（非存在）是后期学派的独特增益。这些类型大多自身还可再分：例如实体有九种，性质有二十四种，等等。
    step2: |-
      胜论的“句义”（*padārtha*）体系，是要以系统方式为一切存在者的各种类型分类。新正理列出七种对象“句义”：实体（*dravya*）、性质（*guṇa*）、运动（*karma*）、普遍（*sāmānya*）、别异（*viśeṣa*）、和合（*samavāya*）与非存在（*abhāva*）。前六项构成古典句义清单，早在《胜论经》即已具雏形；第七项（非存在）则是后期学派的独特增益。诸类型大多还可细分：实体九种，性质二十四种，诸如此类。
  - id: 9
    kind: body
    source: |-
      One main question concerning this list of categories is whether we can discern any underlying structure or organising principle. This is related with another important question: just what is a category? *The Manual of Reason* answers this second question by giving the etymological analysis of the term ‘*padārtha’* (category): ‘*padārtha’* is the *artha* or meaning of a *pada* or word. The claim is that the Vaiśeṣika categories are in some way the metaphysical correlates of linguistic structures. One way to make this claim more precise would be to note the existence of striking similarities between the Vaiśeṣika system and Sanskrit grammar (cf. esp. Faddegon 1918)[^faddegon-1918]. Another way is to observe a distinctive pattern of argument employed, in which the hypothesis that a certain type of substance, quality, etc. exists is supported on the ground that it explains some feature of our linguistic practice (for example, the argument that space exists as it explains our use of directional terms.)
    step1: |-
      关于这份句义清单，一个主要问题是：我们能否从中辨析出某种深层结构或组织原则。这与另一个重要问题相关：句义究竟是什么？《理性手册》通过词源分析来回答第二个问题：“*padārtha*”（句义）即“*pada*”（词）的“*artha*”（义）。这一主张是说，胜论句义在某种意义上是语言结构的形而上学对应物。使这一主张更精确的一条途径，是指出胜论体系与梵语语法之间存在惊人的相似（尤其参见 Faddegon 1918）[^faddegon-1918]。另一条途径是观察一种独特的论证模式：某类实体、性质等存在的假说，其理由在于它解释了我们语言实践的某种特征（例如，空间存在的论证：因为它解释了我们对方位词的使用）。
    step2: |-
      关于这份句义清单，一大问题是：清单背后是否有一条深层结构或组织原则可循。这与另一重要问题相关：句义究竟为何物？《理性手册》以词源分析回答后一问题：“*padārtha*”（句义）一词，即“*pada*”（词）之“*artha*”（义）。其主张是：胜论句义在某种意义上乃是语言结构的形而上学对应物。要使这一主张更精确，一条途径是指明胜论体系与梵语语法之间存在惊人相似（尤其参见 Faddegon 1918）[^faddegon-1918]；另一途径是观察一种独特的论证样式——某类实体、性质等存在的假说，其支持理由是它解释了我们语言实践的某种特征（例如：空间存在，因为它解释了我们对方位词的使用）。
