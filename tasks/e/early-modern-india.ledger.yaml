      *The Manual of Reason* (TS 48) reports the standard Nyāya view, which is due to Uddyotakara, that there are exactly six types of sense-object relation which ground perceptual experiences:
    step1: |-
      《理性手册》（TS 48）报告了标准的正理观点——出自乌底耶多迦罗——恰有六种感官—对象关系为知觉经验奠基：
    step2: |-
      《理性手册》（TS 48）载正理标准之说（出自乌底耶多迦罗）：为知觉经验奠基之感官—对象关系，恰有六种：
  - id: 156
    kind: body
    source: |-
      1. Contact or conjunction (*saṃyoga*). Ordinary perceptions, e.g. of a pot. If by ‘contact’ we understand some sort of causal relation, then the Nyāya can be said to have a causal theory of perception. However, they may mean that the eye is in contact with the object in some more literal sense.
      2. Inherence-in-the-conjoined (*saṃyukta-samavāya*). We noted above that, in ‘non-qualificative’ perception, one sees the object and its feature together. The relation between the feature and the perceiver is an indirect one—the feature inheres in the object, with which the perceiver is in contact.
      3. Inherence-in-the-inherent-in-the-conjoined (*saṃyukta-samaveta-samavāya*). If the feature in (2) is a quality (*guṇa*), e.g. a particular shade of blue, then inhering in it is a universal, blueness, which can itself apparently be perceived.
      4. Inherence (*samavāya*). The Nyāya-Vaiśeṣikas have a rather strange doctrine, that each sense-faculty is made out of the type of substance with which it is particularly associated. The auditory faculty is thus made out of *ākāśa*, and, as sounds inhere in *ākāśa*, the relation between the hearer and the sound is inherence.
      5. Inherence-in-the-inherent (*samaveta-samavāya*). By this indirect relation, the hearer is related to properties such as sound-hood inhering in sound.
      6. Qualifier-qualificand relation (*viśeṣaṇa-viśeṣya-bhāva*). This is an important one. The Nyāya believe that absences are ‘real’ objects, e.g. the absence of an elephant in the room now, and that they can be perceived. Absences are said to qualify their substrata, and are perceived indirectly, by the perceiver seeing the substratum. The Buddhist Dharmakīrti argued that this is really an inference from non-apprehension (*anupalabdhi-hetu*) running thus: “I perceive the walls of the room; if there were an elephant, I would not see it, and my perceptual faculties are working normally; therefore, there is no elephant”.
    step1: |-
      1. 接触或连合（*saṃyoga*）。通常的知觉，例如对一只壶的知觉。如果我们把“接触”理解为某种因果关系，那么可以说正理派有一个因果的知觉理论。但他们也可能意指眼睛在更字面的意义上与对象接触。
      2. 连合者中的和合（*saṃyukta-samavāya*）。上文指出，在“无分别”知觉中，人同时看见对象及其特征。特征与知觉者之间的关系是间接的——特征内居于对象，而知觉者与对象相接触。
      3. 连合者中内居者中的和合（*saṃyukta-samaveta-samavāya*）。如果（2）中的特征是一种性质（*guṇa*），例如一种特定的蓝色调，那么内居于其中的是一个普遍——蓝性——它自身显然也可以被知觉。
      4. 和合（*samavāya*）。正理—胜论派有一个相当奇怪的学说：每种感官官能都由与之特别相关联的那类实体构成。听觉官能由虚空构成，而声内居于虚空，所以听者与声之间的关系是和合。
      5. 内居者中的和合（*samaveta-samavāya*）。借这一间接关系，听者关联于诸如内居于声中的“声性”之类的性质。
      6. 能别—所别关系（*viśeṣaṇa-viśeṣya-bhāva*）。这是重要的一种。正理派相信非存在是“实在”的对象——例如现在房间里没有大象这一非存在——并且它们可以被知觉。据说非存在限定其基底，并且通过知觉者看见基底而被间接知觉。佛教徒法称论证说这实际上是出于未觉（*anupalabdhi-hetu*）的推断：“我知觉到房间的墙壁；如果有大象，我不会看不见它，而我的知觉官能运作正常；因此没有大象。”
