      ### 2.1 五种主要的大种
  - id: 41
    kind: body
    source: |-
      Vaiśeṣika distinguishes, among nine acknowledged types of substance, a sub-class of five—earth, water, fire, air and *ākāśa*—to which it gives the name “*bhūta*” (‘physical substance’). A *bhūta* is defined as a substance which possesses a specific sensible quality—odour, taste, colour, touch and sound.
    step1: |-
      胜论在公认的九种实体中，划出一个五类子集——地、水、火、风与虚空——称之为“大种”（*bhūta*，即“物理实体”）。大种被定义为具有一种特定可感性质的实体——气味、味、颜色、触与声。
    step2: |-
      胜论在公认的九种实体之中，划出一个五类子集——地、水、火、风与虚空——并称之为“大种”（*bhūta*，即“物理实体”）。大种的定义是：具有某种特定可感性质的实体，这些性质即气味、味、颜色、触与声。
  - id: 42
    kind: body
    source: |-
      It was, perhaps, originally thought that the five physical substances and the five sensible qualities are directly correlated, each quality residing in one and only one substance, odour just in earth, taste just in water etc. (such a view is reported by Vātsyāyana under NS 3.1.65–6). This may give some insight into the origins of the ‘five physical substances’ theory, but it was realised very early on that it is extremely implausible to maintain that earth, for example, is invisible, or else that its colour is always due to intermixture with fire (Bhaduri 1947: 133)[^bhaduri-1947]. The set of correlations between physical substances and sensible qualities is more complex in the *Vaiśeṣika-sūtras* and later texts, and is indicated in the following chart:
    step1: |-
      人们或许最初以为五种物理实体与五种可感性质直接对应，每种性质只居于一种实体之中：气味只在土地，味只在水中，等等（《逻辑经疏》在 NS 3.1.65–6 之下记载了这种观点）。这或许能让“五大种”理论的起源露出一些线索，但人们很早就意识到，坚持“土地不可见”或“其颜色总归因于与火的混合”之类说法是极不可信的（Bhaduri 1947: 133）[^bhaduri-1947]。在《胜论经》与晚期文本中，物理实体与可感性质之间的对应更为复杂，如下表所示：
    step2: |-
      或许在最初，人们以为五种大种与五种可感性质一一对应：每种性质只寓居在唯一一种实体里，气味只在土，味只在水，如此等等（《逻辑经疏》在 NS 3.1.65–6 下记载了这种看法）。这也许能多少透露“五大种”理论的来历，可是人们很快就发现，硬说土不可见、或说土的颜色总是混入火的产物，实在站不住脚（Bhaduri 1947: 133）[^bhaduri-1947]。在《胜论经》及后来的文本里，大种与可感性质之间的对应关系要复杂得多，见下表：
