      This argument establishes that there are objects too small to be seen, but it does not demonstrate that some of them are non-composite. Why cannot the process of sub-division be continued ad infinitum? *The Manual of Reason*’s intriguing answer is that if such were the case then Mount Meru and a mustard seed would have the same size, as each would have the same (infinite) number of constituent parts! An implicit premise here (articulated by other Vaiśeṣikas) is that the size of a whole is a function of the size, number and spatial arrangement of its parts.
