      照这一提议，数属性是通过“完成”这个多对一关系与若干对象联合关联的。我觉得，稍作简化也无损其基本结构。拿“火星是一颗行星”来说，旧说法是“行星性”借和合关系寓于火星；我们不妨改说谓词“……是一颗行星”对火星为真，等于把和合关系（或系词）做进了谓词里。同样道理，也可以把完成关系做进数谓词；这样一来，若数是 *n*，该谓词便是一个 *n* 元关系。“金星与火星是两个”于是断言：金星与火星之间成立某种二元关系，这个关系就是数 2。新正理的主张因而是：数形容词是 *n* 元关系谓词，数是 *n* 个不同对象联合承负的 *n* 元关系。既然“关系 2 成立于金星与火星之间”，就绝推不出它单独成立于金星；这正像从“*X* 在 *Y* 左边”推不出“*X* 在左边”便算了事。按新正理的方案，那个捣乱的推论被堵住了——它的结论压根不合式：“金星是二”和“*X* 在左边”一样，都是不完整、未饱和的表达式。
