      Perhaps the most straightforward way to argue that pornography is morally objectionable (in a way that erotic art is not) is to argue that it is harmful. The harm that pornography does may occur in the production phase, and take the form of coercion, brutality, violence, or rape. But even if no harm takes place in the making of pornography, and models are treated fairly and with respect, there can still be post-production harms. Some have argued that the pornographic materials themselves *constitute* harm because, as a form of hate speech, they silence and subordinate women (MacKinnon 1987; Langton 1993, 2009; Maitra 2009)[^langton-1993][^mackinnon-1987][^maitra-2009]. Others have emphasized that exposure to pornographic material may *cause* harm (Eaton 2007)[^eaton-2007]. The latter claim is further refined by specifying the frequency of exposure (isolated/cumulative), the nature of the material (egalitarian/inegalitarian), the kind of harm inflicted (physical/psychological), and whom it is mainly inflicted on (consumer/third party). By systematically eroticizing aspects of gender inequality, inegalitarian pornography is mainly thought to cause harm to a third party, in particular women, through the pernicious effect it has on its consumers (Eaton 2007)[^eaton-2007].
    step1: |-
      论证色情在道德上可反对（而情色艺术不然）的最直接方式，也许就是论证它有害。色情造成的伤害可能发生在制作阶段，表现为胁迫、残暴、暴力或强奸。但即便色情制作中并未发生伤害、模特得到公平而有尊严的对待，制作之后仍可能存在伤害。有人论证说，色情材料本身*constitute*（构成）伤害，因为作为仇恨言论的一种形式，它们使女性噤声并使其处于从属地位（MacKinnon 1987; Langton 1993, 2009; Maitra 2009）[^langton-1993][^mackinnon-1987][^maitra-2009]。另一些人强调，接触色情材料可能*cause*（造成）伤害（Eaton 2007）[^eaton-2007]。后一主张进一步细化，具体区分接触的频率（孤立/累积）、材料的性质（平等主义/不平等主义）、所造成伤害的类型（身体/心理），以及主要受害者（消费者/第三方）。通过系统地使性别不平等的各方面情色化，不平等主义的色情被认为主要通过其对消费者的有害影响，对第三方——尤其是女性——造成伤害（Eaton 2007）[^eaton-2007]。
    step2: |-
