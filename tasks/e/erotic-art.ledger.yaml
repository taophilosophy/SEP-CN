      This way of drawing the line is significantly problematized by the emergence of feminist pornography. Examples are films like *Skin.Like.Sun* (2010, dir. Jennifer Lyon Bell and Murielle Scherre) and *When We Are Together, We Can Be Everywhere* (2015, dir. Marit Östberg), Molly Kiely’s graphic novel *That Kind of Girl* (1999), or *Dirty Diaries*, a collection of Swedish movie shorts (2009). Mutual pleasure and consent are absolutely key in these pornographic works which seem to exhibit none of the moral flaws manifest in mainstream pornography (no exploitation, objectification, or eroticization of gender inequality). What is more, in rejecting sexual repression, self-oppression, and hypocrisy, these works are often said to have a positive, consciousness-raising force (Willis 1995; Taormino et al. 2013; Maes 2017; 2020; Eaton 2017)[^eaton-2017][^maes-2017][^taormino-2013][^willis-1995].
