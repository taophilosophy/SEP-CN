      In closing, it is worth mentioning a thesis recently put forward by Eaton (2018), based on art historical considerations regarding the function of erotic images in 16th-century Italy. Eaton argues that the root of the erotic art/pornography distinction was—at least in that particular context—class. The need for a special category of unsanctioned illicit images arose at the very time when print culture was beginning to threaten elite privilege. What made an erotic representation exceed the boundaries of acceptability, Eaton suggests, was not its extreme libidinosity but, rather, its widespread availability and, thereby, its threat to one of the mechanisms of sustaining class privilege.
    step1: |-
      最后，值得提一提伊顿（Eaton，2018）新近提出的一个论点，它基于关于十六世纪意大利情色图像功能的艺术史考察。伊顿论证说，情色艺术/色情之区分的根源——至少在那个特定语境中——是阶级。对一类不受认可的非法图像的特殊需要，恰恰出现在印刷文化开始威胁精英特权之时。伊顿认为，使一种情色再现越出可接受边界的，不是其极度的淫荡，而是其广泛可得，因而对维系阶级特权的机制之一构成威胁。
    step2: |-
      最后，还得提一提伊顿（Eaton，2018）最近提出的一个论点，它依据的是关于十六世纪意大利情色图像功能的艺术史考察。伊顿认为，情色艺术与色情的区分，至少在那个具体语境中，根源在于阶级。对一类不受认可、不合法的图像的特殊需求，恰在印刷文化开始威胁精英特权之际出现。伊顿提示，使一种情色再现超出可接受范围的，并非其淫荡至极，而是它广为流传，从而威胁到维系阶级特权的机制之一。
