      Many more philosophical questions remain to be examined in relation to erotic art. The following will likely play an important role in future research on this topic. First, what exactly does it mean for a representation to be voyeuristic and what, if anything, is the difference between voyeurism in artistic and non-artistic representations? The question was already raised in John Berger’s classic *Ways of Seeing* (1972) and has since then been addressed in Schellekens 2012 and Eaton 2012. The latter also offers a philosophical re-interpretation of the influential but strongly psychoanalytically informed concept of the “male gaze” (Mulvey 1989)[^mulvey-1989]. To say that a work embodies the male gaze, Eaton submits, is simply to say that it prescribes that its audience perceives the woman represented as primarily a sex object. As such, the tradition of the female nude in Western art promotes sexually objectifying, heteronormative erotic taste, and thereby has insidious effects on gender equality. Following on from this, Lavallee (2016) argues that Eaton’s thesis is mainly based on the experiences of white women and does not pay adequate attention to the lives of nonwhite women. This act of exclusion exposes a more general bias in discussions of female representations in art. Different kinds of bodies have been subjected to different kinds of objectifying construal. Lavallee therefore suggests that the ethics of nudity in art must be extended to take such variation into account (see also Taylor 2016, especially chapter 4)[^taylor-2016].
    step1: |-
      围绕情色艺术，还有许多哲学问题有待考察。以下问题很可能在未来研究中扮演重要角色。第一，一种再现是窥视性的，究竟是什么意思？艺术性与非艺术性再现中的窥视，若有区别，区别何在？约翰·伯格（John Berger）的经典《观看之道》（*Ways of Seeing*，1972）已提出此问，此后 Schellekens 2012 与 Eaton 2012 又加以讨论。后者还对“男性凝视”这一影响巨大但深受精神分析浸染的概念作了哲学重释（Mulvey 1989）[^mulvey-1989]。伊顿提出，说一件作品体现男性凝视，无非是说它规定其受众把所表现的女性主要感知为性对象。就此而言，西方艺术中的女性裸体传统助长了一种性对象化的、异性恋规范的情色趣味，从而对性别平等产生隐蔽的害处。顺着这一点，拉瓦莱（Lavallee，2016）论证说，伊顿的论点主要基于白人女性的经验，未能充分关注非白人女性的生活。这种排除暴露出艺术中女性再现讨论里一种更普遍的偏颇：不同种类的身体遭受了不同种类的对象化建构。因此拉瓦莱建议，艺术中裸体的伦理学必须扩展，以顾及这种差异（另见 Taylor 2016，尤其是第四章）[^taylor-2016]。
    step2: |-
