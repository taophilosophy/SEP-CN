      这一定义已经更接近要害。尽管从词源上看，韦布对情感的强调可以理解——“情色的”一词源自希腊语“eros”，意为爱或激情——但他并没有成功地说出情色艺术的必要或充分条件。曼·雷（Man Ray）的摄影作品*The Prayer*（《祈祷》，1930）只呈现一位女子的双手、双足与臀部；严格说来这不是性描绘，也没有情感的表现。然而它被广泛视为情色杰作。反过来，伊恩·麦克尤恩（Ian McEwan）的中篇小说*On Chesil Beach*（《在切瑟尔海滩上》）以二十世纪六十年代初为背景，讲述一个彻底失败的洞房之夜，它确实算得上“以性为主题、并且具体关联于情感的艺术”，但把它标为情色文学却会误导人。
