      (2) *Formal and structural simplicity?* Pornography of the enlightenment era also serves to tackle another misconception. It has been argued that, because the main aim of pornographers is to sexually arouse the audience, they are forced to include as many sexually explicit scenes as possible, leaving precious little room for plot development or formal intricacies (Steiner 1975)[^steiner-1975]. The pornographer “concocts no better than a crude excuse for a beginning; and once having begun, it goes on and on and ends nowhere” (Sontag 1994: 39)[^sontag-1994]. Pornography, as Adorno already noted, lacks the beginning-middle-end form characteristic of literature (Sontag 1994: 39)[^sontag-1994]. Yet, again, this gives us far from a waterproof criterion for distinguishing erotic literature from pornography. For instance, the structural complexity of the pornographic novel, *Histoire de Dom B… Portier des Chartreux* (1741), with its embedded stories and variety of narrators, has often been noted by scholars (Frappier-Mazur 1996: 211)[^frappier-mazur-1996]. The careful composition of *Thérèse*, where the author has arranged the parts to maximize the refraction, so that wherever the reader turns he seems to see throbbing sexuality, provides another counterexample (Darnton 1995)[^darnton-1995].
    step1: |-
      (2) *Formal and structural simplicity?*（形式与结构简单？）启蒙时代的色情还用来破除另一个误解。有人论证说，由于色情作者的旨在于性唤起受众，他们被迫塞进尽可能多的露骨性场面，留给情节发展或形式精巧的空间少得可怜（Steiner 1975）[^steiner-1975]。色情作者“所编造的开头，不过是个粗劣的借口；而一旦开了头，它就没完没了地继续下去，最后不知终结于何处”（Sontag 1994: 39）[^sontag-1994]。正如阿多诺早已指出，色情缺少文学那种“开头—中段—结尾”的形式（Sontag 1994: 39）[^sontag-1994]。然而，这远不足以成为区分情色文学与色情的可靠标准。例如，学者们常常提到色情小说《沙特勒兹修道院守门人多姆·B 的故事》（*Histoire de Dom B… Portier des Chartreux*，1741）的结构复杂性：它嵌套着故事，叙述者也多种多样（Frappier-Mazur 1996: 211）[^frappier-mazur-1996]。《哲学家泰蕾兹》的精心布局提供了另一个反例：作者安排各部分以最大化折射效果，使读者无论转向何处，似乎都看见搏动的性（Darnton 1995）[^darnton-1995]。
