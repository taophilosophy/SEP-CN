      A normative definition of this kind will bring to mind certain legal descriptions of obscenity such as the U.S. Supreme Court’s notorious Miller test, set forth in *Miller v. California* (1973). This test proposed a three-pronged criterion for obscenity: *x* is obscene if (1) it is found appealing to the prurient interest by an average person applying contemporary community standards, (2) it depicts sexual conduct, specifically defined by the applicable state law, in a patently offensive way and (3) taken as a whole, it lacks serious literary, artistic, political or scientific value. The Miller test has proved problematic in many respects, one of its most evident flaws being the conflation of two ideas—the pornographic and the obscene (Nussbaum 2004)[^nussbaum-2004]. Recent philosophical attempts to define the obscene have avoided this mistake—allowing for non-pornographic obscenities and obscene erotic art (e.g., Kieran 2002)[^kieran-2002].
    step1: |-
      此类规范性定义会让人想到某些关于淫秽的法律描述，例如美国最高法院在*Miller v. California*（《米勒诉加利福尼亚州》，1973）中提出的臭名昭著的米勒标准。该标准为淫秽提出三项判准：*x*（某物）是淫秽的，若（1）按当代社区标准适用的普通人会认为它投合淫欲；（2）它以明显冒犯的方式描绘由适用州法具体界定的性行为；（3）整体看来，它缺乏严肃的文学、艺术、政治或科学价值。米勒标准在许多方面被证明问题重重，其最明显的缺陷之一是把两个观念——色情的与淫秽的——混为一谈（Nussbaum 2004）[^nussbaum-2004]。晚近为淫秽下定义的哲学尝试避开了这一错误，允许存在非色情的淫秽以及淫秽的情色艺术（如 Kieran 2002）[^kieran-2002]。
