      (1) *A simple purpose?* It is tempting to think of pornography as having only one, very rudimentary purpose: sexual arousal of the audience. But a look at very early pornographic works, those that were produced in France and England between 1500 and 1800, shows how misleading that conception is. Almost all pornographic works of that era deliberately used the shock of sex to criticize religious and political authorities (Hunt 1996: 35)[^hunt-1996]. With their truth-telling trope they were meant to function as a powerful antidote to the many forms of repression in society and often had the explicit aim to educate people about politics, religion, society, and of course, sex (Lubey 2022)[^lubey-2022]. It is not a coincidence that these books were known in 18th century France as “livres philosophiques” (they were considered just as dangerous to society as philosophical treatises) and that the rise in pornography around 1740 coincided with the hey-day of the Enlightenment (Hunt 1996; Darnton 1995)[^darnton-1995][^hunt-1996]. Quite a few of the pornographic novels of that time even carried the term “philosophy” in the title (think of Sade’s *La Philosophie dans le Boudoir*, 1795) and some of them were actually written by prominent philosophers who were keen to use this extremely popular genre to divulge some of their ideas to the masses (think of Diderot’s *Les Bijoux Indiscrets*, 1748).
    step1: |-
      (1) *A simple purpose?*（目的单一？）人们很容易把色情想成只有一项极为基本的目的：唤起受众的性欲。但只要看一看很早的色情作品——1500 至 1800 年间在法国与英国生产的那些——就会发现这种想法多么误导。那个时代几乎所有色情作品都刻意用性的震撼来批评宗教与政治权威（Hunt 1996: 35）[^hunt-1996]。凭借其“讲真话”的修辞，它们意在充当对抗社会种种压抑的有力解药，并且常常明确以教育人们政治、宗教、社会以及当然还有性为目标（Lubey 2022）[^lubey-2022]。这些书在十八世纪的法国被称为“livres philosophiques”（哲学书），并非偶然（它们被认为与哲学论著一样对社会危险）；而 1740 年前后色情的兴起恰与启蒙运动的鼎盛同时（Hunt 1996; Darnton 1995）[^darnton-1995][^hunt-1996]。当时不少色情小说甚至在书名里带有“哲学”一词（想想萨德的*La Philosophie dans le Boudoir*（《闺房哲学》，1795）），其中一些确实出自知名哲学家之手，他们急于利用这一极受欢迎的体裁向大众透露自己的一些想法（想想狄德罗的*Les Bijoux Indiscrets*（《泄露真情的首饰》，1748））。
