      The counterpart of sexually stimulating art is *failed erotic art* (or as Levinson 2006 would have it “nominally erotic art”)[^levinson-2006]: art that aims but does not succeed in stimulating its target audience sexually (see also Mag Uidhir 2010)[^mag-2010]. *Anti-erotic art*, on the other hand, is art that aims to induce *negative* sexual feelings, thoughts, and imaginings in its target audience. Otto Dix’s *Old Couple* (1923) or George Grosz’s *Sex Murder in the Ackerstrasse* (1916–7) could serve as illustrations. More recently, feminist artists such as Kiki Smith have explored the dark, violent, abject aspects of sexuality in their work (see, for instance, Smith’s *Tale*, 1992, and *Blood Pool*, 1992).
