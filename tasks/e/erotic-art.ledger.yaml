      “Exploitation” and “objectification” are terms that are used particularly often to describe what is wrong with pornography. Martha Nussbaum (1995), for instance, has written a seminal essay on different forms of objectification and how they apply to pornography (see also Stock 2015)[^stock-2015]. Artists like Nancy Spero have defined pornography as “stuff that exploits women’s bodies” (quoted in Cembalest 1989: 142)[^cembalest-1989]. It might be thought, and indeed Spero and others have argued, that these ethical terms may serve to demarcate (erotic) art from pornography—pornography being exploitative or objectifying in a way that (erotic) art is not.
