      (4) *Simple to interpret?* While questions of interpretation arise frequently in relation to works of erotic art, people rarely seem to have interpretive qualms where pornography is concerned. Indeed, if an interpretation typically attempts to account for those elements in a work whose presence is not immediately obvious to the target audience (Carroll 2009)[^carroll-2009], there may seem no need for an interpretation in the case of pornography since it is all too obvious why such films or novels include one sexually explicit scene after another. Still, here too it is important not to jump to conclusions. There are (at least) two different kinds of interpretative projects one could engage in, each with its own set of lead questions. “What is the work about?” is one question one could ask. Another question is “What does the work reveal about the author or the time, place, culture, society in which it was made?” While the former is central to the discipline of art criticism, the latter question will usually be the starting point of interpretations offered by cultural historians, sociologists, psychoanalysts. These latter interpretations, where pornography is concerned, will be everything but simple given the incredible complexity of the pornographic landscape with its huge catalogue of taboos, body types, sex acts, and other things that get people’s blood flowing. Pornography offers us, in the words of Laura Kipnis, “the royal road to the cultural psyche” (2006: 118) and as such can prove to be a gold mine for interpretations. The other question—What is the work about?—seems less pertinent, especially in relation to the formulaic and repetitive video clips one finds on porn websites. Nevertheless, there are other types of pornography where issues about meaning and “aboutness” do seem highly relevant, such as the philosophical pornography mentioned above and the feminist pornography that will be discussed in the next section.
    step1: |-
      (4) *Simple to interpret?*（解释简单？）尽管在情色艺术作品中解释问题频繁出现，人们在色情那里却似乎很少有为解释犯难的时候。的确，如果一种解释通常旨在说明作品中那些对目标受众而言并非一目了然的成分（Carroll 2009）[^carroll-2009]，那么在色情那里似乎就不需要解释，因为这些影片或小说为何一个接一个地塞入露骨性场面，实在太过明显。不过，这里同样不可遽下结论。人至少可以从事两类不同的解释工程，各有其主导问题。“这部作品讲的是什么？”是可以问的一个问题。另一个问题是：“这部作品揭示了它的作者、或它的时代、地方、文化、社会的什么？”前者是艺术批评学科的中心，后者通常是文化史家、社会学家、精神分析师所提供的解释的起点。就色情而言，后一类解释绝不简单，因为色情景观极为复杂：其禁忌、体型、性行为以及其他让人血脉偾张之物的目录庞大无比。用劳拉·基普尼斯（Laura Kipnis）的话说，色情为我们提供了“通往文化心灵的康庄大道”（2006: 118），因而可能是解释的富矿。另一个问题——作品讲的是什么？——似乎不那么切题，尤其就色情网站上那些公式化、重复性的视频片段而言。不过，也有其他类型的色情，其中关于意义与“所讲”的问题似乎高度相关，例如前述哲学色情，以及下一节将讨论的女性主义色情。
    step2: |-
      (4) *Simple to interpret?*（解释起来简单？）情色艺术作品常常引出解释问题，色情却似乎很少让人在解释上犯难。诚然，解释通常是要说明作品中那些对目标受众并非一目了然的成分（Carroll 2009）[^carroll-2009]，而色情似乎无须解释：这类影片或小说为何一幕接一幕地塞进露骨性场面，实在再明显不过。然而，此处也不可急着下结论。解释至少可以有两类，各自带着自己的主导问题。一类问：“这部作品讲的是什么？”另一类问：“这部作品透露了作者、透露了它诞生其中的时代、地方、文化与社会什么？”前者是艺术批评的本行，后者往往是文化史家、社会学家、精神分析学家所作解释的起点。就色情而言，后一类解释绝不简单，因为色情的地形极为复杂：禁忌、体型、性行为，以及其他种种让人血脉贲张之物，目录庞大得惊人。用劳拉·基普尼斯（Laura Kipnis）的话说，色情是“通往文化心灵的康庄大道”（2006: 118），因而可能是解释的富矿。前一类问题——“作品讲的是什么？”——似乎就不那么切题，尤其面对色情网站上那些公式化、反复雷同的视频片段。不过，另有些色情作品，其意义与“所讲”问题倒高度相关，例如上文提到的哲学色情，以及下一节要讨论的女性主义色情。
