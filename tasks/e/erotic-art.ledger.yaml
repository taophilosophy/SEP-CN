      To conclude, it does not seem possible to make a clear-cut distinction between erotic art and pornography based on moral or feminist grounds. Critiques of pornography have focused on features that are shared by a much wider class of cultural products and by (some) works of erotic art in particular. This is not necessarily bad news for feminists. On the contrary, feminists could embrace this conclusion as it implies that their critiques are wider ranging than they at first appear to be (see Kania 2012; Mikkola (ed.) 2017; Mikkola 2019).
    step1: |-
      总之，似乎不可能基于道德或女性主义的理由在情色艺术与色情之间划出清晰界线。对色情的批评所针对的特征，为一个宽得多的文化产品类别、尤其为（某些）情色艺术作品所共有。这对女性主义者未必是坏消息。恰恰相反，女性主义者可以把这一结论拥为己有，因为它意味着她们的批评比初看时范围更广（见 Kania 2012; Mikkola (ed.) 2017; Mikkola 2019）。
    step2: |-
      总而言之，想凭道德或女性主义的理由在情色艺术与色情之间划一条清楚界线，看来是做不到的。批评色情时所针对的那些特征，为一类宽得多的文化产品所共有，尤其为（某些）情色艺术作品所共有。这对女性主义者未必是坏消息；恰恰相反，她们大可以接纳这一结论，因为它意味着她们的批评比乍看之下范围更广（见 Kania 2012; Mikkola (ed.) 2017; Mikkola 2019）。
