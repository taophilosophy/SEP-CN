      As opposed to key representatives of modern aesthetics, both Levinson and Scruton have no problem acknowledging the existence of erotic art. However, they do object very strongly to the possibility of there being pornographic art, and it’s not hard to discern in their respective objections—which rely on notions such as beauty, contemplation, ideal form, aesthetic experience—the remnants and residual influence of modern aesthetics. This is less obvious in Christy Mag Uidhir’s attempt to draw a line between pornography and art. While Scruton insists on the controversial connection between art and beauty, and Levinson builds his case on the idea that a work of art’s main purpose is to produce an aesthetic experience and draw attention to its own formal features, Mag Uidhir’s argument does not rely on any such substantial claims. He does not even claim that art has or should have a purpose. Mag Uidhir asks us only to accept that *if* a work of art has a purpose, including perhaps the purpose of sexual titillation as is the case in erotic art, then that purpose must be manner specific. Here’s how he arrives at his exclusivist position (2009: 194):
    step1: |-
      与现代美学的主要代表不同，莱文森与斯克鲁顿都乐于承认情色艺术的存在。然而他们极为强烈地反对色情艺术存在的可能性；从他们各自的反对中——这些反对依赖美、沉思、理想形式、审美经验等观念——不难辨认出现代美学的残余与余威。这一点在克里斯蒂·马格·乌伊迪尔试图在色情与艺术之间划线时就不那么明显了。斯克鲁顿坚持艺术与美之间有争议的关联，莱文森则以“艺术作品的主要目的在于产生审美经验并使人注意其自身形式特征”为立论基础，而马格·乌伊迪尔的论证不依赖任何此类实质主张。他甚至不主张艺术有或应当有目的。马格·乌伊迪尔只要求我们接受：*if*（如果）一件艺术作品有目的，包括情色艺术那种性挑逗的目的，那么这个目的必须是方式特定的。下面是他得出排他主义立场的方式（2009: 194）：
