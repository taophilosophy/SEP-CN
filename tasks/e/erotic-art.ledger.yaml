      Proponents of modern aesthetics could simply bite the bullet here and argue, as Mohan Matthen does, that erotic art tends not to be great art, or, following Bell, that erotic paintings, books, poems can only attain art status despite their erotic content. But that is a big bullet to bite, by any standard. Not only are there so many outstanding works of erotic art, but the eroticism of these works is also more often than not an integral part of their status and value as art. To be sure, there are nude paintings and sculptures which seem to qualify first and foremost as studies in formal beauty (certain sculptures of Henry Moore come to mind). But anyone who would regard, say, *The Naked Maja* by Goya (c. 1797–1800) or *Les Délassements d’Eros* by Gerda Wegener (1925) as a mere formal exercise would entirely misunderstand and fail to appreciate what these works are about. That is why the great majority of aestheticians today prefer the other horn of the dilemma. Instead of denying the existence of genuinely erotic art, they will deny that aesthetic and erotic responses are antithetical and hence reject the basic tenets of modern aesthetics.
