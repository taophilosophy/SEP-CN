      最后，如果情色再现与艺术作品有助于塑造我们观看和接触身体的方式，那么它们如何能被调动起来，去挑战（或维系）基于种族、性取向、年龄、体型与残障的压迫？奥德丽·洛德（Audre Lorde）的《情色之用》（“Uses of the Erotic”，1978）是一部奠基性文本。尽管戴维森（Davidson，2016）、卡希尔（Cahill，2016）、林托特与欧文（Lintott & Irvin，2016）、米科拉（Mikkola 编，2017）与索尼克罗夫特（Thorneycroft，2021）提供了一些晚近视角，这一方面仍有大量工作要做。
    step2: |-
      最后，如果情色再现与艺术作品参与塑造我们看待身体、与身体打交道的方式，那么怎样才能调动它们去挑战（或延续）基于种族、性取向、年龄、体型与残障的压迫？奥德丽·洛德（Audre Lorde）的《情色之用》（“Uses of the Erotic”，1978）是一篇奠基之作。戴维森（Davidson，2016）、卡希尔（Cahill，2016）、林托特与欧文（Lintott & Irvin，2016）、米科拉（Mikkola 编，2017）、索尼克罗夫特（Thorneycroft，2021）提供了一些近期视角，但这一方面仍有许多工作要做。
