      Mag Uidhir’s approach is markedly different from Scruton’s and Levinson’s. Still, regarding the central issue, he aligns himself squarely with other sceptics. He, too, thinks that artists or pornographers attempting to produce something that is both (erotic) art and pornography, in fact attempt the impossible. However, recent critics of Mag Uidhir have raised doubts about his second premise (Davies 2012; Patridge 2013)[^davies-2012][^patridge-2013], as well as the general validity of his argument (Maes 2012)[^maes-2012][^maes-2012-2]. These critics belong to a growing number of philosophers who find exclusivists’ arguments unconvincing and argue for the existence of pornographic art as a subclass of erotic art (Kieran 2001, van Brabandt and Prinz 2012, Fokt 2012)[^fokt-2012][^kieran-2001].
    step1: |-
      马格·乌伊迪尔的进路与斯克鲁顿、莱文森明显不同。但在核心问题上，他与别的怀疑者完全站在一起。他也认为，试图创作既是（情色）艺术又是色情之作的艺术家或色情作者，实际上是在尝试不可能之事。然而，晚近批评马格·乌伊迪尔的人对其第二个前提（Davies 2012; Patridge 2013）[^davies-2012][^patridge-2013]以及其论证的普遍有效性（Maes 2012）[^maes-2012][^maes-2012-2]提出了疑问。这些批评者属于一个日益壮大的哲学家群体：他们觉得排他主义者的论证不能服人，并主张色情艺术作为情色艺术的一个子类而存在（Kieran 2001, van Brabandt and Prinz 2012, Fokt 2012）[^fokt-2012][^kieran-2001]。
