      The essentials of Epictetus’s thought derive from the early or foundational period of Stoicism, from the third-century writings of Zeno of Citium, Cleanthes, and Chrysippus. Treatises he mentions by title include Chrysippus’ *On Choice, On Impulse*, and *On the Possibles*, and he also mentions reading in works by Zeno, Cleanthes, and the second-century Stoics Antipater and Archedemus. Extant reports and fragments of these and other Stoic works are congruent at many points with what we find in him.
    step1: |-
      爱比克泰德思想的要旨源自斯多葛主义的早期或奠基时期，即源自基提翁的芝诺（Zeno of Citium）、克勒安忒斯（Cleanthes）与克律西波斯（Chrysippus）的公元前三世纪著作。他提到标题的论著有克律西波斯的《论选择》（*On Choice*）、《论冲动》（*On Impulse*）与《论可能者》（*On the Possibles*），他还提到阅读过芝诺、克勒安忒斯以及公元前二世纪斯多葛派安提帕特（Antipater）与阿尔克德穆斯（Archedemus）的著作。这些以及其他斯多葛著作的现存报道与残篇，在许多点上与我们在他那里所见的相一致。
    step2: |-
