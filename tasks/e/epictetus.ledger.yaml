      正是意愿，才是个体真正的人、真实的自我。我们的信念、态度、意向与行动，都以别的东西所不具备的方式真正属于我们；它们完全由我们对印象的运用所决定，因而内在于意愿的领域。一个人身体的外貌与安逸、他的财产、他与他人之间的关系、他事业的成败、他在世上的权势与名望，都只是关于这个人的偶然事实，属于我们经验的特征，而非自我的特征。这些全都是“外在物”；也就是说，是意愿领域之外的东西。
