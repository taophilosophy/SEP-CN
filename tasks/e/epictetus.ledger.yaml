      It may still be the case that he accepts influence from other currents in philosophy, or that he develops some ideas on his own. The clearest instance of such influence concerns Plato, for Epictetus draws much inspiration from the Socrates depicted in Plato’s shorter dialogues. Comparisons can be drawn especially to the Socrates of Plato’s *Gorgias*, with his fondness for argumentative give and take, his willingness to challenge the hearer’s presuppositions, and his optimism about what can be achieved through values clarification. The *Theaetetus* may also have been influential on Epictetus’s thinking about contemplation and the relation of human to divine; see Bénatouïl 2013. Epictetus also knows the Master Argument from Megarian philosophy (3ʳᵈ c. BCE) and even names Diodorus and Panthoides, although this knowledge might easily have been drawn from Stoic treatises on logic (2.19.1–11; see further Barnes 1997 ch. 3 and Crivelli in Scaltsas and Mason 2007)[^barnes-1997][^scaltsas-2007].
    step1: |-
      他仍有可能接受哲学其他流派的影响，或者自行发展某些观念。此类影响最清楚的实例涉及柏拉图，因为爱比克泰德从柏拉图较短的对话所刻画的苏格拉底那里汲取了大量灵感。尤其可以与柏拉图《高尔吉亚》（*Gorgias*）中的苏格拉底相比较：他喜爱辩论性的你来我往，愿意挑战听者的预设，并且对通过价值澄清所能达到的东西抱持乐观。《泰阿泰德》（*Theaetetus*）也可能对爱比克泰德关于沉思以及人与神之关系的思考产生影响；见 Bénatouïl 2013。爱比克泰德还知道麦加拉哲学的“主论证”（Master Argument，公元前 3 世纪），甚至提到狄奥多鲁斯（Diodorus）与潘托伊德斯（Panthoides），尽管这一知识很可能来自斯多葛派的逻辑论著（2.19.1–11；另见 Barnes 1997 第 3 章以及 Scaltsas 与 Mason 2007 中 Crivelli 的论文）[^barnes-1997][^scaltsas-2007]。
    step2: |-
      他仍可能接受了哲学其他潮流的某些影响，或自行发展出若干观念。此类影响最清晰的实例涉及柏拉图：爱比克泰德从柏拉图较短的对话所刻画的苏格拉底形象中汲取了大量灵感。尤其可以拿柏拉图《高尔吉亚》（*Gorgias*）中的苏格拉底作比——他喜爱辩论中的你来我往，乐于挑战听者的预设，并对通过价值澄清所能实现的东西抱持乐观。《泰阿泰德》（*Theaetetus*）或许也影响了爱比克泰德关于沉思及人神关系的思考；见 Bénatouïl 2013。爱比克泰德还熟悉麦加拉学派的“主论证”（Master Argument，公元前 3 世纪），甚至点名提到狄奥多鲁斯（Diodorus）与潘托伊德斯（Panthoides）；不过这一知识很可能是从斯多葛派的逻辑论著中得来的（2.19.1–11；另见 Barnes 1997 第 3 章，以及 Scaltsas 与 Mason 2007 中 Crivelli 的文章）[^barnes-1997][^scaltsas-2007]。
