      The standard Greek edition of all the above works is by Schenkl (1916); there is also a valuable Loeb edition by Oldfather (2 volumes, 1926–28), and, for the *Discourses,* an edition by Souilhé (4 vols., 1948–65) which includes a French translation. Complete English translations include, besides Oldfather, Waterfield (2022) and Hard (1995). The latter, which occasionally quoted here, is a revision of the classic translation by Elizabeth Carter (1759). Dobbin (2008) is a somewhat abridged version with an excellent brief introduction and notes. Dobbin (1998) provides a more extensive general introduction and notes to accompany a translation of *Discourses* Book I. For a reliable overview of Epictetus’s main ideas with observations on many specific points, the first port of call is Long (2002). The more detailed treatments by Bonhöffer (1890 and 1894), though superseded by more recent studies on many points, retain considerable value.
    step1: |-
      上述所有著作的标准希腊文版本是申克尔（Schenkl 1916）所编；此外还有奥尔德法瑟（Oldfather）编的宝贵洛布（Loeb）版（2 卷，1926–28），以及就《论说集》而言的苏伊莱（Souilhé）版（4 卷，1948–65），该版包含法文译本。完整的英译本，除奥尔德法瑟外，还有沃特菲尔德（Waterfield 2022）与哈德（Hard 1995）。后者（本书偶尔征引）是伊丽莎白·卡特（Elizabeth Carter）经典译本（1759）的修订本。多宾（Dobbin 2008）是一个略加节略的版本，附有出色的简短导言与注释。多宾（Dobbin 1998）为《论说集》第一卷的译本提供了更详尽的一般导言与注释。要可靠地了解爱比克泰德的主要思想并对其许多具体观点有所观察，首选的起点是朗（Long 2002）。邦赫费尔（Bonhöffer 1890 与 1894）更详尽的研究，虽在许多点上已被较新的研究所取代，仍保有可观的价值。
