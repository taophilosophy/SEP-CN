    source: |-
      A Greek philosopher of 1ˢᵗ and early 2ⁿᵈ centuries C.E., and an exponent of Stoic ethics notable for the consistency and power of his ethical thought and for effective methods of teaching. Epictetus’s chief concerns are with integrity, self-management, and personal freedom, which he advocates by demanding of his students a thorough examination of two central ideas, the capacity he terms ‘volition’ (*prohairesis*) and the correct use of impressions (*chrēsis tōn phantasiōn*), Heartfelt and satirical by turns, Epictetus has had significant influence on the popular moralistic tradition, but he is more than a moralizer; his lucid resystematization and challenging application of Stoic ethics qualify him as an important philosopher in his own right.
    step1: |-
      爱比克泰德是公元 1 世纪至 2 世纪初的一位希腊哲学家，斯多葛伦理学的倡导者，以其伦理思想的一致性与力量以及有效的教学方法而著称。爱比克泰德的主要关切在于正直、自我管理与个人自由，他通过要求学生彻底考察两个核心观念来倡导这些，即他称为“意愿”（*prohairesis*）的能力与对印象的正确使用（*chrēsis tōn phantasiōn*）。爱比克泰德时而真挚、时而讥讽，对通俗道德教化传统产生了重大影响，但他不只是一个道德说教者；他对斯多葛伦理学的清晰再系统化与富有挑战性的应用，使他成为一位当之无愧的重要哲学家。
    step2: |-
      爱比克泰德是公元 1 世纪至 2 世纪初的希腊哲学家，斯多葛伦理学的代表人物，以其伦理思想的一致与有力、教学方法的有效而著称。他关心的核心在于正直、自我管理与个人自由；为倡导这些，他要求学生彻底考察两个中心观念：他称为“意愿”（*prohairesis*）的能力，以及对印象的正确运用（*chrēsis tōn phantasiōn*）。爱比克泰德时而恳切、时而讥诮，对通俗道德训诫传统影响深远，但他远不止是一位道德说教者；他对斯多葛伦理学的清晰重述与富有挑战性的运用，使他足以成为一位自成一家的重要哲学家。
  - id: 2
    source: |-
      Born sometime in the 50s C.E. in Hierapolis, a Greek city of Asia Minor, Epictetus spent a portion of his life as the slave of Epaphroditus, an important administrator in the court of Nero. The date at which he came to Rome is unknown, but it must have been either prior to 68, at which time Epaphroditus fled the capital, or after the accession of Domitian in 81, under whom Epaphroditus was allowed to return and perhaps to resume his position. The circumstances of Epictetus’s education are likewise unknown, except that he studied for a time under Musonius Rufus, a Roman senator and Stoic philosopher who taught intermittently at Rome. Eventually receiving his freedom, he began lecturing on his own account but was forced to leave the city, presumably by the edict of Domitian (in 89) banning philosophers from the Italian peninsula. He then established his own school at Nicopolis, an important communications hub and administrative center in Epirus, on the Adriatic coast of northwest Greece, and remained there teaching and lecturing until his death around 135. The teaching represented in the *Discourses* is that of his later career, around the year 108 by Millar’s (1965) dating, at which time he walked with a limp attributed variously to arthritis or to physical abuse during his time of slavery. Epictetus never married, but for reasons of benevolence he late in life adopted a child whose parents could not provide for its maintenance.
    step1: |-
      爱比克泰德约于公元 50 年代出生于小亚细亚的希腊城市希拉波利斯（Hierapolis），一生中有一部分时间作为埃帕弗洛狄图斯（Epaphroditus）的奴隶，后者是尼禄宫廷中的一位重要行政官员。他来到罗马的日期不详，但必定早于 68 年——当时埃帕弗洛狄图斯逃离首都——或晚于 81 年图密善即位，在图密善治下埃帕弗洛狄图斯得以返回并或许恢复其职位。爱比克泰德受教育的境况同样不详，只知道他曾一度师从穆索尼乌斯·鲁弗斯（Musonius Rufus），一位罗马元老与斯多葛哲学家，间歇性地在罗马执教。他最终获得自由，开始自行讲学，但被迫离开该城，大概是出于图密善（89 年）禁止哲学家离开意大利半岛的敕令。他随后在尼科波利斯（Nicopolis）建立了自己的学校，这是伊庇鲁斯（Epirus）的一个重要交通枢纽与行政中心，位于希腊西北部的亚得里亚海岸，他在那里教学与讲学直至约 135 年去世。《论说集》（*Discourses*）所呈现的教学属于他后期的事业，按米勒（Millar）1965 年的年代断定约在 108 年，当时他跛足行走，跛足被分别归因于关节炎或他在为奴期间所受的身体虐待。爱比克泰德从未结婚，但出于仁慈，他在晚年收养了一个其父母无法抚养的孩子。
    step2: |-
      爱比克泰德约于公元 50 年代生于小亚细亚的希腊城市希拉波利斯（Hierapolis）。他一生中曾有一段时期是埃帕弗洛狄图斯（Epaphroditus）的奴隶，后者是尼禄宫廷中一位重要的行政官员。他抵达罗马的时间不详，但必定早于 68 年——其时埃帕弗洛狄图斯逃离了首都——或晚于 81 年图密善即位之后；在图密善治下，埃帕弗洛狄图斯获准重返并可能恢复原职。爱比克泰德的求学经历同样不明，只知道他曾一度师从穆索尼乌斯·鲁弗斯（Musonius Rufus）——一位罗马元老、斯多葛哲学家，在罗马间歇授课。他最终获得自由，开始独立讲学，却被迫离开该城，大概是因为图密善于 89 年颁布敕令、将哲学家逐出意大利半岛。此后他在尼科波利斯（Nicopolis）建立自己的学园；此地是伊庇鲁斯（Epirus）的重要交通枢纽与行政中心，地处希腊西北部亚得里亚海岸。他在此教学讲学，直至约 135 年去世。《论说集》（*Discourses*）所反映的教学属于他晚年的事业，按米勒（Millar）1965 年的年代断定约在公元 108 年；当时他跛足而行，跛足或被归因于关节炎，或被归因于为奴期间所受的体罚。爱比克泰德终身未娶，但出于仁善，他在晚年收养了一个父母无力抚养的孩子。
