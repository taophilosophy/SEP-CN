      An argument has sometimes been made for Aristotelian influence, primarily because Epictetus’s favored term *prohairesis* (see section 4.3 below) is prominent in *Nicomachean Ethics* 3.1–5 as a quasi-technical term (there usually translated “choice” or “decision”). In particular, Dobbin (1991) has suggested that Epictetus’s use of this term reflects the influence of the early Aristotle commentaries (1ˢᵗ c. BCE-1ˢᵗ c. CE), none of which has survived for our inspection. But neither Aristotle nor any author in the Aristotelian tradition is ever mentioned in the *Discourses*. It is better to make the provisional assumption that his interest in volition derives, like other main elements of his philosophy, from the early Stoa, though with greater emphasis. Although the term *prohairesis* is only barely attested in surviving accounts of early Stoic philosophy, there is some evidence to suggest that it did play a significant role; see Graver 2003.
