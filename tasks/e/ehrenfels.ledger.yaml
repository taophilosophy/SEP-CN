      Christian Julius Leopold Karl, Freiherr von Ehrenfels, was born in Rodaun near Vienna. He grew up in his father’s castle in Brunn am Walde (see Valent 2016 for more biographical details on Ehrenfels’ youth)[^valent-2016]. Though he was the eldest son and accordingly the rightful heir to the family estate, he decided in 1882, when he was 23 years old, to give away his birthright to his younger brother and to devote himself entirely to philosophy, poetry, and music. At first Ehrenfels went to Vienna in 1877 to undertake agricultural studies, but in the winter semester 1879/80 he enrolled at the university where he began his studies in philosophy with Franz Brentano, Thomas Masaryk, and the young Alexius Meinong, while also attending lectures of Franz Exner, Ludwig Boltzmann, and Ernst Mach (Valent 2016, 179)[^valent-2016]. At the same time he also began to study composition with Anton Bruckner. As an enthusiastic follower of Richard Wagner he was to write librettos for Wagnerian-style music dramas. Ehrenfels then also links his loss of Christian faith to the start of his academic studies and the discovery of Wagner (Höfer 2017, 25)[^höfer-2017]. In 1882 Ehrenfels undertook a “pilgrimage” to Bayreuth in order to attend the first performance of Wagner’s *Parzifal*. This visit triggered both the end of his uncritical personal admiration of Wagner (though not of his art) and the insight that his own musical abilities were inadequate, ending his lessons with Bruckner (Höfer 2017, 26)[^höfer-2017].
    step1: |-
      克里斯蒂安·尤利乌斯·利奥波德·卡尔·冯·埃伦费尔斯男爵（Christian Julius Leopold Karl, Freiherr von Ehrenfels）生于维也纳附近的罗道恩（Rodaun），在父亲位于布伦阿姆瓦尔德（Brunn am Walde）的城堡中长大（关于埃伦费尔斯青年时代的更多传记细节，见 Valent 2016）[^valent-2016]。他虽是长子，依例本应继承家产，却在 1882 年、23 岁那年决定把继承权让给弟弟，从此全心投入哲学、诗歌与音乐。埃伦费尔斯起初于 1877 年赴维也纳学习农学，但 1879/80 年冬季学期他考入大学，开始随弗朗兹·布伦塔诺、托马斯·马萨里克与年轻的亚历克修斯·迈农学习哲学，同时旁听弗朗茨·埃克斯纳、路德维希·玻尔兹曼与恩斯特·马赫的讲课（Valent 2016, 179）[^valent-2016]。与此同时，他还开始随安东·布鲁克纳学习作曲。作为理查德·瓦格纳的热忱追随者，他后来要为瓦格纳风格的乐剧撰写剧本。埃伦费尔斯还把自己的基督教信仰之丧失与学术生涯的开端以及对瓦格纳的发现联系在一起（Höfer 2017, 25）[^höfer-2017]。1882 年，埃伦费尔斯赴拜罗伊特“朝圣”，以参加瓦格纳《帕西法尔》（*Parzifal*）的首演。此行既终结了他对瓦格纳其人（而非其艺术）的无批判崇拜，也让他认识到自己的音乐才能有所不逮，于是终止了与布鲁克纳的课业（Höfer 2017, 26）[^höfer-2017]。
    step2: |-
      克里斯蒂安·尤利乌斯·利奥波德·卡尔·冯·埃伦费尔斯男爵（Christian Julius Leopold Karl, Freiherr von Ehrenfels）出生于维也纳近郊的罗道恩（Rodaun），在父亲的城堡——布伦阿姆瓦尔德（Brunn am Walde）——度过童年（其青年时代的传记细节，详见 Valent 2016）[^valent-2016]。身为长子，他本可顺理成章地继承家业，却在 1882 年、23 岁上做出决定：把继承权让给弟弟，一头扎进哲学、诗歌与音乐。1877 年他初到维也纳读的是农学；到 1879/80 年冬季学期，他考入大学，在弗朗兹·布伦塔诺、托马斯·马萨里克与青年亚历克修斯·迈农门下研习哲学，同时去听弗朗茨·埃克斯纳、路德维希·玻尔兹曼与恩斯特·马赫的课（Valent 2016, 179）[^valent-2016]。同一时期，他还随安东·布鲁克纳学作曲。他是理查德·瓦格纳的热忱信徒，日后打算为瓦格纳式乐剧撰写剧本。埃伦费尔斯自己把基督教信仰的丧失与学术生涯的开端、与发现瓦格纳联系在一起（Höfer 2017, 25）[^höfer-2017]。1882 年他专程“朝圣”拜罗伊特，赶赴瓦格纳《帕西法尔》（*Parzifal*）的首演。这趟旅程带来双重转折：既终结了他对瓦格纳其人（虽非其艺术）的无批判崇拜，也让他看清自己的音乐才能有限，就此停了布鲁克纳的课（Höfer 2017, 26）[^höfer-2017]。
