      Ehrenfels proceeds to highlight *Gestalt* qualities in almost every domain. First of all, relations also fall “under the concept of Gestalt quality” (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988], since they consist in a presentational complex of separable elements (as in the case of the similarity relation between red and orange), though the two categories cannot be straightforwardly be equated (Ehrenfels 1890; Smith 1988, 102)[^ehrenfels-1890][^smith-1988]. Also in the case where elements cannot be combined, i.e., logical incompatibility (as in the case of a round square, see Ehrenfels 1890; Smith 1988, 104 Ierna 2019)[^ehrenfels-1890][^ierna-2019][^smith-1988], there is nevertheless an unintuitive unity to the whole, which is again a *Gestalt* quality: “If I am to deny the existence of a round square, then I must be in a position to think this round square. i.e., to combine the two determinations roundness and squareness in some way or other.” (Ehrenfels 1890; Smith 1988, 103)[^ehrenfels-1890][^smith-1988]. Moreover, since one can form unintuitive presentations also when the elements are compatible, Ehrenfels argues that the movement of going from an unintuitive to the corresponding intuitive presentation gives rise to a *Gestalt* quality.
    step1: |-
      埃伦费尔斯随后在几乎每个领域都指出格式塔质。首先，关系也落在“格式塔质的概念之下”（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]，因为关系由可分离元素的表象复合体构成（如红与橙之间的相似关系），尽管这两个范畴不能被简单地等同起来（Ehrenfels 1890；Smith 1988, 102）[^ehrenfels-1890][^smith-1988]。在元素无法结合的情形——即逻辑不相容（如圆的方，见 Ehrenfels 1890；Smith 1988, 104 Ierna 2019）[^ehrenfels-1890][^ierna-2019][^smith-1988]——整体仍然有一种非直观的统一性，这又是一个格式塔质：“如果我要否认圆的方的存在，那么我必须能够思考这个圆的方，也就是以某种方式把圆性与方性这两个规定结合起来。”（Ehrenfels 1890；Smith 1988, 103）[^ehrenfels-1890][^smith-1988] 此外，由于元素相容时同样能形成非直观表象，埃伦费尔斯论证说，从非直观表象走向相应直观表象的这一运动也产生一个格式塔质。
    step2: |-
      接下来，埃伦费尔斯几乎在每个领域都点出格式塔质。头一条：关系也归在“格式塔质的概念之下”（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]，因为关系就存在于可分离元素的表象复合体之中（红与橙之间的相似关系便是例子）；当然，这两类范畴不能简单地画等号（Ehrenfels 1890；Smith 1988, 102）[^ehrenfels-1890][^smith-1988]。元素根本无法结合的情形——即逻辑不相容（如圆的方，见 Ehrenfels 1890；Smith 1988, 104 Ierna 2019）[^ehrenfels-1890][^ierna-2019][^smith-1988]——整体照样有一种非直观的统一性，而这又是一个格式塔质：“如果我要否认圆的方的存在，那我就必须能思考这个圆的方，也就是设法以这样那样的方式把圆性与方性两个规定结合起来。”（Ehrenfels 1890；Smith 1988, 103）[^ehrenfels-1890][^smith-1988] 何况元素相容时也能形成非直观表象；埃伦费尔斯因此主张，从非直观表象向相应直观表象过渡的这一运动，本身就产生一个格式塔质。
