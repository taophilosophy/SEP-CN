      ## 7. Legacy
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      It is likely that first and foremost what comes to mind when speaking of Ehrenfels’ legacy, is the idea of *Gestalt*. Whatever the inspiration by Mach or the developments in the School of Brentano, it was Ehrenfels’ article “*Über Gestaltqualitäten*” that shaped the ensuing debates. As Smith (1988, 12) observes: “The importance of Ehrenfels’ paper rests on the fact that it contains the first concentrated reflections on the question ‘what complex perceived formations such as spatial figures or melodies might be’.” Ehrenfels’ original proposal of “*Gestaltqualitäten*” still left many issues open or unclear, which were quickly taken up in various ways by his fellow Brentanians. Despite opposition against his terminological choice and the development of alternative terminologies, such as Meinong’s “founded contents” (1891, 253) and Husserl’s “figural moments” (1891, 236 n. 1) or “moments of unity” (1901, 230), Ehrenfels’ article contributed significantly to fix the terminology and many of the conceptual categories, not only in German, but also in English. Work on *Gestalt* psychology was translated into English early on and the term “*Gestalt*” was quickly taken up as technical terminology. According to Arnheim (1961, 90), “It has given a name to one of the most characteristic schools of scientific thought in our time and thereby established its existence formally. It is responsible for the word ”Gestalt“ having acquired citizenship in the English language”.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      At variance with many other pupils of Brentano, Ehrenfels did not establish a school or movement of his own, although he was the first teacher of Max Wertheimer in Prague. While Ehrenfels’ work sketched the larger picture and provided a general framework to approach *Gestalt* phenomena, many of the details were worked out subsequently by the Graz and Berlin schools of *Gestalt* psychology, formed by the students of Meinong (Stephan Witasek and Vittorio Benussi) and Stumpf (Max Wertheimer, Kurt Koffka and Wolfgang Köhler). Systematically, these schools differ mainly in their views on how *Gestalt* qualities originate. Contra Ehrenfels, the Graz school argued that *Gestalten* are actively produced by our intellect on the basis of the *Gestalt* switch phenomenon (see, among others, Smith 1994, 259 ff.)[^smith-1994]. The Berlin school instead claimed that the *Gestalt* itself is given first and foremost in perception and that its constituents are abstracted from it. Perceptual contents would not have a *Gestalt*, but be a *Gestalt* (see Smith 1988, 13)[^smith-1988].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      The results that are regarded as Ehrenfels’ most original and influential contributions, both the original article on *Gestalt* as well as his engagement with value theory, were mostly products of his early career (compare PSII, 21 ff.). The endeavors Ehrenfels passionately pursued later on, even though partially related to and building on his earlier work, ended for the most part in failure. His proposals for sexual and social reforms fell flat, the idea of establishing a new religion went nowhere, and the discovery of the one and only law of primes turned out to be a very minor accomplishment (cf. PSII, 53).
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      The notion of *Gestalt*, to the contrary, obtained great influence also beyond the school of Brentano and its offspring (compare Zimmer in Albertazzi et al. 2001, 141 ff.)[^albertazzi-2001][^zimmer-2001]. In particular, the idea of *Gestalt* switch and a holistic interpretation of higher-order phenomena in various contexts, has served as a metaphor and inspiration for (among others) the idea of incommensurability of scientific theories in Thomas Kuhn and the logical positivism of the Vienna Circle, particularly Rudolf Carnap’s holism, which in turn influenced W. V. O. Quine’s. While increasingly removed from its original formulation, the historical starting point for it all is Ehrenfels’ article on *Gestalt* qualities.
