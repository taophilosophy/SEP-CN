      Yet a problem remains, namely whether *Gestalt* qualities arise as a result of some activity on our part when confronted with the relevant complex of elements or without any contribution of the intellect. Mach held the latter view, that “*Gestalten* are objects of ‘sensation’ just as soon as their respective foundations are given to consciousness” (Ehrenfels 1890; Smith 1988, 111)[^ehrenfels-1890][^smith-1988]. Ehrenfels points out first of all that *Gestalten* are not always noticed (e.g. proverbially seeing the trees but not the forest) and some effort seems to be required in grasping a shape by filling out and complementing the *Gestalt* suggested by the foundations, e.g. when “seeing” the third dimension suggested by the cues of a perspectival drawing (Ehrenfels 1890; Smith 1988, 111 ff.)[^ehrenfels-1890][^smith-1988]. While we do not actually generate the *Gestalt* in a separate act, specifically meant to add it to the foundation, we do expend effort in completing the required set of presentational elements needed for the *Gestalt*, which then arises spontaneously. This, however, does not exclude that different *Gestalten* may supervene on the same foundations and that we can switch between them by changing the focus of our attention. By bringing a different complex of presentational elements into the foreground, i.e., by varying the foundations, we can also (indirectly) vary the *Gestalt* (Ehrenfels 1890; Smith 1988, 112 ff.)[^ehrenfels-1890][^smith-1988].
    step1: |-
      然而仍有一个问题：格式塔质的产生，究竟是我们在面对相关元素复合体时的某种活动所致，还是根本没有智性的参与？马赫持后一种观点，认为“只要各自的基础被给予意识，格式塔就是‘感觉’的对象”（Ehrenfels 1890；Smith 1988, 111）[^ehrenfels-1890][^smith-1988]。埃伦费尔斯首先指出，格式塔并不总是被注意到（俗话说只见树木不见森林），而要把握一个形状——通过填充与补足基础所暗示的格式塔——似乎需要某种努力，例如在透视图画提供的线索中“看出”第三维（Ehrenfels 1890；Smith 1988, 111 ff.）[^ehrenfels-1890][^smith-1988]。我们虽然并不在一个专门旨在把格式塔添给基础的单独行为中真正生成格式塔，但为补足格式塔所需的那组表象元素，我们确实要花力气；格式塔随后便自发地出现。不过，这并不排除不同的格式塔可以迭加于相同的基础之上，也不排除我们可以通过转移注意的焦点在它们之间切换。把另一个表象元素复合体带入前景，即通过变更基础，我们也可以（间接地）变更格式塔（Ehrenfels 1890；Smith 1988, 112 ff.）[^ehrenfels-1890][^smith-1988]。
    step2: |-
      可问题还剩下一个：格式塔质的出现，靠的是我们面对相关元素复合体时的某种活动，还是全然无需智性出力？马赫取后一种立场：一旦各自的基础被给予意识，格式塔就是“感觉”的对象（Ehrenfels 1890；Smith 1988, 111）[^ehrenfels-1890][^smith-1988]。埃伦费尔斯先提请注意：格式塔并非总能被注意到（所谓只见树木、不见森林）；要把握一个形状——比如从一幅透视图的线索里“看”出第三维——似乎得下点功夫，把基础所暗示的格式塔填充、补全（Ehrenfels 1890；Smith 1988, 111 ff.）[^ehrenfels-1890][^smith-1988]。当然，我们并不专门发动一个单独行为去把格式塔添加到基础上；但为了凑齐格式塔所需的那组表象元素，功夫是实打实花了的，然后格式塔才自己冒出来。不过，这并不排除：不同的格式塔可以迭加在同一批基础上，我们也能靠挪移注意的焦点在它们之间来回切换。把另一组表象元素复合体推到前景——也就是变更基础——我们还能（间接地）变更格式塔（Ehrenfels 1890；Smith 1988, 112 ff.）[^ehrenfels-1890][^smith-1988]。
