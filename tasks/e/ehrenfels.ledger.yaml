      胡塞尔曾拿集合名词当线索，去找刻画 *Inbegriffe*（集合体）的形象环节（蜂群、鸟群、兽群之类）；埃伦费尔斯与之相仿，也想到日常语言里找些有用的指示词，只是找来找去，唯有哀叹现成术语的贫乏：
