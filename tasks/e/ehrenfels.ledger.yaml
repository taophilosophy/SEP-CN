      Ehrenfels died just one year before Adolf Hitler, who was of course fanatical in advancing racial purity, came to power in Germany. Ehrenfels was thus spared the agony of seeing the prospect of western civilization becoming something diametrically opposed to his own vision. Unlike many philosophers of the twentieth century, however, it should be kept in mind that Ehrenfels indeed had a vision. In this regard he was more comparable to a Leibniz or a Hume as opposed to present-day specialists in the various fragmented domains of philosophical inquiry. Nevertheless, much of his philosophical work also exhibits detailed analysis and rigorous argumentation and may well be appreciated by contemporary philosophers who do not share his driving concerns.
    step1: |-
      埃伦费尔斯去世的时间，恰好在阿道夫·希特勒于德国上台之前一年——而希特勒当然狂热推进种族纯粹。就此而言，埃伦费尔斯免受了亲眼目睹西方文明前景沦为与自己构想正相反对之物的痛苦。然而也应记住，与二十世纪的许多哲学家不同，埃伦费尔斯确实怀有一幅总体蓝图。就此而言，与其比作当今哲学探究各碎片化领域的专家，他更近于一位莱布尼茨或休谟。尽管如此，他的许多哲学著作同样显示出细致的分析与严格的论证，即便不认同其主导关怀的当代哲学家，也大可以欣赏这些成果。
    step2: |-
      埃伦费尔斯去世之年，恰在阿道夫·希特勒攫取德国政权的前一年——而后者推进种族纯粹之狂热，自不待言。他因此免去了亲眼目睹西方文明前景翻转为自家构想之反面的痛苦。不过应当记住：与二十世纪的许多哲学家不同，埃伦费尔斯确实有一幅总体构想。就此而言，与其把他比作当今哲学各碎片化领域的专家，不如比作一位莱布尼茨或休谟。话虽如此，他的许多哲学著作同样显示出细密的分析与严整的论证；即便不认同其主导关怀的当代哲学家，也完全可以欣赏。
