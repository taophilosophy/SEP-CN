      As pessimism began to grow in the early twentieth century, Ehrenfels became increasingly concerned with reviving European culture (Valent 2016, § 9)[^valent-2016]. According to Max Brod, Ehrenfels’ *Cosmogony* “was a document of this generation [the ”Generation nevertheless“ (*Generation des Trotzdem*)], which for the first time embodied a mood of impending doom, tough without vanishing into fear” (quoted from Frechette 2017, 325). It is also in this context that he developed his ideas for reforming sexual ethics. In essence he advocated polygamy for the superior men, in order to increase the population of people with higher qualities. He was at the same time opposed to those who advocated racial purity and was instead all in favor of mixed races. He did not see Jews as a threat to the “Aryan race” and in fact acknowledged their great cultural achievements (PSIII, 262), although he did fear the “yellow peril” (see Ehrenfels 1908, Dickinson 2002)[^ehrenfels-1908][^dickinson-2002]. His proposal for a new sexual ethic in order to enhance the European stock was, however, not well received. As the years went on, Ehrenfels himself lost enthusiasm for it, but was instead more concerned with developing a new religion. He did not think that Christianity, with its demands for blind faith where reason could no longer be effective, was viable. The new religion was to be built upon a thoroughly scientific foundation, a rational dualistic principle of cosmogony, which also to a large extent drew upon the concept of *Gestalt* qualities that he had developed early in his career. It should also be mentioned here that Ehrenfels found the *Gestalt* concept to be fruitful in the domain of mathematics.
    step1: |-
      随着悲观情绪在二十世纪初蔓延，埃伦费尔斯越来越关心如何复兴欧洲文化（Valent 2016, § 9）[^valent-2016]。照马克斯·布罗德的说法，埃伦费尔斯的《宇宙发生论》（*Cosmogony*）“是这一代人的文献［即‘尽管如此’的一代（*Generation des Trotzdem*）］，这一代人第一次体现了一种大祸将至的心情，尽管这心情还不至于化为恐惧”（引自 Frechette 2017, 325）。也正是在这一语境中，他形成了改革性伦理的思想。其要点是为优等男性提倡一夫多妻制，以增加具有更高素质的人口。同时他反对那些鼓吹种族纯粹的人，反而完全赞成种族混血。他不认为犹太人对“雅利安种族”构成威胁，实际上承认他们伟大的文化成就（PSIII, 262），尽管他确实惧怕“黄祸”（见 Ehrenfels 1908, Dickinson 2002）[^ehrenfels-1908][^dickinson-2002]。然而，他为增进欧洲人种而提出的新性伦理方案并未获得多少响应。随着岁月流逝，埃伦费尔斯本人对它失去了热情，转而更关心创立一种新宗教。他认为基督教已难以为继——在理性不再能起作用的地方，它要求人们盲目信仰。新宗教要建立在彻底科学的基础之上，即一种理性主义的二元论宇宙发生原理，这在很大程度上也取材于他早年发展的格式塔质概念。这里还应提到，埃伦费尔斯发现格式塔概念在数学领域也颇多收获。
    step2: |-
      二十世纪初，悲观情绪日渐弥漫，埃伦费尔斯也日益把心思放在复兴欧洲文化上（Valent 2016, § 9）[^valent-2016]。用马克斯·布罗德的话说，埃伦费尔斯的《宇宙发生论》（*Cosmogony*）“是这一代人的文献［即‘尽管如此’的一代（*Generation des Trotzdem*）］：这一代人头一回把大难临头的心绪写进了自己的姿态，虽惊而不惧”（转引自 Frechette 2017, 325）。性伦理改革的构想正是在这一背景下成形。其核心主张是让优等男性实行一夫多妻，借以提高高素质人口的数量。与此同时，他反对鼓吹种族纯粹之辈，反而全力赞成种族融合。他不觉得犹太人对“雅利安种族”有何威胁，反倒承认其伟大的文化成就（PSIII, 262）；不过“黄祸”确实是他心头之忧（见 Ehrenfels 1908, Dickinson 2002）[^ehrenfels-1908][^dickinson-2002]。然而，这套为增强欧洲人种而设计的新性伦理并不受欢迎。年复一年，埃伦费尔斯自己对它也冷淡下来，转而倾注心力于创立新宗教。在他看来，基督教要求人在理性失效之处盲目信仰，这条路已走不通。新宗教必须建立在完全科学的基础之上——一个理性的二元论宇宙发生原理；这原理在很大程度上又取材于他早年提出的格式塔质概念。顺带一提，埃伦费尔斯还发现格式塔概念在数学领域同样多产。
