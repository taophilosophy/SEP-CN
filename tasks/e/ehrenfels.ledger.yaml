      Soon after publishing his article on *Gestalt* qualities, Ehrenfels produced a series of articles under the title “Werttheorie und Ethik” (1893–1894) which were followed by his two-volume *System der Werttheorie* (1897–1898). The first volume in particular, entitled *Allgemeine Werttheorie, Psychologie des Begehrens*, concerns us in this section.
    step1: |-
      发表格式塔质论文后不久，埃伦费尔斯以“价值理论与伦理学”（“Werttheorie und Ethik”，1893–1894）为题发表系列论文，随后又出版两卷本《价值理论体系》（*System der Werttheorie*，1897–1898）。本节尤其关心第一卷，题为《一般价值理论：欲望心理学》（*Allgemeine Werttheorie, Psychologie des Begehrens*）。
    step2: |-
      格式塔质的论文刊出后不久，埃伦费尔斯又以“价值理论与伦理学”（“Werttheorie und Ethik”，1893–1894）为题抛出一系列文章，随后便是两卷本的《价值理论体系》（*System der Werttheorie*，1897–1898）。与我们这一节直接相干的，尤其是第一卷——《一般价值理论：欲望心理学》（*Allgemeine Werttheorie, Psychologie des Begehrens*）。
  - id: 31
    kind: body
    source: |-
      According to Ehrenfels, it is most appropriate to begin a philosophical investigation by taking into account what is indicated by ordinary language, but it is by no means obligatory to leave the matter there. Sometimes a revision of the concept in question is needed and such a revision he finds indeed to be necessary regarding the concept of value. While ordinary language seems to indicate that the value of something is among its objective properties, such a value-property is not to be found in reality. Rather, as long as we adhere to such a conception of value, it seems to be mystical. The two options Ehrenfels considers, resemble those of the Euthyphro dilemma: do we desire things because of their value or do things have value because we desire them? Though we ordinarily think that we desire objects because they are “valuable” (i.e., because they supposedly have this “mystical, incomprehensible essence”), the fact of the matter, says Ehrenfels, is that we ascribe value to objects because we desire them (Ehrenfels 1897, 2, also see Fabian in Albertazzi et al. 1996, 166; Reicher 2017, 284 f.)[^ehrenfels-1897][^ehrenfels-1897-2][^albertazzi-1996][^fabian-1996][^reicher-2017].
    step1: |-
      在埃伦费尔斯看来，哲学研究最恰当的开端是考虑日常语言所指示的东西，但绝没有义务到此为止。有时需要对所讨论的概念作修正；而关于价值概念，他确实认为这种修正是必要的。日常语言似乎表明，某物的价值属于其客观属性，但这种价值属性在现实中找不到。毋宁说，只要我们固守这样一种价值观，它就显得神秘。埃伦费尔斯考虑的两个选项，与欧绪弗洛两难相似：我们因为事物有价值而欲求它们，还是事物因为我们欲求它们而有价值？虽然我们通常认为，我们欲求对象是因为它们“有价值”（即因为它们据说具有这种“神秘的、不可理解的本质”），但事实是，埃伦费尔斯说，我们把价值归于对象是因为我们欲求它们（Ehrenfels 1897, 2，另见 Fabian in Albertazzi et al. 1996, 166；Reicher 2017, 284 f.）[^ehrenfels-1897][^ehrenfels-1897-2][^albertazzi-1996][^fabian-1996][^reicher-2017]。
    step2: |-
      依埃伦费尔斯之见，哲学探究最合适的起点，是看看日常语言都说了什么；但事情绝不必停在那里。有些概念需要修订，而在他看来，价值概念恰恰非修订不可。日常语言似乎在说：价值是事物客观属性中的一员；可在现实里，这种价值属性根本寻不着。毋宁说，只要我们还抱着这种价值观，价值就显得神神秘秘。摆在埃伦费尔斯面前的两个选项，像极了欧绪弗洛两难：我们是因为事物有价值才欲求它，还是事物因为我们欲求它才有价值？按平日的想法，我们欲求一个对象，是因为它“有价值”（就是说，它据说带着那种“神秘的、不可理解的本质”）；可埃伦费尔斯说，实际情况恰恰相反：我们之所以把价值派给对象，是因为我们欲求它们（Ehrenfels 1897, 2，另见 Fabian in Albertazzi et al. 1996, 166；Reicher 2017, 284 f.）[^ehrenfels-1897][^ehrenfels-1897-2][^albertazzi-1996][^fabian-1996][^reicher-2017]。
  - id: 32
    kind: body
    source: |-
      Besides the view that value is some sort of mystical property of objects, other ones are identified by Ehrenfels in opposition to his. Among these views is the one put forward by the so-called “first school” of Austrian value theory, as put forward by the economists Carl Menger, Eugen Böhm von Bawerk, and Friedrich von Wieser (as mentioned in Ehrenfels 1897, 3 n.)[^ehrenfels-1897][^ehrenfels-1897-2]. On this view the value of objects “is neither a property nor an essence of them, considered as such, but rather merely their indispensability in the satisfaction of our desires” (Ehrenfels 1897, 3)[^ehrenfels-1897][^ehrenfels-1897-2]. While Ehrenfels fully appreciates this school’s contribution to the understanding of value (Smith 1994, 282)[^smith-1994], he nonetheless thinks that it does not provide a satisfactory theory of value in general due to its narrow focus on economic value. There are for him other types of value besides this, as exhibited by counter-examples (as when the lock of hair belonging to one’s mother is kept as a thing of value). A general theory of value on his view is to illuminate economic value and not vice versa.
    step1: |-
      除了把价值当作对象的某种神秘属性的观点之外，埃伦费尔斯还辨识出一些与己相对的观点。其中之一是奥地利价值理论所谓“第一学派”提出的观点，由经济学家卡尔·门格尔（Carl Menger）、欧根·庞巴维克（Eugen Böhm von Bawerk）与弗里德里希·冯·维塞尔（Friedrich von Wieser）提出（如 Ehrenfels 1897, 3 n. 所提及）[^ehrenfels-1897][^ehrenfels-1897-2]。按这种观点，对象的价值“既不是它们的属性，也不是它们就其自身而言的本质，而仅仅是它们在满足我们欲望时的不可或缺性”（Ehrenfels 1897, 3）[^ehrenfels-1897][^ehrenfels-1897-2]。埃伦费尔斯虽然充分赞赏这一学派对理解价值的贡献（Smith 1994, 282）[^smith-1994]，但仍认为它由于窄狭地聚焦于经济价值，并未提供一种令人满意的一般价值理论。在他看来，除此之外还有其他类型的价值，反例便可显示这一点（例如把母亲的一绺头发作为有价值之物保存）。按他的观点，一般价值理论应当照亮经济价值，而不是相反。
    step2: |-
      价值是对象某种神秘属性——这一路之外，埃伦费尔斯还点了几个对家。其中一派是奥地利价值理论的所谓“第一学派”，主事者是经济学家卡尔·门格尔（Carl Menger）、欧根·庞巴维克（Eugen Böhm von Bawerk）与弗里德里希·冯·维塞尔（Friedrich von Wieser）（Ehrenfels 1897, 3 n. 提到过）[^ehrenfels-1897][^ehrenfels-1897-2]。在他们那里，对象的价值“既非其属性，亦非其就自身而言的本质，而不过是它们在满足我们欲望一事上的不可或缺”（Ehrenfels 1897, 3）[^ehrenfels-1897][^ehrenfels-1897-2]。埃伦费尔斯对这一学派理解价值的贡献推崇备至（Smith 1994, 282）[^smith-1994]，但他仍然认为，这一派把眼光死死钉在经济价值上，拿不出令人满意的一般价值理论。在他看来，经济价值之外还有别样的价值，反例俯拾即是——譬如把母亲的一绺头发当宝贝收藏。依他的构想，一般价值理论应当去照亮经济价值，而不是反过来。
