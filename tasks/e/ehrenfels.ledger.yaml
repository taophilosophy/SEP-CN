      Yet another attempt to characterize value without assigning it the status of a mystical property of certain objects, is the one that had been put forward by Brentano, which Ehrenfels formulates as follows:
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      > Not all desired things are valuable, but rather only those which are *worthy* of being desired. Whether this worthiness belongs to a thing, however, is not in the particular case yielded from the investigation of the objective nature of the thing, but rather from the subjective consideration of the desire directed at the thing. From the examination of our own mental activity in the act of desire we discern whether this is directed at something valuable or not. (Ehrenfels 1897, 3–4)[^ehrenfels-1897][^ehrenfels-1897-2]
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      In contemporary terms, Brentano is a cognitivist, for he maintains that loving and hating (the acts of valuing on his view) can be characterized as correct or incorrect (Brentano 1889)[^brentano-1889]: loving what is worthy of love is correct, hating it is incorrect. The “second school” of Austrian value theory, to which the early Meinong (1894) as well as Ehrenfels belong, distanced itself from Brentano’s cognitivism, while building on his method of descriptive psychology (Grassl in PSI, 5). Here we should note, however, that Ehrenfels came to develop views in aesthetics that can be contrasted with the non-cognitivism found in his early work. This later development will be discussed further at the end of the present section.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      An important aspect of Ehrenfels’ value theory is his view regarding the relation of desire to feeling. He characterizes feeling as anything that occurs on the scale that ranges from pleasure to pain (Ehrenfels 1897, 5 ff.)[^ehrenfels-1897][^ehrenfels-1897-2]. Indifference is the central point in this scale. Desire also encompasses a range of phenomena, consisting of wishing, striving, and willing (Ehrenfels 1897, 6 ff.)[^ehrenfels-1897][^ehrenfels-1897-2]. There is, according to Ehrenfels, clearly a difference between feeling and desire, though they are also connected in a psychologically interesting way. While Brentano seems to think that his inclusion of feeling and desire in a single class of psychical phenomena is supported by inner perception, Ehrenfels points out how ineffective an appeal to inner perception is in such matters of dispute (this, however, does not prevent Ehrenfels from making similar appeals at crucial junctures of his value theory). Moreover, Brentano argues for his classification of desire together with feeling by presenting us with a range of phenomena which seem to shade off into each other, beginning with a feeling and ending with not only a desire, but with a full-fledged instance of willing (Brentano 1874, 308 ff.; Brentano 1995, 183 ff.)[^brentano-1874][^brentano-1995]. Nevertheless, Ehrenfels maintains that instances in which there occurs feeling without desire and desire without feeling serve to demonstrate that they do not belong together in the same class of psychical phenomena (Ehrenfels 1897, 10 ff.)[^ehrenfels-1897][^ehrenfels-1897-2]. It is, in addition, on his view desire rather than feeling that determines what is valuable. It was Meinong who first insisted on the distinction between feeling and desire, although he regarded feelings rather than desires to be determinative of values (Meinong 1894, §§ 5–6)[^meinong-1894]. Ehrenfels’ general theory of value thus stands in contrast with those that were advocated by both of his mentors (also see Reicher 2017, 285 f. and for the opposition between Brentano and Ehrenfels on emotion and desire, see Rollinger 2021)[^reicher-2017][^rollinger-2021].
    step1: TBD
    step2: TBD
