      In his 1916 *Kosmogonie*, Ehrenfels aims at laying out the fundamental *Gestalt* of the world as a whole. Ehrenfels wants to elucidate the origin, development, and ultimate destiny of the universe. On the one hand, he considers it as a *Kosmos* in the classical sense of an ordered, harmonious whole, governed by an ordering principle that establishes the wholeness and unity of the world. However, Ehrenfels also acknowledges a principle of disunity and entropy: chaos and chance. For Ehrenfels, the world as we know it is generated through the complementary activity of these two cosmic principles (compare PSII, 44 ff.; Valent 2016, 195; Höfer 2017, 46; Ierna 2017b, §3)[^höfer-2017][^ierna-2017b][^valent-2016]. The process of creation and generation is itself a *Gestaltic* one, since “All causal powers are Gestalting tendencies” (Ehrenfels 1916; Fabian 1990, 156)[^ehrenfels-1916]. Ehrenfels in this context discusses both biological reproduction as well as cultural production, which both lead to higher order or “superimposed *Gestalten*” (Ehrenfels 1916, 102, 136)[^ehrenfels-1916]. Ehrenfels also connects this process to the theory of evolution.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      This results in a religious dualism. The contraposition of chaos and cosmos explains the presence of both good and evil, reason and chance, etc. in the world, allowing Ehrenfels to provide a theodicy. Nevertheless, the cosmic principles themselves cannot be straightforwardly regarded as absolutely good or evil. Moreover, although Ehrenfels calls the ordering principle “God”, it cannot be understood as the omnipotent creator of western monotheism (also dubbed “solotheism” by Ehrenfels), since neither cosmic principle is absolute in itself. Creation can only be achieved by both principles working together and consists in God ordering and “shaping” or “forming” (“*Gestalten*” in its verbal form) the world in perpetual contrast with chaos. Hence, the *Kosmogonie* does not carry the tone of a typically Christian religious work, nor is it simply a transposition of ancient or eastern mythologies into modern Europe. Rather, Ehrenfels had the ambition to formulate a general framework for a (utopian) future world-spanning religion, based on a firm scientific foundation (Ehrenfels 1916, 150, also see PSII, 52)[^ehrenfels-1916]. Indeed, Ehrenfels presents his dualism explicitly as a scientific hypothesis to be investigated and proven, and concludes that it can in fact explain the world as it is and can be confirmed by experience (Ehrenfels 1916, 23, 35)[^ehrenfels-1916].
    step1: TBD
    step2: TBD
