      > Thus anyone confronted with, say, a complicated description of a work of architecture will first of all form a merely indirect presentation of it, which will then be rounded out by gradual execution or fulfilment of the various merely intended components, to yield an intuitive total picture. But this process of formation of the intuitive presentation directly from the indirect presentation is something that happens, a process of change, which serves as the foundation for a specific temporal *Gestalt* quality. (Ehrenfels 1890, tr. Smith 1988, 104)[^ehrenfels-1890][^smith-1988]
    step1: |-
      > 这样，任何一个面对比如说一份复杂的建筑作品描述的人，都会首先对它形成一个仅仅是间接的表象；随着各项仅仅被意指的成分被逐步执行或实现，这个表象随后被补足，产生一幅直观的总体图景。但从间接表象直接形成直观表象的这一过程是某种实际发生的事情，是一个变化过程，它充当一个特定时间性格式塔质的基础。（Ehrenfels 1890，tr. Smith 1988, 104）[^ehrenfels-1890][^smith-1988]
    step2: |-
      > 比方说，谁读到一份复杂的建筑设计说明书，起先只会对它形成一个间接的表象；随着那些仅仅被意指的成分被逐步落实、兑现，这个表象被一点点补齐，最终凝成一幅直观的总体图景。可是，从间接表象直接走到直观表象，这个过程本身是件实实在在发生的事，是一个变化过程——而它正好充当某个特定时间性格式塔质的基础。（Ehrenfels 1890，tr. Smith 1988, 104）[^ehrenfels-1890][^smith-1988]
