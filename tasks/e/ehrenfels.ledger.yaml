      ## 6. Cosmology
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      In his 1916 *Kosmogonie*, Ehrenfels aims at laying out the fundamental *Gestalt* of the world as a whole. Ehrenfels wants to elucidate the origin, development, and ultimate destiny of the universe. On the one hand, he considers it as a *Kosmos* in the classical sense of an ordered, harmonious whole, governed by an ordering principle that establishes the wholeness and unity of the world. However, Ehrenfels also acknowledges a principle of disunity and entropy: chaos and chance. For Ehrenfels, the world as we know it is generated through the complementary activity of these two cosmic principles (compare PSII, 44 ff.; Valent 2016, 195; Höfer 2017, 46; Ierna 2017b, §3)[^höfer-2017][^ierna-2017b][^valent-2016]. The process of creation and generation is itself a *Gestaltic* one, since “All causal powers are Gestalting tendencies” (Ehrenfels 1916; Fabian 1990, 156)[^ehrenfels-1916]. Ehrenfels in this context discusses both biological reproduction as well as cultural production, which both lead to higher order or “superimposed *Gestalten*” (Ehrenfels 1916, 102, 136)[^ehrenfels-1916]. Ehrenfels also connects this process to the theory of evolution.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      This results in a religious dualism. The contraposition of chaos and cosmos explains the presence of both good and evil, reason and chance, etc. in the world, allowing Ehrenfels to provide a theodicy. Nevertheless, the cosmic principles themselves cannot be straightforwardly regarded as absolutely good or evil. Moreover, although Ehrenfels calls the ordering principle “God”, it cannot be understood as the omnipotent creator of western monotheism (also dubbed “solotheism” by Ehrenfels), since neither cosmic principle is absolute in itself. Creation can only be achieved by both principles working together and consists in God ordering and “shaping” or “forming” (“*Gestalten*” in its verbal form) the world in perpetual contrast with chaos. Hence, the *Kosmogonie* does not carry the tone of a typically Christian religious work, nor is it simply a transposition of ancient or eastern mythologies into modern Europe. Rather, Ehrenfels had the ambition to formulate a general framework for a (utopian) future world-spanning religion, based on a firm scientific foundation (Ehrenfels 1916, 150, also see PSII, 52)[^ehrenfels-1916]. Indeed, Ehrenfels presents his dualism explicitly as a scientific hypothesis to be investigated and proven, and concludes that it can in fact explain the world as it is and can be confirmed by experience (Ehrenfels 1916, 23, 35)[^ehrenfels-1916].
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      In the fourth paragraph of the sixth chapter, Ehrenfels formulates six dogmas for his new religion: 1) The world is the combined product of the active principle of order and form (“*Gestaltung*”) and the passive principle of chaos. 2) The world has a beginning but no end. Order and form are eternally progressing and increasing. 3) The principle of unity is bodiless and rather “soul-like”. 4) The eternal progress of the world proceeds from an eternal internal development in the principle of unity. 5) The world is not a result of a purposeful will, but of a blind forming (“*Gestalten*”). 6) We human beings are part of the divine and hence collaborators in the divine works.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      These last two points are particularly relevant, because Ehrenfels will conclude the *Kosmogonie* with the admittedly unsubstantiated claim that the principle of unity and order is coming to self-awareness through the human mind and that it is in and through human beings that its blind creative impulse can acquire a purpose (Ehrenfels 1916, 86, 207)[^ehrenfels-1916].
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      The mere formulation of the six dogmas, as Ehrenfels clearly states at the end of the fourth paragraph of the sixth chapter, cannot have the pretension to constitute without further ado a fully formed religion. In his 1922 *Gedanken über die Religion der Zukunft*, Ehrenfels then sketches in more detail what is still missing in the *Kosmogonie*. Here, as well as in the *Kosmogonie*, he provides a description or morphology of religion rather than a definition (in the *Kosmogonie* he spoke of a physiognomy as *Weltbeschreibung*). Religions in general consist of four aspects:
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      1. a *Weltanschauung*, an encompassing vision of the world based on metaphysical assumptions, that address the “big questions” of why, whence, and whereto;
      2. a *Morallehre* or moral standard that tells us which actions are good or evil, allowed or reprehensible;
      3. a *Kultus*, or a system of traditional practices that allow the faithful to relate to whichever powers of the cosmos they acknowledge;
      4. exemplary *Idealgestalten*, imaginary or historical figures to emulate, i.e., heroes and saints.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      However, Ehrenfels in this writing renounces the soul-like nature of the divine and formulates a new theory of the “superposition of units of consciousness”. Ehrenfels claims that wherever there is a living cell, there we can speak of some form of “consciousness”. This would hold not only for unicellular organisms, but also for plants, animals and humans. If every living cell of my body is somehow conscious, then also the individual cells in my brain must be. Yet while each and every individual neuron is conscious in itself, collectively they also constitute my unitary consciousness as a human being. This leads Ehrenfels through analogy to formulate the idea of “personalities of higher order”, indeed a *Volksseele* would be more than a mere poetic fiction. As support for this thesis Ehrenfels points to organic metaphors for social processes (such as competition for limited resources) as well as the purposeful unity displayed by bee swarms that collectively act like a single organism. Similarly, a few years later in *Die Religion der Zukunft*, he also states explicitly that all intellects participate in the divine intellect (Ehrenfels 1929, in PSIV, 286).
