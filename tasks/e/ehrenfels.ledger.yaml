      Ehrenfels had the opportunity to present his proposal in the Vienna Psychoanalytic Society on December 23, 1908, where Isidor Sadger observed not only that “all of this seems like an adolescent sexual fantasy”, but more significantly that behind Ehrenfels’ views there would seem to be a personal history, regarding the author’s own sexuality (cf. Dickinson 2002, 268–270)[^dickinson-2002]. In reply to this, Ehrenfels pointed out that his proposal had grown out of the realization that it was not necessarily he who needed to curb his sex drive, but that the dominant morality was a distortion of the natural one.
