      Ehrenfels also criticizes the traditional view (especially prominent in Kantian ethics) that reason (*Vernunft*) can direct our desires (Ehrenfels 1897, 8 ff.)[^ehrenfels-1897][^ehrenfels-1897-2]. On his view, reason may be used to construct complexes of presentations, which are then set as goals by our desires, though reason itself is unable to set these as goals. Ehrenfels also thinks that reason can determine the means whereby a goal is to be achieved, but this is again not the same as setting goals. Aside from its involvement in shaping the presentations of ends and the determination of the means to them, Ehrenfels rejects any suggestion that reason plays any additional role in valuation.
    step1: |-
      埃伦费尔斯还批评传统观点（在康德伦理学中尤为突出），即理性（*Vernunft*）能够指导我们的欲望（Ehrenfels 1897, 8 ff.）[^ehrenfels-1897][^ehrenfels-1897-2]。在他的观点中，理性可以用来构造表象复合体，这些复合体随后被我们的欲望设为目标，尽管理性本身无力把它们设为目标。埃伦费尔斯还认为，理性能够确定实现一个目标所经的手段，但这同样不等于设定目标。除了参与塑造目的的表象以及确定通往目的的手段之外，埃伦费尔斯拒绝任何认为理性在价值评价中扮演额外角色的主张。
    step2: |-
      还有一笔旧账：传统观点（在康德伦理学里最为扎眼）认定理性（*Vernunft*）能够指导我们的欲望，埃伦费尔斯照单驳回（Ehrenfels 1897, 8 ff.）[^ehrenfels-1897][^ehrenfels-1897-2]。在他那里，理性固然可以构造表象复合体，随后这些复合体被我们的欲望立为目标——但理性自己立不了。理性也能决定达标所要的手段，可这依旧不等于设定目标。除了参与塑造目的表象、确定通往目的的手段这两件差事，埃伦费尔斯一概否认理性在价值评价中还有别的戏份。
