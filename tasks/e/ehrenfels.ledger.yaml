      The results that are regarded as Ehrenfels’ most original and influential contributions, both the original article on *Gestalt* as well as his engagement with value theory, were mostly products of his early career (compare PSII, 21 ff.). The endeavors Ehrenfels passionately pursued later on, even though partially related to and building on his earlier work, ended for the most part in failure. His proposals for sexual and social reforms fell flat, the idea of establishing a new religion went nowhere, and the discovery of the one and only law of primes turned out to be a very minor accomplishment (cf. PSII, 53).
