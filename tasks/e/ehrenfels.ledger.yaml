      While Ehrenfels’ treatise on sexual ethics of 1907 might understandably be considered extremely controversial and sexist by today’s standards (consider the very similar proposal in the black satirical comedy “Dr. Strangelove”), it was much less so at the time it was written. Most of the seemingly radical ideas and proposals were relatively popular and widespread in educated society at the time, and the controversial nature of his article is rather due to the original way in which Ehrenfels combines and connects them, taking them to considerably farther reaching conclusions (compare Dickinson 2002, 265–268)[^dickinson-2002]. The general tenor of this treatise was already anticipated in literary form by Ehrenfels’ choral drama *Siegmar und Heliea* from 1898/1899 (see PSII, 28 ff.).
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Ehrenfels aimed at a recuperation of a “natural sexual morality”, which would preserve and advance the healthy constitution of a species, as opposed to the cultural sexual morality of his time, which would instead corrupt it (Ehrenfels 1907, 8)[^ehrenfels-1907]. This could be achieved by recognizing that reproduction, while being the main biological function of the sexual drive, is not the only one. Sexuality also serves selection, not in the sense of natural selection as survival of the fittest, but selection aimed at ensuring reproduction by the best, leading to the progressive improvement of the species (Ehrenfels 1907, 9 ff.)[^ehrenfels-1907]. This is indeed formulated along the same lines as in the case of selective breeding of farm animals: artificial selection to obtain desirable characteristics (also see his previous comments on racial improvement, “*Rasseverbesserung*”, in Ehrenfels 1904)[^ehrenfels-1904]. This selection is the first and foremost function of male sex drive, which is why Ehrenfels speaks of “virile selection” (Ehrenfels 1907, 79, compare Dickinson 2002, 258)[^ehrenfels-1907][^dickinson-2002]. Since, according to Ehrenfels, males represent the active sex, not just among humans, but “in the entire bisexual animal kingdom”, and the females’ sex drive is only operative as a response to the males’, the male sex drive is the biologically more important one, and hence the basis for re-establishing the natural sexual morality.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      As the males’ sex drive exceeds the females’, the males will and should compete with one another for the possibility of reproducing with as many females as possible (Ehrenfels 1907, 46)[^ehrenfels-1907]. For a sexually well-endowed man (“*einen sexual vollkräftigen Mann*”), it is advisable to have regular, pleasurable intercourse with healthy women or girls (Ehrenfels 1907, 62)[^ehrenfels-1907], leading to polygyny, which is the only “healthy natural sexual life” (Ehrenfels 1907, 13)[^ehrenfels-1907]. For Ehrenfels, this new sexual morality would actually present a “solution to virtually all the major problems confronting European societies” (Dickinson 2002, 257)[^dickinson-2002] in his time. Thanks to competition and polygyny, only the best males will reproduce and will do so in greater numbers than in a monogamous culture, in which virile selection is absent (Ehrenfels 1907, 11, 30)[^ehrenfels-1907] and where knights and knaves alike rule as lords in their families. Conversely, since monandric women have more children than polyandric ones (Ehrenfels 1907, 14)[^ehrenfels-1907], and men will only want to care for children that they can be sure to have fathered, females should remain monandric and even avoid serial polyandry (Ehrenfels 1907, 12)[^ehrenfels-1907]. Besides the biological reasons, another concern for Ehrenfels is the well-being of the children in successive marriages, i.e., serial polyandry, which would destroy the trust among parents and children, as a stepfather and alimony would never be a satisfactory replacement (Ehrenfels 1907, 68)[^ehrenfels-1907].
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      According to Ehrenfels, women would remain so impressed and overwhelmed by their first sexual experience, that not even the hottest fires of passion will ever consume that memory, and hence they should avoid pre-marital sex to ensure future happiness in married life (Ehrenfels 1907, 65)[^ehrenfels-1907]. On the other hand, abstinence is not suitable for men, who should certainly have some previous experience so as to be fully aware of their sexual duties and to avoid becoming hypersensitive to intimate physical contact (Ehrenfels 1907, 69)[^ehrenfels-1907]. Nevertheless, the youth should abstain from sex, not just actual but also fantasized, for moral and hygienical reasons until reaching full sexual maturity (Ehrenfels 1907, 61)[^ehrenfels-1907]. What Ehrenfels considered “unnatural” sexual activities, such as masturbation and homosexuality, should be avoided and condemned, although they can be tolerated as long as they do not damage anyone’s health (Ehrenfels 1907, 56)[^ehrenfels-1907]. Indeed, autoeroticism, when practiced in moderation, does not cause any noticeable harm (Ehrenfels 1907, 61)[^ehrenfels-1907], and both autoeroticism and homosexual relationships among females, being the passive sex, would not be as harmful as among men, and can hence be considered as lighter transgressions (Ehrenfels 1907, 16)[^ehrenfels-1907].
