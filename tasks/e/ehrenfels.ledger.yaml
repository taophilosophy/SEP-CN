      > The intimate fusion of touch, temperature and sometimes also taste and smell sensations into a single unified total impression raises the question of whether we do not have here *Gestalt* qualities which are built up upon a foundation belonging to several sensory regions. […] we must also accept the possibility of *Gestalt* qualities comprehending complexes of elements of different categories. (Ehrenfels 1890; Smith 1988, 97)[^ehrenfels-1890][^smith-1988]
    step1: |-
      > 触觉、温度觉，有时还有味觉与嗅觉，亲密地融合为一个单一统一的总体印象，这就引出一个问题：我们这里是否也有格式塔质，它建立在一个属于数个感觉区域的基础之上。［……］我们还必须接受这样一种可能性：格式塔质可以把不同类别的元素复合体囊括在内。（Ehrenfels 1890；Smith 1988, 97）[^ehrenfels-1890][^smith-1988]
    step2: |-
      > 触觉、温度觉，间或还有味觉和嗅觉，亲密无间地融成一个单一的总体印象——这就引出一个问题：我们在这里是否碰到这样一些格式塔质，它们建立在一个横跨数个感觉区域的基础之上。［……］我们还必须接受：格式塔质也可以把分属不同类别的元素复合体收编进来。（Ehrenfels 1890；Smith 1988, 97）[^ehrenfels-1890][^smith-1988]
  - id: 19
    kind: body
    source: |-
      Temporal *Gestalt* qualities, on the other hand, are generated by “every change of any kind in a presentational complex, providing it proceeds in some definite direction”, specifically, if such change “reveals a unified character, so that we have (or could have) a name to designate it” (Ehrenfels 1890; Smith 1988, 97 ff.)[^ehrenfels-1890][^smith-1988], it identifies a *Gestalt* quality. While Ehrenfels seems to focus on auditory *Gestalt* phenomena such as melodies, temporal *Gestalten* can occur in any sensory domain (and across sensory domains). A good example of a visual temporal *Gestalt* would be dance (see e.g. the discussion in Cattaruzza and Coppola 2020)[^cattaruzza-2020]. However, not only change, but also persistence, such as the sustaining of a note, can give rise to a peculiar *Gestalt* quality (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988].
    step1: |-
      另一方面，时间性格式塔质则由“表象复合体中任何一种变化”生成，只要这种变化朝某个确定的方向进行；具体地说，如果这种变化“显示出一个统一的特性，以至于我们有（或可以有）一个名称来指称它”，它就标识出一个格式塔质（Ehrenfels 1890；Smith 1988, 97 ff.）[^ehrenfels-1890][^smith-1988]。埃伦费尔斯似乎聚焦于旋律这类听觉格式塔现象，但时间性格式塔可以出现在任何感觉领域（也可以跨感觉领域）。视觉时间性格式塔的一个好例子是舞蹈（例如参见 Cattaruzza and Coppola 2020 中的讨论）[^cattaruzza-2020]。不过，不只变化能产生格式塔质，持存也可以——比如一个音的持续——同样能产生一种独特的格式塔质（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]。
    step2: |-
      时间性格式塔质则来自另一路：“表象复合体中发生的任何一种变化”都能生成它，只要变化沿着某个确定方向推进；确切地说，一旦这种变化“显出一个统一的特性，以至于我们有（或可以有）一个名称去指称它”，它就标示出一个格式塔质（Ehrenfels 1890；Smith 1988, 97 ff.）[^ehrenfels-1890][^smith-1988]。埃伦费尔斯谈得最多的是旋律这类听觉格式塔现象，但时间性格式塔不限于此：任何感觉领域（乃至跨领域）都可以出现。舞蹈就是视觉时间性格式塔的好例子（例如参见 Cattaruzza and Coppola 2020 的讨论）[^cattaruzza-2020]。而且不止变化——持存同样有效：一个音的持续，也能生出一种独特的格式塔质（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]。
