      Ehrenfels argues that a *Gestalt* is more (or at least other) than the sum of its parts, which helps to explain how people can remember melodies without having absolute pitch and in different keys, which would be incompatible with the view of melodies as mere sums of tones (Ehrenfels 1890; Smith 1988, 90 ff.)[^ehrenfels-1890][^smith-1988]. Based on these preliminary observations and the rejection of simplistic objections, Ehrenfels introduces his definition of a *Gestalt*:
    step1: |-
      埃伦费尔斯论证说，格式塔多于（或至少不同于）其部分之和；这有助于解释人们何以能在没有绝对音感的情况下、并在不同的调上记住旋律——若是把旋律看作单纯的音总和，这一点就说不通（Ehrenfels 1890；Smith 1988, 90 ff.）[^ehrenfels-1890][^smith-1988]。基于这些初步观察以及对简单化反驳的拒斥，埃伦费尔斯给出了他的格式塔定义：
    step2: |-
      埃伦费尔斯的论证是：格式塔多于其部分之和——至少也是与之不同的东西。这正好解释了人们为什么没有绝对音感也能记住旋律、换个调也照记不误；倘若旋律真的只是音的总和，这两件事都无从谈起（Ehrenfels 1890；Smith 1988, 90 ff.）[^ehrenfels-1890][^smith-1988]。有了这些初步观察，又挡开了几条把问题简单化的反驳之后，埃伦费尔斯亮出他的格式塔定义：
  - id: 15
    kind: body
    source: |-
      > By a *Gestalt* quality we understand a positive content of presentation bound up in consciousness with the presence of complexes of mutually separable (i.e., independently presentable) elements. That complex of presentations which is necessary for the existence of a given *Gestalt* quality we call the foundation [*Grundlage*] of that quality. (Ehrenfels 1890; Smith 1988, 93)[^ehrenfels-1890][^smith-1988]
    step1: |-
      > 所谓格式塔质，我们指的是一种肯定的表象内容，它在意识中与诸可互相分离（即可以独立地被表象）的元素的复合体的在场绑定在一起。一个给定格式塔质的存在所必需的那个表象复合体，我们称之为该质的基础［*Grundlage*］。（Ehrenfels 1890；Smith 1988, 93）[^ehrenfels-1890][^smith-1988]
    step2: |-
      > 我们把格式塔质理解为一种肯定的表象内容：它在意识之中，与诸元素的复合体的在场结为一体，而这些元素可以彼此分离（也就是可以各自独立地被表象）。某一给定格式塔质要存在，所必需的那个表象复合体，我们就叫它这一质的基础［*Grundlage*］。（Ehrenfels 1890；Smith 1988, 93）[^ehrenfels-1890][^smith-1988]
  - id: 16
    kind: body
    source: |-
      Furthermore, he introduces an important distinction here: “We can however exhaustively partition all possible *Gestalt* qualities into the two non-overlapping categories of temporal and non-temporal.” Specifically, in the case of temporal *Gestalt* qualities “at most one element can be given in perceptual presentation”, the rest being available only in memory or anticipation, while non-temporal *Gestalt* qualities “are qualities whose foundation can be given completely in perceptual presentation” (Ehrenfels 1890; Smith 1988, 94)[^ehrenfels-1890][^smith-1988].
    step1: |-
      此外，他在这里引入一个重要区分：“不过我们可以把所有可能的格式塔质穷尽地划分为时间性与非时间性这两个不重叠的类。”具体地说，就时间性格式塔质而言，“至多只有一个元素能在知觉表象中被给予”，其余只能在记忆或预期中获得；而非时间性格式塔质“是这样一些质，其基础可以在知觉表象中被完整地给予”（Ehrenfels 1890；Smith 1988, 94）[^ehrenfels-1890][^smith-1988]。
    step2: |-
      他在这里还立起一个重要区分：“不过，我们可以把一切可能的格式塔质穷尽地分成两个互不重叠的类：时间性的与非时间性的。”具体而言，时间性格式塔质这边，“知觉表象里至多只能给出一个元素”，其余的只在记忆或预期里够得着；非时间性格式塔质那边，则是“其基础能够在知觉表象中被完整给予的那些质”（Ehrenfels 1890；Smith 1988, 94）[^ehrenfels-1890][^smith-1988]。
  - id: 17
    kind: body
    source: |-
      Harmony and timbre would be examples of non-temporal *Gestalt* qualities and with respect to chords, among others, Ehrenfels points out that “the *Gestalt* quality may sometimes force itself into the foreground, i.e., may make demands on our attention to such an extent that it is difficult to resolve its foundation into elements” (Ehrenfels 1890; Smith 1988, 95)[^ehrenfels-1890][^smith-1988]. This shows the need for abstraction to identify the various layers of tonal complexes, as we find in Stumpf’s (1883, 101) characterization of fusion of consonant tones as “less easily and completely recognized as a multiplicity”. Indeed, Ehrenfels also speaks of fusion, and like Stumpf (1890, 65 ff., 193), even of fusion (and hence *Gestalten*) among different senses:
    step1: |-
      和声与音色可以算非时间性格式塔质的例子；就和弦等情形，埃伦费尔斯指出：“格式塔质有时会强行挤到前景中来，也就是说，它对我们的注意力提出如此多的要求，以至于我们很难把它的基础分解为元素”（Ehrenfels 1890；Smith 1988, 95）[^ehrenfels-1890][^smith-1988]。这表明需要抽象来辨认音复合体的各个层次，正如斯图姆夫（1883, 101）把协和音的融合刻画为“不那么容易、也不那么完全地被认作一个多样体”。的确，埃伦费尔斯也谈融合，而且像斯图姆夫（1890, 65 ff., 193）一样，甚至谈不同感官之间的融合（因而也有格式塔）：
    step2: |-
      和声与音色可作非时间性格式塔质的例子。就和弦等情形，埃伦费尔斯指出：“格式塔质有时会硬挤到前景里来，也就是说，它对我们的注意力索求太多，以至于我们很难把它的基础分解成元素”（Ehrenfels 1890；Smith 1988, 95）[^ehrenfels-1890][^smith-1988]。可见要辨认音复合体的层层构造，非有抽象不可——斯图姆夫（1883, 101）正是把协和音的融合刻画为“不那么容易被认出、也不那么完全地被认作一个多样体”。埃伦费尔斯自己也谈融合，甚至像斯图姆夫（1890, 65 ff., 193）那样，谈到了不同感官之间的融合（以及随之而来的格式塔）：
