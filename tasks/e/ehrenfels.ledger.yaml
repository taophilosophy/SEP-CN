    kind: body
    source: |-
      As regards Ehrenfels’ philosophical pursuits, his interest in Brentano’s philosophy gave way to a receptivity to the ideas of Meinong, the new young lecturer who had also studied with Brentano, but who was already developing views of his own, particularly in the theory of relations, which diverged from Brentano’s orthodox teachings (see Rollinger 2008)[^rollinger-2008]. According to Ehrenfels’ later account, Brentano’s smooth and polished delivery did not impress him nearly as much as Meinong’s painstaking search for truth (Ehrenfels in PSIV, 426–429). Alois Höfler, another student who also preferred Meinong over Brentano (and likewise a Wagnerian), became a close friend of Ehrenfels after first meeting him in Brunn in 1876 (Valent 2016, 178)[^valent-2016]. Having started to lecture in Vienna only in 1878, Meinong was awarded a position in Graz in 1882, where Ehrenfels followed him in the winter semester of 1884/1885, after a year of military service. Ehrenfels wrote his dissertation on *Relations of Magnitude and Numbers. A Psychological Study* in Graz under Meinong’s guidance, likely based on an extensive commentary on Meinong’s 1882 article “Hume Studien II: zur Relationstheorie” (see Ierna 2017a, 165 and Ehrenfels 2017)[^ierna-2017a]. Ehrenfels returned to Vienna, where he completed his *Habilitation* (a second thesis, in addition to the doctoral thesis, in order to qualify for a teaching position) “On Feeling and Willing” (Ehrenfels 1887, in PSIII, 15–97)[^ehrenfels-1887][^ehrenfels-1887-2], in which he opposed the Brentanian doctrine concerning emotions and also laid down the psychological foundation for his later theory of value.
    step1: |-
      就其哲学追求而言，埃伦费尔斯对布伦塔诺哲学的兴趣，渐渐让位于对迈农思想的接受。迈农是这位同样出身布伦塔诺门下的年轻新讲师，却已发展出自己的观点，尤其在关系理论上与布伦塔诺的正统教导分歧（见 Rollinger 2008）[^rollinger-2008]。按埃伦费尔斯晚年的说法，布伦塔诺流畅圆熟的讲授远不如迈农艰苦卓绝的求真那样打动他（Ehrenfels in PSIV, 426–429）。阿洛伊斯·赫夫勒（Alois Höfler）是另一位宁取迈农而舍布伦塔诺的学生（同样也是瓦格纳崇拜者），1876 年在布伦初遇埃伦费尔斯后成为其挚友（Valent 2016, 178）[^valent-2016]。迈农 1878 年才开始在维也纳讲课，1882 年在格拉茨获得职位；埃伦费尔斯服完一年兵役后，于 1884/1885 年冬季学期追随他到了格拉茨。埃伦费尔斯在格拉茨迈农的指导下写成学位论文《量度关系与数：一项心理学研究》（*Relations of Magnitude and Numbers. A Psychological Study*），其基础很可能是对迈农 1882 年论文《休谟研究 II：论关系理论》（“Hume Studien II: zur Relationstheorie”）的一篇长篇评注（见 Ierna 2017a, 165 与 Ehrenfels 2017）[^ierna-2017a]。此后埃伦费尔斯回到维也纳，完成了大学任教资格论文（*Habilitation*，即在博士论文之外为取得教书资格所作的第二篇论文）《论感受与意愿》（“On Feeling and Willing”；Ehrenfels 1887, in PSIII, 15–97）[^ehrenfels-1887][^ehrenfels-1887-2]，其中他反对布伦塔诺关于情感的学说，也为其后来的价值理论奠定了心理学基础。
    step2: |-
      在哲学取向上，埃伦费尔斯起初倾心布伦塔诺，后来兴趣转移，转向了迈农。这位年轻的新讲师虽也出师布伦塔诺，却已在发育自家的观点，尤其是在关系理论上偏离了老师的正统（见 Rollinger 2008）[^rollinger-2008]。照埃伦费尔斯后来的回忆，布伦塔诺讲得再流畅圆熟，也不及迈农那种苦求真理的执拗打动他（Ehrenfels in PSIV, 426–429）。阿洛伊斯·赫夫勒（Alois Höfler）同样舍布伦塔诺而取迈农（同样是瓦格纳迷），1876 年在布伦与埃伦费尔斯初识，此后成为至交（Valent 2016, 178）[^valent-2016]。迈农 1878 年方登维也纳讲坛，1882 年获格拉茨教职；埃伦费尔斯服完一年兵役，便于 1884/1885 年冬季学期追随而至。在格拉茨，他由迈农指导完成了学位论文《量度关系与数：一项心理学研究》（*Relations of Magnitude and Numbers. A Psychological Study*），其底本多半是对迈农 1882 年论文《休谟研究 II：论关系理论》的长篇评注（见 Ierna 2017a, 165 与 Ehrenfels 2017）[^ierna-2017a]。之后他返回维也纳，完成任教资格论文（*Habilitation*，博士论文之外为取得教职而提交的第二篇论文）《论感受与意愿》（“On Feeling and Willing”；Ehrenfels 1887, in PSIII, 15–97）[^ehrenfels-1887][^ehrenfels-1887-2]——文中既反对布伦塔诺的情感学说，也为自己日后的价值理论打下心理学根基。
