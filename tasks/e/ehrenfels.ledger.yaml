      It is likely that Ehrenfels’ musical interests, particularly Wagner’s music and the concept of “*Leitmotiv*”, influenced his idea of *Gestaltqualität* and his choice of melodies as a main example. Through Wagner there may be an implicit undercurrent of German Idealism and romanticism that in Ehrenfels obtains a (Brentanist/Meinongian) psychological formulation (Höfer 2017, 34–38)[^höfer-2017].
    step1: |-
      埃伦费尔斯的音乐兴趣，尤其是瓦格纳的音乐与“主导动机”（“*Leitmotiv*”）概念，很可能影响了他的格式塔质观念以及他把旋律选为主要例子的做法。经由瓦格纳，或许还有一股德国观念论与浪漫主义的暗流，它在埃伦费尔斯那里获得了一种（布伦塔诺主义／迈农主义的）心理学表述（Höfer 2017, 34–38）[^höfer-2017]。
    step2: |-
      埃伦费尔斯的音乐趣味——特别是瓦格纳的音乐与“主导动机”（“*Leitmotiv*”）概念——多半也参与塑造了他的格式塔质观念，以及拿旋律当主要例子的选择。经由瓦格纳，德国观念论与浪漫主义或许有一条暗流潜入，到了埃伦费尔斯手里，这条暗流取得了一种（布伦塔诺派／迈农派的）心理学形态（Höfer 2017, 34–38）[^höfer-2017]。
