      The one positive side effect of monogamy is that it has led to the “sublimation of sexual affects”, as modern psychology has it, among sexually frustrated males. Since males cannot find full satisfaction for their sex drive in monogamous marriage, they divert their superfluous energy into other pursuits, such as cultural achievements of various sorts: “accumulation of ownership and possessions, economical and social organization, artistic and scientific achievements, indeed in works of charity and neighborly love” (Ehrenfels 1907, 31)[^ehrenfels-1907].
