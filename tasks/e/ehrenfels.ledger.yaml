      It is likely that Ehrenfels’ musical interests, particularly Wagner’s music and the concept of “*Leitmotiv*”, influenced his idea of *Gestaltqualität* and his choice of melodies as a main example. Through Wagner there may be an implicit undercurrent of German Idealism and romanticism that in Ehrenfels obtains a (Brentanist/Meinongian) psychological formulation (Höfer 2017, 34–38)[^höfer-2017].
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      The fundamental question with which Ehrenfels begins is the following: “Is a melody (i) a mere sum [*Zusammenfassung*] of elements, or (ii) something novel in relation to this sum, something that certainly goes hand in hand with but is distinguishable from the sum of elements?” (Ehrenfels 1890, tr. Smith 1988, 83)[^ehrenfels-1890][^smith-1988] According to Ehrenfels, insofar as Mach spoke of *Gestalten* as objects of sensation, he could not have considered them as “mere sum of elements”, but rather as something new. Indeed, Stumpf had formulated a similar conclusion, claiming that with fusion the simple elements in sensation appear as parts of one greater whole: “the qualities are not in the least changed [… ] but a new relation is introduced between them, which establishes a closer unity than that between members of a mere sum” (Stumpf 1890, 64)[^stumpf-1890]. According to Ehrenfels, as soon as one is committed to the idea that something other than the sum of the tones makes up the melody, “one has in effect accepted what we call the tonal *Gestalt*” (Ehrenfels 1890; Smith 1988, 91)[^ehrenfels-1890][^smith-1988]. More precisely:
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      > Let us suppose, on the one hand, that the series of tones *t*₁, *t*₂, *t*₃, …, *t*_{*n*}, on being sounded, is apprehended by a conscious subject *S* as a tonal *Gestalt* (so that the memory-images of all the tones are simultaneously present to him); and let us suppose also that the sum of these *n* tones, each with its particular temporal determination, is brought to presentation by n unities of consciousness in such a way that each of these *n* individuals has in his consciousness only one single tone-presentation. Then the question arises whether the consciousness *S*, in apprehending the melody, brings more to his presentation than the *n* distinct individuals taken together. (Ehrenfels 1890; Smith 1988, 85)[^ehrenfels-1890][^smith-1988]
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      Ehrenfels argues that a *Gestalt* is more (or at least other) than the sum of its parts, which helps to explain how people can remember melodies without having absolute pitch and in different keys, which would be incompatible with the view of melodies as mere sums of tones (Ehrenfels 1890; Smith 1988, 90 ff.)[^ehrenfels-1890][^smith-1988]. Based on these preliminary observations and the rejection of simplistic objections, Ehrenfels introduces his definition of a *Gestalt*:
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      > By a *Gestalt* quality we understand a positive content of presentation bound up in consciousness with the presence of complexes of mutually separable (i.e., independently presentable) elements. That complex of presentations which is necessary for the existence of a given *Gestalt* quality we call the foundation [*Grundlage*] of that quality. (Ehrenfels 1890; Smith 1988, 93)[^ehrenfels-1890][^smith-1988]
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      Furthermore, he introduces an important distinction here: “We can however exhaustively partition all possible *Gestalt* qualities into the two non-overlapping categories of temporal and non-temporal.” Specifically, in the case of temporal *Gestalt* qualities “at most one element can be given in perceptual presentation”, the rest being available only in memory or anticipation, while non-temporal *Gestalt* qualities “are qualities whose foundation can be given completely in perceptual presentation” (Ehrenfels 1890; Smith 1988, 94)[^ehrenfels-1890][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      Harmony and timbre would be examples of non-temporal *Gestalt* qualities and with respect to chords, among others, Ehrenfels points out that “the *Gestalt* quality may sometimes force itself into the foreground, i.e., may make demands on our attention to such an extent that it is difficult to resolve its foundation into elements” (Ehrenfels 1890; Smith 1988, 95)[^ehrenfels-1890][^smith-1988]. This shows the need for abstraction to identify the various layers of tonal complexes, as we find in Stumpf’s (1883, 101) characterization of fusion of consonant tones as “less easily and completely recognized as a multiplicity”. Indeed, Ehrenfels also speaks of fusion, and like Stumpf (1890, 65 ff., 193), even of fusion (and hence *Gestalten*) among different senses:
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      > The intimate fusion of touch, temperature and sometimes also taste and smell sensations into a single unified total impression raises the question of whether we do not have here *Gestalt* qualities which are built up upon a foundation belonging to several sensory regions. […] we must also accept the possibility of *Gestalt* qualities comprehending complexes of elements of different categories. (Ehrenfels 1890; Smith 1988, 97)[^ehrenfels-1890][^smith-1988]
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      Temporal *Gestalt* qualities, on the other hand, are generated by “every change of any kind in a presentational complex, providing it proceeds in some definite direction”, specifically, if such change “reveals a unified character, so that we have (or could have) a name to designate it” (Ehrenfels 1890; Smith 1988, 97 ff.)[^ehrenfels-1890][^smith-1988], it identifies a *Gestalt* quality. While Ehrenfels seems to focus on auditory *Gestalt* phenomena such as melodies, temporal *Gestalten* can occur in any sensory domain (and across sensory domains). A good example of a visual temporal *Gestalt* would be dance (see e.g. the discussion in Cattaruzza and Coppola 2020)[^cattaruzza-2020]. However, not only change, but also persistence, such as the sustaining of a note, can give rise to a peculiar *Gestalt* quality (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      Similarly to Husserl, who points to collective nouns as identifying the figural moments that characterize *Inbegriffe* (swarm, flock, herd, etc.), Ehrenfels also tries to find helpful indicators in ordinary language, but cannot but lament the poverty of the available terminology:
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      > We have to make do with a few words for isolated examples from the whole range of possible colour changes (e.g. blushing, blanching, darkening, glowing, etc.). […] Beside the musical temporal qualities already considered we have to recognize also such noise or resonance *Gestalten* as, say, thundering, exploding, rustling, splashing, etc. (Ehrenfels 1890; Smith 1988, 98, 100)[^ehrenfels-1890][^smith-1988]
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      Ehrenfels proceeds to highlight *Gestalt* qualities in almost every domain. First of all, relations also fall “under the concept of Gestalt quality” (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988], since they consist in a presentational complex of separable elements (as in the case of the similarity relation between red and orange), though the two categories cannot be straightforwardly be equated (Ehrenfels 1890; Smith 1988, 102)[^ehrenfels-1890][^smith-1988]. Also in the case where elements cannot be combined, i.e., logical incompatibility (as in the case of a round square, see Ehrenfels 1890; Smith 1988, 104 Ierna 2019)[^ehrenfels-1890][^ierna-2019][^smith-1988], there is nevertheless an unintuitive unity to the whole, which is again a *Gestalt* quality: “If I am to deny the existence of a round square, then I must be in a position to think this round square. i.e., to combine the two determinations roundness and squareness in some way or other.” (Ehrenfels 1890; Smith 1988, 103)[^ehrenfels-1890][^smith-1988]. Moreover, since one can form unintuitive presentations also when the elements are compatible, Ehrenfels argues that the movement of going from an unintuitive to the corresponding intuitive presentation gives rise to a *Gestalt* quality.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      > Thus anyone confronted with, say, a complicated description of a work of architecture will first of all form a merely indirect presentation of it, which will then be rounded out by gradual execution or fulfilment of the various merely intended components, to yield an intuitive total picture. But this process of formation of the intuitive presentation directly from the indirect presentation is something that happens, a process of change, which serves as the foundation for a specific temporal *Gestalt* quality. (Ehrenfels 1890, tr. Smith 1988, 104)[^ehrenfels-1890][^smith-1988]
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Given the *Gestalt* nature of relations, including in particular relations of comparison, Ehrenfels argues that *Gestalten* can themselves also be compared to one another and hence give rise to increasingly higher order *Gestalt* qualities. Ehrenfels suggest among other things, that temporal *Gestalten* can be compared with respect to their rhythm or that we can recognize the composer due to similarities in the melodies (Ehrenfels 1890, tr. Smith 1988, 105 ff., and again also an example to be found in Stumpf 1883, 113)[^ehrenfels-1890][^stumpf-1883][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      Importantly, Ehrenfels also argues that temporal *Gestalt* qualities are not limited to outer perception, but also occur in inner perception, where the growing or diminishing of desires, fears, expectations, etc. are compared to a crescendo or diminuendo in music (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988]. With respect to the possibility of higher-order *Gestalten*, Ehrenfels adds to this the “intimate unity with which we combine presentational contents of physical and psychical occurrences” as in all cases of deliberate actions “expressed by means of common nouns (kindness, service, rivalry, marriage, theft, war, etc.) or verbs (entreat, complain, help, rob, avenge, etc.)” (Ehrenfels 1890;. Smith 1988, 107)[^ehrenfels-1890][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      If we accept any such “union of the physical and the psychical” as the basis for a *Gestalt* quality, then of course *Gestalten* are to be found everywhere: “all designations of human individuals or groups of whatever kind (Hans and Paul, priests, manual workers, Scotsmen, rogues, etc.), as well as most designations for human corporations and institutions (state, authority, the insurance market, etc.), all names of places and territories, and equally all names of animal species” (Ehrenfels 1890; Smith 1988, 107)[^ehrenfels-1890][^smith-1988]. This leads straight to Ehrenfels’ remarkable claim that “the larger part of both our everyday and our scientific vocabulary designates *Gestalt* qualities”. Not only does every verb (with the partial exception of being and having and few others) designate a (temporal) *Gestalt*, but also “every noun and adjective having reference to more than a single presentational element” (Ehrenfels 1890; Smith 1988, 108)[^ehrenfels-1890][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      Yet a problem remains, namely whether *Gestalt* qualities arise as a result of some activity on our part when confronted with the relevant complex of elements or without any contribution of the intellect. Mach held the latter view, that “*Gestalten* are objects of ‘sensation’ just as soon as their respective foundations are given to consciousness” (Ehrenfels 1890; Smith 1988, 111)[^ehrenfels-1890][^smith-1988]. Ehrenfels points out first of all that *Gestalten* are not always noticed (e.g. proverbially seeing the trees but not the forest) and some effort seems to be required in grasping a shape by filling out and complementing the *Gestalt* suggested by the foundations, e.g. when “seeing” the third dimension suggested by the cues of a perspectival drawing (Ehrenfels 1890; Smith 1988, 111 ff.)[^ehrenfels-1890][^smith-1988]. While we do not actually generate the *Gestalt* in a separate act, specifically meant to add it to the foundation, we do expend effort in completing the required set of presentational elements needed for the *Gestalt*, which then arises spontaneously. This, however, does not exclude that different *Gestalten* may supervene on the same foundations and that we can switch between them by changing the focus of our attention. By bringing a different complex of presentational elements into the foreground, i.e., by varying the foundations, we can also (indirectly) vary the *Gestalt* (Ehrenfels 1890; Smith 1988, 112 ff.)[^ehrenfels-1890][^smith-1988].
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      Having now found *Gestalt* qualities nearly everywhere, Ehrenfels suggests “that the theory of *Gestalt* qualities would perhaps be qualified to bridge the gulf between the various sensory regions, and indeed between the various categories of the presentable in general” (Ehrenfels 1890, Smith 1988, 114)[^ehrenfels-1890][^smith-1988], which ultimately “would yield the possibility of comprehending the whole of the known world under a single mathematical formula” (Ehrenfels 1890; Smith 1988, 116)[^ehrenfels-1890][^smith-1988]. Indeed, Ehrenfels will go on to apply the concept of *Gestalt* in very disparate fields, ranging from mathematics to cosmology, thereby also bestowing a peculiar unity to his entire oeuvre (see Ierna 2017b)[^ierna-2017b].
    step1: TBD
    step2: TBD
