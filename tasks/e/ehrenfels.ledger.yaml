      ## 7. Legacy
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      It is likely that first and foremost what comes to mind when speaking of Ehrenfels’ legacy, is the idea of *Gestalt*. Whatever the inspiration by Mach or the developments in the School of Brentano, it was Ehrenfels’ article “*Über Gestaltqualitäten*” that shaped the ensuing debates. As Smith (1988, 12) observes: “The importance of Ehrenfels’ paper rests on the fact that it contains the first concentrated reflections on the question ‘what complex perceived formations such as spatial figures or melodies might be’.” Ehrenfels’ original proposal of “*Gestaltqualitäten*” still left many issues open or unclear, which were quickly taken up in various ways by his fellow Brentanians. Despite opposition against his terminological choice and the development of alternative terminologies, such as Meinong’s “founded contents” (1891, 253) and Husserl’s “figural moments” (1891, 236 n. 1) or “moments of unity” (1901, 230), Ehrenfels’ article contributed significantly to fix the terminology and many of the conceptual categories, not only in German, but also in English. Work on *Gestalt* psychology was translated into English early on and the term “*Gestalt*” was quickly taken up as technical terminology. According to Arnheim (1961, 90), “It has given a name to one of the most characteristic schools of scientific thought in our time and thereby established its existence formally. It is responsible for the word ”Gestalt“ having acquired citizenship in the English language”.
