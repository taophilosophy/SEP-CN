    kind: body
    source: |-
      Like most of Brentano’s students, Ehrenfels also wrote various works on the philosophy of mathematics: first of all his 1885 dissertation on “*Größenrelationen und Zahlen: eine psychologische Studie*” (“Relations of Magnitude and Numbers: a Psychological Study”), then his article “*Zur Philosophie der Mathematik*” (“On the Philosophy of Mathematics”) in 1891, the same year as Husserl’s *Philosophy of Arithmetic*, and finally in 1922 his booklet on *Das Primzahlengesetz* (*The Law of Prime Numbers*). As Simons (1988, 10) observes, his early mathematical works are representative of the Brentanian approach as it can also be found in Husserl’s and Stumpf’s habilitation works.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Indeed, in his (Ehrenfels 1885, Ierna 2017a)[^ehrenfels-1885][^ierna-2017a] dissertation Ehrenfels presents an account of the concept of number and the philosophy of mathematics that is for the most part the traditional Brentanian one, though unsurprisingly including many Meinongian elements. Ehrenfels claims that by abstracting from all particularities of two objects and considering them merely as the foundations of a relation of difference, we obtain the concept of two. If we then add another object, we need to compare and distinguish not only the first-order relations among the foundations, but also the second-order relation of difference among the first-order relations of difference, and so on for every additional element. This leads to a rapid increase in complication, as illustrated in Husserl’s critique of such an approach in the second chapter of the *Philosophy of Arithmetic*. Ehrenfels likewise concludes that this process of distinction soon leads beyond our limited presentational capacities and requires more convenient, though indirect, ways of presenting numbers. Hence, he argues that higher numbers can only be reached by successive presentations of partial numbers, e.g. nine by three times three.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      Ehrenfels presents an interesting account of the golden ratio (1:1.618) as the point where the relations of similarity and difference are in balance, i.e., two magnitudes that stand to each other in the golden ratio are as similar as they are different. Towards the end of the work Ehrenfels’ discussion of higher-order relations and of comparisons of relations independently of their foundations leads him into formulations that could be seen as anticipating his later concept of *Gestalt* qualities.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      In his article on the philosophy of mathematics Ehrenfels starts with an analysis of the presentation of number and the concepts of unity and multiplicity. He denies an empirical basis to number presentations: “The presentation of number is not extracted from external perception, but is actually inserted into it” (Ehrenfels 1891, 287)[^ehrenfels-1891]. Ehrenfels takes relations of difference as the foundation for the concept of multiplicity and goes on to describe the construction of numbers through counting, by successive addition of unities (Ehrenfels 1891, 289 ff.)[^ehrenfels-1891]. Like other Brentanists, he comments on the limits of our cognitive capacities and points out that we can have a presentation of higher numbers only indirectly, i.e., symbolically (Ehrenfels 1891, 292, also see 289 where he refers to Husserl 1887)[^ehrenfels-1891][^husserl-1887]. Ehrenfels here chooses the Meinongian terminology, speaking of indirect or founded contents (see his notes on 292 ff.), but also follows Brentano’s approach when remarking on the power of signs to function as surrogates for presentations (Ehrenfels 1891, 296)[^ehrenfels-1891]. He gives an extensive critique of Kant’s famous doctrine that “7+5=12” would be an example of a synthetic proposition a priori, with a quite idiosyncratic argumentation, stating that the a priori or a posteriori character of the sum would depend on the possibility of a direct intuition of its elements, i.e., a proper presentation. If we have to externalize the process by use of signs when the numbers exceed our cognitive capacities, then how can we claim to be able to perform such calculations a priori? Ehrenfels lists several examples that involve external aids, such as the use of logarithmic tables: looking up a number on a list is hardly an “a priori” cognitive act (Ehrenfels 1891, 329)[^ehrenfels-1891]. The interesting aspect of his approach is that he takes mathematics in this way as an essentially computational science, relying on external artifacts (“physical aides”) and hence as a science which necessarily has a large a posteriori component (Ehrenfels 1891, 331)[^ehrenfels-1891]. In the second half of the article, however, Ehrenfels provides a critique of J.S. Mill and empiricism in mathematics, along the same lines as Stumpf had done in his habilitation work. Like Husserl and fellow Meinong-student Konrad Zindler, he points out that in the progress of calculation with signs one often hits on “unpresentable” combinations, i.e., combinations of signs that cannot be combined into a proper presentation (Ehrenfels 1891, 342)[^ehrenfels-1891]. Yet, these “impossible” combinations do then lead to correct results. (This paragraph is based in part on Ierna 2011)[^ierna-2011].
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Ehrenfels himself assigns an important biographical role to his last major work in the philosophy of mathematics, while its actual philosophical and mathematical significance is much more modest, as we will see. Ehrenfels states in the preface to *Das Primzahlengesetz* that, after a long depression following WWI, the contemplation of the “field of numbers and their eternal, necessary connections” soothed his agonized spirit (“*Weltangst*”) (Ehrenfels 1922, III)[^ehrenfels-1922][^ehrenfels-1922-2]. In the preface to the work he retraces the development of the core idea of the book, describing very poetically how in April 1919 the idea “blossomed” in his mind about the distribution of prime numbers (Ehrenfels 1922, IV: “An einem warmen Aprilvormittag 1919 ist mir – in der Sonne gelagert neben der Gruft meines Vaters – ”der Knopf aufgegangen“ für das Wesentliche der Lösung.”)[^ehrenfels-1922][^ehrenfels-1922-2] Ehrenfels himself at first took it only as a rediscovery of already well-established mathematical insights, but having been informed by his friend and colleague the mathematician Gerhard Kowalewski that the matter of the distribution of primes was far from settled, Ehrenfels tried to work out his idea in a more systematic fashion, convinced to have hit on something new and worthwhile.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Ehrenfels’ core idea in *Das Primzahlengesetz* is to apply the notion of *Gestalt* to number series to find the law-like regularities in the distribution of prime numbers. Therefore Ehrenfels decided to include the entire text of his 1890 article “*Über Gestaltqualitäten*” in the work, unchanged, though split into two parts. In the course of his discussion, Ehrenfels once again goes down the familiar road of Brentanist mathematics: a discussion of proper and symbolic presentations of number, the limits of our presentational capacity, proper number conceptions as based on (higher order) relations of distinction, etc. (Ehrenfels 1922, 30 ff.)[^ehrenfels-1922][^ehrenfels-1922-2] He explicitly considers the proper number presentations as *Gestalt* qualities, and to be precise, as presentations of “second order”. Collections of numbers, which he calls *Zahlenfiguren*, would be of third order. These number figures play a central role in, literally, “figuring out” the prime numbers: by generating series of number figures corresponding to all multiples of a base number, which can then be combined in such a way as to filter out the primes.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      However, in the end the result of this procedure turns out to be quite trivial from a mathematical perspective: “It actually merely leads to a simplification of the method known as the ”Sieve of Eratosthenes“ already being practiced for more than 2000 years” (Ehrenfels 1922, 48)[^ehrenfels-1922][^ehrenfels-1922-2]. The method of the sieve consists in identifying and then eliminating all divisible numbers by generating them from multiplications of primes. If one wants to find all the prime numbers between 0 and 100, one would proceed by striking all multiples of two, then all multiples of three, etc. until only the primes remain. Ehrenfels’ approach shortens the process by avoiding repeated strikings, as would happen e.g. with 6 as multiple of both 2 and 3 (Ehrenfels 1922, 49)[^ehrenfels-1922][^ehrenfels-1922-2]. As Simons (1986, 112) argues, this is merely computationally faster than the traditional method of the sieve of Eratosthenes (but slower than other methods, as experimentally verified by Simons 1988, 12)[^simons-1988], but not a substantially new algorithm.
