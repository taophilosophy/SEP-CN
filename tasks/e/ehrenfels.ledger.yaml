      The fundamental question with which Ehrenfels begins is the following: “Is a melody (i) a mere sum [*Zusammenfassung*] of elements, or (ii) something novel in relation to this sum, something that certainly goes hand in hand with but is distinguishable from the sum of elements?” (Ehrenfels 1890, tr. Smith 1988, 83)[^ehrenfels-1890][^smith-1988] According to Ehrenfels, insofar as Mach spoke of *Gestalten* as objects of sensation, he could not have considered them as “mere sum of elements”, but rather as something new. Indeed, Stumpf had formulated a similar conclusion, claiming that with fusion the simple elements in sensation appear as parts of one greater whole: “the qualities are not in the least changed [… ] but a new relation is introduced between them, which establishes a closer unity than that between members of a mere sum” (Stumpf 1890, 64)[^stumpf-1890]. According to Ehrenfels, as soon as one is committed to the idea that something other than the sum of the tones makes up the melody, “one has in effect accepted what we call the tonal *Gestalt*” (Ehrenfels 1890; Smith 1988, 91)[^ehrenfels-1890][^smith-1988]. More precisely:
    step1: |-
      埃伦费尔斯由之出发的根本问题是：“旋律（i）是诸元素的单纯总和［*Zusammenfassung*］，还是（ii）相对于这一总和而言的某种新东西——某种确定与之相伴、却可与之区别开来的东西？”（Ehrenfels 1890，tr. Smith 1988, 83）[^ehrenfels-1890][^smith-1988] 在埃伦费尔斯看来，马赫既然把格式塔当作感觉的对象来谈，就不可能把它们视为“诸元素的单纯总和”，而只能视作某种新东西。事实上，斯图姆夫已表述过一个类似的结论：经由融合，感觉中的简单元素显现为一个更大整体的诸部分——“性质丝毫未变［……］，但在它们之间引入了一种新关系，这种关系建立起比单纯总和的成员之间更紧密的统一”（Stumpf 1890, 64）[^stumpf-1890]。按埃伦费尔斯的说法，一旦有人认定除了各音的总和之外还有别的东西构成旋律，他“实际上就已经接受了我们所说的音调格式塔”（Ehrenfels 1890；Smith 1988, 91）[^ehrenfels-1890][^smith-1988]。更确切地说：
    step2: |-
      埃伦费尔斯开宗明义的根本问题是：“旋律（i）是诸元素的单纯总和［*Zusammenfassung*］，还是（ii）相对于这个总和而言的某种新东西——它固然与总和结伴而行，却又能与之区分开来？”（Ehrenfels 1890，tr. Smith 1988, 83）[^ehrenfels-1890][^smith-1988] 依埃伦费尔斯之见，马赫既然拿格式塔当感觉对象来说事，就断不至于把它们当作“诸元素的单纯总和”，而只能当新东西看。斯图姆夫其实早已下过近似的断语：经过融合，感觉里的简单元素就作为更大整体的各部分显现出来——“性质分毫未变［……］，只是其间引入了一种新关系，它确立起一种比单纯总和的成员之间更紧密的统一”（Stumpf 1890, 64）[^stumpf-1890]。在埃伦费尔斯看来，谁要是认定旋律并非只由各音之和构成，“谁就实际上接受了我们所谓的音调格式塔”（Ehrenfels 1890；Smith 1988, 91）[^ehrenfels-1890][^smith-1988]。更精确地说：
  - id: 13
    kind: body
    source: |-
      > Let us suppose, on the one hand, that the series of tones *t*₁, *t*₂, *t*₃, …, *t*_{*n*}, on being sounded, is apprehended by a conscious subject *S* as a tonal *Gestalt* (so that the memory-images of all the tones are simultaneously present to him); and let us suppose also that the sum of these *n* tones, each with its particular temporal determination, is brought to presentation by n unities of consciousness in such a way that each of these *n* individuals has in his consciousness only one single tone-presentation. Then the question arises whether the consciousness *S*, in apprehending the melody, brings more to his presentation than the *n* distinct individuals taken together. (Ehrenfels 1890; Smith 1988, 85)[^ehrenfels-1890][^smith-1988]
    step1: |-
      > 让我们一方面假定：音序列 *t*₁, *t*₂, *t*₃, …, *t*_{*n*} 在鸣响时被一个有意识的主体 *S* 觉知为一个音调格式塔（这样一来，所有各音的记忆图像同时向他呈现）；另一方面再假定：这 *n* 个音的总和——每个音都带着其特定的时间规定——由 *n* 个意识统一体带到表象之中，而这 *n* 个个体每一个的意识里只有单独一个音表象。于是问题来了：意识 *S* 在把握这段旋律时，带到其表象中的东西是否多于这 *n* 个不同个体加在一起的东西。（Ehrenfels 1890；Smith 1988, 85）[^ehrenfels-1890][^smith-1988]
    step2: |-
      > 且作两重假定。其一：音列 *t*₁, *t*₂, *t*₃, …, *t*_{*n*} 奏响之时，被一个有意识的主体 *S* 把握为一个音调格式塔（此时所有各音的记忆图像同时向他在场）；其二：这 *n* 个音的总和——各音各带其特定的时间规定——由 *n* 个意识统一体带入表象，而 *n* 个个体中的每一个，其意识里只有单独一个音表象。于是问题浮现：意识 *S* 在把握旋律时带入表象的东西，是否多于这 *n* 个互异的个体合在一起所具有的。（Ehrenfels 1890；Smith 1988, 85）[^ehrenfels-1890][^smith-1988]
  - id: 14
    kind: body
