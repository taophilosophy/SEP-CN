      Ehrenfels lectured in Vienna during the summer semesters from 1891, while travelling in the winter semesters. In 1894 he met the young widow Emma von Hartmann at a meeting of the *Academic Wagner Society* and married her in the same year. In 1896 he was awarded a position at the University of Prague (PSII, 21 ff.) where he would become a full professor in 1899 and, despite initial misgivings, remain until his retirement. This of course meant that he was a colleague of Marty (in large measure an orthodox follower of Brentano), who in fact found Ehrenfels’ non-cognitivist orientation in value theory completely reprehensible. When Ehrenfels supported hiring Höfler in Prague as a professor of pedagogy, this brought him into bitter conflict with Marty, who even ascribed “naive egoism” to him (Dölling 1999, 141; Valent 2016, 194; Janoušek and Rollinger 2017, 314)[^dölling-1999][^janoušek-2017][^valent-2016]. Ehrenfels maintained a close relationship with Meinong and, unlike Meinong himself and Höfler, managed to stay on good terms with Brentano. However much Ehrenfels drew upon ideas of Meinong or anyone else, however, he spent his years in Prague as an independent thinker and teacher. Both Franz Kafka, Felix Weltsch, and Max Brod were familiar with Ehrenfels as a teacher and found him to be a rather colorful and interesting figure (see also the quotation from Emma von Ehrenfels’ biographic sketch in PSII, 26).
    step1: |-
      自 1891 年起，埃伦费尔斯夏季学期在维也纳讲课，冬季学期则外出游历。1894 年，他在“学术瓦格纳协会”（*Academic Wagner Society*）的一次聚会上结识年轻寡妇埃玛·冯·哈特曼（Emma von Hartmann），同年成婚。1896 年他获布拉格大学职位（PSII, 21 ff.），1899 年升任正教授，虽有起初的疑虑，仍在此任职直至退休。这自然意味着他成了马蒂的同事（马蒂在很大限度上是布伦塔诺的忠实追随者），而马蒂实际上认为埃伦费尔斯在价值理论中的非认知主义取向完全要不得。埃伦费尔斯支持聘赫夫勒到布拉格任教育学教授，这使他与马蒂发生激烈冲突，马蒂甚至把“幼稚利己主义”加在他头上（Dölling 1999, 141；Valent 2016, 194；Janoušek and Rollinger 2017, 314）[^dölling-1999][^janoušek-2017][^valent-2016]。埃伦费尔斯与迈农保持密切关系，并且不像迈农本人和赫夫勒那样，他与布伦塔诺也始终相处融洽。然而，无论埃伦费尔斯从迈农或他人那里汲取了多少思想，他在布拉格的岁月里始终是一位独立的思想者与教师。弗朗茨·卡夫卡、费利克斯·韦尔奇与马克斯·布罗德都熟识作为教师的埃伦费尔斯，觉得他是个相当多彩而有趣的人物（另见埃玛·冯·埃伦费尔斯生平小传中的引文，PSII, 26）。
    step2: |-
      从 1891 年起，埃伦费尔斯每逢夏季学期在维也纳授课，冬季学期则外出游历。1894 年，他在“学术瓦格纳协会”（*Academic Wagner Society*）的一次聚会上遇见年轻寡妇埃玛·冯·哈特曼（Emma von Hartmann），当年便结了婚。1896 年他获布拉格大学教职（PSII, 21 ff.），1899 年升正教授；尽管起初心存疑虑，他还是在这个位置上一直干到退休。这意味着他与马蒂成了同事——马蒂大体是布伦塔诺的忠实追随者——而在马蒂看来，埃伦费尔斯价值理论里的非认知主义取向简直一无是处。埃伦费尔斯又支持聘赫夫勒来布拉格当教育学教授，为此与马蒂闹得极僵，马蒂甚至说他“幼稚利己主义”（Dölling 1999, 141；Valent 2016, 194；Janoušek and Rollinger 2017, 314）[^dölling-1999][^janoušek-2017][^valent-2016]。埃伦费尔斯同迈农始终过从甚密；而且不像迈农和赫夫勒那样，他与布伦塔诺也一直保持良好关系。不过，无论从迈农或旁人那里吸取了多少东西，埃伦费尔斯在布拉格的岁月终究是以独立思想者和教师的身份度过的。弗朗茨·卡夫卡、费利克斯·韦尔奇、马克斯·布罗德都熟悉这位老师，觉得他是个颇有声色、引人入胜的人物（另见埃玛·冯·埃伦费尔斯所写生平小传中的引文，PSII, 26）。
