      At variance with many other pupils of Brentano, Ehrenfels did not establish a school or movement of his own, although he was the first teacher of Max Wertheimer in Prague. While Ehrenfels’ work sketched the larger picture and provided a general framework to approach *Gestalt* phenomena, many of the details were worked out subsequently by the Graz and Berlin schools of *Gestalt* psychology, formed by the students of Meinong (Stephan Witasek and Vittorio Benussi) and Stumpf (Max Wertheimer, Kurt Koffka and Wolfgang Köhler). Systematically, these schools differ mainly in their views on how *Gestalt* qualities originate. Contra Ehrenfels, the Graz school argued that *Gestalten* are actively produced by our intellect on the basis of the *Gestalt* switch phenomenon (see, among others, Smith 1994, 259 ff.)[^smith-1994]. The Berlin school instead claimed that the *Gestalt* itself is given first and foremost in perception and that its constituents are abstracted from it. Perceptual contents would not have a *Gestalt*, but be a *Gestalt* (see Smith 1988, 13)[^smith-1988].
