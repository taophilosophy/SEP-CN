      Given the *Gestalt* nature of relations, including in particular relations of comparison, Ehrenfels argues that *Gestalten* can themselves also be compared to one another and hence give rise to increasingly higher order *Gestalt* qualities. Ehrenfels suggest among other things, that temporal *Gestalten* can be compared with respect to their rhythm or that we can recognize the composer due to similarities in the melodies (Ehrenfels 1890, tr. Smith 1988, 105 ff., and again also an example to be found in Stumpf 1883, 113)[^ehrenfels-1890][^stumpf-1883][^smith-1988].
    step1: |-
      鉴于关系（尤其是比较关系）的格式塔本性，埃伦费尔斯论证说，格式塔本身也可以相互比较，从而产生越来越高阶的格式塔质。埃伦费尔斯举例说，时间性格式塔可以就其节奏进行比较，或者我们可以凭旋律之间的相似认出作曲家（Ehrenfels 1890，tr. Smith 1988, 105 ff.；在 Stumpf 1883, 113 中也可以找到又一个例子）[^ehrenfels-1890][^stumpf-1883][^smith-1988]。
    step2: |-
      关系既有格式塔的本性——比较关系尤其如此——格式塔彼此之间自然也可以比较，于是产生越来越高的高阶格式塔质。埃伦费尔斯举的例子有：时间性格式塔可以按节奏来比较；我们也能凭旋律之间的相似认出作曲家是谁（Ehrenfels 1890，tr. Smith 1988, 105 ff.；Stumpf 1883, 113 里同样能找到一例）[^ehrenfels-1890][^stumpf-1883][^smith-1988]。
  - id: 25
    kind: body
    source: |-
      Importantly, Ehrenfels also argues that temporal *Gestalt* qualities are not limited to outer perception, but also occur in inner perception, where the growing or diminishing of desires, fears, expectations, etc. are compared to a crescendo or diminuendo in music (Ehrenfels 1890; Smith 1988, 101)[^ehrenfels-1890][^smith-1988]. With respect to the possibility of higher-order *Gestalten*, Ehrenfels adds to this the “intimate unity with which we combine presentational contents of physical and psychical occurrences” as in all cases of deliberate actions “expressed by means of common nouns (kindness, service, rivalry, marriage, theft, war, etc.) or verbs (entreat, complain, help, rob, avenge, etc.)” (Ehrenfels 1890;. Smith 1988, 107)[^ehrenfels-1890][^smith-1988].
    step1: |-
      重要的是，埃伦费尔斯还论证说，时间性格式塔质不限于外知觉，也出现在内知觉之中：欲望、恐惧、期待等的增长或减退，可比作音乐中的渐强或渐弱（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]。谈到高阶格式塔的可能性，埃伦费尔斯在此之外又加上“我们把物理事项与心理事项的表象内容结合在一起时那种亲密的统一”；一切有意行动皆属此类，“它们借普通名词（仁慈、效劳、竞争、婚姻、偷窃、战争等）或动词（恳求、抱怨、帮助、抢劫、复仇等）得到表达”（Ehrenfels 1890；Smith 1988, 107）[^ehrenfels-1890][^smith-1988]。
    step2: |-
      还有一点要紧：埃伦费尔斯主张，时间性格式塔质不只在外知觉中出没，也现身于内知觉——欲望、恐惧、期待的消长起落，就像音乐里的渐强与渐弱（Ehrenfels 1890；Smith 1988, 101）[^ehrenfels-1890][^smith-1988]。至于高阶格式塔的可能性，埃伦费尔斯在此之上又添了“我们把物理事项与心理事项的表象内容结合在一起时那种亲密的统一”：一切有意行动都属于这类情形，它们“借普通名词（仁慈、效劳、竞争、婚姻、偷窃、战争等）或动词（恳求、抱怨、帮助、抢劫、复仇等）得到表达”（Ehrenfels 1890；Smith 1988, 107）[^ehrenfels-1890][^smith-1988]。
  - id: 26
    kind: body
    source: |-
      If we accept any such “union of the physical and the psychical” as the basis for a *Gestalt* quality, then of course *Gestalten* are to be found everywhere: “all designations of human individuals or groups of whatever kind (Hans and Paul, priests, manual workers, Scotsmen, rogues, etc.), as well as most designations for human corporations and institutions (state, authority, the insurance market, etc.), all names of places and territories, and equally all names of animal species” (Ehrenfels 1890; Smith 1988, 107)[^ehrenfels-1890][^smith-1988]. This leads straight to Ehrenfels’ remarkable claim that “the larger part of both our everyday and our scientific vocabulary designates *Gestalt* qualities”. Not only does every verb (with the partial exception of being and having and few others) designate a (temporal) *Gestalt*, but also “every noun and adjective having reference to more than a single presentational element” (Ehrenfels 1890; Smith 1988, 108)[^ehrenfels-1890][^smith-1988].
    step1: |-
      如果我们接受任何这样一种“物理东西与心理东西的联合”作为格式塔质的基础，那么格式塔当然无处不在：“人类个体或群体的一切指称，无论何种类型（汉斯与保罗、教士、体力劳动者、苏格兰人、无赖等），以及人类团体与机构的大多数指称（国家、当局、保险市场等）、一切地名与疆域名，同样还有一切动物物种的名称”（Ehrenfels 1890；Smith 1988, 107）[^ehrenfels-1890][^smith-1988]。这直接通向埃伦费尔斯那个引人注目的主张：“我们日常词汇与科学词汇的较大部分都指称格式塔质”。不只每个动词（“是”与“有”及少数其他词部分例外）都指称一个（时间性）格式塔，而且“每个涉及多于单个表象元素的名词与形容词”也是如此（Ehrenfels 1890；Smith 1988, 108）[^ehrenfels-1890][^smith-1988]。
    step2: |-
      一旦接受这样一种“物理与心理的联合”充当格式塔质的基础，格式塔自然就遍地都是了：“凡是人类个体或群体的指称，无论哪一类（汉斯与保罗、教士、干体力活的、苏格兰人、无赖等），连同人类团体与机构的大多数指称（国家、当局、保险市场等）、一切地名与疆域名，以及一切动物物种的名称，统统在内”（Ehrenfels 1890；Smith 1988, 107）[^ehrenfels-1890][^smith-1988]。这就径直通向埃伦费尔斯那个惊人的论断：“我们日常与科学词汇的较大部分，指称的都是格式塔质”。不止每个动词（“是”“有”与少数其他词算部分例外）都指称一个（时间性）格式塔，“每个涉及不止一个表象元素的名词和形容词”也一概如此（Ehrenfels 1890；Smith 1988, 108）[^ehrenfels-1890][^smith-1988]。
