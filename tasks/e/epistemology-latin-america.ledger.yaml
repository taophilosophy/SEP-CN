      While Porchat’s studies on skepticism (all but one, Porchat Pereira 2013, collected in his 2007 book)[^porchat-2013] bear almost exclusively on the Pyrrhonism expounded in the extant works of the second-century physician Sextus Empiricus, de Olaso’s are concerned not only with Sextus’s Pyrrhonism (de Olaso 1983, 1988, 1992)[^olaso-1983], but also with Hume’s and Leibniz’s discussions of skepticism, particularly in its Pyrrhonian variety (de Olaso 1974, 1977, 1978, 1980, 1984)[^olaso-1974]. Towards the very end of his life, de Olaso’s writings focused on epistemology as practiced in the analytic tradition: e.g., he offered an analysis of the concepts of certainty, knowledge, and skepticism, and of their relations, in both modern and contemporary philosophy (de Olaso 1999)[^olaso-1999], but without making an original contribution to the present-day debates on those issues. While Porchat considered himself a skeptic, de Olaso did not, adopting a much more critical approach to skepticism. We will here focus on Porchat both because he claimed to adopt a neo-Pyrrhonian stance and particularly because it has been said that his writings offer significant epistemological reflections on skepticism. However, first, when discussing ancient Pyrrhonism in his published work, he seldom touches on, or proposes solutions to, the most complex interpretive and philosophical questions posed by Sextus’s presentation of Pyrrhonism, and he cursorily engages with only a tiny part of the vast specialist literature. We make this remark because some of those questions extensively discussed in the secondary literature concern intriguing epistemological problems: e.g., the epistemic challenge posed by the Five Modes of Agrippa, the attack on the criterion of truth, the Pyrrhonist’s stance on the standards of justification and norms of rationality, and the possibility of skeptical inquiry. And secondly, when proposing his neo-Pyrrhonism, he completely disregards the hundreds of epistemological studies on skepticism in general or on Pyrrhonism in particular published especially since the late 1970s. The reason is simply that Porchat does not engage in any systematic discussion of epistemological matters. (For a different appraisal of Porchat’s work, see Smith & Bueno 2016 and Smith 2018.)[^smith-2016][^smith-2018][^smith-2016-2]
    step1: |-
      波尔沙特关于怀疑论的研究（除 Porchat Pereira 2013 一篇外，均收入其 2007 年著作）[^porchat-2013] 几乎只涉及二世纪医生塞克斯都·恩披里柯现存著作所阐述的皮浪主义；德·奥拉索的研究则不限于塞克斯都的皮浪主义（de Olaso 1983, 1988, 1992）[^olaso-1983]，还涉及休谟与莱布尼茨对怀疑论——尤其是其皮浪主义一路——的讨论（de Olaso 1974, 1977, 1978, 1980, 1984）[^olaso-1974]。在其生命最后阶段，德·奥拉索的写作转向分析传统中的认识论：例如，他在近代与当代哲学中分析确定性、知识与怀疑论诸概念及其关系（de Olaso 1999）[^olaso-1999]，但并未对当代相关论争作出原创贡献。波尔沙特自认怀疑论者，德·奥拉索则不，他对怀疑论采取远为批判的态度。此处我们将聚焦波尔沙特：既因为他自称采取新皮浪主义立场，尤其因为据说他的著作为怀疑论提供了重要的认识论反思。然而，第一，在其已刊著作中讨论古代皮浪主义时，他很少触及、更少提出方案去解决塞克斯都的皮浪主义阐述所引发的最复杂的解释与哲学问题，只是浮光掠影地涉及大量专门文献中的极小部分。我们作此评论，是因为二手文献中广泛讨论的某些问题关涉引人入胜的认识论难题：例如，阿格里帕五式所提的认识论挑战、对真理标准的攻击、皮浪主义者关于辩护标准与合理性规范的立场，以及怀疑论探究的可能性。第二，在提出其新皮浪主义时，他完全无视自 1970 年代后期以来尤其大量涌现的、关于一般怀疑论或皮浪主义的上百种认识论研究。原因很简单：波尔沙特并不从事任何系统的认识论讨论。（对波尔沙特工作的不同评价，见 Smith & Bueno 2016 与 Smith 2018。）[^smith-2016][^smith-2018][^smith-2016-2]
    step2: |-
      波尔沙特论怀疑论的文章（除 Porchat Pereira 2013 一篇外，皆收入其 2007 年著作）[^porchat-2013] 几乎只谈一个题目：二世纪医生塞克斯都·恩披里柯现存著作中的皮浪主义。德·奥拉索则不然，他的研究既及塞克斯都的皮浪主义（de Olaso 1983, 1988, 1992）[^olaso-1983]，也及休谟与莱布尼茨关于怀疑论的讨论，尤其是皮浪主义一路（de Olaso 1974, 1977, 1978, 1980, 1984）[^olaso-1974]。晚年，德·奥拉索转向分析传统中的认识论：例如在近代与当代哲学中分析确定性、知识与怀疑论诸概念及其关系（de Olaso 1999）[^olaso-1999]，只是未对当代相关论争有原创贡献。波尔沙特自认怀疑论者，德·奥拉索不然，他对怀疑论的态度远为批判。这里我们聚焦波尔沙特，原因有二：他自称取新皮浪主义立场；尤有甚者，据说他的著作为怀疑论提供了重要的认识论反思。然而，其一，他在已刊著作中处理古代皮浪主义时，对塞克斯都阐述所引发的那些最复杂的解释与哲学问题，或极少触及，或提不出方案。对浩繁的专门文献，他也只是浮泛地涉及极小一部分。我们提及这一点，是因为二手文献中讨论甚多的若干问题，牵涉引人入胜的认识论难题。阿格里帕五式所提的认识论挑战、对真理标准的攻击、皮浪主义者关于辩护标准与合理性规范的立场、怀疑论探究是否可能，皆在其列。其二，他提出新皮浪主义时，完全不顾自 1970 年代后期以来涌现的上百种认识论研究，无论泛论怀疑论还是专论皮浪主义。原因很简单：波尔沙特根本不做系统的认识论讨论。（对波尔沙特工作的另一种评价，见 Smith & Bueno 2016、Smith 2018。）[^smith-2016][^smith-2018][^smith-2016-2]
