      A leading international specialist in database theory, the Argentinian Alberto Mendelzon (1951–2005), also deserves a mention because of his key contribution to the theory of belief change. He obtained a B.Sc. from UBA as well as a M.S.E., a M.A., and a Ph.D. from Princeton University. From 1980 until his death, he taught at the University of Toronto. He also contributed to the creation of UBA’s computer science department in the early 1980s. In 1992 he published, together with Hirofumi Katsuno, a highly influential paper that addresses the issue of updating knowledge bases (Katsuno & Mendelzon 1992)[^katsuno-1992]. They distinguished between two kinds of modification to a knowledge base: *update* and *revision*. While the former consists in bringing the knowledge base up to date when the world it describes changes, the latter consists in modifying the knowledge base when new information about a static world is acquired. Mendelzon and Katsuno claimed that the AGM postulates describe only *revision* and hence that, in order to describe *update*, the AGM theory should be considerably modified by adding new postulates. (On Mendelzon’s work on belief change, see also Katsuno & Mendelzon 1989 and 1991.)[^katsuno-1989][^katsuno-1991]
    step1: |-
      国际知名的数据库理论专家、阿根廷人阿尔贝托·门德尔松（1951–2005）也值得提及，因为他对信念变更理论有重要贡献。他在 UBA 取得理学士，并在普林斯顿大学取得理学硕士、文学硕士与博士。自 1980 年起直至去世，他在多伦多大学任教。他还在 1980 年代早期参与创建 UBA 计算机科学系。1992 年，他与 Hirofumi Katsuno 发表一篇影响极大的论文，处理知识库更新问题（Katsuno & Mendelzon 1992）[^katsuno-1992]。他们区分了对知识库的两种修改：*更新* 与 *修正*。前者是在所描述的世界变化时使知识库跟上时势；后者是在获得关于静态世界的新信息时修改知识库。门德尔松与 Katsuno 主张，AGM 公设只描述 *修正*，故要描述 *更新*，必须通过增加新公设而对 AGM 理论作相当修改。（关于门德尔松的信念变更工作，另见 Katsuno & Mendelzon 1989 与 1991。）[^katsuno-1989][^katsuno-1991]
    step2: |-
      还有一位值得提及：国际知名的数据库理论专家、阿根廷人阿尔贝托·门德尔松（1951–2005），他对信念变更理论贡献甚大。理学士得自 UBA，理学硕士、文学硕士与博士得自普林斯顿大学。1980 年起至去世，他在多伦多大学执教，1980 年代初还参与创办了 UBA 的计算机科学系。1992 年，他与 Hirofumi Katsuno 合发一文，影响极大，专论知识库的更新（Katsuno & Mendelzon 1992）[^katsuno-1992]。二人把对知识库的修改分为两种：**更新** 与 **修正**。前者是在所描述的世界发生变化时，让知识库跟上时势；后者是在获得关于静态世界的新信息时，改动知识库。他们主张：AGM 公设所描述的只是 **修正**；要描述 **更新**，就得为 AGM 理论增补新公设，作相当大的改动。（门德尔松的信念变更工作，另见 Katsuno & Mendelzon 1989、1991。）[^katsuno-1989][^katsuno-1991]
  - id: 46
