      Cresto’s initial interest in skepticism arose under the influence of de Olaso, who supervised her B.A. thesis at the Universidad de Buenos (UBA). She later on pursued her M.A, M.Phil., and Ph.D. at Columbia University. Currently a researcher at CONICET and a professor at the Universidad Nacional de Tres de Febrero in Argentina, she works primarily in formal epistemology (on which see Section 4). In her first published papers, she critically examined both reliabilist and naturalistic anti-skeptical responses proposed in the literature, finding them unsatisfactory (Cresto 1996a, 1996b)[^cresto-1996a], but also put forward a reliabilist reply of her own to skepticism (Cresto 1997)[^cresto-1997].
    step1: |-
      克雷斯托最初对怀疑论的兴趣，是在德·奥拉索指导下产生的——后者指导了她在布宜诺斯艾利斯大学（UBA）的学士论文。她后来在哥伦比亚大学攻读硕士、哲学硕士与博士。她现任阿根廷国家科学技术研究委员会（CONICET）研究员，特雷斯德费布雷罗国立大学教授，主要研究形式认识论（见第 4 节）。在最初发表的论文中，她批判考察了文献中提出的可靠主义与自然主义反怀疑论回应，认为二者皆不能令人满意（Cresto 1996a, 1996b）[^cresto-1996a]，但也提出了她自己的一种可靠主义回应（Cresto 1997）[^cresto-1997]。
    step2: |-
      克雷斯托最初对怀疑论的兴趣，源自德·奥拉索——他在布宜诺斯艾利斯大学（UBA）指导了她的学士论文。此后她在哥伦比亚大学攻读硕士、哲学硕士与博士。她现任阿根廷国家科学技术研究委员会（CONICET）研究员、特雷斯德费布雷罗国立大学教授，主治形式认识论（见第 4 节）。她最初的论文批判考察了文献中的可靠主义与自然主义反怀疑论回应，认为皆难令人满意（Cresto 1996a, 1996b）[^cresto-1996a]；不过她也提出了自己的一套可靠主义回应（Cresto 1997）[^cresto-1997]。
