      Meléndez is a professor at the Universidad Nacional de Colombia, where he also obtained his Ph.D. in philosophy. In his 1998 book, he explores the notion of truth from the vantage point of Wittgenstein’s later philosophy, although he also takes into account the conception of truth defended in the *Tractatus*. Meléndez’s main aim is to call into question the attempts to construct a general theory of truth that would make it rest on an ultimate and unshakable foundation. In a later publication, he discusses Wittgenstein’s examination of the notions of justification, persuasion, and world-picture (*Weltbild*) in *On Certainty*, focusing on whether world-pictures are taken to be incommensurable and hence on whether Wittgenstein endorses a form of epistemic relativism (Meléndez 2014)[^meléndez-2014].
    step1: |-
      梅伦德斯是哥伦比亚国立大学教授，也在该校取得哲学博士。在其 1998 年的著作中，他从维特根斯坦后期哲学的视角探讨真理概念，同时也考虑《逻辑哲学论》所捍卫的真理观。梅伦德斯的主要目标是质疑那些试图构造一般真理理论、使之立足于某个终极而不可动摇的基础的尝试。在后来的论著中，他讨论维特根斯坦在《论确定性》中对辩护、说服与世界图景（*Weltbild*）诸概念的考察，聚焦于世界图景是否被视为不可通约，因而维特根斯坦是否持某种认知相对主义（Meléndez 2014）[^meléndez-2014]。
    step2: |-
      梅伦德斯是哥伦比亚国立大学教授，哲学博士亦得自该校。其 1998 年著作从后期维特根斯坦的视角探讨真理概念，兼及《逻辑哲学论》所持的真理观。他要质疑的，是那些构造一般真理理论、并使之奠基于某个终极而不可动摇之基础的尝试。后来的论著讨论维特根斯坦在《论确定性》中对辩护、说服与世界图景（*Weltbild*）的考察，焦点在于：世界图景是否被视为彼此不可通约，从而维特根斯坦是否持某种认知相对主义（Meléndez 2014）[^meléndez-2014]。
