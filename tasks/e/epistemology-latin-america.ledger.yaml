      Alchourrón’s main line of research concerned the theory of belief change, which basically deals with the question of how a belief set is to be updated in light of new information. In 1985 he published, together with Peter Gändenfors and David Makinson, a seminal article in which they advanced an axiomatic theory that has come to be known as “the AGM theory of belief change”, “the AGM account of the logic of belief change”, or “the AGM theory of belief revision” (Alchourrón, Gändenfors, & Makinson 1985; cf. Alchourrón & Makinson 1982, 1985, 1986)[^alchourrón-1982]. The AGM theory identifies three types of belief change: expansion, contraction, and revision, focusing on the last two. Roughly put, expansion consists in adding to a given belief set a new belief that does not conflict with the current beliefs of the set; contraction involves removing a belief from the set; and revision amounts to adding a new belief to the set and removing others from it so that the resulting set stays consistent. The AGM theory proposes six basic and two supplementary postulates for each of the two operations of contraction and revision that every appropriate belief-change method must satisfy. Since its appearance in 1985, the AGM theory has had a tremendous impact on subsequent discussions of belief change, becoming the predominant paradigm, even though some of its main assumptions have been questioned and several modifications or extensions of it have been proposed (for an overview, see Arló-Costa & Fermé 2010 and Hansson 2011; see also Fermé & Hansson 2011, which is a special issue on the occasion of the 25 years of the AGM theory)[^arló-costa-2010][^arló-costa-2010-2][^arló-costa-2011][^fermé-2011][^hansson-2011]. The theory has also had a considerable influence on research on artificial intelligence (on which see Carnota & Rodríguez 2010)[^carnota-2010]. Towards the end of his life, Alchourrón’s work focused on the logic of defeasible conditionals (Alchourrón 1993, 1995, 1996; see Fermé & Rodríguez 2006 for an analysis of his theory of conditionals)[^alchourrón-1993][^fermé-2006].
    step1: |-
      阿尔丘龙的主要研究路线是信念变更理论，它基本上处理这样的问题：信念集应如何依新信息更新。1985 年，他与彼得·加登福斯、大卫·梅金森发表一篇奠基性文章，提出一套公理化理论，后来被称为“AGM 信念变更理论”“AGM 信念变更逻辑”或“AGM 信念修正理论”（Alchourrón, Gändenfors, & Makinson 1985; 参 Alchourrón & Makinson 1982, 1985, 1986）[^alchourrón-1982]。AGM 理论区分三类信念变更：扩充、收缩与修正，重点关注后两类。粗略地说，扩充是向给定信念集加入一个与集内现有信念不冲突的新信念；收缩是从集中移除一个信念；修正则是向集内加入新信念并移除其他信念，使所得集合保持一致。AGM 理论为收缩与修正这两种运算各提出六个基本公设与两个补充公设，任何恰当的信念变更方法都必须满足。自 1985 年问世以来，AGM 理论对随后的信念变更讨论影响巨大，成为主流范式，尽管其某些主要假定受到质疑，也提出了若干修改或扩展（概述见 Arló-Costa & Fermé 2010 与 Hansson 2011；另见 Fermé & Hansson 2011，那是 AGM 理论二十五周年专号）[^arló-costa-2010][^arló-costa-2010-2][^arló-costa-2011][^fermé-2011][^hansson-2011]。该理论对人工智能研究也有相当影响（见 Carnota & Rodríguez 2010）[^carnota-2010]。晚年，阿尔丘龙的工作集中于可废止条件句的逻辑（Alchourrón 1993, 1995, 1996；其条件句理论的分析见 Fermé & Rodríguez 2006）[^alchourrón-1993][^fermé-2006]。
    step2: |-
      阿尔丘龙的主攻方向是信念变更理论，其基本问题是：信念集该怎样依新信息更新。1985 年，他与彼得·加登福斯、大卫·梅金森合发一篇奠基之作，提出一套公理化理论，后世称之为“AGM 信念变更理论”“AGM 信念变更逻辑”或“AGM 信念修正理论”（Alchourrón, Gändenfors, & Makinson 1985；参 Alchourrón & Makinson 1982, 1985, 1986）[^alchourrón-1982]。AGM 理论把信念变更分为三类：扩充、收缩、修正，而重心在后两类。粗略言之：扩充是往既定信念集里添入一个与集内诸信念不相冲突的新信念；收缩是从集中撤去一个信念；修正是添入新信念、同时撤去其他信念，使所得之集保持融贯。收缩与修正这两种运算，AGM 各设六个基本公设与两个补充公设，凡恰当的信念变更方法皆须满足。1985 年问世以来，AGM 理论对信念变更的后续讨论影响极大，成为主流范式——尽管其中若干主要假定已遭质疑，修改与扩展之议亦层出不穷（综述见 Arló-Costa & Fermé 2010、Hansson 2011；另见 Fermé & Hansson 2011，为 AGM 理论二十五周年专号）[^arló-costa-2010][^arló-costa-2010-2][^arló-costa-2011][^fermé-2011][^hansson-2011]。它对人工智能研究也颇有影响（见 Carnota & Rodríguez 2010）[^carnota-2010]。晚年，阿尔丘龙专注于可废止条件句的逻辑（Alchourrón 1993, 1995, 1996；其条件句理论之分析见 Fermé & Rodríguez 2006）[^alchourrón-1993][^fermé-2006]。
