      There has also been some discussion of the concept of knowledge in terms of both reliability and fallibility. Let us begin with the former. Succinctly put, reliabilism holds that a belief is knowledge if it is true and if it was produced, or is sustained, by a reliable process that yields mostly true beliefs. Reliabilist theories of knowledge require a reliable mechanism for belief formation, but do not require that the epistemic agent be aware or have evidence of the mechanism’s reliability. For this reason, reliabilism is a form of externalism. Juan Comesaña (on whom see the previous section) has proposed an original theory of epistemic justification that combines elements of both reliabilism and evidentialism—which represent two competing approaches in contemporary analytic epistemology. This theory, which he calls “evidentialist reliabilism”, is intended to incorporate the best aspects of both positions while avoiding the most serious problems they face (Comesaña 2010)[^comesaña-2010]. Comesaña has also argued that reliabilism is able to successfully deal with the so-called “generality problem” (Comesaña 2006b)[^comesaña-2006b], and that the epistemological problems stemming from lotteries either are not peculiar to reliabilism or can be solved by appealing to a probabilistic account of reliability (Comesaña 2009b)[^comesaña-2009b]. He has as well referred to reliability in his discussion of “safety”. Several epistemologists (such as Ernest Sosa, Timothy Williamson, and Duncan Pritchard) have defended the view that safety is a necessary condition for knowledge. Roughly put, what that condition says is that *S* knows that *p* if and only if *S* would believe that *p* only if *p* were true. On the basis of a counterexample, Comesaña (2005) has argued that safety, as this notion has been defined by Sosa, is not actually a necessary condition for knowledge. The reason is that, whereas reliability is plausibly a necessary condition for knowledge, reliable reliability is not, and whereas knowledge is compatible with unreliably reliable beliefs, safety is not. Hence, one can have “unsafe” knowledge. Comesaña’s more recent work in collaboration with Matthew McGrath and Stewart Cohen has focused on the part played by false beliefs in epistemology. He has argued that false propositions can be part of one’s evidence or can be reasons to do something (Comesaña & McGrath 2014, 2016)[^comesaña-2014] and, against Williamson, that one can have rational or justified false beliefs (Cohen & Comesaña 2013a, 2013b, forthcoming)[^cohen-2013a].
    step1: |-
      关于知识概念，也有一些讨论围绕可靠性与可错性展开。先说前者。简言之，可靠主义主张：一个信念若为真，且由（或持续由）一个多半产生真信念的可靠过程产生，便是知识。可靠主义的知识理论要求有可靠的信念形成机制，但不要求认知主体意识到该机制的可靠性或有其证据。故可靠主义是外在主义的一种。胡安·科梅萨尼亚（见上节）提出了一种原创的认知辩护理论，兼采可靠主义与证据主义——二者是当代分析认识论中两条相互竞争的进路。这一理论他称为“证据主义式可靠主义”，意在吸收二者的长处，同时避开它们各自最严重的问题（Comesaña 2010）[^comesaña-2010]。科梅萨尼亚还论证：可靠主义能成功应对所谓“一般性问题”（Comesaña 2006b）[^comesaña-2006b]；源于抽奖的认识论难题，要么并非可靠主义所特有，要么可借概率式的可靠性说明解决（Comesaña 2009b）[^comesaña-2009b]。他在讨论“安全性”时也提到可靠性。若干认识论者（如索萨、威廉姆森、普里查德）主张安全性是知识的必要条件。粗略地说，该条件是说：*S* 知道 *p*，当且仅当 *S* 只有在 *p* 为真时才会相信 *p*。科梅萨尼亚（2005）以一个反例论证，按索萨的定义，安全性其实并非知识的必要条件。理由在于：可靠性多半是知识的必要条件，但可靠的可靠性却不是；知识可与不可靠地可靠的信念相容，安全性却不能。故人可以拥有“不安全的”知识。科梅萨尼亚与马修·麦格拉思、斯图尔特·科恩合作的晚近工作，聚焦于虚假信念在认识论中的作用。他论证虚假命题可以成为证据的一部分，也可以成为做某事的理由（Comesaña & McGrath 2014, 2016）[^comesaña-2014]；并针对威廉姆森论证，人可以拥有合理的或有辩护的虚假信念（Cohen & Comesaña 2013a, 2013b, forthcoming）[^cohen-2013a]。
    step2: |-
      围绕知识概念，另有一路讨论涉及可靠性与可错性。先说可靠性。可靠主义大致主张：一个信念只要为真，且由（或持续由）多半产生真信念的可靠过程产生，便是知识。它要求有可靠的信念形成机制，却不要认知主体意识到这机制的可靠性、或握有其证据；故可靠主义属于外在主义。胡安·科梅萨尼亚（见上节）提出一套原创的认知辩护理论，兼采可靠主义与证据主义——当代分析认识论中两条相争的进路。他称之为“证据主义式可靠主义”，意在兼取二者之长，避开各自最棘手的问题（Comesaña 2010）[^comesaña-2010]。他还论证：可靠主义足以应对所谓“一般性问题”（Comesaña 2006b）[^comesaña-2006b]；源于抽奖的认识论难题，或非可靠主义所独有，或可借概率式的可靠性说明化解（Comesaña 2009b）[^comesaña-2009b]。谈“安全性”时，他也提到可靠性。索萨、威廉姆森、普里查德等若干认识论者主张，安全性是知识的必要条件。粗略地说，这条件是说：*S* 知道 *p*，当且仅当 *S* 只有在 *p* 为真时才会相信 *p*。科梅萨尼亚（2005）举一反例论证：依索萨的定义，安全性其实并不是知识的必要条件。理由是：可靠性多半是知识的必要条件，可靠的可靠性却不然；知识可与不可靠地可靠的信念相容，安全性则不能。故人可以有“不安全”的知识。晚近，科梅萨尼亚与马修·麦格拉思、斯图尔特·科恩合作，聚焦虚假信念在认识论中的作用：他论证虚假命题可以是证据的一部分，也可以是做某事的理由（Comesaña & McGrath 2014, 2016）[^comesaña-2014]；又针对威廉姆森论证，人可以拥有合理、有辩护的虚假信念（Cohen & Comesaña 2013a, 2013b, forthcoming）[^cohen-2013a]。
