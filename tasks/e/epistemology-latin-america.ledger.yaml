      Regarding formal epistemology in Argentina, one may finally refer to a number of works by Eleonora Cresto, who completed her Ph.D. under the supervision of Isaac Levi. Her first publications in the field were concerned with formal belief-revision theories (Cresto 2008, 2010b)[^cresto-2008]. She later on offered a defense of a moderate version of the so-called KK principle—according to which if *S* knows that *p*, then *S* knows that she knows that *p*—as a normative rather than descriptive epistemic principle. Her defense of such a principle of epistemic transparency is different from that traditionally proposed by epistemic internalists inasmuch as her argument is a formal one that appeals to lower- and higher-order probabilities (Cresto 2012)[^cresto-2012]. Cresto’s more recent research in the subfield of formal epistemology focuses on such topics as group knowledge and probability aggregation (Cresto 2015a, 2016, 2017)[^cresto-2015a].
    step1: |-
      关于阿根廷的形式认识论，最后可提到埃莱奥诺拉·克雷斯托的若干工作，她在艾萨克·列维指导下完成博士论文。她在此领域的首批论著关注形式信念修正理论（Cresto 2008, 2010b）[^cresto-2008]。后来她为所谓 KK 原则的温和版本辩护——按此原则，若 *S* 知道 *p*，则 *S* 知道自己知道 *p*——把它作为规范性而非描述性的认识论原则。她对这一认知透明性原则的辩护不同于认知内在主义者传统上提出的辩护，因为她的论证是形式论证，诉诸低阶与高阶概率（Cresto 2012）[^cresto-2012]。克雷斯托在形式认识论分支中较晚近的研究，聚焦群体知识与概率聚合等主题（Cresto 2015a, 2016, 2017）[^cresto-2015a]。
    step2: |-
      阿根廷形式认识论的最后一位，可举埃莱奥诺拉·克雷斯托，其博士论文由艾萨克·列维指导。她在这一领域的首批论著讨论形式信念修正理论（Cresto 2008, 2010b）[^cresto-2008]。后来她为所谓 KK 原则的温和版辩护——按此原则，*S* 若知道 *p*，便知道自己知道 *p*——但把它当作规范性的而非描述性的认识论原则。她对认知透明性原则的辩护，不同于认知内在主义的传统辩护：其论证取形式，诉诸低阶与高阶概率（Cresto 2012）[^cresto-2012]。她较晚近的形式认识论研究，围绕群体知识与概率聚合等题目（Cresto 2015a, 2016, 2017）[^cresto-2015a]。
