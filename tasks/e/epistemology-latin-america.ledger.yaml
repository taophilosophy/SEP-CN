      As regards fallibilism, it is safe to say that nearly all present-day epistemologists are fallibilists: we sometimes make mistakes—occasionally even about those things we deem to be most evident—despite having good justification for our beliefs. More precisely, *S* fallibly knows that *p* in case, despite the good justification underlying one’s knowledge, *S*’s belief that *p* might have been false or might have been accidentally true (cf. Reed 2002)[^reed-2002]. Hurtado (2000) rejects such a virtually unanimous position—which he defines as “the doctrine that any of our beliefs might turn out to be false”—on the grounds both that it is revisionist and that we lack good reasons to accept it. Fallibilism is revisionist because, he argues, it runs counter to common sense both by erasing the ordinary distinction between those beliefs that cannot be false and those that can, and by claiming that no evidence or no reasons can guarantee the truth of a given belief. And there are no good reasons to accept fallibilism because Hurtado claims to be able to refute what he describes as the historico-pragmatic, epistemological, and ethical arguments in its favor, and because he believes that fallibilism is dialectically weak against both skepticism and dogmatism.
    step1: |-
      关于可错主义，可以说当今几乎所有认识论者都是可错主义者：我们有时会出错——偶尔甚至在我们视为最明显的事情上出错——尽管我们的信念有良好的辩护。更精确地说：*S* 可错地知道 *p*，是说尽管知识背后有良好辩护，*S* 关于 *p* 的信念仍可能为假，或可能只是碰巧为真（参 Reed 2002）[^reed-2002]。乌尔塔多（2000）拒斥这一近乎一致的立场——他称之为“我们任何信念都可能被证明为假”的学说——理由有二：它是修正主义的；我们缺乏接受它的好理由。说它修正主义，是因为它违背常识：既抹去了不可为假的信念与可为假的信念之间通常的区分，又主张没有任何证据或理由能保证某一信念为真。说没有好理由接受它，是因为乌尔塔多自称能驳倒他所描述的、为其辩护的历史—实用主义论证、认识论论证与伦理论证，并认为可错主义在辩证上既无力对付怀疑论，也无力对付独断论。
    step2: |-
      至于可错主义，可以说今天几乎所有认识论者都持此说：我们有时会弄错，偶尔连自以为最显然的事也弄错，尽管信念本有良好辩护。说得精确些：*S* 可错地知道 *p*，是说纵有良好辩护，*S* 关于 *p* 的信念仍可能为假，或可能只是碰巧为真（参 Reed 2002）[^reed-2002]。乌尔塔多（2000）偏要反对这一近乎人人首肯的立场——他称之为“我们任何信念都可能被证明为假”的学说——理由是：它属于修正主义，且我们没有好理由接受它。说它修正主义，是因它违逆常识：一面抹去不可为假与可为假两类信念之间寻常的界线，一面宣称没有任何证据或理由能保证某信念为真。说没有好理由，是因乌尔塔多自谓能驳倒他为它归纳的历史—实用主义、认识论与伦理三类论证，并认为可错主义在辩证上对怀疑论与独断论都显软弱。
