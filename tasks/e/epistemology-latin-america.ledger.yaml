      It should finally be pointed out that in Brazil there has been some discussion of the philosophical connections between Wittgenstein’s thought and Pyrrhonian skepticism—a comparison first made, to the best of my knowledge, by Richard Watson (1969) and Robert Fogelin (1981). Plínio Junqueira Smith (1993) has claimed that there are strong similarities between Wittgenstein’s later philosophy and the Pyrrhonism expounded in Sextus Empiricus’s surviving works. For instance, according to Smith, both reject the conception of philosophy as a theory that provides us with knowledge of the essence of things that lies beneath their surface, conceiving of it instead as an ability and a therapeutic practice whose function is negative and critical. Smith’s interpretation was later on called into question by Paulo Roberto Margutti Pinto—currently a professor at the Faculdade Jesuíta de Filosofia e Teologia—who maintained that, although there exist similarities, they are merely superficial while the differences are radical: e.g., while the Pyrrhonist accepts that there are philosophical problems to be solved, Wittgenstein dissolves them by appealing to the way in which words are used in ordinary language (Margutti Pinto 1996)[^margutti-1996].
    step1: |-
      最后应指出，巴西曾有关于维特根斯坦思想与皮浪主义怀疑论之哲学关联的讨论——据我所知，这一比较最早由理查德·沃森（1969）与罗伯特·福格林（1981）提出。普利尼奥·荣凯拉·史密斯（1993）主张，维特根斯坦后期哲学与塞克斯都·恩披里柯现存著作所阐述的皮浪主义有强烈相似之处。例如，据史密斯，二者都拒斥把哲学视为提供关于事物表层之下本质之知识的理论，而视之为一种能力与治疗实践，其功能是否定性的、批判性的。史密斯的解释后来受到保罗·罗贝托·马尔古蒂·平托的质疑——他现任耶稣会哲学与神学院教授——后者主张，虽有相似，却仅浮于表面，差异则是根本的：例如，皮浪主义者承认有哲学问题待解决，维特根斯坦则诉诸日常语言中词语的用法，将其消解（Margutti Pinto 1996）[^margutti-1996]。
    step2: |-
      最后应指出，巴西讨论过维特根斯坦思想与皮浪主义怀疑论的哲学关联——据我所知，这一比较最早见于理查德·沃森（1969）与罗伯特·福格林（1981）。普利尼奥·荣凯拉·史密斯（1993）主张，后期维特根斯坦与塞克斯都·恩披里柯现存著作中的皮浪主义，相似之处甚强。例如据他看，二者都拒斥把哲学当作提供表层之下事物本质之知识的理论，而视之为一种能力、一种治疗实践，其功能是否定性的、批判性的。史密斯的解释后来受到保罗·罗贝托·马尔古蒂·平托的质疑。马尔古蒂·平托现任耶稣会哲学与神学院教授，他认为相似只是表面的，差异才是根本的。皮浪主义者承认有哲学问题有待解决，维特根斯坦却诉诸日常语言中词语的用法，把问题消解掉（Margutti Pinto 1996）[^margutti-1996]。
