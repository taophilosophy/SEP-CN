  - id: 11
    kind: body
    source: |-
      It is safe to say that skepticism is the main issue discussed by Latin American scholars working in epistemology, judging by the number of works devoted to it. In addition, in certain Latin American countries there is a short but strong tradition of scholarship on both the history and the philosophical significance of skepticism. This is why it is the first topic to be addressed in this entry.
    step1: |-
      从相关论著的数量判断，可以说怀疑论是拉美认识论学者讨论的主要问题。此外，某些拉美国家在怀疑论的历史与哲学意义上，有着虽短却强的学术传统。故本词条先讨论这一主题。
    step2: |-
      以论著数量判断，怀疑论是拉美认识论学者着力最多的问题。此外，若干拉美国家研究怀疑论之历史与哲学意义的传统虽短，却相当扎实。故本词条先论此题。
  - id: 12
    kind: body
    source: |-
      As Cresto (2010a: 468) points out, the study of the history of skepticism is one of the lines of research to be considered when providing an overview of epistemological investigation in Latin America. But contrary to what she claims, it is hard to find any systematic epistemological discussion of skepticism in the numerous works in which Latin American scholars have dealt with the history of ancient or modern skepticism. Still, it is primarily in connection with the study of ancient Pyrrhonism that the field has seen the emergence of systematic discussions of the nature of skepticism and the epistemic challenges it raises. Pyrrhonism is the variety of skepticism most commonly dealt with in the works of Latin American academics, both in general and in connection with epistemological issues.
    step1: |-
      正如克雷斯托（Cresto 2010a: 468）所指出的，怀疑论史研究是概览拉美认识论研究时应予考虑的研究路线之一。但与她的说法相反，在拉美学者处理古代或近代怀疑论史的大量论著中，很难找到对怀疑论的系统的认识论讨论。不过，正是在古代皮浪主义研究方面，该领域出现了关于怀疑论本性及其所提认识论挑战的系统讨论。皮浪主义是拉美学者论著中最常处理的怀疑论类型，无论一般而论还是就认识论问题而论。
    step2: |-
      克雷斯托（Cresto 2010a: 468）指出，怀疑论史研究是概览拉美认识论研究时该纳入的路线之一。但与她的说法相反，拉美学者处理古代或近代怀疑论史的大量论著中，很难找到对怀疑论的系统的认识论讨论。系统性的讨论主要出现于古代皮浪主义研究中：怀疑论的本性何在、它提出怎样的认识论挑战，都有人系统作答。拉美学者论著中最常处理的怀疑论类型，正是皮浪主义，一般而论如此，就认识论问题而论亦如此。
  - id: 13
    kind: body
    source: |-
      The Latin American tradition of scholarship on the history of ancient and modern skepticism started in the 1970s with Oswaldo Porchat Pereira (1933–2017) in Brazil and Ezequiel de Olaso (1932–1996) in Argentina, who were in close contact and co-organized two conferences on skepticism: one in Campinas (Brazil) in 1986 and one in Buenos Aires (Argentina) in 1992. Porchat pursued his undergraduate and graduate studies in philosophy at the Universidade de São Paulo (USP), obtaining a Ph.D. with a dissertation on Aristotle’s conception of science. He spent research periods in the United States, the United Kingdom, and France, where he was heavily influenced by French historians of philosophy. He was professor at USP and the founder of both the philosophy department and the Centro de Lógica, Epistemologia e História da Ciência (on which see Section 1) at UNICAMP.
    step1: |-
      拉美关于古今怀疑论史的学术传统，始于 1970 年代巴西的奥斯瓦尔多·波尔沙特·佩雷拉（1933–2017）与阿根廷的埃塞基埃尔·德·奥拉索（1932–1996）；二人交往密切，共同组织了两次怀疑论会议：1986 年在巴西坎皮纳斯，1992 年在阿根廷布宜诺斯艾利斯。波尔沙特在圣保罗大学（USP）完成哲学本科与研究生学业，以一篇论亚里士多德科学观的论文获博士学位。他曾在美国、英国与法国从事研究，深受法国哲学史家影响。他是 USP 教授，也是 UNICAMP 哲学系与逻辑、认识论与科学史中心（见第 1 节）的创建者。
    step2: |-
      拉美研究古今怀疑论史的传统，起于 1970 年代的巴西人奥斯瓦尔多·波尔沙特·佩雷拉（1933–2017）与阿根廷人埃塞基埃尔·德·奥拉索（1932–1996）。两人交往密切，合办过两次怀疑论会议：1986 年在巴西坎皮纳斯，1992 年在阿根廷布宜诺斯艾利斯。波尔沙特在圣保罗大学（USP）读完哲学本科与研究生，博士论文写亚里士多德的科学观。他曾赴美、英、法从事研究，受法国哲学史家影响甚深。他是 USP 教授，也是 UNICAMP 哲学系与逻辑、认识论与科学史中心（见第 1 节）的创办人。
