      Eleonora Cresto (on whom see Section 2) has devoted some papers to examining core epistemological issues. For instance, adopting a moderately Peircean perspective, she has called into question the traditional picture of knowledge attribution according to which one can attribute knowledge of *p* to *S* only if *p* is true and *S* is epistemically justified in believing in *p*. Cresto maintains that epistemic justification (understood either in internalist or externalist terms) is not *always* viewed as a necessary condition for knowledge, and hence as a necessary condition for making a correct knowledge attribution, according to our pre-theoretical usage of standard epistemic terms (Cresto 2018; cf. Cresto 2012: 928–929)[^cresto-2012][^cresto-2018].
