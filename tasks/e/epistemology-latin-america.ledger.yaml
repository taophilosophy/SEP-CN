      Smith, who pursued his undergraduate and graduate studies in philosophy at USP, is probably the Brazilian scholar most influenced by Porchat’s teaching and writings. He is currently a professor at the Universidade Federal de São Paulo (UNIFESP) and the editor of the Brazilian journal *Sképsis* (2007)—one of the two journals devoted to skepticism (co-)edited in Latin America. Although his work bears mainly on the history of modern skepticism, Smith has recently written somewhat more epistemologically oriented papers devoted to Porchat’s skeptical stance (Smith 2015)[^smith-2015] and to what he regards as Barry Stroud’s neo-Pyrrhonism (Smith 2016)[^smith-2016][^smith-2016-2].
    step1: |-
      史密斯在 USP 完成哲学本科与研究生学业，大概是受波尔沙特授课与著作影响最深的巴西学者。他现任圣保罗联邦大学（UNIFESP）教授，并主编巴西刊物《探究》（*Sképsis*，2007）——拉美（合）办的两份怀疑论专门刊物之一。其工作主要涉及近代怀疑论史，但近来也写了若干更偏认识论的论文，讨论波尔沙特的怀疑论立场（Smith 2015）[^smith-2015]，以及他所理解的巴里·斯特劳德的新皮浪主义（Smith 2016）[^smith-2016][^smith-2016-2]。
    step2: |-
      史密斯在 USP 读完哲学本科与研究生，大约是受波尔沙特授课与著作影响最深的巴西学者。他现任圣保罗联邦大学（UNIFESP）教授，主编巴西刊物《探究》（*Sképsis*，2007）——拉美（合）办的两份怀疑论专刊之一。其研究以近代怀疑论史为主，近来也写了几篇更偏认识论的论文，讨论波尔沙特的怀疑论立场（Smith 2015）[^smith-2015]，以及他所理解的巴里·斯特劳德的新皮浪主义（Smith 2016）[^smith-2016][^smith-2016-2]。
