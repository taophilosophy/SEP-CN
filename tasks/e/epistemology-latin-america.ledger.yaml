      A second key contributor to the development of formal epistemology, not only in Latin America but worldwide, was Horacio Arló-Costa (1956–2011). Born in Montevideo (Uruguay), he pursued his undergraduate studies at UBA, obtaining his B.A. in philosophy under the supervision of Alchourrón, and was a member of Alchourrón’s logic group since its founding. He later on obtained his Ph.D. in philosophy at Columbia University under the supervision of Isaac Levi, with whom he would collaborate in a number of publications. From 1997 until his death, he worked at Carnegie Mellon University, where he helped found the Center for Formal Epistemology. Arló-Costa made significant contributions to the study of the logic of belief change (Arló-Costa 1990, 2006; Arló-Costa & Levi 2006)[^arló-costa-1990][^arló-costa-2006][^arló-costa-2006-2], conditionals (Arló-Costa 1995, 1999; Arló-Costa & Levi 1996)[^arló-costa-1995][^arló-costa-1996][^arló-costa-1995-2][^arló-costa-1996-2], Bayesian epistemology (Arló-Costa 2001, Arló-Costa & Thomason 2001, Arló-Costa & Parikh 2005, Arló-Costa & Pedersen 2012)[^arló-costa-2001][^arló-costa-2005][^arló-costa-2012][^arló-costa-2001-2], and rationality and decision theory (Arló-Costa 1996; Arló-Costa, Collins, & Levi 1995; Arló-Costa & Helzner 2010; Arló-Costa & Pedersen 2011, 2013)[^arló-costa-1996][^arló-costa-2010][^arló-costa-2010-2][^arló-costa-1996-2][^arló-costa-2011]. (For a brief presentation of Arló-Costa’s original contributions to those subjects as well as to modal logic, see Cresto 2011.)[^cresto-2011]
    step1: |-
      形式认识论发展的第二位关键贡献者，不仅对拉美、而且对全世界而言，是奥拉西奥·阿尔洛-科斯塔（1956–2011）。他生于乌拉圭蒙得维的亚，在 UBA 读本科，在阿尔丘龙指导下取得哲学学士，并自该逻辑小组成立起便是成员。后来他在哥伦比亚大学在艾萨克·列维指导下取得哲学博士，并与列维合作发表多种论著。1997 年起直至去世，他在卡内基梅隆大学工作，并协助创办了形式认识论中心。阿尔洛-科斯塔在信念变更逻辑（Arló-Costa 1990, 2006; Arló-Costa & Levi 2006）[^arló-costa-1990][^arló-costa-2006][^arló-costa-2006-2]、条件句（Arló-Costa 1995, 1999; Arló-Costa & Levi 1996）[^arló-costa-1995][^arló-costa-1996][^arló-costa-1995-2][^arló-costa-1996-2]、贝叶斯认识论（Arló-Costa 2001, Arló-Costa & Thomason 2001, Arló-Costa & Parikh 2005, Arló-Costa & Pedersen 2012）[^arló-costa-2001][^arló-costa-2005][^arló-costa-2012][^arló-costa-2001-2]、以及合理性与决策论（Arló-Costa 1996; Arló-Costa, Collins, & Levi 1995; Arló-Costa & Helzner 2010; Arló-Costa & Pedersen 2011, 2013）[^arló-costa-1996][^arló-costa-2010][^arló-costa-2010-2][^arló-costa-1996-2][^arló-costa-2011] 等方面都有重要贡献。（关于阿尔洛-科斯塔在这些题目以及模态逻辑上的原创贡献的简要介绍，见 Cresto 2011。）[^cresto-2011]
    step2: |-
      形式认识论发展的第二位关键人物，于拉美、于世界皆然，是奥拉西奥·阿尔洛-科斯塔（1956–2011）。他生于蒙得维的亚，本科就读于 UBA，在阿尔丘龙指导下取得哲学学士，自逻辑小组成立即为成员。其后赴哥伦比亚大学，在艾萨克·列维指导下获哲学博士，并屡与列维合作发表。1997 年起至去世，他在卡内基梅隆大学任职，并参与创办形式认识论中心。他的重要贡献遍及信念变更逻辑（Arló-Costa 1990, 2006; Arló-Costa & Levi 2006）[^arló-costa-1990][^arló-costa-2006][^arló-costa-2006-2]、条件句（Arló-Costa 1995, 1999; Arló-Costa & Levi 1996）[^arló-costa-1995][^arló-costa-1996][^arló-costa-1995-2][^arló-costa-1996-2]、贝叶斯认识论（Arló-Costa 2001, Arló-Costa & Thomason 2001, Arló-Costa & Parikh 2005, Arló-Costa & Pedersen 2012）[^arló-costa-2001][^arló-costa-2005][^arló-costa-2012][^arló-costa-2001-2] 与合理性及决策论（Arló-Costa 1996; Arló-Costa, Collins, & Levi 1995; Arló-Costa & Helzner 2010; Arló-Costa & Pedersen 2011, 2013）[^arló-costa-1996][^arló-costa-2010][^arló-costa-2010-2][^arló-costa-1996-2][^arló-costa-2011]。（关于他在这些问题及模态逻辑上的原创贡献，Cresto 2011 有简要介绍。）[^cresto-2011]
