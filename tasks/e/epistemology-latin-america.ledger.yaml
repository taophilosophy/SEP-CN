      Another former student of Alchourrón to be mentioned is the Argentinian Eduardo Fermé (b. 1964), who was also a member of Alchourrón’s group when it became interdisciplinary. Currently a professor at the Universidad de Madeira (Portugal), he obtained his B.A. and Ph.D. in computer science at UBA, and his Ph.D. in philosophy at the Royal Institute of Technology (Sweden). Fermé’s research has focused mainly on theory contraction and on epistemic entrenchment, extending or modifying in several of his publications the AGM theory (Fermé 1998, 2000, 2001; Fermé & Hansson 1999; Fermé & Reis 2013)[^fermé-1998][^fermé-1999][^fermé-2013].
    step1: |-
      另一位应提及的阿尔丘龙旧学生是阿根廷人爱德华多·费尔梅（1964 年生），在该小组转为跨学科时也是成员。他现任葡萄牙马德拉大学教授，在 UBA 取得计算机科学学士与博士，并在瑞典皇家理工学院取得哲学博士。费尔梅的研究主要集中于理论收缩与认知固化，在多篇论著中扩展或修改了 AGM 理论（Fermé 1998, 2000, 2001; Fermé & Hansson 1999; Fermé & Reis 2013）[^fermé-1998][^fermé-1999][^fermé-2013]。
    step2: |-
      还应提及阿尔丘龙的另一位旧学生：阿根廷人爱德华多·费尔梅（1964 年生），小组转为跨学科时他也在其中。他现任葡萄牙马德拉大学教授；计算机科学学士与博士得自 UBA，哲学博士得自瑞典皇家理工学院。费尔梅主治理论收缩与认知固化，多次著文扩展或修改 AGM 理论（Fermé 1998, 2000, 2001; Fermé & Hansson 1999; Fermé & Reis 2013）[^fermé-1998][^fermé-1999][^fermé-2013]。
