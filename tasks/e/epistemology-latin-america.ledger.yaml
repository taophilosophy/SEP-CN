      The Instituto de Investigaciones Filosóficas is where Luis Villoro (1922–2014) spent the bulk of his academic career. Born in Barcelona (Spain) to a Mexican mother and a Spanish father, and raised in Spain and Belgium, he settled in Mexico at the outbreak of the Second World War and became a Mexican citizen. He did his undergraduate and graduate studies at the Universidad Autónoma de México and spent research periods in France and Germany. In 1982, he published the first analytically oriented book on epistemology written in Spanish: *Creer, saber, conocer* (Villoro 1982)[^villoro-1982], translated into English as *Belief, Personal, and Propositional Knowledge* (Villoro 1998)[^villoro-1998]. Villoro examined fundamental concepts such as belief, knowledge, truth, objectivity, and epistemic communities. He distinguished between *saber* and *conocer*, which roughly correspond to what may be called “propositional” and “personal knowledge”, respectively, the latter consisting in having direct experiences of a given object. *S* can assert that he has personal knowledge of *x* provided that he has the relevant personal experiences, but if *S* wants to justify to someone else the claim that he has such knowledge of *x*, *S* must show that he has propositional knowledge of his personal knowledge. Villoro seems to have defended a form of epistemic relativism inasmuch as he claimed that to know (in the sense of *saber*) that *p* is to believe that *p*, and to have objectively sufficient reasons to so believe—an objectively sufficient reason being one that is conclusive, coherent, and complete—but also maintained that what is considered as an objectively sufficient reason in one epistemic community may not be so considered in another. For this reason, he claimed that empirical knowledge is fallible: on the basis of the reasons that are objectively sufficient for any member of his epistemic community, *S* knows that *p*, but he cannot rule out the possibility that there might be contrary reasons available to a different epistemic community that would undermine his knowledge that *p*. Objectively sufficient reasons are our best guarantee of empirical truths, but they do not of necessity imply such truths (Villoro 1982: 180, 192)[^villoro-1982]. Villoro held that the view that all knowledge is socially conditioned is the only valid alternative to skepticism (1982: 164). He also proposed a surprising reform of the traditional concept of knowledge: the notion of truth should not be included in the definition of knowledge because, even though the notion of an *objectively* sufficient reason cannot be *understood* without the notion of truth, one may know that *p* even if *p* is not true, for truth is not a necessary condition for a reason to be objectively sufficient (1982: ch. 8). (For a fuller overview of Villoro’s book, see Cresto 2010a: 474–477.)[^cresto-2010a]
    step1: |-
      路易斯·比略罗（1922–2014）的学术生涯大半在哲学研究所度过。他生于西班牙巴塞罗那，母亲是墨西哥人，父亲是西班牙人，在西班牙与比利时长大，二战爆发时定居墨西哥并加入墨西哥籍。他在墨西哥自治大学完成本科与研究生学业，并在法国与德国从事研究。1982 年，他出版了第一部以西班牙语写作的分析取向的认识论著作：《相信、知道、认识》（*Creer, saber, conocer*；Villoro 1982）[^villoro-1982]，英译本为 *Belief, Personal, and Propositional Knowledge*（Villoro 1998）[^villoro-1998]。比略罗考察了信念、知识、真理、客观性与认知共同体等基本概念。他区分了 *saber* 与 *conocer*，二者大致对应于所谓“命题性知识”与“个人知识”，后者在于对某一对象的直接经验。*S* 只要具有相关的个人经验，便可声称对 *x* 有个人知识；但若 *S* 要向他人证成自己拥有这种知识，*S* 就必须表明自己对自己的个人知识有命题性知识。比略罗似乎捍卫某种认知相对主义：他主张，知道（*saber* 意义上的）*p*，就是相信 *p*，并有客观充分的理由如此相信——客观充分的理由须是决定性的、融贯的与完整的——但他同时主张，在一个认知共同体中被视为客观充分的理由，在另一个共同体中未必如此。因此他主张经验知识是可错的：基于对其认知共同体任何成员都客观充分的理由，*S* 知道 *p*，但他无法排除另一种可能：另一个认知共同体掌握着相反的理由，足以瓦解他关于 *p* 的知识。客观充分的理由是我们对经验真理的最佳保证，但并不必然蕴含这些真理（Villoro 1982: 180, 192）[^villoro-1982]。比略罗认为，一切知识都受社会制约这一观点，是怀疑论唯一有效的替代方案（1982: 164）。他还提出一项对传统知识概念出人意料的改革：真理概念不应纳入知识的定义，因为尽管没有真理概念就无法 **理解** 客观充分的理由这一概念，人们却可以在 *p* 不真的情况下知道 *p*——真理并非理由成为客观充分的必要条件（1982: ch. 8）。（关于比略罗此书更完整的概述，见 Cresto 2010a: 474–477。）[^cresto-2010a]
    step2: |-
      路易斯·比略罗（1922–2014）的学术生涯大半在哲学研究所度过。他生于巴塞罗那，母为墨西哥人，父为西班牙人，在西班牙与比利时长大，二战爆发后定居墨西哥，入墨西哥籍。本科与研究生学业均在墨西哥自治大学完成，又曾赴法国、德国从事研究。1982 年，他出版了第一部用西班牙语写的分析取向认识论著作：《相信、知道、认识》（*Creer, saber, conocer*；Villoro 1982）[^villoro-1982]，英译本题为 *Belief, Personal, and Propositional Knowledge*（Villoro 1998）[^villoro-1998]。比略罗所考察的，是信念、知识、真理、客观性、认知共同体这类基本概念。他把 *saber* 与 *conocer* 分开，二者约略相当于“命题性知识”与“个人知识”，后者在于对某对象有直接经验。*S* 只要有相关经验，便可声称对 *x* 有个人知识；但 要向别人证成这一声称，*S* 就得表明：他对自己的个人知识有命题性知识。比略罗似乎持某种认知相对主义。他主张，知道（*saber* 义的）*p*，即相信 *p* 并有客观充分的理由如此相信——客观充分的理由须具决定性、融贯而完整。可他同时认为：某一认知共同体视为客观充分的理由，另一共同体未必如此看。由此他主张经验知识可错：凭其共同体任何成员都视为客观充分的理由，*S* 知道 *p*；但他无法排除这种可能：另一认知共同体握有相反理由，足以瓦解他关于 *p* 的知识。客观充分的理由是我们对经验真理的最佳保证，却不必定蕴含这些真理（Villoro 1982: 180, 192）[^villoro-1982]。比略罗还认为，一切知识皆受社会制约这一看法，是怀疑论唯一可行的替代（1982: 164）。此外，他对传统知识概念提出一项出人意料的改革：真理概念不该写进知识的定义；因为尽管没有真理概念便无法 **理解** 客观充分的理由，人却可以在 *p* 不真时知道 *p*——真理不是理由成为客观充分的必要条件（1982: ch. 8）。（比略罗此书的更完整概述，见 Cresto 2010a: 474–477。）[^cresto-2010a]
