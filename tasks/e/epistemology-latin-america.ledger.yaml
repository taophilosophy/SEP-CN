      Worth mentioning are also two editorial projects. One is the publication of the first companion to contemporary philosophy of religion in the Spanish-speaking world (Rossi & Garcia forthcoming), which will include a section on the epistemic status of religious belief. One third of the contributions to this volume will be written by Latin American scholars working in the philosophy of religion, while the rest will be authored by North American and European scholars and translated into Spanish. The companion is intended to contribute to the development of Latin American scholarship in analytic philosophy of religion.
    step1: |-
      另有两个编辑项目值得一提。其一是出版西语世界第一部当代宗教哲学指南（Rossi & Garcia forthcoming），其中将包括一节讨论宗教信念的认识论地位。该文集三分之一的撰稿人将是研究宗教哲学的拉美学者，其余由北美与欧洲学者撰写并译为西班牙语。该指南意在促进拉美分析宗教哲学研究的发展。
    step2: |-
      另有两个编辑项目值得一提。一是西语世界首部当代宗教哲学指南的出版（Rossi & Garcia forthcoming），其中设一节讨论宗教信念的认识论地位。文集三分之一的文章出自拉美宗教哲学学者之手，其余由北美与欧洲学者撰写、再译为西班牙语。此指南意在推动拉美分析宗教哲学研究。
  - id: 62
