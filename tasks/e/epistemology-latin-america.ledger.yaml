      We should finally refer to the work of Carlos Pereda (b. 1944), even though epistemology has not been the focus of his research. Born in Uruguay, he obtained a B.A. in philosophy and educational sciences from the Universidad de la República in his home country, as well as a M.A. and a Ph.D. in philosophy from Universität Konstanz (Germany). He pursued most of his academic career in Mexico, first at the Universidad Autónoma Metropolitana and then at UNAM’s Instituto de Investigaciones Filosóficas. His work is mainly concerned with the nature and purpose of argumentation (Pereda 1994a, 1994b)[^pereda-1994a], and it is in this context that he deals with certain epistemological subjects. For instance, he calls the rules that govern the way in which the argumentative game is to be played “epistemic virtues”, which are character traits or dispositions of those involved in a debate, such as coherence, rigor, and willingness to consider one’s rival theses. The exercise of the epistemic virtues is what makes argumentation possible and what enables us to resolve conflicts of beliefs. Pereda also discusses what he calls “the trilemma of knowledge” (*el trilema del saber*), which arises from the following three claims:
