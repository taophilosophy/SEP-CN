      1. We know (understood in the sense that many of our beliefs are knowledge).
      2. We are fallible (understood in the sense that any of our beliefs may turn out to be false).
      3. *S* knows that *p* iff (a) *S* believes that *p*, (b) *p* is true, (c) *S* is wholly justified in believing that *p*, and (d) between the fact *p* and the belief that *p* there is an appropriate causal connection and *S* correctly reconstructs such a connection in her justification.
