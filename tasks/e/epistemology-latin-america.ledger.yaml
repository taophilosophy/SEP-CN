      ## 7 宗教认识论
  - id: 60
    kind: body
    source: |-
      There is at present an emerging interest in religious epistemology among Latin American scholars. Such an interest has been fostered by several projects funded by the John Templeton Foundation, especially “LATAM Bridges in the Epistemology of Religion” (2019–2023), directed by Luis Oliveira at the University of Houston. This religiously neutral project consists in a series of activities intended to create bridges between North American philosophers working in analytic epistemology of religion and Latin American philosophers interested in engaging in research in that domain: organization of seminars on religious epistemology in Argentina, Brazil, and Chile; selection of scholars for mentoring and research fellowships; and establishment of prizes to incentivize scholarly activity. The ultimate goal of the project is to train several dozen Latin American scholars to do serious work on religious epistemology in their own universities—thus increasing the number of classes taught on it and the number of majors and grad students introduced to it—and to help them develop academic relationships with the North American philosophical community.
    step1: |-
      拉美学者目前对宗教认识论的兴趣正在兴起。这一兴趣由约翰·坦普尔顿基金会资助的若干项目培育而成，尤其是“宗教认识论中的拉美桥梁”（2019–2023），由休斯敦大学的路易斯·奥利维拉主持。这个宗教中立项目由一系列活动构成，意在为从事分析宗教哲学研究的北美哲学家与有志于此的拉美哲学家搭桥：在阿根廷、巴西与智利组织宗教认识论研讨会；遴选学者参加指导与研究资助；设立奖项以激励学术活动。项目的终极目标是训练数十名拉美学者，使其能在本校认真从事宗教认识论研究——从而增加相关课程数量、增加接触此领域的主修生与研究生——并帮助他们与北美哲学界建立学术联系。
    step2: |-
      拉美学者对宗教认识论的兴趣，眼下正在兴起。这兴趣多由约翰·坦普尔顿基金会资助的项目培育而来，尤以“宗教认识论中的拉美桥梁”（2019–2023）为要；该项目由休斯敦大学的路易斯·奥利维拉主持，立场宗教中立，由一系列活动组成，意在为做分析宗教哲学的北美哲学家与有意涉足此域的拉美哲学家牵线。其活动包括：在阿根廷、巴西、智利举办宗教认识论研讨会；遴选学者给予指导与研究资助；设奖以奖掖学术。项目的终极目标，是把数十名拉美学者训练到能在本校认真做宗教认识论的程度；相关课程因之增多，接触此域的主修生与研究生也随之增多。项目还要帮他们与北美哲学界建立学术往来。
