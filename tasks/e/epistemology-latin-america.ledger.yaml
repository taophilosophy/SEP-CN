  - id: 4
    kind: body
    source: |-
      There is a growing interest in epistemological topics and problems among members of what may be called, somewhat artificially, “the Latin American philosophical community”. However, it should be noted from the start that, despite the large size of that community and its connections with philosophers and research groups particularly from the United States and the United Kingdom, on the whole epistemological investigation in Latin America significantly differs in approach, breadth, and originality from mainstream Anglophone epistemology—which at present can reasonably be taken as emblematic owing to its depth, precision, innovation, and fecundity.
    step1: |-
      在可（有点人为地）称为“拉丁美洲哲学共同体”的成员中，对认识论题与问题的兴趣正在增长。不过，一开始就应指出：尽管这个共同体规模庞大，且与美国、英国等地的哲学家与研究团队联系密切，拉丁美洲的认识论研究总体上在进路、广度与原创性上，与英语世界的主流认识论有显著差异——后者以其深度、精确、创新与丰产，目前有理由被视为典范。
    step2: |-
      在对认识论题与认识论问题的兴趣上，可（略带人为地）称为“拉丁美洲哲学共同体”的成员正日益增长。但须先指出：这个共同体固然庞大，与美英的哲学家和研究团队也联系紧密，拉美认识论研究在总体上却与英语学界的主流认识论判然有别——无论进路、广度还是原创性。后者凭其深度、精确、创新与丰产，如今有理由被视为典范。
  - id: 5
    kind: body
    source: |-
      Within Latin America, epistemology has traditionally been approached from a historico-exegetical rather than systematic perspective. Even today, it is not uncommon for an epistemology course in the philosophy department of a Latin American university to focus (almost) exclusively on the views on the nature and possibility of knowledge found in the works of Descartes, Hume, Kant, Husserl, Heidegger, Merleau-Ponty, or Ricoeur rather than on the main epistemological positions adopted in contemporary analytic philosophy. The reason is, at least in part, that most professors in charge of courses on the theory of knowledge have traditionally been historians of modern philosophy or phenomenologists influenced by the way philosophy has customarily been practiced in France, Germany, and Spain, thus following the tradition of so-called continental philosophy. In the Latin American academic milieu, philosophy in general has predominantly been approached either through the exegesis of philosophical texts or through the history of philosophical ideas, both with a markedly continental orientation.
    step1: |-
      在拉丁美洲，认识论传统上是从历史—注释而非系统的视角来处理。即便在今天，拉美大学哲学系的认识论课程（几乎）只集中于笛卡尔、休谟、康德、胡塞尔、海德格尔、梅洛-庞蒂或利科著作中关于知识本性与可能性的观点，而不及当代分析哲学的主要认识论立场，这并不少见。原因至少部分在于：多数讲授知识论的教授，传统上都是近代哲学史家或现象学家，受法国、德国、西班牙哲学惯例的影响，因而沿袭所谓大陆哲学的传统。在拉美学术环境中，哲学总体上也主要以哲学文本的注释或哲学观念史的方式处理，二者都有鲜明的大陆取向。
    step2: |-
      拉美处理认识论，传统上取历史—注释的视角，而非系统的视角。即便今天，拉美大学哲学系的知识论课程，也（几乎）只讲笛卡尔、休谟、康德、胡塞尔、海德格尔、梅洛-庞蒂或利科著作中关于知识本性与可能性的观点。当代分析哲学的主要认识论立场，则不置一词——这种情况并不少见。原因至少有一半在于：讲授知识论的教授，传统上多是近代哲学史家或现象学家，受法、德、西三国哲学惯例的熏陶，沿袭所谓大陆哲学的传统。在拉美的学术环境里，哲学总体上也多以两种方式处理：注疏哲学文本，或梳理哲学观念史。二者都有鲜明的大陆取向。
  - id: 6
    kind: body
    source: |-
      Even though the history of analytic philosophy in Latin America starts in the 1950s–1960s (see Pérez & Ortiz-Millán 2010)[^pérez-2010], one had to wait until the last two decades of the twentieth century for a strong and widespread trend of analytic philosophy to emerge. The seminal impetus for the production and dissemination in Latin America (particularly in Argentina, Brazil, and Mexico) of new work within the analytic tradition was the founding of research centers taking a distinctly analytic approach and the subsequent launches of their respective journals: the Instituto de Investigaciones Filosóficas (IIF, 1967) at the Universidad Autónoma de México (UNAM), with its journal *Crítica* (1967); the Sociedad Argentina de Análisis Filosófico (SADAF, 1972) with its journal *Análisis Filosófico* (1981); and the Centro de Lógica, Epistemologia e História da Ciência (CLE, 1976) at the Universidade Estadual de Campinas (UNICAMP) in Brazil, with its journal *Manuscrito* (1977). The founding in 2007 of the Asociación Latinoamericana de Filosofía Analítica (ALFA) reflects the sustained development of analytic philosophy in Latin American countries. The recent unprecedented impetus in what may be regarded as the analytic way of doing philosophy explains why, since the turn of the millennium, the primarily historico-exegetical and continental approach to epistemology has slowly started to be replaced by a systematic and analytic one.
    step1: |-
      尽管拉丁美洲分析哲学史始于 1950–60 年代（见 Pérez & Ortiz-Millán 2010）[^pérez-2010]，但直到 20 世纪最后二十年，才出现强劲而广泛的分析哲学潮流。推动分析传统新作在拉美（尤其是阿根廷、巴西与墨西哥）生产与传播的奠基性动力，是若干明显采取分析进路的研究中心的建立，及其各自刊物的相继创刊：墨西哥自治大学（UNAM）的哲学研究所（IIF，1967）与《批评》（*Crítica*，1967）；阿根廷哲学分析学会（SADAF，1972）与《哲学分析》（*Análisis Filosófico*，1981）；巴西坎皮纳斯州立大学（UNICAMP）的逻辑、认识论与科学史中心（CLE，1976）与《手稿》（*Manuscrito*，1977）。2007 年拉丁美洲分析哲学协会（ALFA）的成立，反映了分析哲学在拉美国家的持续发展。近年来所谓分析式哲学做法的空前动力，解释了为何自世纪之交起，主要基于历史—注释与大陆进路的认识论，已开始缓慢被系统而分析的进路取代。
    step2: |-
      拉美分析哲学史始于 1950 年代至 1960 年代（见 Pérez & Ortiz-Millán 2010）[^pérez-2010]，但强劲而广泛的分析哲学潮流，要等到 20 世纪最后二十年才出现。分析传统的新作得以在拉美（尤以阿根廷、巴西、墨西哥为甚）生产传播，奠基之力则来自一批取分析进路的研究中心与各自刊物：墨西哥自治大学（UNAM）哲学研究所（IIF，1967）与《批评》（*Crítica*，1967）；阿根廷哲学分析学会（SADAF，1972）与《哲学分析》（*Análisis Filosófico*，1981）；巴西坎皮纳斯州立大学（UNICAMP）的逻辑、认识论与科学史中心（CLE，1976）与《手稿》（*Manuscrito*，1977）。2007 年拉丁美洲分析哲学协会（ALFA）成立，可见分析哲学在拉美各国已成持续之势。近年“分析式”哲学做法的空前势头，也解释了何以自世纪之交起，以历史—注释与大陆进路为主的认识论，开始缓慢让位于系统而分析的进路。
  - id: 7
    kind: body
    source: |-
      With regard to the breadth of Latin American studies in epistemology, a considerable number of the subjects discussed in present-day analytic epistemology have not received the slightest attention, others have been addressed only superficially, and still others have been tackled by but a few researchers. This situation is not limited to relatively new areas such as the epistemology of testimony, the epistemology of disagreement, or collective epistemology (all falling within so-called social epistemology), but is a more general phenomenon. This may be due to the fact that, for some reason, in analytic-style Latin American philosophy, epistemology has received less attention than logic, philosophy of science, or philosophy of language.
    step1: |-
      就拉美认识论研究的广度而言，当代分析认识论讨论的相当多主题在拉美未受丝毫关注，另一些只得到表面处理，还有一些仅有少数学者涉猎。这种状况并不限于证言认识论、分歧认识论或集体认识论（皆属所谓社会认识论）等相对新的领域，而是更普遍的现象。原因或许在于：在分析风格的拉美哲学中，认识论受到的关注少于逻辑学、科学哲学或语言哲学。
    step2: |-
      就研究的广度而言，当代分析认识论所讨论的主题，相当一部分在拉美无人问津，一部分只被浅尝辄止，还有一部分仅有少数学者涉足。这种局面并不限于证言认识论、分歧认识论、集体认识论（皆属所谓社会认识论）这类较新的领域，而是普遍现象。原因或许在于：在分析风格的拉美哲学里，认识论受重视的程度不及逻辑学、科学哲学与语言哲学。
  - id: 8
    kind: body
    source: |-
      Finally, even though original positions and arguments with regard to specific topics have been developed by Latin American scholars, it is safe to say that there is not a *distinctively* Latin American epistemology. The epistemological issues and problems currently examined in the work of those Latin American authors who adopt a systematic approach either have been discussed throughout the history of philosophy or have been “imported” from Anglophone scholarship. Nor is there a particular way of doing epistemology that could be identified as Latin American. For this reason, one may talk of “epistemology in Latin America” or “epistemology done by Latin Americans” rather than of “Latin American epistemology”.
    step1: |-
      最后，尽管拉美学者已就具体主题提出原创的立场与论证，仍可稳妥地说：并不存在 *独具特色* 的拉美认识论。采取系统进路的拉美作者目前所考察的认识论题与问题，要么贯穿哲学史一直有人讨论，要么是从英语学界“输入”的。也不存在可辨认为拉美特有的认识论做法。因此，人们谈的是“拉丁美洲的认识论”或“拉美学者所做的认识论”，而非“拉美认识论”。
    step2: |-
      最后，拉美学者固然就具体主题提出过原创立场与论证，仍可稳妥地说：并无一种 **独具特色** 的拉美认识论。取系统进路的拉美作者眼下所探究的认识论题，或为哲学史上历来有之，或自英语学界“输入”。也没有哪种认识论做法可辨认为拉美特有。所以，人们谈的是“认识论在拉丁美洲”，或“由拉美学者来做的认识论”，而非“拉美认识论”。
  - id: 9
    kind: body
    source: |-
      A caveat is in order: the above is intended as a *general* description of the *current* situation in the Latin American philosophical community. The academic collaboration between research groups within and outside Latin America, the growing number of visiting scholars from Latin American countries at philosophy departments of North America and Europe where the best epistemological investigation is carried out, and the increase of financial resources in some of those countries will, one can reasonably expect, change the situation in the years to come by building on what has already been done in the field and opening up further research and debate. Within the next few decades, there will probably be a consolidated Latin American community working on epistemological issues, and one will perhaps even be able to start talking of a distinctively Latin American epistemology.
    step1: |-
      须作一点提醒：以上是对拉美哲学共同体 *当前* 状况的 *总体* 描述。拉美内外研究团队之间的学术合作、拉美国家访问学者在北美与欧洲（认识论研究最佳之处）哲学系的人数增长，以及其中一些国家财力的增加，有理由预期将在未来数年改变这一状况：既依托该领域已有成果，也开辟更多研究与论辩。未来几十年内，或许会出现一个稳固的、研究认识论问题的拉美共同体，人们甚至可能开始谈论独具特色的拉美认识论。
    step2: |-
      须有一句提醒：以上只是对拉美哲学共同体 **当前** 状况的 **总体** 描述。拉美内外研究团队之间的学术合作、访问学者在北美与欧洲（认识论研究最精之处）哲学系人数的增长、部分拉美国家财力的增加——都让人预期：未来数年局面将改观。新的局面既依托该领域既有成果，也开辟更多研究与论辩。几十年之内，或许会形成一个稳固的、专门研究认识论问题的拉美共同体，人们甚至可能开始谈独具特色的拉美认识论。
