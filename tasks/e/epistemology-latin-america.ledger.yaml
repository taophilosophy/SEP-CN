      After pursuing his undergraduate studies at UBA, Comesaña obtained his Ph.D. from Brown University under Sosa’s supervision, and is at present a professor at Rutgers University. In Buenos Aires, he was a founding member of the influential but now-defunct Grupo de Acción Filosófica (GAF). Having published on various epistemological issues (on which see Section 3), he has devoted some studies to skepticism. He has offered useful overviews of both the so-called Pyrrhonian problematic and skepticism in general (Comesaña 2006a and 2009a, respectively)[^comesaña-2006a][^comesaña-2009a]. He has also explored whether the contemporary theories of contextualism and contrastivism can help Pyrrhonists offer a philosophically satisfactory reply to the traditional objection according to which they are reduced to inactivity because action requires belief and they claim to suspend judgment regarding either philosophico-scientific beliefs or all beliefs whatsoever. Comesaña’s verdict is negative (Comesaña 2011)[^comesaña-2011].
    step1: |-
      科梅萨尼亚在 UBA 完成本科后，在布朗大学索萨指导下获博士学位，现为罗格斯大学教授。在布宜诺斯艾利斯，他是颇有影响、如今已停止活动的“哲学行动小组”（GAF）的创始成员。他发表过多种认识论问题的论著（见第 3 节），也做过一些怀疑论研究。他对所谓皮浪主义难题以及一般怀疑论都提供了有用的综述（分别为 Comesaña 2006a、2009a）[^comesaña-2006a][^comesaña-2009a]。他还探讨了当代的语境主义与对照主义理论能否帮助皮浪主义者，对一项传统反驳作出哲学上令人满意的回应——该反驳称，他们终将沦于无所行动，因为行动需要信念，而他们声称对哲学—科学信念或一切信念皆悬置判断。科梅萨尼亚的结论是否定的（Comesaña 2011）[^comesaña-2011]。
    step2: |-
      科梅萨尼亚在 UBA 读完本科，赴布朗大学在索萨指导下取得博士，现任罗格斯大学教授。在布宜诺斯艾利斯，他是颇有影响而如今已解散的“哲学行动小组”（GAF）创始成员。他的论著涉及多种认识论问题（见第 3 节），也做过一些怀疑论研究，为所谓皮浪主义难题与一般怀疑论分别提供了有用的综述（Comesaña 2006a、2009a）[^comesaña-2006a][^comesaña-2009a]。他还追问：当代的语境主义与对照主义理论，能否帮皮浪主义者对一项传统反驳给出哲学上令人满意的答复？那项反驳说：皮浪主义者终将沦于无所行动，因为行动需要信念，而他们却声称对哲学—科学信念、乃至一切信念都悬置判断。科梅萨尼亚的结论是否定的（Comesaña 2011）[^comesaña-2011]。
