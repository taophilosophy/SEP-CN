    source: |-
      It must nonetheless be observed that, unlike de Olaso’s, Porchat’s teaching and writings exerted a strong influence on his students, to the extent that several of them devoted their own work to the study of skepticism, creating in Brazil a relatively large community of academics interested in that philosophical movement. The work of those Brazilian scholars influenced by Porchat has been primarily exegetical and historical, with special focus on ancient and modern skepticism. A clear exception is Otávio Bueno (b. 1970), who after completing his B.A. and M.A. studies at USP, did his Ph.D. at the University of Leeds and is at present a professor at the University of Miami. Although Bueno’s main areas of research are the philosophy of science, the philosophy of mathematics, and logic, he has also discussed epistemological issues in connection with skepticism, particularly of a Pyrrhonian stripe. He has argued that it is mistake to claim that the Pyrrhonist is in the end committed to epistemic internalism, given that the latter’s arguments against epistemic externalism are merely dialectical (Bueno 2011)[^bueno-2011]. He has also rejected the view that the Pyrrhonist cannot induce the state of suspension of judgment on the basis of the Agrippan mode from disagreement alone (Bueno 2013)[^bueno-2013]. In other articles in which Pyrrhonism is also taken into account, Bueno has critically assessed Donald Davidson’s and Ernest Sosa’s responses to skepticism (Bueno 2005 and 2009, respectively)[^bueno-2005][^bueno-2009]. It is finally worth mentioning that he has defended a Pyrrhonian approach to contemporary science, in connection with Bas van Fraassen’s (1980) constructive empiricism (Bueno 2015, 2021)[^bueno-2015].
    step1: |-
      不过必须指出，与德·奥拉索不同，波尔沙特的授课与著作对学生影响很大，以致其中数人将自己的工作投入怀疑论研究，在巴西形成了一个规模较大的、对该哲学运动感兴趣的学术共同体。受波尔沙特影响的巴西学者，其工作主要是注释与历史的，特别集中于古今怀疑论。一个明显的例外是奥塔维奥·布埃诺（1970 年生），他在 USP 完成学士与硕士学业后，于利兹大学获博士学位，现为迈阿密大学教授。布埃诺的主要研究领域是科学哲学、数学哲学与逻辑学，但他也讨论过与怀疑论尤其是皮浪主义怀疑论相关的认识论问题。他论证说，声称皮浪主义者最终承诺认知内在主义是错误的，因为后者对认知外在主义的论证只是辩证性的（Bueno 2011）[^bueno-2011]。他还反驳了“皮浪主义者无法仅凭分歧、依阿格里帕式推理引出悬置判断状态”的观点（Bueno 2013）[^bueno-2013]。在其他也考虑皮浪主义的文章中，布埃诺批判性评估了唐纳德·戴维森与欧内斯特·索萨对怀疑论的回应（分别为 Bueno 2005、2009）[^bueno-2005][^bueno-2009]。最后值得一提的是，他结合巴斯·范弗拉森（1980）的构造经验论，为当代科学中的一种皮浪主义进路作了辩护（Bueno 2015, 2021）[^bueno-2015]。
    step2: |-
      但须指出：波尔沙特的授课与著作对学生影响甚大，德·奥拉索则不。他的学生中有数人专治怀疑论，在巴西形成了一个规模可观的、关心这一哲学运动的学术群体。受波尔沙特影响的巴西学者，所做多为注释与历史研究，重心在古今怀疑论。明显的例外是奥塔维奥·布埃诺（1970 年生）：他在 USP 读完学士与硕士，赴利兹大学取得博士，现任迈阿密大学教授。布埃诺主治科学哲学、数学哲学与逻辑学，也讨论过与怀疑论特别是皮浪主义怀疑论相关的认识论问题。他指出，说皮浪主义者最终承诺认知内在主义，是个错误——因为其反对认知外在主义的论证只是辩证性的（Bueno 2011）[^bueno-2011]。他也驳斥了这样一种看法：皮浪主义者无法只凭分歧、依阿格里帕式推理引出悬置判断（Bueno 2013）[^bueno-2013]。在另一些同样涉及皮浪主义的文章里，布埃诺分别批判评估了唐纳德·戴维森与欧内斯特·索萨对怀疑论的回应（Bueno 2005、2009）[^bueno-2005][^bueno-2009]。最后还应一提：他结合巴斯·范弗拉森（1980）的构造经验论，主张对当代科学采取皮浪主义进路（Bueno 2015, 2021）[^bueno-2015]。
