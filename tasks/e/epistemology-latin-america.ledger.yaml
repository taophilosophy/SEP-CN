      Zuluaga obtained his B.A. and M.A. in philosophy from the Universidad de los Andes and the Universidad Nacional de Colombia, respectively, and his Ph.D. in the same field from the Ludwig-Maximilians-Universität München (Germany). He is currently a professor at the Universidad del Valle (Colombia). Zuluaga has looked at Agrippa’s trilemma in the context of contemporary epistemological discussions of the regress argument, but his approach is merely expository: he limits himself to providing an overview of part of the literature on the trilemma and on the problems faced by foundationalism and coherentism (Zuluaga 2005)[^zuluaga-2005]. He has also written about contemporary reconstructions of Cartesian skepticism that are based on the closure principle (Zuluaga 2012)[^zuluaga-2012], but his approach is again entirely expository.
