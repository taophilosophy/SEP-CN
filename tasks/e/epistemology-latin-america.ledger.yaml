      After presenting the current situation of epistemological research in Latin America and part of its history, this entry will address six topics: skepticism (especially in its Pyrrhonian stripe), core epistemology, formal epistemology, Wittgenstein’s thought in connection with epistemology and skepticism, epistemology of law, and religious epistemology. It should be noted from the outset that the entry does not purport to provide a comprehensive account of epistemology in Latin America, but rather to paint a general picture of it by focusing on the main issues that have been discussed within that field.
    step1: |-
      在介绍拉丁美洲认识论研究的现状及其部分历史之后，本词条将讨论六个主题：怀疑论（尤其是皮浪主义一路）、核心认识论、形式认识论、维特根斯坦与认识论及怀疑论相关的思想、法律认识论，以及宗教认识论。需要从一开始就说明：本词条并不打算对拉丁美洲的认识论作全面论述，而是聚焦于该领域内讨论过的主要问题，勾画一幅总体图景。
    step2: |-
      本词条先介绍拉丁美洲认识论研究的现状及其部分历史，随后讨论六个主题。这些主题是：怀疑论（尤以皮浪主义一路为重）、核心认识论、形式认识论、维特根斯坦关于认识论与怀疑论的思想、法律认识论与宗教认识论。须先说明：本词条无意对拉美认识论作全面论述，只想围绕该领域讨论过的主要问题，勾画一幅总体图景。
  - id: 2
    kind: body
    source: |-
      We will take into consideration the work of those scholars who have written (in Spanish, Portuguese, or English) on epistemological issues independently of both whether they are currently based in Latin America and whether they have worked in a non-Latin American country for a considerable part of their careers. The touchstone for inclusion was not whether they were born in Latin America—although all but one of those who will be mentioned were born there—but whether they are of Latin American origin, earned a degree from a Latin American university, and worked for at least some time in Latin America, thus receiving (part of) their philosophical education in such a milieu. For this reason, there will be no mention of, e.g., Ernesto Sosa’s and Linda Martín Alcoff’s extensive and influential work in epistemology.[^note-1]
    step1: |-
      我们将考察那些以西班牙语、葡萄牙语或英语写作认识论问题之学者的工作，不论其目前是否身处拉丁美洲，亦不论其是否长期在拉美以外国家工作。入选标准不是他们是否生于拉美——尽管下文提到的学者除一人外都生于拉美——而是他们是否有拉美出身、取得过拉美大学的学位，并至少在拉美工作过一段时间，因而（部分地）在这种环境中接受了哲学教育。为此，本词条不会提及，例如，欧内斯特·索萨与琳达·马丁·阿尔科夫在认识论领域广博而有影响的工作。[^note-1]
    step2: |-
      我们考察的标准，是学者是否以西班牙语、葡萄牙语或英语写过认识论问题，而不问其眼下是否身处拉美，也不问其是否长期在拉美以外工作。入选的依据不是出生地——下文提及的学者除一人外都生于拉美——而是三事：有拉美出身，取得过拉美大学的学位，至少在拉美工作过一段时间。从而他们（部分地）在这种环境里受过哲学训练。正因如此，例如欧内斯特·索萨与琳达·马丁·阿尔科夫在认识论上广博而有影响的工作，本词条不予提及。[^note-1]
