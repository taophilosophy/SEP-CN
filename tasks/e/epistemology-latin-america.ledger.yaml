      De Almeida obtained his B.A. in social communication from the Pontifícia Universidade Católica do Rio Grande do Sul (PUCRS), his M.A. in philosophy from USP, and his Ph.D. in philosophy from McMaster University (Canada). Currently a professor at PUCRS, his main area of research is epistemology. He has written on epistemic closure and skepticism—arguing *inter alia* that neither knowledge nor epistemic justification are closed under logical implication and that this closure-failure does not affect Cartesian skepticism (de Almeida 2007, 2012)[^almeida-2007]—and on Stroud’s influential interpretation of Cartesian skepticism, which de Almeida claims is crippled by a level confusion (de Almeida 2016)[^almeida-2016][^almeida-2016-2].
    step1: |-
      德·阿尔梅达在里奥格兰德天主教大学（PUCRS）取得社会传播学学士，在 USP 取得哲学硕士，在加拿大麦克马斯特大学取得哲学博士。他现任 PUCRS 教授，主要研究领域为认识论。他写过关于认知闭合与怀疑论的论著——其中论证知识与认知辩护都不对逻辑蕴含封闭，而这种封闭失效并不影响笛卡尔式怀疑论（de Almeida 2007, 2012）[^almeida-2007]；也写过关于斯特劳德对笛卡尔式怀疑论之影响深远解释的论著，他称该解释受层次混淆之累（de Almeida 2016）[^almeida-2016][^almeida-2016-2]。
    step2: |-
      德·阿尔梅达的社会传播学学士得自里奥格兰德天主教大学（PUCRS），哲学硕士得自 USP，哲学博士得自加拿大麦克马斯特大学。他现任 PUCRS 教授，主治认识论。论著涉及认知闭合与怀疑论，其中论证知识与认知辩护都不对逻辑蕴含封闭，而这种封闭失效并不波及笛卡尔式怀疑论（de Almeida 2007, 2012）[^almeida-2007]；他也写过斯特劳德对笛卡尔式怀疑论那个影响深远的解释，认为后者受层次混淆之累（de Almeida 2016）[^almeida-2016][^almeida-2016-2]。
