      Machuca, who pursued his undergraduate and graduate studies in Argentina, obtaining his Ph.D. at UBA, is currently a researcher at CONICET and the editor (with Duncan Pritchard) of the *International Journal for the Study of Skepticism* (2011). Having initially devoted himself to examining Sextus’s Pyrrhonism and moral skepticism, he has more recently focused also on a systematic discussion of skepticism in relation to epistemological issues. He has looked at the relevance of Pyrrhonism to contemporary theories of knowledge and justification and, in particular, to the present-day debate over the epistemic significance of disagreement, defending a neo-Pyrrhonian stance (Machuca 2013b, 2015a, 2017a, 2022)[^machuca-2013b]. He has also examined the connection between disagreement and skepticism in general, arguing *inter alia* that a radical disagreement-based skepticism cannot be dismissed out of hand as being patently untenable or absurd (Machuca 2015b, 2017b)[^machuca-2015b].
    step1: |-
      马丘卡在阿根廷完成本科与研究生学业，在 UBA 获博士学位，现任 CONICET 研究员，并与邓肯·普里查德合编《国际怀疑论研究杂志》（2011）。他起初研究塞克斯都的皮浪主义与道德怀疑论，近来也着重系统讨论怀疑论与认识论问题的关联。他考察了皮浪主义对当代知识与辩护理论的意义，尤其是对当今关于分歧之认识论意义的论争的意义，并捍卫一种新皮浪主义立场（Machuca 2013b, 2015a, 2017a, 2022）[^machuca-2013b]。他还考察了一般而论的分歧与怀疑论之间的关联，其中论证：基于彻底分歧的怀疑论不能因显然站不住脚或荒谬而被轻易摒弃（Machuca 2015b, 2017b）[^machuca-2015b]。
    step2: |-
      马丘卡在阿根廷读完本科与研究生，于 UBA 取得博士，现任 CONICET 研究员，并与邓肯·普里查德合编《国际怀疑论研究杂志》（2011）。他起初治塞克斯都的皮浪主义与道德怀疑论，近来更着重系统讨论怀疑论同认识论问题的关联。他考察了皮浪主义对当代知识论与辩护理论的意义，特别是对当下关于分歧之认识论意义的论争的意义，并为之捍卫一种新皮浪主义立场（Machuca 2013b, 2015a, 2017a, 2022）[^machuca-2013b]。他也考察了一般而论的分歧与怀疑论之间的关联，其中论证：基于彻底分歧的怀疑论，不能因看似站不住脚或荒谬就被轻易打发（Machuca 2015b, 2017b）[^machuca-2015b]。
