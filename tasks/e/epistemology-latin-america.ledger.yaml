      Another line of epistemological research in Latin America concerns Ludwig Wittgenstein’s thought. The first scholar to be mentioned is Alejandro Tomasini Bassols (b. 1952). A member of the Instituto de Investigaciones Filosóficas at the Universidad Autónoma de México, he has devoted a considerable part of his work to interpreting Wittgenstein’s thought and endorses what he describes as “a radical Wittgensteinism”. Although from the vantage point of the numerous Anglophone specialists on Wittgenstein his writings might not offer original insights, they have contributed to the dissemination of the Austrian philosopher’s thought in the Spanish-speaking world. In his 2001 book, Tomasini Bassols examines the concept of knowledge, the problem of skepticism, and various issues concerning perception, memory, self-knowledge, personal identity, and truth by contrasting the “classical” and the Wittgensteinian approaches to each of those questions. Availing himself primarily of the epistemological considerations found in *On Certainty*, his main contention is that the type of grammatical analysis proposed by Wittgenstein shows that the traditional problems that classical epistemology intended to solve through the construction of elaborate theories are nothing but pseudo-problems arising from conceptual misunderstandings. For this reason, he contends, it is no longer possible to continue to practice epistemology the way it was practiced before Wittgenstein.
    step1: |-
      拉美另一条认识论研究路线关涉路德维希·维特根斯坦的思想。首先要提及的学者是亚历杭德罗·托马西尼·巴索尔斯（1952 年生）。他是墨西哥自治大学哲学研究所成员，相当一部分工作致力于解释维特根斯坦的思想，并自称持“一种激进的维特根斯坦主义”。尽管从众多英语世界维特根斯坦专家的眼光看，他的著作或许没有原创洞见，却有助于这位奥地利哲学家的思想在西班牙语世界的传播。在 2001 年的著作中，托马西尼·巴索尔斯通过对比“古典”进路与维特根斯坦式进路，考察知识概念、怀疑论问题，以及涉及知觉、记忆、自我知识、人格同一性与真理的种种问题。他主要借助《论确定性》中的认识论考量，核心主张是：维特根斯坦所提议的那种语法分析表明，古典认识论打算通过构造精巧理论来解决的传统问题，不过是源于概念误解的伪问题。因此，他主张，已不可能再按维特根斯坦之前的方式从事认识论。
    step2: |-
      拉美的另一条认识论路线，关涉路德维希·维特根斯坦。首先要说的是亚历杭德罗·托马西尼·巴索尔斯（1952 年生）：墨西哥自治大学哲学研究所成员，相当一部分工作用于解读维特根斯坦，自称持“一种激进的维特根斯坦主义”。在众多英语世界维特根斯坦专家看来，他的著作或许并无原创洞见，却推动了这位奥地利哲学家的思想在西班牙语世界的传播。其 2001 年著作以“古典”进路与维特根斯坦式进路对照，逐一考察知识概念、怀疑论问题，以及知觉、记忆、自我知识、人格同一性、真理诸问题。他主要取材于《论确定性》中的认识论考量。其核心主张是：维特根斯坦所倡导的语法分析表明，古典认识论欲以精巧理论解决的那些传统问题，不过是概念误解所生的伪问题。因此，按维特根斯坦之前的方式再做认识论，已不可能。
