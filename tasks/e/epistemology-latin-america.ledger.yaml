      Da Silva Filho obtained his B.A. in philosophy from the Universidade Estadual de Santa Cruz and his M.A. and Ph.D. in communication and contemporary culture from the Universidade Federal da Bahia (UFBA). Currently a professor at UFBA, he works in the fields of philosophy of mind and epistemology. In some of his publications, he has examined certain skeptical difficulties concerning self-knowledge (da Silva Filho 2007, 2008)[^silva-2007]. Even though he was not one of Porchat’s students, he has also been influenced by Porchat’s skeptical stance.
    step1: |-
      达·席尔瓦·菲略在圣克鲁斯州立大学取得哲学学士，在巴伊亚联邦大学（UFBA）取得传播与当代文化专业的硕士与博士学位。他现任 UFBA 教授，研究心灵哲学与认识论。在一些论著中，他考察了与自我知识有关的若干怀疑论难题（da Silva Filho 2007, 2008）[^silva-2007]。虽非波尔沙特的学生，他也受其怀疑论立场影响。
    step2: |-
      达·席尔瓦·菲略的哲学学士得自圣克鲁斯州立大学，硕士与博士则治传播与当代文化，就读于巴伊亚联邦大学（UFBA）。他现任 UFBA 教授，治心灵哲学与认识论。在一些论著里，他考察了关乎自我知识的若干怀疑论难题（da Silva Filho 2007, 2008）[^silva-2007]。他不是波尔沙特的学生，却也受其怀疑论立场影响。
