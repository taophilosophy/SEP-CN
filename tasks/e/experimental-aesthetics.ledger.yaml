      Can art be defined by necessary and sufficient conditions at all? Elzė Mikalonytė and Markus Kneer (forthcoming) investigate whether the folk concept of art is an essentialist or a non-essentialist one; in other words, whether it can be defined by a set of individually necessary and jointly sufficient conditions. In contrast to Kamber’s studies mentioned earlier, they asked people who were not art professionals. In two vignette studies, Mikalonytė and Kneer manipulated three properties of artworks—namely, being intentionally created, having aesthetic value, and being institutionally recognized—aiming to see whether any of those properties, corresponding to the main essentialist art definitions, are seen by the folk as necessary conditions for an object to be classified an artwork. The results, similar to Kamber’s, also suggest that the folk concept of art is not an essentialist concept, but rather a cluster concept. Interestingly, none of the three properties were considered necessary—there were cases where art status was ascribed even to accidentally created objects. This finding is surprising considering the role that intentional creation and the creator’s intentions are thought to play in this context in the literature on philosophical aesthetics (Mag Uidhir 2013)[^mag-2013], as well as some studies in the psychology of art. For example, Jean-Luc Jucker et al. (2014) discovered that when people are asked to classify artefacts into art and non-art, their decisions are guided by inferences about the creator’s intentions. George Newman and Paul Bloom’s (2012) results showed that participants’ beliefs about whether an object was intended to be an artwork or not had an important effect on how they see a physically identical copy of the same object. More generally, it is widely believed that people classify objects into artefact kinds by making inferences about the creator’s intentions (Bloom 1996)[^bloom-1996]. Mikalonytė and Kneer’s study, however, is not the only one showing that intentional creation is not seen by the folk as necessary—they have also discovered that although people consider AI-generated paintings to be art to a similar extent as human-created paintings, they are not very willing to consider AI-creators artists. In the context of artistic creation, mental state (including intention) ascription to AI agents is relatively low, and this might partially explain why AI robots are not accepted as artists (Mikalonytė & Kneer 2022)[^mikalonytė-2022][^mikalonytė-2022-2][^mikalonytė-2022-3]. However, another study by Mikalonytė and Kneer suggests that the phenomenon of art without an artistic intention might not be confined to the realm of AI-generated art: even human creators are seen as capable of creating artworks without intending to do so (Mikalonytė & Kneer forthcoming).
    step1: |-
      究竟能否用必要充分条件来定义艺术？Elzė Mikalonytė 与 Markus Kneer（即将发表）考察大众的艺术概念是本质主义的还是非本质主义的；换言之，它能否由一组各自必要且共同充分的条件来定义。与此前提到的 Kamber 的研究不同，他们询问的是非艺术专业人士。在两项情境实验（vignette studies）中，Mikalonytė 与 Kneer 操纵了艺术作品的三个属性——即有意图地创作、具有审美价值、获得制度性认可——旨在考察这些分别对应主要本质主义艺术定义的属性，是否被大众视为某物被归为艺术作品的必要条件。结果与 Kamber 相似，同样表明大众的艺术概念并非本质主义概念，而是簇概念。有趣的是，三个属性中没有一个是必要条件——在某些情形中，甚至偶然创作出来的对象也被赋予艺术地位。这一发现令人惊讶，因为考虑到有意的创作与创作者的意图在哲学美学文献（Mag Uidhir 2013）[^mag-2013]以及艺术心理学的部分研究所认为的在此语境中的作用。例如，Jean-Luc Jucker 等人（2014）发现，当人们被要求把人工制品归类为艺术与非艺术时，其决定受关于创作者意图的推断所引导。George Newman 与 Paul Bloom（2012）的结果表明，被试关于某物是否意在成为艺术作品的信念，对其如何看待该物在物理上完全相同的复制品有重要影响。更一般地说，人们广泛相信，人是通过推断创作者意图来把对象归入人工制品类别的（Bloom 1996）[^bloom-1996]。然而，Mikalonytė 与 Kneer 的研究并非唯一表明有意创作不被大众视为必要条件的研究——他们还发现，尽管人们认为 AI 生成的绘画与人类创作的绘画在同等程度上是艺术，却不太愿意把 AI 创作者视为艺术家。在艺术创作的语境中，人们对 AI 主体的心理状态（包括意图）归属相对较低，这也许部分解释了为何 AI 机器人不被接受为艺术家（Mikalonytė & Kneer 2022）[^mikalonytė-2022][^mikalonytė-2022-2][^mikalonytė-2022-3]。不过，Mikalonytė 与 Kneer 的另一项研究表明，无意向的艺术现象也许并不限于 AI 生成艺术的领域：即便是人类创作者，也被认为能够无意创作而出艺术作品（Mikalonytė & Kneer 即将发表）。
    step2: |-
      艺术究竟能否用必要充分条件来定义？Elzė Mikalonytė 与 Markus Kneer（即将发表）探讨大众的艺术概念属于本质主义还是非本质主义，也就是说，该概念能否由一组各自必要、共同充分的条件加以界定。与前述 Kamber 的研究不同，他们的被试并非艺术专业人士。在两项情境实验中，他们操纵了艺术作品的三个属性——有意创作、具有审美价值、获得制度认可——以考察这些分别对应主流本质主义艺术定义的属性，是否被大众看作某物成为艺术作品的必要条件。结果与 Kamber 相近：大众的艺术概念不是本质主义概念，而是簇概念。耐人寻味的是，三个属性中没有一项被视为必要——在有些情形里，连偶然产生的对象都被赋予了艺术地位。这一发现出乎意料，因为哲学美学文献（Mag Uidhir 2013）[^mag-2013]以及部分艺术心理学研究都十分看重有意创作与创作者意图的作用。例如，Jean-Luc Jucker 等人（2014）发现，人们把人工制品分为艺术与非艺术时，其判断受对创作者意图的推断引导；George Newman 与 Paul Bloom（2012）则表明，被试关于某物是否意在成为艺术作品的信念，会明显影响他们看待该物物理上完全相同的复制品的方式。更一般地说，学界普遍相信，人正是通过推断创作者意图来把对象归入各类人工制品的（Bloom 1996）[^bloom-1996]。不过，表明有意创作并非大众所认必要条件的，不止 Mikalonytė 与 Kneer 这一项研究：他们还发现，人们虽然认为 AI 生成的画作与人类画作在同等程度上算是艺术，却不太愿意承认 AI 创作者是艺术家。在艺术创作语境中，人们对 AI 主体心理状态（含意图）的归属程度较低，这或许部分解释了 AI 机器人何以不被接纳为艺术家（Mikalonytė & Kneer 2022）[^mikalonytė-2022][^mikalonytė-2022-2][^mikalonytė-2022-3]。而 Mikalonytė 与 Kneer 的另一项研究则提示，无意向的艺术现象未必局限于 AI 生成艺术：即便是人类创作者，也被认为能够在不曾有意为之的情况下创作出艺术作品（Mikalonytė & Kneer 即将发表）。
