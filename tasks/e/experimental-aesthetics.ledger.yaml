  - id: 58
    kind: body
    source: |-
      In the first direction, concerning morality’s influence on aesthetics, philosophers have wondered about the influence of moral attitudes on aesthetic attitudes. In traditional philosophical aesthetics, this is sometimes known as the “value interaction” or “ethical criticism of art” debate (Clavel Vázquez 2018; Giovanelli 2007; Liao & Meskin 2018; McGregor 2014)[^clavel-2018][^liao-2018][^mcgregor-2014][^meskin-2018]. There are three main positions: autonomists say that moral attitudes do not influence aesthetic attitudes; moralists say that negative moral judgments always negatively influence aesthetic judgments; and contextualists say that moral attitudes’ influence on aesthetic attitudes depends on the context.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      This direction of value interaction might affect taste perception. Patrik Sörqvist and colleagues (2013) found that, between two qualitatively identical cups of coffee, participants whose attitudes are congruent with sustainability rated the one labeled as “eco-friendly” as tastier. However, Aaron Meskin and Shen-yi Liao (2018) were unable to conceptually replicate this result. Similarly, Beth Armstrong and colleagues (2019) found that the valence of ethical information affected consumers’ expected experience of food. Taken together, these results suggest that a folk psychology of moralism or contextualism is currently more plausible than a folk psychology of autonomism.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      This direction of value interaction might also affect judgments of beauty. One longstanding debate in this context surrounds whether moral goodness can be beautiful in itself—with philosophers such as Plato (c. 370 BCE) and Shaftesbury (1711) claiming that moral beauty exists, and others such as Edmund Burke (1757) and Immanuel Kant (1790) denying this (though see Doran forthcoming d). Until recently, one of the principal ways that philosophers have tried to settle this matter is by examining the use of ordinary language from the armchair. Berys Gaut (2007), for example, argues in favor of the existence of moral beauty principally by noting that we *call* people beautiful when they are good. Gaut argues that this kind of talk cannot be intended non-literally, as was suggested by Burke (1757), as neither of the two defeators of literal use—obvious falsity (as in ‘my boss is a pig’) or trivial truthfulness (as in ‘I’m not over the moon’)—seem to apply to locutions that appear to express moral beauty. But as Ryan Doran (2021) notes, Gaut’s method of testing for non-literal use is too demanding, as it wrongly assumes that people are always truth-maximisers. To move past this apparent impasse from the armchair, and help to reveal the number of species of moral beauty that exist, Doran suggests that we turn to experimental studies. He shows that people tend to judge morally good people to be more beautiful, and that this cannot be deflated in terms of non-literal intent or an error (such as misattribution) on the grounds that making the source of the goodness salient, and giving people the opportunity to express their approval of the goodness prior to making the judgment of beauty, does not eliminate the effect of moral goodness on judgments of beauty. Doran also finds evidence that moral goodness can affect the beauty of physical appearances by affecting the determinants of thick aesthetic properties such as balance and delicacy, and that people’s moral character can be beautiful in itself, suggesting that beauty is not perception dependent.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Building on this work, experimental philosophy studies have also been used to help resolve apparent inconsistencies in the existing literature on *which* moral traits are beautiful, as well as reveal hitherto unacknowledged reasons why morally good traits and actions are beautiful, among other things.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Supporters of moral beauty can be divided into *particularists* about the beauty of traits—who tend to hold that only the ‘warmer’ virtues such as compassion are beautiful (for example, Kant 1764)[^kant-1764]—and *universalists* about moral beauty—who tend to argue that all virtues are beautiful, and indeed that certain colder non-moral traits such as intelligence can be beautiful too (Schiller 1793 [2003], 1793 [2005]; Gaut 2007; and Paris 2018)[^gaut-2007][^paris-2018][^schiller-1793][^schiller-1793-2].
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Doran (2023) proposes that these positions only appear to be inconsistent with one another, as they range over different kinds of beauty: with universalists targeting the beauty that is found in good form, and particularists targeting the kind of beauty that lies in things that have a disposition to lead to an emotion that is variously described as ‘love,’ ‘elevation’ and ‘ecstasy’—which is characterized by feelings akin to being moved, inspired, and of unity with the object of this state. To test this view, he presented participants with a story about two individuals who are equally well-formed—in the sense that their mental states are all working harmoniously to lead them to do the right thing—but differ in the kind of virtue they exhibit, with one individual being just, and the other being compassionate. Consistent with the idea that there is a beauty in some traits which resides in the disposition to give rise to this special emotion in addition to well-formedness, participants found the fully just and fully compassionate individuals to be equally virtuous and good, but the latter to be more beautiful to the extent that this individual tended to give rise to this special emotion to a greater extent.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Examining the link between internal harmony and beauty more explicitly, Doran (forthcoming b) has tested the idea—which is most prominently found in Friedrich Schiller’s *On Grace & Dignity* (1793 [2005]) and *Kallias* (1793 [2002])—that actions are beautiful if and only if they are expressive of freedom by being the result of a high degree of internal harmony, as in cases where our desires, beliefs, and will all seamlessly work together to produce the good action. While Doran finds some evidence which is consistent with actions being beautiful to the extent that they are expressive of freedom by being the result of a high degree of internal harmony, his results also suggest that the moral actions of conflicted individuals can be *as* beautiful, or even *more* beautiful, as those of internally harmonious moral agents, and so Schiller’s claim need to be weakened and supplemented with additional claims. In one experiment, for example, participants were presented with two individuals who both do the right and good action in making necessary redundancies and giving financial support to those affected, where the only difference is that where one individual makes the redundancies without any internal conflict, the other does so with a great deal of conflict due to a reluctance to afflict the necessary suffering. Consistent with his earlier findings, the results show that the latter individual’s action is considered to be more beautiful, and that this is due to the latter individual’s tendency to move us, and make us feel at one with them. As such, Doran suggests that it is not only the internal harmony of the agent who performs an action that determines its beauty, but also the degree to which the action tends to make us *feel as though we are harmoniously related to the agent that performs the action*. Further elucidating some of the reasons why morally good actions can be beautiful, Doran (forthcoming c) finds that people tend to think that morally good actions are beautiful when the action is seen as expressing who the person truly is (their essence), and as stemming from a location deep inside of them, and in turn tends to lead to feelings of being moved and inspired.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Imagination may play an especially important role in mediating moral attitudes’ influence on aesthetic attitudes. Imaginative resistance refers to the phenomenon in which “an otherwise competent imaginer finds it difficult to engage in some sort of prompted imaginative activity” (Gendler & Liao 2016: 405; see also Miyazono & Liao 2016)[^gendler-2016][^liao-2016][^miyazono-2016]. Imaginative resistance is puzzling because imagination is standardly unconstrained. Typically, a competent imaginer finds no difficulty in imagining *factual* deviations, such as a fictional world in which humans and dragons co-exist. However, it has been hypothesized that imaginative activities that involve *moral* deviations are especially prone to evoke imaginative resistance (Gendler 2000, 2006)[^gendler-2000]. For example, it has been suggested that a fictional world in which female infanticide is morally right is likely to evoke imaginative resistance (Walton 1994)[^walton-1994]. Philosophers disagree about many aspects of imaginative resistance, such as: whether the resistance is special to imagining moral deviations, whether the resistance reflects an intrinsic limitation of imagination, and indeed, whether the phenomenon is real in the first place. Experimental philosophers and psychologists have sought to bring systematic empirical evidence to help resolve these disagreements.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      As an early example of this kind of work, Liao, Strohminger, and Sripada (2014) conducted two studies on imaginative resistance and its driving factors. In the first study, they asked participants to engage with a story in the style of Greek myths, in which it is morally right to trick a person into entering a romantic relationship. They found evidence for imaginative resistance being a real phenomenon: the extent to which this fictional world is counter to participants’ moral attitude is correlated with the extent of their self-reported imaginative difficulty. However, they also found evidence against the resistance reflecting an intrinsic limitation of imagination: the extent to which participants are familiar with the genre conventions of Greek myths is also correlated with the extent of their self-reported imaginative difficulty. In the second study, they presented a fictional world in which it is morally right to sacrifice an infant, but varied the genre of the story such that some participants engaged with a story in the style of police procedurals but others engaged with a story in the style of Aztec myths. Sure enough, participants do have a harder time accepting that infant sacrifice really is morally right in the police procedural world, but an easier time accepting the same for the Aztec myth world. This contrast found in this study (replicated by Mark Phelan and colleagues in Cova, Strickland, et al. 2021) lends further support to the reality and the non-intrinsicality of imaginative resistance.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Subsequent investigations by other philosophers and psychologists have found additional support for the reality of imaginative resistance and further uncovered its contours. Jessica E. Black and Jennifer L. Barnes (2017) have designed and validated a scale for measuring imaginative resistance. With this scale, they have also found that participants do experience imaginative resistance in response to moral deviance, albeit with contextual and individual variations (Barnes & Black 2016; Black & Barnes 2020)[^barnes-2016][^black-2020]. However, Hanna Kim, Markus Kneer, and Mike Stuart (2019) found that the resistance is not special to imagining moral deviations. Instead, imaginative resistance reflects the “weirdness” of the claim that participants are asked to imagine, which is itself an amalgam of three factors: unusualness, counterfactuality, and surprisingness. Morally deviant claims, as a class, are not necessarily more weird than factually deviant claims, as a class. Moreover, given that surprisingness is a component, weirdness depends on expectations which might be modified by genre expectations and other contextual factors. Dylan Campbell, William Kidder, Jason D’Cruz, and Brendan Gaesser (2021) found that the resistance does not reflect an intrinsic limitation of imagination. Instead, imaginative resistance reflects individual differences in emotional reactivity: participants who experience less negative affect in response to harms also experience less difficulty in imagining moral deviance.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      In the second direction, concerning aesthetics’ influence on morality, philosophers have also wondered about the influence of aesthetic attitudes on moral attitudes. This direction comes up too, albeit much more rarely, in the “value interaction” debate (Harold 2006; Stecker 2005)[^harold-2006][^stecker-2005]. In psychology, however, aesthetic attitudes’ influence on moral attitudes has been systematically studied in an extensive literature on the beauty-is-good stereotype (Dion et al. 1972; compare the metaanalyses in Eagly et al. 1991 and Langlois et al. 2000)[^dion-1972][^eagly-1991][^langlois-2000]. Roughly, the idea is that positive aesthetic judgments always positively influence moral judgments of persons. This stereotype holds in a surprisingly wide variety of domains, such as pedagogy and politics.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Philosophers have been equivocal in their answer to the question of whether aesthetic appreciation has a salubrious effect on us morally. Cynics about beauty have suggested that appreciating beauty might have a corrupting influence. J. Robert Loftis (2003), for example, suggests that beauty might lead us to focus on the superficial, “skin deep”, features of the world. But some philosophers have been more sanguine about the prospect of moral cultivation via beauty. Plato, in the *Symposium*, suggests that the appreciation of physical beauties leads to the appreciation of non-perceptual kinds of goodness; and Kant (1785) suggests that a love of *natural* beauty in particular is a “mark of the good soul”, and indicates that a person is susceptible to the “moral feeling”. Since this issue is an empirical one to an important extent, it is perhaps no surprise that experimental philosophers and empirical aestheticians have entered the fray. Providing correlational support for the optimistic view, Diessner et al. (2013) found that the tendency to be sensitive to beauty (that is, to notice it, and be moved by it), and particularly sensitivity to natural beauty, was associated with the moral attitudes towards close and distant others (in line with Kant’s suggestion). Providing evidence of a causal relationship, appreciation of natural beauty has been found to lead to more morally admirable behavior (Zhang et al. 2014; see Silvers & Haidt 2008 and Landis et al. 2009 for evidence concerning the morally salubrious effects of appreciating moral beauty)[^landis-2009][^silvers-2008][^zhang-2014]. In addition to this work on beauty, the moral effects of appreciating the sublime have been explored in the context of empirical work on the nature of awe (see Piff et al. 2015)[^piff-2015].
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Philosophers have generally held two main positions about the role that something’s beauty can play in grounding moral standing. On the one hand, optimists about beauty have argued that beauty confers intrinsic moral standing—that is, beautiful things are worthy of protection independently of their relationship to humans and other animals (for example, G.E. Moore 1903; Routley, 1973)[^moore-1903]. Pessimists about beauty, by contrast, think that beauty at best provides a non-intrinsic kind of moral standing, insofar as it is but one source of pleasure for humans (for example, Passmore 1974)[^passmore-1974]. Experimental philosophers and empirical aestheticians have recently tried to cast light on some of the mechanisms that might be involved in beauty’s effects on judgments of moral standing, with a view to interrogating its normative significance in some cases. Doran (2022), for example, argues that both the optimists and pessimists are incorrect. Across two studies with beautiful plants, he shows that to the extent that people tend to experience the beauty of plants—and in particular to the extent that they tend to feel moved and inspired by the beauty—they tend to judge that the plant can feel pain and has intrinsic moral standing. As such, he argues that the intuitions that optimists appeal to should be debunked, and that beauty tends to give rise to a state that is more valuable than mere pleasure, contra the pessimists. Investigating the issue through the lens of Moral Foundations Theory, Klebl and colleagues (2022) found that purity intuitions tend to underlie people’s willingness to protect beautiful things.
    step1: TBD
    step2: TBD
