      Andow (2019) asked his study participants whether they think that forming aesthetic beliefs based on testimony given by a friend or an expert is less *permissible* and *legitimate* compared to forming such beliefs based on first-hand experience, and also compared to forming non-aesthetic beliefs, such as beliefs about size or price. Although his results confirm that there is an asymmetry between the extent to which people are inclined to trust aesthetic testimony, compared to testimony about non-aesthetic properties, interestingly, this effect was not moderated by the participants’ attitudes toward the status of aesthetic judgments. Moreover, another similarly designed study shows that aesthetic and moral beliefs based on testimony, in contrast to descriptive beliefs, are not seen as constituting *knowledge* (Andow 2020)[^andow-2020].
    step1: |-
      Andow（2019）询问研究被试，他们认为依据朋友或专家提供的证言形成审美信念，相比依据亲身经验形成此类信念，是否更不*可允许*、更不*正当*；同时也与形成非审美信念（如关于大小或价格的信念）相比较。尽管其结果确认，人们信任审美证言的倾向与信任关于非审美属性之证言的倾向之间存在不对称，但有趣的是，这一效应并未受到被试对审美判断地位之态度的调节。此外，另一项设计类似的研究表明，依据证言形成的审美信念与道德信念，与描述性信念不同，并不被视为构成*知识*（Andow 2020）[^andow-2020]。
