      ## 1. History of Empirical Research on Art and Aesthetics
    step1: |-
      ## 1. 艺术与美学的经验研究史
    step2: |-
      ## 1 艺术与美学的经验研究史
  - id: 3
    kind: body
    source: |-
      Modern scientific approaches to art and aesthetics find their origins in Germany in the nineteenth century, in some of earliest works in experimental psychology. Most notably, with his *Vorschule der Aesthtik* (1876), Gustav Fechner pioneered what came to be known as “bottom-up aesthetics”, which tried to discover general laws of taste by examining preferences for simple geometric shapes such as rectangles of varying proportions, colors, and arrangements of lines (for a summary of “bottom-up” aesthetics, see Nadal & Ureña 2022)[^nadal-2022][^nadal-2022-2].
    step1: |-
      艺术与美学的现代科学进路，其源头在十九世纪的德国，见于实验心理学最早的一批著作。最著名的是古斯塔夫·费希纳（Gustav Fechner），他以其《美学初阶》（*Vorschule der Aesthtik*，1876）开创了后来所称的“自下而上的美学”：该进路试图通过考察人们对简单几何形状——如不同比例的矩形、颜色与线条排列——的偏好，来发现品味的一般规律（“自下而上”美学的综述，见 Nadal & Ureña 2022）[^nadal-2022][^nadal-2022-2]。
    step2: |-
      艺术与美学的现代科学进路发端于十九世纪的德国，其源头就在实验心理学最早的几部著作之中。其中尤以古斯塔夫·费希纳（Gustav Fechner）为开创者：他在《美学初阶》（*Vorschule der Aesthtik*，1876）中提出后来被称为“自下而上的美学”的进路，试图考察人们对简单几何形状（如比例各异的矩形、各种颜色与线条排列）的偏好，从而发现品味的一般规律（关于“自下而上”美学的综述，见 Nadal & Ureña 2022）[^nadal-2022][^nadal-2022-2]。
  - id: 4
    kind: body
    source: |-
      In mid-twentieth century, art historian and philosopher Thomas Munro—who founded the American Society of Aesthetics in 1942 and served as the editor of the society’s publication *The Journal of Aesthetics and Art Criticism* between 1945 and 1964—continually expressed optimism about the prospect of integrating philosophical and scientific approaches to aesthetics (1928, 1948, 1951, 1956, 1963). In “The Psychology of Art: Past, Present and Future” (1963), Munro observes that philosophers have actually been asking, for a long time, questions about art and aesthetics that are at least partly empirical, such as *how do artists come to create works? how does the experience of art affect the audience’s character? are there rules by which the arts can please and instruct? do some works universally please across epochs and cultures? how can different species of aesthetic pleasure be taxonomized?*. In “Methods in the Psychology of Art” (1948), he notes that authors in *The Journal of Aesthetics and Art Criticism* often make empirical claims as part of their arguments, and so should use empirical methods more.
    step1: |-
      二十世纪中叶，艺术史家兼哲学家托马斯·芒罗（Thomas Munro）——他于 1942 年创立美国美学学会（American Society of Aesthetics），并在 1945 年至 1964 年间担任该学会刊物《美学与艺术批评杂志》（*The Journal of Aesthetics and Art Criticism*）的主编——始终对融合哲学进路与科学进路来研究美学的前景抱持乐观（1928, 1948, 1951, 1956, 1963）。在《艺术心理学：过去、现在与未来》（1963）中，芒罗观察到，哲学家们实际上长期以来就在追问关于艺术与美学的问题，而这些问题至少部分是经验性的，例如：艺术家如何创作出作品？艺术经验如何影响受众的品格？艺术是否有可借以取悦与教化的规则？某些作品是否跨越时代与文化而普遍令人愉悦？不同种类的审美愉悦如何分类？在《艺术心理学的方法》（1948）中，他指出，《美学与艺术批评杂志》的作者们常常在论证中作出经验性断言，因此应当更多地使用经验方法。
    step2: |-
      二十世纪中叶，艺术史家兼哲学家托马斯·芒罗（Thomas Munro）长期对哲学与科学的融合抱持乐观：他于 1942 年创立美国美学学会（American Society of Aesthetics），1945 至 1964 年间主编该学会刊物《美学与艺术批评杂志》（*The Journal of Aesthetics and Art Criticism*），并一再申说这一主张（1928, 1948, 1951, 1956, 1963）。在《艺术心理学：过去、现在与未来》（1963）中，芒罗指出，哲学家追问艺术与美学问题由来已久，而这些问题至少部分属于经验问题：艺术家如何创作出作品？艺术经验如何塑造受众的品格？艺术是否有可借以取悦并教化的规则？某些作品是否跨越时代与文化而普遍令人愉悦？不同种类的审美愉悦又如何分类？在《艺术心理学的方法》（1948）中，他则提醒，《美学与艺术批评杂志》上的作者常在论证中作出经验性断言，因此理应更多地采用经验方法。
  - id: 5
    kind: body
    source: |-
      Not all philosophers have been as optimistic as Munro. George Dickie (1962) argued that psychology is not relevant to aesthetics. Some of Dickie’s worries echoed earlier ones: for example, he argued that the psychology of art was impoverished by simplified stimuli, such as the use of geometric shapes rather than real artworks (compare Arnheim 1952)[^arnheim-1952]. Other worries were due to his specific conceptions of philosophy of art and aesthetics, and philosophy in general. First, Dickie believed that aesthetics is “concerned only with the language and concepts which are used to describe and evaluate works of art” (1962: 289), and so questions outside of this conception—such as *how do artists come to create works?*—are simply irrelevant. Second, Dickie believed that philosophy is discontinuous with science, such that “the problems of ethics are not solved by a scientific study nor are the problems of the philosophy of science” and aesthetics is no exception (1962: 301–302).
    step1: |-
      并非所有哲学家都像芒罗那样乐观。乔治·迪基（George Dickie，1962）主张，心理学与美学无关。迪基的某些忧虑与更早的忧虑相呼应：例如，他主张，艺术心理学因使用简化的刺激物而变得贫乏，比如使用几何形状而非真正的艺术作品（比较 Arnheim 1952）[^arnheim-1952]。另一些忧虑则源于他对艺术哲学与美学、以及一般哲学的特有构想。第一，迪基认为，美学“只关心用来描述与评价艺术作品的语言和概念”（1962: 289），因此这一构想之外的问题——例如艺术家如何创作出作品？——根本无关紧要。第二，迪基认为，哲学与科学不相连续，以至于“伦理的问题不由科学研究来解决，科学哲学的问题亦然”，美学也不例外（1962: 301–302）。
    step2: |-
      并非所有哲学家都像芒罗那样乐观。乔治·迪基（George Dickie，1962）认为，心理学与美学无关。他的部分忧虑与前人一脉相承：艺术心理学因使用简化的刺激物而流于贫乏，例如以几何形状代替真正的艺术作品（比较 Arnheim 1952）[^arnheim-1952]。另一些忧虑则出自他对艺术哲学、美学乃至哲学本身的特定构想。其一，迪基认为美学“只关心用来描述与评价艺术作品的语言和概念”（1962: 289），凡在此构想之外的问题（如艺术家如何创作出作品？）自然无关紧要。其二，他认为哲学与科学不相连续，“伦理的问题不由科学研究来解决，科学哲学的问题亦然”，美学也不例外（1962: 301–302）。
  - id: 6
    kind: body
    source: |-
      While Dickie’s criticisms, and hardline view, held considerable sway over philosophical aesthetics and the philosophy of art in the second half of the twentieth century, this has not continued. From the late 1980s onwards, philosophical aestheticians and philosophers of art have increasingly appealed to the findings of cognitive sciences (for a summary, see entry on aesthetics and cognitive science), and to a lesser extent to the findings of empirical aesthetics, and particularly evolutionary aesthetics (see, for example, Dutton 2009)[^dutton-2009]. Indeed, from around 2010 onwards, philosophers joined the psychologists of art and empirical aestheticians in conducting empirical studies.
    step1: |-
      尽管迪基的批评与强硬立场在二十世纪下半叶的哲学美学与艺术哲学中颇有影响，但这种局面并未延续。自 1980 年代后期以来，哲学美学家与艺术哲学家越来越多地诉诸认知科学的发现（综述见“美学与认知科学”词条），并在较小程度上诉诸经验美学的发现，尤其是进化美学（例如 Dutton 2009）[^dutton-2009]。事实上，大约自 2010 年起，哲学家们也加入了艺术心理学家与经验美学家的行列，开始从事经验研究。
    step2: |-
      迪基的批评及其强硬立场，在二十世纪下半叶的哲学美学与艺术哲学中曾颇有影响，但这一局面并未延续。1980 年代后期以降，哲学美学家与艺术哲学家日益诉诸认知科学的成果（综述见“美学与认知科学”词条），其次诉诸经验美学、尤其是进化美学的成果（例如 Dutton 2009）[^dutton-2009]。大约自 2010 年起，哲学家更与艺术心理学家、经验美学家一道，亲身投入经验研究。
  - id: 7
    kind: body
    source: |-
      In some ways, it is difficult to pinpoint exactly where modern empirical aesthetics and the psychology of art ends, and the experimental philosophy of art and aesthetics, begins. But a rough characterization can be made along the lines that Dickie suggested. Empirical aesthetics and the psychology of art is primarily concerned with characterizing the psychological responses to art and aesthetically significant objects. It answers questions such as: *what is the nature of the responses (such as chills, pleasure, changes in self-conception)? what features of aesthetic objects and artworks tend to elicit these responses (such as curvature, certain colors, etc.)? are there systematic individual differences in relation to this?* Whereas experimental philosophy of art and aesthetics—as a branch of philosophy—is primarily concerned with empirically studying conceptual distinctions. It answers questions such as: *do people think that a moral demerit can also be an aesthetic demerit? do people think that something can be art if it does not have any aesthetically valuable properties? what is the nature of the folk’s concept of art and beauty—are they purely descriptive or evaluative concepts?*
    step1: |-
      在某些方面，很难准确指出现代经验美学与艺术心理学在何处结束、艺术与美学的实验哲学在何处开始。但可以循着迪基提示的思路作一粗略刻画。经验美学与艺术心理学主要关心刻画对艺术以及具有审美意义的对象的心理反应。它回答这样的问题：这些反应的本性是什么（例如战栗、愉悦、自我构念的改变）？审美对象与艺术作品的哪些特征容易引发这些反应（例如曲率、某些颜色等）？在这方面是否存在系统性的个体差异？而艺术与美学的实验哲学——作为哲学的一个分支——主要关心对概念区分进行经验研究。它回答这样的问题：人们是否认为道德上的缺陷也可以是审美上的缺陷？人们是否认为某物即使没有任何审美上有价值的属性也可以成为艺术？大众的艺术概念与美的概念具有何种本性——它们是纯粹描述性的概念，还是评价性的概念？
    step2: |-
      现代经验美学与艺术心理学止于何处、艺术与美学的实验哲学始于何处，有时并不容易分辨。不过沿着迪基的思路，仍可作一大致刻画。经验美学与艺术心理学主要着眼于刻画人们对艺术及具审美意义之对象的心理反应，所问的是：这类反应具有何种性质（如战栗、愉悦、自我构念的改变）？审美对象与艺术作品的哪些特征易于引发这些反应（如曲率、某些色彩）？其中是否存在系统的个体差异？艺术与美学的实验哲学则不同：作为哲学的分支，它主要对概念区分作经验研究，所问的是：人们是否认为道德上的缺陷也可以是审美上的缺陷？人们是否认为，某物纵无任何审美价值属性亦可成其为艺术？大众的艺术概念与美的概念究竟属于何种性质——纯描述性的，还是评价性的？
  - id: 8
    kind: body
    source: |-
      Nonetheless, it is important to stress that, at best, this way of carving up the distinction picks out a central tendency of the two fields. In reality, the work done by researchers in philosophy, including experimental philosophical aesthetics, and empirical aesthetics overlaps in many ways. To give a few examples. Philosophers have had a longstanding concern in trying to establish whether there is a distinctive kind of aesthetic state of mind, and empirical aestheticians have recently become interested in this question. A couple of influential ideas about this from philosophy are that the pleasure taken in beauty is of a disinterested kind, where this roughly means that it is not the result of desire satisfaction, or does not essentially produce desires (see Kant 1790)[^kant-1790]; and that approaching objects aesthetically involves adopting a distanced attitude where we disengage from the object practically, and do not relate it to our standing desires or interests (Bullough 1912)[^bullough-1912]. More recently, empirical aestheticians have attempted to tackle this issue with the tools provided by neuroscience and psychology. For example, Marcus Nadal and Martin Skov (2018) have argued against the idea that there is a distinctive *sui generis* state of mind, on the grounds that, for example, the same neural hardware that is involved in responding to pleasant tasting food and sex have been shown to be involved in the appreciation of aesthetic objects. By contrast, Amy Belfi and colleagues (2019), for example, have shown that aesthetic appreciation involves activation of the Default Mode Network, which they suggest may show that self-reflection, rather than self-detachment, may form part of what makes aesthetic responses unique. Philosophers have also been interested in explaining beauty in terms of a harmony between the beautiful objects and our psychological faculties in some ways (as present in, for example, Hume 1757a and Kant 1790)[^hume-1757a][^kant-1790], and psychologists have sought to explain aesthetic appeal in terms of processing characteristics, such as the fluency with which an object is experienced (Reber et al. 2004)[^reber-2004]. Both experimental philosophers as well as aesthetic psychologists have tried to elucidate the features of moral actions and traits that lead to attributions of beauty, as well as the kind of psychological state appreciation of this kind of beauty gives rise to (see, for example, Doran 2023; see §6)[^doran-2023].
    step1: |-
      不过，必须强调，这种区分方式充其量只是指出了两个领域的中心倾向。实际上，哲学研究者（包括实验哲学美学）与经验美学研究者所做的工作在许多方面相互重叠。举几个例子。哲学家长期以来一直关切如何确定是否存在一种独特的审美心理状态，而经验美学家近来也开始关心这一问题。哲学中关于此的两个有影响的想法是：对美的愉悦是无利害的，其大略意思是它并非欲望满足的结果，或者本质上不产生欲望（见 Kant 1790）[^kant-1790]；以及，以审美方式接近对象意味着采取一种有距离的态度，在实践上与该对象脱离，不把它与我们的既定欲望或利益联系起来（Bullough 1912）[^bullough-1912]。晚近，经验美学家试图用神经科学与心理学提供的工具来处理这一问题。例如，Marcus Nadal 与 Martin Skov（2018）反对存在一种独特的*sui generis*（自成一类）心理状态的想法，理由是：对可口的食物与性作出反应所涉及的同一套神经装置，已被表明也参与对审美对象的欣赏。相反，Amy Belfi 及其同事（2019）则表明，审美欣赏涉及默认模式网络（Default Mode Network）的激活，他们认为这也许表明，自我反思而非自我疏离，可能构成了审美反应之独特性的部分内容。哲学家也一直有兴趣以美的对象与我们的心理能力之间的某种和谐来解释美（例如见 Hume 1757a 与 Kant 1790）[^hume-1757a][^kant-1790]，而心理学家则试图以加工特征——例如体验一个对象的流畅性——来解释审美吸引力（Reber et al. 2004）[^reber-2004]。实验哲学家与审美心理学家都试图阐明道德行动与特质的哪些特征导致美的归属，以及对此类美的欣赏会产生何种心理状态（例如见 Doran 2023；见 §6）[^doran-2023]。
    step2: |-
      然而必须强调：这种划界至多只标出两个领域的中心倾向。事实上，哲学研究者（包括实验哲学美学）与经验美学者的工作在许多方面彼此交叠。略举数例。哲学家一向关心能否确立一种独特的审美心理状态，经验美学家近来也对此发生兴趣。哲学方面有两个颇具影响的想法：其一，对美的愉悦属于无利害的愉悦，大致是说它并非欲望满足的产物，本质上也不产生欲望（见 Kant 1790）[^kant-1790]；其二，以审美方式接近对象意味着采取一种有距离的态度，在实践上与之脱离，不把它系于我们既有的欲望或利益（Bullough 1912）[^bullough-1912]。晚近，经验美学家尝试借神经科学与心理学的工具处理这一问题。例如，Marcus Nadal 与 Martin Skov（2018）否认存在独特的*sui generis*（自成一类）心理状态，理由之一是对可口食物与性的反应所动用的同一套神经装置，也被证明参与了审美对象的欣赏。相反，Amy Belfi 及其同事（2019）表明，审美欣赏涉及默认模式网络（Default Mode Network）的激活，并据此推测：构成审美反应之独特性的，也许正是自我反思而非自我疏离。哲学家还一向以美的对象同我们心理能力之间的某种和谐来解释美（例如见 Hume 1757a 与 Kant 1790）[^hume-1757a][^kant-1790]；心理学家则试图以加工特征解释审美吸引力，如体验某对象时的流畅性（Reber et al. 2004）[^reber-2004]。实验哲学家与审美心理学家还共同致力于阐明：道德行动与特质的哪些特征会引发美的归属，以及对这类美的欣赏会引起何种心理状态（例如见 Doran 2023；见 §6）[^doran-2023]。
