      Andow（2019）请被试比较：依据朋友或专家的证言形成审美信念，是否比依据亲身经验形成同类信念更不*可允许*、更不合*正当*；与形成大小、价格之类非审美信念相比又如何。结果确认存在不对称：人们信任审美证言的程度，低于信任关于非审美属性之证言的程度。耐人寻味的是，这一效应并不受被试对审美判断地位所持态度的影响。另一项设计相近的研究还表明，与描述性信念不同，依据证言形成的审美信念与道德信念不被视为构成*知识*（Andow 2020）[^andow-2020]。
