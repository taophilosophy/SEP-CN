    kind: body
    source: |-
      Unfortunately, notwithstanding the many overlapping concerns, the fields of philosophical aesthetics (including experimental philosophical aesthetics) and empirical aesthetics have remained largely siloed. On the side of philosophical aestheticians, this has continued to lead to missed opportunities for testing the empirical aspects of their theories and for experimental philosophical aestheticians to methodologically innovate. And on the side of empirical aestheticians, this has led to a failure to benefit from the theoretical and argumentative sophistication that tends to be characteristic of the best work in philosophy. However, there are signs that this is changing. Empirical aestheticians are increasingly attempting to test claims drawn from philosophy (for example, Brielmann & Pelli 2017; Winner 2019)[^brielmann-2017][^winner-2019], and experimental philosophers of art and aestheticians are increasingly working with psychologists, if not empirical aestheticians yet (for example, Humbert-Droz et al. 2020)[^humbert-droz-2020]. Nowhere is this more clear than in the case of work on awe and the sublime, where philosophers have worked productively with psychologists, and where philosophical claims have informed the design of empirical studies and the resultant theory building in turn (for example, Clewis 2021; Keltner & Haidt 2003; Shiota et al. 2007; Arcangeli et al. 2020; Shapshay 2021)[^arcangeli-2020][^clewis-2021][^keltner-2003][^shapshay-2021][^shiota-2007].
    step1: TBD
    step2: TBD
