      Some philosophers, such as Arthur Danto (1973), claim that a copy of a non-repeatable artwork is always aesthetically less valuable. Empirical research also suggests that people tend to value a copy of an artwork less than the original, even if the two are perceptually indistinguishable (Rabb, Brownell, & Winner 2018). George Newman has conducted a series of studies to explain this effect. One possible reason is that the created object is evaluated as the result of a unique creative act; another is that there is a perceived physical contact between the object and the original creator (Newman & Bloom 2012)[^newman-2012]. When a duplicate object is made by someone other than the original creator, people are less inclined to see it as the same object (Newman, Bartels, & Smith 2014). Since people believe that an object’s or person’s essence can be transferred by means of physical contact, Newman and Smith (2019) hypothesized—and confirmed—that differences in evaluation between a copy and an original painting are mediated by the artwork’s perceived anthropomorphism; that is, feelings that the artwork seems alive and expresses emotions. In some cases, physical contact is not necessary for beliefs in contagion: intentional contact may be enough (Stavrova et al. 2016)[^stavrova-2016]. Shen-yi Liao, Aaron Meskin, and Jade Fletcher (2020) examined the contagion effect in the museum context. They asked the participants (a) whether the objects in the gallery embody “the very being” of their creator, and (b) whether they are unique, and they found that contagion has an effect on perceived aesthetic value both in the museum and laboratory context, while uniqueness matters only in the latter.
    step1: |-
      一些哲学家，如 Arthur Danto（1973），主张不可重复艺术作品的复制品在审美上总是价值较低。经验研究同样表明，即便复制品与原作在知觉上无法分辨，人们也倾向于认为复制品的价值低于原作（Rabb, Brownell, & Winner 2018）。George Newman 进行了一系列研究来解释这一效应。一个可能的原因是，被创造出来的对象被评价为独特创造性活动的产物；另一个原因是，人们感知到该对象与原初创作者之间的物理接触（Newman & Bloom 2012）[^newman-2012]。当复制品由原初创作者以外的人制作时，人们更不倾向于把它视为同一对象（Newman, Bartels, & Smith 2014）。既然人们相信一个对象或一个人的本质可以借物理接触传递，Newman 与 Smith（2019）便假设——并予以证实——复制品与原画在评价上的差异，以艺术作品的被感知拟人化为中介；也就是说，人们觉得该艺术作品似乎有生命并表达情感。在某些情形中，物理接触并非传染信念的必要条件：有意的接触也许就足够了（Stavrova et al. 2016）[^stavrova-2016]。Shen-yi Liao、Aaron Meskin 与 Jade Fletcher（2020）考察了博物馆语境中的传染效应。他们询问被试：（a）画廊中的对象是否体现了其创作者“真正的存在”，以及（b）它们是否独一无二；结果发现，传染对感知到的审美价值在博物馆与实验室语境中都有影响，而独特性只在前者中起作用。
    step2: |-
      Arthur Danto（1973）等哲学家主张，不可重复艺术作品的复制品在审美上总是较为逊色。经验研究也表明，即便复制品与原作在知觉上无法分辨，人们仍倾向于把它评得比原作低（Rabb, Brownell, & Winner 2018）。George Newman 为解释这一效应开展了一系列研究。一个可能的原因是，被造之物被看作独特创造活动的成果；另一个原因是，人们感知到该对象与原初创作者之间的物理接触（Newman & Bloom 2012）[^newman-2012]。若复制品出自原初创作者以外的人之手，人们就更不愿视其为同一对象（Newman, Bartels, & Smith 2014）。人们相信一个对象或一个人的本质可借物理接触传递，据此 Newman 与 Smith（2019）提出并证实：复制品与原画在评价上的落差，以艺术作品的被感知拟人化为中介——即人们觉得作品似乎有生命、能表达情感。有时物理接触并非传染信念的必要条件，有意的接触也就够了（Stavrova et al. 2016）[^stavrova-2016]。Shen-yi Liao、Aaron Meskin 与 Jade Fletcher（2020）考察了博物馆情境中的传染效应，询问被试：（a）展厅中的对象是否体现了其创作者“真正的存在”；（b）它们是否独一无二。结果发现，传染在博物馆与实验室两种情境中都会影响感知到的审美价值，独特性则只在实验室情境中起作用。
