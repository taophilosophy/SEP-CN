      Finally, there is one more way aesthetic information has an effect on ontological judgments, even if this kind of research does not speak directly to the ontology of *art*: aesthetic preferences may influence judgments of personal identity. Previously, it had been thought that we consider humans and their ‘true selves’ to be fundamentally *morally* good, and that changes to someone’s moral character influence judgments of a person’s identity. Joerg Fingerhut and colleagues discovered that changes in our aesthetic taste are also seen as profoundly transformative changes: when someone’s aesthetic preferences change, they cease to be *the same* person (Fingerhut et al. 2021)[^fingerhut-2021].
