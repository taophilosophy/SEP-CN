      ## 8. Methodological Debates
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Throughout this entry, we have generally focused on recent empirical research done by philosophers on topics in philosophy of art and aesthetics. However, this scope is admittedly arbitrary. As noted at the start, the research program that we have surveyed is continuous with empirical aesthetics in psychology, and comes from a long historical tradition that encompasses both philosophy and psychology. The principal reasons to draw boundaries are pragmatic ones.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Like other branches of experimental philosophy, experimental philosophy of art and aesthetics involves gathering data using empirical methods and bringing analyses of the data to bear on philosophical theorizing. As a matter of general fact, research in experimental philosophy is relatively replicable (Cova, Strickland, et al. 2021), and relatively free of scientific misconduct such as p-hacking (Stuart, Colaço, & Machery 2019). While experimental philosophy of art and aesthetics is bolstered by this general track record, it also inherits a number of methodological challenges from experimental philosophy and related areas of psychology regarding instruments, samples, and stimuli.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      By far, the most common instrument used in experimental philosophy of art and aesthetics is—like other branches of experimental philosophy and related areas of psychology—the questionnaire. Participants’ responses are measured by their answers to questions posed by the researchers. Nick Zangwill (2019) expresses a general skepticism toward studies that use questionnaires, and criticizes experimental philosophy of art and aesthetics for its wide use of this specific measurement instrument. Drawing inspiration from Wittgenstein, Zangwill is pessimistic about the questionnaire’s attempt to use language to reveal agents’ thoughts generally. In addition, he is pessimistic about the questionnaire’s capacity to reveal agents’ normative judgments, such as judgments of beauty, as opposed to non-normative judgments, such as judgments of agreeableness. Zangwill’s critique could be taken as an invitation for experimental philosophers to explore methodological tools beyond the questionnaire. In fact, some philosophers have already experimented with eye movement tracking (Wright et al. 2019)[^wright-2019], virtual reality (Francis et al. 2016)[^francis-2016], electroencephalography (Bricker 2020)[^bricker-2020], and corpus analysis (Liao, McNally, & Meskin 2016; McNally & Stojanovic 2017; Sytsma et al. 2019; Chartrand 2022; Doran, forthcoming a)[^chartrand-2022][^mcnally-2017][^sytsma-2019]. Some of these or other proposed methods (see Fischer & Curtis 2019; Fischer & Sytsma 2023)[^fischer-2019][^fischer-2023] might also enrich experimental aestheticians’ toolboxes.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      The most common sample used in experimental philosophy of art and aesthetics is—once again, like other branches of experimental philosophy and related areas of psychology—WEIRD: participants from Western, Educated, Industrialized, Rich, and Democratic countries (Henrich, Heine, & Norenzayan 2010). Whether responses from these WEIRD participants are representative of people in general remains an open question. Within experimental philosophy (and related areas in psychology), there is an ongoing debate about the legitimacy of making theoretical generalizations based on empirical results from WEIRD samples (for criticisms, see Stich & Machery 2023 and Peters & Lemeire 2024; for defenses, see Knobe 2019, 2021)[^knobe-2019][^peters-2024][^stich-2023]. Clearly, this ongoing debate impacts the evidentiary value of existing research in experimental philosophy of art and aesthetics as well.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      That said, it is important to highlight a couple of cross-cultural works in experimental philosophy of art and aesthetics. In one work, Florian Cova, Christopher Olivola, and colleagues (2019) extend Cova’s earlier research on the intersubjective validity of aesthetic judgments to a sample that includes participants from 19 countries on four continents. Across six geographical areas (Europe, Middle East, Central and North America, South America, East Asia, and South and Southeast Asia), they found both variations and convergences in patterns of responses. While participants from East Asia tend to endorse ‘subjectivism’ about aesthetic judgments (when two people disagree, both can be correct), participants from other geographical areas tend to endorse ‘nihilism’ (when two people disagree, neither is correct or incorrect). At the same time, people everywhere tend to not endorse ‘realism’ (when two people disagree, at most one can be correct). In another work, Constant Bonard (2019) conducted studies in Switzerland and India to vindicate the hypothesis that musical idioms have grammatical structures. The grammar of Western classical music was found to be more recognizable to Switzerland participants than Indian participants, but no reverse asymmetry was found for South Indian classical music. Another study investigated aesthetic judgments of mathematical beauty between Chinese and British mathematicians and found that they do not seem to be strongly influenced by cultural differences (Sa et al. 2024). As things stand, these three cross-cultural works remain the exception, and not the norm, in experimental philosophy of art and aesthetics. The fact that the vast majority of work has been conducted with Western European and American samples is not dissimilar to the situation in empirical aesthetics (see Che, Sun, Gallardo, & Nadal 2018)[^nadal-2018] or music cognition (see Jacoby et al 2020)[^jacoby-2020]. As such, this is a problem that needs to be addressed in all fields that empirically study art and aesthetics.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      In addition, samples used in experimental philosophy of art and aesthetics tend to be ordinary people with no special expertise in philosophy or the relevant arts. One criticism of experimental philosophy’s relevance for philosophical theorizing, commonly called [*the expertise objection*](https://plato.stanford.edu/entries/experimental-philosophy/#DefePrivIntuRathThanThosOrdiExpePart), endorses privileging experts’ responses over ordinary people’s. While the existing debate primarily concerns the expertise of philosophers—insofar as the objectors privilege philosophers’ intuitions from thought experiments—in the domain of philosophy of art and aesthetics, expertise in the respective artforms might be relevant as well. Many psychology studies have shown differences between ordinary people and art experts in aesthetic judgments and preferences (Hekkert & Van Wieringen, 1996; Leder, Ring, & Dressler 2013), as well as emotional responses to art (Silvia 2013; Leder, Gerger, et al. 2014)[^silvia-2013], and these differences are relevant to at least some of the topics experimental philosophers are interested in. As such, we want to highlight a few works in this domain that use experts as samples.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      Three studies in experimental philosophy of aesthetics have compared expert and non-expert samples. In one empirical study based on moral foundations theory, Alessandro Ansani and colleagues (2024) found that musical experts tend to have a higher preference for individualizing moral foundations, Harm and Care. Elzė Mikalonytė and Vilius Dranseika (2020) compared intuitions on the individuation of musical works between musicians and non-musicians and found that although they tend to be similar, musicians’ intuitions are usually more pronounced. However, Mikalonytė and Dranseika (2022) found no notable differences between professional singers and orchestra musicians working in the opera and participants with no music education. Most of Richard Kamber’s (2011) study participants were art professionals or ‘art buffs’, so the study itself does not allow us to compare experts’ and non-experts’ responses. Kamber explains this methodological decision by stating that if there is a consensus between professional artists on what counts as art, philosophers are inclined to agree with professional artists.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In other branches of experimental philosophy, many studies rely on intuitions that arise from thought experiments. This is less so in experimental philosophy of art and aesthetics. Indeed, Cova and Réhault (2019b: 3) speculate that it is because intuitions play a much less prominent role in philosophical aesthetics that the field did not draw the initial attention of experimental philosophers. With that said, it is important to stress that there is variation with respect to this within this branch of experimental philosophy too. Emanuele Arielli (2018) distinguishes studies that solicit intuitions and other cognitive responses and studies that solicit aesthetic reactions and other perceptual and phenomenological responses. While critical of the former type of studies, he finds the latter type of studies more promising insofar as they are more continuous with empirical aesthetics in psychology.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Others have remarked on this difference between experimental philosophy of art and aesthetics and other branches of experimental philosophy. Clotilde Torregrossa (2020, 2024) argues that insofar as experimental philosophy of art and aesthetics is more reliant on reactions to aesthetic phenomena, standard objections against experimental philosophy that turn on the reliance on intuitions from thought experiments are less applicable. Jonathan Weinberg (2019) argues that the availability of artworks means that experimenters need not rely solely on descriptive vignettes. The presentation of actual artworks can fill in gaps that are usually left by the short textual vignettes that are typical of philosophical thought experiments. We should note, however, that in actuality such studies remain relatively rare (some examples are Kamber 2011; Meskin et al. 2013; Liao & Meskin 2017; Bonard 2019; Puy 2022; Mikalonytė & Canonne forthcoming)[^bonard-2019][^kamber-2011][^liao-2017][^meskin-2013][^puy-2022].
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      There is ongoing debate about whether studies about music should depend on the use of acoustic stimuli. Building on Weinberg’s argument, Nemesio Puy (2022) contends that ontological judgments about artworks involve an aesthetic dimension and must therefore be grounded in the experience of real works of art. This contention receives indirect support from a study that shows people are generally unwilling to base their beliefs about aesthetic dimension of an artwork on testimony alone, without first-personal perceptual access (Andow 2019)[^andow-2019]. Moreover, this contention receives direct support from two studies that show that the decision to include or exclude acoustic stimuli has an effect on the results of studies investigating ontological judgments, even if the descriptive part of the stimuli is kept as consistent as possible (Puy 2022; Mikalonytė & Canonne forthcoming)[^puy-2022]. Notwithstanding this, Elzė Mikalonytė (forthcoming) points out several reasons why purely textual vignettes are so widely used and might not always be easily replaceable. Such vignettes might help the participants to focus on the most relevant aspects and filter out irrelevant factors. In fact, additional perceptual information may actually distract participants, as may occur, for example, in making judgments in the ontology of art, which arguably should be made on the basis of conceptual rather than perceptual information (such as information about the artist’s intentions). Especially in the case of music, presenting the participants with short descriptions without corresponding works of music might help to avoid relying on sustained attention over extended periods of time.
