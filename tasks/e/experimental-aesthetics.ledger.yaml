    source: |-
      Experimental philosophy of art and aesthetics is the application of the methods of experimental philosophy to questions about art and aesthetics. By taking a scientific approach to experiences with art and aesthetic phenomena, it is continuous with the longstanding research program in psychology called *empirical aesthetics* (see Nadal & Vartanian 2022 for overviews of work in this program)[^nadal-2022][^nadal-2022-2]. However, it is also continuous with traditional research in philosophy of art and aesthetics because it is centered on many of the same timeless questions. Like other branches of experimental philosophy, such as experimental moral philosophy, it involves gathering data using empirical methods and bringing analyses of the data to bear on theorizing on a wide range of topics in philosophy of art and aesthetics: definition of art, ontology of art, aesthetic properties, aesthetic judgments, aesthetic adjectives, morality and aesthetics, and emotion and art. In this entry, we briefly examine the history prior to the current movement’s emergence in the 2010s, extensively survey extant works in this movement on each of the topics, and consider methodological debates regarding this movement.
    step1: |-
      艺术与美学的实验哲学，是把实验哲学的方法应用于关涉艺术与美学的问题。它采取科学进路来研究对艺术与审美现象的经验，因而与心理学中称为*empirical aesthetics*（经验美学）的悠久研究纲领一脉相承（该纲领研究工作的综述见 Nadal & Vartanian 2022）[^nadal-2022][^nadal-2022-2]。不过，它也同艺术哲学与美学中的传统研究一脉相承，因为它所围绕的仍是其中许多历久弥新的问题。像实验道德哲学等其他实验哲学分支一样，它运用经验方法收集数据，并把对数据的分析用于艺术哲学与美学中广泛议题的理论建构：艺术的定义、艺术的本体论、审美属性、审美判断、审美形容词、道德与美学、情感与艺术。在本词条中，我们先简要考察当前运动于 2010 年代兴起之前的历史，再广泛综述该运动在各议题上已有的研究，最后讨论关涉该运动的方法论争端。
    step2: |-
      艺术与美学的实验哲学，是将实验哲学的方法运用于艺术与美学问题的研究。它以科学方式研究艺术经验与审美现象，与心理学中名为*empirical aesthetics*（经验美学）的悠久研究纲领一脉相承（关于该纲领研究工作的综述，见 Nadal & Vartanian 2022）[^nadal-2022][^nadal-2022-2]。与此同时，它也承接艺术哲学与美学的传统研究，因为其核心仍是这一领域许多历久弥新的问题。与其他实验哲学分支（如实验道德哲学）一样，它用经验方法收集数据，再以数据分析支撑艺术哲学与美学中一系列议题的理论建构：艺术的定义、艺术本体论、审美属性、审美判断、审美形容词、道德与美学，以及情感与艺术。本词条先简要梳理 2010 年代这场运动兴起之前的学术史，继而系统综述该运动在各议题上现有的成果，最后考察围绕该运动展开的方法论争论。
