      此外，尽管关于审美判断的多数研究都指向主观主义，关于审美趣味的研究却表明，人们相信审美趣味*可以*有好坏之分。Constant Bonard 等人（2022）询问被试，区分好品味与坏品味是否有意义，继而请他们界定所谓好品味是什么。多数被试赞同这一区分；尽管有相当一部分人以察觉审美属性的能力来界定好品味，表达了与审美实在论相容的观点，但对另一些被试来说，好品味与审美主观主义相容，因为“好品味”被简单地界定为与自身个人偏好相符的东西。另一个被认为与好品味是否存在有关的现象，是“罪恶快感”（guilty pleasures）——享受自己觉得不该享受的审美对象。正如 Kris Goffin 与 Florian Cova（2019）所观察到的，罪恶快感的存在乍看或许可被视为大众中存在好品味的证据。然而，他们给出的证据表明，人们体验到的罪恶感应当被理解为违反社会规范所致的罪恶感，而非违反审美规范，因此不应被视为大众审美实在论的证据。
