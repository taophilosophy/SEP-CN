      Where the studies described above have attempted to treat aesthetic adjectives as a homogeneous and *sui generis* class, more recent studies have pointed to important sources of heterogeneity amongst them. ‘Beautiful’ and ‘pretty’ are similar adjectives in that they can both express certain descriptive contents—namely, that an appearance is intrinsically pleasing, or that it is, for example, delicate, small, and soft. But they differ insofar as prettiness is thought to be more closely tied to appearances and less important than beauty. In trying to account for this patterning, Doran (forthcoming a) suggests that BEAUTY but not PRETTINESS is a dual-character concept, and that in addition to the descriptive senses they share, BEAUTY has a normative sense connected to our most cherished values, including, most prominently, moral goodness. In support of this claim, in one of the studies reported, he shows that ‘beauty’ but not ‘prettiness’ is judged to be able to felicitiously combine with the ‘true’ modifier, which is thought to be one source of evidence that the concept expressed by a given lexical item is dual-character (Knobe et al. 2013)[^knobe-2013]. “That is true beauty” sounds perfectly natural to native speakers of English, but “That is true prettiness” sounds decidedly odd.
    step1: |-
      上述研究试图把审美形容词当作一个同质且*sui generis*（自成一类）的类别来处理，而较晚近的研究则指出了其中重要的异质性来源。“美的”（beautiful）与“漂亮的”（pretty）是相似的形容词，因为二者都能表达某些描述性内容——即一种外观本身即令人愉悦，或者例如精致、小巧、柔软。但它们也有差异，因为漂亮被认为与外观联系更紧，且不如美重要。为解释这一模式，Doran（即将发表 a）提出，BEAUTY 而非 PRETTINESS 是一个双重特征概念；除了二者共有的描述性含义之外，BEAUTY 还有一种规范性含义，与我们最珍视的价值相关，其中最突出的是道德上的善。为支持这一主张，他在所报告的一项研究中表明，“beauty”而非“prettiness”被判定能够妥帖地与“真正的”这一修饰语组合，而这被视为某一词汇项所表达的概念是双重特征的证据来源之一（Knobe et al. 2013）[^knobe-2013]。“That is true beauty”（那是真正的美）在英语母语者听来十分自然，而“That is true prettiness”（那是真正的漂亮）则明显古怪。
    step2: |-
      上述研究倾向于把审美形容词视为同质而*sui generis*（自成一类）的类别，较晚近的研究却揭示了其中重要的异质来源。“美的”（beautiful）与“漂亮的”（pretty）颇为相似，都能表达某些描述性内容——即某种外观本身令人愉悦，或显得精致、小巧、柔润。但二者有别：漂亮被认为更依附于外观，其重要性也不及美。为解释这一格局，Doran（即将发表 a）提出：BEAUTY 是双重特征概念，PRETTINESS 则否；除共有的描述性含义外，BEAUTY 还有一层规范性含义，系于我们最珍视的价值，其中最突出者便是道德善。为支持此说，他在一项研究中显示，“beauty”可与“真正的”这一修饰语妥帖组合，“prettiness”则不能——这正是判定某一词汇项所表达的概念为双重特征的证据之一（Knobe et al. 2013）[^knobe-2013]。英语母语者觉得“That is true beauty”（那是真正的美）十分自然，却觉得“That is true prettiness”（那是真正的漂亮）颇为古怪。
