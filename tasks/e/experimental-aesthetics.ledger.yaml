      There is a nearby segment of natural language that has attracted much attention from philosophers and linguists: *predicates of personal taste* such as ‘tasty’ and ‘fun’. Indeed, some experimental philosophers have made valuable contributions to this debate (such as Kneer, Vicente, & Zeman 2017; Dinges & Zakkou 2020; Kneer 2021)[^dinges-2020][^kneer-2021]. However, scholars in this debate typically set aesthetic adjectives to the side in their investigations. For example, Peter Lasersohn (2005: 645) explicitly does so in order to avoid fundamental issues in aesthetics. In contrast to the lively scholarly activity on predicates of personal taste, there are only a few works that explicitly and primarily investigate aesthetic adjectives. As such, it remains an open question whether aesthetic adjectives are distinct from predicates of personal taste, or whether there exists a unified treatment of the two.
    step1: |-
      自然语言中还有一段邻近的区域，吸引了哲学家与语言学家的许多关注：*个人品味谓词*（predicates of personal taste），如“好吃的”“好玩的”。事实上，一些实验哲学家对这场争论作出了宝贵贡献（如 Kneer, Vicente, & Zeman 2017; Dinges & Zakkou 2020; Kneer 2021）[^dinges-2020][^kneer-2021]。然而，这场争论中的学者在其研究中通常把审美形容词搁置一旁。例如，Peter Lasersohn（2005: 645）为了避开美学中的根本问题而明确这样做。与关于个人品味谓词的热烈学术活动形成对比的是，明确且主要研究审美形容词的著作寥寥无几。因此，审美形容词是否与个人品味谓词有别，抑或二者存在统一的处理方式，仍是一个悬而未决的问题。
    step2: |-
      自然语言中还有一段与之相邻、颇受哲学家与语言学家瞩目：*个人品味谓词*（predicates of personal taste），如“好吃的”“好玩的”。事实上，已有实验哲学家对这场争论贡献良多（如 Kneer, Vicente, & Zeman 2017; Dinges & Zakkou 2020; Kneer 2021）[^dinges-2020][^kneer-2021]。只是这场争论中的学者多半把审美形容词置于一旁，例如 Peter Lasersohn（2005: 645）就明确如此处理，以回避美学中的根本问题。与个人品味谓词研究的活跃相比，专门且明确以审美形容词为对象的成果屈指可数。因此，审美形容词究竟是否不同于个人品味谓词，抑或两者可作统一处理，迄今仍无定论。
