      Cova (2019) suggests that the folk might be expressivists about aesthetic judgments, and that they may think that there can nonetheless be correctness conditions for aesthetic judgments, insofar as people can, for example, be mistaken about the cause of the feelings they express. In one study to begin to test this position, Cova presented participants with a case where someone judges the Eiffel tower to be beautiful as a result of being high on drugs, or as a result of seeing the Eiffel tower unimpaired. The results reveal that participants were less likely to say that a judgment of beauty was true and more likely to say that the judgment was false when the experience was the result of drugs. Similarly, across five studies that manipulated the type of disagreement (cross-cultural or intercultural, or internal disagreement of one individual over time) and asked participants about the possibility of error in aesthetic judgments, James Andow (2022) found that while people do not hold realist beliefs, they do believe that they have correctness conditions (though see Murray 2020 for results suggesting that people do not think that disagreement implies that they are seen as incorrect)[^murray-2020].
