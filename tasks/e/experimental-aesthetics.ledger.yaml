      ## 7. Emotion and Art
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      There is a rich set of puzzles in philosophical aesthetics concerning emotional responses to fictions, and here, both psychologists and experimental philosophers have made contributions, in some cases moving the debate beyond the standard philosophical concerns. Here we discuss a few of those that have received the most attention from philosophers: *How can fiction elicit emotional responses when we know that the characters do not exist? If certain works of art, particularly music, can evoke negative emotions, like sadness, which we typically aim to avoid in everyday life, why do we pursue such experiences in art contexts? Moreover, how can music be expressive of emotions, if there is nobody in the music itself experiencing them?*
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      The ‘paradox’ of fiction is motivated by the following observation: if we were to learn that events in life that make us feel sad have not in fact come to pass, our sadness would disappear. But the same is not true in art. I may know that Tolstoy’s *Anna Karenina* does not exist, and yet may feel sad reading about her fate in the novel (Radford & Weston 1975)[^radford-1975]. With this in mind, the paradox of fiction has standardly been formulated as a trilemma of three individually plausible but mutually inconsistent claims (for example, Currie 1990)[^currie-1990]:
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      1. We have emotional responses directed towards fictional entities and situations in literature and art;
      2. In order to have emotional responses we need to believe in the existence of the entities and situations that they are directed at;
      3. We do not believe in the existence of the fictional entities in literature and art.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Most philosophers have now jettisoned this paradoxical formulation, by rejecting proposition (2). But, even if there is no paradox per se, philosophers have noted that interesting questions remain here: *Do our emotional responses to fictions differ from their real-life cognates? And, if so, what might explain this? Do our emotional responses to fiction involve different mental representations, for example? And are any differences that exist sufficient to constitute a different kind of emotional response?*
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      In connection with this, some experimental philosophers have thought that the emotional responses that are had in response to fictional entities and events might differ in their intensity, as a result of differences in self-referential processes. Sperduti et al. (2016), for example, asked participants to watch clips of scenarios apt to elicit positive or negative emotions, or neutral video clips, presented as either mockumentaries (fiction), or documentaries or amateur films (non-fiction). Participants self-reported less intense emotions only in response to the *negative* clips when they were presented as fictions, and even here, there were no differences in the physiological responses (and specifically, in electrodermal activity). The authors interpret this as suggesting that the emotional responses to fiction are genuine emotions, on the grounds that there are no physiological differences, but that appraisals of fictionality might nonetheless cause people to psychologically distance themselves from the content (for discussion, see Pelletier 2019)[^pelletier-2019]. Humbert-Droz et al. (2020), by contrast, found that longer clips of sad scenes lead to lower skin conductance when labeled as non-fictional versus fictional, as well as greater self-reports of sadness—suggesting that believing that the clip was real led to greater sadness. Given the mixed findings in this context, the issues of whether the emotions that we feel in response to fiction differ from those we feel in non-fictional contexts, and if so why, remain open questions.
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      The paradox of negative emotion (Hume 1757b)[^hume-1757b], has intrigued philosophers since the time of Aristotle: why do we seek exposure to art arousing negative emotions if negative emotions is something that we tend to avoid in our everyday life? One important example is listening to sad music, which is often thought to evoke sad mood in listeners (though for dissent, see Kivy 1990)[^kivy-1990]. There is vast psychological literature on emotional responses to music that are relevant to this philosophical discussion (see Mitterschiffthaler et al. 2007; Juslin & Västfjäll 2008; Vuoskoski & Eerola 2012; Koelsch, 2014; Peltola & Eerola 2016; Juslin 2019)[^juslin-2019][^juslin-2008][^mitterschiffthaler-2007][^peltola-2016][^vuoskoski-2012], and it has received some attention from experimental philosophers as well.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Mario Attie-Picker and colleagues (2024) tested the hypothesis that people choose to listen to sad music because of the emotions music is expressive of: listening to sad music allows people to feel more connected. In the first study, participants were presented with vignettes describing musical pieces with differing levels of musical proficiency and emotional expressiveness. They were then asked to what extent they agreed that the described piece of music was good and embodied the essence of what music is ‘all about’. The results revealed that emotional expressiveness, more so than technical proficiency, influenced judgments on what are the characteristic values of music. In the second study, participants were asked to complete sentences about (a) the characteristic values of music, (b) feeling connected in conversations, and (c) pleasantness of music. They found an overlap between the emotions people listed as embodying what music is “all about” and the emotions that make people feel connected in conversations. Attie-Picker and colleagues thus try to explain the paradox by shifting the focus away from the traditional emphasis on the listener’s felt emotions and instead centering it on emotions one perceives in music.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      The paradox of emotional expressiveness is related not to the emotions we feel when we listen to music, but rather emotions we hear in the music itself. In our everyday conversations, we often characterize music as joyful, sad or angry. We use those terms when discussing a piece of music—an entity that does not have mental states and is incapable of experiencing emotions.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      One way to empirically study the relationship between music and emotional expressiveness is through cross-cultural research. Psychological literature suggests that cross-cultural recognition of emotions in music is quite limited. Some studies have shown that the list of cross-culturally recognizable emotions in music is limited to three basic emotions of happiness, sadness and fear (Fritz et al. 2009)[^fritz-2009]. Other studies suggest that even major and minor chords may not, after all, be universally associated with happiness and sadness (Lahdelma et al. 2021; Smit et al. 2022)[^lahdelma-2021][^smit-2022]. However, at least aversion to dissonant musical chords appears to be cross-cultural (Lahdelma et al., 2021).
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      The question of cross-cultural recognizably has also been tackled in Constant Bonard’s experimental philosophy paper (2019). Bonard argues that the affective meaning of a musical piece depends on musical grammar, as there is an overlap of cognitive mechanisms constituting the capacity for language and capacity for music. According to him, listeners familiar with certain musical idioms and grammatical organizations are better able to perceive the affective meaning of a piece. Bonard presented his participants in Geneva and India with excerpts from Western classical music, South Indian music, as well as a set of atonal melodies that do not belong to either of these cultures. They were asked to identify musical excerpts that do not correspond to musical grammatical rules. For both Indian and Western participants, the Western and atonal (but not Indian) stimuli were easier to encode for those familiar with the musical idiom. Participants were also asked to listen to musical extracts and continually rate how much the music expressed a given emotion. The study confirmed that participants were better at recognizing the affective dimension of music that originated from their region. Taken together, these studies present tentative evidence that the recognition of emotions in music may depend on familiarity with local musical grammar rules (for more readings on musical semantics, also see Schlenker 2017, 2019, 2022)[^schlenker-2017].
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      The topic of art and emotion induction may also be relevant to discussions on art and morality. Angelika Seidel and Jesse Prinz (2013b) found that music can be used to induce positive or negative emotions, which in turn modifies moral evaluations. Roughly, happy music increases judgments of goodness, and angry music increases judgments of wrongness. Seidel and Prinz (2013a) further discovered that different negative musically-induced emotions, anger and disgust, can impact the severity of different kinds of moral judgments. A more complex result comes from Ansani and colleagues (2024), which shows that musical expertise is likely to lead to more individualizing moral foundations as opposed to binding ones.
    step1: TBD
    step2: TBD
