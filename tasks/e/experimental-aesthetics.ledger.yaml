      ## 5. Aesthetic Adjectives
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      *Aesthetic adjectives*, such as ‘beautiful’ and ‘elegant’, are central to aesthetic communication: they are the most common tools with which we attribute aesthetic properties to works and communicate aesthetic judgments with others. Some philosophers contend that aesthetic adjectives constitute a segment of natural language that is interesting in its own right, for different reasons. Frank Sibley (1959, 2001) argues that aesthetic adjectives are distinctive in that they require taste to apply. By this, Sibley means that whether an aesthetic adjective applies to a work is never determined by any set of non-aesthetic properties. Tim Sundell (2017) argues that although aesthetic adjectives are not semantically distinctive, they are metalinguistically distinctive because of their role in coordinating and negotiating standards. By this, Sundell means that when you say ‘this artwork is beautiful’ and I say ‘no it is not’, we are not only attributing properties to the work itself, but communicating our different standards of beauty through our different applications of the term ‘beautiful’.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      There is a nearby segment of natural language that has attracted much attention from philosophers and linguists: *predicates of personal taste* such as ‘tasty’ and ‘fun’. Indeed, some experimental philosophers have made valuable contributions to this debate (such as Kneer, Vicente, & Zeman 2017; Dinges & Zakkou 2020; Kneer 2021)[^dinges-2020][^kneer-2021]. However, scholars in this debate typically set aesthetic adjectives to the side in their investigations. For example, Peter Lasersohn (2005: 645) explicitly does so in order to avoid fundamental issues in aesthetics. In contrast to the lively scholarly activity on predicates of personal taste, there are only a few works that explicitly and primarily investigate aesthetic adjectives. As such, it remains an open question whether aesthetic adjectives are distinct from predicates of personal taste, or whether there exists a unified treatment of the two.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      Louise McNally and Isidora Stojanovic (2017) argue that while predicates of personal taste are necessarily mind-dependent insofar as they entail an experiencer, aesthetic adjectives are semantically distinctive because they express evaluations without entailing an experiencer. McNally and Stojanovic’s diagnostic appeals to the fact that the verb ‘find’ tends to complement adjectives with an experiencer. For example, sentences like ‘I find him attractive’ tend to sound fine but sentences like ‘I find him tall’ tend to sound weird. Using the British National Corpus, they found that aesthetic adjectives do not tend to complement ‘find’, which they take to be evidence that “their evaluative component is not based directly on personal experience” (2017: 29).
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Shen-yi Liao and Aaron Meskin (2017) argue that aesthetic adjectives are semantically distinctive because they exhibit a strange sort of context-sensitivity. Standardly, gradable adjectives are classified as absolute or relative. Absolute adjectives—such as ‘straight’ or ‘spotted’—have their standards of application built in, and do not rely on the context to fix this threshold. By contrast, relative adjectives—such as ‘warm’ or ‘long’—do rely on a context for its threshold of application. Through a series of experiments involving a diagnostic used to classify gradable adjectives, Liao and Meskin found that aesthetic adjectives behaved like neither absolute nor relative adjectives. Participants were presented with pairs of objects and asked to pick out ‘the [adjective] one’. The key to this diagnostic is that ‘the’ implies both existence (there is at least one) and uniqueness (there is at most one). As such, most participants are unable to pick out *the* spotted disc when presented with two discs that are spotted to different degrees because ‘spotted’, as an absolute adjective, has a context-insensitive threshold of application which is met in both cases. By contrast, most participants are able to pick out *the* long rod when presented with two rods that are long to different degrees because ‘long’, as a relative adjective, has a threshold of application that is sensitive to the context. In particular, participants are able to construct an implicit comparison class using the context of application: they pick out the long*er* rod as ‘the long one’. However, Liao and Meskin found that about half of the participants use ‘beautiful’ like ‘spotted’ and about half of the participants use ‘beautiful’ like ‘long’. Moreover, the same pattern holds also for negative aesthetic adjectives like ‘ugly’ and thick aesthetic adjectives like ‘elegant’. These results are difficult to explain for the standard typology of gradable adjectives.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      Stojanovic (2019) argues that Liao and Meskin’s results do not provide grounds for drawing any interesting conclusions regarding semantic adjectives because the studies do not reveal a stable pattern. The 50/50 pattern in response to the request to pick out *the* beautiful / ugly / elegant object is just what would be expected if participants were answering by chance. Liao, McNally, and Meskin (2016) conducted further experiments and corpus observations to show the instability of aesthetic adjectives’ behaviors. On some diagnostics they pattern with absolute adjectives, but on other diagnostics they pattern with relative adjectives. In response to these results, they propose a different hypothesis: aesthetic adjectives are like relative adjectives insofar as both involve implicit comparison classes, but unlike relative adjectives insofar as their implicit comparison classes are not determined by the immediate context of application.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Where the studies described above have attempted to treat aesthetic adjectives as a homogeneous and *sui generis* class, more recent studies have pointed to important sources of heterogeneity amongst them. ‘Beautiful’ and ‘pretty’ are similar adjectives in that they can both express certain descriptive contents—namely, that an appearance is intrinsically pleasing, or that it is, for example, delicate, small, and soft. But they differ insofar as prettiness is thought to be more closely tied to appearances and less important than beauty. In trying to account for this patterning, Doran (forthcoming a) suggests that BEAUTY but not PRETTINESS is a dual-character concept, and that in addition to the descriptive senses they share, BEAUTY has a normative sense connected to our most cherished values, including, most prominently, moral goodness. In support of this claim, in one of the studies reported, he shows that ‘beauty’ but not ‘prettiness’ is judged to be able to felicitiously combine with the ‘true’ modifier, which is thought to be one source of evidence that the concept expressed by a given lexical item is dual-character (Knobe et al. 2013)[^knobe-2013]. “That is true beauty” sounds perfectly natural to native speakers of English, but “That is true prettiness” sounds decidedly odd.
    step1: TBD
    step2: TBD
