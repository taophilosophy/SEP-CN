      Then, in a series of studies led by Florian Cova, the folk’s meta-aesthetical views were further tested by presenting participants with an aesthetic disagreement—such as where someone finds a sunset beautiful and the other does not—between two interlocutors (or between the participant and an interlocutor), and asking participants whether one person is correct, both are correct, or neither is correct. Across different kinds of objects (including natural objects and art widely recognized to be beautiful, as well as objects that study participants *personally* find beautiful), type of aesthetic judgments (including judgments of beauty and ugliness), and across a wide range of different countries, it has been found that most select the option “Neither is correct” (Cova & Pain 2012; Cova, Olivola, et al. 2019; for further studies utilizing the disagreement method, see Andow 2022)[^andow-2022][^cova-2012].
    step1: |-
      随后，在 Florian Cova 主导的一系列研究中，通过向被试呈现两个论辩者之间（或被试与论辩者之间）的审美分歧——例如一人觉得落日很美、另一人不觉得——并询问被试究竟是一方正确、双方都正确，还是双方都不正确，大众元审美观点得到进一步检验。跨越不同种类的对象（包括自然对象与公认美丽的艺术品，也包括被试*个人*觉得美丽的对象）、审美判断的类型（包括对美与对丑的判断），以及一大片不同的国家，结果都发现：多数人选“双方都不正确”（Cova & Pain 2012; Cova, Olivola, et al. 2019；关于使用分歧方法的其他研究，见 Andow 2022）[^andow-2022][^cova-2012]。
    step2: |-
      接着，Florian Cova 主持的一系列研究进一步检验了大众的元审美观点：向被试呈现一桩审美分歧（甲认为落日很美、乙却不这么看），分歧双方要么是两位论辩者，要么是被试本人与一位论辩者，然后询问是一方正确、双方都正确还是双方都不正确。研究变换对象类型（自然物、公认美丽的艺术品，以及被试*个人*觉得美的对象）、判断类型（美与丑），并跨多个国家取样，结果始终一致：多数人选“双方都不正确”（Cova & Pain 2012; Cova, Olivola, et al. 2019；采用分歧范式的其他研究见 Andow 2022）[^andow-2022][^cova-2012]。
