      Shen-yi Liao and Aaron Meskin (2017) argue that aesthetic adjectives are semantically distinctive because they exhibit a strange sort of context-sensitivity. Standardly, gradable adjectives are classified as absolute or relative. Absolute adjectives—such as ‘straight’ or ‘spotted’—have their standards of application built in, and do not rely on the context to fix this threshold. By contrast, relative adjectives—such as ‘warm’ or ‘long’—do rely on a context for its threshold of application. Through a series of experiments involving a diagnostic used to classify gradable adjectives, Liao and Meskin found that aesthetic adjectives behaved like neither absolute nor relative adjectives. Participants were presented with pairs of objects and asked to pick out ‘the [adjective] one’. The key to this diagnostic is that ‘the’ implies both existence (there is at least one) and uniqueness (there is at most one). As such, most participants are unable to pick out *the* spotted disc when presented with two discs that are spotted to different degrees because ‘spotted’, as an absolute adjective, has a context-insensitive threshold of application which is met in both cases. By contrast, most participants are able to pick out *the* long rod when presented with two rods that are long to different degrees because ‘long’, as a relative adjective, has a threshold of application that is sensitive to the context. In particular, participants are able to construct an implicit comparison class using the context of application: they pick out the long*er* rod as ‘the long one’. However, Liao and Meskin found that about half of the participants use ‘beautiful’ like ‘spotted’ and about half of the participants use ‘beautiful’ like ‘long’. Moreover, the same pattern holds also for negative aesthetic adjectives like ‘ugly’ and thick aesthetic adjectives like ‘elegant’. These results are difficult to explain for the standard typology of gradable adjectives.
    step1: |-
      Shen-yi Liao 与 Aaron Meskin（2017）主张，审美形容词在语义上独特，因为它们表现出一种奇特的语境敏感性。按标准做法，可分级形容词被分为绝对形容词与相对形容词。绝对形容词——如“直的”或“有斑点的”——其适用标准内置于词义，不依赖语境来确定这一阈值。相反，相对形容词——如“暖的”或“长的”——确实依赖语境来确定其适用阈值。通过一系列使用可分级形容词分类诊断的一系列实验，Liao 与 Meskin 发现，审美形容词的表现既不像绝对形容词，也不像相对形容词。被试看到成对的对象，并被要求挑出“那个［形容词］的”。这一诊断的关键在于，“那个”同时蕴含存在（至少有一个）与唯一（至多有一个）。因此，当呈现两个斑点程度不同的圆盘时，多数被试无法挑出*那个*有斑点的圆盘，因为“有斑点的”作为绝对形容词，其适用阈值不依赖语境，两个圆盘都满足。相反，当呈现两根长短不同的杆时，多数被试能够挑出*那根*长杆，因为“长的”作为相对形容词，其适用阈值对语境敏感。具体来说，被试能够利用适用语境构造一个隐含的比较类：他们挑出长*一些*的那根杆作为“那根长杆”。然而，Liao 与 Meskin 发现，约一半被试像使用“有斑点的”那样使用“美的”，约一半被试像使用“长的”那样使用“美的”。此外，同一模式也适用于“丑的”等负面审美形容词以及“优雅的”等厚审美形容词。这些结果难以用可分级形容词的标准类型学来解释。
    step2: |-
      Shen-yi Liao 与 Aaron Meskin（2017）主张，审美形容词的语义特点在于一种奇特的语境敏感性。按标准分类，可分级形容词分为绝对与相对两类。绝对形容词（如“直的”“有斑点的”）的适用标准内置于词义，其阈值不由语境决定；相对形容词（如“暖的”“长的”）的适用阈值则依赖语境。Liao 与 Meskin 用一套可分级形容词的分类诊断做了一系列实验，发现审美形容词既不像绝对形容词，也不像相对形容词。诊断的做法是：给被试成对的对象，请其挑出“那个［形容词］的”。关键在于，“那个”同时蕴含存在（至少一个）与唯一（至多一个）。因此，面对两个斑点程度不同的圆盘，多数被试挑不出*那个*有斑点的圆盘——因为“有斑点的”是绝对形容词，其阈值不随语境而变，两盘皆满足。反之，面对两根长短不同的杆，多数被试能挑出*那根*长杆——因为“长的”是相对形容词，阈值随语境而变；被试可借语境构造隐含的比较类，挑出长*一些*的那根，称之为“那根长的”。然而 Liao 与 Meskin 发现，约半数被试像用“有斑点的”那样用“美的”，另约半数则像用“长的”那样用“美的”；“丑的”等负面审美形容词与“优雅的”等厚审美形容词亦然。这一结果难以用可分级形容词的标准类型学来解释。
