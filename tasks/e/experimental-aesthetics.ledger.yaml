      为捍卫休谟式观点，Meskin 等人（2013）提出，单纯曝光未必会不分青红皂白地提升对作品的喜爱，不论其审美品质如何；相反，它或许有助于我们更准确地领会作品真正的审美优点与缺点。作为推论，他们还提出，作品之所以进入经典，也许正是因为它们确实更优。为检验其休谟式辩护，他们让被试仅仅接触他们与许多批评家都认为好和坏的作品（分别是 John Millais 与 Thomas Kinkade 的作品）。结果显示，被试接触 Kinkade 画作越多，就越*不喜欢*它们；结果还显示，被试接触 Millais 晚期画作越多，就越*喜欢*它们（尽管这一趋势并不显著）。Meskin 及其同事把这一证据解释为与审美价值的存在以及时间检验的可靠性相容：随着反复接触，我们更能评价一件作品的优点与缺点，因此那些流传下来的作品之所以流传，至少部分是因为具有造就优点的特征。
