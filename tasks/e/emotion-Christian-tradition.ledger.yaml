      ‘情绪’是不是指称这些经验的对的语词？在托马斯·狄克逊（Thomas Dixon）关于情感概念史的著名研究（2003）中，他论证说，‘情绪’（emotion）一词是在 19 世纪早期由受物理学影响的心理学家们造出来的，用作对‘激情’（passion）与‘情感’（affection）之间那充满道德、宗教与形而上学意涵的区分的世俗替代物。在较古老的基督教心理学中（它在 19 世纪晚期仍有杰出的代表），我们如今称之为情感的现象被称为激情与情感，这两个范畴彼此有别。阿奎那是这种‘情感’心理学的范式思想家。激情（*passiones*）是人与动物共有的感受性反应，是对身体与感觉性事件（例如对危险、食物、性机会的感觉知觉）的反应。它们以内脏的骚动为标志，并与道德诱惑或堕落相关联。相反，情感（*affectiones*）不是产生于感性欲望，而是产生于意志或理智欲望，那是人所特有的心理能力。人类不与动物共享*affectiones*，而是与更高的存在者如天使和上帝共享。然而，激情并非总是有罪的，如果感受到激情的人通过意志或理智欲望的行为加以认可，激情就能转化为情感。狄克逊论证说，‘emotion’是由生理心理学家托马斯·布朗、赫伯特·斯宾塞和亚历山大·贝恩造出的。它后来被威廉·詹姆斯（1884）采用，尽管他关于宗教经验（1901–02）的著作更为现象学，较少关注物理因果。在《什么是情感？》（1884）中，詹姆斯著名地提出，情绪不过是对一种由对象直接产生的身体扰动的觉知（例如，一头大熊在偏僻小径上朝你逼近）。在今天的心理学中，‘emotion’仍倾向于带有这种物理主义的内涵，比早先的激情与情感语汇——它向属灵的‘情感’开放——更不具分辨力。与其把前面简要勾勒的喜乐等圣经反应称为情绪，不如遵循较早的基督教语汇，把它们称为情感，这难道不更具分辨力、更少混淆吗？如果感恩——如宗教人士所以为的——能够以朝向上帝为成功，如果保罗的喜乐能够关乎哥林多人悔恨的道德地位，那么它们显然就不是对物理或感觉刺激的简单反应。的确，大多数人类情绪在‘情绪’一词原初的历史意义上并不够格称为情绪。那种似乎站得住脚的——“惊跳反应”（见 Robinson 1995）[^robinson-1995]——在我们通常的语词意义上也仅是可疑地算作情绪。我们的通常意义与狄克逊所追溯的历史起源相去甚远。狄克逊说得对，‘情绪’模糊了‘激情’与‘情感’曾经体现的区分。但可以说，这种区分理应被扬弃。以强烈生理骚动为标志的恐惧，可以被无理智的动物无法触及的对象所唤起，例如股市的暴跌。而且，唤起恐惧似乎需要的不仅是一头大熊在偏僻小径上向我走来的单纯感觉“刺激”。例如，我可能认出她是我的宠物，她迅速逼近是她欢迎我的热情。激情与情感之间的道德分界线也无效。激情可能是道德上美的（例如，一位妇女在别后见到丈夫时带着情欲色彩的喜乐），情感也可能是可鄙的（当你拆解同事最得意的论证时，羞辱他所感到的那种冷静而残忍的喜乐）。‘情绪’概念对对象是简单还是理智上复杂、是否感觉性的、是否伴随身体扰动、是否值得道德评价，都漠不关心——这种漠然似乎使它比早先的语汇更值得推荐。感恩、痛悔、怜悯、喜乐、盼望，以及所有其他宗教情感，都相当宽适地纳入‘情绪’这一范畴。
