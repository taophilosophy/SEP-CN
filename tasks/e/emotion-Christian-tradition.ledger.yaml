      这些态度性现象中，也许最突出的是喜乐（*chairein*、*chara*，以及程度上小得多的*agalliasthai*、*agalliasis*）。它在使徒保罗的著作中尤其显赫，保罗在《加拉太书》5:22–3 中把喜乐列入“〔圣〕灵的果子”清单。其观念似乎是：当喜乐是圣灵的果子时，它所关乎的是上帝所行的、上帝的本性或属性，或信徒与上帝的关系。也就是说，喜乐的“内容”是一种神学信念。引人注目的是，喜乐的对象有时也包含苦难。例如，《使徒行传》（第 5 章）记载，使徒们在耶路撒冷赢得了相当可观的追随者，大祭司的反应是把他们投入监狱。他们逃脱了，第二天又回来讲道与教导。当局再次逮捕他们，警告他们停止公开活动，但使徒们态度强硬，说是上帝吩咐他们这样做的。于是他们遭鞭打，又受告诫要停止活动。“〔使徒们〕离开公会，心里欢喜（*chairontes*），因被算是配为这名〔耶稣〕受辱”（《使徒行传》5:41；和合本修订版；下引新约经文均据此译本。又见《罗马书》5:3 与《歌罗西书》1:24）。这些喜乐的实例都彻头彻尾是神学性的，因为信徒的喜乐所关乎的是他或她对耶稣——上帝的儿子——的事奉与认同。

