      尽管有这一回应，如前述，至少有些自愿医学协助死亡的拥护者仍要追问：为何医学死亡协助应限于、特别是限于第 2 节所设头三项条件覆盖的人？如果人们胜任地提出的医学协助死亡请求应受尊重，那为何还要对谁能获得医学协助死亡设任何限制？例如，为何抑郁者或各类痴呆症患者不应有资格？多数自愿医学协助死亡的拥护者认为，把可及范围限于满足前述条件者（或考虑到那些讨论中提出的关切而修改过的条件），至少有两个理由。第一，他们主张有政治上的理由：使有行为能力者的医学协助死亡合法化在政治上有争议，故合法化的最大希望在于聚焦于最有可能促成法律改革的那些痛苦形式。这就是为何有些拥护者甚至否认“闭锁”综合征、运动神经元病、多发性硬化症患者有资格：严格说来，他们并非绝症患者，其请求只能依赖“痛苦无法忍受”的主张。第二，与此相关，多数拥护者对接纳抑郁、痴呆症患者获得医学协助死亡持谨慎态度，因为这些人不仅非绝症，其请求协助死亡的行为能力也容易受到质疑，尤其是当他们此前未表明过此种偏好时。把可及范围限于痛苦较少争议者，可以避免卷入争议。如前述，一些批评限制性做法者（如 Varelius 2014）[^varelius-2014] 立场更强：获得医学死亡协助根本不必以患某种疾病为条件，只要“厌倦了生命”便足够。只有少数法域——瑞士、荷兰与比利时——认真触及这一问题。无论这些法域将来如何，其他法域争取医学死亡协助立法者似仍会坚持：此种协助若要是正当的医疗照护形式，就必须针对某种疾病状况（而非因为某人“厌倦了生命”），且须限于满足第 2 节前述条件（或类似条件）者。简言之，他们主张：自主地请求死亡协助是启动此种协助的必要条件，但不应是充分条件。
