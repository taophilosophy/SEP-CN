    source: |-
      One central ethical contention in support of voluntary euthanasia is that respect for persons demands respect for their autonomous choices as long as those choices do not result in harm to others. Respect for people’s autonomous choices is directly connected with the requirement for competence because autonomy presupposes competence (cf., Brock 1992). People have an interest in making important decisions about their lives in accordance with their own conception of how they want to live. In exercising autonomy, or self-determination, individuals take responsibility for their lives; since dying is a part of life, choices about the manner of their dying and the timing of their death are, for many people, part of what is involved in taking responsibility for their lives. Many are concerned about what the last phase of their lives will be like, not merely because of fears that their dying might involve them in great suffering, but also because of the desire to retain their dignity, and as much control over their lives as possible, during this phase. A second contention in support of voluntary euthanasia was mentioned at the beginning of this entry, namely the importance of promoting the well-being of persons. When someone is suffering intolerable pain or only has available a life that is unacceptably burdensome (see the third condition above), and he competently requests medical assistance with dying, his well-being may best be promoted by affording him that assistance. When harnessed together, the value to individuals of making autonomous choices, and the value to those individuals who make such choices of promoting their own well-being, provide the moral foundation for requests for voluntary euthanasia. Each consideration is necessary for moral justification of the practice, but taken in isolation neither suffices (see, e.g., Young 2007, 2017; Sumner 2011, 2017)[^sumner-2011][^young-2007].
    step1: |-
      支持自愿安乐死的一项核心伦理主张是：尊重人，就要求尊重其自主选择，只要这些选择不伤害他人。尊重人的自主选择与行为能力的要求直接相关，因为自主以行为能力为前提（参 Brock 1992）。人有一种利益，即按自己对如何生活的构想，就自己生活中的重要事情作出决定。在行使自主或自我决定时，个人为自己的生活承担责任；既然死亡是生活的一部分，关于死亡方式与死亡时机的选择，对许多人而言正属于为自己的生活承担责任的一部分。许多人关心自己生命的最后阶段会是怎样，不仅因为害怕死亡过程会带来巨大痛苦，也因为他们希望在此阶段保住尊严，并尽可能多地保有自己的生活控制权。支持自愿安乐死的第二项主张，本词条开头已提及，即促进个人福祉的重要性。当一个人承受无法忍受的疼痛、或只剩一种不可接受的负累生活（见上文第三项条件），并胜任地请求医学死亡协助时，给予这种协助也许最能促进其福祉。把这两项价值合在一起——个人作出自主选择的价值，以及作出此类选择者促进自身福祉的价值——便为自愿安乐死的请求提供了道德基础。对实践作道德证成而言，两项考量缺一不可；单取其一均不足够（见如 Young 2007, 2017；Sumner 2011, 2017）[^sumner-2011][^young-2007]。
    step2: |-
      支持自愿安乐死有一项核心伦理主张：尊重人，就要求尊重其自主选择，只要这些选择不伤害他人。尊重自主选择与行为能力的要求直接相关，因为自主以行为能力为前提（参 Brock 1992）。人有一种利益，即按自己对如何生活的构想，就生活中的重要事情自行决定。在行使自主或自我决定时，个人为自己的生活担起责任；死亡既是生活的一部分，关于死亡方式与死亡时机的选择，对许多人来说就正是这份责任的一部分。许多人关心生命的最后阶段会是什么样子：既怕死亡过程带来巨大痛苦，也希望在这一阶段保住尊严，尽量掌握自己的生活。支持自愿安乐死的第二项主张，本词条开头已提及，即促进个人福祉。当一个人承受无法忍受的疼痛、或只剩不可接受的负累生活（见上文第三项条件），并胜任地请求医学死亡协助时，给予协助也许最能促进其福祉。两项价值合在一处——个人自主选择的价值，以及选择者促进自身福祉的价值——便构成了自愿安乐死请求的道德基础。要作道德证成，两项考量缺一不可；单取其一都不足够（见如 Young 2007, 2017；Sumner 2011, 2017）[^sumner-2011][^young-2007]。
