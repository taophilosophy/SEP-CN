      In November 2000, the Netherlands passed legislation to legalize the practice of voluntary euthanasia. The legislation passed through all the parliamentary stages early in 2001. The Belgian parliament passed similar legislation in 2002 and Luxembourg followed suit in 2009. (For a very helpful comparative study of relevant legislation see Lewis 2007. See also Griffiths, et al. 2008.)[^lewis-2007]
