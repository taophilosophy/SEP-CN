      It is sometimes said (e.g., Emanuel 1999; Keown in Jackson and Keown 2012)[^emanuel-1999][^jackson-2012] that it is not necessary nowadays for people to die while suffering from intolerable or overwhelming pain because the provision of effective palliative care has improved steadily, and hospice care is more widely available. Some have urged, in consequence, that voluntary euthanasia is unnecessary.
    step1: |-
      有时有人说（如 Emanuel 1999；Jackson 与 Keown 2012 中的 Keown）[^emanuel-1999][^jackson-2012]，如今人已不必在无法忍受或压倒性的痛苦中死去，因为有效姑息治疗的提供稳步改善，临终关怀也更易获得。有人据此主张，自愿安乐死已无必要。
    step2: |-
      有时有人说（如 Emanuel 1999、Jackson 与 Keown 2012 中的 Keown）[^emanuel-1999][^jackson-2012]：如今人已不必在无法忍受或压倒性的痛苦中死去，因为有效姑息治疗的供给稳步改善，临终关怀也更易获得。有人据此断言：自愿安乐死已不必要。
