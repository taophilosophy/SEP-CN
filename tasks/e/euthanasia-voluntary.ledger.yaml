      It should be acknowledged that these conditions are quite restrictive, indeed more restrictive than many think appropriate. In particular, the first condition restricts access to voluntary euthanasia to those who are *terminally ill*. While that expression is not free of all ambiguity, for present purposes it can be agreed that it does not include those who are rendered quadriplegic as a result of accidents, or sufferers from chronic diseases, or individuals who succumb to forms of dementia like Alzheimer’s Disease, to say nothing of those afflicted by ‘existential suffering’. Those who consider that cases like these show the first condition to be too restrictive (e.g., Varelius 2014, Braun, 2023)[^varelius-2014] may, nonetheless, agree that including them as candidates for legalized voluntary euthanasia is likely to make it far harder in many jurisdictions to gain sufficient support for legalization (and so to make it harder to help those terminally ill persons who wish to die). Even so, they believe that voluntary euthanasia should be permitted for those who consider their lives no longer worth living, not just for for the terminally ill. Whether those who judge that their lives are no longer worth living, and so believe their lives are in that sense ‘complete’, should be afforded medical assistance with dying, has recently become a pressing concern in Belgium and the Netherlands. Several court cases have affirmed that such assistance may sometimes be provided for individuals in the former category even though the question remains as to whether it is properly a medical responsibility to render assistance with dying to someone who believes her life is complete despite her not suffering from a terminal medical condition (see, e.g., Young 2017)[^young-2017]. Relatedly, the issues of whether those suffering from a disability which will not reasonably foreseeably lead to death and those suffering because of a mental illness should be able to access medical assistance with dying have recently been the subject of intense debate in Canada. The debate culminated in disabled individuals, whose conditions are the cause of enduring, intolerable and irremediable suffering, being given access to medical assistance with dying as long as they are capable of making a competent request for that assistance. An intention to make a similar arrangement for those whose sole underlying condition is a mental illness was flagged for introduction in 2024, but has been temporarily shelved until further research has been conducted on the issue. It seems likely that the changes that have been made, or mooted, in these jurisdictions to the eligibility conditions for medical assistance with dying will lead to an expansion of the eligibility conditions for voluntary medically assisted death in other jurisdictions.
    step1: |-
      应当承认，这些条件相当严格，比许多人认为适当的程度更严。尤其是第一项条件把自愿安乐死的可及范围限于 *身患绝症* 者。这一表述虽非全无歧义，但就目前目的而言，可以同意它不包括因事故而四肢瘫痪者、慢性病患者，或因阿尔茨海默病之类痴呆症而衰竭者，更不必说受“存在性痛苦”折磨者。认为这类病例表明第一项条件过严的人（如 Varelius 2014；Braun 2023）[^varelius-2014]，仍可能同意：把他们纳入合法化自愿安乐死的候选范围，很可能使许多法域更难为合法化争取足够支持（因而更难帮助那些求死的绝症患者）。即便如此，他们仍认为，自愿安乐死应不仅允许绝症患者，也应允许自认生命已不值得过下去的人。那些判定自己生命已不值得过下去、因而认为生命在此意义上“圆满”的人，是否应获得医学上的死亡协助，近来在比利时与荷兰已成为紧迫议题。若干法院案件确认，这类人有时可以获得此种协助；但问题仍在于：对于一个并不患绝症却认为生命已圆满的人，给予死亡协助是否本当属于医学职责（见如 Young 2017）[^young-2017]。与此相关，那些患有不会合理预见致死的失能者、以及因精神疾病而受苦者是否应能获得医学死亡协助，近来在加拿大争论激烈。争论的结果是：其状况造成持久、无法忍受且不可补救之苦的失能者，只要有能力胜任地提出请求，便可获得医学死亡协助。对于唯一根本状况是精神疾病者作类似安排，原定 2024 年引入，但已暂缓，以待进一步研究。这些法域对医学死亡协助资格条件所作或拟作的改变，很可能导致其他法域的自愿医学协助死亡资格条件随之扩张。
    step2: |-
      应当承认，这些条件相当严格，比许多人认为适当的程度更严。第一项条件尤其把自愿安乐死的可及范围限于 **身患绝症** 者。这一表述固然不无歧义，但就目前目的而言，可以同意它不包括因事故四肢瘫痪者、慢性病患者，也不包括阿尔茨海默病之类痴呆症的罹患者。更不必说受“存在性痛苦”折磨者。认为这类病例表明第一项条件过严的人（如 Varelius 2014、Braun 2023）[^varelius-2014] 也可能同意一点：把他们纳入合法化自愿安乐死的候选范围，很可能使许多法域更难为合法化争取足够支持。这自然也更难帮助那些求死的绝症患者。即便如此，他们仍主张：自愿安乐死不该只对绝症患者开放，凡自认生命已不值得过下去者都应被允许。这类人判定生命已不值得过下去，因而认为生命在此意义上“圆满”。他们是否应获得医学上的死亡协助，近来在比利时与荷兰已成紧迫议题。若干法院案件确认，此类协助有时可以提供给这类人；但仍存疑问：对于不患绝症却认为生命已圆满者，给予死亡协助是否本当属于医学职责（见如 Young 2017）[^young-2017]。与此相关，失能者（其状况不会合理预见致死）与精神疾病患者能否获得医学死亡协助，近来在加拿大争论激烈。争论的结果是：状况造成持久、无法忍受且不可补救之苦的失能者，只要有能力胜任地提出请求，便可获得此类协助。对唯一根本状况为精神疾病者作类似安排，原定 2024 年引入，现已暂缓，以待进一步研究。这些法域对资格条件所作或拟作的改动，很可能带动其他法域的自愿医学协助死亡资格条件随之扩张。
