      The technological interventions of modern medicine have had the effect of stretching out the time it takes for many people to die. Sometimes the added life this brings is an occasion for rejoicing; sometimes it drags out the period of significant physical and intellectual decline that a person undergoes with the result that life becomes no longer worth living. Many believe there is no single, objectively correct answer as to when, if at all, a person’s life becomes a burden and hence unwanted. If they are right, that simply points up the importance of individuals being able to decide autonomously for themselves whether their own lives retain sufficient quality and dignity to make life worth living. Others maintain that individuals can be in error about whether their lives continue to be worth living (cf., Foot 1977)[^foot-1977]. The conditions outlined above in Section 2 are intended by those who propose them to serve, among other purposes, to safeguard against such error. But it is worth adding that in the event that a person who considers that she satisfies those conditions is judged by her medical attendants to be in error about whether it would be worth her continuing to live, the likely outcome is that those attendants will refuse to provide medical assistance with dying. (Evidence that will be mentioned below shows that this happens more frequently than might be predicted in jurisdictions in which medically assisted dying has been legalized. (There are discussions of the principles at stake in such matters in Young 2007; Wicclair 2011; Sumner 2020.)[^sumner-2020][^wicclair-2011][^young-2007] Unless a patient is able to be transferred to the care of other medical professionals who accept her assessment, she will have to rely on her own resources (e.g., by refusing nutrition and hydration). Even so, other things being equal, as long as a critically ill person is competent, her own judgement of whether continued life is a benefit to her ought to carry the greatest weight in any end-of-life decision making regardless of whether she is in a severely compromised and debilitated state. The idea that a competent individual’s autonomous judgment of the value to her of continued life should trump an assessment by others of her well-being should not be thought surprising because precisely the same happens when a competent patient refuses life-prolonging treatment.
    step1: |-
      现代医学的技术干预，产生了一种效果：许多人的死亡过程被拉长。有时由此多得的生命值得庆幸；有时它拖长了身心显著衰退的时期，以致生活不再值得过。许多人相信，一个人的生命何时成为负担、因而不被想要，并没有单一的客观正确答案。若他们说得对，那恰恰凸显了让个人自主决定自己生命是否仍保有足够质量与尊严、是否值得过下去的重要性。另一些人坚持，个人可能在“自己的生命是否仍值得过”上判断有误（参 Foot 1977）[^foot-1977]。第 2 节所述条件，提出者的用意之一便是防止此类错误。但还须补充：若一个人自认满足那些条件，而她的医护人员判定她“继续活着是否值得”判断有误，可能的结果是这些医护人员拒绝提供医学死亡协助。（下文将提到的证据表明，在已使医学协助死亡合法化的法域，这种情况比人们预料的更常发生。关于此类事务中涉及的原则，讨论见 Young 2007；Wicclair 2011；Sumner 2020。）[^sumner-2020][^wicclair-2011][^young-2007] 除非病人能转由接受她判断的其他医务人员照护，她就只能依靠自己的办法（例如拒绝营养与水分）。即便如此，在其他条件相同的情况下，只要重症病人有行为能力，她对“继续活着是否对自己有益”的判断，在任何临终决策中都应权重最大，无论她的状态多么受损衰弱。有行为能力的个人对“继续活着对自己有何价值”的自主判断应压倒他人对其福祉的评估——这一想法不足为奇，因为有行为能力的病人拒绝延长生命的治疗时，情形恰好相同。
    step2: |-
      现代医学的技术干预，把许多人的死亡过程拉长了。多得的生命有时值得庆幸，有时却拖长了身心显著衰退的时期，以致生活不再值得过。许多人相信：一个人的生命何时成为负担、因而不被想要，并无单一的客观正确答案。若他们说得对，那恰恰凸显出个人自主决定的重要：自己的生命是否仍保有足够质量与尊严，是否还值得过下去。另一些人坚持，个人可能在“生命是否仍值得过”上判断有误（参 Foot 1977）[^foot-1977]。第 2 节所述条件，用意之一正是防止此类错误。但还须补充一点：若一个人自认满足那些条件，而其医护人员判定她在“继续活着是否值得”上有误，很可能这些医护人员会拒绝提供医学死亡协助。（下文将提及的证据表明，在已使医学协助死亡合法化的法域，这种情况比预想的更常见。此类事务涉及的原则，见 Young 2007、Wicclair 2011、Sumner 2020 的讨论。）[^sumner-2020][^wicclair-2011][^young-2007] 除非能转由接受她判断的其他医务人员照护，她就只能依靠自己的办法，例如拒绝营养与水分。即便如此，其他条件相同时，只要重症病人有行为能力，她对“继续活着是否对自己有益”的判断，在一切临终决策中都该权重最大，无论她衰弱受损到何种地步。有行为能力者对“生命对自己还有何价值”的自主判断，应压过他人对其福祉的评估——这并不奇怪，因为有行为能力的病人拒绝延长生命的治疗时，情形正是如此。
