      Despite its popularity and widespread use, the distinction between passive and active euthanasia is neither particularly clear nor morally helpful. (For a fuller discussion, see McMahan 2002.)[^mcmahan-2002] Whether behavior is described in terms of acts or omissions (a distinction which underpins the alleged difference between active and passive voluntary euthanasia and that between killing a person and letting her die), is often a matter of pragmatics rather than anything of deeper moral importance. Consider, for instance, the practice (once common in hospitals) of deliberately proceeding slowly to a ward in response to a request to provide assistance for a patient who has been assigned a ‘not for resuscitation’ code. Or, consider ‘pulling the plug’ on a respirator keeping an otherwise dying patient alive, as against not replacing the oxygen supply when it runs out. Are these acts or omissions? If the answers turn on merely pragmatic considerations the supposed distinction between passive euthanasia and active euthanasia will be hard to sustain.
    step1: |-
      尽管被动安乐死与主动安乐死之别流传甚广、运用普遍，这一区分却既不那么清晰，于道德上也无甚助益。（更充分的讨论见 McMahan 2002。）[^mcmahan-2002] 行为究竟以作为还是不作为来描述（正是这一区分支撑着所谓主动与被动自愿安乐死之别、以及杀人与任其死去之别），往往只是个语用问题，而非具有更深道德重要性之事。试想这样一个做法（曾常见于医院）：接到为一位被标记为“不予复苏”的病人提供协助的请求后，故意慢慢走向病房。或试想对维持一位本将死去的病人的呼吸机“拔掉插头”，与氧气用尽时不更换氧气瓶，二者相比。这些是作为还是不作为？若答案只取决于语用考量，那么被动安乐死与主动安乐死之间所谓的区分便难以维持。
    step2: |-
      被动安乐死与主动安乐死之别流传甚广、运用普遍，却既不那么清晰，于道德上也无所助益。（更充分的讨论见 McMahan 2002。）[^mcmahan-2002] 一个行为究竟算作为还是不作为——正是这一区分支撑着所谓主动与被动自愿安乐死之别，以及杀人与任其死去之别——往往只是语用问题，并无更深的道德分量。试想一种（曾常见于医院的）做法：接到为一位被标记“不予复苏”的病人提供协助的请求后，故意慢慢走向病房。再试想：对维持一位本将死去的病人的呼吸机“拔掉插头”，与氧气用尽时不换氧气瓶，二者有何不同？这些算作为还是不作为？若答案只取决于语用考量，被动安乐死与主动安乐死之间所谓的区分便难以维持。
