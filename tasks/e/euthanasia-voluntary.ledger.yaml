      That there have only been a handful of prosecutions of Dutch doctors for failing to follow agreed procedures (Griffiths, et al. 1998; Asscher and van de Vathorst 2020)[^asscher-2020], that none of the doctors prosecuted has had a significant penalty imposed, that a significant proportion of requests for medical assistance with dying are rejected as unjustifiable, and that the Dutch public have regularly reaffirmed their support for the agreed procedures suggests that, contrary to the claims of some critics, the legalization of voluntary euthanasia has not increased the incidence of non-voluntary euthanasia. A similar picture to the one in the Netherlands has emerged from studies of the operation of the law concerning physician-assisted suicide in Oregon. Indeed, in a recent wide-ranging study of attitudes and practices of voluntary euthanasia and physician-assisted suicide covering two continents, a prominent critic of these practices has concluded (in agreement with his co-authors) that little evidence exists of abuse, particularly of the vulnerable (see Emanuel, et al., 2016). Unfortunately, insufficient time has elapsed for appropriate studies to be conducted in the other jurisdictions that have legalized either voluntary euthanasia or physician-assisted suicide (but for some relevant evidence see e.g., White, et al. 2022). Finally, some commentators have pointed out that there may, in reality, be more danger of the line between voluntary and non-voluntary euthanasia being blurred if euthanasia is practised in the absence of legal recognition, since there will, in those circumstances, be neither transparency nor monitoring (which cannot be said of the Netherlands, Belgium, Oregon and so on).
    step1: |-
      荷兰医生因未遵守议定程序而受起诉的只有寥寥数例（Griffiths, et al. 1998；Asscher and van de Vathorst 2020）[^asscher-2020]，被起诉的医生无一受到重大处罚，相当比例的医学死亡协助请求因无法证成而被驳回，而荷兰公众一再重申支持议定程序——这些都表明，与某些批评者的主张相反，自愿安乐死的合法化并未增加非自愿安乐死的发生率。关于俄勒冈州医师协助自杀法律运作的研究，呈现出与荷兰相似的情形。事实上，在一项涵盖两大洲、范围广泛的调查中，一位对这些做法持鲜明批评态度的学者（与其合著者一致）得出结论：很少有证据显示存在滥用，尤其是对弱势者的滥用（见 Emanuel, et al., 2016）。遗憾的是，在其他已使自愿安乐死或医师协助自杀合法化的法域，尚未经过足够时间以开展适当研究（但可参看 White, et al. 2022 提供的一些相关证据）。最后，一些评论者指出，若安乐死在实践中缺乏法律承认，自愿与非自愿安乐死之间的界线在现实中反而更有可能模糊，因为那时既无透明性也无监督（荷兰、比利时、俄勒冈等地则不然）。
    step2: |-
      荷兰医生因未遵守议定程序而受起诉的只有寥寥数例（Griffiths, et al. 1998；Asscher and van de Vathorst 2020）[^asscher-2020]；被起诉者无一受到重大处罚；相当比例的医学死亡协助请求因无法证成而遭驳回；荷兰公众又一再重申支持议定程序。这些都与某些批评者的主张相反，表明自愿安乐死的合法化并未增加非自愿安乐死的发生率。关于俄勒冈州医师协助自杀法律运作的研究，也呈现出与荷兰相似的情形。事实上，一项涵盖两大洲、范围广泛的调查考察了自愿安乐死与医师协助自杀的态度与实践；其中一位对这些做法持鲜明批评的学者与合著者一致得出结论：很少有证据显示存在滥用，尤其是对弱势者的滥用（见 Emanuel, et al., 2016）。遗憾的是，其他已使自愿安乐死或医师协助自杀合法化的法域，尚未经过足够时间以开展适当研究（相关证据可参看 White, et al. 2022）。最后，一些评论者指出：若安乐死在实践中缺乏法律承认，自愿与非自愿安乐死之间的界线在现实中反而更可能模糊。因为那时既无透明，也无监督——荷兰、比利时、俄勒冈等地则不然。
