      The fifth condition further restricts access to voluntary euthanasia by excluding those capable of ending their own lives, and so may be thought unduly restrictive by those who would wish to discourage terminally ill patients from attempting suicide. There will be yet others who consider this condition to be too restrictive because competent patients can always refuse nutrition and hydration (see, e.g., Bernat, et al. 1993; Savulescu 2014)[^savulescu-2014]. Though this is true, many competent dying persons still wish to have access to legalized medically assisted death, rather than having to rely on refusing nutrition and hydration, so that they may retain control over the timing of their deaths and avoid needlessly prolonging the process of dying.
