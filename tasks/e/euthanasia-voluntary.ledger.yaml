      But, it might be asked, what if a person is racked with pain, or mentally confused because of the measures taken to relieve her pain, and is, in consequence, unable to think clearly and rationally about the alternatives? It has to be agreed that a person in those circumstances who wants to die should not be assumed to have a truly voluntary and enduring desire to die. However, there are at least two important points to make about those in such circumstances. First, they do not account for all of the terminally ill, so even if it is acknowledged that such people are incapable of agreeing to voluntary euthanasia that does not show that no one can ever voluntarily request help to die. Second, it is possible in at least some jurisdictions for a person to indicate, in advance of losing the capacity to give competent consent, how she would wish to be treated should she become terminally ill and suffer either intolerable pain or an unacceptable loss of control over her life (cf., for instance, Dworkin 1993)[^dworkin-1993]. ‘Living wills’ or ‘advance directives’ are legal instruments for giving voice to people’s wishes while they are capable of giving competent, enduring and voluntary consent, including to their wanting help to die. As long as they are easily revocable in the event of a change of mind (just as civil wills are), they should be respected as evidence of a well thought-out conviction. (For more detailed consideration of these instruments see the entry on advance directives.)
    step1: |-
      但也许有人会问：如果一个人疼痛难忍，或因止痛措施而精神恍惚，因而无法清晰理性地思考各种选择，又当如何？必须承认，处此境况而想死的人，不应被假定怀有真正自愿且持久的求死意愿。然而，关于处此境况者，至少有两点要紧。第一，他们并不代表全部绝症患者；故即便承认这些人无法同意自愿安乐死，也不能表明没有人能自愿请求协助死亡。第二，至少在某些法域，一个人可以在丧失胜任同意能力之前预先说明：若她患绝症并遭受无法忍受的疼痛、或不可接受地失去对生活的控制，她希望受到何种对待（参如 Dworkin 1993）[^dworkin-1993]。“生前预嘱”或“预先指示”正是此类法律工具，用以在人们尚能作出胜任、持久且自愿的同意时表达其意愿，包括表达希望获得死亡协助。只要在改变主意时可以轻易撤销（如同民事遗嘱），它们就应作为深思熟虑之信念的证据而受尊重。（关于此类工具的更详细讨论，见“预先指示”词条。）
