      As was noted earlier in Section 3, there is a widespread belief that so-called passive (voluntary) euthanasia, wherein life-sustaining or life-prolonging measures are withdrawn or withheld in response to a competent patient’s request, is morally permissible. The reason why passive (voluntary) euthanasia is said to be morally permissible is that the patient is simply allowed to die because steps are not taken to preserve or prolong life. This happens, for example, when a dying patient requests the withdrawal or the withholding of measures whose administration would be medically futile, or unacceptably burdensome. By contrast, active (voluntary) euthanasia is said to be morally impermissible because it is claimed to require an unjustifiable intentional act of killing to satisfy the patient’s request (cf., for example, Finnis, 1995; Keown in Jackson and Keown 2012; Keown 2018)[^jackson-2012][^keown-2018].
    step1: |-
      如第 3 节所述，有一种广泛信念：所谓被动（自愿）安乐死——即应病人胜任的请求撤除或不给予生命维持或延长措施——在道德上是可允许的。被动（自愿）安乐死之所以被认为道德上可允许，理由是：由于未采取措施保全或延长生命，病人只是被允许死去。例如，当一个临终病人请求撤除或不给予医学上无益或不可接受地负累的措施时，情形便是如此。相反，主动（自愿）安乐死被认为道德上不可允许，因为据说它需要一种无法证成的、以满足病人请求的故意杀害行为（参如 Finnis 1995；Jackson 与 Keown 2012 中的 Keown；Keown 2018）[^jackson-2012][^keown-2018]。
    step2: |-
      如第 3 节所述，人们普遍相信：所谓被动（自愿）安乐死——应病人胜任的请求，撤除或不给予生命维持或延长措施——在道德上可允许。理由在于：既未采取措施保全或延长生命，病人就只是被允许死去。例如临终病人请求撤除、或不给予医学上无益或不可接受地负累的措施时，即属此类。相反，主动（自愿）安乐死被认为道德上不可允许：据说它需要一种无法证成的故意杀害行为，以满足病人的请求（参如 Finnis 1995、Jackson 与 Keown 2012 中的 Keown、Keown 2018）[^jackson-2012][^keown-2018]。
