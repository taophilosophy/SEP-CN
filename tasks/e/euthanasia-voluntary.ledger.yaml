      It is important to emphasize the motive of benefiting the person who is assisted to die because well-being is a key value in relation to the morality of euthanasia (see Section 3 below). Nonetheless, the defensibility of the contention that someone can be better off dead has been the subject of extensive philosophical deliberation. Those who claim that a person can be better off dead believe this to be true when the life that remains in prospect for that person has no positive value for her (a possibility which is discussed by e.g., Foot, 1977; McMahan 2002; Bradley 2009)[^bradley-2009][^mcmahan-2002], whereas some of those who hold that a person’s life is inviolable deny that a person can ever be better off dead (e.g., Keown in Jackson and Keown 2012)[^jackson-2012]. A Kant-inspired variant on this latter position has been advanced by Velleman (1999). He considers that a person’s well-being can only matter if she is of intrinsic value and so that it is impermissible to violate a person’s rational nature (the source of her intrinsic value) for the sake of her well-being. Accordingly, he holds that it is impermissible to assist someone to die who judges that she would be better off dead and competently requests assistance with dying. The only exception is when a person’s life is so degraded as to call into question her rational nature, albeit he thinks it unlikely that anyone in that position will remain competent to request assistance with dying. This position appears to be at odds with the well-established right of a competent patient to refuse life-prolonging medical treatment, at least when further treatment is refused because she considers that her life no longer has value for her and further treatment will not restore its value to her. (For further reasons to reject arguments for the inviolability of the life of a person, including Velleman’s, see e.g., McMahan 2002; Young 2007; Sumner 2011, 2017.)[^mcmahan-2002][^sumner-2011][^young-2007]
    step1: |-
      强调使被协助死亡者受益这一动机，十分重要，因为福祉是关乎安乐死道德性的核心价值（见下文第 3 节）。不过，“某人死了反而更好”这一主张是否站得住，一直是哲学上广泛讨论的题目。主张人可能死了反而更好的人认为，当一个人余生对她已无正面价值时，这话便成立（此可能性的讨论见 Foot 1977；McMahan 2002；Bradley 2009）[^bradley-2009][^mcmahan-2002]；而某些认为人的生命不可侵犯者，则否认人可能死了反而更好（如 Jackson 与 Keown 2012 中的 Keown）[^jackson-2012]。Velleman（1999）提出后一立场的一种康德式变体。他认为，一个人的福祉只有在她具有内在价值时才重要，因此不得为她的福祉而侵犯她的理性本性（其内在价值之源）。据此他主张：即使某人判断自己死了反而更好，并胜任地请求协助死亡，仍不允许协助其死亡。唯一的例外是，当一个人的生命已贬损到令人怀疑其理性本性的地步——不过他相信，处于这种境况者不大可能仍有能力请求协助死亡。这一立场似乎与一项既定权利相冲突：有行为能力的病人有权拒绝延长生命的医疗，至少在拒绝的理由是她认为自己的生命已无价值、而继续治疗也不会恢复其价值时。（关于拒斥“人的生命不可侵犯”诸论证的更多理由，包括 Velleman 的论证，见 McMahan 2002；Young 2007；Sumner 2011, 2017。）[^mcmahan-2002][^sumner-2011][^young-2007]
    step2: |-
