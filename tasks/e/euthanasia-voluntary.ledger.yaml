      Opponents of voluntary euthanasia have endeavored in a variety of ways to counter the very straightforward moral case that has been laid out above for its legalization (see, for example, Keown 2002; Foley, et al. 2002; Biggar 2004; Gorsuch 2006)[^biggar-2004][^gorsuch-2006]. Some of the counter-arguments are concerned only with whether the moral case warrants making the practice of voluntary euthanasia legal, whereas others are concerned with trying to undermine the moral case itself. In what follows, consideration will be given to the five most important counter-arguments. (For more comprehensive discussions of the morality and legality of medically assisted death see Biggar 2004; Gorsuch 2006; Young 2007; Sumner 2011, 2017; Keown 2018)[^biggar-2004][^gorsuch-2006][^keown-2018][^sumner-2011][^young-2007].
    step1: |-
      反对自愿安乐死者以多种方式努力反驳上述为合法化提出的直截了当的道德理由（见如 Keown 2002；Foley, et al. 2002；Biggar 2004；Gorsuch 2006）[^biggar-2004][^gorsuch-2006]。有些反驳只关心该道德理由是否足以证成使自愿安乐死合法；另一些则试图推翻道德理由本身。下文考察五项最重要的反驳。（关于医学协助死亡之道德性与合法性的更全面讨论，见 Biggar 2004；Gorsuch 2006；Young 2007；Sumner 2011, 2017；Keown 2018）[^biggar-2004][^gorsuch-2006][^keown-2018][^sumner-2011][^young-2007]。
