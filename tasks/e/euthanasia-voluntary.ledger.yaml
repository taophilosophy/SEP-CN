      Since the publication of the Remmelink Report in 1991 into the medical practice of euthanasia in the Netherlands, it has frequently been said that the Dutch experience shows that legally protecting voluntary euthanasia is impossible without also affording shelter to the non-voluntary euthanasia that will follow in its train (see, e.g., Keown 2018)[^keown-2018]. In the period since that report there have been regular national studies of the practice of euthanasia in the Netherlands (see, e.g., Rietjens, et al. 2009; Onwuteaka-Philipsen, et al. 2012; van der Heide, et al. 2017). The findings from these national studies have consistently shown that there is no evidence for the existence of such a slippery slope. Among the specific findings the following are worth mentioning: of those terminally ill persons who have been assisted to die about sixty per cent have clearly been cases of voluntary euthanasia as it has been characterised in this entry; of the remainder, the vast majority of cases were of patients who at the time of their medically assisted deaths were no longer competent. It might be thought that these deaths ought to be regarded as instances of non-voluntary euthanasia. But, in fact, it would be inappropriate to regard them as such. Here is why. For the overwhelming majority of these cases, the decisions to end life were taken only after consultation between the attending doctor(s) and close family members, and so can legitimately be thought of as involving substituted judgements. Moreover, according to the researchers, the overwhelming majority of these cases fit within either of two common practices that occur in countries where voluntary euthanasia has not been legalized, namely, that of terminal sedation of dying patients, and that of giving large doses of opioids to relieve pain while foreseeing that this will also end life. In a very few cases, there was no consultation with relatives, though in those cases there were consultations with other medical personnel. The researchers contend that these instances are best explained by the fact that families in the Netherlands strictly have no final legal authority to act as surrogate decision-makers for incompetent persons. For these reasons the researchers maintain that non-voluntary euthanasia is not widely practised in the Netherlands.
