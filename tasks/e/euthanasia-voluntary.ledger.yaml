      In Oregon in the United States, legislation was introduced in 1997 to permit physician-assisted suicide after a referendum strongly endorsed the proposed legislation. Later in 1997 the Supreme Court of the United States ruled that there is no constitutional right to physician-assisted suicide; however, the Court did not preclude individual states from legislating in favor of physician-assisted suicide (so the Oregon legislation was unaffected). Since that time the Oregon legislation has been successfully utilised by a significant number of people and similar legislation has been passed in the state of Washington in 2009, in Vermont in 2013, and more recently still in California, Colorado, Florida, Hawaii, Illinois, Iowa, Maine, Maryland, Massachusetts, Minnesota, New Jersey, New Mexico, New York and the District of Columbia. A series of judicial decisions in the state of Montana in 2008 and 2009 established that the state could not prohibit physician-assisted suicide but legislation has not yet been introduced to codify the legal situation. A number of the remaining states are currently considering physician-assisted suicide bills.
