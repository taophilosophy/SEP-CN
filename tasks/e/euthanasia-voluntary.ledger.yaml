      Suppose, for the sake of argument, that it is agreed that we should respect a person’s competent request for medical assistance with dying (e.g., so as to enable her to achieve her autonomously chosen goal of an easeful death). It might be thought that in such an eventuality different moral concerns will be introduced from those that arise in connection with competent refusals. After all, while competent patients are entitled to refuse any form of medical treatment, they are not entitled to insist on the administration of forms of medical treatment that have no prospect of conferring a medical benefit or are not being provided because of a scarcity of medical resources or their affordability. While each of these points is sound, it remains the case that medical personnel have a duty to relieve suffering when that is within their capacity. Accordingly, doctors who regard medical assistance with dying as an element of appropriate medical care will consider it morally permissible to agree to a request for assistance with dying by a competent dying patient who wishes to avoid unbearable suffering. The reason for claiming only that this is morally permissible rather than morally obligatory will be explained in a subsequent paragraph. (For further reflections on the issue of responses to requests for medical assistance see, for instance, Dworkin 1998; Sumner 2011, 2017, 2020; Young 2007, 2017.)[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]
    step1: |-
      为论证起见，假定我们同意应尊重一个人胜任地提出的医学死亡协助请求（例如，以使她实现自主选定的安详死亡之目标）。有人可能认为，在这种情形下，会引入与有行为能力者拒绝治疗时不同的道德关切。毕竟，有行为能力的病人有权拒绝任何形式的医疗，却无权坚持要求施行那些无望带来医疗益处、或因医疗资源稀缺或其可负担性而未提供的治疗。这些论点虽都成立，但医务人员仍有责任在其能力范围内减轻痛苦。因此，那些把医学死亡协助视为适当医疗照护之一部分的医生，会认为同意一个有行为能力、希望避免无法忍受之苦的临终病人的协助请求，在道德上是可允许的。何以只称“可允许”而非“有义务”，后文另有一段说明。（关于如何回应医学协助请求的进一步反思，见如 Dworkin 1998；Sumner 2011, 2017, 2020；Young 2007, 2017。）[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]
    step2: |-
      为论证起见，假定我们同意：应尊重一个人胜任地提出的医学死亡协助请求，好让她实现自己选定的安详死亡。有人也许会想，这种情形会引出与有行为能力者拒绝治疗时不同的道德关切。毕竟，有行为能力的病人有权拒绝任何形式的医疗，却无权坚持要求那些无望带来医疗益处的治疗，也无权要求因资源稀缺或无力负担而未提供的治疗。这些论点都成立，但医务人员仍有责任在能力所及范围内减轻痛苦。因此，把医学死亡协助视为适当医疗照护之一部分的医生，会认为：同意一个有行为能力、希望免于无法忍受之苦的临终病人的协助请求，在道德上可允许。何以只说“可允许”而不说“有义务”，后文另有一段交代。（如何回应医学协助请求，进一步反思见如 Dworkin 1998、Sumner 2011, 2017, 2020、Young 2007, 2017。）[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]
