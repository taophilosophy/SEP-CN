      Notwithstanding this response, as was seen earlier, at least some proponents of voluntary medically assisted dying wish to question why medical assistance with dying should be restricted to those covered by, in particular, the first three conditions set out above in Section 2. If people’s competent requests for medically assisted death should be respected why impose any restrictions at all on who may have access to medically assisted death? Why, for example, should those suffering from depression, or forms of dementia, not be eligible for medically assisted dying? Most proponents of voluntary medically assisted dying hold that there are at least two reasons for restricting access to it to those who satisfy the conditions set out earlier (or, a modified set that takes account of the concerns canvassed in the discussion of those proposed conditions). First, they contend that there are political grounds for doing so, namely, that because legalizing medically assisted dying for competent individuals is politically contested, the best hope for its legalization lies in focusing on those forms of suffering most likely to effect law reform. That is why some proponents deny the eligibility even of sufferers from conditions like ‘locked-in’ syndrome, motor neurone disease, and multiple sclerosis for voluntary medically assisted dying since, strictly, they are not terminally ill, and reliance has to be placed in consequence on their claim to be suffering unbearably. Second, and relatedly, most proponents of the legalization of medical assistance with dying have been cautious about supporting medically assisted death for those suffering from, for example, depression and dementia, because not only are they not terminally ill, but their competence to request assistance with dying is apt to be called into question, particularly in instances where they have given no prior indication of their preference for such assistance. Restricting access to medical assistance with dying to those whose suffering is less likely to be disputed avoids becoming embroiled in controversy. As was noted earlier, some critics of the restrictive approach (e.g., Varelius 2014)[^varelius-2014] take a harder line and claim that it should not even be necessary for a person to be suffering from a medical condition to be eligible for medical assistance with dying; it should be enough to be ‘tired of life’. Only in a few jurisdictions, viz., Switzerland, the Netherlands and Belgium, has this issue been seriously broached. Regardless of what may happen in those jurisdictions, those seeking the legal provision of medical assistance with dying in other jurisdictions seem likely to maintain that if such assistance is to be seen as a legitimate form of medical care it has to be provided in response to a medical condition (rather than because someone is ‘tired of life’), and, indeed, restricted to those who satisfy the conditions outlined earlier in Section 2 (or some similar set of conditions). In short, these latter hold that making an autonomous request for assistance with dying is necessary, but should not be sufficient, for triggering such assistance.
