      如今在许多法域，有行为能力的病人有权就延长生命的医疗自行决定，这一点已牢固确立。正因如此，他们可以拒绝此类治疗，即便拒绝无异于决定结束自己的生命。有理由认为，就延长生命治疗作决定之权利的根本基础——尊重个人自主，及其对“什么最有益于自身福祉”的评估——与自愿安乐死的合法化直接相关（见如 Dworkin 1998、Young 2007, 2017、Sumner 2011, 2017）[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]。因此，把自我决定权延伸到自愿安乐死的情形，并不需要法律政策剧烈转向，也无需援引什么新异的法律价值或原则。事实上，自杀与自杀未遂在许多法域已不再是犯罪，可见个人自我决定的核心重要性在一种密切类似的情境中已获承认。自愿安乐死与医师协助自杀何以未被更广泛地非罪化，最好按类似思路解释。人们常以此解释为何不把被害人同意当作杀害行为的正当理由：难以确证同意的真实性。然而，为自愿安乐死与医师协助自杀设立适当的同意程序，肯定不比设立“胜任地拒绝负累或不想要的医疗”的程序更难。后者已在许多法域实现，前者也应可以做到。
