    kind: body
    source: |-
      The first legislative approval for voluntary euthanasia was achieved with the passage in the parliament of Australia’s Northern Territory of a bill enabling physicians to practise voluntary euthanasia. Subsequent to the Act’s proclamation in 1996, it faced a series of legal challenges from opponents of voluntary euthanasia. In 1997 the challenges culminated in the Australian National (or, Federal) Parliament overturning the legislation when it prohibited Australian territories from enacting legislation to permit voluntary euthanasia on constitutional grounds. Australia is a federation consisting of six states and two territories. Unlike the territories, the states do have the constitutional right to enact such legislation and in 2017 the state of Victoria did just that. The legislation came into effect in 2019. In 2019, a second state, Western Australia, enacted legislation to enable voluntary medically assisted death. The legislation became effective in 2021. In 2021 three further states, Tasmania, South Australia and Queensland enacted legislation to enable voluntary medically assisted death which came into force in 2022 for the first two, and 2023 for the third. Finally, in 2022 NSW enacted legislation which came into force in 2023 resulting in voluntary medically assisted death being available in each of the states. Both the Australian Capital Territory (ACT) and the Northern Territory (NT) have recently passed legislation in favor of voluntary medically assisted death and been given assurances that the legislation will not be vetoed by the Federal parliament. The ACT legislation is already operational, whereas the NT legislation will come into effect in early 2028.
    step1: |-
      第一次立法批准自愿安乐死，是澳大利亚北领地议会通过一项法案，使医生得以施行自愿安乐死。该法 1996 年颁布后，遭到反对者一系列法律挑战。1997 年，挑战以澳大利亚联邦议会推翻该法告终：联邦议会以宪法理由禁止各领地就允许自愿安乐死立法。澳大利亚是联邦制国家，由六个州与两个领地组成。与领地不同，各州确有宪法权利制定此类法律；2017 年维多利亚州便这样做了，法律于 2019 年生效。2019 年，第二个州西澳大利亚州立法允许自愿医学协助死亡，法律 2021 年生效。2021 年又有三个州——塔斯马尼亚、南澳大利亚与昆士兰——立法允许自愿医学协助死亡，前两州的法律 2022 年生效，昆士兰的 2023 年生效。最后，新南威尔士州 2022 年立法、2023 年生效，于是各州均可获得自愿医学协助死亡。首都领地与北领地近来也通过了支持自愿医学协助死亡的法律，并获得保证：联邦议会不会否决。首都领地的法律已实施，北领地的法律将于 2028 年初生效。
    step2: |-
      自愿安乐死首次获得立法批准，是澳大利亚北领地议会通过法案，允许医生施行自愿安乐死。该法 1996 年颁布后，反对者提起一系列法律挑战。1997 年，联邦议会推翻该法，挑战至此告终：联邦议会以宪法理由禁止各领地就允许自愿安乐死立法。澳大利亚是联邦制国家，有六个州、两个领地。与领地不同，各州确有宪法权利制定此类法律；2017 年维多利亚州即如此行事，法律于 2019 年生效。2019 年，第二个州西澳大利亚州立法允许自愿医学协助死亡，2021 年生效。2021 年又有三州立法——塔斯马尼亚、南澳大利亚、昆士兰：前两州的法律 2022 年生效，昆士兰的 2023 年生效。最后，新南威尔士州 2022 年立法、2023 年生效，至此各州均可获得自愿医学协助死亡。首都领地与北领地近来也通过了支持自愿医学协助死亡的法律，并获保证联邦议会不予否决：首都领地的法律已实施，北领地的将于 2028 年初生效。
