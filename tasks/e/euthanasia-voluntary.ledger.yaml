      On the most plausible reading, the doctrine of double effect can be relevant to the permissibility of voluntary euthanasia only when a person’s death is bad for her or, to put it another way, a *harm* to her. Sometimes the notion of ‘harm’ is understood simply as damage to a person’s interests whether consented to or not. At other times, it is understood, more strictly, as damage that has been wrongfully inflicted. On either understanding of harm, there can be instances in which death for a person does not constitute a harm for her because it will either render her better off, or, as some would insist, no worse off, when compared with remaining alive. Accordingly, in those instances, the doctrine of double effect can have no relevance to the debate about the permissibility of voluntary euthanasia. (For extended discussions of the doctrine of double effect and its bearing on the moral permissibility of voluntary euthanasia see, e.g., McIntyre 2001; Woodward 2001; Cavanaugh 2006; Young 2007; Sumner 2011, 2017.)[^cavanaugh-2006][^mcintyre-2001][^sumner-2011][^woodward-2001][^young-2007]
    step1: |-
      按最可信的解读，双重效果原则只有在一个人死亡对她而言是坏事——换言之，是对她的 *伤害*——时，才可能与自愿安乐死的可允许性相关。有时，“伤害”仅被理解为对某人利益的损害，无论其同意与否；有时则更严格地理解为不当施加的损害。按其中任何一种理解，都可能出现这样的情况：对某人而言，死亡并不构成伤害，因为与继续活着相比，死亡或使她更好，或如某些人所坚持，至少不使她更差。因此，在那些情形中，双重效果原则与自愿安乐死可允许性的争论全不相干。（关于双重效果原则及其与自愿安乐死道德可允许性之关系的详尽讨论，见如 McIntyre 2001；Woodward 2001；Cavanaugh 2006；Young 2007；Sumner 2011, 2017。）[^cavanaugh-2006][^mcintyre-2001][^sumner-2011][^woodward-2001][^young-2007]
