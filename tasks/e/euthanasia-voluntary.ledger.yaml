      To begin with, there is nothing logically inconsistent in supporting voluntary euthanasia while maintaining the moral inappropriateness of non-voluntary euthanasia. (However, for an attempt to press the charge that there is such an inconsistency see, e.g., Keown 2022.)[^keown-2022] Undoubtedly, some advocates of voluntary euthanasia wish also to lend their support to some acts of non-voluntary euthanasia, for example, for those in persistent vegetative states who have never indicated their wishes about being helped to die, or for certain severely disabled infants for whom the outlook is hopeless. (See, e.g., Kuhse and Singer 1985; Singer 1994; Stingl 2010; Sumner 2017.)[^kuhse-1985][^singer-1994][^stingl-2010][^sumner-2017] Others believe that the consent of the patient is strictly required if euthanasia is appropriately to be legalized. The difference is not a matter of logical acumen; it is to be explained by reference to the importance placed on key values by the respective supporters. Thus, for example, those who insist on the necessity for a competent request by a patient for medical assistance with dying typically believe that such a request is the paramount consideration in end-of-life decision making (even when it is harnessed to the value of individual well-being), whereas those who consider a person’s best interests to be the paramount consideration are more likely to believe in the justifiability of instances of non-voluntary euthanasia like those mentioned above.
