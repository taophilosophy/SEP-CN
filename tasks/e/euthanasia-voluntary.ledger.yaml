      自 1991 年《雷默林克报告》发表、披露荷兰安乐死的医疗实践以来，人们常说荷兰经验表明：法律保护自愿安乐死，同时不可能不给随之而来的非自愿安乐死提供庇护（见如 Keown 2018）[^keown-2018]。自该报告以来，荷兰定期对安乐死实践作全国性研究（见如 Rietjens, et al. 2009；Onwuteaka-Philipsen, et al. 2012；van der Heide, et al. 2017）。这些全国研究的结果一致表明：没有证据显示存在这样的滑坡。在具体发现中，以下几点值得提及：在被协助死亡的绝症患者中，约六成显然属于本词条所刻画的自愿安乐死；其余绝大多数，是死亡之时已不再有行为能力的病人。人们或会认为这些死亡应视为非自愿安乐死。但事实上，如此看待并不恰当。理由如下。在这些案例的绝大多数中，结束生命的决定只在主治医生与近亲商议之后作出，故可正当地视为涉及替代判断。此外，据研究者说，这些案例的绝大多数符合两种常见做法之一，而这两种做法在未使自愿安乐死合法化的国家同样存在：一是对临终病人施行终末镇静；二是给予大剂量阿片类药物以缓解疼痛，同时预见这将结束生命。极少数案例未与亲属商议，但都与其他医务人员商议过。研究者主张，这些情形的最好解释是：在荷兰，家属严格说来并无代理失能者作决定的最终法律权限。据此研究者认为，非自愿安乐死在荷兰并不普遍。
