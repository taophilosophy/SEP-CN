      Opponents of voluntary euthanasia claim, however, that the difference between active and passive euthanasia is to be found in the agent’s intention: if someone’s life is *intentionally* terminated she has been killed, whereas if she is just no longer being aggressively treated, her death should be attributed to the underlying disease. Many physicians would say that their intention in withholding or withdrawing life-sustaining medical treatment in such circumstances is simply to respect the patient’s wishes. This is plausible in those instances where the patient competently requests that aggressive treatment no longer be given (or, the patient’s proxy makes such a request). But it will often be implausible. In many cases the most plausible interpretation of a physician’s intention in withholding or withdrawing life-sustaining measures is that it is to end the patient’s life. Consider the palliative care practice of ‘terminally sedating’ a patient after a decision has been made to cease aggressive treatment. Suppose (as sometimes happens) that this is then followed by withholding artificially supplied nutrition. In these latter instances the best explanation of the physician’s behavior is that the physician intends thereby to end the life of the patient. What could be the point of the action, the goal aimed at, the intended outcome, if not to end the patient’s life? (Cf. Winkler 1995.)[^winkler-1995] No sense can be made of the action as being intended to palliate the patient’s diseased condition, or to keep the patient comfortable. Nor is it appropriate to claim that what kills the patient is the underlying disease. What kills the patient is the act of depriving her of nutrition (i.e., of starving her to death). The point can be generalized to cover many more instances involving either the withdrawal or the withholding of life-sustaining medical treatment. In short, there is no good reason to think that whereas so-called passive voluntary euthanasia is morally acceptable active voluntary euthanasia never can be.
    step1: |-
      然而，反对自愿安乐死者主张，主动与被动安乐死之别在于行为者的意图：若某人的生命被 *故意* 终结，她是被杀的；若她只是不再接受积极治疗，她的死亡应归因于所患疾病。许多医生会说，他们在那种情形下撤除或不给予生命维持医疗的意图，只是尊重病人的意愿。在病人胜任地请求不再给予积极治疗（或病人的代理人提出此请求）的情形下，这话是可信的。但往往并不可信。在许多情况下，对医生撤除或不给予生命维持措施之意图最可信的解释，就是结束病人的生命。试想这样一种姑息治疗做法：在决定停止积极治疗后对病人施行“终末镇静”。再假定（有时确实如此）此后又停止人工供给营养。在后一种情形中，对医生行为的最佳解释是：医生有意借此结束病人的生命。若非为了结束病人的生命，这一行为的目的、所指向的目标、所欲求的结果又可能是什么？（参 Winkler 1995。）[^winkler-1995] 既不能把该行为理解为意在缓解病人的病况，也不能理解为让病人舒适。同样不恰当的是声称杀死病人的是其所患疾病。杀死病人的是剥夺其营养的行为（即把她饿死）。这一点可推广到更多涉及撤除或不给予生命维持医疗的情形。简言之，没有好理由认为：被动自愿安乐死在道德上可以接受，主动自愿安乐死却永远不可以。
