      It is now well-established in many jurisdictions that competent patients are entitled to make their own decisions about life-sustaining medical treatment. That is why they can refuse such treatment even when doing so is tantamount to deciding to end their life. It is plausible to think that the fundamental basis of the right to decide about life-sustaining treatment – respect for a person’s autonomy and her assessment of what will best serve her well-being – has direct relevance to the legalization of voluntary euthanasia (see, e.g., Dworkin 1998; Young 2007, 2017; Sumner 2011, 2017)[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]. In consequence, extending the right of self-determination to cover cases of voluntary euthanasia does not require a dramatic shift in legal policy. Nor do any novel legal values or principles need to be invoked. Indeed, the fact that suicide and attempted suicide are no longer criminal offences in many jurisdictions indicates that the central importance of individual self-determination in a closely analogous context has been accepted. The fact that voluntary euthanasia and physician-assisted suicide have not been more widely decriminalized is perhaps best explained along a similar line to the one that has frequently been offered for excluding the consent of the victim as a justification for an act of killing, namely the difficulties thought to exist in establishing the genuineness of the consent. But, the establishment of suitable procedures for giving consent to voluntary euthanasia and physician-assisted suicide is surely no harder than establishing procedures for competently refusing burdensome or otherwise unwanted medical treatment. The latter has already been accomplished in many jurisdictions, so the former should be achievable as well.
    step1: |-
      如今在许多法域，有行为能力的病人有权就延长生命的医疗自行决定，这一点已确立。正因如此，他们可以拒绝此类治疗，即便拒绝无异于决定结束自己的生命。有理由认为，就延长生命治疗作决定之权利的根本基础——尊重个人的自主，及其对“什么最有益于自身福祉”的评估——与自愿安乐死的合法化直接相关（见如 Dworkin 1998；Young 2007, 2017；Sumner 2011, 2017）[^dworkin-1998][^dworkin-1998-2][^sumner-2011][^young-2007]。因此，把自我决定权延伸到自愿安乐死的情形，并不需要法律政策的剧烈转变。也无需援引任何新异的法律价值或原则。事实上，自杀与自杀未遂在许多法域已不再是犯罪，这表明：在一种密切类似的情境中，个人自我决定的核心重要性已获承认。自愿安乐死与医师协助自杀之所以未被更广泛地非罪化，也许最好按类似思路解释——人们常以之解释为何不把被害人同意作为杀害行为的正当理由，即认为难以确认同意的真实性。然而，为自愿安乐死与医师协助自杀设立适当的同意程序，肯定不比设立“胜任地拒绝负累或不想要的医疗”的程序更难。后者已在许多法域实现，前者也应可以做到。
