      There are several flaws in this contention. First, while both good palliative care and hospice care make important contributions to the care of the dying, neither is a panacea. To get the best palliative care for an individual involves trial and error, with some consequent suffering in the process; moreover, even the best care fails to relieve all pain and suffering. Perhaps even more importantly, high quality palliative care commonly exacts a price in the form of side-effects such as nausea, incontinence, loss of awareness because of semi-permanent drowsiness, and so on. A rosy picture is often painted as to how palliative care can transform the plight of the dying. Such a picture is misleading according to those who have closely observed the effect of extended courses of treatment with drugs like morphine. For these reasons many skilled palliative care specialists acknowledge that palliative care does not enable an easeful death for every patient. Second, even though the sort of care provided through hospices is to be applauded, it is care that is available to only a small proportion of the terminally ill and then usually only in the very last stages of the illness (typically a matter of a few weeks). Notwithstanding that only relatively few of the dying have access to hospice care it is worth drawing attention to the fact that in, Oregon, to cite one example, a high proportion of those who have sought physician-assisted suicide were in hospice care. Third, and of greatest significance for present purposes, not everyone wishes to avail themselves of palliative or hospice care. For those who prefer to die on their own terms and in their own time, neither option may be attractive. As previously mentioned, a major source of distress for many dying patients is the frustration that comes with being unable to satisfy their autonomous wishes. Fourth, as also indicated earlier, the suffering that occasions a desire to end life is not always traceable to pain caused by illness. For some, what is intolerable is their forced dependence on others or on life-supporting machinery; for these patients, the availability of effective pain control is not the primary concern. (In relation to the preceding matters see Rietjens, et al. 2009 and Onwuteaka-Philipsen et al. 2012 for findings for the Netherlands; and, for Oregon, Ganzini, et al. 2009.)[^onwuteaka-philipsen-2012]
    step1: |-
      这一主张有若干缺陷。第一，良好的姑息治疗与临终关怀虽然都对临终照护有重要贡献，却都不是万灵药。要为个人取得最佳姑息治疗，须反复试验，过程中难免受苦；而且，即便最好的照护也不能解除一切疼痛与痛苦。也许更重要的是，高质量姑息治疗通常要付出代价：恶心、失禁、因长期昏沉而丧失意识等副作用，如此等等。关于姑息治疗如何能改变临终者的处境，常有人描绘一幅玫瑰色的图画。据那些密切观察过吗啡之类药物长期疗程效果的人说，这幅图画是误导性的。正因如此，许多娴熟的姑息治疗专家承认，姑息治疗并不能使每位病人安详地死去。第二，临终关怀所提供的照护固然值得称许，却只有少数绝症患者能获得，且通常只在疾病末期（往往只有数周）。尽管只有相对少数临终者能获得临终关怀，仍值得注意一点：以俄勒冈为例，寻求医师协助自杀者中很大比例已在临终关怀之中。第三，也是就目前而言最重要的一点，并非人人都愿利用姑息治疗或临终关怀。对宁愿按自己的条件、在自己的时辰死去的人，这两种选择都可能不具吸引力。如前所述，许多临终病人的一大痛苦之源，正是无法满足其自主愿望所带来的挫败。第四，也如前述，引发求死愿望的痛苦，未必都可追溯到疾病造成的疼痛。对某些人而言，无法忍受的是被迫依赖他人或依赖生命维持机器；对这些病人来说，有效的疼痛控制并非首要关切。（关于上述事项，荷兰的调查结果见 Rietjens, et al. 2009 与 Onwuteaka-Philipsen et al. 2012；俄勒冈的见 Ganzini, et al. 2009。）[^onwuteaka-philipsen-2012]
