      这些考量本应了结问题，但对那些坚持“医疗语境中的杀害在道德上永远无法证成”的人却不了结——这一前提支撑着围绕第四项反驳的大部分争论。然而这一底层假定可受质疑，也确实受到质疑，例如 Rachels 1986 与 McMahan 2002。质疑者给出的理由之一是：有些情况下，当一个有行为能力的临终者请求协助死亡时，将其杀死在道德上优于任其死去——即采取后一选择只会违背其意愿地延长其痛苦。此外，尽管有一项长期法律原则认为无人能正当地同意被杀（后文再述），但“被杀死者已自主决定自己死了反而更好、因而请求协助死亡”这一点，对杀害行为的证成当然有相关性。
