      Many writers have held that Kim-style exclusion arguments depend on an understanding of causation for which there are preferable alternatives. (See, e.g., Woodward 2008, 2017; Kroedel 2016; Beebee 2017.)[^beebee-2017][^kroedel-2016] This kind of response is sometimes put forward as providing a more correct account of causation. Other writers allow that exclusion arguments can succeed if causation is understood as productive (or ‘oomphy’) causation, but hold that there are other “conceptions of causation” (Beebee, 2017) on which it remains acceptable to say that our mental states cause our behavior. Epiphenomenalists may concede that there is some such sense, but still think their view is vindicated if all the productive causation is provided by the physical activities of our brains.
    step1: |-
      许多作者认为，金式的排除论证依赖于一种对因果的理解，而针对这种理解有更可取的替代方案。（例如参 Woodward 2008、2017；Kroedel 2016；Beebee 2017。）[^beebee-2017][^kroedel-2016] 这类回应有时被提出来，作为对因果的更正确的说明。另一些作者承认，如果因果关系被理解为生产性的（或“带劲的”）因果关系，排除论证可以成立；但他们主张还有别的“因果概念”（Beebee 2017），按那些概念，说我们的心理状态引起我们的行为仍然是可接受的。副现象主义者可能承认存在某种这样的意义，但若一切生产性因果都由我们大脑的物理活动提供，他们仍然认为自己的观点得到了证实。
    step2: |-
      不少论者认为，金式排除论证依赖某种因果观，而这种因果观另有更可取的替代。（例如 Woodward 2008、2017；Kroedel 2016；Beebee 2017。）[^beebee-2017][^kroedel-2016] 这类回应有时被说成给出了更正确的因果说明。也有论者承认：若把因果理解为生产性（“带劲的”，oomphy）因果，排除论证可以成立；但他们认为还存在别的“因果概念”（Beebee 2017），按这些概念，说心理状态引起行为仍然说得通。副现象主义者可以承认确有这种意义，但仍旧觉得：只要一切生产性因果都由大脑的物理活动提供，他们的观点便已得到证实。
