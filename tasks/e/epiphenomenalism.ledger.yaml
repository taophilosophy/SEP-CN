      亚历山大·施陶达赫（2006）对保恩的论文作了批判性讨论。在若干要点中，或许最有力的一点是把保恩的挑战与“证明我不是缸中之脑”这一挑战相比较。不能决定性地回答后一挑战，一般不被认为损害我们关于桌椅的知识，也不指望物理学家在推进其科学之前先解决它。类似地，没有因果定律的世界也许并不是副现象主义的“相关替代项”，也就是说，不是副现象主义者有义务排除的替代项。施陶达赫指出：如果我们允许提出保恩那种怀疑论挑战，那么也能够为交互作用论构造出类似的、无法回答的怀疑论挑战。而且，虽然施陶达赫没有为物理主义提供类似情形，但似乎可以构造出平行的困难。例如，按照物理主义，似乎有一种概念上的可能性：感受质并非与神经属性同一，而是与神经属性加上月相的组合同一，而记忆痕迹只依赖于神经属性。出于与保恩类似的理由，我们似乎永远无法拥有排除这一可能性的证据。但物理主义者是否需要承认必须提供反对这种观点的证据，才能负责任地肯定自己的观点，并不清楚。如果这一点成立，那么类似的推理或许能支持施陶达赫抵抗保恩挑战之力量的方式。
