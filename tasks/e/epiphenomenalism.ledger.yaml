      Since the physical properties of different neural events are different, transitivity of identity prohibits claiming identity of mental properties with any of the physical properties whose instantiation realizes those mental properties. In a body of work stretching over many years, Jaegwon Kim (e.g., 1993, 2005) has argued that this division of mental from physical properties leads to exclusion of mental properties from playing a causal role. After all, it is widely accepted that the physical properties of neural events, together with a person’s state of neural connectivity, are sufficient to produce later neural events. Since behavior depends on muscle contractions that depend on neural innervation, it seems that physical events and structures, and the physical laws that apply to them, are quite enough to bring about our behavior. There is nothing left for mental properties to do.
    step1: |-
      由于不同神经事件的物理属性各不相同，同一的传递性禁止把心理属性与以下任何物理属性等同起来：这些物理属性的实例化实现了那些心理属性。金在权在其跨越多年的一系列著作中（例如 1993、2005）论证说，这种把心理属性与物理属性分开的做法，导致心理属性被排除在因果作用之外。毕竟，人们广泛接受：神经事件的物理属性，加上一个人的神经连接状态，足以产生后来的神经事件。由于行为依赖于肌肉收缩、而肌肉收缩依赖于神经支配，看来物理事件与结构以及适用于它们的物理定律，就足以产生我们的行为。心理属性已无事可做。
    step2: |-
      不同神经事件的物理属性各不相同；而同一关系是传递的，所以不能把心理属性与“其实例化实现了这些心理属性的那些物理属性”中的任何一个等同起来。金在权（Jaegwon Kim）在多年的一系列论著中（如 1993、2005）论证：心理属性与物理属性这样一分开，心理属性就会被排除在因果作用之外。毕竟人们普遍承认，神经事件的物理属性连同一个人的神经连接状态，已足以产生后续的神经事件。行为依赖肌肉收缩，肌肉收缩依赖神经支配，于是物理事件、物理结构以及适用于它们的物理定律，似乎已尽够产生我们的行为。心理属性无处插手。
