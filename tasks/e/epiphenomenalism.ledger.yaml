  - id: 4
    kind: body
    source: |-
      Many philosophers recognize a distinction between two kinds of mental events. (A) The first goes by many names, e.g., phenomenal experiences, occurrences of qualitative consciousness, the what-it-is-like of experience, qualia. Pains, afterimages, and tastes can serve as examples. (B) Mental events of the second kind are occurrent propositional attitudes, e.g., (occurrent) beliefs and desires. Arguments about epiphenomenalism may concern either type of mental event, and (as made clear in Campbell 1970)[^campbell-1970] it should not be assumed that an argument given for one type can be rephrased without loss for the other. The two types can often be connected, however, through beliefs that one has one’s experiences. Thus, if it is held that pains have no physical effects, then one must say either (i) pains do not cause beliefs that one is in pain, or (ii) beliefs that one is in pain are epiphenomenal. For, if pains caused beliefs that one is in pain, and the latter had physical effects, then pains would, after all, have effects in the physical world (albeit indirectly). But epiphenomenalism says mental events have *no* effects in the physical world.[^note-1]
    step1: |-
      许多哲学家承认两类心理事件之间有区别。(A) 第一类有多个名称，例如现象经验、质性意识的发生、“经验之为经验的样子”、感受质。疼痛、后像和味道可作为例子。(B) 第二类心理事件是正在发生的命题态度，例如（正在发生的）信念与欲望。关于副现象主义的论证可能涉及任一类心理事件，而且（正如 Campbell 1970 所澄清的）[^campbell-1970]不应假定：为某一类给出的论证可以不加损失地改写为适用于另一类。不过，这两类常常可以通过“一个人拥有自己的经验”这一信念联系起来。因此，如果主张疼痛没有物理效应，那就必须说：(i) 疼痛不引起“我在疼痛”的信念；或者 (ii) “我在疼痛”的信念是副现象的。因为，如果疼痛引起了“我在疼痛”的信念，而后者又有物理效应，那么疼痛毕竟还是在物理世界中有效应（尽管是间接的）。但副现象主义说心理事件在物理世界中*没有*任何效应。[^note-1]
    step2: |-
      不少哲学家都区分两类心理事件。(A) 第一类的叫法很多：现象经验、质性意识的发生、“身为该经验是什么感觉”、感受质，等等。疼痛、后像、味道都是例子。(B) 第二类则是当下发生的命题态度，比如（此刻正持有的）信念与欲望。围绕副现象主义的争论，可能针对这两类中的任何一类；而且（Campbell 1970 说得很清楚）[^campbell-1970]不能想当然地认为，为其中一类给出的论证换个说法就能原样套到另一类上。不过，两类事件常能经由“我拥有这些经验”的信念挂起钩来。于是，若主张疼痛没有物理效应，就只得二选一：(i) 疼痛不引起“我在疼痛”的信念；或 (ii) “我在疼痛”的信念本身是副现象的。道理是：倘若疼痛引起了“我在疼痛”的信念，而该信念又有物理效应，那么疼痛终究还是在物理世界里产生了效应（哪怕是间接的）。可副现象主义恰恰说，心理事件在物理世界里*毫无*效应。[^note-1]
  - id: 5
    kind: body
    source: |-
      The central motivation for epiphenomenalism lies in the premise that whenever there is a sufficient cause of a physical event, there is a sufficient *physical* cause of that event. If a mental event is something other than a physical event, then for it to make any causal contribution of its own in the physical world would require a violation of physical law. Descartes’ (1649) interactionist model proposed that nonphysical events could cause small changes in the shape of the pineal gland. But such nonphysical effects, however slight, would mean that the physical account of motion is *false* — for that account says that there will be no such change of shape unless there is a physical force that causes it.
    step1: |-
      副现象主义的核心动机在于这样一个前提：只要一个物理事件有一个充分原因，该事件就有一个充分的*物理*原因。如果心理事件是物理事件之外的东西，那么它要在物理世界中作出自己的因果贡献，就要求违反物理定律。笛卡尔（1649）的交互作用论模型提出，非物理事件能够引起松果体形状的微小改变。但这类非物理效应无论多么微小，都将意味着关于运动的物理说明是*假的*——因为那种说明说：除非有引起它的物理力，否则不会有这种形状改变。
    step2: |-
      副现象主义的主要动力来自一条前提：凡物理事件有充分原因之处，就有一个充分的*物理*原因。心理事件若不等同于物理事件，它想在物理世界里作出自己的因果贡献，就得违反物理定律。笛卡尔（1649）的交互作用论模型设想，非物理事件能令松果体的形状发生细微改变。可只要真有这种非物理效应，哪怕微乎其微，关于运动的物理说明便成了*假*的——因为那套说明断言：若无物理力引起，形状就不会这样改变。
  - id: 6
    kind: body
    source: |-
      One may try to rescue mental efficacy by supposing that whenever there is a mental effect in the physical world there is *also* a physical force that is a sufficient cause of the effect. This view, however, both offends Occamist principles and fails to satisfy the leading anti-epiphenomenalist intuition, namely, that the mental *makes a difference* to the physical, i.e., that it leads to behavior that would not have happened in absence of the mental. The view also leads to an epistemological problem: If there is always a sufficient physical cause for whatever a mental event is supposed to produce, then one could never be in a position where one *needs* to suppose there is anything non-physical at work, and thus there could never be any reason to introduce mental causes into one’s account of neural events or behavior.
    step1: |-
      人们可以尝试这样挽救心理效力：设定只要物理世界中有一个心理效应，就*也*有一个作为该效应充分原因的物理力。然而，这一观点既违反奥卡姆原则，又不能满足主要的反副现象主义直觉，即心理对物理*造成了差别*，也就是说，它导致了在没有心理的情况下本不会发生的行为。该观点还导致一个认识论问题：如果心理事件所应产生的东西总是有一个充分的物理原因，那么人就永远不会处于*需要*设定某种非物理的东西在起作用的位置，因而也永远不会有理由把心理原因引入对神经事件或行为的说明。
    step2: |-
      有人试图用这样的设定来挽救心理的效力：每当物理世界中有一个心理效应，也*另有*一个作为其充分原因的物理力。可这种看法既不合奥卡姆原则，又不能满足反副现象主义者最根本的直觉——心理使物理*有所不同*，使行为成为“没有它就不会发生”的行为。它还带来一个认识论难题：假若心理事件所被指望产生的一切，总有充分的物理原因，那么我们就永远不会陷入*需要*设定某种非物理因素在运作的境地，也就永远没有理由在对神经事件或行为的说明中引入心理原因。
  - id: 7
    kind: body
    source: |-
      Many contemporary thinkers would respond to the central motivation for epiphenomenalism by denying its dualistic presupposition, i.e., by holding that mental events are identical with physical events, and may therefore have physical effects. Questions that remain for such physicalistic views will be explained in section 3. For now, it should be noted that the argument stated in the previous two paragraphs is not supposed to be an argument for dualism, but only for adopting epiphenomenalism, once dualism is accepted.
    step1: |-
      许多当代思想家会这样回应副现象主义的核心动机：否认其二元论预设，也就是主张心理事件与物理事件同一，因而可以具有物理效应。这类物理主义观点仍然存在的问题将在第 3 节说明。眼下应当指出，前两段陈述的论证并不是为二元论辩护的论证，而只是在二元论被接受之后，主张采纳副现象主义。
    step2: |-
      面对副现象主义的核心动机，不少当代论者会直接否认它的二元论预设——他们主张心理事件与物理事件同一，因而可以有物理效应。这类物理主义观点遗留的问题，留待第 3 节交代。这里只需点明：上两段的论证并不是在论证二元论；它只是说，一旦接受了二元论，就该接受副现象主义。
  - id: 8
    kind: body
    source: |-
      Further support for epiphenomenalism can be derived from the fact, noted by Wilhelm Wundt (1912), that “each simple sensation is joined to a very complicated combination of peripheral and central nerve processes”, together with the fact that the causes of behavior are likewise complex neural events. This latter fact makes it natural to look for complex events throughout the causal chain leading to behavior; and these can be found in the neural events that are required for the occurrence of simple sensations. The sensations themselves could not contribute to behavior without first having neural effects that are more complex than themselves. Thus an anti-epiphenomenalist stance would require us to prefer the hypothesis that simple sensations cause (relatively) complex neural events over the hypothesis that complex neural events (that are required in any case for the causation of sensations) are adequate to cause the neural events required for the causation of behavior.
    step1: |-
      副现象主义还能从以下事实得到进一步支持：正如威廉·冯特（1912）所指出的，“每一个简单感觉都与外周与中枢神经过程的一个非常复杂的组合相连”，再加上行为的原因同样是复杂的神经事件这一事实。后一事实使得在通向行为的整条因果链上寻找复杂事件成为自然之事；而这些复杂事件可以在简单感觉的发生所必需的神经事件中找到。感觉本身若不先具有比自身更复杂的神经效应，就不可能对行为有所贡献。因此，一种反副现象主义的立场将要求我们宁可接受“简单感觉引起（相对）复杂的神经事件”这一假说，而不接受“复杂的神经事件（无论如何都是感觉的因果发生所必需的）足以引起行为的因果发生所必需的神经事件”这一假说。
    step2: |-
      副现象主义还有进一步的支持。冯特（1912）指出：“每一个简单感觉，都连着外周与中枢神经过程的一个极其复杂的组合。”再加上行为的原因同样是复杂的神经事件，这一点就很能说明问题：既然通向行为的整条因果链上处处是复杂事件，那么在为简单感觉的发生所必需的神经事件里，自然也能找到它们。感觉若不能先产生比自己更复杂的神经效应，就无从影响行为。于是，反副现象主义者必须在两个假说之间作选择：一个是简单感觉引起（相对）复杂的神经事件；另一个是那些复杂的神经事件（它们在感觉的因果发生中本来就少不了）已足以引起行为所需的神经事件。反副现象主义的立场逼着我们去选前者。
