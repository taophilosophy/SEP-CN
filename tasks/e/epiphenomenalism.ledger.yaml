      The first premise of this argument is a widely held dogma, but it can be denied without absurdity (see Robinson 1997)[^robinson-1997]. It is perfectly obvious to everyone that the bodies of human beings are very much alike in their construction, and it requires no sophisticated reasoning to infer that if others are made like me, they probably hurt when affected like me, e.g., when their bodies are stuck with pins, beaten, cut and so on. There is no principle that makes an inference from similar effects to similar causes more secure than an inference from similar causes to similar effects; on the contrary, the latter inference is more secure, because there can sometimes be quite different causes of extremely similar effects. Thus, an inference to other minds that is allowed by epiphenomenalism must be at least as strong as the inferential route to other minds with which it is incompatible.
    step1: |-
      这一论证的第一个前提是一项广为接受的教条，但否认它并不荒谬（参 Robinson 1997）[^robinson-1997]。人人都十分清楚，人体在构造上非常相似；而且不需要什么复杂的推理就能推出：如果他人与我构造相同，那么当他们受到与我相同的对待时——例如身体被扎针、被殴打、被割伤等等——他们大概也会疼。没有任何原则能使“从相似效应到相似原因”的推理比“从相似原因到相似效应”的推理更可靠；相反，后者更可靠，因为极其相似的效应有时可以有相当不同的原因。因此，副现象主义所允许的关于他心的推理，至少必须与它所不相容的那条关于他心的推理路线同样有力。
    step2: |-
      这条论证的第一个前提是广为接受的教条，但否认它并不荒谬（参 Robinson 1997）[^robinson-1997]。谁都看得出来，人体的构造彼此极为相似；由此推出“他人若与我构造相同，受到同样的对待时大概也会疼”——比如被针扎、被打、被割——并不需要什么高深推理。没有哪条原则能把“由相似效应推相似原因”变得比“由相似原因推相似效应”更可靠；恰恰相反，后者更可靠，因为极其相似的效应有时可能出自相当不同的原因。因此，副现象主义所容许的通向他心的推理，至少不弱于与它不相容的那条推理路线。
