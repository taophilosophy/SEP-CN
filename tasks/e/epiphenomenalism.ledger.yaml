      A variant of the obvious absurdity objection is that epiphenomenalism leads to a feeling of loss of self, or a sense that we can no longer regard our actions as *ours*. (See Hyslop 1998. Baysan [2021] argues to the contrary that epiphenomenalism is compatible with agency.)[^hyslop-1998] Epiphenomenalists may, however, reply that there would be different brain states corresponding to the difference between cases of moving our bodies and cases of having our body parts moved by something else, and their view allows different brain states to have different phenomenological effects. Epiphenomenalism is also compatible with there being a distinction between actions that proceed from normal brain processes in normal conditions, and actions that proceed from manipulation by others, disease, or situations that overwhelm normal reasoning abilities.
