      Epiphenomenalists can respond to James’s argument by offering support for the following two views. (I) There is a distinction between (a) neural events in sensory systems, which cause feelings, and (b) neural events in a reward system (where an event is a member of a reward system if and only if it contributes to continuance (or, discontinuance) or repetition (or avoidance) in similar circumstances, of any behavior that leads to that event). (II) What “pleasure” refers to in any possible world is the effect in consciousness of the events in (b) that contribute to continuance or repetition. Since both (a) events and (b) events have neural and, ultimately, behavioral effects, they can be selected for, and so can their combination. The alignment of feelings caused by useful stimuli and pleasure (and, by parallel reasoning, alignment of feelings caused by harmful stimuli and displeasure) would then follow from alignment of neural events of the kinds described in (a) and (b). This latter alignment is independently plausible. A reward system that can lead to quick decisions and a sensory system that provides discriminations for use in longer term planning would both confer advantages; and these systems would, in general, have to work together in a successful organism. (For fuller discussion of James’s argument see Robinson 2007, 2019; and for the structure of pleasure, see Robinson 2006b, 2019.)[^robinson-2006b][^robinson-2007]
    step1: |-
      副现象主义者可以为以下两个观点提供支持，以回应詹姆斯的论证。(I) 存在一种区分：(a) 感觉系统中引起感受的神经事件，与 (b) 奖赏系统中的神经事件（一个事件属于奖赏系统，当且仅当它对“导致该事件的任何行为”在类似情境中的继续（或终止）或重复（或回避）有所贡献）。(II) “快乐”在任何可能世界中所指称的，都是 (b) 中那些对继续或重复有所贡献的事件在意识中的效应。由于 (a) 类事件与 (b) 类事件都有神经效应、并最终有行为效应，它们可以被选择，它们的组合也可以被选择。于是，由有用刺激所引起的感受与快乐之间的一致（同理，由有害刺激所引起的感受与不快之间的一致），便可以从 (a)、(b) 所描述的两类神经事件之间的一致推导出来。后一种一致本身是可信的。一个能导致快速决定的奖赏系统，与一个为长期规划提供辨别的感觉系统，都会带来优势；而在一个成功的有机体中，这两个系统一般来说必须协同工作。（关于詹姆斯论证的更充分讨论见 Robinson 2007、2019；关于快乐的结构见 Robinson 2006b、2019。）[^robinson-2006b][^robinson-2007]
    step2: |-
      副现象主义者可以借支持下面两个观点来回应詹姆斯。(I) 要把 (a) 感觉系统中引起感受的神经事件，与 (b) 奖赏系统中的神经事件区分开来（一个事件属于奖赏系统，当且仅当在类似情境下，它有助于“导致该事件的任何行为”的持续（或终止）或重复（或回避））。(II) 在任何可能世界里，“快乐”所指的都是 (b) 中那些有助于持续或重复的事件在意识中造成的效应。(a)、(b) 两类事件都有神经效应，并最终表现为行为效应，因而都可以被选择，二者的组合亦然。这样一来，由有益刺激引起的感受与快乐之间的一致（同理，由有害刺激引起的感受与不快之间的一致），便可由 (a)、(b) 两类神经事件之间的一致推出。后一种一致本身也站得住：能促成快速决断的奖赏系统，与为长期规划提供辨别的感觉系统，各具优势；而在一个成功生存的有机体里，这两套系统通常必须协同运作。（詹姆斯的论证，详见 Robinson 2007、2019；快乐的结构，见 Robinson 2006b、2019。）[^robinson-2006b][^robinson-2007]
