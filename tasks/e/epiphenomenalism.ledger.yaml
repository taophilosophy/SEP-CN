      The subset view is the subject of lively debate; see, e.g., Antony 2010, Audi 2012, Melnyk 2010, Shoemaker 2010. One objection is that the subset view assumes rather than shows that M has any causal powers at all, and that this is the key question at issue (Kim 2010)[^kim-2010]. Reasons have been offered for doubting this assumption, i.e., accepting epiphenomenalism, at least for beliefs and desires. Segal (2009) argues that being a belief and being a desire are dispositional properties, and that dispositional properties are not efficacious. Tammalleo (2008) supports an exclusion argument, and invokes mechanisms independently established by cognitive psychology to explain why we have the mistaken intuition that mental states are causes.
    step1: |-
      子集观是热烈争论的对象；例如参 Antony 2010、Audi 2012、Melnyk 2010、Shoemaker 2010。一个反对意见是：子集观只是假定、而非表明 M 具有任何因果力，而这正是关键问题所在（Kim 2010）[^kim-2010]。也有人提出了怀疑这一假定（即接受副现象主义，至少对信念与欲望而言）的理由。西格尔（2009）论证说，“是信念”与“是欲望”都是倾向属性，而倾向属性没有效力。塔梅莱奥（2008）支持一种排除论证，并援引认知心理学独立确立的机制，来解释我们为什么会有“心理状态是原因”这一错误直觉。
