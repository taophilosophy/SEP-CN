      刚才提到的这些作品都不包含“副现象主义”一词。我在 1890 年代的《心灵》上找到三篇文章确实使用了该词（最早的一篇在 1893 年，写作“epi-phenomenalism”，带连字符）。我能找到的最早用该词指称自动机说的出处，是威廉·詹姆斯的《心理学原理》，该书初版于 1890 年。该词在他“自动机说”一章中出现过一次，还加了引号，以示存疑；其余时候，该观点被称为“自动机说”或“意识自动机说”。詹姆斯把该观点的首创归于沙德沃思·霍奇森 1870 年的《实践的理论》。这部著作中题为“意识对神经运动的依赖”的一节，确实直截了当地陈述了该观点（没有用“副现象主义”“自动机说”或其他任何“-主义”标签）。
    step2: |-
      上述著作都不含“副现象主义”一词。我在 1890 年代的《心灵》杂志上找到三篇文章确实用了该词（最早一篇是 1893 年，拼作带连字符的“epi-phenomenalism”）。就目前所能查到，用该词指称自动机说的最早出处，是威廉·詹姆斯的《心理学原理》（初版 1890）。它在“自动机说”那一章里只出现过一次，还加了引号表示存疑；其余各处一律称“自动机说”或“意识自动机说”。詹姆斯把这一观点的首创归给沙德沃思·霍奇森（Shadworth Hodgson）的《实践的理论》（1870）。该书有一节题为“意识对神经运动的依赖”，确实直白地陈述了这一观点（不过没用“副现象主义”“自动机说”或任何别的“-主义”标签）。
