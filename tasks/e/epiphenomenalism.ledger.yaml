      The development of consciousness must be explainable through natural selection. But a property can be selected for only if it has an effect upon organisms’ behavior. Therefore, consciousness (both qualia and intentional states) must have effects in behavior, i.e., epiphenomenalism is false. (See Popper and Eccles 1977; James 1879; Romanes 1896; Klein 2019.)[^james-1879][^klein-2019][^popper-1977][^romanes-1896]
    step1: |-
      意识的发展必须能通过自然选择来解释。但一个属性只有在影响生物的行为时才能被选择。因此，意识（感受质与意向状态二者）必然在行为中有效应，也就是说，副现象主义是假的。（参 Popper and Eccles 1977；James 1879；Romanes 1896；Klein 2019。）[^james-1879][^klein-2019][^popper-1977][^romanes-1896]
    step2: |-
