      The foregoing way of responding to the self-stultification argument is further explained and defended in Robinson (1982b, 2013; see also 2006a). An alternative response can be found in Chalmers 1996 (see also Nagasawa 2010)[^nagasawa-2010]. Chalmers’s property-dualistic view holds that there is more to a person than just a brain and a body. It allows for persons to be directly acquainted with experiences, and it is this direct acquaintance, rather than any causal relation, that justifies our beliefs about experiences. On this view, experiences are partially constitutive of beliefs about experiences, and “the justification of my belief [about experiences] accrues not just in virtue of my physical features but in virtue of some of my nonphysical features — namely the experiences themselves” (Chalmers 1996, p. 198)[^chalmers-1996]. In supplying non-causal relations to support the claim to knowledge of experiences, this view disconnects the knowledge question from the question of how things stand causally, and thus avoids the self-stultification argument.
    step1: |-
      上述回应自我挫败论证的方式，在 Robinson（1982b、2013；另参 2006a）中得到进一步解释与辩护。另一种回应见 Chalmers 1996（另参 Nagasawa 2010）[^nagasawa-2010]。查尔默斯的属性二元论观点认为，一个人不止是脑与身体。它允许人直接亲知经验，而正是这种直接亲知、而非任何因果关系，证成了我们关于经验的信念。按这一观点，经验部分地构成了关于经验的信念，并且“我的信念［关于经验的信念］的证成，并非仅凭我的物理特征，还凭我的某些非物理特征——即经验本身”（Chalmers 1996, p. 198）[^chalmers-1996]。这一观点通过提供非因果关系来支持关于经验的知识主张，从而把知识问题与因果状况问题脱钩，避开了自我挫败论证。
    step2: |-
      回应自我挫败论证的上述路子，Robinson（1982b、2013；另参 2006a）有进一步的阐释与辩护。另一条回应思路见 Chalmers 1996（另参 Nagasawa 2010）[^nagasawa-2010]。查尔默斯的属性二元论主张，人不只是脑加身体；它允许人直接亲知经验，而正是这种直接亲知——不是任何因果关系——证成了我们关于经验的信念。照此看法，经验部分地构成了关于经验的信念，“我的［关于经验的］信念之证成，不只凭我的物理特征，还凭我的某些非物理特征，也就是经验本身”（Chalmers 1996, p. 198）[^chalmers-1996]。这一观点以非因果关系支撑关于经验的知识主张，把知识问题与因果状况问题分开，从而绕开了自我挫败论证。
