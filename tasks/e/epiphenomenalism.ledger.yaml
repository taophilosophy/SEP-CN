      Bertrand Russell (1927, 382) held the view that physical theory can reveal only causal structure, or “formal properties” of matter, and that “by examining our percepts we obtain knowledge which is not purely formal as to the matter of our brains.” This idea is taken up sympathetically (with substantial reworking in a quantum mechanical context) by Lockwood (1993). Chalmers (1996) offered a useful discussion of the view (now known as “Russellian monism”), and expressed some sympathy for it — a sympathy which has increased in intervening years (see, e.g., Chalmers 2010)[^chalmers-2010]. Denis Robinson (1993), however, regards intrinsic similarity of fundamental physical entities as different from similarity of phenomenal properties.
    step1: |-
      罗素（1927, 382）持有这样的观点：物理理论只能揭示物质的因果结构或“形式属性”，而“通过考察我们的知觉，我们获得的关于我们大脑之质料的知识并非纯形式的”。洛克伍德（1993）同情地采纳了这一想法（并在量子力学语境中作了大量改造）。查尔默斯（1996）对这一观点（今称“罗素式一元论”）作了有益的讨论，并表示了一定的同情——这种同情在随后的岁月里有增无减（例如参 Chalmers 2010）[^chalmers-2010]。不过，丹尼斯·罗宾逊（1993）认为，基本物理实体的内在相似性不同于现象属性的相似性。
    step2: |-
      罗素（1927, 382）主张，物理理论只能揭示物质的因果结构或“形式属性”，而“考察我们的知觉，就能得到关于我们大脑质料的知识，这类知识并不是纯形式的”。洛克伍德（1993）对此深表同情，并在量子力学语境中作了大幅改造。查尔默斯（1996）对这一看法（今称“罗素式一元论”）作了有价值的讨论，也流露出几分同情——此后数年，这份同情有增无减（例如 Chalmers 2010）[^chalmers-2010]。不过，丹尼斯·罗宾逊（1993）认为，基本物理实体的内在相似性与现象属性的相似性不是一回事。
