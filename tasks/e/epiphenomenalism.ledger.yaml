      Our reason for believing in other minds is inference from behavioral effects to mental event causes. But epiphenomenalism denies such a causal connection. Therefore, epiphenomenalism implies the (exceedingly implausible) conclusion that we do not know that others have mental events. (Jackson [1982] replies to this and several other arguments against epiphenomenalism. The argument is stated, and accepted, in Benecke 1901.)[^benecke-1901]
    step1: |-
      我们相信他心存在的理由，是从行为效应到心理事件原因的推理。但副现象主义否认这种因果联系。因此，副现象主义蕴含着这样一个（极不可信的）结论：我们不知道他人有心理事件。（Jackson［1982］对这一论证以及其他几个反对副现象主义的论证作了回应。该论证在 Benecke 1901 中得到陈述并被接受。）[^benecke-1901]
