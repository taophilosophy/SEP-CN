      詹姆斯·沃德在《大英百科全书》（第十版，1902）中的“心理学”词条，对 T. H. 赫胥黎的观点作了如下概括：“物理变化被认定独立于心理变化，而心理变化则被宣布为物理变化的‘伴随产物’。它们被称为*伴随*产物或‘副现象’，以避开唯物主义的指控……。” 麦克杜格尔（1911）谈及赫胥黎时断然宣称：“该学说［的名称］应归功于他；因为正是他提议，把意识流称为副现象的，或者说称为脑过程的副现象。” 在卡林顿（1949）中，H. H. 普莱斯表示，他相信“副现象主义”一词是由 T. H. 赫胥黎引入的。
