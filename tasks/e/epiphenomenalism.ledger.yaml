      If phenomenal properties are intrinsic properties of fundamental physical objects, and the latter stand in lawlike relations, then lawlike relations will hold between phenomenal properties and some physical occurrences. This conclusion appears to give a causal role to phenomenal properties and thus to suggest a way out of epiphenomenalism. But if intrinsicality carries epiphenomenality, as D. Robinson’s extension of Lewis’s argument suggests, then this way out of epiphenomenalism would be blocked. Moreover, since there is no phenomenal quality that we are always experiencing, no instantiation of a quality by a fundamental physical particle can, by itself, be one of our sensations. It is thus not clear that Russellian monism gives any more causal role to our sensations than does epiphenomenalism (see Robinson 2018 for elaboration)[^robinson-2018].
    step1: |-
      如果现象属性是基本物理对象的内在属性，而后者处于定律式关系之中，那么现象属性与某些物理事件之间就会成立定律式关系。这一结论似乎赋予了现象属性一种因果角色，因而提示了一条摆脱副现象主义的出路。但如果正像 D. 罗宾逊对刘易斯论证的扩展所提示的那样，内在性携带着副现象性，那么这条摆脱副现象主义的出路就会被堵死。此外，由于我们并不总是在经验某种现象性质，基本物理粒子对某一性质的实例化，本身不可能是我们的感觉之一。因此，并不清楚罗素式一元论赋予我们感觉的因果角色，是否比副现象主义更多（详见 Robinson 2018）[^robinson-2018]。
    step2: |-
      若现象属性是基本物理对象的内在属性，而基本物理对象又处于定律式关系之中，那么现象属性与某些物理事件之间也就会有定律式关系。这个结论似乎给现象属性派了因果角色，也就像给出了摆脱副现象主义的一条出路。可若像 D. 罗宾逊扩展刘易斯论证所提示的那样，内在性必然带来副现象性，这条出路便被堵死。再者，没有哪一种现象性质是我们时时都在经验的，所以基本物理粒子对某一性质的实例化，本身不可能是我们的某次感觉。于是，罗素式一元论究竟是否比副现象主义给感觉更多的因果角色，并不清楚（详见 Robinson 2018）[^robinson-2018]。
