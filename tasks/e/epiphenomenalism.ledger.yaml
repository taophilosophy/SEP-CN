      In a 2006 paper, Michael Pauen has given a particularly persuasive argument that offers a new and deeper twist to the problem of what epiphenomenalists can consistently claim to know about qualia. Pauen’s focus is on the epiphenomenalists’ claim that there are laws linking the occurrence of neural events of certain kinds with occurrences of qualitative events. Since epiphenomenalists deny the identity of qualia and physical properties, such laws are not only contingent, but independent of physical laws. Thus, epiphenomenalists must concede the possibility of worlds in which the physical laws are as they are here, but there are no laws connecting physical events to qualitative events. If such worlds are possible, we might actually be in such a world, and so the epiphenomenalist can be asked to provide evidence that we are not in such a world. But the epiphenomenalist denial of efficacy for qualia precludes the possibility of providing any such evidence. Even conceding that we know at each moment what qualia we are having, we cannot exclude the possibility that our memories seem to tell us of qualitative events that never occurred (or that were of different kinds than we seem to remember); yet we would have to rely on such memories in order to have evidence of causal laws holding between physical and qualitative events. (Another argument that turns on memory is given in Swinburne 2011.)[^swinburne-2011]
    step1: |-
      米夏埃尔·保恩在 2006 年的一篇论文中提出了一个特别有说服力的论证，为“副现象主义者能够一致地声称对感受质知道什么”这一问题增加了一个新的、更深的转折。保恩关注的是副现象主义者的主张：存在把某类神经事件的发生与质性事件的发生联系起来的定律。由于副现象主义者否认感受质与物理属性的同一，这类定律不仅是偶然的，而且独立于物理定律。因此，副现象主义者必须承认这样一种可能世界：物理定律与这里一样，但没有任何把物理事件与质性事件联系起来的定律。如果这样的世界是可能的，我们实际上可能就处在这样的世界里；于是可以要求副现象主义者提供证据，表明我们不在这样的世界里。但副现象主义者否认感受质有效力，这就排除了提供任何此类证据的可能性。即便承认我们在每一刻都知道自己正在拥有什么感受质，我们也无法排除这种可能：我们的记忆似乎在告诉我们一些从未发生过的质性事件（或者与我们似乎记得的类型不同的质性事件）；然而，为了获得“物理事件与质性事件之间存在因果定律”的证据，我们又不得不依赖这样的记忆。（另一条围绕记忆展开的论证见 Swinburne 2011。）[^swinburne-2011]
    step2: |-
      保恩（Michael Pauen）在 2006 年的一篇论文里提出了一个相当有说服力的论证，给“副现象主义者到底能一致地声称对感受质知道些什么”这一问题添了新的一面，而且挖得更深。保恩盯住的是副现象主义者的这一主张：存在一些定律，把某类神经事件的发生与质性事件的发生联系起来。既然副现象主义者否认感受质与物理属性同一，这类定律便不仅是偶然的，还独立于物理定律。于是他们必须承认一种可能世界：物理定律与这里相同，却没有任何连接物理事件与质性事件的定律。若这种世界可能，我们说不定就身处其中；那么就可以要求副现象主义者拿出证据，证明我们不在这种世界里。可他们既然否认感受质的效力，就根本拿不出这样的证据。就算承认我们时刻都知道自己在拥有什么感受质，也无法排除：记忆看似在告诉我们某些从未发生过的质性事件（或者类型与我们自以为记得的不同）。可要想拿到“物理事件与质性事件之间存在因果定律”的证据，又非得靠这些记忆不可。（另一条以记忆为支点的论证见 Swinburne 2011。）[^swinburne-2011]
