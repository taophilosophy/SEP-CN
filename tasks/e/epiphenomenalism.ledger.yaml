      The implications drawn from these experiments have been criticized on several grounds. In some cases, there are technical criticisms of methods or statistical analyses (see Dennett, 1991 for critique of Libet’s conclusions, and S. Walter’s 2014 discussion of the Wegner and Wheatley (1999) experiment; for defense of Libet see Bonicalzi and Hggard, 2019.). The force of the work led by Haynes is mitigated by the fact that predictions of behavior from several seconds before its occurrence, while statistically significant, are far from perfect. Many other points have been made (see Nahamias 2008; Mele 2014; Shepherd 2017; Baumeister *et al*. 2018)[^baumeister-2018][^mele-2014][^nahamias-2008][^shepherd-2017]. Two basic criticisms are offered by many writers. First, many of the experimental conditions involve meaningless setups (ouija-like boards, for example) or meaningless decisions (e.g., when to move a finger or which of two buttons to press) that bear little resemblance to real-life decisions (e.g., whether to accept a job, or go to a particular place for a vacation) where people bring substantive reasons and personal preferences to bear. These oddities and simplifications may be thought to render ineffective psychological mechanisms that would be operative in more realistic cases and that would forestall illusions about the relation between our consciously entertained reasons and our behavior. Second, the fact that there are some cases in which unconscious influences have a noticeable effect on our behavior does not show that we are never, or even not usually, acting in a manner that would be rational, given our particular longstanding beliefs and preferences.
    step1: |-
      从这些实验得出的含义已在若干方面受到批评。某些情形中存在对方法或统计分析的技术性批评（关于对利贝特结论的批评见 Dennett 1991；关于韦格纳与惠特利（1999）实验的讨论见 S. Walter 2014；为利贝特辩护见 Bonicalzi and Haggard 2019）。海因斯所领导工作的力量，因下述事实而减弱：从行为发生前数秒作出的预测虽然统计上显著，却远非完善。还有许多其他论点（参 Nahamias 2008；Mele 2014；Shepherd 2017；Baumeister 等 2018）[^baumeister-2018][^mele-2014][^nahamias-2008][^shepherd-2017]。许多作者提出两条基本批评。第一，许多实验条件涉及无意义的设置（例如类似通灵板的装置）或无意义的决定（例如何时动一下手指、或按两个按钮中的哪一个），与真实生活中的决定（例如是否接受一份工作，或去某个地方度假）相去甚远——在真实决定中，人们会运用实质性的理由与个人偏好。这些古怪与简化也许会被认为使某些心理机制失效，而这些机制在更现实的情形中本会起作用，并会阻止人们关于“有意识考虑的理由与行为之关系”的错觉。第二，某些情形中无意识影响对我们的行为有可注意的效应，这一事实并不表明：我们从未、甚至并不通常是以一种合乎理性的方式行动——考虑到我们特定的长期信念与偏好。
    step2: |-
      从这些实验引出的结论，已受到多方面的批评。有些是技术性的，针对方法或统计分析（批评利贝特结论的见 Dennett 1991；讨论韦格纳与惠特利〔1999〕实验的见 S. Walter 2014；为利贝特辩护的见 Bonicalzi and Haggard 2019）。海因斯团队工作的分量，也因一点而减轻：从行为发生前数秒作出的预测虽然统计显著，却远不精确。此外还有许多意见（参 Nahamias 2008；Mele 2014；Shepherd 2017；Baumeister 等 2018）[^baumeister-2018][^mele-2014][^nahamias-2008][^shepherd-2017]。其中两条基本批评最为常见。第一，许多实验条件用的是毫无意义的设置（比如类似通灵板的装置），或者毫无意义的决定（比如什么时候动一下手指、按两个按钮中的哪一个），与真实生活中的决定（比如要不要接受一份工作、要不要去某地度假）相去甚远——真实决定里，人会拿出实质理由与个人偏好。这些古怪与简化，或许使某些心理机制失了效；而在更现实的情形中，这些机制本会起作用，本可挡住“有意识考虑的理由与行为之关系”上的错觉。第二，某些情形里无意识影响确实对行为有可察觉的作用，但这并不表明我们从未——甚至并不表明我们不通常——是按合乎理性的方式行动，即依我们特定的长期信念与偏好而行动。
