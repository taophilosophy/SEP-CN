      The most powerful reason for rejecting epiphenomenalism is the view that it is incompatible with knowledge of our own minds — and thus, incompatible with knowing that epiphenomenalism is true. (A variant has it that we cannot even succeed in referring to our own minds, if epiphenomenalism is true. See Bailey 2006 for this objection and Robinson 2012 for discussion.)[^bailey-2006][^robinson-2012] If these destructive claims can be substantiated, then epiphenomenalists are, at the very least, caught in a practical contradiction, in which they must claim to know, or at least believe, a view which implies that they can have no reason to believe it. Moreover, unless epiphenomenalists can consistently claim to know their own minds, they cannot offer the response to the other minds objection given in 2.3 above. (See Walton, 1989.) (Many authors give some version of this objection. For a full statement of this argument, and several others concerning epiphenomenalism, see Chalmers 1996. For strong recent versions, see DeBrigard 2014; Moore 2012 (responded to by Robinson 2013)[^robinson-2013]; and Moore 2014. For recent discussion see Baysan 2021.)
    step1: |-
      拒斥副现象主义的最有力理由是这样一种看法：副现象主义与我们对自心的知识不相容——因而与“知道副现象主义为真”不相容。（一个变体是：如果副现象主义为真，我们甚至无法成功地指称自心。这一反对意见见 Bailey 2006，讨论见 Robinson 2012。）[^bailey-2006][^robinson-2012] 如果这些破坏性主张能够被证实，那么副现象主义者至少陷入了实践矛盾：他们必须声称知道、或者至少相信一个蕴含着“他们没有任何理由相信它”的观点。而且，除非副现象主义者能够一致地声称知道自己的心，他们就无法给出上文 2.3 中对“他心”反驳的回应。（参 Walton 1989。）（许多作者都给出了这一反驳的某种版本。关于这一论证以及涉副现象主义的其他几条论证的完整陈述，见 Chalmers 1996。晚近的强版本见 DeBrigard 2014；Moore 2012（Robinson 2013 作了回应）[^robinson-2013]；以及 Moore 2014。晚近的讨论见 Baysan 2021。）
    step2: |-
