      Epiphenomenalists may also emphasize that examples in exclusion arguments are usually beliefs, desires or intentions. These mental properties are closely associated with behavioral dispositions, and can easily be understood in functional terms for which multiple realizability is immediately plausible. As Kim (1993, 366) has explicitly recognized, however, there are properties that have long caused difficulties for functionalism, namely, the qualities of phenomenal experiences such as pains, itches, tastes, smells, afterimages, and so on. The “explanatory gap” (Levine 1983) or “unintelligibility” (Robinson 1982a)[^robinson-1982a] or the “hard problem” (Chalmers 1996)[^chalmers-1996] concerning the connection between neural events and phenomenal qualities can be otherwise expressed as our inability to see any necessity in that connection. We are unable to understand why it should be that a series of neural activations occurring in various degrees of intensity and temporal relations should always be accompanied by pain, or itch, or, indeed, by any phenomenal quality whatever. Inability to see any such necessity is, of course, not a proof that such a necessity does not obtain. Nonetheless, absent insight into the necessity of the connection between neural properties and qualitative properties, we are arguably in an *explanatory* position similar to traditional epiphenomenalism. That is, we will have a sufficient explanation of behavioral reactions to stimuli that invokes exclusively neural properties. In addition, we may hold the view that these neural properties are necessarily connected to qualitative properties; but, lacking explanation of this necessity, this connection will contribute no understanding of how qualitative properties could make a difference to behavior. Because this difficulty has not been removed in the case of qualia, the success or failure of the previously discussed Traditional Arguments remains relevant to contemporary thinking about epiphenomenalism.
    step1: |-
      副现象主义者还可能强调：排除论证中的例子通常是信念、欲望或意图。这些心理属性与行为倾向紧密相关，很容易用功能术语来理解，而多重可实现性对功能术语来说立刻就是可信的。然而，正如金（1993, 366）明确承认的，有些属性长期给功能主义造成困难，那就是现象经验的质，诸如疼痛、痒、味道、气味、后像等等。关于神经事件与现象性质之间联系的“解释鸿沟”（Levine 1983）、“不可理解性”（Robinson 1982a）[^robinson-1982a] 或“难问题”（Chalmers 1996）[^chalmers-1996]，换一种说法就是：我们看不出这一联系中有任何必然性。我们无法理解：为什么一系列以各种强度和时序关系发生的神经激活，总伴随着疼痛、或痒、或任何现象性质。当然，看不出这种必然性，并不能证明这种必然性不存在。但尽管如此，在缺乏对神经属性与质性属性之间联系之必然性的洞见的情况下，可以说我们处于一种类似传统副现象主义的*解释*处境。也就是说，我们将拥有一种对刺激之行为反应的充分解释，而它只诉诸神经属性。此外，我们还可以持有这样的看法：这些神经属性必然地与质性属性相联系；但由于缺乏对这一必然性的解释，这一联系不会贡献任何理解：质性属性如何可能对行为造成差别。由于在感受质的情形中这一困难尚未消除，上文讨论的传统论证的成败仍与当代关于副现象主义的思考相关。
    step2: |-
      副现象主义者还会强调：排除论证所举的例子通常是信念、欲望或意图。这些心理属性与行为倾向关系密切，很容易用功能术语来说明，而多重可实现性对它们来说显而易见。然而，正如金（1993, 366）本人明确承认的，有些属性一直让功能主义头疼，那就是现象经验的质——疼痛、瘙痒、味道、气味、后像等等。神经事件与现象性质之间的联系，被称作“解释鸿沟”（Levine 1983）、“不可理解性”（Robinson 1982a）[^robinson-1982a] 或“难问题”（Chalmers 1996）[^chalmers-1996]；说白了，就是我们看不出这种联系中有任何必然性。我们不明白：为什么一系列强度、时序各异的神经激活，总会伴随疼痛、瘙痒，或干脆说，总会伴随任何现象性质？看不出这种必然性，当然不等于证明它不存在。但尽管如此，既然我们对“神经属性与质性属性之间的联系何以必然”毫无洞见，我们在*解释*上就处于一种与传统副现象主义相似的境地：我们手头有一套只诉诸神经属性的充分说明，足以解释对刺激的行为反应；我们也可以再加上一条，说这些神经属性必然连着质性属性。可由于这层必然性得不到解释，这个“必然联系”并不能让我们理解质性属性如何可能改变行为。在感受质问题上，这一困难至今未除，所以前文那些传统论证的输赢，对今天思考副现象主义仍然相干。
