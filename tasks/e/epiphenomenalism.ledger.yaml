      贾森·梅吉尔（2007）基于“属性必须由其因果关系来个体化”这一假定，向副现象主义提出了一个问题。由于副现象主义者否认现象性质有效力，他们能够诉诸来个体化这些性质的唯一因果关系，就只能是以那些性质为其属性的事件的原因。然而，不同的原因可以产生相同的效应。因此，仅诉诸原因的差别，不足以作为个体化现象性质的基础。
