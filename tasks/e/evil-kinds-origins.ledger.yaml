      A fourth major account of the nature of metaphysical evil takes it to be something more substantive than absence, privation, or unformed matter. Call this the *Real Property Theory of Evil*: evil is some sort of *reality*—a determinate feature of certain finite beings (see J. Russell 1977, 1981, and Frankfurter 2006)[^frankfurter-2006][^russell-1977]. Some versions of this picture say that evil is ultimately dependent on the good. Other, more Manichaean versions take the two to be coeval and independent, locked in an eternal axiological struggle. Although the relevant “property” here is supposed to have more reality or substance than mere absence or privation, there is still a kind of unintelligibility to it. The evil side of reality, the dark force, or the malevolent will is a kind of black hole for the “natural light” of reason—positively real, but inaccessible to complete explanation.
    step1: |-
      关于形而上学恶之性质的第四种主要解释，认为它比缺失、褫夺或未成形质料更具实体性。不妨称之为*恶的实在属性论*：恶是某种*实在*——某些有限存在者的确定特征。这一图景的某些版本主张，恶终究依赖于善。另一些更接近摩尼教的版本则认为二者同时并存、彼此独立，陷于永恒的价值论斗争。尽管此处所谓“属性”被认为比单纯的缺失或褫夺更具实在性或实体性，它仍带有某种不可理解性。实在的暗面、黑暗力量或恶意意志，是理性“自然之光”的黑洞——确实实在，却无法得到完整的解释。（见 J. Russell 1977、1981 与 Frankfurter 2006）[^frankfurter-2006][^russell-1977]
    step2: |-
      第四种关于形而上学之恶的主要解释，认为它比缺失、褫夺、未成形的质料都更实在。这就是*恶的实在属性论*：恶是一种*实在*，是某些有限存在者身上确定的特征。此说的某些版本仍让恶最终依赖于善；另一些版本更近摩尼教，主张善恶同时并存、各自独立，在价值论上永久角力。这里所谓的“属性”虽比单纯的缺失或褫夺更实在、更有实体味，却也仍带着某种不可理解性。实在的暗面、黑暗的力量、恶意的意志，之于理性的“自然之光”，犹如黑洞：确确实实在那儿，却怎么也照不透。（见 J. Russell 1977、1981 与 Frankfurter 2006）[^frankfurter-2006][^russell-1977]
