      Kant argues in *Religion within the Bounds of Reason Alone* (1793) that free choices against the moral law are unintelligible in the sense that they are *irrational*; our propensity to make them is thus an inexplicable mystery at the “root” (*radix*) of our moral psychology. The post-Kantian idealist F.W. J. Schelling, picking up the refrain, rejects the Privation Theory of radical evil in favor of the view that it has its origin in the positive, irrational decision to prefer self-advantage over the moral law, though “just how the decision for good or evil comes to pass in the individual, that is still wrapped in total darkness” (Schelling 1809 [1936: 59])[^schelling-1809].
    step1: |-
      康德在《纯然理性界限内的宗教》（1793）中论证，违背道德法则的自由选择在某种意义上是不可理解的，即它们是*非理性的*；我们作出这类选择的倾向，因而是一种无法解释的奥秘，位于我们道德心理学的“根”（*radix*）部。后康德唯心论者 F. W. J. 谢林接过这一说法，拒斥根本恶的褫夺论，转而主张它起源于一种积极的、非理性的决定：宁愿取自身利益而舍弃道德法则；不过“善或恶的决定在个体中究竟如何发生，仍笼罩在完全的黑暗之中”（Schelling 1809 [1936: 59]）[^schelling-1809]。
    step2: |-
      康德《纯然理性界限内的宗教》（1793）主张：违背道德法则的自由抉择是不可理解的，所谓不可理解，即它*不合理性*；我们作出这种抉择的倾向，于是成了道德心理学“根部”（*radix*）一个说不清的谜。后康德唯心论者谢林（F. W. J. Schelling）接上话头，撇开褫夺论，改说根本恶起于一个积极的、非理性的决定——宁取一己之利，不取道德法则；至于“为善为恶的决定在个人身上究竟如何发生，至今仍裹在完全的黑暗里”（Schelling 1809 [1936: 59]）[^schelling-1809]。
