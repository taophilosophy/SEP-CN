      *Empirical evil* is a capacious category: it covers bodily pain, damage, and disease as well as the psychological *concomitants* or *effects* of these physical phenomena—suffering, terror, depression, mental illness. Traditionally, it has also included social ills such as oppression, poverty, and structural injustice (see Sharpe 1909)[^sharpe-1909]. Philosophers who believe in metaphysical evil often take them to manifest in empirical evils. Philosophers who reject metaphysical evil, by contrast, take the empirical kind to be fundamental.
    step1: |-
      *经验之恶*是一个宽泛的范畴：它涵盖身体痛苦、损伤与疾病，也涵盖这些物理现象的心理*伴随物*或*效应*——苦难、恐惧、抑郁、精神疾病。传统上，它还包括压迫、贫困、结构性不义等社会弊害（见 Sharpe 1909）[^sharpe-1909]。相信形而上学之恶的哲学家，常认为它们表现于经验之恶中。相反，拒斥形而上学之恶的哲学家则认为经验层面才是根本。
