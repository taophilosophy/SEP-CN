      3. 这些概念区分虽相当清楚，但历史与当代文献在“自然恶”一词上存在术语分歧。有些哲学家与神学家用“自然恶”不是指一种起源，而是指一种种类——即此处所称的“经验之恶”。不过，只要坚持这些区分，就应清楚它们彼此正交：形而上学之恶与经验之恶，都可以有自然的、道德的或鬼魅的起源（见图 1）。
