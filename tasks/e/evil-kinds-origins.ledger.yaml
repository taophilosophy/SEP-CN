      This idea—that a human being could do something that would *enact* his own transcendence of moral norms, make other persons superfluous, and establish his own status as somehow “beyond good and evil”—is what concerned Karl Jaspers, and what he was hoping Arendt would resist. In her face-to-face confrontation with the quotidian, bureaucratic evil of Adolf Eichmann, she seems to have changed her mind (though see Cesarani 2007 and Margalit 2019 for a portrait of Eichmann that resists her famous “banality thesis”)[^cesarani-2007][^margalit-2019]. But even if Arendt ultimately repudiated the repudiative conception of radical evil, others remain sympathetic to some version of it (e.g., Bernstein 2002 and Motzkin 2019)[^bernstein-2002][^motzkin-2019].
    step1: |-
      这一想法——一个人可以做出某种行为，以*践行*自己对道德规范的超越，使他人变得多余，并确立自己“在善恶之外”的某种地位——正是卡尔·雅斯贝尔斯所忧虑的，也是他希望阿伦特加以抵制的。而在与阿道夫·艾希曼那种日常的、官僚式的恶当面交锋之后，她似乎改变了想法（不过关于艾希曼的描绘，可参 Cesarani 2007 与 Margalit 2019，二者都抗拒她那个著名的“平庸”论题）[^cesarani-2007][^margalit-2019]。但即便阿伦特终究否弃了拒斥式的根本恶构想，仍有人同情其某种版本（如 Bernstein 2002、Motzkin 2019）[^bernstein-2002][^motzkin-2019]。
    step2: |-
      这个念头——一个人可以通过某桩行为*践行*自己对道德规范的超越，把别人弄成多余，也把自己立成某种“在善恶之外”的东西——正是卡尔·雅斯贝尔斯放心不下的，也是他指望阿伦特顶住的。可她当面见识了阿道夫·艾希曼那种日常的、官僚式的恶之后，似乎改了主意（关于艾希曼另有画像，见 Cesarani 2007、Margalit 2019，二者都不认她那著名的“平庸”论题）[^cesarani-2007][^margalit-2019]。然而，纵然阿伦特最终弃置了拒斥式的根本恶构想，仍有人对它某个版本抱以同情（如 Bernstein 2002、Motzkin 2019）[^bernstein-2002][^motzkin-2019]。
