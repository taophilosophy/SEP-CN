      Kant appropriates this idea in a modern context, arguing that we are all originally afflicted by a *propensity* to moral evil (*Hang zum Bösen*), even apart from any specific actions that we perform. This “radical evil”—the metaphysical evil at the root of our nature (“*radix*” = Latin for “root”)—is something for which not Adam but *we* as individual agents (or perhaps the *species itself*) are somehow responsible. And this is reflected even in garden-variety peccadillos: any act that subordinates commitment to the moral law to something else is an expression of radical evil. This makes it clear that people who use “radical evil” to refer to something particularly horrendous or awful (Arendt 1951, Bernstein 2002)[^arendt-1951][^bernstein-2002] are departing from the Kantian concept (see Section 7 below). That said, whether it is intelligible to say that we are culpable for a status that is not *temporal* is a notoriously open question in Kant-interpretation (see Card 2010, Wood 2010, and other essays in Anderson-Gold & Muchnik 2010)[^anderson-gold-2010][^card-2010][^wood-2010].
    step1: |-
      康德在现代语境中挪用了这一想法，主张我们所有人本质上都受一种向道德之恶的*倾向*（*Hang zum Bösen*）所困，即便撇开我们所做的任何具体行动。这种“根本恶”——我们本性根部的形而上学之恶（“*radix*”即拉丁语的“根”）——其责任不在亚当，而在*我们*这些个体行动者（或许在*族类本身*），且以某种方式负有责任。这一点甚至反映在日常的小过失中：任何把对道德法则的服从置于他物之下的行为，都是根本恶的表现。由此可见，那些用“根本恶”指某种特别骇人或可怖之事的人（Arendt 1951, Bernstein 2002）[^arendt-1951][^bernstein-2002] 已偏离了康德的概念（见下文第 7 节）。话虽如此，我们是否能讲得通地主张：我们对一种并非*时间性*的处境负有罪责——这在康德解释中是个出了名悬而未决的问题（见 Card 2010、Wood 2010，以及 Anderson-Gold & Muchnik 2010 中的其他论文）[^anderson-gold-2010][^card-2010][^wood-2010]。
    step2: |-
      康德把这个念头挪到现代语境里用：我们人人天生都染着一种向恶的*倾向*（*Hang zum Bösen*），哪怕尚未做出任何具体举动。这种“根本恶”是盘踞本性的形而上学之恶（“*radix*”是拉丁语的“根”）；对此负责的，不是亚当，而是*我们*这些个体行动者（或许还有*族类本身*），以某种方式负责。就连日常小过也露出这一点：凡把对道德法则的恪守摆到别的东西之下，都是根本恶的发作。由此可知，那些拿“根本恶”去指某桩特别骇人、特别可怕之事的人（Arendt 1951、Bernstein 2002）[^arendt-1951][^bernstein-2002]，已经离开了康德的概念（见下文第 7 节）。话虽如此，“我们该为一种并非*时间性*的处境担责”这话能否讲通，在康德解释里是出了名的悬案（见 Card 2010、Wood 2010，以及 Anderson-Gold & Muchnik 2010 所收诸文）[^anderson-gold-2010][^card-2010][^wood-2010]。
