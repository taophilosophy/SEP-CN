  - id: 51
    kind: body
    source: |-
      Augustine, as well as many scholastics and early moderns, rejected Matter Theory on religious grounds. God *created* matter, and so it cannot be bad in itself. Instead of reverting to pure Absence Theory, however, these monotheists developed the *Privation Theory of Evil*. This can be construed as Absence Theory plus the Aristotelian idea that goodness is relative to a thing’s *kind*. Individuals of different kinds have different ends dictated by their natures: as long as the dog achieves the ends set out by its nature, it counts as *fully* good of its canine kind, even if it essentially lacks the good-making capacities (or “realities”) of beings higher on the chain. (For more on Augustine’s version, see King 2019; on Aquinas, see Davies 2019)[^davies-2019][^king-2019].
    step1: |-
      奥古斯丁以及许多经院哲学家和早期现代哲学家，出于宗教理由拒斥质料论。上帝*创造*了质料，所以质料本身不可能是坏的。然而，这些一神论者并未退回纯粹的缺失论，而是发展出*恶的褫夺论*。它可以被解释为缺失论加上亚里士多德的一个观念：善相对于事物的*种类*。不同种类的个体有由各自本性所规定的不同目的：只要狗达成了其本性所设定的目的，就算作其犬类中*完全*善的，即使它本质上缺乏链条上更高存在者那些成就善的能力（或“实在”）。
    step2: |-
      奥古斯丁连同许多经院学者、早期现代哲学家，都以宗教理由否弃质料论：质料是上帝*所造*，本身不可能坏。可他们并未退回纯粹的缺失论，而是另立*恶的褫夺论*（Privation Theory of Evil）。此说可解作缺失论再加上亚里士多德的一条：善是相对于事物的*种类*而言的。不同种类之物，其本性各有目的；狗只要达成犬类本性所立的目的，就算作犬类中*十足*的善，纵然它本质上缺少链条上更高存在者那些成就善的能力（或“实在”）。
