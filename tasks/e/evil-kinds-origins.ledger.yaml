      亚伯拉罕传统中的哲学家通常认为，即使我们尚未*做出*任何行动，也可能已被道德之恶损害。例如，奥古斯丁把原罪描述为一个原初选择的后果：该选择*损害*了我们的本性本身，以致该族类的每个成员一出生就已该当无限的惩罚，并强烈倾向于做出更多的道德之恶。所以这是一个形而上学之恶以道德之恶为起源的事例：祖先的恶选择沿着血脉一路传下，造出了败坏的本性。
