      Calling pain an evil might raise eyebrows, since clearly some pain is beneficial: it protects us from collisions, diseases, and predators. But the idea is that, whatever instrumental uses it has, pain *qua phenomenal quality*—the *feeling* of it—is *intrinsically* bad (setting aside for these purposes tricky cases like that of the masochist who takes pleasure in experiencing pain). Pain in the horrendous amounts and kinds that we encounter in human history as well as in the “charnel house” of evolutionary history is sickeningly and obviously bad (Murray 2008; Martin & Watkins 2019)[^martin-2019][^murray-2008].
    step1: |-
      把痛苦称为恶，或许会让人挑眉，因为有些痛苦显然有益：它保护我们免于碰撞、疾病与掠食者。但这里的想法是：无论痛苦有何工具性用途，痛苦*作为现象性质*——痛苦之*感觉*——就*内在地*是坏的（此处姑且撇开受虐者从痛苦中取乐之类的棘手情形）。人类历史中以及进化史的“藏骸所”中所遇到的那种数量与种类骇人的痛苦，令人作呕地、显而易见地是坏的（Murray 2008；Martin & Watkins 2019）[^martin-2019][^murray-2008]。
