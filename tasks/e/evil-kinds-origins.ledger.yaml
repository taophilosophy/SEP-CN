      Although such pain is a “perfection” and thus a real property, for Leibniz, it still involves a kind of weakness or imperfection in the person who *has* it, and so God cannot, in the end, exemplify this “perfection”. Rather, God’s possession of maximal pleasure is somehow sufficient to ground the “reality” that is found in both pleasure and pain (Leibniz 1677 [1969: 177])[^leibniz-1677]. This seems fishy, and other philosophers argue against Leibniz that if pain is a real property (rather than a mere absence), then God as the “ground of all reality” must indeed exemplify it. Some recent theologians and philosophers even welcome this idea, arguing that a conception of God as grounding empirical evil by *suffering* it has advantages for projects in theodicy (Hartshorne 1984; Wolterstorff 1988)[^hartshorne-1984][^wolterstorff-1988].
    step1: |-
      尽管这种痛苦是一种“完善”，因而是实在属性，但在莱布尼茨看来，它仍涉及*拥有*该痛苦者身上的某种虚弱或不完善，所以上帝归根到底不能例示这种“完善”。毋宁说，上帝拥有最大限度的快乐，便以某种方式足以充当快乐与痛苦中同样可见的那种“实在”的根据（Leibniz 1677 [1969: 177]）[^leibniz-1677]。这显得可疑；其他哲学家反驳莱布尼茨说，如果痛苦是实在属性（而不只是缺失），那么作为“一切实在之根据”的上帝必定也例示它。一些晚近的神学家与哲学家甚至欢迎这一想法，主张把上帝设想为通过*承受*经验之恶而为其奠定根据，这对神义论方案有所助益（Hartshorne 1984；Wolterstorff 1988）[^hartshorne-1984][^wolterstorff-1988]。
