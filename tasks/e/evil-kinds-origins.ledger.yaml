      Mental illnesses can be classified as “empirical evils” if we assume that they have empirical causes and neural bases (Bhattacharjee 2018)[^bhattacharjee-2018]. Such illness often generates further empirical evil in the form of inexplicably cruel or destructive behavior to self and others, as will be familiar to anyone who has tried to live (or love someone) with mental illnesses like posttraumatic stress disorder (PTSD), borderline personality disorder, schizophrenia, and so on. It is unclear whether the theologians just mentioned would want to say that this kind of empirical evil, too, must have its ground in the divine by way of exemplification. The theological consequences of such a suggestion seem unattractive, to say the least.
    step1: |-
      如果我们假定精神疾病有经验原因与神经基础，那么它们可被归入“经验之恶”（Bhattacharjee 2018）[^bhattacharjee-2018]。这类疾病常常产生进一步的经验之恶，其形式是对己对人难以解释的残忍或破坏行为；凡与创伤后应激障碍（PTSD）、边缘型人格障碍、精神分裂症等精神疾病共同生活过（或爱过这样的人）者，对此都不陌生。刚才提到的那些神学家是否愿意说，这类经验之恶也必须以上帝的例示为根据，尚不清楚。这种主张的神学后果，至少可以说并不讨人喜欢。
    step2: |-
      倘或认定精神疾患自有经验的原因与神经基础，它们便可归入“经验之恶”（Bhattacharjee 2018）[^bhattacharjee-2018]。这类病往往再生出经验之恶：对己对人做出匪夷所思的残忍或破坏之事。凡与创伤后应激障碍（PTSD）、边缘型人格障碍、精神分裂症之类的病共处过——或爱过这样的人——都晓得那是什么滋味。前面提到的那些神学家，是否肯说这类经验之恶也非得由上帝例示来奠基，尚未可知。真这么说，神学上的后果至少谈不上讨喜。
