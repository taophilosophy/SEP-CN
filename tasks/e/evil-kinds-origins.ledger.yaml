    source: |-
      Although Arendt’s interest was in totalitarian state systems, contemporary philosophers are equally interested in non-state but still super-human systems: corporations, collectives, markets, artificial intelligences. These are now some of the most potent sources of value and disvalue at work in the world. As noted in section 5, the nature of systemic evil is empirical, but its origin is more difficult to grasp. Corporations have boardrooms and executive suites, and are even treated as persons by some legal systems, but (as investigation after investigation indicates) it is hard to find the heart of their darkness when assigning responsibility. Still-powerful systems of white supremacy are based in structures of which no individual human mind was or is fully aware (Rothstein 2017)[^rothstein-2017]. Likewise, markets, algorithms, blockchains, and various forms of artificial intelligence arise out of innumerable individual human efforts, but are also *designed* to make human beings superfluous in a literal and unprecedented way. Some of this is and will be for the good—there are already fewer back-broken menial laborers in the fields or exhaust-guzzling toll collectors on the highways. But some will surely be for the bad, and in ways that are not foreseeable. Radical systemic evil—especially in a technological age—does not seem natural or spooky, but it does not seem fully moral either.
    step1: |-
      阿伦特的兴趣虽在极权国家系统，当代哲学家对非国家、却仍超乎个人的系统同样感兴趣：公司、集体、市场、人工智能。这些如今是世界上起作用的最强大的价值与负价值来源之一。如第 5 节所述，系统性恶在本性上是经验的，其起源却较难把握。公司有董事会与高管套间，某些法律体系甚至把它们当作人来对待，但（正如一次接一次的调查所示）在分配责任时，很难找到其黑暗的心脏。仍然强大的白人至上主义系统，植根于没有任何个人的心灵曾经或现在完全知晓的结构（Rothstein 2017）[^rothstein-2017]。同样，市场、算法、区块链以及各种形式的人工智能，产生于无数个人的努力，却也被*设计*成以字面而空前的方式把人变得多余。其中有些现在与将来是好事——田野里弯腰驼背的粗工、公路上吞废气的收费员，已经少了一些。但有些必定是坏事，而且以无法预见的方式。系统性的根本恶——尤其在技术时代——既不像自然的，也不像鬼魅的，可它也不全然像道德的。
    step2: |-
      阿伦特留意的是极权国家机器；当代哲学家同样留意那些非国家、却照样凌驾于个人之上的系统：公司、集体、市场、人工智能。这些已是世上最有力的价值与负价值之源。如第 5 节所说，系统性恶在本性上是经验的，来历却难抓。公司有董事会、有高管楼层，某些法系甚至拿它当“人”看待；可责任该记在谁头上？（一次次的调查显示）它那黑暗的心脏，实在难找。白人至上主义至今势大，其赖以立足的结构，从没有任何个人的心智完全知晓过（Rothstein 2017）[^rothstein-2017]。市场、算法、区块链、各类人工智能，也都一样：出于无数个人的努力，却又被*设计*来把活人弄成多余——字面意义上的、史无前例的多余。有些是好事，将来也是：田里弯腰弓背的苦工少了，公路上吞废气的收费员少了。可有些必定是坏事，且坏在无从预见之处。系统性的根本恶，尤其在这个技术时代，既不像自然之恶，也不像鬼魅之恶，却也不全是道德之恶。
