      Both the nature and the origins of symbolic evil are hard to characterize; thus it is hard to see where it fits in the Table of Evils. Is there a metaphysical aspect to symbolic evil, or is it fully empirical? Is its origin entirely natural, or moral, or is there something spooky and non-agential about it? A related set of difficulties has to do with the fact that, in some contexts anyway, the transfer of symbolic disvalue operates via the complex logic of “taint”, contagion, or uncleanness. Some philosophers who write about symbolic value argue that the only way to avoid being “touched” by such evil is via active and explicit *dissociation*—a symbolic “standing with the good” (R. Adams 1999)[^adams-1999]. In other words, even if our abstinence does not make a difference, we must *symbolically* oppose an evil practice by, say, explicitly signaling opposition and (where possible) refusing to consume or benefit from its results (see Hill 1983; Appiah 1986)[^appiah-1986][^hill-1983].
    step1: |-
      象征性恶的本性与起源都难以刻画，因而也难以看出它在恶之表中应当置于何处。象征性恶有形而上学的一面吗，还是完全经验的？其起源全然是自然的、道德的，还是其中有某种鬼魅式非人格的东西？另一组相关困难在于：至少在某些语境中，象征负价值的转移要经由“污染”、传染或不洁的复杂逻辑来运作。一些论象征价值的哲学家主张，要免于被这种恶“触及”，唯一办法是积极而明确地*划清界限*——一种象征性的“站到善的一边”（R. Adams 1999）[^adams-1999]。换言之，即使我们的戒绝并不带来实际差别，我们也必须*象征性地*反对某种恶的实践，例如公开表明反对，并在可能时拒绝消费其产物或从中获益（见 Hill 1983；Appiah 1986）[^appiah-1986][^hill-1983]。
    step2: |-
      象征性恶的本性与起源都不好刻画，它在恶之表里该放哪一格，也就不易看清。它有形而上学的一面吗？还是纯属经验？其起源纯是自然的，还是道德的？或者里面掺着某种鬼魅式非人格的东西？另有一组难处：至少在某些语境里，象征负价值的转移走的是“污染”、传染、不洁那一套复杂逻辑。论象征价值的一些哲学家认为，要躲开这种恶的“触碰”，唯一的法子是主动、明确地*划清界限*——象征性地“站到善的一边”（R. Adams 1999）[^adams-1999]。换句话说，即便我们的戒绝改变不了什么，也必须*象征性地*反对那种恶行：公开表态，并且在可能时拒绝消费其产物、拒绝从中得利（见 Hill 1983；Appiah 1986）[^appiah-1986][^hill-1983]。
