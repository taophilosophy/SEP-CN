      The concerns expressed in these passages are common in discussions of the nature and origins of evil. Call them *Jaspersian concerns* for short. They are second-order concerns about how we should conceive and speak of evil, especially when calling it “radical”. The concerns fall into two broad kinds: (1) concerns about *exoticizing* wrongdoing with excess-locutions like “evil” and “radical”; and (2) concerns about *tainting* people and things that are touched by such evil, beyond the straightforward condemnation of the perpetrators (for more on such concerns, see Card 2002, Cole 2006, and Calder 2013 [2018])[^calder-2013][^card-2002][^cole-2006].
    step1: |-
      这些段落所表达的关切，在关于恶之本性与起源的讨论中很常见。不妨简称为*雅斯贝尔斯式关切*。它们是第二阶的关切，关乎我们应当如何构想与谈论恶，尤其在称之为“根本”时。这些关切分两大类：(1) 关切以“恶”“根本”之类过度措辞把恶行*猎奇化*；(2) 关切这类恶所触及的人与物受到*污染*，其范围超出对作恶者的直接谴责（关于这类关切，详见 Card 2002、Cole 2006 与 Calder 2013 [2018]）[^calder-2013][^card-2002][^cole-2006]。
    step2: |-
      诸如此类的顾虑，在讨论恶之本性与起源时屡见不鲜。简称*雅斯贝尔斯式顾虑*。它们属于第二阶的顾虑：我们该怎样设想恶、怎样谈恶，尤其在称它为“根本”的时候。顾虑分两大类：其一，怕用“恶”“根本”这类过头字眼把恶行*猎奇化*；其二，怕被这种恶碰到的人与物遭*污染*，牵连过广，超出对作恶者的直接谴责（关于此类顾虑，详见 Card 2002、Cole 2006、Calder 2013 [2018]）[^calder-2013][^card-2002][^cole-2006]。
