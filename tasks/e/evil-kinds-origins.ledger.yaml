      Some philosophers, and more than a few novelists and screenwriters, find the view that agents are always choosing under “the guise of the good” as inadequate to the psychology of extreme malevolence. It may have suited the melioristic conceptions of the Enlightenment, but the well-publicized, mechanized horrors of the recent past allegedly demand a bleaker picture of perpetrator psychology. Serial killers, murderous dictators, torturers, derivatives traders: the idea is that at least some of these malign actors *see their own actions as atrocious*—as making the world worse rather than better on the whole (and sometimes worse for themselves)—and yet still choose to perform them. They are thus not saying “Evil be thou my good”, at least on the interpretation just offered. Rather, they are self-consciously *male-volent:* they *will the bad under the aspect of the bad*. And yet they are not insane—this is what makes their actions especially difficult for the rest of us to understand. This is a second common way in which the term “radical evil” is used. (See Pauer-Studer and Velleman 2015 for a reading of Milton according to which Satan’s war cry is interpreted in this way.)[^pauer-studer-2015]
    step1: |-
      有些哲学家，以及不止少数的小说家与编剧，认为“行动者总是在‘善的外观’下作选择”这一看法，不足以说明极端恶意的心理。它或许适合启蒙时代那种乐观向善的构想，但晚近那些被大肆报道的机械化恐怖，据称要求对作恶者心理作出更阴郁的描绘。连环杀手、杀人独裁者、刑讯者、衍生品交易员：这想法的要点是，这些恶人中的至少一部分*视自己的行为为穷凶极恶*——视之为总体上使世界更糟而非更好（有时对他们自己也更糟）——却仍然选择去做。因此他们并不是在说“恶啊，愿你作我的善”，至少按刚才那种解释不是。毋宁说，他们自觉地*怀有恶意*：他们*在恶的方面意欲恶*。然而他们并未发疯——正因如此，他们的行为才格外令我们难以理解。这是“根本恶”一词的第二种常见用法。（按将弥尔顿撒旦战号读作“为恶而恶”的理解，见 Pauer-Studer 与 Velleman 2015）[^pauer-studer-2015]
