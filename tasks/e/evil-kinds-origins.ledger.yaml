      ### 4.1 Moral Evil
    step1: |-
      ### 4.1 道德之恶
    step2: |-
      ### 4.1 道德之恶
  - id: 67
    kind: body
    source: |-
      *Moral evil* is metaphysical or empirical evil that arises out of the acts or intentions of agents: other traditional terms for it include “sin”, “wickedness”, “trespass”, and “iniquity”.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Philosophers in the Abrahamic tradition typically hold that we can be damaged by moral evil even before we have *performed* any actions whatsoever. Augustine, for example, characterizes Original Sin as a result of a primordial choice that *damaged* our very nature such that each member of the species is born already worthy of infinite punishment and strongly inclined to engage in further moral evil. So this is a case of metaphysical evil that has its origin in moral evil: bad choices on the part of the forefather led to damaged natures all the way down the spermatic line.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Such metaphysical evil will often manifest in empirical evil (although it need not do so); it also makes it likely that there will be further metaphysical evil. Thus an initial moral choice starts off a kind of snowballing into hellishness. It is clear why ancient and medieval and even some contemporary responses to the “*Unde Malum?*” question focus on how a morally uncorrupted creature (Adam, Eve, or Lucifer) could have started the process in the first place (see, e.g., Anselm *De Casu Diaboli*, vol.1 and Johnston forthcoming).
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Kant appropriates this idea in a modern context, arguing that we are all originally afflicted by a *propensity* to moral evil (*Hang zum Bösen*), even apart from any specific actions that we perform. This “radical evil”—the metaphysical evil at the root of our nature (“*radix*” = Latin for “root”)—is something for which not Adam but *we* as individual agents (or perhaps the *species itself*) are somehow responsible. And this is reflected even in garden-variety peccadillos: any act that subordinates commitment to the moral law to something else is an expression of radical evil. This makes it clear that people who use “radical evil” to refer to something particularly horrendous or awful (Arendt 1951, Bernstein 2002)[^arendt-1951][^bernstein-2002] are departing from the Kantian concept (see Section 7 below). That said, whether it is intelligible to say that we are culpable for a status that is not *temporal* is a notoriously open question in Kant-interpretation (see Card 2010, Wood 2010, and other essays in Anderson-Gold & Muchnik 2010)[^anderson-gold-2010][^card-2010][^wood-2010].
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Although moral evildoing *often* leads to empirical evil, it needn’t do so, at least on non-utilitarian accounts. Some crimes can be “victimless” at the empirical level.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Once again, the four traditional theoretical templates can be used to further characterize the evil acts and intentions that make an evil “moral”. *Absence Theory* says that the *absence* of a good will—either because something lacks a will altogether, or because its will is not good—is evil just by way of being an absence. *Privation Theory* says that a will is evil when it *ought* not have the absence of good orientation that it does. *Matter Theory* says that our embodiment and other engagements with matter explain the misorientation of our will. *Real Property Theory* insists that a will that is oriented to the bad is a *real* thing, and that its orientation to the bad is a *real* feature of it, not just a privation.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Declaring that moral evil is rooted in the will does not fully *explain* it. We would need a further account of *how* evil choices are made—of what sort of moral psychology could explain them. For Kant, explanation ceases at some point; evil choices, at bottom, are irrational—surds that we can identify and impute, but never fully explain. “There is no conceivable ground for us, therefore, from which moral evil could first have come in us” (Kant 1793 [AK 6:43; 1998: 64])[^kant-1793].
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Other philosophers offer partial explanations. Augustine says that although there is no *determining* cause of the devil’s choice, it is able to be partly “rationalized” in terms of Satan’s self-obsessed delight in his own powers (see King 2019)[^king-2019]. This is an early version of what is now called a “dispositional” account of evil agency (L. Russell 2014: ch.10; Kamtekar 2019)[^kamtekar-2019][^russell-2014]. Early Islamic interpreters of the Qu’ran, by contrast, offer explanations in terms of ignorance: there is something that the supremely evil agent (Iblis) didn’t realize, or an inference that he failed to make, and this is what explains his orientation to the bad (see Germann 2019)[^germann-2019].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Moral evil is what contemporary people—including philosophers—tend to have in mind when they talk of “evil”. Extreme forms of it are viewed by many philosophers view as “unintelligible”—as defying ordinary explanation in significant and threatening ways. Such extreme and unintelligible moral evils are what many philosophers (though not Kant) are referring to when they speak of “radical” evil (Arendt 1951; L. Russell 2014; see also Section 7)[^arendt-1951][^russell-2014].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      ### 4.2 Natural Evil
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      *Natural evil* refers to metaphysical and/or empirical evils whose origins are “natural”—i.e., grounded in the natures of things and/or the natural laws. The very nature of a horse makes it incapable of language: if that incapacity is a metaphysical evil (as it would be on Absence Theory), then given its origin it also counts as a natural rather than a moral evil. Likewise, cancer, pandemics, earthquakes, meteor strikes, aging and perhaps even death itself are (typically) regarded as natural rather than moral evils. In the tradition there are characterizations of natural evil that use one or more of the four templates discussed earlier: *Absence*, *Privation*, malfunctions in *Matter*, or some other *Real Property*.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Outside of religious contexts, however, many philosophers (and people generally) will be reluctant to characterize hurricanes, diseases, and meteor strikes as a source of “evil”. The very idea of natural *evil* seems most at home in theological debates: can the Author of Nature be supremely good, wise, and powerful and yet still create a world that contains so much pain and suffering, not to mention Category Five hurricanes, animal predation, and Alzheimer’s Disease?
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      There are different kinds of responses to the problem of natural evil in theological traditions: *Aesthetic* responses say that we don’t presently have the right perspective to see the overall beauty of the natural system, and thus that there really is no natural evil; *Soul-making* responses say that this present vale of natural evil is justified because it gives us the chance to become virtuous; *Skeptical theistic* responses say that given our limited faculties we cannot reasonably *expect* to understand why God would allow natural evils. (For more on these responses see M. Adams 1998, Tooley 2002 [2019])[^adams-1998][^tooley-2002].
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      A very different kind of response involves recharacterizing at least some natural evils as moral evils. For instance, we might focus on ways in which human activity has set in motion the kinds of environmental, climatic, microbial, and biospheric changes that lead to “natural” disasters, pandemics, famines, and other empirical evils. Or, in a more religious context, we might seek to explain the suffering and misery caused by “nature” by appeal to sin, karmic law, or divine justice.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      On some versions of this view, the morally responsible agent can be someone other than the victim: Adam sins, and now the non-human “creation has been growning” (*Romans* 8:22, NRSV)—and makes the rest of us groan along with it. Or: we emit the greenhouse gasses, and our descendants three generations later suffer.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Other versions insist that the fault lies with the victim of natural evil himself: Eliphaz the Temanite says to Job
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      > Think now, who that was innocent ever perished? Or where were the upright cut off? As I have seen, those who plow iniquity and sow trouble reap the same. By the breath of God they perish, and by the blast of his anger they are consumed. The roar of the lion, the voice of the fierce lion, and the teeth of the young lions are broken. (*Job* 4: 7–10, NRSV)
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Eliphaz suggests that if Job continues to suffer, then there must be some explanation for these natural evils in Job’s own past behavior. The risk in this kind of doctrine will be obvious to less ancient sensibilities: to suggest that a victim of natural evil must be morally responsible for it seems like the very definition of adding insult to injury.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Another way to recharacterize natural evil as moral evil is by appealing to the actions of moral agents who are neither divine nor human. This appears to have been Augustine’s position in places; more recently, it has been invoked by Alvin Plantinga as an at least *broadly logically possible* scenario which could be used in a “defense” against the logical problem of evil (Tooley 2002 [2019])[^tooley-2002]. The scenario says that
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      > [n]atural evil is due to the free actions of nonhuman persons; there is a balance of good over evil with respect to the actions of these nonhuman persons; and it was not within the power of God to create a world that contains a more favorable balance of good over evil with respect to the actions of the nonhuman persons it contains. (Plantinga 1989: 58)[^plantinga-1989]
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      A final way to recharacterize natural evil as moral would simply be to hold *God alone* morally blameworthy for it, since God created a world in which sentient creatures suffer so terribly. Obviously this would not be a winning strategy if the goal is a successful theodicy. Indeed, some theistic traditions block this route *a priori* by saying that it is conceptually impossible for God to do wrong: a perfect creator is either unbound by moral principles, or essentially incapable of violating them (see Murphy 2017)[^murphy-2017].
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      If these efforts to locate a moral basis for natural evil (whether empirical or metaphysical) are unsuccessful, then “natural” remains a distinct category of evil’s origin.
    step1: TBD
    step2: TBD
