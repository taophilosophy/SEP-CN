      Plotinus’s view is effectively a hybrid of Privation Theory and Matter Theory: for him, privation only occurs when some of the matter in something is unformed or unmastered by a form (see *Enneads* I, 8, 5, 19–26). But even if other Privation Theorists do not view privation in this way, the conception of evil as infinitely distant from reason and intelligibility survives. In other words, Ignorance, Original Sin, and other misuses of freedom are not necessarily a function of irrational *matter*, but they are still opposed to rational *mind*. Descartes is illustrative here: for him, the *only* teleology (and privation) in the world relates to the souls—and in particular the wills—of human beings. Material substance is mechanistic, and aggregates of it (in the forms of animals and plants) can be explained mechanistically, without invoking teleology or kind-relative values (compare Newlands 2019)[^newlands-2019].
    step1: |-
      普罗提诺的观点实际上是褫夺论与质料论的混合：在他看来，只有当某物中的部分质料未成形、未被形式统摄时，褫夺才会发生（见《九章集》I, 8, 5, 19–26）。但即便其他褫夺论者不这样看褫夺，“恶无限远离理性与可理解性”这一构想仍然留存。换言之，无知、原罪以及其他对自由的误用，未必是非理性*质料*的函数，但它们仍与理性*心灵*相对。笛卡尔在此可作说明：对他而言，世上*唯一*的目的论（以及褫夺）关乎人的灵魂——尤其是人的意志。物质实体是机械的，其聚集体（以动植物形式出现者）可以机械地解释，无须援引目的论或种类相对的价值（比较 Newlands 2019）[^newlands-2019]。
