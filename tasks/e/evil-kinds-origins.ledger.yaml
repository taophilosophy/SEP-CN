      Other philosophers offer partial explanations. Augustine says that although there is no *determining* cause of the devil’s choice, it is able to be partly “rationalized” in terms of Satan’s self-obsessed delight in his own powers (see King 2019)[^king-2019]. This is an early version of what is now called a “dispositional” account of evil agency (L. Russell 2014: ch.10; Kamtekar 2019)[^kamtekar-2019][^russell-2014]. Early Islamic interpreters of the Qu’ran, by contrast, offer explanations in terms of ignorance: there is something that the supremely evil agent (Iblis) didn’t realize, or an inference that he failed to make, and this is what explains his orientation to the bad (see Germann 2019)[^germann-2019].
    step1: |-
      其他哲学家提供部分解释。奥古斯丁说，魔鬼的选择虽无*决定性的*原因，却可以部分地“合理化”，办法是指出撒旦对自身权能的那种自我迷恋式的得意（见 King 2019）[^king-2019]。这是如今所谓恶之能动性的“性情论”解释的早期版本（L. Russell 2014: 第 10 章；Kamtekar 2019）[^kamtekar-2019][^russell-2014]。相比之下，早期《古兰经》的解经家则以无知来解释：有某样东西是极恶的行动者（伊布利斯）未曾意识到的，或有一条推理他未能作出，其向恶的取向由此得到解释（见 Germann 2019）[^germann-2019]。
    step2: |-
      另一些哲学家只给部分解释。奥古斯丁说，魔鬼的抉择虽无*决定性*原因，却可以部分“讲通”：撒旦沉溺于自身权能，沾沾自喜，取向由此而来（见 King 2019）[^king-2019]。这已是后世所谓“性情论”恶之能动性解释的雏形（L. Russell 2014: 第 10 章；Kamtekar 2019）[^kamtekar-2019][^russell-2014]。早期《古兰经》解经家则反过来，拿无知来解释：极恶者（伊布利斯）有一样事没看明白，或有一推理没走到，他的向恶取向便由此可解（见 Germann 2019）[^germann-2019]。
