  - id: 12
    kind: body
    source: |-
      This trend is found in other modern languages, but not in all. Ruppel (2019) notes that in German-speaking lands “*das Übel*” declined just like “evil” did in England, but was soon replaced by “*das Böse*”, which is still alive and well in Germany.
    step1: |-
      这一趋势见于其他现代语言，但并非所有语言皆然。鲁佩尔（2019）指出，在德语地区，“*das Übel*”像英格兰的“evil”一样衰落，但很快被“*das Böse*”取代，后者在德国至今仍活跃而兴旺。
    step2: |-
      别的现代语言也有此势，却不是个个如此。鲁佩尔（Ruppel，2019）注意到：德语区的“*das Übel*”与英格兰的“evil”同样式微，但它很快让位于“*das Böse*”，而后者在德国至今活得好好的。
  - id: 13
    kind: body
    source: |-
      This slow erasure of “evil” and its cognates from many European languages, which began in the seventeenth century, was due to the rejection of the *concept* of evil, especially by elites. Doctors, moral philosophers, natural scientists, and even theologians shied away from *evil*—preferring more tractable notions like *badness*, *harm*, and *misfortune*, or quasi-quantifiable concepts like *pain*, *suffering*, *trauma*, and *disutility*. Traditional views of ontologically substantive and supernatural evil—something able to possess a body or terrorize a soul—came to be seen as quaint, unscientific, embarrassing (Ruppel 2019)[^ruppel-2019].
    step1: |-
      “恶”及其同源词从许多欧洲语言中缓慢消失，这一过程始于 17 世纪，原因是对恶之*概念*的拒斥，尤其是精英阶层的拒斥。医生、道德哲学家、自然科学家乃至神学家都回避*恶*——宁愿采用较易处理的概念，如*坏*、*损害*、*不幸*，或准可量化的概念，如*痛苦*、*苦难*、*创伤*、*负效用*。关于本体论上实在且超自然的恶——那种能够附体或威慑灵魂的东西——的传统看法，逐渐被视为古怪、不科学、令人难堪（Ruppel 2019）[^ruppel-2019]。
    step2: |-
      从 17 世纪起，“恶”及其同族词在许多欧洲语言里慢慢被抹去，根子在于人们——尤其是精英——弃置了恶的*概念*。医生、道德哲学家、自然科学家，连神学家也在内，都躲着*恶*字走，宁可拣*坏*、*损害*、*不幸*这类好对付的说法，或者*痛苦*、*苦难*、*创伤*、*负效用*这类近乎可计量的概念。至于传统上那种本体论上实在、带超自然色彩的恶——能附人之体、慑人之魂的东西——则渐渐被视为古怪、不科学、上不得台面（Ruppel 2019）[^ruppel-2019]。
  - id: 14
    kind: body
    source: |-
      Philosophers of religion are a half-exception to the rule. They did and do continue to speak of evil, at least when discussing the “problem” thereof. (See the entry on the problem of evil.) If pressed, though, they typically admit that this is because the great framers of the problem—Augustine, Aquinas, Leibniz, Bayle—used the term (in Latin or French), and then proceed to gloss it generically as, in Michael Tooley’s words, “any undesirable states of affairs” (2002 [2019]). Philosophers of religion in the broadly Continental tradition are less likely to assimilate evil to more general or anodyne notions in this way, and more likely to discuss the nature of evil as opposed to the “problem” it raises for theism (e.g., Kearney 2001 and Matuštík 2008)[^kearney-2001][^matuštík-2008].
    step1: |-
      宗教哲学家是这条规律的一半例外。他们过去和现在都继续谈论恶，至少在讨论恶的“问题”时如此。（参“恶的问题”词条。）但若追问下去，他们通常承认，这是因为该问题的伟大提出者——奥古斯丁、阿奎那、莱布尼茨、培尔——都使用过这个词（用拉丁文或法文），随后便笼统地把它解释为，用迈克尔·图利的话说，“任何不可取的事态”（2002 [2019]）。大体属于欧陆传统的宗教哲学家，较少这样把恶同化于更一般或更温和的概念，而更倾向于讨论恶的本性，而非恶为有神论所提出的“问题”（例如 Kearney 2001 与 Matuštík 2008）[^kearney-2001][^matuštík-2008]。
    step2: |-
      宗教哲学家算半个例外。他们过去谈恶，现在也谈，至少谈恶所引发的“问题”时还谈（参“恶的问题”词条）。可若追问下去，多半会得到这样的答复：之所以如此，是因为把这个问题立起来的几位大家——奥古斯丁、阿奎那、莱布尼茨、培尔——当年用的就是这个字（拉丁文或法文），于是他们沿用旧词，只是在解释时模糊处理，按迈克尔·图利（Michael Tooley）的说法，把它解作“任何不可欲的事态”（2002 [2019]）。至于大体属于欧陆传统的宗教哲学家，就较少这样把恶化约为更宽泛、更温和的概念；他们更愿意讨论恶本身的本性，而不限于恶给有神论出的“难题”（如 Kearney 2001、Matuštík 2008）[^kearney-2001][^matuštík-2008]。
  - id: 15
    kind: body
    source: |-
      Despite this widespread squeamishness about “evil” in both scientific culture and common parlance, there are moments when the pull of the ancient lexicon is irresistible—at the very least expressively, in the mode of both condemnation and lament. Premeditated mass shootings aren’t just bad or traumatic; rather, they are something else: here people still reach for “evil” or even “radical evil”. The years-long imprisonment and rape of children by their parents is a misfortune that produces negative utility, to be sure, but the transfixing horror of it seems only to be captured by the invocation of “evil”. The same is true of most instances of genocide, sex-trafficking, torture-slaying, terrorism, serial killing, and slavery: these are one and all bad, harmful, and traumatic activities, but they are also something else—something excessive, mesmerizing, and revolting all at once (see Stone 2009 for a psychologist’s account)[^stone-2009]. In the face of such acts, we—along with our spiritual leaders, newscasters, and politicians—are still willing to speak, preach, and tweet about “pure evil”.
    step1: |-
      尽管科学文化与日常言谈对“恶”都普遍感到不适，仍有一些时刻，古老词汇的引力不可抗拒——至少在表达层面如此，无论谴责还是哀悼。蓄意的群体枪击不只是坏或造成创伤；它们是别的东西：此时人们仍会伸手去抓“恶”乃至“根本恶”。父母长年囚禁并强奸自己的子女，这固然是一种产生负效用的不幸，但其令人怔住的恐怖，似乎只有借助“恶”的呼求才能被把握。种族灭绝、性贩卖、酷刑杀戮、恐怖主义、连环杀人、奴隶制等大多数事例亦然：它们都是坏的、有害的、造成创伤的活动，但同时也是别的东西——某种过度、摄人且令人作呕的东西（心理学家的叙述见 Stone 2009）[^stone-2009]。面对这类行径，我们——连同我们的精神领袖、新闻主播与政客——仍然愿意谈论、宣讲并发推文谈论“纯粹的恶”。
    step2: |-
      科学文化与街头巷议都对“恶”字心怀抵触，可总有那么些时刻，旧词自有一股拉力，叫人无法不伸手——至少在表达上是如此，无论责难还是哀恸。蓄意的大规模枪击，不只是“坏”，也不只是“创伤”；它是另一回事：此时人们偏要说出“恶”，甚至“根本恶”。父母经年囚禁、强暴自家子女，这当然是一桩产出负效用的不幸，可那令人怔住的恐怖，似乎非借“恶”字不能道出。种族灭绝也好，性奴交易、酷刑杀人、恐怖袭击、连环命案、蓄奴也罢，大多如此：都是坏的、有害的、伤人至深的行为，可又不止于此——还多出点什么，既过分，又摄人心魄，同时令人作呕（心理学家的说法见 Stone 2009）[^stone-2009]。面对这等行径，我们——连同精神导师、新闻主播、政客——仍旧愿意开口、登台、发推，谈“纯粹的恶”。
  - id: 16
    kind: body
    source: |-
      Thus after a school shooting in February 2017, Donald Trump (@realDonaldTrump) tweeted that “we must keep ‘evil’ out of our country”. (Despite the quotation marks, it was clear that he meant evil the entity, and not “evil” the word.) After the Las Vegas mass shooting in October 2017, Trump and many others in leadership referred to the event as “an act of pure evil” (Matuson 2017)[^matuson-2017]. Less recently, George W. Bush referred to Iran, Iraq, and North Korea as the “Axis of Evil” in a state of the union address on 29 January 2002 (see Other Internet Resources), and Ronald Reagan repeatedly characterized the Soviet Union as “the evil empire”, famously at a speech on 8 March 1983 to the National Association of Evangelicals (see Other Internet Resources).
    step1: |-
      因此，2017 年 2 月一起校园枪击案之后，唐纳德·特朗普（@realDonaldTrump）发推说：“我们必须把‘恶’挡在我国之外”。（尽管用了引号，他显然指恶这个实体，而不是“恶”这个字。）2017 年 10 月拉斯维加斯大规模枪击案之后，特朗普与许多领导人都把该事件称为“一桩纯粹的恶行”（Matuson 2017）[^matuson-2017]。更早一些，乔治·W. 布什在 2002 年 1 月 29 日的国情咨文中把伊朗、伊拉克与朝鲜称为“邪恶轴心”（见其他网络资源），罗纳德·里根则反复把苏联称为“邪恶帝国”，最著名的是 1983 年 3 月 8 日在全国福音派协会的演讲（见其他网络资源）。
    step2: |-
      2017 年 2 月一所学校发生枪击案后，唐纳德·特朗普（@realDonaldTrump）发推：“我们必须把‘恶’挡在国门之外”。（引号虽有，所指分明是恶这个实体，而非“恶”这个字。）同年 10 月拉斯维加斯枪击案后，特朗普与不少要人都称此案为“纯粹的恶行”（Matuson 2017）[^matuson-2017]。再往前，乔治·W. 布什 2002 年 1 月 29 日发表国情咨文，把伊朗、伊拉克、朝鲜点名为“邪恶轴心”（见其他网络资源）；罗纳德·里根则屡次称苏联为“邪恶帝国”，以 1983 年 3 月 8 日在全国福音派协会的演讲最为著名（见其他网络资源）。
