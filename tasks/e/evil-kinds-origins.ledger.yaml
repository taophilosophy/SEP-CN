      A final way to recharacterize natural evil as moral would simply be to hold *God alone* morally blameworthy for it, since God created a world in which sentient creatures suffer so terribly. Obviously this would not be a winning strategy if the goal is a successful theodicy. Indeed, some theistic traditions block this route *a priori* by saying that it is conceptually impossible for God to do wrong: a perfect creator is either unbound by moral principles, or essentially incapable of violating them (see Murphy 2017)[^murphy-2017].
    step1: |-
      把自然之恶重新刻画为道德之恶的最后一法，干脆认为*唯有上帝*应为此受道德责备，因为上帝造了一个有感觉生灵遭受如此惨痛的世界。显然，若目标是成功的神义论，这就不是制胜之策。事实上，一些有神论传统会*先验地*堵死这条路，说上帝在概念上不可能做错：一个完善的创造者，要么不受道德原则约束，要么本质上不可能违背它们（见 Murphy 2017）[^murphy-2017]。
    step2: |-
      最后一法索性说：要论道德上的不是，*只有上帝*——谁叫他造了这么一个世界，让有感觉的生灵痛成那样。显然，若图的是成功的神义论，这条路走不通。事实上，有些有神论传统干脆*先天地*把它堵死：上帝做错事，在概念上就不可能。完善的创造者，要么不受道德原则约束，要么本性上违不了它们（见 Murphy 2017）[^murphy-2017]。
