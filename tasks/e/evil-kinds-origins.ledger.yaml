      But when we do this—when we speak of *evil*, *das Böse*, *il male* nowadays—what *is* it that we are referring to, and where does it *come from*?
    step1: |-
      但当我们这样做时——当我们如今谈论*恶*、*das Böse*、*il male* 时——我们所指的究竟是什么，它又从何而来？
