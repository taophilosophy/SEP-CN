      Some types of evil do not seem to fit nicely in the Table of Evils. The three dealt with in what follows are *systemic evil, symbolic evil*, and *radical evil*. The nature and the origins of such evils are difficult to discern, and may require an expansion of the Table.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      ## 5. Systemic Evil
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      *Systemic evil* is the kind of evil that exists at the level of systems or groups rather than merely at the level of individuals. Organized structures like governments, corporations, teams, and religious institutions can be evil in this way; so can more loosely-organized systems such as “Academia”, “White Supremacy”, and “Wall Street”. Indeed, Google includes the motto “Don’t Be Evil” in its *Company Code of Conduct* (for the origins of this, see Chang 2019)[^chang-2019]; disgruntled employees later sued the company alleging that it had violated that pledge (Allyn 2021)[^allyn-2021].
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Systemic evil seems empirical rather than metaphysical, but its origins are difficult to identify. It does not appear to be a merely natural phenomenon, or a spooky non-agential one, and yet its supra-agential character makes it seem not entirely moral either.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Hannah Arendt’s early work on totalitarianism (1951) depicts systemic evil as a kind of empirical evil for which *no* individual or even collection of individuals is fully responsible. The cogs in the machine, as well as the leader or leadership, may be the origin of some of the harms involved, but the evil of the whole structure (on Arendt’s view) is somehow greater than the sum produced by its parts.
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      Racism is another prominent example of systemic evil. Recent accounts of entrenched racist structures in certain societies (the United States, for instance) suggest that such evil has its origin not merely in actions and intentions but also in *omissions* and *passivity:* people who do *not* explicitly support the systemic evil can count as agents of it. If this is right, then active work against the evil in question—“anti-racist” activity rather than “non-racist” activity, for example—becomes morally required (Kendi 2019)[^kendi-2019]. But even such active opposition efforts may not be sufficient to avoid complicity in systemic evil: some theorists argue that even anti-racist people living in racist societies are “tainted” by its evil all the same (Rothstein 2017)[^rothstein-2017]. That leads to the next kind of problem case.
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      ## 6. Symbolic Evil
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      *Symbolic value* is a less familiar idea in philosophy than it is in Anthropology, Religious Studies, and the other social sciences that deal with production, exchange, and consumption. The main idea is that an object or act can have far more “symbolic” value to a certain individual than its exchange or monetary value on some market or other, typically because of its causal history. That bauble given to you by a now-deceased friend has far more symbolic value (to you, at least) than the monetary or exchange value that it would fetch at auction. This is because the gift had its origin in the generosity of a friend who has since died, has the ability to invoke his memory, and so on.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      Symbolic *disvalue* works in an analogous way. Products that fetch a certain monetary value on an open market may have significant symbolic *disvalue* that is not reflected in their price. This disvalue often arises, again, from the product’s provenance: an industrial chicken sandwich is a result of the obscene degradation of animals, workers, and the environment on the part of an industry that pays revolving-door lobbyists to promote food policy that, in turn, keeps production costs and prices artificially low, in part by externalizing most of the harms it causes. In some cases, such disvalue may be significant enough to make purchasing the product wrong, even if doing so does not lead, causally, to any actual harm or rights-infringement (see Chignell 2016)[^chignell-2016].
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      The term “evil” is typically only applied in cases of symbolic disvalue when there is something excessive about them. Stepping on a flag or consuming a chicken sandwich might have some symbolic disvalue, but it would be strange to say that these are cases of symbolic *evil*. Having anything to do with soap made from the body fat of people murdered at the Stutthof concentration camp, by contrast, seems downright evil, even if the intended consequences (i.e., getting oneself clean) are good. Indeed, the symbolic evil attached to such a product may “touch” everyone who was part of the society that permitted its manufacture, whether they were directly involved or not. The evil of sustained chattel slavery may have a similar sort of symbolic power, even generations later.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Both the nature and the origins of symbolic evil are hard to characterize; thus it is hard to see where it fits in the Table of Evils. Is there a metaphysical aspect to symbolic evil, or is it fully empirical? Is its origin entirely natural, or moral, or is there something spooky and non-agential about it? A related set of difficulties has to do with the fact that, in some contexts anyway, the transfer of symbolic disvalue operates via the complex logic of “taint”, contagion, or uncleanness. Some philosophers who write about symbolic value argue that the only way to avoid being “touched” by such evil is via active and explicit *dissociation*—a symbolic “standing with the good” (R. Adams 1999)[^adams-1999]. In other words, even if our abstinence does not make a difference, we must *symbolically* oppose an evil practice by, say, explicitly signaling opposition and (where possible) refusing to consume or benefit from its results (see Hill 1983; Appiah 1986)[^appiah-1986][^hill-1983].
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      ## 7. Radical Evil: Four Conceptions
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Kant is the source of “radical evil”, but his way of using the term is now out of favor. In fact, most people writing on this issue use the term in a precisely non-Kantian way to refer to something spectacularly excessive—an act or event whose badness is deeper and more mysterious than the badness of ordinary states or activities (Bernstein 2002)[^bernstein-2002].
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      In her famous account of the trial of Adolf Eichmann in Jerusalem, Arendt (1963) promoted the idea that even the worst evils can be “banal” and bureaucratical. A decade earlier, however, she conceived of “radical evil” quite differently. In a March 1951 letter to Karl Jaspers she wrote:
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      > We know that the greatest evils or radical evil has nothing to do anymore with humanly understandable, sinful motives. What radical evil is I don’t know, but it seems to me to somehow have to do with the following phenomenon: *making human beings as human beings superfluous*. (Arendt & Jaspers 1992: 166, emphasis added)[^arendt-1992]
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Arendt went on in the letter to insist that “making human beings as human beings superfluous” is not the same as treating them as “mere means to an end”. She thus rejected the Kantian view that radical evil—no matter how benign or awful the effects—has its root (Latin: *radix*) in the willful violation of the categorical imperative by individual free agents (see Louden 2010: 98)[^louden-2010].
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Jaspers’s view of radical evil, by contrast, was consistently non-exotic and Kantian: “there is evil because there is freedom. *It is only possible for the will alone to be evil*” (Jaspers 1947 [1958: 532], emphasis added)[^jaspers-1947]. According to one commentator, this focus on human freedom as the root of *all* evil is “significant and commendable”:
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      > Kant [and following him Jaspers] refuses to cater to our prurient craving for a special account that applies especially to the most extreme cases of evil…. He fears that occupying our imaginations with extreme cases of evil may be merely a way of indulging some of our nastier human traits—rationalizing our resentment and vindictiveness by supplying it with an object that would seem to justify it. (Wood 2010: 157)[^wood-2010]
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      The concerns expressed in these passages are common in discussions of the nature and origins of evil. Call them *Jaspersian concerns* for short. They are second-order concerns about how we should conceive and speak of evil, especially when calling it “radical”. The concerns fall into two broad kinds: (1) concerns about *exoticizing* wrongdoing with excess-locutions like “evil” and “radical”; and (2) concerns about *tainting* people and things that are touched by such evil, beyond the straightforward condemnation of the perpetrators (for more on such concerns, see Card 2002, Cole 2006, and Calder 2013 [2018])[^calder-2013][^card-2002][^cole-2006].
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      The Kantian conception of radical evil is considered in the next sub-section. Sections 7.2–7.4 survey three other conceptions and look at how each might raise Jaspersian concerns.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      ### 7.1 Radical Evil as Violation of the Moral Law
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Kant argues in *Religion within the Bounds of Reason Alone* (1793) that free choices against the moral law are unintelligible in the sense that they are *irrational*; our propensity to make them is thus an inexplicable mystery at the “root” (*radix*) of our moral psychology. The post-Kantian idealist F.W. J. Schelling, picking up the refrain, rejects the Privation Theory of radical evil in favor of the view that it has its origin in the positive, irrational decision to prefer self-advantage over the moral law, though “just how the decision for good or evil comes to pass in the individual, that is still wrapped in total darkness” (Schelling 1809 [1936: 59])[^schelling-1809].
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      On the Kantian view of radical evil, then, there is a normative sense in which it is “unintelligible”: it is an *irrational* propensity and thus cannot be “understood” in the sense that it cannot be sanctioned by proper reason. Likewise, an immoral choice cannot be fully explained: full explanations appeal to good reasons, and there are no good reasons for wrongdoing.
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      There is a broader sense of “understand” or “explain”, however, in which such evil is no mystery at all: it is the most depressingly familiar thing in the world. Everyday immoral agents presumably see what they are doing under the aspect of *some* good or other—good for their company, good for their bonuses, good for their reelection efforts—even if they also know that what they are doing is ultimately wrong. If we interpret the war cry of Milton’s Satan—“Evil be thou my good!” (1667, *Paradise Lost*, Bk IV, line 110)—as implying that he is taking evil under the guise of the good, then it is not absurd. But it is still not *wholly* intelligible, either.
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      The Kantian conception of radical evil, then, says that that the unintelligibility of wrongdoing does not prevent us from assigning blame, holding perpetrators responsible, and refusing to taint the innocent. This explains why Jaspers found the conception so attractive:
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      > To rank the will to happiness, which dominates among men’s motives, above the unconditioned law that shows itself in reason—*that* is the root of evil, the “propensity” which Kant calls “radical evil”. (Jaspers 1962: 321)[^jaspers-1962]
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      ### 7.2. Radical Evil as Choosing Evil for its own Sake
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Some philosophers, and more than a few novelists and screenwriters, find the view that agents are always choosing under “the guise of the good” as inadequate to the psychology of extreme malevolence. It may have suited the melioristic conceptions of the Enlightenment, but the well-publicized, mechanized horrors of the recent past allegedly demand a bleaker picture of perpetrator psychology. Serial killers, murderous dictators, torturers, derivatives traders: the idea is that at least some of these malign actors *see their own actions as atrocious*—as making the world worse rather than better on the whole (and sometimes worse for themselves)—and yet still choose to perform them. They are thus not saying “Evil be thou my good”, at least on the interpretation just offered. Rather, they are self-consciously *male-volent:* they *will the bad under the aspect of the bad*. And yet they are not insane—this is what makes their actions especially difficult for the rest of us to understand. This is a second common way in which the term “radical evil” is used. (See Pauer-Studer and Velleman 2015 for a reading of Milton according to which Satan’s war cry is interpreted in this way.)[^pauer-studer-2015]
    step1: TBD
    step2: TBD
