      相比之下，若某行为构成对*理性*本身的整体否认，还能为之给出*任何*可信理由，就不那么显然了。这就是为什么拒斥意义上的根本恶有以一种独特方式变得不可理解且令人不安之虞。如果某个人——不是野兽或机器，而是人——以全然否定道德权威意识、乃至道德理性基本规则的方式行动，他实际上把自己置于一种堕落前的状态，卸下了善恶的知识。他的行为声称自己已完全超越道德领域——他所做的事*不可能*是错的。
    step2: |-
      反过来，若一桩行为构成对*理性*的彻底否认，还能替它找出*任何*像样的理由吗？这就难说了。拒斥意义上的根本恶，之所以以独特的方式显得不可理解、令人不安，原因在此。倘若一个不是禽兽、不是机器、而是人的人，其行事不只抹掉对道德权威的意识，连道德理性的基本规则也一概不认，那他实际上就把自己摆进了堕落之前的状态，卸掉了善恶的知识。他的行为等于宣称：自己已完全越出道德领域——他做的*不可能*是错的。
