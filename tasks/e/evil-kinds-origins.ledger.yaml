      *Systemic evil* is the kind of evil that exists at the level of systems or groups rather than merely at the level of individuals. Organized structures like governments, corporations, teams, and religious institutions can be evil in this way; so can more loosely-organized systems such as “Academia”, “White Supremacy”, and “Wall Street”. Indeed, Google includes the motto “Don’t Be Evil” in its *Company Code of Conduct* (for the origins of this, see Chang 2019)[^chang-2019]; disgruntled employees later sued the company alleging that it had violated that pledge (Allyn 2021)[^allyn-2021].
    step1: |-
      *系统性恶*是存在于系统或群体层面、而不只是个体层面的那种恶。政府、公司、团队、宗教机构等有组织的结构可以以这种方式为恶；组织较松散的“学术界”“白人至上主义”“华尔街”等系统亦然。事实上，谷歌曾在其《公司行为准则》中写入“不作恶”的箴言（其由来见 Chang 2019）[^chang-2019]；后来有不满的员工起诉公司，指其违背了该承诺（Allyn 2021）[^allyn-2021]。
    step2: |-
      *系统性恶*，存在于系统或群体的层面，而不只落在个人身上。政府、公司、团队、宗教团体这类有组织的结构，都可以这样为恶；组织结构松散的“学界”“白人至上主义”“华尔街”之类，同样可以。谷歌自家的《公司行为准则》里就写过“不作恶”（其来历见 Chang 2019）[^chang-2019]；后来有员工心怀不满，告公司违背了这句承诺（Allyn 2021）[^allyn-2021]。
  - id: 96
    kind: body
    source: |-
      Systemic evil seems empirical rather than metaphysical, but its origins are difficult to identify. It does not appear to be a merely natural phenomenon, or a spooky non-agential one, and yet its supra-agential character makes it seem not entirely moral either.
    step1: |-
      系统性恶似乎是经验的而非形而上学的，但其起源难以指认。它似乎不是纯自然现象，也不是鬼魅式非人格现象，然而其超个体的性格又使它显得并非全然是道德的。
    step2: |-
      系统性恶看来是经验之恶，不是形而上学之恶；可它的起源不好指认。说它是纯自然现象吧，不像；说是鬼魅式非人格的吧，也不像；可它那种超乎个体之上的性格，又让人觉得它不全是道德的。
  - id: 97
    kind: body
    source: |-
      Hannah Arendt’s early work on totalitarianism (1951) depicts systemic evil as a kind of empirical evil for which *no* individual or even collection of individuals is fully responsible. The cogs in the machine, as well as the leader or leadership, may be the origin of some of the harms involved, but the evil of the whole structure (on Arendt’s view) is somehow greater than the sum produced by its parts.
    step1: |-
      汉娜·阿伦特早期关于极权主义的研究（1951）把系统性恶描绘为一种经验之恶，*没有*任何个人、甚至任何个人的集合能为此完全负责。机器上的齿轮以及领袖或领导层，或许是其中某些伤害的起源，但整个结构的恶（在阿伦特看来）在某种意义上大于其各部分所产出者之和。
    step2: |-
      汉娜·阿伦特早年那部论极权主义的书（1951）把系统性恶写成一种经验之恶：*没有*哪个个人，甚至哪一群个人，能为此全盘负责。机器上的齿轮也好，领袖或领导层也好，或许是其中某些伤害的源头；但在阿伦特看来，整个结构之恶，似乎大于各部分所生之恶的总和。
  - id: 98
    kind: body
    source: |-
      Racism is another prominent example of systemic evil. Recent accounts of entrenched racist structures in certain societies (the United States, for instance) suggest that such evil has its origin not merely in actions and intentions but also in *omissions* and *passivity:* people who do *not* explicitly support the systemic evil can count as agents of it. If this is right, then active work against the evil in question—“anti-racist” activity rather than “non-racist” activity, for example—becomes morally required (Kendi 2019)[^kendi-2019]. But even such active opposition efforts may not be sufficient to avoid complicity in systemic evil: some theorists argue that even anti-racist people living in racist societies are “tainted” by its evil all the same (Rothstein 2017)[^rothstein-2017]. That leads to the next kind of problem case.
    step1: |-
      种族主义是系统性恶的另一个显著例子。晚近对某些社会（例如美国）中根深蒂固的种族主义结构的论述认为，这种恶的起源不仅在行为与意图，也在*不作为*与*消极*：*未*明确支持系统性恶的人，也可算作它的行动者。若此说成立，那么积极反对该恶——例如“反种族主义”活动而非“非种族主义”活动——便在道德上成为必需（Kendi 2019）[^kendi-2019]。但即便这类积极反对的努力，也可能不足以避免卷入系统性恶：有理论家主张，生活在种族主义社会中的反种族主义者，同样被其恶“污染”（Rothstein 2017）[^rothstein-2017]。这就引向下一类疑难案例。
    step2: |-
      种族主义是系统性恶的又一个显例。晚近论某些社会（如美国）中根深蒂固的种族结构的著作提出：这种恶的源头不只在作为与意图，也在*不作为*与*消极*。没有明确支持系统性恶的人，同样可以算作它的行动者。若果真如此，“反种族主义”的行动（而非仅仅“非种族主义”的态度）便在道德上成为必需（Kendi 2019）[^kendi-2019]。可就连这种积极反对，也未必能免于同谋：有理论家说，生活在种族主义社会里的反种族主义者，照样被那恶“沾染”（Rothstein 2017）[^rothstein-2017]。这就把我们引向下一类疑难案例。
