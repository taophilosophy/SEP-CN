      于是，褫夺论减轻了一神论所受的压力：恶不是一个存在者，而是一种缺失，因此上帝并未创造它。再者，恶是那种*并非*事物本质本性之函数的缺失，因此不能责怪上帝创造了本质上恶的事物。然而，未能达成自身本性所设定的目的——未能成为自己*应当*成为的样子——*就是*一种褫夺，因而就是恶。
