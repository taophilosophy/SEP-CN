      For Plotinus, it is not merely being *lower* than the highest One that makes something evil; rather, evil consists in being so low as to be associated with matter. Indeterminate or “unformed matter” is the final term on the cosmic chain from being to non-being—it is as far away from intelligence as possible, and thus equally far away from goodness. This is the *Matter Theory of Evil* that was influential in various gnosticisms, early Christian heresies, and late antique platonisms (see O’Meara 2019)[^o’meara-2019].
    step1: |-
      对普罗提诺来说，使某物为恶的并不只是它*低于*最高的太一；恶在于低到与质料相关联。不确定的或“未成形的质料”是从存在到非存在的宇宙链条上的最后一环——它离理智最远，因而离善也同样远。这就是*恶的质料论*，它在各种诺斯替主义、早期基督教异端与晚期古代柏拉图主义中颇有影响（见 O’Meara 2019）[^o’meara-2019]。
    step2: |-
      在普罗提诺看来，一物为恶，不只是因为*低于*至高的太一；恶在于低到与质料纠缠的地步。不确定的、“未成形”的质料，是从存在通往非存在的宇宙链条上最后一环：它离理智最远，离善也就同样远。这便是*恶的质料论*。诺斯替各派、早期基督教异端、晚期古代柏拉图主义者都受其影响（见 O’Meara 2019）[^o’meara-2019]。
