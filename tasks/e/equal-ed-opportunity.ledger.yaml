      While some of these inequalities might be remedied by social policies that address employment practices, gender and racial inequality, and wealth inequality, we have reasons to think that some inequality in opportunity will remain in a just society simply because parents should be able to treat their children differently from other people’s children in ways that are to their children’s advantage. For example, a parent may read bedtime stories to his children but if he does he does not also need to read them to other children, even if a failure to read to everyone exacerbates inequality. There are limits to what the state can do without intruding on the life of the family. At the same time, concern for mitigating inequality that is rooted in familial relations has to grapple with the fact that different parenting styles have value as well as downsides, and that the middle-class norm of trying to maximize children’s potential (“concerted cultivation”; Lareau 2011)[^lareau-2011] is no exception in terms of having certain disadvantages for children.
    step1: |-
      尽管其中一些不平等可能由处理就业实践、性别与种族不平等、财富不平等的社会政策所补救，但我们有理由认为，一个公正社会中仍会存在一些机会不平等，仅仅因为父母应当能够以对其子女有利的方式，区别对待自己的子女与他人的子女。例如，父母可以给自己的孩子读睡前故事，但若如此，他并不需要也给其他孩子读，即使不给所有人读会加剧不平等。国家在不侵扰家庭生活的前提下所能做的，是有限度的。同时，对缓解植根于家庭关系的不平等的关切，必须应对这样一个事实：不同的养育风格既有价值也有缺点，而中产阶级尽力最大化儿童潜能的规范（“协作培养”；Lareau 2011）[^lareau-2011]，在给儿童带来某些劣势方面也不例外。
