      To illustrate a second limitation with the meritocratic conception of equal educational opportunity, imagine that all highly selective university places have been awarded to members of the upper class through cronyism, and that a progressive new government is suddenly elected into power to enforce meritocratic admissions. After generations of consolidating superior education, jobs and wealth at the expense of the poor, the upper-classes are in a far better place, particularly if private schooling is available, to ensure that their children end up being the most meritorious, thereby preserving vast social inequalities between members of different classes. Although some opportunities are open to all equally, opportunities to develop “merit” are not distributed equally (Williams 1962)[^williams-1962]. Intergenerational transmission of opportunities to cultivate merit would generate a deeply divided and unequal society, which is at odds with the ideal of equality of educational opportunity.
