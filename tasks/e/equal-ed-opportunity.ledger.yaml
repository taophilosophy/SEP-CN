      The structure and appropriate content of civic education is debated extensively. While some argue that citizenship education can be narrowly construed so as to not encroach upon individuals’ private commitments, others claim it is a far more demanding educational endeavor. A key part of this debate is the extent to which education requires the cultivation of autonomy, and if does, the nature of the autonomy that is required. Some claim that since some groups in pluralistic democracies reject the idea of an autonomous life, education for autonomy cannot be imposed upon them even for civic purposes, and so education should not entail the cultivation of individual autonomy (Galston 1989)[^galston-1989]. Rawls’ own solution to the potential clash between civic education for autonomy and individuals’ private commitments is to advocate only a limited form of autonomy, political autonomy, which “leaves untouched all kinds of doctrines—religious, metaphysical, and moral” and yields a relatively thin civic education (Rawls 2005: 375)[^rawls-2005]. Others take issue with this view, arguing that civic education requires an encompassing form of autonomy that has unavoidable spillover effects into the private sphere of individuals’ lives, and that may clash with some religious convictions (Callan 1997; Gutmann 1995; see also Arneson & Shapiro 1996, for a discussion of *Wisconsin v. Yoder* (1972), a U.S. Supreme Court case about religious exemptions from compulsory education).
    step1: |-
      公民教育的结构与恰当内容受到广泛争论。一些人主张，公民教育可以被狭义地理解，从而不侵扰个人的私人承诺；另一些人则主张，它是一种要求远为严苛的教育事业。这一争论的一个关键部分，是教育在多大程度上要求培养自主，以及若要求，所要求的自主的性质为何。一些人主张，由于多元民主中的某些群体拒绝自主生活的理念，为自主而进行的教育即使出于公民目的也不能强加于他们，因此教育不应包括对个人自主的培养（Galston 1989）[^galston-1989]。罗尔斯自己对公民教育之自主与个人私人承诺之间潜在冲突的解决办法，是只倡导一种有限的自主形式，即政治自主，它“不触及任何种类的学说——宗教的、形而上学的与道德的”，并产生一种相对单薄的公民教育（Rawls 2005: 375）[^rawls-2005]。另一些人对此观点提出异议，主张公民教育要求一种包容性的自主形式，它不可避免地波及个人生活的私人领域，并可能与我们某些宗教信念相冲突（Callan 1997; Gutmann 1995; 另见 Arneson & Shapiro 1996，关于*威斯康星州诉约德案*（1972）——一个关于义务教育宗教豁免的美国最高法院案件——的讨论）。
