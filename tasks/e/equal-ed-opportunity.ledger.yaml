      Education has both instrumental and intrinsic value for individuals and for societies as a whole. As the U.S. Supreme Court stated in its unanimous decision in *Brown v. Board of Education* (1954), “In these days, it is doubtful that any child may reasonably be expected to succeed in life if he is denied the opportunity of an education”. The instrumental goals of K–12 education for individuals include access to higher education and a constellation of private benefits that follow college education such as access to interesting jobs with more vacation time and better health care; greater personal and professional mobility, better decision-making skills (Institute for Higher Education Policy 1998)[^institute-1998] and more autonomy at work. Research further shows that education levels are correlated with health and wealth: the more education a person has, the healthier and wealthier she is likely to be. At the same time, education is also considered intrinsically valuable. Developing one’s skills and talents can be enjoyable or good in itself and a central component of a flourishing life, regardless of the consequences this has for wealth or health.
    step1: |-
      教育对个人以及作为整体的社会，既有工具价值，也有内在价值。正如美国最高法院在其关于*布朗诉教育委员会案*（1954）的一致裁决中所言：“当今之世，若剥夺一个孩子接受教育的机会，恐怕难有哪个孩子可以被合理地期望在人生中取得成功。”K-12 教育对个人的工具性目标，包括进入高等教育，以及随之而来的一系列私人利益，例如获得更有趣的工作、更多的休假时间与更好的医疗保健；更大的个人与职业流动性，更好的决策技能（高等教育政策研究所 1998）[^institute-1998]，以及工作中的更大自主。研究进一步表明，教育水平与健康和财富相关：一个人受的教育越多，她很可能越健康、越富有。与此同时，教育也被视为具有内在价值。发展一个人的技能与才能，其本身可以是令人愉悦的或善的，也是繁荣人生的核心组成部分，无论这对财富或健康带来何种后果。
    step2: |-
      教育对个人和作为整体的社会都具有工具价值与内在价值。正如美国最高法院在关于布朗诉教育委员会案（*Brown v. Board of Education* ，1954）的一致裁决中所说：“在今天，若剥夺一个孩子接受教育的机会，恐怕没有哪个孩子能被合理地期望在人生中取得成功。”K-12 教育对个人的工具性目标包括：进入高等教育，以及随之而来的一系列私人好处——例如获得更有趣、假期更多、医疗更好的工作；更大的个人与职业流动性，更优的决策能力（高等教育政策研究所 1998）[^institute-1998]，以及工作中的更大自主权。研究进一步表明，教育水平与健康和财富相关：一个人受的教育越多，她很可能就越健康、越富有。与此同时，教育也被视为具有内在价值。发展一个人的技能与才能本身就可以是令人愉悦的或善的，也是繁荣人生的核心要素，无论这对财富或健康带来什么后果。

