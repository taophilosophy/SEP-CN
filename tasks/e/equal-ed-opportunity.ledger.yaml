      The persistence of race and class-based segregation in the U.S. and the educational disadvantages that follow are rooted in the U.S. system of geographically defined school districts, whereby schools are largely funded by local property taxes that differ substantially between communities based on property values. This patchwork system compounds the educational disadvantages that follow from residential segregation. The 50 states in the United States differ dramatically in the level of per pupil educational funding that they provide; indeed some of these interstate disparities are greater than the intra-state inequalities that have received greater attention (Liu 2006)[^liu-2006]. The system for funding schools and the residential segregation it exacerbates—itself the product of decades of laws and conscious policies to keep the races separate—has produced and continues to yield funding inequalities that disproportionately affect poor Americans of color. The segregation of resources, with greater resources flowing to children from families in the upper quintiles of society, makes it highly unlikely that children from the lower quintiles can have an equal chance of achieving success. This is evident in research documenting the growing achievement gap between high and low-income students, which is now 30–40% greater among children born in 2001 than those born twenty-five years before (Reardon 2011: 91; Reardon 2021 in Other Internet Resources)[^reardon-2011][^reardon-2011-2].
