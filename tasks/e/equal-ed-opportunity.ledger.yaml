      Because of the limits of formal equality of opportunity, John Rawls developed a conception he calls Fair Equality of Opportunity (FEO). FEO requires that social offices and positions be formally open to all, and that individuals who are similarly talented and motivated should have a roughly equal chance to attain these positions, independent of their social class background (Rawls 2001: 42–44)[^rawls-2001]. FEO holds that all citizens of a society count as the relevant agents, the desired goal is offices and positions, and the obstacles people should not face includes their social class background. The obstacles people may legitimately face include having fewer developed abilities or less willingness to use them.
    step1: |-
      由于形式机会均等的局限，约翰·罗尔斯发展出一种他称之为公平机会均等（Fair Equality of Opportunity, FEO）的观念。FEO 要求社会职务与职位对所有人正式开放，并且具有相似才能与动机的个人，应当拥有大致平等的机会获得这些职位，而独立于其社会阶级背景（Rawls 2001: 42–44）[^rawls-2001]。FEO 认为，一个社会的所有公民都算作相关行动者，期望目标是职务与职位，而人们不应当面对的障碍包括其社会阶级背景。人们可以正当地面对的障碍，包括所发展的能力较少，或不太愿意运用这些能力。
