      A longstanding debate in the literature juxtaposes the view that we should prioritize equality in the distribution of educational opportunities with the view that an “adequacy” approach is the right one (on this debate, see Reich 2013)[^reich-2013]. Those who advocate the equality view may insist on equal outputs (i.e., educational outcomes, like the mastery of particular skills) or inputs (i.e., educational resources, like equal per pupil funding or qualified teachers). The adequacy view, by contrast, is seen as holding that what matters most is meeting a specified educational threshold.
    step1: |-
      文献中长期存在的争论，把“我们应优先考虑教育机会分配中的平等”这一观点，与“‘充足’进路才是正确进路”这一观点并列（关于这一争论，见 Reich 2013）[^reich-2013]。主张平等观点的人可能坚持平等的产出（即教育结果，如对特定技能的掌握）或平等的投入（即教育资源，如平等的生均经费或合格教师）。相比之下，充足观点被视为认为，最重要的是达到一个特定的教育门槛。
