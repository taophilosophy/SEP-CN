      First, students do acquire soft skills in formal school settings. One study found that student achievement on tests accounts for just 20% of the effects of educational attainment on earnings (Bowles, Gintis, & Osborne 2001), which indicates that schools are cultivating non-cognitive skills that tests do not measure, and that are consequential in the labor market (Levin 2012)[^levin-2012]. Second, educational attainment has long been seen to have a signaling function in the labor market (Spence 1973)[^spence-1973], whereby employers rely upon job candidates’ educational credentials as a proxy for future productivity. Educational attainment itself, then, apart from applicants’ demonstration of particular skills, is central to screening and differentiating candidates. Finally, a college diploma has become especially consequential in recent years as the income gap between those with and without one has grown; individuals with a bachelors degree earn 84% more over their lifetime than those with just a high school diploma (see Carnevale, Rose & Cheah 2011). Lesley Jacobs’ notion of stakes fairness (2004) underscores the importance of equality of educational opportunity when it comes to preparation for the labor market. Ideally, the stakes attached to education for labor market success would not be nearly as high as they are now, whereby a winner-takes-all competition for a job can determine an individual’s access to social goods like healthcare, leisure time, and discretionary income. When the (non-ideal) stakes are this high, equality of educational opportunity matters all the more (Jacobs 2010)[^jacobs-2010].
    step1: |-
      首先，学生确实在正规学校环境中获得软技能。一项研究发现，学生的考试成绩仅占受教育程度对收入影响的大约 20%（Bowles, Gintis, & Osborne 2001），这表明学校在培养考试无法衡量的非认知技能，而这些技能在劳动力市场中举足轻重（Levin 2012）[^levin-2012]。其次，受教育程度长久以来被视为在劳动力市场中具有信号功能（Spence 1973）[^spence-1973]，雇主据此把求职者的教育凭证当作未来生产力的替代指标。因此，受教育程度本身，除了申请者对特定技能的展示之外，在筛选与区分候选人方面至关重要。最后，近年来，随着有无大学文凭者之间收入差距的扩大，大学文凭变得尤其举足轻重；拥有学士学位者终身收入比仅有高中文凭者高 84%（见 Carnevale, Rose & Cheah 2011）。莱斯利·雅各布斯（Lesley Jacobs）的赌注公平（stakes fairness）概念（2004）凸显了教育机会均等在为劳动力市场做准备方面的重要性。理想情况下，附于为劳动力市场成功而进行的教育的赌注，不应像现在这样高——如今，一场赢者通吃的求职竞争，可以决定个人获得医疗、闲暇时间与可支配收入等社会物品的机会。当（非理想）赌注如此之高时，教育机会均等就更加重要（Jacobs 2010）[^jacobs-2010]。
