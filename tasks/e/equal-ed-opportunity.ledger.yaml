      在《正义论》中，罗尔斯赋予公平机会均等原则以优先性，高于获得其他类型优势（如收入与财富）的机会。一些人对这一优先性提出质疑，主张 FEO 所调节的机会并不比这些其他善更重要，并认为我们应当偏爱一种确保处境最不利者在收入上（或按某些批评者的说法，在福祉上）尽可能处境良好的原则——这一原则在罗尔斯著作中例如被称为差别原则（Alexander 1985; Arneson 1999; Clayton 2001; Miklosi 2010）[^alexander-1985][^arneson-1999][^clayton-2001][^miklosi-2010]。理查德·阿内森（Richard Arneson）在其论文《反对罗尔斯式的机会均等》中有力地提出了这一批评。罗尔斯主张 FEO 优先于差别原则的论证，源于对个人自尊的承诺，以及以公平条件竞争职务与社会职位的能力对这一自尊的贡献。但阿内森主张，我们当中能力较弱者可以合理地拒绝赋予有才能者的自尊以如此分量。毕竟，源自“自然彩票”结果的自尊是不平等分配的。阿内森认为，我们当中无才能者，会宁愿要福祉的增加，也不愿要一项不给他们带来任何好处的自尊原则。
