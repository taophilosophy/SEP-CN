      Some philosophical work has similarly undercut the sharp equality/adequacy distinction and shows how the two ideals are closely intertwined in the pursuit of educational justice. These approaches (e.g., Satz 2007; Anderson 2007)[^anderson-2007][^satz-2007] argue that adequacy in education has a relative and comparative component because the educational threshold depends on the knowledge and skills that others have, and so it is necessarily a moving target. For example, what it takes to serve on a jury, or to have an adequate opportunity for college, depends on the knowledge and skill levels of others. This “relational” approach to adequacy can respond to one of the strongest concerns proponents of equality raise: that because many of the benefits of education are positional, which is to say, their value depends upon one’s position relative to others, equality is the right distributive principle for educational opportunities. The meritocratic distribution of jobs, where the most qualified candidate is appointed (rather than the individual who is merely well-qualified), ensures that positionality is decisive in many cases. Conceptions of adequacy that are attentive to relevant comparative claims can address this issue and thereby deflate the tension between adequacy and equality approaches to distributing educational opportunities.
    step1: |-
      一些哲学工作同样削弱了尖锐的平等/充足区分，并表明在追求教育正义中，这两种理想是如何紧密交织的。这些进路（例如 Satz 2007; Anderson 2007）[^anderson-2007][^satz-2007]主张，教育中的充足具有相对性与比较性成分，因为教育门槛取决于他人所拥有的知识与技能，因此它必然是一个移动的目标。例如，担任陪审员需要什么，或拥有进入大学的充足机会需要什么，都取决于他人的知识与技能水平。这种“关系性”的充足进路，能够回应平等倡导者提出的一个最强关切：由于教育的许多好处是地位性的，也就是说，其价值取决于一个人相对于他人的位置，因此平等是教育机会的正确分配原则。工作的精英主义分配——任命最有资格的候选人（而非仅仅相当合格的候选人）——确保地位性在许多情况下具有决定性。关注相关比较性主张的充足观，能够解决这一问题，从而消解充足进路与平等进路在分配教育机会上的张力。
