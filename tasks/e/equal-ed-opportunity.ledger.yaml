      However, these responses would not satisfy those who believe that we should adopt prioritarianism with respect to especially important goods, distributing them in a way that gives priority to those who have the least (Schouten 2012)[^schouten-2012]. Prioritarianism is a controversial view, and has some controversial implications for the distribution of K–12 education. For example, a prioritarian view might endorse providing no state supported educational resources at all for those who are extremely talented, unless it could be shown that doing so improves the lot of the least well off. But many people will reject this implication, believing that the state does have educational obligations to the talented in their own right. Prioritarianism is also inattentive to inequalities that obtain elsewhere in the distributional scheme, for example, between those at the median and those at the very top. Many egalitarians will be disturbed by disproportionate opportunities going to the top 1%, even if the very bottom of the distribution is improved. Rawls’ view is not a simple prioritarian one, but instead endorses a complex set of principles—some of which are egalitarian such as FEO, and some of which give special attention to the least well off, such as the difference principle.
