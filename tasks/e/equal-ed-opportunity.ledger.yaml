      In addition to the instrumental and intrinsic value of education to an individual, education is also valuable for society. All societies benefit from productive and knowledgeable workers who can generate social surplus and respond to preferences. Furthermore, democratic societies need to create citizens who are capable of participating in the project of shared governance. The correlation between educational attainment and civic participation is strong and well-documented: educated citizens have more opportunities to obtain and exercise civic skills, are more interested in and informed about politics, and in turn, are more likely to vote (Verba, Schlozman, & Brady 1995: 432–437, 445; Dee 2004)[^dee-2004].
    step1: |-
      除教育对个人的工具与内在价值外，教育对社会也是有价值的。所有社会都受益于富有生产力和知识的劳动者，他们能创造社会剩余并回应偏好。此外，民主社会需要培养能够参与共同治理事业的公民。受教育程度与公民参与之间的相关性既强又有充分文献记载：受教育的公民有更多机会获得并运用公民技能，对政治更感兴趣、更了解政治，因而也更有可能会投票（Verba, Schlozman, & Brady 1995: 432–437, 445; Dee 2004）[^dee-2004]。
    step2: |-
      除了教育对个人的工具价值与内在价值之外，教育对社会也有价值。所有社会都受益于富有生产力与知识的劳动者，他们能创造社会剩余并回应人们的偏好。再者，民主社会需要培养能够参与共同治理事业的公民。受教育程度与公民参与之间的关联既强又有充分文献记载：受教育的公民有更多机会获得并行使公民技能，对政治更感兴趣、更了解，因而也更可能投票（Verba, Schlozman, & Brady 1995: 432–437, 445; Dee 2004）[^dee-2004]。
