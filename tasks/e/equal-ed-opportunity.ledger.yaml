      A more urgent demonstration of the scarcity of educational opportunity in the U.S. and many other societies is evident in how access to high-quality primary and secondary education is effectively limited to children whose families can afford housing in middle-class neighborhoods, or who have access to private schools via tuition or scholarships. Despite the *Brown* decision’s eradication of *de jure*, or state-sanctioned, segregation by race in schools, public schools in the U.S. remain sharply segregated by race and by class due to *de facto* residential segregation. This segregation has significant consequences for poor and minority students’ educational opportunity. Given the strong correlation between school segregation, racial achievement gaps, and overall school quality, poor and minority students are disproportionately educated in lower performing schools compared to their white and more advantaged peers (Reardon 2015 and Reardon, Weathers, Fahle, Jang, and Kalogrides 2022 in Other Internet Resources)[^reardon-2015]. The COVID-19 pandemic has exacerbated these systemic background inequalities, with prolonged school closures in the U.S. disproportionately impacting low-income children who rely on schools to provide an array of social welfare services, including meals (Levinson, Cevik, and Lipsitch 2020; Levinson, Geller, and Allen, 2021).
    step1: |-
      一个更紧迫的例证表明，在美国与许多其他社会中，教育机会的稀缺性体现于：高质量的中小学教育机会实际上仅限于那些家庭能够负担中产阶级社区住房、或能够通过学费或奖学金进入私立学校的儿童。尽管*布朗*案废除了学校中*法律上*（de jure）的、即国家认可的种族隔离，但由于*事实上*（de facto）的居住隔离，美国的公立学校在种族与阶级层面仍然严重隔离。这种隔离对贫困与少数族裔学生的教育机会产生重大影响。鉴于学校隔离、种族学业成就差距与整体学校质量之间的强相关性，贫困与少数族裔学生与白人及更优势的同龄人相比，被不成比例地安置在表现更差的学校中就读（Reardon 2015；以及 Reardon, Weathers, Fahle, Jang, and Kalogrides 2022，见其他网络资源）[^reardon-2015]。新冠疫情加剧了这些系统性的背景不平等，美国长期的学校停课不成比例地冲击了依赖学校提供一系列社会福利服务（包括餐食）的低收入儿童（Levinson, Cevik, and Lipsitch 2020; Levinson, Geller, and Allen, 2021）。
    step2: |-
      一个更紧迫的例证表明，在美国及许多其他社会中，教育机会的稀缺性体现于：高质量的中小学教育机会，实际上仅限于那些家庭能负担得起中产阶级社区住房、或能通过学费或奖学金进入私立学校的儿童。尽管布朗案废除了学校中 *de jure* （法律上的）、即国家认可的种族隔离，但由于 *de facto* （事实上的）居住隔离，美国的公立学校在种族和阶级层面仍然严重隔离。这种隔离对贫困与少数族裔学生的教育机会有重大影响。鉴于学校隔离、种族学业成就差距与整体学校质量之间的强相关性，贫困与少数族裔学生被不成比例地安排在表现更差的学校就读，其情形与白人及更优势的同龄人形成对照（Reardon 2015；以及 Reardon, Weathers, Fahle, Jang, and Kalogrides 2022，见其他网络资源）[^reardon-2015]。新冠疫情加剧了这些系统性的背景不平等，美国长期的学校停课不成比例地冲击了低收入儿童，他们依赖学校提供一系列社会福利服务，包括餐食（Levinson, Cevik, and Lipsitch 2020; Levinson, Geller, and Allen, 2021）。

