      A final issue with FEO concerns our understanding of, and ability to determine, natural levels of talent. It can be very hard to know who has the most potential even when children are well into their schooling. This suggests that it is not an appropriate or feasible benchmark for the regulation of social institutions since we could never know whether it was satisfied (Gomberg 1975)[^gomberg-1975]. In addition, the focus on natural talents has led some to consider the interaction between epigenetic traits and social environmental factors, calling into question the integrity of this distinction. This expands our sense of the arbitrariness of natural inequalities and may provide important insights on how to redress these inequalities (Loi, Del Savio and Stupka 2013).
