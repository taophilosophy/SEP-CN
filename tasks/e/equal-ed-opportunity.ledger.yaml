      This entry has provided analysis of key positions in debates about equality of educational opportunity. We began by describing the reasons for being concerned about equality in this arena and then surveyed debates about the value and distribution of such opportunities. As the above discussion highlights, the realization of the ideal of equality of educational opportunity may be frustrated by competing conceptions of what equality itself entails, and also by other important values that are in tension with equalizing education opportunities (e.g., respecting family autonomy). Social scientific advances in recent years have clarified our understanding of the mechanisms behind children’s unequal access to educational opportunities, and the consequences of those inequalities for social mobility (e.g., Chetty et al. 2014; Duncan & Murnane 2011)[^chetty-2014][^duncan-2011]. This knowledge enables policymakers to target interventions to areas that will be most impactful (e.g., growing recognition of the importance of early childhood education). But value tensions of the sort highlighted in this entry will persist, and they warrant ongoing attention by philosophers as our understanding of the causes and consequences of educational inequalities sharpens.
    step1: |-
      本词条分析了教育机会均等争论中的关键立场。我们首先描述关切这一领域平等的原因，然后考察关于这些机会的价值与分配的争论。如上述讨论所凸显的，教育机会均等理想的实现，可能受到关于平等本身蕴含何物的竞争性观念、以及与其他重要价值（如尊重家庭自主）的紧张关系的阻碍。近年来的社会科学进展，阐明了我们对儿童不平等地获得教育机会背后机制的理解，以及这些不平等对社会流动的后果（例如 Chetty et al. 2014; Duncan & Murnane 2011）[^chetty-2014][^duncan-2011]。这一知识使决策者能够把干预措施瞄准最具影响力的领域（例如，对早期儿童教育重要性的日益认识）。但本词条所凸显的这类价值紧张将持续存在，随着我们对教育不平等原因与后果的理解日益敏锐，它们值得哲学家持续关注。
