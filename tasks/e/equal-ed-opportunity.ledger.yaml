      在美国学校资助诉讼的语境中，倡导者常常同时援引这两种分配理想，而非认为它们相互对立（Rebell 2009: 21–22; Ryan 2008: 1232–1238）[^rebell-2009][^ryan-2008]。尽管美国今天的大多数学校资助诉讼是从充足框架出发的（因其更大的政治可行性），诉讼人常就学生的教育机会提出比较性主张以支持其案件。反之，在律师主张平等的语境中，他们常诉诸一种教育质量概念（如实现读写能力、计算能力与公民技能）来锚定其主张，并避免“向下拉平”问题——即通过使所有人处境更差来实现平等，而不顾及特定教育目标的实现。
