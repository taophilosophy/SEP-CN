      Individuals with cognitive and physical disabilities have been marginalized, denied resources, and even denied an education. Can a conception of equality of educational opportunity accommodate those with cognitive and physical disabilities? Some critics claim that theories of justice focus unduly on meeting the demands of reciprocity and cooperation as a pre-condition to equal opportunity and other demands of justice, and in doing so, exclude some individuals with disabilities from those entitlements. Some argue that we need new theories (Kittay 1999; Barnes 2016)[^barnes-2016][^kittay-1999] while others argue that existing theories and approaches can be applied to or extended to include individuals with disabilities (Stark 2013; Robeyns 2006; Brighouse 2001)[^brighouse-2001][^robeyns-2006][^stark-2013]. In education, treating individuals with disabilities the same as those without does not always suffice to treat all equally, for disabilities sometimes give rise to special needs and requirements and this raises challenges for ‘inclusion’ (Warnock 2005)[^warnock-2005]. In order to avoid these challenges it seems that we might need to endorse differential treatment, which can lead to stigma and division and has been associated with educational segregation. This gives rise to what has been called the “dilemma of difference” and pertains to decisions about whether students with disabilities should be educated in the same class as students without disabilities. Placing disabled children in mainstream schools or classes may lead to bullying, as Mary Warnock (2005) has noted, but placing disabled children in separate settings may further entrench the wide-spread social stigma associated with disability, even when there is much that can be done to ensure disability is not an obstacle to learning. Further debates focus on the extent to which (at least some of) the disadvantages of disability may be detached from the disability itself and the extent to which they are attached only in virtue of social organization or social attitudes, which we could and should alter. For instance, if the dominant modes of communication in our society were sign-based rather than spoken, perhaps deafness would not be considered a disability. Likewise, where braille translations are readily available, the blind do not face a disability with respect to reading (Sparrow 2005)[^sparrow-2005]. In the case of education, the design of the school or the curriculum can determine whether a disability is an obstacle to learning. For some discussion of this debate see Terzi 2005.
    step1: |-
      有认知与身体残障的人被边缘化、被剥夺资源，甚至被剥夺教育。一种教育机会均等观念能否容纳有认知与身体残障的人？一些批评者主张，正义理论过分聚焦于满足互惠与合作的要求，将其作为机会均等和其他正义要求的先决条件，从而把一些残障人士排除在这些应得之外。一些人主张我们需要新的理论（Kittay 1999; Barnes 2016）[^barnes-2016][^kittay-1999]，另一些人则主张，现有理论与进路可以被应用或扩展以容纳残障人士（Stark 2013; Robeyns 2006; Brighouse 2001）[^brighouse-2001][^robeyns-2006][^stark-2013]。在教育中，把残障人士与无残障者同等对待，并不总能足以平等对待所有人，因为残障有时会产生特殊需要与要求，这给“融合”（inclusion）带来挑战（Warnock 2005）[^warnock-2005]。为避免这些挑战，我们似乎可能需要认可差别对待，而这可能导致污名与分裂，并与教育隔离相联系。这产生了所谓“差异困境”，涉及关于残障学生是否应与无残障学生在同一班级接受教育的决定。把残障儿童安置在主流学校或班级可能导致欺凌，正如玛丽·沃诺克（Mary Warnock，2005）所指出的；但把残障儿童安置在隔离环境中，可能进一步固化与残障相关的普遍社会污名，即使有大量措施可以确保残障不成为学习的障碍。进一步的争论聚焦于：残障的（至少部分）劣势在多大程度上可以与残障本身相分离，以及它们在多大程度上仅因社会组织或社会态度而附着于残障——而这些都是我们能够且应当改变的。例如，如果我们社会中的主导交流方式是手语而非口语，也许失聪就不会被视为一种残障。同样，在盲文译本随处可得之处，盲人在阅读方面并不面临残障（Sparrow 2005）[^sparrow-2005]。就教育而言，学校或课程的设计可以决定残障是否成为学习的障碍。关于这一争论的某些讨论，见 Terzi 2005。
