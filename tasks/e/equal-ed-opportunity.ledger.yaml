      A second key goal for education, which plays a prominent role in public discourse, is to prepare individuals for productive employment. Education for the labor market has significant benefits for the state (e.g., GDP growth) and for individuals (e.g., remunerative and rewarding employment and all its associated benefits, including more discretionary income, more leisure time, and in the U.S., better healthcare). This function of education is critically important as a matter of justice. Education aimed at preparing individuals for employment has become especially pressing in view of the income inequalities that leading economists have highlighted (Piketty 2014; Saez & Zucman 2014)[^piketty-2014][^saez-2014]. And since education for employment is a highly positional good given a competitive labor market, it matters all the more how educational opportunity in this arena is distributed.
