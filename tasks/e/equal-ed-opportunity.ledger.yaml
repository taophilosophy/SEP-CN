      Loury thus sees a role for preferential policies in higher education that would move us from a society like *A* to a society like *B*. One of the more controversial reforms associated with higher education and equality of opportunity is affirmative action, which reserves preferential treatment for historically disadvantaged groups. Affirmative action has been criticized by those who think that merit, and not race or class, should be the only criterion for selecting college applicants. Others argue that it can lead to the unintended stigmatization of members of disadvantaged groups who attend college as not deserving of their place. However, this is to forget that opportunities to develop merit are themselves unfairly distributed between groups historically. Notwithstanding this response, affirmative action remains a controversial response to a very difficult social problem (Guinier 2016)[^guinier-2016].
