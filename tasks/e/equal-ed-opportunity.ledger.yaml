      Since education is an integral function of government, and because it is an opportunity that government largely provides, there are special constraints on its distribution. Justice, if it requires nothing else, requires that governments treat their citizens with equal concern and respect. The state, for example, cannot justly provide unequal benefits to children on the basis of factors such as their race or gender. Indeed, such discrimination, even when it arises from indirect state measures such as the funding of schools from property taxes, can be especially pernicious to and is not lost on children. When poor and minority children see, for example, that their more advantaged peers attend better resourced public schools—a conclusion that can be drawn in many cases simply by comparing how school facilities look—they may internalize the view that the state cares less about cultivating their interests and skills. Children in this position suffer the dignitary injury of feeling that they are not equal to their peers in the state’s eyes (Kozol 1991, 2005)[^kozol-1991]. This harm is especially damaging to one’s self-respect because it is the development of one’s talents that is at stake; whether or not one has opportunities to gain the skills and confidence to pursue their conception of the good is central to what Rawls calls “the social basis of self-respect” (Rawls 1999: sections 65 and 67; Satz 2007: 639)[^rawls-1999][^satz-2007].
    step1: |-
      由于教育是政府不可或缺的职能，又由于它是政府大体提供的机会，其分配便受到特殊约束。正义——即便它别无他求——也要求政府以平等的关切与尊重对待其公民。例如，国家不能公正地以种族或性别等因素为基础，向儿童提供不平等的利益。的确，此类歧视，即便源自间接的国家措施（如以财产税资助学校），也可能对儿童特别有害，而儿童对此并非毫无察觉。例如，当贫困与少数族裔儿童看到他们更优势的同龄人就读于资源更好的公立学校——在许多情况下，只需比较学校的设施外观即可得出这一结论——他们可能会内化这样一种看法：国家不太关心培养他们的兴趣与技能。处于这种境况的儿童会遭受尊严上的伤害，感到自己在该国眼中不如同龄人平等（Kozol 1991, 2005）[^kozol-1991]。这种伤害对一个人的自尊尤为有害，因为它危及的正是个人才能的发展；一个人是否有机会获得技能与自信去追求其善观念，对于罗尔斯所称“自尊的社会基础”至关重要（Rawls 1999: sections 65 and 67; Satz 2007: 639）[^rawls-1999][^satz-2007]。
