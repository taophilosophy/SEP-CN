      Questions about the just distribution of educational opportunity are especially vexing given the scarcity of resources allocated to education. Although developed societies provide some education for free to their citizens, funding for education is always in competition with the need to provide citizens with other social goods. As Amy Gutmann writes: “The price of using education to maximize the life chances of children would be to forego these other social goods” (Gutmann 1999: 129)[^gutmann-1999]. Other basic welfare needs (e.g., housing, healthcare, food), as well as cultural goods (e.g., museums, parks, concert halls), must be weighed against public funds allocated to education, thereby making high-quality education—even in highly productive societies—scarce to some degree.
    step1: |-
      鉴于分配给教育的资源匮乏，关于教育机会的公正分配问题尤为棘手。尽管发达社会向公民免费提供一些教育，但教育经费始终与为公民提供其他社会物品的需要相竞争。正如艾米·古特曼（Amy Gutmann）所写：“以教育来最大化儿童人生际遇的代价，将是放弃这些其他社会物品”（Gutmann 1999: 129）[^gutmann-1999]。其他基本福利需要（如住房、医疗、食物）以及文化物品（如博物馆、公园、音乐厅），都必须与分配给教育的公共资金相权衡，从而使高质量教育——即便在高度生产性的社会中——在某种程度上变得稀缺。
    step2: |-
      鉴于分配给教育的资源有限，关于教育机会的公正分配问题就显得尤为棘手。尽管发达社会向公民免费提供一些教育，但教育经费始终要与为公民提供其他社会物品的需要相竞争。正如艾米·古特曼（Amy Gutmann）所写：“以教育来最大化儿童人生际遇的代价，将是放弃这些其他社会物品”（Gutmann 1999: 129）[^gutmann-1999]。其他基本福利需要（如住房、医疗、食物）以及文化物品（如博物馆、公园、音乐厅），都必须与拨给教育的公共资金相权衡，这使得高质量教育——即便在高度生产性的社会中——也在一定程度上变得稀缺。
