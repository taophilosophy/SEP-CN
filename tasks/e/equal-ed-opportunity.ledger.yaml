      There are several possible approaches to the conflict between equal educational opportunity and the family. One approach subordinates our concern for equality of educational opportunity to our concern with the family. To support this view we might try to argue that the goods of family life are especially weighty, or, that as a matter of value pluralism, the state cannot impose complete uniformity on childrearing practices. Conversely, we could subordinate our concern for the family to our concern with equality of educational opportunity. If this were to happen, however, we could end up abolishing the family as we know it, since the family and partiality run contrary to equal opportunity. One cannot, it seems, have the family and have perfect equality of opportunity. Plato famously advocated raising children in common within communities in *The Republic* (though not out of concern for equality). But most philosophers, including Rawls, believe that abolishing the family is far too high a price to pay for equality (this is discussed in Munoz-Dardé 1999; Brighouse & Swift 2009; Schoeman 1980; Schrag 1976; see also Miller 2009 on different conceptions of equality of opportunity and how the family fits within them)[^brighouse-2009][^miller-2009][^munoz-dardé-1999][^schoeman-1980][^schrag-1976].
    step1: |-
      对于平等教育机会与家庭之间的冲突，有几种可能的进路。一种进路，是把我们对教育机会均等的关切置于对家庭的关切之下。为支持这一观点，我们或许会主张，家庭生活的善尤其沉重，或者，作为价值多元主义问题，国家不能对养育实践强加完全的统一。反之，我们也可以把对家庭的关切置于对教育机会均等的关切之下。然而，若如此，我们最终可能会废除我们所知的家庭，因为家庭与偏私有悖于机会均等。人们似乎不能既拥有家庭，又拥有完美的机会均等。柏拉图在《理想国》中著名地主张国策——在社群内共同养育儿童（尽管并非出于对平等的关切）。但大多数哲学家，包括罗尔斯，相信废除家庭是为一等化所付出的过高代价（此点在 Munoz-Dardé 1999; Brighouse & Swift 2009; Schoeman 1980; Schrag 1976 中讨论；另见 Miller 2009 关于机会均等的不同观念以及家庭如何嵌入其中）[^brighouse-2009][^miller-2009][^munoz-dardé-1999][^schoeman-1980][^schrag-1976]。
