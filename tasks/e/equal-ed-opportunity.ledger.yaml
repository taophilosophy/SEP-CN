      The United States Supreme Court’s *Brown v. Board of Education* (1954) decision, in finding racially segregated public schools unconstitutional, declared that the opportunity for an education, when provided for by the state, is a “right which must be available to all on equal terms”. But *de facto* racial segregation persists in the U.S. and is coupled today with ever-growing class-based segregation (Reardon & Bischoff 2011)[^reardon-2011][^reardon-2011-2]. Black students are far more likely to attend high-poverty schools than their white peers (see school poverty, in the National Equity Atlas, Other Internet Resources). The resulting, compounded educational disadvantages that poor, minority children face in the U.S. are significant. As research continues to document, the racial/ethnic achievement gap is persistent and large in the U.S. and has lasting labor market effects, whereby the achievement gap has been found to explain a significant part of racial/ethnic income disparities (Reardon, Robinson-Cimpian, & Weathers 2015; Reardon 2021 in Other Internet Resources).
