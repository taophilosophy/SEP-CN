      Meritocratic equality of opportunity has well-known limitations, especially with respect to children. If educational opportunities should be given to those who have the most merit in terms of the best scores on entrance tests, we will overlook the fact that merit is endogenous to education, which is to say, educational opportunity itself creates merit (Satz 2007)[^satz-2007]. The more educational opportunities an individual child has, the more “merit” that child may come to have. This might suggest that we should pay more attention to individuals’ underlying potential rather than to their assessed merit. Yet few people believe that we should give opportunities to those who have the most underlying but uncultivated ability at the expense of those who have less underlying ability or who are less qualified but have worked hard (Miller 1996)[^miller-1996].
    step1: |-
      精英主义机会均等有其众所周知的局限，尤其就儿童而言。如果教育机会应当给予那些在入学考试中成绩最好、即才能最高的人，我们将忽视这样一个事实：才能对教育而言是内生的，也就是说，教育机会本身创造才能（Satz 2007）[^satz-2007]。一个儿童所拥有的教育机会越多，该儿童可能拥有的“才能”就越多。这可能提示我们，应当更关注个人的潜在能力，而非其被评估的才能。然而，很少有人相信，我们应当把机会给予那些拥有最多潜在却未加培养的能力的人，而牺牲那些潜在能力较少、或资质较逊却用功努力的人（Miller 1996）[^miller-1996]。
