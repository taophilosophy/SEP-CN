      In *A Theory of Justice*, Rawls accords the fair equality of opportunity principle priority over access to other types of advantages such as income and wealth. Disputing this priority, some have argued that the opportunities that FEO regulates are not more important than these other goods and that we should prefer a principle (known, for example, in Rawls’ work as the difference principle) that ensures that the least advantaged are as well-off as possible in terms of income (or according to some critics, well-being) (Alexander 1985; Arneson 1999; Clayton 2001; Miklosi 2010)[^alexander-1985][^arneson-1999][^clayton-2001][^miklosi-2010]. Richard Arneson presses this complaint forcefully in his paper “Against Rawlsian Equality of Opportunity”. Rawls’ argument for FEO over the difference principle comes from a commitment to individuals’ self-respect and the contribution that the ability to compete for offices and social positions on fair terms make to that self-respect. But Arneson argues that those among us with lesser capacities might reasonably reject according such weight to the self-respect of the talented. After all, the self-respect derived from the results of a “natural lottery” is unequally distributed. The untalented among us, Arneson argues, would prefer increases in well-being to a principle of self-respect that confers no benefit to them.
