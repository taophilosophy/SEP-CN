      It is widely accepted that educational opportunities for children ought to be equal. This thesis follows from two observations about education and children: first, that education significantly influences a person’s life chances in terms of labor market success, preparation for democratic citizenship, and general human flourishing; and second, that children’s life chances should not be fixed by certain morally arbitrary circumstances of their birth such as their social class, race, and gender. But the precise meaning of, and implications for, the ideal of equality of educational opportunity is the subject of substantial disagreement (see Jencks 1988)[^jencks-1988]. This entry provides a critical review of the nature and basis of those disagreements.
    step1: |-
      人们普遍接受，儿童的教育机会应当是平等的。这一主张源自关于教育与儿童的两点观察：其一，教育显著影响一个人的人生际遇，涉及劳动力市场的成功、民主公民身份的准备以及总体的人生繁荣；其二，儿童的人生际遇不应由其出生时某些道德上任意的境况所决定，例如其社会阶级、种族与性别。然而，教育机会均等这一理想的精确含义及其蕴含，乃是大量争议的主题（参见 Jencks 1988）[^jencks-1988]。本词条对上述争议的性质与根据作批判性评述。
    step2: |-
      人们普遍认为，儿童的教育机会应当平等。这一主张来自关于教育与儿童的两点观察：其一，教育深刻影响一个人的人生际遇——关系到劳动力市场中的成功、民主公民身份的准备以及整体的人生繁荣；其二，儿童的人生际遇不应由其出生时某些道德上任意的境况所决定，诸如其社会阶级、种族与性别。然而，教育机会均等这一理想的精确含义及其所蕴含的后果，却引起大量争议（参见 Jencks 1988）[^jencks-1988]。本词条对这些争议的性质与根据作批判性评述。
