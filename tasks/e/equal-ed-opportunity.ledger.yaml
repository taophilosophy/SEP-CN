      Additionally, formal equality of educational opportunity is not concerned with the informal rules, social norms, or private discrimination that people in a society face that can have a profound effect on a child’s opportunities for education. Consider that formal equality of opportunity is compatible with school segregation, if school attendance zones were determined by residence and residence were segregated by race and social class (as is typically the case in the U.S.). If integration is a moral imperative, formal equality of opportunity cannot achieve this goal (Anderson 2010)[^anderson-2010]. Many people believe that insofar as informal discrimination is an unfair obstacle to educational opportunity, it is a serious problem that requires policy attention.
