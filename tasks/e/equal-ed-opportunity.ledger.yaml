      Given the judicial retreat from remedying *de facto* segregation, many advocates have shifted their attention to the school finance system. A landmark U.S. Supreme Court decision in this arena was an initial setback to efforts to advance educational equality via federal school finance litigation. In this case, *San Antonio Independent School District v. Rodriguez* (1973), the Court found that there is no federal right to education, and that funding inequalities among school districts due to variations in property tax revenue are not unconstitutional. This decision further entrenched the educational inequalities that follow from the geographic happenstance of a child’s home. In contrast to the U.S., many other countries do not finance their schools through local property taxes (e.g., Finland funds its schools at the national level based on the number of students they educate, and it provides more funding to schools that educate more students who are immigrants or whose parents are unemployed or uneducated; Sahlberg 2011)[^sahlberg-2011]. Many other societies distribute educational resources in a more centralized way than does the United States, which leaves educational funding, and even educational standards, to a large extent in local hands (for a recent volume on the idea of a federal right to education in the U.S., see Robinson 2019)[^robinson-2019].
    step1: |-
      鉴于司法从纠正*事实上*隔离中退却，许多倡导者将注意力转向学校资助制度。在此领域，一项里程碑式的美国最高法院裁决，是经由联邦学校资助诉讼推进教育平等的努力所遭遇的初步挫折。在该案*圣安东尼奥独立学区诉罗德里格斯案*（1973）中，最高法院认定：不存在联邦层面的受教育权，且因财产税收入差异而导致的学区之间经费不平等并不违宪。这一裁决进一步固化了因儿童家庭所在地的地理偶然性而来的教育不平等。与美国不同，许多其他国家并非通过地方财产税资助学校（例如，芬兰在国家层面依据学校培养学生人数来资助学校，并为教育更多移民学生或父母失业、未受教育学生的学校提供更多经费；Sahlberg 2011）[^sahlberg-2011]。许多其他社会以比美国更集中的方式分配教育资源，而美国将教育经费、甚至教育标准在很大程度上留在地方手中（关于美国联邦受教育权理念的近期文集，见 Robinson 2019）[^robinson-2019]。
