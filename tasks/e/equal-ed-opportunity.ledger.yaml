      为了说明精英主义平等教育机会观念的第二个局限，设想所有高选拔性大学的学额都已通过裙带关系授予上层阶级成员，而一个进步的新政府突然当选执政，以推行精英主义的招生。在数代人于损害穷人利益的基础上巩固了优越教育、工作与财富之后，上层阶级处于远为有利的地位——尤其是若可得私立教育——来确保其子女最终成为最有才能者，从而在不同阶级成员之间维系巨大的社会不平等。尽管有些机会对所有人平等开放，但发展“才能”的机会却并非平等分配（Williams 1962）[^williams-1962]。培养才能机会的代际传递，将产生一个深度分裂且不平等的社会，这与教育机会均等的理想相悖。
