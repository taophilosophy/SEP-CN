      However one interprets equality of educational of opportunity, a number of important challenges face anyone who believes that the ideal is a crucial component of a fair and just society. Several of these challenges are philosophical in nature. For instance, one can ask whether certain values (e.g., respecting family autonomy) compete with the demands of equality of opportunity in education in ways that trump or are trumped by concerns about educational equality. One can also ask whether equal educational opportunity requires affirmative action, and what it may require for students with disabilities and special educational needs. One can accept equality of educational opportunity with respect to some goods and adequacy of educational opportunity with respect to others (Callan 2016)[^callan-2016]. There are other challenges that are not philosophical but practical, such as how we can convince policymakers to allocate sufficient funds to meet students’ educational needs, and how we might increase public support for the ideal of equality of educational opportunity more generally.
