      无论人们相信公民教育恰当的scope与内容为何，一个紧迫的问题是：学生获得为其参与性公民身份做准备的教育机会的机会极不均匀。梅拉·莱文森（Meira Levinson）关于“公民成就差距”的研究，凸显了这一与讨论更多的成就差距相关的推论，并强调了学生群体之间在青年人对政府运作方式了解多少、以及他们有效参与公民生活的能力方面存在的巨大不平等（Levinson 2012）[^levin-2012][^levinson-2012]。这些低参与率与低投入率，也对穷人的利益如何被对待产生影响。的确，即使人们在这一领域拒绝机会均等，仍有充分证据表明，许多社会在使较贫困、受教育较少的公民有效而胜任地参与公共生活方面做得不够。
