      In terms of education, rather than ensuring that those with the same inborn talent potential and ambition have the same level of educational achievement, Arneson would emphasize that educational opportunities should aim at promoting the welfare of the least advantaged. This is more important, as he sees it, than ensuring that future competitions for jobs are fairly structured. But Rawls and his defenders have argued that wealth and welfare are different in kind from the goods that FEO regulates, and that FEO pertains to more important goods that are closely connected to autonomy, the social bases of self-respect, and what he calls the two moral powers. This explains their priority and irreducibility (Taylor 2004; Shields 2015; Shiffrin 2004)[^shields-2015][^shiffrin-2004][^taylor-2004]. Further, if everyone had a decent minimum, then the additional contribution of wealth to well-being is less significant. In subsequent work however, Rawls does acknowledge that the priority of FEO over his difference principle may be less stringent than he thought.
