      As applied to educational opportunity, formal equality of opportunity requires the removal of formal obstacles, in the form of laws or entrance criteria for educational institutions, which refer to ascriptive characteristics. For instance, formal equality of opportunity is opposed to legally segregated schools whose admissions policy states that students be white, male or belong to a certain religion. This conception is likewise opposed to laws that endorse or require segregation in schools. The *Brown* decision is certainly consistent with at least formal equality of opportunity. At the same time, it is worth noting that formal equality of opportunity is at odds with the tolerant attitude many societies take toward schools and colleges that are segregated by sex and religion. One possible way in which these practices might be reconciled with formal equality of educational opportunity would be to argue that this principle applies only to public educational institutions and not private schools and colleges. Some people accept that formal equality of opportunity is a sufficient norm to guide the distribution of educational opportunities, but most political and moral philosophers accept it as necessary but not sufficient. A principle of non-discrimination leaves open whether and to what extent the state needs to provide the resources that are required for education, or how those resources should be distributed (see Gutmann 1999: 127ff)[^gutmann-1999]. Since resources are necessary for education—whether in the form of books and materials, teachers, facilities, and so on—formal equality of opportunity is compatible with some children failing to actually receive an education. Formal equality of opportunity fails to provide effective equality of opportunity.
    step1: |-
      就教育机会而言，形式机会均等要求移除那些以法律或教育机构入学标准形式存在、且提及归因性特征的形式障碍。例如，形式机会均等反对依法隔离的学校——其招生政策规定学生须为白人、男性或属于某一宗教。这一观念同样反对认可或要求学校隔离的法律。*布朗*案至少与形式机会均等相一致。同时，值得注意的是，形式机会均等与许多社会对按性别和宗教隔离的学校与学院所持的宽容态度相抵触。使这些做法与教育机会均等相调和的一个可能方式，是主张这一原则仅适用于公立教育机构，而不适用于私立学校与学院。有些人接受形式机会均等是指导教育机会分配的充分规范，但大多数政治与道德哲学家只把它视为必要条件而非充分条件。一项不歧视原则留下如下问题未决：国家是否以及任何种程度上需要提供教育所需的资源，或这些资源应如何分配（见 Gutmann 1999: 127ff）[^gutmann-1999]。由于资源对教育是必要的——无论是书籍和材料、教师、设施等形式——形式机会均等与一些儿童实际未能接受教育是相容的。形式机会均等未能提供有效的机会均等。
