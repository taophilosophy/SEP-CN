      因此，劳里看到高等教育中优惠性政策的作用，它将使我们从像*A*这样的社会走向像*B*这样的社会。与高等教育和机会均等相关的较有争议的改革之一是平权行动，它为历史上被边缘化的群体保留优惠待遇。平权行动受到那些认为才能——而非种族或阶级——应当是选拔大学申请者的唯一标准的人的批评。另一些人则主张，它可能导致对就读大学的边缘化群体成员的无意污名化，被视为不配其位置。然而，这是忘记了发展才能的机会本身在历史上就在群体之间不公平地分配。尽管有这一回应，平权行动仍是对一个非常棘手的社会问题的一种有争议的回应（Guinier 2016）[^guinier-2016]。
