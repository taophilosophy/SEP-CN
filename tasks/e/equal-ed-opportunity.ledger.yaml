      Another dimension of ongoing debates about equality in the realm of civic education concerns the scope of the community for which we are educating students to become members. Is the right unit of analysis a particular nation state or the global community? If it is a particular nation state, how can we cultivate in students a sense of their national identity and the disposition to respect their state’s institutions and laws (and to advocate reform when needed), while also making them sensitive to what they owe non-citizens as a matter of justice? A key component of this debate is whether students should receive a patriotic civic education—that is, one that prioritizes shoring up their allegiance to their state over their capacity to reflect critically upon its potential shortcomings. Galston (1989) has notably argued that students need a civic education that is more rhetorical than rational, while a number of liberal theorists have criticized his view on grounds of democratic legitimacy, its status-quo bias, and the related possibility of ossifying existing inequalities (e.g., Brighouse 1998; Callan 1997; see also the related entry on civic education)[^brighouse-1998][^callan-1997]. On the other hand, if we instead have a cosmopolitan view of civic education and aim to cultivate “citizens of the world” (e.g., Nussbaum & Cohen 1996)[^nussbaum-1996], what are the relevant capacities that need to be made effective? There is no world state for students to participate in.
    step1: |-
      关于公民教育领域平等的持续争论的另一个维度，涉及我们教育学生所要成为其成员的那个共同体的范围。恰当的分析单位是某一特定民族国家，还是全球共同体？如果它是某一特定民族国家，我们如何培养学生对其民族认同的感知，以及尊重其国家制度与法律（并在必要时倡导改革）的倾向，同时使他们敏锐意识到，作为正义问题，他们对非公民所欠为何？这一争论的一个关键组成部分，是学生是否应当接受爱国主义公民教育——即那种优先巩固其对国家的忠诚、而非批判性反思其潜在缺陷之能力的教育。加尔维斯顿（Galston，1989）显著地主张，学生需要一种重修辞甚于理性的公民教育，而许多自由理论家则基于民主正当性、其现状偏见、以及相关的固化既有不平等的可能性，批评他的观点（例如 Brighouse 1998; Callan 1997; 另见公民教育相关词条）[^brighouse-1998][^callan-1997]。另一方面，如果我们转而采取世界主义的公民教育观，旨在培养“世界公民”（例如 Nussbaum & Cohen 1996）[^nussbaum-1996]，那么哪些相关能力需要被有效化？没有世界国家供学生参与。
