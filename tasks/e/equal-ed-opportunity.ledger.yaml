      Efforts to combat *de facto* segregation have been limited by U.S. jurisprudence since the *Brown* decision. Although the Supreme Court previously allowed plans to integrate schools within a particular school district (see *Swann v. Charlotte-Mecklenburg Board of Education*, 1970), in *Milliken v. Bradley* (1974) the Court struck down an inter-district busing plan that moved students across district lines to desegregate the Detroit city and surrounding suburban schools. This limitation on legal remedies for *de facto* segregation has significantly hampered integration efforts given that most school districts in the U.S. are not racially diverse. More recently, the U.S. Supreme Court further curtailed integration efforts within the small number of districts that are racially diverse. In its *Parents Involved in Community Schools v. Seattle School District* decision (2006), the Court prohibited districts from explicitly using individual students’ race as a factor in school assignment plans, thereby condoning only race-neutral integration plans in what many regarded as the Court’s final retreat from redressing *de facto* segregation (e.g., Rebell 2009; Ryan 2007)[^rebell-2009][^ryan-2007].
    step1: |-
      自*布朗*案以来，美国判例法限制了应对*事实上*隔离的努力。尽管最高法院此前允许在特定学区内推行学校融合计划（见*斯旺诉夏洛特-梅克伦堡教育委员会案*，1970），但在*米利肯诉布拉德利案*（1974）中，最高法院推翻了一项跨学区校车计划，该计划让学生跨学区流动以消除底特律市区及周边郊区学校的种族隔离。鉴于美国大多数学区并非种族多元，这种对*事实上*隔离法律救济的限制严重阻碍了融合努力。更近期，美国最高法院进一步限制了少数种族多元学区内的融合努力。在其*家长参与社区学校诉西雅图学区案*（2006）裁决中，最高法院禁止学区在学校分配计划中明确使用个别学生的种族作为考量因素，从而仅认可种族中立的融合计划——在许多人心目中，这是最高法院对纠正*事实上*隔离的最终退却（例如 Rebell 2009; Ryan 2007）[^rebell-2009][^ryan-2007]。
