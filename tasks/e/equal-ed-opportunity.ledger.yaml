      Alternatively, we might think that some careful weighing of the values at stake is required. For instance, we might think that only some of the demands of familial partiality, those related to intimacy such as reading bedtime stories, are sufficient to outweigh concern for equality of educational opportunity. Other aspects of familial partiality that appear to be unconnected to intimacy, such as paying tuition for private schools, would not be justified. This view would enjoin us to equalize children’s educational opportunities whenever we can, without sacrificing the goods central to the family (Brighouse & Swift 2014)[^brighouse-2014]. Yet it can be very difficult in practice to determine whether an advantage parents provide their child is constitutive of the family or not.
