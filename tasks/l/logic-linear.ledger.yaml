      If one uses traditional sequent calculus presentations, the exponentials are not canonical in the following sense: if you introduce another copy of exponentials, say $\bang'$ and $\quest'$, with the same rules as the original ones, there is no way to prove that $\bang$ is equivalent to $\bang'$, and $\quest$ to $\quest'$, while for the other connectives this is easily established. Various applications of non-canonical exponentials can be found in (Danos et. al., 1993; Nigam & Miller, 2009). Although the decidability of MELL is currently being debated (Bimbó 2015, Straßburger 2019)[^bimbó-2015][^straßburger-2019], extending MLL with three pairs of $\bang$ and $\quest$ yields a logic that is undecidable (Chaudhuri 2018)[^chaudhuri-2018]. Martini and Masini 1995 describe a “2-sequent” proof system in which the exponentials are canonical.
    step1: |-
      若采用传统矢列演算表述，指数在下述意义上不是典范的：若你引入另一份指数，比如 $\bang'$ 与 $\quest'$，其规则与原指数相同，却无法证明 $\bang$ 等价于 $\bang'$、$\quest$ 等价于 $\quest'$；而对其他联结词，这一点却容易建立。非典范指数的各种应用见（Danos et. al., 1993; Nigam & Miller, 2009）。尽管 MELL 的可判定性目前尚有争议（Bimbó 2015, Straßburger 2019）[^bimbó-2015][^straßburger-2019]，把 MLL 用三对 $\bang$ 与 $\quest$ 扩展，所得逻辑不可判定（Chaudhuri 2018）[^chaudhuri-2018]。Martini 与 Masini 1995 描述了一种“2-矢列”证明系统，其中指数是典范的。
    step2: |-
      传统矢列演算表述里，指数不是典范的：再引入一份规则相同的指数，比如 $\bang'$ 与 $\quest'$，竟无法证明 $\bang$ 等价于 $\bang'$、$\quest$ 等价于 $\quest'$；别的联结词则容易做到。非典范指数的应用见（Danos et. al., 1993; Nigam & Miller, 2009）。MELL 可判定性眼下还有争议（Bimbó 2015, Straßburger 2019）[^bimbó-2015][^straßburger-2019]，但把 MLL 用三对 $\bang$、$\quest$ 扩展，所得逻辑不可判定（Chaudhuri 2018）[^chaudhuri-2018]。Martini 与 Masini 1995 描述了一种“2-矢列”证明系统，其中指数是典范的。
