      ### 6.3 Treatment of unbounded behavior
    step1: |-
      ### 6.3 无界行为的处理
    step2: |-
      ### 6.3 无界行为的处理
  - id: 112
    kind: body
    source: |-
      While the MALL logic is an expressive and novel logic, it is also decidable and, thus, not capable of capturing the unbounded behaviors found in, say, iteration and recursion. As described above, the addition of the exponentials ! and ? enriches MALL to full linear logic and to a setting where unbounded behaviors can be captured. A second approach to extending MALL to capture unbounded behaviors involves the addition of the least and greatest fixed point operators as logical connectives directly into MALL. In order to properly characterize fixed points as being either the least or the greatest, it is necessary for the inference rules for fixed points to be “higher-order” in the sense that they involve invariants. Such an extension to MALL (also with first-order quantification and term equality) has been developed by Baelde (Baelde & Miller, 2007; Baelde 2012)[^baelde-2012] and has been used to provide a proof-theoretic foundation for model checking (Heath & Miller 2018)[^heath-2018].
    step1: |-
      MALL 逻辑虽有表达力、有新意，却也可判定，因此无法刻画诸如迭代与递归中出现的无界行为。如上所述，加入指数 ! 与 ? 把 MALL 丰富为完全线性逻辑，进入能刻画无界行为的境地。扩展 MALL 以刻画无界行为的第二条进路，是把最小与最大不动点算子作为逻辑联结词直接加入 MALL。为正确刻画不动点是“最小”还是“最大”，不动点的推理规则必须是“高阶”的，即涉及不变量。Baelde（Baelde & Miller, 2007; Baelde 2012）[^baelde-2012] 发展出对 MALL 的这种扩展（还带一阶量化与词项相等），并用来为模型检验提供证明论基础（Heath & Miller 2018）[^heath-2018]。
    step2: |-
      MALL 有表达力、有新意，却可判定，因而刻画不了迭代、递归里的无界行为。如上所述，加入指数 ! 与 ? 可把 MALL 丰富成完全线性逻辑，进入能刻画无界行为的境地。另一条路，是把最小、最大不动点算子直接作为联结词加进 MALL。要让不动点确为“最小”或“最大”，其推理规则须是“高阶”的，即涉及不变量。Baelde（Baelde & Miller, 2007; Baelde 2012）[^baelde-2012] 发展出对 MALL 的这类扩展（还带一阶量化与词项相等），并用来为模型检验提供证明论基础（Heath & Miller 2018）[^heath-2018]。
