      The area of semantics that has developed around so-called *game semantics* deserves special attention. The strong connection between games and linear logic was pointed out quite early by A. Blass (1992). In fact, there are two different traditions to connecting logic to games. In the tradition of *dialog games* dating back to Lorenzen, one player attempts to prove a formula while a second player attempts to refute it. It is possible to provide MALL with such a dialog game that is completely symmetric for both the prover and the refuter (Delande *et al*. 2010)[^delande-2010]. In another tradition, formulas are interpreted as games, logical connectives as game constructors, and proofs as strategies that describe how a player reacts to opponent moves. By imposing different restrictions on the rules of the game, one can actually provide a precise semantics (technically, a fully abstract model) for various features of actual programming languages, hence the huge interest in this area over the past years. See, for example, Abramsky & Jagadeesan 1994, Abramsky & Melliès 1999, and Hyland & Ong 2000.
    step1: |-
      围绕所谓 *博弈语义* 发展起来的语义学领域值得特别注意。博弈与线性逻辑之间的强联系，A. Blass（1992）很早指出。其实把逻辑与博弈联系起来有两个不同传统。一是可追溯到 Lorenzen 的 *对话博弈* 传统：一方试图证明某公式，另一方试图反驳。可以为 MALL 提供这样一种对话博弈，它对证明者与反驳者完全对称（Delande *et al.* 2010）[^delande-2010]。另一传统把公式解释为博弈、逻辑联结词解释为博弈构造子、证明解释为描述玩家如何应对对手着法的策略。对博弈规则施加不同限制，其实可以为实际编程语言的种种特性提供精确语义（技术上即完全抽象模型），故这一领域近年备受瞩目。例如见 Abramsky & Jagadeesan 1994、Abramsky & Melliès 1999、Hyland & Ong 2000。
    step2: |-
      围绕 **博弈语义** 发展起来的领域值得单说。博弈与线性逻辑的强联系，A. Blass（1992）很早就指出。连接逻辑与博弈其实有两个传统。一是上溯到 Lorenzen 的 **对话博弈**：一方证明公式，另一方反驳。可为 MALL 提供这样的对话博弈，证明者与反驳者完全对称（Delande *et al.* 2010）[^delande-2010]。另一传统把公式看作博弈、联结词看作博弈构造子、证明看作策略，描述玩家如何应对对手着法。对博弈规则施加不同限制，就能为实际编程语言的种种特性给出精确语义（技术上即完全抽象模型），故而近年此领域热度极高，例如见 Abramsky & Jagadeesan 1994、Abramsky & Melliès 1999、Hyland & Ong 2000。
