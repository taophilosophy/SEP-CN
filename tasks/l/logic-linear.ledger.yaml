      One approach to attempting a sound and complete semantics for fragments of linear logic associates to a formula the set of all contexts that can be used to prove that formula. Of course, such a collection may need to be more abstract and to be given various closure properties. The *phase semantics* of Girard (1987) provides one such semantics: some uses of such semantics have been made in computer science to provide counterexamples and as a tool that can help establish that a given concurrent system cannot evolve into another with certain properties (Fages *et al*. 2001)[^fages-2001]. Phase semantics have also been used to give semantic proofs of cut elimination for both first-order and higher-order versions of linear logic (Okada 1999)[^okada-1999]. Similarly, Kripke-style semantics have been provided in Allwein & Dunn 1993 and Hodas & Miller 1994. Quantales, which are certain kind of partially ordered algebraic structures, have also been used to provide semantic models for parts of linear logic early on (Yetter 1990)[^yetter-1990].
    step1: |-
      为线性逻辑片段寻求可靠且完全语义的一种进路，是给公式配上一切可用于证明该公式的语境之集。当然，这样的集可能得更抽象，还得赋予各种闭包性质。Girard（1987）的 *相语义*（phase semantics）就是这种语义：计算机科学中已用这类语义构造反例，并用作工具来帮助证明某个并发系统不可能演化成具有某些性质的另一系统（Fages *et al.* 2001）[^fages-2001]。相语义也被用来给线性逻辑一阶与高阶版本的切消除作语义证明（Okada 1999）[^okada-1999]。类似地，Kripke 式语义见 Allwein & Dunn 1993 与 Hodas & Miller 1994。Quantale（某种偏序代数结构）也早已被用来为线性逻辑的部分内容提供语义模型（Yetter 1990）[^yetter-1990]。
    step2: |-
      为线性逻辑片段求可靠且完全的语义，一条进路是给公式配上一切能证明它的语境之集。这样的集往往更抽象，还要带各种闭包性质。Girard（1987）的 **相语义**（phase semantics）即是一例：计算机科学里用它造反例，也用它当工具，证明某并发系统无法演化成具备某些性质的另一系统（Fages *et al.* 2001）[^fages-2001]。相语义还用于给一阶、高阶线性逻辑的切消除作语义证明（Okada 1999）[^okada-1999]。类似地，Kripke 式语义见 Allwein & Dunn 1993、Hodas & Miller 1994。Quantale（一类偏序代数结构）也早就用来为线性逻辑的部分内容提供语义模型（Yetter 1990）[^yetter-1990]。
