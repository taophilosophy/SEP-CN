      Indeed, one could present a fragment of linear logic, known as *multiplicative additive linear logic* (MALL), as the outcome of two simple observations.
    step1: |-
      的确，可以把线性逻辑的一个片段——所谓 *乘法加性线性逻辑*（MALL）——呈现为两条简单观察的结果。
    step2: |-
      确实，线性逻辑有个片段叫 **乘法加性线性逻辑**（MALL），可以看成两条简单观察的产物。
  - id: 6
    kind: body
    source: |-
      - In the sequent calculus presentation of classical logic, the rules for the connectives “*and*” and “*or*”, as well as the Cut rule and the rule for implication may be presented equivalently in an additive form (the context of the premises are the same) or a multiplicative form (the context of the premises are different). These two presentations are equivalent, in classical logic, because of the availability of a few so-called “structural” rules, namely, contraction and weakening.
      - Gentzen's use of the sequent calculus to capture proofs for both classical and intuitionistic logics demonstrated that non-constructive proofs made use of one or the other of these structural rules in the conclusion (succedent) of sequents.
    step1: |-
      - 在经典逻辑的矢列演算表述中，联结词“*与*”“*或*”的规则，以及切规则与蕴涵规则，都可以等价地写成加性形式（各前提的语境相同）或乘法形式（各前提的语境不同）。在经典逻辑中，这两种表述等价，因为有若干所谓“结构”规则可用，即收缩与弱化。
      - Gentzen 用矢列演算同时刻画经典逻辑与直觉主义逻辑的证明，表明非构造性证明会在矢列的结论（后件）中用到这两条结构规则之一。
    step2: |-
      - 经典逻辑的矢列演算里，联结词“**与**”“**或**”的规则，以及切规则、蕴涵规则，都能等价地写成加性形式（各前提语境相同）或乘法形式（各前提语境不同）。经典逻辑中两者等价，靠的是几条所谓“结构”规则，即收缩与弱化。
      - Gentzen 用矢列演算同时刻画经典逻辑与直觉主义逻辑的证明，表明非构造性证明总要在矢列结论（后件）里用到这两条结构规则之一。
  - id: 7
    kind: body
    source: |-
      So, if we want to eliminate the non-constructive proofs without destroying the symmetry of the sequent calculus, as is done in intuitionistic logic, we can try to eliminate the contraction and weakening rules instead. In doing so, we are left with two different versions of each connective: an additive version and a multiplicative version of conjunction and of disjunction. These different versions of the same connecitve are now no longer equivalent. These new connectives are & (“with”, additive *and*), $\oplus$ (“plus”, additive *or*), $\otimes$ (“tensor”, multiplicative *and*) and $\lpar$ (“par”, multiplicative *or*).
    step1: |-
      所以，若想在不破坏矢列演算对称性的前提下消除非构造性证明（直觉主义逻辑正是这样做的），我们可以试着反过来消除收缩与弱化规则。这样一来，每个联结词就剩下两个不同版本：合取的加性版本与乘法版本，析取的加性版本与乘法版本。同一联结词的不同版本此时不再等价。这些新联结词是 &（“with”，加性 *与*）、$\oplus$（“plus”，加性 *或*）、$\otimes$（“tensor”，乘法 *与*）与 $\lpar$（“par”，乘法 *或*）。
    step2: |-
      于是，若要在不破坏矢列对称性的前提下消除非构造性证明（直觉主义逻辑就是这样做的），不妨反过来消除收缩与弱化。这样每个联结词都一分为二：合取、析取各有加性版与乘法版。同一联结词的两个版本此时不再等价。新联结词是 &（“with”，加性 **与**）、$\oplus$（“plus”，加性 **或**）、$\otimes$（“tensor”，乘法 **与**）与 $\lpar$（“par”，乘法 **或**）。
  - id: 8
    kind: body
    source: |-
      This duplication of the connectives actually leads to a much clearer understanding of the conflict between classical and intuitionistic logic. For example, the law of excluded middle ($A$ *or* not-$A$) is considered valid in the classical world and absurd in the intuitionistic one. But in linear logic, this law has two readings: the additive version $(A \oplus \neg A)$ is not provable and corresponds to the intuitionistic reading of disjunction; the multiplicative version $(A \lpar \neg A)$ is trivially provable and simply corresponds to the tautology $(A$ *implies* $A)$ that is perfectly acceptable in intuitionistic logic too.
    step1: |-
      联结词的这种复制，其实使人更清楚地理解经典逻辑与直觉主义逻辑的冲突。例如排中律（$A$ *或* 非-$A$）在经典世界被视为有效，在直觉主义世界则荒谬。但在线性逻辑中，这条定律有两种读法：加性版本 $(A \oplus \neg A)$ 不可证，对应析取的直觉主义读法；乘法版本 $(A \lpar \neg A)$ 平凡可证，只对应重言式 $(A$ *蕴涵* $A)$，而后者在直觉主义逻辑中也完全可以接受。
    step2: |-
      联结词的这番复制，反倒让人更看清经典逻辑与直觉主义逻辑的冲突。比如排中律（$A$ **或** 非-$A$），经典世界视为有效，直觉主义世界视为荒谬；线性逻辑里它有两种读法：加性版 $(A \oplus \neg A)$ 不可证，对应析取的直觉主义读法；乘法版 $(A \lpar \neg A)$ 平凡可证，只相当于重言式 $(A$ **蕴涵** $A)$，这在直觉主义逻辑里同样可以接受。
  - id: 9
    kind: body
    source: |-
      Also, the disjunction property, essential in constructivism, is easily established for the additive disjunction.
    step1: |-
      此外，对构造主义至关重要的析取性质，对加性析取很容易建立。
    step2: |-
      另外，构造主义所倚重的析取性质，对加性析取很容易证。
  - id: 10
    kind: body
    source: |-
      We find then inside this richer logic a way to represent both the needs of intuitionism and the elegance of classical logic: negation is involutive, sequents are symmetric, and connectives are inter-definable. Contrast these properties with those of intuitionistic logic, where negation is not involutive, sequents are not symmetric, and connectives $\neg, \wedge, \vee, \Rightarrow$ are all not inter-definable.
    step1: |-
      于是我们在这门更丰富的逻辑内部找到一种方式，既能表达直觉主义的需求，又能保留经典逻辑的优雅：否定对合、矢列对称、联结词互相可定义。把这些性质与直觉主义逻辑对照一下：在那里否定不对合、矢列不对称，联结词 $\neg, \wedge, \vee, \Rightarrow$ 也全都不能互相定义。
    step2: |-
      于是线性逻辑兼顾两头：直觉主义的需求、经典逻辑的优雅——否定对合、矢列对称、联结词互相可定义。不妨与直觉主义逻辑对照：那里否定不对合、矢列不对称，$\neg, \wedge, \vee, \Rightarrow$ 也全都不能互相定义。
  - id: 11
    kind: body
    source: |-
      Notice that once one has eliminated the contraction and weakening rules, formulas no longer behave as truth values. Indeed, if we compose a proof of $A \Rightarrow B$ and a proof of $A$ without these structural rules, we consume them to get a proof of $B$: that is, $A \Rightarrow B$ and $A$ are no longer available after the composition. Linear logic formulas behave more like *resources* that can only be used in restricted ways.
    step1: |-
      注意：一旦消除收缩与弱化规则，公式就不再像真值那样行事。的确，若没有这些结构规则，把 $A \Rightarrow B$ 的证明与 $A$ 的证明复合起来，就会把它们消耗掉，得到 $B$ 的证明；也就是说，复合之后 $A \Rightarrow B$ 与 $A$ 都不再可用。线性逻辑的公式更像 *资源*，只能以受限的方式使用。
    step2: |-
      注意：一消除收缩与弱化，公式就不再像真值那样行事。没有这两条结构规则，把 $A \Rightarrow B$ 的证明与 $A$ 的证明复合，二者就被消耗掉，换来 $B$ 的证明；也就是说，复合之后 $A \Rightarrow B$ 与 $A$ 都不复可用。线性逻辑的公式更像 **资源**，只能按受限的方式使用。
  - id: 12
    kind: body
    source: |-
      To recover the full expressive power of intuitionistic and classical logic, it is then necessary to add to the MALL fragment two dual modalities, which are usually called *exponentials* in the linear logic literature. In particular, the “of-course” exponential $\bang$ permits contraction and weakening to be applied to the formula $\bang B$ in the left-hand sequent context while the “why-not” exponential $\quest$ permits contraction and weakening to be applied to the formula $\quest B$ on the right-hand sequent context. This leads to the full propositional linear logic and to a very nice connection with computer science.
    step1: |-
      要恢复直觉主义逻辑与经典逻辑的全部表达力，就得给 MALL 片段添两个对偶模态词，线性逻辑文献通常称之为 *指数*（exponentials）。特别是，“of-course”指数 $\bang$ 允许收缩与弱化施用于左手语境中的公式 $\bang B$，而“why-not”指数 $\quest$ 允许收缩与弱化施用于右手语境中的公式 $\quest B$。由此得到完全的命题线性逻辑，并与计算机科学建立起非常漂亮的联系。
    step2: |-
      要找回直觉主义逻辑与经典逻辑的全部表达力，须给 MALL 片段加两个对偶模态词，线性逻辑文献通常称 **指数**（exponentials）。其中“of-course”指数 $\bang$ 允许对左手语境中的 $\bang B$ 施用收缩与弱化，“why-not”指数 $\quest$ 允许对右手语境中的 $\quest B$ 施用。由此得到完全的命题线性逻辑，并与计算机科学结下极漂亮的缘分。
  - id: 13
    kind: body
    source: |-
      Notice that besides MALL, there are two other widely used fragments of Linear Logic: Multiplicative Linear Logic (MLL), which is MALL without the additive connectives; and Multiplicative Exponential Linear Logic (MELL), which is Linear Logic without the additive connectives.
    step1: |-
      注意：除 MALL 外，线性逻辑还有两个广泛使用的片段：乘法线性逻辑（MLL），即去掉加性联结词的 MALL；以及乘法指数线性逻辑（MELL），即去掉加性联结词的线性逻辑。
    step2: |-
      注意：除 MALL 外，线性逻辑还有两个常用片段：乘法线性逻辑（MLL），即去掉加性联结词的 MALL；乘法指数线性逻辑（MELL），即去掉加性联结词的线性逻辑。
  - id: 14
    kind: body
    source: |-
      Gentzen's sequent calculus proof system for intuitionistic logic was the result of restricting his sequent calculus for classical logic so that all sequents contained at most one formula on the right-hand side of sequents (Gentzen 1935)[^gentzen-1935]. Such a single-conclusion restriction can also be explored in the context of linear logic. Various researchers have considered intuitionistic variants of MLL, MALL, and MELL: for example, IMLL (Lamarche 1996)[^lamarche-1996], IMALL (Lincoln *et al.* 1993)[^lincoln-1993], and IMELL (Dal Lago and Laurent 2008)[^dal-2008]. Schellinx (1991) provided some general conservativity results of classical linear logic over the corresponding intuitionistic variants: see also (Troelstra 1992)[^troelstra-1992].
    step1: |-
      Gentzen 为直觉主义逻辑建立的矢列演算证明系统，是把他的经典逻辑矢列演算限制为所有矢列右手侧至多含一个公式而得（Gentzen 1935）[^gentzen-1935]。这种单结论限制也可以在线性逻辑语境中探讨。多位研究者考虑过 MLL、MALL 与 MELL 的直觉主义变体：例如 IMLL（Lamarche 1996）[^lamarche-1996]、IMALL（Lincoln *et al.* 1993）[^lincoln-1993] 与 IMELL（Dal Lago 与 Laurent 2008）[^dal-2008]。Schellinx（1991）给出了一些关于经典线性逻辑相对于相应直觉主义变体的保守性结果：另见（Troelstra 1992）[^troelstra-1992]。
    step2: |-
      Gentzen 的直觉主义矢列演算，是把其经典矢列演算限制为右手侧至多一个公式而来（Gentzen 1935）[^gentzen-1935]。这种单结论限制也能在线性逻辑里探讨。多位研究者考察过 MLL、MALL、MELL 的直觉主义变体：IMLL（Lamarche 1996）[^lamarche-1996]、IMALL（Lincoln *et al.* 1993）[^lincoln-1993]、IMELL（Dal Lago 与 Laurent 2008）[^dal-2008]。Schellinx（1991）给出经典线性逻辑相对相应直觉主义变体的一些保守性结果，另见（Troelstra 1992）[^troelstra-1992]。
  - id: 15
    kind: body
    source: |-
      Prior to the introduction of linear logic in 1987, various researchers had been working on various kinds of substructural logic in which not all of Gentzen’s structural rules (contraction, weakening, and exchange) are accepted. Lambek studied a sequent calculus proof systems in which none of these structural rules were permitted (Lambek 1958)[^lambek-1958]. Other examples of such logics are relevant logic (in which weakening is not accepted) (Anderson & Belnap 1975, Anderson *et al.* 1992, Avron 1988, Read 1988)[^anderson-1975][^anderson-1975-2][^avron-1988][^read-1988]. and affine logic (in which contraction is not accepted) (Grishin 1981)[^grishin-1981].
    step1: |-
      1987 年线性逻辑问世之前，已有研究者在研究各种子结构逻辑：其中 Gentzen 的结构规则（收缩、弱化、交换）并非全部被接受。Lambek 研究过一种矢列演算证明系统，其中三条结构规则一概不许（Lambek 1958）[^lambek-1958]。这类逻辑的其他例子有相干逻辑（不接受弱化）（Anderson & Belnap 1975, Anderson *et al.* 1992, Avron 1988, Read 1988）[^anderson-1975][^anderson-1975-2][^avron-1988][^read-1988]，以及仿射逻辑（不接受收缩）（Grishin 1981）[^grishin-1981]。
    step2: |-
      1987 年线性逻辑问世之前，已有不少人在研究各种子结构逻辑：Gentzen 的结构规则（收缩、弱化、交换）并非全部接受。Lambek 研究过一种三条结构规则一概不许的矢列演算证明系统（Lambek 1958）[^lambek-1958]；其他例子有相干逻辑（不接受弱化）（Anderson & Belnap 1975, Anderson *et al.* 1992, Avron 1988, Read 1988）[^anderson-1975][^anderson-1975-2][^avron-1988][^read-1988]，以及仿射逻辑（不接受收缩）（Grishin 1981）[^grishin-1981]。
