  - id: 17
    kind: body
    source: |-
      The computer science exploitation of intuitionistic and constructive logic began when people saw the possibility of reading $A \Rightarrow B$ as ‘if you give me an $A$, I will give you a $B$’, which is a significant departure from the classical reading ‘$A$ is false or $B$ is true’.
    step1: |-
      直觉主义逻辑与构造性逻辑在计算机科学中的利用，始于人们看出可以把 $A \Rightarrow B$ 读作“你给我一个 $A$，我就给你一个 $B$”——这大大偏离了经典读法“$A$ 为假或 $B$ 为真”。
    step2: |-
      直觉主义逻辑与构造性逻辑在计算机科学里的用场，始于人们看出 $A \Rightarrow B$ 可读作“你给我一个 $A$，我就给你一个 $B$”，这与经典读法“$A$ 假或 $B$ 真”相去甚远。
  - id: 18
    kind: body
    source: |-
      Linear logic provides a further twist in the interpretation of the implication ‘$A \Rightarrow B$ ’: now it can be read as ‘give me *as many* $A$'s as I might need and I will give you *one* $B$’. The notion of *copy* which is so central to the idea of computation is now wired into the logic. This new viewpoint opens up new possibilities, including:
    step1: |-
      线性逻辑对蕴涵“$A \Rightarrow B$”的解释又转了一道弯：如今它可以读作“给我 *所需的任意多个* $A$，我就给你 *一个* $B$”。对计算观念如此核心的 *复制* 概念，如今被接进了逻辑。这一新视角开辟了新可能，包括：
    step2: |-
      线性逻辑对蕴涵“$A \Rightarrow B$”的解释又拐了个弯：现在可读作“给我 **所需数目的** $A$，我就给你 **一个** $B$”。计算观念里居于核心的 **复制** 概念，就此接进了逻辑。新视角开辟出新可能：
  - id: 19
    kind: body
    source: |-
      - *new formulas* expressing refined operational properties like ‘give me $A$ once and I will give you $B$’. Applications here range from refined logic programming where the ability of linear logic to represent states is put to use (Hodas & Miller, 1994), to the analysis of classical logic and computational interpretations thereof (Abramsky 1993)[^abramsky-1993], to the specification of exception mechanisms in programming languages (Miller, 1996), and to linearity analysis (Wadler, 1991).
      - *new rules* expressing constraints on the use of copies resulting in a fragment of linear logic for polytime computations to mention only the most spectacular application (Baillot & Terui, 2004, Baillot 2015)[^baillot-2015].
      - *new ways* of representing proofs (Abramsky & Jagadeesan, 1994, Girard 1987)[^girard-1987].
    step1: |-
      - *新公式*，表达更精细的操作性质，如“给我一次 $A$，我就给你 $B$”。其应用范围从精化的逻辑编程（利用线性逻辑表示状态的能力）（Hodas & Miller, 1994），到对经典逻辑及其计算解释的分析（Abramsky 1993）[^abramsky-1993]，到编程语言中异常机制的规格说明（Miller, 1996），再到线性分析（Wadler, 1991）。
      - *新规则*，表达对复制使用的约束，例如只举最惊人的应用：由此得到用于多项式时间计算的线性逻辑片段（Baillot & Terui, 2004, Baillot 2015）[^baillot-2015]。
      - *新方式*，用来表示证明（Abramsky & Jagadeesan, 1994, Girard 1987）[^girard-1987]。
    step2: |-
      - **新公式**，表达更精细的操作性质，如“给我一次 $A$，我就给你 $B$”。应用从精化的逻辑编程（用线性逻辑表示状态）（Hodas & Miller, 1994），到对经典逻辑及其计算解释的分析（Abramsky 1993）[^abramsky-1993]，到编程语言异常机制的规格说明（Miller, 1996），再到线性分析（Wadler, 1991）。
      - **新规则**，约束复制的使用，只举最惊人的应用：由此得到用于多项式时间计算的线性逻辑片段（Baillot & Terui, 2004, Baillot 2015）[^baillot-2015]。
      - **新方式**，用来表示证明（Abramsky & Jagadeesan, 1994, Girard 1987）[^girard-1987]。
