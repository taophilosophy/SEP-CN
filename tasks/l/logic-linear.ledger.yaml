      MELL is a surprisingly expressive logic. For example, the reachability problem in Petri nets can be encoded into MELL (Gunter & Gehlot 1989)[^gunter-1989] and that problem is equivalent to the reachability problem of vector addition systems with states (VASS) (Reutenauer 1989)[^reutenauer-1989]. Furthermore, the decidability problem of MELL is equivalent to the reachability problem for branching VASS (de Groote *et al*. 2004)[^groote-2004] and the latter is known to have a non-elementary lower bound (Lazic and Schmitz 2015)[^lazic-2015]. Thus, if MELL turns out to be decidable, it will be at least TOWER-hard (Lazic and Schmitz 2015)[^lazic-2015]. A proof of the decidability of MELL has been given by Bimbó (2015) but a gap in that proof has been reported by Straßburger (2019).
    step1: |-
      MELL 的表达力出人意料。例如 Petri 网的可达性问题可以编码进 MELL（Gunter & Gehlot 1989）[^gunter-1989]，而该问题等价于带状态向量加法系统（VASS）的可达性问题（Reutenauer 1989）[^reutenauer-1989]。此外，MELL 的可判定性问题等价于分支 VASS 的可达性问题（de Groote *et al.* 2004）[^groote-2004]，而后者已知有非初等下界（Lazic 与 Schmitz 2015）[^lazic-2015]。因此，若 MELL 最终可判定，它至少是 TOWER-难的（Lazic 与 Schmitz 2015）[^lazic-2015]。MELL 可判定性的一个证明由 Bimbó（2015）给出，但 Straßburger（2019）报告了其中一处漏洞。
