      Given that the sequent calculus for linear logic uses multisets of formulas, proof search can directly encode *multiset rewriting*. Since many computations can naturally be seen as multiset rewriting, it has been possible to make numerous connections between linear logic and Petri nets (Gunter & Gehlot 1989)[^gunter-1989], process calculi (Andreoli & Pareschi 1991, Kobayashi *et al*. 1999, Miller 1996)[^andreoli-1991][^kobayashi-1999][^miller-1996], and security protocols (Cervesato *et al*. 1999, Miller 2003)[^cervesato-1999][^miller-2003].
    step1: |-
      由于线性逻辑的矢列演算使用公式的多重集，证明搜索可直接编码 *多重集重写*。既然许多计算天然可看作多重集重写，线性逻辑就得以与 Petri 网（Gunter & Gehlot 1989）[^gunter-1989]、进程演算（Andreoli & Pareschi 1991, Kobayashi *et al.* 1999, Miller 1996）[^andreoli-1991][^kobayashi-1999][^miller-1996]，以及安全协议（Cervesato *et al.* 1999, Miller 2003）[^cervesato-1999][^miller-2003] 建立起众多联系。
    step2: |-
      线性逻辑的矢列演算用公式多重集，证明搜索便能直接编码 **多重集重写**。许多计算天然就是多重集重写，于是线性逻辑与 Petri 网（Gunter & Gehlot 1989）[^gunter-1989]、进程演算（Andreoli & Pareschi 1991, Kobayashi *et al.* 1999, Miller 1996）[^andreoli-1991][^kobayashi-1999][^miller-1996]、安全协议（Cervesato *et al.* 1999, Miller 2003）[^cervesato-1999][^miller-2003] 之间建立起众多联系。
