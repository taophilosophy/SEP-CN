      An important normal form theorem for the structure of cut-free proofs was provided by Andreoli (1992). He classified a non-atomic formula as *asynchronous* if its top-level logical connective is $\top$, &, $\bot , \lpar$, $\quest$, or $\forall$ or *synchronous* if its top-level logical connective is $0, \oplus , 1, \otimes$, $\bang$, or $\exists$.
    step1: |-
      Andreoli（1992）给出了关于无切证明结构的一个重要范式定理。他把非原子公式分类如下：若其顶层联结词为 $\top$、&、$\bot , \lpar$、$\quest$ 或 $\forall$，则称为 *异步的*；若其顶层联结词为 $0, \oplus , 1, \otimes$、$\bang$ 或 $\exists$，则称为 *同步的*。
    step2: |-
      Andreoli（1992）给出一个关于无切证明结构的重要范式定理。他把非原子公式分为两类：顶层联结词为 $\top$、&、$\bot , \lpar$、$\quest$、$\forall$ 的称 **异步**；顶层联结词为 $0, \oplus , 1, \otimes$、$\bang$、$\exists$ 的称 **同步**。
  - id: 34
    kind: body
    source: |-
      When viewing proof search as a computational model, we consider how inference rules can transform a sequent as its *conclusion* into *premises*. As a result, we can see formulas in a sequent as being “agents” that may act independently or in concert with others in their environment. Here, the actions of such agents are determined by reading the introduction rule for them bottom-up. If an asynchronous formula occurs on the right of a sequent, it can evolve without affecting provability and without interacting with its context, i.e., the corresponding introduction rule is invertible. For example, the agent $(B \lpar C)$ becomes (by applying the $\lpar$-right introduction rule) the two agents $B$ and $C$ (now working in parallel). Similarly, the agent $(B \amp C)$ yields (by applying the &-right introduction rule) two different identical worlds (sequents) except that $B$ is in one of these worlds and $C$ is in the other.
    step1: |-
      把证明搜索看作计算模型时，我们考虑推理规则如何把作为其 *结论* 的矢列转变为 *前提*。由此，可以把矢列中的公式看作“行动者”，它们可以各自行动，也可与所处环境中的其他行动者协同。这里，这类行动者的动作由自下而上地读取其引入规则来决定。若异步公式出现在矢列右侧，它可以在不影响可证性的情况下演化，也不与其语境相互作用，也就是说，相应的引入规则可逆。例如行动者 $(B \lpar C)$ 经（施用 $\lpar$-右引入规则）变成两个行动者 $B$ 与 $C$（此时并行工作）。类似地，行动者 $(B \amp C)$ 经（施用 &-右引入规则）产生两个不同的、除一个含 $B$、另一个含 $C$ 外完全相同的世界（矢列）。
    step2: |-
      把证明搜索看作计算模型时，要看推理规则如何把作为 **结论** 的矢列变成 **前提**。于是矢列中的公式可视为“行动者”：既可各自行动，也可与环境中的同伴协同。行动者的动作，由自下而上读其引入规则而定。异步公式若在矢列右侧，就能在不影响可证性、不与语境互动的情况下演化——相应引入规则可逆。例如 $(B \lpar C)$ 经 $\lpar$-右规则变成 $B$ 与 $C$ 两个行动者（此时并行干活）。$(B \amp C)$ 经 &-右规则产生两个世界（矢列），除一个含 $B$、另一个含 $C$ 外完全相同。
