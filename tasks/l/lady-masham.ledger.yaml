    source: |-
      As a young woman, Damaris Cudworth (as she then was) was able to escape ‘the learned dullness’ of Cambridge by visiting London where she frequented the more stimulating environment of the circle of Elizabeth Stillingfleet, whom she nicknamed ‘Urgunda’ in her letters. Elizabeth Stillingfeet was the second wife of Edward Stillingfleet, future Bishop of Worcester, who later engaged in controversy with Locke. It was probably here, that she met her husband, Sir Francis Masham, who was a relative of Elizabeth Stillingfleet.
    step1: |-
      年轻时，达马里斯·库德沃斯（她当时的名字）得以借造访伦敦逃脱剑桥“博学的沉闷”；她常去伊丽莎白·斯蒂林弗利特（Elizabeth Stillingfleet）的圈子，那里的环境更能激发思想，并在书信中给后者起了“乌尔贡达”（Urgunda）的绰号。伊丽莎白·斯蒂林弗利特是爱德华·斯蒂林弗利特（Edward Stillingfleet）的第二任妻子，后者即日后的伍斯特主教，后来曾与洛克论战。她很可能就是在这里结识了丈夫弗朗西斯·马沙姆爵士（Sir Francis Masham）——他是伊丽莎白·斯蒂林弗利特的亲戚。
    step2: |-
      年少时，达马里斯·库德沃斯（她当时的称呼）得以借造访伦敦逃离剑桥那“博学的沉闷”；她流连于伊丽莎白·斯蒂林弗利特（Elizabeth Stillingfleet）的圈子——那里更能激发思想，并在书信中给后者起了“乌尔贡达”（Urgunda）的绰号。伊丽莎白·斯蒂林弗利特是爱德华·斯蒂林弗利特（Edward Stillingfleet）的第二任妻子；后者即日后的伍斯特主教，曾与洛克展开论战。她与丈夫弗朗西斯·马沙姆爵士（Sir Francis Masham）的相识，很可能就在此处——他是伊丽莎白·斯蒂林弗利特的亲戚。
