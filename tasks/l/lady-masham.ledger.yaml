      诺里斯持偶因论立场，主张上帝是我们快乐的直接原因，因此是我们之爱的唯一正当对象。受造物因此只是我们内部愉悦效果的偶因，我们对受造物的爱低于且次于我们对上帝的爱。据此他区分两种爱：对上帝之爱即仁爱，对受造物之爱即贪爱，并声称欲望只与对上帝之爱相关。作为回应，马沙姆夫人否认诺里斯对上帝之爱与受造物之爱的区分，坚持认为欲望与我们对受造之物的爱相关。她论证说，我们对上帝的爱并非来自上帝灌输到我们心灵中的观念，而是来自对周围世界的观察；由此我们理性地得出结论：我们应当爱这个世界的创造者上帝。她对诺里斯偶因论的根本异议在于：它动摇了道德的基础，因为通过贬低上帝的作品，它摧毁了人类社会的纽带以及基督教道德的根基。与诺里斯相对，马沙姆夫人强调实践道德的重要性，主张它是宗教操守的组成部分。
