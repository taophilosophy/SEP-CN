      Damaris Masham (1658–1708) was one of the earliest English woman philosophers. The main sources for her philosophy are two anonymously published books, *A Discourse Concerning the Love of God* (1696) and *Occasional Thoughts in Reference to a Vertuous and Christian Life* (1705), and her correspondence with Locke and with Leibniz.
    step1: |-
      达马里斯·马沙姆（Damaris Masham，1658–1708）是最早的英格兰女性哲学家之一。其哲学的主要文献来源是两本匿名出版的著作《论上帝之爱》（*A Discourse Concerning the Love of God*，1696）与《关于德性与基督徒生活的偶思》（*Occasional Thoughts in Reference to a Vertuous and Christian Life*，1705），以及她与洛克和莱布尼茨的通信。
    step2: |-
      达马里斯·马沙姆（Damaris Masham，1658–1708）是最早的英格兰女性哲学家之一。其哲学的主要文献来源，是两部匿名刊行的著作——《论上帝之爱》（*A Discourse Concerning the Love of God*，1696）与《关于德性与基督徒生活的偶思》（*Occasional Thoughts in Reference to a Vertuous and Christian Life*，1705）——以及她与洛克和莱布尼茨的往来书信。
