      One of the main challenges for the proof-centered approach is that of distinguishing between rules that are genuinely meaning-determining and those that are not. Some rules for connectives, if added to a system, would lead to triviality. Prior (1960) offered the following rules for a connective “$\tonk$”. Its introduction rule says that from $A$ one can infer $A \tonk B$, and its elimination rule says that from $A \tonk B$ one can infer $B$. With the introduction of these rules, the system becomes trivial so long as at least one thing is provable, since from any assumption $A$ one can derive any conclusion $B$. Some constraints have to posed on inference rules, and much of subsequent literature has been concerned with these constraints (Belnap 1962, Dummett 1991, Prawitz 1974)[^dummett-1991][^belnap-1962][^prawitz-1974].
    step1: |-
      以证明为中心的进路面临的主要挑战之一，是区分真正决定意义的规则与不决定意义的规则。某些联结词规则若加入系统，会导致平凡性。Prior（1960）为一个联结词“$\tonk$”提出如下规则。其引入规则说，从 $A$ 可以推出 $A \tonk B$；其消去规则说，从 $A \tonk B$ 可以推出 $B$。加入这些规则后，只要至少有一件事可证明，系统就变得平凡，因为从任何假定 $A$ 都能推出任何结论 $B$。必须对推理规则施加某些约束，后续文献很大一部分都在讨论这些约束（Belnap 1962, Dummett 1991, Prawitz 1974）[^dummett-1991][^belnap-1962][^prawitz-1974]。
    step2: |-
      以证明为中心的进路，主要难题之一是分清哪些规则真正决定意义、哪些不。有些联结词规则一旦加入系统，系统就会平凡。Prior（1960）给联结词“$\tonk$”设了两条规则：引入规则说，从 $A$ 可推出 $A \tonk B$；消去规则说，从 $A \tonk B$ 可推出 $B$。加入这两条后，只要系统里至少能证一件事，就会平凡——因为从任何假定 $A$ 都能推出任何结论 $B$。所以必须给推理规则加约束，后来的文献很大一部分就在讨论这些约束（Belnap 1962, Dummett 1991, Prawitz 1974）[^dummett-1991][^belnap-1962][^prawitz-1974]。
