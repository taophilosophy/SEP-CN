    step1: |-
      为逻辑后承寻找更窄判据的最强、最普遍的提案，是诉诸 *形式性*。(4) 中从“Peter 是 Greg 的母亲的兄弟的儿子”到“Peter 是我的表亲”的一步是 *实质* 后承而非形式后承，因为要从前提走到结论，光靠所涉主张的 *结构* 或 *形式* 不够：还得理解它们的 *内容*。
