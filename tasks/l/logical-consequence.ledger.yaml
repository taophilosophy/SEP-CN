      Another arena for the interaction between the proof-theoretic and the model-theoretic perspectives has to do with the definition of the logical vocabulary. For example, one can hold a “moderate” inferentialist view which defines the meanings of logical connectives through their semantics (i.e. truth conditions) but demands that the meaning of a connective be determined by inference rules. Carnap has famously shown that the classical inference rules allow non-standard interpretations of the logical expressions (Carnap 1943)[^carnap-1943]. Much recent work in the field has been devoted to the exact nature and extent of Carnap’s categoricity problem (Raatikainen 2008, Murzi and Hjortland 2009, Woods 2012, Garson 2013, Peregrin 2014, Bonnay and Westerståhl 2016. See also the entry on sentence connectives in formal logic)[^bonnay-2016][^garson-2013][^murzi-2009][^peregrin-2014][^raatikainen-2008][^woods-2012].
    step1: |-
      证明论视角与模型论视角相互作用的另一个舞台，与逻辑词汇的定义有关。例如，可以持一种“温和”推理主义观点：通过语义（即真值条件）定义逻辑联结词的意义，但要求联结词的意义由推理规则决定。Carnap 著名地表明，经典推理规则允许对逻辑表达式作非标准解释（Carnap 1943）[^carnap-1943]。该领域晚近许多工作都在讨论 Carnap 范畴性问题的确切性质与范围（Raatikainen 2008, Murzi and Hjortland 2009, Woods 2012, Garson 2013, Peregrin 2014, Bonnay and Westerståhl 2016。另见形式逻辑中的句子联结词词条）[^bonnay-2016][^garson-2013][^murzi-2009][^peregrin-2014][^raatikainen-2008][^woods-2012]。
