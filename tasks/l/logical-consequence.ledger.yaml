      最后，用模型中的真来解释后承，通常是“实在论者”的口味——他们认为句子真不真，与我们能知道什么无关。用模型中的真解释后承，离用 *真* 解释后承很近；而“模型中的真”有时被当作符合论意义的真的阐明，符合论正是典型的实在论概念。但也有人认为，逻辑后承有不可或缺的认识成分，牵涉我们如何依据前提确立结论。“反实在论者”不肯把真（至少符合论的真）当作解释概念，通常更愿意用 *证明* 来解释后承——下面就说这个。
