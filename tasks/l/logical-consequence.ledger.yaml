      The model-theoretic definition is one of the most successful mathematical explications of a philosophical concept to date. It promises to capture both the necessity of logical consequence—by looking at truth over all models, and the formality of logical consequence—by varying the interpretations of the nonlogical vocabulary across models: an argument is valid no matter what the nonlogical vocabulary means. Yet, models are just sets, which are merely mathematical objects. How do they account for the range of possibilities, or circumstances required? John Etchemendy (1990) offers two perspectives for understanding models. On the *representational approach*, each model is taken to represent a possible world. If an argument preserves truth over models, we are then guaranteed that it preserves truth over possible worlds, and if we accept the identification of necessity with truth in all possible worlds, we have the necessary truth preservation of logical consequence. The problem with this approach is that it identifies logical consequence with metaphysical consequence, and it gives no account of the formality of logical consequence. On the representational approach, there is no basis for a distinction between the logical and the nonlogical vocabulary, and there is no explanation of why the interpretations of the nonlogical vocabulary are maximally varied. The second perspective on models is afforded by the *interpretational approach*, by which each model assigns extensions to the nonlogical vocabulary from the actual world: what varies between models is not the world depicted but the meaning of the terms. Here, the worry is that necessity isn’t captured. For instance, on the usual division of the vocabulary into logical and nonlogical, identity is considered a logical term, and can be used to form statements about the cardinality of the domain (e.g., ‘‘there are at least two things’’) which are true under every reinterpretation, but perhaps are not necessarily true. On this approach, there is no basis for considering models with domains other than the universe of what actually exists, and specifically, there is no explanation of model theory’s use of domains of different sizes. Each approach, as described here, is flawed with respect to our analysis of logical consequence as necessary and formal. The interpretational approach, by looking only at the actual world fails to account for necessity, and the representational approach fails to account for formality (for details, see Etchemendy 1990, Sher 1996, and Shapiro 1998, and for refinements see Etchemendy 2008)[^etchemendy-1990][^etchemendy-2008][^shapiro-1998][^sher-1996]. A possible response to Etchemendy would be to blend the representational and the interpretational perspectives, viewing each model as representing a possible world under a re-interpretation of the nonlogical vocabulary (Shapiro 1998, see also Sher 1996 and Hanson 1997 for alternative responses)[^hanson-1997][^shapiro-1998][^sher-1996].
    step1: |-
      模型论定义是迄今对哲学概念最成功的数学阐明之一。它有望同时抓住逻辑后承的必然性——通过考察所有模型中的真，以及逻辑后承的形式性——通过在各模型间改变非逻辑词汇的解释：无论非逻辑词汇是什么意思，论证都有效。然而，模型只是集合，只是数学对象。它们如何说明所需的那一范围的可能性或境况？John Etchemendy（1990）为理解模型提供了两种视角。按 *表象进路*，每个模型被看作表象一个可能世界。如果论证在模型上保真，那么我们就得到保证：它在可能世界上保真；如果我们接受把必然性等同于在所有可能世界中为真，就得到了逻辑后承的必然保真。这种进路的问题在于，它把逻辑后承等同于形而上学后承，而且没有说明逻辑后承的形式性。按表象进路，没有根据区分逻辑词汇与非逻辑词汇，也没有解释为什么非逻辑词汇的解释要被最大限度地变化。第二种视角是 *解释进路*：每个模型从现实世界给非逻辑词汇指定外延；模型之间变化的不是所描绘的世界，而是词项的意义。这里的担忧是，必然性没被抓住。例如，按通常把词汇分为逻辑词汇与非逻辑词汇的做法，同一性被视为逻辑词项，可用来构成关于域之基数的陈述（如“至少有两个东西”），这些陈述在每种重新解释下都为真，但也许并非必然为真。按这种进路，没有根据考虑域不同于实际存在之总体的模型，特别是，没有解释模型论为何使用不同大小的域。如上所述，两种进路就我们把逻辑后承分析为必然且形式而言都有缺陷。解释进路只看现实世界，说明不了必然性；表象进路说明不了形式性（细节见 Etchemendy 1990、Sher 1996、Shapiro 1998；改进见 Etchemendy 2008）[^etchemendy-1990][^etchemendy-2008][^shapiro-1998][^sher-1996]。对 Etchemendy 的一种可能回应，是把表象进路与解释进路融合起来，把每个模型看作在非逻辑词汇重新解释下表象一个可能世界（Shapiro 1998；其他回应见 Sher 1996、Hanson 1997）[^hanson-1997][^shapiro-1998][^sher-1996]。
