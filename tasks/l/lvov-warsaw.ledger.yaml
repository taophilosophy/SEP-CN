    source: |-
      The Lvov-Warsaw School (LWS) was the most important movement in the history of Polish philosophy. It was established by Kazimierz Twardowski at the end of the 19ᵗʰ century in Lvov (i.e., the Ukrainian city of Lviv, which at that time was part of the Austro-Hungarian Empire). The LWS flourished in the years 1918–1939. Kazimierz Ajdukiewicz, Tadeusz Kotarbiński, Stanisław Leśniewski, Jan Łukasiewicz and Alfred Tarski are its most famous members. It was an analytical school similar to the Vienna Circle in many respects. On the other hand, the attitude of the LWS toward traditional philosophy was much more positive than that of logical empiricism. Although logic became the most important field in the activities of the LWS, its members were active in all spheres of philosophy. World War II and political changes in Poland after 1945 caused the end of the LWS as an organized philosophical enterprise. One can consider it to have later been continued individually by its representatives.
    step1: |-
      利沃夫—华沙学派（LWS）是波兰哲学史上最重要的运动。它由 Kazimierz Twardowski 于 19 世纪末在利沃夫（即乌克兰城市利沃夫 Lviv，当时属奥匈帝国）建立。LWS 于 1918–1939 年间鼎盛。Kazimierz Ajdukiewicz、Tadeusz Kotarbiński、Stanisław Leśniewski、Jan Łukasiewicz 与 Alfred Tarski 是其最著名的成员。它是一个分析学派，在许多方面与维也纳学圈相似。另一方面，LWS 对传统哲学的态度比逻辑经验主义积极得多。虽然逻辑成为 LWS 活动中最重要的领域，其成员在哲学的所有领域都很活跃。第二次世界大战以及 1945 年后波兰的政治变化，使 LWS 作为一个有组织的哲学事业终结。可以认为它后来由其代表人物以个人方式延续。
    step2: |-
      利沃夫—华沙学派（LWS）是波兰哲学史上最重要的运动，由 Kazimierz Twardowski 于 19 世纪末在利沃夫（今乌克兰的利沃夫 Lviv，当时属奥匈帝国）创建，1918–1939 年间鼎盛。Kazimierz Ajdukiewicz、Tadeusz Kotarbiński、Stanisław Leśniewski、Jan Łukasiewicz、Alfred Tarski 是其中最著名的成员。这是个分析学派，许多方面像维也纳学圈；但 LWS 对传统哲学的态度，比逻辑经验主义积极得多。逻辑虽是学派活动里最重的领域，成员们在哲学各个领域都很活跃。二战和 1945 年后波兰的政治变迁，让 LWS 作为有组织的哲学事业走向终结；后来可以算是靠其代表人物各自延续。
