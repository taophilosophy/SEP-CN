      Radical conventionalism is an epistemological theory developed by Ajdukiewicz in the early 1930s. It is based on a conception of language and meaning. The concept of meaning is taken as a primitive. Now, the meaning of expressions in a language **L** induces the rules for accepting its sentences. Ajdukiewicz lists three kinds of meaning-rules (or sense-rules): (a) axiomatic (they demand the unconditional acceptance of sentences, for example, “*A* is *A*”; (b) deductive (they demand the acceptance of a sentence relatively to the prior acceptance of other sentences, for example, ¬*A* follows from *A* → *B* and ¬*B*), (c) empirical (they demand the acceptance of a sentence in a definite empirical situation, for example “it is raining” when it rains).
    step1: |-
      激进约定论是 Ajdukiewicz 于 1930 年代初发展的一种认识论理论。它基于一种语言与意义的概念。意义概念被当作原始的。现在，语言 **L** 中表达式的意义诱导接受其句子的规则。Ajdukiewicz 列出三类意义规则（或意义规则）：(a) 公理的（要求无条件接受句子，例如“*A* 是 *A*”）；(b) 演绎的（要求相对于先前接受其他句子而接受某句子，例如 ¬*A* 从 *A* → *B* 与 ¬*B* 得出）；(c) 经验的（要求在确定经验情境中接受句子，例如下雨时接受“正在下雨”）。
    step2: |-
      激进约定论是 Ajdukiewicz 在 1930 年代初提出的认识论理论，建立在语言与意义的概念上：意义概念被当作原始概念；语言 **L** 中表达式的意义，诱导出接受其句子的规则。Ajdukiewicz 列出三类意义规则（或“意义规则”）：(a) 公理规则——要求无条件接受某些句子，如“*A* 是 *A*”；(b) 演绎规则——要求相对于先接受其他句子而接受某句，如由 *A* → *B* 与 ¬*B* 得出 ¬*A*；(c) 经验规则——要求在确定经验情境中接受某句，如下雨时接受“正在下雨”。
