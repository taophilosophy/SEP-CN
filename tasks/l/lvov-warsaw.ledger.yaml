      ### 3.1 Polish notation, the requirements for logical systems and metalogical concepts
    step1: |-
      ### 3.1 波兰记法、对逻辑系统的要求与元逻辑概念
    step2: |-
      ### 3.1 波兰记法、对逻辑系统的要求与元逻辑概念
  - id: 20
    kind: body
    source: |-
      Łukasiewicz invented a parenthesis-free logical notation. The idea consisted in writing logical constants before their arguments. Łukasiewicz replaced the usual signs for logical operations by letters: *N* (negation), *K* (conjunction), *A* (disjunction), *C* (implication) and *E* (equivalence). Any well-formed formula (the present explanations are restricted to propositional calculus) must begin with a capital letter (propositional variables are symbolized by lower-case Latin letters) which is the main functor of the entire formula. The main connective has as its arguments variables or formulas consisting of variables and constants. The following are examples: *Cpp* for (*p* → *p*), *CCppNq* for ((*p* → *p*) → ¬*q*). The structure of a formula (and hence also its meaning) in Polish notation is uniquely determined by the position of the letters. The parenthesis-free notation is unambiguous in the sense that any finite sequence of symbols for connectives and variables is interpretable in a unique way. This implies that any wff coded in Polish notation has only one translation into the standard symbolism. The main advantage of Polish notation is its economy, because it avoids special punctuation devices such as brackets or dots. When Łukasiewicz met Turing in 1949, the latter remarked that Polish notation was much better for computers, because formulas with function-symbols in front could be better elaborated by mechanical devices.
    step1: |-
      Łukasiewicz 发明了一种无括号逻辑记法。其想法是把逻辑常项写在论元之前。Łukasiewicz 用字母替换逻辑运算的通常记号：*N*（否定）、*K*（合取）、*A*（析取）、*C*（蕴涵）与 *E*（等值）。任何合式公式（这里的说明限于命题演算）必须以一个大写字母开头（命题变元用小写拉丁字母表示），它就是整个公式的主函项。主联结词的论元是变元，或由变元与常项构成的公式。例如：*Cpp* 表示（*p* → *p*），*CCppNq* 表示（(*p* → *p*) → ¬*q*）。波兰记法中公式的结构（从而其意义）由字母的位置唯一确定。无括号记法在如下意义上无歧义：联结词与变元符号的任何有限序列都能以唯一的方式解释。这意味着任何以波兰记法编码的合式公式在标准记号中只有一个翻译。波兰记法的主要优点是经济，因为它避免诸如括号或点号之类的特殊标点手段。Łukasiewicz 1949 年见到 Turing 时，后者评论说波兰记法对计算机好得多，因为函数符号在前面的公式能被机械装置更好地处理。
    step2: |-
      Łukasiewicz 发明了一种无括号逻辑记法，思路是把逻辑常项写在论元之前。他用字母替换逻辑运算的通常记号：*N*（否定）、*K*（合取）、*A*（析取）、*C*（蕴涵）、*E*（等值）。任何合式公式（这里的说明限于命题演算）必须以一个大写字母开头（命题变元用小写拉丁字母），这个字母是整个公式的主函项；主联结词的论元是变元，或由变元与常项组成的公式。例如 *Cpp* 表示（*p* → *p*），*CCppNq* 表示（(*p* → *p*) → ¬*q*）。波兰记法下公式的结构（从而其意义）由字母的位置唯一确定；无括号记法无歧义——联结词与变元符号的任何有限序列都能唯一地解释，因此任何以波兰记法写的合式公式在标准记号中只有一个翻译。波兰记法的主要优点是经济：不用括号、点号这类特殊标点。Łukasiewicz 1949 年遇到 Turing，后者评论说波兰记法对计算机好得多，因为函数符号在前的公式更容易被机械装置处理。
  - id: 21
    kind: body
    source: |-
      The parenthesis-free symbolism was closely associated with some ideas of Polish logicians concerning the good properties of formal systems. Of course, any correct logical system should be consistent and, if possible, syntactically and semantically complete. It should also be based on independent sets of primitive terms and axioms. The Warsaw School of Logic strongly emphasized the last property, often considered secondary. Thus, the dependence of primitive terms or axioms was regarded as an essential defect. Moreover, some additional structural properties of logical systems were recommended: (a) a system with fewer primitive concepts is better; (b) a system with fewer axioms is better; (c) if we define the length of an axiom system as the number of symbols occurring in all of its axioms, the shortest axiom system is the best; (d) a system with fewer different symbols is better; (e) if we define an organic theorem as one which has no other theorem inside it (for example, the formula *CpCqq* is not an organic theorem), organic axioms are better than non-organic ones. Thus, the ideal axiom system consists of a sole organic axiom of the shortest possible length, provided that it is consistent. Requirements (a)-(f) apply particularly well to propositional calculus. They became the guiding principles of many logical investigations in the Warsaw School of Logic. Logicians of this school also made precise many important metalogical concepts, including those of the logical matrix, consequence operation, deductive system and model.
    step1: |-
      无括号符号体系与波兰逻辑学家关于形式系统良好性质的一些想法密切相关。当然，任何正确的逻辑系统都应一致，并且如果可能，应在语法与语义上都完全。它还应有独立的原始词项集与公理集。华沙逻辑学派强烈强调最后这条性质，而它常被视为次要。于是，原始词项或公理的依赖性被视为本质缺陷。此外，还推荐逻辑系统的一些额外结构性质：(a) 原始概念较少的系统更好；(b) 公理较少的系统更好；(c) 若把公理系统的长度定义为其所有公理中出现的符号数，则最短的公理系统最好；(d) 不同符号较少的系统更好；(e) 若把有机定理定义为内部不含其他定理的定理（例如公式 *CpCqq* 不是有机定理），则有机公理优于非有机公理。于是，理想的公理系统由一条尽可能短的有机公理组成，只要它一致。要求 (a)–(f) 特别适用于命题演算。它们成为华沙逻辑学派许多逻辑研究的指导原则。该学派的逻辑学家还精确化了许多重要的元逻辑概念，包括逻辑矩阵、后承运算、演绎系统与模型。
    step2: |-
      无括号符号体系，与波兰逻辑学家关于“好形式系统”的一些想法紧密相关。任何正确的逻辑系统当然都该一致，最好还在语法、语义上都完全，并且原始词项集与公理集各自独立。最后这条常被视为次要，华沙逻辑学派却极力强调：原始词项或公理有依赖，就算本质缺陷。此外，他们还推崇一些额外的结构性质：(a) 原始概念越少越好；(b) 公理越少越好；(c) 若把公理系统长度定义为全部公理中符号的数目，则最短者最佳；(d) 不同符号越少越好；(e) 若把“有机定理”定义为内部不含其他定理的定理（例如 *CpCqq* 就不是有机定理），则有机公理优于非有机公理。于是，理想的公理系统就是：一条尽可能短的有机公理，外加一致性。要求 (a)–(f) 尤其适用于命题演算，并成为华沙逻辑学派许多研究的指导原则。学派还精确化了不少重要的元逻辑概念，如逻辑矩阵、后承运算、演绎系统与模型。
