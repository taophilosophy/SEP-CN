  - id: 3
    kind: body
    source: |-
      Kazimierz Twardowski (1866–1938) began his post as professor of philosophy at Lvov University in 1895. He came to Lvov from Vienna, where he had studied philosophy under Franz Brentano and Robert Zimmermann. Twardowski belonged to the last group of Brentano’s students. His *Habilitationschrift* (1894) concerned the concepts of the content and the object of presentations; it clarified and sharpened this important distinction. This work strongly influenced Meinong and Husserl.
    step1: |-
      Kazimierz Twardowski（1866–1938）于 1895 年就任利沃夫大学哲学教授。他从维也纳来，在维也纳师从 Franz Brentano 与 Robert Zimmermann 学习哲学。Twardowski 属于 Brentano 最后一批学生。其教授资格论文（1894）讨论表象的内容与对象这两个概念；它澄清并磨锐了这个重要区分。这部著作强烈影响了 Meinong 与 Husserl。
    step2: |-
      Kazimierz Twardowski（1866–1938）1895 年就任利沃夫大学哲学教授。他自维也纳而来，在那里师从 Franz Brentano 与 Robert Zimmermann 学哲学，属于 Brentano 最后一批学生。他的教授资格论文（1894）研究表象的内容与对象这两个概念，把这个重要区分澄清、磨锐。这部著作强烈影响了 Meinong 与 Husserl。
  - id: 4
    kind: body
    source: |-
      Twardowski appeared in Lvov with the ambitious plan of creating a scientific philosophy (in Brentano’s spirit) in Poland (at that time, Poland was partitioned between Austro-Hungary, Germany and Russia; Lvov belonged to the Austro-Hungarian Empire.) In fact, he subordinated all his activities to achieving this task and considerably limited his own scientific work. Twardowski was an extraordinary and charismatic teacher. He very soon attracted many young people to philosophy. After ten years of teaching he sometimes had about 200 candidates for seminars and 2000 attendants of his lectures. He propagated a clear style of writing and speaking about philosophical matters, insisted upon justification of philosophical theses and sharply distinguished philosophy as a science from world-views. Following Brentano, he favoured problems on the borderline of descriptive psychology, grammar and logic (he supplemented his object/content distinction by that of actions/products). A photo of Twardowski’ seminar participants taken during the 1925–1926 academic year is available (see the [supplement](lvov-warsaw.seminar.md)), with most of the participants identified.
    step1: |-
      Twardowski 到利沃夫时怀着一个雄心勃勃的计划：在波兰创建一种（Brentano 精神的）科学哲学（当时波兰被奥匈、德国与俄国瓜分；利沃夫属奥匈帝国）。事实上，他把自己的一切活动都从属于实现这一任务，并大大限制了自己的科学工作。Twardowski 是一位非凡的、有魅力的教师。他很快吸引了大批青年学哲学。任教十年后，他有时有约 200 名研讨班候选人，2000 名听他讲课的人。他提倡清晰地写哲学、谈哲学，坚持哲学论题要有论证，并尖锐地把作为科学的哲学与世界观区分开。他追随 Brentano，偏爱描述心理学、语法与逻辑交界处的问题（他在对象/内容区分之外又补充了行动/产品的区分）。Twardowski 1925–1926 学年研讨班成员的照片可得（见[补充材料](lvov-warsaw.seminar.md)），大部分成员已辨明身份。
    step2: |-
      Twardowski 到利沃夫时带着一个雄心勃勃的计划：在波兰创立一种（Brentano 精神的）科学哲学（当时波兰被奥匈、德国、俄国瓜分，利沃夫属奥匈帝国）。他确实把一切都押在这件事上，大大压缩了自己的科研。他是位非凡而又有魅力的老师，很快吸引大批青年投身哲学。任教十年后，他的研讨班有时有约 200 名候选人，听讲者达 2000 人。他提倡写哲学、谈哲学都要清晰，坚持哲学论题必须有论证，并干脆利落地把“作为科学的哲学”与世界观分开。他跟着 Brentano，偏爱描述心理学、语法与逻辑交界处的问题（在对象/内容之分外又补了行动/产品之分）。Twardowski 1925–1926 学年研讨班的合影现存（见[补充材料](lvov-warsaw.seminar.md)），大部分成员身份已辨明。
  - id: 5
    kind: body
    source: |-
      Although Twardowski was not a logician and did not consider himself as such, his program formed a friendly environment for logic in all its subdomains: formal logic, semantics and methodology of science. Jan Łukasiewicz (1878–1956) was the first of Twardowski’s students to be interested in logic. He began his lectures in logic in Lvov in 1906. Kazimierz Ajdukiewicz (1890–1963), Tadeusz Czeżowski (1889–1981), Tadeusz Kotarbiński (1886–1981) and Zygmunt Zawirski (1882–1948) studied mainly under Twardowski, but they also attended courses conducted by Łukasiewicz. Stanisław Leśniewski (1886–1939) joined this circle in 1910. Warsaw appeared on the stage exactly in 1915, when the University of Warsaw was reopened. The academic staff was mainly imported from Lvov; Łukasiewicz was appointed professor of philosophy.
    step1: |-
      虽然 Twardowski 不是逻辑学家，也不自认为如此，他的计划为逻辑的一切子领域——形式逻辑、语义学与科学方法论——营造了友好环境。Jan Łukasiewicz（1878–1956）是 Twardowski 学生中第一个对逻辑感兴趣的人。他 1906 年开始在利沃夫讲授逻辑。Kazimierz Ajdukiewicz（1890–1963）、Tadeusz Czeżowski（1889–1981）、Tadeusz Kotarbiński（1886–1981）与 Zygmunt Zawirski（1882–1948）主要师从 Twardowski，但也听 Łukasiewicz 的课。Stanisław Leśniewski（1886–1939）于 1910 年加入这个圈子。华沙恰在 1915 年登上舞台，当时华沙大学重开。学术人员主要从利沃夫引进；Łukasiewicz 被任命为哲学教授。
    step2: |-
      Twardowski 虽不是逻辑学家，也不自认是，但他的计划为逻辑的所有子领域——形式逻辑、语义学、科学方法论——营造了友好环境。Jan Łukasiewicz（1878–1956）是 Twardowski 学生中第一个对逻辑产生兴趣的人，1906 年起在利沃夫开逻辑课。Kazimierz Ajdukiewicz（1890–1963）、Tadeusz Czeżowski（1889–1981）、Tadeusz Kotarbiński（1886–1981）、Zygmunt Zawirski（1882–1948）主要师从 Twardowski，也听 Łukasiewicz 的课。Stanisław Leśniewski（1886–1939）1910 年加入这个圈子。华沙恰在 1915 年登上舞台：那年华沙大学重开，师资主要从利沃夫引进，Łukasiewicz 被聘为哲学教授。
  - id: 6
    kind: body
    source: |-
      Poland recovered its independence in 1918 and Polish scholars began to build national academic life. The program for the development of mathematics elaborated by a mathematician Zygmunt Janiszewski (the Janiszewski program) had a great importance for the subsequent development of the LWS. According the Janiszewski program, Polish mathematicians should concentrate on set theory, topology and their applications to other branches of mathematics. In particular, the Janiszewski program attached great importance to mathematical logic and the foundations of mathematics. Two philosophers, namely Leśniewski and Łukasiewicz, became professors of the University of Warsaw at the Faculty of Mathematical and Natural Sciences. Both began intensive teaching of mathematical logic, mostly among mathematicians but also among philosophers. Thus, logic in the LWS had two parents: mathematics and philosophy.
    step1: |-
      波兰于 1918 年恢复独立，波兰学者开始建设国家学术生活。数学家 Zygmunt Janiszewski 制定的数学发展纲领（Janiszewski 纲领）对 LWS 的后续发展意义重大。按 Janiszewski 纲领，波兰数学家应集中精力于集合论、拓扑学及其在数学其他分支中的应用。特别是，Janiszewski 纲领高度重视数理逻辑与数学基础。两位哲学家，即 Leśniewski 与 Łukasiewicz，成为华沙大学数学与自然科学系的教授。两人开始密集讲授数理逻辑，主要面向数学家，也面向哲学家。于是，LWS 中的逻辑有两个父母：数学与哲学。
    step2: |-
      波兰 1918 年复国，学者们着手建设国家学术生活。数学家 Zygmunt Janiszewski 制定的数学发展纲领（“Janiszewski 纲领”）对 LWS 的后续发展意义重大：波兰数学家应集中攻集合论、拓扑学及其在数学各分支的应用，尤其高度重视数理逻辑与数学基础。两位哲学家——Leśniewski 与 Łukasiewicz——出任华沙大学数学与自然科学系教授，开始密集讲授数理逻辑，主要面向数学家，也面向哲学家。于是，LWS 的逻辑有两个父母：数学与哲学。
