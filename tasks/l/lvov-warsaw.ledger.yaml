      ## 6. The Significance of the Lvov-Warsaw School
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      The LWS acted in a country which never belonged to the philosophical superpowers. This circumstance is important for any assessment of the significance of the LWS. One can measure it on a national or an international scale. The importance of the LWS for Polish philosophical culture was enormous. Twardowski fully realized his task. He introduced scientific philosophy in his sense into Poland and created a powerful philosophical school. It did very much for the subsequent development of philosophy in the country. In particular, it popularized very high standards of doing philosophy. This was important in the difficult times after 1945, when Marxism started an ideological and political offensive against bourgeois philosophy. In fact, due to the strong methodological tradition related to the LWS, Polish philosophy did not lose its academic quality in 1945–1989.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      As far as the matter concerns international importance, one thing is clear. The logical achievements of the LWS became the most famous. Doubtless, the Warsaw school of logic contributed very much to the development of logic in the 20ᵗʰ century. Other contributions are known but rather marginally. This is partially due to the fact that most philosophical writings of the LWS appeared in Polish. However, this factor does not explain everything. Many writings of the LWS were originally published in English, French or German. However, their influence was very moderate, considerably lesser than that of similar writings of philosophers from the leading countries. This is a pity, because radical conventionalism, reism or semantic epistemology are the real philosophical pearls. But perhaps this is the fate of results achieved in cultural provinces.
