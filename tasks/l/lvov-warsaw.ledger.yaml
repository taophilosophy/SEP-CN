      Łukasiewicz revolutionized the history of logic. He proposed to look at the history of logical ideas through the glasses of mathematical logic. The reason was that he was convinced about the continuity of formal logic from Aristotle to modern mathematical logic, perhaps with a break from the 16ᵗʰ century to Boole and Frege (of course, with the exception of Leibniz). Thus, old sound logical theories should be considered as anticipations of ideas advanced in the 19ᵗʰ and the 20ᵗʰ centuries. Guided by this assumption, Łukasiewicz showed that the Stoics invented propositional calculus, contrary to the prevailing view that Stoic logic was a part of Aristotle’s logic. In particular, Łukasiewicz demonstrated that the Stoic logic of propositions was a system of rules, not theorems. Another of Łukasiewicz’s historical discoveries consisted in the rehabilitation of medieval logic, commonly neglected as fruitless scholasticism. He was joined in these investigations by Bocheński and Salamucha.
    step1: |-
      Łukasiewicz 革新了逻辑史。他提议透过数理逻辑的眼镜看逻辑观念史。理由是他深信形式逻辑从亚里士多德到现代数理逻辑的连续性（也许从 16 世纪到 Boole 与 Frege 有一个中断，当然莱布尼茨除外）。于是，古老而健全的逻辑理论应被视为 19 与 20 世纪思想的先声。在这一假定引导下，Łukasiewicz 表明，与“斯多亚逻辑是亚里士多德逻辑一部分”的主流观点相反，斯多亚派发明了命题演算。特别是，Łukasiewicz 论证了斯多亚命题逻辑是规则系统而非定理系统。Łukasiewicz 的另一项史学发现是复兴通常被忽视、视为无结果经院主义的中世纪逻辑。Bocheński 与 Salamucha 加入了这些研究。
