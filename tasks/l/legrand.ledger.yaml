      笛卡尔虽曾许诺在物理学中申说此义，也敦请梅森拿去他人处试探（勿提其名），但此后他似乎将其搁置，或决意不再发表。（*Ibid.*, p. 23）勒·格兰德属于挺身为创造学说辩护的少数笛卡尔后学之列。他援引笛卡尔的类比：上帝奠定永恒真理，犹如君王制定国法：“上帝与君王情形大异。君王可改其法，因其意志可变；上帝的意志则不可改，因为他的完善正在于以最恒常不变的方式行事……因此，虽说‘一加五是六’何以不真，我无从理解，我却足够清楚地明白：普天之下，万物无一不依赖于他。”（1694, book I, part ii, p. 63）马勒伯朗士一辈批评者对此说的主要忧虑是：它将抽走科学与神学命题的一切必然根基，使其沦为偶然而可疑。勒·格兰德的回答是：真实而不变的本性的创造，虽出于上帝的自由意志（并非如马勒伯朗士等人所主张的那样依其智慧而定），但一经受造，它们便是必然的。为了既把这种必然性系于上帝意志的不变性、又不以任何方式束缚上帝，勒·格兰德援引经院哲学在先必然与在后必然之分。他论证：真实而不变的本性——如数学真理——只具有在后必然性。上帝并非因为看出 5+1=6 别无他样才意愿之；而是凭其自由意志，5+1[必然]等于 6，故它别无他样。笛卡尔陈述过同一论点：“即便上帝意愿某些真理为必然，这也并不意味着他是必然地意愿它们；因为，意愿它们是必然的，与必然地意愿它们、或被迫去意愿它们，判然两事。”（1985–91, III, p. 235）因为在上帝之外，没有任何东西——连永恒真理或不变本质也不例外——能迫使上帝如此这般行动；毋宁说，真理与本质之所以永恒不变，正因那位存在必然而不变的上帝，在其本质与存在中意愿了它们。永恒真理与不变本质之为必然，仅在于它们预设着、并后随于那造成它们的上帝行动。（Easton, 2009）
