      The edition of Leibniz’s philosophical works in Latin and French, published by Rudolph Erich Raspe (Leibniz 1765; cf. Hallo 1934)[^hallo-1934][^leibniz-1765] contained some up to then unpublished letters and six pieces from the unpublished papers, of which two, “Difficultates quaedam logicae” and “Historia et commendatio linguae charactericae”, are relevant to logic. The most important feature of Raspe’s edition was the first publication of the “Nouveaux Essais sur l’entendement humain” which had been missing for sixty years. They influenced, e.g., Bernard Bolzano who regarded Leibniz as an ally when writing his seminal *Wissenschaftslehre* (Bolzano 1837, [TS]; Mugnai 2011)[^bolzano-1837][^bolzano-1837-2][^mugnai-2011].
    step1: |-
      鲁道夫·埃里希·拉斯佩刊行的拉丁文与法文莱布尼茨哲学著作集（Leibniz 1765；参见 Hallo 1934）[^hallo-1934][^leibniz-1765]收有一些此前未刊的书信与未刊文稿中的六篇，其中两篇与逻辑相关：《若干逻辑难题》（“Difficultates quaedam logicae”）与《特征语言的历史与推荐》（“Historia et commendatio linguae charactericae”）。拉斯佩版最重要的特色，是首次刊布失踪六十年的《人类理智新论》。例如，伯纳德·鲍尔查诺在撰写其开山之作《科学论》时把莱布尼茨视为盟友，即受其影响（Bolzano 1837, [TS]；Mugnai 2011）[^bolzano-1837][^bolzano-1837-2][^mugnai-2011]。
    step2: |-
      鲁道夫·埃里希·拉斯佩刊行的拉丁文与法文莱布尼茨哲学著作集（Leibniz 1765；参见 Hallo 1934）[^hallo-1934][^leibniz-1765]，收有此前未刊的书信若干、未刊文稿六篇；其中两篇与逻辑相关：《若干逻辑难题》（“Difficultates quaedam logicae”）与《特征语言的历史与推荐》（“Historia et commendatio linguae charactericae”）。拉斯佩版最重要的特色，是首次刊布失踪六十年的《人类理智新论》。例如伯纳德·鲍尔查诺——他撰写开山之作《科学论》时把莱布尼茨视为盟友——即受其影响（Bolzano 1837, [TS]；Mugnai 2011）[^bolzano-1837][^bolzano-1837-2][^mugnai-2011]。
