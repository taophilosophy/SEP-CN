      The most important among these editorial projects was the edition of Leibniz’s philosophical works *God. Guil. Leibnitii opera philosophica quae exstant Latina Gallica Germanica omnia* (Leibniz 1839/40; cf. Glockner 1932, 59–65)[^glockner-1932][^leibniz-1839] prepared in two volumes by Johann Eduard Erdmann (1805–1892), which included fragments, published there for the first time, containing elaborations of Leibniz’s ideas concerning logical calculi. One of the documents is Leibniz’s 1696 letter to Gabriel Wagner which contains the famous definition of logic or the art of reasoning as the art to use the intellect (*Verstand*), i.e., not only to evaluate what is imagined, but also to discover (invent) what is hidden. The edition also contains the seminal fragments “Specimen demonstrandi in abstractis” and “Non inelegans specimen demonstrandi in abstractis” (Leibniz 1839/40, 94–97)[^leibniz-1839], the last with the algebraic plus-minus calculus, i.e. a central specimen of Leibniz’s various attempts to create logical calculi working with the two “constituting” operations “gathering together”, symbolized by +, and “taking away”, symbolized by – (cf. Leibniz 1999, no. 178)[^leibniz-1999].
    step1: |-
      这些编辑工程中最重要的，是两卷本的莱布尼茨哲学著作集《戈·威·莱布尼茨现存哲学著作：拉丁文、法文、德文全部》（Leibniz 1839/40；参见 Glockner 1932, 59–65）[^glockner-1932][^leibniz-1839]，由约翰·爱德华·埃尔德曼（1805–1892）编成；其中收有首次刊布的残篇，包含对莱布尼茨逻辑演算观念的阐发。其中一件文献是莱布尼茨 1696 年致加布里埃尔·瓦格纳的信，包含逻辑或推理技艺的著名定义：运用理智（*Verstand*）的技艺，即不仅评价所想象的东西，还发现（发明）隐藏的东西。该版本还收录了开创性的残篇《在抽象物中证明的示范》与《在抽象物中证明的不无优雅的示范》（Leibniz 1839/40, 94–97）[^leibniz-1839]；后者包含代数加减演算，即莱布尼茨创制逻辑演算之各种尝试的一个核心样本——这种演算以两个“构成性”操作运作：“聚拢”，以 + 表示；“拿走”，以 – 表示（参见 Leibniz 1999, no. 178）[^leibniz-1999]。
