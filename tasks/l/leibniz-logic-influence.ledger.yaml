      When access to Leibniz’s papers stored in Hanover became possible in the 1830s, interest in Leibniz arose almost immediately. It can be said that German research on Leibniz started as an aftermath of this event (Glockner 1932, 60)[^glockner-1932]. The pioneers in this period of research were the first editors of these papers. Although the philological interest stood at the center, one could also observe an emerging interest in systematic aspects of Leibniz’s logic. The following editorial milestones have to be mentioned: Gottschalk Eduard Guhrauer (1809–1854) edited the *Deutsche Schriften* (Leibniz 1838/40)[^leibniz-1838]; Georg Heinrich Pertz (1795–1876) directed the edition of the collected works, of which a first series was devoted to the mathematical writings (Leibniz 1849–1863)[^leibniz-1849]. The latter were edited by Carl Immanuel Gerhardt (1816–1899). In addition, Pertz also edited Leibniz’s *Annales imperii occidentis Brunsvicenses* (Leibniz 1843–1846)[^leibniz-1843].
    step1: |-
      当人们于十九世纪三十年代有可能接触藏于汉诺威的莱布尼茨文稿时，对莱布尼茨的兴趣几乎立即兴起。可以说，德国的莱布尼茨研究就是这一事件的后果（Glockner 1932, 60）[^glockner-1932]。这一研究时期的先驱，是这些文稿的第一批编者。虽然语文学兴趣居于中心，但也可以观察到对莱布尼茨逻辑之系统方面的兴趣正在出现。必须提到以下编辑里程碑：戈特沙尔克·爱德华·古劳尔（1809–1854）编成《德文著作》（Leibniz 1838/40）[^leibniz-1838]；格奥尔格·海因里希·佩尔茨（1795–1876）主持全集的编纂，其第一个系列专收数学著作（Leibniz 1849–1863）[^leibniz-1849]。后者由卡尔·伊曼努尔·格哈特（1816–1899）编辑。此外，佩尔茨还编辑了莱布尼茨的《西方不伦瑞克编年史》（Leibniz 1843–1846）[^leibniz-1843]。
    step2: |-
      十九世纪三十年代，人们得以接触藏于汉诺威的莱布尼茨文稿；对莱布尼茨的兴趣几乎立时兴起。可以说，德国的莱布尼茨研究正以此事为发端（Glockner 1932, 60）[^glockner-1932]。这一研究时期的先驱，是这些文稿的第一批编者。语文学兴趣固然居于中心，但也可以观察到对莱布尼茨逻辑之系统层面的兴趣正在浮现。编辑里程碑有如下数端：戈特沙尔克·爱德华·古劳尔（1809–1854）编成《德文著作》（*Deutsche Schriften*；Leibniz 1838/40）[^leibniz-1838]；格奥尔格·海因里希·佩尔茨（1795–1876）主持全集编纂，其第一系列专收数学著作（Leibniz 1849–1863）[^leibniz-1849]。后者由卡尔·伊曼努尔·格哈特（1816–1899）编辑。此外，佩尔茨还编辑了莱布尼茨的《西方不伦瑞克编年史》（*Annales imperii occidentis Brunsvicenses*；Leibniz 1843–1846）[^leibniz-1843]。
