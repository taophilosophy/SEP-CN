      In the chapter on Leibniz, Erdmann stressed the connection between mathematics and philosophy. He dealt with Leibniz’s logic in the section on the philosophical method and mentioned Leibniz’s definition of “method” as the way to derive all knowledge with the help of “principles of knowledge” (*Erkenntnisprinzipien*) (Erdmann 1842, 109)[^erdmann-1842]. These principles are the law of contradiction and the law of sufficient reason. Erdmann quoted Leibniz’s letter to Gabriel Wagner containing the statement that logic is the art to use the intellect; logic is therefore the key to all sciences and arts. According to Erdmann, Leibniz identifies the logical method with the mathematical method regarding it as the true philosophical method. Erdmann furthermore dealt at length with Leibniz’s “mathematical treatment of philosophy” not only because it was important for Christian Wolff and his school, but also “because just this point is usually ignored in presentations of Leibniz’s philosophy” (ibid., 114). He had good reasons for this evaluation because most of the relevant writings became only accessible in his own edition (Leibniz 1839/40)[^leibniz-1839]. Erdmann discussed Leibniz’s calculi calling them “methodic operations” with data in the “way of calculating”. He mentioned Leibniz’s idea of a character script for the calculus which allows using signs without always having a particular meaning in view. Such “pasigraphy” would eliminate the differences between the languages, but, according to Erdmann’s evaluation, the idea of a universal language was not at the center of Leibniz’s interests. Leibniz’s main point was that “all mistakes in reasoning will at once show up in a wrong combination of characters, and therefore the application of the characteristic script provides a means to discover the mistake in a disputed point like in every other calculation” (ibid., 122–123).
    step1: |-
      在论莱布尼茨的一章，埃尔德曼强调数学与哲学的联系。他在论哲学方法的一节处理莱布尼茨的逻辑，提到莱布尼茨对“方法”的定义：借助“认识原则”推出一切知识的途径（Erdmann 1842, 109）[^erdmann-1842]。这些原则是矛盾律与充足理由律。埃尔德曼引用了莱布尼茨致加布里埃尔·瓦格纳的信，其中说逻辑是运用理智的技艺；因此逻辑是一切科学与技艺的钥匙。照埃尔德曼的说法，莱布尼茨把逻辑方法等同于数学方法，视之为真正的哲学方法。埃尔德曼还详尽讨论了莱布尼茨“对哲学的数学处理”，这不仅因为它对克里斯蒂安·沃尔夫及其学派重要，也因为“恰恰这一点在莱布尼茨哲学的通常呈现中被忽视”（同上，114）。他这样评价自有其理由，因为相关著述大多正是在他自己的版本中方得寓目（Leibniz 1839/40）[^leibniz-1839]。埃尔德曼讨论了莱布尼茨的诸演算，称之为以“计算的方式”对数据进行“方法性操作”。他提到莱布尼茨为演算设想一种文字的念头：使用符号而无需时时顾及特定含义。这种“万国笔语”将消除诸语言之间的差异；但照埃尔德曼的评价，普遍语言的观念并非莱布尼茨兴趣的中心。莱布尼茨的要点是：“推理中的一切错误都会立刻显示为文字的错误组合；因此应用特征文字提供了一种手段，可以像在一切其他计算中那样发现争议之点上的错误”（同上，122–123）。
