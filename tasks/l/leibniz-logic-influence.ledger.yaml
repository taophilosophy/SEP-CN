      As a secretary of the Academy, Trendelenburg was charged with honoring Leibniz’s memory. Leibniz had been the first president of the “Societät der Wissenschaften” at Berlin, the predecessor institution of the Royal Prussian Academy of Science, founded on his initiative in 1700. In 1856, Trendelenburg delivered a seminal lecture entitled “Über Leibnizens Entwurf einer allgemeinen Charakteristik” at the Leibniz ceremony of the Academy at Berlin (Trendelenburg 1857)[^trendelenburg-1857]. This paper was reprinted in the third volume of his *Historische Beiträge zur Philosophie* (1867). In this discussion of Leibniz, Trendelenburg stressed the essential role of signs in communication and reasoning. There is no logical relation between sign and intuition, but science has provided the opportunity to “bring the composition of the signs into immediate contact with contents of the concept” (Trendelenburg 1857, 3)[^trendelenburg-1857]. The composition of the sign presents the characteristic marks distinguished and comprehended in the concept (ibid.). Trendelenburg called such a script “Begriffsschrift”. Maybe he took over this term from Wilhelm von Humboldt who had introduced it in 1824 (v. Humboldt 1826, quoted 1848, 532; cf. Thiel 1995, 20)[^humboldt-1826][^thiel-1995]. According to Trendelenburg the beginnings of a *Begriffsschrift* were made, e.g., in the decimal number system. Trendelenburg saw the objectives of Leibniz’s program as widening such an approach to the complete domain of objects, thereby aiming at a “characteristic language of concepts” and a “general language of matter.” He mentioned the different names used by Leibniz: *lingua characterica universalis* (in fact Trendelenburg’s term; Leibniz used *characteristica universalis*), alphabet of human thoughts, *calculus philosophicus*, *calculus ratiocinator*, *spécieuse générale*. These names underline the significance Leibniz ascribed to this program for his philosophy. According to Trendelenburg, Leibniz aimed at “an adequate and therefore general signification of the essence [of conceptual content], namely by such analysis into the elements of concepts, that it becomes possible to treat it by calculation” (ibid., 6). He mentioned as historical precursors the *ars magna* of Raymundus Lullus and other conceptions of universal languages. Because of its generality, Leibniz’s *characteristica universalis* stands out compared with competing proposals by George Dalgarno (1661) and John Wilkins (1668), which were obtained from “choice, nature and chance,” and relied upon existing languages (ibid., 14–15).
    step1: |-
      作为科学院的秘书，特伦德伦堡受命纪念莱布尼茨。莱布尼茨曾是柏林“科学会”的第一任会长——那是王家普鲁士科学院的前身机构，1700 年依其倡议而创立。1856 年，特伦德伦堡在柏林科学院的莱布尼茨纪念会上发表了一篇开创性演讲，题为“论莱布尼茨的普遍文字方案”（Trendelenburg 1857）[^trendelenburg-1857]。这篇文章重印于其《哲学史论集》第三卷（1867）。在这篇对莱布尼茨的讨论中，特伦德伦堡强调符号在交流与推理中的关键作用。符号与直观之间没有逻辑关系，但科学提供了机会，“使符号的组合与概念的内容直接接触”（Trendelenburg 1857, 3）[^trendelenburg-1857]。符号的组合呈现概念中所分辨、所把握的特征标记（同上）。特伦德伦堡把这样一种文字称为“概念文字”。也许他是从威廉·冯·洪堡那里接过这个术语的——后者于 1824 年引入它（v. Humboldt 1826，转引 1848, 532；参见 Thiel 1995, 20）[^humboldt-1826][^thiel-1995]。照特伦德伦堡的说法，*概念文字*的开端已见于例如十进制数系。特伦德伦堡把莱布尼茨方案的目标看作把这样一种进路拓宽到对象的完整领域，从而以“概念的特征语言”与“质料的普遍语言”为目标。他提到莱布尼茨使用的各种名称：*lingua characterica universalis*（其实是特伦德伦堡的术语；莱布尼茨用 *characteristica universalis*）、人类思想的字母、*calculus philosophicus*、*calculus ratiocinator*、*spécieuse générale*。这些名称凸显了莱布尼茨赋予这一方案在其哲学中的重要性。照特伦德伦堡的说法，莱布尼茨的目标是“对[概念内容的]本质给予充分并因此一般的意谓，即通过这样一组分析，分析到概念的诸元素，以致可以按计算来处理它”（同上，6）。他提到历史上的先驱：拉蒙·卢尔的*ars magna*（伟大技艺）与其他普遍语言的构想。由于其一般性，莱布尼茨的*characteristica universalis*与乔治·达尔加诺（1661）和约翰·威尔金斯（1668）的竞争性方案相比卓然出众——后二者得自“选择、自然与偶然”，依赖既有语言（同上，14–15）。
