      If this thesis of the independence of 19th-century algebra of logic from Leibniz is accepted, it is possible to connect the discovery of Leibniz, the logician, with the Leibniz renaissance in early 20th century. In addition to Couturat’s book *La logique de Leibniz d’après des documents inédits* (1901), with a presentation of Leibniz’s logic in the spirit of the new logic (cf. Schmid 2012)[^schmid-2012], the following landmark publications have to be mentioned: Bertrand Russell’s *A Critical Exposition of the Philosophy of Leibniz* (1900), providing an axiomatic deductive reconstruction of Leibnizian metaphysics (cf. Griffin 2012)[^griffin-2012], and Ernst Cassirer’s *Leibniz’ System in seinen wissenschaftlichen Grundlagen* (1902), focussing on a Neo-Kantian interpretation of Leibniz’s philosophy (cf. Seidengart 2012)[^seidengart-2012]. Undoubtedly, Couturat’s edition of Leibniz’s *Opuscules et fragments inédits de Leibniz* (Leibniz 1903)[^leibniz-1903], taken from the manuscripts in the Royal Library in Hanover and published in 1903, gave for the first time access to the wealth of Leibniz’s different approaches to logic.
    step1: |-
      如果接受十九世纪逻辑代数独立于莱布尼茨这一论题，那么就有可能把逻辑学家莱布尼茨的发现同二十世纪初的莱布尼茨复兴联系起来。除了库蒂拉的《根据未刊文献论莱布尼茨的逻辑》（1901）——以新逻辑的精神呈现莱布尼茨的逻辑（参见 Schmid 2012）[^schmid-2012]——还必须提到下面几部里程碑式的出版物：伯特兰·罗素的《对莱布尼茨哲学的批判性论述》（1900），对莱布尼茨形而上学作公理演绎重构（参见 Griffin 2012）[^griffin-2012]；恩斯特·卡西尔的《莱布尼茨体系在其科学基础上》（1902），聚焦于对莱布尼茨哲学的新康德主义解释（参见 Seidengart 2012）[^seidengart-2012]。毫无疑问，库蒂拉编纂的《莱布尼茨未刊短篇与残篇》（Leibniz 1903）[^leibniz-1903]——取自汉诺威王家图书馆的手稿、1903 年出版——首次使人得以接触莱布尼茨通达逻辑的诸多进路之全貌。
    step2: |-
      若接受十九世纪逻辑代数独立于莱布尼茨这一论题，那么便可以把“逻辑学家莱布尼茨”的发现，同二十世纪初的莱布尼茨复兴联系起来。除了库蒂拉的《根据未刊文献论莱布尼茨的逻辑》（1901）——以新逻辑的精神呈现莱布尼茨的逻辑（参见 Schmid 2012）[^schmid-2012]——还须提及几部里程碑式的出版物：伯特兰·罗素的《对莱布尼茨哲学的批判性论述》（1900），对莱布尼茨形而上学作公理演绎重构（参见 Griffin 2012）[^griffin-2012]；恩斯特·卡西尔的《莱布尼茨体系在其科学基础上》（1902），聚焦于莱布尼茨哲学的新康德主义解释（参见 Seidengart 2012）[^seidengart-2012]。毫无疑问，库蒂拉编纂的《莱布尼茨未刊短篇与残篇》（Leibniz 1903）[^leibniz-1903]——取自汉诺威王家图书馆的手稿、1903 年刊行——首次使人得以窥见莱布尼茨通达逻辑的诸般进路之全貌。
