      Finally, John Venn (1834–1923) has to be mentioned. His *Symbolic Logic* (1881) is important for the historical contextualization of the new logic. He criticized Jevons’ statement on the Law of Duality according to which “the late Professor Boole is the only logician in modern times who has drawn attention to this remarkable property of logical terms” as being simply false. Besides, Leibniz, Lambert, Ploucquet and Segner had anticipated the law “perfectly explicitly” and he had no doubts “that any one better acquainted than myself with the Leibnitzian and Wolfian logicians could add many more such notices” (Venn 1881, xxxi, footnote 1)[^venn-1881].
    step1: |-
      最后必须提到约翰·文恩（1834–1923）。他的《符号逻辑》（1881）对新逻辑的历史语境化很重要。他批评杰文斯关于二值律的说法——“已故的布尔教授是现代唯一注意到逻辑词项这一显著性质的逻辑学家”——是彻头彻尾的错误。此外，莱布尼茨、兰伯特、普卢凯与塞格纳已经“完全明确地”预见了这条定律；他毫不怀疑“任何比我更熟悉莱布尼茨派与沃尔夫派逻辑学家的人都能补充更多这样的按语”（Venn 1881, xxxi，脚注 1）[^venn-1881]。
    step2: |-
      最后必须提到约翰·文恩（1834–1923）。他的《符号逻辑》（1881）对新逻辑的历史语境化颇为重要。他批评杰文斯关于二值律的说法——“已故的布尔教授是现代唯一注意到逻辑词项这一显著性质的逻辑学家”——斥之为彻头彻尾的错误。此外，莱布尼茨、兰伯特、普卢凯与塞格纳早已“完全明确地”预见了这条定律；他毫不怀疑“任何比我更熟悉莱布尼茨派与沃尔夫派逻辑学家的人，都能补充更多这样的按语”（Venn 1881, xxxi，脚注 1）[^venn-1881]。
