      Johann Eduard Erdmann studied theology and philosophy at Tartu and Berlin (cf. Glockner 1932)[^glockner-1932]. Friedrich Schleiermacher and Georg Friedrich Wilhelm Hegel were among his teachers. He later became a member of the right wing Hegelian school. In 1839 he was appointed full professor of philosophy at the University of Halle. Erdmann became well-known for his comprehensive history of modern philosophy entitled *Versuch einer wissenschaftlichen Darstellung der Geschichte der Neueren Philosophie* (“Attempt at a scientific presentation of the history of recent philosophy”), published in seven volumes (Erdmann 1834–1853)[^erdmann-1834]. This history of philosophy covers the period between Descartes and Hegel. In part 2 of vol. 2 of this work, Erdmann presented a discussion of Leibniz and the development of idealism before Kant. This presentation was published in 1842, two years after his edition of Leibniz’s philosophical works. Erdmann reported that while preparing his history he grew unsatisfied with the available editions of Leibniz’s works. He therefore intended to unite Raspe’s edition with the philosophical parts of Dutens’ edition and some pieces from the unpublished papers. He started editorial work at the archive in Hanover in 1836.
    step1: |-
      约翰·爱德华·埃尔德曼在塔尔图与柏林学习神学与哲学（参见 Glockner 1932）[^glockner-1932]。弗里德里希·施莱尔马赫与格奥尔格·弗里德里希·威廉·黑格尔都在他的老师之列。他后来成为黑格尔学派右翼的成员。1839 年他被聘为哈勒大学哲学正教授。埃尔德曼以其现代哲学通史闻名，题为《近代哲学史之科学性呈现的尝试》，凡七卷（Erdmann 1834–1853）[^erdmann-1834]。这部哲学史涵盖从笛卡尔到黑格尔的时期。在该书第二卷第二部分，埃尔德曼讨论了莱布尼茨与康德以前唯心论的发展。这一论述刊于 1842 年，即其莱布尼茨哲学著作集出版之后两年。埃尔德曼自述，撰写其哲学史期间，他对现有的莱布尼茨著作版本渐生不满。因此他打算把拉斯佩版与迪唐版的哲学部分以及未刊文稿中的某些篇什合而为一。1836 年他开始在汉诺威档案馆从事编辑工作。
