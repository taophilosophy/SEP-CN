      Heinrich Scholz, a great admirer of Leibniz and author of the first history of modern logic (Scholz 1931)[^scholz-1931], argues along the same lines. For him, Leibniz is the creator of logistic, i.e., modern formal logic using logical calculi (Scholz 1931, 54, n. 9)[^scholz-1931]. Scholz reports that Leibniz inspired 18th-century logicians in Germany, above all Johann Heinrich Lambert (1728–1777) and Gottfried Ploucquet (1716–1790). But then he stresses (ibid., 56) that the logical calculi created in the middle of the 19th century by the English logician Augustus De Morgan and George Boole living in Ireland were completely independent of Leibniz and German 18th-century research on logic. These calculi were amplified by the German mathematician Ernst Schröder in his monumental *Vorlesungen über die Algebra der Logik* (Schröder 1890–1905)[^schröder-1890].
    step1: |-
      海因里希·肖尔茨——莱布尼茨的仰慕者、第一部现代逻辑史的作者（Scholz 1931）[^scholz-1931]——沿同样的思路论证。在他看来，莱布尼茨是逻辑斯缔的创造者，即使用逻辑演算的现代形式逻辑（Scholz 1931, 54, n. 9）[^scholz-1931]。肖尔茨说，莱布尼茨启发了十八世纪德国的逻辑学家，尤其是约翰·海因里希·兰伯特（1728–1777）与戈特弗里德·普卢凯（1716–1790）。但他随后强调（同上，56），十九世纪中叶由英格兰逻辑学家奥古斯都·德摩根与旅居爱尔兰的乔治·布尔所创造的逻辑演算，完全独立于莱布尼茨与十八世纪德国的逻辑研究。这些演算后来由德国数学家恩斯特·施罗德在其巨著《逻辑代数讲义》中加以扩充（Schröder 1890–1905）[^schröder-1890]。
    step2: |-
      海因里希·肖尔茨——莱布尼茨的仰慕者、第一部现代逻辑史的作者（Scholz 1931）[^scholz-1931]——持论相仿。在他看来，莱布尼茨是逻辑斯缔（logistic）的创造者，即运用逻辑演算的现代形式逻辑（Scholz 1931, 54, n. 9）[^scholz-1931]。肖尔茨说，莱布尼茨曾启发十八世纪德国的逻辑学家，尤以约翰·海因里希·兰伯特（1728–1777）与戈特弗里德·普卢凯（1716–1790）为著。但他随后强调（同上，56）：十九世纪中叶由英格兰逻辑学家奥古斯都·德摩根与旅居爱尔兰的乔治·布尔所创造的逻辑演算，完全独立于莱布尼茨与十八世纪德国的逻辑研究。这些演算后来由德国数学家恩斯特·施罗德在其巨著《逻辑代数讲义》（*Vorlesungen über die Algebra der Logik*）中加以扩充（Schröder 1890–1905）[^schröder-1890]。
