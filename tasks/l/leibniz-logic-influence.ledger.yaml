      Trendelenburg, however, did not welcome all the elements of Leibniz’s program. He heavily criticized its practical side, in particular, calculation in logic. The connection of properties in a concept is much more complicated than can be expressed with Leibniz’s operations (ibid., 24). He recommended abstaining from calculation (Trendelenburg 1857, 55)[^trendelenburg-1857]:
    step1: |-
