      Erdmann’s edition induced a second wave of reception. This reception is characterized by an interest in Leibniz’s ideas on logic. Its context was the reorganization of the philosophical scene after Hegel’s death (1831). This process was connected with a discussion of the so-called “Logical Question”, a term created by Adolf Trendelenburg (Trendelenburg 1842)[^trendelenburg-1842] who initiated these debates. The discussions concerned the role of formal logic in the system of philosophy (cf. Peckhaus 1997, 130–163; Peckhaus 1999; Vilkko 2002, 56–81; Vilkko 2009)[^peckhaus-1997][^peckhaus-1999][^vilkko-2002][^vilkko-2009]. The authors aimed at overcoming Hegel’s identification of logic and metaphysics without re-establishing the old system of Aristotelian logic. The philosophical dominance of metaphysics was subsequently replaced by that of epistemology.
    step1: |-
      埃尔德曼的版本引发了接受的第二波。这次接受的特点是对莱布尼茨逻辑观念的兴趣。其背景是黑格尔死后（1831）哲学界的重组。这一过程与对所谓“逻辑问题”的讨论相联系——这个词是阿道夫·特伦德伦堡创造的（Trendelenburg 1842）[^trendelenburg-1842]，他也是这些辩论的发起者。讨论关乎形式逻辑在哲学体系中的角色（参见 Peckhaus 1997, 130–163; Peckhaus 1999; Vilkko 2002, 56–81; Vilkko 2009）[^peckhaus-1997][^peckhaus-1999][^vilkko-2002][^vilkko-2009]。作者们的目标，是克服黑格尔对逻辑与形而上学的等同，而不重建亚里士多德逻辑的旧体系。形而上学在哲学中的主导地位，随后被认识论的主导地位所取代。
