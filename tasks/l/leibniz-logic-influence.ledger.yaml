    source: |-
      It seems to be in accord with the second position that the pioneers of modern logic themselves referred to Leibniz. George Boole’s widow, Mary Everest Boole, e.g., wrote that her husband, having been informed of Leibniz’s anticipations of his own logic, felt “as if Leibnitz had come and shaken hands with him across the centuries” (M. E. Boole 1905, quoted in Laita 1976, 243)[^boole-1905][^laita-1976]. William Stanley Jevons, who was responsible for the great public success of modern logic in Great Britain after Boole, claimed that “Leibnitz’ logical tracts are […] evidence of his wonderful sagacity” (Jevons 1883 [1874], xix). Ernst Schröder thought that Leibniz’s ideal of a logical calculus had been brought to perfection by George Boole (Schröder 1877, III)[^schröder-1877]. The special controversy between Ernst Schröder and Gottlob Frege which was at the root of the later distinction between two kinds of modern logic, the algebra of logic and the Frege-style mathematical logic, was centered on the question how far the Leibnizian heritage was present in the respective variations of logic. In his *Begriffsschrift,* Frege had written that the idea of a general characteristic, of a *calculus philosophicus* or *ratiocinator* was too ambitious to be achieved by Leibniz alone. Frege’s own *Begriffsschrift* provides the first steps towards this goal, which can be found in the formula languages of arithmetic and chemistry (Frege 1879, VI)[^frege-1879]. In his review of Frege’s *Begriffsschrift*, Schröder (Schröder 1880, 82)[^schröder-1880] objected that the title “Begriffsschrift” promises too much. According to Schröder, Frege’s system is less of a ‘general characteristic’ and more of a *calculus ratiocinator*, and its development would have been significant, had it not already been achieved by others (esp. by Boole). Frege replied (Frege 1883, 1)[^frege-1883] that he did not intend to present an abstract logic in formulae like Boole, but to express contents by written signs in a more precise and clear manner than it would be possible by words. Therefore the *Begriffsschrift* is not a mere *calculus ratiocinator*, but a *lingua characteristica* in the Leibnizian sense, although he accepted that inferential calculation (*schlussfolgernde Rechnung*) was a necessary constituent of the *Begriffsschrift*.
    step1: |-
      现代逻辑的先驱们自己也援引莱布尼茨，这似乎与第二种立场相合。例如，乔治·布尔的遗孀玛丽·埃弗雷斯特·布尔写道：她的丈夫在得知莱布尼茨预见了其自己的逻辑之后，感觉“仿佛莱布尼茨跨过几个世纪走来，与他握了握手”（M. E. Boole 1905，转引自 Laita 1976, 243）[^boole-1905][^laita-1976]。继布尔之后在英国推动现代逻辑获得巨大公众成功的威廉·斯坦利·杰文斯主张，“莱布尼茨的逻辑论著……是其惊人洞察力的证据”（Jevons 1883 [1874], xix）。恩斯特·施罗德认为，莱布尼茨的逻辑演算理想已由乔治·布尔臻于完善（Schröder 1877, III）[^schröder-1877]。恩斯特·施罗德与戈特洛布·弗雷格之间的那场特殊论战——它后来演变为现代逻辑两种形态之分野的根源，即逻辑代数与弗雷格式数学逻辑——正围绕莱布尼茨遗产在各自逻辑变体中体现到何种程度而展开。弗雷格在《概念文字》中曾写道：普遍文字的观念、*calculus philosophicus*（哲学演算）或 *ratiocinator*（推理演算）的观念，对莱布尼茨一人而言过于宏大，难以实现。弗雷格自己的《概念文字》提供了迈向这一目标的第一步——这一目标可见于算术与化学的公式语言（Frege 1879, VI）[^frege-1879]。在评弗雷格的《概念文字》时，施罗德（Schröder 1880, 82）[^schröder-1880]提出异议：“概念文字”这一标题许诺过多。照施罗德的看法，弗雷格的体系与其说是“普遍文字”，不如说是*推理演算*（*calculus ratiocinator*）；它的发展本会意义重大，倘若它不曾已被他人（尤其是布尔）达成。弗雷格答复（Frege 1883, 1）[^frege-1883]说，他不打算像布尔那样用公式呈现一种抽象逻辑，而是要以书面符号表达内容，比词语所能做到的更精确、更清晰。因此《概念文字》不只是一个*推理演算*，而是莱布尼茨意义上的*特征语言*（*lingua characteristica*），尽管他也承认推论计算（*schlussfolgernde Rechnung*）是《概念文字》的必要成分。
