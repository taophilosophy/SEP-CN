  - id: 4
    kind: body
    source: |-
      Leibniz’s impact on the emergence of modern logic, be it mathematical, algebraic, algorithmic or symbolic logic, is an important topic for understanding the emergence and development of the logic predominant today (on Leibniz’s papers and editions cf. Waldhoff 2022; on Leibniz’s influence and reception cf. Heinekamp (ed.) 1986; on his influence in logic cf. Peckhaus 1997, 2020). However, the question whether Leibniz had any influence at all, or whether his ideas were rather not more than ingenious anticipations of later developments, is still disputed. The significance of this problem can be shown by referring to Louis Couturat, who claimed that in respect to the logical calculus Leibniz already had all the principles of much more recent logical systems of the algebra of logic (George Boole, Ernst Schröder) and was even more advanced in some points (Couturat 1901, 386)[^couturat-1901]. But did early “modern” logicians like Boole, Schröder, or Frege have any knowledge of Leibnizian logic, i.e., could Leibniz have had any influence on these pioneers of modern logic?
    step1: |-
      莱布尼茨对现代逻辑之兴起的影响——无论那是数学逻辑、代数逻辑、算法逻辑还是符号逻辑——是理解今日占主导地位的逻辑之兴起与发展的一个重要论题（关于莱布尼茨的文稿与版本，参见 Waldhoff 2022；关于其影响与接受，参见 Heinekamp (ed.) 1986；关于其在逻辑中的影响，参见 Peckhaus 1997, 2020）。然而，莱布尼茨究竟有没有任何影响，抑或他的观念不过是对后来发展的天才预见，仍有争议。这个问题的分量，可以借路易·库蒂拉（Louis Couturat）来显示：他主张，就逻辑演算而言，莱布尼茨已经拥有逻辑代数（乔治·布尔、恩斯特·施罗德）那些晚近得多的逻辑系统的全部原则，而且在某些点上更为先进（Couturat 1901, 386）[^couturat-1901]。但布尔、施罗德或弗雷格这些早期“现代”逻辑学家，对莱布尼茨逻辑有任何了解吗？也就是说，莱布尼茨可能对这些现代逻辑的先驱有过任何影响吗？
    step2: |-
      莱布尼茨对现代逻辑——无论数学逻辑、代数逻辑、算法逻辑抑或符号逻辑——之兴起的影响，是理解今日占主导地位的逻辑之缘起与发展的一个重要论题（莱布尼茨文稿与版本，参见 Waldhoff 2022；其影响与接受，参见 Heinekamp (ed.) 1986；其在逻辑中的影响，参见 Peckhaus 1997, 2020）。然而，莱布尼茨究竟有无影响，抑或其观念不过是对后来发展的天才预见，至今仍有争议。这个问题的分量，借路易·库蒂拉（Louis Couturat）即可显示：他主张，就逻辑演算而论，莱布尼茨已拥有逻辑代数（乔治·布尔、恩斯特·施罗德）那些晚近得多的逻辑系统的全部原则，且在某些点上更为先进（Couturat 1901, 386）[^couturat-1901]。可是，布尔、施罗德、弗雷格这些早期“现代”逻辑学家，对莱布尼茨逻辑可有任何了解？换言之，莱布尼茨可曾对这些现代逻辑的先驱有过任何影响？
  - id: 5
    kind: body
    source: |-
      There are different answers to these questions. Wolfgang Lenzen, e.g., wrote that Leibniz was the most significant logician between Aristotle and Frege, but despite the enormous significance of his logic, he played hardly any role in the history of logic (Lenzen 2004a, 15; cf. also Lenzen 2004b)[^lenzen-2004a][^lenzen-2004b]. According to Lenzen, Leibniz’s mature logical theory was present in his *Generales Inquisitiones de Analysi Notionum et Veritatum*, which was only published in Couturat’s edition of Leibniz’s minor writings and fragments (Leibniz 1903, 356–399)[^leibniz-1903]. Couturat had already referred to it in his book on Leibniz’s logic which had appeared two years earlier (Couturat 1901)[^couturat-1901]. We find similar evaluations by William and Martha Kneale*,* who in *The Development of Logic* rank Leibniz among “the greatest of all logicians,” but stress “that his work on logic had little influence for nearly 200 years after he wrote it” (Kneale/Kneale 1962, 320)[^kneale-1962]. In the Kneales’ opinion, Leibniz had rather become notorious for claiming to have made great discoveries in logic while there was little published evidence for this claim.
    step1: |-
      对这些问题有不同的回答。例如 Wolfgang Lenzen 写道：莱布尼茨是亚里士多德与弗雷格之间最重要的逻辑学家，但尽管其逻辑意义重大，他在逻辑史中几乎没有扮演任何角色（Lenzen 2004a, 15；另参见 Lenzen 2004b）[^lenzen-2004a][^lenzen-2004b]。照 Lenzen 的说法，莱布尼茨成熟的逻辑理论见于其《概念与真理分析的一般探究》（*Generales Inquisitiones de Analysi Notionum et Veritatum*），后者直到库蒂拉编纂的莱布尼茨短篇著作与残篇集才得以刊布（Leibniz 1903, 356–399）[^leibniz-1903]。库蒂拉早在此前两年出版的论莱布尼茨逻辑的书中已提到它（Couturat 1901）[^couturat-1901]。威廉·涅尔与玛尔塔·涅尔也给出类似评价：他们在《逻辑学的发展》中把莱布尼茨列入“所有逻辑学家中的最伟大者”，但强调“他的逻辑著作在写成之后近两百年里影响甚微”（Kneale/Kneale 1962, 320）[^kneale-1962]。照涅尔夫妇的看法，莱布尼茨之所以出名，反倒是由于他声称在逻辑中作出了伟大发现，而支持这一声称的已刊证据却寥寥无几。
    step2: |-
      对这些问题，回答不一。例如 Wolfgang Lenzen 写道：莱布尼茨是亚里士多德与弗雷格之间最重要的逻辑学家；但尽管其逻辑意义重大，他在逻辑史上几乎不曾扮演任何角色（Lenzen 2004a, 15；另参见 Lenzen 2004b）[^lenzen-2004a][^lenzen-2004b]。照 Lenzen 所考，莱布尼茨成熟的逻辑理论见于其《概念与真理分析的一般探究》（*Generales Inquisitiones de Analysi Notionum et Veritatum*）——此作直到库蒂拉编纂的莱布尼茨短篇著作与残篇集方得刊布（Leibniz 1903, 356–399）[^leibniz-1903]。库蒂拉在早两年出版的论莱布尼茨逻辑的书中已提及它（Couturat 1901）[^couturat-1901]。威廉·涅尔与玛尔塔·涅尔的评价类似：他们在《逻辑学的发展》中把莱布尼茨列入“所有逻辑学家中的最伟大者”，却强调“其逻辑著作在写成之后近两百年里影响甚微”（Kneale/Kneale 1962, 320）[^kneale-1962]。照涅尔夫妇之见，莱布尼茨之出名反倒近乎恶名：他声称在逻辑中作出了伟大发现，而支持这一声称的已刊证据却寥寥无几。
