      Other authors assign Leibniz a key role in the development of modern logic. Eric J. Aiton, e.g., wrote that the Leibnizian project of a universal characteristic and the logical calculi resulting from it, “played a significant role in the history of logic” (1985, ix). Franz Schupp, starting from Couturat’s evaluation quoted earlier, assumed “that the Leibnizian logic might be relevant for the further development of modern logic, beyond the historically interesting aspect of an ‘ingenious anticipation’” (Schupp 1988, 42)[^schupp-1988]. Schupp wrote that every step in the development of modern logic led to new insights into the Leibnizian logic, but sometimes dealing with Leibniz influenced the development itself.
    step1: |-
      另一些作者则赋予莱布尼茨在现代逻辑发展中的关键角色。例如 Eric J. Aiton 写道，莱布尼茨的普遍文字方案及由此产生的逻辑演算“在逻辑史上发挥了重要作用”（1985, ix）。Franz Schupp 从前面引述的库蒂拉评价出发，认为“莱布尼茨逻辑可能对现代逻辑的进一步发展有意义，而不止于‘天才预见’这一历史上有趣的方面”（Schupp 1988, 42）[^schupp-1988]。Schupp 写道，现代逻辑发展的每一步都带来对莱布尼茨逻辑的新洞见，但有时处理莱布尼茨反过来影响了发展本身。
    step2: |-
      另一些作者则把关键角色派给莱布尼茨。例如 Eric J. Aiton 写道：莱布尼茨的普遍文字方案及由此产生的逻辑演算，“在逻辑史上发挥了重要作用”（1985, ix）。Franz Schupp 从前引库蒂拉的评价出发，认为“莱布尼茨逻辑可能对现代逻辑的进一步发展有意义——而不止于‘天才预见’这一历史上有趣的方面”（Schupp 1988, 42）[^schupp-1988]。Schupp 写道：现代逻辑发展的每一步，都带来对莱布尼茨逻辑的新洞见；但有时，处理莱布尼茨反过来影响了发展本身。
