      The most important figure in this second period of reception was Friedrich Adolf Trendelenburg (1802–1872). He had studied philology, history and philosophy at the universities of Kiel, Leipzig and Berlin (cf. Bratuschek 1872; Vilkko 2002, 56–81; Vilkko 2009, 211–217; Peckhaus 2007)[^bratuschek-1872][^peckhaus-2007][^vilkko-2002][^vilkko-2009]. Among his teachers were Karl Leonhard Reinhold and Johann Erich von Berger. He became professor in 1833; in 1837 he was promoted to full professor of practical philosophy and education at the Friedrich-Wilhelms-University Berlin where he grew into one of the main leaders of Prussian education and German philosophy. An ordinary member of the Royal Prussian Academy of Science at Berlin since 1846, he became the secretary of the Philosophical-Historical Section of this Academy in 1847. Trendelenburg was an anti-Hegelian who started from Hegelian philosophy. His fame as a neo-Aristotelian goes back to his *Elementa logices Aristotelicae*, first published in 1836 with five further editions (Trendelenburg 1836)[^trendelenburg-1836]. In his systematic work on logic he pleaded for a unity of logic and metaphysics as found in the Aristotelian organon. This systematic attitude is developed in a comprehensive work containing heavy criticism of logical systems of his time, his *Logische Untersuchungen*, published in two volumes in 1840 (Trendelenburg 1840)[^trendelenburg-1840].
    step1: |-
      接受第二时期最重要的人物是弗里德里希·阿道夫·特伦德伦堡（1802–1872）。他曾在基尔、莱比锡与柏林大学学习语文学、历史与哲学（参见 Bratuschek 1872; Vilkko 2002, 56–81; Vilkko 2009, 211–217; Peckhaus 2007）[^bratuschek-1872][^peckhaus-2007][^vilkko-2002][^vilkko-2009]。卡尔·莱昂哈德·赖因霍尔德与约翰·埃里希·冯·贝格尔都在他的老师之列。他于 1833 年成为教授；1837 年升任柏林弗里德里希-威廉大学实践哲学与教育学正教授，并在那里成长为普鲁士教育与德国哲学的主要领袖之一。自 1846 年起任柏林王家普鲁士科学院正式院士，1847 年出任该院哲学-历史学部秘书。特伦德伦堡是一个从黑格尔哲学出发的反黑格尔主义者。他作为新亚里士多德主义者的名声，源于其《亚里士多德逻辑要义》，1836 年初版、后又五版（Trendelenburg 1836）[^trendelenburg-1836]。在其系统的逻辑著作中，他为逻辑与形而上学的统一辩护，如亚里士多德《工具论》中所见。这种系统态度在一部综述性著作中得到发展——该书严厉批评其时代的逻辑系统，即 1840 年出版的两卷本《逻辑研究》（Trendelenburg 1840）[^trendelenburg-1840]。
