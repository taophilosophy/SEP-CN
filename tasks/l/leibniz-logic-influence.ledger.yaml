      The “Nouveaux Essais” count as Leibniz’s main work in epistemology. They were written between 1703 and 1705 and contained criticism of John Locke’s *An* *Essay Concerning Human Understanding* (Locke 1690)[^locke-1690]. Locke died in 1704 when Leibniz was still working on the essays. The text caused a great sensation when it was published by Raspe. It can therefore be regarded as a key text for the reception of Leibniz in the late 18th and the 19th century. Logical considerations can be found in the fourth book “De la connaissance”. They concentrate on the theory of syllogism, but all elements of Leibniz’s theory of logic are present, to the extent that they are regarded as a device for the evaluation of the validity of given theses (*ars iudicandi*) and for finding new truths on the basis of given truths (*ars inveniendi*).
    step1: |-
      《新论》被视为莱布尼茨在认识论方面的主要著作。它写于 1703 至 1705 年间，包含对约翰·洛克《人类理解论》（Locke 1690）[^locke-1690]的批评。洛克死于 1704 年，当时莱布尼茨仍在写作此书。该书经拉斯佩刊布后引起巨大轰动。因此它可以被看作十八世纪末与十九世纪莱布尼茨接受的关键文本。逻辑方面的思考见于第四卷“论认识”。它们集中于三段论理论，但莱布尼茨逻辑理论的全部要素都在场——就此而言，逻辑被看作评价给定论题之有效性（判断术）以及在此基础上发现新真理（发明术）的装置。
    step2: |-
      《新论》被视为莱布尼茨在认识论方面的主要著作。它写于 1703 至 1705 年间，包含对约翰·洛克《人类理解论》（Locke 1690）[^locke-1690]的批评。洛克死于 1704 年，彼时莱布尼茨仍在写作此书。经拉斯佩刊布后，此书引起巨大轰动；因此可视为十八世纪末与十九世纪莱布尼茨接受的关键文本。逻辑方面的思考见于第四卷“论认识”（De la connaissance）：集中于三段论理论，但莱布尼茨逻辑理论的全部要素俱在——在此，逻辑被看作评价给定论题之有效性（判断术，*ars iudicandi*）以及据给定真理发现新真理（发明术，*ars inveniendi*）的装置。
