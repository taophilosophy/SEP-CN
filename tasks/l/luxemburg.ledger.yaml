      While remaining sensitive to the historical circumstances that constrained the Bolsheviks (war, the pressure from the outside, the difficulties in the development of the working class movement in Russia, and the infancy of its democratic institutions), Luxemburg was one of the first Marxist theorists to highlight the importance of combining the struggle for socialism with that for democracy, and to warn against the dangers of divorcing the two. The history of socialist states in the 20ᵗʰ century has proved her right. The concentration of power in the hands of a narrow elite of party officials, the lack of transparency and accountability of institutions, their progressive isolation from the demands of the people, ultimately led to their demise. The ongoing importance of Luxemburg’s writings on the Bolshevik revolution lies not so much in her commentary on a historical experiment of which she always doubted the capacity to survive historical constraints. It consists in what they tell us about the ethics of revolution and the difficulties of constructing a movement of the oppressed which must realise freedom in circumstances in which it may lack the historical maturity, material and epistemic means that the maintenance of the status quo makes available.
    step1: |-
      卢森堡对约束布尔什维克的历史处境（战争、外部压力、俄国工人阶级运动发展的困难以及其民主制度的幼年）始终保持着敏感；同时，她是最早强调把社会主义斗争与民主斗争结合起来、警告把二者割裂之危险马克思主义理论家之一。二十世纪社会主义国家的历史证明她是对的。权力集中于狭窄的党的官员精英之手、制度缺乏透明度与问责、它们与人民诉求的逐渐隔绝，最终导致其覆亡。卢森堡关于布尔什维克革命的著述之所以持续重要，与其说在于她对一场历史实验的评论——她始终怀疑这场实验能否经受历史约束而存活；不如说在于它们告诉我们的东西：革命的伦理，以及建构受压迫者运动的种种困难——这个运动必须在缺乏历史成熟度、物质与认识手段的处境中实现自由，而维持现状倒使这些手段唾手可得。
