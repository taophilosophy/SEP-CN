      为阐明后一选项，她的分析兼取经济与政治两路论证，聚焦全球化的结构以及民族国家在金融化经济体系中的角色。所得结论却与伯恩施坦截然相反。伯恩施坦把信贷与借贷体系的发展解释为资本主义秩序内部的稳定机制；在卢森堡看来，垄断者、公司、银行及其他金融机构对经济权力的集中，是脆弱性的症候，而非资产。针对伯恩施坦关于信用可避免资本主义崩溃的评论，她强调：金融资本主义与贷款之唾手可得，只会加剧危机，绝非解救之道。卢森堡论证：信用助长投机，扩大了所谓真实经济与虚拟经济之间的鸿沟。诚然，信用起初刺激生产力的发展，却也足以招致计算失误与生产过剩——停滞的征兆甫一出现，它便在交换过程中失去助益。同样，卡特尔、托拉斯等旨在增进资本持有者之间协调的规制机制，唯有在个别产业内部消除竞争方能奏效，而这绝无可能推广到一切生产部门。况且，卡特尔之所以能提高国内市场的利润率，全凭向外扩张——把国内需求消化不了的产品倾销国外。换言之，卢森堡解释道：这些公司只能以更低的利润率，把国内市场消化不了的产品卖到国外。欧洲市场表面稳定的另一面，是国外竞争的白热化与世界市场的无政府状态——与卡特尔想达成的目标恰成反面。当全球市场因资本主义国家间的竞争而耗竭、开始萎缩时，经由组织而社会化的资本便退回私人资本，雇主组织“像肥皂泡一样破裂，让位于加剧形态的自由竞争”（Luxemburg 1900 [RLR: 137]）。
