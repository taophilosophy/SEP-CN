      In 1905, the first Russian revolution broke up, the “dress rehearsal” for the subsequent Bolshevik revolution of 1917, in Lenin’s famous sentence. It found the socialist movement deeply divided. In the West, socialist parties made steady electoral gains, and united superficially in recognition of the moral authority of the Second International but were deeply divided in matters of both principle and tactics. In Russia, there was no direct equivalent to the debate on reform versus revolution: socialists worked underground and were divided mainly on questions of membership and party organisation. The 1905 revolution which broke out after decades of impoverishment, a series of defeats by Russia in the Russo-Japanese war, and subjection to authoritarian violence was not so much a single event as the cumulative result of several years of mass strikes, border unrest, and demonstrations which forced Marxists to put the question of party organisation at the centre of their debates. Luxemburg, recently released from a few months in prison in Zwickau on a charge of undermining the authority of the German emperor, followed the events closely. She published several interventions in which she debated with Lenin on the role of the masses and the party in revolutionary circumstances, and tried to persuade her colleagues in the SPD to adopt the mass strike as a political weapon to advance the cause of workers also in Germany. In December 1905 she smuggled herself on a military train to the Russian part of Poland, and tried to reach Warsaw, where martial law coexisted with a general strike, to resume her work of agitation with the Polish working classes. Within a year she was arrested again, first confined to a police prison in the Warsaw town hall then transferred on grounds of ill-health to the Warsaw Citadel. There she spent a few months until her release following both her family’s intercessions and payment of the bail, and her reputation as one of the leading activists of the German SPD. Immediately after her release from prison she went to St Petersburg then Finland, where she met Lenin and wrote one of her most famous pamphlets: “The Mass Strike, the Party and the Trade Unions”, reflecting on the lessons of the 1905 revolution. The story goes that when she proposed these ideas to the SPD Party Congress of Jena in 1905, August Bebel, one of the party founders, joked that – as he listened to a debate with so much blood and revolution – he kept “glancing occasionally at my boots to see if these weren’t in fact already wading in blood” (Nettl 1966 [2019: 310])[^nettl-1966].
    step1: |-
      1905 年，第一次俄国革命爆发——用列宁的名句说，这是 1917 年布尔什维克革命的“总演习”。此时社会主义运动已深深分裂。在西方，社会政党选举稳步得利，表面上因承认第二国际的道德权威而团结，实则无论原则还是策略上都分歧深刻。在俄国，没有与改革对革命之争直接对应的辩论：社会主义者在地下工作，分歧主要在党员资格与党组织问题上。1905 年革命在数十年的贫困、俄国在日俄战争中一连串的失败以及专制暴力的压迫之后爆发；与其说它是一个单独事件，不如说是多年大规模罢工、边境骚乱与示威游行的累积结果，这些迫使马克思主义者把党组织问题置于辩论的中心。卢森堡——刚因“损害德国皇帝权威”的罪名在茨维考监狱服刑数月获释——密切关注着这些事件。她发表了好几篇文章，与列宁就革命形势下群众与政党的作用展开辩论，并力图说服 SPD 的同事们把群众罢工当作政治武器，在德国也推进工人事业。1905 年 12 月，她自己藏身于开往俄属波兰的军用火车，试图前往华沙——那里戒严与总罢工并存——以恢复她在波兰工人阶级中的鼓动工作。不到一年她再次被捕，先被关押在华沙市政厅的警察监狱，后因健康原因移押华沙城堡监狱。她在那里被关了数月，直至家人说情、缴纳保释金，加上她作为德国 SPD 领袖活动家之一的名声，方获释放。出狱后她立即前往彼得堡，再赴芬兰——在那里她见到列宁，并写下了她最著名的小册子之一：《群众罢工、党和工会》，反思 1905 年革命的教训。相传，当她 1905 年在耶拿 SPD 党代会上提出这些想法时，党的创始人之一奥古斯特·倍倍尔打趣说——听着这场浸满血与革命的辩论——他不时“瞥一眼自己的靴子，看看它们是不是已经在蹚血了”（Nettl 1966 [2019: 310]）[^nettl-1966]。
