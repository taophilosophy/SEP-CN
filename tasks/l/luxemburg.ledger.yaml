      1907 年回到德国后，这位被自由派报刊称作“血腥的罗莎”的人物受聘在党校任教，向 SPD 的普通党员讲授“经济学导论”与“马克思的《资本论》”。她根据讲义笔记写成的《经济学导论》只以片段传世，但 1913 年出版的《资本积累论》是第二国际所产生的最重要的理论著作之一。与此同时，她的政治立场继续朝着与 SPD 领导层相反的方向演变。领导层越来越不愿谴责威廉二世皇帝在摩洛哥的帝国主义冒险，这使她生动地意识到：煽动民族主义情绪以增加对可能的战争的支持是何等危险，而同事们对日益高涨的军国主义态度何等回避。她越来越感到孤立。当议会党团纠缠于税收与选举改革的辩论时，她著文鼓吹群众斗争的重要、争取民主共和国的鼓动以及无产阶级夺取政治权力。她的主张甚至招致昔日盟友如卡尔·考茨基的敌意，党的主要刊物拒绝发表她的作品。
