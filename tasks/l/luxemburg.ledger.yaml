      At the age of thirteen, Luxemburg joined the girls’ Second High School in Warsaw, one of the country’s elite schools, dominated by the children of Russian officials, where the use of Polish even among students was forbidden and the places for children of Jewish families were extremely limited. Luxemburg rebelled to the oppressive atmosphere in the school, and developed an interest in the activities of the various illegal revolutionary groups agitating against both capitalist oppression and the despotic character of Russian rule. By the time she finished secondary school in 1887, her “rebellious attitude towards authorities” was already mentioned in official school reports and deprived her of the gold medal awarded to the highest performing students (Nettl 1966 [2019: 17])[^nettl-1966]. It is also likely that during this time, she joined what was left of *Proletariat*, the first Polish socialist party, at that point in disarray after the imprisonment and execution of many of its leaders as a result of the repressive measures taken by Russian authorities following the assassination of Tzar Alexander II in 1881. Faced with imminent arrest herself, she was smuggled out of the country in 1889 and migrated to Zurich. There she enrolled in the faculty of philosophy, switched to law and wrote a doctoral dissertation on “The Industrial Development of Poland”, where she argued that the integration of the Polish economy into the Russian empire meant that the interests of the Polish working class would be held back by championing the cause of national self-determination – a position to which she would remain committed her entire life. In Zurich, Luxemburg also met several other Marxists from Russian and Polish emigres circles, including Leo Jogisches, her partner for many years and co-founder of the Social Democracy of the Kingdom of Poland (SDKP), a Marxist party characterised by its opposition to the call for Polish independence and its staunch commitment to proletarian internationalism.
    step1: |-
      十三岁时，卢森堡进入华沙第二女子中学——全国精英学校之一，俄国官员的子女在那里占主导地位，即使在学生中间也说波兰语是被禁止的，而犹太家庭的子女名额极其有限。卢森堡反抗学校里压抑的气氛，并对各种秘密革命团体的活动产生兴趣，这些团体既鼓动反对资本主义压迫，也反对俄国统治的专制性质。到 1887 年中学毕业时，官方的学业报告已经提到她“对权威的叛逆态度”，并因此使她失去了颁发给最优秀学生的金质奖章（Nettl 1966 [2019: 17]）[^nettl-1966]。很可能也是在这一时期，她加入了波兰第一个社会主义政党“无产阶级党”的残余力量——该党当时已陷于混乱，因为 1881 年沙皇亚历山大二世遇刺后俄国当局采取镇压措施，其许多领导人遭到监禁与处决。眼看自己 imminent 被捕，她于 1889 年被人偷送出国，移居苏黎世。在那里她进入哲学系，后转入法学，并以“波兰的工业发展”为题撰写博士论文。论文主张：波兰经济之整合进俄罗斯帝国，意味着波兰工人阶级的利益将因鼓吹民族自决事业而受制——这一立场她终身持守。在苏黎世，卢森堡还结识了来自俄国与波兰流亡圈的另几位马克思主义者，其中包括莱奥·约吉希斯（Leo Jogisches）——她多年的伴侣，也是波兰王国社会民主党（SDKP）的创始人之一；该马克思主义政党的特色，是反对波兰独立的号召，坚定致力于无产阶级国际主义。
    step2: |-
      十三岁时，卢森堡考入华沙第二女子中学——全国精英学校之一。校内俄国官宦子弟当道，即便在学生中间，说波兰语也在被禁之列，而留给犹太家庭子女的名额微乎其微。卢森堡起而反抗校内压抑的气氛，并对各类秘密革命团体的活动心生向往——它们既鼓动反对资本主义压迫，也反对俄国统治的专制本性。至 1887 年中学毕业，官方学业报告已写明她“对权威的叛逆态度”，她也因此与最优等生金质奖章失之交臂（Nettl 1966 [2019: 17]）[^nettl-1966]。很可能正是在这一时期，她加入了波兰第一个社会主义政党“无产阶级党”（*Proletariat*）的残部——1881 年沙皇亚历山大二世遇刺后，俄国当局厉行镇压，该党许多领导人或囚或戮，彼时已溃不成军。眼看逮捕在即，她于 1889 年被人偷送出境，移居苏黎世。在那里，她先入哲学系，后转法学，并以“波兰的工业发展”为题完成博士论文。论文主张：波兰经济既然整合于俄罗斯帝国，波兰工人阶级的利益便会因鼓吹民族自决而受掣肘——这一立场，她终身未尝改易。在苏黎世，卢森堡还结识了俄国与波兰流亡圈中的几位马克思主义者，其中有莱奥·约吉希斯（Leo Jogisches）——她多年的伴侣，也是波兰王国社会民主党（SDKP）的创始人之一。这个马克思主义政党以反对波兰独立号召、坚定信守无产阶级国际主义为特色。
