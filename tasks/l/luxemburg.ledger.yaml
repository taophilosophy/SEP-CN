      卢森堡是最早指出这种政党观念所蕴含之危险的人之一：党将与更广泛的运动渐行渐远。她固然为 1917 年十月革命欢呼——因为它表明工人国家并非无可救药的乌托邦——但她坚持：倘若脱离群众、得不到群众的指引，党很快会陷入官僚僵局，同社会的其余关切相隔绝，从而危及社会主义者许诺实现的那些自由。她的名言是：“只给政府的拥护者、只给一个党派成员——无论其人数多么众多——的自由，根本不是自由。自由向来是持不同思想者的自由”（Luxemburg 1922 [RLR: 305]）。她相信，这种持不同思想的自由，唯有同民主——理解为受压迫人民的统治——保持联系方能繁荣：在革命转折的环境中，磨砺引导他们所需的技能、认识洞见与观点。她相信，受压迫群众的政治教育，以及在实践中发展其观点的能力，是工人阶级统治的命脉。自由主义民主秩序可以依靠业已受教育的精英的合作维持稳定；受压迫运动的挑战则在于：在改造旧秩序的进程中，发展出建立新政治秩序所需的知识。正因如此，民主实践以及作为学习过程的历史实验观念，至关重要。如卢森堡所言，这并非出于对“‘正义’概念的任何狂热，而是因为政治自由中一切有教益的、健康的、起净化作用的东西，都系于这一本质特性”；而“自由”一旦沦为特权，便实际丧失其意义（Luxemburg 1922 [RLR: 305]）。积极参与公共生活，要求保障普选、出版与集会自由，以及不受审查的意见交换——没有这些，公共生活“渐渐入睡”，唯有官僚制苟延残喘。
