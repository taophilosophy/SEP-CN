      罗莎·卢森堡并非唯一抗议伯恩施坦重释马克思主义的人。他的立场在德国社会民主党斯图加特代表大会（1898）上得到讨论（并被拒绝），SPD 更有资历的成员，包括卡尔·考茨基与奥古斯特·倍倍尔，也发言反对他的论题。卢森堡的介入部分以文章形式发表于*Leipziger Volkszeitung*（《莱比锡人民报》），随后于 1900 年以《社会改良还是革命》为题出版（1908 年出第二版），它是对伯恩施坦的逐点回应。她的批判针对伯恩施坦的论证，即那句著名（或者说臭名昭著）的格言所概括的：“最终目标算不了什么，运动就是一切。”
