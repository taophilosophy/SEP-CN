      This belief in the power of the oppressed masses, and the role of spontaneous action in developing revolutionary organisation informed Luxemburg’s response to her colleagues in the German social democratic party and her call to combine parliamentary initiatives with the defence of the mass strike as the focal point of revolutionary organisation. The extent to which these views were reflected in her attitude to the Polish workers movement, with regard to which Luxemburg is sometimes criticised for her rigidity and sectarian stance, is a contested question (Blanc 2017)[^blanc-2017]. However, there is no doubt that her political experience with both Polish and German organisations, played an important role in the analysis of the political developments in Russia, from the revolution of 1905 to the Bolshevik conquest of power after October 1917. Initially sceptical of the possibility that a workers’ government in Russia could last for a long time, Luxemburg nevertheless praised the Bolsheviks for the symbolic importance of showing to the world that a revolutionary programme led by the proletariat was worth fighting for despite the constraints imposed by circumstances. She also urged her colleagues in the SPD to abandon their caution and support the Bolsheviks with greater conviction that the oppressed people of Russia would eventually be able to find their orientation despite what many considered to be “unripe circumstances”. As she put it in her essay on the Russian revolution, writen while in prison during World War I but published after her death in 1922, “when the proletariat seizes power, it can never again follow Kautsky’s good advice to dispense with a socialist transformation of a country on the grounds that‘the country is unripe’”. What it needs, she argues, is to “immediately embark on socialist measures in the most energetic, the most unyielding and the most ruthless way; in other words, it must exercise a dictatorship, but a dictatorship of the class, not of a party or of a clique – and dictatorship of the class means: in full view of the broadest public, with the most active, uninhibited participation of the popular masses in an unlimited democracy” (Luxemburg 1922 [RLR: 25, see also 307–308]).
    step1: |-
      对受压迫群众力量的这种信念，以及自发行动在发展革命组织中的作用，塑造了卢森堡对德国社会民主党同事们的回应，以及她把议会倡议与捍卫群众罢工——革命组织的焦点——结合起来的号召。这些观点在多大程度上反映在她对波兰工人运动的态度上——卢森堡有时因其僵硬与宗派立场而受到批评——是一个有争议的问题（Blanc 2017）[^blanc-2017]。然而毫无疑问，她在波兰与德国两种组织中的政治经验，对她分析俄国的政治发展——从 1905 年革命到 1917 年十月后布尔什维克夺取政权——起了重要作用。她起初怀疑俄国的工人政府能否长久，但仍称赞布尔什维克向世界表明：无产阶级领导的革命纲领值得为之奋斗，尽管处境重重限制——这一象征意义至为重要。她还敦促 SPD 的同事们放弃谨慎，以更大的信念支持布尔什维克，相信俄国受压迫的人民终能找到方向，尽管许多人认为那里的处境“尚未成熟”。正如她在论俄国革命的文章——一战期间狱中所写、身后 1922 年出版——中所说：“当无产阶级夺取政权时，它绝不能再听从考茨基的好心劝告，以‘国家尚未成熟’为由而放弃对国家的社会主义改造。”她论证说，它需要的是“以最有力、最坚定、最无情的方式立即着手社会主义措施；换句话说，它必须实行专政，但这是阶级的专政，不是一个政党或一个小集团的专政——阶级专政意味着：在广大公众的注视之下，以人民群众最积极、不受抑制的参与，实行一种不受限制的民主”（Luxemburg 1922 [RLR: 25, see also 307–308]）。
