      卢森堡对马克思的解读以及她对资本积累的分析，招致了若干批评。争议早在第二国际期间即已出现：布哈林与列宁等作者，受奥地利社会民主主义经济学家鲁道夫·希法亭金融资本分析的启发，指出了卢森堡解读马克思的缺陷，批评她对资本主义持一种“目的论”观点——整个体系被赋予一种目的，恰如其组成部分一样。他们进而论证，这导致对资本积累的错误看法（讨论见 Brewer 1990: 62–64 与 Callinicos 2001: 36–42）[^brewer-1990]。就马克思主义的解经而言，几位学者也强调：如果把《资本论》的分析与马克思关于殖民主义的其它著述整合起来，便能显示《资本论》第一卷已经预示了第二国际理论家的若干批判，并能有成效地用于生成一种与卢森堡并无大异的帝国主义批判（Pradella 2013）[^pradella-2013]。此外，马克思的辩护者指出，卢森堡的批判在方法论上有缺陷：马克思本意是让他的再生产图式成为一个抽象分析，悬置历史约束以说明持续追逐利润中的内在矛盾；卢森堡却把这一哲学抽象与对历史实在的描述混为一谈。最后，几位著名的马克思主义经济学家（如 Sweezy 1967）[^sweezy-1967]批评她聚焦于一个看似不合正统的前提：“消费”而非剩余价值的实现是资本主义体系的主要关切，从而把“需求从哪里来以实现剩余价值”的问题与“货币从哪里来以使利润货币化”的问题混为一谈（讨论与回应见 Bellofiore 2009）[^bellofiore-2009]。
