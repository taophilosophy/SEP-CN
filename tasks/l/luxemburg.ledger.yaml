      The Swiss years were characterised by a mix of academic and political work. Luxemburg, just over twenty, was entangled in a fight against the main Polish Socialist Party (PSP) by then fully committed to a mixture of progressive nationalism and Marxism, and for the recognition of the SDKP by the Socialist International. She conducted the struggle both on the political stage and in the main organs of international social democracy such as *Vorwärts* and *Neue Zeit*, as well as in the political magazine she and Jogisches edited, *Sprawa Robotnic*a (Workers’ Cause). All this meant that when she moved to Germany in 1898 with the help of a fictitious marriage to the son of one of her friends, a German national, she was already well known to the leadership of the largest social democratic party in the world, the Sozialdemokratische Partei Deutschlands (SPD). She rose quickly through the ranks of the SPD, in no small part due to her sharply critical interventions in the “revisionist” controversy which shook the party to its core in the years of transition from the 19ᵗʰ to the 20ᵗʰ century.
    step1: |-
      瑞士岁月的特点是学术工作与政治工作的混合。二十岁出头的卢森堡，卷入了反对主要波兰社会党（PSP）的斗争——该党当时已完全致力于进步民族主义与马克思主义的混合物——并为争取社会主义国际对 SDKP 的承认而斗争。她既在政治舞台上进行这场斗争，也在国际社会民主主义的主要机关报如*Vorwärts*（《前进报》）和*Neue Zeit*（《新时代》）上，以及在她和约吉希斯主编的政治杂志*Sprawa Robotnic*a（《工人事业》）上进行。这一切意味着，当她 1898 年借助与一位朋友的德国籍儿子假结婚而移居德国时，她已为世界上最大的社会民主党——德国社会民主党（SPD）——的领导层所熟知。她在 SPD 的等级中迅速上升，这在很大程度上归功于她在“修正主义”论战中犀利的批判性介入——那场论战在十九、二十世纪之交撼动了整个党的根基。
    step2: |-
      瑞士岁月，学术与政治两线并进。年仅二十出头的卢森堡，一面与主要的波兰社会党（PSP）缠斗——该党当时已全然投身于进步民族主义与马克思主义的杂糅——一面为争取社会主义国际承认 SDKP 而战。斗争既在政治舞台上展开，也在国际社会民主主义的喉舌如《前进报》（*Vorwärts*）、《新时代》（*Neue Zeit*）上进行，还在她与约吉希斯共同主编的政治杂志《工人事业》（*Sprawa Robotnic*a）上进行。凡此种种意味着：当她 1898 年借与一位友人之子——德国公民——假结婚而移居德国时，她已为世界上最大的社会民主党德国社会民主党（SPD）的领导层所熟知。她在 SPD 内迅速蹿升，这在很大程度上得益于她在“修正主义”论战中犀利的批判介入——那场论战在十九、二十世纪之交震撼了全党的根基。
