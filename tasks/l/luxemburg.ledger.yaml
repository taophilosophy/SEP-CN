      卢森堡的政治组织分析受到了来自对立视角的若干批评。一方面，有人指出：虽然卢森堡能够小心地驾驭全国议会代表制与超越国家边界的阶级冲突革命分析之间的抉择，但她以另一种同样天真的信念——不断扩张的罢工浪潮具有民主化效果——对抗了第二国际对民族社会民主主义的天真信仰（Eley 1980: 147）[^eley-1980]。另一方面，她对群众自发力量的信念，常被解释为她的资本积累限度分析中嵌入的某种程度的“决定论”或“宿命论”的必然后果——该分析强调内在的危机倾向（关于这批文献的讨论见 Geras 1976 [2015, ch 1]）[^geras-1976]。然而，正如诺曼·格拉斯所指出的：虽然她文本中的某些措辞与第二国际的标准表述相似——仿佛资本主义的崩溃被看作内在地不可避免——虽然这类修辞偶尔能起心理动员作用，卢森堡却远未把社会主义的出现看作命中注定（Geras 1976 [2015]）[^geras-1976]。恰恰相反，她明确表示：社会主义不会像“天上掉下的吗哪”那样降临；虽然“我们无法跳过历史发展的一个时期，正如人无法跳过自己的影子，但加速或延缓它，取决于我们自己的力量”（Luxemburg 1915 [RLR: 320–321]）。恩格斯的名句“社会主义或野蛮”的含义——卢森堡在《尤尼乌斯小册子》中对此作过评论——与决定论恰恰相反：它是受压迫者有意识能动性的申辩，她说，是无产阶级从“历史的一个无力受害者”向“历史的自觉引路人”的转变（Luxemburg 1915 [RLR: 321]）。
