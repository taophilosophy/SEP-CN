      罗莎·卢森堡以她在修正主义论战中的介入，确立了她在马克思主义圈子里重要思想家的地位。那场论战是围绕社会民主主义的原则与目标展开的理论与政治辩论，在十九世纪之交分裂了第二国际。论战由爱德华·伯恩施坦（Eduard Bernstein）引发——他是恩格斯的挚友、合作者与文学遗嘱执行人，也是德国社会民主党的元老。辩论最初以 1896 至 1898 年间在*Die Neue Zeit*上发表的一系列文章展开，随后在题为《社会主义的前提》（1899）一书中定型。当普鲁士政府逐步放松时任首相俾斯麦推动的《反社会党人法》，社会民主党的队伍继续壮大时，伯恩施坦试图重审马克思主义的一些核心理论与政治承诺：他对马克思与恩格斯的《共产党宣言》发表后五十年间资本主义的转型给出了新的分析。他批评了马克思经济学的一根根本支柱：在技术现代化与劳动力日益受剥削的双重压力下，利润率下降的历史趋势使体系危机不可避免。伯恩施坦主张，这要求社会民主党人放弃革命目标，转而制定通过议会斗争代表工人的进步立法。他坚称这绝非对奠基者学说的颠覆，而是要把马克思主义从第二国际的许多社会主义者后来给它套上的辩证紧身衣中解放出来。
