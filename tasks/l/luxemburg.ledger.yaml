      这便是人们所称的她的“自发性”在政治组织中作用的理论之要义。它与其说是一种理论，不如说是一种理解政治行动动力的努力，其根据在于这样一种信念：在政治动员与活动的过程中，受压迫群体自己能够发展改变历史进程所需的认识洞见、政治工具与集体动力。卢森堡论证说，给政党的教训，不是专注于“技术面”、专注于“群众罢工的机制”，而是确保“它们决不低于实际力量对比所要求的水平，而要超越它”（Luxemburg 1905 [RLR: 199]）。她解释说，改良提供了关键的学习平台，受压迫的群众经由它们培养自主决策的能力，并为夺取政治权力做准备。然而这类改良只是自由的操练，还不是自由本身。
