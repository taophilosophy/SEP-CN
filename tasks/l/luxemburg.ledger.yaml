      1918 年 11 月卢森堡出狱时，德国的面貌已截然不同。1917 年布尔什维克在俄国的成功促成了德俄《布列斯特-立托夫斯克和约》，在边境引发哗变，在要求民主共和国的德国工人中间引发一连串罢工与起义。狱中的卢森堡曾欢呼俄国革命是“一件具有世界历史意义的大事，其痕迹历千万世而不灭”（转引自 Fröhlich 1940 [2010: 239]）。但正如她的评断所表明的，她并不指望胜利能够持久，这在很大程度上是因为她不相信德国社会民主党人会支援他们的俄国同志。当斯巴达克派继续要求建立以工人苏维埃为基础的社会主义共和国时，SPD 则以拥立其领袖弗里德里希·艾伯特出任新的自由主义议会共和国总理来迎接威廉二世皇帝的退位。在柏林，罗莎·卢森堡与卡尔·李卜克内西出版《红旗报》创刊号——斯巴达克联盟的机关报——十二月又公布纲领。两种选择的对比再鲜明不过：要么是“资产阶级阶级统治的传统机关——联邦参议院、议会、市政委员会等等”，要么是无产阶级自己的“阶级机关：工人与士兵苏维埃”——在其中他们“占据一切公共职位，监督一切公共活动，并按自己的阶级利益和社会主义任务衡量国家的一切需要”（转引自 Fröhlich 1940 [2010: 273]）。几周后，同一纲领在德国共产党（KPD）成立大会上提出，卢森堡主张参加即将举行的一月国民议会选举。她被多数票否决。1919 年 1 月初，又一波抗议中，数十万工人涌上街头，占领火车站和报社。斯巴达克派力主谨慎。尽管柏林陷于无政府状态，卢森堡尤其不认为德国人民已经准备好进行社会主义革命。斯巴达克派起义反而动员了极右翼，而社民党内政部长古斯塔夫·诺斯克下令警察镇压抗议。在自由军团——极右的、反共和国的、准纳粹的准军事组织——的帮助下，许多活动家被捕并遭杀害。同样的命运不久也落在卡尔·李卜克内西与罗莎·卢森堡头上。1919 年 1 月 15 日，两人在藏身处被发现，被捕，被枪托击昏后枪杀。卢森堡的遗体被抛入柏林兰德维尔运河，数月后冲上岸来。
