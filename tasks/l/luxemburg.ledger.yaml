      正如伯恩施坦的论证植根于看似马克思主义的理论，卢森堡的回应亦然。她恪守这样的观念：社会主义是一种“历史必然性”，其可取与否，取决于对经验处境的正确解读。“要么修正主义关于资本主义发展进程的判断是对的，社会主义遂成乌托邦”，她写道，“要么社会主义并非乌托邦；因而那套‘适应手段’的理论便是错误的”（Luxemburg 1900 [RLR: 134]）。
