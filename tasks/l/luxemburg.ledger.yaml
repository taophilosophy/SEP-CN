      与积极推动社会主义女性主义发展的同事克拉拉·蔡特金与亚历山德拉·柯伦泰一样，卢森堡也认为在资本主义之下妇女遭受双重压迫：在家庭中，也在工作场所。与她们一样，她不认为性别冲突可以还原为男人与女人之间的对立，而是主张它们在资本主义制度中有更深的根源——在那里只有有酬劳动才被看作生产性的。就此而言，她可被视为社会再生产理论的早期先驱：她提供了一个资本积累分析，其中家务劳动的商品化，是资本主义关系向家庭等非资本主义领域逐步扩张的关键一步（Cakardic 2017）。
