      卢森堡对马克思的解读及其资本积累分析，招致了多方批评。争议早在第二国际期间便已发酵：布哈林与列宁等人，受奥地利社会民主主义经济学家鲁道夫·希法亭金融资本分析的启发，指摘卢森堡解读马克思之失，批评她对资本主义持一种“目的论”观点——仿佛整个体系被赋予了一种目的，一如其各个组成部分。他们进而论证：这导致对资本积累的错误认识（讨论见 Brewer 1990: 62–64 与 Callinicos 2001: 36–42）[^brewer-1990]。就马克思主义解经而论，另有几位学者强调：若把《资本论》的分析与马克思论殖民主义的其它著述合观，便能显示《资本论》第一卷早已预示第二国际理论家的若干批判，且能有成效地用于生成一种与卢森堡并无大异的帝国主义批判（Pradella 2013）[^pradella-2013]。再者，马克思的辩护者指出，卢森堡的批判在方法论上有缺陷：马克思本意是让再生产图式充当一个抽象分析——悬置历史约束，以揭示持续逐利中的内在矛盾；卢森堡却把这一哲学抽象同对历史实在的描述混为一谈。最后，几位杰出的马克思主义经济学家（如 Sweezy 1967）[^sweezy-1967]批评她执守一个看似离经叛道的前提：“消费”而非剩余价值的实现，才是资本主义体系的头等关切——从而把“需求从何而来以实现剩余价值”的问题，同“货币从何而来以使利润货币化”的问题混为一谈（讨论与回应见 Bellofiore 2009）[^bellofiore-2009]。
