      Luxemburg’s study of the dynamic structure of capital accumulation begins with a critique of Volume II of Capital. More specifically, it starts with Marx’s analysis of capitalism as a “closed system” based on a simplified model of relations of production between capitalists and workers, which abstracts from the existence of non-capitalist economies. As Marx had put it in chapter 24 of *Capital*, “we must treat the whole world of trade as one nation, and assume that capitalist production is established everywhere and has taken possession of every branch of industry” (Marx 1887 [1990: 727])[^marx-1887]. The problem with this analysis, Luxemburg pointed out, consists in a mistaken understanding of capital accumulation as a mere question of “the sources of money when the real issue is the effective demand, the use made of goods, not the source of money which is paid for them” (Luxemburg 1913 [AK: 128]). The closed-system analysis, she suggested, made it difficult to explain how capital could be reproduced and valorized in a capitalist society based only on the exploitation of workers, and related extraction of surplus value.
    step1: |-
      卢森堡对资本积累动态结构的研究，始于对《资本论》第二卷的批判。更具体地说，它始于马克思把资本主义分析为一个“封闭体系”——基于资本家与工人之间生产关系的简化模型，而撇开了非资本主义经济的存在。如马克思在《资本论》第 24 章所言：“我们必须把整个贸易世界当作一个国家，并假定资本主义生产到处都已确立，已占有每一个工业部门”（Marx 1887 [1990: 727]）[^marx-1887]。卢森堡指出，这一分析的问题在于：它把资本积累误解为单纯的“货币来源”问题，而真正的问题是有效需求、商品的用途，而非为商品支付货币的来源（Luxemburg 1913 [AK: 128]）。她认为，封闭体系分析使人难以解释：在一个仅仅建立在剥削工人及相关剩余价值榨取之上的资本主义社会里，资本如何能够被再生产并增值。
