      讨论的焦点，是作为反资本主义斗争方法的政治罢工与经济罢工。卢森堡论证说，局限于特定生产部门或特定城镇的罢工，不应彼此孤立地理解。她提出，群众罢工不应被看作“一种靠精巧推理发现的、为使无产阶级斗争更有效的巧妙方法，而应看作*无产阶级群众运动的方法*，即革命中无产阶级斗争的现象形式”（Luxemburg 1905 [RLR: 192]）。罢工也许以一系列要求开始——比如缩短工时或提高工资——但这些要求更公平分配的诉求，同工人获得政治权力的问题密不可分。如卢森堡所言：“经济斗争是从一个政治中心到另一个政治中心的传送带；政治斗争则是为经济斗争的土壤定期施肥”（Luxemburg 1905 [RLR: 195]）。经济斗争与政治斗争的这种相互依存还意味着，群众罢工问题不能与革命问题分开——革命不应从公共秩序的角度看作“街头骚乱”、“暴动”与“流血”，而应看作“现存阶级关系的彻底内部翻转”（Luxemburg 1905 [RLR: 195–196]）。而恰恰因为群众罢工不应理解为可以随意号召的孤立手段，它与革命的命运密不可分，发动它的决定甚至不能出自“最强大的社会民主党的最高委员会”（Luxemburg 1905 [RLR: 197]）。当然，卢森堡承认首创性、领导、群众教育与党的纪律在革命组织中有至关重要的作用。但她确信“革命不允许任何人对其扮演教师爷”，因为，她论证说，“在斗争的每一个别行动中，如此众多的重要因素——经济的、政治的与社会的、一般的与地方的、物质的与心理的——相互作用，以致没有任何单一行动能够像数学问题那样被安排和解决”（Luxemburg 1905 [RLR: 198]）。
