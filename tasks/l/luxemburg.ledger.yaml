      在《资本积累论》中，那些例子——英国对印度的殖民主义、鸦片战争、法国在阿尔及利亚的殖民主义、黑非洲各族与荷兰布尔人的斗争、对美洲原住民的剥削——提醒人们：资本主义是在强制与种族虐待的背景下发展起来的。当德国社会民主党一边庆祝选举的扩张、一边迟迟不肯谴责德国参与瓜分非洲时，卢森堡撰写了多篇文章与小册子，提请人们注意纳米比亚纳马人与赫雷罗人遭受的种族灭绝，并批评考茨基与 SPD 领导层的同谋——他们因为怕丢议会席位，而不谴责威廉皇帝在摩洛哥扩张帝国的图谋。她一如既往致力于欧洲的反种族主义斗争——她在德雷福斯事件上的公开表态可为明证——同时继续把本国国内的反排斥斗争，与世界各地帝国主义强权绵延不绝的种族虐待之谴责不可分割地联系在一起。她强调，非洲黑人“被欧洲人拿来玩捉人游戏的那些身体，对我来说同样是切身的”，正如“犹太人的苦难”一样（Luxemburg 1917 [RLR: 390]）。
