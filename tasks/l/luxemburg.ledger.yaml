      Luxemburg interpreted the demand for a dictatorship of the proletariat in the same way Marx and Engels had done, as a transitional emergency institution required to realise democracy in a society rigged by class struggle (see for a broader discussion of the concept Ypi 2020). She strongly believed that the dictatorship of the proletariat should be brought about by the masses of the oppressed in their effort to liberate themselves, and that it should not be inflicted on them by a small circle of revolutionary elites. This commitment to freedom as reflected in the practical activity of the working class movement rather than a static goal to be approximated with the right tools was also reflected in her criticism of centralized models of political organization, motivating her scepticism towards the idea of a vanguard party championed by Vladimir Lenin. For Lenin, the political vanguard consisted of a selection of the most disciplined, intellectually sophisticated, and motivated revolutionaries whose role was to cultivate “agitation” with the aim of transforming workers’ mobilisation to achieve short-term goals into a wide ranging struggle aiming to secure their access to political power. Only a party guided by a small elite of revolutionaries aware of the twin dangers of both opportunism (too much compromise) and sectarianism (too little compromise), Lenin argued, was capable of giving the working class movement a compass with which to orient itself in the long-term (Lenin 1929 [1987: 95])[^lenin-1929]. As Lenin puts it, the professional revolutionary is not merely a trade union secretary but a “tribune of the people”, able to react to injustice regardless of where it takes place or which group of people it affects so as to “group all these manifestations into a single picture of political violence […] in order to explain to everyone the world-historical significance of the struggle” (Lenin 1929 [1987: 113])[^lenin-1929].
    step1: |-
      卢森堡对无产阶级专政要求的解释与马克思、恩格斯相同：它是在一个被阶级斗争扭曲的社会里实现民主所需的过渡性紧急机构（关于该概念的更宽泛讨论见 Ypi 2020）。她坚信，无产阶级专政应当由受压迫群众在自我解放的努力中建立，而不应由一小圈革命精英强加于他们。这种对自由的信守——自由体现于工人阶级运动的实际活动，而非凭正确工具去逼近的静止目标——同样体现于她对集中制政治组织模式的批评，并促成她对弗拉基米尔·列宁所倡导的先锋党观念的怀疑。在列宁那里，政治先锋队由最有纪律、智识上最老练、最有干劲的革命者精选而成；他们的角色是培育“鼓动”，目的是把工人为短期目标的动员，改造为旨在确保其获得政治权力的广泛斗争。列宁论证说，唯有由一小群革命精英领导、且这些精英深知机会主义（妥协过多）与宗派主义（妥协过少）双重危险的党，才能给工人阶级运动一个罗盘，使其得以长期定向（Lenin 1929 [1987: 95]）[^lenin-1929]。如列宁所言，职业革命家不只是工会的书记，更是“人民的讲坛”：无论不义发生在何处、殃及哪个群体，他都能作出反应，从而“把所有这些表现汇成一幅政治暴力的总图景……以便向每个人说明这一斗争的世界历史意义”（Lenin 1929 [1987: 113]）[^lenin-1929]。
