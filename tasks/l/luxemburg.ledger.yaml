      Luxemburg’s political stance is grounded in her analysis of capital as a set of economic, political and social relations with global scope. She developed her contribution to Marxist political economy in *The Accumulation of Capital: A Contribution to the Economic Explanation of Imperialism* (1913) and in her *Introduction to Political Economy* published posthumously in 1925 and based on her lectures on the same subject at the SPD party school. Her starting position is that the core of a capitalist economy is the extraction of surplus value and the exploitation of workers as a source of accumulation of profits. As Luxemburg puts it, the distinctive feature of a capitalist system of production consists in the fact that “only those goods are produced which can with certainty be expected to sell, and not merely to sell, but to sell at the customary profit” (Luxemburg 1913 [AK: 35]). To understand how this is possible, she argues, we need to focus on *total* capital and its continuous transformation from commodity to money and back to commodity again, in a new cycle of spiralling profits (Bellofiore 2009)[^bellofiore-2009]. What is required to maintain the capitalist system, Luxemburg shows, is firstly the ability of capitalists to make profit guaranteed by the reproduction of capitalism as a system; secondly, enough demand to meet the offer of new capitalist commodities brought into the market; and thirdly an incentive to accumulate based on the prospect of new markets to absorb increasing production.
    step1: |-
      卢森堡的政治立场，植根于她把资本分析为一套具有全球规模的经济、政治与社会关系。她在《资本积累论：对帝国主义的经济解释的贡献》（1913）以及身后于 1925 年出版的《政治经济学导论》（据她在 SPD 党校讲授同一课程的讲稿）中发展了她对马克思主义政治经济学的贡献。她的出发点是：资本主义经济的核心是剩余价值的榨取，是把工人作为利润积累之源加以剥削。如卢森堡所言，资本主义生产体系的独特之处在于：“只有那些可以确切预期卖得掉的商品才被生产出来，而且不仅要卖得掉，还要按惯常利润卖掉”（Luxemburg 1913 [AK: 35]）。要理解这如何可能，她主张，我们需要着眼于*总*资本及其从商品到货币、再从货币回到商品的连续转化——在一轮又一轮螺旋上升的利润新循环中（Bellofiore 2009）[^bellofiore-2009]。卢森堡表明，维持资本主义体系需要：其一，资本家赚取利润的能力，由资本主义作为一个体系的再生产所保证；其二，足够的需求，以吸纳投入市场的新资本主义商品；其三，积累的动因，以吸收日益增长的生产的新市场前景为基础。
