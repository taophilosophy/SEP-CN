      Historically interpreted as a Marxist theorist at best indifferent to the question of women’s emancipation, recent scholarship has been more nuanced in their assessments of Luxemburg’s contribution to feminism (Dunayevskaya 1981; Ettinger 1987; Haug 2007)[^dunayevskaya-1981][^ettinger-1987][^haug-2007]. As with the case of national self-determination, her position on gender issues is more sophisticated than a simplified reading of her texts affords. It is well known that Luxemburg often rejected calls from her colleagues in the Second International to be exclusively involved with what they called the “women question”. However, as many of her articles, political interventions and letters make clear, Luxemburg was a fierce champion of women’s rights and of the contribution that advocacy for women representation made to socialist emancipation more generally. What she did reject is the kind of tokenistic feminism which limited itself to the suffrage campaign and isolated the question of female emancipation from the critique of capitalism. As she put it, bourgeois women “who act like lionessess in the struggle against ‘male prerogatives’ … are nothing but co-consumers of the surplus value their men extort from the proletariat”. These “parasites of the parasites of the social body”, she wrote “are usually even more rabid and cruel in defending their ‘right’ to a parasite’s life than the direct agents of class rule and exploitation” (Luxemburg 1902 [RLR: 240]).
    step1: |-
      历史上卢森堡被解读为一位对妇女解放问题充其量漠不关心的马克思主义理论家；晚近的学术研究对她在女性主义方面的贡献的评价则更为细致（Dunayevskaya 1981; Ettinger 1987; Haug 2007）[^dunayevskaya-1981][^ettinger-1987][^haug-2007]。与民族自决的情形一样，她在性别问题上的立场，比对她文本的简单化解读所显示的更为精巧。众所周知，卢森堡常常拒绝第二国际同事们的呼吁——要她专门投身于他们所谓的“妇女问题”。然而，正如她的许多文章、政治介入与书信表明的，卢森堡是妇女权利的猛烈捍卫者，也捍卫争取妇女代表权的主张对整个社会主义解放事业的贡献。她真正拒绝的是那种象征性的女性主义：把自己局限于争取选举权的运动，把妇女解放问题同资本主义批判割裂开来。如她所言，那些“在对‘男性特权’的斗争中表现得像母狮一样的……资产阶级妇女……不过是她们的男人从无产阶级那里榨取的剩余价值的共同消费者”。她写道，这些“社会躯体上的寄生虫的寄生虫”，“在捍卫其寄生虫生活的‘权利’时，通常比阶级统治与剥削的直接代理更为狂热、更为残忍”（Luxemburg 1902 [RLR: 240]）。
