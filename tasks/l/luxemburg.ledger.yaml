      Authors who study Luxemburg’s stance on national self-determination believe that her hostility to it stems from aversion to nationalism. Her argument however was more sophisticated (see Brie and Schütrumpf 2021)[^brie-2021]. Luxemburg was enthusiastic about the unique contribution of national culture through art or literary products to the understanding of the historical and social specificities of different nations, as her commentaries on the work of Polish poet Adam Mickiewicz make clear (see for a discussion Scott 2021)[^scott-2021]. However, her appreciation of such distinctive linguistic and cultural contributions was always distinguished from the issue of nation-state sovereignty – a positiion which put her at odds with mainstream progressive movements in Congress Poland. While the charge of being a “national nihilist” may be exaggerated, it is fair to say that Luxemburg’s prominence in the Polish socialist movement, imprinted on the SDKP a sectarian tendency which many historians have subsequently criticised for undermining the Polish workers’ movement with its distinctive nationalist commitments (Blanc 2017)[^blanc-2017]. Luxemburg always maintained that if the political and economic power of the Polish proletariat were so weighty as to make national self-determination a viable alternative, then surely the workers would also have enough power to rebel against capital beyond national boundaries. Given the empirical circumstances of Poland, Luxemburg believed that national self-determination was a dangerous distraction from the imperative to work with the labour movement to fight the Russian empire and turn it into a socialist state. Without socialist governments in Germany, Austria, and Russia, she argued, independence would deepen the exploitation of Polish workers. The demand for national self-determination ran the risk of playing in the hands of liberal ruling elites, distracting Polish workers and turning them from an entity dominated by Russian capital to one dominated by Polish capital. This attitude towards nationalism is also central to understand her stance against the war, leading to her definitive break with German social democracy whom she accused of joining forces with nationalist conservatives to support the war against Russia. As she explained in the 1915 *Junius Pamphlet*: “So long as capitalist states exist, i.e., so long as imperialistic world policies determine and regulate the inner and outer life of a nation, there can be no ‘national self-determination’ either in war or in peace” (Luxemburg 1915 [RLR: 325]).
    step1: |-
      研究卢森堡民族自决立场的作者认为，她对民族自决的敌意源于对民族主义的反感。但她的论证其实更为精巧（见 Brie and Schütrumpf 2021）[^brie-2021]。卢森堡热烈赞赏民族文化经由艺术或文学作品对各民族历史与社会独特性之理解所作的独特贡献，她对波兰诗人亚当·密茨凯维奇作品的评论便是明证（讨论见 Scott 2021）[^scott-2021]。然而，她对这些独特语言文化贡献的赏识，始终与民族国家主权问题分开——这一立场使她与波兰会议王国的主流进步运动格格不入。“民族虚无主义者”的指控或许言过其实，但公允地说，卢森堡在波兰社会主义运动中的显赫地位，给 SDKP 打上了宗派倾向的印记；许多史学家后来批评该党以其独特的民族主义承诺损害了波兰工人运动（Blanc 2017）[^blanc-2017]。卢森堡始终主张：如果波兰无产阶级的政治经济实力足以使民族自决成为可行的选项，那么工人们必定也拥有足够的实力，超越国界反抗资本。鉴于波兰的经验处境，卢森堡相信，民族自决是一个危险的岔路，使人分心于同工人运动一起反对俄罗斯帝国并把它变成社会主义国家的当务之急。她论证说，若无德国、奥地利与俄国的社会主义政府，独立只会加深对波兰工人的剥削。民族自决的要求冒着落入自由主义统治精英之手的危险：分散波兰工人的注意力，使他们从一个受俄国资本支配的实体，变成一个受波兰资本支配的实体。这种对待民族主义的态度，也是理解她反战立场的枢纽——它导致她与德国社会民主主义最终决裂，她指责后者与民族主义保守势力合流支持对俄战争。正如她在 1915 年的《尤尼乌斯小册子》中所解释的：“只要资本主义国家存在，也就是说，只要帝国主义的世界政策决定并调节一个民族的内外生活，就决不会有‘民族自决’，无论战时还是平时”（Luxemburg 1915 [RLR: 325]）。
