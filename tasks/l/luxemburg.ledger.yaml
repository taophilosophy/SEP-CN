      The debate centred around the question of whether democracy and capitalism were compatible. The starting point for Bernstein’s critique was the Marxist claim that capitalism was a social system with a tendency to collapse under the pressure of its own contradictions. In the pages of *Capital*, Marx had written eloquently about how capitalist economies faced the prospect of ever more destructive crises due to the twin pressures of technological modernisation and the tendency of the rate of profits to fall. At the time of Bernstein’s contribution, this methodological commitment to understanding capital as a system with an inherent propensity towards crisis was widely shared among the main theorists of the Second International. To suggest that the argument was false was to strike at the core of Marxist political economy. But what made the attack particularly uncomfortable, and difficult to dismiss, was that Bernstein presented his argument not as a break with Marxist methodological assumptions but as an internal development of its normative and empirical requirements. He began by insisting that dialectics was nothing other than the methodological commitment to match one’s theory to new developments in practice. The history of capitalist development in the 19ᵗʰ century showed not a cumulative series of ever sharper failures but a resilient system with a surprising capacity for adaptation. From an economic perspective there were a number of new developments with which the Marxist analysis had to reckon: the intensification of foreign trade, the expansion of the banking and financial sector, the development of the credit system, and the emergence of cartels and trusts. From a political perspective, the consolidation of middle classes, the rise of property owners, and the expansion of the franchise meant that liberal representation could no longer be identified with the perpetuation of oppression by ruling elites. There was now reasonable hope that the gap between the private and the public sphere, between the ethos of the *bourgeois* and that of the *citoyen* could be bridged. On the one hand, the extension of the right to vote to previously disenfranchised categories of people; on the other hand the strengthening of workers’ unions and cooperatives as well as the prospects of electoral successes for mass social-democratic parties across Western Europe made it hard to equate representative democracy with the consolidation of class rule. Citizenship emerged as the new concept through which capital could be put to the service of the democratic state. Representative democracy and political emancipation were part of the same project, a project that social-democrats could develop regardless of “the final goal.”
    step1: |-
      论战围绕民主与资本主义是否相容的问题展开。伯恩施坦批判的出发点，是马克思主义的这一主张：资本主义是一个倾向于在自身矛盾压力下崩溃的社会体系。在《资本论》中，马克思曾雄辩地写道：由于技术现代化与利润率下降趋势的双重压力，资本主义经济面临愈来愈具毁灭性的危机。在伯恩施坦发言的时代，把资本理解为一个内固有危机倾向的体系，这一方法论承诺在第二国际的主要理论家中广为分享。说这一论证为假，便是直击马克思主义政治经济学的核心。但使这一攻击格外令人难堪、难以置之不理的，是伯恩施坦并未把自己的论证呈现为对马克思主义方法论前提的决裂，而是呈现为其规范要求与经验要求的内部发展。他首先坚持：辩证法不过是一种方法论承诺，即使理论跟上实践中的新发展。十九世纪资本主义发展的历史显示的，不是一连串日益尖锐的失败的累积，而是一个韧性十足、适应能力惊人的体系。从经济角度看，有一系列新情况是马克思主义分析必须正视的：对外贸易的加强、银行与金融部门的扩张、信用体系的发展，以及卡特尔与托拉斯的出现。从政治角度看，中产阶级的巩固、有产者的兴起、选举权的扩大，意味着自由主义的代议制不再能等同于统治精英压迫的延续。私域与公域之间、*市民*（bourgeois）精神与*公民*（citoyen）精神之间的鸿沟，如今有了弥合的合理希望。一方面，选举权扩展到此前被剥夺权利的人群；另一方面，工人工会与合作社的壮大，以及群众性社会民主党在西欧各地选举获胜的前景，使人难以把代议制民主等同于阶级统治的巩固。公民身份作为新概念出现，资本借以服务于民主国家。代议制民主与政治解放属于同一个方案——一个社会民主党人可以不去管“最终目标”而加以推进的方案。
