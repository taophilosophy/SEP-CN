      Dunn put forward his semantics to characterize the logic of First Degree Entailment (FDE), which treats only entailments between implication-free formulas. (For papers on the nature and development of FDE, see Omori & Wansing 2017.)[^omori-2017] Richard Routley (1988) extended the theory to treat some weak relevant logics, and Restall (1995) extended the theory to treat logics just weaker than the prominent relevant logics E and R (see sections 4 and 5 below). Mares (2004a) used a neighbourhood semantics, together with four truth-values to give a semantics for R. The four-valued semantics is treated in more detail the entry on paraconsistent logics. Other treatments of negation, some of which have been used for relevance logics, can be found in Wansing (2001) and in the entry on negation.
    step1: |-
      Dunn 提出他的语义，用以刻画一阶蕴涵逻辑（FDE），它只处理无蕴涵公式之间的蕴涵。（关于 FDE 的性质与发展的论文，见 Omori & Wansing 2017。）[^omori-2017] Richard Routley（1988）把该理论推广到处理某些弱相干逻辑，Restall（1995）把该理论推广到处理仅弱于著名相干逻辑 E 与 R 的逻辑（见下文第 4、5 节）。Mares（2004a）使用邻域语义连同四个真值，给出 R 的一种语义。四值语义在次协调逻辑词条中有更详细的处理。关于否定的其他处理——其中一些曾用于相干逻辑——可见 Wansing（2001）以及否定词条。
    step2: |-
      Dunn 提出这套语义，是为了刻画 FDE（First Degree Entailment）；它只处理不含蕴涵的公式之间的蕴涵。（关于 FDE 的性质与发展，见 Omori & Wansing 2017。）[^omori-2017] Richard Routley（1988）把该理论推广到某些弱相干逻辑，Restall（1995）又推广到仅比著名相干逻辑 E、R 稍弱的逻辑（见下文第 4、5 节）。Mares（2004a）用邻域语义加上四个真值，为 R 给出一种语义。四值语义在“次协调逻辑”词条中讲得更细；否定的其他处理（有些曾用于相干逻辑）见 Wansing（2001）与“否定”词条。
