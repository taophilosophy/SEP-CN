      ## 7 相干逻辑的应用与扩展
  - id: 90
    kind: body
    source: |-
      Apart from the motivating applications of providing better formalisms of our pre-formal notions of implication and entailment and providing a basis for naïve set theory, relevance logic has been put to various uses in philosophy and computer science. Here I will list just a few.
    step1: |-
      除了提供更好的形式系统以刻画我们前形式的蕴涵与衍推概念、以及为朴素集合论提供基础这些动机性应用之外，相干逻辑在哲学与计算机科学中还有各种用途。这里我只列几种。
    step2: |-
      相干逻辑的动机，本在于更好地形式化我们前形式的蕴涵、衍推概念，并为朴素集合论提供基础；除此之外，它在哲学与计算机科学中还有不少用途。这里只举几例。
  - id: 91
    kind: body
    source: |-
      Dunn has developed a theory of intrinsic and essential properties based on relevant logic. This is his theory of *relevant predication*. Briefly put, a thing $i$ has a property $F$ relevantly iff $\forall x(x{=}i \rightarrow F(x))$. Informally, an object has a property relevantly if being that thing relevantly implies having that property. Since the truth of the consequent of a relevant implication is by itself insufficient for the truth of that implication, things can have properties irrelevantly as well as relevantly. Dunn’s formulation would seem to capture at least one sense in which we use the notion of an intrinsic property. Adding modality to the language allows for a formalisation of the notion of an essential property as a property that is had both necessarily and intrinsically (see Anderson, Belnap, and Dunn 1992, §74).
    step1: |-
      Dunn 基于相干逻辑发展了一种内在属性与本质属性的理论。这就是他的 *相干谓述* 理论。简言之，一个事物 $i$ 相干地具有属性 $F$，当且仅当 $\forall x(x{=}i \rightarrow F(x))$。非正式地说，一个对象相干地具有一个属性，如果“是那个事物”相干地蕴涵“具有那个属性”。由于相干蕴涵后件的真本身不足以保证该蕴涵的真，事物可以不相干地具有属性，也可以相干地具有属性。Dunn 的表述似乎至少捕捉到我们使用内在属性概念的一种意义。给语言添加模态，可以把本质属性概念形式化为既必然又内在地具有的属性（见 Anderson, Belnap, and Dunn 1992, §74）。
    step2: |-
      Dunn 以相干逻辑为基础，提出了一种关于内在属性与本质属性的理论，即他的 **相干谓述** 理论。简单说，事物 $i$ 相干地具有属性 $F$，当且仅当 $\forall x(x{=}i \rightarrow F(x))$。用大白话说，一个对象相干地具有某属性，是指“是那个东西”相干地蕴涵“具有那个属性”。相干蕴涵后件为真，本身不足以保证整个蕴涵为真，所以事物既可以相干地具有属性，也可以不相干地具有属性。Dunn 的表述似乎至少抓住了“内在属性”的一种用法。若在语言中加入模态，还可把本质属性形式化为既必然又内在地具有的属性（见 Anderson, Belnap, and Dunn 1992, §74）。
  - id: 92
    kind: body
    source: |-
      Relevant logic has been used as the basis for mathematical theories other than set theory. Meyer has produced a variation of Peano arithmetic based on the logic $\mathbf{R}$. Meyer gave a finitary proof that his relevant arithmetic does not have $0 = 1$ as a theorem. Thus Meyer solved one of Hilbert’s central problems in the context of relevant arithmetic; he showed using finitary means that relevant arithmetic is absolutely consistent. This makes relevant Peano arithmetic an extremely interesting theory. Unfortunately, as Meyer and Friedman have shown, relevant arithmetic does not contain all of the theorems of classical Peano arithmetic. Hence we cannot infer from this that classical Peano arithmetic is absolutely consistent (see Meyer and Friedman 1992)[^meyer-1992].
    step1: |-
      相干逻辑已被用作集合论之外的数学理论的基础。Meyer 基于逻辑 $\mathbf{R}$ 造出了皮亚诺算术的一个变体。Meyer 给出一个有穷性证明，表明他的相干算术不以 $0 = 1$ 为定理。这样，Meyer 在相干算术的语境中解决了 Hilbert 的一个核心问题；他用有穷手段表明相干算术绝对一致。这使相干皮亚诺算术成为一个极其有趣的理论。不幸的是，正如 Meyer 与 Friedman 所表明的，相干算术不包含经典皮亚诺算术的一切定理。因此，我们不能由此推断经典皮亚诺算术绝对一致（见 Meyer and Friedman 1992）[^meyer-1992]。
    step2: |-
      相干逻辑也被用作集合论之外其他数学理论的基础。Meyer 以逻辑 $\mathbf{R}$ 为基础，造出皮亚诺算术的一个变体，并给出有穷性证明：他的相干算术不以 $0 = 1$ 为定理。这样，Meyer 就在相干算术的范围内解决了 Hilbert 的一个核心问题——用有穷手段表明相干算术绝对一致。相干皮亚诺算术因此成为一个极有意思的理论。可惜，正如 Meyer 与 Friedman 所示，相干算术并不包含经典皮亚诺算术的全部定理，所以不能由此推出经典皮亚诺算术绝对一致（见 Meyer and Friedman 1992）[^meyer-1992]。
  - id: 93
    kind: body
    source: |-
      Anderson (1967) formulated a system of deontic logic based on $\mathbf{R}$ and, more recently, relevance logic has been used as a basis for deontic logic by Mares (1992) and Lou Goble (1999). These systems avoid some of the standard problems with more traditional deontic logics. One problem that standard deontic logics face is that they make valid the inference from $A$’s being a theorem to $OA$’s being a theorem, where ‘$OA$’ means ‘it ought to be that $A$’. The reason that this problem arises is that it is now standard to treat deontic logic as a normal modal logic. On the standard semantics for modal logic, if $A$ is valid, then it is true at all possible worlds. Moreover, $OA$ is true at a world $a$ if and only if $A$ is true at every world accessible to $a$. Thus, if $A$ is a valid formula, then so is $OA$. But it seems silly to say that every valid formula ought to be the case. Why should it be the case that either it is now raining in Ecuador or it is not? In the semantics for relevant logics, not every world makes true every valid formula. Only a special class of worlds (sometimes called “base worlds” and sometimes called “normal worlds”) make true the valid formulae. Any valid formula can fail at a world. By allowing these “non-normal worlds” in our models, we invalidate this problematic rule.
    step1: |-
      Anderson（1967）基于 $\mathbf{R}$ 构造了一个道义逻辑系统；更晚近，Mares（1992）与 Lou Goble（1999）用相干逻辑作为道义逻辑的基础。这些系统避开了更传统的道义逻辑的一些标准问题。标准道义逻辑面临的一个问题，是它们使从 $A$ 是定理推出 $OA$ 是定理这一推理有效，其中“$OA$”意为“应当 $A$”。这个问题产生的原因，是现在通常把道义逻辑当作正规模态逻辑。按模态逻辑的标准语义，如果 $A$ 有效，那么它在所有可能世界都为真。而且，$OA$ 在世界 $a$ 为真，当且仅当 $A$ 在可及于 $a$ 的每个世界都为真。因此，如果 $A$ 是有效公式，那么 $OA$ 也是。但说每个有效公式都应当成立，似乎很荒唐。凭什么“现在厄瓜多尔在下雨或者没下雨”应当成立？在相干逻辑的语义中，并非每个世界都使每个有效公式为真。只有一类特殊世界（有时称为“基础世界”，有时称为“正规世界”）使有效公式为真。任何有效公式都可以在世界失败。通过允许这些“非正规世界”进入模型，我们使这条有问题的规则失效。
    step2: |-
      Anderson（1967）以 $\mathbf{R}$ 为基础构造了一个道义逻辑系统；后来 Mares（1992）与 Lou Goble（1999）也以相干逻辑为基础建立道义逻辑。这些系统避开了传统道义逻辑的一些标准麻烦。麻烦之一，是标准道义逻辑会让“$A$ 是定理，所以 $OA$ 是定理”这条推理有效，其中“$OA$”表示“应当 $A$”。病根在于如今通常把道义逻辑当作正规模态逻辑：按模态逻辑的标准语义，$A$ 有效就在所有可能世界为真；而 $OA$ 在世界 $a$ 为真，当且仅当 $A$ 在一切可及于 $a$ 的世界为真。于是 $A$ 有效，$OA$ 也有效。但说每个有效公式都应当成立，未免荒唐——凭什么“现在厄瓜多尔在下雨或没下雨”应当成立呢？相干逻辑的语义里，并非每个世界都使有效公式为真，只有一类特殊世界（有时叫“基础世界”，有时叫“正规世界”）才使有效公式为真，任何有效公式都可以在某个世界失败。把这类“非正规世界”放进模型，这条有问题的规则便失效了。
