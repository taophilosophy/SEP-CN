      The logic that is often taken to be the paradigm relevance logic is the logic $\mathbf{R}$. For an axiomatisation of $\mathbf{R}$, see [Logic $\mathbf{R}$](logic-relevance.logicr.md).
    step1: |-
      常被当作相干逻辑范式的逻辑是逻辑 $\mathbf{R}$。关于 $\mathbf{R}$ 的公理化，见[逻辑 $\mathbf{R}$](logic-relevance.logicr.md)。
    step2: |-
      最常被当作相干逻辑范式的，是逻辑 $\mathbf{R}$。$\mathbf{R}$ 的公理化见[逻辑 $\mathbf{R}$](logic-relevance.logicr.md)。
  - id: 51
