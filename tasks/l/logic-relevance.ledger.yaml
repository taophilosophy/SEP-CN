      $A \rightarrow B$ is true at a world $a$ if and only if for all worlds $b$ and $c$ such that $Rabc$ $(R$ is the accessibility relation) either $A$ is false at $b$ or $B$ is true at $c$.
    step1: |-
      $A \rightarrow B$ 在世界 $a$ 为真，当且仅当对所有满足 $Rabc$ 的世界 $b$ 与 $c$（$R$ 是可及关系），要么 $A$ 在 $b$ 为假，要么 $B$ 在 $c$ 为真。
    step2: |-
      $A \rightarrow B$ 在世界 $a$ 为真，当且仅当凡满足 $Rabc$ 的世界 $b$、$c$（$R$ 即可及关系），要么 $A$ 在 $b$ 上为假，要么 $B$ 在 $c$ 上为真。
