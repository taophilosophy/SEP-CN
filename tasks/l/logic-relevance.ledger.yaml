    kind: body
    source: |-
      Other sorts of modal operators have been added to relevance logic as well. Fuhrmann (1990) adapts the usual axioms for the familiar classical modal logics to the relevant context to produce a collection of relevant modal logics and proves completeness results for them. Epistemic modal operators have been added to relevance logics by Heinrich Wansing (2002), Marta Bilkova, Ondrej Majer, Michal Peliš, and Greg Restall (2010), among others. Shawn Standefer (2019) has produced a relevant version of justification logic and has very recently added an actuality opertor to relevance logic. There is even a relevant logic of questions and answers (see Punčochář 2020)[^punčochář-2020].
    step1: |-
      其他种类的模态算子也被添加到相干逻辑中。Fuhrmann（1990）把熟悉的经典模态逻辑的通常公理改编到相干语境，产生了一批相干模态逻辑，并为它们证明了完全性结果。认识模态算子被 Heinrich Wansing（2002）、Marta Bilkova、Ondrej Majer、Michal Peliš 与 Greg Restall（2010）等人添加到相干逻辑中。Shawn Standefer（2019）造出了辩护逻辑的相干版本，并且最近给相干逻辑添加了一个现实性算子。甚至还有关于问题与回答的相干逻辑（见 Punčochář 2020）[^punčochář-2020]。
    step2: |-
      相干逻辑还被加上了其他种类的模态算子。Fuhrmann（1990）把经典模态逻辑的常见公理改造成相干版本，得到一批相干模态逻辑，并证明了完全性。Heinrich Wansing（2002）、Marta Bilkova、Ondrej Majer、Michal Peliš、Greg Restall（2010）等人给相干逻辑加入了认识模态算子；Shawn Standefer（2019）造出辩护逻辑的相干版本，最近又给相干逻辑添了现实性算子。甚至还有关于问与答的相干逻辑（见 Punčochář 2020）[^punčochář-2020]。
  - id: 95
    kind: body
    source: |-
      Routley and Val Plumwood (1989) and Mares and André Fuhrmann (1995) present theories of counterfactual conditionals based on relevant logic. Their semantics adds to the standard Routley-Meyer semantics an accessibility relation that holds between a formula and two worlds. On Routley and Plumwood’s semantics, $A\gt B$ holds at a world $a$ if and only if for all worlds $b$ such that $SAab$, $B$ holds at $b$. Mares and Fuhrmann’s semantics is slightly more complex: $A\gt B$ holds at a world $a$ if and only if for all worlds $b$ such that $SAab$, $A \rightarrow B$ holds at $b$ (also see Brady (ed.) 2002, §10 for details of both semantics). Mares (2004) presents a more complex theory of relevant conditionals that includes counterfactual conditionals. All of these theories avoid the analogues of the paradoxes of implication that appear in standard logics of counterfactuals.
    step1: |-
      Routley 与 Val Plumwood（1989）、Mares 与 André Fuhrmann（1995）提出了基于相干逻辑的反事实条件句理论。他们的语义在标准 Routley–Meyer 语义上添加了一个在公式与两个世界之间成立的可及关系。按 Routley 与 Plumwood 的语义，$A\gt B$ 在世界 $a$ 成立，当且仅当对所有满足 $SAab$ 的世界 $b$，$B$ 在 $b$ 成立。Mares 与 Fuhrmann 的语义稍复杂：$A\gt B$ 在世界 $a$ 成立，当且仅当对所有满足 $SAab$ 的世界 $b$，$A \rightarrow B$ 在 $b$ 成立（两种语义的细节另见 Brady (ed.) 2002, §10）。Mares（2004）提出了一个更复杂的相干条件句理论，其中包括反事实条件句。所有这些理论都避开了标准反事实逻辑中出现的蕴涵悖论的对应物。
    step2: |-
      Routley 与 Val Plumwood（1989）、Mares 与 André Fuhrmann（1995）提出了基于相干逻辑的反事实条件句理论。他们在标准 Routley–Meyer 语义上增加了一个可及关系，它成立于一个公式与两个世界之间。按 Routley 与 Plumwood 的语义，$A\gt B$ 在世界 $a$ 成立，当且仅当凡满足 $SAab$ 的世界 $b$，$B$ 都在 $b$ 成立。Mares 与 Fuhrmann 的语义稍复杂：$A\gt B$ 在世界 $a$ 成立，当且仅当凡满足 $SAab$ 的世界 $b$，$A \rightarrow B$ 都在 $b$ 成立（两种语义的细节见 Brady (ed.) 2002, §10）。Mares（2004）提出了一套更复杂的相干条件句理论，其中包含反事实条件句。这些理论都避开了标准反事实逻辑中蕴涵悖论的对应物。
  - id: 96
    kind: body
    source: |-
      Relevant logics have been used in computer science as well as in philosophy. Linear logics — a branch of logic initiated by Jean-Yves Girard — is a logic of computational resources. Linear logicians read an implication $A \rightarrow B$ as saying that having a resource of type $A$ allows us to obtain something of type $B$. If we have $A \rightarrow(A \rightarrow B)$, then, we know that we can obtain a $B$ from two resources of type $A$. But this does not mean that we can get a $B$ from a single resource of type $A$, i.e. we don’t know whether we can obtain $A \rightarrow B$. Hence, contraction fails in linear logic. Linear logics are, in fact, relevant logics that lack contraction and the distribution of conjunction over disjunction $((A \amp(B \vee C)) \rightarrow((A \amp B) \vee(A \amp C)))$. They also include two operators (! and ?) that are known as “exponentials”. Putting an exponential in front of a formula gives that formula the ability to act classically, so to speak. For example, just as in standard relevance logic, we cannot usually merely add an extra premise to a valid inference and have it remain valid. But we can always add a premise of the form $!A$ to a valid inference and have it remain valid. Linear logic also has contraction for formulae of the form $!A$, i.e., it is a theorem of these logics that $(!A \rightarrow(!A \rightarrow B)) \rightarrow(!A \rightarrow B)$ (see Troelstra 1992)[^troelstra-1992]. The use of ! allows for the treatment of resources “that can be duplicated or ignored at will” (Restall 2000, p 56)[^restall-2000]. For more about linear logic, see the entry on substructural logic.
    step1: |-
      相干逻辑不仅在哲学中，也在计算机科学中被使用。线性逻辑——Jean-Yves Girard 开创的逻辑分支——是一种计算资源的逻辑。线性逻辑学家把蕴涵 $A \rightarrow B$ 读作：拥有一个类型 $A$ 的资源，使我们能够获得某个类型 $B$ 的东西。于是，如果我们有 $A \rightarrow(A \rightarrow B)$，我们就知道可以从两个类型 $A$ 的资源获得一个 $B$。但这并不意味着我们可以从单个类型 $A$ 的资源获得一个 $B$，也就是说，我们不知道能否获得 $A \rightarrow B$。因此，收缩在线性逻辑中失败。线性逻辑实际上是缺少收缩以及合取对析取的分配 $((A \amp(B \vee C)) \rightarrow((A \amp B) \vee(A \amp C)))$ 的相干逻辑。它们还包含两个算子（! 与 ?），称为“指数”。把一个指数放在公式前面，就使该公式具有“经典地”行事的能力，可以这么说。例如，正如在标准相干逻辑中，我们通常不能仅仅给一个有效推理添加一个额外前提而让它仍然有效。但我们总可以给一个有效推理添加形如 $!A$ 的前提而让它保持有效。线性逻辑对形如 $!A$ 的公式也有收缩，即这些逻辑中有定理 $(!A \rightarrow(!A \rightarrow B)) \rightarrow(!A \rightarrow B)$（见 Troelstra 1992）[^troelstra-1992]。使用 ! 使得可以处理“可以随意复制或忽略”的资源（Restall 2000, p 56）[^restall-2000]。关于线性逻辑的更多内容，见子结构逻辑词条。
    step2: |-
      相干逻辑不只用于哲学，也用于计算机科学。线性逻辑——Jean-Yves Girard 开创的一个逻辑分支——是计算资源的逻辑。线性逻辑学家把蕴涵 $A \rightarrow B$ 读作：拥有类型 $A$ 的资源，就能得到类型 $B$ 的东西。因此，若有 $A \rightarrow(A \rightarrow B)$，便知可以从两份类型 $A$ 的资源得到一个 $B$；但这并不意味着能从单份类型 $A$ 的资源得到 $B$，也就是说，不知道能否得到 $A \rightarrow B$。所以收缩在线性逻辑中失效。线性逻辑其实就是缺少收缩、也缺少合取对析取分配律 $((A \amp(B \vee C)) \rightarrow((A \amp B) \vee(A \amp C)))$ 的相干逻辑。它还有两个算子（! 与 ?），称为“指数”：把指数加在公式前面，就好像让该公式取得“经典”行事的资格。例如，在标准相干逻辑中，通常不能只给有效推理添一个前提还让它保持有效；但加上形如 $!A$ 的前提，就总能保持有效。线性逻辑对形如 $!A$ 的公式还有收缩，即 $(!A \rightarrow(!A \rightarrow B)) \rightarrow(!A \rightarrow B)$ 是这些逻辑的定理（见 Troelstra 1992）[^troelstra-1992]。! 的用处，是处理“可以随意复制或忽略”的资源（Restall 2000, p 56）[^restall-2000]。线性逻辑的更多内容，见“子结构逻辑”词条。
