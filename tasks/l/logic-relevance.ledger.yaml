      按第二种解释，Routley–Meyer 模型的点既被看作（数学意义上的）算子，又被看作它们所作用的东西。按这种理解，$Rabc$ 意味着：把 $a$ 看作算子，当它作用于 $b$ 时产生的一切信息都包含在 $c$ 中。这种解释使 Routley–Meyer 语义在意图上与 Fine 的算子语义非常相似。这种解释也与 Dunn 的解释（特别是他关于状态中信息结合的概念）密切相关。
