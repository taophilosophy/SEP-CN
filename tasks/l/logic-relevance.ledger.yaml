      | 1. | $A_{\{1\}}$ | Hyp |
      | --- | --- | --- |
      | 2. | $B_{\{2\}}$ | Hyp |
      | 3. | $(A \amp B)_{\{1,2\}}$ | 1,2, &I |
      | 4. | $B_{\{1,2\}}$ | 3, &E |
      | 5. | $(B \rightarrow B)_{\{1\}}$ | $2,4, \rightarrow$ I |
      | 6. | $A \rightarrow(B \rightarrow B)$ | $1,5, \rightarrow$ I |
