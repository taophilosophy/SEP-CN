      与模态逻辑语义一样，相干逻辑语义把公式真值相对于世界。但 Routley 与 Meyer 比模态逻辑更进一步，使用世界上的三元关系。这允许存在 $q \rightarrow q$ 失败的世界，进而允许 $p \rightarrow(q \rightarrow q)$ 失败的世界。他们在此语义下对 $\rightarrow$ 的真值条件如下：
    step2: |-
      相干逻辑语义与模态逻辑语义一样，把公式真值相对于世界；但 Routley 与 Meyer 更进一层，采用世界间的三元关系。于是可以有使 $q \rightarrow q$ 失败的世界，从而也可以有使 $p \rightarrow(q \rightarrow q)$ 失败的世界。其 $\rightarrow$ 真值条件如下：
