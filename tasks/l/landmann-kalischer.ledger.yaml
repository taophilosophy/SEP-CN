      兰德曼-卡利舍尔列举多位为克服理性对缪斯的反叛而出力的德语作家；而艺术与美之价值的“再生”，以歌德的诗性天才为典范，并在席勒的审美书简中得到毫不含糊的记录。照她的看法，席勒对美之于善的优越性的论证无懈可击；但席勒与歌德关于美之于真的优越性的信念却不能这么说。就歌德把真构思为美的源泉、席勒把艺术构思为通往真的手段而言，他们的思想仍在启蒙运动的轨道之内。但兰德曼-卡利舍尔注意到：歌德与席勒都逐渐认识到，艺术是接纳世界的一种方式——不是通往更清晰知识的垫脚石，而是自有其位格的器官，站得“不在理性之下，而在理性之上”（*LS* 323）。她叙述哲学家至多如何接近这一认识：始于康德在知性与意欲之外认定一种纯粹的审美感情，从而容许美与真、善相协调——而非隶从于它们。相比之下，黑格尔与谢林虽有深刻的审美洞见，最终仍维护启蒙运动把艺术隶属于哲学的主张。如果我们要超拔于思辨哲学关于艺术领域之有限性的断言，并“为通过美而克服真找到新的出发点”，兰德曼-卡利舍尔提出，就必须回到歌德精神在叔本华、尼采与格奥尔格那里的延续。
