      Mention has already been made of Landmann-Kalischer’s engagement with the work of philosophers like Simmel, Stumpf, and Windelband. But the reach of her research extends to several other prominent peers and immediate predecessors as well. Her correspondence, for example, with Alexius Meinong on the status of value is substantial, apparently prompting a change of mind on his part. Citing both “On the Cognitive Value of Aesthetic Judgments” and *Philosophy of Value*, he writes that, contrary to his first impressions, Landmann-Kalischer’s explanations seem to him today “the most important” for the establishment of the conception he is sketching (Meinong 1912: 10; although the degree of Landmann-Kalischer’s grasp of Meinong’s early value-theoretic views is disputed; see Reicher 2009: 116n8)[^meinong-1912][^reicher-2009]. Also worthy of note in this connection are Landmann-Kalischer’s critical reviews of works by such prominent scholars as Theodor Lipps and Emil Lask. Her work in epistemology (see below) is replete with references to the work of Heinrich Rickert and Wilhelm Dilthey, whom she credits with demonstrating that we can know, not only the universal, but the individual; yet she rejects the notion that knowledge of the latter is reserved for the humanities (*TE* 250–256, 277).
    step1: |-
      前文已提到兰德曼-卡利舍尔与齐美尔、施通普夫、文德尔班等哲学家著作的交锋。但其研究的触角还伸向多位其他杰出的同代人与紧邻前辈。例如，她与阿历克修斯·迈农关于价值之地位的通信相当可观，显然促成了迈农观点的改变。迈农援引《论审美判断的认知价值》与《价值哲学》写道：与他的最初印象相反，兰德曼-卡利舍尔的解释在他今天看来，对于确立他正在勾勒的概念“最为重要”（Meinong 1912: 10；兰德曼-卡利舍尔对迈农早期价值论观点的把握程度尚有争议，见 Reicher 2009: 116n8）[^meinong-1912][^reicher-2009]。与此相关，她还批评性评论过特奥多尔·李普斯、埃米尔·拉斯克等杰出学者的著作。她的认识论著作（见下文）则处处征引海因里希·李凯尔特与威廉·狄尔泰——她认为这二人表明：我们不仅能认识普遍者，还能认识个别者；但她拒绝把对个别者的认识留给人文学科的观点（*TE* 250–256, 277）。
