      与知觉相比，心灵实在与服务于认识之物之间的差别，在记忆表象的情形中甚至更为刺目——记忆表象公然与前两者相冲突。我们的记忆通常是有选择的；我们太常用熟悉的表象填补记忆的空隙。同样，我们常常只记住我们想记住的、或至少有强烈动机记住的——而且这样做的方式，很难提供“一幅忠实的实在图景”。但这些特征丝毫不会使记忆的表象不那么值得艺术去忠实映照。诚然，一件艺术品——想想历史剧——若违背某些公认的、支配记忆表象的主题观点，可被视为不真。但它仍然可以忠实描绘对所发生之事的记忆，或对伴随（或据称伴随）所发生之事的感情的记忆。许多莎士比亚历史悲剧（《理查三世》《特洛伊罗斯与克瑞西达》）的“成功”——即艺术真实性——正在于此。
