      诚然，艺术并非表现心灵实在的唯一方式；内知觉亦然。不过，艺术实际上是灵魂的一面镜子，是我们看见那原本只对“内知觉”开放之物（*Essays* 70）的唯一手段。而且，这里的重点是“看见”：艺术不同于心理学之处，恰恰在于它使内知觉所予之物对外知觉开放，而心理学则把所予之物转译为概念（*Essays* 104）。照萨曼莎·马瑟恩的说法，对兰德曼-卡利舍尔而言，艺术家是“借一种艺术媒介传达关于心灵实在之真理的人”（Matherne 2023: 254）[^matherne-2023]。
