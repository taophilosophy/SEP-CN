      如前所述，胡塞尔对兰德曼-卡利舍尔思想的影响相当可观，既体现在她挪用其现象学之处，也体现在她与之拉开距离之处。布伦塔诺的影响——可谓更为深远——亦复如是。布伦塔诺对其著作的重要性有二：其一，她视他为价值客观概念的首要倡导者——她本人也接受这一概念（*Essays* 4）；其二，照她的看法，“多亏布伦塔诺、且自布伦塔诺以来”，最新研究重新熟悉了意向性现象（*TE* 8, 25）。但她也通过与布伦塔诺进路相对照来发展自己的哲学立场，至少在两个方面如此。布伦塔诺发展出今天被视为“倾向论的”进路：价值是一种较高阶的质性，双重地依赖于主体与事物属性（如第二性质那样）。兰德曼-卡利舍尔的价值哲学与这一倾向论进路一致，只有一处关键差别：她把这种倾向安放在感情而非欲望之中（见 Vendrell-Ferrarin 2014: 151–152）[^vendrell-2014]。她与布伦塔诺共享如下观念：由此产生的判断可以是客观的；但她拒绝布伦塔诺在这一关联中对一种据称直接明见的判断的诉诸（类似于不矛盾原理那样的判断，它与盲目的判断判然有别）；她拒绝这种对直观的诉诸，转而诉诸经验与辨认、清除错误的工作。“因此，兰德曼-卡利舍尔把感官判断与价值判断的客观性理解为任务，而非事实……”（Vendrell-Ferrarin 2014: 153）[^vendrell-2014]；或者照她本人的说法：“客观有效的价值不是被给予的，而是必须去赢得”（*Essays* 163）。在更一般的逻辑层面，她拒绝布伦塔诺“公理直接为真”的主张，理由有二：(a) 外知觉判断的主观明见性不亚于内知觉判断；(b) 从公理推出的判断，其主观明见性与公理本身相同（*Essays* 177–181；布伦塔诺方法与描述心理学对兰德曼-卡利舍尔思想的一般影响，见 Matherne 2023: 249–256 与 Matherne 为 *Essays* 撰写的导言 xxvii–xxxii [Matherne 2024a]）[^matherne-2023][^matherne-2024a]。
