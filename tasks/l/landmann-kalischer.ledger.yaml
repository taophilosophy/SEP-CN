      The cognitivist and objectivist position that Landmann-Kalischer fashions in this, her first major essay, has significant ramifications for contemporary debates in aesthetics. These ramifications have been forcefully demonstrated in a recent study by Samantha Matherne. Relying precisely on the line of reasoning in “On the Cognitive Value of Aesthetic Judgments”, Matherne argues for the advantages of Landmann-Kalischer’s cognitivist and objectivist approach over hedonist and Kantian approaches to the question of aesthetic demarcation and normativity (Matherne 2020)[^matherne-2020].
