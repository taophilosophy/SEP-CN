      为论证这一转向，兰德曼-卡利舍尔检讨黑格尔未经证明的主张：某种“内在性”（*Innerlichkeit*）——一份斯多亚与基督教的遗产——“高踞于精神的一切其他领域之上”，从而充当哲学思辨高于艺术领域这一主张的“生存论预设”（*LS* 328）。兰德曼-卡利舍尔就此指责黑格尔把一种特定的历史意识“绝对化”。当她展示理性如何被美翻转时，她心目中的美是这样的美：它在具体的、智性的直观中实现真，而非栖身于抽象。呼应她的认识论著作，她坚持认识自身是一种不完整的能力：“它无法把握它所展示的那些事物”；而从人作为整体的角度看，认识是“一个部分的活动”（*Teiltätigkeit*），只在从冲动到行动的过渡中起工具作用（*LS* 329）。认识着的人只运用灵魂的一个要素；行动着的人——她顺带指向艺术家，补充道：展示或塑造者（*darstellt oder bildet*）——则把它们尽收一体。
