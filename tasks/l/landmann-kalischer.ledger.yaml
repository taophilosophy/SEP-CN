      Landmann-Kalischer’s life is marked by tragedy on a personal level, particularly in the decade immediately following the publication of *Transcendenz des Erkennens*. In 1925 her daughter dies as a teenager from a rare form of tuberculosis, her husband commits suicide in 1931. Whether or not she suffered from not having her love for George requited, she experienced rejection by the *George-Kreis* that was clearly motivated in her mind by the mounting anti-semitism in Germany. At this point the personal and political tragedies of her life begin to merge. When she protested George’s sympathy for a movement that treated Jews with the brutality that National Socialism did, she reported him replying dismissively: “When I think of what Germany faces in the next fifty years, this whole Jewish thing in particular is not so important to me” (Norton 2002: 726; Karlauf 2007: 604f)[^karlauf-2007][^norton-2002]. As Landmann-Kalischer finally realized that it was impossible for Jews to remain in Germany, she dreamt of a Jewish ghetto in Namibia, before finally coming around to appreciate the approach of Zionists.
