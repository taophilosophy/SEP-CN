      As a 22-year-old student, Landmann-Kalischer attended a seminar led by Max Dessoir at which Stefan George read his poetry (Karlauf 2007: 194)[^karlauf-2007]. She later (1908) made the acquaintance of the poet who became an annual summer guest of the family in Basel from 1913 to 1927. During this time Landmann-Kalischer became a devoted, even ardent follower of the poet, keeping a regular diary of their conversations, later published as *Gespräche mit Stefan George* (Conversations with Stefan George); on her involvement in the *George-Kreis* (the circle of George’s admirers), see Raulff 2009: 139–157. Based upon a manuscript written to honor the poet on his 50ᵗʰ birthday in 1918, she publishes anonymously *Georgika: Das Wesen des Dichters* (Georgika: The Essence of the Poet) in 1920, followed by a reviewed edition in 1924. In 1923 she completed “Carl Spitteler’s Poetic Mission [*Sendung*]”, a study of the Nobel Prize-winning Swiss poet. Two further works on George would be published posthumously: *Georges Wiedererweckung der Griechen* (George’s Reawakening of the Greeks) (1955) and *Stefan George und die Griechen. Idee einer neuen Ethik* (Stefan George and the Greeks: Idea of a New Ethics) (1971).
    step1: |-
      22 岁时，兰德曼-卡利舍尔参加了一个由马克斯·德索主持的研讨班，斯特凡·格奥尔格在其中朗诵自己的诗（Karlauf 2007: 194）[^karlauf-2007]。她后来（1908）结识这位诗人；从 1913 到 1927 年，格奥尔格每年夏天都造访她在巴塞尔的家。这段时期，兰德曼-卡利舍尔成为这位诗人忠实的、甚至狂热的追随者，把两人的谈话记成定期日记，后以《与斯特凡·格奥尔格的对话》为题出版；关于她在格奥尔格圈（*George-Kreis*，格奥尔格崇拜者的圈子）中的参与，见 Raulff 2009: 139–157。基于 1918 年为庆祝诗人五十寿辰而写的一部手稿，她于 1920 年匿名出版《格奥尔基卡：诗人的本质》，1924 年又出修订版。1923 年她完成《卡尔·施皮特勒的诗性使命［*Sendung*］》，研究这位获诺贝尔奖的瑞士诗人。另有两种关于格奥尔格的著作身后出版：《格奥尔格对希腊人的唤醒》（1955）与《斯特凡·格奥尔格与希腊人：一种新伦理的理念》（1971）。
