      ## 1. Life, Work, and Influences
    step1: |-
      
    step2: |-
      
  - id: 3
    kind: body
    source: |-
      Born in Berlin in 1877, Landmann-Kalischer received her PhD in 1901 with a dissertation from the University of Zurich under the direction of Ernst Meumann on the “Analysis of Aesthetic Contemplation (Painting and Sculpture)”, based upon a combination of self-observation and art history (since, as she puts it, the subject matter exceeded the experiences of a single consciousness). During her graduate studies she took advantage of an arrangement that allowed her to attend lectures by Simmel and Stumpf in Berlin, to whom—along with Meumann—she pays special tribute in the dissertation. By her own account, “philosophy, specifically psychology, and art history” were her main scholarly interests and this description captures her own interdisciplinary approach to these subjects as well as the interwovenness of philosophy and psychology at this time. Two years after submitting her dissertation she married Julius Landmann, a Swiss economist, and over the next seven years she gave birth to three children. She and her children accompanied Landmann as he worked, first in Bern (1906–1910) for the Swiss National Bank, and then as he took up academic positions at the University of Basel (1910–1927) and at the University of Kiel (1927–1931).
    step1: |-
      
    step2: |-
      
  - id: 4
    kind: body
    source: |-
      During the first decade of the century, Landmann-Kalischer writes two important essays on topics in aesthetics: “On the Cognitive Value of Aesthetic Judgments” (1905a) and “On Artistic Truth” (1906), followed by the monograph *Philosophy of Values* (1910) which she prefaces with a critical review of Hugo von Münsterberg’s own 1908 *Philosophy of Values*. The first two essays are reviewed respectively in sections 2 and 3 below as part of the entry’s emphasis on Landmann-Kalischer’s contributions to aesthetics. However, her contributions to axiology are also noteworthy, as evidenced by her *Philosophy of Values*.
    step1: |-
      
    step2: |-
      
  - id: 5
    kind: body
    source: |-
      In the 1910 monograph she begins with a review of Münsterberg’s appeal to a world-affirming, “supra-personal” act of will—supposedly shared by all humans and ensuring coherence across human experience—as the source of value in general. Landmann-Kalischer dismisses this appeal as nothing more than an “arbitrary metaphysical assumption” (*Essays* 121). She also reviews Münsterberg’s “doctrine of four worlds”, i.e., the four autonomous domains of logical, aesthetic, ethical, and religious value, demonstrating how the doctrine departs from Windelband’s Neo-Kantian system of values. But she also contests Münsterberg’s Kant-inspired appeal to a principle of constitution to justify value-judgments’ claims of validity. On Landmann-Kalischer’s reading, Münsterberg mistakenly supposes that, just as logical judgments’ validity is based upon the fact that they constitute the world, “it must be possible to legitimize the good, the beautiful, and the holy in the same way” (*Essays* 118). By demonstrating the illegitimacy of this approach to the philosophy of value, Landmann-Kalischer sets the stage for her own approach. Rejecting the Kantian-styled project of locating “values in the construction of the world that the rationalist epistemology projects”, Landmann-Kalischer turns to the given, to values as we find them, namely, as the properties of things that we deem valuable “on the basis of an immediate feeling that they arouse in us” (*Essays* 143). In her view—building on her 1905a essay discussed in the section 2 below—we objectify feelings (‘*x* is beautiful’) just as we objectify sensations (‘*x* is red’) and with the same degree of legitimacy. Her elaboration of this view requires a differentiation of feelings from emotions; the former can be “pure” and “disinterested”, while the latter never are. With this reference to disinterestedness, the paradigmatic inspiration that Landmann-Kalischer draws from Kant’s analysis of aesthetic experience is apparent. But the immediate context is ongoing discussion in contemporary philosophy of mind about the status of feelings and emotions—for example, in the works of Stumpf and Alexis Meinong, among others—to which she contributes.
    step1: |-
      
    step2: |-
      
  - id: 6
    kind: body
    source: |-
      Mention has already been made of Landmann-Kalischer’s engagement with the work of philosophers like Simmel, Stumpf, and Windelband. But the reach of her research extends to several other prominent peers and immediate predecessors as well. Her correspondence, for example, with Alexius Meinong on the status of value is substantial, apparently prompting a change of mind on his part. Citing both “On the Cognitive Value of Aesthetic Judgments” and *Philosophy of Value*, he writes that, contrary to his first impressions, Landmann-Kalischer’s explanations seem to him today “the most important” for the establishment of the conception he is sketching (Meinong 1912: 10; although the degree of Landmann-Kalischer’s grasp of Meinong’s early value-theoretic views is disputed; see Reicher 2009: 116n8)[^meinong-1912][^reicher-2009]. Also worthy of note in this connection are Landmann-Kalischer’s critical reviews of works by such prominent scholars as Theodor Lipps and Emil Lask. Her work in epistemology (see below) is replete with references to the work of Heinrich Rickert and Wilhelm Dilthey, whom she credits with demonstrating that we can know, not only the universal, but the individual; yet she rejects the notion that knowledge of the latter is reserved for the humanities (*TE* 250–256, 277).
    step1: |-
      
    step2: |-
      
  - id: 7
    kind: body
    source: |-
      Another major influence on Landmann-Kalischer’s thinking is, as already noted, Edmund Husserl. She touts his exposition of the object of consciousness, building on studies by Bolzano and Brentano, as “the most encompassing and most emphatic” (*TE* 25). She leans on Husserl’s doctrine of fulfillment and, importantly, its limitations to craft her own view of the transcendence of knowing (*TE* 31, 34, 36, 91). More decisively than anyone else, he recognizes “seeing as the ultimate ground of all rational claims and perfect clarity as the measure of all truth” (*TE* 284). Still, she laments the fact that Husserl—“the very same scholar whom we have to thank above all for reestablishing transcendence as a fact of consciousness”—vehemently opposes any realistic, epistemological interpretation of transcendence (*TE* 47). She takes particular exception to Husserl’s insistence that an abyss separates consciousness and reality (*TE* 49). By stressing that transcendence can be attributed to objects of consciousness whether or not there is something transcendent, he shows that he does not take it [the transcendence of consciousness] “seriously” (*TE* 57). Both Husserl’s phenomenology and Cassirer’s Kantianism show their common modern, idealist stripes by taking knowing—not being—as primitive (*TE* 73).
    step1: |-
      
    step2: |-
      
  - id: 8
    kind: body
    source: |-
      As noted, Husserl’s influence on Landmann-Kalischer’s thinking is substantial in the ways that she appropriates his phenomenology as well as the ways that she distances herself from it. The same might be said for Franz Brentano’s arguably even more telling influence on her thinking. Brentano’s importance for her work is twofold: first, she regards him as the foremost advocate for the objective conception of values which she herself embraces (*Essays* 4) and second, in her view, it is “thanks to Brentano and since Brentano” that the latest research has become familiar once again with the phenomenon of intentionality (*TE* 8, 25). But she also develops her own philosophical position by setting it against Brentano’s approach in at least two respects. Brentano develops what is today deemed a “dispositionalist” approach where value is a quality of a higher order, dually dependent (like secondary qualities) on the subject as well as the properties of things. Landmann-Kalischer’s philosophy of value aligns with this dispositionalist approach, save in one crucial respect: she locates that disposition in feelings not desires (see Vendrell-Ferrarin 2014: 151–152)[^vendrell-2014]. She shares with Brentano the notion that the ensuing judgments can be objective but she rejects Brentano’s appeal to a supposedly immediately evident judgment in this connection (akin to a judgment like the principle of noncontradiction that is clearly differentiable from a blind judgment); she rejects this appeal to intuition in favor of empirical experience and the work of identifying and removing errors. “Thus, Landmann-Kalischer understands the objectivity of sensory judgments and value-judgments not as a fact but as a task, …” (Vendrell-Ferrarin 2014: 153)[^vendrell-2014] or, as Landmann-Kalischer herself puts it, “The objectively valid values are not given, but have to be won” (*Essays* 163). On a more general, logical level, she rejects Brentano’s contention that axioms are “immediately true”, rejecting it because (a) judgments of outer perception are subjectively no less evident than those of inner perception and (b) the subjective evidence of judgments derived from the axioms is the same as that of the axioms themselves (*Essays* 177–181; on the influence of Brentano’s method and descriptive psychology on Landmann-Kalischer’s thinking in general, see Matherne 2023: 249–256 and Matherne’s Introduction to *Essays* xxvii–xxxii [Matherne 2024a])[^matherne-2023][^matherne-2024a].
    step1: |-
      
    step2: |-
      
  - id: 9
    kind: body
    source: |-
      As a 22-year-old student, Landmann-Kalischer attended a seminar led by Max Dessoir at which Stefan George read his poetry (Karlauf 2007: 194)[^karlauf-2007]. She later (1908) made the acquaintance of the poet who became an annual summer guest of the family in Basel from 1913 to 1927. During this time Landmann-Kalischer became a devoted, even ardent follower of the poet, keeping a regular diary of their conversations, later published as *Gespräche mit Stefan George* (Conversations with Stefan George); on her involvement in the *George-Kreis* (the circle of George’s admirers), see Raulff 2009: 139–157. Based upon a manuscript written to honor the poet on his 50ᵗʰ birthday in 1918, she publishes anonymously *Georgika: Das Wesen des Dichters* (Georgika: The Essence of the Poet) in 1920, followed by a reviewed edition in 1924. In 1923 she completed “Carl Spitteler’s Poetic Mission [*Sendung*]”, a study of the Nobel Prize-winning Swiss poet. Two further works on George would be published posthumously: *Georges Wiedererweckung der Griechen* (George’s Reawakening of the Greeks) (1955) and *Stefan George und die Griechen. Idee einer neuen Ethik* (Stefan George and the Greeks: Idea of a New Ethics) (1971).
    step1: |-
      
    step2: |-
      
  - id: 10
    kind: body
    source: |-
      Landmann-Kalischer’s work in the early part of the century was by no means confined to aesthetics, axiology, and poetology. By 1916 she completed the first draft of a major work in epistemology: *Transcendenz des Erkennens* (*Transcendence of Knowing*); the published version appears in 1923. This work presents a robust review of the different forms of transcendence, intra-mental and extra-mental transcendence, i.e., transcendence within consciousness and transcendence of something independent of consciousness, respectively. The review culminates in a potent defense of what she deems “transcendent realism” and “a realist epistemology”. The existence of the external world is, she submits, the *Urphänomen*, providing the very sense of consciousness. The notion of a subject not transcending itself is pure fiction, even though the intention of the existing, extra-mental object is “essentially unfulfillable” (*TE* 24, 31). Although we cannot help but represent [*vorstellen*] objects,
    step1: |-
      
    step2: |-
      
  - id: 11
    kind: body
    source: |-
      > still we represent each object as unrepresented…The fact that the transcendent objects inevitably appear transcendent only to a consciousness cannot cancel the other fact that every consciousness attests to its transcendence. (*TE* 46)
    step1: |-
      
    step2: |-
      
  - id: 12
    kind: body
    source: |-
      These ruminations, it bears noting, echo unmistakably in Heidegger’s subsequent account of being-in-the-world, entailing the “transcendence” of Dasein that underlies its concerns and dealings, whether theoretical or practical, amidst innerworldly beings (Heidegger *SZ* 364). This echo is perhaps to be expected, given their common repudiation of Husserl’s idealism, and Landmann-Kalischer seems to have recognized as much (*Wissen und Werten* [Landmann 1930: 98]; Riedner 2002: 3)[^landmann-1930][^riedner-2002].
    step1: |-
      
    step2: |-
      
  - id: 13
    kind: body
    source: |-
      Not surprisingly, Landmann-Kalischer takes both idealists and positivists to task, criticizing the former for countenancing only the contents of consciousness and the latter for countenancing only appearances—as though those contents and those appearances do not point to transcendent objects (*TE* 65f). In this very connection the Jesuit Scholastic philosopher, Erich Przywara, sees *Transcendenz des Erkennens*, with its insistence that transcendence is the *a priori* of knowing, as a departure from Kant and a return to a Scholastic position, albeit with the profile of the *George-Kreis* (Przywara 1924: 65)[^przywara-1924]. Korinna Schönharl similarly reads *Transcendenz des Erkennens* as the singular, unified presentation of the “epistemological intuitions” of the *George-Kreis* and concludes by noting the work’s influence on the economist Edgar Salin (Schönharl 2009: 446–448, 465, 471–475). Landmann-Kalischer herself acknowledges the influence of conversations with the poet on the work (Landmann 1963: 15)[^landmann-1963]. Indeed, drawing on aesthetics to make an epistemological point, she emphasizes the following analogy between the object of a painting and the object of consciousness.
    step1: |-
      
    step2: |-
      
  - id: 14
    kind: body
    source: |-
      > Just as the means of the presentation [*Darstellung*] and its object are at once in the painting, so consciousness of the object and the transcendent object are at once in our knowledge. (*TE* 70)
    step1: |-
      
    step2: |-
      
  - id: 15
    kind: body
    source: |-
      The analogy holds, moreover, whether or not the object is the pure product of phantasy or a faithful imitation of something actual. So, too, the knowledge like the painting is only one of many means of portraying the object, each varying in its accuracy and what it accentuates.
    step1: |-
      
    step2: |-
      
  - id: 16
    kind: body
    source: |-
      > We may believe again in what we see and how we see it: knowledge is a picture [*Bild*]. In the copy [*Abbild*] it shows us the original [*Urbild*]. (*TE* 71)
    step1: |-
      
    step2: |-
      
  - id: 17
    kind: body
    source: |-
      Landmann-Kalischer’s life is marked by tragedy on a personal level, particularly in the decade immediately following the publication of *Transcendenz des Erkennens*. In 1925 her daughter dies as a teenager from a rare form of tuberculosis, her husband commits suicide in 1931. Whether or not she suffered from not having her love for George requited, she experienced rejection by the *George-Kreis* that was clearly motivated in her mind by the mounting anti-semitism in Germany. At this point the personal and political tragedies of her life begin to merge. When she protested George’s sympathy for a movement that treated Jews with the brutality that National Socialism did, she reported him replying dismissively: “When I think of what Germany faces in the next fifty years, this whole Jewish thing in particular is not so important to me” (Norton 2002: 726; Karlauf 2007: 604f)[^karlauf-2007][^norton-2002]. As Landmann-Kalischer finally realized that it was impossible for Jews to remain in Germany, she dreamt of a Jewish ghetto in Namibia, before finally coming around to appreciate the approach of Zionists.
    step1: |-
      
    step2: |-
      
  - id: 18
    kind: body
    source: |-
      After Hitler came to power, Landmann-Kalischer spent most of the 1930s in Basel, befriending the painter Gertrud Kantorowicz and living with the philologist Renata von Scheliha (until the latter’s emigration to the United States in 1948). During this time she gave lectures at the *Volkshochschule* in Basel and explored various interpretations of the classics. But she also returned to central themes in aesthetics, completing *Grundzüge einer Lehre vom Schönen* (Fundamentals of a Doctrine of the Beautiful) in 1940, which was available in hectograph copies until its posthumous publication as *Die Lehre vom Schönen* (The Doctrine of the Beautiful) in 1952 (Schuster, 35). Following a short visit to von Scheliha in 1951, Landmann-Kalischer died of complications from an operation.
    step1: |-
      
    step2: |-
      
