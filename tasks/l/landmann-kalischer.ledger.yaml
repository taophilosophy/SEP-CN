      在此语境中，兰德曼-卡利舍尔指出：把审美判断置于与感官判断相同的层面，似乎会在一个方面低估它们，在另一方面又不适当地拔高它们。低估，因为审美判断要求感官判断所不具有的普遍有效性；拔高，因为它们缺乏就感性性质而言可能达成的那种普遍一致。但说低估，似乎也因审美判断与人之本质的关联远为深刻。一般而言，一个人的价值判断远比其感官判断与我们攸关；但兰德曼-卡利舍尔补充道：这一差别“不构成这些判断之间任何内在对立的理由”（*Essays* 52）。至于为何所谓同等性似乎高估了审美判断，解释在于：它们缺乏感官判断的“事实普遍性”（*Essays* 52）。但兰德曼-卡利舍尔不仅指出结构性原因（许多审美判断无法达成一致，或尚无法表明达成一致），还指出某些基本的符合是可以辨认的（如对称、阈限、比例与对照），以及某些共同规则（如涉及绘画透视、戏剧技巧、音乐作曲之类）。与感官判断相比，令审美判断更趋复杂的还有一点：前者涉及“诸民族的生活”，后者通常只关涉“个体生活”（*Essays* 53）。同样，审美对象虽既存在于自然也存在于艺术中，但后者会经历最大的变迁——兰德曼-卡利舍尔补充道，这些变迁绝不只基于审美考量。
