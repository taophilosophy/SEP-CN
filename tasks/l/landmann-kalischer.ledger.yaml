      兰德曼-卡利舍尔在 1905a 论文中开篇提出两个分而治之的引导性问题：(1) “审美判断是否是认知判断”（按康德的意义——康德对此予以否认）；(2) “审美判断能否被授予超越主体的有效性，以及在何种程度上”（*Essays* 4）。她回答这些问题的策略，是详述感官判断与价值判断之间的类比。这些类比论证了三个论题：(i) 审美评价是一个“器官”的工作，其运作方式类似感觉器官；(ii) 就客观有效性而言，审美判断与感官判断处于同一水平；(iii) 美是事物的一种属性，正如感性性质是事物的属性。她指出，拥护这些论题就与大多数同时代的价值观背道而驰——布伦塔诺是唯一的例外（如前所述）。她列举了一串价值主观论的代表人物——他们断言价值既非事物属性，也非认知判断的对象。她还指出这些代表人物在另一问题上的分歧：审美判断的客观有效性、其所谓“命令式”特征，以及它与他们的价值主观论的关联。“无论在哪一位作者那里，”她写道，“都找不到一种有原则的立场，来回答价值判断能在何种范围与程度上为真为假、并据此命令［*fordern*］我们的承认或拒绝这一问题”——
