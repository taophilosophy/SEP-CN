      在《美之学说》第二章，兰德曼-卡利舍尔从“美在世界中的位置”转向“艺术中美之创造”。艺术家造就一种比自然中通常显露的和谐更复杂的和谐，因为他们把人的精神之美表达于感性形式之中。呼应她早年论艺术真理的文章，兰德曼-卡利舍尔说：“正如环绕［人的］自然在他的精神中找到一面镜子，他也在艺术中创造一面他自身之美的镜子”（*LS* 48）。在这一过程中，艺术家受两个界定性约束：须用某种质料（“*艺术的原初现象*”），以及须聚焦于单一的感觉通道。与通常经由多重感觉通道对事物的转瞬即逝的表现不同，就绘画而言“我们全体是眼睛”，就音乐而言“全体是耳朵”（*LS* 50ff）。
