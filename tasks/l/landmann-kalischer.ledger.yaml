      Not surprisingly, Landmann-Kalischer takes both idealists and positivists to task, criticizing the former for countenancing only the contents of consciousness and the latter for countenancing only appearances—as though those contents and those appearances do not point to transcendent objects (*TE* 65f). In this very connection the Jesuit Scholastic philosopher, Erich Przywara, sees *Transcendenz des Erkennens*, with its insistence that transcendence is the *a priori* of knowing, as a departure from Kant and a return to a Scholastic position, albeit with the profile of the *George-Kreis* (Przywara 1924: 65)[^przywara-1924]. Korinna Schönharl similarly reads *Transcendenz des Erkennens* as the singular, unified presentation of the “epistemological intuitions” of the *George-Kreis* and concludes by noting the work’s influence on the economist Edgar Salin (Schönharl 2009: 446–448, 465, 471–475). Landmann-Kalischer herself acknowledges the influence of conversations with the poet on the work (Landmann 1963: 15)[^landmann-1963]. Indeed, drawing on aesthetics to make an epistemological point, she emphasizes the following analogy between the object of a painting and the object of consciousness.
    step1: |-
      不足为奇，兰德曼-卡利舍尔对观念论者与实证论者都有批评：前者只承认意识的内容，后者只承认显象——仿佛这些内容与显象并不指向超越的对象（*TE* 65f）。正是在这一点上，耶稣会经院哲学家埃里希·普日瓦拉把《认识的超越》看作对康德的背离与向一种经院立场的回归——尽管带着格奥尔格圈的印记——因为此书坚持超越是认识的*先验*（*a priori*）（Przywara 1924: 65）[^przywara-1924]。科尔尼娜·舍恩哈尔同样把《认识的超越》读作格奥尔格圈“认识论直观”的独一而统一的呈现，并以此书对经济学家埃德加·萨林的影响作结（Schönharl 2009: 446–448, 465, 471–475）。兰德曼-卡利舍尔本人也承认与诗人的谈话对这部著作的影响（Landmann 1963: 15）[^landmann-1963]。事实上，她借美学来阐明一个认识论观点，强调画作对象与意识对象之间的如下类比。
