      如前所述，艺术与其余诸价值一样，源于对神圣的经验。然而，虽然形而上学、伦理或政治动机塑造了各大世界宗教，唯一诗性的宗教是希腊人的宗教：他们的诗人给了他们诸神，把诸神塑造成崇高的人，并把缪斯本身刻画为神。希腊人——“艺术的民族”——使宗教与诗互相吸收，两相增益。与“伦理-哲学宗教”的对比再鲜明不过；这里兰德曼-卡利舍尔也把继承摩西律法的伦理宗教包括在内（不作上帝的形象——这条律法把图像艺术逼入装饰，并使诗性幻想贫瘠），还包括禁欲-哲学的宗教（对尘世与人、对美感之预设的爱在其中枯萎）。任何把教义集中于另一世界的宗教，都冒着一桩大险：把艺术与美感牺牲给对这“尘世泪谷”的轻蔑（*LS* 296）。
