      论证的第一步，是确立价值与感情的基本关联——与欲望（意志）或与主体的理想（规范）相对。若有所说，欲望以感情为前提；而直接的价值判断完全独立于理想（何况理想本身已是一种价值，因此丧失了“它是价值的形成者”这一主张的资格）。驳斥这两种价值观之后，兰德曼-卡利舍尔得出结论：“与大多数心理学家一道”，价值的内容应在其与感情的关联中来看。这里的典范是康德的“纯粹的、无利害的鉴赏判断”——它基于对象与主体苦乐感受的关联（因此，此处所考虑的价值只是原初的、无中介的价值；经济价值与功利价值皆被排除在外，因为二者都以其他价值为前提）。
