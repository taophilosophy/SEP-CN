      To be sure, art is not the only way of representing the reality of the mind; inner perception does as well. Still, art is in effect a mirror of the soul, our only means of seeing what is otherwise only available to “inner perception” (*Essays* 70). The emphasis here, moreover, is on “seeing” since art differs from psychology, precisely by making what is given to inner perception accessible to outer perception, whereas psychology translates what is so given into concepts (*Essays* 104). As Samantha Matherne puts it, an artist is for Landmann-Kalischer “someone who conveys truths about psychic reality through an artistic medium” (Matherne 2023: 254)[^matherne-2023].
