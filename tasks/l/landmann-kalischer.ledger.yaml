      虽然一切人的美都是人的精神之美，这绝不意味着每个人性表达都是美的。精神自身、以及灵魂，都必须首先是美的；如同身体，它们的美取决于其一切功能与能力的和谐——认知的与意愿的、意识的与无意识的。人的精神是一个整体；以其他方面为代价发展一面，是不美的。就此兰德曼-卡利舍尔援引如下情形：自古典主义与浪漫主义以来，“美的灵魂”这一概念已与感伤混为一谈，丧失其“真正内容”。为守住这一概念，她提出，我们必须回到“度量与和谐”——古希腊古典时代所弘扬的善与美的统一（*καλοκἀγαθός*）。此外，精神之美固然清晰可见并把自己铸入固定形式（范型性地表达于希腊雕像），但其“真正展开”发生在生活中，在人所作与所不为之中，在人承受并塑造的命运之中（*LS* 40）。
