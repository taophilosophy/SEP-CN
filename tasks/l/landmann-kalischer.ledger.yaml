      As noted, Husserl’s influence on Landmann-Kalischer’s thinking is substantial in the ways that she appropriates his phenomenology as well as the ways that she distances herself from it. The same might be said for Franz Brentano’s arguably even more telling influence on her thinking. Brentano’s importance for her work is twofold: first, she regards him as the foremost advocate for the objective conception of values which she herself embraces (*Essays* 4) and second, in her view, it is “thanks to Brentano and since Brentano” that the latest research has become familiar once again with the phenomenon of intentionality (*TE* 8, 25). But she also develops her own philosophical position by setting it against Brentano’s approach in at least two respects. Brentano develops what is today deemed a “dispositionalist” approach where value is a quality of a higher order, dually dependent (like secondary qualities) on the subject as well as the properties of things. Landmann-Kalischer’s philosophy of value aligns with this dispositionalist approach, save in one crucial respect: she locates that disposition in feelings not desires (see Vendrell-Ferrarin 2014: 151–152)[^vendrell-2014]. She shares with Brentano the notion that the ensuing judgments can be objective but she rejects Brentano’s appeal to a supposedly immediately evident judgment in this connection (akin to a judgment like the principle of noncontradiction that is clearly differentiable from a blind judgment); she rejects this appeal to intuition in favor of empirical experience and the work of identifying and removing errors. “Thus, Landmann-Kalischer understands the objectivity of sensory judgments and value-judgments not as a fact but as a task, …” (Vendrell-Ferrarin 2014: 153)[^vendrell-2014] or, as Landmann-Kalischer herself puts it, “The objectively valid values are not given, but have to be won” (*Essays* 163). On a more general, logical level, she rejects Brentano’s contention that axioms are “immediately true”, rejecting it because (a) judgments of outer perception are subjectively no less evident than those of inner perception and (b) the subjective evidence of judgments derived from the axioms is the same as that of the axioms themselves (*Essays* 177–181; on the influence of Brentano’s method and descriptive psychology on Landmann-Kalischer’s thinking in general, see Matherne 2023: 249–256 and Matherne’s Introduction to *Essays* xxvii–xxxii [Matherne 2024a])[^matherne-2023][^matherne-2024a].
