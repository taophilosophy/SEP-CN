      在古代晚期，宗教与诗是不可分割的教育手段；因此当时理性对诗的战斗也是对宗教的战斗。到了十七世纪，诗与艺术起初倒是与启蒙运动转向此世、对抗宗教的彼世性的事业同气连枝。然而理性越扩张自己的领域，就越与美感相疏离。据说审美感情徒劳地摸索理智所能清晰分明把握的东西；艺术沦为不过“孩童的游戏，*delectatio puerilis*”——须先从理性那里讨得许可；而沉溺于审美愉悦者不由自主地怀着“负罪感”——卢梭正利用了这种情绪（*LS* 317–320）。
