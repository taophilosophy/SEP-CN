      From a historical point of view, La Forge’s emphasis on the non-transfer argument for occasionalism had some impact on later debates, especially in the British arena. Antoine Le Grand (1629–1699), originally from France, spent a large part of his life in England. He was active in the second half of the seventeenth century as an author of important Cartesian textbooks, in which he shows sympathy for occasionalism and supports it by adopting La Forge’s non-transfer argument. Arguably reacting against the success that occasionalism was enjoying, John Toland (1670–1722) would go on to call occasionalism applied to the physical realm a “monstrous hypothesis” and reject it in his *Letter to Serena* (1704, letter V; see Sangiacomo 2013)[^sangiacomo-2013] discussing again the same argument.
