    source: |-
      La Forge was born on 24 or 26 November 1632 in La Flèche, in the Loire valley in central France, the same town in which Descartes had attended college between 1607 and 1615. He became a medical doctor, and then moved to Saumur, where he married Renée Bizard in 1653. He practised medicine at Saumur until his premature death in 1666. There had been a Huguenot college at Saumur since 1599, when it was founded by Philippe Duplessis-Mornay (1549–1623). Moïse Amyraut (1596–1664) and Robert Chouet (1642–1731) were among the notable contemporary scholars who taught there. There was also an Oratorian school (the *Collège royal des Catholiques*) and an adjoining seminary in the same town, at *Notre Dame des Ardilliers*. A number of Catholic philosophers had studied in the latter, including Bernard Lamy (1640–1715) and, for a brief period, Nicolas Malebranche. Both colleges were receptive to the ‘new’ philosophy of Cartesianism and, apparently, their staff members enjoyed more amicable relations than might have been expected from the history of the religious traditions that they represented. Following revocation of the Edict of Nantes (1685), the Calvinist college was razed, while *Notre Dame des Ardilliers* survives as a school to this day.
    step1: |-
      拉弗尔热于 1632 年 11 月 24 日或 26 日出生在法国中部卢瓦尔河谷的拉弗莱什，即笛卡儿 1607 至 1615 年间就读的同一座城镇。他成为医学博士，随后迁往索米尔，1653 年在那里与勒内·比扎尔结婚。他在索米尔行医，直至 1666 年英年早逝。自 1599 年菲利普·迪普莱西-莫尔奈（1549–1623）创办胡格诺派学院以来，索米尔一直有这样一所学院。莫伊兹·阿米罗（1596–1664）与罗贝尔·舒埃（1642–1731）是当时在该校任教的著名学者。同一城镇还有一所奥拉托利会学校（*Collège royal des Catholiques*）及其附属神学院，位于 *Notre Dame des Ardilliers*。一批天主教哲学家曾在该神学院学习，包括贝尔纳·拉米（1640–1715），以及短暂就读的尼古拉·马勒伯朗士。两所学院都接纳“新”哲学即笛卡儿主义，而且其教职员之间的关系显然比人们根据它们所代表的宗教传统史所预期的更为融洽。1685 年《南特敕令》撤销后，加尔文派学院被夷平，而 *Notre Dame des Ardilliers* 作为学校存续至今。
    step2: |-
      拉弗尔热 1632 年 11 月 24 日或 26 日生于法国中部卢瓦尔河谷的拉弗莱什——正是笛卡儿 1607 至 1615 年就读的城镇。他取得医学博士学位后迁居索米尔，1653 年与勒内·比扎尔成婚，并在那里行医，直至 1666 年早逝。索米尔自 1599 年菲利普·迪普莱西-莫尔奈（1549–1623）创办胡格诺派学院起，便有此校；莫伊兹·阿米罗（1596–1664）与罗贝尔·舒埃（1642–1731）都曾在此执教，颇负时名。同城另有奥拉托利会学校（*Collège royal des Catholiques*）及附属神学院，位于 *Notre Dame des Ardilliers*；贝尔纳·拉米（1640–1715）等一批天主教哲学家曾在此研习，尼古拉·马勒伯朗士亦曾短期就读。两所学院都对“新”哲学即笛卡儿主义持开放态度，其教职员之间的关系，显然也比两派宗教传统的历史所预示的更为和睦。1685 年《南特敕令》被撤销后，加尔文派学院遭夷平，而 *Notre Dame des Ardilliers* 则作为学校存续至今。
  - id: 4
    kind: body
    source: |-
      La Forge became acquainted with Cartesianism when he studied at La Flèche, and he continued his interest while practicing medicine at Saumur, where he had opportunities to discuss philosophy with other sympathetic readers of Descartes at both the Oratorian school and at the Reformed Academy, especially with Chouet. Although he lived in the provinces, he corresponded with some leading Cartesians of the period, including Géraud de Cordemoy (1626–84), who published his own contribution to Cartesianism in the same year as La Forge (Cordemoy 1666)[^cordemoy-1666]. When Claude Clerselier (1614–84) began to edit Descartes’ works and prepare them for publication, he acquired manuscript copies of two of his unpublished essays entitled *Traité de l’Homme* and *Description du Corps Humain*, both of which have since been lost. The *Traité* was the second part of a book that Descartes had planned to publish as *Traité de la lumière*. However, those plans were deferred indefinitely when news of Galileo’s condemnation reached Holland in 1633 and, as a result, the *Traité de l’Homme* remained unpublished during its author’s lifetime. Nonetheless, Descartes retained the manuscript throughout his peripatetic life; he also appears to have made at least two copies for friends (Otegem, 2002: II, 485–536), through whom in turn his physiological studies acquired a limited dissemination. In 1648, Descartes revisited his early work in physiology; he reported that it was almost illegible, due to the condition of the manuscript, and he began to draft a supplementary sketch of the conception and birth of animals in a manuscript entitled *Description du Corps Humain*.
    step1: |-
      拉弗尔热在拉弗莱什求学时接触到笛卡儿主义，此后在索米尔行医期间兴趣不减；他在那里有机会与奥拉托利会学校和改革宗学院中其他同情笛卡儿的读者讨论哲学，尤其是与舒埃。虽然他身居外省，却与当时一些重要的笛卡儿主义者通信，包括热罗·德·科尔德穆瓦（1626–84），后者与拉弗尔热同年发表了自己对笛卡儿主义的贡献（Cordemoy 1666）[^cordemoy-1666]。当克洛德·克莱尔塞利耶（1614–84）开始编辑笛卡儿著作并准备出版时，他获得了笛卡儿两篇未刊文稿《论人》（*Traité de l’Homme*）与《人体描述》（*Description du Corps Humain*）的抄本，二者此后均已佚失。《论人》原为笛卡儿计划以《光论》（*Traité de la lumière*）为题出版的书的第二部分。然而，1633 年伽利略受谴责的消息传到荷兰后，这些计划被无限期搁置；结果《论人》在作者生前未能出版。尽管如此，笛卡儿在辗转流离的一生中始终保存着这部手稿；他似乎还至少为友人抄录了两份（Otegem, 2002: II, 485–536），其生理学研究遂借由这些抄本得到有限流传。1648 年，笛卡儿重新审视自己早年的生理学工作；他报告说，由于手稿状况不佳，它几乎无法辨认，并开始在一部题为《人体描述》的手稿中起草关于动物受孕与出生的补充纲要。
    step2: |-
      拉弗尔热在拉弗莱什读书时初识笛卡儿主义，此后在索米尔行医期间兴趣不减，并有机会与奥拉托利会学校、改革宗学院中其他同情笛卡儿思想的读者讨论哲学，尤与舒埃过从。他虽身居外省，却与当时一些重要的笛卡儿主义者通信，其中包括热罗·德·科尔德穆瓦（1626–84）——后者恰与拉弗尔热同年发表了自己对笛卡儿主义的贡献（Cordemoy 1666）[^cordemoy-1666]。克洛德·克莱尔塞利耶（1614–84）着手编辑、整理笛卡儿遗著以备出版时，得到了笛卡儿两篇未刊文稿《论人》（*Traité de l’Homme*）与《人体描述》（*Description du Corps Humain*）的抄本，二者今皆佚失。《论人》本是笛卡儿拟以《光论》（*Traité de la lumière*）为总题出版之书的第二部分；但 1633 年伽利略获罪的消息传至荷兰，该计划遂无限期搁置，《论人》因而在作者生前未曾刊行。尽管如此，笛卡儿在辗转漂泊的一生中始终保存此稿，似乎还至少为友人抄录了两份（Otegem, 2002: II, 485–536），其生理学研究便借此获得有限流传。1648 年，笛卡儿重理早年生理学旧稿，自称手稿状况不佳、几不可辨，并着手在题为《人体描述》的手稿中补写动物受孕与出生的纲要。
  - id: 5
    kind: body
    source: |-
      Both unpublished texts were still in poor condition when Descartes died in 1650. Among other deficiencies, they lacked most of the diagrams that were required to make his theory intelligible to readers, which Descartes had been unable to draw. Since Clerselier was equally incapable of providing adequate illustrations, he invited various people to prepare them. A number of those who understood Cartesian physiology (including Henricus Regius) refused to cooperate. Clerselier eventually identified two willing collaborators; one was Louis de la Forge, in Saumur, and the other was Gerard van Gutschoven (1615–68), a professor of anatomy in Louvain. Clerselier accepted both offers of assistance and published their illustrations in the first edition. When the results of their artistic efforts coincided, he usually preferred those of Gutschoven because they were better drawn; however, when they differed, he published both and used the letters ‘F’ and ‘G’ to identify their respective authors. La Forge was thus credited with seven of the published illustrations. Descartes’ *Traité de l’Homme*, with these illustrations and extensive notes by La Forge, was published in Paris in April 1664. Thus La Forge’s first publication was the lengthy set of notes that explain various features of Descartes’ *Traité*, which appeared as *Remarques* on pp. 171–408 of the first French edition of that work. Meantime, Florentius Schuyl (1619­–69) had already published independently a Latin translation of the manuscript of the *Traité* in 1662, under the title *De Homine* (Descartes 1662)[^descartes-1662].
    step1: |-
      笛卡儿 1650 年去世时，这两部未刊文稿状况仍然不佳。除其他缺陷外，它们缺少使他的理论能为读者理解所必需的大部分图解，而笛卡儿本人未能绘制这些图。由于克莱尔塞利耶同样无法提供充分的插图，他便邀请多人来绘制。一些懂笛卡儿生理学的人（包括亨里库斯·雷吉乌斯）拒绝合作。克莱尔塞利耶最终找到两位愿意合作的绘图者：一位是索米尔的拉弗尔热，另一位是鲁汶的解剖学教授赫拉德·范·古茨霍芬（1615–68）。克莱尔塞利耶接受了双方的协助，并在第一版中刊出他们的插图。当两人的绘图成果一致时，他通常偏好古茨霍芬的，因为画得更好；当二者不同时，他便两幅都刊出，并用字母“F”和“G”标明各自的作者。拉弗尔热因此有七幅插图被采用并署名。笛卡儿的《论人》连同这些插图与拉弗尔热的大量注释，于 1664 年 4 月在巴黎出版。于是拉弗尔热的首次发表，就是那套解释笛卡儿《论人》各处内容的冗长注释，以《评注》（*Remarques*）为题刊于该书第一版法文版的第 171–408 页。与此同时，弗洛伦提乌斯·斯许尔（1619–69）已于 1662 年独立出版了《论人》手稿的拉丁文译本，题为《论人》（*De Homine*，Descartes 1662）[^descartes-1662]。
    step2: |-
      1650 年笛卡儿去世时，这两部未刊稿仍状况不佳：除其他缺陷外，它们缺少使理论可为读者理解所必需的大部分图解，而笛卡儿本人无力绘制。克莱尔塞利耶同样画不出像样的插图，便延请多人代绘。一些通晓笛卡儿生理学的人（如亨里库斯·雷吉乌斯）拒绝合作。克莱尔塞利耶最终找到两位愿意帮忙的人：索米尔的拉弗尔热，以及鲁汶的解剖学教授赫拉德·范·古茨霍芬（1615–68）。他接受了二人的协助，并将插图刊入第一版：若两人所绘相同，他通常取古茨霍芬之作，因其画工更佳；若有出入，则两幅并刊，以字母“F”“G”分别标示作者。拉弗尔热因此有七幅插图得以署名。笛卡儿的《论人》连同这些插图和拉弗尔热的长篇注释，于 1664 年 4 月在巴黎问世。拉弗尔热的首次发表，便是这套解释《论人》各处内容的冗长注释，题为《评注》（*Remarques*），收于该书第一版法文版第 171–408 页。与此同时，弗洛伦提乌斯·斯许尔（1619–69）已于 1662 年单独刊行《论人》手稿的拉丁译本，题为《论人》（*De Homine*，Descartes 1662）[^descartes-1662]。
