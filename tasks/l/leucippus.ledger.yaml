  - id: 3
    kind: body
    source: |-
      Leucippus is variously said to have been born in Elea, Abdera or Miletus (DK 67A1). His dates are unknown, other than that he lived during the fifth century BCE. Diogenes Laertius reports that he was a student of Parmenides’ follower Zeno (DK 67A1). Zeno is best known for paradoxes suggesting that motion would be impossible if a magnitude could be divided into an infinite number of parts, each of which must be traversed, and other absurdities associated with taking magnitudes to be infinitely divisible. The likelihood that atomism is thought to have been formulated at least partly in response to these arguments may account for the story that Leucippus was a student of Zeno.
    step1: |-
      关于留基伯的出生地有不同说法：爱利亚（Elea）、阿布德拉（Abdera）或米利都（Miletus）（DK 67A1）。他的生卒年代不详，只知道他生活在公元前五世纪。第欧根尼·拉尔修（Diogenes Laertius）记载，他是巴门尼德的追随者芝诺的学生（DK 67A1）。芝诺最为人知的是这样一些悖论：如果一个量可以被分割成无限多个部分，而运动者必须逐一经过每个部分，那么运动就是不可能的；此外还有其他与“量可无限分割”这一主张相联系的荒谬结论。原子论之所以被认为至少部分是针对这些论证而提出的，这或许可以解释留基伯是芝诺学生的传说。
    step2: |-
      至于留基伯的出生地，说法不一：爱利亚（Elea）、阿布德拉（Abdera）或米利都（Miletus）（DK 67A1）。其生卒年代无从考定，仅知他活跃于公元前五世纪。第欧根尼·拉尔修（Diogenes Laertius）记载，他曾受业于巴门尼德的追随者芝诺（DK 67A1）。芝诺以悖论闻名：倘若一个量可以分割为无限多个部分，而运动又必须逐一经过每个部分，运动便不可能发生；此外还有若干同样源于“量可无限分割”这一设定的谬论。原子论通常被认为至少部分是应答这些论证而成形的——留基伯师从芝诺的传闻，或许正可以由此得到解释。
  - id: 4
    kind: body
    source: |-
      The extent of Leucippus’ contribution to the developed atomist theory is unknown. His relationship to Democritus, and even his very existence, was a subject of considerable controversy in nineteenth century scholarship (Graham 2008)[^graham-2008]. Most reports on early Greek atomism refer to the views of Democritus alone, or to both atomists together; Epicurus seems even to have denied that there was a philosopher Leucippus (DK 67A2). Aristotle certainly ascribes the foundation of the atomist system to Leucippus. Leucippus is sometimes said to have been the author of a work called the *Great World-System*; one surviving quotation is said to have come from a work *On Mind*.
    step1: |-
      留基伯对成熟的原子论理论的贡献有多大，不得而知。他与德谟克利特的关系，甚至他是否实有其人，都是十九世纪学术界相当有争议的问题（Graham 2008）[^graham-2008]。关于早期希腊原子论的大多数记载，或者只提德谟克利特的观点，或者把两位原子论者放在一起谈论；伊壁鸠鲁（Epicurus）甚至似乎否认存在一位名叫留基伯的哲学家（DK 67A2）。亚里士多德（Aristotle）则明确把原子论体系的创立归于留基伯。有人说留基伯是一部题为《大宇宙系统》（*Great World-System*）的著作的作者；一条传世的引文据说出自一部《论心灵》（*On Mind*）。
    step2: |-
      留基伯对成形后的原子论究竟贡献几何，已无从确知。他与德谟克利特的关系，乃至他本人是否实有其人，在十九世纪的学术界曾引起不小的争论（Graham 2008）[^graham-2008]。记载早期希腊原子论的文献，大多或者单述德谟克利特的观点，或者将两位原子论者并而论之；伊壁鸠鲁（Epicurus）甚至似乎否认过世上有留基伯这位哲学家（DK 67A2）。亚里士多德（Aristotle）则明确将原子论体系的奠基归诸留基伯。据说留基伯著有《大宇宙系统》（*Great World-System*）一书；仅存的一条引文，据说出自《论心灵》（*On Mind*）一书。
