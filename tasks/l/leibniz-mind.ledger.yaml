      按照莱布尼茨，物体（作为物质）是聚集体，而聚集体当然由于缺乏统一性而不是实体。上文的说法是：聚集体所具有的任何存在或实在性，都来自其组成成分的存在与实在性。因此，莱布尼茨认为，如果一个物体要有任何实在性，如果它要不只是“一个缺乏一切实在性的现象，如同一场连贯的梦”，那么它最终必须由真实存在的东西构成。他主张，原子不适于这一角色，因为原子本身是广延的存在者，而对莱布尼茨来说，可分性是广延的本质。也就是说，相信不可分原子的人使物质“在这一处可分，在另一处不可分”（《论自然本身》（1698）；G IV, 513/A&G 165），但“我们无法解释为什么具有确定微小尺寸的物体[即原子]不应当进一步可分”（《第一真理》（1686）；C 522/A&G 34）。对莱布尼茨来说，每一广延的质量都由广延的部分构成；因此，即便我们能设想一个原子由物理上不可分划的部分构成，“一部分对另一部分的不可克服的黏合也丝毫不会破坏这些部分的多样性”（《自然新体系》（1695）；G IV, 482/W&F 16），也就是说，丝毫不能克服这样的事实：它是由部分构成的聚集体，而非真实地是一的存在者。同样，数学点“即便无限多的点聚为一个，也不会构成广延”（致德博斯，1709 年 4 月 30 日；G II, 370/L 597），因此不能被理解为广延物体的组成成分。因此，莱布尼茨选择了上引诸选项中的最后一项：物体的组成成分是“某些……拥有真实统一性的实体”。这些实体无部分、非广延、不可分，因此是莱布尼茨意义上的实在存在者。的确，在若干著述中，莱布尼茨邀请我们按照我们关于灵魂的概念来设想这些实体。这些单纯实体是唯一足以莫基底物实在性的东西。诚然，莱布尼茨告诉我们，实体并不作为物体的部分构成物体，而是作为物体的“最初元素”或“原始统一体”。如他有时所说，物体“产生自”这些构成性统一体。也就是说，物体就是诸实体的聚集体，它们*在我们看来*是广延的有形现象，尽管它们是“有根基的”现象；它们奠基于实在的存在者。
