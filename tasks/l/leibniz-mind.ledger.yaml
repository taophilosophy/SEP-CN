      What do we find in the human mind? Representations on the one hand, and tendencies, inclinations, or strivings on the other, according to Leibniz. Or, to put this in Leibniz’s more customary terminology, what is found within us is perception and appetition. Human minds count for Leibniz as simple substances, and, as he says in a letter to De Volder of 30 June 1704, “it may be said that there is nothing in the world except simple substances, and, in them, perception and appetite” (G II, 270/A&G 181).
    step1: |-
      在人类心灵中我们发现了什么？按照莱布尼茨，一边是再现，另一边是倾向、爱好或奋力。或者用莱布尼茨更惯用的术语说，在我们之内发现的是知觉与欲求。在莱布尼茨那里，人类心灵算作单纯实体；正如他在 1704 年 6 月 30 日致德伏尔德的信中所说：“可以说，世界上除了单纯实体，以及在它们之中的知觉与欲求，别无他物”（G II, 270/A&G 181）。
    step2: |-
      在人类心灵中，我们发现了什么？照莱布尼茨：一边是再现；另一边是倾向、爱好或奋力。或者用他更惯用的术语说：在我们之内发现的，是知觉与欲求。人类心灵在莱布尼茨那里算作单纯实体。正如他在 1704 年 6 月 30 日致德伏尔德的信中所言：“可以说，世界上除了单纯实体，以及在它们之中的知觉与欲求，别无他物”（G II, 270/A&G 181）。
