      不应由此推断：这种趋向变化的欲求倾向完全只受动力因的支配。因为在莱布尼茨看来，价值与目的因并没有被排除在心灵的活动、心理状态的变化之外。正如他在《形而上学谈话》第 13 节（1686）所说，正如“上帝将永远做最好的事情，……人也总是做……在他看来最好的事情”（G IV, 438/A&G 46）。显现当然与知觉有关；做与欲求有关。因此，正如人们所期待的，这条人类行动的原则直接适用于单子内在生活的两个关键因素——只是价值或所思目的的角色如今更清晰地聚焦。这正是为什么莱布尼茨说，在物体的层面（对莱布尼茨来说，即有根基的现象的层面），一切都依照动力因的法则发生；而就知觉与欲求而言（或者至少就其中一些而言——这里的解释有分歧），一切都依照目的因的法则发生。虽然两类因果作用都可以在两个层面找到（参见 Carlin 2006）[^carlin-2006]，但鉴于莱布尼茨体系中目的因与动力因的和谐，这里并没有冲突。
