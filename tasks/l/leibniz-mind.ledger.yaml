      Leibniz’s account of mind-body causation was in terms of his famous doctrine of the *pre-established harmony*. According to the latter, (1) no state of a created substance has as a real cause some state of another created substance (i.e. a denial of inter-substantial causality); (2) every non-initial, non-miraculous, state of a created substance has as a real cause some previous state of that very substance (i.e. an affirmation of intra-substantial causality); and (3) each created substance is programmed at creation such that all its natural states and actions are carried out in conformity with all the natural states and actions of every other created substance.
    step1: |-
      莱布尼茨对身心因果的说明，是以他著名的前定和谐学说给出的。按照该学说：（1）一个被造实体的任何状态都不以另一个被造实体的某个状态为实在原因（即否认实体间因果性）；（2）一个被造实体的每一个非初始、非奇迹的状态，都以该实体自身的某个先前状态为实在原因（即肯定实体内因果性）；（3）每个被造实体在创造时即被编程，使其一切自然状态与行动，同所有其他被造实体的一切自然状态与行动相符合地展开。
