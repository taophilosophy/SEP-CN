      But Leibniz had much to say about the philosophy of mind that goes well beyond these traditionally important topics. Perhaps surprisingly, his system sometimes contains ideas of relevance even to contemporary discussions in the cognitive sciences. More generally, he discusses in depth the nature of perception and thought (conscious and unconscious) and the nature of human motivation and striving (or, as he would say, appetition). We will take up such topics in what follows.
    step1: |-
      但莱布尼茨关于心灵哲学还有许多论述，远远超出这些传统上重要的论题。或许令人惊讶，他的体系有时甚至包含与当代认知科学讨论相关的观念。更一般地说，他深入讨论了知觉与思想（有意识的与无意识的）的本性，以及人类动机与奋力（或如他会说的，欲求）的本性。下文将讨论这些论题。
    step2: |-
      但莱布尼茨关于心灵哲学的论述，远远超出这些传统要题。或许令人惊讶：他的体系有时甚至包含与当代认知科学讨论相关的观念。更一般地说，他深入探讨了知觉与思想（有意识的与无意识的）的本性，以及人类动机与奋力（appetition，如他自己的措辞）的本性。下文将逐一讨论。
