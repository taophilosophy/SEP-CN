    source: |-
      Leibniz’s place in the history of the philosophy of mind is best secured by his *pre-established harmony*. In a more popular view, this is the thesis that, roughly, there is no mind-body interaction strictly speaking, for there is only a non-causal relationship of harmony, parallelism, or correspondence between mind and body. Certainly, the pre-established harmony is important for a proper understanding of Leibniz’s philosophy of mind. But there is much more to be considered, and even when it comes to the pre-established harmony, this more popular view needs to be refined, particularly insofar as it suggests that Leibniz accepts a roughly Cartesian, albeit non-interactionist dualism. He does not accept such a dualism, and in fact, Leibniz is justly famous for his critiques not only of materialism but also of any dualism of this sort. In short, he made important contributions to a number of classical topics in the philosophy of mind, including materialism, dualism, and mind-body interaction.
    step1: |-
      莱布尼茨在心灵哲学历史中的地位，最可靠地奠立于他的*前定和谐*。在一种较流行的看法中，这大致是这样一条论题：严格说来不存在身心交互，因为心灵与身体之间只有一种非因果的和谐、平行或对应关系。当然，前定和谐对于正确理解莱布尼茨的心灵哲学十分重要。但还有多得多的东西需要考虑；而且即便就前定和谐而言，这种较流行的看法也需要修正——尤其当它暗示莱布尼茨接受一种大致笛卡尔式的、虽非交互论的二元论时。他不接受这样的二元论；事实上，莱布尼茨之享有盛名，正在于他不仅批判唯物主义，也批判任何这类二元主义。总之，他对心灵哲学中若干经典论题——包括唯物主义、二元论与身心交互——作出了重要贡献。
    step2: |-
      莱布尼茨在心灵哲学史上的地位，最可靠地奠立于其*前定和谐*（pre-established harmony）学说。在一种较为流行的理解中，这大致是说：严格讲来，身心之间并无交互作用，二者之间只有一种非因果性的和谐、平行或对应关系。诚然，前定和谐对正确理解莱布尼茨的心灵哲学至关重要。但尚有远多的东西需要考虑；而且即便就前定和谐而论，这种流行看法也须修正——尤其当它暗示莱布尼茨接受一种大致笛卡尔式的、虽非交互论的二元论之时。他不接受这样的二元论；事实上，莱布尼茨之享有盛名，正在于他既批判唯物主义，也批判任何这类二元主义。总之，他对心灵哲学中若干经典论题——唯物主义、二元论与身心交互——皆有重要贡献。
