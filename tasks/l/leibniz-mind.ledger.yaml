      There is evidence, notably from the *New Essays*, that Leibniz did indeed draw a parallel between perceptions and appetitions with respect to consciousness. Although he did not always explain the distinction between conscious and unconscious appetitions with care and uniformity, it seems clear that he committed himself to appetitions of which we are not conscious, or which we do not apperceive, just as he had committed himself to perceptions which are not apperceived. Consider the following two statements in combination: “desires and tendencies which are apperceived are often called volitions” (*New Essays*, Bk.II, ch.21, sec.39; RB 192); and, “There are also efforts that result from insensible perceptions which one does not apperceive, and these I prefer to call *appetitions* rather than volitions (although there are also apperceptible appetitions)” (*New Essays*, Bk.2, ch.21, sec.5; RB 173).
    step1: |-
      有证据——尤其来自《新论》——表明莱布尼茨确实在意识问题上于知觉与欲求之间作了平行比较。虽然他并不总是以细致而一致的方式解释有意识欲求与无意识欲求的区分，但显然，他承诺了我们所意识不到的、或我们不予统觉的欲求，正如他曾承诺未被统觉的知觉。请把下面两段话合起来考虑：“被统觉的欲望与倾向常被称为意志”（《新论》第二卷第 21 章第 39 节；RB 192）；“还有一些努力，产生自人们不予统觉的无法感觉的知觉；我更愿意把这些称为*欲求*而不是意志（尽管也有可统觉的欲求）”（《新论》第二卷第 21 章第 5 节；RB 173）。
    step2: |-
      有证据——尤见于《新论》——表明：莱布尼茨确实在意识问题上，于知觉与欲求之间作了平行比较。虽然他并不总是以细致而一致的方式解释有意识欲求与无意识欲求之别，但显然，他承诺了我们所意识不到的、或我们不予统觉的欲求——正如他曾承诺未被统觉的知觉。请把下面两段话合观：“被统觉的欲望与倾向常被称为意志”（《新论》第二卷第 21 章第 39 节；RB 192）；“还有一些努力，产生自人们不予统觉的无法感觉的知觉；我更愿意把这些称为*欲求*而不是意志（尽管也有可统觉的欲求）”（《新论》第二卷第 21 章第 5 节；RB 173）。
