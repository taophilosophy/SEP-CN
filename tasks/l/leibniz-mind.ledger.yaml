      > I believe that *where there are only beings through aggregation, there will not even be real beings*. For every being through aggregation presupposes beings endowed with a true unity, because it obtains its reality from nowhere but that of its constituents, so that it will have no reality at all if each constituent being is still an entity through aggregation; or else, one must yet seek another basis to its reality, which in this way, if one must constantly go on searching, can never be found…. If there are aggregates of substances, there must also be genuine substances from which all the aggregates result. One must therefore necessarily arrive either at mathematical points from which certain authors make up extension, or at Epicurus’ and M. Cordemoy’s atoms (which you, like me, dismiss), or else one must acknowledge that no reality can be found in bodies, or finally one must recognize certain substances in them that possess a true unity. (G II, 96/LA 120)
