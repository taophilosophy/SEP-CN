      最后，有一些段落——尤其在《人类理智新论》（1704）中——莱布尼茨相当直接或间接地把统觉归于野兽。例如，他讨论了一头野猪的情形：野猪起初对人只有赤裸知觉，直到那人向它喊叫，野猪便统觉到这个人（“*s’apperçoit d’une personne*”），开始冲锋（第二卷第 21 章第 5 节；A vi VI 173）。
    step2: |-
      最后，还有一些段落——尤见于《人类理智新论》（1704）——莱布尼茨相当直接或间接地把统觉归于野兽。例如他讨论过一头野猪：它起初对人只有赤裸知觉，直到那人向它喊叫；此时野猪统觉到这个人（“*s’apperçoit d’une personne*”），开始冲锋（第二卷第 21 章第 5 节；A vi VI 173）。
