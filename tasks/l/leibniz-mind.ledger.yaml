      Perception has already been discussed briefly above. But it will be advisable to consider also a definition from a letter to Des Bosses (and echoed in many other passages) in which Leibniz discusses perception as the representation or “expression” of “the many in the one” (letter to Des Bosses, 11 July 1706; G II, 311). We shall return to this definition below. Appetitions are explained as “tendencies from one perception to another” (*Principles of Nature and Grace,* sec.2 (1714); G VI, 598/A&G 207). Thus, we represent the world in our perceptions, and these representations are linked with an internal principle of activity and change (*Monadology*, sec.15 (1714); G VI, 609/A&G 215) which, in its expression in appetitions, urges us ever onward in the constantly changing flow of mental life. More technically explained, the principle of action, that is, the primitive force which is our essence, expresses itself in momentary derivative forces involving two aspects: on the one hand, there is a representative aspect (perception), by which the many without are expressed within the one, the simple substance; on the other, there is a dynamical aspect, a tendency or striving towards new perceptions, which inclines us to change our representative state, to move towards new perceptions. (For more details, see Carlin 2004 and Jorati 2017.)[^carlin-2004][^jorati-2017]
    step1: |-
      知觉已在上文简要讨论。但最好再考虑来自致德博斯信中的另一个定义（在其他许多段落中也有回响）：莱布尼茨把知觉讨论为“多在一中”的再现或“表现”（致德博斯信，1706 年 7 月 11 日；G II, 311）。下文将回到这个定义。欲求被解释为“从一个知觉到另一个知觉的倾向”（《自然与神恩的原则》第 2 节（1714）；G VI, 598/A&G 207）。因此，我们在知觉中再现世界，而这些再现与一个活动和变化的内在原则相联系（《单子论》第 15 节（1714）；G VI, 609/A&G 215）——该原则在欲求中的表现，推动我们在不断变化的心理生活之流中前行。更技术性地解释，行动的原则——即作为我们本质的原始力——在涉及时刻派生力中表现自身，后者包含两个方面：一方面，有一个再现性的方面（知觉），借此，外在的多在单一体即单纯实体之内得到表现；另一方面，有一个动态的方面，即朝向新知觉的倾向或奋力，它使我们倾向于改变再现状态，走向新的知觉。（更多细节，见 Carlin 2004 与 Jorati 2017。）[^carlin-2004][^jorati-2017]
