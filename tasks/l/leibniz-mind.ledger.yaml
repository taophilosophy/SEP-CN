      In short, and perhaps oversimplifying to a certain extent, we can say that in the Leibnizian realm of mind there are indeed only perceptions and appetitions, but in these there is a fundamental divide between the realm of consciousness and unconsciousness. In the former, there are apperceptions and desires, the perceptions and appetitions of which we are conscious. In the latter, there are perceptions and appetitions of which we are not conscious. That does not mean, however, that this latter realm is unimportant in our mental lives. As Leibniz says, “insensible perceptions are as important to [the science of minds, souls, and soul-like substances] as insensible corpuscles are to natural science, and it is just as unreasonable to reject the one as the other on the pretext that they are beyond the reach of our senses” (*New Essays*, Preface; RB 56). He would have said the same, no doubt, about inapperceptible appetitions.
    step1: |-
      简言之——或许在一定程度上过度简化——我们可以说：在莱布尼茨的心灵领域中确实只有知觉与欲求，但在它们之中，意识领域与无意识领域之间存在一条根本的分界。在前一领域中，有统觉与欲望，即我们意识到的知觉与欲求。在后一领域中，有我们意识不到的知觉与欲求。但这并不意味着后一领域在我们的心理生活中不重要。如莱布尼茨所说：“无法感觉的知觉之于[心灵、灵魂及类灵魂实体的科学]，正如无法感觉的微粒之于自然科学；以超出感官所及为借口而拒斥其中一个，同拒斥另一个一样不讲道理”（《新论》序言；RB 56）。毫无疑问，关于不可统觉的欲求，他也会说同样的话。
    step2: |-
      简言之——或许在一定程度上过度简化——我们可以说：在莱布尼茨的心灵领域中，确实只有知觉与欲求；而在它们之中，意识领域与无意识领域之间存在一条根本的分界。前一领域有统觉与欲望，即我们意识到的知觉与欲求；后一领域则藏有我们意识不到的知觉与欲求。但这并不意味着：后一领域在我们的心理生活中无足轻重。如莱布尼茨所说：“无法感觉的知觉之于[心灵、灵魂及类灵魂实体的科学]，正如无法感觉的微粒之于自然科学；以超出感官所及为借口而拒斥其一，同拒斥其二一样不讲道理”（《新论》序言；RB 56）。毫无疑问，关于不可统觉的欲求，他也会说同样的话。
