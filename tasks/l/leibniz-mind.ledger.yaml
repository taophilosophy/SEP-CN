      Some scholars have suggested that Leibniz should be regarded as one of the first thinkers to envision something like the idea of artificial intelligence (cf. Churchland 1984; Pratt 1987)[^churchland-1984][^pratt-1987]. Whether or not he should be regarded as such, it is clear that Leibniz, like contemporary cognitive scientists, saw an intimate connection between the form and content of language, and the operations of the mind. Indeed, according to his own testimony in the *New Essays*, he “really believe[s] that languages are the best mirror of the human mind, and that a precise analysis of the signification of words would tell us more than anything else about the operations of the understanding” (bk.III, ch.7, sec.6 (RB, 333)). This view of Leibniz’s led him to formulate a plan for a “universal language,” an artificial language composed of symbols, which would stand for concepts or ideas, and logical rules for their valid manipulation. He believed that such a language would perfectly mirror the processes of intelligible human reasoning. It is this plan that has led some to believe that Leibniz came close to anticipating artificial intelligence. At any rate, Leibniz’s writings about this project (which, it should be noted, he never got the chance to actualize) reveal significant insights into his understanding of the nature of human reasoning. This understanding, it turns out, is not that different from contemporary conceptions of the mind, as many of his discussions bear considerable relevance to discussions in the cognitive sciences.
    step1: |-
      一些学者提出，莱布尼茨应被视为最早构想出某种人工智能观念的思想家之一（参见 Churchland 1984; Pratt 1987）[^churchland-1984][^pratt-1987]。无论他是否应被如此看待，显然，莱布尼茨与当代认知科学家一样，看到了语言的形式与内容和心灵的运作之间的密切联系。确实，按照他在《人类理智新论》中的自述，他“真正相信语言是人类心灵最好的镜子，对词语意义的精确分析比任何东西都更能告诉我们理智的运作”（第三卷第 7 章第 6 节（RB, 333））。莱布尼茨的这一观点促使他制定了一个“普遍语言”的方案：一种由符号构成的人工语言，符号代表概念或观念，并附有对它们进行有效操作的逻辑规则。他相信这样一种语言会完美地映照人类可理智推理的过程。正是这个方案使一些人相信莱布尼茨几乎预见了人工智能。无论如何，莱布尼茨关于这一工程的著述（应当指出，他从未有机会将其付诸实现）揭示了他对人类推理本性的理解中的重要洞见。事实证明，这一理解与当代心灵概念相去不远，因为他的许多讨论与认知科学中的讨论有相当大的关联。
