      > 我相信，*凡是只有凭聚合而存在的存在者之处，甚至连实在的存在者也不会有*。因为每一个凭聚合而存在的存在者，都预设了被赋予真实统一性的存在者；它的实在性除来自其组成成分的实在性之外别无来源，以致如果每个组成成分仍是凭聚合而成的实体，它就根本没有任何实在性；否则，就必须再为它的实在性另寻基础——这样下去，如果必须不断寻找，就永远找不到……如果有实体的聚集体，就必定也有真实的实体，一切聚集体都由之产生。因此人们必定要么走到数学点——某些作者由之构造广延——要么走到伊壁鸠鲁与科尔迪莫伊先生的原子（您同我一样摈弃它们），要么必须承认物体中找不到任何实在性，要么最终必须承认物体中有某些拥有真实统一性的实体。（G II, 96/LA 120）
