      It should be noted, however, that Leibniz did think that there was a sense in which one could say that mental events influence bodily events and vice-versa. He wrote to Antoine Arnauld that although “one particular substance has no physical influence on another … nevertheless, one is quite right to say that my will is the cause of this movement of my arm …; for the one expresses distinctly what the other expresses more confusedly, and one must ascribe the action to the substance whose expression is more distinct” (28 November 1686 (draft); G II, 71/LA 87). In this passage, Leibniz sets forth what he takes the metaphysical reality of apparent inter-substantial causation to amount to. We begin with the thesis that every created substance perceives the entire universe, though only a portion of it is perceived distinctly, most of it being perceived unconsciously, and, hence, confusedly. Now consider two created substances, *x* and *y* (*x* not identical to *y*), where some state of *x* is said to be the cause of some state of *y*. Leibniz’s analysis is this: when the causal state of affairs occurred, the relevant perceptions of substance *x* became more distinct, while the relevant perceptions of substance *y* became more confused. Insofar as the relevant perceptions of *x* become increasingly distinct, it is “causally” active; insofar as the relevant perceptions of substance *y* become increasingly confused, it is passive. In general, causation is to be understood as an increase in distinctness on the part of the causally active substance and an increase in confusedness on the part of the passively affected substance. Again, each substance is programmed at creation to be active/passive at the relevant moment with no occurrence of real substantial interaction.
    step1: |-
      然而应当注意，莱布尼茨确实认为，在某种意义上可以说心理事件影响身体事件，反之亦然。他写给安托万·阿尔诺说：虽然“一个特定实体对另一个实体没有物理影响……但是，我们完全有理由说，我的意志是我手臂这一运动的原因……；因为一者分明地表现另一者较为混乱地表现的东西，必须把行动归于表现得更分明的那个实体”（1686 年 11 月 28 日（草稿）；G II, 71/LA 87）。在这一段落中，莱布尼茨阐明了：在他看来，看似实体间因果作用的东西在形而上学的实在中究竟是什么。我们从这样一个论题开始：每一个被造实体都知觉整个宇宙，尽管只有一部分被分明地知觉，大部分被无意识地、从而混乱地知觉。现在考虑两个被造实体 *x* 与 *y*（*x* 不等同于 *y*），其中 *x* 的某个状态据说是 *y* 的某个状态的原因。莱布尼茨的分析是：当因果事态发生时，实体 *x* 的相关知觉变得更分明，而实体 *y* 的相关知觉变得更混乱。就 *x* 的相关知觉变得越来越分明而言，它是“因果地”主动的；就实体 *y* 的相关知觉变得越来越混乱而言，它是被动的。一般地说，因果作用应理解为：因果地主动的实体一方分明星度的提高，被动受作用的实体一方混乱度的提高。同样，每个实体在创造时即被编程，在相关时刻作为主动者/被动者，其间没有任何真实的实体交互发生。
