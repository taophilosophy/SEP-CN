      Leibniz’s first reason for denying inter-substantial causation, that “one cannot explain how something can pass from one thing into the substance of another,” is a clear reference to the *influx theory* of causation. Leibniz found this theory inconsistent with his conception of substance. Influx theory could only explain causal relations between entities with parts, according to Leibniz. It is through these parts that “something can pass from one thing into … another.” But Leibnizian substances do not have parts in the requisite sense. (For more on influx theory, see O’Neil 1993.) Leibniz also gives a reason tied to his complete concept theory of substance, according to which “the nature of an individual substance or of a complete being is to have a notion so complete that it is sufficient to contain and to allow us to deduce from it all the predicates of the subject to which this notion is attributed” (*Discourse on Metaphysics*, sec. 8; (G IV, 433/A&G 41)). But there are, it seems, at least two problems with this explanation. First, Leibniz moves rather quickly from a conceptual explanation of substance in terms of the complete concept theory to the conclusion that this consideration is sufficient to explain the activity of concrete substances. Second, even if conceptual considerations about substances were sufficient to explain their apparent causal activity, it does not seem to follow that substances do not interact—unless one is assuming that causal overdetermination is not a genuine possibility. Leibniz seems to be assuming just that but without argument.
    step1: |-
      莱布尼茨否认实体间因果作用的第一条理由——“人们无法解释某物如何能从一物进入另一物的实体”——明确指向因果的*流入理论*。莱布尼茨认为这一理论与他的实体概念不一致。按照莱布尼茨，流入理论只能解释有部分的实体之间的因果关系。正是通过这些部分，“某物才能从一物进入……另一物”。但莱布尼茨式的实体在必需的意义上没有部分。（关于流入理论的更多内容，见 O’Neil 1993。）莱布尼茨还给出一个与他的实体完全概念理论相联系的理由。按照该理论，“一个个别实体或一个完全存在者的本性，在于拥有一个如此完全的概念，足以包含、并使我们能从中推出该概念所属主词的全部谓词”（《形而上学谈话》第 8 节；（G IV, 433/A&G 41））。但这一解释似乎至少有两个问题。第一，莱布尼茨相当快地从完全概念理论对实体的概念解释，跳到如下结论：这一考量足以解释具体实体的活动。第二，即便关于实体的概念考量足以解释它们看似的因果活动，似乎也得不出实体不交互——除非人们假定因果过度决定不是真正的可能性。莱布尼茨似乎正是这样假定，却未给出论证。
    step2: |-
      莱布尼茨否认实体间因果作用的第一条理由——“人们无法解释某物如何能从一物进入另一物的实体”——明确指向因果的*流入理论*（influx theory）。莱布尼茨认为该理论与他的实体概念不相容。照他看，流入理论只能解释有部分的实体之间的因果关系：正是经由这些部分，“某物才能从一物进入……另一物”。但莱布尼茨式的实体在必需的意义上没有部分。（流入理论详见 O’Neil 1993。）莱布尼茨还给出一条理由，系于其实体的完全概念理论。照该理论，“一个个别实体或一个完全存在者的本性，在于拥有一个如此完全的概念，足以包含、并使我们能从中推出该概念所属主词的全部谓词”（《形而上学谈话》第 8 节；（G IV, 433/A&G 41））。但这一解释似乎至少有两处疑难。第一，莱布尼茨相当轻率地从完全概念理论对实体的概念解释，跳到如下结论：这一考量足以解释具体实体的活动。第二，即便关于实体的概念考量足以解释它们看似的因果活动，似乎也推不出实体不交互——除非人们假定因果过度决定并非真正的可能性。莱布尼茨似乎正作如此假定，却未给出论证。
