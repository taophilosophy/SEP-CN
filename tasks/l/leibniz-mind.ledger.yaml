      A central philosophical issue of the seventeenth century concerned the apparent causal relations which hold between the mind and the body. In most seventeenth-century settings, this issue was discussed within the context of substance dualism, the view that mind and body are different kinds of substance. As noted above, Leibniz remained fundamentally opposed to dualism. But although Leibniz held that there is only one type of substance in the world, and thus that mind and body are ultimately composed of the same kind of substance (a version of monism), he also held that mind and body are metaphysically distinct. There are a variety of interpretations of what this metaphysical distinctness consists in for Leibniz, but on any plausible interpretation it is safe to assume (as Leibniz seems to have done) that for any person *P*, *P*’s mind is a distinct substance (a soul) from *P*’s body. With this assumption in hand, we may formulate the central issue in the form of a question: how is it that certain mental states and events are coordinated with certain bodily states and events, and vice-versa? There were various attempts to answer this question in Leibniz’s time period. For Descartes, the answer was mind-body interactionism: the mind can causally influence the body and (most commentators have held) vice-versa. For Malebranche, the answer was that neither created minds nor bodies can enter into causal relations because God is the only causally efficient being in the universe. God causes certain bodily states and events on the occasion of certain mental states and events, and vice-versa. Leibniz found Descartes’ answer unintelligible (cf. *Theodicy,* sec. 60; G VI, 135f.) and Malebranche’s excessive because miraculous (cf. Letter to Arnauld, 14 July 1686; G II, 57/LA 65).
    step1: |-
      十七世纪的一个核心哲学问题，涉及心灵与身体之间看似成立的因果关系。在十七世纪的大多数语境中，这个问题在实体二元论的框架内讨论——即认为心灵与身体是不同种类的实体。如上文所述，莱布尼茨从根本上反对二元论。但是，尽管莱布尼茨认为世界上只有一种类型的实体，从而心灵与身体最终由同一种实体构成（一种一元论），他也认为心灵与身体在形而上学上判然有别。对这种形而上学区别在莱布尼茨那里在于什么，有多种解释；但无论采取哪种可信的解释，都可以稳妥地假定（莱布尼茨似乎也是这样做的）：对任一主体 *P* 而言，*P* 的心灵是一个不同于 *P* 之身体的实体（一个灵魂）。有了这一假定，我们可以把核心问题表述为一个问题：某些心理状态与事件如何与某些身体状态与事件相互配合，反之亦然？在莱布尼茨的时代，对此问题有各种回答。对笛卡尔来说，答案是身心交互论：心灵能够因果地影响身体，（多数评注者认为）反之亦然。对马勒伯朗士来说，答案是：被造的心灵与身体都不能进入因果关系，因为上帝是宇宙中唯一有因果效力的存在者。上帝在某些心理状态与事件之际引起某些身体状态与事件，反之亦然。莱布尼茨认为笛卡尔的回答不可理解（参见《神义论》第 60 节；G VI, 135f.），而马勒伯朗士的回答因为诉诸奇迹而失之过度（参见致阿尔诺信，1686 年 7 月 14 日；G II, 57/LA 65）。
