      > One is obliged to admit that *perception* and what depends upon it is *inexplicable on mechanical principles*, that is, by figures and motions. In imagining that there is a machine whose construction would enable it to think, to sense, and to have perception, one could conceive it enlarged while retaining the same proportions, so that one could enter into it, just like into a windmill. Supposing this, one should, when visiting within it, find only parts pushing one another, and never anything by which to explain a perception. Thus it is in the simple substance, and not in the composite or in the machine, that one must look for perception. (G VI, 609/A&G 215)
    step1: |-
      > 人们不得不承认，*知觉*以及依赖于它的东西，是*无法用力学原则*——即用形状与运动——来解释的。设想有一台机器，其构造使它能思考、能感觉、能有知觉；可以设想把它按原比例放大，大到人可以走进去，就像走进一座磨坊。假定如此，人们在其中参观时只会发现一些部件相互推挤，而绝找不到任何可以用来解释知觉的东西。因此，必须在单纯实体中、而不是在复合物或机器中寻找知觉。（G VI, 609/A&G 215）
    step2: |-
      > 人们不得不承认：*知觉*以及依赖于知觉的东西，*无法用力学原则*——即用形状与运动——来解释。设想有一台机器，其构造使之能思考、能感觉、能有知觉；再设想把它按原比例放大，大到人可走入其中，如同走入一座磨坊。果真如此，人们在其中游览时只会见到部件相互推挤，绝见不到任何足以解释知觉的东西。故而，必须在单纯实体中寻找知觉，而不是在复合物或机器中。（G VI, 609/A&G 215）
  - id: 7
    kind: body
    source: |-
      Leibniz’s argument seems to be this: the visitor of the machine, upon entering it, would observe nothing but the properties of the parts and the relations they bear to one another. But no explanation of perception or consciousness can possibly be deduced from this conglomerate. No matter how complex the inner workings of this machine, nothing about them reveals that what is being observed are the inner workings of a conscious being. Hence, materialism must be false, for there is no possible way that the purely mechanical principles of materialism can account for the phenomena of consciousness. (For detailed discussion of this argument, see Lodge and Bobro 1998; Lodge 2014.)[^lodge-2014][^lodge-1998]
    step1: |-
      莱布尼茨的论证似乎是这样的：机器的参观者一旦走入其中，所观察到的只会是各部件的性质及其相互关系。但从这一堆东西中不可能推出对知觉或意识的任何解释。无论这台机器的内部运作多么复杂，其中没有任何东西表明：人们所观察到的，是一个有意识的存在者的内部运作。因此，唯物主义必定为假，因为唯物主义的纯力学原则绝无可能解释意识现象。（关于这一论证的详细讨论，见 Lodge and Bobro 1998; Lodge 2014。）[^lodge-2014][^lodge-1998]
    step2: |-
      莱布尼茨的论证似乎是这样：参观者一旦步入机器，所见无非各部件的性质及其相互关系；而从这一大堆东西中，绝无可能推出对知觉或意识的解释。无论这台机器的内部运作何等复杂，其中没有任何东西显示：人们观察到的，乃是一个有意识存在者的内部运作。故唯物主义必假——唯物主义的纯力学原则，绝无可能解释意识现象。（此论证的详细讨论，见 Lodge and Bobro 1998; Lodge 2014。）[^lodge-2014][^lodge-1998]
