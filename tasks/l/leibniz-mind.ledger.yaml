      Having raised the issue of unconscious perceptions, we should consider also the question of unconscious appetitions. This is infrequently discussed, but the question should not be overlooked. Since appetitions are tendencies or strivings, ones which profoundly influence human actions, it is relevant whether or not an individual human is conscious of all of these strivings. Certainly, some have taken the possibility of urges of which we are not conscious as highly important for the proper understanding of individual humans and, indeed, of the human condition generally.
    step1: |-
      提出了无意识知觉的问题，我们还应当考虑无意识欲求的问题。这个问题很少被讨论，但不应当被忽视。既然欲求是倾向或奋力——深刻影响人类行动的倾向或奋力——那么一个人是否意识到所有这些奋力，便是相关的。诚然，有些人把我们意识不到的冲动之可能性，看作正确理解个体人类——乃至一般人类处境——极其重要的东西。
