      Without trying to proceed further with this issue here, we can see that whichever of these views is ultimately adopted, it remains the case that Leibniz’s theory of perception involves something very distinctive in an age dominated by Descartes’ theory of ideas, the thesis that there are some perceptions of which we are not conscious, the much-discussed *petites* perceptions. Although Leibniz may not have been the first to propose such an idea (Aquinas, for example, might have had a similar view; see his *Summa Theologiae*, I-II, q.1, art.3), and although the view in his hands did not have the explosive quality that it did in the hands of Freud, the thesis remains an intriguing and important part of his philosophy of mind. Indeed, the Preface of the *New Essays concerning Human Understanding* contains as strong a statement as one is likely to find about the centrality of this view in a particular metaphysical system. Among other things, Leibniz makes it very clear that it is not just lower simple substances that have such unconscious perceptions but also human minds.
    step1: |-
      不打算在这里进一步追究这个问题，但我们可以看到，无论最终采纳哪种观点，有一点不变：在一个由笛卡尔观念论支配的时代，莱布尼茨的知觉理论包含某种非常独特的东西——这一论题：有些知觉是我们意识不到的，即广受讨论的*微*知觉。虽然莱布尼茨可能不是第一个提出这类观念的人（例如阿奎那就可能有类似观点；见其《神学大全》I-II, q.1, art.3），虽然这一观点在他手里没有像在弗洛伊德手里那样具有爆炸性，这一论题仍然是他心灵哲学中引人入胜而重要的部分。确实，《人类理智新论》的序言 contains 关于这一观点在特定形而上学体系中居于中心地位的、人们所能找到的最有力表述之一。其中，莱布尼茨非常明确地表示：拥有这类无意识知觉的，不只是较低级的单纯实体，还有人类心灵。
