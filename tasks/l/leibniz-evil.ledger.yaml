      Most of these foundations did not appear in the *Theodicy*, which “was already a very cautious work, targeted to a broad public which Leibniz did not want to upset with his potentially most controversial philosophical views (Antognazza 2009, 482)[^antognazza-2009].” He did, however, include a metaphysical account of evil. Moral and physical evils, like sin and suffering, are grounded in what he called “metaphysical evil” (H, 139 & 279; CD, 29–32). In the clearest definition, “metaphysical good and evil is perfection and imperfection in general,” whereas “physical good and evil [are] the conveniences and inconveniences of intelligent substances,” and “moral good and evil concerns their virtuous and vicious actions” (G, VI.32 cited in Antognazza 2014, 119)[^antognazza-2014]. As Antognazza (2014, 125–133) persuasively argues, metaphysical evil is the “original imperfection or limitation connatural to all creatures” (AG, 62) that Leibniz had already mentioned in the *Discourse on Metaphysics*, where he wrote that “the root of evil is in nothingness, that is to say, in the privation, or limitation of creatures, which God graciously remedies by the degree of perfection it pleases him to give” (AG, 62). No matter how excellent the best possible world may be, its inhabitants are inevitably less than God, and so originally imperfect. Once more revising the Augustinian privation theory of evil (see Section 2.1), Leibniz used finitude itself to explain why creatures are vulnerable to suffering (physical evil) and “liable to sin” (moral evil) (AG, 62; see also H, 139). Leibniz, then, advocated a unified account of this world’s goodness: metaphysical perfection is the source of moral goodness (AG, 152) and metaphysical evil is the condition for the possibility of moral evil. A world’s value depends on its metaphysical foundation, but also on its physical and moral aspects: “it will prove that [God] has attained the utmost good possible, provided one reckon the metaphysical, physical and moral goods together” (H, 282; see also Newlands 2014)[^newlands-2014].
    step1: |-
      这些基础大多没有出现在《神义论》中——该书“已经是一部非常审慎的著作，面向广大公众，莱布尼茨不愿以他潜在最具争议的哲学观点搅扰他们（Antognazza 2009, 482）[^antognazza-2009]”。不过他确实纳入了一个关于恶的形而上学说明。道德恶与物理恶——如罪与苦难——奠基于他所谓的“形而上学恶”（H, 139 & 279; CD, 29–32）。在最清晰的定义中，“形而上学的善与恶是一般的完善与不完善”，而“物理的善与恶[是]理智存在者的便利与不便”，“道德的善与恶关乎其德性的与恶劣的行动”（G, VI.32，引自 Antognazza 2014, 119）[^antognazza-2014]。如 Antognazza（2014, 125–133）有力论证的，形而上学恶是“一切受造物与生俱来的原初不完善或限定”（AG, 62）——莱布尼茨在《形而上学谈话》中已经提到它，在那里他写道：“恶的根子在于无，也就是说，在于受造物的缺乏或限定；上帝仁慈地以其乐意给予的完善程度来补救它”（AG, 62）。无论最好的可能世界多么卓越，其居民必然不及上帝，因而原初地不完善。莱布尼茨再次修正奥古斯丁的恶之缺乏理论（见第 2.1 节），用有限性本身解释受造物为何易受苦难（物理恶）并“易于犯罪”（道德恶）（AG, 62；另见 H, 139）。因此，莱布尼茨倡导对这个世界之善的统一说明：形而上学完善是道德善的来源（AG, 152），而形而上学恶是道德恶之可能的条件。一个世界的价值取决于其形而上学基础，但也取决于其物理与道德面向：“只要把形而上学的、物理的与道德的善合起来计算，就将证明[上帝]已达到可能的至善”（H, 282；另见 Newlands 2014）[^newlands-2014]。
