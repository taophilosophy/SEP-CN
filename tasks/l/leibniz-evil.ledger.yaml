      Leibniz could see the need to further distance God from evil, but before ending abruptly mid-sentence, the remainder of *On the Omnipotence* rejected two traditional ways of supplying this distance. The first is the Augustinian position that “sin is a nothing,” a mere “lack of the appropriate perfection,” such that God could be credited with creating everything and every perfection, including the sinful will and its effects, without thereby creating the sinfulness of either. Leibniz attacks this position with uncharacteristic sarcasm, on the ground that the position is absurd and, if true, would absolve sinner and God alike, leaving no one responsible for sin (CP, 23). It is absurd to claim credit for two bowings of the violin but not for the resulting dissonance, and were that allowed, no one could be held responsible. The second is the broad family of attempts to preserve divine foreknowledge while giving the human will complete causal control over its own determinations. Leibniz mentioned the Jesuit theologians, Luis de Molina (1535–1600) and Pedro da Fonseca (1528–1599), famous for the theory of middle knowledge on which God knows, prior to any act of creative will, how potentially existing creatures would freely behave in various circumstances. Even this subtle theory is lacking, Leibniz claimed, because counterfactual conditionals of creaturely freedom cannot be derived from God’s attributes and yet remain contingent (CP, 27; see also CP 130; Murray 1995; Sleigh 1994; and the entry on foreknowledge and free will)[^murray-1995][^sleigh-1994]. As the piece breaks off, the reader is left to conclude that sin cannot be reduced to nothing and cannot be neatly severed from God’s own being and activity—leaving only the unsatisfying juridical solution in place.
    step1: |-
      莱布尼茨能看出需要进一步使上帝远离恶；但在句子中途戛然而止之前，《论全能》的其余部分拒斥了供给这种距离的两种传统方式。其一是奥古斯丁主义立场：“罪是无”，只是“相应完善的缺乏”——如此上帝可以被归功于创造一切与每一种完善，包括罪恶的意志及其效果，而不因此创造二者的罪性。莱布尼茨以不合其寻常风格的讥讽攻击这一立场，理由是该立场荒谬，且若为真，将同时赦免罪人与上帝，使无人为罪负责（CP, 23）。为小提琴的两下运弓邀功却不为由此产生的不协和音负责，是荒谬的；若允许这样做，便无人能为任何事负责。其二是广泛的一族尝试：在保存神圣预知的同时，给予人的意志对其自身决定的完全因果控制。莱布尼茨提到耶稣会神学家路易斯·德·莫利纳（1535–1600）与佩德罗·达·丰塞卡（1528–1599），他们以中知识理论闻名——按该理论，上帝在任何创造意志的行动之前就知道潜在存在的受造物在各种处境中会如何自由行动。莱布尼茨声称，连这一精巧理论也有欠缺：受造自由的反事实条件句无法从上帝的属性推出，却又保持偶然（CP, 27；另见 CP 130; Murray 1995; Sleigh 1994；以及预知与自由意志词条）[^murray-1995][^sleigh-1994]。文章在此中断，读者只能得出结论：罪不能被还原为无，也不能被利落地从上帝的存在与活动中剥离——只剩那个不能令人满意的司法式解法留在原地。
