      Leibniz answered by dividing God’s concurrence with creaturely action into two types, physical and moral (see Schmaltz 2014, 148–150; Rateau 2019, 241–5)[^rateau-2019][^schmaltz-2014]. Physical concurrence is God’s active, unmediated, and specific contribution to every creaturely action. This type of concurrence *is sufficient to produce every effect, including sins* and yet *only extends to the good or perfect*. Physical concurrence has both features because God’s consequent will is sufficient to produce every effect and yet derives its entire force and intentionality from the antecedent wills, which respond directly and exclusively to the good (CD, 26–27). In a sense, God can be fully involved with the best possible world, evils and all, by decisively carrying through every desire for the good that composes God’s consequent will. As Leibniz wrote, “[…] when it is said that the creature depends upon God in so far as it exists and in so far as it acts, and even that conservation is a continual creation, this is true in that God gives ever to the creature and produces continually all that in it is positive, good and perfect, every perfect gift coming from the Father of lights” (H, 145; see also CD, 9; Rateau 2019, 242)[^rateau-2019]. God physically concurs with every action “in so far as these actions have some degree of perfection”—but there is no reality to an action apart from its perfection.
    step1: |-
      莱布尼茨的回答是把上帝与受造行动的协作分为两类：物理的与道德的（见 Schmaltz 2014, 148–150; Rateau 2019, 241–5）[^rateau-2019][^schmaltz-2014]。物理协作是上帝对每个受造行动的主动的、无中介的、特定的贡献。这一类协作*足以产生每一个效果，包括罪*，却*只延伸到善的或完善的*。物理协作兼具这两个特征，因为上帝的后行意志足以产生每一个效果，而其全部力量与意向性都来自先行意志——后者直接且 exclusively 回应善（CD, 26–27）。在某种意义上，上帝可以完全卷入最好的可能世界——连同其恶——方式是决定性地贯彻构成其后行意志的每一个对善的渴望。如莱布尼茨所写：“[……]当有人说受造物就其存在与行动而言依赖上帝，甚至说保存是持续的创造时，这是真的：上帝不断地给予受造物并持续产生其中一切肯定的、善的、完善的东西，每一完善的礼物都来自光明之父”（H, 145；另见 CD, 9; Rateau 2019, 242）[^rateau-2019]。上帝与每一个行动物理地协作，“就这些行动具有某种完善度而言”——但一个行动离开其完善便没有任何实在性。
