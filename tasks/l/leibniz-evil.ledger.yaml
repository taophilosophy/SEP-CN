      These asymmetries constitute a metaphysical answer to the original problem but not yet a pastoral answer, and a pastoral answer was needed because Leibniz believed that the theodicean project had personal and political import. Individuals and whole societies could be distressed by moral evils, and by the apparently unjust distribution of physical evils (H, 100; see Rateau 2019, 1–3)[^rateau-2019]. Inadequate or false responses to evil encourage further evils (H, 55–62) and give rise to warring sects (CP, 6–7). As Leibniz wrote, these are “hard knots, which no sword of Alexander can loosen” and “the stumbling block for the happiness of so many; this is the point of doubt that has brought so many either to despair or wickedness, which until now has never been resolved, as so many poor souls needed it to be” (CP, 21).
    step1: |-
      这些不对称构成对原初问题的形而上学回答，但还不是牧灵的回答；而牧灵的回答是需要的，因为莱布尼茨相信神义论事业有个人的与政治的分量。个体与整个社会可能因道德恶、以及物理恶之显然不公正的分配而苦恼（H, 100；见 Rateau 2019, 1–3）[^rateau-2019]。对恶的不充分或错误的回应鼓励进一步的恶（H, 55–62），并滋生交战的宗派（CP, 6–7）。如莱布尼茨所写，这些是“坚硬的死结，亚历山大的剑也解不开”，是“这么多人幸福的绊脚石；这是怀疑之点，它把这么多人要么带入绝望要么带入邪恶，而至今从未像这么多可怜灵魂需要的那样得到解决”（CP, 21）。
