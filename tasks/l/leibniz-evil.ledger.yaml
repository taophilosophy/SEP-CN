      To address this, Leibniz introduced the concept of a *deficient* cause (see Schmalz 2014, 149–152; Jorati 2017, 98–108; Rateau 2019, 117–9 & 265–270)[^jorati-2017][^rateau-2019]. As he explained, “the formal character of evil has no *efficient* cause, for it consists in privation […], in that which the efficient cause does not bring about. That is why the Schoolmen are wont to call the cause of evil *deficient*” (H, 139). To illustrate this concept, Leibniz offered examples of deficient causes: the river carries a heavy barge more slowly (H, 386) and “water in freezing is capable of breaking a gun-barrel wherein it is confined; and yet cold is a certain privation of force” (H, 222–3). As Leibniz understood the second example, the withdrawal of heat allows another force to act more powerfully than it would have otherwise. It is “by accident” that this privation has a positive effect. Similarly, ignorance, error, malice, and ill will “consist formally in a certain kind of privation” and have their effects accidentally. For instance, ignorance might allow inadequate evidence to carry disproportionate weight, and malice might allow a baser passion to dominate (H, 145). These deficient causes of sin are privations in human moral agency and so depend on the “previous limitations that are originally in the creature” (H, 356), which Leibniz had identified as metaphysical evil (see Section 3.1). Human moral agents are responsible or culpable for a lack because they become its deficient cause.
    step1: |-
      为处理这一点，莱布尼茨引入了*缺失*因的概念（见 Schmalz 2014, 149–152; Jorati 2017, 98–108; Rateau 2019, 117–9 & 265–270）[^jorati-2017][^rateau-2019]。如他解释的，“恶的形式特征没有*动力*因，因为它在于缺乏[……]，在于动力因不带来的东西。这就是为什么经院学者习惯称恶的原因为*缺失的*”（H, 139）。为例示这一概念，莱布尼茨举出缺失因的例子：河流载重驳船行驶更慢（H, 386）；“冻结中的水能够撑破禁锢它的枪管；然而冷是力量的某种缺乏”（H, 222–3）。照莱布尼茨对第二个例子的理解，热的退场允许另一种力量比原本更强大起作用。这一缺乏“偶然地”有一个肯定的效果。类似地，无知、错误、恶意与恶的意志“形式上在于某种缺乏”，其效果也是偶然的。例如，无知可能让不充分的证据承载不相称的分量，恶意可能让较低级的激情占上风（H, 145）。罪的这些缺失因是人类道德能动性中的缺失，因而依赖“原初就在受造物之中的先前限定”（H, 356）——莱布尼茨已把它认定为形而上学恶（见第 3.1 节）。人的道德行动者为一个缺乏负责或有罪责，因为他们成为它的缺失因。
