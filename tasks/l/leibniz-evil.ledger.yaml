      《神义论》本身分为三个主要部分，前有长篇的“论信仰与理性之符合的绪论”，后有若干附录。第一部分总体处理恶的问题，铺陈莱布尼茨的基本原则与论证。第二与第三部分在与皮埃尔·培尔的持续对话中重访这些主题（Lodge 2020, 174 & 183）[^lodge-2020]。附录题为“争议之摘要，化归为形式论证”、“对霍布斯先生以英文出版的论自由、必然与偶然之作的反思”，以及“对近期伦敦出版的论恶之起源一书的观察”。最后，一份浓缩的拉丁文主论证摘要——题为“上帝的正义与其其他完善及全部行动相调和之辩护”，今通常称《上帝之事由》（*Causa Dei*）——增入第二版（Lodge 2020, 174–5）[^lodge-2020]。E. M. Huggard 于 1952 年据十九世纪末的 Gerhardt 版本出版了法文原著的英文译本。这是《神义论》唯一完整的英文译本。它留下一些未译的拉丁引文，缺少学术装置，并省略了哲学内容丰富的《上帝之事由》——后者可见于《单子论与其他哲学论文》（S）。
