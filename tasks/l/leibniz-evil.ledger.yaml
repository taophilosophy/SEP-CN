      Leibniz dismissed the second question by appeal to a final judgement that permanently relieves the pious and damns the wicked. Unfortunately, the appeal to damnation only makes the first question—the author of sin problem—more difficult to answer. If God is ultimately responsible for creation, the damned are in a sense predestined, and this seems to be an especially great miscarriage of justice if, as Sleigh writes, “the ultimate grounds for creaturely behavior that allegedly merits reward or punishment are beyond the control of the person so rewarded or punished and, in fact, reside in the one who rewards or punishes” (CP, 145). Rateau agrees: “predestination is the heart of the problem. It is the central question to which all the others—human freedom, divine providence, moral and physical concurrence with evil, divine justice—are connected” (Rateau 2019, 37)[^rateau-2019].
    step1: |-
      莱布尼茨借最终审判打发第二个问题：审判将永久地解救虔敬者、惩罚邪恶者。遗憾的是，诉诸惩罚只会使第一个问题——罪之作者问题——更难回答。如果上帝最终为创造负责，那么被惩罚者在某种意义上是被预定的；而照 Sleigh 的说法，“据称值得奖惩的受造行为的终极根据，超出受奖惩者的控制，实际上居于奖惩者之中”（CP, 145），这似乎是一次特别重大的司法不公。Rateau 同意：“预定是问题的心脏。它是中心问题，其余一切——人的自由、神圣天意、对恶的道德与物理参与、神圣正义——都联结于它”（Rateau 2019, 37）[^rateau-2019]。
