      We can make sense of this solution by returning to the original problem, as outlined in Section 1. Creation, including sin and punishment, continue to express God’s goodness if sin and punishment are not blemishes in God’s work, but instead mutually complementary parts of a larger harmony. Arguments for the existence of God that begin with creation would still lead to the existence of a perfectly good God. Moreover, God is relieved of direct moral responsibility for sin if God never wills that sin occur, and God need never will that sin occur if the universal harmony follows from the mere existence of God. The will’s activity is situated posterior to the divine intellect that grounds the existence of finite things (Rateau 2019, 65–67; Feeney 2020, 11)[^feeney-2020][^rateau-2019], and so the will may respond selectively, delighted by the universal harmony and its harmonious parts, but not by the dissonant parts taken separately: “to will in favor of something is to be delighted by its existence” (CP 55). That is, God grounds everything just by knowing the universal harmony, but authors nothing, because “*[t]o be the author* is by one’s will to be the ground of something else” (CP, 55).
    step1: |-
      通过回到第 1 节概述的原初问题，我们可以理解这一解法。如果罪与惩罚不是上帝作品中的瑕疵，而是更大和谐中彼此互补的部分，那么创造——包括罪与惩罚——就继续表现上帝的善。以创造为起点的上帝存在论证，仍将导向一个全善上帝的存在。此外，如果上帝从不愿意罪发生，上帝便解除对罪的直接道德责任；而如果普遍和谐仅仅从上帝的存在而来，上帝就绝不需要愿意罪发生。意志的活动位于奠立有限事物之存在的神圣理智之后（Rateau 2019, 65–67; Feeney 2020, 11）[^feeney-2020][^rateau-2019]，因此意志可以有选择地回应：为普遍和谐及其和谐的部分而喜悦，却不为单独来看的不协和部分而喜悦：“赞成某物而愿意，就是为它的存在而喜悦”（CP 55）。也就是说，上帝仅仅通过认识普遍和谐就莫基一切，却不作者任何东西，因为“*成为作者*，就是凭自己的意志成为他物的根据”（CP, 55）。
