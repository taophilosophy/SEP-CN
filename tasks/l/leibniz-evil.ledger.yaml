      Many writings from 1680s and 1690s laid further philosophical groundwork for Leibniz’s mature theodicy. The *Discourse on Metaphysics* (1686) provided a detailed exposition of the complete concept doctrine of substance (AG, 40–42), and a series of works from 1689 introduced infinite analysis to explain contingency within the framework of complete concepts (A, VI.iv.1649–1664; AG, 28 & 96–97). These developments allowed Leibniz to maintain that God eternally grasps the complete concept of each possible individual substance *and* that finite deduction cannot demonstrate all the predicates in a given complete concept. Some features of finite substances are contingent, because there would be no (provable) logical contradiction in holding that a particular substance could have been different (see McDonough & Soysal, 2018). This supplemented the distinction between *per se* and hypothetical necessity. The world and all its parts are at most hypothetically necessary *and* any particular substance could have developed differently without contradiction (for orientation on Leibniz’s modal theories, see the entry on Leibniz’s modal metaphysics). These two levels or sources of contingency were crucial for escaping the necessitarianism of Leibniz’s earlier efforts, and they provided metaphysical context for Leibniz’s mature account of moral agency (Jorati 2017)[^jorati-2017]. They also supported Leibniz’s claim that God foreknows and even foreordains creaturely actions without thereby *necessitating* them (H, 150).
    step1: |-
      十七世纪八十与九十年代的许多著述，为莱布尼茨的成熟神义论奠定了进一步的哲学基础。《形而上学谈话》（1686）详尽阐述了实体的完全概念学说（AG, 40–42）；1689 年的一系列著作引入无穷分析，在完全概念的框架内解释偶然性（A, VI.iv.1649–1664; AG, 28 & 96–97）。这些进展使莱布尼茨能够主张：上帝永恒地把握每个可能个体实体的完全概念，*而且*有限演绎不能证明一个给定完全概念中的全部谓词。有限实体的某些特征是偶然的，因为主张一个特定实体本可以不同，并不含有（可证明的）逻辑矛盾（见 McDonough & Soysal, 2018）。这补充了*自身*必然与假设必然的区分。世界及其一切部分至多是假设必然的，*而且*任何特定实体本可以不同地发展而无矛盾（关于莱布尼茨模态理论的导读，见莱布尼茨的模态形而上学词条）。这两个层级或来源的偶然性，对逃脱莱布尼茨早期努力的必然主义至关紧要，并为莱布尼茨成熟的道德能动性说明提供了形而上学语境（Jorati 2017）[^jorati-2017]。它们也支持莱布尼茨的主张：上帝预知甚至预定受造行动，而不因此*必然化*它们（H, 150）。
