      For Leibniz, this was a first-order philosophical and theological problem, but also a source of enormous political and psychological strife. Previous efforts to address the problem, from the patristic period through the Reformation, confused the intellectual issues, “awakened so many sects,” and made God into a “pretense” for political cruelty and private moral laziness (CP, 6–7). Solving this problem in a manner “sufficient to explain the issue that nevertheless cannot be contradicted by anybody” would restore God’s honor and also eliminate a great source of human suffering (CP, 9). Leibniz aimed to provide just such a popular solution, which goes some way toward explaining why *On the Omnipotence* was written in an informal German, the *Confessio philosophi* was written as an engaging dialogue, and the *Theodicy* was seen through to publication (Antognazza 2009, 480–482)[^antognazza-2009].
    step1: |-
      对莱布尼茨来说，这是一流的哲学与神学问题，也是巨大的政治与心理纷争之源。从教父时期到宗教改革，先前处理这一问题的努力搞混了思想议题，“唤醒了如此多的宗派”，并使上帝成为政治残忍与私人道德懈怠的“借口”（CP, 6–7）。以一种“足以解释这一议题而又不能被任何人反驳”的方式解决这一问题，将恢复上帝的荣誉，也消除人类苦难的一大来源（CP, 9）。莱布尼茨的志向正是提供这样一种通俗的解答；这在某种程度上解释了为何《论全能》以非正式的德文写成、《哲人自白》以引人入胜的对话写成，而《神义论》则被推动出版（Antognazza 2009, 480–482）[^antognazza-2009]。
