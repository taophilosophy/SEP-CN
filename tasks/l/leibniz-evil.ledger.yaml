      The direct impetus for writing the Theodicy came from conversations at the Prussian court with Sophie Charlotte and others concerning Bayle’s *Dictionnaire historique et critique* (2ⁿᵈ edition, 1702). Leibniz, eager to defend religious truth and the conformity of faith with reason, saw an opportunity to refute Bayle’s objections and to clarify his own views on God’s justice in a world marked by evil. These courtly exchanges, later “stitched together” and expanded at the urging of friends, formed the basis for the published *Theodicy* (Antognazza 2009, 382 & 421)[^antognazza-2009]. The book was finally published by Isaac Troyel of Amsterdam in 1710 under the title *Essais de Théodicée sur la bonté de Dieu, la liberté de l’homme et l’origine du mal*. Written in French, the work sought a wider audience than a Latin text would have, and it was the most substantial philosophical work that Leibniz published during his lifetime. Nevertheless, Leibniz chose to publish anonymously, claiming authorship only in the second edition in 1712 (Lodge 2020, 173)[^lodge-2020]. The term “theodicy” was Leibniz’s own coinage, derived from the Greek words *theos* (God) and *dike* (justice), and intended to signify “the doctrine of the right and justice of God” (G, II.428; cited at Lodge 2020, 173)[^lodge-2020]. He had first used the term in its French and Latin forms in the mid-1690s, in letters and fragments that attest to his ongoing desire to establish and communicate clear metaphysical foundations for the reunification of Christian churches (Antognazza 2009, 480–1)[^antognazza-2009].
    step1: |-
      写作《神义论》的直接推动力，来自普鲁士宫廷中与索菲·夏洛特等人关于培尔《历史与批判词典》（第二版，1702）的谈话。莱布尼茨急于捍卫宗教真理与信仰同理性的符合，看到机会驳斥培尔的反驳，并澄清自己对一个以恶为标记之世界中上帝正义的看法。这些宫廷交流后来经朋友敦促“缝合”并扩充，成为已刊《神义论》的基础（Antognazza 2009, 382 & 421）[^antognazza-2009]。该书最终由阿姆斯特丹的 Isaac Troyel 于 1710 年出版，题为《论上帝之善、人之自由与恶之起源的神义论文集》。以法文写成，此书寻求比拉丁文本更广的读者群；它是莱布尼茨生前出版的最宏富的哲学著作。尽管如此，莱布尼茨选择匿名出版，直到 1712 年第二版才声明作者身份（Lodge 2020, 173）[^lodge-2020]。“神义论”一词是莱布尼茨自己的铸词，源自希腊词 *theos*（上帝）与 *dike*（正义），意在表示“上帝之正当与正义的学说”（G, II.428；引自 Lodge 2020, 173）[^lodge-2020]。他最早在十七世纪九十年代中期以其法文与拉丁文形式使用这个词，见于一些书信与残篇——它们见证了他持续的愿望：为基督教诸教会的重新联合确立并传达清晰的形而上学基础（Antognazza 2009, 480–1）[^antognazza-2009]。
