    kind: body
    source: |-
      Leibniz consistently maintained that God is worthy of love and praise, and that God’s worthiness may be discerned by studying creation. As he put it, “the excellence of God’s works can be recognized by considering them in themselves” and “by considering his works we can discover the creator” (AG, 36). This reasoning served a dual purpose: it provided an argument for the existence of God and challenged theological voluntarism (H, 130), the view that good and evil are determined by arbitrary divine decrees. Theological voluntarism implied that anything God had willed would have been “good” by fiat, and hence that created things in themselves provide no reason to praise and love their creator (Nadler 2011, 176)[^nadler-2011]. Leibniz countered that “even God discovers that some things are good, or better than others […] for God is endowed with will [and] the will is under the rule of the good” (SLT, 193). By “discovers,” Leibniz meant that the nature of goodness precedes God’s will and is grounded in “the ideas exhibiting the essences of things, which are found in [God]” (SLT, 194), analogous to how the geometrical features of circles are “discovered” in God’s ideas, not arbitrarily decreed. These ideas are necessary and eternal products of God’s own self-understanding (Nachtomy 2007, Chs. 1–2)[^nachtomy-2007]. God freely manifests God’s inherent goodness by creating a world. Within this creation, some beings (minds) possess “reason to examine good and evil, and to choose between them” (SLT, 92), enabling them to recognize the goodness in creation and respond with love and praise for God. The good exists originally in God, is expressed through God’s free act of creation, and finally is recognized and admired by human intellect and will (H, 240).
    step1: |-
      莱布尼茨一贯主张：上帝配受爱与赞美，而上帝的配得可以通过研究创造来辨识。如他所说，“上帝作品的卓越可以通过就其自身来考察而认出”，而且“通过考察他的作品，我们可以发现创造者”（AG, 36）。这一推理有双重用途：它为上帝存在提供论证，并挑战神学唯意志论（H, 130）——即善与恶由任意神圣法令决定的观点。神学唯意志论蕴涵：凡上帝所愿意的都会因敕令而是“善”的，从而受造物自身不提供赞美与爱其创造者的理由（Nadler 2011, 176）[^nadler-2011]。莱布尼茨反驳说：“连上帝也发现有些东西是善的，或比另一些更好……因为上帝被赋予意志，而意志处于善的规则之下”（SLT, 193）。所谓“发现”，莱布尼茨意指：善的本性先于上帝的意志，并奠基于“展现事物本质的观念，它们见于[上帝]之中”（SLT, 194）——类似于圆的几何特征是在上帝的观念中被“发现”的，而非任意法令所定。这些观念是上帝自身自我理解的必然而永恒的产物（Nachtomy 2007, Chs. 1–2）[^nachtomy-2007]。上帝通过创造一个世界而自由地表现其固有的善。在这一创造之中，一些存在者（心灵）具有“考察善与恶并在二者之间进行选择的理性”（SLT, 92），使它们能够认出创造中的善，并以对上帝的爱与赞美作回应。善原初存在于上帝之中，经由上帝自由的创造行动得到表现，最终为人类理智与意志所认出与赞叹（H, 240）。
    step2: |-
      莱布尼茨一贯主张：上帝配受爱与赞美，而其配得可借研究创造来辨识。如他所说，“上帝作品的卓越，可以就其自身考察而认出”，且“通过考察他的作品，我们可以发现创造者”（AG, 36）。这一推理有双重用途：既为上帝存在提供论证，又挑战神学唯意志论（H, 130）——即善与恶由任意神圣法令决定的观点。神学唯意志论蕴涵：凡上帝所愿者皆因敕令而是“善”，从而受造物自身不提供赞美与爱其创造者的理由（Nadler 2011, 176）[^nadler-2011]。莱布尼茨反驳：“连上帝也发现有些东西是善的，或比另一些更好……因为上帝被赋予意志，而意志处于善的规则之下”（SLT, 193）。所谓“发现”，莱布尼茨意指：善的本性先于上帝的意志，奠基于“展现事物本质的观念，它们见于[上帝]之中”（SLT, 194）——正如圆的几何特征是在上帝的观念中被“发现”，而非任意法令所定。这些观念是上帝自我理解的必然而永恒的产物（Nachtomy 2007, Chs. 1–2）[^nachtomy-2007]。上帝通过创造一个世界而自由地表现其固有的善。在这一创造之中，一些存在者（心灵）具有“考察善与恶并在二者之间选择的理性”（SLT, 92），使它们能认出创造中的善，并以对上帝的爱与赞美作回应。善原初存在于上帝之中，经上帝自由的创造行动得到表现，最终为人类理智与意志所认出与赞叹（H, 240）。
  - id: 6
    kind: body
    source: |-
      As Leibniz acknowledged, the prevalence of suffering, imperfection, and injustice in the world poses a significant challenge to his view that creation is an expression of God’s goodness (H, 100; Rateau 2019, 1–5)[^rateau-2019]. How could the providential sponsor of every creaturely action (Section 3.2.2) deserve love and praise if creatures sin? If “the excellence of God’s works” allows us to “discover the creator” (AG, 36), does the evil in God’s works allow us to discover faults in the creator? Under pressure from everyday interlocutors, from the works of Pierre Bayle under discussion at court in Hannover (Antognazza 2009, 382 & 480)[^antognazza-2009], and from his own critical reflection, Leibniz saw the need to defend God from two charges. The first charge was that God, as creator and preserver, bears direct moral responsibility for evil. This has been called the *author of sin* problem, following Leibniz’s own terminology (CP, xxi), but has also been called the “physical problem of evil” (McDonough 2007, 33–34)[^mcdonough-2007] and the “holiness problem” (Murray and Greenberg, 2016). The second charge was that God should have done better, even if God is not directly responsible for sin and evil. This charge takes as a starting point the common intuition, which Leibniz shared, that the world could have been different, and specifically that it could have contained less evil (H, 380). Whereas the modern problem of evil focuses on the existence of an omnipotent, omniscient, and perfectly benevolent God (see the entry on the problem of evil), Leibniz’s effort in the *Theodicy* was a defense of God’s worthiness: if God truly deserves praise and love for creation, God must be somehow excused for the degree and the fact of evil in creation (Horn 2024, 8–10)[^horn-2024].
    step1: |-
      如莱布尼茨所承认的，世界上苦难、不完善与不义的盛行，对其“创造是上帝之善的表现”的观点构成重大挑战（H, 100; Rateau 2019, 1–5）[^rateau-2019]。如果受造物犯罪，每一个受造行动的天意赞助者（第 3.2.2 节）怎能配受爱与赞美？如果“上帝作品的卓越”使我们能“发现创造者”（AG, 36），上帝作品中的恶是否使我们发现创造者的过失？在日常对话者的压力下，在汉诺威宫廷中讨论的皮埃尔·培尔的著作的压力下（Antognazza 2009, 382 & 480）[^antognazza-2009]，以及在其自身批判性反思的压力下，莱布尼茨看到需要为上帝抵御两项指控。第一项指控是：上帝作为创造者与保存者，对恶负有直接的道德责任。循莱布尼茨自己的术语，这被称为*罪之作者*问题（CP, xxi），但也被称为“恶的物理问题”（McDonough 2007, 33–34）[^mcdonough-2007]与“圣洁问题”（Murray and Greenberg, 2016）。第二项指控是：即使上帝不对罪与恶负直接责任，上帝本可以做得更好。这项指控以一个共同直觉为起点——莱布尼茨也分享这一直觉——即世界本可以是不同的，特别是本可以包含更少的恶（H, 380）。现代恶的问题聚焦于全能、全知而全善的上帝之存在（参见恶的问题词条），而莱布尼茨在《神义论》中的努力是为上帝的配得辩护：如果上帝真的因创造而配受赞美与爱，上帝就必须以某种方式为其创造中恶的程度与事实开脱（Horn 2024, 8–10）[^horn-2024]。
    step2: |-
      如莱布尼茨所承认的，世上苦难、不完善与不义的盛行，对其“创造是上帝之善的表现”的观点构成重大挑战（H, 100; Rateau 2019, 1–5）[^rateau-2019]。若受造物犯罪，每一个受造行动的天意赞助者（第 3.2.2 节）怎能配受爱与赞美？如果“上帝作品的卓越”使我们能“发现创造者”（AG, 36），上帝作品中的恶是否使我们发现创造者的过失？在日常对话者的压力下，在汉诺威宫廷中讨论的皮埃尔·培尔著作的压力下（Antognazza 2009, 382 & 480）[^antognazza-2009]，以及在其自身批判性反思的压力下，莱布尼茨看到：须为上帝抵御两项指控。其一：上帝作为创造者与保存者，对恶负有直接的道德责任。循莱布尼茨自己的术语，这被称为*罪之作者*问题（CP, xxi），但也被称为“恶的物理问题”（McDonough 2007, 33–34）[^mcdonough-2007]与“圣洁问题”（Murray and Greenberg, 2016）。其二：即使上帝不对罪与恶负直接责任，上帝本可以做得更好。此项指控以一个共同直觉为起点——莱布尼茨也分享它——即世界本可以不同，特别是本可以包含更少的恶（H, 380）。现代恶的问题聚焦于全能、全知而全善的上帝之存在（参见恶的问题词条），而莱布尼茨在《神义论》中的努力，是为上帝的配得辩护：若上帝真因创造而配受赞美与爱，他就必须以某种方式为其创造中恶的程度与事实开脱（Horn 2024, 8–10）[^horn-2024]。
  - id: 7
    kind: body
    source: |-
      In a succinct early statement of the author of sin problem, Leibniz wrote: “He who knowingly permits sin, creates all the opportunities for sin, and brings it about that the agent can do it, indeed, provokes the will of the agent itself, and brings it about that he wants to do it—while he nevertheless could hinder the sin, indeed, could refrain from creating the opportunities and provoking the will—is to be considered the author of sin” (CP, 21). Leibniz returned to the problem in the *Theodicy*, where he promised to “show how it is possible for everything to depend upon God, for him to co-operate in all the actions of creatures, even, if you will, to create these creatures continually, and nevertheless not to be the author of sin” (H, 63). Leibniz considered various strategies that would distance God from evil. For example, he first rejected and then carefully reconsidered the traditional claim that evil is nothing in itself, so that God may create everything positive and real in a sinful action and even concur with a sinful agent without thereby creating evil (Section 2.1; see also McDonough 2007, 46)[^mcdonough-2007]. Another strategy, from the early theodicy, allowed a more robust ontology of evil and instead nearly eliminated the divine will’s role in creation, thereby undercutting God’s *moral* responsibility for evil. The mature theodicy attempted a synthesis: evil can only exist as a local imperfection in some encompassing good; God permits the local imperfections while positively willing the underlying and encompassing goods.
    step1: |-
      在对罪之作者问题的一段简洁的早期表述中，莱布尼茨写道：“明知而容许罪、为罪创造一切机会、使行动者能行罪、甚至激起行动者自身的意志、使他想要行罪——而他本可以阻止这罪，甚至本可以不创造那些机会、不激起那意志——这样的人应被视为罪之作者”（CP, 21）。莱布尼茨在《神义论》中重提这一问题，允诺要“表明：一切如何可能依赖上帝，他如何可能参与受造物的一切行动——如果你愿意，甚至持续地创造这些受造物——然而又不是罪之作者”（H, 63）。莱布尼茨考虑过使上帝远离恶的种种策略。例如，他先是拒斥、继而又仔细重审那个传统主张：恶自身是无——如此上帝可以创造一个罪恶行动中一切肯定与实在的东西，甚至与罪恶的行动者合作，而不因此创造恶（第 2.1 节；另见 McDonough 2007, 46）[^mcdonough-2007]。另一策略来自早期神义论：容许一个更强健的恶的本体论，反而几乎消除神圣意志在创造中的角色，从而削弱上帝对恶的*道德*责任。成熟的神义论尝试一种综合：恶只能作为某个涵括性的善之中的局部不完善而存在；上帝容许这些局部不完善，同时肯定地愿意那些基础性的、涵括性的善。
