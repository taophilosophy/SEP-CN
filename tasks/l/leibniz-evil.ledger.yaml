      The full title of the *Theodicy* is *Essays of Theodicy on the Goodness of God, the Freedom of Man, and the Origin of Evil* [*Essais de Théodicée sur la bonté de Dieu, la liberté de l’homme et l’origine du mal*]. Similarly, Leibniz’s early account of evil in the *Confessio philosophi* (1672–73?) begins by establishing an equivalence between “the happiness of the mind” and the “contemplation of God,” and only then raises questions about the origin of evil and the degree of human responsibility for evil within a world created and governed by God (CP, 31). Indeed, it is impossible to separate Leibniz’s treatment of evil from his broader understanding of divine goodness and human freedom. This section explains why Leibniz took evil to be a threat to the goodness of God. The following section explains how Leibniz’s earliest attempts to defeat that threat seem to undermine human freedom and moral responsibility.
    step1: |-
      《神义论》的全称是《论上帝之善、人之自由与恶之起源的神义论文集》[*Essais de Théodicée sur la bonté de Dieu, la liberté de l’homme et l’origine du mal*]。同样，莱布尼茨在《哲人自白》（1672–73?）中对恶的早期说明，首先确立“心灵的幸福”与“对上帝的沉思”之间的等价，然后才提出恶之起源、以及人在受上帝创造并治理的世界中对恶的责任程度等问题（CP, 31）。确实，不可能把莱布尼茨对恶的处理与其对神圣之善和人类自由的更宽泛理解分离开来。本节解释莱布尼茨为何把恶视为对上帝之善的威胁。下一节解释莱布尼茨击败这一威胁的最早尝试为何似乎削弱人的自由与道德责任。
    step2: |-
      《神义论》的全称是《论上帝之善、人之自由与恶之起源的神义论文集》[*Essais de Théodicée sur la bonté de Dieu, la liberté de l’homme et l’origine du mal*]。同样，莱布尼茨在《哲人自白》（1672–73?）中对恶的早期说明，首先确立“心灵的幸福”与“对上帝的沉思”之等价，然后才提出恶之起源、以及人在受上帝创造并治理的世界中对恶的责任程度等问题（CP, 31）。诚然，不可能把莱布尼茨对恶的处理，同其对神圣之善与人类自由的更宽泛理解分离开来。本节解释：莱布尼茨为何把恶视为对上帝之善的威胁。下一节解释：他击败这一威胁的最早尝试，为何似乎削弱人的自由与道德责任。
