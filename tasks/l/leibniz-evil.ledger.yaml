      This entry is not the place for Leibniz’s full account of moral agency. The secondary literature, especially Julia Jorati’s *Leibniz on Causation and Agency* (2017), contains thoughtful discussions of the underlying psychology and metaphysics. The core of the account is the claim that human beings have the capacity to direct themselves toward goods they perceive as good and in so doing forego other potential actions: “[t]he will is never prompted to action save by the representation of the good, which prevails over the opposite representations. […] For that very reason the choice is free and independent of necessity, because it is made between several possibles, and the will is determined only by the preponderating goodness of the object” (H, 151). Leibniz often presented this conception of agency in terms of three necessary and jointly sufficient conditions: spontaneity, intelligence, and contingency (H, 306; AG, 64)—or self-determination for a known end without logical or metaphysical necessitation. This counts as moral agency, because the end is known *as good* (CD, 98; Jorati 2017, 181 & 191–3; as Jorati notes, Leibniz employed the concept of moral agency but did not use the term)[^jorati-2017]. This model of human moral agency should be familiar, because we have seen it already in Leibniz’s description of moral necessity and God’s consequent will. Human beings are moral agents in the way God is a moral agent, though not to the same degree (H, 150; CD, 98; see also Jorati 2017, 116–7)[^jorati-2017].
    step1: |-
      本词条不是呈现莱布尼茨道德能动性完整说明的地方。二手文献——尤其是 Julia Jorati 的《莱布尼茨论因果与能动性》（2017）——包含对底层心理学与形而上学的深入讨论。该说明的核心主张是：人有能力把自己导向他们知觉为善的那些善，并由此放弃其他潜在的行动：“[意]志从不被推动去行动，除非通过善的表现——它胜过相反的表现。[……]正因为如此，选择是自由的、独立于必然性的：因为它是在几个可能者之间作出的，而意志只由对象的占优之善所决定”（H, 151）。莱布尼茨常以三个必要且联合充分的条件呈出这一能动性构想：自发性、理智、偶然性（H, 306; AG, 64）——即为了一个已知的目而自我决定，没有逻辑或形而上学的强制。这算作道德能动性，因为目的被认知*为善*（CD, 98; Jorati 2017, 181 & 191–3；如 Jorati 指出的，莱布尼茨使用了道德能动性的概念但没有用这个术语）[^jorati-2017]。这个人类道德能动性的模型应当是熟悉的，因为我们在莱布尼茨对道德必然性与上帝后行意志的描述中已经见过它。人是道德行动者，其方式如上帝是道德行动者，只是程度不同（H, 150; CD, 98；另见 Jorati 2017, 116–7）[^jorati-2017]。
