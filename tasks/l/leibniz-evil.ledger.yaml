      The *New System* (1695) publicly articulated Leibniz’s account of substance, mind-body interaction, and pre-established harmony as a test for the eventual release of his views on evil, fate and contingency (G, I.423; cited at Rateau 2019, 143)[^rateau-2019]. Drawing on his philosophy of science and his mathematical doctrine of optimal form, *On the Ultimate Origination of Things* (1697) provided a model of what it means for this world to be best (McDonough 2022, 142)[^mcdonough-2022]. This work also argued that the mathematical optimality of the world, on display in its physical principles, makes this world morally perfect as well, because “moral perfection is in reality physical perfection with respect to minds” (AG, 152–3). That is, the best world for an intelligent being is the most intelligible world. After acknowledging that experience often runs counter to this conclusion, Leibniz tested some *a posteriori* defenses of the “best world” thesis. These works, alongside exchanges with Arnauld, Bayle, Des Bosses and others, prepared the ground for Leibniz’s eventual account of evil, divine creation, and human freedom in the *Theodicy*.
    step1: |-
      《新体系》（1695）公开阐述了莱布尼茨关于实体、身心交互与前定和谐的说明，以此作为最终发布其关于恶、命运与偶然性的观点的试金石（G, I.423；引自 Rateau 2019, 143）[^rateau-2019]。《论事物的终极起源》（1697）借助其科学哲学与最优形式的数学学说，提供了一个模型：这个世界是最好的，意味着什么（McDonough 2022, 142）[^mcdonough-2022]。该著作还论证：世界在其物理原理中展示的数学最优性，也使这个世界在道德上完善，因为“道德完善实际上就是相对于心灵而言的物理完善”（AG, 152–3）。也就是说，对一个理智存在者而言最好的世界，就是最可理解的世界。在承认经验常常与这一结论相悖之后，莱布尼茨检验了“最好世界”论题的一些*后验*辩护。这些著作，连同与阿尔诺、培尔、德博斯等人的交流，为莱布尼茨最终在《神义论》中对恶、神圣创造与人的自由的说明准备了地基。
