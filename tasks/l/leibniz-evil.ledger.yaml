      The revisions to the *Confessio*, along with the notes connected with Nicolas Steno (both dated to 1677/8), already show important developments. Recall that in the original *Confessio*, the existence of sin seemed to follow directly from God’s own existence (CP, 45). In the revisions, however, Leibniz bolstered his rejection of necessitarianism by distinguishing between *per se* and hypothetical necessity. This distinction allowed him to argue that something could follow necessarily from God’s nature, yet not be necessary *per se* (in itself, or absolutely) (CP, xxiv–xxv & 55–7). For instance, in the revised conclusion of the dialogue, Leibniz stated that sins are “not necessary, even if they follow from something necessary—the existence of God or the harmony of things” (CP, 59). The existence of the world might be a necessary consequence of God’s nature (*hypothetical* necessity), but not a consequence of its own nature (*per se* necessity). Likewise, the specific features of the world, including the occurrence of sin, are not themselves absolutely or *per se* necessary. Crucially, limiting the created world to hypothetical necessity allowed him to consider other worlds as possible in themselves. Furthermore, in his replies to Steno’s comments, Leibniz defended a more active role for the divine will in creation. He wrote that “the series [i.e., the actual world] is not posited because God is posited, except for the fact that God, who is the most-wise being, wills nothing but the best. All possible series are in the idea of God, but only one under the aspect of the best” (CP, 47). This represented a significant departure from the earlier *Confessio*, where the divine will played a minimal role, limited to mere approval of a pre-existing harmony. By assigning a more active role to God’s will, Leibniz could maintain that other worlds were not only possible in themselves, but also within God’s power to create. This opened room for Leibniz to argue that God exercised agency *and* could not have done better, having *chosen* the best world.
