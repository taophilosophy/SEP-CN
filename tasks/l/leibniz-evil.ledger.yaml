      This has generated some controversy in the literature. Robert Sleigh, in his indispensable work on Leibniz’s early theodicy, sketches an interpretation of the early theodicy in the *Confessio philosophi* that commits Leibniz to a broadly Spinozistic necessitarianism (Sleigh 1996, 492; CP, xxxv; also Lærke 2007, 8 & 20–1; Lærke 2008, 380–381, 547–551 & 795–796)[^lærke-2007][^lærke-2008][^sleigh-1996]. Sleigh rejects this interpretation, however, because it does not fit with Leibniz’s later rejection of necessitarianism, and does not seem to fit with Leibniz’s efforts, already in the *Confessio*, to carve out a sense in which created things exist contingently (CP, 55–59). In contrast, Rateau (2019, 72) and Feeney (2020, 1–2) emphasize that Leibniz’s efforts to resist necessitarianism in the *Confessio* do nothing to strengthen the divine will or rescue human freedom, aims that emerge fully only later, after Leibniz’s decisive encounter with Spinoza in 1676 (see also Nachtomy 2008)[^nachtomy-2008]. It may be helpful to recall that Leibniz wrote the first version of the *Confessio* in his mid-20s, shortly after writing other, shorter works that experiment with strong replies to evil. Leibniz himself may have been drawn in multiple, irreconcilable directions.
    step1: |-
      这在文献中引起了一些争议。Robert Sleigh 在其关于莱布尼茨早期神义论的 indispensable 著作中，勾勒了对《哲人自白》中早期神义论的一种解读，该解读使莱布尼茨 commitment 于一种广义的斯宾诺莎式必然主义（Sleigh 1996, 492; CP, xxxv；另见 Lærke 2007, 8 & 20–1; Lærke 2008, 380–381, 547–551 & 795–796）[^lærke-2007][^lærke-2008][^sleigh-1996]。然而 Sleigh 拒斥这一解读，因为它不符合莱布尼茨后来对必然主义的拒斥，似乎也不符合莱布尼茨在《自白》中已然作出的努力： carve out 一个受造物偶然存在的意义（CP, 55–59）。相对地，Rateau（2019, 72）与 Feeney（2020, 1–2）强调：莱布尼茨在《自白》中抵抗必然主义的努力，对于加强神圣意志或拯救人的自由毫无作用——这些目标只是后来，在莱布尼茨 1676 年与斯宾诺莎的决定性相遇之后，才充分出现（另见 Nachtomy 2008）[^nachtomy-2008]。回想一下或许有帮助：莱布尼茨写《自白》第一版时才二十五六岁，此前刚写过其他试验强硬回答的较短作品。莱布尼茨本人可能曾被多个不可调和的方向牵引。
