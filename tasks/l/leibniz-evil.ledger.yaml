      As Leibniz acknowledged, moral concurrence is the “more perplexing” of the two types of concurrence (H, 142; see Schmaltz 2014, 136)[^schmaltz-2014], perhaps because an account of how God merely *permits* sin must come with an account of how creatures *commit* sin. Here, Leibniz faced two significant pressures. On the one hand, he needed an account of creaturely agency robust enough to make creatures morally responsible for their own actions, even though “the decisive act of will, which results from all inclining acts of will, always produces its full effect, provided the power is adequate to the will, which it certainly is in the case of God” (CD, 27). On the other hand, Leibniz needed to explain how any agent could be responsible for a lack or privation, having already based God’s mere *permission* for sin on the fact that sin is a lack within some encompassing positive reality that God creates. As described in Section 2.1, Leibniz had already worried that this would make it impossible for *any* agent to commit a sin, leaving no one responsible (CP, 23). Creaturely agency must hold its own within God’s overarching providential order but also assume responsibility for mere privations.
    step1: |-
      如莱布尼茨所承认的，道德协作是两类协作中“更令人困惑的”（H, 142；见 Schmaltz 2014, 136）[^schmaltz-2014]，也许因为关于上帝如何仅仅*容许*罪的说明，必须附带一个关于受造者如何*犯罪*的说明。在这里，莱布尼茨面临两方面的重大压力。一方面，他需要一个关于受造能动性的说明，足够强健以使受造者对自己的行动负道德责任——尽管“由一切倾向性意志行动产生的决定性意志行动，总是产生其全部效果，只要力量与意志相称；而在上帝那里这 certainly 成立”（CD, 27）。另一方面，莱布尼茨需要解释任何行动者怎能对一个缺乏或缺失负责——他已经把上帝对罪的单纯*容许*奠基于如下事实：罪是上帝所创造的某个涵括性肯定实在之中的缺乏。如第 2.1 节所述，莱布尼茨已经担心这会使*任何*行动者都不可能犯罪，从而无人负责（CP, 23）。受造能动性必须在上帝统摄的天意秩序中站稳脚跟，同时为单纯的缺失承担责任。
