      In the *Theodicy* and in earlier works, Leibniz developed these consolations into an ethics of temporal orientation (see Mercer 2012)[^mercer-2012]. Toward the past Leibniz counseled a grateful acquiescence not unlike God’s moral concurrence: “it is not sufficient to force ourselves to be patient; rather, we must truly be satisfied with everything that has come to us according to his will” (AG, 37). Even horrible things are to be accepted gratefully, because “afflictions, especially those the good have, only lead to their greater good” (AG, 154). Toward the future, we “must not be quietists and stand ridiculously with arms folded, awaiting that which God will do […] but we must act in accordance with what we presume to be the will of God […] trying with all our might to contribute to the general good […]” (AG, 37). As above, we have actual moral agency and work for a “good master” (H, 57) who takes our efforts into account.
    step1: |-
      在《神义论》与更早的著作中，莱布尼茨把这些慰藉发展为一种时间定向的伦理学（见 Mercer 2012）[^mercer-2012]。面向过去，莱布尼茨劝人以感恩的默从——与上帝的道德协作相仿：“强迫自己耐心是不够的；毋宁说，我们必须真正满足于一切按其意志临到我们的东西”（AG, 37）。甚至可怕的东西也要感恩地接受，因为“苦难，尤其是善人所受的苦难，只会导向他们更大的善”（AG, 154）。面向未来，我们“不可做寂静主义者，滑稽地抱着双臂站着，等待上帝将做的事[……]而必须按我们所推定是上帝意志的东西行动[……]竭尽全力为共同的善作贡献[……]”（AG, 37）。如上所述，我们有现实的道德能动性，为一位把我们的努力考虑在内的“好主人”工作（H, 57）。
