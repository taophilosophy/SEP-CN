      The argument so far assumes there is a best possible world, rather than an infinite series of ever better worlds (see Adams 1972)[^adams-1972]. Leibniz defended this assumption by appeal to this world’s existence. God would have chosen not to create at all had there been no best world, because there would have been no sufficient reason to pick any world over its better. The existence of this world proves there is a best world, and God’s nature proves that this world *is* the best world. As Leibniz put it in the *Theodicy*, “a lesser good is a kind of evil” and “if there were not the best (*optimum*) among all possible worlds, God would not have produced any” (H, 131 & 252–253).
    step1: |-
      迄今为止的论证假定存在一个最好的可能世界，而非一个越来越好世界的无限系列（见 Adams 1972）[^adams-1972]。莱布尼茨借这个世界的存在为这一假定辩护。如果没有最好的世界，上帝本来会选择完全不创造，因为没有足够理由偏爱任何世界甚于其更好者。这个世界的存在证明存在一个最好的世界，而上帝的本性证明这个世界*就是*最好的世界。如莱布尼茨在《神义论》中所说：“较小的善是一种恶”，而且“如果一切可能世界中没有最好的（*optimum*），上帝就不会创造任何一个”（H, 131 & 252–253）。
