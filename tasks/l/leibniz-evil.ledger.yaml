      Leibniz was concerned to clear up what he considered a terminological confusion: if *necessarily, God wills the best* and *necessarily, there is one world which is best, viz. our world*, then *necessarily, our world exists*—or in Leibniz’s statement, “there is nothing possible except that which actually happens” (H, 232; argument summary from Murray 2014, 154)[^murray-2014]. The terminological confusion is not between hypothetical and *per se* necessity, because God’s own nature appears to preclude the existence of sub-optimal worlds, even if these worlds are possible in themselves (see Section 3). Instead, the confusion is between metaphysical necessity and “moral necessity,” a necessity grounded in practical wisdom and moral perfection (see Rateau 2019, 203–215)[^rateau-2019]. Just as we are confident that a wise person will forego real but extremely foolish options (H, 302), we may also be sure that God, though free, is “morally necessitated” to choose the best. This is a subtle point about practical reason: even unthinkable deeds are doable, and the choices that spring automatically from settled character are nevertheless free and have genuine moral significance. The argument above is a mere terminological confusion, because the first premise involves moral necessity, while the second premise involves metaphysical necessity. This appeal to moral necessity runs exactly counter to Leibniz’s early answer to the author of sin problem, which had relied on the metaphysical necessity of the best to shield God from fault for willing evil (see Section 2.2). However certain the choice, God did freely and morally create a world marked by sin and suffering.
    step1: |-
      莱布尼茨着意澄清他认为是一个术语混淆的东西：如果*必然地，上帝愿意最好的*，且*必然地，有一个世界是最好的，即我们的世界*，那么*必然地，我们的世界存在*——或用莱布尼茨的表述，“除了实际发生的，没有任何东西是可能的”（H, 232；论证概述自 Murray 2014, 154）[^murray-2014]。术语混淆不在于假设必然与*自身*必然之间，因为上帝自己的本性似乎排除次优世界的存在，即使这些世界在自身可能（见第 3 节）。毋宁说，混淆在形而上学必然性与“道德必然性”之间——后者是奠基于实践智慧与道德完善的必然性（见 Rateau 2019, 203–215）[^rateau-2019]。正如我们有信心一个智慧的人会放弃真实但极其愚蠢的选项（H, 302），我们也可以确信：上帝虽自由，却“在道德上被强制”去选择最好的。这是关于实践理性的一个精微之点：连不可想象的行径也是可行的，而从确定的品格自动产生的选择仍然是自由的、具有真正的道德意义。上面的论证只是术语混淆，因为第一个前提涉及道德必然性，而第二个前提涉及形而上学必然性。这一对道德必然性的诉诸，与莱布尼茨对罪之作者问题的早期回答正相反对——早期回答曾依赖最好的形而上学必然性来为上帝愿意恶开脱罪责（见第 2.2 节）。无论选择多么确定，上帝确实自由而道德地创造了一个以罪与苦难为标记的世界。
