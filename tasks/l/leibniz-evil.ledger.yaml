      The *Theodicy* itself is divided into three main parts, preceded by a substantial “Preliminary Dissertation on the Conformity of Faith with Reason” and followed by several appendices. The first part addresses the problem of evil in general, laying out Leibniz’s fundamental principles and arguments. The second and third parts revisit these themes in an ongoing dialogue with Pierre Bayle (Lodge 2020, 174 & 183)[^lodge-2020]. The appendices are titled, “Summary of the Controversy, Reduced to Formal Argument,” “Reflections on the Work that Mr. Hobbes Published in English on Freedom, Necessity and Chance,” and “Observations on the Book Concerning the Origin of Evil, Published Recently in London.” Finally, a condensed, Latin summary of the main arguments, titled “A Vindication of God’s Justice Reconciled with His Other Perfections and All His Actions,” now commonly called the *Causa Dei*, was added to the second edition (Lodge 2020, 174–5)[^lodge-2020]. E. M. Huggard published an English translation from the French in 1952, using Gerhardt’s edition from the late 19ᵗʰ Century. This is the only complete English translation of the *Theodicy*. It leaves some Latin quotes untranslated, lacks a scholarly apparatus, and omits the philosophically rich *Causa Dei*—which may be found in *Monadology and Other Philosophical Essays* (S).
