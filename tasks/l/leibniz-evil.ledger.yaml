      It was an important test of his answer, then, whether it could console the suffering and unite the divided. This explains, in part, why the *Theodicy* was “the most voluminous and intentionally popular philosophical work which Leibniz ever published” (Antognazza 2009, 479–480)[^antognazza-2009] and why he had concentrated on its themes for so many decades. It also explains the consoling passages distributed throughout the work, such as the following: “one often suffers through the evil actions of others; but when one has no part in the offence one must look upon it as a certainty that these sufferings prepare for us a greater happiness” (H, 279) and “not only pains and effort but also prayers are effective, God having had even these prayers in mind before he ordered things, and having made due allowance for them” (H, 384). The first passage reassures the reader that God’s providence accounts for human beings and their sufferings, and by extension, that the best world is also just. Since that justice is still hidden (see Section 3.1), God’s providence provides a basis for hope. The second passage suggests that this hope can be agential, a ground for action, because God has ordered the world to make our pain, effort, and prayer have good effects.
    step1: |-
      于是，他的回答能否安慰受苦者、团结分裂者，便是对它的一项重要检验。这部分解释了为什么《神义论》是“莱布尼茨曾出版的最卷帙浩繁、有意面向大众的哲学著作”（Antognazza 2009, 479–480）[^antognazza-2009]，以及为什么他数十年来一直专注于其主题。这也解释了分布于全书的慰藉性段落，例如：“人常常因他人的恶行而受苦；但当一个人与冒犯无份时，他必须把这些苦难看作确实在为我们准备更大的幸福”（H, 279）；以及“不仅痛苦与努力有效，祈祷也有效，上帝甚至在安排事物之前就已想到这些祈祷，并为它们作了适当的安排”（H, 384）。第一段让读者安心：上帝的天意考虑了人及其苦难，由此扩展，最好的世界也是正义的。既然那种正义仍然隐藏（见第 3.1 节），上帝的天意为希望提供了基础。第二段提示：这种希望可以是有能动性的，是行动的根据，因为上帝安排世界，使我们的痛苦、努力与祈祷产生好的效果。
