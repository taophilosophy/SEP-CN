      《自白》的修订，连同与尼古拉·斯滕诺相关的笔记（均系于 1677/8），已经显示重要进展。回想在原初《自白》中，罪的存在似乎直接随上帝自身的存在而来（CP, 45）。而在修订中，莱布尼茨通过区分*自身*必然与假设必然，强化了他对必然主义的拒斥。这一区分使他能够论证：某物可以必然地随上帝的本性而来，却不是*自身地*（就其自身或绝对地）必然（CP, xxiv–xxv & 55–7）。例如，在对话的修订结论中，莱布尼茨说罪“不是必然的，即使它们随某种必然的东西而来——上帝的存在或事物的和谐”（CP, 59）。世界的存在可能是上帝本性的必然后果（*假设*必然），但不是其自身本性的后果（*自身*必然）。同样，世界的特定特征——包括罪的发生——本身也不是绝对或*自身*必然的。关键在于：把受造世界限定于假设必然，使他能够把其他世界看作自身可能的。此外，在答复斯滕诺评注时，莱布尼茨为神圣意志在创造中的更主动角色辩护。他写道：“序列[即现实世界]之被设定，并非因为上帝被设定——除非这一点：上帝作为最智慧的存在者，只愿意最好的。一切可能的序列都在上帝的观念之中，但只有一个在最好的样式之下”（CP, 47）。这代表了与早先《自白》的重大分道——在早先那里，神圣意志的角色极小，仅限于对先在和谐的单纯认可。通过赋予上帝的意志更主动的角色，莱布尼茨能够主张：其他世界不仅在自身可能，也在上帝的创造能力之内。这为莱布尼茨开辟了空间，去论证上帝行使了能动性*并且*不能做得更好——因为他已经*选择*了最好的世界。
