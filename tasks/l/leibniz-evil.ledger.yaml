    source: |-
      This entry follows Leibniz’s effort to credit God for good while excusing God of evil, beginning with his first attempts in the early 1670s and culminating in his most extensive and popular published work, the *Theodicy* (Antognazza 2009, 480)[^antognazza-2009]. The first section outlines Leibniz’s understanding of why evil presents a problem for his conceptions of God, freedom, and creation. The second section presents Leibniz’s first attempt at a complete answer, and the final section focuses on the emergence and coherence of Leibniz’s mature view.
    step1: |-
      本词条追踪莱布尼茨把善归于上帝、同时为上帝开脱恶之责任的努力：始于十七世纪七十年代初的最初尝试，终于其最宏富、最流行的已刊著作《神义论》（Antognazza 2009, 480）[^antognazza-2009]。第一节概述莱布尼茨如何理解恶为何对其上帝观、自由观与创造观构成问题。第二节呈出莱布尼茨第一次完整作答的尝试，最后一节聚焦莱布尼茨成熟观点的出现与融贯。
    step2: |-
      本词条追踪莱布尼茨的努力：把善归于上帝，同时为上帝开脱恶。这一努力始于十七世纪七十年代初的最初尝试，终于其最宏富、最流行的已刊著作《神义论》（Antognazza 2009, 480）[^antognazza-2009]。第一节概述莱布尼茨如何理解恶为何对其上帝观、自由观与创造观构成问题。第二节呈出其第一次完整作答的尝试；末节聚焦莱布尼茨成熟观点之出现与融贯。
