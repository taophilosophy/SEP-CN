      There is still an explanatory gap between metaphysical evil and moral evils like malice. Could there have been inherently limited moral agents that nevertheless did not become the deficient causes of sin? Filling this gap would involve Leibniz’s treatment of original sin and grace, topics he did address at length in the *Theodicy* (H, 172–185; see also Rutherford 2014, 78–86)[^rutherford-2014]. The crucial point here is that finite moral agents, due to their inherent limitations, are disposed to be limited in ways that matter morally, and so to become deficient causes of sin. God permits sin just by knowingly extending physical concurrence to these morally compromised agents, because of their contribution to the best possible world. Therefore, despite God’s encompassing providence, creaturely culpability for sin remains intact, grounded in the creature as an inherently deficient cause.
    step1: |-
      形而上学恶与道德恶（如恶意）之间仍有一个解释缝隙。可不可能有内在有限的道德行动者却并未成为罪的缺失因？填补这一缝隙会牵涉莱布尼茨对原罪与恩典的处理——他在《神义论》中确实长篇讨论了这些主题（H, 172–185；另见 Rutherford 2014, 78–86）[^rutherford-2014]。这里的关键点是：有限的道德行动者由于其内在限定，倾向于在道德上要紧的方面受限，从而成为罪的缺失因。上帝容许罪，仅仅是由于知情地把物理协作延伸给这些道德上受损的行动者——因为它们对最好的可能世界有贡献。因此，尽管有上帝涵括性的天意，受造者对罪的罪责依然完好，奠基于作为内在缺失因的受造者。
