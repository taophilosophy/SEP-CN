      Leibniz was and is well known for his effort to answer the philosophical and theological problems posed by evil. Already in his own day he was gratified that his *Theodicy* (1710), a book-length treatment of “the goodness of God, the freedom of man, and the origin of evil,” had “pleased excellent theologians of all three main confessions” (Antognazza 2009, 482–3)[^antognazza-2009]. Voltaire’s popular novel, *Candide* (1759), features Dr. Pangloss, whose refusal to acknowledge the badness of things seems to caricature Leibniz’s optimism. More recently, scholars have given the problem of evil a central place in Leibniz’s thought (Rutherford 1995; Antognazza 2009)[^antognazza-2009][^rutherford-1995]. Major projects have provided access to key texts (CP; LGR; DPG), insight into the *Theodicy* itself (Rateau 2011; Jorgensen & Newlands 2014)[^jorgensen-2014][^newlands-2014][^rateau-2011], and a synthetic understanding of Leibniz’s developing views (Rateau 2019)[^rateau-2019].
    step1: |-
      莱布尼茨过去和现在都以其回应恶所提出的哲学与神学问题的努力而闻名。早在其 own 时代，他就欣慰于其《神义论》（1710）——一部论述“上帝的善、人的自由与恶的起源”的长篇著作——曾“取悦三大主要认信的所有杰出神学家”（Antognazza 2009, 482–3）[^antognazza-2009]。伏尔泰的通俗小说《老实人》（1759）塑造了邦葛罗斯博士，其拒绝承认事物之坏的态度，似乎是对莱布尼茨乐天主义的漫画化。较近以来，学者们已把恶的问题置于莱布尼茨思想的中心（Rutherford 1995; Antognazza 2009）[^antognazza-2009][^rutherford-1995]。若干重大工程已使人得以接触关键文本（CP; LGR; DPG）、洞见《神义论》本身（Rateau 2011; Jorgensen & Newlands 2014）[^jorgensen-2014][^newlands-2014][^rateau-2011]，并综合地理解莱布尼茨发展中的观点（Rateau 2019）[^rateau-2019]。
    step2: |-
      莱布尼茨过去与现在，都以回应恶所提之哲学与神学问题的努力而闻名。早在其 own 时代，他就欣慰于其《神义论》（1710）——一部论述“上帝的善、人的自由与恶的起源”的长篇著作——曾“取悦三大主要认信的所有杰出神学家”（Antognazza 2009, 482–3）[^antognazza-2009]。伏尔泰的通俗小说《老实人》（1759）塑造了邦葛罗斯博士：其对事物之坏的拒不肯认，似乎正是对莱布尼茨乐天主义的漫画化。较近以来，学者们已把恶的问题置于莱布尼茨思想的中心（Rutherford 1995; Antognazza 2009）[^antognazza-2009][^rutherford-1995]。若干重大工程使人得以接触关键文本（CP; LGR; DPG）、洞见《神义论》本身（Rateau 2011; Jorgensen & Newlands 2014）[^jorgensen-2014][^newlands-2014][^rateau-2011]，并综合地把握莱布尼茨发展中的观点（Rateau 2019）[^rateau-2019]。
