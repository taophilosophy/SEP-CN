      Despite their apparent simplicity, Leibniz’s arguments require a sophisticated metaphysical foundation. For example, Leibniz associated optimality with metaphysical perfection (AG, 39), metaphysical perfection with unity (A, VI.i.484–5; SLT, 191–2), and this in turn with substances (ARN, 171 & 181–211). Since a world is an aggregate of substances and not one substance, finding its degree of perfection and choosing it above all others requires the many substances to be reckoned as one, as a unit: “I call ‘World’ the whole succession and the whole agglomeration of all existent things, lest it be said that several worlds could have existed in different times and different places. For they must needs be reckoned all together as one world or, if you will, as one Universe” (H, 131 & 271; see also A, VI.iv.559–60). This requires Leibniz to specify a function or reckoning from possible substances to collections of possible substances (possible worlds), and another function from these possible worlds to values, with one collection coming out as best. The simplest candidate functions treat any set of possible substances as a possible world and find the value of a possible world by summing the value of its substances. These do not work for Leibniz, because they imply that the best possible world contains absolutely all possible substances. There is considerable discussion in the secondary literature around these functions, the first under the heading of “compossibility” (Messina & Rutherford 2009; Feeney 2016; Rutherford 2021)[^feeney-2016][^messina-2009][^rutherford-2021] and the second under “harmony” and “metaphysical perfection” (Gale 1976; Carlin 2000; Glowienka 2016; Newlands 2018, 33–41)[^carlin-2000][^gale-1976][^glowienka-2016][^newlands-2018].
    step1: |-
      尽管表面简单，莱布尼茨的论证需要一个精致的形而上学基础。例如，莱布尼茨把最优性与形而上学完善相联（AG, 39），把形而上学完善与统一性相联（A, VI.i.484–5; SLT, 191–2），又把后者与实体相联（ARN, 171 & 181–211）。既然一个世界是实体的聚集体而非单个实体，找出其完善度并把它选择于一切其他之上，就要求把众多实体算作一个、算作一个单元：“我把‘世界’称为一切存在事物的整个序列与整个聚集体，以免有人说几个世界本可以存在于不同时间与不同地点。因为必须把它们全体一起算作一个世界，或者如果你愿意，算作一个宇宙”（H, 131 & 271；另见 A, VI.iv.559–60）。这要求莱布尼茨指定一个从可能实体到可能实体集合（可能世界）的函数或计算，以及另一个从这些可能世界到值的函数，其中一个集合算出来是最好的。最简单的候选函数把任何一组可能实体当作一个可能世界，并通过求和其实体的值来找出可能世界的值。这些函数对莱布尼茨不管用，因为它们蕴涵：最好的可能世界绝对包含一切可能的实体。二手文献中围绕这些函数有大量讨论：前者以“可共存性”为题（Messina & Rutherford 2009; Feeney 2016; Rutherford 2021）[^feeney-2016][^messina-2009][^rutherford-2021]，后者以“和谐”与“形而上学完善”为题（Gale 1976; Carlin 2000; Glowienka 2016; Newlands 2018, 33–41）[^carlin-2000][^gale-1976][^glowienka-2016][^newlands-2018]。
