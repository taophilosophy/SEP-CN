      Nevertheless, these replies miss the core of the objection, which is that our world could be better, not that it is overall bad. To answer this, Leibniz needed to show that, possibly, improving the neighborhood would not improve the world, or that local badness contributes to global perfection. For this, Leibniz returned to a theme present since his earliest theodicy, that the world is an integral and harmonious whole no part of which may be changed without disruption (see Section 2.2). “God’s pronouncement,” Leibniz wrote, “concerns the whole sequence at the same time; he simply decrees its existence. In order to save other men, or in a different way, he must needs choose an altogether different sequence, seeing that all is connected in each sequence” (H, 171). Individual substances may be really independent metaphysical units, but they all reflect each other and each displays a single overarching plan or idea, and so no part of a world may be swapped for something better without destroying the metaphysical perfection of the world (AG, 47 & 219–220). Moreover, the evils we perceive contribute to a greater good: “A little acid, sharpness or bitterness is often more pleasing than sugar; shadows enhance colors; and even a dissonance in the right place gives relief to harmony. […] And is it not most often necessary that a little evil render the good more discernible, that is to say, greater?” (H, 133). Here, Leibniz continues a Platonic tradition that includes Aquinas, who wrote that the “universe, the present creation being supposed, cannot be better, on account of the most beautiful order given to things by God. … For if any one thing were bettered, the proportion of order would be destroyed; as if one string were stretched more than it ought to be, the melody of the harp would be destroyed” (Aquinas, *Summa Theologiae*, I.25.6.ad3 as quoted in Pruss 2020, 206–7; see also Mercer 2008)[^mercer-2008][^pruss-2020].
    step1: |-
      然而，这些回答没有击中反驳的要害——要害是我们的世界可以更好，而非它整体上是坏的。为回答这一点，莱布尼茨需要表明：改善邻近区域可能并不会改善世界，或者说局部之恶有助于全局之完善。为此，莱布尼茨回到其最早神义论中已出现的一个主题：世界是一个完整的、和谐的整体，其任何部分不经破坏便不能改变。“上帝的宣判”，莱布尼茨写道，“同时关乎整个序列；他只是颁布其存在。为了拯救其他人，或以不同的方式，他必须选择一个全然不同的序列，因为每一序列中一切都是相连的”（H, 171）。个体实体也许是实在独立的形而上学单元，但它们彼此反映，每一个都展示单一的统摄性计划或观念；因此世界的一部分不能换成更好的东西而不摧毁世界的形而上学完善（AG, 47 & 219–220）。此外，我们所知觉的恶有助于更大的善：“一点酸味、辛辣或苦味往往比糖更令人愉快；阴影增强色彩；甚至恰当地位上的不协和也给和谐带来松弛。[……]而一点恶使善更可辨认，也就是说更大，这不是最常见的必要吗？”（H, 133）。在这里，莱布尼茨延续了一个包括阿奎那在内的柏拉图式传统——阿奎那写道：“宇宙，在假定当前创造的情况下，不能更好，因为上帝给予事物的秩序最美。……因为如果任一事物被改善，秩序的比例就会被破坏；就像一根琴弦被绷得超过应有的程度，竖琴的旋律就会被毁”（阿奎那，《神学大全》，I.25.6.ad3，转引自 Pruss 2020, 206–7；另见 Mercer 2008）[^mercer-2008][^pruss-2020]。
