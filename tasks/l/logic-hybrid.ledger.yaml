      A formula $\mathtt{\phi}$ is said to be *true* at $w$ if $M, g, w \vDash \mathtt{\phi}$; otherwise it is said to be *false* at $w$. By convention $M, g \vDash \mathtt{\phi}$ means $M, g, w \vDash \mathtt{\phi}$ for every element $w$ of $W$ and $M \vDash \mathtt{\phi}$ means $M, g \vDash \mathtt{\phi}$ for every assignment $g$. A formula $\mathtt{\phi}$ is *valid* in a frame if and only if $M \vDash \mathtt{\phi}$ for any model $M$ that is based on the frame in question. A formula $\mathtt{\phi}$ is *valid* in a class of frames $F$ if and only if $ \mathtt{\phi}$ is valid in any frame in $F$. A formula $\mathtt{\phi}$ is *valid* if and only if $\mathtt{\phi}$ is valid in the class of all frames. The definition of satisfiability is left to the reader.
    step1: |-
      若 $M, g, w \vDash \mathtt{\phi}$，则称公式 $\mathtt{\phi}$ 在 $w$ 处 *真*，否则称在 $w$ 处 *假*。按约定，$M, g \vDash \mathtt{\phi}$ 表示对 $W$ 的每个元素 $w$ 都有 $M, g, w \vDash \mathtt{\phi}$；$M \vDash \mathtt{\phi}$ 表示对每个指派 $g$ 都有 $M, g \vDash \mathtt{\phi}$。公式 $\mathtt{\phi}$ 在框架中 *有效*，当且仅当对任何基于该框架的模型 $M$ 都有 $M \vDash \mathtt{\phi}$。公式 $\mathtt{\phi}$ 在框架类 $F$ 中 *有效*，当且仅当 $\mathtt{\phi}$ 在 $F$ 的任一框架中都有效。公式 $\mathtt{\phi}$ *有效*，当且仅当它在所有框架构成的类中有效。可满足性的定义留给读者。
    step2: |-
      若 $M, g, w \vDash \mathtt{\phi}$，称 $\mathtt{\phi}$ 在 $w$ 处 *真*，否则称在 $w$ 处 *假*。约定 $M, g \vDash \mathtt{\phi}$ 指对 $W$ 中一切 $w$ 均有 $M, g, w \vDash \mathtt{\phi}$；$M \vDash \mathtt{\phi}$ 指对一切指派 $g$ 均有 $M, g \vDash \mathtt{\phi}$。$\mathtt{\phi}$ 在某框架中 *有效*，当且仅当一切基于该框架的模型 $M$ 都满足 $M \vDash \mathtt{\phi}$；$\mathtt{\phi}$ 在框架类 $F$ 中 *有效*，当且仅当 $\mathtt{\phi}$ 在 $F$ 的每个框架中都有效；$\mathtt{\phi}$ *有效*，当且仅当 $\mathtt{\phi}$ 在一切框架的类中有效。可满足性的定义从略。
