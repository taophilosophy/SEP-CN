      In the summer of 1669, Sydenham contemplated a new work based upon his continued observations on smallpox. Stylometric analysis demonstrates that the manuscript Epistolary Dedication to Shaftesbury, and Preface, both in Locke’s hand, but both written in the first person from Sydenham’s perspective, were jointly authored by both Locke and Sydenham (Burrows & Anstey 2013)[^burrows-2013]. Locke was here helping to compose a justification for Sydenham’s approach to the treatment of the disease, and defend him against the censures of the contemporary medical profession. Around the same time Locke also drafted two extended medical essays, “Anatomia” in 1668 on the limited utility of anatomy for medicine, and “De Arte Medica” in 1669 on the practice of medicine more generally. Both are in Locke’s hand, and stylometric analysis confirms Locke as their sole author (Anstey & Burrows 2009)[^anstey-2009], but both were apparently written to defend Sydenham’s medical methodology. Indeed, “Anatomia” begins with an interpolated sentence in Sydenham’s hand written in the first person, framing the essay as part of a larger treatise.
    step1: |-
      1669 年夏，西德纳姆筹划一部新著，基于他对天花的持续观察。文体计量学分析表明：题献沙夫茨伯里伯爵的书信体献辞与序言——两者均为洛克手迹，但都以第一人称从西德纳姆的视角写成——由洛克与西德纳姆共同撰写（Burrows & Anstey 2013）[^burrows-2013]。洛克在此帮助撰写一份为西德纳姆治疗该病之进路辩护的文本，抵御当代医学行业的责难。大约同时，洛克还起草了两篇长篇医学文章：1668 年的《解剖学》（“Anatomia”），论解剖学对医学效用有限；1669 年的《论医术》（“De Arte Medica”），较一般地论行医实践。两篇均为洛克手迹，文体计量学分析确认洛克是其唯一作者（Anstey & Burrows 2009）[^anstey-2009]，但两者显然都是为捍卫西德纳姆的医学方法论而写。事实上，《解剖学》开篇有一句以第一人称写成的插入语，出自西德纳姆手迹，把这篇文章框定为某部更大论著的一部分。
