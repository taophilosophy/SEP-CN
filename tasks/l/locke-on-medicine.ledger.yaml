      This larger treatise might also have been the reason that Sydenham’s projected work on Smallpox did not appear. Sydenham was reformulating his views on disease, supposing that each year had its own epidemic “constitution” (Bates 1975: Part II, 61–140)[^bates-1975]. He set about a more comprehensive treatment of disease over several years from 1667 to 1674 and assembled his extended clinical observations in a large vellum-bound manuscript collection of essays entitled *Medical Observations* (Royal College of Physicians MS 572 (Sydenham 1667–74 [1991])[^sydenham-1667]). The early essays begin with different disease species, their symptoms and most effective method of cure, but as the manuscript continues, diseases are grouped together into constitutions. Indeed, Sydenham’s essay “Small Pox of the years 1667 & 1668” represented the first example of such a constitution (Sydenham 1667–74 [1991: 68–98])[^sydenham-1667]. There are approximately fifty separable essays in the *Medical Observations* written over 60 folio leaves (Sydenham 1667–74 [1991: 8–9])[^sydenham-1667]. Locke was intimately involved in the production of this manuscript, writing out ten of these essays in the manuscript in his own hand, comprising roughly one sixth of the text of the manuscript as a whole. Elsewhere in the manuscript he read and corrected Sydenham’s work, as Sydenham likewise corrected his. Amongst Locke’s papers in the Bodleian Library, there are numerous manuscripts copies of Sydenham’s essays from the “Medical Observations”. Seven are rough, corrected copies, which Locke had evidently made at Sydenham’s dictation. In addition Locke made fair copies of thirty four of the essays from the “Medical Observations”, the last, “Epidemicall diseases of the yeare 1670”, copied in the spring of 1671 (Sydenham 1667–74 [1991: 150–60])[^sydenham-1667].
    step1: |-
      这部更大的论著，或许也是西德纳姆计划中的天花之作未面世的原因。西德纳姆正在重新构造其疾病观：他设想每一年都有自己的流行病“体质”（Bates 1975: Part II, 61–140）[^bates-1975]。从 1667 到 1674 年，他着手对疾病作更全面的处理，把扩展的临床观察汇编成一部以牛皮纸装帧的大型手稿文集，题为《医学观察》（皇家内科医师学会手稿 572（Sydenham 1667–74 [1991]）[^sydenham-1667]）。早期文章以不同疾病之种、其症状与最有效疗法开篇；但随着手稿推进，疾病被归入各个体质。事实上，西德纳姆的文章《1667 与 1668 年的天花》正是这类体质的首个例子（Sydenham 1667–74 [1991: 68–98]）[^sydenham-1667]。《医学观察》中约有五十篇可分离的文章，写于 60 张对开页上（Sydenham 1667–74 [1991: 8–9]）[^sydenham-1667]。洛克深度参与了这部手稿的制作：其中十篇文章由洛克亲笔写出，约占整部手稿文本的六分之一。在手稿的其他部分，他阅读并校正西德纳姆的稿子，西德纳姆也同样校正他的。在牛津博德利图书馆的洛克文献中，有大量《医学观察》诸文章的手稿抄本。其中七本是粗糙的、经校正的抄本——显然是洛克在西德纳姆口述下所记。此外洛克还誊写了《医学观察》中三十四篇文章的清抄本，最后一篇《1670 年的流行病》抄于 1671 年春（Sydenham 1667–74 [1991: 150–60]）[^sydenham-1667]。
