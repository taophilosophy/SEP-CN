      Roughly translated, the title of the book was “Thomas Sydenham’s method for the treatment of fevers based upon his own observations”. Sydenham believed that there was no way for people to determine the causes of illness: these “cannot be laid down” (Sydenham 1666 [1987: 59])[^sydenham-1666]. Consequently, “Aetiology is a difficult, and, perhaps, an inexplicable affair; and I choose to keep my hands clear of it” (Sydenham 1666 [1987: 103])[^sydenham-1666]. So, rather than engage in the construction of hypotheses about the constitution of the body or disease, the book presented only a minimal theoretical structure and avoided the theoretical disputes of competing medical factions. In this respect it differed radically from most medical literature of the time.
    step1: |-
      这部书的大意标题是“托马斯·西德纳姆以本人观察为据的热病治疗法”。西德纳姆相信，人们无法查明疾病的原因：这些原因“无法被确立”（Sydenham 1666 [1987: 59]）[^sydenham-1666]。因此，“病因学是一桩困难的、或许无法解释的事情；我选择不插手”（Sydenham 1666 [1987: 103]）[^sydenham-1666]。于是，这部书不去构造关于身体或疾病构成的假说，而只呈现一个极小的理论结构，并回避相互竞争的医学派系的理论论争。在这一点上，它与当时大多数医学文献截然不同。
    step2: |-
