      It was this result would reshape Lower’s thinking in his *Tractatus de Corde* concerning the location of the volatisation of the blood, placing it exclusively in the lungs directly from the air (Lower 1669)[^lower-1669], the first published account of the basic mechanisms of physiology and the respective roles of the heart, lungs, veins, arteries and respiration. Locke’s instant grasp of the importance and implications of the Fracassati experiment allowed him to put the final piece of the physiological puzzle in place. Locke had now formulated the basic elements, machinery and purpose of respiration, ahead of the appearance of Lower’s *Tractatus*. Had he published a short summary of his thinking on respiration before Lower’s book, it might have secured him a place in the history of medicine as a physiologist at the cutting-edge of contemporary research.
