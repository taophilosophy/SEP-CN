      Much of the teaching at the time remained Galenic in origin and Locke read numerous thinkers in this tradition, like Glisson, Riverius, Fernel and Moebius. The core Galenic ontology was classical in origin and simple in explanatory structure. There were four elements: earth, air, fire and water, four primary qualities: hot, cold, wet and dry, four bodily humours: blood, black bile, yellow bile and phlegm, and the three spirits; natural, vital and animal. To cure a disease in the Galenic model was simple. If illness was due to some imbalance, the application of opposing qualities would return things to order. Put simply, “contraries may be cured and resisted by their contraries”. In addition, Locke began a systematic study of Daniel Sennert’s thought. Sennert was not an orthodox Galenist. He engaged in chemical experimentation and postulated corpuscles as constituent parts of larger objects, holding that each corpuscle was a compound of Aristotelean matter and form, and that the causal powers of the corpuscle were dependent on this form. Moreover, all the corpuscles in a body were arranged according to an overall form that structured the macroscopic body (Newman 1996: 573–6)[^newman-1996]. So, despite his progressive outlook and modification of classical thinking, Sennert retained a fundamental belief in traditional explanatory categories. Locke took scores of notes from Sennert’s works, and even went so far as to adopt the structure of his *Institutionum Medicinae* (1611) for a pair of large medical notebooks in which he recorded observations from a wide range of writers over several decades.[^note-1]
    step1: |-
      当时的许多教学仍源自盖伦传统；洛克阅读了这一传统中的大量作者，如格利森、里维乌斯、费尔内尔与默比乌斯。盖伦核心本体论源自古典时代，解释结构简单：四种元素（土、气、火、水），四种基本性质（热、冷、湿、干），四种身体体液（血液、黑胆、黄胆、黏液），以及三种精气——自然的、生命的与动物的。在盖伦模型中治病很简单：若疾病起于某种失衡，施加相反的性质即可恢复秩序。简言之，“相反者可被其相反者治愈与抵抗”。此外，洛克开始系统研究丹尼尔·森纳特的思想。森纳特并非正统盖伦派：他从事化学实验，主张微粒（corpuscles）是较大物体的构成部分，并认为每个微粒都是亚里士多德式质料与形式的复合物，微粒的因果力依赖这一形式。而且，体内所有微粒按一个总体形式排列——正是这一形式结构着宏观身体（Newman 1996: 573–6）[^newman-1996]。因此，尽管取向前卫并修正了古典思想，森纳特仍坚守传统解释范畴的根本信念。洛克从森纳特著作中做了大量笔记，甚至采取其《医学原理》（*Institutionum Medicinae*，1611）的结构来组织两部大型医学笔记本——他在其中数十年如一日地记录众多作者的观察。[^note-1]
