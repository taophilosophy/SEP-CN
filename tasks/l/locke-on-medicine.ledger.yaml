    source: |-
      These medical essays present a new approach to medicine, based upon a new set of premises. First, Locke places a significant emphasis upon the evidence of the senses—theories not based in sensory evidence are dismissed as meaningless. Second, Locke sets very strict limits on the scope of human knowledge, holding that we will simply never be able to penetrate into nature’s operations, because no-one but God can fully understand God’s creation. Consequently, third, speculation about the unobservable causes of disease are at best wasted and at worst both meaningless and misleading. This rules out both classical medical theorising and more recent innovations like the chymical theories of Helmont. So, fourth, physicians should focus on the “history” and observation of diseases, “their begining progresse & ways of cure”. Locke here expands on Sydenham’s precepts to more rigorously explain and defend them, and in doing so, moves away from his earlier approach to medicine. (In contrast, Anstey 2011a and 2011b supposes that Locke remained a “chymical” physician for the entirety of his career, but also promoted Sydenham as a proxy for Locke’s own innovations in medicine. This is debated in Walmsley 2012, Anstey 2015, and Walmsley 2016.)[^anstey-2011a][^anstey-2011b][^anstey-2015][^walmsley-2012][^walmsley-2016]
    step1: |-
      这两篇医学文章呈现了一种新的医学进路，基于一套新的前提。第一，洛克把重要位置给予感官的证据——不以感官证据为根基的理论被斥为无意义。第二，洛克给人类知识划出极严的界限，主张我们根本无法洞入自然的运作，因为除上帝之外无人能完全理解上帝的创造。因此，第三，关于疾病不可观察原因的思辨，往好了说是浪费，往坏了说既无意义又误导人。这排除了古典医学思辨，也排除了较新的革新（如赫尔蒙特的化学论理论）。于是，第四，医生应专注于疾病的“病史”与观察——“其发端、进程与治疗之道”。洛克在此扩展西德纳姆的箴言，更严格地解释并捍卫它们，并由此离开自己早先的医学进路。（相比之下，Anstey 2011a 与 2011b 认为洛克整个生涯始终是“化学论”医生，但也推举西德纳姆作为洛克自身医学革新的代理。这一点在 Walmsley 2012、Anstey 2015 与 Walmsley 2016 中有争论。）[^anstey-2011a][^anstey-2011b][^anstey-2015][^walmsley-2012][^walmsley-2016]
