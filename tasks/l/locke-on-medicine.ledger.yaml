      The extensive notes that Locke took in in a new commonplace book rather undercuts Wood’s unflattering portrait, and Locke would continue to record his own extensive on-going chymical experimentation in Oxford over the next several years (as detailed in Walmsley & Milton 1999)[^walmsley-1999].
