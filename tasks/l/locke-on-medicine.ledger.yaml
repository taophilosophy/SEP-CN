      A leading thinker in that tradition was then resident in Oxford—Thomas Willis, Sedleian Professor of Natural Philosophy. Some of Locke’s earliest medical notes after his M.A. come from Willis’s *Diatribe duae medico-philosophicae* (London 1659). Locke also attended Willis’s 1662 medical lectures, some of the notes deriving from his schoolfriend Richard Lower, who would shortly act as Willis’s assistant in the preparation of *Cerebri Anatome* (London 1664) (Willis’s c. 1662 lecture notes are printed in Dewhurst 1980)[^willis-1662]. In Willis’s view, macroscopic objects were made up of tiny parts. However, each of these particles has its own separate chemical identity, over and above its purely mechanical attributes. There were five different types of body in Willis’s opinion: spirit, sulphur, salt, water and earth. A particle of spirit would always be very active and volatile, irrespective of its size and shape, while one of earth would be inert. Change occurred when particles of one type were joined to particles of another. Willis called this chymical process of particular re-arrangement, a “fermentation” (Frank 1980: 165–9)[^frank-1980].
    step1: |-
      当时这一传统的一位思想翘楚正居牛津——托马斯·威利斯，塞德雷自然哲学教授。洛克硕士毕业后最早的医学笔记中，有一部分便出自威利斯的《医学哲学对话两篇》（*Diatribe duae medico-philosophicae*，伦敦 1659）。洛克还听了威利斯 1662 年的医学讲课——部分笔记源自其校友理查德·洛厄；洛厄不久便出任威利斯撰写《脑解剖学》（*Cerebri Anatome*，伦敦 1664）的助手（威利斯约 1662 年的讲义刊于 Dewhurst 1980）[^willis-1662]。照威利斯的看法，宏观物体由微小部分构成；但每个微粒在纯机械属性之外，另有其独立的化学身份。威利斯认为身体有五种类型：精气、硫、盐、水与土。精气微粒无论大小形状如何，总是非常活跃、易挥发；土微粒则惰性十足。一类微粒与另一类微粒结合时，变化便发生了。威利斯把这种微粒重排的化学过程称为“发酵”（Frank 1980: 165–9）[^frank-1980]。
