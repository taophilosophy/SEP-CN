      Locke asserted that he had an *idea* of corporeal efficacy in the case of moving and impacting bodies—he could see how motion and impact caused change in the natural work. Moreover, he asserted that that this was the *only* idea he had of how natural causes work. This would then mark a significant contrast between an Aristotelean “δημιουργὸς”, or an Helmontian “Archeus”, and a mechanical explanation. In the case of the former two, we “reach beyond the senses” to posit these entities of which we have no ideas grounded in sensation, where in the latter, we refer to processes we have actual experience of. So while Locke continued to maintain that our senses would never allow us to penetrate into nature’s operations, we can now “intelligibly” describe them in mechanical terms, since we have ideas of mechanical interactions. This line of argument, that mechanical explanations were more intelligible than their contemporary counterparts, was one that Boyle had and would advance in a number of publications (see Anstey 2019)[^anstey-2019], and one that Locke now began to evince.
    step1: |-
      洛克断言：对于移动物体与撞击物体的情形，他拥有关于物体功效的*观念*——他能看出运动与撞击如何在自然世界中造成变化。而且他断言：这是他关于自然原因如何运作的唯一观念。这便在亚里士多德派的“δημιουργὸς”或赫尔蒙特的“阿尔凯厄斯”与一种机械解释之间，标出显著的对照。就前二者而言，我们“越过感官”去设定这些实体——我们对它们没有任何植根于感觉的观念；就后者而言，我们指涉的是我们实际经验过的过程。因此，虽然洛克继续坚持我们的感官永远无法洞入自然的运作，如今我们却可以“清晰可解地”以机械术语描述它们，因为我们拥有机械相互作用的观念。这一论证路线——机械解释比其当代对应物更可理解——是波义耳已经并将继续在多篇出版物中推进的（见 Anstey 2019）[^anstey-2019]，而洛克如今开始显露同样的路线。
