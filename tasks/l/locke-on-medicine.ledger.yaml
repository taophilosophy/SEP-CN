      > I shall not at present meddle with the Physical Consideration of the Mind; or trouble myself to examine wherein its Essence consists; or by what Motions of our Spirits, or Alterations of our Bodies, we come to have any Sensation by our Organs, or any *Ideas* in our Understandings; and whether those *Ideas* do in their Formation, any, or all of them, depend on Matter, or no. These are Speculations, which, however curious and entertaining, I shall decline, as lying out of my Way, in the Design I am now upon. (Locke 1690: I.i.2 [1975: 43])[^locke-1690][^locke-1690-2]
    step1: |-
      > 我目前不打算插手对心灵的物理学考量，也不想费力去考察其本质何在；也不去考察凭借我们的精气有何运动、我们的身体有何改变，我们才经由器官获得感觉、或在理解中获得任何*观念*；也不去考察这些观念在形成时是否全部或部分依赖物质。这些思辨无论多么引人好奇、多么有趣，我都将搁置，因为它们越出我当前计划的路径。（Locke 1690: I.i.2 [1975: 43]）[^locke-1690][^locke-1690-2]
