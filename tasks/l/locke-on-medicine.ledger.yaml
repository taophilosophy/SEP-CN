      Locke also studied the work of another major figure in this tradition. Joan Baptista van Helmont, reading his major work, *Ortus Medicinae* at least twice—the 1648 edition *circa* 1660–1661 and the 1652 edition at points between 1665 and 1667, using the book itself to make notes (Walmsley 2000: 370)[^walmsley-2000]. Van Helmont believed that all matter was derived from water and that “ferments” impregnated different parts of water with “seeds” that transformed it into irreducibly different chymical elements by imposing an image or “idea” upon it. Helmont held that when elements truly reacted together, they were transmuted into an entirely new third substance sharing no properties with its antecedents. Helmont also believed that bodies contained “Archei”—quasi-spiritual entities that governed the operation of different organs (Pagel 1982)[^pagel-1982]. Disease occurred when a ferment, or “seminal principle” attempted to direct the matter of the body in some way other than that planned by the Archeus. Locke read several other authors in this tradition, including Kerger and Schookius.
    step1: |-
      洛克还研究了这一传统另一位大家的工作：让·巴普蒂斯塔·范·赫尔蒙特。他至少两读其大著《医学之源》（*Ortus Medicinae*）——1648 年版约在 1660–1661 年间，1652 年版则在 1665 至 1667 年间的若干时点，并在书页上直接做笔记（Walmsley 2000: 370）[^walmsley-2000]。范·赫尔蒙特相信万物源自水；“酵素”把“种子”注入水的不同部分，对水强加一个意象或“观念”，使之转变为不可再还原的不同化学元素。赫尔蒙特认为，元素真正反应时，会蜕变为一种全新的第三实体——与其前身不共享任何性质。他还相信身体内含“阿尔凯厄斯”（Archei）——掌管不同器官运作的准精神实体（Pagel 1982）[^pagel-1982]。当酵素或“种子原理”试图以某种偏离阿尔凯厄斯计划的方式支配身体质料时，疾病便发生了。洛克还读了这一传统中的其他作者，包括克尔格与斯胡克乌斯。
