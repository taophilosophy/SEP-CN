      Throughout this period and in parallel to these other medical traditions, Locke was also assiduously studied the mechanical philosophy. Locke had met Robert Boyle by 1660, who was by then an experienced experimenter at the outset of a publishing career that would establish him as the leading natural philosopher of his day. Locke read Boyle’s works as they were published, starting with the *New Experiments Physico-Mechanical touching the Spring of Air* (Oxford 1660), and continuing with *Certain Physiological Essays* (London 1661), *The Style of the Scriptures* (London 1661), *The Usefulness of Experimental Natural Philosophy* (Oxford 1663), and *The Origine of Formes and Qualities* (Oxford 1666). An exception was *The Sceptical Chymist* (London 1661), which was published in 1661, but not read by Locke until circa 1664–5 (Milton 1994: 37)[^milton-1994].
    step1: |-
      整个这一时期，与其他医学传统并行，洛克还勤勉研究了机械哲学。至迟在 1660 年洛克已结识罗伯特·波义耳——当时波义耳已是一位经验丰富的实验者，正处在一个出版生涯的起点；这一生涯将确立他作为当日头号自然哲学家的地位。波义耳著作一经出版洛克即读：始于《关于空气弹簧的物理-力学新实验》（牛津 1660），继以《若干生理学论文》（伦敦 1661）、《圣经的文体》（伦敦 1661）、《实验自然哲学之用处》（牛津 1663）与《形式与性质的起源》（牛津 1666）。一个例外是《怀疑的化学家》（伦敦 1661）：1661 年出版，洛克却迟至约 1664–5 年才读（Milton 1994: 37）[^milton-1994]。
