      > Analogy is of great use to the Mind in many Cases, especially in natural Philosophy, and that part of it chiefly which consists in happy and successful Experiments. But here we must take care that we keep ourselves within that wherein the Analogy consists. For Example, the acid Oyl of *Vitriol* is found to be good in such as case, therefore the Spirit of *Niter* or *Vinegar* may be us’d in the like case. If the good Effect of it be owing wholly to the Acidity of it, the trial may be justified; but if there be something else besides the Acidity in the Oil of *Vitriol*, which produces the good we desire in the case, we mistake that for Analogy, which is not, and suffer our Understanding to be misguided by a wrong supposition of Analogy where there is none. (Locke 1690–1704: 115)[^locke-1690][^locke-1690-2]
    step1: |-
      > 类比在许多情形中对心灵大有用处，尤其在自然哲学中——主要在其有幸而成功的实验那一部分。但在此我们必须当心：把自己保持在类比真正所在的范围内。例如，*矾*的酸油被发现于某种情形有益，因此*硝*或*醋*的精或许可用于类似情形。若其有益效果全然归因于其酸性，这一尝试可以成立；但若矾油中另有某种东西——除酸性外——产生我们所欲的益处，我们便把并非类比的东西误当作类比，让我们的理解被一个错误的类比设想误导——那里根本没有类比。（Locke 1690–1704: 115）[^locke-1690][^locke-1690-2]
