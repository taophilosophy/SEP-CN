      From 1660 to 1662, Locke also pursued a systematic examination Descartes’ work. He started with the *Principles of Philosophy*, then read the *Discourse on Method*, the *Dioptrics* and *Meteors*, the *Meditations*, some of the *Objections and Replies* and finally, the *Passions of the Soul*. Locke then read some of Gassendi’s *Syntagma*, and Spinoza’s re-construction of the Cartesian system, *Renati des Cartes Principorum Philosophiae Pars I, and II, More Geometrico demonstratae* in 1664 (this account drawn from Milton 1994: 37–9)[^milton-1994]. Locke’s notes on the mechanical philosophy were generally confined to the natural philosophical matters of fact that might interest a physician-in-training. Locke’s reading of Descartes appears to have been the inspiration for two short notes in his commonplace books. In the first, “Vacuum”, Locke considered whether solidity requires a vacuum, or whether motion provides an explanation (Locke c. 1662a)[^locke-1662a]. In the second, “Elasticus Motus”, Locke speculates on the properties of motion (Locke c. 1662b [2001: 221–2])[^locke-1662b].
    step1: |-
      1660 至 1662 年，洛克还系统考察了笛卡尔的著作。他从《哲学原理》读起，继而读《谈谈方法》、《屈光学》与《气象学》、《沉思集》、《反驳与答辩》的部分内容，最后读《论灵魂的激情》。随后他读了伽桑狄《哲学体系》的部分内容，并于 1664 年读了斯宾诺莎对笛卡尔体系的重构——《以几何学方式证明的笛卡尔哲学原理第一、二部分》（此说明取自 Milton 1994: 37–9）[^milton-1994]。洛克关于机械哲学的笔记，大体限于可能令受训医生感兴趣的自然哲学事实。洛克对笛卡尔的阅读，似乎启发了其摘录簿中的两条短注。其一题为“真空”（Vacuum），洛克考虑：坚实性是否需要一个真空，抑或运动可提供解释（Locke 约 1662a）[^locke-1662a]。其二题为“弹性运动”（Elasticus Motus），洛克推测运动的诸属性（Locke 约 1662b [2001: 221–2]）[^locke-1662b]。
    step2: |-
      1660 至 1662 年，洛克还系统考察了笛卡尔的著作。他从《哲学原理》读起，继而读《谈谈方法》、《屈光学》与《气象学》、《沉思集》、《反驳与答辩》的部分内容，最后读《论灵魂的激情》。随后他读了伽桑狄《哲学体系》的部分内容，并于 1664 年读了斯宾诺莎对笛卡尔体系的重构——《以几何学方式证明的笛卡尔哲学原理第一、二部分》（此说明取自 Milton 1994: 37–9）[^milton-1994]。洛克关于机械哲学的笔记，大体限于可能令受训医生感兴趣的自然哲学事实。洛克对笛卡尔的阅读，似乎启发了其摘录簿中的两条短注。其一题为“真空”（Vacuum），洛克考虑：坚实性是否需要一个真空，抑或运动可提供解释（Locke 约 1662a）[^locke-1662a]。其二题为“弹性运动”（Elasticus Motus），洛克推测运动的诸属性（Locke 约 1662b [2001: 221–2]）[^locke-1662b]。
