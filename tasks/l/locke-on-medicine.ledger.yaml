    source: |-
      While there is as yet no definitive account of Locke’s medical work, the topic has been of increasing interest to scholars over the last several decades. Kenneth Dewhurst produced numerous articles on Locke’s medical work drawing upon the recently acquired Lovelace collection of Locke manuscripts in the 1950s and 60s, culminating in his monograph *John Locke: Physician and Philosopher* (1963), contextualising the medical entries in Locke’s journals. Patrick Romanell’s *Locke and Medicine* (1984) began to draw out the connections between Locke’s medical work and his philosophical views. In a series of books and articles in the 1990s, Guy Meynell demonstrated the deep personal and professional connections between Locke and Sydenham. More recently, J. C. Walmsley has produced updated transcriptions of Locke’s key medical texts, and highlighted the close relationship between Locke’s medical work and the early versions of the *Essay*. Most recently Peter Anstey’s *John Locke and Natural Philosophy* (2011b) has presented a detailed and rounded view of Locke’s medical interests and their impact on his philosophical views (though his interpretation of the relationship between Locke and Sydenham, and Locke’s commitment to chymical theory, has drawn commentary in Walmsley 2012 and 2016)[^walmsley-2012][^walmsley-2016].
    step1: |-
      洛克的医学工作迄今尚无定论式的研究，但近几十年来学者对这一话题的兴趣与日俱增。Kenneth Dewhurst 在 1950 与 60 年代利用新近入藏的洛克手稿“洛夫莱斯收藏”撰成多篇论述洛克医学工作的文章，最终汇聚为其专著《约翰·洛克：医生与哲学家》（1963），把洛克日记中的医学条目置于语境之中。Patrick Romanell 的《洛克与医学》（1984）开始梳理洛克医学工作与其哲学观点之间的关联。在 1990 年代的一系列著作与文章中，Guy Meynell 揭示了洛克与西德纳姆之间深层的私人及职业联系。晚近，J. C. Walmsley 产出了洛克关键医学文本的更新转录本，并强调洛克的医学工作与《人类理解论》诸早期版本之间的紧密关系。最近，Peter Anstey 的《约翰·洛克与自然哲学》（2011b）对洛克的医学旨趣及其对其哲学观点的影响给出细致而全面的图景（尽管其对洛克与西德纳姆关系、以及洛克对化学论理论的信奉的解释，在 Walmsley 2012 与 2016 中引来了评论）[^walmsley-2012][^walmsley-2016]。
    step2: |-
      洛克的医学工作迄今尚无定论式的研究，但近几十年来学者对这一话题的兴趣与日俱增。Kenneth Dewhurst 在 1950 与 60 年代利用新近入藏的洛克手稿“洛夫莱斯收藏”撰成多篇文章，论述洛克的医学工作；它们最终汇聚为其专著《约翰·洛克：医生与哲学家》（1963），把洛克日记中的医学条目置于语境之中。Patrick Romanell 的《洛克与医学》（1984）开始梳理洛克医学工作与其哲学观点的关联。在 1990 年代的一系列著作与文章中，Guy Meynell 揭示了洛克与西德纳姆之间深层的私人及职业联系。晚近，J. C. Walmsley 产出了洛克关键医学文本的更新转录本，并强调洛克的医学工作与《人类理解论》诸早期版本的紧密关系。最近，Peter Anstey 的《约翰·洛克与自然哲学》（2011b）细致而全面地呈现了洛克的医学旨趣及其哲学影响。不过，他对洛克与西德纳姆关系、以及洛克对化学论理论之信奉的解释，在 Walmsley 2012 与 2016 中引来评论[^walmsley-2012][^walmsley-2016]。
  - id: 3
    kind: body
    source: |-
      Understanding the depth of Locke’s medical research, and the way that this research shaped his philosophical views, provides an insight into the deep structure of his epistemological and metaphysical outlook—both the underpinnings of his worldview, and his overall methodology. So while Locke’s work as a physician is not widely known, his medical outlook is arguably the bedrock on which he built the superstructure of his philosophy. This article traces Locke’s medical work through the earlier stages of career to identify how his commitments changed over time and demonstrate how his training as a physician shaped key philosophical principles in the early drafts of the *Essay*, thereby laying the foundations for his mature views.
    step1: |-
      理解洛克医学研究的深度，以及这一研究如何塑造其哲学观点，可以让我们窥见其认识论与形而上学立场的深层结构——既包括其世界观的根基，也包括其总体方法论。因此，洛克作为医生的业绩虽鲜为人知，其医学取向却可以说是他构筑哲学大厦的地基。本文沿着洛克职业生涯的早期阶段追溯其医学工作，以判明其信奉如何随时间变化，并表明其医生训练如何在《人类理解论》早期草稿中塑造了若干关键哲学原则，从而为其成熟观点奠定基础。
    step2: |-
