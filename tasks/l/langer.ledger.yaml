      作为《符号逻辑杂志》的创始成员，朗格在 1926–1939 年间评论了十九部德语、法语、英语与意大利语的逻辑与哲学著作。她的第一部哲学著作《哲学的实践》（*The Practice of Philosophy*，1930b）是一部“分析”哲学导论，发展了其博士论文中的观念，意在作为面向普通读者的哲学入门。她以历史的方式安置其“意义的逻辑基础”概念，论证说，“综观的”、对万物的“鸟瞰……不可能通过直接专注于宇宙本身而确立”（1930b: 215），而只能通过分析。她为自己的探索辩护——寻找“普遍模式”，以及“对可能性作系统考察”对哲学的重要性，即一种形式知识，能赋予人迅速、独立而清晰地理解“在自然中、在生命中、在仪式与艺术中”的意义的能力（1930b: 218, 221）。她援引对《逻辑哲学论》的解读，批评绝对“第一因”观念是一种“伪概念”，理由是特定原因的概念只在自然 *之内* 有其位置，而不在自然之外（1930b: 61ff.; 参 Langer 1936）。此书在美国被视为标志着朗格对哲学“新运动”的重要性（Blumberg & Feigl 1931: 281）[^blumberg-1931]，并在维也纳学派中引起积极讨论，尤受石里克称赞（Verhaegh 2022: 216ff.）[^verhaegh-2022][^verhaegh-2022-2]。
