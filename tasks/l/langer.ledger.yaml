      Wittgenstein’s analogy takes propositions to be picture-facts, embodied uses of configurations of signs that symbolize other facts through projection of possibilities (Dengerink Chaplin 2019, 2020, 2024)[^dengerink-2019]; Langer stresses the idea that any such projection expresses a particular (possible) way of ordering and conceiving reality.
