      Though she endorses Kant’s conception of mental activity as an active imposition of form and synthesis upon a flux of experience, and his insistence that there is no ultimate unique form of reality apart from our conceptions of it (Langer 1933; Felappi 2017)[^felappi-2017], Langer takes the Kantian emphasis on reason, principles, and *a priori* categories to overlook the importance of non-discursive orderings of perceptual forms. Rather than hiving off feeling to an irrational realm, she takes all human symbolic activity to bear upon reason (PNK 97, 143). She rejects Cassirer’s antipathy to Freud, taking their views of symbolic ideation to be “deep and close” (Langer 1949: 383, 395ff.). Cassirer’s originality, she argued, lay in his treating mythological forms of consciousness, not directly as symbols, but as evincing a “confusion of symbol and meaning” in which each is attributed the same degree of “reality” (1924b: 696); similarly unconscious feelings, as Freud argued, absorb the symbolic “virtually”, though Langer was critical of Freud’s naïve reductionism (Freud 1900/1930 [1955: 606]; cf. Langer 1924a: 36; Maigné 2019)[^freud-1900][^maigné-2019]; it would take until MEHF for Langer’s embodied account of unfelt “acts” to transpose the idea, perhaps eliminating it, though on this scholars do not agree (Richter 2007: 113)[^richter-2007].
    step1: |-
      尽管朗格赞同康德把心理活动理解为对经验之流主动施加形式与综合的构想，也赞同他坚持：除我们对实在的概念之外，不存在终极唯一的实在形式（Langer 1933; Felappi 2017）[^felappi-2017]，但她认为康德对理性、原则与 *先天* 范畴的强调，忽视了知觉形式的非推论性排序的重要性。她没有把情感隔离到非理性领域，而是认为一切人类符号活动都与理性相关（PNK 97, 143）。她拒斥卡西尔对弗洛伊德的反感，认为二人关于符号观念化的看法“深刻而接近”（Langer 1949: 383, 395ff.）。她论证说，卡西尔的原创性在于：他不把神话形式的意识直接当作符号，而视之为表现出“符号与意义的混淆”——其中二者被赋予同等程度的“实在性”（1924b: 696）；同样，正如弗洛伊德所论，无意识情感“虚拟地”吸收了符号，尽管朗格批评弗洛伊德朴素还原论（Freud 1900/1930 [1955: 606]; 参 Langer 1924a: 36; Maigné 2019）[^freud-1900][^maigné-2019]；直到 MEHF，朗格对未被感受的“活动”的具身说明才转换了这一观念，或许还取消了它，不过学者对此并无共识（Richter 2007: 113）[^richter-2007]。
