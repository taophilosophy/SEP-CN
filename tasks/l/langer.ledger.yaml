      Langer’s emphasis on the notion of symbol drew deeply on the best linguistics and anthropology of her time. She particularly influenced the anthropologist Clifford Geertz (1973; see Isaac 2020)[^isaac-2020]. However, Geertz’s emphasis on interpretation and “thick description”, while sparked by Langer’s idea of symbolic form, is less concerned than she with the limits of the discursive mode. Although language is a crucial part of the symbolic evolution of humankind, it is not for Langer the origin of all abstractions. “Fantasies” (images and metaphorical associations) and play occur centrally in our life, ordering and expressing our sense of being alive, as does “the driving force” in human mentality: fear (PNK 158). Attunement to the ethnologist’s forms of feeling might transform social scientific work into something closer to art.
    step1: |-
      朗格对符号概念的强调，深深汲取了她那个时代最好的语言学与人类学。她尤其影响了人类学家克利福德·格尔茨（1973; 见 Isaac 2020）[^isaac-2020]。然而，格尔茨对解释与“深描”的强调，虽由朗格的符号形式观念所激发，却不如她那样关心推论性模式的限度。尽管语言是人类符号演化的关键部分，对朗格而言它并不是一切抽象的来源。“幻想”（意象与隐喻联想）与游戏居于我们生活的中心，整理并表达我们活着的感受；人类心智中的“驱动力”——恐惧——亦然（PNK 158）。对民族学家情感形式的体察，或可把社会科学工作转化为更接近艺术的东西。
