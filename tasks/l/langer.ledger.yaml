      朗格的双流符号化理论支撑其思想的人类学面向。她拒斥那种认为史前艺术只带着“功利的”或再现性观念而产生的看法：现代关于“效力与审美吸引力”的区分并不适用，因为巫术绝不是一种“平淡乏味”的活动，而是对自然力量的符号化（MEHF I 131）。她指出，在理解生与死现象时，（“女性”这一）概念至少在“原始反思”看来是自然的基本奥秘之一，其身体有盈亏。然而，“人类受孕与妊娠的实际过程太缓慢，难以呈现一种易于领会的模式。人需要一个符号，才能对它作融贯的思考”——例如毛伊神话中的月亮（PNK 191）。这种把许多概念凝聚进一个符号、并涵盖其构成部分的做法，正是精神分析家在梦中所称的“凝缩”，是一系列嵌入的、有机的类比，而非实际信念。能够 *在* 月亮中 *看见女性*，“有助于把那位神祇的职能人化并加以界定”（PNK 193）。
