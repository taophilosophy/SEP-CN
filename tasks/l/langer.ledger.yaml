      Langer’s account of music has been praised for its treatment of motion and movement, as well as her emphasis on the richness of concrete musical experience and its emotional shaping of experience (Kivy 1989, 2002; Levinson 2015)[^kivy-1989][^levinson-2015]. There remain objections that have been lodged. Langer never explains in PNK and FF what exactly the structure of an emotion is—though it is clear she thinks our ordinary taxonomy of simple emotions (fear, sadness, etc.) cannot do justice to our experience of music and, to be fair, she takes the notion of *feeling* to be basic. She appears to assume that all instances of a given emotion must exhibit a common form or structure, though since emotions are occurrent processes, and no structure evinces just one form it is not clear that this charge meets the mark. Langer’s idea of the “logical picturing of emotional form” idea may appear circular or at best metaphorical. It also seems that emotion may be conventionally or traditionally associated with music, or identified as that which listening to the music arouses (Levinson 2011: 283ff.)[^levinson-2011], though Langer’s idea that ritual can make particular feelings *definite* allows for the role of tradition in using music to around particular feelings. Langer has also been criticized for the ways in which she underplays the expression of *specific*, *definite* emotions in music that seem directly present *in* it, rather than virtually presented in general: it seems that just as sadness may be expressed immediately in a dog’s face or behavior, it can be expressed immediately in a musical passage, and if so, music does indeed represent actual emotions, rather than possible forms of them (Kivy 1989, 2002; Alperson 2004)[^alperson-2004][^kivy-1989]. It is not clear how fundamental such “resemblance” objections may be, because of Langer’s multi-layered and multi-dimensional view of symbolic forms and her sense of art materials and elements (Dengerink Chaplin 2020: 191)[^dengerink-2020].
