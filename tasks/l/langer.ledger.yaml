      If art is the objectification of feeling, it is also the subjectification of nature, “fusing” formal uses of materials in symbolic expressiveness (MEHF I 86f.). Its abstractions depend upon the specific artwork. Langer begins from her knowledge of music, but she also studied Paul Valéry (1939 [1958/2007]) on abstraction in poetry to reflect on her theory of the poetic mode of symbolization, sharing his fascination with the notion of *life* combining with higher order algebraical transformations, the idea of by-passing “entropy” through the projection of forms and descriptions of higher type (Rosenberg 2021)[^rosenberg-2021].
