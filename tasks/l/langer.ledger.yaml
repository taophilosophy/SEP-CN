    source: |-
      Langer’s trilogy *Mind: An Essay on Human Feeling* (1967–1982) pioneered a systems approach to the emergence of consciousness from its evolutionary biological roots. Extending her notions of *feeling* and *form*, Langer offered an encyclopedic review of the biology, neurology, psychology, ethology, and anthropological hypotheses about human culture of her time, treating the emergence of organic life from matter, animal ethology, and the higher-order emergence of various systems of culture in terms of a general notion of *act*, differentiated into a range of organic forms of life-processes and adaptations (impact and response, reflex, association, sign languages of animals, etc.). This conceptual work foreshadowed the affective turn in neurology and philosophy of mind, as well as the philosophical turn toward animal ethology, environment, and forms of life, offering an early alternative, both to cybernetics and to behaviorism (Dryden 2007)[^dryden-2007].
    step1: |-
      朗格的三部曲 *《心灵：论人类情感》*（1967–1982）开创了一种系统进路，考察意识如何从其演化生物学的根基中涌现。朗格扩展其 *情感* 与 *形式* 概念，对当时关于人类文化的生物学、神经学、心理学、动物行为学与人类学假说作了百科式综述：她把有机生命从物质中的涌现、动物行为学，以及各种文化系统的高阶涌现，都放在一个普遍的 *活动* 概念下处理，并把这一概念区分为一系列有机的生命过程与适应形式（冲击与反应、反射、联想、动物的信号语言等）。这一概念工作预示了神经学与心灵哲学中的“情感转向”，也预示了哲学转向动物行为学、环境与生命形式；它同时为控制论与行为主义提供了一种早期替代方案（Dryden 2007）[^dryden-2007]。
    step2: |-
      朗格的三部曲 *《心灵：论人类情感》*（1967–1982）首开系统进路，探讨意识如何从演化生物学的根基中涌现。她扩展 *情感* 与 *形式* 概念，对当时有关人类文化的生物学、神经学、心理学、动物行为学与人类学假说作了百科式综述；有机生命从物质中的涌现、动物行为学，以及各类文化系统的高阶涌现，均被纳入一个普遍的 *活动* 概念，并区分为一系列有机的生命过程与适应形式（冲击与反应、反射、联想、动物的信号语言等）。这番概念工作预示了神经学与心灵哲学中的情感转向，也预示了哲学向动物行为学、环境与生命形式的转向，并为控制论与行为主义双双提供了早期替代方案（Dryden 2007）[^dryden-2007]。
