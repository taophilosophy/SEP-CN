      Langer thus interweaves, while distinguishing, the roles of models and “images” in science and art (Dengerink Chaplin 2024)[^dengerink-2024]. “Images” are not necessarily visual but often “gestic, kinesthesic, verbal or… ‘situational’”, organizing and enhancing impressions directly received, rendering appearances in one perspective out of many possible ones, and setting forth what an object looks or seems or feels like (MEHF I 59). Aided by imagination, “imagery” abstracts phenomenal character, either its immediate effect on our sensibility or as something of importance, magnitude, strength, permanence, etc. By contrast, models illustrate a principle of construction or operation, telling us “how something works” (MEHF I 59). Artists have used a wide variety of devices for projecting three-dimensional presentations into two-dimensional presentations (tracing paper; the *camera obscura*, holding a thumb up to measure appearances of proportion in drawing, etc.), but here they have produced models by rules of symbolic transformation, not imagery. The forms so produced are “dead”, “empty” or “unfelt” (MEHF I 96). By contrast, “imagery” expresses living, moving forms. Poetic significance and factual reference are two different modes. Even though one may misleadingly speak of “truth” in myth and in science, the very idea of a *conflict* between them is “silly”, produced by confusing of presentational with discursive symbolization (PNK 202).
    step1: |-
      朗格由此在区分科学与艺术中模型与“意象”作用的同时，又把二者交织起来（Dengerink Chaplin 2024）[^dengerink-2024]。“意象”不一定是视觉的，而常常是“手势的、动觉的、语词的或……‘情境的’”，它组织并增强直接接收到的印象，从众多可能视角中呈现某一视角的外观，并展示一个对象看上去、显得或感觉起来如何（MEHF I 59）。在想象协助下，“意象”抽象出显象特征，或是其对感受性的直接效果，或是作为具有重要性、规模、力量、持久性等等的东西。相比之下，模型阐明一种构造或运作原理，告诉我们“某物如何运作”（MEHF I 59）。艺术家曾用各种各样的装置把三维呈现投射为二维呈现（描图纸；*暗箱*；在素描中竖起拇指测量比例外观，等等），但在这里他们按符号转换规则生产的是模型，而非意象。如此产生的形式是“死的”“空的”或“未被感受的”（MEHF I 96）。相比之下，“意象”表达活生生的、运动的形式。诗性意义与事实指涉是两种不同模式。尽管人们可能误导性地谈论神话与科学中的“真理”，但二者之间存在 *冲突* 的想法本身是“愚蠢的”，源于把表现性符号化与推论性符号化相混淆（PNK 202）。
