      Langer’s dissertation is the first in the United States to comprehensively treat the history of logic and theories of meaning—including phenomenology—from the early nineteenth century through 1926. Her annotated bibliography is an invaluable guide to the period. She focuses on Frege, Husserl, Couturat, Russell, Whitehead, Sheffer, and Wittgenstein, treating theories of meaning from Boole, Lady Welby, Peirce, and Cournot to Stout, Ogden, and Richards and many others, critically analyzing English, American, Italian, German, French and Polish sources. It shows the influence, not only of Whitehead and Sheffer, but also her tutor R.F.A. Hoernlé, a phenomenologist of meaning (see Hoernlé 1921)[^hoernlé-1921], referred to in Langer’s 1926a dissertation). His wife, Agnes Winifred Hoernlé, whom Langer also knew, was the founder of social anthropology in South Africa. The Hoernlés lived in Boston 1914–1920, and became leading liberal critics of apartheid, publishing widely on race, anthropology, and social reform. Hoernlé became critical of Langer’s enthusiasm for logic (Hoernlé 1931)[^hoernlé-1931] is a review of Langer’s first book 1930b).
    step1: |-
      朗格的博士论文是美国第一部全面处理 19 世纪初至 1926 年逻辑史与意义理论——包括现象学——的著作。她的带注释书目是研究该时期的宝贵指南。她聚焦弗雷格、胡塞尔、库蒂拉、罗素、怀特海、谢弗与维特根斯坦，处理从布尔、韦尔比夫人、皮尔士、库尔诺到斯托特、奥格登、理查兹等许多人的意义理论，批判性地分析英语、美国、意大利、德国、法国与波兰的文献。它显示出的影响不仅来自怀特海与谢弗，也来自她的导师 R.F.A. 霍尔恩勒——一位意义现象学家（见 Hoernlé 1921）[^hoernlé-1921]，朗格 1926a 年博士论文中曾提及）。他的妻子阿格尼丝·温妮弗雷德·霍尔恩勒（Agnes Winifred Hoernlé）——朗格也认识——是南非社会人类学的奠基人。霍尔恩勒夫妇 1914–1920 年住在波士顿，后来成为种族隔离制度的主要自由派批评者，就种族、人类学与社会改革广泛发表论著。霍尔恩勒后来批评朗格对逻辑的热衷（Hoernlé 1931）[^hoernlé-1931]，该文是对朗格第一部书 1930b 的书评）。
