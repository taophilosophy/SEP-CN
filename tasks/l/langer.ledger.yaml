      The first book in English to present Cassirer, PNK generalized Langer’s theory of symbolism in this way, revitalizing his thought. Langer read Cassirer early (1926a: 36, 170) and worked closely with him after his 1941 emigration to the United States. She may be said to have carried out the analysis of art that was to have comprised Cassirer’s unpublished fourth volume of *Philosophy of Symbolic Forms* (1996; Grüny 2024)[^grüny-2024].
    step1: |-
      PNK 是第一部以英语介绍卡西尔的书，它以此方式推广了朗格的符号体系理论，使卡西尔的思想重获活力。朗格早年即读过卡西尔（1926a: 36, 170），并在卡西尔 1941 年流亡美国后与其密切合作。可以说，她完成了本应构成卡西尔未刊第四卷《符号形式哲学》（1996; Grüny 2024）[^grüny-2024]的艺术分析。
    step2: |-
