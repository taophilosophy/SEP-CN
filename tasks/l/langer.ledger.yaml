      Preferring to be considered a “philosopher” rather than a “woman philosopher”, Langer belonged to the first generation of women allowed to vote throughout their adult lives and pursue academic careers in the United States. Her intellectual and artistic connections, pursued through her interest in studio art, children’s literature and democratic education, embed her in the history of feminism in the twentieth century; she worked with many women artists and influenced others (Bergonzo 2024)[^bergonzo-2024]. She joins the history of women interested in semiotics, language, philosophical analysis, logic and meaning from a wide-ranging point of view (Peijnenburg & Verhaegh [eds] 2022), commenting on many women philosophers and artists, including Lady Welby, Christine Ladd Franklin, Dorothy Wrinch, Susan Stebbing, Grace De Laguna, Mary Calkins, and Hannah Arendt, among many others.
    step1: |-
      朗格更愿意被视为“哲学家”而不是“女哲学家”；她属于第一代在美国成年后全程享有投票权、并能从事学术职业的女性。她通过工作室艺术、儿童文学与民主教育的兴趣所建立的思想与艺术联系，把她嵌入 20 世纪女性主义史；她与许多女性艺术家合作，并影响了其他人（Bergonzo 2024）[^bergonzo-2024]。她也被写入这样一部历史：一批以广阔视野关注符号学、语言、哲学分析、逻辑与意义的女性（Peijnenburg & Verhaegh [编] 2022）；她评述过许多女性哲学家与艺术家，包括韦尔比夫人（Lady Welby）、克里斯蒂娜·拉德-富兰克林（Christine Ladd Franklin）、多萝西·林奇（Dorothy Wrinch）、苏珊·斯特宾（Susan Stebbing）、格蕾丝·德拉古纳（Grace De Laguna）、玛丽·卡尔金斯（Mary Calkins）与汉娜·阿伦特，等等。
    step2: |-
      朗格宁愿被称作“哲学家”，而不是“女哲学家”。她属于第一代在美国终生享有投票权、并可从事学术职业的女性。她由工作室艺术、儿童文学与民主教育生发出的思想与艺术人脉，将她嵌入 20 世纪女性主义的历史；她与许多女性艺术家共事，也影响了另一些人（Bergonzo 2024）[^bergonzo-2024]。她同样进入了一部女性思想史——这些女性以开阔的视野关注符号学、语言、哲学分析、逻辑与意义（Peijnenburg & Verhaegh [编] 2022）；她评论过许多女性哲学家与艺术家，包括韦尔比夫人、克里斯蒂娜·拉德-富兰克林、多萝西·林奇、苏珊·斯特宾、格蕾丝·德拉古纳、玛丽·卡尔金斯与汉娜·阿伦特等。
