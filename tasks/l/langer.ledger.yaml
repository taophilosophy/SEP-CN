      Wittgenstein too extruded the arbitrary, the “inexpressible” and the “alogical” from his conception of logic in the *Tractatus*. Langer argues—anticipating later “resolute” readers—that Wittgenstein’s treatment of “meaning” is, while based on the uses of signs as symbols, expressively adequate, involving no “ineffable” realm of contents that are shown and not said (1926a: 19, 68, 72; Dengerink Chaplin 2020: 154)[^dengerink-2020]. But she argues that Wittgenstein took the nature of the *proposition* to be fundamental to logic, as she does not. Following the American algebraical tradition, she argues that “the universe of possible meanings *includes* [but is not exhausted by] the meaning of propositions”, i.e., the propositional interpretation of logic is only one among others (1926a: Preface; compare Quine 1934)[^quine-1934]. On her more comprehensive view there is no *general* “inexpressibility”, only unprojectability relative to particular configurations. This allows Langer an unbounded plurality of “meaningful” conceptions of reality, experience and relational structures (1926a: Preface, 2; 1926c: 437; Felappi 2024)[^felappi-2024], the encompassing of Wittgenstein had called “higher” meanings (1921: 6.42; Langer 1926a: 2). “A system of logic which is universal”, she writes, “[is one that] expresses disjunctively either the laws of mathematics, of structure, of literary art, of thought …, or of anything else whatever” (1926a: 26–27). Thus, like Wittgenstein, though differently, she widens the purview of ethical significance to include fairy tales, art, and imagery (1926a: 136; Thaventhiran 2024)[^thaventhiran-2024].
    step1: |-
      维特根斯坦同样把任意的、“不可表达的”与“非逻辑的”东西从他的《逻辑哲学论》逻辑概念中排除出去。朗格——预示了后来的“坚决”读解者——论证说，维特根斯坦对“意义”的处理虽以记号作为符号的用法为基础，却在表达上是充分的，不涉及任何被显示而未被言说的“不可言说”内容领域（1926a: 19, 68, 72; Dengerink Chaplin 2020: 154）[^dengerink-2020]。但她论证说，维特根斯坦把 *命题* 的本性视为逻辑的根本，而她不然。承美国代数传统，她论证说，“可能意义的宇宙 *包含* 命题的意义[但不为其所穷尽]”，即逻辑的命题解释只是众多解释之一（1926a: 序言；参 Quine 1934）[^quine-1934]。在她更全面的观点中，不存在 *普遍的*“不可表达性”，只有相对于特定构型而言的不可投射性。这使朗格可以主张实在、经验与关系结构的“有意义的”构想在数目上不受限制（1926a: 序言, 2; 1926c: 437; Felappi 2024）[^felappi-2024]——这种涵盖性即维特根斯坦所称的“更高”意义（1921: 6.42; Langer 1926a: 2）。她写道：“一个普遍的逻辑系统[是]以析取方式表达数学、结构、文学艺术、思想……或任何其他东西的规律的系统”（1926a: 26–27）。因此，与维特根斯坦一样——尽管方式不同——她扩大了伦理意义的范围，使之包括童话、艺术与意象（1926a: 136; Thaventhiran 2024）[^thaventhiran-2024]。
    step2: |-
      维特根斯坦同样从《逻辑哲学论》的逻辑概念中剔除了任意的、“不可表达的”与“非逻辑的”成分。朗格先于后来的“坚决”读解者指出：维特根斯坦对“意义”的处理虽基于记号作为符号的用法，却在表达上充分，不预设任何只被显示而不被言说的“不可言说”内容领域（1926a: 19, 68, 72; Dengerink Chaplin 2020: 154）[^dengerink-2020]。但她认为，维特根斯坦把 *命题* 的本性当作逻辑的根本，她则不然。承美国代数传统，她主张“可能意义的宇宙 *包含* 命题的意义[但并不为其穷尽]”，亦即逻辑的命题解释只是诸多解释之一（1926a: 序言；参 Quine 1934）[^quine-1934]。按其更周全的看法，并无 *普遍的*“不可表达性”，只有相对于特定构型的不可投射性。这使朗格得以主张实在、经验与关系结构的“有意义的”构想在数目上不受限制（1926a: 序言, 2; 1926c: 437; Felappi 2024）[^felappi-2024]；这种涵盖性正是维特根斯坦所称的“更高”意义（1921: 6.42; Langer 1926a: 2）。她写道：“一个普遍的逻辑系统[是]以析取方式表达数学、结构、文学艺术、思想……或任何其他事物之规律的系统”（1926a: 26–27）。于是，她与维特根斯坦殊途同归：把伦理意义的范围拓宽到童话、艺术与意象（1926a: 136; Thaventhiran 2024）[^thaventhiran-2024]。
