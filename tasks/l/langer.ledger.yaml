      MEHF was not nearly as influential as PNK. However, Langer anticipated subsequent turns in psychology and neurobiology that locate reason in an organism’s embodied affective and cognitive engagement with the world (Merleau Ponty 1945 [2012]; Johnson 1987; Damasio 1994, 2001; Windle 2024)[^damasio-1994][^johnson-1987][^windle-2024], treat thought as an essentially symbolic process (Deacon 1997; see Dengerink Chaplin 2020: 226 and Dryden 1997a, 2007)[^deacon-1997][^dengerink-2020][^dryden-1997a] and take the affordances of the environment seriously in examining perception (Gibson 1950, see MEHF II 54n)[^gibson-1950]. Her insistence on the centrality of projective metaphor and feeling to conceptual processes of thought was also pioneering (see Lakoff & Johnson 1980; Innis 2009: 12)[^innis-2009][^lakoff-1980], as was her biological approach to consciousness in her descriptions of the organization of higher-order organic forms (Dryden 2007)[^dryden-2007]. Though she claimed that only humans are truly “symbolic” in the full sense, she was fascinated by animal life forms of all kinds, and the evolution of life on earth as a whole, from bacteria to cats; recent discussions of her work and contemporary art show how symbolic forms from the animal world and environment are accommodated by her aesthetic theory (Gaikis 2021)[^gaikis-2021].
