      An artwork, being singular and non-discursive, offers “truth” that has no negation and no deductive consequences, only emotional significance: it is appreciated with one or another degree of insight or intuition, like Russell’s knowledge by acquaintance (PNK 263). It is not the representational “likeness” of a Paleolithic reindeer image on the walls of a cave on Dordogne that make it an artwork, but its expressive way of organizing the flow of unity in lines and surfaces on a wall symbolically, something that may also have had a spiritual or magic dimension, orienting by a force of abstraction a “physiognomic” stage of perception in which feeling and perceiving are not clearly differentiated (MEHF I 166ff, 1964a: 383; Dengerink Chaplin 2020: 117)[^dengerink-2020] .
