      Langer next introduced a “paradox” concerning the relation of form to content, emphasizing their ultimate inseparability for purposes of analysis (1926c). Recasting the more well-known logical paradoxes, she argues that there is neither an overarching totality of all forms nor just *one* form of an object or proposition, because each object and each proposition may be projected into many different systems, and a form always inheres in a system (1926c: 437; Felappi 2017, 2024)[^felappi-2017]. This pluralism, owing debts to James’s pragmatism, Russell and Wittgenstein’s conceptions of “form”, Sheffer’s theory of “notational relativity” and to C.I. Lewis’s conceptual pragmatism (Langer & Gadol 1950: 126), prefigures Carnap’s pluralistic “constructive” program in analytic philosophy (Verhaegh 2022: 221)[^verhaegh-2022][^verhaegh-2022-2].
    step1: |-
      朗格接着提出一个关于形式与内容之关系的“悖论”，强调就分析而言二者最终不可分离（1926c）。她重铸那些更著名的逻辑悖论，论证说：既不存在统摄一切形式的总体，也不存在对象或命题的 *唯一* 形式，因为每个对象、每个命题都可以被投射进许多不同的系统，而形式总是内在于某个系统（1926c: 437; Felappi 2017, 2024）[^felappi-2017]。这种多元论受惠于詹姆斯的实用主义、罗素与维特根斯坦的“形式”概念、谢弗的“记法相对性”理论以及 C.I. 刘易斯的概念实用主义（Langer & Gadol 1950: 126），预示了卡尔纳普在分析哲学中的多元“构造”纲领（Verhaegh 2022: 221）[^verhaegh-2022][^verhaegh-2022-2]。
    step2: |-
      朗格继而提出一个关于形式与内容之关系的“悖论”，强调分析上二者终不可分（1926c）。她重述那些更著名的逻辑悖论，主张：既无统摄一切形式的总体，也无对象或命题的 *单一* 形式；每个对象、每个命题皆可投射入许多不同系统，而形式总内在于某一系统（1926c: 437; Felappi 2017, 2024）[^felappi-2017]。这一多元论受惠于詹姆斯的实用主义、罗素与维特根斯坦的“形式”观、谢弗的“记法相对性”理论及 C.I. 刘易斯的概念实用主义（Langer & Gadol 1950: 126），并预示了卡尔纳普在分析哲学中的多元“构造”纲领（Verhaegh 2022: 221）[^verhaegh-2022][^verhaegh-2022-2]。
