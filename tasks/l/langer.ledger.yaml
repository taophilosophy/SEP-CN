      Langer read widely in the history of the destruction and forced migration of indigenous cultures in the United States. She knew Felix S. Cohen, a fellow student of Sheffer’s who became the most significant Native American Lawyer and anti-formalist legal theorist of his generation. Langer cites Cohen 1929 on the logic of questions (PNK 4) and published an article he wrote on field theory and judicial logic (Cohen 1950, cf. Henle, Kallen, & Langer [eds] 1951)[^cohen-1950]. In 1948 she attempted unsuccessfully to invite Einstein, E.B. White, and Oppenheimer to participate in a session of the APA meeting on World Society and World government, expressing shock at the lack of interest among professional American philosophers in shaping political and ethical concepts. In December 1953, she was named delegate to the National Council for UNESCO and the International Congress on History of Art by the American Philosophical Association; later in 1970 the Nixon administration published a Spanish translation of PNK without her permission and attempted to recruit her to serve on the American Security Council to defend the Vietnam war, but she declined, expressing disagreement with White House policies (Langer, Carton 1b, Harvard University Susanne K. Langer archives).
    step1: |-
      朗格广泛阅读美国原住民文化被毁灭与被迫迁徙的历史。她认识费利克斯·S·科恩（Felix S. Cohen）——谢弗的同学，后来成为他那一代最重要的美洲原住民律师与反形式主义法理论家。朗格援引 Cohen 1929 关于问题逻辑的论述（PNK 4），并发表了他关于场论与司法逻辑的文章（Cohen 1950，参 Henle, Kallen, & Langer [编] 1951）[^cohen-1950]。1948 年，她试图邀请爱因斯坦、E.B. 怀特与奥本海默参加美国哲学协会（APA）关于世界社会与世界政府的会议专场，未果；她对美国职业哲学家在塑造政治与伦理概念方面缺乏兴趣表示震惊。1953 年 12 月，她被美国哲学协会指定为联合国教科文组织全国委员会与国际艺术史大会的代表；后来在 1970 年，尼克松政府未经她许可出版了 PNK 的西班牙文译本，并试图招募她进入美国安全委员会为越战辩护，但她拒绝了，并表示不同意白宫政策（Langer, Carton 1b，哈佛大学苏珊·K·朗格档案）。
    step2: |-
      朗格广泛涉猎美国原住民文化遭毁灭与被迫迁徙的历史。她与费利克斯·S·科恩（Felix S. Cohen）相识——科恩是谢弗的同学，后成为其同代最重要的美洲原住民律师与反形式主义法理论家。朗格援引科恩 1929 年论问题逻辑之作（PNK 4），并刊发了他论场论与司法逻辑的文章（Cohen 1950，参 Henle, Kallen, & Langer [编] 1951）[^cohen-1950]。1948 年她试图邀请爱因斯坦、E.B. 怀特与奥本海默出席 APA 关于世界社会与世界政府的专场，未成；她对美国职业哲学家无意于塑造政治与伦理概念深感震惊。1953 年 12 月，美国哲学协会推举她为联合国教科文组织全国委员会及国际艺术史大会代表；1970 年，尼克松政府未经许可出版 PNK 西班牙文译本，并企图延揽她加入美国安全委员会为越战张目，她予以拒绝，并对白宫政策表示异议（Langer, Carton 1b，哈佛大学苏珊·K·朗格档案）。
