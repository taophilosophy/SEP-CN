      Because Langer’s distinctions between sign and symbol, discursive and non-discursive symbolization, and conventional and “formulative” aspects of symbols possess logical, psychological and evolutionary-historical dimensions, her terms cut across the usual notions of “symbol” “sign” “reference”, “denotation” and even “semantics”. For this she was criticized, often with the charge that because Wittgenstein’s “picture theory” had been outdated, her thought was too (Nagel 1943: 325–326; Beardsley 1958 [1981]; Wollheim 1955; compare Budd 1985: VI; Kivy 1989: 49, 61ff.; 2002: 30; see Langer 1957: 126)[^beardsley-1958][^budd-1985][^kivy-1989][^nagel-1943][^wollheim-1955]. Yet Langer’s different starting point—a higher-order modal account of picturing and form, a capacious view of “feeling”, an emphasis on processes, actions, and projective uses of signs and symbols—reflect a distinctive set of interests and ambitions (Dengerink Chaplin 2020: ch. 8; Verhaegh 2022: 231)[^dengerink-2020][^verhaegh-2022][^verhaegh-2022-2].
    step1: |-
      由于朗格对记号与符号、推论性与非推论性符号化、符号的约定性方面与“构形性”方面的区分兼具逻辑、心理与演化史的维度，她的术语横切通常的“符号”“记号”“指涉”“指称”甚至“语义学”概念。她因此受到批评，常见的指控是：既然维特根斯坦的“图像论”已经过时，她的思想也就过时了（Nagel 1943: 325–326; Beardsley 1958 [1981]; Wollheim 1955; 参 Budd 1985: VI; Kivy 1989: 49, 61ff.; 2002: 30; 见 Langer 1957: 126）[^beardsley-1958][^budd-1985][^kivy-1989][^nagel-1943][^wollheim-1955]。然而，朗格不同的出发点——对图像化与形式的高阶模态说明、对“情感”的宽宏看法，以及对过程、行动和记号与符号之投射用法的强调——反映出一组独特的问题意识与抱负（Dengerink Chaplin 2020: 第 8 章; Verhaegh 2022: 231）[^dengerink-2020][^verhaegh-2022][^verhaegh-2022-2]。
    step2: |-
      朗格对记号与符号、推论性与非推论性符号化、符号的约定性与“构形性”方面的区分，兼具逻辑、心理与演化史三重维度，故其术语横切通常的“符号”“记号”“指涉”“指称”乃至“语义学”概念。她因此招致批评，常见的指责是：维特根斯坦的“图像论”既已过时，她的思想自亦过时（Nagel 1943: 325–326; Beardsley 1958 [1981]; Wollheim 1955; 参 Budd 1985: VI; Kivy 1989: 49, 61ff.; 2002: 30; 见 Langer 1957: 126）[^beardsley-1958][^budd-1985][^kivy-1989][^nagel-1943][^wollheim-1955]。然而朗格另辟的起点——关于图像化与形式的高阶模态说明、对“情感”的宽宏理解，以及对过程、行动、记号与符号之投射用法的强调——体现了另一套独特的问题意识与抱负（Dengerink Chaplin 2020: 第 8 章; Verhaegh 2022: 231）[^dengerink-2020][^verhaegh-2022][^verhaegh-2022-2]。
