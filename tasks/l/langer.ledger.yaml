      Langer distinguishes materials and elements from virtual imagery (FF; Langer 1963b [2019]), thus sidestepping the later dispute between Gombrich (1960 [2001]), who claimed it to be impossible for a viewer to pay attention to a painting’s material character and its “depictive illusion” at the same time, and Wollheim (1987), who adduced the phenomenon of *seeing something in* the medium in response to Gombrich (Dengerink Chaplin 2020: 203f.)[^dengerink-2020]. In emphasizing the difference between art and language, Langer places strong emphasis on the concept of natural, organic form and “experience” of virtuality—unlike, for example, Goodman 1968 [1976]), who, focusing on notations and languages, further ramified Langer’s taxonomy of symbols but shifts away from the process of psychic development and process (Dengerink Chaplin 2020: 211ff.)[^dengerink-2020].
