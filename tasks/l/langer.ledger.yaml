      Following Karl Bühler, Langer emphasizes our sensitivity to specific occasions of utterance, the “empratic” uses of language (PNK 9, 136ff.; Innis 2009)[^innis-2009]. She also holds that the complex processes involved in symbolic formations “have to be supported by a vast intellectual structure in order to function”, as they mostly do, tacitly (PNK 283)—her emphasis on the role of the tacit in knowledge has been compared with and contrasted to Polanyi’s (Innis 1977, 2009, 2010; articles in Gulick [ed.] 2009–10; Dengerink Chaplin 2020: ch. 9, n. 229)[^dengerink-2020][^innis-1977]. While it is possible to fit what is implicit neatly into the frame of “our ultimate world-picture”, we ordinarily think *with* our symbolizations and do not have to think *about* them, for they are fused into the roots of perception. Prefiguring Austin, Langer also stresses the felt differences between dreams and artworks and perceptions in waking life. She also emphasizes the importance of conceptualization and the need for interpretation and translation in evaluating observational evidence, thus making the point—later emphasized by Kuhn, who read PNK (Kuhn 1962; Reisch 2019: 160; Basafa 2025)[^basafa-2025][^kuhn-1962][^reisch-2019]—that science is not a simple accumulation of facts. She notes that observation
