      Langer recognizes “great” traditions and genres, but does not focus on these alone, seeking to pare art away from the “madhouse” of modern life where too many people live in a ruinously jumbled, disorganized streams of “artworks”, excellent and trivial (FF 53). She has been criticized for not providing criteria by means of which to separate good from bad works of art (Wollheim 1955; Budd 1985; Kivy 1989; Greenberg 2000: 104)[^budd-1985][^greenberg-2000][^kivy-1989][^wollheim-1955], but she is more interested in the practice of articulation and the characterization of the “transparency” of art symbols than in developing a hierarchy (FF 60), more interested in helping the reader become attuned to good everyday visual and auditory forms (for example, well-shaped textile designs, household utensils, decorated pitchers, jars, nicely proportioned doors and windows and embroideries, radio vs. live music) than in documenting the “greatness” of culture—the latter a kind of rhetoric she deeply distrusts (FF 53). In refusing to rely on a *notion* of culture, by turning instead to *forms of life*, Langer not only echoes Wittgenstein’s use of that concept (Floyd 2016)[^floyd-2016], she also sets her conception of “symbolic form” apart from that of Panofsky, who took it to directly reflect a “culture” (Dengerink Chaplin 2020: 192ff.)[^dengerink-2020].
