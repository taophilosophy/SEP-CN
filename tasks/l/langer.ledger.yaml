      As Sheffer stressed, when relations are transformed or projected one must avoid entanglement in the “relativity” of particular elements and notations: “2” in the reals is not identical to “2” in the whole numbers, but a projected form (Sheffer 1921; Langer 1926a)[^sheffer-1921]. Every notation or language reflects certain idiosyncratic, accidental, and conventional choices. Like Frege, Sheffer, and the early Wittgenstein, Langer was adamantly opposed to linguistic formalism, psychologism, and conventionalism about logic and meaning: she endorsed a universal account of the applicability of logic and meaning. We face, as Sheffer (1926) wrote, the “logocentric predicament”: to give an account of logic, we must use it (Langer 1926a: 1, 20). Inspired by Frege’s proposal in his (1906 [1984]) debate with Hilbert over axiomatic theories of geometry, Sheffer developed higher-order logical analysis to transcend the limitations, ambiguities, and psychological vagaries of particular systems and pure formalism, formulating “superpostulates” of propositional functions (Sheffer 1921)[^sheffer-1921]. Langer supports this approach (1926a: 30; 1964b: 307). On this view logic extrudes every logically “ineffable” notion, all extra-logical experiences and acts, and all arbitrary, *ad hoc* devices, transcending purely conventional “human” features of the expression of thoughts, while universally encompassing “queer” and other differing “logics”, mental factors, and forms of expression (Sheffer 1908, 1909; Floyd 2021: §2.2.4)[^floyd-2021][^sheffer-1908].
    step1: |-
      正如谢弗所强调，当关系被转换或投射时，必须避免纠缠于特定元素与记法的“相对性”：实数中的“2”与整数中的“2”并不相同，而是被投射的形式（Sheffer 1921; Langer 1926a）[^sheffer-1921]。每一种记法或语言都反映某些独特的、偶然的与约定的选择。与弗雷格、谢弗和早期维特根斯坦一样，朗格坚决反对关于逻辑与意义的语言形式主义、心理主义与约定主义：她主张一种关于逻辑与意义之适用性的普遍说明。正如谢弗（1926）所写，我们面临“逻各斯中心困境”：要说明逻辑，我们必须使用逻辑（Langer 1926a: 1, 20）。受弗雷格在与希尔伯特关于几何公理化理论之争（1906 [1984]）中提议的启发，谢弗发展出高阶逻辑分析，以超越特定系统与纯粹形式主义的局限、歧义与心理上的飘忽，制定命题函项的“超公设”（superpostulates）（Sheffer 1921）[^sheffer-1921]。朗格支持这一进路（1926a: 30; 1964b: 307）。依此观点，逻辑排除一切逻辑上“不可言说”的概念、一切逻辑外的经验与行为，以及一切任意的、*权宜的* 设计，超越思想表达中纯粹约定性的“人类”特征，同时普遍地涵盖“古怪的”及其他不同的“逻辑”、心理因素与表达形式（Sheffer 1908, 1909; Floyd 2021: §2.2.4）[^floyd-2021][^sheffer-1908]。
    step2: |-
      谢弗曾强调，转换或投射关系时须避免陷入特定元素与记法的“相对性”：实数中的“2”与整数中的“2”并不等同，而是一个被投射的形式（Sheffer 1921; Langer 1926a）[^sheffer-1921]。任何记法或语言都反映某些独特、偶然且约定的选择。与弗雷格、谢弗及早期维特根斯坦一样，朗格坚决反对关于逻辑与意义的语言形式主义、心理主义与约定主义，主张对逻辑与意义的适用性作普遍说明。正如谢弗（1926）所言，我们面对“逻各斯中心困境”：要说明逻辑，就不能不用逻辑（Langer 1926a: 1, 20）。受弗雷格与希尔伯特关于几何公理化理论之争（1906 [1984]）中弗雷格主张的启发，谢弗发展高阶逻辑分析，以超越具体系统与纯粹形式主义的局限、歧义与心理无常，制定命题函项的“超公设”（Sheffer 1921）[^sheffer-1921]。朗格赞同此路（1926a: 30; 1964b: 307）。依此观点，逻辑排除一切逻辑上“不可言说”者、一切逻辑外的经验与行为，以及一切任意的、*权宜的* 手法，超越思想表达中纯属约定的“人类”特征，同时普遍涵盖“古怪的”及其他不同的“逻辑”、心理因素与表达形式（Sheffer 1908, 1909; Floyd 2021: §2.2.4）[^floyd-2021][^sheffer-1908]。
