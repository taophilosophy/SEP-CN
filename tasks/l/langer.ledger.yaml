      Langer’s interpretation of the *Tractatus* in her dissertation is pioneering. Inspired by Wittgenstein’s “picture” conception, she defines the “logical basis of meaning” as the *possibility* of drawing a “correspondence of configuration among systems”—a necessary, though not sufficient, purely “formal” condition (1926a: 2, 10). Langer does not hold that isomorphism is *sufficient* for meaning, as her later critics would allege (Nagel 1943; Beardsley 1958 [1981: 335ff.]; Kivy 1989: 49, 61–64)[^beardsley-1958][^kivy-1989][^nagel-1943]: she is not offering an analysis or Carnapian meaning-postulates. On her view logic concerns projectible relations of order and invariance among systems: forms rather than actual elements, and form is the *possibility* of structure (Tractatus 2.0333). Following Russell (1914), a form is not a constituent or a thing, but a (projectible) *way* in which constituents of a system or structure fit together (Langer 1926a: 36; 1926b; 1930b: 91–2; 1937a: 32–33; Felappi 2017, 2024)[^felappi-2017]. Langer extrapolates, as did Wittgenstein, to the idea that in philosophy we are concerned to see “*possibilities of interpretation*” rather than defend or demolish propositions (1930b: x).
    step1: |-
      朗格在博士论文中对《逻辑哲学论》的解读具有开创性。受维特根斯坦“图像”构想的启发，她把“意义的逻辑基础”定义为绘制“系统间构型的对应”的 *可能性*——一个必要的、但非充分的纯粹“形式”条件（1926a: 2, 10）。朗格并不主张同构对意义而言是 *充分的*，尽管她后来的批评者会如此指控（Nagel 1943; Beardsley 1958 [1981: 335ff.]; Kivy 1989: 49, 61–64）[^beardsley-1958][^kivy-1989][^nagel-1943]：她提供的并不是某种分析，也不是卡尔纳普式的意义公设。在她看来，逻辑关涉系统之间可投射的秩序与不变性关系：是形式而非实际元素；而形式是结构的 *可能性*（《逻辑哲学论》2.0333）。承罗素（1914），形式不是构成成分或物，而是系统或结构的构成成分得以拼合的（可投射的）*方式*（Langer 1926a: 36; 1926b; 1930b: 91–2; 1937a: 32–33; Felappi 2017, 2024）[^felappi-2017]。朗格与维特根斯坦一样推论说：在哲学中，我们关心的是看到“*解释的可能性*”，而不是捍卫或拆除命题（1930b: x）。
    step2: |-
      朗格博士论文对《逻辑哲学论》的解读具有开创意义。受维特根斯坦“图像”构想启发，她把“意义的逻辑基础”界定为绘制“诸系统间构型对应”的 *可能性*——一个必要而非充分的纯“形式”条件（1926a: 2, 10）。朗格并不认为同构对意义而言是 *充分* 的（后来的批评者却如此指责：Nagel 1943; Beardsley 1958 [1981: 335ff.]; Kivy 1989: 49, 61–64）[^beardsley-1958][^kivy-1989][^nagel-1943]：她给出的既非分析，也非卡尔纳普式的意义公设。在她看来，逻辑关涉系统之间可投射的秩序与不变性关系——是形式而非实际元素；而形式即结构的 *可能性*（《逻辑哲学论》2.0333）。承罗素（1914），形式不是构成成分或物，而是系统或结构之构成成分得以拼合的（可投射的）*方式*（Langer 1926a: 36; 1926b; 1930b: 91–2; 1937a: 32–33; Felappi 2017, 2024）[^felappi-2017]。朗格一如维特根斯坦，进而主张：哲学所关心的，是看到“*解释的可能性*”，而非捍卫或拆除命题（1930b: x）。
