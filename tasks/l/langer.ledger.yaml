      Susanne K. Langer (born Susanne Katherina Knauth, 1895–1985) was and remains a widely-read and influential American philosopher, best known for her analyses of language, mind, art and ritual in terms of her notion of *symbolic form*, derived primarily from her study of logic, music, and the philosophical ideas of Sheffer, the early Wittgenstein, Russell, Whitehead, and Cassirer. Studying in Vienna in 1921, during the 1920s and 30s Langer gave pioneering readings of Frege, Russell, Whitehead and the early Wittgenstein, embedding their work within an American context in logic and philosophy stemming from the pragmatism, semiotics and philosophy of mind of Royce, Peirce, James and Sheffer and the *Gestalt* theory of Köhler (Sheffer, who studied under Royce and James, articulated “neutral monism” as a pragmatic theory as well as post-*Principia* mathematical logic; see Sheffer 1908; Russell 1927: Chapter 1)[^russell-1927][^sheffer-1908]. She published one of the first introductions to “analytic philosophy” (1930b) and one of the first modern textbooks in symbolic logic in English (1937a). She then generalized her theory of meaning to music, language and culture in *Philosophy in a New Key* (Langer 1942 [1957], hereafter “PNK”), which, with the help of the New American Library’s Mentor mass market edition of 1948, sold over 600,000 copies, making it one of the best-selling English language philosophy texts of the twentieth century (Dryden 2003a,b; Isaac 2020; Windle 2024)[^dryden-2003a][^isaac-2020][^windle-2024]. The book helped broaden English speakers’ understanding of Cassirer’s work on symbolic forms, which Langer had already appealed to in her dissertation (1926a); she would later collaborate with Cassirer in New York and translate his *Language and Myth* (1946) into English.
    step1: |-
      苏珊·K·朗格（Susanne K. Langer，原名 Susanne Katherina Knauth，1895–1985）过去是、现在仍然是一位读者广泛、影响深远的美国哲学家；她最著名的成就是以 *符号形式* 概念对语言、心灵、艺术与仪式的分析，而这一概念主要源自她对逻辑、音乐的研究，以及谢弗（Sheffer）、早期维特根斯坦、罗素、怀特海与卡西尔的哲学思想。1921 年她在维也纳学习；1920 与 30 年代，朗格对弗雷格、罗素、怀特海与早期维特根斯坦作出开创性解读，把这些工作嵌入美国的逻辑与哲学语境——该语境源自罗伊斯（Royce）、皮尔士、詹姆斯与谢弗的实用主义、符号学与心灵哲学，以及柯勒（Köhler）的 *格式塔* 理论（谢弗曾师从罗伊斯与詹姆斯，既阐发了作为实用主义理论的“中立一元论”，也阐发了《数学原理》之后的数理逻辑；见 Sheffer 1908；Russell 1927: 第 1 章）[^russell-1927][^sheffer-1908]。她出版了最早的“分析哲学”导论之一（1930b），以及最早的英语现代符号逻辑教科书之一（1937a）。随后她在《哲学新钥》（*Philosophy in a New Key*，Langer 1942 [1957]，下称“PNK”）中把意义理论推广到音乐、语言与文化；借助新美国文库 1948 年 Mentor 大众市场版，该书销量逾 60 万册，成为 20 世纪最畅销的英语哲学文本之一（Dryden 2003a,b; Isaac 2020; Windle 2024）[^dryden-2003a][^isaac-2020][^windle-2024]。这本书帮助英语读者更深入地理解卡西尔关于符号形式的研究——朗格早在博士论文（1926a）中就已借助这一研究；后来她在纽约与卡西尔合作，并把他的《语言与神话》（1946）译成英文。
    step2: |-
      苏珊·K·朗格（Susanne K. Langer，原名 Susanne Katherina Knauth，1895–1985）生前身后都是一位广受欢迎、影响深远的美国哲学家，尤以 *符号形式* 概念对语言、心灵、艺术与仪式的分析著称；这一概念主要来自她对逻辑与音乐的研究，以及谢弗（Sheffer）、早期维特根斯坦、罗素、怀特海与卡西尔的思想。1921 年朗格在维也纳学习；1920、30 年代，她对弗雷格、罗素、怀特海与早期维特根斯坦作出开创性解读，把这些工作嵌入美国的逻辑与哲学传统——该传统源自罗伊斯（Royce）、皮尔士、詹姆斯与谢弗的实用主义、符号学与心灵哲学，以及柯勒（Köhler）的 *格式塔* 理论（谢弗出自罗伊斯与詹姆斯门下，既阐发过作为实用主义理论的“中立一元论”，也阐发过《数学原理》之后的数理逻辑；见 Sheffer 1908；Russell 1927: 第 1 章）[^russell-1927][^sheffer-1908]。她写有最早的“分析哲学”导论之一（1930b），以及最早的英语现代符号逻辑教科书之一（1937a）。其后在《哲学新钥》（*Philosophy in a New Key*，Langer 1942 [1957]，下称“PNK”）中，她把意义理论推广到音乐、语言与文化；该书借新美国文库 1948 年 Mentor 大众版之力售出逾 60 万册，跻身 20 世纪最畅销英语哲学文本之列（Dryden 2003a,b; Isaac 2020; Windle 2024）[^dryden-2003a][^isaac-2020][^windle-2024]。此书也拓展了英语读者对卡西尔符号形式学说的理解——朗格早在博士论文（1926a）中即已援引该学说；后来她又在纽约与卡西尔共事，并将其《语言与神话》（1946）译为英文。
