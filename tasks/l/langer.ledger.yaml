      Langer’s *An Introduction to Symbolic Logic* (1937a, still in print) was one of the first American textbooks in modern symbolic quantificational logic, offering a through treatment of the notions of logical form, relation, terms and degree, and difficulties of natural language and logical symbolism. She treats the idea of a truth-value and the differences between deductive, inductive and mixed systems of inference, the quantifiers, elementary class theory (including Shefferian postulate theories for it), and includes a chapter on the algebra of logic where she sets out the phenomenon of duality (e.g., any class formed with $+$ may also be expressed in terms of $\times$ and negation). She discusses Principia Mathematica’s use of the “material conditional” in light of “logistic” and mentions C.I. Lewis’s “strict implication” (Lewis 1918; Lewis & Langford 1932)[^lewis-1918][^lewis-1932]. Her textbook received positive reviews (Feigl 1938; Stebbing 1938)[^feigl-1938][^stebbing-1938] but, while very competent for the time, was not particularly mathematical. Carnap and Quine each expressed disappointment with it from this point of view, though it was clear that Langer was pushing in a very different direction.
    step1: |-
      朗格的《符号逻辑导论》（*An Introduction to Symbolic Logic*，1937a，至今仍在印行）是美国最早的现代符号量化逻辑教科书之一，详尽处理逻辑形式、关系、词项与度等概念，以及自然语言与逻辑符号体系的困难。她论述真值概念、演绎系统、归纳系统与混合推理系统之别、量词、初等类理论（包括为其建立的谢弗式公设理论），并有一章论逻辑代数，阐述对偶现象（例如，任何用 $+$ 构成的类也可以用 $\times$ 与否定来表达）。她结合“逻辑斯谛”讨论《数学原理》对“实质条件句”的使用，并提及 C.I. 刘易斯的“严格蕴涵”（Lewis 1918; Lewis & Langford 1932）[^lewis-1918][^lewis-1932]。她的教科书获得好评（Feigl 1938; Stebbing 1938）[^feigl-1938][^stebbing-1938]，但尽管在当时颇为胜任，却不算数学性很强。卡尔纳普与蒯因都曾就此点表示失望，不过朗格显然正朝一个非常不同的方向推进。
