      As a philosopher of logic, Langer never tried to produce a metaphysics, although, like Whitehead, she took metaphysics to be necessary, a “study of basic assumptions … in terms of which every element of our experience can be interpreted” (Langer & Gadol 1950; Langer 1951a, 1962b: 6–7, 1967; Dengerink Chaplin 2020: ch. 6)[^dengerink-2020]. Whitehead (1929) inspired her conception of “organic form” as processual (Langer 1924–27 [1997]; Dryden 1997b; Dengerink Chaplin 2020: ch. 6)[^dengerink-2020][^dryden-1997b]. Reacting to Frege, Russell and Wittgenstein she developed an account of facts as immediate, yet never ultimate in form (Langer 1926c, 1933). Critical assessments of Langer’s “ontology” have produced little agreement about her ultimate stance, though authors note her engagement with conceptions of mind and reality (Lachmann 1997, 2000; Auxier 1997, 2008; Felappi 2017, 2024)[^auxier-1997][^felappi-2017][^lachmann-1997], her anticipation of later “metaontological” themes (McDaniel 2017)[^mcdaniel-2017], (Dryden 1997a,b, 2001)[^dryden-1997a], and her conviction, later absorbed into systems biology and philosophy of mind, that consciousness is a substrate of human psychology, grounded in a feeling, thought, and emotion (Dryden 2007; Dengerink Chaplin 2020)[^dengerink-2020][^dryden-2007].
    step1: |-
      作为逻辑哲学家，朗格从未试图建立一种形而上学；不过与怀特海一样，她认为形而上学是必要的，是“对我们的经验中每一个元素都可以据以解释的基本预设……的研究”（Langer & Gadol 1950; Langer 1951a, 1962b: 6–7, 1967; Dengerink Chaplin 2020: 第 6 章）[^dengerink-2020]。怀特海（1929）启发了她把“有机形式”理解为过程性的构想（Langer 1924–27 [1997]; Dryden 1997b; Dengerink Chaplin 2020: 第 6 章）[^dengerink-2020][^dryden-1997b]。回应弗雷格、罗素与维特根斯坦，她发展出一种把事实视为直接给予、却在形式上永非终极的说明（Langer 1926c, 1933）。对朗格“本体论”的批评性评估，对其最终立场少有共识；不过论者注意到她与心灵概念和实在概念的交涉（Lachmann 1997, 2000; Auxier 1997, 2008; Felappi 2017, 2024）[^auxier-1997][^felappi-2017][^lachmann-1997]，她预示了后来的“元本体论”主题（McDaniel 2017）[^mcdaniel-2017]，（Dryden 1997a,b, 2001）[^dryden-1997a]，以及她的一个信念——后来为系统生物学与心灵哲学所吸收——即意识是人类心理学的基底，扎根于情感、思想与情绪（Dryden 2007; Dengerink Chaplin 2020）[^dengerink-2020][^dryden-2007]。
    step2: |-
      作为逻辑哲学家，朗格从未尝试构造一种形而上学；但同怀特海一样，她视形而上学为必需，是对“基本预设……的研究——我们经验中的每一个元素皆可据以获得解释”（Langer & Gadol 1950; Langer 1951a, 1962b: 6–7, 1967; Dengerink Chaplin 2020: 第 6 章）[^dengerink-2020]。怀特海（1929）启发她把“有机形式”视为过程性的构想（Langer 1924–27 [1997]; Dryden 1997b; Dengerink Chaplin 2020: 第 6 章）[^dengerink-2020][^dryden-1997b]。她回应弗雷格、罗素与维特根斯坦，发展出一种事实观：事实是直接给予的，但在形式上永非终极（Langer 1926c, 1933）。对朗格“本体论”的批判性评估，就其最终立场殊少共识；不过论者皆注意到：她与心灵与实在概念的交涉（Lachmann 1997, 2000; Auxier 1997, 2008; Felappi 2017, 2024）[^auxier-1997][^felappi-2017][^lachmann-1997]，她对后来“元本体论”主题的预示（McDaniel 2017）[^mcdaniel-2017]，（Dryden 1997a,b, 2001）[^dryden-1997a]，以及她的信念——意识是人类心理的基底，植根于情感、思想与情绪；这一信念后来为系统生物学与心灵哲学所吸收（Dryden 2007; Dengerink Chaplin 2020）[^dengerink-2020][^dryden-2007]。
