      音乐之所以有意义，不在某段乐句 *引起* 的情感、作曲家个人所表达的情感，也不在任何类语言的语法或音符词汇，而在情感的逻辑表达（构形、排序）。记号语言——高度发达的鼓语电报、聋人手语、象形文字——与音乐要素颇多类似，却有一尖锐差别：前者是推论性符号体系，音乐则非。例如西方传统中一个音体系诸要素并无固定情感指涉；它们表达的是“*语言无法陈说*”的形式，此等形式“不可转译”，与推论性形式不可通约（PNK 233）。朗格在 PNK 中主张，音乐源于日常言语的表达潜能：入耳之声“本质上富于表现性”，它们“不仅有联想价值，也有作为节奏与音程的价值，呈现紧张与松弛、行进、升降、运动、界限、休止”（PNK 243）。
