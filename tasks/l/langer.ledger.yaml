      In PNK chapter VIII Langer initiates her philosophy of art, beginning with music. Drawing on Schopenhauer and Hanslick, she sees feeling *and* form as central to what makes music music, taking this art to express virtual forms of feeling, motion, time, and patterns of sentient life (Kivy 1989: 43; 2002: 28f.)[^kivy-1989]. What music reflects is the *morphology* of feeling, and its forms are inexhaustibly rich (PNK 238f.). It is immediately sensuous and pleasurable, while also symbolizing and expressing, though not in the way that language does. This is why the numerous efforts to reduce music to a basis in our sensational or physiological reactions or descriptions of it fail (PNK 210ff.).
    step1: |-
      在 PNK 第八章，朗格开启其艺术哲学，从音乐开始。她汲取叔本华与汉斯立克，认为情感 *与* 形式同为使音乐成其为音乐的核心，并把音乐视为表达情感、运动、时间以及感受生命模式的虚拟形式（Kivy 1989: 43; 2002: 28f.）[^kivy-1989]。音乐所反映的是情感的 *形态学*，其形式丰富得不可穷尽（PNK 238f.）。音乐直接可感且令人愉悦，同时也进行符号化与表达，尽管方式不同于语言。这就是为什么把音乐化约为我们的感官或生理反应、或对之的描述的诸多努力都失败了（PNK 210ff.）。
    step2: |-
      朗格在 PNK 第八章开启艺术哲学，自音乐始。她采叔本华与汉斯立克之说，认情感 *与* 形式同为音乐之所以为音乐的根本，视音乐为情感、运动、时间及感受生命模式的虚拟形式之表达（Kivy 1989: 43; 2002: 28f.）[^kivy-1989]。音乐所映照者，是情感的 *形态学*，其形式丰饶无穷（PNK 238f.）。它直接可感、令人愉悦，同时又符号化并表达——尽管不同于语言的方式。正因如此，把音乐化约为感官反应、生理反应或对之的描述的种种努力，皆归失败（PNK 210ff.）。
