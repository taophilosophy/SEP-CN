      Langer adopts from Royce and Sheffer an algebraical view of logic as the most general study of all types of order or pattern, of which the propositional system is merely a special one (Langer 1924a: 42; 1926a: Preface; 1927: 123; 1951a: 179; Felappi 2024)[^felappi-2024]. On this view, “logical forms” are formulated through progressive generalization and abstraction on relations; properties are handled, not only first-order (e.g., in empirical statements) but also higher-order (within systems). As Langer knew, the *Tractatus* utilizes as its primitive logical operation Sheffer’s (1913) reduction of the truth-functional connectives to single “strokes” of joint and alternate denial, which demonstrates that they comprise a Boolean algebra (Pilch 2024)[^pilch-2024]. Such structures, as Langer also knew, may be codified in “postulate systems”—“postulate” being pragmatically preferred to “axiom” to avoid the connotation of “self-evidence” (Huntington 1911: 171f.; Langer 1937a: 184; 1938b: 49; Floyd 2021: 32)[^floyd-2021][^huntington-1911]. To take another example, logically the real and complex numbers differ concretely as systems, while sharing the “form” of an algebraical *field*. Langer’s emphasis is on transformations among of systems of relations. This is evinced in her “youthful” Shefferian axiomatization of the tonal structure of Western music (Langer 1929a; FF 105, n. 2). Whether her logico-mathematical inspiration makes her treatment of form too abstract is a matter of debate (Kivy 1989: 63)[^kivy-1989], but she undoubtedly worked toward making her ideas more concrete as her philosophy developed, and its second-order character must be borne in mind.
    step1: |-
      朗格从罗伊斯与谢弗处采纳一种代数式逻辑观：逻辑是对一切类型之秩序或模式的最普遍研究，命题系统只是其中一个特例（Langer 1924a: 42; 1926a: 序言; 1927: 123; 1951a: 179; Felappi 2024）[^felappi-2024]。依此观点，“逻辑形式”通过对关系不断进行推广与抽象而制定；性质不仅在（经验陈述中的）一阶层面得到处理，也在（系统内部的）高阶层面得到处理。朗格知道，《逻辑哲学论》以其初始逻辑运算采用了谢弗（1913）把真值函项联结词化约为“联合否定”与“择一否定”的单一“竖线”的做法，这表明它们构成一个布尔代数（Pilch 2024）[^pilch-2024]。朗格也知道，这类结构可以编入“公设系统”（postulate systems）——“公设”在实用上优于“公理”，以避免“自明性”的含意（Huntington 1911: 171f.; Langer 1937a: 184; 1938b: 49; Floyd 2021: 32）[^floyd-2021][^huntington-1911]。再举一例：在逻辑上，实数与复数作为系统具体不同，却共享代数 *域* 的“形式”。朗格强调的是关系系统之间的转换。这一点在她“青年时期”对西方音乐音调结构的谢弗式公理化中表现出来（Langer 1929a; FF 105, n. 2）。她的逻辑-数学灵感是否使她对形式的处理过于抽象，仍有争议（Kivy 1989: 63）[^kivy-1989]；但随着哲学的发展，她无疑努力使观念更具体，其二阶特征必须铭记在心。
    step2: |-
      朗格从罗伊斯与谢弗处采纳了一种代数式逻辑观：逻辑是对一切秩序或模式类型的最普遍研究，命题系统不过是其中一个特例（Langer 1924a: 42; 1926a: 序言; 1927: 123; 1951a: 179; Felappi 2024）[^felappi-2024]。依此观点，“逻辑形式”经由对关系的逐步推广与抽象而成；性质不只在（经验陈述的）一阶层面上处理，也在（系统内部的）高阶层面处理。朗格深知，《逻辑哲学论》以谢弗（1913）的运算为初始逻辑运算——把真值函项联结词化约为“联合否定”与“择一否定”的单一“竖线”，从而表明它们构成一个布尔代数（Pilch 2024）[^pilch-2024]。她也知道，此类结构可编入“公设系统”（postulate systems）——用“公设”而不用“公理”，是实用上的选择，以免“自明”之嫌（Huntington 1911: 171f.; Langer 1937a: 184; 1938b: 49; Floyd 2021: 32）[^floyd-2021][^huntington-1911]。再如：实数与复数作为系统在具体上不同，却共享代数 *域* 的“形式”。朗格着意于关系系统之间的转换，这在她“青年时期”对西方音乐音调结构的谢弗式公理化中可见一斑（Langer 1929a; FF 105, n. 2）。她的逻辑-数学灵感是否使形式处理过于抽象，尚可争论（Kivy 1989: 63）[^kivy-1989]；但随其哲学发展，她无疑力求观念更为具体，而其二阶品格始终须铭记。
