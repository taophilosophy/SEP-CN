    kind: body
    source: |-
      Langer argues that what are needed are “images” that inspire new ways of viewing organic phenomena in relation to their environments, and not the off-the-shelf use of pre-existing scientific “models” designed to show how systems work. Reiterating her theory in FF, she expands her theory of abstraction in art and science, with its account of primary and secondary illusions, representations, synesthesia and metaphor, into a theory of biologically-rooted “psychical experience”. This experience is ultimately based, she argues, on the idea of an *act*, by which she means an embodied organic event, typically with subunits and higher complexities of form, applicable to aspects of the animal as well as the human world. There are proto-acts and acts that are not instantiated in overt behavior; reflex acts, temperature regulation by behavior, repertoires and “act centers” in organs. The culmination of MEHF I is her theory of acts (Richter 2007)[^richter-2007].
