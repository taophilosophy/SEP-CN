      At the same time Langer emphasizes the “studio basis” of art (FF 14), as well as the importance of craft and technique in every art (these she does not conceive as “mechanical”, FF 387). Art uses perceptible materials: *pace* Croce and Collingwood, an artwork is a “concrete symbol” in Cassirer’s sense: the transition from forms to sensuous appearance is not a “mechanical affair”, and the inarticulable richness of an artwork is a function of its concrete sensuousness (FF 120; Guyer 2014: vol. III, 335ff.)[^guyer-2014]. Langer distinguishes the *materials* of an artwork (tones, canvas, paper, glass, paint, bronze, wood, inscriptions, words, vibrations, cave walls, an artist’s experiences and emotions, etc.) from the *elements* that the artist puts to use in it through a medium (loose brushwork, cool colors, tones, straight or curvilinear lines, contradictory images or thoughts). Materials may be absorbed into elements, as plain song takes up words (FF 152), or a poet takes up her own feelings and responses. Choice of materials may affect range of elements and set different problems, providing different ways to present different feelings (FF 85).
