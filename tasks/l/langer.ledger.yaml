      朗格的博士论文是美国首部全面梳理 19 世纪初至 1926 年逻辑史与意义理论（含现象学）的著作；其带注释书目是研究该时期不可或缺的指南。她聚焦弗雷格、胡塞尔、库蒂拉、罗素、怀特海、谢弗与维特根斯坦，兼及布尔、韦尔比夫人、皮尔士、库尔诺至斯托特、奥格登、理查兹等众多学者的意义理论，并对英语、美国、意大利、德国、法国与波兰文献作批判性分析。文中可见的影响既来自怀特海与谢弗，也来自其导师、意义现象学家 R.F.A. 霍尔恩勒（见 Hoernlé 1921）[^hoernlé-1921]，朗格 1926a 年博士论文曾提及此人）。其妻阿格尼丝·温妮弗雷德·霍尔恩勒（Agnes Winifred Hoernlé）亦为朗格所识，是南非社会人类学的奠基者。霍尔恩勒夫妇 1914–1920 年居波士顿，后成为种族隔离制度的主要自由派批评者，就种族、人类学与社会改革大量著述。霍尔恩勒后来对朗格的逻辑热情颇有微词（Hoernlé 1931）[^hoernlé-1931]，此文是对朗格首部著作 1930b 的书评）。
