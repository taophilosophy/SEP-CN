      Artworks afford us newfound sentience of organic and patterned forms of life through symbolization according to “primary” illusions that hold particular works, with their subsidiary forms and elements, together in different modes and allowing for interpenetration of different “secondary” modes of illusion drawn from the other arts: virtual movement, time and rhythm (music), virtual space (the plastic arts), virtual scenes and visible spaces (pictorial art), growth, virtual kinetic possibilities of volume (sculpture; see Gjesdal, Rush, & Torsen [eds] 2020), created space for an “ethnic” domain or “place” (architecture, see Guyer 2023)[^guyer-2023], the virtual realm of power, influence and agency as a center of vital force (dance, abstracting from gesture), the illusion of life’s happening (poetic arts), virtual life or illusory experience (poetry), virtual memory (poetry, drama, novels), virtual history in the mode of dramatic action (drama), Destiny and Fate as virtual life-arcs. In film, Langer argues, we have a “new art” that swallows up other forms omnivorously, remaking the primary illusion of virtual history in the dream mode: it is the sole art yet to appear unentangled from religion, as it emerged through the entertainment business (FF 121ff., 412; Langer 1947). Each of these modes of art may be made perceptible in myriad ways, and each abstracts differently; each art may absorb the virtuality of another (dance’s forms offer semblance in musical virtual time; poetry and literature abstract virtual events), and novel forms evolve in unlimited ways.
