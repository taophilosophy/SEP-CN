      In FF Langer downplays her earlier talk of “meaning” as isomorphism, which her critics had objected to. She nevertheless retains the idea of a second-order, morphological mirroring between the play of perceptible forms and forms of feeling (PNK 238), reworking Croce’s idea of art as expression in Cassirean terms: rather than copying nature, art creates and presents life’s forms. Art’s significance is its “vital import” (FF 32): its articulating the feeling of life by way of perceptible forms; it is a form of consciousness (Dryden 2004)[^dryden-2004]. To display and express this “aliveness” of forms, its primary and subsidiary forms must display something newly created, i.e., not merely an arrangement or configuration, but something that augments our “utmost conceptual power, imagination” with a sense of life (FF 40). Art expresses *virtual* objects, times, spaces, events and processes. Crucial to Langer’s treatment of art are her notions of “illusion”, “virtual” reality, the “liveliness” of forms, the processual nature of symbolization, and the “commanding form” (perhaps unconscious) of an artwork. These ideas have exerted an influence on recent theorists of virtuality (Chalmers 2022)[^chalmers-2022] and art as occurrence (Massumi 2011, 2015, 2024, 2025; FF 121)[^massumi-2011].
