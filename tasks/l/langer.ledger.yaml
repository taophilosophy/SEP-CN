      The daughter of upper middle-class German immigrants to the United States, Langer was raised bilingually in New York, reading Kant’s *Kritik der Reinen Vernunft* and Alcott’s *Little Women* in the originals at twelve and later becoming fluent in French and Italian (Sargeant 1960: 91f.; Dryden 2003a,b; Dengerink 2020: 15)[^dengerink-2020][^dryden-2003a][^sargeant-1960]. Poisoned by a poorly dosed cocaine prescription, she suffered ill health and did not enter Radcliffe, where she studied as an undergraduate (1916–1920), until the age of twenty-one (Dengerink 2020: 266, n. 8; Dryden 2003a,b)[^dengerink-2020][^dryden-2003a]. She began her study of logic and philosophy of science as an undergraduate with Sheffer, who remained a formative and lasting influence on her subsequent work; Langer is a primary source for understanding his philosophy in its Harvard context, an American tradition stemming from Royce, Peirce, and James through Lewis and Quine. Her use of logic as an inventive field for abstracting higher-order forms allowing for different “loci” of elements fleshes out Sheffer’s algebraical approach, commended by Russell in his introduction to the second edition of Principia Mathematica (1925; Sheffer 1926)[^sheffer-1926]. Langer took from Sheffer and Huntington the Kantian idea that logic is a canon, not an organon: it can only serve to prevent errors by offering novel concepts, not positive knowledge. The *use* of logic, she argues, “rests with … imagination” (Langer 1938b).
    step1: |-
      朗格是迁美德国中上层移民的女儿，在纽约双语环境中长大；十二岁时读康德《纯粹理性批判》与奥尔科特《小妇人》原著，后来通晓法语与意大利语（Sargeant 1960: 91f.; Dryden 2003a,b; Dengerink 2020: 15）[^dengerink-2020][^dryden-2003a][^sargeant-1960]。因剂量不当的可卡因处方中毒，她身体欠佳，直到二十一岁才进入拉德克利夫学院读本科（1916–1920）（Dengerink 2020: 266, n. 8; Dryden 2003a,b）[^dengerink-2020][^dryden-2003a]。她在本科阶段随谢弗学习逻辑与科学哲学；谢弗对她后来的工作始终是具有塑造力的持久影响。要理解谢弗在哈佛语境中的哲学——一条从罗伊斯、皮尔士、詹姆斯经刘易斯与蒯因而来的美国传统——朗格是首要的资料来源。她把逻辑用作抽象高阶形式的创造性领域，使元素可有不同的“位置”（loci），从而充实了谢弗的代数式进路；罗素在《数学原理》第二版导言中对此表示赞赏（1925; Sheffer 1926）[^sheffer-1926]。朗格从谢弗与亨廷顿那里接受了康德式观念：逻辑是 canon（规范），而非 organon（工具）；它只能通过提供新概念来防止错误，而不能提供肯定性知识。她论证说，逻辑的 *使用* “系于……想象”（Langer 1938b）。
    step2: |-
      作为迁居美国的德国中上层移民之女，朗格在纽约的双语环境中长大：十二岁即读康德《纯粹理性批判》与奥尔科特《小妇人》原著，后来法语、意大利语俱通（Sargeant 1960: 91f.; Dryden 2003a,b; Dengerink 2020: 15）[^dengerink-2020][^dryden-2003a][^sargeant-1960]。她曾因剂量失当的可卡因处方而中毒，健康受损，直到二十一岁才进入拉德克利夫学院读本科（1916–1920）（Dengerink 2020: 266, n. 8; Dryden 2003a,b）[^dengerink-2020][^dryden-2003a]。本科期间她随谢弗研习逻辑与科学哲学，谢弗对其日后的工作影响至深，且具塑造之功；要理解谢弗哲学在哈佛语境中的面貌——那条由罗伊斯、皮尔士、詹姆斯经刘易斯、蒯因而来的美国传统——朗格是首要文献。她把逻辑用作抽象高阶形式的创造场域，令元素可取不同“位置”（loci），由此充实了谢弗的代数式进路，罗素在《数学原理》第二版导言中对此称许有加（1925; Sheffer 1926）[^sheffer-1926]。朗格从谢弗与亨廷顿处接受了康德式的看法：逻辑是规范（canon），不是工具（organon）；它只能以新概念防错，不能提供肯定性知识。她认为，逻辑的 *使用* “系于……想象”（Langer 1938b）。
