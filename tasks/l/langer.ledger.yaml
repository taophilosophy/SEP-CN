      The expressiveness in the play of “presentational” appearances is not a matter of “make-believe”, escape or pretending (as in Gombrich 1963 [1985]; Walton 1990, 1992; FF 228)[^gombrich-1963][^walton-1990], but a way to disengage belief (FF 49) without appealing to fictional *thoughts*: “in [a] literal sense …[a representing] picture is an illusion”, and not a “copy” of visual impressions (FF 70). What the artist does is to compose an organic totality of relations among elements (e.g., sense qualities, which are “factors” in semblance (FF 84)) to produce another order of “quality” that is articulated concretely and felt as or seen *in* the artwork (devastation, warmth, sharpness). “Semblance” inheres in the organic totality of structuring and relations (forms) of sensory qualities.
