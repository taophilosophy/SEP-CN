      Langer’s *Feeling and Form, A Theory of Art Developed from Philosophy in a New Key* (1953, hereafter “FF”) invented the notion of “virtual reality”, generalizing Langer’s theory of music in PNK to all the arts. It made her one of the most influential American philosophers of art of her time. Insisting that feeling constitutes a basic strand in the evolution of human culture and thought, Langer influenced philosophers (e.g., her students Arthur Danto, Nelson Goodman, Howard Gardner, and Peter Kivy) and important critics and artists (e.g., Clement Greenberg, Eva Hesse, Walker Percy, and Elizabeth Bishop [Wehr 1993])[^wehr-1993]. Though she was undercited in the 1960s–1990s (Isaac 2020; Verhaegh 2022; Dengerink Chaplin 2020: ch. 3; Auxier 2024)[^auxier-2024][^dengerink-2020][^isaac-2020][^verhaegh-2022][^verhaegh-2022-2], Langer achieved lasting academic and cultural recognition in the philosophy of music and dance, and also during her lifetime as a public intellectual, writing on of philosophy of science, world politics, art, education, and social design, as well as linguistics, semiotics, the anthropology of art, biology, and psychology. Her notion of *symbolic form* is increasingly discussed today as questions about virtuality, symbolic form and politics rise to the fore of philosophy’s concern with new media, digital cultures, and political, phenomenological and economic aspects of algorithmic technology (Chalmers 2022; Massumi 2011, 2015, 2024)[^chalmers-2022][^massumi-2011].
    step1: |-
      朗格的 *《情感与形式：从〈哲学新钥〉发展出的艺术理论》*（1953，下称“FF”）发明了“虚拟现实”概念，把 PNK 中的音乐理论推广到一切艺术。这使她成为当时最有影响力的美国艺术哲学家之一。朗格坚持情感是人类文化与思想演化中的基本脉络，影响了哲学家（如她的学生阿瑟·丹托、纳尔逊·古德曼、霍华德·加德纳与彼得·基维）以及重要的批评家与艺术家（如克莱门特·格林伯格、伊娃·赫斯、沃克·珀西与伊丽莎白·毕肖普［Wehr 1993］）[^wehr-1993]。尽管在 1960–90 年代引用不足（Isaac 2020; Verhaegh 2022; Dengerink Chaplin 2020: 第 3 章; Auxier 2024）[^auxier-2024][^dengerink-2020][^isaac-2020][^verhaegh-2022][^verhaegh-2022-2]，朗格在音乐哲学与舞蹈哲学中获得了持久的学术与文化承认；她生前亦以公共知识分子身份写作，涉猎科学哲学、世界政治、艺术、教育与社会设计，以及语言学、符号学、艺术人类学、生物学与心理学。随着虚拟性、符号形式与政治等问题走向哲学关注新媒体、数字文化以及算法技术的政治、现象学与经济面向的前沿，她的 *符号形式* 概念在今天日益受到讨论（Chalmers 2022; Massumi 2011, 2015, 2024）[^chalmers-2022][^massumi-2011]。
    step2: |-
      朗格的 *《情感与形式：从〈哲学新钥〉发展而来的艺术理论》*（1953，下称“FF”）提出了“虚拟现实”概念，把 PNK 的音乐理论扩展至一切艺术，使她跻身当时最有影响的美国艺术哲学家之列。朗格主张情感是人类文化与思想演化的基本脉络，其影响及于哲学家（如其学生阿瑟·丹托、纳尔逊·古德曼、霍华德·加德纳与彼得·基维）和重要的批评家、艺术家（如克莱门特·格林伯格、伊娃·赫斯、沃克·珀西与伊丽莎白·毕肖普［Wehr 1993］）[^wehr-1993]。尽管 1960–90 年代引用不足（Isaac 2020; Verhaegh 2022; Dengerink Chaplin 2020: 第 3 章; Auxier 2024）[^auxier-2024][^dengerink-2020][^isaac-2020][^verhaegh-2022][^verhaegh-2022-2]，朗格在音乐哲学与舞蹈哲学中仍赢得了持久的学术与文化承认；生前作为公共知识分子，她还就科学哲学、世界政治、艺术、教育与社会设计，以及语言学、符号学、艺术人类学、生物学与心理学撰文。时下虚拟性、符号形式与政治诸问题正走向哲学关切新媒体、数字文化及算法技术之政治、现象学与经济面向的前沿，她的 *符号形式* 概念亦随之日益受到讨论（Chalmers 2022; Massumi 2011, 2015, 2024）[^chalmers-2022][^massumi-2011]。
