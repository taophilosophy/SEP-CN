      Langer argues that “meanings”, determined as “positions in a system”, underlie the possibility of expression by analogy, metaphor, and allegory (1926a: 88n, 136). She follows Wittgenstein and Frege in speaking of the need for metaphorical “elucidations” of the fundamental notions of logic (Wittgenstein 1921: 6.54; Langer 1926a: 16, 27, 140)[^wittgenstein-1921], while agreeing with Wittgenstein’s remark (1921: 4.015) that the possibility of all similes and imagery in our language depends upon logical form. For Langer the logic of picturing rests just as much upon the possibility of similes as the other way around. She then gestures toward a future analysis of art, invoking Gestalt theorist Köhler to argue that in ordering the play of feelings and perceptions we “make that correlation between elements of different systems known as ‘synthaesthesia’”, that “it is through the testimony of our feelings that we come to recognize the correspondence between two artistic compositions or between such a composition and a configurationtion of events” and that “this correspondence between ‘synaesthetic’ systems is the basis of meaning in art” (1926a: 166–7).
