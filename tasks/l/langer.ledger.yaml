      “Normally,” writes Langer, “semblance is not misleading; a thing is what it seems” (FF 49). But an art object (e.g., a vase or building) may come to arrest one’s sense (e.g., visual sense) so completely that many of its actual properties (weight, color) seem to fall away. She credits Schiller with the idea of semblance as a “liberation” of perception from practical purposes, allowing the mind to “dwell on the sheer appearances of things” (FF 49); this does not exclude that it may reform structures of agency, but it does so freely, without compulsion (compare Nguyen 2020 on games and art)[^nguyen-2020].
