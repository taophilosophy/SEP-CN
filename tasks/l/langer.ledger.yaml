      Langer appropriates Schiller’s idea of *Schein* (appearance, “semblance”, a term also used by Jung (FF 48)) as an inherent property of all art (Wilkinson 1955; Leddy 2024)[^leddy-2024][^wilkinson-1955]. *Schein* is also a critical norm, describing the *way* an illusion is created in a specific artwork to analyze to what degree and how successfully it expresses “aliveness”, and why (Wilkinson 1955: 221; compare Massumi 2011)[^massumi-2011][^wilkinson-1955]. Psychic “distance” and a sense of “presence” are essential to art: Langer points out that there is no need of *imitating* anything alive in order to convey the appearance of life (FF 312): artistically “nothing brings to mind life better” than the tense stillness of a tomb, or Van Gogh’s representation of a chair (FF 81, 98). Just as music expresses virtual temporal forms of duration and rhythm that are dynamic and not reducible to clock time or causally instantiated processes, a repeated decorative motif expresses virtual motion, making a surface *more visible* in its diversity (FF 61). Langer notes the universality of certain decorative forms among human cultures, hypothesizing—as an alternative to Malraux’s suggestion that a prehistoric unity of *culture* accounts for this (1947–1950, Vol. 2: 122f.)—that our capacity for perception of the feeling of life lies in an organizational capacity of the human visual field that comes to expression “so directly that it undergoes practically no distorting cultural influences, but brings forth a record of visual experience at its lowest terms” by projecting and transforming organic processes of feeling (FF 61).
