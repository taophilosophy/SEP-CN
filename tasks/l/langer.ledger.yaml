      For Langer, then, although the origins of language are a topic of great evolutionary importance (she discusses ethology of apes and other animals at length), symbolic activity is not always grammatical and discursive, and language is neither the only nor the primary means of articulation and expression. She takes the organic totality of qualities created, expressed and projected in art symbols to be “verbally ineffable”, i.e., ill-suited to propositional and linguistic articulation of its meaning in terms of fixed rules (FF 39). But she rejects the emotivism of Russell and the neo-positivists on the ground that their account of the “non-cognitive”—which emerges from their restriction of “meaningful” symbolic expression to discursive systems—reduces feeling and aesthetic experience to “blind” cries, emotional venting, poetic metaphysics, or strategic control. Emotivism invites mystical ideas about art, ethics and culture as “ineffable”, and although Langer agreed that there are non-propositional aspects of meaning in art, she did not take the inexpressible to offer a route to mysticism; she took this path to have been wrongly embraced in Bergson’s version of phenomenology (van der Tuin 2016)[^tuin-2016]. Though she studied Heidegger, Langer was not sympathetic to his philosophy, aware of its political associations and the debate with Cassirer at Davos (Card Catalog [Other Internet Resources]; Cavell 2022: 77)[^cavell-2022]. While she admits our capacity for “intuition”, the taking in of *Gestalten*, she insists that its forms are communicable and subject to criticism (PNK ch. IV; MEHF I 80), thus rejecting the attempt to unseat discursive thought as a fundamental dimension of mental life. Cognitive value and formations of feeling are intertwined.
    step1: |-
      因此，对朗格而言，尽管语言的起源是一个演化上极其重要的主题（她详尽讨论类人猿及其他动物的行为学），符号活动却并不总是语法的、推论性的；语言既不是表达与表现的唯一手段，也不是首要手段。她把艺术符号中所创造、表达与投射的性质之有机总体视为“言语上不可言说的”，即不适合以固定规则对其意义作命题性与语言性的表达（FF 39）。但她拒斥罗素与新实证主义者的情感主义，理由是：他们对“非认知”的说明——源于他们把“有意义的”符号表达限制在推论性系统内——把情感与审美经验化约为“盲目的”叫喊、情绪宣泄、诗性形而上学或策略性控制。情感主义招致关于艺术、伦理与文化“不可言说”的神秘观念；朗格虽同意艺术中意义有非命题性方面，却不认为不可表达者提供了通往神秘主义的途径；她认为柏格森式现象学错误地拥抱了这条路（van der Tuin 2016）[^tuin-2016]。朗格虽研究过海德格尔，却不同情其哲学，也意识到其政治联系以及达沃斯与卡西尔的辩论（卡片目录 [其他网络资源]; Cavell 2022: 77）[^cavell-2022]。她虽承认我们有“直觉”能力，即对 *格式塔* 的把握，却坚持其形式是可传达且可批评的（PNK 第 IV 章; MEHF I 80），从而拒绝把推论性思维逐出精神生活之基本维度的企图。认知价值与情感构形相互交织。
