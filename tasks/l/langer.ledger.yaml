      In this way, while denying that an artwork expresses the artist’s intentions and emotions directly, Langer allows that art may take up and rework elements of actual life, thus answering the charge that she takes no account of the artist’s intentions, or postulates a *deus ex machina* of “symbolific” human needs (Wollheim 1955)[^wollheim-1955], or ignores the importance of clock time to the nature of music (Alperson 2004, Guter & Guter 2021)[^alperson-2004][^guter-2021]. This leaves room for her to make sophisticated use of the ordinary notion of an “intention” or “point” of a technique, strategy, or material, as her notions of form and expression are organic: unlike, e.g., Beardsley, she does not rule the grammar of intention out as too psychologistic, but attempts instead to “logicize” or “grammaticalize” it as form, allowing for projective adjustments of means to expression in expressing forms with a material basis (compare Wimsatt & Beardsley 1946; Cavell 1969 [2002]: essays 7–8)[^cavell-1969][^wimsatt-1946]. She rejects Dewey’s appeal to a special aesthetic “attitude”: the discovery of “rightness and necessity” in sensuous forms of personal reactions to artworks does not require one to “dwell on one’s state of mind in the presence of a work”, but to reflect on transposability of forms (FF 34, 39; Gulick 2020: 16, 32n.)[^gulick-2020][^gulick-2020-2]. Still, there are many points of contact between Dewey’s treatment of experience as an organization of energies and forms with an “aura” around the edges and the semiotic parts of the pragmatist tradition emanating from Peirce (Innis 2022)[^innis-2022]: Langer seems to underplay these connections.
