      Langer never conceived of logic as a branch of psychology comprising the “laws of thought” (1926a: 16, n.); she argued instead that the “logical forms” of meaning should apply to mental categories. Her debts to William James (a teacher of Sheffer’s) were large (Dryden 2001)[^dryden-2001]. Her 1924a MA thesis is a critical study of von Hartmann’s dualistic *Philosophy of the Unconscious* (1882 [1884]; see von Hartmann 1877, Beiser 2014; Langer also studied his philosophy of art, including philosophy of music [von Hartmann 1886, 1887])[^beiser-2014][^hartmann-1877][^hartmann-1886]. Langer defends the “unconscious” as a tool of psychological explanation through a logical analysis of the distinction between “unconscious” and “conscious”. She traces von Hartmann’s differences from Schopenhauer’s “classical voluntarism” (Langer 1924a: 26) noting his importance for Freud, particularly in having emphasized the tendency we have to imbue matter with “force” dualistically—something contemporary physics has outgrown. Langer denies that materialism can render consciousness an epiphenomenon; she criticizes Freud for having collapsed what he called the “virtual” character of psychic elements into materialistic ones (1924a: 36). Instead, she elaborates James’s (1904) idea of a “psychology without the self”, or “neutral monism” (developed by Sheffer in his dissertation (1908)), emphasizing the relational, attentional and value-laden character of the distinction between mental and physical. Langer (1924a) takes “mind”, “experience”, “consciousness” and “matter” to be differentiated only relative to “systems” formulated in descriptions of particular modes of existence and relation: what is “neutral” is not, she argues, a monistic “stuff” (1924a: 17)—contrary to Russell (1921)—but instead an “abstract form” or field of relations encompassing a number of possible valuations or orderings of experience (Langer 1924a: 3, 15, 42).
    step1: |-
      朗格从不把逻辑视为包含“思维规律”的心理学分支（1926a: 16, n.）；她主张，意义的“逻辑形式”应当适用于心理范畴。她对威廉·詹姆斯（谢弗的老师）受惠甚多（Dryden 2001）[^dryden-2001]。她 1924a 年的硕士论文是对冯·哈特曼二元论《无意识哲学》的批判性研究（1882 [1884]；参 von Hartmann 1877、Beiser 2014；朗格还研习过他的艺术哲学，包括音乐哲学 [von Hartmann 1886, 1887]）[^beiser-2014][^hartmann-1877][^hartmann-1886]。朗格通过“无意识”与“意识”之区分的逻辑分析，为“无意识”作为心理学解释工具辩护。她追溯冯·哈特曼与叔本华“古典意志主义”的差异（Langer 1924a: 26），指出他对弗洛伊德的重要性，尤其在于他二元论地强调我们有把物质浸染“力”的倾向——当代物理学早已超越这一点。朗格否认唯物主义能把意识变成副现象；她批评弗洛伊德把他所谓的心理元素的“虚拟”性质塌缩为唯物论性质（1924a: 36）。相反，她阐发了詹姆斯（1904）“没有自我的心理学”或“中立一元论”（由谢弗在其博士论文（1908）中发展）的观念，强调心灵与物理之区分的关系性、注意性与价值负载性。朗格（1924a）认为“心灵”“经验”“意识”与“物质”只是相对于描述特定存在与关系模式时所制定的“系统”而分化：她论证说，“中立的”东西不是一种一元论的“料”（1924a: 17）——与罗素（1921）相反——而是一种“抽象形式”或关系场，容纳对经验的多种可能评价或排序（Langer 1924a: 3, 15, 42）。
    step2: |-
      朗格从未把逻辑当作包含“思维规律”的心理学分支（1926a: 16, n.）；她主张意义的“逻辑形式”应适用于心理范畴。她受惠于威廉·詹姆斯（谢弗的老师）甚多（Dryden 2001）[^dryden-2001]。其 1924a 年硕士论文是对冯·哈特曼二元论《无意识哲学》（1882 [1884]；参 von Hartmann 1877、Beiser 2014）的批判性研究；朗格还研习过他的艺术哲学，含音乐哲学（[von Hartmann 1886, 1887]）[^beiser-2014][^hartmann-1877][^hartmann-1886]。她通过“无意识”与“意识”之区分的逻辑分析，为“无意识”作为心理学解释工具作辩护。她梳理冯·哈特曼与叔本华“古典意志主义”的分歧（Langer 1924a: 26），指出其对弗洛伊德的重要性——尤其在于冯·哈特曼二元论式地强调人类倾向把物质浸染“力”，而当代物理学早已超越此点。朗格否认唯物主义能将意识降为副现象；她批评弗洛伊德把他所说的心理元素的“虚拟”性质塌缩为唯物论性质（1924a: 36）。她转而阐发詹姆斯（1904）“没有自我的心理学”——即“中立一元论”（谢弗在其博士论文（1908）中加以发展）——的观念，强调心灵与物理之区分的关系性、注意性与价值负载性。朗格（1924a）认为“心灵”“经验”“意识”与“物质”唯有相对于描述特定存在与关系模式时制定的“系统”方能分化：所谓“中立的”，她论证，并非一种一元论的“料”（1924a: 17）——这点与罗素（1921）相反——而是容纳经验之诸种可能评价或排序的“抽象形式”或关系场（Langer 1924a: 3, 15, 42）。
