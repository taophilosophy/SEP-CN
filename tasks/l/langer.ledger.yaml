      朗格论证说，被规定为“系统内位置”的“意义”，是类比、隐喻与讽喻之表达可能性的基础（1926a: 88n, 136）。她随维特根斯坦与弗雷格，谈到需要对逻辑的基本概念作隐喻性的“阐明”（Wittgenstein 1921: 6.54; Langer 1926a: 16, 27, 140）[^wittgenstein-1921]，同时同意维特根斯坦的评论（1921: 4.015）：我们语言中一切明喻与意象的可能性都依赖于逻辑形式。对朗格而言，图像化的逻辑同样取决于明喻的可能性，正如明喻的可能性取决于逻辑形式。她随后指向未来的艺术分析，援引格式塔理论家柯勒，论证说：在整理情感与知觉的活动时，我们“在不同系统的元素之间建立那种被称为‘通感’的关联”；“正是通过我们情感的见证，我们才认识到两部艺术作品之间、或这样一部作品与事件构型之间的对应”；“这种‘通感’系统之间的对应，是艺术中意义的基础”（1926a: 166–7）。
