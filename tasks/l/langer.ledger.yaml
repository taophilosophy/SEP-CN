      For Langer the distinctions between form and content, substance and accident, and mind and body do not mark fundamental categorial divisions but are logical or “formal” (Langer 1924a, 1926a, 1926c). Her hermeneutics of “meaning”, inspired by American pragmatism and semiotics (Colapietro 1998; Innis 2009)[^colapietro-1998][^innis-2009], is supported by her studies of modern logic. She shared Cassirer’s neo-Kantian aspiration “‘to compile a grammar of the symbolic function as such’ for language, art, mythology and religion” (Langer 1926a: 170, quoting Cassirer 1923–1927 Vol. 1:86)[^cassirer-1923][^cassirer-1923-2][^cassirer-1927] by stressing the importance—derived from Frege (1892a,b [1997], 1893/1903 [2013]), Whitehead and Russell (1910), and Sheffer (1921)—of generalizations in the theory of relations in modern logic that outstrip the older, static “substance/property” forms of Aristotelian logic (Langer 1926a: 36, 62, 55).
    step1: |-
      在朗格看来，形式与内容、实体与偶性、心灵与身体之间的区分并不标示根本的范畴划分，而是逻辑性的或“形式性的”（Langer 1924a, 1926a, 1926c）。她的“意义”解释学受美国实用主义与符号学启发（Colapietro 1998; Innis 2009）[^colapietro-1998][^innis-2009]，并由她关于现代逻辑的研究支撑。她分享卡西尔的新康德主义抱负——“为语言、艺术、神话与宗教‘编写符号功能本身的语法’”（Langer 1926a: 170，引 Cassirer 1923–1927 卷 1:86）[^cassirer-1923][^cassirer-1923-2][^cassirer-1927]——其方式是强调现代逻辑关系理论中种种推广的重要性；这些推广源自弗雷格（1892a,b [1997]，1893/1903 [2013]）、怀特海与罗素（1910）以及谢弗（1921），超越了亚里士多德逻辑较陈旧的、静态的“实体/属性”形式（Langer 1926a: 36, 62, 55）。
    step2: |-
      在朗格看来，形式与内容、实体与偶性、心灵与身体之别，并不标示根本的范畴划分，而只是逻辑上的或“形式上的”（Langer 1924a, 1926a, 1926c）。其“意义”解释学受美国实用主义与符号学启发（Colapietro 1998; Innis 2009）[^colapietro-1998][^innis-2009]，并以现代逻辑研究为支撑。她认同卡西尔的新康德主义抱负：为语言、艺术、神话与宗教“编写符号功能本身的语法”（Langer 1926a: 170，引 Cassirer 1923–1927 卷 1:86）[^cassirer-1923][^cassirer-1923-2][^cassirer-1927]；其着力点，是强调现代逻辑关系理论中诸种推广的重要性——这些推广源自弗雷格（1892a,b [1997]，1893/1903 [2013]）、怀特海与罗素（1910）及谢弗（1921），超越了亚里士多德逻辑陈旧的、静态的“实体/属性”形式（Langer 1926a: 36, 62, 55）。
