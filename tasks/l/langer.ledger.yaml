      The literature on Langer is codified in Lachmann (1993), a thorough (German) bibliography of primary and secondary literature on Langer to that point. This was extended in Schultz’s (2000) on Cassirer and in Dryden (2003a,b). Kösters (1993), the first German book on Langer, was followed by Lachmann (2000) and more recent studies by Richter and Bahr ([eds] 2008), Innis (2009), Dengerink Chaplin (2020) and Gaikis ([ed.] 2024); a subset of secondary sources are cited in what follows. Langer is frequently treated or reprinted in anthologies surveying philosophy of arts and aesthetics (e.g., Guter 2010; Guyer 2014; Carroll & Choi [eds] 2006)[^guter-2010][^guyer-2014], American aesthetics (Gulick & Slater [eds] 2020; Innis 2020b)[^innis-2020b], philosophy of music and dance (Budd 1985; Kivy 1989, 2002; Man 2020, 2024)[^budd-1985][^kivy-1989][^man-2020], and broad treatments of the history of American naturalism and pragmatism (Dryden 1997a, 2001; Innis 2007, 2009, 2016)[^dryden-1997a][^innis-2007].
    step1: |-
      关于朗格的文献编目于 Lachmann（1993）——一部截至当时关于朗格的一手与二手文献的详尽（德语）书目。Schultz（2000）关于卡西尔的书、以及 Dryden（2003a,b）对此有所扩展。Kösters（1993）是第一部关于朗格的德语著作；其后有 Lachmann（2000），以及 Richter 与 Bahr（[编] 2008）、Innis（2009）、Dengerink Chaplin（2020）与 Gaikis（[编] 2024）等较新研究；下文将引用其中一部分二手文献。朗格常被收入综述艺术哲学与美学的文集（如 Guter 2010; Guyer 2014; Carroll & Choi [编] 2006）[^guter-2010][^guyer-2014]，综述美国美学的文集（Gulick & Slater [编] 2020; Innis 2020b）[^innis-2020b]，音乐与舞蹈哲学的文集（Budd 1985; Kivy 1989, 2002; Man 2020, 2024）[^budd-1985][^kivy-1989][^man-2020]，以及关于美国自然主义与实用主义史的较宽泛论述（Dryden 1997a, 2001; Innis 2007, 2009, 2016）[^dryden-1997a][^innis-2007]，或被重新刊印。
