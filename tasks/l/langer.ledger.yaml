      *Feeling and Form* (FF, 1953) extends PNK’s treatment of music to a general theory of the arts. It was received as “the most complete system of aesthetics to be enunciated … since Croce” (Wilkinson 1955: 221)[^wilkinson-1955], bringing the issue of the relation of emotion to art front and center by offering the most detailed account in the first half of the twentieth century of an expression-cognitivist theory of art focused on feelings (Guyer 2014: vol. III, 365)[^guyer-2014].
