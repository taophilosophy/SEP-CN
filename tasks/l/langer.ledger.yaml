      Langer thus dispenses, as had Whitehead, with the idea of a raw, unfiltered, sense datum: experiences are complex structured relations. She regards the division between subject and object as “relative”, noting that in “protocol statements” language intervenes, displacing the line between the observer and the observed (MEHF I 37). The “meaning” a symbol expresses is thus relative to its context of use (Dengerink Chaplin 2020: 115)[^dengerink-2020]. This anticipates both Austin’s (1946) attack on sense data and Quine’s (1951) rejection of the first dogma of logical empiricism: that each sentence may be associated with a fixed range of sensory observation.
    step1: |-
      朗格因此与怀特海一样，抛弃了未经加工的、未经过滤的感觉材料观念：经验是复杂的结构化关系。她把主体与客体之分视为“相对的”，指出在“记录语句”中语言介入，移动了观察者与被观察者之间的界线（MEHF I 37）。一个符号所表达的“意义”因此相对于其使用语境（Dengerink Chaplin 2020: 115）[^dengerink-2020]。这预示了奥斯汀（1946）对感觉材料的攻击，以及蒯因（1951）对逻辑经验主义第一教条的拒斥：每个句子都可与某一固定范围的感官观察相关联。
