      Langer’s pluralism is supported by her *Tractatus*-inspired analysis of meaning. The field of all possible analogies cannot be captured in a single proposition (1926a: 48, 88n, 92), though particular metaphors may be correct or incorrect, tight or loose, in a given context (1926a: 112, 159). In Langer (1927) she argues that Russell’s (1906) struggles with negative facts and the notion of “assertion” in the “verb” of a proposition may be resolved by taking propositions to express “inter-structural relations” of “analogy” and “projection” among systems (Felappi 2017)[^felappi-2017]. Langer’s 1929b argues that skeptical doubt is an inevitable result of making a demand for absolute truth, which is in turn driven by the refusal to admit that necessity is always relative to a system: the key flaw in traditional metaphysics lies in the tendency to treat concepts as entities and to begin with broad concepts (“cause”, etc.) instead of with systems (a point made also in the *Tractatus*). In asking whether consciousness *exists* (1904), for example, James should instead have asked, “Can we talk coherently about *consciousness*?” (Langer 1929b: 383).
    step1: |-
      朗格的多元论得到她受《逻辑哲学论》启发的意义分析的支撑。一切可能类比构成的领域无法被单个命题捕获（1926a: 48, 88n, 92），尽管特定隐喻在给定语境中可以有对有错、或紧或松（1926a: 112, 159）。在 Langer（1927）中，她论证说，罗素（1906）在否定事实与命题“动词”中“断言”概念上的困扰，或可通过把命题视为表达系统之间“类比”与“投射”的“结构间关系”而得到化解（Felappi 2017）[^felappi-2017]。朗格 1929b 论证说，怀疑论式的怀疑是要求绝对真理的必然结果，而这一要求又源自拒绝承认必然性总是相对于某个系统：传统形而上学的关键缺陷，在于倾向把概念当作实体，并从宽泛概念（“原因”等）出发，而不是从系统出发（《逻辑哲学论》也提出过这一点）。例如，詹姆斯在追问意识是否 *存在*（1904）时，本应改问：“我们能否融贯地谈论 *意识*？”（Langer 1929b: 383）。
    step2: |-
      朗格的多元论以其受《逻辑哲学论》启发的意义分析为支撑。一切可能类比构成的领域无法收束于单个命题（1926a: 48, 88n, 92），尽管具体隐喻在特定语境中或对或错、或紧或松（1926a: 112, 159）。Langer（1927）主张，罗素（1906）在否定事实与命题“动词”之“断言”概念上的困局，或可借“命题表达诸系统间‘类比’与‘投射’的结构间关系”一说来化解（Felappi 2017）[^felappi-2017]。朗格 1929b 论证：怀疑论式的怀疑，是要求绝对真理的必然后果；而这一要求又出于拒不承认必然性始终相对于某一系统。传统形而上学的关键缺陷，正在于把概念当作实体、从宽泛概念（“原因”等）出发而不从系统出发（《逻辑哲学论》亦有此论）。例如詹姆斯追问意识是否 *存在*（1904），本当改问：“我们能否融贯地谈论 *意识*？”（Langer 1929b: 383）。
