      A multi-national effort led by Iris van der Tuin at the University of Utrecht has scanned and begun to digitally analyze the extensive card catalog collection from which Langer worked 1938–1985 (see the Other Internet Resources section below; for other manuscript materials see the website of the Susanne K. Langer Circle and Langer’s Papers, also in Other Internet Resources). The card catalog in particular opens new possibilities for the cartography of the history of philosophy in general, and twentieth century philosophy in particular (van der Tuin 2016, 2024)[^tuin-2016], for it consists of over 64,000 pages of cross-referenced quotations and commentary on 4,000+ references and 2,158 authors, including over 1,000 women (Lord 1968; van der Tuin 2024)[^lord-1968][^tuin-2024]. Langer responds to work of German-, French-, Italian- and English-speaking philosophers, anthropologists, historians, logicians, artists and biologists as these unfolded, commenting at length on a huge variety of anthropological, aesthetic, historical, philosophical, psychological, scientific, artistic and linguistic sources.
    step1: |-
      由乌得勒支大学 Iris van der Tuin 领衔的一项多国合作，已扫描朗格 1938–1985 年间据以工作的庞大卡片目录集，并开始对其进行数字化分析（见下文“其他网络资源”一节；其他手稿材料见苏珊·K·朗格圈（Susanne K. Langer Circle）网站与朗格文稿（Langer’s Papers），亦见“其他网络资源”）。卡片目录尤其为一般哲学史、特别是 20 世纪哲学的图谱绘制开辟了新可能（van der Tuin 2016, 2024）[^tuin-2016]：它包含逾 64,000 页交叉引用的引文与评注，涉及 4,000 余种参考文献与 2,158 位作者，其中包括 1,000 余位女性（Lord 1968; van der Tuin 2024）[^lord-1968][^tuin-2024]。随着德语、法语、意大利语与英语世界的哲学家、人类学家、历史学家、逻辑学家、艺术家与生物学家的工作逐步展开，朗格对这些工作作出回应，并就人类学、美学、历史、哲学、心理学、科学、艺术与语言学等方面的海量资料作了详尽评注。
    step2: |-
      一项由乌得勒支大学 Iris van der Tuin 主持的多国计划，已扫描朗格 1938–1985 年间依凭的庞大卡片目录，并开始作数字化分析（见下文“其他网络资源”；其他手稿材料见苏珊·K·朗格圈与朗格文稿网站，亦列于该节）。这套卡片目录尤为一般哲学史、特别是 20 世纪哲学的“地图绘制”开辟了新可能（van der Tuin 2016, 2024）[^tuin-2016]：它含逾 64,000 页交叉引用的引文与评注，涉及 4,000 余种文献、2,158 位作者，其中女性作者逾 1,000 位（Lord 1968; van der Tuin 2024）[^lord-1968][^tuin-2024]。随着德语、法语、意大利语与英语世界哲学家、人类学家、历史学家、逻辑学家、艺术家与生物学家的工作次第展开，朗格一一回应，并就人类学、美学、历史、哲学、心理学、科学、艺术与语言学诸领域的海量资料详加评注。
