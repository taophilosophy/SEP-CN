      Experience is always presented in *Gestalten*: “our merest sense-experience is a process of [symbolic] *formulation*” (PNK 89) and “*sense data are primarily symbols*” (PNK 21), i.e., events of symbolic projection and transformation in which we construe a world of things and occasions out of the “pandemonium” of impressions (PNK 98). Following Whitehead Langer construes perception as action and event, a phase-transition in space-time, arguing that “every experience is an interpretation, a formalization” in which we apprehend actual events in terms of particular “forms”, but never “*the*” form, so that “what we can experience is a *perspective*, a ‘*Gestaltung*’” (1933: 183). What appear to us as “typical” associative signs of things at the level of animal habit are transformed into symbols through projections of thought and feeling. In the “fabric” of meanings in which we live, seeing is symbolically and ambiguously charged (PNK 280). As in the American tradition of James (1902) and Dewey (1934), “experience” for Langer encompasses the wide variety of “symbolific” phenomena that occur in everyday life: differing modes of feeling, perception, emotion and thought unfold over time in accordance with a variety of categories and forms of selective attention, feeling, interest, and engagement (Dryden 2001; Innis 2009)[^dryden-2001][^innis-2009].
    step1: |-
      经验总是以 *格式塔* 的形式呈现：“我们最单纯的感觉经验也是一个[符号性] *构形* 过程”（PNK 89），且“*感觉材料首先是符号*”（PNK 21），即符号投射与转换的事件，我们从中把印象的“群魔乱舞”构造成事物与场合的世界（PNK 98）。承怀特海，朗格把知觉理解为行动与事件，一种时空中的相变，论证说“每一次经验都是一种解释、一种形式化”，我们以特定“形式”把握实际事件，但从不把握“*那个*”唯一形式，因此“我们所能经验到的是一种 *视角*，一种‘*完形*’”（1933: 183）。在动物习惯层面上显得是事物的“典型”联想记号者，通过思想与情感的投射而被转换为符号。在我们生活于其中的意义“织体”里，看总是被符号性地、含混地贯注（PNK 280）。如同詹姆斯（1902）与杜威（1934）的美国传统，朗格的“经验”涵盖日常生活中形形色色的“符号制造”现象：情感、知觉、情绪与思想的不同模式随时间展开，依循种种范畴与选择性注意、情感、兴趣与投入的形式（Dryden 2001; Innis 2009）[^dryden-2001][^innis-2009]。
