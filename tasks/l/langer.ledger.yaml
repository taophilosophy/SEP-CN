      Langer’s philosophy of music has remained the most continuously discussed part of her theory (Budd 1985; Kivy 1989, 2002; Alperson 2022)[^alperson-2022][^budd-1985][^kivy-1989], along with her philosophy of dance (Langer 1976; Man 2020, 2024)[^man-2020], though she embedded herself quite generally in the history and philosophy of art and aesthetics in the United States (Innis 2009, Gulick & Slater [eds] 2020)[^innis-2009]. She influenced her student Danto (1984, 1988; Auxier & Hahn [eds] 2013; Auxier 2013)[^auxier-2013][^auxier-2013-2], Goodman (1968 [1976: xii]) and Gardner (2023), as well as artists, critics, and writers of renown, including Eva Hesse (Hesse 2016: 175, 339; Rahtz 2021)[^hesse-2016][^rahtz-2021], Fay Lanswer, Asger Jorn, Walker Percy, Paul Hindemith, and Clement Greenberg (Dengerink Chaplin 2020: 18ff.)[^dengerink-2020]. Although Greenberg agreed with her emphasis on non-propositional, “ineffable” aspects of art, as well as its offering affordances to the imagination, he criticized Langer for not making the critic’s “taste” primary, thereby parting from her emphasis on the “studio basis” of artworks (2000: 25, 104). She knew poets Elizabeth Bishop and Richard Selig, painters such as Guy Anderson, Mark Tobey and Morris Graves, and musician Eva Heinitz (Wehr 1993, 2004)[^wehr-1993]. Her writings include thousands of perceptive remarks on particular works of art and philosophical criticism. She discusses art within many different traditions, genres, and lines of approach in Western and non-Western art, surveying a vast amount of critical and philosophical material in English, French, German and Italian. Her work on “symbolism” has been sublimated and appropriated in a variety of ways within, e.g., the theory of architecture, from Marxist semioticians to cultural conservatives, showing how important careful reflection on theories of symbolism is (Martin 2025)[^martin-2025]. The multi-dimensional nature of her criticism and responses to theories of art up to her own time is only beginning to be systematically studied for its place in the context of the mid-twentieth century philosophy and art (van der Tuin 2024)[^tuin-2024].
