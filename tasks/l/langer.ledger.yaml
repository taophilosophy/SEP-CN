      Langer frequently wrote as a public intellectual, convinced that philosophy should speak to broad issues of public concern. “Art,” she wrote, “is … the spearhead of human development, social and individual” (1966: 5) for it expresses freedom; “any miscarriage of the symbolic process is an abrogation of our human freedom” (PNK 290; Dengerink Chaplin 2020: 91)[^dengerink-2020]. Her first publication concerned the impact of deportation and immigration (1922), and she wrote on human-caused environmental degradation, the rapidity of the cultural, political and emotional transformations wrought by modern science and the globalization of economies, nationalism as a destructive symbolic “idol” (1944), the relation between philosophy and education (1956), the difference between “civilization” and “culture” (1962b), and the significance of modern industrial and popular design (1965) [1966], among other topics. During the McCarthy era she defended the need for protections of individual freedom against the demands of militarized industrial democracies and argued for the importance of strengthening the United Nations to sustain world peace (1951c); she even proposed, in a Neurathian spirit of isotypes, that a spiral would be a better symbol of that institution than the projected map of the globe (1949b).
    step1: |-
      朗格常以公共知识分子身份写作，她坚信哲学应当回应公众关切的广泛议题。她写道，“艺术……是人类发展——社会的与个体的——的先锋”（1966: 5），因为艺术表达自由；“符号过程中的任何失误，都是对我们人类自由的褫夺”（PNK 290; Dengerink Chaplin 2020: 91）[^dengerink-2020]。她的第一篇出版物讨论驱逐出境与移民的影响（1922）；她还就人为的环境退化、现代科学与经济全球化所带来的文化、政治与情感转变之迅猛、作为破坏性符号“偶像”的民族主义（1944）、哲学与教育的关系（1956）、“文明”与“文化”之别（1962b），以及现代工业设计与大众设计的意义（1965）[1966] 等题目写作。麦卡锡时代，她捍卫个人自由需要保护、以对抗军事化工业民主国家之要求的立场，并论证加强联合国以维持世界和平的重要性（1951c）；她甚至在纽拉特式同构型（isotypes）的精神下提议，螺旋形比投影式地球地图更适合作为该机构的象征（1949b）。
    step2: |-
      朗格常以公共知识分子身份撰文，深信哲学应回应公众关切的广泛议题。“艺术，”她写道，“是人类发展——无论社会还是个体——的先锋”（1966: 5），因为艺术表达自由；“符号过程中的任何失误，都是对我们人类自由的褫夺”（PNK 290; Dengerink Chaplin 2020: 91）[^dengerink-2020]。她的首篇出版物讨论驱逐与移民的影响（1922）；此后她论及人为的环境退化，现代科学与经济全球化所引起的文化、政治与情感变迁之迅猛，作为破坏性符号“偶像”的民族主义（1944），哲学与教育的关系（1956），“文明”与“文化”的分野（1962b），以及现代工业与大众设计的意义（1965 [1966]）等。麦卡锡时代，她主张必须保护个人自由，以抵御军事化工业民主国家的要求，并论证强化联合国以维系世界和平之必要（1951c）；她甚至在纽拉特式同构符号（isotypes）的精神下提议：螺旋形比投影式地球地图更适合充任该机构的象征（1949b）。
