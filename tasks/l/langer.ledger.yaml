      朗格的思想可分为三个主要时期。1924–1939 年，她治逻辑、科学哲学、早期分析哲学与 *格式塔* 心理学：在博士论文（1926a）中首创性地解释弗雷格、胡塞尔、怀特海、罗素与维特根斯坦《逻辑哲学论》，将维也纳学派观念引入美国，并撰有大量论文与三部书——儿童童话集（1923）、新“分析”哲学导论（1930b）与美国最早的现代符号逻辑教科书之一（1937a）。1940–60 年代，她出版 PNK，与卡西尔合作，发展出影响深远的艺术理论，并参与艺术之文化重要性的公共讨论（FF, 1957, 1958, 1962b）。最终，她对生物学、神经学、动物行为学与演化人类学中生命与情感形式的自然主义处理，汇为 MEHF 中关于心智的非还原论说明。终其一生，朗格还以公共知识分子身份就移民、流离失所、政治、战争、威权主义、世界政府与民主教育撰文（1922, 1930a, 1945b, 1949b, 1951c, 1962b, 1965 [1966], 1966）。
