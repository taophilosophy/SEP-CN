      Langer’s philosophy of music is the platform from which her theory of the (differing) modes of art flows. She holds that the purpose of all “musical labor”, whether in thought or in physical activity, “is to create and develop the illusion of flowing time in its passage, an audible passage filled with motion that is just as illusory as the time it is measuring” (FF 120). She thus follows Schopenhauer’s idea that music is an iconic symbol of the emotions, which raises questions about whether particular emotions *can* be heard in music (Kivy 2002: 28ff.)[^kivy-2002]. But it is the play and seriality of formation of emotions that matters to Langer. The essence of all music, whether good or bad, is the creation of virtual time, determined by the movement of audible forms (FF 125). A musical work grows from an imagination of general movement to its complete, physical presentation or occurrence, governed by a basic form from which it is developed, a *commanding* form, as Flaubert called it, a kind of germ or “Idea” of the work (FF 122). This form, analogous to a living organism’s maintenance of its identity through time, dictates choices as the piece is composed, but also serves as a fecund symbol. Its aspects may be greatly various; what matters is the *way* of they unfold in a particular piece of music (FF 126).
