    kind: body
    source: |-
      In broaching the notion of “virtual reality”, Langer developed notions of *illusion*, *semblance*, and *virtuality* in her FF that have proved influential in philosophy of culture and philosophy of mind (Massumi 2011; Lanier 2017; Chalmers 2022; Leddy 2024)[^chalmers-2022][^lanier-2017][^leddy-2024][^massumi-2011]. Chalmers (2022) takes Langer’s notions to preclude an experience of “reality” in virtual space by construing her “semblances” as “hallucinations”. Given Langer’s dual-dimensional conception of symbolic form, her pluralistic notion of “facts”, her conception of science, and the fundamentality of her conception of feeling to “presence” and “psychic distance”, it is unclear how far Chalmers is correct: philosophically Langer was stimulated less by questions of skepticism than by the challenge of framing a naturalistic account of mental activity, consciousness and unconsciousness (Langer 1924a; 1929; MEHF I, II, III) and explaining the role of imagination in specific arts (Leddy 2024; Man 2024)[^leddy-2024][^man-2024]. Moreover she insisted, as theorists of video games do, that our sense of agency spans the virtual and the real. Her notion of “form” was intended to secure the public, shareable aspects of thought and experience in the sciences and the arts while lifting cognitive and aesthetic response above the practical levels of purpose and play (PNK ch. VI).
    step1: |-
      朗格在提出“虚拟现实”概念时，在 FF 中发展了 *幻象*、*外观* 与 *虚拟性* 等概念；这些概念已在文化哲学与心灵哲学中证明富有影响（Massumi 2011; Lanier 2017; Chalmers 2022; Leddy 2024）[^chalmers-2022][^lanier-2017][^leddy-2024][^massumi-2011]。查尔默斯（2022）把朗格的“外观”理解为“幻觉”，据此认为她的概念排除了在虚拟空间中经验“实在”的可能。考虑到朗格关于符号形式的双维构想、她多元主义的“事实”概念、她的科学观，以及她的情感概念对“在场”与“心理距离”的根本性，查尔默斯在多大程度上正确并不清楚：从哲学上说，激发朗格的，与其说是怀疑论问题，不如说是如何构建对心理活动、意识与无意识的自然主义说明（Langer 1924a; 1929; MEHF I, II, III），并解释想象在特定艺术中的作用（Leddy 2024; Man 2024）[^leddy-2024][^man-2024]。此外，她像电子游戏理论家一样坚持：我们的能动感横跨虚拟与实在。她的“形式”概念意在确保科学与艺术中思想与经验的公共、可共享面向，同时把认知与审美反应提升到实用层面的目的与游戏之上（PNK 第 VI 章）。
    step2: |-
      朗格在提出“虚拟现实”时，于 FF 中发展出 *幻象*、*外观* 与 *虚拟性* 诸概念，这些概念在文化哲学与心灵哲学中已证明富有影响（Massumi 2011; Lanier 2017; Chalmers 2022; Leddy 2024）[^chalmers-2022][^lanier-2017][^leddy-2024][^massumi-2011]。查尔默斯（2022）将朗格的“外观”读作“幻觉”，因而认为她的概念不容有虚拟空间中的“实在”经验。然而，鉴于朗格符号形式的双维构想、其多元主义的“事实”观、其科学观，以及情感概念对“在场”与“心理距离”的根本地位，查尔默斯究竟在多大程度上正确，尚难断言：哲学上激发朗格的，与其说是怀疑论问题，不如说是如何构建关于心理活动、意识与无意识的自然主义说明（Langer 1924a; 1929; MEHF I, II, III），并解释想象在具体艺术中的作用（Leddy 2024; Man 2024）[^leddy-2024][^man-2024]。她还像电子游戏理论家那样坚持：我们的能动感横跨虚拟与实在。其“形式”概念意在确保科学与艺术中思想与经验的公共、可共享面向，同时把认知与审美反应提升到实用层面的目的与游戏之上（PNK 第 VI 章）。
