      使音乐有意义的，不是某段乐句 *引起* 或作曲家个人表达的情感，也不是任何类似语言的语法或音符及其他元素的词汇，而是情感的（逻辑）表达（构形、排序）。记号语言——如高度发达的鼓语电报、聋人手语与象形文字——与音乐元素之间有类似之处，但有一尖锐差异：前者是推论性符号体系，音乐则不是。例如，西方传统中一个音符系统的元素并不具有任何固定的情感指涉；相反，它们表达“*语言无法陈说*”的形式：这些形式“不可转译”，或与推论性形式不可通约（PNK 233）。朗格在 PNK 中论证，音乐源于日常言语的表达潜能，因为这些入耳之声“本质上是表现性的”：它们“不仅有联想价值，而且有作为节奏与音程的价值，呈现紧张与释放、行进、升与降、运动、界限、静止”（PNK 243）。
