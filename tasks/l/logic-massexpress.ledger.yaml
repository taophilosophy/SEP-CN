      **Remark 3:** However, defining negation in terms of Boolean complement or non-overlap doesn’t work with all predicates. Consider the adjective *cheap*. Fix the context of speech so that what counts as cheap is specified and what counts as not cheap is also specified. The pieces of furniture *a* and *b* may each count as cheap, while together they (*a*∨*b*) count as not cheap. So non-overlap isn’t satisfied here: something not cheap overlaps with something cheap. *Cheap* is a vague predicate. But the same phenomenon is observed with an exact predicate like *costs fifty euros*: *a* and *b* may each cost fifty euros, while together they don’t, costing ninety euros, for instance. So non-overlap should not be required. In general, [*not P*] cannot be defined in terms of [*P*]. Instead, it seems that [*P*] and [*not P*] should be separately specified. (This is done in many approaches to vagueness.)
    step1: |-
      **评论 3：** 然而用布尔补或不交叠来定义否定，并非对所有谓词都行。考虑形容词 *cheap*。把言语语境固定下来，使何谓便宜、何谓不便宜都有规定。家具件 *a* 与 *b* 可能各自算便宜，合起来（*a*∨*b*）却算不便宜。这不交叠就失效了：不便宜的东西与便宜的东西交叠。*Cheap* 是模糊谓词。但对 *costs fifty euros* 这类精确谓词也观察到同样现象：*a* 与 *b* 可能各自值五十欧元，合起来却不值，例如共值九十欧元。所以不应要求不交叠。一般地，[*not P*] 不能由 [*P*] 定义；看来 [*P*] 与 [*not P*] 应分别规定。（模糊性研究中许多进路正是这么做的。）
    step2: |-
      **评论 3：** 可用布尔补或不交叠定义否定，并非对所有谓词都灵。看 *cheap*：把语境固定，何谓便宜、何谓不便宜都有规定。家具件 *a*、*b* 可能各自便宜，合起来（*a*∨*b*）却不便宜；不交叠就破了——不便宜的东西与便宜的东西交叠。*Cheap* 是模糊谓词，可 *costs fifty euros* 这类精确谓词也有同样现象：*a*、*b* 各自值五十欧元，合起来共值九十欧元便不值。所以不交叠不可强求。一般地，[*not P*] 不能由 [*P*] 定义；看来 [*P*] 与 [*not P*] 得分别规定。（模糊性研究的许多进路正是如此。）
