      [^note-7]: An extensional approach doesn’t distinguish between coextensive predicates. For this reason, Montague uses an intensional framework. However, this worry about coextensivity is orthogonal to the main questions concerning mass nouns, so we ignore it in this entry. Similarly, we say nothing about bare mass nouns, which can receive either an existential or a generic interpretation. There are different views about their semantics:

      - The generic interpretation is primary; the existential interpretation derives from it (Carlson 1977)[^carlson-1977].
      - Bare mass nouns are directly interpreted as indefinites when they combine with stage- or individual-level predicates (Wilkinson 1991)[^wilkinson-1991].
      - Generic interpretations correspond to a variety of phenomena that should be treated independently from the semantics of mass nouns proper (Bunt 1985; Gillon 1992; Koslicki 1999)[^bunt-1985][^gillon-1992][^koslicki-1999].
    step1: |-
      [^note-7]: 外延进路不区分共延谓词。因此 Montague 采用内涵框架。但对共延性的这种顾虑与物质名词的主要问题正交，本文忽略之。同样，我们对光物质名词不置一词：它们可获存在解释或类属解释。关于其语义有不同看法：

      - 类属解释是基本的，存在解释由之派生（Carlson 1977）[^carlson-1977]。
      - 光物质名词与阶段层或个体层谓词结合时，直接解释为不定词（Wilkinson 1991）[^wilkinson-1991]。
      - 类属解释对应于应与物质名词语义本身独立处理的一类现象（Bunt 1985; Gillon 1992; Koslicki 1999）[^bunt-1985][^gillon-1992][^koslicki-1999]。
    step2: |-
      [^note-7]: 外延进路不分共延谓词，所以 Montague 采用内涵框架。可共延性顾虑与物质名词的主要问题正交，本文略去。光物质名词亦然：可获存在解释或类属解释，其语义众说纷纭：

      - 类属解释为主，存在解释派生（Carlson 1977）[^carlson-1977]。
