      Which set could make [*the clay that was on the desk on July 1ˢᵗ*] = [*the clay that was on the table on July 2ⁿᵈ*] true? What about the set of all minimal parts of clay, i.e., the set of all the instances of clay that have no other instance of clay as part? However, with mass nouns like *garbage*, it is not clear what the minimal parts would be (cf. Pelletier & Schubert 2003)[^pelletier-2003]. And more crucially, one cannot exclude *a priori* the possibility that what a given mass noun applies to may be indefinitely divisible. So the semantics should not require mass nouns to have minimal parts (cf. Bunt 1985; Gillon 1992)[^bunt-1985][^gillon-1992]. (See section 9 for a solution to this problem within the framework of non-singular logic; see Steen 2012, section 2.3, for various metaphysical considerations concerning the purely set-theoretic approach.)[^steen-2012]
    step1: |-
      哪个集合能使 [*the clay that was on the desk on July 1ˢᵗ*] = [*the clay that was on the table on July 2ⁿᵈ*] 为真？或许是一切黏土极小部分的集合，即一切不以其他黏土实例为部分的黏土实例之集？然而对 *garbage* 这类物质名词，极小部分是什么并不清楚（参看 Pelletier & Schubert 2003）[^pelletier-2003]。更关键的是，无法 *先验地* 排除某个物质名词所适用者可以无限可分。所以语义学不应要求物质名词有极小部分（参看 Bunt 1985; Gillon 1992）[^bunt-1985][^gillon-1992]。（在非单数逻辑框架内解决此问题，见第 9 节；关于纯集合论进路的各种形而上学考量，见 Steen 2012 第 2.3 节。）[^steen-2012]
    step2: |-
      哪个集合能使 [*the clay that was on the desk on July 1ˢᵗ*] = [*the clay that was on the table on July 2ⁿᵈ*] 为真？也许是一切黏土极小部分之集，即不以其他黏土实例为部分的那些黏土实例？可对 *garbage* 这类词，极小部分是什么并不清楚（参看 Pelletier & Schubert 2003）[^pelletier-2003]；更关键的是，无法 *先验* 排除某物质名词的适用对象无限可分。因此语义学不应要求物质名词有极小部分（参看 Bunt 1985; Gillon 1992）[^bunt-1985][^gillon-1992]。（非单数逻辑框架内的解法见第 9 节；纯集合论进路的形而上学考量见 Steen 2012 第 2.3 节。）[^steen-2012]
