      **Remark:** For Gillon, each choice of covering determines a specific interpretation of the sentence. The sentence is thus many-ways ambiguous. Schwarzschild (1996) offers a detailed defense for a similar position in the case of plurals (see also Champollion 2017)[^champollion-2017]. But the view also has opponents, like Lasersohn (1995). Among the alternatives, one could propose that a sentence of the form *The M P* is true just in case there exists a covering *C* of [*M*] such that *C* ⊆ [*P*]. The sentence wouldn’t be ambiguous but indeterminate with respect to coverings. A problem is that this wouldn’t predict the distributive / collective ambiguity, which does seem real (see Gillon 1992 for evidence)[^gillon-1992].
    step1: |-
      **评论：** 对 Gillon 来说，每种覆盖选择决定句子的一个特定解释。于是句子是多义歧义的。Schwarzschild（1996）就复数情形为类似立场作了详细辩护（另见 Champellion 2017）[^champollion-2017]。但此看法也有反对者，如 Lasersohn（1995）。在各种替代方案中，可以主张：形如 *The M P* 的句子为真，当且仅当存在 [*M*] 的覆盖 *C* 使 *C* ⊆ [*P*]。这样句子并不歧义，只是在覆盖上不确定。问题在于这预测不出分配/集体歧义，而这种歧义似乎确实存在（证据见 Gillon 1992）[^gillon-1992]。
    step2: |-
      **评论：** 在 Gillon 看来，每种覆盖选择决定句子的一个特定解释，于是句子有多种歧义。Schwarzschild（1996）就复数情形为类似立场作了详细辩护（另见 Champellion 2017）[^champollion-2017]，但也有反对者，如 Lasersohn（1995）。替代方案之一：*The M P* 为真，当且仅当存在 [*M*] 的覆盖 *C* 使 *C* ⊆ [*P*]。这样句子不歧义，只在覆盖上不确定；毛病是预测不出分配/集体歧义，而这种歧义似乎真实存在（证据见 Gillon 1992）[^gillon-1992]。
