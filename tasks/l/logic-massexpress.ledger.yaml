      **Remark 2:** Thus, against Parsons, one may well want to deny that the (sum or join of the) wood is identical to the (sum or join of the) furniture. Indeed, if the furniture is broken, it ceases to exist, while the wood does not. This line of argumentation is adopted more generally by those who deny the identity of a ship and the wood it is made of, of a man and its molecules, etc. (cf. Wasserman 2012). Parsons’ argument is based on a controversial metaphysical assumption, one that a semantics of mass nouns need not make.[^note-5] (See Steen 2012, section 2.2 and supplement 1, for other metaphysical considerations concerning the purely mereological approach.)[^steen-2012]
    step1: |-
      **评论 2：** 所以，可以反 Parsons 而否认木头（的和）与家具（的和）同一。确实，家具若被打碎就不复存在，木头却不。否认船与其所用木头同一、人与构成其分子同一的人，一般也采取这条论证路线（参看 Wasserman 2012）。Parsons 的论证基于一个有争议的形而上学假定，物质名词语义学不必作出它。[^note-5]（关于纯分体论进路的其他形而上学考量，见 Steen 2012 第 2.2 节及补充材料 1。）[^steen-2012]
