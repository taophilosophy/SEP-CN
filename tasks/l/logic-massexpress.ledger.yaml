      Take the noun *water*. The view is that this noun denotes the sum of all the water that there is. The notion of sum involved here can be characterized formally, as done in mereology (cf. Varzi 2016, Cotnoir & Varzi 2021)[^cotnoir-2021][^varzi-2016]. Intuitively, suppose there is some water in a bottle, *a*, and some water in a cup, *b*. Then we can also refer to the water in the bottle and the cup. This is a bigger portion of water, the sum of *a* and *b*, noted *a*∨*b* (or *a*+*b*). *a* is part of *a*∨*b*, and so is *b*. More generally, we can sum all the portions of water together. This is a very big portion of water, which is the denotation of the noun *water*. Mass predication is then interpreted in terms of these associated notions of sum and parthood:
    step1: |-
      以名词 *water* 为例。该看法认为，这个名词指称一切存在之水的和。这里涉及的和概念可以形式地刻画，分体论正是这样做的（参看 Varzi 2016、Cotnoir & Varzi 2021）[^cotnoir-2021][^varzi-2016]。直观地说，假设瓶中有一些水 *a*，杯中有一些水 *b*。那么我们也能指称瓶中和杯中的水。这是更大的一份水，即 *a* 与 *b* 的和，记作 *a*∨*b*（或 *a*+*b*）。*a* 是 *a*∨*b* 的部分，*b* 也是。更一般地，可以把所有部分的水加在一起。这是一份极大的水，即名词 *water* 的指称。物质述谓于是用这些相关的和概念与部分概念来解释：
    step2: |-
      以 *water* 为例。该看法认为这个名词指称一切存在之水的和。这里涉及的和概念可形式刻画，分体论正是这么做的（参看 Varzi 2016、Cotnoir & Varzi 2021）[^cotnoir-2021][^varzi-2016]。直观地说：瓶中有水 *a*，杯中有水 *b*，则也能指称瓶中与杯中的水合起来——更大的一份水，即 *a* 与 *b* 之和，记作 *a*∨*b*（或 *a*+*b*）。*a*、*b* 都是 *a*∨*b* 的部分。更一般地，可把所有水份加在一起，得到极大的一份水，那就是 *water* 的指称。物质述谓便用这些和与部分概念解释：
