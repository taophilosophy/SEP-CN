      **Remark 4:** The same difficulties also appear with plurals, as we can see if we replace *gold* by *pieces of furniture* and *in the safe* by *made by John* in the examples above. There is no agreement on what the proper treatment of negated plural sentences is. Still, a popular view is the following (Krifka 1996; Löbner 2000; see Breheny 2005 *a contrario*)[^breheny-2005][^krifka-1996][^löbner-2000]. Sentences like *The pieces of furniture are in the safe* and *The pieces of furniture are not in the safe* make a presupposition of “indivisibility”: they can be used felicitously only if all the pieces of furniture are in safe or if none is.[^note-15] The same could be proposed concerning mass nouns. In any case, a unified treatment of negation would be welcome, given that negation seems to create the same basic problem with mass nouns and with plurals.
    step1: |-
      **评论 4：** 复数也有同样困难，只要把上例的 *gold* 换成 *pieces of furniture*、*in the safe* 换成 *made by John* 便可见。否定复数句究竟该怎么处理，尚无定论。不过一种流行看法如下（Krifka 1996; Löbner 2000; 反面意见见 Breheny 2005）[^breheny-2005][^krifka-1996][^löbner-2000]：*The pieces of furniture are in the safe* 与 *The pieces of furniture are not in the safe* 这类句子含有“不可分”预设——只有当所有家具件都在保险柜里或都不在时，才能恰当使用。[^note-15] 对物质名词也可提出同样说法。无论如何，既然否定在物质名词与复数上似乎造成同一基本问题，统一的否定处理总是受欢迎的。
    step2: |-
      **评论 4：** 复数也如此，把上例的 *gold* 换成 *pieces of furniture*、*in the safe* 换成 *made by John* 便见。否定复数句该怎么处理尚无定论，但一种流行看法是（Krifka 1996; Löbner 2000; 反面意见见 Breheny 2005）[^breheny-2005][^krifka-1996][^löbner-2000]：*The pieces of furniture are in the safe* 与 *The pieces of furniture are not in the safe* 带“不可分”预设——只有全部家具件都在保险柜里或都不在，句子才恰当。[^note-15] 物质名词亦可照此说。无论如何，否定在物质名词与复数上造成同一基本难题，统一的处理总受欢迎。
