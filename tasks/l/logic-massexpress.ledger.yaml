      There are many similarities between the semantics of mass nouns and plurals, cf. sections 5, 6, and 8. Also, at a very intuitive level, if there are eight pieces of silverware on the table, then the speaker seems to refer to eight things at once when he says: *The silverware that is on the table comes from Italy*. If this intuition is taken seriously, then a mass noun isn’t a singular term. Rather, it is a non-singular term that may refer to one or several things at once.
    step1: |-
      物质名词与复数的语义有许多相似之处，参看第 5、6、8 节。而且在极直观的层面：若桌上有八件银器，说话者说 *The silverware that is on the table comes from Italy* 时，似乎一次指称了八个东西。认真对待这个直觉，物质名词就不是单数词项，而是可一次指称一个或多个东西的非单数词项。
    step2: |-
      物质名词与复数的语义相似处甚多（参看第 5、6、8 节）；极直观地说，桌上有八件银器时，说话者说 *The silverware that is on the table comes from Italy*，似乎一次指了八样东西。认真对待这个直觉，物质名词便不是单数词项，而是能一次指一个或多个东西的非单数词项。
  - id: 131
    kind: body
    source: |-
      Nicolas (2008) puts forwards a semantics of mass nouns that does justice to this intuition (see Laycock (2006), Cocchiarella (2009) and McKay (2016) for related proposals). It is cashed out in “non-singular” or “plural” logic. In usual logic frameworks, like predicate logic, constants and variables are singular in the following sense. Under any interpretation, a constant is interpreted as one individual, and under any assignment, a variable is interpreted as one individual. By contrast, non-singular or plural logic possesses singular and non-singular constants and variables. Under any interpretation and variable assignment, a non-singular term (a constant or a variable) may be interpreted as one or more individuals in the domain of interpretation. In particular, a formula consisting of a predicate whose argument is a non-singular constant is true just in case the constant is interpreted as one or more individuals that jointly satisfy the predicate (cf. Linnebo 2017[^note-22])[^linnebo-2017].
    step1: |-
      Nicolas（2008）提出一种物质名词语义，恰当地对待这个直觉（相关方案见 Laycock (2006)、Cocchiarella (2009)、McKay (2016)）。它用“非单数”逻辑或“复数”逻辑兑现。在谓词逻辑这类通常逻辑框架中，常项与变元在下述意义上是单数的：任何解释下，常项被解释为一个个体；任何赋值下，变元被解释为一个个体。相反，非单数逻辑或复数逻辑既有单数常项与变元，也有非单数常项与变元。在任何解释与变元赋值下，非单数词项（常项或变元）可被解释为解释域中的一个或多个个体。特别是，谓词的论元为非单数常项时，该公式为真，当且仅当该常项被解释为一个或多个共同满足该谓词的个体（参看 Linnebo 2017[^note-22]）[^linnebo-2017]。
    step2: |-
      Nicolas（2008）提出一种对待此直觉的物质名词语义（相关方案见 Laycock 2006、Cocchiarella 2009、McKay 2016），用“非单数”逻辑或“复数”逻辑兑现。通常的谓词逻辑框架里，常项与变元都是单数的：任何解释下常项指一个个体，任何赋值下变元指一个个体。非单数逻辑则兼有单数与非单数常项、变元；任何解释与赋值下，非单数词项可解释为解释域中一个或多个个体。特别是，谓词论元为非单数常项的公式为真，当且仅当该常项被解释为一个或多个共同满足该谓词的个体（参看 Linnebo 2017[^note-22]）[^linnebo-2017]。
