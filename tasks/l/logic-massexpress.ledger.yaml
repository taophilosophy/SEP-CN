      **Remark 1:** Under this approach, the whole universe of discourse (for mass nouns and their predicates) is specified by a single Boolean algebra, with uniformly defined join (sum), meet (intersection), and order (parthood). Predication is defined in terms of Boolean intersection (or equivalently, order or parthood in the case of definite subjects). This works with mass nouns and predicates that are homogeneous (i.e., refer distributively and cumulatively). But mass nouns like *furniture* are clearly not homogeneous. And a predicate like *made by John* isn’t homogeneous either. When something is made by John (e.g., a piece of furniture), it doesn’t imply that any part of it (e.g., some wood used to make it up) is also made by John. For the reasons given in section 2, the Boolean approach may ascribe incorrect truth-conditions to sentences like *This is furniture*, *Some furniture is made by John*, and *The furniture is made by John*. For instance, [*this*] ≤ [*furniture*] does not guarantee that what is demonstrated is furniture, since a piece of wood may be a part of a piece of furniture without being furniture. So there are mass nouns and predicates to which the approach doesn’t seem to apply, even though the same difficulties with negation appear with them. If in the examples above we replace *gold* by *furniture* and *in the safe* by *made by John*, we meet the same problems with negation. (If there are two pieces of furniture, only one of which is made by John, is it true or false that *The furniture is made by John*?) So an appropriate solution had better not be tied to the assumption of homogeneity.[^note-14]
    step1: |-
      **评论 1：** 在此进路下，（物质名词及其谓词的）整个论域由单个布尔代数规定，并、交、序（部分）都统一定义。述谓按布尔交定义（在限定主语情形，等价地按序或部分定义）。这对齐性的物质名词与谓词（即既分配又累积指称者）有效。但 *furniture* 这类物质名词显然不齐性，*made by John* 这类谓词也不齐性：某物（如一件家具）由约翰制造，并不蕴涵其任何部分（如做它用的木料）也由约翰制造。按第 2 节的理由，布尔进路可能给 *This is furniture*、*Some furniture is made by John*、*The furniture is made by John* 这类句子指派错误真值条件。例如 [*this*] ≤ [*furniture*] 并不保证被指示之物是家具：一块木料可以是某件家具的部分而不是家具。所以有些物质名词与谓词这条进路似乎用不上，尽管否定上的同样困难在它们身上也出现。若把上例的 *gold* 换成 *furniture*、*in the safe* 换成 *made by John*，否定上的问题依旧。（有两件家具，只有一件由约翰制造，*The furniture is made by John* 是真是假？）所以合适的解法最好不绑在齐性假定上。[^note-14]
    step2: |-
      **评论 1：** 这条进路用单个布尔代数规定整个论域（物质名词及其谓词），并、交、序（部分）统一定义；述谓按布尔交定义（限定主语时等价地按序定义）。这对齐性的物质名词与谓词（既分配又累积者）有效；可 *furniture* 显然不齐性，*made by John* 也不齐性：某物（如一件家具）由约翰制造，不蕴涵其任何部分（如木料）也由约翰制造。按第 2 节的理由，布尔进路可能给 *This is furniture*、*Some furniture is made by John*、*The furniture is made by John* 指派错误真值条件——[*this*] ≤ [*furniture*] 并不保证被指示之物是家具，一块木料可以是家具的一部分而不是家具。可见有些物质名词与谓词用不上这条进路，尽管否定上的同样困难在它们身上也出现：把上例的 *gold* 换成 *furniture*、*in the safe* 换成 *made by John*，问题依旧。（两件家具只有一件由约翰制造时，*The furniture is made by John* 是真是假？）所以合适的解法最好别绑在齐性假定上。[^note-14]
