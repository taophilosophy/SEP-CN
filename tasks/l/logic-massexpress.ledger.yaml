      **Remark 5:** But the problem is even more general, since it also appears with subjects that are count and singular, like *table*. Is the table in the living-room, when one half of it is, while the other half is in the bedroom? The application of a predicate to an entity (or the application of the negated predicate) seems to be often sensitive to the part structure of the entity (Löbner 2000; Corblin 2008)[^corblin-2008][^löbner-2000]. More work on this is needed to understand how predication and negation work in connection to part-structure.
