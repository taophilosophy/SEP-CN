    source: |-
      In many languages, like English, nominal expressions headed by common nouns can be divided into two subtypes, mass expressions (like *wine*, *silverware*, *wisdom*) and count expressions (like *cat*, *army*, *idea*). We first characterize what mass expressions are. Then we discuss various proposals concerning their semantics.
    step1: |-
      在许多语言（如英语）中，以普通名词为核心的指称表达式可分为两个子类：物质名词表达（如 *wine*、*silverware*、*wisdom*）与可数表达（如 *cat*、*army*、*idea*）。我们先刻画物质名词表达是什么，再讨论关于其语义的各种方案。
    step2: |-
      在许多语言（如英语）中，以普通名词为核心的指称表达式分两类：物质名词表达（如 *wine*、*silverware*、*wisdom*）与可数表达（如 *cat*、*army*、*idea*）。本文先刻画物质名词表达是什么，再讨论关于其语义的种种方案。
  - id: 2
    kind: body
    source: |-
      ## 1. What are mass expressions?
    step1: |-
      ## 1. 什么是物质名词表达？
    step2: |-
      ## 1 什么是物质名词表达？
  - id: 3
    kind: body
    source: |-
      How can we identify a class of mass expressions as distinct from a class of count expressions? In order to do so, one may try to employ syntactic criteria or semantic criteria. We present them in turn. As we shall see, only the syntactic criteria are satisfactory.
    step1: |-
      怎样把物质名词表达这个类与可数表达这个类区分开来？为此可以尝试句法判据或语义判据。下面依次介绍。我们会看到，只有句法判据令人满意。
    step2: |-
      怎样划出物质名词表达与可数表达这两类？可以试句法判据，也可以试语义判据。下面依次介绍；将看到，只有句法判据令人满意。
  - id: 4
    kind: body
    source: |-
      ### 1.1 Syntactic criteria
    step1: |-
      ### 1.1 句法判据
    step2: |-
      ### 1.1 句法判据
  - id: 5
    kind: body
    source: |-
      At the syntactic level, there are two viable positions concerning the mass / count distinction: it applies at the level of nouns; or it only applies at the level of noun phrases.
    step1: |-
      在句法层面，关于物质/可数之分有两种可行立场：它适用于名词层面；或者它只适用于名词短语层面。
    step2: |-
      句法层面，物质/可数之分有两种可行立场：或在名词层面适用，或只在名词短语层面适用。
  - id: 6
    kind: body
    source: |-
      The first position is the traditional, dominant view (e.g., Weinreich 1966; Krifka 1991; Gillon 1992)[^gillon-1992][^krifka-1991][^weinreich-1966]. According to it, in a language like English (or French, German, Greek, Italian, etc.), common nouns are divided into two morphosyntactic subclasses, mass nouns and count nouns. A defining characteristic of mass nouns, like *milk*, *gold*, *furniture*, *wisdom* and *love*, is that they are invariable in grammatical number, while count nouns, like *rabbit*, *bottle*, *table*, *idea* and *set*, can be used in the singular and in the plural. Depending on the language, this basic morphosyntactic difference between the two types of noun is supplemented by differences as to the determiners they can combine with. Thus, in English, mass nouns can be used with determiners like *much* and *a lot of*, but neither with *one* nor *many*. On the contrary, count nouns can be employed with numerals like *one* and determiners like *many*, but not with *much.*
    step1: |-
      第一种立场是传统的主流看法（如 Weinreich 1966; Krifka 1991; Gillon 1992）[^gillon-1992][^krifka-1991][^weinreich-1966]。按此看法，在英语（或法语、德语、希腊语、意大利语等）这样的语言中，普通名词分为两个形态句法子类：物质名词与可数名词。物质名词（如 *milk*、*gold*、*furniture*、*wisdom*、*love*）的一个界定特征是语法数上不变，而可数名词（如 *rabbit*、*bottle*、*table*、*idea*、*set*）可用于单数与复数。依语言不同，两类名词这一基本形态句法差异还伴随可搭配限定词的差异。例如英语中，物质名词可与 *much*、*a lot of* 这类限定词连用，却不能与 *one* 或 *many* 连用。相反，可数名词可与 *one* 这类数词及 *many* 这类限定词连用，却不能与 *much* 连用。
    step2: |-
      第一种立场是传统主流看法（如 Weinreich 1966; Krifka 1991; Gillon 1992）[^gillon-1992][^krifka-1991][^weinreich-1966]：在英语（或法语、德语、希腊语、意大利语等）中，普通名词分两个形态句法子类——物质名词与可数名词。物质名词（*milk*、*gold*、*furniture*、*wisdom*、*love*）的界定特征是语法数不变；可数名词（*rabbit*、*bottle*、*table*、*idea*、*set*）则单复数两用。这个基本差异还伴随可搭配限定词的不同：英语里物质名词能跟 *much*、*a lot of*，却不能跟 *one*、*many*；可数名词能跟 *one* 这类数词与 *many*，却不能跟 *much*。
  - id: 7
    kind: body
    source: |-
      However, as is well known, mass nouns (like *milk*) can often be used as count nouns: *You should take a hot milk with some honey.* And vice versa: *You will find a lot of rabbit around here*. For this reason, several researchers have denied that the mass / count distinction applies at the level of nouns, and proposed instead that it only applies at the level of noun phrases (e.g., Damourette & Pichon 1927; Pelletier 1975, 2012; Ware 1975)[^damourette-1927][^pelletier-1975][^ware-1975]. Under this view, at the level of nouns, there are only common nouns, but common nouns can be used in a mass way or in a count way depending on the morphosyntactic environment they are put into. Mass determiners, like *much* or *a little*, lead to a mass use of the noun (*much water*, *much table*), while count determiners, like *a* or *two*, lead to a count use (*two waters*, *two tables*).[^note-1]
    step1: |-
      然而众所周知，物质名词（如 *milk*）常可用作可数名词：*You should take a hot milk with some honey.* 反过来也一样：*You will find a lot of rabbit around here*。因此，好几位研究者否认物质/可数之分适用于名词层面，转而主张它只适用于名词短语层面（如 Damourette & Pichon 1927; Pelletier 1975, 2012; Ware 1975）[^damourette-1927][^pelletier-1975][^ware-1975]。按此看法，名词层面上只有普通名词，但普通名词可因其进入的形态句法环境而以物质方式或可数方式使用。物质限定词（如 *much* 或 *a little*）导致名词的物质用法（*much water*、*much table*），可数限定词（如 *a* 或 *two*）导致可数用法（*two waters*、*two tables*）。[^note-1]
    step2: |-
      可众所周知，物质名词（如 *milk*）常能当可数名词用：*You should take a hot milk with some honey.*；反过来亦然：*You will find a lot of rabbit around here*。因此好几位研究者否认物质/可数之分在名词层面成立，主张它只在名词短语层面成立（如 Damourette & Pichon 1927; Pelletier 1975, 2012; Ware 1975）[^damourette-1927][^pelletier-1975][^ware-1975]。照此说，名词层面只有普通名词；普通名词随所处形态句法环境而以物质方式或可数方式使用——物质限定词（*much*、*a little*）带来物质用法（*much water*、*much table*），可数限定词（*a*、*two*）带来可数用法（*two waters*、*two tables*）。[^note-1]
  - id: 8
    kind: body
    source: |-
      The two positions seem to be viable (cf. Pelletier & Schubert 2003)[^pelletier-2003] and they have their respective proponents. For ease of exposition, we adopt the dominant view in the rest of the entry.[^note-2]
    step1: |-
      两种立场似乎都可行（参看 Pelletier & Schubert 2003）[^pelletier-2003]，各有其拥护者。为便于阐述，本文其余部分采用主流看法。[^note-2]
    step2: |-
      两种立场似乎都站得住（参看 Pelletier & Schubert 2003）[^pelletier-2003]，各有拥护者。为便于阐述，本文余下部分采用主流看法。[^note-2]
  - id: 9
    kind: body
    source: |-
      ### 1.2 Semantic criteria
    step1: |-
      ### 1.2 语义判据
    step2: |-
      ### 1.2 语义判据
  - id: 10
    kind: body
    source: |-
      At the semantic level, two properties have been proposed as being characteristic of mass nouns: cumulative reference and distributive reference. But as we shall see, cumulative reference is also a property of plurals, while distributive reference doesn’t apply to all mass nouns.
    step1: |-
      在语义层面，有人提出两个性质作为物质名词的特征：累积指称与分配指称。但我们会看到，累积指称也是复数具有的性质，而分配指称并不适用于所有物质名词。
    step2: |-
      语义层面，有人提出两个性质作物质名词的特征：累积指称与分配指称。但将看到，累积指称复数也有，分配指称则不适用于一切物质名词。
  - id: 11
    kind: body
    source: |-
      Since Quine (1960), it is generally accepted that mass nouns refer cumulatively. Consider a mass noun *M*. Suppose that we can truly say of something *x* that *This is M* (with *this* referring to *x*) and of something distinct, *y*, that *This is M* (with *this* now referring to *y*). Then in the same circumstance, we can also refer to *x* and *y* together, and say of *x* and *y* that *This is M*. This property of mass nouns is called cumulative reference. Plural count nouns also have the same property. Let *Ns* be a plural count noun. If these are Ns and those are Ns, then we can refer to these and those together, and say of all of them that they are Ns.
    step1: |-
      自 Quine（1960）以来，人们普遍接受物质名词作累积指称。考虑物质名词 *M*。假设对某物 *x* 我们能真地说 *This is M*（*this* 指 *x*），又对另一物 *y* 能真地说 *This is M*（此时 *this* 指 *y*）。那么在同一情形下，我们也能合指 *x* 与 *y*，说 *x* 与 *y* 是 *This is M*。物质名词的这一性质叫累积指称。复数可数名词也有同样性质。设 *Ns* 是复数可数名词。若这些是 Ns，那些也是 Ns，则我们能合指这些与那些，说它们全都是 Ns。
    step2: |-
      自 Quine（1960）以来，物质名词作累积指称已成共识。取物质名词 *M*：设对某物 *x* 能真说 *This is M*（*this* 指 *x*），对另一物 *y* 也能真说 *This is M*（此时 *this* 指 *y*）；那么在同一情形下，*x* 与 *y* 可以合指，说 *This is M*。这就是累积指称。复数可数名词同样如此：若这些是 Ns、那些是 Ns，则合指二者，说它们全是 Ns。
  - id: 12
    kind: body
    source: |-
      Various authors have proposed that mass nouns also refer distributively (e.g., Cheng 1973; ter Meulen 1981)[^cheng-1973][^meulen-1981]. Let *M* be a mass noun. Suppose that we can truly say of something *x* that *This is M* (with *this* referring to *x*). Then in the same circumstance, for anything *y* that is part of *x*, we can also say of y that *This is M* (with *this* now referring to *y*). However, with many mass nouns, the property doesn’t apply when one considers parts that are small enough. Water is made of oxygen and hydrogen, but oxygen isn’t water. And with mass nouns like *furniture* or *silverware*, the problem appears even more clearly, at the macroscopic level: a table is furniture, a leg of the table is part of the table, but the leg isn’t furniture. Thus, the thesis that mass nouns refer distributively is mistaken (e.g., Gillon 1992; Nicolas 2002)[^gillon-1992][^nicolas-2002].
    step1: |-
      多位作者提出物质名词也作分配指称（如 Cheng 1973; ter Meulen 1981）[^cheng-1973][^meulen-1981]。设 *M* 是物质名词。假设对某物 *x* 我们能真地说 *This is M*（*this* 指 *x*）。那么在同一情形下，对 *x* 的任何部分 *y*，我们也能说 $y$ 是 *This is M*（此时 *this* 指 *y*）。然而对许多物质名词，一旦考虑足够小的部分，该性质就不成立。水由氧和氢构成，氧却不是水。对 *furniture*、*silverware* 这类物质名词，问题在宏观层面就更明显：桌子是家具，桌腿是桌子的一部分，桌腿却不是家具。因此，物质名词作分配指称这一论题是错的（如 Gillon 1992; Nicolas 2002）[^gillon-1992][^nicolas-2002]。
    step2: |-
      多位作者提出物质名词也作分配指称（如 Cheng 1973; ter Meulen 1981）[^cheng-1973][^meulen-1981]。设 *M* 是物质名词，对某物 *x* 能真说 *This is M*（*this* 指 *x*）；则同一情形下，对 *x* 的任何部分 *y* 也能说它是 *This is M*（*this* 指 *y*）。可对许多物质名词，部分小到一定程度，该性质就不灵了：水由氧和氢构成，氧却不是水；*furniture*、*silverware* 这类词在宏观层面更明显——桌子是家具，桌腿是桌子的一部分，桌腿却不是家具。所以，“物质名词作分配指称”这一论题是错的（如 Gillon 1992; Nicolas 2002）[^gillon-1992][^nicolas-2002]。
  - id: 13
    kind: body
    source: |-
      A first attempt to defend the view would be as follows. Bunt (1985) and others have proposed that, although modern science is in conflict with the claim that the mass noun *water* refers distributively, English speakers use the noun as if it did. The problem with this suggestion is that it cannot be falsified, since it puts aside the very cases that would do so. So it doesn’t seem to be an empirical hypothesis and it doesn’t appear to make any prediction. What benefit would there be to add this claim to any theory?
    step1: |-
      为该看法辩护的第一次尝试如下。Bunt（1985）等人提出：尽管现代科学与“物质名词 *water* 作分配指称”这一主张相冲突，英语使用者却仍像它成立那样使用该名词。这个建议的问题在于无法证伪，因为它恰恰把会证伪它的情形排除在外。所以它似乎不是经验假说，也不见作出任何预测。把这一主张加进任何理论，有何益处？
    step2: |-
      为这看法辩护的头一种尝试是：Bunt（1985）等人主张，现代科学虽与“*water* 作分配指称”相冲突，英语使用者却照旧这样用。毛病在于无法证伪——它恰恰把会证伪它的情形排除在外。这样它就不像经验假说，也不见给出任何预测。把这话加进理论，有什么好处？
  - id: 14
    kind: body
    source: |-
      A better attempt would consist, in effect, in attributing a weaker property to mass nouns. As we will see in section 2, an approach based on mereology may well, contrary to what is usually assumed, want to use a non-extensional mereology, where the notion of part is defined in terms of the notion of sum. If distributive reference were understood using such a notion of part, it could avoid the problems mentioned here. There is nothing wrong with that, but then, the property attributed to mass nouns would be much weaker than that originally advocated by its partisans (see Nicolas 2002, chapter 3, for a proposal of this kind)[^nicolas-2002]. The claim made here is simply that distributive reference, as usually conceived, is not a property of mass nouns.
    step1: |-
      更好的尝试是给物质名词归属一个较弱的性质。我们将在第 2 节看到，基于分体论的进路很可能——与通常设想相反——想采用非外延的分体论，其中部分概念由和概念定义。若用这样的部分概念来理解分配指称，就能避开此处提到的问题。这没什么不对，但那样一来，归给物质名词的性质就比其拥护者原初主张的弱得多（此类的方案见 Nicolas 2002 第 3 章）[^nicolas-2002]。这里的主张只是：通常设想的分配指称，并不是物质名词的性质。
    step2: |-
      更好的尝试，是给物质名词归属一个较弱的性质。第 2 节将看到，基于分体论的进路很可能——与通常设想相反——要采用非外延的分体论，其中部分概念由和概念定义。用这样的部分概念理解分配指称，就能避开上述难题；这没什么不对，只是归给物质名词的性质会比拥护者原初主张的弱得多（此类方案见 Nicolas 2002 第 3 章）[^nicolas-2002]。本文只主张：通常设想的分配指称，并非物质名词的性质。
  - id: 15
    kind: body
    source: |-
      But more generally, it seems that there are no necessary and sufficient semantic conditions that would specify what mass nouns are and what count nouns are (see Gillon 1992, Koslicki 1999, and Nicolas 2002 for detailed arguments to this effect[^note-3]; *a contrario*, see for instance Landman 2020)[^gillon-1992][^koslicki-1999][^landman-2020][^nicolas-2002]. A common noun that is mass in a language (like *luggage* in English) may be count in another (like *bagage* in French). The distinction between mass nouns and count nouns should be drawn syntactically. A key feature of count nouns is that they admit the singular / plural contrast while mass nouns do not. So languages that do not mark the singular / plural contrast could lack count nouns and all their common nouns function in a similar way as mass nouns do in English. This might the case of certain classifier languages, like Mandarin (Chierchia 1998, 2010)[^chierchia-1998].[^note-4] Alternatively, the mass / count distinction could just fail to apply to such languages. The proper way to draw the mass / count distinction across languages is still debated (see Doetjes 2012, Rothstein 2017, and Bale & Barner 2018 for cross-linguistic overviews)[^bale-2018][^doetjes-2012][^rothstein-2017].
    step1: |-
      但更一般地说，似乎没有既必要又充分的语义条件能规定什么是物质名词、什么是可数名词（详细论证见 Gillon 1992、Koslicki 1999、Nicolas 2002[^note-3]；反面意见例如见 Landman 2020）[^gillon-1992][^koslicki-1999][^landman-2020][^nicolas-2002]。一种语言中属物质名词的普通名词（如英语的 *luggage*），在另一种语言中可能属可数名词（如法语的 *bagage*）。物质名词与可数名词之分应当从句法上划定。可数名词的一个关键特征是容许单复数对立，物质名词则不容许。因此，不标记单复数对立的语言可能没有可数名词，其普通名词的功能都类似于英语中的物质名词。某些量词语言（如汉语普通话）也许如此（Chierchia 1998, 2010）[^chierchia-1998]。[^note-4] 另一种可能是，物质/可数之分根本不适用于这类语言。跨语言划定物质/可数之分的恰当方式仍有争论（跨语言概览见 Doetjes 2012、Rothstein 2017、Bale & Barner 2018）[^bale-2018][^doetjes-2012][^rothstein-2017]。
    step2: |-
      更一般地说，似乎没有既必要又充分的语义条件能规定何谓物质名词、何谓可数名词（详见 Gillon 1992、Koslicki 1999、Nicolas 2002[^note-3]；反面意见如 Landman 2020）[^gillon-1992][^koslicki-1999][^landman-2020][^nicolas-2002]。一种语言里的物质名词（英语 *luggage*），到另一种语言里可能成可数名词（法语 *bagage*）。此分应当从句法上划定：可数名词的关键特征是容许单复数对立，物质名词不容许。于是，不标记单复数对立的语言可能没有可数名词，其普通名词的功能都类似英语物质名词，某些量词语言（如汉语普通话）或即如此（Chierchia 1998, 2010）[^chierchia-1998]。[^note-4] 另一种可能是：物质/可数之分根本不适用于这类语言。跨语言划定此分的恰当方式仍有争论（跨语言概览见 Doetjes 2012、Rothstein 2017、Bale & Barner 2018）[^bale-2018][^doetjes-2012][^rothstein-2017]。
  - id: 16
    kind: body
    source: |-
      In the rest of this entry, we examine how sentences containing mass nouns are interpreted, i.e., how their truth-conditions can be specified. We consider several approaches to the semantics of mass nouns. Even though a given approach may turn out to be unsatisfactory, it is important to know in what precise respects it fails. For some of its key proposals may be retained in (or transposed to) a better, overall framework.
    step1: |-
      本文其余部分考察含物质名词的句子如何解释，即其真值条件如何规定。我们考虑物质名词语义的几种进路。即便某条进路最终不尽如人意，知道它究竟在哪方面失败也很重要。因为它的一些关键提议，也许能保留在（或转译进）一个更好的总体框架。
    step2: |-
      本文余下部分考察含物质名词的句子如何解释，即其真值条件怎样规定。我们会看几种进路；某条进路最终不尽如人意，弄清它究竟败在何处仍然要紧——它的某些关键提议，也许能保留进（或转译进）更好的总体框架。
