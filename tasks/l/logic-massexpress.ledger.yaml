      - Mass predication (as in *This is water*) should not be understood in terms of parthood, but in terms of set membership.
      - The denotation of a mass noun *M* (the set whose elements are everything that is *M*) should be the join semi-lattice generated by the sum or join operation on portions of M.[^note-10]
    step1: |-
      - 物质述谓（如 *This is water*）不应按部分关系理解，而应按集合成员关系理解。
