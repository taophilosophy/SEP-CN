      [^note-19]: Gillon 用更特定的概念，即“聚合”。聚合是任何元素都不为其他元素部分的覆盖。这个选择无关宏旨。
    step2: |-
      [^note-19]: Gillon 用更特定的“聚合”概念：聚合是任何元素都不为其他元素部分的覆盖。这个选择无关宏旨。
