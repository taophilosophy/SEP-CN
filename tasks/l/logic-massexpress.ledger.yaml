      ## 10 抽象物质名词
  - id: 139
    kind: body
    source: |-
      “Abstract” nouns like *sadness* and *wisdom* and “concrete” nouns like *water* and *furniture* all belong to the morphosyntactic class of mass nouns. However, semantics for mass nouns have generally focused on concrete terms, i.e., terms that apply to concrete entities. This raises an important question: are abstract mass nouns a separate species of mass nouns, with their own semantic properties? Or can a general account be proposed, which would work both for concrete mass nouns and abstract ones?
    step1: |-
      *sadness*、*wisdom* 这类“抽象”名词与 *water*、*furniture* 这类“具体”名词，同属物质名词这一形态句法类。然而物质名词语义一般聚焦具体词项，即适用于具体实体的词项。这就提出一个重要问题：抽象物质名词是否是物质名词的独立种类，有其自身的语义性质？还是能提出一种既适用于具体物质名词又适用于抽象物质名词的一般说明？
    step2: |-
      *sadness*、*wisdom* 这类“抽象”名词与 *water*、*furniture* 这类“具体”名词同属物质名词这一形态句法类，可物质名词语义一般聚焦具体词项（适用于具体实体的词项）。由此有个要紧问题：抽象物质名词是物质名词的独立种类、自有语义性质吗？还是能提出一种兼顾具体与抽象的一般说明？
  - id: 140
    kind: body
    source: |-
      Nicolas (2004, 2010) shows that a general account of the semantics of mass nouns can indeed be proposed, provided one takes a more general stance than when focusing on concrete mass nouns alone (see also Grimm 2014)[^grimm-2014]. Several issues arise.
    step1: |-
      Nicolas（2004, 2010）表明，只要采取比只盯具体物质名词时更一般的立场，确实可以提出物质名词语义的一般说明（另见 Grimm 2014）[^grimm-2014]。这里浮现几个问题。
    step2: |-
      Nicolas（2004, 2010）表明，只要立场比单看具体物质名词时更一般，确实能提出一般说明（另见 Grimm 2014）[^grimm-2014]。其中浮现几个问题。
  - id: 141
    kind: body
    source: |-
      Reference: concrete common nouns can be used in definite descriptions, where they seem to refer to entities of various types. Do abstract mass nouns refer to something when they are used in definite descriptions? And if so, what do they refer to? Consider sentences like these: *Julie’s wisdom attracted Tom. Julie’s love for Tom lasted several years.* Nicolas proposes that their subjects, which are headed by abstract mass nouns, do refer (or make as if to refer) to instances of properties or relations, thereby introducing these as referents in the discourse (Moltmann 2007 proposes something similar)[^moltmann-2007]. He argues that this provides the most unified explanation of the various uses of abstract mass nouns.
    step1: |-
      指称：具体普通名词可用于限定摹状词，此时它们似乎指称各种类型的实体。抽象物质名词用于限定摹状词时指称什么东西吗？若指称，又指称什么？考虑这类句子：*Julie’s wisdom attracted Tom. Julie’s love for Tom lasted several years.* Nicolas 提议，这些以抽象物质名词为核心的主语确实指称（或装作指称）性质或关系的实例，从而把它们作为指称物引入话语（Moltmann 2007 提出类似看法）[^moltmann-2007]。他论证说，这为抽象物质名词的各种用法提供了最统一的说明。
    step2: |-
      指称：具体普通名词能用于限定摹状词，此时似指各类实体。抽象物质名词用于限定摹状词时指不指东西？若指，指什么？看这类句子：*Julie’s wisdom attracted Tom. Julie’s love for Tom lasted several years.* Nicolas 提议，这些以抽象物质名词为核心的主语确实指称（或装作指称）性质或关系的实例，从而把它们作为指称物引入话语（Moltmann 2007 有类似提议）[^moltmann-2007]；他论证说，这最能统一说明抽象物质名词的种种用法。
  - id: 142
    kind: body
    source: |-
      Nominalization: many abstract mass nouns are derived from an adjective or verb. What is the semantic effect of nominalization? Nicolas proposes that its intuitive effect, namely reification, a “something-from-nothing transformation”, is adequately captured by meaning postulates. Thus, a meaning postulate relates the meanings of the mass noun *love* and the verb *to love*. It ensures that an instance of love from John towards Mary exists if and only if John loves Mary.
    step1: |-
      名词化：许多抽象物质名词由形容词或动词派生。名词化的语义效果是什么？Nicolas 提议，其直观效果即物化，一种“无中生有”的转换，可由意义公设充分刻画。例如一条意义公设关联物质名词 *love* 与动词 *to love* 的意义：它确保约翰对玛丽的爱的实例存在，当且仅当约翰爱玛丽。
    step2: |-
      名词化：许多抽象物质名词由形容词或动词派生。名词化的语义效果为何？Nicolas 提议，其直观效果即物化，即“无中生有”的转换，可由意义公设充分刻画。比如一条意义公设关联 *love* 与动词 *to love*：约翰对玛丽的爱之实例存在，当且仅当约翰爱玛丽。
  - id: 143
    kind: body
    source: |-
      Distributive, collective, and intermediate construals: sentences with concrete mass nouns or plurals may receive so-called distributive, collective, and intermediate construals (cf. section 8 above). Is it also the case with abstract mass nouns? Nicolas (2010) suggests that this is so. Take the sentence *The strength of these men is impressive*, uttered in a context where two strong teams are competing. The sentence can assert that the strength of each team is impressive. This corresponds to a construal which is neither distributive (the strength of each man is impressive), nor collective (the strength of the men all together is impressive), but intermediate between distributive and collective. Nicolas shows that these construals can be accounted for by Gillon’s (1996) rule for the interpretation of complex noun phrases containing a prepositional phrase.
    step1: |-
      分配、集体与居间解读：含具体物质名词或复数的句子可得到所谓分配、集体与居间解读（参看上文第 8 节）。抽象物质名词是否也如此？Nicolas（2010）认为如此。取句子 *The strength of these men is impressive*，说于两支强队比赛的语境。句子可以断言每支队的力气令人印象深刻。这对应一种既非分配（每个人各自的力气令人印象深刻）、也非集体（这些人合起来的力气令人印象深刻），而是介于二者之间的解读。Nicolas 表明，这些解读可由 Gillon（1996）关于含介词短语的复杂名词短语的解释规则来说明。
    step2: |-
      分配、集体与居间解读：含具体物质名词或复数的句子可得分配、集体、居间解读（参看第 8 节）。抽象物质名词也如此吗？Nicolas（2010）认为是的。取 *The strength of these men is impressive*，说于两支强队比赛时：句子可断言每支队的力气都令人印象深刻。这既非分配（每个人各自的力气令人印象深刻），也非集体（所有人合起来的力气），而是介于二者之间。Nicolas 表明，Gillon（1996）关于含介词短语的复杂名词短语的解释规则足以说明这些解读。
