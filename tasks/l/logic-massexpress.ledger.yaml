      ## 2. The purely mereological approach
    step1: |-
      ## 2. 纯分体论进路
    step2: |-
      ## 2 纯分体论进路
  - id: 18
    kind: body
    source: |-
      We first consider the purely mereological approach (Moravcsik 1973)[^moravcsik-1973], which uses mereological sums as the denotata of mass nouns, and interprets mass predication (e.g., *This is water*) in terms of parthood.
    step1: |-
      先看纯分体论进路（Moravcsik 1973）[^moravcsik-1973]：它用分体论的和作为物质名词的指称物，并以部分关系解释物质述谓（如 *This is water*）。
    step2: |-
