      In the examples we have given so far (as well as in those considered by Gillon), non-collective construals always correspond to partitions of the denotation of the mass noun phrase. However, some interpretations correspond to a more general notion, that of a “covering”: a set *X* is a covering of a set *Y* just in case the sum of the elements of *X* is identical with the sum of the elements of *Y*.[^note-18] Thus, with *This livestock carried that furniture*, it may be that some pieces of furniture were repeatedly part of the furniture carried by some of the livestock. The relation of carrying thus applies between elements of a covering of [*this livestock*] and elements of a covering of [*that furniture*]. So it seems that the semantics of mass nouns should leave room, not only for partitions, but also for all kinds of coverings.[^note-19]
    step1: |-
      在我们迄今的例子中（Gillon 所举亦然），非集体解读总对应物质名词短语指称的一个划分。然而有些解释对应更一般的概念，即“覆盖”：集合 *X* 是集合 *Y* 的覆盖，当且仅当 *X* 的元素之和等于 *Y* 的元素之和。[^note-18] 于是对 *This livestock carried that furniture*，可能有些家具件反复地是某几头牲口所驮家具的一部分。“驮”关系便施用于 [*this livestock*] 的覆盖元素与 [*that furniture*] 的覆盖元素之间。看来物质名词的语义应当为划分留下位置，也为各种覆盖留下位置。[^note-19]
    step2: |-
      我们迄今的例子（Gillon 所举亦然）中，非集体解读总对应物质名词短语指称的一个划分；可有些解释对应更一般的概念——“覆盖”：集合 *X* 是集合 *Y* 的覆盖，当且仅当 *X* 元素之和等于 *Y* 元素之和。[^note-18] 于是对 *This livestock carried that furniture*，可能有些家具件反复地是某几头牲口所驮家具的一部分；“驮”便施用于 [*this livestock*] 覆盖元素与 [*that furniture*] 覆盖元素之间。看来物质名词的语义该给划分留位置，也给各种覆盖留位置。[^note-19]
