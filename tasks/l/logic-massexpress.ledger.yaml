    source: |-
      According to Nicolas (2008), the sentence is true when a common non-singular covering can be chosen for the *as* and the *bs*.[^note-23] This means that there are some small bits of clay, each of which has retained its identity over time. On July 1ˢᵗ, these bits of clay were so arranged that they made up the *as* (i.e., they were a covering of the *as*). On July 2ⁿᵈ, they were arranged differently, in such a way that they made up the *bs*. This doesn’t require the existence of minimal parts of clay. It only requires the existence of a common division of the *as* and the *bs* into certain bits of clay. (See Steen 2012, section 2.4, for metaphysical considerations concerning the non-singularist or pluralist approach.)[^steen-2012]
    step1: |-
      按 Nicolas（2008），当能为 *a* 与 *b* 选出一个共同的非单数覆盖时，句子为真。[^note-23] 这意味着有一些小黏土块，各自跨时间保持同一。7 月 1 日，这些黏土块以某种方式排列，构成了那几个 *a*（即它们是 *a* 的覆盖）。7 月 2 日，它们以不同方式排列，构成了那几个 *b*。这并不要求黏土有极小部分，只要求存在把 *a* 与 *b* 共同划分为某些黏土块的划分。（关于非单数论或复数论进路的形而上学考量，见 Steen 2012 第 2.4 节。）[^steen-2012]
    step2: |-
      按 Nicolas（2008），能为 *a* 与 *b* 选出共同的非单数覆盖时，句子为真。[^note-23] 就是说，有些小黏土块各自跨时间保持同一：7 月 1 日它们以某种方式排列，构成那几个 *a*（是 *a* 的覆盖）；7 月 2 日以另一种方式排列，构成那几个 *b*。这不需要黏土有极小部分，只需要存在把 *a* 与 *b* 共同划分为某些黏土块的划分。（非单数论或复数论进路的形而上学考量，见 Steen 2012 第 2.4 节。）[^steen-2012]
