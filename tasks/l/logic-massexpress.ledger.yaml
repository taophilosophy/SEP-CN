    source: |-
      [^note-20]: For Gillon, the denotation of a mass noun *M* is the set having for sole member the sum of everything that is M. However, this makes it hard to specify adequate truth-conditions for *This is M*.
    step1: |-
      [^note-20]: 对 Gillon 来说，物质名词 *M* 的指称是以一切为 M 者之和为唯一成员的集合。然而这使 *This is M* 的适当真值条件难以规定。
    step2: |-
      [^note-20]: 在 Gillon 看来，物质名词 *M* 的指称是以一切为 M 者之和为唯一成员的集合；可这样 *This is M* 的适当真值条件反而难规定。
  - id: 167
    kind: note
    source: |-
      [^note-21]: By contrast, the interpretation of a sentence containing the demonstrative noun phrase *This M* depends on the choice of an *M*-covering of the noun phrase’s denotation. And [*This M*] is the set having for sole member the sum of the M demonstrated in the circumstance. Relative to this choice of covering *C*: *This M P* is true iff *C* ⊆ [*P*].
    step1: |-
      [^note-21]: 相比之下，含指示名词短语 *This M* 的句子的解释，取决于为该名词短语指称选定一个 *M*-覆盖；而 [*This M*] 是以该情形中被指示之 M 的和为唯一成员的集合。相对于所选覆盖 *C*：*This M P* 为真，当且仅当 *C* ⊆ [*P*]。
    step2: |-
      [^note-21]: 相比之下，含指示名词短语 *This M* 的句子，其解释取决于为该短语指称选定一个 *M*-覆盖；[*This M*] 以该情形中被指示之 M 的和为唯一成员。相对于所选覆盖 *C*：*This M P* 为真，当且仅当 *C* ⊆ [*P*]。
