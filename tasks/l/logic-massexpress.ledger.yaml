      In what precedes, we have looked at the semantics of various kinds of sentences where mass nouns appear. But we haven’t considered whether there are logical relations between such sentences, i.e., whether the semantics makes up for an adequate logic of mass nouns. This is the topic of this section. An appropriate semantics for mass nouns should guarantee things like what follows. (For a more detailed discussion, see Pelletier & Schubert 2003: 63–74.)[^pelletier-2003]
    step1: |-
      前文考察了物质名词出现于其中的各类句子的语义，但未考虑这类句子之间是否存在逻辑关系，即语义是否撑得起物质名词的适当逻辑。这是本节主题。物质名词的适当语义应保证如下这类推理成立。（更详细讨论见 Pelletier & Schubert 2003: 63–74。）[^pelletier-2003]
    step2: |-
      前文看了物质名词所入各类句子的语义，但没问这类句子之间有没有逻辑关系——语义是否撑得起物质名词的适当逻辑。这是本节主题。适当的语义应保证下述推理成立。（详细讨论见 Pelletier & Schubert 2003: 63–74。）[^pelletier-2003]
