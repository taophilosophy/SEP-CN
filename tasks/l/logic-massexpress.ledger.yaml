      How can we avoid these difficulties? Roeper (1983), Lønning (1987) and Higginbotham (1994) propose that the solution lies in defining predication and negation in a certain way within a Boolean algebra.[^note-12] They consider only cases where predicates (mass nouns included) are “homogeneous”, like above. Following ter Meulen (1981), a predicate is said to be homogeneous if it applies both cumulatively and distributively. Predicates like *gold* and *in the safe* may indeed seem to apply distributively and cumulatively, if we stay at the macroscopic level for *gold*. In this approach, mass nouns and predicates denote elements in a certain Boolean algebra, (*B*,≤,∨,∧0,1). ≤ is the order (or parthood) relation. ∨ is the join (or sum) operation. ∧ is the meet (or intersection) operation. 0 is the smallest element. 1 is the largest element. As in any Boolean algebra, every element *x* has a Boolean complement, noted −*x* (cf. Monk 2018)[^monk-2018].
    step1: |-
      怎样避开这些困难？Roeper（1983）、Lønning（1987）与 Higginbotham（1994）提出，解法在于在某个布尔代数中以特定方式定义述谓与否定。[^note-12] 他们只考虑谓词（包括物质名词）为“齐性的”的情形，如上例。沿 ter Meulen（1981），若一个谓词既作累积指称又作分配指称，就称它齐性。只要对 *gold* 停留在宏观层面，*gold* 与 *in the safe* 这类谓词似乎确实既作分配指称又作累积指称。在此进路中，物质名词与谓词指称某个布尔代数 (*B*,≤,∨,∧0,1) 中的元素。≤ 是序（或部分）关系，∨ 是并（或和）运算，∧ 是交（或交叠）运算，0 是最小元，1 是最大元。与任何布尔代数一样，每个元素 *x* 都有布尔补，记作 −*x*（参看 Monk 2018）[^monk-2018]。
    step2: |-
      怎样绕开？Roeper（1983）、Lønning（1987）、Higginbotham（1994）认为，解法是在某个布尔代数里以特定方式定义述谓与否定。[^note-12] 他们只处理谓词（含物质名词）为“齐性”的情形，如上例。沿 ter Meulen（1981），谓词既累积又分配地指称，就叫齐性。只要 *gold* 停在宏观层面，*gold*、*in the safe* 这类谓词似乎确实既分配又累积。这条进路里，物质名词与谓词指称某布尔代数 (*B*,≤,∨,∧0,1) 的元素：≤ 是序（部分）关系，∨ 是并（和），∧ 是交（交叠），0 最小、1 最大。如任何布尔代数一样，每个元素 *x* 有布尔补，记作 −*x*（参看 Monk 2018）[^monk-2018]。
