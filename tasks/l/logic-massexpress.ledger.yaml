      This solves the problems encountered above by the purely mereological approach and the purely set-theoretic approach. Indeed, what precedes suggests that mass predication (*to be M*), like count predication or adjectival predication, is well rendered in terms of set membership. The purely set-theoretic approach has problems with definite descriptions because it just uses sets, avoiding sums. But as we saw earlier, mass nouns have the property of cumulative reference. If there is some clay in two cups, then one can refer to all of the clay as the clay in the two cups. This suggests that portions of clay can be summed, and that the set of portions of clay should have the structure of a join semi-lattice. When this is guaranteed for any mass noun *M*, the semantic value of definite descriptions can easily be specified. The description the *M* that Q denotes the sum of everything that is some M that Q. It is such a sum that is weighted in *The gold on the table weighs fifty grams*. And it is such a sum whose identity over time is asserted in *The clay that was on the desk on July 1ˢᵗ is identical with the clay that was on the table on July 2ⁿᵈ.* (Another treatment of identity over time is presented in section 9.)
    step1: |-
      这就解决了前文纯分体论进路与纯集合论进路遇到的难题。确实，前文表明，物质述谓（*是 M*）像可数述谓或形容词述谓一样，用集合成员关系来刻画得不错。纯集合论进路在限定摹状词上出问题，是因为它只用集合而避开了和。但如前所见，物质名词有累积指称的性质。若两个杯子里有黏土，则可指称两只杯中的全部黏土。这表明黏土的份可以求和，黏土份之集应当具有并半格的结构。只要对任何物质名词 *M* 都保证这一点，限定摹状词的语义值就容易规定。摹状词 the *M* that Q 指称一切作为某个“是 Q 的 M”者的和。*The gold on the table weighs fifty grams* 中称重的正是这样一个和；*The clay that was on the desk on July 1ˢᵗ is identical with the clay that was on the table on July 2ⁿᵈ.* 中断言跨时间同一性的，也是这样一个和。（跨时间同一性的另一种处理见第 9 节。）
