      [^note-23]: Following Gillon (1992), Nicolas (2008) takes a sentence containing a mass noun to be ambiguous with respect to coverings. As mentioned in the remark at the end of section 8, an alternative view is that the sentence is indeterminate with respect to coverings. It is true if there exists a suitable covering, false otherwise.
