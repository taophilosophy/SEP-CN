      因此可以怀疑瓦拉是否成功调和了伊壁鸠鲁快乐主义与基督教道德。他似乎论证说，伊壁鸠鲁立场只在基督降临之前的时期有效。在我们未得救赎的状态中，我们正当地算作寻求快乐的动物，受自利与功利动机支配。然而基督降临之后，图景不同：拒斥伊壁鸠鲁式快乐，我们应当选择基督教 *honestas*（德性）的严酷艰难生活，作为迈向天国至福的一步。然而，这两种人性观并不那么容易结合。一方面，是把快乐评价为人性心理中的基本原理——这一评价由 *voluptas*（快乐）、*beatitudo*（至福）、*fruitio*（享用）、*delectatio*（愉悦）与 *amor*（爱）的术语等同所确认和强调。另一方面，瓦拉武断地断言有两种快乐：尘世的快乐，是恶行之母；天国的快乐，是德性之母；如果我们想享受后者，就应戒绝前者；而且，如果不置于人类命运的更广视野中，自然的、前基督的生活是“空虚而应受惩罚的”。换言之，我们受命去过基督教 *honestas* 的艰辛生活——受节制、克己与合宜支配——同时又去过一种快乐主义的生活，它由对感官的快乐的、自由的、自然的满足构成。
