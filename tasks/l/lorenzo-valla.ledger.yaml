      His main concern in the first book is to simplify the Aristotelian-scholastic apparatus. For Valla, the world consists of things, simply called *res*. Things have qualities and do or undergo things (which he refers to as “things” as well). Hence, there are three basic categories: substance, quality, and action. At the back of Valla’s mind are the grammatical categories of noun, adjective, and verb; but in many places he points out that we cannot assume that, for instance, an adjective always refer to a quality or a verb to an action (*Repastinatio*, 1:134–156; 425–442; *DD* 1:240–80). These three categories are the only ones Valla admits; the other Aristotelian categories of accidents such as place, time, relation and quantity can all be reduced to quality or action. Here, too, grammar plays a leading role in Valla’s thought. From a grammatical point of view, qualities such as being a father, being in the classroom, or being six-feet tall all tell us something about how a particular man is qualified; and there is, consequently, no need to preserve the other Aristotelian categories.
    step1: |-
      他在第一卷中的主要关切是简化亚里士多德-经院的装置。对瓦拉而言，世界由事物构成——简单地称为 *res*。事物有品质，做或承受事情（他也把这些称为“事物”）。因此有三个基本范畴：实体、品质与行动。瓦拉心中想的是语法范畴——名词、形容词与动词；但在许多地方他指出我们不能假定例如形容词总是指一种品质、动词总是指一种行动（*Repastinatio*, 1:134–156; 425–442; *DD* 1:240–80）。这三个范畴是瓦拉唯一承认的；亚里士多德的其他偶性范畴——如位置、时间、关系与数量——都可以被还原为品质或行动。在这里语法同样在瓦拉的思想中起主导作用。从语法观点看，诸如作为父亲、在教室里、六英尺高这些品质，都告诉我们一个特定的人是怎样被限定的；因此没有必要保留亚里士多德的其他范畴。
