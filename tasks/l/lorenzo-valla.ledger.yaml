      The same critical spirit also infuses Valla’s work on moral philosophy. In his dialogue, published as *De voluptate* in 1431, when he was still in his mid-twenties, and revised two years later under the title *De vero bono* (*On the True Good*), Valla presents a discussion between an “Epicurean,” a “Stoic,” and a “Christian” on the age-old question: what is the highest ethical good? The result of this confrontation between pagan and Christian moral thought is a combination of Pauline fideism and Epicurean hedonism, in which the Christian concepts of charity and beatitude are identified with hedonist pleasure, and the “Stoic” concept of virtue is rejected (Valla, *De vero falsoque bono*). Valla thus treats Epicureanism as a stepping-stone to the development of a Christian morality based on the concept of pleasure, and repudiates the traditional synthesis of Stoicism and Christianity, popular among scholastics and humanists alike. The substance of the dialogue is repeated in a long chapter in his *Repastinatio* (*Repastinatio*, 1:73–98; 2:411–418; *DD* 1:130–75).
    step1: |-
      同样的批判精神也贯穿瓦拉的道德哲学著作。在其 1431 年出版为《论快乐》的对话中——当时他还在二十五岁上下——并在两年后以《论真善》（*De vero bono*）为题修订的版本中，瓦拉呈现了“伊壁鸠鲁派”“斯多亚派”与“基督徒”之间关于那个古老问题的讨论：最高的伦理善是什么？这场异教与基督教道德思想交锋的结果，是保罗式信仰主义与伊壁鸠鲁快乐主义的结合——其中基督教的仁爱与至福概念被等同于快乐主义的快乐，而“斯多亚”德性概念遭拒斥（Valla, *De vero falsoque bono*）。瓦拉由此把伊壁鸠鲁主义当作发展一种基于快乐概念的基督教道德的垫脚石，并拒斥斯多亚主义与基督教的传统综合——后者在经院学者与人文主义者中同样流行。对话的实质内容在《重新耕耘》的一个长章中重复出现（*Repastinatio*, 1:73–98; 2:411–418; *DD* 1:130–75）。
