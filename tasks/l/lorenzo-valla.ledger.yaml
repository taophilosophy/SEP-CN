      通过把快乐等同于爱，瓦拉可以论证：爱或快乐才是我们的终极目的。这蕴涵一个惊人的说法：上帝不是为其自身之故而被爱，而是为爱之故：“因为没有什么东西是为其自身之故或为作为另一目的的别的东西之故而被爱，而爱本身即是目的”（*Repastinatio*, 2:417）。这是一个大胆的举动。传统上，人们说上帝是为自身之故而被爱，而非为其在获得别的东西上的用处。许多思想家同意奥古斯丁：贪爱须与友爱相区分；就天国至福而言，使用须与享用相区分。我们可以把某物当作达成目的的手段来爱（使用），也可以为其自身之故而爱它（享用）。但由于瓦拉坚持快乐是我们的最高善，上帝只能作为达成该目的的手段而被爱。
