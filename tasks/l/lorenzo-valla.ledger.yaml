      Without rejecting the syllogism *tout court*, Valla is scathing about its usefulness. He regards it as an artificial type of reasoning, unfit to be employed by orators since it does not reflect the natural way of speaking and arguing. What is the use, for example, of concluding that Socrates is an animal if one has already stated that every man is an animal and that Socrates is a man? It is a simple, puerile, and pedantic affair, hardly amounting to a real *ars* (art). Valla’s treatment of the syllogism clearly shows his oratorical perspective. Following Quintilian, he stresses that the nature of syllogistic reasoning is to establish proof. One of the two premises contains what is to be proven (*que probatur*), and the other offers the proof (*que probat*), while the conclusion gives the result of the proof—into which the proof “goes down” (*in quam probatio descendit*). It is not always necessary, therefore, to have a fixed order (major, minor, conclusion). If it suits the occasion better, we can just as well begin with the minor, or even with the conclusion. The order is merely a matter of convention and custom (*Repastinatio*, 1:282–286; 2:531–534; *DD* 2:216–39).
    step1: |-
      瓦拉并未全盘拒斥三段论，却对其用处毫不留情。他视之为一种人为的推理，不适合演说家使用，因为它不反映说话与论证的自然方式。例如，如果已经陈述了每个人都是动物、苏格拉底是人，再得出苏格拉底是动物的结论有什么用？这是简单、幼稚而迂腐的事情，很难算得上一门真正的 *ars*（技艺）。瓦拉对三段论的处理清楚显示其演说术视角。他跟随昆体良，强调三段论推理的本性在于确立证明。两个前提之一包含要被证明的东西（*que probatur*），另一个提供证明（*que probat*），而结论给出证明的结果——证明“下行”入其中（*in quam probatio descendit*）。因此并不总是需要固定的顺序（大前提、小前提、结论）。如果场合更合适，我们同样可以从小前提开始，甚至从结论开始。顺序只是惯例与习俗问题（*Repastinatio*, 1:282–286; 2:531–534; *DD* 2:216–39）。
