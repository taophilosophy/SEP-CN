      In his *Repastinatio dialectice et philosophie*, which is extant in three versions with slightly different titles, Valla attacks what he sees as the foundations of scholastic-Aristotelian philosophy and sets out to transform Aristotelian dialectic. As the title of the first version clearly indicates, he wants to “re-plough” the ground traditionally covered by the Aristotelian scholastics. The term *repastinatio* means not only “re-ploughing” or “re-tilling” but also “cutting back” and “weeding out.” Valla desires to weed out everything he regards as barren and infertile in scholastic thought and to re-cultivate the ground by sprinkling it with the fertile waters of rhetoric and grammar. His use of *repastinatio* indicates that he is setting out a program of reform rather than of destruction, in spite of his often aggressive and polemical tone. Book I is devoted mainly to metaphysics, but also contains chapters on natural philosophy and moral philosophy, as well as a controversial chapter on the Trinity. In Books II and III Valla discusses propositions and forms of argumentation such as the syllogism.
    step1: |-
      在其《辩证法与哲学的重新耕耘》——现存三个版本、标题略有不同——中，瓦拉攻击他所认为的经院-亚里士多德哲学的基础，并着手改造亚里士多德辩证法。如第一版的标题清楚地表明的，他想“重新耕耘”亚里士多德经院学者传统上覆盖的地盘。*repastinatio* 一词不仅意味着“重新犁地”或“重新耕作”，还意味着“修剪”与“除草”。瓦拉想要除去他认为经院思想中一切贫瘠不毛的东西，并以修辞学与语法的肥沃之水浇灌来重新培育这块地。他对 *repastinatio* 的使用表明他提出的是一个改革的方案而非毁灭的方案——尽管他的语气常常攻击性与论辩性。第一卷主要致力于形而上学，但也包含自然哲学与道德哲学的章节，以及一个有争议的三位一体章节。在第二与第三卷中瓦拉讨论命题与论证形式如三段论。
