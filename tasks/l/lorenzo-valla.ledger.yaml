      In his discussion of the syllogism Valla does not refer to an important principle employed by Aristotle and his commentators: *dici de omni et nullo* (to be said/predicated about all and about none). To quote Peter of Spain’s *Summulae logicales*: “*To be said of every* [*dici de omni*] is when there is nothing to to be taken under the subject [*nichil est sumere sub subiecto*] of which the predicate may not be said, like ‘every man runs’: here, running is said of every man, and under man there is nothing to to be taken of which running is not said. *To be said of none* [*de nullo*] is when there is nothing to be taken under the subject from which the predicate may not be eliminated, like ‘no man runs’: here, running is eliminated from any man at all [*quolibet homine*]” (ed. L. M. de Rijk 1972, 43; ed. Copenhaver et al., 2014, 170). This principle led Aristotle to conclude that only four moods of the first figure were immediately valid. That Valla does not make use of this fundamental condition is understandable from his oratorical point of view, since it would be an uninteresting or even irrelevant criterion of validity. It is therefore not surprising that he thinks that we might as well “reduce” the first figure to the second rather than vice versa. Likewise, from his oratorical point of view, he can treat the third figure of the syllogism only with contempt: it is a “completely foolish” form of reasoning; no one reasons as follows: every man is a substance; every man is an animal; therefore, some animal is a substance. In a similar vein, he rejects the use of letters in the study of syllogisms (*Repastinatio*, 1:297–300; 2:546–548; *DD* 2:264–71).
    step1: |-
      在其三段论讨论中，瓦拉没有提到亚里士多德及其注释者所用的一个重要原则：*dici de omni et nullo*（述说于一切与无一）。引用西班牙的彼得《逻辑小集》：“述说于一切［*dici de omni*］是指：在主词之下没有任何可取的东西使谓词不能述说，如‘每个人都在跑’：这里，‘跑’被述说于每个人，而在人之下没有任何可取的东西使‘跑’不被述说。述说于无一［*de nullo*］是指：在主词之下没有任何不可从中消除谓词的东西，如‘没有人在跑’：这里，‘跑’从任何一个人那里被消除［*quolibet homine*］”（ed. L. M. de Rijk 1972, 43; ed. Copenhaver et al., 2014, 170）。这一原则使亚里士多德得出结论：只有第一格的四个式是直接有效的。瓦拉没有利用这一根本条件，从其演说术观点看是可以理解的：它会是一个无趣的、甚至不相干的有效性判准。因此不足为奇，他认为我们不妨把第一格“还原”为第二格，而不是相反。同样，从其演说术观点出发，他只能以轻蔑态度对待三段论第三格：它是一种“完全愚蠢”的推理形式；没有人会这样推理：每个人都是实体；每个人都是动物；所以，有些动物是实体。类似地，他拒斥在三段论研究中使用字母（*Repastinatio*, 1:297–300; 2:546–548; *DD* 2:264–71）。
