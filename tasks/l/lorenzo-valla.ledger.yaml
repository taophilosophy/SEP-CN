      瓦拉坚持从说服与用处出发考察和评估论证，这使他不仅批评三段论，也批评其他不那么形式化的论证模式。这些模式通常涉及诘问，导致出乎意料或不想要的结论，或造成困境局面。一些学者把瓦拉对这些不那么形式化或非形式论证的兴趣，看作对一般知识中确定性之可能性持怀疑态度的表现。另一些学者则对这一解释提出严重质疑。然而我们可以确定地说：瓦拉是最早研究并分析堆垛论证、二难推理等论证的人之一。堆垛论证旨在引起对确定精确界限之可能性的怀疑，尤其是对数量。如果我从堆中取走一粒，它还是堆吗？当然是。取走两粒呢？如此等等，直到堆只剩一粒——这当然是一个不可接受的结论。似乎不可能确定堆恰好不再是堆的那一刻，而任何确定这一时刻的尝试似乎都涉及特设的决定，因为堆并不因仅取走一粒就不再是堆。瓦拉讨论了许多类似情形，并评论其谬误性质。
