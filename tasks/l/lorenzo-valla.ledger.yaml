      Valla’s principal *bêtes noires* are Aristotle, Boethius, Porphyry, and Peter of Spain, but he also speaks in general terms of the entire *natio peripatetica* (nation of Peripatetics). He frequently refers to *isti* (those), a suitably vague label for the scholastic followers of Aristotle—including both dialecticians and theologians. It has often been claimed that Valla is attacking late medieval scholasticism; but it must be said that he does not quote any late medieval scholastic philosophers or theologians. He generally steers clear of their questions, arguments, and terminology. If we compare Valla’s *Repastinatio* with, for example, Paul of Venice’s *Logica* *parva* (*The Small Logic*), we quickly perceive the immense difference in attitude, argument, and approach. Moreover, as noted above, Valla’s grammatical and oratorical approach is fundamentally different from Ockham’s terminism. He probably thought that he did not need to engage with the technical details of scholastic works. It was sufficient for him to establish that there was a huge distance between his own approach and that of the scholastics. Once he had shown that the scholastic-Aristotelian edifice was built on shaky foundations, he did not care to attack the superstructure, so to speak. And Valla proved to his own satisfaction that these foundations were shaky by showing that the terminology and vocabulary of the scholastics rested on a misunderstanding of Latin and of the workings of language in general. But even though his criticisms are mainly addressed to Aristotle, Boethius, and Porphyry, his more general opinion of Aristotelianism was, of course, formed by what he saw in his own time. He loathed the philosophical establishment at the universities, their methods, genres, and, above all, their style and terminology. He thought that they were slavishly following Aristotle. In his view, however, a true philosopher does not hesitate to re-assess any opinion from whatever source; refusing to align himself with a sect or school, he presents himself as a critical, independent thinker (*Repastinatio*, 1:1–8; 2:359–363; *DD* 1:2–12). Although scholasticism remained a strong and resilient tradition until the end of the seventeenth century, Valla and other humanists considered it ossified and out of tune with how people actually speak, think, and argue.
    step1: |-
      瓦拉最痛恨的是亚里士多德、波爱修斯、波菲利与西班牙的彼得，但他也笼统地谈论整个 *natio peripatetica*（逍遥学派族群）。他频繁提及 *isti*（“那些人”）——对亚里士多德的经院追随者（既包括辩证论者也包括神学家）的一个含糊得恰到好处的标签。人们常声称瓦拉攻击的是晚期中世纪经院主义；但必须说，他没有引用任何晚期中世纪经院哲学家或神学家。他一般回避他们的问题、论证与术语。如果拿瓦拉的《重新耕耘》与例如威尼斯的保罗的《小逻辑》（*Logica parva*）相比，我们很快察觉到态度、论证与进路上的巨大差异。此外，如上所述，瓦拉的语法与演说术进路从根本上不同于奥卡姆的词项主义。他可能认为不需要与经院著作的技术细节打交道。对他来说，确立自己的进路与经院学者的进路之间存在巨大距离就足够了。一旦他表明经院-亚里士多德大厦建立在动摇的地基上，他就不屑于攻击上层建筑，可以这么说。瓦拉让自己满意地证明了这些地基是动摇的：他表明经院学者的术语与词汇建立在对拉丁语以及一般语言运作的误解之上。不过，尽管他的批评主要针对亚里士多德、波爱修斯与波菲利，他对亚里士多德主义的更一般看法当然是根据他在自己时代所见形成的。他憎恶大学中的哲学建制、其方法、文类，尤其是其风格与术语。他认为他们奴隶般跟随亚里士多德。然而照他的看法，真正的哲学家毫不犹豫地重新评估来自任何来源的任何意见；拒绝与任何宗派或学派结盟，他把自己呈现为一个批判性的、独立的思想者（*Repastinatio*, 1:1–8; 2:359–363; *DD* 1:2–12）。虽然经院主义直到十七世纪末仍是一个强大而有韧性的传统，瓦拉与其他人文主义者认为它僵化了，与人们实际说话、思考、论证的方式不合拍。
