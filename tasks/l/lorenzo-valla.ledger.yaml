      这一进路也见于瓦拉对命题——三段论或论证由之构成——的分析。命题传统上按量（全称或特称）与质（肯定与否定）来划分。量与质由被称为 *signa*（标记、记号）的语词指示：“所有”“任何”“不”“没有人”等等。在《重新耕耘》第二卷中，瓦拉考虑的语词范围比中世纪逻辑学家广泛得多——后者主要与“所有”“有些”“无一”“没有人”打交道。在某种程度上，他的目的与他如此频繁攻击的辩证论者的目的并无不同，即研究质与否定的记号以及它们如何决定命题的范围。但对他来说只有一种适当的方法来进行这种研究：仔细考察这些语词在精炼且语法正确的拉丁语中被使用的形形色色的方式。不出所料，瓦拉批评对立方阵——把全称与特称之分同肯定与否定之分结合起来的四种陈述分类。对限于有限语词集这一相当任意的做法的类似批评，也被应用于经院的模态概念（Valla *Repastinatio*, 1:237–244; 2:491–497; *DD* 2:126–43）。经院学者通常只把以下六个词项当作模态词：“可能”“不可能”“真”“假”“必然”“偶然”。然而拉丁语在表达模态方面要丰富得多。运用精炼与有用等判准，瓦拉考虑了诸如“很可能/不太可能”“难/易”“确定/不确定”“有用/无用”“得体/不得体”“光荣/不光荣”等词项。这等于引入了一个全新的模态概念——它接近于对一个给定行动的副词性限定。
