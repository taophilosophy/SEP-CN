      瓦拉的另一个靶子是亚里士多德把德性视为两个极端之间的中道的说明。照瓦拉之说，每个个别的恶习反而是个别德性的对立面。他通过区分同一德性的两种不同意义来提出这一点，表明它们有不同的对立面。因此，当亚里士多德把坚毅视为鲁莽与怯懦这两种恶习之间的中道时，瓦拉论证坚毅有两个方面：勇敢作战与谨慎行事（例如在向得胜的敌人屈服时），其各自的对立面分别是怯懦与鲁莽。同样，慷慨不是吝啬与挥霍之间的中道，而是有两个方面：给予与不给予。挥霍是第一个方面的对立面，吝啬是第二个方面的对立面——对后者我们应使用节俭而非慷慨一词。更一般地说，把恶习说成不足与过度、把德性说成中道的术语是误导性的；德性与恶习不应“按照它们处在底部、半途还是顶端”来排序。有趣的是，现代学术中对亚里士多德的德性中道概念也提出了类似的批评（例如 W. D. Ross）。
