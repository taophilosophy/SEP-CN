      在描述与分析这个事物的世界时，瓦拉不仅受语法考量引导。他还用“常识”与我们想象力的限度作为衡量经院观念与定义的标尺。因此他认为设想没有任何形式的第一质料或没有任何质料的形式是荒谬的，或把线定义为没有宽度的东西、把点定义为不占空间的可分量是荒谬的。瓦拉的想法是：诸如可分性与数量这类观念只在平常事物的世界中才是恰当的。对他来说只有具有实际形状与维度的物体世界；线与点是这些东西的部分，但只是——如他似乎暗示的——在派生的意义上，换言之，作为被物体或其部分填充的位置或空间。如果我们想测量或草绘一个物体（的一部分），我们可以选择其上的两点，通过在纸上或心中画点和线来测量它们之间的长度——经过这一过程这些点与线成为我们世界的可见的、可分的部分（*Repastinatio*, 1:142–147; 2:427–431; *DD* 254–64）。但从这种图示功能抽象出来并推定一个具有自身特殊数量的点与线的世界，将是错误的。它们只是测量或勾勒物体的辅助工具。用现代的话说，瓦拉似乎在说关于这些实体的本体论问题——它们存在吗？它们如何存在？——相当于范畴错误，等同于问德性是什么颜色。
