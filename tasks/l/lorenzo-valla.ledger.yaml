      Religious considerations also led Valla to find fault with another fundamental tenet of Aristotelian scholastic thought: the Tree of Porphyry (*Repastinatio*, 1:46–50; 2:389–391; *DD* 1:82–88). Valla has several problems with the Tree. First of all, it puts substance, rather than thing, on top. For Valla, however, pure substance does not exist, since a thing is always already a qualified substance. He also thinks that there is no place for a human being in the Tree of Porphyry. Since the Tree divides substance into the corporeal and the spiritual, it is difficult to find a place for a human being, consisting of both soul and body. Moreover, the Tree covers both the divine and the created order, which leads to inappropriate descriptions of God and angels, to which the term “animal” should not be applied, since they do not have a body. Valla, therefore, divides Porphyry’s Tree into three different trees: one for spiritual substance, one for corporeal substance, and one for what he calls “animal,” that is, those creatures which consist of both body and soul (*Repastinatio*, 1:49–50; 2:422–424; *DD* 1:88). It seems that what Valla gains over Porphyry by disentangling the supernatural from the natural order, he loses by having to admit that he cannot place Christ in any of his three trees, since he is not only human but also God.
    step1: |-
      宗教考量也使瓦拉找出了亚里士多德经院思想的另一个基本信条的毛病：波菲利之树（*Repastinatio*, 1:46–50; 2:389–391; *DD* 1:82–88）。瓦拉对波菲利之树有几个问题。首先，它把实体而非事物放在顶端。但对瓦拉来说纯粹实体不存在——因为一个事物总是已经是一个有品质的实体。他还认为在波菲利之树中找不到人的位置。既然树把实体分为有形体的与精神的，就很难为既由灵魂又由身体构成的人找到一个位置。此外，树涵盖了神圣秩序与受造秩序二者，这导致对上帝与天使的不当描述——“动物”一词不应用于它们，因为它们没有身体。因此瓦拉把波菲利之树分为三棵不同的树：一棵给精神实体，一棵给有形实体，一棵给他所谓的“动物”——即由身体与灵魂构成的那些受造物（*Repastinatio*, 1:49–50; 2:422–424; *DD* 1:88）。瓦拉通过把超自然从自然秩序中解开而胜过波菲利，但他必须承认自己无法把基督置于其三棵树的任何一棵中——因为他不仅是人还是上帝——这似乎又使他失去了所得。
