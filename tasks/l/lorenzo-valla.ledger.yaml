      Another of Valla’s targets is the Aristotelian account of virtue as a mean between two extremes. According to Valla, each individual vice is instead the opposite of an individual virtue. He makes this point by distinguishing between two different senses of the same virtue, showing that they have different opposites. So, while Aristotle regards fortitude as the mean between the vices of rashness and cowardice, Valla argues that there are two aspects to fortitude: fighting bravely and being cautious (for instance, in yielding to the victorious enemy), with cowardice and rashness as their respective opposites. Likewise, generosity is not the mean between avarice and prodigality, but has two aspects: giving and not giving. Prodigality is the opposite of the first aspect, avarice of the second, for which we should use the term frugality or thrift rather than generosity. More generally, the terminology of vices as defects and excesses and virtue as a mean is misleading; virtues and vices should not be ranked “according to whether they are at the bottom, or halfway up, or at the top.” Interestingly, a similar critique of Aristotle’s notion of virtue as a mean between two extremes has been raised in modern scholarship (for example, by W. D. Ross).
