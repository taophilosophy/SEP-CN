      Meanwhile he had moved to Pavia in 1431, stimulated by his friend Panormita (Antonio Beccadelli, 1394–1471)—with whom he was soon to quarrel—and had begun to teach rhetoric. He had to flee Pavia, however, in 1433 after having aroused the anger of the jurists. In a letter to a humanist jurist friend of his, Catone Sacco (1394–1463), Valla had attacked the language of one of the lawyers’ main authorities, Bartolus of Sassoferrato (1313–1357). After some travelling, in 1435 Valla found employment at the court of Alfonso of Aragon (1396–1458), who was trying to capture Naples. Though complaining about the lack of time, books and fellow humanists, Valla was immensely productive in this phase of his career. In 1439 he finished the first version of his critique of scholastic philosophy. Two years later he finished his *Elegantiae linguae Latinae*, a manual for the correct use of Latin syntax and vocabulary, which became a bestseller throughout Europe. As a humanist in the court of a king who was fighting against the pope, Valla demonstrated that the Donation of Constantine, which had served the papacy to claim worldly power, was a forgery. In the same years he composed a dialogue on free will and began working on his annotations to the standard Latin translation of the Bible, comparing it with the Greek text of the New Testament. He also wrote a dialogue *On the Profession of the Religious* (*De professione religiosorum*), in which he attacked the vow of obedience and asceticism taken by members of religious orders. Further, he worked on the text of Livy, wrote a history of the deeds of Alfonso’s father, and began re-reading and annotating Quintilian’s *Institutio oratoria* (*Education of the Orator*) in a manuscript which is still extant (Paris, Bibliothèque Nationale de France, lat. 7723). But Valla’s philological approach and his penchant for quarreling made him enemies at the Aragonese court. After his patron Alfonso had made peace with the pope in 1443, Valla’s role as an anti-papal polemicist may have shrunk. His enemies took advantage of the situation. The immediate occasion was Valla’s denial of the apostolic origin of the *Symbolum Apostolicum* (Apostle’s Creed). In a letter, now lost, to the Neapolitan lawyers he argued that a passage from Gratian’s *Decretum* that formed the basis of the belief in the apostolic origin of the Creed was corrupt and needed emendation. Powerful men at the court staged an inquisitorial trial to determine whether Valla’s works contained heretical and heterodox opinions. In preparation for the trial Valla wrote a self-defense (and later an “Apology”), but was rescued from this perilous situation by the intervention of the king. The whole affair must have fuelled Valla’s wish to return to Rome. In 1447 he made peace with the pope and became an apostolic *scriptor* (scribe), and later, in 1455, a papal secretary. In these years he revised some of his earlier works such as the *Repastinatio* and his notes on the New Testament, and translated Thucydides and Herodotus into Latin; his work on Thucydides, in particular, was to have an important impact on the study of this difficult Greek author. Always an irascible man, he continued to engage in quarrels and exchanged a series of invectives with his arch-enemy Poggio. He died in 1457, still working on a second revision of his *Repastinatio* (that is, the third version). He was buried in the Lateran, where his grave was removed in the sixteenth century, probably between the 1560s and 1580s at a time when his works were put on the Index; the present memorial is not Valla’s tombstone.
    step1: |-
      与此同时，他在朋友帕诺尔米塔（Panormita，即安东尼奥·贝卡代利，1394–1471——两人不久即争吵）的激励下于 1431 年迁往帕维亚，开始教授修辞学。但 1433 年他因激怒法学家而不得不逃离帕维亚。在致一位人文主义法学家朋友卡托内·萨科（Catone Sacco，1394–1463）的信中，瓦拉攻击了法学家主要权威之一萨索费拉托的巴尔托鲁（Bartolus of Sassoferrato，1313–1357）的语言。游历一段时间后，1435 年瓦拉在正试图攻取那不勒斯的阿拉贡的阿方索（1396–1458）宫廷找到职位。尽管抱怨缺少时间、书籍与人文主义同道，瓦拉在其生涯的这一阶段极为多产。1439 年他完成了其经院哲学批判的第一版。两年后他完成《拉丁语的优雅》——一部关于拉丁语正确用法的手册，成为全欧畅销书。作为一位效力于与教宗作战的国王宫廷的人文主义者，瓦拉证明了曾服务于教宗世俗权力主张的君士坦丁的赠礼是伪造的。同年他写了一篇关于自由意志的对话，并开始为圣经标准拉丁译本作注——将其与新约希腊文本对比。他还写了一篇对话《论修士的誓愿》（*De professione religiosorum*），攻击修会成员所立的服从与苦修誓愿。此外，他研究李维的文本，写了一部阿方索之父功业史，并在一卷至今尚存的手稿中开始重读并注释昆体良的《演说术原理》（巴黎，法国国家图书馆，lat. 7723）。但瓦拉的语文学进路及其好争辩的癖好使他在阿拉贡宫廷树敌。1443 年其庇护人阿方索与教宗和解后，瓦拉作为反教宗论辩者的角色可能缩减了。他的敌人趁虚而入。直接导火索是瓦拉否认《使徒信经》的使徒起源。在一封现已佚失的致那不勒斯法学家的信中，他论证说，构成信经使徒起源信仰之基础的格拉提安《教令集》中的一段经文是讹误的、需要校勘。宫廷权势人物策划了一场宗教裁判式审判，以确定瓦拉的著作是否含有异端与非正统观点。为准备审判，瓦拉写了一份自辩（后来还有一篇“申辩”），但被国王的干预从这一危险境地中救出。整个事件必定助长了瓦拉重返罗马的愿望。1447 年他与教宗和解，成为宗座书士；后来 1455 年成为教宗秘书。这些年里他修订了一些早期著作如《重新耕耘》与新约注释，并将修昔底德与希罗多德译为拉丁文；其修昔底德工作尤其对研究这位艰深的希腊作者产生了重要影响。他始终是个易怒的人，继续卷入争吵，与宿敌波焦交换了一系列谩骂。他 1457 年去世，仍在进行《重新耕耘》的第二次修订（即第三版）。他安葬于拉特兰，其墓在十六世纪——可能是在 1560 至 1580 年代之间其著作被列入《禁书目录》之时——被移除；现在的纪念碑并非瓦拉的墓碑。
