      Valla’s strategy is to reduce the traditional four virtues— prudence, justice, fortitude, and propriety (or temperance)—to fortitude, and then to equate fortitude with charity and love. For Valla, fortitude is the essential virtue, since it shows that we do not allow ourselves to be conquered by the wrong emotions, but instead to act for the good. As a true virtue of action, it is closely connected to justice and is defined as “a certain resistance against both the harsh and the pleasant things which prudence has declared to be evils.” It is the power to tolerate and suffer adversity and bad luck, but also to resist the blandishments of a fortune which can be all too good, thus weakening the spirit. Fortitude is the only true virtue, and it is a virtue that has everything to do with acting. On Valla’s view, virtue resides in the will, and it is from the will that our actions, to which we assign moral qualifications, proceed.
    step1: |-
      瓦拉的策略是把传统四德——明智、正义、坚毅与合宜（或节制）——还原为坚毅，然后把坚毅等同于仁爱与爱。对瓦拉而言，坚毅是本质性的德性，因为它表明我们不允许自己被错误的情感征服，而是为善而行动。作为行动的真德性，它与正义紧密相连，并被定义为“对明智已宣判为恶的严酷之事与愉悦之事的某种抵抗”。它是容忍与承受逆境和厄运的力量，但也是抵挡命运诱惑的力量——命运的眷顾可以好得过分，从而削弱精神。坚毅是唯一真正的德性，而且是一种与行动息息相关的德性。照瓦拉的看法，德性居于意志之中，我们的行动——我们对其作出道德限定——由意志发出。
