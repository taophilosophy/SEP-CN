      The appeal to common sense (or what Valla considers as such) also informs his critique of Aristotelian natural philosophy. He insists on commonplace observations and experiences as criteria for testing ideas and hypotheses. On this basis, many of Aristotle’s contentions, so Valla argues, are not true to the facts (*Repastinatio*, 1:98–112; *DD* 1:174–99). He rejects or qualifies a number of fundamental tenets of Aristotelian physics, for instance that movement is the cause of heat, that a movement is always caused by another movement, that elements can be transformed into one another, that each has its own proper qualities (heat and dryness for fire, heat and humidity for air, etc.), that there are pure elements, that the combination of heat and humidity is a sufficient condition for the generation of life, and so forth. Valla often uses *reductio ad absurdum* as an argumentative strategy: if Aristotle’s theory is true, one would expect to observe phenomena quite different from the ones we, in fact, do observe. In arguing, for instance, for the existence of a fiery sphere below the moon, Aristotle had claimed that “leaden missiles shot out by force melt in the air” (*De caelo* II.7, 289a26–28). Valla rejects this claim by appealing to ordinary experience: we never see balls—whether leaden, iron, or stone, shot out of a sling or a cannon—heat up in the air; nor do the feathers of arrows catch fire. If movement is sufficient to produce heat, the spheres would set the air beneath in motion; but no one has ever observed this. Arguably, the importance of Valla’s polemic here is not so much the quality of his arguments as the critical tendency they reveal, the awareness that Aristotle’s conclusions often do not conform to daily experience. While he does not develop his critique in the direction of an alternative natural philosophy as later Renaissance philosophers such as Bernardino Telesio (1509–1588) and Francesco Patrizi of Cherso (1529–1597) would do, Valla contributed to undermining faith in the exclusive validity of the Aristotelian paradigm.
    step1: |-
      对常识（或瓦拉认为的常识）的诉诸也贯穿其对亚里士多德自然哲学的批评。他坚持以平常的观察与经验作为检验观念与假说的判准。在此基础上，许多亚里士多德的主张——瓦拉论证说——不符合事实（*Repastinatio*, 1:98–112; *DD* 1:174–99）。他拒斥或限定亚里士多德物理学的许多基本信条，例如运动是热的原因、一个运动总是由另一个运动引起、元素可以相互转化、每一种元素有其固有品质（火是热与干、气是热与湿等等）、存在纯粹元素、热与湿的结合是生命产生的充分条件等等。瓦拉常用 *reductio ad absurdum*（归谬法）作为论证策略：如果亚里士多德的理论是真的，人们会预期观察到与我们实际观察到的相当不同的现象。例如，在论证月下存在一个火球时，亚里士多德曾主张“以力射出的铅弹在空气中熔化”（《论天》II.7, 289a26–28）。瓦拉通过诉诸日常经验拒斥这一主张：我们从未看到球——无论铅的、铁的还是石头的，无论从投石索还是大炮射出——在空气中变热；箭的羽毛也不着火。如果运动足以产生热，诸天球就会使其下的空气运动；但从未有人观察到这一点。可以说，瓦拉在此论战的重要性与其说在于论证的质量，不如说在于它们揭示的批判倾向——即意识到亚里士多德的结论常常不符合日常经验。虽然他没有像后来文艺复兴哲学家贝尔纳迪诺·特莱西奥（Bernardino Telesio，1509–1588）与克尔索的弗朗切斯科·帕特里齐（Francesco Patrizi，1529–1597）那样把其批评发展为一种替代性自然哲学，瓦拉为动摇对亚里士多德范式之唯一有效性的信念作出了贡献。
