      An important way of seeing through deceptive arguments is to consider the weight of words carefully, and Valla gives other examples of fallacies which can easily be refuted by examining the meaning and usage of words and the contexts in which they occur (*Repastinatio*, 1:320–334; 2:568–578; *DD* 2:328–69). He considers the fallacies “collected by Aristotle in his *Sophistical Refutations* as for the most part a puerile art,” quoting the *Rhetorica ad Herennium* (2.11.16) to the effect that “knowledge of ambiguities as taught by dialecticians is of no help at all but rather a most serious hindrance.” Valla is not interested in providing a comprehensive list of deceptive arguments and errors or in studying rules for resolving them. He does not mention, for example, the basic division between linguistic (*in dictione*) and extra-linguistic (*extra dictionem*) fallacies. In a letter to a friend, Valla lists some “dialecticians”—Albert of Saxony (c. 1316–1390), Albert the Great (c. 1220–1280), Ralph Strode (fl. 1350–1400), William of Ockham, and Paul of Venice (c. 1369–1429) —but there is no sign that he had done more than leaf through their works on *sophismata* and *insolubilia* (Valla 1984, 201). The few examples he gives seem to come from Peter of Spain’s *Summulae logicales*. Nor was it necessary to have more than a superficial acquaintance with the works of these dialecticians in order to realize that their approach differed vastly from his. As he repeatedly states, what is required in order to disambiguate fallacies is not a deeper knowledge of the rules of logic but a recognition that arguments need to be evaluated within their wider linguistic and argumentative context. Such an examination of how words and arguments function will easily lay bare the artificial and sophistical nature of these forms of argumentation.
    step1: |-
      看穿欺骗性论证的一个重要方法是仔细考量语词的分量；瓦拉还给出其他谬误的例子——它们很容易通过考察语词的含义与用法及其出现的语境来驳斥（*Repastinatio*, 1:320–334; 2:568–578; *DD* 2:328–69）。他认为亚里士多德在《辩谬篇》中收集的谬误“大部分是一种幼稚的技艺”，并引用《致赫伦尼乌斯修辞学》（2.11.16）的大意说：“辩证论者所讲授的关于歧义的知识毫无帮助，反而是最严重的障碍。”瓦拉不感兴趣于提供欺骗性论证与错误的全清单，也不感兴趣于研究解决它们的规则。例如，他没有提到语言内（*in dictione*）与语言外（*extra dictionem*）谬误的基本区分。在致一位朋友的信中，瓦拉列出一些“辩证论者”——萨克森的阿尔伯特（约 1316–1390）、大阿尔伯特（约 1220–1280）、拉尔夫·斯特罗德（活跃于 1350–1400）、奥卡姆的威廉与威尼斯的保罗（约 1369–1429）——但没有迹象表明他做过更多的事，即翻阅过他们关于诡辩题（*sophismata*）与不可解问题（*insolubilia*）的著作（Valla 1984, 201）。他给出的少数例子似乎来自西班牙的彼得《逻辑小集》。也无需对这些辩证论者的著作有比浮光掠影更多的了解，就能意识到其进路与他的进路有天壤之别。正如他反复陈述的：要消除谬误的歧义，所需的不是对逻辑规则更深的了解，而是认识到论证必须在更广的语言与论证语境中评估。这种对语词与论证如何运作的考察，将轻易揭露这些论证形式的人为性与诡辩性。
