      与这一分析相关联的是瓦拉对他所呈现的经院关于抽象词与具体词之区分的观点的驳斥——即抽象词（“白”“父性”）总是仅指品质，而具体词（“白的”“父亲”）既指实体又指品质的观点（*Repastinatio*, 1:21–30; *DD* 1:36–54）。在对这一区分的细致讨论中——考虑格、数与性的语法范畴——瓦拉拒斥了这种观点似乎蕴涵的本体论承诺，并基于大量取自古典拉丁用法的例子表明：抽象词往往与其具体对应词含义相同（有益/效用、真/真理、诚实/诚实性）。这些词指具体事物本身——即实体、其品质或行动（或一个事物可被分解为的这三个组成部分的某种组合）。再次，瓦拉的主要关切是研究语言的运作方式以及它们如何关联于日常事物的世界——我们看到和经验到的世界。
