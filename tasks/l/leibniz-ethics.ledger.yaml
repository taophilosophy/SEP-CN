      We are now in a position to see how specifically the solid principles of philosophy strengthen morality. True philosophy (i.e., sound metaphysics) aids morality by providing grounds for assurance that in the end happiness is directly proportioned to merit. The more virtuous one is, the greater the happiness one can expect because one’s well-being does not completely depend on the goods of this life and because it is incompatible with God’s universal benevolence and infinite wisdom that even a single virtuous deed should go unrewarded and a vicious one unpunished. “After this,” Leibniz concludes, “it must be imprudent not to be just, because no one will fail to derive good or evil from what he will have done, according as it is just or unjust” (PW, “Meditation on the Common Concept of Justice,” pp. 58–9). Even though exceptional individuals may be able to remain virtuous at any apparent mortal cost, it follows from Leibniz’s metaphysics that there is in fact no mortal price to pay for being virtuous. On the contrary, virtue is necessary and sufficient for true happiness (for further reading on Leibniz’s natural law theory, see Brown 1995 and 2011a)[^brown-1995][^brown-2011a].
    step1: |-
      我们现在能够看到：哲学的坚实原则究竟如何具体地强化道德。真正的哲学（即健全的形而上学）援助道德的方式，是为如下确信提供根据：幸福最终与功绩直接成比例。一个人越有德性，就能期待越大的幸福，因为其福祉并不完全依赖此生的善物，而且连一个德性行动不受回报、一个恶行不受惩罚，都与上帝的普遍仁爱与无限智慧不相容。“在此之后”，莱布尼茨总结道，“不正义必定是轻率的，因为没有人不会从其所作所为中、按其为正义或不正义而得到善或恶”（PW, “Meditation on the Common Concept of Justice,” pp. 58–9）。尽管特出的个体也许能在任何表面上的尘世代价下保持德性，从莱布尼茨的形而上学可以推出：为德性实际上没有尘世代价要付。相反，德性对真正的幸福既是必要的也是充分的（莱布尼茨自然法理论的延伸阅读，见 Brown 1995 与 2011a）[^brown-1995][^brown-2011a]。
