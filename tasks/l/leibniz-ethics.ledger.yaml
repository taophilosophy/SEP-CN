      Since everything but God exhibits a finite level of perfection, everything but God also exhibits a degree of imperfection, some privation of reality. Privation of reality necessarily belongs to creation in the sense that it is logically impossible for a created thing to be unlimited (PE, “Principles of Nature and Grace, Based on Reason,” §9; T §20, p. 135). Only that whose existence is absolutely necessary and therefore depends on nothing other than itself has infinite perfection. For Leibniz, metaphysical evil is the privation of reality inherent in the natures of created things (T §21, p. 136) (for further reading on Leibniz’s conception of metaphysical evil, see Latzer 1994 and Antognazza 2014)[^antognazza-2014][^latzer-1994].
    step1: |-
      既然除上帝外一切事物都表现出有限的完善层级，它们也都表现出某种程度的不完善——实在的某种缺乏。实在的缺乏必然属于创造，其意义在于：受造物是无界限的，这在逻辑上不可能（PE, “Principles of Nature and Grace, Based on Reason,” §9; T §20, p. 135）。唯有其存在绝对必然、从而不依赖任何他物者，才有无限的完善。对莱布尼茨来说，形而上学恶是受造物本性中固有的实在之缺乏（T §21, p. 136）（关于莱布尼茨形而上学恶概念的延伸阅读，见 Latzer 1994 与 Antognazza 2014）[^antognazza-2014][^latzer-1994]。
    step2: |-
      既然除上帝外一切事物都表现出有限的完善层级，它们也都表现出某种程度的不完善——实在的某种缺乏。实在之缺乏必然属于创造：受造物无界限，这在逻辑上不可能（PE, “Principles of Nature and Grace, Based on Reason,” §9; T §20, p. 135）。唯有其存在绝对必然、从而不依赖任何他物者，才有无限的完善。对莱布尼茨而言，形而上学恶是受造物本性中固有的实在之缺乏（T §21, p. 136）（莱布尼茨形而上学恶概念的延伸阅读，见 Latzer 1994 与 Antognazza 2014）[^antognazza-2014][^latzer-1994]。
