      Descartes’ voluntarism leads to patience without hope because if God’s actions are arbitrary, in that they are not guided by perceptions of the good, then we cannot know—or at least have hope—that God is in fact acting for the good. This is problematic because of the limited sphere of control of the moral agent. According to Descartes, the moral agent can only control how she disposes of her volitions. Every state of affairs that occur outside of her volitions is ultimately under the control of God. Thus, while the moral agent might believe that she herself is virtuously acting for the good, voluntarism precludes the moral agent from having assurance that states of affairs that that fall under the purview of God’s control are occurring for the genuine good of creatures. There is no real divine providence in Descartes’ system.
    step1: |-
      笛卡尔的唯意志论导致没有希望的耐心，因为如果上帝的行动是任意的——即不受善的知觉引导——我们就不能知道、或至少不能希望上帝实际在为善行动。这是成问题的，因为道德行动者的控制范围有限。照笛卡尔的看法，道德行动者只能控制她如何处置其意志。发生在其意志之外的每一个事态最终都在上帝的控制之下。因此，虽然道德行动者也许相信她自己在为善而德性地行动，唯意志论使道德行动者无法确信：落入上帝控制范围的事态正在为受造物的真正之善发生。笛卡尔的体系中没有真正的神圣天意。
    step2: |-
      笛卡尔的唯意志论导致没有希望的耐心：如果上帝的行动是任意的——即不受善的知觉引导——我们就不能知道、至少不能希望上帝实际在为善行动。这是成问题的，因为道德行动者的控制范围有限。照笛卡尔之说，道德行动者只能控制她如何处置其意志；发生在其意志之外的每一个事态，最终都在上帝的控制之下。因此，虽然道德行动者也许相信她自己在为善而德性地行动，唯意志论使她无法确信：落入上帝控制范围的事态，正在为受造物的真正之善发生。笛卡尔的体系中没有真正的神圣天意。
