      In some texts, Leibniz emphasizes metaphysical perfection in God’s selection: “God has chosen the most perfect world, that is the one which is at the same time the simplest in hypotheses and the richest in phenomena” (PE, *Discourse* § 6, p. 39). On this view, our world is the best because it has been metaphysically constructed in the most optimal way (Couturat 1901, p. 237)[^couturat-1901]. However, in other texts, Leibniz suggests that God’s principal aim in creating the world was to maximize physical and moral perfection (happiness and virtue) for rational minds. For example, Leibniz writes, “the entire universe is made for minds, such that it can contribute to their happiness as much as possible” (PW, *Memoir for Enlightened Persons of Good Intention*, p. 105, see also *Discourse*§ 36; see also Grua 1953, pp. 338–9)[^grua-1953].
    step1: |-
      在一些文本中，莱布尼茨在上帝的选择中强调形而上学完善：“上帝选择了最完善的世界，即同时在假设上最简单、在现象上最丰富的世界”（PE, *Discourse* § 6, p. 39）。照这种观点，我们的世界是最好的，因为它在形而上学上以最优方式被构造（Couturat 1901, p. 237）[^couturat-1901]。然而在另一些文本中，莱布尼茨提示：上帝创造世界的主要目的，是为理性心灵最大化物理完善与道德完善（幸福与德性）。例如莱布尼茨写道：“整个宇宙是为心灵而造的，使它能尽可能多地促进其幸福”（PW, *Memoir for Enlightened Persons of Good Intention*, p. 105；另见 *Discourse*§ 36；另见 Grua 1953, pp. 338–9）[^grua-1953]。
