      To be inclined toward the perfection of another rational being is to be disposed to take pleasure in their perfection. Notice however that the object of the inclination, that which one’s view is fixed on, is not one’s own pleasure. This does not mean that an individual’s own pleasure cannot be the object of one of his or her desires. For most, self-love may be their predominant motive. Nevertheless, an individual can have an other-directed desire for the perfection of another rational being, which is to have disinterested love. To love disinterestedly, Leibniz explains, is to be “disposed to take pleasure in the perfection, well-being or happiness of the object of one’s love. And this involves not thinking about or asking for any pleasure of one’s own except what one can get from the happiness or pleasure of the loved one” (NE, p. 163). Since happiness is the outward manifestation of perfection, it makes no real difference whether love is said to have the perfection or the happiness of another rational being as its object. Leibniz thus makes the insightful suggestion that, though we do everything we do out of an inclination whose satisfaction gives us pleasure, this is perfectly compatible with desiring the perfection of another without any other end in view, which actually occurs whenever the object of our desire is another’s perfection or happiness. “In truth,” Leibniz concludes, “the happiness of those whose happiness pleases us turns into our own happiness, since things which please us are desired for their own sake” (PW, “Codex Iuris Gentium,” p. 171) (for further reading on Leibniz’s conception of disinterested love, see Brown 2011b)[^brown-2011b].
    step1: |-
      倾向于另一个理性存在者的完善，就是倾向于以其完善为乐。但要注意：倾向的对象——一个人的视线所固定者——不是自己的快乐。这并不意味着个人自己的快乐不能是其某个欲望的对象。对多数人而言，自爱也许是其主导动机。尽管如此，个人可以有一个指向他者的欲望——对另一个理性存在者之完善的欲望——这就是有无私的爱。无私地爱，莱布尼茨解释说，就是“倾向于为其所爱对象的完善、福祉或快乐而愉悦。这包含不想、不求自己任何快乐，除非能从所爱者的幸福或快乐中得到的快乐”（NE, p. 163）。既然幸福是完善的外在表现，说爱的对象是另一个理性存在者的完善还是幸福，实际上没有区别。莱布尼茨由此提出一个富有洞见的建议：尽管我们所做的一切都出于一个倾向——其满足给我们快乐——这完全可以与“以他者的完善为目的而别无他图”相容；每当我们的欲望对象是他者的完善或幸福时，这种情形实际发生。“实际上”，莱布尼茨总结道，“其幸福令我们愉悦的那些人的幸福，变成我们自己的幸福；因为令我们愉悦的东西是为其自身之故而被欲望的”（PW, “Codex Iuris Gentium,” p. 171）（莱布尼茨无私爱概念的延伸阅读，见 Brown 2011b）[^brown-2011b]。
