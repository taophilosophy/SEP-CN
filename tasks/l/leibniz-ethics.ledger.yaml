      Descartes’ denial of our knowledge of divine teleology must be read against his account of divine simplicity. If God has ends or purposes, it cannot in any way require a division between intellect and will whereby God perceives an end, and then wills and acts accordingly. This is objectionable to Leibniz, because his optimism implies that one of God’s main ends is to create the best of all possible worlds. However, the Cartesian moral agent cannot have any certainty that God created the best of all possible worlds, let alone a good world. Again, the moral agent must hold out and be excessively patient, and endure what comes to her. She cannot have contentment of mind in the face of such uncertainty.
    step1: |-
      笛卡尔对我们认识神圣目的论的否认，必须对照其神圣单一性说明来读。如果上帝有目的或目标，这无论如何不能要求理智与意志的分割——上帝知觉一个目的，然后相应地愿意并行动。这对莱布尼茨是可反对的，因为他的乐天主义蕴涵上帝的主要目的之一是创造一切可能世界中最好的世界。然而，笛卡尔式的道德行动者不能有任何确定性：上帝创造了一切可能世界中最好的世界，更不用说一个好的世界。再一次，道德行动者必须坚持并过度耐心，忍受降临于她的一切。面对这样的不确定，她不能有心灵的满足。
