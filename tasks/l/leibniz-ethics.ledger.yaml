      An interpretive issue in Leibniz’s ethics concerns the relationship between his optimism and views on progress. Leibniz tells Wedderkopf that “whatever has happened, is happening, or will happen is best” (L, p. 147; See also *Discourse* §3). But a famous objection to Leibniz’s optimism is that the world could have been constructed in a better manner, and at they very least in terms of morality and the human condition, the world could and should be able to get better over time. As such, the interpretive issue is whether Leibniz’s optimism implies that the best of all possible worlds is *maximally perfect* with respect to all perfections from moment to moment or whether there can be *progress in perfection* over time. In particular, considering Leibniz’s ethics, can there be *moral progress* in the best of all possible worlds? That is, net increases in happiness and virtue for rational minds or substances (and corresponding decreases in their suffering and vice)?
    step1: |-
      莱布尼茨伦理学中有一个解释性问题：他的乐天主义与进步观之间的关系。莱布尼茨告诉韦德科普夫：“凡已发生的、正发生的或将要发生的，都是最好的”（L, p. 147；另见《谈话》§3）。但对莱布尼茨乐天主义的一个著名反驳是：世界本可以构造得更好；至少就道德与人的境况而言，世界能够且应当能够随时间变得更好。因此，解释性问题在于：莱布尼茨的乐天主义是否蕴涵一切可能世界中最好的世界在所有完善上时刻都是*最大完善的*，还是完善可以随时间*进步*。特别是，考虑到莱布尼茨的伦理学，一切可能世界中最好的世界能有*道德进步*吗？即理性心灵或实体的幸福与德性之净增长（及其苦难与恶习的相应减少）？
    step2: |-
