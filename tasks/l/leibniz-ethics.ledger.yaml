      Leibniz seems to have an adequate understanding of Descartes’ ethics (PE, p. 241). He correctly identifies two fundamental features of Descartes’ ethics. First, the virtuous will must be guided by reason and knowledge of the truth (Letter to Princess Elizabeth 4 August 1645, AT IV: 267/CSMK: 258). Second, since the will is the only thing that is within our control, we are only responsible for our volitions (Letter to Princess Elizabeth 6 October 1645, AT IV 308/CSMK: 269; See also Letter to Queen Christina 20 November 1647, AT V: 83/CSMK: 325). We are not responsible for things that occur outside of our sphere of control, and thus virtue—the supreme good—does not depend on such contingencies. Regarding this second feature, Leibniz writes: “That is precisely the Stoic doctrine; it places the greatness and freedom of their much-praised wise man in his strength of mind to do without things that do not depend upon us, and endure things when they come in spite of ourselves” (PE, p. 241).
    step1: |-
      莱布尼茨似乎对笛卡尔的伦理学有充分的理解（PE, p. 241）。他正确地识别出笛卡尔伦理学的两个根本特征。第一，有德的意志必须由理性与真理的知识引导（致伊丽莎白公主信，1645 年 8 月 4 日，AT IV: 267/CSMK: 258）。第二，既然意志是唯一在我们控制之内的东西，我们只对自己的意志负责（致伊丽莎白公主信，1645 年 10 月 6 日，AT IV 308/CSMK: 269；另见致瑞典女王克里斯蒂娜信，1647 年 11 月 20 日，AT V: 83/CSMK: 325）。我们不对发生在我们控制范围之外的东西负责，因此德性——至善——不依赖这类偶然。关于第二个特征，莱布尼茨写道：“这正是斯多亚学说；它把他们备受赞美的智者之伟大与自由，置于其心灵力量之中：不需要不依赖我们的东西，并在这些东西违背我们意愿而来时忍受它们”（PE, p. 241）。
