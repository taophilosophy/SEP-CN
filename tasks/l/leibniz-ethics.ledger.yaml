      Similarly, Leibniz writes in the *Monadology*§5 2that “actions and passions among creatures are mutual” (PE, p. 219). According to Look (2007), what Leibniz is fundamentally expressing in such texts is a *conservation law for perfection:*For any substances *x* and *y* in the agent-patient rational, if substance *x* acts and thereby increases in perfection, substance *y* must thereby proportionally decrease in perfection. On Look’s interpretation of Leibniz’s idealism, everything in the universe is composed of the same type of thing (simple mind-like substances or monads); and consequently, all beings must be subject to the same laws. The moral and physical perfections of rational substances, then, cannot be exempt from the general laws that govern substances, which include the conservation law.
