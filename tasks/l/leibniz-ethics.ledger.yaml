      The intellectualist cast of Leibniz’s ethics stands out unmistakably in this passage. Knowledge of the order, rationality, and beauty of creation is necessary for happiness. So too is actively imitating that order. Together, they are sufficient. Without knowledge, action and the effort to promote the perfection of others do not necessarily meet with success and may even backfire, leading to greater physical evil. Without actively promoting rational order, knowledge alone does not lead to happiness. Leibniz’s ethics no doubt has an intellectualist character, but mere passive contemplation of the rational order of the universe is not the ideal of moral goodness. Instead, moral goodness combines knowledge of the rational order with the active promotion of rational order as far as possible (for a discussion of Leibniz’s view of the role of divine grace in the attainment of salvation, see Rutherford 2014)[^rutherford-2014].
    step1: |-
      莱布尼茨伦理学的理智主义色彩在这段话中清晰可见。对创造的秩序、理性与美的认识，是幸福所必需的；主动仿效那种秩序也同样必需。二者合起来便是充分的。没有知识，促进他者之完善的行动与努力不一定成功，甚至可能事与愿违，导致更大的物理恶。没有对理性秩序的主动促进，仅有知识也不导向幸福。莱布尼茨的伦理学无疑有理智主义的品格，但单纯被动地沉思宇宙的理性秩序并不是道德之善的理想。毋宁说，道德之善把对理性秩序的认识与尽可能主动促进理性秩序结合起来（关于莱布尼茨对神圣恩典在达致救赎中之角色的讨论，见 Rutherford 2014）[^rutherford-2014]。
