    step1: |-
      > 说事物不是凭任何善的规则而是善的，仅凭上帝的意志而是善的，这在我看来不知不觉地摧毁了上帝的一切爱与一切荣耀。因为如果他做恰恰相反的事也同样值得赞美，为什么赞美他所做的？如果只剩下某种专制的力量，如果意志占据了理性的位置，如果照暴君的定义正义在于最强者的所好，他的正义与智慧将安放于何处？（PE, p. 36）
