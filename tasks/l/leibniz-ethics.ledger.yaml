      While there is certainly a tension in Leibniz’s views on progress (see Phemister 2006 for a reconciliation of these views)[^phemister-2006], it is clear that Leibniz has differing views on the progress of the world throughout his writings. Indeed, Leibniz’s last statement on progress suggests uncertainty about the matter. In a 1715 letter to Bourguet Leibniz writes regarding progress that “two hypotheses can be formed, one that nature is always equally perfect, the other that it always increases in perfection” but that he can not “see a way of showing demonstratively by pure reason which of these we should choose” (SLT: 198). According to Strickland, however, Leibniz’s indecision is not really odd at all, for with the fates of an infinity of creatures to take into consideration even a superlative mathematician like Leibniz was at a loss to calculate whether the infinite gains made by the minority of creatures either balanced or outweighed the finite losses incurred by the majority of others. (2006a: 135; Cf. Futch 2008)[^futch-2008]
