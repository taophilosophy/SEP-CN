      One inroad into this issue comes from considering the various perfections the best of all possible worlds is supposed to instantiate. Leibniz distinguishes between three types of perfection (*Theodicy*, T: 258): *metaphysical perfection*(harmony, quantity of essence, knowledge, etc.), *physical perfection*(happiness), and *moral perfection*(virtue). Leibniz is sometimes unclear about God’s criteria in evaluating and instantiating these perfections in the best of all possible worlds. Are all of these perfections maximized or do some take precedence over others? That is, is God faced with a conflict of goods in selecting the best of all possible worlds?
    step1: |-
      深入这一问题的一条路径，是考察一切可能世界中最好的世界应当例示的各种完善。莱布尼茨区分三种完善（《神义论》，T: 258）：*形而上学完善*（和谐、本质的量、知识等）、*物理完善*（幸福）与*道德完善*（德性）。莱布尼茨有时不清楚上帝在评价并在最好的可能世界中例示这些完善时的判准。所有这些完善都被最大化吗，还是一些优先于另一些？也就是说，上帝在选择一切可能世界中最好的世界时，面临诸善的冲突吗？
