      Descartes account of the immortality of the soul also leads to patience without hope, because if moral agents cannot be held morally responsible for their actions in the next life, then they cannot have any hope that they will be rewarded for their virtue. Again, Leibniz views his ethical system as avoiding this issue, for in the kingdom of grace “there will be no good action that is unrewarded, no bad action that goes unpunished, and everything must result in the well-being of the good” (PE, *Monadology* § 90, p. 224, see also PE, *Discourse*§ 37, p. 68; for more on Leibniz’s theory of reward and punishment see Carlin 2002 and Strickland 2009)[^carlin-2002][^strickland-2009]
    step1: |-
      笛卡尔对灵魂不朽的说明也导致没有希望的耐心，因为如果道德行动者不能在来世为其行动负道德责任，他们便不能有任何希望：他们将因德性得到回报。再一次，莱布尼茨认为其伦理体系避免了这一问题，因为在恩典国度中“将没有不受回报的善行，没有不受惩罚的恶行，一切都必然导向善者的福祉”（PE, *Monadology* § 90, p. 224；另见 PE, *Discourse*§ 37, p. 68；莱布尼茨奖惩理论的更多内容见 Carlin 2002 与 Strickland 2009）[^carlin-2002][^strickland-2009]
    step2: |-
