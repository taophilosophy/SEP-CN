    kind: body
    source: |-
      1. The soul must be held morally responsible for its past actions, by God, in the afterlife. This is because God, being just, must reward and punish souls for their past actions, in order for true justice to obtain.
      2. Memory of our past actions, in the present life, is required for moral responsibility in the afterlife.
      3. After Cartesian disembodiment, the soul will go through innumerable changes, ultimately losing its memories of its actions when it was embodied.
      4. The Cartesian soul will not remember its past actions, and thus cannot be held morally responsible
      5. Therefore, Descartes’ account of the immortality of the soul is inconsistent with justice.
    step1: |-
      1. 在来世，灵魂必须由上帝为其过去的行动负道德责任。这是因为上帝是正义的，必须为灵魂过去的行动奖惩它们，以使真正的正义成立。
      2. 在今生对我们的过去行动的记忆，是来世道德责任所要求的。
      3. 笛卡尔式的脱身后，灵魂将经历无数变化，最终失去其 embodied 时对行动的记忆。
      4. 笛卡尔式的灵魂不会记得其过去的行动，因此不能负道德责任。
      5. 因此，笛卡尔的灵魂不朽说明与正义不一致。
    step2: |-
      1. 在来世，灵魂必须由上帝为其过去的行动负道德责任。这是因为上帝是正义的：他必须为灵魂过去的行动奖惩它们，以使真正的正义成立。
      2. 今生对我们过去行动的记忆，是来世道德责任所要求的。
      3. 笛卡尔式脱身后，灵魂将经历无数变化，最终失去其 embodied 时对行动的记忆。
      4. 笛卡尔式的灵魂不会记得其过去的行动，因此不能负道德责任。
      5. 因此，笛卡尔的灵魂不朽说明与正义不一致。
