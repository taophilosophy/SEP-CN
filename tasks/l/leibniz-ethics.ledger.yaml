      In a letter to Molanus (ca. 1679), Leibniz famously writes that “Descartes has not much advanced the practice of morality,” for he has effectively reproduced the ethics of the Stoics and Epicureans (PE: 241). Leibniz’s issue with the ethics of Descartes, who he considers a member of “the sect of new Stoics,” is not merely its lack of novelty (*Two Sects of Naturalists*, PE: 282). Rather, his disdain for Descartes’ ethics (and by extension aspects of Stoicism) is that it can only offer the moral agent *patience without hope* (in short, a prevention of the moral agent’s happiness) because Descartes’ metaphysics is one that precludes God’s wisdom, goodness, and justice. This is unlike Leibniz’s own metaphysical and ethical system, which he claims does offer the possibility of hope:
    step1: |-
      在致莫拉努斯（Molanus）的信（约 1679）中，莱布尼茨著名地写道：“笛卡尔没有多大推进道德的实践”，因为他实际上复现了斯多亚派与伊壁鸠鲁派的伦理学（PE: 241）。莱布尼茨对笛卡尔伦理学的异议——他认为笛卡尔属于“新斯多亚派”——不只在于其缺乏新颖性（《自然主义者的两个教派》，PE: 282）。毋宁说，他对笛卡尔伦理学（以及延伸的斯多亚主义某些方面）的不屑在于：它只能给道德行动者*没有希望的耐心*（简言之，阻止道德行动者的幸福），因为笛卡尔的形而上学排除了上帝的智慧、善与正义。这不同于莱布尼茨自己的形而上学与伦理学体系——他主张后者确实提供希望的可能：
    step2: |-
