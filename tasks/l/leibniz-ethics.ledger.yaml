      > *完善*是事物的和谐，或一切都值得被观察的状态，即一致[*consensus*]或多中之一同的状态；你甚至可以说它是可思量度[*considerabilitas*]（PE, 1715 年 5 月 18 日，p. 233–4）。
    step2: |-
      > *完善*是事物的和谐，或一切都值得被观察的状态——即一致[*consensus*]或多中之一同的状态；你甚至可以说，它是可思量度[*considerabilitas*]（PE, 1715 年 5 月 18 日，p. 233–4）。
