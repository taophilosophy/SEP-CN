      Leibniz seems to have metaphysical grounds for denying that the world as a whole can increase in perfection. The perfection of the world seems to be a sum of the perfection of individual substances. Given that the world contains all compossible substances from its inception, it cannot increase by new substances being added to the world (Strickland 2006a)[^strickland-2006a]. In order for the world as a whole to increase in perfection, then, individual substances must increase in perfection.
