      但如果我们把超本质主义学说归于莱布尼茨，那么似乎会有一个困难：如何区分传统上被认为对个体本质的那些属性与被认为只是偶性的那些属性。换言之，照莱布尼茨的看法，如果一切属性都是本质的，那么他的*人性*与他在 1700 年 1 月 1 日*穿着一件毛茸茸的丝衬衫*之间有任何区别吗？不出所料，莱布尼茨对这个表面问题有一个解法。在《形而上学谈话》与致阿尔诺通信时期的一部重要逻辑著作——《关于概念与真理分析的一般探究》（*Generales Inquisitiones de Analysi Notionum et Veritatum*，1686）——中，莱布尼茨作出标准的亚里士多德式的本质属性与偶性之分，说“那个被称为‘人’的东西，除非被消灭，不能不再是人；但一个人可以开始或停止做国王，或成为有学问的人，而他自己保持不变”。（A VI iv 740/LLP 47）这里的要点是：个体所属于的*种*为个体贡献一个层级的属性；当然，这些属性是那个特定种的一切成员所共有的。因此，例如，亚当不仅是人，还必然是理性的，并且——借用亚里士多德的老生常谈——是无羽毛的两足动物。循 Mondadori（1993），让我们把*是一个人*称为一个*种本质*属性。但也可能有*个体化本质*属性：那些把 *x* 从同种其他成员中单挑出来的属性，然而它们是这样的：缺乏它们，*x* 就不再是 *x*。例如，考虑几个对应体的亚当：一个没有把罪带入世界，一个通过吃禁忌甜甜圈把罪带入世界，等等。如我们所说，它们*不可能*与 Adam@ 同一；换个说法：如果亚当不再通过吃禁果把罪带入世界，Adam@ 就不再是 Adam@。但现在考虑一个受普兰丁格启发的例子：把罪带入世界的那只短吻鳄。这只短吻鳄能算作 Adam@ 的对应体吗？不能——因为缺乏人性，根本没有 Adam@ 的对应体。为支持这一观点，看《论自由、命运与上帝的恩典》（*De libertate, fato, gratia Dei*，1686/87）：莱布尼茨先让一位其观点的批评者说，“上帝……在他的理智中有关于彼得的尽可能完善的一个观念，包含关于彼得的一切真理，其客观实在构成彼得的完全本性或本质；因此，否认对彼得是本质的，并且被上帝预先知道。”莱布尼茨的回应动用了必然属性与偶然属性之分：
