      While the first passage seems to be Leibniz's position, he actually finesses this view in the second passage. Those properties that are said to be necessary or essential are actually what were called above the *specific essential* properties. Thus, Peter's specific essential properties include being a human being and what follows from that, for example, being rational. The crucial feature of these properties is that their absence means that the individual would be annihilated entirely; for example, if humanity were somehow stripped from Peter's complete individual concept, Peter would cease to exist *completely*. Those properties that are said to be contingent or existential are all the myriad properties that individuate Peter and that make Peter the particular person that he is. As Leibniz says, they are what fill out Peter's complete individual concept. Now, these properties can still be considered *essential* in the sense relevant to Leibniz's superessentialism, but in the following way (similar to what was said above about Adam_{@}): if such a property, for example, *denying Christ*, were stripped from Peter's complete individual concept, Peter would cease to be Peter. In other words, imagine Peter's notion, containing, among other things, *humanity*, *being a disciple of Christ*, *being the founder of the church*, and *being a denier of Christ*. Leibniz's point seems to be that we *could* peer into a nearby possible world where a Peter-counterpart did not deny Christ. But there is no nearby possible world in which a Peter was the alligator or marmoset that denied Christ.
    step1: |-
      虽然第一段话似乎是莱布尼茨的立场，他在第二段话中实际上对这一观点作了细微处理。那些被称为必然的或本质的属性，实际上就是上文所谓的*种本质*属性。因此，彼得的种本质属性包括是一个人以及随之而来的东西，例如是理性的。这些属性的关键特征是：它们的缺乏意味着个体将被完全消灭；例如，如果人性不知怎么被从彼得的完整个体概念中剥除，彼得就会*完全*停止存在。那些被称为偶然的或实存的属性，是使彼得个体化、使彼得成为他这个特定的人的一切属性。如莱布尼茨所说，它们是填满彼得完整个体概念的东西。现在，这些属性仍然可以在与莱布尼茨超本质主义相关的意义上被看作*本质的*，但按如下方式（类似于上文关于 Adam@ 所说的）：如果这样一个属性——例如*否认基督*——被从彼得的完整个体概念中剥除，彼得就会不再是彼得。换言之，设想彼得的观念，其中除其他东西外还包含*人性*、*是基督的门徒*、*是教会的奠基者*与*是否认基督者*。莱布尼茨的要点似乎是：我们*可以*窥看一个邻近的可能世界，那里有一个没有否认基督的彼得对应体。但没有任何邻近的可能世界，其中有一个否认基督的彼得是短吻鳄或狨猴。
