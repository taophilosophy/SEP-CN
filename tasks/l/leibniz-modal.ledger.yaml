      莱布尼茨的实体构想——每个个体都有一个完整个体概念——看起来仍然引人注目地必然主义。毕竟，甚至与我的*未来*行动相关的谓词现在也包含在我的完整个体概念之中。这带有决定论的意味，并以自己的方式提出未来偶然事物的问题。如上文所述，莱布尼茨主张我们是自由的，部分恰恰因为我们的行动以完全的自发性跟随我们的本性。而且，照莱布尼茨的说法，上帝“倾斜我们的灵魂而不强制它们”。确实，在《形而上学谈话》中，莱布尼茨主张一个个体的行动是*确定的*但不是必然的。莱布尼茨论证说，它们是*依假设确定的*——也就是说，鉴于这个特定世界的创造或实例化，它们是确定的。上帝看到恺撒会渡过卢比孔河，看到犹大会背叛基督，看到亚当会犯罪，等等；这些行动中的每一个以及无限多的其他行动都包含在每一个个体的完全概念之中；然而上帝选择了这个世界，在其中这样的行动将*确定地*发生。但与此同时，既然任何这类行动的反面都不蕴涵矛盾，它们就不是必然的。上帝在选择一个可能世界时，选择一切现实个体的一切本质，其中每一个都有其程序，按照它自发而自由地行动。虽然它仍然是一个程序或完全概念，照莱布尼茨的看法，那确实蕴涵*被决定*。
