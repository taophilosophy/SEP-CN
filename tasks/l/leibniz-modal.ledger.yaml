      Leibniz's point is that, since the Adam of the actual world (call him “Adam_{@}”) has a complete concept containing all of his properties and since Adam_{@} (or any substance) expresses the entire world of which he is a member, Adam_{@} could not exist in a different world. Moreover, if *any* of Adam_{@}'s properties were somehow changed, then the resulting being would not be Adam_{@}. This is indeed an important consequence of his Principle of the Identity of Indiscernibles. When we speak of the Adam who brought sin into the world and an Adam who did not, we cannot, strictly speaking, be referring to the same individual. And that failure of identical reference is the key to seeing that all of Adam's properties are essential to him. Leibniz makes this point about as clearly as he makes any point in §30 of the *Discourse on Metaphysics* in his discussion of Judas' sin: “But someone else will say, why is it that this man will assuredly commit this sin? The reply is easy: otherwise he would not be this man.” (A VI iv 1576/AG 61) In other words, Leibniz seems to deny the possibility of “transworld-individuals” and asserts instead that every individual is “world-bound.” Nevertheless, Leibniz argues that there are “vague Adams,” that is, quasi-individuals which exist in more than one world. And when we imagine other possible worlds in which “Adam” does not sin or eats the forbidden donut, we are imagining only an incomplete or vague “Adam” who is the individual in that world – not the *same* individual. That is, the “vague Adams” are only quasi-individuals because their individual concepts are not complete. Indeed, when Leibniz speaks of the “vague Adams,” what he has in mind is some set properties that is common to a number of individuals: Adam_{@}, Adam_{*w*′} (i.e. Adam in world′), Adam_{*w*″}, Adam_{*w*′′′}, and so on. In the terminology of David Lewis's modal theory, they are the “counterparts” of Adam in other possible worlds. Strictly speaking, however, only individuals with complete individual concepts are denizens of other possible worlds; quasi-individuals per se cannot be said to exist. But an incomplete concept can be used to delimit a set of counterparts that do exist with complete individual concepts in different possible worlds. And lest it be thought that talk of the idea of a “vague Adam” is limited to his discussion in the 1680s with Arnauld about modal matters, it should be noted that Leibniz makes much the same point 20 years later in the concluding sections of the *Theodicy* discussed and quoted above when he writes of the “several Sextuses” that are to be found in the palace containing the books of fates. All of this speaks very strongly for attributing the doctrine of superessentialism to Leibniz throughout his life as well as the denial of the doctrine of transworld identity.
    step1: |-
      莱布尼茨的要点是：既然现实世界的亚当（称他为“Adam@”）有一个包含其全部属性的完全概念，既然 Adam@（或任何实体）表现他所属于的整个世界，Adam@ 就不可能存在于一个不同的世界。此外，如果 Adam@ 的*任何*属性不知怎么被改变了，所得的存在者就不会是 Adam@。这确实是他的不可分辨者同一性原则的一个重要后果。当我们说到把罪带入世界的亚当与没有把罪带入世界的亚当，严格说来我们不能指称同一个个体。而指称同一性的这种失效，正是看到亚当的全部属性对他是本质的关键。莱布尼茨在《形而上学谈话》第 30 节讨论犹大之罪时把这个要点讲得如同他讲任何要点一样清楚：“但有人会说，为什么这个人必定犯这个罪？回答很容易：否则他就不会是这个人。”（A VI iv 1576/AG 61）换言之，莱布尼茨似乎否认“跨世界个体”的可能性，转而主张每个个体都是“受世界约束的”。然而，莱布尼茨论证说存在“含糊的亚当”，即存在于不止一个世界中的准个体。当我们想象“亚当”没有犯罪或吃了禁忌甜甜圈的其他可能世界时，我们想象的只是那个世界中的一个不完全的或含糊的“亚当”——不是*同一个*个体。也就是说，“含糊的亚当”只是准个体，因为它们的个体概念不完全。确实，当莱布尼茨说到“含糊的亚当”时，他心里想的是为若干个体所共有的某组属性：Adam@、Adam*w*′（即世界′中的亚当）、Adam*w*″、Adam*w*′′′，等等。用大卫·刘易斯模态理论的术语说，它们是亚当在其他可能世界中的“对应体”。不过严格说来，唯有拥有完整个体概念的个体才是其他可能世界的居民；准个体本身不能说存在。但不完全的概念可以用来圈定一组对应体——它们确实存在于不同的可能世界，拥有完整个体概念。而为了免得人们以为“含糊的亚当”的观念仅限于他十七世纪八十年代与阿尔诺关于模态问题的讨论，应当指出：约二十年后，莱布尼茨在上面讨论并引用过的《神义论》的结论部分——他写到命运之书之宫中的“几个塞克斯图斯”——提出了几乎相同的要点。所有这一切，都强烈支持把超本质主义学说归于莱布尼茨的一生，也支持否认跨世界同一性的学说。
