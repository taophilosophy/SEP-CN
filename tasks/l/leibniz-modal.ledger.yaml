  - id: 3
    kind: body
    source: |-
      In order to explain Leibniz's modal metaphysics—the metaphysics of necessity, contingency, and possibility—we must look first at the foundation of Leibniz's system more generally: his conception of an *individual substance*. In §8 of the *Discourse on Metaphysics*, Leibniz presents his classic picture, writing:
    step1: |-
      为解释莱布尼茨的模态形而上学——必然性、偶然性与可能性的形而上学——我们必须先看莱布尼茨体系更一般的基础：他对*个体实体*的构想。在《形而上学谈话》第 8 节，莱布尼茨呈出其经典图景，写道：
    step2: |-
      为解释莱布尼茨的模态形而上学——必然性、偶然性与可能性之形而上学——我们必须先看莱布尼茨体系更一般的基础：他对*个体实体*的构想。在《形而上学谈话》第 8 节，莱布尼茨呈出其经典图景：
  - id: 4
    kind: body
    source: |-
      > The nature of an individual substance or of a complete being is to have a notion so complete that it is sufficient to contain and to allow us to deduce from it all the predicates of the subject to which this notion is attributed. (A VI iv 1540/AG 41)
    step1: |-
      > 一个个体实体或一个完全存在者的本性，在于拥有一个如此完全的概念，足以包含、并使我们能从中推出该概念所属主词的全部谓词。（A VI iv 1540/AG 41）
    step2: |-
      > 一个个体实体或一个完全存在者的本性，在于拥有一个如此完全的概念——足以包含、并使我们能从中推出该概念所属主词的全部谓词。（A VI iv 1540/AG 41）
  - id: 5
    kind: body
    source: |-
      In other words, each individual substance has a *complete individual concept* (CIC), which contains (or from which are deducible) all predicates true of it past, present, and future. Leibniz asks his reader to consider the case of Alexander the Great. On his view, God can, as it were, look at the complete individual concept of Alexander and see that he conquered Darius and Porus, that he was the student of Aristotle, that his armies would march into India, and so on. For our purposes, it will suffice to think of the CIC as the essence of an individual substance and to think of God as able to survey all essences of all individual substances. (The issue is, in fact, vexed; for insightful presentations of views rivaling that presented here, see Sleigh 1990 or Cover and Hawthorne 1999.)[^cover-1999][^sleigh-1990] Further, according to Leibniz, one of the consequences of this view of the nature of an individual substance is that no two substances can be qualitatively identical and differ numerically. In other words, the Principle of the Identity of Indiscernibles (PII) follows from this conception of the nature of substance, and PII entails that, for any possible world, there is at most one instance of a CIC.
    step1: |-
      换言之，每个个体实体都有一个*完整个体概念*（CIC），它包含（或从中可推出）凡过去、现在与未来对之为真的全部谓词。莱布尼茨请读者考虑亚历山大大帝的例子。照他的看法，上帝仿佛可以查看亚历山大的完整个体概念，看到他战胜了大流士与波鲁斯，看到他是亚里士多德的学生，看到他的军队将开进印度，等等。就本文的目的而言，把 CIC 看作个体实体的本质、把上帝看作能够通观一切个体实体的一切本质，就足够了。（这个问题实际上颇为棘手；对与此处所呈相竞观点的精到呈现，见 Sleigh 1990 或 Cover and Hawthorne 1999。）[^cover-1999][^sleigh-1990]此外，照莱布尼茨的说法，这种个体实体本性观的一个后果是：没有两个实体能够在性质上同一而在数目上有别。换言之，不可分辨者的同一性原则（PII）可以从这种实体本性构想中推出；而 PII 蕴涵：对任何可能世界，一个 CIC 至多只有一个实例。
    step2: |-
      换言之，每个个体实体都有一个*完整个体概念*（CIC），它包含（或从中可推出）凡过去、现在与未来对之为真的全部谓词。莱布尼茨请读者考虑亚历山大大帝的例子。照他的看法，上帝仿佛可以查看亚历山大的完整个体概念，看到他战胜大流士与波鲁斯，看到他是亚里士多德的学生，看到他的军队将开进印度，等等。就本文的目的而言，把 CIC 看作个体实体之本质、把上帝看作能通观一切个体实体之一切本质，便已足够。（此题实际上颇为棘手；对与此处所呈相竞观点的精到呈现，见 Sleigh 1990 或 Cover and Hawthorne 1999。）[^cover-1999][^sleigh-1990]此外，照莱布尼茨之说，这种个体实体本性观的一个后果是：没有两个实体能够性质上同一而数目上有别。换言之，不可分辨者的同一性原则（PII）可从这种实体本性构想中推出；而 PII 蕴涵：对任何可能世界，一个 CIC 至多只有一个实例。
