      In the main article on Leibniz, it was claimed that Leibniz's philosophy can be seen as a reaction to the Cartesian theory of corporeal substance and the necessitarianism of Spinoza and Hobbes. This entry will address this second aspect of his philosophy. In the course of his writings, Leibniz developed an approach to questions of modality—necessity, possibility, contingency—that not only served an important function within his general metaphysics, epistemology, and philosophical theology but also has continuing interest today. Indeed, it has been suggested that 20ᵗʰ-century developments in modal logic were either based on Leibnizian insights or at least had a Leibnizian spirit.
    step1: |-
      在莱布尼茨主条目中，我们曾主张：莱布尼茨的哲学可以看作对笛卡尔式有形实体理论以及斯宾诺莎与霍布斯的必然主义的一种回应。本词条将处理其哲学的这第二个方面。在其写作历程中，莱布尼茨发展出一条处理模态问题——必然性、可能性、偶然性——的进路：它不仅在莱布尼茨的一般形而上学、认识论与哲学神学中承担重要功能，而且在今天仍具持续的趣味。确实，有人提出：二十世纪模态逻辑的种种发展，或基于莱布尼茨式的洞见，或至少具有莱布尼茨式的精神。
    step2: |-
      在莱布尼茨主条目中我们曾主张：莱布尼茨的哲学，可以看作对笛卡尔式有形实体理论、以及斯宾诺莎与霍布斯之必然主义的回应。本词条将处理其哲学的这第二个方面。在其写作历程中，莱布尼茨发展出一条处理模态问题——必然性、可能性、偶然性——的进路：它不仅在莱布尼茨的一般形而上学、认识论与哲学神学中承担重要功能，在今天也仍具持续的趣味。确实，有人提出：二十世纪模态逻辑的种种发展，或基于莱布尼茨式的洞见，或至少具有莱布尼茨式的精神。
