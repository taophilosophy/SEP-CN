      1. *可能性*：一个命题是可能的，当且仅当它在某个可能世界中为真。一个存在者是可能的，当且仅当它存在于某个可能世界之中。
      2. *偶然性*：一个命题偶然为真，当且仅当它在这个世界中为真而在另一个世界中为假。一个命题是偶然的，如果它的反面不蕴涵矛盾。
      3. *必然性*：一个命题必然为真，当且仅当它在每一个可能世界中都为真。
      4. *不可能性*：一个命题是不可能的，当且仅当它在任何可能世界中都不为真。
