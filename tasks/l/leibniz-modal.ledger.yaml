      A possible world, however, is not simply a set of compossible individuals. According to Leibniz, a possible world also entails certain laws of nature. As Leibniz says to Arnauld in a letter from 14 July 1686,
    step1: |-
      然而，一个可能世界不只是一组可共存的个体。照莱布尼茨的说法，一个可能世界还蕴涵特定的自然律。如莱布尼茨在 1686 年 7 月 14 日致阿尔诺的信中所说：
    step2: |-
      然而，一个可能世界不只是一组可共存的个体。照莱布尼茨之说，一个可能世界还蕴涵特定的自然律。如莱布尼茨在 1686 年 7 月 14 日致阿尔诺的信中所言：
  - id: 9
    kind: body
    source: |-
      > I think there is an infinity of possible ways in which to create the world, according to the different designs which God could form, and that each possible world depends on certain principal designs or purposes of God which are distinctive of it, that is, certain primary free decrees (conceived *sub ratione possibilitatis*) or certain *laws* of the *general order* of this possible universe with which they are in accord and whose concept they determine, as they do also the concepts of all the individual substances which must enter into this same universe. (G II 51/L 333)
    step1: |-
      > 我认为，按照上帝能够形成的不同设计，创造世界有无限多种可能的方式；而每一个可能世界都依赖某些属于它自己的主要设计或目的，即某些原初的自由法令（以*可能性之理*来设想），或这个可能宇宙之*普遍秩序*的某些*法则*——那些设计或目的与这些法则相符合，并决定其概念，同样也决定必须进入这同一个宇宙的一切个体实体的概念。（G II 51/L 333）
    step2: |-
      > 我认为，按照上帝能够形成的不同设计，创造世界有无限多种可能的方式；而每一个可能世界，都依赖某些专属于它的主要设计或目的——即某些原初的自由法令（以*可能性之理*来设想），或这个可能宇宙之*普遍秩序*的某些*法则*。那些设计或目的与这些法则相符合，并决定其概念；同样也决定必须进入这同一个宇宙的一切个体实体的概念。（G II 51/L 333）
  - id: 10
    kind: body
    source: |-
      Leibniz's basic idea here should conform closely with our intuitions. Imagine God's considering a set of individuals {*a, b, c, d*}. From God's point of view he could choose to actualize this world with one set, *L**, of laws of nature or with another set of laws, *L***. And this choice represents a choice between two possible worlds. This is similar to our saying that we would have a *different* world if the gravitational constant were different. Now, this way of speaking is not exactly right, for on Leibniz's view, the different sets of laws would ultimately produce different properties and perceptions with the individual substances. As a result, the individuals in the worlds governed by *L** and *L*** would strictly speaking be different.
    step1: |-
      莱布尼茨这里的基本想法应当与我们的直觉密切相符。设想上帝考虑一组个体 {*a, b, c, d*}。从上帝的观点看，他可以选择用一组自然律 *L** 使这个世界现实化，或者用另一组自然律 *L***。这一选择代表在两个可能世界之间的选择。这类似于我们说：如果引力常数不同，我们就会有一个*不同的*世界。不过，这种说话方式并不完全正确，因为照莱布尼茨的看法，不同的定律组最终会在个体实体那里产生不同的属性与知觉。结果，由 *L** 与 *L*** 所支配的世界中的个体，严格说来是不同的。
    step2: |-
      莱布尼茨这里的基本想法，应当与我们的直觉密切相符。设想上帝考虑一组个体 {*a, b, c, d*}。从上帝的观点看，他可以选择用一组自然律 *L** 使这个世界现实化，或者用另一组自然律 *L***。这一选择，代表在两个可能世界之间的选择。这类似于我们说：若引力常数不同，我们就会有一个*不同的*世界。不过，这种说话方式并不完全正确：照莱布尼茨的看法，不同的定律组最终会在个体实体那里产生不同的属性与知觉。结果，由 *L** 与 *L*** 所支配的世界中的个体，严格说来是不同的。
  - id: 11
    kind: body
    source: |-
      The reason Leibniz mentions the different laws governing the different possible worlds is that the systems of laws and their effects serve as criteria by which God chooses a world. We know that, for Leibniz, God chooses the “best of all possible worlds.” In §6 the *Discourse on Metaphysics*, however, we learn that this means that God chooses the world that is simplest in hypotheses (or laws) and richest in phenomena. Thus, while one might be tempted to see natural laws as derivative of the actual properties and perceptions of individual substances, in fact they are objects of God's choice.
    step1: |-
      莱布尼茨提到支配不同可能世界的不同定律，原因在于：诸定律系统及其效果充当上帝选择一个世界的判据。我们知道，对莱布尼茨来说，上帝选择“一切可能世界中最好的世界”。然而在《形而上学谈话》第 6 节我们得知：这意味着上帝选择在假设（或定律）上最简单、在现象上最丰富的世界。因此，虽然人们可能倾向于把自然律看作个体实体的现实属性与知觉的派生物，事实上它们是上帝选择的对象。
    step2: |-
      莱布尼茨之所以提到支配不同可能世界的不同定律，是因为：诸定律系统及其效果，充当上帝选择世界的判据。我们知道，对莱布尼茨而言，上帝选择“一切可能世界中最好的世界”。然而《形而上学谈话》第 6 节告诉我们：这意味着上帝选择在假设（或定律）上最简单、在现象上最丰富的世界。因此，尽管人们可能倾向于把自然律看作个体实体之现实属性与知觉的派生物，事实上它们是上帝选择的对象。
  - id: 12
    kind: body
    source: |-
      When Leibniz speaks of a *possible world*, he means a set of compossible, finite things that God *could have* brought into existence *if* he were not constrained by the goodness that is part of his nature. The *actual world*, on the other hand, is simply that set of finite things that is instantiated by God, because it is greatest in goodness, reality and perfection. Naturally, the fact that we are here experiencing this world – the actual world – means that there is at least one possible world. So are there others?
    step1: |-
      当莱布尼茨说到一个*可能世界*时，他指的是一组可共存的有限东西——*如果*上帝不受其本性中善的约束，他*本可以*使其存在。而*现实世界*则只是被上帝实例化的那组有限东西，因为它在善、实在与完善上最大。自然，我们此时正经验着这个世界——现实世界——这一事实意味着：至少存在一个可能世界。那么还有别的吗？
    step2: |-
      当莱布尼茨说到一个*可能世界*时，他指的是一组可共存的有限东西——*倘若*上帝不受其本性中善之约束，他*本可以*使之存在。而*现实世界*，则只是被上帝实例化的那组有限东西——因为它在善、实在与完善上最大。自然，我们此时正经验着这个世界——现实世界——这一事实意味着：至少存在一个可能世界。那么，还有别的吗？
  - id: 13
    kind: body
    source: |-
      Yes, indeed, there are. At least Leibniz thinks so. In his view, as we saw above, there are an infinite number of possible worlds – worlds that God did not see fit to bring into existence. Now, given that Leibniz's safe claim is that “[t]here are as many possible worlds as there are series of things that can be conceived that do not imply a contradiction,” (Grua 390) it might still be the case that there is only *one* possible world – only one set of essences that implies no contradiction. If we accept the claim that a possible world is simply any set of compossible individuals (i.e. a set of individuals whose properties or perceptions do not contradict each other), then there is a rather trivial way to show that there are an infinite number of possible worlds. Namely, we just have an infinity of one-object worlds: thus *w*₁ contains a blue, 8lb. bowling ball; *w*₂, a red, 10lb. bowling ball; *w*₃, a pepperoni pizza; *w*₄, a bicycle; and so on. We could even imagine worlds with two, three, or more objects.
    step1: |-
      是的，确实有。至少莱布尼茨如此认为。照他的看法——如上文所见——存在无限多的可能世界：那些上帝认为不值得使之存在的世界。不过，鉴于莱布尼茨稳妥的主张是“有多少可设想的不蕴涵矛盾的事物系列，就有多少可能世界”（Grua 390），仍然可能只有*一个*可能世界——只有一组不蕴涵矛盾的本质。如果我们接受如下主张：一个可能世界就是任何一组可共存的个体（即其属性或知觉互不矛盾的一组个体），那么有一个相当平凡的办法表明存在无限多的可能世界。即：我们只须有一无限的单对象世界系列：*w*₁ 含一个蓝色 8 磅保龄球；*w*₂ 含一个红色 10 磅保龄球；*w*₃ 含一个意式腊肠比萨；*w*₄ 含一辆自行车；如此等等。我们甚至可以设想有两个、三个或更多对象的世界。
