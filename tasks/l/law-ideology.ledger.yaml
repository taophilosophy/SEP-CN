      应当指出，罗尔斯对良序政治社会的“善”寄望甚殷（2001, 198–9），并承认关于有价值生活方式的至善论观点，可以在“适当限定的问题”——如野生动物栖息地的保护——的立法决策中发挥作用（2001, 152n26）。然而他仍持传统的至善论观点，认为它在原则上不平等，内含这样的观念：“有些人拥有特殊的主张，因为他们更大的天赋使其得以从事实现至善价值的更高活动”（2001, 152）。“平等主义的至善论者”——如本词条作者——则主张：在正义理论中，我们应当力求使人的繁荣更加平等。照这一无疑有争议的观点，法律中对公正性的关切不应被容许对一切政治问题抱有“帝国主义式的图谋”（Sypnowich 2017, 85–7）[^sypnowich-2017]，以致共同体放弃了培育平等人类福祉的责任。照这种观点，晚近试图把至善论与罗尔斯式正义联姻的著作（Kramer 2017, Tahzib 2022）[^kramer-2017][^tahzib-2022]，在推翻中立主义意识形态、以及那类不妨碍强劲激进平等主义的“政治的司法化”方面，仍不够激进。
