    source: |-
      If law is a system of enforceable rules governing social relations and legislated by a political system, it might seem obvious that law is connected to ideology. Ideology refers, in a general sense, to a system of political ideas, and law and politics are inextricably intertwined. Just as ideologies are dotted across the political spectrum, so too are legal systems. Thus we speak of both legal systems and ideologies as liberal, fascist, communist, and so on, and most people probably assume that a law is the legal expression of a political ideology. One would expect the practice and activity of law to be shaped by people’s political beliefs, so law would seem to emanate from ideology in a straightforward and uncontroversial way.
    step1: |-
      如果法律是一套由政治体系立法、用以规制社会关系的可执行规则，那么法律与意识形态相关联，似乎是不言自明的。意识形态泛指一套政治观念体系，而法律与政治千丝万缕地交织在一起。正如意识形态遍布政治光谱，法律体系也是如此。因此我们既说法律体系也谈意识形态是自由主义的、法西斯主义的、共产主义的等等，而且大多数人可能想当然地认为，法律就是某种政治意识形态的法律表达。人们会预期法律的实践与活动受到人们政治信念的塑造，因此法律似乎以一种直白而无可争议的方式发源于意识形态。
    step2: |-
      如果法律是一套由政治体系立法、用以规制社会关系的可执行规则，那么法律与意识形态相关联，似乎是不言自明的。意识形态泛指一套政治观念体系，而法律与政治千丝万缕地交织在一起。正如意识形态遍布政治光谱，法律体系亦然。因此我们既说法律体系、也说意识形态是自由主义的、法西斯主义的、共产主义的，等等；多数人恐怕还想当然地认为，法律无非是某种政治意识形态的法律表达。人们自然会预期，法律的实践与活动受到人们政治信念的塑造——如此看来，法律似乎以直白而无可争议的方式发源于意识形态。
  - id: 2
    kind: body
    source: |-
      However, the connection between law and ideology is both complex and contentious. This is because of the diversity of definitions of ideology and the various ways in which ideology might be related to law. Moreover, whilst the observation about law’s link with ideology might seem a sociological commonplace, the link between law and ideology is more often made in a critical spirit, in order to impugn law.
    step1: |-
      然而，法律与意识形态的关联既复杂又有争议。这是因为意识形态的定义多种多样，意识形态与法律相关联的方式也各不相同。此外，尽管法律与意识形态的联系看似一个社会学常识，这种联系却更多是在批判的意图下被提出的，目的在于质疑法律。
    step2: |-
      然而，法律与意识形态的关联既复杂又有争议。个中缘由，一是意识形态的定义五花八门，二是意识形态与法律相关联的方式各不相同。再者，法律与意识形态的联系看似一个社会学常识，这种联系却更多是在批判的意图下被提出的——其目的在于质疑法律。
  - id: 3
    kind: body
    source: |-
      At issue is an understanding of ideology as a source of manipulation. Law as ideology directs its subjects in ways that are not transparent to the subjects themselves; law, on this view, cloaks power. The ideal of law, in contrast, involves a set of institutions that regulate or restrain power with reference to norms of justice. Thus, the presence of the ideological in law must, in some sense, compromise law’s integrity. Not only is the view of law as ideology at odds with a lot of mainstream thinking about law, it seems difficult to reconcile with the central philosophical positions on the nature of law, e.g. a positivist conception of law as a set of formal rules, or a natural law conception where law is identified with moral principles.
    step1: |-
      争论的核心在于把意识形态理解为一种操纵的来源。作为意识形态的法律，以主体自身无法看透的方式引导其属民；在这种观点看来，法律为权力披上了伪装。与此相对，法律的理想涉及一套以正义规范为参照来规制或约束权力的制度。因此，意识形态在法律中的存在必然在某种意义上损害法律的正直。法律即意识形态的观点不仅与大量关于法律的主流思想相左，而且似乎难以与关于法律本性的核心哲学立场相调和，例如把法律视为一套形式规则的实证主义观念，或把法律等同于道德原则的自然法观念。
    step2: |-
      争论的核心，在于把意识形态理解为一种操纵之源。作为意识形态的法律，以主体自身无法看透的方式引导其属民；在这派观点看来，法律给权力披上了伪装。与此相对，法律的理想则涉及一套以正义规范为参照来规制或约束权力的制度。如此，意识形态在法律中的存在，必然在某种意义上损害法律的正直。法律即意识形态的观点不仅与大量主流法律思想相左，似乎也难以同关于法律本性的核心哲学立场相调和——例如把法律视为一套形式规则的实证主义观念，或把法律等同于道德原则的自然法观念。
