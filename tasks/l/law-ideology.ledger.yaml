      Some theorists cast doubt on the capacity of the theorist, however emancipatory their aims, to stand outside of ideological formations, particularly if ideology insinuates itself in habits of mind, attitudes and practices. Thus even if we believe ourselves to have rationally corrected racist error, we might still persist in a racist outlook. Moreover, in our anti-racist efforts, we might do well to marshall ideological strategies for emancipation, as counselled by Mills. Understanding ideology critique as immanent, as proposed by Rahel Jaeggi (2009), means that the paradox of ideology being ‘both true and false’ can be, if not resolved, explicated by revealing, from an internal perspective, the contradictions of capitalism that ideology seeks to obscure. Sally Haslanger (2017) joins Jaeggi in stressing the illuminating point made by Marx – that even on the epistemically defective view, ideology can only function if it is not wholly false. As Jaeggi puts it (2009, 68–9), law has an ‘unrealised truth content’ a ‘deficient realisation’ of genuine ideals. Thus, sexist ideology functions because, e.g., women do indeed tend to be the caregivers in our society, and proffers ideals that have genuine value – e.g., rights for women do make a difference, if not all the difference. For Haslanger (2017, 11), ideology’s reach is beyond the propositional, including attitudes, emotions, and practices: ‘our unthinking responses, our bodily comportment, the social and material realities that constitute our milieu’.
    step1: |-
      一些理论家对理论家的能力表示怀疑——无论其目标多么解放——怀疑其能否立于意识形态构型的外部，尤其当意识形态把自己悄悄织入思维习惯、态度与实践之时。因此，即便我们相信自己已理性地纠正了种族主义错误，仍可能保有种族主义的眼光。此外，在反种族主义的努力中，我们或许应当如 Mills 所建议的，善用意识形态的解放策略。把意识形态批判理解为内在批判——如 Rahel Jaeggi（2009）所提议——意味着：意识形态“既真又假”的悖论纵然无从化解，也可以得到阐明——从内部视角揭示意识形态试图遮蔽的资本主义矛盾。Sally Haslanger（2017）与 Jaeggi 一道强调马克思那个富有启发性的论点：即便在认知有缺陷的观点上，意识形态也唯有不全然虚假方能发挥功能。如 Jaeggi 所说（2009, 68–9），法律有一种“未实现的真理内容”，是真实理想的“有缺陷的实现”。于是，性别歧视意识形态之所以能发挥功能，是因为——例如——女性在我们的社会中确实多为照料者，且它所提供的理想具有真实的价值——例如，女性权利确实带来了改变，即便不是全部改变。对 Haslanger（2017, 11）而言，意识形态的作用范围超出命题之外，包括态度、情感与实践：“我们未经思考的回应，我们身体的姿态，构成我们处境的社会与物质实在。”
