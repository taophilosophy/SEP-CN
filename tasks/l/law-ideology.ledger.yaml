      反思一下这个挑衅性的建议，是很有意思的：自由主义政治哲学本身就是一种意识形态。这或许可以从苏珊·莫勒·奥金（1989）等女性主义者与 Charles Mills（1997）等批判种族理论家的经典批判中推演出来——他们指出了罗尔斯正义论在性别与种族问题上的成问题假定。我想提出的另一个问题，是司法理想——它对自由主义政治理论至关紧要——的弥漫性影响。法律程序主义的价值对政治哲学影响甚巨，尤见于自由主义。前文已见，哈耶克在其对福利国家的批判中主张：法律的程序规则要求一种自由放任的经济，国家只应为私人首创精神提供框架。相比之下，罗尔斯与德沃金这样的左翼自由主义者坚持：国家理应在补救经济劣势上发挥作用。罗尔斯关心的是公民享有平等政治自由的真正“价值”或“公平价值”（Rawls 2007, 148–9）[^rawls-2007]。此外他还认为，自由民主社会主义与有产者的民主，都是实现其正义原则的候选方案。罗尔斯把这表述为寻求“资本主义的替代方案”（2001, 135–6），并援引其政治哲学讲演中的主张：马克思“自由联合的生产者”观念包含一种“民主的经济计划”（2007, 372）。
