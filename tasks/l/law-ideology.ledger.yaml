            A conception of law as having a moral source, or a source in a system’s institutions, can be independent of a realistic appraisal of law’s ideological function, or the ideological process in which laws are made. Indeed, radical critics of the ‘war on terror’ waged by western governments have pointed to the value of liberal legal ideals such as human rights and the rule of law at the same time as they have noted the ideological purposes to which such ideals are put (see Bartholomew 2007, Steger, 2007)[^bartholomew-2007]. Both positivists and natural lawyers, so long as they do not insist that their conceptions of law are exhaustive of law’s reality, can permit the influence of ideology, even in its more radical interpretations. Law can be ideology as well as other moral or institutional phenomena at the same time; indeed, law will probably not succeed as ideology unless it is multi-dimensional in just this way.
    step1: |-
      法律有一个道德渊源，或有一个体系制度中的渊源——这样一种法律观，可以独立于对法律之意识形态功能的现实主义评估，也独立于对法律制定之意识形态过程的认识。事实上，西方政府发动的“反恐战争”的激进批评者，既指出人权与法治等自由主义法律理想的价值，同时注意到这些理想被赋予的意识形态目的（见 Bartholomew 2007, Steger, 2007）[^bartholomew-2007]。只要实证主义者与自然法学家不坚持其法律概念穷尽了法律的实在，他们便可容许意识形态的影响——哪怕是其更激进的解释。法律可以既是意识形态，又是其他道德的或制度的现象；的确，法律若非在这个意义上多维并存，恐怕难以作为意识形态而成功。
