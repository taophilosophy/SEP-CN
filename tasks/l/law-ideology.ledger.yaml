      The well-known debate about the sources of law appears to be radically undercut by a view of law as ideology. The sources debate has usually been posed in terms of the extent to which morality is intrinsic to the content of law. Natural lawyers argue that what is law must partly depend on moral criteria. Following Thomas Aquinas, the traditional criteria have not strayed far from the teachings of the Roman Catholic Church, but more recent natural law arguments, such as those of Lon Fuller and Ronald Dworkin, have proffered secular standards emanating from the procedural ideals of the rule of law or the constitutionalism of American liberalism. All natural lawyers, however, are agreed that what the law is must be determined, in some sense, by what the law ought to be.
    step1: |-
      关于法律渊源的著名论战，似乎被法律即意识形态的观点釜底抽薪。渊源之争通常围绕道德在何种程度上内在于法律内容而展开。自然法学家主张：何为法律，必定部分地取决于道德判准。追随托马斯·阿奎那（Thomas Aquinas），传统的判准未曾远离罗马天主教会的教导；但较晚近的自然法论证——如朗·富勒（Lon Fuller）与罗纳德·德沃金（Ronald Dworkin）的论证——则提出了源自法治之程序理想或美国自由主义立宪主义的世俗标准。然而，全体自然法学家都一致同意：法律是什么，必须在某种意义上由法律应当是什么来决定。
