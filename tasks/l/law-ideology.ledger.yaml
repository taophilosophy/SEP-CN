      The view that law is ideological was taken up again in the 1970s and 80s, with the emergence of the Critical Legal Studies movement. Critical Legal Studies is a radical school of thought shaped by a number of influences: the Marxist and realist traditions; the philosophical perspective of ‘deconstruction;’ and the politics of issues such as feminism, environmentalism and anti-racism. The movement takes up the realist idea that law is fundamentally indeterminate, echoing Marxist views about how the interests of the powerful shape law. Exponents offer some astute observations about the ways in which law is taught and practiced in order to give the misleading impression of law’s certainty and legitimacy. Particular legal doctrines are targeted for papering over the inconsistent and arbitrary features of legal decision-making; the rule of law, for example, is criticized as a naïve view of the form of law as unaffected by law’s content and the social context in which law operates. The indeterminacy of law can produce a variety of results; Duncan Kennedy, for example, points out the surprising ways in which the ideology of formal legal reasoning can remedy injustice, even if ideology often disables such remedies as well (Kennedy 1976)[^kennedy-1976]. Thus the ideology view can now be taken to reflect a consensus among radicals of all stripes on the role of law as a dissembling force to safeguard the unjust relations of the status quo.
    step1: |-
      法律是意识形态的这一观点，在二十世纪七十、八十年代再度兴起，其标志是批判法学研究运动。批判法学研究是一场激进的思想流派，受多重影响塑造：马克思主义与现实主义传统、“解构”的哲学视角，以及女权主义、环保主义与反种族主义等议题的政治。该运动接过现实主义关于法律根本不确定的观念，呼应马克思主义关于强者利益如何塑造法律的看法。其倡导者就法律的教授与实践方式提出了一些敏锐的观察，指出这些方式给人以“法律确定而正当”的误导性印象。某些法律学说因粉饰法律决策中不一致与任意的特征而成为靶子；例如，法治被批评为一种天真的看法——把法律的形式看作不受法律内容及其运作的社会语境影响。法律的不确定性可以引出多种结果；例如 Duncan Kennedy 指出，形式法律推理的意识形态能以出人意料的方式补救不义，尽管意识形态也常使这类补救归于失效（Kennedy 1976）[^kennedy-1976]。于是，意识形态观如今可以被视为反映了一切激进派别的共识：法律是一种虚饰性的力量，为现状之不义关系保驾护航。
