      然而，自然法与法律实证主义这两种立场，在以下目标上是一致的：给出一个关于法律本质的概念。这一努力使二者在法律即意识形态的观点面前拥有共同的敌人——后者认定，试图确定法律的本质根本就是误解。毕竟，倘若法律不可避免地由来自法律之外权力关系的观念塑造，法律似乎便没有本质，无论道德的本质还是制度的本质。倘若法律被还原为意识形态，或被视为其单纯结果，合法性看起来便是偶然的、无原则的：没有必要的内容或定义，没有内在品格。倘若法律既映照又歪曲权力的实在，那么告诉我们法律为何的，就是权力，而非合法性的原则。即便是实证主义的观点——法律渊源是制度性事实问题，可能深受政治与意识形态因素塑造——也与激进的意识形态观相左。毕竟，对实证主义者而言，法律是什么是一个制度性问题：它可能带有意识形态色彩，但并非必然如此。相比之下，在多数主流法律理论家看来，意识形态的并非法律的必要特征；法律当然不应按激进构想来定义——仿佛内在于法律的，正是对实在的神秘化，或为求得服从而对社会关系的遮蔽。
