      How then, can the concept of ideology be deployed in progressive legal scholarship? In fact, the more subtle critiques of ideology grasp the extent to which both liberation and manipulation can be embodied in the law. Recall the nuanced conception of Marx and Engels, where ideology gives an inverted image of reality, but a recognizable image nonetheless. This suggests that the ideals of legality are not a mere charade but are instantiated in the law, if only in a partial and incomplete form. The Marxist historian E.P. Thompson (1975, 265) made this point in his argument for the universal value of the rule of law. Thompson contended that in order for law to function as ideology it must proffer some genuine moral value.
