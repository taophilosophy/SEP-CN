      尽管如此，罗尔斯的政治自由主义并未全盘拒绝哈耶克的忠告，仍执着于使国家不得越界。特别是，罗尔斯主张“正义的基本制度与公共政策”应被理解为“对整全性学说及其相关的善观念保持中立”（2001, 153n27）。罗尔斯的“目标的中立性”（2001, 153n27）映现了 Raz 所谓的“认知上退出纷争”（1994, 46）——政治的范围须受形式程序约束：原初状态的决策程序、公共理性的信条，或政治自由主义对良善生活考量的明确排除。事实上，罗尔斯的程序主义伦理在其后期著作中变得尤为突出：对宪制问题的关注压过了对经济劣势的补救，招致大量批评（见 Barry 1995; Okin 1993; Williams 1993）[^barry-1995][^okin-1993][^williams-1993]。
