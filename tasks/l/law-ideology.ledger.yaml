      Nonetheless, Rawls’s political liberalism does not reject Hayek’s counsel altogether, retaining a preoccupation with keeping the state at bay. In particular, Rawls contends that ‘the basic institutions and public policies of justice’ should be understood as ‘neutral with respect to comprehensive doctrines and their associated conceptions of the good’ (2001, 153n27). Rawls’s ‘neutrality of aim’ (2001, 153n27) reflects what Raz dubbed (1994, 46) an ‘epistemic withdrawal from the fray’ which dictates that the scope of the political be constrained by formal procedures: the decision process of the original position; the tenets of public reason; or political liberalism’s explicit exclusion of considerations about the good life. Indeed, Rawls’s proceduralist ethic became especially prominent in his later work, where the focus on constitutional questions over the remedy of economic disadvantage attracted much critical comment (see Barry 1995; Okin 1993; Williams 1993)[^barry-1995][^okin-1993][^williams-1993].
