      ## 1 自由主义的意识形态概念
  - id: 5
    kind: body
    source: |-
      What is ideology? The term was likely coined by the French thinker Claude Destutt de Tracy at the turn of the nineteenth century, in his study of the Enlightenment. For De Tracy, ideology was the science of ideas and their origins. Ideology understands ideas to issue, not haphazardly from mind or consciousness, but as the result of forces in the material environment that shape what people think. De Tracy believed his view of ideology could be put to progressive political purposes, since understanding the source of ideas might enable efforts on behalf of human progress (see Steger 2007, 24–32)[^steger-2007].
    step1: |-
      什么是意识形态？这个词很可能是法国思想家德斯蒂·德·特拉西（Destutt de Tracy）在十九世纪之交研究启蒙运动时创造的。对德·特拉西而言，意识形态是关于观念及其起源的科学。意识形态把观念理解为并非从心灵或意识中随意产生，而是作为物质环境中诸种力量塑造人们所思所想的结果。德·特拉西相信他的意识形态观可以用于进步的政治目的，因为理解观念的来源或可有助于推动人类进步的事业（见 Steger 2007, 24–32）[^steger-2007]。
    step2: |-
      什么是意识形态？这个词很可能是法国思想家德斯蒂·德·特拉西（Destutt de Tracy）在十九世纪之交研究启蒙运动时造出的。对德·特拉西而言，意识形态是关于观念及其起源的科学：观念并非从心灵或意识中随意生出，而是物质环境中诸种力量塑造人之所思的结果。德·特拉西相信，他的意识形态观可用于进步的政治目的——理解观念的来源，或可助力人类进步的事业（见 Steger 2007, 24–32）[^steger-2007]。
  - id: 6
    kind: body
    source: |-
      Ideology today is generally taken to mean not a science of ideas, but the ideas themselves, and moreover ideas of a particular kind. Ideologies are ideas whose purpose is not epistemic but political. Thus an ideology exists to confirm a certain political viewpoint, serve the interests of certain people, or to perform a functional role in relation to social, economic, political and legal institutions. Daniel Bell (1960) dubbed ideology ‘an action-oriented system of beliefs,’ and the fact that ideology is action-oriented indicates that its role is not to render reality transparent but to motivate people to do or not do certain things. Such a role may involve a process of justification that requires the obfuscation of reality. Nonetheless, Bell and other liberal sociologists do not assume any particular relation between ideology and the status quo; some ideologies serve the status quo, others call for its reform or overthrow.
    step1: |-
      今天的意识形态，一般不再指观念的科学，而是指观念本身，而且是特定类型的观念。意识形态是目的不在于认知而在于政治的观念。因此，意识形态的存在是为了确证某种政治观点，服务于某些人的利益，或者在社会、经济、政治与法律制度中发挥一种功能性作用。丹尼尔·贝尔（Daniel Bell，1960）把意识形态称为“以行动为导向的信念体系”；意识形态以行动为导向这一事实表明，它的作用不是使实在变得透明，而是激励人们去做或不做某些事情。这样一种作用可能涉及一个合理化的过程，而合理化需要遮蔽实在。尽管如此，贝尔与其他自由主义社会学家并不假定意识形态与现状之间有任何特定关系；有些意识形态服务于现状，另一些则要求改革或推翻现状。
    step2: |-
      今天的意识形态，一般不再指观念的科学，而是指观念本身，而且是特定一类的观念：其目的不在于认知，而在于政治。意识形态的存在，是为了确证某种政治观点、服务于某些人的利益，或在社会、经济、政治与法律制度中发挥功能性作用。丹尼尔·贝尔（Daniel Bell，1960）称之为“以行动为导向的信念体系”；意识形态以行动为导向，恰恰表明它的作用不是让实在变得透明，而是激励人们去做或不做某些事。这样一种作用，可能牵涉一个合理化过程——而合理化需要遮蔽实在。尽管如此，贝尔与其他自由主义社会学家并不假定意识形态与现状之间有任何特定的关系：有些意识形态服务于现状，另一些则要求改革乃至推翻现状。
