      Thus ideology, far from being a science, as De Tracy contends, or any set of action-oriented beliefs as Bell puts it, is inherently conservative, quietist, and epistemically unreliable. Ideology conserves by camouflaging flawed social conditions, giving an illusory account of their rationale and role, in order to legitimate and win acceptance of them. Indeed, on this view of the ideological role of law, in a just society there would be no need for a mystifying account of reality, and thus no need for law. The concept of law as ideology is thus central to the Marxist view that law will wither away with the full flowering of communism (Sypnowich 1990, ch. 1)[^sypnowich-1990].
    step1: |-
      因此，意识形态远非德·特拉西所主张的科学，也不是贝尔所说的任何一套以行动为导向的信念，它天生是保守的、主静的、在认知上不可靠的。意识形态通过掩盖有缺陷的社会状况来保存它们，对它们的理据与角色给出一种虚幻的说明，以使它们获得正当性并赢得接受。的确，按照这种关于法律之意识形态角色的观点，在一个公正的社会里，将不需要对实在的神秘化说明，因而也不需要法律。法律即意识形态的概念，因此成为马克思主义如下观点的核心：法律将随着共产主义的全面实现而消亡（Sypnowich 1990, ch. 1）[^sypnowich-1990]。
    step2: |-
      于是，意识形态远非德·特拉西所主张的科学，也不是贝尔所谓任何一套以行动为导向的信念——它天生保守、主静，且在认知上不可靠。意识形态靠掩盖有缺陷的社会状况来保存它们，对其理据与角色给出虚幻的说明，使之获得正当性并赢得接受。诚然，照这种关于法律之意识形态角色的观点，在一个公正的社会里，人们不再需要对实在的神秘化说明，因而也不再需要法律。法律即意识形态的概念，由此成为马克思主义如下论断的核心：随着共产主义的全面实现，法律将自行消亡（Sypnowich 1990, ch. 1）[^sypnowich-1990]。
  - id: 11
    kind: body
    source: |-
      The negative view of ideology taken by Marxists might suggest a crude conception where legal ideology is a tool cynically wielded by the powerful to ensure submission by the powerless; and indeed, perhaps the most famous claim about ideology uttered by Marx and Engels (1976) is that ‘the ideas of the ruling class are in every epoch the ruling ideas: i.e., the class which is the ruling *material* force of society, is at the same time its ruling *intellectual* force’. However, the Marxist view is in fact more nuanced than this quote suggests. For example, Engels (1890) contends that it offends the ‘conception of right’ if ‘a code of law is the blunt, unmitigated, unadulterated expression of the domination of a class’. And because ideology such as law takes a formal and normative form, the powerful are in its grips too, persuaded by an account of the inevitable and just order from which they profit.
    step1: |-
      马克思主义者对意识形态的消极看法，或许暗示一种粗糙的构想：法律意识形态是当权者愤世嫉俗地挥舞的工具，用以确保无权者的顺从；而且，马克思和恩格斯（1976）关于意识形态最著名的论断似乎也支持这一点：“统治阶级的思想在每一个时代都是占统治地位的思想：这就是说，一个阶级是社会上占统治地位的*物质*力量，同时也是社会上占统治地位的*精神*力量。”然而，马克思主义的观点实际上比这句引文所暗示的更为精细。例如，恩格斯（1890）主张，如果“一部法典是某个阶级之统治的赤裸裸的、不加掩饰的、纯粹的表达”，那就冒犯了“权利的观念”。而且，由于意识形态（如法律）采取形式的与规范性的形态，当权者也身受其制，被一种关于他们从中渔利的、不可避免且公正的秩序的说明所说服。
    step2: |-
      马克思主义者对意识形态的消极看法，或许暗示一种粗糙的构想：法律意识形态不过是当权者愤世嫉俗地挥舞的工具，用以确保无权者的顺从；马克思和恩格斯（1976）关于意识形态最著名的论断似乎也印证这一点：“统治阶级的思想在每一个时代都是占统治地位的思想：这就是说，一个阶级是社会上占统治地位的*物质*力量，同时也是社会上占统治地位的*精神*力量。”然而，马克思主义的观点实际比这句引文所示更为精细。例如，恩格斯（1890）主张：倘若“一部法典是某个阶级之统治的赤裸裸的、不加掩饰的、纯粹的表达”，那就冒犯了“权利的观念”。况且，意识形态（如法律）取形式的与规范性的形态，当权者亦身受其制——他们同样被一种说法所说服：那个他们从中渔利的秩序，既不可避免，又公正无欺。
