      All this points to another, related tension. This is the tension between the radical ideology view and the concept of the rule of law, the centrepiece of a liberal legal order. At their most basic, the terms the rule of law, due process, procedural justice, legal formality, procedural rationality, justice as regularity, all refer to the idea that law should meet certain procedural requirements so that the individual is enabled to obey it. These requirements center on the principle that the law be general, that it take the form of *rules*. Law by definition should be directed to more than a particular situation or individual; as Lon Fuller notes, the rule of law also requires that law be relatively certain, clearly expressed, open, prospective and adequately publicised.
    step1: |-
      凡此种种，都指向另一种相关的紧张：激进意识形态观与法治概念之间的紧张——后者是自由主义法律秩序的中枢。就其最基本的意义而言，法治、正当程序、程序正义、法律形式性、程序合理性、作为规则性的正义这些说法，都指向同一个观念：法律应当满足某些程序要求，个人方得以服从它。这些要求集中于一条原则：法律须有一般性，须采取*规则*的形式。按定义，法律所指向的不应只是特定情形或特定个人；如朗·富勒所言，法治还要求法律相对确定、表述清晰、公开、面向未来并得到充分颁布。
