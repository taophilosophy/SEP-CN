  - id: 9
    kind: body
    source: |-
      A more critical understanding of law’s relation to ideology, and of the role and purposes that ideology serves, is found in the writings of Karl Marx and Friedrich Engels. Like De Tracy, Marx and Engels contend that ideas are shaped by the material world, but as historical materialists they understand the material to consist of relations of production that undergo change and development. Moreover, for Marx and Engels, it is the exploitative and alienating features of capitalist economic relations that prompt ideas they dub ‘ideology.’ Ideology only arises where there are social conditions such as those produced by private property that are vulnerable to criticism and protest; ideology exists to protect these social conditions from attack by those who are disadvantaged by them. Capitalist ideologies give an inverted explanation for market relations, for example, so that human beings perceive their actions as the consequence of economic factors, rather than the other way around, and moreover, thereby understand the market to be natural and inevitable. Members of the Frankfurt School such as Jürgen Habermas drew on the Marxist idea of ideology as a distortion of reality to point to its role in communication, wherein interlocutors find that power relations prevent the open, uncoerced articulation of beliefs and values (see Geuss, 1981).
    step1: |-
      在卡尔·马克思（Karl Marx）与弗里德里希·恩格斯（Friedrich Engels）的著作中，可以找到对法律与意识形态的关系、以及意识形态的角色与目的的更为批判的理解。与德·特拉西一样，马克思和恩格斯主张观念由物质世界塑造，但作为历史唯物主义者，他们把物质理解为经历变化与发展的生产关系。此外，对马克思和恩格斯来说，正是资本主义经济关系的剥削性与异化性引发了他们称之为“意识形态”的观念。唯当存在私人财产所造成的那类易于招致批评与抗议的社会条件，意识形态才会产生；意识形态的存在，就是保护这些社会条件免受深受其害者的攻击。例如，资本主义意识形态对市场关系给出一种颠倒的解释：人们把自己的行动视为经济因素的后果，而非其原因，而且由此把市场理解为自然的、不可避免的。于尔根·哈贝马斯（Jürgen Habermas）等法兰克福学派的成员，借马克思主义“意识形态即对实在之歪曲”的观念，指明意识形态在交往中的作用：对话双方发现，权力关系阻碍了信念与价值的公开而不受强制的表达（见 Geuss, 1981）。
    step2: |-
      在卡尔·马克思（Karl Marx）与弗里德里希·恩格斯（Friedrich Engels）的著作中，可以找到对法律与意识形态之关系、以及意识形态之角色与目的的更为批判的理解。与德·特拉西一样，马克思和恩格斯主张观念由物质世界塑造；但作为历史唯物主义者，他们把物质理解为经历变化与发展的生产关系。此外，在他们看来，正是资本主义经济关系的剥削性与异化性，引发了他们称之为“意识形态”的观念。唯当存在私人财产所造成的那类易于招致批评与抗议的社会条件，意识形态才会产生；意识形态的使命，就是保护这些社会条件免遭深受其害者的攻击。例如，资本主义意识形态对市场关系给出一种颠倒的解释：人们把自己的行动当作经济因素的后果，而非其原因，并且由此把市场理解为自然而不可避免的。于尔根·哈贝马斯（Jürgen Habermas）等法兰克福学派的成员，借马克思主义“意识形态即对实在之歪曲”的观念，指明意识形态在交往中的作用：对话双方发现，权力关系阻碍了信念与价值的公开而不受强制的表达（见 Geuss, 1981）。
