      In the 1920s, American jurisprudence came under the influence of another version of the critical view of ideology and law. The school of legal realism abandoned Marx’s specifically historical materialist explanation and took up the idea that social forces outside the law are central in determining what the law is (see Cohen 1935, 818–21)[^cohen-1935]. Realists opposed traditional ‘formalist’ accounts of adjudication, where judges are understood to rely on uniquely and distinctively legal materials in rendering their judgments. Instead, the realists contended that law is inherently indeterminate, and thus judicial decisions must be explained by factors outside the law. Ideology emerges as one kind of realist explanation, where judicial decisions are the effect of political ideas, be they of the judge, the legal profession more generally, societal elites, or majority public opinion. The realists aligned their critique of law with a progressive politics. The inevitable influence of factors external to the law meant that social and political changes augured by the emerging welfare state were no threat to the purity of law. Indeed, the expanding regulative power of the administrative state would make it more likely that the influences on the law were now those of popular sovereignty and social justice, rather than the more nefarious influences of the past.
    step1: |-
      二十世纪二十年代，美国的法理学受到意识形态与法律之批判观的另一个版本的影响。法律现实主义学派抛弃了马克思特有的历史唯物主义解释，转而采纳这样一种观念：法律之外的社会力量，在决定法律为何这一点上居于中心（见 Cohen 1935, 818–21）[^cohen-1935]。现实主义者反对传统的“形式主义”裁判理论——在那类理论中，法官被理解为依凭独有的、独特的法律材料作出判决。相反，现实主义者主张法律在本性上是不确定的，司法判决必须由法律之外的因素来解释。意识形态便是现实主义解释之一种：司法判决乃是政治观念的结果——无论这些观念属于法官本人、整个法律职业界、社会精英，抑或多数公众舆论。现实主义者将其法律批判与进步政治结盟：法律外部因素之影响既然不可避免，新兴福利国家所预示的社会与政治变革，便不致威胁法律的纯粹性。诚然，行政国家不断扩张的规制权力，将使法律所受的影响更可能来自人民主权与社会正义，而非昔日那些更阴险的势力。
