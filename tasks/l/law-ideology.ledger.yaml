      It is interesting to reflect on the provocative suggestion that liberal political philosophy is itself a form of ideology. This might be deduced from the canonical critiques by feminists such as Susan Moller Okin (1989) and critical race theorists like Charles Mills (1997) who point to the problematic assumptions of, e.g., Rawls’s theory of justice, when it comes to issues of gender and race. Another issue, I propose, is the pervasive impact of the juridical ideal so central to liberal political theory. The values of legal proceduralism have had considerable influence on political philosophy, particularly liberalism. We saw that in his critique of the welfare state, Hayek contended that law’s procedural rules dictated a laissez-faire economy in which the state is expected only to provide a framework for private initiatives. Left-wing liberals such as Rawls and Dworkin, in contrast, insist that the state properly plays a role in remedying economic disadvantage. Rawls was concerned that citizens enjoy the genuine ‘worth’ or ‘fair value’ of equal political liberties (Rawls 2007, 148–9)[^rawls-2007]. Moreover, he also took the view that both liberal democratic socialism and a property-owning democracy were candidates for realising his principles of justice. Articulating this as the effort to find an ‘alternative to capitalism’, (2001, 135–6) Rawls was picking up on the claim in his political philosophy lectures that Marx’s idea of ‘freely associated producers’ involves a ‘democratic economic plan’ (2007, 372).
