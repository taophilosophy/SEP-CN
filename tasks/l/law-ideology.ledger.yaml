      After a long period of disinterest among analytical philosophers in the question of ideology (deemed ‘not worth the trouble’ by Richard Rorty (1995, 232)), several writings have made a significant contribution. What might be termed a welcome ‘new wave’ in ideology scholarship reprises some familiar themes, particularly the question of the relationship between ideology and rationality. Yet a new, pluralistic context, informed by attention to the politics of difference, race, gender and identity, renders the analysis of these familiar questions particularly illuminating. Tommie Shelby, for example, defines ideology as ‘epistemically defective beliefs that function to promote social injustice’, focussing on how ideology justifies unjust racist institutions (Shelby 2003, 66)[^shelby-2003], or as Chris Lebron puts it, how racism is perpetuated by ‘legitimizing myths’ (Lebron 2013, 57)[^lebron-2013]. Shelby’s analysis draws on his bracing command of the Marxist tradition and deploys the critical theory typology of Raymond Geuss. This approach identifies ideology as possessing the function of perpetuating injustice, yet nonetheless purporting to meet cognitivist criteria, in the sense of referring to beliefs, judgements and forms of reasoning (Geuss, 1981, 123–22). Thus, just as Marx contrasted ideology with science, and predicted that communism would be beyond ideology, Shelby contends that key to the anti-racist project is to expose the cognitive failings of racist ideology.
    step1: |-
      在分析哲学家对意识形态问题长期冷落之后（理查德·罗蒂径直认为此问题“不值得费心”（1995, 232）），一些著述作出了重要贡献。意识形态研究中一场可喜的“新浪潮”，重提了一些熟悉的主题，尤其是意识形态与理性之关系的问题。然而，一个关注差异政治、种族、性别与身份的新多元语境，使这些老问题的分析格外具有启发性。例如，Tommie Shelby 把意识形态定义为“在认知上有缺陷、其功能在于助长社会不义的信念”，聚焦于意识形态如何为不义的种族主义制度辩护（Shelby 2003, 66）[^shelby-2003]；或如 Chris Lebron 所说，种族主义如何借“合法化的神话”得以延续（Lebron 2013, 57）[^lebron-2013]。Shelby 的分析植根于他对马克思主义传统的扎实掌握，并动用 Raymond Geuss 的批判理论类型学。这一进路认定意识形态具有延续不义的功能，却仍自称满足认知主义的判准——即涉及信念、判断与推理形式（Geuss, 1981, 123–22）。于是，正如马克思把意识形态与科学对举、预言共产主义将超越意识形态，Shelby 主张反种族主义事业的关键，在于揭露种族主义意识形态的认知失败。
