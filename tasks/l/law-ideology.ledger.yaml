      Moreover, ideology is no mere fiction; it is produced by real social conditions and reflects them. Thus ideology must succeed in constituting a consensus about capitalism, and it must do so by giving expression to capitalism’s recognizable features. Equality before the law, for example, is both elicited by, and reflects, the reality of capitalist economic relations, even if it is an equality that is formal and incomplete. Consent will not be forthcoming if legal ideology bears no relation whatsoever to the social conditions it seeks to justify. The idea that ideology inverts reality is important here. In his camera obscura metaphor in *The German Ideology*, Marx and Engels contend that reality appears upside down in ideology, much like the way that the photographic process provides an inverted image. The inverted image is telling; it is a recognisable depiction of reality, even if it is at the same time a distorted one (Marx and Engels 1976, 25)[^marx-1976]. Karl Mannheim (1936) elaborated further on the idea of the complex relation between reality and ideology by pointing to the human need for ideology. Ideologies are neither true nor false but are a set of socially conditioned ideas that provide a truth that people, both the advantaged and the disadvantaged, want to hear.
    step1: |-
      此外，意识形态绝非纯粹的虚构；它由真实的社会条件产生，并反映这些条件。因此，意识形态必须成功地构成关于资本主义的一致意见，而且必须通过表达资本主义可辨认的特征来做到这一点。例如，法律面前人人平等，既由资本主义经济关系的实在所引发，也反映这种实在，即使这是一种形式的、不完全的平等。如果法律意识形态与它试图为之辩护的社会条件毫无关系，就不会有同意可言。意识形态颠倒实在这一观念在此很重要。在《德意志意识形态》的暗箱比喻中，马克思和恩格斯主张，实在在意识形态中呈现为颠倒的，正如照相术提供倒立的影像。倒立的影像意味深长：它是实在的一幅可辨认的描绘，尽管同时也是一幅被歪曲的描绘（Marx and Engels 1976, 25）[^marx-1976]。卡尔·曼海姆（Karl Mannheim，1936）进一步阐发了实在与意识形态之间复杂关系的观念，他指出人类对意识形态的需要。意识形态既不真也不假，而是一组受社会制约的观念，它提供一种人们——无论得势者还是失势者——都乐于听闻的真理。
