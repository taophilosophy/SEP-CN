      与之相对，实证主义者主张：法律是什么，仅由法律体系内部的制度性事实决定；这些事实可能符合道德标准，也可能不符合。早期实证主义者如托马斯·霍布斯与约翰·奥斯丁主张，甚至法律的正当性也不取决于道德判准：法律必须被服从，无论它在多大程度上有悖于道德理想。较晚近的倡导者，如 H.L.A. 哈特与 Joseph Raz，则主张法律实证主义只承诺这样一个观念：法律是什么是一个事实问题；法律的正当性可以由法律之外的道德判准来判定，而这些判准可能主张不服从。然而，全体实证主义者都一致同意：尽管法律可能符合道德判准，法律是什么与法律应当是什么必须严加区分。
