      These claims about the rule of law and ideology are complex and need careful scrutiny. Does the rule of law necessarily involve manipulation on behalf of the capitalist order? Given its formal virtues, and its agnosticism on the content of law, the rule of law seems innocent of charges of a capitalist bias, or a bias of any kind. As Raz puts it, the rule of law’s virtue is like the virtue of a sharp knife; it enables the law to fulfill its function, whatever the function might be (Raz 1979)[^raz-1979]. Moreover, it is hard to see how the rule of law itself is engaged in any project of deception. Generality in the law, for example, does not necessarily entail any particular commitments on how the economy or society should be organized; nor does it propagate falsity or error. Nonetheless, it is true that the proceduralism of the rule of law can be put to ideological purposes, to deflect social criticism and prevent radical change. And if enthusiasts of the rule of law place enough emphasis on procedural justice, this can reduce the likelihood that more substantive conceptions of justice will have success. Historically, societies governed by the rule of law have tended to be structured by capitalist markets, suggesting an affinity between the two sets of institutions. The rule of law can have an ideological effect even if it is not ideological in its essence.
    step1: |-
      关于法治与意识形态的这些主张错综复杂，须仔细审视。法治必然包含代表资本主义秩序的操纵吗？鉴于其形式美德及其对法律内容的不预设，法治似乎与“资本主义偏见”的指控——或任何偏见——无涉。如 Raz 所言，法治之美德如同一把锋利小刀的美德：它使法律得以履行其功能，无论那功能为何（Raz 1979）[^raz-1979]。此外，很难看出法治本身如何参与任何欺骗的图谋：例如，法律中的一般性并不必然蕴含任何关于经济或社会应如何组织的特定承诺，它也不传播虚假或谬误。尽管如此，法治的程序主义确实可以被用于意识形态的目的——转移社会批评、阻止激进变革。而倘若法治的热情拥护者把程序正义强调到足够程度，便可能降低更实质的正义观获得成功的几率。历史上，法治治理的社会往往以资本主义市场构筑其结构，这暗示两套制度之间的亲和。法治可以产生意识形态的效果，即使其本性并非意识形态的。
