      The pejorative understanding of ideology appears to be contested by Jason Stanley, who speaks of ‘flawed ideological belief’ (Stanley 2015, 179)[^stanley-2015] with the implication that ideological belief need not be flawed. Yet he contends that ideology is connected to, and legitimates, one’s identity, implying that such a relationship impugns the veracity of ideology in its very essence (Stanley 2015, 182)[^stanley-2015]. Ideology is in the realm of belief to which one has emotional attachments, and thus in need of correction by clear-sighted rational discourse. Indeed, Stanley goes on to say that ideological belief is ‘by its nature epistemically defective’ or at least ‘epistemically suspect’, echoing Shelby (2003, 198–9), though Stanley also singles out ideologies that have ‘additional epistemological flaws’ (2015, 200). Noting this vacillation on ideology’s relation to truth, Charles Mills contends that though dominant ideologies mislead in the service of oppression, ‘subversive ideologies’ can counter those narratives and foment revolution (Mills 2018, 496)[^mills-2018].
    step1: |-
      意识形态的贬义理解似乎受到 Jason Stanley 的质疑：他谈到“有缺陷的意识形态信念”（Stanley 2015, 179）[^stanley-2015]，言下之意是意识形态信念未必有缺陷。然而他又主张意识形态与一个人的身份相连并为后者背书，暗示这样一种关系本身就质疑意识形态的真实性（Stanley 2015, 182）[^stanley-2015]。意识形态属于人怀有情感依附的信念领域，因而需要清醒的理性话语来纠正。诚然，Stanley 进而说，意识形态信念“在本性上认知有缺陷”，或至少“认知上可疑”——这与 Shelby（2003, 198–9）相呼应；不过 Stanley 也单独挑出那些另有“额外认识论缺陷”的意识形态（2015, 200）。Charles Mills 注意到意识形态与真理关系上的这种摇摆，主张：尽管占主导地位的意识形态为压迫而误导人，“颠覆性的意识形态”可以对抗那些叙事、并发动革命（Mills 2018, 496）[^mills-2018]。
