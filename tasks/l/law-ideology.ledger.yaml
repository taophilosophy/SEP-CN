      然而，图景更为复杂。法律即意识形态的马克思主义观点，毕竟与法律渊源问题上的竞争性观点有几分亲缘（见 Sypnowich 1990, ch.2）[^sypnowich-1990]。例如，马克思主义观点向实证主义者让步，承认法律产生于社会实践——尽管这些实践是法律之外的（政治的、经济的与社会的），而非法律体系内部的制度性事实之实践。社会力量最终决定法律体系的内容与形式。诚然，马克思主义者路易·阿尔都塞的意识形态国家机器观念（Althusser 1971）[^althusser-1971]带有实证主义味道：它坚持政治实在可以仅凭结构而非承载规范的行动者来穷尽描述。尽管如此，激进的意识形态论者想必会抵制实证主义-意识形态观点的结合：在实证主义对制度的强调中，激进者会看出一种对塑造那些制度的意识形态结构太过缺乏批判的态度。然而，实证主义立场也可以被解释为拒绝把任何正当性归于那些定义法律的制度——如此，它至少在潜在意义上与意识形态观相合。
