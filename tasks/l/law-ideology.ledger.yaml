      At the same time, the role of ideology can be overstated. As Marx contended, ideology plays a cementing role, but capitalism (and racism and sexism) are material institutions first and foremost. Thus Shelby (2003, 188) concludes that it is the ‘oppressive conditions that make ideologies necessary’ and thus those conditions must be transformed if we are to be rid of ideologies and their pernicious, obfuscating role. Haslanger (2017, 15) too insists that ‘social change requires changes in our practices’. The functional definition of ideology helps make this clear. Worries about the validity of functional explanation, e.g., that the cause of a legal institution is explained by a future function, can be allayed, as proposed by G.A. Cohen in his classic work on Marx, by the idea of an ideology’s tendency to cement the institutions that caused it. Thus, the legal domain is particularly interesting, for it is both a domain of values and beliefs (equality before the law, impartial procedures, individual rights), and material practices that determine people’s lots in life, not just whether they are convicted of some crime, but also the institutional structures within which the distribution of property and power operates.
    step1: |-
      与此同时，意识形态的作用可能被夸大。正如马克思所主张，意识形态发挥黏合作用，但资本主义（以及种族主义与性别歧视）首先是物质的制度。因此 Shelby（2003, 188）得出结论：是“压迫性的条件使意识形态成为必要的”；若要摆脱意识形态及其有害的遮蔽作用，就必须改造那些条件。Haslanger（2017, 15）也坚持“社会变革要求改变我们的实践”。意识形态的功能性定义有助于澄清这一点。对功能性解释之效力的担忧——例如，法律制度的原因由未来的功能来解释——可以按 G. A. 科恩在其马克思研究经典中提出的办法消解：意识形态有一种巩固“引发它的那些制度”的倾向。由此，法律领域尤为耐人寻味：它既是一个价值与信念的领域（法律面前的平等、公正的程序、个人权利），也是决定人之命运荣枯的物质实践的领域——不仅决定人们是否被定罪，而且决定财产与权力分配运作于其中的那些制度结构。
