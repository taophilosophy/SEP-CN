      尽管如此，对程序主义之意识形态影响的担忧，并不否定法治本身应当发挥的宝贵作用——即便在最雄心勃勃的平等主义共同体中亦然。对法律的一种轻慢态度的潜在可能，或许再加上马克思主义影响力的普遍衰落（尽管当代哲学中出现了令人振奋的兴趣迹象），可以解释晚近一些文献为何回避“意识形态”一词，转而选用“话语”或“叙事”之类的说法。这些术语同样暗示法律应在政治语境中理解，但对该语境的性质或其影响，就笼统得多了。这似乎是一种损失。理解得当的话，意识形态概念为合法性提供了一种精细而有启发性的进路，能对法律与政治的关系给出精确的刻画，而无须陷入虚无主义或还原论。毕竟，对法律之意识形态角色的恰当理解，与其他关于如何定义或理解法律的概念是相容的——倘若我们认识到，完全消除意识形态式的理解模式何其不可能，就尤其如此。
