    kind: body
    source: |-
      > ^{⌈}φ ∧ ψ^{⌉}  =*_{df}*  ⟨^{⌈}φ^{⌉}, ^{⌈}∧^{⌉}, ^{⌈}ψ^{⌉}⟩
      >
      > ^{⌈}¬φ^{⌉}  =*_{df}*  ⟨^{⌈}¬^{⌉}, ^{⌈}φ^{⌉}⟩
      >
      > ^{⌈}∃*X*φ^{⌉}  =*_{df}*  ⟨^{⌈}∃^{⌉}, {^{⌈}*x*^{⌉}: *x* ∈ *X*}, ^{⌈}φ^{⌉}⟩;
