      注意句子 σ₂ 含有 *无穷量词*：它表达了本质上 *二阶* 的断言，即每个可数子集都有最小元。事实上可以证明，这个无穷量词的出现是本质性的：良序结构类无法在任何有穷量词语言中刻画。这个例子表明，L(ω₁,ω₁) 这样的无穷量词语言，行为很像二阶语言；我们将看到，它们既有后者的缺陷（不完全性），也有后者的一些优点（强表达力）。
