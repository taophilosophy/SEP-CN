      [^note-3]: The *I*-*fold* copower of an object *A* is an object

      > ∐_{*I*} *A*

      together with arrows

      > | *A* | →_{σ}*i* | ∐_{*I*}*A* | (*i* ∈ *I*) |
      > | --- | --- | --- | --- |

      such that, for any arrows ƒ_{*i*} : *A* → *B* (*i* ∈ *I*), there is a unique arrow

      > | ∐_{*I*}*A* | →_{*h*} | *B* |
      > | --- | --- | --- |

      for which ƒ_{*i*} = *h* ○ σ_{*i*} for all *i* ∈ *I*.
