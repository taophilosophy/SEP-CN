    kind: body
    source: |-
      > Scott's Undefinability Theorem for L(ω₁,ω₁). *Val*(L(ω₁,ω₁)) *is not definable in* H(ω₁) *even by an* L(ω₁,ω₁)-*formula*; *hence* a fortiori *Val*(L(ω₁,ω₁)) *is not* Σ₁ *on* *H*(ω₁).
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
