      偏好逻辑为理解行动者如何比较情境并决策提供了一个多用途框架。本词条综述了该领域的关键发展，追溯其从句法与算法进路到语义框架的演变。它还着重介绍了关于双层结构的最新研究——这些结构源于内在偏好与外在偏好的区分，强调理由在塑造偏好中的作用。
