      If we write $\varphi\Rightarrow \psi$ for the conditional “if *φ* then *ψ*”, then under suitable conditions, we can define that *φ* is preferred to *ψ* if $\varphi\lor \psi$ implies *φ* and not *ψ*:
    step1: |-
