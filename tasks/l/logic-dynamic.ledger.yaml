      The expression $\langle\alpha\rangle B$ means that there is an execution of *α* that terminates in a state that satisfies $B$. Moreover, if *α* is deterministic, this possible terminating execution is the unique execution of *α*. Thus, if one first manages to prove that a program is deterministic, this trick works well enough to prove its total correctness.
    step1: |-
      表达式 $\langle\alpha\rangle B$ 的意思是：*α* 有一次执行终止于满足 $B$ 的状态。此外，若 *α* 是确定的，则其可能终止的执行只有一次。因此，若能先证明一个程序是确定的，这一手法就足以用来证明它的完全正确性。
    step2: |-
