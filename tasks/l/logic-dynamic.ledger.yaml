  - id: 15
    kind: body
    source: |-
      Propositional dynamic logic (PDL) is designed for representing and reasoning about propositional properties of programs. Its syntax is based upon two sets of symbols: a countable set $\Phi_0$ of atomic formulas and a countable set $\Pi_0$ of atomic programs. Complex formulas and complex programs over this base are defined as follows.
    step1: |-
      命题动态逻辑（PDL）旨在表示并推理程序的命题性质。其语法建立在两组符号之上：原子公式的可数集 $\Phi_0$ 与原子程序的可数集 $\Pi_0$。在此基础上的复合公式与复合程序定义如下。
    step2: |-
      命题动态逻辑（PDL）旨在表示并推理程序的命题性质。其语法建立在两组符号之上：原子公式的可数集 $\Phi_0$ 与原子程序的可数集 $\Pi_0$。在此基础上的复合公式与复合程序定义如下。
  - id: 16
    kind: body
    source: |-
      - Every atomic formula is a formula.
      - $0$ (“false”) is a formula.
      - If $A$ is a formula then $\lnot A$ (“not $A$”) is a formula.
      - If $A$ and $B$ are formulas then $(A\lor B)$ (“$A$ or $B$”) is a formula.
      - If *α* is a program and *A* is a formula then $[\alpha]A$ (“every execution of *α* from the present state leads to a state where $A$ is true”) is a formula.
      - Every atomic program is a program.
      - If *α* and *β* are programs then $(\alpha;\beta)$ (“do *α* followed by *β*”) is a program.
      - If *α* and *β* are programs then $(\alpha\cup\beta)$ (“do *α* or *β*, non-deterministically”) is a program.
      - If *α* is a program then $\alpha^*$ (“repeat *α* a finite, but non-deterministically determined, number of times”) is a program.
      - If $A$ is a formula then $A?$ (“proceed if $A$ is true, else fail”) is a program.
    step1: |-
      - 每个原子公式都是公式。
      - $0$（“假”）是公式。
      - 若 $A$ 是公式，则 $\lnot A$（“非 $A$”）是公式。
      - 若 $A$ 与 $B$ 是公式，则 $(A\lor B)$（“$A$ 或 $B$”）是公式。
