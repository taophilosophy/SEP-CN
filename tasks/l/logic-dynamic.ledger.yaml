      Informally, the mapping $R$ assigns to each atomic program $\pi\in\Pi_0$ some binary relation $R(\pi)$ on $W$ with the intended meaning that $xR(\pi)y$ iff there exists an execution of *π* from $x$ that leads to $y$, whereas the mapping $V$ assigns to each atomic formula $p\in\Phi_0$ some subset $V(p)$ of $W$ with the intended meaning that $x \in V(p)$ iff $p$ is true in the state $x$. Given our readings of $0$, $\lnot A$, $A\lor B$, $[\alpha]A$, $\alpha;\beta$, $\alpha\cup\beta$, $\alpha^*$ and $A?$, it is clear that $R$ and $V$ must be extended inductively as follows to supply the intended meanings for the complex programs and formulas:
    step1: |-
      直观地说，映射 $R$ 给每个原子程序 $\pi\in\Pi_0$ 指派 $W$ 上的某个二元关系 $R(\pi)$，其意图是：$xR(\pi)y$ 当且仅当存在 *π* 从 $x$ 出发、导向 $y$ 的一次执行；而映射 $V$ 给每个原子公式 $p\in\Phi_0$ 指派 $W$ 的某个子集 $V(p)$，其意图是：$x \in V(p)$ 当且仅当 $p$ 在状态 $x$ 中为真。鉴于我们对 $0$、$\lnot A$、$A\lor B$、$[\alpha]A$、$\alpha;\beta$、$\alpha\cup\beta$、$\alpha^*$ 与 $A?$ 的读法，显然 $R$ 与 $V$ 必须按如下方式归纳扩展，以为复合程序与公式提供预期意义：
    step2: |-
