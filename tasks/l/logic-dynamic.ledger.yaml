      In another variant of PDL, due to Peleg [1987] and further studied by Goldblatt [1992b], the expression $\alpha \cap \beta$ is interpreted “do *α* and *β* in parallel”. In this context, the binary relations $R(\alpha)$ and $R(\beta)$ are no longer sets of pairs of the form $(x,y)$ with $x$ and $y$ worlds, but rather sets of pairs of the form $(x, Y)$ with $x$ a world and $Y$ a set of worlds. It was inspired by the Game Logic of Parikh [1985], an intepretation of PDL with “programs as games”. Game Logic provides an additional program construct that dualizes programs, thus permitting to define the intersection of programs as the dual of the non-deterministic choice between programs.
    step1: |-
      在 PDL 的另一个由 Peleg [1987] 提出、并经 Goldblatt [1992b] 进一步研究的变体中，表达式 $\alpha \cap \beta$ 被解释为“并行地执行 *α* 与 *β*”。在此语境中，二元关系 $R(\alpha)$ 与 $R(\beta)$ 不再是形如 $(x,y)$ 的对之集（其中 $x$ 与 $y$ 是世界），而是形如 $(x, Y)$ 的对之集（其中 $x$ 是一个世界，$Y$ 是一个世界集）。这一想法受 Parikh [1985] 的博弈逻辑启发，后者是把 PDL 解释为“程序即博弈”的一种解释。博弈逻辑提供了一个额外的程序构造，可对程序作对偶化，从而使人们能够把程序交定义为程序间非确定选择的对偶。
