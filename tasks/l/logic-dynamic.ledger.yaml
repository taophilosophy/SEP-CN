      In one sentence, what goes on in $M$ is that from the world $u$, there is an infinite number of finite *π*-paths of growing length. We have both $M, u$ sat $\lnot\Delta\pi$ and $M, u$ sat $\lnot\infty(\pi^*)$. Yet, for every PDL formula $A$, we will have both $\Delta\pi$ and $\infty(\pi^*)$ that are satisfied at the equivalence class of $u$ in the model obtained by filtration of $M$ with $FL(A)$. Indeed, the filtration must collapse some states of $M$ and create some loops. Thus, there exists no PDL formula that can express $\Delta\pi$ and there exists no PDL formula that can express $\infty(\pi^*)$.
    step1: |-
      一句话，$M$ 中发生的情形是：从世界 $u$ 出发，有无穷多条长度不断增长的、有穷的 *π*-路径。我们既有 $M, u$ 满足 $\lnot\Delta\pi$，也有 $M, u$ 满足 $\lnot\infty(\pi^*)$。然而，对每个 PDL 公式 $A$，在借助 $FL(A)$ 对 $M$ 作滤化所得的模型中，$\Delta\pi$ 与 $\infty(\pi^*)$ 都会在 $u$ 的等价类处得到满足。的确，滤化必定会塌缩 $M$ 的某些状态并制造出若干循环。因此，不存在能表述 $\Delta\pi$ 的 PDL 公式，也不存在能表述 $\infty(\pi^*)$ 的 PDL 公式。
