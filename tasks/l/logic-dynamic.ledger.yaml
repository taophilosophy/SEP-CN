      It is easy to see that in the Hoare calculus presented above, non termination can only come from the rule of iteration. Analogously, non termination of a PDL program can only come from the use of the unbounded iteration. The expression $\Delta\alpha$ indicates that $\alpha^*$ can diverge, and this is just the kind of notion we need. We can now inductively define a predicate $\infty$ such that for a program *α*, the formula $\infty(\alpha)$ will be true exactly when *α* can enter a non-terminating computation.
    step1: |-
      容易看出，在上述霍尔演算中，不终止只可能来自迭代规则。类似地，一个 PDL 程序的不终止只可能来自无界迭代的使用。表达式 $\Delta\alpha$ 表示 $\alpha^*$ 可能发散，而这正是我们需要的那种概念。现在我们可以归纳地定义一个谓词 $\infty$，使得对程序 *α*，公式 $\infty(\alpha)$ 为真恰好当 *α* 能够进入不终止的计算。
    step2: |-
      容易看出，在上述霍尔演算中，不终止只可能来自迭代规则。类似地，一个 PDL 程序的不终止只可能来自无界迭代的使用。表达式 $\Delta\alpha$ 表示 $\alpha^*$ 可能发散，而这正是我们需要的那种概念。现在我们可以归纳地定义一个谓词 $\infty$，使得对程序 *α*，公式 $\infty(\alpha)$ 为真恰好当 *α* 能够进入不终止的计算。
