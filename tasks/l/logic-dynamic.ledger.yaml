    source: |-
      Historically, logics of programs stem from the work in the late 1960s of computer scientists interested in assigning meaning to programming languages and finding a rigorous standard for proofs about the programs. For example such proofs may be about the correctness of a program with respect to an expected behavior, or about the termination of a program. A seminal paper is Floyd [1967] which presents an analysis of the properties of structured computer programs using *flowcharts*. Some early work such as Yanov [1959] or Engeler [1967] had advanced and studied formal languages in which the properties of program connectives can be expressed. The formalism of Hoare [1969] was a milestone in the advent of PDL. It was proposed as a rigorous axiomatic interpretation of Floyd’s flowcharts. We often talk about Hoare logic, or Floyd-Hoare logic, or Hoare calculus when referring to this formalism. Hoare calculus is concerned with the truth of statements (“Hoare triples”), such as $\{A\}\alpha\{B\}$ which establishes a connection between a precondition $A$, a program *α*, and a post-condition $B$. It indicates that whenever $A$ holds as a precondition of the execution of *α*, then $B$ holds as a post-condition after the successful execution of *α*.
    step1: |-
      从历史上看，程序逻辑源于 20 世纪 60 年代末一些计算机科学家的工作，他们志在为程序设计语言赋予意义，并为关于程序的证明寻找严格的标准。例如，这类证明可以关乎一个程序相对于某种预期行为的正确性，也可以关乎一个程序的终止。Floyd [1967] 是一篇开创性论文，它借助 **流程图** 分析了结构化计算机程序的性质。Yanov [1959] 或 Engeler [1967] 等早期工作已经提出并研究了形式语言，程序联结词的性质可在其中得到表达。霍尔 [1969] 的形式系统是 PDL 诞生过程中的一个里程碑。它被提出来作为对 Floyd 流程图的一种严格的公理化解释。在指称这一形式系统时，我们常说霍尔逻辑、弗洛伊德—霍尔逻辑或霍尔演算。霍尔演算关心的是语句（“霍尔三元组”）的真，例如 $\{A\}\alpha\{B\}$，它建立起前提条件 $A$、程序 *α* 与后条件 $B$ 之间的联系。它表示：只要 $A$ 作为 *α* 执行的前提条件成立，那么 *α* 成功执行之后 $B$ 就作为后条件成立。
