  - id: 125
    kind: body
    source: |-
      By Hoare’s own admission in Hoare [1979], his original calculus was merely a starting point and suffered quite a few limitations. Particularly, it only allows one to reason about *partial* correctness. That is, the truth of a statement $\{A\}\alpha\{B\}$ only makes sure that all executions of *α* starting in a state satisfying $A$ will end in a state satisfying $B$, *or will not halt*. That is, a partially correct program may have non-terminating executions. (In fact, a program that has no terminating execution will always be partially correct. This is the case for example of the program $\mathsf{while}~ 1 ~\mathsf{do}~ \mathsf{skip}$. The formula $A \rightarrow [\mathsf{while}~1 ~\mathsf{do} ~\mathsf{skip}] B$ is deducible for all formulas $A$ and $B$.) The calculus offers no basis for a proof that a program terminates. It can be modified so as to account for *total* correctness of programs: partial correctness plus termination. It is achieved by amending the rule of iteration. We do not present it here and refer the interested reader to Apt [1981].
    step1: |-
      按霍尔本人在霍尔 [1979] 中的说法，他最初的演算只是一个起点，带有不少局限。尤其是，它只允许人们推理 **部分** 正确性。也就是说，语句 $\{A\}\alpha\{B\}$ 的真只保证：*α* 的一切执行，只要从满足 $A$ 的状态出发，就会在满足 $B$ 的状态中结束，**或者不会停机**。换言之，一个部分正确的程序可能含有不终止的执行。（事实上，没有终止执行的程序总是部分正确的。例如程序 $\mathsf{while}~ 1 ~\mathsf{do}~ \mathsf{skip}$ 就是如此。对一切公式 $A$ 与 $B$，公式 $A \rightarrow [\mathsf{while}~1 ~\mathsf{do} ~\mathsf{skip}] B$ 都是可推演的。）该演算没有为“程序终止”的证明提供任何基础。它可以被修改，以便刻画程序的 **完全** 正确性：部分正确性加上终止。这是通过修改迭代规则来实现的。我们在此不再呈现，感兴趣的读者可参见 Apt [1981]。
    step2: |-
      按霍尔本人在霍尔 [1979] 中的说法，他最初的演算只是一个起点，带有不少局限。尤其是，它只允许人们推理 **部分** 正确性。也就是说，语句 $\{A\}\alpha\{B\}$ 的真只保证：*α* 的一切执行，只要从满足 $A$ 的状态出发，就会在满足 $B$ 的状态中结束，**或者不会停机**。换言之，一个部分正确的程序可能含有不终止的执行。（事实上，没有终止执行的程序总是部分正确的。例如程序 $\mathsf{while}~ 1 ~\mathsf{do}~ \mathsf{skip}$ 就是如此。对一切公式 $A$ 与 $B$，公式 $A \rightarrow [\mathsf{while}~1 ~\mathsf{do} ~\mathsf{skip}] B$ 都是可推演的。）该演算没有为“程序终止”的证明提供任何基础。它可以被修改，以便刻画程序的 **完全** 正确性：部分正确性加上终止。这是通过修改迭代规则来实现的。我们在此不再呈现，感兴趣的读者可参见 Apt [1981]。
