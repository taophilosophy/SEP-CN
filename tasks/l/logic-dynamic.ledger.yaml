      In the context of PDL, the two rules of consequence are in fact special cases of the rule of composition. To obtain the first rule, substitute $\alpha_1$ with *α* and $\alpha_2$ with $\mathsf{skip}$. To obtain the second rule, substitute $\alpha_1$ with $\mathsf{skip}$ and $\alpha_2$ with *α*. It suffices to apply the axiom schema (A4), and to remark that $[\alpha;\mathsf{skip}]A \leftrightarrow [\alpha]A$ and $[\mathsf{skip};\alpha]A \leftrightarrow [\alpha]A$ are also $\vdash$-deducible for all $A$ and all *α*.
    step1: |-
      在 PDL 的语境中，两条后承规则实际上是合成规则的特例。要得到第一条规则，把 $\alpha_1$ 替换为 *α*，把 $\alpha_2$ 替换为 $\mathsf{skip}$。要得到第二条规则，把 $\alpha_1$ 替换为 $\mathsf{skip}$，把 $\alpha_2$ 替换为 *α*。只需应用公理图式（A4），并注意到对一切 $A$ 与一切 *α*，$[\alpha;\mathsf{skip}]A \leftrightarrow [\alpha]A$ 与 $[\mathsf{skip};\alpha]A \leftrightarrow [\alpha]A$ 也是 $\vdash$-可推演的。
    step2: |-
