  - id: 3
    kind: body
    source: |-
      Dynamic Logics (DL) are modal logics for representing the states and the events of dynamic systems. The language of DLs is both an assertion language able to express properties of computation states, and a programming language able to express properties of system transitions between these states. DLs are *logics of programs*, and permit to talk and reason about states of affairs, processes, changes, and results.
    step1: |-
      动态逻辑（DL）是用于表示动态系统的状态与事件的模态逻辑。DL 的语言既是一种断言语言，能够表达计算状态的性质，又是一种程序设计语言，能够表达系统在这些状态之间转移的性质。诸 DL 是 **程序逻辑**，它们使我们能够谈论并推理事态、过程、变化与结果。
    step2: |-
      动态逻辑（DL）是用于表示动态系统的状态与事件的模态逻辑。DL 的语言既是一种断言语言，能够表达计算状态的性质，又是一种程序设计语言，能够表达系统在这些状态之间转移的性质。诸 DL 是 **程序逻辑**，它们使我们能够谈论并推理事态、过程、变化与结果。
  - id: 4
    kind: body
    source: |-
      Pratt’s original dynamic logic of programs was a *first-order* modal logic. *Propositional Dynamic Logic* (PDL) is the propositional counterpart of it. It was presented as a logic in its own right in Fischer and Ladner [1979]. Being propositional, the language of PDL makes no use of terms, predicates, or functions. Thus in PDL, there are two syntactic categories: propositions and programs.
    step1: |-
      Pratt 最初关于程序的动态逻辑是一种 **一阶** 模态逻辑。**命题动态逻辑**（PDL）是它的命题对应物。它在 Fischer 与 Ladner [1979] 中作为一门独立的逻辑被提出。作为命题逻辑，PDL 的语言不使用项、谓词或函数。因此，PDL 中有两个句法范畴：命题与程序。
    step2: |-
      Pratt 最初关于程序的动态逻辑是一种 **一阶** 模态逻辑。**命题动态逻辑**（PDL）是它的命题对应物。它在 Fischer 与 Ladner [1979] 中作为一门独立的逻辑被提出。作为命题逻辑，PDL 的语言不使用项、谓词或函数。因此，PDL 中有两个句法范畴：命题与程序。
  - id: 5
    kind: body
    source: |-
      To give meaning to statements in PDL, we typically work with an abstract semantics in terms of Labeled Transition Systems (LTS). LTSs can be seen as a generalization of Kripke models, where transitions between worlds, or states, are “labeled” by names of *atomic* programs. A valuation indicates for every state what *propositions* are true in it. A transition labeled *π* from one state $x$ to a state $y$—noted $xR(\pi)y$, or $(x,y) \in R(\pi)$—indicates that starting in $x$, there is a possible execution of the program *π* that finishes in $y$. If the proposition $A$ is true in $y$, then the formula $\langle\pi\rangle A$ is true in $x$: i.e., in the state $x$ there is a possible execution of the program *π* that ends in a state satisfying $A$. One recognizes in $\langle\pi\rangle$ a modality reminiscent of the modality of possibility (often noted $\Diamond$) of modal logic. Unsurprisingly, there is also a corresponding notion of necessity (whose modality is often noted $\Box$). The formula $[\pi]A$ is true in the state $x$ if $A$ is true in every state reachable from $x$ by a transition labeled *π*.
    step1: |-
      为了赋予 PDL 中的陈述以意义，我们通常使用以标记转移系统（LTS）表述的抽象语义。LTS 可视为克里普克模型的推广，其中世界或状态之间的转移由 **原子** 程序的名称“标记”。一个赋值指明每个状态中哪些 **命题** 为真。从状态 $x$ 到状态 $y$、标记为 *π* 的转移——记作 $xR(\pi)y$，或 $(x,y) \in R(\pi)$——表示：从 $x$ 出发，程序 *π* 存在一次在 $y$ 结束的可能执行。若命题 $A$ 在 $y$ 中为真，则公式 $\langle\pi\rangle A$ 在 $x$ 中为真：也就是说，在状态 $x$ 中，程序 *π* 存在一次在满足 $A$ 的状态中结束的可能执行。人们在 $\langle\pi\rangle$ 中认出一种令人联想到模态逻辑可能性模态（常记作 $\Diamond$）的模态。不出所料，也有相应的必然性概念（其模态常记作 $\Box$）。若 $A$ 在从 $x$ 经标记为 *π* 的转移可达的每个状态中都为真，则公式 $[\pi]A$ 在状态 $x$ 中为真。
    step2: |-
      为了赋予 PDL 中的陈述以意义，我们通常使用以标记转移系统（LTS）表述的抽象语义。LTS 可视为克里普克模型的推广，其中世界或状态之间的转移由 **原子** 程序的名称“标记”。一个赋值指明每个状态中哪些 **命题** 为真。从状态 $x$ 到状态 $y$、标记为 *π* 的转移——记作 $xR(\pi)y$，或 $(x,y) \in R(\pi)$——表示：从 $x$ 出发，程序 *π* 存在一次在 $y$ 结束的可能执行。若命题 $A$ 在 $y$ 中为真，则公式 $\langle\pi\rangle A$ 在 $x$ 中为真：也就是说，在状态 $x$ 中，程序 *π* 存在一次在满足 $A$ 的状态中结束的可能执行。人们在 $\langle\pi\rangle$ 中认出一种令人联想到模态逻辑可能性模态（常记作 $\Diamond$）的模态。不出所料，也有相应的必然性概念（其模态常记作 $\Box$）。若 $A$ 在从 $x$ 经标记为 *π* 的转移可达的每个状态中都为真，则公式 $[\pi]A$ 在状态 $x$ 中为真。
  - id: 6
    kind: body
    source: |-
      The possible executions of complex programs can be next defined compositionally. For instance, a program “first *α*, then *β*” is a complex program, more specifically a *sequence*. A possible execution can be represented in an LTS by composing a two-step transition—a transition which can be signified by $R(\alpha;\beta)$—between the states $x$ and $y$: there is a possible execution in the state $x$ of the program *α* that finishes in a state $z$ and there is a possible execution in $z$ of the program *β* that finishes in the state $y$. If the proposition $A$ is true in $y$, then the formula $\langle \alpha;\beta\rangle A$ is be true in the state $x$. The programs *α* and *β* could be complex program themselves. Still more programs can be expressed with more constructs that we will present in due time.
    step1: |-
      复合程序的可能执行随后可以按组合方式加以定义。例如，程序“先 *α*，后 *β*”是一个复合程序，更确切地说是一个 **顺序**。一次可能执行可在 LTS 中表示为状态 $x$ 与 $y$ 之间的两步转移——该转移可记作 $R(\alpha;\beta)$：在状态 $x$ 中程序 *α* 存在一次在状态 $z$ 结束的可能执行，而在 $z$ 中程序 *β* 存在一次在状态 $y$ 结束的可能执行。若命题 $A$ 在 $y$ 中为真，则公式 $\langle \alpha;\beta\rangle A$ 在状态 $x$ 中为真。程序 *α* 与 *β* 本身也可以是复合程序。我们将在适当时候用更多构造表达更多的程序。
    step2: |-
