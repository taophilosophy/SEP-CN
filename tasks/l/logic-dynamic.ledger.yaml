      In section 3.3 we have defined a predicate $\infty$, where $\infty(\alpha)$ means that the program *α* can have a non-terminating computation. We call LPDL the logic obtained by augmenting PDL with the predicate $\infty$. Clearly, RPDL is at least as expressive as LPDL; The inductive definition of $\infty(\alpha)$ in the language of RPDL is the witness of it. RPDL is in fact strictly more expressive than LPDL. This was shown in Harel and Sherman [1982]. As it can be suspected, both RPDL and LPDL have more expressive power than PDL. It is established by proving that some formulas of RPDL and of LPDL have no equivalent expression in PDL. The proof involves the technique of *filtration* which is designed to collapse an LTS to a finite model while leaving invariant the truth or falsity of certain formulas. For some set of PDL formulas $X$, it consists in grouping into equivalence classes the states of an LTS that satisfy exactly the same formulas in $X$. The set of equivalence classes of states thus obtained becomes the set of states of the filtrate model, and a transition is built appropriately over them.
    step1: |-
      在第 3.3 节中我们定义了一个谓词 $\infty$，其中 $\infty(\alpha)$ 表示程序 *α* 可能有不终止的计算。我们把用该谓词扩充 PDL 所得的逻辑称为带 $\infty$ 谓词的 PDL（LPDL）。显然，RPDL 的表达力至少不弱于 LPDL；$\infty(\alpha)$ 在 RPDL 语言中的归纳定义就是明证。事实上 RPDL 的表达力严格强于 LPDL。这一点由 Harel 与 Sherman [1982] 表明。可以想见，RPDL 与 LPDL 的表达力都强于 PDL。这是通过证明 RPDL 与 LPDL 的某些公式在 PDL 中没有等值表述而确立的。该证明用到了 **滤化** 技术，其设计意图是把一个 LTS 塌缩为有穷模型，同时使某些公式的真假保持不变。对 PDL 公式的某个集合 $X$，滤化就是把一个 LTS 中在 $X$ 里恰好满足相同公式的状态归入等价类。如此得到的诸状态等价类之集，就成为滤化模型的状态集，并在其上适当地构造转移关系。
