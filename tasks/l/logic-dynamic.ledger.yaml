    kind: body
    source: |-
      Logics of programs are modal logics arising from the idea of associating a modality $[\alpha]$ with each computer program *α* of a programming language. The formula $[\alpha]A$ is then to be read as: $A$ is true after the execution of the program *α*. This idea comes from the line of works by Engeler [1967], Hoare [1969], Yanov [1959], and others who formulated and studied logical languages in which the properties of program connectives can be expressed. The algorithmic logic (AL) first developed by Salwicki [1970] and the dynamic logic (DL) elaborated by Pratt [1976] are proper continuations of these works. We will here concentrate on DL. The numerous papers devoted to DL and its variants as well as its many applications in program verification and data structures show that it constitutes a useful tool for studying the properties of programs. Pratt chose to depict DL on what one might call the first-order level, and it was his work that triggered Fischer and Ladner [1979] to define the propositional variant of DL a couple of years later. This article presents an introduction to PDL, the propositional variant of DL.
    step1: |-
      程序逻辑是模态逻辑，源于这样一个想法：为程序设计语言中的每个计算机程序 *α* 配以一个模态词 $[\alpha]$。公式 $[\alpha]A$ 于是读作：$A$ 在程序 *α* 执行之后为真。这一想法源自 Engeler [1967]、托尼·霍尔 [1969]、Yanov [1959] 等人的一系列工作，他们构建并研究了能够表达程序联结词性质的逻辑语言。Salwicki [1970] 首创的算法逻辑（AL），以及 Pratt [1976] 阐发的动态逻辑（DL），正是这些工作的真正延续。我们在此将集中于 DL。大量论文致力于 DL 及其变体，也致力于它在程序验证与数据结构中的诸多应用，这些论文表明，DL 构成了研究程序性质的一种有用工具。Pratt 选择在人们或可称为一阶的层面上刻画 DL，正是他的工作促使 Fischer 与 Ladner [1979] 在几年之后定义了 DL 的命题变体。本文是对 PDL——DL 的命题变体——的导论。
