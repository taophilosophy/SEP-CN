      For the most part, what Lambert has to say about modality is quite basic, and does not extend significantly beyond the traditional Aristotelian topics of conversion of modal principles. As a result, Lagerlund argues that “it is difficult to say anything about their [Lambert and Roger Bacon’s] systematic relation to Kilwardby”, in contradistinction to de Libera who thinks that Kilwardby’s influence on both authors is clear (Lagerlund 2000: 21)[^lagerlund-2000]. One interesting exception, where Lambert’s discussion goes into more depth than some of his contemporaries, is in the conversion rules for contingent propositions, particular in the discussion of how to convert negative contingent propositions when the contingency is taken as *ad utrumlibet* (Lagerlund 2000: 44; Logica/Maloney ¶¶258–274)[^lagerlund-2000].
    step1: |-
      总的来说，兰伯特关于模态所说相当基础，没有显著超出传统亚里士多德的模态命题换位主题。因此 Lagerlund 论证说“很难说他们[兰伯特与罗吉尔·培根]与 Kilwardby 的系统关系是什么”——这与 de Libera 不同，后者认为 Kilwardby 对两位作者的影响是清楚的（Lagerlund 2000: 21）[^lagerlund-2000]。一个有趣的例外——兰伯特的讨论比一些同时代人更深入——是偶然命题的换位规则，特别是当偶然性被取为*任凭两可*时如何换位否定偶然命题的讨论（Lagerlund 2000: 44; Logica/Maloney ¶¶258–274）[^lagerlund-2000]。
    step2: |-
      总的来说，兰伯特关于模态所说相当基础，未显著超出传统亚里士多德的模态命题换位主题。因此 Lagerlund 论证说“很难说他们[兰伯特与罗吉尔·培根]与 Kilwardby 的系统关系是什么”——这与 de Libera 不同：后者认为 Kilwardby 对两位作者的影响是清楚的（Lagerlund 2000: 21）[^lagerlund-2000]。一个有趣的例外——兰伯特的讨论比一些同时代人更深入——是偶然命题的换位规则；特别是当偶然性被取为*任凭两可*时，如何换位否定偶然命题的讨论（Lagerlund 2000: 44; Logica/Maloney ¶¶258–274）[^lagerlund-2000]。
