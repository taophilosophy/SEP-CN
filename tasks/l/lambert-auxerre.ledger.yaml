      Determining Lambert’s influence on future work is contingent upon determining the precise date of his treatise, so to some extent these questions will remain only partially answered. Nevertheless, while there is uncertainty about, e.g., whether Thomas Aquinas knew of Lambert’s work (Goris 2002: 307)[^goris-2002], we do know that Lambert’s *Summa* was widely known by the end of the thirteenth century (Lagerlund 2000: fn. 15)[^lagerlund-2000]. One manuscript copy of the *Summa* from 1280 (MS Médiathèque du Grand Troyes, 2402) was donated by Peter of Limoges (d. 1306) on his death to the Sorbonne (Read 2017: 363)[^read-2017], and it was used as a textbook at the Sorbonne until at least 1334 (Maloney 2015: xliii)[^maloney-2015].
    step1: |-
      确定兰伯特对后世著作的影响，取决于确定其专著的精确日期；因此在某种程度上这些问题只能得到部分回答。不过，虽然例如托马斯·阿奎那是否知道兰伯特的著作尚有不确定性（Goris 2002: 307）[^goris-2002]，我们确实知道兰伯特的《大全》到十三世纪末已广为人知（Lagerlund 2000: fn. 15）[^lagerlund-2000]。一份 1280 年的《大全》手稿抄本（特鲁瓦大地传媒图书馆 MS 2402）由利摩日的彼得（卒于 1306）去世时捐赠给索邦（Read 2017: 363）[^read-2017]；它在索邦被用作教科书，至少到 1334 年（Maloney 2015: xliii）[^maloney-2015]。
    step2: |-
