      What Lambert says reflects developments in the thirteenth century whereby “appellation”, originally a term of grammatical origin and used in a quite wide and flexible way, including in some earlier authors as a synonym for “supposition”, came to have a narrower, more technical definition in logical contexts (Braakhuis 1977: 120; Ebbesen 2013: 66–67)[^braakhuis-1977][^ebbesen-2013].
    step1: |-
