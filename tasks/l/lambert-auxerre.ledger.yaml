      Lambert, in common with his contemporaries such as Robert Kilwardby, Albert the Great, and Roger Bacon (Lagerlund 2000: 23)[^lagerlund-2000], considers only the six basic alethic modalities: truth, falsity, necessity, impossibility, possibility, and contingency (Logica/Maloney ¶176). He sometimes treats possibility and contingency as equivalent (¶194), but sometimes distinguishes between the two (¶¶231–235), in particular when he discusses contingency *ad utrumlibet*, that is contingency which is both not necessary and not impossible (Lagerlund 2000: 24; Logica/Maloney ¶234)[^lagerlund-2000].
    step1: |-
      兰伯特与其同时代人——如 Robert Kilwardby、大阿尔伯特与罗吉尔·培根（Lagerlund 2000: 23）[^lagerlund-2000]——一样，只考虑六种基本的真势模态：真、假、必然、不可能、可能与偶然（Logica/Maloney ¶176）。他有时把可能与偶然当作等价的（¶194），但有时又区分二者（¶¶231–235）——特别是在讨论*任凭两可*的偶然性时，即既非必然也非不可能的偶然性（Lagerlund 2000: 24; Logica/Maloney ¶234）[^lagerlund-2000]。
    step2: |-
      兰伯特与其同时代人——如 Robert Kilwardby、大阿尔伯特与罗吉尔·培根（Lagerlund 2000: 23）[^lagerlund-2000]——一样，只考虑六种基本真势模态：真、假、必然、不可能、可能与偶然（Logica/Maloney ¶176）。他有时把可能与偶然当作等价（¶194），有时又区分二者（¶¶231–235）——尤其在讨论*任凭两可*的偶然性时，即既非必然也非不可能的偶然性（Lagerlund 2000: 24; Logica/Maloney ¶234）[^lagerlund-2000]。
