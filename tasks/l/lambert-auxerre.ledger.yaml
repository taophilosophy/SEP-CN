      There are four different ways that the term “supposition” can be used (Logica/Maloney ¶1239; cf. Braakhuis 1977; 134–136; Mendelsohn 2017: 113)[^braakhuis-1977][^mendelsohn-2017]:
    step1: |-
      “指代”一词可以有四种不同的用法（Logica/Maloney ¶1239；参见 Braakhuis 1977; 134–136; Mendelsohn 2017: 113）[^braakhuis-1977][^mendelsohn-2017]：
    step2: |-
      “指代”一词可有四种不同的用法（Logica/Maloney ¶1239；参见 Braakhuis 1977; 134–136; Mendelsohn 2017: 113）[^braakhuis-1977][^mendelsohn-2017]：
  - id: 21
