      Medieval historians from the fifteenth century onwards identified the author as a canon of Auxerre, and a member of the Dominican order (Maloney 2015: xvii; Pignon 1936: 31)[^maloney-2015][^pignon-1936]; Alessio in his edition of the *Summa* identified the brother of Auxerre with the Lambert from Ligny (Maloney 2015: xvi)[^maloney-2015]. Assuming this identification is correct, there are two competing biographies of Lambert that have been offered:
    step1: |-
      自十五世纪起，中世纪历史学家将作者鉴定为欧塞尔的一名议事司铎、多明我会的成员（Maloney 2015: xvii; Pignon 1936: 31）[^maloney-2015][^pignon-1936]。Alessio 在其《大全》版本中将欧塞尔的那位修士与来自利尼的兰伯特视为同一人（Maloney 2015: xvi）[^maloney-2015]。假定这一鉴定正确，已有两种相互竞争的兰伯特传记被提出：
    step2: |-
