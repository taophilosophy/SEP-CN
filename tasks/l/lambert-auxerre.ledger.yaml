      > According to him [Maierù], the position of Peter of Spain and Lambert of Auxerre is to be regarded as a combination arising from on one side the view of the *Dialectica Monacensis*, the *Tractatus de proprietatibus sermonum* and the *Summe Metenses* (and William of Sherwood) … In my opinion therefore, there is not so much difference between Peter and Lambert and the *Dialectica Monacensis* etc. (Braakhuis 1977: 120)[^braakhuis-1977]
    step1: |-
      > 照他[Maierù]的说法，西班牙的彼得与欧塞尔的兰伯特的立场应被视为一种组合：一侧来自《慕尼黑辩证法》、《论词的语言特性》与《梅斯大全》（以及舍伍德的威廉）的观点……因此在我看来，彼得与兰伯特和《慕尼黑辩证法》等之间没有太大差别。（Braakhuis 1977: 120）[^braakhuis-1977]
