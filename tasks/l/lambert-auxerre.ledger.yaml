      Maloney’s translation, following Alessio’s edition (Maloney 2015: xlvii)[^maloney-2015], consists of eight chapters: (1) Propositions; (2) Predicables; (3) Categories; (4) Remarks After the Categories; (5) Syllogism; (6) Topics; (7) Sophistical Topics; and (8) Properties of Terms, with chapter 8 containing the material of chapters (6–11) of de Rijk’s list. This final section was translated into English by Norman Kretzmann and Eleonore Stump in 1988.
    step1: |-
      Maloney 的译本遵循 Alessio 的版本（Maloney 2015: xlvii）[^maloney-2015]，由八章组成：（1）命题；（2）预述词；（3）范畴；（4）范畴之后的评论；（5）三段论；（6）论题；（7）诡辩论题；以及（8）词项的特性——第八章包含 de Rijk 清单中第（6–11）章的内容。这最后一节由 Norman Kretzmann 与 Eleonore Stump 于 1988 年译为英文。
    step2: |-
