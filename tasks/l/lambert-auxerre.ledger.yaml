      Relations make up the final topic of the final chapter of the *Summa*. The word ‘relation’ is used as a label of many different things, Lambert says, the first of which is “a reciprocal connection of certain things that have a mutual dependence on one another” (Logica/Maloney ¶1393). This reciprocal connection can be of one of three kinds: superiority, subordination, or quality (¶1394) and in this sense it is one of Aristotle’s predicaments (¶1393). This is not the primary sense of relation that Lambert focuses on; instead, he is interested in the use of ‘relation’ or ‘relative’ in which it is “said to be a calling to mind of a thing that has gone before” (¶1395); this is done via particular vocabulary or syntactic constructions, and hence this type of relation is the one that is a proper subject of study for the logician. Lambert’s definition of relation mirrors Peter of Spain’s (Kneepkens 1977: fn. 10)[^kneepkens-1977], as Peter also distinguishes between relatives “whose being it is to be disposed in some manner to something else”, that is, the Aristotelian predicament, and relatives which are “recollective of a thing brought in before it” (Copenhaver 2015: ch. 8, ¶1; cf. also Kann 2016: 235–236)[^kann-2016].
    step1: |-
      关系构成《大全》最后一章的最后一个论题。兰伯特说，“关系”一词被用作许多不同事物的标签，其一是“彼此相互依赖的某些事物之间的互惠联系”（Logica/Maloney ¶1393）。这种互惠联系可以是三者之一：优越、从属或性质（¶1394），在这个意义上它是亚里士多德的范畴之一（¶1393）。这不是兰伯特关注的关系的主要含义；毋宁说，他关心的是“关系”或“关系词”的一种用法——在其中它“被说是对先前之事的回想起”（¶1395）。这是通过特定词汇或句法构造完成的，因此这种关系才是逻辑学家正当的研究主题。兰伯特的关系定义与西班牙的彼得的定义一致（Kneepkens 1977: fn. 10）[^kneepkens-1977]，因为彼得也区分了“其存在是在某种方式上与另一物有联系”的关系词——即亚里士多德的范畴——与“回想起先前行来的事物”的关系词（Copenhaver 2015: ch. 8, ¶1；另参见 Kann 2016: 235–236）[^kann-2016]。
    step2: |-
