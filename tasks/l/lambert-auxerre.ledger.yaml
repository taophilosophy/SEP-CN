    source: |-
      Lambert was the author of a comprehensive textbook on logic, the *Logica* or *Summa Lamberti*. The text was first identified by Carl Prantl in 1867, but it wasn’t until 1971 when an edition of the complete Latin text was produced, by Franco Alessio. (Alain de Libera edited a portion of the text, on appellation, in 1981). In 1988, Eleonore Stump and Norman Kretzmann translated the portion of the *Summa* on the properties of terms, but a complete English translation of the entire work wasn’t available until the translation of Thomas S. Maloney in 2015. In this entry, all English quotations are taken from Maloney, and referenced by paragraph number; nevertheless, it must be noted that both Alessio’s Latin edition and Maloney’s translation should be used with care (Read 2017)[^read-2017], with the latter cross-checked against the former and the former cross-checked against the original manuscripts, many of which are now available online, in cases of any unclarity or confusion in the content.
    step1: |-
      兰伯特是一部全面逻辑教科书的作者——《逻辑》或《兰伯特大全》。该文本由 Carl Prantl 于 1867 年首次鉴定，但直到 1971 年才由 Franco Alessio 编出完整拉丁文本的校勘版。（Alain de Libera 于 1981 年编辑了该文本中关于称呼的部分。）1988 年，Eleonore Stump 与 Norman Kretzmann 翻译了《大全》中关于词项特性的部分，但全书的完整英译直到 Thomas S. Maloney 2015 年的译本方才出现。在本词条中，所有英文引文取自 Maloney，按段落号引用；尽管如此，必须注意 Alessio 的拉丁校勘版与 Maloney 的译本都应审慎使用（Read 2017）[^read-2017]——后者应对照前者校核，前者应对照原始手稿校核（其中许多现已可在线获取），以处理内容中的任何不清楚或混淆之处。
