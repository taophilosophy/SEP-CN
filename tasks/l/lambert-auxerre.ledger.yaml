    source: |-
      According to Lambert, from a logical point of view, it is the fourth way of using the term that matters, because this is the only way that “supposition” is a logical property of terms, whereas the second way doesn’t concern him because it is a property of a proposition rather than of a term. Similarly, the first is not an instance of a property of a term, but rather “a special kind of signification of a term”; in this, Lambert is firmly within the Parisian, as opposed to Oxonian, tradition of supposition theory (Marmo 1989: 172; cf. also Kann 2016: 241)[^kann-2016][^marmo-1989]. The third can be a property of a term or of a larger phrase in an expression, but Lambert says this use of “supposition” is of interest to the grammarian rather than the logician (¶1240).
    step1: |-
      照兰伯持的说法，从逻辑的观点看，重要的是第四种用法，因为唯有这种方式“指代”才是词项的逻辑特性；而第二种用法与他无关，因为那是命题的特性而非词项的特性。同样，第一种也不是词项特性的实例，而是“词项的一种特殊意谓”；在这一点上，兰伯特坚定地处于巴黎传统——而非牛津传统——的指代理论之内（Marmo 1989: 172；另参见 Kann 2016: 241）[^kann-2016][^marmo-1989]。第三种可以是词项或表达式中较大短语的特性，但兰伯特说这种“指代”用法是语法学家而非逻辑学家关心的（¶1240）。
    step2: |-
      照兰伯持之说，从逻辑的观点看，重要的是第四种用法——唯有此，“指代”才是词项的逻辑特性。第二种用法与他无关：那是命题的特性而非词项的。同样，第一种也不是词项特性的实例，而是“词项的一种特殊意谓”。在这一点上，兰伯特坚定地处于巴黎传统——而非牛津传统——的指代理论之内（Marmo 1989: 172；另参见 Kann 2016: 241）[^kann-2016][^marmo-1989]。第三种可以是词项或表达式中较大短语的特性；但兰伯特说，这种“指代”用法是语法学家而非逻辑学家关心的（¶1240）。
