      Sinkler argues that Lambert’s discussion of composition and division influenced Roger Bacon’s discussion of the same, in his *Summule dialectices*, with the latter being “his attempt to improve on Lambert’s account of the nature of the compounded/divided ambiguity in more detail” (Sinkler 1985: 146)[^sinkler-1985]. Likewise Grabmann has identified an anonymous late-thirteenth century text in which he sees the influence of not only Lambert but also William of Sherwood and Peter of Spain (Grabmann 1916: 40–41)[^grabmann-1916]. Marmo identifies Lambert’s “enlarged notion of *suppositio*” within Duns Scotus’s *Ars Vetus*, without going as far as to say that Lambert was the source for Scotus’s views on this matter (Marmo 1989: 172)[^marmo-1989], and Buckner and Zupko have provided substantial indirect evidence that Duns Scotus was quite familiar with Lambert’s work (Bucker & Zupko 2014).
    step1: |-
      Sinkler 论证说，兰伯特关于组合与分割的讨论影响了罗吉尔·培根在《辩证小论》中对同一主题的讨论——后者是“他试图更详细地改进兰伯特关于组合/分割歧义之本性的说明”（Sinkler 1985: 146）[^sinkler-1985]。同样，Grabmann 鉴定出一份十三世纪末的匿名文本，其中他看到了不仅兰伯特还有舍伍德的威廉与西班牙的彼得的影响（Grabmann 1916: 40–41）[^grabmann-1916]。Marmo 在司各脱的《旧逻辑》中识别出兰伯特“扩展了的指代概念”，但没有走到说兰伯特是司各脱在此事上观点的来源的地步（Marmo 1989: 172）[^marmo-1989]；Buckner 与 Zupko 提供了充分的间接证据，表明司各脱相当熟悉兰伯特的著作（Bucker & Zupko 2014）。
    step2: |-
      Sinkler 论证说：兰伯特关于组合与分割的讨论，影响了罗吉尔·培根在《辩证小论》中对同一主题的讨论——后者是“他试图更详细地改进兰伯特关于组合/分割歧义之本性的说明”（Sinkler 1985: 146）[^sinkler-1985]。同样，Grabmann 鉴定出一份十三世纪末的匿名文本，在其中看到不仅是兰伯特、还有舍伍德的威廉与西班牙的彼得的影响（Grabmann 1916: 40–41）[^grabmann-1916]。Marmo 在司各脱的《旧逻辑》中识别出兰伯特“扩展了的指代概念”，但未走到说兰伯特是司各脱在此题上观点之来源的地步（Marmo 1989: 172）[^marmo-1989]；Buckner 与 Zupko 提供了充分的间接证据，表明司各脱相当熟悉兰伯特的著作（Bucker & Zupko 2014）。
