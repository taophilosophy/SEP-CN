      Tracing the evidence for each of these biographies, and variations in the dates ascribed for each, and mapping how this evidence matches on to what we know, or surmise, of the author of the *Summa’s* life, is enormously complex and it is not a question that can be settled here; the most comprehensive summary of the evidence and arguments to date can be found in Maloney (2015: xvi–xl). Nevertheless, we are left with the question of what to call the author, and this question is complicated by how he has been treated in secondary literature in recent decades. The tendency has been for earlier attributions to call him “of Auxerre” (following Alessio) and later ones “of Lagny” (following de Libera), but the compass has to some extent swung back to “of Auxerre” in the last decade. Kretzmann and Stump when translating the treatise on the “Properties of Terms” subscribe to the view that Lambert was a member of the Dominican house in Auxerre (in Lambert 1988: 102)[^lambert-1988]. Ashworth in her early work calls him “of Auxerre” (Ashworth 1991)[^ashworth-1991], but later thinks he’s of Lagny (Ashworth 2002, 2007)[^ashworth-2002]. Cesalli calls him “of Lagny” (2013), as does Murè (2013), and Fitzgerald refers to “the thirteenth century *Summulist* … Lambert of Lagny” (2016: 368). In the “of Auxerre” camp we have Lagerlund (2000: fn. 15), Mendelsohn (2017), and Read (2017), and splitting the difference is Crimi, who refers to him as “Lambert of Lagny (formerly identified as Lambert of Auxerre)” (2014: fn. 57), but his source for this was Uckelman (2013), who was simply relying, uncritically, on de Libera (1981). Many scholars simply avoid the question: Ebbesen calls him “Lambert of Lagny, Ligny or Auxerre” (Ebbesen 2013: 65)[^ebbesen-2013], while Dutilh Novaes calls him “Lambert of Auxerre/Lagny” (Dutilh Novaes 2008: fn. 12, pp. 237, 246)[^dutilh-2008] and Kann conflates the two: “Lambert of Lagny – otherwise known as Lambert d’Auxerre” (Kann 2016: 223)[^kann-2016]. In the introduction to his translation, Maloney notes that while he had earlier concluded that “there is insufficient reliable historical data to identify the author of the *Summa Lamberti* as a Dominican of Auxerre in the 1240s” (Maloney 2009: 106)[^maloney-2009] leading him to favor the Lagny Lambert, “I now think it considerably more probable that the author of the *Summa Lamberti* was Lambert of Ligny-le-Châtel than Lambert of Lagny” (2015: xxxix), that is, Lambert of Auxerre.
    step1: |-
      追踪这两种传记各自的证据、归属日期的差异，并把这些证据与我们关于《大全》作者的所知或推测加以匹配，是极其复杂的——这不是这里能解决的问题；迄今为止证据与论证最全面的概述见 Maloney（2015: xvi–xl）。尽管如此，我们仍面临如何称呼作者的问题；而这一问题因近几十年二手文献对他的处理而变得复杂。较早的归属倾向于称他“欧塞尔的”（循 Alessio），较晚的称“拉尼的”（循 de Libera）；但过去十年指针在一定程度上又摆回了“欧塞尔的”。Kretzmann 与 Stump 翻译“词项的特性”专论时，认为兰伯特是欧塞尔多明我会舍的成员（Lambert 1988: 102）[^lambert-1988]。Ashworth 早期著作称他“欧塞尔的”（Ashworth 1991）[^ashworth-1991]，后来认为他是拉尼的（Ashworth 2002, 2007）[^ashworth-2002]。Cesalli 称他“拉尼的”（2013），Murè（2013）亦然；Fitzgerald 则称“十三世纪的《小逻辑》作者……拉尼的兰伯特”（2016: 368）。“欧塞尔派”有 Lagerlund（2000: fn. 15）、Mendelsohn（2017）与 Read（2017）；折中者是 Crimi，他称“拉尼的兰伯特（旧时鉴定为欧塞尔的兰伯特）”（2014: fn. 57），但其来源是 Uckelman（2013）——后者只是不加批判地依赖 de Libera（1981）。许多学者干脆回避这个问题：Ebbesen 称他“拉尼、利尼或欧塞尔的兰伯特”（Ebbesen 2013: 65）[^ebbesen-2013]；Dutilh Novaes 称他“欧塞尔/拉尼的兰伯特”（Dutilh Novaes 2008: fn. 12, pp. 237, 246）[^dutilh-2008]；Kann 则混用二者：“拉尼的兰伯特——又名欧塞尔的兰伯特”（Kann 2016: 223）[^kann-2016]。Maloney 在其译本导言中指出，虽然他此前结论是“没有足够的可靠历史数据把《兰伯特大全》的作者鉴定为 1240 年代欧塞尔的一名多明我会士”（Maloney 2009: 106）[^maloney-2009]——因此倾向拉尼的兰伯特——“我现在认为《兰伯特大全》的作者是利尼勒沙泰勒的兰伯特而非拉尼的兰伯特的可能性大得多”（2015: xxxix），即欧塞尔的兰伯特。
