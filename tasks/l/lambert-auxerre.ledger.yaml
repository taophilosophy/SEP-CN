      The content of the *Summa* as expressed by these chapter topics exemplifies the core aspects of the new developments in logic in the middle of thirteenth century, what is known as “terminist logic” because of its emphasis on terms and their properties, and how these two things combine into propositions and thence into syllogisms, or arguments more generally. The text is comparable to the other summary treatises written by Lambert’s rough contemporaries, William of Sherwood, Roger Bacon, and Peter of Spain (Maloney 2015: xliii)[^maloney-2015]: Together, these four authors and their textbooks represent the first relatively complete articulations of the terminist developments of the so-called *logica modernorum* (that is the “logic of the moderns”, to be contrasted with the older logic based in Aristotle, the *logica vetus* (Kann 2016: 220)[^kann-2016]. Each of these four treatises provides a slightly different viewpoint on what was, at the time, still a developing theoretical discipline. Peter of Spain’s book went on to become one of the most reprinted textbooks before modern times, and Bacon’s work had significant influence on later philosophers, not just logicians. Sherwood’s text seems to have been one of Lambert’s sources (Kretzmann 1966: 4)[^kretzmann-1966]. While Sherwood’s treatise is often the preferable of the four because of its clarity and concision, Lambert’s lengthier treatise is a result of the fact that he “seems to be at pains to give a slightly fuller explanation than the others” (Maloney 2015: xliii)[^maloney-2015] without necessarily falling into the level of pedantry that Peter’s treatise sometimes embraces.
    step1: |-
      《大全》以这些章节主题所表达的内容，例示了十三世纪中叶逻辑新发展的核心面向——即所谓的“词项派逻辑”，因为它强调词项及其特性，以及这两者如何结合成命题、进而构成三段论或更一般的论证。该文本与兰伯特大体同时代者所写的其他概要专著相当：舍伍德的威廉、罗吉尔·培根与西班牙的彼得（Maloney 2015: xliii）[^maloney-2015]。这四位作者及其教科书一道，代表了所谓 *logica modernorum*（“今人逻辑”，相对于基于亚里士多德的较旧逻辑 *logica vetus*）之词项派发展的首次相对完整的表述（Kann 2016: 220）[^kann-2016]。这四部专著各自提供了一个略有不同的视角，看一个当时仍在发展中的理论学科。西班牙的彼得的书后来成为近代以前再版最多的教科书之一；培根的著作对后来的哲学家——不仅是逻辑学家——都有显著影响。舍伍德的文本似乎是兰伯特的来源之一（Kretzmann 1966: 4）[^kretzmann-1966]。舍伍德的专著因其清晰简洁而常为四者中之优选；兰伯特较长的专著则源于他“似乎费心给出比其他人稍为完整的解释”（Maloney 2015: xliii）[^maloney-2015]——同时未必陷入彼得的专著有时拥抱的学究气。
