      This makes natural supposition at odds with other types of supposition, which words cannot have in isolation, but only in combination with other words. Braakhuis explains this via Lambert’s distinction between the first and fourth ways in which “supposition” can be used; because Lambert can distinguish between supposition as a kind of signification and supposition as a property of a term, he is able to identify a property which corresponds to the signification of the term, and this property is natural supposition (Braakhuis 1977: 136; cf. also Brumberg-Chaumont 2013: fn. 72)[^braakhuis-1977][^brumberg-chaumont-2013]. A similar approach to natural supposition is taken by Peter of Spain (de Rijk 1971: 97)[^rijk-1971] John Page, and Cesalli argues that their views underpin some of the rules concerning appellation that later medieval authors, such as Richard Brinkley, offer (Cesalli 2013: 285)[^cesalli-2013].
