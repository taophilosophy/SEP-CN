      1. Lambert of Auxerre: Born in Ligny-le-Châtel, and educated in Paris, this Lambert was a master of arts and a canon at the cathedral school in Auxerre. When a Dominican chapter was founded in Auxerre in 1241, Lambert joined. He taught Dominicans novices during the period 1247 to 1256, in addition to teaching the soon-to-be king of Navarre, and drafted the *Summa* then, for those novices. Afterwards, he revised and edited the book in Paris, and it entered circulation amongst wider Dominican teaching. He was buried in the Dominican convent of St. James in Paris (Maloney 2015: xvi)[^maloney-2015].
      2. Lambert of Lagny: Born in Lagny, and a secular clerk in Meaux, this Lambert taught Theobald II between 1250 and 1255 in Pamplona, and composed the *Summa* then. He then edited the text and circulated between 1263 and 1265, when he was in Paris administering Theobald’s holdings. It was only after this that he became a Dominican (Maloney 2015: xx–xxi)[^maloney-2015].
    step1: |-
      1. 欧塞尔的兰伯特：生于利尼勒沙泰勒，在巴黎受教育，这位兰伯特是一名文科硕士、欧塞尔座堂学校的议事司铎。1241 年当多明我会在欧塞尔设立分会时，兰伯特加入。1247 至 1256 年间他教导多明我会新入门者，同时教导未来的纳瓦拉国王，并为此起草了《大全》。此后他在巴黎修订并编辑此书，使其在更广的多明我会教学中流通。他安葬于巴黎圣雅各多明我修道院（Maloney 2015: xvi）[^maloney-2015]。
      2. 拉尼的兰伯特：生于拉尼，莫城的世俗教士，这位兰伯特于 1250 至 1255 年在潘普洛纳教导特奥巴尔德二世，并在那时写成《大全》。他后来编辑此书，1263 至 1265 年间在巴黎管理特奥巴尔德的产业时使其流通。直到此后他才成为多明我会士（Maloney 2015: xx–xxi）[^maloney-2015]。
