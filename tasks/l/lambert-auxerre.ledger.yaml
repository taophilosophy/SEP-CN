  - id: 4
    kind: body
    source: |-
      The *Summa* survives in at least 15 manuscripts (Maloney 2015: xv)[^maloney-2015], one of which, (Padua, *Biblioteca Universitaria* Cod. 647, dating to the 14th century) contains a colophon informing the reader that the text was written by one *Lambert*, who produced it while he was the teacher of the king of Navarra, and edited it while working in Paris (de Rijk 1969: 160–161)[^rijk-1969]. From this, de Rijk concludes that the likely student-king was Theobald II, who was born in 1240, succeeded his father in 1253, and crowned in 1257, and derives a date of composition of the *Summa* of between 1253 and 1257. The work was most likely composed originally in either Troyes or Pamplona, and then published in Paris after being edited, most likely around 1260 (de Rijk 1969: 161)[^rijk-1969]. Alessio argues, from the same evidence, for a composition date between 1247 and 1256, on the assumption Lambert began teaching Theobald before the death of his father (Maloney 2015: xix)[^maloney-2015]. On such a dating, the *Summa* is either contemporaneous to or slightly earlier than Peter of Spain’s *Summary of Logic* and William of Sherwood’s *Introduction to Logic* (Alessio 1971: xxxi)[^alessio-1971]. De Libera agrees with both the “king of Navarra” referenced in the colophon was Theobald II, and argues for a composition date between 1250 and 1255, in Pamplona (de Libera 1981; Maloney 2015: xx)[^libera-1981][^maloney-2015]. Brumberg-Chaumont gives c.1250 as the composition date (2013: fn.10), while Lagerlund says that the date has been established as “1250–1260”, placing it contemporary with or shortly after Roger Bacon’s *Summulae,* which is dated to 1250–55 (Lagerlund 2000: 21)[^lagerlund-2000]. While a more precise date than these ranges is unlikely to be given, the evidence is sufficient to reject the dating of earlier historians who placed the text c.1240, such a dating is now currently deprecated (Ashworth 2002: 313)[^ashworth-2002].
    step1: |-
      《大全》幸存于至少 15 份手稿中（Maloney 2015: xv）[^maloney-2015]。其中一份（帕多瓦大学图书馆 Cod. 647，十四世纪）含有一则结尾题记，告知读者该文本由一位*兰伯特*所写——他在担任纳瓦拉国王的教师时写成此书，在巴黎工作时加以编辑（de Rijk 1969: 160–161）[^rijk-1969]。据此，de Rijk 推断可能的学生国王是特奥巴尔德二世——生于 1240 年，1253 年继其父位，1257 年加冕——并推导出《大全》的写作日期在 1253 至 1257 年之间。该著作最可能最初写于特鲁瓦或潘普洛纳，编辑后约在 1260 年前后刊于巴黎（de Rijk 1969: 161）[^rijk-1969]。Alessio 依据同样的证据，主张写作日期在 1247 至 1256 年之间，其假定是兰伯特在其父去世前即开始教导特奥巴尔德（Maloney 2015: xix）[^maloney-2015]。照这种断代，《大全》与西班牙的彼得《逻辑概要》及舍伍德的威廉《逻辑导论》同时代或稍早（Alessio 1971: xxxi）[^alessio-1971]。de Libera 同意题记中所指的“纳瓦拉国王”即特奥巴尔德二世，并主张写作日期在 1250 至 1255 年之间，地点为潘普洛纳（de Libera 1981; Maloney 2015: xx）[^libera-1981][^maloney-2015]。Brumberg-Chaumont 给出约 1250 年为写作日期（2013: fn.10）；Lagerlund 说日期已确立为“1250–1260”，将其定在与罗吉尔·培根《小逻辑》同时代或稍后——后者断代为 1250–55（Lagerlund 2000: 21）[^lagerlund-2000]。虽然不太可能给出比这些范围更精确的日期，但证据足以否定较早的历史学家把该文本定在约 1240 年的做法——这种断代如今已不被采用（Ashworth 2002: 313）[^ashworth-2002]。
