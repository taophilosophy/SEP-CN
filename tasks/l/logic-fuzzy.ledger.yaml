  - id: 26
    kind: body
    source: |-
      Finally, taking into account that fuzzy logics, unlike classical logic, are typically not functionally complete, one can increase their expressive power by adding new connectives. The most commonly considered connectives are: truth-constants $\bar r$ for each rational number $r\in (0,1)$; unary connectives $\sim$ and $\triangle$ interpreted as ${\sim}x = 1-x$ and $\triangle x = 1$ if $x=1$ and $0$ otherwise; a binary connective $\odot$ interpreted as the usual algebraic product, etc. (Baaz 1996; Esteva, Gispert, Godo, & Noguera 2007; Esteva, Godo, & Montagna 2001; Esteva, Godo, Hájek, & Navara 2000)[^baaz-1996][^montagna-2001].
    step1: |-
      最后，考虑到模糊逻辑与经典逻辑不同，通常不是函项完全的，人们可以通过添加新联结词来增强其表达力。最常考虑的联结词有：对每个有理数 $r\in (0,1)$ 的真常项 $\bar r$；一元联结词 $\sim$ 与 $\triangle$，分别解释为 ${\sim}x = 1-x$ 以及当 $x=1$ 时 $\triangle x = 1$、否则为 $0$；二元联结词 $\odot$，解释为通常的代数乘积，等等（Baaz 1996; Esteva, Gispert, Godo, & Noguera 2007; Esteva, Godo, & Montagna 2001; Esteva, Godo, Hájek, & Navara 2000）[^baaz-1996][^montagna-2001]。
    step2: |-
      最后，模糊逻辑和经典逻辑不同，通常不是函项完全的，所以可以加新联结词来增强表达力。最常加的有：对每个有理数 $r\in (0,1)$ 的真常项 $\bar r$；一元联结词 $\sim$ 与 $\triangle$，前者解释为 ${\sim}x = 1-x$，后者在 $x=1$ 时取 $\triangle x = 1$、否则取 $0$；二元联结词 $\odot$，解释为通常的代数乘积；等等（Baaz 1996; Esteva, Gispert, Godo, & Noguera 2007; Esteva, Godo, & Montagna 2001; Esteva, Godo, Hájek, & Navara 2000）[^baaz-1996][^montagna-2001]。
