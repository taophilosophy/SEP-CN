      Jeff Paris (2000) provided an overview over other semantics supporting various choices of truth functions; in particular, re-randomizing semantics (Hisdal 1988)[^hisdal-1988], similarity semantics (e.g., Ruspini 1991)[^ruspini-1991], acceptability semantics (Paris 1997)[^paris-1997], and approximation semantics (Paris 2000)[^paris-2000]. Let us also mention the resource-based semantics proposed in Běhounek 2009. Moreover there are different forms of evaluation games for various fuzzy logics besides the one of Giles for Łukasiewicz logic, outlined above. An overview over those semantic games was given in Fermüller 2015.
    step1: |-
      Jeff Paris（2000）综述了支持各种真值函项选择的其他语义；特别是重随机化语义（Hisdal 1988）[^hisdal-1988]、相似性语义（如 Ruspini 1991）[^ruspini-1991]、可接受性语义（Paris 1997）[^paris-1997] 与近似语义（Paris 2000）[^paris-2000]。还应提到 Běhounek 2009 提出的基于资源的语义。此外，除了上文概述的 Giles 为 Łukasiewicz 逻辑给出的博弈，各种模糊逻辑还有不同形式的评估博弈。Fermüller 2015 对这些语义博弈作了综述。
