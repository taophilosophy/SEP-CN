      ## 5 其他值得注意的模糊逻辑
  - id: 23
    kind: body
    source: |-
      Besides MTL (the logic of all left-continuous t-norms) and Łukasiewicz and Gödel–Dummett logics (each induced by a particular t-norm), one can consider logics *induced* by sets of t-norms or, in general, arbitrary axiomatic extensions of MTL. In particular, the logic of all *continuous* t-norms (Hájek’s basic fuzzy logic BL) is obtained by adding the axiom $$\varphi\mathbin{\&}(\varphi\to{{\psi}}) \to \psi\mathbin{\&}(\psi\to\varphi)$$ to those of MTL. Actually, for any set of continuous t-norms there is a finite axiomatization of the corresponding logic (Esteva, Godo, & Montagna 2003; Haniková 2014)[^haniková-2014]; in most cases the axiomatization captures semantic consequence from *finite* sets of premises. In particular, the logic of the third prominent continuous t-norm (algebraic product), known as Product logic, is the extension of BL by the axiom $$\neg\varphi \vee ((\varphi\to\varphi\mathbin{\&}{{\psi}})\to{{\psi}}).$$ On the other hand, not all axiomatic extensions of MTL can be given a t-norm based semantics. For example, classical logic can be axiomatized as MTL $+$ $\varphi\vee\neg \varphi$, but the axiom of excluded middle is not a tautology under any t-norm based interpretation.
    step1: |-
      除了 MTL（所有左连续 t-范数的逻辑）以及 Łukasiewicz 与 Gödel–Dummett 逻辑（各由某个特定 t-范数诱导）之外，还可以考虑由 t-范数集合 *诱导* 的逻辑，或更一般地，MTL 的任意公理化扩张。特别地，所有 *连续* t-范数的逻辑（Hájek 的基本模糊逻辑 BL）是在 MTL 公理上加入 $$\varphi\mathbin{\&}(\varphi\to{{\psi}}) \to \psi\mathbin{\&}(\psi\to\varphi)$$ 得到的。事实上，对任何连续 t-范数集合，相应的逻辑都有有穷公理化（Esteva, Godo, & Montagna 2003; Haniková 2014）[^haniková-2014]；多数情形下，该公理化刻画的是从 *有限* 前提集出发的语义后承。特别地，第三个著名连续 t-范数（代数乘积）的逻辑，称为乘积逻辑，是 BL 加公理 $$\neg\varphi \vee ((\varphi\to\varphi\mathbin{\&}{{\psi}})\to{{\psi}})$$ 的扩张。另一方面，并非 MTL 的所有公理化扩张都能给出基于 t-范数的语义。例如，经典逻辑可公理化为 MTL $+$ $\varphi\vee\neg \varphi$，但排中律在任何基于 t-范数的解释下都不是重言式。
    step2: |-
      除了 MTL（所有左连续 t-范数的逻辑）以及 Łukasiewicz、Gödel–Dummett 逻辑（各由某个特定 t-范数诱导），还可以考虑由一组 t-范数 *诱导* 的逻辑，或更一般地，MTL 的任意公理化扩张。特别地，所有 *连续* t-范数的逻辑，即 Hájek 的基本模糊逻辑 BL，就是 MTL 加公理 $$\varphi\mathbin{\&}(\varphi\to{{\psi}}) \to \psi\mathbin{\&}(\psi\to\varphi)$$ 得到的。事实上，任何一组连续 t-范数，其对应逻辑都有有穷公理化（Esteva, Godo, & Montagna 2003; Haniková 2014）[^haniková-2014]；多数情况下，公理化刻画的是从 *有限* 前提集出发的语义后承。第三个著名连续 t-范数（代数乘积）的逻辑叫乘积逻辑，是 BL 加公理 $$\neg\varphi \vee ((\varphi\to\varphi\mathbin{\&}{{\psi}})\to{{\psi}})$$ 的扩张。反过来，并非 MTL 的每个公理化扩张都能有基于 t-范数的语义：比如经典逻辑可公理化为 MTL $+$ $\varphi\vee\neg \varphi$，但排中律在任何基于 t-范数的解释下都不是重言式。
  - id: 24
    kind: body
    source: |-
      There are also reasons to consider weaker fuzzy logics. For example, it can be argued that the assumptions forcing the interpretation of the conjunction & to be a t-norm are too strong. In particular, the assumption that $1$ is its neutral element enforces a definition of tautology as a formula always evaluated to $1$ and the consequence relation as preservation of the value $1$ – that is, $1$ is the only *designated value* in the semantics.[^note-3] A natural way to introduce logics with more than one designated truth-degree is to assume that the neutral element for the interpretation of & is a number $t <1$. It can be shown that in this situation the designated truth-degrees are exactly those greater than or equal to $t$. Such interpretations of conjunctions are called *uninorms*. The logic of left-continuous uninorms was axiomatized in Metcalfe & Montagna (2007).
    step1: |-
      也有理由考虑更弱的模糊逻辑。例如，可以论证，迫使合取 & 的解释成为 t-范数的那些假设太强。特别是，假设 $1$ 是它的单位元，就强制把重言式定义为始终取值 $1$ 的公式，并把后承关系定义为值 $1$ 的保持——也就是说，$1$ 是语义中唯一的 *指定值*。[^note-3] 引入具有多个指定真值度的逻辑的一种自然方式，是假设 & 的解释的单位元是一个数 $t <1$。可以证明，在这种情况下，指定真值度恰好是那些大于或等于 $t$ 的值。这种合取解释称为 *uninorm*。左连续 uninorm 的逻辑由 Metcalfe & Montagna（2007）公理化。
    step2: |-
      也有理由考虑更弱的模糊逻辑。比如可以说，逼着合取 & 的解释成为 t-范数的那些假设太强了。尤其是“$1$ 是单位元”这条，就逼着重言式只能是始终取值 $1$ 的公式、后承关系只能是值 $1$ 的保持，也就是把 $1$ 当成语义里唯一的 *指定值*。[^note-3] 要引入有多个指定真值度的逻辑，一个自然的办法是假设 & 的解释以某个数 $t <1$ 为单位元。可以证明，这时指定真值度正好是大于或等于 $t$ 的那些值。这种合取解释叫 *uninorm*。左连续 uninorm 的逻辑由 Metcalfe & Montagna（2007）公理化。
