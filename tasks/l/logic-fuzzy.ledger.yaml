  - id: 1
    kind: body
    source: |-
      Fuzzy logic is intended to model logical reasoning with vague or imprecise statements like “Petr is young (rich, tall, hungry, etc.)”. It refers to a family of many-valued logics, where the truth-values are interpreted as degrees of truth. The truth-value of a logically compound proposition, like “Carles is tall and Chris is rich”, is determined by the truth-value of its components. In other words, like in classical logic, one imposes truth-functionality.
    step1: |-
      模糊逻辑旨在为含有“Petr 年轻（富有、高、饿等等）”这类模糊或不精确陈述的逻辑推理建模。它指一族多值逻辑，其中真值被解释为真值度。一个逻辑复合命题（如“Carles 高且 Chris 富有”）的真值，由其组成部分的真值决定。换句话说，和经典逻辑一样，人们要求真值函项性。
    step2: |-
      模糊逻辑想刻画的是含“Petr 年轻（有钱、个子高、肚子饿等）”这类模糊、不精确语句的逻辑推理。它指一族多值逻辑，真值被解释为真值度。复合命题（如“Carles 个子高，Chris 有钱”）的真值由各组成部分的真值决定。也就是说，和经典逻辑一样，这里也要求真值函项性。
  - id: 2
    kind: body
    source: |-
      Fuzzy logic emerged in the context of the theory of fuzzy sets, introduced by Lotfi Zadeh (1965). A fuzzy set assigns a degree of membership, typically a real number from the interval $[0,1]$, to elements of a universe. Fuzzy logic arises by assigning degrees of truth to propositions. The standard set of truth-values (degrees) is the real unit interval $[0,1]$, where $0$ represents “totally false”, $1$ represents “totally true”, and the other values refer to partial truth, i.e., intermediate degrees of truth.[^note-1]
    step1: |-
      模糊逻辑是在模糊集合论的背景下出现的，该理论由 Lotfi Zadeh（1965）提出。模糊集合给论域的每个元素指定一个隶属度，通常是区间 $[0,1]$ 中的实数。模糊逻辑则通过给命题指定真值度而产生。标准真值（度）集合是实数单位区间 $[0,1]$，其中 $0$ 表示“完全不真”，$1$ 表示“完全真”，其他值指部分真，即中间的真值度。[^note-1]
    step2: |-
      模糊逻辑诞生于 Lotfi Zadeh（1965）提出的模糊集合论。模糊集合给论域中每个元素指定一个隶属度，通常是区间 $[0,1]$ 里的实数；模糊逻辑则给命题指定真值度。标准的真值（度）集合就是实数单位区间 $[0,1]$：$0$ 表示“完全不真”，$1$ 表示“完全真”，其余值表示部分真，也就是介于两者之间的真值度。[^note-1]
  - id: 3
    kind: body
    source: |-
      “Fuzzy logic” is often understood in a very wide sense which includes all kinds of formalisms and techniques referring to the systematic handling of *degrees* of some kind (see, e.g., Nguyen & Walker 2000). In particular in engineering contexts (fuzzy control, fuzzy classification, soft computing) it is aimed at efficient computational methods tolerant to suboptimality and imprecision (see, e.g., Ross 2010). This entry focuses on fuzzy logic in a restricted sense, established as a discipline of mathematical logic following the seminal monograph by Petr Hájek (1998) and nowadays usually referred to as “mathematical fuzzy logic”. For details about the history of different variants of fuzzy logic we refer to Bělohlávek, Dauben, & Klir 2017.
    step1: |-
      “模糊逻辑”常在很宽泛的意义上使用，包括各种处理某类 *度* 的系统化形式化方法与技术（例如见 Nguyen & Walker 2000）。尤其在工程语境中（模糊控制、模糊分类、软计算），它追求的是能容忍次优与不精确的高效计算方法（例如见 Ross 2010）。本词条聚焦于狭义模糊逻辑，即继 Petr Hájek（1998）的开创性专著之后确立为数学逻辑一个学科、如今通常称为“数学模糊逻辑”的那部分。关于模糊逻辑各种变体历史的细节，参见 Bělohlávek, Dauben, & Klir 2017。
    step2: |-
      “模糊逻辑”常被用在很宽的意义上，泛指各种系统处理某类 *度* 的形式化方法与技术（例如 Nguyen & Walker 2000）。在工程语境中（模糊控制、模糊分类、软计算），它追求的是能容忍次优和不精确的高效计算方法（例如 Ross 2010）。本词条讲的模糊逻辑取狭义，即自 Petr Hájek（1998）那部开创性专著之后确立为数学逻辑分支、如今通称“数学模糊逻辑”的部分。各变体的历史细节，见 Bělohlávek, Dauben, & Klir 2017。
  - id: 4
    kind: body
    source: |-
      Mathematical fuzzy logic focuses on logics based on a truth-functional account of partial truth and studies them in the spirit of classical mathematical logic, investigating syntax, model-theoretic semantics, proof systems, completeness, etc., both, at the propositional and the predicate level (see Cintula, Fermüller, Hájek, & Noguera 2011 and 2015).
    step1: |-
      数学模糊逻辑聚焦于以部分真的真值函项说明为基础的逻辑，并按经典数学逻辑的精神研究它们，考察句法与谓词两个层面的语法、模型论语义、证明系统、完全性等（见 Cintula, Fermüller, Hájek, & Noguera 2011 与 2015）。
    step2: |-
      数学模糊逻辑关注以“部分真”的真值函项说明为基础的逻辑，并按经典数学逻辑的路子来研究：句法、模型论语义、证明系统、完全性等，命题层面和谓词层面都要管（见 Cintula, Fermüller, Hájek, & Noguera 2011、2015）。
