      It has been a considerable challenge to come up with analytic proof systems for fuzzy logics. These are systems that share important features, like the eliminability of cuts and the subformula property, with Gentzen’s sequent calculi for classical and intuitionistic logic (see entry on the development of proof theory). A major breakthrough has been achieved with the introduction of a hypersequent calculus for Gödel–Dummett logic by Arnon Avron (1991). Hypersequent calculi arise from sequent calculi by defining inference rules that refer to finite multisets of sequents, rather than to single sequents. Hypersequents are interpreted, at the meta-level, as disjunctions of sequents. This interpretation implies that it is sound to add additional sequents (external weakening) or to replace multiple copies of the same sequent within a given hypersequent by a single copy of that sequent (external contraction). In the case of Gödel–Dummett logic, the rules for introducing logical connectives arise from the rules of Gentzen’s intuitionistic sequent calculus by simply adding side-hypersequents the upper and lower sequents of the original rule. For example, the sequent rule for introducing conjunction on the right-hand side $$\frac{\Gamma_1 \Rightarrow \phi \hspace{3ex} \Gamma_2 \Rightarrow \psi}{\Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi}$$ where $\Gamma_1$ and $\Gamma_2$ are finite sequences of formulas, is turned into the following hypersequent rule: $$\frac{H \mid \Gamma_1 \Rightarrow \phi \hspace{3ex} H' \mid \Gamma_2 \Rightarrow \psi}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi }$$ where $H$ and $H'$ denote the side-hypersequents, i.e., finite multisets of sequents added disjunctively to the exhibited sequents. This by itself does not change the corresponding logic (intuitionistic logic, in this case). The crucial additional structural rule is the so-called communication rule: $$\frac{H \mid \Gamma_1,\Pi_1 \Rightarrow \Delta_1 \hspace{3ex} H' \mid \Gamma_2,\Pi_2 \Rightarrow \Delta_2}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \Delta_1 \mid \Pi_2,\Pi_2 \Rightarrow \Delta_2}$$ Here $\Gamma_1, \Gamma_2,\Pi_1, \Pi_2$ are finite sequences of formulas; $\Delta_1$ and $\Delta_2$ are either single formulas or remain empty; $H$ and $H'$ denote the side-hypersequents, like above. To understand the impact of the communication rule, we present a derivation of the crucial axiom $(\varphi \to \psi) \lor (\psi \to \varphi)$, which features an application of this rule immediately below the intial (hyper)sequents: $$ \frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\varphi \Rightarrow \varphi \hspace{5ex} \psi \Rightarrow \psi}{\varphi \Rightarrow \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi)}}{\Rightarrow (\varphi \to \psi) \lor (\psi \to \varphi)} $$
    step1: |-
      为模糊逻辑建立分析型证明系统一直是个不小的挑战。这类系统与 Gentzen 为经典逻辑和直觉主义逻辑建立的矢列演算共享一些重要特征，如切消性、子公式性质（见关于证明论发展的词条）。Arnon Avron（1991）为 Gödel–Dummett 逻辑引入超矢列演算，是一个重大突破。超矢列演算由矢列演算而来，其推理规则指涉矢列的有限多重集，而非单个矢列。在元层面，超矢列被解释为矢列的析取。这种解释意味着，添加额外矢列（外弱化），或在给定超矢列内把同一矢列的多份拷贝替换为单份（外收缩），都是可靠的。对 Gödel–Dummett 逻辑而言，引入逻辑联结词的规则由 Gentzen 直觉主义矢列演算的规则而来，只需在原规则的上下矢列旁加上侧超矢列。例如，右侧引入合取的矢列规则 $$\frac{\Gamma_1 \Rightarrow \phi \hspace{3ex} \Gamma_2 \Rightarrow \psi}{\Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi}$$ 其中 $\Gamma_1$ 与 $\Gamma_2$ 是有限公式序列，变成如下超矢列规则：$$\frac{H \mid \Gamma_1 \Rightarrow \phi \hspace{3ex} H' \mid \Gamma_2 \Rightarrow \psi}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi }$$ 其中 $H$ 与 $H'$ 表示侧超矢列，即以析取方式加到所示矢列上的有限矢列多重集。这一步本身并不改变相应逻辑（在此即直觉主义逻辑）。关键的额外结构规则是所谓的通信规则：$$\frac{H \mid \Gamma_1,\Pi_1 \Rightarrow \Delta_1 \hspace{3ex} H' \mid \Gamma_2,\Pi_2 \Rightarrow \Delta_2}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \Delta_1 \mid \Pi_2,\Pi_2 \Rightarrow \Delta_2}$$ 这里 $\Gamma_1, \Gamma_2,\Pi_1, \Pi_2$ 是有限公式序列；$\Delta_1$ 与 $\Delta_2$ 或是单个公式，或为空；$H$ 与 $H'$ 如上表示侧超矢列。为理解通信规则的作用，我们给出关键公理 $(\varphi \to \psi) \lor (\psi \to \varphi)$ 的推导，其中在初始（超）矢列正下方用到该规则：$$ \frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\varphi \Rightarrow \varphi \hspace{5ex} \psi \Rightarrow \psi}{\varphi \Rightarrow \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi)}}{\Rightarrow (\varphi \to \psi) \lor (\psi \to \varphi)} $$
    step2: |-
      给模糊逻辑找分析型证明系统，一直是个不小的挑战。这类系统有些重要特征与 Gentzen 为经典逻辑、直觉主义逻辑建立的矢列演算相同，比如切消性和子公式性质（见“证明论的发展”词条）。Arnon Avron（1991）为 Gödel–Dummett 逻辑引入超矢列演算，是个重大突破。超矢列演算从矢列演算变来：推理规则指涉的是矢列的有限多重集，而不是单个矢列。在元层面，超矢列读作矢列的析取。这样一来，添加额外矢列（外弱化），或在同一个超矢列里把某矢列的多份拷贝换成一份（外收缩），都是可靠的。就 Gödel–Dummett 逻辑说，引入逻辑联结词的规则只需在 Gentzen 直觉主义矢列演算的规则上，给上下矢列各加侧超矢列。例如，右侧引入合取的矢列规则 $$\frac{\Gamma_1 \Rightarrow \phi \hspace{3ex} \Gamma_2 \Rightarrow \psi}{\Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi}$$ 其中 $\Gamma_1$ 与 $\Gamma_2$ 是有限公式序列，变成这样的超矢列规则：$$\frac{H \mid \Gamma_1 \Rightarrow \phi \hspace{3ex} H' \mid \Gamma_2 \Rightarrow \psi}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \phi \wedge \psi }$$ 其中 $H$、$H'$ 是侧超矢列，即以析取方式附加到所示矢列上的有限矢列多重集。光这一步并不改变相应逻辑（这里是直觉主义逻辑）。真正新增的关键结构规则，是所谓通信规则：$$\frac{H \mid \Gamma_1,\Pi_1 \Rightarrow \Delta_1 \hspace{3ex} H' \mid \Gamma_2,\Pi_2 \Rightarrow \Delta_2}{H \mid H' \mid \Gamma_1,\Gamma_2 \Rightarrow \Delta_1 \mid \Pi_2,\Pi_2 \Rightarrow \Delta_2}$$ 这里 $\Gamma_1, \Gamma_2,\Pi_1, \Pi_2$ 是有限公式序列；$\Delta_1$、$\Delta_2$ 或是单个公式，或为空；$H$、$H'$ 仍是侧超矢列。为看清通信规则的作用，下面给出关键公理 $(\varphi \to \psi) \lor (\psi \to \varphi)$ 的推导，通信规则就用在初始（超）矢列的正下方：$$ \frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\displaystyle\frac{\varphi \Rightarrow \varphi \hspace{5ex} \psi \Rightarrow \psi}{\varphi \Rightarrow \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid \psi \Rightarrow \varphi}}{\Rightarrow \varphi \to \psi \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow \psi \to \varphi}}{\Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi) \mid\, \Rightarrow (\varphi \to \psi) \vee (\psi \to \varphi)}}{\Rightarrow (\varphi \to \psi) \lor (\psi \to \varphi)} $$
