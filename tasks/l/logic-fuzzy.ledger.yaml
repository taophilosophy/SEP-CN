      对每个原子公式，都有一个相应的实验，它可能失败或成功，但可能表现出分散性，即重复时可能给出不同结果。每个实验、从而每个原子公式，都指定一个固定的失败概率，称为风险值。玩家每有一个原子断言所对应的实验失败，就要付给对方 $\$$1。对于从我的断言 $\varphi$ 开始的任何博弈，若双方都理性行事，可以证明我的期望总损失，对应于在 Łukasiewicz 逻辑的一个解释中 $\varphi$ 的真值的倒数，该解释把风险值的倒数作为真值指派给原子公式。特别地，公式在 Łukasiewicz 逻辑中有效，当且仅当对每个风险值指派，我都有一个策略能保证博弈结束时我的期望总损失为 $0$ 或负。
    step2: |-
      每个原子公式都对应一个实验：它可能成功，也可能失败，还可能有分散性，即重复做会给出不同结果。每个实验、因而每个原子公式，都定一个固定的失败概率，叫风险值。玩家每有一个原子断言对应的实验失败，就要付给对方 $\$$1。若博弈从我的断言 $\varphi$ 开始、双方都理性行事，可以证明我的期望总损失，等于在 Łukasiewicz 逻辑的某个解释下 $\varphi$ 真值的倒数；这个解释把风险值的倒数指派给原子公式。特别地，公式在 Łukasiewicz 逻辑中有效，当且仅当无论风险值怎么指派，我都有策略保证博弈结束时期望总损失不大于 $0$。
