      ## 2 MTL：一种基础模糊逻辑
  - id: 12
    kind: body
    source: |-
      The weakest logic with connectives interpreted by truth functions of the type described above is MTL (*Monoidal T-norm based Logic*, Esteva & Godo 2001)[^esteva-2001][^esteva-2001-2]. It is a logic with the primitive binary connectives $\mathbin{\&}, \to, \wedge$ and a truth-constant $\overline{0}$, and derivable connectives defined as: $$ \begin{align} \varphi \lor \psi &= ((\varphi \to \psi) \to \psi) \land ((\psi \to \varphi) \to \varphi),\\ \neg \varphi &= \varphi \to \overline{0}, \\ \varphi \leftrightarrow \psi &= (\varphi \to \psi) \land (\psi \to \varphi),\\ \overline{1} &= \neg \overline{0}. \end{align} $$ MTL is defined as a consequence relation by means of the semantics given by all left-continuous t-norms. Namely, given a particular left-continuous t-norm $\ast$ and a mapping from propositional variables to $[0,1]$, we define the $\ast$-evaluation of all formulas by interpreting $\&$ as $\ast$, the implication $\to$ as its residuum $\Rightarrow$, and $\land$ and $\overline{0}$ as $\min$ and $0$, respectively.
    step1: |-
      用上述类型真值函项解释联结词的最弱逻辑是 MTL（*幺半群 t-范数逻辑*，Esteva & Godo 2001）[^esteva-2001][^esteva-2001-2]。它是一个带有原始二元联结词 $\mathbin{\&}, \to, \wedge$ 与真常项 $\overline{0}$ 的逻辑，可导出联结词定义为：$$ \begin{align} \varphi \lor \psi &= ((\varphi \to \psi) \to \psi) \land ((\psi \to \varphi) \to \varphi),\\ \neg \varphi &= \varphi \to \overline{0}, \\ \varphi \leftrightarrow \psi &= (\varphi \to \psi) \land (\psi \to \varphi),\\ \overline{1} &= \neg \overline{0}. \end{align} $$ MTL 通过所有左连续 t-范数给出的语义定义为后承关系。即，给定特定的左连续 t-范数 $\ast$ 与从命题变元到 $[0,1]$ 的映射，我们把 $\&$ 解释为 $\ast$、蕴涵 $\to$ 解释为其剩余 $\Rightarrow$、$\land$ 与 $\overline{0}$ 分别解释为 $\min$ 与 $0$，从而定义所有公式的 $\ast$-赋值。
    step2: |-
      用上述类型真值函项解释联结词的最弱逻辑是 MTL（*幺半群 t-范数逻辑*，Esteva & Godo 2001）[^esteva-2001][^esteva-2001-2]。它的原始二元联结词是 $\mathbin{\&}, \to, \wedge$，另有真常项 $\overline{0}$；可导出联结词定义为：$$ \begin{align} \varphi \lor \psi &= ((\varphi \to \psi) \to \psi) \land ((\psi \to \varphi) \to \varphi),\\ \neg \varphi &= \varphi \to \overline{0}, \\ \varphi \leftrightarrow \psi &= (\varphi \to \psi) \land (\psi \to \varphi),\\ \overline{1} &= \neg \overline{0}. \end{align} $$ MTL 的后承关系由所有左连续 t-范数给出的语义定义：给定左连续 t-范数 $\ast$ 以及从命题变元到 $[0,1]$ 的映射，把 $\&$ 解释为 $\ast$、蕴涵 $\to$ 解释为其剩余 $\Rightarrow$、$\land$ 与 $\overline{0}$ 分别解释为 $\min$ 与 $0$，就得到所有公式的 $\ast$-赋值。
  - id: 13
    kind: body
    source: |-
      A formula $\varphi$ is a consequence of a set of formulas $\Gamma$ in MTL, denoted $\Gamma \models_\mathrm{MTL} \varphi$, if for each left-continuous t-norm $\ast$ and each $\ast$-evaluation $e$ such that $e(\psi) = 1$ for each $\psi \in \Gamma$ we have $e(\varphi) = 1$; in words, if the premises are totally true, so is the conclusion. A formula $\varphi$ that always evaluates to $1$ (i.e. $\emptyset\models_\mathrm{MTL}\varphi$) is called valid or a tautology of MTL. Note that the formula $\varphi \mathbin{\&} \psi \to \varphi \land \psi$ is a tautology in MTL but the converse implication $\varphi \land \psi \to \varphi \mathbin{\&} \psi$ is not, i.e., the conjunction $\&$ is stronger than $\land$.
    step1: |-
      公式 $\varphi$ 是公式集 $\Gamma$ 在 MTL 中的后承，记作 $\Gamma \models_\mathrm{MTL} \varphi$，如果对每个左连续 t-范数 $\ast$ 与每个 $\ast$-赋值 $e$，只要对每个 $\psi \in \Gamma$ 都有 $e(\psi) = 1$，就有 $e(\varphi) = 1$；用话说，如果前提完全真，结论也完全真。一个始终取值 $1$ 的公式 $\varphi$（即 $\emptyset\models_\mathrm{MTL}\varphi$）称为 MTL 的有效式或重言式。注意公式 $\varphi \mathbin{\&} \psi \to \varphi \land \psi$ 在 MTL 中是重言式，但反方向的蕴涵 $\varphi \land \psi \to \varphi \mathbin{\&} \psi$ 不是，也就是说，合取 $\&$ 比 $\land$ 更强。
    step2: |-
      若对每个左连续 t-范数 $\ast$ 和每个 $\ast$-赋值 $e$，只要 $e(\psi) = 1$ 对所有 $\psi \in \Gamma$ 成立，就有 $e(\varphi) = 1$，则称公式 $\varphi$ 是公式集 $\Gamma$ 在 MTL 中的后承，记作 $\Gamma \models_\mathrm{MTL} \varphi$；说白了，前提完全真，结论也完全真。始终取值 $1$ 的公式 $\varphi$（即 $\emptyset\models_\mathrm{MTL}\varphi$）叫 MTL 的有效式或重言式。要注意，$\varphi \mathbin{\&} \psi \to \varphi \land \psi$ 在 MTL 中是重言式，反方向的 $\varphi \land \psi \to \varphi \mathbin{\&} \psi$ 却不是——合取 $\&$ 比 $\land$ 强。
  - id: 14
    kind: body
    source: |-
      MTL can also be presented by a Hilbert-style proof system with the following axioms:

      $$ \begin{align} (\varphi \to \psi) & \to ((\psi \to \chi) \to (\varphi \to \chi)) \\ \varphi \mathbin{\&} \psi & \to \varphi \\ \varphi\mathbin{\&}\psi & \to\psi\mathbin{\&}\varphi \\ \varphi \land \psi & \to \varphi \\ \varphi \land \psi & \to \psi \land \varphi \\ (\chi \to \varphi) & \to ((\chi\to \psi) \to (\chi \to \varphi\wedge \psi)) \\ (\varphi\mathbin{\&}\psi \to \chi) & \to (\varphi\to(\psi \to \chi)) \\ (\varphi\to(\psi \to \chi)) & \to (\varphi\mathbin{\&}\psi \to \chi) \\ ((\varphi \to \psi) \to \chi) & \to (((\psi \to \varphi)\to \chi)\to \chi) \\ \overline{0}& \to\varphi \\ \end{align} $$
    step1: |-
      MTL 也可以用如下公理的希尔伯特式证明系统呈现：

      $$ \begin{align} (\varphi \to \psi) & \to ((\psi \to \chi) \to (\varphi \to \chi)) \\ \varphi \mathbin{\&} \psi & \to \varphi \\ \varphi\mathbin{\&}\psi & \to\psi\mathbin{\&}\varphi \\ \varphi \land \psi & \to \varphi \\ \varphi \land \psi & \to \psi \land \varphi \\ (\chi \to \varphi) & \to ((\chi\to \psi) \to (\chi \to \varphi\wedge \psi)) \\ (\varphi\mathbin{\&}\psi \to \chi) & \to (\varphi\to(\psi \to \chi)) \\ (\varphi\to(\psi \to \chi)) & \to (\varphi\mathbin{\&}\psi \to \chi) \\ ((\varphi \to \psi) \to \chi) & \to (((\psi \to \varphi)\to \chi)\to \chi) \\ \overline{0}& \to\varphi \\ \end{align} $$
    step2: |-
      MTL 也可以写成希尔伯特式证明系统，公理如下：

      $$ \begin{align} (\varphi \to \psi) & \to ((\psi \to \chi) \to (\varphi \to \chi)) \\ \varphi \mathbin{\&} \psi & \to \varphi \\ \varphi\mathbin{\&}\psi & \to\psi\mathbin{\&}\varphi \\ \varphi \land \psi & \to \varphi \\ \varphi \land \psi & \to \psi \land \varphi \\ (\chi \to \varphi) & \to ((\chi\to \psi) \to (\chi \to \varphi\wedge \psi)) \\ (\varphi\mathbin{\&}\psi \to \chi) & \to (\varphi\to(\psi \to \chi)) \\ (\varphi\to(\psi \to \chi)) & \to (\varphi\mathbin{\&}\psi \to \chi) \\ ((\varphi \to \psi) \to \chi) & \to (((\psi \to \varphi)\to \chi)\to \chi) \\ \overline{0}& \to\varphi \\ \end{align} $$
