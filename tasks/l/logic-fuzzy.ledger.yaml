      Fuzzy logic suggests an analysis of the *sorites paradox* that respects the intuition that statement (2), while arguably not totally true, is almost true.
    step1: |-
      模糊逻辑提供了一种对 *连锁悖论* 的分析，它尊重这样的直觉：陈述 (2) 虽说不上完全真，却几乎是真。
    step2: |-
      模糊逻辑对 *连锁悖论* 给出一种分析，照顾到这样一个直觉：陈述 (2) 虽然算不上完全真，但几乎是真的。
  - id: 66
    kind: body
    source: |-
      There are various ways to model this form of reasoning in t-norm-based fuzzy logics that dissolve the paradox. For example, one may declare that any instance of *modus ponens* is sound if the degree of truth of the conclusion is not lower than that of the strong conjunction of its premises.[^note-5] As indicated, one stipulates that every instance of (2) is true to degree $1-\epsilon$, for some very small number $\epsilon$. Even if we declare (1) to be perfectly true, the statement that $10^{100}-1$ is huge, too, might then be less than perfectly true without sacrificing the soundness of instantiation and *modus ponens*. If, moreover, the degree of truth of the conjunction of two not perfectly true (and not perfectly false) statements is less than that of each conjunct, we may safely declare that statement (3) is perfectly false and nevertheless insist on the soundness of each step in the indicated chain of inferences. Informally speaking, the paradox disappears by assuming that repeatedly decreasing some perfectly huge number by a small amount leads to numbers of which it is less and less true that they are huge too.
    step1: |-
      在基于 t-范数的模糊逻辑中，有各种方式为这种推理建模并消解该悖论。例如，可以规定：只要结论的真值度不低于其前提的强合取的真值度，任何 *肯定前件* 实例都是可靠的。[^note-5] 如前所示，人们规定 (2) 的每个实例都以 $1-\epsilon$ 的程度为真，其中 $\epsilon$ 是某个非常小的数。即便我们宣布 (1) 完全真，“$10^{100}-1$ 也是巨大的”这一陈述仍可能不那么完全真，而不牺牲实例化与 *肯定前件* 的可靠性。此外，若两个并非完全真（也并非完全假）的陈述之合取的真值度低于每个合取项的真值度，我们就可以放心宣布陈述 (3) 完全假，同时仍坚持上述推理链每一步都可靠。用大白话说，悖论之所以消失，是因为把某个完全巨大的数反复减去一个小量，所得的数“也是巨大的”这一点会越来越不那么真。
    step2: |-
      在基于 t-范数的模糊逻辑里，有好几种办法给这种推理建模并消解悖论。比如可以规定：只要结论的真值度不低于其前提强合取的真值度，任何 *肯定前件* 实例都算可靠。[^note-5] 如前所说，规定 (2) 的每个实例都以 $1-\epsilon$ 的程度为真，$\epsilon$ 是某个很小的数。这样，即便宣布 (1) 完全真，“$10^{100}-1$ 也是巨大的”仍可能不是完全真，而实例化和 *肯定前件* 的可靠性并不受损。再者，若两个不完全真（也不完全假）的陈述，其合取的真值度低于任一合取项，我们就可以放心宣布 (3) 完全假，同时仍坚持推理链每一步都可靠。通俗地说，悖论之所以消失，是因为把一个完全巨大的数反复减去一小点，得到的数“也是巨大的”会越来越不那么真。
