      ## 6 谓词逻辑
  - id: 29
    kind: body
    source: |-
      The propositional logic MTL can be given a first-order counterpart MTL$\forall$ in a predicate language $\mathcal{P\!L}$ (defined as in the classical case) in the following way. The semantics is given by structures in which predicate symbols are interpreted as functions mapping tuples of domain elements into truth-values. More precisely, given a left-continuous t-norm $\ast$, a $\ast$-structure ${\mathbf M}$ consists of a non-empty domain of elements $M$, a function $f_{\mathbf M}\colon M^n\to M$ for each $n$-ary function symbol $f\in \mathcal{P\!L}$, and a function $P_{\mathbf M}\colon M^n\to [0,1]$ for each $n$-ary predicate symbol $P\in \mathcal{P\!L}$. Fixing a valuation ${\mathrm v}$ of object variables in $M$, one defines values of terms ($\|f(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = f_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$) and truth-values of atomic formulas ($\|P(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = P_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$). Truth-values of a universally/existentially quantified formula are computed as infimum/supremum of truth-values of instances of the formula where the quantified variable runs over all elements of the domain $M$. Formally: $$ \begin{align} \|\forall x\, \varphi\|^{\mathbf M}_{\mathrm v} & = \inf\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]} \mid a\in M\}\\ \|\exists x\,\varphi\|^{\mathbf M}_{\mathrm v} & = \sup\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]}\mid a\in M\},\\ \end{align} $$ where ${\mathrm v}[x{:}a]$ is the valuation sending $x$ to $a$ and keeping values of other variables unchanged. The values of other formulas are computed by interpreting, as in propositional semantics, $\&$ as $\ast$, the implication $\to$ as its residuum $\Rightarrow_\ast$, and $\land$ and $\overline{0}$ as $\min$ and $0$, respectively.
    step1: |-
      命题逻辑 MTL 可以按下述方式在谓词语言 $\mathcal{P\!L}$（定义与经典情形相同）中给出一阶对应物 MTL$\forall$。语义由结构给出，其中谓词符号被解释为把论域元素的元组映射到真值的函数。更确切地说，给定左连续 t-范数 $\ast$，一个 $\ast$-结构 ${\mathbf M}$ 由一个非空元素域 $M$、对每个 $n$ 元函数符号 $f\in \mathcal{P\!L}$ 的一个函数 $f_{\mathbf M}\colon M^n\to M$，以及对每个 $n$ 元谓词符号 $P\in \mathcal{P\!L}$ 的一个函数 $P_{\mathbf M}\colon M^n\to [0,1]$ 组成。固定对象变元在 $M$ 中的一个赋值 ${\mathrm v}$，就可定义项的值（$\|f(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = f_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$）与原子公式的真值（$\|P(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = P_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$）。全称/存在量化公式的真值，按公式实例真值的下确界/上确界计算，其中量化变元遍历域 $M$ 的所有元素。形式地：$$ \begin{align} \|\forall x\, \varphi\|^{\mathbf M}_{\mathrm v} & = \inf\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]} \mid a\in M\}\\ \|\exists x\,\varphi\|^{\mathbf M}_{\mathrm v} & = \sup\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]}\mid a\in M\},\\ \end{align} $$ 其中 ${\mathrm v}[x{:}a]$ 是把 $x$ 送到 $a$、其余变元取值不变的赋值。其他公式的值按命题语义那样计算：把 $\&$ 解释为 $\ast$、蕴涵 $\to$ 解释为其剩余 $\Rightarrow_\ast$、$\land$ 与 $\overline{0}$ 分别解释为 $\min$ 与 $0$。
    step2: |-
      命题逻辑 MTL 可以在一阶谓词语言 $\mathcal{P\!L}$（定义同经典情形）中给出一阶对应物 MTL$\forall$。语义由结构给出：谓词符号解释为把论域元素元组映到真值的函数。确切地说，给定左连续 t-范数 $\ast$，一个 $\ast$-结构 ${\mathbf M}$ 包括：非空元素域 $M$；对每个 $n$ 元函数符号 $f\in \mathcal{P\!L}$ 的一个函数 $f_{\mathbf M}\colon M^n\to M$；对每个 $n$ 元谓词符号 $P\in \mathcal{P\!L}$ 的一个函数 $P_{\mathbf M}\colon M^n\to [0,1]$。固定对象变元在 $M$ 中的赋值 ${\mathrm v}$，就可以定义项的值（$\|f(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = f_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$）和原子公式的真值（$\|P(t_1,\dots,t_n)\|^{\mathbf M}_{\mathrm v} = P_{\mathbf M}(\|t_1\|^{\mathbf M}_{\mathrm v},\dots,\|t_n\|^{\mathbf M}_{\mathrm v})$）。全称或存在量化公式的真值，取公式各实例真值的下确界或上确界，量化变元遍历域 $M$ 的全部元素。形式地：$$ \begin{align} \|\forall x\, \varphi\|^{\mathbf M}_{\mathrm v} & = \inf\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]} \mid a\in M\}\\ \|\exists x\,\varphi\|^{\mathbf M}_{\mathrm v} & = \sup\{\|\varphi\|^{\mathbf M}_{{\mathrm v}[x{:}a]}\mid a\in M\},\\ \end{align} $$ 其中 ${\mathrm v}[x{:}a]$ 是把 $x$ 送到 $a$、其余变元保持不变的赋值。其他公式的值照命题语义算：$\&$ 解释为 $\ast$，蕴涵 $\to$ 解释为其剩余 $\Rightarrow_\ast$，$\land$ 与 $\overline{0}$ 分别解释为 $\min$ 与 $0$。
  - id: 30
    kind: body
    source: |-
      The first-order logic MTL$\forall$ is then defined as the consequence relation given by the preservation of total truth (value $1$) in $\ast$-structures (allowing $\ast$ to run over all left-continuous t-norms). More precisely, we say that a first-order formula $\varphi$ is a consequence of a set of formulas $\Gamma$ (in symbols: $\Gamma \models_{\mathrm{MTL}\forall} \varphi$) if, for each left-continuous t-norm $\ast$ and each $\ast$-structure ${\mathbf M}$, we have $\|\varphi\|^{\mathbf M}_{\mathrm v} = 1$ for each valuation v, whenever $\|\psi\|^{\mathbf M}_{\mathrm v} = 1$ for each valuation v and each $\psi \in \Gamma$.
    step1: |-
      一阶逻辑 MTL$\forall$ 于是定义为在 $\ast$-结构（其中 $\ast$ 遍历所有左连续 t-范数）中保持完全真（值 $1$）所给出的后承关系。更确切地说，我们说一阶公式 $\varphi$ 是公式集 $\Gamma$ 的后承（记作 $\Gamma \models_{\mathrm{MTL}\forall} \varphi$），如果对每个左连续 t-范数 $\ast$ 与每个 $\ast$-结构 ${\mathbf M}$，只要对每个赋值 v 与每个 $\psi \in \Gamma$ 都有 $\|\psi\|^{\mathbf M}_{\mathrm v} = 1$，就对每个赋值 v 都有 $\|\varphi\|^{\mathbf M}_{\mathrm v} = 1$。
    step2: |-
      一阶逻辑 MTL$\forall$ 的后承关系，定义为在 $\ast$-结构中保持完全真（值 $1$），其中 $\ast$ 遍历所有左连续 t-范数。更确切地说，称一阶公式 $\varphi$ 是公式集 $\Gamma$ 的后承（记作 $\Gamma \models_{\mathrm{MTL}\forall} \varphi$），如果对每个左连续 t-范数 $\ast$ 和每个 $\ast$-结构 ${\mathbf M}$，只要 $\|\psi\|^{\mathbf M}_{\mathrm v} = 1$ 对所有赋值 v 与所有 $\psi \in \Gamma$ 成立，就有 $\|\varphi\|^{\mathbf M}_{\mathrm v} = 1$ 对所有赋值 v 成立。
