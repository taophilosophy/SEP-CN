      ## 1. Fuzzy connectives based on t-norms
    step1: |-
      ## 1. 基于 t-范数的模糊联结词
    step2: |-
      ## 1 基于 t-范数的模糊联结词
  - id: 6
    kind: body
    source: |-
      The standard set of truth-values for fuzzy logics is the real unit interval $[0,1]$ with its natural ordering $\leq$, ranging from total falsity (represented by $0$) to total truth (represented by $1$) through a continuum of intermediate degrees of truth (see Sections 5 and 7 for alternative interpretations of truth constants and alternative sets of truth-values). A fundamental assumption of (mainstream) mathematical fuzzy logic is that connectives are to be interpreted truth-functionally over the set of degrees of truth. Such truth functions are assumed, in the standard setting, to behave classically on the extremal values $0$ and $1$. A very natural behavior of conjunction, disjunction, and negation is achieved by imposing $x \land y = \min\{x,y\}$, $x \lor y = \max\{x,y\}$, and $\neg x = 1 - x$ for each $x,y \in [0,1]$.
    step1: |-
      模糊逻辑的标准真值集合是实数单位区间 $[0,1]$，配以其自然序 $\leq$，从完全假（由 $0$ 表示）经过中间真值度的连续统到完全真（由 $1$ 表示）（关于真常项的其他解释与真值的其他集合，见第 5、7 节）。主流数学模糊逻辑的一个基本假设是：联结词要在真值度集合上按真值函项方式解释。在标准设定中，这种真值函项被假定在极端值 $0$ 与 $1$ 上表现得像经典逻辑。对每个 $x,y \in [0,1]$，令 $x \land y = \min\{x,y\}$、$x \lor y = \max\{x,y\}$、$\neg x = 1 - x$，就得到合取、析取与否定的一种非常自然的行为。
    step2: |-
      模糊逻辑的标准真值集合是实数单位区间 $[0,1]$，按自然序 $\leq$ 排列：从完全假（$0$）经过连续不断的中间真值度，到完全真（$1$）（真常项的其他解释与真值的其他集合，见第 5、7 节）。主流数学模糊逻辑有个基本假设：联结词要在真值度集合上按真值函项方式解释，而且在标准设定下，这种真值函项在端点 $0$、$1$ 上要表现得像经典逻辑。若对每个 $x,y \in [0,1]$ 规定 $x \land y = \min\{x,y\}$、$x \lor y = \max\{x,y\}$、$\neg x = 1 - x$，合取、析取与否定的行为就非常自然。
  - id: 7
    kind: body
    source: |-
      These three truth functions yield the original semantics of fuzzy logic proposed by Joseph Goguen (1975), later studied formally by, e.g., Gehrke, Walker, & Walker (1997). Many researchers still refer to it as “the fuzzy logic”. However, it has soon become apparent that this semantic framework is too poor to (1) encode/model numerous interesting aspects of reasoning and (2) to support a fully fledged theory of mathematical logic.
    step1: |-
      这三个真值函项给出了 Joseph Goguen（1975）提出的模糊逻辑原初语义，后来由 Gehrke, Walker, & Walker（1997）等人作了形式研究。许多研究者仍称它为“那个模糊逻辑”。然而，人们很快发现，这个语义框架太贫乏：(1) 无法编码/建模推理的许多有趣方面；(2) 无法支撑一套完整的数学逻辑理论。
    step2: |-
      这三个真值函项就是 Joseph Goguen（1975）最初提出的模糊逻辑语义，后来 Gehrke, Walker, & Walker（1997）等人对之作了形式研究。不少人仍把它称作“模糊逻辑”。但人们很快看出，这个语义框架太单薄：既编码不了推理的许多有趣方面，也撑不起一套完整的数学逻辑理论。
  - id: 8
    kind: body
    source: |-
      Another, non-idempotent, conjunction $\&$ is typically added to account for the intuition that applying a partially true hypothesis twice might lead to a different degree of truth than using it only once. Such a conjunction is usually interpreted by a binary operation on $[0,1]$, which is not necessarily idempotent, but still associative, commutative, non-decreasing in both arguments and has $1$ as neutral element. These operations are called *t-norms* (*triangular norms*) and their mathematical properties have been thoroughly studied (see Klement, Mesiar, & Pap 2000). Prominent examples of t-norms are the already mentioned function $\min$, the standard product $\cdot$ of real numbers, and the Łukasiewicz t-norm: $x *_{Ł} y=\max\{x+y-1,0\}$. These three t-norms are actually continuous functions and any other continuous t-norm can be described as an *ordinal sum* of these three basic ones (Ling 1965; Mostert & Shields 1957)[^ling-1965][^mostert-1957].
    step1: |-
      通常还会加入另一个非幂等的合取 $\&$，以说明这样一种直觉：把一个部分真的假设应用两次，可能得到与只应用一次不同的真值度。这种合取通常由 $[0,1]$ 上的一个二元运算解释，它不一定幂等，但仍可结合、可交换、在两个变元上都非递减，并以 $1$ 为单位元。这类运算称为 *t-范数*（*三角范数*），其数学性质已得到充分研究（见 Klement, Mesiar, & Pap 2000）。t-范数的著名例子有已提到的函数 $\min$、实数的标准乘积 $\cdot$，以及 Łukasiewicz t-范数：$x *_{Ł} y=\max\{x+y-1,0\}$。这三个 t-范数其实都是连续函数，而任何其他连续 t-范数都可描述为这三个基本 t-范数的 *序和*（Ling 1965; Mostert & Shields 1957）[^ling-1965][^mostert-1957]。
    step2: |-
      通常还会添一个非幂等合取 $\&$，因为把一个部分真的假设用两次，真值度可能和只用一次不同。这种合取通常用 $[0,1]$ 上的一个二元运算解释：它未必幂等，但可结合、可交换、对两个变元都单调不减，并以 $1$ 为单位元。这类运算叫 *t-范数*（*三角范数*），其数学性质研究得很透（见 Klement, Mesiar, & Pap 2000）。著名的 t-范数有前面提过的 $\min$、实数的标准乘法 $\cdot$，以及 Łukasiewicz t-范数 $x *_{Ł} y=\max\{x+y-1,0\}$。这三个都是连续函数；任何别的连续 t-范数，都可写成这三个基本 t-范数的 *序和*（Ling 1965; Mostert & Shields 1957）[^ling-1965][^mostert-1957]。
  - id: 9
    kind: body
    source: |-
      Interestingly, each left-continuous t-norm determines a suitable choice for implication. Indeed, it is known that a t-norm $\ast$ is left-continuous if, and only if, there is a unique binary operation $\Rightarrow_\ast$ on $[0,1]$ satisfying the so-called *residuation condition:* $$ x \ast y \leq z\ \text{ if and only if }\ x \leq y \Rightarrow_\ast z. $$ The function $\Rightarrow_\ast$ is known as *residuum of $\ast$*, and it can be shown that $x \Rightarrow_\ast y = \max\{z \mid x \ast z \leq y\}$. The residua of the three mentioned prominent t-norms are: $x \Rightarrow_\min y = 1$ if $x\leq y$ and $y$ otherwise; $x \Rightarrow_\cdot y = 1$ if $x\leq y$ and $\frac{y}{x}$ otherwise; and $x \Rightarrow_{Ł} y = \min\{1, 1 - x+y\}$.
    step1: |-
      有趣的是，每个左连续 t-范数都决定一个合适的蕴涵选择。事实上，已知 t-范数 $\ast$ 左连续，当且仅当存在唯一的 $[0,1]$ 上二元运算 $\Rightarrow_\ast$，满足所谓的 *剩余条件*：$$ x \ast y \leq z\ \text{ if and only if }\ x \leq y \Rightarrow_\ast z. $$ 函数 $\Rightarrow_\ast$ 称为 *$\ast$ 的剩余*，可以证明 $x \Rightarrow_\ast y = \max\{z \mid x \ast z \leq y\}$。上述三个著名 t-范数的剩余分别是：$x \Rightarrow_\min y = 1$（当 $x\leq y$），否则为 $y$；$x \Rightarrow_\cdot y = 1$（当 $x\leq y$），否则为 $\frac{y}{x}$；以及 $x \Rightarrow_{Ł} y = \min\{1, 1 - x+y\}$。
    step2: |-
      有意思的是，每个左连续 t-范数都对应一个合适的蕴涵。事实上，t-范数 $\ast$ 左连续，当且仅当 $[0,1]$ 上恰有一个二元运算 $\Rightarrow_\ast$ 满足所谓 *剩余条件*：$$ x \ast y \leq z\ \text{ if and only if }\ x \leq y \Rightarrow_\ast z. $$ 这个 $\Rightarrow_\ast$ 叫 *$\ast$ 的剩余*，并且可以证明 $x \Rightarrow_\ast y = \max\{z \mid x \ast z \leq y\}$。三个著名 t-范数的剩余分别是：$x \Rightarrow_\min y = 1$（当 $x\leq y$），否则为 $y$；$x \Rightarrow_\cdot y = 1$（当 $x\leq y$），否则为 $\frac{y}{x}$；以及 $x \Rightarrow_{Ł} y = \min\{1, 1 - x+y\}$。
  - id: 10
    kind: body
    source: |-
      In the general t-norm setting, the negation is interpreted using the residuum. Namely, for a given left-continuous t-norm $\ast$ we set $\neg_\ast x = x\Rightarrow_\ast 0$. For the Łukasiewicz t-norm we obtain the negation $\neg_{Ł} x = 1 - x$ (known as Łukasiewicz negation or the standard involutive negation) whereas for the minimum and the product t-norms we obtain the same negation (known as Gödel negation): $\neg_\mathrm{G} 0 = 1$ and $0$ otherwise.
    step1: |-
      在一般 t-范数设定中，否定用剩余来解释。即，对给定的左连续 t-范数 $\ast$，令 $\neg_\ast x = x\Rightarrow_\ast 0$。对 Łukasiewicz t-范数，得到否定 $\neg_{Ł} x = 1 - x$（称为 Łukasiewicz 否定或标准对合否定）；而对最小与乘积 t-范数，得到同一个否定（称为 Gödel 否定）：$\neg_\mathrm{G} 0 = 1$，否则为 $0$。
    step2: |-
      在一般的 t-范数设定里，否定靠剩余来解释：给定左连续 t-范数 $\ast$，令 $\neg_\ast x = x\Rightarrow_\ast 0$。Łukasiewicz t-范数给出否定 $\neg_{Ł} x = 1 - x$（即 Łukasiewicz 否定，或称标准对合否定）；最小与乘积 t-范数给出的否定相同，称为 Gödel 否定：$\neg_\mathrm{G} 0 = 1$，否则为 $0$。
