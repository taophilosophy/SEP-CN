      ## 4. Gödel–Dummett logic
    step1: |-
      ## 4. Gödel–Dummett 逻辑
    step2: |-
      ## 4 Gödel–Dummett 逻辑
  - id: 21
    kind: body
    source: |-
      Gödel–Dummett logic, also known as Dummett’s LC or simply as Gödel logic, is another early example of a many-valued logic with truth-values in $[0,1]$. It was introduced by Michael Dummett (1959) as the extension of intuitionistic logic by the axiom $$(\varphi \to \psi) \lor (\psi \to \varphi).$$ This formula enforces a linear order in the underlying (Kripke-style as well as algebraic) semantics. It also appears in the context of Kurt Gödel’s observation that it is impossible to characterize intuitionistic logic by finite truth tables (Gödel 1932)[^gödel-1932]. In the fuzzy logic setting, Gödel–Dummett logic can alternatively be obtained as an axiomatic extension of MTL by adding the axiom $\varphi \to \varphi \mathbin{\&} \varphi$, which amounts to requiring the idempotence of $\&$, and hence the interpretation of both conjunctions coincides. Semantically, Gödel–Dummett logic can also be defined as the consequence relation given by the minimum t-norm. It is distinguished as the only t-norm based logic where the validity of a formula in a given evaluation does not depend on the specific values assigned to the propositional variables, but only on the relative order of these values. In this sense, Gödel–Dummett logic can be seen as a logic of comparative truth. Like for Łukasiewicz logic, the computational complexity of testing validity remains coNP-complete.
    step1: |-
      Gödel–Dummett 逻辑，又称 Dummett 的 LC 或简称 Gödel 逻辑，是另一个真值取在 $[0,1]$ 中的多值逻辑的早期例子。它由 Michael Dummett（1959）引入，作为直觉主义逻辑加上公理 $$(\varphi \to \psi) \lor (\psi \to \varphi)$$ 的扩张。这个公式在底层（Kripke 式以及代数式）语义中强制一个线性序。它也出现在 Kurt Gödel 的观察语境中：不可能用有穷真值表刻画直觉主义逻辑（Gödel 1932）[^gödel-1932]。在模糊逻辑设定中，Gödel–Dummett 逻辑也可以作为 MTL 的公理化扩张，加入公理 $\varphi \to \varphi \mathbin{\&} \varphi$ 得到，这相当于要求 $\&$ 幂等，因而两个合取的解释重合。在语义上，Gödel–Dummett 逻辑也可定义为由最小 t-范数给出的后承关系。它的独特之处在于：在基于 t-范数的逻辑中，它是唯一一个公式在给定赋值下的有效性不依赖命题变元所取的具体值、而只依赖这些值的相对顺序的逻辑。在这个意义上，Gödel–Dummett 逻辑可看作比较真值的逻辑。和 Łukasiewicz 逻辑一样，检验有效性的计算复杂性仍是 coNP 完全的。
    step2: |-
      Gödel–Dummett 逻辑又叫 Dummett 的 LC，或简称 Gödel 逻辑，也是真值取在 $[0,1]$ 中的早期多值逻辑。Michael Dummett（1959）把它作为直觉主义逻辑加公理 $$(\varphi \to \psi) \lor (\psi \to \varphi)$$ 的扩张提出。这条公式在底层语义（无论 Kripke 式还是代数式）中强制一个线性序；它也出现在 Kurt Gödel 的观察里：直觉主义逻辑不可能用有穷真值表刻画（Gödel 1932）[^gödel-1932]。在模糊逻辑中，Gödel–Dummett 逻辑也可以由 MTL 加公理 $\varphi \to \varphi \mathbin{\&} \varphi$ 得到，这等于要求 $\&$ 幂等，于是两个合取的解释重合。语义上，它还可定义为最小 t-范数给出的后承关系。它的特别之处是：在基于 t-范数的逻辑里，只有它使得公式在给定赋值下的有效性不取决于命题变元的具体取值，而只取决于这些值的相对顺序；因此可以说，Gödel–Dummett 逻辑是关于比较真值的逻辑。和 Łukasiewicz 逻辑一样，检验有效性的计算复杂性仍是 coNP 完全的。
