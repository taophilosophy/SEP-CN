      A thorough overview of all the kinds of propositional fuzzy logics mentioned in this section (and a general theory thereof) can be found in the *Handbook of Mathematical Fuzzy Logic* (3 volumes, Cintula et al. 2011a,b, 2015)[^cintula-2011a].
