      and *modus ponens* as the only inference rule: from $\varphi$ and $\varphi \to \psi$, infer $\psi$. We write $\Gamma \vdash_\mathrm{MTL} \varphi$ whenever there is a proof of $\varphi$ from $\Gamma$ in this system, i.e. there is a finite sequence of formulas which ends with $\varphi$ and its members are instances of the axioms, elements of $\Gamma$, or follow from previous ones by the inference rule (*modus ponens*). This Hilbert-style system is a strongly complete (finitary) axiomatization of the logic MTL, i.e. for each set of premises $\Gamma$ we have: $\Gamma \models_\mathrm{MTL} \varphi$ iff $\Gamma \vdash_\mathrm{MTL} \varphi$. The validity problem of $\mathrm{MTL}$ is known to be decidable, however its computational complexity has not yet been determined.
    step1: |-
      并以 *肯定前件* 为唯一推理规则：从 $\varphi$ 与 $\varphi \to \psi$ 推出 $\psi$。只要在这个系统中存在从 $\Gamma$ 到 $\varphi$ 的证明，即存在一个以 $\varphi$ 结尾的有限公式序列，其成员或是公理的实例、或是 $\Gamma$ 的元素、或由前面的成员按推理规则（*肯定前件*）得出，我们就写作 $\Gamma \vdash_\mathrm{MTL} \varphi$。这个希尔伯特式系统是逻辑 MTL 的强完全（有穷）公理化，即对每个前提集 $\Gamma$ 都有：$\Gamma \models_\mathrm{MTL} \varphi$ 当且仅当 $\Gamma \vdash_\mathrm{MTL} \varphi$。已知 $\mathrm{MTL}$ 的有效性问题可判定，但其计算复杂性尚未确定。
