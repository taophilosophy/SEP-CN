      MTL$\forall$ 的推理规则，是 *肯定前件* 再加 *概括*：由 $\varphi$ 推出 $\forall x\,\varphi$。
  - id: 34
    kind: body
    source: |-
      There are two ways of introducing first-order counterparts for other propositional t-norm based fuzzy logics. On the one hand, the axiomatization of MTL$\forall$ can be extended by adding the first-order instances of propositional axioms like those seen in the previous sections. In this manner one obtains syntactic presentations of first-order variants of, e.g., Łukasiewicz logic, Gödel–Dummett logic, Product logic, or Hájek’s basic fuzzy logic BL. On the other hand, the semantic definition of MTL$\forall$ can be easily modified by defining the consequence relations given by the corresponding (sets of) t-norms. Then, the natural question is whether, in each case, these two routes lead to the same logic (as it happened for MTL). For soundness there is no problem, as the axiomatic systems are easily checked to be sound with respect to their corresponding classes of structures. As for completeness, there is no general answer and the problem has to be considered case by case.
    step1: |-
      为其他基于 t-范数的命题模糊逻辑引入一阶对应物，有两条途径。一方面，可以把 MTL$\forall$ 的公理化加以扩张，加入前几节所见命题公理的一阶实例。这样便得到例如 Łukasiewicz 逻辑、Gödel–Dummett 逻辑、乘积逻辑或 Hájek 基本模糊逻辑 BL 的一阶变体的句法呈现。另一方面，MTL$\forall$ 的语义定义可以轻易修改，改为定义由相应 t-范数（集合）给出的后承关系。于是自然的问题是：在每种情形下，这两条途径是否通向同一个逻辑（就像 MTL 那样）。可靠性没有问题，因为很容易检验这些公理系统相对于相应的结构类可靠。至于完全性，没有一般答案，必须逐案考虑。
    step2: |-
      给其他基于 t-范数的命题模糊逻辑配一阶对应物，有两条路。第一条是把 MTL$\forall$ 的公理化扩一扩，加入前几节那些命题公理的一阶实例，于是得到 Łukasiewicz 逻辑、Gödel–Dummett 逻辑、乘积逻辑、Hájek 基本模糊逻辑 BL 等的一阶变体的句法呈现。第二条是改动 MTL$\forall$ 的语义定义，改为由相应 t-范数（集合）给出后承关系。接下来自然要问：每种情形下，这两条路是否通向同一个逻辑（MTL 就是如此）？可靠性不成问题，因为这些公理系统相对于相应结构类很容易验证可靠；完全性则没有一般答案，只能一案一议。
  - id: 35
    kind: body
    source: |-
      For Gödel–Dummett logic the axiomatic system is strongly complete with respect to its semantics. However, the set of tautologies of the semantics for Łukasiewicz logic is not recursively axiomatizable as shown by Bruno Scarpellini (1962). Emil Ragaz (1981) proved that it is actually $\Sigma_2$-complete in the sense of arithmetical hierarchy. The situation is even worse in the case of Product logic and Hájek’s basic fuzzy logic BL, where the sets of first-order tautologies of all structures given by continuous t-norms are as complex as true arithmetics (Montagna 2001)[^montagna-2001]. Completeness can be achieved either by adding a suitable infinitary inference rule to the Hilbert-style proof system, as done by Louise Hay (1963) for Łukasiewicz logic, or by generalizing the set of truth-values (see next section).
    step1: |-
      对 Gödel–Dummett 逻辑，公理系统相对于其语义是强完全的。然而，正如 Bruno Scarpellini（1962）所示，Łukasiewicz 逻辑语义的重言式集合不是递归可公理化的。Emil Ragaz（1981）证明，它在算术层级的意义上实际上是 $\Sigma_2$-完全的。乘积逻辑与 Hájek 基本模糊逻辑 BL 的情形更糟：由连续 t-范数给出的所有结构的一阶重言式集合，与真正的算术一样复杂（Montagna 2001）[^montagna-2001]。要获得完全性，可以像 Louise Hay（1963）对 Łukasiewicz 逻辑所做的那样，给希尔伯特式证明系统添加合适的无穷推理规则，或者推广真值集合（见下一节）。
    step2: |-
      对 Gödel–Dummett 逻辑，公理系统相对于其语义是强完全的。但 Łukasiewicz 逻辑的语义重言式集合，正如 Bruno Scarpellini（1962）所证明的，不是递归可公理化的；Emil Ragaz（1981）进一步证明，它在算术层级意义上是 $\Sigma_2$-完全的。乘积逻辑和 Hájek 基本模糊逻辑 BL 更糟：由连续 t-范数给出的所有结构，其一阶重言式集合与真正的算术一样复杂（Montagna 2001）[^montagna-2001]。要得到完全性，可以给希尔伯特式证明系统加合适的无穷推理规则——Louise Hay（1963）对 Łukasiewicz 逻辑就是这么做的——或者推广真值集合（见下一节）。
