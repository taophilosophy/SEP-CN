      MTL-algebras are a generalization of the t-norm based semantics explained above and provide a sound and complete semantics for MTL.[^note-4]
    step1: |-
      MTL-代数是上述基于 t-范数语义的推广，并为 MTL 提供可靠且完全的语义。[^note-4]
    step2: |-
      MTL-代数是上述基于 t-范数语义的推广，给 MTL 提供了可靠且完全的语义。[^note-4]
  - id: 43
    kind: body
    source: |-
      MTL-chains are the basic building blocks of the whole class of algebras, in the sense that each MTL-algebra can be decomposed as a *subdirect product* of chains. This implies that the logic is also complete with respect to the semantics of MTL-chains, which is then used as the first step in the proof of its completeness with respect to the t-norm based semantics (Jenei & Montagna 2002)[^jenei-2002].
    step1: |-
      MTL-链是整个代数学科的基本构件，意思是每个 MTL-代数都可分解为链的 *次直积*。这意味着该逻辑相对于 MTL-链语义也是完全的，而这又被用作证明它相对于基于 t-范数语义完全的第一步（Jenei & Montagna 2002）[^jenei-2002]。
    step2: |-
      MTL-链是整个代数类的基本构件：每个 MTL-代数都能分解成链的 *次直积*。这意味着该逻辑相对于 MTL-链语义也完全；证明它相对于基于 t-范数语义完全时，第一步靠的就是这一点（Jenei & Montagna 2002）[^jenei-2002]。
  - id: 44
    kind: body
    source: |-
      Algebraic semantics is a universal tool for propositional logics. In particular, for any arbitrary fuzzy logic studied in the literature (even those not supporting a t-norm based semantics such as finite-valued fuzzy logics or the logic of non-commutative uninorms) one can find a corresponding class of algebras which can be decomposed as subdirect products of chains. This fact has led Libor Běhounek and Petr Cintula (2006) to propose a definition of fuzzy logics as logics that are complete with respect to totally ordered algebraic structures.
    step1: |-
      代数语义是命题逻辑的通用工具。特别地，对文献中研究的任何模糊逻辑（甚至对不支持基于 t-范数语义的逻辑，如有穷值模糊逻辑或非交换 uninorm 的逻辑），都能找到相应的代数类，它们可分解为链的次直积。这一事实促使 Libor Běhounek 与 Petr Cintula（2006）提出把模糊逻辑定义为相对于全序代数结构完全的逻辑。
    step2: |-
