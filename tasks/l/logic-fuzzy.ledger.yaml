      ## 3 Łukasiewicz 逻辑
  - id: 17
    kind: body
    source: |-
      Łukasiewicz logic can be defined by adding the axiom (known as Wajsberg axiom)$$((\varphi \to \psi) \to \psi) \to ((\psi \to \varphi) \to \varphi)$$ to the Hilbert-style proof system for MTL. It corresponds to the finitary version of the consequence relation defined with respect to evaluations based on the Łukasiewicz t-norm (in symbols: for each *finite* set of formulas $\Gamma$ and each formula $\varphi$, we have $\Gamma \models_{Ł} \varphi$ iff $\Gamma \vdash_{Ł} \varphi$).[^note-2]
    step1: |-
      Łukasiewicz 逻辑可这样定义：在 MTL 的希尔伯特式证明系统中加入公理（称为 Wajsberg 公理）$$((\varphi \to \psi) \to \psi) \to ((\psi \to \varphi) \to \varphi)$$。它对应于相对于 Łukasiewicz t-范数赋值所定义的后承关系的有穷版本（符号表示：对每个 *有限* 公式集 $\Gamma$ 与每个公式 $\varphi$，$\Gamma \models_{Ł} \varphi$ 当且仅当 $\Gamma \vdash_{Ł} \varphi$）。[^note-2]
    step2: |-
      Łukasiewicz 逻辑是在 MTL 的希尔伯特式证明系统中加入 Wajsberg 公理 $$((\varphi \to \psi) \to \psi) \to ((\psi \to \varphi) \to \varphi)$$ 得到的。它对应的是按 Łukasiewicz t-范数赋值所定义后承关系的有穷版本：对每个 *有限* 公式集 $\Gamma$ 和每个公式 $\varphi$，$\Gamma \models_{Ł} \varphi$ 当且仅当 $\Gamma \vdash_{Ł} \varphi$。[^note-2]
  - id: 18
    kind: body
    source: |-
      This logic was an early example of a many-valued logic, introduced by Jan Łukasiewicz and Alfred Tarski (1930), well before the inception of the theory of fuzzy sets, by means of an equivalent axiomatic system (with *modus ponens* as the only inference rule):

      $$ \begin{align} \varphi &\to (\psi \to \varphi)\\ (\varphi \to \psi) &\to ((\psi \to \chi) \to (\varphi \to \chi))\\ ((\varphi \to \psi) \to \psi) &\to ((\psi \to \varphi) \to \varphi)\\ (\neg \psi \to \neg \varphi) &\to (\varphi \to \psi)\\ ((\varphi \to \psi) &\to (\psi \to \varphi)) \to (\psi \to \varphi). \end{align} $$
    step1: |-
      这个逻辑是多值逻辑的一个早期例子，由 Jan Łukasiewicz 与 Alfred Tarski（1930）在模糊集合论创立之前很久，用一个等价的公理系统（以 *肯定前件* 为唯一推理规则）引入：

      $$ \begin{align} \varphi &\to (\psi \to \varphi)\\ (\varphi \to \psi) &\to ((\psi \to \chi) \to (\varphi \to \chi))\\ ((\varphi \to \psi) \to \psi) &\to ((\psi \to \varphi) \to \varphi)\\ (\neg \psi \to \neg \varphi) &\to (\varphi \to \psi)\\ ((\varphi \to \psi) &\to (\psi \to \varphi)) \to (\psi \to \varphi). \end{align} $$
    step2: |-
      这是多值逻辑的早期例子：Jan Łukasiewicz 与 Alfred Tarski（1930）在模糊集合论问世之前很久就提出了它，用的是等价公理系统，推理规则只有 *肯定前件*：

      $$ \begin{align} \varphi &\to (\psi \to \varphi)\\ (\varphi \to \psi) &\to ((\psi \to \chi) \to (\varphi \to \chi))\\ ((\varphi \to \psi) \to \psi) &\to ((\psi \to \varphi) \to \varphi)\\ (\neg \psi \to \neg \varphi) &\to (\varphi \to \psi)\\ ((\varphi \to \psi) &\to (\psi \to \varphi)) \to (\psi \to \varphi). \end{align} $$
  - id: 19
    kind: body
    source: |-
      Łukasiewicz logic is the only t-norm based fuzzy logic where all connectives are interpreted by continuous functions, including the implication given by the function $x \Rightarrow_{Ł} y=\min\{1,1-x+y\}$. McNaughton’s theorem (1951) states that real-valued functions over [0,1] that interpret formulas of Łukasiewicz logic are exactly the continuous piecewise linear functions with integer coefficients. In terms of computational complexity, the validity problem for this logic is asymptotically not worse than in classical logic: it remains coNP-complete.
    step1: |-
      Łukasiewicz 逻辑是唯一一种所有联结词都由连续函数解释的基于 t-范数的模糊逻辑，其中包括由函数 $x \Rightarrow_{Ł} y=\min\{1,1-x+y\}$ 给出的蕴涵。McNaughton 定理（1951）指出，在 [0,1] 上解释 Łukasiewicz 逻辑公式的实值函数，恰好是整系数连续分段线性函数。就计算复杂性而言，这个逻辑的有效性问题渐近地不比经典逻辑差：它仍是 coNP 完全的。
    step2: |-
      Łukasiewicz 逻辑是唯一一种所有联结词（包括由 $x \Rightarrow_{Ł} y=\min\{1,1-x+y\}$ 给出的蕴涵）都由连续函数解释的基于 t-范数的模糊逻辑。McNaughton 定理（1951）说，在 [0,1] 上解释 Łukasiewicz 逻辑公式的实值函数，正好是整系数的连续分段线性函数。论计算复杂性，它的有效性问题渐近地不比经典逻辑糟：仍是 coNP 完全的。
