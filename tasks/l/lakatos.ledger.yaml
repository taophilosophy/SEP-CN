      Nonetheless, Lakatos’s influence, particularly in the philosophy of science, has been immense. According to Google Scholar, by the 25ᵗʰ of January 2015, that is, just twenty-five days into the new year, *thirty-three papers* had been published citing Lakatos *in that year alone*, a citation rate of over one paper per day. Introductory texts on the Philosophy of Science typically include substantial sections on Lakatos, some admiring, some critical, and many an admixture of the two (see for example Chalmers 2013 and Godfrey-Smith 2003)[^chalmers-2013][^godfrey-smith-2003]. The premier prize for the best book in the Philosophy of Science (funded by the foundation of a wealthy and academically distinguished disciple, Spiro Latsis) is named in his honour. Moreover, Lakatos is one of those philosophers whose influence extends well beyond the confines of academic philosophy. Of the thirty-three papers citing Lakatos published in the first twenty-five days of 2015, at most *ten* qualify as straight philosophy. The rest are devoted to such topics as educational theory, international relations, public policy research (with special reference to the development of technology), informatics, design science, religious studies, clinical psychology, social economics, political economy, mathematics, the history of physics and the sociology of the family. Thus Imre Lakatos was very much more than a philosophers’ philosopher.
    step1: |-
      尽管如此，拉卡托什的影响——尤其在科学哲学中——是巨大的。据 Google Scholar 统计，截至 2015 年 1 月 25 日，也就是新年刚过 25 天，当年就已有 *33 篇论文*发表并引用拉卡托什，引用率超过每天一篇。科学哲学的导论性教科书通常都有关于拉卡托什的相当篇幅，有的钦佩，有的批评，许多兼而有之（例如 Chalmers 2013 与 Godfrey-Smith 2003）[^chalmers-2013][^godfrey-smith-2003]。科学哲学最佳著作的最高奖项（由其富有的、学术卓越的门徒 Spiro Latsis 的基金会资助）即以他的名字命名。此外，拉卡托什属于其影响远超学院哲学围墙的那类哲学家。2015 年头 25 天引用拉卡托什的 33 篇论文中，够得上纯正哲学的至多 *10 篇*，其余专论教育理论、国际关系、公共政策研究（尤其涉及技术发展）、信息学、设计科学、宗教研究、临床心理学、社会经济学、政治经济学、数学、物理学史与家庭社会学。因此，伊姆雷·拉卡托什远不止是一位哲学家的哲学家。
    step2: |-
      尽管如此，拉卡托什的影响——尤其在科学哲学中——是巨大的。据 Google Scholar 统计，截至 2015 年 1 月 25 日——新年才过 25 天——当年就已有 *33 篇论文*发表并引用拉卡托什，引用率超过每天一篇。科学哲学的导论教科书通常都有关于拉卡托什的相当篇幅：有的钦佩，有的批评，许多兼而有之（例如 Chalmers 2013 与 Godfrey-Smith 2003）[^chalmers-2013][^godfrey-smith-2003]。科学哲学最佳著作的最高奖项（由他富有而学术卓越的门徒 Spiro Latsis 的基金会资助）即以他的名字命名。此外，拉卡托什属于其影响远出学院哲学围墙之外的那类哲学家：2015 年头 25 天引用拉卡托什的 33 篇论文中，够得上纯正哲学的至多 *10 篇*，其余专论教育理论、国际关系、公共政策研究（尤其涉及技术发展）、信息学、设计科学、宗教研究、临床心理学、社会经济学、政治经济学、数学、物理学史与家庭社会学诸领域。因此，伊姆雷·拉卡托什远不止是一位哲学家的哲学家。
