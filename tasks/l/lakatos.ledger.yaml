      拉卡托什的划界标准比波普尔宽容，还有另一层。对波普尔而言，如果一个*理论*不可证伪，那它就不科学，仅此而已。这是非此即彼的事。对拉卡托什而言，科学性是或多或少的问题，且多与少可随时间而变。一个*研究纲领*可以在一个阶段是科学的，在另一个阶段不那么科学（或非科学）——如果它不再产生新预测且无法消化其反常——但随后可以卷土重来，恢复其科学地位。因此，划界标准的裁决是程度问题，而且是可随时间变化的程度问题。我们很少能绝对地说一个研究纲领不科学；我们只能说它*眼下*看起来科学健康欠佳，恢复的前景不妙。因此，拉卡托什比波普尔更是可错论者。对波普尔而言，我们可以通过考察一个理论的逻辑蕴涵来判定它是否科学。对拉卡托什而言，我们最好的猜测可能被证明是错的，因为一个研究纲领的科学地位部分地由其历史决定，而不仅仅由其逻辑性质决定，而历史——正如波普尔本人宣告的——本质上是不可预测的。
