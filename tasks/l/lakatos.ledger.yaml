      伊姆雷·拉卡托什 1922 年 11 月 9 日生于匈牙利东部德布勒森，原名伊姆雷·利普西茨（Imre Lipsitz），是犹太夫妇雅各布·马尔东·利普西茨（Jacob Marton Lipsitz）与玛尔吉特·赫尔茨费尔德（Margit Herczfeld）的独子。拉卡托什的父母在他很小的时候就分开了，他主要由祖母和当美容师的母亲抚养长大。拉卡托什出生时的匈牙利是一个没有国王的王国，由没有海军的海军上将统治——“摄政”霍尔蒂海军上将，其海军军衔得自业已解体的奥匈帝国军中服役。该政权属于威权主义，可算一种轻量级法西斯主义。经过出色的学校生涯——其间他赢得数学竞赛与诸多奖项——拉卡托什于 1940 年进入德布勒森大学。拉卡托什 1944 年毕业于物理学、数学与哲学。在德布勒森求学期间，他成为坚定的共产主义者，参加地下的共产主义会议，并于 1943 年组建了自己的地下学习小组。
