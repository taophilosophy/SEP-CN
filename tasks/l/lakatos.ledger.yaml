      1964 年，拉卡托什从数学史与数学哲学转向经验科学的历史与哲学。他组织了一次著名的国际科学哲学讨论会，1965 年在伦敦举行。参加者包括塔斯基、蒯因、卡尔纳普、库恩与波普尔。会议论文集出了四卷（Lakatos (ed.) 1967 与 1968，Lakatos and Musgrave (eds.) 1968 与 1970）。拉卡托什本人向论文集贡献了三篇重要论文。第一篇（**复兴**）已经讨论过。第二篇《归纳逻辑问题的变化》（**变化**）分析了卡尔纳普与波普尔关于科学中理论与证据之关系的争论。它无论就其结论还是方法论都引人注目。 直白地说，其结论是：某一种归纳主义是胡说。一种让你能从观察陈述集导出科学理论、从而为其提供弱的或概率性辩护的归纳逻辑，其前景确实黯淡。没有任何归纳逻辑能据以推导、“部分证明”或“（被事实）在一定程度上确证”现实生活中的科学理论（**变化**: 133）。但拉卡托什试图通过分析波普尔/卡尔纳普之争并颠倒那道常见的裁定——卡尔纳普赢了、波普尔输了——来证明他的观点。而在这里他面临一个问题。正如 Fox（1981）所解释的：
