      *Proofs and Refutations* is a critique of “formalist” philosophies of mathematics (including formalism proper, logicism and intuitionism), which, in Lakatos’s view, radically misrepresent the nature of mathematics as an intellectual enterprise. For Lakatos, the development of mathematics should not be construed as series of Euclidean deductions where the contents of the relevant concepts has been carefully specified in advance so as to preclude equivocation. Rather, these water-tight deductions from well-defined premises are the (perhaps temporary) *end-points* of an evolutionary, and indeed a *dialectical*, process in which the constituent concepts are initially ill-defined, open-ended or ambiguous but become sharper and more precise in the context of a protracted debate. The proofs are refined in conjunction with the concepts (hence “proof-generated concepts”) whilst “refutations” in the form of counterexamples play a prominent part in the process. [One might almost say, paraphrasing Hegel, that in Lakatos’s view “when Euclidean demonstrations paint their grey in grey, then has a shape of mathematical life grown old…The owl of the formalist Minerva begins its flight only with the falling of dusk” (Hegel 2008 [1820/21]: 16)[^hegel-2008].]
    step1: |-
      《证明与反驳》是对“形式主义”数学哲学（包括狭义形式主义、逻辑主义与直觉主义）的批判——在拉卡托什看来，它们从根本上歪曲了数学作为一项智识事业的性质。对拉卡托什而言，数学的发展不应被理解成一系列欧几里得式的演绎，其中相关概念的内容已被预先仔细规定以杜绝歧义。毋宁说，这些从良定义前提出发的滴水不漏的演绎，是一个演化乃至*辩证*过程的（也许是暂时的）*终点*：在此过程中，构成性概念起初界定不清、开放或有歧义，而在漫长的争论中变得愈发清晰精确。证明与概念一道被磨炼（故有“证明生成的概念”），而以反例形式出现的“反驳”在这一过程中扮演着突出角色。[人们几乎可以化用黑格尔的话说，在拉卡托什看来，“当欧几里得式的论证用灰色涂满灰色，数学生活的某种形态就已老去……形式主义密涅瓦的猫头鹰要到黄昏才起飞”（Hegel 2008 [1820/21]: 16）[^hegel-2008]。]
    step2: |-
      《证明与反驳》是对“形式主义”数学哲学（包括狭义形式主义、逻辑主义与直觉主义）的批判——在拉卡托什看来，这些哲学从根本上歪曲了数学作为智识事业的性质。对拉卡托什而言，数学的发展不应被当作一串欧几里得式的演绎：相关概念的内容预先受到仔细规定，以杜绝歧义。毋宁说，那些从良定义前提出发、滴水不漏的演绎，只是一个演化乃至*辩证*过程的（或许是暂时的）*终点*——在此过程中，构成性概念起初界定含混、开放或歧义，然后在漫长的争论中愈磨愈清。证明与概念一道被打磨（故有“证明生成的概念”之说），而以反例形式出现的“反驳”则在这过程中唱着重头戏。[人们几乎可以化用黑格尔的话说：在拉卡托什看来，“当欧几里得式论证以灰色绘出灰色，数学生活的某种形态便已老去……形式主义密涅瓦的猫头鹰要等黄昏降临才开始飞翔”（Hegel 2008 [1820/21]: 16）[^hegel-2008]。]
