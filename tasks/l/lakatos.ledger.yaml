      ### 3.5 “The History of Science and Its Rational Reconstructions” (1971)
    step1: |-

    step2: |-

  - id: 149
    kind: body
    source: |-
      As we have seen, in *Proofs and Refutations* Lakatos had already joked that “actual history is frequently a caricature of its rational reconstructions”. The use of the plural—“reconstruction*s*”—is important. There is more than one way of rationally reconstructing history, and how you do it depends upon what you count as rational and what not—it depends, in short, in your theory of rationality. There is not one “rational history”—as Hegel may have thought—but several competing ones. And, in a remarkable dialectical turn, Lakatos proposed that one can evaluate competing theories of rationality by asking how well they enable one to reconstruct the history of science (whether it be mathematics or empirical science). The thought is that if your philosophy of science, or theory of scientific rationality, deems most of “great science” irrational, then something is wrong with it. Contrariwise, the more of the history of “great science” your theory of rationality deems rational, the better that theory is.
    step1: |-

    step2: |-

  - id: 150
    kind: body
    source: |-
      The obvious worry is that this meta-criterion for theories of scientific rationality threatens to deprive the philosophy of science of any critical bite. Will not the best philosophy of science simply say that whatever scientists do is rational, that scientific might is right, that the best methodology is Feyerabend’s “Anything goes”? Lakatos’s Kantian epigram “Philosophy of science without history of science is empty; history of science without philosophy of science is blind” threatens to eliminate the philosophy of science altogether, in favour of historical-sociological studies of the decisions of scientific communities. (One of us discusses this problem, and attempts to disarm the worry, in Musgrave 1983.)[^musgrave-1983]
    step1: |-

    step2: |-

  - id: 151
    kind: body
    source: |-
      Another worry, which is perhaps less obvious, is that Lakatos seems to be implicitly appealing to the kind of inductive principle that he scorns elsewhere. Isn’t he saying that a sequence of successes in the history of science displaying key episodes as rational tends to *confirm* a theory of scientific rationality?
    step1: |-

    step2: |-

  - id: 152
    kind: body
    source: |-
      Lakatos himself was a master of philosophically inspired case-studies of episodes in the history of science—Feyerabend said he had turned this into an art form. His “Hegelian” idea that the “rationally reconstructed” history of thought has primacy is emphasised in two books, Larvor 1998 and Kadvany 2001. After his death, a Colloquium was held in Nafplion, Greece, where case-studies applying Lakatos’s ideas to episodes from the history of both the natural and social sciences were presented by his students and colleagues. The Proceedings of this “Nafplion Colloquium” were subsequently published in two volumes—Howson (ed.) 1976 and Latsis (ed.) 1976. Further case-studies include Zahar 1973 and Urbach 1974.
    step1: |-

    step2: |-

  - id: 153
    kind: body
    source: |-
      However, Urbach’s paper, which was written with Lakatos’s active collaboration and encouragement (F&AM: 348–34), represents something of an “own goal” for the MSRP. Urbach argued that the environmentalist programme in IQ Studies, which tries to explain intergroup differences in tested intelligence as due to environmental causes, was a degenerating research programme. At least it was degenerating when compared to its hereditarian rival which puts these differences down to differences in hereditary endowments. The tables were dramatically turned just thirteen years later with the discovery of the Flynn effect (1987) which showed massive differences in intergroup IQs which simply *could not* be explained by hereditary differences. (The groups in question were genetically identical, the higher scoring groups being the children or the grandchildren of the lower scoring groups. See Flynn 1987 and 2009.)[^flynn-1987][^flynn-2009] Thus the supposedly “degenerate” programme was propelled into the lead. Of course the MSRP *allows* for such dramatic reversals of fortune, but it is at least a bit embarrassing if a programme damned as degenerate by both the Master and one of his chief disciples is spectacularly vindicated just thirteen years later.
    step1: |-

    step2: |-

