      有时有人提出，在拉卡托什看来，除非存在更好的理论，否则任何理论都不应当被抛弃（Hacking 1983: 113）[^hacking-1983]。这是否意味着，在缺乏进步的替代者时，任何研究纲领都不应放弃，*无论它多么退化*？若是如此，这等于一个激进的反怀疑论论题：与其毫无幻觉地坐在无知之中，不如信奉一个带有虚假之一切标志的理论——例如某个真正退化的纲领的当前代表。（相比之下，古代怀疑派认为，宁可什么都不信，也不要相信*可能*为假的东西。）我们不确定这是拉卡托什的意见，尽管他显然认为放弃一个*进步的*研究纲领是错误的，除非有更好的可转投者。但再考虑马克思主义的例子。拉卡托什在上面引文中似乎在暗示：放弃马克思主义是理性上允许的——也许甚至是义务性的——即便它*没有*进步的对手，也就是说，即便眼下*没有*另一个研究纲领，拥有一组关于资本主义根本性质及其最终命运的硬核论题。（毕竟，后期的拉卡托什很可能接受波普尔式的论题：宏观历史系统性地不可预测。若如此，便*不可能*存在一个真正进步的、预言资本主义命运的纲领。充其量你只能有一个条件式理论，比如 Piketty 的理论：在资本主义下，不平等可能扩大——*除非*发生意料之外的事，或*除非*我们决定对此做点什么。见 Piketty 2014: 35。）因此，尽管拉卡托什认为科学共同体在更好的东西出现之前很少放弃一个纲领，但他是否认为他们*始终应当*如此，并不清楚。
