      Although he lived and worked in London, rising to the post of Professor of Logic at the London School of Economics (LSE), Lakatos never became a British citizen, but died a stateless person. Despite the star-studded array of academic lords and knights who were willing to testify on his behalf, neither MI5 nor the Special Branch seem to have trusted him, and no less a person than Roy Jenkins, the then Home Secretary, signed off on the refusal to naturalize him. (See Bandy 2009: ch. 16, which includes the transcripts of successive interrogations.)[^bandy-2009]
    step1: |-
      他虽然在伦敦生活和工作，一路升任伦敦政治经济学院（LSE）逻辑学教授，却始终没有成为英国公民，去世时仍是无国籍者。尽管众多学界名流与勋爵爵士愿意为他作证，军情五处（MI5）与特别分局似乎都不信任他，时任内政大臣罗伊·詹金斯（Roy Jenkins）亲自签署了拒绝其入籍的批复。（见 Bandy 2009: ch. 16，其中载有历次审讯笔录。）[^bandy-2009]
    step2: |-
      他虽在伦敦生活与工作，一路升至伦敦政治经济学院（LSE）逻辑学教授，却始终未入英国籍，直到去世仍是无国籍者。尽管愿意为他作证的学界名流与勋爵爵士阵容豪华，军情五处与特别分局似乎都不信任他；时任内政大臣的罗伊·詹金斯（Roy Jenkins）亲自在拒绝其入籍的批复上签字。（见 Bandy 2009: ch. 16，其中载有历次审讯的笔录。）[^bandy-2009]
