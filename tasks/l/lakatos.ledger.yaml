      An instance of Lakatos’s Syme-like behaviour is his 1947 denunciation of the literary critic and philosopher György Lukács, one of the intellectual luminaries of the communist movement. Lukács represented the academically respectable face of communism, and favoured a gradual and democratic transition to the dictatorship of the proletariat. Lakatos organized an “anti-Lukács meeting…held under the aegis of the Valóság Circle” to critique Lukács’s foot-dragging and “Weimarism” (Bandy 2009: 110)[^bandy-2009]. Once the regime was firmly in control, Lukács was indeed censured for his undue concessions to bourgeois democracy, and he spent the early fifties under a cloud. But in 1947, Lakatos’s criticisms were deemed premature and he got into trouble because of his un-Party-like activities. (Lukács himself referred to the episode as a “cliquish *kaffe klatsch*”.) In Communist Hungary it was important not to be “one pamphlet behind” the Party line (Bandy 2009: 92)[^bandy-2009]. Lakatos was the sort of over-zealous communist who was sometimes a couple of pamphlets ahead.
    step1: |-
      拉卡托什“赛麦式”行为的一个例子，是他在 1947 年对文学批评家兼哲学家格奥尔格·卢卡奇的揭发——后者是共产主义运动的知识界明星。卢卡奇代表着共产主义在学院里体面的面孔，主张向无产阶级专政的渐进民主过渡。拉卡托什组织了一次“反卢卡奇会议……在 Valóság 俱乐部的主持下举行”，批判卢卡奇的拖沓与“魏玛主义”（Bandy 2009: 110）[^bandy-2009]。政权稳固后，卢卡奇确实因对资产阶级民主的过度让步而遭申斥，整个五十年代初期郁郁不得志。但在 1947 年，拉卡托什的批判被认为为时过早，他反倒因“非党的”活动陷入麻烦。（卢卡奇本人称这次事件为一场“小圈子的 *kaffe klatsch*”。）在共产党匈牙利，重要的是不要“落后党的路线一个小册子”（Bandy 2009: 92）[^bandy-2009]。拉卡托什是那种过度热忱的共产主义者，有时领先了两个小册子。
