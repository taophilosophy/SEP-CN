      What Lakatos does not make so much of (though he does not conceal it either) is that in his view the development of mathematics is also much more like the development of thought *in general* as analysed by Hegel than *Hegel* himself supposed. There is thesis, antithesis and synthesis, “Hegelian language, which [Lakatos thinks would] generally be capable of describing the various developments in mathematics” (P&R: 146). Thus there is a certain sense in which Lakatos out-Hegels Hegel, giving a dialectical analysis of a discipline (mathematics) that Hegel himself despised as insufficiently dialectical (see Larvor 1998, 1999, 2001)[^larvor-1998]. Hence Feyerabend’s gibe (which Lakatos took in good part) that Lakatos was a Pop-Hegelian, the bastard child of Popperian father and a Hegelian mother (F&AM: 184–185).
    step1: |-
      拉卡托什没有大做文章的（尽管他也没有隐瞒）是：在他看来，数学的发展也更像黑格尔所分析的思想*一般*的发展，只是黑格尔本人没有意识到。其中有正题、反题与合题——“黑格尔式语言，（拉卡托什认为）一般而言足以描述数学中的各种发展”（P&R: 146）。因此，在某种意义上，拉卡托什比黑格尔还黑格尔：他给了数学这门黑格尔本人鄙为不够辩证的学科一个辩证分析（见 Larvor 1998, 1999, 2001）[^larvor-1998]。于是有了费耶阿本德的讥讽（拉卡托什坦然受之）：拉卡托什是“波普-黑格尔”——波普尔父亲与黑格尔母亲的私生子（F&AM: 184–185）。
    step2: |-
      拉卡托什未大做文章的（但也没有掩饰）是：在他看来，数学的发展也更像黑格尔所分析的*一般*思想的发展——只是连黑格尔本人都没意识到这一点。其中有正题、反题与合题——“黑格尔式语言，（拉卡托什认为它）一般而言足以刻画数学中的种种发展”（P&R: 146）。就此而言，拉卡托什可谓比黑格尔还黑格尔：他给数学这门被黑格尔本人鄙为不够辩证的学科做了一次辩证分析（见 Larvor 1998, 1999, 2001）[^larvor-1998]。于是便有费耶阿本德的讥讽（拉卡托什坦然受之）：拉卡托什是个“波普-黑格尔”——波普尔之父与黑格尔之母的私生子（F&AM: 184–185）。
