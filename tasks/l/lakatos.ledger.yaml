      It is sometimes suggested that in Lakatos’s opinion no theory either is or ought to be abandoned, unless there is a better one in existence (Hacking 1983: 113)[^hacking-1983]. Does this mean that no research programme should be given up in the absence of a progressive alternative, *no matter how degenerate it may be*? If so, this amounts to the radically anti-sceptical thesis that it is better to subscribe to a theory that bears all the hallmarks of falsehood, such as the current representative of a truly degenerate programme, than to sit down in undeluded ignorance. (The ancient sceptics, by contrast thought that it is better not to believe *anything at all* rather than believe something that *might* be false.) We are not sure that this was Lakatos’ opinion, though he clearly thinks it a mistake to give up on a *progressive* research programme, unless there is a better one to shift to. But consider again the case of Marxism. What Lakatos seems to be suggesting in the passage quoted above, is that it is rationally permissible—perhaps even obligatory—to give up on Marxism even if it has *no* progressive rival, that is, if there is currently *no* alternative research programme with a set of hard core theses about the fundamental character of capitalism and its ultimate fate. (After all, the later Lakatos probably subscribed to the Popperian thesis that history in the large is systematically unpredictable. In which case there *could not* be a genuinely progressive programme which foretold the fate of capitalism. At best you could have a conditional theory, such as Piketty’s, which says that under capitalism, inequality is likely to grow—*unless* something unexpected happens or *unless* we decide to do something about it. See Piketty 2014: 35.) So although Lakatos thinks that the scientific community seldom gives up on a programme until something better comes along, it is not clear that he thinks that this is what they always *ought* to do.
