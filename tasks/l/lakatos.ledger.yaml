      After his release from Recsk in September 1953 (minus several teeth), Lakatos remained for a while, a loyal Stalinist. He eked out a living in the Mathematics Institute of the Hungarian Academy of Science, reading, researching and translating (including a translation into Hungarian of George Pólya’s *How to Solve It*). During this time he was informing on friends and colleagues to the ÁVH, the Hungarian secret police, though he subsequently claimed that he did not pass on anything incriminating (Long 2002: 290 )[^long-2002]. It was whilst working at the Mathematics Institute that he first gained access to the works of Popper. Gradually he turned against the Stalinist Marxism that had been his creed. He married (as his second wife) Éva Pap and lived at her parents’ house (his father-in-law being the distinguished agronomist, Endre Pap). In 1956 he joined the revisionist Petőfi Circle and delivered a stirring speech on “On Rearing Scholars” which at least burnt his bridges with Stalinism:
