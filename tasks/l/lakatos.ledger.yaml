      First, we discuss Lakatos’s life in relation to his works. Lakatos’s Hungarian career has now become a big issue in the critical literature. This is partly because of disturbing facts about Lakatos’s early life that have only come to light in the West since his death, and partly because of a dispute between the “Hungarian” and the “English” interpreters of Lakatos’s thought, between those writers (not all of them Magyars) who take the later Lakatos to be much more of a Hegelian (and perhaps much more of a disciple of György Lukács) than he liked to let on, and those who take his Hegelianism to be an increasingly residual affair, not much more, in the end, than a habit of “coquetting” with Hegelian expressions (Marx, *Capital*: 103). Just as there are analytic Marxists who think that Marx’s thought can be rationally reconstructed without the Hegelian coquetry and dialectical Marxists who think that it cannot, so also there are analytic Lakatosians who think that Lakatos’s thought can be largely reconstructed without the Hegelian coquetry and dialectical Lakatosians who think that it cannot (see for instance Kadvany 2001 and Larvor 1998)[^kadvany-2001][^larvor-1998]. Obviously, we cannot settle the matter in an Encyclopedia entry but we hope to say enough to illuminate the issue. (Spoiler alert: so far as the Philosophy of Science is concerned, we tend to favor the English interpretation. We are more ambivalent with respect to the Philosophy of Mathematics.)
    step1: |-
      首先，我们结合著作讨论拉卡托什的生平。拉卡托什的匈牙利经历如今已成为批评文献中的重大议题。这一部分是因为关于拉卡托什早年生活的令人不安的事实直到他死后才在西方曝光，另一部分是因为拉卡托什思想的“匈牙利”解释者与“英国”解释者之间的争论：一批作者（不全是匈牙利人）认为后期的拉卡托什比他自己乐于承认的更接近黑格尔主义者（或许也更接近格奥尔格·卢卡奇的门徒），另一批则认为他的黑格尔主义不过是日益残存的东西，到头来不过是一种与黑格尔式表达“调情”的习惯（Marx, *Capital*: 103）。正如有分析马克思主义者认为马克思的思想可以不经黑格尔式的卖弄而得到理性重建，也有辩证马克思主义者认为不能；同样，有分析拉卡托什主义者认为拉卡托什的思想大体可以不经黑格尔式卖弄而重建，也有辩证拉卡托什主义者认为不能（例如 Kadvany 2001 与 Larvor 1998）[^kadvany-2001][^larvor-1998]。显然，一部百科全书词条无法了结这一争论，但我们希望所说足以照亮问题。（剧透预警：就科学哲学而言，我们倾向于“英国”解释；就数学哲学而言，我们的态度更为两可。）
    step2: |-
      首先，我们把拉卡托什的生平与其著作联系起来讨论。他的匈牙利经历如今已成为批评文献中的重大议题：一部分因为关于他早年生活的那些令人不安的事实，直到他死后才在西方曝光；另一部分因为拉卡托什思想的“匈牙利”解释者与“英国”解释者之间的争论——一批作者（不全是匈牙利人）认为后期的拉卡托什比他自己乐于承认的更接近黑格尔主义者（或许也更接近格奥尔格·卢卡奇的门徒），另一批则认为他的黑格尔主义日益残存，到头来不过是一种与黑格尔式表达“调情”的习惯（Marx, *Capital*: 103）。正如分析马克思主义者认为马克思的思想可以剥去黑格尔式卖弄而得到理性重建、辩证马克思主义者则认为不能；同样，分析拉卡托什主义者认为拉卡托什的思想大体可以剥去黑格尔式卖弄而重建，辩证拉卡托什主义者则认为不能（例如 Kadvany 2001 与 Larvor 1998）[^kadvany-2001][^larvor-1998]。显然，一部百科全书词条无法了结这场争论，但我们希望所说的足以照亮问题。（剧透预警：就科学哲学而言，我们倾向于“英国”解释；就数学哲学而言，我们的态度更为两可。）
