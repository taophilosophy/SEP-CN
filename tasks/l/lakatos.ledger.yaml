      Lakatos moved to Budapest in 1946. He became a graduate student at Budapest University, but spent much of his time working towards the communist takeover of Hungary. This was a slow-motion affair, characterized by the infamous “salami tactics” of the Communist leader Mátyás Rákosi. Lakatos worked chiefly in the Ministry of Education, evaluating the credentials of university teachers and making lists of those who should be dismissed as untrustworthy once the communists had taken over (Bandy 2009: ch. 8)[^bandy-2009]. He was also a student at Eötvös College, but attacked it publicly as an elitist and bourgeois institution. The College, and others like it, was closed in 1950 after the communist takeover. In 1947 Lakatos gained his doctorate from Debrecen University for a thesis entitled “On the Sociology of Concept Formation in the Natural Sciences”. In 1948, after the communist takeover was substantially complete, he gained a scholarship to undertake further study in Moscow.
