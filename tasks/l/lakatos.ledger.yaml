      Imre Lakatos was a warm and witty friend and a charismatic and inspiring teacher ( Feyerabend 1975a)[^feyerabend-1975a]. He was also a fallibilist, and a professed foe of elitism and authoritarianism, taking a dim view of what he described as the Wittgensteinian “thought police” (owing to the Orwellian tendency on the part of some Wittgensteinians to suppress dissent by constricting the language, dismissing the stuff that they did not like as inherently meaningless) (UT: 225 and 228–36). In the later (and British) phase of his career he was a dedicated opponent of Marxism who played a prominent part in opposing the socialist student radicals at the LSE in 1968, arguing passionately against the politicization of scholarship (LTD; Congden 2002)[^congden-2002].
    step1: |-
      伊姆雷·拉卡托什是温暖而机智的朋友，也是有魅力、能激励人的教师（Feyerabend 1975a）[^feyerabend-1975a]。他也是可错论者，公开声言反对精英主义与权威主义，对所谓维特根斯坦式的“思想警察”深恶痛绝（缘于一些维特根斯坦分子有奥威尔式倾向，靠紧缩语言压制异见，把他们不喜欢的材料斥为内在地无意义）（UT: 225 and 228–36）。在其后期（亦即英国）生涯中，他是马克思主义的坚定反对者，1968 年在伦敦政治经济学院与社会主义学生激进派的对抗中扮演了显要角色，热情激辩反对学术的政治化（LTD; Congden 2002）[^congden-2002]。
    step2: |-
      伊姆雷·拉卡托什是温暖机智的朋友，也是富有魅力、鼓舞人心的教师（Feyerabend 1975a）[^feyerabend-1975a]。他还是可错论者，公开以精英主义与权威主义为敌，对所谓维特根斯坦式的“思想警察”深恶痛绝——盖因一些维特根斯坦派有奥威尔式倾向：靠紧缩语言压制异见，把他们不喜欢的材料斥为内在地无意义（UT: 225 and 228–36）。在后期（亦即英国）生涯中，他是马克思主义的坚定反对者，1968 年在伦敦政治经济学院对抗社会主义学生激进派的风潮中扮演显要角色，慷慨陈词反对学术的政治化（LTD; Congden 2002）[^congden-2002]。
  - id: 10
    kind: body
    source: |-
      But in the earlier and Hungarian phase of his life, Lakatos was a Stalinist revolutionary, the leader of a communist cell who persuaded a young comrade that it was her duty to the revolution to commit suicide, since otherwise she was likely to be arrested by the Nazis and coerced into betraying the valuable young cadres who constituted the group (Bandy 2009: ch. 5; Long 1998 and 2002; Congden 1997)[^bandy-2009][^congden-1997][^long-1998][^long-2002]. So far from being a fallibilist, the young Lakatos displayed a cocksure self-confidence in his grasp of the historical situation, enough to exclude any alternative solution to the admittedly appalling problems that this group of young and mostly Jewish communists were facing in Nazi-occupied Hungary. (“Is there no other way?” the young comrade asked. The answer, apparently, was “No”: Long 2002: 267.)[^long-2002] After the Soviet victory, during the late 1940s, he was an eager co-conspirator in the creation of a Stalinist state, in which the denunciation of deviationists was the order of the day (Bandy 2009: ch. 9)[^bandy-2009]. Lakatos was something close to a thought policeman himself, with a powerful job in the Ministry of Education, vetting university teachers for their political reliability (Bandy 2009: ch. 8; Long 2002: 272–3; Congden 1997)[^bandy-2009][^congden-1997][^long-2002]. Later on, after falling afoul of the regime that he had helped to establish and doing time in a gulag at Recsk, he served the ÁVH, the Hungarian secret police, as an informant by keeping tabs on his friends and comrades (Bandy 2009: ch. 14; Long 2002)[^bandy-2009][^long-2002]. And he took a prominent part, as a Stalinist student radical, in trying to purge the University of Debrecen of “reactionary” professors and students and in undermining the prestigious but unduly independent Eötvös College, arguing passionately against the depoliticized (but covertly bourgeois) scholarship that Eötvös allegedly stood for (Bandy 2009: chs. 4 and 9; Long 1998 and 2002)[^bandy-2009][^long-1998][^long-2002].
    step1: |-
      但在更早的匈牙利阶段，拉卡托什是斯大林主义革命者，一个共产主义小组的领导人，他曾说服一位年轻同志：为了革命，自杀是她的义务，否则她很可能被纳粹逮捕、被迫出卖构成该小组的宝贵年轻干部（Bandy 2009: ch. 5; Long 1998 and 2002; Congden 1997）[^bandy-2009][^congden-1997][^long-1998][^long-2002]。年轻的拉卡托什绝非可错论者，他对自身把握历史局势的能力表现出十足的自负，足以排除这批年轻且多为犹太人的共产主义者在纳粹占领的匈牙利所面对的公认骇人的问题之外的一切替代方案。（“就没有别的办法了吗？”年轻同志问。回答显然是“没有”：Long 2002: 267。）[^long-2002] 苏联胜利后的 1940 年代末，他热切参与共谋缔造一个斯大林主义国家，在那里揭发异端分子是时代风尚（Bandy 2009: ch. 9）[^bandy-2009]。拉卡托什本人近乎一个思想警察，他在教育部手握重权，审查大学教师政治上是否可靠（Bandy 2009: ch. 8; Long 2002: 272–3; Congden 1997）[^bandy-2009][^congden-1997][^long-2002]。后来，在得罪了他协助建立的政权并在雷奇克古拉格服刑之后，他又为匈牙利秘密警察 ÁVH 充当线人，盯梢自己的朋友与同志（Bandy 2009: ch. 14; Long 2002）[^bandy-2009][^long-2002]。而作为斯大林主义学生激进派，他还积极投身于把德布勒森大学的“反动”教授与学生清洗出去，并瓦解有声望却过分独立的厄特沃什学院，激烈抨击厄特沃什 allegedly 代表的非政治化（实则隐蔽资产阶级的）学术（Bandy 2009: chs. 4 and 9; Long 1998 and 2002）[^bandy-2009][^long-1998][^long-2002]。
    step2: |-
