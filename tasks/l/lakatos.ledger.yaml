      In Nagyvárad Lakatos restarted his Marxist group. The co-leader was his then-girlfriend and subsequent wife, Éva Révész. In May, the group was joined by Éva Izsák, a 19-year-old Jewish antifascist activist who needed lodgings with a non-Jewish family. Lakatos decided that there was a risk that she would be captured and forced to betray them, hence her duty, both to the group and to the cause, was to commit suicide. A member of the group took her across country to Debrecen and gave her cyanide (Congden 1997, Long 2002, Bandy 2009, ch. 5)[^bandy-2009][^congden-1997][^long-2002]. To lovers of Russian literature, the episode recalls Dostoevsky’s *The Possessed/Demons* (based in part on the real-life Nechaev affair). In Dostoevsky’s novel the anti-Tsarist revolutionary, Pyotr Verkhovensky, posing as the representative of a large revolutionary organization, tries to solidify the provincial cell of which he is the chief by getting the rest of group to share in the murder of a dissident member who supposedly poses a threat to the group. (It does not work for the fictional Pytor Verkhovensky and it did work for the real-life Sergei Nechaev.) Hence the title of Congden’s 1997 exposé: “Possessed: Imre Lakatos’s Road to 1956”. But to communists or former communists of Lakatos’s generation, it recalled a different book: *Chocolate*, by the Bolshevik writer Aleksandr Tarasov-Rodianov. This is a stirring tale of revolutionary self-sacrifice in which the hero is the chief of the local Cheka (the forerunner of the KGB). Popular in Hungary, it encouraged a romantic cult of revolutionary ruthlessness and sacrifice in its (mostly) youthful readers. As one of Lakatos’s contemporaries, György Magosh put it,
