      因此，1947 年的斯大林主义者拉卡托什公开谴责卢卡奇不够斯大林主义，而 1956 年的修正主义者拉卡托什却在含蓄地谴责卢卡奇在方法论上太斯大林主义。对后期拉卡托什而言，“正统马克思主义”的问题主要在于其新颖的事实预言被系统性地证伪了（见下文 §3.2）。但这几乎是伯恩斯坦等早期修正主义者的抱怨（见 Kolakowski 1978: ch. 4）[^kolakowski-1978]，而卢卡奇的布尔什维克著作正是针对那种修正主义的抗议。（见 Lukács 1971 [1923] 与 2014 [1919]。）[^lukács-1971] 虽然对一个研究纲领的事实性“反驳”并不总是决定性的，但在拉卡托什看来，类似卢卡奇那种对事实的冷漠是根本不科学的态度的标志。在我们看来，这就了结了 Ropolyi 的主张——卢卡奇继续对后期拉卡托什有重大影响。
