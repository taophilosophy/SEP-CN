      Lakatos flew to Moscow in January 1949, only to be recalled for “un-Party-like” behaviour in July. What these “un-party-like” activities were is something of a mystery but even more of a mystery is why, having returned from Moscow under a cloud, he seemed so cool, calm and collected. Lakatos’s biographers, Long and Bandy, speculate that he was being held in reserve to prepare a case against the communist education chief, József Révai, who was scheduled to appear in a new show trial. But when Rákosi decided not to prosecute Révai after all, Lakatos was thrown to the wolves (Bandy 2009: ch. 12; Long 2002)[^bandy-2009][^long-2002]. He was arrested in April 1950 on charges of revisionism and, after a period in the cellars of the secret police (including, of course, torture), he was condemned to the prison camp at Recsk.
    step1: |-
      拉卡托什 1949 年 1 月飞抵莫斯科，7 月却因“非党的”行为被召回。这些“非党的”活动究竟是什么有些神秘，而更神秘的是，为何从莫斯科灰头土脸地回来后，他显得那么冷静、沉着、从容。为拉卡托什作传的 Long 与 Bandy 推测：他是被留作后备，准备对共产党教育首脑 József Révai 提起指控——此人预定出现在一场新的作秀审判中。但 Rákosi 最终决定不起诉 Révai，拉卡托什于是被抛给了狼群（Bandy 2009: ch. 12; Long 2002）[^bandy-2009][^long-2002]。1950 年 4 月他以修正主义罪名被捕，在秘密警察的地牢里度过一段时间（自然免不了酷刑），随后被判处关押雷奇克集中营。
