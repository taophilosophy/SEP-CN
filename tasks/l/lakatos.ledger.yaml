      Thus the Stalinist Lakatos of 1947 had explicitly denounced Lukács for not being Stalinist enough, but the revisionist Lakatos of 1956 was implicitly denouncing Lukács for being methodologically too much of a Stalinist. For the later Lakatos, what was wrong with “orthodox Marxism” was chiefly that its novel factual predictions had been systematically falsified (see §3.2 below). But that was pretty much the complaint of early revisionists such as Bernstein (see Kolakowski 1978: ch. 4)[^kolakowski-1978] and it was against that kind of revisionism that Lukács’s Bolshevik writings were a protest. (See Lukács 1971 [1923] and 2014 [1919].)[^lukács-1971] Though factual “refutations” of a research programme are not always decisive, a Lukács-like indifference to the facts is, for Lakatos, the mark of a fundamentally unscientific attitude. In our opinion, this puts paid to Ropolyi’s claim that Lukács continued to be a major influence on the later Lakatos.
