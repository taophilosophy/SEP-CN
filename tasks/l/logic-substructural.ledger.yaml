    source: |-
      The model theory for **ST** is remarkably simple. We evaluate formulas with respect to a *tripartite* evaluation. (This could be understood as a function assigning to each formula one of the values $0$, $i$ and $1$, or equivalently as a *partial* function assigning to each formula either $0$ or $1$, but perhaps failing to assign a value in soem cases.) We evaluate complex formulas using the standard classical truth-conditions, naturally modified to allow for partial valuations: $v(\neg A)=1$ iff $v(A)=0$, and $v(\neg A)=0$ iff $v(A)=1$; $v(A\amp B)=1$ iff $v(A)=1$ and $v(B)=1$, and $v(A\amp B)=0$ iff $v(A)=0$ or $v(B)=0$, and so on. (This is one definition of valuations for Kleene’s strong three-valued logic.) We will say that such a valuation counts as an **ST**-counterexample to a sequent $X\vdash Y$ if and only if it assigns $1$ to every formula in $X$ and $0$ to every formula in $Y$. If we think of the formulas assigned $1$ as *strictly* true (or has assertible when we hold ourselves to strict standards) and those that are not assigned $0$ as *tolerantly* true (or as assertible when we hold ourselves to more tolerant standards), then the valid arguments are those for which whenever the premises are *strictly* true, the conclusion is at least *tolerantly* true. Hence then name, **ST**. Since validity is not preservation of a fixed value (the consequent standards are lower than the antecedent standards), the *Cut* rule can, in general, fail.
    step1: |-
      **ST** 的模型论异常简单。我们按 *三分* 评价来给公式求值。（这可理解为给每个公式指派 $0$、$i$、$1$ 三个值之一的函数，或等价地理解为给每个公式指派 $0$ 或 $1$、但在某些情形下可能不指派的 *部分* 函数。）我们用标准经典真值条件给复杂公式求值，并自然修改以容纳部分赋值：$v(\neg A)=1$ 当且仅当 $v(A)=0$，$v(\neg A)=0$ 当且仅当 $v(A)=1$；$v(A\amp B)=1$ 当且仅当 $v(A)=1$ 且 $v(B)=1$，$v(A\amp B)=0$ 当且仅当 $v(A)=0$ 或 $v(B)=0$，如此等等。（这是 Kleene 强三值逻辑赋值的一种定义。）我们说这样的赋值是矢列 $X\vdash Y$ 的 **ST**-反例，当且仅当它给 $X$ 中每个公式指派 $1$、给 $Y$ 中每个公式指派 $0$。若把被指派 $1$ 的公式看作 *严格* 为真（或以严格标准可断言），把未被指派 $0$ 的公式看作 *宽容* 为真（或以更宽容的标准可断言），则有效论证就是那些前提 *严格* 真时结论至少 *宽容* 真的论证。故名 **ST**。由于有效性并非某个固定值的保持（后件标准低于前件标准），*切* 规则一般可能失效。
    step2: |-
      **ST** 的模型论异常简单：按 **三分** 评价求值。（可理解为给每个公式指派 $0$、$i$、$1$ 之一的函数，或等价地，指派 $0$ 或 $1$、某些情形下可不指派的 **部分** 函数。）复杂公式用标准经典真值条件求值，自然修改以容纳部分赋值：$v(\neg A)=1$ 当且仅当 $v(A)=0$，$v(\neg A)=0$ 当且仅当 $v(A)=1$；$v(A\amp B)=1$ 当且仅当 $v(A)=1$ 且 $v(B)=1$，$v(A\amp B)=0$ 当且仅当 $v(A)=0$ 或 $v(B)=0$，余类推。（这是 Kleene 强三值逻辑赋值的一种定义。）赋值是 $X\vdash Y$ 的 **ST** 反例，当且仅当它给 $X$ 中每式指派 $1$、给 $Y$ 中每式指派 $0$。把得到 $1$ 者看作 **严格** 真（或以严格标准可断言），把未得 $0$ 者看作 **宽容** 真（或以宽容标准可断言），则有效论证就是前提 **严格** 真时结论至少 **宽容** 真的论证。故名 **ST**。有效性并非固定值的保持（后件标准低于前件），**切** 因此一般可能失效。
  - id: 99
    kind: body
    source: |-
      It is not too difficult to see how this substructural logic is an attractive site to consider the semantic paradoxes. Given the liar sentence $\lambda$ the derivation of $\vdash T\lambda$ tells us that the liar is at least tolerantly true. The derivation of $T\lambda\vdash\bot$ tells us that the liar cannot be *strictly* true. It is fixed in the middle, with both it and its negation remaining tolerantly true, but not strictly true.
    step1: |-
      不难看出，这个子结构逻辑是考察语义悖论的有吸引力场所。给定说谎句 $\lambda$，$\vdash T\lambda$ 的推导告诉我们说谎者至少宽容为真；$T\lambda\vdash\bot$ 的推导告诉我们说谎者不可能 *严格* 为真。它被钉在中间：它与它的否定都保持宽容为真，却都不严格为真。
    step2: |-
      不难看出，这个子结构逻辑是考察语义悖论的好去处。给定说谎句 $\lambda$，$\vdash T\lambda$ 的推导说明说谎者至少宽容为真；$T\lambda\vdash\bot$ 的推导说明它不可能 **严格** 为真。它被钉在中间：它与它的否定都宽容为真，都不严格为真。
  - id: 100
    kind: body
    source: |-
      In a similar way, each of the conditional claims in a sorites paradoxical argument of the form $p_n\rightarrow p_{n+1}$ can be taken to be at least *tolerantly* true, since with a sufficiently slow variation between cases, there will never be an instance where $p_n$ is strictly true and $p_{n+1}$ is strictly false.
    step1: |-
      类似地，在形如 $p_n\rightarrow p_{n+1}$ 的堆垛悖论论证中，每个条件句主张都至少可看作 *宽容* 为真：只要相邻情形变化足够慢，就永远不会出现 $p_n$ 严格为真而 $p_{n+1}$ 严格为假的情形。
    step2: |-
      类似地，堆垛悖论中形如 $p_n\rightarrow p_{n+1}$ 的每个条件句主张，都至少可看作 **宽容** 为真：相邻情形变化足够慢，就不会出现 $p_n$ 严格真而 $p_{n+1}$ 严格假的情形。
  - id: 101
    kind: body
    source: |-
      Once the **ST** response to the paradoxes was considered, rejecting the *remaining* structural rule, *identity* was natural to consider. Hence, Fjellstand (2015) and French (2016) have examined the logic of the sequent calculus without *identity*. This, too, has a natural semantics in partial valuations. If we retain *Cut* but discard identity, then the natural logic is **TS**: a sequent $X\vdash Y$ has a **TS**-counterexample when there is a valuation that sends every member of $X$ *away from $0$* (i.e., they are at least tolerantly true) and every member of $Y$ *away from $1$* (i.e., they are not strictly true). A valuation that assigns $p$ neither $0$ nor $1$ is thereby a counterexample to the sequent $p\vdash p$ and so, we have the means to invalidate the rule of identity.
    step1: |-
      一旦考虑了 **ST** 对悖论的回应，拒斥 *剩下* 那条结构规则 *同一性*，便自然也值得考虑。于是 Fjellstand（2015）与 French（2016）考察了不带 *同一性* 的矢列演算的逻辑。它同样在部分赋值中有自然语义。若保留 *切* 而丢弃同一性，自然的逻辑是 **TS**：矢列 $X\vdash Y$ 有 **TS**-反例，当且仅当存在赋值把 $X$ 的每个成员送 *离 $0$*（即至少宽容为真），把 $Y$ 的每个成员送 *离 $1$*（即不严格为真）。把 $p$ 既不指派 $0$ 也不指派 $1$ 的赋值，因此是矢列 $p\vdash p$ 的反例，于是我们有手段使同一性规则失效。
    step2: |-
      **ST** 对悖论的回应一旦提出，拒斥 **剩下** 那条结构规则 **同一性** 也就顺理成章。Fjellstand（2015）与 French（2016）考察了不带 **同一性** 的矢列演算的逻辑，它在部分赋值中同样有自然语义。保留 **切**、丢弃同一性，自然逻辑是 **TS**：$X\vdash Y$ 有 **TS** 反例，当且仅当存在赋值把 $X$ 的每个成员送 **离 $0$**（至少宽容为真），把 $Y$ 的每个成员送 **离 $1$**（不严格为真）。把 $p$ 既不指 $0$ 也不指 $1$ 的赋值，便是 $p\vdash p$ 的反例——于是有手段让同一性失效。
  - id: 102
    kind: body
    source: |-
      These substructural logics: those without cut and identity, raise the question of their nature as *logics* in a way that the first generation of substructural logics did not. **ST** has exactly the same provable sequents in the logical vocabulary as classical logic, and **TS** has none. Is **ST** identical to classical logic? Is **TS** identical to any other logic with no derivable sequents? To flatly answer “yes” to these questions would be to miss the distinctive behaviour of these logical systems. **ST** differs from classical logic not at the level of *sequents* but at the level of the relations between sequents. The *Cut* rule, which can be understood as an inference rule relating sequents, is valid under any class of two-valued valuations, but is invalid in **ST**. Similarly, although at the level of sequents the logic **TS** is empty, at the level of relationships between sequents, it is rich. From this observation has arisen the recent study of *meta-inferences* (see Barrio *et al* 2014, and Barrio *et al* 2019)[^barrio-2014][^barrio-2019]. Reflection on the natural way to understand meta-inferences between sequents in logics like **ST** and **TS** which use two different distinguished values has raised a natural question. If we have two different grades of validity (strict and tolerant) at the level of an individual formula, then why restrict ourselves to a single validity verdict when it comes to a sequent? In fact, two natural grades of validity for (level 2) meta-inferences are available to us. A **ST** validity is a much more tolerant criterion than **TS** validity. We can say that a sequent-to-sequent meta-inference is **TS/ST** valid if whenever the premise sequents are **TS** valid, then the conclusion sequent is **ST** valid. It turns out, then, that the meta-inference of *Cut* is indeed **TS/ST** meta-valid, and the **TS/ST** valid meta-inferences are exactly the family of meta-inferences traditionally valid in classical logic, and this result naturally generalises up the hierarchy of *n*-level meta-inferences for all *n* (Barrio *et al* 2019)[^barrio-2019].
    step1: |-
      这些子结构逻辑——无切与无同一性者——以第一代子结构逻辑没有的方式提出了它们是何种 *逻辑* 的问题。**ST** 在逻辑词汇中可证矢列与经典逻辑完全相同，**TS** 则一个也没有。**ST** 等同于经典逻辑吗？**TS** 等同于任何无可导出矢列的逻辑吗？径直答“是”就会错过这些逻辑系统的独特行为。**ST** 与经典逻辑的差别不在 *矢列* 层面，而在矢列之间关系的层面。*切* 规则可理解为关联矢列的推理规则，它在任何二值赋值类下有效，但在 **ST** 中无效。类似地，**TS** 在矢列层面虽空，在矢列间关系层面却丰富。由此观察生出了晚近的 *元推理* 研究（见 Barrio *et al* 2014、Barrio *et al* 2019）[^barrio-2014][^barrio-2019]。反思如何自然理解使用两个不同特出值的 **ST**、**TS** 这类逻辑中矢列间的元推理，引出一个自然问题：若在单个公式层面有两种不同等级的有效性（严格与宽容），那么到了矢列层面，何必只限于单一的有效性裁决？其实，对（第 2 层）元推理，我们有两种自然的有效性等级：**ST** 有效性是比 **TS** 有效性宽容得多的判据。我们可以说，矢列对矢列的元推理是 **TS/ST** 有效的，当且仅当前提矢列 **TS** 有效时结论矢列 **ST** 有效。于是就发现：*切* 这条元推理确实是 **TS/ST** 元有效的，而 **TS/ST** 有效的元推理恰好就是传统上在经典逻辑中有效的那族元推理；这一结果自然推广到所有 *n* 的 *n*-层元推理层级（Barrio *et al* 2019）[^barrio-2019]。
    step2: |-
      这两族逻辑——无切与无同一性者——以第一代子结构逻辑没有的方式追问：它们算何种 **逻辑**？**ST** 的可证矢列在逻辑词汇上与经典逻辑完全相同，**TS** 则一条也没有。**ST** 等于经典逻辑吗？**TS** 等于某个无可导出矢列的逻辑吗？径直答“是”就错过了它们的独特行为：**ST** 与经典逻辑的差别不在 **矢列** 层面，而在矢列间关系层面。**切** 可看作关联矢列的推理规则，在任何二值赋值类下有效，在 **ST** 中却无效。**TS** 在矢列层面虽空，在矢列间关系层面却丰富。由此生出晚近的 **元推理** 研究（见 Barrio *et al* 2014、2019）[^barrio-2014][^barrio-2019]。反思 **ST**、**TS** 这类用两个特出值的逻辑中矢列间元推理的自然理解，引出一个问题：单个公式层面既然已有严格与宽容两种有效性等级，到矢列层面何必只给一个裁决？其实（第 2 层）元推理也有两种自然等级：**ST** 有效性比 **TS** 宽容得多。可说矢列对矢列的元推理 **TS/ST** 有效，当且仅当前提矢列 **TS** 有效时结论矢列 **ST** 有效。于是 **切** 这条元推理确实 **TS/ST** 元有效；**TS/ST** 有效的元推理恰是经典逻辑传统上有效的那族元推理，且此结果自然推广到一切 *n* 的 *n*-层元推理（Barrio *et al* 2019）[^barrio-2019]。
  - id: 103
    kind: body
    source: |-
      The connection between the cut-free sequent calculus and three-valued logics has a long history, pre-dating its incorporation into recent work on substructural logics. Schütte (1960) used a non-deterministic three-valued semantics for the cut-free classical sequent calculus, and this work was extensively used by Girard (1987b, Chapter 3), in his analysis of the semantics of the cut-free sequent caclulus. The application of three-valued methods to the classical sequent calculus in the absence of the structural rule of *identity* was also considered in Hösli and Jäger (1994). This work has application to understanding phenomena in logic programming (Jäger, 1993).
    step1: |-
      无切矢列演算与三值逻辑的联系历史悠久，早于它被纳入晚近的子结构逻辑工作。Schütte（1960）为无切经典矢列演算使用了非确定的三值语义，Girard（1987b 第 3 章）在分析无切矢列演算语义时大量使用了这一工作。Hösli 与 Jäger（1994）也考察了三值方法在缺少 *同一性* 结构规则的经典矢列演算上的应用。这一工作对理解逻辑编程中的现象有应用（Jäger, 1993）。
    step2: |-
      无切矢列演算与三值逻辑的联系由来已久，早于晚近子结构逻辑工作。Schütte（1960）为无切经典矢列演算用了非确定三值语义，Girard（1987b 第 3 章）分析无切演算语义时大量取用；Hösli 与 Jäger（1994）也考察了三值方法在缺 **同一性** 的经典矢列演算上的应用，并用于理解逻辑编程中的现象（Jäger, 1993）。
