      前面提到的严格/宽容有效性的无切逻辑 **ST**，是与实质推理逻辑、缺省推理逻辑或 Tennant 核心逻辑都很不同的一类无切逻辑。首先，在有效矢列层面，它 *就是* 经典逻辑：它由不带 *切* 规则的 Gentzen 矢列演算给出，而如 Gentzen（1935）所示，*切* 规则可消除。
