      Logics without the *Cut* rule have non-transitive consequence relations. In the philosophical literature, there are a number of different reasons cited for rejecting transitivity of consequence in general. One reason is to focus on *material* consequence (see Brandom 2000)[^brandom-2000] or *default* consequence (see Reiter 1980, and the entry on *Non-Monotonic Logic*)[^reiter-1980] rather than necessary and formale consequence. (From Tweety being a bird, the default inference that Tweety flies is appropriate. And, from Tweety being a penguin, we can infer that Tweety is a bird. However, it is in appropriate to cut out the middle step and to infer that Tweety flies from the premise that Tweety is a penguin.)
    step1: |-
      无 *切* 规则的逻辑具有非传递后承关系。哲学文献中列举了若干拒斥后承传递性的理由。理由之一是把焦点放在 *实质* 后承（见 Brandom 2000）[^brandom-2000] 或 *缺省* 后承（见 Reiter 1980 及 *非单调逻辑* 条目）[^reiter-1980]，而非必然的、形式的后承。（由 Tweety 是鸟，缺省地推断 Tweety 会飞是恰当的；由 Tweety 是企鹅，可推断 Tweety 是鸟。然而，切掉中间步骤、从前提出发推断 Tweety 会飞并不恰当。）
    step2: |-
      无 **切** 的逻辑，后承关系不传递。哲学文献举了几条理由。其一，把焦点放在 **实质** 后承（见 Brandom 2000）[^brandom-2000] 或 **缺省** 后承（见 Reiter 1980 及 **非单调逻辑** 条目）[^reiter-1980]，而非必然的、形式的后承。（Tweety 是鸟，缺省推断它会飞是恰当的；它若是企鹅，可推断它是鸟。但切掉中间一步、径直推断它会飞并不恰当。）
