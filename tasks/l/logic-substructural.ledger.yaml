    source: |-
      In recent years, a great deal of work has been done on the proof theory of *classical logic*, inspired and informed by research into substructural logics. Classical logic has the full complement of structural rules, and is historically prior to more recent systems of substructural logics. However, when it comes to attempting to understand the deep structure of *classical* proof systems (and in particular, when two derivations that differ in some superficial syntactic way are *really* different ways to represent the one underlying ‘proof’) it is enlightening to think of classical logic as formed by a basic substructural logic, in which extra structural rules are imposed as additions. In particular, it has become clear that what distinguishes classical proof from its siblings is the presence of the structural rules of contraction and weakening in their complete generality (see, for example, Bellin *et al.* 2006 and the literature cited therein)[^bellin-2006].
    step1: |-
      近年来，受子结构逻辑研究启发与滋养，围绕 *经典逻辑* 证明论的工作大量涌现。经典逻辑拥有全套结构规则，历史上先于较新的子结构逻辑系统。然而，当试图理解 *经典* 证明系统的深层结构时（特别是，当两种只在表层句法上不同的推导 *真正* 是同一底层“证明”的不同表示时），把经典逻辑想成由一个基本子结构逻辑加上额外结构规则构成，颇有启发。特别是，如今已清楚：使经典证明区别于其同类的，正是收缩与弱化这两条结构规则以其完全一般性的在场（例如见 Bellin *et al.* 2006 及其所引文献）[^bellin-2006]。
    step2: |-
      近年受子结构逻辑研究启发，围绕 **经典逻辑** 证明论的工作大量涌现。经典逻辑有全套结构规则，历史上先于子结构逻辑。但要理解 **经典** 证明系统的深层结构，不妨把经典逻辑想成一个基本子结构逻辑，再外加额外结构规则；如此看颇有启发。特别是，两种仅在表层句法上不同的推导，可能实为同一底层“证明”的两种表示。已清楚的是：经典证明之所以区别于同族，正在于收缩与弱化以其完全一般性在场（例如见 Bellin *et al.* 2006 及其文献）[^bellin-2006]。
