  - id: 78
    kind: body
    source: |-
      $A \rightarrow B$ is true at $x$ if and only if for each $y$ and $z$ where $Rxyz$, if $A$ is true at $y, B$ is true at $z$.
    step1: |-
      $A \rightarrow B$ 在 $x$ 为真，当且仅当对每个满足 $Rxyz$ 的 $y$ 与 $z$，若 $A$ 在 $y$ 为真，则 $B$ 在 $z$ 为真。
    step2: |-
      $A \rightarrow B$ 在 $x$ 为真，当且仅当对每个满足 $Rxyz$ 的 $y,z$：$A$ 在 $y$ 真则 $B$ 在 $z$ 真。
  - id: 79
