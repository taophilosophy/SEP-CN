    source: |-
      For the left-to-right arrow we have *modus ponens* in this direction:

      $$ p \rightarrow q, p \vdash q $$
    step1: |-
      对左到右箭头，我们有这个方向的肯定前件：

      $$ p \rightarrow q, p \vdash q $$
    step2: |-
      对左到右箭头，这个方向的肯定前件成立：

      $$ p \rightarrow q, p \vdash q $$
