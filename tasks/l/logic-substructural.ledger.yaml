      Gentzen’s pioneering work on the sequent calculus (Gentzen 1935)[^gentzen-1935] shows that the difference between *classical* logic and *intuitionistic* logic can also be understood as a difference not of the behaviour of one logical connective or another—whether negation, disjunction or the conditional—but as a matter of the ambient structure of sequents in which those connectives are defined, and the structural rules satisfied in that setting. Gentzen’s sequent calculus *LJ* for intuitionistic logic is formulated in terms of sequents of the form $X \vdash A$, in which we have a collection of antecedents and a single consequent. These are the kinds of sequents we have focussed on so far. Gentzen’s *LK* calculus for classical logic formulates sequents in a more general form

      $$ X \vdash Y $$
    step1: |-
      Gentzen 关于矢列演算的开创性工作（Gentzen 1935）[^gentzen-1935] 表明，*经典* 逻辑与 *直觉主义* 逻辑的差别，也可理解为：它不在于某个逻辑联结词（无论否定、析取还是条件句）的行为，而在于定义这些联结词所用矢列的环境结构，以及该环境中满足的结构规则。Gentzen 为直觉主义逻辑建立的矢列演算 *LJ*，用形如 $X \vdash A$ 的矢列表述：一簇前件，单个后件。这就是我们迄今关注的那类矢列。Gentzen 为经典逻辑建立的 *LK* 演算，则用更一般的形式表述矢列：

      $$ X \vdash Y $$
    step2: |-
      Gentzen 的矢列演算开创性工作（Gentzen 1935）[^gentzen-1935] 表明：**经典** 与 **直觉主义** 逻辑之别，未必在于某个联结词（否定、析取、条件句）的行为。它也可以在于定义这些联结词的矢列环境结构，以及该环境满足的结构规则。Gentzen 的直觉主义矢列演算 *LJ* 用形如 $X \vdash A$ 的矢列：一簇前件、单个后件——正是我们迄今关注的矢列。其经典演算 *LK* 则用更一般的形式：

      $$ X \vdash Y $$
