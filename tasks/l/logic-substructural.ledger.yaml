      For the right-to-left arrow, *modus ponens* is provable with the premises in the opposite order:

      $$ p, q \leftarrow p \vdash q $$
    step1: |-
      对右到左箭头，肯定前件在前提次序相反时可证：

      $$ p, q \leftarrow p \vdash q $$
    step2: |-
      对右到左箭头，肯定前件在前提次序相反时可证：

      $$ p, q \leftarrow p \vdash q $$
