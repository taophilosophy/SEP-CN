      Independently of either of these traditions, Joachim Lambek considered mathematical models of language and syntax (Lambek 1958, 1961)[^lambek-1958]. The idea here is that premise combination corresponds to composition of strings or other linguistic units. Here $X,X$ differs in content from $X$, but in addition, $X,Y$ differs from $Y,X$ Not only does the *number* of premises used count but so does their *order*. Good introductions to the Lambek calculus (also called *categorial grammar*) can be found in books by Moortgat (1988) Morrill (1994), and Moot and Retoré (2012).
    step1: |-
      独立于上述两个传统，Joachim Lambek 考虑了语言与句法的数学模型（Lambek 1958, 1961）[^lambek-1958]。这里的想法是：前提结合对应于字符串或其他语言单位的组合。这里 $X,X$ 的内容不同于 $X$；此外 $X,Y$ 也不同于 $Y,X$。不仅所用前提的 *数目* 要紧，其 *次序* 也要紧。Lambek 演算（亦称 *范畴语法*）的良好导论见 Moortgat（1988）、Morrill（1994）以及 Moot 与 Retoré（2012）的著作。
    step2: |-
      独立于上述两个传统，Joachim Lambek 考察了语言与句法的数学模型（Lambek 1958, 1961）[^lambek-1958]：前提结合对应于字符串或其他语言单位的组合。这里 $X,X$ 的内容不同于 $X$，$X,Y$ 也不同于 $Y,X$——不但所用前提的 **数目** 要紧，**次序** 也要紧。Lambek 演算（也称 **范畴语法**）的良好导论见 Moortgat（1988）、Morrill（1994）、Moot 与 Retoré（2012）。
