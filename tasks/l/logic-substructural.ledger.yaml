    source: |-
      This is not the only way to restrict premise combination. Girard (1987) introduced *linear logic* as a model for processes and resource use. The idea in this account of deduction is that resources must be used (so premise combination satisfies the relevance criterion) and they do not extend *indefinitely*. Premises cannot be *re*-used. So, I might have $X,X \vdash A$, which says that I can use $X$ twice to get $A$. I might not have $X \vdash A$, which says that I can use $X$ once alone to get $A$. A helpful introduction to linear logic is given in Troelstra’s *Lectures on Linear Logic* (1992).
    step1: |-
      限制前提结合并非只有这一条路。Girard（1987）引入 *线性逻辑* 作为过程与资源使用的模型。这种演绎观的想法是：资源必须被使用（故前提结合满足相干性判据），且资源不会 *无限* 延伸。前提不可 *重复* 使用。于是我可以有 $X,X \vdash A$，说的是我能用 $X$ 两次得到 $A$；我可能没有 $X \vdash A$，说的是我不能单用 $X$ 一次得到 $A$。线性逻辑的有益导论见 Troelstra 的 *Lectures on Linear Logic*（1992）。
    step2: |-
      限制前提结合不止这一条路。Girard（1987）引入 **线性逻辑**，作为过程与资源使用的模型。其演绎观的想法是：资源必须被使用（前提结合满足相干性判据），且不会 **无限** 延伸，前提不可 **重复** 使用。于是可以有 $X,X \vdash A$（用 $X$ 两次得 $A$），却未必有 $X \vdash A$（单用 $X$ 一次得 $A$）。有益导论见 Troelstra *Lectures on Linear Logic*（1992）。
  - id: 58
    kind: body
    source: |-
      There are other formal logics in which the *contraction rule* (from $X,X \vdash A$ to $X \vdash A)$ is absent. Most famous among these are Łukasiewicz’s many-valued logics. There has been a sustained interest in logics without contraction because it has been noticed that the contraction rule features in paradoxical derivations such as the liar paradox, Curry’s paradox, and other semantic paradoxes (Curry 1977, Geach 1955; see also Field 2008, Restall 1994 and Zardini 2021)[^zardini-2021][^curry-1977][^field-2008][^geach-1955].
    step1: |-
      还有其他形式逻辑缺少 *收缩规则*（从 $X,X \vdash A$ 到 $X \vdash A$）。其中最著名的是 Łukasiewicz 的多值逻辑。无收缩逻辑一直受到持续关注，因为人们注意到收缩规则出现在说谎者悖论、Curry 悖论等语义悖论的悖论性推导中（Curry 1977, Geach 1955；另见 Field 2008、Restall 1994、Zardini 2021）[^zardini-2021][^curry-1977][^field-2008][^geach-1955]。
    step2: |-
      还有别的形式逻辑缺 **收缩规则**（从 $X,X \vdash A$ 到 $X \vdash A$），最著名的是 Łukasiewicz 多值逻辑。无收缩逻辑一直有人关注，因为收缩规则出现在说谎者悖论、Curry 悖论等语义悖论的推导里（Curry 1977, Geach 1955；另见 Field 2008、Restall 1994、Zardini 2021）[^zardini-2021][^curry-1977][^field-2008][^geach-1955]。
