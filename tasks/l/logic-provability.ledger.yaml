      An intriguing new proof-theoretical development is Shamkanov’s expansion of sequent-style proof systems by allowing *circular proofs* (Shamkanov 2014)[^shamkanov-2014]. Consider a sequent system for K4, the modal system resulting from GL by replacing the axiom GL by the weaker axiom $\Box A \rightarrow \Box\Box A$ (axiom 4). However, suppose that open hypotheses are allowed, provided that the same sequent occurs strictly below that hypothesis in the proof tree. Formulated more technically, one can find a circular derivation from an ordinary derivation tree by linking each of its non-axiomatic leaves with an identical interior node. Shamkanov (2014) proved that the resulting system is consistent and that moreover, in general, each sequent has a GL-derivation if and only if it has a circular K4-derivation. Circular proofs also provide a method to show proof-theoretically that Lyndon’s interpolation theorem holds for GL (Shamkanov 2011)[^shamkanov-2011]. Standard interpolation for GL had already been proved before by different methods (Boolos 1979; Smoryński 1978; Rautenberg 1983)[^boolos-1979][^rautenberg-1983][^smoryński-1978] and so had uniform interpolation (Shavrukov 1993b, Bílková 2016, Férée et al. [Other Internet Resources])[^bílková-2016][^shavrukov-1993b]. (For more information about Lyndon’s interpolation theorem for first-order logic, see also the entry first-order model theory ).
    step1: |-
      一个引人入胜的证明论新进展是 Shamkanov 对相继式式证明系统的扩充——允许*循环证明*（Shamkanov 2014）[^shamkanov-2014]。考虑 K4 的一个相继式系统：K4 是把 GL 的公理换成较弱的公理 $\Box A \rightarrow \Box\Box A$（公理 4）所得的模态系统。但假设允许开放假设，只要同一相继式在证明树中严格低于该假设处出现。更技术性地说：把普通推导树中每个非公理叶子与一个相同的内部节点相连，即可得到循环推导。Shamkanov（2014）证明所得系统一致，而且一般地，每个相继式有 GL 推导当且仅当它有循环 K4 推导。循环证明也提供一种方法，证明式地表明 Lyndon 插值定理对 GL 成立（Shamkanov 2011）[^shamkanov-2011]。GL 的标准插值此前已用不同方法证明（Boolos 1979; Smoryński 1978; Rautenberg 1983）[^boolos-1979][^rautenberg-1983][^smoryński-1978]，一致插值亦然（Shavrukov 1993b, Bílková 2016, Férée et al. [Other Internet Resources]）[^bílková-2016][^shavrukov-1993b]。（关于一阶逻辑的 Lyndon 插值定理的更多信息，另见一阶模型理论词条。）
