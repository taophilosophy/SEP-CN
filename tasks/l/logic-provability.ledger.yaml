      至于可证性逻辑的*证明论*，Valentini（1983）证明 GL 的一个标准相继式演算表述服从*切割消除*——粗略地说，即每个在相继式演算中从 GL 可证的公式都有一个“无绕行”的 GL 相继式证明（切割消除的精确解释见证明论之发展词条）。近年，GL 的证明论重新受到关注，例如 Goré 与 Ramanayake（2008, 2012）以及 Goré、Ramanayake 与 Shillito（2021）。切割消除为 GL带来理想的*子公式性质*：无切割证明中出现的所有公式都是末端相继式公式的子公式。
