  - id: 133
    kind: note
    source: |-
      [^note-3]: Holliday and Litak (2019) strengthened this result by showing that GLB is not only Kripke frame incomplete, but even incomplete with respect to Boolean algebras for which the $\Diamond$ operator is *completely additive*, that is, for any set $X$ of elements, if $\bigvee X$ exists, then $\bigvee\{\Diamond x \mid x \in X \}$ also exists and $\Diamond\bigvee X = \bigvee\{\Diamond x \mid x \in X \}$. One of the nice aspects of their result is that the bimodal provability logic GLB is the first naturally occurring modal logic that shows such incompleteness with respect to completely additive Boolean algebras. Note that the logic that Van Benthem (1979) originally used to show the existence of a modally incomplete logic was also a (slightly artificial) variation on provability logic, namely, $K$ with the extra axiom $\Box\Diamond\top\rightarrow \Box(\Box(\Box p \rightarrow p) \rightarrow p)$, a weakening of GL.
