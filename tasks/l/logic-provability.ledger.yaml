      若对此作算术解读，从左到右的方向正是哥德尔第二不完备性定理的形式化版本：若像皮亚诺算术这样足够强的形式理论 $T$ 不证明矛盾，则在 $T$ 中不可证“$T$ 不证明矛盾”。因此，足够强的一致算术理论无法证明自身的一致性。我们将在第 4 节更精确地考察可证性逻辑与算术的关系，但为此需先给出 GL 的另一个“模态”面向：语义学。
