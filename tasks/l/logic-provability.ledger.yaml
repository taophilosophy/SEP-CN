      Left out in the above discussion are many other important strands of research in provability logic and its extensions. The interested reader is pointed to the following areas:
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      - the provability logic of intuitionistic arithmetic (see Troelstra 1973; Visser 1982, 1999, 2002, 2008; Iemhoff 2000, 2001, 2003; Ardeshir and Mojtahedi 2018; Litak and Visser 2018, forthcoming; Mojtahedi 2022 [Other Internet Resources]; Visser and Zoethout 2021; van der Giessen and Iemhoff 2021; van der Giessen 2023; Shillito 2023)[^shillito-2023][^ardeshir-2018][^giessen-2023][^giessen-2021][^iemhoff-2000][^litak-2018][^troelstra-1973][^visser-1982];
      - classification of provability logics (see Visser 1980, Artemov 1985b, Beklemishev 1989, Beklemishev et al. 1999)[^artemov-1985b][^beklemishev-1989][^beklemishev-1999][^beklemishev-1999-2][^visser-1980];
      - Rosser orderings and proof speed-up (see Guaspari and Solovay 1979, Švejdar 1983, Montagna 1992)[^guaspari-1979][^montagna-1992];
      - several kinds of bimodal provability logics with provability operators for different theories (see Carlson 1986; Smoryński 1985; Beklemishev 1994, 1996; Visser 1995)[^smoryński-1985][^beklemishev-1994][^carlson-1986][^visser-1995];
      - provability logics for standard provability combined with unusual provability predicates externally enumerating PA, such as Feferman’s and Parikh’s provability predicates and slow provability predicates (see Feferman 1960; Parikh 1971; Montagna 1978; Visser 1989; Carbone and Montagna 1990; Shavrukov 1994; Lindström 1994, 2006; Henk and Pakhomov 2016 (Other Internet Resources));
      - analysis of Gödel’s second incompleteness theorem using provability and interpretability logics (Visser 2016; 2020)[^visser-2016];
      - the logic of explicit proofs (see Artemov 1994, 2001; Artemov and Montagna 1994; Yavorskaya 2001; Artemov and Iemhoff 2007; Kuznets and Studer 2019)[^artemov-1994][^artemov-2007][^artemov-1994-2][^kuznets-2019][^yavorskaya-2001];
      - correspondence between provability logic and justification logics (see Artemov and Nogina 2005; Shamkanov 2016 (Other Internet Resources); Fitting 2020);
      - relevant provability logic based on the relevance logic R (see Mares 2000)[^mares-2000];
      - applications of provability logic in proof theory (see Beklemishev 1999, 2003, 2004, 2005, 2006)[^beklemishev-1999][^beklemishev-1999-2];
      - proof theory of propositional modal logics closely related to the provability logic GL, namely, Grzegorczyk logic (Grz) and weak Grezgorczyk logic (wGrz) (see Litak 2007; Maksimova 2014; Goré and Ramanayake 2014; Dyckhoff and Negri 2016; Savateev and Shamkanov 2019, 2021)[^dyckhoff-2016][^goré-2014][^litak-2007][^maksimova-2014][^savateev-2019];
      - positive provability logics and reflection calculus (see Beklemishev 2012, 2014, 2018a, 2018b; Dashkov 2012)[^beklemishev-2012][^dashkov-2012];
      - generalizations of the polymodal provability logic GLP, namely provability logics with transfinitely many modalities (see Beklemishev et al. 2014; Fernández-Duque and Joosten 2013a, 2013b, 2014, 2018; Joosten 2021; Beklemishev and Pakhomov 2022)[^beklemishev-2014][^beklemishev-2014-2][^beklemishev-2014-3][^beklemishev-2022][^fernández-duque-2013a][^joosten-2021];
      - relations between provability logic and the $\mu$-calculus (see van Benthem 2006, Visser 2005, Alberucci and Facchini 2009)[^alberucci-2009][^benthem-2006][^visser-2005]; and
      - provability algebras, also called diagonalizable algebras or Magari algebras (see Magari 1975a, 1975b; Montagna 1979, 1980a, 1980b; Bernardi and D’Aquino 1988; Shavrukov 1993a, 1993b, 1997; Zambella 1994; for recent results on their elementary theories, see Pakhomov 2012, 2014a (Other Internet Resources), 2015.
