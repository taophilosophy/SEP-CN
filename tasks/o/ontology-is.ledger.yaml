    source: |-
      Large Language Models (Jurafsky & Martin 2000)[^jurafsky-2000] are a model of language but not of the world (Bender, Gebru, McMillan-Major, & Shmitchell 2021). When LLMs generate text that is clearly at odds with what humans know about the world it has been called (rather anthropomorphically) “hallucination”. One method that has been proposed to address this issue is to combine LLMs and logical reasoning in a *neuro-symbolic* approach (Hitzler & Sarker 2021)[^hitzler-2021]. LLMs may be trained on symbolically-expressed knowledge (Chattopadhyay, Dandekar, & Roy 2025), and symbolic knowledge may be used in prompts (Lewis et al. 2020)[^lewis-2020]. LLMs may also be used to align terminological ontologies (Hertling & Paulheim 2023)[^hertling-2023].
    step1: |-
      大语言模型（Jurafsky & Martin 2000）[^jurafsky-2000]是语言的模型，而非世界的模型（Bender, Gebru, McMillan-Major, & Shmitchell 2021）。当大语言模型生成的文本明显与人类对世界的认识相悖时，人们（颇带拟人色彩地）称之为“幻觉”。为应对这一问题，一种被提出的方法是以 *神经—符号* 进路把大语言模型与逻辑推理结合起来（Hitzler & Sarker 2021）[^hitzler-2021]。大语言模型可以用符号表述的知识来训练（Chattopadhyay, Dandekar, & Roy 2025），符号知识也可以用于提示词（Lewis et al. 2020）[^lewis-2020]。大语言模型还可用于对齐术语本体论（Hertling & Paulheim 2023）[^hertling-2023]。
    step2: |-
      大语言模型（Jurafsky & Martin 2000）[^jurafsky-2000]是语言的模型，不是世界的模型（Bender, Gebru, McMillan-Major, & Shmitchell 2021）。大语言模型生成的文本明显违背人类对世界的认识时，人们颇带拟人色彩地称之为“幻觉”。对此提出的一条对策，是用 *神经—符号* 进路把大语言模型与逻辑推理结合起来（Hitzler & Sarker 2021）[^hitzler-2021]：既可用符号表述的知识训练大语言模型（Chattopadhyay, Dandekar, & Roy 2025），也可把符号知识写进提示词（Lewis et al. 2020）[^lewis-2020]。大语言模型还能用来对齐术语本体（Hertling & Paulheim 2023）[^hertling-2023]。
