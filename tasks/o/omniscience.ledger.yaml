      According to this objection, then, some propositions change their truth values over time, and a being who knows all true propositions accordingly changes beliefs. So, if God is omniscient, he is not immutable (Kretzmann’s formulation) or eternal (Wolterstorff 1975)[^wolterstorff-1975] or timeless (Davis 1983)[^davis-1983]. Variations on this objection have also been given by Kenny (1979), Prior (1962), and Grim (1985). Philosophers who have objected to the argument include Castañeda (1967), Kretzmann himself subsequently in Stump and Kretzmann (1981), Kvanvig (1986), Pike (1970), Swinburne (1993, but not 2016), and Wierenga (1989, 2002).
    step1: |-
      按照这一反对意见，一些命题会随时间改变真值，而知道一切真命题的存在也随之改变信念。所以，如果上帝是全知的，他就不是不变的（克雷茨曼的表述）、不是永恒的（Wolterstorff 1975）[^wolterstorff-1975]或无时间的（Davis 1983）[^davis-1983]。这一反对意见的种种变体也由肯尼（1979）、普赖尔（1962）与格里姆（1985）给出。反对该论证的哲学家包括卡斯塔涅达（1967）、克雷茨曼本人（其后来的立场见 Stump and Kretzmann 1981）、克万维格（1986）、派克（1970）、斯温伯恩（1993，但 2016 不是）以及 Wierenga（1989, 2002）。
    step2: |-
      按这一反对意见，一些命题随时间改变真值，而知道一切真命题的存在者也随之改变其信念。于是，上帝若是全知的，就不是不变的（Kretzmann 的表述）、不是永恒的（Wolterstorff 1975）[^wolterstorff-1975]，也不是无时间的（Davis 1983）[^davis-1983]。肯尼（1979）、普赖尔（1962）与格里姆（1985）给出过这一反对意见的种种变体。反对该论证的哲学家则包括卡斯塔涅达（1967）、Kretzmann 本人（后来与 Stump 合著，见 Stump and Kretzmann 1981）、克万维格（1986）、派克（1970）、斯温伯恩（1993，但 2016 年的著作不然）以及 Wierenga（1989, 2002）。
