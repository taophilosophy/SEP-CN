      A second kind of reply is available, one that does not appeal to a special kind of grasping or an exotic type of proposition. Rather, it takes its cue from recent work on indexicals, according to which some propositions are *perspectival*, that is, true at some perspectives or indices and false at others. On this view, the proposition, *I am in the hospital*, which Jones believed at $t$ when he was then in the hospital is true at the index of $\langle\textrm{Jones}, t\rangle$ but false at many other indices, such as $\langle\textrm{Smith}, t\rangle$ or $\langle\textrm{Jones}, t + \textrm{one month}\rangle$. Anyone can believe the eternal truth that this perspectival proposition is true at $\langle \textrm{Jones}, t\rangle$, but only Jones is able to believe the perspectival proposition *at* $\langle\textrm{Jones}, t\rangle$. More generally, one can believe perspectival propositions only at the perspectives or indices one is at. Wierenga (2002: 155) suggests that if something like this is the correct account of first-person and present-time beliefs, then the definition of omniscience, (D1) above, should be replaced with
