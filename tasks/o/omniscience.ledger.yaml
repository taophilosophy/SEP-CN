      In recent years perhaps the most widely accepted response to the argument is to accept it but to deny that omniscience extends to knowledge of the future. Geach (1977) held that apart from “present trends and tendencies” there is no future to be known. Swinburne (1993 and 2016) holds that omniscience does not include foreknowledge of future free actions. Hoffman and Rosenkrantz (2002) give a careful account of omniscience, intentionally limiting God’s foreknowledge to truths that are “causally inevitable”, where causally inevitable events are not free actions. Indeed a recent movement within philosophy of religion, so-called Open Theism, has been developed with the explicit aim of leaving the future “open”, and thus unknown to God, precisely so as to leave room for human freedom. Hasker (1989, 2004) has been a leading figure in this group, as have been the contributors to Pinnock (1994). In a similar vein, Mawson recommends that theists who think that God is in time should say “that God suspends judgment on everything that will actually happen in the future.” Instead, on this view omniscience extends to the future only in knowledge of “the probabilities of particular futures developing” (Mawson 2019: 38–39)[^mawson-2019]. A view according to which God has at least some knowledge of the future that goes beyond Geach’s “present trends” and Hoffman and Rosenkrantz’s “causally inevitable” has been defended by Fischer (2016: 26ff.; 2022, 67ff; see Iwanicki and Karczewska 2024 for criticism)[^iwanicki-2024]. According to Fischer, *we* have true beliefs about the future, for example, what our friends will do tomorrow, and such beliefs can be formed when we are in a “knowledge-conferring situation” (roughly, what is added to justification to avoid the Gettier Problem). But God can form those kinds of beliefs, too. Furthermore, since God is omniscient and knows that he is, he knows when he has such a belief, he knows that it is true, and has evidence, namely, his omniscience, entailing that it is true (2022, 67). In this way God can even “bootstrap” his way to certainty. We saw at the outset of this essay that one of the motivations for attributing omniscience to God is to be able to develop a doctrine of divine providence. Nevertheless those who deny that God’s knowledge extends to future free actions, or extends only in a limited way, will have the difficult task of stating or accepting a doctrine of providence, if God does not know what free agents will do.
