    kind: body
    source: |-
      Several recent discussions of omniscience have attempted to defend a more restricted account than offered by the preceding definitions. For example, Langtry (2008: 39) suggests that God is omniscient just in case, for every true proposition *p*, “either God knows that *p*, or else he does not but his knowing that *p* is not precluded by any defect or limitation in his intrinsic cognitive capacities.” Nagasawa (2017) claims that a stronger version of perfect being theology would hold that God has a “maximally consistent set” of the divine attributes of knowledge, power, and benevolence. This would allow that a perfect being could be omniscient without knowing *all* truths, if knowing all truths would reduce the amount of power or benevolence the being could possess. Another departure from the traditional understanding presented above appeals to feminist epistemology. See the Section 3.1 of the entry on [feminist philosophy of religion](https://plato.stanford.edu/entries//feminist-religion/index.html#FemiCritTradThei), which hints at this possibility in its discussion of “so-called *divine attributes*”, although it limits its discussion to perfect power and divine aseity. Farmer (2010), however, draws more directly on feminist epistemology as an application to understanding omniscience. The negative claim in this work is that “propositional ideals of human knowledge” exclude “marginalized and maligned” forms of knowledge. Thus omniscience could be better understood by appealing, positively, to these other forms of knowledge. Farmer cites “knowing other people in personal relationships”, the “centrality of care” which leads to “the acknowledgement of the otherness of the object of knowledge”, and the role of emotion in leading to knowledge. (Farmer cites (Code, 1993), (Dalmiya 2002)[^dalmiya-2002], and (Jaggar 1989)[^jaggar-1989], respectively, for these ideas.) However this approach is to be worked out, the intention is that omniscience would not simply be defined by reference to knowledge of true propositions.
    step1: |-
      晚近若干关于全知的讨论，试图为一种比前述定义更受限的说明作辩护。例如 Langtry（2008: 39）建议：上帝是全知的，当且仅当对每一真命题 *p*，“要么上帝知道 *p*，要么上帝虽不知道 *p*，但他知道 *p* 并不为他内在认知能力中的任何缺陷或限制所排除”。Nagasawa（2017）主张，一种更强版本的完满存在神学将认为上帝拥有知识、力量与仁慈这三项神圣属性的“最大一致集”。这将允许一个完满存在在不认识 *全部* 真理的情况下仍是全知的——如果不认识全部真理会减少该存在所能拥有的力量或仁慈之量。另一条偏离上述传统理解的进路诉诸女性主义认识论。参见[宗教哲学中的女性主义](https://plato.stanford.edu/entries//feminist-religion/index.html#FemiCritTradThei)词条第 3.1 节，它在讨论“所谓的 *神圣属性*”时暗示了这种可能性，尽管其讨论仅限于完美力量与神圣自存性。不过，Farmer（2010）更直接地援引女性主义认识论，把它应用于对全知的理解。该著作的否定性主张是：“人类知识的命题式理想”排除了“被边缘化与被贬损的”知识形式。因此，可以正面援引这些其他知识形式来更好地理解全知。Farmer 举出“在私人关系中认识他人”、导致“承认知识对象的他异性”的“关怀之中心性”，以及情感在通向知识中的作用。（Farmer 分别以 (Code, 1993)、(Dalmiya 2002)[^dalmiya-2002] 与 (Jaggar 1989)[^jaggar-1989] 为这些观念的出处。）无论这一进路将如何展开，其意图在于：全知不应仅凭对真命题的知识来定义。
    step2: |-
      晚近关于全知的若干讨论，都试图为一种比上述定义更受限的说明辩护。例如 Langtry（2008: 39）提出：上帝是全知的，当且仅当对每一真命题 *p*，“要么上帝知道 *p*，要么上帝虽不知道 *p*，但他知道 *p* 并不因其内在认知能力的任何缺陷或限制而受阻”。Nagasawa（2017）主张，一个更强版本的完满存在神学将认为：上帝拥有知识、力量与仁慈这三项神圣属性的“最大一致集”。这样一来，一个完满存在即使不认识 *全部* 真理也可以是全知的——只要认识全部真理会削减它所能拥有的力量或仁慈。另一条偏离上述传统理解的思路诉诸女性主义认识论。详见[宗教哲学中的女性主义](https://plato.stanford.edu/entries//feminist-religion/index.html#FemiCritTradThei)词条第 3.1 节；该节在讨论“所谓的 *神圣属性*”时暗示了这一可能，尽管其讨论只限于完美力量与神圣自存性。Farmer（2010）则更直接地把女性主义认识论用于理解全知。该书的否定性主张是：“人类知识的命题式理想”把“被边缘化、被贬损的”知识形式排除在外。于是，正面援引这些其他知识形式，或可更好地理解全知。Farmer 举出“在私人关系中认识他人”、引向“承认知识对象之他异性”的“关怀的中心地位”，以及情感在通向知识过程中的作用。（这些观念 Farmer 分别取自 (Code, 1993)、(Dalmiya 2002)[^dalmiya-2002] 与 (Jaggar 1989)[^jaggar-1989]。）无论这条进路最终如何展开，其意图都是：全知不应仅仅参照对真命题的知识来定义。
