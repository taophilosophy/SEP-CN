      我们刚刚考察了三种拒斥该论证的策略。然而，有些有神论哲学家乐于接受它。一种立场接受该论证，并给出波爱修斯式的回应，就像对上述第一个论证所给出的那样：上帝的存在方式是永恒，因此他没有预知。按此观点，神圣预知与人的自由行动不相容并不要紧，因为上帝的全知并不包括预知（例如见 Stump and Kretzmann 1991）[^stump-1991]。其他哲学家则反驳说：无论上帝是永恒的还是永存的，仅仅诉诸上帝的永恒并不足以回应该论证。普兰丁格（1986）、扎格泽布斯基（1991）等人主张，可以用这样一个前提构造出完全类似的论证：八十年前，“上帝永恒地知道琼斯明天修剪草坪”当时为真，因而现在已是偶然必然的。按这一修订版，神圣的 *永恒* 知识与人的自由行动之不相容，并不亚于神圣 *预知* 之不相容；所以波爱修斯式的回应并未触及该论证。
