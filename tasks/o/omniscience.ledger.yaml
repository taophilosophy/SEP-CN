      On the other hand, perhaps no such emendation is necessary. Many philosophers have defended an account of *de re* belief about an object in terms of having some *de dicto* belief about that object while also bearing a relation of acquaintance to it, that is, while being epistemically *en rapport* with the object (see Chisholm 1976, Lewis 1979, and Kaplan 1968)[^chisholm-1976][^kaplan-1968][^lewis-1979]. Perhaps, God has an immediate or direct awareness of everything and that relation is sufficiently intimate to put him into epistemic rapport with everything. In that case, if *de re* knowledge is thus reducible to *de dicto*, then God’s satisfying (D1) (or (D4) would give him complete *de re* knowledge. On this last point, see Wierenga (2009: 134).
    step1: |-
      另一方面，或许并不需要这样的修正。许多哲学家曾以如下方式说明关于某对象的 *de re* 信念：对该对象持有某种 *de dicto* 信念，同时又与该对象处于亲知关系，即在认知上与该对象 *en rapport*（例如见 Chisholm 1976、Lewis 1979 与 Kaplan 1968）[^chisholm-1976][^kaplan-1968][^lewis-1979]。或许上帝对万物具有直接或即刻的觉知，而这种关系足够亲密，使他与万物处于认知的相契之中。在这种情况下，如果 *de re* 知识可如此还原为 *de dicto* 知识，那么上帝满足 (D1)（或 (D4)）就会给他完备的 *de re* 知识。关于最后这一点，见 Wierenga（2009: 134）。
    step2: |-
      另一方面，或许根本无需这样的修补。许多哲学家主张：关于某对象的 *de re* 信念，可以解释为对该对象持有某种 *de dicto* 信念，同时又与该对象处于亲知关系，即在认知上与该对象 *en rapport*（例如见 Chisholm 1976、Lewis 1979 与 Kaplan 1968）[^chisholm-1976][^kaplan-1968][^lewis-1979]。上帝对万物或许正有直接、即刻的觉知，而这种关系足够亲密，足以使他与万物处于认知的相契之中。若如此，只要 *de re* 知识可还原为 *de dicto* 知识，上帝满足 (D1)（或 (D4)）便已给他完备的 *de re* 知识。关于最后这一点，见 Wierenga（2009: 134）。
