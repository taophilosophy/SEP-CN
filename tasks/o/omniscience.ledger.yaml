      晚近最受广泛接受的一种回应，或许是接受该论证，但否认全知及于未来。吉奇（1977）认为，除“当下的趋势与倾向”之外，并无未来可被认识。斯温伯恩（1993、2016）主张全知不包括对未来自由行动的预知。Hoffman 与 Rosenkrantz（2002）则对全知给出了细致说明，有意把上帝的预知限于“因果上不可避免”的真理，而因果上不可避免的事件并非自由行动。宗教哲学中晚近兴起的所谓“开放神论”，其明确旨趣正是让未来保持“开放”、因而不为上帝所知，以便给自由留下余地；哈斯克尔（1989、2004）是该群体中的领军人物，Pinnock（1994）的各位撰稿人亦然。莫森也有类似建议：认为上帝在时间之中的有神论者应当承认“上帝对未来实际将发生的一切都悬置判断”，全知对未来只及于“各个具体未来发展的概率”（Mawson 2019: 38–39）[^mawson-2019]。费希尔（2016: 26ff.; 2022, 67ff; 批评见 Iwanicki and Karczewska 2024）则辩护一种更强的观点：上帝至少拥有超出吉奇“当下趋势”与 Hoffman、Rosenkrantz“因果上不可避免”的未来知识[^iwanicki-2024]。依费希尔之见，*我们* 对未来本就持有真信念，比如关于友人明天将做什么。这类信念可以在我们处于“授知情境”时形成（大致说来，即为避免葛梯尔问题而追加于证成之上者）。上帝同样能形成这类信念；而且，上帝既全知又自知全知，他便知道自己何时持有此种信念、知道它为真，并握有蕴含其为真的证据，即他的全知（2022, 67）。这样，上帝甚至可以“自我举升”而抵达确定性。本文开篇已见，把全知归于上帝的动机之一，正是要能够发展神意教义。可是，凡否认上帝的知识及于未来自由行动、或只承认其有限延伸的人，一旦上帝并不知道自由行动者将做什么，就得承担陈述或接受某种神意学说的艰难任务。
