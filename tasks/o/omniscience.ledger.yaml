    kind: body
    source: |-
      Another recent concern is whether it really is possible to know all truths. Grim (1988) has objected to the possibility of omniscience on the basis of an argument that concludes that there is no set of all truths. The argument (by *reductio*) that there is no set $\mathbf{T}$ of all truths goes by way of Cantor’s Theorem. Suppose there were such a set. Then consider its power set, $\wp(\mathbf{T})$, that is, the set of all subsets of $\mathbf{T}$. Now take some truth $t_1$. For each member of $\wp(\mathbf{T})$, either $t_1$ is a member of that set or it is not. There will thus correspond to each member of $\wp(\mathbf{T})$ a further truth, specifying whether $t_1$ is or is not a member of that set. Accordingly, there are at least as many truths as there are members of $\wp(\mathbf{T})$. But Cantor’s Theorem tells us that there must be more members of $\wp(\mathbf{T})$ than there are of $\mathbf{T}$. So $\mathbf{T}$ is not the set of all truths, after all. The assumption that it is leads to the conclusion that it is not. Now Grim thinks that this is a problem for omniscience because he thinks that a being could know all truths only if there were a set of all truths. In reply, Plantinga (Plantinga and Grim 1993)[^plantinga-1993][^plantinga-1993-2] holds that knowledge of all truths does not require the existence of a set of all truths. Plantinga notes that a parallel argument shows that there is no set of all propositions, yet it is intelligible to say, for example, that every proposition is either true or false. A more technical reply in terms of levels of sets has been given by Simmons (1993), but it goes beyond the scope of this entry. See also Wainwright (2010: 50–51) and Oppy (2014: 223–244).
    step1: |-
      另一个晚近的疑虑是：认识一切真理究竟是否可能。格里姆（1988）基于一个结论为“不存在一切真理的集合”的论证，对全知的可能性提出反对。该论证（以 *归谬* 方式）表明不存在一切真理的集合 $\mathbf{T}$，其途径是康托尔定理。假定存在这样一个集合。那么考虑它的幂集 $\wp(\mathbf{T})$，即 $\mathbf{T}$ 的一切子集之集。现在取某个真理 $t_1$。对 $\wp(\mathbf{T})$ 的每个成员而言，$t_1$ 要么是该集合的成员，要么不是。于是，将对应于 $\wp(\mathbf{T})$ 的每个成员而有一个进一步的真理，说明 $t_1$ 是否为该集合的成员。据此，真理至少与 $\wp(\mathbf{T})$ 的成员一样多。但康托尔定理告诉我们，$\wp(\mathbf{T})$ 的成员必定多于 $\mathbf{T}$ 的成员。所以 $\mathbf{T}$ 毕竟不是一切真理的集合。假定它是，就会引出它不是的结论。格里姆认为这对全知构成问题，因为在他看来，一个存在只有在存在一切真理之集合时才可能认识一切真理。在回应中，普兰丁格（Plantinga and Grim 1993）[^plantinga-1993][^plantinga-1993-2] 主张，认识一切真理并不要求存在一切真理的集合。普兰丁格指出，一个平行论证表明不存在一切命题的集合，然而说“每个命题或真或假”却是可理解的。Simmons（1993）以集合层次给出了一个更技术性的回应，但那超出本词条的范围。另见 Wainwright（2010: 50–51）与奥皮（2014: 223–244）。
    step2: |-
      另一个晚近的疑虑是：认识一切真理究竟是否可能？格里姆（1988）提出反对，其依据是一个旨在证明“不存在一切真理之集合”的论证。该论证（*归谬* 式）表明不存在一切真理的集合 $\mathbf{T}$，取道康托尔定理：设若确有这样一个集合，则考察其幂集 $\wp(\mathbf{T})$，即 $\mathbf{T}$ 的一切子集之集；取某一真理 $t_1$，对 $\wp(\mathbf{T})$ 的每一成员而言，$t_1$ 要么属于该集合、要么不属于。于是，$\wp(\mathbf{T})$ 的每一成员都对应一个进一步的真理，说明 $t_1$ 是否属于该集合。据此，真理的数目至少不少于 $\wp(\mathbf{T})$ 的成员数。但康托尔定理告诉我们，$\wp(\mathbf{T})$ 的成员必定多于 $\mathbf{T}$ 的成员。所以 $\mathbf{T}$ 终究不是一切真理的集合：假定它是一切真理之集合，便会推出它不是。格里姆由此认为全知成了问题，因为在他看来，一个存在唯有在存在一切真理之集合时才能认识一切真理。普兰丁格（Plantinga and Grim 1993）[^plantinga-1993][^plantinga-1993-2] 回应说，认识一切真理并不要求存在一切真理的集合：他指出，一个平行论证表明不存在一切命题的集合，然而“每个命题或真或假”这类说法仍是可理解的。Simmons（1993）以集合层次给出一个更技术性的回应，但已超出本词条的范围。另见温赖特（2010: 50–51）与奥皮（2014: 223–244）。
