      We have just looked at three strategies for rejecting the argument. Some theistic philosophers, however, are happy to accept it. One position accepts the argument and gives the Boethian response, like that given to the first argument above, that God’s mode of existence is eternity, so he does not have foreknowledge. On this view, it does not matter that divine foreknowledge is incompatible with free human action, because God’s omniscience does not include foreknowledge (see, for example, Stump and Kretzmann 1991)[^stump-1991]. Other philosophers have objected that regardless of whether God is eternal rather than everlasting, it does not suffice to reply to the argument simply by appealing to God’s eternity. Plantinga (1986), Zagzebski (1991), and others claim that an exactly analogous argument could be constructed using the premiss that 80 years ago it was then true, and so now accidentally necessary, that God eternally knows that Jones mows his lawn tomorrow. According to this revision of the argument, divine *eternal* knowledge would be as incompatible with human free action as divine *foreknowledge* is; so the Boethian response leaves the argument unchallenged.
