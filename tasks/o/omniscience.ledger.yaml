      Given the structural similarity between the objection from *present-time* knowledge and the objection from *first-person* knowledge it is not surprising that philosophers have given parallel replies. (See Sosa 1983a,b on the analogy between first-person and present-time knowledge.)[^sosa-1983a] What is perhaps more surprising is that it has, for the most part, been opponents of the argument who have attempted to supply the details of exactly what the objects of knowledge and belief are in the case of knowledge of the present and of oneself. On the one hand, perhaps the propositions we know when we know what day it is are eternally true. In this case, what changes is our access to the propositions in question, rather than the propositions themselves. Kvanvig (1986) holds that such knowledge involves a special access to or a “direct grasp” of a proposition, which leaves it open that God could believe the same propositions without thereby ending up with present-time knowledge or first-person knowledge of someone else. Wierenga (1989: 48–53) has proposed an account of the objects of present-time and first-person belief according to which these propositions involve *haecceities* or individual essences of persons and times. On this view, one gets a first-person belief by believing a proposition including his or her own haecceity, and one gets a present-time belief by believing a proposition involving the haecceity of a moment of time *at the time in question*. This leaves it open that God believes the same propositions we do. He does not get a first-person belief about someone else, because the relevant propositions do not include his own haecceity. And whether he gets a present-time belief depends on whether he believes these propositions involving the haecceities of moments of time *at their times* or *at his eternal perspective*. It is not knowing the propositions that makes him temporal; it is whether he believes in time or out of time. For criticism of this proposal, see Craig (2000) and Torre (2006). But for a recent positive presentation, see Swinburne (2016: 175–182).
    step1: |-
      鉴于来自 *当下时间* 知识的反对意见与来自 *第一人称* 知识的反对意见在结构上相似，哲学家们给出平行的回应并不奇怪。（关于第一人称知识与当下时间知识之间的类似，见 Sosa 1983a,b。）[^sosa-1983a] 或许更令人意外的是，多半是对该论证持反对立场的哲学家，力图给出确切细节，说明在当下知识与自我知识的情形中，知识与信念的对象究竟是什么。一方面，我们关于今天是星期几所知道的命题，或许是永恒为真的。在这种情况下，变化的是我们通达这些命题的方式，而不是命题本身。克万维格（1986）主张这类知识涉及对命题的特殊通达或“直接把握”，这就为下述可能留出余地：上帝可以相信同样的命题，却不因此获得当下时间的知识或他人的第一人称知识。Wierenga（1989: 48–53）则提出一种关于当下时间信念与第一人称信念之对象的说明：这些命题涉及人的 *此性*（haecceities）或时间的个体本质。按此观点，一个人通过相信一个包含他或她自己此性的命题而获得第一人称信念，通过相信一个涉及某一时刻之此性的命题而获得当下时间信念——而且是在该时刻 *本身* 相信。这就为下述可能留出余地：上帝相信我们所相信的同样命题。他不会获得关于他人的第一人称信念，因为相关命题不包含他自己的此性。而他是否获得当下时间信念，则取决于他是在那些时刻 *本身* 相信这些涉及时刻之此性的命题，还是 *在其永恒视角* 下相信。使他在时间之中的，不是知道这些命题，而是他是否在时间之内相信。对此说明的批评，见 Craig（2000）与 Torre（2006）。但对该说明晚近的正面阐述，见 Swinburne（2016: 175–182）。
    step2: |-
      *当下时间* 知识的反对意见与 *第一人称* 知识的反对意见在结构上相似，哲学家给出平行的回应也就不足为奇。（关于两者的类比，见 Sosa 1983a,b。）[^sosa-1983a] 或许更出人意料的是：多半是反对该论证的一方，在费力补足细节——说明当下知识与自我知识的情形中，知识与信念的对象究竟是什么。一方面，我们关于“今天是星期几”所知道的命题，或许永恒为真；变化的只是我们对这些命题的通达，而非命题本身。克万维格（1986）主张，这类知识涉及对命题的一种特殊通达或“直接把握”；如此便留有余地：上帝可以相信同样的命题，却不因此得到现时知识，也不因此得到关于他人的第一人称知识。Wierenga（1989: 48–53）则就当下时间信念与第一人称信念的对象提出一种说明：这些命题涉及人的 *此性*（haecceities）或时刻的个体本质。按此说明，人通过相信一个包含自己此性的命题而获得第一人称信念；通过相信一个涉及某时刻之此性的命题而获得当下时间信念——并且是在该时刻 *本身*。这样便留有余地：上帝相信的正是我们所相信的命题。他不会获得关于他人的第一人称信念，因为相关命题并不包含他自己的此性；而他是否获得当下时间信念，则取决于他是在那些时刻 *本身* 相信这些命题，还是 *从其永恒视角* 相信。使他处于时间之中的，不是知道这些命题，而是他究竟在时间之内还是之外相信。对此说明的批评见 Craig（2000）与 Torre（2006）；晚近的正面阐述见 Swinburne（2016: 175–182）。
