      Finally, it remains open to deny (6), to hold that even if it is already accidentally necessary that Jones mow his lawn tomorrow, he nevertheless *has it within his power* to do something, for example, spend the day indoors, which is such that if he were to do it, it would be false that he mows his lawn (Plantinga 1986: 257)[^plantinga-1986]. Jones *can* remain indoors tomorrow, and if he were to do that, the past would have been different; in particular, God would never have believed then that Jones would mow his lawn tomorrow. See also Mavrodes (1983) for a defense of the claim that events of the past are now preventable. Some philosophers object, however, to this sort of counterfactual power over the past.
