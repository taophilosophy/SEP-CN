      近年来，对这个论证最被广泛接受的回应，或许是接受它但否认全知延伸到对未来的知识。吉奇（1977）主张，除了“当下的趋势与倾向”之外，并没有可供认识的未来。斯温伯恩（1993 与 2016）主张全知不包括对未来自由行动的预知。Hoffman 与 Rosenkrantz（2002）对全知给出了细致的说明，有意把上帝的预知限于“因果上不可避免的”真理，而因果上不可避免的事件并不是自由行动。确实，宗教哲学中晚近一场运动即所谓开放神论，其明确目标就是让未来保持“开放”，从而不为上帝所知，正是为了给人的自由留下余地。哈斯克尔（1989, 2004）一直是这一群体中的领军人物，Pinnock（1994）的各位撰稿人亦然。与此类似，莫森建议，认为上帝在时间之中的有神论者应当说“上帝对未来实际将发生的一切都悬置判断”。相反，按此观点，全知对未来只延伸到对“各个特定未来发展的概率”的知识（Mawson 2019: 38–39）[^mawson-2019]。有一种观点认为上帝至少拥有某种超出吉奇的“当下趋势”与Hoffman、Rosenkrantz的“因果上不可避免”的未来知识，它由费希尔（2016: 26ff.; 2022, 67ff; 见 Iwanicki and Karczewska 2024 的批评）加以辩护[^iwanicki-2024]。按费希尔的说法，*我们* 对未来持有真信念，例如关于我们的朋友明天将做什么，而这类信念可以在我们处于“授知情境”时形成（大致说来，即为避免葛梯尔问题而追加于证成之上的东西）。但上帝也能形成那类信念。此外，既然上帝是全知的并且知道自己如此，他就知道自己何时持有这类信念，知道它为真，并拥有证据——即他的全知——蕴含它为真（2022, 67）。这样一来，上帝甚至可以“自我举升”而达到确定性。本文开头我们看到，把全知归于上帝的动机之一，就是要能够发展出一种神意教义。然而，那些否认上帝的知识延伸到未来自由行动、或只以有限方式延伸的人，若上帝并不知道自由行动者将做什么，就将面临陈述或接受一种神意学说的艰巨任务。
