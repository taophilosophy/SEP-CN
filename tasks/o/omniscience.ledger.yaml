    source: |-
      It is thus natural to think than an account of providence requires attributing vast knowledge to God. (For a dissenting interpretation of providence which does not require complete knowledge, see Hasker 2004.)[^hasker-2004] A third motivation for including omniscience among the divine attributes derives from “perfect being theology”. Perfect being theology appeals to St. Anselm, who held that God is that than which nothing greater can be thought (*Proslogion*, c.1077). Anselm expands on what he means by greatness by giving the formula that “God is whatever it is better to be than not”, and he concludes that this includes such properties as making other things from nothing, being just, being happy, and being perceptive, omnipotent, and merciful. Anselm can derive omniscience from this list because he holds that “to perceive is nothing else than to know” (Anselm 1998: 90)[^anselm-1998]. Other exponents of perfect being theology could simply, and more directly, affirm that it is better to have knowledge than not; so having knowledge is a property that contributes to greatness. Interestingly, the first of these sources, the biblical ascriptions of great knowledge to God, together with additional passages attributing other perfections to him, as Leftow argues, license a version of the third motivation, perfect being theology. On this view, perfect being theology “simply tries to show what authoritative statements about God’s perfections entail” (Leftow 2011: 108)[^leftow-2011].
    step1: |-
      因此自然可以认为，关于神意的说明需要把浩瀚知识归给上帝。（对于一种不要求完备知识的神意解释——因其持异议——见 Hasker 2004。）[^hasker-2004] 把全知列入神圣属性的第三种动机来自“完满存在神学”。完满存在神学诉诸圣安瑟伦，他主张上帝是无法设想有比之更伟大者的存在（*Proslogion*，约 1077 年）。安瑟伦通过给出公式“上帝是一切存在比不存在更好的东西”来展开他所理解的伟大，并得出结论说，这包括从无中创造他物、公正、幸福，以及有感知、全能、仁慈等属性。安瑟伦能从这份清单推出全知，因为他主张“感知无非就是认识”（Anselm 1998: 90）[^anselm-1998]。完满存在神学的其他阐发者可以更简单、更直接地断言：拥有知识比没有知识更好；因此拥有知识是一种有助于伟大的属性。有趣的是，正如莱夫托所论证，这些来源中的第一个——把伟大知识归给上帝的圣经段落——连同把其他完满性归给他的补充段落，为第三种动机即完满存在神学提供了一种许可。按此观点，完满存在神学“只是试图表明关于上帝完满性的权威陈述蕴含了什么”（Leftow 2011: 108）[^leftow-2011]。
    step2: |-
      因此自然可以认为，要说明神意就得把浩瀚知识归给上帝。（对神意另有一种持异议的解释，它不要求完备知识，见 Hasker 2004。）[^hasker-2004] 把全知列入神圣属性的第三种动机，来自“完满存在神学”。完满存在神学诉诸圣安瑟伦：上帝乃是无法设想有比之更伟大者的存在（*Proslogion*，约 1077 年）。安瑟伦以“上帝是一切存在比不存在更好的东西”这一公式来展开他所谓的伟大，并由此得出结论：伟大包含从无中创造他物、公正、幸福，以及有感知、全能、仁慈等属性。他之所以能从这份清单推出全知，是因为他主张“感知无非就是认识”（Anselm 1998: 90）[^anselm-1998]。完满存在神学的其他阐发者可以更简单、更直接地断言：拥有知识胜于没有知识，故拥有知识是一种有助伟大的属性。有趣的是，按莱夫托的论证，第一种来源——圣经把伟大知识归给上帝的段落——连同把其他完满性归给他的补充段落，恰恰为第三种动机（完满存在神学）提供了许可。在此观点下，完满存在神学“只是试图表明：关于上帝完满性的权威陈述蕴含了什么”（Leftow 2011: 108）[^leftow-2011]。
