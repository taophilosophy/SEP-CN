      The usual discussions of omniscience treat it as a special case of knowledge, although, perhaps, with such additional features as being arrived at infallibly or through essential omniscience. A standard account of knowledge holds that it is justified true belief, plus a “fourth condition” to avoid counterexamples (see, for example, Chisholm 1989: 90–91)[^chisholm-1989]. Perhaps, instead, knowledge is warranted true belief, that is, a true belief produced by ones noetic faculties functioning properly in circumstances in which they were designed to function (see, for example, Plantinga 1993)[^plantinga-1993][^plantinga-1993-2]. Or, according to another recent proposal, the “Knowledge First” view, knowledge is a general state not to be analyzed by satisfying some other conditions (see Williamson 2000)[^williamson-2000]; but even on this suggestion, knowledge entails belief and justification. Thus, on all of these views, knowledge involves belief—as did our discussion two paragraphs back of whether omniscience could include dispositional belief. For the most part, however, philosophers have not devoted much attention to the status of God’s beliefs or the nature of his justification. One exception is the claim of Alston (1986) that God’s knowledge is not divided into separate beliefs and that in fact God does not have beliefs. According to Alston, God has an intuitive, immediate awareness of all truth, which gives him knowledge without belief. For criticism of Alston’s view, see (Hasker 1988)[^hasker-1988] and (Dickinson 2019)[^dickinson-2019].
    step1: |-
      通常关于全知的讨论把它当作知识的一个特例，尽管或许带有如“以无误的方式达到”或“经由本质全知”这类额外特征。一种标准的知识说明主张知识是得到证成的真信念，再加上一个避免反例的“第四条件”（例如见 Chisholm 1989: 90–91）[^chisholm-1989]。或许知识毋宁是得到保证的真信念，即由某人的理智官能在其被设计来发挥作用的境况中正常运作而产生的真信念（例如见 Plantinga 1993）[^plantinga-1993][^plantinga-1993-2]。或者，按照另一项晚近提议即“知识优先”观点，知识是一种一般状态，不能通过满足其他某些条件来分析（见 Williamson 2000）[^williamson-2000]；但即便在此建议下，知识也蕴含信念与证成。因此，在所有这些观点中，知识都涉及信念——就像我们前面两段讨论全知是否可包含倾向性信念时那样。然而，哲学家们大多并未太关注上帝的信念之地位或其证成的性质。一个例外是阿尔斯顿（1986）的主张：上帝的知识并不分化为一个个单独的信念，而且事实上上帝并不持有信念。按阿尔斯顿的说法，上帝对一切真理有一种直觉性的、直接的觉知，这使他无需信念而有知识。对阿尔斯顿观点的批评，见 (Hasker 1988)[^hasker-1988] 与 (Dickinson 2019)[^dickinson-2019]。
    step2: |-
      通常讨论全知时，都把它当作知识的一个特例，只不过或许还带有“以无误的方式获得”或“经由本质全知”之类的额外特征。有一种标准的知识理论认为，知识是得到证成的真信念，再加一个用以排除反例的“第四条件”（例如见 Chisholm 1989: 90–91）[^chisholm-1989]；也有人认为知识毋宁是得到保证的真信念，即由某人的理智官能在其被设计来起作用的境况中正常运作所产生的真信念（例如见 Plantinga 1993）[^plantinga-1993][^plantinga-1993-2]；还有一种晚近提议即“知识优先”观点，主张知识是一种不可通过满足其他条件来分析的一般状态（见 Williamson 2000）[^williamson-2000]，但即便如此，知识仍蕴含信念与证成。可见在所有这些观点中，知识都涉及信念——这与前面两段讨论全知能否包含倾向性信念时同理。不过，哲学家大多并不太追问上帝信念之地位或上帝证成之性质。一个例外是阿尔斯顿（1986）：他主张上帝的知识并不分解为一个个独立信念，事实上上帝根本没有信念。按他的说法，上帝对一切真理有直觉性的、直接的觉知，因而无需信念而有知识。对阿尔斯顿此说的批评，见 (Hasker 1988)[^hasker-1988] 与 (Dickinson 2019)[^dickinson-2019]。
