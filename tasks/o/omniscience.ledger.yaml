      It is somewhat controversial exactly what Augustine’s own response to this argument is (in his formulation it is foreknowledge of a sinful action and not foreknowledge of human actions more generally). An influential interpretation has been given by Rowe (1964) and criticized by Hopkins (1977), who both think that Augustine denies premiss (2) on the grounds that human actions may be free even if they come about by necessity. An alternative interpretation has been defended by Wierenga (1989: 60–63), who thinks that Augustine only explicitly argues against the conclusion of the argument. In any event, it is clearer that Augustine denies the conclusion than that he identifies a flaw in the argument. Boethius, on the other hand, accepts the argument but denies that omniscience includes foreknowledge. Instead, God’s perspective is that of *eternity*, that is, “the complete possession all at once of illimitable life”. In other words, God sees everything that ever happens all at once, so he does not, strictly speaking, know things ahead of time. (For a more recent defense of this view, see Stump and Kretzmann 1981.)[^stump-1981]
    step1: |-
      奥古斯丁本人对这个论证的回应究竟是什么，颇有争议（在他的表述中，这是对一个有罪行动的预知，而不是更一般地对人类行动的预知）。Rowe（1964）给出了一种有影响的解释，霍普金斯（1977）对它提出了批评；两人都认为，奥古斯丁否认前提 (2)，理由是人的行动即使出于必然，也可能是自由的。Wierenga（1989: 60–63）为另一种解释作了辩护，他认为奥古斯丁只是明确地反驳该论证的结论。无论如何，奥古斯丁否认结论这一点，比之他指认论证中的缺陷，要更清楚。另一方面，波爱修斯接受该论证，但否认全知包含预知。相反，上帝的视角是 *永恒* 的视角，即“对无界限的生命的一次性完整拥有”。换言之，上帝一次性地看见曾发生的一切，因此严格说来，他并不事先知道事情。（关于此观点的较晚近辩护，见 Stump and Kretzmann 1981。）[^stump-1981]
