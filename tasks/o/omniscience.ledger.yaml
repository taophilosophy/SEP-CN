      > If anything changes, then it is not the case that all truths are eternal. God knows all truths, hence also those which are such only for today. He could not apprehend these truths yesterday, since at that time they were not truths—but there were other truths instead of them. Thus he knows, for example, that I write down these thoughts, but yesterday he knew not that, but rather that I was going to write them down later. And similarly he will know tomorrow that I have written them down. (Brentano, *Philosophische Untersuchungen*, English translation in Chisholm 1979: 347)[^chisholm-1979]
    step1: |-
      > 如果有任何东西变化，那么并非一切真理都是永恒的。上帝知道一切真理，因此也知道那些只在今天为真的真理。他昨天无法把握这些真理，因为那时它们还不是真理——取而代之的是另一些真理。例如，他知道我正写下这些想法；但昨天他不知道这一点，而是知道我稍后将写下它们。类似地，明天他将知道我已写下它们。（Brentano，《哲学研究》，英译见 Chisholm 1979: 347）[^chisholm-1979]
    step2: |-
      > 假使有任何东西在变化，那就并非一切真理都永恒。上帝知道一切真理，因而也知道那些只在今天才成立的真理。这些真理他昨天无法把握——因为那时它们还不是真理，代替它们的是另一些真理。于是，例如，他知道我此刻正写下这些想法；可昨天他并不知道这一点，他当时知道的是我稍后会写下它们。类似地，明天他将知道我已写下了它们。（Brentano，*Philosophische Untersuchungen*，英译见 Chisholm 1979: 347）[^chisholm-1979]
