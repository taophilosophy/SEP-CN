      最后，仍可否认 (6)，主张即便“琼斯明天修剪草坪”已是偶然必然的，他仍然 *有能力* 做某事——例如整天待在室内——而这件事若他做了，“他修剪草坪”就会是假的（Plantinga 1986: 257）[^plantinga-1986]。琼斯明天 *可以* 待在室内；如果他那样做，过去就会有所不同；特别是，上帝当时就绝不会相信琼斯明天将修剪草坪。另见马夫罗德斯（1983）对“过去的事件现在可以阻止”这一主张的辩护。不过，有些哲学家反对这种对过去的反事实权力。
