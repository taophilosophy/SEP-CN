      A related idea emerges from the suggestion that not only does a perfect being *exist* necessarily, but it has its various great-making properties *of necessity*. The suggestion is that a being worthy of worship should not “possess its *various excellences* in some merely adventitious manner” (Findlay 1948: 180)[^findlay-1948]. In that case, another feature of divine knowledge, if God exists necessarily, is being *essentially omniscient*, that is, being omniscient and not possibly lacking omniscience. Essential omniscience entails infallibility—a being who could not possibly fail to be omniscient could not possibly be mistaken—but the reverse does not hold, for a being who could not possibly believe a falsehood might nevertheless fail to believe all truths. So essential omniscience might be another additional component to the standard account. In an influential article Pike (1965) has argued for the incompatibility of *essential* omniscience and voluntary human action (see Section 3).
    step1: |-
      一个相关的想法出自如下建议：一个完满存在不仅必然地 *存在*，而且 *必然地* 具有它那些使之伟大的各种属性。这一建议是：一个值得崇拜的存在不应“以某种纯属偶发的方式拥有它的 *种种卓越*”（Findlay 1948: 180）[^findlay-1948]。在这种情况下，如果上帝必然存在，那么神圣知识的另一特征就是 *本质地全知*，即：是全知的，且不可能欠缺全知。本质全知蕴含无误性——一个不可能不是全知的存在不可能弄错——但反之不然，因为一个不可能相信假命题的存在仍可能未能相信一切真理。所以，本质全知可能是标准说明的又一个额外成分。在一篇有影响的文章中，派克（1965）论证了 *本质的* 全知与人的自愿行动不相容（见第 3 节）。
    step2: |-
      一个相关的想法来自这样的建议：完满存在不仅必然地 *存在*，而且 *必然地* 具备它那些使之伟大的属性。按其意，值得崇拜者不应“以某种纯属偶发的方式拥有其 *种种卓越*”（Findlay 1948: 180）[^findlay-1948]。若上帝必然存在，则神圣知识又有另一特征：*本质地全知*，即它是全知的，且不可能欠缺全知。本质全知蕴含无误性——一个不可能不全知的存在不可能出错——但反之不成立：一个不可能相信假命题的存在，仍可能未能相信一切真理。于是，本质全知也可能成为标准说明的又一附加成分。派克（1965）在一篇影响深远的文章中指出：*本质* 全知与自由行动之自愿性不相容（见第 3 节）。
