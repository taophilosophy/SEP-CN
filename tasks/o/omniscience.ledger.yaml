      Another question that arises about God’s knowledge is whether it is all *occurrent* knowledge or whether some of his knowledge is *dispositional*. Knowledge of a proposition is occurrent if the knower has that proposition in mind. And knowledge of a proposition is dispositional, roughly, if the person knows the proposition but is not currently thinking about it or entertaining it, that is, if the person has a dispositional belief (see Section 2.1 of the entry on [belief](https://plato.stanford.edu/entries/belief/index.html#OccuVersDispBeli)) in that proposition. Philosophers have answered this question differently. Thomas Aquinas claimed that God’s knowledge was not “discursive” (*Summa Theologiae*, I, 14, 7), by which he meant, in the first place, that God does not first think of one thing and then think of another, for “God sees all things together and not successively”. On the other hand, Hunt (1995) has argued that taking God’s knowledge of the future to be dispositional can provide a way of reconciling divine foreknowledge with human free action (see next section). It seems hard to understand, however, how someone with the vast ability to be omniscient could fail to be aware of any part of what they know.
    step1: |-
      关于上帝的知识还有另一个问题：它是否全部是 *现时性的* 知识，抑或他的某些知识是 *倾向性的*。如果认识者心中当下有该命题，那么对该命题的知识就是现时性的。而对一个命题的知识大致来说是倾向性的——如果此人知道该命题，但当下并未思考它或玩味它，也就是说，如果此人对其持有倾向性信念（见[信念](https://plato.stanford.edu/entries/belief/index.html#OccuVersDispBeli)词条第 2.1 节）。哲学家们对这个问题给出了不同回答。托马斯·阿奎那主张上帝的知识不是“推演性的”（《神学大全》I, 14, 7），他首先指的是：上帝不是先想一件事再想另一件事，因为“上帝同时看见一切，而非相继看见”。另一方面，亨特（1995）论证说，把上帝对未来的知识视为倾向性的，可以提供一条使神圣预知与人的自由行动相协调的途径（见下一节）。然而，一个具有全知这一浩瀚能力的存在，怎么可能对自己所知之物的任何部分无所察觉，这似乎难以理解。
    step2: |-
      关于上帝的知识还有一问：它是否全部是 *现时性* 知识，抑或其中有一部分是 *倾向性* 的？若认识者心中此刻正想着某命题，则他对该命题的知识便是现时性的；而所谓倾向性的知识，大致说来，是指人知道该命题却并未正在思考或玩味它，也就是对该命题持一种倾向性信念（见[信念](https://plato.stanford.edu/entries/belief/index.html#OccuVersDispBeli)词条第 2.1 节）。哲学家对此答案不一。托马斯·阿奎那主张上帝的知识不是“推演性的”（《神学大全》I, 14, 7），其首要意思是：上帝不会先想一事、再想另一事，因为“上帝同时看见一切，而不是相继看见”。另一方面，亨特（David Hunt，1995）论证说，若把上帝对未来之事的认识视为倾向性的，便可为神圣预知与自由行动之和解提供一条途径（见下一节）。然而，一个拥有全知这一浩瀚能力的存在，竟会对自己所知之物的任何部分都毫无察觉，这实在难以理解。
