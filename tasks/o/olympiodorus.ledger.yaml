      The best way to understand the circumstances of his life is to get a sense of the final period of pagan philosophy in the age of Justinian (for a more detailed account, see Wildberg 2005, with further references)[^wildberg-2005]. For our purposes, the most crucial factor is that in the age of Justinian, philosophy, as a discipline taught in schools of higher education, had acquired a highly ambiguous status. On the one hand, almost anyone in the empire was perfectly aware that Justinian had, right from the beginning of his reign, taken severe measures to eradicate philosophy as a way of pagan life and learning, both private and public. The closing of the Athenian School around 529 (with an apparent expropriation of its assets) was only the most notorious instance. On the other hand, members of the elite were also acutely aware that it was impossible to sustain the culture of the empire, both secular and clerical, without a classical education, part of which was and always has been philosophy. Training in philosophy was all the more necessary since only a firm grounding in logic and ontology could prepare one in a meaningful way for participation in the subtle theological debates that dominated the best minds at the time, notably the intractable problem of the nature of Christ: Does Christ have two natures, one human, one divine, or one compound nature? How can one possibly understand the simultaneity of divinity and humanity in a single substance? One could not hope to become an expert in theology (then regarded as the highest form of philosophy) without a decent grasp of the works of Aristotle and Plato. And so, under the emperor who did perhaps more than anyone to dismantle philosophy as a profession, philosophy flourished — in Alexandria especially and elsewhere — in a manner unparalleled in late antiquity.
    step1: |-
      理解其生平处境的最好办法，是感受查士丁尼时代异教哲学的末段光景（更详细的叙述见 Wildberg 2005，附进一步文献）[^wildberg-2005]。对我们而言，最关键的因素是：在查士丁尼时代，哲学作为高等教育学府所授的一门学科，地位已变得极为暧昧。一方面，帝国境内几乎人人都清楚，查士丁尼自登基之初便采取严厉措施，要根除作为异教生活与学问方式——无论私人的还是公共的——的哲学。529 年前后关闭雅典学园（显然还没收了其资产），不过是最臭名昭著的一例。另一方面，精英阶层也同样敏锐地意识到，没有古典教育，帝国的文化——世俗的与教会的——便难以为继，而古典教育的一部分，向来且始终是哲学。哲学训练之所以尤为必要，还因为唯有坚实的逻辑学与本体论根底，才能让人有意义地参与当时主导最优秀头脑的那些精微神学论辩，尤其是那道难解的基督本性之谜：基督有兩性、一人性一神性，还是有一个合成之性？一个单一实体中神性与人性的同时并存，究竟该如何理解？一个人若不能相当好地掌握亚里士多德与柏拉图的著作，就休想成为神学专家（当时神学被视为哲学的最高形态）。于是，在这样一位或许比任何人都更致力于拆解哲学这一行当的皇帝治下，哲学反倒繁荣起来——尤其在亚历山大里亚，别处亦然——其盛况为古代晚期所仅见。
    step2: |-
      要理解他的生平处境，最好先感受一下查士丁尼时代异教哲学的末段光景（更详细的叙述见 Wildberg 2005，附参考书目）[^wildberg-2005]。对我们来说，最关键的一点是：在查士丁尼时代，哲学作为高等学府所授的一门学科，地位已变得极为暧昧。一方面，帝国境内几乎人人都清楚：皇帝自登基之初便厉行严法，要铲除哲学作为异教生活与学问方式——私人的、公共的都在内。529 年前后关闭雅典学园（连带显然没收了学园资产），只是其中最臭名昭著的一桩。另一方面，精英阶层也同样清醒：没有古典教育，帝国的文化——世俗的与教会的——便难以为继；而古典教育的一部分，向来也始终是哲学。哲学训练之所以尤为必要，还因为唯有坚实的逻辑学与本体论根底，才能让人有意义地参与当时主导最优秀头脑的那些精微神学论辩，尤其是那道难解的基督本性之谜：基督有兩性——一人性、一神性——还是有一个合成之性？单一实体中神性与人性并存，究竟该如何理解？一个人若不相当熟悉亚里士多德与柏拉图的著作，就休想成为神学专家（当时神学被视为哲学的最高形态）。于是，在这位或许比谁都更致力于拆毁哲学这一行当的皇帝治下，哲学反倒繁荣起来——亚历山大里亚尤盛，别处亦然——其气象为古代晚期所仅见。
