      Olympiodorus refrains from discussing falsehood or truth in philosophical matters (the latter somewhat abstractly enshrined for him in ‘common notions’ [*koinai ennoiai*]; see Tarrant 1997, esp. 188–192)[^tarrant-1997]. The reason may not have been that he harbored no such convictions but that it would have been inappropriate or unwanted to propound them in the classroom. Very often, what has proved most interesting to modern scholars for historical reasons are remarks made entirely in passing, for example, the intriguing statement that some of the endowment of the Academy in Athens was still intact in his time (*in Alc.* §141.1f.); that the Alexandrian rhetorician Anatolius adapted a line of Homer to great effect in the year 546 (*in Alc.* §2.79–82); or that suicide is forbidden because, according to the Orphic tradition, “human bodies belong to Dionysus” (*in Phaed.* §1.3).
    step1: |-
      奥林匹奥多罗斯在哲学问题上回避谈论真假（对他来说，真多少有些抽象地寓于"共同观念"［*koinai ennoiai*］之中；见 Tarrant 1997，尤其 188–192 页）[^tarrant-1997]。原因也许并非他胸中无此信念，而是课堂上宣讲这些信念并不合适或不受欢迎。常常正是那些全属顺带而发的评论，因历史的原因最令现代学者感兴趣，例如：他说雅典学园的部分基金在他那个时代仍完好无损（*in Alc.* §141.1f.）；亚历山大里亚的修辞学家阿纳托利乌斯于 546 年把荷马的一行诗改写得效果极佳（*in Alc.* §2.79–82）；又或者，自杀之所以被禁止，是因为按俄耳甫斯派的传统，"人的身体属于狄奥尼索斯"（*in Phaed.* §1.3）。
