      This effort to stem the tide of cultural pauperization was carefully packaged and structured without depriving the lecturer of the necessary flexibility: each class (*praxis*) was divided into three sections. The reading of the original Platonic (or Aristotelian) text was followed by an ‘overview’ of the passage (*theôria*), which in turn segued into a closer reading (*lexis*). The overview allowed the professor to make all kinds of general remarks on the significance and meaning of the passage under discussion; the close reading presented more detailed and often simply philological, linguistic, logical, or rhetorical observations not unlike those found in modern annotated editions. Dividing one’s comments into these two sections seems to be a formalized development of Proclus’ method (see Beutler 1949, 226)[^beutler-1949].
    step1: |-
      这一遏止文化贫化之潮的努力，经过了精心的包装与结构安排，同时又不使讲授者失去必要的灵活性：每一堂课（*praxis*）分为三段。先诵读柏拉图（或亚里士多德）原文，继而是对该段落的"要义通观"（*theôria*），最后转入更细的"文辞疏解"（*lexis*）。要义通观让教授得以对所论段落的意义与含义作种种一般性评论；文辞疏解则给出更细致、往往纯属语文学、语言学、逻辑学或修辞学的观察，与现代笺注本中所见者不无相似。把评论分为这两段，似乎是普罗克洛斯方法的程式化发展（见 Beutler 1949, 226）[^beutler-1949]。
    step2: |-
