      Olympiodorus begins his commentary on Plato’s *Alcibiades* with a grand gesture: “Aristotle began his Theology with the words: ‘All men by nature desire to know, and evidence for this is our love of perception.’ But as I begin to speak about Plato’s philosophy, I would say this, which is better, that all men have a desire for Plato’s philosophy because all men want to draw something useful from it; they hurry to be spell-bound by its fountain and stand still only when they are full of Platonic enthusiasm.” Olympiodorus is working hard to galvanize his audience with a passion for Plato. It is characteristic of his entire work that he holds out for them the prospect that something worthwhile can be gained from the study of Plato and not only his writings but also his life (Motta 2021)[^motta-2021].
    step1: |-
      奥林匹奥多罗斯以一个大手笔开讲柏拉图《阿尔喀比亚德篇》："亚里士多德在《神学》开篇说：'一切人天生欲求知识，证据便是我们对感知的喜爱。'然而，当我开始谈论柏拉图的哲学时，我要说一句更妙的话：一切人都欲求柏拉图的哲学，因为人人都想从中取得某种有用的东西；他们急急赶来，被它的泉源所迷，直到满怀柏拉图式的热情才肯驻足。"奥林匹奥多罗斯是在竭力以对柏拉图的热爱点燃听众。他整个治学风格的一个特点，就是为学生摆出一个前景：研习柏拉图——不只是他的著作，还有他的一生——可以有所获益（Motta 2021）[^motta-2021]。
    step2: |-
      奥林匹奥多罗斯开讲柏拉图《阿尔喀比亚德篇》，出手便是一个大手笔："亚里士多德在《神学》开篇说：'一切人天生欲求知识，证据便是我们对感知的喜爱。'可我开讲柏拉图哲学时要说一句更妙的话：一切人都欲求柏拉图哲学，因为人人都想从中得到有用的东西；他们急急赶来，被这泉源迷住，直到满怀柏拉图式的热情才肯驻足。"他在竭力以对柏拉图的热爱点燃听众。这可以说是他全部治学风格的特点：为学生摆出一个前景——研习柏拉图，不只是其著作，还有其一生，都能有所获益（Motta 2021）[^motta-2021]。
