      ## 5. Influence
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      The teaching of philosophy did not cease with the death of Olympiodorus. He had intelligent pupils who devoted themselves to philosophy in a professional way. Whether they were pagans or Christians is unclear, but their commentaries were passed around under such names as David and Elias (see Wildberg 1990)[^wildberg-1990]. We can tell that Olympiodorus influenced them because they referred to him and adopted his pedagogical method of dividing their lectures into *theôriai* and *lexeis*. The same goes for Stephanus of Alexandria, who taught philosophy in Constantinople at the beginning of the 7ᵗʰ century.
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Olympiodorus’s wider influence is somewhat less tangible than that of the other great Alexandrians. The Syrians and the Arabs certainly knew and read him, but not extensively. Neither did the Latin West. The commentary on the *Categories* has come down to us in only one manuscript (*Codex Mutinensis* 69), and there are only a handful of manuscripts of the *Meteorology* commentary. Manuscripts of his commentaries on Plato are equally rare, except those containing the commentary on Plato’s *Phaedo*.
