      Worthwhile in what sense? Olympiodorus hands his students the shards and tesserae that could amount to classical *paideia* in the appropriate number and arrangement as if piecing together a Byzantine mosaic. His commentaries on Plato abound with references to Homer, Demosthenes, the 2ⁿᵈ-century C.E. orator Aelius Aristides, Plutarch, Epictetus, and Aristotle, as well as works of Plato other than the one being commented on, notably the *Republic*, which his students had not read yet. One sees that Olympiodorus gently but firmly directs his pupils’ attention to an intellectual world waiting for them to discover — if they want to. We are entering a period in late antiquity in which Plato and Aristotle cease to be gateways to the ‘truth’ and turn into icons of cultural heritage worth keeping alive for practical purposes. Olympiodorus has rightly been called “the first classicist” (Tarrant 1997)[^tarrant-1997].
    step1: |-
      在什么意义上获益？奥林匹奥多罗斯把一片片碎瓦与嵌石交到学生手里——数量与排布得宜，便可拼成古典*文化教养*，就像镶嵌一幅拜占庭马赛克。他的柏拉图注疏中处处引及荷马、狄摩西尼、2 世纪演说家埃利乌斯·阿里斯泰德斯、普鲁塔克、爱比克泰德与亚里士多德，也引及柏拉图正在被注疏的那篇之外的其他作品——尤以《理想国》为多，而学生尚未读过。可以看出，奥林匹奥多罗斯温和而坚定地把学生的注意力引向一个有待他们去发现的思想世界——如果他们愿意的话。我们正进入古代晚期的一个阶段：柏拉图与亚里士多德不再通往"真理"，而变成了值得为实用目的保存下去的文化遗产偶像。奥林匹奥多罗斯被恰当地称为"第一位古典学家"（Tarrant 1997）[^tarrant-1997]。
    step2: |-
