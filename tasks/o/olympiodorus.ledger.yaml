      At times, the underlying tensions rise to the surface, but Olympiodorus was expertly evasive of trouble from the audience. In his 44ᵗʰ lecture on the *Gorgias*, for instance, he reassures his students that pagan myths ought not to be taken literally; one ought to understand that names such as Zeus and Hera and Hades were merely part of the language in which ‘they’ (i.e., the ancient Greeks) talked. Puzzled by the dizzying and conflicting possibilities of allegorical interpretations of myth if they are not taken literally, one obstinate student must have intervened, for Olympiodorus makes the following evasive remark (§44.7): “If someone says ‘Then neither ought we put trust in philosophers, since they are in disagreement, some saying the soul is water, others that it is air, some that it is mortal, others that it is immortal,’ we reply that in this case, we put our trust in those who stay closer to the common notions. But [in myths], no common notions guide our education. Hence, we should first explain the myths — for indeed, Plato explicates them. So he said earlier … .”
    step1: |-
      有时，底下的张力会浮出水面，但奥林匹奥多罗斯总能老练地避开听众带来的麻烦。例如在《高尔吉亚篇》的第 44 讲中，他安抚学生说，异教神话不应作字面理解；应当明白，宙斯、赫拉、哈得斯这类名字，不过是"他们"（即古希腊人）言谈所用语言的一部分。若神话不作字面理解，其寓意解释的可能性便多得令人目眩，又相互冲突；一位固执的学生想必插了话，因为奥林匹奥多罗斯作了如下回避性的回应（§44.7）："若有人说：'那么我们也不该信任哲学家了，因为众说纷纭，有人说灵魂是水，有人说是气，有人说它可死，有人说它不死'，我们就回答说：在此情形下，我们信任那些更贴近共同观念的人。但在［神话中］，并没有共同观念指引我们的教育。因此，我们应当先解释神话——因为柏拉图本人就解释了它们。所以他在前面说……。"
