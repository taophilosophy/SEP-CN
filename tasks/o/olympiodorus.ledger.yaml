      偶尔，我们会遇到一则关于阿莫尼俄斯的轶事；奥林匹奥多罗斯敬重阿氏，屡屡援引他来抬高自己的权威。其中一则故事暗示了帝国统治与哲学家政治观点之间的紧张。在《高尔吉亚篇》注疏接近末尾处（§42），奥林匹奥多罗斯赞同这样一种看法：贵族制是最好的政体，远优于民主制；他为此给出的理由是：城邦正如人一样，是一个应当像"宇宙"这个大写宇宙的小宇宙。但这个论证似乎更利于君主制，因为正如宇宙由一位即神统治，这里也"不应由某些寻常百姓来统治，而应由一位明智而真正的政治家来统治"。奥林匹奥多罗斯接着说："那么，若有人说：'可这是君主制，不是贵族制，二者不是一回事'，就像哲学家阿莫尼俄斯那样回答他：'给他指节，再夸他一句。因为二者是一回事……哪怕有许多极好的人，他们也构成一个活的统一体，因为他们一切共有。'"（§42.2）
