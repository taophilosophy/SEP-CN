      ## 4. Olympiodorus the Alchemist
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Discussion of the commentary on Aristotle’s *Meteorology* with the so-called ‘chemical treatise’ as its fourth book prompts the question of the identity of the Neoplatonist Olympiodorus with another figure carrying precisely the same name who appears in the alchemist tradition. Four extant manuscripts of an alchemical work that purports to be a commentary on Zosimus’ *Kat’ energeian* (*On Activity*) state that the piece was written by “Olympiodorus, the Alexandrian philosopher” (see §6 below). The alchemical treatise starts as a commentary on Zosimus (of Panopolis, not the 5ᵗʰ c. C.E. historian), explaining a small passage in some detail, but then continues in the vein of a didactic letter written to an unnamed fellow alchemist (called ‘friend of the Muses’ at one point). It ‘explains’ how to join scattered parts of gold and purify metals, emphasizes the significance of ‘divine water’ (whatever that is), and so on. The author knows a smidgen about the Presocratics (whom he regards as alchemists) but next to nothing about Plato and Aristotle; instead, he can quote at length from Zosimus, Hermes, Petasius, Pelagius, and a “divine Mary” — not the mother of Jesus but a Jewish sage elsewhere attested in the alchemist tradition.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      A closer survey of the text suggested to scholars like H.D. Saffrey 2005 that the Neoplatonist philosopher could not have produced the alchemical treatise. For one thing, unlike the philosopher, the alchemist seems to be a Christian, attributing a saying by Paul (“The letter kills, but the spirit gives life.” 2 Cor. 3.6) to “the Lord” (94, 13–15). In addition, the contents, style, diction, and rhetorical ambiance created by the two authors are strikingly different (see also Opsomer 2011, Griffin 2017)[^griffin-2017]. However, C. Viano, who once defended the identity of the two figures, draws attention to striking similarities in structure and language between the alchemical treatise and the commentary on Book IV of Aristotle’s *Meteorology* (see Viano 2006 and 2021)[^viano-2006][^viano-2021]. She proposes that Olympiodorus indeed wrote a commentary on Zosmimus, but this, or part of it, was later altered and expanded by a compiler who added excerpts and digressions from elsewhere.
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      In any case, it seems clear that the extant commentary on Zosimus’ *On Activity* is not simply another work by the Neoplatonist Olympiodorus; he most likely did not write *this* piece of alchemy. Nevertheless, the manuscripts refer to him as the work’s author. If Viano is right, what we have is not a straightforward case of pseudepigraphy (otherwise not an uncommon characteristic of the genre of alchemist literature) but, more interestingly, a mixture of genuine attribution, intellectual appropriation, and literary expansion. It would also follow that there was never another Alexandrian named Olympiodorus steeped in the arcane science of alchemy instead of Platonic philosophy. Above all, the alchemist manuscript would be a testimony to the influence of Olympiodorus in Late Antiquity.
