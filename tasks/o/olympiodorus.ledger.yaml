    source: |-
      Olympiodorus of Alexandria, presumably a late pupil of Ammonius Hermeiou, the commentator on Aristotle and teacher of Simplicius and Philoponus, was one of the last pagans to teach philosophy at the school of Alexandria in the 6ᵗʰ century. He interpreted classical philosophical works in his lectures, mainly texts by Plato and Aristotle; we still possess three of his commentaries on Plato and two on Aristotle. At times, these lectures read like carefully crafted pieces of pedagogy, but at other times, they read more like more or less successful transcripts drawn up by a student. Although Olympiodorus comes across as a learned man and guardian of traditional *paideia*, both literary and philosophical, his œuvre compares unfavorably, from a philosophical standpoint, with commentaries written by either Ammonius or Olympiodorus’ contemporaries, such as Simplicius and John Philoponus. Still, his work is valuable in that it affords us vivid insights into how pagan philosophy was taught to the youth of Christian elites who, for the most part, would move on to careers in the clergy or at the Byzantine court. The 6th-century Alexandrian Olympiodorus must be distinguished from another Olympiodorus who supposedly lived in the first half of the 5ᵗʰ century C.E. and was said by Marinus in his *Life of Proclus* to have been a teacher of Proclus at Athens. No other evidence of this earlier figure survives. The relationship of the younger philosopher Olympiodorus to an alchemist, supposedly of the same name and provenance, remains disputed.
    step1: |-
      亚历山大里亚的奥林匹奥多罗斯（Olympiodorus of Alexandria）大概是阿莫尼俄斯（Ammonius Hermeiou）的晚期弟子。阿氏是亚里士多德注疏家，也是辛普里丘与菲洛波努斯的老师。奥林匹奥多罗斯是 6 世纪最后一批在亚历山大里亚学园讲授哲学的异教徒之一。他在讲授中诠释古典哲学著作，主要是柏拉图与亚里士多德的文本；他的柏拉图注疏今存三部，亚里士多德注疏存两部。这些讲稿有时读来像精心打磨的教学范本，有时则更像由学生整理、成败不一的课堂记录。奥林匹奥多罗斯给人以博学之士、传统*文化教养*（*paideia*）——文学的与哲学的——守护者的印象；但从哲学立场看，其著述比之阿莫尼俄斯或他同时代人如辛普里丘、约翰·菲洛波努斯的注疏，仍显逊色。尽管如此，他的作品自具价值：它让我们生动地看到，异教哲学是如何教给基督教精英子弟的——这些年轻人后来大多走上神职或拜占庭宫廷的仕途。6 世纪的亚历山大里亚的奥林匹奥多罗斯，须与另一人区分：据说那位奥林匹奥多罗斯生活于公元 5 世纪上半叶，马里努斯在《普罗克洛斯传》中说他是普罗克洛斯在雅典的老师。这位更早的人物并无其他证据留存。年少的那位哲学家奥林匹奥多罗斯与一位据称同名、同籍的炼金术士有何关系，至今仍有争议。
    step2: |-
      亚历山大里亚的奥林匹奥多罗斯（Olympiodorus of Alexandria）大概是阿莫尼俄斯（Ammonius Hermeiou）的晚期弟子——阿氏是亚里士多德注疏家，辛普里丘与菲洛波努斯之师。奥林匹奥多罗斯是 6 世纪最后一批在亚历山大里亚学园讲授哲学的异教徒之一。他借讲授诠释古典哲学著作，以柏拉图、亚里士多德的文本为主；其柏拉图注疏今存三部，亚里士多德注疏存两部。这些讲稿有时读来像精心打磨的教学范本，有时则更像学生整理出来的课堂记录，成败不一。奥林匹奥多罗斯给人的印象，是博学之士、传统*文化教养*（*paideia*）的守护者——文学的与哲学的皆然；但就哲学立场而言，其著述比起阿莫尼俄斯或辛普里丘、约翰·菲洛波努斯这些同时代人的注疏，仍显逊色。尽管如此，他的作品自有价值：它让我们生动看见，异教哲学是怎样教给基督教精英子弟的——这些年轻人后来大多走上神职或拜占庭宫廷的仕途。6 世纪亚历山大里亚的奥林匹奥多罗斯，须与另一人分清：据说那位奥林匹奥多罗斯生活于公元 5 世纪上半叶，马里努斯在《普罗克洛斯传》里称他是普罗克洛斯在雅典的老师。这位更早的人物，别无其他证据留存。年少那位哲学家奥林匹奥多罗斯与一位据称同名同籍的炼金术士是何关系，至今聚讼未决。
