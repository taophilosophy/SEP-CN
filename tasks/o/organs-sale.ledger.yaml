      ### 2.2 The Saving of Lives
    step1: |-
      ### 2.2 拯救生命
    step2: |-
      ### 2.2 拯救生命
  - id: 22
    kind: body
    source: |-
      This argument is straightforward. Permitting (or encouraging) organ sale will, it is claimed, save lives by (at least partially) alleviating the shortage of transplant organs. The saving of lives is a good end and organ sale is then defensible as a means of achieving that positive end.
    step1: |-
      这一论证直截了当。据称，允许（或鼓励）器官买卖将通过（至少部分地）缓解移植器官短缺而拯救生命。拯救生命是一个好目的，器官买卖因而可作为一种达成该正面目的的手段而得到辩护。
    step2: |-
      这条论证简明：允许（或鼓励）器官买卖能（至少部分）缓解移植器官的短缺，从而救人性命。救命是善的目的，器官买卖作为达成该目的的手段，便站得住。
  - id: 23
    kind: body
    source: |-
      The shortage of transplant organs is a major worldwide public health problem. According to the US Department of Health and Human Services Organ Procurement and Transplantation Network, there are approximately 123,000 patients on transplant waiting lists in the US and around 300,000 patients waiting for an organ transplant in China (The Economist 2014)[^economist-2014]. In the US in 2014, the overall median waiting time for a kidney transplant was over three and a half years (National Kidney Foundation 2014). The situation is similar in the UK (Department of Health 2014). Furthermore, waiting list sizes do not even fully reflect the actual level of need because doctors are sometimes reluctant even to list patients who they feel do not stand a realistic chance of getting an organ in time. (see Other Internet Resources section below).
    step1: |-
