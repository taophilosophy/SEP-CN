      One initial response to the ‘coercion by poverty’ refers us back to the fact that almost all serious defenders of organ sale are arguing not for unfettered international trafficking in transplant organs but rather for a regulated system of compensation. Within the context of a regulated system (particularly that advocated by Erin and Harris, which would be limited to one economic area) there is no reason to believe that most organ sellers would be desperately poor. Organ sale may admittedly be *more* attractive to those with the least money (for why would someone rich need or want to sell an organ?) and some critics of organ sale (Malmqvist 2014: 28)[^malmqvist-2014][^malmqvist-2014-2] have argued that “Coercive pressure on vendors cannot be ruled out even in countries with welfare systems and universal health care, in part because even these countries have poor populations vulnerable to such pressure”. But then much the same can be said of some of the least sought-after and worst paid agricultural and cleaning jobs, and we do not generally say that people cannot consent to do these or that these types of employment should be banned.
    step1: |-
      对“贫困胁迫”的一种初步回应，把我们带回到这一事实：几乎所有认真的器官买卖辩护者所主张的，都不是无拘无束的国际移植器官贩运，而是受监管的补偿制度。在受监管制度（尤其是 Erin 与 Harris 所倡导、限于一个经济区的制度）的语境中，没有理由相信多数器官出售者会极度贫困。诚然，器官买卖对钱最少的人可能 *更* 有吸引力（富人何须或何必要卖器官？），一些批评者（Malmqvist 2014: 28）[^malmqvist-2014][^malmqvist-2014-2]也论证说，“即便在有福利制度与全民医保的国家，也不能排除对出售者的胁迫压力，部分原因是这些国家同样有易受此类压力的贫困人口”。但同样的话也可用于某些最不受欢迎、报酬最差的农业与清洁工作，而我们一般并不因此说人们不能同意去做这些工作，也不说这类就业应予禁止。
    step2: |-
      对“贫困胁迫”的初步回应，是回到这个事实：认真主张器官买卖的人，几乎都不是要无拘无束的国际器官贩运，而是要受监管的补偿制度。在受监管的制度里（尤其是 Erin 与 Harris 那种限于单一经济区的设计），没有理由认为多数出售者会穷到绝境。诚然，卖器官对钱最少的人可能 *更* 有吸引力（富人何须、何苦卖器官？）；也有批评者（Malmqvist 2014: 28）[^malmqvist-2014][^malmqvist-2014-2]说，“即便在有福利制度与全民医保的国家，也不能排除对出售者的胁迫压力，部分原因是这些国家也有易受此类压力影响的贫困人口”。可这话同样适用于某些最没人愿干、报酬最低的农活与清洁工作，而我们一般并不因此说人不能同意去做，也不说这类工作该禁。
