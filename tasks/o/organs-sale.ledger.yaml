      Kidneys may then be different in practical respects from (say) blood. For if there is no substantial system of free donation in place, then free donation cannot be undermined by permitting sale. But if an almost adequate system of free donation does exist (as, in many countries, it does with blood) then there is a serious possibility of its being undermined. Thus, the argument which says that what is wrong with sale is that free donation would be undermined might well work for blood, even if it does not for kidneys. The same might be true of the arguments in favour of an altruistic blood system proposed by Titmuss and others. Perhaps the voluntary blood donation system (and indeed a voluntary posthumous organ donation system) can be used as a method of encouraging a valuable culture of altruism, but this is much less likely to work in the case of living organ donation (Archard 2002; Campbell 2009; Titmuss 1997)[^archard-2002][^campbell-2009][^titmuss-1997].
    step1: |-
      因此，肾脏在实际方面可能与（比如说）血液不同。因为若尚无成规模的无偿捐赠制度，无偿捐赠便不可能因允许买卖而被削弱。但若已经存在一个几乎够用的无偿捐赠制度（如许多国家的血液那样），那它就有被严重削弱的现实可能。于是，“买卖之所以错，在于会削弱无偿捐赠”这一论证，对血液或许管用，对肾脏则未必。Titmuss 等人支持利他主义血液制度的论证可能亦然。也许自愿献血制度（乃至自愿身后器官捐赠制度）可用作培育可贵利他文化的方法，但这在活体器官捐赠情形中要难得多（Archard 2002; Campbell 2009; Titmuss 1997）[^archard-2002][^campbell-2009][^titmuss-1997]。
    step2: |-
      所以，肾与血在实际层面可能不同。若本无成规模的无偿捐赠制度，无偿捐赠也就无从因允许买卖而被侵蚀；但若已有近乎够用的无偿捐赠制度（许多国家的血液即如此），被严重侵蚀便是现实风险。于是“买卖之错在于侵蚀无偿捐赠”这条论证，对血或可成立，对肾则未必。Titmuss 等人主张利他主义的血液制度，其论证道理亦然：自愿献血（乃至自愿身后器官捐赠）或可用来培育可贵的利他文化，但换到活体器官捐赠，收效恐怕差得多（Archard 2002; Campbell 2009; Titmuss 1997）[^archard-2002][^campbell-2009][^titmuss-1997]。
