      Opposition to the Saving of Lives Argument takes one of two forms. It may be objected to empirically, with the critic arguing either that permitting organ sale would be ineffective or that an alternative system would work better: for example, the ways in which we approach bereaved relatives could be improved, as could the ways in which the possibility of (unpaid) living donation is publicized, or there could be a move to a Mandated Choice or Presumed Consent system (Hinkley 2005)[^hinkley-2005]. Alternatively, one might concede the empirical point that allowing organ sale would be an effective option, but nonetheless argue that there are sufficiently strong countervailing (moral or practical) reasons to justify leaving the prohibition on sale in place. These reasons are the subject of some later sections.
    step1: |-
      对“拯救生命”论证的反对意见有两种形式。其一为经验性反对，批评者或论证允许器官买卖将无效，或论证替代制度会更有效：例如改进与丧亲亲属的沟通方式，改进对（无偿）活体捐赠可能性的宣传，或转向“强制选择”或“推定同意”制度（Hinkley 2005）[^hinkley-2005]。另一种则承认允许器官买卖会是有效选项这一经验判断，但仍论证有足够强的（道德或实践上的）反制理由，足以让买卖禁令维持不变。这些理由属于后文若干节的主题。
    step2: |-
      反对“拯救生命”论证的路数有两种。一种是经验性反对：批评者或说允许买卖不会有效，或说别的办法更管用，例如改进与丧亲亲属的沟通、改进对（无偿）活体捐赠的宣传，或改行“强制选择”“推定同意”制度（Hinkley 2005）[^hinkley-2005]。另一种则承认允许买卖确实有效，但仍主张存在足够强的（道德或实践）反制理由，足以维持禁令。这些理由留待后文若干节讨论。
