      Many authors have pointed out that there appears to be no fundamental difference between selling organs and other widely accepted practices, particularly selling one’s own ‘risky labour’ (work that involves a risk of harm that is the same as or greater than that involved in organ donation) (Harris 1992; Brecher 1990, 1994; Wilkinson & Garrard 1996)[^brecher-1990][^harris-1992][^wilkinson-1996]. Furthermore, common forms of ‘risky labour’ (coal mining, deep-sea diving, fire fighting, military service in a just war, etc.) are often *more* dangerous than selling a kidney, but are regarded as heroic, rather than condemned; it is seen as just and proper to reward those who do these things. This difference in attitude cannot be justified in terms of the good consequences that ‘risky labour’ produces, since the consequences of an organ sale (often, saving a life) may be just as good or better. Therefore, it is inconsistent to allow people to be paid for ‘risky labour’ while not allowing them to be paid for their organs. Savulescu (2003, 138) makes the point as follows:
    step1: |-
      许多作者指出，出售器官与其他广泛接受的做法之间似乎并无根本区别，尤其是出售自己的“危险劳动”（即涉及伤害风险与器官捐赠相同或更大的工作）（Harris 1992; Brecher 1990, 1994; Wilkinson & Garrard 1996）[^brecher-1990][^harris-1992][^wilkinson-1996]。此外，常见形式的“危险劳动”（采煤、深海潜水、消防、正义战争中的兵役等）往往比卖肾 *更* 危险，却被视为英雄行为而非受谴责之举；人们认为给予从事这些工作的人报酬是公正而恰当的。这种态度上的差异无法用“危险劳动”所产生的善的后果来辩护，因为器官出售的后果（常常是拯救一条生命）可能同样好甚至更好。因此，允许人们因“危险劳动”获得报酬，却不允许他们因自己的器官获得报酬，是不一致的。Savulescu（2003, 138）如此表述这一要点：
