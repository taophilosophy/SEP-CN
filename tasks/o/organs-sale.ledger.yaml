      Perhaps more importantly, though, we must remember that, in any case, most of these concerns about coercion and poverty can be dealt with by having a controlled system such as the Erin-Harris proposal. Of course it is not the case that there is no unfair poverty within the Western countries that they have in mind. And so, even under the Erin-Harris system, some account would have to be taken of the coercion by poverty argument. Perhaps, for example, we would want to say that, in order for the national organ purchasing agency not to be coercing-by-poverty it needs to be the case that there is a minimum wage law and a welfare state that are at least close to being fair, so that there is no significant poverty in society for which the state is morally responsible (either actively or by omission). This is probably a lot to ask but then we must remember that any actual organ sale system, along with all other aspects of the economy, is unlikely to be perfect; and, provided that the organ sale system is not substantially more exploitative or harmful than most other widely accepted economic transactions then it would seem arbitrary and unfair to single it out for particular condemnation or prohibition.
