      It is not hard to see how, in principle, this style of coercion argument could work against organ sale. What is much harder is working out whether, in most of the cases envisaged, organ buyers have a duty to alleviate the poverty. The case most often discussed is where the organ purchaser is a rich Westerner and the vendor is someone desperately poor from the developing world. The Westerner, it is said, uses poverty to ‘force’ (coerce) the poor person into giving up the organ. This *may* be the case if the Westerner has a duty to alleviate the prospective organ seller’s poverty. But, as well as difficult general questions about global distributive justice and the like, there is also the question of whether the individual in question is directly responsible for alleviating the other’s poverty in these cases. The problem with attributing responsibility to individual organ purchasers is that the extent to which they have a positive ‘duty to rescue’ those in dire poverty may vary enormously depending on their own positions of wealth and power, and on the extent to which they have already done virtuous things in an attempt to act on their duties towards the poor. For example, a Western organ purchaser could have already devoted a large part of their income and time to charitable projects aimed at the alleviation of poverty and may herself have relatively little money – just enough to buy a kidney. Do we really want to say that such a person has a duty to give their money to the prospective organ vendor without receiving the kidney (without which she may well die) in return?
    step1: |-
      原则上不难看出，这种胁迫论证如何能对器官买卖奏效。更难的是弄清：在所设想的大多数情形中，器官买者是否负有减轻贫困的义务。最常讨论的情形是：器官购买者是有钱的西方人，而出售者是发展中世界某个极度贫困的人。据说，西方人利用贫困“迫使”（胁迫）穷人就范、交出器官。这 *可能* 成立——如果西方人负有减轻潜在器官出售者贫困的义务。但除了关于全球分配正义之类的困难的一般问题之外，还有另一个问题：在这些情形中，该个体是否直接负有减轻他人贫困的责任。把责任归于个人器官购买者的困难在于：他们负有帮助极度贫困者的正面“救助义务”的程度，可能因其自身财富与权力地位、因其为履行对穷人的义务已做过多少善事而大不相同。例如，一个西方器官购买者可能早已把大部分收入与时间投入以减贫为目标的慈善项目，本人钱也不多——只够买一个肾。我们真的要说，这样一个人有义务把钱给潜在器官出售者而不换回肾（没有肾她很可能死掉）吗？
