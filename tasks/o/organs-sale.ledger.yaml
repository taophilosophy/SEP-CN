      The first, and most straightforward, objection to organ sale is that it is excessively harmful or dangerous for paid organ donors. Illicit organ trafficking often does involve excessive and unacceptable levels of harm. But, as mentioned earlier, when considering the moral permissibility of organ sale, it is advisable to focus not on the worst case, but rather on the likely level of harm that would occur within a properly regulated system. Once this is borne in mind, the harm argument against organ sale appears vulnerable to a number of objections.
    step1: |-
      对器官买卖的第一项、也是最直接的反对意见是：它对有偿器官捐赠者伤害过大或过于危险。非法器官贩运确实常涉及过度且不可接受的伤害水平。但如前所述，在考虑器官买卖的道德可允许性时，明智的做法不是聚焦于最坏情形，而是聚焦于在监管得当的制度内可能出现的伤害水平。一旦记住这一点，反对器官买卖的伤害论证就显得易受若干反驳。
    step2: |-
      对器官买卖最先也最直接的反对是：它对有偿捐赠者过于有害或危险。非法器官贩运确常造成过度且不可接受的伤害。但如前所述，评估器官买卖的道德可允许性时，不宜盯住最坏情形，而应看一个监管得当的制度下可能出现的伤害水平。这样一看，反对器官买卖的伤害论证便有若干可乘之隙。
