      A slightly different tack is to invoke the idea of coercion by circumstances, specifically coercion by poverty (Annas 1984; Rippon 2014; Torcello & Wear 2000)[^annas-1984][^rippon-2014][^torcello-2000]. Thus, someone might argue that even though valid consent from ‘desperate’ people is possible in principle for the reasons just given, consent will normally be invalid when the person consenting (e.g., to selling a kidney) is coerced by poverty. The difference between coercion by poverty and Radcliffe Richards’ cancer example is supposed to be that whereas the cancer is a morally neutral natural occurrence, the poverty (at least in some cases) is the result of immoral acts and policies; it is unjust poverty.
    step1: |-
      一个略有不同的路数是援引“环境胁迫”的观念，具体说是贫困胁迫（Annas 1984; Rippon 2014; Torcello & Wear 2000）[^annas-1984][^rippon-2014][^torcello-2000]。因此，有人可能论证说：尽管基于刚才所说的理由，原则上“绝望”者的有效同意是可能的，但当同意者（例如同意出售肾脏）是被贫困所胁迫时，其同意通常会是无效的。贫困胁迫与 Radcliffe Richards 的癌症例子之间的区别，据说在于：癌症是道德上中立的自然事件，而贫困（至少在某些情形中）是不道德的行为与政策的结果；它是不义的贫困。
    step2: |-
      另一条路数稍异：援引“环境胁迫”，具体说即贫困胁迫（Annas 1984; Rippon 2014; Torcello & Wear 2000）[^annas-1984][^rippon-2014][^torcello-2000]。有人会说：尽管按上文的理由，“绝望”者的有效同意原则上可能，但当同意者（例如同意卖肾）被贫困所迫时，其同意通常无效。据说贫困胁迫与 Radcliffe Richards 的癌症一例的区别在于：癌症是道德中立的自然事件，贫困（至少在某些情形下）却是不道德行为与政策所致，属不义之贫。
