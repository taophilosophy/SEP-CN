      So in order for prospective organ purchasers to be coercing through poverty, they must be responsible for the poverty. This need not mean that they caused the poverty, for people may be responsible for (improving or preventing) situations that they have not themselves caused. Hence, another scenario in which the buyers may be responsible is if they have a positive duty to rescue the prospective sellers from poverty (and ‘for free’ rather than in exchange for an organ). This position is aligned with that of (for example) Wertheimer, who proposes that: “*A* coerces *B* to do *X* in a way that invalidates *B*’s consent only if *A* proposes to violate *B*’s rights or not fulfill an obligation to *B* if *B* chooses not to do *X*” (Wertheimer 2011, 143)[^wertheimer-2011].
    step1: |-
      因此，潜在器官购买者若要“通过贫困”进行胁迫，就必须对贫困负责。这不一定意味着他们造成了贫困，因为人们也可能对自己并未造成的情境负责（改善或防止）。因此，买者可能负责的另一种情形是：他们负有把潜在出售者从贫困中救出的正面义务（而且是“免费”救出，不是以器官交换）。这一立场与（例如）Wertheimer 的立场一致，他提出：“*A* 胁迫 *B* 做 *X*，且其方式使 *B* 的同意失效，仅当 *A* 提出：若 *B* 选择不做 *X*，则 *A* 将侵犯 *B* 的权利，或不履行对 *B* 的义务”（Wertheimer 2011, 143）[^wertheimer-2011]。
    step2: |-
      所以，买主若要“借贫困”胁迫，就得对贫困负责。未必是他们造成了贫困——人也可能对自己未造成的情境负责（改善或防止）。于是另一种可能的情形是：买主负有把潜在出售者从贫困中救出的正面义务，而且应当“无偿”救，不以器官为交换。这一立场与 Wertheimer 相合，他提出：“*A* 胁迫 *B* 做 *X*，且因此使 *B* 的同意失效，仅当 *A* 提出：若 *B* 选择不做 *X*，*A* 就要侵犯 *B* 的权利，或不履行对 *B* 的义务”（Wertheimer 2011, 143）[^wertheimer-2011]。
