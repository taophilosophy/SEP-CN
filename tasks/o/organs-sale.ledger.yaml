    kind: body
    source: |-
      Much the same goes for organ sale, or indeed (unpaid) organ donation. When we look at a person with a view to using their organs for transplantation we are of course viewing at least the organ, or possibly even the person, as a means to an end, and as a useful object. But this is not inconsistent with also respecting dignity and viewing people as ends-in-themselves provided that we take seriously their rational agency by requiring valid consent for the organ removal and by ensuring that any risk of harm is minimized and reasonable. The particular issues for organ sale (as opposed to free donation) then turn out to be those discussed at length in previous sections. Perhaps there is an increased risk that consent will be flawed in sale cases; if organ removal proceeded without proper consent then that could be a failure to respect the person. And perhaps there is an increased risk that harm will occur in sale cases; if so (and if the risk goes above a certain level) then perhaps this also would constitute a failure to respect the person. Thus the appeal to dignity, instrumentalisation, and objectification would seem merely to amplify some of the concerns aired previously about consent and harm. Furthemore, even where exploitation arguments enjoy some *prima facie* success, it does not *necessarily* follow that the practice in question is morally wrong, all things considered, or *a fortiori* that it should prevented. For, as Wertheimer puts it “we should generally permit mutually advantageous exploitation and concensual transactions, even if they are exploitative” (Wertheimer 2011, 253)[^wertheimer-2011].
    step1: |-
      器官买卖（乃至无偿器官捐赠）也大抵如此。当我们着眼于某人的器官以用于移植时，我们当然至少把器官、甚至可能把人当作达到目的的手段与有用的对象。但这与同时尊重尊严、把人视为自身即目的并不冲突——只要我们认真对待其理性能力，要求摘取器官须获有效同意，并确保任何伤害风险都被降到最低且合理。于是，器官买卖（相对于无偿捐赠）的特定问题，便落实为前几节详细讨论的那些问题。或许买卖情形中同意有缺陷的风险会增大；若器官摘取在未获正当同意的情况下进行，那就可能是对人格的不尊重。或许买卖情形中发生伤害的风险也会增大；若如此（且若风险超出某一限度），那或许同样构成对人格的不尊重。因此，诉诸尊严、工具化与对象化，似乎只是放大了前文关于同意与伤害的某些忧虑。此外，即便剥削论证在 *初看之下* 取得某些成功，也并不 *必然* 推出相关做法通盘考虑在道德上是错的，更不能推出它应被阻止。因为正如 Wertheimer 所说：“我们一般应当允许互利且经同意的剥削性交易，即便它们是剥削性的”（Wertheimer 2011, 253）[^wertheimer-2011]。
    step2: |-
      器官买卖（乃至无偿捐赠）也大致如此。为移植而取用某人的器官，我们当然至少把器官——甚至可能把人——当作达成目的的手段、当作有用的对象。但这与同时尊重尊严、视人为自身即目的并不冲突：只要我们认真对待其理性能力，要求摘取须获有效同意，并确保伤害风险被降到最低、保持在合理水平。于是，器官买卖（相对无偿捐赠）的特定问题，便归到前几节详论的那些问题上：买卖情形中同意或有瑕疵，风险更大；若器官摘取未经正当同意，便可能是对人格的不尊重；若伤害风险上升（超过一定限度），也可能同样如此。这样看来，诉诸尊严、工具化与对象化，不过是放大了前文关于同意与伤害的忧思。何况，即便剥削论证在 *初看之下* 有些道理，也不 *必然* 推出该做法通盘考虑即道德上错，更不能推出它该被阻止。因为如 Wertheimer 所说：“对于互利的、经同意的剥削性交易，我们一般应当允许，即便它确属剥削”（Wertheimer 2011, 253）[^wertheimer-2011]。
