      Perhaps the most commonly discussed objection to organ sale is the claim that it is exploitative (Greasley 2014; Hughes 1998; Lawler 2011, 2014; Wilkinson 2003)[^greasley-2014][^hughes-1998][^lawler-2011][^wilkinson-2003]. Saying what exploitation amounts to is itself a complex task, however, and I will not say much here about how it should be defined (see the entry on exploitation, and Wertheimer 1996, 2008, 2011)[^wertheimer-1996]. It is, however, worth noting that, on one view, defective (or invalid) consent is a necessary condition for the occurrence of exploitation. Thus (according to this view) a transaction can only be exploitative if the putative victim of exploitation is coerced, lacking capacity, ill-informed, or manipulated (or more generally, if there is some consent-invalidating factor in play). If this view of the relationship between consent and exploitation were correct, then the discussion of exploitation could be ended here; for consent issues were dealt with in the previous section and the exploitation worry about organ sale would only be worth taking seriously inasmuch as those consent arguments discussed above were sound. However, not everyone thinks that defective consent is required for there to be exploitation and so there may be some mileage in looking independently at exploitation.
    step1: |-
      对器官买卖讨论最多的反对意见，或许是主张它具有剥削性（Greasley 2014; Hughes 1998; Lawler 2011, 2014; Wilkinson 2003）[^greasley-2014][^hughes-1998][^lawler-2011][^wilkinson-2003]。然而，说清剥削究竟是什么，本身就是一项复杂任务，此处不拟多谈应如何定义（见剥削词条，以及 Wertheimer 1996, 2008, 2011）[^wertheimer-1996]。但值得注意的是，按一种观点，有缺陷的（或无效的）同意是剥削发生的必要条件。因此（按此观点），只有当剥削的所谓受害者受到胁迫、缺乏行为能力、信息不足或被操纵时（或者更一般地说，当存在某种使同意失效的因素时），一笔交易才可能是剥削性的。若关于同意与剥削之关系的这一观点正确，那么关于剥削的讨论可以就此结束：因为同意问题已在前一节处理，而关于器官买卖的剥削忧虑，只有在上述同意论证成立时，才值得认真对待。然而，并非所有人都认为剥削必须以有缺陷的同意为条件，因此独立考察剥削或许仍有可取之处。
    step2: |-
      对器官买卖讨论最多的反对意见，大概要数“它具有剥削性”一说（Greasley 2014; Hughes 1998; Lawler 2011, 2014; Wilkinson 2003）[^greasley-2014][^hughes-1998][^lawler-2011][^wilkinson-2003]。但说清“剥削”究竟指什么，本身就是难题，这里不拟细究其定义（参见剥削词条；Wertheimer 1996, 2008, 2011）[^wertheimer-1996]。不过有一点值得注意：按一种看法，同意有缺陷（或无效）是剥削得以发生的必要条件。据此，只有当所谓受害者遭胁迫、缺乏行为能力、信息不足或被操纵（总之，存在某种使同意失效的因素）时，交易才可能是剥削性的。若这一看法正确，关于剥削的讨论便可以到此为止：同意问题上一节已谈，剥削之忧也只有在那些同意论证站得住时才值得认真对待。然而并非人人都认为剥削须以有缺陷的同意为前提，因此单看剥削，或许仍有可说之处。
