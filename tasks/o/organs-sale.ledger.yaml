      It should finally be noted however that there is conceptual space for a very different approach: one according to which certain types of actions are wrong even if the individuals concerned consent or want the action, and even if no one is harmed. There is not space to give a full exposition of it here. However, under such views, many of the abovementioned arguments based on consent and the lack of net harm will seem inadequate. Sandel is one contemporary writer who holds such views. He distinguishes fairness and harm arguments, like those discussed above, from ‘corruption arguments’. Corruption arguments point to a “a different set of ideals … to the moral importance of the goods at stake” (Sandel 2012, 112)[^sandel-2012]. See also, for example, the entries on deontological ethics, Gertrude Elizabeth Margaret Anscombe, natural law theories, and Philippa Foot.
    step1: |-
      不过最后应当指出，概念上还存在一条颇为不同的进路：按此进路，某些类型的行动即便当事人同意或想要，即便无人受害，也仍是错的。此处没有篇幅详加阐发。但在这种观点下，上文许多基于同意与净伤害缺失的论证就会显得不足。Sandel 是持此类观点的一位当代作者。他把上文讨论的那类公平论证与伤害论证，同“败坏论证”区分开来。败坏论证指向“另一套理想……关乎所涉善的道德重要性”（Sandel 2012, 112）[^sandel-2012]。另见义务论伦理学、格特鲁德·伊丽莎白·玛格丽特·安斯康姆、自然法理论、菲利帕·富特诸词条。
    step2: |-
      最后应当指出，概念上还有一条颇为不同的进路：某些类型的行动，即便当事人同意或想要，即便无人受损，也仍为错。此处无篇幅详论。但在这种观点看来，上文许多以同意与“净无伤害”为据的论证便显得不够。桑德尔是当代持此见者之一：他把上文那类公平论证与伤害论证，同“败坏论证”区别开来。败坏论证指向“另一套理想……关乎所涉善的道德重要性”（Sandel 2012, 112）[^sandel-2012]。另见义务论伦理学、格特鲁德·伊丽莎白·玛格丽特·安斯康姆、自然法理论、菲利帕·富特诸词条。
