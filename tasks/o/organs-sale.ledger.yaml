      This difference between kidneys and blood reveals a general structural difficulty for altruism arguments against sale. For altruism arguments (insofar as they work at all) work better for those things which are already freely donated on a large scale, than for those things which are hardly freely donated at all. Hence, they will tend to be most successful where, in a sense, they are needed least – because, if there is already widespread free donation, then commercialization will be unnecessary. This is not a decisive objection, since there are things which are in short supply in spite of widespread free donation (blood and sperm might be examples of this). But it is a problem for this style of argument because there will be a tendency for it to be least successful where it is most needed (Radcliffe Richards 1996, 2009, 2012; Wilkinson & Moore 1999)[^radcliffe-1996][^wilkinson-1999].
    step1: |-
      肾脏与血液之间的这一差异，揭示出反对买卖的利他主义论证的一个一般性结构困难。因为利他主义论证（就其确实有效而言）对那些已经被大规模无偿捐赠的东西，比对那些几乎从未被无偿捐赠的东西，更为有效。因此，它们往往在某种意义上最不需要它们的地方最为成功——因为若已存在广泛的无偿捐赠，商业化便不必要了。这不是决定性的反对意见，因为有些东西尽管有无偿捐赠的广泛存在仍供应短缺（血液与精子或为例证）。但这对这类论证是个问题，因为它有一种倾向：在最需要它的地方最不成功（Radcliffe Richards 1996, 2009, 2012; Wilkinson & Moore 1999）[^radcliffe-1996][^wilkinson-1999]。
    step2: |-
      肾与血的这一差别，暴露出反对买卖的利他主义论证有一处结构性难处。利他主义论证（倘若真的管用）对已被大规模无偿捐赠之物最有效，对几乎谈不上无偿捐赠之物最无效。于是它们往往在某种意义上最不需要之处最灵——因为既有广泛无偿捐赠，商业化便不必要了。这还不是决定性反驳，毕竟有些东西即便无偿捐赠广泛仍供应短缺（血与精子或属此类）；但这类论证有个通病：最需要它之处，偏偏最不灵（Radcliffe Richards 1996, 2009, 2012; Wilkinson & Moore 1999）[^radcliffe-1996][^wilkinson-1999]。
