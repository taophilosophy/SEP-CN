      The third (related) objection is that no matter how dangerous paid donation is, it need not be any more dangerous than unpaid donation, since the mere fact of payment does not add any danger. So if paid donation is wrong because of the danger to which the donor is subjected, then free donation must also be wrong on the very same ground. Free donation, though, is not wrong; on the contrary, it is generally regarded as commendable and heroic. Therefore, paid donation is not wrong either; or, if it is wrong, it is wrong because of something other than the danger to which the donor is subjected (Radcliffe Richards 2012; Wilkinson and Garrard 1996)[^radcliffe-2012][^wilkinson-1996].
    step1: |-
      第三项（与此相关的）反对意见是：无论有偿捐赠多么危险，它都不必比无偿捐赠更危险，因为仅仅存在付酬这一事实并不增加任何危险。因此，若有偿捐赠因捐赠者所受危险而是错的，那么无偿捐赠基于完全相同的理由也必定是错的。然而无偿捐赠并不是错的；相反，它通常被视为值得称赞、堪称英雄之举。因此，有偿捐赠也不是错的；或者，若它是错的，那也是因为危险之外的某种原因而是错的（Radcliffe Richards 2012; Wilkinson and Garrard 1996）[^radcliffe-2012][^wilkinson-1996]。
    step2: |-
      第三项反对（与上一项相关）：无论有偿捐赠多危险，它都不必比无偿捐赠更危险——付酬本身并不添一分危险。那么，若有偿捐赠因捐赠者承担的危险而错，无偿捐赠凭同一理由也该错。可无偿捐赠不错；相反，它通常被称赞为可敬、甚至英雄之举。故有偿捐赠也不为错；设若为错，其错也另有缘由，不在危险（Radcliffe Richards 2012; Wilkinson and Garrard 1996）[^radcliffe-2012][^wilkinson-1996]。
