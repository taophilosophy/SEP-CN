  - id: 1
    kind: body
    source: |-
      Organ sale – for example, allowing or encouraging consenting adults to become living kidney donors in return for money – has been proposed as a possible solution to the seemingly chronic shortage of organs for transplantation. Many people however regard this idea as abhorrent and argue both that the practice would be unethical and that it should be banned. This entry outlines some of the different possible kinds of organ sale, briefly states the case in favour, and then examines the main arguments against.
    step1: |-
      器官买卖——例如，允许或鼓励有同意能力的成年人以金钱为报成为活体肾脏捐赠者——已被提出来作为器官移植长期短缺问题的一种可能解决办法。然而许多人视此想法为可憎，既主张这种做法不合伦理，又主张应予禁止。本词条概述若干种可能的人体器官买卖类型，简要陈述支持一方的主张，然后考察反对一方的主要论证。
    step2: |-
      器官买卖（organ sale）——比如允许甚至鼓励有同意能力的成年人以金钱为报成为活体肾脏捐赠者——被提出来作为缓解器官移植长期短缺的一种可能办法。但许多人觉得这个念头可憎，既主张它不合伦理，又主张应予禁止。本词条先概述器官买卖可能采取的几种形态，简述支持理由，再逐一考察反对意见。
  - id: 2
    kind: body
    source: |-
      ## 1. Different Kinds of Organ Sale System
    step1: |-
      ## 1 器官买卖制度的不同类型
    step2: |-
      ## 1 器官买卖制度的不同类型
  - id: 3
    kind: body
    source: |-
      The expression ‘organ sale’ covers a wide range of different practices. People most readily associate it with the case in which an individual (who needs or wants money) sells their kidney to another (who needs a kidney). But there are other possibilities too. One (in countries where the prior consent of the deceased is required for cadaveric organ donation) is to pay people living now for rights over their body after death. Another (in countries where the consent of relatives is required for cadaveric organ donation) is to pay relatives for transplant rights over their recently deceased loved ones’ bodies.
    step1: |-
      “器官买卖”这一说法涵盖范围广泛的不同做法。人们最容易想到的情形是：某个人（需要或想要钱）把肾卖给另一个人（需要肾）。但还有其他可能。其一是（在遗体器官捐赠须经死者生前同意的国家）向在世者购买其死后遗体的处置权。其二（在遗体器官捐赠须经亲属同意的国家）是向亲属购买其新近去世亲人的遗体的移植权。
    step2: |-
      “器官买卖”一语涵盖多种差别颇大的做法。最易想到的情形，是某人（需要钱或想要钱）把自己的肾卖给另一人（需要肾）。但还有别的形态。一是在遗体器官捐赠须经死者生前同意的国家，向在世者购买其死后遗体的支配权；二是在遗体捐赠须经亲属同意的国家，向亲属购买其刚去世亲人的遗体的移植权。
  - id: 4
    kind: body
    source: |-
      Since the kidney is the most commonly transplanted organ and since the ethics literature on organ sale is mainly about kidney sale from live donors, that is the practice on which this entry will focus. ‘Organ sale’ as the term is used here does not include the sale of body *products* (a category which includes blood, eggs, hair, and sperm) since this is different in some important respects. For example, the risk of permanent harm is generally much less in the case of blood and hair donation; while, the donation of eggs and sperm raises additional issues relating to the creation and parenting of additional future people. That said, many of the fundamental issues are similar and the very same concerns about (for example) exploitation and consent arise in both cases.
    step1: |-
      由于肾是最常被移植的器官，且关于器官买卖的伦理文献主要讨论活体捐赠者的肾买卖，本词条将聚焦于这一做法。此处所用“器官买卖”一词不包括身体 *产物* 的买卖（该类包括血液、卵子、毛发与精子），因为这在一些重要方面有所不同。例如，捐血与捐发的永久性伤害风险通常要低得多；而捐卵与捐精则引发与制造和养育未来更多的人有关的一些额外问题。话虽如此，许多根本问题是相似的，关于剥削与同意的同样忧虑在两种情形中都会出现。
    step2: |-
      肾是最常移植的器官，器官买卖的伦理文献也主要讨论活体肾买卖，故本词条聚焦于此。这里的“器官买卖”不含身体 *产物*（血液、卵子、毛发、精子等）的买卖，因为后者在若干重要方面不同：捐血、捐发造成永久伤害的风险通常低得多；捐卵、捐精则牵涉制造并养育未来新增人口的额外问题。话虽如此，两者的根本问题多有相通，剥削与同意方面的忧虑如出一辙。
  - id: 5
    kind: body
    source: |-
      An important preliminary point is that almost all serious advocates of allowing payment for human organs argue not for an unfettered ‘free market’ but for a regulated one. Radcliffe Richards et al. (1998, 1950) for example, in their paper “The Case for Allowing Kidney Sales” say:
    step1: |-
      一个重要的预备性要点是：几乎所有认真主张允许为人体器官付费的人，所主张的都不是无拘无束的“自由市场”，而是受监管的市场。例如 Radcliffe Richards 等（1998, 1950）在《为允许肾脏买卖辩护》一文中说：
    step2: |-
      有一点须先说明：认真主张允许为人体器官付费者，几乎都主张建立受监管的市场，而非无拘无束的“自由市场”。例如 Radcliffe Richards 等（1998, 1950）在《为允许肾脏买卖辩护》一文中写道：
  - id: 6
    kind: body
    source: |-
      > It must be stressed that we are not arguing for the positive conclusion that organ sales must always be acceptable, let alone that there should be an *unfettered* market.
    step1: |-
      > 必须强调，我们并不是在主张“器官买卖必定总是可接受的”这一肯定结论，更不是在主张应当有 *无拘无束的* 市场。
    step2: |-
      > 必须强调，我们并非要得出“器官买卖在任何情况下都可接受”这一肯定结论，更不是主张应当存在 *无拘无束的* 市场。
  - id: 7
    kind: body
    source: |-
      While Wilkinson (2003, 132) is typical of organ sale defenders in wishing to distance himself from today’s (largely ‘underground’) organ trade:
    step1: |-
      而 Wilkinson（2003, 132）堪称器官买卖辩护者的典型，他希望与当今（大体上“地下”的）器官交易保持距离：
    step2: |-
      Wilkinson（2003, 132）是器官买卖辩护者中的典型，他力图与当下（大体处于“地下”的）器官交易撇清干系：
  - id: 8
    kind: body
    source: |-
      > … far from being a reason to continue the ban on sale, the dreadfulness of present practice may be a reason to *discontinue* prohibition, so that the organ trade can be brought ‘overground’ and properly regulated.
    step1: |-
      > ……当前的实践固然可怕，但这远不足以成为继续禁止买卖的理由；它也许恰恰是 *终止* 禁令的理由，以便把器官交易搬到“地上”，加以妥善监管。
    step2: |-
      > ……当下实践的可怕，非但不是延续买卖禁令的理由，反而可能是 *取消* 禁令的理由，好让器官交易转入“地上”，得到正当监管。
  - id: 9
    kind: body
    source: |-
      Different scholars have different views about the precise scope and extent of the regulation required, but most support the requirements that organ sellers give valid consent, are paid a reasonable fee, and are provided with adequate medical care. Taylor (2005, 110) for example, says that:
    step1: |-
      不同学者对所需监管的确切范围与程度看法不一，但多数人支持下列要求：器官出售者给出有效同意、获得合理报酬，并得到充分的医疗照护。例如 Taylor（2005, 110）说：
    step2: |-
      所需监管的确切范围与力度，各家看法不同，但多数人主张三项要求：出售者须给出有效同意、获得合理报酬、得到充分的医疗照护。Taylor（2005, 110）即谓：
  - id: 10
    kind: body
    source: |-
      > At minimum … a market should require that vendors give their informed consent to the sale of their kidneys, that they not be coerced into selling their kidneys by a third party and that they receive adequate post-operative care.
    step1: |-
      > 至少……市场应当要求出售者对其肾脏出售给出知情同意，要求他们不因第三方胁迫而出售肾脏，并要求他们获得充分的术后照护。
    step2: |-
      > 市场至少应要求：出售者对出售其肾脏给出知情同意，不因第三方胁迫而出售，并获得充分的术后照护。
  - id: 11
    kind: body
    source: |-
      One noteworthy policy proposal comes from Erin and Harris (1994; 2003) who suggest that a market in human organs should have the following features:
    step1: |-
      一项值得注意的政策提议来自 Erin 与 Harris（1994; 2003），他们建议人体器官市场应具备以下特征：
    step2: |-
      Erin 与 Harris（1994; 2003）提出一项值得注意的政策设计，主张人体器官市场应具备下列特征：
  - id: 12
    kind: body
    source: |-
      1. It is limited to a particular geopolitical area, such as a state or the European Union, with only citizens or residents of that area being allowed to sell or to receive organs.
      2. There is a central public body responsible for making (and funding) all purchases and for allocating organs fairly in accordance with clinical criteria. Direct sales are banned.
      3. Prices are set at a reasonably generous level to attract people voluntarily into the market.
    step1: |-
      1. 它限于某一特定地缘政治区域，例如某个州或欧盟，只有该区域的公民或居民才被允许出售或接受器官。
      2. 设有一个中央公共机构，负责作出（并出资）一切购买，并按临床标准公平分配器官。直接买卖被禁止。
      3. 价格定在相当宽厚的水平，以吸引人们自愿进入市场。
    step2: |-
      1. 市场限于某一地缘政治区域（如某州或欧盟），唯有该区域公民或居民方可出售或接受器官。
      2. 设中央公共机构，统一作出（并出资）一切购买，并按临床标准公平分配器官；直接买卖一律禁止。
      3. 价格定在较为宽厚的水平，以吸引人们自愿入市。
  - id: 13
    kind: body
    source: |-
      Features (1) and (2) combined are supposed to rule out exploitative organ trafficking from poorer countries, while the ban on direct sales and allocation by a central agency ensure that the organs go not to those most able to pay, but to those in most need. In common with many other defenders of organ sale, Erin and Harris also propose building in practical protections for donors and recipients (e.g., adequate medical care and thorough health checkups before donation takes place).
    step1: |-
      特征 (1) 与 (2) 合起来，据说可以排除来自较贫穷国家的剥削性器官贩运；而禁止直接买卖并由中央机构分配，则可确保器官不是流向最有支付能力者，而是流向最有需要者。与许多其他器官买卖辩护者一样，Erin 与 Harris 还提议为捐赠者与接受者内建实际保护措施（例如充分医疗照护，以及在捐赠前进行彻底健康检查）。
    step2: |-
      第 (1)、(2) 两项合起来，据说能排除来自较贫穷国家的剥削性器官贩运；禁绝直接买卖、由中央机构统一分配，则确保器官流向最有需要的人，而不是出价最高的人。与许多辩护者一样，Erin 与 Harris 还主张为捐赠者与接受者内建实际保护，例如充分医疗照护，以及捐赠前的全面体检。
  - id: 14
    kind: body
    source: |-
      When ethically evaluating organ sale therefore it is best to focus not on the worst aspects of today’s organ trafficking practices (since that is not what any serious ethicist is defending or proposing) but rather on what a reasonably well-regulated system of organ sale, controlled by some combination of the medical profession and state regulators, would look like. More specifically, it should be assumed (as it is in what follows) that the doctors, nurses, and transplant coordinators implementing an organ sale system should at least adhere to the standards around consent and clinical care advocated by The Transplantation Society and the World Health Organisation (leaving aside of course those bodies’ opposition to organ sale itself) (see Other Internet Resources section below).
    step1: |-
      因此，在伦理上评估器官买卖时，最好不聚焦于当今器官贩运实践最恶劣的方面（因为那并不是任何严肃伦理学家所辩护或提议的），而应聚焦于一个由医学界与国家监管者以某种方式共同控制、监管尚算良好的器官买卖制度会是什么样子。更具体地说，应当假定（如下文所假定的那样），实施器官买卖制度的医生、护士与移植协调员至少应遵守移植学会与世界卫生组织所倡导的同意与临床照护标准（当然，撇开这些机构本身对器官买卖的反对不论）（见下文“其他网络资源”一节）。
    step2: |-
      因此，评估器官买卖的伦理性质时，不宜盯住当今器官贩运最恶劣的一面（没有哪个严肃的伦理学家在为此辩护或提议）。应着眼一个监管尚算得体的制度：由医学界与国家监管者共同掌控，会是什么样子。具体而言，下文假定：实施该制度的医生、护士与移植协调员至少遵守移植学会与世界卫生组织倡导的同意与临床照护标准。当然，这两家机构本身反对器官买卖，此处不论（见下文“其他网络资源”）。
  - id: 15
    kind: body
    source: |-
      One final preliminary point is the distinction between questions of law and public policy, on the one hand, and personal morality on the other. The debate about organ sale is largely about whether this should be allowed (by law) and, if so, about what system of remuneration would be best. However, there is a set of separable questions about personal morality: about (for example) whether buying an organ for oneself might be morally problematic even if it should not be prohibited. Although this distinction is important, and should be kept in mind throughout, it will not be referred to much in the following sections. That is because, for the most part, the very same arguments are used both in attempts to show that organ sale is morally problematic and in attempts to show that it ought not to be allowed.
    step1: |-
      最后一个预备性要点，是法律与公共政策问题同个人道德问题之间的区分。关于器官买卖的争论，大体上是关于（依法律）是否应允许它，若允许，又应以何种报酬制度为最佳。然而另有一组可分离的个人道德问题：例如，即便为自己购买器官不应被禁止，这样做是否仍可能在道德上有问题。这一区分固然重要，且应始终牢记，但下文各节不会太多提及。这是因为，在大多数情况下，用来表明器官买卖在道德上有问题的论证，与用来表明它不应被允许的论证，恰恰是同一批。
    step2: |-
      最后一点预备：法律与公共政策问题，同个人道德问题应当分开。器官买卖之争，主要是问法律上该不该允许，若允许又该采用何种报酬制度；除此之外还有一组独立的个人道德问题，例如：即便法律不该禁止为自己购买器官，这样做是否仍有道德问题。这一区分很重要，下文应始终记住，但各节不会多提——因为用以论证器官买卖道德有问题的理由，与用以论证它不该被允许的理由，大体是同一批。
