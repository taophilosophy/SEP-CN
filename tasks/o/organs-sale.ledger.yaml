      有人可能论证说，器官买卖的问题不在于危险 *本身*，而在于有人为使自己陷于危险而得到报酬。对此有两种解读。其一是对同意的忧虑，即认为付酬使出售者的同意失效；这将在第 5 节考察。其二是一项道德原则：独立于关于同意的忧虑，为某人使自己陷于危险而付酬本身就是错的。这样一条原则的根据究竟何在，颇难揣度；而且，凭前文讨论一致性时给出的理由看，这种原则似乎并不成立。为让人从事危险和/或不愉快的工作而付酬，是普遍现象；若世间无需人们承担这类工作，或许会更好，但要说所有这类安排都是错的，则很难辩护：尤其在人们自愿从事、报酬公道的情形中。
