      Altruism is usually defined as acting out of a concern for the well-being of others (Nagel 1970; Scott & Seglow 2007)[^nagel-1970][^scott-2007]. Why might one think that such actions are morally good? Two main answers are available. The first is that altruism is intrinsically good and to be contrasted with morally bad characteristics and motivations, in particular selfishness. The second (which is not incompatible with the first) says that altruism is good because of its positive effects, not only its direct effects on the person to whom the altruism is directed but also its indirect effects on society. Both answers have considerable plausibility. Many examples of acting out of disinterested concern for the well-being of others do seem to be clear-cut cases of moral virtue. And it seems likely that, all other things being equal, a society with more altruistic acts would be a better place to live than one with fewer.
    step1: |-
      利他主义通常被定义为出于对他人福祉的关切而行动（Nagel 1970; Scott & Seglow 2007）[^nagel-1970][^scott-2007]。人们何以认为这类行动在道德上是好的？有两种主要回答。第一种是：利他主义本身是好的，与道德上恶劣的特征与动机（尤其是自私）相对照。第二种（与第一种并不冲突）是：利他主义之所以好，是因为它的正面效果——不仅是对利他行为所指向者的直接影响，还有对社会的间接影响。两种回答都颇具说服力。许多出于对他人福祉的无私关切而行动的例子，确实像是道德德性的明确案例。而且看起来多半是，在其他条件相同的情况下，一个利他行为更多的社会，比一个利他行为更少的社会更宜于居住。
    step2: |-
      利他主义通常被界定为：出于对他人福祉的关切而行动（Nagel 1970; Scott & Seglow 2007）[^nagel-1970][^scott-2007]。何以说这类行动道德上善？主要有两种答法。其一，利他主义本身即善，与自私等恶劣特征和动机相对。其二（与第一种不冲突），利他主义之善在于其正面效果：既直接影响受惠者，也间接影响社会。两说都很有说服力。许多出于对他人福祉的无私关切而行动的例子，分明就是道德德性；而且，其他条件相同时，利他行为多的社会，多半比利他行为少的社会更宜居。
