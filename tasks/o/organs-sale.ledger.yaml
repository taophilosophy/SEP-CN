      To help think through these principles consider the case of Manuel Wackenheim. Wackenheim is a (so-called) ‘dwarf’ who (until a ban was imposed by the local mayor) made a living from being ‘tossed’ by customers in bars and nightclubs. This ‘tossing’ formed part of a dwarf throwing competition – a sport ‘in which the aim of the competitors is to fling a dwarf over the furthest distance possible’ (Millns 1996, 375)[^millns-1996]. Wackenheim appeared keen to pursue his chosen career and didn’t welcome the ban on dwarf throwing, saying ‘this spectacle is my life; I want to be allowed to do what I want’.
    step1: |-
      为帮助思考这些原则，考察 Manuel Wackenheim 的案例。Wackenheim 是一名（所谓的）“侏儒”，他（在地方市长颁布禁令之前）靠在酒吧与夜总会里被顾客“抛掷”为生。这种“抛掷”是侏儒抛掷比赛的一部分——这项运动“其参赛者的目标，是把一名侏儒抛到尽可能远的距离”（Millns 1996, 375）[^millns-1996]。Wackenheim 似乎热衷于从事自己选定的这一职业，并不欢迎对侏儒抛掷的禁令，他说：“这场表演就是我的生活；我希望能被允许做我想做的事。”
    step2: |-
      为便于推敲这些原则，可看 Manuel Wackenheim 一例。Wackenheim 是一名（所谓）“侏儒”，在地方市长颁禁令之前，靠被酒吧与夜总会顾客“抛掷”为生。这种“抛掷”属侏儒抛掷赛——一项“参赛者比谁把侏儒抛得最远”的运动（Millns 1996, 375）[^millns-1996]。Wackenheim 似乎很愿意干这一行，对禁令并不买账，说：“这表演就是我的命；我想被允许做我自己想做的事。”
