      In common with some of the arguments considered earlier, attempts to use these ideas in an argument against organ sale run up against two problems. First, there is the similarity of (free) donation and sale. Let us say that someone objects to organ sale (even where there is consent and distributive justice) on the grounds that the seller’s body (organ) or the seller is objectified or instrumentalised. This immediately raises the question of why the very same consideration does not apply to (free) donation, which is standardly thought to be admirable rather than morally dubious. For in both cases, a part of the donor’s (or vendor’s) body is removed and treated (quite possibly solely) as a means by the recipient and the transplant team.
    step1: |-
      与本词条先前考察的一些论证一样，试图用这些观念来论证反对器官买卖，会遇上两个问题。第一是（无偿）捐赠与买卖的相似性。设若有人反对器官买卖（即便存在同意与分配正义），理由是出售者的身体（器官）或出售者本人被对象化或工具化了。这立刻引出一个问题：为何同样的考量不适用于（无偿）捐赠？而无偿捐赠通常被视为可嘉而非道德可疑。因为两种情形中，捐赠者（或出售者）身体的一部分都被取出，且（很可能仅仅）被接受者与移植团队当作手段对待。
