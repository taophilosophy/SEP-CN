      An illuminating example is Nozick’s Drowning Case (Nozick 1969, 449)[^nozick-1969]. This is a situation in which *P* (the occupant of a boat) offers to save *Q* (who is drowning close to the boat) but only if *Q* promises to pay *P* $10,000 within three days of reaching shore. One view of this case is that *P* coerces *Q* (into paying) if and only if *P* has a freestanding duty to save *Q* without reward. Whether *P* does in fact have such a duty is not something we need to decide upon here and that will depend upon a wide range of facts about the situation.
    step1: |-
      一个富有启发性的例子是 Nozick 的溺水案例（Nozick 1969, 449）[^nozick-1969]。情形是：*P*（船上的人）提出搭救 *Q*（在船边溺水），但条件为 *Q* 承诺在上岸后三天内付给 *P* $10,000。对此案例的一种看法是：*P* 胁迫 *Q*（付钱），当且仅当 *P* 负有一项独立于报酬而救 *Q* 的义务。*P* 事实上是否负有此义务，此处无须裁定，这取决于有关该情境的广泛事实。
    step2: |-
      诺齐克的溺水案是个好例子（Nozick 1969, 449）[^nozick-1969]：*P*（船上的人）提出救 *Q*（在船边溺水者），条件是 *Q* 许诺上岸后三天内付 *P* $10,000。对此案的一种看法是：*P* 对 *Q*（要钱）构成胁迫，当且仅当 *P* 本有一项不图报偿而救 *Q* 的独立义务。*P* 是否真有此义务，此处不必裁定，要看情境的种种事实。
