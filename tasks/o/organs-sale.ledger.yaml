      One concern here is that certain sorts of payment, or payment in certain circumstances, exert undue influence on a person’s decision (Nuffield Council on Bioethics 2002)[^nuffield-2002]. Accusations of undue inducement almost always occur in one of two different contexts. The first is where the ‘victim’ of the inducement is in desperate need of money; the second is where the ‘victim’ is not desperate, but is offered such a huge amount of money to do *X* that doing *X* becomes almost irresistible. Wilkinson terms these ‘desperate offeree’ cases and ‘enormous offer’ cases. One notable thing that these have in common is that there is a huge gap between the offeree’s welfare-level if they do not accept the offer, and their welfare-level if the offer is accepted (Wilkinson 2003)[^wilkinson-2003].
    step1: |-
      这里的一个忧虑是：某些种类的付酬，或在某些情形下的付酬，会对人的决定施加不当影响（Nuffield Council on Bioethics 2002）[^nuffield-2002]。关于不当诱导的指控几乎总出现在两类语境之一。第一类是诱导的“受害者”急需用钱；第二类是“受害者”并不急迫，但被提供了多得足以令人几乎无法抗拒的金钱去做 *X*。Wilkinson 将这两类分别称为“绝望受要约人”情形与“巨额要约”情形。二者共同的一点值得注意的是：受要约人若拒绝要约，其福利水平与接受要约后的福利水平之间，存在巨大落差（Wilkinson 2003）[^wilkinson-2003]。
    step2: |-
      这里有一层忧虑：某些付酬方式，或在某些情形下的付酬，会不当影响人的决定（Nuffield Council on Bioethics 2002）[^nuffield-2002]。关于不当诱导的指控，几乎总落在两类情形之一。一是诱导的“受害者”急需用钱；二是“受害者”并不急迫，但为让他做 *X* 而开出的钱多到几乎无法抗拒。Wilkinson 分别称之为“绝望受要约人”与“巨额要约”。两者有个显著共同点：受要约人若拒绝，与若接受，其福利水平之间落差极大（Wilkinson 2003）[^wilkinson-2003]。
