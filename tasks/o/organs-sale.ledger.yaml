      However, even if altruism can survive this first challenge, there is a second reason to question its importance for the debate about the permissibility of organ sale. This is the distinction between cases in which altruism is *obligatory* (where there is a moral duty to help others) and those in which altruism is *supererogatory* (morally good, but not morally required – going ‘above and beyond’ one’s duty) (Wilkinson 2003)[^wilkinson-2003]. This distinction is relevant for the following reason. If (say) altruistic kidney donation were morally obligatory, then to demand money for one’s organ (and, arguably, to accede to such a demand) would be wrong. But if, on the other hand, altruistic donation were supererogatory, then to demand money for one’s organ would not be wrong. Rather, it would be merely non-supererogatory: perhaps not *good*, but not *wrong*. So, with this distinction in place, one might (at least in some cases) accept that altruistic donations are good whilst also saying that there is nothing wrong with non-altruistic donation – the point being that non-altruistic donation, while not as good as altruistic donation, is nonetheless (morally) permissible. This has implications for the sort of altruism argument which can be made against organ sale. If it could be shown that altruistic donation is obligatory then the argument would be stronger, or at least more straightforward, because it would follow that selling was wrong (it is wrong to demand money for what one ought to be giving freely anyway). But if all that could be shown was that altruistic donation is good, then it would not follow from this, or at least it would not follow directly, that selling is wrong. For it might be merely non-supererogatory (Wilkinson & Garrard 1996)[^wilkinson-1996].
    step1: |-
      然而，即便利他主义能挺过这第一道挑战，还有第二个理由质疑它对于器官买卖可允许性之争的重要性。这就是 *义务性的* 利他（存在帮助他人的道德义务）与 *超义务的* 利他（道德上好，但非道德上必需——即“超出”义务之外）之间的区分（Wilkinson 2003）[^wilkinson-2003]。这一区分之所以相关，理由如下。若（比如说）利他性的肾脏捐赠在道德上是义务性的，那么为自己的器官索要金钱（并且或许可以论证，答应这种索要）就是错的。但若利他性捐赠是超义务的，那么为自己的器官索要金钱就不为错。它只是非超义务的：或许不算 *好*，但不算 *错*。因此，有了这一区分，人们或许（至少在某些情形中）既承认利他性捐赠是好的，又主张非利他性捐赠并无过错——要点在于：非利他性捐赠虽不如利他性捐赠好，却仍（在道德上）可允许。这影响了可以针对器官买卖提出的那种利他主义论证。若能表明利他性捐赠是义务性的，论证就会更强，或至少更直截：因为由此可推出出售是错的（为本来就应无偿给予的东西索钱是错的）。但若所能表明的只是利他性捐赠是好的，那就推不出（至少不能直接推出）出售是错的。因为它可能只是非超义务的（Wilkinson & Garrard 1996）[^wilkinson-1996]。
    step2: |-
      然而，即便利他主义过了第一关，仍可质疑它对“器官买卖可否允许”之争究竟有多大分量。这里还有一层区分：*义务性* 利他（有帮助他人的道德义务）与 *超义务性* 利他（道德上值得称许，却非道德上必需，即“超出”义务要求）（Wilkinson 2003）[^wilkinson-2003]。这层区分之所以相干，是因为：倘若（姑且说）利他性捐肾是道德义务，那么为自己的器官索钱（或许还可以说，答应这种索要）便是错的；但若利他性捐赠属超义务，则索钱并不为错，只是“非超义务”而已——也许谈不上 *好*，却不算 *错*。有了这层区分，人便可以在某些情形下既承认利他性捐赠是好的，又主张非利他性捐赠并无过错：非利他性捐赠虽不如利他性捐赠好，却仍（在道德上）可允许。这对反对器官买卖的利他主义论证影响不小。若能证明利他性捐赠是义务，论证会更强，至少更干脆——因为由此可推出出售为错（为理应无偿给予之物索钱，是错的）。但若只能证明利他性捐赠是好的，就推不出（至少不能直接推出）出售为错——它可能只是非超义务的（Wilkinson & Garrard 1996）[^wilkinson-1996]。
