      One possible reply to this is to make a distinction between forms of global trade which benefit developing world economies and societies and those which do not. One might then argue that a difference between the organ trade and (say) the development of hi-tech manufacturing is that only the latter has the potential to emancipate populations in the longer-term, whereas buying an organ is merely a ‘resource grab’ with no positive side-effects on socio-economic development. Like many of the other arguments discussed in this entry, much depends on the how the empirical evidence shapes up, but this response does seem to have some plausibility. However, it could still be claimed that the international organ trade is no worse (as far as the quality of consent is concerned) than any other form of international trade which fails positively to contribute to long-term development.
