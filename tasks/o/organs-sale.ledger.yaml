      很难看出怎么可能。不过我们应补两点告诫。第一，这并不排除对“侏儒抛掷”还存在其他独立的道德反对。第二，确实存在这样的语境：此做法会构成不正当的工具化。这可能包括被抛者受到实质伤害的情形，以及他们未同意或其同意无效的情形。其实，这正是要点。此处起伦理作用的，全在语境：特别是与“侏儒”同意的存在与质量有关的问题——或许还有与伤害与福利有关的问题。
    step2: |-
      很难说这算。不过须补两点。其一，这并不排除对“抛掷侏儒”另有独立的道德反对。其二，确有些语境下此做法构成不正当工具化，比如被抛者受到实质伤害，或未表同意、同意无效。其实这正是要害：伦理上的关键全在语境，尤其在于“侏儒”是否同意、同意质量如何，或许还有伤害与福利方面的因素。
