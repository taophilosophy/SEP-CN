      If we look at obligational disputations from the modern logical point of view, it may appear hard to understand how the sequence of answers should be understood. One tempting alternative would be to think that the idea would be to describe a counterfactual situation. As pointed out above, this may be what Kilvington and the anonymous author were aiming at. (See also Spade 1982, 1992, and 1993.)[^spade-1982] However, the mainstream of medieval authors writing on obligations did not accept their approach.
    step1: |-
      若从现代逻辑角度看义务论辩，会难以理解应答序列应如何理解。一个诱人的选项是：其想法在于描述一个反事实情境。如前所述，这或许正是基尔文顿与匿名作者的目标。（另见 Spade 1982, 1992, and 1993。）[^spade-1982] 然而中世纪论义务的主流作者并未接受他们的路数。
    step2: |-
      从现代逻辑角度看义务论辩，应答序列应如何理解，颇难把握。一个诱人的选项是：其想法在于描述反事实情境——如前所述，这或许正是基尔文顿与匿名作者的目标（另见 Spade 1982, 1992, and 1993）[^spade-1982]。然而中世纪论义务的主流作者并未接受这一路数。
