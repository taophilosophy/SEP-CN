      In the context of obligations, Swyneshed does not say that it would be acceptable to grant or deny a contradictory pair of propositions in the same disputation: he discusses contradictory triads, not pairs. However, in his discussion on the Liar’s paradox, he goes as far as explicitly accepting that in some cases both contradictories are false (cf. Read 2020)[^read-2020]. This shows that Swyneshed’s understanding of what contradictions are and how they behave in logic is somewhat outside the logical mainstream. Thus, it may be that further study may shed more light on how exactly he thought about allowing contradictions in obligational evaluations of sets of propositions.
    step1: |-
      在义务理论语境中，斯温舍德并未说在同一场论辩里承认或否认一对矛盾命题可以接受：他讨论的是矛盾三元组，而非对子。但在论说谎者悖论时，他走得远到明确接受：某些情形下两个矛盾命题都为假（参 Read 2020）[^read-2020]。这表明斯温舍德对矛盾是什么、矛盾在逻辑中如何运作的理解，多少在逻辑主流之外。因此，进一步研究或许更能说明：他究竟如何看待在义务评价中容许命题集含矛盾。
