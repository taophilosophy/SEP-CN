      Recent scholarship has found Swyneshed’s rules for *positio* more puzzling (see e.g., Spade 1982; Stump 1981; Yrjönsuuri 1994 and 2001)[^yrjönsuuri-2001][^spade-1982][^stump-1981][^yrjönsuuri-1994]. They are very clear in terms of how to answer according to them, but it seems very problematic to give a sensible interpretation to the set of evaluations to be given according to them. Swyneshed simply rejects Burley’s rules 5 and 6. Just like Kilvington and the above-mentioned anonymous author of *De arte obligatoria*, Swyneshed does not allow the order of the propositions to have any effect on the answers. However, he does not allow counterfactual considerations either, but rather thinks that the respondent must rely on logical relations between the propositions in giving the evaluations.
    step1: |-
      晚近研究认为斯温舍德的 *positio* 规则更令人费解（如见 Spade 1982; Stump 1981; Yrjönsuuri 1994 and 2001）[^yrjönsuuri-2001][^spade-1982][^stump-1981][^yrjönsuuri-1994]。按这些规则如何作答，非常清楚；但要对按之给出的一套评价作出合理阐释，却似很成问题。斯温舍德径直拒斥伯利的规则 5 与 6。与基尔文顿及上述《义务术》匿名作者一样，他不容许命题次序对回答有任何影响；但他也不容许反事实考虑，而认为应答者在评价时须依靠命题之间的逻辑关系。
