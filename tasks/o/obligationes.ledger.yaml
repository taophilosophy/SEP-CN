      The medieval logical genre of sophismata (see the entry on sophismata in this encyclopedia) appears especially relevant to obligations. A typical sophism in this sense consists of a case (*casus*), a sophisma sentence, arguments for and against the sophisma sentence based on the case, and a solution. The case is often imagined rather than real or even genuinely possible. One relatively natural way to think of a sophism would thus be to take the case (*casus*) as a *positio* in the sense of obligational disputations. Indeed, Richard Kilvington’s comments of the obligational rules in his *Sophismata* show him thinking that obligational rules regulate how one ought to evaluate sentences on the basis of the case (*casus*) in a sophisma. (See Kretzmann & Kretzmann 1990a and 1990b.)[^kretzmann-1990a][^kretzmann-1990b]
    step1: |-
      中世纪的逻辑文类“诡辩题”（sophismata，见本《百科》“诡辩题”词条）似与义务理论尤为相关。这一意义上的典型诡辩，包括一个案例（*casus*）、一句诡辩命题、基于该案例为该命题所作的正反论证，以及一个解答。案例往往是想象出来的，未必真实，甚至未必真正可能。于是，思考诡辩的一种较自然的方式，是把案例（*casus*）看作义务论辩意义上的 *positio*。事实上，理查德·基尔文顿在其《诡辩题》中对义务规则的评论表明，他认为义务规则规定着：在诡辩中应如何基于案例（*casus*）评价句子。（见 Kretzmann & Kretzmann 1990a and 1990b。）[^kretzmann-1990a][^kretzmann-1990b]
    step2: |-
      中世纪逻辑文类“诡辩题”（sophismata，见本《百科》“诡辩题”词条）似与义务理论尤为相关。典型的诡辩包括一个案例（*casus*）、一句诡辩命题、基于该案例为该命题所作的正反论证，以及一个解答。案例往往出于想象，未必真实，甚至未必真正可能。于是，思考诡辩的一个较自然方式，是把案例（*casus*）看作义务论辩意义上的 *positio*。事实上，理查德·基尔文顿在《诡辩题》中对义务规则的评论表明，他认为义务规则规定着：诡辩中应如何基于案例（*casus*）评价句子。（见 Kretzmann & Kretzmann 1990a and 1990b。）[^kretzmann-1990a][^kretzmann-1990b]
