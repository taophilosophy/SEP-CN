      The problem with this interpretation is that it does not fit Swyneshed’s rules, which were accepted by some authors as a viable alternative to Burley’s approach. As the rules stand, the set of all answers cannot be understood as a description of a possible world, because it need not be consistent. The set of answers to relevant propositions is consistent even according to Swyneshed’s rules, but understanding that set as describing a possible world runs into the difficulty that that set does not expand from the logical closure of the *positum*, and thus it does not describe any possible world more fully than the *positum* alone.
    step1: |-
      这一解释的问题在于不合斯温舍德的规则，而后者曾被一些作者接受为伯利路数的可行替代。按这些规则，一切回答的集合不能理解为对某个可能世界的描述，因为它不必融贯。即便按斯温舍德规则，对相关命题的回答集合也是融贯的；但把该集合理解为描述一个可能世界，会遇到困难：该集合并不从 *positum* 的逻辑闭包扩展，因而并不比 *positum* 本身更完整地描述任何可能世界。
    step2: |-
      这一解释的问题在于不合斯温舍德的规则，而后者曾被一些作者当作伯利路数的可行替代。按这些规则，一切回答的集合不能理解为对某个可能世界的描述，因为它不必融贯。即便按斯温舍德规则，对相关命题的回答集合也是融贯的；但把该集合理解为可能世界的描述则遇困难：它不从 *positum* 的逻辑闭包扩展，因而并不比 *positum* 本身更完整地描述任何可能世界。
  - id: 85
    kind: body
    source: |-
      A crucial feature of the Socratic *elenchus* is that the answerer is led to deny what has already been granted. Avoiding it to happen that the respondent denies the *positum* is a central objective in an obligational disputation, and Burley’s rules appear to require that this objective is achieved through a consistent sequence of answers. Swyneshed allows contradictory triads. In other words, the set of answers may become inconsistent but the respondent is not allowed to grant any “contradictory incompatible with the *positum*” (Spade 1977, 274)[^spade-1977]. It appears that even in Swyneshed’s case a crucial interest is to explicate logical relations between the propositions put forward by the opponent, and especially as they relate to the *positum*. As a general description of what obligational disputations were about, consistency may not be exactly the right word. Perhaps it would be more exact to describe obligations as aiming at a dynamic understanding of logical relations within a set of propositions.
    step1: |-
      苏格拉底式驳诘的关键特征是：作答者被引向否认已经承认的东西。避免应答者否认 *positum*，是义务论辩的核心目标；伯利的规则似乎要求：这一目标要通过融贯的回答序列来实现。斯温舍德却容许矛盾三元组。换言之，回答集合可能变得不融贯，但不允许应答者承认任何“与 *positum* 不相容的矛盾”（Spade 1977, 274）[^spade-1977]。看来即便在斯温舍德那里，核心兴趣也在于阐明提问者所提命题之间的逻辑关系，尤其是它们与 *positum* 的关系。作为对义务论辩之所是的总体描述，“融贯性”或许并不确切；更确切的说法也许是：义务理论旨在动态地理解一组命题内部的逻辑关系。
    step2: |-
      苏格拉底式驳诘的关键特征，是作答者被引向否认已经承认的东西。避免应答者否认 *positum* 是义务论辩的核心目标，伯利规则似乎要求通过融贯的回答序列来实现它；斯温舍德却容许矛盾三元组：回答集合可能变得不融贯，但不允许应答者承认任何“与 *positum* 不相容的矛盾”（Spade 1977, 274）[^spade-1977]。看来即便在斯温舍德那里，核心兴趣也在于阐明提问者所提命题之间的逻辑关系、尤其是它们与 *positum* 的关系。总体描述义务论辩之所是，“融贯性”或许并不确切；更确切的说法也许是：义务理论旨在动态地理解一组命题内部的逻辑关系。
