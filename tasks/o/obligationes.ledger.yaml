      The square of opposition was an important tool in Aristotelian logic for understanding contradiction and other relations between pairs of assertoric predicative propositions formed with the same categorematic terms. As has been recognized, John Buridan and other logicians expanded this theory to the octagon of opposition to cover also modal propositions. Obligational disputations can be understood as an expansion into another direction. An obligational disputation abstracts from the predication as the standard form of proposition and turns from the binary logical relations into examining logical relations within a dynamically constructed sequence of propositions. (Cf. especially Dutilh Novaes 2005; 2007; 2011; Dutilh Novaes and Uckelman 2016; Strobino 2011; Uckelman 2013; Yrjönsuuri 2000; 2015.)[^dutilh-2005][^dutilh-2016][^strobino-2011][^uckelman-2013][^yrjönsuuri-2000]
    step1: |-
      在亚里士多德逻辑中，对当方阵是理解矛盾及其他关系的重要工具，这些关系见于由相同范畴词项构成的断言性谓述命题之间。学界已认识到，约翰·布里丹等逻辑学家把这一理论扩展为对当八边形，以涵盖模态命题。义务论辩可理解为向另一方向的扩展：它抽离作为命题标准形式的谓述，从二元逻辑关系转向考察动态建构的命题序列内部的逻辑关系。（尤参 Dutilh Novaes 2005; 2007; 2011; Dutilh Novaes and Uckelman 2016; Strobino 2011; Uckelman 2013; Yrjönsuuri 2000; 2015。）[^dutilh-2005][^dutilh-2016][^strobino-2011][^uckelman-2013][^yrjönsuuri-2000]
    step2: |-
      在亚里士多德逻辑中，对当方阵是理解矛盾等关系的重要工具，这些关系见于由相同范畴词项构成的断言性谓述命题之间。学界已认识到，约翰·布里丹等逻辑学家把这一理论扩展为对当八边形，以涵盖模态命题；义务论辩则可理解为向另一方向的扩展：它抽离作为命题标准形式的谓述，从二元逻辑关系转向考察动态建构的命题序列内部的逻辑关系。（尤参 Dutilh Novaes 2005; 2007; 2011; Dutilh Novaes and Uckelman 2016; Strobino 2011; Uckelman 2013; Yrjönsuuri 2000; 2015。）[^dutilh-2005][^dutilh-2016][^strobino-2011][^uckelman-2013][^yrjönsuuri-2000]
