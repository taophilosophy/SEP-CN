      According to Burley’s approach, proposition 1 has to be evaluated as irrelevant, because it does not follow from the *positum* alone, and because of the first disjunct it is taken to be true even if the respondent is not a bishop (apologies to any reader actually in Rome). It must therefore be granted. However, this answer makes the other disjunct relevant, because the first disjunct happens to be the negation of the *positum*. Thus, Proposition 2 must be granted. Indeed, by suitable selection of propositions, almost anything at all may have to be granted at the later steps of a disputation with a false *positum*. Burley gives a useful rule to make this clear: “when a false contingent proposition is posited, one can prove any false proposition that is compossible with it.” (Kretzmann and Stump 1988, 391.)[^kretzmann-1988]
    step1: |-
      按伯利的路数，命题 1 须评价为不相关，因为它不能仅从 *positum* 推出，又因其第一个析取支即使应答者不是主教也被视为真（谨向真正身在罗马的读者致歉）。因此它必须被承认。然而这一回答使另一个析取支变得相关，因为第一个析取支恰是 *positum* 的否定。于是命题 2 必须承认。的确，只要适当选择命题，在与假 *positum* 的论辩后段，几乎任何命题都可能必须承认。伯利给出一条有用规则以明此点：“当设定一个假的偶然命题时，凡是与之可共存的假命题，都可以证明。”（Kretzmann and Stump 1988, 391。）[^kretzmann-1988]
    step2: |-
      按伯利的路数，命题 1 须评价为不相关：它不能仅从 *positum* 推出，又因第一个析取支即使应答者不是主教也被视为真（谨向真正身在罗马的读者致歉），故必须承认。这一回答却使另一析取支变得相关，因为第一个析取支恰是 *positum* 的否定，于是命题 2 必须承认。的确，只要适当选择命题，在与假 *positum* 的论辩后段，几乎任何命题都可能须被承认。伯利给出一条有用规则以明此点：“设定一个假的偶然命题时，凡与之可共存的假命题皆可证明。”（Kretzmann and Stump 1988, 391。）[^kretzmann-1988]
