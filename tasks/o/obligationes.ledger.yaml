      Judging from texts known to modern scholars, the obligational technique seems to have achieved a structured format during the thirteenth century, perhaps already in its first half. The oldest currently known dedicated treatises on the obligational technique seem to be a pair of anonymous treatises edited by L. M. de Rijk as *The* *Emmeran Treatise on False Positio* and *The Emmeran Treatise on Impossible Positio*. (De Rijk 1974.) De Rijk dated the treatises in his edition to the early thirteenth century, and there seems to be no reason to doubt this rough date. The rules of the technique are in these treatises almost the same as in Walter Burley’s *Treatise* *on* *Obligations*, which might be taken as the standard bearing treatise, written around 1302 (Green 1963; Kretzmann and Stump 1988)[^green-1963][^kretzmann-1988]. In terms of historical development, the obligational technique belongs to what is often called *logica moderna*, which built on Aristotelian logic but took clear distance from the Aristotelian texts themselves.
    step1: |-
      从现代学者所知的文本判断，义务理论技术似在 13 世纪——或许已在其前半叶——形成了结构化格式。目前所知最古老的义务理论技术专论，似是 L. M. de Rijk 编校的两篇匿名论著：《埃默兰论假设定》与《埃默兰论不可能的设定》。（De Rijk 1974。）De Rijk 在编校本中断定其年代为 13 世纪初，似无理由怀疑这一大致年代。这些论著中的技术规则，与瓦尔特·伯利约 1302 年所写、或可视为标准范本的《义务理论》几乎相同（Green 1963; Kretzmann and Stump 1988）[^green-1963][^kretzmann-1988]。就历史发展而言，义务理论技术属于通常所谓*现代逻辑*（*logica moderna*）——它建立在亚里士多德逻辑之上，却与亚里士多德文本本身明确拉开距离。
    step2: |-
      从现代学者所知的文本判断，义务理论技术似在 13 世纪、或许已在其前半叶形成结构化格式。目前所知最古老的义务理论专论，是 L. M. de Rijk 编校的两篇匿名论著：《埃默兰论假设定》与《埃默兰论不可能的设定》（De Rijk 1974）。De Rijk 断定其年代为 13 世纪初，似无理由怀疑。这些论著的技术规则，与瓦尔特·伯利约 1302 年所写、或可视为标准范本的《义务理论》几乎相同（Green 1963; Kretzmann and Stump 1988）[^green-1963][^kretzmann-1988]。就历史发展而言，义务理论技术属于通常所谓*现代逻辑*（*logica moderna*）——它建立在亚里士多德逻辑之上，却与亚里士多德文本本身明确拉开距离。
