      Walter Burley’s rules of obligational disputations can be called the standard approach, but they were also challenged in the fourteenth century discussions. All these challenges may be taken to be directed at understanding in what sense the respondent must avoid contradicting himself in an obligational disputation.
    step1: |-
      瓦尔特·伯利的义务论辩规则可称为标准路数，但它们在 14 世纪的讨论中同样受到挑战。所有这些挑战，都可看作在追问：应答者在义务论辩中究竟在何种意义上必须避免自相矛盾。
    step2: |-
      瓦尔特·伯利的义务论辩规则可称为标准路数，但在 14 世纪讨论中同样受到挑战。这些挑战都可看作在追问：应答者在义务论辩中究竟在何种意义上必须避免自相矛盾。
  - id: 63
    kind: body
    source: |-
      *Time and modality*. When discussing modalities in his *Ordinatio* (I, d. 38, 2), John Duns Scotus rejects a principle which he calls an obligational rule, namely that with a false *positio* one must “deny the present instant”. And in fact, Walter Burley (writing roughly at the same time) mentions this as a valid, useful rule. The reasoning behind the rule is the necessity of the present. For example, suppose “you are running” is the false *positum* when you are in fact standing in a university hall and participating in an obligational disputation. Now, if one considers the possibility that you are running, this possibility must according to Burley be referred to some other time, because of the necessity of the present. You cannot be running now since you are standing now, but afterwards you can of course run. (Kretzmann and Stump 1988, 394.)[^kretzmann-1988]
    step1: |-
      *时间与模态*。邓斯·司各脱在《奥多》中讨论模态时（I, d. 38, 2），拒斥一条他称为义务规则的原理，即：给定假 *positio* 时，人必须“否认当前瞬间”。而事实上，瓦尔特·伯利（写作年代大致同时）却把它当作一条有效而有用的规则提出。这条规则背后的理据是当前的必然性。例如，设想“你在跑”是假 *positum*，而你实际站在大学讲堂里参加义务论辩。按伯利，若考虑你在跑这一可能性，由于当前的必然性，它必须被归到别的时刻：你现在不能跑，因为你现在站着；但稍后你当然可以跑。（Kretzmann and Stump 1988, 394。）[^kretzmann-1988]
    step2: |-
      *时间与模态*。邓斯·司各脱在《奥多》讨论模态时（I, d. 38, 2），拒斥一条他称为义务规则的原理：给定假 *positio* 时，人必须“否认当前瞬间”。事实上，瓦尔特·伯利（写作年代大致同时）却把它当作有效而有用的规则提出。其理据是当前的必然性。设想“你在跑”是假 *positum*，而你实际站在大学讲堂里参加义务论辩：按伯利，若考虑你在跑这一可能性，由于当前的必然性，它须归到别的时刻——你现在不能跑，因为你现在站着；但稍后当然可以跑。（Kretzmann and Stump 1988, 394。）[^kretzmann-1988]
