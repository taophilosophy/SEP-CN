    source: |-
      According to Walter Burley’s presentation of the obligational theory in the species of *positio*, the respondent faces a sequence of propositions that he must either grant or deny, one by one. The sequence starts with a *positum* that is normally a false sentence which the respondent has to grant. Then the following propositions are evaluated in accordance with what Burley calls the essential rules of obligations. Three of these rules can be found from practically all medieval discussions of the technique. According to them, the *positum* must be granted if it is put forward, anything following from the *positum* must be granted, and anything incompatible with the *positum* must be denied. (Cf. Green 1963, Kretzmann and Stump 1988. Modern discussions of Burley’s rules can be found in e.g., Ashworth 1981; Keffer 2001; Spade 1982; Spade and Stump 1983; Stump 1985; Yrjönsuuri 1994 and 2001.)[^green-1963][^kretzmann-1988][^yrjönsuuri-2001][^ashworth-1981][^keffer-2001][^spade-1982][^spade-1983][^stump-1985][^yrjönsuuri-1994]
    step1: |-
      按瓦尔特·伯利在 *positio* 这一种类下对义务理论理论的表述，应答者面对一系列命题，必须逐一承认或否认。序列以一个 *positum* 开始，通常是应答者必须承认的假句子。随后诸命题依伯利所谓义务的本质规则来评价。这些规则中有三条几乎见于所有中世纪关于该技术的讨论：*positum* 若被提出必须承认；凡从 *positum* 推出者必须承认；凡与 *positum* 不相容者必须否认。（参 Green 1963, Kretzmann and Stump 1988。关于伯利规则的现代讨论，可参 Ashworth 1981; Keffer 2001; Spade 1982; Spade and Stump 1983; Stump 1985; Yrjönsuuri 1994 and 2001。）[^green-1963][^kretzmann-1988][^yrjönsuuri-2001][^ashworth-1981][^keffer-2001][^spade-1982][^spade-1983][^stump-1985][^yrjönsuuri-1994]
