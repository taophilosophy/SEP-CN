      It seems that in his treatise on *obligationes*, Roger Swyneshed developed his rules for obligational disputations with an approach like this (the text is edited in Spade 1977)[^spade-1977]. Especially interesting in this respect is his discussion on *impositio*, or the kind of obligational disputation where a new meaning is given to some linguistic entity. According to Swyneshed, even if the respondent were obligated by the *impositio* that ‘you are a donkey’ means that God exists, the respondent must deny being a donkey. The proposition “‘you are a donkey’ is true” must however be granted. According to Swyneshed’s principle, “because of an *impositio* of some proposition the answer to be given to it is not to be changed” (Spade 1977, 254)[^spade-1977]. It seems thus that the *impositio* influences only situations where the proposition at issue is mentioned rather than used.
    step1: |-
      看来罗杰·斯温舍德在其 *obligationes* 论著中，正是以类似路数发展其义务论辩规则（文本见 Spade 1977 校勘）[^spade-1977]。尤有趣的是他对 *impositio* 的讨论，即赋予某个语言实体以新含义的那类义务论辩。按斯温舍德，即便应答者因 *impositio* 而有义务把“你是驴”理解为上帝存在，他仍必须否认自己是驴；然而命题“‘你是驴’为真”却必须承认。按斯温舍德的原则，“因对某命题作了 *impositio*，对该命题应给出的回答并不因此改变”（Spade 1977, 254）[^spade-1977]。看来 *impositio* 只影响那种只提及命题、不使用命题的情形。
