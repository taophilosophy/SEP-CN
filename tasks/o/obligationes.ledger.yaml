      Aristotle discussed various times (e.g., *Prior Analytics* and *Metaphysics*) what may happen in reasoning that starts with an impossible hypothesis, and these discussions have to be taken into account as a second aspect in which obligational disputations have roots in Aristotle’s works. When reasoning from an impossible hypothesis one is not to worry about truth but about what follows logically. This is one of the central technical issues in obligational disputations. Discussions concerning an impossible hypothesis have a long history that can be traced all the way from Aristotle to the Latin medieval period in which obligational disputations properly so called were developed. And it can also be pointed out that at the earliest stages of the Latin medieval development of obligational technique, assuming an impossibility (*positio impossibilis*) was one, or perhaps even the standard kind of obligation to be considered. (See Martin 1993; 1997; 2007; Kukkonen 2002; 2005.)[^kukkonen-2002][^martin-1993]
    step1: |-
      亚里士多德多次讨论（如《前分析篇》与《形而上学》）以不可能假设为起点的推理中可能发生什么；这些讨论须视为义务论辩植根于亚里士多德著作的第二个方面。从不可能假设推理时，人不必操心真理，只须操心逻辑上推出什么。这是义务论辩的中心技术议题之一。关于不可能假设的讨论源远流长，可从亚里士多德一直追溯到拉丁中世纪——义务论辩正是在那时发展起来的。还可以指出：在拉丁中世纪义务理论技术发展的最早阶段，假定一个不可能之事（*positio impossibilis*）曾是、或许甚至是标准要考虑的义务类型。（见 Martin 1993; 1997; 2007; Kukkonen 2002; 2005。）[^kukkonen-2002][^martin-1993]
