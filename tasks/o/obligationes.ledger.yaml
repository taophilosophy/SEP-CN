      An anonymous treatise *De arte obligatoria* probably from the 1330s (edited and translated from a Merton College manuscript in Kretzmann & Stump 1985)[^kretzmann-1985][^stump-1985] seems to develop a central aspect of Kilvington’s suggestion into a complete set of rules for obligational disputations. Just like Kilvington, the anonymous author thought that in an obligational disputation the order of the propositions ought not influence the answers. The core change to Burley’s rules is that rules 5. and 6. above are revised so that instead of referring to earlier answers, they must refer to propositions which would be true if the *positum* was true. Thus, a proposition must be granted as sequentially relevant, if it follows from the *positum* together with a proposition that would be true if the *positum* were true. Similarly, it has to denied as incompatibly relevant if it is incompatible with the *positum* together with a proposition that would be true if the *positum* were true. The result is that all answers must be given “in accordance with how it is possible for things to be”, or “on the basis of the facts then”, as the anonymous author puts it.
    step1: |-
      一篇匿名论著《义务术》（*De arte obligatoria*，大概作于 1330 年代；经 Kretzmann & Stump 1985 据默顿学院抄本校勘并英译）[^kretzmann-1985][^stump-1985]，似把基尔文顿建议的一个核心方面发展为义务论辩的完整规则集。与基尔文顿一样，匿名作者认为，在义务论辩中，命题次序不应影响回答。对伯利规则的核心改动是修订上述规则 5 与 6：不再参照先前的回答，而须参照“若 *positum* 为真便会为真”的命题。于是，命题若从 *positum* 连同“若 *positum* 为真便会为真”的某命题推出，就须作为顺序相关而承认；若与 *positum* 连同此类命题不相容，就须作为不相容相关而否认。结果是：一切回答都须“依照事情可能如何”，或如匿名作者所说，“依当时的事实”给出。
