  - id: 6
    kind: body
    source: |-
      These special obligations come in different varieties. Most medieval treatments of the branch of logic are divided by discussions of different varieties. The most common is called ‘*positio*’, or ‘laying down’. In *‘positio*’ a false proposition is laid down at the beginning of the disputation, and the respondent remains obligated to grant it whenever the opponent puts it forward. Modern attention has been mainly on *positio*. (On ‘*sit verum*’, see Spade 1994–97 and Uckelman 2015.)[^spade-1994][^uckelman-2015]
    step1: |-
      这些特殊义务有不同种类。中世纪关于这一逻辑分支的多数论述，都按种类分节讨论。最常见的一种叫“*positio*”，即“设定”。在“*positio*”中，论辩开始时设定一个假命题，应答者负有义务：只要提问者再次提出它，就承认它。现代研究主要关注 *positio*。（论“*sit verum*”，见 Spade 1994–97 与 Uckelman 2015。）[^spade-1994][^uckelman-2015]
    step2: |-
      这些特殊义务有不同种类，中世纪关于这一逻辑分支的多数论述都按种类分节讨论。最常见的一种叫 *positio*，即“设定”：论辩开始时设定一个假命题，应答者负有义务，只要提问者再次提出它，就予以承认。现代研究主要关注 *positio*。（论 *sit verum*，见 Spade 1994–97 与 Uckelman 2015。）[^spade-1994][^uckelman-2015]
