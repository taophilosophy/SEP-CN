      As Swyneshed recognizes, his rules may lead the respondent into granting triads or larger sets of propositions containing contradictions. In his formulation, “the conclusion must be granted that three incompatible propositions must be granted, and four, and so on” (Spade 1977, 274)[^spade-1977]. The sequence of propositions in D1 above is an example of this. The respondent cannot according to Swyneshed rely on Burley’s rule 5 to grant Proposition 2. Instead, the respondent should grant a disjunction but deny both of its parts. Also, it may happen that a conjunction must be denied despite granting both of its parts. These structural combinations are explicitly accepted by Swyneshed (Spade 1977, 257)[^spade-1977].
    step1: |-
      斯温舍德自己承认，他的规则可能使应答者承认含有矛盾的三元组或更大的命题集。用他的话，“必须承认三个不相容命题必须承认这一结论，四个亦然，如此等等”（Spade 1977, 274）[^spade-1977]。上文 D1 的命题序列即为一例。按斯温舍德，应答者不能借伯利的规则 5 承认命题 2，而应承认一个析取命题、却否认其两个析取支。也可能出现必须否认一个合取命题、却承认其两个合取支的情形。斯温舍德明确接受这些结构组合（Spade 1977, 257）[^spade-1977]。
