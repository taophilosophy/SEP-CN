    source: |-
      The core structure of an obligational disputation is closely similar to what we find from Plato’s dialogues. In a so-called Socratic *elenchus* Socrates is putting forward questions, and most of them can be and are answered by ‘yes’ or by ‘no’. The sequence of questions in effect builds up an argument leading to a situation where the person responding to Socrates’ questions is often forced to admit the opposite of what was put as a starting point in the dialectical encounter. As a core background assumption, the person answering has to grant to Socrates some propositions because of other propositions that he has already granted. In a somewhat implicit form, the obligational principle that whatever follows needs to be granted is thus present already in the Socratic *elenchus*. (See e.g., Robinson 1953)[^robinson-1953]
    step1: |-
      义务论辩的核心结构，与我们在柏拉图对话中所见极为相似。在所谓苏格拉底式*驳诘*（*elenchus*）中，苏格拉底提出问题，其中多数可以、也确以“是”或“否”回答。问题序列实际上构成一个论证，最终常使回答苏格拉底问题的人被迫承认与对话开始时设定者相反的东西。一个核心的背景假定是：作答者必须因他已承认的其他命题，而向苏格拉底承认某些命题。于是，“凡从前提推出者皆须承认”这一义务理论原则，已经以某种隐含形式存在于苏格拉底式驳诘之中。（例如见 Robinson 1953）[^robinson-1953]
    step2: |-
      义务论辩的核心结构，与柏拉图对话所见极为相似。在所谓苏格拉底式*驳诘*（*elenchus*）中，苏格拉底提出问题，多数可以、也确以“是”或“否”回答。问题序列实际构成一个论证，最终常迫使作答者承认与对话起点相反的东西。核心的背景假定是：作答者必须因他已承认的其他命题，而向苏格拉底承认某些命题。“凡从前提推出者皆须承认”这一义务理论原则，于是已以隐含形式存在于苏格拉底式驳诘之中。（例如见 Robinson 1953）[^robinson-1953]
