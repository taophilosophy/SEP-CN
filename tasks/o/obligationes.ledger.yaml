      In his discussion of *obligationes* from the very end of the fourteenth century, Paul of Venice compares obligations with another genre of logic, saying that “the matter of obligations is only the matter of consequences in a more subtle style” (Paul of Venice in Ashworth 1988, 32)[^paul-1988][^ashworth-1988]. One aspect of what Paul of Venice means by this statement is presumably that both obligations and consequences are concerned with non-syllogistic logic. To this extent, this description of the theory of *obligationes* seems correct even from the modern vantage point. However, it does not seem quite right to think that an obligational disputation would try to spell out the logical relation between an antecedent and a consequent, or even a set of premises and a conclusion. The logical relations considered in an obligational disputation are not distinctively binary. It seems that they are often approached as logical relations becoming explicit only in a dynamic sequence of three or more propositions.
    step1: |-
      在 14 世纪末的 *obligationes* 讨论中，威尼斯的保罗把义务理论与另一逻辑文类相比，说“义务理论的材料只是以后承的材料，只是风格更精细”（Paul of Venice in Ashworth 1988, 32）[^paul-1988][^ashworth-1988]。他这句话的一个意思大概是：义务理论与后承都关涉非三段论逻辑。就此而言，即便从现代视角看，这一描述也似正确。但若认为义务论辩试图阐明前件与后件、甚至一组前提与结论之间的逻辑关系，则似不十分确当：义务论辩所考察的逻辑关系并非特有的二元关系，而往往被当作只在一个动态的三元或更多命题序列中才显明的逻辑关系来处理。
    step2: |-
      在 14 世纪末的 *obligationes* 讨论中，威尼斯的保罗把义务理论与另一逻辑文类相比，说“义务理论的材料只是以后承的材料，只是风格更精细”（Paul of Venice in Ashworth 1988, 32）[^paul-1988][^ashworth-1988]。这大约是说：义务理论与后承都关涉非三段论逻辑——就此而言，即便从现代视角看，这一描述也似正确。但若认为义务论辩试图阐明前件与后件、甚至一组前提与结论之间的逻辑关系，则似不确当。义务论辩所考察的逻辑关系并非特有的二元关系，而往往被当作只在一个动态的三元或更多命题序列中才显明的关系。
