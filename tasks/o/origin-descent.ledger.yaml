      When he addresses the more complex mental properties that specifically had been considered by a long tradition of discussion to be the distinctive human properties—possession of language, reason, abstract conceptual thinking, self-reflection—these again are treated as having their manifestations in other forms of life, with none of them unique to human beings. Language, the property that Descartes, for example, had considered to be the primary distinguishing character denoting the human possession of mind as distinct from matter, Darwin treats a developing in a gradual process from animal sounds that parallel the differentiation of species, illustrated by the fact that languages “like organic beings, can be classed in groups under groups” (Darwin 1871 [1981], 60)[^darwin-1871]. He closes his discussion of mental powers with an analysis of religious belief that derives it from imagination and belief in spirits found in aboriginal peoples. It can even be homologized with the “deep love of a dog for his master, associated with complete submissions, some fear, and perhaps other feelings” (ibid., 68). Darwin’s discussions of the relation of human and animal mental and emotional properties would set the agenda for a complex discussion that would carry into contemporary debates over animal cognition and the relations of human and animal properties (see the entries on animal cognition; methods in comparative cognition; and animal consciousness).
    step1: |-
      当他处理那些被悠久讨论传统特别视为人类独有特性的更复杂心智特性——拥有语言、理性、抽象概念思维、自我反思——时，这些同样被说成在其他生命形态中有其表现，没有一项为人类独有。以语言为例：笛卡尔曾认为，语言是标示人类拥有心智、有别于物质的首要区分特征；达尔文却把语言视为从动物声音逐步发展而来的过程，与物种分化相平行；语言“像有机体一样，可以按群分群”这一事实即是例证（Darwin 1871 [1981], 60）[^darwin-1871]。他以对宗教信仰的分析结束心智能力讨论，把宗教信念追溯至想象与原始民族对精灵的信仰。宗教信念甚至可以与“狗对其主人的深爱，伴随完全的顺从、一些恐惧，或许还有其他情感”相类比（ibid., 68）。达尔文关于人与动物心智、情感特性之关系的讨论，将开启一场复杂的讨论，并一直延续到当代关于动物认知以及人与动物特性关系的争论（见“动物认知”“比较认知方法”“动物意识”词条）。
