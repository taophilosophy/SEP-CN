      Sexual selection—the choosing of females by males or vice versa for breeding purposes—had received a general statement by Darwin in Chapter IV of the *Origin*, but this played only a minor role in the original argument, and its importance was denied by co-evolutionist A. R. Wallace. In the *Descent* this was now developed in extensive detail as a major factor in evolution that could even work against ordinary natural selection. Sexual selection could be marshaled to explain sexual dimorphism, and also the presence of unusual characters and properties of organisms—elaborate feeding organs, bright colors, and other seemingly maladaptive structures such as the antlers on the Irish Elk or the great horn on the Rhinoceros beetle—that would appear anomalous outcomes of ordinary natural selection working for the optimal survival of organisms in nature. In a dramatic extension of the principle to human beings, the combination of natural and sexual selection is used to explain the origins of human beings from simian ancestors. It also accounts for the sexual dimorphism in humans, and is a major factor accounting for the origin of human races (E. Richards 2017; R. A. Richards 2013)[^richards-2017][^richards-2013][^richards-2013-2].
    step1: |-
      性选择——为繁殖目的，雄性选择雌性，或反之——达尔文曾在《物种起源》第四章作过一般陈述，但在原初论证中只起次要作用，其重要性还遭到共同演化论者 A. R. 华莱士的否认。在《人类的由来》中，性选择被详尽展开为演化中的一个主要因素，甚至可能对抗普通的自然选择。性选择可以用来说明性二态，也可以说明生物一些不寻常的性状与特性——精巧的取食器官、鲜艳的颜色，以及其他看似不适应的结构，如爱尔兰麋鹿的角或犀牛甲虫的大角——这些看起来像是自然选择为生物在自然界中最优生存而运作的异常结果。把这一原理戏剧性地扩展到人类，自然选择与性选择的结合被用来解释人类从类人猿祖先的起源；它也说明了人类的性二态，并且是解释人种起源的一个主要因素（E. Richards 2017; R. A. Richards 2013）[^richards-2017][^richards-2013][^richards-2013-2]。
    step2: |-
      性选择——为繁殖目的，雄选雌或雌选雄——达尔文在《物种起源》第四章作过一般陈述，但在原初论证中只居次要地位，共同演化论者 A. R. 华莱士还否认它的重要性。到了《人类的由来》，性选择被详加展开为演化的主要因素，甚至可能对抗普通的自然选择。它能解释性二态，也能解释生物一些不寻常的性状：精巧的取食器官、鲜艳的颜色，以及其他看似不适应的结构，如爱尔兰麋鹿的角、犀牛甲虫的大角——这些看起来都像自然选择为最优生存而运作的异常产物。把这一原理戏剧性地推及人类，自然选择与性选择的结合便用来解释人类如何从类人猿祖先起源；它也说明了人类的性二态，还是解释人种起源的一个主要因素（E. Richards 2017; R. A. Richards 2013）[^richards-2017][^richards-2013][^richards-2013-2]。
