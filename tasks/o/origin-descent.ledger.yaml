      Of central importance in analyzing this complex professional reception was the role assigned by Darwin to the importance of normal individual variation as the source of evolutionary novelty. As we have seen, Darwin had relied on the novel claim that small individual variations—the kind of differences considered by an earlier tradition as merely “accidental”—formed the raw material upon which, by cumulative directional change under the action of natural selection, major changes could be produced sufficient to explain the origin and subsequent differences in all the various forms of life over time. Darwin, however, left the specific causes of this variation unspecified beyond some effect of the environment on the sexual organs. Variation was presented in the *Origin* with the statement that “the laws governing inheritance are quite unknown” (Darwin 1859 [1964], 13)[^darwin-1859]. In keeping with his commitment to the gradualism of Lyellian geology, Darwin also rejected the role of major “sports” or other sources of discontinuous change in this process.
    step1: |-
      在分析这一复杂的专业接受时，核心重要性在于达尔文赋予正常个体变异作为演化新质来源的地位。如前所述，达尔文依赖一个新颖主张：微小的个体变异——早期传统视为纯粹“偶然”的那类差异——构成原材料；在自然选择作用下，累积的方向性变化能在这些原材料上产生重大变化，足以解释一切生命形态的起源及其随时间推移的差异。然而，达尔文并未具体说明这种变异的原因，只提到环境对生殖器官的某种影响。《物种起源》在呈现变异时说“支配遗传的规律完全未知”（Darwin 1859 [1964], 13）[^darwin-1859]。为与他坚持的莱尔式地质渐变论一致，达尔文还拒绝重大“芽变”或其他不连续变化来源在这一过程中的作用。
    step2: |-
      分析这一复杂的专业接受，关键在达尔文赋予“正常个体变异”的地位：它是演化新质的来源。如前所述，达尔文依靠一个新颖主张：微小的个体变异——早期传统视为纯粹“偶然”的差异——就是原材料；在自然选择作用下，累积的方向性变化能在其上产生重大变化，足以解释一切生命形态的起源，以及它们随时间形成的差异。但达尔文没有具体说明这种变异的原因，只提到环境对生殖器官的某种影响。《物种起源》谈到变异时说“支配遗传的规律完全未知”（Darwin 1859 [1964], 13）[^darwin-1859]。为了与自己坚持的莱尔式地质渐变论一致，他还拒绝重大“芽变”或其他不连续变化来源在这一过程中的作用。
