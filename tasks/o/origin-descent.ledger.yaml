      ## 5. Summary and Conclusion
    step1: |-

    step2: |-

  - id: 120
    kind: body
    source: |-
      This article has intended to give a historical overview of the specific nature of Darwinian theory, and outline the ways in which it differed from the theories of predecessors in the nineteenth century (see the entry evolution before Darwin). The eventual general consensus achieved by the middle of the twentieth century around the so-named “Synthetic” theory of evolution that would combine population genetics with a mathematical analysis of evolutionary change, has formed a successful research program for more than half a century (Smocovitis 1996; Mayr and Provine 1980; Provine 1971)[^mayr-1980][^provine-1971][^smocovitis-1996]. This “synthesis” has been challenged in recent decades by the current movement known as evolutionary developmental theory, or “evo-devo”. This development represents in some important respects a return to presumably discarded traditions and lines of exploration of the nineteenth and early twentieth centuries which sought to link evolution with embryological development, and to a complex understanding of genetics, with re-examination of the effects of external conditions on inheritance (Gilbert 2015; Newman 2015; Laubichler and Maienschein 2007; Gissis and Jablonka 2011; Pigliucci and Müller 2010; Amundson 2005; Gilbert, Opitz and Raff 1996)[^amundson-2005][^gilbert-2015][^gissis-2011][^laubichler-2007][^newman-2015][^pigliucci-2010]. Where these debates and revisions in evolutionary theory may lead in another fifty years is a matter of speculation (Gayon 2015 in Sloan, McKenny and Eggleson 2015)[^gayon-2015].
    step1: |-

    step2: |-

  - id: 121
    kind: body
    source: |-
      More general philosophical issues associated with evolutionary theory—those surrounding natural teleology, ethics, the relation of evolutionary naturalism to the claims of religious traditions, the implications for the relation of human beings to the rest of the organic world—continue as issues of scholarly inquiry. The status of Darwin’s accounts of human mental powers and moral properties continue to be issues of philosophical debate. The adequacy of his reliance on sexual selection to explain sex and gender roles in human society form heated topics in some feminist scholarship. Such developments suggest that there are still substantial theoretical issues at stake that may alter the future understanding of evolutionary theory in important ways (Sloan, McKenny, & Eggleson [eds] 2015).
    step1: |-

    step2: |-

