    source: |-
      Darwin’s theory first took written form in reflections in a series of notebooks begun during the latter part of the *Beagle* voyage and continued after the return of the *Beagle* to England in October of 1836 (Barrett et al., 1987). His reflections on the possibility of species change are first entered in March of 1837 (“Red Notebook”) and are developed in the other notebooks (B–E) through July of 1839 (Barrett et al. 1987; Hodge 2013a, 2009)[^barrett-1987][^hodge-2013a]. Beginning with the reflections of the third or “D” “transmutation” Notebook, composed between July and October of 1838, Darwin first worked out the rudiments of what was to become his theory of natural selection. In the parallel “M” and “N” Notebooks, dating between July of 1838 and July of 1839, and in a loose collection called “Old and Useless Notes”, dating from approximately 1838–40, he also developed many of his main ideas on human evolution that would only be made public in the *Descent of Man* of 1871 (below, Section 4).
    step1: |-
      达尔文的理论最初以笔记中的思考形式成文；这些笔记始于贝格尔号航行后期，并在他 1836 年 10 月返回英国后继续（Barrett et al., 1987）。他关于物种可能变化的思考，最早于 1837 年 3 月记入“红笔记本”，并在其他笔记本（B–E）中一直发展到 1839 年 7 月（Barrett et al. 1987; Hodge 2013a, 2009）[^barrett-1987][^hodge-2013a]。从第三本即“D”本“transmutation”笔记本（写于 1838 年 7 月至 10 月）的思考开始，达尔文首次勾勒出后来成为其自然选择理论的雏形。在时间介于 1838 年 7 月与 1839 年 7 月之间的平行“M”“N”笔记本，以及约 1838–40 年的松散札记集“Old and Useless Notes”中，他还发展出许多关于人类演化的主要观念，这些观念直到 1871 年《人类的由来》才公之于众（见下文第 4 节）。
    step2: |-
      达尔文的理论，最初以笔记中的思考成形。这些笔记始于贝格尔号航行后期，在他 1836 年 10 月返回英国后仍继续（Barrett et al., 1987）。他关于物种可能变化的思考，最早于 1837 年 3 月记入“红笔记本”，随后在其他笔记本（B–E）中发展到 1839 年 7 月（Barrett et al. 1987; Hodge 2013a, 2009）[^barrett-1987][^hodge-2013a]。从第三本即“D”本“transmutation”笔记本（写于 1838 年 7 月至 10 月）开始，达尔文首次勾勒出后来成为其自然选择理论的雏形。在时间介于 1838 年 7 月与 1839 年 7 月之间的平行“M”“N”笔记本，以及约 1838–40 年的松散札记集“Old and Useless Notes”中，他还发展出许多关于人类演化的主要观念；这些观念直到 1871 年《人类的由来》才公开（见下文第 4 节）。
