      Remarkable about Darwin’s diagram of the tree of life is the relativity of its coordinates. It is first presented as applying only to the divergences taking place in taxa at the species level, with varieties represented by the small lower-case letters within species A–L of a “wide ranging genus”, with the horizontal lines representing time segments measured in terms of a limited number of generations. However, the attentive reader could quickly see that Darwin’s destructive analysis of the distinction between “natural” and “artificial” species in Chapter Two, implied the relativity of the species-variety distinction, this diagram could represent eventually all organic relationships, from those at the non-controversial level of diverging varieties within fixed species, to those of the relations of Species within different genera. Letters A–L could also represent taxa at the level of genera, families or orders. The diagram can thus be applied to relationships between all levels of the Linnaean hierarchy with the time segments representing potentially vast expanses of time, and the horizontal spread of branches the degree of taxonomic divergence over time. In a very few pages of argument, the diagram was generalized to represent the most extensive group relations, encompassing the whole of geological time. Extension of the dotted lines at the bottom could even suggest, as Darwin argues in the last paragraph of the *Origin*, that all life was a result of “several powers, having been originally breathed into a few forms or into one” (Darwin 1859 [1964], 490)[^darwin-1859]. This could suggest a single naturalistic origin of all original forms either by material emergence, or through the action of a vitalistic power of life. Darwin’s use of Biblical language could also be read as allowing for the action of a supernatural cause.
    step1: |-
      达尔文生命之树图引人注目之处，是其坐标的相对性。它起初只用于表示物种层次类群中发生的分歧，变种由“分布广泛的属”物种 A–L 内的小写字母表示，横线代表以有限世代数计量的时间段。然而，细心的读者很快可以看出：达尔文在第二章对“自然”物种与“人为”物种之区分的破坏性分析，已隐含物种—变种区分的相对性；这幅图最终可以表示一切有机关系，从固定物种内部变种分歧这一无争议层次，到不同属内物种之间的关系。字母 A–L 也可以代表属、科或目层次的类群。因此，这幅图可适用于林奈等级体系所有层次之间的关系，时间段可代表潜在的漫长时间跨度，分支的水平延展则代表随时间推移的分类分歧程度。在短短几页论证中，这幅图被普遍化，用来表示最广泛的类群关系，涵盖整个地质时间。底部虚线的延伸甚至可以暗示——如达尔文在《物种起源》最后一段所论证的——一切生命都是“若干力量”的结果，“这些力量最初被吹入少数形态、或一个形态之中”（Darwin 1859 [1964], 490）[^darwin-1859]。这可能暗示一切原初形态有一个自然主义的单一来源：或通过物质涌现，或通过某种生命力原则的作用。达尔文对《圣经》语言的使用，也可以被解读为容许超自然原因的作用。
