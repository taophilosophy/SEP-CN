    kind: body
    source: |-
      A body of recent historiography, on the other hand, drawing on the wealth of manuscripts and correspondence that have become available since the 1960s (online at Darwin online “Papers and Manuscripts” section, see Other Internet Resources) has de-emphasized some of the novelty of Darwin’s views and questions have been raised regarding the validity of the standard biographical picture of the early Darwin. These materials have drawn attention to previously ignored aspects of Darwin’s biography. In particular, the importance of his Edinburgh period from 1825–27, largely discounted in importance by Darwin himself in his late *Autobiography*, has been seen as critical for his subsequent development (Desmond and Moore 1991; Hodge 1985)[^desmond-1991][^hodge-1985]. As a young medical student at the University of Edinburgh (1825–27), Darwin developed a close relationship with the comparative anatomist Robert Edmond Grant (1793–1874) through the student Plinian Society, and in many respects Grant served as Darwin’s first mentor in science in the pre-*Beagle* years (Desmond and Moore 1991, chp. 1)[^desmond-1991]. Through Grant he was exposed to the transformist theories of Jean Baptiste Lamarck and the Cuvier-Geoffroy debate centered on the Paris *Muséum nationale d’histoire naturelle* (see entry on evolutionary thought before Darwin, Section 4).
    step1: |-
      另一方面，一批晚近史学著作依据 1960 年代以来大量可得的书信与手稿（见达尔文在线“Papers and Manuscripts”部分，其他网络资源），淡化了达尔文观点中的某些新颖性，并对早期达尔文标准传记图景的有效性提出质疑。这些材料使人们注意到达尔文传记中先前被忽视的方面。尤其是他 1825–27 年的爱丁堡时期——达尔文自己在晚年《自传》中大体上贬低了其重要性——被视为其后来发展的关键（Desmond and Moore 1991; Hodge 1985）[^desmond-1991][^hodge-1985]。作为爱丁堡大学（1825–27）的年轻医科学生，达尔文通过学生普林尼学会与比较解剖学家罗伯特·埃德蒙·格兰特（1793–1874）建立了密切关系；在许多方面，格兰特是达尔文在贝格尔号之前科学上的第一位导师（Desmond and Moore 1991, chp. 1）[^desmond-1991]。通过格兰特，达尔文接触到让-巴蒂斯特·拉马克的转型论，以及围绕巴黎国家自然史博物馆展开的居维叶—若弗鲁瓦之争（见“达尔文之前的演化思想”词条第 4 节）。
    step2: |-
      另一方面，晚近一批史学著作依据 1960 年代以来大量可得的书信与手稿（见达尔文在线“Papers and Manuscripts”部分，其他网络资源），淡化了达尔文观点中的某些新颖之处，并质疑早期达尔文标准传记图景是否成立。这些材料让人注意到达尔文传记中先前被忽视的方面。尤其是他 1825–27 年的爱丁堡时期——达尔文自己在晚年《自传》中大体上贬低了它的重要性——如今被视为其后来发展的关键（Desmond and Moore 1991; Hodge 1985）[^desmond-1991][^hodge-1985]。作为爱丁堡大学（1825–27）的年轻医科学生，达尔文通过学生普林尼学会与比较解剖学家罗伯特·埃德蒙·格兰特（1793–1874）交往密切；在许多方面，格兰特是达尔文在贝格尔号之前科学上的第一位导师（Desmond and Moore 1991, chp. 1）[^desmond-1991]。通过格兰特，达尔文接触到让-巴蒂斯特·拉马克的转型论，以及围绕巴黎国家自然史博物馆展开的居维叶—若弗鲁瓦之争（见“达尔文之前的演化思想”词条第 4 节）。
