      The language of this passage, directly underlying statements about the action of “natural selection” in the first edition of the published *Origin*, indicates the complexity in the exegesis of Darwin’s meaning of “natural selection” when viewed in light of its historical genesis (Ospovat 1981)[^ospovat-1981]. The parallels between art and nature, the intentionality implied in the term “selection”, the notion of “perfect” adaptation, and the substantive conception of “nature” as an agency working toward certain ends, all render Darwin’s views on teleological purpose more complex than they are typically interpreted from the standpoint of contemporary Neo-selectionist theory (Lennox 1993, 2013)[^lennox-1993]. As will be discussed below, the changes Darwin subsequently made in his formulations of this concept over the history of the *Origin* have led to different conceptions of what he meant by this principle.
