      The scholarly reconstruction of Darwin’s methodology employed in the *Origin* has taken two primary forms. One approach has been to reconstruct it from the standpoint of currently accepted models of scientific explanation, sometimes presenting it as a formal deductive model (Sober 1984)[^sober-1984]. Another, more historical, approach interprets his methodology in the context of accepted canons of scientific explanation found in Victorian discussions of the period (see the entry on Darwinism; Prestes 2023; White, Hodge and Radick 2021; Hodge 2013b, 1983b, 1977; Hoquet 2013; Hull 2009; Waters 2009; Depew 2009; Lennox 2005)[^depew-2009][^hodge-2013b][^hoquet-2013][^hull-2009][^lennox-2005][^prestes-2023][^waters-2009]. The degree to which Darwin did in fact draw from the available methodological discussions of his contemporaries—John Herschel, William Whewell, John Stuart Mill—is not fully clear from available documentary sources. The claim most readily documented, and defended particularly by White, Hodge and Radick (2021) and M. J. S. Hodge (1977, 1983a), has emphasized the importance of John Herschel’s *A Preliminary Discourse on the Study of Natural Philosophy* (1830 [1987]), which Darwin read as a young student at Cambridge prior to his departure on the *HMS Beagle* in December of 1831.
    step1: |-
      对达尔文在《物种起源》中所用方法论的学术重构，主要有两种形态。一种是从当前公认的科学解释模型出发进行重构，有时把它呈现为一个形式演绎模型（Sober 1984）[^sober-1984]。另一种更偏历史的进路，则把其方法论放在维多利亚时代讨论中公认的科学解释准则背景下来解释（见“达尔文主义”词条；Prestes 2023; White, Hodge and Radick 2021; Hodge 2013b, 1983b, 1977; Hoquet 2013; Hull 2009; Waters 2009; Depew 2009; Lennox 2005）[^depew-2009][^hodge-2013b][^hoquet-2013][^hull-2009][^lennox-2005][^prestes-2023][^waters-2009]。达尔文究竟在多大程度上汲取了同时代人——约翰·赫歇尔、威廉·休厄尔、约翰·斯图尔特·密尔——现存的方法论讨论，现有文献证据并不完全清楚。最容易得到文献支持、并由 White、Hodge 与 Radick（2021）以及 M. J. S. Hodge（1977, 1983a）特别辩护的主张，强调约翰·赫歇尔《自然哲学研究初论》（1830 [1987]）的重要性；达尔文 1831 年 12 月随“HMS 贝格尔号”出发前，在剑桥求学时读过此书。
