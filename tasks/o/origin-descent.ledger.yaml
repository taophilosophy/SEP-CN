      对达尔文来说，《人类的由来》第三章随后对伦理问题的处理，是一个要“完全从博物学方面”接近的题目（ibid., 71）。这一问题也给他带来了一些最困难的概念难题（CD to Gray, 15 March 1870, Burkhardt, *Correspondence* 18, 68）。在这一讨论中，他还把自然选择理论当作解释性原因来使用。
