      In the Germanies, Darwin’s work entered a complex social, intellectual and political situation in the wake of the failed efforts to establish a liberal democracy in 1848. It also entered an intellectual culture strongly influenced by the pre-existent philosophical traditions of Kant, Schelling’s *Naturphilosophie*, German Romanticism, and the Idealism of Fichte and Hegel (R. J. Richards 2002, 2008, 2013; Gliboff 2007, 2008; Mullen 1964)[^gliboff-2007][^mullen-1964][^richards-2002]. These factors formed a complex political and philosophical environment into which Darwin’s developmental view of nature and theory of the transformation of species was quickly assimilated, if also altered. Many readings of Darwin consequently interpreted his arguments against the background of Schelling’s philosophy of nature. The marshalling of Darwin’s authority in debates over scientific materialism were also brought to the fore by the enthusiastic advocacy of Darwinism in Germany by University of Jena professor of zoology Ernst Heinrich Haeckel (1834–1919). More than any other individual, Haeckel made *Darwinismus* a major player in the polarized political and religious disputes of Bismarckian Germany (R. J. Richards 2008)[^richards-2008]. Through his polemical writings, such as the *Natural History of Creation* (1868), *Anthropogeny* (1874), and *Riddle of the Universe* (1895–99), Haeckel advocated a materialist monism in the name of Darwin, and used this as a stick with which to beat traditional religion. Much of the historical conflict between religious communities and evolutionary biology can be traced back to Haeckel’s polemical writings, which went through numerous editions and translations, including several English and American editions that appeared into the early decades of the twentieth century.
    step1: |-
      在德意志各邦，达尔文的工作进入了一个复杂的社会、思想与政治处境：1848 年建立自由民主的努力失败之后。它还进入了一种深受既有哲学传统影响的思想文化：康德、谢林的《自然哲学》、德国浪漫主义，以及费希特与黑格尔的唯心论（R. J. Richards 2002, 2008, 2013; Gliboff 2007, 2008; Mullen 1964）[^gliboff-2007][^mullen-1964][^richards-2002]。这些因素构成复杂的政治与哲学环境；达尔文关于自然的发展观与物种转型理论迅速被吸收进来，尽管也经过了改造。因此，许多对达尔文的解读都在谢林自然哲学的背景下解释其论证。耶拿大学动物学教授恩斯特·海因里希·海克尔（1834–1919）对达尔文主义在德国的热情鼓吹，也使达尔文的权威被用于科学唯物主义之争。海克尔比任何人都更使 *Darwinismus* 成为俾斯麦德国两极化的政治与宗教争论中的主要角色（R. J. Richards 2008）[^richards-2008]。通过《自然创造史》（1868）、《人类发生学》（1874）、《宇宙之谜》（1895–99）等论战著作，海克尔以达尔文之名倡导唯物主义一元论，并以此为大棒打击传统宗教。宗教群体与演化生物学之间的许多历史冲突，都可追溯到海克尔的论战著作；这些著作历经众多版本与译本，包括直到 20 世纪初叶仍在出现的若干英美版本。
    step2: |-
      在德意志各邦，达尔文的工作进入了一个复杂的社会、思想与政治处境——1848 年建立自由民主的努力刚刚失败。它还进入一种深受既有哲学传统影响的思想文化：康德、谢林的《自然哲学》、德国浪漫主义，以及费希特与黑格尔的唯心论（R. J. Richards 2002, 2008, 2013; Gliboff 2007, 2008; Mullen 1964）[^gliboff-2007][^mullen-1964][^richards-2002]。这些因素构成复杂的政治与哲学环境；达尔文关于自然的发展观与物种转型理论迅速被吸收，当然也经过了改造。于是，许多解读都在谢林自然哲学的背景下理解达尔文的论证。耶拿大学动物学教授恩斯特·海因里希·海克尔（1834–1919）热情鼓吹达尔文主义，更把达尔文的权威推到科学唯物主义之争的前台。海克尔比任何人都更使 *Darwinismus* 成为俾斯麦德国两极化政治与宗教争论中的主要角色（R. J. Richards 2008）[^richards-2008]。通过《自然创造史》（1868）、《人类发生学》（1874）、《宇宙之谜》（1895–99）等论战著作，海克尔以达尔文之名倡导唯物主义一元论，并拿它当大棒打击传统宗教。宗教群体与演化生物学之间的许多历史冲突，都能追溯到海克尔的论战著作；这些书历经众多版本与译本，包括直到 20 世纪初叶仍在印行的若干英美版本。
