      The *Origin of Species by Means of Natural Selection, or the Preservaton of Favoured Races in the Struggle for Life* was issued in London by the publishing house of John Murray on November 24, 1859 (Darwin 1859 [1964])[^darwin-1859]. The structure of the argument presented in the published *Origin* has been the topic of considerable literature and can only be summarized here. Although Darwin himself described his book as “one long argument”, the exact nature of this argument is not immediately transparent, and alternative interpretations have been made of his reasoning and rhetorical strategies in formulating his evolutionary theory. (Prestes 2023; White, Hodge and Radick 2021; Hodge 2013b, 1977; Hoquet 2013; Hull 2009; Waters 2009; Depew 2009; Ruse 2009; Lennox 2005; Hodge 1983b)[^depew-2009][^hodge-1983b][^hodge-2013b][^hoquet-2013][^hull-2009][^lennox-2005][^prestes-2023][^ruse-2009][^waters-2009].
