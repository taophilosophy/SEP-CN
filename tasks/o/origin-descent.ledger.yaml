      The other plausible methodological source for Darwin’s mature reasoning was the work of his older contemporary and former Cambridge mentor, the Rev. William Whewell (1794–1866), whose three-volume *History of the Inductive Sciences* (Whewell 1837)[^whewell-1837] Darwin read with care after his return from his round-the-world voyage (Ruse 2013c, 1975)[^ruse-2013c]. On this reading, a plausible argument has been made that the actual structure of Darwin’s text is more closely similar to a “Whewellian” model of argument. In Whewell’s accounts of his philosophy of scientific methodology (Whewell 1840, 1858)[^whewell-1840], the emphasis of scientific inquiry is, as Herschel had also argued, to be placed on the discovery of “true causes”. But evidence for the determination of a *vera causa* was to be demonstrated by the ability of disparate phenomena to be drawn together under a single unifying “Conception of the Mind”, exemplified for Whewell by Newton’s universal law of gravitation. This “Consilience of Inductions”, as Whewell termed this process of theoretical unification under a few simple concepts, was achieved only by true scientific theories employing true causes (Whewell 1840: xxxix)[^whewell-1840]. It has therefore been argued that Darwin’s theory fundamentally produces this kind of consilience argument, and that his methodology is more properly aligned with that of Whewell.
    step1: |-
      达尔文成熟推理的另一个可能方法论来源，是其年长的同时代人、剑桥时期的导师威廉·休厄尔牧师（1794–1866）的著作。达尔文环球航行归来后，仔细研读了他的三卷本《归纳科学史》（Whewell 1837）[^whewell-1837]（Ruse 2013c, 1975）[^ruse-2013c]。据此，有论者提出一个可信的论证：达尔文文本的实际结构，更接近“休厄尔式”的论证模型。在休厄尔关于科学方法论哲学的论述中（Whewell 1840, 1858）[^whewell-1840]，正如赫歇尔也曾主张的，科学探究的重点应放在发现“真实原因”上。但要确定一个 *vera causa*，其证据须表现为：把彼此不同的现象统摄到单一的统一“心灵概念”之下——休厄尔以牛顿的万有引力定律为例。休厄尔把这种在少数简单概念下实现理论统一的过程称为“归纳的一致”（Consilience of Inductions），只有运用真实原因的真正科学理论才能达到（Whewell 1840: xxxix）[^whewell-1840]。因此有论者主张，达尔文的理论从根本上产生了这类一致性论证，其方法论与休厄尔更为合拍。
