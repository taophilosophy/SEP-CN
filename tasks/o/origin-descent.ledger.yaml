      The broad sweep of Darwin’s claims, the brevity of the empirical evidence actually supplied in the *Origin*, and the implications of his theory for several more general philosophical and theological issues, opened up a controversy over Darwinian evolution that has waxed and waned over more than 160 years. The theory was inserted into a complex set of different national and cultural receptions the study of which currently forms a scholarly industry in its own right. European, Latin American and Anglophone receptions have been most deeply studied (Bowler 2013a; Gayon 2013; Largent 2013; Glick 1988, 2013; Glick and Shaffer 2014; Engels and Glick 2008; Gliboff 2008; Numbers 1998; Pancaldi, 1991; Todes 1989; Kelly 1981; Hull 1973; Mullen 1964)[^bowler-2013a][^engels-2008][^gayon-2013][^gliboff-2008][^glick-1988][^glick-2014][^hull-1973][^kelly-1981][^largent-2013][^mullen-1964][^numbers-1998][^todes-1989]. To these have been added analyses of non-Western recptions (Jin 2020, 2019 a,b; Yang 2013; Shen 2016; Elshakry 2013; Pusey 1983)[^elshakry-2013][^jin-2020][^pusey-1983][^shen-2016][^yang-2013]. These analyses display common patterns in both Western and non-Western readings of Darwin’s theory, in which these receptions were conditioned, if not determined, by the pre-existing intellectual, scientific, religious, social, and political contexts into which his works were inserted.
    step1: |-
      达尔文主张的横扫之势、《物种起源》实际提供的经验证据之简略，以及其理论对若干更一般的哲学与神学议题的蕴含，引发了一场围绕达尔文演化的争论，160 多年来潮起潮落。这一理论被置入各国各文化复杂多样的接受情境；对接受情况的研究本身如今已成一门学术产业。欧洲、拉丁美洲与英语世界的接受研究最为深入（Bowler 2013a; Gayon 2013; Largent 2013; Glick 1988, 2013; Glick and Shaffer 2014; Engels and Glick 2008; Gliboff 2008; Numbers 1998; Pancaldi, 1991; Todes 1989; Kelly 1981; Hull 1973; Mullen 1964）[^bowler-2013a][^engels-2008][^gayon-2013][^gliboff-2008][^glick-1988][^glick-2014][^hull-1973][^kelly-1981][^largent-2013][^mullen-1964][^numbers-1998][^todes-1989]。在此之外，又增加了对非西方接受的分析（Jin 2020, 2019 a,b; Yang 2013; Shen 2016; Elshakry 2013; Pusey 1983）[^elshakry-2013][^jin-2020][^pusey-1983][^shen-2016][^yang-2013]。这些分析显示出西方与非西方解读达尔文理论的共同模式：这些接受即便不是由既有的思想、科学、宗教、社会与政治语境所决定，也受到其深刻制约。
    step2: |-
