      “自然选择”手稿还包含一些与自然选择概念相关的新理论发展，为早期手稿所无。学者们注意到，这份手稿引入了“分歧原则”：在自然选择作用下，生物倾向于在其“生活条件”——当时对环境影响与物种相互作用关系之复合体的称呼——内部辐射分化（Kohn 1985b, 2009）[^kohn-1985b]。尽管自然选择作用下群体分歧的概念，或许可视为达尔文 1830 年代最早表述中的理论蕴含，但达尔文明确将其界定为一条“原则”，并在“自然选择”手稿后段的长篇插入中加以讨论，这表明它对达尔文成熟理论的重要性。达尔文此时认为，分歧原则构成了自然变异与在种群增长驱动力作用下生存条件之间的重要纽带。
