      In its historical origins, Darwin’s theory was different in kind from its main predecessors in important ways (Ruse 2013b; Sloan 2009a; see also the entry on evolutionary thought before Darwin)[^ruse-2013b][^sloan-2009a]. Viewed against a longer historical scenario, Darwin’s theory does not deal with cosmology or the origins of the world and life through naturalistic means, and therefore was more restricted in its theoretical scope than its main predecessors influenced by the reflections of Georges Louis LeClerc de Buffon (1707–1788), Johann Herder (1744–1803, and German *Naturphilosophen* inspired by Friederich Schelling (1775–1854)*.* This restriction also distinguished Darwin’s work from the grand evolutionary cosmology put forth anonymously in 1844 by the Scottish publisher Robert Chambers (1802–1871) in his immensely popular *Vestiges of the Natural History of Creation*, a work which in many respects prepared Victorian society in England, and pre-Civil War America for the acceptance of a general evolutionary theory in some form (Secord 2000; MacPherson 2015)[^macpherson-2015][^secord-2000]. It also distinguishes Darwin’s formulations from the theories of his contemporary Herbert Spencer (1820–1903).
    step1: |-
      就其历史起源而言，达尔文的理论在一些重要方面与主要前驱在种类上不同（Ruse 2013b; Sloan 2009a；另见“达尔文之前的演化思想”词条）[^ruse-2013b][^sloan-2009a]。放在更长的历史图景中看，达尔文的理论不涉及宇宙论，也不以自然主义方式处理世界与生命的起源，因此其理论范围比受布丰（1707–1788）、约翰·赫尔德（1744–1803）以及受谢林（1775–1854）启发的德国自然哲学家（*Naturphilosophen*）之思考影响的主要前驱更为有限。这一限制也使达尔文的工作有别于 1844 年由苏格兰出版家罗伯特·钱伯斯（1802–1871）匿名提出的宏大演化宇宙论——即他那部极为流行的《自然创造史的遗迹》；该书在许多方面为维多利亚时代的英国社会以及内战前的美国接受某种形式的普遍演化理论作了准备（Secord 2000; MacPherson 2015）[^macpherson-2015][^secord-2000]。这同样使达尔文的表述有别于其同时代人赫伯特·斯宾塞（1820–1903）的理论。
    step2: |-
      就其历史起源而言，达尔文的理论在一些重要方面与主要前驱属于不同类型（Ruse 2013b; Sloan 2009a；另见“达尔文之前的演化思想”词条）[^ruse-2013b][^sloan-2009a]。放在更长的历史图景中看，达尔文的理论不涉及宇宙论，也不以自然主义方式处理世界与生命的起源，因此其理论范围比那些受布丰（1707–1788）、约翰·赫尔德（1744–1803）以及受谢林（1775–1854）启发的德国自然哲学家（*Naturphilosophen*）影响的主要前驱更为有限。这一限制也使达尔文的工作有别于 1844 年苏格兰出版家罗伯特·钱伯斯（1802–1871）匿名提出的宏大演化宇宙论——即他那部极为流行的《自然创造史的遗迹》。该书在许多方面为维多利亚时代的英国社会以及内战前的美国，接受某种形式的普遍演化理论作了准备（Secord 2000; MacPherson 2015）[^macpherson-2015][^secord-2000]。这同样使达尔文的表述有别于同时代人赫伯特·斯宾塞（1820–1903）的理论。
