      The earliest set of themes in the manuscript elaboration of natural selection theory can be characterized as those developed through a particular form of the argument from analogy. This took the form of a strong “proportional” form of the analogical argument that equated the relation of human selection to the development of domestic breeds as an argument of the basic form: human selection is to domestic variety formation as natural selection is to natural species formation (White, Hodge and Radick 2021, chps. 4–5). This makes a direct analogy between the actions of nature with those of humans in the process of selection. The specific expressions, and changes, in this analogy are important to follow closely. As this was expressed in the first coherent draft of the theory, a 39-page pencil manuscript written in 1842, this discussion analogized the concept of selection of forms by human agency in the creation of the varieties of domestic animals and plants, to the active selection in the natural world by an almost conscious agency, a “being infinitely more sagacious than man (not an omniscient creator)” who acts over “thousands and thousands of years” on “all the variations which tended towards certain ends” (Darwin 1842 in Glick and Kohn 1996, 91)[^darwin-1842][^glick-1996]. This agency selects out those features most beneficial to organisms in relation to conditions of life, analogous in its action to the selection by man on domestic forms in the production of different breeds. Interwoven with these references to an almost Platonic demiurge are appeals to the selecting power of an active “Nature”:
