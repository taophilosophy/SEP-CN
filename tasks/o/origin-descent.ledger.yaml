      To summarize a complex issue, these Notebook reflections show Darwin proceeding through a series of stages in which he first formulated a general theory of the transformation of species by historical descent from common ancestors. He then attempted to work out a causal theory of life that would explain the tendency of life to complexify and diversify (Hodge 2013a, 2009, 1985; Sloan 1986)[^hodge-2013a][^sloan-1986]. This causal inquiry into the underlying nature of life, and with it the search for an explanation of life’s innate tendency to develop and complexify, was then replaced by a dramatic shift in focus away from these inquiries. This concern with a causal theory of life was then replaced by a new emphasis on external forces controlling population, a thesis developed from his reading of Thomas Malthus’s (1766–1834) *Essay on the Principle of Population* (6th ed. 1826). For Malthus, human populaton was assumed to expand geometrically, while food supply expanded arithmetically, leading to an inevitable struggle of humans for existence. The impact of Darwin’s reading of this edition of the *Essay* in August of 1838, was dramatic. It enabled him to theorize the existence of a constantly-acting dynamic force behind the transformation of species.
    step1: |-
      概括这一复杂问题：这些笔记表明，达尔文经历了一系列阶段。他先提出一种关于物种经由共同祖先的历史传衍而转变的一般理论，随后试图建立一种生命的因果理论，以解释生命趋于复杂化与多样化的倾向（Hodge 2013a, 2009, 1985; Sloan 1986）[^hodge-2013a][^sloan-1986]。这一对生命根本本性的因果探究，以及随之而来的对生命固有发展与复杂化倾向之解释的寻求，随后被一次焦点上的剧烈转移所取代。对生命因果理论的关切，让位于一种新的强调：控制种群的外部力量。这一论题源自他阅读托马斯·马尔萨斯（1766–1834）的《人口原理》（第 6 版，1826）。在马尔萨斯那里，人口被假定按几何级数增长，而食物供应按算术级数增长，由此导致人类不可避免的生存斗争。达尔文 1838 年 8 月读到这一版《人口原理》的影响是戏剧性的：它使他得以设想，物种转变背后存在着一种持续起作用的动态力量。
