    source: |-
      Charles Darwin’s version of transformism has been the subject of massive historical and philosophical scholarship almost unparalleled in any other area of the history of science. This includes the continued flow of monographic studies and collections of articles on particular aspects of Darwin’s theory (Prestes 2023; R. J. Richards and Ruse 2016; Ruse 2013a, 2009a,b,c; Ruse and Richards 2009; Hodge and Radick 2009; Hösle and Illies 2005; Gayon 1998; Bowler 1996; Depew and Weber 1995; Kohn 1985a)[^bowler-1996][^depew-1995][^gayon-1998][^hodge-2009][^hodge-2009-2][^hösle-2005][^kohn-1985a][^prestes-2023][^richards-2009][^richards-2016][^ruse-2013a][^ruse-2009]. The continuous production of popular and professional biographical studies on Darwin provides ever new insights (Ruse et al. 2013a; Johnson 2012; Desmond and Moore 1991, 2009; Browne 1995, 2002; Bowlby 1990; Bowler 1990)[^bowlby-1990][^bowler-1990][^browne-1995][^desmond-1991][^johnson-2012][^ruse-2013a]. In addition, major editing projects on Darwin’s manuscripts and the completion of the *Correspondence*, project through the entirety of Darwin’s life, continue to reveal details and new insights into the issues surrounding Darwin’s own thought (Keynes [ed.] 2000; Burkhardt et al. [eds] 1985–2023; Barrett et al. [eds.] 1987). The Cambridge Darwin Online website (see Other Internet Resources) serves as an international clearinghouse for this worldwide Darwinian scholarship, functioning as a repository for electronic versions of all the original works of Darwin, including manuscripts and related secondary materials. It also supplies a continuously updated guide to current literature.
    step1: |-
      达尔文的转型论（transformism）版本，一直是大量历史与哲学研究的对象，其规模在科学史的其他领域几乎无出其右。这包括源源不断的专著，以及针对达尔文理论特定方面的论文集（Prestes 2023; R. J. Richards and Ruse 2016; Ruse 2013a, 2009a,b,c; Ruse and Richards 2009; Hodge and Radick 2009; Hösle and Illies 2005; Gayon 1998; Bowler 1996; Depew and Weber 1995; Kohn 1985a）[^bowler-1996][^depew-1995][^gayon-1998][^hodge-2009][^hodge-2009-2][^hösle-2005][^kohn-1985a][^prestes-2023][^richards-2009][^richards-2016][^ruse-2013a][^ruse-2009]。不断问世的通俗与专业达尔文传记研究，带来层出不穷的新洞见（Ruse et al. 2013a; Johnson 2012; Desmond and Moore 1991, 2009; Browne 1995, 2002; Bowlby 1990; Bowler 1990）[^bowlby-1990][^bowler-1990][^browne-1995][^desmond-1991][^johnson-2012][^ruse-2013a]。此外，达尔文手稿的重大编纂项目、以及覆盖达尔文整个一生的《通信集》项目的完成，持续揭示出围绕达尔文思想的种种细节与新见解（Keynes [ed.] 2000; Burkhardt et al. [eds] 1985–2023; Barrett et al. [eds.] 1987）。剑桥“达尔文在线”网站（见其他网络资源）是全世界达尔文研究的国际信息交换中心，也是达尔文全部原著电子版（包括手稿与相关二手材料）的存储库。它还提供不断更新的当前文献指南。
    step2: |-
      达尔文的转型论版本，一直是大量历史与哲学研究的对象，其规模在科学史其他领域几乎无出其右：既有源源不断的专著，也有针对达尔文理论某一方面的论文集（Prestes 2023; R. J. Richards and Ruse 2016; Ruse 2013a, 2009a,b,c; Ruse and Richards 2009; Hodge and Radick 2009; Hösle and Illies 2005; Gayon 1998; Bowler 1996; Depew and Weber 1995; Kohn 1985a）[^bowler-1996][^depew-1995][^gayon-1998][^hodge-2009][^hodge-2009-2][^hösle-2005][^kohn-1985a][^prestes-2023][^richards-2009][^richards-2016][^ruse-2013a][^ruse-2009]。通俗与专业的达尔文传记研究也不断问世，带来层出不穷的新洞见（Ruse et al. 2013a; Johnson 2012; Desmond and Moore 1991, 2009; Browne 1995, 2002; Bowlby 1990; Bowler 1990）[^bowlby-1990][^bowler-1990][^browne-1995][^desmond-1991][^johnson-2012][^ruse-2013a]。此外，达尔文手稿的重大编纂项目、覆盖其整个一生的《通信集》项目，持续揭示出围绕达尔文思想的细节与新见解（Keynes [ed.] 2000; Burkhardt et al. [eds] 1985–2023; Barrett et al. [eds.] 1987）。剑桥“达尔文在线”网站（见其他网络资源）是全球达尔文研究的国际信息交换中心，也是达尔文全部原著电子版的存储库，手稿与相关二手材料一并收录，并提供不断更新的当前文献指南。
  - id: 5
    kind: body
    source: |-
      A long tradition of scholarship has interpreted Darwin’s theory to have originated from a framework defined by endemic British natural history, a British tradition of natural theology defined particularly by William Paley (1743–1805), the methodological precepts of John Herschel (1792–1871), developed in his *A Preliminary Discourse on the Study of Natural Philosophy* (1830 [1987]), and the geological theories of Charles Lyell (1797–1875). His conversion to the uniformitarian geology of Charles Lyell and to Lyell’s advocacy of “deep” geological time during the voyage of the *HMS Beagle* (December 1831–October 1836), has been seen as fundamental in his formation (Norman 2013; Herbert 2005; Hodge 1983)[^herbert-2005][^norman-2013]. Complementing this predominantly anglophone historiography has been the social-constructivist analyses emphasizing the origins of Darwin’s theories in British Political Economy (Young 1985: chps. 2, 4, 5)[^young-1985]. It has also been argued that a primary generating source of Darwin’s inquiries was his involvement with the British anti-slavery movement, a concern reaching back to his revulsion against slavery developed during the *Beagle* years (Desmond and Moore 2009)[^desmond-2009].
    step1: |-
      长期以来的学术传统把达尔文理论的起源解释为一种框架的产物：本土英国博物学、以威廉·佩利（1743–1805）为代表的英国自然神学传统、约翰·赫歇尔（1792–1871）在其《自然哲学研究初论》（1830 [1987]）中提出的方法论准则，以及查尔斯·莱尔（1797–1875）的地质理论。达尔文在“HMS 贝格尔号”航行期间（1831 年 12 月—1836 年 10 月）转向莱尔的均变论地质学、接受莱尔对“深时”的倡导，被视为其思想形成中的根本事件（Norman 2013; Herbert 2005; Hodge 1983）[^herbert-2005][^norman-2013]。与这种以英语学界为主的史学相补充的，是强调达尔文理论起源于英国政治经济学（Young 1985: chps. 2, 4, 5）[^young-1985]的社会建构论分析。也有人论证，达尔文探究的一个主要生成来源是他参与英国废奴运动，这一关切可追溯至他在贝格尔号岁月中对奴隶制的厌恶（Desmond and Moore 2009）[^desmond-2009]。
    step2: |-
      长期以来的学术传统，把达尔文理论的起源解释为一种框架的产物：本土英国博物学；以威廉·佩利（1743–1805）为代表的英国自然神学传统；约翰·赫歇尔（1792–1871）在《自然哲学研究初论》（1830 [1987]）中提出的方法论准则；以及查尔斯·莱尔（1797–1875）的地质理论。达尔文随“HMS 贝格尔号”航行期间（1831 年 12 月—1836 年 10 月），转向莱尔的均变论地质学，接受莱尔对“深时”的倡导——这被视为其思想形成中的根本事件（Norman 2013; Herbert 2005; Hodge 1983）[^herbert-2005][^norman-2013]。与这种以英语学界为主的史学相补充的，是强调达尔文理论源自英国政治经济学的社会建构论分析（Young 1985: chps. 2, 4, 5）[^young-1985]。也有人论证，达尔文探究的一个主要来源是英国废奴运动，这一关切可追溯至他在贝格尔号岁月中对奴隶制的厌恶（Desmond and Moore 2009）[^desmond-2009]。
