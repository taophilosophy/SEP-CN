      在英语世界，达尔文的理论落入复杂的社会环境：在美国，这意味着内战前的奴隶制争论（Largent 2013; Numbers 1998）[^largent-2013][^numbers-1998]；在英国，它面对的是维多利亚中期社会的大规模工业扩张与科学职业化。只看英国阅读公众语境的若干方面：1844 年匿名出版的《自然创造史的遗迹》早已流行，到 1860 年 12 月已出 11 版、售出 23,350 册（Secord，“导言”，Chambers 1844 [1994], xxvii]）[^chambers-1844]，世纪末还有更多版本；这无疑为“物种经由次级自然规律作用而演化起源”这一观念打下了基础。《遗迹》那套生命目的论发展的宏大图式——从太阳系在气态星云中的最初开端，到人类在一项伟大的“发展规律”作用下出现——也经丁尼生勋爵的史诗《悼念》（1850）传给了维多利亚读者。有这样的《遗迹》背景，有人便可以把达尔文读成对如下信念的额外支持：生命在次级规律的目的论引导下乐观地历史发展，终将获得历史救赎。这类解读还使《物种起源》看来与达尔文同时代人赫伯特·斯宾塞的进步演化论相容（见“赫伯特·斯宾塞”词条）。正因相似，斯宾塞的著作成了重要载体：达尔文的观点经修改以符合斯宾塞的进步论后，最初正是借此传入非西方语境（Jin 2020, 2019 a,b; Lightman [ed.] 2015; Pusey 1983）[^jin-2020][^pusey-1983]。这类通俗接受忽视或修改了达尔文的自然选择演化概念，以迁就进步论的替代方案。
