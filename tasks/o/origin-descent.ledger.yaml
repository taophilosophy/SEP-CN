      Darwin’s interest in developing his insights into the origins of human beings and the explanation of human properties through descent with modification was, however, evident in his correspondence as early as January of 1860 when he began collecting evidence on the expressions of the emotions in human beings (Browne 2002, chp. 9)[^browne-2002]. He then developed a questionnaire specifically intended to gain such information from contacts in Patagonia and Tierra del Fuego (Radick 2018). Further engagement with these issues was then generated by the discussions of Lyell (1863) and A. R. Wallace (1864), both of whom suggested that natural selection could not account for the development of the “higher” rational faculties, language, and ethical motivation (R. J. Richards 1987, chp. 4)[^richards-1987]. It was then in February of 1867 that Darwin decided to remove material from his massive manuscript of the *Variation of Plants and Animals Under Domestication* to create a “very small volume, ‘an essay on the origin of mankind’” (Darwin to Hooker, 8 February 1867 and CD to Turner, 11 February 1867, Burkhardt, *Correspondence* 15: 74, 80). At this time he also sent to several international correspondents a more detailed questionnaire asking for information on human emotional expression. Further impetus to develop his views was created by the arguments of William R. Greg (1809–1881) in an essay in *Fraser’s Magazine* (1868), with further support by arguments of A. R. Wallace in 1869, both of whom drew a sharp distinction between human properties and those of animals (R. J. Richards 1987, 172–184)[^richards-1987]. These arguments denied that natural selection could explain the origins of these “higher powers”.
