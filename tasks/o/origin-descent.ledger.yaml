      Beginning in 1902, a second phase of Darwinian reception began with a partial translation of the first five chapters of the sixth edition of the *Origin* by the Chinese scientist, trained in chemistry and metallurgy in Japan and Germany, Ma Junwu (1881–1940). This partial translation, published between 1902 and 1906, again modified the text itself to agree with the progressive evolutionism of Spencer and with the progressivism already encountered in Yan Fu’s popular *Tianyan Lun.* Only in September of 1920 did the Chinese have Ma Junwu’s full translation of Darwin’s sixth edition. This late translation presented a more faithful rendering of Darwin’s text, including an accurate translation of Darwin’s final views on natural selection (Jin 2019 a, b). As a political reformer and close associate of democratic reformer Sun Yat-Sen (1866–1925), Ma Junwu’s interest in translating Darwin was also was involved with his interest in revolutionary Chinese politics (Jin 2019a, 2022)[^jin-2019a].
    step1: |-
      从 1902 年起，达尔文接受史的第二阶段开始：中国科学家马君武（1881–1940，曾留学日本与德国，学习化学与冶金）部分翻译了《物种起源》第六版前五章。这部节译本于 1902 至 1906 年间出版，再次修改了文本本身，以符合斯宾塞的进步演化论，以及严复那部流行的《天演论》中已经出现的进步论。直到 1920 年 9 月，中国人才有了马君武对达尔文第六版的全译本。这一晚出的译本更忠实地呈现了达尔文文本，包括对达尔文关于自然选择的最终观点的准确翻译（Jin 2019 a, b）。作为政治改革者、民主改革家孙中山（1866–1925）的密切同道，马君武翻译达尔文的兴趣也与他投身中国革命政治的兴趣相关（Jin 2019a, 2022）[^jin-2019a]。
