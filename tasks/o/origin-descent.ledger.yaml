      Darwin’s collapse of this Cartesian barrier with his theory of human origins outlined in the *Descent* continued a discussion that had been a concern of his transformist predecessors, especially Jean Baptiste Lamarck (Sloan 1999)[^sloan-1999]. But Darwin took this issue to a new level as he interpreted the human-animal relationship in the context of his novel theory of divergent evolution from common ancestors. Darwin also broke with the view of humans as the summit of a natural teleological process. Darwin instead denies such teleological ordering, and effectively reduces human properties to those of animals—mental as well as physical—by tracing them to their origin in properties of lower organisms.
    step1: |-
      达尔文在《人类的由来》中勾勒的人类起源理论，推倒了这道笛卡尔式壁垒；这延续了其转型论前驱——尤其是让-巴蒂斯特·拉马克——所关切的讨论（Sloan 1999）[^sloan-1999]。但达尔文把这一问题提到新层次：他在自己关于共同祖先分歧演化的新理论背景下解释人与动物的关系。达尔文还打破了“人是自然目的论过程顶峰”的观点。他否认这种目的论秩序，并把人类特性——无论心智还是身体——实际上还原为动物特性，办法是追溯它们在下等生物特性中的起源。
