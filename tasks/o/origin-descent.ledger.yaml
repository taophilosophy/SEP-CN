      Fleeming Jenkin also argued that the time needed by Darwin’s theory to account for the history of life under the gradual working of natural selection was simply unavailable from scientific evidence, supporting this claim by an appeal to the physical calculations of the probable age of the solar system presented in publications by his mentor, the Glasgow physicist William Thompson (Lord Kelvin, 1824–1907) (Burchfield 1975)[^burchfield-1975]. On the basis of Thompson’s quantitative physical arguments concerning the age of the sun and solar system, Fleeming Jenkin judged the time since the presumed first beginnings of life to be insufficient for the Darwinian gradualist theory of species transformation to have taken place.
    step1: |-
      詹金还主张，按自然选择的渐变运作来解释生命史，达尔文理论所需的时间根本无法从科学证据中获得。为支持这一主张，他援引其导师、格拉斯哥物理学家威廉·汤姆森（开尔文勋爵，1824–1907）在出版物中对太阳系可能年龄的物理计算（Burchfield 1975）[^burchfield-1975]。基于汤姆森关于太阳与太阳系年龄的定量物理论证，詹金判定：自生命最初开始以来所经过的时间，不足以让达尔文的渐变论物种转型理论发生。
    step2: |-
      詹金还主张：要用自然选择的渐变运作解释生命史，达尔文理论所需的时间，在科学证据里根本拿不出来。为支持这一点，他援引导师、格拉斯哥物理学家威廉·汤姆森（开尔文勋爵，1824–1907）发表的关于太阳系可能年龄的物理计算（Burchfield 1975）[^burchfield-1975]。根据汤姆森关于太阳与太阳系年龄的定量物理论证，詹金判定：从生命最初出现至今的时间，不够达尔文的渐变论物种转型理论施展。
