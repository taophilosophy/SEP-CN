      In the anglophone world, Darwin’s theory fell into a complex social environment that in the United States meant into the pre-Civil War slavery debates (Largent 2013; Numbers 1998)[^largent-2013][^numbers-1998]. In the United Kingdom it was issued against the massive industrial expansion of mid-Victorian society, and the development of professionalized science. To restrict focus to aspects of the British reading public context, the pre-existing popularity of the anonymous *Vestiges of the Natural History of Creation* of 1844, which had reached 11 editions and sold 23,350 copies by December of 1860 (Secord “Introduction” to Chambers 1844 [1994], xxvii])[^chambers-1844], with more editions to appear by the end of the century, certainly prepared the groundwork for the general notion of the evolutionary origins of species by the working of secondary natural laws. The *Vestiges*’s grand schema of a teleological development of life, from the earliest beginnings of the solar system in a gaseous nebula to the emergence of humanity under the action of a great “law of development”, had also been popularized for Victorian readers by Alfred Lord Tennyson’s epic poem *In Memoriam* (1850). This *Vestiges* backdrop provided a context in which some could read Darwin as supplying additional support for the belief in an optimistic historical development of life under teleological guidance of secondary laws with the promise of ultimate historical redemption. Such readings also rendered the *Origin* seemingly compatible with the progressive evolutionism of Darwin’s contemporary Herbert Spencer (see the entry on Herbert Spencer). Because of these similarities, Spencer’s writings served as an important vehicle by which Darwin’s views, modified to fit the progressivist views expounded by Spencer, were first introduced in non-Western contexts (Jin 2020, 2019 a,b; Lightman [ed.] 2015; Pusey 1983)[^jin-2020][^pusey-1983]. Such popular receptions ignored or revised Darwin’s concept of evolution by natural selection to fit these progressivist alternatives.
    step1: |-
      在英语世界，达尔文的理论落入了复杂的社会环境；在美国，这意味着落入内战前的奴隶制争论（Largent 2013; Numbers 1998）[^largent-2013][^numbers-1998]。在英国，它面对的是维多利亚中期社会的大规模工业扩张与科学职业化的发展。仅就英国阅读公众语境的若干方面而言：1844 年匿名出版的《自然创造史的遗迹》此前已广受欢迎，到 1860 年 12 月已出 11 版、售出 23,350 册（Secord，“导言”，Chambers 1844 [1994], xxvii]）[^chambers-1844]，到世纪末还有更多版本问世；这无疑为“物种经由次级自然规律作用而演化起源”这一一般观念准备了基础。《遗迹》那套生命目的论发展的宏大图式——从太阳系在气态星云中的最初开端，到人类在一项伟大的“发展规律”作用下出现——也经由丁尼生勋爵的史诗《悼念》（1850）而为维多利亚读者普及。这一《遗迹》背景提供了一个语境：有人可以从中把达尔文读成对如下信念的额外支持——生命在次级规律的目的论引导下乐观地历史发展，并终将获得历史救赎。这类解读还使《物种起源》看来与达尔文同时代人赫伯特·斯宾塞的进步演化论相容（见“赫伯特·斯宾塞”词条）。由于这些相似性，斯宾塞的著作成为重要载体：达尔文的观点经过修改以符合斯宾塞所阐述的进步论之后，最初正是通过这一载体传入非西方语境（Jin 2020, 2019 a,b; Lightman [ed.] 2015; Pusey 1983）[^jin-2020][^pusey-1983]。这类通俗接受忽视或修改了达尔文的自然选择演化概念，以迁就这些进步论替代方案。
