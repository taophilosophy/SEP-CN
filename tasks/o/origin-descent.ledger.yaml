      Under the heading of “Moral Sense”, Darwin offered some innovations in ethics that do not easily map on to standard ethical positions classified around the familiar categories of Rule or Act Utilitarianism, Kantian Deontology, Hedonism, and Emotivism. Darwin’s closest historical affinities are with the Scottish “Moral Sense” tradition of Frances Hutcheson (1694–1746), Adam Smith (1723?–1790), and David Hume (1711–1776). More immediately Darwin drew from the expositions of the moral sense theory by his distant relative, Sir James Macintosh (1765–1832) (R. J. Richards 1987, 114–122, 206–219)[^richards-1987].
    step1: |-
      在“道德感”标题下，达尔文提出了一些伦理学创新，这些创新不易归入按规则功利主义或行为功利主义、康德义务论、快乐主义与情感主义等熟悉范畴划分的标准伦理立场。达尔文在历史上最接近的，是弗朗西斯·哈奇森（1694–1746）、亚当·斯密（1723?–1790）与大卫·休谟（1711–1776）的苏格兰“道德感”传统。更直接地说，达尔文取材于其远亲詹姆斯·麦金托什爵士（1765–1832）对道德感理论的阐述（R. J. Richards 1987, 114–122, 206–219）[^richards-1987]。
    step2: |-
      在“道德感”标题下，达尔文提出了一些伦理学创新，很难归入按规则功利主义、行为功利主义、康德义务论、快乐主义、情感主义等熟悉范畴划出的标准立场。在历史上，他与弗朗西斯·哈奇森（1694–1746）、亚当·斯密（1723?–1790）、大卫·休谟（1711–1776）的苏格兰“道德感”传统最为接近。更直接地说，他取材于远亲詹姆斯·麦金托什爵士（1765–1832）对道德感理论的阐述（R. J. Richards 1987, 114–122, 206–219）[^richards-1987]。
  - id: 107
    kind: body
    source: |-
      Traditional moral sense theory linked ethical behavior to an innate property that was considered to be universal in human beings, although it required education and cultivation to reach its full expression (see the entry on moral sentimentalism). This inherent property, or “moral” sense, presumably explained such phenomena as ethical conscience, the sense of moral duty, and it accounted for altruistic actions that could not be reduced to hedonic seeking of pleasure and avoiding pain. It also did not involve the rational calculation of advantage, or the maximization of greatest happiness by an individual prior to action, as implied by Utilitarianism. For this reason Darwin criticized John Stuart Mill’s version of Utilitarian theory because it relied on acquired habits and the calculation of advantage (Darwin 1871 [1981], 71n5)[^darwin-1871].
    step1: |-
      传统道德感理论把伦理行为与一种先天属性联系起来；该属性被认为在人类中普遍存在，但需要教育与培养才能充分表现（见“道德情感主义”词条）。这种固有属性，即“道德”感，据信解释了伦理良知、道德义务感等现象，也说明了无法还原为趋乐避苦的利他行为。它也不涉及对利益的理性计算，或像功利主义所暗示的那样，由个体在行动前计算最大幸福。正因如此，达尔文批评约翰·斯图尔特·密尔版本的功利主义理论，因为它依赖习得习惯与利益计算（Darwin 1871 [1981], 71n5）[^darwin-1871]。
    step2: |-
      传统道德感理论把伦理行为系于一种先天属性。这种属性被认为人皆有之，但要靠教育与培养才能充分表现（见“道德情感主义”词条）。这种固有属性即“道德”感，据说可以解释伦理良知、道德义务感，也能说明那些无法还原为趋乐避苦的利他行为。它不涉及对利益的理性计算，也不像功利主义暗示的那样，要个体在行动前计算最大幸福。正因如此，达尔文批评约翰·斯图尔特·密尔版的功利主义：它依赖习得习惯与利益计算（Darwin 1871 [1981], 71n5）[^darwin-1871]。
