      In response to criticisms concerning this latter point, Darwin quickly added to the final paragraph in the second edition of 1860 the phrase “by the Creator” (1860: 484), which remained in all subsequent editions. as did the quotations on the frontispiece from familiar discussions in British natural theology concerning creation by secondary causation. Conceptual space was thereby created for the reading of the *Origin* by some contemporaries, notably by the Harvard botanist Asa Gray (1810–88), as compatible with traditional natural theology (Gray 1860)[^gray-1860].
    step1: |-
      针对就后一点提出的批评，达尔文在 1860 年第二版的最后一段中迅速加入“由造物主”一语（1860: 484），此语保留在所有后续版本中；卷首引自英国自然神学中关于借次级原因创造之常见讨论的引文也同样保留。由此为某些同时代人——尤其是哈佛植物学家阿萨·格雷（1810–88）——把《物种起源》读作与传统自然神学相容留下了概念空间（Gray 1860）[^gray-1860]。
    step2: |-
      针对后一点的批评，达尔文在 1860 年第二版的最后一段迅速加上“由造物主”一语（1860: 484），此语保留在所有后续版本中；卷首那几段引自英国自然神学、谈论借次级原因创造的文字也同样保留。这就为某些同时代人留下了概念空间，使他们可以把《物种起源》读作与传统自然神学相容——哈佛植物学家阿萨·格雷（1810–88）就是一例（Gray 1860）[^gray-1860]。
  - id: 60
