      To each of the lines of objection to his theory, Darwin offered his contemporaries plausible replies. Additional arguments were worked out through the insertion of numerous textual insertions over the five revisions of the *Origin* between 1860 and 1872, including the addition of a new chapter to the sixth edition dealing with “miscellaneous” objections, responding primarily to the criticisms of St. George Jackson Mivart (1827–1900) developed in his *Genesis of Species* (Mivart 1871)[^mivart-1871].
    step1: |-
      对其理论的每一条反对路线，达尔文都向同时代人给出了可信的回应。在 1860 至 1872 年《物种起源》的五次修订中，他又通过大量文本插入补充了论证，包括在第六版新增一章处理“杂项”反对意见，主要回应圣乔治·杰克逊·米瓦特（1827–1900）在《物种的起源》中提出的批评（Mivart 1871）[^mivart-1871]。
    step2: |-
      对每一条反对路线，达尔文都向同时代人给出了可信的回应。1860 至 1872 年《物种起源》的五次修订中，他又靠大量文本插入补充论证，包括在第六版新增一章处理“杂项”反对意见，主要回应圣乔治·杰克逊·米瓦特（1827–1900）在《物种的起源》中提出的批评（Mivart 1871）[^mivart-1871]。
