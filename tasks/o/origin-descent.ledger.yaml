      ### 4.4 Reception of the *Descent*
    step1: |-

    step2: |-

  - id: 112
    kind: body
    source: |-
      The international reception of the *Descent of Man* and *Expression of the Emotions* is a topic in need of the kind of detailed studies that surround the historical impact of the *Origin.* These works presented the reading public after 1871 with a more radical and controversial Darwin than had been associated with the author of the popular *Journal of Researches* or even the *Origin* itself, and his anthropological works created a watershed in the public reception of Darwin’s views (Radick 2013)[^radick-2013]. The *Descent* finally made public Darwin’s more radical conclusions about human origins, and seemed to many of his readers, even those previously sympathetic to the *Origin*, to throw Darwin’s authority behind materialist and anti-religious forces. Public knowledge of Darwin’s own conclusions on human evolution before 1871 had rested on the one vague sentence on the issue in the *Origin* itself. The *Descent* made public his more radical conclusions. Even though the question of human evolution had already been dealt with in part by Thomas Huxley in his *Man’s Place in Nature* of 1863 (Huxley 1863)[^huxley-1863], and by Charles Lyell in the same year in his *Geological Evidences of the Antiquity of Man* (Lyell 1863)[^lyell-1863], followed by Alfred Russel Wallace’s articles in 1864 and 1870 (Wallace 1864 and online), these authors had either not dealt with the full range of questions presented by the inclusion of human beings in the evolutionary process, or they had emphasized the moral and mental discontinuity between humans and animals. Only Ernst Heinrich Haeckel had drawn out a more general reductive conception of humanity from evolutionary theory and he had not ventured into the specific issues of ethics, social organization, the origins of human races, and the relation of human mental properties to those of animals, all of which are dealt with in the *Descent*. Darwin’s treatise presented, as one commentator has put it, “a closer resemblance to Darwin’s early naturalistic vision than anything else he ever published” (Durant 1985, 294)[^durant-1985].
    step1: |-

    step2: |-

