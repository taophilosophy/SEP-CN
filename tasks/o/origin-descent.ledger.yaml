      Outside the United Kingdom, the receptions of Darwin’s work display the importance of local context and pre-existent intellectual and social conditions. Three examples—France, Germany, and China—can be elaborated upon. In France, Darwin’s theory was received against the background of the prior debates over transformism of the 1830s that pitted the theories of Lamarck and Etienne Geoffroy St. Hilaire against Cuvier (Gayon 2013; entry on evolutionary thought before Darwin, 4.1)[^gayon-2013]. At least within official French Academic science, these debates had been resolved generally in favor of Cuvier’s anti-transformism. The intellectual framework provided by the “positive philosophy” of Auguste Comte (1798–1857) also worked both for and against Darwin. On one hand, Comte’s emphasis on the historical progress of science over superstition and metaphysics allowed Darwin to be summoned in support of a theory of the progress of science. The *Origin* was so interpreted in the preface to the first French translation of the *Origin* made by Clémence Royer (Harvey 2008)[^harvey-2008]. On the other hand, the Comtean three stages view of history, with its claim of the historical transcendence of speculative and metaphysical periods of science by a final period of experimental science governed by determinate laws, placed Darwinism in a metaphysical phase of speculative nature philosophy. This view is captured by the assessment of the leading physiologist and methodologist of French Science, Claude Bernard (1813–78). As he stated this in his 1865 treatise on scientific methodology, Darwin’s theory was to be regarded with those of “a Goethe, an Oken, a Carus, a Geoffroy Saint Hilaire”, locating it within speculative philosophy of nature rather than granting it the status of “positive” science (Bernard 1865 [1957], 91–92])[^bernard-1865].
    step1: |-
      在英国之外，达尔文著作的接受情况显示出地方语境与既有思想、社会条件的重要性。可以详述三个例子：法国、德国与中国。在法国，达尔文理论的接受背景是 1830 年代此前关于转型论的争论：拉马克与艾蒂安·若弗鲁瓦·圣伊莱尔的理论对阵居维叶（Gayon 2013；“达尔文之前的演化思想”词条 4.1）[^gayon-2013]。至少在法国官方学术科学内部，这些争论大体以居维叶的反转型论获胜告终。奥古斯特·孔德（1798–1857）的“实证哲学”所提供的思想框架，对达尔文既有利也有弊。一方面，孔德强调科学相对于迷信与形而上学的历史进步，这使达尔文可以被召来支持一种科学进步论。《物种起源》在克莱芒丝·鲁瓦耶所译第一部法译本序言中就是这样被解读的（Harvey 2008）[^harvey-2008]。另一方面，孔德的三阶段历史观主张：科学思辨与形而上学时期终将被受确定规律支配的实验科学时期所历史地超越；这却把达尔文主义置于思辨自然哲学的形而上学阶段。法国科学界领头的生理学家与方法论家克洛德·贝尔纳（1813–78）的评断正体现了这一看法。他在 1865 年关于科学方法论的论著中写道，达尔文的理论应与“歌德、奥肯、卡鲁斯、若弗鲁瓦·圣伊莱尔”之辈的理论并列，把它归入思辨自然哲学，而不给它“实证”科学的地位（Bernard 1865 [1957], 91–92]）[^bernard-1865]。
    step2: |-
      出了英国，达尔文著作的接受情况显示出地方语境与既有思想、社会条件的分量。可以详述三个例子：法国、德国与中国。在法国，达尔文理论面对的是 1830 年代转型论争论的余波：拉马克与艾蒂安·若弗鲁瓦·圣伊莱尔的理论对阵居维叶（Gayon 2013；“达尔文之前的演化思想”词条 4.1）[^gayon-2013]。至少在法国官方学术科学内部，这些争论大体以居维叶的反转型论获胜告终。奥古斯特·孔德（1798–1857）的“实证哲学”提供的思想框架，对达尔文既有利也有弊。一方面，孔德强调科学相对于迷信与形而上学的历史进步，这使达尔文可以被召来支持科学进步论——第一部法译本（克莱芒丝·鲁瓦耶译）的序言就是这样解读的（Harvey 2008）[^harvey-2008]。另一方面，孔德的三阶段历史观主张：科学思辨与形而上学时期终将被受确定规律支配的实验科学时期历史地超越。这一来，达尔文主义反倒被归入思辨自然哲学的形而上学阶段。法国科学界领头的生理学家与方法论家克洛德·贝尔纳（1813–78）的评断正体现了这一看法。他在 1865 年关于科学方法论的论著中写道，达尔文的理论应与“歌德、奥肯、卡鲁斯、若弗鲁瓦·圣伊莱尔”之流并列，归入思辨自然哲学，而不配“实证”科学的地位（Bernard 1865 [1957], 91–92]）[^bernard-1865]。
