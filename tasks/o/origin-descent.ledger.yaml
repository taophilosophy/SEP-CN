      The difficulties in Darwin’s arguments that had emerged by 1866 were highlighted in a lengthy and telling critique in 1867 by the Scottish engineer Henry Fleeming Jenkin (1833–1885) (typically Fleeming Jenkin). Using an argument previously raised in the 1830s by Charles Lyell against Lamarck, Fleeming Jenkin cited empirical evidence from domestic breeding that suggested a distinct limitation on the degree to which normal variation could be added upon by selection (Fleeming Jenkin 1867 in Hull 1973)[^hull-1973][^jenkin-1867]. Using a loosely mathematical argument, Fleeming Jenkin argued that the effects of intercrossing would continuously swamp deviations from the mean values of characters and result in a tendency of the variation in a population to return to mean values over time. It is also argued that domestic evidence does not warrant an argument for species change. For Fleeming Jenkin, Darwin’s reliance on continuous additive deviation was presumed to be undermined by these arguments, and only more dramatic and discontinuous change—something Darwin explicitly rejected—could account for the origin of new species.
    step1: |-
      到 1866 年，达尔文论证中的困难在 1867 年苏格兰工程师亨利·弗莱明·詹金（1833–1885，通常称 Fleeming Jenkin）的一篇长篇而切中要害的批评中被凸显出来。詹金运用莱尔 1830 年代针对拉马克提出过的论证，援引家养育种的经验证据，表明正常变异可被选择累加的程度存在明显限制（Fleeming Jenkin 1867 in Hull 1973）[^hull-1973][^jenkin-1867]。用一个大致数学化的论证，詹金主张：杂交的效果会不断淹没性状对均值的偏离，导致种群中的变异随时间趋于回归均值。他还论证，家养证据不足以支持物种变化的论证。对詹金来说，达尔文对连续累加偏离的依赖被这些论证推定为站不住脚；只有更剧烈、不连续的变化——而这是达尔文明言拒绝的——才能解释新物种的起源。
    step2: |-
      到 1866 年，达尔文论证中的困难已相当明显。1867 年，苏格兰工程师亨利·弗莱明·詹金（1833–1885，通常称 Fleeming Jenkin）写了一篇长篇而切中要害的批评。詹金搬出莱尔 1830 年代针对拉马克用过的论证，援引家养育种的经验证据，表明正常变异能被选择累加的程度有明确限制（Fleeming Jenkin 1867 in Hull 1973）[^hull-1973][^jenkin-1867]。他用一个大致数学化的论证主张：杂交会不断淹没性状对均值的偏离，种群中的变异因而随时间趋于回归均值；家养证据也不足以支持物种变化的论证。在詹金看来，这些论证足以推翻达尔文对连续累加偏离的依赖；只有更剧烈、不连续的变化——达尔文明言拒绝的东西——才能解释新物种的起源。
