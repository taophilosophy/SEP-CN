      这段文字直接支撑了出版《物种起源》第一版中关于“自然选择”作用的陈述；从历史发生学的角度看，它表明达尔文“自然选择”含义的阐释何等复杂（Ospovat 1981）[^ospovat-1981]。艺术与自然之间的平行、“选择”一词所暗示的意向性、“完美”适应的观念，以及把“自然”实质地设想为朝向某些目的运作的能动者——这一切都使达尔文关于目的论目的的见解，比人们通常从当代新选择论立场出发所作的解读更为复杂（Lennox 1993, 2013）[^lennox-1993]。如下文将讨论的，达尔文此后在《物种起源》历次版本中对这一概念表述所作的更改，导致人们对他这一原理的含义产生了不同理解。
