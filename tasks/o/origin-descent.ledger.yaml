      In Chapter Ten, Darwin developed his interpretation of the fossil record. At issue was the claim by Lamarckian and other transformists, as well as Cuvierian catastrophists such as William Buckland (1784–1856) (see the entry on evolutionary thought before Darwin, Section 4.1), that the fossil record displayed a historical sequence beginning with simpler plants and animals, arriving either by transformism or replacement, at the appearance of more complex forms in geological history. Opposition to this thesis of “geological progressionism” had been made by none other than Darwin’s great mentor in geology, Charles Lyell in his *Principles of Geology* (Lyell 1832 [1990], vol. 2, chp. xi; Desmond 1984; Bowler 1976)[^bowler-1976][^desmond-1984]. Darwin defended the progressionist view against Lyell’s arguments in this chapter.
    step1: |-
      在第十章，达尔文展开他对化石记录的解释。争论点在于：拉马克派与其他转型论者，以及威廉·巴克兰（1784–1856）等居维叶式灾变论者主张（见“达尔文之前的演化思想”词条第 4.1 节），化石记录显示出一个历史序列，从较简单的动植物开始，经由转型或替换，最终在地质史中出现更复杂的形态。反对这一“地质进步论”论题的，不是别人，正是达尔文在地质学上的伟大导师查尔斯·莱尔，他在《地质学原理》中提出了反对（Lyell 1832 [1990], vol. 2, chp. xi; Desmond 1984; Bowler 1976）[^bowler-1976][^desmond-1984]。在本章中，达尔文为进步论观点辩护，反驳莱尔的论证。
    step2: |-
      第十章里，达尔文展开他对化石记录的解释。争论点在于：拉马克派与其他转型论者，以及威廉·巴克兰（1784–1856）等居维叶式灾变论者主张（见“达尔文之前的演化思想”词条第 4.1 节），化石记录显示出一个历史序列，从较简单的动植物开始，经由转型或替换，最终在地质史中出现更复杂的形态。反对这一“地质进步论”论题的，不是别人，正是达尔文在地质学上的伟大导师查尔斯·莱尔；他在《地质学原理》中提出了反对（Lyell 1832 [1990], vol. 2, chp. xi; Desmond 1984; Bowler 1976）[^bowler-1976][^desmond-1984]。本章中，达尔文为进步论辩护，反驳莱尔。
