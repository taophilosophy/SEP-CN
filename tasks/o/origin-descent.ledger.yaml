      通过这一普遍化，对人口的控制只有在极端情形下才直接奠基于马尔萨斯式的食物与空间限制。正常的控制反而通过一个复杂的关系网络来施加：物种在捕食者—猎物、寄生物—宿主与食物网关系中相互作用。对马尔萨斯论证的这一深刻修正，使达尔文的理论具有后来所谓“生态学”的深刻特征。可以举达尔文自己使用的两个思想实验为例（ibid., 72–74）。第一个涉及英国红三叶草丰度的解释。达尔文认为这取决于传粉熊蜂的数量，而熊蜂数量又受田鼠数量控制，田鼠又受猫的数量控制，于是猫成为三叶草丰度的远因。第二个例子涉及欧洲赤松的丰度：在这个例子里，松树的数量间接受到牛的数量限制。
