      Criticisms that quickly developed over the overt intentionality embedded in such passages, however, led Darwin to revise the argument in editions beginning with the third edition of 1861. From this point onward he explicitly downplayed the intentional and teleological language of the first two editions, denying that his appeals to the selective role of “nature” were anything more than a literary figure. Darwin then moved decisively in the direction of defining natural selection as the description of the action of natural laws working upon organisms rather than as an efficient or final cause of life. He also regrets in his *Correspondence* his mistake in not utilizing the designation “natural preservation” rather than “natural selection” to characterize his principle (letter to Lyell 28 September 1860, Burkhardt *Correspondence* 8, 397; also see Darwin Correspondence Project in Other Internet Resources). In response to criticisms of Alfred Russel Wallace, Darwin then adopted in the fifth edition of 1869 his contemporary (1820–1903) Herbert Spencer’s designator, “survival of the fittest”, as a synonym for “natural selection” (Spencer 1864, 444–45; Darwin 1869, 72)[^darwin-1869][^spencer-1864]. This redefinition further shifted the meaning of natural selection away from the concept that can be extracted from the early texts and drafts. These final statements of the late 1860s and early 70s underlie the tradition of later “mechanistic” and non-teleological understandings of natural selection, a reading developed by his disciples who, in the words of David Depew, “had little use for either his natural theodicy or his image of a benignly scrutinizing selection” (Depew 2009, 253)[^depew-2009]. The degree to which this change preserved the original strong analogy between art and nature can, however, be questioned. Critics of the use of this analogy had argued since the original formulations that the comparison of the two modes of selection actually worked against Darwin’s theory (Wallace 1858 in Glick and Kohn 1997, 343)[^wallace-1858]. This critique would also be leveled against Darwin in the critical review of 1867 by Henry Fleeming Jenkin discussed below.
    step1: |-
      然而，针对这类段落中明显的意向性迅速出现的批评，使达尔文从 1861 年第三版起修订论证。自此，他明确淡化前两版中有意与目的论的语言，否认自己诉诸“自然”的选择作用不过是一种文学修辞。随后，他决定性地转向把自然选择界定为对自然规律作用于生物之过程的描述，而不是生命的动力因或目的因。他在《通信集》中也对自己未使用“自然保存”而非“自然选择”来称呼其原理表示遗憾（致莱尔信，1860 年 9 月 28 日，Burkhardt《通信集》8, 397；另见其他网络资源中的“达尔文通信项目”）。为回应阿尔弗雷德·罗素·华莱士的批评，达尔文在 1869 年第五版中采用其同时代人赫伯特·斯宾塞（1820–1903）的用语“最适者生存”，作为“自然选择”的同义词（Spencer 1864, 444–45; Darwin 1869, 72）[^darwin-1869][^spencer-1864]。这一定义进一步使自然选择的含义偏离了可从早期文本与草稿中提取的概念。这些 1860 年代末与 70 年代初的最终表述，构成后来“机械论”与非目的论自然选择理解传统的底本；这一解读由其弟子发展，用戴维·迪普的话说，他们“对达尔文的自然神义论，或他那幅仁慈审视的选择图景，都不怎么用得着”（Depew 2009, 253）[^depew-2009]。不过，这一更改在多大程度上保留了艺术与自然之间原初的强类比，是可以质疑的。自最初表述以来，这一类比的使用者就曾论证，两种选择方式的比较实际上对达尔文的理论不利（Wallace 1858 in Glick and Kohn 1997, 343）[^wallace-1858]。这一批评后来也在 1867 年亨利·弗莱明·詹金的批评性评论中针对达尔文提出，详见下文。
