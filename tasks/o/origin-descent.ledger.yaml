      To turn to a very different context, that of China, Darwin’s works entered Chinese discussions by a curious route. The initial discussions of Darwinian theory were generated by the translation of Thomas Henry Huxley’s 1893 Romanes Lecture “Evolution and Ethics” by the naval science scholar Yan Fu (1854–1921), who had encountered Darwinism while being educated at the Royal Naval College in Greenwich from 1877 to 1879. This translation of Huxley’s lecture, published in 1898 under the name of *Tianyan Lun*, was accompanied with an extensive commentary by Yan Fu that drew heavily upon the writings of Herbert Spencer which Yan Fu placed in opposition to the arguments of Huxley. This work has been shown to have been the main vehicle by which the Chinese learned indirectly of Darwin’s theory (Jin 2020, 2019 a, b; Yang 2013; Pusey 1983)[^jin-2020][^pusey-1983][^yang-2013]. In the interpretation of Yan Fu and his allies, such as Kan Yuwei (1858–1927), Darwinism was given a progressivist interpretation in line with aspects of Confucianism.
    step1: |-
      转到另一个极为不同的语境——中国：达尔文的著作经由一条奇特的路径进入中国讨论。达尔文理论的最初讨论，源于海军科学学者严复（1854–1921）对托马斯·亨利·赫胥黎 1893 年罗曼尼斯讲演《进化论与伦理学》的翻译；严复 1877 至 1879 年在格林尼治皇家海军学院求学时接触到达尔文主义。赫胥黎讲演的这部译本于 1898 年以《天演论》之名出版，附有严复的长篇按语；按语大量取材于赫伯特·斯宾塞的著作，而严复把斯宾塞置于赫胥黎论证的对立面。已有研究表明，这部著作是中国间接了解达尔文理论的主要载体（Jin 2020, 2019 a, b; Yang 2013; Pusey 1983）[^jin-2020][^pusey-1983][^yang-2013]。在严复及其同道——如康有为（1858–1927）——的解释中，达尔文主义被赋予一种与儒家某些方面相合的进步论解读。
