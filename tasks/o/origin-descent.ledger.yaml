      Historical studies have revealed that only rarely did members of the scientific elites accept and develop Darwin’s theories exactly as they were presented in his texts. Statistical studies on the reception by the scientific community in England in the first decade after the publication of the *Origin* have shown a complicated picture in which there was neither wide-spread conversion of the scientific community to Darwin’s views, nor a clear generational stratification between younger converts and older resisters, counter to Darwin’s own predictions in the final chapter of the *Origin* (Hull et al. 1978)[^hull-1978]. These studies also reveal a distinct willingness within the scientific community to separate acceptance of Darwin’s more general claim of species descent with modification from common ancestors from the endorsement of his explanation of this descent through the action of natural selection on slight morphological variations.
    step1: |-
      历史研究表明，科学精英中很少有人原样接受并发展达尔文文本中呈现的理论。对《物种起源》出版后第一个十年英格兰科学界接受情况的统计研究显示出一幅复杂图景：既没有科学界向达尔文观点的大规模皈依，也没有年轻皈依者与年长抵制者之间清晰的代际分层——这与达尔文在《物种起源》最后一章自己的预测相反（Hull et al. 1978）[^hull-1978]。这些研究还揭示出，科学界明显愿意把两件事分开：接受达尔文关于物种经由共同祖先传衍而变异的一般主张，与认可他通过自然选择作用于细微形态变异来解释这一传衍。
    step2: |-
      历史研究表明，科学精英中很少有人原样接受并发展达尔文文本里的理论。对《物种起源》出版后第一个十年英格兰科学界接受情况的统计研究，显示出一幅复杂图景：科学界既没有大规模皈依达尔文观点，也没有年轻皈依者与年长抵制者之间清晰的代际分层——这与达尔文在《物种起源》末章的预测相反（Hull et al. 1978）[^hull-1978]。这些研究还表明，科学界明显愿意把两件事分开：接受达尔文“物种经由共同祖先传衍而变异”的一般主张，与认可他用自然选择作用于细微形态变异来解释这一传衍。
