      The pangenesis theory, although not specifically referred to, seems to be behind an important distinction Darwin inserted into the fifth edition of the *Origin* of 1869 in his direct reply to the criticisms of Jenkin. In this textual revision, Darwin distinguished “certain variations, which no one would rank as mere individual differences”, from ordinary variations (Darwin1869, 105; Peckham 2006, 178–179)[^peckham-2006]. This revision shifted Darwin’s emphasis away from his early reliance on normal slight individual variation, and gave new status to what he now termed “strongly marked” variations. The latter were now the forms of variation to be given primary evolutionary significance. Presumably this strong variation was more likely to be transmitted to the offspring, although details are left unclear, and in this form major variation could presumably be maintained in a population against the tendency to swamping by intercrossing as Fleeming Jenkin had argued.
