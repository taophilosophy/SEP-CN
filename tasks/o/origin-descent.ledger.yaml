      As a solution to the variation question, Darwin developed his “provisional hypothesis” of pangenesis, which he presented the year after the appearance of the Fleeming Jenkin review in his two-volume *Variation of Plants and Animals Under Domestication* (Darwin 1868; Olby 2013)[^darwin-1868][^olby-2013]. Although this theory had been formulated independently of the Jenkin review (Olby 1963)[^olby-1963], in effect it functioned as Darwin’s reply to Jenkin’s critique. The pangenesis theory offered a causal theory of variation and inheritance through a return to a theory resembling Buffon’s theory of the organic molecules proposed in the previous century (see entry on evolutionary thought before Darwin section 3.2). Invisible material “gemmules” were presumed to exist within the cells. According to theory, these were subject to external alteration by the environment and other external causes. The gemmules were then shed continually into the blood stream (the “transport” hypothesis) and assembled by “mutual affinity for each other, leading to their aggregation either into buds or into the sexual elements” (Darwin 1868, vol. 2, 375)[^darwin-1868]. In this form they were then transmitted—the details were not explained—by sexual generation to the next generation to form the new organism out of “the modified physiological units of which the organism is built” (ibid., 377). In Darwin’s view, this hypothesis united together numerous issues into a coherent and causal theory of inheritance and explained the basis of variation. It also explained how use-disuse inheritance, a theory which Darwin never abandoned, could work.
    step1: |-
      作为对变异问题的解决方案，达尔文提出了他的“暂时性假说”——泛生论；在詹金评论问世一年后，他在两卷本《家养条件下动植物变异》中提出这一假说（Darwin 1868; Olby 2013）[^darwin-1868][^olby-2013]。尽管这一理论是独立于詹金评论形成的（Olby 1963）[^olby-1963]，实际上它充当了达尔文对詹金批评的回应。泛生论通过回归一种类似布丰上世纪提出的有机分子理论，提供了一种关于变异与遗传的因果理论（见“达尔文之前的演化思想”词条第 3.2 节）。据假定，细胞内存在不可见的物质“微芽”。按该理论，微芽会受环境及其他外部原因的改造。随后，微芽不断脱落进入血流（“运输”假说），并靠“彼此间的相互亲和力聚集，或聚成芽体，或聚成性要素”（Darwin 1868, vol. 2, 375）[^darwin-1868]。以这种形态，它们经由有性生殖传给下一代——细节未作解释——由“构成生物体的、经过改造的生理单位”形成新生物（ibid., 377）。在达尔文看来，这一假说把众多问题统一为一个连贯的因果遗传理论，并解释了变异的基础。它还解释了用进废退遗传——达尔文从未放弃的理论——如何可能运作。
