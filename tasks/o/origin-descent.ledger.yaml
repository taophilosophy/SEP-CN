      As critics focused their attacks on the claim that such micro-differences between individuals could be accumulated over time without natural limits, Darwin began a series of modifications and revisions of the theory through a back and forth dialogue with his critics that can be followed in his revisions to the text of the *Origin*. In the fourth edition of 1866, for example, Darwin inserted the claim that the continuous gradualism depicted by his branching diagram was misleading, and that transformative change does not necessarily go on continuously. “It is far more probable that each form remains for long periods unaltered, and then again undergoes modification” (Darwin 1866, 132; Peckham 2006, 213)[^darwin-1866][^peckham-2006]. This change-stasis-change model allowed variation to stabilize for a period of time around a mean value from which additional change could then resume. Such a model would, however, presumably require even more time for its working than the multi-millions of years assumed in the original presentation of the theory.
    step1: |-
      当批评者把攻击集中于“个体间的这类微差异可以随时间累积而不遇自然界限”这一主张时，达尔文开始了一系列修改与修订；这场与批评者的往复对话，可以在他对《物种起源》文本的修订中追踪。例如，在 1866 年第四版中，达尔文插入一个主张：他的分支图所描绘的连续渐变论具有误导性，转型变化未必连续进行。“远为可能的是，每一形态在长时间内保持不变，然后再次经历变异”（Darwin 1866, 132; Peckham 2006, 213）[^darwin-1866][^peckham-2006]。这种“变化—停滞—变化”模型使变异能在一段时间内围绕均值稳定下来，随后再由此重新开始变化。不过，这样的模型大概需要比理论最初表述所假定的数百万年更多的时间才能运作。
    step2: |-
      批评者集中攻击一点：个体间的这类微差异真能随时间累积而不遇自然界限吗？达尔文于是开始一系列修改与修订；这场与批评者的往复对话，可在他对《物种起源》的修订中追踪。例如 1866 年第四版，达尔文插入一个主张：分支图所描绘的连续渐变论有误导性，转型变化未必连续进行。“远为可能的是，每一形态在长时间内保持不变，然后再次经历变异”（Darwin 1866, 132; Peckham 2006, 213）[^darwin-1866][^peckham-2006]。这种“变化—停滞—变化”模型，让变异能在一段时间内围绕均值稳定，随后再由此重新变化。不过，这样的模型大概需要比理论最初假定的数百万年更多的时间才能运作。
