      The hurried preparation and publication of the *Origin* between the summer of 1858 and November of 1859 was prompted by the receipt on June 18 of 1858 of a letter and manuscript from Alfred Russel Wallace (1823–1913) that outlined his remarkably similar views on the possibility of continuous species change under the action of a selection upon natural variation (Wallace 1858 in Glick and Kohn 1996, 337–45)[^glick-1996][^wallace-1858]. This event had important implications for the subsequent form of Darwin’s published argument. Rapidly condensing the detailed arguments of the unfinished “Natural Selection” manuscript into shorter chapters, Darwin also universalized several claims that he had only developed with reference to specific groups of organisms, or which he had applied only to more limited situations in the manuscript. This resulted in a presentation of his theory at the level of broad generalization. The absence of tables of data, detailed footnotes, and references to the secondary literature in the published version also resulted in predictable criticisms which will be discussed below in Section 3.2.
    step1: |-
      《物种起源》在 1858 年夏至 1859 年 11 月间的仓促准备与出版，是因为 1858 年 6 月 18 日收到阿尔弗雷德·罗素·华莱士（1823–1913）的一封信与手稿；后者概述了他关于在自然变异上施加选择、从而可能发生连续物种变化的看法，与达尔文惊人地相似（Wallace 1858 in Glick and Kohn 1996, 337–45）[^glick-1996][^wallace-1858]。这一事件对达尔文出版论证的后续形态有重要影响。达尔文把未完成的“自然选择”手稿中的详细论证迅速压缩成较短的章节，同时还把他此前只针对特定生物类群展开、或只在手稿中适用于较有限情境的若干主张普遍化。结果是以广泛概括的层次呈现其理论。出版版本中没有数据表格、详细脚注和对二手文献的引用，这也招致了可预见的批评，下文 3.2 节将讨论。
