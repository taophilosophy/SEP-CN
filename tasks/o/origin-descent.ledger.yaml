      A third account, related to the Whewellian reading, is that of David Depew. Building on Darwin’s claim that he was addressing “the general naturalist public,” Darwin is seen as developing what Depew has designated as “situated argumentation”, similar to the views developed by contemporary Oxford logician and rhetorical theorist Richard Whately (1787–1863) (Depew 2009)[^depew-2009]. This rhetorical strategy proceeds by drawing the reader into Darwin’s world by personal narration as it presents a series of limited issues for acceptance in the first three chapters, none of which required of the reader a considerable leap of theoretical assent, and most of which, such as natural variation and Malthusian population increase, had already been recognized in some form in the literature of the period.
