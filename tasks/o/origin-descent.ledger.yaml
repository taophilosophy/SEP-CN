      Darwin’s reinterpretation of the moral sense tradition within his evolutionary framework also implied important transfomations of this theory of ethics. The moral sense was not to be distinguished from animal instinct but was instead derived historically from the social instincts and developed by natural selection. From this perspective, Darwin could claim a genuine identity of ethical foundations holding between humans and animals, with the precursors of human ethical behavior found in the behavior of other animals, particularly those with social organization. Natural selection then shaped these ethical instincts in ways that favored group survival over immediate individual benefit (ibid., 98). Human ethical behavior is therefore grounded in a natural property developed by natural selection, with the consequence that ethical actions can occur without moral calculus or rational deliberation.
    step1: |-

    step2: |-

  - id: 109
    kind: body
    source: |-
      When moral conflict occurs, this is generally attributed to a conflict of instincts, with the stronger of two conflicting instincts favored by natural selection insofar as it favors group benefit (ibid. 84). In human beings the “more enduring Social Instincts” thus come to override the less persistent “individual” instincts.
    step1: |-

    step2: |-

  - id: 110
    kind: body
    source: |-
      The adequacy of evolutionary ethical naturalism as a foundation for ethical realism proved to be a point of contention for Darwin’s contemporaries and successors following the publication of the *Descent*. For some moral philosophers, Darwin had simply reduced ethics to a property subject to the relativizing tendencies of natural selection (Farber 1994: chp. 5)[^farber-1994]. It was, in the view of Darwin’s philosophical critics, to reduce ethics to biology and in doing so, to offer no way to distinguish ethical goods from survival advantages. Not even for some strong supporters of Darwinism, such as Thomas Huxley and Alfred Russel Wallace, was Darwin’s account adequate (ibid., chp. 4). Much of subsequent development of moral philosophy after Darwin would be grounded upon the canonical acceptance of the “is-ought” distinction, which emerged with new force from the critique of “evolutionary” ethical theory. This critique began with Thomas Huxley’s own break with Darwinian ethical theory in his Romanes Lecture, “Evolution and Ethics”of 1893 (Huxley 1893)[^huxley-1893]. This lecture, reflecting Huxley’s views eleven years after Darwin’s death, would play an important role in the Chinese reception of Darwinism (Huxley 1895; see above, section 3.1)[^huxley-1895]. This line of critique also received an influential academic expression in G. E. Moore’s (1873–1958) *Principia Ethica*—itself an attack on Spencer’s version of evolutionary ethics (Moore 1903)[^moore-1903]. Debates over the adequacy of evolutionary ethics continue into the present (see the entries on biological altruism and morality and evolutionary biology; see also, R. J. Richards 2015, 2009, 1999, 1987, Appendix 2; Charmetant 2013; Boniolo and DeAnna (eds.) 2006; Hauser 2006; Katz (ed.) 2000; Maienschein and Ruse (eds.) 1999).
    step1: |-

    step2: |-

