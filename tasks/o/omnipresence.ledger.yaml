      这种借上帝的力量与知识来理解其临在的方式，把应用于上帝的“临在”谓词视为与应用于普通物理事物的“临在” *类比的*。（关于类比谓述的更完整解释，见《中世纪的类比理论》。）应用于上帝时，“临在”既非单义的（与日常语境中的含义相同），也非歧义的（含义与之无关）。毋宁说，它的含义可借其日常含义来说明：上帝临在于某处，当且仅当那里有一个物理对象，而上帝对该对象拥有力量、知道该对象中发生之事，并且上帝是该对象存在的成因。Nicholas Everitt（2010, p. 86）反对这种类比进路，称“若全在如此解释，人们大可以认为，倒不如直截了当地说上帝根本不全在”；他引 Joshua Hoffman 与 Gary Rosenkrantz（2002, p. 41）为同调。但 Hoffman 与 Rosenkrantz 在被引的那段文字中只是说“不存在 [上帝] 能够全在的 *字面* 意义”，这仍容许存在一种上帝全在的类比意义。Hud Hudson（2009）也否认上帝的临在是类比的，但那是因为他认为上帝以一种字面的方式处处临在。我们将在第 5 节考察 Hudson 的方案。
