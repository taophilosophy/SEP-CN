      In a recent paper, Sam Cowling and Wesley D. Cray note that “[t]he philosophical literature on omnipresence is vast, though largely situated in the context of Western, monotheistic philosophy of religion” (2017, p. 223). Their own proposal for expanding the field is to develop an account of omnipresence according to which even numbers and pure sets are omnipresent. That will likely strike many as implausible, but their claim about the limited scope of traditional work on the topic is accurate. In fact they could have mentioned, more precisely, that the philosophers considered in this entry tend to restrict their attention primarily to Augustine, Anselm, and Aquinas, with perhaps an aside to Peter Lombard. That suggests that one avenue for future research is to consider the work of ancient philosophers as well as early modern and later philosophers. The mention of monotheistic philosophy of religion calls attention to another often overlooked area, namely, the work of Jewish and Islamic philosophers of religion. Finally, recent interest in global philosophy suggests yet other areas into which work on omnipresence could extend. Remarkably, all of these concerns are addressed in an important new *Oxford Handbook* (Marmodoro, Migliorini, and Page 2025). Entries describe views of Heraclitus, Plato, Aristotle, Philo, and Plotinus, among other predecessors of Augustine. Another section discusses the treatment of omnipresence by Descartes, Spinoza, and Leibniz, as well as Locke, Berkeley, Kant, and more, filling in the large gap between Aquinas and the twentieth century. Two sections of entries are devoted to Jewish and Islamic views on omnipresence as well as those of several eastern religions. And two groups of new essays discuss recent developments and propose new understandings of omnipresence.
