      某些晚近研究借用形而上学的冷僻概念。Luco Johan van den Brom（1984；另见 1993）提出，“上帝有 *他自己* 的空间维度，这一维度并不与受造宇宙共有”。Brom 的想法是：正如一个二维表面“超越”该表面上的某条线，却临在于该线的每一点，三维空间与其内部的二维平面亦然；“上帝因存在于一个更高维度的系统之中，也临在于受造宇宙三维空间中一切物体所在之处，而不被该三维空间所容纳”（1984, p. 654）。Brom 甚至猜想，上帝至少多拥有两个维度，从而我们的空间不可能把上帝一分为二。
