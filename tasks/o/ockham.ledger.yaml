      Ockham’s main point here is that an intuitive cognition *naturally* causes in the mind a number of true *contingent* judgments about the external thing(s) that caused this intuitive cognition. For example, that this thing exists, that it is white, that is at such-and-such a distance from another thing, and so on. This does not prevent God from deceiving any particular creature if He wants to, even when an intuitive cognition is present, but in such a case God would have to neutralize the natural causal effect of this intuitive cognition (this is something He can always do, according to Ockham) and directly cause instead a false judgment. Intuitive cognitions, on the other hand, can sometimes induce false beliefs, too, if the circumstances are abnormal (in cases of perceptual illusions in particular), but even then, they would still cause some true contingent judgments. The latter at any rate is their distinctive feature. Abstractive cognitions, by contrast, are not such as to naturally cause true judgments about contingent matters.[^note-38]
    step1: |-
      奥卡姆在这里的要点是：直观认识*自然地*在心灵中引起若干关于引起该直观认识的外部东西的*偶然的*真实判断。例如：这个东西存在，它是白的，它与另一个东西相距如此这般，等等。这并不妨碍上帝想欺骗任何特定受造物就欺骗，即使直观认识在场；但在这种情况下，上帝必须中和这一直观认识的自然的因果效果（据奥卡姆，这是他总能做到的），转而直接引起一个假判断。另一方面，直观认识有时也能引起假信念，如果情形反常（尤其在知觉错觉的情形中）；但即便如此，它们仍会引起若干真实的偶然判断。后者无论如何是它们的独特特征。相比之下，抽象认识则不会自然地引起关于偶然事项的真实判断。[^note-38]
    step2: |-
      奥卡姆此处的主旨是：直观认识会*自然地*在心灵中引发若干*偶然的*真实判断，所关涉者正是引起它的外部事物——此物存在、是白的、与彼物相距如此这般，等等。这不妨碍上帝想哄骗哪个受造物就哄骗哪个——即便直观认识在场；只是那样一来，上帝得先中和该直观认识的天然因果效果（据奥卡姆，这他总能做到），再直接引发一个假判断。反过来，直观认识有时也会引出假信念——若情形反常（尤其知觉错觉之时）；但即便如此，它们仍会引发若干真实的偶然判断。后者无论如何是它们独有的标记。抽象认识则不然：它不会自然地引发关于偶然事项的真实判断。[^note-38]
