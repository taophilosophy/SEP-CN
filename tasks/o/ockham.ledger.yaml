      Ockham’s first political work, the *Work of Ninety Days*, is a scathing line-by-line dissection of John’s *Quia vir reprobus*, in which Ockham argues on behalf of the “attackers” (the Franciscans around Michael of Cesena) against “the attacked” (John). The work is an exhaustive analysis of property and property rights, covering in minute detail different kinds of use and ownership that individuals and collectives can have. Throughout, Ockham consistently maintains the Franciscan distinction between use and ownership, even for consumables, and makes a number of significant elaborations concerning rights and property along the way.[^note-49] The first of these that bears drawing attention to is a distinction between natural rights, which are independent from any particular legal system, and rights “of the forum”, which are set up by human positive law.[^note-50] The Franciscan Order only has a natural right of using those goods that are necessary to sustain basic life. Such rights cannot be renounced, since to do so would lead to one’s own harm or death. The Franciscan Order can, however, renounce rights pertaining to ownership, which is what it does by voluntarily opting out, as it were, from the positive legal framework of property rights. A consequence of this is that the Order does not have the right to go to court to settle any property claim. The broader significance of this distinction is the suggestion that there are a certain number of natural, non-renounceable, and inalienable rights that all human beings have.
    step1: |-
      奥卡姆的第一部政治著作《九十日之作》，是对约翰的《Quia vir reprobus》的逐行严苛剖析，其中奥卡姆替“进攻者”（切塞纳的迈克尔周围的方济各会士）对抗“被进攻者”（约翰）辩护。这部著作对财产与财产权作了穷尽的分析，细致入微地讨论了个人与集体可以拥有的各种使用与所有权。通篇，奥卡姆一贯坚持方济各会关于使用与所有权的区分，即使在消耗品上亦然，并沿途就权利与财产作出若干重要阐发。[^note-49] 其中第一个值得注意的是：自然权利——独立于任何特定法律体系——与“法庭权利”——由人的实在法设立——之间的区分。[^note-50] 方济各会只有使用那些维持基本生活所必需财物的自然权利。这种权利不能放弃，因为放弃会导致自己的伤害或死亡。然而，方济各会可以放弃与所有权相关的权利，它正是通过自愿退出财产权的实在法框架来做到这一点的。其后果之一是：修会没有到法庭解决任何财产主张的权利。这一区分更广的意义在于提示：有若干自然的、不可放弃的、不可让渡的权利，所有人都有。
