      ### 1.1 英格兰（约 1287–1324）
  - id: 6
    kind: body
    source: |-
      Ockham was born probably in late 1287 or early 1288, in the village of Ockham (= Oak Hamlet) in Surrey. He likely learned basic Latin at a village school in Ockham or nearby, but this is not certain.[^note-2] At an early age, somewhere between seven and thirteen, Ockham was “given” to the Franciscan Order (the so-called “Greyfriars”).[^note-3] There was no Franciscan house (called a “convent”) in the tiny village of Ockham itself; the nearest was in London. It was there that Ockham was sent.
    step1: |-
      奥卡姆大约生于 1287 年末或 1288 年初，出生地是萨里郡的奥卡姆村（意为"橡树村"）。他大概在奥卡姆村或附近的乡村学校学了基础拉丁语，但这并不确定。[^note-2] 七岁到十三岁之间的某个时候，奥卡姆被"献给"了方济各会（即所谓的"灰衣修士"）。[^note-3] 奥卡姆村本身很小，村里没有方济各会会院（称为"convent"）；最近的一座在伦敦。奥卡姆就是被送到了那里。
    step2: |-
      奥卡姆约生于 1287 年末或 1288 年初，出生地是萨里郡的奥卡姆村（意为"橡树村"）。他大概在村里或邻近的乡村学校学了初步拉丁文，但这点并不确定。[^note-2] 七到十三岁之间的某一年，奥卡姆被"献入"方济各会（俗称"灰衣修士"）。[^note-3] 奥卡姆村太小，本村并没有方济各会会院；最近的一座在伦敦，奥卡姆就是被送去了那里。
  - id: 7
    kind: body
    source: |-
      As an educational institution, even for higher education, London Greyfriars was a distinguished place. At London Greyfriars, Ockham probably got most of his early education, and then went on to what we might think of as a secondary school education in basic logic and science (i.e., natural philosophy), beginning around the age of fourteen.
    step1: |-
      作为一所教育机构，即便就高等教育而言，伦敦灰衣修士会院也是个出色的地方。奥卡姆早年的教育多半是在伦敦灰衣修士会院完成的，随后从十四岁左右开始，接受了我们或许可以称为中学水平的基础逻辑与科学（即自然哲学）教育。
    step2: |-
      就教育机构而论——包括高等教育在内——伦敦灰衣修士会院素有声望。奥卡姆的早期教育多半就是在这里完成的；约十四岁起，他又接受了相当于中学程度的基础逻辑与科学（即自然哲学）教育。
  - id: 8
    kind: body
    source: |-
      Around 1310, when he was about twenty-three, Ockham began his theological training. It is not certain where this occurred. It could well have been at London Greyfriars, or it could have been at Oxford, where there was another Franciscan convent associated with the University. In any event, Ockham was in Oxford studying theology by at least the year 1318–19, and probably the previous year as well, when, in 1317, he began a required two-year cycle of lectures commenting on Peter Lombard’s *Sentences,* the standard theological textbook of the day. Then, probably in 1321, Ockham returned to London Greyfriars. Although he had taken initial steps in the theology faculty at Oxford (hence his nickname, the *Venerabilis Inceptor*, “Venerable Beginner”), Ockham did not complete his studies there, and never became a fully qualified master of theology at Oxford. Nevertheless, London Greyfriars was an intellectually lively place, and Ockham was by no means isolated from academic debate. He lived there with two other important Franciscan thinkers, Walter Chatton and Adam Wodeham, both sharp critics of Ockham’s views. It was in this context that Ockham wrote many of his most important philosophical and theological works.
    step1: |-
      约 1310 年，时年二十三岁上下，奥卡姆开始接受神学训练。训练在哪里进行并不确定：很可能在伦敦灰衣修士会院，也可能在牛津——那里有另一座与大学关联的方济各会会院。无论如何，最迟到 1318–19 年（很可能前一年也已如此），奥卡姆已在牛津研习神学；1317 年，他开始了必修的两年讲座周期，评注彼得·伦巴德的《箴言四书》——当时标准的神学教科书。其后，大约在 1321 年，奥卡姆回到伦敦灰衣修士会院。他虽然在牛津神学学院迈出了最初几步（他的别号"可敬的开创者"[*Venerabilis Inceptor*] 即由此而来），却未在那里完成学业，也从未成为牛津正式合格的神学硕士。不过，伦敦灰衣修士会院学术气氛活跃，奥卡姆绝非与学术论辩隔绝。与他同住的还有两位重要的方济各会思想家：沃尔特·查顿与亚当·德·沃德汉姆，两人都是奥卡姆观点的尖锐批评者。奥卡姆许多最重要的哲学与神学著作正是在这种环境中写成的。
    step2: |-
      约 1310 年，二十三岁上下的奥卡姆开始接受神学训练。训练地点已不可考：可能在伦敦灰衣修士会院，也可能在牛津——大学城另有一座方济各会会院。可以确定的是，最迟到 1318–19 年（多半还包括前一年），奥卡姆已在牛津攻读神学，并于 1317 年开讲必修的两年评注课程，注文是彼得·伦巴德的《箴言四书》——当时的标准神学教科书。其后大约在 1321 年，他回到伦敦灰衣修士会院。在牛津，他虽已在神学学院迈出最初几步——别号"可敬的开创者"（*Venerabilis Inceptor*）即由此而来——却未完成学业，始终没有成为牛津正式合格的神学硕士。但伦敦灰衣修士会院思想气氛活跃，奥卡姆并未因此远离学术论辩：同住的还有两位重要的方济各会思想家，沃尔特·查顿与亚当·德·沃德汉姆，二人都是他观点的尖锐批评者。奥卡姆许多最重要的哲学与神学著作，正是在这一环境中写就。
  - id: 9
