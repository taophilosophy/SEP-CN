      ### 3.1 《逻辑大全》
  - id: 26
    kind: body
    source: |-
      Ockham’s *Summa of Logic* is divided into three books, with the third book subdivided into four parts. Book I divides language in accordance with Aristotle’s *On Interpretation* (1, 16ᵃ3–8, as influenced by Boethius’s interpretation), into written, spoken and mental language, with written language dependent on spoken language that is in turn dependent on mental language. Mental language, the language of thought, is thus the most primitive and basic level of language. Book I goes on to lay out a fairly detailed theory of terms, including the distinctions between (a) categorematic and syncategorematic terms, (b) abstract and concrete terms, and (c) absolute and connotative terms. Book I concludes with a discussion of the five “predicables” or universals from Porphyry’s *Isagoge* and of Aristotle’s ten categories.
    step1: |-
      奥卡姆的《逻辑大全》分为三卷，第三卷又分四部分。第一卷依照亚里士多德的《解释篇》（第 1 章 16ᵃ3–8，受波爱修斯解释的影响）把语言分为书面语、口语与心理语言：书面语依赖口语，口语又依赖心理语言。心理语言即思想的语言，因而是语言最原始、最基本的层面。第一卷接着相当细致地铺陈词项理论，包括 (a) 范畴词与非范畴词、(b) 抽象词项与具体词项、(c) 绝对词项与含蓄词项的区分。第一卷最后讨论波菲利《导论》中的五种"谓词"即共相，以及亚里士多德的十个范畴。
    step2: |-
      奥卡姆的《逻辑大全》分三卷，第三卷再分四部分。第一卷依循亚里士多德《解释篇》（1, 16ᵃ3–8，并受波爱修斯解释的影响）将语言分为书面语、口语与心理语言：书面语依托口语，口语又依托心理语言。心理语言是思想的语言，因而居于语言最原始、最基本的层面。第一卷继而对词项理论作了相当细密的铺陈，包括三组区分：(a) 范畴词与非范畴词，(b) 抽象词项与具体词项，(c) 绝对词项与含蓄词项。第一卷收束于对波菲利《导论》五种"谓词"（即共相）与亚里士多德十大范畴的讨论。
  - id: 27
    kind: body
    source: |-
      While Book I is about terms, Book II is about propositions (*propositiones*), which are made up of terms. Book II gives a systematic and nuanced theory of truth conditions for the four traditional kinds of assertoric categorical propositions on the “Square of Opposition”, and then goes on to tensed, modal, and more complicated categorical propositions, as well as a variety of “hypothetical” (molecular) propositions. The vehicle for this account of truth conditions is the semantic theory of supposition, which will be explained below. Book III is about arguments, which are made up of propositions made up of terms. It is divided into four parts. Book III-1 treats syllogisms, and includes a comprehensive theory of modal syllogistic.[^note-9] Book III-2 concerns demonstrative syllogisms in particular. Book III-3 is in effect Ockham’s theory of consequence, although it also includes discussions of semantic paradoxes like the Liar (the so-called *insolubilia*) and of the still little-understood disputation form known as “obligation”. Book III-4 is a discussion of fallacies.
    step1: |-
      第一卷论词项，第二卷论命题（*propositiones*）——命题由词项构成。第二卷就"对当方阵"上的四种传统直言命题给出了一套系统而精细的真值条件理论，随后转向有时态的、模态的与更复杂的直言命题，以及形形色色的"假言"（分子式）命题。这一真值条件说明的载体是指代的语义理论，下文将作解释。第三卷论论证——论证由命题构成，命题又由词项构成。第三卷分四部分：第三卷第 1 部分论三段论，包括一套全面的模态三段论理论。[^note-9] 第 2 部分专论证明性三段论。第 3 部分实际上是奥卡姆的推论理论，但也讨论语义悖论如说谎者悖论（即所谓 *insolubilia*）以及至今仍少有人理解的"义务"论辩形态。第 4 部分讨论谬误。
    step2: |-
      第一卷论词项；第二卷论命题（*propositiones*），而命题由词项复合而成。第二卷先就"对当方阵"四种传统直言命题给出系统而细腻的真值条件理论，继而处理带时态的、模态的与更复杂的直言命题，以及种种"假言"（分子）命题。承载这套真值条件说明的，是指代的语义理论，下文另有交代。第三卷论论证：论证由命题复合而成，命题又由词项复合而成。本卷分四部分——第三卷之一论三段论，含一套完备的模态三段论理论。[^note-9] 之二专论证明性三段论。之三是奥卡姆的推论理论，兼及说谎者一类的语义悖论（所谓 *insolubilia*）与至今鲜为人解的"义务"论辩形态。之四讨论谬误。
