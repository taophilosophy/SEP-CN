      Ockham is most famous for his metaphysical nominalism and ontological reductionism about categories. Not only does he think that everything that exists is individual or particular, he wants to reduce his ontology to a bare minimum of number of kinds by paring down the fundamental ontological categories to just substance and quality. For Ockham, everything that exists in the created universe is a singular substance or a singular quality. In principle, metaphysical nominalism and categorial ontological reductionism are independent from one another. One can deny that universal entities exist, but allow singular entities in more ontological categories than Ockham does. Conversely, one can reduce the number of ontological categories, and yet hold that there are universal entities in those remaining categories. Panaccio (2023) has recently characterized Ockham’s nominalism as the view that for any general, quantitative, and relational term there is *no corresponding, special sort of entity*.[^note-23] On this characterization, Ockham’s metaphysical nominalism includes his ontological reductionism about categories, at least for the categories of quantity and relation, by emphatically denying the existence of universal entities, quantitative entities, and relational entities (outside a small number of theological exceptions).
    step1: |-
      奥卡姆以其形而上学唯名论与关于范畴的本体论还原论最为著名。他不仅认为存在的一切都是个体或殊相，还要通过把基本本体论范畴削减为仅剩实体与性质，将其本体论缩减到种类的最低限度。在奥卡姆看来，受造宇宙中存在的一切都是单个实体或单个性质。原则上，形而上学唯名论与范畴性本体论还原论彼此独立。人们可以否认共相实体存在，但允许在比奥卡姆更多的本体论范畴中有殊相实体；反过来，人们也可以削减本体论范畴的数目，却仍主张那些剩余范畴中有共相实体。Panaccio（2023）近来把奥卡姆的唯名论刻画为这样一种观点：对任何普遍的、量的与关系的词项，都*没有相应的特殊种类的实体*。[^note-23] 按照这一刻画，奥卡姆的形而上学唯名论包含他关于范畴的本体论还原论——至少就量与关系这两个范畴而言——因为它斩钉截铁地否认共相实体、量的实体与关系实体的存在（少数神学例外除外）。
    step2: |-
      奥卡姆最负盛名者，是他的形而上学唯名论与关于范畴的本体论还原论。他不仅主张凡存在者皆为个体（殊相），还要把基本本体论范畴削减到只剩实体与性质，从而使本体论的种类数降到最低。依奥卡姆之见，受造宇宙中存在的一切，非单个实体即单个性质。原则上，形而上学唯名论与范畴层面的本体论还原论互不相干：可以否认共相实体存在，却允许殊相实体出现在比奥卡姆更多的本体论范畴里；反过来，也可以削减本体论范畴的数目，而仍主张剩余范畴中还有共相实体。Panaccio（2023）近来将奥卡姆的唯名论刻画为：对任何普遍的、量的、关系的词项，*都没有与之相应的特殊实体*。[^note-23] 按这一刻画，奥卡姆的形而上学唯名论把他关于范畴的本体论还原论（至少就量与关系两范畴而言）囊括在内，因为它斩钉截铁地否认共相实体、量的实体与关系实体的存在（少数神学例外不在此列）。
