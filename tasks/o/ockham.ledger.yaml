      What was at stake? Let us return briefly to the theory of connotation.[^note-18] Connotation was described above in terms of primary and secondary signification. But in *Summa of Logic* I, 10, Ockham draws the distinction between absolute and connotative terms by means of the theory of definition. For Ockham, there are two kinds of definitions: *real* definitions and *nominal* definitions. A real definition is supposed to reveal the essential metaphysical structure of what the defined term signifies, while nominal definitions do not. As Ockham sets it up, all *connotative* terms have nominal definitions, never real definitions, and *absolute* terms have real definitions, never nominal definitions (some absolute terms have no definitions at all[^note-19]).
    step1: |-
