      [^note-13]: Note that the subject of “Every dog is a mammal” and of “Dog has three letters” is (apart from the quantifier in the former) exactly the same term. Medieval logic did not have quotation mark conventions, which were not regularly used until after the invention of printing, and the theory of material supposition provided a substitute for them. But material supposition had other uses that cannot be easily handled by quotation marks. For example, in “It is possible for him to run”, according to Ockham and many other medieval logicians, the expression ‘for him to run’ has material supposition not for itself but for the proposition “He runs” or “He is running”.
    step1: |-
      [^note-13]: 注意，“每个狗是哺乳动物”与“狗有三个字母”的主词（除前者的量词外）是完全相同的词项。中世纪逻辑没有引号约定——引号要到印刷术发明之后才被规范使用——质料指代理论为它们提供了替代品。但质料指代还有引号难以处理的别的用途。例如，在“他能跑是可能的”中，按奥卡姆与许多其他中世纪逻辑学家的看法，表达式“他能跑”不是就其自身、而是就命题“他在跑”或“他正在跑”作质料指代。
    step2: |-
      [^note-13]: 注意：“每个狗是哺乳动物”与“狗有三个字母”的主词（除前者的量词外）是同一个词项。中世纪逻辑没有引号约定——引号直到印刷术发明之后才被规范使用——质料指代理论便是其替代物。但质料指代还有引号难以代劳的其他用途。例如“他能跑是可能的”一句中，依奥卡姆及许多中世纪逻辑学家之见，表达式“他能跑”并非就其自身、而是就命题“他在跑”或“他正在跑”作质料指代。
