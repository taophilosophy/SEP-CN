      Ockham’s theory of knowledge, like his natural philosophy, is broadly Aristotelian, although—again, like his natural philosophy—it is Aristotelian in its own way. For most Aristotelians of the day, knowledge involved the transmission of a “*species*”[^note-35] between the object and the mind. At the sensory level, the sensory species may be compared to the more recent notion of a sense impression. More generally, we can think of it as the structure or configuration of the object that can be “encoded” in different ways and found isomorphically in a variety of contexts. One recent author, describing the theory as it occurs in Aquinas, puts it like this:
    step1: |-
      奥卡姆的知识论如同他的自然哲学，大体是亚里士多德式的，尽管——同样如同他的自然哲学——它是以自己的方式亚里士多德式的。对当时大多数亚里士多德主义者而言，知识涉及一种“种相”[^note-35]在对象与心灵之间的传递。在感觉层面，感觉种相可以比之于较晚近的感官印象概念。更一般地说，我们可以把它看作对象的结构或构型，它可以以不同方式被“编码”，并在各种语境中以同构方式被发现。一位晚近的作者这样描述这一理论在阿奎那那里的形态：
    step2: |-
      奥卡姆的知识论一如其自然哲学，大体属亚里士多德一路——但也一如其自然哲学，是自成一格的亚里士多德主义。在当日多数亚里士多德派看来，知识涉及“种相”[^note-35]在对象与心灵之间的传递。感觉层面上的感觉种相，可以比之于晚近所谓的感官印象。更一般地说，不妨把它看作对象的结构或构形：它可以“编码”为不同的形态，而在种种语境中被同构地发现。一位晚近作者如此描述阿奎那笔下的这套理论：
