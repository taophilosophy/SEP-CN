      When it comes to paring down the number of basic ontological categories, Ockham is more cautious and frequently appeals to the Razor. To understand his perspective on the ten Aristotelian categories, it is important to see that the view he claims to be targeting posits ten fundamental ontological categories: substance, quantity, quality, relation, action, passion, place, time, position, and habit. Ockham, by contrast, thinks that there are only two, namely substance and quality. So, while he agrees with the tradition that there are ten semantic categories, viz., ten basic kinds of linguistic terms (conceptual/spoken/written), there are only two ontological categories of beings.[^note-27]
    step1: |-
      谈到削减基本本体论范畴的数目，奥卡姆更为谨慎，并经常诉诸剃刀。要理解他对亚里士多德十个范畴的看法，重要的是看到：他声称所针对的观点设定了十个基本本体论范畴——实体、数量、性质、关系、动作、承受、场所、时间、姿态、状况。与之相对，奥卡姆认为只有两个，即实体与性质。所以，虽然他在这一点上与传统一致——有十个语义范畴，即十种基本的语言词项（概念的/口说的/书面的）——但存在的本体论范畴只有两个。[^note-27]
    step2: |-
      削减基本本体论范畴的数目时，奥卡姆要谨慎得多，且屡屡诉诸剃刀。要理解他对待亚里士多德十范畴的立场，须先看清一点：他声称所针对的观点设定了十大基本本体论范畴——实体、数量、性质、关系、动作、承受、场所、时间、姿态、状况。奥卡姆则认为只有两个：实体与性质。因此，语义范畴上他从传统——十个语义范畴，即十种基本语言词项（概念、口说、书面三类）；但存在者层面，本体论范畴只有两个。[^note-27]
