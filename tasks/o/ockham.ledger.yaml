      ## 7. Ethics
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Ockham’s ethics combines a number of themes.[^note-39] Scholars continue to debate how to best characterize his ethics. It is a will-based ethics in which intentions, that is, free and voluntary acts of willing, count for everything. External behavior or actions are morally neutral in themselves. They derive their moral worth from the intentions that underlie them. So, two people can perform the same act—say walking to church, to use a common medieval example—but the person who walks to church because she wants to worship God is morally praiseworthy while the person who walks to church because he wants to gossip with his neighbors is not.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      There is also a strong dose of divine command theory in Ockham’s ethics. Certain things, namely certain intentions, become morally obligatory, permitted, or forbidden simply because God decrees so. Thus, in Exodus, the Israelites’ “spoiling the Egyptians” (or rather their intention to do so, which they carried out) was not a matter of theft or plunder, but was morally permissible and indeed obligatory—because God had commanded it.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      And yet, despite the divine command theme in Ockham’s ethics, it is also clear that he wanted morality to be a matter of reason as well. He concedes that we can have a “science of morals” by virtue of which, through experience and the exercise of natural reason, we can come to some knowledge of moral principles outside positive human and divine law (*Quodl*. II, q. 14, *OTh* IX, pp. 176–8). There is even a sense in which one can find a kind of natural law theory in Ockham’s ethics. One way in which God conveys his divine commands to us is by giving us the natures we have.[^note-40] Unlike Augustine, Ockham accepted the possibility of the “virtuous pagan”. Moral virtue, for Ockham, does not depend on having access to revelation.
    step1: TBD
    step2: TBD
