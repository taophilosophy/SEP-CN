      Nominal definitions, Ockham says, are different. There is one and only one nominal definition for any given connotative term (in mental language, at any rate). A nominal definition is supposed to unfold precisely the signification of the connotative term it serves to define. This can only be done, Ockham thinks, by explicitly mentioning, in the right order and with the right connections, which kinds of things are primarily and secondarily signified by the relevant terms of the definition. The nominal definition of the connotative term ‘brave’, for example, is “a living being endowed with bravery”, which reveals that ‘brave’ primarily signifies certain living beings and secondarily signifies—or connotes—singular qualities of bravery.[^note-20] Any non-equivalent nominal definition is bound to indicate a different signification and would, consequently, be unsuitable if the original one was correct.
    step1: |-
      奥卡姆说，名义定义则不同。任何一个给定的含蓄词项（至少在心理语言中）有且仅有一个名义定义。名义定义的任务是精确展开它所定义的含蓄词项的意谓。奥卡姆认为，要做到这一点，唯一的办法是以正确的顺序、正确的方式明确指出：定义中相关词项首要地与次生地意谓的是哪些种类的东西。例如，含蓄词项“勇敢的”的名义定义是“被赋予勇敢的活物”，这揭示了“勇敢的”首要意谓某些活物，次生意谓——或含蓄——单个的勇敢性质。[^note-20] 任何不等价的名义定义都必然标示不同的意谓，因此，如果原来的定义是正确的，它们就不合适。
