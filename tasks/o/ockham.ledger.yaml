      Ockham’s metaphysical views are thought to stem from an underlying concern for ontological parsimony as summed up in the famous slogan known as “Ockham’s Razor” according to which one “must not multiply entities beyond necessity”.[^note-24] Although the sentiment is certainly Ockham’s, this particular formulation is nowhere to be found in his texts. Moreover, as usually stated, it is a sentiment that most philosophers, medieval or otherwise, would accept. Few philosophers endorse an *unnecessarily* large ontology. Ockham’s Razor is merely a cautionary methodological principle advising us not to endorse a metaphysical claim that requires us to posit the existence of more entities over a competing claim that does not, except under certain conditions. In the fullest formulation of the Razor that Ockham gives, those conditions are spelled out in detail. They are: reason (or reasoning from self-evident premises), experience, and infallible religious authority (namely, Sacred Scripture).[^note-25] Unless we can meet one of these conditions for some putative sort of entity, we ought not endorse a claim that supposes that sort of entity to exist. If, however, we can meet one of those conditions, then we have good reason to think that the less parsimonious claim is true over the more parsimonious claim.
    step1: |-
      人们认为，奥卡姆的形而上学观点源于一种对本体论节俭的根本关切，这一关切概括在名为“奥卡姆剃刀”的著名格言中：如其所言，“如无必要，勿增实体”。[^note-24] 虽然这种情感无疑属于奥卡姆，这一特定表述在他的文本中却无处可寻。而且，按通常的表述，它是大多数哲学家——无论中世纪还是别的时代——都会接受的一种情感。很少有哲学家赞成一个*不必要的*庞大的本体论。奥卡姆剃刀只是一个警示性的方法论原则，劝告我们：除了在某些条件下，不要在一个要求我们设定更多实体存在的形而上学主张与一个不作此要求的竞争主张之间，选择前者。在奥卡姆给出的剃刀最完整的表述中，这些条件得到了详细说明：理性（或从自明前提出发的推理）、经验，以及无谬误的宗教权威（即《圣经》）。[^note-25] 除非对某类假定的实体我们能满足这些条件之一，否则我们不应当支持一个设定该类实体存在的主张。然而，如果我们能满足其中一个条件，那么我们就有很好的理由认为较不节俭的主张比较节俭的主张为真。
    step2: |-
      人们以为，奥卡姆的形而上学立场植根于对本体论节俭的深层关切，其总纲即那著名口号“奥卡姆剃刀”：“如无必要，勿增实体。”[^note-24] 这份心思固然是奥卡姆的，这一具体表述却不见于他自己的文本。况且，照通常的说法，大多数哲学家——中世纪的也好，后世的也罢——都会接受这个态度：很少有人赞成*不必要地*庞大的本体论。奥卡姆剃刀不过是一条警示性的方法论原则：除非满足某些条件，否则当两个形而上学主张相竞、一个要求我们设定更多实体而另一个不作此要求时，不要支持前者。在奥卡姆给出的最完整的剃刀表述里，这些条件得到详细列举：理性（或从自明前提出发的推理）、经验，以及无谬误的宗教权威（即《圣经》）。[^note-25] 除非对某类设想的实体能满足其中一条，否则我们就不该支持设定该类实体存在的主张；反之，若能满足其中一条，我们就有充分理由认为较不节俭的主张比较节俭的主张为真。
