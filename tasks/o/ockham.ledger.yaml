      Whereas the signification of terms in spoken and written language is purely conventional and can be changed by mutual agreement (hence English speakers say ‘dog’ whereas French speakers say ‘*chien*’), the signification of mental terms is established by nature according to Ockham, and cannot be changed at will. Concepts, in other words, are *natural signs*: my concept of dog naturally signifies dogs. How natural signification is to be accounted for in the final analysis is not entirely clear, but it seems to be based both on the fact that simple concepts are normally caused within the mind by their objects (my simple concept of dog originated in me as an effect of my perceptual encounter with dogs), and on the fact that concepts are in some way “naturally similar” to their objects.[^note-15]
    step1: |-
      口语与书面语言中词项的意谓纯属约定，可以通过共同同意加以改变（因此英语使用者说 ‘dog’，法语使用者说 ‘*chien*’）；而按照奥卡姆的看法，心理词项的意谓则由自然确立，不能随意改变。换言之，概念是*自然符号*：我的狗概念自然地意谓狗。自然意谓归根到底如何得到说明，并不完全清楚，但它似乎既基于简单概念通常由其对象在心灵中引起这一事实（我的简单狗概念在我之内的起源，是我与狗的知觉相遇的结果），也基于概念与其对象以某种方式“自然相似”这一事实。[^note-15]
    step2: |-
      口语与书面语言中词项的意谓纯出约定，可经共同约定而更改——英语使用者说 “dog”，法语使用者说 “*chien*”，即是明证。而依奥卡姆之见，心理词项的意谓由自然确立，无从随意改动。换句话说，概念是*自然符号*：我的狗概念自然地意谓狗。自然意谓归根结底如何说明，尚未完全清楚；它似乎一方面系于：简单概念通常由其对象在心灵中引起（我心中简单的狗概念，源起于我与狗的知觉照面）；另一方面系于：概念与其对象有某种“自然相似”。[^note-15]
