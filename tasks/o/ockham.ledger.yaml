      With respect to the exact ontological status of such conceptual entities, however, Ockham changed his view over the course of his career. To begin with, he adopted what is known as the *fictum*-theory, a theory according to which universals have no “real” existence at all, not being in any of the Aristotelian categories that purport to carve up extra-mental reality. Instead, they are purely “intentional objects” with a special mode of intra-mental existence that is only a kind of “thought”-reality. Eventually, however, Ockham came to think this intentional realm of “fictive” entities was not needed, and by the time of his *Summa of Logic* and the *Quodlibets* he adopts the so-called *intellectio*-theory, according to which a universal concept is just the act of thinking about several objects at once. Metaphysically such an act is a singular quality of an individual mind, and is universal only in the sense of being a mental sign of several things at once and which is, then, predicable of those things in mental propositions.[^note-26]
    step1: |-
      不过，就这类概念实体的确切本体论地位而言，奥卡姆在职业生涯中改变了看法。起初，他采纳了所谓 *fictum* 理论，按照这一理论，共相根本没有任何"实在"存在，不在任何旨在划分心外实在的亚里士多德范畴之中；它们是纯粹的"意向对象"，具有一种特殊的心灵内存在方式，那只是某种"思想"性实在。然而最终，奥卡姆逐渐认为这个由"虚构"实体组成的意向领域并不需要；到写作《逻辑大全》与《自由论题》之时，他采纳了所谓 *intellectio* 理论，按照这一理论，普遍概念不过是一下子思考若干对象的行为。在形而上学上，这种行为是一个个体心灵的单个性质，其普遍性仅在于它同时是若干东西的心理符号，从而在心理命题中可述谓那些东西。[^note-26]
