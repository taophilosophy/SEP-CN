      Ockham focuses considerable energy on two categories in particular, quantity and relation, while the remaining six categories are cursorily dealt with. When it comes to the category of relation, he admits that there are a handful of relational entities we should posit on theological grounds (viz., the Trinity, the Incarnation, and the Eucharist), but our natural cognitive powers would see no reason to posit them. Outside these exceptions, he is adamant that there is no compelling reason to posit quantitative, relational, etc. entities in the ontology.[^note-28] Having argued for the existence of substances and, quite notably, for qualities (most of them, at any rate), he argues against the view that quantities (e.g., length, depth), relations (e.g., similarity), actions (e.g., hammering), positions (e.g., sitting), and so on, *exist as entities in addition to singular substances and singular qualities*. He does so by employing a range of metaphysical, natural philosophical, and even theological arguments to show the absurdity of holding that these are entities distinct from substances or qualities. His arguments appeal to the nature of substances, their parts, and their accidents, the impossibility of actual infinities, and God’s power.[^note-29] Concomitantly, he provides alternative explanations of how substances and their qualities are extended, related, positioned, etc., that do not necessitate positing anything other than those substances, their parts, and qualities. For instance, he explains that a material substance is extended simply by virtue of having “parts outside of parts”, i.e., having parts, one after or next to another, rather than on account of a distinct quantitative entity, an extension. By application of the Razor, then, we can dispense with the more ontologically committing view in favor of the more parsimonious view on which we are not required to posit the existence of all these additional accidental entities.
    step1: |-
      奥卡姆对其中两个范畴——数量与关系——投入了相当多的精力，其余六个范畴则一笔带过。就关系范畴而言，他承认有一些关系实体我们应当基于神学理由加以设定（即三位一体、道成肉身与圣餐），但我们的自然认知能力看不出有任何理由设定它们。在这些例外之外，他斩钉截铁地主张：没有令人信服的理由在本体论中设定数量的、关系的等等实体。[^note-28] 在论证了实体存在——并且相当引人注目地论证了性质（至少大部分性质）存在——之后，他反对这样一种观点：数量（如长度、深度）、关系（如相似）、动作（如锤击）、姿态（如坐着）等等*作为实体而存在于单个实体与单个性质之外*。他为此运用了一整套形而上学的、自然哲学的乃至神学的论证，来表明主张这些是与实体或性质不同的实体是荒谬的。他的论证诉诸实体的本性、实体的部分与其偶性、现实无穷的不可能，以及上帝的大能。[^note-29] 与此同时，他还提供了替代性的解释，说明实体及其性质如何被延展、关联、安置等等，而无需设定那些实体、其部分与性质之外的任何东西。例如，他解释说，一个物质实体之所以有广延，仅仅在于它拥有"部分在部分之外"——即拥有一个接一个或一个挨一个的部分——而不是由于一个不同的数量实体、一个广延。于是，通过运用剃刀，我们可以舍弃本体论承诺更多的观点，支持更节俭的观点——按照后者，我们无须设定所有这些额外的偶性实体存在。
    step2: |-
      奥卡姆对其中两个范畴——数量与关系——倾注了大量心力，其余六个范畴则草草带过。论关系范畴，他承认有寥寥数种关系实体应基于神学理由而设定（即三位一体、道成肉身与圣餐），但我们的自然认知能力看不出设定它们的任何理由。除这些例外，他斩钉截铁：在本体论中设定数量的、关系的等等实体，没有令人信服的理由。[^note-28] 在为实体存在辩护——而且相当引人注目地为性质（至少多数性质）存在辩护——之后，他转而批驳这一观点：数量（如长度、深度）、关系（如相似）、动作（如锤击）、姿态（如坐）等等，*作为实体存在于单个实体与单个性质之外*。为此他动用了形而上学、自然哲学乃至神学的一系列论证，表明主张这些是不同于实体或性质的实体何其荒谬。其论证诉诸实体及其部分与偶性的本性、现实无穷之不可能，以及上帝的大能。[^note-29] 与此同时，他给出替代性解释，说明实体及其性质如何延展、关联、安置，而不必设定那些实体、部分与性质之外的任何东西。例如他说，物质实体有广延，仅在于它有"部分在部分之外"——即部分一个接一个、一个挨一个——而非由于一个独立的数量实体即广延。于是，一运剃刀，便可舍去本体论承诺更多的观点，而取更节俭者：依后者，我们无须设定所有这些额外的偶性实体存在。
