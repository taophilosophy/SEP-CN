      The inclusion of pertinacity as a necessary criterion for being a heretic, as well as the introduction of legitimate correction as the first and primary corrective for suspected heresy, indicates that Ockham is open to a limited degree of what we would now call freedom of thought and expression (see Kilcullen 1999 for this reading)[^kilcullen-1999]. Limited, to be sure, to well-meaning and knowledge-seeking Christians who are discussing their faith. As long as one is ready to be corrected, and avoids being pertinacious, there is some latitude for debate especially amongst experts such as theologians.
    step1: |-
      把固执纳入作为异端的一个必要判据，并把正当纠正作为对疑似异端的首要纠正手段引入，表明奥卡姆对我们会称之为思想自由与表达自由的东西持有限度的开放态度（这一解读见 Kilcullen 1999）[^kilcullen-1999]。当然，仅限于善意而求知的、讨论自己信仰的基督徒。只要一个人准备接受纠正、避免固执，辩论就还有某种余地，尤其在神学家这样的专家之间。
    step2: |-
      将固执列为异端的必要判据，又把正当纠正立为疑似异端之首要纠正手段——这表明奥卡姆对今日所谓思想与表达自由，容纳到有限的程度（此读法见 Kilcullen 1999）[^kilcullen-1999]。有限，自然：仅限于善意求知的、讨论自身信仰的基督徒。只要甘受纠正、不作固执，辩论便有余地——在神学家这类专家之间尤然。
