      Ockham employs the distinction between absolute and connotative terms as explained above (§3.3) in full force in his discussion of the categories. Because only substances and qualities exist, only substantial and qualitative terms are absolute.[^note-31] All other categorial terms are connotative and signify those substances and qualities in different ways. And as connotative terms, they have nominal definitions that make conspicuous their primary and secondary significates. For example, the nominal definition of the relational term ‘mother’ might be something like “female animals that produce offspring”. The first term of the definition signifies female animals and the second term signifies her offspring. The term ‘mother’, therefore, primarily signifies female animals and secondarily signifies their offspring. Yet, both female animals and their offspring are just substances. With the appropriate application of connotation theory, then, we can paraphrase sentences using categorial terms, clarifying that they only require the existence of substances and qualities.
    step1: |-
      奥卡姆在讨论范畴时全力运用上文（§3.3）解释的绝对词项与含蓄词项的区分。因为只有实体与性质存在，所以只有实体性的与性质性的词项是绝对词项。[^note-31] 所有其他范畴词项都是含蓄词项，以不同的方式意谓那些实体与性质。而作为含蓄词项，它们有其名义定义，把首要与次生意谓对象彰显出来。例如，关系词项“母亲”的名义定义大概是“生育后代的雌性动物”。定义的第一个词项意谓雌性动物，第二个词项意谓她的后代。“母亲”这个词因此首要意谓雌性动物，次生意谓它们的后代。然而，雌性动物与其后代都只是实体。于是，恰当地运用含蓄理论，我们就能改写使用范畴词项的句子，澄清它们只要求实体与性质的存在。
    step2: |-
      在讨论范畴时，奥卡姆把上文（§3.3）解释的绝对词项／含蓄词项之区分用到极处。既然只有实体与性质存在，便只有实体性、性质性的词项是绝对词项。[^note-31] 其余一切范畴词项皆为含蓄词项，以不同方式意谓那些实体与性质；而作为含蓄词项，它们各有名义定义，将其首要与次生意谓对象彰示出来。例如，关系词项“母亲”的名义定义大概是“生育后代的雌性动物”：定义的前一词项意谓雌性动物，后一词项意谓其后代。于是，“母亲”一词首要意谓雌性动物，次生意谓其后代。可是雌性动物与其后代都只是实体。这样，运用得当的含蓄理论便能改写一切使用范畴词项的句子，点明它们只要求实体与性质的存在。
