  - id: 3
    kind: body
    source: |-
      Ockham led an unusually eventful life for a philosopher. As with so many medieval figures who were not prominent when they were born, we know little about the circumstances of Ockham’s birth and early years, and have to estimate dates by extrapolating from known dates of events later in his life.[^note-1]
    step1: |-
      对一位哲学家而言，奥卡姆的一生异常多事。正如许多出生时并不显赫的中世纪人物一样，我们对奥卡姆的出生与早年境况所知甚少，只能依据他一生后期事件的已知年代来外推估算各种日期。[^note-1]
    step2: |-
      奥卡姆的一生，在哲学家里算得上格外多事。和许多出身平凡的中世纪人物一样，我们对他出生与早年的情形所知寥寥，只能从他一生后期诸事件的已知年代向前外推，来估计各个日期。[^note-1]
