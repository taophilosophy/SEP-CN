      As a nominalist about universals, Ockham had to deal with the Aristotelian claim in the *Posterior Analytics* that science pertains to certain propositions about that which is universal and necessary. He discusses this issue in the Prologue to his *Exposition of the Physics*,[^note-33] and there agrees with Aristotle. But he interprets Aristotle’s *dictum* as saying that knowledge bears upon certain propositions with general (i.e., universal) terms in them. It is only in this sense that science deals with the universal. This of course does not mean that for Ockham our scientific knowledge can never move beyond the level of language to actual things. He distinguishes various senses of ‘to know’ (*scire*, from which we get “*scientia*” and “science”):
    step1: |-
      作为共相问题上的唯名论者，奥卡姆不得不应对《后分析篇》中亚里士多德的主张：科学关乎关于普遍且必然者的某些命题。他在《〈物理学〉诠注》的序言中讨论了这个问题，[^note-33] 并在那里同意亚里士多德。但他把亚里士多德的格言解释为：知识关涉含有普遍（即共相）词项的某些命题。只有在这个意义上，科学才处理普遍者。这当然不意味着在奥卡姆看来，我们的科学知识永远不能越过语言的层面达至实际事物。他区分了“知道”（*scire*，“*scientia*”与“science”的来源）的各种意义：
    step2: |-
