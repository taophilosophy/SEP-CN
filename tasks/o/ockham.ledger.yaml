      Ockham’s ethics combines a number of themes.[^note-39] Scholars continue to debate how to best characterize his ethics. It is a will-based ethics in which intentions, that is, free and voluntary acts of willing, count for everything. External behavior or actions are morally neutral in themselves. They derive their moral worth from the intentions that underlie them. So, two people can perform the same act—say walking to church, to use a common medieval example—but the person who walks to church because she wants to worship God is morally praiseworthy while the person who walks to church because he wants to gossip with his neighbors is not.
    step1: |-
      奥卡姆的伦理学糅合了若干主题。[^note-39] 学者们仍在争论如何最好地刻画他的伦理学。这是一种以意志为根基的伦理学，其中意图——即自由而自愿的意愿行为——就是一切。外在行为或行动本身在道德上是中性的；它们的道德价值来自其底下的意图。因此，两个人可以做出同一个行为——比如步行去教堂，用一个常见的中世纪例子——但因为想崇拜上帝而步行去教堂的人在道德上值得赞扬，而因为想与邻居闲聊而步行去教堂的人则不然。
    step2: |-
      奥卡姆的伦理学糅合了多个主题。[^note-39] 他的伦理学该如何定性，学界至今聚讼未定。这是一套以意志为本的伦理学：意图——自由而自愿的意愿行为——就是一切；外在行为或行动本身道德上中立，其道德价值全从底下的意图而来。于是，两个人可以行同一个行为——比如步行去教堂，这是中世纪的老例子——但因想敬拜上帝而去者在道德上值得称赞，因想与邻人闲谈而去者则不然。
