      ### 7.2 Moral Psychology
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      At the beginning of his *Nicomachean Ethics*, Aristotle remarked that “the good is that at which all things aim”. Each thing, therefore, aims at the good, according to the demands of its nature. In the Middle Ages, “Aristotelians” like Thomas Aquinas held that the good for human beings in particular is happiness, the enjoyment of the direct vision of God in the next life. And, whether they realize it or not, that is what all human beings are ultimately aiming at in their actions. For someone like Aquinas, therefore, the human will is free only in a certain restricted sense. We are *not* free to choose for or against our final end; that is built into us by nature. But we are free to choose various *mean*s to that end. All our choices, therefore, are made under the aspect of leading to that final goal. To be sure, sometimes we make the wrong choices, but when that occurs it is because of ignorance, distraction, self-deception, etc. In an important sense, then, someone like Aquinas accepts a version of the so-called Socratic Paradox: No one knowingly and deliberately does evil.[^note-42]
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      Ockham’s view is quite different. Although he is very suspicious of the notion of final causality (teleology) in general, he thinks it is quite appropriate for intelligent, voluntary agents such as human beings. Thus, the charge that Ockham severs ethics from metaphysics by denying teleology seems wrong.[^note-43] Nevertheless, while Ockham grants that human beings have a natural orientation, a tendency toward their own ultimate good, he does not think this restricts their choices.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      For Ockham, as for Aristotle and Aquinas, I can choose the means to achieve my ultimate good. But in addition, unlike Aristotle and Aquinas, for Ockham I can choose whether to will that ultimate good.[^note-44] The natural orientation and tendency toward that good is built in; I cannot do anything about that. But I can choose whether or not to act to achieve that good. I might choose, for example, to do nothing at all, and I might choose this knowing full well what I am doing. But even more: I can choose to act knowingly directly *against* my ultimate good, to thwart it.[^note-45] I can choose evil *as* evil. Hence, Ockham can be thought to hold a radical position on the freedom of the will: the human will is free to choose otherwise than it does, and our choices, while they are informed by our intellect, are not determined by it.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      For Ockham, this is required if I am going to be morally responsible for my actions.[^note-46] If I could not help but will to act to achieve my ultimate good, then it would not be morally praiseworthy of me to do so; moral “sins of omission” would be impossible (although of course I could be mistaken in the means I adopt). By the same token, moral “sins of commission” would be impossible if I could not knowingly act against my ultimate good. But for Ockham these conclusions are not just required by theory; they are confirmed by experience.
