      Ockham rejected this entire theory of species. For him, both sensory and intellectual species are unnecessary for a successful theory of cognition, and he dispenses with them by appealing to the Razor. Moreover, he argues, species theory is not supported by experience. Introspection reveals no such species in our cognitive processes.[^note-37] His rejection of the species theory of cognition, which had been foreshadowed by several previous authors (such as Henry of Ghent in the thirteenth century), was an important development in late medieval epistemology (For a discussion, see Tachau 1988)[^tachau-1988].
