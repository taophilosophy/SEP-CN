      ### 1.3 慕尼黑（1328/29–47）
  - id: 15
    kind: body
    source: |-
      On the night of May 26, 1328, Michael of Cesena, Ockham, and a few other sympathetic Franciscans fled Avignon and went into exile. They initially went to Italy, where Ludwig of Bavaria, the Holy Roman Emperor, was in Pisa at the time along with his court and retinue. Ludwig was engaged in a political dispute with the Pope, and Ockham’s group found refuge under his protection. On June 6, 1328, Ockham was officially excommunicated for leaving Avignon without permission. Around 1329, Ludwig returned to Munich, together with Michael, Ockham and the rest of their fugitive band. Ockham stayed there, or at any rate in areas under imperial control, until his death. During this time, Ockham wrote exclusively on political matters.[^note-5] He died on the night of April 9/10, 1347, at roughly the age of sixty.
    step1: |-
      1328 年 5 月 26 日夜，切塞纳的迈克尔、奥卡姆和其他几位持同情态度的方济各会士逃离阿维尼翁，开始流亡。他们先去了意大利；神圣罗马皇帝巴伐利亚的路德维希当时正带着宫廷与随从驻在比萨。路德维希正与教皇进行政治争斗，奥卡姆一行在他的庇护下找到安身之所。1328 年 6 月 6 日，奥卡姆因擅自离开阿维尼翁被正式处以绝罚。约 1329 年，路德维希回到慕尼黑，迈克尔、奥卡姆及其余流亡者同行。奥卡姆从此留在此地，或至少留在帝国控制的地区，直至去世。这一时期，奥卡姆只写政治问题。[^note-5] 1347 年 4 月 9/10 日夜，他去世，享年约六十岁。
    step2: |-
      1328 年 5 月 26 日夜，切塞纳的迈克尔、奥卡姆和另外几位同情其事业的方济各会士逃离阿维尼翁，走上流亡之路。他们先赴意大利——神圣罗马皇帝巴伐利亚的路德维希彼时正携宫廷与扈从驻在比萨。路德维希与教皇正陷于政治争端，奥卡姆一行遂在其庇护下觅得容身之处。1328 年 6 月 6 日，奥卡姆因未经许可擅离阿维尼翁被正式处以绝罚。约 1329 年，路德维希返回慕尼黑，迈克尔、奥卡姆与流亡众人一路随行。此后奥卡姆定居于此，至少定居于帝国辖境之内，直到去世。在此期间，他只笔耕政治问题。[^note-5] 1347 年 4 月 9 日至 10 日之夜，奥卡姆去世，享年约六十岁。
