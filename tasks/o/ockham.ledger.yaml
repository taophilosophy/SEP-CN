      For Ockham, as for Aristotle and Aquinas, I can choose the means to achieve my ultimate good. But in addition, unlike Aristotle and Aquinas, for Ockham I can choose whether to will that ultimate good.[^note-44] The natural orientation and tendency toward that good is built in; I cannot do anything about that. But I can choose whether or not to act to achieve that good. I might choose, for example, to do nothing at all, and I might choose this knowing full well what I am doing. But even more: I can choose to act knowingly directly *against* my ultimate good, to thwart it.[^note-45] I can choose evil *as* evil. Hence, Ockham can be thought to hold a radical position on the freedom of the will: the human will is free to choose otherwise than it does, and our choices, while they are informed by our intellect, are not determined by it.
    step1: |-
      对奥卡姆而言，一如对亚里士多德与阿奎那，我可以选择实现我的终极之善的手段。但此外，与亚里士多德和阿奎那不同，对奥卡姆而言，我可以选择是否意愿那个终极之善。[^note-44] 朝向那个善的自然取向与倾向是内在固有的；对此我无能为力。但我可以选择是否行动以实现那个善。例如，我可以选择什么都不做，而且我可以在完全明白自己在做什么的情况下这样选择。但更多：我可以明知而选择直接*对抗*我的终极之善，阻挠它。[^note-45] 我可以*作为*恶来选择恶。因此，可以认为奥卡姆在意志自由问题上持一种激进立场：人的意志可以自由地选择不这样选择，而我们的选择虽然由我们的理智提供信息，却不由它决定。
    step2: |-
      对奥卡姆而言，一如亚里士多德与阿奎那，我可以选择实现终极之善的手段。但此外，与二贤不同，奥卡姆认为我还能选择是否意愿那个终极之善本身。[^note-44] 朝向那个善的自然取向与倾向是内置的，对此我无能为力；但我可以选择要不要行动以实现那个善。比如，我可以选什么也不做，而且是在完全清楚自己所作所为的情况下这样选。更有甚者：我可以明知而直接*对抗*我的终极之善，阻挠它。[^note-45] 我可以*作为*恶本身来选择恶。因此可以说，奥卡姆在意志自由上立场激进：人的意志可以自由地作别的选择；我们的选择虽由理智提供信息，却不由其决定。
