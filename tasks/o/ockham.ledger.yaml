      Ockham was the first philosopher to develop in some detail the notion of mental language and to put it to work for him. Aristotle, Boethius and several others had mentioned it before, but Ockham’s innovation was to systematically transpose to the fine-grained analysis of human thought both the grammatical categories of his time, such as those of noun, verb, adverb, singular, plural and so on, and—even more importantly—the central semantical ideas of signification, connotation, and supposition introduced in the previous section.[^note-14] Written words for him are “subordinated” to spoken words, and spoken words in turn are “subordinated” to mental units called “concepts”, which can be combined into syntactically structured mental propositions, just as spoken and written words can be combined into audible or visible sentences.
    step1: |-
      奥卡姆是第一个较为细致地发展心理语言概念并将它投入使用的哲学家。亚里士多德、波爱修斯及其他数人此前都提到过它，但奥卡姆的创新在于：把他那个时代的语法范畴——如名词、动词、副词、单数、复数等——以及（更重要的）上一节引入的意谓、含蓄与指代等核心语义观念，系统地转用于对人类思想的细粒度分析。[^note-14] 在他看来，书面语词“从属”于口语语词，口语语词又“从属”于称为“概念”的心理单位；概念可以组合成有句法结构的心理命题，正如口语与书面语词可以组合成可听或可见的句子。
    step2: |-
      奥卡姆是头一位把心理语言概念经营出细致眉目、并让它为己所用的哲学家。亚里士多德、波爱修斯等人都曾提及此说，但奥卡姆的创举在于系统地把两套东西移用于人类思想的细粒分析。其一，是他那个时代的语法范畴——名词、动词、副词、单数、复数等等；其二，更要紧，是上一节引入的意谓、含蓄、指代等核心语义观念。[^note-14] 在他那里，书面语词“从属”于口语语词，口语语词又“从属”于所谓“概念”的心理单位；概念可以组配成句法上有结构的心理命题，一如口语与书面语词可以组配成可听闻、可目见的句子。
