      ## 2 著作
  - id: 17
    kind: body
    source: |-
      Ockham’s writings are conventionally divided into two groups: the so-called “academic” and “political” writings. By and large, the former were written or at least begun while Ockham was still in England, while the latter were written toward the end of Ockham’s Avignon period and later in exile. All of his writings are now available in modern critical editions and many are translated into English, in whole or in part.[^note-6] The academic writings are in turn divided into two groups: the “theological” and “philosophical” works, although both groups are essential for the study of Ockham’s philosophy. Many of his distinctive metaphysical, epistemological, and ethical views are found in the theological works.
    step1: |-
      奥卡姆的著作习惯上分为两组：所谓"学术"著作与"政治"著作。大体而言，前者写于或至少起笔于奥卡姆尚在英格兰之时，后者则写于奥卡姆阿维尼翁时期的末尾及此后的流亡岁月。他的全部著作如今都有现代校勘本，许多已全部或部分译成英语。[^note-6] 学术著作又分为两组："神学"著作与"哲学"著作，尽管对研究奥卡姆哲学而言两组都必不可少。他许多独特的形而上学、知识论与伦理学观点都见于神学著作。
    step2: |-
      奥卡姆的著作依惯例分作两类：所谓"学术"著作与"政治"著作。大体上，前者写成——至少起笔——于他尚在英格兰之时；后者则出自阿维尼翁岁月的尾声与此后的流亡时期。他的全部著作如今皆有现代校勘本，许多已整部或部分译为英语。[^note-6] 学术著作再分两支："神学"与"哲学"著作；不过就研究奥卡姆的哲学而言，两支都不可缺。他许多独具一格的形而上学、知识论与伦理学观点，恰恰见于神学著作之中。
