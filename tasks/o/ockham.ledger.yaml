      > Consider, for example, blueprints. In a blueprint of a library, the configuration of the library itself, that is, the very configuration that will be in the finished library, is captured on paper but in such a way that it does not make the paper itself into a library. Rather, the configuration is imposed on the paper in a different sort of way from the way it is imposed on the materials of the library. What Aquinas thinks of as transferring and preserving a configuration we tend to consider as a way of encoding information. (Stump 1999: 170)[^stump-1999]
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      The configuration of features found in the external object is also found in encoded form as a species in the organ that senses the object. (Depending on the sense modality, it may also be found in an intervening medium. For example, with vision and hearing, the species is transmitted through the air to the sense organ.) At the intellectual level, the so-called “agent intellect” goes to work on this species, extracting out of it an intelligible species from which it somehow produces the universal concept that is the raw material of intellectual cognition.[^note-36]
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Ockham rejected this entire theory of species. For him, both sensory and intellectual species are unnecessary for a successful theory of cognition, and he dispenses with them by appealing to the Razor. Moreover, he argues, species theory is not supported by experience. Introspection reveals no such species in our cognitive processes.[^note-37] His rejection of the species theory of cognition, which had been foreshadowed by several previous authors (such as Henry of Ghent in the thirteenth century), was an important development in late medieval epistemology (For a discussion, see Tachau 1988)[^tachau-1988].
