      [^note-3]: The technical term is *‘oblatus’* (“offered”); Ockham was an “oblate”. This practice was quite common and amounted to sending one’s child to boarding school. Various religious schools would often take in children from the surrounding area, educate them, feed and house them. The children were not necessarily expected to pursue a religious vocation later in life, although many of them did.
    step1: |-
