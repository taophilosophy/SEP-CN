      然而这种解释导向的结论是：这一唯名论纲领注定失败。因为，并非所有含蓄词项都能令人信服地从心理语言中消除。例如，关系词项在奥卡姆的语义学中是含蓄词项，因此应当在语义上可还原为非关系词项的组合。但这似乎不可信。第二种解释表明，奥卡姆确实主张心理语言中存在简单含蓄词项，而且事实上反复这样说。[^note-21] 此外，奥卡姆明确否认复杂定义一般而言与相应的被定义词项完全同义。[^note-22] 他的要点大概是：定义通常意谓的东西比被定义词项*更多*。再拿"勇敢的"来说。记住，它的定义是"被赋予勇敢的活物"。这个复杂表达的第一部分使我们想到*所有*活物，而简单词项"勇敢的"只以勇敢的活物为其首要意谓对象，并不以任何方式也意谓不勇敢的活物。这实际上表明：简单含蓄词项并非——至少并非总是——其名义定义的速记缩写。二手文献如今已逐渐汇聚于如下观点：心理语言中*简单*词项之间没有同义，但简单词项与复杂表达（例如定义）之间，或各种复杂表达之间，可以有某种冗余。
