      Because Ockham’s preference for ontological parsimony is so ubiquitous, it can seem that his metaphysics is only negative. All he seems to do is argue *against* metaphysical claims that are more ontologically committing than those that are less so. While not denying this basic philosophical orientation, it should not detract from the recognition that there tends to be a positive flip side to all this. We have already seen that he does give an account of how material substances are extended. His account of the metaphysical structure of material substances, on the one hand, and of artifacts on the other, are also instructive in this regard. In both cases, it is true that he denies that material substances and artifacts are wholes existing over and above their parts. In both cases, however, he provides an explanation of what sort of wholes they are on the basis of a consideration of their parts and how their parts are unified. Arguing against Scotus, he denies the existence of an additional “form of the whole” that unifies the substantial forms and chunks of matter so as to constitute a single material substance. But this does not mean that he has no positive account of the metaphysics of material substances. On the contrary, he holds that a human being, for example, is identical to its conjoined essential parts, which are its rational and sensory souls as well as a corporeal form and its matter. In the natural order and in the absence of divine intervention, the essential parts of a material substance under particular conditions have an intrinsic disposition to unite in such a way that they form that one single material substance. Similarly, he denies the existence of an additional accidental form that would unify the parts of an artifact. Rather, an artifact like a house, for instance, is identical to a collection of natural material substances, e.g., stones, lengths of wood, etc., that have been moved locally into sufficient proximity to one another.[^note-32]
    step1: |-
      由于奥卡姆对本体论节俭的偏好无处不在，他的形而上学似乎只是消极的。他似乎所做的一切就是*反对*那些本体论承诺较多的形而上学主张，而支持承诺较少者。我们不否认这一基本哲学取向，但它不应妨碍我们认识到：这一切往往有其积极的一面。我们已经看到，他确实说明了物质实体如何有广延。他对物质实体的形而上学结构的说明，以及对人工物的说明，在这方面也富有启发性。在两种情形中，他确实否认物质实体与人工物是存在于其部分之上的整体。然而在两种情形中，他都基于对部分的考虑以及部分如何被统一的考虑，说明它们是何种整体。他反对司各脱，否认存在一个额外的“整体形式”来统一诸实质形式与一块块质料，以构成一个单一的物质实体。但这不意味着他对物质实体的形而上学没有积极的说明。恰恰相反，他主张，例如，人同一于其结合着的本质部分，即其理性灵魂与感觉灵魂，以及一个形体形式与其质料。在自然秩序中、在没有神圣干预的情况下，物质实体的本质部分在特定条件下有一种内在倾向，会以这样的方式联合起来，形成那一个单独的物质实体。类似地，他否认存在一个额外的偶性形式来统一人工物的诸部分。毋宁说，像房子这样一个人工物，同一于一堆自然物质实体——例如石头、一段段木头等等——它们已被就地移动到彼此充分接近的位置。[^note-32]
    step2: |-
      奥卡姆处处偏爱本体论节俭，以致他的形而上学显得只会说“不”：似乎他做的一切就是*反驳*本体论承诺较多的形而上学主张，偏袒承诺较少者。这一基本取向固然不假，但它不应遮蔽另一面：这一切往往另有其积极的翻转面。前文已见，他确实说明了物质实体如何有广延；他对物质实体之形而上学结构的说明，连同对人工物的说明，在这方面同样富于启发。两种情形下，他固然都否认物质实体与人工物是凌驾于部分之上的整体；但两种情形里，他都通过考察其部分及部分如何被统一，说明了它们是怎样的整体。他驳司各脱，否认有额外的“整体形式”统一诸实质形式与一块块质料以构成单一的物质实体。但这绝不等于他对物质实体的形而上学没有正面说明。恰恰相反：例如他主张，人同一于其结合在一起的诸本质部分——理性灵魂与感觉灵魂，外加一个形体形式及其质料。在自然秩序中、在无神圣干预时，物质实体的本质部分在特定条件下内在地倾向于联合，从而构成那一个单独的物质实体。同样，他否认有额外的偶性形式统一人工物的诸部分；毋宁说，房子这类人工物同一于一堆自然物质实体——石块、木料等等——它们被就地移置到彼此充分接近之处。[^note-32]
