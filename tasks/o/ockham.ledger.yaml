      [^note-31]: This is more complicated. First, not all qualities are beings distinct from substances. Qualities of shape and figure, e.g., curvedness, straightness, are not. So, terms like ‘curved’ are connotative. Second, concrete qualitative terms, like ‘white’ and ‘hot’, are also connotative, but their abstract counterparts, ‘whiteness’ and ‘heat’, are absolute, since individual whitenesses and heats are qualities that do exist in Ockham’s ontology. See Adams 1987 for details.
    step1: |-
      [^note-31]: 这更为复杂。第一，并非所有性质都是不同于实体的存在者。形状与图形的性质——如弯曲、笔直——就不是。因此，像“弯的”这样的词项是含蓄词项。第二，具体的性质词项，如“白的”与“热的”，也是含蓄词项，而其抽象对应词“白性”与“热性”则是绝对词项，因为单个的白性与热性是在奥卡姆本体论中确实存在的性质。详情见 Adams 1987。
    step2: |-
      [^note-31]: 此处更为曲折。其一：并非一切性质都是异于实体的存在者——形状与图形方面的性质（如弯曲、笔直）便不是；故“弯的”这类词项是含蓄词项。其二：具体的性质词项如“白的”“热的”也是含蓄词项；但其抽象对应者“白性”“热性”却是绝对词项——因为个别的白与热，正是奥卡姆本体论中实有的性质。详见 Adams 1987。
