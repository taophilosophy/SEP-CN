    source: |-
      Book I of the *Summa of Logic* introduces a number of semantic notions that play an important role throughout much of Ockham’s philosophy. None of these notions is original to Ockham, although he develops them with great sophistication and employs them with skill.
    step1: |-
      《逻辑大全》第一卷引入了一批语义学概念，它们在奥卡姆哲学的绝大部分领域中扮演重要角色。这些概念无一为奥卡姆首创，但他以极高的精巧程度发展了它们，并娴熟地加以运用。
    step2: |-
      《逻辑大全》第一卷引入一批语义学概念，它们在奥卡姆哲学的大部分领域里都扮演着要角。这些概念没有一个是奥卡姆的独创，但他把它们发展得极为精微，运用得也十分娴熟。
  - id: 31
    kind: body
    source: |-
      The most basic such notion is signification. In medieval philosophy, a term signifies *what it makes us think of*. This notion of signification was unanimously accepted. Although there was great dispute over *what* terms signified, there was agreement over the criterion.[^note-10] Ockham, unlike many (but no means all) other medieval logicians, held that terms do not in general signify our thoughts, but can signify anything at all (including things not presently existing). The function of language, therefore, is not so much to communicate thoughts from one mind to another, but to convey information about the world.
    step1: |-
      其中最基本的概念是意谓。在中世纪哲学中，一个词项意谓*它使我们想到的东西*。这一意谓概念获得了普遍接受。尽管对词项意谓*什么*争执极大，但在判准上却有共识。[^note-10] 奥卡姆与许多（但绝非全部）其他中世纪逻辑学家不同，他主张词项一般并不意谓我们的思想，而是可以意谓任何东西（包括当下不存在的事物）。因此，语言的功能与其说是在心灵之间传递思想，不如说是传达关于世界的信息。
    step2: |-
      其中最基本的概念是意谓。在中世纪哲学里，一个词项意谓*它使我们想到的东西*。这一定义众口一词：词项意谓*什么*固然争得不可开交，判准本身却无人异议。[^note-10] 奥卡姆与许多中世纪逻辑学家不同（尽管绝非全部）：他认为词项一般并不意谓我们的思想，而是可以意谓任何东西——包括当下并不存在的事物。因此，语言的功能与其说是在此心与彼心之间传递思想，不如说是传达关于世界的信息。
  - id: 32
    kind: body
    source: |-
      In *Summa of Logic* I, 33, Ockham acknowledges four different kinds of signification. In the first sense, a term signifies whatever things it is truly predicable of by means of a present-tensed, assertoric copula. That is, a term *t* signifies a thing *x* if and only if ‘This is a *t*’ is true, pointing to *x*. In the second sense, *t* signifies *x* if and only if ‘This is (or was, or will be, or can be) a *t*’ is true, pointing to *x.*[^note-11] These first two senses of signification are together called “primary” signification.
    step1: |-
