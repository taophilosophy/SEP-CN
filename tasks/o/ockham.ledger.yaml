      然而，尽管奥卡姆的伦理学有神命论的主题，同样清楚的是，他也想让道德成为理性之事。他承认，我们可以有一种“道德科学”，凭借它，通过经验与自然理性的运用，我们可以在实在的人法与神法之外获得关于道德原则的某些知识（*Quodl*. II, q. 14, *OTh* IX, pp. 176–8）。甚至在某种意义上，人们可以在奥卡姆的伦理学中找到一种自然法理论。上帝向我们传达其神圣命令的一种方式，就是赋予我们所具有的本性。[^note-40] 与奥古斯丁不同，奥卡姆接受了“有德的异教徒”的可能性。对奥卡姆而言，道德德性不依赖于是否得到启示。
