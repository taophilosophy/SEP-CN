    source: |-
      In 1323 Ockham was called before the Franciscan province’s chapter meeting held that year in Bristol to defend a number of his views that were regarded with suspicion by some of his confreres. About the same time, someone—it is not clear who—went from England to the papal court at Avignon and charged Ockham with teaching heresy.[^note-4] As a result, a commission of theologians was set up to study the case. Ockham was called to Avignon in May, 1324 to answer the charges. He never went back to England.
    step1: |-
      1323 年，奥卡姆被召到当年在布里斯托尔举行的方济各会省区大会（chapter meeting）上，为他的若干被一些会同修士视为可疑的观点辩护。大约与此同时，有人——不清楚是谁——从英格兰前往阿维尼翁的教廷，指控奥卡姆传授异端。[^note-4] 结果，一个由神学家组成的委员会成立起来研究此案。1324 年 5 月，奥卡姆被召到阿维尼翁答辩。他再也没有回过英格兰。
    step2: |-
      1323 年，方济各会省区大会（chapter meeting）在布里斯托尔召开，奥卡姆被召去为若干观点辩护——这些观点在一些会同修士看来颇为可疑。约莫同时，有人（是谁已不可考）从英格兰赶到阿维尼翁教廷，指控奥卡姆讲授异端。[^note-4] 由此，一个神学家委员会成立，专司审查此案。1324 年 5 月，奥卡姆奉召赴阿维尼翁答辩，自此再未返回英格兰。
