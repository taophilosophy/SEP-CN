      This interpretation led to the conclusion, however, that this nominalist program was bound to fail. For, not all connotative terms can be plausibly eliminated from mental language. Relational terms, for instance, are connotative terms in Ockham’s semantics, and should, therefore, be semantically reducible to combinations of non-relational terms. But this seems implausible. The second interpretation showed that Ockham did hold that there are simple connotative terms in mental language and, in fact, says so repeatedly.[^note-21] Moreover, Ockham explicitly denies that a complex definition is in general wholly synonymous with the corresponding defined term.[^note-22] His point, presumably, is that the definition usually signifies *more* things than the defined term. Take ‘brave’ again. Its definition, remember, is “a living being endowed with bravery”. Now, the first part of this complex expression makes us think of *all* living beings, whereas the simple term ‘brave’ has only the brave living beings as its primary significates without signifying in any way non-brave living beings as well. This shows in effect that simple connotative terms are not—at least not always—shorthand abbreviations for their nominal definitions. The secondary literature has now gradually converged on the view that there is no synonymy among *simple* terms in mental language, but that there can be some redundancy between simple terms and complex expressions, (e.g., definitions), or between various complex expressions.
