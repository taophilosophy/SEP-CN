      [^note-12]: This ignores a prior division Ockham and others make, between “proper” and “improper” supposition. Improper supposition is in effect metaphorical or figurative reference. Medieval semantics did not have a good theory of metaphor, so that this part of supposition theory remained undeveloped by Ockham and others. Ockham’s three main kinds of supposition were not original, and were in fact fairly standard among medieval logicians, although his way of defining them reflects peculiarities of his own theory of signification and was used in connection with his metaphysical nominalism. The origins of supposition theory are not yet well understood, although the terminology of “personal” supposition suggests that it had something to do with theological considerations about “person” vs. “nature” in Trinitarian and Christological theory.
    step1: |-
      [^note-12]: 这里忽略了奥卡姆及其他人先作的一个区分：“本义的”与“非本义的”指代。非本义指代实际上是隐喻性的或比喻性的指称。中世纪语义学没有好的隐喻理论，所以指代理论的这一部分在奥卡姆及他人那里始终未得发展。奥卡姆的三种主要指代并非原创，实际上是中世纪逻辑学家中相当标准的看法，尽管他定义它们的方式反映了他自己意谓理论的独特之处，并与他的形而上学唯名论相连使用。指代理论的起源尚未得到很好的理解，尽管“人称”指代这一术语提示，它与三位一体论和基督论理论中“位格”对“本性”的神学考量有关。
    step2: |-
      [^note-12]: 这里略去了奥卡姆等人先行的另一组区分：“本义”与“非本义”指代。非本义指代实即隐喻性或修辞性的指称；中世纪语义学没有像样的隐喻理论，故指代理论的这一部分在奥卡姆及别家那里始终未获发展。奥卡姆的三种主要指代并非独创，实为中世纪逻辑学家的通行之见；只是他下定义的方式折射出其意谓理论的特有立场，且与其形而上学唯名论配合使用。指代理论的起源至今不甚了然——不过“人称”指代这个术语提示，它或许与三位一体论及基督论里“位格／本性”的神学考量有涉。
