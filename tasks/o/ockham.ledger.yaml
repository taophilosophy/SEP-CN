      Ockham is rightly regarded as one of the most important logicians of the Middle Ages. Nevertheless, his originality and influence should not be exaggerated. For all his deserved reputation, his logical views are sometimes derivative[^note-7] and occasionally very idiosyncratic.[^note-8]
    step1: |-
      奥卡姆被公认为中世纪最重要的逻辑学家之一，这名副其实。尽管如此，他的原创性与影响力不应被夸大。尽管他声誉卓著且受之无愧，其逻辑观点有时却是承袭前人的[^note-7]，偶尔还非常独特。[^note-8]
    step2: |-
      奥卡姆位居中世纪最重要逻辑学家之列，这评价名副其实。尽管如此，他的原创性与影响力不宜夸大：声誉固然卓著且受之无愧，其逻辑观点却时有因袭之处[^note-7]，偶尔还相当别具一格。[^note-8]
