    source: |-
      Michael Oakeshott’s father, Joseph Oakeshott, was a member of the Fabian Society, a socialist but not radical organization (its symbol was the tortoise), many of whose members participated in establishing the British Labor Party. The Society’s leaders, Beatrice and Sidney Webb, were among the founders of the London School of Economics. The younger Oakeshott studied history at Gonville and Caius College, Cambridge, in the early 1920s and became a life fellow in 1925. After serving in the British Army between 1940 and 1945, he returned to Cambridge, then taught briefly at Nuffield College, Oxford, before becoming Professor of Political Science at the LSE in 1951. At some point during his years at the LSE he launched an annual course of lectures in the history of political thought. Focused initially on canonical authors and texts, after the fashion of the lectures he delivered at Harvard in 1958 (Oakeshott 1993b)[^oakeshott-1993b], the course gradually became a more comprehensive examination of the political experience and thought of four peoples: the ancient Greeks, the Romans, medieval Christians, and modern Europeans (Oakeshott 2006)[^oakeshott-2006]. He also led a seminar in the history of political thought for postgraduate students and, as an emeritus professor, was active in it until 1980, contributing papers on the historical study of political thought and the philosophy of history. Brief accounts of Oakeshott’s life can be found in two memorial collections (Norman 1993; Marsh 2001)[^marsh-2001][^norman-1993] and a biographical essay (Grant 2012)[^grant-2012]. The notebooks Oakeshott kept for much of his life (Oakeshott 2014)[^oakeshott-2014] offer additional insights, as do his unpublished letters.
    step1: |-
      迈克尔·奥克肖特的父亲约瑟夫·奥克肖特是费边社成员；该社是一个社会主义但非激进的组织（其标志是乌龟），许多成员参与了英国工党的创建。费边社领袖比阿特丽斯·韦布与西德尼·韦布是伦敦政治经济学院的创始人之一。小奥克肖特 1920 年代初在剑桥大学冈维尔与凯斯学院学习历史，1925 年成为终身研究员。1940 至 1945 年在英国陆军服役后，他回到剑桥，随后短期任教于牛津大学纳菲尔德学院，1951 年出任伦敦政治经济学院政治学教授。在伦敦政治经济学院期间，他某时开设了一门关于政治思想史的年度讲座课程。课程起初聚焦经典作者与文本，仿照他 1958 年在哈佛所授讲座的方式（Oakeshott 1993b）[^oakeshott-1993b]，后来逐渐扩展为对四个民族政治经验与思想的更全面考察：古希腊人、罗马人、中世纪基督徒与现代欧洲人（Oakeshott 2006）[^oakeshott-2006]。他还为研究生主持政治思想史研讨班；作为荣休教授，他积极参与其中直到 1980 年，提交关于政治思想之历史研究与历史哲学的论文。奥克肖特生平的简短记述见两部纪念文集（Norman 1993; Marsh 2001）[^marsh-2001][^norman-1993]与一篇传记性论文（Grant 2012）[^grant-2012]。奥克肖特大半生所记的笔记（Oakeshott 2014）[^oakeshott-2014]提供了更多洞见，其未刊书信亦然。
