      奥克肖特的代表作《论人类行为》（1975a，简称 *OHC*）晚出。它问世时，有人不解，有人敌视，但多数人沉默。即便认为此书重要的人，也觉得其风格令人生畏，因此影响不大。同样难读的，还有收入《论历史及其他论文》（1983，简称 *OH*）的三篇晚期历史哲学论文。他关于自由教育理念及其实践含义的文章，收入《自由学习的呼声》（1989，简称 *VLL*），较为可读，至今仍受关注（Williams 2007; Backhurst and Fairfield 2016）[^backhurst-2016][^williams-2007]。奥克肖特去世后，其他作品陆续问世：先是由耶鲁大学出版社出版的一系列文集（Oakeshott 1993a, 1993b, and 1996）[^oakeshott-1993a]，后来是 Imprint Academic 出版的一系列文集（Oakeshott 2004, 2006, 2007, 2008, 2010, and 2014）[^oakeshott-2004]。二手研究也源源不断，包括两部指南（Franco and Marsh 2012; Podoksik 2012）[^franco-2012][^podoksik-2012]。与哲学同时代人——柯林武德、维特根斯坦、施米特、施特劳斯、哈耶克、伽达默尔、阿伦特、福柯、麦金太尔——的比较，提供了另一个观察其贡献的角度（Dyzenhaus and Poole 2015; Plotica 2015; N. O’Sullivan 2017）[^dyzenhaus-2015][^o’sullivan-2017][^plotica-2015]。这些文献，加上人们开始认真关注他较难读的著作（Thompson 2019; Kos 2022）[^kos-2022][^thompson-2019]，表明奥克肖特在哲学与政治思想史上占有稳固地位。
