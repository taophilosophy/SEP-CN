      Historical inquiry constructs a past but historical facts are present because all facts are present, that is, exist as conclusions within a present body of knowledge. A historical past is constructed according to what present evidence—an object, such as a coin or other artifact that has survived and is treated as evidence—compels the historian to believe. Nor is this historical past the only possible kind of past: if there is a historical past then there must be other, non-historical, pasts constructed in modes other than the historical (OH 9):
    step1: |-
