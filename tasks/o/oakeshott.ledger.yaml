      哲学家使用“模式”一词，或指事物可具有的属性，或指实体可采取的形式。对奥克肖特来说，这个事物或实体是“经验”。他既指经验活动，也指被经验的东西，认为二者不可分离，因而是统一体。从哪一面看，经验都涉及思考，也就涉及观念。他想到的是黑格尔在《精神现象学》里考察的那种主客相互关联的关系（奥克肖特二十多岁时读过此书）：按这种关系，被经验的对象本身就是思想。当一组观念达到相当程度的完整与分化，就可以说出现了一种思想模式。哲学家有时把模式看作某种更大、更真实之物的一个方面（Descartes 1641: 27–28, 31）[^descartes-1641]。《经验及其模式》里还留有这样一种看法的痕迹（在斯宾诺莎与黑格尔那里也辨认得出）：这个“更大之物”就是一切存在者，是经验的总体，被等同于神或绝对者。奥克肖特后来的著作使用“模式”一词，并不暗示某种普遍或终极实在。但思想模式也不只是随便一种思维，而是“自主的”思维，“可按确切条件加以规定”，且“在逻辑上不能否定或证实任何其他模式的结论”（*OH* 2）。一个模式构成独特而自洽的“相互勾连的意义整体”（*VLL* 38），一个依凭自身真、事实性与实在标准的观念世界。于是问题来了：各模式之间如何交谈？答案是：作为模式，它们其实并不交谈。作为理想类型的模式，同它们在具体思想与行动中的实例，是两回事；因此，从哲学上区分模式，与从历史或社会学上研究它们，也是两回事。
