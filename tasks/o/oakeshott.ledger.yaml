      Oakeshott is less clear about what justice or rightness in civil association is than what it is not. He suggests that the most important consideration in assessing a law’s rightness is whether the obligations it prescribes are appropriately imposed, in part because law is inherently coercive (*OHC* 160; *OH* 143). That an act is harmful, wrong, or otherwise undesirable is not necessarily a decisive reason to forbid it legally. Whether a state should constrain someone’s choices on such grounds depends on what Oakeshott calls the moral-legal self-understanding of a community (*OH* 160). If the criteria used in judging the justice of laws are not already embedded in the way a community deliberates legal changes, what is called justice becomes an arbitrary standard that can undermine the rule of law. The defect here arises when we judge a community’s laws according to abstract criteria unrelated to the self-understandings of its members. Here again, Oakeshott’s view resembles that of Michael Walzer, who argues that appropriate and effective “social criticism” comes from those who are experienced in the ways of the community they criticize: they are “connected critics” who base their criticism on the community’s own standards. They stand “a little to the side, but not outside” the communities whose practices they criticize (Walzer 1987: 61)[^walzer-1987]. The desirability of a law, then, must be judged in relation to the practices of the community. These are not univocal, however, and so the judgments are a matter for continuing debate. Judging well requires a disciplined focus on the obligations a state can properly prescribe. A law might be found wanting, for example, if enforcing it were to require intrusive surveillance. The character of deliberation in a state bearing the character of a civil association is defined by its style more than by its conclusions in particular cases (*OH* 161).
    step1: |-
      对于公民联合中的正义或正当性是什么，奥克肖特说得不如它不是什么清楚。他提示，评估一条法律正当性时最重要的考虑，是它所规定的义务是否被恰当地施加——部分因为法律内在地具有强制性（*OHC* 160; *OH* 143）。一个行为有害、错误或在其他方面不可欲，并不必然是法律上禁止它的决定性理由。国家是否应据此限制某人的选择，取决于奥克肖特所谓的共同体道德—法律自我理解（*OH* 160）。如果判断法律正义的标准并未嵌入共同体审议法律变更的方式之中，所谓正义就变成一个任意标准，可能损害法治。这里的缺陷出现在：我们依据与共同体成员自我理解无关的抽象标准来评判其法律之时。在这一点上，奥克肖特的观点又类似沃尔泽：后者主张，恰当而有效的“社会批评”来自那些熟悉其所批评共同体生活方式的人——他们是“有联系的批评者”，以共同体自身标准为批评依据。他们站在所批评共同体的“稍靠一侧，但并非之外”（Walzer 1987: 61）[^walzer-1987]。因此，法律的可欲性必须相对于共同体实践来评判。然而这些实践并非单义，所以判断需要持续辩论。判断得好，要求有纪律地聚焦于国家可恰当规定的义务。例如，若执行一条法律需要侵入性监视，这条法律就可能被认为有缺陷。具有公民联合性格的国家，其审议的特征更多由风格而非具体案件的结论来界定（*OH* 161）。
