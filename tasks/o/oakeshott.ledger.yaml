      The task of historical inquiry is to establish historical knowledge, according to the canons of the historian’s craft, from evidence that is always scattered, unreliable, and open to interpretation. A historical fact is not a given. It is a conclusion: not “what really happened” but “what the evidence requires us to believe” (*EM* 112). Historians identify as historical facts the conclusions that their investigations of survivals from the past, refined as evidence, best support. If historical knowledge is a construction, it follows that what the historian identifies as the past is actually present because it is what the evidence supports *now*. This point, fundamental to the modern discipline of critical history, was made in 1852 by Gustav Droysen, who argued that
    step1: |-
      历史探究的任务，是依史家技艺的准则，从总是零散、不可靠且可作多种解释的证据中确立历史知识。历史事实不是给定的，而是一个结论：不是“实际发生了什么”，而是“证据要求我们相信什么”（*EM* 112）。史家把他们对往昔遗存（经提炼为证据）的探究最有力支持的结论，认定为历史事实。若历史知识是一种建构，那么史家所认定的过去其实是当下的，因为它是证据*现在*所支持的东西。这一要点对现代批判史学至关重要，古斯塔夫·德罗伊森 1852 年即已提出，他论证说：
