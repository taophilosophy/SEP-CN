      Implicit in this claim for the autonomy of historical inquiry is a distinction between naturalistic and hermeneutic ways of understanding human affairs. To signal this distinction, Oakeshott uses the word “conduct” to identify human choice and action, contrasting it with “behavior” explained as the outcome of biochemical or other natural processes. Unlike natural phenomena, human conduct involves ideas. And unlike the natural sciences, the “human sciences” (the sciences of mind or ideas, *Geisteswissenchaften*) require interpreting ideas. The human sciences are, in fact, doubly interpretive because they interpret human conduct, which is itself an activity that involves making and acting on interpretations. Historical explanation emerges as a distinct idiom within the human sciences when we go from generalizing about human conduct to explaining particular acts.
