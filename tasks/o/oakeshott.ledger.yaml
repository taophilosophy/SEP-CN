      A scientific past, such as what happened during the first three minutes of our universe, must be distinguished from the historical past. But the cosmos, or some part of it (the earth, for example), is an individual and has a “history” in one sense of that term. Oakeshott’s restriction of history to human events and historical explanation to making sense of those events as intelligent acts narrows the definition of the historical past and historical inquiry. It implies that there is no such thing as “natural history”, no history of the earth before human beings emerged to populate it. Geological changes are the outcome of geological processes but they are also individual events. The elevation or erosion of a particular mountain range is part of the natural history of the earth and explaining it involves ascertaining how one event led to another. If, like Oakeshott, we think of history as necessarily involving intelligent thought and action, such an explanation would not count as historical. Geology underlines the historical as well as scientific character of the nonhuman world (Rudwick 2014)[^rudwick-2014].
    step1: |-
      科学过去——例如宇宙最初三分钟发生了什么——必须与历史过去区分开。但宇宙或其某一部分（例如地球）是个体，在该词的一种意义上拥有“历史”。奥克肖特把历史限于人类事件、把历史解释限于把这些事件理解为有智力的行为，这窄化了历史过去与历史探究的定义。它意味着不存在“自然史”，不存在人类出现并栖居地球之前的历史。地质变化是地质过程的结果，但它们也是个体事件。某一特定山脉的抬升或侵蚀，是地球自然史的一部分，解释它就要确定一个事件如何导致另一个事件。若像奥克肖特那样，认为历史必然涉及有智力的思想与行动，这类解释就不算历史的。地质学凸显了非人世界兼具历史性与科学性（Rudwick 2014）[^rudwick-2014]。
    step2: |-
