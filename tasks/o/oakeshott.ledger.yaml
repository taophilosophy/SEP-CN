      The idea of a hierarchy of modes is not particular to Idealism. Where there are different understandings, someone interested in reconciling them might argue that they represent different levels of understanding, some more inclusive and in that sense higher than others. In contrast to unifying philosophies, including philosophical Idealism, Oakeshott’s position is pluralist and anti-hierarchical. In this respect he has more in common with Wilhelm Dilthey, who struggled with the issue of relativity in metaphysics and how to distinguish the human from the natural sciences, than with the British Idealists—Bradley, Bosanquet, and McTaggart among others—with whom he is often associated (Boucher 2012)[^boucher-2012]. For Oakeshott, all knowledge is conditional. Theorizing is “an engagement of arrivals and departures” in which “the notion of an unconditional or definitive understanding may hover in the background, but … has no part in the adventure” (*OHC* 2–3). In attempting to construct a coherent view of the world the philosopher “puts out to sea” (*OHC* 40) and is perpetually *en voyage*: there are no “final solutions” in philosophy any more than in politics.
    step1: |-
      模式等级的观念并非唯心论所独有。存在不同理解时，想调和它们的人可能论证说，它们代表不同的理解层次，有些更包容，因而在某种意义上更高。与包括哲学唯心论在内的统一性哲学相反，奥克肖特的立场是多元且反等级的。在这方面，他更接近威廉·狄尔泰——后者苦于形而上学中的相对性问题，以及如何区分人文科学与自然科学——而不接近他常被联系在一起的英国唯心论者（布拉德雷、鲍桑葵、麦克塔格特等）（Boucher 2012）[^boucher-2012]。对奥克肖特而言，一切知识都是有条件的。理论化是“抵达与启程的一场参与”，其中“无条件或确定理解的概念或许在背景中徘徊，但……在这场冒险中没有份”（*OHC* 2–3）。在试图构造融贯世界观时，哲学家“出海”（*OHC* 40），永远 *en voyage*：哲学中没有“最终解决”，正如政治中没有一样。
