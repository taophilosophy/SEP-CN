      迈克尔·奥克肖特（1901–1990）常被称作保守主义思想家。这个标签却只点出他思想的一个侧面，而且含义含混，容易引人误解。他的观念来自毕生研读欧洲思想文献，又经对其论证与预设的哲学反思磨砺而成。奥克肖特工作的前提是：哲学问题彼此勾连，要回答它们，就得作范围广泛的批判性探究。他论道德与政治的著作里反复出现一个主题：个体性（意味着多元）与对它的否认之间的张力——他把后者叫作野蛮。一旦政治被设想为强加某种集体目的，个体自由便受到威胁。晚近政治哲学家对共和主义自由观（自由即独立、不受支配）的兴趣，说明奥克肖特的思想仍有现实针对性；他们对政治现实主义（以之替代道德主义）的兴趣也一样。不过，奥克肖特对哲学的贡献不止于政治哲学。他还反思区分不同思想模式的标准，把历史探究界定为其中一种模式，辨识不同理性概念及其在实践判断中的位置，并区分对现代国家的种种竞争性理解。他也写过宗教、道德、教育、美学、霍布斯和政治思想史。本词条不逐题概述，而是聚焦他对哲学最重要的贡献：模式理论，对理性主义的批评，关于现代政治的关键区分在于国家性质与目的这一论证，以及他的历史哲学。
