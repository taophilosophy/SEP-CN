      Philosophers have used the word “mode” to refer to an attribute that a thing can possess or the form a substance can take. For Oakeshott, this thing or substance is “experience”, by which he means both the activity of experiencing and what is experienced, understood as inseparable and therefore as a unity. Looked at from either side, experience involves thinking and therefore ideas. He has in mind the kind of mutually correlated subject-object relationship that Hegel examines in the *Phenomenology* (which Oakeshott read in his 20s), according to which what is experienced—the object—is itself thought. Where a body of ideas has achieved a substantial degree of integrity and differentiation, a mode of thought can be said to have emerged. Philosophers sometimes understand a mode to be an aspect of something larger or more real than itself (Descartes 1641: 27–28, 31)[^descartes-1641]. In *Experience and Its Modes* there are traces of the view, also discernible in Spinoza and Hegel, that this “larger thing” is everything that exists, the sum total of experience identified as God or the Absolute. Oakeshott does not use the word “mode” in later writings in a way that implies a universal or ultimate reality. But neither is a mode of thought just any kind of thinking. It is an “autonomous” kind of thinking, one that is “specifiable in terms of exact conditions” and “logically incapable of denying or confirming the conclusions of any other mode” (*OH* 2). A mode constitutes a distinct and self-consistent “whole of interlocking meanings” (*VLL* 38), a world of ideas resting on its own criteria of truth, factuality, and reality. A puzzle, then, is how the modes can talk to one another, and the solution is that as modes they actually don’t. There is a difference between modes as ideal types and their instantiation in particular thoughts and actions, and therefore between philosophically differentiating modes and investigating them historically or sociologically.
    step1: |-
      哲学家使用“模式”一词，或指事物可具有的属性，或指实体可采取的形式。对奥克肖特来说，这个事物或实体是“经验”；他既指经验活动，也指被经验者，并认为二者不可分离，因而是一个统一体。从任一面看，经验都涉及思考，因而涉及观念。他想到的是黑格尔在《精神现象学》中考察的那种相互关联的主客关系（奥克肖特二十多岁时读过此书）：按此，被经验者——对象——本身就是思想。当一组观念达到相当程度的完整性与分化时，就可以说一种思想模式出现了。哲学家有时把模式理解为某种比它更大、更真实之物的一个方面（Descartes 1641: 27–28, 31）[^descartes-1641]。在《经验及其模式》中，可以看到一种观点的痕迹（在斯宾诺莎与黑格尔那里也可辨认）：这个“更大之物”是一切存在者，是经验的总体，被等同于神或绝对者。奥克肖特后来的著作使用“模式”一词时，并不暗示某种普遍或终极实在。但思想模式也不只是随便哪种思维。它是一种“自主的”思维，“可按确切条件加以规定”，且“在逻辑上不能否定或证实任何其他模式的结论”（*OH* 2）。一个模式构成一个独特而自洽的“相互勾连的意义整体”（*VLL* 38），一个依凭自身真、事实性与实在标准的观念世界。于是问题在于：各模式之间如何交谈？答案是：作为模式，它们其实并不交谈。作为理想类型的模式，与它们在具体思想与行动中的实例化，是有区别的；因此，从哲学上区分模式，与从历史或社会学上研究它们，也有区别。
