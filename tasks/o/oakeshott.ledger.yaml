      Oakeshott’s magnum opus, *On Human Conduct* (1975a, cited as *OHC*) appeared late in his career. It was greeted in some quarters with incomprehension and in others with hostility, but mostly with silence. Even those who judged the book important found its style forbidding, and its impact has been muted. Also difficult are the three late essays on the philosophy of history included in *On History and Other Essays* (1983, cited as *OH*). His essays on the idea of liberal education and its practical implications, collected in *The Voice of Liberal Learning* (1989, cited as *VLL*), are more accessible and continue to receive attention (Williams 2007; Backhurst and Fairfield 2016)[^backhurst-2016][^williams-2007]. After Oakeshott’s death other writings appeared, first in a series of volumes published by Yale University Press (Oakeshott 1993a, 1993b, and 1996)[^oakeshott-1993a] and then in a series from Imprint Academic (Oakeshott 2004, 2006, 2007, 2008, 2010, and 2014)[^oakeshott-2004]. There has also been a steady stream of secondary works, including two companion volumes (Franco and Marsh 2012; Podoksik 2012)[^franco-2012][^podoksik-2012]. Comparison with philosophical contemporaries—Collingwood, Wittgenstein, Schmitt, Strauss, Hayek, Gadamer, Arendt, Foucault, MacIntyre—offers another angle from which to view his contribution (Dyzenhaus and Poole 2015; Plotica 2015; N. O’Sullivan 2017)[^dyzenhaus-2015][^o’sullivan-2017][^plotica-2015]. This literature, together with the careful attention his less accessible writings are starting to receive (Thompson 2019; Kos 2022)[^kos-2022][^thompson-2019], suggests that Oakeshott occupies a secure place in the history of philosophy and political thought.
