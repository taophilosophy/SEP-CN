      Although Oakeshott criticized the postwar Labor government’s belief in planning, in his youth he thought of himself as a socialist. But his was a romantic socialism concerned with spiritual transformation, not economic redistribution. And though he repudiated Fabianism, Marxism, and other left-wing ideologies, the mature Oakeshott still sympathized with the anarchism of Pierre-Joseph Proudhon, sharing the latter’s vision of a liberal order combining community and equality with individuality and independence (L. O’Sullivan 2014)[^o’sullivan-2014]. His reputation as a conservative thinker was substantially shaped by his trenchant essays on the limits of reason in political life, collected as *Rationalism in Politics and Other Essays* (cited hereafter as *RP*). On the basis of these essays he has been compared to a host of conservative figures from Burke to Wittgenstein. Others argue that he is better characterized as a liberal. As a theorist of the rule of law, he invites comparison with Friedrich Hayek and Carl Schmitt. But efforts to label Oakeshott as either conservative or liberal founder not only on the ambiguities of those terms but on the partisanship they imply: Oakeshott was emphatically not politically engaged. As he teased those attending the twentieth-anniversary celebration of the *National Review* in 1975, the Right’s differences with the Left were a petty squabble over how the spoils of the state as a corporate enterprise should be distributed (*RP* 459). To grasp the philosophical significance of Oakeshott’s thought one must move beyond the vocabulary of twentieth-century political dispute.
    step1: |-
      尽管奥克肖特批评战后工党政府信奉计划，他年轻时却自视为社会主义者。但那是一种浪漫的社会主义，关心精神转变，而非经济再分配。虽然他后来否弃了费边主义、马克思主义及其他左翼意识形态，成熟的奥克肖特仍同情皮埃尔-约瑟夫·蒲鲁东的无政府主义，与后者一样憧憬一种把共同体与平等同个体性与独立结合起来的自由秩序（L. O’Sullivan 2014）[^o’sullivan-2014]。他作为保守主义思想家的名声，很大程度上来自那些论政治生活中理性之限的犀利文章，结果为《理性主义与政治及其他论文》（下文简称 *RP*）。凭借这些文章，他被比作从柏克到维特根斯坦的一连串保守人物。也有人主张，把他称为自由主义者更恰当。作为法治理论家，他让人想到哈耶克与施米特。但无论是把他标为保守主义者还是自由主义者，这些努力都不只败在这些词本身的含混上，也败在它们所暗示的党派立场上：奥克肖特绝非政治上站队的人。1975 年《国家评论》二十周年庆典上，他打趣说，右派与左派的分歧，不过是争夺国家这个公司企业之战利品如何分配的琐碎争吵（*RP* 459）。要把握奥克肖特思想的哲学意义，必须走出 20 世纪政治论争的词汇。
