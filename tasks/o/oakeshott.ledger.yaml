      This is not to make a point about nomenclature; it is to claim that a proper discipline has boundaries that enable a coherent inquiry. For Oakeshott, the category that defines coherent inquiry into human conduct is not “social” but “intelligent”. Intelligence, here, is the quality of having agency, the capacity to think and choose, not of being smart as opposed to stupid in exercising it. An excavated object is either a manifestation of intelligence (such as an arrowhead or a tablet) or not (a rock). This is not to suggest that the experienced world is made up of two kinds of things but rather that we experience the world differently according to the categories of understanding that we bring to it. For an understanding to be coherent, it must distinguish between the intelligent and the not-intelligent because these categories are mutually exclusive. No inquiry can generate a self-consistent body of knowledge if its objects are categorially ambiguous: cross-modal arguments are necessarily incoherent.
    step1: |-
      这不是在命名上做文章，而是主张：一门恰当的学科要有边界，才能有自洽的探究。对奥克肖特来说，界定对人类行为之自洽探究的范畴不是“社会的”，而是“有智力的”。这里的“智力”指具有能动性、能思考与选择的品质，而不是运用智力时聪明而非愚笨。一件出土物要么是智力的表现（如箭镞或泥板），要么不是（如石头）。这不是说经验世界由两类东西组成，而是说我们依自己带去的知性范畴，以不同方式经验世界。理解要自洽，就必须区分有智力者与无智力者，因为这两个范畴互斥。若研究对象在范畴上含混，任何探究都无法生成自洽的知识体：跨模式论证必然不自洽。
