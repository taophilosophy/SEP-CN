      这种历史解释观与实证主义的“覆盖律模型”大相径庭（Hempel 1942; Nagel 1961）[^hempel-1942][^nagel-1961]。科学解释关心可重复事件，历史解释则旨在说明个体的、独特的事件。实证主义的历史解释理论把次序弄反了：它假定待解释事件已被理解为某类事件的一个实例，但史家不能作此假定。历史探究不是去解释一个在解释之前其性格已为人所知的事件。这个性格尚待确立，而且只有通过表明先行事件如何导致它（而非导致别的某个事件）才能确立。因此可以说，历史知识是建构起来的。史家用来组织探究的观念——基督教、文艺复兴、印度——是被指定的，不是被发现的。它们是变化而非不变的身份，在审视下会消解为事件的集合，而这些事件本身又是身份。历史解释意味着阐明一个事件相对于其先行条件的情境意义；在真正的历史探究中，先行条件总是事件，从不是科学定律或过程。在历史解释中，待解释事件被理解为证据所提示的相关先行条件的结果，从而变得可理解。在奥克肖特于三篇晚期历史探究论文的第二篇中发展的这一理论里（*OH* 45–96），一个特定的历史过去表现为一组偶然相关的事件，常以故事形式呈现。但未必如此：他不同意一种在他写作时正赢得追随者的观点，即历史解释与其他解释的区别在于采取叙事形式（Ankersmit 1983; Danto 2007）[^ankersmit-1983][^danto-2007]。但这是把可能当成了必然。史家固然常构造叙事，但叙事并非呈现历史知识的唯一方式。
