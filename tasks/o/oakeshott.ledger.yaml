      What Oakeshott calls “Rationalism” is the belief, in his view illusory, that there are “correct” answers to practical questions. It is the belief that an action or policy is rational only when it rests on knowledge whose truth can be demonstrated. Its error is thinking that correct decisions can be made simply by applying rules or calculating consequences. In an early essay, Oakeshott distinguishes between “technical” and “traditional” knowledge. Technical knowledge is knowledge, whether of facts or rules, that is easily learned and applied, even by those who are without experience. Traditional knowledge, in contrast, is “knowing how” rather than “knowing that” (Ryle 1949)[^ryle-1949]. It is acquired by engaging in an activity and involves judgment in handling facts or rules (*RP* 12–17). Knowledge often involves an element of rule-following but using rules skillfully or prudently means going beyond the instructions they provide. Even a simple rule, like “no vehicles in the park” (Hart 1958)[^hart-1958], implies an element of judgment, in this case what counts as a vehicle. This holds for collective as well as individual decisions and for political as well as private ones. But if technical knowledge has limits, so does traditional knowledge. We cannot conclude that experience and judgment are infallible: clearly, they are not.
    step1: |-
      奥克肖特所谓的“理性主义”，是这样一种（他认为虚幻的）信念：实践问题有“正确”答案。它相信，一个行动或政策只有基于其真理性可被证明的知识，才是理性的。它的错误在于以为，只要应用规则或计算后果，就能作出正确决定。在一篇早期文章中，奥克肖特区分“技术”知识与“传统”知识。技术知识是容易学会和应用的知识（无论关于事实还是规则），即便没有经验的人也能掌握。相反，传统知识是“知道如何”而非“知道那个”（Ryle 1949）[^ryle-1949]。它通过参与某项活动而获得，涉及在处理事实或规则时的判断（*RP* 12–17）。知识常常包含遵循规则的成分，但熟练或审慎地使用规则，意味着超出规则所提供的指示。即便一条简单规则，如“公园内禁止车辆”（Hart 1958）[^hart-1958]，也隐含判断成分——在此即什么算作车辆。这既适用于集体决定，也适用于个人决定；既适用于政治决定，也适用于私人决定。但技术知识有局限，传统知识同样有。我们不能由此断定经验与判断不会出错：显然它们会出错。
