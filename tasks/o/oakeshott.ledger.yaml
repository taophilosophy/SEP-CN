      一个明显的反对意见是：国家既需要工具性法律，也需要非工具性法律；任何国家若不发布命令、制定政策以确保服从、征收赋税、抵御外敌等等，就无法运转。奥克肖特不会不同意。任何现实国家都是形式要素与实质要素、程序与政策、公民联合与事业联合的混合。但界定公民联合，并不意味着辨识现实国家的特征，而是辨识作为一种联合模式的公民联合的“公设”。这些是国家属性，它们决定国家的公民性格，并把这种性格退居其次甚至受压抑的国家区分开来。*Cives* 在对 *lex* 之权威及其所规定义务的承认中联合起来。被界定为 *leges* 的法律约束公民，正如霍布斯说树篱约束旅人：让他们留在路上，却不规定目的地（《利维坦》第 30 章）。说 *civitas* 中的法律具有权威，就是说承认其为法律，独立于 *cives* 是否赞同它所规定的义务。同样，在公民联合中考量一条法律的可欲性，就是从事一项聚焦于如下问题的活动：这条法律是否恰当地表达了 *respublica*——*respublica* 不被设想为实质善、利益或目的，而被设想为支配联合者行为的规则、程序与职位（*OHC* 147–149）：这就是 *res publica*，“公共关切”，公民联合中政治审议的恰当主题。然而，在现实国家中，公共关切包含那些从法治产生、或为维系法治所需的实质善，因为正是法治界定了公民境况。正如康德等人所观察到的，这些善可能包括治安、道路、学校、医院与社会保障（Ripstein 2009: chs. 8 and 9）[^ripstein-2009]。当公民法律矫正贫困、流行病或空气污染等“公共恶”时，并不违反公民联合的前提（de Jongh 2022）[^jongh-2022]。简言之，一旦把公民联合的观念落到实处，公民境况内就有充足空间容纳福利关切。
