      This understanding of historical explanation departs sharply from the positivist “covering law model” (Hempel 1942; Nagel 1961)[^hempel-1942][^nagel-1961]. Unlike scientific explanations, which are concerned with repeatable events, historical explanations aim to account for events that are individual and unique. Positivist theories of historical explanation get things backward by assuming that the event to be explained is already understood as an instance of a type of event, but the historian cannot make this assumption. Historical inquiry is not an exercise in explaining an event whose character is known in advance of the effort to explain it. This character has yet to be established, and it can be established only by showing how antecedent events led to it rather than to some other event. Historical knowledge can therefore be said to be constructed. The ideas that the historian uses to organize an inquiry—Christianity, the Renaissance, India—are designated, not discovered. And they are changing, not immutable, identities that dissolve under scrutiny into collections of events, which are themselves identities. Historical explanation means illuminating the circumstantial meaning of an event in relation to its antecedents, which in a genuinely historical inquiry are always events and never scientific laws or processes. In a historical explanation, an event to be explained is made intelligible as the outcome of what the evidence suggests are the relevant antecedents. In this theory, which Oakeshott develops in the second of three late essays on historical inquiry (*OH* 45–96), a particular historical past appears as a collection of contingently related events, often presented as a story. But not necessarily: he disagrees with the view, which was gaining adherents at the time he was writing, that what distinguishes historical from other kinds of explanations is that they take the form of a narrative (Ankersmit 1983; Danto 2007)[^ankersmit-1983][^danto-2007]. But this mistakes the possible for the necessary. Although historians often construct narratives, a narrative is not the only way to present historical knowledge.
