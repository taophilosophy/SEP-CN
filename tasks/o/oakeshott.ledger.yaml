      奥克肖特反复挑战这样一种论证：政治哲学内在地、不可避免地是实践的。不仅政治哲学可以与其对象即政治活动相区分，而且它要配得上哲学之名，就要求承认这一区分。伦理学亦然。在奥克肖特看来，名副其实的道德哲学是关于道德的理论化（元伦理学）。它关心理解与解释，而非规定。他早年就论证说，规定性的或规范的伦理学是“伪哲学”（*EM* 331–346），因为它把理论化与道德说教混在一起。正如关于笑话的理论本身不是笑话（*OHC* 10），关于道德的理论本身不是一种道德。理论化的对象是一种“进行中的事”，由观察者（“理论家”）加以反思（“理论化”），其反思可能产生结论（“定理”），无论多么暂时（Oakeshott 2004: 391; *OHC* 3）[^oakeshott-2004]。理论化有别于奥克肖特所谓的“做事”：理论化的产物是理解、定理或命题，而不像做事那样是行动。在做事中，任何反思都涉及斟酌该做什么。把真正的历史与科学探究同伪历史或伪科学区分开来的理论化，不以行动为导向，也不作规定，而是解释性的。把哲学探究同历史或科学探究区分开来的，是哲学在审视探究预设时更具批判性：科学家或史家想推进自己的工作，哲学家则要问题化这项工作，并审视思维经验本身。因此，政治哲学在审视政治活动的预设时，才是真正哲学的。
