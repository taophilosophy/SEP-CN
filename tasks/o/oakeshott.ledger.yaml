      By distinguishing between thinking to understand and thinking to act, Oakeshott aims to protect historical, scientific, and philosophical inquiry from the imperialism of practical concerns. With respect to historical inquiry, this aim is evident in his contrasting the idea of a distinctively historical past with what he calls “the practical past”. Genuine historical inquiry is concerned to establish what happened, not to elicit knowledge that speaks to present concerns. It is indifferent to “the lessons of history” (*EM* 316) or “the living past” (*OH* 19). This does not mean that past experience cannot guide present conduct, but that the past that is supposed to guide is not a “historical” past. Nor is it the business of historical inquiry to ascertain the direction of history. Accounts of human progress (Condorcet) or the end of history (Fukuyama) do not observe the modal conditions of historical thought. They are exercises in what Herbert Butterfield (1931) called “Whig history”—stories designed to ratify, if not glorify, the author’s own time. A similar point can be made about stories of decline. By detaching historical knowledge from present concerns, Oakeshott articulates a theory of history as a distinct and coherent mode of inquiry and understanding.
    step1: |-
      通过区分“为理解而思”与“为行动而思”，奥克肖特旨在保护历史、科学与哲学探究免受实践关切的帝国主义。就历史探究而言，这一目标在他把一种独特的历史性过去与他所谓“实践过去”相对照时很明显。真正的历史探究关心确立发生了什么，而不是引出对当前关切说话的知识。它不在乎“历史教训”（*EM* 316）或“活的过去”（*OH* 19）。这并不意味着过去经验不能指导当前行为，而是说被用来指导的过去不是“历史的”过去。查明历史的方向也不是历史探究的事务。人类进步（孔多塞）或历史终结（福山）的叙述，不遵守历史思想的模式条件。它们是赫伯特·巴特菲尔德（1931）所谓“辉格史”的练习——旨在认可（如果不是颂扬）作者所处时代的故事。关于衰落的故事也可作类似评论。通过把历史知识同当前关切分开，奥克肖特阐明了一种把历史视为独特而自洽的探究与理解模式的理论。
