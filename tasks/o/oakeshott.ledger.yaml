      These explorations of ideological politics took Oakeshott in two directions. One, discussed in Section 4 below, was to distinguish alternative understandings of the modern European state, each of which could appear as either an analytical concept or an ideology. The other was to affirm the independence of explanatory theorizing from practical engagement by questioning the commonly affirmed “unity of theory and practice”—an argument, discernible in Heidegger and Gadamer, American pragmatism, and Frankfurt School critical theory, for the practical character of all knowledge (Neill 2013)[^neill-2013]. Heidegger treats practical experience not as one mode of understanding among others but as the primordial experience from which nothing human can free itself. For pragmatists and critical theorists, thinking is shaped by the practical concerns that motivate it. And those who offer practical guidance under the label of normative or applied ethics hold that moral philosophy aims primarily to guide or judge conduct and only secondarily and instrumentally to understand it. They make a similar point about political philosophy. Remarkably, in the study of political thought the rejection of unhistorical story-telling by “Cambridge School” scholars has given way to a renewed conviction of the practical and ideological character of historical investigation evident in the work of many historians of political thought not usually considered to be critical theorists in the Frankfurt School sense (Thompson 2019)[^thompson-2019].
