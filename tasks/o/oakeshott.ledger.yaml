      In his first book, *Experience and Its Modes* (1933, cited as *EM*), Oakeshott barely mentions politics. But this does not mean that he was not interested in political philosophy when he wrote it. The book grew out of his Cambridge lectures from the late 1920s, “The Philosophical Approach to Politics”, now included in *Early Political Writings* (Oakeshott 2010)[^oakeshott-2010]. In these lectures he distinguishes different ways of thinking about politics, but in the book these are detached from the subject of politics and presented as general categories of human experience. By the time he wrote *Experience and Its Modes*, Oakeshott had come to believe that political philosophy was necessarily defective—that it was limited by its commitment to a pre-philosophically demarcated sphere of experience and therefore not genuine philosophy. The book is a highly individual performance in the style of British philosophical Idealism, written at a time when that approach to philosophy was rapidly going out of fashion. In it, Oakeshott credits the influence of Hegel, Bradley, and Bosanquet, but it was evident that he had absorbed their views “into an insistent literary personality which moved freely and suggestively in many types of literature” (Cowling 2003: 256)[^cowling-2003]. When Oakeshott took up politics again in the late 1930’s, it was in relation to the controversies of the day. At the urging of the Cambridge political scientist Ernest Barker, and partly motivated by the hope it would gain him a professorship, he compiled an anthology of texts expounding the “doctrines” of contemporary Europe: Representative Democracy, Catholicism, Communism, Fascism, and National Socialism (Oakeshott 1939)[^oakeshott-1939]. His first postwar publication was an edition of Hobbes’s *Leviathan*, with an influential introduction later published together with other essays on Hobbes in *Hobbes on Civil Association* (Oakeshott 1975b)[^oakeshott-1975b]. In 1947 he founded the *Cambridge Journal*, a short-lived but critically esteemed vehicle treating politics and culture as topics for civilized conversation rather than ideological polemics or academic research. Several of the essays reprinted in *Rationalism in Politics* first appeared there.
    step1: |-
      在第一本书《经验及其模式》（1933，简称 *EM*）中，奥克肖特几乎不谈政治。但这并不意味着他写书时对政治哲学没有兴趣。该书脱胎于他 1920 年代末在剑桥的讲座“政治研究的哲学进路”，这些讲座今收入《早期政治著作》（Oakeshott 2010）[^oakeshott-2010]。在讲座中，他区分了思考政治的不同方式；但在书中，这些方式脱离政治主题，被呈现为人类经验的一般范畴。到写《经验及其模式》时，奥克肖特已相信政治哲学必然有缺陷——它受限于对某个前哲学地划定的经验领域的承诺，因此不是真正的哲学。这本书是英国哲学唯心论风格的一次高度个人化表演，写作之时，那种哲学进路正迅速过时。书中，奥克肖特归功于黑格尔、布拉德雷与鲍桑葵的影响，但显然他已把他们的观点“吸收进一种固执的文学人格，这种人格自由而富有暗示地游走于多种文学类型之间”（Cowling 2003: 256）[^cowling-2003]。奥克肖特 1930 年代末重拾政治，是就当时的争论而发。在剑桥政治学家欧内斯特·巴克敦促下，也部分希望借此获得教授职位，他编纂了一部阐述当代欧洲“学说”的文选：代议制民主、天主教、共产主义、法西斯主义与国家社会主义（Oakeshott 1939）[^oakeshott-1939]。他战后的第一部出版物是霍布斯《利维坦》的校订本，其有影响的导言后来与其他霍布斯论文一起收入《霍布斯论公民联合》（Oakeshott 1975b）[^oakeshott-1975b]。1947 年，他创办《剑桥杂志》；这份刊物寿命不长，却颇受好评，把政治与文化当作文明交谈的话题，而非意识形态论战或学术研究。《理性主义与政治》中重印的若干文章，最初就发表在那里。
