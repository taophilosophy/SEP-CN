      这是共和主义自由观（自由即独立或不受支配）的一个版本（Skinner 1998; Pettit 1997）[^pettit-1997][^skinner-1998]，不过对奥克肖特（如同对康德）而言，独立以道德而非物质术语界定，并被剥去共和主义政治思想的某些其他要素，例如人民必须自己制定法律。个体自由有别于能动性所固有的自由，在公民联合中并不受法律损害。一个理由是：在公民联合中，作为一种联合*模式*，法律是一般规则，不是具体命令。一个国家的实践越接近事业联合，就越容不下“怪僻或对其目的漠不关心”的活动（*OHC* 316）。参与目的性事业，只有在参与是自由选择时，才能表达个体性。事业国家的臣民不独立，因为他们被迫服务的目的乃是为他们选定的。尽管有些人可能偶然逃脱奴役，但能否获准离开（或留下），是“一项管理决定”（*OHC* 317）。事业联合中的自由，是联合与脱离联合的自由，因此只有在联合本身自愿时才能存在；而如果联合是国家，就不能作此假定。
