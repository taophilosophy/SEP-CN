      The humanities and humanistic social sciences characteristically interpret acts in relation to institutions, traditions, genres, and other practices, each of which can be understood as a “language” of human action. But the understanding thereby gained is incomplete, Oakeshott argues, because what it reveals is not the individuality of an act but rather its “conventionality” (*OHC* 99–100), the *type* of conduct it illustrates. Interpreting these conventions can help to understand contexts or situations (practices), but it cannot explain the occurrence of particular acts (performances): why a particular person did such and such a thing on this or that occasion. The individuality of an act is explained historically by relating it to antecedent events that led to its occurrence as a performance with its particular characteristics. An individual act is one in a series of acts, each of which has meaning in relation to acts that preceded it. It is these antecedent acts, or some of them, that illuminate its unique character. Only explanations of this kind are properly historical.
    step1: |-
      人文学科与人文社会科学的典型做法，是把行为放在制度、传统、体裁与其他实践中解释；其中每一项都可理解为人类行动的“语言”。但奥克肖特论证说，由此获得的理解并不完整，因为它揭示的不是行为的个体性，而是其“约定性”（*OHC* 99–100），即它所例示的行为*类型*。解释这些约定有助于理解语境或情境（实践），但无法解释具体行为（表现）的发生：为什么某个特定的人在此一或彼一场合做了如此这般的事。行为的个体性要通过历史解释，把它同导致其作为具有特定特征的表现而发生的先行事件联系起来。一个个体行为是一系列行为中的一项，每一项都相对于先于它的行为而有意义。正是这些先行行为（或其一部分）照亮了它的独特性格。只有这类解释才是真正历史的。
