      在论理性主义的文章中，奥克肖特讨论了许多意识形态政治的例子。他剖析洛克、边沁与马克思的修辞策略，并批评同时代人，因为他们以为政治结论可以从宗教或科学原则中、或从被当作历史教训的东西中提取出来。例如，马克思主义声称可以科学地辨识历史变化规律，并从中得出实践指导。但这一声称应被理解为修辞性的，只能说服那些已经相信它的人（Oakeshott 2008: 168–177）[^oakeshott-2008]。在《政治思想史讲座》（Oakeshott 2006: 469–482）[^oakeshott-2006]与《论人类行为》（*OHC* 263–316）中，他讨论弗兰西斯·培根、德国官房学派等人的论证；这些人把某种集体目的归于国家，把国家视为促进某一特定实质目标的事业。这个目标可能是宗教的、经济的、帝国的或治疗性的。例如，培根主张政府的目的是征服自然，这意味着为集体福利动员劳动——后来的思想家（常常但不限于那些被归为社会主义者的人）探索并发展了这一蕴含。这种现代国家理解中的“集体”与“福利”要素，如同为人类目的而征服自然这一更一般的主题，已变得无处不在。奥克肖特考察 17 世纪清教主义、18 世纪开明专制、20 世纪法西斯主义与共产主义——它们都把国家视为某种公司式事业——作为他所谓“目的统治”（telocracy，或 teleocracy）的实例。在每一例中，集体目标都系于一种自称提供实现目标之指导的意识形态。
