      A number of other conclusions follow from this understanding of modality. First, a mode of experience implies a distinct and autonomous kind of understanding. It implies a universe of discourse with its own arguments and ways of assessing and grounding them. Because propositions in one mode of discourse have no standing in another, truth is coherence, however defined, within a given mode. To argue across a modal boundary is to commit the fallacy of *ignoratio elenchi* (irrelevance). If there is any relationship between modes it is conversational, not argumentative: cross-modal encounters yield differences, not supra-modal conclusions. Oakeshott sometimes makes this point by speaking of modes as “voices” in an inter-modal conversation (*RP* 488–491, 497). In conversation rules of relevance are relaxed: a conversation is not an argument. Second, because what counts as rational in discourse depends on the mode of discourse itself, there is no extra-modal definition of rationality. The illusion that there is arises from privileging what counts as reasonable within a given mode and denigrating what is considered reasonable in other modes. This illusion of superiority generates the narrowness, and at times hubris, characteristic of each mode connoted by the appellations “historicism”, “scientism”, “pragmatism”, and “aestheticism”. A conversational as opposed to argumentative juxtaposition of modal voices is respectful of differences and for that reason inherently civilized, which means that to insist on the primacy of any single mode is not only boorish but barbaric. And because the modes are independent of one another, and none is more expressive of an imagined mode-independent reality than any other, there can be no hierarchy of modes.
    step1: |-
      从这种模式观还可得出若干其他结论。第一，一个经验模式意味着一种独特而自主的理解方式。它意味着一个话语宇宙，有其自身的论证，以及评估与奠基论证的方式。由于一个话语模式中的命题在另一模式中没有地位，真理就是在既定模式内的一致性，无论这种一致性如何界定。跨越模式边界论证，就是犯 *ignoratio elenchi*（不相干）的谬误。模式之间若有任何关系，那是交谈性的，而非论证性的：跨模式相遇产生差异，而非超模式的结论。奥克肖特有时把模式说成跨模式交谈中的“声音”来表达这一点（*RP* 488–491, 497）。在交谈中，相关性规则放宽了：交谈不是论证。第二，由于话语中什么算理性取决于话语模式本身，不存在超模式的理性定义。以为存在这种定义的幻觉，来自把某一模式内算合理的东西置于优先地位，并贬低其他模式中算合理的东西。这种优越感幻觉，产生了“历史主义”“科学主义”“实用主义”“审美主义”等名号所指各模式特有的狭隘，有时还有傲慢。以交谈而非论证的方式并置各模式的声音，尊重差异，因而内在地文明；这意味着坚持任何单一模式的优先性，不仅粗野，而且野蛮。又因为各模式彼此独立，没有一个比另一个更能表达某种想象中不依赖模式的实在，所以不可能有模式的等级。
