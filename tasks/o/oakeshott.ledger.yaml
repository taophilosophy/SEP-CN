      Modes, then, are distinct and provisionally coherent kinds of knowledge. In *Experience and Its Modes*, Oakeshott aims to identify the presuppositions in terms of which a mode can be made coherent and distinguished from other modes. A modal distinction is “categorial”—a distinction of kind rather than degree. Philosophers have disagreed about whether the identified kinds are natural (ontological) or conceptual (epistemological): categories of being (Aristotle) or categories of understanding (Kant). Philosophers also disagree about whether a categorial scheme must be exhaustive and fixed or, alternatively, can be open and mutable (L. O’Sullivan 2024)[^o’sullivan-2024]. The modes that Oakeshott identifies in *Experience and Its Modes*—history, science, and practice, to which he later added “poetry” (aesthetic experience)—can from one angle be seen as epistemological categories, not ontological ones. But from another angle the distinction between being and knowing does not make sense. There can be no absolute difference between what a thing is and how it is conceived in a particular context because there is no “thing in itself” that is independent of thought. And though the modes he identifies are mutually exclusive, Oakeshott does not think that they form a closed set. They are intellectual constructions that have emerged in the course of human experience. This suggests that they could change or even disappear, and that new modes might appear. But here we must distinguish between a mode and its instantiation. History was a possible form of thinking before anyone started to think historically and would remain a possibility even if human beings were to cease thinking historically.
    step1: |-
      因此，模式是独特而暂时自洽的知识类型。在《经验及其模式》中，奥克肖特旨在辨识那些预设：依凭它们，一个模式得以自洽，并与其他模式区分开来。模式区分是“范畴性的”——是种类之别，而非程度之别。哲学家们对已辨识出的种类是自然的（本体论的）还是概念的（认识论的）意见不一：是存在范畴（亚里士多德），还是知性范畴（康德）。哲学家们也争论：范畴图式必须是穷尽且固定的，还是可以开放而可变的（L. O’Sullivan 2024）[^o’sullivan-2024]。奥克肖特在《经验及其模式》中辨识的模式——历史、科学与实践，后来他又加上“诗”（审美经验）——从一个角度看可视为认识论范畴，而非本体论范畴。但从另一个角度看，存在与认识的区分没有意义。事物是什么，与它在特定语境中如何被设想，不可能有绝对差别，因为不存在独立于思想的“自在之物”。尽管他辨识的模式互斥，奥克肖特并不认为它们构成一个封闭集合。它们是人类经验过程中产生的理智构造。这意味着它们可能变化甚至消失，新模式也可能出现。但在这里必须区分模式与其实例。在有人开始历史地思考之前，历史就已经是一种可能的思维形式；即便人类停止历史地思考，它仍是一种可能。
    step2: |-
      所以，模式是独特而暂时自洽的知识类型。《经验及其模式》要辨识的，正是那些预设：依凭它们，一个模式得以自洽，并与其他模式区分。模式区分是“范畴性”的——种类之别，不是程度之别。哲学家对已辨识的种类究竟是自然的（本体论的）还是概念的（认识论的）意见不一：是存在范畴（亚里士多德），还是知性范畴（康德）。他们也争论：范畴图式必须穷尽而固定，还是可以开放而可变（L. O’Sullivan 2024）[^o’sullivan-2024]。奥克肖特在《经验及其模式》中辨识的模式——历史、科学与实践，后来他又加上“诗”（审美经验）——从一个角度看可算认识论范畴，而非本体论范畴。但从另一个角度看，存在与认识的区分根本讲不通：事物是什么，同它在特定语境中如何被设想，不可能有绝对差别，因为不存在独立于思想的“自在之物”。他辨识的模式虽然互斥，奥克肖特却不认为它们构成封闭集合。它们是人在经验过程中造出的理智构造，因此可能变化、消失，也可能出现新模式。但这里要区分模式与其实例。在有人开始历史地思考之前，历史已经是一种可能的思维形式；即便人类不再历史地思考，它仍是一种可能。
