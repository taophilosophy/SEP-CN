      In making these points, Oakeshott differs from philosophical Idealists in Germany, Italy, and England who were proposing similar categorial schemes around the same time. These include Benedetto Croce, who distinguishes the theoretical modes of art, history, and philosophy from the practical modes of economics and ethics, and R.G. Collingwood, who in *Speculum Mentis*, an early work, begins with Hegel’s triad of art, religion, and philosophy, identifying philosophy broadly defined with “knowledge” and distinguishing three kinds of knowledge—science, history, and philosophy narrowly defined—to generate a fivefold hierarchy of modes. In Collingwood’s scheme, art is at the bottom, followed by religion, the former concerned to imagine or “suppose” and the latter to “assert”, and then by the three kinds of genuine knowledge, which are distinguished from art and religion in being critical. Philosophy is the most critical of all because it aims to transcend the other forms (Collingwood 1924)[^collingwood-1924]. Oakeshott, partly in response to Collingwood, folds art and religion into practice, denies that modes can be ordered hierarchically, and defines philosophy as the activity of interrogating presuppositions, including its own, and therefore not itself a mode. But despite characterizing philosophy as supramodal, he severs the tie between philosophy and unqualified knowledge—“the Absolute”—that one finds in Idealist metaphysics from Hegel to Collingwood. The distinction between modal thinking and philosophy that Oakeshott asserts in *Experience and Its Modes* reappears in *On Human Conduct* as a distinction between “conditional” and “unconditional” theorizing, the former resting on assumptions that the latter questions.
    step1: |-
      在提出这些观点时，奥克肖特不同于当时德国、意大利与英国那些提出类似范畴图式的哲学唯心论者。其中包括贝内代托·克罗齐：他区分理论模式（艺术、历史、哲学）与实践模式（经济学、伦理学）；还有 R. G. 柯林武德：在早期著作《心灵镜像》中，他从黑格尔的艺术、宗教、哲学三元组出发，把广义的哲学等同于“知识”，并区分三类知识——狭义的科学、历史与哲学——由此生成一个五重模式等级。在柯林武德的图式中，艺术在底层，宗教次之，前者旨在想象或“假定”，后者旨在“断言”，再往上才是三类真正的知识，它们因具有批判性而有别于艺术与宗教。哲学最具批判性，因为它旨在超越其他形式（Collingwood 1924）[^collingwood-1924]。奥克肖特部分回应柯林武德，把艺术与宗教并入实践，否认模式可作等级排序，并把哲学界定为拷问预设（包括自身预设）的活动，因此哲学本身不是模式。但尽管他把哲学说成超模式的，他却切断了哲学与无条件的知识——“绝对者”——之间的联系；从黑格尔到柯林武德的唯心论形而上学都有这种联系。奥克肖特在《经验及其模式》中断言模式思维与哲学之别，这一区分在《论人类行为》中重现为“有条件”理论化与“无条件”理论化之别：前者基于后者所要质疑的假定。
