      迈克尔·奥克肖特（1901–1990）常被称为保守主义思想家。但这个标签只标识出其思想的一个方面，而且由于含义含混，容易招致误解。他的观念源自毕生阅读欧洲思想文献，并经对其论证与预设的哲学反思而磨砺。奥克肖特工作的前提是：哲学问题彼此关联，回答它们需要范围广泛的批判性探究。他关于道德与政治生活的写作中反复出现一个主题：个体性（意味着多元性）与对它的否认之间的张力——他称后者为野蛮。当政治被设想为强加某种集体目的时，个体自由便受到威胁。晚近政治哲学家对共和主义自由观（自由即独立或不受支配）的兴趣，表明奥克肖特的思想仍有现实意义；他们对政治现实主义（作为道德主义的替代）的兴趣亦然。但奥克肖特对哲学的贡献并不限于政治哲学。它还包括：反思区分不同思想模式的标准，把历史探究界定为这样一种模式，辨识不同的理性概念及其在实践判断中的地位，以及区分对现代国家的种种竞争性理解。奥克肖特还写过宗教、道德、教育、美学、霍布斯与政治思想史。但本词条不逐一概述这些题目，而是聚焦于他对哲学最重要的贡献：他的模式理论、他对理性主义的批评、他关于现代政治的关键区分在于国家性质与目的之论证，以及他的历史哲学。
