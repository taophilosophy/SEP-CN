      法律的权威与其可欲性也有区别：一个为其臣民所不赞成的法律秩序，可能难以维系。这一区别既是概念的，也是实践的。奥克肖特与法律实证主义者一样，把法律作为法律的效力（他称为“本真性”）与其可欲性或正义性（“正当性”）区分开来。但正如他的词汇所标示，有些细微区分他认为很重要。在公民联合中，一条法律若经由权威程序制定、或以其他方式被承认为法律秩序的一部分，就是本真的。这留下了关于其效用、道德正当性、是否符合某种公平分配标准，以及其他可能影响其可欲性之品质的问题。对奥克肖特而言，一条法律的正当性（或如他所说，*lex* 的 *jus*）不是其后果问题。他不同意罗尔斯、德沃金等自由主义平等主义者：法律的正当性（他们称为正义）取决于它是否公平分配利益与负担（*OH* 156）。他也不同意正当性取决于富勒（1969）所谓法律的“内在道德”——它要求法律公开、普遍、不溯及既往等。奥克肖特论证说，这些不是正义法律的品质，而是合法性本身的品质。一条秘密的、为惠及或损害特定个人而量身定制的、或旨在惩罚法律制定前行为的法律，是伪装的命令，不是真正的法律规则（*OHC* 128）。他也不同意那些人：他们认为法律的正当性取决于它是否符合更高法（神法或自然法）、人权原则，或任何其他普遍而范畴性的标准（*OHC* 174; *OH* 142）。
