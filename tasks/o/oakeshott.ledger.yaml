      There will, then, be enterprise elements even in states in which the civil character predominates. An actual state must have, in addition to rules of association, some way to recognize, alter, and apply those rules. Civil association, in other words, requires legislative and judicial institutions and an apparatus of “ruling” (policing, licensing, conscripting, and the like). Such institutions are needed to anchor the idea of civility in the real world. The government of an actual state will occupy buildings, keep records, and collect taxes. And as a necessary part of governing it will sometimes pursue substantive policies, attempt to produce particular outcomes, issue specific orders or commands, and concern itself not only with classes of persons but with named individuals. These powers can be, and often are, misused, but they must be available if the rule of law is to be more than “a logician’s dream” (*OH* 149). But there is a difference between the conceptual presuppositions of civil association and the conditions for realizing it in the circumstances of a particular state. In civil association the *persona* of the legislator, judge, or administrator is defined by the obligations of *lex*. A legislator in this role is not an advocate for policies. A judge is not an arbitrator between interests, nor is an administrator the implementer of a collective project. What is to be legislated, adjudicated, and implemented is noninstrumental law, *lex*, not policies to advance the substantive purposes of a state conceived as a corporate enterprise. In any actual state these roles—legislator and policymaker, judge and arbitrator, ruler and manager—may not be sharply distinguished. But in the mode of civil association, they are distinct.
    step1: |-
      于是，即便在公民性格占主导的国家，也会有事业要素。现实国家除联合规则外，还必须有某种承认、修改与适用这些规则的方式。换言之，公民联合需要立法与司法机构，以及一套“统治”装置（治安、许可、征召之类）。需要这些机构，是为了把公民性的观念锚定在现实世界中。现实国家的政府会占用建筑、保存记录、征收赋税。作为治理的必要部分，它有时会推行实质政策、试图产生特定结果、发布具体命令，并且不只关心人的类别，还关心有名有姓的个人。这些权力可能被滥用，而且常常被滥用；但若法治不想沦为“逻辑学家的美梦”（*OH* 149），这些权力就必须可用。不过，公民联合的概念预设，与在特定国家境况中实现它的条件，是两回事。在公民联合中，立法者、法官或行政官员的*人格*由 *lex* 的义务界定。处于这一角色的立法者不是政策的倡导者；法官不是利益之间的仲裁者；行政官员也不是集体项目的执行者。要立法、裁决与执行的，是非工具性的法律即 *lex*，而不是推进被视为公司式事业的国家之实质目的的政策。在任何现实国家中，这些角色——立法者与政策制定者、法官与仲裁者、统治者与管理者——未必分得很清。但在公民联合模式中，它们是分明的。
