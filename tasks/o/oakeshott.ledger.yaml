      奥克肖特批评战后工党政府信奉计划，可他年轻时自视为社会主义者——不过那是浪漫的社会主义，关心精神转变，不关心经济再分配。他后来抛弃了费边主义、马克思主义和其他左翼意识形态，但成熟的奥克肖特仍同情皮埃尔-约瑟夫·蒲鲁东的无政府主义，与后者一样憧憬一种自由秩序：把共同体、平等同个体性、独立结合在一起（L. O’Sullivan 2014）[^o’sullivan-2014]。他作为保守主义思想家的名声，很大程度上来自那些论政治生活中理性限度的犀利文章，结集为《理性主义与政治及其他论文》（下文简称 *RP*）。凭这些文章，他被比作从柏克到维特根斯坦的一长串保守人物；也有人主张，称他为自由主义者更恰当。作为法治理论家，他又让人想到哈耶克与施米特。但无论贴“保守”还是“自由”的标签，都不只败在这两个词含义含混，还败在标签所暗示的党派立场：奥克肖特绝非在政治上站队的人。1975 年《国家评论》二十周年庆典上，他打趣说，右派与左派之争，不过是争夺国家这家公司战利品如何分配的琐碎口角（*RP* 459）。要把握奥克肖特思想的哲学意义，就得走出 20 世纪政治论争的词汇。
