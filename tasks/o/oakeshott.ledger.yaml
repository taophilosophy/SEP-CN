      In making these points Oakeshott draws on late nineteenth- and early twentieth-century German thinking about the study of history, especially the anti-positivism of Windelband, Rickert, and Dilthey. Their arguments rest on a distinction between the realms of human freedom and natural necessity articulated by Vico, Kant, and Hegel, among others. Understanding human conduct in terms of thought and action can nevertheless be scientific—that is, systematic—in its own way. Such an inquiry might focus on what Hegel called “objective spirit”, shared ideas expressed in languages, moral traditions, and other practices that require interpretation. But it might also concern itself with individual performances: with particular acts, judgments, and arguments. In either case, the disciplines of the humanities and the humanistic social sciences are concerned with the content of thinking—ideas—not the biochemical mechanisms that make thinking possible (*VLL* 23–24). This claim is at odds with how the social sciences are widely understood and especially with much thinking in the disciplines of psychology and cognitive science. From this perspective, “artificial intelligence” is a category mistake. The social sciences for the most part belong with the humanities, not with the natural sciences.
    step1: |-
      提出这些观点时，奥克肖特汲取 19 世纪末、20 世纪初德国关于历史研究的思考，尤其是文德尔班、李凯尔特与狄尔泰的反实证主义。他们的论证基于维柯、康德、黑格尔等人所阐发的人类自由领域与自然必然领域之别。然而，依思想与行动来理解人的行为，本身也可以以自己的方式成为科学的——即系统性的。这种探究可以聚焦黑格尔所谓的“客观精神”，即表现在语言、道德传统与其他需要解释的实践中的共享观念；但它也可以关注个体表现：特定行为、判断与论证。无论哪种情况，人文学科与人文社会科学关心的都是思维的内容——观念——而不是使思维成为可能的生化机制（*VLL* 23–24）。这一主张与人们对社会科学的通行理解相左，尤其与心理学和认知科学中的许多想法相左。从这个角度看，“人工智能”是一个范畴错误。社会科学的绝大部分属于人文学科，而不属于自然科学。
