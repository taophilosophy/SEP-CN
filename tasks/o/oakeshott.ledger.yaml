      行动所涉及的那类思维，就是这样一个模式，奥克肖特称为“实践”。另一个是“历史”。他所谓的“历史”，既不是“一切曾发生之事的名义总和”，也不是其中某一部分（其创造者即构成历史的那些事件的参与者），而是一种独特的事件探究与理解。事件不是给定的，必须从史家当作证据的东西里推断出来，所以这种意义上的历史由史家造成（*OH* 1–2）。这种探究还旨在把过去事件解释为先行事件的可理解结果。与此种历史相对，“科学”作为模式，其标志是寻求规律，以解释可重复事件的发生，并寻求把规律表达为量与量之间关系的方式。如此区分历史与科学，把奥克肖特放进上一代德国新康德主义的传统，尤其是文德尔班与李凯尔特：在他们那里，*Naturwissenschaften* 与 *Geisteswissenschaften* 是两种不同的认识论形式。历史与科学都内在地具有解释性，但提供的解释类型不同。真正的历史也有别于那些受当前实践关切塑造的过去观念。科学也一样：作为探究模式，科学不同于科学知识的实际应用。从这个角度看，工程学也许该算实践学科，而不是科学学科。
