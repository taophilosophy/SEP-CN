      Oakeshott’s idea of civil association responds to a fundamental question in political philosophy: how can the nonvoluntary character of law be reconciled with individual freedom? And his answer, which self-consciously restates conclusions reached by Rousseau, Kant, and J.S. Mill, among others, is that law respects individual freedom only when it is understood as limited to regulating the activities of citizens pursuing their own ends. A legal order of this kind must ensure adequate compliance with its laws, but coercion of that kind should be distinguished from coercion designed to advance substantive policies unrelated to maintaining a civil order. The state as a framework of laws for the coexistence of free individuals becomes a tyranny when law is used to impose the purposes of some on others who do not share them. The legal subject in an enterprise state is not an independent citizen but someone to be led, managed, mobilized, or provided for: a subordinate assigned a role in a purposive project. The dependent role-players in an enterprise state and the independent individuals in a civil one are equally “free”, in one sense of that word, because both have “agency”, the capacity to choose even when their choices are constrained. But only in civil association do those associated enjoy “individual freedom”, which for Oakeshott means freedom from being legally subjected to the purposes of others.
    step1: |-
      奥克肖特的公民联合观念回应政治哲学的一个根本问题：法律的非自愿性格如何与个体自由相协调？他的回答——自觉地重述了卢梭、康德、密尔等人得出的结论——是：只有当法律被理解为限于调节追求自身目的的公民之活动时，它才尊重个体自由。这类法律秩序必须确保法律得到充分遵守，但这种强制应与旨在推进实质政策的强制区分开来，后者与维系公民秩序无关。当法律被用来把某些人的目的强加于不认同这些目的的他人时，作为自由个体共存之法律框架的国家就变成了暴政。事业国家中的法律主体不是独立公民，而是被领导、被管理、被动员、被供养的人：一个在目的性项目中被指派角色的下属。事业国家中依附性的角色扮演者与公民联合中独立的个人，在“自由”的某种意义上同样“自由”，因为二者都有“能动性”——即便选择受约束也能选择的能力。但只有在公民联合中，联合者才享有“个体自由”；对奥克肖特而言，这指的是免于在法律上屈从于他人目的的自由。
