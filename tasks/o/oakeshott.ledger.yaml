      奥克肖特认为，政治研究要真正哲学化，就必须把政治活动的词汇换成另一种词汇，以别的术语来解释政治。但这可能导致误解，因为两套词汇不可互换。需要摆脱继承来的政治词汇的束缚，这解释了为什么奥克肖特——尤其在《论人类行为》中——修改这套词汇，以区分他所谓的“公民”联合与旨在促进实质目的的联合：“事业”联合。若把事业联合的观念应用于国家，我们就得到一种把国家视为公司式事业的理解。公民联合相反，假定不存在凌驾性的集体目的。这一概念标识出这样一种国家：其法律让公民自由追求自己选定的目的；此种国家以联合者的独立为前提，因此决心抵抗支配——这种支配在私人生活中发生于某些人把自己的偏好强加于他人时，在公共事务中则发生于国家本身被组织起来把集体目的强加于所有人时。奥克肖特的拉丁语术语——*civitas* 指国家，*cives* 指公民，*lex* 指法律，*jus* 指法律的正当性，*respublica* 指共同善——源自他的一个愿望：用一些不那么紧密联系于事业联合关切的词，把读者引开这些对应英文词的涵义；那些关切弥漫于现代政治，因而弥漫于现代政治话语。*Civitas* 是一种联合模式，其中 *cives* 作为共同且非工具性法律的同胞臣民而相互关联。
