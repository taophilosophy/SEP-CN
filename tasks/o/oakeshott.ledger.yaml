      *Lex* is what Oakeshott calls an “ideal character”, an abstraction that is not to be confused with the actual law of any existing state. To theorize civil association is not to describe the contingent features of a particular state but to identify the presuppositions of the state as an idea—a mode of association. Having identified the modes of civil and enterprise association, Oakeshott is able to distinguish the idea of a legal order organized to advance a substantive purpose, one shaped by laws instrumental to that end, from one in which the laws are noninstrumental constraints on the choices of subjects pursuing their own purposes. Once we have grasped the distinction, we can see why he identifies the rule of law with civil association: differentiating the rule of law from other kinds of legal rule is necessary to distinguish between laws premised on the independence of citizens and laws designed to conscript them for purposes not their own and thereby to dominate them. For Oakeshott, the rule of law is a concept, not a description of any existing legal order, much less (as it is for a less philosophical thinker like Friedrich Hayek) a guiding ideal or ideology. In what has been called “the ambiguity thesis” (Friedman 1989)[^friedman-1989], Oakeshott holds that any actual state—any existing legal order—is mixture of noninstrumental rules regulating interactions among citizens and rules instrumental to achieving substantive purposes: an ambiguous combination of civil and enterprise association.
    step1: |-
      *Lex* 是奥克肖特所谓的“理想性格”，一种抽象，不可与任何现存国家的实际法律相混淆。理论化公民联合，不是描述某一特定国家的偶然特征，而是辨识作为观念（一种联合模式）的国家的预设。辨识了公民联合与事业联合两种模式后，奥克肖特便能区分两种法律秩序观念：一种为推进实质目的而组织、由服务于该目的的工具性法律塑造；另一种的法律则是对追求自身目的之主体的选择所作的非工具性约束。一旦把握这一区分，就能明白他为何把法治等同于公民联合：要把法治同其他类型的法律统治区分开，就必须区分以公民独立为前提的法律，与旨在征召公民服务于非其自身目的、从而支配他们的法律。对奥克肖特而言，法治是一个概念，不是对任何现存法律秩序的描述，更不是（像对哈耶克那样哲学性较弱的思者而言）一种指导性理想或意识形态。在所谓“歧义论题”（Friedman 1989）[^friedman-1989]中，奥克肖特主张：任何现实国家——任何现存法律秩序——都混合着调节公民互动的非工具性规则与实现实质目的的工具性规则：公民联合与事业联合的歧义组合。
