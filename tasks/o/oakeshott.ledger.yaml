      Oakeshott considers the implications of a “civil” understanding of the modern state in many writings, but most systematically in his essays “On the Civil Condition” (*OHC* Part II) and “The Rule of Law” (*OH* 119–164). Underlying the theory of civil association that he develops in these works is a distinction between two modes of human relationship, one moral and the other prudential. Laws in the mode of civil association, which is an idea abstracted from what might be going on in an actual state, are “moral” in the sense that they prescribe authoritative constraints on how individuals may go about satisfying their wants, not instruments for achieving substantive satisfactions. Unlike persons cooperating to satisfy wants, those related morally (in this sense of the term) are related on the basis of rules as rules: noninstrumental standards of conduct whose authority is distinguished from their utility. One might question Oakeshott’s use of the word “moral” without disputing his suggestion that there is a distinction between the propriety of an act as judged by its relationship to a rule and its consequential desirability. A moral rule binds people regardless of their purposes; it binds enemies as well as friends. As a moral relationship, then, civil association unites people not as subjects joined to pursue a common goal but as individuals pursuing goals of their own, subject to the constraints of laws that are not the instruments of some larger purpose.
    step1: |-
      奥克肖特在许多著作中考察“公民”式现代国家理解的蕴含，但最系统的是《论公民境况》（*OHC* 第二部分）与《法治》（*OH* 119–164）两文。这些著作中发展的公民联合理论，背后是两种人类关系模式之别：一是道德的，一是审慎的。公民联合模式中的法律（这一模式是从现实国家中可能发生之事抽象出的观念）是“道德的”，意思是它们规定个人满足欲望时可如何行事的权威约束，而非实现实质满足的工具。与与为满足欲望而合作的人不同，以道德方式（在此词义上）相关联的人，基于作为规则的规则而关联：这些行为标准是非工具性的，其权威有别于其效用。人们可以质疑奥克肖特对“道德”一词的使用，而不必否认他的提示：一个行为依其与规则的关系而定的正当性，与其后果上的可欲性，是有区别的。道德规则约束人，不论其目的为何；它既约束朋友，也约束敌人。因此，作为一种道德关系，公民联合把人们联合起来，不是作为追求共同目标的臣民，而是作为追求各自目标的个人，服从那些并非某种更大目的之工具的法律约束。
