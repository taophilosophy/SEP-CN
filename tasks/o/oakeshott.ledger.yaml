      A different aspect of Oakeshott’s conception of historical inquiry can be brought out by comparing it with R.G. Collingwood’s claim that historical understanding entails reenacting the past (Collingwood 1993 [1946]: 282–302)[^collingwood-1993][^collingwood-1993-2]. That claim makes historical truth subjective by requiring that the historian reconstruct past events as they were experienced by those who participated in them. But this privileges the understandings of the participants, who may not have understood or even known what was happening. Their ideas are important in constructing a past but are not everything we need to know to understand it. To argue otherwise is to argue that the historian is barred from having any ideas about a given past that “would have been impossible for anyone who lived in that past” (Oakeshott 2008: 49)[^oakeshott-2008]. Oakeshott also rejects Collingwood’s claim that “all philosophy is the philosophy of history” (Collingwood 1993 [1926]: 425)[^collingwood-1993][^collingwood-1993-2] because it makes philosophy, and by implication all knowledge, subservient to historical knowledge (Oakeshott 2007: 199)[^oakeshott-2007]. Collingwood’s argument for the primacy of history (historicism) is as reductionist as arguments for the primacy of science (scientism) or practice (pragmatism). The argument that one kind of understanding is the foundation of other kinds assumes the truth of what it sets out to prove. Historical inquiry constructs knowledge from what it concludes to be evidence. It does not provide knowledge of a given, pre-modal reality. If historical pasts are intellectual constructions, there is no access to these pasts except through historical inquiry.
    step1: |-
      把奥克肖特的历史探究观与柯林武德的主张相比较，可以显出它的另一面：柯林武德认为历史理解意味着重演过去（Collingwood 1993 [1946]: 282–302）[^collingwood-1993][^collingwood-1993-2]。这一主张要求史家按参与者所经验的方式重构过去事件，从而使历史真理主观化。但这把参与者的理解置于优先地位，而参与者可能并不理解、甚至不知道正在发生什么。他们的观念对建构过去很重要，却不是理解过去所需的全部。若持相反主张，就等于说：史家对某一过去不能有任何“对生活于那个过去的人来说本不可能”的观念（Oakeshott 2008: 49）[^oakeshott-2008]。奥克肖特也拒绝柯林武德“一切哲学都是历史哲学”的主张（Collingwood 1993 [1926]: 425）[^collingwood-1993][^collingwood-1993-2]，因为这使哲学、并进而使一切知识屈从于历史知识（Oakeshott 2007: 199）[^oakeshott-2007]。柯林武德为历史优先性（历史主义）所作的论证，与为科学优先性（科学主义）或实践优先性（实用主义）所作的论证一样，都是还原论的。主张一种理解是其他理解的基础，本身已假定了它想证明的东西。历史探究从它认定为证据的东西中建构知识。它不提供关于给定且前模式实在的知识。若历史过去是理智构造，那么除了通过历史探究，别无途径接近这些过去。
    step2: |-
