      The kind of thinking that is involved in acting is one such mode, which Oakeshott calls “practice”. Another is “history”, by which he means neither “the notional grand total of all that has ever happened” nor some part of it, whose makers are the participants in the occurrences that constitute it, but rather a distinct kind of inquiry into and understanding of events. Because events are not given but must be inferred from what the historian treats as evidence, history in this sense is made by the historian (*OH* 1–2). It is, moreover, an inquiry that aims to account for past events as intelligible outcomes of antecedent events. In contrast to history, understood in this way, “science” as a mode is defined by its search for regularities that can account for the occurrence of repeatable events and for ways to express these regularities as relationships between quantities. This way of distinguishing between history and science locates Oakeshott in the tradition of German Neo-Kantian of the previous generation, Wilhelm Windelband and Heinrich Rickert especially, in which the *Naturwissenschaften* and *Geisteswissenschaften* were treated as distinct epistemological forms. History and science are both inherently explanatory, but the kinds of explanations they provide are different. Genuine history is also distinguished from ideas about the past that are shaped by current practical concerns. The same holds for science: as a mode of inquiry, science differs from the practical application of scientific knowledge. From this perspective, we might see engineering as a practical discipline rather than a scientific one.
    step1: |-
      行动所涉及的那类思维，就是这样一个模式，奥克肖特称之为“实践”。另一个是“历史”；他所谓的“历史”，既不是“一切曾经发生之事的名义总和”，也不是其中的某一部分——其创造者是构成历史的那些事件的参与者——而是一种独特的事件探究与理解。由于事件不是给定的，而必须从史家视为证据的东西中推断，这种意义上的历史是由史家造成的（*OH* 1–2）。此外，这种探究旨在把过去事件解释为先行事件的可理解结果。与此种历史相对，“科学”作为一种模式，其界定特征是寻求规律，以解释可重复事件的发生，并寻求把规律表达为量之间关系的方式。这种区分历史与科学的方式，把奥克肖特置于上一代德国新康德主义的传统中，尤其是文德尔班与李凯尔特；在他们那里，*Naturwissenschaften* 与 *Geisteswissenschaften* 被视为不同的认识论形式。历史与科学都内在地具有解释性，但二者提供的解释类型不同。真正的历史也有别于那些受当前实践关切塑造的过去观念。科学亦然：作为探究模式，科学不同于科学知识的实际应用。从这个角度看，我们可以把工程学视为一门实践学科，而非科学学科。
