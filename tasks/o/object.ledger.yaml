      Two thoughts arise. First, such an answer to the Extension Question leads to many puzzles and problems. Second, simply listing all the things is pretty dissatisfying as an answer to the Extension Question. Better to give a general answer and then see what it entails—in particular, what entailments it has for the Extension Question. What follows is one method for giving a general answer to what objects there are.[^note-20]
    step1: |-
      由此生出两点想法。第一，这样回答外延问题会引出许多谜题与难题。第二，仅仅罗列一切事物，作为对外延问题的回答相当令人不满；最好给出一般性答案，再看它蕴含什么——尤其是它对外延问题有何蕴含。以下是给出“有哪些对象”之一般性答案的一种方法。[^note-20]
