      One way to explain a thing or category is to mark out what it does—its role. Since *object* is, on any view at all, a highly abstract and general category, the relevant role by which *object* might be defined must itself be highly abstract and general.[^note-22] Three examples:
    step1: |-
      解释一个事物或范畴的一种方式，是标出它做什么——它的角色。既然无论按哪种观点，*对象*都是高度抽象而普遍的范畴，用以界定*对象*的相关角色本身也必定高度抽象而普遍。[^note-22] 三例：
    step2: |-
      解释事物或范畴的一种方式，是标出它做什么——它的角色。无论按哪种观点，*对象*都是高度抽象而普遍的范畴，故用以界定它的相关角色本身也必高度抽象而普遍。[^note-22] 三例：
  - id: 120
    kind: body
    source: |-
      First, various linguistic items, it seems, denote or refer. “Armstrong” denotes Armstrong, “redness” denotes redness, “the successor of zero” denotes the number 1, and so on. Reflection on these platitudes brings to the fore a role that we might call *being an object of reference* (or perhaps some related modal notion such as *possibly being an object of reference* or *being eligible for reference*).
    step1: |-
      第一，各种语言项似乎在指称或指涉。“Armstrong”指称阿姆斯特朗，“redness”指称红色性，“零的后继”指称数 1，如此等等。对这些老生常谈的反思，凸显出一个角色，我们可称之为*作为指称的对象*（或某种相关的模态概念，如*可能作为指称的对象*或*有资格被指称*）。
    step2: |-
      第一，各种语言项似乎在指称或指涉。“Armstrong”指称阿姆斯特朗，“redness”指称红色性，“零的后继”指称数 1，如此等等。反思这些老生常谈，可凸显一个角色：*作为指称的对象*（或相关的模态概念，如*可能作为指称的对象*、*有资格被指称*）。
  - id: 121
    kind: body
    source: |-
      Second, domains (classes or pluralities), it seems, are associated with quantifiers (expressions like “some” and “every”). “Everything is so-and-so” quantifies over all items within an inclusive domain (maximally inclusive, one thinks) and says of each of those items that it is so-and-so. Reflection on these platitudes brings to the fore a role we might call *being quantified over*, or perhaps some related modal notion such as *possibly being quantified over* or *being a candidate for being quantified over*.
    step1: |-
      第二，域（类或复数）似乎与量词（“有些”“每个”这类表达式）相关联。“一切都如此这般”量化遍及一个包摄性域（人们会想，是最大包摄的域）中的全部项，并说其中每一项都如此这般。对这些老生常谈的反思，凸显出一个角色，我们可称之为*作为量化对象*，或某种相关的模态概念，如*可能作为量化对象*或*有资格作为量化对象*。
    step2: |-
      第二，域（类或复数）似乎与量词（“有些”“每个”这类表达式）相关联。“一切都如此这般”量化遍及一个包摄性域（人们会想，是最大包摄的域）中的全部项，并说其中每一项都如此这般。反思这些老生常谈，可凸显一个角色：*作为量化对象*，或相关的模态概念，如*可能作为量化对象*、*有资格作为量化对象*。
  - id: 122
    kind: body
    source: |-
      Third, some thoughts are, it seems, about things. The thought that Aristotle was a philosopher is at least in part about a certain person—Aristotle. The thought that doing metaphysics is a fine pastime is at least in part about a certain activity. And the thought that Platonism is sensible is at least in part about a certain philosophical theory. Reflection on these platitudes brings to the fore a role we might call *being an object of thought* or *being thought of*, or perhaps some related modal notion such as *being possibly thought of*.[^note-23]
    step1: |-
      第三，有些思想似乎是关于事物的。“亚里士多德是哲学家”这一思想，至少部分是关于某个人——亚里士多德。“做形而上学是件好消遣”这一思想，至少部分是关于某种活动。“柏拉图主义是合理的”这一思想，至少部分是关于某种哲学理论。对这些老生常谈的反思，凸显出一个角色，我们可称之为*作为思想的对象*或*被思考*，或某种相关的模态概念，如*可能被思考*。[^note-23]
    step2: |-
      第三，有些思想似乎是关于事物的。“亚里士多德是哲学家”至少部分是关于某个人——亚里士多德；“做形而上学是件好消遣”至少部分是关于某种活动；“柏拉图主义是合理的”至少部分是关于某种哲学理论。反思这些老生常谈，可凸显一个角色：*作为思想的对象*或*成为思想的对象*，或相关的模态概念，如*可能成为思想的对象*。[^note-23]
  - id: 123
