      存在多元论主张存在不止一个东西。存在多元论当然是标准观点——即便在形而上学家中间也是如此。确实，多数人认为有极多东西。伞状观与存在多元论的合取蕴含存在不止一个对象。但若认为有极多东西，也可能认为它们并非都是对象。于是存在多元论者或许想把本体论问题与外延问题区别对待（对他们而言，见 §2.2）。
