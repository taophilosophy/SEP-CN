      [^note-21]: Debates over the Special Composition Question (and proposed answers to it) are typically and implicitly restricted to objects: so Mereological Universalism, for example, would more exactly be the view that for any objects the *x*s, there exists an object *y* such that the *x*s compose *y* iff the *x*s are one or more in number. Whether a further restriction, not just to objects, but to concrete objects, is in order turns on topics treated elsewhere in this entry, including whether the object category itself is an all-inclusive umbrella or inclusive only of, say, concrete items or non-properties. For a state-of-the-art treatment of the Special Composition Question, including a variety of answers, see Korman & Carmichael (2016). See also McKenzie & F.A. Muller (2017) and the entries on mereology, ordinary objects (especially note 5), and material constitution. For treatment, finally, of what explanatory role answers to the Special Composition Question are supposed to play, see Spencer (2019). On the broader significance of questions about when composition occurs, see Bailey & Brenner (2020). For discussion of anti-realist replies to the Special Composition Question, see Brenner (2022).
    step1: |-
      [^note-21]: 关于特殊组合问题（及其各种拟议答案）的讨论，通常默认限于对象：例如分子论普遍主义更确切地说应是：对任意作为对象的 *x*，存在对象 *y*，使得这些 *x* 构成 *y*，当且仅当这些 *x* 的数目为一个或更多。是否应进一步把范围从对象收窄到具体对象，取决于本词条别处处理的题目，包括对象范畴本身是否包罗一切，还是只包括例如具体项或非属性。关于特殊组合问题的最新处理（含多种答案），见 Korman & Carmichael（2016）；另见 McKenzie & F.A. Muller（2017）以及“分体论”“日常对象”（尤见注 5）与“物质构成”词条。最后，关于特殊组合问题的答案应起何种解释作用，见 Spencer（2019）；关于组合何时发生这一问题的更广意义，见 Bailey & Brenner（2020）；关于对特殊组合问题的反实在论回应，见 Brenner（2022）。
