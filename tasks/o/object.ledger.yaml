      Dasgupta says that if there are no individuals, then the fundamental facts are all general facts, like $\exists xFx$, $\exists x\exists yGxy$, and the like (see also Dasgupta 2016)[^dasgupta-2016]. But what do the variables range over in those sentences? Individuals? Objects? To bypass such questions, we must construct a language that doesn’t quantify over objects. Dasgupta uses a version of predicate functorese, which replaces individuals with predicates and a defined adicity. So instead of “*x* is round”, “something is round”, or “something loves someone”, we have “Round¹ obtains”, “cRound¹ obtains”, and “ccLoves² obtains”. In systematically doing this for all sentences, we can do away with all reference to objects, replacing them with general states of affairs. And since individuals are physically redundant and empirically undetectable, this is a good thing.
    step1: |-
      Dasgupta 说，若没有个体，则基本事实全是普遍事实，如 $\exists xFx$、$\exists x\exists yGxy$ 之类（另见 Dasgupta 2016）[^dasgupta-2016]。但这些句子中的变元辖域是什么？个体？对象？为绕开这类问题，我们必须构造一种不对对象作量化的语言。Dasgupta 使用一种谓词函子语言（predicate functorese），以谓词与既定的元数取代个体。于是我们不写“*x* 是圆的”“某物是圆的”或“某物爱某人”，而写“圆¹ 获得”“c 圆¹ 获得”“cc 爱² 获得”。系统地这样做遍所有句子，就能摆脱一切对对象的指称，代之以普遍的事态。既然个体物理上多余、经验上不可探测，这便是好事。
