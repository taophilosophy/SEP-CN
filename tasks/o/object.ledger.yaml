      Hylomorphism
    step1: |-
      质形论
    step2: |-
      质形论
  - id: 152
    kind: body
    source: |-
      According to *hylomorphism*, objects consist of matter and form (see entry on form vs. matter). Objects are comprised of various parts: electrons and upquarks, for example. In addition to these ordinary material parts, objects have rather special components or constituents—*forms*—property-like items that inform the *matter* of their host substance. Forms give objects structure and shape and are what make each object the kind of thing it is. Forms account for the character or nature of objects; they are property-like in that respect. Socrates, for example, is a human animal comprising form and matter; and Socrates is a human animal because he has a certain form as a constituent.
    step1: |-
      按*质形论*，对象由质料与形式组成（见“形式与质料”词条）。对象由各种部分组成：例如电子与上夸克。除这些寻常的物质部分外，对象还有一些颇为特殊的组分或构成成分——*形式*——即类似属性、赋予其宿主实体的*质料*以形式的项。形式给对象以结构与形状，并使每个对象成为其所是的那类东西。形式说明对象的品格或本性；就此而言，它们类似属性。例如，苏格拉底是兼具形式与质料的人这种动物；苏格拉底之所以是人这种动物，是因为他有某种形式作为构成成分。
    step2: |-
      按*质形论*，对象由质料与形式组成（见“形式与质料”词条）。对象由各种部分构成：电子与上夸克等等；除此之外，对象还有一些颇为特殊的组分——*形式*——即类似属性、赋予宿主实体之*质料*以形式的项。形式给对象以结构与形状，并使每个对象成为其所是的那类东西：它们说明对象的品格或本性，就此而言类似属性。例如，苏格拉底是兼具形式与质料的人这种动物；他之所以如此，是因为有某种形式作为构成成分。
  - id: 153
    kind: body
    source: |-
      Hylomorphism may be thought of as a special case of or variation on the bare particular view. For on hylomorphism, an object has both a property-like constituent (in this case, *form*) that bears a special tie to non-property-like constituents (in this case, *matter*).[^note-32]
    step1: |-
      质形论可以看作裸殊相观的特例或变体。因为在质形论中，对象既有类似属性的构成成分（此处是*形式*），它对非属性类的构成成分（此处是*质料*）具有特殊联结。[^note-32]
    step2: |-
      质形论可以看作裸殊相观的特例或变体：对象既有类似属性的构成成分（此处是*形式*），它对非属性类的构成成分（此处是*质料*）具有特殊联结。[^note-32]
