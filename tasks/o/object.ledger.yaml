      Finally, note that there may be reason to be wary of *any* fully general category (whether expressed by ‘object’, ‘thing’, ‘entity’, or whatnot.). There may be reason, that is, to doubt the metaphysical conjunct of the Umbrella View. First and perhaps most importantly, there are paradoxes and puzzles associated with talking about, or ‘quantifying over’, literally every thing.[^note-4] Second, any fully general category lacks a contrast or complement. So it may appear to be idle with respect to classification or carving or dividing—the central theoretical tasks of categories, one might think—thus inviting suspicion on the grounds that it is of no theoretical use.
