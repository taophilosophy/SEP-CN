      These role-theoretic specifications of what it is to be an object will have consequences with respect to the Extension Question and the Contrast Question. If literally every thing at all is eligible for reference or quantification or thought, for example, then literally every thing would be an object, a thesis in line with the Umbrella View. If, on the other hand, some items are not eligible for reference or quantification or thought, then such items would fall under *non-object*, and the category *object* would turn out to have a contrast or complement. Similarly, if , say, both concrete material objects, abstract propositions are eligible for reference or quantification or thought, then items of both sorts would fall under the extension of *object*.[^note-25]
    step1: |-
      这些关于“成为对象意味着什么”的角色论限定，将对外延问题与对照问题产生后果。例如，若字面意义上的每个东西都有资格被指称、被量化或被思考，那么字面意义上的每个东西都是对象——这与伞状观一致。反之，若有些项没有资格被指称、被量化或被思考，这些项就落在*非对象*之下，*对象*范畴便有对照项或补项。同样，若具体物质对象与抽象命题都有资格被指称、被量化或被思考，那么两类项都落在*对象*的外延之内。[^note-25]
