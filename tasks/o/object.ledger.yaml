      Ontologies—roughly, abstract and systematic catalogues of the kinds of things there are—divide on the question of how objects relate to their properties. On *constituent* ontologies, properties are parts or constituents or components of the objects that have them or that they characterize (see entry on mereology). So on constituent ontologies, a tall tree has *tall,* somehow, as a part or constituent or component. On *relational* ontologies, properties are not in any sense parts or constituents or components of the objects that have them or that they characterize. So on relational ontologies, though a tall tree bears an interesting relationship to *tall* (perhaps it bears the *instantiation* relation to that property), *tall* is not among the tree’s various parts or constituents or components.[^note-26]
    step1: |-
      本体论体系——粗略地说，是关于存在哪些物类的抽象而系统的编目——在“对象如何与其属性相关”一问上分道扬镳。按*构成性*本体论，属性是具有它们的、或被它们刻画的那个对象之部分、构成成分或组分（见“分体论”词条）。于是在构成性本体论里，一棵高树以某种方式把*高*作为部分、构成成分或组分。按*关系性*本体论，属性在任何意义上都不是具有它们的、或被它们刻画的对象的部分、构成成分或组分。于是在关系性本体论里，尽管一棵高树与*高*有某种有趣的关系（或许它与该属性有*实例化*关系），*高*并不在树的种种部分、构成成分或组分之中。[^note-26]
    step2: |-
      本体论体系——粗略地说，是关于存在哪些物类的抽象而系统的编目——在“对象如何与其属性相关”一问上分道扬镳。按*构成性*本体论，属性是具有它们的、或被它们刻画的那个对象之部分、构成成分或组分（见“分体论”词条）：一棵高树便以某种方式把*高*作为部分、构成成分或组分。按*关系性*本体论，属性在任何意义上都不是这类对象的部分、构成成分或组分。尽管一棵高树与*高*有某种有趣的关系（或许它与该属性有*实例化*关系），*高*并不在树的种种部分、构成成分或组分之中。[^note-26]
