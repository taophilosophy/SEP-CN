    source: |-
      One task of metaphysics is to carve reality into categories.[^note-1] Some things could have failed to exist; they fall under the category *contingent being*. Some are events; they fall under *event*. And so on. One might well wonder—is there a category under which *every thing* falls? Offering an informative account of such a category is no easy task. For nothing would distinguish things that fall under it from those that don’t—there being, after all, none of the latter. It seems hard, then, to say much about any fully general category; and it would appear to do no carving or categorizing or dividing at all. Nonetheless there are candidates for such a fully general office, including *thing*, *being, entity*, *item*, *existent*, and—especially—*object*.[^note-2]
    step1: |-
      形而上学的一项任务，是把实在划分为范畴。[^note-1] 有些事物本可能不存在，它们属于*偶然存在者*范畴；有些是事件，属于*事件*。如此等等。人们自然会问：是否存在一个范畴，*万物*都落在其下？给出这样一个范畴的有信息量的说明，绝非易事。因为没有什么能把落在其下的事物与不落在其下的事物区分开——毕竟后者根本不存在。这样一来，对一个彻底普遍的范畴就似乎难以多说；它似乎根本不作任何划分、归类或区分。尽管如此，仍有候选者可以担当这一彻底普遍的职位，包括*物*、*存在者*、*实体*、*项*、*存在物*，尤其是*对象*。[^note-2]
    step2: |-
      形而上学的一项任务，是把实在划分为范畴。[^note-1] 有些事物本可能不存在，它们属于*偶然存在者*；有些是事件，属于*事件*；如此等等。人们自然会问：是否存在一个范畴，*万物*都落在其下？要为这样的范畴给出有信息量的说明，绝非易事：没有任何东西能把它所统摄的事物与不在其下的事物区分开——后者根本不存在。于是，对一个彻底普遍的范畴似乎难以多说；它似乎根本不作任何划分、归类或区分。尽管如此，仍有一些候选者可以担当这一彻底普遍的职位：*物*、*存在者*、*实体*、*项*、*存在物*，尤其是*对象*。[^note-2]
