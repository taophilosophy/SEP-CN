      Two laws are associated with Leibniz. The first is the Indiscernibility of Identicals: for any two objects, if they’re identical, then any property that one has, the other has. The second is the Identity of Indiscernibles (see entry): for any two objects, if it’s the case that for any property one has, the other has it, then the objects are identical.[^note-11]
    step1: |-
      有两条定律与莱布尼茨相关。第一条是同一者的不可分辨：对任意两个对象，若它们同一，则其中一个具有的任何属性，另一个也具有。第二条是不可分辨者的同一（见相关词条）：对任意两个对象，若其中一个具有的任何属性另一个也具有，则这两个对象同一。[^note-11]
    step2: |-
      有两条定律与莱布尼茨相关。第一条是同一者的不可分辨：对任意两个对象，若它们同一，则一个具有的任何属性，另一个也具有。第二条是不可分辨者的同一（见相关词条）：对任意两个对象，若一个具有的任何属性另一个也具有，则二者同一。[^note-11]
  - id: 52
    kind: body
    source: |-
      The Indiscernibility of Identicals is pretty much universally accepted. The Identity of Indiscernibles is controversial. The Identity of Indiscernibles seems to entail, for example, that there cannot be two spheres that have the same color, shape, and density, and have all their other properties in common as well.
    step1: |-
      同一者的不可分辨几乎被普遍接受；不可分辨者的同一则有争议。例如，后者似乎蕴含：不可能有两个球体具有相同的颜色、形状与密度，并且其他属性也全部相同。
    step2: |-
      同一者的不可分辨几乎被普遍接受，不可分辨者的同一则有争议。例如，后者似乎蕴含：不可能有两个球体颜色、形状、密度相同，其他属性也全部相同。
