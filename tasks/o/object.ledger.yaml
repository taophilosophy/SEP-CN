      Another attempt to analyze the object/property distinction is to subsume it under the concrete/abstract distinction. According to some, some things are concrete and others are abstract. Some have it that there are concrete objects and abstract objects (see entry). The former are usually described as material and having causal powers (see entry on the metaphysics of causation), while the latter are usually thought to be immaterial and lack causal powers. While usually the latter are classified as objects, it is a sensible view that the concrete things are objects, and the abstracta are otherwise.
    step1: |-
      分析对象/属性之分的另一尝试，是把它归入具体/抽象之分。按某些人的看法，有些东西是具体的，另一些是抽象的；也有人主张既有具体对象，也有抽象对象（见相关词条）。前者通常描述为物质性的、具有因果力（见“因果性的形而上学”词条），后者通常视为非物质的、缺乏因果力。虽然后者通常也被归为对象，但一种合理的看法是：具体之物是对象，抽象之物则不然。
    step2: |-
      分析对象/属性之分的另一尝试，是把它归入具体/抽象之分。按某些人的看法，有些东西具体，另一些抽象；也有人主张既有具体对象，也有抽象对象（见相关词条）。前者通常描述为物质性的、具有因果力（见“因果性的形而上学”词条），后者通常视为非物质的、缺乏因果力。虽然后者通常也被归为对象，一种合理的看法却是：具体之物是对象，抽象之物则不然。
