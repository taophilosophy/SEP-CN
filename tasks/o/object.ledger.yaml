      [^note-7]: Ramsey (1925) demurs. He thinks that the consideration that Russell thought was most important is not at all important, because language could be manipulated in such a way as to turn any subject-predicate sentence into a sentence where what was the predicate becomes the subject, and what was the subject becomes part of the predicate. Take a particular example, “Socrates is wise”. This can be restated: “Wisdom is a characteristic of Socrates”. So the former subject, Socrates, becomes part of the predicate—“a characteristic of Socrates”. And former predicate, “is wise”, becomes the subject—wisdom.

      So, Ramsey concludes that positing this distinction is ill-motivated:

      > All we are talking about is two different types of objects, such that two objects, one of each type, could be sole constituents of an atomic fact. The two types being in every way symmetrically related, nothing can be meant by calling one type the type of individuals and the other that of qualities, and these two words are devoid of connotation. (1925: 416)
    step1: |-
      [^note-7]: Ramsey（1925）表示异议。他认为罗素视为最重要的那个考虑根本不重要，因为可以这样摆弄语言：把任何主谓句改造成一个句子，使原来的谓词成为主词，原来的主词成为谓词的一部分。举个具体例子：“苏格拉底是智慧的。”这可改述为：“智慧是苏格拉底的一个特征。”于是原来的主词苏格拉底成了谓词的一部分——“苏格拉底的一个特征”；原来的谓词“是智慧的”成了主词——智慧。

      于是 Ramsey 断定，设定这一区分动机不足：

      > 我们所谈论的只是两类不同的对象，一类与另一类各取其一，便可成为一个原子事实的唯一构成成分。这两类在各方面都对称相关，因此把一类叫作个体类、把另一类叫作性质类，不可能有任何意谓；这两个词都没有内涵。（1925: 416）
    step2: |-
      [^note-7]: Ramsey（1925）表示异议：罗素视为最重要的那个考虑根本不重要，因为语言可以这样摆弄——把任何主谓句改造成一个句子，使原来的谓词成为主词，原来的主词成为谓词的一部分。例：“苏格拉底是智慧的”，可改述为“智慧是苏格拉底的一个特征”。于是原来的主词苏格拉底成了谓词的一部分（“苏格拉底的一个特征”），原来的谓词“是智慧的”成了主词（智慧）。

      Ramsey 因此断定，设定这一区分动机不足：

      > 我们所谈论的只是两类不同的对象，一类与另一类各取其一，便可成为一个原子事实的唯一构成成分。这两类在各方面都对称相关，因此把一类叫作个体类、把另一类叫作性质类，不可能有任何意谓；这两个词都没有内涵。（1925: 416）
