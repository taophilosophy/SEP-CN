      Hawthorne and Cortens (1995) speak for the nihilist thus: “the concept of an object has no place in a perspicuous characterization of reality” (p. 143). They suggest three theories on which there are no objects. The first that there are just stuffs everywhere, but no objects. The second that there is just one big mass of stuff.[^note-17] The third is that there just isn’t anything at all. This last option is what Hawthorne and Cortens defend. They do so using what they (following Strawson) call a “feature-placing language”. They model a potential nihilist program on sentences like “it is raining”, “it is snowing now”, and “it is cold here”. Such sentences do not quantify over anything and have no logical subject (‘it’ functions as a dummy pronoun), and so do not ontologically commit one to anything. The nihilist may then paraphrase sentences that apparently require objects (such as “there is a computer here”) with those that do not (such as “it is computering here”). In short, the nihilist turns every putative noun into an adverb, making judicious use of spatial, temporal, and numerical adverbs too. It may seem that the results are plainly wrong. For our ordinary sentences appear to say that objects have properties (“the computer is running”, for example); and they appear, furthermore, to be about those objects. But on the feature-placing view at hand, they are not about anything at all (there being no computers for them to be about, for example). According to Azzouni (2017: xi–xii; see also all of Chapter 7), this appearance is not dispositive evidence against the feature-placing nihilist; it is instead the result of a cognitive illusion. We are systematically and incorrectly tempted to take our ordinary sentences to be about things, even when we know those things don’t exist.
    step1: |-
      Hawthorne 与 Cortens（1995）这样为虚无主义者代言：“在對实在的清晰刻画中，对象这个概念没有位置”（第 143 页）。他们提出三种理论，按之皆无对象。第一种：到处只有质料，没有对象。第二种：只有一大团质料。[^note-17] 第三种：根本什么都没有。最后一种正是 Hawthorne 与 Cortens 所辩护的。他们使用（循斯特劳森）所谓的“特征置放语言”来做这件事。他们以“下雨了”“现在下雪了”“这里很冷”这类句子为模型，设想一个可能的虚无主义纲领。这类句子不对任何东西作量化，也没有逻辑主语（“it”只是虚代词），因此在本体论上不承诺任何东西。虚无主义者于是可以把显然要求对象的句子（如“这里有一台电脑”）改述为不要求对象的句子（如“这里正在电脑着”）。简言之，虚无主义者把每个推定名词都变成副词，并审慎地借助空间、时间与数词副词。这些结果似乎明显是错的：我们的日常句子似乎在说对象具有属性（如“电脑在运行”），而且似乎在谈论那些对象。但按眼下的特征置放观，它们根本不谈论任何东西（例如，并没有电脑可供谈论）。据 Azzouni（2017: xi–xii；另见第 7 章全章），这一表面现象并不构成反对特征置放式虚无主义的确凿证据；它是认知错觉的结果：我们系统性地、错误地倾向于认为日常句子在谈论事物，即便明知那些事物并不存在。
    step2: |-
      Hawthorne 与 Cortens（1995）这样为虚无主义者代言：“在对实在的清晰刻画中，对象这个概念没有位置”（第 143 页）。他们提出三种理论，按之皆无对象：其一，到处只有质料，没有对象；其二，只有一大团质料；[^note-17] 其三，根本什么都没有。最后一种正是他们所辩护的。他们使用（循斯特劳森）所谓的“特征置放语言”：以“下雨了”“现在下雪了”“这里很冷”这类句子为模型，设想一个可能的虚无主义纲领。这类句子不对任何东西作量化，也没有逻辑主语（“it”只是虚代词），故在本体论上不承诺任何东西。虚无主义者于是可把显然要求对象的句子（如“这里有一台电脑”）改述为不要求对象的句子（如“这里正在电脑着”）。简言之，他们把每个推定名词都变成副词，并审慎借助空间、时间与数词副词。这些结果似乎明显是错的：日常句子似乎在说对象具有属性（如“电脑在运行”），且似乎在谈论那些对象。但按眼下的特征置放观，它们根本不谈论任何东西（并没有电脑可供谈论）。据 Azzouni（2017: xi–xii；另见第 7 章），这一表面现象并不构成反对特征置放式虚无主义的确凿证据；它是认知错觉的结果：我们系统而错误地倾向于认为日常句子在谈论事物，即便明知那些事物并不存在。
