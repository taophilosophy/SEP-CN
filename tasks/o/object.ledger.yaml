      One question to ask about the category of *object* is to ask what falls under it—what is in its extension? This is the *Extension Question*. The extension of some categories is obvious. The extension of the category *electron* is all the electrons and no non-electrons. The extension of the category *number* is all and only the numbers. The extension of the category *composite things* is all and only the things that have proper parts.[^note-14] For some categories, difficult questions arise. Some of those questions involve the question of whether certain things are in the extension of the category, e.g., is the Pope in the extension of the category *bachelor*? Is a fetus in the extension of the category *person*? Some questions concern the nature of the things falling under the category. The extension of the category *book* includes all and only the books. Does it include ebooks? Does it include some particular and well-loved copy of *Material Beings*, with its stained pages and cover, or the abstract type of which this particular copy is a token? Answering the Extension Question leaves many other questions unsettled, one of which is the nature of the things that are in the extension. But knowing which things are in the extension is a good start toward figuring out their nature.
    step1: |-
      关于*对象*范畴可以问的一个问题是：什么落在其下——其外延里有什么？这就是*外延问题*。有些范畴的外延一目了然。*电子*范畴的外延是所有电子，不含非电子。*数*范畴的外延是所有且仅有数。*复合事物*范畴的外延是所有且仅有具有部分的东西。[^note-14] 有些范畴则会引出难题。一类难题关乎某些东西是否在该范畴的外延之内，例如：教皇在*单身汉*范畴的外延内吗？胎儿在*人*范畴的外延内吗？另一类关乎落在该范畴下的事物的本性。*书*范畴的外延包含所有且仅有书。它包括电子书吗？它包括某册被人钟爱、页面与封面已有污渍的《物质存在者》，还是包括这册书作为殊例所例示的抽象类型？回答外延问题会留下许多悬而未决的问题，其中之一就是外延中事物的本性；但知道哪些东西在外延中，是弄清其本性的良好开端。
