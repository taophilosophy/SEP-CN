      许多属性似乎为对象所共享。我们手头的几本《对象：没有不寻常之物》形状相同，克努特·罗克尼头盔的金色与乔·蒙大拿头盔的金色也相同。但并非只有一册《对象：没有不寻常之物》多重定位；而是有许多册共享同一形状。并非只有一个圣母大学橄榄球头盔，而是有数百个。书与头盔是多，它们的每个属性或许是一。
