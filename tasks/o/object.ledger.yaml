      Consider these platitudes: there are things, and there are ways those things are (we might call the latter ‘properties’). There appear to be, for example, tall trees; there also appear to be properties had by those trees, such as *being tall*.[^note-5] There appear to be, again, both things and properties. Perhaps there is, then, an important distinction between things and properties. And if there is such a distinction, it would appear to mark an important *metaphysical* divide. For it operates at a very high level of abstraction and promises to exhaustively and exclusively divide reality into categories—with trees, people, planets (for example) falling under *thing* and *green*, *tall*, *itchy*, and *kind* (for example) falling under *property*. The thesis that there is such a divide, we note, is distinct from purely semantic theses about whether to use the words ‘object’ and ‘property’ to pick out each side of that divide. Our focus here is on the metaphysical question of whether there is such a contrast in the first place, not on which words might express it.
    step1: |-
      请看这些老生常谈：有事物，也有这些事物的种种样子（不妨把后者称为“属性”）。例如，似乎有高树；似乎也有那些树所具有的属性，如*高*。[^note-5] 再次，事物与属性似乎都存在。那么，也许事物与属性之间有一个重要区分。若有此区分，它似乎标示出一道重要的*形而上学*分界：它在极高的抽象层次上运作，且有望互斥而穷尽地把实在分为若干范畴——例如树木、人、行星落在*事物*之下，而*绿*、*高*、*痒*、*善良*落在*属性*之下。我们要指出，存在这样一道分界的论题，与“该用‘对象’与‘属性’两个词指称分界哪一侧”的纯语义论题不同。此处关注的是形而上学问题：这样的对照究竟是否存在，而非哪个词表达它。
    step2: |-
      请看这些老生常谈：有事物，也有这些事物的种种样子（不妨把后者称为“属性”）。例如，似乎有高树，似乎也有那些树所具有的属性，如*高*。[^note-5] 事物与属性似乎都存在。那么，事物与属性之间也许有个重要区分；若有，它似乎标示出一道重要的*形而上学*分界。这道分界在极高抽象层次上运作，有望互斥而穷尽地把实在分为若干范畴：树木、人、行星落在*事物*之下，*绿*、*高*、*痒*、*善良*落在*属性*之下。须指出，存在这样一道分界的论题，不同于“该用‘对象’与‘属性’指称分界哪一侧”的纯语义论题。此处关注的是形而上学问题：这种对照究竟是否存在，而非哪个词表达它。
