      Existence Monism, chiefly sponsored in recent times by Horgan and Potrč, says that there is exactly one object.[^note-18] (Or at least, exactly one concrete object, or one concrete physical object.) The one thing (which Horgan and Potrč call ‘the blobject’) is huge, and very complex, though it does not have any parts. Rather, it has different properties in various spatiotemporally local ways (2008: 177–178).
    step1: |-
      存在一元论——晚近主要由 Horgan 与 Potrč 倡导——主张恰好只有一个对象。[^note-18]（或者至少：恰好只有一个具体对象，或一个具体的物理对象。）那唯一之物（Horgan 与 Potrč 称之为“块体”，blobject）极其巨大且极其复杂，但它没有任何部分，毋宁说它以种种时空局部的方式具有不同属性（2008: 177–178）。
    step2: |-
      存在一元论——晚近主要由 Horgan 与 Potrč 倡导——主张恰好只有一个对象。[^note-18] 或者至少：恰好只有一个具体对象，或一个具体的物理对象。那唯一之物（他们称之为“块体”，blobject）极其巨大、极其复杂，却没有任何部分，毋宁说它以种种时空局部的方式具有不同属性（2008: 177–178）。
