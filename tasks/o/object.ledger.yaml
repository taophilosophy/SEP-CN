    kind: body
    source: |-
      The final view of the object/property contrast to consider is the view that properties are instantiated, and objects are not. This is, as it were, a metaphysical correlate of the linguistic view discussed in §1.2.1. and enjoys similar motivations. *Instantiation* is generally taken as primitive, but some things can be said about it. On one view, it’s a two-place relation (see entry on relations), and the relata are an object and a property, or a property and a property. On another view, it’s a “non-relational tie” that “glues” properties to objects and other properties (see, e.g., Strawson 1959)[^strawson-1959]. Objects can only be the things that instantiate; they cannot be instantiated. Properties, by contrast, can both instantiate and be instantiated.[^note-13]
    step1: |-
      对象/属性对照的最后一说是：属性可被实例化，对象则不能。这可以说是 §1.2.1 所论语言观点的形而上学对应物，动机也相似。*实例化*通常被视为初始项，但仍可说上几句。一种看法认为它是二元关系（见“关系”词条），关系项是一个对象与一个属性，或一个属性与一个属性。另一种看法认为它是“非关系性的联结”，把属性“粘”到对象与其他属性上（例如见 Strawson 1959）[^strawson-1959]。对象只能是实例化者，不能被实例化；属性则相反，既能实例化，也能被实例化。[^note-13]
    step2: |-
      对象/属性对照的最后一说是：属性可被实例化，对象则不能。这可以说是 §1.2.1 那个语言观点的形而上学对应物，动机也相似。*实例化*通常被看作初始项，但仍可说上几句。一种看法认为它是二元关系（见“关系”词条），关系项是对象与属性，或属性与属性。另一种看法认为它是“非关系性的联结”，把属性“粘”到对象与其他属性上（如见 Strawson 1959）[^strawson-1959]。对象只能是实例化者，不能被实例化；属性则相反，既能实例化，也能被实例化。[^note-13]
