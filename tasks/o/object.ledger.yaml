      According to the bundle theory, objects are bundles of properties. Different theories of properties will make for different versions of the bundle theory. The most common theories of properties for bundle theorists to hold are trope theory (see entry on tropes) and immanent universals.
    step1: |-
      按束理论，对象是属性的束。不同的属性理论会造就不同版本的束理论。束论者最常持有的属性理论，是特普论（见“特普”词条）与内在共相论。
    step2: |-
      按束理论，对象是属性的束。不同的属性理论造就不同版本的束理论；束论者最常持有的属性理论，是特普论（见“特普”词条）与内在共相论。
  - id: 142
    kind: body
    source: |-
      On the immanent universal version of the bundle theory, objects are bundles of universals, and those universals are located in space and time. When some universals are compresent, however compresence is to be understood (and perhaps when some other condition is satisfied), there is an object that is the bundle of those universals. (For some bundle theorists, not just any group of immanent universals forms a bundle.) The way it’s often put is that objects are bundles of *coinstantiated* universals, where the coinstantiation relation may be a primitive relation.[^note-27]
    step1: |-
      在束理论的内在共相版中，对象是共相的束，而这些共相定位于时空之中。当某些共相共存——无论“共存”该怎样理解（或许还须满足其他条件）——就有一个对象，即这些共相的束。（对某些束论者来说，并非任意一组内在共相都构成束。）常见的说法是：对象是*被共同实例化*的共相的束，其中共同实例化关系可以是初始关系。[^note-27]
    step2: |-
      在束理论的内在共相版中，对象是共相的束，而共相定位于时空之中。当某些共相共存——无论“共存”怎样理解（或许还须满足其他条件）——便有一个对象，即这些共相的束。（对某些束论者来说，并非任意一组内在共相都构成束。）常见的说法是：对象是*被共同实例化*的共相的束，其中共同实例化关系可以是初始关系。[^note-27]
