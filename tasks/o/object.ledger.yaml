      > It is interesting to notice that a separate-realm theory of universals permits of a blob as opposed to a layer-cake view of particulars. For on this view, what is it for a thing to have a property? It is not the thing’s having some internal feature, but rather its having a relationship, the instantiation relationship, to certain universals or Forms in another realm. The thing itself could be bloblike. (Armstrong 1989: 76–77)[^armstrong-1989]
    step1: |-
      > 有趣的是，共相的分离领域理论容许对殊相持团块观而非层叠蛋糕观。因为按此观点，一个东西具有属性是怎么回事？不是它具有某种内部特征，而是它与另一领域中的某些共相或形式具有一种关系，即实例化关系。这东西本身可以是团块状的。（Armstrong 1989: 76–77）[^armstrong-1989]
