    source: |-
      These three examples isolate highly abstract or general roles—being an object of reference, being quantified over, or being thought of. These roles are specified, as it were, by form rather than content; the roles alone impose very few limitations or requirements on the kinds of things that fill them. Plausibly, for example, both concrete material objects and abstract propositions alike might satisfy any of these roles. These three examples involve roles specified in part by connection to thought or language. But these connections may be severed. We might, for example, specify the object role as being a bearer of properties (this would be a natural extension of the view discussed in 1.2.7, or a non-linguistic extension of the view discussed in 1.2.1).
    step1: |-
      这三例孤立出高度抽象或普遍的角色——作为指称的对象、作为量化对象、被思考。可以说，这些角色是由形式而非内容来限定的；单凭角色，对填充它们的物类施加的限制或要求极少。例如，具体物质对象与抽象命题都可能满足其中任一角色。这三例所涉角色，部分地通过与思想或语言的关联来限定。但这些关联可以切断。例如，我们可以把对象角色限定为属性的承担者（这会是 1.2.7 所论观点的自然延伸，或是 1.2.1 所论观点的非语言延伸）。
    step2: |-
      这三例孤立出高度抽象或普遍的角色——作为指称的对象、作为量化对象、被思考。可以说，这些角色由形式而非内容限定；单凭角色，对填充它们的物类施加的限制极少。例如，具体物质对象与抽象命题都可能满足其中任一角色。这三例所涉角色，都部分地依靠同思想或语言的关联来限定，而这些关联可以切断。例如，可把对象角色限定为属性的承担者：这会是 1.2.7 所论观点的自然延伸，或是 1.2.1 所论观点的非语言延伸。
  - id: 124
    kind: body
    source: |-
      And each role suggests, in turn, a theory of what objects are: (i) to be an object just is to be a referent, (ii) to be an object just is to be quantified over, and (iii) to be an object just is to be an object of thought.[^note-24] van Inwagen offers a version of (i) here (note the use of “can” indicating that it is a *modal* role that objects play, namely being possible referents; we here presuppose the already mentioned tight connection between ‘object’ and ‘thing’):
    step1: |-
      每个角色又各自提示一种“对象是什么”的理论：（i）成为对象就是成为指称物，（ii）成为对象就是充当量化对象，（iii）成为对象就是成为思想的对象。[^note-24] van Inwagen 在此给出（i）的一个版本（注意“可以”一词表明对象所扮演的是*模态*角色，即可能作为指称物；这里我们预设了前已提及的“对象”与“物”之间的紧密联系）：
