      Perhaps there is a particular shade of red that no object has right now, but some objects had and other objects will have. If there is such a shade of red—if it didn’t go out of existence when the last object that had it stopped having it—one naturally wonders where it is. And a natural answer is that it isn’t (and has never been nor ever will be) anywhere. More generally, universals are nowhere. Objects, by contrast, are somewhere; they are to be found within space and time, and in this respect stand in stark and categorial contrast to universals.[^note-8]
    step1: |-
      或许有一种红，此刻没有任何对象具有它，但有些对象曾具有、另一些对象将会具有。若有这样一种红——若它并未因最后一个具有它的对象不再具有它而随之消失——人们自然会问：它在何处？自然的回答是：它不在任何地方（也从未在、永远不会在任何地方）。更一般地说，共相不在任何地方。对象则相反，在某个地方：它们见于时空之中，就此而言与共相构成鲜明而范畴性的对照。[^note-8]
    step2: |-
