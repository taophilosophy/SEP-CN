  - id: 165
    kind: body
    source: |-
      On class nominalism, properties are classes of things or classes of possible things. The property *being green* is the class of all green things, the property *being wise* is the class of all wise things, the relation *is the sister of* is the class of ordered pairs the first member of which is the sister of the second member, and so on. [^note-35]
    step1: |-
      按类唯名论，属性是事物之类或可能事物之类。*绿*这个属性是一切绿物的类，*智慧*这个属性是一切智慧者的类，*是……的姐妹*这个关系是有序对的类，其中第一个成员是第二个成员的姐妹，如此等等。[^note-35]
    step2: |-
      按类唯名论，属性是事物之类或可能事物之类：*绿*即一切绿物之类，*智慧*即一切智慧者之类，*是……的姐妹*即有序对之类（第一项是第二项的姐妹），如此等等。[^note-35]
  - id: 166
    kind: body
    source: |-
      For an object to have (or exemplify, or instantiate, or whatever) a property, on this view, is for it to belong to a class of things. Class membership, like set membership, is an external relation; so class nominalism sits best with a blob view of objects. van Inwagen explains this connection as follows:
    step1: |-
      按此观点，对象具有（或例示、或实例化，或随你怎么说）一个属性，就是它属于某个事物之类。类属关系如同集合的成员关系，是外在关系；因此类唯名论最契合团块式对象观。van Inwagen 这样解释这一联系：
    step2: |-
      按此观点，对象具有（或例示、或实例化，随你怎么说）一个属性，就是指它属于某个事物之类。类属关系如同集合的成员关系，是外在关系；类唯名论因此最契合团块式对象观。van Inwagen 这样解释这一联系：
  - id: 167
    kind: body
    source: |-
      > According to Lewis [a class nominalist], a property is a set of possible objects. (Something is a property if and only if it is a set all of whose members are possible objects.) The property of being a pig or porcinity, Lewis says, is simply the set of all possible pigs—a set far larger than the set of actual pigs. Consider an actual pig, Freddy. Freddy of course has porcinity. And what is this relation “having” that holds between the pig and the property? Why, simply set-membership. And the relation that a set of possibilia bears to its individual members is certainly not constituency. Freddy is no doubt in some sense a constituent of the set of all possible pigs—‘constituent’ is a very flexible word, and it is probably flexible enough to permit that application —, but there is no conceivable sense in which the set of all possible pigs is a constituent of Freddy. (2011: 392–393)
    step1: |-
      > 按刘易斯［一位类唯名论者］，属性是可能对象的集合。（某物是属性，当且仅当它是一个集合，其所有成员都是可能对象。）刘易斯说，猪性或猪之所以为猪的属性，就是一切可能猪的集合——这个集合远比现实猪的集合大。设想一头现实中的猪，弗雷迪。弗雷迪当然具有猪性。而猪与属性之间的这种“具有”关系是什么？无非是集合成员关系。而可能物集合与其个别成员之间的关系，当然不是构成关系。弗雷迪无疑在某种意义上是一切可能猪之集合的构成成分——“构成成分”是个极富弹性的词，弹性大概足以容许这种用法——但无论怎样设想，一切可能猪的集合都不可能是弗雷迪的构成成分。（2011: 392–393）
    step2: |-
      > 按刘易斯［一位类唯名论者］，属性是可能对象的集合。（某物是属性，当且仅当它是一个集合，其所有成员都是可能对象。）刘易斯说，猪性（猪之所以为猪的那个属性）就是一切可能猪之集合——远比现实猪之集合大。设想一头现实中的猪，弗雷迪。弗雷迪当然具有猪性。猪与属性之间的这种“具有”关系是什么？无非是集合成员关系。可能物集合与其个别成员之间的关系，当然不是构成关系。弗雷迪无疑在某种意义上是一切可能猪之集合的构成成分——“构成成分”极富弹性，大概足以容许这种用法。但无论怎样设想，一切可能猪之集合都不可能是弗雷迪的构成成分。（2011: 392–393）
