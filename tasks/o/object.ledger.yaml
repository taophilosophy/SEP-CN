      ## 1. Contrast
    step1: |-
      ## 1. 对照
    step2: |-
      ## 1 对照
  - id: 7
    kind: body
    source: |-
      The *Contrast Question*, as we shall call it, is this: what, if any, is the contrast or complement of the category *object*? With what, exactly, are objects to be contrasted? Put differently, are there non-objects, and if so, what kinds of things are they? Some related questions: if there are non-objects, do they form a natural class or collection? What might that class or collection be?
    step1: |-
      我们所谓的*对照问题*（Contrast Question）是：*对象*范畴若有对照项或补项，那是什么？对象究竟该与什么相对照？换个说法：是否存在非对象？若存在，它们是哪类东西？一些相关问题：若有非对象，它们是否构成一个自然的类或集合？那个类或集合可能是什么？
    step2: |-
      我们所谓的*对照问题*（Contrast Question）是：*对象*范畴若有对照项或补项，那是什么？对象究竟该与什么相对照？换个说法：是否存在非对象？若存在，它们又是哪类东西？由此还可追问：非对象是否构成一个自然的类或集合？那个类或集合可能是什么？
  - id: 8
    kind: body
    source: |-
      ### 1.1 No Contrast: the Umbrella View
    step1: |-
      ### 1.1 无对照：伞状观
    step2: |-
      ### 1.1 无对照：伞状观
  - id: 9
    kind: body
    source: |-
      On one natural reading, the Contrast Question admits of an easy answer; fix—perhaps by stipulation—the content of ‘object’ and it will be obvious whether there are non-objects. Unsurprisingly, then, some philosophers suppose that there is a fully general category and simply *define* ‘object’ as picking it out. On this *Umbrella View*, as we shall call it, *every thing* is an object (perhaps by definition of ‘object’) and the category has no contrast—or, if it has a contrast or complement, the contrast is unfilled and the complement unrealized.
    step1: |-
      一种自然的读法是，对照问题有一个轻易的答案：把“对象”的内容固定下来——或许靠约定——是否有非对象便一目了然。于是，一些哲学家设想存在一个彻底普遍的范畴，并径直 *定义* “对象”为指称该范畴的词，并不奇怪。按我们所谓的*伞状观*（Umbrella View），*万物*都是对象（或许依“对象”之定义如此），该范畴没有对照项；或者，即使它有对照项或补项，对照项也是空的，补项也不曾实现。
    step2: |-
      一种自然的读法：对照问题有个轻易的答案。把“对象”的内容固定下来——或许靠约定——是否有非对象便一目了然。于是，一些哲学家设想存在一个彻底普遍的范畴，并径直 *定义* “对象”为指称该范畴的词，并不奇怪。按我们所谓的*伞状观*（Umbrella View），*万物*都是对象（或许依“对象”之定义如此），该范畴没有对照项；或者，即便它有对照项或补项，对照项也是空的，补项也不曾实现。
  - id: 10
    kind: body
    source: |-
      Is the Umbrella View *true*? Dispute here may appear merely verbal, to merely concern how to use the word ‘object’.[^note-3] This is not quite right, however. So to clarify: the Umbrella View involves both a substantive metaphysical thesis and a semantic thesis. The metaphysical thesis is that there is a maximally general ontological category under which all things fall. The semantic thesis is that ‘object’—perhaps as a matter of stipulation—picks out this maximally general category. Disputes over the Umbrella View, then, are *merely verbal in part.* They are merely verbal insofar as they concern the semantic thesis. But disputes over the metaphysical thesis need not be—and in our view are not—merely verbal; they do not concern the English word ‘object’, but rather concern the existence and extent of a wholly general ontological category.
    step1: |-
      伞状观*为真*吗？此处的争论可能显得只是言辞之争，只关乎如何使用“对象”一词。[^note-3] 然而这并不完全正确。要澄明：伞状观包含一个实质性的形而上学论题与一个语义论题。形而上学论题是：存在一个最大普遍的、万物皆落在其下的本体论范畴。语义论题是：“对象”——或许凭约定——指称这个最大普遍的范畴。因此，围绕伞状观的争论*部分是*言辞之争：就语义论题而言，确属言辞之争；但就形而上学论题而言，则不必如此——在我们看来也并非如此。它们不关乎英文词“object”，而关乎一个全然普遍的范畴是否存在、范围如何。
    step2: |-
      伞状观*为真*吗？此处的争论可能显得只是言辞之争，只关乎如何使用“对象”一词。[^note-3] 这并不完全正确。伞状观含两个论题：一个实质性的形而上学论题，一个语义论题。形而上学论题是：存在一个最大普遍的、万物皆落在其下的本体论范畴。语义论题是：“对象”——或许凭约定——指称这个最大普遍的范畴。因此，围绕伞状观的争论*部分是*言辞之争：就语义论题而言确属如此；但形而上学论题上的争论则不必如此——在我们看来也并非如此：它不关乎英文词“object”，而关乎一个全然普遍的范畴是否存在、范围如何。
  - id: 11
    kind: body
    source: |-
      Note, too, that the component theses of the Umbrella View are logically independent. First, the semantic thesis does not entail the metaphysical thesis any more than the semantic thesis that ‘God’—by definition—picks out a maximally great being entails the metaphysical thesis that there is indeed such a being. Second, the metaphysical thesis does not entail the semantic thesis; that there is a maximally general category does not entail that it is picked out by any word at all, much less the English word ‘object’.
    step1: |-
      还要注意，伞状观所含的两个论题在逻辑上彼此独立。第一，语义论题并不蕴含形而上学论题，正如“上帝”——依定义——指称一个最大伟大存在者这一语义论题，并不蕴含确实存在这样一个存在者的形而上学论题。第二，形而上学论题也不蕴含语义论题：存在一个最大普遍的范畴，并不蕴含有任何词指称它，更不用说英文词“object”。
    step2: |-
      还要注意，伞状观所含的两个论题在逻辑上彼此独立。第一，语义论题并不蕴含形而上学论题，正如“上帝”——依定义——指称最大伟大存在者，并不蕴含确实存在这样一个存在者。第二，形而上学论题也不蕴含语义论题：存在一个最大普遍的范畴，并不蕴含有任何词指称它，更不用说英文词“object”。
  - id: 12
    kind: body
    source: |-
      A consequence of the Umbrella View is that items that appear to have little in common—universals, particulars, gods, books, possibilities, colleges, works of music (if such there are)—are in fact all united under one category: *object*.
    step1: |-
      伞状观的一个后果是：那些看似鲜有共同之处的东西——共相、殊相、诸神、书籍、可能性、学院、音乐作品（若确有此类东西）——其实都统摄于一个范畴之下：*对象*。
    step2: |-
      伞状观的一个后果是：那些看似鲜有共同之处的东西——共相、殊相、诸神、书籍、可能性、学院、音乐作品（若确有此类东西）——其实都统摄于同一范畴：*对象*。
