      So it seems that things are often composed of other things. But under what conditions does composition occur? van Inwagen (1990) calls this ‘The Special Composition Question’ (hereafter ‘the SCQ’). More precisely, the SCQ calls for filling in for Φ in the following sentence: For any *x*s, there exists a *y* such that the *x*s compose *y* iff Φ. An answer must be non-analytic and must have only ‘the *x*s’ free.[^note-21]
    step1: |-
      于是，事物常常由其他事物构成。但组合在什么条件下发生？van Inwagen（1990）称之为“特殊组合问题”（下称 SCQ）。更确切地说，SCQ 要求补足下句中的 Φ：对任意 *x*，存在一个 *y*，使得这些 *x* 构成 *y*，当且仅当 Φ。答案须是非分析性的，且只有“这些 *x*”是自由的。[^note-21]
    step2: |-
      事物因此常由其他事物构成。但组合在什么条件下发生？van Inwagen（1990）称之为“特殊组合问题”（下称 SCQ）。更确切地说，SCQ 要求补足下句中的 Φ：对任意这些 *x*，存在一个 *y*，使得这些 *x* 构成 *y*，当且仅当 Φ。答案须非分析，且只有“这些 *x*”是自由的。[^note-21]
  - id: 112
    kind: body
    source: |-
      Here are some candidate answers to the SCQ. Contact: ‘the *x*s are in contact’. Life: ‘the *x*s are caught up in a life’. Mereological Nihilism: ‘there is only one of the *x*s’. Mereological Universalism: ‘the *x*s are one or more in number’.
    step1: |-
      以下是一些候选答案。接触：“这些 *x* 相互接触。”生命：“这些 *x* 被纳入一个生命过程。”分子论虚无主义：“这些 *x* 只有一个。”分子论普遍主义：“这些 *x* 的数目为一个或更多。”
    step2: |-
      以下是一些候选答案。接触说：“这些 *x* 相互接触。”生命说：“这些 *x* 被纳入一个生命。”分子论虚无主义：“这些 *x* 只有一个。”分子论普遍主义：“这些 *x* 的数目为一个或更多。”
  - id: 113
    kind: body
    source: |-
      Anyone who denies the Umbrella View and who has an answer to the SCQ can consider that as a partial answer to the Extension Question. What objects are there? Contact says that there are the *x*s, and for any *x*s that are in contact, there’s another object (the one that’s composed of them). Life says that there are the *x*s, and for any *x*s that are caught up in a life, there’s another object (the one that’s composed of them). Mereological Nihilism says that there are just the *x*s, and no other objects. Mereological Universalism says that there are the *x*s, for any *x*s at all (no matter how they are arranged), there’s another object (the one that’s composed of them). And so on for other answers.
    step1: |-
      否认伞状观、又对 SCQ 有答案的人，可以把它看作对外延问题的部分回答。有哪些对象？接触说：存在这些 *x*，且对任意相互接触的 *x*，还有一个对象（由它们构成的那个）。生命说：存在这些 *x*，且对任意被纳入一个生命的 *x*，还有一个对象（由它们构成的那个）。分子论虚无主义说：只有这些 *x*，没有其他对象。分子论普遍主义说：存在这些 *x*，且对任意 *x*（无论怎样排列），还有一个对象（由它们构成的那个）。其他答案依此类推。
    step2: |-
      否认伞状观、又对 SCQ 有答案的人，可把它看作对外延问题的部分回答。有哪些对象？接触说：存在这些 *x*，且对任意相互接触的 *x*，还有一个对象（由它们构成者）。生命说：存在这些 *x*，且对任意被纳入一个生命的 *x*，还有一个对象（由它们构成者）。分子论虚无主义说：只有这些 *x*，别无对象。分子论普遍主义说：存在这些 *x*，且对任意 *x*（无论怎样排列），还有一个对象（由它们构成者）。其他答案依此类推。
