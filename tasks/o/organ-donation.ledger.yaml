      Families in many jurisdictions have at least the de facto power to veto retrieval from the deceased, even those who adamantly wanted to donate their organs. Does this power not give excessive weight to the interests of families as against the interests of both the deceased and potential recipients (Liberman 2015; Zambrano 2017)[^liberman-2015][^zambrano-2017]?
