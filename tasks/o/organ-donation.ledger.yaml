      *Kidney exchange*. Sometimes potential live kidney donors cannot donate to the recipients they wish because their kidneys are incompatible with the recipient’s body. Many systems now arrange complicated swaps whereby pairs or more than pairs of live donors give to each other’s recipients (Fortin 2013)[^fortin-2013]. Sometimes people donate into the general pool in exchange for their preferred recipient getting the next available deceased donor kidney. Unless the preferred recipients would happen to get the deceased donor organ anyway under normal allocation rules, they jump the queue. As with more common methods of live donation, the normal allocation principles are suspended so as not to forgo extra organs.
    step1: |-
      *肾脏交换*。有时潜在活体肾捐献者无法捐给自己希望捐给的人，因为其肾脏与接受者身体不相容。许多系统现在安排复杂的交换：成对或更多对的活体捐献者互相捐给对方的接受者（Fortin 2013）[^fortin-2013]。有时人们捐入公共池，以换取自己偏好的接受者得到下一个可用的死者捐献肾脏。除非偏好的接受者按正常分配规则本来也会得到那个死者器官，否则他们就插了队。与更常见的活体捐献方式一样，正常分配原则被悬置，以免失去额外的器官。
