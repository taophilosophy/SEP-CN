  - id: 29
    kind: body
    source: |-
      According to some, an important cause of family refusal of organ retrieval is uncertainty about the wishes of the deceased. Families that do not know what their relatives wanted often default to “no” (den Hartogh 2008a)[^hartogh-2008a]. To avoid the default, some writers would encourage people to decide about donation in a way others will know, for instance by paying them (De Wispelaere and Stirton 2010) and others suggest mandating choice by, for instance, withholding driving licenses from those who do not choose. The suggestion is not, or not in all cases, that people be steered into agreeing to donate or penalized if they refuse. It is that people be steered to make clear choices, yes or no.
    step1: |-
      在某些人看来，家属拒绝器官获取的一个重要原因，是不确定死者的意愿。不知道亲属想要什么的家庭，往往默认选择“不”（den Hartogh 2008a）[^hartogh-2008a]。为避免这种默认，一些论者主张鼓励人们以他人能够知晓的方式就捐献作出决定，例如付钱给他们（De Wispelaere and Stirton 2010）；另一些人则建议强制选择，例如对不作选择者不予发放驾照。这些建议并不是（或并不总在）引导人们同意捐献、或在拒绝时予以惩罚，而是引导人们作出明确的“是”或“否”的选择。
    step2: |-
      在某些人看来，家属拒绝器官获取的一个重要原因，是不清楚死者想要什么。不知道亲属意愿的家庭，往往默认选“不”（den Hartogh 2008a）[^hartogh-2008a]。为避免这种默认，一些论者主张鼓励人们以他人能知晓的方式就捐献作出决定，比如付钱给他们（De Wispelaere and Stirton 2010）；另一些人则建议强制选择，比如对不作选择的人不发驾照。这些建议并不是（至少不总是）要把人引向同意捐献、或在拒绝时加以惩罚，而是要引导人作出明确的“是”或“否”。
