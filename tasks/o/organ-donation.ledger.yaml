      It is not clear how common it is for families to override the known wishes to donate of their deceased relative. Some writers argue that it is rare (e.g. McCall, 2006); another study found an override rate of 11.7% in the UK (Morgan et al 2018)[^morgan-2018]. In reading evidence, one should consider what counts as a ‘known wish’. The family might, for instance, believe that a casually filled in request on a driver licence application some years earlier did not amount to ‘known wishes’. In any case, it seems unlikely that many people would want to donate no matter how upset their families were, so allowing families to veto retrieval is unlikely to be against the all-things-considered wishes of many of the deceased.
    step1: |-
      家属推翻已故亲属已知捐献意愿的情况有多常见，并不清楚。一些论者认为这种情况很少（如 McCall, 2006）；另一项研究发现，英国的发生率为 11.7%（Morgan et al 2018）[^morgan-2018]。解读证据时，应当考虑什么才算“已知意愿”。例如，家属可能认为，多年前在驾照申请表上随手填写的一项请求，算不上“已知意愿”。无论如何，很少有人会不顾家属多么痛苦仍坚持捐献，因此允许家属否决获取，不太可能违背许多死者经过通盘考虑的意愿。
    step2: |-
      家属推翻已故亲属已知捐献意愿的情况有多常见，并不清楚。一些论者认为这种情况很少（如 McCall, 2006）；另一项研究发现，英国的发生率为 11.7%（Morgan et al 2018）[^morgan-2018]。解读证据时，得先想清楚什么才算“已知意愿”。比如，家属可能认为，多年前在驾照申请表上随手填的一笔，算不上“已知意愿”。无论如何，很少有人会不顾家属多么痛苦仍坚持捐献，因此允许家属否决获取，不太可能违背许多死者通盘考虑后的意愿。
