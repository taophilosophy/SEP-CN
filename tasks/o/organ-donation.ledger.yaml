      A version of objection (c) applies to an opposite policy proposal: that *higher* priority should be given to patients with *high* social value. This “social value” could either be instrumental (doctors, nurses, parents of young children perhaps) or moral (prioritising the virtuous). The fundamental objection to rewarding social value is that it infringes a principle of equal treatment but, putting that aside, it has the practical and fairness problems of the punishment proposal. How is social value to be determined and then how is it to be applied in a timely and cost-effective manner? And, given the potentially dire consequences of being assigned low social value (which could in practice be a “death sentence”), procedurally it seems reasonable to expect something akin to a court hearing. A version of allocating according to perceived social value (among other criteria) was tried in Seattle in the 1960s in allocating very scarce dialysis (Alexander 1962)[^alexander-1962]. The result seems to have removed any enthusiasm among transplant systems for trying it again.
    step1: |-
      反对意见（c）的一个版本适用于一项相反的政策提议：应给予*社会价值高*的患者*更高*的优先级。这种“社会价值”可以是工具性的（医生、护士，或许还有幼童的父母），也可以是道德性的（优先奖赏有德者）。反对奖励社会价值的根本理由在于它侵犯了平等对待原则；但暂且不谈这一点，它也有与惩罚提议相同的实践与公平问题。社会价值如何确定？确定后又如何以及时、低成本的方式应用？而且，鉴于被判定社会价值低可能带来严重后果（实践中可能等于“死刑判决”），从程序上说，似乎有理由期待某种类似法庭听证的东西。20 世纪 60 年代，西雅图在分配极稀缺的透析资源时，曾试行过一种按人们所认为的社会价值（以及其他标准）来分配的方案（Alexander 1962）[^alexander-1962]。其结果似乎让移植系统彻底失去了再试一次的兴致。
