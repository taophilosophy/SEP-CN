      The suspension of normal allocation principles when live donation is involved often passes by without notice, although one exception is a debate over people on transplant waiting lists who use social media campaigns to find willing donors (Moorlock 2015; Moorlock and Draper 2018)[^moorlock-2015][^moorlock-2018]. Such cases are a good illustration of the shape of the underlying issue. If these donors were merely being redirected – that is, if they were intending to donate anyway, even without a social media campaign – then arguably suspending the normal principles would be tantamount to unfair queue jumping via what has been termed a “beauty contest”. But if these social media campaigns bring new donors and extra organs into the system, and provided that other ethical conditions are met (notably the valid consent of the donor), then it would seem churlish to reject such offers, given their capacity to extend and/or improve recipients’ lives.
    step1: |-
      涉及活体捐献时对正常分配原则的悬置，往往不声不响地就过去了；一个例外是关于移植等待名单上的人利用社交媒体活动寻找自愿捐献者的争论（Moorlock 2015; Moorlock and Draper 2018）[^moorlock-2015][^moorlock-2018]。这类案例很好地说明了底层问题的形态。如果这些捐献者只是被重新引导——也就是说，即便没有社交媒体活动，他们本来也打算捐献——那么悬置正常原则可以说就等于通过所谓“选美比赛”不公平地插队。但如果这些社交媒体活动为系统带来新的捐献者和额外的器官，并且满足其他伦理条件（尤其是捐献者的有效同意），那么鉴于它们能够延长和/或改善接受者的生命，拒绝这样的捐献就显得小气了。
