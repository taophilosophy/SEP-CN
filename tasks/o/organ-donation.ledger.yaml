      Can people freely give consent when considering whether to donate to a close relative? It may be thought that consent in such a case is suspect because potential donors would be: (1) desperate to save their relatives (2) subject to a feeling of moral obligation or (3) subject to family pressure. The first two reasons are not good ones. People give valid consent in other desperate circumstances, for instance to a lifesaving operation, and acting out of a reasonable sense of moral obligation is a way of exercising one’s freedom rather than a constraint upon it (we consider below unusual senses of obligation in the context of religious stranger donation) (Radcliffe-Richards 2006; T.M. Wilkinson and Moore 1997)[^radcliffe-2006][^wilkinson-1997].
    step1: |-
      人在考虑是否捐给近亲时，能自由地给出同意吗？有人可能认为，这种情形下的同意可疑，因为潜在捐献者会：（1）拼命想救亲属；（2）觉得自己负有道德义务；或（3）受到家庭压力。前两个理由并不成立。人在其他绝望处境中也会给出有效同意，例如同意救命手术；出于合理的道德义务感行事，是行使自由的一种方式，而不是对自由的限制（下文将讨论宗教性陌生人捐献中不寻常的义务感）（Radcliffe-Richards 2006; T.M. Wilkinson and Moore 1997）[^radcliffe-2006][^wilkinson-1997]。
