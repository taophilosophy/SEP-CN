  - id: 1
    kind: body
    source: |-
      Organ transplantation raises difficult ethical questions about people’s claims to determine what happens to their bodies before and after death. What are these claims? What would it be to respect them? How should they fit with the claims of organ donors’ families or the needs of people whose own organs have failed? And then how should organs be allocated? Who should get priority and why? As with other topics in applied ethics, satisfactory answers require knowing the relevant facts, in this case about organ transplantation.
    step1: |-
      器官移植提出了棘手的伦理问题，涉及人们主张决定自己生前与死后身体遭遇的权利。这些主张是什么？尊重它们意味着什么？它们应当如何与器官捐献者家属的主张、或自身器官已衰竭者的需要相协调？还有，器官应当如何分配？谁应当获得优先，为什么？与应用伦理学的其他议题一样，令人满意的回答需要了解相关事实，在此即关于器官移植的事实。
    step2: |-
      器官移植提出了棘手的伦理问题：人对自己生前与死后的身体有何种主张？这些主张究竟是什么？尊重它们又意味着什么？它们该如何与器官捐献者家属的主张相协调，又该如何与自身器官已经衰竭者的需要相协调？进一步说，器官应当怎样分配？谁该优先，理由何在？与其他应用伦理学议题一样，要给出令人满意的回答，就得先掌握相关事实——就本题而言，即关于器官移植的事实。
  - id: 2
    kind: body
    source: |-
      In summary form, the following empirical claims about organ transplantation are widely accepted:
    step1: |-
      概括地说，以下关于器官移植的经验性主张已被广泛接受：
    step2: |-
      概括地说，以下关于器官移植的经验性主张已得到广泛接受：
  - id: 3
    kind: body
    source: |-
      1. Organ transplantation, particularly kidney transplantation, is a successful treatment for organ failure in many cases.
      2. Organ transplantation is cost-effective compared with other treatments for organ failure (Axelrod et al. 2018; Persad 2018 claims that transplantation is not cost-effective compared with life-saving treatments for other conditions besides organ failure)[^axelrod-2018].
      3. Most organ transplantation nowadays is routine, not experimental (Veatch and Ross 2015)[^veatch-2015]. The organs in question are the kidney, liver, heart, lung, pancreas, and intestine. This entry discusses only the “routine” cases, rather than ones which are unusual or experimental, such as transplantation of uteri or faces. Experimental ones raise additional questions, but these are more properly dealt with as part of the entry on the ethics of clinical research. (Bayefsky & Berman 2016; Freeman and Jaoudé 2007; Lotz 2018; O’Donovan, Williams, & S. Wilkinson 2019; Robertson 2016; Sandman 2018; S. Wilkinson & Williams 2015; Williams 2016)[^bayefsky-2016][^freeman-2007][^lotz-2018][^robertson-2016][^sandman-2018][^williams-2016].
      4. Transplant organs are often scarce. Many people who would benefit from receiving a transplant do not get one. Perhaps transplantation of other people’s organs will be superseded, for instance by growing new organs from stem cells, or making artificial organs, or using modified organs from other animals (xenotransplantation). None of these are yet ready for routine clinical use, although at the time of writing, xenotransplantation looks promising (*Economist* 2025)[^economist-2025].
    step1: |-
      1. 器官移植，尤其是肾移植，在许多情况下是治疗器官衰竭的成功手段。
      2. 与其他器官衰竭疗法相比，器官移植具有成本效益（Axelrod et al. 2018；Persad 2018 则主张，与器官衰竭之外其他疾病的救命疗法相比，移植并不具有成本效益）[^axelrod-2018]。
      3. 如今大多数器官移植都属常规手术，而非实验性手术（Veatch and Ross 2015）[^veatch-2015]。这里说的器官是肾、肝、心、肺、胰腺与肠。本词条只讨论“常规”病例，不涉及子宫移植、面部移植这类罕见或实验性病例。实验性移植会引出更多问题，但这些问题更适合放在临床研究伦理的词条中处理。（Bayefsky & Berman 2016; Freeman and Jaoudé 2007; Lotz 2018; O’Donovan, Williams, & S. Wilkinson 2019; Robertson 2016; Sandman 2018; S. Wilkinson & Williams 2015; Williams 2016）[^bayefsky-2016][^freeman-2007][^lotz-2018][^robertson-2016][^sandman-2018][^williams-2016]。
      4. 移植器官常常短缺。许多本可因接受移植而获益的人得不到移植。也许移植他人器官终将被取代，例如用干细胞培育新器官、制造人工器官，或使用经改造的其他动物器官（异种移植）。这些办法都尚未准备好进入常规临床使用，不过截至本文写作时，异种移植看来颇有希望（*Economist* 2025）[^economist-2025]。
    step2: |-
      1. 器官移植，尤其是肾移植，在许多情况下是治疗器官衰竭的成功手段。
      2. 与其他器官衰竭疗法相比，器官移植具有成本效益（Axelrod et al. 2018；Persad 2018 则主张，与器官衰竭之外其他疾病的救命疗法相比，移植并不具有成本效益）[^axelrod-2018]。
      3. 如今大多数器官移植都属常规手术，而非实验性手术（Veatch and Ross 2015）[^veatch-2015]。这里说的器官是肾、肝、心、肺、胰腺与肠。本词条只讨论“常规”病例，不涉及子宫移植、面部移植这类罕见或实验性病例。实验性移植会引出更多问题，但更适合放到临床研究伦理的词条里处理。（Bayefsky & Berman 2016; Freeman and Jaoudé 2007; Lotz 2018; O’Donovan, Williams, & S. Wilkinson 2019; Robertson 2016; Sandman 2018; S. Wilkinson & Williams 2015; Williams 2016）[^bayefsky-2016][^freeman-2007][^lotz-2018][^robertson-2016][^sandman-2018][^williams-2016]。
      4. 移植器官常常短缺。许多本可因接受移植而获益的人，最终排不上移植。也许移植他人器官终将被取代——比如用干细胞培育新器官、制造人工器官，或使用经改造的其他动物器官（异种移植）。这些办法都还没准备好进入常规临床使用；不过截至本文写作时，异种移植看来颇有希望（*Economist* 2025）[^economist-2025]。
