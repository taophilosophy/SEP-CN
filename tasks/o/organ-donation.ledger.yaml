    source: |-
      ## 1. Organ Retrieval from the Dead
    step1: |-
      ## 1. Organ Retrieval from the Dead
    step2: |-
      ## 1 从死者身上获取器官
  - id: 6
    kind: body
    source: |-
      The dead are the major sources of organs for transplantation. For a long time deceased donors came from those declared brain dead, that is, those who have irreversibly lost their brain function. In recent years, however, many donors have come from those who have died in the sense of circulatory death. Both donation after brain death and donation after circulatory death invite the important philosophical—not just medical—question “what is it to be dead”? (See the entry on the definition of death.)
    step1: |-
      死者是移植器官的主要来源。长期以来，已故捐献者都来自被宣布脑死亡的人，即不可逆地丧失脑功能的人。然而近年来，许多捐献者来自循环死亡意义上的死者。脑死亡后捐献与循环死亡后捐献都引出一个重要的哲学问题——而不只是医学问题：“死亡究竟是什么”？（见“死亡的定义”词条。）
    step2: |-
      死者是移植器官的主要来源。长期以来，已故捐献者都来自被宣布脑死亡的人，也就是不可逆地丧失脑功能的人。不过近年来，许多捐献者来自循环死亡意义上的死者。脑死亡后捐献与循环死亡后捐献都引出一个重要的哲学问题——而不只是医学问题：“死亡究竟是什么”？（见“死亡的定义”词条。）
  - id: 7
    kind: body
    source: |-
      Even though far more people die than require new organs, organs are scarce. Numerous factors affect the retrieval of organs from the dead. These include: the nature of people’s deaths (in only perhaps fewer than 1% of deaths can organs currently be taken, and countries vary according to the number of strokes, car crashes, shootings, and other causes of death that lend themselves to retrieval); the number of intensive care units (ICUs) (most donors die there and fewer ICUs makes for fewer donors); the medical factors that determine whether organs are retrieved successfully; the logistical factors that determine the efficient use of available organs; the extent of public awareness of transplantation; and the ethical-legal rules for consent that determine who is allowed to block or permit retrieval. Although most of these factors do not raise philosophical questions, it is important to realize that the main factor that does—the ethical-legal system for consent—is only one of many that affect retrieval rates, and nowhere near the most important at that. One should also bear in mind that the variety of factors plus unreliability or incomparability in statistics about retrieval mean that it is hard or impossible to have confidence in many of the causal claims about how consent rules affect retrieval rates.
    step1: |-
      尽管死亡人数远远多于需要新器官的人数，器官仍然短缺。影响从死者身上获取器官的因素很多，包括：死亡的性质（目前或许仅有不到 1% 的死亡可以获取器官，而各国因中风、车祸、枪击及其他便于获取器官的死因而异）；重症监护室（ICU）的数量（多数捐献者在 ICU 去世，ICU 越少，捐献者越少）；决定器官能否成功获取的医学因素；决定可用器官能否高效利用的后勤因素；公众对移植的认知程度；以及决定谁有权阻止或允许获取的同意伦理-法律规则。这些因素大多不涉及哲学问题，但有一点很重要：真正涉及哲学的主要因素——同意的伦理-法律体系——只是影响获取率的众多因素之一，而且远非最重要的因素。还应当记住，因素众多，加上获取统计数据不可靠或不可比，意味着对于“同意规则如何影响获取率”的许多因果主张，人们很难、甚至不可能抱有信心。
    step2: |-
      尽管死亡人数远远多于需要新器官的人数，器官仍然短缺。影响从死者身上获取器官的因素很多，包括：死亡的性质（目前或许仅有不到 1% 的死亡可以获取器官，而各国因中风、车祸、枪击及其他便于获取器官的死因而异）；重症监护室（ICU）的数量（多数捐献者死于 ICU，ICU 越少，捐献者越少）；决定器官能否成功获取的医学因素；决定可用器官能否高效利用的后勤因素；公众对移植的认知程度；以及规定谁有权阻止或允许获取的同意伦理-法律规则。这些因素大多不涉及哲学问题，但有一点很重要：真正涉及哲学的主要因素——同意的伦理-法律体系——只是影响获取率的众多因素之一，而且远非最重要的那一个。还应当记住，因素众多，加之获取统计数据既不可靠也不可比，意味着关于“同意规则如何影响获取率”的许多因果主张，人们很难、甚至不可能有信心。
  - id: 8
    kind: body
    source: |-
      This section explains the rules for consent as they operate in practice in most countries. It then outlines certain reform proposals, mentions the claims of the main affected parties, and, in the light of those claims, evaluates those reform proposals.
    step1: |-
      本节说明多数国家实践中通行的同意规则，随后概述若干改革方案，介绍主要相关方的主张，并依据这些主张评估各项改革方案。
    step2: |-
      本节说明多数国家实践中通行的同意规则，然后概述若干改革方案，介绍主要相关方的主张，并依据这些主张评估各项方案。
  - id: 9
    kind: body
    source: |-
      ### 1.1 Organ retrieval in practice
    step1: |-
      ### 1.1 Organ retrieval in practice
    step2: |-
      ### 1.1 实践中的器官获取
  - id: 10
    kind: body
    source: |-
      In nearly all countries with a transplantation program, the following is a broadly accurate description of organ retrieval in practice, although different countries, and regions of countries, do differ in nuanced ways, for instance in how the option of donation is presented to families; and the nuances may affect retrieval rates (Wilkinson 2011)[^wilkinson-2011].
    step1: |-
      在几乎所有开展移植项目的国家，以下描述大体准确地反映了器官获取的实践；不过不同国家以及一国之内的不同地区会有细微差别，例如向家属提出捐献选项的方式；这些细微差别也可能影响获取率（Wilkinson 2011）[^wilkinson-2011]。
    step2: |-
      在几乎所有开展移植项目的国家，下面这段描述大体准确地反映了器官获取的实践；当然，不同国家以及一国之内的不同地区会有细微差别，比如向家属提出捐献选项的方式；而这些差别也可能影响获取率（Wilkinson 2011）[^wilkinson-2011]。
  - id: 11
    kind: body
    source: |-
      1. If the deceased made a refusal known, either formally (e.g., on a register) or informally, organs will not be retrieved.
      2. If the family refuses, organs will not be retrieved.
      3. If the deceased is not known to have refused, suitable organs will be retrieved if the family agrees (some jurisdictions) or does not refuse (other jurisdictions).
    step1: |-
      1. 若死者曾以正式方式（如在登记册上）或非正式方式明确表示拒绝，则不获取器官。
      2. 若家属拒绝，则不获取器官。
      3. 若未获知死者曾拒绝，则在家属同意（部分法域）或家属不反对（另一些法域）的情况下，获取适合的器官。
    step2: |-
      1. 死者若曾明确表示拒绝——无论正式（如在登记册上）还是非正式——就不获取器官。
      2. 家属若拒绝，就不获取器官。
      3. 若未获知死者曾拒绝，则在家属同意（部分法域）或至少不反对（另一些法域）时，获取合适的器官。
  - id: 12
    kind: body
    source: |-
      The first point to make from this description is that nearly all countries have, in practice, a “double veto” system. Even if the family wants to donate, the deceased’s objection will veto retrieval. (The U.S. has partial exceptions discussed shortly.) The family’s veto is in many countries, such as the U.S., the U.K., and most nations of continental Europe, a creation of the medical profession (Wilkinson 2011, p.76)[^wilkinson-2011]. Doctors will not take organs from consenting dead people whose families object even though the law permits retrieval. In the words of the UK National Health Service's page on [Understanding Consent for Organ Donation](https://www.organdonation.nhs.uk/about-organ-donation/consent/#:~:text=Your%20family%20will%20always%20be,proceed%20if%20your%20family%20objects), “Your family will always be asked to support your decision before organ donation goes ahead, and clinicians will never proceed if your family object”.
    step1: |-
      从这一描述可以得到的第一点是：几乎所有国家在实践中都实行“双重否决”制度。即使家属愿意捐献，死者的反对也会否决获取。（美国有部分例外，下文将讨论。）在美国、英国以及欧洲大陆多数国家等许多国家，家属的否决权是医学界自行创设的（Wilkinson 2011, p.76）[^wilkinson-2011]。即使法律允许获取，医生也不会从家属反对的、本人同意捐献的死者身上取走器官。用英国国民保健署（NHS）[了解器官捐献同意](https://www.organdonation.nhs.uk/about-organ-donation/consent/#:~:text=Your%20family%20will%20always%20be,proceed%20if%20your%20family%20objects)网页的话说：“在器官捐献进行之前，总会征询你的家属是否支持你的决定；若家属反对，临床医生绝不会继续。”
    step2: |-
      从这段描述可以得到的第一点是：几乎所有国家在实践中都实行“双重否决”制度。即便家属愿意捐献，死者的反对也会否决获取。（美国有部分例外，下文再谈。）在美国、英国以及欧洲大陆多数国家等许多地方，家属的否决权其实是医学界自行创设的（Wilkinson 2011, p.76）[^wilkinson-2011]。法律允许获取，但只要家属反对，医生就不会从本人已同意捐献的死者身上取走器官。用英国国民保健署（NHS）[了解器官捐献同意](https://www.organdonation.nhs.uk/about-organ-donation/consent/#:~:text=Your%20family%20will%20always%20be,proceed%20if%20your%20family%20objects)网页的话说：“器官捐献进行之前，总会征询你的家属是否支持你的决定；家属若反对，临床医生绝不会继续。”
  - id: 13
    kind: body
    source: |-
      A lesson in method follows: when describing the practice of organ retrieval, looking at the law alone is inadequate.
    step1: |-
      由此可得一条方法论教训：描述器官获取的实践时，只看法律是不够的。
    step2: |-
      由此可以得出一条方法论上的教训：描述器官获取的实践时，只看法律远远不够。
  - id: 14
    kind: body
    source: |-
      A vital second point is that the consent of the deceased is not required before organs may be taken. (Japan was the last major exception to this and permitted retrieval without the deceased’s consent only from 2010 – Aita, 2011). When the deceased has not refused, the family’s agreement is enough to permit retrieval.
    step1: |-
      同样关键的第二点是：取走器官并不以死者同意为前提。（日本是最后一个主要例外，直到 2010 年才允许未经死者同意的获取——Aita, 2011。）只要死者未曾拒绝，家属同意就足以允许获取。
    step2: |-
      同样关键的第二点是：摘取器官并不以死者同意为前提。（日本是最后一个主要例外，直到 2010 年才允许未经死者同意的获取——Aita, 2011。）只要死者没有拒绝过，家属同意就足以放行。
  - id: 15
    kind: body
    source: |-
      ### 1.2 Proposals for reform
    step1: |-
      ### 1.2 Proposals for reform
    step2: |-
      ### 1.2 改革方案
  - id: 16
    kind: body
    source: |-
      The persistent scarcity of organs has given rise to several proposals to reform the system for consent. The main ones are:
    step1: |-
      器官长期短缺，催生了几项改革同意制度的方案。主要有：
    step2: |-
      器官长期短缺，催生出好几项改革同意制度的方案，主要有：
  - id: 17
    kind: body
    source: |-
      1. Encourage or mandate clearer choices by the deceased.
      2. End the family’s power of veto.
      3. Change defaults so that organs are taken except when the deceased formally objected.
      4. Conscript organs.
      5. Pay for organs.
    step1: |-
      1. 鼓励或强制死者作出更明确的选择。
      2. 废除家属的否决权。
      3. 改变默认规则：除死者正式表示反对外，一律获取器官。
      4. 征用器官。
      5. 为器官付费。
    step2: |-
      1. 鼓励或强制死者作出更明确的选择。
      2. 废除家属的否决权。
      3. 改变默认规则：除死者正式表示反对外，一律获取器官。
      4. 征用器官。
      5. 为器官付费。
  - id: 18
    kind: body
    source: |-
      (1)–(4) are discussed below; for (5), see the entry on the sale of human organs. Before evaluating the proposals, we describe the claims of the main affected parties. In determining what the rules for retrieval ought to be, three main claims are in play. These are the claims of the deceased, the deceased’s family, and potential recipients of organs. Transplant professionals have claims too, which are probably best thought of as matters of professional conscience, but these are not discussed further here.
    step1: |-
      第（1）至（4）项下文讨论；第（5）项见“人体器官买卖”词条。在评估这些方案之前，我们先描述主要受影响各方的主张。在确定获取规则应当如何时，有三种主要主张在起作用：死者的主张、死者家属的主张，以及潜在器官接受者的主张。移植专业人员也有自己的主张，或许最好把它们理解为职业良心问题，但这里不再讨论。
    step2: |-
      第（1）至（4）项留待下文；第（5）项见“人体器官买卖”词条。评估方案之前，先看主要受影响各方的主张。确定获取规则应当如何时，起作用的主要有三种主张：死者的主张、死者家属的主张，以及潜在器官接受者的主张。移植专业人员也有主张，或许最好视为职业良心问题，这里不再展开。
  - id: 19
    kind: body
    source: |-
      *The dead*. The “claims of the dead over their bodies” is almost invariably shorthand for “the claims of the living over their post-mortem bodies”, and that is how it will be understood here. While it is widely accepted that living people have strong claims over their own bodies, especially when it comes to vetoing invasions of their bodily integrity, it is much less widely accepted that the dead have such claims. Among the views that the dead have claims, we may distinguish between those which hold that events after death can harm the interests of the formerly-living and those which hold that it is only the fears and concerns of the living that have weight. Thus if it is asked why we should attach weight to a person’s refusal of organ retrieval, the first sort of view may say “because to take the organ of a person who refused damages his interest” and the second sort may say “because the anticipation of retrieval against his wishes will be bad for the living person”. The first sort of view is the subject of posthumous interests (see the entry on death).
    step1: |-
      *死者*。“死者对其身体的主张”几乎无一例外是“生者对其死后身体的主张”的简写，本文即按此理解。人们普遍接受生者对自己的身体有强有力的主张，尤其是在否决对其身体完整性的侵犯方面；但死者是否也有此类主张，远未得到同样广泛的接受。在认为死者有主张的各种观点中，可以区分两类：一类认为死后发生的事能够损害曾生者的利益；另一类认为只有生者的恐惧与关切才有分量。于是，若问我们为何要重视一个人对器官获取的拒绝，第一类观点会说“因为取走拒绝者的器官损害了他的利益”，第二类则会说“因为预料到器官会违背其意愿被取走，对生者不利”。第一类观点属于身后利益的问题（见“死亡”词条）。
