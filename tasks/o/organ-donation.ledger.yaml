      1. Unhealthy behavior such as excessive drinking, overeating, and smoking may well not be morally wrong nor merit punishment.
      2. If punishing wrongdoing is the purpose of the allocation exercise then there are probably more deserving candidates for punishment than those who overindulge (*even if* there is something morally wrong with such overindulgence).
      3. Using healthcare resource allocation as a mode of punishment is impracticable and unfair and may have adverse consequences (such as negative effects on public attitudes to organ donation and to doctors). Selecting only certain risky behavior as immoral seems arbitrary. Waiving that problem, how are judgments about causal and moral responsibility to be made in a timely and cost-effective way, and how are doctors going to make them? Punishment should only be meted out by state bodies (i) for prohibited acts (so not, in most countries, drinking, overeating, and smoking) and (ii) following “due process” in a court (Harris 1985)[^harris-1985].
    step1: |-
