      有人以文化为由主张由家属决策（Fan and Wang 2019）[^fan-2019]。在他们看来，优先考虑死者是一种不可接受的个人主义——要么在所有情况下都如此，要么在个人主义于文化上属异常的情况下如此（Boddington 1998）[^boddington-1998]。这类观点面临的困难之一是：如果个人主义是错的，为什么获取器官的决定应由一个个家庭来作，而不是按更广大共同体的利益来作？后者很可能要求违背家属意愿取走器官，以满足潜在接受者的需要。
