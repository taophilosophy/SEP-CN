      Suppose a person were prevented from donating an organ. On the one hand, the person would avoid the risks of physical harm. But, on the other, the person may suffer what are, in the medical literature, called “psychosocial harms”. These could include loneliness from losing a relative, having to act as caregiver to a person with organ failure, and survivor guilt. In philosophical terms, a person may also suffer vicarious harm. People whose welfare is intertwined with others suffer a loss when the other person does (Feinberg 1984; Raz 1986)[^feinberg-1984][^raz-1986]. Quite possibly, then, a person who donates may not suffer harm all-things-considered, that is, when all the different instances of harm are weighed up.
    step1: |-
      假设一个人被阻止捐献器官。一方面，此人避开了身体伤害的风险；但另一方面，此人可能遭受医学文献所说的“心理社会伤害”，包括失去亲属带来的孤独、不得不照料器官衰竭者，以及幸存者愧疚。用哲学的话说，一个人还可能遭受替代性伤害。福祉与他人交织在一起的人，在他人遭受损失时也会遭受损失（Feinberg 1984; Raz 1986）[^feinberg-1984][^raz-1986]。因此，一个捐献者很可能通盘考虑并未受到伤害，也就是说，把各种伤害实例都权衡之后并未受害。
    step2: |-
