      *Priority to children*. Nearly all jurisdictions give priority to children when allocating kidneys from deceased donors. One upshot seems to be a reduction in the overall supply of organs, at least in the United States (Axelrod et al. 2010)[^axelrod-2010]. People who would have been live donors to children do not donate when the children get rapid access to deceased donor kidneys. Perhaps potential living donors would rather have the child get a deceased donor organ than run the risk for themselves; perhaps they would like to hold their kidneys in reserve in case the children need retransplantation or other children need them. One might think that if priority to children reduces the number of living donors to them it should increase the number of living donors to adults. Nonetheless, the overall effect is negative. As before, those who endorse the principle of priority to children have some choosing to do; how many organs are they willing to forgo for the sake of the principle, and is the answer consistent with their willingness to accept designated live organ donations (T.M. Wilkinson and Dittmer 2016)[^wilkinson-2016][^wilkinson-2016-2]? A more unpalatable choice would arise if discriminating *against* children produced more organs via live donation.
    step1: |-
      *儿童优先*。几乎所有法域在分配死者捐献的肾脏时都给予儿童优先。一个后果似乎是器官总供应量减少，至少在美国是如此（Axelrod et al. 2010）[^axelrod-2010]。当儿童迅速获得死者捐献肾脏时，本来会成为儿童活体捐献者的人就不再捐献。也许潜在活体捐献者宁愿孩子得到死者器官，而不愿自己承担风险；也许他们想把肾脏留作储备，以备孩子需要再次移植或其他孩子需要。有人可能想：如果儿童优先减少了捐给儿童的活体捐献者，那应该会增加捐给成人的活体捐献者。然而总体效果仍是负面的。与前面一样，赞同儿童优先原则的人有些选择要做：为了这一原则，他们愿意舍弃多少器官？这个答案与他们愿意接受指定活体器官捐献是否一致（T.M. Wilkinson and Dittmer 2016）[^wilkinson-2016][^wilkinson-2016-2]？如果*歧视*儿童反而能通过活体捐献产生更多器官，那就会出现一个更令人不快选择。
    step2: |-
      *儿童优先*。几乎所有法域在分配死者捐献的肾脏时都让儿童优先。一个后果似乎是器官总供应量减少，至少在美国如此（Axelrod et al. 2010）[^axelrod-2010]。当儿童迅速得到死者捐献肾脏时，本来会成为儿童活体捐献者的人就不捐了。也许潜在活体捐献者宁愿孩子得到死者器官，也不愿自己承担风险；也许他们想把肾脏留着备用，以备孩子需要再次移植或其他孩子需要。有人可能想：儿童优先减少了捐给儿童的活体捐献者，该会增加捐给成人的活体捐献者吧。然而总体效果仍是负面的。与前面一样，赞同儿童优先原则的人得做些选择：为了这一原则，他们愿意舍弃多少器官？这个答案与他们愿意接受指定活体器官捐献是否一致（T.M. Wilkinson and Dittmer 2016）[^wilkinson-2016][^wilkinson-2016-2]？假如*歧视*儿童反而能通过活体捐献产生更多器官，那就会出现更令人为难的选择。
