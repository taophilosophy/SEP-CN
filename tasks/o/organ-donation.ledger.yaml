      To take one example, consider whether a member of a religious sect, such as the Jesus Christians, should be allowed to donate to a stranger (Scott, 2004). It may be thought that such a person could not be giving valid consent, perhaps because of what a sect has done (the “brainwashing” worry) or because of some psychological vulnerability. However, it is often difficult to decide whether a way of influencing someone is illegitimate or whether motivations and beliefs are signs of mental illness (see entry on mental disorder).
