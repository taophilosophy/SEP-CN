      Medical ethics traditionally instructs clinicians not to harm people. Taking organs from healthy people does seem to harm them, so living donor transplantation appears contrary to traditional medical ethics. One reply is to say that the “do no harm” rule is a relic of the medical profession’s paternalism; if people want to donate their organs and know what they are doing, why stop them (Veatch and Ross 2015)[^veatch-2015]? This reply raises the difficult problem, discussed below, of how far consent justifies harm. Another reply is to say that taking organs from willing living donors may not be all-things-considered harmful to them (Spital 2004)[^spital-2004]. This reply usually draws on one of the following normative views: (a) that living donation is only permissible when we expect the donor not to be harmed; or (b) that it is only permissible when we expect the donor to benefit (in both cases, all things considered, taking account of a wider range of factors than just physical wellbeing) (Williams 2018)[^williams-2018].
    step1: |-
      医学伦理传统上要求临床医生不伤害他人。从健康人身上取走器官，看起来确实伤害了他们，因此活体捐献移植似乎违背传统医学伦理。一种回应是：“不伤害”规则是医学界家长主义的遗物；如果人们想捐献器官，而且知道自己在做什么，为什么要阻止他们（Veatch and Ross 2015）[^veatch-2015]？这一回应引出下文讨论的难题：同意能在多大程度上为伤害提供正当性。另一种回应是：从自愿的活体捐献者身上取走器官，通盘考虑未必伤害他们（Spital 2004）[^spital-2004]。这种回应通常依赖以下规范观点之一：（a）只有当预期捐献者不会受到伤害时，活体捐献才被允许；或（b）只有当预期捐献者会获益时，才被允许（两种情形都作通盘考虑，纳入比身体健康更广的因素）（Williams 2018）[^williams-2018]。
