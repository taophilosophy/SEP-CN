      This proposal favors what is variously called “opt-out” or “presumed consent”. A “hard” version would take organs even when the deceased’s family objected (with all the problems mentioned in the previous sub-section); a “soft” version would allow the family to veto retrieval. The leading argument for opt-out claims that many people want to donate but through inertia do not get round to opting in. In an opt-out system, inertia would prevent them opting out so their organs could be taken and, since most people do want to donate, the deceased would be more likely to get what they want and more organs would be available (Johnson and Goldstein 2003)[^johnson-2003].
    step1: |-
      这一方案支持所谓的“选择退出”或“推定同意”。硬性版本即便家属反对也取走器官（上一小节提到的问题全都在）；软性版本则允许家属否决获取。支持选择退出的主要论证称：许多人想要捐献，却因惰性没有来得及选择加入。在选择退出制度下，惰性会阻止他们选择退出，因此器官可以被取走；又因为多数人确实想捐献，死者就更可能如愿，可用器官也会更多（Johnson and Goldstein 2003）[^johnson-2003]。
    step2: |-
      这一方案支持所谓的“选择退出”或“推定同意”。硬性版本即便家属反对也取走器官（上一小节提到的问题一个不少）；软性版本则允许家属否决获取。支持选择退出的主要论证称：许多人想捐献，却因惰性没来得及选择加入。而在选择退出制度下，惰性会让他们没能退出，器官因此可以被取走；又因为多数人确实想捐献，死者就更可能如愿，可用器官也会更多（Johnson and Goldstein 2003）[^johnson-2003]。
