      Many living donor programs use extensive psychosocial screening as well as a lengthy consent process (Price 2000)[^price-2000]. Potential donors are screened for physical health, which is largely uncontroversial, but they are also screened for their motivations. The typical advice is to screen for excessive sense of duty, undue influence, unconscious internal neurotic influences, and abnormal emotional involvement. Screening of this nature is more controversial since it involves making difficult judgments about what counts as excessive in a sense of duty, undue in influence, and abnormal in emotional involvement, and it requires spotting neurotic influences. At least in the past, some critics have thought that transplant professionals have overused their power to refuse people as donors (MacFarquhar 2009)[^macfarquhar-2009].
    step1: |-
      许多活体捐献项目除了冗长的同意流程，还进行广泛的心理社会筛查（Price 2000）[^price-2000]。潜在捐献者要接受身体健康筛查，这基本没有争议；但他们还要接受动机筛查。典型的建议是筛查过强的义务感、不当影响、无意识的内部神经质影响，以及异常的情感投入。这类筛查争议较大，因为它要对“义务感何时过强”“影响何时不当”“情感投入何时异常”作出困难判断，还要求识别神经质影响。至少在过去，一些批评者认为移植专业人员滥用了拒绝他人作为捐献者的权力（MacFarquhar 2009）[^macfarquhar-2009]。
