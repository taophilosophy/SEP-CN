      Some ethical questions are raised by penalizing people for not choosing or for introducing monetary encouragement. It may be replied that no one is pressured to donate, as opposed to choose; that the penalties or encouragement are slight; and that transplants are of such value to the needy that any ethical objections are easily overridden. The real difficulty is that mandated choice may not increase retrieval rates by much. In some places where it has been tried (such as New South Wales) people who are pressured to choose themselves default to “no” ( ABC 2012)[^abc-2012]. In New Zealand, where one must choose as a condition of getting a driving licence, the choice is often ignored by intensive care doctors and families because it does not seem like a genuine decision.
    step1: |-
      对不作选择者施加惩罚、或引入金钱激励，会引发一些伦理问题。可以这样回应：没有人被强迫捐献，被强迫的只是作出选择；惩罚或激励都很轻微；而且移植对需要者价值极高，任何伦理异议都容易被压倒。真正的困难在于，强制选择未必能大幅提高获取率。在试行过的地方（如新南威尔士），被要求作出选择的人自己往往默认选“不”（ ABC 2012）[^abc-2012]。在新西兰，选择是取得驾照的条件，但重症监护医生和家属常常忽视这一选择，因为它看起来不像真正的决定。
