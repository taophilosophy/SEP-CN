      What about organ donation that goes beyond what is currently permitted, such as the donation of the second kidney or donation of an organ necessary for life? Liberal democracies do not generally allow consent to be a defense to bodily harm at or well below the level of death (Price 2000)[^price-2000], but should they? The answer turns in part on how far third parties—transplant teams in this case—may inflict harms on those who genuinely give autonomous consent or, to put it another way, the extent to which autonomous people can waive their rights of bodily integrity. But policy considerations are also relevant. Can one be sure that consent is genuine? Would some people be forced into consenting in a way that a screening process would fail to detect? If so, how much weight should be attached to cases where organs are taken without genuine consent? These questions arise for living donation in general, but the errors are worse in cases where severe harm or death is the certain consequence of donation. (The questions also arise in the debates about whether voluntary slavery or euthanasia should be permitted (Feinberg 1986)[^feinberg-1986]).
    step1: |-
      那么超出目前允许范围的器官捐献又如何？例如捐出第二个肾，或捐出维持生命所必需的器官。自由民主国家一般不承认同意可以作为致死或远低于致死程度的身体伤害的抗辩理由（Price 2000）[^price-2000]，但它们应该承认吗？这一部分取决于第三方——此处即移植团队——在多大程度上可以对真正给出自主同意的人施加伤害；换句话说，取决于自主的人能在多大程度上放弃自己的身体完整权。但政策考量也相关。人们能确定同意是真实的吗？是否会有人被迫同意，而筛查程序无法察觉？如果如此，对未经真实同意便取走器官的情形应当赋予多大权重？这些问题在活体捐献中普遍存在，而当严重伤害或死亡是捐献的必然结果时，犯错的代价更严重。（这些问题也出现在关于是否应允许自愿为奴或安乐死的争论中（Feinberg 1986）[^feinberg-1986]。）
    step2: |-
      那么超出目前允许范围的器官捐献又如何？例如捐出第二个肾，或捐出维持生命所必需的器官。自由民主国家一般不承认同意可作为致死或远低于致死程度的身体伤害的抗辩理由（Price 2000）[^price-2000]，但它们应该承认吗？这在一定程度上取决于第三方——此处即移植团队——能在多大程度上对真正给出自主同意的人施加伤害；换个说法，取决于自主的人能在多大程度上放弃自己的身体完整权。但政策考量也相关。人们能确定同意是真实的吗？是否会有人被迫同意，而筛查程序察觉不到？若是，未经真实同意便取走器官的情形应当赋予多大权重？这些问题在活体捐献中普遍存在，而当严重伤害或死亡是捐献的必然结果时，犯错更加糟糕。（同样的问题也出现在是否应允许自愿为奴或安乐死的争论中（Feinberg 1986）[^feinberg-1986]。）
