      In addition, a scheme must take account of procedural values such as transparency, non-arbitrariness, and public deliberation (Miller 1999, ch.5)[^miller-1999]. For instance, we may think that time spent waiting on a list is only a rough proxy for fairness. Perhaps someone entered a list late because of the difficulties in finding the time and resources to complete the requirements for listing; in perfect fairness that person should not be disadvantaged as a result. And yet time waiting is a visible and checkable criterion, whereas taking account of diverse social and economic circumstances would be procedurally fraught when it comes to ordering a priority list.
    step1: |-
      此外，方案必须考虑程序性价值，如透明度、非任意性和公共审议（Miller 1999, ch.5）[^miller-1999]。例如，我们会认为，在名单上等待的时间只是公平的粗略代理指标。也许某人之所以晚些进入名单，是因为难以抽出时间和资源完成列入名单的各项要求；就完美公平而言，此人不应因此处于不利。然而，等待时间是一个可见、可核查的标准，而把多样的社会经济情况纳入考量，在给优先序列排序时会使程序麻烦重重。
    step2: |-
      此外，方案必须考虑程序性价值，如透明度、非任意性与公共审议（Miller 1999, ch.5）[^miller-1999]。例如，名单上的等待时间只是公平的粗略代理指标。某人之所以晚上名单，也许是难以腾出时间与资源去凑齐列入名单的各项要求；就完全的公平而言，此人不应因此吃亏。然而等待时间看得见、可核查，而把各种社会经济情况纳入考量，在给优先序列排序时会让程序麻烦重重。
