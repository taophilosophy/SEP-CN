      S. Wilkinson (1999) takes this fact as a point of departure for a deeper critique of the Restoration Argument. Suppose it turns out that smokers cost the state less than non-smokers overall because on average they die younger, and hence consume fewer health and social care resources in retirement (see e.g. for Finland, Tiihonen, 2012; more generally, T.M. Wilkinson, 2025). If so, then proponents of the Restoration Argument would be committed to the unpalatable conclusion that smokers should be given not lower but higher priority than other patients. Otherwise, smokers would be harmed by the non-smokers’ deliberate attempts to extend their own lives by avoiding smoking. His argument is about financial resources, but similar considerations would apply to organs in relevantly similar situations of scarcity.
    step1: |-
      S. Wilkinson（1999）以此为出发点，对恢复论证作了更深入的批评。假设结果表明，吸烟者总体上给国家造成的成本低于不吸烟者，因为他们平均死得更早，因而在退休后消耗的医疗与社会照护资源更少（例如关于芬兰，见 Tiihonen, 2012；更一般地，见 T.M. Wilkinson, 2025）。若如此，恢复论证的支持者就不得不接受一个令人不快的结论：吸烟者应获得比其他患者更高而非更低的优先级。否则，吸烟者就会因不吸烟者刻意通过不吸烟来延长自身寿命而受到伤害。他的论证针对的是财政资源，但在相关的稀缺情形中，类似的考虑也适用于器官。
