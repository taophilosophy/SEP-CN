      *Directed deceased donation*. Much more controversial is directed deceased donation. The direction can take the form of naming a recipient, as when a dying person stipulates that she wants her organ to go to her daughter. Or it can take the form of specifying a group either to receive or be denied the organ. The most controversial direction has involved donors or their families trying to prevent organs going to members of certain ethnic groups (T.M. Wilkinson 2007b)[^wilkinson-2007b]. On the face of it, refusing directed donations forgoes organs for the sake of a principle of allocation, which is the opposite of practice with live donation. Matters are more complicated because the overall incentive effects of accepting directed donations are unclear. However, jurisdictions such as the U.K. have banned accepting directed donation for reasons besides the overall effect on the organ supply (the UK’s current policy allows requests to donate organs from a deceased person to a named relative or friend but the requests will be fulfilled only under limited conditions; see NHSBT 2023)[^nhsbt-2023]. They have cited principles such as allocation according to need as giving sufficient reason, independent of effect on numbers. A consistency argument can be put to them: why do they accept deviations from allocation according to need in the case of live donation but reject them for deceased donation?
    step1: |-
      *定向死者捐献*。争议大得多的是定向死者捐献。定向可以采取指定接受者的形式，例如临终者规定要把自己的器官给女儿；也可以采取指定某一群体的形式，或让该群体接受，或拒绝给该群体。最具争议的定向，是捐献者或其家属试图阻止器官流向某些族裔群体的成员（T.M. Wilkinson 2007b）[^wilkinson-2007b]。表面上看，拒绝定向捐献是为了维护分配原则而舍弃器官，这与活体捐献的做法正好相反。事情更复杂，因为接受定向捐献对总体激励的影响并不清楚。然而，英国等法域除了考虑对器官供应的总体影响，还以其他理由禁止接受定向捐献（英国现行政策允许请求把死者的器官捐给指定的亲属或朋友，但只在有限条件下才会满足请求；见 NHSBT 2023）[^nhsbt-2023]。它们援引按需分配等原则，认为这本身就构成充分理由，与数量影响无关。可以拿一个一致性问题问它们：为什么在活体捐献的情形中接受偏离按需分配，在死者捐献中却拒绝偏离？
