      Conscription may be politically infeasible or be subject to practical objections. But what of principled ethical objections? One could point to the distress that families would suffer (Brazier 2002)[^brazier-2002], but what of the distress of the families of people who die for want of an organ? One could point to the interests of the deceased, but the arguments above need not deny that the deceased have interests; they claim that those interests are outweighed. One could claim that the deceased have rights that protect their interests and deny that potential recipients have rights to organs. Even if the deceased have rights and potential recipients do not, it would have to be shown that the rights of the deceased are not outweighed by the needs of those with organ failure.
    step1: |-
      征用也许在政治上不可行，或会遭到现实层面的反对。但原则性的伦理反对呢？有人可以指出家属会遭受痛苦（Brazier 2002）[^brazier-2002]，可那些因等不到器官而死去者的家属，他们的痛苦又当如何？有人可以指出死者的利益，但上述论证未必否认死者有利益；它们只是主张这些利益被压倒了。有人可以主张死者拥有保护其利益的权利，并否认潜在接受者对器官拥有权利。即便死者有权利而潜在接受者没有，也还得证明：死者的权利没有被器官衰竭者的需要所压倒。
