      Transplant professionals have a practical reason not to override the family: they fear bad publicity (McCall, 2006; Volk and Ubel 2008)[^volk-2008]. One version of their argument says that there are already urban myths about people having their deaths hastened so as to make their organs available, few people understand brain-death, and donation rates would fall if families publicly claimed that their views were overridden and their relatives were not dead. So ending the family veto would reduce the supply of organs, not increase it.
