      Next, the application of the principles ought to range across all the stages of transplantation. Details vary from place to place and organ to organ but in general the pathway to transplantation can be thought of as having these steps: being referred for assessment; being assessed and then listed; and receiving an organ once listed. People may be halted at each step, perhaps for medical reasons, perhaps because they cannot pay (the so-called “green screen”) or because the public system will not pay. Principles need to range over all steps. For instance, scrupulous fairness to those on a waiting list may go along with injustice in access to the list.
    step1: |-
      其次，原则的应用应当贯穿移植的所有阶段。细节因地区、因器官而异，但一般而言，通往移植的路径可分为以下步骤：被转介接受评估；通过评估后被列入名单；列上名单后等待接受器官。每一步都可能有人被挡住，原因或许是医学上的，或许是因为付不起钱（所谓“绿屏”），或许是因为公共体系不予支付。原则需要覆盖所有步骤。例如，对已列入等待名单者做到一丝不苟的公平，却可能伴随进入名单的机会不公。
    step2: |-
      其次，原则的应用应当贯穿移植的所有阶段。细节因地区、因器官而异，但一般而言，通往移植的路径可分为几步：被转介接受评估；通过评估后列入名单；列上名单后等待接受器官。每一步都可能有人被挡下：原因或许出在医学上，或许是付不起钱（所谓“绿屏”），或许是公共体系不予支付。原则需要覆盖每一步。例如，对已在等待名单上的人一丝不苟地公平，却可能同进入名单的机会不公并存。
