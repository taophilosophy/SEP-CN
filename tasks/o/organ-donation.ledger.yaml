      *Priority to donors*. A minority of jurisdictions give some priority in receiving organs to those who have declared their willingness to donate (Cronin 2014)[^cronin-2014]. One reason is the supposed incentive effect of giving priority to donors of encouraging more donations. Priority schemes have been criticized on practical grounds, but some criticism invokes principles, such as allocation according to need (Quigley et al. 2012)[^quigley-2012]. As before, the principles are supposed by those who cite them to be sufficient to defeat priority schemes even if they would produce more organs. By contrast, the principles are not thought to outweigh getting more organs with live donation and kidney exchange.
    step1: |-
      *捐献者优先*。少数法域在获得器官方面给予已声明愿意捐献者一定优先（Cronin 2014）[^cronin-2014]。一个理由是所谓给予捐献者优先能激励更多人捐献。优先方案已受到实践层面的批评，但有些批评援引原则，如按需分配（Quigley et al. 2012）[^quigley-2012]。与前面一样，援引原则者认为，即便优先方案能产生更多器官，原则也足以击败它。相比之下，在活体捐献和肾脏交换中，原则却不被认为足以压倒获得更多器官。
