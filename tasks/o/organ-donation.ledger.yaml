      The scarcity of organs creates an allocation problem. A great deal has been written in philosophy on the principles of the allocation of scarce resources, although not much on the allocation of organs specifically (see the entries on distributive justice; equality; justice and access to health care). Unsurprisingly, many of the principles cited in official transplantation allocation documents are familiar (see Other Internet Resources: TSANZ 2024; NHSBT 2013). These principles include allocating to those who would benefit the most (a proxy for utility), to those who are the sickest (a proxy for helping the worst off), to those whose medical condition will deteriorate the soonest (urgency), and to those who have been waiting the longest (often linked to equity). Official documents also stress principles of non-discrimination, which are taken to exclude allocating according to judgments of social worth, as well as race, sex, religion etc. In practice, the principles conflict; the person waiting the longest may not be the one who would gain the most from a transplant, for example. So official allocation protocols also have to say how the conflict between principles should be resolved. (For a philosophical discussion of the principles and their application to organ allocation see Kamm 1993.)[^kamm-1993]
    step1: |-
      器官短缺造成分配问题。哲学界关于稀缺资源分配原则的论述极多，专门讨论器官分配的却不多（见“分配正义”“平等”“医疗保健的公正与获取”词条）。不出所料，官方移植分配文件所引用的许多原则都是人们熟悉的原则（见其他网络资源：TSANZ 2024；NHSBT 2013）。这些原则包括：分配给获益最多者（效用的一个代理指标）、分配给病情最重者（帮助处境最差者的一个代理指标）、分配给病情最快恶化者（紧迫性），以及分配给等待最久者（常与公平相联系）。官方文件也强调非歧视原则，由此排除按社会价值判断来分配，也排除按种族、性别、宗教等分配。实践中这些原则相互冲突：例如等待最久的人未必是从移植中获益最多的人。所以官方分配规程还须说明原则之间的冲突应如何解决。（关于这些原则及其在器官分配中的应用的哲学讨论，见 Kamm 1993。）[^kamm-1993]
