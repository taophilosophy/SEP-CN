      If the practical argument is correct, it is understandable why families have a medically-created power of veto. Moreover, it is hard to see that the veto is contrary to the claims of the deceased. While the deceased may have a claim to block retrieval, no one has a claim that other people use his or her organs. If the veto is in the interests of potential recipients, doctors may refuse the offer of organs by the deceased without infringing on the deceased’s claim (T.M. Wilkinson 2007a)[^wilkinson-2007a].
