      Some argue for family decision-making on cultural grounds (Fan and Wang 2019)[^fan-2019]. For them, giving priority to the deceased is unacceptably individualist either in all cases or in cases where individualism is culturally abnormal (Boddington 1998)[^boddington-1998]. Among the difficulties for such views is to explain why, if individualism is mistaken, the decision about retrieval should be made by individual families rather than in the interests of the wider community, which may well require taking organs against the families’ wishes so as to meet the needs of potential recipients.
