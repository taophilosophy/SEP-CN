      The “do no harm” argument against living donation is not widely accepted—that is why living donation proceeds apace. Nonetheless, even if the physical harm can be outweighed by the need to avoid other harms, or by consent, or both, one may think that as a matter of policy living donation should be discouraged. One fear is that increasing the use of living donors relieves the pressure to find ways to get more organs from other sources, notably the deceased (Moorlock 2015)[^moorlock-2015].
