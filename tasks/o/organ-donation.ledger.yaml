      The idea of conscription is to take organs in all suitable cases even when the deceased or family objected (except, perhaps, in cases of conscientious objection). Unlike the other reform proposals, conscription seems to have little political support. Nonetheless, some powerful philosophical arguments can be given for it. One argument, mentioned above, compares the strength of the interests of the deceased, families, and potential recipients, and claims that the need for transplants of those with organ failure is much greater than the needs of the deceased or their families (Kamm 1993; Harris 2002, 2003)[^harris-2002][^kamm-1993]. Another argument draws an analogy with the relief of poverty. Many people think the state may use its coercive powers to transfer material resources from those with a surplus to those with little. In other words, we think that people have welfare rights to resources. One way to fulfill those rights is to tax the estates of the deceased. By parity of reasoning, because organs are also resources and no longer of use to the dead, they too should be coercively transferred to fulfill the welfare rights of those with organ failure (Fabre 2006)[^fabre-2006].
    step1: |-
      征用的设想是：在所有适合的情况下都取走器官，即便死者或家属反对（或许良心拒绝者除外）。与其他改革方案不同，征用似乎没什么政治支持。尽管如此，仍可为它给出一些有力的哲学论证。上文提到的一种论证比较了死者、家属与潜在接受者各自利益的分量，主张器官衰竭者对移植的需要远大于死者或其家属的需要（Kamm 1993; Harris 2002, 2003）[^harris-2002][^kamm-1993]。另一种论证则与扶贫相类比。许多人认为，国家可以运用强制权力，把物质资源从有余者转移给匮乏者。换言之，我们认为人对资源拥有福利权利。履行这些权利的一种方式，是对死者的遗产征税。同理，器官也是资源，且对死者已无用处，因此也应被强制转移，以履行器官衰竭者的福利权利（Fabre 2006）[^fabre-2006]。
    step2: |-
      征用的设想是：在所有适合的情况下都取走器官，即便死者或家属反对（或许良心拒绝者除外）。与其他改革方案不同，征用似乎没什么政治支持。尽管如此，仍可为它给出一些有力的哲学论证。上文提到的一种论证比较了死者、家属与潜在接受者各自利益的分量，主张器官衰竭者对移植的需要远大于死者或其家属的需要（Kamm 1993; Harris 2002, 2003）[^harris-2002][^kamm-1993]。另一种论证与扶贫相类比：许多人认为，国家可以运用强制权力，把物质资源从有余者转移给匮乏者。换言之，我们认为人对资源拥有福利权利，而履行这些权利的一种方式，就是对死者的遗产征税。同理，器官也是资源，对死者又已无用，所以也应被强制转移，以满足器官衰竭者的福利权利（Fabre 2006）[^fabre-2006]。
