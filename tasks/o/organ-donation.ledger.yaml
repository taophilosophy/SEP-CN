      The primary ethical question raised by living donation is to do with the risk of having an organ taken. Having an organ taken imposes risks of death, disease, and discomfort from trauma, infection, the use of a general anaesthetic, and the loss of all or part of an organ (although the liver will usually regenerate, replacing the part removed). These risks are not negligible. However, the risk of death is not enormous. A recent figure for the US found a rate of death within 90 days of below one per 10,000 donations (Massie et al 2024)[^massie-2024]. There appears to be no difference between healthy screened living kidney donors and the general population in long-term survival and the risk of kidney failure. (Ibrahim et al. 2009)[^ibrahim-2009]. That said, the general population is less healthy on average than the healthy screened living donors, who do in fact undergo some extra risk of long-term renal failure as a result of one kidney being removed (Grams et al. 2016)[^grams-2016].
    step1: |-
      活体捐献引发的主要伦理问题，与取走器官的风险有关。取走器官会带来死亡、疾病和不适的风险，风险来源包括创伤、感染、全身麻醉，以及全部或部分器官的丧失（不过肝脏通常会再生，补上被切除的部分）。这些风险不可忽视。但死亡风险并不算大。美国最近的数据显示，每 10,000 例捐献中，90 天内死亡的人数不到 1 例（Massie et al 2024）[^massie-2024]。在长期存活率和肾衰竭风险方面，经过健康筛查的活体肾捐献者与一般人群似乎没有差别（Ibrahim et al. 2009）[^ibrahim-2009]。话虽如此，一般人群的平均健康状况不如经过健康筛查的活体捐献者，而后者确实因切除一个肾脏而承担了额外的长期肾衰竭风险（Grams et al. 2016）[^grams-2016]。
