      The proposal envisages taking organs without the explicit consent of the deceased. One may object that people’s rights over their bodies establish a duty of non-interference which can be lifted only with the consent of the rightholder (Kluge 2000)[^kluge-2000]. A different objection points out that taking organs without consent would sometimes be against the wishes of the deceased; and while not taking would be against the wishes of the deceased who had wanted to donate, taking in error is a worse mistake than not taking in error, because people have a right not to have their organs taken but no right to have their organs taken (Veatch and Ross 2015; for criticism specifically of their views see den Hartogh 2019)[^hartogh-2019][^veatch-2015]. As against these views, we must dispose of the bodies of the dead in some way, even if not consented to; and we give unconsented medical treatment to the unconscious even though some would have opposed treatment (Gill 2004; T.M. Wilkinson 2011)[^gill-2004][^wilkinson-2011].
    step1: |-
      该方案设想不经死者明确同意就取走器官。有人可能反对说，人对自己的身体拥有权利，由此产生不干涉的义务，只有权利人同意才能解除（Kluge 2000）[^kluge-2000]。另一种反对意见指出，未经同意取走器官有时会违背死者的意愿；不取走会违背想捐献者的意愿，但“错误地取走”比“错误地不取走”更糟，因为人有“不被取走器官”的权利，却没有“器官被取走”的权利（Veatch and Ross 2015；对其观点的专门批评见 den Hartogh 2019）[^hartogh-2019][^veatch-2015]。针对这些观点，我们必须以某种方式处置死者的遗体，即便未经同意；我们也对无意识者实施未经同意的医疗，即便有些人会反对治疗（Gill 2004; T.M. Wilkinson 2011）[^gill-2004][^wilkinson-2011]。
