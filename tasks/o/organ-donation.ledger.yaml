      3. 把医疗资源分配当作惩罚手段既不切实际也不公平，还可能带来不良后果（例如对公众关于器官捐献和医生的态度产生负面影响）。只把某些风险行为挑出来定为不道德，似乎很任意。就算跳过这个问题，关于因果责任与道德责任的判断如何以及时、低成本的方式作出？医生又怎么做得出？惩罚只应由国家机关（i）针对被禁止的行为（因此在多数国家不包括饮酒、暴食和吸烟）并（ii）遵循法庭上的“正当程序”来施加（Harris 1985）[^harris-1985]。
