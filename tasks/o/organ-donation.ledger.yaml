      Family pressure is different. Family pressure may take the form of credible threats of violence, in which case the potential donor is coerced and any consent invalid. Family pressure may be felt as a form of moral obligation on the part of the donor, in which case (see above) consent would not be made invalid for that reason. Somewhat harder to think through is family pressure that consists of the implicit threat of ostracism. On the one hand, that pressure may be very effective. On the other, it works by family members withdrawing their goodwill, something people are generally entitled to do. Some views of coercion and valid consent imply that consent to avoid ostracism would be valid (e.g., Nozick 1974)[^nozick-1974]; others do not (e.g., Cohen 1988)[^cohen-1988]. As it happens, transplanters will often furnish reluctant donors with “white lies” to enable them to avoid donating while retaining the appearance of honour. For instance, reluctant donors may be told to say they are clinically unsuitable on anatomical grounds. Whether “white lies” are mandatory or even permissible depends partly on resolving the question of when family pressure undercuts valid consent (den Hartogh 2008b)[^hartogh-2008b].
    step1: |-
      家庭压力则不同。家庭压力可能表现为可信的暴力威胁，此时潜在捐献者受到胁迫，任何同意都无效。家庭压力也可能被捐献者感受为一种道德义务，此时（见上文）同意不会因此失效。较难想清楚的是以隐含的排斥威胁为形式的家庭压力。一方面，这种压力可能非常有效；另一方面，它的运作方式是家庭成员收回善意，而人们一般有权这样做。某些关于胁迫与有效同意的观点意味着，为避免排斥而给出的同意仍然有效（如 Nozick 1974）[^nozick-1974]；另一些观点则不这么认为（如 Cohen 1988）[^cohen-1988]。碰巧，移植医生常常给不情愿的捐献者提供“善意的谎言”，让他们既能避免捐献，又保全面子。例如，可以告诉不情愿的捐献者，说自己在解剖学上不适合捐献。“善意的谎言”是义务、甚至是否被允许，部分取决于如何解决“家庭压力何时削弱有效同意”这一问题（den Hartogh 2008b）[^hartogh-2008b]。
