      In some cases, the claims of the deceased will be in conflict with those of their families and/or the claims of potential recipients. The question arises of how to weigh the claims of the deceased. Some writers accept that the deceased can have posthumous interests, but believe them to be of little weight, particularly compared with the needs for organs of those with organ failure (Harris 2002, 2003)[^harris-2002]. They may believe that people are not affected by their posthumous interests being set back or they may think the fear of retrieval is of little weight. In their view, any roughly consequentialist calculation would justify setting aside the objections of the deceased to organ retrieval. Other writers argue that if we accept posthumous interests and accept that people have strong claims over their bodies while alive, we have grounds to attribute rights to the living over their post-mortem bodies (T.M. Wilkinson 2011)[^wilkinson-2011]. Such a view needs to explain how posthumous rights are possible, since some writers in political and legal theory believe that rights could not protect posthumous interests for technical reasons to do with the nature of rights (Steiner 1994; Fabre 2008)[^fabre-2008][^steiner-1994][^steiner-1994-2].
    step1: |-
      在某些情况下，死者的主张会与其家属的主张和/或潜在接受者的主张相冲突。这就产生了如何权衡死者主张的问题。一些论者承认死者可以有身后利益，但认为这些利益分量很轻，尤其与器官衰竭者对器官的需要相比（Harris 2002, 2003）[^harris-2002]。他们可能认为，身后利益受挫并不会影响人；也可能认为对器官被取走的恐惧无关紧要。在他们看来，任何大致上的后果主义计算都足以证明，可以搁置死者对器官获取的反对。另一些论者主张，如果我们接受身后利益，并接受生者对自己的身体有强有力的主张，我们就有理由把生者对其死后身体的权利归于生者（T.M. Wilkinson 2011）[^wilkinson-2011]。这种观点需要解释身后权利何以可能，因为政治与法律理论中的一些论者认为，由于权利性质方面的技术性理由，权利无法保护身后利益（Steiner 1994; Fabre 2008）[^fabre-2008][^steiner-1994][^steiner-1994-2]。
