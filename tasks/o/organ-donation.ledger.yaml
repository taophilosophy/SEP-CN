      Several arguments have been given for permitting retrieval from incompetent people. Utilitarian arguments appear to permit retrieval because the donor loses less than the recipient gains. On the face of it, however, that argument would support organ conscription from living competent people too. Some people have argued in specific cases that the person would have wanted to donate, thus using the idea of substituted judgment familiar in other cases of deciding for incompetent patients. However, substituted judgment is misapplied in cases where the person is not, and never has been, competent (Buchanan and Brock 1990)[^buchanan-1990]. More plausibly, it may be thought that, at least in some cases, incompetent donors are not harmed by donating an organ. If a child’s donation would save the life of a sibling with organ failure, the donor may gain in the psychosocial and vicarious senses described above in the discussion of the “do no harm” rule. Donors may be no worse off for donating, in which case organ retrieval would not infringe the “do no harm” rule (T.M. Wilkinson 2011)[^wilkinson-2011].
    step1: |-
      人们为允许从无行为能力者身上获取器官给出了几种论证。功利主义论证似乎允许获取，因为捐献者的损失小于接受者的收益。但表面上看，这一论证同样会支持从有行为能力的活人身上征用器官。有些人就具体个案论证说，当事人本来会愿意捐献，因而使用了在替无行为能力患者作决定的其他情形中熟悉的替代判断观念。然而，在当事人并不、也从未具有行为能力的情况下，替代判断是被误用的（Buchanan and Brock 1990）[^buchanan-1990]。更合理的想法也许是：至少在某些情况下，无行为能力的捐献者并不会因捐献器官而受到伤害。如果一个孩子的捐献能救活患有器官衰竭的兄弟姐妹，捐献者可能以上文讨论“不伤害”规则时所述的心理社会意义和替代性意义上获益。捐献者可能并不因捐献而处境更差，在这种情况下，获取器官就不违反“不伤害”规则（T.M. Wilkinson 2011）[^wilkinson-2011]。
    step2: |-
      人们为允许从无行为能力者身上获取器官给出了几种论证。功利主义论证似乎允许获取：捐献者的损失小于接受者的收益。但表面上看，这一论证同样会支持从有行为能力的活人身上征用器官。有些人就具体个案论证说，当事人本来会愿意捐献，于是用上了替代判断的观念——这在替无行为能力患者作决定的其他情形中并不陌生。然而在当事人并不、也从未具有行为能力的情况下，替代判断是被误用的（Buchanan and Brock 1990）[^buchanan-1990]。更合理的想法也许是：至少在某些情况下，无行为能力的捐献者并不会因捐献器官而受到伤害。如果一个孩子的捐献能救活患器官衰竭的兄弟姐妹，捐献者便可能在上文讨论“不伤害”规则时所述的心理社会意义与替代性意义上获益。捐献者可能并不因捐献而处境更差，那么获取器官也就不违反“不伤害”规则（T.M. Wilkinson 2011）[^wilkinson-2011]。
