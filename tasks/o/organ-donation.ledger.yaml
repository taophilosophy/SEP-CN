      Although rules and practices governing living donation have generally become more permissive in most respects, they have become stricter in the case of incompetent donors (Price 2000)[^price-2000]. Only six living kidney donations by minors were performed between 2000 and 2015 in the U.S., for example. Additionally, in the U.S., just 20 minors have donated a liver lobe or segment since 1987. In Europe, only three cases of living kidney donation by minors have been reported, all involving adolescents and occurring in the U.K. prior to 2006 (Van Assche et al*.* 2016)[^van-2016]. A recent figure for the US is 60 solid organ donations by children since 1988 (Moorthy, Crowley, and Amaral, 2025). Even this very low figure raises fewer ethical questions that one might think, since some of the children were simultaneously receiving a deceased donor organ, and others were emancipated minors donating to their own children. (Ross 2023)[^ross-2023].
    step1: |-
      尽管规范活体捐献的规则与实践在大多数方面总体趋于宽松，但在无行为能力捐献者的情形中却趋于严格（Price 2000）[^price-2000]。例如，美国在 2000 至 2015 年间只实施了六例未成年人活体肾捐献。此外，自 1987 年以来，美国只有 20 名未成年人捐献过肝叶或肝段。欧洲只报告过三例未成年人活体肾捐献，全部涉及青少年，且都发生在 2006 年之前的英国（Van Assche et al*.* 2016）[^van-2016]。美国最近的数字是，自 1988 年以来儿童共捐献实体器官 60 例（Moorthy, Crowley, and Amaral, 2025）。即使这个极低的数字，所引发的伦理问题也比人们想象的少，因为其中一些儿童同时正在接受来自死者捐献的器官，另一些则是已脱离父母管束、向自己子女捐献的未成年人（Ross 2023）[^ross-2023]。
    step2: |-
      尽管规范活体捐献的规则与实践在大多数方面总体趋于宽松，但在无行为能力捐献者这里却趋于严格（Price 2000）[^price-2000]。例如，美国 2000 至 2015 年间只实施了六例未成年人活体肾捐献；自 1987 年以来，也只有 20 名未成年人捐献过肝叶或肝段。欧洲仅报告过三例未成年人活体肾捐献，都涉及青少年，且都发生在 2006 年之前的英国（Van Assche et al*.* 2016）[^van-2016]。美国最近的一个数字是，自 1988 年以来儿童共捐献实体器官 60 例（Moorthy, Crowley, and Amaral, 2025）。这个数字极低，而它引发的伦理问题也比人们想象的少：其中一些儿童同时正在接受来自死者捐献的器官，另一些则是已脱离父母管束、向自己子女捐献的未成年人（Ross 2023）[^ross-2023]。
