      In the economy, the amount produced depends in part on how production will be allocated, at least insofar as people respond to incentives (see the entry on distributive justice). For instance, a guaranteed equal share gives no self-interested incentive to work hard or in an efficient job. In organ transplantation, the number of organs available also depends on how they would be allocated. In the economy, ideal allocation principles may have to yield to the reality of incentives, which is why it is often thought that strict equality is precluded by concern for efficiency. Similarly, transplantation allocation schemes seem to face a choice; they can keep their usual ideal principles and have fewer organs or compromise them and have more. Some examples discussed here are live donation, kidney exchanges, directed deceased donation, priority to donors, and priority to children. These examples are diverse but they have in common the question: what if the usual principles of allocation led to fewer organs being donated than would deviating from those principles? That they have this question in common has not been widely appreciated, which may explain why the question has been answered in different ways in the examples described below.
    step1: |-
      在经济中，产量部分取决于生产成果将如何分配，至少就人们对激励作出反应而言是如此（见“分配正义”词条）。例如，有保障的平均份额不会给人努力工作的自利激励，也不会促使人从事效率高的工作。在器官移植中，可用器官的数量也取决于它们将如何分配。在经济中，理想的分配原则可能不得不向激励的现实让步，这就是为什么人们常认为，对效率的关切排除了严格平等。同样，移植分配方案似乎面临一个选择：要么坚持通常的理想原则而只有较少的器官，要么折中这些原则而得到较多的器官。这里讨论的一些例子是活体捐献、肾脏交换、定向死者捐献、捐献者优先和儿童优先。这些例子各不相同，但都有一个共同问题：如果通常的分配原则导致捐献的器官少于偏离这些原则时所能得到的，那该怎么办？这些例子共有这一问题，尚未得到广泛认识；这或许可以解释，为什么下文所述各例对这一问题给出了不同的回答。
