      The successful early transplants used organs taken from living donors. For a long time the hope was that, when technical problems were overcome, enough organs would be supplied by dead donors (Price 2009)[^price-2009]. That way, healthy living people need not undergo the risk and discomfort of non-therapeutic organ retrieval. That hope however was false and the persistent shortage of donors has led to the increasing use of living donors. It has been reported that 43, 101 live donor kidney transplants occurred in 2023 ([Global Observatory on Donation and Transplantation](http://www.transplant-observatory.org/)), 38% of the global total. For livers, the global total from living donors was 10, 093 , 25% of the total. Rules governing living donation have generally become more permissive, allowing donations from close genetic relatives, then spouses, then partners and friends, and, in some jurisdictions, even strangers.
    step1: |-
