      An early version of something close to the core idea behind the CCC argument emerges in the views of al-Ash‘ari (873–935), the founder of Ash‘arite school. As Perler and Rudolph have argued, according to al-Ash‘ari, God rearranges the atoms that make up this world anew at every instant, and in so doing God continuously creates the accidents that inhere in these atomic substances (Perler and Rudolph 2000, 28–62)[^perler-2000]. The view seems to have been one where the accidents of a substance possess only a momentary existence. Hence, at every instant, God brings about the accidents that inhere in the substances by continuously recreating these modes. If God sustains the existence of the atoms themselves, while continuously recreating all of their modes, then, barring causal overdetermination, the occasionalist conclusion that God is the only genuine cause does seem to follow from this interpretation of divine conservative activity.
