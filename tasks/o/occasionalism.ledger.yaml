      此时我们或应考虑过度决定的可能性。我们难道不能认为，某些受造结果在保存中被过度决定？也就是说，我们既可以承认上帝是受造物样态的全部而直接的原因，又可以主张受造物也造成其样态，从而使某些结果在因果上被过度决定？此外，若被过度决定的只是受造物的样态，则似乎并不违反“上帝是受造物所具有的*存在*的唯一因果来源”这一核心信条。如前所述，神的因果力重要地包含维持受造物之存在或*esse* 于存在之中；即便保存论者也承认，保存原因的作用——即维持受造物存在之因果力——是上帝作为*causa secundum esse*（就存在而言的原因）的独一无二的特权。也就是说，在这场关于自然中次级因果的争论中，各方无论对受造因果力之实在性持何看法，都同意：受造物被保存时，其存在或*esse* 对上帝的依赖，与它被*无中生有*创造时同样彻底。上帝是此世任何存在或*esse* 的唯一创造因与保存因。
