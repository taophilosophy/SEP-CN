      Cases (2) and (3) have received much attention from the general philosophical audience. This phenomenon stems as far back as Princess Elisabeth of Bohemia (see her astute exchange with Descartes in AT III 663–8 (CSM III, 218)). As we can see in Elisabeth’s correspondence, from the beginning much of the focus has been directed at the issue of how or even whether two radically different substances can causally interact. And this attention has at times led to the caricature of occasionalism as an ad hoc solution to this problem for Cartesian dualists. But, as we have already seen and will further see, the scope and depth of the issues surrounding the emergence of occasionalism make it clear that this depiction is indeed a caricature at best.[^note-6]
