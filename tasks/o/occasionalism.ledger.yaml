      CCC 论证核心观念的一个较早版本，见于艾什尔里派创始人艾什尔里（873–935）的观点。如 Perler 与 Rudolph 所论，按艾什尔里，上帝在每一瞬间重新安排构成此世的原子，并由此不断创造内在于这些原子实体的偶性（Perler and Rudolph 2000, 28–62）[^perler-2000]。这一看法似乎是：实体的偶性只有瞬间存在。于是，上帝在每一瞬间通过不断重新创造这些样态，造成内在于实体的偶性。若上帝既维持原子本身的存在，又不断重新创造其全部样态，那么，排除因果过度决定，偶因论结论——上帝是唯一真正的原因——似确实可从这种对神之保存活动的解释推出。
