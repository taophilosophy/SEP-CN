      What events are exceptions and do not fall under general volitions? These are what the occasionalists typically identify as miraculous events, which, for Malebranche, would be those cases wherein God acts by particular volitions. If an event occurs without its typical preceding occasion and in violation of the general law known to us, then such an event we are able to judge as occurring due to God exercising his particular volition. Returning to Malebranche’s own example, when “a body begins to move without being pushed by another, or without changes in the will of some mind,” here God can be said to move this body by a particular volition. However, even in such instances, it is important to note that we should not think that God is rejecting or overpowering some built-in essences within the creature and conjoining some event inherently foreign to them. In fact, as we have seen, one motivation behind the occasionalist project was to avoid this picture of God having to act against natural tendencies in miraculous cases, a picture that occasionalist charged the Aristotelian essentialists to be committed to. For the occasionalists, the general laws themselves are established by God just as the particular volitions are exercised by God, hence there is no struggle or conflict between divine volition and the results of divine creation in either case. There is no need for God to overpower his creation in cases of miraculous activity. Thus, on this understanding of occasional causes, we can see that any occasion in principle could be the antecedent event in God’s exercise of a particular volition, resulting in a miracle, and any antecedent event in actual miraculous events could have been conjoined to a general volition. Creaturely states are at most occasions in that they are devoid of causal natures or essences.
    step1: |-
      哪些事件是例外、不落在一般意志之下？这些正是偶因论者通常认定的神迹事件；对马勒布朗士而言，即上帝凭个别意志行动的情形。若某事件的发生没有其典型的前件偶因，且违反我们所知的一般法则，则我们可判断该事件是上帝施行其个别意志所致。回到马勒布朗士自己的例子：当“某物体未受另一物体推动、或没有某心灵意志的变化而开始运动”，便可说上帝凭个别意志推动这物体。然而，即便在此类情形中，也须注意：不应认为上帝是在拒斥或压倒受造物中某些固有本质，并把某种对其本性而言外来之物与之联结。事实上，如我们所见，偶因论工程的一个动机，正是避免“上帝在神迹情形中不得不逆自然倾向而行”这一图景——偶因论者指控亚里士多德式本质主义者正持此图景。对偶因论者而言，一般法则由上帝所立，正如个别意志由上帝施行；因此无论哪种情形，都不存在神之意志与神创结果之间的斗争或冲突。上帝在神迹活动中无须压倒其创造。于是，按这种对偶因的理解，原则上任何偶因都可能成为上帝施行个别意志、造成神迹的前件事件，而现实神迹中的任何前件事件本也可与一般意志相联结。受造状态至多只是偶因，因为它们缺乏因果本性或本质。
