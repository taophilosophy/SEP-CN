      Arnold Geulincx’s most distinctive contribution to the development of occasionalism comes in the form of a causal principle that puts an epistemic restriction on the exercise of genuine causality (see Nadler 1999, 268)[^nadler-1999]. In his *Metaphysica vera*, Geulincx states that “it is impossible to bring about something when one does not know how it is brought about … you are not the cause of that which you do not know how to bring about (*impossibile est, ut is faciat, qui nescit quomodo fiat … quod nescis quomodo fiat, id non facis*)” (*MV* 150–1). If restricted to the causality of rational, intentional agents, the principle seems to have some intuitive appeal. But Geulincx, interestingly enough, does not restrict the principle in this way. Rather, he takes it to be universally applicable, even to bodily causes, which has raised questions about the plausibility of this overall argument. Malebranche appears to be taking up a version of this principle, which we will discuss later in the section on the “no representation” argument.
    step1: |-
      阿诺德·赫林克斯对偶因论发展最独特的贡献，是一条对真正因果之施行施加认识论限制的因果原理（见 Nadler 1999, 268）[^nadler-1999]。在《真正的形而上学》中，他说：“当一个人不知道某事如何被造成时，他不可能造成它……你不知道如何造成的东西，你就没有造成（*impossibile est, ut is faciat, qui nescit quomodo fiat … quod nescis quomodo fiat, id non facis*）”（*MV* 150–1）。若限于理性而有意的行动者的因果，此原理似有直觉吸引力。但有趣的是，赫林克斯并未如此限制；他把它当作普遍适用的，甚至适用于物体原因，这就使人质疑整个论证的可信度。马勒布朗士似采用了该原理的一个版本，后文论“无表象”论证时将再讨论。
