      [^note-22]: Are the necessary connections being discussed here logically necessary connections? Malebranche does not deny that the essences of creatures logically entail certain constraints for divine causal activity. For instance, in the *Dialogues*, Malebranche notes that the nature of bodies—their impenetrability—obliges God, with “a kind of necessity,” to move bodies when they collide. But he also states that “it is clear that impenetrability has no efficacy of its own and that it can merely provide God, who treats things according to their nature, with an occasion to diversify His action” (*Dialogues* VII, §XII, p.118–9). So, while certain events might logically necessitate some sort of divine action and, hence, be an occasion for God to act, they are not themselves causally efficacious, according to Malebranche. So I take the necessitation in this passage from the *Search* to be causal in nature, and not simply logical. The interesting and complex issue of how Malebranche understands the relation between causal necessitation and logical necessitation requires further discussion and cannot be done full justice here. Of particular importance is how to understand the connection that obtains between divine volitions and their effects. It is at least a logically necessary connection, since it is a logically necessary truth for Malebranche that if God wills p, p obtains (insofar as p itself is not inconsistent). But there has to be more going on, since, as we have just seen above, the nature of bodies also obliges with this type of necessity—that is, logical necessity—but such obliging falls short of genuine causation, a shortcoming that does not apply to divine volitions. For an interesting discussion about the relation of the NK argument to the NNC argument, in addition to issues concerning the nature of necessity involved, see Ott, 2013.
    step1: |-
      [^note-22]: 此处讨论的必然联系是逻辑必然联系吗？马勒布朗士并不否认受造物本质在逻辑上蕴含对神之因果活动的某些约束。例如在《对话录》中，他指出物体的本性——其不可入性——以“某种必然性”迫使上帝在物体碰撞时推动它们；但他也说，“显然不可入性自身并无效力，它只能为按其本性对待事物的上帝提供偶因，以变化其作用”（*Dialogues* VII, §XII, p.118–9）。故按马勒布朗士，某些事件虽可能在逻辑上要求某种神之作用、因而是上帝行动的偶因，它们本身并无因果效力。因此我把他这段《寻求》中的必然化理解为因果性的，而非单纯逻辑的。马勒布朗士如何理解因果必然化与逻辑必然化的关系，这一有趣而复杂的问题尚需讨论，此处无法尽述。尤其重要的是如何理解神之意志与其效果之间的联系：它至少是逻辑必然联系，因为对马勒布朗士而言，“若上帝意欲 p，则 p 成立”（就 p 本身不矛盾而言）是逻辑必然真理。但其中必有更多内容：如我们刚才所见，物体本性也以这类必然性（即逻辑必然性）施压，但这种施压达不到真正因果，而这一不足不适用于神之意志。关于 NK 论证与 NNC 论证之关系及所涉必然性本性的有趣讨论，见 Ott 2013。
