      We end this section with the observation that the main disagreement between those who regard al-Ghazālī as an occasionalist and those who do not seems to rest on whether they take al-Ghazālī to have accepted the principle that a genuine cause must causally necessitate its effect. Those who argue for the occasionalist reading of al-Ghazālī appear to regard him as committed to this principle, while their opponents (such as Griffel) argue that al-Ghazālī is not fully committed to this principle. If al-Ghazālī is indeed committed to this principle, then given that al-Ghazālī only grants such causally necessitating powers to God, he would be committed to denying any causal powers in creature. In contrast, if al-Ghazālī does not think that genuine causality implies that the cause causally necessitates the effect, then he would in effect be making room for a different conception of causation, one that is distinct from divine causality, the unique causally necessitating power. This different conception of cause would allow for genuine secondary causality in that creaturely causes would be real causes on this alternative conception, despite the fact that they do not causally necessitate their effects. Implicit in this disagreement over how to read al-Ghazālī are key questions that naturally arise in disputes over the nature of causation: can something be a cause even if it does not necessitate its effect? Are not such antecedents at most mere occasional causes? Moreover, what is the nature of the necessitation involved? We will pursue these questions in the following sections.
    step1: |-
      本节最后要指出：把安萨里视为偶因论者与不视为偶因论者的主要分歧，似乎在于是否认为安萨里接受了“真正的原因必须因果必然化其结果”这一原则。主张偶因论解读的人，似认为他信守此原则；反对者（如 Griffel）则认为他并未完全信守。若安萨里确守此原则，则鉴于他只把因果必然化力量归于上帝，他就须否认受造物有任何因果力。相反，若安萨里不认为真正因果蕴含原因必然化结果，则他实际上为另一种因果观留出了空间——一种区别于神的因果（唯一因果必然化力量）的因果观。这种不同的因果观将容许真正的次级因果：按之，受造原因虽不因果必然化其结果，却仍是真正的原因。这一解读分歧中隐含若干关于因果本性的争端中自然浮现的关键问题：某物即便不必然化其结果，仍能是原因吗？这样的前件难道至多只是偶因？再者，所涉必然化具有怎样的本性？这些问题留待后文。
