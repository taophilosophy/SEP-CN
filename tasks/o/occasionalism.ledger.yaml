      The issue of whether Descartes himself was an occasionalist has been the subject of considerable debate. Given how many prominent Cartesians were indeed occasionalists, it is not surprising that Descartes has been suggested as the source of this new wave of occasionalism that swept through the European continent in the second half of the seventeenth century. Some interpreters, accordingly, have held that, while perhaps not fully endorsing occasionalism across the board, Descartes did hold occasionalist views with regard to extended substances, or bodies. According to these interpreters, Descartes denied that bodies acted on either other bodies or minds.[^note-4] Others disagree and have argued, for instance, that in cases of body-body interaction, Descartes affirmed the genuine causal powers of extended substances.[^note-5] Note that, given the general framework of Cartesian dualism, four types of causal interaction among finite substances are usually considered: (1) body-body causation, where one extended substance affects another; (2) body-mind causation, where bodily changes bring about changes in the mind; (3) mind-body causation, where the direction of causation is reverse to that of body-mind causation, and certain thoughts or volitions bring about changes in bodies; (4) intra-mental causation, where various forms of mental activity, such as producing ideas, are considered as typical cases. It is within this framework that the respective positions about causation, occasionalist or not, can be identified.
    step1: |-
      笛卡尔本人是否偶因论者，一直是争论颇多的问题。鉴于不少著名笛卡尔派学者确是偶因论者，有人提出笛卡尔是 17 世纪后半叶席卷欧洲大陆的这波偶因论新潮之源，并不奇怪。据此，一些解读者认为，笛卡尔虽或许未在一切方面都彻底认同偶因论，却确实对广延实体即物体持偶因论观点：按这些解读者，笛卡尔否认物体作用于其他物体或心灵。[^note-4] 另一些人不同意，例如主张在物体—物体交互的情形中，笛卡尔肯定广延实体的真正因果力。[^note-5] 须注意，按笛卡尔二元论的总体框架，通常考虑有限实体间的四类因果交互：（1）物体—物体因果，一个广延实体影响另一个；（2）物体—心灵因果，身体变化引起心灵变化；（3）心灵—物体因果，方向与（2）相反，某些思想或意志引起身体变化；（4）心灵内部因果，产生观念等各种心理活动被视为典型情形。关于因果的种种立场——偶因论的或非偶因论的——正是在这一框架内得以辨识。
