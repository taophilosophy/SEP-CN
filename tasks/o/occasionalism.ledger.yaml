      In this case, the main issue of contention between al-Ghazālī and the *falâsifa* would concern how rich the contents of the concepts of creatures are. What al-Ghazālī needs is a rather thin notion of what a concept or essence of a creature is, while the Aristotelian philosopher would obviously argue for a richer understanding of the contents of these concepts, one that would include various causal powers as their essences. A key intuition driving al-Ghazālī’s view seems to be that if one takes the concepts of creatures to be rich in this way, then there is no logical space for the miraculous intervention on the part of God. For on the Aristotelian scheme, divine intervention such as God’s keeping the cotton from burning would imply that either God has to change the cotton into something else at the time of intervention,[^note-21] or that God has to done something that is logically inconsistent, or impossible.
