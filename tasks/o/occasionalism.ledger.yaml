      [^note-13]: 历史地看，要为上帝与受造物之间的这种共同因果活动给出令人信服的说明，并非易事。按并作论，上帝显然不只是保存受造物的存在及其力量：他还在某种意义上直接因果地参与造成结果。但这种直接因果活动，必须不同于上帝作为结果唯一直接原因的方式——后者正是偶因论者对所涉神的因果活动的理解。上帝“做得更多，却不如偶因论所说的那样多”，究竟在什么意义上，一直是争论不休的话题。事实上，马勒布朗士在《阐解》15 中机敏地指出，分歧如此之大，“［当］没有特殊利益妨碍他们达成一致的人无法达成一致时，这确凿表明他们对自己所说之物没有清楚的观念”（*Search* 658）。
