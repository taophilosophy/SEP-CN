      That the occasionalist would take divine causality to be the paradigm case, of course, is no surprise, and this might indeed explain why Geulincx and Al-Ghazālī held the wide-scope view. For, if they further assumed that all cases of genuine causation resemble the paradigmatic case of causation in this way, then insofar as KP is a critical feature of divine causality, they would think that KP should be satisfied in all cases of creaturely causation. This last assumption, however, is not trivial. For one wonders whether creaturely causation ought to resemble divine causation in this respect. Consider the fact that not all the features of the paradigmatic divine substance are replicated in created substances. For instance, knowledge and intentionality are key divine features that are not present in bodily substances. But this absence does not prevent extended substances from being the substances they are. But if knowledge and intentionality are not necessary for substancehood, as is the case for bodies, we might wonder whether they are necessary for causal activity in bodies.
    step1: |-
      偶因论者以神的因果为典范情形，当然不足为奇；这或许确实解释了赫林克斯与安萨里为何持宽范围看法。因为，若他们进一步假定一切真正因果情形都在这一方面类似典范情形，那么，既然 KP 是神之因果的关键特征，他们就会认为 KP 应在一切受造因果中满足。但最后这一假定并不平凡。人们会问：受造因果是否应在这一方面类似神的因果？试想，典范的神性实体的一切特征并不都在受造实体中重现。例如，知识与意向性是神的关键特征，物体实体却并不具有；但这种缺失并不妨碍广延实体成为其所是的实体。若知识与意向性对实体性并非必要（如物体所示），人们便会问：它们对物体中的因果活动是否必要？
