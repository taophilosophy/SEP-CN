      [^note-29]: 并作论者或认为：即便在世界最初的*无中生有*创造中，受造物的存在或*esse* 虽由上帝*无中生有*地造成，受造物在创造时所具有的样态，仍是受造物与上帝并作活动的结果。有趣的是，莱布尼茨在《神义论》第 388 节中似乎正提示接近此说的观点。
