      Given this understanding of occasional causation, occasionalism, as we noted in the beginning, can be understood as a metaphysics of causation that promotes a more discriminating attitude toward what are typically taken to be causal interactions operative in this world. The occasionalist resists a blanket, univocal understanding of these apparent causal interactions, and argues that we distinguish two types of relations in the world, that of genuine causation and that of occasional causation, wherein the latter relations are ultimately and fundamentally grounded in the former.
