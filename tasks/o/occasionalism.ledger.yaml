      [^note-13]: Historically speaking, it has not been an easy proposition to come up with a convincing account of how this joint causal activity between God and the creature is supposed to work. On the concurrentist account, God obviously is doing more than merely conserving the being of the creature along with its power. For God is in some sense causally active in bringing about the effect in a direct manner. However, this direct causal activity of God must differ from the way in which God is the sole direct cause of the effect, which is how the occasionalist regards the divine causal activity in question. In what sense God is doing more but not as much as the occasionalist’s account has been the topic of much discussion and disagreement. In fact, Malebranche shrewdly points out in *Elucidation* 15 that the disagreement is so great that “[w]hen people who have no special interest preventing them from agreeing cannot agree, it is a sure sign that they have no clear idea of what they are saying.” (*Search* 658)
