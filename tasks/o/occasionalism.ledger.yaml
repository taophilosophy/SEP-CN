      Sources suggest that Autrecourt was acquainted with the arguments set forth by al-Ghazālī (cf. Wolfson 1969, 234–8)[^wolfson-1969]. Thus, it is no surprise that Autrecourt presents various arguments that are reminiscent of al-Ghazālī’s. For instance, like al-Ghazālī, Autrecourt in one formulation of his criticism of necessary connections relies on a dictum that the existence of one thing cannot be logically inferred from the existence of another thing (Weinburg 1964, 272). Hence Autrecourt held that, unless there were overwhelming reasons to the contrary, the default position should be to assume the lack of logically necessary connections between two distinct entities.
    step1: |-
      材料表明，奥特勒库尔熟悉安萨里提出的论证（参 Wolfson 1969, 234–8）[^wolfson-1969]。因此，他提出若干令人想起安萨里的论证，并不奇怪。例如，与安萨里一样，奥特勒库尔在批评必然联系的某一表述中依据这样一条原理：一物的存在不能从另一物的存在逻辑地推出（Weinburg 1964, 272）。因此他认为，除非有压倒性的相反理由，默认立场应是假定两个不同实体之间缺乏逻辑必然联系。
