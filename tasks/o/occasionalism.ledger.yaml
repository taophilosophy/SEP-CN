      Neither option seems palatable to al-Ghazālī, and his innovative proposal is to distinguish between logical connections and causal connections. On al-Ghazālī’s scheme, the logically necessary constitute a much narrower set of connections than those that are causally necessary (Dutton 2001, 24–5; Schmaltz 2008b, 299–301)[^dutton-2001][^schmaltz-2008b]. This setup allows him to claim that when God intervenes to stop a piece of dry cotton from burning, which obviously diverges from the natural course of events, God need not change the cotton fibers into some material that is fire-resistant, nor is he doing something that is logically impossible. Rather, God is bringing about a state of affairs that is perfectly consistent, hence, possible, but one that is an exception, when compared to the normal type of causal connections we come to expect between fire and cotton.
    step1: |-
      两个选项在安萨里看来都不可取。他的创新提议是区分逻辑联系与因果联系：按其方案，逻辑上必然的联系构成的集合，远比因果上必然的联系狭窄（Dutton 2001, 24–5; Schmaltz 2008b, 299–301）[^dutton-2001][^schmaltz-2008b]。这一设置使他得以主张：当上帝干预阻止干棉花燃烧——显然偏离自然事件进程——上帝无须把棉纤维变成某种耐火材料，也没有做逻辑上不可能之事；毋宁说，上帝造成了完全融贯、因而可能的事态，只是与我们通常预期的火与棉花之间常规因果联系相比，属于例外。
