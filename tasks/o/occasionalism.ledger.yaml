      Occasionalism and pre-established harmony emerged as alternatives to the model of interactionism, in rejecting that there is genuine causal interaction. In fact, their denial of real causal interaction among distinct finite substances is not limited to mind-body interaction but applies across all board, be it body-body or mind-body causation. In other words, both views can be said to deny all *inter*-substantial causation, where by “substance” we refer to finite substances or creatures.[^note-12] However, occasionalism and pre-established parted ways when it came to the question of *intra*-substantial causation—that is, whether or not there is causal activity going on *within* the substances such that finite substances are active in causing their own states. Leibniz, the principal proponent of pre-established harmony, held firm to the view that, while finite substances do not have the causal power to bring about changes in *other* substances, they are causally active *internally*, that is, in causing their own states. Each creature causally contributes to the occurrence of its own states, and the apparent interaction between distinct substances is due to how the states of distinct substances harmonize with each other. Following our characterization of occasionalism at the outset, even if the relevant domain of concern is restricted to the states of a single, individual substance, an occasionalism would have to hold that the creature itself is not playing a genuine causal role in the occurrence of those states. Leibniz, as a proponent of genuine intra-substantial causal forces, would reject this claim. Malebranche, in contrast, denied all causal powers to creatures, including the intra-substantial powers endorsed by Leibniz. For Malebranche, even the internal states of a creature are mere occasions for God to bring about the relevant subsequent states.
    step1: |-
      偶因论与预定和谐作为交互作用论模型的替代而出现，二者都否认存在真正的因果交互。事实上，二者对不同有限实体之间真实因果交互的否认并不限于心身交互，而是普遍适用，无论物体—物体因果还是心灵—物体因果。换言之，两种观点都可说否认一切实体*间*因果，其中“实体”指有限实体或受造物。[^note-12] 然而，一涉及实体*内*因果——即各实体内部是否发生因果活动，使有限实体在造成自身状态上具有活动性——偶因论与预定和谐便分道扬镳。预定和谐的主要倡导者莱布尼茨坚持：有限实体虽无造成*其他*实体变化的因果力，却在*内部*具有因果活动，即在造成自身状态上如此。每个受造物对其自身状态的发生都有因果贡献；不同实体之间的表面交互，源于各实体状态彼此和谐。按本文开头的刻画，即便相关领域限于单个实体的状态，偶因论者也须主张：受造物本身在这些状态的发生中不起真正因果作用。作为真正实体内部因果力的倡导者，莱布尼茨会拒斥这一主张；马勒布朗士则相反，否认受造物的一切因果力，包括莱布尼茨所肯定的实体内力。对马勒布朗士而言，即便受造物的内部状态，也只是上帝造成相关后续状态的偶因。
    step2: |-
