      The other issue that occasionalism addresses is one that concerns how divine causality relates to natural causality, or as Alfred Freddoso has put it, “the general problem of divine action in nature” (Freddoso 1994, 131–5)[^freddoso-1994]. The problem, as Freddoso notes, consists of the following questions: if God ultimately is the first and direct cause of everything, including whatever occurs and exists in nature, can there be any causal activity on the part of creatures?; and if there is secondary causation, how does this causal activity fit in with God’s causal activity? In response to these questions, historically, three positions have appeared: “conservationism,” “concurrentism,” and “occasionalism.”
    step1: |-
      偶因论处理的另一问题，关乎神的因果与自然因果如何相关，用 Alfred Freddoso 的话说，即“神在自然中作用的一般问题”（Freddoso 1994, 131–5）[^freddoso-1994]。如 Freddoso 所指，该问题包括：若上帝终究是万物的第一因与直接原因，包括自然中发生与存在的一切，那么受造物是否还能有任何因果活动？若存在次级因果，这种因果活动又如何与神的因果活动相配？历史上对此有三种立场：“保存论”“并作论”“偶因论”。
    step2: |-
      偶因论处理的另一问题，关乎神的因果与自然因果如何相关；用 Alfred Freddoso 的话说，即“神在自然中作用的一般问题”（Freddoso 1994, 131–5）[^freddoso-1994]。它包括：若上帝终究是万物的第一因与直接原因，包括自然中发生与存在的一切，受造物还能有任何因果活动吗？若存在次级因果，它又如何与神的因果活动相配？历史上对此有三种立场：“保存论”“并作论”“偶因论”。
