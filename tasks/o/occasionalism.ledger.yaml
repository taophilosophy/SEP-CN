      The central idea is that God’s causal activity with regard to the production of a body is an “all or nothing” affair, in the sense that if God produces the body, God produces it with all of its specific modes or properties. In other words, though God need not create a body, as long as he does create or conserve it, he cannot do so without bringing about its specific spatial properties or modes. Why, we might ask, is this the case? Even if one grants that there can be no abstract or general Cartesian body, as it were—that is, a body that is extended in general without any specific spatial properties or modes—such that even God could not create such a body in the abstract, the concurrents could still wonder, why is it the case that the cause that gives the *esse* to a given body must also be the cause that produces its specific modes and properties as well? It is here that the CCC thesis provides the missing link. For if conservation is but continuous creation, in the sense that the character and degree of dependence is identical in the two cases, then insofar as there was total dependence at creation, there would have to be total dependence in conservation. Occasionalism with regard to bodies would follow. Given that God has a monopoly over producing both the body itself and its modes, no other cause is operative in bringing about any aspect of the world. Conservation is but continuous creation.
    step1: |-
      中心想法是：上帝产生物体的因果活动是“全有或全无”的事——若上帝产生该物体，便连同其全部特定样态或属性一并产生。换言之，上帝虽不必创造某个物体，但只要他创造或保存它，就不能不造成其特定的空间属性或样态。我们或可问：何以如此？即便承认不存在抽象的、一般的笛卡尔式物体——即在一般意义上广延而没有任何特定空间属性或样态的物体——以致连上帝也不能抽象地创造这样的物体，并作论者仍可追问：为何赋予某物体*存在*（*esse*）的原因，也必须是产生其特定样态与属性的原因？正是在此，CCC 论题提供了缺失的环节。因为若保存不过是持续创造，且两种情形中依赖的性质与程度相同，那么创造中既为完全依赖，保存中也必为完全依赖，关于物体的偶因论便随之成立。既然上帝垄断了物体本身及其样态的产生，便没有其他原因在造成世界任何方面起作用。保存不过是持续创造。
