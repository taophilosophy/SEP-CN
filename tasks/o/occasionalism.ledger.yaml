      Perhaps more serious is the following type of challenge by the concurrentist. The concurrentist at this point might protest and question whether and why the identity of conservation and creation need be taken in this manner. Given that the concurrentist wishes to maintain theological orthodoxy and endorse the CCC thesis as well, the concurrentist might suggest that an alternative understanding of the identity between creation and conservation is available in the following manner: to say that conservation is but continuous creation just is to say that the act of creation and conservation is but a numerically single act on the part of God, and thus it need not be the case that what God does, causally speaking, remains qualitatively the same throughout this one, continuous act. For example, one might take a single, continuous walk during which the pace is at times brisk, at times leisurely, but such difference in terms of exertion throughout the walk does not split the walk into two distinct acts.[^note-32] On such a model, the concurrentist could argue that she also agrees that conservation is continuous with creation and thus conservation and creation comprise a single, identical act, but the affirmation of the CCC thesis, cashed out in this way, need not imply that there is no creaturely contribution in moments of conservation. God, on this “continuous maintenance” reading (Winkler 2011, 301)[^winkler-2011] maintains the creature throughout its existence in a single, unified act, but what God does at the initial point of creation differs from what God does when he merely conserves the creature. Note that this “continuous maintenance” reading targets not only the “continuous recreation” reading but “qualitative identity” reading as well. For the latter two readings share the intuition that the identity in question is one in which divine causal contribution be thought to be qualitatively the same, regardless of whether it be in the form of recreation or not.
    step1: |-
      或许更严重的是并作论者的如下挑战。此时并作论者或抗议并追问：保存与创造的同一性是否、为何必须如此理解？既然并作论者既想维持神学正统，又想认可 CCC 论题，他或可提出另一种理解二者同一性的方式：说保存不过是持续创造，无非是说创造行为与保存行为在上帝方面是数目上单一的行为，因此，上帝在因果上所做之事，在这一单一持续行为中不必始终保持性质同一。例如，人可把一次连续的散步视为一个行为，其间步速时快时慢，但这种用力上的差异并不把这次散步分裂为两个不同行为。[^note-32] 按此模型，并作论者可以论证：她也同意保存与创造连续、二者构成单一而同一的行为；但如此兑现的 CCC 论题，不必蕴含保存时刻没有受造物贡献。按这种“持续维持”读法（Winkler 2011, 301）[^winkler-2011]，上帝以单一而统一的行为在受造物整个存在期间维持它，但上帝在创造起点所做之事，不同于其仅仅保存受造物时所做之事。请注意，这种“持续维持”读法不仅针对“持续重新创造”读法，也针对“性质同一”读法：后两种读法共享一个直觉——所涉同一性要求神的因果贡献在性质上相同，无论是否采取重新创造的形式。
