    kind: body
    source: |-
      If al-Ash‘ari was the first of the Islamic occasionalists, it was al-Ghazālī (c.1055–1111), the great philosopher and theologian of the Ash‘arite school, who presented some of the most significant and influential arguments for occasionalism in his influential work, *The Incoherence of the Philosophers* (*Tahâfut al-falâsifa*). This work has long been the source of the interpretation that al-Ghazālī himself was a committed global occasionalist, but recent interpretations have challenged this view, arguing that al-Ghazālī’s goal simply is to defend the possibility of miracles against the claims of the *falâsifa*, and that he leaves open the possibility of some kind of genuine causality in creatures (Griffel 2007)[^griffel-2007]. Notwithstanding this issue of whether al-Ghazālī was an occasionalist or not, no one doubts that al-Ghazālī found some key views of the *falâsifa* Avicenna (Ibn Sīnā, 980–1037) problematic and worthy of criticism. In particular, it seems to have been Avicenna’s “Aristotelian” approach to creaturely natures and powers that was most problematic for al-Ghazālī in rendering consistent with Ash‘arite *kalām*.[^note-1] The main point of tension seems to stem from the Avicennan view that, given the natures or essences of creatures, there are causally necessitating relations between creaturely causes and their effects such that the creaturely cause necessarily brings about the effect. Al-Ghazālī took this view to be in tension with the doctrinal claim that theological orthodoxy requires the possibility of miracles, which consist in the divine interruption of the ordinary course of events in nature. Thus, what worried al-Ghazālī most is the idea that if creatures genuinely necessitate their effects, this would seem to imply that even in the face of divine miraculous intervention, the natural effects would have to follow from the cause. But such an implication was unacceptable for those holding the standard understanding of divine omnipotence, which al-Ghazālī and other philosophers of the Ash‘arite theological tradition thought to be essential to *kalām*. Any natural necessitating relation resistant to the exercise of divine causal power was thought to be inappropriate, and thus causally necessitating relations, properly understood (that is, in ways consistent with divine omnipotence), are only instantiated in cases of divine causation. In addition to this theologically motivated argument, al-Ghazālī’s criticism of causally necessitating relations between creaturely causes and effects also incorporates his distinctive views on the modal relations between distinct entities or facts, according to which “the connection between what is habitually believed to be a cause and what is habitually believed to be an effect is not necessary” (*TF* 170) Al-Ghazālī’s central claim, as we will examine in more detail later, was that “each of the two things has its own individuality and is not the other, and neither the affirmation nor the negation, neither the existence nor the non-existence of the one is implied in the affirmation, negation, existence, and non-existence of the other” (Weinberg 1964, 123)[^weinberg-1964].[^note-2]
    step1: |-
      若说艾什尔里是伊斯兰偶因论者中的第一人，那么为偶因论提出若干最重要、最具影响论证的，则是安萨里（约 1055–1111）——艾什尔里派伟大的哲学家与神学家。其名著《哲学家的矛盾》（*Tahâfut al-falâsifa*）即在此列。长期以来，此书是“安萨里本人是彻底的全局偶因论者”这一解读的源头；但晚近解读对此提出挑战，认为安萨里的目标只是针对*法拉西法*（falâsifa，亚里士多德派哲学家）的主张捍卫奇迹的可能性，而他为受造物中某种真正的因果留有余地（Griffel 2007）[^griffel-2007]。无论安萨里是否偶因论者，无人怀疑他认为*法拉西法*阿维森纳（伊本·西那，980–1037）的一些关键观点有问题、值得批评。尤其是，阿维森纳对受造物本性与能力的“亚里士多德式”处理，似乎最难让安萨里觉得可与艾什尔里派凯拉姆相容。[^note-1] 紧张要点似乎源于阿维森纳的观点：给定受造物的本性或本质，受造原因与其结果之间存在因果必然化关系，受造原因必然造成结果。安萨里认为，这与“神学正统要求奇迹之可能”的教义主张相冲突——奇迹即神对自然事件常规进程的中断。于是，最令安萨里不安的是：若受造物真正必然化其结果，则即便面对神迹干预，自然结果仍须从原因推出。而这一蕴含，对持标准全能观者不可接受；安萨里与艾什尔里派神学传统的其他哲学家都认为，全能观对凯拉姆至关重要。任何能抵抗神之因果力运用的自然必然化关系，都被视为不当；因此，真正意义上的（即与神之全能相容的）因果必然化关系，只出现在神的因果作用中。除这一神学动机的论证外，安萨里对受造原因与结果之间因果必然化关系的批评，还融入了他关于不同实体或事实之间模态关系的独特看法：按之，“习惯上被认为的原因与习惯上被认为的结果之间的联系并非必然”（*TF* 170）。安萨里的核心主张——后文将详论——是：“两者各有其个体性，并非对方；其一之肯定或否定、存在或不存在，都不蕴含于另一方之肯定、否定、存在或不存在之中”（Weinberg 1964, 123）[^weinberg-1964]。[^note-2]
    step2: |-
      若说艾什尔里是伊斯兰偶因论者中的第一人，那么为偶因论提出若干最重要、最具影响论证的，则是安萨里（约 1055–1111）——艾什尔里派伟大的哲学家与神学家。其名著《哲学家的矛盾》（*Tahâfut al-falâsifa*）即在此列。长期以来，此书是“安萨里本人是彻底全局偶因论者”这一解读的源头；晚近解读则提出挑战，认为安萨里的目标只是针对*法拉西法*（falâsifa，亚里士多德派哲学家）的主张捍卫奇迹之可能，并为受造物中某种真正因果留有余地（Griffel 2007）[^griffel-2007]。无论安萨里是否偶因论者，无人怀疑他认为*法拉西法*阿维森纳（伊本·西那，980–1037）的一些关键观点有问题。尤其是阿维森纳对受造物本性与能力的“亚里士多德式”处理，似乎最难让安萨里觉得可与艾什尔里派凯拉姆相容。[^note-1] 紧张要点似乎在于阿维森纳的观点：给定受造物的本性或本质，受造原因与其结果之间存在因果必然化关系，受造原因必然造成结果。安萨里认为，这与“神学正统要求奇迹之可能”的教义主张相冲突——奇迹即神对自然事件常规进程的中断。最令安萨里不安的正是：若受造物真正必然化其结果，则即便面对神迹干预，自然结果仍须从原因推出。这一蕴含对持标准全能观者不可接受；安萨里与艾什尔里派神学传统的其他哲学家都认为，全能观对凯拉姆至关重要。任何能抵抗神之因果力运用的自然必然化关系都被视为不当；因此，真正意义上的（即与神之全能相容的）因果必然化关系，只出现在神的因果作用中。除这一神学论证外，安萨里对因果必然化关系的批评，还融入他关于不同实体或事实间模态关系的独特看法。按之，“习惯上被认为的原因与习惯上被认为的结果之间的联系并非必然”（*TF* 170）。其核心主张——后文详论——是：“两者各有其个体性，并非对方；其一之肯定或否定、存在或不存在，都不蕴含于另一方之肯定、否定、存在或不存在之中”（Weinberg 1964, 123）[^weinberg-1964]。[^note-2]
  - id: 9
