      We end with a brief look at what “ occasional causes” are and how occasionalists understand “occasional causation.”[^note-35] As we saw at the beginning of this entry, an occasionalist is someone who, within a relevant domain, denies that creaturely causes are genuine causes and holds that the unique genuine cause is God. This denial of the causal efficacy of creatures, however, is consistent with the recognition that some creaturely events and their types stand in peculiar relations, noteworthy enough to deserve a special status in the causal story of the world. Most prominent, particularly to those interested in causation, are the robust regularities found in the world, the very regularities that initiated our interest in causal connections in the first place. These regularities are of interest to the occasionalist as well, and it is for these regularities that the occasionalist employs the notion of occasional causes. Here is how Malebranche describes them:
