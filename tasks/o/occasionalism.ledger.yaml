  - id: 7
    kind: body
    source: |-
      Though the term “occasional cause” has been suggested as originating with the French philosopher Louis de la Forge (Carraud 2002, 347)[^carraud-2002], the first philosophers to explicitly expound the position were the Islamic occasionalists. Our brief discussion here will not be able to do justice to its complex and rich development, but Islamic occasionalism seems to have emerged when the theologians of the Ash‘arite school of *kalām* (Islamic doctrinal theology) began to consider the implications of the systematic reinterpretation, development, and integration of Aristotelianism and Neo-Platonism that occurred within the Islamic intellectual world in the tenth and eleventh centuries (cf. Adamson, P. & Taylor, R.C. 2005, 4–6). Among these Islamic occasionalists, al-Ash‘ari (873–935), the founder of Ash‘arite school, appears to have been particularly influential (Griffel 2007)[^griffel-2007].
    step1: |-
      虽有人提出“偶因”一词源自法国哲学家路易·德·拉福奇（Carraud 2002, 347）[^carraud-2002]，但最先明确阐发这一立场的哲学家是伊斯兰偶因论者。此处的简短讨论无法尽显其复杂而丰富的发展，但伊斯兰偶因论似乎兴起于这样一个时刻。当时，凯拉姆（*kalām*，伊斯兰教义神学）中艾什尔里派的神学家，开始考虑 10、11 世纪伊斯兰思想界对亚里士多德主义与新柏拉图主义所作系统重释、发展与会通的种种蕴含（参 Adamson, P. & Taylor, R.C. 2005, 4–6）。这些伊斯兰偶因论者中，艾什尔里派创始人艾什尔里（873–935）似乎尤具影响（Griffel 2007）[^griffel-2007]。
    step2: |-
      虽有人提出“偶因”一词源自法国哲学家路易·德·拉福奇（Carraud 2002, 347）[^carraud-2002]，最先明确阐发这一立场的哲学家却是伊斯兰偶因论者。简短讨论无法尽显其复杂而丰富的发展，但伊斯兰偶因论似乎兴起于这样一个时刻。当时，凯拉姆（*kalām*，伊斯兰教义神学）中艾什尔里派的神学家，开始考虑 10、11 世纪伊斯兰思想界对亚里士多德主义与新柏拉图主义所作系统重释、发展与会通的种种蕴含（参 Adamson, P. & Taylor, R.C. 2005, 4–6）。这些偶因论者中，艾什尔里派创始人艾什尔里（873–935）似乎尤具影响（Griffel 2007）[^griffel-2007]。
