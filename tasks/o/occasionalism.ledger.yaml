      关于安萨里论必然联系的讨论，以如下观察作结：若安萨里确认为真正次级因果与神的因果活动相容，他就须承认有不同类型的因果。因为他会承认：上帝的裁定与其结果之间的因果联系，与受造原因与其结果之间的因果联系，实质不同。前一类联系是一切可能因果联系中最强者，因为神之全能要求：凡逻辑上可能的事件，只要上帝裁定其发生，便以因果必然性发生。相反，受造原因显然缺乏这种全能力量，因此它们与其结果的因果联系，原则上不可能如神的裁定那样强。于是，神的因果与次级因果之间，因果联系的强度会大不相同；这一差异或使人怀疑：这两类因果能否被纳入单一而单义的因果概念。
