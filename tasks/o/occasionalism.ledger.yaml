      Géraud de Cordemoy’s work appears to have had a direct influence on Malebranche, as Malebranche himself acknowledges in the *Search* (*OCM* I 123/*Search* 49; Nadler 2005, 38; cf. Gouhier 1926 95ff.; Battail 1973, 146ff.)[^battail-1973][^gouhier-1926][^nadler-2005]. Though there has been some disagreement about the scope of Cordemoy’s occasionalism, the consensus seems to be that he was a global occasionalist, denying causal efficacy to both minds and bodies. Thus, in this respect, he is a precursor to Malebranche. Cordemoy is also known for a rather distinctive argument for why bodies are not real causes, one that employs the controversial premise that the motion of a body can be continued only by the causal agent that initiated it (*Discernement* 135–36; cf. Nadler 2005, 42)[^nadler-2005]. Based on the observation that bodies do not self-initiate movement, Cordemoy argues that bodies thus need to be set into motion by a non-material first mover (Nadler 2005, 42)[^nadler-2005]. But given the aforementioned premise, any subsequent movement of bodies can only be continued by the causal agent that initially moved them, which leads to the occasionalist conclusion that God is the cause of all bodily motion. This argument seems to be related to a slightly different argument employed by Malebranche to argue for the same conclusion—that is, the lack of causal efficacy of extended substances. This latter argument, which emphasizes the passivity or passive nature of bodies, is one of Malebranche’s favorites and will be examined in more detail later.
    step1: |-
      热罗·德·科尔德穆瓦的著作似对马勒布朗士有直接影响，马勒布朗士本人在《真理的寻求》中即予承认（*OCM* I 123/*Search* 49; Nadler 2005, 38；参 Gouhier 1926 95 页以下；Battail 1973, 146 页以下）[^battail-1973][^gouhier-1926][^nadler-2005]。关于科尔德穆瓦偶因论的范围虽有分歧，共识似乎是：他是全局偶因论者，否认心灵与物体的因果效力，就此而言是马勒布朗士的先驱。科尔德穆瓦还以一条颇为独特的论证闻名，说明物体为何不是真正的原因；该论证采用一个争议性前提：物体之运动只能由启动它的因果作用者延续（*Discernement* 135–36；参 Nadler 2005, 42）[^nadler-2005]。基于物体并不自行启动运动这一观察，他论证物体须由非物质的第一个推动者使之运动（Nadler 2005, 42）[^nadler-2005]。但按上述前提，物体此后任何运动都只能由最初使之运动的因果作用者延续，于是得出偶因论结论：上帝是一切物体运动之因。该论证似与马勒布朗士为同一结论——广延实体缺乏因果效力——所用的另一略有不同的论证相关；后者强调物体的被动性或被动本性，是马勒布朗士最偏爱的论证之一，后文将详论。
