      为马勒布朗士辩护一句，我们可指出：把必然联系等同于真正因果，他是在提出一种有吸引力的因果还原分析——我们因接触休谟著作而对之已不陌生。事实上，说我们部分因休谟而习惯这种“因果即必然联系”的清晰理解，并不牵强。但须注意，马勒布朗士时代的智识气候颇为不同：哲学家们正努力把握 16、17 世纪科学新发展所提出的理解因果本性的复杂任务；而且这一努力是在传统因果论——包含亚里士多德四因那令人困惑的杂多——的背景下进行的。与亚里士多德式构想相比，马勒布朗士的因果构想异常简单而统一，且无须面对“如此多样而不同的亚里士多德式原因如何纳入单一因果构想”这一问题。此外，有迹象表明，面对“为这种因果即必然联系的构想给出更好论证”的挑战，马勒布朗士或会像休谟一样指出：若因果不是必然联系，便难以设想它还能是什么。也就是说，他在《寻求》中说“*我所理解的*真正原因［*c’est ainsi que je l’etends*］，是心灵能知觉到它与结果之间有必然联系者”（*Search* 450，着重号为引者所加），这或许表明他已有近乎休谟的想法*——*尽管不如休谟那样清晰而有力*——*即若因果联系不是必然联系，我们对它就毫无概念。若如此，这一直觉或可为“某事件是真正原因当且仅当它与结果之间有必然联系”提供理据。但鉴于该主张在神在自然中作用这一语境下何等有争议，人们不禁要问：这一把必然联系等同于因果的核心主张，是否还能得到更多支持。[^note-23]
