      > 他主张次级原因什么也不造成，而是上帝独自在受造物之内、在其在场时造成一切效果：火不产生热，太阳不给光，而是上帝在其之内、在其在场时造成这些效果。因此……他主张，就“对结果产生影响”这一严格意义而言，次级原因并非原因；只有第一因才如此，次级原因应被称为*缺之不然*的原因（*sine qua non*），因为上帝已决定除非其在场才产生效果。……他还随皮埃尔·达伊主张：当上帝与火共同产生某效果时，其贡献不少于他独自产生同一效果——事实上更多：他不仅以火不在场时同样的并作产生热，还使火也以自己的方式成为热的原因（译文出自 Freddoso）。

