      We end our discussion of al-Ghazālī on necessary connections with the following observation: if al-Ghazālī does consider genuine secondary causation to be consistent with divine causal activity, he would have to concede that there are distinct types of causation. For al-Ghazālī would have granted that the causal connection between the decree of God and its effect is substantially different from the causal connection between a creaturely cause and its effect. The former type of connection would be the strongest of all possible causal connections, since divine omnipotence would require that for all events that are logically possible, should God decree their occurrence, they would come about with causal necessity. In contrast, creaturely causes obviously lack this omnipotent power, such that whatever causal connection they have to their effects, it cannot be, in principle, as strong as that of divine decree. So this suggests that the strength of the causal connection would differ substantially between divine causation and secondary causation, and this difference might lead one to wonder these two types of causation can be brought under a single, univocal notion of causation.
