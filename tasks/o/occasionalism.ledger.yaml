      With the help of the commonly accepted Scholastic assumption that any real being must either be a substance or mode, Malebranche presents a rather clever argument that active powers have no place in bodies (see Clatterbaugh 1999, 114–5)[^clatterbaugh-1999]. One might wonder what would be so bad with the first option—that is, that of granting the existence of a separate, distinct substance in bodies responsible for the bodies’ activity. But Malebranche’s response is clear: even if we bracket the worry of whether we could have a sufficiently clear idea of what kind of thing this substance would be, it is unlikely that this substance would be a Cartesian extended substance. For it would possess modes or properties other than relations of distance. And in discussing why the second option is going to fail, we see the explicit statement that, though an active power perhaps could be a mode of some *other* substance, it is not a mode that belongs to *bodies*, since forces or powers are not relations of distance.[^note-15]
    step1: |-
      借助经院哲学通行的假定——任何真实存在者要么是实体，要么是样态——马勒布朗士提出一个颇巧妙的论证，说明主动力量在物体中没有位置（见 Clatterbaugh 1999, 114–5）[^clatterbaugh-1999]。人们会问：第一个选项——承认物体中有一个独立而不同的实体负责物体的活动——究竟有什么不好？马勒布朗士的回答很清楚：即便悬置“我们能否对该实体是什么样有足够清楚的观念”这一顾虑，该实体也不太会是笛卡尔式广延实体，因为它会具有距离关系之外的样态或属性。至于第二个选项为何失败，我们看到他明确断言：主动力量或许可以是某种*别的*实体的样态，却不是属于*物体*的样态，因为力或力量不是距离关系。[^note-15]
