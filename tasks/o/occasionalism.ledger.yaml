      We might distinguish the three positions by the degree of causal activity assigned to God and the creature respectively, when a natural event takes place. At one end is conservationism, which keeps divine causal involvement to a minimum. According to conservationism, while God conserves substances with their powers in existence, when creatures are causally active in bringing about their natural effects, God’s contribution is remote or indirect. In other words, God’s causal contribution consists in merely conserving the being or *esse* of the creature in question along with its power, and the causal activity of the creature is in some straightforward sense the creature’s own and not God’s (Freddoso 1991, 554)[^freddoso-1991]. At the other end is occasionalism, where divine causal activity is maximal and creaturely causal activity is non-existent. For the occasionalist, divine causal activity is the only type of genuine causality. Creatures provide at most an occasion for God’s activity, which is uniquely direct and immediate in bringing about all effects in nature. Concurrentism (or “divine concurrentism”) can then be seen as occupying the middle ground. Concurrentists hold that when a natural effect is produced, it is immediately caused by *both* God *and* the creature. God and the creature are both directly involved and “concur” in bringing about the natural effects typically attributed to the creature.[^note-13]
    step1: |-
      不妨按自然事件发生时上帝与受造物各自被分派的因果活动程度，区分这三种立场。一端是保存论：它把神的因果参与保持在最低限度。按保存论，上帝保存实体及其力量于存在之中，而当受造物因果地造成其自然结果时，上帝的贡献是遥远或间接的；换言之，上帝的因果贡献仅在于保存相关受造物的存在（*esse*）及其力量，受造物的因果活动在某种直接意义上属于受造物自身，而非上帝（Freddoso 1991, 554）[^freddoso-1991]。另一端是偶因论：神的因果活动最大化，受造物的因果活动则不存在。对偶因论者而言，神的因果活动是唯一真正的因果；受造物至多为上帝的活动提供偶因，而上帝在造成自然中一切结果上是唯一直接而即刻的。并作论（或“神性并作论”）则可看作居间立场：并作论者主张，自然结果产生时，它由上帝*与*受造物*二者*直接造成；上帝与受造物都直接参与，并“共同”造成通常归于受造物的自然结果。[^note-13]
    step2: |-
      不妨按自然事件发生时上帝与受造物各自被分派的因果活动程度区分三者。一端是保存论：神的因果参与保持在最低限度——上帝保存实体及其力量于存在之中，而当受造物因果地造成自然结果时，上帝的贡献是遥远或间接的；换言之，上帝仅保存相关受造物的存在（*esse*）及其力量，受造物的因果活动在直接意义上属于受造物自身，而非上帝（Freddoso 1991, 554）[^freddoso-1991]。另一端是偶因论：神的因果活动最大化，受造物的因果活动则不存在。神之因果是唯一真正者，受造物至多为上帝的活动提供偶因；上帝在造成自然结果上是唯一直接而即刻者。并作论（或“神性并作论”）居间：自然结果产生时，它由上帝*与*受造物*二者*直接造成，二者都直接参与并“共同”造成通常归于受造物的自然结果。[^note-13]
