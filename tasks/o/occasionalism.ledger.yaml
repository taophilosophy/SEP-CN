      拉福奇的著作还有一点重要：他似乎是对此期最早依据上帝如何保存广延实体于存在之中来论证偶因论的人。该论证特别强调：上帝不仅须“继续产生［一个物体］，若他要在存在中保存它；而且还须亲自把它置于某处，因为他不能把它造在一切地方，也不能造在任何特定位置之外”（*TEH* 241；参 Nadler 1993b, 63; Nadler 1998, 219）[^nadler-1993b][^nadler-1998]。如后文所示，该论证与马勒布朗士为全局偶因论所作最有说服力的论证——“保存不过是持续创造”——极为相似。
