      Similar to what we had seen in al-Ghazālī, Malebranche’s core intuition appears to be that it is plainly possible for a creature to fail to bring about some effect that is typically thought to be within the purview of its causal powers. To deny such a possibility would entail a problematic restriction on divine omnipotence, or so Malebranche appears to be thinking. This is not to say that Malebranche is willing to expand divine omnipotence limitlessly, such that divine volition would have power over logical truths, for instance. In contrast to Descartes, Malebranche was against the doctrine of the creation of eternal truths. Certain truths for Malebranche hold of logical necessity: those truths whose denials are contradictory are independent of and insulated from divine volitional intervention. In this respect, he is in agreement with al-Ghazālī. For both philosophers, divine power extends to all and only that which is possible, that is, logically consistent.
