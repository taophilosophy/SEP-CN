  - id: 2
    kind: body
    source: |-
      Philosophers have long wondered about the nature of causality. Are there true causes at work in the world, and, if so, what makes them the causes they are? How do causes bring things about, and what kind of connection does a cause have to its effect? These questions took on another level of complexity when various religious and theological considerations were brought to bear on these issues. For instance, philosophers came to question how divine causal activity is to be understood, particularly, in relation to the natural causality of creatures. It is from this context, in which questions about the nature of causation intermixed with questions about the relation between divine and natural causality, that occasionalism emerged. Occasionalism attempts to address these questions by presenting as its core intuition the claim that, regardless of our common sense inclinations, God is the one and only true cause. In the words of the most famous occasionalist of the Western philosophical tradition, Nicolas Malebranche, “there is only one true cause because there is only one true God; … the nature or power of each thing is nothing but the will of God; … all natural causes are not *true* causes but only *occasional* causes” (*OCM* II, 312 / *Search* 448) A full-blown occasionalist, like Malebranche, then, might be described as one who subscribes to the following two tenets: (1) the positive thesis that God is the only genuine cause; (2) the negative thesis that no creaturely cause is a genuine cause but at most an occasional cause. Not all philosophers who have been identified as occasionalists, however, were full-blown occasionalists in this sense, since some argued that only a limited subset of creatures lack causal powers, and thus affirmed the causal efficacy of other creatures. For these occasionalists, the two theses just stated above would be too strong, and they would subscribe instead to a weaker position along the following lines: while God is the unique genuine cause in some restricted domain, other genuine creaturely causes are operative in the world, and not all creaturely causes are merely occasional causes.
    step1: |-
      哲学家早已在追问因果性的本性。世间是否有真正的原因在起作用？若有，是什么使它们成为其所是的原因？原因如何造成结果，又与结果有怎样的联系？当种种宗教与神学考量被引入这些问题时，它们又添了一层复杂性。例如，哲学家开始追问：神的因果活动应如何理解，尤其是它与受造物的自然因果的关系。偶因论正是在这一语境中出现的——关于因果本性的问题，同关于神与自然因果之关系的问题交织在一起。偶因论试图处理这些问题，其核心直觉是：无论我们的常识倾向如何，上帝是唯一真正的原因。借用西方哲学传统中最著名的偶因论者马勒布朗士之语：“只有一个真正的原因，因为只有一个真正的上帝；……每一事物的本性或力量无非是上帝的意志；……一切自然原因都不是*真正*的原因，而只是*偶*因”（*OCM* II, 312 / *Search* 448）。于是，像马勒布朗士这样的彻底偶因论者，可以说主张以下两点：（1）肯定论题：上帝是唯一真正的原因；（2）否定论题：没有任何受造原因真正是原因，至多只是偶因。不过，并非所有被认定为偶因论者的哲学家都是这种意义上的彻底偶因论者：有人主张只有有限的一部分受造物缺乏因果力，因而肯定其他受造物的因果效力。对这些偶因论者而言，上述两个论题都太强，他们宁可主张一种较弱的立场：上帝在某个受限领域内是唯一真正的原因，而其他真正的受造原因也在世间起作用，并非一切受造原因都只是偶因。
    step2: |-
      哲学家早已追问因果性的本性：世间是否有真正的原因在起作用？若有，是什么使它们成为其所是的原因？原因如何造成结果，又与结果有怎样的联系？当宗教与神学考量被引入，这些问题又添了一层复杂性：神的因果活动应如何理解，尤其它与受造物的自然因果是何关系？偶因论正是在这一语境中出现的：关于因果本性的问题，同关于神与自然因果之关系的问题交织在一起。偶因论的核心直觉是：无论常识倾向如何，上帝是唯一真正的原因。借用西方哲学传统中最著名的偶因论者马勒布朗士之语：“只有一个真正的原因，因为只有一个真正的上帝；……每一事物的本性或力量无非是上帝的意志；……一切自然原因都不是*真正*的原因，而只是*偶*因”（*OCM* II, 312 / *Search* 448）。像马勒布朗士这样的彻底偶因论者，可以说主张两点：（1）肯定论题：上帝是唯一真正的原因；（2）否定论题：没有任何受造原因真正是原因，至多只是偶因。但并非所有被认定为偶因论者的哲学家都如此彻底：有人主张只有有限的一部分受造物缺乏因果力，因而肯定其他受造物的因果效力。对这些偶因论者而言，上述两个论题都太强；他们宁可主张较弱的立场：上帝在某个受限领域内是唯一真正的原因，而其他真正的受造原因也在世间起作用，并非一切受造原因都只是偶因。
  - id: 3
    kind: body
    source: |-
      Given this diversity of positions, it might be helpful to characterize occasionalism as follows: one is an occasionalist for domain *x* iff one holds that God is the unique genuine cause within domain *x* and other alleged causes within this domain are not real causes but at most occasional causes. And by “domain” here, we refer to the roughly defined set of alleged causal relations under consideration, for instance, the domain of causal relations that hold between material or bodily substances. We will have more to say about what an occasional cause is later on, but, at this point, on the basis of the characterization of occasionalism just given, we might introduce some terminology to refer to and differentiate the different possible positions among those who subscribe to some form of occasionalism. We will refer to the occasionalists who endorse the full-blown version, along the lines of Malebranche, and take the negative thesis that no creature cause is a genuine cause to apply across the board to all finite substances as advocating “global occasionalism.” Global occasionalism, accordingly, holds that all creaturely causation is at most occasional, while divine causation is uniquely genuine. In contrast, those who are willing to endorse some genuine causation on the part of creatures, hence restricting occasional causation to only a limited domain will be described as endorsing a form of “local occasionalism.” (Lee 2008)[^lee-2008]
    step1: |-
      鉴于立场如此多样，不妨这样刻画偶因论：某人在领域 *x* 上是偶因论者，当且仅当他主张，上帝是领域 *x* 内唯一真正的原因，该领域内其他所谓原因并非真正的原因，至多只是偶因。这里的“领域”，指所考虑的那组大致划定的所谓因果关系，例如物质实体或物体实体之间的因果关系领域。偶因究竟是什么，后文再详；但在此，依据刚给出的刻画，不妨引入一些术语，用以指称并区分信奉某种偶因论者之间的不同可能立场。我们称像马勒布朗士那样主张彻底版本、并把“没有任何受造原因真正是原因”这一否定论题普遍适用于一切有限实体的人，为倡导“全局偶因论”者。据此，全局偶因论主张：一切受造因果至多只是偶因，而神的因果则独一无二地真实。相反，愿意承认受造物有某种真正因果、因而把偶因因果限制在有限领域内的人，则被描述为信奉某种“局部偶因论”。（Lee 2008）[^lee-2008]
    step2: |-
      鉴于立场如此多样，不妨这样刻画：某人在领域 *x* 上是偶因论者，当且仅当他主张上帝是领域 *x* 内唯一真正的原因，该领域内其他所谓原因并非真正原因，至多只是偶因。此处“领域”指所考虑的一组大致划定的所谓因果关系（如物体实体间关系）。偶因究竟是什么，后文再详；先引入一些术语，用以指称并区分信奉偶因论者的不同立场。像马勒布朗士那样主张彻底版本、并把“没有任何受造原因真正是原因”这一否定论题普遍适用于一切有限实体者，称为倡导“全局偶因论”者。据此，全局偶因论主张一切受造因果至多只是偶因，神的因果则独一无二地真实。相反，愿意承认受造物有某种真正因果、因而把偶因因果限制在有限领域内者，则信奉某种“局部偶因论”。（Lee 2008）[^lee-2008]
