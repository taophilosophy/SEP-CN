      Here we get something close to a generalized version of the key claim of the CCC argument in the *Dialogues* that God cannot will that an extended substance exist, “without at the same time willing that it exist either here or there and without His will placing it somewhere” (*OCM* XII 156/*Dialogues* 110): only he who gives being could be able to give the ways of being. And, importantly, this principle is said to be applicable to the “ways of being of minds.”[^note-33] In effect, we are presented with an explicit denial of the possibility that God’s sustaining activity of the being or *esse* of a creature can be separated from his activity of bringing about the modes of the creature, regardless of whether the creature is an extended or thinking substance. Hence, the CCC argument seems to be fully applicable to the modes or ways of the being of the minds, just like bodies.
