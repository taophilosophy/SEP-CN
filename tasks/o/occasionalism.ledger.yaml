      However, some have suggested that identifying conservation with creation *ex nihilo* this closely effectively pushes us to regard conservation as continuous *recreation*, where the creature that is supposedly “conserved” falls out of existence instantaneously before it is repeatedly *recreated*.[^note-30] Interestingly, this “continuous recreation” reading seems well-motivated from the occasionalist perspective. If one wants to enforce a strict identity between conservation and creation, why not go all out and take conservation to be recreation *ex nihilo*, in which case the absence of any cause other than God will be guaranteed, thereby automatically securing the occasionalist thesis? On this reading as continuous recreation, conservation is in fact the continuous resuscitation of the creature from the void of non-existence, into which the creature is thrust instantaneously after its momentary existence. Some, such as Winkler, have suggested that the continuous recreation reading of the CCC thesis would indeed do the work of establishing occasionalism, since at every moment of conservation, there would literally be no creature around, as it were, to cooperate as a concurring cause.”[^note-31] Continuous creation as recreation, however, raises a number of concerns, including the question of whether the transtemporal identity of creatures can be maintained. For, on the recreation model, the previous creature *ex hypothesi* goes out of existence, and another one is created anew and the two would then seem to be numerically distinct.
    step1: |-
      然而有人提出，如此紧密地把保存同一于*无中生有*的创造，实际上迫使我们把保存看作持续的*重新创造*。据称得到“保存”的受造物在瞬时之间落出存在，随后反复被*重新创造*。[^note-30] 有趣的是，这种“持续重新创造”读法从偶因论视角看似乎很有理据。若有人要在保存与创造之间强求严格的同一性，何不一不做二不休，把保存看作*无中生有*的重新创造？如此便可保证除上帝外别无原因，从而自动确保偶因论论题。按这种“持续重新创造”的读法，保存实际上是受造物从不存在之虚空中得到持续复苏：受造物在其瞬时存在之后，随即被抛入这一虚空。Winkler 等人提出，CCC 论题的“持续重新创造”读法确能确立偶因论，因为在每一保存时刻，可以说根本没有受造物在旁充当并作因。[^note-31] 然而，把持续创造看作重新创造会引出若干顾虑，包括受造物的跨时间同一性能否维持。因为在重新创造模型下，先前的受造物*按假定*已落出存在，另一个被重新创造出来，二者似乎便在数目上不同。
