      But is it obvious that powers or forces are not relations of distance? This question along with the questions about how powers or forces relate to the more obvious properties of extension—for instance, size and shape—raise interesting and important questions that go to the heart of the PN argument. The main intuitive thrust behind Malebranche’s PN argument is to convince the reader that, if we understand the Cartesian conception of matter or extension properly, we can see that motive force or power is neither necessary nor sufficient for being an extended substance.[^note-16] This view seem rather close to Descartes’ original insight that having specific spatial features and standing in particular spatial relations to other bodies are both necessary and sufficient conditions to be a bodily substance,[^note-17] and Malebranche takes this to imply that whether these bodies further possess a motive force is an issue peripheral to the basic nature of bodies. Such a view seems to be expressed in his discussion of motion and rest in the *Search*:
    step1: |-
      但“力或力量不是距离关系”显然吗？此问连同“力或力量与广延更明显的属性（如大小与形状）如何相关”之问，提出了直抵 PN 论证核心的有趣而重要的问题。马勒布朗士 PN 论证的主要直觉推力在于说服读者：若正确理解笛卡尔式的物质或广延概念，就能看出运动力或力量既非成为广延实体的必要条件，也非充分条件。[^note-16] 这一看法似相当接近笛卡尔的原始洞见：具有特定空间特征、并与其他物体处于特定空间关系，是成为物体实体的充分必要条件；[^note-17] 马勒布朗士由此认为，这些物体是否还拥有运动力，是与物体基本本性无涉的问题。这种看法似在《寻求》论运动与静止处有所表达：
