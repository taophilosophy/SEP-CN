      How then would Berkeley account for the apparent interaction between physical objects we common experience, such as the stove in my kitchen boiling a pot of water? According to Berkeley, this phenomenon is to be understood as God causing the relevant sensations in us in a regular fashion, and this regularity underwrites what we typically take to be the laws of nature (PHK 30).[^note-9] Thus, within the domain of physical objects, Berkeley appears to think that God is the unique genuine cause, consistent with our characterization of occasionalism. There has been, however, some controversy in recent secondary literature as to whether one’s own body is to be included in this domain of physical objects. Some (such as McDonough 2008)[^mcdonough-2008] have argued against this inclusion, while others (such as Lee 2012)[^lee-2012] have argued that we, as finite spirits, have no genuine causal input in the movement of our own bodies, and such movement is directly caused by God like any other physical object for Berkeley.[^note-10]
    step1: |-
      那么，贝克莱如何解释我们日常经验的物理对象之间的表面交互，比如我厨房里的炉子把一壶水烧开？按贝克莱，这一现象应理解为上帝以规则的方式在我们心中引起相关感觉，而这种规则性支撑着我们通常所说的自然律（PHK 30）。[^note-9] 于是，在物理对象领域内，贝克莱似乎认为上帝是唯一真正的原因，这与我们对偶因论的刻画一致。不过，晚近二手文献对“自己的身体是否也属于这一物理对象领域”有争议：有人（如 McDonough 2008）[^mcdonough-2008] 反对纳入；另有人（如 Lee 2012）[^lee-2012] 主张，作为有限精神，我们对自己身体的运动并无真正因果输入，此类运动如贝克莱眼中任何其他物理对象一样，由上帝直接造成。[^note-10]
