      Al-Ghazālī’s target is the “Aristotelian philosopher”, exemplified by Avicenna, who affirms strict causal necessitation relations between creaturely causes and their effects. A central motivation behind this criticism is to secure the possibility of miracles reported in the Qur’ân and the prophetic traditions that were considered impossible by these philosophers oriented towards “Aristotelianism” (*TF* 166; cf. Marmura 2005, 146)[^marmura-2005].
