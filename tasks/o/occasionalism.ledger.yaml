      The criticism of positing “necessary connections” between creaturely powers and their alleged effects also emerged in medieval Christian Europe, most notably, in the work of Nicholas of Autrecourt (1300–d. after 1350). Autrecourt was a precursor to the general criticism of Scholasticism that swept through Europe in the early modern period, and his critique of our alleged knowledge of causal connections was part of his overall project of critically examining the various knowledge claims within natural philosophy that were central to Aristotelian scholasticism. But his criticisms might have been too radical for his time, for he was summoned to the Curia at Avignon to answer charges of error and heresy, and in 1347 his writings were publicly burned. He himself is said to have been banned from lecturing (Weinberg 1964, 267)[^weinberg-1964].
    step1: |-
      对受造力量与其所谓结果之间“必然联系”的批评，也出现在中世纪基督教欧洲，最著名的是奥特勒库尔的尼古拉（1300–1350 年后卒）的著作。奥特勒库尔是近代早期席卷欧洲的经院哲学总批判的先驱；他对我们所谓因果联系知识的批评，是他批判性审查自然哲学中各种知识主张这一总体工程的一部分，而这些主张对亚里士多德式经院哲学至关重要。但他的批评或许过于激进：他因被控错误与异端而被召至阿维尼翁教廷，1347 年其著作被当众焚毁；据说他本人亦被禁止授课（Weinberg 1964, 267）[^weinberg-1964]。
