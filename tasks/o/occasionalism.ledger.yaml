      Johannes Clauberg (1622–1655) has been identified by some as one of the first philosophers influenced by Descartes to argue for occasionalism with regard to mind-body interaction on the basis of their radical heterogeneity (Bardout 2008b)[^bardout-2008b]. With regard to other domains, such as body-body causation, the majority consensus appears to be that he rejected occasionalism, and allowed bodily substances to be causally efficacious (Nadler 2011)[^nadler-2011]. Even with regard to his occasionalism concerning mind-body interaction, his position has been suggested to be rather nuanced. Schmaltz, for instance, has argued that Clauberg’s occasionalism is restricted to the direction of body to mind, such as in the case of sensations arising in accordance with bodily changes, since there are textual grounds to think that Clauberg endorsed some type of genuine causality on the part of our volitions in the case of our voluntary control over our bodies (Schmaltz 2016, 180-1)[^schmaltz-2016]. Given our characterization of occasionalism at the outset, however, even this restricted version might not qualify Clauberg’s position as occasionalist, since most scholars agree that Clauberg thinks that it is the soul itself that causes the relevant sensations on the occasion of certain bodily changes. That is, Clauberg does not think that it is God that is unique genuine cause behind the occurrence of our sensations, a view he would have to hold were he to satisfy the requirements of occasionalism as we have specified it (Schmaltz and others well acknowledge this point). Clauberg’s significance then might best be thought of as presenting the explicit rejection of bodily changes being genuine causes of changes in the mind (Bardout 2008b, Schmaltz 2016)[^bardout-2008b][^schmaltz-2016]. The complexity of Clauberg’s views can be seen as an example revealing how intricate and finely nuanced the diverse position came to be in the face of the complex considerations that were operative in this period.
    step1: |-
      约翰内斯·克劳贝格（1622–1655）被一些人认定为最早受笛卡尔影响、依据心灵与身体的极端异质性就心身交互论证偶因论的哲学家之一（Bardout 2008b）[^bardout-2008b]。就其他领域（如物体—物体因果）而言，多数共识似认为他拒斥偶因论，容许物体实体具有因果效力（Nadler 2011）[^nadler-2011]。即便就心身交互的偶因论而言，其立场也被认为相当细致。例如 Schmaltz 论证，克劳贝格的偶因论限于由身到心这一方向，如随身体变化而生者；因为文本上有理由认为，在我们对身体的自愿控制中，克劳贝格肯定我们的意志具有某种真正因果（Schmaltz 2016, 180-1）[^schmaltz-2016]。不过，按本文开头的刻画，即便这一受限版本也未必使克劳贝格的立场合格为偶因论：多数学者同意，克劳贝格认为是在某些身体变化之际由灵魂本身引起相关感觉。也就是说，他并不认为我们感觉背后的唯一真正原因是上帝——若他要满足我们所规定的偶因论要求，本须持此说（Schmaltz 等人也充分承认这点）。克劳贝格的重要性，或许最好理解为：他明确拒斥身体变化是心灵变化的真正原因（Bardout 2008b, Schmaltz 2016）[^bardout-2008b][^schmaltz-2016]。其观点的复杂，可视为一例，显示面对此期种种复杂考量，各种立场变得何等错综而细致。
