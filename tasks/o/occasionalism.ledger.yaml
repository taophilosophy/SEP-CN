      马勒布朗士在此假定：在*无中生有*的创造中，上帝不仅是受造物存在或*esse* 之因，也是其样态之因——大概因为在*无中生有*的创造行为之前，并不实际存在任何其他可能原因。因此，既然他把上帝的保存活动看作在性质上同一于其*无中生有*的创造活动，他似乎就在论证：即便在受造物被保存的情形中，上帝也是其*esse* 与样态的唯一原因。既然在*无中生有*的创造中，受造物的样态原则上不可能被因果过度决定——因为*无中生有*意味着创造行为之前不存在任何原因——那么，若受造物在保存情形中对上帝的依赖同一于*无中生有*创造的情形，则保存中样态的产生便不可能有过度决定。此时并作论者或许回应：并作论者也否认过度决定的受造原因，因为他们的要点是受造物是受造物样态的*并作*因：上帝与受造物的因果贡献都不冗余，因为二者都以某种方式必需。但请注意：若*无中生有*的创造行为确应理解为蕴含上帝是受造物*esse* 与样态的唯一原因，且保存在因果相关方面在性质上同一于持续的*无中生有*创造，那么并作论者就须要么拒斥 CCC 论题，要么对*无中生有*创造中发生之事另作解释。[^note-29] 因为若这种理解持续创造的方式排除了过度决定因，它也排除了并作因。
