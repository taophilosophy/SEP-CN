      [^note-35]: One word of caution about how “occasional causation” is being used in the literature. Steven Nadler uses the term in a different, distinct sense:

      > what I am calling ‘occasional causation’ does not require any substantial likeness between cause and effect, and does not involve any kind of influx or communication. In the technical sense of the term, then, no real influence occurs between cause and effect. But occasional causation does, however, constitute a real causal relationship and not just accidental, sequential conjunction. Thus, in a somewhat broader (hence, weaker) sense, there is an ‘influence’ of cause upon effect, but not of a transeunt efficient nature.
      >
      > In simple terms, a relationship of occasional causation exists when one thing or state of affairs brings about an effect by inducing (but not through efficient causation...) another thing to exercise its own efficient causal power. The relationship of occasional causation unites one thing or state of affairs with an effect wrought (through efficient causation, immanent or transeunt) by another thing. Thus, the term denotes the entire process whereby one thing, A, occasions or elicits another thing, B, to cause e.(Nadler 1994, 39)[^nadler-1994]

      Thus, for Nadler, “occasional causation” consists in a genuine causal relation, wherein the occasional cause “induces” something else to exercise its own causal power to produce a given effect. In contrast, by “occasional causation,” I take the relation between the occasional cause and effect to not be a genuine causal relation. That is, “occasional causation,” as I will be using it, refers to the quasi-causal relationship that holds between an occasional cause and its effect, standardly characterized by robust regularity but not genuine causation.
    step1: |-
      [^note-35]: 关于文献中如何使用“偶因因果”，须提醒一句。Steven Nadler 在另一种不同意义上使用该词：

      > 我所谓的“偶因因果”，并不要求原因与结果之间有任何实体上的相似，也不涉及任何流入或传递。按该词的技术意义，原因与结果之间并无真正的影响发生。但偶因因果确实构成真正的因果关系，而不只是偶然的先后连结。因此，在稍宽（因而较弱）的意义上，存在原因对结果的“影响”，但不是外在动力因性质的影响。
      >
      > 简言之，当一物或一事态通过引起（但不是通过动力因……）另一物行使自身的动力因果力而造成结果时，就存在偶因因果关系。偶因因果关系把一物或一事态同另一物所造成（通过内在或外在动力因）的结果联结起来。因此，该词指称这样整个过程：一物 A 引发或诱发另一物 B 去造成 e。（Nadler 1994, 39）[^nadler-1994]

      可见对 Nadler 而言，“偶因因果”构成真正的因果关系：偶因“诱发”另一物行使自身因果力以产生某结果。相反，我所谓“偶因因果”，指偶因与结果之间的关系并非真正因果关系。也就是说，我将使用的“偶因因果”，指偶因与其结果之间的准因果关系——通常以强健规则性为特征，却不是真正因果。
