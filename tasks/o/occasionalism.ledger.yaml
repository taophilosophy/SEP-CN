      The overdetermination of modes, thus, cannot be ruled out on the mere grounds that such overdetermination involves a malignant type of causal overreach on the part of creatures, overflowing into the exclusive divine realm of providing *esse*. For the proponents of overdetermination are taking the creaturely power to be restricted to that of bringing about a creature’s modes. The creature therefore would not share in the power of the *causa secundum esse*, and what power the creature would have to produce modes or modifications would be effective only insofar as the creature’s being or *esse* has been produced by God. Hence, the critical dependence of the creature’s *esse* or being on God is maintained. It is in this sense that cases of overdetermination of modes might present a noteworthy challenge to the advocates of occasionalism arguing on the basis of the CCC thesis.
    step1: |-
