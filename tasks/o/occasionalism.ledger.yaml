      If Geulincx and Al-Ghazālī (and, arguably, even Malebranche) did hold KP to be applicable to chairs and rocks as well as thinking substances, our next question then is why they would hold such a counter-intuitive view. Nadler has made the interesting suggestion that the wide-scope application of KP could have been motivated by the view that takes “volitional agency to be *the* paradigm of causality” (Nadler 1999, 270)[^nadler-1999]. Why take volitional agency to be paradigmatic? According to Nadler, the critical link is divine causal activity, which was the paradigmatic case of causality for the occasionalists in question. For if we take God’s causal activity to be fundamentally intentional and volitional in character, then it seems indeed a short step to taking volitional agency to be also paradigmatic of causality.
    step1: |-
      若赫林克斯与安萨里（甚至可说马勒布朗士）确实认为 KP 也适用于椅子和岩石，而不只是思维实体，下一个问题便是：他们为何持这种反直觉的看法？Nadler 提出一个有趣的建议：KP 的宽范围适用，可能受到“把意志作用视为因果性的*典范*”这一看法的推动（Nadler 1999, 270）[^nadler-1999]。为何以意志作用为典范？按 Nadler，关键环节是神的因果活动，因为对相关偶因论者而言，这才是因果性的典范情形。若我们把上帝的因果活动看作根本上是有意的、意志性的，那么把意志作用也视为因果性的典范，确实只有一步之遥。
