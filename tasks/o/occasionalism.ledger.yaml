      In contrast to the situation concerning Descartes’ alleged commitment to occasionalism, there is no disagreement in the case of Nicolas Malebranche, whose works provide some of the most extensive and important discussions of occasionalism. Thus, his arguments will be the topic of further examination. But in addition to Malebranche, there were a number of other Cartesians, prior to Malebranche, that presented a variety of views indicative of the occasionalist current in the 1660s. Among these Cartesians, the French physician and philosopher Louis de la Forge (1632–66), the Parisian lawyer and philosopher Géraud de Cordemoy (1614–83), the German theologian and philosopher Johannes Clauberg (1622–55), and the Dutch philosopher Arnold Geulincx (1624–69) are the most prominent.
