      Understood in this manner, occasionalism can be understood as a metaphysics of causation that suggests a more discriminating attitude toward what are typically taken to be causal interactions operative in this world. On this characterization, the occasionalist resists a univocal understanding of these apparent causal interactions and identifies two types of relations in the world, that of genuine causation and that of occasional causation. In addition to this issue of the scope of occasionalism, we will, in the following sections, examine how occasionalism addresses these issues aforementioned concerning the relation between divine and natural causation, and what arguments are presented in favor of occasionalism. We begin, however, with a brief discussion about its history.
    step1: |-
      这样理解，偶因论便是一种因果性的形而上学：它对我们通常视为世间实际起作用的因果交互，采取一种更具分辨力的态度。按这一刻画，偶因论者拒绝用单义的方式理解这些表面上的因果交互，而在世间识别出两类关系：真正因果关系与偶因因果关系。除偶因论的范围问题外，下文各节还将考察偶因论如何处理前述神与自然因果之关系的问题，以及为偶因论提出了哪些论证。不过，我们先简短讨论其历史。
