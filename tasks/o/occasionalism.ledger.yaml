      继续之前，不妨简短考察 CCC 论题何以被如此广泛接受为正统观点，办法是看拒斥它会带来什么蕴含。在 CCC 论题支持者看来，拒斥它的最重要后果是：神在创造时的因果活动，与神在保存时刻的因果活动明显不同，而这一差异足以否认两种行为的同一性。于是，保存*不是*持续创造。把这一差异兑现的一种直觉方式——也是杜兰都斯等“单纯保存论者”的做法——是认为：虽说在创造时刻，从因果上讲上帝做了一切该做之事，但在后续保存时刻，上帝做得更少，只把受造物保存在存在之中。按保存论者，上帝在保存中如何做得更少？在保存时刻，若被造成的是非神迹的自然事件，则该事件的*直接、即刻*原因是受造原因，而非神。即便对保存论者，上帝也参与其中，但只是以*中介的、间接的方式*——可以说，上帝在幕后运作，使受造原因保持存在，让受造物以直接、即刻的方式行使其因果力。例如，煤气灶的火使咖啡壶中的水沸腾，则水的沸腾由火直接而即刻地造成，即便完全承认火的存在须由上帝直接保存。于是，按单纯保存论者，上帝保存火、火又直接即刻地烧开水，上帝便以中介而遥远的方式参与烧水。上帝*仅仅*保存火（与水），并不直接造成水沸腾。从当代视角看，这种间接而中介的参与，或足以给神的因果在自然中应有的位置。但晚期经院与近代早期的有神论哲学家，认为这种确保神之因果角色的方式，在神学上不足而可疑。主要顾虑似乎是：认为创造一旦过去，受造物对上帝的依赖便有所减弱，这从根本上歪曲了受造物在其存在*全程*中对上帝的关键依赖——无论创造还是保存。因为就受造物的依赖而言，保存与创造根本相同；这些哲学家似如此想：无论保存与创造之间还有什么别的差异，那些差异都无足轻重。正是从这一视角，正统观点肯定保存与创造的同一性。[^note-25]
