      Interestingly enough, this power of the soul is described as not being a power that produces modifications, which is an expression of Malebranche’s attempt to reconcile the positing of such powers in minds with his occasionalism about minds. That is, insofar as all powers that bring about changes in modes are in God, and merely non-modal powers are in the creature, then Malebranche seems to be thinking that such non-modal powers of creatures are consistent with his occasionalism. This, however, raises the question of whether such non-modal powers are robust enough to anchor the free will and moral responsibility of thinking substances.[^note-34]
