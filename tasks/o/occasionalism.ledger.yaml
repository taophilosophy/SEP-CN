      La Forge’s work is also significant in that he seems to have been the first in this period to present an argument for occasionalism on the basis of how God conserves an extended substance in existence. This argument puts particular emphasis on the fact that God must not only “continue to produce [a body], if he wants to preserve it in existence; but, in addition, because he cannot create it everywhere nor outside of any particular place, he must himself put it in a place” (*TEH* 241; cf. Nadler 1993b, 63; Nadler 1998, 219)[^nadler-1993b][^nadler-1998]. As we shall see, this argument bears a strong resemblance to Malebranche’s most persuasive argument for global occasionalism, the “conservation is but continuous creation” argument.
