      Given Malebranche’s influence on the development of occasionalism, a substantial portion of the section on the arguments for occasionalism will be devoted Malebranche’s views. Here we simply note that Malebranche appears to have been committed to occasionalism from early on in his philosophical career, since his occasionalism emerges clearly in his first major work, *The Search for Truth* (*De la recherche de la vérité*, 1674–75). In addition to the *Search*, Malebranche in the *Elucidations to the Search* presents a long defense of his occasionalism against objections. And in the *Dialogues* we get Malebranche’s second major work to discuss the thesis of occasionalism centrally. Whether or in what way Malebranche’s views were influenced by earlier occasionalists, as discussed earlier, will not be centrally addressed here, given the limitations of space.[^note-7] We will however compare some of Malebranche’s arguments with his predecessors when relevant.
