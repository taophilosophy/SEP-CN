      We should note, however, that the overall focus of Autrecourt’s project was to persuade us that our various judgments about the natural world, including those concerning genuine causal connections, lack certainty, and that we thus ought to suspend judgment in such matters. And it is with this goal in mind that he presented a variety of epistemological, metaphysical, and theological arguments to support this skeptical stance toward affirming genuine causality among creatures. Therefore, while Autrecourt’s arguments much resemble the arguments deployed by occasionalists, it is far from clear that Autrecourt himself was an occasionalist. For his overall attitude seems to have been closer to that of a skeptic, in contrast to the “dogmatic” position of the occasionalists, who unequivocally denied creaturely causation and affirmed divine causation. In this respect, the often quoted epithet that Autrecourt was “the fourteenth-century Hume” seems rather appropriate (Nadler 1996, 458)[^nadler-1996]. If Autrecourt was indeed more skeptical than dogmatic about God’s role in nature, we might think that, in the Western philosophical tradition, occasionalists in the proper sense of the term emerge in earnest in the wake of René Descartes (1596–1650) in the form of “Cartesian occasionalists”. [^note-3]
    step1: |-
      然而须注意，奥特勒库尔工程的总体目标，是说服我们：关于自然界的各种判断——包括关于真正因果联系的判断——缺乏确定性，因此我们应在此类事情上悬置判断。正是抱着这一目标，他提出种种认识论的、形而上学的与神学的论证，以支持这种对肯定受造物间真正因果的怀疑立场。因此，尽管奥特勒库尔的论证与偶因论者所用论证颇为相似，他本人是否偶因论者却远不清楚。他的总体态度似乎更接近怀疑论者，而偶因论者则持“独断的”立场，断然否认受造因果、肯定神的因果。就此而言，常被引用的那句评语——“奥特勒库尔是 14 世纪的休谟”——似乎相当贴切（Nadler 1996, 458）[^nadler-1996]。若奥特勒库尔对上帝在自然中的角色确实更近怀疑而非独断，那么我们或可认为：在西方哲学传统中，严格意义上的偶因论者是在勒内·笛卡尔（1596–1650）之后才真正出现的，即“笛卡尔派偶因论者”。[^note-3]
