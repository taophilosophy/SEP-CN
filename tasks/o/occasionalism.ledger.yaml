      This “knowledge principle” (hereafter “KP”) raises a number of questions. One question concerns the scope of its applicability. For the principle to be plausible, it might be thought, one ought to restrict it to intelligent, volitional agents. As long as we accept the traditional conception of the will as being “blind” on its own and dependent on the guidance of the intellect, we might think that there is something to be said for the claim that we can only bring about what we know. That is, bringing about a volitional effect seems to presuppose our intending the effect, and we seem to intend only what we, through our intellect, actually represent or know. While most commentators seem to favor reading Malebranche as restricting the knowledge principle to minds, there is, as Steven Nadler has argued, at least one passage that seems to suggest that Malebranche is endorsing the wide scope applicability of KP (*Conversations Chrétiennes*, OCM 4:15–6). And, as Nadler has also pointed out, Geulincx and some Islamic occasionalists indeed pressed the view that the principle applies ubiquitously to all cases of genuine efficacy (Nadler 1999, 263–74)[^nadler-1999].
    step1: |-
      这一“知识原则”（下称“KP”）引出若干问题。一是其适用范围。要使该原则可信，人们会想，应把它限于有理智、有意志的作用者。只要我们接受传统看法——意志本身是“盲的”，有赖理智引导——或许会认为，“我们只能造成我们所知道的东西”这一主张有几分道理：造成一个意志结果，似乎预设我们意欲该结果，而我们似乎只意欲那些经由理智实际表象或知道的东西。多数评论者倾向于认为马勒布朗士把知识原则限于心灵；但如 Steven Nadler 所论，至少有一段文字似乎表明马勒布朗士赞同 KP 的宽适用范围（*Conversations Chrétiennes*, OCM 4:15–6）。Nadler 还指出，赫林克斯与一些伊斯兰偶因论者确实主张该原则普遍适用于一切真正效力情形（Nadler 1999, 263–74）[^nadler-1999]。
