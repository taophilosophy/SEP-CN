      When my body is injured, I subsequently feel pain. This pain, according to Malebranche, is due to the “general and efficacious law of the union of soul and body” that God has established, and, thus, this injury is the occasional cause of the pain I feel. Occasional causes, as noted earlier, are just those events of a certain type on the occurrence of which God wills to be bring about an instance of distinct, yet commonly conjoined, event type, such that these two types of events are naturally correlated with robust regularity. In fact, on the occasionalist scheme almost every event that occurs in our world will turn out to be both an occasional cause and effect in that it will be part of the vast network of regularities that we observe. That is, any given effect that follows from an occasional cause will, in turn, most likely be the occasional cause for the following, subsequent effect. Thus, even on the occasionalist picture, there are hardly any events that fail to be part of this network of causal regularities, and such regularity is possible because the overwhelming majority of events in the world are guided by God’s general volitions, which are determined by general laws that have been established by God. Note that this last qualification—that the general laws themselves are established by God—marks a critical difference between an occasionalist like Malebranche and an Aristotelian essentialist about creaturely causal powers. For the latter holds that certain effects follow necessarily from the creature’s causal essence, while Malebranche rejects such causal essences and denies any such necessary connection that holds directly between a creaturely cause and effect.[^note-36]
    step1: |-
      当我的身体受伤，我随后感到疼痛。按马勒布朗士，这疼痛源于上帝所立“灵魂与身体结合的一般而有效法则”，故这次受伤是我所感疼痛的偶因。如前所述，偶因正是那些某类事件：它们发生时，上帝意欲造成另一类虽不同却常相联结的事件之一例，从而使两类事件以强健规则性自然相关。事实上，按偶因论方案，世间发生的几乎每一事件都会既是偶因又是结果，因为它会是我们所观察到的庞大规则性网络的一部分。也就是说，由偶因引起的任何给定结果，多半又会成为后继结果的偶因。于是，即便在偶因论图景中，也几乎没有事件不属于这一因果规则性网络；这种规则性之所以可能，是因为世间绝大多数事件都由上帝的一般意志引导，而一般意志由上帝所立的一般法则决定。注意最后这一点——一般法则本身由上帝所立——标示出马勒布朗士这样的偶因论者与关于受造因果力的亚里士多德式本质主义者之间的关键差异：后者主张某些结果必然从受造物的因果本质推出，马勒布朗士则拒斥此类因果本质，并否认受造原因与结果之间有任何此类直接必然联系。[^note-36]
