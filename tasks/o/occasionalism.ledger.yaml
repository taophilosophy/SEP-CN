      Not surprisingly, Malebranche also has some theologically motivated reasons for rejecting such rich conceptions of natures as well. He appears to find the idea that divine efficient causality is bound by natures of creatures to be rather problematic: “when one thinks about the idea of God, i.e., of an infinitely perfect and consequently all-powerful being, one knows that there is such a connection between His will and the motion of all bodies, that it is impossible to conceive that He wills a body to be moved and that this body not be moved” (*OCM* II 313/*Search* 448). In other words, were there a conceptually necessary connection between body A moving body B in a particular way, then even if God were to will body B to move in a different manner, given the assumed conceptually necessary connection that holds between body A and body B, God’s volition would fail. But this is impossible, Malebranche is arguing, given the proper understanding of divine omnipotence. So, for Malebranche, the proper understanding of divine omnipotence dictates the absence of conceptual entailments that determine specific movements.
