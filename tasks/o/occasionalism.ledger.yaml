      The central point seems as follows: given that all the properties of extension are exhausted by relations of distance, it would be a category mistake, as it were, to ascribe powers to bodies. Powers or forces are not properties that bodies can have at all, since powers do not consist in relations of distance. That is, that something possesses a motive force and, thus, moves a body or affects a mind would entail that the thing in question is not a body, since there would be more to this thing than relations of distance. The key premise here is that causal powers or forces are not relations of distance and, hence, not modes that bodies possess. This assumption gets expressed more explicitly in the following argument, which reinforces the understanding of bodily “passivity” as the body’s being constituted by relations of distance alone:
    step1: |-
