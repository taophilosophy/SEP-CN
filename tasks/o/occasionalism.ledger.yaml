      The extent of George Berkeley’s occasionalism is also a matter of some controversy. But there is general agreement among interpreters that Berkeley was an occasionalist with regard to the causal powers of physical objects. That is, physical objects for Berkeley are not causally active in bringing about any events in the world. This denial is not surprising, if we consider the basic makeup of physical objects in Berkeley’s ontological scheme, along with his views about the passivity of ideas. For, according to Berkeley, physical objects, properly understood, are but bundles or collections of ideas, and ideas are manifestly passive—no power or activity is perceived in them (PHK 25).[^note-8]
    step1: |-
      乔治·贝克莱偶因论的程度也颇有争议。但解读者普遍同意：就物理对象的因果力而言，贝克莱是偶因论者。也就是说，按贝克莱，物理对象在造成世间任何事件上并无因果活动。若考虑贝克莱本体论框架中物理对象的基本构成，以及他关于观念被动性的看法，这一否认并不奇怪。因为按贝克莱，正确理解的物理对象只是观念的束或集合，而观念明显是被动的——在其中知觉不到任何力量或活动（PHK 25）。[^note-8]
