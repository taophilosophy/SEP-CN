      The second question about KP concerns the plausibility of the principle itself. Even if we just consider the best case scenarios—that is, when its application is restricted to thinking substances—it is not obvious that KP is without problems. As mentioned earlier, on the assumption that volitional power is blind, the requirement that the intentional agent possess some degree of knowledge of the effect does not seem completely implausible in and of itself. The key issue, however, concerns the level of detail in the description of the intended outcome that is required for KP to be satisfied. For instance, returning to Malebranche’s example, when I intentionally will to raise my arm, I do seem to represent the outcome of my arm going up, insofar as the description of this outcome is left at a fairly general level. It is obvious, however, that I do not have knowledge of the outcome, if the description of the outcome is at the level of detail that Malebranche wants it to be, such that it would involve the movements of the minute components of my arm, such as the minute organic matter making up the muscle, nerves, bones, etc. So depending on the level of description, one might think that I do satisfy KP. For the NK argument to work, then, Malebranche has to restrict the description of outcomes in KP to the highest level of detail. And it is not clear that Malebranche can provide non-question begging reasons to support this restriction.
    step1: |-
      关于 KP 的第二个问题，是该原则本身的可信度。即便只考虑最佳情形——即限于思维实体——KP 是否有问题也非显然。如前所述，在意志力是盲的这一假定下，要求有意作用者对结果有某种程度的知识，本身似不完全不可信。然而关键问题在于：要满足 KP，对预期结果的描述须精细到何种程度。例如，回到马勒布朗士之例，当我故意要举起手臂，我似乎确实表象了手臂上举这一结果——只要该结果的描述停留在相当一般的层次。但我显然并不具有对该结果的知识——若按马勒布朗士所要求的精细程度描述结果，以致涉及我手臂微小组成部分的运动，如构成肌肉、神经、骨骼等的微小有机物质。因此，视描述层次而定，人们会认为我确实满足 KP。要 NK 论证成立，马勒布朗士便须把 KP 中对结果的描述限制到最精细层次；而他能否给出非窃题的理据支持这一限制，并不清楚。
