      [^note-31]: Winkler goes on to note that this reading of continuous creation, that is, continuous creation as continuous *recreation* is what gives the continuous creation thesis its hold over him, if at all:

      > I am therefore left thinking that what gives continuous creation its hold over me is the threat it presents to the preexistence of substantial causes. Even if God’s causal role (contrary to both the immanent variant and the first transeunt variant) leaves a place for a collaborating finite being, I have trouble seeing how a finite substance that comes into being at the very same moment as the effect can be a productive cause of it. The substance may help to render the effect intelligible, but if it does so only because God adjusts the world to accommodate it, the real productive work seems to be the privilege of God alone. (Winkler 2011, 300)[^winkler-2011]
    step1: |-
      [^note-31]: Winkler 接着指出，正是把持续创造读作持续*重新创造*，才使持续创造论题对他有吸引力——若有的话：

      > 因此我仍认为，持续创造之所以对我有吸引力，在于它对实体原因在先存在构成威胁。即便上帝的作用（无论与内在变体还是与第一种外在变体相反）为协作的有限存在者留出位置，我也难以看出：一个与结果同时刻产生的有限实体，如何能成为它的生产性原因。该实体或有助于使结果可理解；但若它之所以如此，只是因为上帝调整世界以容纳它，那么真正的生产性工作似乎仍是上帝独有的特权。（Winkler 2011, 300）[^winkler-2011]
