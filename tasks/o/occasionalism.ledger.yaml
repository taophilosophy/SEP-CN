      An occasional cause here is described as determining God “to act in such and such a manner in such and such a situation.” The central idea is that when an event of a certain type occurs, a distinct event of a different type is brought about by divine volition, such that a regular, law-like relation holds between two types of events, each exemplified by the occasional cause and its effect respectively. A common misunderstanding about occasionalism is that if it is divine causality that anchors what occurs in the world, such grounding of natural events will render their occurrences rather irregular and haphazard. Perhaps it is the unpredictability of our own volitional activity that precipitates this assumption that volitions do not provide stable foundations for regularity. As we seen above, however, occasionalists accept the regularity of natural events as much as any realist about creaturely powers. The link that allows occasionalists to endorse regularity while grounding such regularity in divine volitions is their view that the divine volitions in question have a stable, law-like structure, thus being general in character. Here again is Malebranche:
    step1: |-
      此处偶因被描述为促使上帝“在此情此景下以如此这般的方式行动”。中心想法是：当某类事件发生时，另一不同类的事件由神之意志造成，从而使两类事件之间保持规则性的、类律的关系；两类事件分别由偶因及其结果例示。关于偶因论的一个常见误解是：若以神的因果为世间所发生之事的根据，这种对自然事件的奠基会使它们的发生颇为不规则而偶然。或许正是我们自己意志活动的不可预测，促成了“意志不能为规则性提供稳定基础”这一假定。然而如我们所见，偶因论者与任何关于受造力量的实在论者一样，都接受自然事件的规则性。使偶因论者既认可规则性、又把规则性奠基于神之意志的环节，是他们的看法：所涉神之意志具有稳定的、类律的结构，因而在性质上是一般的。马勒布朗士再次说道：
