      [^note-36]: What happens when a body collides with another body? Is it not the case that such an event must necessarily be followed by either the first body rebounding or the second body giving up its initial location? This fascinating question is the core issue between an exchange between Malebranche and Fontenelle. See Schmaltz 2008b for an excellent discussion of related issue. Also relevant is the discussion in footnote 22 of this entry.
    step1: |-
      [^note-36]: 当一物体与另一物体碰撞时会发生什么？这样的事件难道不必然继之以第一个物体反弹、或第二个物体让出其初始位置吗？这一引人入胜的问题，是马勒布朗士与丰特奈尔之间往复的核心议题。相关问题的出色讨论见 Schmaltz 2008b；另可参见本词条注 22 的讨论。
