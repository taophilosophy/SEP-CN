      Given the examples in *TF* 170, we see that al-Ghazālī does not take the state of affairs in which, say, a live fire does not burn a dry piece of cotton to be impossible. For, according to al-Ghazālī, there is no logical entailment relation between the cotton coming into contact with the fire and its burning. Hence, it is logically consistent to suppose that cotton not burn when it comes into contact with fire.
