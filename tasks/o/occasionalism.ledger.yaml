      In the case of La Forge, his credentials as an occasionalist about the causal efficacy of extended substances or bodies has never been in doubt. In fact, as noted earlier, it is La Forge who has been suggested to have first employed the expression “occasional cause” in his *Traité de l’esprit de l’homme* (Carraud 2002, 347)[^carraud-2002], where he argues that bodies are merely the “remote and occasional” causes of our ideas of them (*TEH* 132–4). Some interpreters have argued that La Forge’s occasionalism extended to minds as well and thus was a global occasionalist (Prost 1907, ch.6; Bouillier 1865, vol. 1, 503, 513; cf. Nadler 1993b, 60, especially footnote 11)[^nadler-1993b][^prost-1907], but others have argued against this view (Bardout 2002a, 145; Nadler 1993b, 60–61)[^nadler-1993b]. The case for restricting the scope of La Forge’s occasionalism to only extended substances seems well grounded, if we take into consideration such texts as the following: “All of our ideas considered in themselves in so far as they are only different ways of thinking, need … no cause for their production other than our mind” (*TEH* 177; cf. Nadler 1993b, 65)[^nadler-1993b].
    step1: |-
      就拉福奇而言，他作为广延实体或物体之因果效力的偶因论者，资格从无疑义。事实上，如前所述，正是拉福奇被指为在《论人的心灵》中最早使用“偶因”一词者（Carraud 2002, 347）[^carraud-2002]；他在该书论证，物体只是我们关于物体之观念的“遥远而偶然的”原因（*TEH* 132–4）。一些解读者主张，拉福奇的偶因论也延伸到心灵，故他是全局偶因论者（Prost 1907, 第 6 章；Bouillier 1865, 第 1 卷, 503, 513；参 Nadler 1993b, 60，尤其注 11）[^nadler-1993b][^prost-1907]；另一些人反对（Bardout 2002a, 145; Nadler 1993b, 60–61）[^nadler-1993b]。若考虑如下文本，则把拉福奇偶因论的范围限于广延实体的主张似有充分根据：“我们的一切观念，就其自身之为不同的思维样式而言，其产生只需……我们的心灵这一原因”（*TEH* 177；参 Nadler 1993b, 65）[^nadler-1993b]。
    step2: |-
