      The main strategy of this argument is to establish the thesis of occasionalism by drawing out the implications of the commonly held theological principle that “conservation is but continuous creation.”[^note-24] If the main premise of the NNC argument—that is, the premise that genuine causation just consists in necessary connection—would have been resisted by many concurrentists, the strategy behind the CCC argument holds more promise in that the CCC thesis was widely accepted by the majority of theists in our time period, including the concurrentists. The issue of how to interpret the CCC thesis, however, is at the center of the dispute, since occasionalists like Malebranche deny creaturely causation *because* they accept the CCC thesis, while concurrentists like Leibniz affirm genuine creaturely causation *despite* upholding the CCC thesis.
