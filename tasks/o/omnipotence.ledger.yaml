  - id: 7
    kind: body
    source: |-
      This quotation suggests that omnipotence can be defined as infinite power. Leaving aside for the moment the historical question of how Locke understood infinite power, let us explore the suggested definition of omnipotence in the light of the prevailing mathematical understanding of infinity.
    step1: |-
      这段引文提示，全能可定义为无限力量。暂时撇开洛克如何理解无限力量这一历史问题，我们不妨在当代数学对无限的理解之下，考察这一全能定义。
    step2: |-
      这段引文提示：全能或可定义为无限力量。洛克本人如何理解“无限力量”，这一历史问题暂且不论；下面在当代数学的无限观下检验这一定义。
  - id: 8
    kind: body
    source: |-
      This mathematical understanding of infinity views it through the lens of transfinite arithmetic. Transfinite arithmetic presupposes that there are infinitely many natural numbers. According to transfinite arithmetic, the cardinal number of the set of natural numbers is $\aleph_0$ (aleph-null). (A *cardinal number* is a number that can be used to answer the question “ How many?”) In other words, if it is asked “ How many natural numbers are there?”, the correct answer is $\aleph_0$.
    step1: |-
      这种数学理解透过超限算术的透镜来看无限。超限算术预设自然数有无穷多个。按超限算术，自然数集合的基数是 $\aleph_0$（阿列夫零）。（*基数* 是能用来回答“多少？”这一问题的数。）换言之，若问“自然数有多少个？”，正确答案是 $\aleph_0$。
    step2: |-
      这种数学理解借超限算术来看无限，而超限算术预设自然数无穷多。按超限算术，自然数集的基数为 $\aleph_0$（阿列夫零）。（*基数* 即用来回答“多少个”的数。）换言之，若问“自然数有多少个”，正确答案是 $\aleph_0$。
  - id: 9
    kind: body
    source: |-
      The founder of transfinite arithmetic, Georg Cantor (1845–1918), is also a founding father of set theory. He famously proved that *the set of real numbers* has a *larger* cardinal number than *the set of natural numbers*; the set of reals has the same cardinality as the *power set* (*the set of all subsets*) of the set of naturals. Cantor further argued that $\aleph_0$ is the *first* (and smallest) transfinite cardinal number in an infinite series of increasingly larger transfinite cardinals, $\aleph_0,$ $\aleph_1,$ $\aleph_2$, and so on. But note that the numerical subscripts of these alephs do not refer to cardinal numbers, but rather refer to *ordinal* (or ordering) *numbers*, e.g., first, second, third, and so forth. According to Cantor, there is no largest transfinite cardinal number, and although there are infinitely many transfinite cardinal numbers, there is no cardinal number of them. Rather, the totality of transfinite cardinals is *absolutely infinite* in a *sui generis* non-arithmetical sense. Similarly, in Zermelo-Fraenkl set theory (ZF), and its extension ZFC (ZF + the axiom of choice), the totality of transfinite cardinal numbers does not qualify as a *set* having a definite cardinal number of members. Such a set would be too large; were such a set to exist, paradoxical consequences would ensue akin to Russell’s paradox. ZF avoids these paradoxical consequences by characterizing the totality of transfinite cardinals as an infinitely large *proper class*. Within the forms of axiomatic set theory that have attracted significant support it cannot be proved that one proper class is larger than another.
    step1: |-
      超限算术的创立者格奥尔格·康托尔（1845–1918）也是集合论的奠基人之一。他指出证明：*实数集合* 的基数 *大于* *自然数集合* 的基数；实数集的基数与自然数集的 *幂集*（*一切子集的集合*）相同。康托尔进一步论证说，$\aleph_0$ 是一无穷序列中 *第一个*（也是最小的）超限基数，该序列为 $\aleph_0,$ $\aleph_1,$ $\aleph_2$ 等等，基数逐级增大。但要注意，这些阿列夫的下标并不指基数，而指 *序数*（或排序数），即第一、第二、第三等等。按康托尔之说，不存在最大的超限基数；尽管超限基数无穷多，却没有一个以它们为元素的基数。毋宁说，超限基数的总体在一种 *自成一类* 的非算术意义上是 *绝对无限* 的。类似地，在策梅洛—弗兰克尔集合论（ZF）及其扩展 ZFC（ZF＋选择公理）中，超限基数的总体不算作具有确定成员基数的 *集合*。这样的集合会太大；若它存在，就会产生类似罗素悖论的悖谬后果。ZF 通过把超限基数的总体刻画为无穷大的 *真类* 来避开这些后果。在获得重要支持的各种公理化集合论形态中，都无法证明一个真类比另一个真类更大。
    step2: |-
      超限算术的创立者格奥尔格·康托尔（1845–1918）同时也是集合论的奠基人之一。他著名地证明了：*实数集* 的基数 *大于* *自然数集* 的基数，而实数集的基数恰与自然数集的 *幂集*（*一切子集之集*）相同。康托尔还论证：$\aleph_0$ 是逐级增大的超限基数序列 $\aleph_0,$ $\aleph_1,$ $\aleph_2$……中的 *第一个*（也是最小的）；这些阿列夫的下标并非基数，而是 *序数*（排序数），即第一、第二、第三……。按康托尔之说，没有最大的超限基数：超限基数虽无穷多，却没有一个以它们全体为元素的基数；超限基数之总体在一种 *自成一类* 的非算术意义上是 *绝对无限*。同样，在策梅洛—弗兰克尔集合论（ZF）及其扩展 ZFC（ZF＋选择公理）中，超限基数的总体不构成具有确定成员基数的 *集合*：这样的集合过大，一旦存在便会引出类乎罗素悖论的悖谬。ZF 的对策，是把超限基数之总体刻画为无限大的 *真类*。在各类获得重要支持的公理化集合论中，都无法证明一个真类大于另一个真类。
  - id: 10
    kind: body
    source: |-
      Transfinite cardinals may be used to quantify an amount of energy or force, e.g., $\aleph_0$ joules, or $\aleph_0$ newtons. Or they may be be used to state the cardinal number of a totality of objects, e.g., $\aleph_2$ states of affairs. Thus, one [first] way in which ‘power’ might be interpreted is as a power (or range of powers) to produce an energy or force quantified by a transfinite cardinal. One such option is that ‘infinite power’ means the power to produce a *specific* transfinite quantity of joules or newtons, e.g., $\aleph_0$. The other option is that ‘infinite power’ means the power to produce *any* transfinite quantity of joules or newtons, i.e., $\aleph_0,$ $\aleph_1,$ $\aleph_2,$ and so on *ad infinitum*. A third, more radical option, is that ‘infinite power’ means the power to produce *more* joules or newtons than can be quantified by *any* transfinite cardinal number. Such energy or force would appear to qualify as energy or force than which none greater is possible.
    step1: |-
      超限基数可用来量化能量或力的大小，例如 $\aleph_0$ 焦耳，或 $\aleph_0$ 牛顿。它们也可用来陈述对象总体的基数，例如 $\aleph_2$ 个事态。于是，对“力量”的一种 [第一种] 可能解释，是产生由某个超限基数所量化的能量或力的力量（或力量范围）。其中一种选项是：“无限力量”指产生 *某一特定* 超限数量的焦耳或牛顿的力量，例如 $\aleph_0$。另一选项是：“无限力量”指产生 *任何* 超限数量的焦耳或牛顿的力量，即 $\aleph_0,$ $\aleph_1,$ $\aleph_2$ 等等 *以至无穷*。第三种更激进的选项是：“无限力量”指产生 *多于任何* 超限基数所能量化的焦耳或牛顿的力量。这样的能量或力，似乎可算作“不可能有比之更大的”能量或力。
    step2: |-
      超限基数可用来量化能量或力，例如 $\aleph_0$ 焦耳或 $\aleph_0$ 牛顿；也可用来陈述对象总体的基数，例如 $\aleph_2$ 个事态。于是，“力量”的第一种解释，是产生由某超限基数所量化的能量或力的力量（或其范围），其中又有三种选项：(一)“无限力量”指产生 *某一特定* 超限数量焦耳或牛顿的力量，例如 $\aleph_0$；(二) 指产生 *任何* 超限数量焦耳或牛顿的力量，即 $\aleph_0,$ $\aleph_1,$ $\aleph_2$……*以至无穷*；(三) 更激进地说，指产生 *多于任何* 超限基数所能量化的焦耳或牛顿之力——这样的能量或力，似乎就算得上“不可能有比之更大者”。
  - id: 11
    kind: body
    source: |-
      The alternative way of interpreting ‘infinite power’ is as the power to bring about infinitely many states of affairs. The three options relevant to this interpretation of ‘infinite power’ parallel the three options just described. First, that ‘infinite power’ is the power to bring about a *specific* transfinite cardinal number of states of affairs. Second, that ‘infinite power’ is the power to bring about *any* transfinite cardinal number of states of affairs. Third, that ‘infinite power’ is the power to bring about *more* states of affairs than *any* transfinite cardinal number can quantify.
    step1: |-
      对“无限力量”的另一种解释，是造成无穷多事态的力量。与这一解释相关的三个选项，与刚才所述的三个选项平行。第一，“无限力量”是造成 *某一特定* 超限基数个事态的力量。第二，“无限力量”是造成 *任何* 超限基数个事态的力量。第三，“无限力量”是造成 *多于任何* 超限基数所能量化的事态的力量。
    step2: |-
      另一种解释把“无限力量”理解为造成无穷多事态的力量，其三个选项与前一种解释平行：一，造成 *某一特定* 超限基数个事态；二，造成 *任何* 超限基数个事态；三，造成 *多于任何* 超限基数所能量化的事态。
  - id: 12
    kind: body
    source: |-
      The standard view is that there is no greatest transfinite cardinal, and that there are proper classes containing more objects than can be quantified by any transfinite cardinal. Moreover, there could *not* be an agent who has *greater* power than an omnipotent agent. Thus, with regards to the two interpretations offered, there is some reason to conclude that in each case the *third option* is best.
    step1: |-
      标准观点认为，不存在最大的超限基数，且存在所含对象多于任何超限基数所能量化的真类。此外，*不可能* 有哪个行动者的力量 *大于* 全能行动者。因此，就所提出的两种解释而言，有理由认为在每种情形中 *第三个选项* 最佳。
    step2: |-
      标准看法是：不存在最大的超限基数；也存在真类，其所含对象多于任何超限基数所能量化。再者，*不可能* 有哪个行动者的力量 *大于* 全能者。因此就这两种解释而言，每种情形下都宜取 *第三个选项*。
  - id: 13
    kind: body
    source: |-
      However, a philosopher who has *positivistic or naturalistic leanings* might argue that one should posit transfinite cardinals of *only* those sizes required by prevailing *scientific theories*. Arguably, the prevailing theory of the s*pace-time continuum* in physics is committed to the existence of infinite sets which have the cardinality of the set of space-time points contained within such a continuum (which is at least $\aleph_1$). If an argument of that sort is correct, this scientific theory is, in addition, committed to the existence of the power set of the foregoing set of space-time points – which is needed to accommodate continuous and discontinuous linear paths. (This power set has the cardinality of the set of mathematical functions from reals to reals.) But scientific theories do *not* appear to require the existence of any set *larger than* that power set. So, a philosopher who has positivistic inclinations might tentatively conclude that the cardinal number of this power set (which is at least $\aleph_2$) is in fact *the largest cardinal*. In a related vein, W. V. O. Quine dismisses “excessive” magnitudes, for instance, “$\beth_\omega$ and inaccessible numbers,” as mere fancies of “recreational mathematics” bereft of of ontological import (Quine 1986, p. 400; cf. Quine 1960, Ch. 7)[^quine-1960][^quine-1986]. If a reader is unfamiliar with Quine’s illustrations of scientifically gratuitous magnitudes, please note that $\beth_0 = \aleph_0$, $\omega$ (omega) is $\aleph_0$’s [infinite] *ordinal* counterpart, i.e., $\aleph_0$ is the $\omega^{\text{th}}$ cardinal number, and $\beth_\omega$ is the $\omega^{\text{th}}$ iteration of the power set of $\beth_0$; *inaccessible numbers* (roughly speaking) are (putative) uncountable large cardinals which cannot be derived *via* summations of, or power set operations on, smaller cardinals. Quine judges that such magnitudes exceed the theoretical demands of the empirical sciences because admitting them would not contribute to the simplification of our scientific computations and generalizations. Even so, there is a view of the cumulative set-theoretical hierarchy to which Quine seems (reluctantly) willing to accede, at least in part because it provides a “convenient cut-off” limiting the extent of that hierarchy. According to this view, all sets are *constructible* (in a sense defined by Kurt Gödel) from more elementary sets, a position significantly more restrictive than is needed to avoid the known set-theoretical paradoxes. But, arguably, when examining omnipotence, given its robust theological and metaphysical dimensions, a less positivistic or naturalistic, more expansive, criterion of ontological commitment is appropriate. After all, it would be natural to assume that the Supreme Being has the power to create any number of possible worlds governed by different laws of nature. Given that assumption, it appears that an omnipotent agent’s power would not be circumscribed by theoretical scientific laws governing the actual world.
    step1: |-
      然而，一位 *带有实证主义或自然主义倾向* 的哲学家可能论证说，人们只应设定通行 *科学理论* 所需的那些大小的超限基数。可以说，物理学中通行的 *时空连续统* 理论承诺存在这样的无限集，其基数等于该连续统所含时空点的集合的基数（至少为 $\aleph_1$）。若这类论证正确，该科学理论还承诺存在上述时空点集合的幂集——这是容纳连续与不连续线性路径所必需的。（该幂集的基数等于从实数到实数的数学函数集合的基数。）但科学理论似乎 *并不* 要求存在 *大于* 该幂集的任何集合。于是，有实证主义倾向的哲学家或可姑且断定：该幂集的基数（至少为 $\aleph_2$）事实上 *就是最大的基数*。与此相关，蒯因把“$\beth_\omega$ 与不可达数”这类“过度”量值斥为“娱乐数学”的幻想，毫无本体论意义（Quine 1986, p. 400; cf. Quine 1960, Ch. 7）[^quine-1960][^quine-1986]。若读者不熟悉蒯因所举这些科学上多余的量值，须知：$\beth_0 = \aleph_0$，$\omega$（欧米伽）是 $\aleph_0$ 的 [无限] *序数* 对应物，即 $\aleph_0$ 是第 $\omega^{\text{th}}$ 个基数，而 $\beth_\omega$ 是 $\beth_0$ 的幂集运算的第 $\omega^{\text{th}}$ 次迭代；所谓 *不可达数*（大致说来）是（据称的）不可数大基数，它们不能通过较小基数的求和或幂集运算得出。蒯因判断，这类量值超出经验科学的理论需要，因为承认它们无助于简化我们的科学计算与概括。尽管如此，对于累积集合论层级的某一种看法，蒯因似乎（不情愿地）愿意接受，部分原因是它提供了一个限制该层级范围的“便利截断”。按此看法，一切集合都可以从更基本的集合 *可构成地*（在库尔特·哥德尔所定义的意义上）得到——这一立场比避免已知集合论悖论所需的限制要严格得多。但可以说，在考察全能时，鉴于其厚重的神学与形而上学维度，取一种不那么实证主义或自然主义、更为扩张的本体论承诺标准才是恰当的。毕竟，很自然地会假定最高存在者有力量创造任意数量、受不同自然律支配的可能世界；有此假定，全能行动者的力量似乎便不受支配现实世界的理论科学定律所限。
