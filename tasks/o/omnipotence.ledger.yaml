      ## 5. Omnipotence and Divine Moral Perfection
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      It may be argued that the traditional God has incompatible attributes, namely, necessary existence, essential omnipotence, essential omniscience, and essential moral perfection. The contention has been that it is impossible for God to have the power to bring about evil, while non-omnipotent (and morally imperfect) beings may have this power. The precise form of such an argument varies depending on what precisely the relation between God and evil is assumed to be. However, generally speaking, it is argued that divine moral perfection and omnipotence are incompatible because divine omnipotence entails that God has the power to bring about evil, whereas divine moral perfection entails that God is powerless to bring about evil.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      One can respond to arguments of this kind as follows. Assume that if God exists, then this is a best possible world.[^note-7] In that case, if God exists, there could not be an evil unless it were necessary for some greater good, in which case any state of affairs containing evil incompatible with there being a maximally good world is *impossible*. But it be may be assumed that it is not possible for *any* agent to bring about an impossible state of affairs. Thus, if God exists, any moral evil, that is, any evil brought about by anyone, and any natural evil, or any evil which has an impersonal, natural cause, must be necessary for some greater good.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Suppose that God exists and that some other person, for example, Cain, brings it about that an evil, *E*, exists. There are two possibilities that need to be considered here. The first is that Cain’s decisions and actions are causally determined, as are all occurrences in the created universe. Then, given our assumptions, since Cain’s bringing it about that *E* exists is necessary for some good which more than compensates for *E*’s existence, it is consistent with God’s moral perfection that God [remotely] brings it about that Cain brings it about that *E* exists.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      The second possibility is that Cain’s decision to do evil is uncaused by anything other than Cain and free in the libertarian sense. In that case, God did *not* [remotely cause Cain freely to] bring it about that *E* exists, while [let us assume] Cain *did* freely bring it about that *E* exists. If so, then it must be the case that God’s creating Cain and permitting Cain freely to do what he chooses to do [in the context of the entire creation] brings about more good than his *not* creating Cain and thus *not* permitting him freely to do what he chooses to do. It might be objected that if Cain can bring about a state of affairs that God cannot, namely, *that E exists*, then God is not omnipotent. But, as we have seen, an agent’s being omnipotent does not require of that agent that it be able to bring about *every* state of affairs which *any* other agent can bring about. It *does*, of course, require that an omnipotent agent have more power than any other agent. And God, of course, *would* have more power than Cain, even though Cain could bring about something that God could not. For there are many more states of affairs that God could bring about and that Cain could not, than *vice versa*. At this point, it might further be objected that an omnipotent agent, one that was morally imperfect, who *could* bring it about that *E* exists, as well as all the other states of affairs that God could bring about, would be more powerful than God. But recall that if God exists, then he exists eternally in every possible world. Recall, too, that apparently there cannot be more than one omnipotent agent. Thus, it appears that if God exists, then an omnipotent agent who is morally imperfect is *impossible*. Thus, this second objection is based on an assumption that seems to be impossible, namely, that if God exists there could exist another omnipotent agent who is morally imperfect and who is therefore more powerful than God.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Of course, if God exists, then any evil state of affairs, *s*, which *is* incompatible with a maximally good world is *impossible*. And if *s* is impossible, then neither God nor any other agent has the power to bring it about that *s* obtains. God would lack the power to bring it about that *s* obtains because of his moral perfection, and any created agent would lack the power to bring it about that *s* obtains either because (i) God would not create an agent who had the power to bring it about that *s* obtains, or (ii) God would not permit any created agent to bring it about that *s* obtains. Thus, to the extent indicated, if God’s attributes impose moral restrictions on the nature of the universe and on what he can bring about, then they impose parallel restrictions on what any other agents can bring about.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      This line of reasoning implies that God’s moral perfection and omnipotence are compatible so long as God is taken to be a maximally great being à la Anselm.[^note-8] Per an Anselmian conception of God, God is maximally worthy of worship and reverence in virtue of (i) God’s necessarily existing, and (ii) God’s necessarily instantiating a number of specific great-making qualities, including omnipotence, omniscience, and moral perfection. An Anselmian perfect being exists in all metaphysically possible worlds and does not fail to instantiate the relevant great-making qualities in any of them. Hoffman and Rosenkrantz defend the coherence of this venerable conception of God (2002).
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      The foregoing argument about God and the possibility of evil has been disputed by theists such as Alvin Plantinga, who do not hold that God’s existence implies the existence of a maximally good world, but do hold that God seeks to create as good a world as he can.[^note-9] Theists such as Plantinga allow for there to be evil that is *unnecessary* for any greater good that outweighs it. An evil of this kind involves free decisions of non-divine agents, which God does not prevent, but which these other agents can prevent. Plantinga contends that God is not wrong to permit an evil of this kind, since God cannot bring about a vital good, the existence of free human agents, without there being such an evil. Alternatively, it might be argued that God does no wrong in this sort of case, because he does not know how to do better (knowledge of the future free actions of created agents being impossible). However, as an omnipotent God is *not* required to have power over the free decisions of non-divine agents, it follows that on these views, his omnipotence and moral perfection are compatible, roughly to the extent indicated earlier in our discussion of the view that God’s existence implies a maximally good world. Of course, nothing that has been said here answers the question of how much, if any, evil is compatible with the existence of the traditional God. This question is central to the problem of evil for theism.
    step1: TBD
    step2: TBD
