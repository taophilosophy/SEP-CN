      One can respond to arguments of this kind as follows. Assume that if God exists, then this is a best possible world.[^note-7] In that case, if God exists, there could not be an evil unless it were necessary for some greater good, in which case any state of affairs containing evil incompatible with there being a maximally good world is *impossible*. But it be may be assumed that it is not possible for *any* agent to bring about an impossible state of affairs. Thus, if God exists, any moral evil, that is, any evil brought about by anyone, and any natural evil, or any evil which has an impersonal, natural cause, must be necessary for some greater good.
    step1: |-
      对此类论证可作如下回应。假定若上帝存在，则现实世界是一个最好的可能世界。[^note-7] 在此情形下，若上帝存在，则不可能有恶，除非恶对某种更大的善是必需的；而在此情况下，任何含有与“存在着一个最大善世界”不相容之恶的事态都是 *不可能* 的。但可以假定，*任何* 行动者都不可能造成不可能的事态。因此，若上帝存在，则任何道德恶，即任何人所造成的任何恶，以及任何自然恶，即任何具有非人格的自然原因的恶，都必定对某种更大的善是必需的。
    step2: |-
      对此可如此回应。假定若上帝存在，现实世界便是最好的可能世界。[^note-7] 那么，若上帝存在，则除非恶为某种更大的善所必需，否则不可能有恶；而凡含“与最大善世界之存在不相容的恶”的事态，即为 *不可能*。又设任何行动者都不可能造成不可能事态。于是，若上帝存在，则一切道德恶（即任何人所致之恶）与一切自然恶（即出于非人格自然原因之恶），都必为某种更大的善所必需。
