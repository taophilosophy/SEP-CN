      为多个共存全能行动者之可能性作辩护的另一尝试诉诸量子力学。量子 *纠缠* 似是一种独特的物理现象：多个偶然存在的实体性个体的同时活动，凭这些个体之间某种必然联系而被直接协调。通过与这一现象作类比，人们或可论证，可能存在必然避免僵局的共存全能行动者。量子力学蕴含存在成对纠缠的微观粒子，使得其中一个必为 *自旋向上* 当且仅当另一个必为 *自旋向上*，而与这些微观粒子的位置无关。阿尔伯特·爱因斯坦曾以怀疑的口吻把纠缠这一理论现象称为“spukhafte Fernwirkung”，即“幽灵般的超距作用”。然而如今，纠缠已是物理学中经实验确认的部分。可以说，与纠缠类比，若多个共存全能行动者可能，则可能存在“纠缠”的全能行动者 $A_1$ 与 $A_2$，使得形而上学地必然：$A_1$ 力图造成某一事态，当且仅当 $A_2$ 力图造成同一事态。但量子力学还蕴含存在成对纠缠的微观粒子，使得其中一个必为 *自旋向上* 当且仅当另一个必为 *自旋向下*。*自旋向上* 与 *自旋向下* 是相反的性质。因此，若认真对待与量子纠缠的类比，则按同理可断言：若多个必然合作的共存全能行动者可能，则 *可能地* 存在“纠缠”的全能行动者 $A_1$ 与 $A_2$，使得形而上学地必然：$A_1$ 力图以某种方式行动，当且仅当 $A_2$ 力图以 *相反* 的方式行动。有此结论，再结合前文关于多个共存全能行动者不可能性的 *归谬*，以量子纠缠作类比支持该可能性的论证便自我拆台，反而强化了那个 *归谬*。因此，人们不能借与量子纠缠现象的类比，可靠地捍卫多个共存全能行动者的形而上学可能性。
