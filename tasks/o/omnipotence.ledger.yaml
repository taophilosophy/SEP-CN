      Wierenga’s account of omnipotence, like Flint and Freddoso’s, relies on the intuitive idea that two possible worlds can share the same past or history up to a certain point in time, and then diverge. According to Wierenga’s account, two worlds of this kind share an *initial segment*, where $S (W, t)$ is an initial segment of a possible world *W* up to a time *t* (Wierenga 1989, pp. 18–20)[^wierenga-1989]. Unlike Flint and Freddoso’s account, Wierenga’s account is not stated in terms of what an agent can actualize, but rather in terms of the narrower notion of what an agent can *strongly actualize*. An agent, *A*, strongly actualizes just those states of affairs that *A* brings about *directly* or those actions that *A* does not do *by* doing something else (Wierenga 1989, pp. 20–23)[^wierenga-1989]. Of course, an agent may actualize a state of affairs *indirectly* by strongly actualizing *another* state of affairs. Wierenga’s account of omnipotence is formulated as follows.
