      According to Pike, although God is morally praiseworthy for his actions, being morally praiseworthy entails having the power *to act immorally*. One supporting intuition may be that if God necessarily acts impeccably, then God *effortlessly* acts impeccably, and effortless impeccable action is unworthy of moral praise. Another supporting intuition may be that the only appropriate reason to morally praise an individual is to effectuate the *moral improvement* of their character/actions. An opposing intuition is that it is appropriate to morally praise an individual to express the *maximal degree of moral approval* of their character/actions.
    step1: TBD
    step2: TBD
