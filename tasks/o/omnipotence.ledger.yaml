      [^note-5]: Note that if $W$ and $W^*$ sharing the same history up to $t$ implies that $W$ and $W^*$ share the same natural laws up to $t$, then in $W$ there is no sufficient causal condition for Oscar becoming omnipotent at $t$. However, the libertarianism of Flint and Freddoso presupposes that some events, i.e., all free decisions, lack a sufficient causal condition, and there seems to be no good reason to deny the possibility of events that have no sufficient causal condition, especially in the light of current understandings of quantum mechanics.
    step1: |-
      [^note-5]: 注意，若 $W$ 与 $W^{\ast}$ 共享截至 *t* 的历史蕴含 $W$ 与 $W^{\ast}$ 共享截至 *t* 的自然律，则在 *W* 中，奥斯卡在 *t* 时成为全能并没有充分的因果条件。然而，Flint 与 Freddoso 的意志自由论预设某些事件（即一切自由决定）没有充分的因果条件，而且似乎没有充分理由否认没有充分因果条件的事件之可能性，尤其鉴于当前对量子力学的理解。
    step2: |-
      [^note-5]: 注意：若 $W$ 与 $W^{\ast}$ 共享截至 $t$ 的历史，蕴含 $W$ 与 $W^{\ast}$ 共享截至 $t$ 的自然律，则在 $W$ 中奥斯卡于 $t$ 成为全能并无充分的因果条件。但 Flint 与 Freddoso 的意志自由论预设某些事件（一切自由决定）没有充分因果条件；且似乎没有好理由否认这类事件可能——尤其鉴于当下对量子力学的理解。
