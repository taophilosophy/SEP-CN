      Another possible defense of the possibility of a plurality of coexistent omnipotent agents appeals to quantum mechanics. Quantum *entanglement* seems to be a unique physical phenomenon whereby concurrent activities of diverse contingently existing substantial individuals are directly coordinated in virtue of a necessary linkage of some sort between those substantial individuals. By drawing an analogy with this phenomenon, one might argue that there could be coexistent omnipotent agents who necessarily avoid stalemates. Quantum mechanics implies that there exist pairs of entangled micro-particles such that it is causally necessary that one member of the pair is *spin up* if and only if the other member of the pair is *spin up*, independently of the locations of those micro-particles. Albert Einstein skeptically described the theoretical phenomenon of entanglement as “spukhafte Fernwirkung,” that is, as “spooky action at a distance.” Nowadays, however, entanglement is an experimentally confirmed part of physics. Arguably, by analogy with entanglement, if a plurality of coexistent omnipotent agents is possible, then there could be “entangled” omnipotent agents, $A_1$ and $A_2$, such that it is metaphysically necessary that $A_1$ endeavors to bring about a certain state of affairs if and only if $A_2$ endeavors to bring about the same state of affairs. But quantum mechanics further implies that there are entangled pairs of micro-particles such that it is causally necessary that one member of the pair is *spin up* if and only if the other member of the pair is *spin down*. The properties of *being spin up* and *being spin down* are contraries. Thus, if the analogy with quantum entanglement is taken seriously, then by parity of reasoning, one should conclude that if a plurality of necessarily cooperating coexistent omnipotent agents is possible, then *possibly*, there are “entangled” omnipotent agents, $A_1$ and $A_2$, such that it is metaphysically necessary that $A_1$ endeavors to act in some way if and only if $A_2$ endeavors to act in a *contrary* way. Given this conclusion, and in the light of the *reductio ad absurdum* of the possibility of a plurality of coexistent omnipotent agents presented earlier, an argument in favor of such a possibility by analogy with quantum entanglement undermines itself, thereby reinforcing that *reductio*. So, one cannot credibly defend the metaphysical possibility of a plurality of coexistent omnipotent agents by drawing an analogy with the phenomenon of quantum entanglement.
    step1: |-
      对多个共存全能行动者之可能性的另一种辩护，诉诸量子力学。量子 *纠缠* 似乎是一种独特的物理现象：多个偶然存在的不同实体个体，其同时发生的活动凭借这些实体个体之间某种必然联系而直接协调。借与这一现象类比，或可论证：可能存在必然避免僵局的共存全能行动者。量子力学蕴含存在成对的纠缠微观粒子，使得其中一个成员 *自旋向上* 当且仅当另一个成员 *自旋向上*，这在因果上是必然的，与这些微观粒子的位置无关。阿尔伯特·爱因斯坦曾以怀疑口吻把纠缠这一理论现象称为“spukhafte Fernwirkung”，即“幽灵般的超距作用”。然而如今，纠缠已是物理学中经实验证实的一部分。可以说，借与纠缠类比，若多个共存全能行动者是可能的，就可能存在“纠缠的”全能行动者 $A_1$ 与 $A_2$，使得形而上学上必然地：$A_1$ 力图造成某一事态，当且仅当 $A_2$ 力图造成同一事态。但量子力学还蕴含存在成对的纠缠微观粒子，使得其中一个成员 *自旋向上* 当且仅当另一个成员 *自旋向下*，这在因果上是必然的。*自旋向上* 与 *自旋向下* 这两种性质是相反的。于是，若认真对待与量子纠缠的类比，则依同理可推出：若多个必然合作的共存全能行动者是可能的，那么 *可能地*，存在“纠缠的”全能行动者 $A_1$ 与 $A_2$，使得形而上学上必然地：$A_1$ 力图以某种方式行动，当且仅当 $A_2$ 力图以 *相反* 的方式行动。有了这一结论，再鉴于前文关于多个共存全能行动者之可能性的 *归谬法*，借量子纠缠类比来支持这种可能性的论证便自我拆台，反而强化了那个 *归谬法*。因此，不能靠与量子纠缠现象类比，来可信地辩护多个共存全能行动者的形而上学可能性。
