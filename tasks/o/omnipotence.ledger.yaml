  - id: 3
    kind: body
    source: |-
      Philosophical reflection upon the notion of omnipotence raises many puzzling questions about whether or not a consistent notion of omnipotence places limitations on the power of an omnipotent agent. Could an omnipotent agent create a stone so massive that that agent could not move it? Paradoxically, it appears that however this question is answered, an omnipotent agent turns out not to be all-powerful. Could such an agent have the power to create or overturn necessary truths of logic and mathematics? Could an agent of this kind bring about or alter the past? Is the notion of an omnipotent agent other than God an intelligible one? Could *two* omnipotent agents coexist? If there are states of affairs that an omnipotent agent is powerless to bring about, then how is the notion of omnipotence intelligibly to be defined? Moreover, an obstacle to traditional Western theism arises if it is impossible for God to be morally perfect and omnipotent. If an omnipotent God is powerless to do evil, then how can he be omnipotent? Rational theology seeks an analysis of the concept of omnipotence that provides sufficient granularity about the powers of an omnipotent agent to resolve the puzzles and apparent paradoxes that surround this concept. If the notion of omnipotence were found to be unintelligible, or incompatible with moral perfection, then traditional Western theism would be false.
    step1: |-
      对全能概念作哲学反思，会引出许多令人困惑的问题：一个一致的全能概念，是否会对全能行动者的力量设限？全能行动者能否造出一块重得他自己也搬不动的石头？吊诡的是，无论这个问题如何回答，全能行动者似乎都不是无所不能的。这样的行动者是否有力量创造或推翻逻辑与数学的必然真理？这类行动者能否造成或改变过去？除上帝之外，全能行动者这一概念是否可理解？*两个* 全能行动者能否共存？若有些事态是全能行动者无力造成的，那么全能概念又该如何可理解地加以定义？此外，若上帝既道德完满又全能是不可能的，传统西方有神论便会遇上障碍。若全能的上帝无力作恶，他又如何全能？理性神学力求对全能概念作出分析，其颗粒度须足以解决围绕这一概念的种种困惑与表面悖论。倘若全能概念被证明不可理解，或与道德完满不相容，那么传统西方有神论便是假的。
    step2: |-
      对全能作哲学反思，会引出一连串难解之问：一种一致的全能概念，会不会给全能行动者的力量设限？全能行动者能不能造出一块重得连他自己都搬不动的石头？吊诡之处在于，无论怎么回答，全能行动者似乎都并非无所不能。这样的行动者能否创造或推翻逻辑与数学的必然真理？能否造成或改变过去？“除上帝之外的全能行动者”这一概念是否可理解？*两个* 全能行动者能否共存？若有些事态是全能者也无力造成的，全能概念又该怎么下定义才算可理解？此外，若上帝既道德完满又全能是不可能的，传统西方有神论就遇到麻烦：全能的上帝若无力作恶，还算全能吗？理性神学所要的，是对全能概念给出颗粒度足够细的分析，以便化解围绕它的种种困惑与表面悖论。一旦全能概念被证明不可理解，或与道德完满不相容，传统西方有神论即为假。
  - id: 4
    kind: body
    source: |-
      According to some philosophers, omnipotence should be understood in terms of the power to *perform certain tasks*, for instance, to kill oneself, to make $2+2=4$, or to make oneself non-omniscient. However, in recent philosophical discussion, omnipotence has been analyzed in terms of the power to *bring about certain possible states of affairs*, understood as propositional entities which either obtain or fail to obtain (Rosenkrantz & Hoffman 1980; Flint & Freddoso 1983; and Wierenga 1989)[^flint-1983][^rosenkrantz-1980][^rosenkrantz-1980-2][^wierenga-1989]. Because we believe that it can yield an adequate analysis of omnipotence, we take this latter approach in what follows.
    step1: |-
      按某些哲学家的看法，全能应理解为 *完成某些任务* 的力量，例如杀死自己、使 $2+2=4$、或使自己不全知。然而在晚近哲学讨论中，全能被分析为 *造成某些可能事态* 的力量，事态被理解为或成立或不成立的命题性实体（Rosenkrantz & Hoffman 1980; Flint & Freddoso 1983; and Wierenga 1989）[^flint-1983][^rosenkrantz-1980][^rosenkrantz-1980-2][^wierenga-1989]。由于我们相信后一进路能给出恰当的分析，下文即采取这一进路。
    step2: |-
      有些哲学家主张，全能应理解为 *完成某些任务* 的力量，如自杀、使 $2+2=4$、或使自己不再全知。但在晚近讨论中，全能多被分析为 *造成某些可能事态* 的力量，而事态被当作或成立或不成立的命题性实体（Rosenkrantz & Hoffman 1980; Flint & Freddoso 1983; and Wierenga 1989）[^flint-1983][^rosenkrantz-1980][^rosenkrantz-1980-2][^wierenga-1989]。我们相信后一进路能给出恰当分析，故下文取此。
