    kind: body
    source: |-
      It appears that if being morally praiseworthy entails having the power to do evil, then the notion of a morally praiseworthy, Anselmian God is incoherent. After all, if being morally praiseworthy has that entailment, an Anselmian God would necessarily act impeccably *and* have the power to do evil, an apparently impossible combination.
