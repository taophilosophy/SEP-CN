      Pike argues that the notion of an omnipotent God whose impeccable actions are morally praiseworthy is coherent, but only if God’s moral perfection is deemed a contingent property of God. However, Hoffman and Rosenkrantz defend the coherence of the conception of a necessarily righteous Anselmian God whose actions are morally praiseworthy (2002: 156–165). According to their position, there is a relevant type of moral praiseworthiness which can be instantiated by an ideal, morally perfect agent and which does *not* entail having the power to act immorally (Hoffman 1976).
