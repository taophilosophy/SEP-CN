      “全能”的一种字面意义，是有力量造成 **任何** 事态，包括必然事态与不可能事态。笛卡尔似乎持这种观念（《第一哲学沉思集》第 1 节）。但阿奎那与迈蒙尼德认为，这种意义的“全能”自相矛盾。他们的观点可这样辩护：行动者造成 **不可能** 事态（例如 **有一个无形状的立方体**）是 **不** 可能的——若可能，就会有一个不可能事态成立，而这是矛盾（见阿奎那《神学大全》Ia, 25, 3；迈蒙尼德《迷途指津》第一部分第 15 章）。行动者造成 **必然** 事态（例如 **一切立方体都有形状**）同样不可能。行动者 $a$ 造成必然事态 $s$ 之可能，仅当可能地：(1) $a$ 造成 $s$；(2) 若 $a$ 未曾行动，$s$ 便不会成立。可是必然事态无论有没有人行动都成立，故 (2) 为假。由此可见，行动者既不可能造成必然事态，也不可能造成不可能事态。许多哲学家接受这条原则：若行动者有 **力量** 造成某事态，则蕴含 **可能地** 该行动者造成该事态。若此原则正确，前述“全能”的 **绝对** 意义便不一致。当代哲学家中，厄尔·康尼（1991）为维护“全能存在着有力量造成任何事态”之说，拒斥了这条原则。

