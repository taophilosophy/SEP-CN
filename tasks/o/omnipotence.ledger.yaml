      设上帝存在，另有一人，如该隐，致某一恶 *E* 存在。此有二种可能。其一：该隐的决定与行动如同受造宇宙中一切事件，皆被因果决定。那么按假定，该隐致 *E* 存在既为某种足以补偿 *E* 的善所必需，则上帝 [远程地] 致该隐致 *E* 存在，与上帝道德完满相容。
