      Yet, there are prominent philosophers of religion who find the classic Anselmian conception of God objectionable. For example, Richard Swinburne denies that metaphysically necessary existence can be coherently ascribed to God (2004). Others, like Nelson Pike, argue that God’s moral perfection is a contingent property of God (1969). Whether these departures from the Anselmian conception of God are warranted is controversial.
