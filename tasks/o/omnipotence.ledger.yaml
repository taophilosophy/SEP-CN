      The notion of a world-type-for-*S* $Ls$ is to be understood in the following way. A *world-type* is “a set which is such that for any *counterfactual of freedom*, i.e., any proposition which can be expressed by a sentence of the form ‘If individual essence *P* were instantiated in circumstances *C* at time *t* and its instantiation were left free with respect to action *A*, the instantiation of *P* would freely do *A*’—either that counterfactual or its negation is a member of the set” (Flint & Freddoso 1983, p. 96)[^flint-1983]. It may also be stipulated “that for any two members of the set, the conjunction of those two members is a member of the set as well” (Flint & Freddoso 1983, pp. 96–97)[^flint-1983]. Moreover, “a world-type is *true* just in case every proposition which is a member of it is true” (Flint & Freddoso 1983, p. 97)[^flint-1983]. In addition, it is presupposed that “for any free agent *x*, there will be a set of all and only those true counterfactuals of freedom (or true negations of such counterfactuals) over whose truth-value *x* has no control” (Flint & Freddoso 1983, p. 97)[^flint-1983]. A set of this kind is referred to as *the world-type-for-x*. Finally, ‘$Lx$’ designates the true-world-type-for-*x*.
    step1: |-
      *S* 的世界类型 $Ls$ 这一概念应如下理解。*世界类型* 是“这样一个集合：对任何 *自由反事实*，即任何可由‘若个体本质 *P* 在时刻 *t* 于境况 *C* 中被例示，且其例示在行动 *A* 方面被留作自由，则 *P* 的例示将自由地做 *A*’这一形式的句子表达的命题，该反事实或其否定是该集合的成员”（Flint & Freddoso 1983, p. 96）[^flint-1983]。还可以规定：“对集合中任何两个成员，这两个成员的合取同样是该集合的成员”（Flint & Freddoso 1983, pp. 96–97）[^flint-1983]。此外，“一个世界类型是 *真的*，当且仅当作为其成员的每个命题都为真”（Flint & Freddoso 1983, p. 97）[^flint-1983]。另外还预设：“对任何自由行动者 *x*，存在一个集合，它包含且仅包含那些其真值不为 *x* 所控制的真自由反事实（或此类反事实的真否定）”（Flint & Freddoso 1983, p. 97）[^flint-1983]。这样的集合称为 *x 的世界类型*。最后，‘$Lx$’ 指称 *x* 的真世界类型。
    step2: |-
      所谓 *S* 的世界类型 $Ls$，须这样理解。*世界类型* 是“这样一个集合：凡 *自由反事实*——即凡可由“若个体本质 *P* 于时刻 *t* 在境况 *C* 中被例示，且其例示在行动 *A* 上被留作自由，则 *P* 的例示将自由地做 *A*”形式之句所表达的命题——该反事实或其否定皆属此集合”（Flint & Freddoso 1983, p. 96）[^flint-1983]。还可规定：“集合中任两成员的合取，亦为该集合之成员”（Flint & Freddoso 1983, pp. 96–97）[^flint-1983]；“世界类型为 *真*，当且仅当其每一成员命题皆真”（Flint & Freddoso 1983, p. 97）[^flint-1983]。此外预设：“对任何自由行动者 *x*，存在一个集合，恰含全部其真值不受 *x* 控制的真自由反事实（或此类反事实的真否定）”（Flint & Freddoso 1983, p. 97）[^flint-1983]。此种集合即称 *x 的世界类型*；“$Lx$”则指称 *x* 的真世界类型。
