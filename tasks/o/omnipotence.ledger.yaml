      Let us return to the historical question of Locke’s understanding of infinite power. Locke explicitly rejects the notion that there is an infinite cardinal number. He takes the contention that there is such a number to be absurd. Rather, Locke appears to understand infinite power as unlimited power, consistent with the Aristotelean notion that infinities are “potential” and never completed, as well as with the empiricist idea that infinity is a wholly negative notion. The infinite sets discussed earlier are “actual” or completed infinities. According to one fairly common understanding of unlimited power, such power includes the power to bring about or undo necessary states of affairs, e.g., necessities of logic, mathematics, metaphysics, or ethics. Yet, it does not appear that Locke means to attribute this power to an omnipotent agent; he never contends that the Supreme Being has the power to bring about or undo necessities. In any event, we will critically examine the thesis that an omnipotent agent has the power to bring about or undo necessary states of affairs in what follows.
