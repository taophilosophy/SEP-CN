      Note that (a) is a past state of affairs. Presumably, it is not possible for an efficient cause to occur *later* than its effect. However, an agent’s bringing about a state of affairs is a kind of efficient causation. Therefore, it is not possible for an agent to bring about anything that is in the *past*. In other words, it is impossible for *any* agent to have power over what is past. Hence, no agent, not even an omnipotent one, can bring it about that (a) obtains. Likewise, despite the fact that (b) can be brought about *prior* to *t*, the impossibility of an agent’s having power over what is past implies that *after t* even an omnipotent agent cannot bring it about that (b) obtains. In the case of (c), prior to Parmenides’s first lecture, an omnipotent agent can bring about (c). But once Parmenides has lectured, even an omnipotent agent cannot bring it about that (c) obtains. As for (d), prior to the Amazon’s third flooding, an omnipotent agent can bring it about that (d) obtains, while after the Amazon’s third flooding, even an omnipotent agent cannot bring it about that (d) obtains. (e) introduces a special difficulty. Although it is obvious that (e) could *not* be brought about by an omnipotent agent, it can be argued plausibly that it *is* possible for a non-omnipotent agent to bring about (e) by causing a snowflake to fall, *provided that* no omnipotent agent ever exists.[^note-1] But, as we argued earlier, a maximally powerful being need not have the power to bring about every state of affairs that any other being could. Lastly, while if the libertarian theory of free will is correct, an omnipotent agent (who is, of course, *other than Plato*) cannot bring about (f), apparently a non-omnipotent agent, namely, Plato, can bring it about that (f) obtains.
    step1: |-
      注意，(a) 是过去事态。大概，动力因不可能 *晚于* 其效果发生。然而，行动者造成事态是一种动力因果。因此，行动者不可能造成任何属于 *过去* 的东西。换言之，*任何* 行动者都不可能对过去之事拥有力量。因此，没有任何行动者，甚至全能行动者，能使 (a) 成立。同样，尽管 (b) 可以在 *t* 之前造成，行动者不可能对过去拥有力量这一点蕴含：在 *t 之后*，甚至全能行动者也不能使 (b) 成立。就 (c) 而言，在巴门尼德首次讲学之前，全能行动者可以造成 (c)；但巴门尼德一旦讲过学，甚至全能行动者也不能使 (c) 成立。至于 (d)，在亚马逊河第三次泛滥之前，全能行动者可以使 (d) 成立；而在第三次泛滥之后，甚至全能行动者也不能使 (d) 成立。(e) 引出一个特殊困难。虽然全能行动者显然 *不能* 造成 (e)，但可以有说服力地论证：一个非全能行动者 *有可能* 通过使一片雪花落下而造成 (e)，*只要* 从未有任何全能行动者存在。[^note-1] 但如我们前文所论，有最大力量的存在者不必有力量造成任何其他存在者所能造成的每一个事态。最后，若自由意志论正确，全能行动者（当然 *不是柏拉图*）不能造成 (f)；但看来一个非全能行动者，即柏拉图，可以使 (f) 成立。
    step2: |-
