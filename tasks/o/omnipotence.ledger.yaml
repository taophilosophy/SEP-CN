      > A being *x* is omnipotent in a world *W* at a time $t =_{df}$ In *W* it is true both that (i) for every state of affairs *A*, if it is possible that both $S (W, t)$ obtains and that *x* strongly actualizes *A* at *t*, then at $t, x$ can strongly actualize *A*, and (ii) there is some state of affairs which *x* can strongly actualize at *t*. (Wierenga 1989, p. 25)[^wierenga-1989]
