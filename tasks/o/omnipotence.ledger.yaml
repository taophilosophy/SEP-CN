      (C) (ii) refers to a state of affairs of the form ‘*q* forever after’, where *q* is a state of affairs satisfying (i). An example of a state of affairs of this kind is *in two minutes, a ball rolls forever after*. Two situations in which this state of affairs may obtain are, first, that the ball will start rolling in two minutes, and then continue to roll forever after, and second, that the ball will start rolling earlier than that, for instance, two minutes earlier, will be rolling in two minutes, and will continue to roll forever after.
    step1: |-
