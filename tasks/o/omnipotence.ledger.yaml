      “全能”的一义，字面上是能造成 *任何* 事态，包括必然与不可能的事态。笛卡尔似乎持此义（《第一哲学沉思集》第 1 节）。阿奎那与迈蒙尼德则认为此义不自洽，理由可这样表述。行动者不可能造成 *不可能* 事态（如 *有一个无形状的立方体*）——若可能，不可能之事便会成立，矛盾（见阿奎那《神学大全》Ia, 25, 3；迈蒙尼德《迷途指津》第一部分第 15 章）；行动者也不可能造成 *必然* 事态（如 *一切立方体皆有形状*）。行动者 $a$ 造成必然事态 $s$，须可能地：(1) $a$ 造成 $s$；(2) 若 $a$ 未行动，则 $s$ 不成立。必然事态无论有无行动都会成立，故 (2) 为假。由此可见，行动者既不能造成必然事态，也不能造成不可能事态。许多哲学家接受一条原则：若行动者有 *力量* 造成某事态，则 *可能地* 该行动者造成该事态。若此原则成立，上述 *绝对* 意义的全能便不自洽。当代哲学家中，厄尔·康尼（1991）正为捍卫“全能者能造成任何事态”而拒斥此原则。
