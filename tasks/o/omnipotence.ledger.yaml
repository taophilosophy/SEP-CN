      A similar, though weaker, sort of objection concerns McEar, a hypothetical agent who essentially has the power to do only *one* thing, namely, scratch his ear. It may be objected that Wierenga’s analysis of omnipotence falsely implies that McEar would be omnipotent. But it might be replied that an agent such as McEar is impossible. It can be cogently argued that, necessarily, if McEar has the power to scratch his ear, then he *also* has the power to move a part of his body to scratch his ear, for instance, his arm (Wierenga 1989, pp. 28–29)[^wierenga-1989]. So, it appears that there could not be an agent that has the power to do only one thing. In reply to the stronger sort of objection discussed earlier, it may be suggested that, necessarily, for *any* power, if an agent lacks that power, then an omnipotent being could give that agent that power (Wierenga 1989, p. 29)[^wierenga-1989]. The difficulty with such a reply is that there could be a non-omnipotent agent who *essentially* lacks the power to overrule any law of nature, and hence that not even an omnipotent agent could give this non-omnipotent agent that power.
    step1: |-
      一种类似但较弱的反对意见，针对 McEar：一个假想的行动者，本质上只有力量做 *一* 件事，即挠耳朵。有人可能反对说，Wierenga 的全能分析错误地蕴含 McEar 会全能。但可以回答说，McEar 这样的行动者是不可能的。可以有力地论证：必然地，若 McEar 有力量挠耳朵，则他 *也* 有力量移动身体的一部分来挠耳朵，例如他的手臂（Wierenga 1989, pp. 28–29）[^wierenga-1989]。因此似乎，不可能有只拥有力量做一件事的行动者。针对前文讨论的较强反对意见，可以提出：必然地，对 *任何* 力量而言，若某行动者缺乏该力量，则全能存在者可以使该行动者获得该力量（Wierenga 1989, p. 29）[^wierenga-1989]。这一回答的难处在于：可能存在一个 *本质上* 缺乏推翻任何自然律之力量的非全能行动者，因而即便全能行动者也不能赋予该非全能行动者那种力量。
    step2: |-
      另有一种类似而较弱的反对，针对 McEar：假想的行动者，本质上只有力量做 *一* 件事——挠耳朵。有人会说，按 Wierenga 的分析，McEar 竟成了全能，这是错的。但也有人可答：McEar 这样的行动者不可能存在。可以有力地论证：必然地，若 McEar 能挠耳朵，则他 *也* 能移动身体的一部分（如手臂）来挠耳朵（Wierenga 1989, pp. 28–29）[^wierenga-1989]。如此，只拥有一项力量的行动者似乎不可能。至于前文那个更强的反对，可以提出：必然地，对 *任何* 力量，若某行动者缺此力量，全能者便能使其获得（Wierenga 1989, p. 29）[^wierenga-1989]。这一回答的难处在于：可能存在一个 *本质上* 缺乏“推翻任何自然律”之力量的非全能者，连全能者也无法赋予他这种力量。
