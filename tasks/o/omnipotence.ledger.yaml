      [^note-4]: A complex state of affairs is one which is either constructible out of other states of affairs by use of the logical apparatus of first-order logic enriched with whatever modalities one chooses to employ, or else analyzable (in the sense of a philosophical analysis) into a state of affairs which is so constructible. Therefore, a *part* of a complex state of affairs, $s$, is one of those states of affairs out of which $s$, or an analysis of $s$, is constructed. The relevant notion of a *part* in this context is that of a logical part, as opposed to a spatial part or a temporal part.
