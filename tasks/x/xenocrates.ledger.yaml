      这段文字对于一则学说汇编性材料来说内容丰富得惊人，它表明色诺克拉底把幸福定义为一个有结构的整体：其中不仅包含对德性的稳定拥有，还包含将其付诸实践的实践能力。值得注意的是，内在条件（状态、性情、行为）得到优先地位，而身体与外在的善则作为必要条件纳入，但不构成其组成部分（关于这则证言的更多讨论，见 De Cesaris 2023b）[^de-2023b]。
