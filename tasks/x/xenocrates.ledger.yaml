      Xenocrates’ espousal of indivisible magnitudes has led to the conjecture that the pseudo-Aristotelian treatise *On Indivisible Lines* is, at least in part, an attack on him, and that the arguments recounted in its first chapter in favour of the existence of indivisible lines, later rebutted in the treatise, might ultimately derive from Xenocrates. Unfortunately, the arguments are quite obscure, as the text is not in good shape (an admirably concise summary of the first four of these arguments may be found in Furley 1967, 105)[^furley-1967]. Some of the arguments owe a lot to Zeno of Elea: that Xenocrates was influenced by Zeno is only what one would expect, and is confirmed elsewhere (see esp. the passage from Porphyry cited in part above, *apud* Simplicius *In Arist. Phys.* 140.6–18. For the connection between Xenocrates’ arguments and Zeno, see also Gemelli Marciano 2007, 132–137)[^gemelli-2007]. For the moment, and until a better reconstruction of the treatise becomes available, its connection to Xenocrates’ doctrine cannot be assessed in more detail.
