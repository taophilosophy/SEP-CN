      如前所述，在塞克斯都·恩披里柯那里，知识论归在“逻辑学”标题之下。没有人报道过色诺克拉底在我们今天认为的“纯”逻辑方面有何主张；塞克斯都（《驳数学家》VII §147–149 = fr. 2 IP）给我们留下关于认识论的一鳞半爪。据说色诺克拉底把一切实体或存在者分为三类：可感觉的、可理知的、可信的（后一类也称“复合的”与“混合的”）。可理知者是知识的对象，色诺克拉底称之为“知识性逻各斯”（epistemonic *logos*）或“认知的说明”，它们“位于”天界之外。可感觉者是感觉的对象，感觉是一种能达到真理、但所达真理不同于知识的官能；它们位于天界之内。复合者是天体本身，它们是意见的对象，而意见有时真、有时假。
