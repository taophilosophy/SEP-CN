      The passage, remarkably rich for a doxographical source, suggests that Xenocrates defined happiness as a structured whole that encompasses not only the stable possession of virtue, but also a practical capacity to enact it. Notably, the internal conditions (states, dispositions, actions) are given priority, while physical and external goods are included as necessary conditions but not constitutive parts (more on the testimony can be found in De Cesaris 2023b)[^de-2023b].
