      除了对色诺克拉底世界之构成要素作总体划分之外（试图把这一证据与其他证言加以调和者，见 Horky 2013）[^horky-2013][^horky-2013-2]，特奥弗拉斯托斯提到“神性事物”尤为值得注意。他说这些东西也得到了专门说明并被安置在体系之内，这似乎反映出一种更广的倾向：把传统诸神与形而上学本原及天体联系起来，从而把神学引入形而上学的领域。这一倾向在柏拉图晚期对话中已可察觉，并在学园内部进一步发展（尤其在《厄庇诺米斯》中；见 Aronadio-Tulli-Petrucci 2018 与 Calchi 2020）[^aronadio-2018]（关于学园中的这一倾向，见 Thiel 2006；Dillon 2020；Bartninkas 2023）[^bartninkas-2023][^dillon-2020][^thiel-2006]。埃提乌斯的一则记载（埃提乌斯 I, 7 30 = fr. 133 IP，见 Mansfeld-Runia 2020, 400 n. *ad* §20）[^mansfeld-2020]似乎恰恰反映了这类神学-形而上学的整合。它说色诺克拉底把一与二认作神——前者为男，后者为女——把天体视为神圣，并以精灵（*daimones*）填充月下世界。这则证言所保存的信息有多少可以照字面采信，难以断定，因为要把其中细节与我们已知的色诺克拉底形而上学调和起来，会引出若干问题（正如 Dillon 2003 正确地指出的那样，其说反对 Baltes 1988 的解释，而 Thiel 2006 大体接受了后者）[^baltes-1988][^dillon-2003][^thiel-2006]。然而，即便细节不确定，这则及类似段落仍然证明了沟通形而上学与神学的普遍倾向。
