      Accordingly, we do not know how Xenocrates understood addition. One possibility (Dancy 2021)[^dancy-2021] is that he conceived of it as a kind of map: if you are on the unique Form-Number 2 and you wish to add the unique Form-Number 3 to it, you cannot, strictly speaking, do that, but taking three steps forward in the series will get you to the unique Form-Number 5, and that is what ‘2 + 3 = 5’ really means. Another possibility is that he thought it was through participation that arithmetical operations became possible. There is, however, no direct evidence to support any of these conjectures, apart from Aristotle’s repeated complaint (see Arist., *Metaph*. M6, 1080b28–30 = fr. 39 IP; M8, 1083b4–6 = fr. 19 IP; M9, 1086a9–11 = fr. 30 IP) that Xenocrates actually makes doing mathematics impossible Or, to put it as Aristotle does elsewhere: that Xenocrates ends up destroying mathematical number. According to Aristotle, Xenocrates is not so much explaining addition as explaining it *away*.
