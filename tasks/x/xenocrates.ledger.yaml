      柏拉图去世、斯彪西波继任学园园长时，色诺克拉底与亚里士多德可能应阿塔尔纽斯的赫尔米亚斯之邀一同离开雅典（斯特拉波《地理学》XIII 57）；后来色诺克拉底返回，接替斯彪西波。据第欧根尼（IV 3 = T 21 IP），这是应斯彪西波之请；而《学园派赫库兰尼姆索引》（cols. 6,41–7,18: Fleisher 2018, 175–176 = T 1 IP）则告诉我们，学园的青年成员首次投票，以微弱多数确认色诺克拉底（击败本都的赫拉克利德与皮拉的门内德穆）为该校首位经选举产生的园长。这两种说法虽不相互排斥，却是关于继任的两种不同版本；似乎无法透过它们弄清实际发生了什么。
