      然而，由于亚里士多德特别坚持形式数使数学运算变得不可能，我们遗憾地未被告知：在构成形式数的单元不可组合的前提下，色诺克拉底究竟设想了何种可能。对柏拉图与斯彪西波来说，2 与 3 的相加，在于把构成数学的 2 的一组单元与构成数学的 3 的另一组单元合并起来（“数是这样的单元集合”这一观点后来仍可见到，鉴于其影响力，或许最重耍的是欧几里得《几何原本》VII 定义 2）。亚里士多德也以这种方式理解加法，尽管其背后的本体论大不相同。然而，鉴于色诺克拉底设定了形式数，这种做法对他而言很可能不可用。
