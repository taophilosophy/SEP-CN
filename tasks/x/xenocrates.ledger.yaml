      A very puzzling definition of the soul is attributed to Xenocrates: the soul is “a self-moving number” (see Aristotle, *De Anima* I, 2 404b27–30 = fr. 85 IP. The ascription to Xenocrates is supported by a substantial number of testimonia collected by Isnardi Parente as frs. 85–132 IP). Unfortunately, the sources tell us little about the philosophical gist of this definition, which Aristotle says is introduced to account for the soul’s motive and cognitive functions, but which he criticizes in various occasions (e.g., *Topics* III, 6 120b 3–4 = fr. 87 IP. On Aristotle’s criticism of Xenocrates’ definition of the soul, see Carter 2019, 103–122)[^carter-2019].
