      Xenocrates’ system has sometimes been read as anticipating ideas that would become prominent in the Middle Platonic tradition (e.g., Dillon 2003. For an overview of major scholarly approaches to the material preserved on the Early Academy, see the entry on Speusippus)[^dillon-2003]. In this entry, significant focus is placed on Aristotle’s texts, complemented by material preserved by other authors, with less emphasis on potential continuity with later traditions. What survives of Xenocrates’ views is here divided into four sections: Metaphysics, Xenocrates and the *Timaeus*, Theory of Knowledge, and Ethics. The available material is considerably more abundant for metaphysics, while our sources for epistemology and ethics are far more limited.
