      A long passage in Themistius’ *Paraphrase of Aristotle’s* *De anima* (= frs. 178–180 IP, new critical edition by García Valverde 2024)[^garcía-2024] seems to stem from Xenocrates’ *On Nature* (at 11.37–12.1 Themistius says “It is possible to gather all these {things} from the *On Nature* of Xenocrates”). This is a discussion of a story about the composition of the soul from the Form-Numbers 1, 2, 3, and 4 (although 1 was not normally considered a number), mentioned in Arist. *De anima* 408b18–27. The motivation for this account of the soul, in both Aristotle and Themistius, is the explanation of how we can know things about the universe: the universe derives from those numbers, and so, if the soul is similarly derived, the soul can know things under the principle that like things are known by like. It remains uncertain, however, how much of this account can be securely attributed to Xenocrates.
