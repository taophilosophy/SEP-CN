    step2: |-
      塞克斯都·恩披里柯告诉我们（《驳数学家》I §16 = fr. 1 IP），色诺克拉底把柏拉图隐含的哲学三分——“自然学”“伦理学”“逻辑学”——明确化了。这一图式后来在斯多亚派乃至整个希腊化哲学中成为规范。按这套术语的通常用法，我们今天称为形而上学与知识论的内容，分别归入“自然学”与“逻辑学”之下。塞克斯托斯关于这一标准哲学三分（由色诺克拉底传下、而最终源于柏拉图）的记述，典型地代表了我们所听到的关于他的大部分情况：色诺克拉底似乎至少同样关心承续柏拉图的思想，而非仅仅宣扬自己的创见。
