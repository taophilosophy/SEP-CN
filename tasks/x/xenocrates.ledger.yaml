      暂且不论其史料可靠性问题（这些信息可能经由欧多鲁转手，因而须谨慎对待），普鲁塔克的证言提供的远不止一个干巴巴的定义：它让我们窥见色诺克拉底关于灵魂的更完整说明。第一，我们得知，这个定义是在解释《蒂迈欧篇》35a 的语境中提出的——该段对早期柏拉图派至关重要，他们常借《蒂迈欧篇》的灵魂生成说来表达自己的灵魂观。第二，普鲁塔克呈现的色诺克拉底把《蒂迈欧篇》的灵魂生成理解为两阶段过程（古代柏拉图派直至普罗克洛斯都沿用这一模式；见 Opsomer 2020）[^opsomer-2020]。第一阶段是数的生成：数被理解为与不定的二的混合，此处分别等同于不可分存在与可分存在。接着，这个数的混合物再与同和异结合——二者分别被认作运动/变化与静止的本原——从而使数获得灵魂所必需的运动、变化与恒存能力。
