      Setting aside the issue of the reliability of its sources (the information is possibly mediated through Eudorus, and thus to be taken with caution), Plutarch’s testimony offers more than a bare definition: it provides a glimpse into Xenocrates’ broader account of the soul. First, we learn that the definition is introduced in the context of interpreting *Timaeus* 35a, a key passage for early Platonists, who frequently used the *Timaeus*’ psychogony to formulate their own views of the soul. Second, Plutarch presents Xenocrates as conceiving of the Timaean psychogony as a two-stage process (a pattern followed by ancient Platonists down to Proclus; see Opsomer 2020)[^opsomer-2020]. The first stage consists in the generation of Number, understood as a mixture of the One and the Indefinite Dyad, here identified with indivisible and divisible being, respectively. Then, this numerical mixture is combined with Sameness and Difference identified as principles of motion/change and rest, respectively, so that Number may acquire the capacities for motion, change, and permanence that are essential to the soul.
