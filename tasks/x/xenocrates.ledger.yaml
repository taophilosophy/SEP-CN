      普鲁塔克（《论共同概念》1069e–f = fr. 151 IP）把“幸福在于依自然而生活”的观念归于色诺克拉底。其他记载传达了相关想法，例如色诺克拉底把哲学生活描述为“扰动的止息”（[盖伦]《哲学史》8 = fr. 171 IP）——这一说法预示了希腊化时代心神宁静（*ataraxia*）的理想，尽管它在现存任何记述中都未被置于中心。这些看法若属真实，似乎指向后来希腊化各派典型的那种目标。
