    step2: |-
      第欧根尼的著作目录（IV 11–14 = T 2 IP）列出七十多种归于色诺克拉底的题名，无一存世，甚至在其他作者那里也找不到可以明确辨认的引文。与斯彪西波的情况一样，色诺克拉底学说的重构在很大程度上依赖亚里士多德；而令人无奈的是，亚里士多德常常不点色诺克拉底的名。亚里士多德讨论其哲学观点时从未直接指名色诺克拉底，但对他学说的可能指涉，通过某些反复出现的表述透出端倪：例如亚里士多德谈到“设定型相的人”（这一短语常包括柏拉图与色诺克拉底）、“为数学对象与型相设定同一本性的人”，或“把灵魂定义为'自行运动的数'的人”（详见下文）。
