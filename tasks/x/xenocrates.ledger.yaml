      Xenocrates is also mentioned in connection with the so-called ‘metaphorical’ interpretation of the cosmogony in the *Timaeus*, according to which some early Platonists claimed that Plato’s account of the world’s ‘generation’ was meant as a pedagogical device (Centrone 2010; on the topic, see also Reydams-Schils 2012; Dillon 2012)[^centrone-2010][^dillon-2012][^reydams-schils-2012]. According to these Platonists, Plato did not mean to suggest that the world ever came to be *in time*: its generation was an illustrative metaphor, just as geometers make their figures clearer by showing them in the process of being drawn. The earliest source for this information is Aristotle (*De caelo* I 10, 279b32–280a2 = fr. 73 IP), who refers only to “some people”. It is Simplicius who reports that Aristotle had in mind above all ‘Xenocrates and the Platonists’ (*In Cael*. 303,34–304,16 = fr. 74 IP) and the same identification is found in an anonymous scholion, which explicitly names both Speusippus and Xenocrates as attempting to ‘come to the rescue’ of Plato (*Scholia in Arist. De Caelo* 409a9–12 Brandis = fr. 76 IP). The *De caelo* testimony itself is, however, less explicit than much of the scholarship has assumed. First, Aristotle consistently attributes to these unnamed Platonists the claim that the world is ‘indestructible and yet generated.’ Second, Aristotle rejects the comparison with diagrams by appealing to the text of the *Timaeus* (*Tim.* 30a): order, he says, cannot arise from disorder without a process of generation and therefore without time; by contrast, in diagrams nothing is separated in time. But why would Aristotle use a *literal* reading of the *Timaeus* to reject a supposedly *metaphorical* interpretation? Dörrie and Baltes (1998) argue that Aristotle’s rejection of the metaphor is a *petitio principii*. For further discussion, see De Cesaris 2023a. It is likely, then, that the later Platonist tradition played a role in developing the early Platonists’ view into a more explicit affirmation of the world’s ungeneratedness.
