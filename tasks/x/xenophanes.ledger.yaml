      这理论优点不少，对后世思想家却似乎影响甚微。阿那克萨戈拉在彩虹问题上步其后尘（参 DK 59 B19）；恩培多克勒知道他关于大地无限深远之说，却予以否弃（DK 31 B39）。至于柏拉图与亚里士多德，看来都对他那套科学观点不闻不问，或视之为无关紧要。其中一因，也许是他从不作目的论承诺——而在柏拉图与亚里士多德看来，目的论乃是正确理解宇宙所必需。克塞诺芬尼的宇宙由一组力量支配，却从未被说成“奔向最好”，也未见有某个统辖性的理智把它引向某种最佳结局。（他的神确实凭心思“摇动万物”，但从未被说成以任何方式指导、支配具体事件。）同样明显的是，他的天体远远够不上那种自亚里士多德起成为古典天文学标志的完善：那些天体非但不是神灵，还按固定周期生成与毁灭。要公允地赏识克塞诺芬尼科学观点的价值，得站在很晚的后世来看；还得再过许多世纪，强调直接观察、只用自然原因与力量，才成为科学的正统。
