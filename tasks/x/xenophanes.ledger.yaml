    source: |-
      Xenophanes of Colophon was a philosophically-minded poet who lived in various parts of the ancient Greek world during the late 6ᵗʰ and early 5ᵗʰ centuries BCE. He is best remembered for a novel critique of anthropomorphism in religion, a partial advance toward monotheism, and some pioneering reflections on the conditions of knowledge. Many later writers, perhaps influenced by two brief characterizations of Xenophanes by Plato (*Sophist* 242c–d) and Aristotle (*Metaphysics* 986b18–27), identified him as the founder of Eleatic philosophy (the view that, despite appearances, what there is is a changeless, motionless, and eternal ‘One’). In fact, the Xenophanes who emerges from the surviving fragments defies simple classification. He was a travelling rhapsode who criticised the stories about the gods told by the poets, and he defended a novel conception of the divine nature. But he was also a reflective observer of the human condition, a practitioner of the special form of ‘inquiry’ (*historiê*) introduced by the Milesian philosopher-scientists, and a civic counselor who encouraged his fellow citizens to respect the gods and work to safeguard the well-being of their city.
    step1: |-
      科洛丰的克塞诺芬尼是一位有哲学头脑的诗人，公元前六世纪末至五世纪初生活在希腊世界的多个地方。他最为人铭记的是对宗教中神人同形同性论的新颖批判、向一神论的部分迈进，以及若干关于知识条件的开创性思考。许多后来的作者——也许是受了柏拉图（《智者篇》242c–d）与亚里士多德（《形而上学》986b18–27）对克塞诺芬尼的两段简短刻画的影响——把他认定为爱利亚哲学的开创者（该观点主张：尽管有种种现象，存在者是一个不变、不动、永恒的“一”）。事实上，从存世残篇中浮现出来的克塞诺芬尼，很难被简单归类。他是一位游历四方的诵诗人，批评诗人们所讲的关于诸神的故事，并为一种新颖的神性观辩护。但他同时也是人类处境的反思性观察者，是米利都哲人—科学家所引入的那种特殊“探究”（*historiê*）的实践者，还是一位城邦顾问，勉励同胞敬奉诸神、努力守护城邦的福祉。
    step2: |-
      科洛丰的克塞诺芬尼是个有哲学头脑的诗人，公元前六世纪末至五世纪初游走于希腊世界各处。后世记得他，多半因为三件事：对宗教中神人同形同性论的新颖批判、朝一神论的部分推进，以及若干关于知识条件的开创性思考。后来不少作者——也许受了柏拉图（《智者篇》242c–d）和亚里士多德（《形而上学》986b18–27）两段简短刻画的影响——把他认作爱利亚哲学的开创者（此说主张：不管现象如何，存在者乃是一个不变、不动、永恒的“一”）。其实，从传世残篇里走出来的克塞诺芬尼并不那么好归类。他是个周游各地的诵诗人，讥评诗人们讲的诸神故事，又为一种新颖的神性观张目；可他同时也是人类处境的冷眼观察者，是米利都哲人—科学家开创的那种特殊“探究”（*historiê*）的践行者，还是位城邦顾问，劝勉同胞敬神、用心守护城邦的福祉。
