      克塞诺芬尼似乎探索过许多米利都人早先研究过的同类现象。B28 提出了关于大地深处之性质与范围的观点；B30 认定海是云、风与雨的来源；B32 评论伊里斯（彩虹）的性质；B37 注意到洞穴中有水；B39 与 40 提到“樱桃树”与“青蛙”；A38–45 讨论各种天文现象，A48 表明他对西西里的周期性火山喷发有兴趣。希波吕托斯（A33）称许克塞诺芬尼有一种全球性洪涝与干旱交替时期的理论，其灵感至少部分来自在内陆地点发现海洋生物化石残骸。无论克塞诺芬尼本人是否到过发现这些残骸的叙拉古、帕罗斯和马耳他，他把这一信息用作广泛解释现象的基础，本身即隐含地证明了经由旅行与观察所获信息的启发价值。
