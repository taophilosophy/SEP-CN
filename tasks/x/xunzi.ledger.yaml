      Next, Xunzi makes a crucial distinction between knowing Heaven (*zhi tian* 知天) and knowing the Way (*zhi dao* 知道). The former is impossible, and therefore a waste of time to attempt, but the latter is open to all who try. To cite a modern parallel, it is not difficult to understand *how* the force of gravity works by carefully observing its effects in the phenomenal world, but to understand *why* gravity works is a different matter altogether. Xunzi would say that one should constrain one’s inquiries to learning how gravity works, and then think about how to apply this irresistible force of nature to improve the lives of humankind (Fraser 2016: 297–300)[^fraser-2016]. His attitude was not scientific in our sense. Speaking of “those who are enlightened about the distinction between Heaven and human beings”, he says:
    step1: |-
      接下来，荀子在“知天”（*zhi tian* 知天）与“知道”（*zhi dao* 知道）之间作出一个关键区分。前者不可能，因此尝试它是浪费时间；后者则向一切尝试者敞开。举一个现代的类比：通过在现象世界中仔细观察引力之效，理解引力**如何**起作用并不困难；但理解引力**为何**起作用，则完全是另一回事。荀子会说：人应当把自己的探问限定在学习引力如何起作用，然后思考如何把这一不可抗拒的自然力用于改善人类的生活（Fraser 2016: 297–300）[^fraser-2016]。他的态度并不符合我们意义上的“科学的”。说到“明于天人之分”的人时，他说：
    step2: |-
      再进一步，荀子在“知天”（*zhi tian* 知天）与“知道”（*zhi dao* 知道）之间划出一条关键的界线。知天不可能，尝试它只是枉费光阴；知道则向所有尝试者敞开。借一个现代的类比：细察引力在现象世界中的种种效应，理解引力**如何**运作并不难；可要理解引力**为何**运作，就完全是另一码事了。荀子会说：人应当把探问限定在弄清引力如何运作，再去想如何把这一无可抗拒的自然力用于改善人类的生活（Fraser 2016: 297–300）[^fraser-2016]。他的态度并不属于我们意义上的“科学的”。论及“明于天人之分”者时，他说：
