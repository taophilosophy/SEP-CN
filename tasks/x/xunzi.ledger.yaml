      As the last quote intimates, the proper implementation of ritual is also decisive in politics and international relations.[^note-8] In the “Debate about Warfare”, for example, Xunzi offers a distinctive variant of the old Confucian idea that a true king (*wang* 王—always a moral term in Confucian discourse) will succeed on the battlefield without even having to fight, because the populace will not support a tyrant or hegemon (*ba* 霸, a lord who rules by brute force). What is unique is Xunzi’s emphasis on ritual as the key to a well-ordered state. To be sure, earlier writings had also discussed the idea of ritual as the foundation of statecraft, and the *Zuo Commentary to the Springs and Autumns* (*Zuozhuan* 左傳), in particular, is famous for its scenes in which a ruler who is about to attack his neighbor publicly justifies his aggression on the grounds that he is merely “punishing” his enemy’s intolerable violations of ritual. But Xunzi raises the significance of ritual to a new level: in his view, the ruler’s ability to govern his state in accordance with ritual is the sole criterion that will determine success or failure on the battlefield (*Xunzi* 15.1c; see also *Xunzi* 16.1).
    step1: |-
      正如上一引文所暗示的，礼的正当实施在政治与国际关系中也起决定作用。[^note-8] 例如在《议兵》中，荀子为古老的儒家观念提供了一个独特的变体：真正的王（*wang* 王——在儒家话语中始终是一个道德词）无须开战就能在战场上取胜，因为民众不会支持暴君或霸（*ba* 霸，以暴力统治的主）。荀子的独特之处在于把礼强调为良好秩序国家的关键。诚然，更早的文献也讨论过以礼为治国之本的想法；《春秋左氏传》（*Zuozhuan* 左傳）尤以这样的场景著称：即将进攻邻国的君主公开为其侵略辩护，理由是他只是在“惩罚”敌人对礼的不可容忍的践踏。但荀子把礼的意义提到一个新的层次：在他看来，君主依礼治国的能力，是决定战场上成败的唯一标准（《荀子》15.1c；另见《荀子》16.1）。
