      ## 7. Rectifying Names (*zhengming* 正名)
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Xunzi’s famous essay on language, “Rectifying Names” (“Zhengming” 正名) includes some impressive insights into the nature of verbal communication (William S-Y. Wang 1989: 186–89)[^wang-1989], but the primary concern of the chapter is morality, not linguistics (Fraser 2016: 293–96)[^fraser-2016]. The thrust of the essay is easily missed because a few of Xunzi’s comments sound as though they came out of a modern pragmatics textbook, e.g., “Names have no inherent appropriateness. We designate them [by some word] in order to name them” (*Xunzi* 22.2g). Although this may sound like something that Ferdinand de Saussure (1857–1913) could have written, Xunzi was not interested in the same questions as modern linguists. In “Rectifying Names”, Xunzi also discusses sophistic paradoxes that were rampant in his day (the most famous being “A white horse is not a horse”),[^note-11] dividing them into three typological categories. His conclusion discloses that his main purpose is not a proper taxonomy of falsidical paradoxes (for this term, see Quine 1976: 3)[^quine-1976], but an assertion of the moral purpose of language:
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      > All heretical theories and aberrant sayings depart from the correct Way and are presumptuously crafted according to these three categories of delusion. (*Xunzi* 22.3d)
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      The paradoxes of the sophists cannot be used as a basis for moral governance, and thus would be objectionable even if they were not in fact false; they are “disputes with no use” (*Xunzi* 6.6).
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      The only legitimate purpose of language, like that of government itself, is to serve as the king’s tool in propagating moral excellence:
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      > When one who is a king determines names, if names are fixed and realities distinguished, if the Way is practiced and his intentions communicated, then he may cautiously lead the people and unify them by this means. (*Xunzi* 22.1c)
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      The task of determining names and then enforcing their use belongs to the king alone, not to any lord and certainly not to the people. “One who is a king” (*wangzhe* 王者) refers not to the person who happens to be sitting on the throne, but someone who has lived up to the moral requirements of that office and duly rules the world by his charismatic example. Accordingly, a phrase like “leading and unifying the people” refers not to expedient rulership, but to implementing the Confucian project of morally transforming the world. Language is useful in that enterprise because, without it, the people could not even understand the ruler’s wishes, let alone carry them out.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Just as the rituals need to be based on the foundation of the Way, the ruler’s names, though they can be arbitrary as designations, must correspond to reality. You can make up the word for “reality”, but you cannot make up reality. “Same and different” (*tongyi* 同異) are distinguished by the so-called “Heaven-endowed bureaux” (*tianguan* 天官), i.e. the eyes, ears, mouth, nose, body, and heart-mind. For most of these, we might say “senses” or “sense organs” in English, but the heart-mind (*xin* 心) is an exceptional case, for it is said to be able to distinguish “statements, reasons, happiness, resentment, grief, joy, love, hate, and desire” (*Xunzi* 22.d), which are not simply sense data. The heart-mind will be treated more fully in the next section.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      The suggestion that we rely upon our senses to perceive the world around us represents a substantial claim on Xunzi’s part, because other philosophers had already suggested that reality is not straightforwardly discerned; on the contrary, one’s partial perspective on reality necessarily informs one’s perception of it. This was, essentially, the argument in “Discourse on the Equality of Things” (“Qiwu lun” 齊物論), an important chapter in *Zhuangzi* 莊子 (e.g., Graham 1989: 176–83)[^graham-1989]. For Xunzi, however, reality is reality, regardless of how we perceive it. Once again, some scholars (e.g., Hagen 2007: 59–84)[^hagen-2007] question whether Xunzi is such a strong realist, but a constructivist interpretation is difficult to reconcile with Xunzi’s repeated assertions that language must conform to reality and the Way, e.g., “Names are that by which one defines different real objects” (*Xunzi* 22.3f).
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      ## 8. The Heart-Mind (*xin*)
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      In many respects, the heart-mind is the keystone of Xunzi’s philosophy, the one piece that links together all the others. The Chinese word *xin* means “heart”, but Xunzi attributes such strong and varied mental processes to this organ that one has to construe it as not only the heart but also the mind. (The mind was not located in the brain in premodern Chinese philosophy.)
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      First, the heart-mind is the organ that we use to discover the Way. Xunzi’s discussion of Heaven presents his argument that moral self-cultivation is a matter of correctly perceiving and then applying the Way, but does not explain how we perceive the Way in the first place. Elsewhere, he states explicitly that we come “to know the Way” by means of our heart-mind (*Xunzi* 21.5d), which has three cardinal attributes: “emptiness” (*xu* 虛) “unity” (*yi* 壹), and “tranquility” (*jing* 靜). Xunzi patently borrowed these three terms from earlier discourse, particularly *Zhuangzi* (e.g., Yearley 1980; Goldin 1999: 22–31; Stalnaker 2003)[^goldin-1999][^stalnaker-2003][^yearley-1980], and uses them to denote three nurturable faculties that we all possess from birth, but do not employ to the same degree. (The title of the relevant chapter, “Resolving Blindness”, refers to the self-destructive acts that people undertake because they fail to employ their heart-minds correctly.) “Emptiness” refers to the heart-mind’s ability to store a seemingly unlimited amount of information: we do not have to erase one datum in order to make room for another. “Unity” refers to the heart-mind’s ability to synthesize diverse data into meaningful paradigms. And “tranquility” refers to the heart-mind’s ability to distinguish fantasy from rational thinking. Armed with these powers, we can infer the patterns of the Way by taking in, and then pondering, the data transmitted to the heart-mind by the senses.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      In addition, the heart-mind is the chief among the organs. It is the only organ that can command the others; indeed, it is the only organ with any self-consciousness. “The mind is the lord of the body … It issues commands but does not receive commands” (*Xunzi* 21.6a). Because the heart-mind can control both itself and all other organs of the body, it is the font of “artifice”, or the deliberate actions that begin to transform the morally deficient *xing*: “When the heart-mind reasons and the other faculties put it into action—this is called ‘artifice’” (*Xunzi* 22.1b). The heart-mind is capable of overriding every human impulse, even the instinct of self-preservation, if it conflicts with the correct “patterns” (*li* 理).[^note-12] We have the necessary faculties to recognize immorality when we see it, and if we permit ourselves to tread an immoral path, we cannot blame our emotions or desires, but must accept that our heart-mind has failed to exert the requisite discipline. We know that we could have done better. Indeed, when we speak of “we”, we are speaking of our heart-mind. For the heart-mind is the crucible where these teeming moral deliberations take place.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Thus Xunzi ends, like all Confucians, with individual responsibility: in his case, the heart-mind’s obligation to process the principles of the Way and then command the rest of the body to conform. Because we are not sages, we are advised to follow the rituals in order to attain this degree of understanding, but, fundamentally, the path to morality is open to anyone who sees and thinks (*Xunzi* 8.11 and 23.5b).
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Xunzi’s conception of the heart-mind also figures in a distinctive congruence that he postulates between a kingdom and a human being. A kingdom possesses an initial set of features—it may be large or small, rich or poor, hilly or flat—but these are immaterial to its ultimate success or failure, for any territory, however small, provides enough of a base for a sage to conquer the world. Thus it is the management of the state, and not its natural resources, that determine whether it will become the demesne of a king or be conquered by its neighbors. This management, furthermore, comprises two elements: a proper method, namely the rituals of the sage kings; and a decisive agent, namely the lord, who chooses either to adopt the rituals or unwisely discard them.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      In much the same way, human beings are made up of two parts: their *xing*, or detestable initial condition, and *wei*, their conscious conduct. They may reform themselves or they may remain detestable: this depends entirely on their conduct. The management of the self, just like the management of the state, comprises two elements: a proper method, which is, once again, the rituals of the sage kings; and a decisive agent, which chooses either to adopt the rituals or unwisely discard them. This agent, the analogue of the lord of a state, is the heart-mind (Goldin 1999: 16–17)[^goldin-1999].[^note-13] As in the Broadway song, “It’s not where you start; it’s where you finish” (Fields *et al*. 1973 [1975: 54])[^fields-1973].
    step1: TBD
    step2: TBD
