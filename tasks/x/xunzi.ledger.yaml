      Second, rituals, in Xunzi’s conception, not only facilitate social cohesion, but also foster moral and psychological development (Ivanhoe 2014; Yearley 2014: 92–101)[^ivanhoe-2014][^yearley-2014]. Indeed, if they did not, they would be mere instruments of expedience, not rituals. These dimensions become clear when Xunzi begins to discuss specific rituals and their purposes. We observe regulations concerning funerary ceremonies and grave goods, for example, in order to learn how to avoid incivility and miserliness (19.4a-b). Similarly, the mandatory three-year mourning period for deceased rulers and parents helps us conduct ourselves properly by providing suitable forms for us to express emotions that are so deep as to be potentially debilitating:
    step1: |-
      其二，在荀子的构想中，礼不仅促进社会凝聚，也促进道德与心理的发展（Ivanhoe 2014; Yearley 2014: 92–101）[^ivanhoe-2014][^yearley-2014]。确实，若非如此，它们就只是权宜的工具，而非礼。当荀子开始讨论具体的礼及其目的时，这些维度就变得清晰。例如，我们观察关于丧葬仪式与随葬品的种种规定，为的是学会如何避免失礼与吝啬（19.4a-b）。同样，为去世的君主与父母服三年之丧的规定，为我们提供了表达深到足以令人崩溃的情感的适当形式，从而帮助我们恰当地自处：
    step2: |-
      其二，在荀子的构想里，礼不只促成社会的凝聚，还滋养道德与心理的成长（Ivanhoe 2014; Yearley 2014: 92–101）[^ivanhoe-2014][^yearley-2014]。诚然，倘若不然，礼便只是权宜的工具，不成其为礼。荀子一旦开始讨论具体的礼及其用意，这些维度便显露出来。比如，我们观察丧葬仪式与随葬品的种种规定，是要学会如何避免失礼与吝啬（19.4a-b）。又如，为故去的君主与父母守三年之丧，其强制性的期限，为那种深到可能把人压垮的情感提供了适当的表达形式，使我们得以恰当地自持：
