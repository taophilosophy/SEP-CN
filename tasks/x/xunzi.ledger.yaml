      The Way that Xunzi invokes in this simile is sometimes called “constancy” (*chang* 常). Heaven’s processes (*tianxing* 天行) do not change from one epoch to the next;[^note-9] thus one must learn how to respond to them with “the right order” (*zhi* 治), whereafter it would be either ignorant or hypocritical to blame Heaven for one’s misfortune. When a ruler governs a state well, there are bound to be good results; when a ruler governs a state badly, there are bound to be bad results. Disasters can have no long-term consequences because a well governed state will prosper even in the face of disasters, and a poorly governed state will be vanquished even if it avoids disasters altogether. (Xunzi’s opinion of foreseeable natural disasters such as hurricanes would undoubtedly have been that they strike *all* states, but a well governed state will be prepared for such an event, whereas a poorly governed state will be in no position to respond to the crisis.) Consequently, Heaven plays a sure but indirect role in determining our fortune or misfortune. Heaven never intercedes directly in human affairs, but human affairs are certain to succeed or fail according to a timeless pattern that Heaven determined before human beings existed. “The revolutions of the sun, moon, and stars, and the cyclical calendar—these were the same under Yu 禹 and Jie 桀” (*Xunzi* 17.4), he notes, referring to a paradigmatic sage king and tyrant, respectively. The same is true of the regular and predictable sequence of the seasons—a particularly significant example, as we shall see.
    step1: |-
      荀子在这一比喻中援引的道，有时被称作“常”（*chang* 常）。天的运行（*tianxing* 天行）不因世代而变；[^note-9] 因此，人必须学会以“治”（*zhi* 治）去回应它们；此后，再把自己的不幸归咎于天，就或是无知，或是虚伪。君主治理国家有方，必有好的结果；治理无方，必有坏的结果。灾难不可能有长远的后果，因为治理良好的国家即使面对灾难也会兴盛，而治理糟糕的国家即使全然避开灾难也终将被击败。（对于飓风这类可以预见的自然灾害，荀子的意见无疑是：它们打击**一切**国家，但治理良好的国家会为此类事件作好准备，而治理糟糕的国家则根本无力应对危机。）结果，天在决定我们的祸福中扮演的角色是确定的，却是间接的。天从不直接干预人事，但人事必然依照天在人类存在之前就已确定的永恒模式而成功或失败。“日月星辰瑞历，是禹、桀之所同也”（《荀子》17.4），他如此说，分别指一位典范的圣王与一位暴君。四季规则而可预测的循环也是如此——这是一个特别有分量的例子，我们将会看到。
    step2: |-
      荀子在这个比喻里援用的道，有时被称作“常”（*chang* 常）。天的运行（*tianxing* 天行）不随世代而改；[^note-9] 因此人必须学会以“治”（*zhi* 治）应之；做到这一步之后，再把自己的不幸诿过于天，就非蠢即伪。君主治国有方，必有善果；治国无方，必有恶果。灾难不可能造成长远的后果：治理良好的国家纵使直面灾难也能兴盛，治理糟糕的国家纵使一场灾难都躲过了，也终将覆亡。（对于飓风这类可以预见的自然灾害，荀子的看法想必是：它们袭击**一切**国家，但治理良好的国家对此类事件早有预备，治理糟糕的国家却根本无力应付危机。）于是，天在决定人间祸福上扮演的角色，确定无疑，却是间接的。天从不直接插手人事；但人事的成败，必然依循一套天在人类存在之前就已定下的万世不移的轨范。“日月星辰瑞历，是禹、桀之所同也”（《荀子》17.4），他如此写道，所指分别是典范的圣王与典型的暴君。四季之循环有常、可以预期，道理相同——如我们将看到的，这是一个分量特别重的例子。
