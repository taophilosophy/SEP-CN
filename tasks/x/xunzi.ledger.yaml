      Chapter 23,[^note-2] “Human Nature is Evil” (*Xing’e* 性惡), is a reasonable point of entry into Xunzi’s philosophy for multiple reasons: it exemplifies some of the textual problems mentioned above; it addresses one of the core themes of the collection; and it was, for centuries, the most frequently cited section of *Xunzi*.
    step1: |-
      第二十三章《性恶》（*Xing'e* 性惡）[^note-2]是进入荀子哲学的一个合理入口，理由有多端：它体现了上文提到的某些文本问题；它讨论了整部文集的核心主题之一；而且几个世纪以来，它一直是《荀子》中被引用最频繁的部分。
    step2: |-
      第二十三章《性恶》（*Xing'e* 性惡）[^note-2]是进入荀子哲学的合理门径，理由不止一端：它体现着上文说过的若干文本问题；它处理全书的核心主题之一；而且数百年来，它一直是《荀子》各篇中被征引最多的一篇。
  - id: 7
    kind: body
    source: |-
      First, the two keywords need to be unpacked. *Xing*, commonly translated as “human nature”, is a term of uncertain etymology that earlier philosophers had used in subtly dissimilar ways. Mencius (372–289 BCE?), for example, used it to refer to the ideal state than an organism is expected to attain under the right conditions, or perhaps an innate tendency toward that state (Graham 1989: 117–32; Graham 1990: 7–66)[^graham-1989][^graham-1990]. Famously, Mencius argued that the *xing* of human beings is good (*shan* 善), by which he meant that all human beings *have the capacity to become* good, even though, in reality, not all people are good, because they fail to exert themselves sufficiently—or even take the obligation seriously.
    step1: |-
      首先要把两个关键词讲清楚。“性”（*xing*）通常英译作 human nature，词源不明，此前的哲学家以微有差别的方式使用它。例如孟子（前 372–前 289 年?）用它指一个有机体在适当条件下被期待达到的理想状态，或指朝向那一状态的某种天生倾向（Graham 1989: 117–32; Graham 1990: 7–66）[^graham-1989][^graham-1990]。孟子的名言是：人之性善（*shan* 善）。他的意思是，所有人都**有能力变好**，尽管现实中并非人人都善，因为他们没有充分努力——甚至没有认真对待这一义务。
    step2: |-
      先要把两个关键词解开。“性”（*xing*）通常英译为 human nature，此词词源不明，早先的哲学家对它的用法彼此微有不同。比如孟子（前 372–前 289 年?）用它指有机体在适当条件下被期待达致的理想状态，或指奔向那一状态的某种天赋倾向（Graham 1989: 117–32; Graham 1990: 7–66）[^graham-1989][^graham-1990]。孟子的名言是：人之性善（*shan* 善）。他的意思是，人人都**有能力变善**，尽管现实中并非人人皆善，因为人们不肯足够用力——甚至不肯把这份义务当回事。
  - id: 8
    kind: body
    source: |-
      In *Xunzi*, “Human Nature is Evil” is framed as an argument with Mencius (who was probably long dead), and takes the view that the *xing* of human beings is the very opposite of *shan*, namely *e*. The basic meaning of *e* is close to “detestable” (as a transitive verb, *wu* 惡 means “to hate”); the translation “evil” is acceptable only with the understanding that something like an Augustinian conception of evil is not intended. (Some scholars opt for “bad”, another standard antonym of “good” in English.) But in prosecuting this position, Xunzi uses *xing* in a fundamentally different sense: “What is so by birth is called *xing*” (*Xunzi* 22.1b).[^note-3] Thus *xing* refers to the basic faculties, capacities, and desires that we have from birth, which cannot be called “good” because following the impulses of our *xing*, without reflecting on them and moderating them, will lead us to act harmfully (Hutton 2000; Tang 2016: 51)[^hutton-2000][^tang-2016].
    step1: |-
      在《荀子》中，《性恶》被写成一篇与孟子的论辩（孟子当时大概早已去世），其主张是：人之性与善（*shan*）恰恰相反，即是恶（*e*）。*e* 的基本义近于“可憎”（作及物动词的“惡”读 *wu*，义为“憎恨”）；把 *e* 译作 evil 尚可接受，但须明白：这并不意味着某种奥古斯丁式的恶的观念。（也有学者选译 bad，即英文里“好”的另一个标准反义词。）但在展开这一立场时，荀子使用的“性”是一个根本不同的含义：“生之所以然者谓之性”（《荀子》22.1b）。[^note-3] 这样，“性”指的就是我们与生俱来的那些基本官能、能力与欲望；它们不能被称为“善”，因为若不加反思与节制地顺着我们本性的冲动走，就会引我们做出有害之事（Hutton 2000; Tang 2016: 51）[^hutton-2000][^tang-2016]。
    step2: |-
      在《荀子》里，《性恶》被写成一篇与孟子的论战文字——那时孟子多半早已不在人世——其立场是：人之性恰是善（*shan*）的反面，即恶（*e*）。*e* 的基本义近于“可憎”（“惡”作及物动词读 *wu*，义为憎恨）；译作 evil 固可接受，但须记住：这里并没有奥古斯丁式的“恶”的意思。（也有学者宁可译作 bad，即英文中“好”的另一个通行反义词。）不过在申说这一立场时，荀子对“性”的用法是另一回事，含义根本不同：“生之所以然者谓之性”（《荀子》22.1b）。[^note-3] 由此，“性”便指我们生而具有的基本官能、能力与欲望。这些东西不能叫“善”，因为顺着本性的冲动行事，不加省察与节制，就会使人做出有害之事（Hutton 2000; Tang 2016: 51）[^hutton-2000][^tang-2016]。
  - id: 9
    kind: body
    source: |-
      In effect, both Xunzi and Mencius argued that human beings all have the capacity to become good, even though some people develop this capacity and others do not (Graham 1989: 250; Shun 1997: 222–31)[^graham-1989][^shun-1997]. The main differences, only recently appreciated, are that they were not operating with the same implicit definitions of *xing*, and Xunzi’s recommendations for moral self-cultivation—that is, how to overcome one’s inherently detestable nature—were more complex than Mencius’s, as we shall see. Because of Mencius’s subsequent prestige, it was commonly supposed that Xunzi’s definition of *xing* was heterodox, if not deliberately subversive. But a collection of Confucian manuscripts recently excavated from a tomb near the modern town of Guodian 郭店 and dated to ca. 300 BCE suggests that it may have been *Mencius’s* usage of *xing*, not Xunzi’s, which was considered eccentric in ancient times.[^note-4] The Guodian text called *The Xing Emerges from the Endowment* (*Xing zi ming chu* 性自命出) defines *xing* in a manner very similar to Xunzi: the set of inborn characteristics shared by all members of a species (Goldin 2005: 38)[^goldin-2005].
    step1: |-
      实际上，荀子与孟子都主张人人都有变善的能力，只是有的人把这一能力发展出来，有的人没有（Graham 1989: 250; Shun 1997: 222–31）[^graham-1989][^shun-1997]。两人的主要差别——直到最近才被意识到——在于：他们心中隐含的“性”的定义并不相同；而且，正如我们将看到的，荀子为道德修养开出的办法——即如何克服自己生而可憎的本性——比孟子的更复杂。由于孟子后来的声望，人们通常认为荀子对“性”的定义是异端，即便不是有意颠覆。但郭店镇附近一座墓中新近出土的一批儒家文献，年代约在前 300 年，提示：古人视为怪异的，也许是**孟子**对“性”的用法，而不是荀子的。[^note-4] 郭店文献中题为《性自命出》（*Xing zi ming chu* 性自命出）的一篇，对“性”的界定与荀子非常接近：它指一物种全体成员共有的、与生俱来的特征之集合（Goldin 2005: 38）[^goldin-2005]。
    step2: |-
      说到底，荀子与孟子都主张人人有变善的能力，只是有人把这份能力养成了，有人没有（Graham 1989: 250; Shun 1997: 222–31）[^graham-1989][^shun-1997]。两人的主要分别——晚近才得到体会——有二：其一，两人心中隐含的“性”的定义并不同一；其二，正如后文所见，荀子就道德修养所开的方子——也就是如何克服那生而可憎的本性——比孟子的更为繁复。孟子后来声望日隆，于是人们惯于认定：荀子给“性”下的定义是异端，甚而是存心立异。可是郭店镇附近一座墓葬新近出土的一批儒家竹书，年代约在前 300 年，却提示：古人眼中不合常规的，或许恰是**孟子**对“性”的用法，而非荀子的用法。[^note-4] 郭店文献中题为《性自命出》（*Xing zi ming chu* 性自命出）的一篇，对“性”的界定与荀子极为接近：性即一物种全体成员共享的、与生俱来的特征之集合（Goldin 2005: 38）[^goldin-2005]。
  - id: 10
    kind: body
    source: |-
      Fixating on the title “Human Nature Is Evil” (which may or may not derive from Xunzi himself) can lead to an elision of the second half of the chapter’s credo: “what is good [in people] is their artifice” (*qi shan zhe wei ye* 其善者偽也). “Artifice” (*wei*)[^note-5] refers to all the traits and habits that we acquire through our own conscious actions. And if we achieve any goodness, it must be because of our artifice:
    step1: |-
      把眼光钉死在《性恶》这个篇名上（此名是否出自荀子本人，尚难断定），容易让人漏掉本章信条的后半：“其善者伪也”（*qi shan zhe wei ye*）——“人身上善的部分是人为”。“伪”（*wei*）[^note-5]指我们经由自己有意识的行动而习得的一切品质与习惯。而我们若成就了任何善，那必定是由于我们的伪：
    step2: |-
