      Although this discussion has presented the Way as an unchanging cosmological reality to which we must conform (or suffer the consequences), it is sometimes understood, rather, as having been constructed by human beings. A.C. Graham first raised this issue by asking, “Is Xunzi saying that man imposes his own meaning on an otherwise meaningless universe?” (Graham 1989: 243)[^graham-1989]. Although Graham himself answered his question in the negative, others have since pressed the point further. This is probably the greatest controversy in Xunzi studies today.
    step1: |-
      尽管以上讨论把道呈现为一个我们必须遵从的不变的宇宙论实在（否则自食其果），它有时却被理解为人类建构的产物。葛瑞汉（A.C. Graham）最先提出这一问题：“荀子是不是在说：人把自身的意义强加于一个本无意义的宇宙？”（Graham 1989: 243）[^graham-1989]。葛瑞汉本人对这一问题的回答是否定的，但此后有人把这一点推进得更远。这大概是今日荀子研究中最大的争论。
    step2: |-
      上文的讨论固然把道呈现为一个不变易的宇宙论实在——我们必须与之相合，否则自食其果——但它有时反而被理解为人类建构出来的东西。葛瑞汉（A.C. Graham）最早提出这个问题：“荀子是不是在说：人把自身的意义强加于一个本无意义的宇宙？”（Graham 1989: 243）[^graham-1989]。葛瑞汉本人对此的回答是否定的；但自那以后，有人把这一点推得更远。这大概是今天荀子研究里最大的一场争论。
