      First, Xunzi elsewhere explicitly denies that an arbitrarily chosen set of rituals would be effective. Rather, the rituals of the sage kings are legitimate because they accord with “that which makes humans human” (*ren zhi suoyi wei ren zhe* 人之所以為人者); by implication, any competing ritual code would necessarily fail. Specifically, human beings, unlike any other species of animal,[^note-6] abide by certain distinctions (*bian* 辨)—male is distinguished from female, old from young, and so on—and it is altogether natural that we do so. The rituals of the sage kings confirm the distinctions that we are bound to make by nature (the core text is *Xunzi* 5.4; see also 10.3a and 19.1c).
    step1: |-
      其一，荀子在别处明确否认：随意挑选的一套礼也能行之有效。相反，圣王之礼之所以正当，是因为它们符合“人之所以为人者”（*ren zhi suoyi wei ren zhe*）；言下之意，任何与之竞争的礼制都必然失败。具体而言，人与任何其他动物物种不同，[^note-6]遵守某些分别（*bian* 辨）——男与女有别，老与少有别，等等——我们这样做完全是自然的。圣王之礼确认了我们天然必定要作的分别（核心文本是《荀子》5.4；另见 10.3a 与 19.1c）。
    step2: |-
      其一，荀子在别处明确否认随手择定的一套礼也能奏效。毋宁说，圣王之礼的正当性在于它们与“人之所以为人者”（*ren zhi suoyi wei ren zhe*）相合；言下之意是，任何与之相竞争的礼制都注定失败。具体说，人与任何其他动物不同，[^note-6]恪守某些分别（*bian* 辨）：男女有别、长幼有别，等等——而我们这样去做，完全是自然而然的。圣王之礼，正是对那些我们天性必定要作的分别的确认（核心文本为《荀子》5.4；另见 10.3a 与 19.1c）。
