    source: |-
      The name Xunzi means Master Xun and refers to Xun Kuang 荀況, who was renowned in his day as “the most revered of teachers” (*zui wei laoshi* 最爲老師). His precise dates are unknown, and extant sources contradict one another: in particular, there is disagreement as to whether he journeyed to the philosophical center of Qi 齊 at the age of fifteen *sui* 歲 (i.e. thirteen or fourteen years of age) or fifty *sui* (forty-eight or forty-nine). The former figure is more plausible (Goldin 1999: 110n.13; Knoblock 1982–83: 33–34)[^goldin-1999][^knoblock-1982], and would indicate a year of birth sometime around 310 BCE All we can surmise of his death is that it must have been after 238 BCE, because he was alive when his patron, Lord Chunshen 春申君, was assassinated in that year. Virtually all available information about his life comes either from internal references in *Xunzi*, the posthumously edited collection of his works, or from his biography in *Records of the Historian* 史記, by Sima Qian 司馬遷 (145?–86? BCE), which is known to contain serious distortions, especially in its treatment of famous philosophers (Kern 2015)[^kern-2015]. Hence modern attempts to piece together Xun Kuang’s life (such as Knoblock 1988–94: I, 3–35; and Liao Mingchun 2005: 535–46)[^knoblock-1988][^liao-2005] are necessarily tentative.
    step1: |-
      “荀子”这个名字意为“荀先生”，指的是荀况。荀况在他那个时代以“最为老师”（*zui wei laoshi*）著称，即公认最受尊崇的老师。他的确切生卒年不详，现存史料彼此矛盾：特别是，他究竟是十五岁（即十三四岁）还是五十岁（即四十八九岁）时前往学术中心齐国，历来有争论。前一说法更为可信（Goldin 1999: 110n.13；Knoblock 1982–83: 33–34）[^goldin-1999][^knoblock-1982]，据此推算，他大约生于前 310 年前后。关于他的死，我们所能推测的只是：必在前 238 年之后，因为他的庇主春申君在那一年遇刺时他还在世。关于他生平的几乎所有可得信息，要么来自《荀子》——他身后由人编辑成书的文集——中的内证，要么来自司马迁（前 145?–前 86? 年）《史记》中他的传记；而《史记》以包含严重失实著称，写著名哲学家时尤其如此（Kern 2015）[^kern-2015]。因此，现代拼接荀况生平的种种尝试（如 Knoblock 1988–94: I, 3–35；Liao Mingchun 2005: 535–46）[^knoblock-1988][^liao-2005]必然只能是尝试性的。
    step2: |-
      荀子之名，意为“荀先生”，其人即荀况。当时人以“最为老师”（*zui wei laoshi*）称之——意思是公认最受尊崇的老师。他的确切生卒年已不可考，现存史料又互相抵牾：尤其是，他究竟是十五岁（也就是十三四岁）便游学于学术中心齐国，还是五十岁（也就是四十八九岁）才去，向来聚讼纷纭。前者更为可信（Goldin 1999: 110n.13；Knoblock 1982–83: 33–34）[^goldin-1999][^knoblock-1982]，若从此说，其生年当在前 310 年前后。至于他的卒年，我们只能断定必在前 238 年之后——这一年他的庇主春申君遇刺身亡，而荀子当时尚在人世。其生平的几乎所有可得信息，或出自《荀子》这部身后由人纂辑的文集中的内证，或出自司马迁（前 145?–前 86? 年）《史记》中的本传；而《史记》以严重失实著称，写著名哲学家时尤其如此（Kern 2015）[^kern-2015]。因此，今人重组荀况生平的种种努力（如 Knoblock 1988–94: I, 3–35；Liao Mingchun 2005: 535–46）[^knoblock-1988][^liao-2005]必然只能是尝试性的。
