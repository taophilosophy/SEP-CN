      One passage, in particular, is frequently cited as support for a constructivist position (Hagen 2007: 11.n31; Tang 2016: 59, 75, 118)[^hagen-2007][^tang-2016]: “The Way is not the Way of Heaven, nor the Way of Earth; it is what people regard as the Way, what the noble man is guided by” (*Xunzi* 8.3). This seems to say, despite what we have seen about apprehending the constancy of Heaven and then applying it profitably to daily life, that we are supposed to disregard the Way of Heaven, and create our own Way instead. The basic problem is that the surviving text of *Xunzi* is vague enough to permit various interpretations, but the repeated references to the importance of observing and appropriately “responding” (*ying* 應) to the seasons would seem to rule out the interpretation that natural patterns are not to be taken as normative.
    step1: |-
      有一段文字尤其常被引作建构主义立场的根据（Hagen 2007: 11.n31; Tang 2016: 59, 75, 118）[^hagen-2007][^tang-2016]：“道者，非天之道，非地之道，人之所以道也，君子之所道也”（《荀子》8.3）。这似乎是说——尽管我们已见过关于把握天之常道并把它有益地应用于日常生活的论述——我们应当撇开天道，另行创造自己的道。根本的困难在于：《荀子》今本文义含糊，足以容许各种解释；但文中反复强调观察四时并恰当地“应”（*ying* 應）之的重要性，这似乎就排除了“自然模式不足为规范”的解释。
    step2: |-
      有一段文字尤其频繁地被引来支撑建构主义的立场（Hagen 2007: 11.n31; Tang 2016: 59, 75, 118）[^hagen-2007][^tang-2016]：“道者，非天之道，非地之道，人之所以道也，君子之所道也”（《荀子》8.3）。这话似乎在说——尽管我们前面刚见过把握天之常道并将其有益地施用于日常生活的论说——我们应当把天道撇在一边，另造自己的道。根本的困难在于：《荀子》今本文义含混，容得下各种解读；但全书反复申说观察四时并妥当“应”（*ying* 應）之的重要，这似乎已足以排除“自然模式不足为规范”的读法。
