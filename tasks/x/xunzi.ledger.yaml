      ## 9. Xunzi’s Reception after His Death
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      At the end of his life, Xunzi was the leading teacher and philosopher in the Chinese world. Among his former students were some of the most influential men in politics, including Han Fei 韓非 (d. 233 BCE),[^note-14] Li Si 李斯 (d. 208 BCE), and Zhang Cang 張蒼 (ca. 250–151 BCE), as well as transmitters of several leading redactions of canonical texts, including Fuqiu Bo 浮丘伯 and perhaps Mao Heng 毛亨 (Goldin 1999: xii)[^goldin-1999].[^note-15]
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      The early Han 漢 dynasty statesman Lu Jia 陸賈 (ca. 228–ca. 140 BCE) is sometimes said to have been Xunzi’s student as well (e.g., by Tang Yan 唐晏 [1857–1920] in Wang Liqi 1986: 222–23)[^wang-1986], but the two men’s dates make this relationship unlikely. Perhaps Lu Jia was a disciple of Fuqiu Bo, and thus an intellectual grandson of Xunzi. Regardless, the strongest evidence of Lu Jia’s indebtedness to Xunzi lies on the level of ideas (Li Dingfang 1980; Liu Guirong 2013: 37–66)[^li-1980][^liu-2013]. Like Xunzi, Lu Jia appealed to the classics, the sages’ textual legacy, as the best practical guide to government and moral self-cultivation (Puett 2002: 253–54; Jin Chunfeng 2006: 73–74)[^jin-2006][^puett-2002]. But Lu’s most important philosophical thesis is that human beings bring about auspicious and inauspicious omens through their own actions.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Xunzi, we recall, argued strongly against the belief in Heavenly portents. Lu Jia accepted Xunzi’s framework, but with a single, consequential innovation: people bring about their own fortune or misfortune by emitting *qi* 氣:
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      > Thus when societies fail and the Way is lost, it is not the work of Heaven. The lord of the state has done something to cause it. Bad government breeds bad *qi*; bad *qi* breeds disasters and abnormalities. (Wang Liqi 1986: 155)[^wang-1986]
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      By adding the element of *qi*—a term that Xunzi rarely used, and certainly did not build into his metaphysics—Lu Jia retains Xunzi’s volitionless and mechanistic Heaven but forges a novel philosophical justification for the arcane science of omenology, which Xunzi mercilessly deprecated. Where Xunzi counseled us to ignore abnormalities, Lu Jia accepts their validity as “admonitions” (*jie* 誡). But, once again, Heaven itself has no effect on our success or failure. If we are faced with a host of wood-boring caterpillars, to use Lu’s vivid example, the only way to account for them is to acknowledge that our government is responsible for their generation through its maleficent conduct (Zhou Guidian 1999: 51–53; Puett 2002: 249–52; Liu Guirong 2013: 50–51)[^liu-2013][^puett-2002][^zhou-1999]. Two coeval philosophers, Jia Yi 賈誼 (201–169 BCE) and Dong Zhongshu 董仲舒 (ca. 198–ca. 107 BCE), agreed that human beings are responsible for their own fortune or misfortune, and thus have no cause to blame Heaven, although Jia Yi did not refer to *qi* in prosecuting his theory, whereas Dong Zhongshu did (Goldin 2007)[^goldin-2007].
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Dong Zhongshu is reported to have written a paean to Xunzi (now lost), and writers of late antiquity, such as Wang Chong 王充 (27–ca. 100 CE) and Ban Gu 班固 (32–92 CE), still took him seriously as a philosopher. But thereafter, Xunzi’s star began to set. In later centuries, the two tirelessly repeated clichés about Xunzi were that he propagated the anti-Mencian doctrine that human nature is evil, and that, by serving as Li Si’s and Han Fei’s teacher, he furthered the cause of Legalism (*fajia* 法家) and thus subverted high-minded principles. Ji Kang 嵇康 (223–262), for example, obliquely identified Xunzi as the chief architect of everything that Ji and his group disdained: artificial ritualism, counterfeit erudition, and an oppressive network of laws that serve only to interfere with the innocuous enjoyment of life (Goldin 2007: 140–42)[^goldin-2007].
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      By the Tang 唐 dynasty, even literati who admired Xunzi—such as Han Yu 韓愈 (768–824)—were careful to add that his works contain grave mistakes (Kong Fan 1997: 281; Liu Youming 2006: 48–50)[^kong-1997][^liu-2006]. In the Song 宋, there were still some voices that praised him, but the opinion with the greatest long-term consequences was that of Zhu Xi 朱熹 (1130–1200), who declared that Xunzi’s philosophy resembled those of non-Confucians such as Shen Buhai 申不害 (fl. 354–340 BCE) and Shang Yang 商鞅 (d. 338 BCE), and that he was indirectly responsible for the notorious disasters of the Qin dynasty (Kong Fan 1997: 291–95)[^kong-1997]. For the rest of imperial history, Xunzi was rejected by the cultural mainstream;[^note-16] into the twentieth century, he was criticized by intellectuals such as Kang Youwei 康有爲 (1858–1927), Tan Sitong 譚嗣同 (1865–1898), and Liang Qichao 梁啟超 (1873–1929) as the progenitor of the Confucian scriptural legacy, which, in their view, had derailed the original Confucian mission and plunged China into a cycle of authoritarianism and corruption that lasted more than two thousand years.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Today the tide has reversed almost completely. Xunzi is one of the most popular philosophers throughout East Asia, and has been the subject of a large number of books published over the past two decades. From a twenty-first-century perspective, this revival of interest in Xunzi is not hard to explain: his body of work has always been one of the best preserved, and with the commonplace scholastic objections to his philosophy having lost most of their cogency, it is only to be expected that philosophical readers should be attracted to his creative but rigorous arguments. In this sense one could say that Xunzi has finally been restored, more than two millennia after his death, to his erstwhile position as *zui wei lao shi*.
    step1: TBD
    step2: TBD
