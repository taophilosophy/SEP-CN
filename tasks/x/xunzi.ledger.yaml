      Like all Confucians, Xunzi accepts that human beings have certain irrepressible impulses (*Xunzi* 20.1), which are not objectionable in themselves. The problem is that unreflective outbursts driven solely by emotional responses may cause harm, and thus we are enjoined to be mindful of our impulses, rather than to extinguish them (compare *Xunzi* 22.5a). To aid us in this process, the Sages left behind appropriate musical compositions that we can use to channel our need to express ourselves. What Xunzi meant by this is the canonical collection of *Odes* (*Shi* 詩), which all Confucians seem to have regarded as a nonpareil repository of edifying literature (Goldin 2005: 35)[^goldin-2005]. Implicit in Xunzi’s argument is the claim that the *Odes* can be used to express any emotion that any human being will ever feel.[^note-7]
    step1: |-
      与所有儒者一样，荀子承认人有某些压抑不住的冲动（《荀子》20.1），它们本身并无可指责。问题在于：单纯由情绪反应驱动的、未经反思的发泄可能造成伤害，因此我们被告诫要省察自己的冲动，而非扑灭它们（比较《荀子》22.5a）。为帮助这一过程，圣人留下了适当的乐曲，我们可以借以疏导自我表达的需要。荀子所说的，就是《诗》（*Shi* 詩）这部正典文集——所有儒者似乎都视之为无可匹比的劝善文献宝库（Goldin 2005: 35）[^goldin-2005]。荀子论证中隐含的主张是：《诗》可以用来表达任何人将会感受到的任何情感。[^note-7]
