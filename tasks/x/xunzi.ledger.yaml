    source: |-
      Sima Qian relates that Xunzi polished his voluminous writings in his old age, but they do not survive in his own recension (Liu 2024: 342–43, Machle 1993: 57–58)[^liu-2024][^machle-1993]. All extant editions of *Xunzi* derive from a compilation by Liu Xiang 劉向 (79–8 BCE), a palace librarian who located 322 bamboo bundles of text (*pian* 篇) that he confidently attributed to Xunzi, of which he eliminated 290 as duplicates. These high numbers suggest that Xunzi’s essays had been circulating independently for about two centuries (Sato 2003: 27–36)[^sato-2003]. The general consensus today is that *Xunzi* is a collection of predominantly authentic essays, but certainly not organized in a manner that Xun Kuang himself had authorized (e.g., Knoblock 1988–94: I, 105–28)[^knoblock-1988]. One indication of the diversity of Liu Xiang’s sources is that a few chapters (notably “A Debate about Warfare” [“Yibing” 議兵]) refer to Xunzi as Sun Qingzi 孫卿子, “Master Chamberlain Sun”, a title that he himself would not have used.[^note-1] The chapter divisions, in particular, seem unreliable: whereas some chapters read like self-standing essays, others do not. In “Refutation of Physiognomy” (“Feixiang” 非相), for example, only the opening lines deal with physiognomy; the rest of the chapter seems to consist of stray passages that Liu Xiang did not quite know where to insert. There are also some chapters with generic instructional material, as well as poems and rhymed riddles that are rarely studied (Knechtges 1989)[^knechtges-1989]. One of the consequences of this arrangement is that reconstructing Xunzi’s arguments requires reading across chapter boundaries: taken as a whole, the book conveys a distinctive philosophical position, but individual chapters are inadequate, indeed sometimes incoherent, on their own (Kern 2016; Hutton 2014: xviii–xxiii)[^hutton-2014][^kern-2016].
    step1: |-
      司马迁说，荀子在晚年润饰了他卷帙浩繁的著述，但这些文字并没有以他本人的定本流传下来（Liu 2024: 342–43；Machle 1993: 57–58）[^liu-2024][^machle-1993]。现存一切版本的《荀子》都源自刘向（前 79–前 8 年）的编纂。刘向是一位宫廷藏书之官，他找到 322 束题名为荀子的竹书（*pian* 篇），自信地归诸荀子名下，并从中剔除重复的 290 篇。数目之巨表明，荀子的各篇文章已各自独立流传了约两个世纪（Sato 2003: 27–36）[^sato-2003]。今天的一般共识是：《荀子》是一部大体真实的文集，但其编排方式肯定不是荀况本人所认可的（如 Knoblock 1988–94: I, 105–28）[^knoblock-1988]。刘向所据材料之驳杂有一迹象可证：少数几篇（最著名的是《议兵》）称荀子为“孙卿子”（*Sun Qingzi* 孫卿子）——这一称呼他本人绝不会使用。[^note-1] 篇章的划分尤其可疑：有的篇章读来像独立成篇的文章，有的则不然。例如《非相》一篇，只有开头几句谈相术，其余部分似乎是刘向不知该插到何处的零散段落。还有一些篇章属于一般性的教诲材料，另有诗与押韵的谜语，很少被人研读（Knechtges 1989）[^knechtges-1989]。这种编排的一个后果是：要重构荀子的论证，就必须跨篇而读。全书合而观之，传达出一种独特的哲学立场；但孤立地看单篇，则不足以自立，有时甚至前后失据（Kern 2016; Hutton 2014: xviii–xxiii）[^hutton-2014][^kern-2016]。
    step2: |-
      司马迁说，荀子晚年润色了自己卷帙浩繁的著述；但这些文字并未以他亲手厘定的本子传世（Liu 2024: 342–43；Machle 1993: 57–58）[^liu-2024][^machle-1993]。现存所有版本的《荀子》，都出自刘向（前 79–前 8 年）的编纂。刘向官居宫廷藏书之职，搜得题为荀子的竹书 322 篇（*pian* 篇），自信地归入荀子名下，又剔除重复的 290 篇。篇数如此之巨，说明荀子的各篇文字已各自单行流传了约两个世纪（Sato 2003: 27–36）[^sato-2003]。今日的一般共识是：《荀子》大体收录真篇，但可以肯定，其编排绝非荀况本人亲手厘定（如 Knoblock 1988–94: I, 105–28）[^knoblock-1988]。刘向来历驳杂的取材有一处明证：有几篇（最显眼的是《议兵》）径称荀子为“孙卿子”（*Sun Qingzi* 孫卿子）——这样的称呼，他本人绝不会使用。[^note-1] 尤其可疑的是篇章的分合：有的篇章读起来像独立自足的论文，有的则不然。以《非相》为例，开篇数句谈相术，其余部分似乎是刘向不知该安插于何处的散段。此外还有些篇章是一般性的训诲材料，又有诗与押韵的谜语，历来少有人研读（Knechtges 1989）[^knechtges-1989]。如此编排的一个后果是：重构荀子的论证，必须跨篇而读。全书合观，传达出一种独特的哲学立场；但孤立地看单篇，则往往不足以自立，有时甚至自相矛盾（Kern 2016; Hutton 2014: xviii–xxiii）[^hutton-2014][^kern-2016]。
