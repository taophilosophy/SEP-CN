slug: hamann
segments:
  - id: 1
    source: |-
      Johann Georg Hamann (1730–1788) lived and worked in Prussia, in the context of the late German Enlightenment. Although he remained outside ‘professional’ philosophical circles, in that he never held a University post, he was respected in his time for his scholarship and breadth of learning. His writings were notorious even in his own time for the challenges they threw down to the reader. These challenges to interpretation and understanding are only heightened today.
    step1: |-
      约翰·格奥尔格·哈曼（Johann Georg Hamann，1730–1788）在普鲁士生活和工作，处于德国启蒙运动晚期。虽然他始终置身于“专业”哲学圈子之外——因为他从未担任大学教职——但他当时因学识渊博、涉猎广泛而受人尊敬。他的著作即使在当时也因其对读者提出的挑战而臭名昭著。这些对解释和理解的挑战，在今天只有更加严峻。
    step2: |-
      约翰·格奥尔格·哈曼（Johann Georg Hamann，1730–1788）在普鲁士生活和工作，处于德国启蒙运动晚期。虽然他始终没有进入“专业”哲学圈子——因为他从未担任大学教职——但他当时因学问渊博、涉猎广泛而受人尊敬。他的著作即使在当时也因其向读者提出的挑战而声名狼藉。这些对解释与理解的挑战，在今天只有增无减。
  - id: 2
    source: |-
      Nevertheless an increasing number of scholars from philosophy, theology, aesthetics and German studies are finding his ideas and insights of value to contemporary concerns. His central preoccupations are still pertinent: language, knowledge, the nature of the human person, sexuality and gender and the relationship of humanity to God. Meanwhile, his views, which in many respects anticipate later challenges to the Enlightenment project and to modernity, are still relevant and even provocative.
    step1: |-
      尽管如此，来自哲学、神学、美学和德国研究的越来越多的学者发现，他的思想和洞见对当代关切仍有价值。他的核心关切至今仍然切题：语言、知识、人的本性、性与性别，以及人性与上帝的关系。与此同时，他的观点在许多方面预示了后来对启蒙事业和现代性的挑战，至今仍然相关，甚至具有挑衅性。
    step2: |-
      尽管如此，越来越多来自哲学、神学、美学和德国研究的学者发现，他的思想与洞见对当代关切仍有价值。他的核心关切至今仍然切题：语言、知识、人的本性、性与性别，以及人性与上帝的关系。同时，他的观点在许多方面预示了后来对启蒙事业与现代性的挑战，至今仍然相关，甚至富有挑衅性。
  - id: 3
    source: |-
      Much of Hamann’s influence, and therefore much academic work on Hamann, falls more properly under the disciplinary scope of ‘theology’. Given the scope of this Encyclopedia, there are subjects that I do not treat here, such as Biblical Interpretation. However, I include works by theologians and studies on theological topics in the Bibliography, as they include some of the most notable contributors to Hamann research.
    step1: |-
      哈曼的影响，以及由此而来的大量关于哈曼的学术工作，更恰当地属于“神学”的学科范围。鉴于本百科全书的范围，有些主题我在此不予处理，例如圣经解释。不过，我在书目中收录了神学家的著作和神学主题的研究，因为它们包括了一些哈曼研究中最著名的贡献者。
    step2: |-
      哈曼的影响，以及由此而来关于哈曼的大量学术工作，更恰当地归于“神学”这一学科范围。鉴于本百科全书的范围，有些主题我在此不作处理，例如圣经解释。不过，我在参考文献中收录了神学家的著作及神学主题的研究，因为其中包括哈曼研究领域一些最著名的贡献者。
