      Detlefsen（1986; 2001; 1979）提出了绕过哥德尔第二定理对希尔伯特纲领之冲击的另一种尝试。Detlefsen 提出了几条辩护路线，其中一条与刚才描述的类似：论证某一版本的 $\omega$-规则是有穷可接受的，尽管无法形式化（然而见 Ignjatovic 1994）[^ignjatovic-1994]。Detlefsen 反对对哥德尔第二定理之通行解释的另一个论证集中于形式化概念：哥德尔公式 $Con_T$ 这一“$T$ 一致”的特定形式化不可证明，并不蕴涵不存在其他公式——它们*在 $T$ 中可证*，且同样有资格被称为“$T$ 一致性的形式化”。这些公式依赖与标准形式化不同的可证明性谓词 $Pr_T$ 形式化。已知只要可证明性谓词服从某些一般可推导性条件，形式化的一致性陈述就不可证明。Detlefsen 论证说，这些条件并非一个谓词成为真正可证明性谓词的必要条件；确实存在违反可证明性条件的可证明性谓词，它们产生的一致性公式*在相应理论中可证*。然而，这些依赖非标准的可证明性概念，希尔伯特很可能不会接受（另见 Resnik 1974、Auerbach 1992 与 Steiner 1991）[^auerbach-1992][^resnik-1974][^steiner-1991]。
