      These unresolved problems of axiomatics led Hilbert to devote significant effort to work on logic in the following years. In 1917, Paul Bernays joined him as his assistant in Göttingen. In a series of courses from 1917–1921, Hilbert, with the assistance of Bernays and Behmann, made significant new contributions to formal logic. The course from 1917 (Hilbert, 1918b), in particular, contains a sophisticated development of first-order logic, and forms the basis of Hilbert and Ackermann’s textbook *Principles of Theoretical Logic* (1928) (see Ewald and Sieg 2013, Sieg 1999, and Zach 1999, 2003)[^ewald-2013][^sieg-1999][^sieg-2013][^zach-1999].
    step1: |-
      这些公理化的未决问题促使希尔伯特在随后几年投入大量精力研究逻辑。1917 年，贝尔奈斯作为他的助手来到哥廷根。在 1917–1921 年的一系列课程中，希尔伯特在贝尔奈斯与贝曼的协助下对形式逻辑作出了显著的新贡献。1917 年的课程（Hilbert, 1918b）尤其包含对一阶逻辑的精巧发展，并构成希尔伯特与 Ackermann 教科书《理论逻辑原理》（*Principles of Theoretical Logic*，1928）的基础（见 Ewald and Sieg 2013, Sieg 1999, and Zach 1999, 2003）[^ewald-2013][^sieg-1999][^sieg-2013][^zach-1999]。
