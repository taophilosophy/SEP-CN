      这一纲领目标的概要由希尔伯特及其合作者在随后十年中充实。在概念方面，有穷观点与一致性证明的策略由 Hilbert（1928）、Hilbert（1923）、Hilbert（1926）以及 Bernays（1928b）、Bernays（1922）、Bernays（1930）加以阐发，其中希尔伯特的文章“论无限”（1926）对有穷立场作了最详细的阐述。除希尔伯特与贝尔奈斯之外，还有若干人参与纲领的技术工作。在哥廷根的讲演中（Hilbert and Bernays, 1923; Hilbert, 1922a），希尔伯特与贝尔奈斯发展了 $arepsilon$-演算，作为他们为算术与分析公理系统选定的最终形式系统。希尔伯特在那里还提出了用他所谓的 $arepsilon$-替换法给出一致性证明的进路。Ackermann（1924）尝试把希尔伯特的想法扩展到一个分析系统。然而该证明是错误的（见 Zach 2003）[^zach-2003]。当时正在哥廷根访问的冯·诺伊曼于 1925 年（1927 年发表）为 $arepsilon$-形式系统（但不包括归纳公理）给出了一个修正的一致性证明。在冯·诺伊曼工作的基础上，Ackermann 设计了一个新的 $arepsilon$-替换程序，并告知贝尔奈斯（见 Bernays 1928b）[^bernays-1928b]。在 1928 年博洛尼亚国际数学家大会的演讲“数学基础的问题”（1929）中，希尔伯特乐观地宣称，Ackermann 与冯·诺伊曼的工作已确立数论的一致性，而分析学的证明已由 Ackermann 完成，“达到只剩下一个纯算术的初等有穷性定理有待证明的程度”。
