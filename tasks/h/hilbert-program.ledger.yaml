      The question of how exactly Hilbert understood the numerals is difficult to answer. They are not physical objects (actual strokes on paper, for instance), since it must always be possible to extend a numeral by adding another stroke (and, as Hilbert also argues in “On the infinite” (1926), it is doubtful that the physical universe is infinite). According to Hilbert (1922b, 202), their “shape can be generally and certainly recognized by us—independently of space and time, of the special conditions of the production of the sign, and of the insignificant differences in the finished product.” They are not mental constructions, since their properties are objective, yet their existence is dependent on their intuitive construction (see Bernays 1923, 226)[^bernays-1923]. What is clear in any case is that they are logically primitive, i.e., they are neither concepts (as Frege’s numbers are) nor sets. What is important here is not primarily their metaphysical status (abstract versus concrete in the current sense of these terms), but that they do not enter into logical relations, e.g., they cannot be predicated of anything. In Bernays’s most mature presentations of finitism (Hilbert and Bernays, 1939; Bernays, 1930), the objects of finitism are characterized as *formal objects* which are recursively generated by a process of repetition; the stroke symbols are then concrete representations of these formal objects.
    step1: |-
      希尔伯特究竟如何理解这些数字，这个问题很难回答。它们不是物理对象（例如纸上实际的笔画），因为总必须能够通过添加另一笔画来扩展一个数字（而且正如希尔伯特在“论无限”（1926）中也论证的那样，物理宇宙是否无限很可怀疑）。按照 Hilbert（1922b, 202）的说法，它们的“形状可以被我们普遍而确定地识别——独立于空间与时间、独立于符号产生时的特殊条件、也独立于成品中无关紧要的差异”。它们也不是心理构造，因为它们的性质是客观的，而它们的存在却依赖于其直观的构造（见 Bernays 1923, 226）[^bernays-1923]。无论如何清楚的是，它们在逻辑上是原始的，即它们既不是概念（像弗雷格的数那样），也不是集合。这里重要的首先不是它们的形而上学地位（按这些术语的通行意义是抽象还是具体），而是它们不进入逻辑关系，例如不能对它们作任何谓述。在贝尔奈斯最成熟的有限主义表述中（Hilbert and Bernays, 1939; Bernays, 1930），有限主义的对象被刻画为*形式对象*，它们由一个重复过程递归生成；笔画符号则是这些形式对象的具体表示。
