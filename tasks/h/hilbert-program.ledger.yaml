      Within the next few years, however, Hilbert came to reject Russell’s logicist solution to the consistency problem for arithmetic. At the same time, Brouwer’s intuitionistic mathematics gained currency. In particular, Hilbert’s former student Hermann Weyl converted to intuitionism. Weyl’s paper “The new foundational crisis in mathematics” (1921) was answered by Hilbert in three talks in Hamburg in the Summer of 1921 (1922b). Here, Hilbert presented his own proposal for a solution to the problem of the foundation of mathematics. This proposal incorporated Hilbert’s ideas from 1904 regarding direct consistency proofs, his conception of axiomatic systems, and also the technical developments in the axiomatization of mathematics in the work of Russell as well as the further developments carried out by him and his collaborators. What was new was the way in which Hilbert wanted to imbue his consistency project with the philosophical significance necessary to answer Brouwer and Weyl’s criticisms: the finitary point of view.
      According to Hilbert, there is a privileged part of mathematics, contentual elementary number theory, which relies only on a “purely intuitive basis of concrete signs.” Whereas the operating with abstract concepts was considered “inadequate and uncertain,” there is a realm of
      > extra-logical discrete objects, which exist intuitively as immediate experience before all thought. If logical inference is to be certain, then these objects must be capable of being completely surveyed in all their parts, and their presentation, their difference, their succession (like the objects themselves) must exist for us immediately, intuitively, as something which cannot be reduced to something else. (Hilbert 1922b, 202; the passage is repeated almost verbatim in Hilbert 1926, 376, Hilbert 1928, 464, and Hilbert 1931b, 267)[^hilbert-1922b][^hilbert-1926][^hilbert-1928][^hilbert-1931b][^hilbert-1928-2]
      These objects were, for Hilbert, *signs*. The domain of contentual number theory consists in the finitary numerals, i.e., sequences of strokes. These have no meaning, i.e., they do not stand for abstract objects, but they can be operated on (e.g., concatenated) and compared. Knowledge of their properties and relations is intuitive and unmediated by logical inference. Contentual number theory developed this way is secure, according to Hilbert: no contradictions can arise simply because there is no logical structure in the propositions of contentual number theory.
      The intuitive-contentual operations with signs forms the basis of Hilbert’s metamathematics. Just as contentual number theory operates with sequences of strokes, so metamathematics operates with sequences of symbols (formulas, proofs). Formulas and proofs can be syntactically manipulated, and the properties and relationships of formulas and proofs are similarly based in a logic-free intuitive capacity which guarantees certainty of knowledge about formulas and proofs arrived at by such syntactic operations. Mathematics itself, however, operates with abstract concepts, e.g., quantifiers, sets, functions, and uses logical inference based on principles such as mathematical induction or the principle of the excluded middle. These “concept-formations” and modes of reasoning had been criticized by Brouwer and others on grounds that they presuppose infinite totalities as given, or that they involve impredicative definitions (which were considered by the critics as viciously circular). Hilbert’s aim was to justify their use. To this end, he pointed out that they can be formalized in axiomatic systems (such as that of *Principia* or those developed by Hilbert himself), and mathematical propositions and proofs thus turn into formulas and derivations from axioms according to strictly circumscribed rules of derivation. Mathematics, so Hilbert, “becomes an inventory of provable formulas.” In this way the proofs of mathematics are subject to metamathematical, contentual investigation. The goal of Hilbert’s program is then to give a contentual, metamathematical proof that there can be no derivation of a contradiction, i.e., no formal derivations of a formula $A$ and of its negation $\neg A$.
      This sketch of the aims of the program was fleshed out by Hilbert and his collaborators in the following 10 years. On the conceptual side, the finite standpoint and the strategy for a consistency proof were elaborated by Hilbert (1928); Hilbert (1923); Hilbert (1926) and Bernays (1928b); Bernays (1922); Bernays (1930), of which Hilbert’s article “On the infinite” (1926) provides the most detailed elaboration of the finitary standpoint. In addition to Hilbert and Bernays, a number of other people were involved in technical work on the program. In lectures given in Göttingen (Hilbert and Bernays, 1923; Hilbert, 1922a), Hilbert and Bernays developed the $\varepsilon$-calculus as their definitive formalism for axiom systems for arithmetic and analysis. Hilbert there also presented his approach to giving consistency proofs using his so-called $\varepsilon$-substitution method. Ackermann (1924) attempted to extend Hilbert’s idea to a system of analysis. The proof was, however, erroneous (see Zach 2003)[^zach-2003]. John von Neumann, then visiting Göttingen, gave a corrected consistency proof for a system of the $\varepsilon$-formalism (which, however, did not include the induction axiom) in 1925 (published in 1927). Building on von Neumann’s work, Ackermann devised a new $\varepsilon$-substitution procedure which he communicated to Bernays (see Bernays 1928b)[^bernays-1928b]. In his address “Problems of the grounding of mathematics” to the International Congress of Mathematicians in Bologna in 1928 (1929), Hilbert optimistically claimed that the work of Ackermann and von Neumann had established the consistency of number theory and that the proof for analysis had already been carried out by Ackermann “to the extent that the only remaining task consists in the proof of an elementary finiteness theorem that is purely arithmetical.”
    step1: |-
      然而在随后几年内，希尔伯特转而拒绝罗素关于算术一致性问题的逻辑主义解决。同时，布劳威尔的直觉主义数学获得流行。特别是希尔伯特的前学生赫尔曼·魏尔转向直觉主义。魏尔的论文《数学中的新基础危机》（1921）被希尔伯特在 1921 年夏季汉堡的三场演讲（1922b）中回应。这里，希尔伯特提出了他自己关于数学基础问题的解决建议。这个建议纳入了希尔伯特 1904 年关于直接一致性证明的观念、他关于公理体系的概念，以及罗素工作中数学公理化的技术发展，还有他与合作者所做出的进一步发展。新的是希尔伯特想要以必要的哲学意义灌注他的一致性计划的方式，以回答布劳威尔与魏尔的批评：即有穷观点。
      按照希尔伯特，数学有一个特权部分，实质的初等数论，它仅依赖“具体符号的纯直观基础”。而运用抽象概念被视为“不充分且不确定”，存在一个领域
      > 逻辑之外的具体对象，它们在一切思维之前作为直接经验直观地存在。如果逻辑推理要确定，那么这些对象必须在所有部分上能够被完全察知，并且它们的呈现、它们的差异、它们的相继（如同对象本身）必须对我们立即地、直观地存在，作为某种不能被还原为别的东西。（Hilbert 1922b, 202；该段落几乎逐字重复于 Hilbert 1926, 376, Hilbert 1928, 464, 和 Hilbert 1931b, 267）[^hilbert-1922b][^hilbert-1926][^hilbert-1928][^hilbert-1931b][^hilbert-1928-2]
      这些对象对希尔伯特而言是*符号*。实质数论的对象域在于有穷数字，即笔画的序列。这些没有意义，即它们不代表抽象对象，但它们可以被运算（例如被连接）并被比较。对它们性质与关系的知识是直观的，不被逻辑推理中介。以此方式发展的实质数论是可靠的，按照希尔伯特：没有矛盾可以产生，仅仅因为实质数论的命题中没有逻辑结构。
      对符号的直观-实质运算形成希尔伯特元数学的基础。正如实质数论以笔画序列运算，元数学以符号（公式、证明）序列运算。公式与证明可以被句法地操作，公式与证明的性质与关系类似地基于无逻辑的直观能力，它保证关于公式与证明的通过此类句法运算获得的知识的确定性。然而数学本身以抽象概念运算，例如量词、集合、函数，并使用基于诸如数学归纳或排中律等原理的逻辑推理。这些“概念形成”与推理方式被布劳威尔和其他人批评，理由是他们预设无限总体为给定，或他们涉及非直谓定义（批评者视为恶性循环）。希尔伯特的目标是证成它们的使用。为此，他指出它们可以在公理体系（如《数学原理》的体系或希尔伯特自己发展的）中被形式化，并且数学命题与证明从而转化为公式和从公理按严格限定的推导规则的推导。数学，如希尔伯特，“成为可证公式的清单”。以此方式数学的证明受元数学的、实质的研究。希尔伯特计划的目标因而是给出一个实质的、元数学的证明，即不能有矛盾的推导，即没有公式 $A$ 和它的否定 $\neg A$ 的形式推导。
      这一计划目标草图在随后 10 年被希尔伯特和他的合作者充实。在概念方面，有穷立场与一致性证明策略被 Hilbert (1928); Hilbert (1923); Hilbert (1926) 和 Bernays (1928b); Bernays (1922); Bernays (1930) 详细阐述，其中希尔伯特的文章《论无限》（1926）提供最有穷立场的详细阐述。除希尔伯特与贝尔奈斯外，其他许多人参与了该计划的技术工作。在哥廷根开设的讲座中（Hilbert and Bernays, 1923; Hilbert, 1922a），希尔伯特与贝尔奈斯发展 $\varepsilon$-演算作为他们对算术与分析公理体系的确定性形式主义。希尔伯特那里也展示了他用所谓 $\varepsilon$-代入方法给出证明的方法。阿克曼（1924）试图将希尔伯特的观念扩展到分析的一个体系。然而该证明是错误的（见 Zach 2003）[^zach-2003]。约翰·冯·诺依曼，当时访问哥廷根，在 1925 年（1927 年发表）为 $\varepsilon$-形式主义的一个体系给出了修正的一致性证明（然而没有包括归纳公理）。在冯·诺依曼工作基础上，阿克曼设计了一个新的 $\varepsilon$-代入程序，他告知了贝尔奈斯（见 Bernays 1928b）[^bernays-1928b]。在他 1928 年（1929）博洛尼亚国际数学家大会的演讲《数学基础问题》中，希尔伯特乐观地宣称阿克曼与冯·诺依曼的工作确立了数论的一致性并且分析的证明已被阿克曼完成“以至于唯一剩下的任务在于证明一个纯粹算术的初等有限性定理”。
    step2: |-
      然而，在此后数年内，希尔伯特转而拒绝罗素关于算术一致性问题的逻辑主义解决。与此同时，布劳威尔的直觉主义数学开始流行。特别是希尔伯特从前的一位学生赫尔曼·魏尔皈依了直觉主义。魏尔的论文《数学中的新基础危机》（1921）由希尔伯特在 1921 年夏季于汉堡的三场演讲（1922b）中予以回应。在这里，希尔伯特提出了他自己关于数学基础问题之解决的方案。这一方案融合了希尔伯特 1904 年关于直接一致性证明的想法、他关于公理体系的观念，以及罗素工作中数学公理化方面的技术发展，还有他与合作者所开展的进一步发展。新意在于，希尔伯特希望以必要的哲学意义来灌注其一致性计划，以回应布劳威尔与魏尔的批评——这一哲学意义即有穷立场。
      按照希尔伯特，数学中存在一个享有特权的部分，即实质的初等数论，它仅依赖“具体符号的纯直观基础”。鉴于运用抽象概念被视为“不充分且不可靠”，于是存在这样一个领域：
      > 逻辑之外的具体对象，它们在一切思维之前作为直接经验而直观地存在。如果逻辑推理要确定可靠，那么这些对象必须能够在所有部分上被完全察知，而且它们的呈现、它们的差异、它们的相继（如同对象本身一样）必须对我们直接地、直观地存在，作为某种不能被还原为别的东西。（Hilbert 1922b, 202；这一段落几乎逐字重复于 Hilbert 1926, 376, Hilbert 1928, 464 与 Hilbert 1931b, 267）[^hilbert-1922b][^hilbert-1926][^hilbert-1928][^hilbert-1931b][^hilbert-1928-2]
      这些对象对希尔伯特而言是*符号*。实质数论的对象域由有穷数字构成，即笔画的序列。它们没有意义，即它们不代表抽象对象，但它们可以被运算（例如被连接）并被比较。对它们的性质与关系的认识是直观的，不经过逻辑推理的中介。按照希尔伯特，以这种方式发展的实质数论是可靠的：不会产生矛盾，仅仅是因为实质数论的命题中没有逻辑结构。
      对符号的直观-实质运算构成希尔伯特元数学的基础。正如实质数论以笔画序列为运算对象，元数学以符号（公式、证明）的序列为运算对象。公式与证明可以被句法地操作，而公式与证明的性质与关系同样基于一种无逻辑的直观能力，这种能力保证通过此类句法运算所得的关于公式与证明的知识确定可靠。然而，数学本身以抽象概念为运算对象，例如量词、集合、函数，并使用基于诸如数学归纳或排中律等原理的逻辑推理。这些“概念形成”与推理方式曾受到布劳威尔等人的批评，理由是它们预先假定无限总体是给定的，或者它们涉及非直谓定义（批评者视之为恶性循环）。希尔伯特的目标是为它们的使用辩护。为此，他指出它们可以在公理体系（如《数学原理》的体系，或希尔伯特自己发展的体系）中被形式化；于是，数学命题与证明转化为公式以及按照严格划定的推导规则的从公理出发的推演。数学，如希尔伯特所说，“成为可证公式的清单”。这样一来，数学的证明便受元数学的、实质的研究。于是希尔伯特计划的目标是给出一个实质的、元数学的证明，表明不可能有矛盾的推导，即不可能形式地推导出公式 $A$ 及其否定 $\neg A$。
      这一计划之目标的草图在随后 10 年里由希尔伯特及其合作者充实。在概念方面，有穷立场与一致性证明的策略由 Hilbert (1928)、Hilbert (1923)、Hilbert (1926) 与 Bernays (1928b)、Bernays (1922)、Bernays (1930) 加以阐发，其中希尔伯特的文章《论无限》（1926）对有穷立场提供了最详细的阐发。除希尔伯特与贝尔奈斯之外，还有其他许多人参与了该计划的技术工作。在哥廷根开设的课程中（Hilbert and Bernays, 1923; Hilbert, 1922a），希尔伯特与贝尔奈斯把 $\varepsilon$-演算发展为他们为算术与分析公理体系所用的确定性形式主义。希尔伯特还在那里展示了其运用所谓 $\varepsilon$-代入方法给出一致性证明的进路。阿克曼（1924）试图把希尔伯特的观念推广到分析的一个体系。然而，这一证明有误（见 Zach 2003）[^zach-2003]。当时正在哥廷根访问的约翰·冯·诺依曼，于 1925 年（1927 年发表）为 $\varepsilon$-形式主义的一个体系给出了修正的一致性证明（不过该体系未包含归纳公理）。在冯·诺依曼工作的基础上，阿克曼设计出一种新的 $\varepsilon$-代入程序，并将其告知贝尔奈斯（见 Bernays 1928b）[^bernays-1928b]。在 1928 年博洛尼亚国际数学家大会的演讲《数学基础问题》（1929）中，希尔伯特乐观地宣称，阿克曼与冯·诺依曼的工作已经确立了数论的一致性，而且分析的一致性证明已经由阿克曼完成，“以至于唯一剩下的任务在于证明一个纯粹算术的初等有限性定理”。
