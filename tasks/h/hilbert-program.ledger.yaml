      The publication of Russell and Whitehead’s *Principia Mathematica* provided the required logical basis for a renewed attack on foundational issues. Beginning in 1914, Hilbert’s student Heinrich Behmann and others studied the system of *Principia* (see Mancosu 1999 on Behmann’s role in Hilbert’s school)[^mancosu-1999]. Hilbert himself returned to work on foundational issues in 1917. In September 1917, he delivered an address to the Swiss Mathematical Society entitled “Axiomatic Thought” (1918a). It is his first published contribution to mathematical foundations since 1905. In it, he again emphasizes the requirement of consistency proofs for axiomatic systems: “The chief requirement of the theory of axioms must go farther [than merely avoiding known paradoxes], namely, to show that within every field of knowledge contradictions based on the underlying axiom-system are *absolutely impossible*.” He poses the proof of the consistency of arithmetic (and of set theory) again as the main open problems. In both these cases, there seems to be nothing more fundamental available to which the consistency could be reduced other than logic itself. And Hilbert then thought that the problem had essentially been solved by Russell’s work in *Principia*. Nevertheless, other fundamental problems of axiomatics remained unsolved, including the problem of the “decidability of every mathematical question,” which also traces back to Hilbert’s 1900 address.
      These unresolved problems of axiomatics led Hilbert to devote significant effort to work on logic in the following years. In 1917, Paul Bernays joined him as his assistant in Göttingen. In a series of courses from 1917–1921, Hilbert, with the assistance of Bernays and Behmann, made significant new contributions to formal logic. The course from 1917 (Hilbert, 1918b), in particular, contains a sophisticated development of first-order logic, and forms the basis of Hilbert and Ackermann’s textbook *Principles of Theoretical Logic* (1928) (see Ewald and Sieg 2013, Sieg 1999, and Zach 1999, 2003)[^ewald-2013][^sieg-1999][^sieg-2013][^zach-1999].
    step1: |-
      罗素与怀特海的《数学原理》的出版为重新进攻基础问题提供了所需的逻辑基础。从 1914 年开始，希尔伯特的学生海因里希·贝曼和其他人研究了《数学原理》的体系（见 Mancosu 1999 关于贝曼在希尔伯特学派中的角色）[^mancosu-1999]。希尔伯特自己在 1917 年回到基础问题的工作。1917 年 9 月，他向瑞士数学学会发表了题为“公理化思想”的演讲（1918a）。这是自 1905 年以来他对数学基础的第一个已发表的贡献。在其中，他再次强调公理体系的一致性证明的要求：“公理理论的首要要求必须更进一步[而不是仅仅避免已知悖论]，即，表明在每一知识领域中，基于潜在公理体系的矛盾是*绝对不可能的*。”他再次提出算术（以及集合论）的一致性证明作为主要的开放问题。在这两种情形中，似乎没有比逻辑本身更基本的东西可用来还原一致性。然后希尔伯特认为该问题本质上已由罗素在《数学原理》中的工作解决。尽管如此，公理学的其他基本问题仍未解决，包括“每个数学问题的可判定性”问题，它同样追溯到希尔伯特 1900 年的演讲。
      公理学的这些未解决问题引导希尔伯特在随后几年投入大量努力于逻辑工作。1917 年，保罗·贝尔奈斯在哥廷根加入他作为他的助手。在一系列 1917–1921 年的课程中，希尔伯特在贝尔奈斯与贝曼的协助下，对形式逻辑作出了重要的新贡献。特别是 1917 年的课程（Hilbert, 1918b），包含一阶逻辑的成熟的发展，并构成希尔伯特与阿克曼的教科书《理论逻辑原理》（1928）的基础（见 Ewald and Sieg 2013, Sieg 1999, 和 Zach 1999, 2003）[^ewald-2013][^sieg-1999][^sieg-2013][^zach-1999]。
    step2: |-
      罗素与怀特海的《数学原理》（*Principia Mathematica*）的出版，为重新进攻基础问题提供了所需的逻辑基础。从 1914 年起，希尔伯特的学生海因里希·贝曼等人研究了《数学原理》的体系（关于贝曼在希尔伯特学派中的地位，见 Mancosu 1999）[^mancosu-1999]。希尔伯特本人于 1917 年回到基础问题的工作。1917 年 9 月，他向瑞士数学学会发表了题为“公理化思想”的演讲（1918a）。这是他自 1905 年以来对数学基础的首项公开贡献。在其中，他再次强调公理体系一致性证明的要求：“公理理论的首要要求必须更进一步[而不仅仅是避免已知悖论]，即表明在每一知识领域中，基于其下公理体系的矛盾都是**绝对不可能**的。”他再次把算术（以及集合论）的一致性证明作为主要的开放问题提出。在这两种情形中，似乎除了逻辑本身之外，没有更根本的东西可用来还原一致性。于是希尔伯特当时认为，这个问题本质上已由罗素在《数学原理》中的工作解决了。尽管如此，公理学中其他根本问题仍未解决，包括“每一个数学问题的可判定性”问题，它同样可追溯至希尔伯特 1900 年的演讲。
      公理学中这些未解决的问题促使希尔伯特在随后的岁月里投入大量精力研究逻辑。1917 年，保罗·贝尔奈斯在哥廷根加入他，担任其助手。在 1917–1921 年的一系列课程中，希尔伯特在贝尔奈斯与贝曼的协助下，对形式逻辑作出了重要的新贡献。特别是 1917 年的课程（Hilbert, 1918b），包含了一阶逻辑的精细发展，并构成了希尔伯特与阿克曼教科书《理论逻辑原理》（*Principles of Theoretical Logic*，1928）的基础（见 Ewald and Sieg 2013, Sieg 1999 与 Zach 1999, 2003）[^ewald-2013][^sieg-1999][^sieg-2013][^zach-1999]。  - id: 4
