      Kreisel（1983; 1968）与 Feferman（Feferman, 1988; Feferman, 1993a）提出了一种在哲学上更令人满意的、以证明论措辞延续希尔伯特纲领的方式。这项工作从一种更宽的希尔伯特纲领观念出发：纲领旨在以受限手段为理想数学提供辩护。按这一观念，希尔伯特证明论的目标是表明：至少就某一类实在命题而言，理想数学不超出实在数学。希尔伯特所设想的那种有穷一致性证明本可做到这一点：理想数学若证明了一个实在命题，该命题便已可由实在（即有穷）方法证明。在某种意义上，这把理想数学还原为实在数学。理论 $T$ 到理论 $S$ 的*证明论还原*表明：就某一类命题而言，如果 $T$ 证明了一个命题，那么 $S$ 也证明它；而这一事实的证明本身是有穷的。于是，希尔伯特的证明论纲领可看作寻找从全部数学到有穷数学的证明论还原；在相对化纲领中，人们寻找的是从弱于全部经典数学的理论到往往强于有穷数学的理论的还原。证明论者已获得若干这类结果，包括把表面看来需要大量理想数学才能辩护的理论（如分析学的子系统）还原为有穷系统。（Feferman, 1993b）把这类结果与另一些结果结合起来——后者表明大部分乃至全部科学上可应用的数学都能在具备此类还原的系统中开展——用以反驳数学哲学中的不可或缺性论证。这类证明论还原的哲学意义，目前仍是争论的主题（Hofweber, 2000; Feferman, 2000）。
