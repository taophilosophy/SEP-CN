      The most basic judgments about finitary numerals are those about equality and inequality. In addition, the finite standpoint allows operations on finitary objects. Here the most basic is that of concatenation. The concatenation of the numerals 11 and 111 is communicated as “$2 + 3$,” and the statement that 11 concatenated with 111 results in the same numeral as 111 concatenated with 11 by “$2 + 3 = 3 + 2$.” In actual proof-theoretic practice, as well as explicitly in (Hilbert and Bernays, 1934; Bernays, 1930), these basic operations are generalized to operations defined by recursion, paradigmatically, primitive recursion, e.g., multiplication and exponentiation (see Parsons 1998 for philosophical difficulties in relation to exponentiation and 2007 for an extended discussion of intuitive mathematics and finitism)[^parsons-1998]. Similarly, finitary judgments may involve not just equality or inequality but also basic decidable properties, such as “is a prime.” This is finitarily acceptable as long as the characteristic function of such a property is itself finitary: For instance, the operation which transforms a numeral to 1 if it is prime and 11 otherwise can be defined by primitive recursion and is hence finitary. Such finitary propositions may be combined by the usual logical operations of conjunction, disjunction, negation, but also bounded quantification. (Hilbert, 1926) gives the example of the proposition that “there is a prime number between $p + 1$ and $p! + 1$” where $p$ is a certain large prime. This statement is finitarily acceptable since it “serves merely to abbreviate the proposition” that either $p + 1$ or $p + 2$ or $p + 3$ or … or $p! + 1$ is a prime.
    step1: |-
      关于有穷数字的最基本判断是相等与不相等。此外，有限立场允许对有穷对象进行运算。这里最基本的是连接。数字 11 与 111 的连接记作“$2 + 3$”，而“11 与 111 连接所得的数值同 111 与 11 连接所得的数值相同”这一陈述记作“$2 + 3 = 3 + 2$”。在实际的证明论实践中，以及在（Hilbert and Bernays, 1934; Bernays, 1930）中明确地，这些基本运算被推广为递归定义的运算，典型的是原始递归，例如乘法与指数运算（关于与指数运算相关的哲学困难，见 Parsons 1998；关于直观数学与有限主义的扩展讨论，见 Parsons 2007）[^parsons-1998]。同样，有穷判断不仅可以涉及相等或不相等，还可以涉及基本的可判定性质，例如“是素数”。只要这类性质的特征函数本身是有穷的，它便是有穷可接受的：例如，把一个数字在其为素数时变换为 1、否则变换为 11 的运算，可以用原始递归定义，故而是有穷的。这样的有穷命题可以由合取、析取、否定等通常的逻辑运算组合，也可以由有界量化组合。（Hilbert, 1926）给出了“在 $p + 1$ 与 $p! + 1$ 之间有一个素数”这一命题的例子，其中 $p$ 是某个大素数。这一陈述是有穷可接受的，因为它“只是用来缩写”如下命题：$p + 1$ 或 $p + 2$ 或 $p + 3$ 或……或 $p! + 1$ 是素数。
