      Tait’s technical analysis yields that the finitistic functions are exactly the primitive recursive ones, and the finitistic number-theoretic truths are exactly those provable in the theory of primitive recursive arithmetic $\PRA.$ It is important to stress that this analysis is not carried out from within the finitist viewpoint itself. Since the general notions of “function” and “proof” are not themselves finitary, the finitist is unable to make sense of Tait’s thesis that everything provable in $\PRA$ is finitistically true. According to Tait, a proper analysis of finitistic provability must not assume that finitism itself has access to such non-finitistic notions. Kreisel’s approach and some criticisms of Tait that rely on reflection principles or $\omega$-rules run afoul of this requirement (see Tait 2002, 2005b)[^tait-2002]. On the other hand, one could argue that $\PRA$ is too strong a theory to count as a formalization of what is “presupposed by all non-trivial mathematical reasoning about numbers”: there are weaker but non-trivial theories which are related to smaller classes of functions than the primitive recursive ones, such as $\PV$ and $\EA$, related to the polynomial-time and Kalmar-elementary functions respectively (see Avigad 2003 on how much mathematics can be carried out in $\EA)[^avigad-2003]$. Using an analysis along the same lines as Tait’s, Ganea (2010) has arrived at the corresponding class of Kalmar-elementary functions as those that are finitistic. See also Incurvati (2019) for further analysis of different notions of finitism.
    step1: |-
      Tait 的技术分析得出：有限主义函数恰好是原始递归函数，有限主义数论真理恰好是在原始递归算术 $\PRA$ 理论中可证明者。重要的是要强调，这一分析并不是从有限主义观点内部作出的。由于“函数”与“证明”这些一般概念本身并非有穷的，有限主义者无法理解 Tait 的论题——凡在 $\PRA$ 中可证明者皆有限主义地真。按 Tait 的看法，对有限主义可证明性的恰当分析不得假定有限主义本身能够使用这类非有限主义概念。Kreisel 的进路以及某些依赖反射原则或 $\omega$-规则对 Tait 的批评，都违反了这一要求（见 Tait 2002, 2005b）[^tait-2002]。另一方面，也可以论证说，$\PRA$ 太强，不足以充当“一切关于数的非平凡数学推理所预设者”的形式化：存在一些较弱但仍非平凡的理论，它们与比原始递归函数更小的函数类相关，例如 $\PV$ 与 $\EA$，分别与多项式时间函数和 Kalmar 初等函数相关（关于在 $\EA$ 中能开展多少数学，见 Avigad 2003）[^avigad-2003]。Ganea（2010）用与 Tait 类似的分析，得出了相应的 Kalmar 初等函数类为有限主义函数类。关于有限主义不同概念的进一步分析，另见 Incurvati（2019）。
