      > [I]f mathematics is to remain a serious cultural concern, then some *sense* must be attached to Hilbert’s game of formulae, and I see only one possibility of attributing it (including its transfinite components) an independent intellectual meaning. In theoretical physics we have before us the great example of a [kind of] knowledge of completely different character than the common or phenomenal knowledge that expresses purely what is given in intuition. While in this case every judgment has its own sense that is completely realizable within intuition, this is by no means the case for the statements of theoretical physics. In that case it is rather *the system as a whole* that is in question if confronted with experience. (Weyl, 1925, 140)
