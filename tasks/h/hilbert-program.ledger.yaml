      20 世纪 20 年代初，德国数学家大卫·希尔伯特（David Hilbert，1862–1943）提出了一项关于经典数学基础的新方案，后来被称为希尔伯特纲领。纲领要求把全部数学形式化为公理形式，并证明这一数学公理化是一致的；而一致性证明本身只许用希尔伯特所谓的“有穷”（finitary）方法来实施。有穷推理的特殊认识论品格，由此给出经典数学所需的辩护。希尔伯特虽然在 1921 年才以这一形式提出纲领，但纲领的各个侧面都植根于他大约自 1900 年以来的基础工作：那一年，他首次指出为分析学给出直接的一致性证明是必要的。20 世纪 20 年代，纲领工作在保罗·贝尔奈斯、Wilhelm Ackermann、冯·诺伊曼与 Herbrand 等逻辑学家的贡献下取得显著进展。它对库尔特·哥德尔也影响巨大：哥德尔关于不完全性定理的工作正是受希尔伯特纲领的推动。人们一般认为，哥德尔的工作表明希尔伯特纲领无法实现。尽管如此，它仍是数学哲学中一个有影响的立场；而且自 20 世纪 30 年代 Gentzen 的工作开始，所谓相对化希尔伯特纲领的工作一直是证明论发展的核心。
