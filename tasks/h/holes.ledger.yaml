    source: |-
      If holes are entities of a kind, then, they appear to be spatiotemporal particulars, like cookies and tins and unlike numbers or moral values. They appear to have a determinate shape, a size, and a location. ('These things have birthplaces and histories. They can change, and things can happen to them', Hofstadter & Dennett 1981: 6–7.)[^hofstadter-1981] On the other hand, if holes are particulars, then they are not particulars of the familiar sort. For holes appear to be *immaterial*: every hole has a material "host" (the stuff around it, such as the edible part of a donut) and it may have a material "guest" (such as the liquid filling a cavity), but the hole itself does not seem to be made of matter. Indeed, holes seem to be *made of nothing*, if anything is. And this gives rise to a number of conundrums. For example:
    step1: |-
      如果洞是某种存在物，那么它们似乎是时空殊相，像饼干与罐头那样，而不像数或道德价值那样。它们似乎具有确定的形状、大小与位置。（'这些东西有出生地与历史。它们能够变化，事情也能发生在它们身上'，Hofstadter & Dennett 1981: 6–7.）[^hofstadter-1981] 另一方面，如果洞是殊相，那么它们并非熟悉意义上的殊相。因为洞似乎是 *immaterial*：每个洞都有一个物质 "host"（它周围的东西，例如甜甜圈的可食部分），也可能有一个物质 "guest"（例如填充空腔的液体），但洞本身似乎并非由物质构成。事实上，洞似乎正是 *made of nothing*——如果真有什么东西是的话。而这引出了一系列难题。例如：
    step2: |-
      那么，如果洞是某种存在物，它们似乎是时空殊相，像饼干与罐头那样，而不像数或道德价值那样。它们似乎具有确定的形状、大小与位置。（“这些东西有出生地与历史。它们能够变化，事情也能发生在它们身上”， Hofstadter & Dennett 1981: 6–7.）[^hofstadter-1981] 另一方面，如果洞是殊相，那么它们并非熟悉意义上的殊相。因为洞似乎是**非物质的**：每个洞都有一个物质“宿主”（它周围的东西，例如甜甜圈的可食部分），也可能有一个物质“住客”（例如填充空腔的液体），但洞本身似乎并非由物质构成。事实上，洞似乎正是由**无**构成的——如果真有什么东西是由无构成的话。而这引出了一系列难题。例如：
