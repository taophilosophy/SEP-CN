      1. Holes are ontologically parasitic: they are always *in* something and cannot exist in isolation. (‘There is no such thing as a hole by itself’, Tucholsky 1931: 100; ‘Take away the thing, and the hole goes too’, Heath 1967: 524)[^heath-1967][^tucholsky-1931]. This is why there cannot exist a world consisting only of holes (Coggins 2010: 71)[^coggins-2010].
      2. Holes are fillable. You don’t necessarily destroy a hole by filling it up (except perhaps when the filling is homogeneous with the hole-lining); you don’t create a new hole by removing the filling.
      3. Holes are locationally gracious. When you fill or put something in a hole, the hole does not squeeze to the side; it shares its location with its guest (and if the guest has a hole, you get two co-located entities of the same kind).
      4. Holes are mereologically structured. They have parts and can bear part-whole relations to one another (though not to their hosts and not to their guests).
      5. Holes are topologically assorted. Superficial hollows are distinguished from internal cavities; straight perforations are distinguished from knotted tunnels.
    step1: |-
      1. 洞在本体论上是寄生的：它们总是*在*某物之中，不能孤立存在。（“没有所谓单独存在的洞”，Tucholsky 1931: 100；“把东西拿走，洞也就没了”，Heath 1967: 524）[^heath-1967][^tucholsky-1931]。正因如此，不可能存在一个只由洞构成的世界（Coggins 2010: 71）[^coggins-2010]。
      2. 洞是可填充的。把洞填满不一定毁掉一个洞（也许当填充物与洞衬同质时除外）；取出填充物也不会造出一个新洞。
      3. 洞在位置上是随和的。当你把某物填入或放入洞中，洞不会挤向一边；它与住客共享位置（而如果住客也有洞，你就得到两个位置重合的同类存在物）。
      4. 洞在分体论上有结构。它们有部分，彼此之间可以具有部分-整体关系（不过不与宿主、也不与住客具有这种关系）。
      5. 洞在拓扑上分类有别。表面的凹窝区别于内部的空腔；笔直的穿孔区别于打了结的隧道。
    step2: |-
      1. 洞在本体论上是寄生的：它们总是*在*某物之中，无法孤立存在。（“没有脱离他物而独存的洞”，Tucholsky 1931: 100；“把东西拿走，洞也随之而去”，Heath 1967: 524）[^heath-1967][^tucholsky-1931]。正因如此，不可能存在一个只由洞构成的世界（Coggins 2010: 71）[^coggins-2010]。
      2. 洞是可填充的。把洞填满未必就毁掉一个洞（也许填充物与洞衬同质时例外）；取走填充物，也不会造出一个新洞。
      3. 洞在位置上很随和。当你往洞里填东西、放东西时，洞不会挤到一边，而是与住客共处一地（如果住客本身也有洞，你就得到两个位置重合的同类存在物）。
      4. 洞在分体论上有结构。它们有部分，彼此之间可以结成部分-整体关系（但不与宿主、也不与住客结成这种关系）。
      5. 洞在拓扑上分门别类。表面凹窝有别于内部空腔；笔直的穿孔有别于打了结的隧道。
