      These difficulties—along with some form of *horror vacui*—may lead a philosopher to favor ontological parsimony or revisionism over naive realism about holes. A number of options are available:
    step1: |-
      这些困难——连同某种形式的 *horror vacui*（对虚空的恐惧）——可能导致一位哲学家偏爱本体论上的简约或修正论，而不是关于洞的朴素实在论。有若干选项可供选择：
    step2: |-
      这些困难，再加上某种 *horror vacui*（对虚空的恐惧），可能促使哲学家宁可选择本体论上的简约或修正论，也不愿接受关于洞的朴素实在论。可供选择的方案有若干：
  - id: 10
    kind: body
    source: |-
      1. One may hold that holes do not exist at all, arguing that all truths putatively about holes boil down to truths about holed objects (Jackson 1977: 132)[^jackson-1977] or, more generally, that all sentences that seem to imply the existence of holes can be paraphrased by sentences that lack the implication but could in principle be used for all the same purposes as the original (van Inwagen 2014)[^inwagen-2014]. This view calls for a systematic way of producing the relevant paraphrases. For instance, the sentence ‘There is a hole in the carpet’ can be treated as a mere grammatical variant of ‘The carpet is perforated’; the sentence ‘There are three round holes in that piece of cheese’ as a variant of ‘That piece of cheese is triply-roundly-holed’, etc. (Challenges: Can every quantification over holes be analyzed this way? Consider: ‘There are as many holes in my cheese as crackers on my plate’; Lewis & Lewis 1970: 207. Can a language be envisaged that contains all the necessary shape predicates? Consider: ‘There are two interlocking toroidal cavities in that piece of cheese’; Casati & Varzi 1994: 180. Can every hole-referring noun-phrase be de-nominalized? Consider: ‘The hole in the tooth was smaller than the dentist’s finest probe’; Geach 1968: 12.)
      2. One may hold that holes do exist, but they are nothing over and above the regions of spacetime at which they are found (Wake *et al.* 2007)[^wake-2007]. Surely they are not just regions of space, for holes can move—as happens any time you move a donut—whereas regions of space cannot. However, as regions of spacetime, holes can be said to move in virtue of having different temporal parts follow one another in different places. (Challenges: Is this view compatible with a relationist metaphysics of spacetime? See Hestevold 2020, ch. 6. Is it compatible with the possibility that holes undergo rotational motion? Take the donut and spin it clockwise. Now take a wedding ring, put it inside the hole in the donut, and spin it counterclockwise. It would seem that the two holes are spinning in opposite directions. Since the relevant temporal part of the little hole is a spatiotemporal part of the bigger one, would it be spinning in *both* directions? See Lewis & Lewis 1970: 208.)
      3. One may hold instead that holes are *qualified* portions of spacetime (Miller 2007)[^miller-2007]. There would be nothing peculiar about such portions as opposed to any others that we would not normally think of as being occupied by ordinary material objects, just as there would be nothing more problematic, in principle, in determining under what conditions a certain portion counts as a hole than there is in determining under what conditions it counts as a dog, a statue, or whatnot. (Challenge: What if there were truly unqualified portions of spacetime, in this or some other possible world? Would there be truly immaterial entities inhabiting such portions, and would holes be among them?)
      4. One might also hold that holes are *ordinary* material beings: they are neither more nor less than superficial parts of what, on the naive view, are their material hosts (Lewis & Lewis 1970; Mollica 2022)[^lewis-1970][^mollica-2022]. For every hole there is a hole-lining and for every hole-lining there is a hole; on this conception, the hole *is* the hole-lining. (Challenge: This calls for an account of the altered meaning of certain predicates or prepositions. Would holes *surround* themselves? Would filling a hole amount to filling space *outside* it? Would expanding the hole-lining amount to *enlarging* the hole?)
      5. Alternatively, one might hold that holes are *parts* of their material hosts, viz. “negative” parts (Hoffman & Richards 1985; Spröte & Fleming 2013)[^hoffman-1985][^spröte-2013]. On this account, a donut would be a sort of hybrid mereological aggregate—the mereological sum of a positive pie and the negative bit in the middle. (Again, this calls for an account of the altered meaning of certain modes of speech. For instance, making a hole would amount to *adding a part*, and splitting a donut open would amount to *removing a part*, contrary to ordinary usage.)
      6. Yet another possibility is to treat holes as “disturbances” of some sort (Karmo 1977)[^karmo-1977]. On this view, a hole is always found *in* some object (its “medium”) in the same sense in which a knot may be found in a rope or a wrinkle in a carpet, and in each case the relevant *in*-relation would entail ontological dependence. (Linguistically, this feature of disturbances is naturally reflected in the corresponding *have*-constructions: ‘The cheese has a hole’, ‘The rope has a knot’, ‘The carpet has a wrinkle’; see Moltmann 2019. Metaphysically, however, the status of disturbances calls for refinements. Simons 1987: 308 suggests construing them as Husserlian moments that continuously change their fundaments, but this seems to suit knots and wrinkles better than holes.)
      7. Finally, it may be held that holes are not the particulars they seem to be. Perhaps they are properties, viz. spatial qualities of their owners (O’Shaughnessy 2000: 333)[^o’shaughnessy-2000], or ways things are (Meadows 2013)[^meadows-2013], or relational entities whose fundamental mode of being is being-in (McDaniel 2010)[^mcdaniel-2010]. Perhaps holes are ways the world is, viz. non-abstract, localized absences that can serve as truth-makers for negative existentials or false-makers for positive existentials (Martin 1996)[^martin-1996]. Or perhaps holes are genuine negative facts, viz. anti-instantiations of material properties by material things: an absence of F-stuff constitutes a hole insofar as it is surrounded by the presence of F-stuff (Barker & Jago 2012)[^barker-2012].
    step1: |-
      1. 人们可以主张洞根本不存在，论证说一切据称关于洞的真理都归结为关于有洞物体的真理（Jackson 1977: 132）[^jackson-1977]，或者更一般地说，一切似乎蕴含洞之存在的句子，都可以被一些缺乏这一蕴含、但原则上可以用于与原来完全相同的各种目的的句子所改述（van Inwagen 2014）[^inwagen-2014]。这种观点需要一种系统性的方式来产生有关的改述。例如，句子“地毯上有个洞”可以被当作“地毯被穿孔了”的一个纯粹语法变体；句子“那块奶酪上有三个圆洞”可以被当作“那块奶酪被三重圆孔穿孔了”的一个变体，等等。（挑战：每一个关于洞的量化都能以这种方式被分析吗？试考虑：“我奶酪上的洞和我盘子上的饼干一样多”；Lewis & Lewis 1970: 207。能否设想一种包含所有必要形状谓词的语言？试考虑：“那块奶酪里有两个互相扣合的环面空腔”；Casati & Varzi 1994: 180。每一个指称洞的名词短语都能被去名词化吗？试考虑：“牙上的那个洞比牙医最细的探针还小”；Geach 1968: 12。）
      2. 人们可以主张洞确实存在，但它们不多不少就是它们所处的时空区域（Wake *et al.* 2007）[^wake-2007]。当然，它们不只是空间区域，因为洞可以移动——每当你移动一个甜甜圈时就会发生——而空间区域不能移动。然而，作为时空区域，可以说洞在移动，因为它的不同时间部分在不同位置相继出现。（挑战：这种观点与时空中关系论的形而上学相容吗？参见 Hestevold 2020，第 6 章。它与洞可能进行旋转运动这一点相容吗？拿那个甜甜圈顺时针旋转。现在拿一枚婚戒，放进甜甜圈的洞里，逆时针旋转。看来两个洞在朝相反方向旋转。由于小洞的相关时间部分是大洞的时空部分，它会在*两个*方向上旋转吗？参见 Lewis & Lewis 1970: 208。）
      3. 人们也可以主张，洞是*带有性质的*时空部分（Miller 2007）[^miller-2007]。这类部分与那些我们通常不会认为被普通物质对象占据的部分相比，没有什么特别之处；正如原则上确定某个部分在什么条件下算作洞，并不比确定它在什么条件下算作狗、雕像之类更成问题。（挑战：如果在本世界或某个其他可能世界中真有完全未带性质的时空部分，情况会怎样？会有真正非物质的实体居于其中吗？洞会在其列吗？）
      4. 人们还可以主张，洞是*普通的*物质存在物：它们不多不少，就是按朴素观点属于其物质宿主的表面部分（Lewis & Lewis 1970; Mollica 2022）[^lewis-1970][^mollica-2022]。有一个洞就有一层洞衬，有一层洞衬就有一个洞；按这种构想，洞*就是*洞衬。（挑战：这要求说明某些谓词或介词改变后的意义。洞会*包围*自己吗？填满一个洞会等于填充它*之外*的空间吗？扩大洞衬会等于*放大*洞吗？）
      5. 或者，人们可以主张，洞是其物质宿主的*部分*，即“负”部分（Hoffman & Richards 1985; Spröte & Fleming 2013）[^hoffman-1985][^spröte-2013]。按这种说法，甜甜圈将是一种混合的分体论聚集体——一块正面的饼与中间那一点负性部分的分体论之和。（这同样要求说明某些说法改变后的意义。例如，打一个洞会等于*增加一个部分*，把甜甜圈掰开则会等于*去掉一个部分*，与日常用法相反。）
      6. 还有一种可能是把洞当作某种“扰动”（Karmo 1977）[^karmo-1977]。按这种观点，洞总是在某个对象（其“介质”）之中被发现，其意义与绳中可以有结、地毯上可以有褶相同；在每种情形中，相关的*在……之中*关系都会蕴含本体论依赖。（在语言上，扰动的这一特征自然反映在相应的*有*字结构中：“奶酪有个洞”“绳子有个结”“地毯有道褶”；参见 Moltmann 2019。然而在形而上学上，扰动的地位需要精细刻画。Simons 1987: 308 建议把它们理解为不断更换其基础的胡塞尔式环节，但这似乎更适合结和褶，而不太适合洞。）
      7. 最后，人们可以主张，洞并不是它们表面上的那种殊相。也许它们是属性，即其拥有者的空间性质（O’Shaughnessy 2000: 333）[^o’shaughnessy-2000]，或者是事物的存在方式（Meadows 2013）[^meadows-2013]，或者是关系性实体，其存在的基本方式是“在……之中”（McDaniel 2010）[^mcdaniel-2010]。也许洞就是世界所是的方式，即非抽象的、局部化的缺失，它们可以充当否定存在命题的真值制造者，或肯定存在命题的假值制造者（Martin 1996）[^martin-1996]。或者，也许洞是真正的否定性事实，即物质事物对物质属性的反例示：只要 F 质料的缺失被 F 质料的存在所环绕，这种缺失就构成一个洞（Barker & Jago 2012）[^barker-2012]。
