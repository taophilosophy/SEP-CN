      As is often the case, the choice between all these alternatives—whether holes are to be subjected to Ockham’s razor, reduced to other entities, or taken at face value—will depend on one’s general metaphysical inclinations (Lewis & Lewis 1996)[^lewis-1996]. It may also depend on controversial details concerning the nature of space and spacetime, e.g. whether they are relational or substantival (Braddon-Mitchell & Miller 2015)[^braddon-mitchell-2015]. It is, more generally, an instance of the sort of decision philosophers have to make when they scrutinize the ontology inherent in the common-sense picture of the world and the concepts, words, and purposes through which it is described and apprehended.
    step1: |-
      正如常见的情形那样，在所有这些备选方案之间作何选择——洞是应当服从奥卡姆剃刀、被还原为其他实体，还是应当按表面价值接受——将取决于一个人总体的形而上学倾向（Lewis & Lewis 1996）[^lewis-1996]。它也可能取决于关于空间与时空本性的有争议的细节，例如它们是关系性的还是实体性的（Braddon-Mitchell & Miller 2015）[^braddon-mitchell-2015]。更一般地说，它是这样一类决定的一个实例：哲学家在审视常识世界图景中国有的本体论，以及描述和理解这一图景所凭借的概念、词语与目的时，不得不作出这类决定。
    step2: |-
      一如既往，在所有这些备选方案之间如何取舍——洞该受奥卡姆剃刀裁剪、该还原为其他实体，还是该按字面接受——取决于一个人总体的形而上学倾向（Lewis & Lewis 1996）[^lewis-1996]。它也可能取决于关于空间与时空本性的争议性细节，例如二者是关系性的还是实体性的（Braddon-Mitchell & Miller 2015）[^braddon-mitchell-2015]。更一般地说，哲学家审视常识世界图景所固有的本体论，考察描述与理解这一图景所用的概念、词语与目的，总得就此拿定主意；上述取舍正是这类决定的一个实例。
