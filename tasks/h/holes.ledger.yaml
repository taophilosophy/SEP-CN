      Further problems arise from the ambiguous status of holes in figure-ground displays. On the one hand, we have robust evidence that their perception is influenced by such factors as convexity (Arnheim 1948)[^arnheim-1948], contour relationship (Bozzi 1975)[^bozzi-1975], grouping (Nelson & Palmer 2001)[^nelson-2001], or pattern entropy (Gillam & Grove 2011)[^gillam-2011], and we understand how these factors relate to others, such as texture and shading (Bertamini & Helmy 2012)[^bertamini-2012]. On the other hand, while it appears that the shapes of holes can be recognized by humans as accurately as the shapes of ordinary objects, the area seen through a hole typically belongs to the background of its host, and there is evidence to the effect that background regions are represented as shapeless (Rubin 1915)[^rubin-1915]. So what would the shape of a hole be, if any? (Bertamini & Croucher 2003; Palmer *et al.* 2008; Nelson *et al.* 2014; Bertamini & Casati 2015.)[^bertamini-2015][^bertamini-2003][^nelson-2014][^palmer-2008]
    step1: |-
      进一步的难题来自洞在图形-背景显示中的模糊地位。一方面，我们有强有力的证据表明，对洞的知觉受到凸性（Arnheim 1948）[^arnheim-1948]、轮廓关系（Bozzi 1975）[^bozzi-1975]、分组（Nelson & Palmer 2001）[^nelson-2001]或图案熵（Gillam & Grove 2011）[^gillam-2011]等因素的影响，而且我们理解这些因素如何与纹理、明暗（Bertamini & Helmy 2012）[^bertamini-2012]等其他因素相关。另一方面，虽然洞的形状似乎能够被人像普通对象的形状那样准确地识别，但透过洞看到的区域通常属于其宿主的背景，而且有证据表明背景区域被表征为无形状的（Rubin 1915）[^rubin-1915]。那么，如果有的话，洞的形状会是什么？（Bertamini & Croucher 2003; Palmer *et al.* 2008; Nelson *et al.* 2014; Bertamini & Casati 2015.）[^bertamini-2015][^bertamini-2003][^nelson-2014][^palmer-2008]
    step2: |-
      更多的难题源于洞在图形-背景显示中的模糊地位。一方面，有充分证据表明，洞的知觉受凸性（Arnheim 1948）[^arnheim-1948]、轮廓关系（Bozzi 1975）[^bozzi-1975]、分组（Nelson & Palmer 2001）[^nelson-2001]与图案熵（Gillam & Grove 2011）[^gillam-2011]等因素的影响，我们也知道这些因素同纹理、明暗（Bertamini & Helmy 2012）[^bertamini-2012]等另一些因素如何相关。另一方面，人识别洞的形状似乎与识别普通对象的形状一样准确，但透过洞看到的区域通常属于宿主的背景，而有证据表明背景区域被表征为无形状（Rubin 1915）[^rubin-1915]。那么，洞若有形状，这形状会是什么？（Bertamini & Croucher 2003; Palmer *et al.* 2008; Nelson *et al.* 2014; Bertamini & Casati 2015.）[^bertamini-2015][^bertamini-2003][^nelson-2014][^palmer-2008]
