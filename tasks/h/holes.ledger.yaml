    source: |-
      If holes are entities of a kind, then, they appear to be spatiotemporal particulars, like cookies and tins and unlike numbers or moral values. They appear to have a determinate shape, a size, and a location. (‘These things have birthplaces and histories. They can change, and things can happen to them’, Hofstadter & Dennett 1981: 6–7.)[^hofstadter-1981] On the other hand, if holes are particulars, then they are not particulars of the familiar sort. For holes appear to be *immaterial*: every hole has a material “host” (the stuff around it, such as the edible part of a donut) and it may have a material “guest” (such as the liquid filling a cavity), but the hole itself does not seem to be made of matter. Indeed, holes seem to be *made of nothing*, if anything is. And this gives rise to a number of conundrums. For example:
    step1: |-
      如果洞是某种存在物，那么它们似乎是时空殊相，像饼干和罐头那样，而不像数或道德价值。它们似乎具有确定的形状、大小和位置。（“这些东西有出生地和历史。它们能够改变，事情也能发生在它们身上”，Hofstadter & Dennett 1981: 6–7.）[^hofstadter-1981] 另一方面，如果洞是殊相，那么它们并不是熟悉的那类殊相。因为洞似乎是*非物质的*：每个洞都有一个物质“宿主”（它周围的材料，例如甜甜圈的可食部分），并且可能有一个物质“guest”（例如填满空腔的液体），但洞本身似乎不是由物质构成的。事实上，如果有任何东西是由无构成的，那似乎正是洞。而这引出了一系列难题。例如：
    step2: |-
      那么，如果洞算得上某种存在物，它们看来便是时空殊相，像饼干和罐头，而不像数或道德价值。它们似乎有确定的形状、大小和位置。（“这些东西有出生地和历史。它们能够改变，事情也会发生在它们身上”，Hofstadter & Dennett 1981: 6–7.）[^hofstadter-1981] 另一方面，如果洞是殊相，那也不是我们熟悉的那类殊相。因为洞似乎是*非物质的*：每个洞都有一个物质“宿主”（它周围的东西，例如甜甜圈的可食部分），也可能有一个物质“住客”（例如填满空腔的液体），但洞本身似乎并不由物质构成。事实上，若有任何东西是*由无构成的*，那似乎正是洞。这就引出了一连串难题。例如：
  - id: 6
    kind: body
    source: |-
      1. It is difficult to explain how holes can in fact be perceived. If perception is grounded on causation, as Locke urged (*Essay*, II-viii-6), and if causality has to do with materiality, then immaterial bodies cannot be the source of any causal flow. So a causal theory of perception would not apply to holes. Our impression of perceiving holes would then be a sort of systematic illusion, on pain of rejecting causal accounts of perception. (On the other hand, if one accepts that absences can be causally efficacious, as urged by Lewis 2004, then a causal account could maintain that we truly perceive holes; see Sorensen 2008 and 2015 along with Siegel 2009, Farennikova 2013, and Calabi 2019.)[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
      2. It is difficult to specify identity criteria for holes—more difficult than for ordinary material objects. If holes are immaterial, we cannot account for the identity of a hole *via* the identity of any constituting stuff. But neither can we rely on the identity conditions of the hole’s material host, for we can imagine changing the host—partly or wholly, gradually or abruptly—without affecting the hole. And we cannot rely on the identity conditions of its guest, for it would seem that we can empty a hole of whatever might partially or fully occupy it and leave the hole intact. (Indeed, both “host” and “guest” are relative notions. Doesn’t their proper application presuppose that we already know how to identify holes in the first place? See Meadows 2015.)[^meadows-2015]
      3. It is equally difficult to account for the mereology of holes. Take a card and punch a hole in it. You have made one hole. Now punch again next to it. Have you made another hole? In a way, yes: now the card is doubly perforated. But what prevents us from saying that we still have one hole, though a hole that comes in two disconnected parts? After all, material objects can be disconnected: a bikini, your copy of the *Recherche*, a token of the lowercase letter ‘i’. Perhaps holes may be disconnected, too? If so, perhaps we have just punched a single, disconnected hole? (Casati & Varzi 2004, 2021)[^casati-2004]
      4. It is also difficult to assess the explanatory relevance of holes. Arguably, whenever a physical interaction can be explained by appealing to the concept of a hole, a matching explanation could be offered that invokes only material objects and their properties. (That the water ran out of the bucket can be explained by appealing to various facts about fluid dynamics, together with an accurate account of the physical and geometric conditions of the bucket.) Aren’t these latter explanations enough?
    step1: |-
      1. 很难解释洞事实上如何能够被知觉。如果知觉奠基于因果性，如洛克所主张（*Essay*, II-viii-6），并且如果因果性与物质性有关，那么非物质物体就不能成为任何因果流的来源。因此，知觉的因果理论不会适用于洞。除非放弃对知觉的因果说明，我们知觉到洞的印象就会是一种系统性的幻觉。（另一方面，如果有人接受缺失可以具有因果效力，如 Lewis 2004 所主张，那么因果说明就可以坚持我们确实知觉到了洞；参见 Sorensen 2008 与 2015，以及 Siegel 2009、Farennikova 2013 与 Calabi 2019。）[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
      2. 为洞规定同一性判据是困难的——比普通物质对象更困难。如果洞是非物质的，我们就不能*通过*任何构成性材料的同一性来说明一个洞的同一性。但我们也同样不能依靠洞的物质宿主的同一性条件，因为我们可以设想改变宿主——部分或全部、逐渐或突然——而不影响洞。我们也不能依靠其住客的同一性条件，因为看来我们可以把任何可能部分或完全占据它的东西从洞中清空，而让洞保持完好。（确实，“宿主”和“住客”都是相对概念。它们的恰当运用难道不预设我们本来就知道如何识别洞吗？参见 Meadows 2015。）[^meadows-2015]
      3. 说明洞的分体论同样困难。拿一张卡片，在上面打一个洞。你做出了一个洞。现在在它旁边再打一个。你做出了另一个洞吗？从某种意义上说，是的：现在这张卡片被双重穿孔了。但什么阻止我们说我们仍然只有一个洞，尽管是一个分成两个不连通部分的洞？毕竟，物质对象可以是不连通的：一件比基尼、你那本 *Recherche*、小写字母“i”的一个实例。也许洞也可以是不连通的？如果是这样，也许我们刚才打出的只是一个单一的、不连通的洞？（Casati & Varzi 2004, 2021）[^casati-2004]
      4. 评估洞的解释相关性同样困难。可以说，每当一个物理相互作用能够通过诉诸洞的概念来解释，就可以给出一个只援引物质对象及其属性的对应解释。（水从桶中流出，可以通过诉诸流体动力学的各种事实，连同对桶的物理与几何条件的准确说明来解释。）这些后一种解释难道还不够吗？
    step2: |-
      1. 洞事实上如何能被知觉，这一点难以解释。如果知觉奠基于因果性——如洛克所主张（*Essay*, II-viii-6）——而因果性又牵涉物质性，那么非物质物体就不能充当任何因果流的源头。这样一来，知觉的因果理论便不适用于洞。除非我们放弃对知觉的因果说明，否则所谓的“知觉到洞”就只能算一种系统性的幻觉。（另一方面，倘若像 Lewis 2004 所主张的那样，承认缺失可以具有因果效力，那么因果说明便能坚持：我们确实知觉到了洞；参见 Sorensen 2008 与 2015，以及 Siegel 2009、Farennikova 2013 与 Calabi 2019。）[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
      2. 为洞确立同一性判据是困难的——比普通物质对象更难。洞既然非物质，我们就无法*借助*任何构成材料的同一性来说明洞的同一性。可我们也无法依靠洞的物质宿主的同一性条件，因为可以设想：宿主部分或全部地、逐渐或突然地改变，洞却不受影响。同样，我们也无法依靠住客的同一性条件，因为看来我们可以把部分或完全占据洞的东西一概清空，而洞依然完好。（事实上，“宿主”与“住客”都是相对概念。要恰当运用它们，岂不预先假定我们本来就知道如何识别洞？参见 Meadows 2015。）[^meadows-2015]
      3. 说明洞的分体论（mereology）同样困难。取一张卡片，在上面打一个洞，你便做出了一个洞。接着在旁边再打一个。你做出了另一个洞吗？从某种意义上说，是的：卡片现在被双重穿孔了。但又有什么能阻止我们说，我们仍然只有一个洞——只不过它由两个不连通的部分组成？毕竟，物质对象也可以不连通：一件比基尼、你那本 *Recherche*、小写字母“i”的一个实例。也许洞也能不连通？若是如此，也许我们刚打的只是单个却不连通的洞？（Casati & Varzi 2004, 2021）[^casati-2004]
      4. 评估洞的解释相关性同样困难。可以说，凡能借助洞的概念来解释的物理相互作用，都能给出一份只援引物质对象及其属性的对应解释。（水从桶中流出，凭借流体动力学的事实、外加桶的物理与几何状况，同样解释得通。）后面这类解释难道还不够吗？
