    step2: |-
      > “一个洞？”咬岩者咕哝道。“不，不是洞。”鬼火绝望地说。“洞毕竟是某种东西。这儿根本什么也不是。”——Ende (1979/1983: 19)
  - id: 4
    kind: body
    source: |-
      Hole representations—no matter whether veridical—appear to be commonplace in human cognition. Not only do people have the impression of seeing holes; they also form a corresponding concept, which is normally lexicalised as a noun in ordinary languages. (Some languages even discriminate different types of hole, distinguishing e.g. between superficial *hollows*, inner *cavities*, and see-through *perforations*.) Moreover, data from developmental psychology and the psychology of perception confirm that infants and adults are able to perceive, count, and track holes just as easily as they perceive, count, and track paradigm material objects such as cookies and tins (Giralt & Bloom 2000; Horowitz & Kuzmova 2011; Porter *et al.* 2016)[^giralt-2000][^horowitz-2011][^porter-2016]. These facts do not prove that holes and material objects are on equal psychological footing, let alone on equal metaphysical footing. But they indicate that the concept of a hole is of significant salience in the common-sense picture of the world, specifically of the spatiotemporal world.
    step1: |-
      洞的表征——无论是否如实——似乎在人类认知中很常见。人们不仅有看见洞的印象；他们也形成一个相应的概念，这个概念在普通语言中通常被词汇化为名词。（有些语言甚至区分不同类型的洞，例如区分表面的 *hollows*、内部的 *cavities* 与穿透的 *perforations*。）此外，来自发展心理学与知觉心理学的数据证实，婴儿与成人能够像知觉、计数和追踪饼干、罐头这类典型物质对象一样，轻松地知觉、计数和追踪洞（Giralt & Bloom 2000; Horowitz & Kuzmova 2011; Porter *et al.* 2016）[^giralt-2000][^horowitz-2011][^porter-2016]。这些事实并不证明洞与物质对象具有同等的心理学地位，更不用说同等的形而上学地位。但它们表明，洞的概念在常识世界图景中——特别是时空世界图景中——具有显著的分量。
    step2: |-
      对洞的表征——无论是否如实——似乎都是人类认知中的寻常之事。人们不仅觉得自己看见了洞，还会形成相应的概念，而这一概念在普通语言中通常被词汇化为名词。（有些语言甚至区分洞的类型：*凹窝* 在表面，*空腔* 在内部，*孔洞* 则贯穿物体。）此外，发展心理学与知觉心理学的数据证实，婴儿和成人都能像知觉、计数、追踪饼干、罐头等典型物质对象那样，轻松地知觉、计数、追踪洞（Giralt & Bloom 2000; Horowitz & Kuzmova 2011; Porter *et al.* 2016）[^giralt-2000][^horowitz-2011][^porter-2016]。这些事实并不证明洞与物质对象在心理学上地位相当，更谈不上在形而上学上地位相当。但它们表明，在常识的世界图景、尤其是时空世界图景中，洞的概念占有显著的位置。
