      It is equally difficult to account for the mereology of holes. Take a card and punch a hole in it. You have made one hole. Now punch again next to it. Have you made another hole? In a way, yes: now the card is doubly perforated. But what prevents us from saying that we still have one hole, though a hole that comes in two disconnected parts? After all, material objects can be disconnected: a bikini, your copy of the *Recherche*, a token of the lowercase letter 'i'. Perhaps holes may be disconnected, too? If so, perhaps we have just punched a single, disconnected hole? (Casati & Varzi 2004, 2021)[^casati-2004]
    step1: |-
      同样困难的是说明洞的分体论。拿一张卡片，在上面打一个洞。你打了一个洞。再在它旁边打一个。你是否打了另一个洞？在某种意义上，是的：现在卡片被双重穿孔了。但什么阻止我们说我们仍然只有一个洞，尽管是一个由两个不连通部分构成的洞？毕竟，物质对象可以是不连通的：比基尼、你那本 *Recherche*、小写字母 'i' 的一个实例。或许洞也可以是不连通的？如果是这样，或许我们刚打的只是一个单个的、不连通的洞？（Casati & Varzi 2004, 2021）[^casati-2004]
    step2: |-
      同样困难的是说明洞的分体论（mereology）。拿一张卡片，在上面打一个洞。你打了一个洞。再在它旁边打一个。你是否打了另一个洞？从某种意义上说，是的：现在卡片被双重穿孔了。但有什么阻止我们说我们仍然只有一个洞——尽管这个洞由两个不连通的部分构成？毕竟，物质对象可以是不连通的：比基尼、你那本《追忆似水年华》、小写字母“i”的一个实例。或许洞也可以是不连通的？如果是这样，或许我们刚打的只是一个单个的、不连通的洞？（Casati & Varzi 2004, 2021）[^casati-2004]
  - id: 8
    source: |-
      It is also difficult to assess the explanatory relevance of holes. Arguably, whenever a physical interaction can be explained by appealing to the concept of a hole, a matching explanation could be offered that invokes only material objects and their properties. (That the water ran out of the bucket can be explained by appealing to various facts about fluid dynamics, together with an accurate account of the physical and geometric conditions of the bucket.) Aren't these latter explanations enough?
    step1: |-
      评估洞的解释相关性也是困难的。可以说，每当一个物理相互作用可以通过诉诸洞的概念来解释，就能给出一个只涉及物质对象及其属性的匹配说明。（水从桶中流出，可以通过诉诸流体动力学的各种事实，连同对桶的物理与几何条件的精确说明来解释。）这些后一种说明难道不够吗？
    step2: |-
      评估洞的解释相关性也是困难的。可以说，凡能通过诉诸洞的概念来解释的物理相互作用，都能给出一个只涉及物质对象及其属性的匹配说明。（水从桶中流出，可以通过诉诸流体动力学的种种事实，连同对桶的物理与几何条件的精确描述来说明。）这些后一种说明难道还不够吗？
