      It is difficult to explain how holes can in fact be perceived. If perception is grounded on causation, as Locke urged (*Essay*, II-viii-6), and if causality has to do with materiality, then immaterial bodies cannot be the source of any causal flow. So a causal theory of perception would not apply to holes. Our impression of perceiving holes would then be a sort of systematic illusion, on pain of rejecting causal accounts of perception. (On the other hand, if one accepts that absences can be causally efficacious, as urged by Lewis 2004, then a causal account could maintain that we truly perceive holes; see Sorensen 2008 and 2015 along with Siegel 2009, Farennikova 2013, and Calabi 2019.)[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
    step1: |-
      洞事实上如何能被知觉，这是难以解释的。如果知觉以因果性为基础，如洛克所主张（*Essay*, II-viii-6），并且如果因果性与物质性有关，那么非物质物体不能成为任何因果流的来源。所以知觉的因果理论不适用于洞。我们知觉到洞的印象于是会是某种系统性的幻觉，除非拒斥对知觉的因果说明。（另一方面，如果人们接受缺失可以是因果有效的，如 Lewis 2004 所主张，那么因果说明可以坚持我们真正知觉洞；参见 Sorensen 2008 与 2015，连同 Siegel 2009、Farennikova 2013 与 Calabi 2019。）[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
    step2: |-
      洞事实上如何能被知觉，这是难以解释的。如果知觉以因果性为基础，如洛克所主张（*Essay*, II-viii-6），而因果性又与物质性相关，那么非物质物体就不能成为任何因果流的来源。因此，知觉的因果理论并不适用于洞。我们知觉到洞的印象，就会成为一种系统性的幻觉——除非我们拒斥对知觉的因果说明。（另一方面，如果人们接受缺失可以是因果有效的，如 Lewis 2004 所主张，那么因果说明就可以坚持我们确实知觉到了洞；参见 Sorensen 2008 与 2015，以及 Siegel 2009、Farennikova 2013 与 Calabi 2019。）[^calabi-2019][^farennikova-2013][^lewis-2004][^siegel-2009][^sorensen-2008][^sorensen-2015]
  - id: 6
    source: |-
      It is difficult to specify identity criteria for holes—more difficult than for ordinary material objects. If holes are immaterial, we cannot account for the identity of a hole *via* the identity of any constituting stuff. But neither can we rely on the identity conditions of the hole's material host, for we can imagine changing the host—partly or wholly, gradually or abruptly—without affecting the hole. And we cannot rely on the identity conditions of its guest, for it would seem that we can empty a hole of whatever might partially or fully occupy it and leave the hole intact. (Indeed, both "host" and "guest" are relative notions. Doesn't their proper application presuppose that we already know how to identify holes in the first place? See Meadows 2015.)[^meadows-2015]
    step1: |-
      为洞规定同一性判据是困难的——比普通物质对象更困难。如果洞是非物质的，我们不能借任何构成性材料的同一性来说明洞的同一性。但我们也不能依赖洞的物质宿主的同一性条件，因为我们可以设想改变宿主——部分或全部、逐渐或突然——而不影响洞。我们也不能依赖其住客的同一性条件，因为似乎我们可以把洞中可能部分或完全占据它的东西掏空而让洞保持完好。（事实上，'host' 与 'guest' 都是相对概念。它们的恰当运用，难道不预设我们已经知道如何识别洞吗？参见 Meadows 2015。）[^meadows-2015]
    step2: |-
      为洞规定同一性判据是困难的——比普通物质对象更为困难。如果洞是非物质的，我们就不能借任何构成性材料的同一性来说明洞的同一性。但我们也不能依赖洞的物质宿主的同一性条件，因为我们可以设想改变宿主——部分或全部、逐渐或突然——而不影响洞。我们也不能依赖其住客的同一性条件，因为似乎我们可以把洞中可能部分或全部占据它的东西掏空，而让洞保持完好。（事实上，“宿主”与“住客”都是相对概念。它们的恰当运用，难道不预设我们本来就已经知道如何识别洞吗？参见 Meadows 2015。）[^meadows-2015]
