    source: |-
      Holes are an interesting case study for ontologists and epistemologists. On the one hand, naive descriptions of the world treat holes as objects of reference and quantification, on a par with ordinary material objects (‘This hole has no lid’; ‘That cheese has seven holes’). Moreover, we often appeal to holes to account for causal interactions (‘The hole in the roof caused a leak’), or to explain the occurrence of certain events (‘The water spilled because the bucket has a hole’). All this provides initial evidence for treating holes as real entities. On the other hand, holes appear to be much more elusive than ordinary objects, ontologically as well as epistemologically; after all, they are a paradigm example of nothingness. So one may wonder whether such evidence is to be taken seriously. Should we instead think that all talk about holes is a misleading *façon de parler*? Are holes real things, or are they mere *entia representationis*, *as-if* entities, fictions?
    step1: |-
      洞对本体论学者与认识论学者而言是一个有趣的研究案例。一方面，关于世界的朴素描述把洞当作指称与量化的对象，与普通物质对象同等对待（“这个洞没有盖子”；“那块奶酪有七个洞”）。而且，我们常常诉诸洞来说明因果相互作用（“屋顶上的洞导致了一次漏水”），或者解释某些事件的发生（“水之所以洒出来，是因为桶上有个洞”）。所有这些都为把洞当作真实存在物提供了初步证据。另一方面，洞似乎比普通对象难以捉摸得多，在本体论上和认识论上都是如此；毕竟，它们是虚无的一个典型例证。所以人们可能想知道，这样的证据是否应当被认真对待。我们是否反而应当认为，一切关于洞的谈论都是一种误导性的 *façon de parler*？洞是真实的东西，还是仅仅是 *entia representationis*、*as-if* 存在物、虚构物？
    step2: |-
      洞对本体论学者与认识论学者而言是一个有趣的研究案例。一方面，对世界的朴素描述把洞当作指称与量化的对象，与普通物质对象一视同仁（“这个洞没有盖子”；“那块奶酪有七个洞”）。此外，我们常常借助洞来说明因果互动（“屋顶上的洞导致了漏水”），或解释某些事件何以发生（“水洒了出来，因为桶上有个洞”）。凡此种种，都为把洞视为真实存在物提供了初步证据。另一方面，洞似乎远比普通对象难以捉摸，无论在本体论上还是认识论上都如此；毕竟，它们是虚无的典型例证。于是人们不免要问：这类证据是否应当认真对待？我们是否应当转而认为，一切关于洞的谈论都只是一种误导性的“说话方式”（*façon de parler*）？洞是真实的东西，还是仅仅为 *entia representationis*、*as-if* 存在物、虚构物？
