    source: |-
      Developing an older distinction, the *Chunqiu Fanlu* uses the contrast of *yin* and *yang*, the qualities associated with each, and their transformations, to make sense of properties of the world and humans. One of the key features of this naturalistic shift of the Han is the view that “heaven/nature and humanity are as one” (*tian ren yi ye* 天人一也, CQFL 49.1). The principles and patterns that explain the operation of the natural world, such as *yin-yang* and the five phases, also explain human characteristics, society, and conduct. There is some debate as to whether *yin* and *yang* are something like properties of their own that belong to objects and events, or whether they are qualities or types of *qi*. In some parts of the text, *yin* and *yang* are discussed as if they are particular and concrete elements of the world, and in other parts of the text *yin* and *yang* are discussed as features of *qi*. The *Chunqiu Fanlu*, unlike earlier Daoist texts, takes a partisan stance here, arguing that we should value *yang* over *yin*. *Yang* is associated with positive features such as virtue, humanity, and life, while *yin* is understood as absence, and associated with the opposing features of vice, violence, and death. This contrasts with earlier “Daoist” texts, which generally take *yin* and *yang* to be mutually valuable principles of change, which should be followed as situations call for. The *Chunqiu Fanlu* argues instead that we should “honor *yang* and denigrate *yin*” (CQFL 43.1), and that “*yang* is lofty, *yin* is lowly.” (CQFL 43, Queen & Major 2016: 393)[^queen-2016]
    step1: |-
      《春秋繁露》发展了一个更早的区分，用阴与阳的对立、各自关联的性质以及二者的转化，来理解世界与人的各种属性。汉代这一自然主义转向的一个关键特征，是“天人一也”的观点（*tian ren yi ye* 天人一也，CQFL 49.1）。解释自然界运作的原理与法则，如阴阳与五行，同样也解释人的特征、社会与行为。关于阴与阳究竟是某种自身属于对象与事件的性质，还是气的性质或类型，学界尚有争论。在文本的某些部分，阴阳被当作世界具体而个别的要素来讨论；在另一些部分，阴阳又被当作气的特征来讨论。与早期道家文本不同，《春秋繁露》在此采取党派性立场，主张我们应当贵阳而贱阴。阳与德性、仁爱、生命等正面特征相关联，阴则被理解为欠缺，并与恶、暴力、死亡等相反的特征相关联。这与早期“道家”文本形成对照：后者一般把阴阳视为彼此同样有价值的变化原理，应当随情境需要而依循。《春秋繁露》却主张我们应“尊阳而卑阴”（CQFL 43.1），并且“阳尊而阴卑”（CQFL 43，Queen & Major 2016: 393）[^queen-2016]。
    step2: |-
      《春秋繁露》沿用更早的一个区分：以阴阳对立、二者各自关联的性质及其转化，来解释世界与人的种种属性。汉代这场自然主义转向有一个关键特征，即“天人一也”之见（*tian ren yi ye* 天人一也，CQFL 49.1）：解释自然界运作的原理与法则——阴阳、五行——同时也解释人的特征、社会与行为。阴与阳究竟是对象和事件自身具有的某种性质，还是气的性质或类别，学界尚有争论。书中有些地方把阴阳当作世界中具体而个别的要素来谈，另一些地方又把它们当作气的特征来谈。与早期道家文本不同，《春秋繁露》在此选边站定：阳的价值高于阴。阳与德性、仁、生命等正面特征相联；阴则被理解为“无”，与恶、暴力、死亡等相反特征相联。这同早期“道家”文本正相反——后者一般视阴阳为价值对等的变化原理，应随情境所需而依循。《春秋繁露》却主张“尊阳而卑阴”（CQFL 43.1），主张“阳尊阴卑”（CQFL 43，Queen & Major 2016: 393）[^queen-2016]。
