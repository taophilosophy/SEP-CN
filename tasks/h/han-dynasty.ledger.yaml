      The work of Wang Fu (82–167 CE) represents one of the strains of Confucian thought that began to gain new ground in the Eastern Han as the dynasty went into decline leading toward the series of catastrophes that would end with the collapse of the Han in the late second and early third centuries CE. The tradition of social criticism had long been part of Confucian scholarship, but Wang Fu’s work *Qianfulun* (Discourses of a Hermit) revived the theme of Confucian reclusion, a controversial idea, though one suggested in texts such as the *Analects* itself. Perhaps the most famous example of such reclusion (in Wang’s time and our own) was that of the Warring States Period scholar Qu Yuan (c. 340–278 BCE), the subject and purported author of the poems of the Han period compilation *Chuci* (Songs of Chu). Qu Yuan, faced with the decline of society past the point of reformation, went into exile in the distant wilds, composing his laments including the famous poem *Li Sao* (compiled in the *Chuci*), and eventually committing suicide by drowning himself in the river as a final act of righteous protest (see Berkowitz 1992; Schneider 1980)[^berkowitz-1992][^schneider-1980].
    step1: |-
      王符（公元 82–167 年）的著作，代表儒家思想的一个支脉：随着东汉走向衰落、通往公元二三世纪之交以汉朝崩溃告终的那一连串灾难，这支思想开始获得新的地盘。社会批判的传统久已是儒学的组成部分，但王符的《潜夫论》重新激活了儒家隐逸的主题——一个有争议的观念，尽管《论语》等文本本身已有所暗示。这类隐逸（在王符的时代与我们今天）最有名的例子，也许是战国学者屈原（约公元前 340–278 年）——汉代辑成的《楚辞》中诗歌的主角与所托作者。屈原眼见社会衰败到无法挽回的地步，遂放逐到遥远的旷野，写下包括名篇《离骚》在内的诸多哀歌（辑入《楚辞》），最终投江自尽，以最后的义愤抗议作结（见 Berkowitz 1992; Schneider 1980）[^berkowitz-1992][^schneider-1980]。
