      Moving into the Three Kingdoms and the Wei and Jin periods, we see the rise of Buddhist thought (and philosophy) in China and the development of “religious Daoism”, as personal and individual concerns start to take central stage, over the communal and political concerns that had been central to earlier periods of Chinese history. The reasons for this shift are not altogether clear, but one plausible story is that the breakdown of Han government and the roots of the shift to the internal with its roots in Eastern Han withdrawal and culminating in Xuanxue thought of figures like Guo Xiang (252–312 CE) and Wang Bi (226–249 CE) are partly responsible for this shift (Holcombe 1994: 87–90)[^holcombe-1994]. Many of the concerns and themes of Eastern Han endure throughout the history of Chinese thought. Particularly, the conflict between individual retirement from worldly concerns (in either Confucian or Buddhist mode) and the duty to engage in the social project, as well as eremeticism as a form of protest, remain major features of Chinese intellectual life down to the current day.
    step1: |-
      进入三国与魏晋时期，我们看到佛教思想（与哲学）在中国的兴起，以及“宗教道教”的发展；此时个人与个体的关切开始取代中国早期历史的共同体与政治关切，居于中心。这种转变的缘由并不完全清楚，但一个可信的解释是：汉政府的崩解，以及向内在的转向——其根子在东汉的退隐，而集大成于郭象（252–312 年）、王弼（226–249 年）等人的玄学思想——对这一转变负有部分责任（Holcombe 1994: 87–90）[^holcombe-1994]。东汉的许多关切与主题，在此后整个中国思想史中绵延不绝。尤其是：个人遁离世务（无论儒家的还是佛教的方式）与投身社会工程之责任之间的冲突，以及作为抗议形式的隐逸——直到今天仍是中国思想生活的主要特征。
    step2: |-
      进入三国与魏晋，佛教思想（及其哲学）在中国兴起，“宗教化道教”也发展起来：个人与个体的关切走上台前，取代了中国早期历史中居核心的共同体关切与政治关切。这场转变的原因并不全然清楚。一个可信的说法是：汉政府崩解，加上向内在的转向——其根源在东汉的退隐之风，集大成于郭象（252–312 年）、王弼（226–249 年）等人的玄学——应当为此负一部分责任（Holcombe 1994: 87–90）[^holcombe-1994]。东汉的许多关切与主题，在此后整个中国思想史上绵延不绝。尤其突出的是：个人遁离世务（无论儒家方式还是佛教方式），与他投身社会事业的责任相冲突；作为抗议的隐逸同样如此。直到今天，这些仍是中国思想生活一大特征。
