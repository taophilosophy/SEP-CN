      While the critical and naturalistic thought of Huan Tan is only today known through fragments, we have far more material from Wang Chong (27–100 CE), a somewhat similar thinker of the Eastern Han whose work was likely influenced by Huan. While Wang Chong was a somewhat marginal figure in his time (a situation about which he complains in his work), his thought became influential indirectly in later years, particularly in the leadup to the *Xuanxue* movement in the Wei-Jin period. Wang’s writing was not only voluminous, but contained a wealth of historical references, quotes, and citations of earlier thinkers. Wang apparently studied a wide range of texts, and wrote about many of them. Thus, his work survived mainly due to being collected and used as a kind of encyclopedia by figures in the late Han and Wei-Jin periods. A number of these figures became prominent in the “*Qingtan*” (pure talk) discussion movement that preceded *Xuanxue*, and Wang’s ideas influenced the movement via this direction (see McLeod 2020)[^mcleod-2020].
    step1: |-
      桓谭的批判与自然主义思想今天只能靠残篇得知；王充（公元 27–100 年）则给我们留下了多得多的材料。他是东汉一位与桓谭相近的思想家，其著作很可能受过桓谭的影响。王充在他那个时代多少是个边缘人物（他本人就在著作中抱怨这一点），但他的思想在后世间接产生了影响，尤其是魏晋玄学运动兴起的前夜。王充不仅著述浩繁，而且其中富含历史掌故、引文与对前代思想家的征引。他显然研读过极广的文本，并就其中许多写过文字。因此，他的著作得以留存，主要是由于汉末与魏晋人物把它收集起来、当作一种百科全书使用。这些人物中有若干位在先于玄学的“清谈”论辩运动中出了名，王充的思想经由这一渠道影响了该运动（见 McLeod 2020）[^mcleod-2020]。
