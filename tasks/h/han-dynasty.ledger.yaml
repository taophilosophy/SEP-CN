      Earlier forms of syncretism involved the intentional combination of aspects of different schools and textual traditions, such as Confucianism, Daoism, and Legalism. While we see this to some extent in texts like the *Chunqiu Fanlu*, these forms of syncretism were often not explicit. The *Huainanzi*, on the other hand, openly discusses its synthesis of ideas from across previously opposing schools and traditions. In the *Huainanzi*, we find a specific methodology for and justification of synthesis built from a framework using ideas primarily from the *Zhuangzi* and *Daodejing*, but involving Confucian, Legalist, and even Mohist ideas as well. Numerous scholars have debated the ultimate purpose of the *Huainanzi*’s syncretism (see Goldin 1999; Vankeerberghen 2001)[^goldin-1999][^vankeerberghen-2001]. Clearly there is a political aim of the overall project. Liu An (179–122 BCE), the vassal ruler of the territory of Huainan, brought together the scholars who constructed the text. Liu was concerned with the ideology of empire. His primary aim was the development of a system synthesizing the numerous and diverse peoples, cultures, systems, languages, and ways of life throughout the still relatively new Han empire. The ways of governance and social ideologies of the past, Liu recognized, may have been acceptable in the smaller-scale societies in which they developed. But these societies were already unified by language, culture, and social norms. Imposing the norms and ideology of a single people on others simply would not work in a territory as large and diverse as that controlled by the Han. What was needed was a political, ethical, and metaphysical system that unified the variety of peoples in a single social project while at the same time allowing for the independence and individuality of their local approaches. What resulted from this reflection by the committee of scholars at Liu An’s court was one of the most comprehensive and powerful syntheses in the history of human thought. Liu An’s scholars almost seamlessly combined all of the known philosophical, political, scientific, and religious systems of their day into one overarching explanation of the cosmos.
    step1: |-
      较早的折中主义形态，是有意把不同学派与文本传统的方面结合起来，如儒家、道家与法家。我们在《春秋繁露》一类文本中多少能看到这种做法，但这类折中往往并不明言。《淮南子》则不同，它公开讨论自己对先前彼此对立的各学派、各传统之观念的综汇。在《淮南子》中，我们可以找到一套关于综合的具体方法论与辩护，其框架主要取自《庄子》与《道德经》的观念，同时也涉及儒家、法家乃至墨家的观念。许多学者争论过《淮南子》折中主义的最终目的（见 Goldin 1999; Vankeerberghen 2001）[^goldin-1999][^vankeerberghen-2001]。整个工程显然有政治目的。淮南国的诸侯王刘安（公元前 179–122 年）召集学者撰成此书。刘安关心的是帝国的意识形态。他的首要目标，是建立一个体系，把当时仍相对年轻的汉帝国境内众多不同的民族、文化、制度、语言与生活方式综合起来。刘安认识到，过去的治理方式与社会意识形态，在其发展所在的小型社会中或许可行；但这些社会本已由语言、文化与社会规范统一起来。把单一民族的规范与意识形态强加于他人，在汉朝所控制的这样辽阔而多样的疆域内根本行不通。所需要的，是一套政治、伦理与形而上学的体系：它把多样的民族统一在同一个社会工程之中，同时又容许各地做法保持独立与个性。刘安幕府中学者群体的这番思考，结出了人类思想史上最全面、最有力的综合之一。刘安的学者们几乎无缝地把当时已知的一切哲学、政治、科学与宗教体系，整合进一个关于宇宙的总纲式解释之中。
    step2: |-
      较早的折中，往往是有意把不同学派与文本传统的成分拼合起来，如儒家、道家、法家。这种做法在《春秋繁露》一类文本中已见端倪，但通常并不明说。《淮南子》不同，它公开讨论自己如何综汇先前彼此对立的各派各家的观念。书中有一套关于综合的方法论与辩护，其框架主要取自《庄子》与《道德经》，同时也牵入儒家、法家乃至墨家的观念。对于《淮南子》折中主义的最终用意，学者们争论不休（见 Goldin 1999; Vankeerberghen 2001）[^goldin-1999][^vankeerberghen-2001]。整个工程显然有政治意图。淮南王刘安（公元前 179–122 年）召集学者撰成此书；他关切的是帝国意识形态。首要目标，是造出一套体系，把当时尚属年轻的汉帝国境内众多民族、文化、制度、语言与生活方式统统综合起来。刘安看得很清楚：过去的治理方式与社会意识形态，在其诞生的小型社会里或许行得通；但那些社会本来已由共同的语言、文化和社会规范维系成一体。把某一族群的规范与意识形态强加给别的族群，在汉朝所辖如此辽阔多样的疆域里根本行不通。真正需要的，是一套政治、伦理与形而上学体系：它把多样的族群统摄于同一个社会工程，同时又容许各地做法保持独立、各有个性。刘安幕府的这班学者反复推究，最终拿出的，是人类思想史上最全面、最有力的综合之一。他们几乎无缝地把当时已知的一切哲学、政治、科学和宗教体系，编入一个包罗宇宙的总纲式解释。
