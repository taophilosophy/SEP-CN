      As with previous Confucian thinkers, Xu recognizes that those who are authentically virtuous are not always successful. Indeed, he thinks that the situation in the Eastern Han is such that those with the highest positions are far from virtuous. He explains this in the standard Confucian way by explaining that the times (*shi*) make a difference, and that even the most virtuous scholar will not meet with fortune if encountering the wrong time. What constitutes the time (*shi*) is a matter of communal habits, beliefs, quality of rulership, and natural state. If one is born into a time of decay in a state, with weak and unvirtuous leadership, disasters like drought, and communal apathy, then one will likely not advance to a high state of reputation, even with the highest virtue. This is a situation that Confucians from the earliest times worried about, and we see it discussed in all of the thinkers mentioned here from the Eastern Han as well. Echoing Wang Fu, however, Xu Gan holds that if the times are such that the virtuous person cannot thrive in society, one should abandon society and focus on developing his own qualities (Makeham 1994: xii)[^makeham-1994].
    step1: |-
      与前代儒家思想家一样，徐干认识到真正有德者并不总是成功。事实上，他认为东汉的处境是：居最高位者远非有德。他以儒家的标准方式解释这一点：时（*shi*）会造成差别；即使最有德的士人，遇上错误的时势也不会交好运。时由共同体的习惯、信念、治道的品质与自然状况构成。若生在一个衰败的国度——领导软弱无德，灾祸如旱灾频仍，共同体冷漠——那么即使德行最高，大概也进不到高位重名。儒家自最初起就担忧这种处境；此处提到的东汉思想家也都讨论过它。不过，与王符相呼应，徐干主张：若时势使有德者无法在社会中施展，就应弃绝社会，专注于修养自身的品质（Makeham 1994: xii）[^makeham-1994]。
    step2: |-
      与前代儒家思想家一样，徐干知道真正有德的人未必成功。他甚至认为，东汉的局面是：占着最高位的，离有德很远。他用儒家惯有的方式解释这一点：时（*shi*）会造成差别；最有德的士人，撞上错的时势也交不上好运。所谓时，由共同体的习惯、信念、治道的品质和自然状况构成。若生在一个衰败的国家——领导软弱无德、旱灾之类灾祸不断、共同体冷漠——那么哪怕德行再高，多半也进不了高位、得不了重名。这种处境儒家从一开始就担忧，上面提到的东汉思想家也都讨论过。不过，与王符相呼应，徐干主张：如果时势让有德者无法在社会上施展，那就该离开社会，专心修养自己的品质（Makeham 1994: xii）[^makeham-1994]。
