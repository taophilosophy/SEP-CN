      In the Han we also find the origins of the commentarial tradition on philosophical texts. There was already an established commentarial tradition by the time of the Han on the historical and ritual texts known as the *Five Classics*. The commentarial tradition on the ancient historical text *Chunqiu*, in particular, became central in the early Han. A new commentarial tradition developed in the Han, however, connected to philosophical texts such as the *Analects*, *Daodejing*, *Zhuangzi*, and others. The commentarial tradition surrounding these texts became a major source of philosophical development throughout the rest of the history of philosophy in China (see Makeham 2003)[^makeham-2003].
    step1: |-
      在汉代我们还发现了哲学文本注疏传统的起源。到汉代时，对于被称为《五经》的经典历史文本和礼仪文本，已经存在一种确立的注疏传统。特别是对古代历史文本《春秋》的注疏传统，在汉代早期变得核心。然而，汉代发展出一种新的注疏传统，与《论语》《道德经》《庄子》等哲学文本相关。围绕这些文本的注疏传统，成为其后中国哲学史中哲学发展的一个重要来源（见 Makeham 2003）[^makeham-2003]。
