      While Yang’s early scholarly reputation was based on his *fu* poems (a genre of polemic poetry generally aimed at influencing political policy during this time), his best known work today is his philosophical work, produced later in his life. The earlier of these texts, the *Taixuanjing* (“Classic of Supreme Mystery”) is a very much continuous with the correlative metaphysical trends of earlier Han philosophy. The text is an divinatory and philosophical manual in the style of the early divination classic *Yijing*, and develops a similar correlative metaphysics to ones found in earlier texts such as *Chunqiu Fanlu* and *Huainanzi*. *Fayan*, perhaps his most famous work, was one of his later works, written during period of Wang Mang’s Xin Dynasty. While this work is innovative in its return to an older style of presentation as well as its presentation of new theories of *xing* 性 (human nature/inborn characteristics), moral cultivation, and political organization, it’s legacy led to the sidelining of Yang Xiong in the later Chinese tradition. Song Dynasty Neo-Confucians such as Zhu Xi (1130–1200 CE) criticized Yang on the basis of what they saw as the presumptuousness of his use of the style of the *Analects* for the construction of *Fayan*. Because of this, Yang’s work was not included as one of the essential Confucian texts by these later scholars, and this led to the neglect of Yang’s work from this time, given the influence of the Neo-Confucians (Nylan 2014: 2)[^nylan-2014].
    step1: |-
      扬雄早年以赋闻名（赋是当时一般意在影响政治政策的一种论辩性诗体），但他今天最著名的作品，是晚年写成的哲学著作。其中较早的是《太玄经》，它同汉代早期哲学的关联性形而上学趋势一脉相承。此书是仿早期占筮经典《易经》而作的占筮与哲学手册，发展出一套与《春秋繁露》《淮南子》等早期文本相似的关联性形而上学。《法言》也许是扬雄最著名的作品，属晚年之作，写于王莽新朝时期。此书在回到较早的表达方式上有创新，在提出关于性（*xing* 性，人性/禀赋）、道德修养与政治组织的新理论上也有创新；然而它的命运却使扬雄在后世中国受到了冷落。宋代理学家如朱熹（1130–1200 年）批评扬雄，认为他竟用《论语》的体例来构造《法言》，实属僭妄。因此，这些后世学者没有把扬雄的作品列入儒家基本典籍；由于理学家的影响，扬雄的著作从此遭到忽视（Nylan 2014: 2）[^nylan-2014]。
    step2: |-
      扬雄早年以赋得名（赋是当时流行的一种论辩性诗体，多用以影响政令），但他今天最知名的作品，是晚年写的哲学著作。其中较早的《太玄经》，与汉代前期哲学的关联性形而上学一脉相承。此书仿早期占筮经典《易经》而作，是一部占筮兼哲学的指南，其关联性形而上学与《春秋繁露》《淮南子》等早期文本相类。《法言》大概是他最著名的作品，属晚年之作，成于王莽新朝。此书在回归旧有的表述体例上颇有新意，在关于性（*xing* 性，人性/禀赋）、道德修养与政治组织的新理论上也有创获；然而也正因这本书，扬雄在后世中国被边缘化了。宋代理学家如朱熹（1130–1200 年）批评扬雄，理由是：他竟然用《论语》的体例来写《法言》，实在僭妄。于是这些后世学者不把扬雄之书列入儒家要籍；理学影响既盛，扬雄的著作便从此被冷落（Nylan 2014: 2）[^nylan-2014]。
