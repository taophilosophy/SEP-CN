      A number of new themes in early Chinese thought are discussed in the *Huainanzi*. The methodology of philosophy is a central concern of the text, as discussed in the first two chapters and the final chapter in particular. Using a framework that seems to borrow most from Daoism (Roth 2015: 342)[^roth-2015], the text aims to create a synthesis of not only other existing intellectual schools, but a variety of other multiplicities. The first two chapters of the text, as well as the final “overview” chapter offer the main structure for the synthesis of the text, which is explored in specifics in the other chapters (Murray 2004)[^murray-2004]. The two main images used are the distinction between root (*ben* 本) and branches (*mo* 末), and the appeal to a unifying “pattern” (*li* 理). The *Huainanzi* argues that the unification of all things is explained by the origination of all things in “the one” (*yi* 一), which it associated with *dao*. Things emerge from *dao* in particular patterns, following *yin* and *yang* change. We gain understanding and mastery over ourselves and nature by following the myriad things (*wan wu* 萬物) as they develop and change, and their patterns. To do this, we must follow the way of *tian* 天 (heaven) rather than that of the human. Following earlier views of texts such as the *Zhuangzi*, the distinction drawn between *tian* and the human (*ren* 人) in the *Huainanzi* is one of wide vs. narrow focus. It seems to parallel a kind of distinction between the natural and the human that takes what is associated with the human to be modifying nature, with nature as the untouched and separate. The nature/human distinction in the *Huainanzi* is not total—humanity is ultimately seen as originating in the same source as the rest of nature, somehow operating on the stuff of nature—which later chapters (such as ch. 3) understand in terms of the human “completion” (*cheng* 成) of nature. In chapter one, however, a valuation seems to be made, contrasting the human as the narrow and flawed with the natural as the broad and pure. A key passage in Chapter One reads:
    step1: |-
      《淮南子》讨论了许多早期中国思想中的新主题。哲学方法论是此书的核心关切，前两章与末章对此讨论尤多。此书使用一个似乎最多借自道家的框架（Roth 2015: 342）[^roth-2015]，意在不仅综合其他现存的思想学派，也综合多种多样的其他杂多。前两章以及末尾的“总览”章，为全书的综合提供了主要结构，其余各章则分别展开具体内容（Murray 2004）[^murray-2004]。所用的两个主要意象，是本（*ben* 本）与末（*mo* 末）的区分，以及对统一的“理”（*li* 理）的诉求。《淮南子》主张，万物的统一可由万物起源于“一”（*yi* 一）来解释，而“一”与道相关联。事物依循阴阳变化，以特定的理从道中产生。我们通过顺随万物（*wan wu* 萬物）的发育变化及其理，来获得对自身与自然的理解与掌握。要做到这一点，我们必须循天（*tian* 天）之道，而非循人之道。承续《庄子》等文本的较早观点，《淮南子》在天（*tian*）与人（*ren* 人）之间所作的区分，是“广”与“狭”的区分。它似乎对应于自然与人为之间的一种区分：凡与“人”相关者，被视为对自然的改易，而自然则是未被触动、与之分离的。不过，《淮南子》的自然/人区分并非绝对的——人最终被视为与自然的其余部分同源，并以某种方式作用于自然的材料，后文（如第三章）便以人对自然的“完成”（*cheng* 成）来理解这一点。但在第一章中，似乎作出了一种价值评判：把人视为狭隘而有缺陷的，把自然视为广阔而纯净的。第一章有一段关键文字：
    step2: |-
      《淮南子》探讨了早期中国思想中的一系列新主题。哲学方法论是全书的核心关怀，前两章与末章着墨尤多。全书借用的框架似乎最重道家（Roth 2015: 342）[^roth-2015]，其目标不只是综合现存各思想学派，还要综合形形色色的其他杂多。前两章与末尾的“总览”章，给出了全书综合的基本结构，其余各章则分头落实细节（Murray 2004）[^murray-2004]。贯穿其中的两个主要意象，是本（*ben* 本）与末（*mo* 末）的区分，以及对统一的“理”（*li* 理）的诉求。《淮南子》主张，万物的统一要由万物皆源于“一”（*yi* 一）来解释，而“一”与道相联。万物循阴阳之变，以特定的理从道中生出。我们若顺着万物（*wan wu* 萬物）的生灭变化及其理，就能理解并掌控自身与自然。要做到这一点，必须循天（*tian* 天）之道，而不是循人之道。承《庄子》等文本之绪，《淮南子》在天（*tian*）与人（*ren* 人）之间划出的界限，是“广”与“狭”之别，大致相当于自然与人为之别：凡属“人”者，被视为对自然的改造；自然则是未经触动、与人相隔的。不过，《淮南子》的自然/人之分并不是全然的——人终究与自然的其余部分同出一源，并且以某种方式作用于自然的材料；后文（如第三章）就把这一点理解为人对自然的“完成”（*cheng* 成）。但在第一章里，似乎暗含一种褒贬：人为狭小而偏失，自然宽广而纯粹。第一章有一段关键的话：
