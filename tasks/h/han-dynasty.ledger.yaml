      One aspect of Xu Gan’s thought which have led some to declare him (and some similar Han thinkers) as a “Legalist” (*fajia* 法家) philosopher is his endorsement of the view that timely and consistent reward and punishment are essential tools for governing, shared by Warring States legalist thinkers such as Han Feizi, Shang Yang, and Shen Buhai (Makeham 1994: 264, *Zhonglun* 19)[^makeham-1994]. While, as I mention above, school categories are of limited use in categorizing Eastern Han thinkers, Xu certainly has much more in common with early Confucians than with Warring States Legalists, even though it becomes more popular in the Eastern Han to adopt the Legalist position concerning reward and punishment.
    step1: |-
      徐干思想有一个方面使一些人宣称他是（以及某些类似的汉代思想家是）“法家”（*fajia* 法家）哲学家：他赞同赏罚及时而一贯是治国的必要工具，这一观点为韩非子、商鞅、申不害等战国法家所共有（Makeham 1994: 264，《中论》19）[^makeham-1994]。不过，如上所述，学派范畴对划分东汉思想家用处有限：徐干与早期儒者的共同之处，无疑远多于与战国法家的共同之处，尽管在东汉，就赏罚问题采法家立场已渐成风气。
    step2: |-
      徐干思想有一个方面，让一些人断言他——以及某些与之相类的汉代思想家——是“法家”（*fajia* 法家）哲学家。他赞同及时而一贯的赏罚是治国必不可少的工具；这一主张为韩非子、商鞅、申不害等战国法家所共有（Makeham 1994: 264，《中论》19）[^makeham-1994]。不过如上所说，用学派范畴给东汉思想家归类，用处有限。徐干与早期儒者的共同点，无疑远多于与战国法家的共同点；尽管在东汉，就赏罚问题采取法家立场已渐成风气。
