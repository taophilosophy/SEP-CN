      To ensure successful rule, a ruler must govern with “humanenness” (*ren* 仁), a concern for the wellbeing of the people that was a major topic of discussion in Pre-Han Confucian texts. Unlike these earlier Confucians, however, Jia Yi’s interest in humaneness was mainly with its practical benefits for ensuring the stability of the ruler’s position. Earlier Confucians were more concerned with the issue of moral development and the role of humaneness in the development of the person. Jia Yi’s concern with humaneness was about political expediency. Lacking humaneness, as he claims the Qin rulers did, will inevitably lead to the collapse of one’s rule. Securing the cooperation and support of the people is necessary to maintain a state, and thus the good ruler must attend to this. (Sanft 2005: 35–6)[^sanft-2005] While concern for the people is necessary, Jia does not take the assent of the people to being governed as the ground or justification for the ruler’s authority. This authority, according to Jia, is independent of the people. The “people as root” position developed in the *Xinshu* is fully based in pragmatic considerations of rulership. In this way, Jia Yi links the ideas developed in early Confucian texts with the pragmatic “amoralism” of Legalists like Han Feizi who argued for the appropriateness of political strategies on the basis of their success in maintaining the power of the ruler, rather than on the basis of moral considerations. Jia’s political thought thus represents a new trend in the Han period, one that forms the basis for the ideology of what Dingxin Zhao calls “the Confucian-Legalist state” (Zhao 2015)[^zhao-2015]. The origins of the political philosophy that would guide Chinese dynasties through much of the rest of Chinese history are found in the Han.
    step1: |-
      为了确保成功统治，君主必须以“仁”（*ren* 仁）来治理，即对人民福祉的关切，这是前汉儒家文本中讨论的一个重要主题。然而，与这些更早的儒家不同，贾谊对仁的兴趣主要在于它确保君主地位稳定的实际益处。更早的儒家更关心道德发展问题以及仁在人格发展中的作用。贾谊对仁的关切关乎政治权宜。缺乏仁，正如他所声称的秦朝统治者那样，必然导致统治的崩溃。获得人民的合作和支持是维持国家所必需的，因此好君主必须关注这一点。（Sanft 2005: 35–6）[^sanft-2005] 尽管对人民的关切是必要的，贾谊并不把人民同意被统治视为君主权威的基础或正当理由。根据贾谊，这一权威独立于人民。《新书》中发展出的“以民为本”立场完全基于统治的实用考量。这样，贾谊把早期儒家文本中发展的观念，与韩非子等法家者的实用“非道德主义”联系起来，后者基于政治策略在维持君主权力方面的成功（而非基于道德考量）来论证政治策略的适当性。因此，贾谊的政治思想代表了汉代的一种新趋势，这一趋势构成了赵鼎新（Dingxin Zhao）所谓“儒家法家国家”之意识形态的基础（Zhao 2015）[^zhao-2015]。将在其后大部分中国历史中指导中国王朝的政治哲学的起源，在汉代被发现。
