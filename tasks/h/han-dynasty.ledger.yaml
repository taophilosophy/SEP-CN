      One of the major developments of the Han was the formation of what is commonly known as “Han Syncretism”, associated by some with “schools” such as Huang-Lao and texts such as the *Huainanzi*. The development and nature of Huang-Lao are topics still debated by scholars (see Graham 1991; Major 1993: 10; Chen & Sung 2015)[^chen-2015][^graham-1991][^major-1993]. While the syncretic or synthetic tendency, its ascent, and its pinnacle was reached during the Han, such thinking actually had its origins much earlier in Chinese history. In Warring States texts such the *Guanzi* and *Lushi Chunqiu*, we find the first developments of syncretism. It is in the Han that this trend really takes off, and the *Huainanzi* represents its high-water mark.
    step1: |-
      汉代的一项重大发展，是通常所谓“汉代折中主义”的形成；有人把它同黄老之类的“学派”以及《淮南子》之类的文本联系起来。黄老的发展与性质，仍是学者争论的话题（见 Graham 1991; Major 1993: 10; Chen & Sung 2015）[^chen-2015][^graham-1991][^major-1993]。折中式或综合式的思想倾向兴起并于汉代达到顶峰，但这类思想其实在中国历史更早时期就已发端。在《管子》《吕氏春秋》等战国文本中，我们看到折中主义的最初发展。到了汉代，这一趋势才真正兴起，《淮南子》代表了它的最高水位。
