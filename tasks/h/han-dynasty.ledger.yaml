      The first chapter of the *Xinyu* discusses the foundation of the political project (and the human project more generally) in nature, or “heaven” (*tian* 天), borrowing a well-known and contentious concept from earlier Chinese philosophical discourse. The *dao* 道 (way) of proper action and governance here is associated with understanding the patterns (*li* 理) of heaven and earth. Lu Jia offers a “realist” conception of political and ethical principles (which early Chinese thinkers see as continuous for the most part). These principles are based in the mind-independent world, rather than dependent on human construction. Of course, the distinction between mind and world is not heavily stressed in early China. Although early Chinese philosophers did draw a distinction between mind and body (Slingerland 2019; McLeod 2021)[^mcleod-2021][^slingerland-2019], we do not find the strong distinction between mind-dependence and independence that ground conceptions of antirealism and realism in contemporary Western philosophical discourse. The construction of *dao* (as political and ethical principles) is dependent on the nature of the world, including facts about patterns (*li*) as they exist within and determine human activity. Both “mind” and “world”, that is, are responsible for the *dao*. This is expressed in the *Xinyu* as a matter of the ancient sages’ expression of what they discern in the cosmos/heaven (*tian*). Lu Jia gives us a succinct explanation of this:
    step1: |-
      《新语》的第一章讨论政治事业（以及更一般的人的事业）在自然，即“天”（*tian* 天）中的基础，借用了早期中国哲学话语中一个著名而有争议的概念。恰当行动和治理的“道”（*dao* 道）在这里与理解天地的“理”（*li* 理）相联系。陆贾提供了一种政治和伦理原则的“实在论”概念（早期中国思想家在很大程度上将其视为连续的）。这些原则基于心独立的世界，而非依赖于人的建构。当然，心和世界的区分在早期中国并不被着重强调。尽管早期中国哲学家确实在心与身之间作了区分（Slingerland 2019; McLeod 2021）[^mcleod-2021][^slingerland-2019]，我们并未发现当代西方哲学话语中作为反实在论和实在论概念之基础的那种心依赖与心独立之间的强区分。“道”（作为政治和伦理原则）的建构依赖于世界的本性，包括关于“理”（*li*）的事实，因为这些理存在于人类活动之中并决定人类活动。也就是说，“心”和“世界”两者都对“道”负有责任。这在《新语》中表达为古代圣人表达他们在宇宙/天（*tian*）中所觉察到的东西。陆贾给我们一个简明的解释：
