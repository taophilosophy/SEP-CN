      Jia Yi (200–168 BCE) was a Han official who served as tutor to a number of vassal kings associated with the Han—first to the ruler of the distant southern region of Changsha, and later to the ruler of the region of Liang (more on this system of government below in discussion of the *Huainanzi*). His political thought is presented in the text *Xinshu* (“New Writings”). Despite debates as to whether the *Xinshu* was written by Jia or later authors in his name, we can take it as representative of an important strain of Han political thought (Sanft 2005: 6)[^sanft-2005].
    step1: |-
      贾谊（公元前 200–168 年）是一位汉朝官员，曾先后担任多位与汉朝有关的诸侯王的太傅：先是远在南方的长沙王，后来是梁王（关于这套治理体制，下文讨论《淮南子》时还会谈到）。他的政治思想见于《新书》。尽管学界对《新书》出自贾谊本人还是后世托名作者仍有争论，我们仍可把它视为汉代政治思想一个重要脉络的代表（Sanft 2005: 6）[^sanft-2005]。
    step2: |-
      贾谊（公元前 200–168 年）是汉朝官员，先后做过几位诸侯王的太傅——最初在远在南方的长沙国，后来在梁国（这套分封治理体制，下文讨论《淮南子》时还会涉及）。他的政治思想见于《新书》。此书究竟出自贾谊本人，还是后人伪托其名，学界尚有争论；但无论如何，它可以代表汉代政治思想中一个重要脉络（Sanft 2005: 6）[^sanft-2005]。
