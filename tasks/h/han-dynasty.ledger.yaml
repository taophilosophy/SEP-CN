      Philosophy in early China underwent a major transformation after the beginning of empire in the late third century BCE. These were the years of the Han Dynasty, in its two parts, the Western Han (206 BCE–9 CE) and Eastern Han (25–220 CE). Some of the main trends, ideas, and thinkers of the more than 400 years of the Han period are discussed in this article. Some of the particularly prominent features of Han philosophy in comparison with that of earlier periods are: increased focus on metaphysics , the prominence of syncretism, new views on language, the rise of naturalism, and debates about methodology. In addition, many of the ideas we associate with Pre-Qin philosophy were developed most fully in the Han. Retrospective interpretation in later years, including during the Han itself, led to our association of some of these ideas with earlier texts and traditions. Many of the “early”, pre-Han Chinese texts were actually compiled or created during the Han (see Hunter 2018; Klein 2010)[^hunter-2018][^klein-2010]. Even the “school” categories that we often use to classify texts and thinkers from periods prior to the Han, such as “Confucianism” (*rujia* 儒家), “Daoism” (*daojia* 道家), Legalism (*fajia* 法家), and so on, were actually Han period creations. It is no exaggeration to say that the Chinese philosophical tradition was founded *as such* during the Han.
    step1: |-
      早期中国哲学在公元前三世纪末帝国开始之后经历了一场重大转变。这些正是汉代的岁月，它分为两部分：西汉（公元前 206–9 年）和东汉（25–220 年）。本文讨论汉代四百多年中的一些主要趋势、观念和思想家。汉代哲学与更早时期相比的一些特别突出的特征是：对形而上学的关注增强，折中主义的凸显，关于语言的新观点，自然主义的兴起，以及关于方法论的争论。此外，我们与先秦哲学联系在一起的许多观念，都是在汉代得到最充分发展的。后世（包括汉代本身）的回顾性解释，使我们将其中一些观念与更早的文本和传统联系起来。许多“早期”的、汉代以前的中国文本，实际上是在汉代编纂或创作的（见 Hunter 2018; Klein 2010）[^hunter-2018][^klein-2010]。甚至我们常用来对汉代以前时期的文本和思想家进行分类的“学派”范畴，如“儒家”（*rujia* 儒家）、“道家”（*daojia* 道家）、“法家”（*fajia* 法家）等等，实际上也都是汉代的创造。可以毫不夸张地说，中国哲学传统正是在汉代作为*自身*才被创立的。
