      Since most of Heytesbury’s logical views are spelled out either in the context or in terms of *obligationes*,[^note-5] a brief note on these must be the starting point of their presentation. The most important passages are in [SCD] and [Soph] and to a certain degree in [RSS]. Three problems will be introduced: 1) the basic concepts, and in particular, relevance; 2) the distinction between metaphysical and epistemic possibility; and 3) the distinction between conceding a sentence and conceding that a sentence is true.
    step1: |-
      由于海特斯伯里的大部分逻辑观点都是在 *obligationes* 的语境中、或依据 *obligationes* 得到阐明的，[^note-5] 对这些游戏作一简要说明必须成为阐述的起点。最重要的段落见于 [SCD] 与 [Soph]，在一定程度上也见于 [RSS]。这里将引入三个问题：1) 基本概念，尤其是相关性；2) 形而上学可能性与认知可能性之分；3) 承认一个语句与承认一个语句为真之分。
    step2: |-
      由于海特斯伯里的大部分逻辑观点都是在 *obligationes*（义务游戏）的语境中、或依据 *obligationes* 得到阐明的，[^note-5] 对这些游戏作一简要说明必须成为阐述的起点。最重要的段落见于 [SCD] 与 [Soph]，在一定程度上也见于 [RSS]。这里将引入三个问题：1) 基本概念，尤其是相关性；2) 形而上学可能性与认知可能性之分；3) 承认一个语句与承认一个语句为真之分。
  - id: 8
    source: |-
      Heytesbury’s *obligationes* are zero-sum and dynamic consistency games participated in by two players, an “opponent” and a “respondent”. The opponent posits a “*casus*” (*ponitur casus*), i.e., the initial linguistic and extra-linguistic assumptions, and proposes particular sentences. The respondent admits or denies the *casus* (*admittitur*, *negatur casus*) depending on its consistency and concedes (*concedo*), negates (*nego*), or doubts (*dubito*) the proposed sentences, the criteria being logical relations to either the *casus* or to the totality of preceding moves (including the *casus*). Heytesbury chooses the latter option, thus subscribing to so-called “*antiqua responsio*” (Read 2013: 20–23)[^read-2013]. The respondent wins if he maintains consistency.
    step1: |-
      海特斯伯里的 *obligationes* 是零和、动态的一致性维持游戏，由两名玩家参与，一位是“反对者”，一位是“应答者”。反对者设定一个“*casus*”（*ponitur casus*），即初始的语言与语言外假设，并提出特定的语句。应答者依据 *casus* 的一致性承认或否认它（*admittitur*、*negatur casus*），并承认（*concedo*）、否定（*nego*）或怀疑（*dubito*）所提出的语句，判据是这些语句与 *casus* 或与先前全部步骤（包括 *casus*）的逻辑关系。海特斯伯里选择后者，从而赞同所谓“古式回应”（*antiqua responsio*）（Read 2013: 20–23）[^read-2013]。应答者若能维持一致性便获胜。
    step2: |-
      海特斯伯里的 *obligationes* 是零和、动态的一致性维持游戏，由两名玩家参与，一位是“反对者”，一位是“应答者”。反对者设定一个“*casus*”（*ponitur casus*），即初始的语言与语言外假设，并提出特定的语句。应答者依据 *casus* 的一致性承认或否认它（*admittitur*、*negatur casus*），并承认（*concedo*）、否定（*nego*）或怀疑（*dubito*）所提出的语句，判据是这些语句与 *casus* 或与先前全部步骤（包括 *casus*）的逻辑关系。海特斯伯里选择后者，从而赞同所谓“古式回应”（*antiqua responsio*）（Read 2013: 20–23）[^read-2013]。应答者若能维持一致性便获胜。
