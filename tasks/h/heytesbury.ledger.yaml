slug: heytesbury
segments:
  - id: 1
    source: |-
      William Heytesbury (c. 1313–1372/3), a member of Oxford’s Merton College and the School of “Oxford Calculators”, was most likely a student of Richard Kilvington, who was a younger contemporary of John Dumbleton. Heytesbury developed the works of Thomas Bradwardine and Richard Kilvington, and he was also influenced by Walter Burley, William Ockham, and Roger Swyneshed (or Swineshead). He authored a popular textbook *Regulae solvendi sophismata* and several other collections of sophisms. He linked interests in logic, mathematics, and physics. He formulated the Middle Degree Theorem (also known as the Mean Speed Theorem) offering a proper rule for uniformly accelerated motion, later developed by Galileo. His works anticipated nineteenth-century mathematical analyses of the continuum. He influenced logic in Britain and Italy (where several late fourteenth and early fifteenth-century editions of his texts were printed) and his influence lasted until the sixteenth century, when the debates he participated in declined.
    step1: |-
      威廉·海特斯伯里（约 1313–1372/3），牛津默顿学院与“牛津计算者”学派的一员，很可能是理查德·基尔文顿的学生，后者是约翰·邓布尔顿的较年轻的同时代人。海特斯伯里发展了托马斯·布雷德沃丁与理查德·基尔文顿的著作，也受沃尔特·伯利、威廉·奥卡姆与罗杰·斯温斯赫德（或斯温斯黑德）影响。他著有一本流行的教科书《解决诡辩的规则》与几部其他诡辩集。他联结了逻辑、数学与物理方面的兴趣。他表述了中项定理（亦称平均速度定理），为匀加速运动提供恰当的规则，后来为伽利略发展。他的著作预示了十九世纪对连续统的数学分析。他影响了英国与意大利的逻辑（意大利印行了他若干十四世纪末与十五世纪初的文本），其影响延续到十六世纪，那时他所参与的论辩衰落。
    step2: |-
      威廉·海特斯伯里（约 1313–1372/3 年），牛津大学默顿学院成员、牛津“计算者”学派（School of “Oxford Calculators”）的一员，很可能是理查德·基尔文顿的学生，后者是约翰·邓布尔顿的同时代人而略为年轻。海特斯伯里继承并发展了托马斯·布雷德沃丁与理查德·基尔文顿的著作，也受到沃尔特·伯利、威廉·奥卡姆与罗杰·斯温斯赫德（或斯温斯黑德）的影响。他著有广受欢迎的教科书《解决诡辩的规则》（*Regulae solvendi sophismata*），以及另外几部诡辩文集。他把逻辑、数学与物理方面的兴趣结合在一起。他提出中项定理（亦称平均速度定理），为匀加速运动给出了一条恰当的规则，后来为伽利略所发展。他的著作预示了十九世纪对连续统的数学分析。他影响了英国与意大利的逻辑学（意大利在十四世纪末与十五世纪初印行了他的多种文本），其影响一直延续到十六世纪，那时他所参与的论辩走向衰落。
  - id: 2
    source: |-
      William Heytesbury was most likely born before 1313 in Wiltshire (Salisbury Diocese). He is first mentioned as a fellow at Merton College in Oxford in 1330; he is thus among the second generation of Oxford Calculators (a follower of Thomas Bradwardine and Richard Kilvington, a contemporary of John Dumbleton and Roger Swyneshed, and a predecessor of Richard Swineshead). He held the administrative position of a bursar of Merton in 1338–1339, responsible for determining dues, auditing accounts, and collecting revenues.[^note-1] By 1340 he had completed his regency in arts at Merton and, together with John Dumbleton, was named a foundation fellow at the new Queen’s College in 1340, but was soon mentioned among the fellows of Merton College again. He is recorded as having become a Doctor of Theology in 1348, yet none of his theological works are known. He was chancellor of the University in 1371–72 (and perhaps also in 1353–54) and died shortly thereafter, between December 1372 and January 1373.[^note-2]
    step1: |-
      威廉·海特斯伯里很可能生于 1313 年之前，在威尔特郡（索尔兹伯里教区）。他于 1330 年首次被提及为牛津默顿学院的研究员；因此他在第二代牛津计算者之中（托马斯·布雷德沃丁与理查德·基尔文顿的追随者，约翰·邓布尔顿与罗杰·斯温斯赫德的同时代人，理查德·斯温斯黑德的前辈）。他于 1338–1339 年担任默顿的财务主管这一行政职位，负责确定费用、审计账目并征收收入。[^note-1] 到 1340 年，他已完成了在默顿的文科执教期，并于 1340 年与约翰·邓布尔顿一同被任命为新王后学院的创院研究员，但不久又被提及为默顿学院研究员。据记载，他于 1348 年成为神学博士，然而他的神学著作无一所知。他于 1371–72 年（或许也在 1353–54 年）担任大学校长，此后不久去世，在 1372 年 12 月至 1373 年 1 月之间。[^note-2]
    step2: |-
      威廉·海特斯伯里很可能生于 1313 年之前，出生地在威尔特郡（索尔兹伯里教区）。他于 1330 年首次被提及为牛津默顿学院的研究员；因此他属于第二代牛津计算者（托马斯·布雷德沃丁与理查德·基尔文顿的追随者，约翰·邓布尔顿与罗杰·斯温斯赫德的同时代人，理查德·斯温斯黑德的前辈）。他于 1338–1339 年担任默顿学院的财务主管，负责确定费用、审计账目并征收收入。[^note-1] 到 1340 年，他已在默顿完成文科执教期，并于 1340 年与约翰·邓布尔顿一同被任命为新王后学院（Queen’s College）的创院研究员，但不久又被列为默顿学院的研究员。据记载，他于 1348 年成为神学博士，但他的神学著作无一存世。他于 1371–72 年（或许也在 1353–54 年）担任牛津大学校长（chancellor），此后不久便去世，时间在 1372 年 12 月至 1373 年 1 月之间。[^note-2]
