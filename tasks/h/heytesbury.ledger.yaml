      **Works which have been erroneously attributed to Heytesbury in the past:**
      - *De veritate et falsitate propositionis* (authored by Henry Hopton)
      *De veritate et falsitate propositionis* is a treatise on sentential semantics motivated by the analysis of the sophism “*Every sentence is true or* *false*”.[^note-4]
    step1: |-
      **过去曾被误归于海特斯伯里名下的著作：**
      - *De veritate et falsitate propositionis*（亨利·霍普顿作）
      《论命题之真与假》是一部关于语句语义学的论著，其动机是对诡辩“*每一个语句都是真的或* *假的*”的分析。[^note-4]
