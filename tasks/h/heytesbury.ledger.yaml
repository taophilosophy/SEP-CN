      **Works of uncertain authenticity:**
      - *Probationes conclusionum*
      - *Casus obligationis* [CO]
      - *De propositionibus multiplicibus* or *De propositionum multiplicium significatione*
      - *Termini naturales*
      *Probationes conclusionum* follows [RSS] and analyses sophisms of various kinds. *Casus obligationis* [CO] is a collection of epistemic sophisms, related to the second chapter of [RSS]. *De propositionibus multiplicibus* is a short treatise on the analysis and inferential roles of various kinds of sentences. *Termini naturales* is a vocabulary of elementary physics, very popular in the late-medieval period.[^note-3]
