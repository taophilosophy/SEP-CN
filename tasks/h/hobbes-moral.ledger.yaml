      霍布斯政治哲学的最后一个关键部分，是他对宗教的处理。他每修订一次政治哲学，就扩充一次关于基督教的讨论；到《利维坦》，这部分已占全书约一半。霍布斯在其政治理论中究竟如何理解宗教的意义，学界至今没有定论。一些评论者认为，霍布斯想向读者表明：他的政治理论与基督教的核心信念可以相容——因为读者可能觉得，基督徒的宗教义务禁止他们对统治者给予霍布斯理论所要求的那种绝对服从。另一些评论者则怀疑霍布斯自称的基督教信仰是否真诚，认为他用反讽或其他委婉的修辞手法，意在抽掉读者的宗教信念。无论他的意图应当怎么理解，霍布斯对宗教信仰力量的明显关切，是解释其政治哲学的人必须交代的一个事实。
