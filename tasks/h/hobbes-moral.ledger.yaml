      虽然霍布斯坚持我们应当把政府视为拥有绝对权威，他却为臣民保留不服从政府某些命令的自由。他论证说，臣民保留着一项针对主权权力的自卫权利，这使他们有权在生命受到危险时不服从或抵抗。他还给予臣民看似宽泛的抵抗权利，适用于其家人甚至其荣誉受到威胁的情形。这些例外理所当然地引起了霍布斯研究者的兴趣。他赋予的似乎不可让渡的权利——他称之为“臣民的真正自由”——似乎与他对绝对主权的辩护不相容。此外，如果主权者未能向臣民提供充分保护便消灭了臣民服从的义务，而保护是否充分又留给每个臣民自己判断，那么人们似乎从未真正走出可怕的祖先状态。霍布斯政治哲学的这一方面，自霍布斯时代以来一直争论激烈。霍布斯的同时代人布拉姆霍尔主教曾著名地指责《利维坦》是一部“叛乱者的教义问答”。晚近一些评论者论证说，霍布斯关于政治义务限度的讨论是其理论的阿喀琉斯之踵。这一指责能否经得起审视，尚不清楚，但它必定会成为大量持续讨论的主题。
