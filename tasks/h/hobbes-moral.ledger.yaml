    source: |-
      Hobbes wrote several versions of his political philosophy, including *The Elements of Law, Natural and Politic* (also under the titles *Human Nature* and *De Corpore Politico)* published in 1650, *De Cive* (1642) published in English as *Philosophical Rudiments Concerning Government and Society* in 1651, the English *Leviathan* published in 1651, and its Latin revision in 1668. Others of his works are also important in understanding his political philosophy, especially his history of the English Civil War, *Behemoth* (published 1679), *De Corpore* (1655), *De Homine* (1658), *Dialogue Between a Philosopher and a Student of the Common Laws of England* (1681), and *The Questions Concerning Liberty, Necessity, and Chance* (1656). All of Hobbes’s major writings are collected in *The English Works of Thomas Hobbes*, edited by Sir William Molesworth (11 volumes, London 1839–45), and *Thomae Hobbes Opera Philosophica Quae Latina Scripsit Omnia*, also edited by Molesworth (5 volumes; London, 1839–45). Oxford University Press has undertaken a projected 26 volume collection of the *Clarendon Edition of the Works of Thomas Hobbes*. So far 3 volumes are available: *De Cive* (edited by Howard Warrender), *The Correspondence of Thomas Hobbes* (edited by Noel Malcolm), and *Writings on Common Law and Hereditary Right* (edited by Alan Cromartie and Quentin Skinner). Recently Noel Malcolm has published a three volume edition of *Leviathan*, which places the English text side by side with Hobbes’s later Latin version of it. Readers new to Hobbes should begin with *Leviathan*, being sure to read Parts Three and Four, as well as the more familiar and often excerpted Parts One and Two. There are many fine overviews of Hobbes’s normative philosophy, some of which are listed in the following selected bibliography of secondary works.
    step1: |-
      霍布斯写过几个版本的政治哲学，包括 1650 年出版的《法律要义，自然与政治》（*The Elements of Law, Natural and Politic*，亦以《人性》*Human Nature* 和《论政治体》*De Corpore Politico* 为题）、1642 年出版、1651 年以《有关政府与社会的哲学原理》（*Philosophical Rudiments Concerning Government and Society*）为英文书名问世的《论公民》（*De Cive*）、1651 年出版的英文版《利维坦》及其 1668 年的拉丁文修订版。他的其他著作对理解其政治哲学也很重要，特别是他关于英国内战的历史著作《比希莫特》（*Behemoth*，1679 年出版）、《论物体》（*De Corpore*，1655）、《论人》（*De Homine*，1658）、《一位哲学家与一位英国普通法学生的对话》（*Dialogue Between a Philosopher and a Student of the Common Laws of England*，1681）以及《关于自由、必然与偶然的问题》（*The Questions Concerning Liberty, Necessity, and Chance*，1656）。霍布斯的所有主要著作都收在威廉·莫尔斯沃思爵士（Sir William Molesworth）编辑的《托马斯·霍布斯英文著作集》（*The English Works of Thomas Hobbes*，11 卷，伦敦，1839–45）和同样由莫尔斯沃思编辑的《托马斯·霍布斯拉丁文哲学著作全集》（*Thomae Hobbes Opera Philosophica Quae Latina Scripsit Omnia*，5 卷，伦敦，1839–45）中。牛津大学出版社已着手出版预计 26 卷的《托马斯·霍布斯著作克拉伦登版》（*Clarendon Edition of the Works of Thomas Hobbes*）。目前已出 3 卷：《论公民》（Howard Warrender 编）、《托马斯·霍布斯通信集》（*The Correspondence of Thomas Hobbes*，Noel Malcolm 编）和《论普通法与世袭权利的著作》（*Writings on Common Law and Hereditary Right*，Alan Cromartie 与 Quentin Skinner 编）。近来 Noel Malcolm 出版了三卷本《利维坦》，将英文文本与霍布斯晚年的拉丁文译本并排刊出。初涉霍布斯的读者应先读《利维坦》，并且务必阅读第三部分和第四部分，而不只是更为人熟知、常被节选的第一和第二部分。霍布斯的规范哲学有许多优秀的概论，其中一部分列在下文的二手文献选目中。
    step2: |-
      霍布斯把自己的政治哲学写成过几个版本：《法律要义，自然与政治》（*The Elements of Law, Natural and Politic*，1650 年出版，又曾以《人性》*Human Nature* 与《论政治体》*De Corpore Politico* 为名）；《论公民》（*De Cive*，1642），其英译本 1651 年以《有关政府与社会的哲学原理》（*Philosophical Rudiments Concerning Government and Society*）为名问世；英文版《利维坦》（1651），以及它的拉丁文修订版（1668）。要理解霍布斯的政治哲学，他的其他著作也很重要，尤其是关于英国内战的那部史书《比希莫特》（*Behemoth*，1679 年出版）、《论物体》（*De Corpore*，1655）、《论人》（*De Homine*，1658）、《一位哲学家与一位英国普通法学生的对话》（*Dialogue Between a Philosopher and a Student of the Common Laws of England*，1681）、《关于自由、必然与偶然的问题》（*The Questions Concerning Liberty, Necessity, and Chance*，1656）。霍布斯的主要著作都收在两种莫尔斯沃思（Sir William Molesworth）主编的丛书中：《托马斯·霍布斯英文著作集》（*The English Works of Thomas Hobbes*，11 卷，伦敦，1839–45）与《托马斯·霍布斯拉丁文哲学著作全集》（*Thomae Hobbes Opera Philosophica Quae Latina Scripsit Omnia*，5 卷，伦敦，1839–45）。牛津大学出版社已着手推出预计 26 卷的《托马斯·霍布斯著作克拉伦登版》（*Clarendon Edition of the Works of Thomas Hobbes*），目前问世 3 卷：《论公民》（Howard Warrender 编）、《托马斯·霍布斯通信集》（*The Correspondence of Thomas Hobbes*，Noel Malcolm 编）、《论普通法与世袭权利的著作》（*Writings on Common Law and Hereditary Right*，Alan Cromartie 与 Quentin Skinner 编）。Noel Malcolm 新近出版了三卷本《利维坦》，把英文文本与霍布斯晚年的拉丁文本并排刊布。初读霍布斯，应当从《利维坦》入手，而且务必读第三、第四两部分，不要只读更为人熟知、常被节选的第一、第二两部分。关于霍布斯的规范哲学，有许多出色的概论；其中一部分已列入下文二手文献选目。
