    source: |-
      The 17ᵗʰ Century English philosopher Thomas Hobbes is now widely regarded as one of a handful of truly great political philosophers, whose masterwork *Leviathan* rivals in significance the political writings of Plato, Aristotle, Locke, Rousseau, Kant, and Rawls. Hobbes is famous for his early and elaborate development of what has come to be known as “social contract theory”, the method of justifying political principles or arrangements by appeal to the agreement that would be made among suitably situated rational, free, and equal persons. He is infamous for having used the social contract method to arrive at the astonishing conclusion that we ought to submit to the authority of an absolute—undivided and unlimited—sovereign power. While his methodological innovation had a profound constructive impact on subsequent work in political philosophy, his substantive conclusions have served mostly as a foil for the development of more palatable philosophical positions. Hobbes’s moral philosophy has been less influential than his political philosophy, in part because that theory is too ambiguous to have garnered any general consensus as to its content. Most scholars have taken Hobbes to have affirmed some sort of personal relativism or subjectivism; but views that Hobbes espoused divine command theory, virtue ethics, rule egoism, or a form of projectivism also find support in Hobbes’s texts and among scholars. Because Hobbes held that “the true doctrine of the Lawes of Nature is the true Morall philosophie”, differences in interpretation of Hobbes’s moral philosophy can be traced to differing understandings of the status and operation of Hobbes’s “laws of nature”, which laws will be discussed below. The formerly dominant view that Hobbes espoused psychological egoism as the foundation of his moral theory is currently widely rejected, and there has been to date no fully systematic study of Hobbes’s moral psychology.
    step1: |-
      十七世纪的英国哲学家托马斯·霍布斯（Thomas Hobbes）如今被广泛视为为数不多的几位真正伟大的政治哲学家之一，其代表作《利维坦》（*Leviathan*）在重要性上与柏拉图、亚里士多德、洛克、卢梭、康德、罗尔斯的政治著作不相上下。霍布斯闻名于后世，是因为他对后来被称为“社会契约论”的方法作出了早期而精细的发展；这种方法诉诸处境适当的、理性、自由而平等的人之间将会达成的协议，为政治原则或政治安排提供辩护。他也因用社会契约方法得出一个惊人的结论而声名不佳，即我们应当服从一个绝对的——不可分割且没有限制的——主权权力的权威。尽管他在方法上的革新对此后的政治哲学研究产生了深刻的建设性影响，他的实质性结论却大多只充当了发展更易接受的哲学立场的对照物。霍布斯的道德哲学不如他的政治哲学那样有影响，部分原因在于这一理论太过含糊，以致就其内容从未形成任何普遍共识。多数学者认为霍布斯主张某种个人相对主义或主观主义；但认为霍布斯信奉神命论、德性伦理学、规则利己主义或某种投射主义的观点，同样能在霍布斯的文本与学者中间找到支持。因为霍布斯主张“自然法的真正学说就是真正的道德哲学”，所以对霍布斯道德哲学的解释分歧可以追溯到对霍布斯“自然法”的地位与运作方式的不同理解；这些法将在下文讨论。曾经占主导地位的看法认为霍布斯信奉心理利己主义并以此作为其道德理论的基础，如今这种看法已被广泛拒斥；而迄今为止，还没有对霍布斯的道德心理学作出完全系统的研究。
    step2: |-
      十七世纪的英国哲学家托马斯·霍布斯（Thomas Hobbes），如今公认为寥寥数位真正伟大的政治哲学家之一；其代表作《利维坦》（*Leviathan*）的重要性，与柏拉图、亚里士多德、洛克、卢梭、康德、罗尔斯的政治著作不相上下。霍布斯之所以闻名，是因为他很早就对后来所谓的“社会契约论”作了精细的发展：这种辩护方式，是诉诸处境适当的、理性、自由而平等的人之间将会达成的协议，来为政治原则或政治安排提供理由。他之所以声名不佳，则是因为他用这套社会契约方法得出了一个惊人的结论：我们应当服从一个绝对的、亦即不可分割且不受限制的主权权力。方法上的革新对此后的政治哲学产生了深刻的建设性影响；他的实质结论却多半只作反衬，供人提出更易于接受的立场。霍布斯的道德哲学不及他的政治哲学那样有影响，原因之一便是这套理论过于含混，就其内容从未达成普遍共识。多数学者认为，霍布斯主张某种个人相对主义或主观主义；不过，说他信奉神命论、德性伦理学、规则利己主义或某种投射主义，同样能在霍布斯的文本和学界研究中找到依据。霍布斯声称：“自然法的真正学说就是真正的道德哲学。”因此，对霍布斯道德哲学的解释分歧，可以追溯到人们对霍布斯“自然法”的地位与运作方式理解不同；这些法下文将予讨论。过去占主导地位的观点认为，霍布斯以心理利己主义为其道德理论奠基；如今这一观点已被广泛抛弃。至于霍布斯的道德心理学，迄今还没有一部完全系统的研究。
