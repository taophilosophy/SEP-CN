      这一解决方案同样优雅而大胆。它可能加深了怀疑：我之为拿破仑这一情形，是否根本是一个*情形*。（因为如果它是一个可能情形，与一个现实情形属于同一*类*，我怎么可能在采取何种态度对待它时受到*逻辑的*——而非人的——约束？）它也引发了关于“与拿破仑规定相认同”究竟意味着什么的问题。人们可能想，如果“我”是*完全*规定性的，我就不能规定拿破仑在我为拿破仑的情形中应被击败，因为那显然不是他想要的，或绝不会想要的；如果是这样，我就不能诚实规定所有像拿破仑的人应被击败，因为，就一个情形（我为拿破仑的那个）而言，我*并不*想要那一点。黑尔所要求的是一种较弱的认同：鉴于我在道德化，从而在为给定一般种类的所有情形规定，我必须给予那些在我为拿破仑的情形中属于我的偏好*一些*分量，但不超过我给予在任何其他情形中属于我的偏好的*更多*分量；因此，在决定要普遍地规定什么时，我必须对所有相关偏好（相对于其普遍性与强度）同等看待。这正是黑尔想引我们到的地方；但他招致了这个问题：他如何证明，人们是由“应当”与“我”的逻辑*被引到*那一步的。
