      Hare was aware that such an inference goes through unproblematically (and uninterestingly) once we limit ourselves to the descriptive meaning of “bad” that is spelled out in *B**; but, of course, we want to have an inference to a prescriptive, and not just a descriptive, conclusion. Eriksson now draws on a point that is already recurrent in Hare: in virtue of universalizability, *S* faces a problem if he wishes to mean 1. prescriptively while refusing to mean 3. prescriptively. If he is to forbid *A*’s lying to him, but not his lying to *A*, he will need to identify some relevant alternative to *B** that fits *A*’s lying to him, but not his lying to *A*; this is where descriptive meaning becomes crucial. What here defines “relevance”? A mere difference of identity between *S* and *A* is excluded from counting as relevant by universalizability. Yet no doubt *S* is also distinguishable from *A* by various general features, and any of these might serve to make a permissible distinction between the two cases. Here we need to appeal to the full force of the Golden Rule Argument that we shall come to in the next section: what is likely to exclude the speaker from making some artificial distinction that permits him to lie to *A*, but not *A* to lie to him, will be his inability sincerely and prudently to select his prescriptions in accordance with it.
    step1: |-
      黑尔意识到，一旦我们把自己限制在 *B** 中所阐明的那一“坏”的描述性意义，这样的推理就无麻烦（也无趣）地成立；但是，当然，我们想要的是达到一个规定性的，而非只是描述性的结论。埃里克森现在利用黑尔中已反复出现的一点：由于可普遍化性，如果 *S* 希望把 1 规定性地理解，却拒绝把 3 规定性地理解，他就面临一个问题。如果他要禁止 *A* 对他说谎，却不禁他自己对 *A* 说谎，他就需要找出某个相关的、对 *B** 的替代，它适用于 *A* 对他说谎，却不适用于他对 *A* 说谎；这正是描述性意义变得至关重要之处。这里什么界定了“相关性”？*S* 与 *A* 之间单纯的身份差异，被可普遍化性排除在相关之外。然而，无疑 *S* 也可由各种一般特征而与 *A* 区分开来，其中任何一个都可能用来在两案之间作出允许的区分。这里我们需要诉诸下一节将谈到的黄金法则论证的全部力量：很可能把说话者排除在作出某种人工区分之外——那种使他得以对 *A* 说谎、却不许 *A* 对他说谎的区分——的，是他无法真诚而审慎地依据该区分来选择其规定。
