      *The Language of Morals* introduced a distinction between prescriptive and descriptive meaning. Prescriptive meaning is defined in relation to imperatives: a statement is prescriptive if it entails, if necessary in conjunction with purely factual statements, at least one imperative; and to assent to an imperative is to prescribe action. Descriptive meaning is defined in relation to truth-conditions: a statement is descriptive to the extent that factual conditions for its correct application define its meaning. It is taken for granted, in the tradition of Hume, that the factual is only contingently motivating: desire is no part of sincere assent to a purely factual statement. A moral statement has prescriptive meaning, but may also be partly descriptive. Thus “*A* [a person] ought to φ” entails the imperative “Let *A* φ”, so that to assent to it sincerely is to have an overriding desire (which in application to oneself will amount, if its satisfaction appears practicable, to an intention) that *A* φ. If there are agreed reasons for φ-ing within a linguistic community, say that it is enjoyable, “*A* ought to φ” may take on the descriptive implication of “φ-ing is enjoyable”. “*X* is a good *F*” prescribes choice within a certain range (e.g., for someone who is choosing an *F*); it takes on a descriptive connotation if there are agreed standards for assessing *F*s.
    step1: |-
      《道德语言》引入了一种规定性意义与描述性意义之间的区分。规定性意义是相对于祈使句来定义的：如果一个陈述，在必要时与纯事实陈述相结合，蕴涵至少一个祈使句，那么它就是规定性的；而对一个祈使句表示同意，就是规定行动。描述性意义是相对于真值条件来定义的：一个陈述在多大程度上其正确应用的事实条件界定了它的意义，它就在多大程度上是描述性的。在休谟的传统中，人们理所当然地认为，事实性只是偶然地具有动机力：欲望并不是对纯事实陈述的真诚同意的一部分。一个道德陈述具有规定性意义，但也可能部分是描述性的。因此“*A* [一个人]应当 φ”蕴涵祈使句“让 *A* φ”，以至于对它表示真诚的同意，就是拥有一个压倒性的欲望（在应用于自身时，如果其满足显得可行，这将相当于一个意图）即 *A* φ。如果在一个语言共同体中对于 φ 有公认的理由，比如说它是令人愉悦的，那么“*A* 应当 φ”可能获得“φ 是令人愉悦的”这一描述性含义。“*X* 是好的 *F*”在规定范围内规定选择（例如，对于正在选择 *F* 的人而言）；如果有评估 *F* 的公认标准，它就获得一种描述性内涵。
