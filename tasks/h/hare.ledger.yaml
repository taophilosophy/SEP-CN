      那么，什么指导决定？在他论文的第二部分，他试图在诸如“朋友”这样的概念中找到道德推理的可靠基础；但他未及在出版物中试验，就抛弃了那个方法。他的论文《可普遍化》（1954/5）强调了在作出也是原则性决定时个人的责任。下一个重要发展出现在他的第二部著作《自由与理性》（1963）中，其中规定性与可普遍化性的形式特征产生了一种“黄金法则”式的论证（如《路加福音》6:31（钦定版）所陈述，它这样说：“你们愿意人怎样待你们，你们也要怎样待人”）。黑尔提供一个简单的场景（1963: 90–1）：假设 *A* 欠 *B* 钱，*B* 欠 *C* 钱，而法律允许债权人把债务人投入监狱来索债。如果 *B* 只是决定“我要把 *A* 投入监狱”，也许没有什么可对他说的。但他能说“我应当把 *A* 投入监狱”吗？如果他这样说，他就使自己承诺了一个原则，如“如果这是索债的唯一途径，债权人就应把债务人监禁起来”。*B* 不太可能愿意规定一个可能的推论，“让 *C* 把我投入监狱”，因为那会挫败他自己的利益。黑尔论证，这种论证形式即使事实上 *B* 自己不是债务人，也保持其力量；因为判断“我应当把 *A* 投入监狱”，以及它所援引的原则，仍将蕴涵条件句，如“如果我处于 *A* 的境地，就把我投入监狱”，而 *B* 不太可能能够真诚地赞同它。
