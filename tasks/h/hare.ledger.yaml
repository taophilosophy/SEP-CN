      This is intriguing, though not unproblematic. We may be struck by its invocation, in effect, of past imperatives (such as Gerald Manley Hopkins’s “Have fair fallen, O fair, fair have fallen”, addressed to Henry Purcell, which Hopkins explained, in a letter to Bridges on Feb. 3 1883, as ‘the singular imperative (or optative if you like) of the past, a thing possible and actual both in logic and grammar, but naturally a rare one’). Not that this is new: Hare had had already to defend them in prescriptivist analysis of “I ought to have done that”. A further question is whether Hare has correctly isolated the initial attitude. If what I am glad of is the kind of life I experience, in preference to there simply being less life of this kind in the world (cf. 1988c: 173–4), then, if universalization generates a golden-rule argument, it should indeed lead me to prescribe, *ceteris paribus*, creating other similar lives (unless it is the uniqueness of the life that I value). But Hare also supposes that what Jane Doe is grateful for is that *she*, Jane Doe, exist and not someone else, even equally privileged, in her place (1988b: 87–8). Yet it is less clear that we can expect her to have that attitude, let alone its analogue, within Hare’s framework, of being specially glad that Dick Hare (or someone with all his universal qualities) exists—supposing that he is glad to exist—in that possible world in which she is (or has all the universal qualities of) Dick Hare.
