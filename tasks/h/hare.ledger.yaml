      这引人入胜，尽管并非无问题。我们可能被它对过去祈使句的实际援引所触动（如杰拉尔德·曼利·霍普金斯的“美好的降落，哦美好，美好降落”，致亨利·珀塞尔，霍普金斯在 1883 年 2 月 3 日致布里奇斯的信中解释为‘过去时的独特祈使句（如果你喜欢，也可说希求式），一件在逻辑与语法上都可能而实际的东西，但自然罕见’）。这并不是新的：黑尔早已不得不在“我本应做了那件事”的规定主义分析中为之辩护。进一步的问题是黑尔是否正确地孤立了初始态度。如果我高兴的是我所经验的那类生活，胜过世界上就是少了这类生活（参 1988c: 173–4），那么，如果普遍化产生一个黄金法则论证，它确实应使我规定，*ceteris paribus*，创造其他相似的生命（除非我所珍视的是那生命的独特性）。但黑尔也假定，简·多伊所感激的是*她*，简·多伊，存在，而不是别人，即使同样享有特权，在她的位置存在（1988b: 87–8）。然而，不那么清楚的是，我们能否期待她有那种态度，更不用说其类比——在那一可能世界中，她是（或拥有迪克·黑尔的所有普遍性质）迪克·黑尔，她特别高兴迪克·黑尔（或某个拥有其所有普遍性质的人）存在——假设他高兴存在。
