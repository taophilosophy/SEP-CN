      As Hare notes (1981: 103), restrictions upon the relevant range of preferences may have the effect of bringing together a utilitarianism that aims to maximize pleasure or happiness, and one that aims to maximize the satisfaction of preference. Yet to have any hope of achieving this we would need a double restriction: the only preferences to be considered must be now-for-now or then-for-then, and they must be fully internal in relating only to conscious states of the subject—indeed, more precisely, to features of those states of which the agent is conscious, or, for short, *what it is like* to be in those states. However, this position is doubly insecure. First, when discussing the treatment of now-for-then preferences, Hare takes over from Richard Brandt the idea that rational agents seek to maximize the satisfaction of their present preferences after they have been adjusted in the light of full exposure to logic and the facts (1981: 101–5, 214–16). This makes the practical question for the agent not “What do I now prefer?”, but “What would I prefer after full exposure to logic and the facts?” The same issue arises even with now-for-now preferences. Hare discusses, though in a different context (1981: 142–4), the pleasure machine imagined by J.J.C. Smart (Smart & Williams 1983: 18)[^smart-1983] that maximizes the pleasures of a subject through generating a stream of illusory but enjoyable experiences. He sees it as an advantage of his variety of utilitarianism that, not being “formulated in terms of pleasure”, it can give weight to whether “we *prefer* a life for ourselves plugged into the machines to one devoted to pursuits now considered normal and enjoyable” (1981: 143). That suggests that we should give weight to now-for-now preferences whose objects are *not* restricted to conscious features of current mental states. Further, if we follow Brandt, we should ask not what now-for-now preferences an agent *actually* has, but which he *would* have after subjection to Brandt’s “cognitive psycho-therapy”. Yet this implication may trouble us, not only because of the indefinite scope it offers to paternalism, but because it would seem undeterminable what an agent *would* want if indefinitely informed.
    step1: |-
      如黑尔所指出（1981: 103），对相关偏好范围的限制可能具有把旨在最大化快乐或幸福的功利主义，与旨在最大化偏好满足的功利主义，带到一起的效果。然而，要实现这一点，我们需要双重限制：唯一要考虑的偏好必须是现在-对-现在或那时-对-那时，并且它们必须完全内在，只涉及主体的意识状态——事实上，更确切地说，涉及主体所意识到的那些状态的特征，或者简言之，处于那些状态中*是什么样子*。然而，这一立场是双重不稳固的。首先，在讨论现在-对-将来偏好的处理时，黑尔从理查德·布兰特那里接过这样一个观念：理性行动者寻求最大化其当前偏好的满足，这些偏好是在充分接触逻辑与事实之后被调整过的（1981: 101–5, 214–16）。这使得行动者的实践问题不再是“我现在偏好什么？”，而是“我在充分接触逻辑与事实之后会偏好什么？”同样的问题甚至出现在现在-对-现在偏好上。黑尔讨论了（尽管在不同的语境中，1981: 142–4）J.J.C. 斯马特所想象的那种快乐机器（Smart & Williams 1983: 18）[^smart-1983]，它通过产生一连串虚幻而愉快的经验来最大化一个主体的快乐。他认为他的功利主义变体的一个优点是：由于它不是“以快乐为措辞制定的”，它能够给予“我们为自己接上机器的生活，与致力于现在被视为正常而愉快的追求的生活”之间的偏好以分量（1981: 143）。这表明我们应给予其对象*不*限于当前心理状态的意识特征的现在-对-现在偏好以分量。此外，如果我们遵循布兰特，我们不应问一个行动者*实际上*有什么现在-对-现在偏好，而应问他经受布兰特的“认知心理治疗”之后*会*有什么偏好。然而，这一含义可能使我们不安，不仅因为它为家长制提供了不确定的范围，而且因为它似乎无法判定一个行动者如果被无限地告知会*想要*什么。
