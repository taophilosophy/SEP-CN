      这是一个非凡的、极其大胆的理智建构，它在许多点上招致争论。泽诺·文德勒（1988: 181）敦促我们把语义论题（可能为真或近乎为真）——“我”是纯粹的索引词——与任何形而上学主张（可能使我们困惑）——“我”指称一个可以承担*任何*状态或角色的纯粹主体——区分开来。在他的答复中，黑尔明显回避采纳一个比文德勒自己的更奇怪的形而上学立场（后者拒绝笛卡尔式的自我，但承认一个先验的自我）。然而，他仍然假定“我可能是拿破仑”为真，并且“我可能是拿破仑的那个世界，将是一个不同于此的世界，尽管其普遍属性相同”（1988a: 285）。他甚至假定我能考虑我是一只炉子、一座山或一棵树的情形——尽管，由于我若变成这样的东西就无法关心自己会怎样，这一考虑是空洞的（1988a: 283）。黑尔这里似乎进入了相当意想不到的领域。他的通常常识本应使他容许我设想不是*我是*拿破仑，而是*作为*拿破仑，即作为拿破仑会是什么样子；而这足以使人对滑铁卢的结局产生矛盾心理。但他要求在一种可能情形中，我至少是相关地*就像*拿破仑，如果他要主张规定“所有像拿破仑这样的人应受到应有报应”甚至*对自身*适用，因而可能是不审慎的。
