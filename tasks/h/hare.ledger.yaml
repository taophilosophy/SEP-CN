      At the heart of Hare’s ethical theory, therefore, lies a vision of human beings as unable to live up to a way of thinking towards which they are nonetheless ineluctably drawn. He perceives there to be a drama inherent in the human condition to which no fully integrated and unified system could do justice. His philosophy is currently somewhat out of fashion, in part through a reversion to various forms of cognitivism in ethics, in part through changes in the style of philosophy, which now pursues the clarity that he desired through a new complexity and professionalization. At least in the short term, it is probable, and in accord with the “strange dream” from which we started, that his thinking will come to be viewed from a distance, as playing a once important role within the non-cognitivist strain in ethics that was dominant through much of the 20ᵗʰ century. And yet it may yet come to hold the attention of a new audience through its recognition of the tensions inherent in any practical thinking that responds without complacency to the aspirations of our ethical ideals, and the limitations of our moral capacities.
    step1: |-
      因此，黑尔伦理理论的核心，是一种关于人类无法活出一种他们却不可避免地为之吸引的思想方式的愿景。他察觉到人性境况中固有的一种戏剧，任何完全整合而统一的体系都无法公正对待。他的哲学目前有些过时，部分是通过伦理学中向各种认知主义形式的回归，部分是通过哲学风格的变化——它现在以一种新的复杂性与专业化来追求他所渴望的清晰。至少短期内，很可能——并且与我们所由出发的“奇梦”相合——他的思想将被从远处看待，作为在伦理学中贯穿 20 世纪大部分时间的非认知主义脉络中一度重要的角色。然而，它仍可能通过认识到任何实践思想中固有的张力——那种不满足地回应我们伦理理想的抱负、以及我们道德能力的局限的思想——而吸引新的听众。
