      1. *Now-for-then preferences*. Hare is clear that we take into account *how much* an agent prefers one thing to another, also to *how many* agents prefer it. This suggests that we should also attend to *how long* an agent has a preference; for it would seem arbitrary to count a preference twice if two men have it, if only for a day, but only once if one man has it for two days. We might assimilate the questions *how long* and *how many* by dividing people into time-slices within which their relevant preferences are stable, and asking *how many* person-slices shared some given preference. Yet the effect is curious. Within the life of an individual, a preference may become overriding because he has entertained it for a long time, even if it has been replaced by conflicting preferences at the time of action. (And the theory would not allow one to give precedence to the preferences of the person-slice who acts on the grounds of agential autonomy; for agents enjoy no such privilege.)
      2. *External preferences*. One difficulty here is in assessing the intensity of an external preference that is idle, but perhaps because the agent can do nothing towards satisfying it. Apparent intensity may be deceptive: it is the mark of a sentimental attitude that it may be warmly felt, and yet at the same time inactive and insincere. However, the same problem arises elsewhere; it is not peculiar to external preferences.
      3. *Uninformed preferences*. It is hard to see how Hare’s framework itself justifies disregarding these. However, subjects may have a higher-level preference that, where they hold or lack a lower-level preference only out of ignorance, its presence or absence should be discounted—thought perhaps only so long as this does not give rise to a denial of autonomy within spheres where each of us expects to be free to act at will according to his own judgment.
    step1: |-
      1. *现在-对-将来偏好*。黑尔明确，我们要考虑一个行动者*多强烈地*偏好一物胜过另一物，也要考虑*多少*行动者偏好它。这表明我们还应注意一个行动者*多长久地*持有一个偏好；因为如果两个人持有它，哪怕只有一天，却只算一次，而一个人持有它两天，却只算一次，这似乎任意。我们可以把*多长久*与*多少*的问题合并，办法是把人分成时间切片，在其中他们的相关偏好是稳定的，然后问*多少*人-切片共享某个给定的偏好。然而，效果是奇怪的。在一个个体的生命内，一个偏好可能因为他长久地持有它而成为压倒性的，即使它在行动时已被冲突的偏好所取代。（而且，这一理论不会允许人以行动者自主性为由，优先考虑正在行动的人-切片的偏好；因为行动者不享有这种特权。）
      2. *外部偏好*。这里的一个困难在于评估一个闲置的外部偏好的强度，但也许是因为行动者对满足它无所作为。表面的强度可能具有欺骗性：一种情感态度的标志是它可能被强烈感受，然而同时又不活动、不真诚。然而，同样的问题在别处也出现；它并非外部偏好所特有。
      3. *未被告知的偏好*。很难看出黑尔的框架本身如何证明忽视这些是正当的。然而，主体可能有一个更高层次的偏好：在他们仅出于无知而持有或缺乏某个较低层次的偏好之处，其有无应予折减——不过也许只是只要这不致否定自主性，即在每个我们期望凭自己的判断自由行动的范围之内。
