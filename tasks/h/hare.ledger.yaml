      There is further unclarity in the notion of a *preference.* Hare had long distinguished being in *pain*, to which one may be indifferent (if the pain is slight, or if one has undergone prefrontal lobotomy), and *suffering*, which entails having a desire (not necessarily overriding) to escape it. Now it is plausible to suppose that, of any variety of suffering, there is such a thing as *what it is like to be subject to it.* (So Hare can write of a group of sufferers, “I shall not know what it will be like for them … unless I know what it is like to suffer like that”; 1981: 92.) This applies so long as the desire that is an aspect of suffering is of a kind that is bound to be *felt.* Yet we all are subject to an indefinite range of desires that are dispositional; and even occurrent desires may be manifest in how we think or act without being felt. Hare appears to overlook such variations when he writes of preferences in general, “If I do not feel the preference with the intensity which the person in the situation feels it, I have not fully represented his situation to myself” (Seanor & Fotion 1988: 288)[^seanor-1988]. And yet, when he considers failures to act as one prescribes (e.g., 1981: 21–2), he shows an awareness that how one chooses and acts can be equally indicative as anything one feels of what one prefers. No doubt this could be sorted out, and precisely by recognizing (as Hare doubtless could have, though the language is not his) that the *criteria* of preference are multiple. However, this would have for him two drawbacks. First, it multiplies the possible ways in which one might count as “identifying with” another. Hare has written, “In identifying myself with some person either actually or hypothetically, I identify with his prescriptions” (1981: 96–7). Yet another way might be imagining what it is like to be him at some time or in some situation—which is different, though it may (to the extent that his preferences come to his mind as objects of attention) be overlapping. Secondly, it confirms a doubt that one is likely to have anyway about the comparability of preferences. If I feel like doing something but, for no compelling reason, fail to do it, whereas you do it without any prior or accompanying consciousness of the preference, who has the stronger preference to do it? The question is liable to be unanswerable.
    step1: |-
      在*偏好*这一概念中还有进一步的不清晰。黑尔早已区分处于*疼痛*之中——对此人可能漠不关心（如果疼痛轻微，或者如果人做过前额脑白质切断术）——与*受苦*，后者包含想要逃离它的欲望（不一定压倒性）。现在可以合理假定，任何种类的受苦，都存在一种*处于其下是什么样子*的东西。（因此黑尔能写一群受苦者：“我不知道对他们会是什么样子……除非我知道像那样受苦是什么样子”；1981: 92。）这适用，只要作为受苦之一方面的欲望，属于一种必定被*感受到*的类。然而，我们都遭受着无限范围的倾向性欲望；甚至当下发生的欲望也可能在我们思考或行动中显现而不被感受到。黑尔在一般地写偏好时似乎忽视了这些变化：“如果我没有以身处那情境中的人所感受的强度来感受那偏好，我就没有把那一情境充分地向自己呈现”（Seanor & Fotion 1988: 288）[^seanor-1988]。然而，当他考虑未能按自己所规定的那样行动时（例如 1981: 21–2），他表现出一种意识：一个人如何选择与行动，可以同他感受到的任何东西一样，指示出他所偏好的。无疑这可以澄清，办法恰恰是承认（黑尔无疑本可以，尽管这语言不是他的）偏好的*判准*是多样的。然而，这对他有两个缺点。第一，它增多了人们可能算作“与某人相认同”的方式。黑尔写道：“在把自己与实际地或假设地与某个人认同之时，我与其规定相认同”（1981: 96–7）。然而，另一种方式可能是想象在某个时间或某种情境中做他会是什么样子——这虽不同，却可能（在其偏好作为注意对象进入他的心中这一程度上）有重叠。第二，它证实了一个人们本来就可能对偏好的可比性怀有的怀疑。如果我想要做某事却无缘无故没做，而你做了却没有任何先前或伴随的偏好意识，那么谁有更强的偏好去做它？这一问题可能无法回答。
