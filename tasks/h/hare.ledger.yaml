      Hare (1989c) further hoped to reduce the paradox of an embedded imperative by making a distinction between two elements within the expression of a speech act: when a speaker says “Do *X*”, thereby telling a hearer to do *X*, he both issues a sentence in the imperative mood, fit for the communication of a command, and indicates that he intends so to be using it. He calls a sign of the first a *tropic*, or sign of mood; this is to be distinguished from a *neustic*, or sign of subscription (like Frege’s assertion-sign). When “Do *X*” is embedded within a conditional antecedent, as can be expressed in English by “If you want to do *X*”, the tropic remains though the neustic disappears. This is why it is the imperative “Do *X*”, and not the indicative “You are about to do *X*”, that releases the consequent.
    step1: |-
      黑尔（1989c）进一步希望减少嵌入祈使句的悖论，办法是在言语行为的表达中区分两个要素：当一个说话者说“做 *X*”，从而告诉听者做 *X*，他既发出一个祈使语气、适于传达命令的句子，又表明他有意这样使用它。他把第一种的标志称为 *tropic*，即语气标志；这要与 *neustic*，即赞同标志（像弗雷格的断定号）区分开来。当“做 *X*”被嵌入一个条件前件中，正如英语中可用“如果你想做 *X*”来表达的那样，tropic 保留而 neustic 消失。这就是为什么是祈使句“做 *X*”，而不是直陈句“你即将做 *X*”，释放了后件。
