      我们可以称说话者为“*S*”，称听话者为“*A*”。埃里克森的提议是：这一推理的有效性取决于“坏”的描述性意义（它通常具有的一个，或者更可能，它在此语境中获得的一个）。假设 *S* 判定 *A* 对他说谎是坏的。这必定是因为，在他看来，它具有某种一般的致坏特征（或特征集）*B**；这构成前提 1 背后之物。于是，在一个简单的情形下（这应足以说明当前之点），构成前提 2 背后之物的，是把 *B** 平等地但条件式地归于 *A* 对他说谎。前提 1 成为释放前提 2 之后件的前件，于是我们得到 3 中所陈述的结论。
