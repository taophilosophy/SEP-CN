      规定性与可普遍化性这两个特征，此后始终是黑尔理论的两大支柱。“可普遍化”（universalisability）一词将成为稍后一篇论文（1954/5）的标题，该论文也澄清了一个给亚里士多德与康德带来真正麻烦的混乱。“一般的”*词项*（如“人”或“希腊人”）与“单称的”词项（如“苏格拉底”）相对照。然而，就*准则*（maxims）而言，人们需要保持两个区分：一个准则可以是“普遍的”，而非“单称的”或（歧义地）“特殊的”，如果它不指涉任何个体（除非在诸如“像”这样的介词辖域内，它把一个个体的名称转变成一种类的模糊规定）；一个准则也可以是“一般的”，而非“具体的”，如果它识别出一个*宽泛的*行动者或行动类——这是一种程度上的差异（因此普遍规则“永远提供真实证言”比“永远说真话”更具体，比“永远在宣誓下提供真实证言”更一般）。任何关于“一般原则”的实践性与可接受性的讨论，都需要保持这些区分。黑尔在这方面的清晰，是他对哲学最重要、无可争议的贡献。
