      Habermas defines communicative action in various ways but always to do with agreement on the basis of validity claims. In one place, he claims that it comprises “linguistically mediated actions in which all participants pursue illocutionary aims and only illocutionary aims” (1981 [1984a: 295]). That, however, is to put the point too strongly since agents don’t only aim to understand and to be understood (Steinhoff 2009: 35–6)[^steinhoff-2009]. A better definition is that communicative action is action in which participants pursue illocutionary aims “without reservation” also when they pursue “perlocutionary goals” via “illocutionary goals already achieved” (1986b [1998b chapter 3: 241]). This is important because Habermas correlates instrumental action with perlocutionary aims and communicative action with illocutionary aims, and he maintains that instrumental and strategic action depends on communicative action, but not vice versa. The idea is that agents, through their utterances, make validity claims (to truth, rightness and truthfulness) on which the meaning of their utterances depends, which are then taken up by their interlocutors and form the basis of understanding and any subsequent interactions.
