      在 20 世纪 80 年代和 90 年代，一批女性主义批评者受卡罗尔·吉利根对科尔伯格的批评《不同的声音》（*In a Different Voice*）的启发，发展出两条反对康德道德理论和罗尔斯式自由主义的重要论证路线。第一条是，“自由主义的”道德自我概念是形式的、抽象的、性别中立的。第二条是，道德自我是一个男性自我，伪装成中立的和普遍的。其暗示是，道德/道德理论与对妇女的歧视和父权制压迫是同谋的。她们对康德式、罗尔斯式和科尔伯格式的“道德立场”概念提出了类似的批评（Benhabib & Cornell [eds] 1987a; Benhabib 1992; Meehan [ed.] 1995）[^benhabib-1992]。在这些女性主义批评者中，一些人，例如本哈比布和米汉，最初支持商谈伦理，因为它强调纳入其他声音，并坚持其理想必须从真实行动者的实际实践中赢得。后来，她们的论证被重新调整，转而反对商谈伦理。因为道德自我被设想为形式的和抽象的，因为道德观点以可普遍化性和可逆性的形式标准为特征，哈贝马斯的商谈伦理不能容纳吉利根所主张的女性特有的那类道德经验：它对关怀和对他人责任的考虑的重要性是盲目的。本哈比布声称，这导致对妇女道德经验的私人化、个人化和贬低（Benhabib & Cornell 1987a: 7–9; Benhabib 1992: 152, 184）[^benhabib-1992]。她进一步论证说，“把道德领域限制于正义问题”导致“妇女经验的私人化，并导致对具体他者的认识论盲视”（Benhabib 1992: 164）[^benhabib-1992]。本哈比布的立场究竟等于对哈贝马斯理论的反驳，还是对它的阐明，存在一些疑问。商谈所强加的普遍化程序涉及道德商谈的参与者与具体的其他人想象性地转换视角。如果不是这样，如果“理想的角色承担”只要求一个人从一般地设想的他人的视角来考察候选规范，那么从这样的程序中就什么也得不到（Finlayson 2013a）[^finlayson-2013a]。同样不清楚的是，这样的批评是适用于哈贝马斯的道德理论，还是适用于他当作其对象的实际存在的科尔伯格式“第六阶段”道德。其次，不清楚这一批评是仅仅表明商谈伦理是一种有缺陷的道德理论，还是表明由于这些缺陷，该理论（或它所理论化的道德）使对妇女的歧视或压迫永久化。
