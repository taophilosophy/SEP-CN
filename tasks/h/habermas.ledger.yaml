      - The use of *weak transcendental arguments*, rather than the strong transcendental arguments of metaphysics (Yates 2011: 41–4)[^yates-2011]. Benhabib defines strong transcendental arguments as ones which aim to (prove) the necessity and singularity of certain conditions without which some aspect of our world, conduct, and consciousness *could* not be what it is. Descartes’ *cogito* and Kant’s refutation of idealism are examples, aiming to prove the existence of the subject and of the external world. Weak transcendental arguments, in contrast, focus on lifeworld practices such as communicative action, moral discourse, and democratic deliberation (rather than experience as such), and demonstrate more modestly that certain conditions need to be fulfilled for us to judge those practices to be of a certain sort rather than of a different kind. (Benhabib 2002: 38)[^benhabib-2002] Unlike strong transcendental arguments, weak transcendental arguments are both *a posteriori*, since they are based on rationally reconstructed experience, and falsifiable, since they can be refuted by further empirical experience (1976b [1998b: 42]).
