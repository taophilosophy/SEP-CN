      Finally, on the Kantian conception a maxim is adopted in virtue of its universal form, whereas on Habermas’s conception it is not just the form of the maxim that is universalized. It is in part the **content** of the norm that is universalized. This is why (U) refers to the “interests” of everyone affected it. But on Habermas’s view universalization is thought of as a social process that extends to the very self-conception of the moral agent. Habermas’s guiding idea here is G. H. Mead’s notion of “ideal role taking” (1988b: chapter 3 [1992a]; 1983 [1990: 56–68, 121]), in which moral agents learn by projecting themselves into the position of all other moral agents. This is a process whereby agents consider “every interest involved” and evaluate what is “good for everyone under the same conditions”, a process that, according to Mead, leads “to the development of a larger self, which can be identified with the interests of others” (Mead 1934 [1962: 363])[^mead-1934].
    step1: |
      最后，在康德式的构想中，一条准则因其普遍形式而被采纳，而在哈贝马斯的构想中，被普遍化的不只是准则的形式。被普遍化的部分地是规范的 **内容**。这就是为什么（U）涉及受其影响的每个人的“利益”。但在哈贝马斯看来，普遍化被设想为一种社会过程，它延伸到道德行动者的自我理解本身。哈贝马斯这里的指导观念是 G. H. 米德的“理想的角色承担”概念（1988b: 第 3 章 [1992a]; 1983 [1990: 56–68, 121]），在其中，道德行动者通过把自己投射到所有其他道德行动者的位置来学习。这是一个过程，行动者通过它考虑“所涉及的每一种利益”，并评价什么“在同样条件下对每个人都是好的”，按照米德的说法，这一过程导致“一个更大的自我的发展，这个自我可以与他人的利益相等同”（Mead 1934 [1962: 363]）[^mead-1934]。
