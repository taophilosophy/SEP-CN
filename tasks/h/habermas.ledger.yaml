      Habermas assumes that the rules (1), (2) a–c, and (3) above can be identified by a test of performative self-contradiction. A performative contradiction arises when a rule that speakers pragmatically invoke by the illocutionary act of, say, assertion, is contradicted by the semantic content of that assertion. An example is Moore’s paradox: “It is raining but I don’t believe it” (Moore 1993)[^moore-1993]. Habermas maintains that the test of whether the denial of a rule yields a performative contradiction does not justify rules of discourse so much as identify them (1983 [1990: 95]). On that point, he differs from his colleague Karl-Otto Apel, who in his seminal 1973 paper attempts what he calls a transcendental-pragmatic, “ultimate” justification of the norms of a minimal ethics, by showing how they follow directly from the pragmatic preconditions of communication (Apel 1976 [1980])[^apel-1976]. According to Cristoph Lumer, Habermas made the same attempt in the original manuscript of *Moral Consciousness and Communicative Action*, though abandoned it in subsequent versions (Lumer 1997: 50)[^lumer-1997]. Later, as Heath (2014: 843)[^heath-2014] notes, Habermas denies that his principle of universalizability (U)—see §3.3 below—can be justified through a “performative contradiction argument”, not only because applying the test of performative contradiction to a rule is in his view heuristic, not justificatory, but also, because he thinks, no such principles and certainly no substantive moral norms follow directly from those rules.
