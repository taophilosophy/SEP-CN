      Habermas’s long essay “Technology and Science as ‘Ideology’” is a festschrift for Herbert Marcuse, and not an uncritical one (1968a [1970]). It deals with topics he broached in the volume of essays *Theory and Practice* (1971 [1973b]) that broadly argue against the reduction of political theory from a body of thought answering practical questions of how one should live, to “a form of social engineering that dispenses with public discourse” (Celikates & Jaeggi 2009 [2017: 261])[^celikates-2009].
