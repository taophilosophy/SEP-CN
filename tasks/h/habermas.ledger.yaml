      第一根支柱，即比勒的语言功能图式，作为哈贝马斯理论的一项指导性假定而具有重要意义。哈贝马斯之所以如此看重比勒的模型，是因为它涵盖语言意义的整个领域，并对三个维度给予同等的重视与优先地位：说者所意图的东西、话语内容中所说的东西，以及借该话语所做的事情。在哈贝马斯视为原初交往方式的活动中，这三个维度都同时在场：说者 *S* 与另一个人 *H* 就某事物达成相互理解（1988b [1998b 第 6 章：279] [1992a: 58]）。这种三元架构辐射到哈贝马斯理论的各个方面：有三种有效性主张，即真实性、正当性与真诚性（TCAI: 307）；说者可以采取三种态度，即客体化态度、规范遵循态度与表达性态度（TCAI: 309）；说者通过话语与三个“世界”建立关系，即事态的客观世界、合法社会秩序的社会世界或主体间世界，以及主观内在世界（TCAI: 49–52, 60, 236, 308）；最后，有三种基本的言语方式，构成言语行为分类的基础，即断言式或陈述式言语行为、调节式言语行为（如命令或请求）与表达性言语行为（TCAI: 309）。这些三元区分彼此嵌套。
