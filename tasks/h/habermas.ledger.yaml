      The third pillar is formal semantics. To explain the notion of a meaning-critical validity claim, Habermas enrols Dummett’s verificationist critique of truth-conditional semantics, and the epistemic turn in formal semantics (1981 [1984a: 316–8]; 1981 [1998b chapter 2: 153]). Dummett argues that justification is an epistemic idea, but truth is not, and that the truth-conditions of many sentences are unknowable, even where their justification conditions are not. He proposes the view that we understand the meaning of a sentence when we know the conditions under which it is assertible, rather than the conditions under which it is true (Dummett 1993: 45; Heath 2001: 120–121; Fultner 2011a: 60–62)[^dummett-1993][^fultner-2011a][^heath-2001].
    step1: |
      第三根支柱是形式语义学。为了解释意义攸关的有效性主张这一概念，哈贝马斯借用了达米特对真值条件语义学的证实主义批判，以及形式语义学中的认识论转向（1981 [1984a: 316–8]；1981 [1998b 第 2 章：153]）。达米特论证说，证成是一个认识论观念，真理则不是；许多句子的真值条件不可知，即使它们的证成条件并非不可知。他提出的观点是：我们理解一个句子的意义，在于我们知道它在什么条件下可被断言，而不是知道它在什么条件下为真（Dummett 1993: 45; Heath 2001: 120–121; Fultner 2011a: 60–62）[^dummett-1993][^fultner-2011a][^heath-2001]。
    step2: |
      第三根支柱是形式语义学。为了说明“意义攸关的有效性主张”，哈贝马斯借用了达米特对真值条件语义学的证实主义批判，也借用了形式语义学中的认识论转向（1981 [1984a: 316–8]；1981 [1998b 第 2 章：153]）。达米特主张，证成是认识论观念，真理不是；许多句子的真值条件不可知，哪怕其证成条件可知。由此他提出：理解一个句子的意义，就是知道它在什么条件下可被断言，而非知道它在什么条件下为真（Dummett 1993: 45; Heath 2001: 120–121; Fultner 2011a: 60–62）[^dummett-1993][^fultner-2011a][^heath-2001]。
