      它们不是作为永恒的常量被揭示出来的，而是随着时间发展、带着各自内在的发展逻辑被揭示出来的（Pedersen 2008: 463, 474–9）[^pedersen-2008]。哈贝马斯最初主张，合理重构揭示的是关于人类普遍能力的知识，即“物种能力”，而不是特定群体或个体的能力（1976b [1998b: 34–5]；McCarthy 1991: 130–2）[^mccarthy-1991]。例如，对日常言语实践进行合理重构，揭示的是交往行为本身的规则，而不是某一种语言的语法。然而，哈贝马斯后来把法与民主的话语理论描述为对民主宪政国家“现代法律秩序的自我理解”的合理重构（1992b [1996b: 82]，强调已删去）；这显然是一种局部现象，似乎表明他此后修改了重构方法的适用范围。评注者在这一问题上有分歧：一些人区分《交往行为理论》中展示的“经验性”重构与《在事实与规范之间》中的“规范性”重构（Peters 1994: 119）[^peters-1994]；另一些人则主张两个工程背后是同一种方法论（Patberg 2014: 511–3；但参见 Gaus 2013: 561）[^gaus-2013][^patberg-2014]。如果我们记得民主立法诉诸普遍的交往能力，并运用实用的、伦理的与道德的话语，这一张力就部分得到化解。现象是局部的，但涉及的能力是普遍的。
