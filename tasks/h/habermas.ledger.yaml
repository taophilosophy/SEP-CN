      Rawls, Cohen, and Larmore argue in addition that Habermas’s political theory rests on what Rawls calls a “comprehensive doctrine” since it is based on a controversial theory of meaning and communication and a controversial doctrine of method (Rawls 1995: 139; Cohen 1999; Larmore 1995)[^cohen-1999][^larmore-1995][^rawls-1995]. However, there is an important difference between comprehensive philosophical doctrines and comprehensive moral, ethical or religious doctrines. The fact that a normative political theory has controversial philosophical assumptions, which almost all do, does not create the kind of practical problems that arise when a political system, or constitution, is saddled with controversial moral or religious assumptions, and its citizens cannot regard it as legitimate (Lister 2007)[^lister-2007]. To make that claim is to presuppose that political theory answers to the same canons of justification as political systems (Laden 2010)[^laden-2010].
