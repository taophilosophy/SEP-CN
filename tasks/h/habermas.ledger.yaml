      20 世纪 80 年代与 90 年代，一批女性主义批评者受卡罗尔·吉利根对科尔伯格的批评《不同的声音》（*In a Different Voice*）启发，发展出两条重要的论证路线，反对康德道德理论与罗尔斯式自由主义。第一条是，“自由主义”的道德自我构想是形式的、抽象的、性别中立的。第二条是，道德自我其实是一个男性自我，却伪装成中立而普遍的。其言下之意是：道德/道德理论与对女性的歧视和父权制压迫串通一气。她们对康德式、罗尔斯式与科尔伯格式的“道德立场”构想提出了类似的批评（Benhabib & Cornell [eds] 1987a; Benhabib 1992; Meehan [ed.] 1995）[^benhabib-1992]。在这些女性主义批评者当中，有些人起初支持商谈伦理，例如本哈比布与米汉，因为商谈伦理强调纳入其他声音，并坚持其理想必须从真实行动者实际实践的重构中获得。后来，她们的论证经过调整，转而反对商谈伦理。由于道德自我被设想为形式的、抽象的，又由于道德观点以可普遍化性与可逆性这些形式标准为特征，哈贝马斯的商谈伦理无法容纳吉利根所主张的那种女性特有的道德经验：它对关怀与对他人责任的考量之重要性视而不见。本哈比布声称，这导致女性道德经验的私人化、个人化与贬低（Benhabib & Cornell 1987a: 7–9; Benhabib 1992: 152, 184）[^benhabib-1992]。她进一步论证说，“把道德领域限制于正义问题”导致“女性经验的私人化，并导致对具体他者的认识论盲视”（Benhabib 1992: 164）[^benhabib-1992]。本哈比布的立场究竟是对哈贝马斯理论的反驳，还是对它的阐明，尚存疑问。商谈所施加的普遍化程序，要求道德商谈的参与者与具体的他人想象性地交换视角。若非如此，如果“理想的角色承担”只要求从一般设想的他人视角考察候选规范，那么这一程序就毫无所得（Finlayson 2013a）[^finlayson-2013a]。同样不清楚的是，这类批评究竟适用于哈贝马斯的道德理论，还是适用于他作为其对象的、实际存在的科尔伯格式“第六阶段”道德。其次，也不清楚这一批评是仅仅表明商谈伦理是一种有缺陷的道德理论，还是表明由于这些缺陷，该理论（或它所理论化的道德）延续了对女性的歧视或压迫。
