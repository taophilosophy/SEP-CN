      哈贝马斯在后来的著作中继续使用公共领域概念（1973a [1975: 37–8, 48]；1992b [1996b]），详细阐述了它在现代社会中的位置（1992b [1996b: 359–87]；2008b [2009：第 8、9 章]）。在他最初的表述中，有一种倾向，即假定单一政体存在单一而统一的公共领域。针对南希·弗雷泽（Nancy Fraser）关于“次属反公共领域”（subaltern counterpublics）的讨论（Fraser 1992）[^fraser-1992]，并承认自己早先忽视了“平民公共领域”（plebian public spheres），哈贝马斯现在承认，一个给定社会之内可能存在大量相互交叠的公共领域；它们关注不同的共同体与议题，但边界具有渗透性，允许交往的流动在其间通过（1992c: 424–5；1992b [1996b: 373–4]）。最接近“普遍”公共领域的，是政治公共领域，它聚焦于政治系统。政治公共领域既是影响整个社会的种种问题的“共鸣板”，也是“滤床”，筛出公共话语中那些体现可普遍化利益的贡献（2008b 第 11 章 [2009：第 9 章，143]）。反思性的公共舆论由此形成，交往权力由此产生。当代政治公众最显著的特征之一，是它分为“正式的”与“非正式的”两部分：前者指民选政治家、法官、议会与法院高度受规制的话语，后者指这些空间之外“野生的”、不受规制的交往流动（2008b 第 11 章 [2009：第 9 章，159–62]）。哈贝马斯主张，正式公共领域与非正式公共领域之间恰当的反馈，对于使政治系统的行动获得合法性至关重要。与此同时，没有理由认为公共领域必须止于国界。在一个日益相互依赖的世界中，全球注意力可以聚焦于单个议题——哈贝马斯举越南战争与伊拉克战争为例——从而至少暂时地创造出跨国公共领域（2004：第 3 章 [2006c: 39–48]）。像欧盟这样的跨国政体的政治合法性，取决于其成员国的公共领域能否协同行动，作为一个欧洲公共领域发挥作用（2008b 第 9 章、第 11 章 [2009：第 6 章，87–8；第 9 章，181–3]）。
