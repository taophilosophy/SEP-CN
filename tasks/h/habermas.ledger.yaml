      To the extent that there is an argument in *Theory of Communicative Action* for the triadic structure itself, it rests on the basic claim that there are three equiprimordial, meaning-critical validity claims. Every speech-act simultaneously makes a claim to truth, to rightness, and to truthfulness. That means a speech-act can be taken up by the hearer, and assessed in the light of its propositional truth, normative rightness, or the sincerity with which it is expressed. If accepted, this means that agreement (*Einverständnis*) is reached “simultaneously on three levels” (1981 [1984a: 307]). In defence of this view Habermas argues that a speech-act can always be rejected from three perspectives: in the light of its assertibility conditions, its normative justification, or the sincerity of the speaker (1981 [1984a: 306]; 1988b essay 4 [1998b: 231]; 1988b essay 6 [1998b: 296]; 1999a [1998b: 317]). However, the claim that needs to be defended, not assumed, is that the validity claim for every speech-act can be rejected from three and only three perspectives. And as Dorschel claims, an assertion or utterance might be rejected in virtue of the volume or style with which it is uttered (Dorschel 1988: 8–9)[^dorschel-1988]. In the final analysis, the “argument” that any utterance can be rejected from three and only three perspectives is question-begging. So the triadic structure, stemming from Bühler’s schema remains best thought of as a hinge assumption.
