      Habermas’s theory has come in for criticism from all sides. On the one hand critics like Amy Allen claim that there is a residual asymmetry, and that Habermas still “stacks the decks in favour of secularism” (Allen 2013: 149)[^allen-2013]. Wolterstorff agrees, though he thinks the problem lies with the idea of “post-metaphysical reason”, while Allen traces it to his “genealogy of post-secular reason”. Cristina Lafont argues, by contrast, that the asymmetric burden falls the other way, since the cognitive learning process imposes a duty on secular citizens to give up their scientistically motivated atheism in favour of politically motivated agnosticism (Lafont 2013: 238; Finlayson 2019: 14)[^finlayson-2019][^lafont-2013]. The idea of “sacred-to-secular translation” is central to Habermas’s model of postsecular deliberative democracy. As an example, Habermas cites German Christian groups translating the statement from Genesis that “God created man in his own image” into secular language as “a gamete fertilized *ex utero* has the status of a subject of human rights” as part of their arguments against stem-cell research (2001b chapter 2 [2003b: 109]). Yet the idea has proved controversial. It is not clear, for example, whether or not Habermas considers it to work the same way as ethical and philosophical appropriations of religious concepts (see Cooke 2011; Kerkwijk 2015; Rees 2018: 143–65)[^cooke-2011][^kerkwijk-2015][^rees-2018]. For Wolterstorff it relies on the idea of post-metaphysical reason that is skewed in favour of secularism, while Rees argues that the idea is empty, since no such translations are possible.
    step1: |
      哈贝马斯的理论受到来自各方的批评。一方面，像艾米·艾伦这样的批评者主张存在一种残余的不对称，哈贝马斯仍然“在发牌时偏向世俗主义”（Allen 2013: 149）[^allen-2013]。沃尔特斯托夫同意这一点，不过他以为问题出在“后形而上学理性”的观念上；艾伦则把它追溯到哈贝马斯的“后世俗理性的谱系学”。Cristina Lafont 则相反地论证说，不对称的负担落在另一边，因为认知学习过程把一项义务加给世俗公民：放弃其出于科学主义动机的无神论，转而采取出于政治动机的不可知论（Lafont 2013: 238；Finlayson 2019: 14）[^finlayson-2019][^lafont-2013]。“从神圣到世俗的翻译”这一观念，对于哈贝马斯的后世俗审议民主模型至关重要。作为例子，哈贝马斯援引德国基督教团体把《创世记》中“上帝照着自己的形象造人”的说法翻译为世俗语言——“体外受精的配子具有人权主体的地位”——作为其反对干细胞研究的论证的一部分（2001b 第 2 章 [2003b: 109]）。然而这一观念已被证明颇具争议。例如，不清楚哈贝马斯是否认为它起作用的方式与对宗教概念的伦理占有和哲学占有相同（见 Cooke 2011；Kerkwijk 2015；Rees 2018: 143–65）[^cooke-2011][^kerkwijk-2015][^rees-2018]。在沃尔特斯托夫看来，它依赖一种偏向世俗主义的后形而上学理性观念；Rees 则论证说，这一观念是空洞的，因为这样的翻译根本不可能。
    step2: |
      哈贝马斯的理论遭到各方批评。一方面，艾米·艾伦等批评者认为仍存在残余的不对称，哈贝马斯依旧“在发牌时偏袒世俗主义”（Allen 2013: 149）[^allen-2013]。沃尔特斯托夫也同意，但他认为问题出在“后形而上学理性”这一观念；艾伦则把它归到哈贝马斯“后世俗理性的谱系学”。Cristina Lafont 相反地认为，不对称的负担落在另一边：认知学习过程对世俗公民施加义务，要他们放弃出于科学主义动机的无神论，改取出于政治动机的不可知论（Lafont 2013: 238；Finlayson 2019: 14）[^finlayson-2019][^lafont-2013]。“从神圣到世俗的翻译”这一观念，是哈贝马斯后世俗审议民主模型的核心。哈贝马斯举例说，德国一些基督教团体把《创世记》中“上帝照着自己的形象造人”一语译成世俗语言——“经 *ex utero* 受精的配子具有人权主体的地位”——作为其反对干细胞研究之论证的一部分（2001b 第 2 章 [2003b: 109]）。但这一观念颇具争议。比如，哈贝马斯是否认为它的运作方式与对宗教概念的伦理占有、哲学占有相同，尚不清楚（见 Cooke 2011；Kerkwijk 2015；Rees 2018: 143–65）[^cooke-2011][^kerkwijk-2015][^rees-2018]。在沃尔特斯托夫看来，它依赖的是一种偏向世俗主义的后形而上学理性观念；Rees 则认为这一观念空洞无物，因为这类翻译根本不可能。
