      This brings us to the third significant feature of Habermas’s critical social theory: the problem of normative grounds. In the introduction to *Theory of Communicative Action* Habermas describes his project as “not a meta-theory but the beginning of a social theory concerned to validate its own critical standards” (Schnädelbach 1986 [1991: 8])[^schnädelbach-1986], inviting the contrast with the critical “social theory” developed in the mid twentieth century by Horkheimer and Adorno, which, according to Habermas’s criticism, had foundered on “the difficulty of giving an account of its own normative foundations” (1981 [1984a: 374]). He also criticizes systems theory for failing to see the primacy and fragility of the lifeworld, its function of embedding and facilitating all spheres of action, and its crucial role in producing and reproducing social order. Systems theory conflates system and social integration and “deprives itself of the standard of communicative rationality” (1981 [1987: 186]).
