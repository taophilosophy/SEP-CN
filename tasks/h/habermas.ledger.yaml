      Reification is the major downside, which Habermas sees as a specific alienating effect of the destruction of the communicative capacity for symbolic reproduction and social integration provided by the lifeworld. In particular, reification arises when the intrusion of steering media causes the “conversion to another mechanism of action coordination” (1981 [1987: 375]). Since this conversion happens as it were behind the backs of social agents rather than through their conscious intentions and choices, colonization gives rise to “objectively false consciousness” and its effects “have to remain hidden” (1981 [1987: 187]). Notably, contra the Marxist tradition up to Lukács, the reification effect arises in class-unspecific ways and thus the crises do not precipitate class conflict, which, Habermas argues, the welfare state has largely succeeded in pacifying (1981 [1987: 187]). Furthermore, though reification effects are “filtered through the pattern of social inequality”, the latter is not one of the pathologies he focuses on (1981 [1987: 349]). He focuses more on welfare state clientism, and juridification (1981 [1987: 357, 363–4]). This is one of the important differences between Habermas’s social theory and Rawls’s *Theory of Justice*, and leads to a completely different outlook in the diagnosis of social ills (Jütten 2011)[^jütten-2011].
    step1: |
      物化是主要的弊端，哈贝马斯把它看作一种特定的异化效果，即生活世界所提供的符号再生产和社会整合的交往能力遭到摧毁。特别是，当操控媒介的侵入引起“向另一种行动协调机制的转换”时，物化就产生了（1981 [1987: 375]）。由于这种转换可以说是发生在社会行动者的背后，而不是通过他们有意识的意图和选择，殖民化引起“客观的虚假意识”，其效果“必须保持隐蔽”（1981 [1987: 187]）。值得注意的是，与直到卢卡奇为止的马克思主义传统相反，物化效果以不限于阶级的方式产生，因此危机并不促成阶级冲突；哈贝马斯论证说，福利国家在很大程度上已经成功地平息了阶级冲突（1981 [1987: 187]）。此外，虽然物化效果“经过社会不平等模式的过滤”，但后者并不是他所关注的病理之一（1981 [1987: 349]）。他更关注福利国家庇护主义和法律化（1981 [1987: 357, 363–4]）。这是哈贝马斯的社会理论与罗尔斯的《正义论》之间的重要差别之一，并导致在社会弊病诊断上的完全不同看法（Jütten 2011）[^jütten-2011]。
