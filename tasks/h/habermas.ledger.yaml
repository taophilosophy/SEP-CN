      Habermas continues to make use of the concept of the public sphere in his later works (1973a [1975: 37–8, 48]; 1992b [1996b]), developing a detailed account of its place in modern societies (1992b [1996b: 359–87]; 2008b [2009: chapters 8 & 9]). In his original formulation, there was a tendency to assume the existence of a single unified public sphere for a single polity. In response to Nancy Fraser’s discussion of “subaltern counterpublics” (Fraser 1992)[^fraser-1992] and acknowledging his own earlier neglect of “plebian public spheres”, Habermas now concedes that there may be a multitude of intersecting public spheres within a given society, focusing on different communities and topics but with porous boundaries that allow flows of communication to pass between them (1992c: 424–5; 1992b [1996b: 373–4]). The closest thing to a “universal” public sphere is the political public sphere, focused on the political system. The political public sphere acts as a “sounding board” for problems which affect society as a whole, as well as a “filter-bed”, filtering out contributions to public discourse which represent generalizable interests (2008b chapter 11 [2009: chapter 9, 143]). In this manner, reflexive public opinion is formed and communicative power is generated. One of the most salient features of the contemporary political public is its division into “formal” and “informal” segments, the former denoting the highly regulated discourse of elected politicians, judges, parliaments, and courts, and the latter the “wild”, unregulated flows of communication outside these spaces (2008b chapter 11 [2009: chapter 9, 159–62]). Habermas argues that the right kind of feedback between formal and informal public spheres is vital for legitimating the political system’s actions. At the same time, there is no reason to think that public spheres must stop at national borders. In an increasingly interdependent world, global attention can be focused on single issues—Habermas mentions the wars in Vietnam and Iraq as examples—creating, at least temporarily, a transnational public sphere (2004: chapter 3 [2006c: 39–48]). The political legitimacy of transnational polities like the EU hinges on whether the public spheres of its member states can act together, functioning as a European public sphere (2008b chapter 9, chapter 11 [2009: chapter 6, 87–8, chapter 9, 181–3]).
