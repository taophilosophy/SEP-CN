      One difficulty facing Habermas is to square his claims that (a) democratic discourse is an amalgam of all three kinds of discourse, and (b) that political legitimacy is *sui generis* and both ethically and “morally freestanding”, with (c) the absolute priority of morality in all spheres. He claims that legitimate laws “must harmonize with the universal principles of justice” (1992b [1996b: 99, 155]) and that legitimate laws must not “contradict basic moral principles” (1992b [1996b: 106]), by which he means valid moral norms. He places a moral permissibility constraint on political legitimacy, in such a way that it appears that morality constrains political legitimacy from the outside (Finlayson 2016)[^finlayson-2016]. Habermas does not, though, see this as an “external” constraint, since he argues that morality flows into the political and legal domain through the constitutional role of basic rights, and circulates within it. Nevertheless, the moral permissibility constraint smudges the bright line that Habermas likes to draw between what he calls natural law theories of legitimacy, which are based on an antecedent morality, and discourse theory, which is not.
    step1: |
      哈贝马斯面临的一个困难是使以下主张彼此相容：(a) 民主话语是三类话语的混合体，(b) 政治合法性是 **自成一类** 的，在伦理上与“道德上”都自立，以及 (c) 道德在所有领域中具有绝对优先性。他主张合法的法律“必须与普遍的正义原则相协调”（1992b [1996b: 99, 155]），并且合法的法律不得“与基本道德原则相矛盾”（1992b [1996b: 106]），后者指的是有效的道德规范。他为政治合法性设置了一个道德可允许性约束，以至于看起来是道德从外部约束政治合法性（Finlayson 2016）[^finlayson-2016]。不过，哈贝马斯并不把这看作“外部”约束，因为他主张道德通过基本权利的宪法作用流入政治与法律领域，并在其中循环。尽管如此，道德可允许性约束还是弄糊了哈贝马斯喜欢划出的那条清晰界线：一边是他所说的自然法合法性理论，以先行的道德为基础；另一边是话语理论，并不以此为基础。
