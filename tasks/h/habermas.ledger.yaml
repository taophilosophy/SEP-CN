      在这幅图景中，论证是一种受规则支配的实践，而不是一场言语上的自由混战。哈贝马斯确认三个层次的规则。第一，有逻辑的基本规则，如矛盾原则，以及可普遍化和一致性的基本语义规则（1983 [1990: 86]）。第二，有程序性规范，如真诚原则和问责原则，即每个参与者必须承担——哪怕只是隐含地——只主张她真正相信的东西，并且总是要么在要求时为她所主张的东西提供证成，要么为不提供证成给出理由。哈贝马斯主张，这些是一切真正论证的前提条件，即把论证设想为“对真理的寻求”并组织得像“一场为更好的论据而进行的竞赛”的前提条件（1983 [1990: 87–8]）。第三，有使商谈免于强制、压制和不平等的过程性前提条件。这些规范被认为使商谈隔离开一切说服性力量，除了“更佳论据的无强制之力”；如果要达成理性促成的共识，就必须遵守它们。
