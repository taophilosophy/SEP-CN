      Needless to say, participants in the bourgeois public sphere were *de facto* almost all educated male property-owning members of the bourgeoisie, along with some sympathisers from the aristocracy. Habermas has acknowledged the selective membership of the bourgeois public sphere during its heyday (1992c: 425–430), although critics have charged that he does not pay sufficient attention to the way it was *constituted* by excluding propertyless workers (Negt & Kluge 1972 [2016])[^negt-1972] and, above all, women (Landes 1988)[^landes-1988]. Despite its limitations, Habermas argues that the bourgeois public sphere nevertheless embodied certain principles and ideals, never fully realized, that are vital to any flourishing democratic society. It was thus both an “ideal” and an “ideology” (1962 [1989: 112]). Since differences in social status between interlocutors were bracketed as “private” matters (1962 [1989: 36]) the public sphere was in theory universal, open to any literate person (1962 [1989: 37]). This ensured that rational argumentation was calibrated to universal standards of validity, not to the relative status of interlocutors, and could function as a cooperative search for truth and justice (1962 [1989: 54]).
    step1: |
      不必说，资产阶级公共领域的参与者 **事实上** 几乎全是受过教育的、拥有财产的资产阶级男性，此外还有一些贵族出身的人士同情他们。哈贝马斯承认，资产阶级公共领域在其鼎盛时期具有选择性的成员资格（1992c: 425–430）；不过，批评者指责他没有充分注意，这种公共领域正是通过排斥无产工人（Negt & Kluge 1972 [2016]）[^negt-1972]，尤其是排斥女性（Landes 1988）[^landes-1988]，才得以 **构成** 的。尽管有这些局限，哈贝马斯仍主张，资产阶级公共领域毕竟体现了某些从未完全实现的原则与理想，而这些原则与理想对于任何繁荣的民主社会都至关重要。因此，它既是“理想”，也是“意识形态”（1962 [1989: 112]）。由于对话者之间的社会地位差异被当作“私人的”事情而被括置起来（1962 [1989: 36]），公共领域在理论上具有普遍性，向任何识字者开放（1962 [1989: 37]）。这确保了理性论证以普遍的有效性标准为尺度，而不是以对话者的相对地位为尺度，并且能够作为一种合作性地寻求真理与正义的活动发挥作用（1962 [1989: 54]）。
