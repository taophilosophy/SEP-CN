      They are revealed not as timeless constants, but as they have developed over time, with their internal developmental logics (Pedersen 2008: 463, 474–9)[^pedersen-2008]. Habermas originally claimed that rational reconstruction uncovers knowledge of universal human capabilities, “species competences”, rather than the competences of particular groups or individuals (1976b [1998b: 34–5]; McCarthy 1991: 130–2)[^mccarthy-1991]. For example, rationally reconstructing the practice of everyday speech uncovers the rules of communicative action as such, not the grammar of a particular language. However, Habermas’s later description of the discourse theory of law and democracy as a rational reconstruction of “the self-understanding of modern legal orders” of democratic constitutional states (1992b [1996b: 82], emphasis removed), evidently a local phenomenon, suggests that he has since modified the scope of the reconstructive method. Commentators are dividend on this point, with some distinguishing between an “empirical” variety of reconstruction on display in the *Theory of Communicative Action*, and a “normative” variety in *Between Facts and Norms* (Peters 1994: 119)[^peters-1994], and others arguing that the same methodology underlies both projects (Patberg 2014: 511–3; however, see Gaus 2013: 561)[^gaus-2013][^patberg-2014]. This tension is partly resolved if we remember that democratic law-making draws on general communicative competencies, and makes use of pragmatic, ethical, and moral discourses. The phenomenon is local, but the capacities involved are general.
