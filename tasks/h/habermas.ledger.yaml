      第二，公民社会中的宗教公民与非宗教公民必须经历互补的学习过程，从而对自己的信念形成反思（2005b 第 5 章 [2008a: 111–2]）。对宗教信徒而言，这意味着接受现代社会的三个方面：合理的多元论、科学知识的优先性，以及国家的世俗性质（2001b 第 2 章 [2003b: 104]；2005b 第 5 章 [2008a: 137]；2012 第 7 章 [2017: 173]）。对非信徒而言，这意味着接受宗教在现代社会中的持续存在，把自己的信徒之分歧看作合理的，承认信徒有权以宗教语言为公共领域作贡献，愿意帮助把这些贡献翻译成世俗语言，并最终放弃科学主义以及受科学主义动机驱动的无神论，转而采取政治不可知论（2005b 第 4 章 [2008a: 113]；2005b 第 8 章 [2008a: 263–4]；2005b 第 10 章 [2008a: 309–10]；亦见 Baxter 2011: 205）[^baxter-2011]。
    step2: |
      第二，市民社会中的宗教公民与非宗教公民须经历互补的学习过程，学会反思自己的信念（2005b 第 5 章 [2008a: 111–2]）。对宗教信徒来说，这意味着接纳现代社会的三个方面：合理多元论、科学知识的优先地位、国家的世俗性质（2001b 第 2 章 [2003b: 104]；2005b 第 5 章 [2008a: 137]；2012 第 7 章 [2017: 173]）。对非信徒来说，则意味着：接受宗教在现代社会继续存在；把自己与信徒的分歧视为合理分歧；承认信徒有权以宗教语言参与公共领域；愿意帮助把这些贡献译成世俗语言；最后，放弃科学主义以及由科学主义驱动的无神论，转取政治不可知论（2005b 第 4 章 [2008a: 113]；2005b 第 8 章 [2008a: 263–4]；2005b 第 10 章 [2008a: 309–10]；亦见 Baxter 2011: 205）[^baxter-2011]。
