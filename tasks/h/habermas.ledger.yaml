      The term “constitutional patriotism” (*Verfassungspatriotismus*) was not coined by Habermas, but by the political scientist Dolf Sternberger, who popularized it in a 1979 article marking the thirtieth anniversary of the Federal Republic of Germany (Müller 2006)[^müller-2006]. Habermas took up the term and developed his own distinct interpretation of it beginning with the “historians” dispute’ of 1986. Constitutional patriotism is the theory that in modern states the constitution can, and should, take the place of the nation as focus of citizens’ feelings of collective identity and the source of their civic solidarity. While originally concerned with specifically post-war West German questions about history and national identity (1988a), and thus drawing on a rational reconstruction of the postnational form of identification developed in the divided Germany, Habermas later applied the theory to modern states more generally, and to the European Union in particular (1998c).
    step1: |
      “宪法爱国主义”（*Verfassungspatriotismus*）一词并非哈贝马斯首创，而是政治学家多尔夫·施特恩贝格尔（Dolf Sternberger）创造的；他在 1979 年纪念德意志联邦共和国成立三十周年的一篇文章中使这一说法流行开来（Müller 2006）[^müller-2006]。哈贝马斯接过这个词，并从 1986 年的“历史学家之争”开始，发展出他自己独特的解释。宪法爱国主义是这样一种理论：在现代国家中，宪法能够也应当取代民族，成为公民集体认同感的焦点与公民团结的来源。这一理论最初关注战后西德特有的历史与民族认同问题（1988a），因而依托对分裂德国中发展出的后民族认同形式的合理重构；后来，哈贝马斯把这一理论推广到一般现代国家，尤其是欧洲联盟（1998c）。
