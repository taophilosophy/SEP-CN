      Around the time of his move to Starnberg in 1971 Habermas initiated a complete overhaul of his theoretical framework for social theory, ultimately leading to the development of his mature communicative paradigm (McCarthy 1978)[^mccarthy-1978]. He also produced some seminal transitional works which dealt with the issues raised in the early work. *Legitimation Crisis* (1975), or to give the full original title, *Legitimationsprobleme im Spätkapitalismus* (1973), is a sketch of an incipient research programme that sets out from a critique of Marx’s social theory, which sees crises in capitalist societies as arising not from the immiseration of the working classes and class struggle, which have largely been pacified by the welfare state and economic growth, but from legitimation deficits due to alterations in the constellation of economics and politics. The problem posed by legitimation crises, which are specific to late capitalism, is how the increasing intervention of the state in economic affairs can be made legitimate to those who are affected by these state interventions, and hold the state responsible for their effects. In conclusion, Habermas develops some hypotheses about how such crises can be resolved. The best-case scenario is that legitimation takes place through discursive justification, on the basis of norms embodying generalizable interests, and, failing that, through various kinds of compromise (1973a [1975: 112–114]). On this model normative structures and ideals of consensus become the key vantage point through which societies can be understood and criticized by the social theorist.
    step1: |
      大约在 1971 年迁往施塔恩贝格前后，哈贝马斯开始彻底改造其社会理论的理论框架，最终发展出成熟的交往范式（McCarthy 1978）[^mccarthy-1978]。他还写出了一些开创性的过渡期著作，处理早期著作提出的问题。《合法性危机》（*Legitimation Crisis*，1975）——完整的原题是 *Legitimationsprobleme im Spätkapitalismus*（1973）——是一个初生研究纲领的草图。该纲领从对马克思社会理论的批判出发：它认为资本主义社会的危机并非源于工人阶级的贫困化与阶级斗争（这两者已因福利国家与经济增长而在很大程度上得到平息），而是源于经济与政治格局变动所造成的合法性赤字。合法性危机为晚期资本主义所特有，它提出的问题是：国家日益加强对经济事务的干预，如何能使受这些干预影响的人认可其合法性，并让国家对干预的后果负责。最后，哈贝马斯提出若干假说，说明这类危机可以如何解决。最好的情形是，以体现可普遍化利益的规范为基础，通过商谈加以证成而获得合法性；做不到这一点，则通过各种妥协（1973a [1975: 112–114]）。在这一模型中，规范结构与共识理想成为关键视角，社会理论家据此理解与批判社会。
    step2: |
      1971 年迁往施塔恩贝格前后，哈贝马斯着手彻底改造自己的社会理论框架，最终发展出成熟的交往范式（McCarthy 1978）[^mccarthy-1978]。这一时期他还写了几部开创性的过渡期著作，处理早期著作留下的问题。《合法性危机》（*Legitimation Crisis*，1975；原题全称 *Legitimationsprobleme im Spätkapitalismus*，1973）勾画了一个初生的研究纲领。纲领从批判马克思的社会理论出发：资本主义社会的危机，根源不在工人阶级的贫困化与阶级斗争——福利国家与经济增长已使二者大体平息——而在经济与政治格局变动所导致的合法性赤字。合法性危机是晚期资本主义特有的问题：国家日益干预经济事务，如何让受干预者认可这种干预的合法性，并让国家对干预后果负责？最后，哈贝马斯提出若干假说，说明这类危机如何化解。最理想的情形，是以体现可普遍化利益的规范为基础，通过商谈加以证成；若做不到，则依靠各种妥协（1973a [1975: 112–114]）。按这一模型，规范结构与共识理想成为关键视角，社会理论家由此理解和批判社会。
