      最后，商谈伦理连同《交往行为理论》中的现代性理论，受到了来自反殖民视角的批评。最持久和最详细的批评来自艾米·艾伦。她指出哈贝马斯对原则（D）和（U）的论证依赖于从现代化理论中引出的假设，并提出欧洲中心主义的指控。此外，在杜塞尔（1993）[^dussel-1993] 和班布拉（2011）[^bhambra-2011] 等人的批评的基础上，她论证说，哈贝马斯的商谈伦理与一种社会进化理论以及现代化作为学习过程的观念结合在一起，这使他承诺一种“进步的历史观”（Allen 2016: 72–3）[^allen-2016]。尽管他试图消解压在西方马克思主义身上的历史哲学预设，艾伦和杜塞尔论证说，哈贝马斯的理论满载着一种独断的黑格尔式普遍主义，归根结底断言欧洲现代性的发展优越性。
