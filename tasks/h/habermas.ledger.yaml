      This has led commentators to assume that the ideas of communicative action together with the theory that in modern society socialization takes place through communicative action provide Habermas with an account of normative foundations, of the kind he claimed was missing from earlier Frankfurt School theory. The trouble is that it is unclear to what extent this is a functionalist theory, supported by mainly empirical claims, or a normative one; and, if normative, in what sense. As Herbert Schnädelbach was among the first to point out, Habermas’s approach of rationally reconstructing the communicative infrastructure of modern societies does not obviously fit the bill here. Functionalist explanation is not normative justification (Schnädelbach 1986 [1991: 21])[^schnädelbach-1986]. This also applies to his reconstructed theory of reification (Jütten 2011)[^jütten-2011]. It is clear that Habermas’s is a normative theory, to the extent that if his diagnosis is correct, the “damage” done by colonization is not only social and structural, individuals too are harmed and suffer as a result of it, and their legitimate expectations are disappointed. This is the case whether or not they are “wronged”. The problem can be put as a dilemma. Either Habermas’s social theory is genuinely critical, in which case it judges that a colonized lifeworld is bad and ought to be changed (and such judgement requires substantive normative premises), or it stops short of such a judgement, and is hence not properly critical.
    step1: |
      这导致评论者假定，交往行为的观念连同“在现代社会中社会化通过交往行为发生”的理论，为哈贝马斯提供了一种规范性基础的说明，即他声称早期法兰克福学派理论所缺少的那种说明。麻烦在于，不清楚这在多大程度上是一种功能主义理论，主要由经验主张支持，还是一种规范理论；如果是规范的，又是在什么意义上。正如赫伯特·施耐德巴赫是最早指出这一点的人之一，哈贝马斯合理重构现代社会交往基础设施的方法在这里显然不符合要求。功能主义解释不是规范性证成（Schnädelbach 1986 [1991: 21]）[^schnädelbach-1986]。这也适用于他重构的物化理论（Jütten 2011）[^jütten-2011]。清楚的是，哈贝马斯的理论是一种规范理论，因为如果他的诊断正确，殖民化造成的“损害”就不仅是社会和结构上的，个人也因此受到伤害并受苦，他们的正当期望落空。无论他们是否“被冤枉”，情况都是如此。这个问题可以表述为一个两难。要么哈贝马斯的社会理论真正是批判的，在这种情况下它判断被殖民的生活世界是坏的、应当被改变（而这样的判断需要实质性的规范前提），要么它止步于这样的判断，因而并不真正具有批判性。
