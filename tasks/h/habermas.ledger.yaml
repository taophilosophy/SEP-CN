      Much depends on Habermas’s articulation and defence of the distinction between a dialogical and a monological ethics, and his argument for the superiority of the former, which he makes with vehemence and conviction both in his critical engagement with Lawrence Kohlberg and later in his debate with Rawls. Nonetheless, critics have argued that the putative distinction between dialogical and monological ethics is one without a difference, and have cast doubt on Habermas’s argument for the cognitive superiority of dialogical ethics. McMahon argues that (U) is ambiguous between two very different conceptions of dialogicality. Weak dialogicality consists in the concurrence of independent judgements about which norm would satisfy the interest of all concerned, that is put together in piecemeal fashion (McMahon 2000: 521)[^mcmahon-2000]. Strong dialogicality, by contrast, involves a collective, joint judgement by all affected. McMahon claims that Habermas, and Rehg (1991 & 1994), whose interpretation of (U) Habermas cites approvingly (1992b [1996b: 109]), endorse the strong conception. But the strong conception, which requires that each participant in discourse suspend judgement until all other have cast their vote, is, so to speak, incoherent. For one thing, it robs each participant of any reason to judge from their own perspective whether a norm is valid. For another, it renders deviation from a norm impossible, because as soon as an agent deviates from a norm, it is no longer valid, and cannot be criticized as mistaken (McMahon 2000: 529)[^mcmahon-2000].
