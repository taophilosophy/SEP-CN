      In the 1980s and 1990s a number of feminist critics, inspired by Carol Gilligan’s critique of Kohlberg, *In a Different Voice*, developed two significant lines of argument against Kantian moral theory and Rawlsian liberalism. The first was that the “liberal” conception of the moral self is formal, abstract, and gender-neutral. The second was that the moral self is a male self masquerading as neutral and universal. The suggestion is that morality/moral theory is complicit with discrimination against women and patriarchal oppression. They aimed a similar criticism at Kantian, Rawlsian, and Kohlbergian conceptions of “the moral standpoint” (Benhabib & Cornell [eds] 1987a; Benhabib 1992; Meehan [ed.] 1995)[^benhabib-1992]. Among these feminist critics, some, e.g., Benhabib and Meehan, were initially supportive of discourse ethics because of its emphasis on including other voices, and its insistence its ideals must be won from the reconstruction of actual practices of real agents. Later, their arguments were recalibrated and turned against discourse ethics. Because the moral self is conceived as formal and abstract, and because the moral point of view is characterized by the formal criteria of universalizability and reversibility, Habermas’s discourse ethics cannot accommodate the kind of moral experiences that, Gilligan maintains, are characteristic of women: it is blind to the importance of considerations of care and responsibility for others. This leads Benhabib claims to a privatisation, personalisation, and devaluation of women’s moral experiences (Benhabib & Cornell 1987a: 7–9; Benhabib 1992: 152, 184)[^benhabib-1992]. She argues further that “the restriction of the moral domain to questions of justice” results in “the privatization of women’s experience and leads to epistemological blindness towards the concrete other” (Benhabib 1992: 164)[^benhabib-1992]. There is some doubt whether Benhabib’s position amounts to a refutation of Habermas’s theory or an explication of it. The universalization procedure imposed by discourse involves participants in moral discourse imaginatively switching perspectives with concrete other people. If it were not so, if “ideal role taking” demanded only that one examined candidate norms from the perspective of others generally conceived, there would be nothing to gain from such a procedure (Finlayson 2013a)[^finlayson-2013a]. It is also unclear, whether such criticisms apply to Habermas’s moral theory, or to the actually existing Kohlbergian “Stage 6” morality he takes as its object. Second, it is unclear whether the criticism shows merely that discourse ethics is a flawed moral theory, or whether it shows that, by dint of these flaws, the theory (or the morality it theorizes) perpetuates discrimination or oppression against women.
