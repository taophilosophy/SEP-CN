      主要是哈贝马斯引入的一种实践理性的三分类型学——实践理性的伦理运用、道德运用和实用运用——推动了他在《在事实与规范之间》中向康德的回归。特别是，哈贝马斯引入了一种伦理商谈的概念，它不同于道德商谈，因为它处理诸如“（对我，或对我们）什么是好生活？”这样的临床式问题，并且其范围限于具有共享价值的共同体。他主张，伦理商谈不同于道德商谈，后者处理正义问题，正义被理解为对所有人同等有利的东西（1983 [1990: 180]; 1991a 第 5 章, 101–105 [1993: 第 1 章, 3–8]; 1996a essay 1: 39–40 [1998a: 26–7]）。他把“正义”不是理解为一种政治价值，像晚期罗尔斯那样，而是理解为最高的道德价值，以及道德商谈的指定价值，类比于真理对于理论商谈。虽然他允许许多问题可以由伦理商谈和道德商谈共同处理，他在两者之间划出鲜明区分，并赋予道德相对于伦理的优先性（1983 [1990: 104]; 1991a 第 5 章, 100–119 [1993: 第 1 章, 1–17]）。伦理商谈总是在道德可允许性的界限内进行，而在哈贝马斯的说明中，任何道德规范都不能被任何伦理价值所权衡或压倒。与多位共同体主义者一道，查尔斯·泰勒和马丁·泽尔都在这一点上批评哈贝马斯，并捍卫善（尽管以不同方式理解）优先于道德上正当这一观念（Taylor 1989 [1992]; Seel 1995）[^seel-1995][^taylor-1989]。
