      Habermas develops the following theses that exhibit the major concerns of his early work, based on the following diagnosis: Capitalist societies institutionalize the aim of economic growth, which has the effect of expanding sub-systems of instrumental reason. In that context, science and technology cease to be connected to a realm of values that help people answer practical questions of how they want to live, and become absorbed instead into the economic and administrative systems as forces of production geared to the aim of continuous economic growth. Politics, instead of residing in a popular practice of democratic self-determination, atrophies to the technocratic administration of public affairs in the hands of small groups of experts, leading to a depoliticization of ordinary citizens (Celikates & Jaeggi 2009 [2017: 261])[^celikates-2009]. The question is who can reconnect technocratic politics with the “good life”. Habermas’s answer is that students may be part of the solution, since their protests do not aim at securing them “a larger share of social rewards”, but are targeted against the reduction of social and political life to economic growth and individual gain (1970: chapter 6, 120–122).
    step1: |
      哈贝马斯提出以下命题，以呈现其早期著作的主要关切，其依据是如下诊断：资本主义社会把经济增长的目标制度化，其后果是工具理性的诸子系统不断扩张。在这种语境中，科学与技术不再与一个价值领域相联系——那个领域帮助人们回答他们想如何生活的实践问题——而是作为生产力被吸收进经济系统与行政系统，服务于持续经济增长的目标。政治不再存在于民主自决的民众实践之中，而是萎缩为少数专家集团手中对公共事务的技术官僚式管理，导致普通公民的去政治化（Celikates & Jaeggi 2009 [2017: 261]）[^celikates-2009]。问题在于，谁能使技术官僚政治重新与“好的生活”相衔接。哈贝马斯的回答是，学生可能成为解决方案的一部分，因为他们的抗议并不旨在为自己争取“更大份额的社会报酬”，而是针对把社会与政治生活化约为经济增长与个人利益的做法（1970：第 6 章，120–122）。
