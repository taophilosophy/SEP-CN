      商谈不是语言或言语的同义词。只有明确朝向达成理性促成的共识的言语才算是商谈（1981 [1984a: 42]）。换句话说，商谈就是交往，因为哈贝马斯规定，交往恰恰是朝向达成理解的言语。但商谈是一种特殊类型的交往。当交往崩溃，通常协调互动的日常共享意义和理解被打乱时，对话者不得不从行动转向商谈。商谈是“一种以同意为取向的反思性行动形式，它……位于后者的上层”（1986a [1990b: 245–6]）。商谈是更高一阶的交往，目的是更新或替换一个成问题的共识。参与商谈就是提供理由，目的是说服所有对话者接受一个有争议的有效性主张。所以，在哈贝马斯看来，商谈就是论证的语言游戏，其中有争议的有效性主张被“兑现”，而当一种有效性主张被成功兑现时，被打断的共识就得到恢复、更新，或被一个新的共识所取代。
