      后形而上学思想是哈贝马斯为现代哲学提出的范式，必须通过与它的前身——形而上学——相对照来理解。他把西方哲学史的很大一部分标注为“形而上学”，把巴门尼德、柏拉图、普罗提诺、奥古斯丁、阿奎那、斯宾诺莎、莱布尼茨与黑格尔都算作形而上学思想家（1988b 第 2 篇 [1992a: 12–13]；1988b 第 3 篇 [1992a: 29]）。他有时区分严格意义上的形而上学与“意识哲学”或“主体哲学”，后者与笛卡尔的理性主义和康德、费希特、谢林的唯心论相关联（1988b 第 3 篇 [1992a: 31]；1988b 第 8 篇 [1992a: 158–62]）；不过，这究竟应算作一个独立范式（1988b 第 2 篇 [1992a: 12–13]），还是仅仅是形而上学的一个晚期阶段，并不清楚。
