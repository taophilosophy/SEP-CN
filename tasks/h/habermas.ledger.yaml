      Whether Habermas holds that agents’ actions in economic and bureaucratic domains are merely constrained by system imperatives of the relevant steering media, or reduced to instrumental and strategic actions is moot (Jütten 2013)[^jütten-2013]. But it is empirically false for reasons given by Honneth and Joas and others that the mediatization of a domain of social life would force agents to adopt only one type of action. As Joas puts it, every sphere of action contains “a wealth of different types of action” (Joas 1986 [1991: 104])[^joas-1986]. Systems, economic and bureaucratic, and the specific organisations they comprise, all involve numerous different kinds of action. This is not only an empirical claim but a conceptual one that follows from Habermas’s own theory that instrumental and strategic action is parasitic on communicative action. Habermas has also been criticized for being seduced by systems theory into merely accepting spheres of norm free sociality, and the uncoupling of system and lifeworld as a normal result of modernization and social differentiation (McCarthy 1991)[^mccarthy-1991].
    step1: |
      哈贝马斯究竟认为经济领域与官僚领域中的行动者行动只是受到相关导控媒介的系统律令约束，还是认为它们被还原为工具性行动与策略性行动，尚无定论（Jütten 2013）[^jütten-2013]。但霍耐特、约阿斯等人给出的理由表明，如下说法在经验上是错误的：某一社会生活领域的媒介化会迫使行动者只采纳一种行动类型。正如约阿斯所说，每一个行动领域都包含“种类繁多、各不相同的行动”（Joas 1986 [1991: 104]）[^joas-1986]。系统——经济的与官僚的——以及它们所包含的具体组织，都涉及众多不同种类的行动。这不仅是一个经验主张，也是一个概念主张，它源于哈贝马斯自己的理论：工具性行动与策略性行动寄生于交往行为。哈贝马斯还因被系统理论所诱、仅仅接受无规范的社会性领域以及系统与生活世界的脱钩作为现代化与社会分化的正常结果而受到批评（McCarthy 1991）[^mccarthy-1991]。
