      At the time, Marxists criticized Habermas’s work both for abandoning central tenets of Marxism and for conceding too much to Niklas Luhmann’s system’s theory (Ebbighausen 1976)[^ebbighausen-1976]. That said, Habermas denies Luhmann’s central claim that legitimacy is nothing but the motiveless acquiescence of citizens to the binding decisions of an administrative mechanism (Luhmann 1969)[^luhmann-1969]. As for Habermas’s Marxism, the very focus of his transitional work on the system crises of capitalist society betrays not only the theoretical aspiration to understand capitalism, but also the practical aspiration to overcome it, or at least to understand how it could be overcome. That said, since the theory of legitimation crisis, as McCarthy noted, is not addressed to any agent of social transformation, it must ultimately remain content with diagnosing crisis tendencies (McCarthy 1978)[^mccarthy-1978].
    step1: |
      当时，马克思主义者批评哈贝马斯，既指责他放弃马克思主义的核心信条，又指责他对尼克拉斯·卢曼（Niklas Luhmann）的系统理论让步过多（Ebbighausen 1976）[^ebbighausen-1976]。尽管如此，哈贝马斯否认卢曼的核心主张，即合法性无非是公民对行政机制具有约束力的决定的无动机默从（Luhmann 1969）[^luhmann-1969]。至于哈贝马斯的马克思主义，其过渡期著作恰恰聚焦于资本主义社会的系统危机，这既暴露出理解资本主义的理论诉求，也暴露出克服资本主义的实践诉求——或至少是理解它如何能够被克服的诉求。不过，正如麦卡锡（McCarthy）所指出的，合法性危机理论并未面向任何社会变革的行动者，因此它最终只能满足于诊断危机倾向（McCarthy 1978）[^mccarthy-1978]。
