      The second criticism is that supposedly constitutional-patriotic identity is, in reality, the thick identity of the dominant majority culture, albeit disguised (Laborde 2002: 593–9)[^laborde-2002]. Habermas’s argument that constitutional principles are interpreted in the light of particular histories plays into this criticism. If a particular country’s constitutional patriotism is so closely bound up with its ethical-political self-understanding, then the language, culture, beliefs, and values of that country’s majority culture will make a deep impression on it. Constitutional patriotism consequently collapses into civic nationalism. At the same time, Habermas’s claim that the connection between national identity and constitutional democracy is merely contingent holds open the possibility that, even if they have overlapped in the past and the present, an ongoing learning process may lead to the two being fully decoupled in the future (1998c [2001a: 101–2]). A further question, articulated by Andrea Baumeister among others, is whether the liberal-democratic values which are to be interpreted in the light of national histories are, in fact, as widely accepted as Habermas believes (Baumeister 2007: 491–5)[^baumeister-2007]. If not, constitutional patriotism may be more particularistic and Eurocentric than it at first appears, raising questions about how those who do not adhere to such values are to be integrated into constitutional-patriotic polities.
    step1: |
      第二种批评是：被假定的宪法爱国主义认同，实际上是占主导地位的多数文化的厚认同，尽管是被伪装起来的（Laborde 2002: 593–9）[^laborde-2002]。哈贝马斯关于宪法原则要依据特定历史来解释的论证，正好为这一批评提供了把柄。如果某一国家的宪法爱国主义如此紧密地与其伦理—政治的自我理解捆绑在一起，那么该国多数文化的语言、文化、信念与价值就会在它身上留下深刻印记。宪法爱国主义因此坍缩为公民民族主义。与此同时，哈贝马斯关于民族认同与宪政民主之间的联系只是偶然的主张，保留了一种可能性：即便两者在过去与现在有所重叠，一个持续进行的学习过程也可能导致两者在未来完全脱钩（1998c [2001a: 101–2]）。Andrea Baumeister 等人提出的一个进一步问题是：那些要依据民族历史来解释的自由民主价值，事实上是否像哈贝马斯所相信的那样被广泛接受（Baumeister 2007: 491–5）[^baumeister-2007]。如果不是，宪法爱国主义可能比它初看起来更具特殊主义色彩、更欧洲中心，这引出如下问题：那些不坚持此类价值的人如何被整合进宪法爱国主义的政治体。
