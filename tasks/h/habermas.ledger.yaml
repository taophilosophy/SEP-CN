      Finally, discourse ethics together with the theory of modernity in *Theory of Communicative Action* has been criticized from an anti-colonial perspective. The most sustained and detailed criticism comes from Amy Allen. Noting that Habermas’s argument for principles (D) and (U) rests on assumptions drawn from modernization theory, she brings the charge of Eurocentrism. Furthermore, building on criticisms by Dussel (1993)[^dussel-1993] and Bhambra (2011)[^bhambra-2011] among others, she argues that Habermas’s discourse ethics is wedded to a theory of social evolution and the idea of modernization as a learning process, which commits him to a “progressive view of history” (Allen 2016: 72–3)[^allen-2016]. In spite of his attempt to deflate the presuppositions of the philosophy of history that weighed on Western Marxism, Allen and Dussel argue that Habermas’s theory is freighted with a dogmatic Hegelian universalism that in the final analysis asserts the developmental superiority of European modernity.
