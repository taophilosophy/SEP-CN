      哈贝马斯于 1929 年 6 月出生，在北莱茵-威斯特法伦的乡间由一个保守的、受过教育的中产阶级家庭抚养长大；这个家庭对纳粹政权既不批评，也不强烈支持。1944 年，他被征召去西线守卫防御。一年多以后，他从纽伦堡审判和关于大屠杀的新闻报道中得知纳粹暴行，内心受到极大震动。因此，尽管他仍处于青少年时期，他却把 1945 年视为一个转折点，这个转折点将塑造他的政治和文化视野。正如他在 1979 年的一次访谈中坦率地说：
