      Critics of constitutional patriotism argue that it is either too “thin” to play the role Habermas assigns to it, or too “thick” to really be postnational and open to all, as he claims (Hayward 2007: 186–9)[^hayward-2007]. The first criticism is that the universal moral principles encoded in constitutions are too abstract and affectively thin to generate a sense of personal loyalty and collective belonging among citizens, compared to the thick bonds of national identity (1996a essay 5 [1998a: 132]; Canovan 2000)[^canovan-2000]. Habermas rejects this criticism. Citizens interpret the principles found in their constitution—which represent universal moral and political norms of democracy and human rights, and might be found in any liberal-democratic constitution—*in the light of their community’s unique historical experience*. They internalize these principles, not abstractly, but in the context of the history of their country (1996a essay 8 [1998a: 225–6]). Constitutional principles become part of the “dense web” of a society’s (and an individual’s) historical experiences and pre-political values (2004 chapter 6 [2006c: 77–8]). It follows that each country’s constitutional patriotism will be different, inflected by the particular past that country has worked through—Habermas notes that French constitutional patriotism, marked by a tradition of revolutionary democracy, will be different to German constitutional patriotism, marked by the historical failure to produce a working democracy (1992h: 240–1). Far from being an abstract, bloodless construct as critics have alleged, Habermas sees constitutional patriotism as intimately connected to each community’s particular history and culture, and to its concerns about identity and the common good—its ethical-political self-understanding.
