      第二根支柱是言语行为理论。言语行为理论把说话理解为行动，或者用奥斯汀的话说，是用词语“做事”；因此它很适合为一种统一的意义与行动理论提供基础。按这种理论，一次说话既有命题内容 *p*，又有以言行事力量 *M*。所以，一句 *Mp*——例如“冰很薄”——的意义，既可以是对世界状况的陈述，也可以视语境而定是一句警告。
