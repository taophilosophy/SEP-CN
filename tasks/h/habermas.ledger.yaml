      A central contention of *Between Facts and Norms* is that what Habermas calls the principle of democracy “derives” from the interpenetration of principle (D) and the legal form (1992b [1996b: 122–3]). Recall that in phase two principle (D) is supposed to be a rule of practical argumentation in general that is neutral with respect to morality and law (1992b [1996b: 107]). In this respect, Habermas claims, as in respect of the circular process of reciprocal co-original constitution, the principle of democracy is “morally freestanding” (1992b [1996b: 80]). That is, the principle of democracy is derived completely independently of the moral principle (Finlayson 2019: 94)[^finlayson-2019]. Here again Habermas insists on the autonomy of the democratic political process, and claims that the democratic procedure of the production of law is the sole source of its legitimacy, and he criticizes the views of Rawls, Dworkin, Larmore, and Apel, all of whom, in various different ways, claim that the legitimacy (or validity) of law is borrowed from that of morality.
