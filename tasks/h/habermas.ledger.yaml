      《在事实与规范之间》是一种法律与政治理论，聚焦于宪政民主产生并使民主地合法的法律得以制度化的各种方式。当哈贝马斯在 80 年代末和 90 年代初写作和研究这本书时，政治理论正被罗尔斯式或康德式自由主义与共同体主义（或按哈贝马斯更愿意的说法，新亚里士多德主义）之间的争论所支配。在《在事实与规范之间》中，他试图在这两种对立的政治理论进路之间进行调解。他做到这一点的方式，是提出并捍卫自由主义权利与人民主权的同等原初性（或同源性）这一论题，以及它们相应的个人自主与集体自主这两种价值。
