      Joshua Cohen objects that the principle of discourse does not amount to a requirement of equal liberty, and that nothing so rich as Habermas’s scheme of individual liberties follows solely from the application of the discourse principle to the legal form (Cohen 1999: 393, 398)[^cohen-1999]. He objects even while acknowledging that the various rights are not yet saturated: they are not yet specific, historically and socially determinate rights. But contra Cohen, on Habermas’s account, legal form, or modern “form of law” is a richer idea than the mere rule of law, and refers to a complex of features that law has in a modern constitutional democratic state. As Baynes and Zurn point out, Habermas’s theory reconstructs the way that, via the discourse principle, the form of law in modern—that is, post-traditional and post-conventional—societies functions to compensate for the loss of shared traditions, and relieves the burden on citizens to reach reasoned agreement with one another and thereby coordinate their actions (Baynes 2016: 166: Zurn 2011)[^baynes-2016][^zurn-2011].
