      Habermas presents his colonization thesis as a reformulation of the Lukácsian idea of reification that was so influential on the first generation of Frankfurt School critical theorists, especially Adorno (1981 [1984a: 399]; 1981 [1987: 1]). Lukács argues that the commodification of all domains of modern society, and consciousness thereof, has led to its “taking on the character of a thing”, hence the economy and bureaucracy and the legal system appear to subjects as a “second nature” (Lukács 1971: 83, 86)[^lukács-1971]. Consequently they adopt a passive attitude towards it, in theory as contemplation, in practice as adaptation. This results not only in an illusion, but also in a kind of inaction, since people see and treat things as natural, and so not up to them, and not alterable, when such things are in fact historical and in principle reversible, and up to them. That idea needs reformulating, Habermas maintains, because it mistakenly conflates rationalization and social differentiation with reification. Lukács, for example, thinks of rationalization as the destruction of social totality, namely the substantial ethical life of a community, as an unqualified bad, whereas Habermas sees it as having upsides and downsides.
    step1: |
      哈贝马斯把殖民化论题呈现为对卢卡奇物化观念的重新表述，这一观念对第一代法兰克福学派批判理论家影响很大，尤其是阿多诺（1981 [1984a: 399]; 1981 [1987: 1]）。卢卡奇论证说，现代社会所有领域及其意识的商品化，导致它“取得物的性质”，因此经济、官僚机构和法律系统对主体显现为“第二自然”（Lukács 1971: 83, 86）[^lukács-1971]。结果他们采取一种被动的态度：理论上作为沉思，实践上作为适应。这不仅造成一种幻象，而且造成一种不作为，因为人们把事物看作自然的，并当作自然的来处理，因此以为不取决于他们，也不可改变，而这些事物实际上是历史的，原则上可逆的，并且取决于他们。哈贝马斯主张，那个观念需要重新表述，因为它错误地把合理化和社会分化同物化混为一谈。例如，卢卡奇把合理化看作对社会总体性的摧毁，即对共同体实体性伦理生活的摧毁，看作无条件的坏事，而哈贝马斯认为它有利也有弊。
