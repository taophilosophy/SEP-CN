      Habermas’s analysis takes its cue from Lukács’ idea of reification—the idea that beings, forms of life, and social relations assume the appearance of nature (Lukács 1971: 83–223)[^lukács-1971]. Habermas’s analysis reveals this illusory independence and naturalness to be historical, and in principle reversible. Horkheimer and Adorno’s thesis that: “All reification is a forgetting” also animates the analysis (Horkheimer & Adorno 1971 [2002: 191])[^horkheimer-1971]. Positivism in the empirical and social sciences, and historicism in the cultural sciences, Habermas argues, exhibit a merely contemplative stance toward their respective objects, an attitude that obscures the point that science and knowledge is fundamentally a human enterprise that serves human interests, which are rooted in the natural history of the species (1968b [1971a: 301–4]).
    step1: |
      哈贝马斯的分析以卢卡奇（Lukács）的物化观念为出发点——这一观念是说，存在物、生活方式与社会关系呈现出自然的样貌（Lukács 1971: 83–223）[^lukács-1971]。哈贝马斯的分析揭示出，这种虚假的独立性与自然性属于历史，原则上可以逆转。霍克海默与阿多诺的命题——“一切物化都是遗忘”——同样推动着这一分析（Horkheimer & Adorno 1971 [2002: 191]）[^horkheimer-1971]。哈贝马斯主张，经验科学与社会科学中的实证主义，以及文化科学中的历史主义，对各自的对象都采取一种纯粹静观的态度；这种态度掩盖了一点：科学与知识根本上是服务于人类利益的人类事业，而这些利益植根于物种的自然史（1968b [1971a: 301–4]）。
    step2: |
      哈贝马斯的分析从卢卡奇（Lukács）的物化观念出发。所谓物化，是说存在物、生活方式与社会关系都呈现出自然的样貌（Lukács 1971: 83–223）[^lukács-1971]。哈贝马斯借此揭示：这种虚假的独立与自然其实是历史的产物，原则上可以逆转。霍克海默与阿多诺“一切物化都是遗忘”的命题，同样为这一分析提供了动力（Horkheimer & Adorno 1971 [2002: 191]）[^horkheimer-1971]。在哈贝马斯看来，经验科学与社会科学中的实证主义、文化科学中的历史主义，对各自对象都只取一种静观态度；这种态度掩盖了科学与知识的人类事业性质：它服务于植根于物种自然史的人类利益（1968b [1971a: 301–4]）。
