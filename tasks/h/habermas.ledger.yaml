      This division of labour has drawn criticism, with Cristina Lafont arguing that the relegation of all socioeconomic issues to the transnational layer ensures that human rights violations stemming from global inequality cannot be addressed (Lafont 2008)[^lafont-2008]. Habermas’s suggestion that the “slender but robust” cross-cultural consensus on basic human rights is enough to legitimate the supranational level’s policies (2004 chapter 8 [2006c: 143]; 2005b chapter 11 [2008a: 343–4]) has also been criticized. There is room for doubt on this point, especially with regard to contentious cases such as LGBT rights (1998d [2001a: 113–129]; Scheuerman 2008: 143–5)[^scheuerman-2008].
