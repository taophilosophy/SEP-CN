      In *Legitimation Crisis* Habermas had explored the idea that critical social theory could find its *point d’appui* in “suppressed generalizable interests”, namely the unrealized rational potentials of modern society (1973a [1975: 111]). As we saw, and Habermas himself admits, he did not develop this approach in *Theory of Communicative Action*. He claimed that critical theory must refrain from “critically evaluating … forms of life and cultures … as a whole” and focused instead on investigating the way in which communicative pathologies arising from the colonization of the lifeworld hinder “learning potentials” (1981 [1984a: 383]). Critics such as Schnädelbach and Taylor countered that such an approach would only *explicate* critical or rational potentials, but never *justify* normative criticisms of society (Schnädelbach 1986 [1991]; Taylor 1986 [1991])[^schnädelbach-1986][^taylor-1986]. Recall that (U) is a moral principle that is supposed to validate norms containing generalizable interests. Some of Habermas’s supporters in the 1980s, for example, Honneth and Benhabib, argued that discourse ethics could serve as the account of the normative foundations that Habermas argued first generation critical theory was missing (Honneth 1985 [1991: 286]; Benhabib 1986: 279–81)[^benhabib-1986][^honneth-1985].
    step1: |
      在《合法性危机》中，哈贝马斯曾经探讨过这样一种想法：批判社会理论可以在“被压制的可普遍化利益”中找到它的 *point d’appui*，即现代社会中尚未实现的理性潜能（1973a [1975: 111]）。正如我们所见，而且哈贝马斯本人也承认，他在《交往行为理论》中没有发展这一进路。他声称，批判理论必须避免“批判地评价……作为整体的……生活方式和文化”，转而集中考察由生活世界殖民化产生的交往病理阻碍“学习潜能”的方式（1981 [1984a: 383]）。施耐德巴赫和泰勒等批评者反驳说，这样一种进路只会 **阐明** 批判的或理性的潜能，但从不 **证成** 对社会的规范性批评（Schnädelbach 1986 [1991]; Taylor 1986 [1991]）[^schnädelbach-1986][^taylor-1986]。回想一下，（U）是一条道德原则，本应验证包含可普遍化利益的规范。哈贝马斯在 20 世纪 80 年代的一些支持者，例如霍耐特和本哈比布，论证说商谈伦理可以充当哈贝马斯所说的第一代批判理论所缺失的规范性基础的说明（Honneth 1985 [1991: 286]; Benhabib 1986: 279–81）[^benhabib-1986][^honneth-1985]。
