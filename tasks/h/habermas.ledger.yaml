      与《交往行为理论》不同，不存在一部单一的著作，在其中哈贝马斯的商谈伦理得到确定的和权威的陈述。相反，它是一个不断演化的研究纲领，呈现于一系列论文中，其中大部分收录在两卷英文版文集中，即 *Moral Consciousness and Communicative Action*（1990a）和 *Justification and Application*（1993）。哈贝马斯商谈伦理的发展分为两个阶段，大致是 1983—1990 年和 1991—1996 年。大体上说，*Moral Consciousness and Communicative Action* 中的论文构成第一阶段，而从 *Justification and Application* 到 *Between Facts and Norms* 的论文构成第二阶段。我们将把第一阶段发展的理论称为“商谈伦理”，把第二阶段的理论称为“商谈道德”。因为在 20 世纪 90 年代初，哈贝马斯引入了一种区分，即道德作为关于正当性的规范理论，与伦理作为关于善的理论的区分；他后来自己指出，有鉴于此，为了准确，他本应把自己的理论改名为“道德商谈理论”（1993: 1; 1991: 7）。
