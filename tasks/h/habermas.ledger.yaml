      乔舒亚·科恩（Joshua Cohen）反对说，话语原则并不构成一项平等自由的要求，而且没有什么像哈贝马斯个人自由方案那样丰富的东西，仅仅从话语原则对法律形式的运用中就能推出（Cohen 1999: 393, 398）[^cohen-1999]。他在提出反对的同时也承认，各种权利尚未饱和：它们还不是具体的、在历史与社会上确定的权利。但与科恩相反，在哈贝马斯的说明中，法律形式，或现代“法律的形式”，是一个比单纯的法治更丰富的观念，指的是法律在现代宪政民主国家中所具有的一组复杂特征。正如 Baynes 与 Zurn 所指出的，哈贝马斯的理论重构了如下方式：在现代，也就是后传统与后习俗社会中，法律形式经由话语原则发挥补偿共享传统之丧失的作用，并减轻公民彼此达成有理由的同意、从而协调其行动的负担（Baynes 2016: 166; Zurn 2011）[^baynes-2016][^zurn-2011]。
