      Habermas has, since phase two of discourse ethics in the 1990s, considered religious traditions in modern societies to be fruitful sources of ethical values (1983 [1990]; 2001b chapter 1 [2003b]). Since postmetaphysical philosophy refrains from proposing concrete visions of the good, modern subjects must “appropriate” or “translate” insights from religion (alongside art and literature) to use as inputs in their ethical-existential and ethical-political discourses. Maeve Cooke suggests that this process of ethical appropriation involves re-presenting the semantic contents of ethical insights, shorn of their religious, literary, and artistic contexts, such that their exemplary force in disclosing visions of the good remains intact and can be used in secular ethical discourses (Cooke 2011)[^cooke-2011].
