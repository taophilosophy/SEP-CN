      梅芙·库克论证说，哈贝马斯的理论隐含地包含一个“乌托邦承诺”，即一个合理化的生活世界，“通过主体间评价有效性主张的过程”而再生产（Cooke 1994: 162）[^cooke-1994]，因此实质性的伦理理由为它的规范性主张奠定了基础。其他评论者，如霍耐特，假定商谈伦理提供了它的规范性基础的说明，而按照哈贝马斯的说法，早期批判理论正需要这样的说明（Honneth 1985 [1991: 282]）[^honneth-1985]。然而，这种看法有许多问题。其一是，批判理论的规范性主张需要的是**实质性**道德理由，而不是对这些理由的**说明**（Finlayson 2013a）[^finlayson-2013a]，而且正如施耐德巴赫所指出的，不清楚哈贝马斯把交往合理重构为商谈是否能提供这样的理由。
