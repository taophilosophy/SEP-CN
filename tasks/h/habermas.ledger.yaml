      This strongly suggests, as Heath argues, that there may after all be only one validity claim that is “meaning-critical”, or “internal” in the sense that it is constitutive of the meaning of utterances, namely the validity claim to the truth of assertions or of the propositional components of other kinds of speech-act (Heath 2001: 115–6)[^heath-2001]. It is potentially damaging for Habermas also for another reason. It shows that to understand an utterance that makes a rightness claim one need not know how the utterance or claim is justified. Understanding an utterance need not involve accepting reasons for action. Recall that Habermas insists that the illocutionary aim of the speaker is not only to be **understood**, in the sense that addressees recognize the *sense* of her utterance, but **agreed with**, in the sense that they also **accept** the relevant reasons that the speaker could adduce in support of their utterance. In the case of utterances that make rightness claims these are reasons to act or behave in certain ways. Habermas must establish the latter, because his whole theory depends on the claim that the normative commitments unavoidably generated in speech reach over into the subsequent action sequence (1981 [1984a: 302–3]).
    step1: |
      正如希思所论证的，这强烈暗示：归根结底也许只有一种有效性主张是“意义攸关的”，或在“内在的”意义上是言语行为意义的构成要素，即对断言之真、或其他类型言语行为命题成分之真的有效性主张（Heath 2001: 115–6）[^heath-2001]。这对哈贝马斯还可能造成另一重损害。它表明，要理解一个提出正当性主张的话语，人们不必知道该话语或主张如何得到证成。理解一个话语不必涉及接受行动理由。回想一下，哈贝马斯坚持认为，说者的以言行事目的不仅是要 **被理解**——即受话人认识到她话语的 **含义**——而且是要 **被同意**，即受话人也 **接受** 说者可能举出的、支持其话语的相关理由。就提出正当性主张的话语而言，这些理由就是按某些方式行动或行事的理由。哈贝马斯必须确立后一点，因为他的整个理论都依赖于这一主张：言语中不可避免地产生的规范性承诺，会延伸进后续的行动序列（1981 [1984a: 302–3]）。
