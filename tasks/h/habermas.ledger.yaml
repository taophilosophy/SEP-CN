      The trouble is that Habermas’s social theory does not set out to criticize society in virtue of its degree of conformity to principle (U) or to any substantive moral principle. Habermas continues to deny that this is the proper approach of social theory. He explicitly rebukes Rawls for thinking that the theorist can criticize society by first designing “the basic norms of a well-ordered society on the drafting table” and then checking society against it (1990d [1994: 101]; 1996a essay 3: 122 [1998a: 97]). That approach arrogates the task of criticism to the philosopher, instead of social agents and citizens. Besides which, the problem, as Schnädelbach understands it, is that social criticism proper requires normative judgements, which must be supported by normative reasons, while discourse ethics limits itself to the clarification of the moral point of view, and (U) is a procedural principle that leaves such judgements up to participants in discourse, and cannot furnish the requisite reasons (Finlayson 2013b)[^finlayson-2013b].
    step1: |
      麻烦在于，哈贝马斯的社会理论并不打算根据社会符合原则（U）或任何实质性道德原则的程度来批评社会。哈贝马斯继续否认这是社会理论的恰当方法。他明确斥责罗尔斯，因为罗尔斯认为理论家可以通过首先“在绘图桌上设计秩序良好社会的基本规范”然后对照它检查社会来批评社会（1990d [1994: 101]; 1996a essay 3: 122 [1998a: 97]）。那种方法把批评的任务僭取给哲学家，而不是社会行动者和公民。除此之外，按照施耐德巴赫的理解，问题在于，真正的社会批评需要规范性判断，这些判断必须由规范性理由来支持，而商谈伦理局限于对道德观点的澄清，并且（U）是一条程序性原则，把这种判断留给商谈的参与者，不能提供必要的理由（Finlayson 2013b）[^finlayson-2013b]。
