      这三根支柱构成了哈贝马斯所谓“形式语用学”或语用意义理论的基础，其基本观念是：“当我们知道是什么使一个言语行为可被接受时，我们就理解了这个言语行为”（1984a: 297，以下简作 TCAI）。也就是说，听者要理解说者的意思，就必须能够获得说者作出该话语的理由。
