      When Habermas first introduced the idea of the system he was engaging with Luhmann’s work and thinking mainly of cybernetic systems (1976a [1979: 170]; 1973a [1975: 130–142]). A good example of a cybernetic system is a heater linked to a thermostat, where each serves as input and output. If the heat rises beyond a fixed temperature, say 20 Celsius, the thermostat switches the heater off, and if it drops below that temperature the thermostat switches the heater on again (Heath 2011: 83–84)[^heath-2011]. The result (or goal-state to use the slightly misleading technical term) is to keep the room at an even ambient temperature.
