      Maeve Cooke argues that Habermas’s theory contains implicitly a “utopian promise” of a rationalized lifeworld, that is “reproduced through processes of intersubjective evaluation of validity claims” (Cooke 1994: 162)[^cooke-1994], so that substantial ethical reasons ground its normative claims. Other commentators, such as Honneth, assume that discourse ethics provides the account of its normative foundations that, according to Habermas, earlier critical theory stood in need of (Honneth 1985 [1991: 282])[^honneth-1985]. However, there are numerous problems with this view. One is that the normative claims of critical theory stand in need of *substantive* moral reasons, rather than *accounts of* those reasons (Finlayson 2013a)[^finlayson-2013a], and as Schnädelbach points out it is not clear that Habermas’s rational reconstruction of communication as discourse can provide such reasons.
