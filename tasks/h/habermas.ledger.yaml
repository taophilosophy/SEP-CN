      Second, religious and non-religious citizens in civil society must undergo complementary learning processes, leading to them becoming reflexive about their beliefs (2005b chapter 5 [2008a: 111–2]). For religious believers, this involves coming to terms with three aspects of modern society: reasonable pluralism, the priority of scientific knowledge, and the secular nature of the state (2001b chapter 2 [2003b: 104]; 2005b chapter 5 [2008a: 137]; 2012 chapter 7 [2017: 173]). For non-believers, it involves accepting the continuing presence of religion in modern society, coming to view their disagreements with believers as reasonable, accepting that believers have a right to contribute to the public sphere in religious language, being willing to help translate those contributions into secular language, and finally forgoing scientism, and scientistically motivated atheism, in favour of political agnosticism (2005b chapter 4 [2008a: 113]; 2005b chapter 8 [2008a: 263–4]; 2005b chapter 10 [2008a: 309–10]; see also Baxter 2011: 205)[^baxter-2011].
