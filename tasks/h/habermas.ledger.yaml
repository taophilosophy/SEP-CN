      如果说《交往行为理论》为三元结构本身给出了论证，那么这一论证建立在如下基本主张之上：存在三种同等源初的、对意义具有构成作用（meaning-critical）的有效性主张。每一个言语行为都同时提出真实性、正当性与真诚性的主张。这意味着，听者可以接受一个言语行为，并依据其命题真实性、规范正当性或表达时的真诚性来评价它。如果听者接受，就意味着“同时在三个层次上”达成一致（*Einverständnis*）（1981 [1984a: 307]）。为捍卫这一观点，哈贝马斯论证说，一个言语行为总是可以从三个视角遭到拒绝：依据其可断言条件，依据其规范证成，或依据说者的真诚性（1981 [1984a: 306]；1988b 第 4 篇 [1998b: 231]；1988b 第 6 篇 [1998b: 296]；1999a [1998b: 317]）。然而，需要论证而非预设的主张是：每一个言语行为的有效性主张都只能从三个、且仅仅三个视角遭到拒绝。而正如多尔舍尔（Dorschel）所说，一个断言或话语也可能因为说出的音量或风格而遭到拒绝（Dorschel 1988: 8–9）[^dorschel-1988]。归根结底，“任何话语都只能从三个、且仅仅三个视角遭到拒绝”这一“论证”是循环论证。因此，源自比勒图式的三元结构，最好仍被看作一个枢纽性假设。
