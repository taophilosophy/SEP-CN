      Habermas thus develops a distinctively social and intersubjective version of ethics, different from Kant’s. But certain developments in phase two push back toward a Kantian conception of discourse ethics (Heath 2014: 846)[^heath-2014]. In *Between Facts and Norms*, (U) is said to allow participants to agree on norms that are impartial, and that have “categorial validity” (1992b [1996b: 28]). And Habermas appears to hold, like Kant, that the rational will is the source of moral obligation (1992b [1996b: 110]; Kettner 2002, 212)[^kettner-2002]. Furthermore, the moral domain, which in phase one encompassed the entire domain of action norms and values, later “shrinks” to a domain of thinner, universal moral norms with characteristic overridingness and stringency (1991a chapter 6, 202 [1993: 91]).
