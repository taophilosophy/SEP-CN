      哈贝马斯主张，通过合理重构而获得的关于底层结构与能力的知识，随后可以被用于社会批判的目的。据说，一种实践的某个版本如果不能符合该实践所预设的反事实理想化，就可以被确认为病态的，或未充分合理化的（1983 [1990: 31–2]）。哈贝马斯因此把系统上被扭曲的交往、无效的道德规范与不合法的法律，分别确认为交往行为、道德话语与民主立法中的亏缺。合理重构允许我们按照这些实际实践自身的内部标准来批判它们，而不是按照批评者任意选定的标准，或哲学家被假定的超验标准（1992b [1996b: 5]）。同样地，合理重构所揭示的发展逻辑，可以被用来把历史发展的过程评价为集体学习的进步性实例，或评价为倒退的、病态的实例。作为解释社会现象的一种方法，合理重构既不只是经验的，也不只是解释学的；它所生产的原则据说为一种既不是“理想的”、也不是“现实的”、而是处于两者之间某处的社会理论与政治理论提供根据。哈贝马斯主张，哲学能够在被解释为学习过程的传统内部发现一个“批判性评价的立足点”（1996a 第 3 篇 [1998a: 97]；1992b [1996b: 5]），这无疑合乎批判理论的精神，但可以说与他另外一些主张处于张力之中：哲学应当“把自己限制于澄清道德观点与民主合法性化的程序”（Habermas 1995: 131; Finlayson 2019: 205）[^finlayson-2019]。
