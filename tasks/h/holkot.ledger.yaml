      ## 1 生平与著作
  - id: 3
    kind: body
    source: |-
      Robert Holkot was from the village of Holcot (or “cot in the rock” as he glossed it) near Northampton, and apparently a commoner: he spoke of how the most capable men seemed to come from humbler backgrounds. He joined the Dominican order, and if he received the usual training, obtained his initial education in arts, logic, Aristotelian philosophy, and theology within the Dominican schools. He studied at Oxford, commenting on Peter Lombard’s *Sentences* in the years 1331–1333. Once he obtained his doctorate in theology, he served as Dominican regent master there. Subsequently, Richard of Bury, the Bishop of Durham, chose Holkot as one of his clerks to work with him in London. Tradition also places Holkot at Cambridge, where he may have served as a Dominican lecturer or regent master in theology prior to 1343, when he is known to have returned to the Dominican priory of Northampton. He remained at Northampton, teaching and writing, until his death of the plague in 1349, acquired, as the story has it, while ministering to the sick (Slotemaker and Witt 2015, 1–4)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      罗伯特·霍尔柯特来自北安普敦附近的霍尔科特村（Holcot，他解释其名为“岩石中的小屋”），显然出身平民：他谈到最有才能的人似乎往往来自卑微的出身。他加入了多明我会；若接受常规训练，他最初在文法、逻辑、亚里士多德哲学与神学方面的教育都在多明我会学校内完成。他在牛津求学，于 1331—1333 年间为彼得·伦巴德（Peter Lombard）的《箴言四书》（*Sentences*）作注。获得神学博士学位后，他在那里担任多明我会的讲席教师。随后，达勒姆主教理查德·德·伯里（Richard of Bury）选霍尔柯特为他的一名文书，随他在伦敦工作。传统上也将霍尔柯特置于剑桥：他在 1343 年之前可能在那里担任多明我会讲师或神学讲席教师；1343 年他已知返回北安普敦的多明我会修道院。他在北安普敦讲学与写作，直至 1349 年死于瘟疫——据传是在照护病人时染上的（Slotemaker and Witt 2015, 1–4）[^slotemaker-2015][^slotemaker-2015-2]。
