      The Condemnations of 1277 and John Duns Scotus impelled the view that the world could be other than it is. The idea that God’s omnipotent power provides him with an infinity of choices out of which he chooses to create only one set of possibilities became a governing idea among subsequent English schoolmen. Scotus also argued forcefully for the idea that each moment was open to contingent possibility, such that for any time t, the events at t were possible not to be the events at t. Contingency, traditionally assigned to the future, in Scotus’ view superseded or governed even the hypothetical necessity of the present. Ockham retreated from Scotus’ view, reassigning contingency to future events and reasserting the full force of hypothetical necessity for events in the present. However, working out the implications for philosophy and theology of a contingent world order was the central intellectual challenge for Holkot’s generation.
    step1: |-
      1277 年的谴责与约翰·邓斯·司各脱推动了这样一种观点：世界本可以不是它所是的样子。上帝的全能为他提供了无穷的选择，而他只从中选择创造一组可能性，这一观念成为此后英国经院学者中的支配性观念。司各脱还有力地主张：每一时刻都对偶然可能性开放，以至于对任何时间 t 而言，t 时刻的事件有可能不是 t 时刻的事件。传统上被归于未来的偶然性，在司各脱看来甚至取代或支配了当下的假设必然性。奥卡姆从司各脱的观点退却，把偶然性重新归于未来事件，并重新主张假设必然性对当下事件的充分效力。然而，为一个偶然的世界秩序推演出其哲学与神学意涵，是霍尔柯特这一代人的核心智识挑战。
