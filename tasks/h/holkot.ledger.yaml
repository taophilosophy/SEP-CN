      Holkot viewed the human relationship to divine revelation as equivalent to engaging in an obligational debate. The faithful obligated themselves to accept divine revelations as true for the time of this life (even though as contingents it was possible that they might not be true), and if God commanded them to act in a way contrary to previous commands, the new commandment would supersede the old, just as if a new obligational debate had begun. Those who accepted the obligation to obey, would also be obligated to live in a way that was consistent with the obligations incurred, even if God did not reveal the details. Human reason was required to discern how to act in uncertain cases.
    step1: |-
      霍尔柯特把人与神圣启示的关系视为等同于参加一场义务论辩论。信徒有义务在此生期间把神圣启示接受为真（尽管作为偶然物，它们可能不为真），而如果上帝命令他们以违背先前命令的方式行事，新诫命就会取代旧诫命，正如一场新的义务论辩论已经开始。那些接受服从义务的人，也有义务以与已承担义务相一致的方式生活，即使上帝没有启示细节。人的理性被要求辨明在不确定情形中如何行动。
