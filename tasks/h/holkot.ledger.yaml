      What Holkot added to the discussion was an elaborate analysis of such puzzles using the rules and structure of obligational debates to explore counterfactual possibility. Debates *de obligatione* were a commonplace in the medieval university curriculum and involved one person, the “opponent” posing a proposition to another, the “respondent,” that, if accepted, would form the basis for a continuing exchange. The posed proposition was usually a counterfactual or a proposition whose truth status was uncertain. The opponent then proposed further propositions to the respondent, each of which might follow from, contradict or be irrelevant to the first. The respondent was to take the first proposition as true for the time of the debate (understood in Holkot’s version to take place in a single hypothetical instant of time), and to respond with agreement or rejection depending on whether the succeeding propositions followed from what had been agreed on before or contradicted the preceding concessions. If a proposed proposition was unconnected with any of the preceding propositions, the respondent would respond with agreement, rejection or doubt depending on what he understood the actual state of affairs in the world to be. The forms and rules of obligational debate suggested a rigorous format for exploring the contingent possibilities, which Holkot adopted (Gelber 2004, 171–189; Slotemaker and Witt 2015, 26–30)[^gelber-2004][^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      霍尔柯特为这一讨论所增添的，是对这类难题的一个精细分析，他运用义务论辩论的规则与结构来探究反事实可能性。*de obligatione* 辩论在中世纪大学课程中是寻常之事，它涉及一个人——“反对者”——向另一人——“应答者”——提出一个命题，该命题若被接受，便构成一场持续交流的基础。所提出的命题通常是反事实的，或真值状态不确定的命题。反对者随后向应答者提出进一步命题，每一个都可能从第一个命题推出、与它矛盾或与之无关。应答者须在辩论期间把第一个命题视为真（在霍尔柯特的版本中，理解为发生在一个单一的假设时间瞬间），并根据后继命题是否从先前已同意之事推出、或与先前的让步相矛盾，而以同意或拒绝回应。如果所提命题与先前任何命题都无关联，应答者则根据他理解的世界实际事态如何，而以同意、拒绝或怀疑回应。义务论辩论的形式与规则为探究偶然可能性提供了一种严格的格式，霍尔柯特采纳了它（Gelber 2004, 171–189; Slotemaker and Witt 2015, 26–30）[^gelber-2004][^slotemaker-2015][^slotemaker-2015-2]。
