      Holkot contended that the common response of his era to such an argument, was to pose the possibility of a counterfactual past: to say that the proposition “*a* will be” is true, yet contingently true, and therefore, although it is true, it can never have been true. Holkot argued, the possibility of a counterfactual past differentiated propositions about the future on contingent matters and their equivalents--whether set in the past or present--from propositions about the past and present that are not about such contingent matters. The propositions “*a* was known by God,” and “*a* is known by God,” although set in the past and present, are true and yet can never have been true, just like other propositions about the future, because they are about *a*, and *a*, as a future contingent, may still not happen. Holkot’s response is recognizable as a version of what in modern discussions is called the Ockhamist solution, although the argument traces back at least to Bonaventure (Slotemaker and Witt 2015, 87–94)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      霍尔柯特主张，他那个时代对此类论证的通常回应，是提出一个反事实过去的可能性：说命题“*a* 将发生”是真的，却是偶然地为真，因此，尽管它为真，它却从不曾为真。霍尔柯特论证说，反事实过去的可能性把关于偶然事务的未来命题及其等价物——无论设定在过去还是现在——与并非关于这类偶然事务的过去与现在命题区分开来。命题“*a* 被上帝所知”与“*a* 为上帝所知”，尽管设定在过去与现在，却是真的而又从不曾为真，正如其他关于未来的命题一样，因为它们关于 *a*，而 *a* 作为一个未来偶然物，仍可能不发生。霍尔柯特的回应可被识别为现代讨论中所谓的奥卡姆式解决的一个版本，尽管这一论证至少可追溯至波拿文都拉（Slotemaker and Witt 2015, 87–94）[^slotemaker-2015][^slotemaker-2015-2]。
