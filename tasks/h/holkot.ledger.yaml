      Ockham had argued for stringent limits on the ability of reason to establish the existence of God. While an argument for the existence of God as “first conserver” of things could be made, Ockham had argued against the ability of natural reason to prove there was only one divine being. Holkot developed such strictures, arguing that unaided human reason could not prove through a strict demonstration that any incorporeal being like an angel or God existed. The consequence for Holkot was that any reference to such incorporeal beings found in the texts of ancient philosophers must have come down to them from their predecessors passing on a vestige of knowledge about God acquired ultimately from Adam and Eve. Holkot also contended that some pagans, who lacked the law of Moses, still received faith and grace from God outside the Mosaic Law because they did their best to live according to the principles of natural law. Holkot’s sanguine view of pagan philosophers like Hermes Trismegistus and Aristotle rested not on their ability to use natural reason to discern theological truths, but on his confidence that God had accorded a measure of revelation to more than those who had the texts of scripture (Slotemaker and Witt 2015, 71–73)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      奥卡姆曾主张，理性确立上帝存在的能力受到严格限制。尽管可以提出一个把上帝视为万物的“第一保存者”的论证，奥卡姆却反对自然理性能够证明只有一个神圣存在者。霍尔柯特发展了这样的限制，主张：未受助的人类理性无法通过严格证明确立任何无形体存在者——如天使或上帝——的存在。对霍尔柯特而言，其结果是：在古代哲学家文本中发现的任何关于这类无形体存在者的提及，必是从其前人那里传承而来，而前人传递的是一种关于上帝的知识残余，这种知识最终得自亚当与夏娃。霍尔柯特还主张，一些缺乏摩西律法的异教徒，虽在摩西律法之外，仍从上帝领受信德与恩典，因为他们尽力按照自然法的原则生活。霍尔柯特对像赫耳墨斯·特里斯墨吉斯忒斯与亚里士多德这样的异教哲学家所持的乐观看法，并不基于他们运用自然理性来辨认神学真理的能力，而基于他的确信：上帝把一定程度的启示赐予了不止那些拥有圣经文本的人（Slotemaker and Witt 2015, 71–73）[^slotemaker-2015][^slotemaker-2015-2]。
