      Holkot responded in a passage for which he is perhaps best known, that there must be two systems of logic, a logic appropriate to the natural order, exemplified in Aristotle’s works, and a logic appropriate to the supernatural order, a logic of faith, whose rules are supplementary to those of Aristotle (Slotemaker and Witt 2015, 74–81, esp. 78)[^slotemaker-2015][^slotemaker-2015-2]. He concluded that Aristotelian logic did not hold universally, but only for the natural order unless additions were made to take into account theological cases. This did not mean that he abandoned the principle of non-contradiction in matters of faith. Rather the nature of the divine being meant that syllogisms involving Trinitarian terms functioned like expository syllogisms about particulars when unquantified universal terms are substituted for particular ones:
    step1: |-
      霍尔柯特在一段也许最为人熟知的文字中回应道：必须有两套逻辑体系，一套适用于自然秩序的逻辑，以亚里士多德的著作为范例，另一套适用于超自然秩序的逻辑，即信德的逻辑，其规则是对亚里士多德规则的补充（Slotemaker and Witt 2015, 74–81, esp. 78）[^slotemaker-2015][^slotemaker-2015-2]。他得出结论：亚里士多德逻辑并非普遍有效，而只适用于自然秩序，除非作出补充以顾及神学情形。这并不意味着他在信仰事务上放弃了不矛盾原则。毋宁说，神圣存在者的本性意味着：当把不量化的普遍词项替换为个别词项时，涉及三位一体词项的三段论便如同关于个别事物的解释性三段论那样运作：
