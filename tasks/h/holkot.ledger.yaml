      Where the fact of command matters more than the substance of what is commanded, human intention to obey has greater significance than the substantive enactments of obedience. Holkot perceived the connection between divine command and the human intention to obey as at the heart of the relationship between human beings and God. For instance, Holkot posed the case of a simple old woman, who in good faith comes to church to hear a new church doctrine from her bishop. If the bishop gets the doctrine backwards, explaining to his congregation that they should believe just the opposite of what the new article of belief contains, is the elderly laywoman required to accept the words of her bishop as true? One of Holkot’s fellow scholars had argued that she would only be in this position if she were being punished for sin, but Holkot responded that it was not the substance of her belief that mattered, but her intention to do what was right and to obey God. Her intention to do her best to conform her will to God would be sufficient under the covenant to ensure her salvation if she were to persevere in that intention. God would not deny her salvation because those on whom she necessarily depended for knowledge about God’s will were misinformed or confused (Slotemaker and Witt 2015, 60–62)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      在命令的事实比命令的内容更为重要之处，人类服从的意图比服从的实质性实施具有更大的意义。霍尔柯特把神圣命令与人类服从意图之间的联系，视为人与上帝之间关系的核心。例如，霍尔柯特提出一位质朴老妇人的情形：她怀着善意来到教堂，要听主教宣讲新的教会教义。如果主教把教义讲反了，向会众解释说他们应当相信新信条内容的反面，那么这位年长的平信徒妇女是否必须接受主教的话为真？霍尔柯特的一位学者同仁曾论证说，只有当她在为罪受罚时才会处于这种境地；但霍尔柯特回应说，重要的不是她信仰的内容，而是她做正当之事并服从上帝的意图。如果她坚持这一意图，那么她在圣约之下愿意尽己所能使自己的意志与上帝相合，就足以确保她的得救。上帝不会拒绝她的得救，因为那些她为认识上帝旨意而必然依赖的人受到了误导或困惑（Slotemaker and Witt 2015, 60–62）[^slotemaker-2015][^slotemaker-2015-2]。
