      Debates over the place of deception in terms of both the absolute and ordained systems of possibility involved Holkot and a number of his immediate contemporaries. If the world is a contingent place that can be other than it is, then do God’s revelations constrain the scope of his possible future actions? If not, can what God says be deceptive or false? Discussion took up scriptural instances in which God seemed to deceive. Holkot, against a number of his contemporaries, argued that God can deceive human beings even in the ordained system, has deceived them as shown in scripture, and has deceived them for no redeeming good apparent to human beings. If God’s words to human beings might be deceptive, such that it is not just the bishop who may impart false information, but even God, then the human intention to believe God’s words as true and to obey them takes on even more importance. Holkot did not believe that God was playing the role of Descartes’ deceiving demon, but Holkot also did not know how to rule out the possibility that he might be deceived about any given thing he believed (Slotemaker and Witt 2015, 94–99)[^slotemaker-2015][^slotemaker-2015-2]. The important thing was that even if he were deceived, God had promised that his intention to believe what was revealed and to do what he understood God wanted him to do provided security under the covenant. Faith in the covenant was the source of certainty, not rational demonstration.
    step1: |-
      关于欺骗在绝对与受命两种可能性体系中的位置的争论，涉及霍尔柯特与其同时代的一批人。如果世界是一个可以是别样的偶然之地，那么上帝的启示是否约束其可能未来行动的范围？若不是，上帝所说的话能否是欺骗性的或虚假的？讨论探讨了圣经中上帝似乎欺骗人的实例。霍尔柯特反对其同时代的一批人，论证说：上帝即使在受命体系中也能欺骗人类，正如圣经所表明的那样已经欺骗了他们，而且他欺骗他们并无任何对人类而言显而易见的救赎之善。如果上帝对人所讲的话可能是欺骗性的，以致不仅主教可能传达虚假信息，甚至上帝也可能如此，那么人类相信上帝的话为真并服从它们的意图就变得更加重要。霍尔柯特并不认为上帝扮演了笛卡尔的欺骗恶魔的角色，但霍尔柯特也不知道如何排除这种可能：他对其所相信的任何给定事物都可能是受骗的（Slotemaker and Witt 2015, 94–99）[^slotemaker-2015][^slotemaker-2015-2]。重要的是，即使他受骗，上帝也应许：他相信所启示之事并做他所理解的上帝要他做之事的意图，在圣约之下提供了保障。对圣约的信仰是确定性的来源，而不是理性的证明。
