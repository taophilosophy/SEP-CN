      Divine omnipotence involves the absolute power to enact anything that does not involve a contradiction. But among the multitude of possibilities open to divine enactment, God chooses or ordains a subset of compatible possibilities that constitute the world and its history as we know it. The relationship between God’s absolute power and the ordained system in place at any given time provided a fault line for exploring questions of necessity and contingency. Thirteenth century theologians formulated the relationship as one between what God has done and what he could have done otherwise, safely relegating contingency to a now foreclosed past. Canon lawyers, however, appropriated the distinction to describe the powers of the pope to set aside “ordained” or enacted Church law through the “plenitude” or “absolute” power of his office. Because papal power transcended enacted law, and popes (and monarchs) who enacted laws were in some sense not subject to those laws, they could provide for exceptions or change enacted laws without contradiction. Such application of the distinction between absolute and ordained power raised the possibility that God might intervene in the ordained system through his absolute power. Beginning with Scotus, the formulation of the canonists began to enter into discussions of God’s exercise of absolute power. The appropriation of the legal tradition did not lead to the conclusion (at least for Scotus, Ockham and Holkot) that God uses his absolute power to act inordinately in the ordained system, but rather it enables God (as it did in the change from the Old to the New Law) to set aside one ordained system and replace it with another. Several different and incompatible systems of divine legislation have operated at different times during human history. God’s absolute capacity to transcend any given ordained system and replace it with another has made such a switch possible without involving God in a contradiction of his nature. Holkot also invoked this dialectical relationship between God’s absolute and ordained power to explain how God provides for dispensations from his laws in particular cases. God never acts inordinately, but the system of divine ordinations is complex and involves multiple incompatible subsets capable of being in place at any given time (Slotemaker and Witt 2015, 32–37)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      神圣全能涉及实施任何不涉及矛盾之事的绝对权能。但在可供神圣实施的众多可能性中，上帝选择或规定了一组相容的可能性，它们构成我们所知的世界及其历史。上帝的绝对权能与任一既定时刻所施行的受命体系之间的关系，为探究必然性与偶然性问题提供了一条断层线。十三世纪的神学家把这一关系表述为上帝所已行之事与上帝本可另作之事之间的关系，从而把偶然性稳妥地归入一个现已封存的过去。然而，教会法学家挪用了这一区分，用以描述教皇凭借其职位的“完满权能”或“绝对权能”搁置“受命的”或已颁行的教会法的权力。由于教皇权能超越了已颁行的法律，而颁行法律的教皇（与君主）在某种意义上并不受那些法律的约束，他们可以规定例外，或在不矛盾的情况下变更已颁行的法律。绝对权能与受命权能之区分的此类应用，提出了上帝可能以其绝对权能介入受命体系的可能性。自司各脱开始，教会法学家的表述开始进入关于上帝行使绝对权能的讨论。对法律传统的挪用并未导向这一结论（至少对司各脱、奥卡姆与霍尔柯特而言）：上帝运用其绝对权能在受命体系中越出秩序地行事；毋宁说，它使上帝（正如在从旧律到新律的转变中那样）能够搁置一个受命体系并以另一个取而代之。在人类历史的不同时期，多种彼此不同且不相容的神圣立法体系曾相继运行。上帝超越任何既定受命体系并以另一个取而代之的绝对能力，使这种切换成为可能，而无须使上帝陷入其本性的矛盾。霍尔柯特也援引上帝的绝对权能与受命权能之间的这种辩证关系，来说明上帝如何在特定情形下为其律法规定豁免。上帝从不越出秩序行事，但神圣规定的体系是复杂的，且包含多个可在任一既定时刻施行的不相容子集（Slotemaker and Witt 2015, 32–37）[^slotemaker-2015][^slotemaker-2015-2]。
