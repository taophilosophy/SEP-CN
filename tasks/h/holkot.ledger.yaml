  - id: 4
    kind: body
    source: |-
      Holkot produced a number of works over his lifetime. While he was at Oxford, he lectured on Peter Lombard’s *Sentences*, on Matthew and the Book of the Twelve Prophets, and engaged in ordinary and quodlibetal debates. He also engaged in a dispute with his fellow students about epistemology, published as the *Sex articuli*, and probably wrote another work, *De imputabilitate peccati* or *On the imputability of sin*. A text, *De stellis*, *On the stars*, a rough commentary on Aristotle’s *De caelo* was probably originally intended as part of his commentary on the *Sentences*, but circulated as a separate tract. His *Sermo finalis*, the final sermon given at the time of passing on the lectureship on the *Sentences* to the next Dominican, also survives (Wey 1949)[^wey-1949]. While in London, Holkot helped Richard of Bury with the book, the *Philobiblon*. Two works for preachers, the *Moralitates* and the *Convertimini*, date from his later years (Slotemaker and Witt 2015, 233–249)[^slotemaker-2015][^slotemaker-2015-2]. His most famous Biblical lectures, on the book of Wisdom, are associated with Cambridge, and survive as the *Postilla super librum Sapientiae* (Slotemaker and Witt 2015, 162–214)[^slotemaker-2015][^slotemaker-2015-2]. Portions of lectures on Ecclesiastes also survive, most likely from his time in Northampton, and he was known to be giving lectures on Ecclesiasticus when he died. A sermon collection, spanning his career, has also been preserved (Slotemaker 2014; Slotemaker and Witt 2016)[^slotemaker-2014][^slotemaker-2016][^slotemaker-2016-2]. Most of these texts exist (if they have come down to us) only in manuscript or early sixteenth century editions. Modern editions are available, however, of selected portions, sermons and questions, and of the *Sex articuli*.
    step1: |-
      霍尔柯特一生创作了大量著作。在牛津期间，他为彼得·伦巴德的《箴言四书》作注，讲授《马太福音》与《十二先知书》，并参与常规辩论与自由辩论。他还与同学就认识论展开论辩，结果以《六条论纲》（*Sex articuli*）刊行；他可能还写了另一部著作《论罪的归责》（*De imputabilitate peccati*，即“论罪的可归责性”）。一部《论星体》（*De stellis*，即“论星辰”），是对亚里士多德《论天》（*De caelo*）的粗略注疏，可能原属其《箴言四书》注疏的一部分，但作为独立短文流传。他的《终场布道》（*Sermo finalis*）——在把《箴言四书》讲席移交给下一位多明我会士时所发表的最后布道——也保存了下来（Wey 1949）[^wey-1949]。在伦敦期间，霍尔柯特协助理查德·德·伯里写作《爱书》（*Philobiblon*）。两部供传道者使用的著作——《道德寓言》（*Moralitates*）与《皈依》（*Convertimini*）——出自他晚年（Slotemaker and Witt 2015, 233–249）[^slotemaker-2015][^slotemaker-2015-2]。他最著名的《圣经》讲章，即关于《智慧书》的，与剑桥有关，并以《智慧书后注》（*Postilla super librum Sapientiae*）的形式流传下来（Slotemaker and Witt 2015, 162–214）[^slotemaker-2015][^slotemaker-2015-2]。关于《传道书》的部分讲章也保存下来，很可能出自他在北安普敦时期；已知他去世时正在讲授《便西拉智训》。一部贯穿其生涯的布道文集也被保存下来（Slotemaker 2014; Slotemaker and Witt 2016）[^slotemaker-2014][^slotemaker-2016][^slotemaker-2016-2]。这些文本大多（若流传至今）仅存于手稿或十六世纪早期版本。不过，其中选段、布道、问答以及《六条论纲》已有现代版本。
