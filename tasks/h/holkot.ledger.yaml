      With no act having intrinsic worth, the meritoriousness of human behavior was grounded in a covenant between God and the human faithful. Within the terms of the New Law, God would not deny salvation to all those who did their best to obey his commands and adhere to the Articles of the Faith. The causal effect of meritorious acts in effecting salvation was a secondary form of causality, functioning like money, as an agreed upon medium of exchange in the economy of salvation. Because God’s goodness was not a guarantee of covenant, however, Holkot stressed that human adherence to the terms of the covenant constituted an act of faith that God would indeed uphold his promises, even knowing that nothing compels God to do so (Slotemaker and Witt 2015, 30–32)[^slotemaker-2015][^slotemaker-2015-2].
    step1: |-
      由于没有任何行为具有内在价值，人类行为的功德性便以上帝与人类信徒之间的圣约为根据。在新律的条款内，上帝不会拒绝把得救赐予所有尽力遵守其命令并信奉信经条款的人。功德行为在促成得救方面的因果效应，是一种次要形式的因果性，其作用如同货币，是得救经济中约定的交换媒介。然而，因为上帝的善并不保证圣约，霍尔柯特强调：人类恪守圣约条款构成一种信仰行为，即相信上帝确实会履行其应许，即便知道没有任何东西迫使上帝如此行（Slotemaker and Witt 2015, 30–32）[^slotemaker-2015][^slotemaker-2015-2]。
