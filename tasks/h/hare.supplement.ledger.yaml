      #### Supplement to Richard Mervyn Hare
    step1: |-
      #### 《理查德·默尔文·黑尔》词条补充材料
    step2: |-
      #### 《理查德·默尔文·黑尔》词条补充材料
  - id: 2
    kind: body
    source: |-
      ## Hare’s “An Essay in Monism”
    step1: |-
      ## 黑尔的《一元论论纲》
    step2: |-
      ## 黑尔的《一元论论纲》
  - id: 3
    kind: body
    source: |-
      While on leave in 1940, Hare wrote twenty pages setting out “my philosophy”. When Singapore fell, he looted a ledger from Changi jail, and started writing a monograph called “An Essay in Monism”. He carried this on his back during the march, and completed it just before being released. He typed it out, making multiple copies, once he was free. He later dismissed it as “containing mostly rubbish” (Seanor & Fotion 1988: 201); even its Preface says it is “based, I know, on insufficient reading imperfectly remembered”. There are detectable influences from Alfred North Whitehead, Arthur Eddington (and, indirectly, Bertrand Russell’s neutral monism); yet it is already characteristic in its clarity, consistency, lucidity, and self-confidence. It remains very little known (but see John E. Hare 2007: 200–7), and is of interest both in itself, and for points of connection with his mature thinking. Unfortunately, it is only accessible within the archives of Balliol College, Oxford.
    step1: |-
      1940 年休假期间，黑尔写下二十页篇幅的文字，陈述“我的哲学”。新加坡陷落时，他从樟宜监狱偷得一本账簿，开始撰写一部题为《一元论论纲》的专论。行军途中他把稿子背在背上，并在获释前夕将它完成。重获自由后，他把它打字誊出，复制了多份。他后来贬抑它，说它“大半是垃圾”（Seanor & Fotion 1988: 201）；连它的序言也说它“基于，我知道，不足的阅读与不完善的记忆”。文中可以辨认出阿尔弗雷德·诺思·怀特海与阿瑟·爱丁顿的影响（以及间接地，伯特兰·罗素的中立一元论）；然而它已经显示出其清晰、一贯、明白与自信的特质。它至今仍鲜为人知（但见 John E. Hare 2007: 200–7），无论就其自身，还是就其与黑尔成熟思想的关联点而言，都有趣味。遗憾的是，它只能在牛津巴利奥尔学院的档案中查阅。
    step2: |-
      1940 年休假期间，黑尔写下二十页文字，陈述“我的哲学”。新加坡陷落时，他从樟宜监狱搞到一本账簿，动笔撰写一部题为《一元论论纲》的专著。行军路上，他把手稿背在身上，在获释前夕将它写完。重获自由后，他把手稿打出，复制了多份。后来他不无轻蔑地说它“大半是垃圾”（Seanor & Fotion 1988: 201）；连它的序言也自陈“基于——我知道——不足的阅读与不牢靠的记忆”。文中可以辨认出阿尔弗雷德·诺思·怀特海与阿瑟·爱丁顿的影响（间接地还有伯特兰·罗素的中立一元论）；但它已然带有黑尔标志性的清晰、一贯、明白与自信。它至今鲜为人知（但见 John E. Hare 2007: 200–7），无论本身还是作为通向其成熟思想的联结点，都值得关注。可惜的是，它只能到牛津巴利奥尔学院的档案室里查阅。
  - id: 4
    kind: body
    source: |-
      A central notion, initially put to work in relating mind and matter without dualism, is *rhythm*, which is an activity that unites a thing with its causes and effects. The metaphysics that emerges is one of process rather than substance. The identity of a “rhythm” extends into its effects:
    step1: |-
      一个核心概念——最初被用来在没有二元论的情况下关联心灵与物质——是*韵律*（rhythm），它是一种把一物与其原因和效果统一起来的活动。由此浮现的形而上学是一种过程形而上学，而非实体形而上学。一个“韵律”的同一性延伸到它的效果之中：
    step2: |-
      一个核心概念——最初被用来在不设二元论的前提下关联心灵与物质——是*韵律*（rhythm）：一种把一物同它的原因与结果统一起来的活动。由此浮现的形而上学，是过程的形而上学而非实体的形而上学。一个“韵律”的同一性会延伸到它的结果之中：
  - id: 5
    kind: body
    source: |-
      > A rhythm is a series of occurrences which includes every effect caused by that rhythm; that is to say, a thing’s effects, or the energy which it gives off, are just as much a part of that thing’s entity as what we erroneously call its “matter”. (ch. 4, p. 28)
    step1: |-
      > 韵律是一系列事件，它包括该韵律所造成的每一个效果；也就是说，一物的效果，或它发出的能量，正如我们错误地称之为它的“物质”的东西一样，是该物实体的一个部分。（第 4 章，第 28 页）
    step2: |-
      > 韵律是一连串的事变，其中包含该韵律引起的每一个效果；也就是说，一物所生的效果、它散发出的能量，与我们误称为其“物质”的东西一样，都是该物实体的组成部分。（第 4 章，第 28 页）
  - id: 6
    kind: body
    source: |-
      As Hare recognizes, “This is nonsense if we are thinking of a ‘thing’ as ‘a piece of matter’” (ch. 4, p. 30); but this changes if a “thing” is analyzable as a series of occurrences, for there is then “nothing to prevent the same occurrence being part of several different series” (ch. 4, p. 31). The reality (as on certain contemporary views of personal identity) is that a “thing” possesses not a definite boundary, but an indefinite periphery:
    step1: |-
      正如黑尔所承认的，“如果我们把‘物’想作‘一块物质’，这就是胡话”（第 4 章，第 30 页）；但如果一个“物”可以被分析为一系列事件，情况就不同了，因为那时“没有什么能阻止同一事件成为几个不同系列的组成部分”（第 4 章，第 31 页）。实际情况（正如当代人格同一性的某些观点所主张的）是：“物”拥有的不是一个确定的边界，而是一个不确定的外围：
    step2: |-
      黑尔自己也承认：“倘若我们把‘物’想成‘一块物质’，这就是胡话”（第 4 章，第 30 页）；可一旦“物”可以被分析为一系列事变，情形就变了——因为这样一来，“没有什么能阻止同一事变成为几个不同系列的组成部分”（第 4 章，第 31 页）。实际情况（正如当代关于人格同一性的某些看法）是：“物”并没有一条明确的边界，只有一片不定的外缘：
  - id: 7
    kind: body
    source: |-
      > Within one rhythm certain occurrences are more remote (or more immediate) causes (or effects) than others. That is to say, the coherence is stronger and more obvious at the *centre* than on the fringe. The more remote causes of a rhythm count for less in the entity of that rhythm than the more immediate causes, and the same is true of effects. That is why in our everyday consideration of rhythms we are content to ignore its fringes and to grasp at the central part. (ch. 4, p. 33)
    step1: |-
      > 在一个韵律之中，某些事件比起其他事件是更遥远（或更切近）的原因（或效果）。也就是说，融贯性在*中心*比在边缘更强、更明显。一个韵律较遥远的原因，比较切近的原因在该韵律的实体中分量更轻，效果亦然。这就是为什么在我们日常对韵律的考虑中，我们满足于忽略它的边缘，而把握其中心部分。（第 4 章，第 33 页）
    step2: |-
      > 在同一个韵律内部，某些事变相对其他事变是更远（或更近）的原因（或结果）。也就是说，融贯在*中心*处比在外缘处更强、也更显豁。一个韵律较远的原因，比较近的原因在该韵律的实体中分量更轻；结果亦然。所以在日常考量韵律时，我们乐于忽略其外缘，只把握其中心部分。（第 4 章，第 33 页）
  - id: 8
    kind: body
    source: |-
      Descartes’ inference from the experience of thinking to the existence of a thing that thinks is rejected as importing an unreal stasis:
    step1: |-
      笛卡尔从思维经验推至一个思维物之存在的推理，被斥为引入了一种不真实的静止：
    step2: |-
      笛卡尔从思维的经验推出一个思维者的存在，这一推论被拒斥为引入了不真实的静止：
  - id: 9
    kind: body
    source: |-
      > The fact is the cognition, not the thing cognised … The “facts” of the world are not substantial objects, but events or occurrences. In the grammar of existence, *verbs* are the vital words, not subjects or objects. (ch. 9, p. 82)
    step1: |-
      > 事实是认知，而非被认知之物……世界的“事实”不是实体性的对象，而是事件或事变。在存在的语法中，*动词*才是要紧的词，而非主词或宾词。（第 9 章，第 82 页）
    step2: |-
      > 事实是认知活动，而不是被认知的东西……世界的种种“事实”并非实体性对象，而是事件或事变。在存在的语法里，要紧的词是*动词*，不是主词，也不是宾词。（第 9 章，第 82 页）
  - id: 10
    kind: body
    source: |-
      It is an upshot that “things” extend into one another in a way that might be represented by overlapping sets of concentric circles:
    step1: |-
      一个结论是：“物”彼此延伸入对方，其方式可以用彼此交叠的同心圆组来表示：
    step2: |-
      由此得到的一个结论是：诸“物”相互渗入，其方式可以画作一组组彼此交叠的同心圆：
  - id: 11
    kind: body
    source: |-
      > If two rhythms exist side by side in the same universe, rhythm *A* will in a certain degree be affected by rhythm *B*, and will in a certain degree affect rhythm *B* … *A*’s sphere of influence extends within the boundaries of *B*, and the influence is not uniform, but decreases as it gets further from its source. To describe this concept we may borrow a term of Whitehead’s, “prehension”: *B*’s sphere of influence within the limits of *A* is called *A*’s “prehension” of *B*, and *vice versa* (ch. 7, p. 53).
    step1: |-
      > 如果两个韵律并存于同一宇宙之中，韵律 *A* 会在一定程度上受韵律 *B* 的影响，也会在一定程度上影响韵律 *B*……*A* 的影响范围延伸到 *B* 的边界之内，而且这种影响并不均匀，越远离其源头越弱。为了描述这个概念，我们可以借用怀特海的一个术语，“摄受”（prehension）：*B* 在 *A* 的界限之内的影响范围，被称为 *A* 对 *B* 的“摄受”，反之亦然（第 7 章，第 53 页）。
    step2: |-
      > 倘若两个韵律并存于同一个宇宙，韵律 *A* 便会在某种程度上受韵律 *B* 的影响，也在某种程度上影响韵律 *B*……*A* 的影响范围延伸到 *B* 的边界之内，且影响并不均匀，离源头越远越弱。为描述这一概念，不妨借用怀特海的术语“摄受”（prehension）：*B* 在 *A* 界限之内的影响范围，就叫 *A* 对 *B* 的“摄受”，反之亦然（*vice versa*）（第 7 章，第 53 页）。
  - id: 12
    kind: body
    source: |-
      This may either enhance *A*’s individuality or constrict it, depending on the manner in which *A* acts upon *B*:
    step1: |-
      这可能增强 *A* 的个体性，也可能约束它，取决于 *A* 作用于 *B* 的方式：
    step2: |-
      这可能增强 *A* 的个体性，也可能压缩它——全看 *A* 以何种方式作用于 *B*：
  - id: 13
    kind: body
    source: |-
      > When two rhythms prehend one another, their relations can be either friendly or antagonistic. If *A* influences *B* in such a way as to fit in with *B*’s rhythm, the two rhythms may be said to be in sympathy. In this case the two rhythms are united in a combined rhythm without losing their rhythmic individuality. (ch. 7, p. 54)
    step1: |-
      > 当两个韵律相互摄受时，它们的关系可以是友好的，也可以是对抗的。如果 *A* 影响 *B* 的方式恰好与 *B* 的韵律相合，那么可以说这两个韵律处于和谐之中。在这种情况下，两个韵律结合为一个复合韵律，而不丧失各自的韵律个体性。（第 7 章，第 54 页）
    step2: |-
      > 当两个韵律相互摄受时，其关系或友好，或对抗。倘若 *A* 影响 *B* 的方式与 *B* 的韵律相合，就可以说两个韵律处于同感之中。这时，二者结合成一个复合韵律，而各自韵律上的个体性并不因此丧失。（第 7 章，第 54 页）
