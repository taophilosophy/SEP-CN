      Of these only the first has the linguistic density characteristic of Heraclitus’ words. The second starts out with the same three words as B12, but in Attic, not in Heraclitus’ Ionic dialect, and the second clause has no grammatical connection to the first. The third is patently a paraphrase by an author famous for quoting from memory rather than from books. Even it starts out in Greek with the word ‘river,’ but in the singular. There is no evidence that repetitions of phrases with variations are part of Heraclitus’ style (as they are of Empedocles’). To start with the word ‘river(s)’ goes against normal Greek prose style, and on the plausible assumption that all sources are trying to imitate Heraclitus, who does not repeat himself, we would be led to choose B12 as the one and only river fragment, the only actual quotation from Heraclitus’ book. This is the conclusion of Kirk (1954) and Marcovich (1967), based on an interpretation that goes back to Reinhardt (1916). That B12 is genuine is suggested by the features it shares with Heraclitean fragments: syntactic ambiguity (*toisin autoisin* ‘the same’ [in the dative] can be construed either with ‘rivers’ [“the same rivers”] or with ‘those stepping in’ [“the same people”], with what comes before or after), chiasmus, sound-painting (the first phrase creates the sound of rushing water with its diphthongs and sibilants), rhyme and alliteration.[^note-2]
    step1: |-
      这三则之中，只有第一则具备赫拉克利特词句特有的语言密度。第二则开头三个词与 B12 相同，但用的是阿提卡方言，而非赫拉克利特所用的伊奥尼亚方言，且第二句与第一句没有语法联系。第三则显然是转述，出自一位以凭记忆引书而非照书引文著称的作者。即便它，希腊文开头用的也是“河”字，但用的是单数。没有证据表明，带变异的短语重复是赫拉克利特风格的一部分（恩培多克勒则不然）。以“河（们）”这一词开头违背正常的希腊散文风格；而按照一个可信的假设——所有史料都在模仿不自我重复的赫拉克利特——我们便会被引向选 B12 为唯一一则河流残篇，即赫拉克利特书中唯一真正的引文。这是 Kirk（1954）与 Marcovich（1967）的结论，其解释可追溯到 Reinhardt（1916）。B12 为真品，可由它与赫拉克利特残篇共有的一些特征见出：句法含混（*toisin autoisin*“同样的”[与格]既可解作与“河流”[“同样的河流”]相连，也可解作与“踏入者”[“同样的人”]相连；既可解作与前文相连，也可解作与后文相连）、交错配列、声音描绘（第一个短语以其双元音与咝音造出急流之声）、押韵与头韵[^note-2]。
    step2: |-
      三则之中，只有第一则具备赫拉克利特词句那种特有的语言密度。第二则开头三个词与 B12 相同，用的却是阿提卡方言，不是赫拉克利特的伊奥尼亚方言；而且第二句跟第一句在语法上接不上。第三则明显是转述，出自一位以凭记忆引书、而非照书引文著称的作者。就连这则，希腊文开头用的也是“河”字，不过是单数。没有证据表明，带变异的重复短语属于赫拉克利特的风格（恩培多克勒倒有此习）。以“河（们）”开头，违背希腊散文的常态；再假定各路史料都在模仿从不自我重复的赫拉克利特，那我们只能选 B12 为唯一一则河流残篇——赫拉克利特书中唯一真正的引文。这是 Kirk（1954）与 Marcovich（1967）的结论，其解释可上溯到 Reinhardt（1916）。B12 之真，可从它与赫拉克利特残篇共有的特征看出：句法含混（*toisin autoisin*“同样的”[与格]，既可连“河流”——“同样的河流”，也可连“踏入者”——“同样的人”，既可连前文，也可连后文）；交错配列；声音描绘（第一个短语以双元音和咝音摹出急流之声）；押韵与头韵[^note-2]。
