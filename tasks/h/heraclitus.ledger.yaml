      If B12 is accepted as genuine, it tends to disqualify the other two alleged fragments. The major theoretical connection in the fragment is that between ‘same rivers’ and ‘other waters.’ B12 is, among other things, a statement of the coincidence of opposites. But it specifies the rivers as the same. The statement is, on the surface, paradoxical, but there is no reason to take it as false or contradictory. It makes perfectly good sense: we call a body of water a river precisely because it consists of changing waters; if the waters should cease to flow it would not be a river, but a lake or a dry streambed. There is a sense, then, in which a river is a remarkable kind of existent, one that remains what it is by changing what it contains (cf. Hume *Treatise* 1.4.6, p. 258 Selby-Bigge). Heraclitus derives a striking insight from an everyday encounter. Further, he supplies, via the ambiguity in the first clause, another reading: on the same people stepping into rivers, other and other waters flow. With this reading it is people who remain the same in contrast to changing waters, as if the encounter with a flowing environment helped to constitute the perceiving subject as the same. (See Kahn 1979.)[^kahn-1979] B49a, by contrast, contradicts the claim that one can step into the same rivers (and also asserts that claim), and B91[a], like Plato in the *Cratylus*, denies that one can step in twice. Yet if the rivers remain the same, one surely can step in twice–not into the same waters, to be sure, but into the same rivers. Thus the other alleged fragments are incompatible with the one certifiably genuine fragment.
    step1: |-
      如果承认 B12 为真品，它便倾向于排除另外两则所谓的残篇。这则残篇中主要的理论关联，是“同样的河流”与“另一些水”之间的关联。B12 除其他内容外，是对对立面相合的陈述。但它明确说河是同一条。这一陈述表面上悖谬，却没有理由把它当作虚假或矛盾的。它完全讲得通：我们之所以把一片水体称为河，正因为它由不断变化的水构成；水若停止流动，它就不再是河，而是湖或干涸的河床。于是，在某种意义上，河是一种奇特的存在物：它靠改变其所含之物而保持自身的所是（参休谟《人性论》1.4.6，Selby-Bigge 版第 258 页）。赫拉克利特从日常遭遇中得出一条惊人的洞见。此外，他借第一句的含混提供了另一种读法：在同一批人踏入河流时，另一些水不断涌来。按这种读法，保持同一的是人，与之相对的是变化的水；仿佛与流动环境的相遇，有助于把感知主体建构为同一的。（见 Kahn 1979。）[^kahn-1979] 相比之下，B49a 与“人能踏入同样的河流”这一主张相矛盾（同时又断言了它），而 B91[a] 则像《克拉底鲁》中的柏拉图一样，否认人能两次踏入。然而，如果河保持同一，人当然能两次踏入——当然不是踏入同样的水，而是踏入同样的河。因此，另外两则所谓的残篇与这一则可确证为真的残篇不相容。
