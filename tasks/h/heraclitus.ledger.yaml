      Heraclitus’ influence on culture seems undiminished, appearing prominently in studies of fields as diverse as business management and veterinary medicine. Often cited as the philosopher of flux, Heraclitus now seems to be emerging as the standard-bearer for process philosophy, having displaced more recent icons such as Henri Bergson and Alfred North Whitehead. See, for instance, van Geert and de Ruiter 2022, a major contribution to the discipline of psychology. (On Heraclitus as a process philosopher, see Graham 2011.)[^graham-2011]
    step1: |-
      赫拉克利特对文化的影响似乎并未减弱，显著地出现在像企业管理与兽医医学这样不同的领域的研究中。赫拉克利特常被称作流变的哲学家，如今他似乎正成为过程哲学的旗手，取代了亨利·柏格森与阿尔弗雷德·诺思·怀特海等较近的偶像。例如见 van Geert 与 de Ruiter 2022，这是心理学学科的一部重要著作。（关于赫拉克利特作为过程哲学家，见 Graham 2011。）[^graham-2011]
    step2: |-
      赫拉克利特对文化的影响似乎丝毫未减，连企业管理、兽医医学这样相去甚远的领域，研究中也常常见到他的身影。他常被引为流变的哲学家；如今他似乎正成为过程哲学的旗手，把亨利·柏格森、阿尔弗雷德·诺思·怀特海这些较近的偶像都比了下去。例如 van Geert 与 de Ruiter 2022，就是心理学领域的一部重要著作。（论赫拉克利特之为过程哲学家，见 Graham 2011。）[^graham-2011]
