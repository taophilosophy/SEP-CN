      Although his words are meant to provide concrete vicarious encounters with the world, Heraclitus adheres to some abstract principles which govern the world. Already in antiquity he was famous for advocating the coincidence of opposites, the flux doctrine, and his view that fire is the source and nature of all things. In commenting on Heraclitus, Plato provided an early reading, followed tentatively by Aristotle, and popular down to the present (sharpened and forcefully advocated by Barnes 1982, ch. 4)[^barnes-1982]. According to Barnes’ version, Heraclitus is a material monist who believes that all things are modifications of fire. Everything is in flux (in the sense that “everything is always flowing in *some* respects,” 69), which entails the coincidence of opposites (interpreted as the view that “every pair of contraries is somewhere coinstantiated; and every object coinstantiates at least one pair of contraries,” 70). The coincidence of opposites, thus interpreted, entails contradictions, which Heraclitus cannot avoid. On this view Heraclitus is influenced by the prior theory of material monism and by empirical observations that tend to support flux and the coincidence of opposites. In a time before the development of logic, Barnes concludes, Heraclitus violates the principles of logic and makes knowledge impossible.
    step1: |-
      虽然他的词句意在让人具体地间接遭遇世界，赫拉克利特仍坚持一些支配世界的抽象原则。早在古代，他就以主张对立面的相合、流变学说以及火是万物的本源与本性而闻名。柏拉图在评论赫拉克利特时提供了一种早期的解读，亚里士多德犹疑地加以追随，这种解读一直流行至今（由 Barnes 1982 第 4 章加以锐化并强力主张）[^barnes-1982]。按照 Barnes 的版本，赫拉克利特是一位物质一元论者，认为万物都是火的变形。一切都在流变（其意义是“万物总在 *某些* 方面流动着”，69），这就蕴含对立面的相合（被解释为这样一种观点：“每一对对立面都在某处同时被实例化；而且每个对象都至少同时实例化一对对立面”，70）。如此解释的对立面相合蕴含矛盾，而赫拉克利特无法避免矛盾。按照这种看法，赫拉克利特受到先前的物质一元论理论以及倾向于支持流变与对立面相合的经验观察的影响。Barnes 总结说，在逻辑学发展之前的时代，赫拉克利特违反了逻辑原则，使知识成为不可能。
    step2: |-
      赫拉克利特的词句固然要让人具体地、间接地遭遇世界，但他同时也持守若干支配世界的抽象原则。早在古代，他就以三条主张闻名：对立面相合、流变学说，以及火是万物的本源与本性的看法。柏拉图评论赫拉克利特时给出了一种早期解读，亚里士多德半信半疑地跟着走，这种解读一直流行到今天（Barnes 1982 第 4 章加以锐化并大力主张）[^barnes-1982]。按 Barnes 的版本，赫拉克利特是物质一元论者，认为万物都是火的变体。一切都在流变（意思是“万物总在 *某些* 方面流动”，69 页），而这就蕴含着对立面相合（解释为：“每一对对立面都在某处同时得到实例化；每个对象都至少同时实例化一对对立面”，70 页）。如此解释的对立面之相合，就蕴含矛盾，赫拉克利特躲不开。照这种看法，赫拉克利特既受先前的物质一元论影响，也受那些倾向于支持流变与对立面相合的经验观察影响。Barnes 的结论是：在逻辑学尚未发展起来的时代，赫拉克利特违反了逻辑原则，使知识成为不可能。
