      The fiery shaft of lightning is a symbol of the direction of the world. Anaximander may have already used the image of the shipmaster of the universe (Kahn 1960: 238)[^kahn-1960]. Heraclitus identifies it with the thunderbolt, itself an attribute of Zeus the storm god. The changes wrought by and symbolized by fire govern the world. The ruling power of the universe can be identified with Zeus, but not in a straightforward way: “One being, the only wise one, would and would not be called by the name of Zeus” (B32). And here the word used for ‘Zeus’ can be rendered “Life.” Like the Milesians, Heraclitus identifies the ruling power of the world with deity, but (like them also) his conception is not a conventional one.
