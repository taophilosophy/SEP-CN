      Heraclitus urges moderation and self-control in a somewhat conventional way (B85, B43). He also recommends the conventional Greek goal of seeking fame: “The best choose one thing above all, the everlasting fame of mortals; the many gorge themselves like cattle” (B29). To die in battle is a superior kind of death (B24). Those who drink to excess make their souls wet, and accordingly harm them (B117), for a healthy soul is dry (B118). Those who experience better deaths attain better rewards (B25). Those who lie will be punished (B28[b]). “For men who die there await things they do not expect or anticipate” (B27). Some of these remarks tend to suggest an afterlife with rewards and punishment, although his belief in a continued existence is controversial (see Nussbaum 1972)[^nussbaum-1972]. In any case, Heraclitus views the soul as the moral and cognitive center of human experience.
