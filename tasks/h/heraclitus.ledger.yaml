  - id: 8
    kind: body
    source: |-
      Heraclitus made every effort to break out of the mold of contemporary thought. Although he was influenced in a number of ways by the thought and language of his predecessors, including the epic poets Homer and Hesiod, the poet and philosopher Xenophanes, the historian and antiquarian Hecataeus, the religious guru Pythagoras, the sage Bias of Priene, the poet Archilochus, and the Milesian philosophers, he criticized most of them either explicitly or implicitly, and struck out on his own path. He rejected *polumathiê* or information-gathering on the grounds that it “does not teach understanding” (B40).[^note-1] He treated the epic poets as fools and called Pythagoras a fraud.
    step1: |-
      赫拉克利特竭尽全力要打破同时代思想的窠臼。尽管他在许多方面受到前人思想与语言的影响，包括史诗诗人荷马与赫西俄德、诗人兼哲学家色诺芬尼、历史家与古物研究者赫卡泰奥斯、宗教导师毕达哥拉斯、普里耶涅的智者比阿斯、诗人阿尔基洛科斯以及米利都的哲学家们，他还是或明或暗地批评了他们中的大多数人，走自己的路。他拒斥 *polumathiê*（博闻多识），理由是它“并不能教人理解”（B40）[^note-1]。他把史诗诗人当作傻瓜，称毕达哥拉斯为骗子。
    step2: |-
      赫拉克利特一心要跳出同时代思想的窠臼。他受前人思想与语言的影响颇多——史诗诗人荷马、赫西俄德，诗人兼哲学家色诺芬尼，史家兼博古家赫卡泰奥斯，宗教导师毕达哥拉斯，普里耶涅的智者比阿斯，诗人阿尔基洛科斯，以及米利都的哲学家们——但对其中大多数人，他都或明或暗地加以批评，最终另辟蹊径。他拒斥 *polumathiê*（博闻多识），理由是“博学并不教人理解”（B40）[^note-1]。他把史诗诗人一概看作傻瓜，骂毕达哥拉斯是骗子。
