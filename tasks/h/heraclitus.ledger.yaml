      The recently published Derveni Papyrus, discovered in a tomb in northern Greece, contains a commentary on an Orphic poem. The commentator discusses some passages of Heraclitus in connection with the poem, namely B3 + B94 (which may have been thus joined in Heraclitus’ book) (column 4). See Betegh 2004. The Oxyrhynchus Papyri (vol. 53, no. 3710) also show that Heraclitus was interested in determining the days of the lunar month and thus in scientific questions. See Burkert 1993. On the Derveni Papyrus material, see Betegh & Piano 2019, 2022; Ranocchia 2019; and Hladky 2022.
    step1: |-
      新近出版的德尔维尼纸草（Derveni Papyrus）发现于希腊北部的一座墓葬，其中包含对一首俄耳甫斯诗篇的注释。注释者在与诗篇相关处讨论了赫拉克利特的一些段落，即 B3 + B94（在赫拉克利特书中，这两则也许原本相连）（第 4 栏）。见 Betegh 2004。《俄克西林库斯纸草》（第 53 卷，第 3710 号）也表明，赫拉克利特有意确定太阴月的日子，因而对科学问题有兴趣。见 Burkert 1993。关于德尔维尼纸草材料，见 Betegh & Piano 2019、2022；Ranocchia 2019；以及 Hladky 2022。
    step2: |-
      新近公布的德尔维尼纸草出土于希腊北部一座墓葬，内容是对一首俄耳甫斯诗篇的注释。注释者在解说诗篇时，论及赫拉克利特的几段文字，即 B3 + B94（在赫拉克利特原书中，两则也许本就相连）（第 4 栏）。见 Betegh 2004。《俄克西林库斯纸草》（第 53 卷第 3710 号）还表明，赫拉克利特关心如何确定太阴月的日期，因而关心科学问题。见 Burkert 1993。关于德尔维尼纸草材料，见 Betegh & Piano 2019、2022；Ranocchia 2019；以及 Hladky 2022。
