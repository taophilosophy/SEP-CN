      Although Heraclitus is not known to have had students, his writings seem to have been influential from an early time. He may have provoked Parmenides to develop a contrasting philosophy (Patin 1899; Graham 2002)[^graham-2002][^patin-1899], although their views have much more in common than is generally recognized (Nehamas 2002)[^nehamas-2002]. Empedocles seems to have invoked Heraclitean themes, and some Hippocratic treatises imitated Heraclitean language and presented applications of Heraclitean themes. Democritus echoed many of Heraclitus’ ethical pronouncements in his own ethics. From an early time Heraclitus was seen as the representative of universal flux in contrast to Parmenides, the representative of universal stasis. Cratylus brought Heraclitus’ philosophy to Athens, where Plato heard it. Plato seems to have used Heraclitus’ theory (as interpreted by Cratylus) as a model for the sensible world, as he used Parmenides’ theory for the intelligible world. As mentioned, both Plato and Aristotle viewed Heraclitus as violating the law of non-contradiction, and propounding an incoherent theory of knowledge based on a radical flux. Yet Aristotle also treated him as a coherent material monist who posited fire as an ultimate principle. The Stoics used Heraclitus’ physics as the inspiration for their own, understanding him to advocate a periodic destruction of the world by fire, followed by a regeneration of the world; Cleanthes in particular commented on Heraclitus. Aenesidemus interpreted Heraclitus as a kind of proto-skeptic (see Polito 2004)[^polito-2004].
    step1: |-
      虽然未闻赫拉克利特有弟子，他的著作似乎很早就有了影响。他也许曾促使巴门尼德发展出一套与之相反的理论（Patin 1899；Graham 2002）[^graham-2002][^patin-1899]，尽管两人的观点共同之处远比一般所承认的要多（Nehamas 2002）[^nehamas-2002]。恩培多克勒似乎援用过赫拉克利特的主题，一些希波克拉底学派论著模仿赫拉克利特的语言，并呈现了赫拉克利特主题的应用。德谟克利特在其自己的伦理学中呼应了赫拉克利特的许多伦理格言。很早以来，赫拉克利特就被视为普遍流变的代表，与普遍静止的代表巴门尼德相对。克拉底鲁把赫拉克利特的哲学带到雅典，柏拉图在那里听到了它。柏拉图似乎把赫拉克利特的理论（按克拉底鲁的解释）用作可感世界的模型，正如他用巴门尼德的理论作可知世界的模型。如前所述，柏拉图与亚里士多德都认为赫拉克利特违反了不矛盾律，并基于彻底的流变提出了一种不融贯的知识理论。然而亚里士多德也把他当作一位融贯的物质一元论者，把火设定为终极原则。斯多亚派以赫拉克利特的物理学为他们自己物理学的灵感，把他理解为主张世界周期性被火毁灭、随后又重生；克勒安忒斯尤其评论过赫拉克利特。埃奈西德穆把赫拉克利特解释为某种原初的怀疑论者（见 Polito 2004）[^polito-2004]。
    step2: |-
      未闻赫拉克利特收过弟子，但他的著作似乎很早就有影响。他也许刺激巴门尼德另立一套相反的理论（Patin 1899；Graham 2002）[^graham-2002][^patin-1899]；不过两人的观点相通之处，远比一般承认的要多（Nehamas 2002）[^nehamas-2002]。恩培多克勒似乎用过赫拉克利特的题目；若干希波克拉底学派论著模仿他的语言，并把他的一些主题付诸应用。德谟克利特在自己的伦理学里，回应了赫拉克利特的许多伦理箴言。很早以来，赫拉克利特就被看成普遍流变的代表，与代表普遍静止的巴门尼德相对。克拉底鲁把他的哲学带到雅典，柏拉图就在那里听到了它。柏拉图似乎把赫拉克利特的理论（经克拉底鲁解释）当作可感世界的模型，正如拿巴门尼德的理论作可知世界的模型。如前所述，柏拉图与亚里士多德都认为赫拉克利特违反不矛盾律，并根据彻底的流变提出了一套不融贯的知识理论。但亚里士多德同时也把他当作融贯的物质一元论者，以火为终极原则。斯多亚派以他的物理学为自己物理学的灵感，把他理解为主张世界周期性焚毁、继而重生；克勒安忒斯尤其对赫拉克利特作过评注。埃奈西德穆则把赫拉克利特解释成某种早期怀疑论者（见 Polito 2004）[^polito-2004]。
