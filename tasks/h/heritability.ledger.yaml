  - id: 8
    kind: body
    source: |-
      Mendelian genetics provides laws that govern the passing on of discrete traits from one generation to the next. For example, Mendel experimentally demonstrated particular patterns of inheritance for smooth and wrinkled peas in a population of pea plants (See Olby 1979 for a discussion of Mendel’s own specific contributions to genetics and Kampourakis 2024 and Raddick 2022 for reflections on Mendel’s contributions and how we should understand them in the context of contemporary genetics.)[^kampourakis-2024][^olby-1979]. Discrete or discontinuous traits contrast with continuous or quantitative traits. Height in humans and leaf number in trees are continuous traits. Continuous traits vary on a continuum that can be represented as a normal distribution, graphed as a bell curve. Most philosophical discussion about heredity and heritability arises from the study of continuous traits.
    step1: |-
      孟德尔遗传学提供了支配离散性状代际传递的定律。例如，孟德尔通过实验演示了豌豆群体中光滑与皱缩豌豆的特定遗传模式（关于孟德尔本人对遗传学的具体贡献的讨论见 Olby 1979，关于孟德尔的贡献及其在当代遗传学语境下应如何理解的反思见 Kampourakis 2024 与 Raddick 2022。）[^kampourakis-2024][^olby-1979]。离散或不连续性状与连续或数量性状形成对照。人类的高度与树木的叶片数目是连续性状。连续性状在可表示为正态分布的连续统上变异，图示为钟形曲线。关于遗传与遗传力的大多数哲学讨论都源于对连续性状的研究。
    step2: |-
      孟德尔遗传学给出的是支配离散性状代际传递的定律。比如，孟德尔用实验演示了一个豌豆群体中圆滑与皱缩两种豌豆的特定遗传模式（关于孟德尔本人对遗传学的具体贡献，见 Olby 1979；至于应当如何理解孟德尔的贡献及其在当代遗传学中的位置，见 Kampourakis 2024 与 Raddick 2022 的反思。）[^kampourakis-2024][^olby-1979]。离散（不连续）性状与连续（数量）性状相对。人的身高、树的叶片数，都是连续性状。连续性状在一个连续统上变异，该连续统可表示为正态分布，画出来就是一条钟形曲线。关于遗传与遗传力的哲学讨论，多半就是从连续性状的研究中生长出来的。
  - id: 9
    kind: body
    source: |-
      The study of quantitative or continuous traits can be carried out by looking simply at phenotypes. For example, if a population of plants varies in height we can ask how much of this variation is due to genes. Assessing the proportion of the variation of a trait in a population that is due to genes is achieved by a statistical method called the analysis of variance (ANOVA). Once this analysis has been carried out a simple formula provides a number between 0 and 1 that is the heritability measure for the trait in question. We use a few simple examples to illustrate the important concepts involved in producing heritability measures.
    step1: |-
      对数量或连续性状的研究可以仅通过考察表型来进行。例如，如果一个植物群体在高度上有变异，我们可以问这种变异有多少是由基因造成的。评估一个群体中性状变异归因于基因的比例，要靠一种叫做方差分析（ANOVA）的统计方法。这项分析一旦完成，一个简单的公式就给出一个 0 与 1 之间的数，即该性状的遗传力测度。我们用几个简单例子来说明产生遗传力测度所涉及的重要概念。
    step2: |-
      研究数量（连续）性状，可以只看表型。比如，一个植物群体在株高上有变异，我们就可以问：这些变异有多少出自基因？评估一个群体中性状变异归因于基因的比例，用的是一种名为方差分析（ANOVA）的统计方法。分析一经完成，一个简单的公式便给出 0 到 1 之间的一个数，这就是该性状的遗传力测度。下面用几个简单的例子来说明构造遗传力测度所涉及的关键概念。
  - id: 10
    kind: body
    source: |-
      Before we consider the analysis of variance and its contribution to heritability measures, it is helpful to understand the general concept of heritability. Heritability is taken to be a measure of genetic influence on variation by both behavior geneticists and animal breeders. On this account, if a trait has high heritability, its varying from individual to individual in a population can be explained genetically. Plomin (2018) and other behavior geneticists adopt this account, whereas Schaffner proposes a weaker construal: “Heritability estimates […] are meant to indicate how much of the phenotypic variation in the population is due to genetic variation” (2016, 10)(See also Longino, 2013.) An imaginary example illustrates one way of assessing heritability. Say we have two students from a class and student *a* is 6′2″ and student *b* is 4′2″. To discover the influence of genes on height, we could clone both students and then swap the clones’ environments and see what happens. In the figure below, the environments that *a* and *b* grew up in are $\rE a$ and $\rE b$. Clones of *a* and *b* are $\rC a$ and $\rC b$.

      $$ \begin{array}{cccl} & \rE a & \rE b & \text{Height results} \ldots \\ \hline 1 & \rC b=4^{\prime}2^{\prime\prime} & \rC a=6^{\prime}2^{\prime\prime} & \text{from genes} \\ \hline 2 & \rC b=5^{\prime}8^{\prime\prime} & \rC a=5^{\prime}8^{\prime\prime} & \text{from genes and environment} \\ \hline 3 & \rC b=6^{\prime}2^{\prime\prime} & \rC a=4^{\prime}2^{\prime\prime} & \text{entirely from environment} \\ \hline \end{array} $$
    step1: |-
      在考察方差分析及其对遗传力测度的贡献之前，先理解遗传力的一般概念会有帮助。行为遗传学家与动物育种者都把遗传力当作对变异的遗传影响的测度。按照这种理解，如果一个性状有高遗传力，那么它在群体中个体之间的变异就可以从遗传上得到解释。普罗明（Plomin）（2018）等行为遗传学家采纳这种理解，而沙夫纳（Schaffner）则提出一种较弱的解读：“遗传力估计……意在表明群体中的表型变异有多少源于遗传变异”（2016, 10）（另见 Longino, 2013。）一个想象的例子说明了评估遗传力的一种方式。假设班上有两个学生，学生 *a* 高 6′2″，学生 *b* 高 4′2″。为了发现基因对身高的影响，我们可以克隆这两个学生，然后交换克隆体的环境，看看会发生什么。在下图中，*a* 和 *b* 成长的环境是 $\rE a$ 和 $\rE b$；*a* 和 *b* 的克隆体是 $\rC a$ 和 $\rC b$。

      $$ \begin{array}{cccl} & \rE a & \rE b & \text{Height results} \ldots \\ \hline 1 & \rC b=4^{\prime}2^{\prime\prime} & \rC a=6^{\prime}2^{\prime\prime} & \text{from genes} \\ \hline 2 & \rC b=5^{\prime}8^{\prime\prime} & \rC a=5^{\prime}8^{\prime\prime} & \text{from genes and environment} \\ \hline 3 & \rC b=6^{\prime}2^{\prime\prime} & \rC a=4^{\prime}2^{\prime\prime} & \text{entirely from environment} \\ \hline \end{array} $$
    step2: |-
      在考察方差分析、看它如何贡献于遗传力测度之前，最好先弄清遗传力的一般概念。行为遗传学家和动物育种者都把遗传力理解为对变异之遗传影响的测度：按这种理解，若某性状遗传力高，则该性状在群体中逐个体而异的情况可以由遗传来解释。普罗明（Plomin）（2018）等行为遗传学家采纳了这种理解，沙夫纳（Schaffner）则提出一个较弱的说法：“遗传力估计……意在指示群体中的表型变异有多少出自遗传变异”（2016, 10）（另见 Longino, 2013。）下面这个虚构的例子展示了评估遗传力的一条途径。设想班里有两名学生，学生 *a* 身高 6′2″，学生 *b* 身高 4′2″。要弄清基因对身高有多大影响，我们可以把两名学生都克隆出来，再交换两个克隆体所处的环境，看看结果如何。在下图中，*a* 与 *b* 各自成长的环境记作 $\rE a$ 与 $\rE b$，*a* 与 *b* 的克隆体记作 $\rC a$ 与 $\rC b$。

      $$ \begin{array}{cccl} & \rE a & \rE b & \text{Height results} \ldots \\ \hline 1 & \rC b=4^{\prime}2^{\prime\prime} & \rC a=6^{\prime}2^{\prime\prime} & \text{from genes} \\ \hline 2 & \rC b=5^{\prime}8^{\prime\prime} & \rC a=5^{\prime}8^{\prime\prime} & \text{from genes and environment} \\ \hline 3 & \rC b=6^{\prime}2^{\prime\prime} & \rC a=4^{\prime}2^{\prime\prime} & \text{entirely from environment} \\ \hline \end{array} $$
