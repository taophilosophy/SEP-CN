      Discussions of the viability of heritability measures were very heated in the 1970s and 1980s. In the 1970s discussions about IQ and race came to a head (this issue was revisited in the 1990s with the publication of Herrnstein and Murray (1994)), and in the late 1970s and early 1980s sociobiology came under critical scrutiny. Both proponents of the hereditary nature of IQ and sociobiologists made a connection between human behavioral traits and genes. Hereditarians in the IQ debates explicitly relied upon twin heritability analyses such as those introduced above. Critics of sociobiology and hereditarianism over IQ included biologists, philosophers and many social scientists as well as many left-leaning political and social activists (See Gould (1981), Paul (1998) and Segerstråle (2000) for some of the relevant history here).
    step1: |-
      关于遗传力测度是否可靠的讨论在 20 世纪 70 年代与 80 年代非常激烈。70 年代，关于 IQ 与种族的讨论达到白热化（这一问题在 90 年代随着赫恩斯坦（Herrnstein）与默里（Murray）（1994）一书的出版而被重新提起），70 年代末与 80 年代初，社会生物学受到批判性审视。IQ 遗传本质论的主张者与社会生物学家都在人类行为性状与基因之间建立了联系。IQ 论战中的遗传论者明确依赖上文介绍的那类双生子遗传力分析。社会生物学与 IQ 遗传论的批评者包括生物学家、哲学家与许多社会科学家，还有许多左翼政治与社会活动家（这里的相关历史见 Gould（1981）、Paul（1998）与 Segerstråle（2000））。
    step2: |-
      围绕遗传力测度是否可靠的争论，在 20 世纪 70、80 年代一度白热化。70 年代，关于 IQ 与种族的争论达到顶点（这一话题在 90 年代随赫恩斯坦（Herrnstein）与默里（Murray）（1994）一书的出版而被重新翻出）；70 年代末到 80 年代初，社会生物学又成了批判审视的靶子。主张 IQ 由遗传决定的人和社会生物学家都把人类行为性状与基因挂起钩来。IQ 论战中的遗传论者明确依赖上面介绍的那种双生子遗传力分析。而社会生物学与 IQ 遗传论的批评者里，既有生物学家、哲学家和众多社会科学家，也有大批左翼政治与社会活动家（这段历史的有关部分见 Gould（1981）、Paul（1998）与 Segerstråle（2000））。
