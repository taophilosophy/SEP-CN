      With the development of fast and affordable SNP chips within the past 20 years, geneticists now have the ability to assess large populations for DNA-based differences between individuals, which confers a new approach to estimating heritability (Mills et al., 2020). The first human genome sequence cost around $1 billion but now entire genomes can be sequenced for between $200 and $2000, rendering lots of genomic data relatively cheaply. SNP chips standardly contain a fraction of each genome and are now very cheap to produce. Through a large family of approaches, genome wide association studies (GWAS) identify statistical associations between SNPs and thousands of phenotypes, from physical traits (e.g., height, weight, BMI, etc.) to behavioral and psychiatric traits (e.g., IQ, schizophrenia, depression, etc.) and, more recently, to social and behavioral outcomes (e.g., educational attainment, household income, and math ability). Most GWAS are conducted as case-control studies: SNP profiles are collected from one population of individuals who share a trait (such as high ADHD or macular degeneration) and these are compared to the SNP profiles of a control population lacking in the trait under investigation.
    step1: |-
      随着过去 20 年里快速而廉价的 SNP 芯片的发展，遗传学家现在有能力在大型人群中评估个体之间基于 DNA 的差异，这带来一种估计遗传力的新进路（Mills 等, 2020）。第一个人类基因组序列耗资约 10 亿美元，而现在为整个基因组测序只需 200 至 2000 美元，大量基因组数据因此变得相对廉价。SNP 芯片通常只包含每个基因组的一小部分，如今生产成本非常低。通过一大家族的方法，全基因组关联研究（GWAS）识别 SNPs 与数千种表型之间的统计关联，这些表型从身体性状（如身高、体重、BMI 等）到行为与精神性状（如 IQ、精神分裂症、抑郁症等），再到更晚近的社会与行为结果（如教育获得、家庭收入与数学能力）。大多数 GWAS 以病例-对照研究的形式进行：从共享某性状的一个个体群体（如高度注意缺陷多动障碍或黄斑变性）收集 SNP 剖面，然后把这些剖面与缺少所研究性状的对照群体的 SNP 剖面进行比较。
    step2: |-
      过去 20 年里，快速而便宜的 SNP 芯片发展起来，遗传学家由此获得了在大人群里评估个体间基于 DNA 的差异的能力，也就有了一条估计遗传力的新路（Mills 等, 2020）。第一条人类基因组序列花了约 10 亿美元（$1 billion）；如今给整个基因组测序只要 200 到 2000 美元（$200–$2000），海量的基因组数据因此变得相对便宜。SNP 芯片一般只含每个基因组的一小部分，如今造价极低。通过一大族方法，全基因组关联研究（GWAS）找出 SNPs 与数千种表型之间的统计关联：从身体性状（如身高、体重、BMI 等），到行为与精神性状（如 IQ、精神分裂症、抑郁症等），再到更晚近的社会与行为结果（如教育获得、家庭收入与数学能力）。多数 GWAS 按病例-对照设计进行：从共享某性状（如重度注意缺陷多动障碍或黄斑变性）的一个人群采集 SNP 剖面，再与缺乏该性状的对照人群的 SNP 剖面对比。
