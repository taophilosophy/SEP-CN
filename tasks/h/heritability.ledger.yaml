      Despite limited publications, there appears to be a growing consensus in the philosophical community that most, if not all, of the old problems with (or criticisms of) traditional heritability measures have not been obviated by the most recent developments in genomics (namely, GWAS, PGS, and SNP-heritability). PGS are embraced by many practitioners in medical genetics and behavior genetics due to their promise of delivering about genes causing traits in individuals, as opposed to rendering population measures. However, Sarkar (2023), for example, argues that, like traditional heritability, PGS are problematized by GxG and GxE interactions and, consequently, are not useful. Relatedly, Woodward and Kendler (2023) argue that PGS are not causal (although they can have useful applications). Serpico (2023) argues that the idealizations built into the models that underlie PGS undermines their effectiveness and Tabery (2023) contends that PGS will not deliver the precise predictions required for “personalized” medicine. Non and Cerdeña (2024), while more sanguine about applications of PGS in medicine than Tabery, recommend caution in the context of genetics of social and behavioral traits. On the other hand, practicing geneticists engaging in philosophical discourse argue that PGS are both causal and useful with respect to all traits (See e.g. Madole and Harden 2023)[^madole-2023]. Lynch (2021) provides a useful overview of appeals to causal language in genetics. Further, Lewontin’s (1974) critical take on the generalizability of heritability — the problem of portability — has been likened to a similar problem of generalizability for PGS (Matthews 2022)[^matthews-2022][^matthews-2022-2].
    step1: |-
      尽管发表成果有限，哲学界似乎正在形成一个日益增长的共识：传统遗传力测度的老问题（或对它们的批评）至少大部分并没有被基因组学的最新发展（即 GWAS、PGS 与 SNP 遗传力）所消除。PGS 受到医学遗传学与行为遗传学许多从业者的拥抱，因为它许诺提供关于基因在个体中导致性状的知识，而不是给出群体层面的测度。然而，例如萨卡尔（2023）论证，与传统遗传力一样，PGS 受到 GxG 与 GxE 交互作用的困扰，因而没有用处。与之相关，伍德沃德（Woodward）与肯德勒（Kendler）（2023）论证 PGS 不是因果的（尽管它们可以有有用的应用）。塞尔皮科（Serpico）（2023）论证，PGS 底层模型中内置的理想化削弱了其效力，塔伯里（2023）则主张 PGS 不会提供“个性化”医疗所需要的精确预测。诺恩（Non）与塞尔德尼亚（Cerdeña）（2024）对 PGS 在医学中的应用比塔伯里乐观，但在社会与行为性状的遗传学语境中建议保持谨慎。另一方面，参与哲学讨论的执业遗传学家则论证，对所有性状而言 PGS 既是因果的又是有用的（如见 Madole and Harden 2023）[^madole-2023]。林奇（2021）对遗传学中诉诸因果语言的做法提供了一个有用的概览。此外，列文廷（1974）对遗传力可推广性的批判（即可移植性问题），已被比作 PGS 面临的类似可推广性问题（Matthews 2022）[^matthews-2022][^matthews-2022-2]。
    step2: |-
      尽管发表成果有限，哲学界似乎正在形成一种日渐壮大的共识：传统遗传力测度的老问题（以及针对它们的批评）至少大部分并没有被基因组学的最新进展（GWAS、PGS 与 SNP 遗传力）打发掉。医学遗传学与行为遗传学的许多从业者拥抱 PGS，图的是它许诺给出“基因在个体身上致连性状”的知识，而不止是群体层面的测度。然而，比如萨卡尔（2023）就论证：与传统遗传力一样，PGS 也被 GxG 与 GxE 交互作用缠住，因此没有用处。与此相关，伍德沃德与肯德勒（2023）论证 PGS 不是因果的（尽管它们可能有实用的应用）。塞尔皮科（2023）论证，PGS 底层模型里内置的理想化削弱了它的效力；塔伯里（2023）则主张，PGS 给不出“个性化”医疗所需的精确预测。诺恩与塞尔德尼亚（2024）比塔伯里更看好 PGS 的医学应用，但在社会与行为性状的遗传学语境中仍然劝人谨慎。另一面，投身哲学讨论的一线遗传学家则主张：对所有性状而言，PGS 既因果又管用（如见 Madole and Harden 2023）[^madole-2023]。林奇（2021）为遗传学中诉诸因果语言的做法提供了一份有用的概览。此外，列文廷（1974）对遗传力可推广性的批判，即所谓可移植性问题（portability），已被拿来与 PGS 面临的类似的可推广性问题相提并论（Matthews 2022）[^matthews-2022][^matthews-2022-2]。
