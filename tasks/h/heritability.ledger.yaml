      Lewontin (2006) later adds “The point of the (1974) paper was to explain why the statistical partitioning of observed variation in phenotype into variance associated with variation in genetic relationship as opposed to variance assigned to environmental dissimilarities does not, in fact, separate genetic and environmental causes in development” (2006, 536). He adds that advances in molecular genetics now make it “possible to provide a detailed molecular analysis of the chain of causation between nucleotide substitution and cell development and function” (Lewontin, 2006, 536). (Sober (1988) also emphasizes this aspect of Lewontin’s criticism of the analysis of variance.) Lewontin makes clear what he takes genetic causation to be: the causal chain from a DNA sequence to a protein product taking place within cells of organisms. His point is that statistical methods of population genetics and behavioral genetics alone are not appropriate to the task of revealing genetic causes construed this way. We revisit this issue in Section 6. recast in light of GWAS and other “molecular” techniques of measuring heritability.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      One response to these kinds of criticisms is to emphasize caution in the use of heritability measures and to re-emphasize Lewontin’s point that such measures do not provide information about the traits of individuals (See e.g. Plomin et al. 1990; 1997, Hamer and Copeland 1998)[^hamer-1998][^plomin-1990]. Kitcher (1985) pointed out in response to this line of defense that words of caution do not seem to be enough and many behavioral geneticists and psychologists still talk as if they can discover the genetic components of human behavioral traits by using heritability analyses. A second line of response is to argue that norms of reaction are almost impossible to generate for complex human traits and, as a result, are not a serious contender in the business of ascertaining the genetic causes of human traits. Lewontin himself introduced this problem for norms of reaction. In organisms whose genotypes and environments can be exhaustively manipulated, a norm of reaction for a particular trait can be produced. Lewontin cites early work on *Drosophila* larvae’s responses to temperature as pioneering work of this kind. The problem for most human traits, particularly human behavioral traits, is that we have no clear sense of either what the relevant genes to examine are or what the range of relevant environments is. This response need not necessarily blunt Lewontin’s critical attack on heritability measures, as in cases where a norm of reaction can be reliably produced, we do have more information about the relations between genes and environment than can be provided by a standard analysis of variance. Further, attempts to experimentally partition the contribution of genetic variance to phenotypic variance run into problems for human traits similar to the problems presented by attempts to generate norms of reaction. The examples in Section 2. above are artificial for a reason: it is hard to establish the relevant genotypes and environments that lead to variance in human traits. The current consensus among philosophers of biology is that heritability analyses are misleading about the genetic causes of human traits but Pearson (2007) provides a cautious defense of the explanatory usefulness of heritability analyses. Omri Tal also presents modest defenses of heritability via his application of probability to heritability analysis. He does this both in cases in which there is assumed to be no gene-environment interaction (2009) and in cases in which there is gene-environment interaction (2011). Sesardic’s (1993 and 2005) work stands in stark contrast both the anti-heritability consensus and the moderate and carefully measured support for heritability provided by Pearson and Tal. Sesardic strongly supports heritability analyses and vehemently criticizes critics of heritability analysis. In recent years other philosophers have come to defend causal interpretations of heritability, such as Lynch and Bourrat (2016). Bourrat (2019), in particular, considers causal interpretations of heritability using an interventionist framework of causation. Finally, work on norms of reaction (see e.g. Pigliucci 2001)[^pigliucci-2001] since Lewontin’s invoking of the measure reinforces his point about the information that can be gained from such analyses.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      There is something of a consensus in many fields (e.g. philosophy of biology, evolutionary biology and population genetics) that heritability measures only have a very limited use (Downes and Kaplan (2022) provide a recent expression of this view). The consensus among philosophers of biology is that broad heritability measures are uninformative but there are a few dissenting voices (e.g. Sesardic 1993 and 2005, Pearson 2007 and Tal 2009 and 2011)[^pearson-2007][^sesardic-1993][^sesardic-2005][^tal-2009][^tal-2011]. (The notion of consensus used here is informal, techniques in science studies and experimental philosophy of science could be used to test claims of consensus.) Kaplan (2000) provides an introduction to heritability and its use in behavioral genetics. Sarkar (1998) presents a sophisticated (and technically quite difficult) treatment of arguments against heritability. Freeman and Heron (1998) present a clear analysis of the problems with the use of heritability measures by proponents of the connection between IQ and race (understanding this analysis requires some knowledge of statistics). Block (1995) presents an overview of arguments against the use of heritability measures in the IQ and race literature. This overview is helpful and specifically designed for a non-technical audience. Sober (1988) presents a defense of Lewontin’s (1974) criticism of the use of the analysis of variance in assessing the role of genes in the formation of traits of individuals and Northcott (2006) provides further helpful analysis of Lewontin’s and Sober’s work. Both Tabery (2014) and Taylor (2014) provide sustained criticism of heritability analysis via their alternate reflections on the nature/nurture debates. Finally, Turkheimer (2000) provides a critical perspective from within behavior genetics on the value of heritability measures derived from twin studies.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Sesardic’s recent work is a criticism of those who invoke Lewontin-style arguments against heritability analyses. He argues in favor of hereditarianism by attacking its critics. He summarizes his complaint as follows: “For some reason in [the heritability] debate philosophers have displayed a surprising lack of intellectual curiosity and analytical acuity” (2005, 9). This is because “they hastily accepted anti-hereditarian arguments that possessed only superficial plausibility” and “are often poorly informed about basic scientific facts in the very domain of their explorations” (2005, 9). Sesardic’s criticism is polemical and does not introduce any new techniques in heritability analysis to the philosophical audience. Rather, he relies on a recapitulation of earlier views, such as those of Jensen, one of the original targets of Lewontin’s critique. There are several spirited responses to Sesardic’s book (Tabery’s 2006 and 2009b reviews are examples)[^tabery-2006][^tabery-2009b] and Gri Oftedal (2005) presents a clarification of the issues at stake between Sesardic and Lewontin.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Part of what is at stake between followers of Lewontin and Sesardic is whether or not $V_{GxE}$ and other components of variance are negligible or significant. This issue is not purely philosophical and can and has been tackled experimentally. Tabery (2009a and 2014) draws attention to a longitudinal study by psychologists Caspi and Moffitt, who show GxE effects in a longitudinal study of human anti-social behavior disorders, in support of a view in line with Lewontin’s. Douglas Wahlsten also pursues this issue in much of his experimental work (Wahlsten 1990 summarizes his theoretical views and Wahlsten and Gottlieb 1997 is a good survey of some of the relevant experimental work on animals)[^wahlsten-1990][^wahlsten-1997]. Further, understanding gene-environment covariance, $\COV(G,E)$, as part of heritability has led some to incorrectly attribute environmental effects on phenotype to genes. Dickens and Flynn (2001) use an example of basketball playing ability, which they label BP, to make this point. They argue that if we assume that BP is highly heritable, there still appears to be a large environmental component to BP. On their account, this makes sense is we take gene/environment covariance seriously. Just as our tall plants, in Section 2. above, can end up in nutrient rich environments that shorter plants do not, tall, athletic individuals are often placed in environments that enhance their BP. As Dickens and Flynn point out, identical twins who are tall and athletic, including those separated at birth, could have parents who play basketball with them or could be placed in basketball training regimens in school or college. In these situations each individual’s BP would increase but it is wrong to attribute this increase in BP to genes for height and athleticism, since the relevant environment has a significant influence on the phenotype.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      There is some irony in the fact that philosophers of biology, who focus their attention almost exclusively on evolutionary biology, are critics of heritability. Heredity is a central component to evolutionary change and heritability analysis, particularly via the notion of realized heritability (see equation (5) above), is an important component of theoretical evolutionary biology (See Lynch and Walsh 1998)[^lynch-1998]. Much of the critical attack on heritability arises against the background of nature/nurture debates (see e.g. Tabery 2014)[^tabery-2014] and concerns over genetic determinism and is best understood as a critical appraisal of behavioral genetics in psychology. There is growing interest among philosophers in critically assessing the notion of heritability in its evolutionary context. The notion of realized heritability is briefly discussed by Samir Okasha (2006) (See also Downes 2010)[^downes-2010] and by Sober (2008). Until recently, thorough discussion of the relations between heritability and other central concepts of evolutionary theory was pursued exclusively by evolutionary biologists (See e.g. Lynch and Walsh 1998 and Rice 2004)[^lynch-1998][^rice-2004]. Peter Visscher et al.’s (2008) review article is a nice introduction to much of the work in this area. Philosophers have now presented and defended some radical claims about heritability and heredity including the claim that evolution can occur without heredity (see e.g. Earnshaw-Whyte 2012 and Bourrat 2013)[^bourrat-2013]. Focusing on heritability in the context of evolutionary theory is a productive area for philosophical research as evidenced by Bourrat’s (2014) examination of the role of heritability in the recipe approach to evolution by natural selection. Finally, further expanding philosophical perspectives of heritability in evolutionary biology, Bourrat (2022) attempts to develop a ‘unified’ conception of heritability.
    step1: TBD
    step2: TBD
