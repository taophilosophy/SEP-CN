  - id: 2
    kind: body
    source: |-
      A heritable trait is most simply an offspring’s trait that resembles the parents’ corresponding trait more than it resembles the same trait in a random individual in the population. Inheritance or heredity was a focus of systematic research before its inclusion as a key concept within evolutionary theory. The systematic study of heredity in the 20ᵗʰ century focused on the gene as the unit of heredity. (There is a vast amount of helpful work on the history of heredity including Keller (2002), Griesemer (1994), Morange (1998), Moss (2003), Sapp (2003), Sarkar (1998), Wade (1992), Winther (2000; 2001) and contributors to Buerton et al. (eds.) (2000).) Two traditions now dominate the study of heredity: population genetics and molecular biology. The notion of a quantitative measure of the heritability of any given trait comes from population genetics and heritability measures are commonly used in behavioral genetics (Plomin et al. 1990 and Plomin et al. 1997 and see Panofsky 2014, Tabery 2014, Taylor 2014 and Turkheimer 2000 for critical reflection on behavioral genetics and heritability analysis)[^panofsky-2014][^plomin-1990][^plomin-1997][^tabery-2014][^taylor-2014][^turkheimer-2000]. The idea that what is inherited is a stock of DNA, or the information contained in the DNA sequence, comes from molecular biology.
    step1: |-
      可遗传性状最简单地说，就是一个后代的性状，它与亲本对应性状的相似程度，高于它与群体中随机个体的同一性状的相似程度。遗传或遗传性在被纳入演化理论的关键概念之前，就已是系统研究的焦点。20 世纪对遗传的系统研究聚焦于作为遗传单位的基因。（关于遗传史有大量有益的研究，包括 Keller（2002）、Griesemer（1994）、Morange（1998）、Moss（2003）、Sapp（2003）、Sarkar（1998）、Wade（1992）、Winther（2000; 2001），以及 Buerton 等编（2000）文集的撰稿人。）如今支配遗传研究的有两大传统：群体遗传学与分子生物学。对任一给定性状的遗传力给出定量测度的观念来自群体遗传学，而遗传力测度则常用于行为遗传学（Plomin 等 1990 与 Plomin 等 1997；对行为遗传学与遗传力分析的批判性反思另见 Panofsky 2014、Tabery 2014、Taylor 2014 与 Turkheimer 2000）[^panofsky-2014][^plomin-1990][^plomin-1997][^tabery-2014][^taylor-2014][^turkheimer-2000]。所谓被遗传者是一份 DNA 存量或 DNA 序列所含的信息，这一观念来自分子生物学。
    step2: |-
      所谓可遗传性状，粗略地说，就是后代的某一性状与亲本对应性状的相似度，超过它与群体中随机个体同一性状的相似度。在被纳入演化理论的关键概念之前，遗传（inheritance 或 heredity）就已是系统研究的焦点。20 世纪对遗传的系统研究以基因作为遗传单位。（遗传史方面的有益研究汗牛充栋，如 Keller（2002）、Griesemer（1994）、Morange（1998）、Moss（2003）、Sapp（2003）、Sarkar（1998）、Wade（1992）、Winther（2000; 2001），以及 Buerton 等编（2000）中的各撰稿人。）如今主宰遗传研究的是两大传统：群体遗传学与分子生物学。为任一性状的遗传力构造定量测度的想法出自群体遗传学，遗传力测度则常见于行为遗传学（Plomin 等 1990、Plomin 等 1997；对行为遗传学与遗传力分析的批判性反思另见 Panofsky 2014、Tabery 2014、Taylor 2014、Turkheimer 2000）[^panofsky-2014][^plomin-1990][^plomin-1997][^tabery-2014][^taylor-2014][^turkheimer-2000]。至于被遗传的东西是一份 DNA 储备或 DNA 序列所含的信息，这一观念来自分子生物学。
  - id: 3
    kind: body
    source: |-
      Philosophical discussions of heredity have predominantly focused on the sustainability of heritability analyses. Here we introduce the concept of heritability, its theoretical history, alternate approaches to determining the heritability of traits and the philosophical problems associated with these alternate approaches.
    step1: |-
      关于遗传的哲学讨论大多集中于遗传力分析的可持续性。这里我们介绍遗传力概念、它的理论历史、确定性状遗传力的各种替代进路，以及与这些替代进路相关的哲学问题。
    step2: |-
      哲学界关于遗传的讨论，大多聚焦在遗传力分析能否站得住脚这一点上。这里我们将介绍遗传力概念、它的理论历史、确定性状遗传力的另类进路，以及与这些进路相伴而生的哲学问题。
