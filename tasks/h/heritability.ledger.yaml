    source: |-
      Given the disappointing proportions of variance accounted for by individual SNP hits identified by GWAS, behavior geneticists and researchers in socio-genomics have developed polygenic risk scores (PRS) or, more recently, polygenic scores (PGS) (The term polygenic index (PGI) is also used by some researchers for the same measure.). In the simplest form, a PGS represents a sum of the many, miniscule effects of all SNPs significantly associated with a phenotype of interest (See Mills et al., 2020, 105). With N referring to the number of statistically significant SNPs, and *$β_i$* as the beta (or effect size) of each individual variant (*i*) for an individual sample of DNA (*j*), a basic polygenic score is calculated using the following formula:

      $$PGS_j = ∑_i^Nβ_i$$
    step1: |-
      鉴于 GWAS 找到的单个 SNP 位点所能解释的方差比例令人失望，行为遗传学家与社会基因组学研究者发展了多基因风险评分（PRS），或更晚近的多基因评分（PGS）（一些研究者也对同一测度使用“多基因指数”（PGI）一词）。在最简单的形式中，PGS 是与一个目标表型显著相关的全部 SNPs 的许多微小效应之和（见 Mills 等, 2020, 105）。设 N 为统计显著的 SNPs 数目，*$β_i$* 为每个变异（*i*）对一个 DNA 样本（*j*）的 beta（或效应量），则基本的多基因评分用下式计算：

      $$PGS_j = ∑_i^Nβ_i$$
    step2: |-
      GWAS 找到的单个 SNP 位点能解释的方差份额令人失望。有鉴于此，行为遗传学家与社会基因组学研究者发展出了多基因风险评分（PRS），以及更晚近的多基因评分（PGS）（有些研究者把同一测度称作“多基因指数”（PGI））。在最简单的形式下，PGS 就是与目标表型显著相关的全部 SNPs 之无数微小效应的总和（见 Mills 等, 2020, 105）。令 N 为统计显著的 SNPs 个数，*$β_i$* 为每个变异（*i*）对某份 DNA 样本（*j*）的 beta 值（效应量），基本的多基因评分就按下式计算：

      $$PGS_j = ∑_i^Nβ_i$$
