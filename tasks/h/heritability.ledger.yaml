      Since Maher (2008) first coined the term “missing heritability,” statisticians and geneticists have written extensively about the issue. In nearly all cases, contributors speak to possible explanations for why there is missing heritability and emphasize technological and methodological solutions that should close the numerical gap between traditional and SNP-heritability estimates (But see Turkheimer 2011)[^turkheimer-2011]. Explanations for missing heritability typically focus on various manners in which standard format GWAS are unable to track genetic effects that are unavoidably part and parcel of twin and family studies. Notably, contributors appeal to non-linear interactions between genetic variants (‘GxG interaction’, or epistasis). Epistatic interactions between SNPs entail that the effect of a given SNP will be modified (enhanced or diminished, for example) in the presence of another SNP, which violates the additivity assumption of SNP-heritability. Similarly, gene-environment interaction and epigenesis have been proposed as explanations for missing heritability (Zuk et al. 2012)[^zuk-2012]. Specific variants or groups of variants may have effects that are enhanced, diminished, or even muted with different environments, again violating the additivity assumption of SNP-heritability. Some missing heritability may be attributable to the presence of low-frequency, high-penetrance variants, which require massive samples to detect (Zuk et al. 2014)[^zuk-2014].
    step1: |-
      自马赫（Maher）（2008）首创“遗传力缺失”一词以来，统计学家与遗传学家就这个问题写了大量文字。几乎所有情况下，撰稿人都在谈遗传力缺失可能有哪些解释，并强调那些应该能弥合传统与 SNP 遗传力估计之间数值差距的技术与方法学解决方案（但见 Turkheimer 2011）[^turkheimer-2011]。对遗传力缺失的解释通常聚焦于标准格式 GWAS 无法追踪的各种遗传效应，而这些效应不可避免地是双生子与家系研究的一部分。值得注意的是，撰稿人们诉诸遗传变异之间的非线性交互（“GxG 交互”或上位性）。SNPs 之间的上位性交互意味着，某个 SNP 的效应会在另一个 SNP 存在时被改变（比如被增强或削弱），这就违反了 SNP 遗传力的可加性假定。类似地，基因-环境交互与表观遗传（epigenesis）也被提出作为遗传力缺失的解释（Zuk 等 2012）[^zuk-2012]。特定变异或变异群可能在不同环境中效应被增强、削弱甚至消音，这同样违反 SNP 遗传力的可加性假定。部分遗传力缺失可归因于低频、高外显率变异的存在，检测它们需要海量样本（Zuk 等 2014）[^zuk-2014]。
    step2: |-
      自马赫（2008）首创“遗传力缺失”一词以来，统计学家与遗传学家围绕这个问题写了大量东西。几乎在所有场合，撰稿人谈的都是遗传力缺失可能的解释，并强调那些理应弥合传统估计与 SNP 遗传力估计之数值落差的技术与方法学方案（但见 Turkheimer 2011）[^turkheimer-2011]。这些解释通常聚焦于标准格式的 GWAS 追踪不到的种种遗传效应，而这些效应又不可避免地是双生子与家系研究要一并算进来的。值得一提，撰稿人们诉诸遗传变异间的非线性交互（“GxG 交互”，即上位性）。SNPs 之间的上位性交互意味着：某个 SNP 的效应会因另一个 SNP 的在场而被修改（比如放大或削弱），这就违反了 SNP 遗传力的可加性假定。类似地，基因-环境交互与表观遗传（epigenesis）也被提出来解释遗传力缺失（Zuk 等 2012）[^zuk-2012]。特定变异或变异群在不同环境下，效应可能被放大、削弱甚至消音，这同样违反 SNP 遗传力的可加性假定。还有一部分遗传力缺失，可能要归到低频、高外显率变异头上，这类变异的检测需要海量样本（Zuk 等 2014）[^zuk-2014]。
