      对模态论者而言，模态的正确分析不涉及对可能事态或可能世界的量化。（关于模态论，参见福布斯（1992）、梅利亚（2003: 81–98）与皮科克（1999: 155–159）。）相反，模态概念应依据模态逻辑的方框与菱形等原始模态算子来理解。由于模态论者不作关于可能事态或可能世界的量化，此性论与反此性论便不能依据这些实体之间的差异来表述。但依照斯科（2008），模态论者仍可如下刻画反此性论：**模态论者式反此性论**：必然地，世界若不发生质性改变，便不可能发生非质性改变。在模态论框架内，此性论因此等价于对模态论者式反此性论的否定。
    step2: |
