  - id: 10
    source: |
      **Possibility Haecceitism**: There are distinct maximal possibilities that differ only with respect to the non-qualitative possibilities they include.
    step1: |
      **可能事态此性论**：存在彼此有别的极大可能事态，它们仅在各自包含的非质性可能事态上不同。
    step2: |
      **可能事态此性论**：存在彼此有别的极大可能事态，它们仅在所包含的非质性可能事态上不同。
  - id: 11
    source: |
      According to Possibility Haecceitism, maximal possibilities that *differ haecceitistically* include the very same qualitative possibilities and differ only in terms of the non-qualitative possibilities they include. So, while most everyone holds that there are maximal possibilities that differ qualitatively *and* non-qualitatively from actuality, haecceitistic differences are distinctive: they divide maximal possibilities that differ only non-qualitatively.
    step1: |
      按照可能事态此性论，**在此性论上不同**的极大可能事态包含完全相同的质性可能事态，仅在所包含的非质性可能事态上不同。所以，尽管几乎人人都承认存在与现实在质性**和**非质性上都不同的极大可能事态，此性论差异却是独特的：它们划分出仅在非质性上不同的极大可能事态。
    step2: |
      按照可能事态此性论，**在此性论上不同**的极大可能事态包含完全相同的质性可能事态，而仅在所包含的非质性可能事态上不同。因此，尽管几乎人人都承认存在与现实在质性**和**非质性上都不同的极大可能事态，此性论差异却是独特的：它们划分出仅在非质性上彼此不同的极大可能事态。
