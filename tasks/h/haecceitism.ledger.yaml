    source: |
      Those who reject the expressive limitations of modalism can help themselves to richer ontological resources in characterizing haecceitism. For example, if quantification over possibilities is permitted, two distinctions among possibilities prove especially useful for formulating haecceitism. According to the first distinction, some possibilities are *maximal*: they are total ways the entire world could have been. So, for any possibility, a maximal possibility includes that possibility or its negation. (On some views, talk of possibilities including other possibilities is understood in terms of entailment. On other views, “inclusion” is understood in terms of set membership—e.g., membership relations between sets of propositions. Here, inclusion is taken as a neutral bit of terminology.) In contrast, *non-maximal* possibilities like the possibility that Obama is human are less than total ways things could have been.
    step1: |
      拒绝模态论表达局限的人，可以在刻画此性论时借助更丰富的本体论资源。例如，若允许对可能事态的量化，那么可能事态之间的两种区分对表述此性论尤显有用。按第一种区分，有些可能事态是**极大**的：它们是整个世界可能呈现的总体方式。所以，对任何可能事态而言，一个极大可能事态包含该可能事态或其否定。（在有些观点中，一个可能事态包含另一个可能事态的说法依据衍推来理解。在另一些观点中，“包含”依据集合隶属来理解——例如命题集合之间的隶属关系。这里把“包含”视为中性的用语。）相反，**非极大**可能事态，例如“奥巴马是人”这一可能事态，则小于事物可能呈现的总体方式。
    step2: |
      拒绝模态论表达局限的人，可在刻画此性论时借助更丰富的本体论资源。例如，若允许对可能事态进行量化，那么可能事态之间的两种区分对表述此性论尤显有用。按第一种区分，有些可能事态是**极大**的：它们是整个世界可能呈现的总体方式。因此，对任何可能事态而言，一个极大可能事态总包含该可能事态或其否定。（在有些观点中，一可能事态包含另一可能事态的说法依衍推来理解；在另一些观点中，“包含”依集合隶属来理解——例如命题集合之间的隶属关系。此处将“包含”视为中性用语。）相反，**非极大**可能事态，如“奥巴马是人”这一可能事态，则小于事物可能呈现的总体方式。
