      尽管可能事态此性论要求对可能事态的量化，它却对可能世界保持沉默。但对多数关于可能世界的实在论者而言，对极大可能事态的量化要求对可能世界的量化，或干脆与之等价。通常，这类关于可能世界的实在论观点把每个极大可能事态等同于一个唯一的可能世界，并把非极大可能事态等同于可能世界的集合。而且，尽管把可能事态还原为可能世界的观点可用可能事态此性论来表达此性论，有些人却可能把此性论解释为关于质性上不可分辨世界的论题。这种观点会试图把此性论表述为如下论题：
