      One might hold that Hutcheson, by the time he wrote the *System*, had changed his view. Indeed, the *Essay*’s first edition was published in 1728, and the *System* was a much later book, left unpublished at the time of his death. A standard view is that Hutcheson’s thinking changed substantially once we reach the *System* (Carey 2005: v–vi; Scott 1900: 214)[^carey-2005][^scott-1900]. However, this explanation is somewhat unsatisfactory, for at least one reason. Hutcheson was a perennial tinkerer. The *Essay* underwent no fewer than three separate revised editions during Hutcheson’s lifetime. The final, third, edition of the *Essay* was completed and published in 1742. But the *System*, while it was not published until after Hutcheson’s death in 1755, was substantially complete by 1737, five years *earlier* than the final revised edition of the *Essay*. And hence were Hutcheson to have changed his view concerning the nature of the property of goodness, one would certainly expect to see this change reflected in the text of the *Essay*, which was revised as of 1742. But one doesn’t. (This is especially striking given that Hutcheson was not shy about making very substantive changes in later editions of his work; this is especially true of the four editions of the *Inquiry*.)
    step1: |-
      人们可能主张，到哈奇森写《体系》时，他已经改变了自己的观点。的确，《论激情》第一版出版于 1728 年，而《体系》是晚得多的著作，在他去世时尚未出版。一种标准观点是，一旦我们到达《体系》，哈奇森的思想发生了实质变化（Carey 2005: v–vi; Scott 1900: 214）[^carey-2005][^scott-1900]。然而，这种解释至少有一个理由而不太令人满意。哈奇森是一位长期的修补者。《论激情》在哈奇森生前经历了不少于三个独立修订版。其最终、第三版于 1742 年完成并出版。但《体系》虽然直到哈奇森 1755 年去世后才出版，却在 1737 年已大体完成，比《论激情》最终修订版*早*五年。因此，如果哈奇森就善性属性的性质改变了他的观点，人们当然会预期看到这一变化反映在 1742 年修订的《论激情》文本中。但人们看不到。（这尤其引人注目，因为哈奇森并不羞于在其著作的后来版本中作出非常实质性的修改；对《探究》的四个版本尤其如此。）
