      Put another way, Hutcheson holds that his aim in discussing the very nature of virtue, benevolence, and the moral sense, is to persuade people to act in such a way as to develop “their greatest happiness and perfection” (see Heydt 2009)[^heydt-2009]. And to this end, it is important to note that Hutcheson steadfastly maintains that virtuous behavior is in the interest of the virtuous. Of course, given that Hutcheson holds that behavior is virtuous insofar as it is motivated by benevolence and *not* self-interest, it is impossible (on Hutcheson’s view) to *pursue* one’s self-interest through virtuous behavior. To be motivated by self-love diminishes, to that extent, the virtue of one’s action.
