      Hutcheson also spends considerable time examining the positions of Clarke and Wollaston in detail. For Clarke, moral distinctions derive from the relations of fitness and unfitness, which are themselves eternal. For Hutcheson, any construal of such relations as morally significant must presuppose a moral sense. As Hutcheson notes, we do not morally praise the relations between, e.g., the natural numbers as in mathematics, or the fitness of certain chemical compositions. The fitness of a sword to end someone’s life is in and of itself morally neutral. And the fitness of an action to its end is also morally neutral—some actions are just as fit to human misery as other actions are fit to human happiness. Of course, one might hold that the fitness relation is simply to be applied (in a morally interesting sense) to the ultimate end of action. Happiness, in other words, is “fit”; misery “unfit”. But, according to Hutcheson, what does this mean? It cannot be “fit” to, say, give rise to some other thing—that’s what makes it an *ultimate* end. But any explication that would render some particular end as “fit” seems, according to Hutcheson to presuppose an *independent* evaluation beyond its “fitness”. (Though for a reading of Hutcheson that suggests significant continuity between Hutcheson and Clarke, see Sheridan 2007.)[^sheridan-2007]
    step1: |-
      哈奇森也花了大量时间详细考察克拉克和沃拉斯顿的立场。对克拉克而言，道德区分源于适合与不适合的关系，而这些关系本身是永恒的。对哈奇森而言，任何把此类关系视为道德上重要的解释都必须预设一种道德感官。正如哈奇森所指出，我们并不道德地赞扬例如数学中自然数之间的关系，或某些化学成分的适合性。一把剑终结某人生命的适合性本身在道德上是中性的。而一个行动对其目的的适合性在道德上也是中性的——有些行动对人类的苦难正如其他行动对人类的幸福一样适合。当然，人们可以主张，适合关系（在道德上有意义的意义上）只是应用于行动的终极目的。换言之，幸福是“适合的”；苦难是“不适合的”。但根据哈奇森，这意味着什么？它不可能“适合”于，比如说，产生某种其他东西——那正是使它成为*终极*目的的东西。但根据哈奇森，任何会把某个特定目的呈现为“适合”的阐释，似乎都预设了超出其“适合性”的*独立*评价。（虽然关于哈奇森的一种解读认为哈奇森与克拉克之间有着显著的连续性，见 Sheridan 2007。）[^sheridan-2007]
