      However, there are major deviations from a straightforward utilitarianism as we might understand it from, e.g., Bentham or Sidgwick (see Albee 1896: 32–35)[^albee-1896]. First, Hutcheson appears to offer us something like a *scalar* utilitarianism. On a scalar view, there is no absolute rightness or wrongness, but rather degrees of rightness or wrongness that an action may display (see Norcross 2020)[^norcross-2020]. And while Hutcheson does discuss the notion of “perfect virtue”—achieved when the good one has the ability to do is equal to the good one does—he admits that there will be degrees of virtue (which simply follows given his mathematical calculations), and does not describe the perfection of virtue as any sort of absolute obligation (see Darwall 1997: 87–88)[^darwall-1997]. (Indeed, this point is essential to his critique of Wollaston, §1.4.)
    step1: |-
      然而，与我们可能从例如边沁或西季威克理解的直接功利主义相比，有重大偏离（见 Albee 1896: 32–35）[^albee-1896]。第一，哈奇森似乎为我们提供了一种*标度的*功利主义。按标度观点，没有绝对的正当或不正当，而毋宁是行动可能显示的正当或不正当的程度（见 Norcross 2020）[^norcross-2020]。而且，虽然哈奇森确实讨论了“完满德性”的概念——即当一个人有能力做的善等于他所做的善时达到——他承认会有德性的程度（这简单地因其数学计算而得出），并且不把德性的完满描述为任何绝对的义务（见 Darwall 1997: 87–88）[^darwall-1997]。（事实上，这一点对他的理性主义批判（§1.4）至关重要。）
    step2: |-
      然而，与我们可能从例如边沁或西季威克理解的直接功利主义相比，有重大偏离（见 Albee 1896: 32–35）[^albee-1896]。第一，哈奇森似乎为我们提供了一种 **标度的** 功利主义。按标度观点，没有绝对的正当或不正当，而毋宁是行动可能显示的正当或不正当的程度（见 Norcross 2020）[^norcross-2020]。而且，虽然哈奇森确实讨论了“完满德性”的概念——即当一个人有能力做的善等于他所做的善时达到——他承认会有德性的程度（这简单地因其数学计算而得出），并且不把德性的完满描述为任何绝对的义务（见 Darwall 1997: 87–88）[^darwall-1997]。（事实上，这一点对他的理性主义批判（§1.4）至关重要。）

