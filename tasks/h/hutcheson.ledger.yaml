      One solution to this puzzle, opted for by some commentators, holds that Hutcheson is a kind of *qualitative* hedonist—a view according to which some pleasures are of higher quality, and therefore more valuable, pleasurableness held equal (Edwards 1979: 30; Riley 2008: 275; Strasser 1987: 518; Crisp 2020: 124)[^crisp-2020][^edwards-1979][^riley-2008][^strasser-1987]. And there are some very tantalizing passages that suggest just this:
