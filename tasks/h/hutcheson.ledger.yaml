      Two things are worth noting here. First, and less interestingly, the phrase “compound Ratio of the Quantity of Good, and Number of Enjoyers” suggests that Hutcheson is inclined toward a form of *average* utilitarianism, rather than *total* utilitarianism (see Smart & Williams 1974: 27–28; Parfit 1984: 420–421)[^parfit-1984]. Furthermore, and compatible with this form of average utilitarianism, Hutcheson holds that small benefits spread over many persons need not compensate for massive evils subjected to few, and that small evils spread over many may be a price worth paying for large benefits for a small number. All this is compatible with standard forms of utilitarian aggregation.
