slug: hutcheson
segments:
  - id: 1
    source: |-
      Francis Hutcheson (1694–1746) was an influential British moralist, an advocate of moral sentimentalism, and a key figure of the Scottish Enlightenment. While Hutcheson was educated, and completed his career, at the University of Glasgow, he was Irish by birth, and returned to Scotland only after his major writings (including the *Inquiry into the Original of our Ideas of Beauty and Virtue*, the *Essay on the Nature and Conduct of the Passions, with Illustrations on the Moral Sense*) had been published, and in some cases extensively revised. Nevertheless, he had a tremendous influence on the Scottish intellectual scene, in part due to his interactions with important Scottish figures of the day, including Adam Smith, Thomas Reid, and David Hume.
    step1: |-
      弗兰西斯·哈奇森（1694–1746）是一位有影响力的英国道德学家、道德情感主义的倡导者，也是苏格兰启蒙运动的关键人物。虽然哈奇森在格拉斯哥大学接受教育并完成其学术生涯，但他生于爱尔兰，并且直到他的主要著作（包括《探究我们关于美与德的观念的起源》、《论激情的天性与行为，附道德感例释》）出版之后，有些还经过大量修订，才返回苏格兰。尽管如此，他对苏格兰知识界产生了巨大影响，部分原因在于他与当时重要的苏格兰人物的交往，包括亚当·斯密、托马斯·里德和大卫·休谟。
    step2: |-
      弗兰西斯·哈奇森（Francis Hutcheson，1694–1746）是英国有影响力的道德学家、道德情感主义的倡导者，也是苏格兰启蒙运动的关键人物。哈奇森在格拉斯哥大学接受教育并度过其学术生涯，但他生于爱尔兰，直到其主要著作——包括《探究我们关于美与德的观念的起源》（*Inquiry into the Original of our Ideas of Beauty and Virtue*）与《论激情的天性与行为，附道德感例释》（*Essay on the Nature and Conduct of the Passions, with Illustrations on the Moral Sense*）——出版、其中一些还经大幅修订之后，才返回苏格兰。尽管如此，他对苏格兰知识界影响深远，部分原因在于他与当时苏格兰重要人物（包括亚当·斯密、托马斯·里德和大卫·休谟）的交往。

  - id: 2
    source: |-
      Leaving aside his influence on the Scottish enlightenment, Hutcheson’s contribution to the broader development of modern British moralism cannot be overstated. His chief philosophical contributions, upon which this entry will concentrate, include his aforementioned *sentimentalism*, his complex *moral psychology*, his *proto-utilitarianism*, his critique of *self-interest theorists* (such as Hobbes and Mandeville), his critique of *rationalists* (such as Clarke and Wollaston), and his attempted *reconciliation of virtue and self-interest*.
    step1: |-
      撇开他对苏格兰启蒙运动的影响不论，哈奇森对现代英国道德主义更广泛发展的贡献怎么强调都不为过。他的主要哲学贡献，也就是本词条将要集中的重点，包括前述的 **情感主义**、其复杂的 **道德心理学**、其 **原初功利主义**、其对 **自利理论家**（如霍布斯和曼德维尔）的批判、其对 **理性主义者**（如克拉克和沃拉斯顿）的批判，以及其 **调和德性与自利** 的尝试。
    step2: |-
      撇开他对苏格兰启蒙运动的影响不论，哈奇森对现代英国道德主义更广泛发展的贡献怎么强调都不为过。他的主要哲学贡献（也是本词条将集中讨论的重点）包括前述的 **情感主义**、其复杂的 **道德心理学**、其 **原初功利主义**、他对 **自利理论家**（如霍布斯和曼德维尔）的批判、他对 **理性主义者**（如克拉克和沃拉斯顿）的批判，以及他 **调和德性与自利** 的尝试。

  - id: 3
    source: |-
      One brief note. Though this entry will concentrate on Hutcheson’s contributions to moral philosophy, Hutcheson also offers views on the nature of human perception (broadly derived from Locke’s *Essay*), first- and second-order theories of aesthetics (see Kivy 1976 [2003])[^kivy-1976], logic (Hutcheson 1756), associationism about human cognition (cf. Gill 1995, 1996; Kallich 1946)[^gill-1995][^kallich-1946], religion (Elton 2008; Harris 2008)[^elton-2008][^harris-2008], and many other topics that must be foregone for lack of space.
    step1: |-
      简短说明一句。虽然本词条将集中于哈奇森对道德哲学的贡献，但哈奇森也对人类知觉的本性提出了看法（大体上源自洛克的 **人类理解论**）、对美学的一阶和二阶理论（见 Kivy 1976 [2003]）[^kivy-1976]、逻辑学（Hutcheson 1756）、关于人类认知的联想主义（参见 Gill 1995, 1996; Kallich 1946）[^gill-1995][^kallich-1946]、宗教（Elton 2008; Harris 2008）[^elton-2008][^harris-2008]，以及许多其他因篇幅所限而不得不略过的主题。
    step2: |-
      这里简短说明一句。虽然本词条将集中于哈奇森对道德哲学的贡献，但哈奇森对人类知觉的本性（大体上源自洛克的 **人类理解论**（*Essay*））、美学的一阶与二阶理论（见 Kivy 1976 [2003]）[^kivy-1976]、逻辑学（Hutcheson 1756）、关于人类认知的联想主义（参见 Gill 1995, 1996；Kallich 1946）[^gill-1995][^kallich-1946]、宗教（Elton 2008；Harris 2008）[^elton-2008][^harris-2008]，以及许多因篇幅所限而不得不略过的主题，也都提出了自己的看法。

