      Given Regius’ disagreement with Descartes about the concept of a human mind, and his rejection of innate ideas, it was not surprising that he also rejected the ontological argument for God’s existence that Descartes had proposed in the Fifth Meditation (AT VII, 65). The Dutch philosopher accepted that the “actual and necessary existence of God is comprehended in the idea or concept of God.” He argued, however, that it does not follow from that concept that God exists actually and necessarily. “It merely follows that, if he existed anywhere, he would exist necessarily rather than contingently or that, in that case, he would not be capable of not existing” (Regius 1654, 357).
