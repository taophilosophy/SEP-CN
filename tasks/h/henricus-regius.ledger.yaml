      Once Regius had publicly established his independence vis-à-vis Descartes in 1647, he began to publish a theory of knowledge that reflected his medical interests (Bellis, 2013) and complemented the account of human nature that he adopted in opposition to his former mentor. The result was an epistemology that was closer to that which appeared, almost four decades later, in Locke’s *Essay* than anything that he had read in Descartes. This transition had begun while drafting *Fundamenta physices*, in which Regius denied the need for any innate ideas, including even the idea of God.
