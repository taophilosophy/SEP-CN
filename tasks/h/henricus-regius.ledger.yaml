      Regius acknowledged objections, as early as 1641, to scholastic descriptions of human nature, according to which the human mind or soul was the substantial form of the body that was capable, after death, of existing on its own. As indicated above, he accepted Descartes’ general objections to the intelligibility and explanatory usefulness of substantial forms. It was unclear to him, therefore, how such forms could be used to describe or explain human nature. His reservations about substantial forms were articulated in the draft copy of *Fundamenta physices*, which he had sent to Descartes prior to publication. The latter’s objections caused Regius to delete three of the more controversial claims about God and the soul from the published text. However, they re-appeared in the Corollaries of Regius 1647b, and in the second edition of the text, *Philosophia naturalis* (1654).
    step1: |-
      早在 1641 年，雷吉乌斯就已对经院式的人性描述提出异议。按照那种描述，人的心灵或灵魂是身体的实体形式，死后能够独立存在。如前所述，他接受了笛卡尔对实体形式之可理解性与解释效用的总体反驳。因此对他来说，这样的形式如何能用来描述或解释人性，并不清楚。他对实体形式的保留意见，体现在他于出版前寄给笛卡尔的《自然哲学基础》草稿本中。后者的反对意见使雷吉乌斯从刊行文本中删去了三条关于上帝与灵魂的、更具争议的主张。然而它们在 Regius 1647b 的《附论》以及该书第二版《自然哲学》（1654）中重新出现。
