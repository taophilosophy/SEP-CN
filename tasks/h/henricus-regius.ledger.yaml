      Beyond their philosophical disagreements, there was an accusation of plagiarism by Descartes. He wrote to an acquaintance that he had found almost nothing in *Fundamenta physices* that Regius could not have borrowed from him, but that it also contained many falsities due to Regius’ misunderstanding of them. In particular, Descartes referred to Regius’ explanation of muscle movement, which the Utrecht professor allegedly took from the unpublished manuscript of *Traité de l’homme*. However, because Regius would only have obtained a copy of that manuscript shortly before the publication of his book, and because the figures were lacking, his explanation was misguided (AT IV, 517–518; see also AT IV, 566–567). In later years, Regius denied that he ever had a copy of *L’homme* (Regius 1661b; Bos 2002, *xvi–xx*). Moreover, if Regius did not obtain a copy before 1645, this would mean that the groundwork for his explanation of muscle movement, already laid down in his 1641 disputations, must have been entirely his own work—which also seems doubtful. In any case, these disputations from 1641 show undeniably that the interaction between Descartes and Regius at the time was far more extensive than what we know from their correspondence. Their exchange of letters must have been larger than what survives, which seems likely, and it seems equally likely that they exchanged views during personal conversations (Bos 2017, 104–105)[^bos-2017]. That this exchange of ideas was certainly not one-way is demonstrated by the case of the explanation of magnetism, where an influence appears to have run in the opposite direction (Sander 2020, 721–728)[^sander-2020].
    step1: |-
      除了哲学上的分歧之外，还有笛卡尔的一项剽窃指控。他写信给一位熟人，说他在《自然哲学基础》中几乎找不到任何雷吉乌斯无法从他那里借来的东西，但该书也由于雷吉乌斯的误解而包含许多谬误。他特别提到雷吉乌斯对肌肉运动的解释，这位乌得勒支教授据称取自未刊手稿《论人》（*Traité de l'homme*）。然而，由于雷吉乌斯只可能在其著作出版前不久才得到该手稿的抄本，又由于其中缺少插图，他的解释走入歧途（AT IV, 517–518；另见 AT IV, 566–567）。晚年雷吉乌斯否认自己曾有过《论人》的抄本（Regius 1661b；Bos 2002, *xvi–xx*）。此外，如果雷吉乌斯在 1645 年之前确实没有得到抄本，那就意味着他为肌肉运动解释所奠定的基础——已见于其 1641 年的论辩——必定完全是他自己的工作，而这一点同样可疑。无论如何，这些 1641 年的论辩无可否认地表明：当时笛卡尔与雷吉乌斯的互动远比我们从其书信中所知的广泛。他们的通信量必定大于留存至今的部分，这一点似乎可信；他们同样可能在私下交谈中交换过看法（Bos 2017, 104–105）[^bos-2017]。这种思想交流肯定不是单向的：磁的解释就是例证，那里似乎有一股影响朝相反方向流动（Sander 2020, 721–728）[^sander-2020]。
