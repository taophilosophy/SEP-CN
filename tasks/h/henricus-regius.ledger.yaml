      这是雷吉乌斯解释观的积极一面。消极的一面，与笛卡尔一样，是拒斥经院哲学家所理解的形式与质。例如，雷吉乌斯 1641 年就曾论证：引入一个“有感觉且有生长的灵魂”并不能解释心脏如何工作。他评论道：“这不过是说：心脏由某种东西推动，而那种东西正是我们赖以生活、感觉与运动的原则（因为灵魂就是这么定义的）；至于那究竟是什么，问题并未触及”（Regius 1641b, 第六场论辩，附论，第 V 段）。这样一种对心脏运动的解释，就像用“某种官能”来解释钟表的运动。雷吉乌斯转而主张：我们应当把世界看作一台大机器，并通过假设这台机器如何运转来解释自然现象。
