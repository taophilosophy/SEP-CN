      One would expect the same logic to apply to thinking, as an attribute that does not require a distinct substance. Nonetheless, Regius initially stopped short of saying that. While accepting that divine revelation teaches that the mind is a substance, he emphasized that it is organically united with the body. “The human mind, although it is a substance that is really distinct from the body, is however organic as long as it exists in the body” (1646, 246). The mind was also described as being “united most closely with the body in one substance” (Regius 1646, 248).
