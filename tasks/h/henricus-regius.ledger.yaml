    source: |-
      Regius was born in Utrecht, The Netherlands (the Republic of the Seven United Netherlands at the time), on 29 July 1598, into a wealthy family of brewers, and died on 19 February 1679 in the same city. Following initial studies in Arts at the University of Franeker, he studied medicine at Groningen and Leiden, and subsequently at the University of Montpellier (France). In 1623 he received his MD from the University of Padua (Italy) in front of the renowned medical professors Santorio Santori (1561–1636) and Adrianus Spigelius (1578–1625), as well as the famous philosopher Cesare Cremonini (1550–1631) (Baldassarri 2022)[^baldassarri-2022]. Regius was appointed town physician in Utrecht on his return there in 1625 and, following a period as headmaster of the Latin School at Naarden (where he was challenged about his religious orthodoxy as a Calvinist), he returned to Utrecht in 1634 and was re-appointed town physician in 1637. The Illustrious School of Utrecht had become a university in 1636 and, two years later, Regius was appointed ‘extraordinary’ Professor of Theoretical Medicine and Botany (equivalent to an associate professor, who was paid a significantly reduced salary). The following year, 1639, he was promoted to full professor. In 1640 Regius was awarded a salary increase, on the understanding that he would provide extra lectures to his students on natural philosophy. Since there were already professors of philosophy, mathematics, and theology in place at Utrecht, all of whom were senior to Regius, this extension of his contract included the seeds of subsequent controversies about philosophical and theological theses, and of disputes about disciplinary boundaries at the University.
    step1: |-
      雷吉乌斯 1598 年 7 月 29 日生于荷兰乌得勒支（当时为七联合尼德兰共和国），出身于一个富裕的酿酒商家庭；1679 年 2 月 19 日卒于同一城市。他先在弗拉讷克大学（University of Franeker）修习人文诸科，随后在格罗宁根与莱顿学医，之后又就读于（法国）蒙彼利埃大学。1623 年，他在（意大利）帕多瓦大学获得医学博士，答辩时在场的既有著名医学教授桑托里奥·桑托里（Santorio Santori，1561–1636）与阿德里安·斯皮格利乌斯（Adrianus Spigelius，1578–1625），也有著名哲学家切萨雷·克雷莫尼尼（Cesare Cremonini，1550–1631）（Baldassarri 2022）[^baldassarri-2022]。1625 年雷吉乌斯回到乌得勒支，被任命为市政医生；此后他在纳尔登（Naarden）拉丁学校任校长（其间其加尔文宗正统性受到质疑），1634 年返回乌得勒支，1637 年再度受任市政医生。乌得勒支的“著名学校”（Illustrious School）已于 1636 年升格为大学；两年后，雷吉乌斯被任命为理论医学与植物学的“特任”教授（extraordinary，相当于副教授，薪俸大幅削减）。次年即 1639 年，他升任正教授。1640 年，雷吉乌斯获得加薪，条件是为学生额外讲授自然哲学。由于乌得勒支此时已有哲学、数学与神学教授，且资历均高于雷吉乌斯，这次合同扩展便埋下了后来关于哲学与神学论题之争、以及关于大学学科边界之争的种子。
    step2: |-
      1598 年 7 月 29 日，雷吉乌斯生于荷兰乌得勒支（当时称七联合尼德兰共和国），家道殷实的酿酒商出身；1679 年 2 月 19 日，他卒于同一座城市。他先入弗拉讷克大学（University of Franeker）修人文诸科，继而赴格罗宁根、莱顿学医，后又就读于法国蒙彼利埃大学。1623 年，他在意大利帕多瓦大学获医学博士学位，答辩席上坐着著名医学教授桑托里奥·桑托里（Santorio Santori，1561–1636）、阿德里安·斯皮格利乌斯（Adrianus Spigelius，1578–1625），以及著名哲学家切萨雷·克雷莫尼尼（Cesare Cremonini，1550–1631）（Baldassarri 2022）[^baldassarri-2022]。1625 年他回到乌得勒支，出任市政医生；随后转任纳尔登（Naarden）拉丁学校校长，其间有人就他的加尔文宗正统性提出质疑。1634 年他返回乌得勒支，1637 年再度受任市政医生。乌得勒支的“著名学校”（Illustrious School）1636 年升格为大学；两年后，雷吉乌斯获任理论医学与植物学的“特任”教授（extraordinary，相当于副教授，薪俸大为削减）。次年，即 1639 年，他升任正教授。1640 年他得到加薪，条件是为学生增开自然哲学讲座。此时乌得勒支已有哲学、数学与神学教授，资历都在雷吉乌斯之上；合同上的这次扩展，于是埋下了此后关于哲学与神学命题的论战，也埋下了关于大学学科边界的争执。
  - id: 4
    kind: body
    source: |-
      Regius first came to Descartes’ attention through a mutual friend, Henricus Reneri (1593–1639), and almost immediately (in August 1638) began a correspondence with Descartes, which continued until 1645. In keeping with the custom at that time, he also presided as a professor over disputations at the University (the equivalent of research seminars, presented by students in the form of a defence of theses that were usually composed by their supervisor). The texts of disputations were printed and distributed in advance of their oral presentation. Regius’ disputations were initially concerned with medical matters, such as a controversial disputation supporting Harvey’s theory of blood circulation (Regius 1640a). During the year 1641, Regius considered publishing a book on natural philosophy, and consulted both Descartes and Gisbertus Voetius (1589–1676), the Professor of Theology and University Rector, about his plans. While Descartes recommended that Regius develop his ideas in the form of disputations, Voetius initially advised publication as a monograph, possibly to avoid conflict with faculty members in theology or philosophy. Regius adopted Descartes’ advice and, in April 1641, he began a series of disputations under the title *Physiologia sive cognitio sanitatis* (Regius 1641a).
    step1: |-
      雷吉乌斯最初是通过共同的朋友亨利·雷内里（Henricus Reneri，1593–1639）引起笛卡尔注意的，并几乎立即（1638 年 8 月）开始与笛卡尔通信，通信一直持续到 1645 年。按照当时惯例，他作为教授还在大学主持论辩（disputationes，相当于研究讨论班，由学生以辩护论文的形式进行，论文通常由导师撰写）。论辩文本在口头进行之前便已印行散发。雷吉乌斯最初的论辩涉及医学事务，例如一场支持哈维血液循环理论的有争议论辩（Regius 1640a）。1641 年间，雷吉乌斯考虑出版一部自然哲学著作，并就计划征询了笛卡尔与吉斯伯特·沃埃修斯（Gisbertus Voetius，1589–1676；神学教授兼大学校长）。笛卡尔建议雷吉乌斯以论辩形式阐发其想法，沃埃修斯起初则建议以专著形式出版，这或许是为避免与神学或哲学系教员发生冲突。雷吉乌斯采纳了笛卡尔的建议，于 1641 年 4 月开始以《生理学，或论健康之知识》（*Physiologia sive cognitio sanitatis*）为题的一系列论辩（Regius 1641a）。
    step2: |-
      雷吉乌斯最先经由共同的朋友亨利·雷内里（Henricus Reneri，1593–1639）进入笛卡尔的视野；1638 年 8 月，两人几乎当即开始通信，直到 1645 年才告一段落。当时的风气是，教授须在校内主持论辩（disputationes）——其性质近于研究讨论班，由学生出面为论文辩护，而论文一般出自导师之手。论辩文本先印行散发，然后才进行口头答辩。雷吉乌斯早期主持的论辩多涉医学，其中一场支持哈维的血液循环学说，颇招物议（Regius 1640a）。1641 年，他动了出版自然哲学著作的念头，并把计划分别说给笛卡尔与神学教授、大学校长吉斯伯特·沃埃修斯（Gisbertus Voetius，1589–1676）听。笛卡尔主张用论辩的形式逐步阐发；沃埃修斯起初建议写成专著出版，也许是想避开与神学、哲学两系教员的摩擦。雷吉乌斯听从了笛卡尔，1641 年 4 月起以《生理学，或论健康之知识》（*Physiologia sive cognitio sanitatis*）为题连续举行论辩（Regius 1641a）。
