      These early statements in thesis form of criticisms of Descartes were subsequently expanded in Regius 1654. Many of Descartes’ contemporaries had understood him as arguing that there must be a real distinction between mind and body because it is possible to doubt having a body although it is impossible to doubt having a mind. Regius addressed this argument explicitly:
