      Henricus Regius (in Dutch: Hendrik de Roy) may be recognised today primarily as one of Descartes’ correspondents. However, he was also the author of a textbook of natural philosophy, *Fundamenta physices* (1646), which offered a significant alternative to Cartesian epistemology and metaphysics. His correspondence with Descartes, and his simultaneous controversy with G. Voetius during the 1640s, reflected Regius’ efforts to establish his intellectual independence from scholastic philosophy and Cartesian metaphysics.
    step1: |-
      亨利·雷吉乌斯（Henricus Regius，荷兰语作 Hendrik de Roy）今天或许主要作为笛卡尔的一位通信人被记住。然而，他也是一部自然哲学教科书《自然哲学基础》（*Fundamenta physices*，1646）的作者，该书为笛卡尔式认识论与形而上学提供了一个重要的替代方案。他与笛卡尔的通信，以及 1640 年代与吉斯伯特·沃埃修斯（G. Voetius）同时进行的争论，都反映了雷吉乌斯为确立自己相对于经院哲学与笛卡尔式形而上学的思想独立所作的努力。
    step2: |-
      今天，人们记住亨利·雷吉乌斯（Henricus Regius，荷兰语名 Hendrik de Roy），多半因为他是笛卡尔的通信人之一。其实他还是自然哲学教科书《自然哲学基础》（*Fundamenta physices*，1646）的作者；这部书对笛卡尔式认识论与形而上学提出了一个不容忽视的替代方案。1640 年代，他一面与笛卡尔通信，一面与吉斯伯特·沃埃修斯（G. Voetius）论战，两件事都见出他力图在经院哲学与笛卡尔式形而上学之外挣得思想上的独立。
