      Descartes later joined the controversy in a more public way. He included a letter to a French Jesuit, ‘A Letter to Father Dinet,’ in the second edition of the *Meditations* (1642), which was published in Amsterdam and thus became readily available to his critics in Utrecht. While the letter to Dinet criticised Voetius without naming him explicitly, Descartes’ subsequent *Epistola ad Voetium* (1643) went further by removing the apparent anonymity of his target in the first letter. The complex history of the next few years, which is summarized in Verbeek 1992 and Descartes’ *Correspondence*, included an official ban on the teaching of Cartesian philosophy by the local authority in Utrecht (the Vroedschap), and the establishment by the same authority of a committee of inquiry into the public controversy that resulted from Regius’ teaching of Cartesian philosophy. The official report of the university committee on the whole affair, to date, was published in 1643 as the *Narratio historica* (*Testimonium* 1643; Verbeek 1988, 71–123)[^testimonium-1643][^verbeek-1988]. Meantime, Voetius arranged for one of his supporters, Martinus Schoock (1614–69), to write an extensive critique of Descartes and Cartesianism, which was published as *Admiranda methodus novae philosophiae Renati Des Cartes* (*The Admirable Method*) in Utrecht in 1643 (Schoock 1643)[^schoock-1643]. *The Admirable Method of the New Philosophy of René Descartes* listed, among the most serious charges against Descartes, that he was an atheist and a sceptic, and it implied that he deserved the same treatment as heretics, such as Giulio Cesare Vanini (1585–1619), who had been burned at the stake in Toulouse. While the authorship of this book, Descartes’ replies to it, and various legal charges of defamation and libel continued for some years, Descartes concluded his contribution to the controversy with Voetius in the *Apologetic Letter to the Magistrates of Utrecht*, which was written in 1647 and sent to Utrecht in February 1648 (Bos 1999)[^bos-1999].
    step1: |-
      笛卡尔后来以更公开的方式加入论战。他在《沉思集》第二版（1642）中收入了一封致法国耶稣会士的信——“致迪内神父书”——该版在阿姆斯特丹出版，因而很容易到达乌得勒支批评者的手中。致迪内的信虽未点名却批评了沃埃修斯；笛卡尔随后写的《致沃埃修斯书》（*Epistola ad Voetium*，1643）更进一步，去掉了前一封信中表面上的匿名。此后数年复杂的历史（Verbeek 1992 与笛卡尔《书信集》中有概述）包括：乌得勒支地方当局（市政议会，Vroedschap）正式禁止讲授笛卡尔哲学，同一当局还设立调查委员会来审查雷吉乌斯讲授笛卡尔哲学所引发的公开争论。大学委员会就整个事件的官方报告，迄今所知于 1643 年以《历史叙述》（*Narratio historica*）为题出版（*Testimonium* 1643；Verbeek 1988, 71–123）[^testimonium-1643][^verbeek-1988]。与此同时，沃埃修斯安排他的一位支持者马蒂努斯·斯霍克（Martinus Schoock，1614–69）撰写一篇对笛卡尔与笛卡尔主义的长篇批判，1643 年在乌得勒支以《勒内·笛卡尔新哲学的惊人方法》（*Admiranda methodus novae philosophiae Renati Des Cartes*，即 *The Admirable Method*）为题出版（Schoock 1643）[^schoock-1643]。《勒内·笛卡尔新哲学的惊人方法》在针对笛卡尔的最严重指控中列明他是无神论者与怀疑论者，并暗示他应得到与图卢兹被处以火刑的异端朱利奥·切萨雷·瓦尼尼（Giulio Cesare Vanini，1585–1619）同样的处置。尽管此书的作者归属、笛卡尔的回应以及各种诽谤与中伤的法律指控又延续了数年，笛卡尔最终以《致乌得勒支市政官的申辩书》结束了他对这场与沃埃修斯论战的参与；该书 1647 年写成，1648 年 2 月寄达乌得勒支（Bos 1999）[^bos-1999]。
