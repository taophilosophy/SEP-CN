      1641 年 12 月，沃埃修斯在神学同僚教授的支持下回击雷吉乌斯：他在自己的神学论辩后面附加若干推论（corollaria），指“新哲学”（即笛卡尔主义）的拥护者犯有几项错误——教导人是偶性存在者，为哥白尼主义张目，又借否认实体形式来支持怀疑主义与不敬神。这些回应里还点了笛卡尔的名；在沃埃修斯看来，雷吉乌斯与笛卡尔显然是在联手拆毁乌得勒支所授加尔文宗神学的哲学地基。笛卡尔起初只是从旁指点雷吉乌斯如何得体地回应沃埃修斯。其中一条是：对付实体形式，雷吉乌斯该学他在《气象学》里的做法（AT VI, 239）——不要明言拒斥，只把它们当作真正解释所不需要的东西略去即可。
