      这一斩钉截铁的经验主义主张，又因否认任何“纯粹理智”而得到加强。雷吉乌斯从未诉诸“纯粹知性”作为观念的来源，并常常断言心灵与身体之间的“有机”联系。在其《生理学》第一场论辩中（Bos 2002, 200），他把“有机的”与“无机的”对举，几乎把它当作“依赖身体的”的同义词。身体的有机部分，如神经、静脉或肌肉，需要身体具有某种物理构造才能实施一个动作。因此，把“有机的”用于心灵，便意味着心灵只有在各种身体部位同时正常运作的条件下才能实施心灵运作。
    step2: |-
