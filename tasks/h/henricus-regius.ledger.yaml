      The acceptance of probable hypotheses as the best available was a significant revision of a model of human knowledge, originally derived from Aristotle, according to which genuine knowledge must achieve the degree of certainty that is provided by intuition and demonstration (Clarke 2011)[^clarke-2011]. While other natural philosophers, even at the conclusion of the seventeenth century, refused to classify explanations of natural phenomena as knowledge, because they were uncertain, Regius had accepted in mid-century that such uncertainty is inevitable except in the case of divine revelation. “Although, apart from divine revelation, there is no apodictic certainty about things that exist outside our mind, but only moral or probable and likely certainty, that is still sufficient to perform adequately and to control all the activities of human life, since nothing more is required for them apart from moral or probable truth or the certainty and likelihood of knowledge” (Regius 1654, 351).
    step1: |-
      把可能的假设当作现有最佳者来接受，这是对一种人类知识模型的重大修订。该模型源自亚里士多德，按照它，真正的知识必须达到由直观与证明所提供的那种确定性程度（Clarke 2011）[^clarke-2011]。当其他自然哲学家甚至到十七世纪末还因不确定而拒绝把自然现象的解释归入知识时，雷吉乌斯在世纪中叶就已接受：除神圣启示的情形外，这种不确定是不可避免的。“尽管除神圣启示外，对于存在于我们心灵之外的事物没有必真的确定性，而只有道德的或概然的与可能的确定性，这仍然足以充分实施并掌控人类生活的一切活动，因为除了道德的或概然的真理、知识的确定性与可能性之外，它们并不需要更多”（Regius 1654, 351）。
    step2: |-
      接受“可能的假设就是现有最好的东西”，是对人类知识模型的一次大修订。这模型源自亚里士多德：真正的知识必须达到直观与证明所给的那种确定性（Clarke 2011）[^clarke-2011]。别的自然哲学家直到十七世纪末还不肯把自然现象的解释算作知识，理由就是它们不确定；而雷吉乌斯在世纪中叶已经接受：除神圣启示的情形外，这份不确定躲不掉。“尽管除神圣启示外，对存在于我们心灵之外的事物没有必真的确定性，只有道德的、概然的与可能的确定性，这仍足以妥善实施并掌控人类生活的一切活动；因为除了道德或概然的真理、知识的确定性与可能性，它们并不要求更多”（Regius 1654, 351）。
