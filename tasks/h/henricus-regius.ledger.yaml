      He repeated the denial of innate ideas in the Corollaries of 1647: “The mind does not need innate ideas, or notions, or axioms; its faculty of thinking alone is enough for it to perform its own actions” (Regius 1647b, Corollary 12). Descartes’ reply, in the *Notae* (Descartes 1648)[^descartes-1648], conceded the validity of Regius’ claim by accepting that their disagreement was merely verbal: “I never wrote or claimed that the mind needs innate ideas which are anything other than its faculty of thinking” (AT VIII-2, 357). Regius subsequently generalized his claim, in *Philosophia naturalis* (1654: 335); apart from what is revealed in Scripture, he argued, all thoughts originate in sensory experience.
    step1: |-
      他在 1647 年的《附论》中重申对天赋观念的否认：“心灵不需要天赋观念、概念或公理；单凭其思维官能便足以实施其自身活动”（Regius 1647b, 附论 12）。笛卡尔在《注记》（Descartes 1648）[^descartes-1648]中的回应承认了雷吉乌斯主张的有效性，接受二人的分歧只是字面之争：“我从未写过或主张过心灵需要天赋观念，而那些观念不是别的东西，正是它的思维官能”（AT VIII-2, 357）。雷吉乌斯随后在《自然哲学》（1654: 335）中把这一主张一般化：他论证说，除《圣经》所启示者外，一切思想都起源于感觉经验。
