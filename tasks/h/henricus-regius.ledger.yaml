      Regius also included in the *Corollaries* two other theses that were critical of Descartes and had been omitted from the *Fundamenta Physices*: in thesis 3, he claimed that ‘those who assert that we conceive of the human mind clearly and distinctly as necessarily and really distinct from the body are mistaken’, and in thesis 13 that ‘all common notions that are engraved in the mind derive their origin from the observation of things or from tradition’. Regius also claimed that these conclusions from experience and reason, within the scope of natural philosophy, were consistent with thesis 4, that divine revelation provides indubitable evidence for belief that the human mind is a distinct substance.
