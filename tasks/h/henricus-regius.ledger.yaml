    kind: body
    source: |-
      In November 1641, however, the Utrecht professor inaugurated another series of disputations in which he transgressed from medicine to philosophy and, by implication, into theology, and thereby provoked a controversy that continued for more than a decade. The most explicit challenge to established Aristotelian teaching occurred when one of Regius’ students, Henricus van Loon, claimed during a disputation (8 December 1641) that the human mind and body are two distinct substances which are joined together in an accidental union [*unum per accidens*]. This thesis addressed, perhaps inadvertently, one of the most contentious issues in Christian philosophy and theology, *viz.* how to understand the unity of human nature, as experienced by each subject, and at the same time defend the traditional Christian beliefs in the immortality of the human soul or mind and the resurrection of the body. The immortality of the soul seemed to presuppose that the mind or soul was capable of existing without the body and, for that reason, that it should be classified as an Aristotelian substance. When Descartes was informed about this disputation (when it was already too late to recommend amendments), he responded that there was hardly anything more likely to offend or antagonize theologians than to say that a human being “is an accidental being” (AT III, 460: Bos 2002, 90–91).
    step1: |-
      然而 1641 年 11 月，这位乌得勒支教授又开启了一系列论辩，从医学越界进入哲学，并连带进入神学，从而引发了一场持续十余年的争论。对既有亚里士多德学说的最明确挑战，发生在雷吉乌斯的学生亨里库斯·范·隆（Henricus van Loon）于一场论辩（1641 年 12 月 8 日）中主张：人的心灵与身体是两种彼此有别的实体，它们以偶性统一（*unum per accidens*）的方式结合在一起。这一论题或许在无意之间触及基督教哲学与神学中最具争议的问题之一，即如何理解每个主体所体验的人性之统一，同时又维护基督教关于人的灵魂或心灵不朽、以及身体复活的传统信仰。灵魂不朽似乎预设心灵或灵魂能够离开身体而存在，因而应被归为亚里士多德意义上的实体。笛卡尔得知这场论辩时（已来不及建议修改），回应说：几乎没有什么比说人“是一个偶性存在者”更容易冒犯或激怒神学家了（AT III, 460：Bos 2002, 90–91）。
    step2: |-
      然而 1641 年 11 月，这位乌得勒支教授又开了一系列论辩，从医学一路越进哲学，又连带闯进神学，由此引出的争论延续了十多年。对既有亚里士多德学说的最明白的挑战，出在雷吉乌斯的学生亨里库斯·范·隆（Henricus van Loon）身上：他在 1641 年 12 月 8 日的一场论辩中主张，人的心灵与身体是两种彼此有别的实体，二者以偶性统一（*unum per accidens*）的方式相结合。这一论题也许是无心之举，却正撞上基督教哲学与神学中最难缠的问题之一：既要理解每个主体所体验到的人性统一，又要守住基督教关于灵魂或心灵不朽、身体复活的传统信仰。灵魂不朽似乎先已假定：心灵或灵魂能离开身体而存在，因此应当归入亚里士多德意义上的实体。笛卡尔得知这场论辩时已经来不及提出修改意见，他的回应是：说人“是一个偶性存在者”，几乎再没有别的话更能冒犯或激怒神学家了（AT III, 460：Bos 2002, 90–91）。
