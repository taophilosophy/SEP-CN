      笛卡尔后来以更公开的姿态加入战局。他在《沉思集》第二版（1642）里塞进了一封致法国耶稣会士的信，即“致迪内神父书”；此版刊于阿姆斯特丹，乌得勒支的批评者们很容易读到。致迪内的信批评了沃埃修斯，却未点名；随后笛卡尔又写《致沃埃修斯书》（*Epistola ad Voetium*，1643），干脆撕掉了前一封信那层表面上的匿名。此后数年的复杂历史（概述见 Verbeek 1992 与笛卡尔《书信集》）包括：乌得勒支地方当局（市政议会，Vroedschap）明令禁止讲授笛卡尔哲学，同一当局又设立调查委员会，审查雷吉乌斯讲授笛卡尔哲学激起的公开争论。大学委员会就全部事件出具的官方报告，迄今所知以《历史叙述》（*Narratio historica*）为题于 1643 年印行（*Testimonium* 1643；Verbeek 1988, 71–123）[^testimonium-1643][^verbeek-1988]。与此同时，沃埃修斯授意支持者马蒂努斯·斯霍克（Martinus Schoock，1614–69）执笔，写成一部讨伐笛卡尔与笛卡尔主义的长文，1643 年在乌得勒支以《勒内·笛卡尔新哲学的惊人方法》（*Admiranda methodus novae philosophiae Renati Des Cartes*，即 *The Admirable Method*）为题刊出（Schoock 1643）[^schoock-1643]。这部《惊人方法》把“无神论者”“怀疑论者”列为对笛卡尔最严重的指控，还暗示他理应领受与朱利奥·切萨雷·瓦尼尼（Giulio Cesare Vanini，1585–1619）同样的下场——后者作为异端已在图卢兹被处以火刑。此书作者归属、笛卡尔的回击，连同各类诽谤与中伤的法律官司又拖了几年；最后，笛卡尔以《致乌得勒支市政官的申辩书》收束了自己在沃埃修斯之争中的分量：该书 1647 年写成，1648 年 2 月送达乌得勒支（Bos 1999）[^bos-1999]。
