      It follows from this kind of speculative reasoning about the unobservable inner structure of natural phenomena that scientific knowledge is only more or less probable. If we imagine a likely cause of some phenomenon as a configuration of unobservable particles and, despite further research, cannot discover another possible cause that is either as likely or more likely, we should rest content with the first hypothesis until something better is discovered.
