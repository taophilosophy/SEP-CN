      Since all ideas originate in sensation, Regius had to acknowledge that we often come to have ideas that originate from imagined realities and that, in the case of veridical and non-veridical perceptions, the subjective experiences are often sufficiently similar that one cannot be certain of a correspondence between ideas and reality. In contrast with the Cartesian rational defence of the reliability of our cognitive faculties, Regius claimed that one must rely on Scripture for this purpose (Regius 1646, 249). However, Scripture does not guarantee that our perceptions are always certain. This issue was particularly acute when the realities in question were unobservable (Regius 1646, 4). Regius thought it was obvious that physical bodies are composed of insensible particles, and that their description is a matter of hypothesis. When faced with the task of explanation, therefore, he took refuge in some of the central themes of Cartesian natural philosophy. He borrowed the ‘fable’ used by Descartes in *Le Monde*, that the natural world is composed of one matter, that it is divided into parts of various sizes and shapes in motion, and that all natural phenomena may be explained by the laws of nature that apply to those parts (Regius 1646, 4).
    step1: |-
      由于一切观念都起源于感觉，雷吉乌斯不得不承认：我们常常会获得一些起源于被想象之实在的观念；而在真实知觉与不真实知觉的情形中，主观经验往往相似到这样的程度，以至于无法确定观念与实在之间的对应关系。与笛卡尔对我们的认知官能之可靠性的理性辩护不同，雷吉乌斯主张人们必须为此依靠《圣经》（Regius 1646, 249）。然而《圣经》并不保证我们的知觉总是确定的。当所讨论的实在不可观察时，这一问题尤为尖锐（Regius 1646, 4）。雷吉乌斯认为，物理物体由不可感粒子构成，这一点显而易见，而对它们的描述属于假设之事。因此，面对解释的任务，他退守到笛卡尔式自然哲学的若干中心主题。他借用了笛卡尔在《论世界》中使用的“寓言”：自然界由一种物质构成，它被分割成大小与形状各异、处于运动之中的部分，而一切自然现象都可以由适用于这些部分的自然律来解释（Regius 1646, 4）。
    step2: |-
      既然一切观念都出自感觉，雷吉乌斯便不得不承认：我们常常获得一些起源于被想象之实在的观念；而且在真实与不真实的知觉中，主观经验往往相似到这种地步——你无法确定观念与实在之间是否对应。笛卡尔为认知官能的可靠性作理性辩护，雷吉乌斯不同：这一层要靠《圣经》兜底（Regius 1646, 249）。可《圣经》并不担保我们的知觉永远确定。所论的实在一旦不可观察，这个难题就格外扎手（Regius 1646, 4）。雷吉乌斯认为，物理物体由不可感粒子构成，这一点不言自明；对它们的描述只能是假设。于是到了要解释的时候，他便退回笛卡尔式自然哲学的几个中心主题：借用笛卡尔在《论世界》里那个“寓言”——自然界由一种物质构成，这物质分成大小形状各异、运动不息的部分，而一切自然现象都可由适用于这些部分的自然律来解释（Regius 1646, 4）。
