      The intensity of the dispute between Voetius and those whom he identified as proponents of a ‘new philosophy’ might suggest agreement, at least between Descartes and Regius, on a common philosophical position. In the course of the Utrecht controversy, however, an irretrievable breakdown developed in relations between Descartes and his former supporter. The epistemology favoured by Regius, which reflected his disciplinary expertise in medicine and physiology, left little room for Cartesian metaphysics. When he wrote to Descartes, in July 1645 (AT IV, 254–6: Bos 2002, 189–90), that many reputable people believed that Descartes secretly held views about the human mind and God that differed from those that he published, and that he had discredited his philosophy by publishing the *Meditations*, it seemed to Descartes that Regius was endorsing the same criticisms that Voetius and Schoock had made earlier. The following year, against Descartes’ advice, Regius published the *Fundamenta physices*, in which he rejected a number of Descartes’ metaphysical theses and thereby incurred the wrath of his former mentor. The French philosopher denounced Regius, as misrepresenting his philosophy, in the preface to the French edition of the *Principles of Philosophy* (1647). Regius planned to reply by adding twenty-one Corollaries to a medical disputation that was scheduled for 2 October 1647, concerning a forty-year old man who had inflammation of the feet and legs (Regius 1647b). These Corollaries included three of the more contentious claims about the mind and God that Regius had earlier removed from *Fundamenta physices* in an unsuccessful attempt to appease Descartes. Although the disputation was banned by the University rector, Regius had already disseminated copies of the text, including the controversial *Corollaria*. Descartes replied with *Notae in programma quoddam* (1648)—i.e., *Critical Remarks on a Certain Manifesto*—to which Regius replied with an extended version of the *Corollaria*, in *A Brief Explanation of the Human Mind or the Rational Soul, in which is explained what it is and what it may be* (Regius 1648).
    step1: |-
      沃埃修斯与他所认定的“新哲学”支持者之间的争斗如此激烈，这或许让人以为笛卡尔与雷吉乌斯至少持有一个共同的哲学立场。然而在乌得勒支论战过程中，笛卡尔与这位昔日支持者的关系出现了一种无法挽回的破裂。雷吉乌斯偏爱的认识论反映了他在医学与生理学上的专业所长，几乎不给笛卡尔式形而上学留有余地。1645 年 7 月，他写信告诉笛卡尔（AT IV, 254–6：Bos 2002, 189–90），许多有声望的人相信笛卡尔私下关于人的心灵与上帝的观点与他发表的不同，还说笛卡尔发表《沉思集》败坏了自己哲学的名声；在笛卡尔看来，这似乎是雷吉乌斯在附和沃埃修斯与斯霍克早先提出的那些批评。次年，雷吉乌斯不听笛卡尔劝告，出版了《自然哲学基础》，其中拒斥了笛卡尔的若干形而上学论题，从而招致昔日导师的震怒。这位法国哲学家在《哲学原理》法文版（1647）的序言中公开谴责雷吉乌斯歪曲其哲学。雷吉乌斯打算回复：为一场定于 1647 年 10 月 2 日举行、关于一位双脚与双腿发炎的四十岁男子的医学论辩增补二十一条附论（Regius 1647b）。这些附论包含了雷吉乌斯此前为安抚笛卡尔而从《自然哲学基础》中删去的三条关于心灵与上帝的、更具争议的主张。尽管该论辩被大学校长查禁，雷吉乌斯此前已散发文本的抄本，包括有争议的《附论》（*Corollaria*）。笛卡尔以《对某个纲领的注记》（*Notae in programma quoddam*，1648，即《对某个宣言的批判性评论》）作答；雷吉乌斯则以一个扩充版的《附论》回应，即《对人的心灵或理性灵魂的简要说明，其中解释了它是什么以及它可能是什么》（Regius 1648）。
