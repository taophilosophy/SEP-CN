    kind: body
    source: |-
      In November 1641, however, Regius initiated a new series of disputations, *De illustribus aliquot quaestionibus physiologicis* (Regius 1641b), in which he, sharper than before, challenged Aristotelian theses that were taught by his colleagues in philosophy and theology at the University. This attracted a very negative response from Voetius, who relied on Aristotelian philosophy to articulate his version of Calvinist theology. The resulting lengthy controversy, during which Regius lost the support of Descartes while simultaneously continuing the conflict with Voetius, is discussed below. He published the first edition of his book on natural philosophy under the title *Fundamenta physices* (1646); Chapter XII, entitled *De homine* (Regius 1646, 245–306), provided a synoptic exposition of his controversial views about human nature.
    step1: |-
      然而 1641 年 11 月，雷吉乌斯开始了一系列新的论辩：《论若干著名的生理学问题》（*De illustribus aliquot quaestionibus physiologicis*，Regius 1641b）。在这些论辩中，他比以前更尖锐地挑战校内哲学与神学同僚所讲授的亚里士多德式论题。这招致沃埃修斯的强烈负面反应——沃埃修斯依赖亚里士多德哲学来表述其加尔文宗神学。由此产生的漫长争论（其间雷吉乌斯失去笛卡尔的支持，同时仍与沃埃修斯冲突）将在下文讨论。他以《自然哲学基础》（*Fundamenta physices*，1646）为题出版了其自然哲学著作第一版；题为《论人》（*De homine*）的第十二章（Regius 1646, 245–306）对其关于人性的争议性观点作了通览式阐述。
    step2: |-
      可是到了 1641 年 11 月，雷吉乌斯另开一系列论辩：《论若干著名的生理学问题》（*De illustribus aliquot quaestionibus physiologicis*，Regius 1641b）。这一次他的矛头直指校内哲学与神学同僚所授的亚里士多德论题，措辞比先前尖锐得多。沃埃修斯反应极为激烈：他正是借亚里士多德哲学来铺陈自己那一版加尔文宗神学的。这场旷日持久的争论下文还要讨论；其间雷吉乌斯既失去了笛卡尔的支持，又持续与沃埃修斯对峙。1646 年，他的自然哲学著作以《自然哲学基础》（*Fundamenta physices*）为题出了第一版；其中第十二章《论人》（*De homine*，Regius 1646, 245–306）提纲挈领地交代了他那套关于人性、颇具争议的看法。
  - id: 6
    kind: body
    source: |-
      Despite the bitter and extended controversy in which Regius engaged with Voetius and the university authorities, he was later appointed Rector of the University of Utrecht (a one-year honorary position) in 1649, and again in 1662. He published an amended, enlarged edition of the *Fundamenta physices* under the title *Philosophia naturalis* in 1654, and a third edition in 1661. A French translation appeared in 1687. He remained in Utrecht, except for a brief period when he was captured as a hostage by the French army in late 1673, and died there in 1679.
    step1: |-
      尽管雷吉乌斯与沃埃修斯及大学当局的争论激烈而漫长，他后来仍于 1649 年被任命为乌得勒支大学校长（一年期荣誉职位），1662 年再度出任。1654 年，他以《自然哲学》（*Philosophia naturalis*）为题出版了《自然哲学基础》的修订增补版，1661 年又出第三版。1687 年有法译本问世。除 1673 年末一度被法军掳为人质外，他一直留在乌得勒支，并于 1679 年在那里去世。
    step2: |-
      尽管与沃埃修斯及校方的论战既苦且长，雷吉乌斯 1649 年仍被任命为乌得勒支大学校长（一年期的荣誉职），1662 年再度出任。1654 年，他把《自然哲学基础》修订增补，以《自然哲学》（*Philosophia naturalis*）为名出版，1661 年又出第三版，1687 年有了法译本。除了 1673 年末被法军扣作人质的一小段时间，他始终没有离开乌得勒支，1679 年卒于此地。
