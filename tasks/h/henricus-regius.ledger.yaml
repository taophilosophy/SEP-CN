      笛卡尔与雷吉乌斯分歧的主要根源在于二人各自的人性学说。这一点早在 1640 年雷吉乌斯评论《沉思集》草稿时就已显露，1641 年 12 月的论辩更为明确——该论辩提出了人的心灵与身体以“偶性统一”相结合的论题。1645 年 7 月，笛卡尔在回应《自然哲学基础》草稿时指出，雷吉乌斯在相反的方向上走得太远：他把心灵与身体的结合说得如此紧密，以至于心灵成了身体的“样态”——这比他先前的错误还要严重（AT IV, 250：Bos 2002, 188）。如何设想心灵与身体既结合又可分离，这个问题支配着两位哲学家直至 1648 年的连番主张与反驳。从 1648 年到 1650 年 2 月笛卡尔去世，两人再未直接交手。1648 年笛卡尔与布尔曼讨论过一系列问题，对其中一个疑问，他再次点明雷吉乌斯对形而上学的所谓误解到了什么程度：“就雷吉乌斯而言……在物理学上，他总是急于追随作者［即笛卡尔］的观点……而在形而上学上，他则想尽一切办法与作者的观点作对”（Descartes CB, 38：AT V, 170）。笛卡尔最后的出版物《论灵魂的激情》（*Les Passions de l'Ame*，1649：AT 第十一卷）可以读作他对分歧根源的最后回应，而 Regius 1650 则可视为雷吉乌斯的回应（Verbeek 2017）[^verbeek-2017]。
