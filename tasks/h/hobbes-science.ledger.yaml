      First, the unified view. A significant number of scholars have argued that Hobbes understood his philosophy as unified by deductive connections between the different parts (for example, Martinich 2005; Peters 1967; Shapin & Schaffer 1985; Watkins 1965)[^martinich-2005][^peters-1967][^shapin-1985][^watkins-1965]. A stronger version of this unified view understands Hobbes to be a type of reductionist, wherein descriptions of macroscopic bodies, such as humans and rocks, ultimately reduce to microscopic bodies responsible for all phenomena (for example, Hampton 1986; Ryan 1970)[^hampton-1986][^ryan-1970]. For example, Alan Ryan articulates the reductionist view as follows:
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      > Hobbes believed as firmly as one could that all behaviour, whether of animate or inanimate matter, was ultimately to be explained in terms of particulate motion: the laws governing the motions of discrete material particles were the ultimate laws of the universe, and in this sense psychology must be rooted in physiology and physiology in physics, while the social sciences, especially the technology of statecraft, must be rooted in psychology. (1970: 102–103)
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      There is some textual support for understanding the parts of Hobbes’ system as either deductively or reductively linked together since he did at times talk of the parts of philosophy as beginning in first philosophy and leading from one to another. For example, he asserted in *De Corpore* VI.6 that by beginning at first principles, one will move from first philosophy to geometry, and from geometry to physics. He continued by claiming that “after physics we come to morals” and, indeed, Hobbes claims that moral philosophy must be studied after physics because the passions have “their causes in sense-experience and imagination” (CSL 299; OL I.64).
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      However, immediately following these statements that seem to indicate that Hobbes took his philosophy to be tightly knit together, he argued that “civil and moral philosophy do not so adhere to one another, but that they may be severed” (EW I.73). This separation is permissible, Hobbes claimed, because in addition to learning moral philosophy from first principles each individual could simply study the motions of their own mind and gain knowledge of the same principles. That such separation could occur is difficult to explain for a strong version of the unified view because it makes it appear that Hobbes thought that one could develop civil philosophy simply by introspecting, entirely independently of any work in moral philosophy, natural philosophy, and first philosophy.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      A further difficulty for the unified view is that even if Hobbes did see the connection between, say, physics and moral philosophy as deductive, it is not obvious how that deduction would work because moral philosophy must add content about human passions (endeavors) that is not contained within—and thus not deducible from—physics. For example, although the concept ‘endeavor’ is introduced in physics, for it to be used in moral philosophy the concepts of ‘appetite’ and ‘aversion’, which are properties of human bodies, must be added to it for use (Malcolm 2002: 147)[^malcolm-2002]. One way to avoid this difficulty for the unified view would be to provide evidence that Hobbes made explicit the reduction relationship between concepts like ‘appetite’ and ‘aversion’ and the concept of ‘endeavour’, showing how one can reduce claims about human bodies to claims about microscopic bodies. Hobbes does not appear to do this anywhere in the corpus. However, even if a strong version of the unified view faces this difficulty, the presence of ‘endeavor’ throughout Hobbes’ philosophy shows that it was a foundational concept (see Jesseph 2016)[^jesseph-2016].
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      The second major view of the relationship of the parts of Hobbes’ philosophy to one another is what we can call the disunified view (for example, see Robertson 1886; Taylor 1938; Warrender 1957)[^robertson-1886][^taylor-1938][^warrender-1957]. Some of the motivation behind the disunified account seems to be a desire to free Hobbes from what is prima facie a case of deriving normative claims relating to the commonwealth in civil philosophy from descriptive claims related to human psychology and, ultimately, more general claims in natural philosophy (especially Taylor 1938)[^taylor-1938]. However, in its attempts to rescue Hobbes from a version of the so-called naturalistic fallacy, the disunified account fails to take seriously Hobbes’ claims about the unity of his philosophy. Furthermore, it neglects that many of Hobbes’ contemporaries (for example, Bramhall) saw Hobbes’ views in natural philosophy as having far-reaching consequences for other areas of philosophy.
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      A third view has more recently been offered that seeks to carve a middle path between the unified and disunified interpretations. We can call this view the mixed-mathematics view (for example, Adams 2016, 2017; Biener 2016)[^adams-2016][^biener-2016]. This understanding of Hobbes’ system agrees with the worry raised above for the unified account that ‘higher’ levels, such as geometry, do not contain the concepts used in ‘lower’ level explanations. For example, although geometrical principles are used in Hobbes’ optical explanations those geometrical principles do not contain concepts such as ‘light’ or ‘color’. Some evidence for this lack of containment claim can be found on the well-known “Table of the Several Subjects of Science” in *Leviathan* IX. The “sciences” on this table are listed on the right-most section and their subjects are to the immediate left. The subject of the science of optics, for example, is all of the “consequences from vision”, and these stem from “Physics or consequences from qualities”. The science of geometry, however, has as its subject the “consequences from quantity, and motion determined… by figure” and these stem not from physics but from “consequences from the accidents common to all bodies natural; which are quantity and motion”.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      Instead of seeing this “adding to” as evidence for the disunified view, the mixed-mathematics view understands Hobbes having seen certain disciplines as providing causal principles (what he called the ‘why’) while other disciplines provided the facts relevant to a given domain (what he called the ‘that’). Textual support for this understanding of Hobbes’ system can be found in Hobbes’ methodological statements about natural philosophy as well as in his practice of explanation.
    step1: TBD
    step2: TBD
