      Hobbes’ conflict with Robert Boyle concerning the nature of natural philosophy in general, and the air-pump experiments in particular, took place over several years and in a series of publications.[^note-5] Hobbes wrote *Dialogus Physicus* (1661; a second version appeared in 1668)[^note-6] as a dialogue aimed at criticizing Boyle’s *New Experiments Physico-Mechanical* (1660). Boyle responded to various criticisms in works such as *An Examen of Mr. T. Hobbes his Dialogus Physicus de Natura Aëris* (1662), *An Examen of Mr. Hobbes’ Doctrine about Cold* (1665), and *Animadversions upon Mr. Hobbes’ Problemata de Vacuo* (1674). The most comprehensive and influential treatment of this period of Hobbes’ life is Shapin and Schaffer’s *Leviathan and the Air-Pump* (1985).[^note-7] This section will focus upon Hobbes’ criticisms of the air-pump experiments in the *Dialogus Physicus* with an aim of showing how they illuminate our understanding of Hobbes’ natural philosophy.
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Most generally both Boyle and Hobbes viewed the natural world as composed of bits of matter in motion. Even if there were some points of agreement between the versions of mechanical philosophy offered by both Boyle and Hobbes,[^note-8] there are important differences. A crucial difference between the two relates to the status (or lack thereof) of Laws of Nature. While Boyle talked about the laws of nature as established by God (see the section on Laws of Nature in the entry on Boyle), Hobbes restricted discussion of laws to the laws of human conduct discovered by those who escape the state of nature and create a commonwealth. In contrast to laws of the natural world, Hobbes articulated *a priori* principles of motion at the foundation of his physics in *De Corpore* VIII.19 and IX.7. Rather than being known as laws of motion, issued by some divine lawmaker, these Hobbesian principles of motion are explicated by thought experiments and seem to rely upon a version of the principle of sufficient reason (Jesseph 2006: 132)[^jesseph-2006]. Although Hobbes held that they were true of all human experience, since Hobbes holds that we cannot know the actual causes of natural phenomena he would have to admit that nature might, unbeknownst to us, act otherwise. However, despite these differences, the primary dissimilarity that emerges between Hobbes and Boyle concerning the air-pump experiments is one of method as it relates to the status of experiments/experience (see the section on Philosophy of Experiment in the entry on Boyle).
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Given that Hobbes was convinced of the impossibility of knowing the actual causes of natural phenomena, he held that any phenomenon admits of multiple possible explanations. This should not be taken to imply that Hobbes saw all explanations, and thus all possible causes or suppositions, as standing on equal footing. Instead, Hobbes held that work in first philosophy and geometry must be completed prior to attempting to make any explanations in natural philosophy. This seems to be what Hobbes meant in the *De Homine* extended quotation provided above when he said that “nothing can be demonstrated by physics without something also being demonstrated *a priori*” (MC 42; OL II.93). When giving an explanation, Hobbes held that one should ideally appeal to those causes that are demonstrable from geometry when mixed with facts and rule out those that are not intelligible according to geometrical principles.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      In contrast, Boyle’s method prescribed that instead of bringing causal principles to an experiment and expecting to explain some phenomenon by appeal to those principles, one should attempt to arrive at a supposition that would explain a phenomenon only after repeated, careful experiments. Thomas Sprat detailed the care taken in the design of experiments and the manner in which Royal Society members were formed into committees that shared parts of an experiment so that “[b]y this union of eyes, and hands” they were able to gain “a full comprehension of the object in all its appearances” (Sprat 1667: 85)[^sprat-1667].
    step1: TBD
    step2: TBD
