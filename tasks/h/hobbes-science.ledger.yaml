      The fundamental aspects of Hobbes’ materialism are well known. Hobbes believed that everything that exists is a body, and that bodies are sometimes in motion and sometimes at rest. Furthermore, he held that the only essential property of body is extension, or magnitude. All other apparent properties of bodies, such as those of color, taste, and firmness, are the result of motions from bodies being continued through media to humans’ sense organs. These motions, when continued into the bodies of perceivers, are constitutive of conceptions, or ideas.[^note-2] Ideas of the objects of sense are caused by motions from things outside of perceivers and those continued motions constitute ideas and serve to individuate one idea from another. Thus, all ideas in the human mind are either from sense perception or derived from ideas gained from sense perception (*Leviathan* I; LEV 22).
    step1: |-
      霍布斯唯物主义的根本方面是众所周知的。霍布斯相信，凡存在者皆为物体，物体有时运动、有时静止。此外，他主张物体的唯一本质属性是广延，或曰大小。物体的所有其他表面属性，如颜色、味觉与坚实性，都是运动自物体经由介质延续到人类感觉器官的结果。这些运动当延续进入感知者的身体时，便构成观念（conceptions）或理念（ideas）。[^note-2] 关于感觉对象的理念，是由感知者之外的事物所产生的运动引起的，而延续的运动构成理念，并使一个理念区别于另一个理念。因此，人类心灵中的一切理念，要么来自感觉知觉，要么派生自得自感觉知觉的理念（*Leviathan* I; LEV 22）。
    step2: |-
      霍布斯唯物主义的根本要点是人所共知的。霍布斯相信，凡存在者皆为物体，物体有时在运动，有时静止。他还主张，物体的唯一本质属性是广延，或曰大小。物体的其余一切表观属性，诸如颜色、味觉与坚实性，皆源于物体之运动经由介质延续到人类感觉器官的结果。这些运动当延续进入感知者身体时，便构成观念（conceptions）或理念（ideas）。[^note-2] 关于感觉对象的理念，乃由感知者之外的事物之运动所引起，而延续的运动既构成理念，又使一个理念与另一个理念区分开来。由此，人类心灵中的一切理念，要么来自感觉知觉，要么派生自得自感觉知觉的理念（*Leviathan* I; LEV 22）。
