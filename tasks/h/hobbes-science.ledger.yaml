      If Hobbes’ mathematical and natural-philosophical endeavors failed to be taken seriously by his contemporaries near the end of his life, what purpose is served by understanding these failed attempts?[^note-1] Apart from interest in them on their own terms as episodes in the history of science and philosophy, there are several reasons why we may find these areas of Hobbes’ thought valuable for study. First, Hobbes himself understood his political philosophy, or as he called it “civil philosophy”, to be a science capable of demonstration. Thus, understanding his general views about the nature of scientific demonstration promises to shed light on the way in which he saw civil philosophy as scientific. Second, Hobbes understood natural-philosophical explanations in physics as needing to make use of mathematical principles to count, as he says, as “true physics” and to be useful for improving humans’ quality of life. This claim about the use of mathematics to explain natural phenomena may seem banal to a twenty-first century reader, but it was not so to many in the sixteenth and seventeenth centuries. Hobbes’ natural philosophy thus situates him within the shift from qualitative to quantitative physics. Third, Hobbes’ conflicts with the Royal Society show us not only his views of the role of experimentation but also contextualize the rise of experimentalism. After discussing Hobbes’ criteria for scientific knowledge, this entry will address each of these areas.
    step1: |-
      如果霍布斯在数学与自然哲学上的努力在其生命将尽之际未能得到同时代人的认真对待，那么理解这些失败的尝试有何意义？[^note-1]除了把它们本身当作科学与哲学史中的插曲而感兴趣之外，还有若干理由使我们觉得霍布斯思想的这些领域值得研究。其一，霍布斯本人把他的政治哲学，或如他所称的“公民哲学”（civil philosophy），理解为一种能够演证的科学。因此，理解他关于科学演证之性质的一般观点，有望阐明他如何把公民哲学看作科学的。其二，霍布斯认为物理学中的自然哲学解释必须运用数学原理，才能如他所说算作“真正的物理学”，并对改善人类的生活质量有用。这种用数学解释自然现象的主张，对二十一世纪的读者也许显得平常，但对十六、十七世纪的许多人却并非如此。霍布斯的自然哲学由此把他置于从定性物理学向定量物理学的转变之中。其三，霍布斯与皇家学会的冲突不仅向我们显示他对实验之作用的看法，也为实验主义的兴起提供了语境。在讨论了霍布斯关于科学知识的判准之后，本词条将依次处理这些领域。
    step2: |-
      若霍布斯在数学与自然哲学上的努力，直到生命将尽仍未获同时代人认真对待，那么理解这些受挫的尝试又有何意义？[^note-1]除了把它们视作科学与哲学史中的插曲、本身自有兴味之外，还有若干理由让我们觉得霍布斯思想的这些领域值得研究。其一，霍布斯本人把他的政治哲学，或如他所称的“公民哲学”（civil philosophy），理解为一种可以演证的科学；因此，把握他关于科学演证之性质的总体看法，当能说明他何以把公民哲学视作科学。其二，霍布斯认为，物理学中的自然哲学解释必须运用数学原理，方能如他所说算作“真正的物理学”（true physics），并有裨于改善人类的生活质量。以数学解释自然现象这一主张，对二十一世纪的读者或许显得平淡无奇，但在十六、十七世纪却绝非如此；霍布斯的自然哲学由此把他置于从定性物理学走向定量物理学的转变之中。其三，霍布斯与皇家学会的冲突不仅显明他对实验之作用的看法，也为实验主义的兴起提供了历史语境。在讨论过霍布斯关于科学知识的判准之后，本词条将依次处理这三个领域。
