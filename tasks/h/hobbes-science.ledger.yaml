      A third view has more recently been offered that seeks to carve a middle path between the unified and disunified interpretations. We can call this view the mixed-mathematics view (for example, Adams 2016, 2017; Biener 2016)[^adams-2016][^biener-2016]. This understanding of Hobbes’ system agrees with the worry raised above for the unified account that ‘higher’ levels, such as geometry, do not contain the concepts used in ‘lower’ level explanations. For example, although geometrical principles are used in Hobbes’ optical explanations those geometrical principles do not contain concepts such as ‘light’ or ‘color’. Some evidence for this lack of containment claim can be found on the well-known “Table of the Several Subjects of Science” in *Leviathan* IX. The “sciences” on this table are listed on the right-most section and their subjects are to the immediate left. The subject of the science of optics, for example, is all of the “consequences from vision”, and these stem from “Physics or consequences from qualities”. The science of geometry, however, has as its subject the “consequences from quantity, and motion determined… by figure” and these stem not from physics but from “consequences from the accidents common to all bodies natural; which are quantity and motion”.
    step1: |-
      第三种观点较晚提出，试图在统一解释与不统一解释之间开出一条中间道路。我们可以把这种观点称为混合数学观（例如 Adams 2016, 2017; Biener 2016）[^adams-2016][^biener-2016]。这种对霍布斯体系的理解同意上文针对统一观提出的疑虑：“较高”的层次，如几何学，并不包含“较低”层次解释中所用的概念。例如，虽然霍布斯的光学解释使用了几何学原理，但这些几何学原理并不包含“光”或“颜色”这类概念。这一“不包含”主张的一些证据可以在《利维坦》第九章著名的“诸科学主题表”中找到。表中“诸科学”列在最右栏，它们的主题列在其紧左边。例如，光学这门科学的主题是“来自视觉的一切结果”，而这些结果来自“物理学或来自性质的诸结果”。然而，几何学这门科学的主题是“来自数量以及由图形规定的运动的结果”，这些结果并非来自物理学，而是来自“一切自然物体共同具有的偶性即数量与运动的诸结果”。
