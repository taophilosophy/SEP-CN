      较晚近又提出第三种观点，试图在统一观与非统一观之间开辟一条中间道路。我们可称之为混合数学观（例如 Adams 2016, 2017; Biener 2016）[^adams-2016][^biener-2016]。这一对霍布斯体系的理解，同意上述为统一观提出的担忧：即“较高”层次（如几何学）并不包含用于“较低”层次解释中的概念。例如，尽管几何学原理用于霍布斯的解释，但这些几何学原理并不包含诸如“光”或“颜色”之类的概念。关于这一不包含主张的一些证据，可见于《利维坦》第九章中著名的“各门科学主题表”（Table of the Several Subjects of Science）。表中的各门“科学”列于最右侧一栏，其主题紧邻其左。例如，光学这门科学的主题是全部“来自视觉的后果”，而这些源于“物理学或来自性质的后果”。然而，几何学这门科学的主题是“来自数量与由图形所规定的……运动的后果”，而这些并非源于物理学，而是源于“来自一切自然物体所共有的偶性（accidents）的后果；这些偶性即数量与运动”。
