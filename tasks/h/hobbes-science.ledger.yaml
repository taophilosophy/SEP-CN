      According to Hobbes, then, one must have geometrical principles already in place to aid in choosing a supposition before engaging in experiments. Unlike the Royal Society’s aim to have multiple members examine the same object, Hobbes emphasized the need for individual conceptual clarity, something that could be accomplished from an armchair.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      This criticism from Hobbes, and Boyle’s rebuttals relying upon evidence from experiments, could be seen as a conflict of Boyle’s experimental natural philosophy against a form of speculative natural philosophy.[^note-9] However, it is important to avoid taking Hobbes’ criticisms of Boyle’s method to imply that Hobbes completely eschewed experiment/experience while engaging in natural-philosophical explanations. Indeed, Hobbes held that both natural history and civil history are “useful (no, indeed necessary) for philosophy” (CSL 189; OL I.9). Experiment/experience play the role of establishing that some phenomenon occurs, what we have seen Hobbes called the ‘that’, but one should never hope, according to Hobbes, to glean a possible cause from mere observations, even if those observations were carefully documented and repeated many times.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      This is clear when in the *Dialogus Physicus* Hobbes, speaking through speaker A, often granted the observational reports of the experimenters without question. For example, speaker A does not question what the experimenters claim they observed regarding a bladder that had been placed inside the air-pump and weighed, noting “They can be certain that the scale in which the bladder is, is more depressed than the other, their eyes bearing witness” (DP 369; OL IV.261). Instead of criticizing the experimenters’ reliance upon observations, speaker A argues that the experimenters cannot know, in the case of this explanation, what the cause of the scale being depressed is because their posited cause (the “natural gravity” of the air) does not allow them to explain why the scale is depressed after the air-pump is engaged. In contrast, speaker A offers a possible cause that is borrowed, with an explicit citation, from Hobbes’ geometrical account of “simple circle motion” and “fermentation” developed in *De Corpore* 21.5 (Adams 2017)[^adams-2017].
