      总体而言，波义耳与霍布斯都把自然世界看作由运动中的物质碎片构成。尽管波义耳与霍布斯各自的机械哲学版本之间有若干共识，[^note-8] 但二者也有重要差异。一个关键差异涉及自然法的地位（或其阙如）。波义耳把自然法说成由上帝确立（见波义耳词条中关于自然法的一节），霍布斯则把对法的讨论限于那些逃离自然状态并缔造国家的人所发现的人类行为之法。与自然世界的法相对，霍布斯在《论物体》VIII.19 与 IX.7 中在他的物理学基础处阐明了先天的运动原理。这些霍布斯式的运动原理并非由某位神圣立法者颁布的、被称为运动之律的东西，而是通过思想实验得到阐明，并且似乎依赖某种充足理由律（Jesseph 2006: 132）[^jesseph-2006]。虽然霍布斯主张它们对一切人类经验都成立，但由于他主张我们不能知道自然现象的实际原因，他就不得不承认，自然界或许会在我们不知情的情况下以别的方式行事。不过，尽管有这些差异，霍布斯与波义耳就空气泵实验而言浮现出来的主要不同，是与方法有关的一种不同，即实验/经验的地位（见波义耳词条中关于实验哲学的一节）。
