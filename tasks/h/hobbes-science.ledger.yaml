      This account of the origin and nature of ideas shows Hobbes’ clear empiricist leanings; however, Hobbes does not hold that knowers should uncritically accept what the ideas of sense objects seem to represent. Like many other philosophers in the seventeenth century, Hobbes held that our knowledge of the external world was not direct but was instead mediated by ideas. This recognition that “we compute nothing but our phantasms or ideas” (Hobbes 1642–43 [1973: 450]; cf. OL I.82)[^note-3] resulted in two worries about human knowledge.
    step1: |-
      这一关于观念之起源与性质的说明显出霍布斯鲜明的经验主义倾向；然而，霍布斯并不认为认知者应当不加批判地接受感觉对象的观念似乎所表象的东西。与十七世纪的许多哲学家一样，霍布斯主张我们对外部世界的知识不是直接的，而是以观念为中介的。“我们所计算的不过是我们的幻象或观念”（Hobbes 1642–43 [1973: 450]; cf. OL I.82）[^note-3] 这一认识导致了对人类知识的两个疑虑。
    step2: |-
      这一关于观念之起源与性质的说明，显出霍布斯鲜明的经验主义倾向；但他并不认为认知者应当不加批判地接受感觉对象的观念似乎代表的东西。与十七世纪的许多哲学家一样，霍布斯主张我们对外部世界的知识并非直接，而是经由观念中介的。正是“我们所计算的不过是我们的幻象或观念”这一认识（Hobbes 1642–43 [1973: 450]; cf. OL I.82）[^note-3]，引发了对人类知识的两个疑虑。
  - id: 9
    kind: body
    source: |-
      First, knowers must examine what resemblance ideas in the mind have to objects in the outside world. This worry seems similar, at first glance, to the concerns of Descartes’ meditator in the *Meditations on First Philosophy* (1641), but Hobbes aimed to provide a solution that made no reference whatsoever to God or to anything at all immaterial, such as a soul. In the early work *Elements of Law*, composed in 1640 and published in 1650 (EL), Hobbes offered arguments that attempted to show that ideas are distinct from that which they purport to represent, and he claimed that as a result we could know that the so-called secondary qualities, such as color, taste, and sound, were not in bodies. To do this, he used everyday experience to provide evidence for his claims:
    step1: |-
      第一，认知者必须考察心灵中的观念与外部世界中的对象之间有什么相似之处。这一疑虑乍看之下似乎与笛卡尔在《第一哲学沉思集》（*Meditations on First Philosophy*，1641）中沉思者的关切相似，但霍布斯意在提供一个完全不求助于上帝、也不求助于任何非物质东西（如灵魂）的解决方案。在早期著作《法律要义》（*Elements of Law*，1640 年写成，1650 年出版；EL）中，霍布斯提出的论证试图表明，观念不同于它们所意欲表象的东西；他还主张，由此我们能够知道所谓第二性质，如颜色、味觉、声音，并不在物体之中。为做到这一点，他援引日常经验为其主张提供证据：
    step2: |-
      第一，认知者必须考察：心灵中的观念与外部世界中的对象之间究竟有多少相似。这一疑虑乍看类似笛卡尔在《第一哲学沉思集》（*Meditations on First Philosophy*，1641）中那位沉思者的关切，但霍布斯想给出一个完全不求诸上帝、也不求诸灵魂等任何非物之事的解决方案。在早期著作《法律要义》（*Elements of Law*，1640 年写成、1650 年出版；EL）中，霍布斯给出论证，试图表明观念不同于它们自称所表象的东西；他进而主张，由此我们能够知道，颜色、味觉、声音等所谓第二性质并不在物体之中。为达此目的，他援引日常经验来为自己的主张提供证据：
