      An alternative account, what has been called the “maker’s knowledge” view of Hobbes’ civil philosophy, attempts to connect Hobbes’ demonstrations and definitions in geometry with civil philosophy. This view avoids the two difficulties faced by the definitivist account mentioned above and holds that Hobbesian civil philosophy is demonstrable by appealing to Hobbes’ own understanding of what constitutes a demonstration (Adams 2019)[^adams-2019]. The remainder of this section will discuss two features of the “maker’s knowledge” account of Hobbesian civil philosophy.
    step1: |-
      另一种解释，即所谓霍布斯公民哲学的“制作者知识”观点，试图把霍布斯在几何学中的演证与定义同公民哲学联系起来。这种观点避免了上面提到的定义主义解释面临的两个困难，并主张霍布斯式公民哲学是可演证的，其根据是霍布斯本人对什么构成演证的理解（Adams 2019）[^adams-2019]。本节其余部分将讨论霍布斯式公民哲学“制作者知识”解释的两个特征。
    step2: |-
      另一种解释——所谓霍布斯公民哲学的“制作者知识”（maker’s knowledge）观——试图把霍布斯在几何学中的演证与定义同公民哲学贯通起来。它避开了上述定义主义面临的两个困难，并主张：霍布斯式公民哲学之所以可演证，根据在于霍布斯本人对“什么构成演证”的理解（Adams 2019）[^adams-2019]。本节余下部分讨论“制作者知识”解释的两个特征。
  - id: 71
    kind: body
    source: |-
      First, a requirement for geometrical definitions, which Hobbes stressed in multiple contexts, is that they must provide the causes of the things being defined. For example, Hobbes claimed that the definition of ‘line’ should be as follows: “a line is made by the motion of a point” (OL I.63). Likewise, a plane is made by the motion of a line. Perhaps Hobbes understood all of the laws of nature to be like this type of geometrical definition, but instead of the definition of something like ‘line’ they served as the definition of (and thus how to make) peace. That is, when following all of the laws of nature one could make peace just as by following the generative instructions contained in the definition of ‘line’ one could make a line.
    step1: |-
      第一，霍布斯在多种语境中强调，几何学定义的一个要求是它们必须提供被定义事物的原因。例如，霍布斯主张“线”的定义应当是：“线由一个点的运动造成”（OL I.63）。同样，面由一条线的运动造成。也许霍布斯把所有自然法都理解为类似这种几何学定义，只不过它们不是诸如“线”的定义，而是和平的定义（因而也是如何制造和平）。也就是说，遵循一切自然法就能制造和平，正如遵循“线”的定义所包含的生成指令就能制造一条线。
    step2: |-
      第一，几何学定义有一个要求，霍布斯在多处强调过：定义必须给出被定义之物的成因。例如霍布斯主张，“线”的定义应当是：“线由一个点的运动而成”（OL I.63）；同理，面由一条线的运动而成。霍布斯或许把全部自然法都理解为此类几何学定义：它们不是“线”之类的定义，而是和平的定义（因而也是制造和平的方法）。换言之，遵循全部自然法便可制造和平，正如遵循“线”的定义中包含的生成指令便可制造出一条线。
  - id: 72
    kind: body
    source: |-
      Second, a demonstration for Hobbes did not involve the derivation of features by means of deduction. Such deductions would provide one with knowledge of what was already contained in the starting proposition, making it difficult to see how commands could be derived from the definition of ‘law of nature’ in *Leviathan* XIV. However, Hobbes explicitly said that demonstrations should be synthetic, wherein one builds the complex thing to be demonstrated out of simpler constituent parts. A demonstration, Hobbes asserted, should be understood as a showing of some construction to someone else (OL I.76) and, as a result, he claimed that “entire method of demonstrating is synthetic” (OL I.71). By ‘synthesis’ Hobbes means that one shows how something is put together to reach the desired end, one shows how that thing is made.
    step1: |-
      第二，对霍布斯来说，演证不包含通过演绎推出诸特征。这种演绎只会提供关于起始命题中已经包含的东西的知识，使人难以看出命令如何能从《利维坦》第十四章“自然法”的定义中推出来。然而，霍布斯明确说演证应当是综合的，其中人们用较简单的组成部分构造出要演证的复杂事物。霍布斯断言，演证应当理解为向他人展示某个构造（OL I.76）；因此他声称“演证的全部方法是综合的”（OL I.71）。所谓“综合”，霍布斯指的是：一个人展示某物如何被组装起来以达到所期望的目的，即展示该物如何被制造。
    step2: |-
      第二，在霍布斯那里，演证并不经由演绎来推出诸特征。演绎只能给出起始命题中已含内容的知识，由此便难以看出：命令如何能从《利维坦》第十四章“自然法”的定义中推出。但霍布斯明确说，演证应当是综合的：人们用较简单的组成部分构造出有待演证的复杂事物。霍布斯断言，演证应理解为向他人展示某个构造（OL I.76）；因此他声称“演证的整个方法是综合的”（OL I.71）。所谓“综合”，霍布斯指展示某物如何被组装以达到所求目的——即展示该物如何被造出来。
