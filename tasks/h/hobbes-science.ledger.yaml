      > We are said to know [*scire*] some effect when we know what its causes are, in what subject they are, in what subject they introduce the effect and how they do it. Therefore, this is the knowledge [*scientia*] τοῦ διότι or of causes. All other knowledge [*cognitio*], which is called τοῦ ὅτι, is either sense experience or imagination remaining in sense experience or memory (*De Corpore* VI.1; CSL 287–289).
