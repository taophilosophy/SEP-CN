      霍布斯确信不可能知道自然现象的实际原因，因此他认为任何现象都容许多种可能的解释。不应由此以为霍布斯把一切解释、因而一切可能的原因或假设看作地位相等。相反，霍布斯主张，在试图对自然哲学作出任何解释之前，必须先完成第一哲学与几何学中的工作。这似乎就是霍布斯在上面所引《论人》长段引文中的意思，他说“物理学若不先演证某种东西，就什么也不能演证”（MC 42; OL II.93）。在给出解释时，霍布斯主张，理想的做法是诉诸那些与事实相混合时可从几何学演证出来的原因，并排除那些按几何学原理不可理解的原因。
