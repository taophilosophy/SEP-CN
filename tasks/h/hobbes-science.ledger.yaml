      A further difficulty for the unified view is that even if Hobbes did see the connection between, say, physics and moral philosophy as deductive, it is not obvious how that deduction would work because moral philosophy must add content about human passions (endeavors) that is not contained within—and thus not deducible from—physics. For example, although the concept ‘endeavor’ is introduced in physics, for it to be used in moral philosophy the concepts of ‘appetite’ and ‘aversion’, which are properties of human bodies, must be added to it for use (Malcolm 2002: 147)[^malcolm-2002]. One way to avoid this difficulty for the unified view would be to provide evidence that Hobbes made explicit the reduction relationship between concepts like ‘appetite’ and ‘aversion’ and the concept of ‘endeavour’, showing how one can reduce claims about human bodies to claims about microscopic bodies. Hobbes does not appear to do this anywhere in the corpus. However, even if a strong version of the unified view faces this difficulty, the presence of ‘endeavor’ throughout Hobbes’ philosophy shows that it was a foundational concept (see Jesseph 2016)[^jesseph-2016].
    step1: |-
      统一观还面临一个进一步的困难：即使霍布斯确实把例如物理学与道德哲学之间的关系看作演绎的，这种演绎如何进行并不明显，因为道德哲学必须增加关于人类激情（努力）的内容，而这些内容并不包含在物理学之内，因而也不能从物理学中演绎出来。例如，虽然“努力”（endeavor）这一概念在物理学中被引入，但要在道德哲学中使用它，还必须加上“欲望”（appetite）与“厌恶”（aversion）这两个人类身体的属性概念（Malcolm 2002: 147）[^malcolm-2002]。避免这一困难的一个办法是给出证据表明霍布斯明确说明了“欲望”“厌恶”这类概念与“努力”（endeavour）概念之间的还原关系，表明如何能把关于人类身体的主张还原为关于微观物体的主张。霍布斯似乎在全部著作中都没有这样做。然而，即使统一观的强版本面临这一困难，“努力”这一概念贯穿霍布斯哲学的事实表明它是一个基础性概念（见 Jesseph 2016）[^jesseph-2016]。
    step2: |-
      统一观还有进一步的困难：即便霍布斯确实把物理学与道德哲学的关系看作演绎性的，这种演绎如何运作也并不显然——道德哲学必须补充关于人类激情（努力，endeavors）的内容，而这类内容既不包含于物理学之内，也就不能从物理学演绎出来。例如，“努力”（endeavor）这一概念虽然是在物理学中引入的，但要在道德哲学中使用它，还须加上“欲望”（appetite）与“厌恶”（aversion）这两个人类身体的属性概念（Malcolm 2002: 147）[^malcolm-2002]。要为统一观避开这一困难，办法之一是举证霍布斯明确说明过“欲望”“厌恶”与“努力”（endeavour）诸概念之间的还原关系，表明如何把关于人类身体的主张还原为关于微观物体的主张。但霍布斯似乎从未在任何著作中这样做。不过，即便统一观的强版本面临此难，“努力”概念贯穿霍布斯哲学的事实本身，也表明它是一个基础性概念（见 Jesseph 2016）[^jesseph-2016]。
