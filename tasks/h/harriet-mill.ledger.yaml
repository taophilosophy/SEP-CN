      Had Taylor Mill produced a substantial body of philosophical work that could uncontroversially be called her own, we would not need to concern ourselves with what her contemporaries had to say about her abilities; we could make our own assessment. Because she lacks such a corpus, however, and because questions about what she might have written or how much influence she might have had on Mill’s intellectual career are so difficult to answer on purely textual grounds, the estimates of her intellectual powers formed by people who knew her must be taken into account.
    step1: |-
      倘若泰勒·密尔创作了大量可以毫无争议地称为她自己的哲学作品，我们便不必关心她的同时代人对她能力的评价；我们可以自行作出评估。然而，由于她缺少这样一批作品，又由于关于她可能写了什么、或她对密尔的智识生涯可能施加了多大影响等问题，单凭文本依据极难回答，所以认识她的人所形成的对她智识能力的评估必须加以考量。
    step2: |-
      倘若泰勒·密尔创作了大量能毫无争议地称为她自己作品的哲学著作，我们便不必费心她的同时代人对她能力的评价，而可自行评估。然而，她既缺少这样一批著作，而关于她可能写了什么、或她对密尔智识生涯影响几何等问题，单凭文本又极难回答，因此她同时代人对其智识能力的评估便须纳入考量。
