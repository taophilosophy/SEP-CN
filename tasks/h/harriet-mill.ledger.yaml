      Jacobs takes this comment to establish that Taylor Mill is the originator of Mill’s distinction between the logics of arts and sciences at the end of the *System of Logic*, and she accuses Mill of having in this case understated Taylor Mill’s contribution to one of his works (Jacobs 2002, 203n27; J. S. Mill, [SOL], 943–52)[^jacobs-2002].[^note-7] And while Mill states that Taylor Mill learned almost as much from him as he from her, Jacobs appears to think otherwise. In toting up the advantages of the collaboration to each of them, she notes that “Harriet administered Mill’s daily life, nursed his ego, and provided him with ideas.” In return, according to Jacobs, Mill gave Taylor Mill little more than Mary Ann Evans got for herself by becoming George Eliot: she merely “acquired the freedom to write provocative articles … and to be heard as a man, with seriousness and consideration” (Jacobs 2002, 129–31)[^jacobs-2002].
