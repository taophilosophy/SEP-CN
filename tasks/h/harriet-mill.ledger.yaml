      “The Enfranchisement of Women,” published in *The Westminster Review* in 1851, is the best candidate for a significant philosophical work authored primarily or even solely by Taylor Mill (H. T. Mill, [CW], 51–73). Occasioned by a series of feminist conventions in the United States, it makes a case not merely for giving women the ballot but for “equality in all rights, political, civil, and social, with the male citizens of the community” (H. T. Mill, [CW], 51). This essay contains many of the same lines of argument as *The Subjection of Women*, written by Mill and published in 1869, although it expresses a somewhat more radical view of gender roles than the later essay (see Rossi 1970, 41–5)[^rossi-1970]. It maintains that the denial of political rights to women tends to restrict their interests to matters that directly impact the family, with the result that the influence of wives on their husbands tends to diminish the latter’s willingness to act from public-spirited motives. Further, it contends that when women do not enjoy equal educational rights with men then wives will impede rather than encourage their husbands’ moral and intellectual development. And it insists that competition for jobs will prevent most of the problems that admitting women into the workforce would putatively cause from materializing. All of these points are common to “The Enfranchisement” and *The Subjection*. The major point of difference between the two is that while the *Subjection* rather notoriously suggests that the best arrangement for most married couples will be for the wife to concentrate on the care of the house and the children (J.S. Mill, [TSW], 297–8), a position that Mill also takes in an early essay on marriage written for Harriet (J. S. Mill, [OMA], 43), the “Enfranchisement” instead argues for the desirability of married women’s working outside the home.
