      Recent work by feminist scholars also makes a strong case that Taylor Mill may have influenced Mill’s work in more subtle and less direct ways than commentators usually consider. Helen McCabe suggests that Taylor Mill helped Mill “develop an emotional language that had previously been alien to him … and made him acknowledge, face up to, and express his emotions”; she describes this as “the most profound influence anyone could have had” on Mill, since it “made him into a much more human, sensitive and empathetic philosopher than he would otherwise have been” (McCabe 2017, 115)[^mccabe-2017]. And Philips observes that Taylor Mill’s own experience of patriarchy meant that she brought knowledge to her collaboration with Mill that he could never have acquired on his own (Philips 2018)[^philips-2018].
