      Those who argue that Taylor Mill was something less than what Mill took her to be must explain how he was so misled. There is a tradition of thinking that, in essence, he was psychologically unable to resist her charms. According to Mill’s friend and biographer Alexander Bain, it was commonly held among their contemporaries that “she imbibed all his views, and gave them back in her own form, by which he was flattered and pleased” (1882, 173). Ruth Borchard says that “Accustomed by training and experience to the acceptance of ascetic, masculine values, he was completely overpowered by her intensely feminine atmosphere” (1957, 46). And Laski speculates: “I should guess that she was a comfortable and sympathetic person and that Mill, brought up to fight Austin, Praed, Macaulay and Grote, had never met a really soft cushion before.” (*op. cit.*). Some writers have even advanced the idea that after the death of his domineering father James, Mill felt a need to invent another parental authority in order that he might submit to it (e.g., Trilling 1952, 118; Mazlish 1975, 286–91)[^mazlish-1975][^trilling-1952].
    step1: |-
      那些主张泰勒·密尔不及密尔所以为她的人，必须解释他何以如此受骗。有一种思想传统认为，本质上他在心理上无力抗拒她的魅力。据密尔的朋友兼传记作者亚历山大·贝恩说，他们的同代人普遍认为“她吸收了他所有的观点，并以她自己的形式将它们还给他，他因此感到受宠若惊、满心欢喜”（1882, 173）。露丝·博查德说：“由于训练与经验，惯于接受苦行、男性化的价值观，他完全被她那强烈的女性化氛围所压倒”（1957, 46）。而拉斯基推测：“我猜想她是一个令人安适而富有同情心的人，而密尔——自幼便被培养来与奥斯汀、普雷德、麦考莱和格罗特作战——此前从未见过真正的软垫。”（*前引*）。有些作者甚至提出，在其专横的父亲詹姆斯去世后，密尔感到需要发明另一个父母权威，以便向他臣服（例如 Trilling 1952, 118; Mazlish 1975, 286–91）[^mazlish-1975][^trilling-1952]。
