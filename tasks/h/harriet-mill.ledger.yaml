      女性主义学者近来的工作也为泰勒·密尔可能以比评论者通常所考虑的更为微妙、更不直接的方式影响密尔的工作提供了有力的论证。海伦·麦凯布提出，泰勒·密尔帮助密尔“发展了一种此前对他格格不入的情感语言……并使他承认、正视并表达自己的情感”；她把这描述为对密尔“任何人所能有的最深刻的影响”，因为它“使他成为远比他本来的样子更有人性、更敏感、更具同理心的哲学家”（McCabe 2017, 115）[^mccabe-2017]。而菲利普斯观察到，泰勒·密尔自己对父权制的亲身经验意味着她为与密尔的协作带来了他永远无法独自获得的知识（Philips 2018）[^philips-2018]。
