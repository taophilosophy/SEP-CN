      《妇女的选举权》于 1851 年发表于《威斯敏斯特评论》（*The Westminster Review*），是泰勒·密尔主要甚或完全撰写的重大哲学作品的最佳候选（H. T. 密尔, [CW], 51–73）。它由美国的一系列女权主义大会所引发，不仅为给予妇女投票权辩护，而且为“在政治、公民与社会的一切权利上与共同体的男性公民平等”（H. T. 密尔, [CW], 51）辩护。这篇文章包含许多与密尔所写、1869 年出版的《女性的屈从》（*The Subjection of Women*）相同的论证思路，尽管它对性别角色的观点比后来的论文略显激进（见 Rossi 1970, 41–5）[^rossi-1970]。它主张，剥夺妇女的政治权利往往会把她们的兴趣限制在直接波及家庭的事务上，结果是妻子对丈夫的影响往往会削弱后者出于公共精神动机而行动的意愿。它进一步主张，当妇女不能与男子享有平等的受教育权利时，妻子将阻碍而非鼓励丈夫的道德与智识发展。它还坚持认为，就业竞争将防止开放妇女进入劳动力市场所推定的种种问题中的大多数成为现实。所有这些论点都为《妇女的选举权》与《女性的屈从》（*The Subjection of Women*）所共有。两者之间的主要差异在于：尽管《屈从》（*The Subjection*）颇为有名地暗示，对大多数已婚夫妇而言，最佳安排是妻子专注于照料家庭与子女（J. S. 密尔, [TSW], 297–8）——这也是密尔在为哈丽雅特所写的一篇早期论婚姻的文章中采取的立场（J. S. 密尔, [OMA], 43）——而《选举权》则为已婚妇女在外工作之可取性辩护。
