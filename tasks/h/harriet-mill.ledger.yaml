      While there are several works of which it is possible to describe Taylor Mill as an author or co-author with little fear of contradiction, Menaka Philips observes that none of them constitute what philosophers have traditionally regarded as a “great text” (2018, 629). A handful of published pieces, such as some poems, book reviews, and an essay on the aesthetic appreciation of the seasons that were published in the *Monthly Repository* in the early 1830s, when Fox was its editor, have minimal philosophical content. *The Complete Works of Harriet Taylor Mill*, edited by Jo Ellen Jacobs, contains various drafts of unpublished essays that are in Taylor Mill’s hand on ethics and social philosophy; their topics include defenses of women’s rights and tolerance and criticisms of religion (Jacobs 1998)[^jacobs-1998]. But while at points suggestive, these pieces are also brief and indeed most are incomplete fragments. Although these drafts share thematic similarities with the published works described in this section, as well as other works by Mill such as *The Subjection of Women* and “The Utility of Religion,” they do not correspond closely with particular stretches of text in these published works.[^note-2] While little has been written about these drafts, commentators have offered conflicting assessments of their cogency and significance. (Compare, for example, Michèle Le Doeuff’s (2003, 203–4) and K. C. O’Rourke’s (2001, 60–1) remarks on a draft of an essay on toleration and conformity, which is circa five pages in length.)
