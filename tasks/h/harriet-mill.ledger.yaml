      在最近一篇文章中，克里斯托夫·施密特-佩特里、米夏埃尔·舍夫奇克与莉莉·奥斯堡（2022）采用计量文体学技术来确定泰勒·密尔在创作《论自由》（*On Liberty*）中的角色。这一创新方法预设作者具有可通过机器学习算法识别的文体“指纹”，因此通过把一篇作者未知的文本与据知由不同“嫌疑人”（即可能的作者）所写的其他文本相比较，前者的作者便可被识别。他们的结论是，《论自由》（*On Liberty*）的若干段落并非密尔独自所写，而是由泰勒·密尔或两人共同所写。其方法的一个局限是，我们对其结论的确信度不可能超过我们对作为算法输入的文本之归属的确信度。正如他们所承认的，其中一些文本并无共识。例如，他们不仅假定《原理》（*Principles*）中论工人阶级之未来的一章完全由泰勒·密尔所写，而且假定该两卷本其余部分由两人合写——甚至最“纯科学”的部分也是如此。因此，与《政治经济学原理》（*The Principles of Political Economy*）一样，关于泰勒·密尔应被视为《论自由》（*On Liberty*）合著者的主张，证据也是含糊的。
