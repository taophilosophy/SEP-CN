      Harriet Taylor Mill (1807–1858) poses a unique set of problems for an encyclopedist. The usual approach to writing an entry on a historical figure, namely presenting a straightforward summary of their major works and then offering a few words of appraisal, is not available. This is because she worked in such close collaboration with John Stuart Mill that it is exceedingly difficult to disentangle their contributions to the products of their joint effort. In attempting to assess Taylor Mill’s philosophical career, one encounters sharply conflicting reports about her ability from people who knew her, contradictory evidence about her role in authoring several books and essays, and widely varying judgments about how much influence she exerted on Mill’s thought and work.
    step1: |-
      哈丽雅特·泰勒·密尔（1807–1858）为百科全书编纂者提出了一系列独特的问题。撰写历史人物词条的通常做法，即直截了当地概述其主要著作，然后加以几句评价，在这里并不可行。这是因为她与约翰·斯图亚特·密尔合作得如此紧密，以至于极难区分他们对两人合作成果各自所作的贡献。在试图评估泰勒·密尔的哲学生涯时，人们会遇到来自认识她的人对她的才能的尖锐矛盾的报告、关于她在若干著作与文章撰写中角色的相互矛盾的证据，以及关于她对密尔思想与著作施加了多大影响的迥然不同的判断。
    step2: |-
      哈丽雅特·泰勒·密尔（1807–1858）为百科全书编纂者提出了一系列独特的难题。为历史人物撰写词条的通常做法——直截了当地概述其要著作，再补上几句评价——在此并不可行。这是因为她与约翰·斯图亚特·密尔合作得如此紧密，以致极难区分两人对共同成果各自所作的贡献。在试图评估泰勒·密尔的哲学生涯时，人们会见到：认识她的人对她才能的陈述尖锐矛盾；关于她撰写若干著作与文章之角色的证据彼此冲突；关于她对密尔思想与著作影响大小的判断迥然不同。
