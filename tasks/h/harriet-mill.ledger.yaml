      > In the first draft of the book, that chapter did not exist. She pointed out the need of such a chapter, and the extreme imperfection of the book without it: she was the cause of my writing it; and the more general part of the chapter, the statement and discussion of the two opposite theories respecting the proper condition of the labouring classes, was wholly an exposition of her thoughts, often in words taken from her own lips. The purely scientific part of the Political Economy I did not learn from her; but it was chiefly her influence that gave to the book that general tone by which it is distinguished from all previous expositions of Political Economy that had any pretension to being scientific, and which has made it so useful in conciliating minds which those previous expositions had repelled…. The economic generalizations which depend, not on necessities of nature but on those combined with the existing arrangements of society, it deals with only as provisional, and as liable to be much altered by the progress of social improvement. I had indeed partially learnt this view of things from the thoughts awakened in me by the speculations of the St. Simonians; but it was made a living principle pervading and animating the book by my wife’s promptings. ([ALE], 255–7)
