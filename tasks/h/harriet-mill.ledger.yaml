      No one else who knew Taylor Mill personally spoke of her in anything like these terms, as far as we know, and indeed several of her acquaintances held her in low estimation. The Carlyles were admirers initially, but they soon had changes of heart. Jane says that Harriet was “a peculiarly affected body” who “was not easy unless she startled you with unexpected sayings” and was even “somewhat of a humbug” (quoted in Packe 1954, 325–6)[^packe-1954]. Thomas comments that “She was full of unwise intellect, asking and re-asking stupid questions” (quoted in Packe 1954, 315)[^packe-1954]. Harold Laski relates that “Morley told me that Louis Blanc told him that he once sat for an hour with her and that she repeated to him what afterwards turned out to be an article that Mill had just finished for the *Edinburgh*…. If she was what he thought, someone at least should have given us indications” (quoted in Stillinger 1961, 24–5)[^stillinger-1961].
