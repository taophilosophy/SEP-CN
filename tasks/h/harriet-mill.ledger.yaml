      Harriet was widowed in 1849, and she married John Mill in 1851. The Mills spent most of their married life in their Blackheath Park home, with just Haji and Helen Taylor for company. They had already largely withdrawn from society, perhaps due to the gossip that their relationship generated. Real or perceived slights toward Taylor Mill by Mill’s mother and some of his siblings after their wedding resulted in his estrangement from much of his family (on this see Packe 1954, 349–57; Jacobs 2002, 117)[^jacobs-2002][^packe-1954]. The Mills did sometimes interrupt their reclusion to travel, separately or together, to the south of England or to the Continent in pursuit of a more healthful climate. In late 1858, after Mill’s retirement from the East India Company, they set out for Montpellier, but Taylor Mill’s fragile health gave out in Avignon. Mill bought a small house there, next to the cemetery in which she was buried, where he spent a considerable portion of the remainder of his life. (He died and was buried in Avignon in 1873.)
    step1: |-
      哈丽雅特于 1849 年守寡，并于 1851 年嫁给约翰·密尔。密尔夫妇婚后的绝大部分时间在布莱克希思公园的家中度过，只有哈吉与海伦·泰勒相伴。他们大抵已退出了社交圈，也许是因为他们的关系所招致的闲言碎语。婚礼后密尔的母亲及其部分兄弟姐妹对泰勒·密尔真实或想象中的怠慢，导致他与大部分家人疏远（参见 Packe 1954, 349–57; Jacobs 2002, 117）[^jacobs-2002][^packe-1954]。密尔夫妇有时会中断隐居生活外出旅行，或分或合，前往英格兰南部或欧洲大陆寻求更宜人的气候。1858 年末，密尔从东印度公司退休后，他们启程前往蒙彼利埃，但泰勒·密尔脆弱的健康在阿维尼翁不支。密尔在那里购置了一所小房子，紧邻安葬她的墓地，此后他余生相当一部分时间在此度过。（他于 1873 年在阿维尼翁去世并安葬于此。）
    step2: |-
      哈丽雅特于 1849 年守寡，1851 年嫁给约翰·密尔。密尔夫妇婚后大部分时间住在布莱克希思公园的家中，只有哈吉与海伦·泰勒相伴。他们大抵已淡出社交圈，或许缘于他们关系招致的流言蜚语。婚礼后，密尔的母亲及部分兄弟姐妹对泰勒·密尔或真实或想象出的怠慢，导致他与大部分家人疏远（参见 Packe 1954, 349–57; Jacobs 2002, 117）[^jacobs-2002][^packe-1954]。密尔夫妇有时会中断隐居外出旅行，或分或合，前往英格兰南部或欧洲大陆，以求更宜人的气候。1858 年末，密尔从东印度公司退休后，他们启程前往蒙彼利埃，但泰勒·密尔脆弱的健康在阿维尼翁不支。密尔在那里购置了一所小房子，紧邻安葬她的墓地；此后他余生相当一部分时间在此度过。（他于 1873 年在阿维尼翁去世，并安葬于此。）
