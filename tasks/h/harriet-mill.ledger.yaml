      To feel entirely confident about any judgment about how far Taylor Mill influenced Mill, we would need not only access to her letters which were destroyed but recordings from inside their home at Blackheath. But as with the descriptions of Taylor Mill’s character and ability discussed above, there is a wide middle ground between the minimalist and maximalist assessments. One intermediate view is that of Bain, who suggests that just as Mill’s friend John Sterling “overflowed in suggestive talk, which Mill took up and improved in his own way,” so Taylor Mill might have done as well (1882, 173–4). Robson comments that “[I]n what we have of her writings, Harriet constantly has her eye on the future, even when criticizing the present; she was a woman of dreams and aspirations, and she must constantly have breathed into Mill a hopeful and expansive view of human possibilities” (1966, 178).[^note-8] What Bain seems to be suggesting is that Taylor Mill’s greatest contribution to the Mills’ collaboration, apart from any writing that she did herself, was to turn Mill’s attention to the defense of a set progressive ideals and causes reflective of these possibilities: Socialism, women’s rights, individual liberty, and above all a “utopian” view of humanity’s improvability. This is not necessarily to say that he held these positions just because she did, which he explicitly tells us was not the case with women’s rights ([ALE], 253n). Nor must it mean that she contributed little or nothing to the arguments by which he defends them. Bain knew Mill extremely well, and even though he says that his friend was under “an extraordinary hallucination as to the personal qualities of his wife,” and “outraged all reasonable credibility in describing her matchless genius,” he is also adamant not only that Mill “was not such an egoist as to be captivated by the echo of his own opinions” but also that he would only have been stimulated by someone with “independent resources” who had a “good mutual understanding as to the proper conditions of the problem at issue” (1882, 173–4).
    step1: |-
      要对泰勒·密尔在多大程度上影响了密尔作出任何判断都感到完全自信，我们不仅需要接触到她被毁掉的书信，还需要他们在布莱克希思家中内部的记录。但正如上文讨论的对泰勒·密尔性格与能力的描述一样，在极简主义与极多主义评估之间也存在广阔的中间地带。一种居中的观点是贝恩的，他暗示，正如密尔的朋友约翰·斯特林“在启发性的谈话中滔滔不绝，密尔把其接过来并加以改进”，泰勒·密尔或许也如此（1882, 173–4）。罗布森评论说：“[在]我们所拥有的她的著作中，哈丽雅特始终着眼于未来，即使在批评当下时也是如此；她是一个充满梦想与抱负的女人，她必定不断向密尔吹入一种对人类可能性之希望而开阔的看法”（1966, 178）。[^note-8] 贝恩似乎在暗示，泰勒·密尔对密尔夫妇协作的最大贡献——除她自己所做的任何写作之外——在于把密尔的注意力转向一组反映这些可能性的进步理想与事业之辩护：社会主义、妇女权利、个人自由，以及尤其是对人性可改进性的“乌托邦式”看法。这未必是说，他持有这些立场仅仅因为她持有它们——关于妇女权利，他明确告诉我们并非如此（[ALE], 253n）。也未必意味着她对赖以辩护这些立场的论证毫无贡献或贡献甚微。贝恩非常了解密尔，尽管他说他的朋友“对其妻子的个人品质有一种奇特的幻觉”，并“在描述她无比的才华时超出了所有合理的可信度”，但他也坚决主张，密尔“并非如此利己，以致被自己观点的回声所迷住”，而且他只会被一个拥有“独立资源”、对“所论问题的适当条件有良好相互理解”的人所激发（1882, 173–4）。
