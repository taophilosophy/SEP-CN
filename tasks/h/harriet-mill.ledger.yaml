      In a bibliography that he compiled of his writings, Mill describes a number of newspaper articles that appeared from the middle of the 1840s to the early 1850s—most comment on recent criminal trials—as having been co-authored by himself and Taylor Mill (MacMinn *et al.* 1945, 59–76)[^macminn-1945]. Frequently, he adds that very little of the article was his. In a like manner, he says in the entry for an 1853 pamphlet examining a proposed domestic violence bill “In this I acted chiefly as an amanuensis to my wife” (MacMinn *et al.* 1945, 79)[^macminn-1945]. One thread that runs through many of these occasional pieces is the suggestion that the law is excessively harsh where the security of property is concerned yet excessively lax when dealing with those who do violence to other persons, especially women and children. (For a detailed analysis of the content of these articles, see Manning 2019.)[^manning-2019] A newspaper article or short popular pamphlet is necessarily far from being a theoretical treatise, but Philips (2018, 634) credits Taylor Mill with the “gritty” detail in which these co-authored pieces depict women’s lived experience from a theoretically-informed perspective.[^note-3]
