      > Although it was years after my introduction to Mrs. Taylor before my acquaintance with her became at all intimate or confidential, I very soon felt her to be the most admirable person I had ever known. It is not to be supposed that she was, or that any one, at the age at which I first saw her, could be, all that she afterwards became. Least of all could this be true of her, with whom self-improvement, progress in the highest and in all senses, was a law of her nature; a necessity equally from the ardour with which she sought it, and from the spontaneous tendency of faculties which could not receive an impression or an experience without making it the source or the occasion of an accession of wisdom. Up to the time when I first saw her, her rich and powerful nature had chiefly unfolded itself according to the received type of feminine genius. To her outer circle she was a beauty and a wit, with an air of natural distinction, felt by all who approached her: to the inner, a woman of deep and strong feeling, of penetrating and intuitive intelligence, and of an eminently meditative and poetic nature. Married at a very early age, to a most upright, brave, and honourable man, of liberal opinions and good education, but without the intellectual or artistic tastes which would have made him a companion for her, though a steady and affectionate friend, for whom she had true esteem and the strongest affection through life, and whom she most deeply lamented when dead; shut out by the social disabilities of women from any adequate exercise of her highest faculties in action on the world without; her life was one of inward meditation, varied by familiar intercourse with a small circle of friends, of whom one only (long since deceased) was a person of genius [Eliza Flower], of capacities of feeling or intellect kindred with her own, but all had more or less of alliance with her in sentiments and opinions. Into this circle I had the good fortune to be admitted, and I soon perceived that she possessed in combination, the qualities which in all other persons whom I had known I had been only too happy to find singly. In her, complete emancipation from every kind of superstition (including that which attributes a pretended perfection to the order of nature and the universe), and an earnest protest against many things which are still part of the established constitution of society, resulted not from the hard intellect, but from strength of noble and elevated feeling, and co-existed with a highly reverential nature. In general spiritual characteristics, as well as in temperament and organisation, I have often compared her, as she was at this time, to Shelley: but in thought and intellect, Shelley, so far as his powers were developed in his short life, was but a child compared with what she ultimately became. Alike in the highest regions of speculation and in the smaller practical concerns of daily life, her mind was the same perfect instrument, piercing to the very heart and marrow of the matter; always seizing the essential idea or principle. The same exactness and rapidity of operation, pervading as it did her sensitive as well as her mental faculties, would, with her gifts of feeling and imagination, have fitted her to be a consummate artist, as her fiery and tender soul and her vigorous eloquence would certainly have made her a great orator, and her profound knowledge of human nature and discernment and sagacity in practical life, would, in the times when such a *carrière* was open to women, have made her eminent among the rulers of mankind. Her intellectual gifts did but minister to a moral character at once the noblest and the best balanced which I have ever met with in life. Her unselfishness was not that of a taught system of duties, but of a heart which thoroughly identified itself with the feelings of others, and often went to excess in consideration for them by imaginatively investing their feelings with the intensity of its own. The passion of justice might have been thought to be her strongest feeling, but for her boundless generosity, and a lovingness ever ready to pour itself forth upon any or all human beings who were capable of giving the smallest feeling in return. The rest of her moral characteristics were such as naturally accompany these qualities of mind and heart: the most genuine modesty combined with the loftiest pride; a simplicity and sincerity which were absolute, towards all who were fit to receive them; the utmost scorn of whatever was mean and cowardly, and a burning indignation at everything brutal or tyrannical, faithless or dishonourable in conduct and character, while making the broadest distinction between *mala in se* and mere *mala prohibita*—between acts giving evidence of intrinsic badness in feeling and character, and those which are only violations of conventions either good or bad, violations which whether in themselves right or wrong, are capable of being committed by persons in every other respect lovable or admirable. (J. S. Mill, [ALE], 193–7)
