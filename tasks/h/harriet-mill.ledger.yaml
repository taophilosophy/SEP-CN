      [^note-8]: Worth noting in this regard is Mill’s criticism of Taylor Mill’s assertion that, if given the opportunity, the cleverer members of a community would find it “easy” to raise the children of the next generation to be “perfect,” and could do so within ten years. Mill responds that “I cannot persuade myself that you do not greatly overrate the ease of making people unselfish. Granting that in ‘ten years’ the children of a community might by teaching be made ‘perfect’ it seems to me that to do so there must be perfect people to teach them” (J. S. Mill, [TLL], 19).
