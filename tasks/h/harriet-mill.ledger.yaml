      No firm conclusions have been reached here as to what personal qualities Taylor Mill possessed, what if any philosophical works she authored or co-authored, or how much influence she exercised over Mill’s philosophical career. All that has been attempted is to present the wide range of answers that have been given to these questions. The available evidence may be too sparse and too contradictory for us ever to arrive at definitive answers. Taylor Mill may therefore be destined to remain an essentially contested figure in the history of philosophy.
    step1: |-
      本文没有就泰勒·密尔拥有何种个人品质、她是否撰写或合著了什么哲学著作、或她对密尔的哲学生涯施加了多大影响达成任何确定的结论。本文所尝试的一切，只是呈现对这些问题的各种回答的广泛范围。可用的证据或许过于稀少、过于矛盾，以致我们永远无法得出确定的答案。因此，泰勒·密尔或许注定仍将是哲学史上一个本质上充满争议的人物。
