      Harriet Taylor and John Stuart Mill met for the first time in 1830. Their meeting was arranged by the leader of Harriet’s Unitarian congregation, the Reverend W. J. Fox. The two young people very quickly fell in love. Their conduct during the long period in which Harriet was married to John Taylor would be scandalous by contemporary standards, let alone Victorian ones. Early on, John Mill made almost nightly visits to the Taylors’ home, visits that John Taylor would facilitate by going to his club. On the whole, John Taylor was remarkably tolerant of the fact that his wife was on such intimate terms with another man, but his tolerance did have some limits. In 1833, at his insistence, Harriet established a separate residence, and she lived apart from her husband for most of the rest of his life, seeing John at her convenience. (Helen lived with her, Herbert and Haji with their father.) In 1848, John Taylor refused to allow John Mill to dedicate *The Principles of Political Economy* to Harriet, although the dedication was nonetheless inserted into special copies of the book that they distributed to friends. When John Taylor began to suffer from the cancer that would eventually take his life, he asked Harriet to return home to care for him. She declined, on the grounds that her first duty was to John Mill, who at the time was himself suffering from an injured hip and temporary near-blindness. While John Mill eventually mended, John Taylor’s condition only worsened, and at the end Harriet did dedicate herself to caring for her husband. In fact, she rebuked John Mill very sharply for having failed, while visiting her, to ask about her husband’s health. She upbraided him even more severely for having suggested that she might write to him during an “odd time” when she might find a “change of subject of thought a relief”: “Good God, sh[oul]d you think it a relief to think of something else some acquaintance or what not while *I* was dying?” (H. T. Mill, [CW], 360).
    step1: |-
      哈丽雅特·泰勒与约翰·斯图亚特·密尔于 1830 年首次相遇。他们的会面由哈丽雅特所属一位论派教会的领袖 W. J. 福克斯牧师安排。两位年轻人很快坠入爱河。在哈丽雅特与约翰·泰勒婚姻存续的漫长时期里，他们的行为按当时的标准堪称丑闻，更不必说维多利亚时代的标准了。起初，约翰·密尔几乎每夜造访泰勒家，而约翰·泰勒往往会去俱乐部以行方便。总体而言，约翰·泰勒对妻子与另一男子如此亲密这件事相当宽容，但他的容忍确有限度。1833 年，在他的坚持下，哈丽雅特另设居所，并在其夫余生的绝大部分时间里与他分居，在自己方便时与约翰相见。（海伦与她同住，赫伯特与哈吉与父亲同住。）1848 年，约翰·泰勒拒绝允许约翰·密尔将《政治经济学原理》（*The Principles of Political Economy*）题献给哈丽雅特，尽管这一题献仍被插入他们分发给朋友的精装本中。当约翰·泰勒开始遭受最终夺去其生命的癌症折磨时，他请求哈丽雅特回家照料他。她拒绝了，理由是她的首要义务在于约翰·密尔，而后者当时正因髋部受伤和暂时的近乎失明而痛苦。约翰·密尔最终痊愈，但约翰·泰勒的病情持续恶化，最终哈丽雅特确实全身心地照料起丈夫来。事实上，她严厉责备约翰·密尔在探望她时未能问及她丈夫的健康。她甚至更严厉地斥责他，因为他建议她或许可以趁某个“空闲时刻”给他写信，那时她或许会觉得“换一个思考主题是一种解脱”：“天哪，你难道认为去想点别的事、想某个熟人或别的什么是一种解脱，而**我**却正垂死吗？”（H. T. 密尔, [CW], 360）。
    step2: |-
      哈丽雅特·泰勒与约翰·斯图亚特·密尔于 1830 年首次相遇。会面由哈丽雅特所属一位论派教会的领袖 W. J. 福克斯牧师安排，两人很快坠入爱河。在哈丽雅特与约翰·泰勒婚姻存续的漫长岁月里，他们的行为即便按当时的标准亦属丑闻，更遑论维多利亚时代的标准。起初，约翰·密尔几乎每夜造访泰勒家，约翰·泰勒往往去俱乐部以行方便。总的来说，约翰·泰勒对妻子与另一男子如此亲密相当宽容，但他的容忍确有限度。1833 年，在他坚持下哈丽雅特另设居所，此后在丈夫余生的绝大部分时间里与他分居，只在方便时与约翰相见。（海伦与她同住，赫伯特与哈吉随父亲。）1848 年，约翰·泰勒拒绝让约翰·密尔把《政治经济学原理》（*The Principles of Political Economy*）题献给哈丽雅特，尽管这一题献仍被插入他们分发给友人的精装本中。当约翰·泰勒开始承受最终夺命的癌症折磨时，他请求哈丽雅特回家照料自己。她拒绝了，理由是她的首要义务在于约翰·密尔，而后者当时正因髋部受伤与暂时的近乎失明而受苦。约翰·密尔最终痊愈，但约翰·泰勒的病情持续恶化，到头来哈丽雅特确曾全身心照料丈夫。事实上，她严厉责备约翰·密尔在探望她时没有问及她丈夫的健康；更斥责他竟建议她趁某个“闲暇时刻”写信给他，说她那时或许会觉得“换一个思考主题乃是解脱”：“天哪，你难道认为去想点别的、想某位熟人或别的什么是一种解脱，而 **我** 却正垂死吗？”（H. T. Mill, [CW], 360）。
