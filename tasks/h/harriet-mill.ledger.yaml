      The woman who is today most commonly known as Harriet Taylor or Harriet Taylor Mill was born Harriet Hardy in London in October 1807.[^note-1] She married the pharmaceuticals wholesaler John Taylor on 14 March 1826; she was eighteen and he twenty-nine. The couple had three children: Herbert, born in 1827; Algernon (“Haji”), born in 1830; and Helen (“Lily”), born in 1831. John Taylor died of rectal cancer in 1849, and in the spring of 1851 Harriet was married again, this time to John Stuart Mill. She suffered from various health problems affecting her nervous and respiratory systems. In 1841, for instance, she lost much of the use of her legs for an extended period (J. S. Mill, [TEL], 486–7). A tuberculosis sufferer, as was John—it is possible that she caught “consumption” from him (see Packe 1954, 360)[^packe-1954]—she died of a respiratory failure on 3 November 1858.
    step1: |-
      今天最常被称为哈丽雅特·泰勒或哈丽雅特·泰勒·密尔的这位女性，1807 年 10 月出生于伦敦，本姓哈迪（Hardy）。[^note-1] 她于 1826 年 3 月 14 日嫁给药品批发商约翰·泰勒；她当时十八岁，他二十九岁。夫妇俩有三个孩子：赫伯特（生于 1827 年）、阿尔杰农（“哈吉”，生于 1830 年）、海伦（“莉莉”，生于 1831 年）。约翰·泰勒于 1849 年死于直肠癌，1851 年春哈丽雅特再婚，这次嫁给了约翰·斯图亚特·密尔。她患有多种影响其神经与呼吸系统的健康问题。例如 1841 年，她一度长期失去大部分腿部功能（J. S. 密尔, [TEL], 486–7）。她和约翰一样是结核病患者——她可能从他那里感染了“痨病”（见 Packe 1954, 360）[^packe-1954]——她于 1858 年 11 月 3 日死于呼吸衰竭。
    step2: |-
      今天最常被称作哈丽雅特·泰勒或哈丽雅特·泰勒·密尔的这位女性，1807 年 10 月生于伦敦，本姓哈迪（Hardy）。[^note-1] 她于 1826 年 3 月 14 日嫁给药品批发商约翰·泰勒，时年十八岁，而他二十九岁。夫妇二人育有三子：赫伯特（生于 1827 年）、阿尔杰农（“哈吉”，生于 1830 年）与海伦（“莉莉”，生于 1831 年）。约翰·泰勒于 1849 年死于直肠癌；1851 年春，哈丽雅特再婚，嫁与约翰·斯图亚特·密尔。她患有多种影响神经与呼吸系统的健康问题，例如 1841 年曾长期失去大部分腿部功能（J. S. Mill, [TEL], 486–7）。她和约翰一样是结核病患者——她很可能从他那里染上了“痨病”（见 Packe 1954, 360）[^packe-1954]——最终于 1858 年 11 月 3 日死于呼吸衰竭。
