      This difference is an important piece of evidence in favor of attributing the essay to Taylor Mill (although Richard Krouse points out that the essay leaves unanswered the question it raises about who is to care for the home and the children; see 1982, 169). Still, not all of the evidence is on this side. In 1849, Mill urges Taylor Mill to finish a pamphlet that she was writing on the subject of women ([TLL], 13). Yet soon thereafter, in correspondence with the *Westminster*’s editor about the “Enfranchisement,” he speaks of the article as if he is its author, writing for instance that “If you are inclined for an article on the Emancipation of Women, … I have one nearly ready… ” ([TLL], 55–6, 65–6). In an 1854 letter, Mill rather ambiguously reminds Taylor Mill that when the “Enfranchisement” is published in a projected collection of his work it will be “preceded by a preface which will show that much of all my later articles, and all the best of that one, were, as they were, my Darling’s” ([TLL], 190). If we can draw any implication from this, it seems to be that while the strongest arguments in the article were due to Harriet, Mill was still the actual author. But the preface that actually appeared, in the collection of Mill’s writings published in his lifetime (*Dissertations and Discussions*), suggests (albeit vaguely) that his contribution was somewhat smaller than this; there he describes the essay as “hers in a particular sense, my share in it being little more than that of an editor and amanuensis” (J. S. Mill 1882, 93–4)[^mill-1882]. (He adds that the article’s authorship was “known at the time, and publicly attributed to her.”) In an 1851 letter to William Lloyd and Helen Benson Garrison, Lucretia Coffin Mott writes that she had received a copy of the essay from Harriet’s son Herbert and adds “The writer of it was a Mrs. Taylor a widow who has recently married J. S. Mill.… Part of it is from his pen. Indeed, she says, *he* wrote it—he says, *she* wrote it” (Mott 2002, p. 209)[^mott-2002].
    step1: |-
      这一差异是支持把这篇论文归于泰勒·密尔的一项重要证据（尽管理查德·克劳斯指出，这篇论文把它所提出的关于谁来照料家庭与子女的问题悬而未决；见 1982, 169）。尽管如此，并非所有证据都支持这一方。1849 年，密尔敦促泰勒·密尔完成她正在撰写的关于妇女问题的小册子（[TLL], 13）。然而此后不久，在与《威斯敏斯特评论》（*The Westminster Review*）编辑关于《选举权》的通信中，他把这篇文章说成仿佛自己是作者，例如写道：“如果你有意写一篇论妇女解放的文章，……我有一篇几乎写好了的……”（[TLL], 55–6, 65–6）。在 1854 年的一封信中，密尔颇为含糊地提醒泰勒·密尔，当《选举权》收入他计划中的文集时，它将“由一篇序言作前导，以表明我后来文章中的大部分，以及那一篇中所有最好的部分，确实如它们本然那样，是我亲爱的（Darling）的”（[TLL], 190）。如果我们可以从中得出什么含义，那似乎是：虽然文章中那些最有力的论证应归功于哈丽雅特，但密尔仍是实际的作者。然而，实际出现的那篇序言，收入密尔生前出版的文集（《论文集与讨论》（*Dissertations and Discussions*）），（尽管含糊地）表明他的贡献比这要小一些；在那里他把这篇论文描述为“在特定意义上属于她，我的份额不过略多于编辑与书记员”（J. S. 密尔 1882, 93–4）[^mill-1882]。（他补充说，这篇文章的作者身份当时“众所周知，并被公开归于她”。）在 1851 年致威廉·劳埃德与海伦·本森·加里森的一封信中，卢克丽霞·科芬·莫特写道，她已从哈丽雅特的儿子赫伯特处收到这篇论文的副本，并补充说：“作者是一位最近嫁给 J. S. 密尔的寡妇泰勒太太。……其中一部分出自他笔下。的确，她说，**他**写的——他说，**她**写的”（Mott 2002, p. 209）[^mott-2002]。
