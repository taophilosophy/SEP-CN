      > *Were I but capable of interpreting to the world one half the great thoughts and noble feelings which are buried in her grave, I should be the medium of a greater benefit to it, than is ever likely to arise from anything that I can write, unprompted and unassisted by her all but unrivaled wisdom.* —J. S. Mill ([OL], 216)
    step1: |-
      > *倘若我尚能以她的坟墓中所埋葬的伟大的思想与高贵情感之半向世界阐释，我便能由此带给世界更大的裨益，远过于我独自书写、未经她那几乎无与伦比的智慧之启发与协助所能产生的任何东西。* ——J. S. 密尔（[OL], 216）
    step2: |-
      > 倘若我尚能以她的坟墓中所埋葬的伟大思想与高贵情感之半向世人阐释，我由此带给世界的裨益，必将远超我在没有她那几乎无与伦比的智慧的启发与协助下独自书写所能产生的任何东西。 ——J. S. Mill（[OL], 216）
