      就我们所知，其他任何亲自认识泰勒·密尔的人都不曾以近乎这样的言辞谈论她，事实上她的几位相识都对她评价甚低。卡莱尔夫妇起初是仰慕者，但很快改变了心意。简说哈丽雅特是“一个格外矫揉造作的人”，她“除非以出人意料的言语使你一惊，否则便不安适”，甚至是“有几分江湖骗子”（引自 Packe 1954, 325–6）[^packe-1954]。托马斯评论道：“她满是不智的才智，反复询问愚蠢的问题”（引自 Packe 1954, 315）[^packe-1954]。哈罗德·拉斯基讲述说：“莫利告诉我，路易·勃朗告诉他，勃朗曾与她同坐一小时，她把一段后来证明是密尔刚为《爱丁堡评论》（*Edinburgh*）写好的文章复述给他听……如果她真如他所想的那样，至少总该有人给我们一些迹象”（引自 Stillinger 1961, 24–5）[^stillinger-1961]。
