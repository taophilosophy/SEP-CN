      > 虽然在我被引见泰勒太太之后多年，我与她的交往才变得多少亲密或推心置腹，但我很快就感到她是我所认识的最令人钦佩的人。不能设想她——或任何人，在我初次见到她时的那种年纪——就已具备她后来所成为的一切。尤其不能设想这一点适用于她：对她而言，自我完善、在最高且一切意义上的进步，是她本性的法则；这种必然性同样源于她追求它的热忱，也源于她那自动自发的禀赋倾向——这种禀赋不会接受任何印象或经验，而不把它当作增添智慧的源泉或契机。到我初次见到她时，她那丰沛而有力的本性主要已依照公认的女性天才类型而展现。在她外圈的人看来，她是一位美人与才女，带着一种天生的卓尔不群的气度，凡接近她的人都感受得到；在内圈的人看来，她是一位情感深沉而强烈的女性，具有洞彻而直觉的智识，以及一种卓绝的沉思而诗意的本性。她很早就嫁给了最正直、勇敢而可敬的男子，他见解开明、受过良好教育，却没有能使她引为伴侣的智识或艺术趣味——尽管他是个坚定而深情的友人，她对他怀有一生的真挚敬意与最深挚的眷爱，他去世时她哀恸至深；由于女性在社交上的种种不利限制，她无法在外部世界上充分施展其最高禀赋；她的生活是一种内向的沉思，间或与一小群友人亲密往还，其中只有一位（早已辞世）是天才人物［伊莱扎·弗劳尔（Eliza Flower）］，其感受或智识的禀赋与她相近，但其余的人都或多或少与她气味相投。我有幸被接纳进这个圈子，我很快发现，她兼具我在所有其他认识的人身上只能有幸一一找到的那些品质。在她身上，对一切迷信的彻底解放（包括那种把一种假定的完美归于自然与宇宙秩序的迷信），以及对许多仍属于社会既定建制之物的诚挚抗议，并非源于冷酷的智识，而是源于高贵而崇高的情感力量，并与一种极为虔敬的本性共存。就一般精神特质而言，也就在气质与组织而言，我常把她当时的模样比作雪莱：但在思想与智识上，雪莱——就其短暂一生中发展的程度而言——与她最终所成就的相比，只是一个孩子。无论在思辨的最高领域，还是在日常生活的琐碎实际事务中，她的心智都是同一件完美的工具，直透问题的核心与精髓；总是抓住本质的观念或原则。这种精确与迅捷，既遍及其感受禀赋也遍及其心智禀赋，加上她的情感与想象天赋，本会使她成为一位登峰造极的艺术家；她那炽烈而温柔的灵魂与雄健的辩才，无疑会使她成为一位伟大的演说家；而她对人性的深刻认识与在实践生活中的洞察和睿智，在那样一个向女性开放这种*carrière*（职业/前程）的时代，本会令她卓然于人类的统治者之中。她的智识禀赋只是服务于一种我在一生中所遇见的最为高尚、最平衡的道德品格。她的无私不是一种被教导的义务体系的无私，而是一颗彻底认同他人情感的心之无私，并且往往因想象地以自身情感的强度投注于他人情感而走向过度的体贴。正义的激情本可被认为她最强烈的情感，若非她那无边的慷慨，以及那种随时准备倾注于任何或所有能以最小的情感回报她的人身上的仁爱。她其余的道德特质，正是这些心智与心灵品质天然相伴的那些：最真诚的谦逊与最高傲的自尊相结合；对一切配受者，一种绝对的质朴与真诚；对一切卑劣怯懦之事极度的鄙夷，以及对待一切残暴或专制、背信或不名誉的行为与品格燃烧般的义愤——同时对*mala in se*（自体恶）与纯然*mala prohibita*（禁止恶）作出最广泛的区分——即对显示情感与品格内在之恶的行为，与仅仅违反或善或恶之惯例的行为之间的区分，后者无论本身对错，都可能被在其他一切方面可爱或可敬的人所犯下。（J. S. 密尔, [ALE], 193–7）
