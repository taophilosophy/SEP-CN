      哈茨霍恩并不声称相信两位神，也不愿为宇宙论二元论辩护。事实上，当我们考虑到：除了称其有神论为 **双极的** 之外，他还把它称为一种 **万有在神论**——字面意思是万物都在独一上帝 **之中**——我们就能看到情况恰恰相反。世界在上帝之中的这种包含，是通过全知（如哈茨霍恩所界定的那样）和全善而实现的。一切被造物的感受，尤其是苦难的感受，都被包含在神圣生命中。哈茨霍恩把上帝视为整个自然世界之身体的心灵或灵魂（见上文关于柏拉图世界灵魂的论述），尽管他认为上帝与被造物可区分。对哈茨霍恩有神论的另一种归类方式，是把它视为 **新古典的**，因为他依赖古典或传统有神论关于上帝存在的论证，并依赖古典有神论的存在形而上学，作为恰当地彻底思考完善性逻辑的 **第一步**。然而他认为，这些努力需要被那些视生成比存在更具包容性的人的努力所补充。在哈茨霍恩看来，上帝不在时间之外——如波爱修斯式的观点（在传统哲学有神论者中很有影响）所认为的那样——而是贯穿全部时间存在。在新古典观点中，上帝恒久的“存在”在于通过永续生成而展示的坚定仁慈（见 Findlay 1964）。
