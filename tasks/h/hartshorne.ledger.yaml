      He argues that Hume’s and Kant’s criticisms of the ontological argument of St. Anselm are not directed at the strongest version of his argument found in *Proslogion*, chapter 3. Here, he thinks, there is a modal distinction implied between existing necessarily and existing contingently. Hartshorne’s view is that existence alone might not be a real predicate, but existing necessarily certainly is. To say that something exists without the possibility of not existing is to say something significant about the being in question. That is, contra Kant and others, Hartshorne believes that there are necessary truths concerning existence. To say that absolute nonexistence in some fashion exists is to contradict oneself; hence he thinks that absolute nonexistence is unintelligible. It is necessarily the case that *something* exists, he thinks, and, relying on the ontological argument, he also thinks it true that God necessarily exists (see Gamwell 2020; also see Reese 1964; and R. M. Martin 1964)[^gamwell-2020][^martin-1964][^reese-1964][^reese-1964-2].
    step1: |-
      他认为，休谟和康德对圣安塞姆本体论论证的批评，并非针对《宣讲》（*Proslogion*）第 3 章中这一论证的最强版本。他在这里认为，在必然存在与偶然存在之间暗含一种模态区分。哈茨霍恩的观点是：单纯的存在本身可能不是真正的谓词，但必然存在肯定是。说某物存在而没有不存在的可能，就是对该存在者说出某种有意义的东西。也就是说，与康德等人相反，哈茨霍恩相信关于存在存在必然真理。以某种方式说绝对不存在存在，就是自我矛盾；因此他认为绝对不存在是不可理解的。他认为，**某物** 存在是必然的；并且，依靠本体论论证，他也认为上帝必然存在为真（见 Gamwell 2020；亦见 Reese 1964；以及 R. M. Martin 1964）[^gamwell-2020][^martin-1964][^reese-1964][^reese-1964-2]。
