      Reality is composed of pulses of experience, on Hartshorne’s psychicalist view. The data of human experience, for example, are themselves experiences, the clearest cases of which are memories and perceptions, most especially experiences of pleasure and pain. Our experiences exhibit both independence and dependence on the experiences of cells in our own bodies. This dependence is called “prehension” by Hartshorne, who relies here on Whitehead (see Ford 1991)[^ford-1991]. Contra Hume, what we experience are previous instances of experience that have a causal influence on us. To doubt that we experience the past is to doubt everything, on Hartshorne view, in that experience itself is internally related to the past, but is externally related to the future, on the asymmetrical view of time prevalent in process philosophy.
