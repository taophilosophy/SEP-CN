      Second, Hartshorne frequently uses the history of philosophy to see which of the logically possible options made available by position matrices have been defended before so as to avail ourselves of the insights of others in the effort to examine in detail the consistency of these positions and to assess their consequences (see J. Smith 1991; and Lucas 1991)[^lucas-1991][^smith-1991]. Nonetheless, those logically possible options that have not historically found support should be analyzed both in terms of internal consistency and practical ramifications. It should be noted that Hartshorne’s use of the history of philosophy often involves lesser known views of famous thinkers (like Plato’s belief in God as the soul for the body of the whole natural world, or Leibniz’s defense of panpsychism) as well as the thought of lesser known thinkers (such as Faustus Socinus, Nicholas Berdyaev, Mohammed Iqbal, or Jules Lecquier).
    step1: |-
      第二，哈茨霍恩经常利用哲学史来看立场矩阵所提供的那些逻辑上可能的选项中，哪些在以前被辩护过，以便利用他人的洞见，来详细考察这些立场的一致性并评估其后果（见 J. Smith 1991；以及 Lucas 1991）[^lucas-1991][^smith-1991]。尽管如此，那些在历史上没有得到支持的逻辑上可能的选项，既应从内部一致性分析，也应从实际后果分析。应当指出，哈茨霍恩对哲学史的运用往往涉及著名思想家的较不为人知的观点（如柏拉图相信上帝是整个世界自然之身体的心灵或灵魂，或莱布尼茨对泛心论的辩护），以及较不为人知的思想家的思想（如福斯图斯·索齐尼、尼古拉·别尔嘉耶夫、穆罕默德·伊克巴尔，或儒勒·勒基耶）。
    step2: |-
      第二，哈茨霍恩经常借助哲学史，来看立场矩阵所提供的那些逻辑上可能的选项中，哪些在过去已被辩护，以便借重他人的洞见，详细考察这些立场的一致性并评估其后果（见 J. Smith 1991；以及 Lucas 1991）[^lucas-1991][^smith-1991]。尽管如此，那些在历史上未获支持的逻辑上可能的选项，既应就内部一致性来分析，也应就其实际后果来分析。应当指出，哈茨霍恩对哲学史的运用常涉及著名思想家的较不为人知的观点（如柏拉图相信上帝是整个世界自然之身体的心灵或灵魂，或莱布尼茨对泛心论的辩护），也涉及较不为人知的思想家的思想（如福斯图斯·索齐尼、尼古拉·别尔嘉耶夫、穆罕默德·伊克巴尔，或儒勒·勒基耶）。
