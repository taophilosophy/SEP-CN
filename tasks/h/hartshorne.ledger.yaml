      If metaphysics is seen, as it is by Hartshorne, as the study of nonrestrictive existential statements, then “something exists” and “experience exists” are metaphysical statements because of their extreme range. They are statements that cannot be denied without contradiction. That is, psychicalism is metaphysically true rather than contingently true or false (see H. Smith 1964)[^smith-1964][^smith-1964-2]. But this does not mean that there is an incompatibility between psychicalism and the contingently true or false deliverances in science. It is understandable why scientists restrict their investigations to what can be quantified and hence be capable of precise measurement. But such restriction is nonetheless compatible with psychicalism as a sort of comparative psychology of the widest sort, with physics dealing with the simplest instances of psyche or with the behavioristic aspect of the lowest instances of psyche. Whereas science is concerned with the control of nature, philosophy, according to Hartshorne, should be concerned with the most general sort of *understanding* of nature.
    step1: |-
      如果形而上学如哈茨霍恩所认为的那样，被视为对非限制性存在陈述的研究，那么“某物存在”和“经验存在”由于其极端范围而是形而上学陈述。它们是不能无矛盾地被否认的陈述。也就是说，心理主义是形而上学地为真的，而非偶然地为真或为假（见 H. Smith 1964）[^smith-1964][^smith-1964-2]。但这并不意味着心理主义与科学中偶然地为真或为假的陈述之间不相容。科学家把他们的研究限制在可量化的、因而能够被精确测量的东西上，这是可以理解的。但这种限制与心理主义仍然相容，心理主义是一种最广泛意义上的比较心理学，其中物理学处理心灵的最简单实例，或处理心灵最低实例的行为主义方面。科学关注自然的控制，而根据哈茨霍恩，哲学应关注对自然的最一般意义上的 **理解**。
