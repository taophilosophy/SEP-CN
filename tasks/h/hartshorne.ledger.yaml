      Hartshorne’s dispute with traditional or classical philosophical theism concerns not so much the *existence* of God, but rather its assumption that the *actuality* of God (i.e., *how* God exists) could be described in the same terms as the existence of God. A God who exists necessarily is not necessary or unchanging in every other respect (e.g., in terms of divine responsiveness to creaturely changes), he thinks. Although Hartshorne believes that the medieval thinkers were correct in trying to think through the logic of perfection, he also thinks that this logic has traditionally been misapplied in the effort to articulate the attributes of a being called “God,” roughly defined as the greatest conceivable being. The traditional or classical theistic logic of perfection sees God as monopolar in that regarding various contrasts (permanence-change, one-many, activity-passivity, etc.) the traditional or classical philosophical theist has chosen one element in each pair as a divine attribute (the former element of each pair) and denigrated the other (see Fitch 1964)[^fitch-1964].
    step1: |-
      哈茨霍恩与传统或古典哲学有神论的争议，与其说关乎上帝的 **存在**，不如说关乎它的这一假设：上帝的 **现实性**（即上帝 **如何** 存在）可以用与上帝存在相同的术语来描述。他认为，一个必然存在的上帝，在其它每一个方面并非必然或不变（例如，在对被造物变化的神圣回应方面）。尽管哈茨霍恩相信中世纪思想家试图彻底思考完善性的逻辑是正确的，他也认为这一逻辑传统上被误用，用以表述被称为“上帝”的存在者的属性——粗略定义为可设想的至大者。传统或古典有神论的完善性逻辑把上帝视为单极的，因为关于各种对照（恒常—变化、一—多、主动—被动，等等），传统或古典哲学有神论者在每一对中选择了其中一个要素作为神圣属性（每一对的第一个要素），而贬低了另一个（见 Fitch 1964）[^fitch-1964]。
