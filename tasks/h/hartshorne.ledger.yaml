      God is omniscient, on Hartshorne’s view, but “omniscience” here refers to the divine ability to know everything that is knowable: past actualities as already actualized; present realities to the extent that they are knowable according to the laws of physics (e.g., what is present epistemically may very well be the most recent past, given the speed of light); and future possibilities or probabilities *as possibilities or probabilities*. On the traditional or classical conception of omniscience, however, God has knowledge of future possibilities or probabilities as already actualized. According to Hartshorne, this is not an example of supreme knowledge, but is rather an example of ignorance of the (at least partially) indeterminate character of the future (see the excellent article Shields and Viney 2003)[^shields-2003][^shields-2003-2].
    step1: |-
      在哈茨霍恩看来，上帝是全知的，但这里的“全知”指的是神圣的能力，即知道一切可知之物：已经现实化的过去现实；就物理定律而言可知的现在实在（例如，认识论上现在的东西很可能就是最近的过去，考虑到光速）；以及 **作为可能性或概率** 的未来可能性或概率。然而，在传统或古典的全知概念中，上帝把未来的可能性或概率当作已经现实化的来知道。根据哈茨霍恩，这不是最高知识的例证，而是对未来的（至少部分）不确定特征的忽视的例证（见希尔兹和瓦伊尼 2003 那篇出色的文章）[^shields-2003][^shields-2003-2]。
