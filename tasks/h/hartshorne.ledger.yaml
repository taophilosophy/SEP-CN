      Hartshorne is well-known for his lifelong defense from the 1920s on of panpsychism, even when it was not fashionable to do so. His preferred designation is “psychicalism,” and this for two reasons. First, this label provides a clearer contrast to “materialism,” which is the main competitor to this position. And second, the “pan” component of panpsychism gives the mistaken impression that mind or psyche can be attributed to *everything* that exists, in contrast to Hartshorne’s more modest view that all concrete singulars feel (see Wiehl 1991)[^wiehl-1991]. Hartshorne’s psychicalism is very close to Whitehead’s reformed subjectivism, views that can be based on metaphysical considerations, psychological reflection, and scientific support.
