      Hartshorne agrees with materialists that we should deny that “mind” and “physical” are incompatible predicates. But psychicalism is not only a more coherent alternative to dualism, it is also superior to materialism because the latter adds nothing to the description of reality in itself. In fact, it can achieve coherence only by subtracting much of what we experience as real. Like materialism, psychicalism is a type of monism when these two positions are contrasted with dualism. But psychicalism is the better alternative to dualism, he thinks, in its defense of the graduated character of mentality, which includes, but is not terminated at, the level of cells. The superiority of psychicalism to materialism is largely due to the coherent system of concepts it offers that includes metaphysics, theology, biology, psychology, and physics. Some of these fields are in effect omitted or rejected altogether in materialism and are included in a dualist account in an incoherent manner. In both materialism and dualism there is a lack of integration; only in psychicalism is there the possibility of integration or coherence (see N. Martin 1991)[^martin-1991].
    step1: |-
      哈茨霍恩同意唯物主义者的看法：我们应否认“心灵”和“物理的”是不相容的谓词。但心理主义不仅是比二元论更连贯的替代方案，它也优于唯物主义，因为后者没有给实在本身的描述增添任何东西。事实上，它只能通过减去我们所经验为真实的大量东西来获得连贯性。当这两个立场与二元论相对照时，像唯物主义一样，心理主义是一种一元论。但他认为，心理主义是比二元论更好的替代方案，因为它辩护了心灵性的渐进性质，这种性质包括细胞层面但并不终止于细胞层面。心理主义优于唯物主义，主要归功于它提供的概念上的连贯体系，这个体系包括形而上学、神学、生物学、心理学和物理学。其中一些领域在唯物主义中被实际省略或完全拒绝，而在二元论的说明中则以不连贯的方式被包括。在唯物主义和二元论中都缺乏整合；只有在心理主义中才有整合或连贯的可能（见 N. Martin 1991）[^martin-1991]。
