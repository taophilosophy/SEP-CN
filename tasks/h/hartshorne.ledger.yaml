      Alston knows that the notion of a nontemporal God who is nonetheless qualified by relation to temporal beings will strike Hartshorne as unintelligible. Alston’s attempt to make his position intelligible rests on his own Thomistic-Whiteheadian stance, or better, on his Thomistic or Boethian interpretation of Whitehead (strange as this seems); Alston is also influenced here by Eleanore Stump and Norman Kretzmann. We should not think of God as involved in process or becoming of any sort. The best temporal analogy, he thinks, for this conception is an unextended instant or an “eternal now.” For Alston this does not commit one, however, as Hartshorne would allege, to a static deity frozen in immobility. On the contrary, according to Alston, God is eternally active in ways that do not require temporal succession. God’s acts can be complete in an instant. Alston includes God’s acts of knowledge, a stance that at least seems to conflict with one of the concessions he made to Hartshorne regarding the first group of attributes (see Neville 1991)[^neville-1991].
    step1: |-
      阿尔斯顿知道，一个非时间性的、却被与时间性存在者的关系所限定的上帝的观念，会被哈茨霍恩视为不可理解。阿尔斯顿使其立场可理解的尝试，依赖于他自己的托马斯—怀特海式的立场，或者更恰当地说，依赖于他对怀特海的托马斯式或波爱修斯式的解释（尽管这看起来很奇怪）；阿尔斯顿在这里也受埃莉奥诺尔·斯顿普和诺曼·克雷茨曼影响。我们不应把上帝视为参与任何种类的过程或生成。他认为，对这种概念而言，最好的时间类比是未延展的瞬间或“永恒的现在”。然而，对阿尔斯顿来说，这并不使一个人——如哈茨霍恩会指控的那样——承诺一个冻结在不动中的静态神祇。相反，根据阿尔斯顿，上帝在不需要时间承续的方式中永恒地活动。上帝的行为可以在一个瞬间完成。阿尔斯顿把上帝的知识行为也包括在内，这一立场至少似乎与他关于第一组属性向哈茨霍恩所作的让步之一相冲突（见 Neville 1991）[^neville-1991]。
