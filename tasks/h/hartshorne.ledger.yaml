      Further, Hartshorne sees trees as collectives or aggregates without the unity found in either an individual cell or an individual animal with a central nervous system. That is, “sentient individual” does not lose its distinctive meaning in psychicalism in that many things viewed as individuals in everyday life are really pseudo-individuals. Stones and crowds of people cannot feel even if their members can. Apparent singulars are composites, in contrast to true singulars, which can themselves feel as compound individuals. If something acts as an individual it also feels as an individual, on Hartshorne’s view, in contrast to the pseudo-individuals who neither act nor feel *as individuals* (see Weiss 1984)[^weiss-1984].
    step1: |-
      此外，哈茨霍恩把树视为集体或集合，而不具有个别细胞或具有中枢神经系统的个别动物所具有的统一性。也就是说，“有感受的个体”在心理主义中并未失去其独特意义，因为日常生活中被视为个体的许多东西其实是伪个体。石头和人群即使其成员能感受，本身也不能感受。表面上的个别物是复合物，与真正的个别物相对照——后者自身能作为复合个体而感受。在哈茨霍恩看来，如果某物作为个体而行动，它也就作为个体而感受，这与伪个体相对照——伪个体既不行动也不 **作为个体** 而感受（见 Weiss 1984）[^weiss-1984]。
