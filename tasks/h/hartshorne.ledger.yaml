      Hartshorne’s generalized concept of sentience is integrally connected to his commitment to process philosophy, to the primacy of becoming over being. Without memory and anticipation, “past” and “future” would be meaningless words. In fact, if time is a universal feature of the real, then psychicalism is required, otherwise time could easily be reduced to (static) space. If an electron, say, does not have memory per se it nonetheless exhibits present behavior in some sort of prehensive relationship with the past that influences it (see Sprigge 1991)[^sprigge-1991]. A reductionistic view of nature purely in spatial terms plays into the hands of the dualist or the materialist. No positive conception of time can be derived from dead matter or matter that can neither remember nor anticipate. If all dynamic singulars are some type of experience, each of these unities has *some* type of memory (prehension) and anticipation, otherwise an objective temporal order is inexplicable (see Levi 1964)[^levi-1964].
    step1: |-
      哈茨霍恩的普遍化感受性概念与他对过程哲学、对生成优于存在的承诺有着内在的联系。没有记忆和预期，“过去”和“未来”将是无意义的词。事实上，如果时间是实在的普遍特征，那么心理主义就是必需的，否则时间很容易被还原为（静态的）空间。例如，如果一个电子没有记忆本身，它仍然在与影响它的过去的某种摄受关系中展现出当下的行为（见 Sprigge 1991）[^sprigge-1991]。纯粹在空间术语上对自然的还原论观点正中二元论者或唯物主义者的下怀。从死物质或既不能记忆也不能预期的物质中，无法推导出任何积极的时间概念。如果所有动力个别物都是某种类型的经验，那么这些统一体中的每一个都有 **某种** 类型的记忆（摄受）和预期，否则客观的时间秩序就无法解释（见 Levi 1964）[^levi-1964]。
