      Hartshorne views the cosmos as a “metaphysical monarchy,” with God as the presiding, but not omnipotent, head, and he sees human society as a “metaphysical democracy,” with each member as an equal. This makes him a liberal in politics if “liberalism” refers to the egalitarian belief that none of us is God. That is, due to the fact of pervasive pluralism of comprehensive doctrines that citizens affirm, none of us should presume to act like the classical theistic God by unreasonably imposing our view of the world on others (see Wild 1964)[^wild-1964]. Although Hartshorne and Whitehead are both political liberals, Hartshorne is, despite his view of panpsychist reality as thoroughly social (see Kegley 1991)[^kegley-1991], more of a libertarian liberal and Whitehead more of a redistributive liberal (see Morris 1991)[^morris-1991]. In axiology as well as in metaphysics/theodicy, freedom is crucial, on Hartshorne’s view (see Kane 1991)[^kane-1991]. Further, Hartshorne’s process view has implications for fetal development that informs his liberal view regarding the permissibility of abortion (see Engelhardt 1991)[^engelhardt-1991].
    step1: |-
      哈茨霍恩把宇宙视为一个“形而上学的君主国”，以上帝为主持但非全能的元首，他又把人类社会视为一个“形而上学的民主国”，每个成员都是平等的。如果“自由主义”指的是平等的信念——我们中没有人是上帝——那么这使他在政治上成为自由主义者。也就是说，由于公民所信奉的整全性学说普遍多元这一事实，我们中没有人应妄图像古典有神论的上帝那样，不合理地把我们对世界的看法强加于他人（见 Wild 1964）[^wild-1964]。尽管哈茨霍恩和怀特海都是政治自由主义者，但哈茨霍恩——尽管他把泛心论的实在视为彻底社会性的（见 Kegley 1991）[^kegley-1991]——更是一位自由意志论的自由主义者，而怀特海更是一位再分配的自由主义者（见 Morris 1991）[^morris-1991]。在价值论以及形而上学/神正论中，自由都是关键的，按哈茨霍恩的观点（见 Kane 1991）[^kane-1991]。此外，哈茨霍恩的过程观对胎儿发育有影响，这影响了他关于堕胎可允许性的自由主义观点（见 Engelhardt 1991）[^engelhardt-1991]。
