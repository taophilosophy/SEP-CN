      A common misconception is that, because the psychicalist is committed to the claim that a minimal form of experiencing is ubiquitous, *everything* experiences or feels. There are at least two significant qualifications that are needed. First, *abstractions from* dynamic singulars that feel do not themselves feel, as in “blueness” or “triangularity” or even the abstraction “feeling.” Second, *groups or aggregates* of dynamic singulars that feel do not themselves feel because these are collections rather than true dynamic singulars, as in tables or crystals or a flock of birds. Nonetheless there can be activity *in* tables or crystals or a flock of birds, even if these aggregates are themselves inert wholes with active parts. In this regard, Hartshorne has us notice the abstractness of many of our pragmatic concepts that are assumed to deal with the most concrete reality (see J. Smith 1964)[^smith-1964][^smith-1964-2].
    step1: |-
      一个常见的误解是：由于心理主义者承诺了最小形式的经验无处不在这一主张，**一切** 事物都在经验或感受。至少需要两个重要的限定。第一，感受着的动力个别物的 **抽象** 本身并不感受，如“蓝性”或“三角形性”，甚至“感受”这一抽象本身。第二，感受着的动力个别物的 **群体或集合** 本身并不感受，因为这些是集合而非真正的动力个别物，如桌子或水晶或一群鸟。尽管如此，桌子或水晶或一群鸟 **之中** 仍可有活动，即使这些集合本身是有着能动部分的情性整体。在这方面，哈茨霍恩让我们注意到我们许多实用概念的抽象性，这些概念被假定处理最具体的实在（见 J. Smith 1964）[^smith-1964][^smith-1964-2]。
