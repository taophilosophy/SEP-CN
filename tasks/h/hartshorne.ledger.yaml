      在哈茨霍恩的心理主义观点中，实在由经验的脉冲组成。例如，人类经验的数据本身是经验，其中最清楚的例子是记忆和知觉，尤其是快乐和痛苦的经验。我们的经验既表现出独立性，也表现出对我们自己身体内细胞经验的依赖性。这种依赖性被哈茨霍恩称为“摄受”，他在这里依靠怀特海（见 Ford 1991）[^ford-1991]。与休谟相反，我们所经验的是对我们有因果影响的先前经验实例。在哈茨霍恩看来，怀疑我们经验过去就是怀疑一切，因为经验本身与过去内在相关，但与未来外在相关，这在过程哲学流行的非对称时间观中是如此。
