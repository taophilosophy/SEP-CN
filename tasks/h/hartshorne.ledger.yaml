      It might be objected that Hartshorne’s psychicalism is an overuse of an argument from analogy. It might be claimed that “feeling” or “sentiency” apply only to human beings or other animals with central nervous systems. On the basis of this criticism, there is merely a verbal connection when feeling is attributed “all the way down” in nature. Hartshorne’s response is to suggest that terms that are used universally are of necessity very abstract, including psychical terms associated with feeling or sentiency. It is such abstractness that enables him to deal with this criticism. All dynamic singulars have *some* sense of the past (in terms of physical feeling or prehension) and *some* sense of the future (in terms of primitive mentality or possibility). There are two extremes to be avoided: that we could completely capture others’ feelings, on the one hand, and that we are completely in the dark regarding others’ feelings, on the other. However remote the analogy may be, it never completely lapses (see Ogden 1984)[^ogden-1984].
    step1: |-
      有人可能反对：哈茨霍恩的心理主义过度使用了类比论证。有人可能声称，“感受”或“感受性”只适用于人类或其它具有中枢神经系统的动物。基于这一批评，当感受被归属“一直向下”到自然之中时，只存在一种语词上的联系。哈茨霍恩的回应是提出：普遍使用的术语必然非常抽象，包括与感受或感受性相关的心理术语。正是这种抽象性使他能够处理这一批评。所有动力个别物对过去都有 **某种** 感觉（就物理感受或摄受而言），对未来也有 **某种** 感觉（就原始心灵性或可能性而言）。有两个极端要避免：一方面，我们可能完全捕捉到他人的感受；另一方面，我们对他人的感受完全一无所知。无论类比多么遥远，它从不完全消失（见 Ogden 1984）[^ogden-1984]。
