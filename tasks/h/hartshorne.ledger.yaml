      Charles Hartshorne was born in the nineteenth century and lived to philosophize in the twenty-first. He was born in Kittanning, Pennsylvania (U.S.A.) on June 5, 1897. He was, like Alfred North Whitehead, the son of an Anglican minister, although many of his ancestors were Quakers. After attending Haverford College he served in World War One in France as a medic, taking a box of philosophy books with him to the front. After the war Hartshorne received his bachelor’s degree and doctorate in philosophy at Harvard, and there he met Whitehead. Most of the major elements of Hartshorne’s philosophy were already apparent by the time he became familiar with Whitehead’s thought, contrary to a popular misconception. That is, Hartshorne came to many of the same conclusions as Whitehead independently of Whitehead’s influence. (One exception is Whitehead’s defense of eternal objects, in partial contrast to Hartshorne’s theory of emergent universals, the latter of which are arguably more consistent with a process worldview.) From 1923–1925 a postdoctoral fellowship took him to Germany, where he had classes with both Husserl and Heidegger. But neither of these thinkers influenced his philosophy as much as C.S. Peirce, whose collected papers he edited with Paul Weiss (see Thompson 1984)[^thompson-1984]. In addition to many visiting appointments, Hartshorne spent his teaching career at three institutions. From 1928–1955 he taught at the University of Chicago, where he was a dominant intellectual force in the School of Divinity, despite the fact that he was housed in the Philosophy Department, where he was not nearly as influential. He was at Emory University from 1955 until 1962, when he moved to the University of Texas at Austin. Hartshorne eventually became a long-term emeritus professor at Austin and lived there until his death on October 9, 2000. His wife, Dorothy, was as colorful as her husband and was mentioned often in his writings. Hartshorne never owned an automobile, nor did he smoke or drink alcohol or caffeine; he had a passion for birdsong and became an internationally known expert in the field.
