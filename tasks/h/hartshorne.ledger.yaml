      Hartshorne’s psychicalism is also connected to his theism, although some scholars like Wright adopt his psychicalism without agreeing to his theism. Hartshorne holds that psychicalism is implicit in theism, at least if God is seen as psyche that animates not this or that particular body but that animates omnipresently the body of the universe (see Viney and Dombrowski forthcoming). God is the supreme experience in relation to particular experiences on the model of soul-body cosmic hylomorphism. Mere matter or a zero of feeling is a complete negation that can be approached only asymptotically. Thus, psychicalism is, as Hartshorne sees things, a scientific sort of spiritualism. Dead matter, if such existed, would be at odds with an ubiquitous, living God. Hartshorne goes so far as to claim that without psychicalism theism is incoherent and vice versa (see Van der Veken 1991)[^van-1991].
    step1: |-
      哈茨霍恩的心理主义也与他的有神论相关，尽管像赖特这样的一些学者接受他的心理主义却不同意他的有神论。哈茨霍恩主张，心理主义在有神论中是隐含的，至少如果上帝被视为一种心灵，它赋予的不是这个或那个特定的身体以生命，而是无所不在地赋予宇宙的身体以生命（见 Viney and Dombrowski forthcoming）。上帝是相对于特定经验而言的最高经验，其模式是灵魂—身体的宇宙形质论。纯粹物质或感受的零是完全的否定，只能渐近地接近。因此，在哈茨霍恩看来，心理主义是一种科学意义上的唯心论。死物质，如果存在的话，会与无处不在的、活的上帝相悖。哈茨霍恩甚至主张，没有心理主义，有神论就是无连贯的，反之亦然（见 Van der Veken 1991）[^van-1991]。
