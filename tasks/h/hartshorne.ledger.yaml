      As a published expert on bird song, Hartshorne is the first philosopher since Aristotle to be an expert in both metaphysics and ornithology. He writes specifically of the aesthetic categories required to explain why birds sing outside of mating season and when territory is not threatened—two occasions for bird song that are crucial to the behaviorists’ account. Birds *like* to sing, he concludes (see Skutch 1991)[^skutch-1991]. His discovery of the “monotony threshold” regarding bird song is still cited by ornithologists. Hartshorne’s ornithology thus serves to highlight the crucial role that aesthetic categories play in Hartshorne’s philosophy (from the ancient Greek word for feeling: *aesthesis*), from the minuscule feelings of microscopic reality to divine feelings (see Chiaraviglio 1991; Hospers 1991; and Dombrowski 2004)[^chiaraviglio-1991][^dombrowski-2004][^hospers-1991].
    step1: |-
      作为一位发表过著作的鸟鸣专家，哈茨霍恩是自亚里士多德以来第一位同时精通形而上学和鸟类学的哲学家。他特别写到解释为什么鸟在交配季节之外、以及当领地未受威胁时仍会鸣叫所需的审美范畴——这两种鸟鸣场合对行为主义者的说明至关重要。他得出结论：鸟 **喜欢** 鸣叫（见 Skutch 1991）[^skutch-1991]。他关于鸟鸣的“单调阈值”的发现至今仍被鸟类学家引用。因此，哈茨霍恩的鸟类学有助于凸显审美范畴在哈茨霍恩哲学中扮演的关键角色（源于古希腊语表示感受的词：*aesthesis*），从微观实在的微小感受到神圣感受（见 Chiaraviglio 1991；Hospers 1991；以及 Dombrowski 2004）[^chiaraviglio-1991][^dombrowski-2004][^hospers-1991]。
