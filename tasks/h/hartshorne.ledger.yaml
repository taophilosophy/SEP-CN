      Hartshorne’s psychicalism is based not only on metaphysical considerations or on an argument from analogy, but also on personal experience, which takes one to sentiency at the microscopic level. This means that the human body is not entirely disanalogous to the rest of nature. Granted, many characteristics of psyche cannot be generalized, such as consciousness or thinking (see W. Viney 1991)[^viney-1991]. Hence, another label for Hartshorne’s view (derived from David Ray Griffin) is panexperientialism, *not* panconsciousness. Hartshorne thinks it crucial to point out that psychicalism is not so much an (illegitimate) extension of human traits like feeling as a movement *away from* human traits like consciousness and advanced thinking. He has us notice that pleasure and pain are *localized*, as in good food on the tongue or sexual excitement, on the one hand, or a toothache or a stubbed toe, on the other. We literally sympathize or feel with the enjoyments or negative experiences of cells in our bodies. In effect, one feels previous suffering at the cellular level. These cells have rapport with each other, otherwise psychosomatic illness might be very difficult to explain. All pain involves damage to cells. Pain is an instance of the psychical that is just as revelatory of the real as experiences we have via sight, although cells in the eye also have feelings of a primitive sort.
    step1: |-
      哈茨霍恩的心理主义不仅建立在形而上学考量或类比论证之上，也建立在个人经验之上，这种经验把人带到微观层面的感受性。这意味着人体并非与自然的其余部分完全不相类似。诚然，心灵的许多特征不能被普遍化，例如意识或思维（见 W. Viney 1991）[^viney-1991]。因此，哈茨霍恩观点的另一个标签（源自戴维·雷·格里芬）是泛经验主义，**而非** 泛意识论。哈茨霍恩认为，指出这一点至关重要：心理主义与其说是对人类特征（如感受）的（不正当）扩展，不如说是一种 **远离** 人类特征（如意识和高级思维）的运动。他让我们注意到，快乐和痛苦是 **局部化的**，一方面是舌上美味或性兴奋，另一方面是牙痛或踢伤的脚趾。我们确实与身体内细胞的可喜或消极经验共鸣或同感。实际上，人们是在细胞层面感受先前的痛苦。这些细胞彼此相通，否则心身疾病可能很难解释。所有疼痛都涉及细胞的损伤。疼痛是心理的一个实例，它正如我们通过视觉所经验的经验一样，都能揭示实在，尽管眼睛中的细胞也有一种原始的感受。
