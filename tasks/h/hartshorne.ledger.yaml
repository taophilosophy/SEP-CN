      The Boethian-Thomistic notion of the specious present for God, on the analogue of a human being’s perceiving some temporally extended stretch of a process in one temporally indivisible act, is also defended by Alston. For example, one can perceive the flight of a bee “all at once” without first perceiving the first half of the stretch of flight and then perceiving the second. One’s perception can be without temporal succession even if the object of one’s perception is, in fact, temporally successive (see Gale 2003)[^gale-2003]. All we have to do, on Alston’s view, is expand our specious present to cover all of time and we have a model for God’s awareness of the world. This is a much more difficult project for Hartshorne to imagine than it is for Alston. Apparently Alston thinks that it is easy to conceptualize God “seeing” Neanderthal man (or Adam), Moses, Jesus, and Dorothy Day all at once in their immediacy. Here Alston has a view similar to that of William Mann.
    step1: |-
      阿尔斯顿也辩护了波爱修斯—托马斯式的、关于上帝之可感当下的观念，其类比是：一个人在时间上不可分割的一次行动中知觉某个时间上延展的过程片段。例如，一个人可以“一下子”知觉到一只蜜蜂的飞行，而不必先知觉飞行片段的前半、再知觉后半。一个人的知觉可以没有时间承续，即使知觉的对象事实上是时间上承续的（见 Gale 2003）[^gale-2003]。在阿尔斯顿看来，我们所要做的只是把我们可感的当下扩展以覆盖全部时间，这样我们就有了上帝对世界之觉知的模型。这对哈茨霍恩来说，是比阿尔斯顿更难设想的计划。显然，阿尔斯顿认为，概念化上帝“看到”尼安德特人（或亚当）、摩西、耶稣和多萝西·戴都在其直接性中同时呈现，是容易的。在这里，阿尔斯顿有与威廉·曼恩相似的观点。
