      哈茨霍恩对人类中心主义的批评，不仅出于他对上帝的关切，也出于他对那些以不如人类复杂的方式经验的生成中存在者的关切。说一切能动的个别物都有感受——把像“二性”这样的抽象，或本身不作为整体感受的能动个别物的无情复合体排除在画面之外——并不是说它们有自我意识或它们能思维。然而，和以前一样，哈茨霍恩的价值论最终在性格上是以神为中心的。然而应当指出，哈茨霍恩对若干亚洲哲学学者产生了相当大的影响，其中一些不是有神论者（见 King 1991；Arapura 1991；以及 Matsunobu 1991）[^arapura-1991][^king-1991][^matsunobu-1991]。
