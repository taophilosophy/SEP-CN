      Divine inclusiveness, for Hartshorne, is sometimes like the inclusion of thoughts in a mind, but usually it is described as like the inclusion of cells within a living body. It is never like the inclusion of marbles in a box. The inorganic and insentient character of a box is inadequate as a model for divinity, he thinks, and divine inclusiveness is never like the inclusion of theorems in a set of axioms, as it might be for certain idealists. Divine inclusiveness in Hartshorne is *organic* inclusiveness (see Reese 1991)[^reese-1991].
