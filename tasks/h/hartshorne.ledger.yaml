      A further connection between psychicalism and science can be seen in terms of Kant’s rejection of psychicalism as being due in part to the materialistic and mechanistic physics of his day. In principle, scientists today could be psychicalists and some of them were in fact psychicalists, as in Hartshorne’s friend at University of Chicago, the geneticist Sewall Wright (see Wright 1964)[^wright-1964]. Science deals with structure, not quality, yet without qualitative feeling, structures are empty. Only psychicalism generalizes both structure as well as feeling. The physical *is* the psychical when considered only in its causal relations and structures, abstracting away from qualitative aspects.
