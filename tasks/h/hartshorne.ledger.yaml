      Hartshorne is well aware of the fact that, once the bifurcation of nature or dualism has been refuted, there is also the dominant view to contend with: materialism. But there is no way that materialism can adequately explain the qualitative experiences that we have as a matter of course. Indeed, materialism leaves experience *un*explained. Further, as Hartshorne sees things, materialism is actually an emergent type of dualism or a type of dualism in disguise wherein wholly unfeeling stuff eventually and miraculously becomes stuff with feeling. That is, materialism is in reality a sort of bifurcation in time in that there is no way to consistently deny *qualitative experience* (which is something of a redundancy). The denial itself is a qualitative experience. In this regard, there is something half-hearted about materialism (see Wolf 1991).
    step1: |-
      哈茨霍恩深知这样一个事实：一旦自然的分裂或二元论被驳斥，还有一个主导的观点需要对付：唯物主义。但唯物主义无法充分解释我们理所当然所具有的质性经验。事实上，唯物主义使经验 **未** 被解释。此外，在哈茨霍恩看来，唯物主义实际上是一种突现类型的二元论，或一种伪装的二元论，其中完全无感受的物质最终奇迹般地变成有感受的物质。也就是说，唯物主义实际上是时间中的一种分裂，因为没有办法一致地否认 **质性经验**（这多少是一种赘余）。否认本身是一种质性经验。在这方面，唯物主义有某种半心半意之处（见 Wolf 1991）。
