      心理主义与科学之间的进一步联系可以从康德对心理主义的拒绝看出，这种拒绝部分是由于他那个时代的唯物主义和机械论物理学。原则上，今天的科学家可以是心理主义者，其中一些事实上就是心理主义者，如哈茨霍恩在芝加哥大学的朋友、遗传学家休厄尔·赖特（见 Wright 1964）[^wright-1964]。科学处理结构而非性质，然而没有质性感受，结构是空洞的。只有心理主义把结构以及感受都加以普遍化。当仅就其因果关系和结构来考虑、抽象掉质性方面时，物理的 **就是** 心理的。
