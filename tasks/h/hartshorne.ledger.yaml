      It seems fair to say that analytic philosophers, in general, even analytic philosophers who are theists, have largely ignored Hartshorne’s philosophy. (The point is debateable. There has been a move among many analytic philosophers who are theists, as in Richard Swinburne, away from the eternal, Boethian God who is outside of time altogether. Might it be that Hartshorne’s influence is greater than initially appears to be the case when the temporality, or the sempiternity, of the God of many analytic philosophers is concerned?) This is in contrast to his wide influence among theologians, which is odd when it is considered that he is not a theologian and does not rely on sacred scripture or religious authority for his insights. Another oddity is the fact that Hartshorne’s influence among theologians is due to the defense he offers of the *rationality* of belief in a neoclassical God (see R. M. Martin 1984; and Shields 2003a)[^martin-1984][^shields-2003a].
