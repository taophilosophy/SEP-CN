      Alston’s stance here is problematic for two reasons, from Hartshorne’s point of view. First, although belief in *some* sort of divine creativity has deep roots in the history of religious experience, it is not clear that these roots have to tap into creation *ex nihilo*. For example, it is not clear that creation *ex nihilo* is the sort of creation described in Genesis, in that when the Bible starts with the statement that the spirit of God hovered above the waters, one gets the impression that both God and the aqueous muck had been around forever. If one believes in creation *ex nihilo*, however, as Alston does, one might nonetheless claim that creation *ex nihilo* does not necessarily mean a temporal beginning to the act of creation. But even on this hypothesis there are problems, and this would seem to be Hartshorne’s second point. If Plato and Hartshorne are correct that being *is* dynamic power, then the sort of unlimited power implied by creation *ex nihilo* is impossible. Hartshorne would argue, contra Alston, that there is a connection between belief in creation *ex hyle* (as opposed to creation *ex nihilo*) and the metaphysical principle that being is dynamic power. Creation *ex nihilo*, Hartshorne thinks, is a convenient fiction invented in the first centuries B.C.E. and C.E. in order to exalt divine power, but it is not the only sort of creation that religious believers have defended, nor is it defensible if being is dynamic power (see Boyce Gibson 1964)[^boyce-1964].
    step1: |-
      从哈茨霍恩的观点看，阿尔斯顿这里的立场有两个问题。第一，尽管相信 **某种** 神圣创造性深深植根于宗教经验史，但尚不清楚这些根必须触及从 **无** 中创造。例如，尚不清楚从 **无** 中创造是《创世记》所描述的那种创造，因为当《圣经》以“上帝的灵运行在水面上”这一陈述开始时，人们得到的印象是：上帝和那含水的淤泥都已存在了永远。然而，如果一个人像阿尔斯顿那样相信从 **无** 中创造，他仍可能声称从 **无** 中创造并不必然意味着创造行为在时间上的开端。但即使在这一假设下也有问题，而这似乎是哈茨霍恩的第二点。如果柏拉图和哈茨霍恩正确——存在 **是** 动态力量——那么从 **无** 中创造所隐含的那种无限力量就是不可能的。哈茨霍恩会与阿尔斯顿相反地论证：相信从 **质** 中创造（与从 **无** 中创造相对）与存在是动态力量这一形而上学原则之间有联系。哈茨霍恩认为，从 **无** 中创造是公元前和公元最初几个世纪为了抬高神圣力量而发明的一种方便的虚构，但它不是宗教信徒所辩护的唯一一种创造，而且如果存在是动态力量，它也不可辩护（见 Boyce Gibson 1964）[^boyce-1964]。
