      This rapproachement in Alston between classical theism and neoclassical theism is a step beyond James Ross’s belief that these are two competing descriptions of God at an impasse. Hartshorne partially agrees with Ross. Neoclassical, dipolar theism *already* includes the best insights of classical theism, he thinks. For this and other reasons, Hartshorne thinks that there are rich possibilities for progress in philosophy in the future made available through neoclassical theism (see Rescher 2003; and Shields 2009)[^rescher-2003][^shields-2009].
    step1: |-
      阿尔斯顿身上古典有神论与新古典有神论之间的这一和解，超越了詹姆斯·罗斯的信念——这两者是对上帝的两种相互竞争的描述，处于僵局。哈茨霍恩部分同意罗斯。他认为，新古典的、双极的有神论 **已经** 包含了古典有神论的最佳洞见。出于这个及其它原因，哈茨霍恩认为，通过新古典有神论，未来哲学进步有丰富的可能性（见 Rescher 2003；以及 Shields 2009）[^rescher-2003][^shields-2009]。
