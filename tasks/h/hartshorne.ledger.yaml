      Hartshorne’s criticism of anthropocentrism is due not only to his concern for God, but also for beings-in-becoming who experience in a less sophisticated way than humans. To say that all active singulars feel—leaving out of the picture abstractions like “twoness” or insentient composites of active singulars that do not themselves feel as wholes—is not to say that they are self-conscious or that they think. As before, however, Hartshorne’s axiology is ultimately theocentric in character. It should be noted, however, that Hartshorne has exerted considerable influence on several scholars of Asian philosophy, including some who are not theists (see King 1991; Arapura 1991; and Matsunobu 1991)[^arapura-1991][^king-1991][^matsunobu-1991].
