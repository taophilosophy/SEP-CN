      The asymmetrical view of time, common to process thinkers in general (e.g., Bergson, Whitehead, Hartshorne), in which the relationship between the present and the past is radically different from the relationship between the present and the future, also has implications for Hartshorne’s theodicy (see Devlin 1991)[^devlin-1991]. A plurality of partially free agents, including nonhuman ones, facing a future that is neither completely determined nor foreknown in detail, makes it not only possible, but likely, that these agents will get in each other’s way, clash, and cause each other to suffer. On this view, God is the fellow sufferer who understands.
    step1: |-
      时间的不对称观点——普遍见于过程思想家（例如柏格森、怀特海、哈茨霍恩），其中现在与过去的关系根本不同于现在与未来的关系——也对哈茨霍恩的神正论有影响（见 Devlin 1991）[^devlin-1991]。面对一个既非完全决定也非被详细预知的未来，一部分自由的行为者（包括非人类行为者）的多元性，使得这些行为者互相妨碍、冲突、并使彼此受苦不仅可能，而且很可能。在这种观点中，上帝是理解的共同受苦者。
