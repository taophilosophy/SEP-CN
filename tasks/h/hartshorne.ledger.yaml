      In a way, pre-literate animists were on the right track, as are children and Romantic poets like William Wordsworth, in tending toward psychicalism. The possible defects in these proto-psychicalists are not responded to adequately by seeing them as “primitive” and in need of correction by “common sense,” which should no more be legislative in metaphysics than it is in science. Both psychicalism and contemporary science, in contrast to common sense, see dynamism throughout the microscopic world. The pure materialist absolutizes the anthropocentric biases of ordinary language. Psychicalism tries to transcend these biases (see Ogden 1964)[^ogden-1964].
