      It is surprising that Hartshorne enlists Kant in the defense of psychicalism. In his *Dreams of a Spirit-Seer*, Kant rebukes those who ridicule Leibniz’s panpsychism. *If* we had to find a positive concept of reality in-itself, Leibniz points the way (see Loemker 1964)[^loemker-1964]. Either we remain agnostic regarding things-in-themselves (Kant’s own view) or we hold with Leibniz that things-*in-themselves* are psychical individuals (Hartshorne’s view). In a sense, the most viable alternative to psychicalism, on this view, is not so much materialism but agnosticism regarding things-in-themselves. What resembles no aspect of experience is bare nothing rather than some thing-in-itself. The “qualities” of sheer material beings would of necessity be quite unknown to us. What is needed, by contrast, is a view that accommodates the continuity among qualities in various types of psyche.
    step1: |-
      令人惊讶的是，哈茨霍恩征引康德来为心理主义辩护。在他的《一位通灵者的梦》中，康德斥责那些嘲笑莱布尼茨泛心论的人。**如果** 我们必须找到实在自身的积极概念，莱布尼茨指明了道路（见 Loemker 1964）[^loemker-1964]。要么我们继续对物自体持不可知论（康德自己的观点），要么我们与莱布尼茨一起主张：物 **自体** 是心理的个体（哈茨霍恩的观点）。在某种意义上，在这种观点中，心理主义最可行的替代方案与其说是唯物主义，不如说是对物自体的不可知论。与经验的任何方面都不相似的东西，是纯粹的无，而不是某种物自体。纯粹物质存在者的“性质”必然为我们所完全不知。相比之下，所需要的是这样一种观点：它容纳各种类型心灵中性质之间的连续性。
