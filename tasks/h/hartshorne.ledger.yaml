      查尔斯·哈茨霍恩生于十九世纪，活到二十一世纪仍在从事哲学研究。他于 1897 年 6 月 5 日出生于美国宾夕法尼亚州的基坦宁。像阿尔弗雷德·诺思·怀特海一样，他是英国圣公会一位牧师的儿子，尽管他的许多祖先是贵格会教徒。在进入哈弗福德学院之后，他在第一次世界大战期间于法国担任医疗兵，随身带了一箱哲学书籍上前线。战后，哈茨霍恩在哈佛获得了学士学位和哲学博士学位，并在那里结识了怀特海。哈茨霍恩哲学的大部分主要因素在他熟悉怀特海的思想之前就已经显现，这与一种流行的误解相反。也就是说，哈茨霍恩独立于怀特海的影响，得出了与怀特海许多相同的结论。（一个例外是怀特海对永恒对象的辩护，这与哈茨霍恩的突现共相理论部分形成对照，后者可以说更符合过程世界观。）1923 至 1925 年间，一笔博士后奖学金把他带到德国，在那里他上了胡塞尔和海德格尔两位的课。但这两位思想家对他哲学的影响都不如 C.S. 皮尔士大，皮尔士的论文集是他与保罗·韦斯共同编辑的（见 Thompson 1984）[^thompson-1984]。除了许多客座职位之外，哈茨霍恩的教学生涯主要在三个机构度过。1928 至 1955 年间，他在芝加哥大学任教，在那里他是神学院中一股主导性的知识力量，尽管他实际上被安置在哲学系，而在哲学系他的影响力远没有那么显著。1955 至 1962 年间他在埃默里大学，之后他转到得克萨斯大学奥斯汀分校。哈茨霍恩最终成为奥斯汀的长期荣誉退休教授，并在那里生活直到他于 2000 年 10 月 9 日去世。他的妻子多萝西与丈夫一样富有活力，并在他的著作中被频繁提及。哈茨霍恩从未拥有过汽车，也不抽烟、不饮酒、不摄入咖啡因；他对鸟鸣有着强烈的热情，并成为这一领域国际知名的专家。
    step2: |-
