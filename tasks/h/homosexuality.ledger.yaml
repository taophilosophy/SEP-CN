      Broader currents in society have influenced the ways in which scholars and activists have approached research into sexuality and same-sex attraction. Some early 20ᵗʰ century researchers and equality advocates, seeking to vindicate same-sex relations in societies that disparaged and criminalized it, put forward lists of famous historical figures attracted to persons of the same sex. Such lists implied a common historical entity underlying sexual attraction, whether one called it ‘inversion’ or ‘homosexuality.’ This approach (or perhaps closely related family of approaches) is commonly called essentialism. Historians and researchers sympathetic to the gay liberation movement of the late 1960s and 1970s produced a number of books that implicitly relied on an essentialist approach. In the 1970s and 1980s John Boswell raised it to a new level of methodological and historical sophistication, although his position shifted over time to one of virtual agnosticism between essentialists and their critics. Crompton’s work (2003) is a notable contemporary example of an essentialist methodology.
    step1: |-
      社会中更广泛的潮流影响了学者和活动家研究性和同性恋吸引的方式。一些 20 世纪初的研究者和平等倡导者，寻求在诋毁和刑事化同性关系的社会中为同性关系辩护，提出了吸引同性的著名历史人物名单。这样的名单暗示了性吸引背后的共同历史实体，无论人们称之为“性倒错”还是“同性恋”。这种方法（或可能密切相关的家族方法）通常被称为本质主义。对 1960 年代末和 1970 年代同性恋解放运动抱持同情的历史学家和研究者，创作了大量暗中依赖本质主义方法的著作。在 1970 和 1980 年代，约翰·博斯韦尔将其提升到方法论和历史精微性的新高度，尽管他的立场随时间转移到本质主义者与其批评者之间近乎不可知论的位置。克朗普顿的著作（2003）是本质主义方法论的著名当代例证。
