      As has been frequently noted, the ancient Greeks did not have terms or concepts that correspond to the contemporary dichotomy of ‘heterosexual’ and ‘homosexual’ (e.g., Foucault, 1980). There is a wealth of material from ancient Greece pertinent to issues of sexuality, ranging from dialogues of Plato, such as the *Symposium*, to plays by Aristophanes, and Greek artwork and vases. What follows is a brief description of ancient Greek attitudes, but it is important to recognize that there was regional variation. For example, in parts of Ionia there were general strictures against same-sex *eros*, while in Elis and Boiotia (e.g., Thebes), it was approved of and even celebrated (cf. Dover, 1989; Halperin, 1990).
    step1: |-
      正如人们经常指出的，古希腊人没有与当代“异性恋”与“同性恋”二分相对应的术语或概念（例如，Foucault, 1980）。古希腊有大量与性议题相关的材料，从柏拉图的对话（如《会饮篇》）到阿里斯托芬的戏剧，以及希腊艺术品和花瓶。以下是对古希腊态度的简要描述，但重要的是要认识到存在地区差异。例如，在爱奥尼亚的部分地区，对同性恋 *eros*（爱欲）普遍存在限制，而在伊利斯和玻俄提亚（如底比斯），它被认可甚至被庆祝（参见 Dover, 1989; Halperin, 1990）。
    step2: |-
      正如人们常指出的，古希腊人并没有与当代“异性恋/同性恋”二分相对应的术语或概念（例如，Foucault, 1980）。古希腊有大量与性议题相关的材料，从柏拉图的对话（如《会饮篇》），到阿里斯托芬的戏剧，再到希腊艺术品与花瓶。以下是对古希腊态度的简要描述，但须认识到其中存在地区差异。例如，在爱奥尼亚的部分地区，对同性恋 *eros*（爱欲）普遍设有限制；而在伊利斯与玻俄提亚（如底比斯），同性之爱则得到认可甚至受到庆祝（参见 Dover, 1989; Halperin, 1990）。
  - id: 3
    source: |-
      Probably the most frequent assumption about sexual orientation, at least by ancient Greek authors, is that persons can respond erotically to beauty in either sex. Diogenes Laeurtius, for example, wrote of Alcibiades, the Athenian general and politician of the 5ᵗʰ century B.C., “in his adolescence he drew away the husbands from their wives, and as a young man the wives from their husbands.” (Quoted in Greenberg, 1988, 144) Some persons were noted for their exclusive interests in persons of one gender. For example, Alexander the Great and the founder of Stoicism, Zeno of Citium, were known for their exclusive interest in boys and other men. Such persons, however, are generally portrayed as the exception. Furthermore, the issue of what biological sex one is attracted to is seen as an issue of taste or preference, rather than as a moral issue. A character in Plutarch’s *Erotikos* (*Dialogue on Love*) argues that “the noble lover of beauty engages in love wherever he sees excellence and splendid natural endowment without regard for any difference in physiological detail” (*ibid*., 146). Gender just becomes irrelevant “detail” and instead the excellence in character and beauty is what is most important.
    step1: |-
      关于性取向最常见的假设，至少古希腊作者是这样认为的，是人们可以对任一性别的美产生情欲上的回应。例如，第欧根尼·拉尔修写到公元前 5 世纪的雅典将军和政治家亚西比德，“在他的青春期，他让丈夫们离开他们的妻子，而作为年轻人，他让妻子们离开他们的丈夫。”（引自 Greenberg, 1988, 144）有些人因对某一性别者的排他性兴趣而闻名。例如，亚历山大大帝和斯多葛学派的创始人季蒂昂的芝诺，因对男孩和其他男性的排他性兴趣而闻名。然而，这样的人通常被描绘为例外。此外，一个人被吸引到的生物性别被看作品味或偏好的问题，而非道德问题。普鲁塔克《爱神》（*Erotikos*）（《论爱》）中的一个角色论证说，“高贵的爱美者无论在哪里看到卓越和辉煌的天资，都会去爱，而不考虑生理细节上的任何差异”（*ibid*., 146）。性别仅仅成为无关的“细节”，而品格和美的卓越才是最重要的。
    step2: |-
      关于性取向最常见的假设——至少古希腊作者持此看法——是：人们能够对任一性别的美产生情欲上的回应。例如，第欧根尼·拉尔修写到公元前 5 世纪的雅典将军与政治家亚西比德时说道：“在他的青春期，他使丈夫们离开妻子；而到了青年期，他使妻子们离开丈夫。”（引自 Greenberg, 1988, 144）有些人则以对某一性别者的排他性兴趣而著称。例如，亚历山大大帝与斯多葛学派创始人季蒂昂的芝诺，便以对男孩及其他男性的排他性兴趣闻名。然而，这类人通常被描绘为例外。此外，一个人被吸引到的生物性别被看作品味或偏好的问题，而非道德问题。普鲁塔克《爱神》（*Erotikos*）（《论爱》）中一位角色论证道：“高贵的爱美者，无论何处见到卓越与辉煌的天资，便会投身于爱，而不顾及生理细节上的任何差异”（*ibid*., 146）。性别仅仅沦为无关的“细节”，而品格之卓越与美才是最重要的。
  - id: 4
    source: |-
      Even though the gender that one was erotically attracted to (at any specific time, given the assumption that persons will likely be attracted to persons of both sexes) was not important, other issues were salient, such as whether one exercised moderation. Status concerns were also of the highest importance. Given that only free men had full status, women and male slaves were not problematic sexual partners. Sex between freemen, however, was problematic for status. The central distinction in ancient Greek sexual relations was between taking an active or insertive role, versus a passive or penetrated one. The passive role was acceptable only for inferiors, such as women, slaves, or male youths who were not yet citizens. Hence the cultural ideal of a same-sex relationship was between an older man, probably in his 20s or 30s, known as the *erastes*, and a boy whose beard had not yet begun to grow, the *eromenos* or *paidika*. In this relationship there was courtship ritual, involving gifts (such as a rooster), and other norms. The *erastes* had to show that he had nobler interests in the boy, rather than a purely sexual concern. The boy was not to submit too easily, and if pursued by more than one man, was to show discretion and pick the more noble one. There is also evidence that penetration was often avoided by having the *erastes* face his beloved and place his penis between the thighs of the *eromenos*, which is known as intercrural sex. The relationship was to be temporary and should end upon the boy reaching adulthood (Dover, 1989). To continue in a submissive role even while one should be an equal citizen was considered troubling, although there certainly were many adult male same-sex relationships that were noted and not strongly stigmatized. While the passive role was thus seen as problematic, to be attracted to men was often taken as a sign of masculinity. Greek gods, such as Zeus, had stories of same-sex exploits attributed to them, as did other key figures in Greek myth and literature, such as Achilles and Hercules. Plato, in the *Symposium*, argues for an army to be comprised of same-sex lovers. Thebes did form such a regiment, the Sacred Band of Thebes, formed of 500 soldiers. They were renowned in the ancient world for their valor in battle.
    step1: |-
      尽管一个人被情欲吸引的性别（在任何特定时间，鉴于人们很可能被两性的人都吸引的假设）并不重要，但其他问题却很突出，例如一个人是否践行节制。地位问题也至关重要。鉴于只有自由民才拥有完整地位，女性和男性奴隶不是有问题的性伴侣。然而，自由民之间的性行为对地位来说是有问题的。古希腊性关系的核心区分在于采取主动或插入的角色，与被动的或被插入的角色之间。被动角色只有对下位者才是可接受的，如女性、奴隶，或尚未成为公民的男性青年。因此，同性关系的文化理想是介于一位年长的男性（可能二三十岁，被称为 *erastes*（爱者））与一位胡须尚未开始生长的男孩（*eromenos*（被爱者）或 *paidika*）之间。在这种关系中，有求爱仪式，涉及礼物（如一只公鸡），以及其他规范。*erastes* 必须表明他对男孩有更高尚的兴趣，而非纯粹性方面的关切。男孩不应轻易顺从，如果被一个以上的人追求，他应表现出审慎并选择更高尚的那一位。还有证据表明，插入常常通过让 *erastes* 面对其爱人并将阴茎置于 *eromenos* 的大腿之间来避免，这被称为腿间性行为。这种关系应是暂时的，并应在男孩成年时结束（Dover, 1989）。即使一个人本应是平等的公民，继续处于顺从角色被认为是有问题的，尽管当然有许多成年男性的同性关系被注意到且未被强烈污名化。虽然被动角色因此被视为有问题，但被男性吸引常被当作男子气概的标志。希腊诸神，如宙斯，被归因有同性恋的事迹，希腊神话和文学中的其他关键人物也是如此，如阿喀琉斯和赫拉克勒斯。柏拉图在《会饮篇》中主张由同性恋人组成的军队。底比斯确实组建了这样的军团，即底比斯圣队，由 500 名士兵组成。他们在古代世界以作战英勇闻名。
    step2: |-
      尽管一个人被情欲吸引的性别（在任何特定时刻，鉴于人们往往会被两性者都吸引这一假设）并不重要，但其他问题却相当突出，例如一个人是否践行节制。地位问题同样至关重要。由于只有自由民才拥有完整地位，女性与男性奴隶便不是有问题的性伴侣。然而，自由民之间的性行为对地位而言则是有问题的。古希腊性关系的核心区分，在于主动/插入的角色与被动的/被插入的角色之间。被动角色只有对下位者才可接受，如女性、奴隶，或尚未成为公民的男性青年。因此，同性关系的文化理想是介于一位年长的男性（可能二三十岁，被称为 *erastes*〔爱者〕）与一位胡须尚未长出的男孩（*eromenos*〔被爱者〕或 *paidika*）之间。在这种关系中存在求爱仪式，涉及礼物（如一只公鸡）以及其他规范。*erastes* 必须表明他对男孩怀有更高尚的兴趣，而非纯粹性方面的关切。男孩不应轻易顺从；若被一个以上的人追求，他应表现出审慎，并选择更崇高的一位。也有证据表明，人们常常通过让 *erastes* 面对其爱人、将阴茎置于 *eromenos* 大腿之间来避免插入，这被称为腿间性行为。这种关系应是暂时的，并应在男孩成年时终结（Dover, 1989）。一个人即使本应成为平等的公民，若仍处于顺从角色，则被视为有问题的；尽管当然有许多成年男性的同性关系被记录在案且未受强烈污名化。被动角色固然被视为有问题，但被男性吸引却常被当作男子气概的标志。希腊诸神（如宙斯）被归入同性恋事迹的故事，希腊神话与文学中的其他关键人物（如阿喀琉斯与赫拉克勒斯）亦然。柏拉图在《会饮篇》中主张一支由同性恋人组成的军队。底比斯确实组建了这样的军团——底比斯圣队，由 500 名士兵组成。他们在古代世界以作战英勇闻名。
