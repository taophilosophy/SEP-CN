      For the next several centuries in Europe, the laws against homosexual sex were severe in their penalties. Enforcement, however, was episodic. In some regions, decades would pass without any prosecutions. Yet the Dutch, in the 1730s, mounted a harsh anti-sodomy campaign (alongside an anti-Roma pogrom), even using torture to obtain confessions. As many as one hundred men and boys were executed and denied burial (Greenberg, 1988, 313–4). Also, the degree to which sodomy and same-sex attraction were accepted varied by class, with the middle class taking the most restrictive view, while the aristocracy and nobility often accepted public expressions of alternative sexualities. At times, even with the risk of severe punishment, same-sex oriented subcultures would flourish in cities, sometimes only to be suppressed by the authorities. In the 19ᵗʰ century there was a significant reduction in the legal penalties for sodomy. The Napoleonic code decriminalized sodomy, and with Napoleon’s conquests that Code spread. Furthermore, in many countries where homosexual sex remained a crime, the general movement at this time away from the death penalty usually meant that sodomy was removed from the list of capital offenses.
