      然而，对于这种将婚姻作为中心人类善的说明，有几个反对意见。一个是：通过将生育作为婚姻的‘自然完成’，不育的婚姻因此被贬低。在伴侣知道一方或双方不育的异性婚姻中的性，不是为了生育。然而，这肯定不是错的。那么，为什么在同样语境（长期伴侣关系结合）中的同性性行为是错的（Macedo, 1995）？自然法的回应是：虽然阴道性交是一种潜在生育性的性行为，就其本身而言（尽管承认对特定夫妇可能不可能），但口交和肛交从来不是潜在生育性的，无论异性还是同性（George, 1999a）。但是，这种生物学区分也在道德上相关吗，并且以自然法理论家假定的方式相关？自然法理论家在这些问题的讨论中似乎摇摆不定。一方面，他们想捍卫一种婚姻理想，即作为爱的结合，其中两个人承诺于彼此的繁荣，而性是那种理想的补充。然而，这打开了可允许的男同性恋性行为或异性鸡奸的可能性，两者他们都想反对。所以他们然后捍卫一种似乎粗糙还原的性说明，强调生育到这种程度：实际上除在其爱侣的阴道之外的任何地方射精都是不可允许的。然后，当他们被指责为还原论时，他们又回到更广泛的婚姻理想。
