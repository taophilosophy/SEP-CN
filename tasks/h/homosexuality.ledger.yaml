      In the 20ᵗʰ century sexual roles were redefined once again. For a variety of reasons, premarital intercourse slowly became more common and eventually acceptable. With the decline of prohibitions against sex for the sake of pleasure even outside of marriage, it became more difficult to argue against gay sex. These trends were especially strong in the 1960s, and it was in this context that the gay liberation movement took off. Although gay and lesbian rights groups had been around for decades, the low-key approach of the Mattachine Society (named after a medieval secret society) and the Daughters of Bilitis had not gained much ground. This changed in the early morning hours of June 28, 1969, when the patrons of the Stonewall Inn, a gay bar in Greenwich Village, rioted after a police raid. In the aftermath of that event, gay and lesbian groups began to organize around the country. Gay Democratic clubs were created in every major city, and one fourth of all college campuses had gay and lesbian groups (Shilts, 1993, ch.28). Large gay urban communities in cities from coast to coast became the norm. The American Psychiatric Association removed homosexuality from its official listing of mental disorders. The increased visibility of gays and lesbians has become a permanent feature of American life despite the two critical setbacks of the AIDS epidemic and an anti-gay backlash (see Berman, 1993, for a good survey). The post-Stonewall era has also seen marked changes in Western Europe, where the repeal of anti-sodomy laws and legal equality for gays and lesbians has become common. In the 21st century, the legal recognition of same-sex marriage has become widespread.
    step1: |-
      在 20 世纪，性角色再次被重新定义。由于各种原因，婚前性交逐渐变得更加普遍并最终被接受。随着对为了快乐而性（即使婚外）的禁令的衰落，反对同性恋性行为变得更难。这些趋势在 1960 年代尤其强劲，正是在这种背景下同性恋解放运动兴起。尽管同性恋权利团体已经存在了几十年，但马塔辛协会（以一个中世纪秘密会社命名）和比利提斯之女会的低调做法没有取得多大进展。这种情况在 1969 年 6 月 28 日清晨发生了改变，当时格林尼治村一家同性恋酒吧石墙旅馆的顾客在警察突袭后发生了暴动。在该事件之后，全国各地的同性恋团体开始组织起来。每个主要城市都成立了同性恋民主俱乐部，四分之一的大学校园有同性恋团体（Shilts, 1993, ch.28）。从东海岸到西海岸的大城市中的大型同性恋城市社区成为常态。美国精神病学协会将同性恋从其官方精神障碍列表中移除。尽管有艾滋病流行和反同性恋反弹这两个严重挫折，同性恋者日益增加的可见度已成为美国生活的永久特征（参见 Berman, 1993，提供良好的综述）。石墙后的时代也看到了西欧的显著变化，废除反鸡奸法和同性恋者的法律平等已变得普遍。在 21 世纪，同性婚姻的法律承认已变得广泛。
