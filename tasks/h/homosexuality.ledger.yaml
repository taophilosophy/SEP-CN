    source: |-
      The term ‘homosexuality’ was coined in the late 19ᵗʰ century by an Austrian-born Hungarian psychologist, Karoly Maria Benkert. Although the term is new, discussions about sexuality in general, and same-sex attraction in particular, have occasioned philosophical discussion ranging from Plato’s *Symposium* to contemporary queer theory. Since the history of cultural understandings of same-sex attraction is relevant to the philosophical issues raised by those understandings, it is necessary to review briefly some of the social history of homosexuality. Arising out of this history, at least in the West, is the idea of natural law and some interpretations of that law as forbidding homosexual sex. References to natural law still play an important role in contemporary debates about homosexuality in religion, politics, and even courtrooms. Finally, perhaps the most significant recent social change involving homosexuality is the emergence of the gay liberation movement in the West. In philosophical circles this movement is, in part, represented through a rather diverse group of thinkers who are grouped under the label of queer theory. A central issue raised by queer theory, which will be discussed below, is whether homosexuality, and hence also heterosexuality and bisexuality, is socially constructed or purely driven by biological forces.
    step1: |-
      “homosexuality”（同性恋）一词于 19 世纪末由出生于奥地利的匈牙利心理学家卡罗伊·玛丽亚·本克特（Karoly Maria Benkert）创造。尽管这个术语是新的，但关于一般意义上的性，尤其是关于同性恋吸引的讨论，已引发了从柏拉图的《会饮篇》到当代酷儿理论的哲学讨论。由于对同性恋吸引的文化理解的历史与这些理解所引发的哲学问题相关，因此有必要简要回顾同性恋的一些社会历史。从这段历史中产生的，至少在西方是如此，是自然法的观念以及该法的一些解释将同性性行为视为被禁止。对自然法的援引在当代关于宗教、政治乃至法庭上的同性恋辩论中仍发挥重要作用。最后，或许涉及同性恋的最近最重要的社会变化是西方同性恋解放运动的出现。在哲学界，这一运动部分地通过一群相当多元的思想家来代表，他们被归入酷儿理论的标签之下。酷儿理论提出的一个核心问题，将在下文讨论，是同性恋，从而也包括异性恋和双性恋，是社会建构的，还是纯粹由生物力量驱动的。
    step2: |-
      “同性恋”（homosexuality）一词于 19 世纪末由奥裔匈牙利心理学家卡罗伊·玛丽亚·本克特（Karoly Maria Benkert）创造。尽管这个术语是新的，但关于性的一般讨论，尤其是关于同性恋吸引的讨论，已引发了从柏拉图的《会饮篇》到当代酷儿理论的哲学思考。由于对同性恋吸引的文化理解的历史与这些理解所引发的哲学问题密切相关，因此有必要简要回顾同性恋的一些社会历史。从这段历史中产生的一种观念——至少在西方是如此——是自然法观念，以及该法的某些解释将同性性行为视为被禁止。对自然法的援引在当代关于宗教、政治乃至法庭上的同性恋辩论中仍发挥着重要作用。最后，或许涉及同性恋的最近最重要社会变化，是西方同性恋解放运动的兴起。在哲学界，这一运动部分地由一群相当多元的思想家所代表，他们被归入酷儿理论的标签之下。酷儿理论提出的一个核心问题（下文将讨论）是：同性恋——从而也包括异性恋和双性恋——究竟是社会建构的，还是纯粹由生物力量驱动的。
