      尽管植根于后现代主义，特别是福柯的著作，酷儿理论在法国的接受最初是敌对的（参见 Eribon, 2004）。酷儿理论第一‘波’的核心文本，如朱迪斯·巴特勒和伊芙·塞奇威克的中心著作，在法语翻译中缓慢出现，直到原始出版后一个半世纪才出版。无疑，法国共和的自我理解，它是普遍主义的，常常对多元文化倾向的运动怀有敌意，是酷儿理论洞见缓慢且常常被极力抵制的输入的一个因素。同样，酷儿理论在德国哲学和政治哲学中也处于边缘。总之，公平地说，酷儿理论在盎格鲁-美利坚世界产生了更大的影响。
