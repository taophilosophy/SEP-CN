      自然法理论目前对主流自由主义思想做出了重大让步。与它的中世纪表述相比当然不同，大多数当代自然法理论家主张有限的政府权力，不相信国家有兴趣试图防止所有道德过错。尽管如此，大多数“新自然法理论”的支持者确实反对同性恋，反对在就业和住房方面对男女同性恋者的法律保护，甚至达到在法庭案件中担任专家证人或帮助撰写 *amicus curae*（法庭之友）简报的程度。他们也反对同性婚姻（Bradley, 2001; George, 1999b）。然而，有一些尝试将自然法理论与同性恋调和（例如，参见 Lago, 2018; Goldstein, 2011）。在保持自然法理论的核心方面及其基本人类善的说明的同时，他们通常要么论证婚姻本身不是一种基本善（Lago），要么论证当以不那么狭隘、教条的方式理解时，它所是的善使得同性伴侣可以享受它。这些论证的部分理论意义在于，它们允许对性进行道德评价，仍然要求它实现友谊的基本善才可允许，同时避免当代自然法理论家贬低任何形式同性性行为的各种似乎有问题的方面。
