      上述历史回顾的一个原因是，它有助于为理解性是社会建构的而非自然赋予的这一主张提供一些背景。此外，为了不预判社会建构主义与本质主义之争，我避免将‘同性恋’一词应用于古代或中世纪。在古希腊，一个人的伴侣的性别并不重要，而是是否采取主动或被动的角色。在中世纪观点中，‘鸡奸者’是一个屈服于诱惑并从事某些非生育性行为的人。虽然伴侣的性别在中世纪比在古代观点中更重要，但更广泛的神学框架强调罪与戒罪之分。随着现代‘同性恋’观念的兴起，一个人被置于一个特定的范畴，即使他没有按照这些倾向行动。很难察觉一种共同的、自然的性表达跨越这三个非常不同的文化。社会建构主义的主张是，没有‘自然的’性；所有关于性的理解都是在文化理解内部建构并受其中介的。通过纳入西方传统之外的人类学数据，这些例子可以推得更远（Halperin, 1990; Greenberg, 1988）。然而，即使在这里提供的更狭窄语境中，它们之间的差异也是惊人的。古希腊的假设是男人（关于希腊人对女性的态度知之甚少）可以对任一性别产生情欲回应，而从事同性关系的绝大多数男人也是已婚的（或后来会结婚）。然而，当代对同性恋的理解将性领域一分为二，异性恋和同性恋，而大多数异性恋者不能对自己的性别产生情欲回应。
