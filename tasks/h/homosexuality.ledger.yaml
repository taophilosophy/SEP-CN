      自然法理论最有影响的表述是由托马斯·阿奎那在 13 世纪做出的。将亚里士多德的方法与基督教神学相结合，阿奎那强调某些人类善的中心地位，包括婚姻和生育。虽然阿奎那没有写很多关于同性性关系的内容，但他确实详细撰写了各种性行为作为罪。对阿奎那来说，在婚姻范围内的性，并且有助于推进他所认为的婚姻的独特善，主要是爱、伴侣关系和合法后代，是可允许的，甚至是好的。阿奎那没有论证生育是道德或正义性行为的必要部分；已婚夫妇可以在没有生育动机的情况下享受性，而在一个或两个伴侣不育（也许因为女性已绝经）的婚姻中的性，也可能是正义的（出于表达爱的动机）。到目前为止，阿奎那的观点实际上不必排除同性性行为。例如，一个托马斯主义者可以接受同性婚姻，然后应用同样的推理，只是将这对伴侣视为生殖上不育的，但仍然是完全充满爱和伴侣关系的结合。
