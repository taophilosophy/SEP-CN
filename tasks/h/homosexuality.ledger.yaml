      酷儿进路开启的另一个批判视角，尽管显然隐含于上述那些，尤其重要。由于大多数反同性恋的论证依赖于所谓异性恋的自然性，酷儿理论家试图表明这些范畴本身是如何深深的社会建构。一个例子有助于说明这种方法。在一篇反对同性婚姻的文章中（之所以选择它是因为它非常有代表性），詹姆斯·Q·威尔逊（1996）主张男同性恋者有‘很大的倾向’滥交。相反，他提出充满爱的、一夫一妻的婚姻作为异性恋的自然状态。在他的论证中，异性恋是完全自然却又同时受到威胁的奇特组合。一个人生来是异性恋，但这一自然状态可以被诸如同性伴侣的存在、同性恋教师、甚至过度谈论同性恋等事物所颠覆。威尔逊的论证要求异性恋与同性恋之间彻底分离。如果同性恋是彻底不同的，压制它是正当的。威尔逊有勇气坦率地陈述他论证的这一要素；他公开反对对男女同性恋者的‘政治强加的宽容’（Wilson, 1996, 35）。
