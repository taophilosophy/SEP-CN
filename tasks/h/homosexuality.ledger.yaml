      男同性恋和女同性恋理论因此面临三个重大问题，所有这些都涉及‘身份’概念的困难。酷儿理论的兴起在很大程度上是为了克服它们。酷儿理论如何做到这一点，可以通过观察‘酷儿’一词本身来看。与男同性恋或女同性恋不同，‘酷儿’据论证并不指涉一种本质，无论是性性质的还是其他。相反，它纯粹是关系性的，作为一个未定义的术语，其意义恰恰在于它是规范之外的东西，无论规范本身如何被定义。正如一位最能言善辩的酷儿理论家所说：“酷儿是……与正常的、合法的、主导的一切相悖的*任何东西*。*它并不必然指涉任何特定的东西*。它是一种没有本质的身份”（Halperin, 1995, 62, 原文强调）。通过缺乏任何本质，酷儿并不边缘化那些性在男同性恋或女同性恋规范之外的人，如虐恋者。由于避免了特定的性概念化，因而没有将任何定义置于酷儿定义的中心，它允许更多的自我认同自由，例如，黑人女同性恋者可以与其种族（或任何其他特征，如参与 S & M 亚文化）认同得与其女同性恋身份一样多或更多。最后，它吸收了后结构主义关于将任何本质或非历史方面归于身份的困难的洞见。
