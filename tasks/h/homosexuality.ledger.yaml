      In the 18ᵗʰ and 19ᵗʰ centuries an overtly theological framework no longer dominated the discourse about same-sex attraction. Instead, secular arguments and interpretations became increasingly common. Probably the most important secular domain for discussions of homosexuality was in medicine, including psychology. This discourse, in turn, linked up with considerations about the state and its need for a growing population, good soldiers, and intact families marked by clearly defined gender roles. Doctors were called in by courts to examine sex crime defendants (Foucault, 1980; Greenberg, 1988). At the same time, the dramatic increase in school attendance rates and the average length of time spent in school, reduced transgenerational contact, and hence also the frequency of transgenerational sex. Same-sex relations between persons of roughly the same age became the norm.
