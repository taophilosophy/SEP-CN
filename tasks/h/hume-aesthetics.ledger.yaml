      Epistemically, taste is nonetheless a fallible indicator of beauty and deformity. The underlying sentiments never “refer” to anything in their cause (SOT, 268). Feelings do not represent any aspect of their occasioning objects, and they are easily attached to objects other than their cause (T, 280). (As with any causal relationship, such as the causal link between smoke and fire, an isolated effect does not refer back to its cause, nor does it provide us with information about the nature of the object or event that causes it. If we experience smoke but have never experienced fire, the smoke will tell us nothing about the nature of fire.) As effects of our interaction with the world, sentiments cannot reliably inform us about the nature of their causes. It will not always be clear, prior to careful attention and reflection, which features of a work of art are responsible for our sentiments of approbation and disapprobation. On Hume’s analysis, the chain running from cause to effect turns out to be extremely complex, for the relationship is indirect and “the human body is a mighty complicated machine” with many “secret powers” (EHU, 87; see also SOT, 270). Knowing this, good critics pronounce their verdicts only after they clarify how their own sentiments relate to the object that is being evaluated (SOT, 270–71).
    step1: |-
      从认识论上说，趣味仍然是美与丑的一个可错的指示器。基本的情感从不“指涉”其原因中的任何东西（SOT, 268）。感受并不表象其引发对象的任何方面，而且它们容易被附于其原因之外的对象（T, 280）。（如同任何因果关系，例如烟与火之间的因果联系，一个孤立的结果并不回溯指涉其原因，也不为我们提供关于引起它的对象或事件之本性的信息。如果我们经验到烟但从未经验到火，烟就不会告诉我们关于火的本性的任何东西。）作为我们与世界互动的结果，情感不能可靠地告知我们其原因的本性。在仔细关注与反思之前，并不总是清楚一件艺术品的哪些特征对我们的赞许与不赞许情感负责。按照休谟的分析，从原因到结果的链条极其复杂，因为这一关系是间接的，而且“人体是一台极为复杂的机器”，具有许多“隐秘的力量”（EHU, 87；亦见 SOT, 270）。知道这一点，好的批评家只在厘清自己的情感如何与正在被评价的对象相关之后才宣布其裁决（SOT, 270–71）。
