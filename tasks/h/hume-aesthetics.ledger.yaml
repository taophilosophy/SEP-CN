      Originally published beside “Of the Standard of Taste” in *Four Dissertations*, “Of Tragedy” is a peculiar essay. Its direct engagement with Bernard de Fontenelle and the Abbé Jean-Baptiste Dubos confirms Hume’s acquaintance with French aesthetics. Hume makes passing reference to catharsis in his mention of spectator cries and sobs that “give vent to their sorrow” (OT, 258), but there is no evidence of familiarity with Aristotle’s *Poetics*. On the whole, the essay says surprisingly little about the nature of tragedy, and what it says is combined with discussions of melodramas and historical writing. Its real topic is the experience of conflicting emotions directed simultaneously at a single object, a topic treated in the *Treatise*. Because the pleasure offered by tragedy and melodrama depends on and is proportionate with their capacity to arouse grief, fear, and other unpleasant passions, Hume uses literature and theater as an occasion to elaborate on his theory of mixed emotions. As Hume formulates it, the problem is to explain the nature of the relationship between our approbation, which is pleasurable, and the presence of “sorrow, terror, anxiety,” and other naturally disagreeable emotions (OT, 258). The solution, Hume claims, is that any emotion “which attends a passion, is easily converted into it, though in their natures they be originally different from, and even contrary to each other” (T, 419).
    step1: |-
      《论悲剧》最初与《论趣味的标准》一起发表于《四篇论文》，是一篇奇特的文章。它直接与丰特奈尔和杜博神父交锋，证实休谟熟知法国美学。休谟在提及观众喊叫与啜泣“宣泄其悲伤”时顺带提到净化（OT, 258），但没有证据表明他熟悉亚里士多德的《诗学》。总体而言，这篇文章关于悲剧本性的论述出奇地少，且所说的与情节剧和历史写作的讨论混在一起。其真正主题是同时指向单一对象的冲突情感经验，这一主题在《人性论》中亦有处理。由于悲剧与情节剧提供的愉悦取决于并正比于它们唤起悲伤、恐惧及其他不快激情的能力，休谟以文学与戏剧为由阐述其混合情感理论。按休谟的表述，问题在于解释我们的赞许——它是愉悦的——与“悲伤、恐怖、焦虑”及其他自然令人不快的情感之在场之间的关系本性（OT, 258）。休谟声称，解决办法是：任何“伴随某一激情的情感都容易转化为该激情，尽管它们的本性原本不同，甚至彼此相反”（T, 419）。
