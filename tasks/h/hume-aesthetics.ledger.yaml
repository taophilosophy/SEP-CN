      这种道德与审美的主观主义吸引休谟，其理由与吸引哈奇森的理由相同。诉诸情感在英语学界两种盛行理论——霍布斯式利己主义与伦理理性主义——之间提供了一个中间位置。哈奇森认为，德性与美不是被归于其的人与物的性质。我们可以说对象与人具有道德与审美属性，但相关属性只是“在我们心中引起的观念”。休谟通过施加自己的哲学词汇来改变哈奇森的理论，把美变成印象而非观念。但他们都同意：把人描述为有德性的或把对象描述为美的，就是对其引起某种反应的倾向提出主张。休谟问哈奇森，以如下术语概括这一论题是否轻率且“过于强烈”（HL, I, 39–40）？“[W]当你宣称任何行动或品格是恶的，你无非是说，出于你本性的构造，你在观照它时有一种责备的感受或情感。因此，恶与德性可以被比作声音、颜色、热与冷，这些按照现代哲学，不是对象中的性质，而是心中的知觉”（T, 469）。基维（Kivy，2003, pp. 307–310）强调休谟对哈奇森的欠负，论证休谟非常按照颜色的模型来理解美。尽管颜色是第二性质，因而不直接揭示引发它们的对象的性质，但有些颜色知觉是“真实而实在的”（SOT, 272），对休谟而言美亦然。然而，德性与美并不严格类似于热与冷这样的第二性质，因为批评家关于一件作品是美的断言涉及一种认可的要素，而这种要素在对冰是冷的观察中并不出现。反对按第二性质观念模型解读休谟式美的论证，由夏纳（Shiner，1996）与泰勒（Taylor，2011）提供。
