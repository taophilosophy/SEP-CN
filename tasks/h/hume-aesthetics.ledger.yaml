      It is important to recognize that Humean imagination is not a free and unrestrained activity. It is constrained by a relatively small set of permanent principles of imaginative association (T, 10, 225; EHU, 24). Although poets may “profess to follow implicitly the suggestions of their fancy” (T, 225), their poetry has little chance of pleasing others if their “fancy” or imagination employs irregular associations. The universal principles of imaginative association allow artists to predict how their representational and narrative designs will move audiences. With artworks, the intentions of the artist must be considered, a point emphasized by Jones (1976, pp. 55–56), and Jones (2009).
    step1: |-
      重要的是要认识到，休谟式的想象不是一种自由而不受约束的活动。它受一小套恒久的想象性联想原则的约束（T, 10, 225; EHU, 24）。尽管诗人可能“宣称要隐含地遵循其幻想的提示”（T, 225），但如果他们的“幻想”或想象采用不规则的联想，他们的诗歌就很少有机会取悦他人。想象性联想的普遍原则使艺术家能够预测其再现性与叙事性设计将如何打动观众。就艺术作品而言，必须考虑艺术家的意图，这一点由琼斯（Jones，1976, pp. 55–56）与琼斯（Jones，2009）强调。
