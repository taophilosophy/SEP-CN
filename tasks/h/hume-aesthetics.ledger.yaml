      Furthermore, there is disagreement on the question of whether Hume holds that these true critics will be uniform in their verdicts. Interpretation of Hume’s position is complicated by the way that he consistently affirms his motivating insight, borrowed from Hutcheson, that sentiment is the essence of evaluation. Even the worst critic says nothing false in foolishly saying that one work is better than another, however misguided their sentiment. Passages where even the best critics will diverge in their evaluations are emphasized by Wieand (1984), Savile (1993, pp. 70–71), and Mothersill (1997). Most notably, all critics have “innocent and unavoidable” preferences (SOT, 281) and so they are better or worse at evaluating different categories of art. Furthermore, these preferences change during the lifetime of each critic. Consequently, the critical judgments of some critics will diverge from those of other highly qualified critics. But when critics’ differences arise from unavoidable and “blameless,” preferences, there is no interference of prejudice (SOT, 280). In short, the problem of finding a standard of taste leads Hume to the problem of deciding which disagreements are blameless, in order to distinguish them from prejudices that disqualify a sentiment as a public recommendation.
    step1: |-
      此外，关于休谟是否认为这些真正批评家在其裁决上会一致，存在分歧。对休谟立场的解释因他始终肯定其源自哈奇森的动机性洞见——情感是评价的本质——而变得复杂。即使最差的批评家在愚蠢地说一件作品优于另一件时，也没有说任何虚假的东西，无论其情感多么误导。维兰德（Wieand，1984）、萨维尔（Savile，1993, pp. 70–71）与马瑟希尔（Mothersill，1997）强调即使最好的批评家也会在其评价中分化的段落。最显著的是，所有批评家都有“无辜而不可避免的”偏好（SOT, 281），因此他们在评价不同类别的艺术时更好或更差。此外，这些偏好在每个批评家的一生中会变化。因此，一些批评家的批判性判断会与其他高素质批评家的判断分化。但当批评家的差异源于不可避免的、“无可指责的”偏好时，就没有偏见的干扰（SOT, 280）。简言之，寻找趣味标准的问题使休谟面对决定哪些分歧无可指责的问题，以便把它们与使一种情感丧失作为公共推荐资格的偏见区分开来。
