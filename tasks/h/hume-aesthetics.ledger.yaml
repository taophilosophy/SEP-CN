      Hume’s theory is most firmly rooted in the work of Joseph Addison, Francis Hutcheson, and, to a lesser extent, Shaftesbury (Anthony Ashley Cooper). The specific connections are detailed in Kivy (2003), Townsend (2001), and Costelloe (2007). From the older tradition, elegantly expounded by Addison in numerous essays written between 1709 and 1715, Hume retains the idea that the values within the scope of criticism are essentially pleasures of the human imagination. Although Hume acknowledges cases where beauty seems a merely sensory pleasure, he emphasizes beauty’s status as a cognitive pleasure. Taking beauty as his paradigm case of such a value, Hume combines Addison’s theory of taste as an operation of imagination with Hutcheson’s proposal that emotions are the foundation of moral judgment. Elaborating on the “inner sense” theory, Hume endorses Hutcheson’s stance on the general question of the nature of both moral and aesthetic value. Value judgments are expressions of taste rather than reasoned analysis. Values cannot be addressed except in the context of a general theory about our shared human nature. Although recognition of aesthetic and moral beauty is a manifestation of taste (and perhaps they cannot ultimately be distinguished from one another), taste must not be dismissed as subjective, idiosyncratic preference.
    step1: |-
      休谟的理论最牢固地扎根于约瑟夫·艾迪生（Joseph Addison）、弗朗西斯·哈奇森（Francis Hutcheson）的著作，以及在较小程度上扎根于沙夫茨伯里（Anthony Ashley Cooper）的著作。具体的联系在基维（Kivy，2003）、汤森（Townsend，2001）与科斯特洛（Costelloe，2007）中有详细说明。从更早的传统中——由艾迪生在 1709 至 1715 年间撰写的众多论文中优雅地阐述——休谟保留了这样一个观念：批评范围内的价值本质上是人类想象的愉悦。尽管休谟承认有些情形中美似乎只是一种感官愉悦，但他强调美作为认知愉悦的地位。以美作为此类价值的范式例证，休谟把艾迪生的趣味理论（趣味是想象的一种运作）与哈奇森的情感是道德判断之基础的提议结合起来。阐发“内在感官”理论时，休谟赞同哈奇森关于道德与审美价值之本性这一一般问题的立场。价值判断是趣味的表达，而非推理的分析。价值只能在关于我们共同人性的普遍理论语境中加以处理。尽管对审美美与道德美的认识是趣味的一种显现（也许它们最终无法相互区分），趣味却不能被当作主观的、特殊的偏好而摒弃。
