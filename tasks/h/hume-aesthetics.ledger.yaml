      但趣味的一般规则还有第二种功能。即使规则“从未被系统化”（SOT, 273），它们的存在支持实践与比较改进趣味的观点（SOT, 275）。对特定艺术形式有充分经验的人将以更高的准确性感知案例。规则的存在给了我们理由去同意：实践提高了主体对破坏性印象（铁味）与缺失印象（没有果香）的觉察，从而对整个经验作出更反思的裁定。它们还将指导想象，鉴于对某物属于特定种类的承认，期待各种性质的组合。经恰当修正以反映心灵趣味而非身体趣味之后，桑丘亲属的故事构成《论趣味的标准》整个论证的基础。即使规则未被形式化，品酒者仍会仿佛从规则推理般运作（如“既然这是红酒，它将有果香而无皮革或铁的气味”）。有经验的读者或观众将以“有助于改进理性的同样卓越能力”接近艺术（SOT, 278），在对象被呈现的“无序”之中发现其真实品格（SOT, 273）。
