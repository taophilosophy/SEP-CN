    source: |-
      Hume’s aesthetic theory received limited attention until the second half of the Twentieth Century, when interest in the full range of Hume’s thought was enlivened by the gradual recognition of his importance among philosophers writing in English. Unfortunately, many discussions of Hume’s aesthetics concentrate on a single late essay, “Of the Standard of Taste” (1757). This emphasis misrepresents the degree to which Hume’s aesthetic theory is integrated into his philosophical system. This misrepresentation has been countered by recent monographs on Hume’s general aesthetic theory by Dabney Townsend (2001) and Timothy Costelloe (2007).
    step1: |-
      休谟的美学理论直到二十世纪下半叶才受到有限关注，那时随着英语哲学界逐渐认识到休谟的重要性，人们对休谟全部思想范围的兴趣被激发起来。不幸的是，许多关于休谟美学的讨论集中于他晚期的一篇论文《论趣味的标准》（1757）。这种强调错误地再现了休谟美学理论在其哲学体系中整合的程度。这种错误再现已由达布尼·汤森（Dabney Townsend，2001）与蒂莫西·科斯特洛（Timothy Costelloe，2007）关于休谟一般美学理论的近期专著所反驳。
    step2: |-
      休谟的美学理论直到二十世纪下半叶才受到有限关注；随着英语哲学界逐渐认识到休谟的重要性，人们对休谟整个思想范围的兴趣才被激发起来。遗憾的是，许多关于休谟美学的讨论都集中于他晚期的一篇论文《论趣味的标准》（1757）。这种侧重错误地再现了休谟美学理论融入其哲学体系的程度。达布尼·汤森（Dabney Townsend，2001）与蒂莫西·科斯特洛（Timothy Costelloe，2007）关于休谟一般美学理论的近期专著，已对这种误述作了反驳。
