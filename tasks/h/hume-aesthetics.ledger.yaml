      There should be no great surprise that Hume insists that moral judgments must sometimes enter into our aesthetic evaluations. (Good introductions to Hume’s view are provided by Mason (2001), Dadlez (2002), and Winegar (2011).) Hume does not offer a sharp distinction between moral and aesthetic taste. Evaluations that subsequent aesthetic theories regard as a purely aesthetic are, for Hume, concluding sentiments following numerous observations of contributing strengths and weaknesses. When a work of art represents human activity, then Hume’s account of moral evaluation requires that moral sentiment accompany apprehension of the action. The fictional status of the work weakens our sympathetic response, but the mere sequence of ideas will be sufficient to produce weaker versions of the sentiments that one would have if one were faced with the actual events. Given Hume’s moral theory, there is no possibility of suspending our moral response. Moral sentiments are natural and immediate. At best, one can gain a better understanding of the cultural context responsible for the work, so that one’s moral sentiments will not be negative through mere prejudice. Hume’s theory of sentiments requires that if we are going to have an aesthetic evaluation of a play’s plotting and language, then we are also going to have a moral response to its display of virtue and vice. Both must enter into our final sentiment of approbation or disapprobation.
    step1: |-
      休谟坚持道德判断有时必须进入我们的审美评价，这不足为大惊小怪。（Mason（2001）、Dadlez（2002）与 Winegar（2011）对其观点提供了很好的导论。）休谟并未在道德趣味与审美趣味之间给出截然区分。后来的美学理论视为纯粹审美的那些评价，对休谟而言，是随诸多对优缺点的观察之后的总结性情感。当一件艺术作品表现人类活动时，休谟的道德评价说明便要求道德情感伴随对该行动的领会。作品的虚构地位削弱我们的同情反应，但观念的单纯序列便足以产生较弱的情感版本——即若面对真实事件本会有的那些情感。鉴于休谟的道德理论，不存在悬置我们道德反应的可能。道德情感自然而直接。充其量，人们可以更好地理解造成该作品的文化语境，以使其道德情感不至于因单纯的偏见而消极。休谟的情感理论要求：如果我们将对一出戏的情节与语言作审美评价，那么我们也必将对其德性与恶的展示作道德反应。两者都必须进入我们最终的赞许或非难情感。
