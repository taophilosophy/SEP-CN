      One of Hume’s most puzzling claims is that taste is an “immediate” response. In his extended treatment of the passions and emotions in the *Treatise*, Hume says that “immediate” feelings are ones that do not involve the “interposition” of ideas (T, 275). Some pleasures and pains are “immediate” in the sense that they are impressions that immediately accompany other impressions (e.g., the experience of a very hot flame is accompanied by an experience of pain). How does a literary work “give immediate pleasure”? Taken literally, the *Treatise* appears to commit Hume to the view that literary works are beautiful independent of the audience’s ability to assign ideas or meanings to the words. As noted by James Grant (2014, p. 368), the *Treatise* sometimes posits a distinction between beauty, which is the quality of the object that acts upon us, and the pleasure it arouses. But these proposals are not repeated in Hume’s later writings and a commitment to observer-independent beauty is certainly not Hume’s mature position. His official theory is that there is “mental, as well as bodily taste” (SOT, 274), and both moral and aesthetic discrimination depend on mental taste. The requisite sentiments are spontaneous products of the mind, but they are not uninformed responses.
    step1: |-
      休谟最令人困惑的主张之一是趣味是一种“直接的”回应。在《人性论》中关于激情与情绪的详尽处理中，休谟说“直接的”感受是不涉及观念之“介入”的感受（T, 275）。有些愉悦与痛苦是“直接的”，其意义是它们是直接伴随其它印象的印象（例如，非常灼热的火焰的经验伴随痛苦的经验）。一部文学作品如何“给予直接的愉悦”？从字面看，《人性论》似乎使休谟承诺这一观点：文学作品的美独立于听众为词语赋予观念或意义的能力。正如詹姆斯·格兰特（James Grant，2014, p. 368）所指出的，《人性论》有时设定美（作用于我们的对象之性质）与它所唤起的愉悦之间的区分。但这些主张在休谟后来的著作中没有重复，而承诺观察者独立的美肯定不是休谟的成熟立场。他的官方理论是存在“心智的，以及身体的趣味”（SOT, 274），而道德与审美的辨别都依赖心智趣味。所要求的情感是心灵的自发产物，但它们并不是无知的反应。
