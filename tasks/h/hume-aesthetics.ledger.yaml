      Taste is immediate and spontaneous, yet the application of “good sense” and “reason” improves it (SOT, 277). Taste is not improved by reasoning from a priori normative principles. Moral and aesthetic discriminations “are not conclusions of reason” (T, 457). Neither results from a mere “comparing of ideas” (T, 463). However, taste can be influenced by consultation of “general rules of art” or “rules” that “are founded only on experience and observation” (SOT, 270). For different views on the content of these rules or principles, see Hester (1979), Dickie (1996, pp. 126–131), Shelley (2002), Dickie (2003), and Shelley (2004). Mental taste involves reason in the sense of “sound understanding,” which ultimately depends on imaginative associations of ideas. So taste involves imaginative pleasure, as Addison proposed. This doctrine of imaginative pleasure has no special connection with creativity or with the capacity to produce art.
    step1: |-
      趣味是直接而自发的，然而“良好判断”与“理性”的运用会改进它（SOT, 277）。趣味并不因从先验规范原则进行推理而改进。道德与审美的辨别“不是理性的结论”（T, 457）。两者都不是单纯的“观念比较”的结果（T, 463）。然而，趣味可以受“艺术的一般规则”或“规则”的参考所影响，这些规则“仅建立在经验与观察之上”（SOT, 270）。关于这些规则或原则之内容的不同观点，见赫斯特（Hester，1979）、迪基（Dickie，1996, pp. 126–131）、谢利（Shelley，2002）、迪基（Dickie，2003）与谢利（Shelley，2004）。心智趣味涉及“健全理解”意义上的理性，后者最终依赖于观念的想象性联想。因此，趣味涉及想象性愉悦，正如艾迪生所提出的。这种想象性愉悦的学说与创造力或生产艺术的能力没有特殊关联。
