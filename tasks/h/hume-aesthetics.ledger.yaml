      This reading of Hume is challenged by an interpretation that identifies the standard of taste with ideal critics. (The phrase does not appear in Hume.) That is, instead of real people who can guide us despite their unavoidable and intransigent biases, Hume’s true critics are ideal or perfect evaluators. The case that Hume’s critics are ideal critics who never disagree is made by Shelley (1994, 2003) and Costelloe (2007, pp. 17–18), and disputed in various ways by Guyer (2005), Ross (2008), Galgut (2012), and Durà-Vilà (2015).
    step1: |-
      对休谟的这一解读受到一种把趣味标准等同于理想批评家的解释的挑战。（这一短语不出现在休谟中。）也就是说，休谟的真正批评家不是能够引导我们的真实的人——尽管其不可避免而顽固的偏见——而是理想的或完美的评价者。休谟的批评家是永不分歧的理想批评家这一论证，由谢利（Shelley，1994, 2003）与科斯特洛（Costelloe，2007, pp. 17–18）提出，而由古耶（Guyer，2005）、罗斯（Ross，2008）、加尔古特（Galgut，2012）与杜拉-维拉（Durà-Vilà，2015）以各种方式质疑。
