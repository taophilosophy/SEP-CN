      Although published side by side, “Of Tragedy” and “Of the Standard of Taste” may offer conflicting doctrines. In the essay on taste, the unchallenged appearance of vice is treated as a flaw, and unpleasant emotion is a defect. But when “Of Tragedy” identifies a flaw in Nicholas Rowe’s *The Ambitious Stepmother*, the play’s defect is not the endorsement of vice. Instead, its flaw is the staging of action that is “too bloody and atrocious” (OT, 264). But why is “shocking” spectacle a flaw that leads to general disapprobation? Is it simply a question of the degree of shock? But why should that prevent the audiences from “converting” the shock into a “contrary” and pleasurable experience, as Hume claims happens with terror and anxiety? The obstacle does not seem to be moral in nature, of the sort explored in “Of the Standard of Taste” where Hume discusses a work’s failure to direct proper disapprobation at vicious manners. The essay on taste suggests that the same content would not be a flaw if proper adjustments were made. But “Of Tragedy” does not call attention to the moral dimension of Rowe’s play. So “Of Tragedy” is a discourse on an interesting puzzle about human psychology, namely the fact that unpleasant elements can be either strengths or ruinous defects. “Of Tragedy” says nothing about moralism and art.
