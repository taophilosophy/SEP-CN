      休谟告诉我们，《论趣味的标准》是在仓促中写成的，只是为了允许其它论文的出版而存在（HL 2, 253）。在菲利普·斯坦霍普（Philip Stanhope）的建议下，休谟从一部计划中的新论文集里删除了《论灵魂不朽》与《论自杀》。他的出版人告诉他，由此而成的集子太薄，无法印刷、装订与销售。于是休谟通过撰写一篇新论文《论趣味的标准》，把书带到可接受的篇幅。在随后的二十年与多个版本中，休谟作了近两百处编辑性修改，其中大多数涉及标点。他从未改变其论证。这篇论文是他对“批评”任何主题的最后言论。除了作为休谟观点之阐述的重要性之外，康德阅读了这篇论文的译本，而它之于康德的成熟美学理论，正如同休谟关于因果的说明之于《纯粹理性批判》。关于他们对立立场的简洁分析，由库伦坎普夫（Kulenkampff，1990）、萨维尔（Savile，1993, pp. 81–84）与科斯特洛（Costelloe，2007, pp. 45–52）提供。
