      在一个支持艺术自主性的后康德传统之后，许多读者对休谟强力支持道德判断对审美评价的相关性感到迟疑（SOT, 283–84）。休谟讨论了几部戏剧（SOT, 284）以及《古兰经》——被视为一部文学“作品”——的道德缺陷（SOT, 267）。休谟如何能调和这一立场与他支持巴托之有影响的论题：机械艺术与美术的区别在于后者只为提供愉悦而存在？（《论悲剧》的行进方式，仿佛文学只为提供经验的愉悦而存在。）但休谟也有拒绝区分文学与其他“实用性”写作的一面。每一件艺术作品都依其独特目的来评价，唯有诗歌被单独挑出以“愉悦”想象为目的（SOT, 277）。归根结底，几乎没有多少艺术会被休谟当作“为艺术而艺术”来对待。
