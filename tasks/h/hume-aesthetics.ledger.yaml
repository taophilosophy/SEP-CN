      Hume’s views on the aesthetic relevance of form and utility are explored by Carolyn Korsmeyer (1976), while utility is emphasized by Taylor (2011). Given Hume’s debt to Hutcheson, Korsmeyer notes that it is tempting to read such passages as foreshadowing the subsequent theory of aesthetic response as “disinterested” pleasure. However, we should be careful here. Hume uses the term “disinterest” as the contrary of “self-love” (EPM, 296), but he does not use the term in relation to aesthetic sentiment. Hume’s “common,” “universal,” or “general view of things” is a simpler proposal. He wants to remind us that we cannot expect the agreement of others if we judge things from a limited and prejudiced perspective (EPM, 272).
    step1: |-
      休谟关于形式与效用的审美相关性的观点由卡罗琳·科尔斯梅耶（Carolyn Korsmeyer，1976）探讨，而效用由泰勒（Taylor，2011）强调。鉴于休谟对哈奇森的欠负，科尔斯梅耶指出，把这些段落解读为预示后来把审美反应视为“无利害”愉悦的理论是很诱人的。然而，我们在此应当谨慎。休谟把“无利害”（disinterest）用作“自爱”（self-love）的反面（EPM, 296），但他并不把该术语用于审美情感。休谟的“共同的”、“普遍的”或“事物的普遍观点”是一个更简单的提议。他想提醒我们：如果我们从一种有限而有偏见的视角来判断事物，就不能期望他人的赞同（EPM, 272）。
