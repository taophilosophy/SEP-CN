      Hume defends the centrality of sentiment with the following reasoning. Recognitions of virtue and beauty require particular sentiments in human observers. If the discriminations of taste took place without these sentiments, we would lack any motivation to do what we regard as moral. Moral and aesthetic judgments have practical consequences that mere reason lacks. So taste differs from the assent that characterizes understanding or reason (T, 458; EPM, 172; S, 219). Although taste responds to real qualities of objects, we cannot replace the exercise of taste with the assent of reason. In many cases, beauty and gracefulness (both aesthetic and moral) are inexplicable; they resist our efforts at explication, and we must trust the “sure testimony of taste and sentiment” (EPM, 267).
    step1: |-
      休谟以如下推理为情感的中心地位辩护。对德性与美的认识要求人类观察者具有特定的情感。如果趣味的辨别在没有这些情感的情况下发生，我们就会缺乏任何动机去作我们视为道德的事情。道德与审美判断具有单纯理性所缺乏的实践后果。因此，趣味不同于刻画理解或理性的赞同（T, 458; EPM, 172; S, 219）。尽管趣味回应对象的真实性质，我们却不能以理性的赞同取代趣味的运用。在许多情形中，美与优雅（无论是审美的还是道德的）是不可解释的；它们抵抗我们解释的努力，我们必须信任“趣味与情感的可靠见证”（EPM, 267）。
