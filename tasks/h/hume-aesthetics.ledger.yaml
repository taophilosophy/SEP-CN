      Perhaps Hume thinks that shocking spectacle satisfies vulgar taste but not refined taste. “Of the Standard of Taste” posits differences in audience members to account for different responses. Hume’s sketchy theory in “Of Tragedy” is compatible with most people enjoying aesthetically uninteresting works, for routine design readily delights most people (SOT, 276). But a refined taste is equally sensitive to all facets of the work, including formal design. Just as the wine tasted funny to Sancho’s kinsmen (SOT, 272–73), a run-of-the-mill work “gives pain” to true critics (SOT, 276). Only the best critics worry about the absence of genius.
