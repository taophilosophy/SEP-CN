      那么，什么标签最能概括休谟关于道德趣味与审美趣味的理论？也许指出哪些标签不适合他的理论，比给他贴上一个标签更容易。他拒斥规范实在论。（关于休谟在事实问题上是否是实在论者，存在相当大的争议。把这一问题搁置一旁，他明确否认规范判断具有与事实问题同样的客观性程度。）休谟同样极力否认理性为趣味判断提供了充分的基础。那么他是主观主义者吗？如果主观主义意味着此类判断是任意的，那就不是。他不是相对主义者，因为论趣味的论文的要旨在于：有些趣味判断优于另一些。就他自己的术语而言，他也不是关于审美属性与价值判断的怀疑论者。尽管他的哲学观点是美不是事物的真实属性，休谟却从不质疑作出审美判断这一普遍做法的意义。因为趣味的裁决是情感，缺乏真值，所以没有机会出现引发哲学怀疑论的理性的冲突与失败。
