      After several stabs at identifying the standard of taste, Hume identifies it as the consensus or “joint verdict” of “true critics” (SOT, 278–79). However, such critics are “rare” (SOT, 280) and “few are qualified to give judgment on any work of art” (SOT, 278). Consequently, it is not the verdict of contemporary critics that constitutes the standard, but rather the consensus of qualified judges over time and from multiple cultures (SOT, 271; SOT, 280). The importance of the so-called “test of time” is emphasized by Savile (1982) and Levinson (2002). Either way, the proposal has been criticized on the grounds that it posits a viciously circular analysis of aesthetic value: aesthetically superior artworks are those endorsed by true critics, but true critics are identified by their endorsement of the best art. Where earlier commentators tend to see circularity, as with Brown (1938) and Noxon (1961), more recent interpretations follow Kivy (1967) and see a regress problem. Circularity is avoided by identifying good critics who satisfy the five criteria, but this generates new evaluative questions, for we must determine if their responses are sufficiently delicate, grounded in the right comparisons, and so on. For further discussion, see Carroll (1984, pp. 189–191), Gracyk (1994, pp. 175–177), and Baceski (2013). Based on these problems, some readings of the essay reject the joint verdict of critics as Hume’s standard. For example, Costelloe (2007, pp. 2–14) argues that the “general rules of art” are his actual standard.
    step1: |-
      在几次尝试识别趣味标准之后，休谟把它识别为“真正批评家”的共识或“共同裁决”（SOT, 278–79）。然而，这类批评家是“罕见的”（SOT, 280），而且“很少有人有资格对任何艺术作品作出判断”（SOT, 278）。因此，构成标准的不是当代批评家的裁决，而是合格判断者随时间推移与来自多种文化的共识（SOT, 271; SOT, 280）。所谓“时间的检验”的重要性由萨维尔（Savile，1982）与莱文森（Levinson，2002）强调。无论哪种方式，这一提议都受到批评，理由是其设定了一种恶性循环的审美价值分析：审美上优越的艺术作品是那些被真正批评家所赞同的，但真正批评家是通过他们对最佳艺术的赞同而被识别的。早期评论者往往看到循环性，如布朗（Brown，1938）与诺克森（Noxon，1961），而更近的解读遵循基维（Kivy，1967），看到一种回溯问题。循环性通过识别满足五条标准的好批评家而避免，但这产生新的评价问题，因为我们必须确定他们的反应是否足够细腻、是否基于正确的比较，等等。进一步讨论，见卡罗尔（Carroll，1984, pp. 189–191）、格拉西克（Gracyk，1994, pp. 175–177）与巴切斯基（Baceski，2013）。基于这些问题，对这篇论文的一些解读拒绝把批评家的共同裁决视为休谟的标准。例如，科斯特洛（Costelloe，2007, pp. 2–14）论证“艺术的一般规则”才是他实际的标准。
