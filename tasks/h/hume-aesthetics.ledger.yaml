      Hume highlights only two sources that contribute to “blameless,” differences of sentiment among qualified critics: basic dispositions of character, and moral differences arising from cultural differences (SOT, 280). Today, we are more likely to notice a third source of disagreement, Hume’s recognition that different objects reflect distinct species of beauty. Becoming a qualified judge of epic poetry does not contribute to being a qualified judge of architecture. Addison is a better writer than John Locke, but the comparison assumes that they are both writing philosophy (EHU, 7). We can compare John Milton and John Ogilby, and only a false critic would rank Ogilby above Milton (SOT, 269). But it makes no sense to compare Milton and Addison, for Milton is a poet, not a philosopher.
    step1: |-
      休谟只强调两种促成合格批评家之间“无可指责的”情感差异的来源：基本品格倾向，以及由文化差异产生的道德差异（SOT, 280）。今天，我们更可能注意到第三种分歧来源，即休谟承认不同对象反映不同种类的美。成为史诗的合格判断者并不有助于成为建筑的合格判断者。艾迪生是比约翰·洛克更好的作家，但这一比较假定两人都在写哲学（EHU, 7）。我们可以比较约翰·弥尔顿与约翰·奥格尔比（John Ogilby），而只有虚假的批评家才会把奥格尔比排在弥尔顿之上（SOT, 269）。但比较弥尔顿与艾迪生毫无意义，因为弥尔顿是诗人，不是哲学家。
