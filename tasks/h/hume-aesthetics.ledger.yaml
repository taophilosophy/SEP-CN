      Hume’s acknowledgment of regular, predictable causes of the moral and aesthetic sentiment is sometimes taken as an indication that Hume is not a genuine subjectivist. On this reading, he equates beauty and virtue with dispositional properties of external objects. Attributions of moral and aesthetic properties to objects indicate a speaker’s acknowledgment of the object’s tendency to produce the sentiment. There are passages that suggest such a reading: “beauty is such an order and constitution of parts, as … is fitted to give a pleasure and satisfaction to the soul” (T, 299; see SOT, 273). The dispositional analysis of beauty is attributed to Hume by Savile (1982, p. 161), Mothersill (1984, pp. 205–206), and Levinson (2002). Reasons to think it is mistaken are provided by Baxter (1990). The dispositional analysis should not be confused with the position that features of objects cause the requisite sentiment. The case for attributing a causal theory of taste to Hume is provided by Shiner (1996)
    step1: |-
      休谟承认道德与审美情感的有规律的、可预测的原因，有时被视为休谟不是真正主观主义者的标志。按这一解读，他把美与德性等同于外部对象的倾向性属性。把道德与审美属性归于对象，表明说话者承认对象产生该情感的倾向。有些段落提示这种解读：“美是这样一种部分的有序与构造，如同……适合于给心灵以愉悦与满足”（T, 299；亦见 SOT, 273）。美的倾向性分析被萨维尔（Savile，1982, p. 161）、马瑟希尔（Mothersill，1984, pp. 205–206）与莱文森（Levinson，2002）归于休谟。认为它错误的理由由巴克斯特（Baxter，1990）提供。倾向性分析不应与对象的特征引起所需情感这一立场相混淆。把一种趣味的因果理论归于休谟的论证由夏纳（Shiner，1996）提供。
