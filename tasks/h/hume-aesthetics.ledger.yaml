      Furthermore, if Hume regards beauty as a dispositional property, he has a model close at hand in Hutcheson’s analysis. But Hume avoids offering any such account. Aside from a willingness to identify several ways that works of art must fail to please refined taste, Hume does very little to advance the traditional and familiar project of criticism, the stipulation of rules for successful art. Granted, he endorses the existence of such rules (SOT, 269–273) and provisionally suggests (SOT, 273) that they serve as our standard of taste, a point explored by Brown (1938), Jones (1976, 2009), Shelley (1994), and Costelloe (2007, pp. 3–17). However, he does not provide an organized or dedicated presentation of the properties of objects that regularly cause the sentiment of approbation. Costelloe (2018, pp. 161–170) has nonetheless extracted three such principles from Hume’s discussions of poetry. First, artistic depictions must be grounded in what is familiar or, at the very least, plausible. Second, artworks must be constrained by coherence in their imaginative associations. Third, simplicity is preferable to “excessive ornamentation and artifice” (Costelloe 2018, 167)[^costelloe-2018]. At the same time, Hume recognizes that any established correlation between sentiment and objective properties might be defeated by the next example that we encounter (SOT, 270). Despite the existence of “general principles of approbation or blame,” taste depends on too many variables (“incidents and situations”) to offer a detailed dispositional analysis (SOT, 271).
    step1: |-
      此外，如果休谟把美视为一种倾向性属性，他手边就有哈奇森分析中的一个模型。但休谟避免提供任何此类说明。除了愿意指出艺术作品必须不能满足精致趣味的几种方式之外，休谟很少推进传统的、熟悉的批评事业，即对成功艺术规定规则。诚然，他赞同此类规则的存在（SOT, 269–273），并暂定地建议（SOT, 273）它们充当我们的趣味标准，这一点由布朗（Brown，1938）、琼斯（Jones，1976, 2009）、谢利（Shelley，1994）与科斯特洛（Costelloe，2007, pp. 3–17）探讨。然而，他没有对有规律地引起赞许情感的对象属性提供有组织的或专门的呈现。科斯特洛（Costelloe，2018, pp. 161–170）仍从休谟关于诗歌的讨论中提取出三条此类原则。第一，艺术描绘必须基于熟悉的东西，或至少是可信的东西。第二，艺术作品必须受其想象性联想之融贯性的约束。第三，简单优于“过度的装饰与技巧”（Costelloe 2018, 167）[^costelloe-2018]。与此同时，休谟承认，情感与客观属性之间任何既定的相关性都可能被我们遇到的下一例证所击败（SOT, 270）。尽管存在“赞许或责备的一般原则”，趣味却依赖太多变量（“事件与情境”）以致无法提供详细的倾向性分析（SOT, 271）。
