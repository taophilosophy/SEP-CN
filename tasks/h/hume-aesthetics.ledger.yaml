      However, Hume’s claim that most judgments of beauty require some element of sympathy (T, 363) becomes harder to maintain in cases of fine art. It is not clear how the appreciation of a sonnet or melody involves an idea of the value it has for others. Hume occasionally talks as if artistic beauty is entirely a question of formal design. And he seems to think that the utility and therefore value of some art is the pleasure it affords (e.g., with poetry), as if he advocates an early art-for-art’s-sake position. This interpretation is an obvious consequence of any interpretation that takes Hume to say that an object’s capacity to provide pleasure exhausts its aesthetic value. (This reading is endorsed by Levinson (2002) and challenged by Shelley (2011, 2013.) But the fact that a poem pleases someone else, or even large numbers of people, does not encourage sympathetic approbation for the poem.
