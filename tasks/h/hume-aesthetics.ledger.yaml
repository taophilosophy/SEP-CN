      Within this framework of concerns and influences, Hume is neither interested in working out a theory of art (in contributing to philosophy of art) nor in analyzing aesthetic properties (in doing aesthetics). Although he is aware of debates about the nature of the sublime and recognizes it as a category of artistic achievement (SOT, 281), he offers no theory of the sublime. An attempt to pull together a Humean account is made by Hipple (1967, pp. 42–44). Due to the seamless connection Hume posits between moral and aesthetic value, much of his technical discussion of aesthetics appears only as an illustration of his moral theory. Other details of Hume’s aesthetics emerge in contexts where he expounds his theory of imaginative association (EHUa, 102–7), elaborates on the value of delicacy of taste (DOT), and denies that his appeal to sentiment leads to skepticism about value distinctions (S, 217–19). Consequently, a reading that emphasizes “Of the Standard of Taste” at the expense of the *Treatise* and *Enquiries* shortchanges the theory’s complexity.
    step1: |-
      在这一关切与影响的框架内，休谟既不致力于构建一种艺术理论（为艺术哲学作贡献），也不致力于分析审美属性（从事美学）。虽然他知晓关于崇高之本性的争论，并承认崇高是艺术成就的一个范畴（SOT, 281），但他并未提出崇高的理论。Hipple（1967, pp. 42–44）曾尝试汇集一种休谟式的说明。由于休谟设定道德价值与审美价值之间有无缝的联系，他对美学的许多专门讨论只是作为其道德理论的例证出现。休谟美学的其他细节出现于他阐述想象联想理论（EHUa, 102–7）、详论趣味精致的价值（DOT）、否认其诉诸情感导致价值区分怀疑论的语境中（S, 217–19）。因此，那种强调《论趣味的标准》而牺牲《人性论》与《论文集》的读法，低估了这一理论的复杂性。
    step2: |-
      在这一关切与影响的框架之内，休谟既无意构建一种艺术理论（为艺术哲学添砖加瓦），也无意分析审美属性（从事美学研究）。虽然他了解关于崇高之本性的种种争论，也承认崇高是艺术成就的一个范畴（SOT, 281），但他并未提出任何崇高理论。Hipple（1967, pp. 42–44）曾尝试把一种休谟式的说明汇集起来。由于休谟认为道德价值与审美价值之间有着天衣无缝的联系，他关于美学的许多专门讨论只是作为其道德理论的例证出现。休谟美学的另一些细节，则出现于他阐述想象联想理论（EHUa, 102–7）、详论趣味精致之价值（DOT）、并否认诉诸情感会导致价值区分上的怀疑论（S, 217–19）等语境之中。因此，凡只强调《论趣味的标准》而忽视《人性论》与《人类理解研究》的读法，都低估了这一理论的复杂性。
