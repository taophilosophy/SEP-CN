      诚然，休谟有许多其他影响。他汲取古典资源，包括西塞罗（Cicero）。他著名的论趣味的论文大量吸取法国思想，尤其是让-巴蒂斯特·杜博斯神甫（Abbé Jean-Baptiste Dubos）的思想（1748）。（见下文第 4 节。）论悲剧的论文亦然。（见下文第 5 节。）关于休谟受杜博斯影响的详细说明，见琼斯（Jones，2009）与汤森（Townsend，2011, pp. 76–85）。
