      Granted, Hume has many other influences. He drew on classical sources, including Cicero. His celebrated essay on taste draws heavily on French thought, particularly on that of the Abbé Jean-Baptiste Dubos(1748). (See Section 4 below.) So does the essay on tragedy. (See Section 5 below.) Detailed accounts of Hume’s debt to Dubos are provided in Jones (2009) and Townsend (2011, pp. 76–85).
