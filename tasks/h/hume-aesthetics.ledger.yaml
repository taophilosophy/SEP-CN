      Hume’s concept of criticism is not interchangeable with either aesthetics or philosophy of art. These now-familiar labels were not available to Hume when he published his *Treatise* in 1739 and 1740. The Abbé Charles Batteux did not defend the idea of grouping the arts together in an investigation of fine art until 1746. However, Hume knew and drew from the French tradition leading to Batteux’s work. Under this general influence, his essays occasionally refer to the “finer arts” of painting, music, sculpture, and poetry (CL, 158; SOT 278; OT, 264; C, 289). There is no direct evidence that Hume read Batteux, but they agree in identifying the fine arts as mimetic “arts of luxury” that exist primarily for the sake of our enjoyment (C, 289). Although contemporaries such as Alexander Gerard and Lord Kames (Henry Home) both use the phrase “fine art,” Hume’s books and letters never use that expression. Hume was probably not aware of Alexander Baumgarten’s *Reflections on Poetry* of 1735, the work that introduced the term “aesthetics.” The thesis that aesthetic judgments are completely distinct from moral judgments would not receive its modern formulation until Immanuel Kant’s *Critique of Judgment* (1790), after Hume’s death in 1776. So Hume’s reflections on aesthetics occupy a pivotal niche between the appearance of fine art theory and Kant’s defense of an independent aesthetic judgment in the *Critique of Judgment* – a defense clearly influenced by Kant’s reading of Hume’s essays and *An Enquiry Concerning the Principles of Morals*.
    step1: |-
      休谟的批评（criticism）概念既不能与美学互换，也不能与艺术哲学互换。这些如今熟悉的标签在休谟于 1739 与 1740 年出版《人性论》时尚未出现。夏尔·巴托神甫（Abbé Charles Batteux）直到 1746 年才为将诸艺术归入一项美的艺术（fine art）研究的主张辩护。然而，休谟了解并汲取了通向巴托著作的法国传统。在这一总的影响下，他的论文偶尔提到绘画、音乐、雕塑与诗歌这些“更精细的艺术”（CL, 158; SOT 278; OT, 264; C, 289）。没有直接证据表明休谟读过巴托，但他们都认同将美的艺术界定为摹仿性的“奢侈艺术”，这些艺术主要为我们的愉悦而存在（C, 289）。尽管亚历山大·杰拉德（Alexander Gerard）与凯姆斯勋爵（Lord Kames，亨利·霍姆，Henry Home）这样的同时代人都使用“美的艺术”这一短语，休谟的著作与书信却从未使用该表述。休谟可能并不知道亚历山大·鲍姆嘉通（Alexander Baumgarten）1735 年的《关于诗的沉思》（*Reflections on Poetry*），正是这部著作引入了“美学”（aesthetics）一词。审美判断与道德判断完全不同的论题，直到伊曼努尔·康德（Immanuel Kant）的《判断力批判》（1790）才获得其现代表述，而那时休谟已于 1776 年去世。因此，休谟关于美学的思考，在美的艺术理论出现与康德在《判断力批判》中对独立审美判断的辩护之间，占据着一个关键的中间位置——这一辩护显然受到康德阅读休谟论文与《道德原理探究》（*An Enquiry Concerning the Principles of Morals*）的影响。
