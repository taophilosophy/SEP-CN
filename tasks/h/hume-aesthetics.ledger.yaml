      虽然并排发表，《论悲剧》与《论趣味的标准》可能提供相互冲突的学说。在论趣味的文章中，恶行不受挑战地出现被视为缺陷，不快情感是一种不足。但当《论悲剧》在尼古拉斯·罗的《雄心勃勃的继母》中识别出一个缺陷时，该剧的不足并非对恶行的赞许。相反，其缺陷是上演“过于血腥残忍”的行动（OT, 264）。但为何“骇人”的场面是导致普遍非难的缺陷？这仅仅是骇人程度的问题吗？但为何那会阻止观众把骇人“转化”为“相反”而愉悦的经验，如休谟声称恐怖与焦虑所发生的那样？障碍似乎并非道德性质，不属于《论趣味的标准》所探讨的那类——休谟在其中讨论作品未能对恶行引导适当的非难。论趣味的文章表明，如果作出恰当调整，同样的内容便不是缺陷。但《论悲剧》并未提请注意罗之剧作的道德维度。所以，《论悲剧》是关于人类心理学一个有趣谜题的论说，即不快要素可以是优点，也可以是毁灭性缺陷这一事实。《论悲剧》对道德主义与艺术不置一词。
