      It is tempting to read Hume’s argument as a move away from his signature subjectivism and toward some brand of normative realism. But a careful reading of the text reveals that nothing is said to deny his earlier support for subjectivism and there are no direct endorsements of realism. The standard of taste should provide rules for “confirming one sentiment, and condemning another” (SOT, 268). On this topic, see Brown (1938), Jones (1976, 1984), Shelley (1994), and Costelloe (2007, pp. 3–17). However, the standard is normative: it must explain why the sentiments of some critics are better and worse. It does not follow that sentiments are true and false in any absolute sense. These reflections lead Hume to postulate five criteria for identifying good or “true” critics: “Strong sense, united to delicate sentiment, improved by practice, perfected by comparison, and cleared of all prejudice, can alone entitle critics to this valuable character” (SOT, 278).
    step1: |-
      把休谟的论证解读为从其标志性的主观主义转向某种规范实在论是很诱人的。但仔细阅读文本会发现，没有任何东西否认他早期对主观主义的支持，也没有对实在论的直接赞同。趣味的标准应提供“肯定一种情感、谴责另一种情感”的规则（SOT, 268）。关于这一主题，见布朗（Brown，1938）、琼斯（Jones，1976, 1984）、谢利（Shelley，1994）与科斯特洛（Costelloe，2007, pp. 3–17）。然而，这一标准是规范的：它必须解释为什么一些批评家的情感更好或更坏。这并不意味着情感在任何绝对意义上是真或假的。这些反思使休谟提出识别好的或“真正的”批评家的五条标准：“强健的理解，与细腻的情感结合，经实践改进，经比较完善，并清除一切偏见，才能独自使批评家配得上这一宝贵品格”（SOT, 278）。
