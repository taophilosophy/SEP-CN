      《论悲剧》所处理的问题集与《论趣味的标准》大不相同。《论悲剧》的动因问题是不快情感作为作品的积极特征。休谟提议解释“一部写得好的悲剧”何以令人愉悦，而那种愉悦似乎依赖于“悲伤、恐怖、焦虑”及其他自然令人不快的情感（OT, 258）。休谟此前在《人性论》中处理过这一主题，其中他对悲剧愉悦的说明诉诸怜悯与同情（T, 369）。《论悲剧》以一种关于与我们消极情感相关的心理运作的复杂提议取代了早先的说明。
