      Although Hume illustrates his general principle with numerous examples, few of his contemporaries or modern interpreters endorse his theory. A rare exception is Galgut (2001). Famously, the theory faces multiple objections. It offers no working definition of tragedy and its examples are not, for the most part, genuine tragedies, points noted by Neill (1999). The details of Hume’s examples raise further issues. For example, Hume thinks it is obvious that Rowe’s play fails due to its gory and shocking spectacle, which tips the balance in the wrong direction. But the obvious reply is that many viewers enjoy the spectacle of violence. Hume basically says so: “The English theatre abounds too much with such shocking images” (OT, 265). How can Hume contend that the play is ruined when so many viewers enjoy it? For there is no appeal except to sentiment.
    step1: |-
      虽然休谟用大量例子说明其一般原理，但他的同时代人或现代解释者很少支持其理论。罕见的例外是 Galgut（2001）。众所周知，该理论面临多重反对。它没有可用的悲剧定义，其例子大多并非真正的悲剧——尼尔（1999）指出了这一点。休谟例子的细节引出更多问题。例如，休谟认为显然罗的剧作因血腥骇人的场面而失败，那些场面把平衡推向错误的方向。但明显的回应是：许多观众喜欢暴力场面。休谟基本上也这样说：“英国剧院充斥着太多这类骇人形象”（OT, 265）。当如此多的观众乐在其中时，休谟如何能主张该剧被毁？因为除了诉诸情感，别无他途。
