      Hume’s account of tragic pleasure has two components. First, different features of the work must generate the viewer’s agreeable and disagreeable responses. Disagreeable aspects contribute to our general approbation because those properties are balanced by naturally agreeable properties. Second, a general psychological principle explains how it is possible for competing emotions to produce a complex, pleasing sentiment. Borrowed from the *Treatise* (T, 419), that principle holds that when the same object produces different passions, even those “of a contrary nature,” then the subordinate passion can be “converted” into the predominant (OT, 262). “Of Tragedy” combines these two ideas. Our natural delight in “imitation” provides a strong and predominant passion. The naturally disagreeable emotions aroused by the plot provide a subordinate and contrary emotion, the “movement” of which “fortifies” the predominant passion. Unless the negative emotion becomes predominant, the overall effect of a well-written tragedy will be an audience “pleased in proportion as they are afflicted” (OT 258). The details of Hume’s theory are explored by Cohen (1962), Budd (1991), Neill (1992, 1999), and Dadlez (2004, 2016).
    step1: |-
      休谟对悲剧愉悦的说明有两个组成部分。第一，作品的不同特征必须产生观看者愉快与不快的反应。不快的方面有助于我们一般的赞许，因为那些性质被自然愉快的性质所平衡。第二，一个一般心理学原理解释相互竞争的情感何以可能产生复杂而令人愉悦的情感。该原理借自《人性论》（T, 419）：当同一对象产生不同激情，甚至“本性相反”的激情时，从属的激情可以“转化”为占主导的激情（OT, 262）。《论悲剧》结合这两个观念。我们对“模仿”的自然喜爱提供一种强烈而占主导的激情。情节唤起的自然不快的情感提供一种从属而相反的情感，其“运动”“加固”占主导的激情。除非消极情感成为主导，否则写得好的悲剧的总体效果将是“其痛苦与其快乐成比例”的观众（OT 258）。科恩（Cohen，1962）、巴德（Budd，1991）、尼尔（Neill，1992, 1999）与达德莱兹（Dadlez，2004, 2016）探讨了休谟理论的细节。
