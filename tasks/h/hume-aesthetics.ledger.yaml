      Having argued that we can overcome prejudice and make superior assessments of ordinary matters of fact, Hume imports his contrast of vulgarity and wisdom into his aesthetic theory. Sound understanding makes inferences and arrives at a belief. Beliefs influence taste. Although a judgment of taste terminates in a reflective passion, rather than in a belief with a truth-value, taste employs operations of the imagination subject to rules internalized by the judging subject. Consequently, the contrast between first and second influences of general rules applies as much to taste as to “wisdom.” Vulgar taste should betray the same degree of capriciousness and prejudice as vulgar reasoning. Good taste, in contrast, should be more stable, for it will display “a certain point of view” appropriate to its object (SOT, 276). Refined taste reflects what Hume elsewhere calls the “more general” view. As with moral response, good taste meets with approbation while a prejudiced taste “loses all credit and authority” (SOT, 277). However, as a matter of interpretation, Hume’s references to a requisite “*delicacy* of imagination” (SOT, 272) complicate and obscure the account, for it is not clear what this delicacy is, nor how it contributes to a more settled, general view. Recent explorations of this problem include Townsend (2001, pp. 204–206), and Gracyk (2011).
    step1: |-
      在论证我们可以克服偏见、对日常事实作出优越评估之后，休谟把其粗俗与智慧的对照引入美学理论。健全知性作出推理并达到信念。信念影响趣味。虽然趣味判断终结于一种反思性激情而非有真值的信念，趣味运用被判断主体内化的规则所支配的想象运作。因此，一般规则最初与第二次影响之间的对照，既适用于“智慧”也适用于趣味。粗俗趣味应显示出与粗俗推理同样程度的反复无常与偏见。相反，良好趣味应更稳定，因为它将显示与其对象相称的“某种观点”（SOT, 276）。精致趣味反映了休谟在他处所称的“更一般”观点。与道德反应一样，良好趣味获得赞许，而怀有偏见的趣味则“丧失全部信誉与权威”（SOT, 277）。然而，就解释而言，休谟对必需的“想象的精致”（SOT, 272）的提及使这一说明复杂化并含混不清，因为不清楚这种精致是什么，也不清楚它如何有助于更稳定、更一般的观点。对该问题的晚近探讨包括 Townsend（2001, pp. 204–206）与 Gracyk（2011）。
    step2: |-
      休谟既已论证我们可以克服偏见、对日常事实作出更优的评估，便把他关于粗俗与智慧的对照移入美学理论。健全的知性进行推理并形成信念，而信念影响趣味。趣味判断虽然终结于一种反思性的激情，而非终结于带有真值的信念，但趣味所运用的想象运作，同样服从判断主体业已内化的规则。因此，一般规则的最初影响与第二次影响之间的对照，适用于趣味，一如其适用于“智慧”。粗俗趣味应当显出与粗俗推理同等程度的反复无常与偏见；相比之下，良好趣味应当更为稳定，因为它会显示出与其对象相称的“某种观点”（SOT, 276）。精致趣味所反映的，正是休谟在别处所说的“更普遍”观点。与道德反应一样，良好趣味会赢得赞许，而怀有偏见的趣味则“丧失一切信誉与权威”（SOT, 277）。然而，就解释而言，休谟对必要的“想象的精致”（delicacy of imagination，SOT, 272）的提及，使这一说明变得复杂而含混：这种“精致”究竟是什么，它又如何促成一种更稳定、更普遍的观点，都不清楚。对该问题的晚近探讨，见 Townsend（2001, pp. 204–206）与 Gracyk（2011）。
