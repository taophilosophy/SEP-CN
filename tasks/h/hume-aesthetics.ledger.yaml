      Hume’s eighteenth-century terminology includes a pair of terms no longer in general use. In his basic nomenclature, “taste in morals, eloquence, or beauty” assigns either “approbation” or “disapprobation” (or some combination of both) to objects of taste (T, 547n). Approbation is “a peculiar delight” (T, 298) and a “*particular* kind of pleasure” (T, 472). It feels different from other pleasures. He variously characterizes approbation as a feeling of approval, liking, or affection. A beautiful object or action strikes us as amiable, agreeable, and desirable. Yet moral and aesthetic responses are not identical, for “the satisfaction is different, [which] keeps our sentiments concerning them from being confounded” (T, 472). Hume describes the feeling of disapprobation as one of disapproving, disliking, and contempt. An ugly object or vicious action feels odious, disagreeable, and undesirable.
    step1: |-
      休谟的十八世纪术语包括一对不再通用的术语。在他的基本命名法中，“道德、雄辩或美的趣味”把“赞许”或“不赞许”（或两者的某种结合）归于趣味对象（T, 547n）。赞许是“一种特殊的愉悦”（T, 298）和一种“*particular* 的愉悦”（T, 472）。它与其它愉悦感觉不同。他以不同方式把赞许描述为一种赞同、喜爱或爱慕的情感。一个美的对象或行动使我们觉得可亲、可悦、可欲。然而，道德与审美的反应并不相同，因为“满足感不同，[这]使我们对它们的情感不致混淆”（T, 472）。休谟把不赞许的感受描述为一种不赞同、不喜欢与轻蔑。一个丑的对象或恶的行动使人觉得可憎、可厌、不可欲。
