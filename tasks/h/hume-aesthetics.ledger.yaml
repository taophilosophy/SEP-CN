      Beauty is a feeling of approbation, and an original, simple impression of the mind. Impressions are contrasted with ideas, which he alternatively calls “thoughts.” Ideas are “copies” of impressions, and seldom have the force or clarity of the experiences they copy. For Hume, experiencing a particular kind of approbation is a necessary condition for thinking about the idea of beauty. An individual cannot construct the idea of beauty out of other ideas, which is equivalent to saying that the idea derives from the proper sentiment of approbation (T, 469). In the complete absence of the operations of taste, thoughts about beauty would not occur.
