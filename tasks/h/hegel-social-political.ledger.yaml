      Hegel’s argument is clearer here. Desert grounds punishment: only the deserving can be liable to be punished. But it does not have a monopoly on the amount or form that punishment can take. This picture is consistent with Hegel’s comments in the *PR* where the outward existence of punishment may be different depending on circumstances. It should be unsurprising to find that Hegel, who repeatedly defends various groupings of three in his work would seek to combine retribution, deterrence and rehabilitation in a new format – taking common concepts in uncommon ways. This was not lost on his earliest interpreters in the UK, as British Idealists like Green, Bradley and others held similar three-in-one views on punishment and rejected traditional accounts of retributivism (Bradley 1894, Brooks 2003, 2011, Green 1986:138–59, Seth 1916:310–23)[^bradley-1894][^brooks-2003][^green-1986][^seth-1916]. This view has been called the “unified theory of punishment” (Brooks 2017a, 2021:143–79)[^brooks-2017a].
    step1: |-
      黑格尔的论证在这里更为清晰。该当为惩罚奠基：只有该当者才可能受罚。但该当并不垄断惩罚的量与形式。这幅图景与黑格尔在《法哲学》中的评论一致：惩罚的外部定在可以因情节而异。发现黑格尔——这位在其著作中反复捍卫各种“三分结构”的思想家——试图把报应、威慑与改造结合进一个新框架，以不寻常的方式处理常见概念，应当不足为奇。他最早的英国解释者也没有忽略这一点：格林、布拉德雷等英国唯心论者在惩罚问题上持类似的三位一体观点，并拒斥传统报应论（Bradley 1894，Brooks 2003, 2011，Green 1986:138–59，Seth 1916:310–23）[^bradley-1894][^brooks-2003][^green-1986][^seth-1916]。这一观点被称为“惩罚统一论”（Brooks 2017a, 2021:143–79）[^brooks-2017a]。
    step2: |-
      黑格尔的论证在这里更清楚。该当为惩罚奠基：只有该当者才可能受罚。但该当并不垄断惩罚的量与形式。这幅图景与黑格尔在《法哲学》中的评论一致：惩罚的外部定在可以随情节而异。黑格尔在书中反复捍卫各种“三分结构”；他要把报应、威慑、改造三者结合进一个新框架——拿寻常概念作不寻常的用法——这应当不足为奇。他最早的英国解释者也没有漏掉这一点：格林、布拉德雷等英国唯心论者在惩罚问题上持类似的三位一体观点，并拒斥传统报应论（Bradley 1894，Brooks 2003, 2011，Green 1986:138–59，Seth 1916:310–23）[^bradley-1894][^brooks-2003][^green-1986][^seth-1916]。这一观点被称作“惩罚统一论”（Brooks 2017a, 2021:143–79）[^brooks-2017a]。
