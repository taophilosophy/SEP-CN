      Hegel makes clear that a crime’s “danger to civil society is a determination of its magnitude” where circumstances impact how we determine whether to punish, how much to punish and what form this might take. He notes “a penal code is therefore primarily a product of its time and of the current condition of civil society” (*PR* §218 Remark). He adds that “punishments are not unjust in and for themselves, but are proportionate to the conditions of their time” (*PR* §218 Addition). So the same crime committed in different circumstances would be punished differently. For example, a crime committed during civil war poses a greater threat to civil society than when at peace – and so the former would see the crimes punished more harshly. There is no difference in the offender or her responsibility. While desert matters, it is not the only factor which does. Hegel’s position is different from traditional retribution accounts where proportionality of wrongdoing is found in what an offender deserves and not influenced by non-desert factors like the stability of civil society.
    step1: |-
      黑格尔明确指出：犯罪的“对市民社会的危险是其大小的一个规定”，情节会影响我们是否惩罚、惩罚多少以及采取何种形式。他指出“刑法典因此首先是其时代与市民社会当前状况的产物”（*PR* §218 附释）。他补充道：“惩罚就其自身而言并非不正义，而是与其时代的条件相称”（*PR* §218 补充）。因此，在不同情节下犯下的同一罪行，会得到不同的惩罚。例如，内战期间犯下的罪行对市民社会的威胁比和平时期更大——因此前者会受到更严厉的惩罚。罪犯本人或其责任并无不同。该当虽重要，却不是唯一因素。黑格尔的立场不同于传统的报应论：在那里，不当行为的相称性只在于罪犯所该当的东西，不受公民社会稳定之类非该当因素的影响。
    step2: |-
      黑格尔明说：犯罪的“对市民社会的危险”规定了其大小——情节影响我们是否惩罚、罚多少、以何种形式罚。他写道：“刑法典因此首先是其时代与市民社会当前状况的产物”（*PR* §218 附释）；又补充说：“惩罚就其自身而言并非不正义，而是与其时代的条件相称”（*PR* §218 补充）。因此，同一罪行在不同情节下会得到不同的惩罚。比如内战期间犯下的罪行，对市民社会的威胁比和平时期更大，所以惩罚更严厉。罪犯本人及其责任并无不同。该当固然要紧，却不是唯一的因素。这不同于传统报应论：在传统报应论那里，不当行为的相称性只取决于罪犯所该当的东西，不受市民社会稳定这类非该当因素的影响。
