      While virtually no commentator is convinced by Hegel’s justification of constitutional monarch, the orthodox view is that the monarch is a rubber stamp (Yack 1980)[^yack-1980]. Hegel remarks that “in a fully organized state … all that is required in a monarch is someone to say ‘yes’ and to dot the ‘I’; for the supreme office should be such that the particular character of its occupant is of no significance” (*PR* §280 Addition). Some have drawn comparisons with the UK’s constitutional monarchy, where laws require the Assent of Her Majesty The Queen but where this is automatically done when requested by Parliament for example (Findlay 1958).
    step1: |-
      虽然几乎没有评论者被黑格尔对立宪君主的辩护说服，但正统的看法是：君主不过是一枚橡皮图章（Yack 1980）[^yack-1980]。黑格尔评论说，“在一个完全组织好的国家中……对君主所要求的，只是一个说‘是’、并在‘我’上打点的人；因为最高职位应当是这样一种职位：任职者的个人特性无关紧要”（*PR* §280 补充）。有人把它与英国的立宪君主制作比较：法律需要女王陛下御准，而当议会提出请求时，御准会自动完成（Findlay 1958）。
    step2: |-
      几乎没有评论者被黑格尔对立宪君主的辩护说服；正统的看法是：君主不过是一枚橡皮图章（Yack 1980）[^yack-1980]。黑格尔自己评论道：“在一个完全组织好的国家中……对君主所要求的，只是一个说‘是’、并在‘我’上打点的人；最高职位应当是这样一种职位：任职者的个人特性无关紧要”（*PR* §280 补充）。有人拿英国的立宪君主制作类比：法律需要女王陛下御准；而当议会提出请求时，御准会自动完成（Findlay 1958）。
