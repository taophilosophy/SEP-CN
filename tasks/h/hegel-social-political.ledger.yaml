      These views have rightly been subjected to widespread criticism by feminists and others (Halper 2001, Hutchings and Pulkkinen 2010, Knowles 2002, Ravven 1988, Stone 2002)[^halper-2001][^hutchings-2010][^knowles-2002][^ravven-1988][^stone-2002]. A common argument is that Hegel’s justification of the Family is a poor defence of privileging men over women on the basis of his controversial dialectical method. Only men have the opportunity to engage outside the home in civil society and fully participate in the state. These critics claim that such a privilege should not be reserved for men alone for many, often obvious, reasons. It is also argued that his broad views about the essence of marriage as a permanent bond built on love can be achieved by non-traditional families, too. It is worth pointing out that Hegel’s talk of the Family is of an ideal. Hegel fathered a child outside of wedlock who he supported throughout his life. He sees himself as revealing the full development of right wherever it may take us, and what it requires from us or our institutions may be different from how we find them.
    step1: |-
      这些观点理所当然地受到女性主义者与其他人的广泛批评（Halper 2001，Hutchings and Pulkkinen 2010，Knowles 2002，Ravven 1988，Stone 2002）[^halper-2001][^hutchings-2010][^knowles-2002][^ravven-1988][^stone-2002]。一种常见论证是：黑格尔对家庭的辩护，是拿其有争议的辩证方法，为男尊女卑作拙劣辩护。只有男性才有机会在家庭之外的市民社会中活动，并充分参与国家。这些批评者声称，出于许多（往往显而易见的）理由，这种特权不该专属于男性。也有人提出，他关于婚姻本质的宽泛看法——一种建立在爱之上的持久纽带——非传统家庭同样可以实现。值得指出的是，黑格尔谈的是理想意义上的家庭。黑格尔婚前育有一子，终生供养他。他把自己看作在揭示法的充分展开——无论它把我们带向何处；而它对我们或我们的制度提出的要求，可能与我们的现状不同。
    step2: |-
      这些观点理所当然地受到女性主义者及其他论者的广泛批评（Halper 2001，Hutchings and Pulkkinen 2010，Knowles 2002，Ravven 1988，Stone 2002）[^halper-2001][^hutchings-2010][^knowles-2002][^ravven-1988][^stone-2002]。一种常见批评是：黑格尔借他那套有争议的辩证方法为家庭辩护，实际是为男尊女卑作蹩脚辩护。只有男性才有机会走出家门进入市民社会、充分参与国家。这些批评者指出，出于许多——往往显而易见的——理由，这种特权不该只留给男性。还有人提出：黑格尔把婚姻的本质说成以爱为基的持久纽带；其实非传统家庭同样能做到这一点。还要指出：黑格尔谈的是理想的家庭。黑格尔婚前育有一子，终生供养。他自认在揭示法的充分展开——无论它把我们带向何处；它对我们、对我们制度提出的要求，可能与我们的现状并不相同。
