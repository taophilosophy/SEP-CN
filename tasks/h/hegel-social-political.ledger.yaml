      He says: “the scope of the law [*Gesetz*] ought on the one hand to be that of a complete and self-contained whole, but on the other hand, there is a constant need for new legal determinations [*gesetzlicher* *Bestimmungen*]” (*PR* §216). Hegel is claiming the law aspires to be a complete whole and, where we find gaps or inconsistencies, our task is to work out how these can be addressed within the law as a self-contained whole in language echoing Ronald Dworkin’s (1977) use of legal principles a century later. Thus, Hegel looks to the law for the ethical principles that can be used to continually reform our legal system into the complete whole it aspires to be. This “natural law internalism” discerns its principles from within the law rather than from outside it (Brooks 2017b)[^brooks-2017b].
    step1: |-
      他说：“法律（*Gesetz*）的范围，一方面应当是完整而自足的整体，但另一方面，又不断需要新的法律决定（*gesetzlicher Bestimmungen*）”（*PR* §216）。黑格尔是在主张：法律追求成为完整的整体；一旦发现缺口或不一致，我们的任务就是在法律作为自足整体之内设法解决——其语言呼应了一个世纪后罗纳德·德沃金（1977）对法律原则的运用。因此，黑格尔指望从法律中找到那些伦理原则，以便持续改革我们的法律体系，使其成为它所追求的完整整体。这种“自然法内在主义”从法律内部辨识原则，而不是从外部（Brooks 2017b）[^brooks-2017b]。
    step2: |-
      他说：“法律（*Gesetz*）的范围，一方面应当是完整而自足的整体，另一方面又不断需要新的法律决定（*gesetzlicher Bestimmungen*）”（*PR* §216）。黑格尔这是在主张：法律以成为完整整体为目标；一旦发现缺口或不一致，我们的任务就是设法在作为自足整体的法律之内解决它们——其措辞呼应了一个世纪后罗纳德·德沃金（1977）对法律原则的运用。黑格尔由此指望从法律本身找到伦理原则，用来持续改革我们的法律体系，使它趋近它所追求的完整整体。这种“自然法内在主义”从法律内部辨识原则，而不是从外部（Brooks 2017b）[^brooks-2017b]。
