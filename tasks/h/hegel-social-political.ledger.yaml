      However, Hegel does foreshadow his later and more substantive discussion of punishment with a non-retributivist character at this point (Brooks 2017a)[^brooks-2017a]. He highlights how determinations of crimes “such as danger to public security” have relevance in determining what punishment is ultimately justified (*PR* §96 Remark). While he says crimes “more dangerous in itself” are a more serious infringement of right, Hegel is clear from the start that consequentialist factors are relevant to the determination of punishment related to crime’s impact on society although he says little more at this point (*PR* §96 Remark). Hegel also rejects the view he is offering a full theory of punishment at this point claiming – in the absence of laws and courtrooms – any action taken by an individual against another to punish takes the form of “revenge” which “becomes a new infringement” creating new problems (*PR* §102). It is important to note at this point that these sections discussing commonly used concepts like property and contract as well as crime and punishment in uncommon ways all reappear when Hegel turns his attention to the final part of Ethical Life.
    step1: |-
      然而，黑格尔在此确实预示了他后来关于惩罚的更实质、且带有非报应论性质的讨论（Brooks 2017a）[^brooks-2017a]。他强调，对犯罪的判定"诸如对公共安全的危险"在决定何种惩罚终究正当方面具有相关性（*PR* §96 附释）。尽管他说"自身更为危险"的犯罪是对法更严重的侵害，黑格尔从一开始就明确：后果论因素与惩罚的确定相关，涉及犯罪对社会的影响——尽管他在这一点上没再多说（*PR* §96 附释）。黑格尔也否认他此时提出的是完整的惩罚理论，他说：在没有法律与法庭的情况下，个人对他人采取的任何惩罚行动都采取"报复"的形式，而报复"变成一种新的侵害"，造成新问题（*PR* §102）。此处值得注意的是，这些以不寻常方式讨论常见概念（财产、契约，以及犯罪与惩罚）的章节，在黑格尔转向伦理生活最后一部分时都会重新出现。
