      The key point, for Hegel, is that only the free will of an individual can ground the free will of another (Stillman 1980)[^stillman-1980]. Something is mine when mutually recognized as my possession by another. This is the first appearance of right where the activity of my free will in taking possession is free, and not mere arbitrariness. It is this agreement between two individuals forming a kind of contract which is so important for Hegel. This is because mutual recognition becomes a vehicle for how we can develop further a more concrete understanding of freedom as right in the world. If such recognition was under threat, this would unsettle how we can ground our free will in a free will of another.
    step1: |-
      对黑格尔而言，关键点在于：只有个体的自由意志，才能为另一个人的自由意志奠基（Stillman 1980）[^stillman-1980]。某物之所以是我的，是因为另一个人相互承认它是我的占有物。这是法的第一次显现：我的自由意志在占有中的活动是自由的，而非纯粹的任意。正是这种两个个体之间形成某种契约的同意，对黑格尔来说如此重要。因为相互承认成为一种载体，使我们能够进一步发展对作为世界中之法的自由的更具体理解。如果这种承认受到威胁，我们将如何在一个人的自由意志中为另一个人的自由意志奠基，就会动摇。
    step2: |-
      对黑格尔来说，要害在于：只有个体的自由意志，才能为另一个人的自由意志奠定根据（Stillman 1980）[^stillman-1980]。某物之所以归我，是因为另一个人相互承认它是我的占有物。这就是法的最初显现：我以占有形式展开的自由意志活动是自由的，而不是纯粹的任意。黑格尔之所以看重两个个体之间形成某种契约的这一同意，是因为相互承认成了一条通道，使我们能够进一步获得"自由即世界中之法"的更具体理解。一旦这种承认受到威胁，我们借另一个人的自由意志为自己奠基这件事，也就随之动摇。
