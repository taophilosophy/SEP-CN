    source: |-
      One such debate concerned whether or not his views endorsed a dangerous conservativism, sometimes described as quietest or reactionary. His double-saying (*Doppelsatz*) in the Preface to the *Philosophy of Right* that “the rational is actual and actual is rational” was read by some as saying that the absolutist Prussia that Hegel lived under was somehow rational and so justified (Haym 1857)[^haym-1857]. Yet, the more detailed comments found in the main body of the *Philosophy of Right* consistently favour the aims of the Prussian Reform era which were opposed by the newly ascendant reactionaries after 1819 making it difficult to situate this work politically at that time.
    step1: |-
      其中一场争论关乎他的观点是否支持一种危险的保守主义——有时被描述为静默主义或反动的。他在《法哲学》序言中的双句（*Doppelsatz*）——"合理的是现实的，现实的也是合理的"——被一些人解读为：黑格尔所生活的普鲁士专制国家在某种意义上是理性的，因而正当（Haym 1857）[^haym-1857]。然而，《法哲学》正文中更详细的评论，一贯支持普鲁士改革时代的目标；1819 年之后，这一目标遭到新近得势的反动派的反对，使这部著作当时的政治定位变得困难。
    step2: |-
      其中一场争论是：黑格尔的立场是否支持一种危险的保守主义——有人称之为静默主义（quietist），有人称之为反动。他在《法哲学》序言里的"双句"（*Doppelsatz*）——"合理的是现实的，现实的也是合理的"——被一些人读作：黑格尔身处的普鲁士专制国家在某种意义上是合乎理性的，因而是正当的（Haym 1857）[^haym-1857]。然而，《法哲学》正文里更细致的评论却一贯支持普鲁士改革时代的诸目标；而 1819 年后，改革派的目标遭到新得势的反动派压制——这让这部著作在当时的政治归属变得难以判定。
