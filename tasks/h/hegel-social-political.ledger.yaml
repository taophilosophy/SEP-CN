      Hegel’s conception of the state’s composition is controversial. He seeks to unify the three traditional models of government – aristocracy, democracy and monarchy – under a new form of representative government with a constitutional monarch (Deranty 2001)[^deranty-2001]. Hegel proposes an Estates Assembly with the natural aristocracy of the agrarian class in one chamber and representatives from different trades in another. Hegel believed that representing a locality based on geography was arbitrary and lacking substance. He claimed a stronger ethical relation could be formed through representation of people through their work.
    step1: |-
      黑格尔对国家组成的构想引发争议。他力图把三种传统的政府模式——贵族制、民主制与君主制——统一在一种以立宪君主为首的新式代议政府之下（Deranty 2001）[^deranty-2001]。黑格尔提议设立等级议会：一院由农耕阶级的自然贵族组成，另一院由不同行业的代表组成。他认为按地理区域选代表是任意的、缺乏实质。他主张，经由劳动来代表人民，可以形成更强的伦理关系。
    step2: |-
      黑格尔对国家组成的构想颇有争议。他力图把三种传统政府模式——贵族制、民主制、君主制——统一进一种新式代议政府，由立宪君主领衔（Deranty 2001）[^deranty-2001]。他提议设一个等级议会：一院由农耕阶级的自然贵族组成，另一院由各行各业代表组成。他以为，按地理划区选代表是任意的、缺乏实质；经由劳动来代表人民，方能形成更强的伦理关系。
