    source: |-
      More recently, scholars have focused on a core contention between metaphysical and non-metaphysical readings about what relation, if any, Hegel’s *PR* has to his wider philosophical system. Most non-metaphysical readings interpret the *PR* independently of Hegel’s system whereas all metaphysical readings attempt to situate the *PR* within Hegel’s system. Viewing the debate from this perspective, the core contention is not about the place of metaphysics but the interpretive place of any work within the system.
    step1: |-
      近来，学者们关注形而上学与非形而上学两种解读之间的一个核心争点：黑格尔的 *PR* 与其更广哲学系统究竟处于何种关系（如果有关系的话）。大多数非形而上学解读把 *PR* 独立于黑格尔系统来解释，而所有形而上学解读都试图把 *PR* 安置在黑格尔系统之内。从这一视角看，争论的核心不是形而上学的地位，而是任何一部著作在系统中的解释学地位。
    step2: |-
      近来，学者把焦点转向形而上学与非形而上学解读之间的一个核心争点：黑格尔 *PR* 与更广哲学系统究竟处于何种关系（如果真有关系）。大多数非形而上学解读把 *PR* 当作独立于系统的文本来解释；所有形而上学解读则都力图把 *PR* 安放进黑格尔的系统。从这个角度看，争论的核心已不是形而上学有没有地位，而是任何一部著作在系统中应摆在哪里。
  - id: 16
    kind: body
    source: |-
      A non-systematic reading interprets Hegel’s *PR* explicitly separately from his wider system. This view has few adherents. It runs clearly against Hegel’s own self-understanding stated in the *PR*’s Preface where he says the *PR* “is a more extensive, and in particular a more systematic, exposition of the same basic concepts which, in relation to this part of philosophy, are already contained in a previous work designed to accompany my lectures, namely my *Encyclopaedia of the Philosophical Sciences*” (*PR*, p. 9). The *PR* is explicit that it serves as an elaboration of the section “Objective Spirit” within his philosophical system, and so a part of it.
    step1: |-
      非系统性解读把黑格尔的 *PR* 明确地与其更广系统分开解释。这种观点追随者很少。它显然违背黑格尔在《法哲学》序言中的自我理解；他在那里说，*PR*“是对同一批基本概念的更详尽、尤其更系统的阐述；就哲学的这一部分而言，这些概念已包含在此前一本为我讲课而写的著作中，即我的《哲学科学百科全书》”（*PR*，p. 9）。《法哲学》明确说，它是对其哲学系统中“客观精神”一节的展开，因而是系统的一部分。
    step2: |-
      非系统性解读把黑格尔的 *PR* 与其更广系统明确分开。持这一立场的人很少。它显然违背黑格尔在《法哲学》序言中的自我理解——他说，*PR*“是对同一批基本概念的更详尽、尤其更系统的阐述；这些概念就哲学的这一部分而言，已包含在此前为配合我讲课而写的一本书里，即我的《哲学科学百科全书》”（*PR*，p. 9）。《法哲学》明说，它是其哲学系统中“客观精神”一节的展开，因而是系统的一部分。
  - id: 17
    kind: body
    source: |-
      The now orthodox view is the systematic reading which accepts that Hegel’s logic and system have explanatory force in interpreting the *PR* (Brooks 2013, Brooks and Stein 2017)[^brooks-2013][^brooks-2017]. There is no denying their connection, only its character and strength. There remain differences about how much the system does or should figure as well as related metaphysical issues (Redding 2012, Wood 2017)[^redding-2012][^wood-2017]. For example, there is a consensus that Hegel’s political philosophy should be understood within its systematic context, but there remains disagreement about whether we need to accept his arguments for the wider philosophical system in order to accept his contributions to political philosophy. This entry will broadly follow the dominant systematic reading, but acknowledges there is not a consensus on how strongly a justificatory role the system plays for his political thought.
    step1: |-
      如今正统的观点是系统性解读：它承认黑格尔的逻辑与系统在解释 *PR* 时具有解释力（Brooks 2013，Brooks and Stein 2017）[^brooks-2013][^brooks-2017]。没有人能否认二者的关联，能争的只是这种关联的性质与强度。系统在多大程度上确实或应当在场，以及相关的形而上学问题，仍存分歧（Redding 2012，Wood 2017）[^redding-2012][^wood-2017]。例如，人们一致认为，应在系统性语境中理解黑格尔的政治哲学；但我们必须接受他为更广哲学系统所作的论证，才能接受他对政治哲学的贡献吗？这一点仍有分歧。本词条大体遵循主导性的系统性解读，但同时也承认：系统在其政治思想中扮演何种强度的辩护角色，并无共识。
    step2: |-
      如今正统的观点是系统性解读：它承认黑格尔的逻辑与系统在解释 *PR* 时有解释效力（Brooks 2013，Brooks and Stein 2017）[^brooks-2013][^brooks-2017]。二者的关联无可否认；可争的只是这种关联的性质与强度。系统到底实际起多少作用、应当起多少作用，以及与之相关的形而上学问题，仍有分歧（Redding 2012，Wood 2017）[^redding-2012][^wood-2017]。比如，大家一致认为应当在系统语境中理解黑格尔的政治哲学；但是否必须先接受他为更广系统所作的论证，才能接受他政治哲学的贡献？这一点仍有争议。本词条大体遵循主导性的系统性解读，同时承认：系统在其政治思想中扮演的辩护角色究竟有多重，并无共识。
