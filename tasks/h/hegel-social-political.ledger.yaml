      Hegel’s state is headed by a hereditary monarch (§273 Remark, Brudner 1981, Redding 1994)[^brudner-1981][^redding-1994]. He claims the state requires someone to provide unity as an individual to the individual state, a someone to declare the state confirms a law as its law or agrees treaties with foreign countries. An elected monarch or president as head of state is objectionable because such a person would represent the interests of supporters. This would create a barrier for the monarch to truly speak with one voice on behalf of the country – and so the monarch should be above such partisanship. A hereditary monarch would provide some basis for there being a head of state that could represent all and provide the unity required.
    step1: |-
      黑格尔的国家由世袭君主领衔（§273 附释，Brudner 1981，Redding 1994）[^brudner-1981][^redding-1994]。他主张，国家需要有一个人以个体的身份为这个个体的国家提供统一；需要有人宣布国家把一项法律确认为它的法律，或与外国缔约。选出的君主或总统作为国家元首是不可取的，因为这样的人会代表其支持者的利益。这会构成屏障，使君主无法真正以一个声音代表整个国家说话——所以君主应当超越这种党派性。世袭君主能提供某种基础：有一位元首可以代表所有人，提供所需的统一。
    step2: |-
      黑格尔的国家由世袭君主领衔（§273 附释，Brudner 1981，Redding 1994）[^brudner-1981][^redding-1994]。他主张：国家需要有一个人，以个体的身份为这个个体的国家提供统一；需要有人宣布国家把某项法律确认为本国的法律，或与外国缔约。选出来的君主或总统当国家元首，他不能接受——这样的人只会代表支持者利益。这会立起一道屏障，使君主无法真正以同一个声音代表全国说话。所以君主必须超越党派性。世袭君主提供了某种基础：有这样一位元首，能代表所有人，提供国家所需的统一。
