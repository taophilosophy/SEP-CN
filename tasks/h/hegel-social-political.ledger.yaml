      > 例如，惩罚有各种规定：它是报应的，也是威慑的范例，是法律用作威慑的威胁，还使罪犯醒悟并得到改造。这些不同的规定，每一个都曾被当作惩罚的*根据*，因为每一个都是本质的规定；因而其余的、与它有别的规定，就相对于它而被规定为仅仅偶然的。*但被当作根据的那一个，仍然不是惩罚本身的整体*（*SL*, p. 465）
