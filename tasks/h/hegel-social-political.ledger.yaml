      This failure of mutual recognition is taken up next at the end of Abstract Right in a section entitled “Wrong” [*Unrecht*]. This section has been widely interpreted by many scholars to offer a clear retributivist theory of crime and punishment (Cooper 1971, Primoratz 1989)[^cooper-1971][^primoratz-1989]. At first glance, it is easy to see why.
