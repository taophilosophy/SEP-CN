      Hegel’s concept of ‘Ethical Life’ [*Sittlichkeit*] plays a pivotal role in his political and legal thought. It is here that Hegel takes other concepts considered earlier found in Abstract Right (such as contract, property and punishment) and Morality to grasp them anew but now in their social – and more “concrete” context. The following discussion retains an abstract character insofar as Hegel discusses institutions that existed at his time – like the family, civil society and the state – but in ways meant to bring out the rational within the actual (and actual within the rational) (see Stern 2006)[^stern-2006]. For example, core ideas about what constitutes a wrong from his discussion of punishment return, but with a deeper and evolved understanding of their place in a social context that brings out a different character and complexity to his views – which is intended to unpack the character and complexity of the inner rationality that Hegel believes we can discern in the world.
    step1: |-
      黑格尔的“伦理生活”（*Sittlichkeit*）概念在其政治与法律思想中扮演关键角色。正是在这里，黑格尔把先前在抽象法（如契约、财产与惩罚）与道德中考虑过的其他概念重新加以把握——但如今是在其社会的、也更“具体”的语境中。以下讨论仍带有抽象性质，因为黑格尔讨论的是他那个时代存在的制度——如家庭、市民社会与国家——但他讨论的方式，意在显出现实中的理性（以及理性中的现实）（见 Stern 2006）[^stern-2006]。例如，他论惩罚时关于什么构成不法的核心观念会重新出现，但带着更深、更成熟的理解，说明它们在社会语境中的位置；这为其观点带来不同的性质与复杂度——而这样做，正是要展开黑格尔相信我们可以在世界中辨识出的那种内在理性之性质与复杂度。
    step2: |-
      黑格尔的“伦理生活”（*Sittlichkeit*）概念，在其政治与法律思想中至关重要。正是在这里，他重新把握了先前在抽象法（契约、财产、惩罚）与道德中处理过的诸概念——不过这次是在社会性的、也更“具体”的语境里。以下讨论仍带抽象色彩：黑格尔讨论的是他那个时代确实存在的制度——家庭、市民社会、国家——但其讨论方式意在显出“现实中的理性”（以及“理性中的现实”）（见 Stern 2006）[^stern-2006]。比如，他论惩罚时提出的“什么构成不法”的核心观念会重新出现，但带着更深、更成熟的理解，说明这些观念在社会语境中的位置；他的观点由此呈现出不同的性质与复杂度——这一安排，正是为了展开黑格尔相信我们能在世界中辨识出的那种内在理性：它的性质与复杂度。
