      But this commonly held view is controversial for several reasons. Hegel may call this third kind of wrong “crime,” but this view of crime is understood in a specific way (Nicholson 1982)[^nicholson-1982]. There is no state or laws, no police or judiciary (Stillman 1976)[^stillman-1976]. A hypothetical scenario lacking prisons is hardly any complete theory of punishment. In fact, there is neither judge nor jury in Abstract Right to say who is right or wrong. This is because, when we view this section in its systematic context, Hegel is drawing attention to certain foundational ideas about wrongs more generally (e.g., that they are of three kinds) and how we should respond (e.g., that crimes can deserve punishment) without yet giving his full view at this point in the *PR*.
    step1: |-
      但这一流行看法颇有争议，理由有几点。黑格尔也许把第三种不法称为"犯罪"，但他对犯罪的看法是以特定方式理解的（Nicholson 1982）[^nicholson-1982]。这里没有国家或法律，没有警察或司法（Stillman 1976）[^stillman-1976]。一个没有监狱的假设场景，很难算完整的惩罚理论。事实上，抽象法中既没有法官也没有陪审团来判断谁对谁错。这是因为，当我们从系统语境来看这一节，黑格尔是在提请注意关于不法的一些基础观念（例如，不法有三种），以及我们应当如何回应（例如，犯罪可以该当惩罚），他在《法哲学》这一节点上还没有给出完整看法。
    step2: |-
      不过，这一流行看法站不住脚，理由有几条。黑格尔也许把第三种不法称作"犯罪"，但他对"犯罪"的理解有其特定方式（Nicholson 1982）[^nicholson-1982]。这里没有国家、没有法律，没有警察，也没有司法机构（Stillman 1976）[^stillman-1976]。一个连监狱都没有的假设场景，很难说得上是完整的惩罚理论。事实上，抽象法里既没有法官也没有陪审团，来判定谁对谁错。原因在于：把这一节放回系统语境看，黑格尔只是要提请注意关于不法的一些基础观念（比如不法有三类），以及我们应当如何回应（比如犯罪可以该受惩罚）；在这个节点上，他还没有给出完整看法。
