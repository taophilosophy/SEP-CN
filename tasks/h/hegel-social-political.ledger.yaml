      Hegel’s perspective is unique (Brudner 2017)[^brudner-2017]. He accepts the positivist view that our understanding of law must be centred on the law itself rather than extralegal considerations. He says “what is *legal* [*gesetzmāßig*] is … the source of cognition of what is right [*Recht*], or more precisely, of what is *lawful* [*Rechtens*]” (*PR* §212 Remark). So we start first from a close look at the law before us – whatever it is – and not develop some normative standard separately beforehand. For Hegel, we do not comprehend this standard separately from the law, but immanently within it.
    step1: |-
      黑格尔的立场独一无二（Brudner 2017）[^brudner-2017]。他接受实证主义的看法：我们对法律的理解必须以法律本身为中心，而不是法外的考量。他说“合法（*gesetzmāßig*）的东西……是认知法（*Recht*）、或更准确地说认知合乎法的东西（*Rechtens*）的来源”（*PR* §212 附释）。所以我们首先从眼前的法律入手——不管它是什么——而不是预先另行发展某个规范标准。对黑格尔而言，这一标准不是离开法律来把握的，而是在法律之内被内在地把握的。
    step2: |-
      黑格尔的立场独一无二（Brudner 2017）[^brudner-2017]。他接受实证主义的看法：理解法律必须以法律本身为中心，而不是法外的考量。他说，**合法**（*gesetzmäßig*）的东西“是认知法（*Recht*）、更准确地说认知合乎法者（*Rechtens*）的来源”（*PR* §212 附释）。所以我们先从眼前的法律入手——不管它是什么——而不是预先另行建立一套规范标准。对黑格尔而言，这个标准不是在法律之外把握的，而是在法律之内被内在地把握的。
