      For Hegel, the Family achieves unity through its creation of children (*PR* §173 Addition). To this extent, he plainly endorses the traditional family model (see Haldane 2006)[^haldane-2006]. However, this is done on very non-traditional grounds. What guides Hegel’s thinking is his logic which brings together opposites in a creative unity producing some new, higher concept (*PR* §165). Likewise, Hegel saw men and women as embodying different features with their sexual union able to create children, not unlike the universal and particular giving birth to the concrete individual (*PR* §165).
    step1: |-
      对黑格尔来说，家庭通过创造孩子而实现统一（*PR* §173 补充）。就此而言，他明确赞同传统家庭模式（见 Haldane 2006）[^haldane-2006]。不过，这一赞同建立在极不传统的根据上。引导黑格尔思考的，是他的逻辑学：它把对立面带入创造性的统一，产生某个新的更高概念（*PR* §165）。同样，黑格尔把男人与女人视为体现不同特征者，其两性结合能够创造孩子，恰如普遍与特殊生出具体的个体（*PR* §165）。
    step2: |-
      在黑格尔看来，家庭经由创造孩子实现统一（*PR* §173 补充）。就此而言，他明确赞同传统家庭模式（见 Haldane 2006）[^haldane-2006]。但他据以赞同的根据，却极不传统。引导黑格尔思考的是他的逻辑学：对立双方在创造性统一中结合，产生新的更高概念（*PR* §165）。同理，他把男人与女人看作体现不同特征的两方，其两性结合能够创造孩子，恰如普遍与特殊生出具体的个体（*PR* §165）。
