      The problem of poverty is more than a concern about material needs. Hegel describes those in poverty as forming a “rabble” saying “poverty in itself does not reduce people to a rabble; a rabble is created only by the disposition associated with poverty, by inward rebellion against the rich, against society, the government, etc” (*PR* §244, Addition). Thus we can understand the rabble as having a conviction about their alienation that may be more likely to find among those who are poorer, but not exclusively them. To be in poverty is to be alienated and see one’s state as a separate, unfriendly other (Brooks 2020)[^brooks-2020]. While Hegel was a strong believer that through work we could develop our freedom to become reconciled to our social and political work, he lacks any convincing solution to how the problem of poverty might be overcome short of changing the economic system (Plant 1972)[^plant-1972].
    step1: |-
      贫困问题不止关乎物质需要。黑格尔把陷于贫困者描述为形成一个“贱民”群体，说“贫困本身并不会使人沦为贱民；贱民只有在与贫困相伴的心境中才产生，即对富人、对社会、对政府等等的内心反叛”（*PR* §244，补充）。因此我们可以把贱民理解为对自身异化怀有一种信念的人；这种信念在较贫困者中更易出现，但不限于他们。陷于贫困，就是被异化，把自己的处境看成一个分离而不友好的他者（Brooks 2020）[^brooks-2020]。黑格尔坚信，通过劳动，我们可以发展自由，与我们的社会政治工作和解；但关于如何解决贫困问题，除改变经济体系之外，他拿不出任何令人信服的方案（Plant 1972）[^plant-1972]。
    step2: |-
      贫困问题不只是物质需要的问题。黑格尔把陷于贫困者描述为形成了一个“贱民”群体，并说：“贫困本身并不会使人沦为贱民；贱民只有在同贫困相伴的心境中才产生——对富人、对社会、对政府等等的内心反叛”（*PR* §244，补充）。所以，贱民可以理解为对自身异化抱有信念的人；这种信念在较贫困者中更容易出现，但绝不仅见于他们。陷于贫困，就是被异化，把自己的处境看成一个分离而不友好的他者（Brooks 2020）[^brooks-2020]。黑格尔坚信，通过劳动我们可以发展自由，同我们的社会与政治工作达成和解；但对于不改变经济体系如何能解决贫困，他拿不出任何令人信服的方案（Plant 1972）[^plant-1972]。
