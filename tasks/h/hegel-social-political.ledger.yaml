      But it is also the case that Hegel saw war as testing the relative health of states where those most rationally organized should triumph over less well ethically structured states. Combined with his rejection of Kant’s proposals for perpetual peace, it has led some to question whether or not war plays a positive, and troubling, role in his philosophy (Avineri 1961, Black 1973, Shelton 2000, Walt 1989)[^avineri-1961][^black-1973][^shelton-2000][^walt-1989]. Hegel also comments that “modern wars are accordingly waged in a humane manner, and all persons do not confront each other in hatred” which can give the impression that modern wars are of an improved ethical quality than past wars – when the opposite appears true (*PR* §338 Addition).
    step1: |-
      但黑格尔也把战争视为对各国的相对健康状况的检验：组织得最有理性的国家，应当战胜伦理结构较差的国家。加上他拒斥康德关于永久和平的提案，有人据此质疑：战争在他的哲学中是否扮演一种正面的、却也令人不安的角色（Avineri 1961，Black 1973，Shelton 2000，Walt 1989）[^avineri-1961][^black-1973][^shelton-2000][^walt-1989]。黑格尔还评论说，“现代战争因此以人道方式进行，人与人并不彼此怀着仇恨相向”，这会给人印象：现代战争的伦理品质比过去的战争有所提升——而实际情况似乎恰恰相反（*PR* §338 补充）。
    step2: |-
      黑格尔还把战争看作对各国相对健康状况的检验：组织得最有理性的国家，应当战胜伦理结构较差的国家。加上他拒斥康德永久和平的提案，有人据此质疑：战争在他哲学里是否扮演着正面而令人不安的角色（Avineri 1961，Black 1973，Shelton 2000，Walt 1989）[^avineri-1961][^black-1973][^shelton-2000][^walt-1989]。黑格尔还评论说，“现代战争因此以人道方式进行，人与人并不彼此怀着仇恨相向”。这话容易让人觉得：现代战争的伦理品质比过去的战争有所提升——而实际情况似乎恰恰相反（*PR* §338 补充）。
