    source: |-
      The first substantive stage is Abstract Right. Somewhat misleading its sections are entitled “Property,” “Contract” and “Wrong” giving the false impression that Hegel is discussing actual possession of property, its sale or punishment for breach of contract. Typically for Hegel, he uses common terminology in uncommon ways.
    step1: |-
      第一个实质阶段是抽象法。其各节标题分别为“财产”“契约”与“不法”，这多少有些误导，给人错误印象，仿佛黑格尔在讨论实际的财产占有、买卖或违约惩罚。黑格尔的一贯做法是：以平常的术语，作不平常的用法。
    step2: |-
      第一个实质阶段是抽象法。它的小节标题分别叫“财产”“契约”“不法”，这有点误导：让人以为黑格尔在谈实际的财产占有、买卖，或对违约的惩罚。黑格尔惯用的手法，正是拿寻常术语作不寻常的用法。
  - id: 31
    kind: body
    source: |-
      We must recall the main aim of Hegel’s project is to understand how the free will wills the free will, and not mere arbitrariness. This requires Hegel to find some ground for helping decide when the free will wills freely, versus when it does not. Hegel first turns to taking possession of property. It is noticeable that Hegel’s account is aimed at using property possession as a first step towards finding this ground rather than for building an economic system. For example, Hegel says that “what and how much I possess is…purely contingent as far as right is concerned” (*PR* §49). This is because Hegel does not intend to develop a full theory of property yet, but rather to locate a ground for the free will’s freedom.
    step1: |-
      我们必须记住，黑格尔工程的主要目标，是理解自由意志如何意欲自由意志，而非纯粹的任意。这要求黑格尔找到某种根据，帮助判定何时自由意志在自由地意欲，何时不是。黑格尔首先转向财产的占有。值得注意的是，他的论述旨在把财产占有当作寻找这一根据的第一步，而非用来建立一种经济制度。例如，黑格尔说：“我占有什么、占有多少……就法而言纯属偶然”（*PR* §49）。这是因为黑格尔此时并不打算发展一套完整的财产理论，而是要确定自由意志之自由的根据。
    step2: |-
      要记住，黑格尔这项工程的主旨，是理解自由意志如何意欲自由意志，而不是意欲纯粹的任意。为此，他需要找到某种根据，来判断自由意志在何种情况下是自由地意欲，在何种情况下不是。他的第一步，是考察对财产的占有。值得注意的是，他论述财产占有，是要拿它作为寻找这一根据的起步，而不是要建立一套经济制度。比如他说：“我占有什么、占有多少……就法权而言纯属偶然”（*PR* §49）。所以如此，是因为黑格尔此刻并不想构建完整的财产理论，只想为自由意志的自由确定根据。
  - id: 32
    kind: body
    source: |-
      The importance of property at this stage is its development of our self-consciousness (Benhabib 1984)[^benhabib-1984]. For Hegel, I give my free will an external existence that others can engage with. My ownership of property is not determined by me alone, but something determined “within the context of a common will” shared between two persons (*PR* §71).
    step1: |-
      财产在这一阶段的重要性，在于它发展我们的自我意识（Benhabib 1984）[^benhabib-1984]。对黑格尔来说，我赋予我的自由意志一种外部定在，他人得以与之打交道。我对财产的占有并不单由我决定，而是在两个人共享的“共同意志的语境中”被决定的东西（*PR* §71）。
    step2: |-
      财产在这个阶段之所以重要，在于它培养我们的自我意识（Benhabib 1984）[^benhabib-1984]。在黑格尔看来，我为自己的自由意志赋予一种外部的定在，别人可以与之打交道。我对财产的占有并不单由我决定，而是“在共同意志的语境中”被决定的东西——这个共同意志由两个人共享（*PR* §71）。
