      There is reason to doubt this picture (Brooks 2007)[^brooks-2007]. The monarch cannot act arbitrarily. In being “bound by the concrete content of the advice he receives,” he must be able to discern this content (*PR* §279 Addition). And Hegel is critical of the UK’s constitutional monarchy post-Civil War noting that “since 1692 there has never been a case of the king’s vetoing a parliamentary decree” with the consequence that it “reduces him virtually to a cipher” and he should be more active on state matters – and, presumably, making his own judgements whether to support proposed legislation or not in recommending it for approval to the legislature (*LNR* §133 Remark*)*. While the ministers advising him should be of rough equality making little difference who is in which role, the monarch has full discretion to hire and fire anyone at will from an eligible pool. Moreover, it is the monarch advised by his relevant minister who agree treaties and decide all matters of war and peace (*PR* §329). Given the monarch cannot be removed from office, this gives him considerable powers in foreign affairs raising questions about how relatively powerless, if at all, he really is.
    step1: |-
      有理由怀疑这幅图景（Brooks 2007）[^brooks-2007]。君主不能任意行动。既然“受到他所接受建议之具体内容的约束”，他必须能够辨识这一内容（*PR* §279 补充）。黑格尔还批评内战之后的英国立宪君主制，指出“1692 年以来从未有国王否决议会法令的事例”，其后果是这“实际上把君主贬为一个符号”；他应当在国家事务上更积极——想必这意味着，在把法案提交议会批准之前，他应当自己判断是否支持（*LNR* §133 附释）。虽然辅佐他的各部长彼此大抵平等，谁居何职无关紧要，但君主拥有完全的裁量权，可以从合格人选池中随意任免任何人。而且，与他所咨询的相关部长一道同意缔约、决定一切战争与和平之事的，正是君主（*PR* §329）。既然君主不能被免职，这就在外交事务中给他相当大的权力，令人质疑他究竟相对无权到什么程度——如果真有任何无权可言。
