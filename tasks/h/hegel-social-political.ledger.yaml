    source: |-
      This “conservative” reading of Hegel was challenged later by a more “liberal” interpretation that highlighted the reforms and divergences both cultural and political between Prussia and the *PR* that make clear that Hegel did not support an authoritarian government, but a new form of democratic institutions complete with jury trials that was more progressive (Avineri 1972, Knox 1970)[^avineri-1972][^knox-1970]. Hegel held a lifelong admiration for the French Revolution toasting the fall of the Bastille throughout his adult life.
    step1: |-
      这种对黑格尔的"保守主义"解读，后来受到一种更"自由主义"的解读的挑战。后者凸显了普鲁士与《法哲学》之间在文化与政治上的改革与分歧，清楚地表明黑格尔并不支持威权政府，而支持一种更进步的、配有陪审团审判的新式民主制度（Avineri 1972，Knox 1970）[^avineri-1972][^knox-1970]。黑格尔毕生钦佩法国大革命，成年后始终为攻占巴士底狱举杯。
    step2: |-
      这种"保守主义"读法，后来受到一种更"自由主义"的解读挑战。后者凸显了普鲁士与《法哲学》之间在文化与政治上的距离与分歧，清楚地表明：黑格尔并不支持威权政府，而是支持一种更进步、配备陪审团审判的新式民主制度（Avineri 1972，Knox 1970）[^avineri-1972][^knox-1970]。黑格尔一生钦佩法国大革命，成年以后，每年都举杯纪念攻占巴士底狱。
  - id: 10
    kind: body
    source: |-
      Today, most commentators agree that Popper and others were wrong to claim Hegel endorsed some view of authoritarianism. At the same time, Hegel’s social and political philosophy is more ideologically moderate than the conservativism versus progressivism debate had often admitted. While he did advocate for more democratic and progressive elements than a reality at his time, Hegel did also defend the traditional family and constitutional monarchy. Perhaps purposefully, Hegel’s thought is notoriously difficult to categorize given his interest to overcome and transform ordinary distinctions with a virtual consensus today that his work resists tidy classification as conservative, progressive or anything else.
    step1: |-
      今天，大多数评论者同意，波普尔等人宣称黑格尔支持某种威权主义的看法是错的。同时，黑格尔的社会政治哲学，在意识形态上比保守主义与进步主义之争通常所承认的更为温和。虽然他确实主张比其时代现实更多的民主与进步要素，但他也维护传统家庭与立宪君主制。也许是有意为之，黑格尔的思想出了名地难以归类，因为他志在克服并转化平常的种种区分。今天人们几乎一致认为：他的著作抗拒任何整齐的归类——无论保守、进步还是其他。
    step2: |-
      今天，多数评论者都同意：波普尔等人说黑格尔支持某种威权主义，是错的。但同时也要看到：比起保守主义对进步主义那种非此即彼的争论所愿意承认的，黑格尔的社会政治哲学在意识形态上要温和得多。他固然主张比其时代现实更多的民主与进步成分，却同样维护传统家庭与立宪君主制。黑格尔立志克服并转化日常的种种二分，他的思想因此出了名地难以归类；今天人们几乎一致认为，他的著作抗拒一切整齐的标签——保守也好，进步也好，别的也好。
