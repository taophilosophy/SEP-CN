      Hegel’s concept of ‘Ethical Life’ [*Sittlichkeit*] plays a pivotal role in his political and legal thought. It is here that Hegel takes other concepts considered earlier found in Abstract Right (such as contract, property and punishment) and Morality to grasp them anew but now in their social – and more “concrete” context. The following discussion retains an abstract character insofar as Hegel discusses institutions that existed at his time – like the family, civil society and the state – but in ways meant to bring out the rational within the actual (and actual within the rational) (see Stern 2006)[^stern-2006]. For example, core ideas about what constitutes a wrong from his discussion of punishment return, but with a deeper and evolved understanding of their place in a social context that brings out a different character and complexity to his views – which is intended to unpack the character and complexity of the inner rationality that Hegel believes we can discern in the world.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Ethical Life is divided into three parts where each builds off of the analysis thus far into the nature of Abstract Right and Morality, but where each part, in turn, develops after the other. This ordering is not chronological, but dialectical. We are not a member of civil society or the state after we join a family, but the concepts of the former are further developments from the latter as the following sections bear out.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      ## 7. Family
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Hegel begins his discussion of the first emergence of right embodied in the world through the sphere of Family. As we should expect, Hegel uses common terminology in uncommon ways again.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      In Abstract Right, separate abstract individuals connect together through mutual recognition by acknowledging the ownership of property. In Ethical Life, the Family is a sphere where concrete individuals come together bound in a love for each other (*PR* §158). This connection is not purely arbitrary, like animals seeking only to satisfy their needs and then seek another. For Hegel, the Family is a connection that, at least in principle, aims at a permanence he calls “marriage” (*PR* §161).
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      These marriages are not defined in contractual terms, but ethical. A contract is an agreement that different parties can enter or exit on mutual consent. Any shared commitment or unity has a temporary character. This is little better than the kind of mutual recognition we saw in Abstract Right.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      However, in marriage, a more substantive unity is created that is a permanent bond unlike most contracts. This does not mean that Hegel forbids divorce. The termination of a marriage is seen as an unfortunate possibility born from marriage’s foundation in our feelings, like love, which can be unstable over time (*PR* §163 Addition).
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      While divorce is permitted, arranged marriages are not (*PR* §162). This is because marriage is a further development of our freedom – and it requires our being able to choose a life partner. In this way, marriage is an advance of our mutual recognition from a contract where we agree ownership of some thing to where we choose to create a unity with another longer term.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      For Hegel, the Family achieves unity through its creation of children (*PR* §173 Addition). To this extent, he plainly endorses the traditional family model (see Haldane 2006)[^haldane-2006]. However, this is done on very non-traditional grounds. What guides Hegel’s thinking is his logic which brings together opposites in a creative unity producing some new, higher concept (*PR* §165). Likewise, Hegel saw men and women as embodying different features with their sexual union able to create children, not unlike the universal and particular giving birth to the concrete individual (*PR* §165).
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      These views have rightly been subjected to widespread criticism by feminists and others (Halper 2001, Hutchings and Pulkkinen 2010, Knowles 2002, Ravven 1988, Stone 2002)[^halper-2001][^hutchings-2010][^knowles-2002][^ravven-1988][^stone-2002]. A common argument is that Hegel’s justification of the Family is a poor defence of privileging men over women on the basis of his controversial dialectical method. Only men have the opportunity to engage outside the home in civil society and fully participate in the state. These critics claim that such a privilege should not be reserved for men alone for many, often obvious, reasons. It is also argued that his broad views about the essence of marriage as a permanent bond built on love can be achieved by non-traditional families, too. It is worth pointing out that Hegel’s talk of the Family is of an ideal. Hegel fathered a child outside of wedlock who he supported throughout his life. He sees himself as revealing the full development of right wherever it may take us, and what it requires from us or our institutions may be different from how we find them.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      ## 8. Civil society
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Hegel’s civil society is primarily the place of work, as well as where he situates law and the legal system (see Sect. 5). Whereas the Family is ideally a relation of unity from a natural law for each other, this gives way to the pursuit of the particular individual within the system of needs (*PR* §182). The Family is a sphere where it is all for one and one for all. In civil society, the needs of all are met where I make my particular contribution in a pro-market economic vision accepting a natural division of labour (*PR* §189, 198).
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Hegel sees the world of work as a home away from home, or “second family” (*PR* §252). Instead of familial love, there is a kind of brotherly love fostered through an individual’s connection to a corporation, grouped by the kind of trade all are engaged in which educates and supports its member.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Interestingly, Hegel sees market relations in modern society as a foundation for the acquisition by free individuals of social identities including social solidarity. We develop our sense of selves through our economic activities and the myriad of interconnections we forge with others in an extra-familial but non-political way.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      A key problem is the problem of poverty. If possession of property is essential for the development of my sense of right and satisfaction of needs, a capitalist economic system which, Hegel accepts, makes poverty for at least some unavoidable raises a serious concern about whether Hegel’s ideal social and political philosophy is ideal for all its citizens (Avineri 1971, Whitt 2013)[^avineri-1971][^whitt-2013].
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      The problem of poverty is more than a concern about material needs. Hegel describes those in poverty as forming a “rabble” saying “poverty in itself does not reduce people to a rabble; a rabble is created only by the disposition associated with poverty, by inward rebellion against the rich, against society, the government, etc” (*PR* §244, Addition). Thus we can understand the rabble as having a conviction about their alienation that may be more likely to find among those who are poorer, but not exclusively them. To be in poverty is to be alienated and see one’s state as a separate, unfriendly other (Brooks 2020)[^brooks-2020]. While Hegel was a strong believer that through work we could develop our freedom to become reconciled to our social and political work, he lacks any convincing solution to how the problem of poverty might be overcome short of changing the economic system (Plant 1972)[^plant-1972].
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      ## 9. Law
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Part of Hegel’s examination of civil society concerns law and the administration of justice. Hegel’s theory of law has been notoriously difficult to characterize. This is likely, in part, because Hegel uses common terms in an uncommon ways.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Hegel clearly accepts a strong link between morality and law suggesting he endorses some variety of natural law. Like other natural lawyers, Hegel claims “what is law [*Gesetz*] may differ in content from what is right in itself” (*PR* §212). Something can be lawful yet unjust – and this having a higher standard of justice by which he can assess posited law is a common feature of natural law jurisprudence.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      But what is different is that, traditionally, natural lawyers have developed their understanding of the standard of moral justice to be applied to an assessment of law prior to that assessment. For example, the moral standard would be worked out first and then applied afterwards. This leads some critics of natural law to claim that this approach uses extralegal standards and reasoning to assess law and so really engaging in moral philosophy rather than legal thought.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Hegel’s perspective is unique (Brudner 2017)[^brudner-2017]. He accepts the positivist view that our understanding of law must be centred on the law itself rather than extralegal considerations. He says “what is *legal* [*gesetzmāßig*] is … the source of cognition of what is right [*Recht*], or more precisely, of what is *lawful* [*Rechtens*]” (*PR* §212 Remark). So we start first from a close look at the law before us – whatever it is – and not develop some normative standard separately beforehand. For Hegel, we do not comprehend this standard separately from the law, but immanently within it.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      He says: “the scope of the law [*Gesetz*] ought on the one hand to be that of a complete and self-contained whole, but on the other hand, there is a constant need for new legal determinations [*gesetzlicher* *Bestimmungen*]” (*PR* §216). Hegel is claiming the law aspires to be a complete whole and, where we find gaps or inconsistencies, our task is to work out how these can be addressed within the law as a self-contained whole in language echoing Ronald Dworkin’s (1977) use of legal principles a century later. Thus, Hegel looks to the law for the ethical principles that can be used to continually reform our legal system into the complete whole it aspires to be. This “natural law internalism” discerns its principles from within the law rather than from outside it (Brooks 2017b)[^brooks-2017b].
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      The development of law is crucially not a project for professionals alone. Hegel makes a powerful case for the right to trial by jury (*PR* §228 Remark). His argument is that without a jury of ordinary citizens there is no guarantee that a citizen would have a reasonable chance of understanding the charges, evidence and outcome, especially if convicted and punished. This is because the law is a technical language which risks becoming the exclusive property of a professional class. The best guarantee of law’s publicity and connection to a public view of right is to ensure a jury is convinced – if they can understand the trial and come to a view, then Hegel finds it reasonable to expect the defendant on trial can, too.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      It is here that Hegel revisits the justification of punishment. We now consider crime and punishment not in abstraction, but their concrete reality. Hegel begins by noting that the “outward existence” of a crime and its impact may not change the nature of a crime in its concept, but it does impact how we respond. This suggests that the same kind of crime can be punished more or less severely based, at least in part, on the circumstances. Such a view is starkly at odds with most retributivists where punishment should only be considered in relation to what an offender deserved on account of his moral responsibility for an offence.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Hegel makes clear that a crime’s “danger to civil society is a determination of its magnitude” where circumstances impact how we determine whether to punish, how much to punish and what form this might take. He notes “a penal code is therefore primarily a product of its time and of the current condition of civil society” (*PR* §218 Remark). He adds that “punishments are not unjust in and for themselves, but are proportionate to the conditions of their time” (*PR* §218 Addition). So the same crime committed in different circumstances would be punished differently. For example, a crime committed during civil war poses a greater threat to civil society than when at peace – and so the former would see the crimes punished more harshly. There is no difference in the offender or her responsibility. While desert matters, it is not the only factor which does. Hegel’s position is different from traditional retribution accounts where proportionality of wrongdoing is found in what an offender deserves and not influenced by non-desert factors like the stability of civil society.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      These comments make clear a non-retributivist picture. This is consistent with a passage in his *Science of Logic* (*SL*), the text Hegel claims is presupposed as the foundation for the *PR*:
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      > Punishment, for example, has various determinations: it is retributive, a deterrent example as well, a threat used by the law as a deterrent, and also it brings the criminal to his senses and reforms him. Each of these different determinations has been considered the *ground of punishment*, because each is an essential determination, and therefore the others, as distinct from it, are determined as merely contingent relatively to it. *But the one which is taken as ground is still not the whole punishment itself* (*SL*, p. 465)
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Hegel’s argument is clearer here. Desert grounds punishment: only the deserving can be liable to be punished. But it does not have a monopoly on the amount or form that punishment can take. This picture is consistent with Hegel’s comments in the *PR* where the outward existence of punishment may be different depending on circumstances. It should be unsurprising to find that Hegel, who repeatedly defends various groupings of three in his work would seek to combine retribution, deterrence and rehabilitation in a new format – taking common concepts in uncommon ways. This was not lost on his earliest interpreters in the UK, as British Idealists like Green, Bradley and others held similar three-in-one views on punishment and rejected traditional accounts of retributivism (Bradley 1894, Brooks 2003, 2011, Green 1986:138–59, Seth 1916:310–23)[^bradley-1894][^brooks-2003][^green-1986][^seth-1916]. This view has been called the “unified theory of punishment” (Brooks 2017a, 2021:143–79)[^brooks-2017a].
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      ## 10. The State
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Hegel’s final section of “Ethical Life” is the state. The love for others based on feeling in the family and then on the satisfaction of needs in civil society is transformed to a patriotic love for fellow citizens in support of a shared community, embodied by the modern state (see *PR* §268). Moreover, the individual pursuit of the satisfaction of needs leads to the development of the state.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      For Hegel, it is only in the state that the family develops into civil society and where civil society gains greater “actuality” (*PR* §256–57). The state is where our “concrete freedom” is realized as we conceive of ourselves in our full social and political reality (*PR* §260). It is only here that the individual is conceived at once as a member of a family, as a part of civil society and as a citizen of a state. While the stage where our freedom is realized most concretely, it is not the case that individual freedom is somehow a problem – our individual freedom has greatest actuality when mutually recognized by others in law. Hegel reflects that “it has often been said that the end of the state is the happiness of its citizens. This is certainly true, for if their welfare is deficient, if their subjective ends are not satisfied, and if they do not find that the state as such is the means to this satisfaction, the state itself stands on an insecure footing” (*PR* §265 Addition). Hegel’s state is a community where individuals and their individuality are meant to flourish.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Hegel’s conception of the state’s composition is controversial. He seeks to unify the three traditional models of government – aristocracy, democracy and monarchy – under a new form of representative government with a constitutional monarch (Deranty 2001)[^deranty-2001]. Hegel proposes an Estates Assembly with the natural aristocracy of the agrarian class in one chamber and representatives from different trades in another. Hegel believed that representing a locality based on geography was arbitrary and lacking substance. He claimed a stronger ethical relation could be formed through representation of people through their work.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Hegel’s state is headed by a hereditary monarch (§273 Remark, Brudner 1981, Redding 1994)[^brudner-1981][^redding-1994]. He claims the state requires someone to provide unity as an individual to the individual state, a someone to declare the state confirms a law as its law or agrees treaties with foreign countries. An elected monarch or president as head of state is objectionable because such a person would represent the interests of supporters. This would create a barrier for the monarch to truly speak with one voice on behalf of the country – and so the monarch should be above such partisanship. A hereditary monarch would provide some basis for there being a head of state that could represent all and provide the unity required.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      While virtually no commentator is convinced by Hegel’s justification of constitutional monarch, the orthodox view is that the monarch is a rubber stamp (Yack 1980)[^yack-1980]. Hegel remarks that “in a fully organized state … all that is required in a monarch is someone to say ‘yes’ and to dot the ‘I’; for the supreme office should be such that the particular character of its occupant is of no significance” (*PR* §280 Addition). Some have drawn comparisons with the UK’s constitutional monarchy, where laws require the Assent of Her Majesty The Queen but where this is automatically done when requested by Parliament for example (Findlay 1958).
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      The real power is behind the throne and held by an educated governing cabinet [*Ministerium*], often referred to as the bureaucracy. It is these advisors to the monarch who propose new laws, via the responsible cabinet minister. These ministers, and not the monarch, are answerable to the legislature whose role is to consider proposals and either enact or reject them.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      There is reason to doubt this picture (Brooks 2007)[^brooks-2007]. The monarch cannot act arbitrarily. In being “bound by the concrete content of the advice he receives,” he must be able to discern this content (*PR* §279 Addition). And Hegel is critical of the UK’s constitutional monarchy post-Civil War noting that “since 1692 there has never been a case of the king’s vetoing a parliamentary decree” with the consequence that it “reduces him virtually to a cipher” and he should be more active on state matters – and, presumably, making his own judgements whether to support proposed legislation or not in recommending it for approval to the legislature (*LNR* §133 Remark*)*. While the ministers advising him should be of rough equality making little difference who is in which role, the monarch has full discretion to hire and fire anyone at will from an eligible pool. Moreover, it is the monarch advised by his relevant minister who agree treaties and decide all matters of war and peace (*PR* §329). Given the monarch cannot be removed from office, this gives him considerable powers in foreign affairs raising questions about how relatively powerless, if at all, he really is.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      ## 11. War and International Relations
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      The state has an “immediate actuality” in terms of its internal organization as discussed above, but it further determines itself internationally in relation to other states (*PR* §259). This part of the *PR* is the least worked out and detailed.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Hegel accepts a broadly Westphalian and realist view of international relations whereby the primary actors are states each prioritizing the pursuit of their individual welfare (*PR* §336, Smith 1983)[^smith-1983]. States interact with each other like individuals in an anarchic global space. Without any governing global authority, states can come into conflict with each other. He says “wars must be regarded as necessary because independent peoples exist alongside one another” (*LNR* §160 Remark). This is not a justification or glorification of war, but a recognition that states are in a state of nature where war is occasionally unavoidable (see *LNR* §162 Remark). States should aim to enable other states “to live at peace with it” and “war is that of something which ought to come to an end” (*PR* §338).
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      But it is also the case that Hegel saw war as testing the relative health of states where those most rationally organized should triumph over less well ethically structured states. Combined with his rejection of Kant’s proposals for perpetual peace, it has led some to question whether or not war plays a positive, and troubling, role in his philosophy (Avineri 1961, Black 1973, Shelton 2000, Walt 1989)[^avineri-1961][^black-1973][^shelton-2000][^walt-1989]. Hegel also comments that “modern wars are accordingly waged in a humane manner, and all persons do not confront each other in hatred” which can give the impression that modern wars are of an improved ethical quality than past wars – when the opposite appears true (*PR* §338 Addition).
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      The only judge of relative rights and wrongs in the international sphere is “world history as the world’s court of judgement” (*PR* §340). The *PR* then transitions to the start of an account of the philosophy of history in the next part of his system, which presupposes all parts preceding it not least the *PR* itself.
    step1: TBD
    step2: TBD
