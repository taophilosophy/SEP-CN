      ### 1.2 形而上学与非形而上学的解读
  - id: 12
    kind: body
    source: |-
      A second long-standing debate among Anglo-American commentators has concerned the relation of Hegel’s social and political thought to his logic and wider philosophical system. For many decades, the non-metaphysical reading has been the dominant approach. The central position was summed up by Z. A. Pelczynski (1964: 136–37) who said: “Hegel’s political thought can be read, understood, and appreciated without having to come to terms with his metaphysics … some intellectual curiosity may be unsatisfied when metaphysics is left out; a solid volume of political theory and political thinking will still remain.” The non-metaphysical reading follows a broadly analytic philosophical post-Kantian interpretation which sees Hegel as accepting, and even extending, Kant’s critical philosophy (Neuhouser 2000, Patten 1999, Pinkard 1994, Pippin 2008)[^neuhouser-2000][^patten-1999][^pinkard-1994][^pippin-2008]. This work is notable for typical focusing attention on the *PR* grasping it philosophically separately from other parts of Hegel’s system which are sometimes deemed to be overly dark with avoidable metaphysical commitments (Knowles 2002, Wood 1990)[^knowles-2002][^wood-1990].
    step1: |-
      英美评论者之间第二场长期争论，关乎黑格尔的社会政治思想与其逻辑学及更广哲学系统的关系。数十年来，非形而上学解读一直是主导进路。其核心立场由 Z. A. 佩尔钦斯基（1964: 136–37）概括："黑格尔的政治思想可以不与其形而上学打交道而被阅读、理解和欣赏……把形而上学留在一边，某种理智好奇心也许得不到满足；但一部扎实的政治理论与政治思考的专著仍会留下。"非形而上学解读大体遵循分析哲学的后康德式解释，把黑格尔看作接受、甚至扩展康德批判哲学的人（Neuhouser 2000，Patten 1999，Pinkard 1994，Pippin 2008）[^neuhouser-2000][^patten-1999][^pinkard-1994][^pippin-2008]。这项工作的特点是把注意力集中于 *PR*，在哲学上把它与其系统的其他部分分开把握；后者有时被视为过于晦暗，带着可避免的形而上学承诺（Knowles 2002，Wood 1990）[^knowles-2002][^wood-1990]。
    step2: |-
      英美评论者之间的第二场长期争论，关乎黑格尔的社会政治思想与其逻辑学及整个哲学系统的关系。几十年来，非形而上学解读一直是主导进路。Z. A. 佩尔钦斯基（1964: 136–37）把它归结为一句话："黑格尔的政治思想可以不去跟他的形而上学打交道，照样能读、能懂、能欣赏……形而上学被搁下，某种理智好奇心也许得不到满足；但一部扎实的政治理论与政治思想专著依然立在原地。"非形而上学解读大体承袭分析哲学的后康德路线，把黑格尔看作康德批判哲学的继承者、甚至扩展者（Neuhouser 2000，Patten 1999，Pinkard 1994，Pippin 2008）[^neuhouser-2000][^patten-1999][^pinkard-1994][^pippin-2008]。这类研究的典型做法，是把焦点集中在 *PR* 上，在哲学上把它从系统的其他部分剥离出来单独把握——其他部分有时被认为过于晦暗，且带着本可避免的形而上学承诺（Knowles 2002，Wood 1990）[^knowles-2002][^wood-1990]。
  - id: 13
    kind: body
    source: |-
      In contrast, the metaphysical reading counters that anti-metaphysical interpretations take a one-sided approach to Hegel’s work (Beiser 2005, Goodfield 2009, Rosen 1984, Taylor 1975, Thompson 2018)[^beiser-2005][^goodfield-2009][^rosen-1984][^taylor-1975][^thompson-2018]. Hegel conceived his *PR* to be a part of a wider system. Isolating any one text from its wider context may appear to inoculate any such reading from metaphysical claims elsewhere in Hegel’s system. However, only a reading that grasps the full metaphysical foundations of his thought will do justice to his self-understanding (Houlgate 2005)[^houlgate-2005].
    step1: |-
      与此相对，形而上学解读反驳说，反形而上学的解释对黑格尔的著作采取了一种片面的进路（Beiser 2005，Goodfield 2009，Rosen 1984，Taylor 1975，Thompson 2018）[^beiser-2005][^goodfield-2009][^rosen-1984][^taylor-1975][^thompson-2018]。黑格尔设想 *PR* 是一个更广系统的组成部分。把任何一部文本从其更广语境中隔离出来，也许能让这类解读免于黑格尔系统中别处的形而上学主张。然而，只有把握其思想的全部形而上学基础，才算公正对待他的自我理解（Houlgate 2005）[^houlgate-2005]。
    step2: |-
      与之相对，形而上学解读反驳道：反形而上学的解释对黑格尔著作的处理是片面的（Beiser 2005，Goodfield 2009，Rosen 1984，Taylor 1975，Thompson 2018）[^beiser-2005][^goodfield-2009][^rosen-1984][^taylor-1975][^thompson-2018]。黑格尔本就设想 *PR* 是一个更大系统的组成部分。把某一部文本从其更广语境里割出来，或许能让解读免受系统中别处的形而上学主张牵连；但只有那种把握了其思想全部形而上学基础的读法，才算公正对待黑格尔的自我理解（Houlgate 2005）[^houlgate-2005]。
