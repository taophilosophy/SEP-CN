  source: 'For Baron and many others, Leonardo Bruni (1369–1444) was regarded to be
    the paragon of Italian civic humanism (Hankins 1995: 327; Witt 2003: 392–442)[^hankins-1995][^witt-2003],
    the exemplar of the synthesis of humanistic study and public engagement: he served
    twice as the Chancellor of Florence and was intermittently employed in administrative
    posts by the papacy. At the same time, Bruni was a prodigious author and translator,
    composing a multi-volume history of the Florentine people (based on his access
    to primary sources), producing Latin versions of works by Aristotle (including
    the *Politics*) and other Greek texts, writing biographies of notable Italians
    for popular consumption, among many additional literary activities.'
  step1: '对巴伦及许多其他人而言，莱昂纳多·布鲁尼（Leonardo Bruni, 1369–1444）被视为意大利公民人文主义的典范（Hankins 1995:
