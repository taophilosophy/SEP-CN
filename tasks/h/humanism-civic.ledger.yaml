  source: Most significantly for current purposes, Bruni used his great 
    erudition to defend and promote the cause of republican government, 
    especially as practiced in Florence during his day. His *Laudatio* 
    (1403–1404 [1978]) are paeans to the city generally (for instance, in terms 
    of architectural and artistic beauty, its cleanliness, its locale, and its 
    plentiful resources) but also specifically to the virtue of its citizens and
    its institutions. (Recall a central feature of the “Baron thesis” mentioned 
    above derived from the claim that the Milan crisis of 1402 gave birth to 
    civic humanism in both theory and practice, with Bruni as its exemplary 
    exponent.) Like his contemporaries, Bruni believed that Florence had been 
    founded by the Romans during the republican period, rendering its citizens 
    characteristically lovers of freedom who stood also opposed to imperial and 
    tyrannical rule. This heritage from Rome also yielded the source for 
    Florence’s mild and peaceful relations with other Italian cities and their 
    citizens, signaled by its protection of all Italy from the domination 
    threatened by the Milanese. Florence was, in effect, the savior of the 
    Italian people.
  step1: 
    就当前目的而言，最重要的是，布鲁尼运用其渊博学识来捍卫与促进共和政府的事业，尤其是他在世时佛罗伦萨所实行的共和政府。他的《颂词》（*Laudatio*，1403–1404
    [1978]）是对这座城市的普遍赞歌（例如，就建筑与艺术之美、清洁、地利与丰富资源而言），也是对其公民德性与制度的专门赞歌。（回想上文提到的“巴伦论题”的一个核心特征，源自这一主张：1402
    年的米兰危机在理论与实践两方面催生了公民人文主义，而布鲁尼是其典范性的体现者。）与同时代人一样，布鲁尼相信佛罗伦萨是由罗马人在共和时期建立的，这使其公民成为典型的自由爱好者，同时也反对帝国与僭主的统治。这一罗马遗产也造就了佛罗伦萨与其他意大利城市及其公民之间温和和平的关系的来源，其标志是它保护整个意大利免受米兰人所威胁的统治。事实上，佛罗伦萨是意大利人民的拯救者。
