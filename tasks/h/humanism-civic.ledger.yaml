  source: Baron’s reconstruction of civic humanism was not only directed against
    other-worldly values and notions of medieval deference, but also against 
    different modes of construing modernity in terms of the autonomy of the 
    self. At issue here, beyond the characterization of a historical period, was
    the definition and evaluation of modernity itself. Baron wished to see the 
    autonomous humanity he perceived emerging in quattrocento Florence 
    integrated within a constitutional frame and anchored by patriotic 
    attachment to the community. Baron advocated a vast scholarly program to 
    establish the Italian humanist tradition as a major source of modernity. The
    polities he posited as commendable are not conceived as formal frames of 
    individual life goals—in other words, empty liberalism—but textured wholes 
    into which human autonomy is woven. To state it somewhat anachronistically, 
    accepting the nexus of public solidarity embedded in civic humanism, and 
    viewing it as an equivalent of civil society, Baron’s thesis overlaps 
    considerably with today’s communitarianism.
  step1: 
    巴伦对公民人文主义的重构，不仅针对超世的价值与中世纪恭顺的观念，也针对以自我之自主来构想现代性的不同模式。此处争论的问题，超越对某一历史时期的刻画，而关乎现代性本身的界定与评价。巴伦希望看到他于十五世纪（quattrocento）佛罗伦萨所察觉的自主人性，被整合进一个宪政框架之中，并锚定于对社群的爱国依恋。巴伦倡导一项庞大的学术计划，以确立意大利人文主义传统作为现代性的一个重要源头。他所称赞的政体，不被设想为个人生活目标的正式框架——换言之，即空洞的自由主义——而是织入了人的自主性的、有质感的整体。说得略带时代错置：接受嵌入公民人文主义之中的公共团结纽带，并把它视为公民社会（civil
    society）的等价物，巴伦的论题便与今天的社群主义有相当大的重叠。
