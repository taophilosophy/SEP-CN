  source: Although widely and commonly confused with republicanism, civic 
    humanism forms a separate and distinct phenomenon in the history of Western 
    political thought. Republicanism is a political philosophy that defends a 
    concept of freedom as non-domination, and identifies the institutions that 
    protect it (Pettit 1999)[^pettit-1999]. In particular, republicanism stands 
    against two alternative theories of politics. The first is despotism, 
    especially as manifested in any form of one-man rule; a republic is 
    self-governing, and so are its denizens. The second is liberalism, which 
    posits the primacy of the autonomous individual *vis-à-vis* public order and
    government; the republican values civic engagement in order to realize a 
    form of liberty achievable only in and through the community. Republican 
    theorists sometimes refer to writings by historically antecedent authors, 
    such as Aristotle or Machiavelli, but their concern is not primarily 
    accurate interpretation. Rather, to the extent that they show an interest in
    the past, it is as a source of ideas that they find useful.
  step1: 
    尽管人们常把公民人文主义与共和主义相混同，但它其实是西方政治思想史上一个独立而独特的现象。共和主义是一种政治哲学，它捍卫“自由即非支配”的观念，并指认保护这一自由的制度（Pettit
    1999）[^pettit-1999]。具体而言，共和主义反对两种另类的政治理论。第一种是专制主义，尤其体现在任何形式的个人统治之中；共和国是自治的，其公民亦然。第二种是自由主义，它主张自主个体相对于公共秩序与政府的优先性；共和主义则珍视公民参与，以达成一种只能在社群之中并通过社群才能实现的自由。共和主义理论家有时引述更早的历史作家，如亚里士多德或马基雅维利，但他们的关切主要不在于准确解释。毋宁说，就他们对过去的兴趣而言，过去乃是他们发现有用观念的资源。
