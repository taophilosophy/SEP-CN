  source: 'Yet the fundamental premises of Renaissance civic humanism do not necessarily
    entail republicanism. Many of the cities of fifteenth-century Italy were in fact
    governed by individuals who were self-styled princes or by oligarchic dynasties.
    As Quentin Skinner observed many years ago (1978: 118–128), humanists were not
    adverse to modification of the virtues associated with civic government to suit
    conditions of a princely regime (see also Skinner 2002: 118–159)[^skinner-2002].
    Baron sought to excuse or dismiss such ideas, but his arguments have been challenged.'
  step1: '然而，文艺复兴公民人文主义的基本前提并不必然蕴含共和主义。十五世纪意大利的许多城市，事实上由自封的君主个人或寡头家族统治。正如昆廷·斯金纳许多年前所观察到的（1978:
    118–128），人文主义者并不反对为了适应君主政体的条件而修改与公民政府相关联的德性（又见 Skinner 2002: 118–159）[^skinner-2002]。巴伦试图为这类观念辩解或置之不理，但他的论证已受到挑战。'
