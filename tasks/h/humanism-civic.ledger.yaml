  source: By way of proof, Mattias narrates a notably revisionist account of 
    Roman history, according to which the early kings successfully preserved 
    peace and concord. Their replacement by consuls led naturally and 
    inescapably to the decline of the city over time into a series of civil wars
    in which various men contended for power. In the same passage, Mattias 
    indicates that Lorenzo de’Medici in Florence achieved the same effect as did
    the Roman monarchs, namely, eliminating from the city the tumults caused by 
    factionalism. A single, defining political will yields unity. Brandolini 
    thereby adopts a position precisely opposed to Bruni, who, as has been seen,
    claimed that the Florentine republican constitution was the source of 
    harmonization among the classes. Brandolini and Bruni focus on precisely the
    same problem—how to curb faction leading to class conflict—but they arrive 
    at radically different conclusions. Arguably, nothing about Bruni’s position
    is inherently more exemplary of civic humanist than Brandolini’s.
