  source: 'According to Salutati, the appropriate treatment of a tyrant is wholly
    dependent upon whether or not he is a usurper. If so, then those subject to him
    may invoke the Roman law principle that it is “lawful to repel by force the assailant
    of an individual or a piece of property and if he persists, to kill him” in order
    to justify resistance to a tyrant (1927: 86). By contrast, Salutati condemns those
    who argue that wicked princes ought to be killed even when they hold their office
    by right. He asserts that only the public authority that placed a ruler in office
    (whether a superior or the community) enjoys the right to remove him from power;
    private persons, acting in their own right, have no say in the matter.'
  step1: '据萨卢塔蒂所述，对僭主的恰当处置完全取决于他是否是篡位者。若是，那么受其统治的人便可以援引罗马法的原则——即“以武力击退侵犯个人或财产者，若其坚持，则可将其杀死”——来证明反抗僭主的正当性（1927:
    86）。与之相对，萨卢塔蒂谴责那些主张即使恶君合法持有其职位也应被杀的人。他断言，只有把统治者置于其位的公共权威（无论是上级还是共同体）才享有将其撤职的权力；以自己名义行动的私人，在此事上没有发言权。'
