  source: Machiavelli (1469–1527) is doubtless the best known of all the authors
    discussed here on account of his *Il principe* (*Prince*; c. 1513–1514) and 
    (to a lesser extent) *Discorsi* (*Discourses*; c. 1514–1519). The former is 
    a somewhat notorious advice-book for rulers who wish to gain and hold power;
    the latter evaluates the strengths of a republican system of government. 
    Machiavelli was deeply involved in governing the republic of Florence, 
    serving in several important official capacities, until a 1512 coup against 
    the regime engineered by the Medici family cost him his position. Less often
    recognized is that he wrote prolifically—poetry, plays, histories, military 
    manuals—and left us with a large collection of correspondence and dispatches
    from his diplomatic activities (Nederman 2023)[^nederman-2023]. Scholars 
    from many viewpoints, judge Machiavelli to be the epitome of civic humanist 
    republicanism during the later Italian Renaissance (Najemy 
    1996)[^najemy-1996]. The academic literature on Machiavelli’s thought is 
    immense. Any serious attempt to summarize it is a fool’s errand.
  step1: 马基雅维利（Niccolò Machiavelli, 1469–1527）无疑是本文讨论的所有作者中最著名的一位，因为他的《君主论》（*Il 
    principe*，c. 1513–1514）以及（程度较逊的）《论李维》（*Discorsi*，c. 
    1514–1519）。前者是一部相当有名的建言书，为想要获取并保持权力的统治者而作；后者则评估共和政府体制的优点。马基雅维利曾深度参与佛罗伦萨共和国的治理，担任过若干重要官职，直到
    1512 
    年由美第奇家族策划的一场政变使他失去了职位。较少被认识到的是，他著述甚丰——诗歌、戏剧、史著、军事手册——并为我们留下了大量来自其外交活动的书信与公函（Nederman
    2023）[^nederman-2023]。来自许多视角的学者都判定马基雅维利是意大利文艺复兴晚期公民人文主义共和主义的典型（Najemy 
    1996）[^najemy-1996]。关于马基雅维利思想的学术文献浩如烟海。任何严肃地试图概述它的尝试都是徒劳的。
