  source: Salutati rounds off his treatise by applying his argument to the case 
    of Caesar. He purports to prove (in a highly polemical refutation of Cicero)
    that Caesar was not a usurper, but instead held legitimate office authorized
    by the Roman people. Indeed, Salutati maintains that if Caesar seemed to 
    behave tyrannically, it was because the tumultuous condition of the times 
    called for such conduct. Caesar is to be praised as the savior of Rome, not 
    condemned as a tyrant. Consequently, it was entirely wrong for private 
    citizens to slay Caesar, since he had not usurped public power. Moreover, to
    the extent that he was serving the common good, the Romans as a people had 
    no legitimate warrant to remove him from office. Salutati thus approaches, 
    if he does not explicitly endorse, a conception of benevolent despotism that
    challenges the usual bases for distinguishing between king and tyrant.
  step1: 
    萨卢塔蒂以把他的论证应用于恺撒案来结束其论著。他声称要证明（在对西塞罗的高度论战性反驳中），恺撒不是篡位者，而是持有罗马人民授权给他的合法职位。事实上，萨卢塔蒂坚持认为，如果恺撒似乎表现得专横，那是因为动荡的时代情势要求这样的行为。恺撒应当作为罗马的拯救者而受赞扬，而不应作为僭主而受谴责。因此，私人公民刺杀恺撒是完全错误的，因为他并未篡夺公共权力。此外，就他服务于共同善而言，罗马人民作为整体并没有合法理由将其撤职。萨卢塔蒂因而接近——即使没有明确认可——一种仁政专制（benevolent
    despotism）的概念，它挑战了区分国王与僭主的通常依据。
