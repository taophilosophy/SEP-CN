- id: 29
  source: 'In both of his works, Machiavelli acknowledges the existence within every
    community of two inherently incompatible classes: the *grandi* (nobles) and the
    *popolo* (masses). The nobles seek to dominate those beneath them; the masses
    desire only to be free from domination. He clearly believes that these two parties
    can never be brought together in a peaceful fashion. Their interests are simply
    incommensurable. So, Machiavelli’s dilemma is how to avoid the nobles and the
    masses from warring against one another. He provides two possibilities. In *Il
    principe*, he remarks that a prince who wishes to maintain his power must curb
    the aspirations of the nobility, to the extent that a ruler may reasonably consider
    cold-blooded murder as one of his tools. The people, by contrast, should be treated
    mildly. Indeed, Machiavelli insists that if a prince must choose to side with
    one or the other class, he should always take up the cause of the masses. Why?
    First, because their numbers are so much greater than those of the nobles that
    they are bound to prevail. Second, because the *popolo* are so distant from the
    machinery of government headed by the prince that they are unable to observe the
    sometimes vicious means by which he must rule. Third, because they, being uneducated,
    are easily led by appearances and are unable to apprehend the truth that the prince
    seeks to conceal.'
  step1: 
    在他的两部著作中，马基雅维利承认每一个共同体内部都存在两个天生不相容的阶级：显贵（*grandi*，贵族）与平民（*popolo*，大众）。贵族寻求支配其下者；大众只求免于被支配。他显然相信，这两个党派永远无法以和平的方式被带到一起。它们的利益简直不可通约。所以，马基雅维利的困境是：如何避免贵族与大众彼此交战。他提供了两种可能。在《君主论》中，他指出，一位希望维持其权力的君主必须遏制贵族的野心，以至于统治者可以合理地考虑把冷酷无情的谋杀当作其工具之一。与之相对，人民应被温和对待。的确，马基雅维利坚持认为，如果一位君主必须在两个阶级之一中选边站，他就应始终站在大众一边。为什么？第一，因为他们的数量远多于贵族，注定会取胜。第二，因为平民（*popolo*）与君主所领导的政府机器相距如此之远，以至于他们无法观察到君主有时必须采用的残忍手段。第三，因为他们没有受过教育，容易被表象所引导，无法领会君主想要掩盖的真相。
