  source: 'One important extension of Baron’s position has been proposed by John Pocock
    (1975). Pocock takes Renaissance civic humanism to be an estimable manifestation
    of republican and patriotic collective sentiment. For Pocock as well as Baron,
    civic humanism must be considered the response to a crisis amounting to what Machiavelli
    would call an *occasione*, a moment of disorder that gives scope to the formative
    activity of a new beginning that nevertheless looks to the past in order to guide
    its future. The dilemma faced by Florentine civic humanists, according to Pocock,
    was to fit the idea of an Aristotelian polis within the framework of a Christian
    understanding of time. One answer to the experience of disorder was the explicitly
    millenarian exaltation of the leader of Florence’s republic from 1494 to 1498,
    the Dominican preacher Girolamo Savonarola. In Pocock’s view, civic humanism provided
    a secular alternative to Savanarola’s prophetic republicanism, in the form of
    a revived Aristotelian “science of virtue” as the means of overcoming the republic’s
    temporal finitude. Given doubts that have been raised with regard to the philosophical
    depth of the supposed Aristotelianism of the Florentine humanists, another recent
    scholar of civic humanism, Quentin Skinner has, as an alternative, stressed its
    Roman rather than Hellenic antecedents (Bock, Skinner, & Viroli 1990: 121–141).
    This is not just a matter of identifying sources. Skinner’s revised position means
    rather that in his view, civic humanism advocated active citizenship as a means
    to liberty from foreign and domestic domination, rather than as a self-fulfilling
    human end. In more recent times, Skinner has shifted his position from an historical
    claim to an entirely philosophical one, in line with the purely theoretical conception
    of republicanism discussed above (e.g., Skinner 1998)[^skinner-1998].'
  step1: '约翰·波科克（John Pocock）对巴伦的立场提出了一项重要扩展（1975）。波科克把文艺复兴公民人文主义视为共和的与爱国的集体情感的一种可敬的表现。对波科克与巴伦而言，公民人文主义必须被视为对一场危机的回应；这场危机相当于马基雅维利所说的“时机”（*occasione*）——一个混乱的时刻，它为一种新的开端所从事的塑造活动提供了空间，而这种新的开端仍回望过去以指引其未来。据波科克所述，佛罗伦萨公民人文主义者所面临的困境，是要把亚里士多德式城邦（polis）的观念安放进基督教时间观的框架之内。对混乱经验的一种回答，是
    1494 至 1498 年佛罗伦萨共和国领袖、多明我会布道者吉罗拉莫·萨沃纳罗拉（Girolamo Savonarola）那种明确的千禧年式颂扬。在波科克看来，公民人文主义为萨沃纳罗拉的预言式共和主义提供了一种世俗的替代，即复兴的亚里士多德式“德性之学”，作为克服共和国时间有限性的手段。鉴于人们对佛罗伦萨人文主义者所谓亚里士多德主义的哲学深度提出了质疑，另一位晚近的公民人文主义学者昆廷·斯金纳（Quentin
    Skinner）则作为替代，强调其罗马而非希腊的渊源（Bock, Skinner, & Viroli 1990: 121–141）。这不仅仅是识别来源的问题。斯金纳的修正立场毋宁意味着：在他看来，公民人文主义主张积极公民身份作为摆脱外在与内在支配的自由手段，而非作为一种自我实现的人之目的。更晚近，斯金纳已把他的立场从一种历史主张转向一种全然哲学的主张，与上文讨论的纯粹理论的共和主义概念一致（例如
    Skinner 1998）[^skinner-1998]。'
