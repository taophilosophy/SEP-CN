  source: In the first two books of the dialogue, Domenico’s case in favor of 
    the superiority of republican constitutions is demolished by Mattias. This 
    is hardly what might be expected of a civic humanist, at least if one 
    regards Bruni as the paradigmatic instance thereof. But Brandolini manages 
    to use precisely the tools of his humanist training to dismiss the main 
    values that led humanists to praise the Florentine republican constitution. 
    Of more immediate interest, at the beginning of the third and final book of 
    *De comparatione*, the discussion turns to the examination and defense of 
    the proposition that the governance of one person is best. Initially, this 
    position is supported by means of a set of analogies to the helmsman, the 
    military commander, and the head of the household. Thereafter, the debate 
    concentrates on how the rule of a single excellent man constitutes a 
    safeguard against the real possibility of destructive factionalism that 
    flows from governance by the many.
