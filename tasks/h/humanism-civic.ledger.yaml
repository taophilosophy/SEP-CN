  source: Stated simply, Machiavelli encapsulates the multiple forms of civic 
    humanism that have been examined. On the one hand, the *Discorsi* is said to
    epitomize the republican ideals of self-governance and active citizenship 
    commonly associated with the essence of civic humanism. (As mentioned in the
    Introduction, Machiavelli is one of the primary historical figures to whom 
    contemporary republican philosophers look for ideas and inspiration.) On the
    other hand, *Il principe* exemplifies the tendency of some civic humanists 
    who have been considered above to look toward monarchic regimes as the 
    preferable form of rule. A plethora of scholarly effort has been directed 
    toward attempting to reconcile these two evidently very contradictory 
    positions. Some interpreters suggest, for instance, that the *Discorsi* 
    represents his “real” views, and that *Il principe* is a satire or an 
    attempt to win back his job in the Florentine government or to reveal to his
    fellow citizens the “real” inner workings of princely regimes. Others 
    propose that *Il principe* reflects Machiavelli’s true teachings and that 
    the principles ascribed to the *Discorsi* are little more than extensions of
    his earlier tract. And some simply assert that no accord is possible.
  step1: 
    简言之，马基雅维利概括了我们已经考察的公民人文主义的多种形式。一方面，《论李维》据说体现了通常与公民人文主义本质相关联的自治与积极公民身份的共和理想。（如引言所述，马基雅维利是当代共和主义哲学家从中寻找思想与灵感的主要历史人物之一。）另一方面，《君主论》则体现了上文所考察的一些公民人文主义者的倾向，即把君主政体视为更可取的统治形式。大量学术努力试图调和这两个显然十分矛盾的立场。例如，一些解释者提出，《论李维》代表他的“真实”观点，而《君主论》则是一部讽刺之作，或是为了赢回他在佛罗伦萨政府中的职位，或是为了向同胞揭示君主政体的“真实”内部运作。另一些人提出，《君主论》反映了马基雅维利的真实教诲，而归于《论李维》的那些原则不过是其早期论著的延伸。还有一些人干脆断言不可能有任何一致。
