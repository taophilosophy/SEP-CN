  source: According to Baron, numerous civic humanist theorists emphasized that 
    the republic requires widespread civic virtue, i.e., the active engagement 
    of citizens united by a concern for the common good. The virtues of 
    citizenship are in turn developed and enhanced by being exercised in 
    upholding republican political and legal institutions and making them work 
    by being involved in their operation. Republican life is then thought to be 
    formative of the public spirit on which it rests. Republican freedom depends
    on constant civic activity. The polity is taken to cohere by means of the 
    common acceptance of standards of justice that are more than procedural 
    rules. The purpose of the commonwealth is the realization of human 
    potentiality, encouraging the flowering of all forms of creativity and 
    ingenuity insofar as they contribute to public welfare. The republic is the 
    necessary medium of self-realization, not merely the condition of 
    possibility of private endeavors. There is a link furthermore between the 
    freedom of the citizen and the independence of the republic. Citizen armies 
    and the right to bear arms are therefore common postulates of republican 
    theory. Adherents to the “Baron thesis” use all of these confluences of 
    civic humanism and republicanism to support their contention that the two 
    positions are inseparable.
  step1: 
    据巴伦所述，众多公民人文主义理论家强调，共和国需要普遍的公民德性，即公民的积极参与，他们因关切共同善而联合。公民身份的各种德性，又通过它们在维护共和政治与法律制度中的践行、并通过参与制度运作使之运转而得到发展与增强。因此，共和生活被认为塑造着它所依赖的公共精神。共和自由有赖于持续的公民活动。人们认为，政体之所以凝聚，是由于共同接受那些超越程序性规则的正义标准。共和国的目的乃是实现人的潜能，鼓励一切形式的创造力与巧智，只要它们有助于公共福祉。共和国是自我实现的必要媒介，而不仅仅是私人努力之可能性的条件。此外，公民的自由与共和国的独立之间存在联系。因此，公民军队与持械权是共和理论的常见公设。“巴伦论题”的信奉者利用公民人文主义与共和主义的这些交汇，来支持他们关于两种立场不可分离的主张。
