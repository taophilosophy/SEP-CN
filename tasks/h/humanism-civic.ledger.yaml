  source: In *De ortu*, he points out that the creation of a king was not a 
    unique or isolated event. Rather, throughout the world there are many kings 
    who rule over a plurality of territories. As these kingdoms defined and 
    expanded their geographical boundaries or spheres of jurisdiction, they 
    inevitably came into conflict. And since there was no means of arbitration 
    amongst such coequal powers, the resolution of disputes between them 
    occurred by means of armed engagements. These ensuing conflicts between 
    royal powers and their peoples are directly the function of an inescapable 
    structural limitation endemic to localized or regional kingship *per se*. It
    is not morally corrupt rulers alone who are held responsible for clashes 
    over lands and rights. Instead, any king who is performing his duties 
    properly will, Piccolomini supposes, inevitably enter into contention with 
    another king and will be compelled to turn to warfare.
  step1: 
    在《论起源》中，他指出，君主的创设并不是一个独一无二或孤立的事件。毋宁说，全世界有许多君主统治着多个领地。当这些王国界定并扩张其地理边界或管辖范围时，它们不可避免地发生冲突。由于这些同等的权力之间没有仲裁手段，它们之间争端的解决便依靠武装冲突。由此产生的这些君主权力与其人民之间的冲突，直接是地方性或区域性君主制*per
    se*所固有的、无法逃避的结构性局限的结果。不能只把道德败坏的统治者视为对土地与权利冲突负责。相反，皮科洛米尼设想，任何一位正当履行其职责的君主，都不可避免地会与另一位君主发生争执，并被迫诉诸战争。
