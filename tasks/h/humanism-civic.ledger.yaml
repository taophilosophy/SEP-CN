  source: 'Ironically, in Pocock’s adaptation of Baron’s thesis, virtue is opposed
    to property, and it is the urban, bourgeois entrepreneurs and the chancery of
    the modernizing state, the very creators of civic humanism in Baron’s mind, that
    reside on the wrong side of the fence. Baron’s civic humanists advocated a departure
    from the medieval ideals of contemplation and asceticism to assert an active life
    that included trade and profit (Jurdjevic 2001: 727–728)[^jurdjevic-2001]. In
    the Pocockean version of republicanism, civic virtue is opposed to a vision of
    citizenship that embraces the private pursuit of gain. This kind of virtuous polity
    cannot, however, be Florence—and certainly not Baron’s Florence—the *palazzi*
    of which were built with the profits of banking, manufacturing, international
    trade, and interest on the city’s public debt. Pocock’s rearward glance to Aristotle
    (and even Skinner’s to Rome) did not take into account the historical realities
    of the Renaissance Italian cities, Florence in particular.'
  step1: '具有讽刺意味的是，在波科克对巴伦论题的改写中，德性与财产相对立，而恰恰是城市资产阶级企业家与现代化国家的政府机构——在巴伦看来正是公民人文主义的创造者——站错了队。巴伦的公民人文主义者主张摆脱中世纪沉思与禁欲的理想，去肯定一种包含贸易与利润的积极生活（Jurdjevic
    2001: 727–728）[^jurdjevic-2001]。在波科克式的共和主义中，公民德性与一种拥抱私利追求的公民身份观相对立。然而，这种有德性的政体不可能是佛罗伦萨——当然更不可能是巴伦的佛罗伦萨——那里的宫邸（*palazzi*）是用银行业、制造业、国际贸易的利润以及城市公债的利息建造的。波科克对亚里士多德（甚至斯金纳对罗马）的回望，没有考虑到文艺复兴意大利城市——尤其是佛罗伦萨——的历史现实。'
