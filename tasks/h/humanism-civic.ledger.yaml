  source: Beyond seeking to identify civic humanism with a particular time and 
    place, Baron studied the political culture of Renaissance Florence as an 
    instance of an exemplary mode of communal existence. Florentine civic 
    humanism represented for him furthermore a decisive turning point in 
    history. For Baron it was an epochal event that, by looking backward to 
    antiquity, pointed forward to modernity—a movement that he embraced 
    wholeheartedly as a liberating, civilizing, progressive process. The advent 
    of civic humanism marked for Baron the victory of secular economic, social, 
    and political ideals versus the asceticism, religious obscurantism, and 
    hierarchy of the Middle Ages (see Yoran 2007)[^yoran-2007]. Civic humanism 
    provided the vital vehicle for the translation of the exalted ancient idea 
    of citizenship to the modern age. The humanist defense of republican liberty
    against monarchical tyranny announced for him the beginnings of modern 
    democratic thought, elevated by an educational ideal of classical 
    inspiration, and accompanied by renewed cultural creativity. Civic humanism 
    was thus the harbinger of the unequivocally positive trends in modern 
    European civilization. The value of such achievements appeared all the more 
    compelling since they were not theoretical postulates derived from abstract 
    speculation, but represented historically realized exempla.
  step1: 
    除了试图把公民人文主义与特定的时空相联系外，巴伦还把文艺复兴佛罗伦萨的政治文化当作某种典范性社群生存方式的范例来研究。对他而言，佛罗伦萨公民人文主义还代表了历史上的一个决定性转折点。在巴伦看来，它是一个划时代的事件——它回望古代，又指向现代；是一场他全心全意拥抱的运动，把它视为一种解放、文明、进步的过程。公民人文主义的到来，在巴伦那里标志着世俗的经济、社会与政治理想，战胜了中世纪的禁欲主义、宗教蒙昧与等级制（见
    Yoran 
    2007）[^yoran-2007]。公民人文主义为把崇高的古代公民观念转译到现代提供了重要载体。人文主义者对共和自由对抗君主专制的捍卫，在他那里宣告了现代民主思想的发端；这种思想为一种古典灵感的教化理想所提升，并伴随着焕然一新的文化创造力。因此，公民人文主义是现代欧洲文明中那些明确积极趋势的先声。这些成就的价值显得更有说服力，因为它们不是从抽象思辨中得出的理论公设，而是历史地实现的具体范例。
