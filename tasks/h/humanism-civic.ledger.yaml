    humanitas*）。作为伟大的人文主义者帕尔米耶里（Palmieri）、瓦拉（Valla）与帕特里齐（Patrizi）的同时代人，他以著作享有极佳声誉；尤其是他的书信，无论在风格还是内容上都可与最优秀的人文主义文学媲美。他曾在帝国宫廷担任秘书与外交官，最终沿教会升迁之梯而上，升任教皇庇护二世（Pius
    II）——常被称为第一位“人文主义教皇”。然而，在他最著名的政治思想著作《论罗马帝国的起源与权威》（*De ortu et auctoritate 
