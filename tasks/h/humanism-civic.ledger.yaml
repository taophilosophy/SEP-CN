  source: It should be obvious, then, that the characteristics of the civic 
    humanist propensities ascribed by scholars to Machiavelli may be understood 
    in a vast number of ways. Given the diversity of interpretations, it is 
    perhaps of greater utility to identify a single central theme shared by *Il 
    principe* and the *Discorsi* and various civic humanists already discussed. 
    Specifically, Machiavelli, like prior Florentine humanists, confronted in 
    his writings the quarrels that arose from conflicts between contending sets 
    of interests, whether classes or political entities. All of the authors 
    previously addressed praised their favored form of government (republic, 
    monarchy, empire) on the grounds that it introduced harmony and peace 
    between clashing groups.
  step1: 
    因此应当显而易见，学者们归于马基雅维利的公民人文主义倾向的特征，可以用无数种方式来理解。鉴于解释的多样性，识别一个《君主论》与《论李维》以及我们已经讨论的诸位公民人文主义者所共有的单一中心主题，或许更有用处。具体而言，马基雅维利与先前的佛罗伦萨人文主义者一样，在其著作中面对由竞争利益集团（无论是阶级还是政治实体）之间冲突所引发的纷争。此前处理过的所有作者都称赞他们偏好的政府形式（共和国、君主制、帝国），理由是它给相互冲突的群体带来了和谐与和平。
