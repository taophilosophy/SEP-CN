- id: 33
  source: 'Why was Baron inattentive to pre-Renaissance European republicanism? The
    answer may be traced to what civic humanism represented to him: modernity, secularity,
    rationality; in sum, the “glory” of the Renaissance in contrast with the benighted
    Middle Ages. Scholars have long since realized that a dividing line drawn between
    medieval and early modern periods is wholly unwarranted (Nederman 2009)[^nederman-2009].
    Just as civic humanism as the designation of an intellectual movement within the
    tradition of Western political theory proves to be quite capacious, so its existence
    and development should be regarded as more fluid historically than has often been
    claimed.'
  step1: 
    为何巴伦对前文艺复兴的欧洲共和主义漠不关心？答案可以追溯到公民人文主义对他而言所代表的东西：现代性、世俗性、理性；一言以蔽之，与蒙昧的中世纪形成对照的文艺复兴之“光荣”。学者们早已意识到，在中世纪与早期现代时期之间划定一条分界线是完全无根据的（Nederman
    2009）[^nederman-2009]。正如公民人文主义作为西方政治理论传统内部一场思想运动的名称，证明颇为宽泛，其存在与发展在历史上也应被视为比通常所声称的更为流动。
