- id: 3
  source: 'Baron used the term civic humanism to describe the fusion of two distinct
    currents of Florentine thought: apolitical so-called “Petrarchan” humanism, on
    the one hand, and the Guelf tradition of patriotic resistance by the Florentine
    city-state to imperial domination, on the other (Kallendorf 1996)[^kallendorf-1996].
    The “rebirth” of ancient letters and wisdom (*studia humanitas*) marked a revolutionary
    change in the European mind, but it remained limited to the contemplative pleasure
    and edification of quietist poets and scholars until the beginning of the fifteenth
    century. Thereafter, it merged with the assertive defense of the sovereign independence
    of the increasingly rich, powerful, and confident merchant cities of Italy. The
    fusion was effected, according to Baron, as a response to a crisis, namely, the
    reaction of the intellectual and political leadership of Florence to the aggressive
    expansionism of the despots of Milan. The resulting exaltation of liberty combined
    patriotic self-defense with the upholding of a republican way of life that departed
    from medieval ideals by asserting worldly values and embracing the active life
    in a manner evocative of the republics of antiquity. According to Baron’s thesis,
    in the face of military danger the patterns of society, economy, and politics
    came to cohere in a culture, i.e., an ethos infused with an educational vision.
    The main champions of this were the great chancellors of the Florentine Republic,
    Coluccio Salutati and, especially, Leonardo Bruni, top civil servants and public
    intellectuals combined, who restored the practical pertinence of classical learning
    in the process of establishing the terms of a new civil consensus.'
  step1: 
    巴伦用“公民人文主义”一词来描述佛罗伦萨思想中两股不同潮流的融合：一方面是脱离政治的所谓“彼特拉克式”人文主义，另一方面是佛罗伦萨城邦爱国抵抗帝国统治的圭尔夫传统（Kallendorf
    1996）[^kallendorf-1996]。古代典籍与智慧（*studia 
    humanitas*）的“再生”标志着欧洲心智的一场革命性变革，但在十五世纪开始之前，它仍局限于静修诗人与学者的沉思之乐与教化之功。此后，它便与意大利日益富有、强大而自信的商贾城市对其主权独立的坚决捍卫相融合。据巴伦所述，这一融合是对一场危机的回应，即佛罗伦萨的知识界与政界领导层对米兰僭主之侵略扩张主义的反应。由此产生的对自由的颂扬，把爱国自卫与对一种共和生活方式的坚持结合起来；后者背离中世纪理想，肯定现世价值，并以一种令人联想到古代共和国的方式拥抱积极生活。依照巴伦的论题，面对军事危险，社会、经济与政治的模式在一种文化中凝聚，即一种为教育愿景所浸润的精神气质。这种文化的主要捍卫者是佛罗伦萨共和国的历任大法官——科卢奇奥·萨卢塔蒂，尤其是莱昂纳多·布鲁尼；他们集高级文官与公共知识分子于一身，在确立新公民共识之条款的过程中恢复了古典学问的实际相关性。
