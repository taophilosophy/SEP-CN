- id: 30
  source: The *Discorsi* treats class conflict in an entirely different way, 
    namely, as a positive or productive feature of a well-developed republican 
    system. Machiavelli’s epitome of an ideal republic is ancient Rome, in which
    tumult was rife. According to him, by permitting rather than suppressing the
    collision between these two sets of interests, Rome succeeded in actualizing
    and maintaining the paramount value of liberty. In a republic of the Roman 
    sort, the nobility (via the Senate) has the main responsibility for 
    governing, but the people check that power by means of countervailing 
    offices (such as the tribunes) and popular dissent. The struggle between 
    them actually generates the liberty of the whole, both in terms of 
    self-government unbeholden to either external forces or to tyranny and by 
    assuring that the people’s desire not to be dominated is achieved.
  step1: 
    《论李维》以全然不同的方式对待阶级冲突，即把它当作发展完善的共和体制的一个积极或生产性的特征。马基雅维利对理想共和国的典型设想是古代罗马，那里动乱频仍。据他说，罗马通过容许而非压制这两组利益之间的碰撞，成功地实现并维持了自由这一至高价值。在罗马式的共和国中，贵族（经由元老院）承担治理的主要责任，但人民通过制衡性的官职（如保民官）与民众异议来制约这一权力。它们之间的斗争实际上产生了整体的自由，既表现为不依附于外部力量或暴政的自治，也确保了人民不被支配的愿望得以实现。
