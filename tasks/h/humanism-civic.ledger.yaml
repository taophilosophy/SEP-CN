  source: 'James Hankins has taken this point a step further by severing Italian Renaissance
    humanism from political forms entirely. Hankins aims to challenge directly Baron,
    Pocock and similar advocates of civic humanism who equate it with republican liberty,
    while also tempering the long-standing alternative view that humanism was primarily
    an apolitical literary and cultural movement (2019: xii). Hankins argues instead
    that humanists were driven by what he terms “virtue politics,” by which he means
    improvement of “the character and wisdom of the ruling class with a view to bringing
    about a happy and flourishing commonwealth” (2019: 37). The great humanists thus
    ought to be understood not as advocates for any particular “constitutional form
    of the polity” or for “the express consent of the governed” (2019: 37). Rather,
    political legitimacy rested on moral legitimacy. Only with Machiavelli, Hankins
    contends, was the link to the virtue that humanism propounded decisively broken
    (2019: 449–475). But *pace* Hankins (2019: xxi), humanists in fact disputed about
    which type of government was most desirable, as shall be discussed presently,
    and certainly did not discount that one system should be preferred over others.'
  step1: '詹姆斯·汉金斯（James Hankins）更进一步，把意大利文艺复兴人文主义与政治形式彻底切割开来。汉金斯旨在直接挑战巴伦、波科克及类似把公民人文主义等同于共和自由的倡导者，同时也调和那种长期存在的另类观点——人文主义主要是一种脱离政治的文字与文化运动（2019:
    xii）。汉金斯主张，毋宁说人文主义者是由他所谓的“德性政治”所驱动的；所谓德性政治，他指的是改进“统治阶级的品性与智慧，以期带来一个幸福而繁荣的共同体”（2019:
    37）。因此，不应把伟大的人文主义者理解为任何特定“政体的宪政形式”或“被治理者的明确同意”的倡导者（2019: 37）。毋宁说，政治合法性奠基于道德合法性。汉金斯主张，只有到马基雅维利，人文主义所宣扬的德性之纽带才被决定性地切断（2019:
    449–475）。但是，撇开汉金斯不论（2019: xxi），事实上人文主义者确实争论过何种政体最为可取，下文即将讨论，他们当然也没有低估一种体制应当优于其他体制这一点。'
