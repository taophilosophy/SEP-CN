  source: Piccolomini’s argument starts, but does not finish, with kingship. 
    Kings were first authorized in the earliest times of human history in order 
    to shield the rights of weaker men from injury by the stronger. This is a 
    theme common to numerous republican civic humanists, drawn from a position 
    held by Cicero, who was an important source for them. The king is regarded 
    as the personification of justice. His moral character outshines that of his
    fellows, so he does not require law as the foundation of his rule, since his
    judgments are so rooted in a sense of justice and equity that they enjoy the
    force of law. A conventional account of the breakdown of kingship would 
    involve the declining morality of successive kings, leading to tyranny. By 
    contrast, Piccolomini detects a quite different inherent weakness in 
    political arrangements associated with kingship, regardless of the moral 
    qualities of a particular royal incumbent.
  step1: 
    皮科洛米尼的论证始于君主制，却并非终于君主制。君主最早在人类历史的最初时代获得授权，以保护弱者的权利免受强者的伤害。这是一个为众多共和派公民人文主义者所共有的主题，源于西塞罗所持的立场，西塞罗是他们的重要来源。君主被视为正义的化身。他的道德品格照耀其同类，因此他不需要法律作为其统治的基础，因为他的判决如此植根于正义与公正之感，以至于它们享有法律的效力。关于君主制崩溃的通常叙述，会涉及历代君主道德的堕落，最终导向暴政。与之相对，皮科洛米尼在与君主制相关联的政治安排中，察觉了一种相当不同的内在弱点，这种弱点与某位特定君主在位者的道德品质无关。
