    与之相对，公民人文主义是一个史学建构。按照学者们的惯常用法，该术语指涉一批兴起于意大利文艺复兴时期、尤其活跃于佛罗伦萨的思想家；他们投身于公共参与（无论在理论上还是实践上），其价值与中世纪过去根本对立。公民人文主义的“发明”主要与汉斯·巴伦（Hans
    Baron, 1900–1988）相关联，他是著名的德裔美国历史学家（Fubini 1992）[^fubini-1992]。虽然他早在 1925 
    年就以德语原形（*Bürgerhumanismus*）使用过这一短语，但它的流行源于 1955 
    年其经典著作《早期意大利文艺复兴的危机：古典主义与暴政时代的公民人文主义与共和自由》（1966 
    年修订版）的出版。在这部著作以及随后依托它的论著中（许多收录于 Baron 1968 与 1988 
    年[^baron-1968][^baron-1988]），他发展出了后来所谓的“巴伦论题”（Witt 1996; Hankins 
    1995）[^hankins-1995][^witt-1996]。不过，巴伦并非第一位提出如下主张的学者：十五世纪意大利城市中兴起的这种人文主义形式，主要促进的是公民的积极生活（*vita
    activa*），而非通常归于人文主义者的文学与语文学追求。在 1952 与 1954 
    年用意大利语写作并出版的两部著作中，欧金尼奥·加林（Eugenio 
    Garin）为一种几乎与巴伦相同的立场辩护：文艺复兴人文主义，尤其如其在佛罗伦萨所宣扬的那样，反映出一种显著的转变——从以沉思为典型的中世纪，转向对以追求共同善为目的的公民行动的优先（Garin
    1947 
    [1965]）。（若非纯粹出于偶然的原因，公民人文主义的史学标签本可能很容易成为“加林论题”。）就当前语境而言，应当注意：公民人文主义的一些倡导者倾向于共和主义，但后者并非由前者所蕴含。
