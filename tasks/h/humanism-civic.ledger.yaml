  source: Baron’s interpretation assumes that civic humanism has a core that 
    holds together all of those with whom is associated. In other words, there 
    is presumed to be a single set of principles to which all civic humanists 
    must subscribe in order to merit that appellation. Pocock attempted to 
    circumvent this problem by treating republicanism in linguistic rather than 
    programmatic terms. As such it was available to be picked up, selectively 
    and thematically, as circumstances dictated or allowed. Taken on its face, 
    Pocock’s conception of republicanism invites us, in turn, say the same about
    civic humanism, namely, that it need not be equated with a single political 
    position (that is, republicanism). Although Pocock does not acknowledge it, 
    the general discursive ambit of civic humanism licenses Italian thinkers to 
    apply its language to an extensive range of political systems and phenomena.
  step1: 
    巴伦的解释假定，公民人文主义有一个核心，把所有与之相关联的人凝聚在一起。换言之，人们假定存在一套单一的原则，所有公民人文主义者都必须信奉，才配得上这一称谓。波科克试图绕过这一问题，他不用纲领性的措辞，而用语言性的措辞来对待共和主义。如此一来，它便可供人根据情势的指使或允许，选择性地、就主题性地取用。就字面而言，波科克的共和主义概念反过来又邀请我们对公民人文主义作同样理解，即：它不必等同于某一种政治立场（也就是共和主义）。尽管波科克没有承认这一点，但公民人文主义的普遍话语领域，使意大利思想家可以把它的语言运用于范围广大的政治体制与现象。
