  source: Another Florentine humanist—albeit it not of the stature of Bruni and 
    Salutati—went still further in praising monarchy. Aurelio Lippo Brandolini 
    (c.1454–1497) in his *De comparatione reipublicae et regni* (*On the 
    Comparison of Republic and Kingdoms*; c. 1490) defends kingship against the 
    charge made by his fellow Italians (especially, Florentines) that it was 
    inferior to republican government. Writing at the court of the Hungarian 
    King Mattias, whose patronage he briefly enjoyed, Brandolini constructed a 
    dialogue between a Florentine merchant, Domenico, and the king himself, in 
    which every conventional rationale for the superiority of republics to other
    constitutional systems, especially monarchies, is proposed and examined, 
    only to be decimated. Regardless of whether or not Brandolini wrote *De 
    comparatione* merely as piece of flattery for King Mattias, his arguments 
    for kingship still warrant serious attention.
  step1: 另一位佛罗伦萨人文主义者——尽管地位不及布鲁尼与萨卢塔蒂——在赞美君主制方面走得更远。奥雷利奥·利波·布兰多利尼（Aurelio Lippo 
    Brandolini, c.1454–1497）在他的《论共和国与王国的比较》（*De comparatione reipublicae et 
    regni*，c. 
    1490）中，为君主制辩护，反对其意大利同胞（尤其是佛罗伦萨人）所指控的、君主制劣于共和政府的主张。布兰多利尼在匈牙利国王马加什（Mattias）的宫廷写作，曾短暂受其庇护；他构建了一场对话，一方是佛罗伦萨商人多梅尼科（Domenico），另一方是国王本人。在这场对话中，所有关于共和国优越于其他宪政体制（尤其是君主制）的通行理由都提出来接受审视，结果被驳得体无完肤。无论布兰多利尼写《论共和国与王国的比较》是否仅仅是向国王马加什献媚之作，他为君主制所作的论证仍值得严肃对待。
