- id: 31
  source: Machiavelli recognizes that he is adopting an unusual perspective, 
    since customarily the blame for the collapse of the Roman Republic has been 
    assigned to warring factions that eventually ripped it apart. By contrast, 
    he insists that precisely those conflicts generated a “creative tension” 
    that was the source of Roman liberty. Other republican models (such as those
    adopted by Sparta or Venice) produced weaker political systems, ones that 
    are either stagnant or prone to decay when circumstances change. The 
    ultimate sign of the unique greatness of the Roman Republic is its conquest 
    of huge amounts of territory, as a result of the *grandi* and the *popolo* 
    setting aside their ultimately interminable struggles (at least for a time) 
    in order to cooperate in the subjugation and exploitation of vast lands. 
    Class struggle is thus socialized and put to effective use. It has been 
    suggested, and with good reason, that a signal element of Machiavelli’s 
    political project was to promote Florence as the new Rome that will impose 
    its domination over the rest of Italy. It is perhaps not too great a stretch
    to call him a civic humanist with imperialistic pretensions (Hörnqvist 
    2004)[^hörnqvist-2004].
  step1: 
    马基雅维利认识到他采取了一种不寻常的视角，因为通常罗马共和国崩溃的责任被归于最终将其撕裂的战争派系。与之相对，他坚持认为，恰恰是那些冲突产生了作为罗马自由之源的“创造性张力”。其他共和模式（如斯巴达或威尼斯所采用的）产生了较弱的政治体制，要么停滞不前，要么在情势变化时易于衰败。罗马共和国独特伟大的最终标志，是它征服了巨量领土，其结果是显贵与平民放下了他们最终无休止的斗争（至少暂时），以便合作征服与开发广袤的土地。阶级斗争由此被社会化并得到有效利用。有人提出，并且很有理由，马基雅维利政治计划的一个显著要素，是推动佛罗伦萨成为那个将把其支配强加于意大利其余地区的新罗马。称他为怀有帝国主义野心的公民人文主义者，也许并不算太过牵强（Hörnqvist
    2004）[^hörnqvist-2004]。
