  source: 'The *Laudatio* explains the greatness of Florence in terms of its self-governing
    political system. The institutions both foster and are fostered by the public
    virtue of citizens. Bruni postulates a triad of fundamental republican principles
    that Florence draws together: liberty (*libertas*), equality (*aequalitas*), and
    just law (*ius*). The Florentine constitution is so organized that citizens are
    free because they are equal before the law. These qualities bring us to one of
    Bruni’s favorite concepts in his political theory: harmonious cooperation and
    balance among all groups and classes within the city. Other Italian cities, he
    observes, are rife with class conflict between the great men and mass of the people.
    The Florentine republic differs because the entire body of its citizens participate,
    as appropriate, in the government, which, because it is checked in its power,
    resists the temptation of tyranny, whether by the few or the many. Civic humanism,
    at least as understood by Baron and scholars working in a similar vein, is perfectly
    captured in the account of Florence in the *Laudatio*.'
  step1: 
    《颂词》以佛罗伦萨的自治政治体制来解释其伟大。制度既培育公民的公共德性，也受到它的培育。布鲁尼设定佛罗伦萨所聚合的三元根本共和原则：自由（*libertas*）、平等（*aequalitas*）与公正之法（*ius*）。佛罗伦萨宪法的组织方式使公民获得自由，因为他们在法律面前是平等的。这些品质把我们引向布鲁尼政治理论中他最喜爱的概念之一：城市内所有群体与阶级之间和谐的合作与平衡。他观察到，其他意大利城市充斥着大人与民众之间的阶级冲突。佛罗伦萨共和国之所以不同，是因为其全体公民酌情参与政府，而政府因其权力受到制衡，得以抵抗暴政的诱惑——无论暴政来自少数人还是多数人。公民人文主义，至少就巴伦与循此思路工作的学者们的理解而言，在《颂词》对佛罗伦萨的记述中得到了完美的体现。
