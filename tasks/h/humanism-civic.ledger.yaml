  source: 'One of the most notable figures to take up this agenda was Coluccio Salutati
    (1331–1406) in a treatise entitled *De tyranno* (*On Tyranny*; 1400 [1927]. Salutati
    had been not only Bruni’s instructor but also his immediate predecessor as Chancellor
    of the Florentine republic. In the view of Salutati, there are valid reasons that
    one should stand prepared to countenance tyrannical rulers at times. In support
    of what might seem at first glance an odd position for a humanist to embrace,
    he introduces a distinction between two types of tyrants: those who rule without
    valid title (usurpers) and those who possess a legitimate claim to office but
    use their powers unlawfully and unjustly as a result of their prideful characters.
    This difference is decisive for Salutati, whose main concern is with the propriety
    of slaying tyrants in general and with the murder of Julius Caesar in particular.'
  step1: 承担这一议程的最著名人物之一是科卢奇奥·萨卢塔蒂（Coluccio Salutati, 1331–1406），见于他题为《论僭主》（*De 
    tyranno*，1400 
    [1927]）的论著。萨卢塔蒂不仅是布鲁尼的老师，也是他出任佛罗伦萨共和国掌玺大臣的直接前任。在萨卢塔蒂看来，有时人们有充分的理由应该准备容忍僭主式的统治者。为了支持这个乍一看对人文主义者而言颇为古怪的立场，他引入了一种区分：一类是缺乏正当名分而统治的人（篡位者），另一类是对职位拥有合法主张、却因其傲慢的品性而非法地、不公正地使用其权力的人。这一区别对萨卢塔蒂具有决定意义，他的主要关切在于诛杀僭主的一般正当性，尤其是刺杀尤利乌斯·恺撒的问题。
