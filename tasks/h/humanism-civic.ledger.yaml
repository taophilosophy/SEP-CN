- id: 6
  source: As previously suggested, both Baron and Garin generally regarded civic
    humanism as an equivalent to or as a particular variant of republicanism, 
    meaning a conception of politics in which government is in principle the 
    common business of the citizens. The “city” provides the environment—a 
    public space—for human fulfillment. More specifically, they appear to 
    believe that civic humanism derives from classical republicanism of some 
    variety ascribed to Aristotle, Cicero, and Polybius among others (although 
    knowledge of Book VI of the latter’s *Histories* before the beginning of the
    sixteenth century is disputed [Nederman 2016; Hankins 2016; Monfasani 
    2016])[^hankins-2016][^monfasani-2016][^nederman-2016]. Civic humanism is 
    linked in principle to a classical educational program that goes beyond the 
    formative capacity of participatory citizenship itself and involves the 
    conscious revival of ancient ideals. Republican candor, simplicity of 
    manner, opposition to ostentation, luxury and lucre, are common, though not 
    universal, republican themes. Civic humanists, it is said, promote 
    republican ideals responding to the fragility of the republic and the need 
    to provide against its corruption and decay with the passage of time.
  step1: 
    如前所述，巴伦与加林一般都把公民人文主义视为共和主义的等价物或一种特殊变体；所谓共和主义，是指这样一种政治概念：政府原则上乃是公民的共同事务。“城市”为人的自我实现提供了环境——一个公共空间。更具体地说，他们似乎相信，公民人文主义源于某种归于亚里士多德、西塞罗与波利比乌斯等人的古典共和主义（尽管十六世纪开始之前对波利比乌斯《历史》第六卷的了解程度尚有争议
    [Nederman 2016; Hankins 2016; Monfasani 
    2016]）[^hankins-2016][^monfasani-2016][^nederman-2016]。公民人文主义原则上与一项古典教育计划相联系，这项计划超越参与式公民身份本身的塑造能力，并涉及对古代理想的有意识复兴。共和派的坦诚、举止简朴、反对铺张、奢侈与钱财，是常见的（尽管非普遍的）共和主义主题。据说，公民人文主义者之所以推进共和理想，是为了回应共和国的脆弱性，以及为防备其随着时间推移而腐败衰败的需要。
