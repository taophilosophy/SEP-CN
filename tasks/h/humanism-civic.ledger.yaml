  source: Consequently, the political model of an independent network of 
    kingships is incompatible with the very purpose which warranted the creation
    of kings, namely, the maintenance of just and harmonious relations among 
    human beings. The decentralized distribution of royal power ultimately 
    produces an effect which is exactly contrary to that intended. Empowered as 
    the agent of social harmony, kingship proves to be its enemy, confounding 
    rather than reinforcing the justice which the ruler is charged with 
    upholding. Notice here how the problems of conflict and the absence of 
    harmony, addressed by many civic humanists, manifest themselves in 
    Piccolomini’s thought as well. His solution, however, is quite different 
    from his Florentine colleagues. Since the particularity of royal regimes 
    runs afoul of the ordained end of political power, the attainment of 
    justice, and the order that comes with it, can only be achieved by a 
    universality of political rule, that is, a single world empire. In imperial 
    government alone does political power finally attain a form consistent with 
    the aim of its original authorization. Once again, one may plausibly assert 
    that civic humanist principles might move in a direction quite divergent 
    from republicanism (Lee 2018).
  step1: 
    因此，独立君主制网络的政治模式，与当初授权创设君主的那个目的本身——即维护人与人之间公正和谐的关系——不相容。王权的分散分布最终产生一种与意图截然相反的效果。作为社会和谐的代理人而被赋权的君主制，结果证明是和谐的敌人，它扰乱了而非强化了统治者受命维护的正义。请注意，许多公民人文主义者所处理的冲突与缺乏和谐的问题，如何同样在皮科洛米尼的思想中显现。然而，他的解决方案与其佛罗伦萨同僚大不相同。既然君主政体的特殊性违背了政治权力的既定目的，那么正义以及随之而来的秩序，就只能通过政治统治的普遍性——即单一的世界帝国——来实现。只有在帝国的政府中，政治权力才最终获得与其最初授权的目的一致的形式。又一次，人们可以合理地主张，公民人文主义的原则可能朝着与共和主义颇为不同的方向移动（Lee
