  source: As previously noted, Baron posited that the birth of civic humanism 
    occurred precisely out of the 1402 crisis in Florence. This position has 
    been challenged on various historical grounds, most notably by Seigel 
    (1966). One problem with Baron’s claim stems from his evident lack of 
    familiarity with the political philosophy of preceding centuries. Long 
    before the beginning of the *quattrocento*, political authors (some of 
    Florentine origin) had undertaken the defense of the republican system of 
    government generally and of the Roman Republic in particular in terms 
    redolent of civic humanism. Writing c. 1265, a Florentine civil servant 
    exiled to France, Brunetto Latini (1993), argued for the superiority of 
    republics (communes) over other types of constitution and also described in 
    detail the mechanisms of republican governance. Around 1300, another 
    Italian, the Paris-educated scholastic philosopher Ptolemy of Lucca (1997), 
    composed an extensive brief favoring the Roman Republic as the ideal form of
    government (Blythe 2009; but see also Yun 2008 and Nederman and Sullivan 
    2012)[^blythe-2009][^nederman-2012][^yun-2008]. The size of the list of 
    pro-republican political theorists writing before 1402 could be multiplied 
    many times over.
  step1: 如前所述，巴伦假定公民人文主义的诞生恰恰源于佛罗伦萨 1402 年的危机。这一立场已因各种历史理由而受到挑战，最显著的是西格尔（Seigel,
    1966）。巴伦主张的一个问题，源于他显然不熟悉此前几个世纪的政治哲学。早在*quattrocento*开始之前很久，政治作家（其中有些是佛罗伦萨出身）就已经以带有公民人文主义意味的措辞，承担起对共和政府体制一般地、尤其是对罗马共和国特殊地的辩护。约
    1265 年，一位流亡法国的佛罗伦萨文官布鲁内托·拉蒂尼（Brunetto Latini, 
    1993）论证了共和国（communes，公社）相对于其他类型宪法的优越性，并详细描述了共和治理的机制。约 1300 
    年，另一位意大利人、受教于巴黎的经院哲学家卢卡的托勒密（Ptolemy of Lucca, 
    1997）撰写了一份详尽的辩护书，赞成把罗马共和国视为理想的政府形式（Blythe 2009；但另见 Yun 2008 与 Nederman and 
    Sullivan 2012）[^blythe-2009][^nederman-2012][^yun-2008]。1402 
    年之前写作的、支持共和的政治理论家名单，其规模可以成倍地扩充。
