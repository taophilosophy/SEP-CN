      Holbach’s character must have been remarkable to have maintained a salon in which the espousers of political and religious reform met so freely and so often with visitors who either cannot have been accustomed to such open dialogue or who were themselves parts of the establishment under attack. Indeed Rousseau, who himself came to feel unwelcome by the coterie, nevertheless memorializes Holbach in *La nouvelle Heloïse*, as the paradoxical figure, Wolmar, an atheist who nonetheless embodies all of the Christian virtues. In addition to his good character, Holbach’s generosity at table (his dinners and especially his wine were famously good) and in supporting many of his acquaintances may explain his success at being both a pillar and a critic of society. Perhaps, also, Holbach was not in the eyes of many of his contemporaries as clearly a radical as some other members of his coterie. He did publish some of the most notorious works of the French Enlightenment, including *Le Christianisme dévoilé* (*Christianity Unveiled*), *Système de la nature* (*System of Nature*) and *Le Bon Sens* (*Common Sense*). These books evoked long and heated responses from such notable figures as Voltaire, abbé Bergier, and Frederick the Great; *System of Nature* and *Common Sense* were condemned by the parliament of Paris and publicly burned. Holbach, however, was not in his own time as notorious as his books. He was careful always to publish anonymously, so that those who did not know him or who did not care to think of him in that way, might have remained at least partially ignorant of his religious and political views.
    step1: |-
      霍尔巴赫的性格必然十分杰出，才能维持这样一个沙龙：在这里，政治与宗教改革的主张者如此自由、如此频繁地与那些要么不习惯于这种公开对话、要么本身就是受攻击的体制之组成部分的访客会面。事实上，卢梭本人虽然最终感到不被这个圈子欢迎，却仍在《新爱洛伊斯》（*La nouvelle Heloïse*）中把霍尔巴赫纪念为那个矛盾性人物沃尔玛：一个无神论者却体现了全部基督教美德。除了良好的性格外，霍尔巴赫在餐桌上的慷慨（他的晚宴、尤其是他的酒以出色著称）以及对许多熟人的资助，或许可以解释他为何既能成为社会的栋梁、又能成为社会的批评者。此外，在许多同时代人眼中，霍尔巴赫或许并不像其圈子中的某些其他成员那样是明显的激进分子。他确实出版了法国启蒙运动中最臭名昭著的一些著作，包括《揭穿基督教》（*Le Christianisme dévoilé*；英译 *Christianity Unveiled*）、《自然体系》（*Système de la nature*；英译 *System of Nature*）和《常识》（*Le Bon Sens*；英译 *Common Sense*）。这些书引发了伏尔泰、贝吉耶神父和腓特烈大帝等著名人物的长久而激烈的回应；《自然体系》与《常识》被巴黎议会谴责并公开焚毁。然而，霍尔巴赫在他自己的时代并不像他的书那样臭名昭著。他总是小心地匿名出版，因此那些不认识他、或不愿以那种方式看待他的人，或许对他的宗教与政治观点至少部分地一无所知。
