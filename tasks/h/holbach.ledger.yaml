    source: |-
      Holbach was born in 1723 in Edesheim. He was raised in Paris, principally by his uncle, Franciscus Adam d’Holbach, and attended the University of Leiden from 1744 to 1748 or 1749. Holbach particularly enjoyed the parties there. It is likely that, at least at first, the dinners Holbach gave in Paris were modelled on the parties he attended at Leiden. In 1749, Holbach married his second cousin, Basile-Geneviève d’Aine. About 1753 or 1754 both his uncle, Franciscus, and his father in law died, leaving Holbach a considerable fortune.
    step1: |-
      霍尔巴赫于 1723 年生于埃德斯海姆。他在巴黎长大，主要由其叔父弗朗西斯科·亚当·德霍尔巴赫（Franciscus Adam d’Holbach）抚养，并于 1744 年至 1748 或 1749 年在莱顿大学就读。霍尔巴赫尤其喜欢那里的聚会。很可能，至少起初，霍尔巴赫在巴黎举办的晚宴是仿照他在莱顿参加的聚会。1749 年，霍尔巴赫与他的远房表妹巴齐尔-热纳维耶芙·德艾讷（Basile-Geneviève d’Aine）结婚。大约 1753 或 1754 年，他的叔父弗朗西斯科与他的岳父相继去世，留给霍尔巴赫可观的财富。
    step2: |-
      霍尔巴赫于 1723 年生于埃德斯海姆。他在巴黎长大，主要由其叔父弗朗西斯科·亚当·德霍尔巴赫（Franciscus Adam d’Holbach）抚养，并于 1744 年至 1748 或 1749 年间就读于莱顿大学。他尤其喜欢那里的聚会。很可能，至少在最初，霍尔巴赫在巴黎举办的晚宴正是仿照他在莱顿所参加的聚会。1749 年，霍尔巴赫与他的远房表妹巴齐尔-热纳维耶芙·德艾讷（Basile-Geneviève d’Aine）结婚。约 1753 或 1754 年，他的叔父弗朗西斯科与他的岳父相继去世，留给霍尔巴赫一笔可观的财富。
