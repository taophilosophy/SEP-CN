      Holbach’s metaphysics, then, is mechanistic, in that any correct explanation of an event will refer only to matter, motion, and the laws which describe their combination. Holbach’s ambitious attempt to draw from this sparse metaphysics answers to questions often thought to involve something more than this, his *Système de la nature*, is badly marred, in some places, by over-simplification and, in others, by dogmatism. Indeed Goethe in his memoirs (*Dichtung und Wahrheit*, Volume 9, 490–492) credits the account of nature in this work with forever turning him away from French philosophy. Nevertheless, Holbach’s metaphysics does form the basis for his engaging religious, ethical, and political views, and it does so by means of an innovative recasting of a traditional account of the properties of matter.
    step1: |-
      那么，霍尔巴赫的形而上学是机械论的，因为对任一事件的任何正确解释都只须诉诸物质、运动以及描述它们结合方式的规律。霍尔巴赫试图从这种贫乏的形而上学中得出对人们通常认为涉及更多东西的问题的答案，这种雄心勃勃的尝试，即他的《自然体系》，在某些地方被过度简化严重破坏，在另一些地方则被独断论严重破坏。事实上，歌德在其回忆录（《诗与真》第 9 卷，490–492）中，把这部著作中的自然观归功于使他永远地远离了法国哲学。尽管如此，霍尔巴赫的形而上学确实构成了他那引人入胜的宗教、伦理与政治观点的基础，而且它是通过一种对传统物质性质学说的创新性重铸来实现这一点的。
