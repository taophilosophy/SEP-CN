    source: |-
      Paul-Henri Thiry, Baron d’Holbach was a philosopher, translator, and prominent social figure of the French Enlightenment. In his philosophical writings Holbach developed a deterministic and materialistic metaphysics, which grounded his polemics against organized religion as well as his utilitarian ethical and political theory. As a translator, Holbach made significant contributions to the European Enlightenment in science and religion. He translated German works on chemistry and geology into French, summarizing many of the German advances in these areas in his entries in Diderot’s Encyclopedia. Holbach also translated important English works on religion and political philosophy into French. Holbach remains best known, however, for his role in Parisian society. The close circle of intellectuals that Holbach hosted and, in various ways, sponsored produced the Encyclopedia and a number of revisionary religious, ethical, and political works that contributed to the ideological basis for the French Revolution. Despite the radical views of many members of his coterie, however, Holbach’s broader visiting guest list included many of the most prominent intellectual and political figures in Europe. His salon, then, was at once a shelter for radical thought and a hub of mainstream culture.
    step1: |-
      保尔-亨利·提利，霍尔巴赫男爵（Baron d’Holbach）是法国启蒙运动时期的哲学家、翻译家与重要的社会人物。在其哲学著作中，霍尔巴赫发展出一种决定论的、唯物论的形而上学，这种形而上学奠定了他反对有组织宗教的论战，也奠定了他功利主义的伦理与政治理论。作为翻译家，霍尔巴赫在科学与宗教方面为欧洲启蒙运动作出了重要贡献。他把德国关于化学与地质学的著作译成法语，并在其为狄德罗《百科全书》撰写的词条中概述了德国在这些领域的许多进展。霍尔巴赫还把英国关于宗教与政治哲学的重要著作译成法语。然而，霍尔巴赫至今最广为人知的，仍是他在巴黎社会中的角色。霍尔巴赫所接待并以多种方式资助的密切知识分子圈子产生了《百科全书》以及一系列修正性的宗教、伦理与政治著作，这些著作促成了法国大革命的思想基础。然而，尽管其圈子许多成员持激进观点，霍尔巴赫更广泛的来访宾客名单却包括欧洲最显赫的许多知识与政治人物。因此，他的沙龙既是激进思想的庇护所，也是主流文化的中心。
    step2: |-
      保尔-亨利·提利，霍尔巴赫男爵（Baron d’Holbach）是法国启蒙运动时期的哲学家、翻译家，也是当时巴黎社会的重要人物。他在哲学著作中发展出一种决定论的唯物论形而上学，这种形而上学既奠定了他反对有组织宗教的论战，也奠定了他功利主义的伦理与政治理论。作为翻译家，霍尔巴赫在科学与宗教领域为欧洲启蒙运动作出了重要贡献：他把德国关于化学与地质学的著作译成法语，并在为狄德罗《百科全书》撰写的词条中概述了德国在这些领域的诸多进展；他还把英国关于宗教与政治哲学的重要著作译成法语。然而，霍尔巴赫至今最广为人知的，仍是他与巴黎社会的关系。他所接待并以多种方式资助的密切知识分子圈子，产生了《百科全书》以及一系列修正性的宗教、伦理与政治著作，这些著作为法国大革命提供了思想基础。不过，尽管其圈子的许多成员持激进观点，霍尔巴赫更广泛的访客名单却包括欧洲许多最显赫的知识与政治人物。因此，他的沙龙既是激进思想的庇护所，也是主流文化的中心。
