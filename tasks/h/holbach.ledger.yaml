      Holbach’s political theory, which he developed for the most part after his metaphysics and ethics, extends his ethical views to the state. Having described human interest as happiness and preservation in the *System of Nature* and *Common Sense* in 1770 and 1772, Holbach went on to develop a notion of the just state or, to use his own term, “ethocracy,” founded for the purposes of securing the general welfare. This theory is presented in several works published during the 1770s, *La politique naturelle* (*Natural Politics*, 1773), *Système social* (*The Social System*, 1773), *La morale universelle* (*Universal Morality*, 1776), and *Ethocratie* (*Ethocracy*, 1776). Holbach’s foundational view is that the most valuable thing a person seeking self-preservation can do is to unite with another person: “Man is of all beings the most necessary to man” (*Système social*, 76; cf. Spinoza’s *Ethics* IVP35C1, C2, and S). Society, when it is just, unites for the common purpose of preservation and the securing of welfare, and society contracts with government for this purpose.
    step1: |-
      霍尔巴赫的政治理论主要是在其形而上学与伦理学之后发展出来的，它把他的伦理观点扩展到国家。在 1770 年与 1772 年的《自然体系》与《常识》中把人的利益描述为幸福与保存之后，霍尔巴赫进而发展出一种正义国家的观念，或者用他自己的话说，“德治主义”，其创立目的是为了确保公共福祉。这一理论在 1770 年代出版的几部著作中得到阐述：《自然政治》（*La politique naturelle*；英译 *Natural Politics*，1773）、《社会体系》（*Système social*；英译 *The Social System*，1773）、《普遍道德》（*La morale universelle*；英译 *Universal Morality*，1776）和《德治主义》（*Ethocratie*；英译 *Ethocracy*，1776）。霍尔巴赫的基础性观点是：一个寻求自我保存的人所能做的最有价值的事，就是与另一个人联合：“人是所有存在者中对人最必需的”（《社会体系》76；参看斯宾诺莎《伦理学》IVP35C1、C2 与 S）。社会，当其正义时，为保存与确保福祉这一共同目的而联合，而社会为此目的与政府订立契约。
