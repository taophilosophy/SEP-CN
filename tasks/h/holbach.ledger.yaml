      However, Holbach managed, despite what one might expect, to keep his coterie firmly in the mainstream of European society. French nobles, as well as ambassadors from countries across Europe—Denmark, England, Naples, Saxe-Gotha, Saxe-Coburg-Gotha, Wurtemburg, and Sweden—attended his dinners. So did prominent intellectuals of all kinds, including, at different times and with different degrees of enthusiasm, the philosopher and novelist Jean-Jacques Rousseau, the mathematician Jean Le Rond d’Alembert, the historian Edward Gibbon, the writer Horace Walpole, the chemist Joseph Priestley, the social critic Cesare Beccaria, the philosopher Nicolas-Antoine Boulanger, the statesman and scientist Benjamin Franklin, the actor David Garrick, the philosopher Claude-Adrien Helvétius, the philosopher David Hume, the economist Adam Smith, and the novelist Laurence Sterne. Holbach was known in France not primarily as a political radical but as *le premier maître d’hôtel de la philosophie*. Many in Paris coveted invitations to rue Royale, and Holbach’s house was the first stop for many prominent international visitors.
    step1: |-
      然而，尽管人们或许会预期相反，霍尔巴赫却设法使其圈子牢固地保持在欧洲社会的主流之中。法国贵族，以及来自欧洲各国——丹麦、英格兰、那不勒斯、萨克森-哥达、萨克森-科堡-哥达、符腾堡和瑞典——的大使，都出席他的晚宴。各种显赫的知识分子也是如此，包括在不同时期、以不同程度的热情到访的哲学家与小说家让-雅克·卢梭、数学家让·勒朗·达朗贝尔、历史学家爱德华·吉本、作家霍勒斯·沃波尔、化学家约瑟夫·普里斯特利、社会批评家切萨雷·贝卡里亚、哲学家尼古拉-安托万·布朗热、政治家与科学家本杰明·富兰克林、演员大卫·加里克、哲学家克洛德-阿德里安·爱尔维修、哲学家大卫·休谟、经济学家亚当·斯密，以及小说家劳伦斯·斯特恩。在法国，霍尔巴赫主要不是以政治激进分子著称，而是以“哲学界的首席膳食总管”（*le premier maître d’hôtel de la philosophie*）著称。巴黎许多人渴望得到皇家街的邀请，而霍尔巴赫的宅邸是许多显赫的国际访客的第一站。
    step2: |-
      然而，尽管人们或许会预期相反，霍尔巴赫却设法使其圈子牢固地处于欧洲社会的主流。法国贵族，以及来自欧洲各国——丹麦、英格兰、那不勒斯、萨克森-哥达、萨克森-科堡-哥达、符腾堡与瑞典——的大使，都出席他的晚宴。各种显赫的知识分子同样如此，其中包括在不同时期、以不同程度热情到访的：哲学家兼小说家让-雅克·卢梭、数学家让·勒朗·达朗贝尔、历史学家爱德华·吉本、作家霍勒斯·沃波尔、化学家约瑟夫·普里斯特利、社会批评家切萨雷·贝卡里亚、哲学家尼古拉-安托万·布朗热、政治家兼科学家本杰明·富兰克林、演员大卫·加里克、哲学家克洛德-阿德里安·爱尔维修、哲学家大卫·休谟、经济学家亚当·斯密，以及小说家劳伦斯·斯特恩。在法国，霍尔巴赫主要不是以政治激进分子，而是以“哲学界的首席膳食总管”（*le premier maître d’hôtel de la philosophie*）著称。巴黎的许多人渴望得到皇家街的邀请，而霍尔巴赫的宅邸是许多显赫国际访客的第一站。
