      Holbach’s coterie met for thirty years, from the early 1750s until about 1780. During that time his first wife died and he married her younger sister, Charlotte Suzanne d’Aine, with whom he had four children. Holbach wrote prolifically throughout this time. According to Vercruysse, Holbach authored or coauthored over fifty books and over four hundred articles. He died in 1789.
    step1: |-
      霍尔巴赫的圈子聚会了三十年，从 1750 年代初直到约 1780 年。在此期间，他的第一任妻子去世，他娶了她的妹妹夏洛特-苏珊娜·德艾讷（Charlotte Suzanne d’Aine），与她育有四个孩子。整个这段时间霍尔巴赫著作等身。据韦尔克吕斯（Vercruysse），霍尔巴赫独自或合作撰写了五十多部著作和四百多篇文章。他于 1789 年去世。
