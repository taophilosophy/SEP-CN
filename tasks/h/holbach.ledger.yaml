      Holbach’s account of matter may best be understood against the background of the Lockean account, which is more familiar and from which in large part it is developed. (Israel 2006 traces the sources of the views of Holbach and the coterie in detail.)[^israel-2006] On Locke’s account of bodies (Book 2, Chapter 8 of his *Essay*), all bodies possess “real” or “primary” qualities (solidity, extension, figure, number, and motion). Real qualities are those which are “inseparable” from the bodies themselves. To take Locke’s example (*Essay* 2.8.9), a grain of wheat will have solidity, extension, figure and so on when it is intact, and it will retain these properties whatever happens to it. Locke distinguishes primary qualities from powers in bodies to produce sensations in observers, which he calls secondary qualities. Secondary qualities, for example, are color, sound, taste, and so on. Because he hesitates to call secondary qualities real qualities, it is clear that Locke takes them to have a metaphysical status different from that he gives primary qualities.
    step1: |-
      霍尔巴赫的物质学说最好放在洛克学说的背景下理解，后者更为人熟知，而且霍尔巴赫的学说在很大程度上由此发展而来。（Israel 2006 详细追溯了霍尔巴赫及其圈子的观点来源。）[^israel-2006] 按照洛克关于物体的学说（其《人类理解论》第二卷第八章），一切物体都拥有“实在的”或“第一性的”性质（坚实性、广延、形状、数目与运动）。实在性质是那些与物体本身“不可分离”的性质。以洛克的例子（《人类理解论》2.8.9）来说，一粒小麦在完好时会有坚实性、广延、形状等等，而且无论发生什么它都会保留这些性质。洛克把第一性质与物体中产生观察者感觉的能力（他称之为第二性质）区分开来。第二性质例如是颜色、声音、味觉等等。由于他犹豫着是否把第二性质称为实在性质，可见洛克认为它们具有与第一性质不同的形而上学地位。
