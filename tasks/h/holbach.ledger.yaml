    source: |-
      Holbach used his great wealth to throw the dinner parties for which he is famous. He owned a house in Paris in rue Royale, Butte Saint-Roch, which, generally, had a guest list restricted to serious intellectuals, and a chateau at Grandval where, in addition to his coterie, Holbach also hosted social friends and relatives. Holbach’s coterie included intellectuals who, although their positions varied on many issues, shared at least a willingness to entertain views that many would have thought too radical to be discussed in social settings. The coterie met from the 1750s into the 1780s. The group evolved over time, but its core members, Alan Kors has argued, were Denis Diderot, the encyclopedist; the diplomat and cultural critic Friedrich-Melchior Grimm; the naturalist Charles-Georges Le Roy; the writer and critic Jean-François Marmontel; the historian and priest abbé Guillame-Thomas-François Raynal; the doctor Augustin Roux; the poet and philosopher Jean-François de Saint-Lambert; the writer Jean-Baptiste-Antoine Suard; the pamphleteer François-Jean, chevalier de Chastellux, the pamphleteer abbé André Morellet; and the philosopher Jacques-André Naigeon. Many of these men were, like Holbach, avowed atheists and many also pushed radical, even revolutionary political agendas. So the general character of his coterie might suggest that Holbach was a figure on the fringe of Parisian society, a kind of eccentric parvenu with a taste for scandal.
    step1: |-
      霍尔巴赫用他的巨额财富举办那些令他闻名的晚宴。他在巴黎圣罗克山岗的皇家街拥有一座宅邸，其宾客名单通常限于严肃的知识分子；他在格朗瓦勒还有一座城堡，除了其核心圈子外，霍尔巴赫也在那里接待社交朋友与亲属。霍尔巴赫的圈子包括这样一些知识分子：他们虽然在许多问题上的立场各不相同，但至少都愿意接纳那些许多人会认为过于激进、不宜在社交场合讨论的观点。该圈子从 1750 年代一直活动到 1780 年代。这个群体随时间演变，但艾伦·科尔斯（Alan Kors）认为，其核心成员是百科全书派狄德罗；外交家与文化批评家弗里德里希-梅尔希奥·格林；博物学家夏尔-乔治·勒鲁瓦；作家与批评家让-弗朗索瓦·马蒙泰尔；历史学家兼神父纪尧姆-托马斯-弗朗索瓦·雷纳尔；医生奥古斯坦·鲁；诗人与哲学家让-弗朗索瓦·德·圣朗贝尔；作家让-巴蒂斯特-安托万·苏阿尔；小册子作者弗朗索瓦-让·德·沙斯特吕骑士；小册子作者安德烈·莫尔莱神父；以及哲学家雅克-安德烈·奈热翁。这些人中的许多人，如霍尔巴赫一样，是公开承认的无神论者，其中许多人也推动激进的、甚至革命性的政治议程。因此，其圈子的总体特征可能使人以为霍尔巴赫是巴黎社会边缘的人物，是某种嗜好丑闻的怪僻暴发户。
    step2: |-
      霍尔巴赫用他的巨额财富举办那些令他闻名遐迩的晚宴。他在巴黎圣罗克山岗的皇家街拥有一座宅邸，那里的宾客名单通常限于严肃的知识分子；他还在格朗瓦勒有一座城堡，除核心圈子外，也在那里接待社交朋友与亲属。霍尔巴赫的圈子包括这样一些知识分子：他们虽在许多问题上立场各异，但至少都愿意接纳那些许多人认为过于激进、不宜在社交场合讨论的观点。该圈子自 1750 年代一直活动到 1780 年代。这个群体随时间而演变，但据艾伦·科尔斯（Alan Kors）论证，其核心成员是：百科全书派狄德罗；外交家与文化批评家弗里德里希-梅尔希奥·格林；博物学家夏尔-乔治·勒鲁瓦；作家与批评家让-弗朗索瓦·马蒙泰尔；历史学家兼神父纪尧姆-托马斯-弗朗索瓦·雷纳尔；医生奥古斯坦·鲁；诗人与哲学家让-弗朗索瓦·德·圣朗贝尔；作家让-巴蒂斯特-安托万·苏阿尔；小册子作者弗朗索瓦-让·德·沙斯特吕骑士；小册子作者安德烈·莫尔莱神父；以及哲学家雅克-安德烈·奈热翁。这些人中，许多人与霍尔巴赫一样是公开的无神论者，其中不少还推动激进的、甚至革命性的政治议程。因此，其圈子的总体特征可能会使人以为霍尔巴赫是巴黎社会边缘的人物，是某种嗜好丑闻的怪僻暴发户。
