      Turning to a brief overview of Wolff’s philosophical works, the *German Logic* is intended, quite in contrast to Thomasius’, as a handbook for the acquisition, justification, and orderly presentation of scientific cognition. So, in addition to the now expected treatment of concepts, propositions, and syllogisms, Wolff’s text contains discussion of drawing universal propositions from individual experiences, of experiments, and of science and its distinction from faith and opinion. Moreover, the *German Logic* contains Wolff’s mature presentation of his mathematical method, through which we proceed from definitions and axioms to the formulation of theorems and postulates, and ultimately to demonstrations, and it outlines how the method can be employed for the purpose of scientific discovery (for discussion, see Frketich 2019; Gava 2019)[^frketich-2019][^gava-2019][^gava-2019-2]. Significantly, it is this method that gains widespread application throughout Wolff’s philosophical enterprise, including in his metaphysics.
    step1: |-
      简要浏览沃尔夫的哲学著作：与托马修斯的逻辑学恰成对照，《德语逻辑学》旨在成为一部关于科学认识的获得、辩护与有序呈现的手册。因此，除了如今意料之中的对概念、命题和三段论的论述之外，沃尔夫的文本还包含对从个别经验引出普遍命题的讨论、对实验的讨论，以及对科学及其与信仰和意见之区分的讨论。此外，《德语逻辑学》包含沃尔夫对其数学方法的成熟呈现——经由这一方法，我们从定义和公理进到定理与公设的表述，最终进到证明——并且它概述了这一方法如何可以用于科学发现的目的（相关讨论见 Frketich 2019；Gava 2019）[^frketich-2019][^gava-2019][^gava-2019-2]。值得注意的是，正是这一方法在沃尔夫的整个哲学事业中获得广泛应用，包括在他的形而上学中。
    step2: |-
      大体看看沃尔夫的哲学著作。《德语逻辑学》与托马修斯的逻辑学恰成对照：它立志成为一部手册，教人如何获得科学认识、为之辩护、并有条理地陈述出来。于是，除了概念、命题、三段论这些如今意料之中的论题，书里还讨论了如何从个别经验引出普遍命题，讨论了实验，也讨论了科学是什么、科学如何区别于信仰与意见。此外，《德语逻辑学》还包含沃尔夫对其数学方法的成熟陈述：循此方法，我们从定义和公理出发，进到定理与公设的表述，最终抵达证明；书里还概述了怎样把这一方法用于科学发现（相关讨论见 Frketich 2019；Gava 2019）[^frketich-2019][^gava-2019][^gava-2019-2]。值得注意的是，后来在沃尔夫的全部哲学事业中——包括他的形而上学——得到广泛应用的，正是这一方法。
