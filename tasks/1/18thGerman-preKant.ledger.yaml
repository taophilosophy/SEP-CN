      This conception of the human mind as fundamentally active is taken up again in Thomasius’ lone substantial contribution to metaphysics, the *Essay on the Essence of Spirit*, where Thomasius distinguishes spirit (*Geist*) from matter in virtue of its activity. While this would appear to result in a metaphysical dualism, Thomasius complicates things by endorsing a hierarchy of spirits, not just between the human being and God, but also a class of spirits responsible for various effects in bodies (such as heating and cooling). Yet, his further postulation of an “air and light spirit [*ein Lufft- und Licht-Geist*]” which fills the spaces between parts of matter, not to mention his apparent identification of space itself as “pure spirit” (Thomasius 1709: 60, 167–8)[^thomasius-1709] muddles the original, starkly dualistic picture.
    step1: |-
      这种人类心灵根本能动的构想，在托马修斯对形而上学的唯一实质性贡献——《论精神本质试论》——中再次出现；托马修斯在那里凭借活动性把精神（*Geist*）与物质区分开来。虽然这似乎会导致一种形而上学二元论，但托马修斯又通过认可一种精神的等级序列而使事情复杂化：不仅在人与上帝之间存在等级，还有一类精神负责物体中的各种效果（如加热与冷却）。然而，他进一步设定一种充满物质各部分之间空间的“空气与光之精神［*ein Lufft- und Licht-Geist*］”，更不必说他把空间本身明显地等同于“纯粹精神”（Thomasius 1709: 60, 167–8）[^thomasius-1709]，这使得原本截然二元论的图景变得含混。
