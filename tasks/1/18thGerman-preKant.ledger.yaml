      Christian August Crusius was born 10 June 1715 in Leuna, near Halle, the son of a pastor (and his mother was a pastor’s daughter). He matriculated at the University of Leipzig in 1734, where he studied a number of subjects but was particularly interested in theology and philosophy. At Leipzig, Crusius came under the influence of the philosopher (and physician) Adolf Friedrich Hoffmann (1707–1741), a disciple of Andreas Rüdiger (1673–1731) who had been a close associate of Thomasius. Crusius attained the *Magister* in philosophy in 1737 and habilitated in philosophy in 1740. He followed his philosophical studies with a baccalaureat in theology in 1742, though he would proceed to seek a position in the philosophy faculty. To this end, he defended two dissertations in philosophy, one of which, the *Dissertatio philosophica de usu et limitibus principii rationis determinantis, vulgo sufficientis* (*Philosophical Dissertation on the Use and Limits of the Principle of Determining Reason, commonly called Sufficient*) of 1743 was a critical discussion of the principle of sufficient reason. He became a professor of philosophy (*extraordinarius*) at Leipzig in 1744.
    step1: |-
      克里斯蒂安·奥古斯特·克鲁修斯（Christian August Crusius）1715 年 6 月 10 日生于哈勒附近的莱纳（Leuna），是一位牧师的儿子（母亲也是牧师之女）。他 1734 年注册入莱比锡大学，修习多门学科，但尤其对神学与哲学感兴趣。在莱比锡，克鲁修斯受到哲学家（兼医生）阿道夫·弗里德里希·霍夫曼（Adolf Friedrich Hoffmann，1707–1741）的影响；霍夫曼是安德烈亚斯·吕迪格（Andreas Rüdiger，1673–1731）的门徒，而吕迪格曾是托马修斯的亲密同道。克鲁修斯 1737 年获哲学硕士（*Magister*）学位，1740 年在哲学系取得教授资格。1742 年，他在哲学学业之后又取得神学学士学位，不过他随后寻求的是哲学系的职位。为此，他答辩了两篇哲学学位论文，其中一篇——1743 年的《论决定理由原则（俗称充足理由原则）的运用与界限的哲学学位论文》（*Dissertatio philosophica de usu et limitibus principii rationis determinantis, vulgo sufficientis*，*Philosophical Dissertation on the Use and Limits of the Principle of Determining Reason, commonly called Sufficient*）——是对充足理由原则的批判性讨论。1744 年，他成为莱比锡的哲学教授（编外，*extraordinarius*）。
    step2: |-
      克里斯蒂安·奥古斯特·克鲁修斯（Christian August Crusius）1715 年 6 月 10 日生于哈勒附近的莱纳（Leuna），父亲是牧师，母亲也是牧师之女。1734 年他注册入莱比锡大学，科目修了不少，兴致却特别放在神学与哲学上。在莱比锡，对他影响最深的是哲学家（兼医生）阿道夫·弗里德里希·霍夫曼（Adolf Friedrich Hoffmann，1707–1741）；霍夫曼是安德烈亚斯·吕迪格（Andreas Rüdiger，1673–1731）的门徒，而吕迪格当年是托马修斯的亲密同道。克鲁修斯 1737 年获哲学硕士（*Magister*）学位，1740 年取得哲学教授资格。1742 年，他在哲学学业之外又拿下神学学士学位，不过他谋求的始终是哲学系的教职。为此他答辩了两篇哲学学位论文，其中一篇——1743 年的《论决定理由原则（俗称充足理由原则）的运用与界限的哲学学位论文》（*Dissertatio philosophica de usu et limitibus principii rationis determinantis, vulgo sufficientis*，*Philosophical Dissertation on the Use and Limits of the Principle of Determining Reason, commonly called Sufficient*）——就是对充足理由原则的批判性讨论。1744 年，他出任莱比锡哲学编外教授（*extraordinarius*）。
