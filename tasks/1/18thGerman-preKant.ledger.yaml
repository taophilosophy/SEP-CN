      Thomasius’s moral theory is a theory of the will. He held that in moral matters, the will dominates reason. While human beings have free choice if not externally constrained, the will is not free; rather, it is dominated by human affects—our passions, impulses, and desires. Like Hobbes, Thomasius believed that even though subject to such inner (psychological) constraints, the will still chooses (with the aid of reason); it consciously wills. And a conscious choice is precisely what is required for a (good) action to be considered moral: a good instinct or good inclinations may make us good, may even be desirable, but by itself this is not enough to make us moral as morality requires a conscious act of will. The trouble with morality arises because the will is determined by evil desires, in particular, lust, ambition, and avarice. Although there are noble sentiments as well, which similarly influence the will, they are in conflict with the negative dispositions. The conflict can be brought to a positive conclusion only by appeal to divine grace (God’s salvation), and Thomasius *Application of the Doctrine of Morals* is notable for its positive treatment of mystical experience.
    step1: |-
      托马修斯的道德理论是一种意志理论。他主张，在道德事务中，意志支配理性。人类若不受外在约束便拥有自由选择，但意志并不自由；毋宁说，意志被人的激情所支配——我们的激情、冲动和欲望。与霍布斯一样，托马修斯相信，尽管受制于这类内在的（心理的）约束，意志仍然在选择（借助理性的帮助）；它有意识地意愿着。而一个有意识的选择，恰恰是一个（好的）行动被视为道德行动所要求的：善良的本能或好的倾向可以使我们成为好人，甚至可能值得欲求，但这本身不足以使我们成为道德的人，因为道德要求一个有意识的意志行为。道德的麻烦在于，意志被邪恶的欲望所决定，尤其是贪欲、野心和贪婪。虽然也有高尚的情感同样影响着意志，但它们与那些消极的倾向处于冲突之中。这一冲突只有靠诉诸神恩（上帝的拯救）才能获得正面的了结；托马修斯的《道德学说运用》以对神秘经验的正面处理而著称。
