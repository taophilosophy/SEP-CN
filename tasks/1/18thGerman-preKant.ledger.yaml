      The controversy itself was the result of long-simmering tensions between Wolff and the Pietists. Wolff’s turn to lecturing on philosophical topics, such as metaphysics (including a treatment of natural theology), beginning in 1710, not to mention his discussion in the *German Logic* of Scriptural interpretation, provoked the ire of the theology faculty and led to warnings to their students about attending Wolff’s lectures (on account of his “*Atheisterey*”; cf. Beutel 2007: 165–6)[^beutel-2007]. The publication of Wolff’s *German Metaphysics* in 1719, with its peculiar proof of God’s existence and apparent endorsement of natural necessitation, provided a broad target for their critical attention. This largely behind-the-scenes friction broke into the open with Wolff’s address on 12 July 1721, on the occasion of the transition of the pro-rectorship from himself to Lange, in which he defended the consistency of Confucian (i.e., non-Christian) practical philosophy with Enlightened reason (and Wolffian moral philosophy in particular; cf. M. Albrecht 1985)[^albrecht-1985].
    step1: |-
      这场争论本身是沃尔夫与虔敬派之间长期酝酿的紧张关系的结果。沃尔夫自 1710 年起转而讲授哲学主题，如形而上学（包括对自然神学的处理），更不必提他在《德语逻辑学》中对《圣经》解释的讨论，这激怒了神学系，并导致他们警告自己的学生不要去听沃尔夫的课（理由是他的“无神论勾当”［*Atheisterey*］；cf. Beutel 2007: 165–6）[^beutel-2007]。1719 年《德语形而上学》的出版——带着它独特的上帝存在证明和对自然必然化的明显背书——为他们批判性的注意提供了一个大靶子。这场大体上幕后进行的摩擦，随着沃尔夫 1721 年 7 月 12 日的演讲而公开化；时值代理校长职务由他移交给朗格，沃尔夫在演讲中为儒家（即非基督教的）实践哲学与启蒙理性的相容性辩护（尤其为沃尔夫式的道德哲学辩护；cf. M. Albrecht 1985）[^albrecht-1985]。
