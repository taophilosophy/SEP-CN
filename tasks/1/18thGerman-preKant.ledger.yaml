      这一系列文本第一次呈现了所谓“莱布尼茨—沃尔夫学派”哲学；这一哲学后来主导了德国的哲学版图。当然，毫无疑问，沃尔夫的哲学体系深受莱布尼茨的浸润：沃尔夫本人承认，阅读莱布尼茨 1684 年的论文《论认识、真理与观念》——尤其是莱布尼茨对观念的分类——曾点燃一盏“大灯”，照进了他的《德语逻辑学》（cf. GL “Vorrede”）；此外，沃尔夫本人报告说，他在《德语形而上学》的本体论、宇宙论和理性心理学部分吸纳了许多莱布尼茨式概念（cf. Wuttke 1841: 141–142）[^wuttke-1841]。即便如此，沃尔夫指出，当他开始撰写这套哲学教科书时，人们几乎看不到莱布尼茨的文本，无从得见更宏大的莱布尼茨哲学（Wuttke 1841: 140–141; cf. also Wilson 1994）[^wilson-1994][^wuttke-1841]；因此他对把自己的体系命名为“莱布尼茨—沃尔夫学派”持保留态度——这一名号他认为出自其学生格奥尔格·贝恩哈德·比尔芬格（Georg Bernhard Bilfinger）之手（Wuttke 1841: 142；关于这一命名的来源与恰当性，见 Dyck 2025: 121–124 与 Favaretti Camposampiero 2026）[^dyck-2025][^favaretti-2026][^wuttke-1841]。莱布尼茨对沃尔夫影响的范围广受争论（cf. Corr 1975; École 1979）[^corr-1975][^école-1979]，但无论如何清楚的是：莱布尼茨既不是沃尔夫思想发展的唯一影响者，也并非在每种情况下都是最重要的影响者；埃伦弗里德·瓦尔特·冯·契恩豪斯（Ehrenfried Walther von Tschirnhaus，1651–1708）、约翰·洛克以及晚期经院哲学家等人物，也对沃尔夫的形而上学、认识论和科学论施加过重要影响（Neveu 2018; Leduc 2018; Dyck 2021a）[^dyck-2021a][^leduc-2018][^neveu-2018]。
    step2: |-
      这一系列文本首次呈现了所谓“莱布尼茨—沃尔夫学派”哲学——正是这一哲学，日后主导了德国的哲学版图。沃尔夫的哲学体系深受莱布尼茨浸润，这一点当然没有疑问：沃尔夫自己承认，读莱布尼茨 1684 年的论文《论认识、真理与观念》——尤其是其中对观念的分类——曾为他点亮一盏“大灯”，后来融进了《德语逻辑学》（cf. GL “Vorrede”）；他还自陈，在《德语形而上学》讲本体论、宇宙论和理性心理学时，吸纳了不少莱布尼茨式概念（cf. Wuttke 1841: 141–142）[^wuttke-1841]。话虽如此，沃尔夫也指出：动笔写这套哲学教科书时，莱布尼茨的文本市面上寥寥无几，想借此窥见莱布尼茨哲学的全貌根本无从谈起（Wuttke 1841: 140–141; cf. also Wilson 1994）[^wilson-1994][^wuttke-1841]。因此他不同意把自己的体系称作“莱布尼茨—沃尔夫学派”——这名号按他的说法出自学生格奥尔格·贝恩哈德·比尔芬格（Georg Bernhard Bilfinger）之手（Wuttke 1841: 142；这一命名的来源与是否恰当，见 Dyck 2025: 121–124 与 Favaretti Camposampiero 2026）[^dyck-2025][^favaretti-2026][^wuttke-1841]。莱布尼茨对沃尔夫的影响究竟有多大，向来聚讼纷纭（cf. Corr 1975; École 1979）[^corr-1975][^école-1979]；但有一点无论如何是清楚的：塑造沃尔夫思想的，莱布尼茨既非唯一，也未必处处最重要——埃伦弗里德·瓦尔特·冯·契恩豪斯（Ehrenfried Walther von Tschirnhaus，1651–1708）、约翰·洛克，还有晚期经院诸家，都对他的形而上学、认识论和科学论施加过重要影响（Neveu 2018; Leduc 2018; Dyck 2021a）[^dyck-2021a][^leduc-2018][^neveu-2018]。
