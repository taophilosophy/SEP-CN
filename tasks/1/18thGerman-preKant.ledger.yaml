      Rounding out Wolff’s major philosophical works of this period, the *German Ethics* is composed of four parts, a theoretical part that treats the foundation of practical philosophy and three practical parts that present a doctrine of duties that human beings have towards themselves, God, and others. The central notion in Wolff’s ethics is the (metaphysical) notion of perfection which concerns the “agreement” of elements in a given manifold (cf. GM §152), and which is cognized through our intellectual powers (and the history and importance of this notion for Wolff, see Goldenbaum 2024)[^goldenbaum-2024]. It is the cognition of the (apparent) perfection in an action that moves us to act, a fact that accounts for Wolff’s emphasis on the duty to cultivate our understanding among our duties to ourselves so that we can be moved to act in (what are in fact) the most perfect ways (Walschots 2024)[^walschots-2024]. Promoting the perfection of ourselves and others serves for Wolff as the universal rule in accordance with which we ought to choose between two (or more) possible actions (GE §12). That is to say, when making a free choice we ought to consider whether the action “promotes the perfection of our inner and outer state” (GE §2) and that means considering whether the state of the soul and the body accords with the prior state or contradicts it. The outcome has greater perfection to the extent that it contributes to the continued “natural human state and its harmonious preservation over time”(GE §2). The natural human state Wolff envisions is the state of the soul in its manifold efforts to find truth, and everything has to be done to maximize that state. It so happens, that this is where happiness lies as well (Lanzini Stobbe 2024)[^lanzini-2024], and as Wolff indicates at the end of the ethics, it is incumbent upon human beings to ensure not only their own perfection/happiness, but to “contribute as much as possible to the happiness of others” (GE §767).
    step1: |-
      作为沃尔夫这一时期主要哲学著作的收官，《德语伦理学》由四个部分构成：一个理论部分论实践哲学的基础，三个实践部分呈述人对自身、对上帝和对他人所负的义务学说。沃尔夫伦理学的核心概念是（形而上学的）完善概念；它关乎一个给定杂多中诸元素的“一致”（cf. GM §152），并通过我们的理智能力被认识（关于这一概念对沃尔夫的历史与重要性，见 Goldenbaum 2024）[^goldenbaum-2024]。正是对一个行动中（表面上的）完善的认识推动我们去行动；这一事实说明了沃尔夫为什么在人对自身的义务中强调培养知性的义务——以便我们能够被推动，以（事实上）最完善的方式行动（Walschots 2024）[^walschots-2024]。在沃尔夫那里，促进我们自身与他人的完善，充当着普遍规则；我们应当按照它在一（或多个）可能的行动之间作出选择（GE §12）。也就是说，在作自由选择时，我们应当考虑该行动是否“促进我们内在与外在状态的完善”（GE §2）；这意味着考虑灵魂与身体的状态是否合于先前的状态，还是与之相悖。其结果在多大程度上有助于“人的自然状态及其随时间的和谐保持”（GE §2）的延续，就在多大程度上具有更大的完善。沃尔夫所设想的人的自然状态，是灵魂多方面寻求真理的状态；为了最大化这一状态，一切都必须去做。恰好，这也是幸福之所在（Lanzini Stobbe 2024）[^lanzini-2024]；而且正如沃尔夫在伦理学末尾所表明的，人有责任不仅确保自身的完善/幸福，还要“尽可能多地促进他人的幸福”（GE §767）。
    step2: |-
      沃尔夫这一时期的主要哲学著作，以《德语伦理学》收尾。全书四部分：理论部分论实践哲学的基础，三个实践部分分述人对自身、对上帝、对他人所负的义务学说。沃尔夫伦理学的核心概念是（形而上学的）完善：它关乎给定杂多中诸元素的“一致”（cf. GM §152），要靠我们的理智能力来认识（这一概念的历史及其对沃尔夫的重要性，见 Goldenbaum 2024）[^goldenbaum-2024]。推动我们行动的，正是对一个行动中（表面上的）完善的认识。这一事实也解释了沃尔夫为何在人对自身的义务中，特别强调培养知性的义务——好让我们能够被推动，以（事实上）最完善的方式去行动（Walschots 2024）[^walschots-2024]。在沃尔夫看来，促进自己与他人的完善，就是普遍规则：两个（或更多）可能的行动摆在面前，我们按它来取舍（GE §12）。也就是说，作自由选择时要考虑：这个行动是否“促进我们内在与外在状态的完善”（GE §2）——即考虑灵魂与身体的状态，是合于先前状态还是与之相悖。结果在多大程度上延续了“人的自然状态及其随时间的和谐保持”（GE §2），就在多大程度上更完善。沃尔夫设想的人的自然状态，是灵魂多方求索真理的状态；凡有助于把这一状态最大化的事，都当为之。而幸福恰好就安放在这里（Lanzini Stobbe 2024）[^lanzini-2024]。沃尔夫在伦理学末尾还说：人不但要确保自己的完善/幸福，还须“尽可能多地促进他人的幸福”（GE §767）。
