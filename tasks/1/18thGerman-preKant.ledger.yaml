      In light of this, the aim of logic for Thomasius is to cultivate the powers of the mind, and the faculty of reason in particular, so that we are capable of discerning what the natural light of the mind reveals to be true or false in any field to which it is applied. This involves not just supplying positive guidance with respect to how truth might be recognized and attained, but also negatively identifying and dispelling prejudices that obscure the natural light. Thomasius’ logic, therefore, is not primarily intended to offer a theory of demonstration (as with scholastic logics) nor an organon for specifically scientific discovery (as with Cartesian logics or, later, with Wolff’s logic). This distinctive aim does not, however, prevent him from weighing in on matters of traditional logical and epistemological import; for instance, he contends that thought has to do with images ultimately derived from the external senses (thereby rejecting innate ideas—Thomasius 1691a: ch. 3, §22)[^thomasius-1691a], and he outlines a theory of demonstration that focuses on preserving *conviction* in truths through their connection to incontrovertible first principles.
    step1: |-
      有鉴于此，在托马修斯那里，逻辑学的目的在于操练心灵诸能力——尤其是理性官能——使我们能够辨别心灵的自然之光在其所应用的任何领域中显示为真或假的东西。这不仅包括就真理如何被认识和达到提供正面的指引，还包括以否定的方式识别并驱散遮蔽自然之光的种种偏见。因此，托马修斯的逻辑学首先不是要提供一种证明理论（如经院逻辑那样），也不是要提供一种专供科学发现的工具论（如笛卡尔式逻辑，或后来的沃尔夫逻辑那样）。不过，这一独特的目的并不妨碍他介入传统逻辑与认识论意义上的种种问题；例如，他主张思维所处理的是最终来自外部感官的意象（由此拒绝天赋观念——Thomasius 1691a: ch. 3, §22）[^thomasius-1691a]，并且他勾画了一种证明理论，其焦点在于通过真理与无可置疑的第一原理的关联来保持对真理的信念。
    step2: |-
      有鉴于此，托马修斯认为逻辑学的目的在于操练心灵的诸种能力——尤其是理性官能——使我们能够辨别：在自然之光应用于任何领域时所显露的真与假。它不仅要从正面指明真理如何被认识、如何达成，还要从反面识别并驱散那些遮蔽自然之光的偏见。因此，托马修斯的逻辑学首要目标，既不是提供一套证明理论（那是经院逻辑的路数），也不是打造一台专供科学发现的工具论（那是笛卡尔式逻辑的路数，后来沃尔夫的逻辑也是如此）。不过，这一独特的定位并不妨碍他介入传统逻辑和认识论上的种种问题：比如，他主张思维处理的是最终源自外部感官的意象（由此拒斥天赋观念——Thomasius 1691a: ch. 3, §22）[^thomasius-1691a]；他还勾画了一种证明理论，着力点在于借真理与无可置疑的第一原理的关联，保全我们对真理的信念。
