      Through the efforts of Thomasius, and later Christian Wolff, the Friedrichs-Universität in Halle became the intellectual centre of the early Enlightenment in Germany. And despite, for instance, Thomasius’ conflict with Orthodox Lutheranism in Leipzig, and Wolff’s controversy with his Pietist colleagues (§3.3, below), neither were explicitly hostile towards religious belief, the Church, or to (appropriately exercised) religious authority (though see Favaretti Camposampiero 2024 on nuances in Wolff’s case)[^favaretti-2024]. Nor for that matter did either seek to challenge the existing political order. Beyond the German academy, however, a more radical philosophical tradition flourished, one that drew on the thought of, among others, Hobbes, Gassendi, and Spinoza, and proliferated through the transmission of clandestine literature within networks that spanned across Europe. While there was considerable diversity among the views held by the thinkers within this radical philosophical tradition, they tended to be highly critical of organized religion (if not necessarily professed atheists) and of the established political order, rejected the authority of the Bible as a source of revealed truth, and defended a (not always sophisticated) materialistic conception of the soul (cf. Stiehler 1966; Israel 2001: 628–636; Mulsow 2002 [2015]; Dyck 2016a; Rumore 2016)[^dyck-2016a][^israel-2001][^mulsow-2002][^rumore-2016][^stiehler-1966]. It bears noting that while this tradition flourished outside of a narrow academic context, there was nonetheless considerable exchange and mutual influence between figures in both the mainstream and radical traditions.
    step1: |-
      经过托马修斯以及后来的克里斯蒂安·沃尔夫（Christian Wolff）的努力，哈勒的弗里德里希大学成为德国早期启蒙的思想中心。而且，尽管有例如托马修斯与莱比锡正统路德宗的冲突、沃尔夫与其虔敬派同事的论战（见下文 §3.3），两人都没有对宗教信仰、教会或（得到恰当行使的）宗教权威公然表示敌意（不过沃尔夫情形中的细微之处参见 Favaretti Camposampiero 2024）[^favaretti-2024]。就此而言，两人也都没有试图挑战现存的政治秩序。然而，在德国学院之外，一种更为激进的哲学传统蓬勃发展；它取资于霍布斯、伽桑狄和斯宾诺莎等人的思想，并经由横跨欧洲的网络中秘密文献的传递而扩散开来。虽然这一激进哲学传统中思想家的观点彼此差异颇大，但他们往往对有组织的宗教（即便未必是公开的无神论者）和既定政治秩序持高度批判态度，拒绝《圣经》作为启示真理来源的权威，并捍卫一种（未必总是精致的）关于灵魂的唯物主义构想（cf. Stiehler 1966; Israel 2001: 628–636; Mulsow 2002 [2015]; Dyck 2016a; Rumore 2016）[^dyck-2016a][^israel-2001][^mulsow-2002][^rumore-2016][^stiehler-1966]。值得注意的是，虽然这一传统是在狭窄的学术语境之外繁荣起来的，主流传统与激进传统的人物之间仍存在相当多的交流与相互影响。
    step2: |-
      经过托马修斯、后来又有克里斯蒂安·沃尔夫（Christian Wolff）的努力，哈勒的弗里德里希大学成了德国早期启蒙的思想中心。诚然，托马修斯同莱比锡的正统路德宗有过冲突，沃尔夫也同他的虔敬派同事发生过论战（见下文 §3.3），但两人都没有公然敌视宗教信仰、教会，或（得到恰当行使的）宗教权威（沃尔夫情形中的细微之处，参见 Favaretti Camposampiero 2024）[^favaretti-2024]。同样，两人也没有谁想去挑战现存的政治秩序。然而在德国学院之外，还有一种更为激进的哲学传统在蓬勃发展：它取资于霍布斯、伽桑狄、斯宾诺莎等人的思想，并借由横跨欧洲的网络传播秘密文献而四处扩散。这个激进哲学传统内部，各家观点歧异颇大，但其思想者往往对有组织的宗教（未必是公开的无神论者，但至少态度严厉）和既定政治秩序持高度批判态度，拒绝《圣经》作为启示真理来源的权威，并捍卫一种（未必总是精致的）灵魂唯物主义构想（cf. Stiehler 1966; Israel 2001: 628–636; Mulsow 2002 [2015]; Dyck 2016a; Rumore 2016）[^dyck-2016a][^israel-2001][^mulsow-2002][^rumore-2016][^stiehler-1966]。值得注意的是：这一传统虽然繁荣于狭窄的学术语境之外，主流与激进两派人物之间仍往来频繁、相互影响不小。
