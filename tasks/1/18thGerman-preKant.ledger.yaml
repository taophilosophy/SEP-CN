      Crusius’ attack on Wolffianism continues in his logic and his thoughts on moral philosophy. In a clear rebuke of Wolff, Crusius begins his logic by rigidly distinguishing between the methods of mathematics and philosophy, contending that where the former makes use of demonstrations that rely solely on the principle of contradiction (and relate to mere possibilities or hypothetical realities), the latter must take into account other principles when, for instance, the investigation of causes are at issue (Crusius 1747: §10)[^crusius-1747]. Commensurate with this, Crusius’ considerations of the traditional topics of logic—concepts, propositions, and inferences—is thoroughly informed by his account of the essence of the understanding: a philosophical inference, as opposed to a mathematical syllogism, can have as its basis what permits of being separated or combined in thought (Crusius 1747: §262)[^crusius-1747]. Crusius also considers the relation between philosophy and theology or revealed religion, contending for the utility of philosophy for students of theology but also arguing that religion provides a needed corrective to the misuse of philosophy which, when left to its own devices, tends to lay claim to the unrestricted use of its principles (such as PSR) whereas the appropriate restrictions are typically evident to the theologian (Crusius 1747: §32)[^crusius-1747].
    step1: |-
      克鲁修斯对沃尔夫主义的攻击延续到其逻辑学与道德哲学思考中。作为对沃尔夫的明确申斥，克鲁修斯在其逻辑学开篇便严格区分数学方法与哲学方法：前者运用的证明仅依赖矛盾原则（且只涉及单纯的可能性或假设的实在），而后者——例如在考察原因时——必须顾及其他原理（Crusius 1747: §10）[^crusius-1747]。与此相应，克鲁修斯对逻辑学传统主题——概念、命题、推理——的考察，完全贯透着他关于知性本质的说明：哲学推理有别于数学三段论，它可以以思想中容许分离或组合的东西为根据（Crusius 1747: §262）[^crusius-1747]。克鲁修斯还考察了哲学与神学或启示宗教的关系：他既力陈哲学对神学学生的用处，又论证宗教为哲学的滥用提供了必要的矫正——哲学若放任自流，往往要求对其原理（如充足理由原则）的无限制使用，而恰当的限制通常对神学家来说是显明的（Crusius 1747: §32）[^crusius-1747]。
    step2: |-
      克鲁修斯对沃尔夫主义的攻击，延续到了他的逻辑学和道德哲学思考里。他给自己的逻辑学开篇就是对沃尔夫的明确申斥：严格划清数学方法与哲学方法的界限——数学的证明只靠矛盾原则（且只关乎单纯可能性或假设的实在），哲学却必须顾及其他原理，比如考察原因的时候（Crusius 1747: §10）[^crusius-1747]。与此相应，他处理逻辑学传统主题——概念、命题、推理——时，处处贯透着他那套知性本质的说明：哲学推理不同于数学三段论，凡思想上容许分离或组合的东西，都可以作它的根据（Crusius 1747: §262）[^crusius-1747]。他还考察了哲学同神学或启示宗教的关系：一面力陈哲学对神学学生的用处，一面又论证宗教能给哲学的滥用一剂必要的解药——哲学一旦放任自流，就往往要求其原理（如充足理由原则）的无限制使用，而恰当的限制，在神学家眼里通常一望即知（Crusius 1747: §32）[^crusius-1747]。
