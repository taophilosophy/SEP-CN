      Thomasius sought refuge in Berlin, in the neighbouring state of Brandenburg which was led by the Calvinist Elector Friedrich III (later king Friedrich I) and had a tradition of toleration. Partly through the support of Pufendorf himself, Thomasius was given an appointment as councillor to the court, and was allowed to lecture at the Ritterakademie in Halle an der Saale, which in 1694 would become the Friedrichs-Universität, with Thomasius among the founding faculty (in law). Thomasius was soon joined by the Pietist orientalist, theologian and educational reformer, August Hermann Francke, who had likewise run afoul of the religious authorities in Leipzig. Thomasius himself had been sympathetic with the anti-scholastic and anti-authoritarian bent of the Pietists (see §3.2 below), and had publicly defended Francke at one point in Leipzig; however, a public break occurred when Thomasius published a criticism, in 1699, of the pedagogy Francke had adopted in his famous educational institutions in Halle. Thomasius continued to stir controversy with his lectures and publications, which frequently over-reached the purview of the juristic faculty (such as his critical discussion of witchcraft trials—Beck 1969: 253–254)[^beck-1969], and breached decorum by personally attacking his theological colleagues, all of which led to a reprimand from the Brandenburg court in 1702 and an order to adhere to the boundaries between faculties. Thomasius’ dissertation *De concubinatu* of 1713, in which he contended that the use of concubines does not violate the marriage contract given that the purpose of marriage is solely procreation, also generated heated discussion. While Thomasius and Francke reconciled in 1714, Thomasius did not play a significant role in the later controversy between Wolff and the Pietists. He died in Halle on 23 September 1728.
    step1: |-
      托马修斯到邻邦勃兰登堡寻求庇护；该邦由加尔文宗选帝侯弗里德里希三世（Friedrich III，后来的国王弗里德里希一世）执掌，素有宽容的传统。部分地由于普芬道夫本人的支持，托马修斯获任宫廷参议，并获准在萨勒河畔哈勒的骑士学院（Ritterakademie）讲课；该院于 1694 年改为弗里德里希大学（Friedrichs-Universität），托马修斯是其创校教员之一（法学门）。虔敬派东方学家、神学家兼教育改革家奥古斯特·赫尔曼·弗兰克（August Hermann Francke）不久也来到托马修斯身边；此人在莱比锡同样得罪了宗教当局。托马修斯本人曾同情虔敬派的反经院哲学与反权威倾向（见下文 §3.2），并曾在莱比锡公开为弗兰克辩护；然而，当托马修斯于 1699 年发表对弗兰克在哈勒那几所著名教育机构所采教学法的批评时，两人公开决裂。托马修斯的讲课与著述继续掀起风波——它们常常越出法学系的职权范围（例如他对女巫审判的批判性讨论——Beck 1969: 253–254）[^beck-1969]，而且他以人身攻击冒犯其神学系同事、有失体统；这一切导致勃兰登堡宫廷于 1702 年对他提出申斥，并下令他恪守各系之间的边界。托马修斯 1713 年的论文《论纳妾》（*De concubinatu*）同样引发了激烈讨论；他在文中主张，鉴于婚姻的目的仅在于生育，纳妾之用并不违反婚约。虽然托马修斯与弗兰克于 1714 年和解，但托马修斯并未在此后沃尔夫与虔敬派的争论中扮演重要角色。他于 1728 年 9 月 23 日卒于哈勒。
    step2: |-
      托马修斯避往邻邦勃兰登堡。该邦由加尔文宗选帝侯弗里德里希三世（Friedrich III，即后来的国王弗里德里希一世）执掌，素来奉行宽容。部分得益于普芬道夫本人的举荐，托马修斯获任宫廷参议，并获准在萨勒河畔哈勒的骑士学院（Ritterakademie）授课；这所学院 1694 年升格为弗里德里希大学（Friedrichs-Universität），托马修斯名列创校教员（法学门）。虔敬派东方学家、神学家兼教育改革家奥古斯特·赫尔曼·弗兰克（August Hermann Francke）不久也来投——此人在莱比锡同样触怒了宗教当局。托马修斯原本就同情虔敬派的反经院哲学与反权威倾向（见下文 §3.2），还曾在莱比锡公开为弗兰克辩护；然而 1699 年，托马修斯发文批评弗兰克在哈勒那几所著名教育机构推行的教学法，两人就此公开决裂。此后托马修斯的讲课与著述风波不断：它们频频越出法学系的职权范围（例如他对女巫审判的批判性讨论——Beck 1969: 253–254）[^beck-1969]，他还以人身攻击顶撞神学系同事、有失体统。这一切导致勃兰登堡宫廷 1702 年出面申斥，并勒令他恪守各系之间的边界。1713 年，托马修斯的论文《论纳妾》（*De concubinatu*）又引起热烈争论：他主张，婚姻的目的既只在生育，纳妾便不算违背婚约。托马修斯与弗兰克虽在 1714 年和解，但在此后沃尔夫与虔敬派的争论中他再未扮演要角。1728 年 9 月 23 日，他卒于哈勒。
