      Next to Thomasius and Wolff, the most important intellectual figure in the early history of the Friedrichs-Universität in Halle was August Hermann Francke (1663–1723). As we have seen, Francke had courted controversy in Leipzig through his involvement in the Pietist movement. Pietism was a spiritual movement within the Lutheran tradition that rejected the scholastic and theological turn that Lutheranism had taken and proposed a further, internal reformation to supplement the already-effected external one, and aimed at cultivating a “living faith” rather than mere lip-service to Christian ideals. The Pietists sought the personal and interior experience of a relationship to Christ, an individual transformation that was the result of an act of divine grace modelled on Francke’s own conversion experience (cf. Wallmann 1990: 63–4)[^wallmann-1990]. To this end, the Pietists focused on the study of the Bible itself and devotional literature in small groups—the so-called conventicles or *collegia pietatis*—which were notable, and controversial, for welcoming women, if only as silent observers (R. Albrecht 2004; Gierl 2015)[^albrecht-2004][^gierl-2015].
    step1: |-
      继托马修斯与沃尔夫之后，哈勒弗里德里希大学早期历史上最重要的思想人物是奥古斯特·赫尔曼·弗兰克（August Hermann Francke，1663–1723）。如前所见，弗兰克因卷入虔敬派运动而在莱比锡招惹争议。虔敬派是路德宗传统内部的一场属灵运动；它拒绝路德宗已走的经院哲学与神学转向，提出进一步的内在改革以补充已然实现的外在改革，并以培养“活的信仰”为目标，而不是对基督教理想的口头敷衍。虔敬派追求与基督之关系的个人性和内在性经验，即一种以神恩之举为结果、以弗兰克本人的皈依经验为范型的个体转变（cf. Wallmann 1990: 63–4）[^wallmann-1990]。为此，虔敬派专注于在小组中研读《圣经》本身与灵修文献——即所谓的虔敬集会（collegia pietatis）；这些小组以欢迎女性（哪怕只是作为沉默的旁听者）而著称，也因之备受争议（R. Albrecht 2004; Gierl 2015）[^albrecht-2004][^gierl-2015]。
