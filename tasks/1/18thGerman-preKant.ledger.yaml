      Thomasius’ moral philosophy is accordingly informed by theological considerations in a way not shared by his works in theoretical philosophy. While, in the theoretical context, he did believe in natural reason’s capacity to overcome corruption, in the practical context he held that an evil will is at the root of our corruption, and to ameliorate it we require God’s grace. Moreover, Thomasius’s moral outlook seems to develop from his initial presentation of morality in the *Introduction to the Doctrine of Morals* in 1692, which is an optimistic affirmation of the viability of a moral position he identified as one involving “rational love” (*vernünftige Liebe*) as the only means to a “happy, courteous and cheerful life”, to a more pessimistic position in his *Application* in 1696 where he contends that human self-interest and an evil will constitute significant obstacles to moral improvement (a development likely due to his Pietist conversion during the period; cf. Beck 1969: 251; Ahnert 2006: 27–42)[^beck-1969][^ahnert-2006].
    step1: |-
      因此，托马修斯的道德哲学受到神学考量的影响，这是他的理论哲学著作所没有的。在理论语境中，他确实相信自然理性有克服败坏的能力；但在实践语境中，他主张邪恶的意志是我们败坏的根源，要改善它就需要上帝的恩典。此外，托马修斯的道德图景似乎经历了一个发展：从 1692 年《道德学说导论》中他最初的道德陈述——那里乐观地肯定一种他名之为“合理的爱”（*vernünftige Liebe*）的道德立场的可行，视之为通往“幸福、有礼而愉快的生活”的唯一途径——发展到 1696 年《运用》中更为悲观的立场，在那里他主张人的自利与邪恶的意志构成道德改良的重大障碍（这一发展可能归因于他在此期间的虔敬派皈依；cf. Beck 1969: 251; Ahnert 2006: 27–42）[^beck-1969][^ahnert-2006]。
    step2: |-
      也因此，托马修斯的道德哲学带有神学考量，这是他的理论哲学著作所没有的。在理论语境中，他确实相信自然理性有能力克服败坏；可在实践语境中，他主张邪恶的意志才是我们败坏的根源，要加以改善，非得依靠上帝的恩典。不仅如此，托马修斯的道德图景似乎还经历了一个转变：从 1692 年《道德学说导论》中最初的主张——乐观地肯定一种他称为“合理的爱”（*vernünftige Liebe*）的道德立场行得通，视之为通往“幸福、有礼而愉快的生活”的唯一途径——转到 1696 年《运用》中的悲观立场：人的自利与邪恶的意志，构成道德改良的重大障碍（这一转变多半归因于他在此期间的虔敬派皈依；cf. Beck 1969: 251; Ahnert 2006: 27–42）[^beck-1969][^ahnert-2006]。
