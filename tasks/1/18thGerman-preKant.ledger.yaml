      Significantly, and unlike subsequent Enlightenment thinkers, Thomasius is also explicit in holding that because the attainment of learnedness is possible wholly through the use of the natural (rather than the supernatural) light of the mind (cf. Thomasius 1691a: ch. 1, §16)[^thomasius-1691a], it is accessible by all, regardless of gender or class (for more on this, see §6.1, below).
    step1: |-
      值得注意的是，与后来的启蒙思想家不同，托马修斯还明确主张：既然学识的达成完全可以靠心灵的自然之光（而非超自然之光）的运用来实现（cf. Thomasius 1691a: ch. 1, §16）[^thomasius-1691a]，那么无论性别或阶层，人人皆可获得学识（对此的更多讨论见下文 §6.1）。
    step2: |-
      值得注意的是，与后来的启蒙思想家不同，托马修斯明确主张：学识的达成全然可以凭借心灵的自然之光（而非超自然之光）来实现（cf. Thomasius 1691a: ch. 1, §16）[^thomasius-1691a]；因此无论性别贵贱，人人皆可得而求之（相关讨论见下文 §6.1）。
