      这篇演讲在虔敬派中引起轩然大波。弗兰克要求看一份沃尔夫演讲的抄本，以便亲自审查；沃尔夫以哲学系的独立性为由拒绝了这一请求。朗格此时着手研读沃尔夫的形而上学，为神学系写下一篇判词式的评语，送交柏林当局。沃尔夫获邀作答；他对这种对其观点的敌意刻画表示拒绝，导致 1723 年 10 月下旬成立官方委员会来审查针对沃尔夫的指控。国王本人很快就会介入，而且干脆利落：沃尔夫哲学的危险被解释给造访哈勒的他的两位将军听——据说前定和谐学说尤其能为士兵开小差辩护（Beutel 2001: 189）[^beutel-2001]——这一威胁传到国王耳中后，弗里德里希·威廉一世要他信任的顾问弗兰克概述沃尔夫所辩护的问题学说；弗兰克即刻照办。国王被沃尔夫明显的不敬神所震骇，免去沃尔夫的职位，并命令他 48 小时内离开普鲁士，违者处绞刑；这道命令于 1723 年 11 月 12 日送达哈勒。沃尔夫反应迅速，渡河进入邻近的萨克森选侯国，退还学生的学费，最终接受马尔堡一个职位的聘请，在那里受到热情接待。
