      劳早先在家乡柯尼斯堡学习法律，1694 年迁居哈勒，在那里听托马修斯的课。1695 年，他启程游历欧洲与英格兰（显然在那里见到了牛顿），回国后出任年轻的库尔兰公爵的参议。庇护人的早逝使劳转向思想追求；1717 年，他出版了若干论各种主题的论著，其中包括匿名的《关于上帝、世界与人的哲学沉思》（*Meditationes philosophicae de Deo, mundo et homine*，*Philosophical Meditations concerning God, the World, and the Human Being*）。该文本涵盖广泛的哲学（以及医学和政治）主题，其特色在于对斯宾诺莎、洛克、普罗提诺和乔尔丹诺·布鲁诺等人的折中借鉴。其总体哲学立场或许最准确地刻画为泛神论：既在斯宾诺莎主义的意义上——劳为世界在上帝中的前存在辩护并否认其从无中受造（尽管劳的斯宾诺莎主义程度尚有争议；cf. Schröder 1987: 128–132）[^schröder-1987]——但也尤其在这个意义上：爱尔兰自由思想者约翰·托兰德的泛神论，即劳试图勾画一种普遍宗教的基础。由于该书对教士的激烈谴责以及对现存政治秩序的谱系学批判，《沉思》立即引起争议；劳的出版人最终被迫供出劳是作者。这导致劳入狱（其间他曾企图自杀）以及随后被美因河畔法兰克福驱逐；劳向其师托马修斯申诉请求复审，却遭到痛苦的谴责。劳试图重操法学旧业，但他离经叛道的观点和先前的污点使这成为不可能（尽管他正式撤回了先前的观点）。1740 年，他在精神状态恶劣中卒于阿尔托纳。
