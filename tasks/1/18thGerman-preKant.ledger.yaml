      As for the other founder of the Leibnizian-Wolffian philosophy, Wolff does not seem to have been similarly influenced by interaction with women in the development of his system. Through adopting the vernacular for his initial series of textbooks, however, he did at least indirectly contribute to making the latest innovations in metaphysics, ethics, politics, and physics accessible to a wider literate audience including women. Indeed, this hardly seems to have been an undesired consequence as, at one point, at the urging of the Saxon nobleman and Wolffian devotée Ernst Christoph Graf von Manteuffel (1676–1749), Wolff drafted the beginning of an introduction to Wolffian philosophy intended specifically for women (cf. Ostertag 1910)[^ostertag-1910]. In the 1740s and 1750s in particular, Wolffian philosophy had gained such a following among women of society that one commentator quipped that it was as if “an actual lycanthropy” had broken out (Edelmann 1740: 108)[^edelmann-1740]. Among those women so influenced was Émilie du Châtelet (1706–49), who made use of foundational Wolffian metaphysical principles in her presentation of Newton’s physics in her *Institutions de physique*—Wolff and du Châtelet engaged in correspondence for a time, and he commended her mastery of his system to others and appraised her as a more talented philosopher than her companion Voltaire.
