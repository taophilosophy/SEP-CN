      Wolff’s expulsion only meant that the dispute moved into the public domain, and the next decade would see dozens of treatises exchanged between Wolff (and his defenders) and his opponents, Lange and Budde foremost among them. A range of issues were canvassed in the debate. So, the issue of the *libertas philosophandi* had already surfaced in the conflict between the philosophical and theological faculties (on this see Zenker 2013)[^zenker-2013], and there were significant differences between Wolff and the Pietists concerning the ground of moral obligation (Grote 2017)[^grote-2017]; however, the principal topics were metaphysical. These include the pre-established harmony, which Lange rejected as inconsistent with any proper union between soul and body, defending instead a natural connection between them achieved through physical influx (Lange 1724: 48–50 [2019: 141–2])[^lange-1724].
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
