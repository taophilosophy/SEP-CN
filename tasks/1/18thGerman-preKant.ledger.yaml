      争论本身，是沃尔夫与虔敬派之间多年暗火的结果。沃尔夫从 1710 年起转讲哲学题目——形而上学（内含自然神学）之类，更别提他在《德语逻辑学》里论《圣经》解释的那些段落——这惹恼了神学系；系里警告自家学生别去听沃尔夫的课，罪名是他的“无神论勾当”［*Atheisterey*］（cf. Beutel 2007: 165–6）[^beutel-2007]。1719 年《德语形而上学》出版，其中那套别出心裁的上帝存在证明、还有对自然必然化的明显背书，给神学系的批判欲送上了个大靶子。这场大体幕后的摩擦，到 1721 年 7 月 12 日彻底摆上台面：那天代理校长一职由沃尔夫移交朗格，沃尔夫发表演讲，为儒家（即非基督教的）实践哲学同启蒙理性的相容性辩护——尤其是为沃尔夫式道德哲学辩护（cf. M. Albrecht 1985）[^albrecht-1985]。
