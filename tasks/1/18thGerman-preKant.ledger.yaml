      Another significant member of the theology faculty in Halle was Joachim Lange (1670–1744). Lange had come under Francke’s tutelage in Leipzig (where he also met Thomasius), following him to Erfurt and (briefly) Halle, before taking up positions at various Gymnasia in and around Berlin. During this time he also lectured on classical languages and wrote a very successful Latin grammar. In 1709, he accepted an appointment at the Friedrichs-Universität, in the theology faculty that was now thoroughly steeped in Francke’s Pietism. During his time in Berlin, Lange completed a notable philosophical work, the *Medicina mentis* (*Medicine of the Mind*), printed in Halle in 1704. Lange’s text shares a title with Tschirnhaus’ *Medicina mentis* of 1687, but little else as Lange instead emphasizes the futility and vanity of human attempts to attain cognition through their own efforts, highlighting the mind’s proneness to error and prejudice in its fallen state. Rather, according to Lange, it is only by means of divine grace and the divine light that we can heal the corrupted intellect and the will (Schönfeld 2010)[^schönfeld-2010]. In any case, Lange’s *Medicina mentis*constitutes the sole philosophical text of broad ambition within the early German Pietist tradition, and provides the intellectual foundation for Lange’s later criticisms of Wolff (Grote 2023; Dyck 2025)[^dyck-2025][^grote-2023].
    step1: |-
      哈勒神学系的另一位重要成员是约阿希姆·朗格（Joachim Lange，1670–1744）。朗格在莱比锡投入弗兰克门下（在那里他也结识了托马修斯），随弗兰克到埃尔福特、（短暂地）到哈勒，然后在柏林及其周边的几所文理中学任职。其间他还讲授古典语言，并编写了一部非常成功的拉丁语语法。1709 年，他接受弗里德里希大学的聘任——其时神学系已完全浸透弗兰克的虔敬派精神。身在柏林期间，朗格完成了一部值得注意的哲学著作《心灵之药》（*Medicina mentis*，*Medicine of the Mind*），1704 年在哈勒印行。朗格的文本与契恩豪斯 1687 年的《心灵之药》同名，但此外鲜有共同之处；朗格反而强调人类凭自身努力获得认识之徒劳与虚妄，突出心灵在堕落状态中易于犯错、易受偏见的特点。毋宁说，按朗格的看法，唯有借助神恩与神之光，我们才能治愈败坏的理智与意志（Schönfeld 2010）[^schönfeld-2010]。无论如何，朗格的《心灵之药》构成早期德国虔敬派传统中唯一一部抱负宏大的哲学文本，并为朗格后来对沃尔夫的批判提供了思想基础（Grote 2023; Dyck 2025）[^dyck-2025][^grote-2023]。
    step2: |-
      哈勒神学系还有一位重要人物：约阿希姆·朗格（Joachim Lange，1670–1744）。朗格在莱比锡投到弗兰克门下（也正是在那里结识了托马修斯），跟着弗兰克去埃尔福特、（短暂地）去哈勒，之后在柏林城内及周边的几所文理中学任职。这期间他还讲授古典语言，编了一部相当成功的拉丁语语法。1709 年，他接受弗里德里希大学的教职——那时的神学系已彻底浸透了弗兰克的虔敬派精神。人在柏林的岁月里，朗格写成了《心灵之药》（*Medicina mentis*，*Medicine of the Mind*）这部值得注意的哲学著作，1704 年在哈勒印行。书名与契恩豪斯 1687 年的《心灵之药》一模一样，共同点却仅此而已：朗格强调的，恰恰是人凭一己之力求取认识的徒劳与虚妄——心灵在堕落状态中容易犯错、容易沾染偏见。在朗格看来，唯有靠神恩与神之光，才能治愈败坏的理智与意志（Schönfeld 2010）[^schönfeld-2010]。不管怎样，朗格的《心灵之药》是早期德国虔敬派传统中唯一一部抱负宏大的哲学文本，也为他日后批判沃尔夫打下了思想根基（Grote 2023; Dyck 2025）[^dyck-2025][^grote-2023]。
