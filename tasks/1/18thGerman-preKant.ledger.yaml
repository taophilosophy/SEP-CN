      A final figure worthy of mention in this context, albeit not strictly-speaking a Pietist thinker, is Johann Franz Budde (1667–1729). Budde had studied theology in Wittenberg, and after lecturing at Jena, had been called to an appointment in moral philosophy at Halle in 1693, where he remained until returning to Jena in 1705 as a professor of theology. Budde adopted a conscientiously eclectic philosophical outlook, one influenced by Thomasius, and which also informed his theological commitments to Lutheranism (if not to Pietism specifically). A prolific writer, he published a number of philosophical works during his time in Halle, including the *Institutiones philosophiae eclecticae* that appeared in two parts in 1703. The two parts are the “Elementa philosophiae theoreticae”, roughly a metaphysics, and the “Elementa philosophiae instrumentalis”, Budde’s logic. A later work, entitled *Theses theologicae de atheismo et superstitione* (1717), is also notable in that Budde seeks to refute various threats to natural and revealed religion, including Spinozism (cf. Rumore 2019: 44–8)[^rumore-2019], an issue that would come to the fore in the coming controversy with Wolff.
