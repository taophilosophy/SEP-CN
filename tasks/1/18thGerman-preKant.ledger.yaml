      克里斯蒂安·沃尔夫（Christian Wolff）于 1679 年 1 月 24 日生于布雷斯劳（今弗罗茨瓦夫）。众人都说他是一名有天赋的学生；在文理中学期间，他对神学和数学产生了兴趣，先后在耶拿大学和莱比锡学习神学与数学，1702 年在莱比锡获硕士（*Magister*）学位。他其后的教授资格论文（*Habilitationsschrift*）论把数学方法引入实践哲学，引起了莱布尼茨的注意。两人开始通信，直到 1716 年莱布尼茨去世为止，通信主题从数学直到形而上学。部分由于莱布尼茨的支持，沃尔夫获聘哈勒弗里德里希大学一个空缺的数学教席，1707 年发表就职演讲。
