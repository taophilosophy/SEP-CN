      This ambivalence and return to theology aside, Thomasius’s moral position is a distinctive one. The theory of rational love is based on the fundamental equality of human beings as well as on their ability to think and choose independently (of authority). Ultimately, Thomasius’s ethics is a social ethics. The theory is other-directed, and given the absence of laws and principles, constitutes a contrast to the formalist universalist ethics Kant would develop by the end of the next century. At the same time, the lack of any way of making this theory applicable in a context governed not by similar but instead by conflicting interests, makes something like a formalist ethics an inevitability. By the end of the *Introduction to the Doctrine of Morals*, even Thomasius recognizes that “rational love” will function only in relatively harmonious contexts. In other contexts, however, particularly those characterized by unequal power positions, justice may well be required, a distinction in duties which Thomasius influentially characterizes in terms of “internal” and “external” obligation (cf. Barnard 1988; Schneewind 1998: 165–166)[^schneewind-1998][^barnard-1988].
    step1: |-
      撇开这种摇摆和对神学的回归不谈，托马修斯的道德立场是独具一格的。合理的爱理论既以人的根本平等为基础，也以人独立于权威进行思考和选择的能力为基础。归根到底，托马修斯的伦理学是一种社会伦理学。这一理论以他人为取向；鉴于它不设法则与原理，它构成对康德在下个世纪末将要发展的形式主义普遍主义伦理学的一种对照。与此同时，由于没有任何办法使这一理论适用于一个不由相似利益、而由相互冲突的利益所支配的语境，某种类似形式主义伦理学的东西便成为必然。到《道德学说导论》的结尾，连托马修斯本人也承认，“合理的爱”只在相对和谐的语境中才起作用。而在其他语境中，尤其是在权力地位不平等的语境中，很可能需要正义；托马修斯以影响深远的方式用“内在”义务与“外在”义务的区分刻画了义务的这一区别（cf. Barnard 1988; Schneewind 1998: 165–166）[^schneewind-1998][^barnard-1988]。
    step2: |-
      撇开这种摇摆与向神学的回归不谈，托马修斯的道德立场自成一格。合理爱的理论，一面立基于人的根本平等，一面立基于人独立于权威去思考和选择的能力。归根到底，托马修斯的伦理学是一种社会伦理学：理论以他人为取向，又不设法则与原理，恰与康德在下个世纪末将发展的那套形式主义的普遍主义伦理学形成对照。与此同时，这个理论拿不出办法，把自己运用于一个不由相似利益、反由利益冲突所支配的语境；于是，某种类似形式主义伦理学的东西便成为必然。《道德学说导论》写到末尾，连托马修斯本人也承认，“合理的爱”只在相对和谐的语境里才起作用。而在别的语境——尤其是权力地位不平等的语境——中，很可能就需要正义了。托马修斯以影响深远的方式，用“内在”义务与“外在”义务的区分刻画了义务的这层区别（cf. Barnard 1988; Schneewind 1998: 165–166）[^schneewind-1998][^barnard-1988]。
