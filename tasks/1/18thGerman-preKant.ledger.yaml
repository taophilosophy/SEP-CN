      Thomasius is decidedly not a systematic philosopher; instead, and quite consistent with his mature distaste for dogmatism in all its forms, he is best characterized as a conscientiously eclectic thinker (M. Albrecht 1994: 398–416; Bottin & Longo 2015: 301–315; Rumore 2026)[^albrecht-1994][^bottin-2015][^rumore-2026]. That said, Thomasius’ thought is unified by an overarching conviction in the priority of practical life, and the belief that erudition in whatever sphere of knowledge should be pursued for the sake of the improvement of our will and intellect for use in our ordinary life. This is made clear, for instance, in the definition of learnedness (“*Gelahrheit*”) that Thomasius provides at the outset of his *Introduction to the Doctrine of Reason*:
    step1: |-
      托马修斯断然不是一位体系哲学家；毋宁说——与他成熟时期对一切形态的教条主义的反感颇为一致——最好把他刻画为一位一丝不苟的折中主义者（M. Albrecht 1994: 398–416; Bottin & Longo 2015: 301–315; Rumore 2026）[^albrecht-1994][^bottin-2015][^rumore-2026]。尽管如此，托马修斯的思想仍由一个统摄性的信念统一起来，即实践生活的优先性，以及如下信念：无论何种知识领域的博学，都应当以改进我们的意志和理智、以供日常生活之用为旨归。这一点在他于《理性学说导论》开篇对“学识”（“*Gelahrheit*”）所下定义中表现得十分清楚：
    step2: |-
      托马修斯断然算不上体系哲学家；与他成熟时期对一切形态教条主义的反感相一致，最恰当的定位是把他说成一位一丝不苟的折中主义者（M. Albrecht 1994: 398–416; Bottin & Longo 2015: 301–315; Rumore 2026）[^albrecht-1994][^bottin-2015][^rumore-2026]。尽管如此，他的思想仍被一个统摄性的信念贯穿始终：实践生活高于一切；无论哪个知识领域的学识，都应当为改进我们的意志与理智、服务于日常生活而求。这一点在他《理性学说导论》（*Einleitung zur Vernunfft-Lehre*）开篇所下的“学识”（“*Gelahrheit*”）定义里表现得再清楚不过：
