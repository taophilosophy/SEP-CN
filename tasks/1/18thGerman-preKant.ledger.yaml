      整个 18 世纪上半叶，托马修斯仍将持续影响德国哲学。然而，真正对德国思想版图的现代化和启蒙的传播贡献最多的，是他在弗里德里希大学哲学系的同事克里斯蒂安·沃尔夫（Christian Wolff）。沃尔夫主要靠他那套独具特色的哲学体系——所谓“莱布尼茨—沃尔夫学派”哲学——做到这一点；这一体系吸纳了最新的哲学观念与方法，包括但不限于莱布尼茨本人的那些。沃尔夫的体系切合问题、平易可入，又经众多门生扩充打磨，很快便在德国各大学院站稳脚跟。沃尔夫当然不缺批评者；而在限制他影响这件事上，谁也没有神学系那帮虔敬派同事嗓门大，也没有谁（至少在一开始）比他们更成功。沃尔夫与虔敬派的这场著名论战，在高潮处演成 1723 年沃尔夫被逐出普鲁士、违者处以绞刑的结局；它把现代观念的全套菜单——唯物主义、观念论、无神论、斯宾诺莎主义，一应俱全——摆到了识字公众面前，也让欧洲其他地方把目光投向了德国思想界。
