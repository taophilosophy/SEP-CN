      在逐逐沃尔夫初获成功之后，朗格与虔敬派在普鲁士宫廷的影响力有所衰减。与此相对，这一事件反倒为沃尔夫的欧洲声誉添了彩。在普鲁士，沃尔夫的形而上学与实践哲学著作被列入无神论书籍清单，但他如今自视为面向欧洲人而非仅仅德国人言说，并开始了一拉丁文著作系列，以 1728 年的《理性哲学或逻辑学》（*Philosophia rationalis sive logica*，*Latin Logic*）发端。弗里德里希·威廉一世似乎对草率的决定感到反悔，1733 年邀请沃尔夫返回普鲁士；沃尔夫谢绝了这一邀请。但对其著作的禁令于 1734 年撤销；1737 年，一个跨教派的普鲁士委员会的裁定洗清了虔敬派加诸沃尔夫哲学的罪名。王储（后来的弗里德里希二世）是沃尔夫在宫廷中的热心拥趸（而且与虔敬派不睦）；1740 年登基后，他邀请沃尔夫回到普鲁士。沃尔夫谢绝了奉上的柏林学院院长职位，凯旋般地回到哈勒出任教授兼副校长，把余生用于完成其实践哲学著作。
