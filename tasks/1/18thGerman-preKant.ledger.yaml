      在这一语境中值得一提的最后一个人物（尽管严格说来不是虔敬派思想家）是约翰·弗朗茨·布德（Johann Franz Budde，1667–1729）。布德在维滕贝格学习神学，在耶拿讲学之后，1693 年受邀赴哈勒任道德哲学教职，直至 1705 年以神学教授身份回到耶拿。布德采纳了一种一丝不苟的折中主义哲学立场，深受托马修斯影响，也塑造了他对路德宗（虽非特指虔敬派）的神学承诺。他著述宏富，在哈勒期间出版了大量哲学著作，包括 1703 年分两部分问世的《折中哲学要义》（*Institutiones philosophiae eclecticae*）。两部分为“理论哲学要义”（Elementa philosophiae theoreticae，大体是一部形而上学）与“工具哲学要义”（Elementa philosophiae instrumentalis，布德的逻辑学）。其后期著作《论无神论与迷信的神学论题》（*Theses theologicae de atheismo et superstitione*，1717）也值得注意：布德试图驳斥自然宗教与启示宗教面临的种种威胁，包括斯宾诺莎主义（cf. Rumore 2019: 44–8）[^rumore-2019]；这一问题在即将到来的与沃尔夫的争论中将成为焦点。
