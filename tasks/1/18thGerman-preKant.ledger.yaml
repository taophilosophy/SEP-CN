      > Learnedness is knowledge through which the human being is made capable of properly distinguishing the true from the false and the good from the bad […] in order that one might promote one’s own temporal and lasting welfare, and that of others, in ordinary life and affairs. (Thomasius 1691a: ch. 1, §1 [2019: 18])[^thomasius-1691a]
    step1: |-
      > 学识是这样一种知识：凭借它，人得以恰当地分辨真与假、善与恶……从而能够在日常生活和事务中增进自己当下而持久的福祉，也增进他人的福祉。（Thomasius 1691a: ch. 1, §1 [2019: 18]）[^thomasius-1691a]
