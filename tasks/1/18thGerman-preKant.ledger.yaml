      Crusius’ ethics is characterized by the principled separation of the will from the understanding as distinct powers, and a re-orientation of his moral theory with respect to the former. The human will depends on the understanding to supply it with ideas in accordance with which it acts, but Crusius is clear that the will is not solely determined to its action through some cognition (i.e., of perfection) in the act itself; rather, the goodness of an action consists more generally in its being conformable to the will (Crusius 1745: §26; Schneewind 1998: 447)[^crusius-1745][^schneewind-1998], and in any case the human will is always free to act or to omit to act in accordance with the understanding’s ideas. The human will is possessed of three basic desires—the first is for our own perfection, in accordance with which the talents of the intellect among others are promoted (Crusius 1745: §117)[^crusius-1745]; for unification with objects perceived as perfect, from which proceeds a drive to moral love through which we desire to join with other rational beings without any further end (Crusius 1745: §125)[^crusius-1745]; and finally, the desire to recognize a divine law which, despite its abstract-sounding name, is identified by Crusius with the phenomenon of conscience (*Gewissenstrieb*). It is through conscience that we are able to recognize the divinely given moral law (Crusius 1745: §132)[^crusius-1745], and conscience thereby also discloses our dependence on God as divine lawgiver (Crusius 1745: §165)[^crusius-1745]. As such, conscience supplies us with a motivation to obedience where, according to Crusius, this obedience constitutes an essential component (the “form”) of virtue (Crusius 1745: §177)[^crusius-1745]. A derivation of our duties thus depends on a consideration of God and His aim in creating the world, which Crusius identifies as *all* human beings’ attainment of virtue, as opposed to knowledge or happiness in its own right, through their free actions (Crusius 1745: §213)[^crusius-1745]. On this basis, he proceeds to derive duties to God, to others, and to the self (for discussion, see Schneewind 1998: 452–6)[^schneewind-1998].
    step1: |-
      克鲁修斯伦理学的特点在于把意志与知性作为不同官能原则性地分离开来，并使其道德理论重新以意志为定向。人的意志依赖知性为其提供观念，意志依之行动；但克鲁修斯明确指出，意志的行动并不单单通过行动本身中的某种认识（即对完善的认识）而被决定；毋宁说，一个行动的善更一般地在于它合于意志（Crusius 1745: §26; Schneewind 1998: 447）[^crusius-1745][^schneewind-1998]，而且无论如何，人的意志总是自由地可以依照知性的观念而行动或搁置行动。人的意志拥有三种基本欲望：其一为自身的完善——智性的诸般才华等依此得到促进（Crusius 1745: §117）[^crusius-1745]；其二为与被知觉为完善的对象的合一——由此生出道德爱的驱力，我们借之渴望与其他理性存在者结合而无任何进一步的目的（Crusius 1745: §125）[^crusius-1745]；其三，是认出一条神圣法则的欲望——尽管其名字听起来抽象，克鲁修斯却把它等同于良知现象（*Gewissenstrieb*）。正是通过良知，我们才能认出神圣赋予的道德法则（Crusius 1745: §132）[^crusius-1745]；良知由此也揭示出我们对作为神圣立法者的上帝的依赖（Crusius 1745: §165）[^crusius-1745]。如此，良知为我们提供服从的动机；在克鲁修斯看来，这种服从构成德性的一个本质成分（“形式”）（Crusius 1745: §177）[^crusius-1745]。我们的义务的推导，因而取决于对上帝及其创造世界之目的的考量；克鲁修斯把这一目的认定为*一切*人经由其自由行动而达成德性——而非以自身为目的的知识或幸福（Crusius 1745: §213）[^crusius-1745]。在此基础之上，他进而推导出对上帝的义务、对他人的义务与对自己的义务（相关讨论见 Schneewind 1998: 452–6）[^schneewind-1998]。
    step2: |-
      克鲁修斯伦理学的标志，是把意志同知性作为两种不同的官能原则性地分离开，并让道德理论重新围绕意志来定盘。人的意志要靠知性供给观念才有所依凭而行动；但克鲁修斯说得明白：意志的行动并不是单单被行动本身里的某种认识（即对完善的认识）决定的；毋宁说，一个行动的善，更一般地系于它合乎意志（Crusius 1745: §26; Schneewind 1998: 447）[^crusius-1745][^schneewind-1998]。而且无论如何，人总可以依照知性的观念自由行动、或搁置不动。人的意志怀有三种基本欲望：其一，求自身的完善——智性才华等种种禀赋由此得到滋养（Crusius 1745: §117）[^crusius-1745]；其二，求与被知觉为完善的对象合一——由此生出道德爱这一驱力，我们凭它渴望同其他理性存在者结合，别无进一步的目的（Crusius 1745: §125）[^crusius-1745]；其三，是认出一条神圣法则的欲望——这名头听着抽象，克鲁修斯却把它直接等同于良知现象（*Gewissenstrieb*）。正是借着良知，我们才认得出神圣赋予的道德法则（Crusius 1745: §132）[^crusius-1745]；良知由此也揭示出：我们依赖于上帝这位神圣立法者（Crusius 1745: §165）[^crusius-1745]。如此一来，良知便给我们提供了服从的动机；而在克鲁修斯看来，这种服从正是德性的一个本质成分（其“形式”）（Crusius 1745: §177）[^crusius-1745]。既然如此，推导我们的义务，就得先考量上帝及其创造世界的目的；克鲁修斯把这个目的认定为：*一切*人经由自由行动而达成德性——而不是知识或幸福本身（Crusius 1745: §213）[^crusius-1745]。以此为据，他进而推出对上帝的义务、对他人的义务、对自己的义务（相关讨论见 Schneewind 1998: 452–6）[^schneewind-1998]。
