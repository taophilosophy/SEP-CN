      ### 6.2 Women and the Leibnizian-Wolffian Philosophy
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      With respect to the Leibnizian-Wolffian philosophy, there is significant evidence of women’s extensive engagement with the system already at its origins. Leibniz exchanged letters with a number of women, but his correspondence with his patroness Electress Sophie of Hanover (1630–1714), who happened to be the sister of Elisabeth of Bohemia, and her daughter Queen Sophie Charlotte of Prussia (1668–1705), is particularly significant as it frequently turned to philosophical topics. In his letters, and his personal exchanges with “the two Sophies”, Leibniz can be seen to refine and develop key doctrines, including his conception of substance and his attempted theodicy (Strickland 2011: 35–48)[^strickland-2011], where Leibniz himself claimed that his *Theodicée* found its beginnings in his conversations with Sophie Charlotte. Sophie of Hanover likewise supplied Leibniz with one of his favourite pieces of empirical evidence for the principle of the identity of indiscernibles (when she challenged a courtier to find two identical leaves during a garden stroll). Sophie of Hanover was no dogmatic Leibnizian however, as she maintained her commitment to physical influence between the mind and the body, and hosted controversial figures such as Francis Mercury Van Helmont (1614–1699) and John Toland (1670–1722) at her court. It is, however, debated whether Sophie shared the materialist views of these thinkers when it comes to the mind (de Careil 1876; Strickland 2009 and 2011: 49–64)[^careil-1876][^strickland-2009][^strickland-2011] or instead upheld a metaphysically agnostic view regarding the nature of the soul (Leduc 2021)[^leduc-2021].
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      As for the other founder of the Leibnizian-Wolffian philosophy, Wolff does not seem to have been similarly influenced by interaction with women in the development of his system. Through adopting the vernacular for his initial series of textbooks, however, he did at least indirectly contribute to making the latest innovations in metaphysics, ethics, politics, and physics accessible to a wider literate audience including women. Indeed, this hardly seems to have been an undesired consequence as, at one point, at the urging of the Saxon nobleman and Wolffian devotée Ernst Christoph Graf von Manteuffel (1676–1749), Wolff drafted the beginning of an introduction to Wolffian philosophy intended specifically for women (cf. Ostertag 1910)[^ostertag-1910]. In the 1740s and 1750s in particular, Wolffian philosophy had gained such a following among women of society that one commentator quipped that it was as if “an actual lycanthropy” had broken out (Edelmann 1740: 108)[^edelmann-1740]. Among those women so influenced was Émilie du Châtelet (1706–49), who made use of foundational Wolffian metaphysical principles in her presentation of Newton’s physics in her *Institutions de physique*—Wolff and du Châtelet engaged in correspondence for a time, and he commended her mastery of his system to others and appraised her as a more talented philosopher than her companion Voltaire.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In addition to du Châtelet, a number of women took up the task of defending and developing Leibnizian-Wolffian ideas. None were more active in this than Luise Adelgunde Viktorie Gottsched (*née* Kulmus, 1713–62), whose husband Johann Christoph (§4.2 above) was a Wolffian disciple who made contributions to philosophy (metaphysics and aesthetics), as well as to literary theory and the development of German letters. In virtue of her ambitious education (especially in languages), Luise Gottsched contributed extensively to Johann Christoph’s efforts to promote German letters and theatre, and was a prolific translator, both in the context of her husband’s ambitious projects and in her own right. Thus, she made substantial contributions to Johann Christoph’s translations of Leibniz’s *Theodicée* (J. C. Gottsched 1744)[^gottsched-1744] and of Bayle’s *Dictionaire historique et critique* (1741–44) (for other philosophical translations, see Brown 2012)[^brown-2012]. She also translated *Réflexions nouvelles sur les femmes* (1727; L. A. V. Gottsched 1731)[^gottsched-1731] by the Parisian *salonnière* Anne-Thésèse, Marquise de Lambert and produced a translation of and an original response to Madeleine Angélique Poisson de Gomez’s *Le triomphe de l’éloquence* (1730; L. A. V. Gottsched 1739)[^gottsched-1739], which emphasized the importance of education (including in philosophy) for woman’s cultivation of virtue.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Another notable figure in this respect is Johanna Charlotte Unzer (*née* Ziegler, 1725–82), who was raised in a cultured family in Halle: her uncle J. G. Krüger (1715–59) was a well-known Wolffian scientist, and Baumgarten’s student G. F. Meier was a close family friend. Unzer herself would become a renowned poet, though she produced a highly original philosophical contribution to Wolffian thought in her *Grundriß einer Weltweisheit für das Frauenzimmer* (*Outline of a Philosophy for the Lady*) of 1751. In that text, Unzer seeks to present the doctrines of Leibnizian-Wolffian logic and metaphysics in an aesthetically perfect manner, often making use of poetry to provide a moving illustration of an otherwise abstruse theorem. In the process, Unzer grants German women access to the most challenging and controversial philosophical debates of her time (including Wolff’s account of scientific reasoning, the challenge of materialism, and the Leibnizian doctrine of monads) with the express intention of equipping her female readers to engage in speculative and scientific investigations themselves. At the same time, she offers a dynamic revision and re-orientation of the Wolffian philosophy which, significantly, attempts to carve out a space for the (as yet unfounded) discipline of aesthetics (Buchenau 2021)[^buchenau-2021].
    step1: TBD
    step2: TBD
