      Along with his efforts to secure a place for genuine freedom of the will in his metaphysics, Crusius also emphasizes the limits of the human understanding. Crusius claims that the acts of the understanding are governed by principles, including a formal principle (the principle of contradiction), but also and importantly a number of “material” principles that govern what is thinkable for the human mind (where what is unthinkable is not for that reason contradictory). Among these principles are the *principle of inseparability*, according to which that which cannot be separated in thought cannot be separated in fact, and the *priniciple of incombinability*, according to which that which cannot be combined in thought cannot in fact be combined (Crusius 1743: §XXVII; 1745: §15)[^crusius-1743]. Significantly, and drawing on Thomasius (via Hoffmann 1737)[^hoffmann-1737], Crusius contends that these principles which together constitute the “essence of the understanding” supply us with a criterion of truth, which consists in the agreement of thoughts with things, such that only that can be true which conforms to the principles of human understanding (Crusius 1745: §15; 1747: §51)[^crusius-1745]. These material principles are subsequently used by Crusius to vindicate a variety of substantive metaphysical claims, including one he dubs the principle of sufficient *cause* (Crusius 1745: §31)[^crusius-1745]. (For discussion of many of these points, see Chapman 2023.)[^chapman-2023] On this basis, Crusius erects his own distinctive metaphysics, proceeding through the now-established Wolffian topics, though Crusius assigns natural theology a place more befitting its importance and ignores empirical psychology because it takes up spontaneous and free acts of the mind and so does not concern *necessary* truths of reason, the only proper subject of metaphysics (but see Heßbrüggen-Walter 2021 on the role of experience in Crusius’ metaphysics)[^heßbrüggen-walter-2021].
    step1: |-
      在为意志的真正自由在其形而上学中争得一席之地的同时，克鲁修斯还强调人类知性的界限。克鲁修斯主张，知性的活动受原理支配：包括一条形式原理（矛盾原则），但同样重要的还有若干支配人类心灵可思者的“质料”原理（不可思者并不因此就是矛盾的）。这些原理中有*不可分离原则*——在思想中不可分离者，在事实中亦不可分离——以及*不可组合原则*——在思想中不可组合者，在事实中亦不可组合（Crusius 1743: §XXVII; 1745: §15）[^crusius-1743]。值得注意的是，克鲁修斯取资于托马修斯（经由 Hoffmann 1737）[^hoffmann-1737]，主张这些原理——合起来构成“知性的本质”——为我们提供了一条真理判准：真理在于思想与事物的符合，因而唯有符合人类知性诸原理的东西才能为真（Crusius 1745: §15; 1747: §51）[^crusius-1745]。克鲁修斯随后用这些质料原理来辩护各种实质性的形而上学主张，其中包括他所称的充足*原因*原则（Crusius 1745: §31）[^crusius-1745]。（关于其中许多论点的讨论，见 Chapman 2023。）[^chapman-2023]在此基础上，克鲁修斯立起其独具特色的形而上学，循着如今已成定制的沃尔夫式论题推进；不过克鲁修斯给自然神学安排了更合其重要性的位置，并搁置经验心理学——因为它处理心灵的自发而自由的活动，从而不涉及*必然的*理性真理，而后者才是形而上学的正当主题（关于经验在克鲁修斯形而上学中的角色，另见 Heßbrüggen-Walter 2021）[^heßbrüggen-walter-2021]。
    step2: |-
      一边为意志的真正自由在形而上学里争地盘，一边克鲁修斯还强调人类知性的界限。他主张，知性的活动受原理支配：其中一条是形式原理（矛盾原则），但同样要紧的，是若干支配人类心灵可思范围的“质料”原理（不可思的东西并不因此就自相矛盾）。这些原理之中，有*不可分离原则*——思想上分不开的，事实中也分不开；有*不可组合原则*——思想上拼不起来的，事实上也拼不起来（Crusius 1743: §XXVII; 1745: §15）[^crusius-1743]。值得留意的是，克鲁修斯上承托马修斯（经 Hoffmann 1737）[^hoffmann-1737]，主张这些原理——合起来即“知性的本质”——供给我们一条真理判准：真，在于思想与事物相符合；因而唯有合于人类知性诸原理的东西才能为真（Crusius 1745: §15; 1747: §51）[^crusius-1745]。随后，克鲁修斯拿这些质料原理去撑起一桩桩实质的形而上学主张，其中就有他命名为充足*原因*原则的那一条（Crusius 1745: §31）[^crusius-1745]。（对其中许多论点的讨论，见 Chapman 2023。）[^chapman-2023]在此基础上，克鲁修斯立起了自己独具一格的形而上学，循着如今已成定制的那套沃尔夫式论题推进；不同的是：他给自然神学安排了一个更配得上其分量的位置，却把经验心理学搁置一旁——因为它处理的是心灵自发而自由的活动，不涉及*必然的*理性真理，而后者才是形而上学的正当论题（经验在克鲁修斯形而上学中的角色，另见 Heßbrüggen-Walter 2021）[^heßbrüggen-walter-2021]。
