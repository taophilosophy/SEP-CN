      The address caused an uproar among the Pietists and Francke demanded to see a copy of Wolff’s address to scrutinize for himself, which request Wolff denied citing the independence of the philosophy faculty. Lange at this point took up the study of Wolff’s metaphysics, penning a damning appraisal for the theology faculty that was sent to the authorities in Berlin. Wolff was invited to reply, and his rejection of the hostile characterization of his views led to the formation of an official commission in late October 1723 to investigate the charges against Wolff. The king himself would soon intervene, and decisively: after the dangers of Wolffian philosophy were explained to two of his generals visiting Halle—the doctrine of the pre-established harmony in particular was said to justify the desertion of soldiers (Beutel 2001: 189)[^beutel-2001]—and this threat conveyed to the king, Friedrich Wilhelm I asked his trusted advisor Francke to outline the problematic doctrines defended by Wolff, which he promptly did. Horrified by Wolff’s evident godlessness, the king dismissed Wolff from his position and ordered him to leave Prussia in 48 hours on pain of hanging, an order that was received in Halle on 12 November 1723. Wolff reacted swiftly, crossing over to nearby Electoral Saxony, refunding his students’ fees, and ultimately took up the offer of a position in Marburg where he received an enthusiastic reception.
