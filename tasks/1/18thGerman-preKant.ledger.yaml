      可以理解，鉴于其职位的性质，沃尔夫最初的出版物大多致力于数学与自然科学，包括 1710 年的一本数学导论和 1716 年一部有影响的数学词典。然而，大约 1710 年起，他开始讲授更狭义的哲学主题，并于 1713 年出版《关于人类理智诸能力及其在认识真理中的正确运用的理性思考》（*Vernünfftige Gedancken von den Kräfften des menschlichen Verstandes und ihrem richtigen Gebrauche in Erkäntnis der Wahrheit*，*Rational Thoughts on the Powers of the Human Understanding and its Propert Use in the Cognition of Truth*）［即“《德语逻辑学》”，下称 GL］。沃尔夫那套著名的德语哲学教科书系列由此发端，后来扩充为：1719 年的《关于上帝、世界与人的灵魂以及一般万物的理性思考》（*Vernünftige Gedanken von Gott, der Welt und der Seele des Menschen, auch allen Dingen überhaupt*，*Rational Thoughts on God, the World and the Soul of Man, and on All Things in General*）［即“《德语形而上学》”，下称 GM］（不过出版日期标为 1720 年），1720 年的《关于人的行为以促进其幸福的理性思考》（*Vernünfftige Gedancken von der Menschen Thun und Lassen, zu Beförderung ihrer Glückseligkeit*，*Rational Thoughts on Human Actions for the Promotion of their Happiness*）［即“《德语伦理学》”，下称 GE］，随后是 1721 年的“《德语政治学》”、1723 年的“《德语物理学》”和 1724 年的“《德语目的论》”。
