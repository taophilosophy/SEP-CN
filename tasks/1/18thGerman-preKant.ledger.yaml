      In addition to du Châtelet, a number of women took up the task of defending and developing Leibnizian-Wolffian ideas. None were more active in this than Luise Adelgunde Viktorie Gottsched (*née* Kulmus, 1713–62), whose husband Johann Christoph (§4.2 above) was a Wolffian disciple who made contributions to philosophy (metaphysics and aesthetics), as well as to literary theory and the development of German letters. In virtue of her ambitious education (especially in languages), Luise Gottsched contributed extensively to Johann Christoph’s efforts to promote German letters and theatre, and was a prolific translator, both in the context of her husband’s ambitious projects and in her own right. Thus, she made substantial contributions to Johann Christoph’s translations of Leibniz’s *Theodicée* (J. C. Gottsched 1744)[^gottsched-1744] and of Bayle’s *Dictionaire historique et critique* (1741–44) (for other philosophical translations, see Brown 2012)[^brown-2012]. She also translated *Réflexions nouvelles sur les femmes* (1727; L. A. V. Gottsched 1731)[^gottsched-1731] by the Parisian *salonnière* Anne-Thésèse, Marquise de Lambert and produced a translation of and an original response to Madeleine Angélique Poisson de Gomez’s *Le triomphe de l’éloquence* (1730; L. A. V. Gottsched 1739)[^gottsched-1739], which emphasized the importance of education (including in philosophy) for woman’s cultivation of virtue.
