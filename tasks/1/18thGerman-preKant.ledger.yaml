      Crusius is widely and rightly regarded as the most sophisticated philosopher within the so-called “Thomasian-Pietist tradition” (on the appropriateness of such a designation, see Fugate 2026)[^fugate-2026]. Crusius sets out to offer an alternative to the core claims of the Leibnizian-Wolffian philosophy on topics in metaphysics, epistemology, logic and practical philosophy. As Lange had previously, Crusius targets the principle of sufficient reason, and its employment in Leibnizian-Wolffian metaphysics, for criticism. Crusius diagnoses a number of ambiguities in the Wolffian presentation of the principle. He opts to refer to a reason (*ratio*; *Grund*) that, when present, determines something to come to be such that the opposite would be impossible as a *determining reason*, and accordingly refers to the principle (in the sense intended by Leibniz and Wolff) as the *principle of determining reason* (Crusius 1743: §II–III)[^crusius-1743]. Crusius then critically discusses each of Wolff’s attempts to prove the principle—concerning the first such proof (presented in §3.1, above), Crusius claims that the most charitable reconstruction of it is circular. To show this, Crusius reformulates Wolff’s proof as the following syllogism (using Wolff’s preferred terminology):
    step1: |-
      克鲁修斯被广泛且正当地视为所谓“托马修斯—虔敬派传统”中最精湛的哲学家（关于这一称谓是否恰当，见 Fugate 2026）[^fugate-2026]。克鲁修斯立志在形而上学、认识论、逻辑与实践哲学诸问题上，为莱布尼茨—沃尔夫学派哲学的核心主张提供一种替代方案。与先前的朗格一样，克鲁修斯把批判的矛头对准充足理由原则及其在莱布尼茨—沃尔夫学派形而上学中的运用。克鲁修斯诊断出沃尔夫式陈述中的若干歧义。他选择把这样一种理由（*ratio*；*Grund*）称为*决定理由*：当它在场时，它决定某物生成，以至于相反的情况不可能；并据此把（莱布尼茨与沃尔夫所意指的）那一原则称为*决定理由原则*（Crusius 1743: §II–III）[^crusius-1743]。随后，克鲁修斯逐一批判性讨论沃尔夫证明该原则的诸次尝试——关于第一次证明（见上文 §3.1），克鲁修斯声称，对它最宽容的重构也是循环的。为表明这一点，克鲁修斯把沃尔夫的证明重新表述为如下三段论（使用沃尔夫偏好的术语）：
    step2: |-
      克鲁修斯被公认——而且当之无愧——是所谓“托马修斯—虔敬派传统”中最精湛的哲学家（这个称谓是否贴切，见 Fugate 2026）[^fugate-2026]。他的志向，是在形而上学、认识论、逻辑与实践哲学的各个题目上，替莱布尼茨—沃尔夫学派哲学的核心主张立一个替代方案。朗格当年瞄准的靶子，克鲁修斯接着打：充足理由原则，以及它在莱布尼茨—沃尔夫学派形而上学中的运用。克鲁修斯诊断出沃尔夫式陈述里的若干歧义。他把这样一种理由（*ratio*；*Grund*）称作*决定理由*：它在场时便决定某物生成，以至于相反情况根本不可能；并据此把（莱布尼茨和沃尔夫意指的那条）原则称作*决定理由原则*（Crusius 1743: §II–III）[^crusius-1743]。接着，克鲁修斯逐一批判沃尔夫证明该原则的历次尝试——就说第一次证明（见上文 §3.1）：克鲁修斯断言，哪怕按最宽容的方式重构，它也是循环的。为挑明这一点，他把沃尔夫的证明改写成下面这个三段论（用沃尔夫自己偏好的术语）：
