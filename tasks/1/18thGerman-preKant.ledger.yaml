      Baumgarten’s philosophical works cover a wide range of topics. The 1000 sections of his *Metaphysica* of 1739 offers a synopsis of his views, following the Wolffian division, on ontology, cosmology, empirical and rational psychology, and natural theology. He also published two influential textbooks on ethics: the *Ethica philosophica* (*Philosophical Ethics*) of 1740 and *Initia philosophiae practicae primae* (*Elements of First Practical Philosophy*), both of which Kant also regularly used in his lectures on moral philosophy. Baumgarten’s abiding interest in aesthetics issued in two texts, the first a dissertation entitled *Meditationes philosophicae de nonnullis ad poema pertinentibus* (*Reflections on Poetry*) in 1735, and the second the ambitious *Aesthetica*, the first volume of which appeared in 1750, with a second unfinished volume printed (at the request of the publisher) in 1758.
    step1: |-
      鲍姆嘉通的哲学著作涵盖广泛的主题。其 1739 年《形而上学》的 1000 个小节，依沃尔夫式的划分，概述了他在本体论、宇宙论、经验心理学与理性心理学以及自然神学上的观点。他还出版了两部有影响的伦理学教科书：1740 年的《哲学伦理学》（*Ethica philosophica*，*Philosophical Ethics*）与《第一实践哲学要义》（*Initia philosophiae practicae primae*，*Elements of First Practical Philosophy*）；康德在其道德哲学讲课中也经常使用这两部书。鲍姆嘉通对美学的持久兴趣结出两部文本：第一部是 1735 年题为《论诗的若干哲学沉思》（*Meditationes philosophicae de nonnullis ad poema pertinentibus*，*Reflections on Poetry*）的学位论文；第二部是雄心勃勃的《美学》（*Aesthetica*），第一卷 1750 年问世，第二卷未完成，应出版人之请于 1758 年印行。
    step2: |-
      鲍姆嘉通的哲学著作题材极广。他 1739 年的《形而上学》共 1000 个小节，按沃尔夫式的划分，概述了他在本体论、宇宙论、经验心理学与理性心理学、自然神学上的全部观点。他还出版了两部影响深远的伦理学教科书：1740 年的《哲学伦理学》（*Ethica philosophica*，*Philosophical Ethics*）和《第一实践哲学要义》（*Initia philosophiae practicae primae*，*Elements of First Practical Philosophy*）——康德讲道德哲学课，也常年使用这两本书。他对美学的持久兴趣则结出了两部文本：第一部是 1735 年的学位论文《论诗的若干哲学沉思》（*Meditationes philosophicae de nonnullis ad poema pertinentibus*，*Reflections on Poetry*）；第二部便是雄心勃勃的《美学》（*Aesthetica*）——第一卷 1750 年问世，第二卷未竟，应出版人之请于 1758 年印行。
