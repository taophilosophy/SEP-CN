      ## 6. Women and Other Under-Represented Thinkers
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      *(Note: Treatment of these figures has not been integrated into the foregoing solely for the convenience of those interested primarily in their contributions.)*
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      A variety of circumstances—religious, political, and social—conspired to give women limited opportunities to engage in and with the contemporary intellectual culture, even compared to their French- and English-speaking contemporaries. The German-speaking lands of Europe lacked a major cosmopolitan centre, like London or Paris, to germinate progressive ideas and to propagate those developed abroad. Moreover, the fact that, in spite of Thomasius’ and Wolff’s efforts, German intellectuals continued to publish (and teach) in Latin through the first half of the eighteenth century, meant that women’s avenues of access to these ideas remained limited. There were a handful of notable attempts by reformers (including Francke) to redress the general oversight of girls’ education, but by and large their education was a private matter and in any case guided by the traditional conception of women’s threefold *Bestimmung* as *Gattin*, *Mutter*, and *Hausfrau* (wife, mother, and housewife).
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      Despite these substantial obstacles, however, women did engage with the figures and debates of the time, and indeed they contributed in various and integral ways to the history of German philosophy throughout the eighteenth century. Similar to the British and French contexts, women in Germany exerted an important influence on intellectual culture directly through the publication of conventional treatises, but also indirectly through their correspondence with well-known philosophers, through provoking and mediating intellectual disputes, and (particularly in the second half of the eighteenth century) through hosting salons that attracted leading philosophers and scientists, among others (on all this, see the contributions in Dyck 2021b)[^dyck-2021b]. And, likewise comparable to the British and French contexts (cf. O’Neill 1997)[^o’neill-1997], these contributions have been widely overlooked in subsequent histories of German philosophy, both for familiar reasons having to do both with the narrowness of the conception of the philosophical canon (Shapiro 2016)[^shapiro-2016], but also due to the concerted efforts among nineteenth-century German philosophers to erase women’s contributions from the historical record (Ebbersmeyer 2020)[^ebbersmeyer-2020].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      ### 6.1 Women and the Thomasian Philosophy
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Women played crucial roles in the conception, refinement, and popularization of the key ideas and systems of the German Enlightenment, as can be seen by considering their contributions to and connections with the two major early philosophical schools of the period already discussed: the Leibnizian-Wolffian and the Thomasian(-Pietist). With respect to Thomasius, it should be noted that he makes quite clear himself that his intention in publishing his works in logic and ethics in the vernacular was to reach a wider audience, including women. Thus, the subtitle of his *Introduction to the Doctrine of Reason* indicates that it will show
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      > in an intelligible manner [how] to distinguish the true, probable, and false from one another and to discover new truths, all without syllogistics, for all reasonable people of whatever estate or gender they might be.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Among those women impacted by Thomasius’ logic is Dorothea Christiane Erxleben (*née* Leporin, 1715–62), who would later receive the first doctorate of medicine in Germany from the Friedrichs-Universität in Halle in 1753. In 1742 she published a treatise entitled *Gründliche Untersuchung der Ursachen, die das weibliche Geschlecht vom Studiren abhalten* (*Rigorous Investigation of the Causes that Obstruct the Female Sex from Study*). While Erxleben there draws on a variety of sources, including Wolffian thought (cf. Stiening 2020)[^stiening-2020], she makes good use of two aspects of Thomasius’ logic, namely, his practically-oriented account of *learnedness*, and the doctrine of prejudice presented in the concluding chapter (cf. Dyck 2021c)[^dyck-2021c]. So, in the *Rigorous Investigation*, Erxleben defines learnedness (“*Gelehrsamkeit*”) as
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      > *a grounded knowledge of such necessary and useful truths whereby the understanding and will, and consequently true human happiness, are improved*. (Erxleben 1742: §21 [2019: 44]; italics in original)[^erxleben-1742]
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Proceeding from this, she contends that it is important that and entirely possible for women to be able to attain such learnedness for the sake of the concerns of ordinary life.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Further, Erxleben identifies the widespread conviction that the attainment of learnedness is unsuitable for women as the result of prejudice, of which Erxleben distinguishes four principal types: that women are unsuited (in virtue of their natural capacities) to attain learnedness; that its attainment could not be useful for them; that learnedness could only be misused by women; and that women would only seek to attain learnedness to distinguish themselves from their peers. By way of rebutting these prejudices, Erxleben draws on an array of sources, including theological, philosophical, and medical authorities, and argues generally that whatever disparities might currently obtain between the apparent talents and achievements on the part of each sex are not the result of a difference in natural capacities but instead only evidence of the salutary effect of education on the human being (cf. Erxleben 1742: §71)[^erxleben-1742].
    step1: TBD
    step2: TBD
