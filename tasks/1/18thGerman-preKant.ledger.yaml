      托马修斯的道德理论是一种意志理论。他主张，在道德事务中，意志支配理性。人若不受外在约束，本有自由选择；但意志本身并不自由——它受人的种种激情支配：我们的激情、冲动与欲望。与霍布斯一样，托马修斯相信，纵然受制于这类内在的（心理的）约束，意志仍然在选择（理性从旁襄助）；它是在有意识地意愿。而一个有意识的选择，恰恰是（好的）行动称得上道德行动的先决条件：善良的本能或好的倾向可以让我们成为好人，甚至值得欲求，但单靠这个还不足以使我们成为道德的人——道德要求一个有意识的意志行为。道德的麻烦在于：意志被邪恶的欲望所决定，尤其是贪欲、野心与贪婪。固然也有高尚的情感同样左右着意志，但它们同那些消极倾向彼此冲突。这场冲突只有诉诸神恩（上帝的拯救）才能得到正面的了结；托马修斯的《道德学说运用》正以对神秘经验的正面处理而著称。
