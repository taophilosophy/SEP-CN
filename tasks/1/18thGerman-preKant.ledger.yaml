      Thomasius’ works cover a wide range of topics. In addition to the topical essays and dissertations already mentioned, Thomasius published major texts on natural law, including the *Institutiones jurisprudentiae divinae* (*Institutions of Divine Jurisprudence*) of 1688 and the *Fundamentum iuris naturae et gentium* (*Foundations of the Law of Nature and Nations*) of 1705 (for discussion of Thomasius’ contributions to natural law theory, which will not be taken up here, see especially Hochstrasser 2000: ch. 4; Kühnel 2001; and Lutterbeck 2002)[^hochstrasser-2000][^kühnel-2001][^lutterbeck-2002]. Thomasius also published on topics in theoretical and practical philosophy, especially during his time in Halle. Thomasius wrote a number of texts on logic, such as the *Introductio ad philosophiam auliam* (*Introduction to Court Philosophy*) of 1688, as well as the *Einleitung zur Vernunfft-Lehre* (*Introduction to the Doctrine of Reason*) and the *Ausübung der Vernunfft-Lehre* (*Application of the Doctrine of Reason*) both of 1691. These were followed by a parallel exhibition of his moral philosophy in the *Einleitung zur Sitten-Lehre* (*Introduction to the Doctrine of Morals*) of 1692 and the *Ausübung der Sitten-Lehre* (*Application of the Doctrine of Morals*) of 1696, as well as an influential excursion into metaphysics in the *Versuch vom Wesen des Geistes* (*Essay on the Essence of Spirit*) in 1699 (second edition 1709).
    step1: |-
      托马修斯的著作涵盖广泛的主题。除已提及的时论文章与学位论文之外，托马修斯还出版了自然法方面的主要文本，包括 1688 年的《神圣法理学要义》（*Institutiones jurisprudentiae divinae*，*Institutions of Divine Jurisprudence*）与 1705 年的《自然法与万民法之基础》（*Fundamentum iuris naturae et gentium*，*Foundations of the Law of Nature and Nations*）（关于托马修斯对自然法理论的贡献的讨论——此处不予论及——尤其参见 Hochstrasser 2000: ch. 4；Kühnel 2001；以及 Lutterbeck 2002）[^hochstrasser-2000][^kühnel-2001][^lutterbeck-2002]。托马修斯也出版过理论哲学与实践哲学方面的论著，尤其是在他身居哈勒的时期。托马修斯写过若干逻辑学文本，如 1688 年的《宫廷哲学导论》（*Introductio ad philosophiam auliam*，*Introduction to Court Philosophy*），以及 1691 年的《理性学说导论》（*Einleitung zur Vernunfft-Lehre*，*Introduction to the Doctrine of Reason*）与《理性学说运用》（*Ausübung der Vernunfft-Lehre*，*Application of the Doctrine of Reason*）。随后又有对其道德哲学的平行展示，即 1692 年的《道德学说导论》（*Einleitung zur Sitten-Lehre*，*Introduction to the Doctrine of Morals*）与 1696 年的《道德学说运用》（*Ausübung der Sitten-Lehre*，*Application of the Doctrine of Morals*），此外还有 1699 年（第二版 1709 年）对形而上学的一次影响深远的涉猎——《论精神本质试论》（*Versuch vom Wesen des Geistes*，*Essay on the Essence of Spirit*）。
    step2: |-
      托马修斯的著作题材广泛。除上面提到的时论与学位论文外，他还出版了几部自然法要籍：1688 年的《神圣法理学要义》（*Institutiones jurisprudentiae divinae*，*Institutions of Divine Jurisprudence*）和 1705 年的《自然法与万民法之基础》（*Fundamentum iuris naturae et gentium*，*Foundations of the Law of Nature and Nations*）（关于托马修斯自然法理论贡献的讨论——此处不拟展开——尤见 Hochstrasser 2000: ch. 4；Kühnel 2001；Lutterbeck 2002）[^hochstrasser-2000][^kühnel-2001][^lutterbeck-2002]。他还出版了理论与实践哲学两方面的论著，哈勒时期尤其多产。逻辑学方面，他写有 1688 年的《宫廷哲学导论》（*Introductio ad philosophiam auliam*，*Introduction to Court Philosophy*），以及同为 1691 年的《理性学说导论》（*Einleitung zur Vernunfft-Lehre*，*Introduction to the Doctrine of Reason*）与《理性学说运用》（*Ausübung der Vernunfft-Lehre*，*Application of the Doctrine of Reason*）。随后是他的道德哲学的平行展开：1692 年的《道德学说导论》（*Einleitung zur Sitten-Lehre*，*Introduction to the Doctrine of Morals*）与 1696 年的《道德学说运用》（*Ausübung der Sitten-Lehre*，*Application of the Doctrine of Morals*）；再就是 1699 年（第二版 1709 年）那部影响深远的形而上学之作——《论精神本质试论》（*Versuch vom Wesen des Geistes*，*Essay on the Essence of Spirit*）。
