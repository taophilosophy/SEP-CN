      亚历山大·戈特利布·鲍姆嘉通（Alexander Gottlieb Baumgarten）于 1714 年 6 月 17 日生于柏林。鲍姆嘉通三岁时丧母；父亲是驻军牧师兼堂区牧师，在他八岁那年（1722 年）去世，把他留给祖母和几位兄长照料。遵照父亲的意愿，鲍姆嘉通赴哈勒求学，进入弗兰克孤儿院（*Waisenhaus*）的拉丁语学校；他的兄长西格蒙德·雅各布（Siegmund Jakob，1706–57）——其人后来也成为著名神学家——在那里任督学。鲍姆嘉通学业优异，1730 年注册入大学，听弗兰克与朗格的神学课。虽然讲授沃尔夫哲学仍被禁止，鲍姆嘉通仍在兄长的鼓励下对沃尔夫思想作了一番透彻研究，在拉丁语学校讲授沃尔夫的逻辑学，并到耶拿大学拜访沃尔夫派学人。鲍姆嘉通转向哲学研究，1735 年获硕士（*Magister*）学位，讲授逻辑学与沃尔夫派形而上学；形而上学课他依自己的笔记口授（而非用教科书），他后来的《形而上学》（*Metaphysica*）即由这些笔记发展而来。1736 年，一种慢性肺疾中断了他的学术工作，他不得不住院于柏林；1737 年返回哈勒，继续讲课，声誉日隆。他在哈勒的职位是无薪的编外教授；1739 年他获聘奥得河畔法兰克福大学的职位，1740 年——就在沃尔夫凯旋归来前夕——离开哈勒。在法兰克福，鲍姆嘉通广泛讲授哲学，1742 年首次开设美学课。健康问题（很可能是肺结核）和其他困厄笼罩着鲍姆嘉通的最后十年；1762 年 5 月 26 日，他与世长辞。
