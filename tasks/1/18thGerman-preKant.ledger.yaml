      ### 4.2 Philosophy
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      Baumgarten’s metaphysics is frequently characterized as inclining more towards Leibniz than to the “Leibnizian-Wolffian” philosophy; for instance, he makes explicit reference to monads in his presentation of ontology and cosmology, and concerning the pre-established harmony he accepts that it obtains between all substances (not just between soul and body) and does not qualify his endorsement of the system as Wolff came to do (Baumgarten 1739: §761–9; cf. Watkins 2005: 73–81 for discussion)[^baumgarten-1739][^watkins-2005]. While there is no doubt that Baumgarten adopts a fundamentally Leibnizian picture in his ontology, including the endorsement of the principle of sufficient reason, to leave it at this would be to ignore the important and fruitful role that his Pietist background plays in his philosophical thought (Look 2018)[^look-2018]. Indeed, Baumgarten’s originality as a thinker consists in his efforts to amend key planks of Leibnizian (and Wolffian) thinking in light of his underlying Pietist commitments.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      This is particularly evident in Baumgarten’s treatment of freedom and immortality, where Wolff’s position on each was targeted by his Pietist critics. By way of addressing the Pietist objections to Wolff’s moral intellectualism and his reduction of freedom to mere spontaneity, Baumgarten offers an enriched empirical psychology, one that considers the influence of expectations of the future (and a future life) as motives, that allows that immoral action can proceed not only from ignorance but also from less lively cognition of the good, and that explicitly distinguishes spontaneity from freedom proper (Kawamura 1996; Schwaiger 2011)[^kawamura-1996][^schwaiger-2011]. On the topic of immortality, the Pietists had likewise objected to Wolff’s emphasis on the human soul’s preservation of its *cognitive* capacities in the afterlife, which state seems for Wolff to be disconnected to the human’s cultivation of virtue and piety in this life. Baumgarten seeks to rectify this by arguing that in addition to preserving its cognitive capacities in the afterlife, the soul will also retain its moral capacities including freedom, and that its condition of blessedness or damnation in the life to come will be a direct function of its moral condition (1739: §§782, 791; Dyck 2018)[^dyck-2018].
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Consistent with his orientation in metaphysics, Baumgarten is an original moral philosopher within the Wolffian tradition. He is notable, for instance, for the centrality of the notion of obligation in his ethics (Schierbaum and Walschots 2024)[^walschots-2024][^schierbaum-2024]. Wolff had framed a novel concept of obligation, rooted in the nature of things and actions themselves rather than the will of a sovereign, in accordance with which an obligation arises simply insofar as some motive is naturally connected to an action (GE §9). Yet, whereas Wolff only treats obligation briefly before considering specific duties, in Baumgarten’s hands the problem of obligation becomes the unifying theme for ethics, particularly in his *Initia* (Schwaiger 2009)[^schwaiger-2009]. Moreover, while Baumgarten accepts Wolff’s ethical perfectionism, in contrast with Wolff he downplays the connection between perfection and happiness, perhaps in response to Pietist denunciations of Wolff’s perfectionism as a veiled form of hedonism (Schwaiger 2011: 163ff; Bacin 2015)[^bacin-2015][^schwaiger-2011]. A last innovation is Baumgarten’s consideration of the ways in which ethical systems themselves can be flawed in that, for instance, they make a virtuous condition too easily attainable (flattering ethics) or set the bar for virtue too high for human nature (chimerical ethics) (Thorndike 2008; Dyck 2012)[^dyck-2012][^thorndike-2008].
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Turning finally to Baumgarten’s aesthetics, it is notable that while Wolff himself had comparatively little to say about the philosophy of art (but see Beiser 2009; and Buchenau 2013)[^beiser-2009][^buchenau-2013], a number of thinkers in the Wolffian tradition took a keen interest in the topic. The first to develop a theory of the arts, particularly poetry, was Johann Christoph Gottsched (1700–1766), who published his *Versuch einer critischen Dichtkunst vor die Deutschen* (*Attempt at a Critical Poetry for the Germans*) in 1730. Treating poetry scientifically, he set out a set of rules that were to guide the composition. Given his conception of what a poem was (a moral fable) and given as well his idea of what was involved in its composition (a set of rules), there was little room here for beauty and even less for sentiment and inspiration.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      It was left to Baumgarten to formulate a recognizably modern aesthetic doctrine on Wolffian foundations. This he did through focusing on the soul’s faculty of sensibility, ultimately identifying aesthetics as the science of sensible cognition. Where Wolff had conceived of the senses merely as providing the raw material for thinking, Baumgarten thought that the senses had their own rules and their own perfection, rules and perfection that differ from logical rules and the knowledge generated by the process of intellectual clarification. So, while representations might be logically perfect and attain to intensive clarity insofar as we distinguish a number of marks within it, representations of the senses, even as confused representations, can attain to *extensive* clarity inasmuch as they represent a multitude of things (Baumgarten 1735: §17)[^baumgarten-1735]. In this way, poetic representation can be richer, and more moving, than representations attained through the use of the understanding—moving since Baumgarten contends that such representations as (aesthetically) perfect can occasion pleasure in us, and accordingly can also play a role in the development of our character (Spalinger 2025)[^spalinger-2025].
    step1: TBD
    step2: TBD
