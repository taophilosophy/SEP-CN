      More positively, Crusius endorses the principle of determining reason but denies that it admits of unlimited use, which he claims, echoing Lange, would entail fatalism. Rather, Crusius excludes what he terms “free first [or *fundamental*] actions” from the scope of the principle. These actions proceed directly from the basic powers of the acting substance under appropriate circumstances (Crusius 1745: §82)[^crusius-1745], but are such that they can be undertaken or omitted by the acting subject (that is, they are not *determined*) (Crusius 1743: §XXV)[^crusius-1743]. That such actions are possible, Crusius claims, is clear given that God’s action would be of this sort, but also given the testimony of our own inner experience, which discloses the acts of our own will to be just such actions (Crusius 1743: §IX)[^crusius-1743]. Crusius thus accepts that the principle of determining reason holds for all events that are *not* the result of a free first action, whereas free first actions no doubt have a cause but are not such that could not have occurred otherwise (or not at all).
    step1: |-
      更积极地说，克鲁修斯支持决定理由原则，但否认它容许无限制的使用；他说——回应着朗格——无限制的使用会蕴含宿命论。毋宁说，克鲁修斯把他所谓的“自由的第一行动［或*首要*行动］”排除在该原则的适用范围之外。这些行动在适当的情况下直接出自行动着实体的基本能力（Crusius 1745: §82）[^crusius-1745]，但其性质是行动主体可以为之或不为（也就是说，它们不是*被决定的*）（Crusius 1743: §XXV）[^crusius-1743]。克鲁修斯主张，这类行动之可能是明显的：上帝的行动就属于此类，而且我们自己内部经验的见证也表明，我们意志的种种行为恰是这样的行动（Crusius 1743: §IX）[^crusius-1743]。因此，克鲁修斯接受：决定理由原则对一切*不是*自由第一行动之结果的事件成立；而自由的第一行动固然有其原因，却不是那种不可能以别的方式发生（或根本不发生）的事件。
    step2: |-
      往积极处说，克鲁修斯支持决定理由原则，却否认它可以无限制地使用——无限制地用，就会像朗格说的那样滑向宿命论。毋宁说，克鲁修斯把他所说的“自由的第一行动［或*首要*行动］”划出了这条原则的适用范围。这类行动在适当的境况下直接出自行动着实体的基本能力（Crusius 1745: §82）[^crusius-1745]，但行动主体可做可不做——也就是说，它们不是*被决定的*（Crusius 1743: §XXV）[^crusius-1743]。这类行动何以可能？克鲁修斯说，再明白不过：上帝的行动就属于此类；而且我们自己内在经验的见证也表明，我们意志的种种行为恰恰就是这样的行动（Crusius 1743: §IX）[^crusius-1743]。于是克鲁修斯接受：凡*不是*自由第一行动之结果的事件，决定理由原则一概适用；而自由的第一行动固然也有原因，却不是那种不可能换一种方式发生（或干脆不发生）的事件。
