      A variety of circumstances—religious, political, and social—conspired to give women limited opportunities to engage in and with the contemporary intellectual culture, even compared to their French- and English-speaking contemporaries. The German-speaking lands of Europe lacked a major cosmopolitan centre, like London or Paris, to germinate progressive ideas and to propagate those developed abroad. Moreover, the fact that, in spite of Thomasius’ and Wolff’s efforts, German intellectuals continued to publish (and teach) in Latin through the first half of the eighteenth century, meant that women’s avenues of access to these ideas remained limited. There were a handful of notable attempts by reformers (including Francke) to redress the general oversight of girls’ education, but by and large their education was a private matter and in any case guided by the traditional conception of women’s threefold *Bestimmung* as *Gattin*, *Mutter*, and *Hausfrau* (wife, mother, and housewife).
    step1: |-
      各种境况——宗教的、政治的与社会的——合谋使女性接触并参与当时思想文化的机会有限，甚至与讲法语和英语的同代人相比也是如此。欧洲的德语地区缺少一个像伦敦或巴黎那样的大都会中心，来孕育进步观念、传播在国外发展起来的观念。此外，尽管有托马修斯与沃尔夫的努力，德国知识人整个 18 世纪上半叶仍用拉丁语出版（和授课），这意味着女性接触这些观念的途径仍然有限。改革者（包括弗兰克）曾有过少数值得注意的尝试，以矫正对女童教育的普遍忽视；但大体而言，她们的教育是私人事务，且无论如何都受着关于女性三重*天职*（*Bestimmung*）——*Gattin*（妻子）、*Mutter*（母亲）、*Hausfrau*（主妇）——的传统观念的引导。
    step2: |-
      宗教的、政治的、社会的种种境况合在一起，把女性接触并参与当时思想文化的机会压得很低——跟讲法语、英语的同代人比也是如此。欧洲的德语地区缺一个伦敦或巴黎那样的大都会中心：既没能孕育本土的进步观念，也难以传播国外发展起来的观念。更何况，尽管有托马修斯与沃尔夫的努力，德国知识人整个 18 世纪上半叶还在用拉丁语出版（和授课）；女性通向这些观念的路，自然依旧窄狭。改革者（弗兰克也在内）确实有过几次引人注目的尝试，想纠正对女童教育的普遍忽视；但大体上，她们的教育仍属私人事务，而且无论如何都受着那套传统观念的指引：女性的三重*天职*（*Bestimmung*）——*Gattin*（妻子）、*Mutter*（母亲）、*Hausfrau*（主妇）。
