      ## 5. Christian August Crusius
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      As Baumgarten sought in a conciliatory spirit to make the Wolffian philosophy responsive to Pietist concerns, Christian August Crusius mounted a renewed, Pietist-inspired but philosophically-sophisticated assault on the foundations of that system. Through his dissertations and textbooks, Crusius succeeded in raising trenchant objections to the Leibnizian-Wolffian philosophy, and indeed to the strongest forms of philosophical rationalism, and he formulated an influential and systematic alternative in which the will and its freedom are central concerns.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      ### 5.1 Life and Works
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      Christian August Crusius was born 10 June 1715 in Leuna, near Halle, the son of a pastor (and his mother was a pastor’s daughter). He matriculated at the University of Leipzig in 1734, where he studied a number of subjects but was particularly interested in theology and philosophy. At Leipzig, Crusius came under the influence of the philosopher (and physician) Adolf Friedrich Hoffmann (1707–1741), a disciple of Andreas Rüdiger (1673–1731) who had been a close associate of Thomasius. Crusius attained the *Magister* in philosophy in 1737 and habilitated in philosophy in 1740. He followed his philosophical studies with a baccalaureat in theology in 1742, though he would proceed to seek a position in the philosophy faculty. To this end, he defended two dissertations in philosophy, one of which, the *Dissertatio philosophica de usu et limitibus principii rationis determinantis, vulgo sufficientis* (*Philosophical Dissertation on the Use and Limits of the Principle of Determining Reason, commonly called Sufficient*) of 1743 was a critical discussion of the principle of sufficient reason. He became a professor of philosophy (*extraordinarius*) at Leipzig in 1744.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Crusius’ major philosophical works followed in quick succession. He published his textbook on ethics, the *Anweisung vernünftig zu Leben* (*Guide to Rational Living*) in 1744; this was followed by the elaboration of his metaphysics, *Entwurf der nothwendigen Vernunft-Wahrheiten* (*Sketch of the Necessary Truths of Reason*) in 1745; and a text in logic, the *Weg zur Gewißheit und Zuverläßigkeit der menschlichen Erkenntiß* (*Path to the Certainty and Reliability of Human Cognition*) was published in 1747 (a final philosophical treatise on physics followed in 1749). As an ordinary professorship in philosophy was not available, Crusius joined the theology faculty at Leipzig in 1750. While he remained a member of the philosophy faculty and continued his lectures (and revised his previous publications for later editions), from this point on his original publications are devoted to theological topics. He died in Leipzig on 18 October 1775.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      ### 5.2 Philosophy
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Crusius is widely and rightly regarded as the most sophisticated philosopher within the so-called “Thomasian-Pietist tradition” (on the appropriateness of such a designation, see Fugate 2026)[^fugate-2026]. Crusius sets out to offer an alternative to the core claims of the Leibnizian-Wolffian philosophy on topics in metaphysics, epistemology, logic and practical philosophy. As Lange had previously, Crusius targets the principle of sufficient reason, and its employment in Leibnizian-Wolffian metaphysics, for criticism. Crusius diagnoses a number of ambiguities in the Wolffian presentation of the principle. He opts to refer to a reason (*ratio*; *Grund*) that, when present, determines something to come to be such that the opposite would be impossible as a *determining reason*, and accordingly refers to the principle (in the sense intended by Leibniz and Wolff) as the *principle of determining reason* (Crusius 1743: §II–III)[^crusius-1743]. Crusius then critically discusses each of Wolff’s attempts to prove the principle—concerning the first such proof (presented in §3.1, above), Crusius claims that the most charitable reconstruction of it is circular. To show this, Crusius reformulates Wolff’s proof as the following syllogism (using Wolff’s preferred terminology):
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      > Whatever cannot come to be except from some other cause, has a sufficient reason.
      >
      > Everything that is cannot come to be except from another cause.
      >
      > Therefore, whatever is has a sufficient reason. (Crusius 1743: §XI [2019: 207])[^crusius-1743]
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      As Crusius notes, however, the minor in this case is just a version of the principle of sufficient reason itself, so that as a proof of that principle this argument begs the question.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      More positively, Crusius endorses the principle of determining reason but denies that it admits of unlimited use, which he claims, echoing Lange, would entail fatalism. Rather, Crusius excludes what he terms “free first [or *fundamental*] actions” from the scope of the principle. These actions proceed directly from the basic powers of the acting substance under appropriate circumstances (Crusius 1745: §82)[^crusius-1745], but are such that they can be undertaken or omitted by the acting subject (that is, they are not *determined*) (Crusius 1743: §XXV)[^crusius-1743]. That such actions are possible, Crusius claims, is clear given that God’s action would be of this sort, but also given the testimony of our own inner experience, which discloses the acts of our own will to be just such actions (Crusius 1743: §IX)[^crusius-1743]. Crusius thus accepts that the principle of determining reason holds for all events that are *not* the result of a free first action, whereas free first actions no doubt have a cause but are not such that could not have occurred otherwise (or not at all).
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Along with his efforts to secure a place for genuine freedom of the will in his metaphysics, Crusius also emphasizes the limits of the human understanding. Crusius claims that the acts of the understanding are governed by principles, including a formal principle (the principle of contradiction), but also and importantly a number of “material” principles that govern what is thinkable for the human mind (where what is unthinkable is not for that reason contradictory). Among these principles are the *principle of inseparability*, according to which that which cannot be separated in thought cannot be separated in fact, and the *priniciple of incombinability*, according to which that which cannot be combined in thought cannot in fact be combined (Crusius 1743: §XXVII; 1745: §15)[^crusius-1743]. Significantly, and drawing on Thomasius (via Hoffmann 1737)[^hoffmann-1737], Crusius contends that these principles which together constitute the “essence of the understanding” supply us with a criterion of truth, which consists in the agreement of thoughts with things, such that only that can be true which conforms to the principles of human understanding (Crusius 1745: §15; 1747: §51)[^crusius-1745]. These material principles are subsequently used by Crusius to vindicate a variety of substantive metaphysical claims, including one he dubs the principle of sufficient *cause* (Crusius 1745: §31)[^crusius-1745]. (For discussion of many of these points, see Chapman 2023.)[^chapman-2023] On this basis, Crusius erects his own distinctive metaphysics, proceeding through the now-established Wolffian topics, though Crusius assigns natural theology a place more befitting its importance and ignores empirical psychology because it takes up spontaneous and free acts of the mind and so does not concern *necessary* truths of reason, the only proper subject of metaphysics (but see Heßbrüggen-Walter 2021 on the role of experience in Crusius’ metaphysics)[^heßbrüggen-walter-2021].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Crusius’ attack on Wolffianism continues in his logic and his thoughts on moral philosophy. In a clear rebuke of Wolff, Crusius begins his logic by rigidly distinguishing between the methods of mathematics and philosophy, contending that where the former makes use of demonstrations that rely solely on the principle of contradiction (and relate to mere possibilities or hypothetical realities), the latter must take into account other principles when, for instance, the investigation of causes are at issue (Crusius 1747: §10)[^crusius-1747]. Commensurate with this, Crusius’ considerations of the traditional topics of logic—concepts, propositions, and inferences—is thoroughly informed by his account of the essence of the understanding: a philosophical inference, as opposed to a mathematical syllogism, can have as its basis what permits of being separated or combined in thought (Crusius 1747: §262)[^crusius-1747]. Crusius also considers the relation between philosophy and theology or revealed religion, contending for the utility of philosophy for students of theology but also arguing that religion provides a needed corrective to the misuse of philosophy which, when left to its own devices, tends to lay claim to the unrestricted use of its principles (such as PSR) whereas the appropriate restrictions are typically evident to the theologian (Crusius 1747: §32)[^crusius-1747].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Crusius’ ethics is characterized by the principled separation of the will from the understanding as distinct powers, and a re-orientation of his moral theory with respect to the former. The human will depends on the understanding to supply it with ideas in accordance with which it acts, but Crusius is clear that the will is not solely determined to its action through some cognition (i.e., of perfection) in the act itself; rather, the goodness of an action consists more generally in its being conformable to the will (Crusius 1745: §26; Schneewind 1998: 447)[^crusius-1745][^schneewind-1998], and in any case the human will is always free to act or to omit to act in accordance with the understanding’s ideas. The human will is possessed of three basic desires—the first is for our own perfection, in accordance with which the talents of the intellect among others are promoted (Crusius 1745: §117)[^crusius-1745]; for unification with objects perceived as perfect, from which proceeds a drive to moral love through which we desire to join with other rational beings without any further end (Crusius 1745: §125)[^crusius-1745]; and finally, the desire to recognize a divine law which, despite its abstract-sounding name, is identified by Crusius with the phenomenon of conscience (*Gewissenstrieb*). It is through conscience that we are able to recognize the divinely given moral law (Crusius 1745: §132)[^crusius-1745], and conscience thereby also discloses our dependence on God as divine lawgiver (Crusius 1745: §165)[^crusius-1745]. As such, conscience supplies us with a motivation to obedience where, according to Crusius, this obedience constitutes an essential component (the “form”) of virtue (Crusius 1745: §177)[^crusius-1745]. A derivation of our duties thus depends on a consideration of God and His aim in creating the world, which Crusius identifies as *all* human beings’ attainment of virtue, as opposed to knowledge or happiness in its own right, through their free actions (Crusius 1745: §213)[^crusius-1745]. On this basis, he proceeds to derive duties to God, to others, and to the self (for discussion, see Schneewind 1998: 452–6)[^schneewind-1998].
