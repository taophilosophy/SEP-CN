      Christian Thomasius was born on 1 January 1655 in Leipzig. He was the son of Jakob Thomasius (1622–84), a well-known jurist and philosopher at the University of Leipzig who counted Leibniz among his students. Christian (hereafter simply ‘Thomasius’) matriculated in the philosophy faculty at Leipzig in 1669, and was promoted to *Magister artium* in 1672. As a result of his father’s lectures, particularly on Hugo Grotius’ *De jure belli ac pacis*, and his interest in Samuel Pufendorf’s *De jure naturae et gentium*, Thomasius took up the study of law in Frankfurt an der Oder in 1675 and was awarded a doctorate in 1679. After a brief journey to Holland, Thomasius returned to Leipzig where he worked (unhappily) as a lawyer while also holding private lectures on natural jurisprudence. Thomasius attests to the fundamental reorientation of his thinking effected by his reading of Pufendorf, and the *Apologia pro se et suo libro* (1674) in particular, which he credits for convincing him of the independence of natural law from theology as well as of the need to question authority and resist religious intolerance (Thomasius 1688a, “Diss. Proem.” §§5–10; Hochstrasser 2000: 113–121)[^thomasius-1688a][^hochstrasser-2000]. This new anti-authoritarian cast of mind is clearly evident in a dissertation on bigamy of 1685, in which Thomasius defends the practice as consistent with natural law, and which unsurprisingly led to a confrontation with a professor in the theology faculty at Leipzig. Thomasius’ pioneering decision to hold lectures in German, announced (in German) in 1687, likewise provoked controversy, as did his publication beginning in 1688 of a monthly journal (the first periodical published in German), entitled the *Monatsgespräche*, in which Thomasius commented, frequently satirically, on the local intellectual scene. Thomasius’ lectures and publications increasingly generated conflict with the theological faculty in Leipzig, which upheld a rather strict form of Lutheran orthodoxy, and while his connections with the Saxon court stood him in good stead for a time, his defence of an inter-faith marriage involving a (Lutheran) Saxon count and a (Calvinist) Brandenburg princess cost him his protection, and in March 1690 he was prohibited from publishing and holding lectures (private and academic) in Electoral Saxony.
    step1: |-
      克里斯蒂安·托马修斯（Christian Thomasius）于 1655 年 1 月 1 日生于莱比锡。他是雅各布·托马修斯（Jakob Thomasius，1622–84）之子；老托马修斯是莱比锡大学一位知名的法学家兼哲学家，莱布尼兹也曾列于其门下。克里斯蒂安（此后径称“托马修斯”）于 1669 年进入莱比锡大学哲学系注册就读，并于 1672 年获文科硕士（*Magister artium*）学位。由于父亲的讲授——尤其是关于雨果·格劳秀斯（Hugo Grotius）《战争与和平法》（*De jure belli ac pacis*）的讲课——以及他自己对塞缪尔·普芬道夫（Samuel Pufendorf）《论自然法与万民法》（*De jure naturae et gentium*）的兴趣，托马修斯于 1675 年赴奥得河畔法兰克福攻读法学，并于 1679 年获博士学位。在短暂游历荷兰之后，托马修斯回到莱比锡，一边（并不愉快地）操律师业，一边开设自然法理学的私人讲座。托马修斯亲证，阅读普芬道夫——尤其是《为自我及其著作辩护》（*Apologia pro se et suo libro*，1674）——使他的思想发生了根本的重定向；他把这一阅读归功为使自己确信自然法独立于神学，以及必须质疑权威、抵抗宗教不宽容（Thomasius 1688a, “Diss. Proem.” §§5–10; Hochstrasser 2000: 113–121）[^thomasius-1688a][^hochstrasser-2000]。这种新的反权威心智取向清楚地体现在 1685 年一篇关于重婚的论文中；托马修斯在其中为重婚实践辩护，认为其合于自然法，而这不出意料地导致了他与莱比锡大学神学系一位教授的当面对峙。托马修斯用德语开课的开创性决定（1687 年以德语公告）同样引起了争议；他自 1688 年起出版的一份月刊（第一份用德语出版的期刊）也一样，该刊名为《月度谈话》（*Monatsgespräche*），托马修斯在其中——常常以讽刺的笔调——对当地的思想界评头论足。托马修斯的讲课和出版物日益加剧了他与莱比锡神学系的冲突，后者持守一种相当严格的路德宗正统；虽然他与萨克森宫廷的联素一度使他左右逢源，但他为一起跨信仰婚姻——一位（路德宗的）萨克森伯爵与一位（加尔文宗的）勃兰登堡公主的婚姻——所作的辩护使他失去了庇护，1690 年 3 月，他被禁止在萨克森选侯国出版和开课（无论私人课程还是大学课程）。
    step2: |-
      克里斯蒂安·托马修斯（Christian Thomasius）1655 年 1 月 1 日生于莱比锡，是雅各布·托马修斯（Jakob Thomasius，1622–84）之子；老托马修斯是莱比锡大学颇有名望的法学家兼哲学家，莱布尼茨也曾出自他的门下。克里斯蒂安（此后径称“托马修斯”）1669 年注册进入莱比锡大学哲学系，1672 年获文科硕士（*Magister artium*）学位。父亲讲授的课程——尤其是关于雨果·格劳秀斯（Hugo Grotius）《战争与和平法》（*De jure belli ac pacis*）的课——加上他自己对塞缪尔·普芬道夫（Samuel Pufendorf）《论自然法与万民法》（*De jure naturae et gentium*）的兴趣，促使托马修斯 1675 年赴奥得河畔法兰克福改习法学，1679 年获博士学位。在荷兰小游之后，他回到莱比锡，一边（并不愉快地）操律师业，一边开设自然法理学的私人讲座。托马修斯亲口证实，读普芬道夫——特别是《为自我及其著作辩护》（*Apologia pro se et suo libro*，1674）——使他的思想发生了根本转向；正是这次阅读让他确信自然法独立于神学，也让他懂得必须质疑权威、抵抗宗教不宽容（Thomasius 1688a, “Diss. Proem.” §§5–10; Hochstrasser 2000: 113–121）[^thomasius-1688a][^hochstrasser-2000]。这种新的反权威心智取向，清楚地表露在 1685 年一篇论重婚的学位论文里：托马修斯为重婚实践辩护，称其合于自然法——这不出所料地招致他与莱比锡大学神学系一位教授的正面冲突。托马修斯 1687 年宣布（并以德语公告）用德语开课，这一开创性决定同样掀起争议；他自 1688 年起刊行的月刊——也是第一份用德语出版的期刊——同样如此。这份名为《月度谈话》（*Monatsgespräche*）的刊物里，托马修斯频频以讽刺笔调点评当地思想界。他的讲课与著述同莱比锡神学系的冲突愈演愈烈——后者持守相当严格的路德宗正统。他与萨克森宫廷的关系一度让他左右逢源，可他为一起跨信仰婚姻（路德宗的萨克森伯爵迎娶加尔文宗的勃兰登堡公主）辩护，结果失去了这层庇护：1690 年 3 月，他被禁止在萨克森选侯国境内出版和授课（私课与大学课程均在禁止之列）。
