    source: |-
      - According to *textbook quantum theory*, the wave function of a particle classically trapped in the nucleus leaks out of the nucleus symmetrically, filling the space surrounding the nucleus. At the moment of the detection this wave function magically disappears everywhere except at the particular detector that clicks.
      - According to the *Many Worlds* interpretation, all detectors click. In fact, each detector clicks at every moment of time, but the wave function of the universe branches continuously into innumerable branches: we, ourselves, happen to be in one particular branch in which one particular detector clicks at one particular time.
      - According to the *Bohmiam interpretation*, the wave function equally leaks uniformly in space, but in the meanwhile the associated particle, guided by this wave function, zigzags around, until hitting a particular detector.
      - According to *Physical Collapse* interpretations, the wave function also leaks out uniformly, but when its effect on the heavy Geiger detectors begins to displace too much matter, the wave function collapses as in the textbook interpretation, but driven by a hypothetical dynamical process which has not yet been explicitly observed (Ghirardi 2018)[^ghirardi-2018].
      - What about *RQM*? In the spirit of Heisenberg, there is no actual wave function out there in nature, nor there is any fact of the matter about *the position of the particle respect to the Geiger counter* at any moment between $t_1$and $t_2$. The lack of determination of variables in quantun theory, in particular in RQM, has been discussed in (Calosi and Mariani 2020)[^calosi-2020]. However, there may be other facts of the matter. For instance, *the position of the particle respect to some air molecule along the way*. These, on the other hand, *have no bearing* on the position of the particle with respect to the Geiger counter, which actualises at time $t_2$. The probabilistic distribution of this position does not depend on the position of the particle with respect to the air molecules.
    step1: |-
      - 按*教科书量子理论*，一个被经典地困于核内的粒子的波函数会对称地从核中漏出，充满核周围的空间。在探测的瞬间，这个波函数除在咔嗒作响的那个探测器处之外，到处都魔法般地消失了。
      - 按*多世界*解释，所有探测器都会响。事实上，每个探测器在每一时刻都在响，但宇宙的波函数持续分支为无数分支：我们自己恰好处在某一特定分支中，在其中某个特定探测器在某个特定时刻响了一声。
      - 按*玻姆解释*，波函数同样均匀地在空间中漏出，但同时，与之关联的粒子在这波函数的导引下四处曲折运动，直到击中某个特定探测器。
      - 按*物理坍缩*解释，波函数同样均匀漏出，但当它对沉重的盖革探测器的作用开始使过多物质发生位移时，波函数就如教科书解释那样坍缩，只不过是由一个尚未被明确观测到的假想动力学过程所驱动（Ghirardi 2018）[^ghirardi-2018]。
      - *RQM* 呢？按海森堡的精神，自然界中并没有实际存在的波函数；在 $t_1$ 与 $t_2$ 之间的任何时刻，也不存在关于*粒子相对于盖革计数器的位置*的事实。量子理论中变量未获确定这一点，尤其在 RQM 中，已在（Calosi and Mariani 2020）[^calosi-2020]中讨论。然而，可能存在其他事实。例如，*粒子相对于沿途某个空气分子的位置*。反过来，这些事实对粒子相对于盖革计数器的位置*没有影响*，而后者在时刻 $t_2$ 实现。这一位置的概率分布，不取决于粒子相对于空气分子的位置。
