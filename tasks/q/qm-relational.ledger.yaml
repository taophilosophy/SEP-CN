      Several presentations of quantum theory interpret the wave function of a system, or its quantum state $\psi$, as properties of the system as such. From the perspective of RQM, this is what generates the confusion about quantum theory (Rovelli 2018)[^rovelli-2018]. RQM is realist about quantum states in the weak sense that they represent something physically real: for instance, after a procedure that we call “state preparation”, there is a matter of fact about what that preparation was; preparations giving distinct pure quantum states correspond to distinct physical states of affairs. These “states of affaires”, however, are*relative to the preparation apparatus*, they are not states of the system alone. This, in particular, renders RQM compatible with the ψ-Ontology theorems like the PBR theorem for the reality of the wave function (Pusey, Barrett, & Rudolph 2012; Leifer 2014)[^leifer-2014]. The PBR theorem applies to RQM, construed as a theorem about relative states. The peaceful coexistence between between RQM these theorems has been discussed in (Calosi and Oldofredi 2021)[^calosi-2021][^oldofredi-2021].
    step1: |-
      量子理论的许多表述把系统的波函数或量子态 $\psi$ 解释为系统自身的性质。从 RQM 的视角看，正是这一点造成了关于量子理论的混乱（Rovelli 2018）[^rovelli-2018]。RQM 在弱意义上对量子态持实在论态度：它们表示某种物理上真实的东西。例如，在经历了我们称为“态制备”的程序之后，那次制备究竟是什么，是一个事实问题；制备出不同纯量子态，对应着不同的物理事态。然而，这些“事态”*相对于制备装置*，并不是单独属于系统的状态。这尤其使 RQM 与 ψ-本体论定理相容，例如关于波函数实在性的 PBR 定理（Pusey, Barrett, & Rudolph 2012; Leifer 2014）[^leifer-2014]。PBR 定理适用于 RQM，只要把它理解为关于相对态的定理。RQM 与这些定理的和平共处已在（Calosi and Oldofredi 2021）[^calosi-2021][^oldofredi-2021]中讨论。
    step2: |-
      量子理论的许多表述，把系统的波函数或量子态 $\psi$ 当作该系统自身的性质。在 RQM 看来，关于量子理论的种种混乱正由此而生（Rovelli 2018）[^rovelli-2018]。RQM 对量子态持一种弱实在论：量子态表示某种物理上真实的东西。例如，在经历我们称为“态制备”的程序之后，“那次制备是什么”确有其事实；制备出不同的纯量子态，对应着不同的物理事态。然而这些“事态”**相对于制备装置**，并不单单属于系统本身。正因如此，RQM 才与 ψ-本体论一类的定理相容，例如论波函数实在性的 PBR 定理（Pusey, Barrett, & Rudolph 2012; Leifer 2014）[^leifer-2014]：把 PBR 定理读作关于相对态的定理，它便适用于 RQM。RQM 与这类定理的和平共处，已在（Calosi and Oldofredi 2021）[^calosi-2021][^oldofredi-2021] 中讨论。
