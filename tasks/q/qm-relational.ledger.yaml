      The claim at the basis of RQM is that “different observers can give different accounts of the same set of events” (Rovelli 1996: 1643)[^rovelli-1996]. Textbook quantum mechanics is a complete description of the perspective of a single system, but it disregards the effect of this system on the perspective of other systems. RQM emphasises the fact that any observer itself behaves as a quantum system, when acting on other systems. Vincenzo Fano (2024 [Other Internet Resources]) gives a simple illustration of how RQM applies to common apparently paradoxical situation in quantum mechanic. The relation between perspectives is discussed below.
    step1: |-
      RQM 的基础主张是：“不同的观察者可以对同一组事件给出不同的描述”（Rovelli 1996: 1643）[^rovelli-1996]。教科书量子力学是对单一系统视角的完备描述，但它忽视了这个系统对其他系统视角的影响。RQM 强调：任何观察者自身在作用于其他系统时，都表现为一个量子系统。Vincenzo Fano（2024 [Other Internet Resources]）给出了一个简单例子，说明 RQM 如何适用于量子力学中常见而表面悖谬的情境。视角之间的关系见下文。
    step2: |-
      RQM 的立论是：“不同的观察者可以对同一组事件给出不同的描述”（Rovelli 1996: 1643）[^rovelli-1996]。教科书量子力学完备地描述单个系统的视角，却无视该系统对其他系统视角的影响。RQM 强调：任何观察者作用于其他系统时，自身就是一个量子系统。Vincenzo Fano（2024 [Other Internet Resources]）举了一个浅例，说明 RQM 如何处理量子力学中常见而看似悖谬的情形。视角之间的关系见下文。
