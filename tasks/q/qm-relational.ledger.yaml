      If $\psi'$ and $\psi''$ are two orthogonal quantum states of a system, quantum mechanics assumes that the system can also be in the state $\psi = (\psi' +\psi'')/\sqrt{2}$. This is the superposition principle, a cornerstone of the theory (Dirac 1930)[^dirac-1930]. If $\psi'$ is the state of a live cat and $\psi''$ the state of a dead cat, then $\psi$ is a state in which the cat is in a quantum superposition of dead and alive; the theory predicts that this is a possible (relative) state of a cat. What does RQM say about situations such as this? Is the cat in some sense half alive and half dead?
    step1: |-
      若 $\psi'$ 与 $\psi''$ 是系统两个正交的量子态，量子力学假定系统也可以处于态 $\psi = (\psi' +\psi'')/\sqrt{2}$。这就是叠加原理，理论的基石（Dirac 1930）[^dirac-1930]。若 $\psi'$ 是活猫的态、$\psi''$ 是死猫的态，那么 $\psi$ 就是猫处于死与活之量子叠加的态；理论预言这是猫的一个可能（相对）态。RQM 对这类情形怎么说？猫在某种意义上半死半活吗？
    step2: |-
      若 $\psi'$ 与 $\psi''$ 是系统两个正交的量子态，量子力学便假定系统也可处于态 $\psi = (\psi' +\psi'')/\sqrt{2}$：这就是叠加原理，理论的基石（Dirac 1930）[^dirac-1930]。若 $\psi'$ 是活猫之态、$\psi''$ 是死猫之态，则 $\psi$ 便是猫处于死活叠加的态；理论预言，这是猫的一个可能（相对）态。RQM 对此类情形怎么说？猫在某种意义上半死半活吗？
  - id: 30
    kind: body
    source: |-
      The existence of states like $\psi =(\psi' +\psi'')/\sqrt{2}$does not mean that we “see superpositions” (as sometimes wrongly stated): what we “see”, namely what we measure, according to textbook quantum theory, are eigenvalues of self-adjoint operators, not quantum states. Measured eigenvalues are always univocal, never “superimposed”. To be a superposition, rather, means two things. First, that if an observable has value $a'$ in $\psi'$ and value $a''$ in $\psi''$ then any observation of the system will give either $a'$ or $a''$, each with probability 1/2. Second, the probability distribution of the outcomes of the measurement of any observable that is not diagonal in the $(\psi'$, $\psi''$) basis will be affected by interference: that is, it will not be the mean of the average values of the observable in $\psi'$ and $\psi''$. In RQM, this and nothing else is the meaning of being in a quantum superposition.
    step1: |-
      像 $\psi =(\psi' +\psi'')/\sqrt{2}$ 这样的态存在，并不意味着我们“看到叠加”（人们有时会这样误说）：按教科书量子理论，我们所“看到”的、即所测量的，是自伴算符的本征值，而非量子态。被测的本征值总是单义的，从不“叠加”。成为叠加，其实意味着两件事。第一，若某可观测量在 $\psi'$ 中取值 $a'$、在 $\psi''$ 中取值 $a''$，则对该系统的任何观察都会给出 $a'$ 或 $a''$，各以概率 1/2。第二，对任何在 $(\psi'$, $\psi''$) 基下非对角的可观测量，其测量结果的概率分布都会受干涉影响：也就是说，它不会是该可观测量在 $\psi'$ 与 $\psi''$ 中平均值的平均。在 RQM 中，处于量子叠加的含义仅此而已。
    step2: |-
      像 $\psi =(\psi' +\psi'')/\sqrt{2}$ 这类态的存在，并不意味着我们“看见叠加”（此说时有所闻，实属误解）：按教科书量子理论，我们“看见”即测量到的，是自伴算符的本征值，而非量子态；被测的本征值总是单义的，从不“叠加”。说某态是叠加，其实只意味着两件事。其一，若某可观测量在 $\psi'$ 中取 $a'$、在 $\psi''$ 中取 $a''$，则对该系统的任何观察都给出 $a'$ 或 $a''$，各以概率 1/2。其二，对任何在 $(\psi'$, $\psi''$) 基下非对角的可观测量，其测量结果的概率分布都会受干涉影响：它不会是该可观测量在 $\psi'$ 与 $\psi''$ 中取值的平均之平均。在 RQM 中，“处于量子叠加”的含义不过如此。
