  - id: 10
    kind: body
    source: |-
      The starting point of RQM is that quantum mechanics is not about a wave function or a quantum state $\psi$; it is about values of physical variables. The basic ontology assumed by RQM, accordingly, includes only physical systems and variables that take values, as in classical mechanics. For instance, a real fact is the position of a particle having a certain value $x$ at a certain time $t$. Facts as this one (“the particle is at $x$ at time $t$”) are called “events”, or “quantum events”. Quantum theory is about such events. There are however two differences between facts in quantum mechanics and facts in classical mechanics. In classical mechanics, there are two general assumptions that are abandoned in RQM:
    step1: |-
      RQM 的出发点是：量子力学不是关于波函数或量子态 $\psi$ 的，而是关于物理变量取值的。相应地，RQM 所假定的基本本体论只包括物理系统与取值的变量，一如经典力学。例如，一个真实事实是：某粒子在某一时刻 $t$ 具有某个位置值 $x$。这样的事实（“粒子在时刻 $t$ 位于 $x$”）称为“事件”或“量子事件”。量子理论就是关于这类事件的。然而，量子力学中的事实与经典力学中的事实有两点差别。经典力学中有两个一般假定在 RQM 中被放弃：
    step2: |-
      RQM 的出发点是：量子力学并不关乎波函数或量子态 $\psi$，而关乎物理变量的取值。相应地，RQM 预设的基本本体论只含物理系统与取值的变量，与经典力学无异。例如，粒子在时刻 $t$ 位于 $x$，就是一个真实事实。这类事实（“粒子在时刻 $t$ 位于 $x$”）称为“事件”或“量子事件”；量子理论讲的就是这类事件。不过，量子力学中的事实与经典力学中的事实有两点不同。经典力学有两个一般假定，RQM 予以放弃：
  - id: 11
    kind: body
    source: |-
      (a) In classical mechanics it is assumed that all the variables of a system have a value at every time. RQM, on the contrary, assumes that in nature this is in not the case in general (Heisenberg 1925; Kochen & Specker 1967)[^heisenberg-1925][^kochen-1967]. Physical variables have values only at some times, and have no value at the other times. Events, in other words, are discrete. Variables have values when a system acts on another system. More precisely, for a system $S$ to have a variable $A$ taking a value *is* to interact with a second system $S'$; the variable $A$ characterizes the effect of a certain action on $S'$. In RQM, this is what it means for a variable to have a value. That is, for a system to be described by a variable taking a value *is* to affect another system in a certain manner, and nothing else. This is the basic intuition that led Heisenberg to find the key to quantum mechanics in 1925; there are questions that make sense in classical mechanics, but have no significance in nature. For instance, the question “What is the $y$-component of the spin of an electron when its $z$-component is $\frac{1}{2} \hslash$?” is meaningless: neither it admits an operational definition, nor is it needed for a realistic understanding of nature.
    step1: |-
      (a) 经典力学假定，系统的所有变量在每一时刻都有值。RQM 相反，假定自然界一般并非如此（Heisenberg 1925; Kochen & Specker 1967）[^heisenberg-1925][^kochen-1967]。物理变量只在某些时刻有值，在其余时刻没有值。换言之，事件是离散的。变量在有系统作用于另一系统时取值。更确切地说，一个系统 $S$ 的变量 $A$ 取得一个值，*就是*与第二个系统 $S'$ 发生相互作用；变量 $A$ 刻画某一作用对 $S'$ 的影响。在 RQM 中，这就是变量有值的含义。也就是说，一个系统由取值的变量来描述，*就是*以某种方式影响另一系统，别无其他。正是这一基本直觉，促使海森堡在 1925 年找到了量子力学的钥匙：有些问题在经典力学中说得通，在自然界却没有意义。例如，“当电子的自旋 $z$ 分量为 $\frac{1}{2} \hslash$ 时，其自旋的 $y$ 分量是什么？”这个问题无意义：它既没有操作定义，也不是对自然的实在论理解所必需的。
    step2: |-
      (a) 经典力学假定，系统的所有变量在每一时刻都有值。RQM 反其道而行：它假定自然界一般并不如此（Heisenberg 1925; Kochen & Specker 1967）[^heisenberg-1925][^kochen-1967]。物理变量只在某些时刻有值，其余时刻则无值。换句话说，事件是离散的。变量取值，恰在系统作用于另一系统之时。更确切地说：系统 $S$ 的变量 $A$ 取某个值，**就是**与第二个系统 $S'$ 发生相互作用；变量 $A$ 刻画某一作用对 $S'$ 的影响。在 RQM 中，这就是“变量有值”的全部含义。换言之，一个系统可由取值的变量来描述，**就是**以某种方式影响另一系统，别无其他。正是这一基本直觉，让海森堡在 1925 年找到了量子力学的钥匙：有些问题在经典力学中讲得通，在自然界却没有意义。比如，“当电子自旋的 $z$ 分量为 $\frac{1}{2} \hslash$ 时，其 $y$ 分量为何？”便毫无意义：它既无操作定义，也不是对自然的实在论理解所必需。
  - id: 12
    kind: body
    source: |-
      (b) The second assumption of classical mechanics dropped in RQM is that variables take absolute values, namely values independent from any other systems. Instead, RQM assumes that *all* (contingent) physical variables are relational. Contingent variables are those represented by phase space functions in classical theory. Any value that these variables take is (implicitly or explicitly) labelled by a second physical system. If the variable $A$ of a system $S$ takes a value in the interaction with a second systems $S'$, the value it takes is *relative to* $S'$. The actualisation of an event itself is relative to a system. The concrete meaning of this is the assumption above, according to which future ways the system $S$ affects $S'$ depend (probabilistically) on the values that variables of $S$ have taken with respect to $S'$, but *future ways the system $S$ affect a third system $S''$ do not*. The ensemble of all events relative to an arbitrary system $S'$, together with the probabilistic predictions these entail, is called the “perspective” of $S'$.
    step1: |-
      (b) 经典力学被 RQM 放弃的第二个假定是：变量取绝对值，即不依赖于任何其他系统的值。RQM 相反，假定*所有*（偶然的）物理变量都是关系性的。偶然变量就是在经典理论中由相空间函数表示的那些变量。这些变量所取的任何值，都由（隐含或明确地）一个第二个物理系统来标示。若系统 $S$ 的变量 $A$ 在与第二个系统 $S'$ 的相互作用中取得一个值，则它所取的值*相对于* $S'$。事件本身的实现也是相对于某个系统的。这一点的具体含义即上述假设：系统 $S$ 未来以何种方式影响 $S'$，概率地取决于 $S$ 的变量相对于 $S'$ 所取的值，但*系统 $S$ 未来以何种方式影响第三个系统 $S''$，则不取决于此*。相对于任意系统 $S'$ 的全部事件之集，连同它们所蕴涵的概率性预言，称为 $S'$ 的“视角”。
    step2: |-
