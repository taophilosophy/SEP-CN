      *Many Worlds*: Both RQM and the Many Worlds interpretation (see Vaidman 2018)[^vaidman-2018] are rooted in the work of Everett (1957). Both attempt to solve the mystery of quantum theory by adding a level of indexicality. In RQM, variables have values with respect to other physical systems. In Many Worlds, variables have values with respect to branches of the universal wave function. In neither interpretations there is any a priori special role for measurement, or observers. The main difference is the distinct ontological commitment: the Many Worlds interpretation is based on the assumption that all relative states are branches of a unique universal wave function, interpreted as a real entity, which obeys a single deterministic evolution law. The Many Worlds interpretation must work to recover Heisenberg uncertainty (via branch indexicality), probabilities (via subjective interpretation of probability), and discreteness, from this unique, deterministic, continuous universal wave function. RQM has all this easily in its foundation. On the other hand, the Many Worlds interpretation is based on a (according to some, inflated, but) no-nonsense realist metaphysics, which is precluded by the perspectivism of RQM. The two can perhaps made closer by the simple observation that modality can always be transformed into multiple world realism *à la* Lewis (1986), trading actuality for indexicality.
    step1: |-
      *多世界*：RQM 与多世界解释（见 Vaidman 2018）[^vaidman-2018]都植根于埃弗雷特（1957）的工作。二者都试图通过增加一层索引性来解决量子理论之谜。在 RQM 中，变量相对于其他物理系统而有值；在多世界中，变量相对于普遍波函数的分支而有值。两种解释都不给测量或观察者任何先天的特殊角色。主要差别在于本体论承诺不同：多世界解释假定所有相对态都是一个唯一普遍波函数的分支，该波函数被解释为一个真实实体，服从单一的确定性演化律。多世界解释必须费力地从这一唯一的、确定性的、连续的普遍波函数中恢复海森堡不确定性（通过分支索引性）、概率（通过概率的主观解释）与离散性。RQM 则把这些直接置于基础之中。另一方面，多世界解释建立在一种（有人说是膨胀的，但）干脆利落的实在论形而上学之上，而这是 RQM 的视角主义所排除的。也许可用一个简单的观察拉近二者：模态总可以按 Lewis（1986）的方式转化为多世界实在论，以索引性换取现实性。
    step2: |-
      **多世界**：RQM 与多世界解释（见 Vaidman 2018）[^vaidman-2018]皆植根于埃弗雷特（1957）的工作。二者都试图靠增设一层索引性来解开量子理论之谜：在 RQM 中，变量相对于其他物理系统而有值；在多世界中，变量相对于普遍波函数的分支而有值。两种解释都不给测量或观察者任何先天的特殊角色。主要差别在本体论承诺：多世界解释假定，所有相对态都是唯一普遍波函数的分支，而该波函数被当作一个真实实体，服从单一的确定性演化律。于是它必须费力地从这一唯一的、确定性的、连续的普遍波函数中，重新得到海森堡不确定性（借分支索引性）、概率（借概率的主观解释）与离散性；RQM 却把这些直接置于基础之中。反过来，多世界解释建立在一种（有人说膨胀，却）干脆利落的实在论形而上学之上，而这恰为 RQM 的视角主义所不容。若把模态按 Lewis（1986）的方式转换为多世界实在论，以索引性换现实性，二者或许可以靠得更近。
