      An alternative to this radical perspectivalism is to reduce it to relativism (Riedel 2024)[^riedel-2024], namely to assume that values of variables are relative, but the fact that a variable has relative to a system is an absolute fact, which by itself is not relative to anything. Namely to assume that the actualization of each unique quantum event is a fundamental absolute physical event. This tamed version of RQM is often implicitly assumed by commentators, and criticised. Jacques Pienaar (2021) has given a sharp version of these criticisms in the form of five no-go theorems indicating that the balancing act between relative values and absolute actualization of quantum event cannot be sustanied. Related criticisms where raised in (Muciño 2022)[^muciño-2022] and (Lawrence 2023)[^lawrence-2023]. Responses, pointing to the fact that these papers contain implicit assumptions rejected in RQM, were given in (Rovelli 2021b [Other Internet Resources], Di Biagio & Rovelli 2022 and Cavalcanti 2023)[^cavalcanti-2023].
    step1: |-
      这种激进视角主义的一个替代，是把它还原为相对主义（Riedel 2024）[^riedel-2024]，即假定变量的值是相对的，但变量相对于某系统这一事实是绝对事实，它本身不相对于任何东西。也就是假定，每个独一无二的量子事件的实现本身是一个基本的绝对物理事件。这种驯服版的 RQM 常被评论者隐含地假定，并受批评。Jacques Pienaar（2021）以五个不可行定理的形式给出了这些批评的尖锐版本，指出相对取值与量子事件绝对实现之间的平衡无法维持。相关批评也见于（Muciño 2022）[^muciño-2022]与（Lawrence 2023）[^lawrence-2023]。回应指出这些论文包含 RQM 所拒绝的隐含假定，见（Rovelli 2021b [Other Internet Resources], Di Biagio & Rovelli 2022 与 Cavalcanti 2023）[^cavalcanti-2023]。
