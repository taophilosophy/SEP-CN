      RQM 中没有任何东西与世界“在那里”、独立于我们的心理状态或感知这一假定相矛盾。在这个弱意义上，RQM 与实在论相容。但 RQM 质疑这一假定：世界的每个子系统的每个变量在每一时刻都有一个单一的值。在这个更强的意义上，实在论被 RQM 质疑。RQM 的本体论是关系性量子事件的稀疏本体论，不是从任何唯一的“底层”表示导出的。这种实在论的削弱与伽利略相对性或爱因斯坦相对性所造成的情形方向相似：二者表明，单个物体的速度、或两个类空分离事件的同时性，单独来看没有事实可言。
