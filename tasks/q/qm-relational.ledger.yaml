      Laura Candiotto (2017) argues that the best philosophical framework for RQM is Ontic Structural Realism (OSR) (Ladyman& Ross 2007; French & Ladyman 2011)[^french-2011][^ladyman-2007]. Ontic structural realism is meant to be a defensible form of scientific realism (Ladyman 2019)[^ladyman-2019]; it argues for the priority of relations over substances, as self-subsistent individual objects (Morganti 2011)[^morganti-2011]. For Candiotto, RQM is a realistic theory that assumes the notion of relation (the physical interaction between systems and instruments) as primitive; objects emerge as relational “nodes” (French 2006)[^french-2006], or intersections of processes. The lack of observer-independence is not inability of providing an account of the structure of matter, because there are no intrinsic properties that can be assigned to systems independently of their interactions, therefore this structure is itself relational, hence in particular observer dependent. Relations via dynamical processes of information exchange can be taken as the building blocks of the universe.
    step1: |-
      Laura Candiotto（2017）主张，RQM 的最佳哲学框架是存在结构实在论（OSR）（Ladyman& Ross 2007; French & Ladyman 2011）[^french-2011][^ladyman-2007]。存在结构实在论旨在成为科学实在论的一种可辩护形态（Ladyman 2019）[^ladyman-2019]；它主张关系优先于实体，而非自足的个别对象（Morganti 2011）[^morganti-2011]。对 Candiotto 来说，RQM 是一个实在论理论，把关系（系统与仪器之间的物理相互作用）当作初始概念；对象作为关系性“节点”（French 2006）[^french-2006]、或诸过程的交叉点而涌现。缺乏观察者独立性，并不是无力给出物质结构的说明，因为不存在可以独立于相互作用而被赋予系统的内在性质；因此这个结构本身是关系性的，从而尤其依赖观察者。经由信息交换的动力学过程的关系，可以被当作宇宙的构件。
