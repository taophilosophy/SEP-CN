      The Frauchiger-Renner thought-experiment (Frauchiger & Renner 2018)[^frauchiger-2018] can be read as an indirect support to RQM, since it makes concrete the idea that “different observers can give different accounts of the same set of events”, as in the original RQM slogan. The experiment is discussed in the conceptual framework of RQM by Waaijer and van Neerven (2019 [Other Internet Resources]). But if course it can be accounted by all interpretations.
    step1: |-
      Frauchiger-Renner 思想实验（Frauchiger & Renner 2018）[^frauchiger-2018]可读作对 RQM 的间接支持，因为它把“不同的观察者可以对同一组事件给出不同的描述”这一 RQM 原初口号具体化了。Waaijer 与 van Neerven（2019 [Other Internet Resources]）在 RQM 的概念框架中讨论了该实验。当然，它也可以由所有解释来说明。
    step2: |-
