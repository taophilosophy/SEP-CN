      *Zeilinger-Bruckner*: The Relational Interpretation is close to the view of quantum theory held developed by Zeilinger and Bruckner; in particular, similar postulates to the original ones of RQM were independently proposed in (Zeilinger 1999, Brukner & Zeilinger 2003)[^brukner-2003][^zeilinger-1999]. These ideas generated some of the interesting mathematical work aiming at making the derivation of the formalism of quantum theory from information theoretical postulates precise. For versions of this program related to RQM see (Grinbaum 2005; Höhn 2017; Höhn & Wever 2017)[^grinbaum-2005][^höhn-2017][^höhn-2017-2].
    step1: |-
      *Zeilinger-Bruckner*：关系性解释接近 Zeilinger 与 Bruckner 所发展的量子理论观点；特别是，（Zeilinger 1999, Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]独立提出了与 RQM 原初公设类似的公设。这些想法催生了一些有趣的数学工作，旨在精确地从信息论公设导出量子理论的形式体系。与 RQM 相关的该纲领版本，见（Grinbaum 2005; Höhn 2017; Höhn & Wever 2017）[^grinbaum-2005][^höhn-2017][^höhn-2017-2]。
    step2: |-
      Zeilinger-Bruckner：关系性解释与 Zeilinger、Bruckner 所发展的量子理论观点相近：（Zeilinger 1999, Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]独立提出了与 RQM 原初公设类似的公设。这些想法催生了一批有趣的数学工作，意在精确地从信息论公设导出量子理论的形式体系。该纲领中与 RQM 相关的版本，见（Grinbaum 2005; Höhn 2017; Höhn & Wever 2017）[^grinbaum-2005][^höhn-2017][^höhn-2017-2]。
  - id: 52
