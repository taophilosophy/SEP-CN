      In RQM, the quantum state is a mathematical device that refers to two systems, not a single one. It codes the values of the variables of the first that have been actualised in interacting with the second (Groenewold 1957)[^groenewold-1957]; it therefore codes in particular anything we can predict regarding the future values of these variables, relative to the second system. The state $\psi$ , in other words, can be interpreted as a compendium of information accessible to a second system, determined by a specific history of interactions. Understood in this manner the quantum state is always and only a *relative state* in the sense of Everett (1957). In this sense RQM is strongly “Everettian”. It is so in a different sense than the Many Worlds interpretations, which includes a hypothetical universal wave function of which the various relative states $\psi$ are branches. The universal wave function plays no role in RQM (nor in any physical application of quantum theory.).
    step1: |-
      在 RQM 中，量子态是一个指涉两个系统而非一个系统的数学装置。它编码第一个系统的变量在与第二个系统相互作用中已被实现的值（Groenewold 1957）[^groenewold-1957]；因此，它尤其编码了我们能就这些变量相对于第二个系统的未来取值所预言的一切。换言之，态 $\psi$ 可以解释为第二个系统可及的一份信息汇编，由一段特定的相互作用历史所决定。如此理解，量子态始终且仅仅是一种*相对态*，即埃弗雷特（1957）意义上的相对态。在此意义上，RQM 是强烈的“埃弗雷特式”的。但其方式不同于多世界解释：后者包含一个假定的普遍波函数，各种相对态 $\psi$ 是它的分支。普遍波函数在 RQM 中不起任何作用（在量子理论的任何物理应用中也一样）。
    step2: |-
      在 RQM 中，量子态是一个指涉两个系统（而非一个系统）的数学装置。它编码第一个系统的变量在与第二个系统相互作用中已然实现的值（Groenewold 1957）[^groenewold-1957]；因此也编码了关于这些变量相对于第二个系统的未来取值，我们所可能预言的一切。换言之，态 $\psi$ 可视为一份可供第二个系统获取的信息汇编，由一段特定的相互作用史所决定。如此理解，量子态始终且仅是**相对态**，即埃弗雷特（1957）意义上的相对态。就此而言，RQM 是强烈的“埃弗雷特式”理论；但它与多世界解释不同：后者假定一个普遍波函数，各种相对态 $\psi$ 只是它的分支，而这一普遍波函数在 RQM 中毫无作用（在量子理论的任何物理应用中也一样）。
