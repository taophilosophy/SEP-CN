      The early presentations of RQM were formulated in the language of information theory. They were at the roots of the later development of the use of information theory to make sense of quantum theory (Calosi and Riedel 2024)[^calosi-2024][^riedel-2024]. The quantum state is a way of coding the information that an observing system $S'$ may have about a quantum system $S$, relevant for predicting future ways $S$ can affect $S'$. This information is determined by the ways $S$ has affected $S'$ in the past. Furthermore, the hope was presented in (Rovelli 1996)[^rovelli-1996] that a full reconstruction of the quantum formalism on the basis of simple informational postulates was possible. Two main postulates were proposed:
    step1: |-
      RQM 的早期表述是用信息论语言写成的。它们为此后以信息论阐明量子理论的努力埋下了根（Calosi and Riedel 2024）[^calosi-2024][^riedel-2024]。量子态是编码观察系统 $S'$ 关于量子系统 $S$ 可能拥有的信息的一种方式，这些信息关乎预言 $S$ 未来影响 $S'$ 的方式。这一信息由 $S$ 过去影响 $S'$ 的方式所决定。此外，（Rovelli 1996）[^rovelli-1996]提出了这样的希望：可以凭简单的信息公设完整地重构量子形式体系。当时提出了两条主要公设：
    step2: |-
      RQM 的早期表述以信息论语言写成，后来的“用信息论阐明量子理论”之风正发源于此（Calosi and Riedel 2024）[^calosi-2024][^riedel-2024]。量子态是一种编码方式：它把观察系统 $S'$ 可能拥有的、关于量子系统 $S$ 的信息编码起来，而这些信息关乎预言 $S$ 未来如何影响 $S'$。此类信息由 $S$ 过去影响 $S'$ 的方式决定。此外，（Rovelli 1996）[^rovelli-1996]还提出一个希望：凭几条简单的信息公设，即可完整重构量子形式体系。当时提出两条主要公设：
