      In classical mechanics we can dispense of the Hamilton-Jacobi functional. This testifies for its lack of direct ontological weight. We can equally dispense with $\psi$ in quantum theory. Evidence of this is that the full early development of the quantum mechanical formalisms (Heisenberg 1925; Born & Jordan 1925; Dirac 1925; Born, Heisenberg, & Jordan 1926)[^born-1925][^dirac-1925][^heisenberg-1925] predates the work where $\psi$ was introduced (Schrödinger 1926)[^schrödinger-1926]. Quantum mechanics can be formulated without reference to the quantum state, as a theory of probabilities for sequences of events. The state $\psi$ is a convenient tool, not a necessary one.
