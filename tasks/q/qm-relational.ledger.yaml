      The two postulates are not in contradiction with each other because when new information is gathered some previously relevant information becomes irrelevant. “Relevant” here means that it affects future probabilities. A moment of reflection shows that first postulate implies the characteristic discreteness of quantum theory, while the second is implied by Heisenberg’s uncertainties. Similar ideas were independently considered by Zeilinger and Bruckner (Zeilinger 1999; Brukner & Zeilinger 2003)[^brukner-2003][^zeilinger-1999].
    step1: |-
      这两条公设并不互相矛盾，因为当新信息被收集时，某些先前相关的信息就变得不相关了。这里的“相关”是指它影响未来的概率。稍加思索即可看出：第一条公设蕴涵量子理论特有的离散性，而第二条则由海森堡不确定性所蕴涵。类似的想法曾由 Zeilinger 与 Bruckner 独立提出（Zeilinger 1999; Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]。
    step2: |-
      两条公设并不冲突：收集到新信息时，某些原先相关的信息便不再相关。此处“相关”意为影响未来的概率。稍一思量便知，第一条公设蕴涵量子理论特有的离散性，第二条则由海森堡不确定性原理蕴涵。类似想法曾由 Zeilinger 与 Bruckner 独立提出（Zeilinger 1999; Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]。
