      However, this is a radical step in this direction. In Laudisa (2019) it is pointed out that RQM gives no deeper account, or underlying dynamical representation, of the main process: the actualisation of quantum events at interactions. This is the process which in textbook quantum theory is called measurement and is accompanied by state reduction. Quantum mechanics gives probabilities for quantum events to happen, not a story representing how they happen. This core aspect of quantum theory is not resolved in RQM: it is taken as a fact of the world. What RQM does resolve is the question of when this happens: any time one system affects another one, it happens relative to this other system. What RQM does, is to show that this is not in contradiction with the existence of interference effects. But the core discreteness of the quantum event actualisation is not “explained” in RQM: it is understood as the picture of how nature works according to quantum theory. This can be understood to be in spirit of Newton’s famous observation “whatever is not deduced from the phenomena must be called a hypothesis; and hypotheses, whether metaphysical or physical, or based on occult qualities, or mechanical, have no place in experimental philosophy. In this philosophy particular propositions are inferred from the phenomena, and afterwards rendered general by induction” (Newton 1713)[^newton-1713].
    step1: |-
      然而，朝这个方向迈的是激进的一步。Laudisa（2019）指出，RQM 没有给出更深层的说明，或底层动力学表示，来说明主要过程：量子事件在相互作用中的实现。这就是教科书量子理论称为测量、并伴随态约化的过程。量子力学给出量子事件发生的概率，而非一个关于它们如何发生的叙述。量子理论的这一核心方面在 RQM 中未被解决：它被当作世界的一个事实。RQM 所解决的，是这个问题何时发生：每当一个系统影响另一个系统，它相对于这另一个系统发生。RQM 所做的，是表明这与干涉效应的存在并不矛盾。但量子事件实现的根本离散性在 RQM 中并未被“解释”：它被理解为量子理论所刻画的自然运作的图景。这可以理解为在精神上接近牛顿的著名观察：“凡不是从现象推得的，都必须称为假说；而假说，无论是形而上学的还是物理学的，无论基于隐秘性质还是力学性质，在实验哲学中都没有位置。在这门哲学中，特殊的命题从现象推得，然后经由归纳而推广”（Newton 1713）[^newton-1713]。
