      Emily Adlam (2022) has argued that interpretations of quantum mechanics that deny observer-independence challenge our presumption of intersubjectivity regarding measurement outcomes and this can undemine the possibility of the scentific project itself, which is based on the possibility of such agreement. She argues that such observers are unable to escape their own perspective in order to learn anything about the perspectives of other observers and therefore be unable to confirm the theory. The challenge has motivated her and Rovelli to add to RQM a specific postulate about the relation between perspectives (Adlam & Rovelli 2023)[^adlam-2023]. They consider a ‘Cross-Perspective Link’ postulate, which states that the measurement of a system’s pointer accurately reveals the outcome said system has registered in an earlier interaction (unless the pointer has been tampered with). This axiom stipulates the possibility of communication across viewpoints.
    step1: |-
      Emily Adlam（2022）论证：否认观察者独立性的量子力学解释挑战我们关于测量结果的主体间性的成见，这可能削弱科学事业本身的可能性，而科学事业正是以这种一致的可能性为基础的。她论证说，这类观察者无法逃出自己的视角去了解其他观察者的视角，因而无法确证理论。这一挑战促使她与 Rovelli 在 RQM 中增设一条关于视角之间关系的特定公设（Adlam & Rovelli 2023）[^adlam-2023]。他们考虑一条“跨视角链接”公设：对一个系统的指针的测量准确地揭示该系统在较早相互作用中记录的结果（除非指针被篡改）。这条公理规定了跨视角交流的可能性。
    step2: |-
      Emily Adlam（2022）论证：否认观察者独立性的量子力学解释，会挑战我们关于测量结果主体间性的预设，而这可能动摇科学事业本身的可能性——科学事业正以这种一致的可能为基础。她说，这类观察者无法跳出自己的视角去了解他人的视角，因而无法确证理论。这一挑战促使她与 Rovelli 为 RQM 增设一条关于视角间关系的特定公设（Adlam & Rovelli 2023）[^adlam-2023]。他们提出一条“跨视角链接”公设：对一个系统的指针的测量，会准确揭示该系统在较早相互作用中记录的结果（除非指针被篡改）。这条公理规定了跨视角交流的可能。
