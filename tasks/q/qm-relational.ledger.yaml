      The other side of the coin of each “price to pay” is the lesson we might gather from the empirical success of quantum theory: for the Many Worlds interpretation, for instance, the lesson is the real existence of other branches, for Bohm theory is the real existence of unobservable variables that pick a preferred reference frame, and so on. For RQM, the lesson of quantum theory is that the description of the way distinct physical systems affect each other when they interact (and not the way physical systems ‘are’) exhausts all that can be said about the physical world. The physical world must be described as a net of interacting components, where there is no meaning to ‘the state of an isolated system’, or the value of the variables of an isolated system. The state of a physical system is the net of the relations it entertains with the surrounding systems. The physical structure of the world is identified as this net of relationships. The notion of substance that plays a major role in western philosophy might be inappropriate to account for this science; perhaps the idea of a “mutual dependency” (Nāgārjuna 1995)[^nāgārjuna-1995] may offer a relevant philosophical cadre (Rovelli 2021)[^rovelli-2021].
    step1: |-
      每个“代价”的另一面，是我们或许可以从量子理论的经验成功中学到的教训：对多世界解释，教训是其他分支的真实存在；对玻姆理论，是选取特定参照系的不可观测变量的真实存在；如此等等。对 RQM，量子理论的教训是：关于不同物理系统相互作用时彼此如何影响（而非物理系统“是”什么）的描述，穷尽了关于物理世界所能说的一切。物理世界必须被描述为一张相互作用组件的网，其中“孤立系统的态”或孤立系统的变量的取值没有意义。物理系统的态，是它与周围系统所保持的关系之网。世界的物理结构就被确认为这张关系之网。在西方哲学中扮演主要角色的实体概念，或许不适合说明这门科学；也许“相互依存”（Nāgārjuna 1995）[^nāgārjuna-1995]的观念可以提供一个相关的哲学框架（Rovelli 2021）[^rovelli-2021]。
