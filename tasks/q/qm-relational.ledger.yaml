      The application of RQM to the EPR context and the problem of quantum non locality has been initially discussed in Smerlak and Rovelli (2007) and (Laudisa 2001)[^laudisa-2001]. Some of the claims of the earlier discussion about RQM being “local” have been questioned, pointing out that RQM should in any case be “forced to accept *some* form of non-locality in quantum phenomena” (Laudisa 2019: 227)[^laudisa-2019]. See also Pienaar’s criticisms (2019) and the discussion in Martin-Dussaud, Rovelli, and Zalamea (2019) and (Martin-Dussaud 2021)[^martin-dussaud-2021], where a specific sense in which quantum theory is non-local from the RQM perspective is clarified.
    step1: |-
      RQM 在 EPR 情境与量子非定域性问题上的应用，最初在 Smerlak 与 Rovelli（2007）以及（Laudisa 2001）[^laudisa-2001]中讨论。早期讨论中关于 RQM“定域”的某些说法已受到质疑，有人指出 RQM 无论如何都应“被迫接受量子现象中*某种*形式的非定域性”（Laudisa 2019: 227）[^laudisa-2019]。另见 Pienaar 的批评（2019），以及 Martin-Dussaud、Rovelli 与 Zalamea（2019）和（Martin-Dussaud 2021）[^martin-dussaud-2021]中的讨论，其中澄清了从 RQM 视角看量子理论非定域的一个具体意义。
