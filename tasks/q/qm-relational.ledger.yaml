      The price to pay for this parsimony is a weakening of the conventional (“strong”) realism of classical mechanics where physical variables are assumed to have values which are non-relational and exist at every time. The fact that variables take value only at interactions gives a sort of sparse event (or “flash”) ontology; the fact that they are labeled by the system to which they refer, adds a level of indexicality to the representation of the world, and raises philosophical issues.
    step1: |-
      这种简约的代价，是削弱经典力学那套惯常的（“强”）实在论：按那套实在论，物理变量被假定具有非关系的值，并且在每一时刻都存在。变量只在相互作用中取值，这给出一种稀疏事件（或“闪光”）本体论；而变量又由其指涉的系统来标示，这为世界的表示添了一层索引性，并引出哲学问题。
    step2: |-
      这份简约的代价，是削弱经典力学所持的惯常“强”实在论——它假定物理变量具有非关系的值，且在每一时刻都存在。变量只在相互作用中取值，于是有了稀疏的事件本体论（或“闪光”本体论）；变量又以其所指涉的系统作标示，这给世界的表示添了一层索引性，也引出哲学难题。
  - id: 7
    kind: body
    source: |-
      By itself RQM is metaphysically neutral, but it has a strong relational stance that questions strong realism (Laudisa 2019)[^laudisa-2019], in a sense discussed below. Because of this tinkering with realism, RQM has been framed, in turn, in the context of various philosophical perspectives, including constructive empiricism (van Fraassen 2009)[^fraassen-2009], neo-Kantism (Bitbol 2007 [Other Internet Resources], Bitbol 2010)[^bitbol-2010], anti-monism (Dorato 2016)[^dorato-2016], structural realism (Candiotto 2017)[^candiotto-2017], Perspectival realism (Massimi 2022)[^massimi-2022], metaphysical coherentism (Dorato and Morganti 2022)[^dorato-2022] and anti-foundationalist coherentism. (See also Brown 2009, Wood 2010 [Other Internet Resources], and especially the extended discussion in Calosi and Riedel 2024.)[^brown-2009][^calosi-2024][^riedel-2024] The interpretation has many aspects in common with Dennis Dieks’ Perspectival Quantum Realism (Dieks 2022, Bene and Dieks 2002)[^bene-2002][^dieks-2022], with QBism (Fuchs 2001, 2002 [Other Internet Resources])[^fuchs-2001], with Healey’s pragmatist approach (Healey 1989, 2023)[^healey-1989] and with the view of quantum theory discussed by Zeilinger and Bruckner (Zeilinger 1999, Brukner & Zeilinger 2003)[^brukner-2003][^zeilinger-1999].
    step1: |-
      就自身而言，RQM 在形而上学上是中立的，但它有一种强烈的关系主义立场，质疑强实在论（Laudisa 2019）[^laudisa-2019]，其意义见下文。由于这番对实在论的摆弄，RQM 先后被放入多种哲学视角的语境中，包括建构经验论（van Fraassen 2009）[^fraassen-2009]、新康德主义（Bitbol 2007 [Other Internet Resources], Bitbol 2010）[^bitbol-2010]、反一元论（Dorato 2016）[^dorato-2016]、结构实在论（Candiotto 2017）[^candiotto-2017]、视角实在论（Massimi 2022）[^massimi-2022]、形而上学融贯论（Dorato and Morganti 2022）[^dorato-2022]，以及反基础主义的融贯论。（另见 Brown 2009、Wood 2010 [Other Internet Resources]，尤其是 Calosi and Riedel 2024 中的详尽讨论。）[^brown-2009][^calosi-2024][^riedel-2024] 这一解释与 Dennis Dieks 的视角量子实在论（Dieks 2022, Bene and Dieks 2002）[^bene-2002][^dieks-2022]、与 QBism（Fuchs 2001, 2002 [Other Internet Resources]）[^fuchs-2001]、与 Healey 的实用主义进路（Healey 1989, 2023）[^healey-1989]，以及与 Zeilinger 和 Bruckner 所讨论的量子理论观点（Zeilinger 1999, Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]，有许多相通之处。
    step2: |-
      就其自身而言，RQM 在形而上学上是中立的；但它持一种强烈的关系主义立场，因而质疑强实在论（Laudisa 2019）[^laudisa-2019]，其含义见下文。正因这番对实在论的改造，RQM 先后被安放在多种哲学视角之中：建构经验论（van Fraassen 2009）[^fraassen-2009]、新康德主义（Bitbol 2007 [Other Internet Resources], Bitbol 2010）[^bitbol-2010]、反一元论（Dorato 2016）[^dorato-2016]、结构实在论（Candiotto 2017）[^candiotto-2017]、视角实在论（Massimi 2022）[^massimi-2022]、形而上学融贯论（Dorato and Morganti 2022）[^dorato-2022]，以及反基础主义的融贯论。（另见 Brown 2009、Wood 2010 [Other Internet Resources]，尤以 Calosi and Riedel 2024 的讨论最为详尽。）[^brown-2009][^calosi-2024][^riedel-2024] 它与 Dennis Dieks 的视角量子实在论（Dieks 2022, Bene and Dieks 2002）[^bene-2002][^dieks-2022]、与 QBism（Fuchs 2001, 2002 [Other Internet Resources]）[^fuchs-2001]、与 Healey 的实用主义进路（Healey 1989, 2023）[^healey-1989]，以及与 Zeilinger、Bruckner 所主张的量子理论观点（Zeilinger 1999, Brukner & Zeilinger 2003）[^brukner-2003][^zeilinger-1999]，多有相通。
