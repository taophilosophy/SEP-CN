      The second characteristic aspect of RQM pointed out by Dorato is that, consequently, the best way to capture the nature of not-yet interacting quantum systems is to call into play a form of dispositionalism: the only way to attribute some sort of intrinsicness to the state-dependent properties of quantum systems is to attribute them dispositions to manifest in a certain way according to the interactions they are subject to. Dispositionalism is present in many other views of quantum mechanics (Dorato 2006)[^dorato-2006] but fits particularly well in the context of RQM. Unlike Qbists interpretations of quantum theory, which are agents-centered, in RQM the relation “$S$ manifest $q$ relative to $S'$” is symmetric, and this is a simple consequence of the hypothesis that in RQM quantum systems and “observers” are on the same level. As a consequence of its relational and dispositional aspect, Dorato stresses the fact that in RQM there cannot be a universal flow of becoming, but only a local, worldline-dependent and relational one. This still counts as a relational form of becoming: no universal tide of coming into being, but a crisscross of ripples. Since a physical system can exemplify a given succession of events only relatively to another system and not absolutely, in RQM there cannot be cosmic time, so that also in general relativity temporal succession of events cannot be regarded as a total order. In a sense, in RQM there is no quantum state of the universe, or a God’s eye point of view, since the cosmos can only be described “from within a given perspective”.
    step1: |-
      Dorato 指出的 RQM 的第二个特征方面是：既然如此，把握尚未相互作用的量子系统之本性的最佳方式，是诉诸某种倾向主义：赋予量子系统的依赖态的性质以内在性的唯一途径，是赋予它们依所受相互作用而以某种方式显现的倾向。倾向主义见于许多其他量子力学观点（Dorato 2006）[^dorato-2006]，但在 RQM 语境中尤为契合。与以能动者为中心的 QBism 式解释不同，在 RQM 中，“$S$ 相对于 $S'$ 显现 $q$”这一关系是对称的；这是 RQM 中量子系统与“观察者”处于同一层面这一假设的简单后果。由于其关系性与倾向性特征，Dorato 强调：在 RQM 中不可能有普遍的生成之流，只有局域的、依赖世界线的关系性的生成。这仍然算一种关系性的生成：没有普遍的涌现之潮，只有纵横交错的涟漪。由于物理系统只有相对于另一系统才能例示给定的事件序列，而非绝对如此，在 RQM 中不可能有宇宙时间，于是与广义相对论一样，事件的时间先后不能被视为一个全序。在某种意义上，RQM 中没有宇宙的量子态，也没有上帝之眼视角，因为宇宙只能“从某个给定的视角之内”来描述。
    step2: |-
      Dorato 指出 RQM 的第二个特征：既然如此，把握尚未相互作用的量子系统之本性，最好的办法是诉诸倾向主义——赋予量子系统依赖态的性质以内在性的唯一途径，是赋予它们依所受相互作用而以某种方式显现的倾向。倾向主义见于许多其他量子力学观点（Dorato 2006）[^dorato-2006]，在 RQM 语境中却尤为契合。与以能动者为中心的 QBism 式解释不同，RQM 中“$S$ 相对于 $S'$ 显现 $q$”的关系是对称的；这是“量子系统与‘观察者’处于同一层面”这一假设的简单推论。由于其关系性与倾向性，Dorato 强调：RQM 中不可能有普遍的生成之流，只有局域的、依赖世界线的关系性生成。这仍是一种关系性的生成：没有普遍的涌现之潮，只有纵横交错的涟漪。既然物理系统只有相对于另一系统、而非绝对地，才能例示给定的事件序列，RQM 中便不可能有宇宙时间；于是与广义相对论一样，事件的时间先后也不被视作全序。某种意义上，RQM 中没有宇宙的量子态，也没有上帝之眼的视角——宇宙只能“从某个给定的视角之内”来描述。
