      In textbook presentations, quantum mechanics is about measurement outcomes obtained when an “observer” makes a “measurement” on a quantum system. Such measurements are not generic interactions between two systems. They are special kinds of interactions. They require that information is registered and stored. For this to happen, there must be decoherence and dissipation, hence a classical domain. RQM extends the interpretation of the theory to the regimes where decoherence and dissipation are not sufficient to underpin the “observer-measurement” interpretation. When decoherence is sufficient, the values of variables becomes “stable” (Di Biagio and Rovelli 2021)[^rovelli-2021]: their label become irrelevant and measurments have determined outcomes within that decoherence domain.
    step1: |-
      在教科书的表述中，量子力学讲的是“观察者”对量子系统作“测量”所得的测量结果。这类测量不是两个系统之间的一般相互作用，而是特殊的一类相互作用：它们要求信息被登记并储存。为此，必须有退相干与耗散，因而必须有一个经典域。RQM 把理论的解释推广到这样的范围：在其中，退相干与耗散不足以支撑“观察者-测量”的解释。当退相干足够时，变量的取值变得“稳定”（Di Biagio and Rovelli 2021）[^rovelli-2021]：它们的标示变得无关紧要，而测量在该退相干域内具有确定的结果。
    step2: |-
      按教科书的讲法，量子力学讲的是“观察者”对量子系统作“测量”所得的测量结果。这类测量不是两个系统间的一般相互作用，而是特殊的一类：它们要求信息被登记、储存。要做到这一点，必须有退相干与耗散，因之必须有一个经典域。RQM 把理论的解释推广到退相干与耗散不足以支撑“观察者-测量”解释的范围。退相干足够时，变量取值变得“稳定”（Di Biagio and Rovelli 2021）[^rovelli-2021]：其标示不再相干，测量在该退相干域内也有所确定的结果。
