      The strong interpretation assumes that it is possible to take the ensemble of all perspectives realistically by “regard[ing] the pointlike quantum events or ‘flashes’ as absolute, observer-independent facts about reality” [Adlam & Rovelli 2023, Adlam 2024][^adlam-2024][^adlam-2023], even if this ensemble is not acessible in principle to anybody. Whether this option is a viable in RQM is an open question. It is challenged for instance by Riedel (2024) “unrestricted iteration principle”, and by specific no-go theorems (Pienaar 2021)[^pienaar-2021]. Blake Stacey (2022 [Other Internet Resources]) has argued that the strong interpretation is step backs away from the perspectivalism that characterizes the interpretation: it is “a disguised form of the projection postulate leading to a ‘global collapse’ of the state of the interacting pair” (Lahti and Pelonpää 2023)[^lahti-2023].
    step1: |-
      强解释假定，可以实在论地对待所有视角之全体的方式，即“把点状量子事件或‘闪光’当作绝对的、观察者独立的关于实在的事实”［Adlam & Rovelli 2023, Adlam 2024］[^adlam-2024][^adlam-2023]，即使这个全体在原则上不对任何人可及。这一选项在 RQM 中是否可行，是一个开放问题。它受到 Riedel（2024）“不受限制的迭代原则”的挑战，也受到特定的不可行定理（Pienaar 2021）[^pienaar-2021]的挑战。Blake Stacey（2022 [Other Internet Resources]）论证，强解释是从刻画该解释的视角主义向后退了一步：它是“投影公设的一种伪装形式，导致相互作用对的态的‘全局坍缩’”（Lahti and Pelonpää 2023）[^lahti-2023]。
