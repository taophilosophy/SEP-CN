      Steven French (2024) discusses the relation between RQM and the “continental philosophy” account of quantum measurment given by Fritz London and Edmund Bauer in 1939. Andrea Oldofredi (2021) has argued that RQM is easily compatible with scientific realism, in the context of an ontology of properties (Oldofredi 2021)[^oldofredi-2021]. He has also discussed how precisely RQM solves the measurment problem in (Oldofredi 2022)[^oldofredi-2022]. Juan Sebastian Ardenghi and Olimpia Lombardi (2022) have discussed the relation between RQM and the Modal‑Hamiltonian Interpretation, arguing that the two interpretation complement each other. In (Martin-Dussaud, 2023) a mathematical formalisation of the notion of relative facts is proposed.
