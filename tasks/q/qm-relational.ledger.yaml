    source: |-
      *QBism*: The emphasis on information in Rovelli (1996) influenced the birth of QBism (see Fuchs 1998: 3, 2001, 2002 [Other Internet Resources])[^fuchs-1998]. There are similarities between RQM and QBism (Pienaar 2021b)[^pienaar-2021b]. One similarity is the emphasis on dropping questions considered meaningless. The second is the use of the language of information theory (Spekkens 2014)[^spekkens-2014]. The difference is mostly in the way the subject holding information is treated. In QBism the ideas of *agent* and *experience* are fundamental (DeBrota 2018 [Other Internet Resources]), while these ideas play no role in RQM. In RQM, the subject is fully naturalised: it is itself considered a physical system that can be described by quantum theory. This leads to a stronger version of realism that QBism, and to the emphasis on the relational aspect of all variables. In QBism the emphasis is in the information about the world held by a single subject, taken as primary. In RQM, the information is relative information (in the sense of Shannon) that a physical system has about another system; it is not primary (see Dorato 2017)[^dorato-2017]: it is can be simply understood physically as a correlation between the two systems that can be observed by a third system. Steven French (2024, 2024b) has framed the relation between QBism and RQM in terms of the two versions of perspetivalism (‘perspectival₁’ and ‘perspectival₂’) considered by Michela Massimi’s Perspectival realism (Massimi 2022)[^massimi-2022].
    step1: |-
      *QBism*：Rovelli（1996）对信息的强调影响了 QBism 的诞生（见 Fuchs 1998: 3, 2001, 2002 [Other Internet Resources]）[^fuchs-1998]。RQM 与 QBism 有相似之处（Pienaar 2021b）[^pienaar-2021b]。一个相似之处是强调放弃被认为无意义的问题。第二个是使用信息论的语言（Spekkens 2014）[^spekkens-2014]。差别主要在于持有信息的主体如何被对待。在 QBism 中，*能动者*与*经验*的观念是基本的（DeBrota 2018 [Other Internet Resources]），而这些观念在 RQM 中不起作用。在 RQM 中，主体被完全自然化：主体本身被视为一个可由量子理论描述的物理系统。这导向一种比 QBism 更强的实在论版本，也导向对所有变量的关系性方面的强调。在 QBism 中，重点在于单一主体所持有的关于世界的信息，并将其视为初始的。在 RQM 中，信息是一个物理系统关于另一系统所拥有的相对信息（香农意义）；它不是初始的（见 Dorato 2017）[^dorato-2017]：它可以被简单地在物理上理解为两系统之间的一种关联，可由第三个系统观察到。Steven French（2024, 2024b）以 Michela Massimi 的视角实在论（Massimi 2022）[^massimi-2022]所考虑的两个视角主义版本（“perspectival₁”与“perspectival₂”）为框架，梳理了 QBism 与 RQM 的关系。
    step2: |-
      QBism：Rovelli（1996）对信息的强调，影响了 QBism 的诞生（见 Fuchs 1998: 3, 2001, 2002 [Other Internet Resources]）[^fuchs-1998]。RQM 与 QBism 颇有相似（Pienaar 2021b）[^pienaar-2021b]：其一，都强调放弃被认为无意义的问题；其二，都使用信息论语言（Spekkens 2014）[^spekkens-2014]。差别主要在如何对待持有信息的主体。QBism 以 **能动者** 与 **经验** 为基本观念（DeBrota 2018 [Other Internet Resources]），二者在 RQM 中却不起作用：RQM 把主体彻底自然化，主体本身就是一个可由量子理论描述的物理系统。这导向一种强于 QBism 的实在论，也导向对所有变量关系性一面的强调。QBism 的重点，是单一主体所持有的关于世界的信息，并以此为本原；RQM 的信息则是一物理系统关于另一系统所拥有的相对信息（香农意义），并非本原（见 Dorato 2017）[^dorato-2017]：它可以被简单地物理理解为两系统间的关联，且可由第三个系统观察到。Steven French（2024, 2024b）借 Michela Massimi 视角实在论（Massimi 2022）[^massimi-2022]所论的两种视角主义（“perspectival₁”“perspectival₂”），梳理了 QBism 与 RQM 的关系。
