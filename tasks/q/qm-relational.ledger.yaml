      *Richard Healey*: Healey’s pragmatist approach (Healey 1989)[^healey-1989] has in common with RQM the idea that the quantum state is not a description of physical reality, not even incompletely. Its main function is to be a (dispensable) tool for computing probabilities. The main difference is the emphasis on what quantum states are relative to. For Healey’s pragmatist view, a quantum state ascription is relative *only* to the perspective of an actual or potential agent (Healey 2012)[^healey-2012]. In RQM, values are relative to any physical system. Restricting quantum theory to its use by agents is not a concern for Healey’s pragmatist philosophy; it is more so in a naturalistic perspective searching for an understanding of Nature that remains significative also where no agents are around. This is the same difference as between RQM and QBism, but Healey’s position is closer to RQM than QBism because while the QBism’s quantum state ascriptions depend on the epistemic state of the agent, for Healey the quantum state ascribed to a system depends only on the physical circumstances defining the perspective of the agent.
    step1: |-
      *Richard Healey*：Healey 的实用主义进路（Healey 1989）[^healey-1989]与 RQM 的共同之处是：量子态不是对物理实在的描述，甚至不是不完备的描述。其主要功能是作为计算概率的（可弃置的）工具。主要差别在于强调量子态相对于什么。对 Healey 的实用主义观点来说，量子态归属*仅*相对于一个现实或潜在能动者的视角（Healey 2012）[^healey-2012]。在 RQM 中，值相对于任何物理系统。把量子理论限制在能动者的使用上，这对 Healey 的实用主义哲学并不构成关切；但在自然主义视角下则更为要紧——后者寻求对自然的理解，且这理解在没有能动者在场时也保持有意义。这与 RQM 和 QBism 的差别相同，但 Healey 的立场比 QBism 更接近 RQM：QBism 的量子态归属取决于能动者的认知状态，而 Healey 归于系统的量子态只取决于界定该能动者视角的物理环境。
    step2: |-
