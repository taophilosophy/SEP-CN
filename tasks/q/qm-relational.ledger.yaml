      *Hidden variables* (Bohm): Hidden variable theories, of which Bohm theory (Bohm 1952)[^bohm-1952] is the best available example, provide a realistic and deterministic interpretation of quantum mechanics. The similarity between RQM and Bohm theory is in the realistic interpretation of some variables, such as the position of a particle. The differences are two. The first is that on the Bohm theory it is position that always has a definite value, whereas, on RQM, what variable acquires a value in an interaction depends on the nature of the interaction. The second is that on the Bohm theory position always has a definite value, which changes in a continuous manner, whereas, on RQM, the ontology has the sparseness already discussed. In RQM there is no analog of the extra equation assumed in Bohm theory. Drezet (2024) has discussed the relation between Bohm theory and RQM.
    step1: |-
      *隐变量*（玻姆）：隐变量理论——其中玻姆理论（Bohm 1952）[^bohm-1952]是现有最佳范例——为量子力学提供了一种实在论的、确定性的解释。RQM 与玻姆理论的相似之处，在于对某些变量（如粒子的位置）作实在论解释。差别有两点。第一，在玻姆理论中，总是位置具有确定的值；而在 RQM 中，哪个变量在相互作用中取得值，取决于相互作用的性质。第二，在玻姆理论中，位置总是具有确定的值，并以连续方式变化；而在 RQM 中，本体论具有前面讨论过的稀疏性。RQM 中没有玻姆理论所假定的那个额外方程的对应物。Drezet（2024）讨论了玻姆理论与 RQM 的关系。
    step2: |-
      **隐变量**（玻姆）：隐变量理论以玻姆理论（Bohm 1952）[^bohm-1952]为现有最佳范例，为量子力学提供了一种实在论、确定性的解释。RQM 与玻姆理论的相似处，在于对某些变量（如粒子位置）作实在论解释。差别有二。其一，玻姆理论中总是位置具有确定值；RQM 中哪个变量在相互作用中取值，取决于相互作用的性质。其二，玻姆理论中位置始终有确定值，且连续变化；RQM 的本体论则具前文所说的稀疏性。玻姆理论所假定的额外方程，在 RQM 中没有对应物。Drezet（2024）讨论了玻姆理论与 RQM 的关系。
