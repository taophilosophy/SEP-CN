      The relation between RQM and ontic structural realism has been emphasized also by Mauro Dorato (2016). Dorato gives an extensive evaluation of RQM, pointing out its main characteristics. He emphasises then two aspects that characterise RQM. The first is a revisionary metaphysical account of quantum theory; that is: central assumptions of common sense must go, if they contradict contemporary physical theories. Here, what is abandoned is the presupposition that quantum systems have a non-relational, intrinsic nature. RQM’s metaphysics is revisionary also for a second reason. Analogously to the many-worlds interpretation, RQM does not suggest changing the formalism of quantum theory—as alternative formulations of the theory do—but rather, modifies the conceptual schemes with which we can interpret the formalism, and consequently, our metaphysics. Dorato observes that the relativisation of values implies a relativisation of the very notion of object or entity, if (i) having some intrinsic, non-purely dispositional properties is essential to the identity of an object, and (ii) no entity can exist if it does not have an intrinsic identity (see Nāgārjuna 1995)[^nāgārjuna-1995]. The only reality in RQM is given by events, which are the result of interactions between distinct quantum systems, but even these events can be described in a different way by different physical systems. The interaction cannot be described in a more precise way by a constructive theory in Einstein’s sense (Einstein 1919)[^einstein-1919] that can explain the coming into being of a definite outcome without just assuming it as a fundamental fact. Dorato concludes that there is no measurement problem in RQM because RQM is implicitly formulated as a theory of principle. He also considers the issue of priority monism as defined in Schaffer (2010): Shaffer claims that quantum mechanics’ entanglement is evidence that the whole universe has ontological priority with respect to its parts. Dorato point out that the firm advocacy of relationalism of RQM has instead radical anti-holistic consequences.
    step1: |-
      RQM 与存在结构实在论的关系，也受到 Mauro Dorato（2016）的强调。Dorato 对 RQM 作了广泛评估，指出其主要特征。他随后强调刻画 RQM 的两个方面。第一是对量子理论的修正主义形而上学说明；也就是说：常识的中心假定若与当代物理理论相矛盾，就必须放弃。此处被放弃的是这一预设：量子系统具有非关系的、内在的本性。RQM 的形而上学是修正主义的，还有第二个原因。与多世界解释类似，RQM 不像理论的其他替代表述那样建议改变量子理论的形式体系，而是修改我们用以解释形式体系的概念图式，并随之修改我们的形而上学。Dorato 指出，值的相对化意味着对象或实体概念的相对化，如果 (i) 具有某些内在的、非纯然倾向性的性质对一个对象的同一性来说本质，且 (ii) 没有实体能在缺乏内在同一性的情况下存在（见 Nāgārjuna 1995）[^nāgārjuna-1995]。RQM 中唯一的实在由事件给出，事件是不同量子系统之间相互作用的结果，但即使是这些事件，也可以被不同物理系统以不同方式描述。这一相互作用不能由爱因斯坦意义上的构造性理论（Einstein 1919）[^einstein-1919]更精确地描述——那种理论能在不把确定结果的出现径直当作基本事实的情况下解释之。Dorato 的结论是：RQM 中没有测量问题，因为 RQM 是隐式地作为原理理论而表述的。他还考虑了 Schaffer（2010）定义的优先一元论问题：Shaffer 主张，量子力学的纠缠是整个宇宙对其部分具有本体论优先性的证据。Dorato 指出，RQM 对关系主义的坚定捍卫反而有激进的反对整体论的后果。
    step2: |-
      RQM 与存在结构实在论的关系，Mauro Dorato（2016）亦有强调。Dorato 对 RQM 作了全面评估，指出其主要特征，并强调两点刻画。第一，RQM 对量子理论作修正主义的形而上学说明：凡与当代物理理论相抵触的常识性中心假定，都必须放弃。这里被放弃的，是“量子系统具有非关系的、内在的本性”这一预设。RQM 的形而上学之所以是修正主义的，还有第二重原因：与多世界解释相仿，RQM 并不建议改换量子理论的形式体系（替代性的理论表述才这样做），而是修改我们用以解释形式体系的概念图式，随之修改我们的形而上学。Dorato 指出，取值的相对化会带来对象或实体概念本身的相对化——倘若 (i) 具有某些内在的、非纯然倾向性的性质乃对象同一性所必需，且 (ii) 无内在同一性者不成其为实体（见 Nāgārjuna 1995）[^nāgārjuna-1995]。RQM 中的唯一实在由事件给出：事件是不同量子系统相互作用的结果，但即便是这些事件，也可被不同物理系统以不同方式描述。这种相互作用无法由爱因斯坦意义上的构造性理论（Einstein 1919）[^einstein-1919]更精确地描述——构造性理论能在不把确定结果的出现径直当作基本事实的前提下解释之。Dorato 的结论是：RQM 没有测量问题，因为它隐式地被表述为一条原理理论。他还考虑了 Schaffer（2010）所定义的优先一元论：Shaffer 主张，量子力学的纠缠证明整个宇宙对其部分具有本体论优先性。Dorato 指出，RQM 坚定捍卫关系主义，其后果反而是激进的反对整体论。
