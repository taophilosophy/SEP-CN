      Interpreted weakly, the postulate is sufficient to guarantee the intersubjectivity between agents that enjoy a common decoherece domain. They can pile up a sufficient number of facts that are stable in the sense of (DiBiagio and Rovelli 2021)[^rovelli-2021] and develop rational science by noticing probabilistic regularities and by induection, and therefore develop and test physical laws. A community of scientific perception in agreement as to what constitutes the object of the investigation is therefore compatible with RQM ven in its full perspectival version. On the other hand, this is not sufficient to close off the possibility that with respect to a further observer external to this community the entire contingent world specifically described by current science could be just a term in a quantum superposition. So interpreted, RQM does not challenge the rationality of the scientific enterpreise, but *does* undermine the possibility of ascertaining facts as absolutely true. Taken in this sense, RQM interprets quantum phenomena as an invitation to a radical perspectivalism: with respect to some observer, we can always be like Friend is for Wigner. For a recent extensive discussion of these alteratives, see the *Foundation of Physics* Special Issue on RQM and especially the introduction by Calosi and Riedel (2024).
    step1: |-
      弱解释下，该公设足以保证享有共同退相干域的能动者之间的主体间性。他们可以积累足够数量的、在（DiBiagio 与 Rovelli 2021）[^rovelli-2021]意义上稳定的事实，通过注意概率性规律和归纳来发展理性科学，从而发展并检验物理定律。因此，就什么构成研究对象达成一致的科学感知共同体，与 RQM 的完全视角主义版本相容。另一方面，这不足以排除如下可能性：相对于这个共同体之外的一个进一步观察者，当前科学所具体描述的整个偶然世界可以只是量子叠加中的一项。按这种解释，RQM 不挑战科学事业的理性，但*确实*削弱了查明事实为绝对真实的可能性。在这个意义上，RQM 把量子现象解释为对一种激进视角主义的邀请：相对于某个观察者，我们总可以像朋友对维格纳那样。关于这些替代方案的近期详尽讨论，见《Foundation of Physics》RQM 特刊，尤其是 Calosi 与 Riedel（2024）的导言。
    step2: |-
      弱解释下，该公设足以保证享有共同退相干域的能动者之间的主体间性。他们可以积累足够多的、在（DiBiagio 与 Rovelli 2021）[^rovelli-2021]意义上稳定的事实，靠注意概率性规律与归纳发展出理性科学，从而提出并检验物理定律。因此，就研究对象为何达成一致的科学感知共同体，与 RQM 的完全视角主义版本相容。但这仍不足以排除一种可能：相对于该共同体之外的一个进一步观察者，当前科学所具体描述的整个偶然世界，不过是量子叠加中的一项。按这种解释，RQM 不挑战科学事业的理性，却 **确实** 削弱了把事实查明为绝对真实的可能。在这个意义上，RQM 把量子现象解释为对激进视角主义的邀请：相对于某个观察者，我们总可能像朋友之于维格纳。这些方案的近期详尽讨论，见 *Foundation of Physics* RQM 特刊，尤其 Calosi 与 Riedel（2024）的导言。
