      ## 1 术语
  - id: 4
    kind: body
    source: |-
      Physical systems are divided into **types** according to their unchanging (or ‘state-independent’) properties, and the **state** of a system at a time consists of a complete specification of those of its properties that change with time (its ‘state-dependent’ properties). To give a complete description of a system, then, we need to say what type of system it is and what its state is at each moment in its history.
    step1: |-
      物理系统按其不变的（或“独立于态的”）性质被划分为**类型**，而一个系统在某一时刻的**态**由对那些随时间变化的性质（其“依赖于态的”性质）的完全规定构成。于是，要给出一个系统的完全描述，我们需要说它是什么类型的系统，以及它在历史中每一时刻的态是什么。
    step2: |-
      物理系统按其不变的（或“独立于态的”）性质分为若干 **类型**；而一个系统在某时刻的 **态**，等于把它随时间变化的那些性质（“依赖于态的”性质）完备刻画出来。因此，要完备地描述一个系统，就要说明它属于什么类型，以及在它历史的每一时刻处于什么态。
  - id: 5
    kind: body
    source: |-
      A **physical quantity** is a mutually exclusive and jointly exhaustive family of physical properties (for those who know this way of talking, it is a family of properties with the structure of the cells in a partition). Knowing what kinds of values a quantity takes can tell us a great deal about the relations among the properties of which it is composed. The values of a bivalent quantity, for instance, form a set with two members; the values of a real-valued quantity form a set with the structure of the real numbers. This is a special case of something we will see again and again, *viz.*, that knowing what kind of mathematical objects represent the elements in some set (here, the values of a physical quantity; later, the states that a system can assume, or the quantities pertaining to it) tells us a very great deal (indeed, arguably, all there is to know) about the relations among them.
    step1: |-
      一个**物理量**是一族互相排斥而合起来穷尽的物理性质（对熟悉这种说法的人而言，它是一族具有划分之小胞结构的性质）。知道一个量取什么种类的值，就能告诉我们许多关于构成它的那些性质之间的关系。例如，一个二值量的值构成一个有两个成员的集合；一个实值量的值构成一个具有实数结构的集合。这是我们将一再见到的事情的一个特例，即：知道某种数学对象被用来表示某个集合中的元素（这里是物理量的值；以后是系统可处的态，或属于它的量），就能告诉我们关于它们之间的关系的极多东西（可以说，是全部可知的东西）。
    step2: |-
      **物理量** 是一族互斥而合起来穷尽的物理性质（熟悉这套讲法的人会认出：这是一族具有“划分之小胞”结构的性质）。知道一个量取哪类值，就能使我们对其构成性质之间的关系了解许多。例如，二值量的值构成一个两元集合；实值量的值构成一个具有实数结构的集合。这是一件我们会反复见到的事情的特例：知道用哪类数学对象表示某个集合中的元素（此处是物理量的值；往后则是系统可取的态，或属于该系统的量），就能告诉我们关于这些元素之间关系的极多东西——甚至可以说，是全部可知的东西。
  - id: 6
    kind: body
    source: |-
      In quantum mechanical contexts, the term ‘**observable**’ is used interchangeably with ‘physical quantity’, and should be treated as a technical term with the same meaning. It is no accident that the early developers of the theory chose the term, but the choice was made for reasons that are not, nowadays, generally accepted. The **state-space** of a system is the space formed by the set of its possible states,[^note-2] i.e., the physically possible ways of combining the values of quantities that characterize it internally. In classical theories, a set of quantities which forms a supervenience basis for the rest is typically designated as ‘basic’ or ‘fundamental’, and, since any mathematically possible way of combining their values is a physical possibility, the state-space can be obtained by simply taking these as coordinates.[^note-3] So, for instance, the state-space of a classical mechanical system composed of $n$ particles, obtained by specifying the values of $6n$ real-valued quantities — three components of position, and three of momentum for each particle in the system — is a $6n$-dimensional coordinate space. Each possible state of such a system corresponds to a point in the space, and each point in the space corresponds to a possible state of such a system. The situation is a little different in quantum mechanics, where there are mathematically describable ways of combining the values of the quantities that don’t represent physically possible states. As we will see, the state-spaces of quantum mechanics are special kinds of vector spaces, known as Hilbert spaces, and they have more internal structure than their classical counterparts.
    step1: |-
      在量子力学语境中，“**可观测量**”一词与“物理量”互换使用，应被当作一个具有相同意义的技术术语。早期理论发展者选择这个词并非偶然，但选择它的理由如今已不被普遍接受。一个系统的**状态空间**是由其可能态的集合构成的空间，[^note-2] 即刻画它内部的那些量的值在物理上可能的组合方式。在经典理论中，一组构成其余量之随附基的量通常被指定为“基本的”或“根本的”；由于这些值的任何数学上可能的组合都是一个物理可能性，状态空间可以简单地取它们为坐标而得到。[^note-3] 例如，一个由 $n$ 个粒子组成的经典力学系统，通过指定 $6n$ 个实值量的值——系统中每个粒子三个位置分量、三个动量分量——得到的状态空间是一个 $6n$ 维坐标空间。这类系统的每个可能态对应空间中一个点，空间中每个点对应这类系统的一个可能态。量子力学中的情况略有不同：存在一些数学上可描述的量值组合方式，它们并不表示物理上可能的态。正如我们将看到的，量子力学的状态空间是一些特殊的矢量空间，称为希尔伯特空间，它们比经典对应物有更多的内部结构。
    step2: |-
      在量子力学语境中，“**可观测量**”一词与“物理量”交替使用，应视为含义相同的技术术语。理论的早期开创者选用这个词绝非偶然，但当初选它的理由如今已不被普遍接受。一个系统的 **状态空间**，就是由它全部可能态构成的空间，[^note-2] 也就是刻画其内部诸量之取值在物理上可能怎样组合。在经典理论中，若其余诸量都随附于某组量，这组量通常被称作“基本的”或“根本的”；既然这些值在数学上可能的任何组合都物理可能，状态空间径可直接取它们为坐标。[^note-3] 例如，一个由 $n$ 个粒子组成的经典力学系统，通过指定 $6n$ 个实值量的值——系统中每个粒子三个位置分量、三个动量分量——所得到的状态空间是一个 $6n$ 维坐标空间。这类系统的每个可能态对应空间中一个点，空间中每个点也对应这类系统的一个可能态。量子力学的情况略有不同：有些组合方式在数学上说得通，却不对应物理上可能的态。后文会看到：量子力学的状态空间是一类特殊矢量空间，即希尔伯特空间，其内部结构比经典对应物更丰富。
  - id: 7
    kind: body
    source: |-
      A **structure** is a set of elements on which certain operations and relations are defined, a **mathematical structure** is just a structure in which the elements are mathematical objects (numbers, sets, vectors) and the operations mathematical ones, and a **model** is a mathematical structure used to represent some physically significant structure in the world.
    step1: |-
      一个**结构**是一个定义了某些运算和关系的元素集合；一个**数学结构**就是元素为数学对象（数、集合、矢量）而运算为数学运算的结构；一个**模型**是用来表示世界中某个物理上有意义的结构的数学结构。
    step2: |-
      **结构** 是定义了某些运算与关系的元素集合；**数学结构** 即元素为数学对象（数、集合、矢量）、运算亦为数学运算的结构；而 **模型** 则是用来表示世界中某个物理上有意义的结构的数学结构。
  - id: 8
    kind: body
    source: |-
      The heart and soul of quantum mechanics is contained in the Hilbert spaces that represent the state-spaces of quantum mechanical systems. The internal relations among states and quantities, and everything this entails about the ways quantum mechanical systems behave, are all woven into the structure of these spaces, embodied in the relations among the mathematical objects which represent them.[^note-4] This means that understanding what a system is like according to quantum mechanics is inseparable from familiarity with the internal structure of those spaces. Know your way around Hilbert space, and become familiar with the dynamical laws that describe the paths that vectors travel through it, and you know everything there is to know, in the terms provided by the theory, about the systems that it describes.
    step1: |-
      量子力学的心脏与灵魂包含在表示量子力学系统状态空间的那些希尔伯特空间之中。态与量之间的内部关系，以及这一切所蕴含的量子力学系统行为方式，全都编织在这些空间的结构之中，体现在表示它们的数学对象之间的关系里。[^note-4] 这意味着，理解一个系统按量子力学是什么样的，与熟悉那些空间的内部结构不可分离。熟悉希尔伯特空间，熟悉描述矢量在其中穿行的路径的动力学定律，你就知道了——用理论提供的术语来说——它所描述的系统的全部可知之事。
    step2: |-
      量子力学的心髓，尽在表示量子力学系统状态空间的那些希尔伯特空间之中。态与量之间的内部关系，以及由此蕴含的种种系统行为，全都编织在这些空间的结构里，体现在代表它们的数学对象如何相互关联之中。[^note-4] 这意味着：理解一个系统按量子力学是什么样子，与熟悉这些空间的内部结构密不可分。熟悉希尔伯特空间，并熟悉刻画矢量穿行路径的动力学定律。做到这一步，就等于按理论自己的话，把它所描述的系统里一切可知之事，全都掌握了。
  - id: 9
    kind: body
    source: |-
      By ‘know your way around’ Hilbert space, I mean something more than possess a description or a map of it; anybody who has a quantum mechanics textbook on their shelf has that. I mean know your way around it in the way you know your way around the city in which you live. This is a practical kind of knowledge that comes in degrees and it is best acquired by learning to solve problems of the form: How do I get from A to B? Can I get there without passing through C? And what is the shortest route? Graduate students in physics spend long years gaining familiarity with the nooks and crannies of Hilbert space, locating familiar landmarks, treading its beaten paths, learning where secret passages and dead ends lie, and developing a sense of the overall lay of the land. They learn how to navigate Hilbert space in the way a cab driver learns to navigate his city.
    step1: |-
      所谓“熟悉”希尔伯特空间，我的意思不只是拥有一份描述或一张地图；凡是书架上有一本量子力学教科书的人都有那个。我的意思是像熟悉你居住的城市那样熟悉它。这是一种有程度之分的实践性知识，最好通过学习解决如下形式的问题来获得：我如何从 A 到 B？能否不经过 C 到达那里？最短路线是什么？物理学研究生花多年时间熟悉希尔伯特空间的犄角旮旯，找到熟悉的地标，走过它的常走之路，弄清秘密通道和死胡同在哪里，并对整体地形形成感觉。他们学会像出租车司机学会在城里认路那样在希尔伯特空间中导航。
    step2: |-
      所谓“熟悉”希尔伯特空间，我指的不只是拥有一份描述或一张地图——书架上放着一本量子力学教科书的人都有那个。我指的是像熟悉你居住的城市那样熟悉它。这是一种有程度之分的实践性知识，最好通过学习求解这样一类问题来获得：我如何从 A 到 B？能否不经过 C 就到达？最短路线是什么？物理系研究生要花多年工夫摸熟希尔伯特空间：辨认熟悉的地标，走熟大路小径，摸清密道与死胡同的位置，对整体地形形成感觉。他们学会在希尔伯特空间中认路，就像出租车司机学会在城里认路一样。
