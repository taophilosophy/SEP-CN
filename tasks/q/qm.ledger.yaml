      Any collection of $N$ mutually orthogonal vectors of length 1 in an $N$-dimensional vector space constitutes an **orthonormal basis** for that space. Let $\ket{A_1}, \ldots, \ket{A_N}$ be such a collection of unit vectors. Then every vector in the space can be expressed as a sum of the form:

      $$ \ket{B} = b_1 \ket{A_1} + b_2 \ket{A_2} + \ldots + b_N \ket{A_N}, $$
    step1: |-
      $N$ 维矢量空间中任意 $N$ 个长度为 1 且互相正交的矢量，构成该空间的一个**标准正交基**。设 $\ket{A_1}, \ldots, \ket{A_N}$ 是这样一组单位矢量。那么空间中每个矢量都可表示为如下形式的和：

      $$ \ket{B} = b_1 \ket{A_1} + b_2 \ket{A_2} + \ldots + b_N \ket{A_N}, $$
    step2: |-
      $N$ 维矢量空间中，任何 $N$ 个长度为 1 且互相正交的矢量都构成该空间的一个 **标准正交基**。设 $\ket{A_1}, \ldots, \ket{A_N}$ 是这样一组单位矢量，那么空间中的每个矢量都可表为如下形式的和：

      $$ \ket{B} = b_1 \ket{A_1} + b_2 \ket{A_2} + \ldots + b_N \ket{A_N}, $$
