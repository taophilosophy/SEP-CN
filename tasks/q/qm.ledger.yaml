      **Physical Quantities.** Hermitian operators in the Hilbert space associated with a system represent physical quantities, and their eigenvalues represent the possible results of measurements of those quantities. There is an operator, called the Hamiltonian, that plays a special role in quantum theory because the dynamics of a system can be conveniently formulated by tracking its evolution. The Hamiltonian – written $H$, or $\hat{H}$ – stands for the total energy of the system. Its eigenvalues are the possible results that might be obtained in measurements of total energy. It is given by summing over the kinetic and potential energies of the system’s components.
    step1: |-
      **物理量。** 与系统相伴随的希尔伯特空间中的厄米算符表示物理量，它们的本征值表示这些量的测量的可能结果。有一个称为哈密顿量的算符在量子理论中扮演特殊角色，因为系统的动力学可以方便地通过追踪其演化来表述。哈密顿量——写作 $H$ 或 $\hat{H}$——代表系统的总能量。它的本征值是总能量测量中可能得到的结果。它由对系统各组件的动能与势能求和而给出。
    step2: |-
      **物理量。** 与系统相伴随的希尔伯特空间中的厄米算符表示物理量，其本征值表示测量这些量可能得到的结果。有一个算符称为哈密顿量，在量子理论中地位特殊：追踪系统的演化时，用它表述动力学最为便当。哈密顿量——记作 $H$ 或 $\hat{H}$——代表系统的总能量，其本征值就是测量总能量可能得到的结果。它由对系统各组件的动能与势能求和而得。
