    step1: |-
      在希尔伯特空间中把矢量相加或乘以标量的任何方式都将产生一个也在该空间中的矢量。在该矢量被归一化的情形下，由 (3.1) 它将表示系统的一个可能态；而当它是本征值相异的一个可观测量 $B$ 的一对本征矢量之和时，它本身将不是 $B$ 的本征矢量，但由 (3.4b) 它将伴随有一组概率，对应于在 $B$ 测量中显示这样或那样结果。
    step2: |-
