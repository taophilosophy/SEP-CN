    step1: |-
      任何试图理解量子力学关于世界说了什么的人都必须与剩下的事实搏斗。这个问题不是希尔伯特空间的问题，而是动力学的问题——描述系统在空间中遵循的轨迹的规则。从物理的观点看，它比到此为止讨论的任何东西都更令人担忧。它不仅给试图提供理论的解释的人带来困难，而且似乎指向理论基础中的一个逻辑不一致。
