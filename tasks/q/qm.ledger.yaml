      ### 2.2 Operators
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      An **operator** $O$ is a mapping of a vector space onto itself; it takes any vector $\ket{B}$ in a space onto another vector $\ket{B'}$ also in the space; $O \ket{B} = \ket{B'}$. **Linear operators** are operators that have the following properties:
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      1. $O(\ket{A} + \ket{B}) = O \ket{A} + O \ket{B}$, and
      2. $O(c \ket{A}) = c(O \ket{A})$.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Just as any vector in an $N$-dimensional space can be represented by a column of $N$ numbers, relative to a choice of basis for the space, any linear operator on the space can be represented in a column notation by $N^2$ numbers:

      $$O = \begin{bmatrix} O_{11} & O_{12} \\ O_{21} & O_{22} \end{bmatrix}$$
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      where $O_{ij} = \braket{A_i}{O \mid A_j}$ and the $A_N$ are the basis vectors of the space. The effect of the linear operator $O$ on the vector $B$ is, then, given by

      $$\begin{align} O \ket{B} &= \begin{bmatrix} O_{11} & O_{12} \\ O_{21} & O_{22} \end{bmatrix} \times \begin{bmatrix} b_1 \\ b_2 \end{bmatrix} \\ &= \begin{bmatrix} (O_{11}b_1 + O_{12}b_2) \\ (O_{21}b_1 + O_{22}b_2) \end{bmatrix} \\ &= (O_{11}b_1 + O_{12}b_2)|A_1\rangle + (O_{21}b_1 + O_{22}b_2|A_2\rangle \\ &=|B'\rangle \end{align}$$
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Two more definitions before we can say what Hilbert spaces are, and then we can turn to quantum mechanics. $\ket{B}$ is an **eigenvector** of $O$ with eigenvalue $a$ if, and only if, $O \ket{B} = a \ket{B}$. Different operators can have different eigenvectors, but the eigenvector/operator relation depends only on the operator and vectors in question, and not on the particular basis in which they are expressed; the eigenvector/operator relation is, that is to say, invariant under change of basis. A **Hermitean operator** is an operator which has the property that there is an orthonormal basis consisting of its eigenvectors and those eigenvalues are all real.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      A **Hilbert space**, finally, is a vector space on which an inner product is defined, and which is complete, i.e., which is such that any Cauchy sequence of vectors in the space converges to a vector in the space. All finite-dimensional inner product spaces are complete, and I will restrict myself to these. The infinite case involves some complications that are not fruitfully entered into at this stage.
    step1: TBD
    step2: TBD
