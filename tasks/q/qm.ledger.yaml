    source: |-
      Quantum mechanics is, at least at first glance and at least in part, a mathematical machine for predicting the behaviors of microscopic particles — or, at least, of the measuring instruments we use to explore those behaviors — and in that capacity, it is spectacularly successful: in terms of power and precision, head and shoulders above any theory we have ever had. Mathematically, the theory is well understood; we know what its parts are, how they are put together, and why, in the mechanical sense (i.e., in a sense that can be answered by describing the internal grinding of gear against gear), the whole thing performs the way it does, how the information that gets fed in at one end is converted into what comes out the other. The question of what kind of a world it describes, however, is controversial; there is very little agreement, among physicists and among philosophers, about what the world *is like* according to quantum mechanics. Minimally interpreted, the theory describes a set of facts about the way the microscopic world impinges on the macroscopic one, how it affects our measuring instruments, described in everyday language or the language of classical mechanics. Disagreement centers on the question of what a microscopic world, which affects our apparatuses in the prescribed manner, is, or even could be, like *intrinsically*; or how those apparatuses could themselves be built out of microscopic parts of the sort the theory describes.[^note-1]
    step1: |-
      量子力学至少乍看之下、至少在某种程度上是一台用于预测微观粒子行为的数学机器——或者至少，是预测我们用来探索那些行为的测量仪器之行为的数学机器——而就这一职能而言，它取得了辉煌的成功：在威力与精度方面，远在我们曾有过的任何理论之上。在数学上，这个理论是被很好地理解的；我们知道它的部件是什么、它们如何被装配在一起，以及为什么——在机械的意义上（即在一个可以通过描述齿轮与齿轮之间的内部咬合来回答的意义上）——整体会以它那样的方式运转，输入一端的信息如何被转换为另一端输出的东西。然而，它描述的是什么样的世界，这个问题是有争议的；在物理学家之间和哲学家之间，关于按量子力学世界是什么样的，几乎没有一致意见。作最小的解释，这个理论描述了一组关于微观世界如何冲击宏观世界、如何影响我们测量仪器的事实，这些仪器是用日常语言或经典力学的语言描述的。分歧集中于这个问题：一个以被规定的方式影响我们仪器的微观世界就其本身而言是什么样的，甚至可能是什么样的；或者那些仪器如何能够由理论所描述的那类微观部件建造出来。[^note-1]
    step2: |-
      至少在初见之下、至少在部分上，量子力学是一台预测微观粒子行为的数学机器——或者至少，是预测我们用来探究那些行为的测量仪器之行为的机器；就这一职能而论，它成绩斐然：论威力与精度，远驾于我们迄今有过的任何理论之上。在数学层面，这个理论已了如指掌：部件是什么、如何拼装、整体为何如此运转、一端喂入的信息如何变成另一端的输出，这些问题都有答案。这里“运转”取机械的意义，即可以靠描述齿轮与齿轮如何咬合来回答。至于它描绘了怎样的世界，则有争议；无论物理学家还是哲学家，对按量子力学来看世界 **究竟** 是什么样的，几乎全无共识。作最起码的解释，这个理论描述的是微观世界如何作用于宏观世界、如何影响我们测量仪器的一组事实，而仪器是用日常语言或经典力学的语言描述的。分歧聚焦于这样一个问题：一个按特定方式作用于我们仪器的微观世界，就其本身而言是什么样子、甚至可能是什么样子；或者说，那些仪器本身如何能由理论所描述的那类微观部件组装而成。[^note-1]
