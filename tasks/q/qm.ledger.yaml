      Now the definition of the inner product $\braket{A}{B}$ has to be modified to apply to complex spaces. Let $c^*$ be the complex conjugate of $c$. (When $c$ is a complex number of the form $a \pm bi$, then the complex conjugate $c^*$ of $c$ is defined as follows:

      $$ [a+bi]^* = a-bi \\ [a-bi]^* = a+bi $$
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      So, for all complex numbers $c$, $[c^*]^* = c$, but $c^* = c$ just in case $c$ is real.) Now definition of the inner product of $\ket{A}$ and $\ket{B}$ for complex spaces can be given in terms of the conjugates of complex coefficients as follows. Where $\ket{A_1}$ and $\ket{A_2}$ are the unit vectors described earlier, $\ket{A} = a_1 \ket{A_1} + a_2 \ket{A_2}$ and $\ket{B} = b_1 \ket{A_1} + b_2 \ket{A_2}$, then

      $$ \braket{A}{B} = (a_1^*)(b_1) + (a_2^*)(b_2) $$
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      The most general and abstract notion of an inner product, of which we’ve now defined two special cases, is as follows. $\braket{A}{B}$ is an inner product on a vector space $V$ just in case
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      1. $\braket{A}{A} = |A|^2$, and $\braket{A}{A}=0$ if and only if $A=0$
      2. $\braket{B}{A} = \braket{A}{B}^*$
      3. $\braket{B}{A+C}=\braket{B}{A} + \braket{B}{C}$.
    step1: TBD
    step2: TBD
