      **Dynamics.** a. *Contexts of type 1*: Given the state of a system at $t$ and the forces and constraints to which it is subject, there is an equation, ‘**Schrödinger’s equation**’, that gives the state at any other time $U \ket{v_t} \rightarrow \ket{v_{t'}}$.[^note-8] The important properties of $U$ for our purposes are that it is **deterministic**, which is to say that it takes the state of a system at one time into a unique state at any other, it is **unitary**, which means that it is an automorphism of the Hilbert space on which it acts (i.e., a mapping of that space onto itself that preserves the linear space structure and inner product), and it is **linear**, which is to say that if it takes a state $\ket{A}$ onto the state $\ket{A'}$, and it takes the state $\ket{B}$ onto the state $\ket{B'}$, then it takes any state of the form $\alpha \ket{A} + \beta \ket{B}$ onto the state $\alpha \ket{A'} + \beta \ket{B'}$.
    step1: |-
      **动力学。** a. *类型 1 语境*：给定系统在 $t$ 时刻的态以及它所受的力与约束，有一个方程，即**薛定谔方程**，给出任何其他时刻的态 $U \ket{v_t} \rightarrow \ket{v_{t'}}$。[^note-8] 对我们的目的来说，$U$ 的重要性质是：它是**决定论的**，也就是说它把系统在一个时刻的态带到任何其他时刻的唯一一个态；它是**幺正的**，这意味着它是它所作用其上的希尔伯特空间的自同构（即该空间到自身的保持线性空间结构与内积的映射）；它是**线性的**，也就是说，如果它把态 $\ket{A}$ 带到态 $\ket{A'}$，把态 $\ket{B}$ 带到态 $\ket{B'}$，那么它把任何形如 $\alpha \ket{A} + \beta \ket{B}$ 的态带到态 $\alpha \ket{A'} + \beta \ket{B'}$。
    step2: |-
      **动力学。** a. “类型 1 语境”：给定系统在 $t$ 时刻的态以及它所受的力与约束，有一个方程——**薛定谔方程**——给出任何其他时刻的态：$U \ket{v_t} \rightarrow \ket{v_{t'}}$。[^note-8] 就我们的目的而言，$U$ 要点有三。其一，它是 **决定论的**：系统在某时刻的态，总能在其他时刻找到唯一对应。其二，它是 **幺正的**：它是该希尔伯特空间的自同构，一个保持线性结构与内积、映空间到自身的映射。其三，它是 **线性的**：若它把态 $\ket{A}$ 带到 $\ket{A'}$、把态 $\ket{B}$ 带到 $\ket{B'}$，就把任何 $\alpha \ket{A} + \beta \ket{B}$ 形的态带到 $\alpha \ket{A'} + \beta \ket{B'}$。
