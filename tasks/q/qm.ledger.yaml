      *Contexts of type 2* (“Measurement Contexts”):[^note-9] Carrying out a “measurement” of an observable $B$ on a system in a state $\ket{A}$ has the effect of collapsing the system into a $B$-eigenstate corresponding to the eigenvalue observed. This is known as the **Collapse Postulate**. Which *particular* $B$-eigenstate it collapses into is a matter of probability, and the probabilities are given by a rule known as **Born’s Rule**: $$ \Pr(b_i) = |\braket{A}{B=b_i}|^2 $$
    step1: |-
      *类型 2 语境*（“测量语境”）：[^note-9] 对处于态 $\ket{A}$ 的系统实施对可观测量 $B$ 的一次“测量”，其效果是使系统塌缩到与观测到的本征值相应的 $B$ 本征态。这就是所谓的**塌缩公设**。它塌缩到哪一个特定的 $B$ 本征态则是个概率问题，概率由一条称为**玻恩规则**的规则给出： $$ \Pr(b_i) = |\braket{A}{B=b_i}|^2 $$
    step2: |-
      “类型 2 语境”（“测量语境”）：[^note-9] 对处于态 $\ket{A}$ 的系统就可观测量 $B$ 实施一次“测量”，其效果是使系统塌缩到与所观测到的本征值相应的那个 $B$ 本征态。这就是所谓的 **塌缩公设**。至于它塌缩到哪个特定的 $B$ 本征态，则是概率问题；概率由一条称为 **玻恩规则** 的规则给出： $$ \Pr(b_i) = |\braket{A}{B=b_i}|^2 $$
