      [^note-9]: The quotes are to recommend caution about reading too much of one’s ordinary understanding of this word into its use in quantum mechanics; one usually thinks of measurement as a way of obtaining information about a system, but the only information one takes away from an individual quantum-mechanical ‘measurement’ about the state of the measured system before the interaction is that it was not (or, at least, there is a measure zero probability that it was) in an eigenstate of the measured observable with an eigenvalue other than the one observed. Of course, if the Collapse Postulate is correct, one knows the state of the system after measurement, but if I shoot someone at close range, I can be pretty sure that they are dead afterward; that doesn’t make the interaction a measurement of the state of their health.
    step1: |-
      [^note-9]: 加引号是要提醒谨慎，不要把我们对这个词的日常理解过多地带入它在量子力学中的用法；人们通常把测量当作获取系统信息的方式，但从一次个体量子力学“测量”中，关于被测系统在相互作用之前的态，我们能带走的信息只有：它不处于（或至少，它处于……的概率测度为零）被测可观测量的、具有不同于所观测本征值的本征值的本征态。当然，如果塌缩公设正确，我们知道测量后系统的态；但如果我近距离枪击某人，我可以相当肯定他随后会死；这并不使该相互作用成为对其健康状况的一次测量。
    step2: |-
      [^note-9]: 加引号意在提醒：莫要把对这个词的日常理解过多掺入它在量子力学中的用法。人们通常把测量视为获取系统信息的方式，但对于一次个别的量子力学“测量”，关于被测系统在相互作用之前的态，我们能带走的信息只有一条：它并不（至少，它如此的概率测度为零）处于被测可观测量之下、本征值不同于所观测值的本征态上。当然，若塌缩公设正确，测量之后系统的态我们是知道的；可要是我在近距离开枪打人，我也能相当肯定他随后会死——这并不使那次相互作用成为对其健康状况的一次测量。
