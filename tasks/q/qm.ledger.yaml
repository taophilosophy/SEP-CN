      ## 3. Quantum Mechanics
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Four basic principles of quantum mechanics are:
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      **(3.1)**
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      **Physical States.** Every physical system is associated with a Hilbert Space, every unit vector in the space corresponds to a possible pure state of the system, and every possible pure state, to some vector in the space.[^note-7]
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      **(3.2)**
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      **Physical Quantities.** Hermitian operators in the Hilbert space associated with a system represent physical quantities, and their eigenvalues represent the possible results of measurements of those quantities. There is an operator, called the Hamiltonian, that plays a special role in quantum theory because the dynamics of a system can be conveniently formulated by tracking its evolution. The Hamiltonian – written $H$, or $\hat{H}$ – stands for the total energy of the system. Its eigenvalues are the possible results that might be obtained in measurements of total energy. It is given by summing over the kinetic and potential energies of the system’s components.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      **(3.3)**
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      **Composition.** The Hilbert space associated with a complex system is the tensor product of those associated with the simple systems (in the standard, non-relativistic, theory: the individual particles) of which it is composed.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      **(3.4)**
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      **Dynamics.** a. *Contexts of type 1*: Given the state of a system at $t$ and the forces and constraints to which it is subject, there is an equation, ‘**Schrödinger’s equation**’, that gives the state at any other time $U \ket{v_t} \rightarrow \ket{v_{t'}}$.[^note-8] The important properties of $U$ for our purposes are that it is **deterministic**, which is to say that it takes the state of a system at one time into a unique state at any other, it is **unitary**, which means that it is an automorphism of the Hilbert space on which it acts (i.e., a mapping of that space onto itself that preserves the linear space structure and inner product), and it is **linear**, which is to say that if it takes a state $\ket{A}$ onto the state $\ket{A'}$, and it takes the state $\ket{B}$ onto the state $\ket{B'}$, then it takes any state of the form $\alpha \ket{A} + \beta \ket{B}$ onto the state $\alpha \ket{A'} + \beta \ket{B'}$.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      **b.**
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      *Contexts of type 2* (“Measurement Contexts”):[^note-9] Carrying out a “measurement” of an observable $B$ on a system in a state $\ket{A}$ has the effect of collapsing the system into a $B$-eigenstate corresponding to the eigenvalue observed. This is known as the **Collapse Postulate**. Which *particular* $B$-eigenstate it collapses into is a matter of probability, and the probabilities are given by a rule known as **Born’s Rule**: $$ \Pr(b_i) = |\braket{A}{B=b_i}|^2 $$
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      There are two important points to note about these two kinds of contexts:
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      - The distinction between contexts of type 1 and 2 remains to be made out in quantum mechanical terms; nobody has managed to say in a completely satisfactory way, in the terms provided by the theory, which contexts are measurement contexts, and
      - Even if the distinction is made out, it is an open interpretive question whether there *are* contexts of type 2; i.e., it is an open interpretive question whether there are any contexts in which systems are governed by a dynamical rule *other* than Schrödinger’s equation.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
