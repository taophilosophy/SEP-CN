      有一种广泛流传的误解，认为康托尔定理表明不可能存在带全集的一致集合论。这个错误可以被詹森为 NFU 构造的模型驳倒，但远为动人的证明，是邱奇与 Oswald 在 1970 年代初各自独立、几乎同时给出的带全集的集合论模型的构造。它比 NFU 强的地方在于尊重外延性：它是纯集合论的一个真正的模型。该构造是 Rieger-Bernays 方法的精细化。做法如下：从类 ZF 的某个模型出发，取 $V$ 与 $V \times \{0, 1\}$ 之间的一个双射 $k$。现在定义新的属于关系 $E$，使 $xEy$ 当且仅当：或者 $k(y)$ 的第二分量为 1 且 $x \in$ 第一分量，或者 $k(y)$ 的第二分量为 0 且 $x \not\in$ 第一分量。此时 $k^{-1}(\varnothing)$ 就是全集。事实上 $k^{-1}(\langle x,0\rangle)$ 与 $k^{-1}(\langle x,1\rangle)$ 在这个新结构中是集合补。
