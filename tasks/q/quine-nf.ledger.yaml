      Quite early on Quine added classes to NF to obtain a theory of sets-with-classes known as ML. In the ZF context, adding classes is a natural thing to do, for it enables one to reduce the infinite replacement scheme to a single set-existence axiom: “the image of a set in a class is a set” if augmented with suitable class-existence axioms. However, none of the axioms of NF refer to classes in the way the replacement scheme of ZF does, so there is nothing for the class existence axioms to do. For this reason ML is nowadays regarded as a pointless syntactic complication of NF with no new mathematics, and it is not the subject of any research. At best the classes can be a harmless halo of epiphenomena (Wang [1950]). However, at worst – if the set existence axioms are allowed to have bound class variables (as in the 1940 first edition of Quine [1951a]) – then the class of total orders that are genuinely (“externally”) wellordered (no sub*classes* without least members) becomes a set and we have the Burali-Forti paradox (Rosser [1942]). The rumours still occasionally surfacing among mathematicians of the inconsistency of NF probably have their origin in a misreporting of this result, but the result itself concerns ML only so it has no bearing on the consistency question for NF. As of this writing, Randall Holmes and Sky Wilshaw appear to have proved the consistency of NF by a Fraenkel-Mostowski construction of significant complexity (Holmes & Wilshaw 2024, Other Internet Resources). The proof has been verified in Lean (see Wilshaw m.s. [Other Internet Resources]).
    step1: |-
      很早的时候，蒯因就给 NF 添加类，得到一种带类的集合论，称为 ML。在 ZF 语境中，添加类是很自然的事，因为它使人能把无穷替换图式归约为单一的存在公理：“一个集合在一个类中的像是集合”，只要再加上适当的类存在公理。然而，NF 的公理没有一条像 ZF 的替换图式那样提及类，所以类存在公理无事可做。由于这个缘故，ML 如今被视为 NF 的无谓句法复杂化，没有新数学，也不构成任何研究的对象。往好里说，类可以是无害的表象光晕（Wang [1950]）。然而往坏里说——若允许集合存在公理含有约束类变量（如蒯因 [1951a] 1940 年第一版那样）——则真正（“外部地”）良序的全序之类（没有无最小元之子类的）会成为集合，我们就有布拉利-福尔蒂悖论（Rosser [1942]）。数学家中间至今偶尔冒出的 NF 不一致的传言，多半源自对这一结果的误传；但该结果本身只涉及 ML，所以与 NF 的一致性无关。截至本文写作时，Randall Holmes 与 Sky Wilshaw 似乎已用相当复杂的 Fraenkel-Mostowski 构造证明了 NF 的一致性（Holmes & Wilshaw 2024，见其他网络资源）。该证明已在 Lean 中验证（见 Wilshaw m.s.［其他网络资源］）。
    step2: |-
      早在当年，蒯因就给 NF 添上类，得到一套带类的集合论，叫作 ML。在 ZF 的语境里加类是顺理成章的：它能让人把无穷多条替换图式压缩成一条集合存在公理——“一个集合在一个类中的像仍是集合”，再配上合适的类存在公理即可。可是 NF 的公理没有一条像 ZF 的替换图式那样谈到类，类存在公理便无事可做。正因如此，如今的 ML 只被看作给 NF 添的一层无谓句法累赘：没有新数学，也没有人拿它做研究。说得最好，类不过是一圈无害的表象光晕（Wang [1950]）；说得最坏则要出事。若允许集合存在公理带上约束类变量（如蒯因 [1951a] 1940 年第一版），那么全体“真正（‘外部地’）良序的”全序（即没有无最小元之子类者）就会成为集合。于是撞上布拉利-福尔蒂悖论（Rosser [1942]）。数学家中间至今还偶尔流传 NF 不一致的谣言，大概就源于对这一结果的误传；可这结果本身只关乎 ML，跟 NF 的一致性毫不相干。截至本文写作，Randall Holmes 与 Sky Wilshaw 似乎已用一个相当复杂的 Fraenkel-Mostowski 构造证明了 NF 的一致性（Holmes & Wilshaw 2024，见其他网络资源）。该证明已在 Lean 中检验通过（见 Wilshaw m.s.［其他网络资源］）。
