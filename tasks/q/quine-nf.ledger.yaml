      As we have seen, implementing mathematical objects (ZF-style) as wellfounded sets and then reasoning about those wellfounded sets) is not a very satisfactory way to proceed, since NF does not have sufficient strength for us to manipulate the implemented objects with the freedom we want. The situation with the endogenous interpretation (mathematical objects as global equivalence classes) is potentially more satisfactory. In this scenario cardinals are implemented as equivalence classes under equipollence and are (big) sets. The collection of all cardinals is a set. Ordinals can be handled similarly: ordinals are (big) sets and the collection of all ordinals is a (big) set; the collection of all groups is a set, the collection of all rings is a set; …. Being big, these sets cannot be manipulated in the freewheeling way that small sets can be. (The axiom of scheme of (full, unstratified) separation fails for big sets: if it didn’t then the Russell class would be $\{x \in V: x \not\in x\})$ and their manipulation is complicated by the appearance on the scene of various analogues of the $T$ function (that we saw in connection with the cardinals) that are needed to work round the stratification constraints. However, it is most striking that this doesn’t turn out to be much of a problem. On the whole, ordinary mathematics seems to be what the Computer Scientists call *strongly typed*, and to a large extent the stratification constraints of NF coincide with the endogenous strong typing of the mathematical objects being implemented. Sadly there is no space here for a proper discussion of this deep and interesting question.
    step1: |-
      如我们所见，把数学对象（ZF 式地）实现为良基集合、再对这些良基集合进行推理，并不是令人满意的做法，因为 NF 没有足够强度让我们按想要的自由度操作这些被实现的对象。内生解释（数学对象作为全局等价类）的情形可能更令人满意。在这一图景中，基数被实现为等势下的等价类，并且是（大）集合。所有基数之汇集是集合。序数可类似处理：序数是（大）集合，所有序数之汇集是（大）集合；所有群之汇集是集合，所有环之汇集是集合；……。由于是大集合，这些集合不能像小集合那样自由操作。（完全的、不分层的分离公理图式对大集合失效：若不失效，罗素类就会是 $\{x \in V: x \not\in x\})$，而且它们的操作因 $T$ 函数（我们在基数那里见过）的各种类似物登场而变得复杂，用它们来绕过分层约束。然而最引人注目的是，这结果并不构成多大问题。总体上，普通数学似乎是计算机科学家所说的*强类型的*，而在很大程度上，NF 的分层约束与被实现数学对象的内生强类型相吻合。遗憾的是，此处没有篇幅来恰当讨论这个深刻而有趣的问题。
    step2: |-
      正如我们所见，把数学对象（按 ZF 的路数）实现为良基集合，再对着这些良基集合做推理，并不怎么令人满意：NF 的强度不够，没法让我们随意摆弄那些实现出来的对象。内生解释——把数学对象当作全局等价类——的局面可能更好些。在这种图景里，基数实现为等势之下的等价类，并且是（大）集合；全体基数之汇集也是集合。序数亦可照办：序数是（大）集合，全体序数之汇集是（大）集合；全体群之汇集是集合，全体环之汇集是集合；……。既然是大集合，就不能像小集合那样撒开了摆弄。（完全的、不分层的分离公理图式对大集合失灵——若不失灵，罗素类就成了 $\{x \in V: x \not\in x\})$；而且摆弄它们时，还得应付 $T$ 函数的各种类似物（我们在基数那里见过）来绕过分层约束。）可最扎眼的是，结果这并不算多大麻烦。总的来看，普通数学似乎正是计算机科学家所谓 *strongly typed* 的东西；而在很大程度上，NF 的分层约束与被实现数学对象自身的内生强类型恰好重合。可惜此处没有篇幅细谈这个既深又有趣的问题。
