      Boffa [1988] noticed another consistency proof of NFU. If $\langle V, \in \rangle$ is a model of $Z$ (Zermelo set theory) with an external automorphism $\sigma$ and an ordinal $\kappa$ such that $\kappa \rangle \sigma(\kappa)$, then $V_{\kappa}$ is the domain of a model of *NFU* whose membership relation is

      $$ \{\langle x, y\rangle : \sigma(x) \in y \amp \varrho(y) \le \sigma(\kappa) + 1\}. $$
    step1: |-
      Boffa [1988] 注意到了 NFU 的另一个一致性证明。若 $\langle V, \in \rangle$ 是 $Z$（策梅洛集合论）的一个模型，带外部自同构 $\sigma$ 与序数 $\kappa$，使得 $\kappa \rangle \sigma(\kappa)$，则 $V_{\kappa}$ 是 *NFU* 一个模型的域，其属于关系为

      $$ \{\langle x, y\rangle : \sigma(x) \in y \amp \varrho(y) \le \sigma(\kappa) + 1\}. $$
    step2: |-
      Boffa [1988] 又发现了 NFU 的一个一致性证明。设 $\langle V, \in \rangle$ 是 $Z$（策梅洛集合论）的模型，带有外部自同构 $\sigma$ 以及满足 $\kappa \rangle \sigma(\kappa)$ 的序数 $\kappa$；那么 $V_{\kappa}$ 就是一个 *NFU* 模型的域，其属于关系为

      $$ \{\langle x, y\rangle : \sigma(x) \in y \amp \varrho(y) \le \sigma(\kappa) + 1\}. $$
