      ## 2. Wellfoundedness and ZF
    step1: |-
      ## 2. 良基性与 ZF
    step2: |-
      ## 2 良基性与 ZF
  - id: 16
    kind: body
    source: |-
      The axioms of ZF are motivated by the second point of view – in fact by a very specific school of it: the view that the key is not mere *noncircularity* of $\in$ but *wellfoundedness*. A set $x$ is *wellfounded* if there are no infinite sequences $\ldots x_n \in x_{n-1} \in \ldots x_3 \in x_2 \in x_1$. The axioms of ZF can usefully be thought of as arising from an attempt to axiomatise the theory of wellfounded sets. This project has been so successful that nowadays many people believe that wellfounded sets are the only kind of set there is – if it isn’t wellfounded it isn’t a set but a *hyperset* perhaps. This idea is a modern rewriting of history: Set theory did not *start* with the idea that all sets should be wellfounded (had it done so, the axiom scheme of naïve comprehension would never have been entertained!) The idea that we should admit a candidate set as a genuine set only if promises to be wellfounded is an overreaction to the uncontroversial observation that the suspect collections that feature in the paradoxes (the universe, the Russell class, …) are all flagrantly illfounded, or at least would be if they existed. It is easy to jump from this insight to the conclusion that wellfoundedness of $\in$ is the only thing that matters. The result of this jump is ZF set theory.
    step1: |-
      ZF 的公理由第二种观点激发——事实上是由其中非常特殊的一派激发：这一派认为，关键不在于 $\in$ 的单纯*非循环性*，而在于*良基性*。集合 $x$ 是*良基的*，如果不存在无穷序列 $\ldots x_n \in x_{n-1} \in \ldots x_3 \in x_2 \in x_1$。把 ZF 的公理看作源于为良基集合的理论建立公理化的尝试，是有益的。这个方案如此成功，以至于如今许多人相信良基集合是唯一存在的集合——如果它不是良基的，它就不是集合，而也许是*超集合*。这个观念是对历史的现代改写：集合论并不是*开始*于一切集合都应当良基这一想法（倘若如此，朴素概括的公理图式就根本不会被考虑！）只有当一个候选集合有望是良基的时候，我们才应把它承认为真正的集合——这一想法是对一个无争议观察的过度反应：悖论中出现的那些可疑总体（全集、罗素类……）都公然地非良基，或者至少如果它们存在的话会如此。从这一洞见跳到“$\in$ 的良基性是唯一要紧的东西”这一结论，是很容易的。这一跳的结果就是 ZF 集合论。
    step2: |-
      ZF 的公理出自第二种观点——而且出自其中很特殊的一派：这一派认为，关键不是 $\in$ 的单纯*非循环性*，而是*良基性*。一个集合 $x$ 是*良基的*，当且仅当不存在无穷序列 $\ldots x_n \in x_{n-1} \in \ldots x_3 \in x_2 \in x_1$。不妨把 ZF 的公理看成一次尝试的结果：为良基集合的理论建立公理化。这个方案太成功了，以致今天许多人相信良基集合是唯一的集合——不良基的就不是集合，顶多是*超集合*。这个想法其实是在现代重写历史：集合论并非*始于*“一切集合都应当良基”这一观念（真是那样，朴素概括的公理图式就压根不会被考虑！）只有可望良基的候选集合才算真正的集合——这种想法是对一个无争议观察的过度反应：悖论中那些可疑总体（全集、罗素类……）都公然不良基，至少若存在的话会如此。从这个观察一跃而为“$\in$ 的良基性是唯一要紧的东西”，很容易；这一跃的结果，就是 ZF 集合论。
