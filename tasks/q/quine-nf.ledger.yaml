      The second major development was Scott’s [1962] application of Rieger-Bernays independence methods to NF. If $\langle X, E\rangle$ is a binary structure with $E$ an extensional relation on $X$ (so that $\langle X, E\rangle$ is a model of a set theory of some kind) and $\pi$ is a permutation of $X$, then $\{\langle x, \pi(y)\rangle : \langle x, y\rangle \in E\}$ is also an extensional relation on $X$ and gives us a new model of some kind of set theory. If certain constraints are respected, this method outputs models of ZF when given models of ZF (and was first invented in order to prove the independence of the axiom of foundation from the other axioms of ZF) but it works even better with NF, since the construction preserves stratified formulæ.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      The third major development came when Specker (in [1958] and [1962]) placed the narrative in Quine [1937a] recounted above on a firm mathematical footing. (For an illustrated translation, with commentary, of Specker [1958], see Specker [1958 (2018)] in the Other Internet Resources section below.) We’ve seen that $\Phi^+$ is the result of raising all the type subscripts on all variables in $\Phi$ by one. Then $\Phi \leftrightarrow \Phi^+$ is an *axiom of typical ambiguity*. Specker established that the consistency of NF is equivalent to the consistency of TST + the scheme of all axioms of typical ambiguity. This reduction of the consistency question of NF to the consistency of TST + the axiom scheme of typical ambiguity clarifies matters but doesn’t actually solve anything, since the axioms of typical ambiguity turn out to be quite strong – as are their analogues in other languages (such as geometry) that admit endomorphisms. Notice that the mere fact that if $\phi$ is provable then so is $\phi^+$ is not enough to ensure that $\phi \rightarrow \phi^+$ is provable, so the axioms of typical ambiguity are *prima facie* nontrivial and we should not be surprised that they turn out to be strong.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Kaye [1991] generalised Specker’s method to show how any typed theory of sets, garnished with the axioms of typical ambiguity, turns out to be equiconsistent with a one-sorted theory. Various weak fragments of NF can be shown consistent by this kind of analysis. Oswald ([1976], [1981] and [1982]) introduced a notation according to which $NF_n$ is the system axiomatised by the $n$-stratified axioms of NF, and $N_n F$ is extensionality plus the existence of $\{x : \phi(x)\}$ where $\phi$ is $n$-stratified (parameters are allowed). Oswald showed that

      $$ N_1 F \subseteq NF_2 \subseteq N_2 F \subseteq NF_3 \subseteq N_3 F = \mathrm{NF} $$
    step1: TBD
    step2: TBD
