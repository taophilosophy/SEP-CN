    source: |-
      together with *stratified comprehension*, which is to say all universal closures of formulæ like

      $$ \exists x\forall y(y \in x \leftrightarrow \Phi) $$
    step1: |-
      以及*分层概括*，也就是说，所有如下形式的公式的全称闭包：

      $$ \exists x\forall y(y \in x \leftrightarrow \Phi) $$
    step2: |-
      再加上*分层概括*：所有形如下式的公式，其全称闭包都算作公理：

      $$ \exists x\forall y(y \in x \leftrightarrow \Phi) $$
