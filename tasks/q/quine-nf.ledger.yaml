      where ‘$x$’ is not free in $\Phi$ and $\Phi$ is (weakly) stratified. This last condition requires that there should be a function $\sigma$ (a “stratification”) from the **bound** variables in $\Phi$ to an initial segment of the natural numbers such that if ‘$u \in v$’ is a subformula of $\Phi$ then $\sigma(`v\rsquo) = \sigma(`u\rsquo) + 1$ and if $`u = v\rsquo$ is a subformula of $\Phi$ then $\sigma(`v\rsquo) = \sigma(`u\rsquo)$. The origins of this constraint will be explained below.
    step1: |-
      其中 ‘$x$’ 在 $\Phi$ 中不自由出现，且 $\Phi$ 是（弱）分层的。后一条件要求：存在一个从 $\Phi$ 的**约束**变量到自然数的一个初始段的函数 $\sigma$（一个“分层”），使得若 ‘$u \in v$’ 是 $\Phi$ 的子公式，则 $\sigma(`v\rsquo) = \sigma(`u\rsquo) + 1$；若 $`u = v\rsquo$ 是 $\Phi$ 的子公式，则 $\sigma(`v\rsquo) = \sigma(`u\rsquo)$。这一约束的来历将在下文说明。
    step2: |-
      这里 ‘$x$’ 在 $\Phi$ 中不自由出现，而 $\Phi$ 是（弱）分层的。后一条件的意思是：存在一个函数 $\sigma$（即一个“分层”），它把 $\Phi$ 中 **约束** 变量映到自然数的一个初始段上，并且满足——若 ‘$u \in v$’ 是 $\Phi$ 的子公式，则 $\sigma(`v\rsquo) = \sigma(`u\rsquo) + 1$；若 $`u = v\rsquo$ 是 $\Phi$ 的子公式，则 $\sigma(`v\rsquo) = \sigma(`u\rsquo)$。这一约束从何而来，下文自有交代。
  - id: 4
    kind: body
    source: |-
      Some illustrations may help: $x \in x$ is not stratified. $x \in y$ is. Thus not every substitution-instance of a stratified formula is stratified. $y = \wp(x)$ is stratified (the fancy P means power set), with the variable $y$ being given a type one higher than the type given to $x$. To check this we have to write out ‘$y = \wp(x)$’ in primitive notation. (In primitive notation, this formula becomes: $\forall z(z \in y \leftrightarrow \forall w(w \in z \rightarrow w \in x))$. One can assign 0 to $w, 1$ to $z$, and 2 to $x$, to get a stratification of this formula.) In general it is always necessary to write a formula out in primitive notation – at least until one gets the hang of it.
    step1: |-
      举几个例子或许有用：$x \in x$ 不是分层的；$x \in y$ 是分层的。因此，并非分层公式的每个代入实例都是分层的。$y = \wp(x)$ 是分层的（那个花体的 P 表示幂集），其中变量 $y$ 被赋予比 $x$ 高一的类型。为了核对这一点，我们必须把 ‘$y = \wp(x)$’ 按原始记法写出来。（在原始记法中，这个公式变成：$\forall z(z \in y \leftrightarrow \forall w(w \in z \rightarrow w \in x))$。给 $w$ 赋 0、给 $z$ 赋 1、给 $x$ 赋 2，就得到该公式的一个分层。）一般说来，总有必要把公式按原始记法写出来——至少在你熟练之前是这样。
    step2: |-
      看几个例子就明白了：$x \in x$ 不可分层，$x \in y$ 可以分层。可见，分层公式的代入实例未必仍然分层。$y = \wp(x)$ 是分层的（花体 P 指幂集），此时变量 $y$ 的类型比 $x$ 高一。要核对这一点，得先把 ‘$y = \wp(x)$’ 写成原始记法。（写成原始记法后，该公式为：$\forall z(z \in y \leftrightarrow \forall w(w \in z \rightarrow w \in x))$。给 $w$ 赋 0、$z$ 赋 1、$x$ 赋 2，便得到它的一个分层。）一般说来，总得把公式还原成原始记法——至少在你熟练之前是这样。
  - id: 5
    kind: body
    source: |-
      The observant reader will have spotted the appearance above of the expression *weakly stratified*. What is this? The instance of the comprehension that says that $x \cup \{y\}$ always exists is stratified, and is therefore an axiom. So $x \cup \{y\}$ always exists. So $x \cup \{x\}$ always exists, by substitution. However the instance of the comprehension scheme alleging its existence is not stratified. The term ‘$x \cup \{x\}$’ is said to be *weakly stratified* by which it is meant that it can be stratified if we are allowed to give different types to distinct occurrences of *free* variables. Weak stratification is what is needed to admit *ab initio* those instances of the comprehension scheme that give us substitution instances of stratified instances, and not require a *detour* such as the *detour* here through the existence of $x \cup \{y\}$.
    step1: |-
      细心的读者会注意到，上文出现了*弱分层*这个说法。它是什么？概括图式中那个断言 $x \cup \{y\}$ 总是存在的实例是分层的，因而是一条公理。所以 $x \cup \{y\}$ 总是存在；于是由代入，$x \cup \{x\}$ 总是存在。然而，断言其存在的那个概括图式实例并不是分层的。表达式 ‘$x \cup \{x\}$’ 被说成是*弱分层*的，意思是：只要允许给*自由*变量的不同出现赋予不同的类型，它就能被分层。之所以需要弱分层，是为了从一开始就接纳那些给出分层实例之代入实例的概括图式实例，而不必绕道——例如绕道 $x \cup \{y\}$ 的存在。
    step2: |-
      细心的读者已经注意到上文出现过 **弱分层** 一词。这是什么意思？概括图式里有一条实例断言 $x \cup \{y\}$ 总是存在，它是分层的，因而是公理。于是 $x \cup \{y\}$ 总是存在，再由代入，$x \cup \{x\}$ 也总是存在。但那个断言其存在的概括图式实例本身并不分层。人们把 ‘$x \cup \{x\}$’ 称为 **弱分层** 的，意思是：如果允许给 **自由** 变量的不同出现指派不同的类型，它就能分层。弱分层之所以必要，是为了从一开始就接收那些给分层实例提供代入实例的概括图式实例，而不必绕道——比如绕道 $x \cup \{y\}$ 的存在。
  - id: 6
    kind: body
    source: |-
      The notion of weak stratification looms large when we examine NF using sequent calculus or natural deduction. These disciplines have a notion of *subformula*, and the appropriate notion of subformula where stratification is concerned has the effect that not every subformula of a stratified formula is stratified, but every subformula of a *weakly* stratified formula is weakly stratified. The idea of a weakly stratified formula is due to Crabbé (1975).
    step1: |-
      当我们用矢列演算或自然演绎考察 NF 时，弱分层的概念就显得要紧。这两门学科都有*子公式*概念；而在分层问题上，恰当的子公式概念会造成这样的结果：分层公式的并非每个子公式都分层，但*弱*分层公式的每个子公式都是弱分层的。弱分层公式的想法出自 Crabbé（1975）。
    step2: |-
      用矢列演算或自然演绎来考察 NF，弱分层这一概念就变得吃重。这两门学科都讲 **子公式**，而用于分层的子公式概念会带来一个后果：分层公式的子公式未必分层，**弱** 分层公式的子公式却一定弱分层。弱分层公式的想法来自 Crabbé（1975）。
