      The conception of set underlying NF arises from a related – indeed complementary – oversimplification. ZF arises from the belief that if we enforce a kind of wellfoundedness in the constitution of set then all will be well. NF arises ultimately from the idea that all will be well if we enforce a kind of wellfoundedness (or at least noncircularity) in the *description* of sets. This concern can take two forms: One might feel uneasy about conjuring up a set by means of a spell that invokes other sets that are in some sense “not yet” available (sets of which the candidate will turn out to be a member, for example). This is a mathematically fruitful concern (keyword “predicativity”) and it will reappear later in the study of NF (and in ZF too, of course) but it is not this first form that gives rise to the axiomatisation of NF. In the second view, the key to neutralising the dangers of self-reference lies in segregating sets into pairwise disjoint levels called *types*. (That this concern is orthogonal to the first kind of concern can be shown by consideration of the axiom of sumset. This is a legitimate axiom from the second point of view, even though the spell that conjures $\bigcup X$ does it by invoking the set $X$, which is of higher type.)
    step1: |-
      支撑 NF 的集合构想来自一种相关——其实是互补——的过度简化。ZF 来自这样的信念：只要我们在集合的构成中强制某种良基性，一切都会好。NF 最终来自这样的想法：只要我们在集合的*描述*中强制某种良基性（或至少非循环性），一切都会好。这种关切可以采取两种形式：一种是对用咒语凭空造出集合感到不安，而这咒语会召来某些在某种意义上“尚未”可用的集合（例如，候选集合后来会被表明是其成员的那些集合）。这是一种在数学上有成果的关切（关键词是“直谓性”），它稍后会在 NF 的研究中重现（当然在 ZF 中也会），但并不是这第一种形式催生了 NF 的公理化。在第二种看法中，中和自指危险的关键在于把集合隔离成两两不相交的层级，称为*类型*。（这种关切与第一种关切正交，这可以由并集公理看出。从第二种观点看，并集公理是一条合法的公理，尽管召来 $\bigcup X$ 的咒语是通过召唤集合 $X$ 来做到这一点的，而这个集合具有更高的类型。）
    step2: |-
      支撑 NF 的集合构想，来自一种与之相关——其实互补——的过度简化。ZF 的信念是：只要在集合的构成上强制某种良基性，万事大吉。NF 归根结底则相信：只要在集合的*描述*上强制某种良基性（或至少非循环性），万事大吉。这种关切有两种形态。其一，人们会对用咒语凭空变出集合感到不安，因为咒语召来的某些集合在某种意义上“尚未”可用（比如候选集合日后会被证明是其成员的那些集合）。这种关切在数学上颇有收获（关键词是“直谓性”），后文讨论 NF 时还会再现（ZF 中当然也会），但催生 NF 公理化的并不是这第一种形态。在第二种看法里，化解自指危险的关键，是把集合隔离进两两不相交的层级，即*类型*。（这种关切与第一种正交，看看并集公理便知：从第二种观点看，并集公理完全合法，尽管召来 $\bigcup X$ 的咒语要召唤集合 $X$，而这个集合的类型更高。）
