      ZF arose as an attempt to axiomatise the theory of wellfounded sets, and this principle is kept constantly in mind by the ZF-istes as they struggle to find new and more informative axioms. In contrast, the syntactic version of the noncircularity insight (which is the one that underlies NF) has been a much less fertile source of axioms for its offspring. Most new axioms for NF are either versions of AC or postulates of smooth behaviour by the $T$ functions. It may be more natural to compare/contrast NF with Zermelo set theory rather than with ZF(C); Zermelo was a first attempt at formalising a theory of sets-of-ordinary-mathematics; it took a few decades for it to become clear that we needed the pack of axioms to include the axiom scheme of replacement, and it could be argued that NF should be analogously augmented with axioms such as the axiom of counting (which says that the singleton function restricted to the natural numbers is a set), or with the axiom of choice for wellfounded sets.
    step1: |-
      ZF 起源于把良基集合的理论公理化的尝试，ZF 派在苦苦寻找新的、信息更丰富的公理时，始终把这一原则放在心上。相比之下，非循环性洞见的句法版本（即支撑 NF 的那个版本）对其后代而言，一直是远不丰产的公理来源。NF 的大多数新公理要么是 AC 的各种版本，要么是关于 $T$ 函数行为平顺的设定。把 NF 与策梅洛集合论而非与 ZF(C) 作比较／对照也许更自然；策梅洛是形式化普通数学集合论的最初尝试；过了几十年才看清，我们需要的那套公理应当包含替换公理图式；也可以主张，NF 应当类似地以计数公理（它说限制在自然数上的单元素函数是集合）或良基集合的选择公理来加强。
