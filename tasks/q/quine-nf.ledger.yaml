      However if we try instead to prove that $\{\{x\} : x \in X\}$ cannot be mapped onto $\wp(X)$ we find that the diagonal set is defined by a stratified condition and exists, so the proof succeeds. This tells us that we cannot prove that $\lvert X\rvert = \lvert \{\{x\} : x \in X\}\rvert$ for arbitrary $X$: graphs of restrictions of the singleton function tend not to exist. If they did, we would be able to prove Cantor’s theorem in full generality. This gives rise to an endomorphism $T$ on cardinals, where $T\lvert X\rvert =_{df} \lvert \{\{x\} : x \in X\}\rvert$. $T$ misbehaves in connection with the sets that in NF studies we call *big* (as opposed to *large*, as in *large cardinals* (in ZF)). These are the collections like the universal set, and the set of all cardinals and the set of all ordinals: collections denoted by expressions which in ZF-like theories will pick out proper classes. If $\lvert X\rvert = \lvert \{\{x\} : x \in X\}\rvert$ we say that $X$ is *cantorian*. If the singleton function restricted to $X$ exists, we say that $X$ is *strongly cantorian*. Sets whose sizes are concrete natural numbers are strongly cantorian. IN (the set of Frege natural numbers) is cantorian, but the assertion that it is strongly cantorian implies the consistency of NF.
    step1: |-
      然而，如果我们改而证明 $\{\{x\} : x \in X\}$ 不能满射到 $\wp(X)$ 上，就会发现对角集由一个分层的条件定义，因而存在，证明于是成功。这告诉我们，对任意的 $X$，我们证不出 $\lvert X\rvert = \lvert \{\{x\} : x \in X\}\rvert$：单元素函数之限制的图往往不存在。若它们存在，我们就能完全一般地证明康托尔定理。这就产生基数上的一个自同态 $T$，其中 $T\lvert X\rvert =_{df} \lvert \{\{x\} : x \in X\}\rvert$。在 NF 研究中称为*大*（big，以区别于大基数意义上的 large）的那些集合上，$T$ 行为失常。这类集合就是全集、所有基数之集、所有序数之集之类：凡在类 ZF 理论中会挑出真类的表达式所指称的汇集。若 $\lvert X\rvert = \lvert \{\{x\} : x \in X\}\rvert$，我们就说 $X$ 是*康托尔的*。若限制在 $X$ 上的单元素函数存在，我们就说 $X$ 是*强康托尔的*。大小为具体自然数的集合是强康托尔的。IN（弗雷格自然数之集）是康托尔的，但断言它是强康托尔的，会蕴涵 NF 的一致性。
