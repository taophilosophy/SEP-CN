      This view of set theory gave rise to the Theory of Types. In the Theory of Types (as simplified successively by Ramsey, Carnap, Gödel and Quine) the bottom type is a collection of atoms. Atoms are non-sets (dormice, teapots, anything you please) with no internal structure visible to the set theory. Thereafter type $n + 1$ is simply the power set of type $n$, and there is a type for each natural number. The process cannot be extended to give transfinite types, since the types (being formally disjoint) are not cumulative so there is no sensible way to define a $\omega$th type. NF arises from a consideration of the syntax used to describe structures of this kind, and the syntax requires more careful handling. A first-order language for describing structures of this sort has infinitely many suites of variables, one suite for each type, and a membership symbol (‘$\in$’ as usual) which can be placed only between variables of consecutive types: ‘$x_n \in y_{n+1}$’ is wellformed but ‘$x_n \in y_n$’ is not. The equality sign can be placed only between variables of the *same* type.
    step1: |-
      这种集合观催生了类型论。在类型论中（经拉姆齐、卡尔纳普、哥德尔和蒯因相继简化），最底层的类型是一个原子的集合。原子是非集合（睡鼠、茶壶，随你喜欢），没有集合论可见的内部结构。此后，类型 $n + 1$ 就是类型 $n$ 的幂集，每个自然数都有一个类型。这个过程无法推广到超穷类型，因为各类型（形式上不相交）不是累积的，所以没有合理的方式定义第 $\omega$ 个类型。NF 来自对描述此类结构的句法的考察，而这种句法需要更细致的处理。一门描述此类结构的一阶语言有无穷多组变元，每个类型一组，还有一个属于符号（照例是‘$\in$’），它只能置于相邻类型的变元之间：‘$x_n \in y_{n+1}$’ 是合式的，而 ‘$x_n \in y_n$’ 不是。等号只能置于*同一*类型的变元之间。
    step2: |-
      这种集合观孕育了类型论。在类型论中（经拉姆齐、卡尔纳普、哥德尔、蒯因相继简化），最底层的类型是一堆原子。原子不是集合（睡鼠、茶壶，什么都行），在集合论看来没有内部结构。再往上，类型 $n + 1$ 就是类型 $n$ 的幂集，每个自然数对应一个类型。这个过程无法延伸到超穷类型：各类型在形式上互不相交，并不累积，因此没有合理的办法定义第 $\omega$ 个类型。NF 源自对描述这类结构所用句法的考察，而句法在这里需要更仔细的对待。描述这类结构的一阶语言拥有无穷多组变元（每个类型一组），外加一个属于符号（照例写作‘$\in$’），它只能放在相邻类型的变元之间：‘$x_n \in y_{n+1}$’ 合式，‘$x_n \in y_n$’ 不合式。等号则只能放在 **同一** 类型的变元之间。
