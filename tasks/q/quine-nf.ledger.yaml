  - id: 54
    kind: body
    source: |-
      is an example of a stratified theorem of first-order logic that has stratified proofs but no stratified cut-free proofs. Crabbé [1991], [1994] has given two proofs of the fact that SF (NF with extensionality dropped altogether) admits cut-elimination. The connections with type theory make constructive versions of NF an obvious target for investigation, but nothing publishable has emerged so far. The only known proof (Specker’s) of the axiom of infinity in NF has too little constructive content to allow a demonstration that *i*NF (NF with a constructive instead of classical ambient logic) admits an implementation of Heyting arithmetic. *i*NF proves that the universe is not (Kuratowski)-finite; so every finite set has nonempty complement. However, in order to interpret Heyting Arithmetic we need every finite set to have *inhabited* complement. Opinion is divided on whether or not this apparent gap tells us that *i*NF is significantly weaker than NF.
