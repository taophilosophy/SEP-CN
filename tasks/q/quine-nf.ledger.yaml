    kind: body
    source: |-
      $(\varrho$ is set-theoretic rank.) Remarkably, as Holmes showed, one can even recover from this model of NFU the nonstandard model of ZF that gave rise to it. He does this by exploiting the idea of set pictures. We saw earlier the idea that set theory is the theory of one extensional binary relation (with equality of course: extensionality cannot be defined in a language without equality). Thus one could say that a set (or, better, a *set picture*) is a isomorphism class of binary structures consisting of a domain, an extensional binary relation, and a designated element of the carrier set. Relational structures of this kind look like transitive closures of sets and the designated element of the domain indicates the set whose transitive closure is being depicted. (Consequently there is an accessibility condition for the designated element: if one thinks of the extensional relation as a graph, there must be a directed path from any element to the designated element).
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Although it was Aczel’s [1988] book that made the idea of Accessible Pointed Graph common currency, the idea goes back at least to Hinnion’s Ph.D. thesis [1974] and in a less developed form to Specker’s (unpublished) *Habilitationsschrift* and quite possibly earlier. Aczel used this technique to provide models of Forti-Honsell’s antifoundation axiom [1983]; Hinnion’s idea was to use isomorphism classes of *wellfounded* pointed extensional relational types to interpret theories of wellfounded sets in NF. With wellfounded extensional relations one does not need to make the pointing explicit, since the wellfoundedness ensures that at most one element of the carrier set can satisfy the accessibility condition. (This is not so in general: the two sets $x = \{y\}$; $y = \{x, \varnothing \}$ have set pictures that have the same binary relation but different pointing.) In NFU each set picture is a set (a big set, as it happens) and Holmes showed that in a model arising *à la Boffa* the set pictures reproduce the sets of the original nonstandard model. This striking phenomenon – which has no parallel in the study of NF – justifies Holmes’ dictum that “NFU can be understood as the theory of certain nonstandard models of Zermelo-style set theory with automorphisms.”
    step1: TBD
    step2: TBD
