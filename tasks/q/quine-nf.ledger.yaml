      也许一个具体例子会有帮助。让我们试着证明康托尔定理。用*reductio ad absurdum*证明不存在满射 $f : X \to \wp(X)$ 的关键一步，是构造对角集 $\{x \in X : x \not\in f(x)\}$。该证明依赖于这个对象是集合；只要 “$x \in X \amp x \not\in f(x) \amp f : X \rightarrow \wp(X)$” 分层，它就是集合。而这又取决于 “$\exists y[y \in \wp(X) \amp \langle y, x\rangle \in f \amp f : X \rightarrow \wp(X)]$” 是否分层。它*并不*分层，因为 “$\langle y, x\rangle \in f$” 迫使 ‘$x$’ 与 ‘$y$’ 取相同类型，而 “$f : X \rightarrow \wp(X)$” 又迫使 ‘$y$’ 取比 ‘$x$’ 高一级的类型。缘故在于我们有子公式 ‘$x \in X$’ 与 ‘$y \subseteq X$’。请注意，我们无需知道 ‘$f$’ 的类型比其变目的类型高一级、两级还是三级……就能得出这个令人沮丧的结论。我们证不出康托尔定理。
