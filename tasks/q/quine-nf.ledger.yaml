      So NF refutes AC. However – so far – it seems that (apart from some weird weak formulations that make no sense outside an NF context and which all arise from refinements of Specker’s proof) it is only *full* AC that fails, so that some strong consequences of AC remain on the cards for the moment. In particular, no-one has refuted the prime ideal theorem or countable choice or DC. Further, it is striking that all known failures of AC involve big sets. An axiom saying that all wellfounded sets are wellordered might – for all we know – be consistent with NF. In particular there is no reason to suppose that NF refutes the weak forms of AC needed in the study of the reals and complexes (“Analysis”). Indeed as far as we know we can safely add to NF some axioms to say that the wellfounded sets form a model of ZFC. According to this view, NF does not so much contradict ZFC as cover extra topics, such as the universal set – phenomena about which ZF has nothing to say. This underpins the view held by both Church and Quine, albeit in different ways, that a synthesis of ZFC and NF could be obtained along these lines.
