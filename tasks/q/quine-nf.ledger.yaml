      The third major development came when Specker (in [1958] and [1962]) placed the narrative in Quine [1937a] recounted above on a firm mathematical footing. (For an illustrated translation, with commentary, of Specker [1958], see Specker [1958 (2018)] in the Other Internet Resources section below.) We’ve seen that $\Phi^+$ is the result of raising all the type subscripts on all variables in $\Phi$ by one. Then $\Phi \leftrightarrow \Phi^+$ is an *axiom of typical ambiguity*. Specker established that the consistency of NF is equivalent to the consistency of TST + the scheme of all axioms of typical ambiguity. This reduction of the consistency question of NF to the consistency of TST + the axiom scheme of typical ambiguity clarifies matters but doesn’t actually solve anything, since the axioms of typical ambiguity turn out to be quite strong – as are their analogues in other languages (such as geometry) that admit endomorphisms. Notice that the mere fact that if $\phi$ is provable then so is $\phi^+$ is not enough to ensure that $\phi \rightarrow \phi^+$ is provable, so the axioms of typical ambiguity are *prima facie* nontrivial and we should not be surprised that they turn out to be strong.
    step1: |-
      第三个重大进展是斯佩克（在 [1958] 与 [1962] 中）把上文叙述的蒯因 [1937a] 中的故事置于坚实的数学基础之上。（关于斯佩克 [1958] 的带注释图解译本，见下文其他网络资源部分的斯佩克 [1958 (2018)]。）我们已经看到，$\Phi^+$ 是把 $\Phi$ 中所有变量的类型下标提升一格所得的结果。那么 $\Phi \leftrightarrow \Phi^+$ 就是一条*典型歧义公理*。斯佩克确立：NF 的一致性等价于 TST 加全部典型歧义公理图式的一致性。这一归约澄清了事情，却并未真正解决任何问题，因为典型歧义公理结果相当强——其他容许自同态的语言（如几何）中的类似物也一样。请注意，仅仅“若 $\phi$ 可证则 $\phi^+$ 也可证”这一事实，不足以保证 $\phi \rightarrow \phi^+$ 可证，所以典型歧义公理*初看之下*并非平凡，它们结果很强也就不足为奇了。
    step2: |-
      第三个重大进展是斯佩克（[1958] 与 [1962]）把上文讲述的蒯因 [1937a] 那段故事安放在坚实的数学基础之上。（斯佩克 [1958] 的带评注图解译本，见下文其他网络资源中的斯佩克 [1958 (2018)]。）我们已经知道，$\Phi^+$ 就是把 $\Phi$ 中所有变量的类型下标提升一级。于是 $\Phi \leftrightarrow \Phi^+$ 便是 **典型歧义公理**。斯佩克确立：NF 的一致性等价于 TST 加上全部典型歧义公理图式的一致性。这把 NF 的一致性问题归结为 TST 加典型歧义公理图式的一致性，事情是说清楚了，可并没有真正解决什么。原因在于：这些公理结果相当强；其他容许自同态的语言（例如几何）里的对应物也一样强。请注意：仅仅“$\phi$ 可证则 $\phi^+$ 亦可证”这一事实，并不足以保证 $\phi \rightarrow \phi^+$ 可证；所以典型歧义公理乍看之下并不平凡，它们结果很强，也不必大惊小怪。
