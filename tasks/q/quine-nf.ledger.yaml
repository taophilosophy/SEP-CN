    source: |-
      The current status of NF studies is uncertain. It now seems clear beyond all peradventure than NF is consistent, and consistent relative to some fairly weak system like Zermelo. What is not clear is what the effect of this will be on the direction of the study of sets. Hitherto it has been possible to defend restricting one’s attention to the study of wellfounded sets, on the grounds that they had an obvious motivation and that the theory of a universal set was of questionable coherence. That restriction will henceforth look a bit one-eyed. What the reaction will be of generations yet to come, who will grow up knowing that NF is consistent, is yet to be seen. It may well be that the way the stratification of NF meshes neatly with the endogenous strong typing of mathematics will be felt to be a reason for studying NF. We shall see.
