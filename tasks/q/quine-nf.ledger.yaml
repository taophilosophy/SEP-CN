      $(\varrho$ is set-theoretic rank.) Remarkably, as Holmes showed, one can even recover from this model of NFU the nonstandard model of ZF that gave rise to it. He does this by exploiting the idea of set pictures. We saw earlier the idea that set theory is the theory of one extensional binary relation (with equality of course: extensionality cannot be defined in a language without equality). Thus one could say that a set (or, better, a *set picture*) is a isomorphism class of binary structures consisting of a domain, an extensional binary relation, and a designated element of the carrier set. Relational structures of this kind look like transitive closures of sets and the designated element of the domain indicates the set whose transitive closure is being depicted. (Consequently there is an accessibility condition for the designated element: if one thinks of the extensional relation as a graph, there must be a directed path from any element to the designated element).
    step1: |-
      $(\varrho$ 是集合论秩。）值得注意的是，正如 Holmes 所表明的，人们甚至可以从这个 NFU 模型恢复出产生它的 ZF 的非标准模型。他的做法是利用集合图像的想法。我们前面已经看到这样的想法：集合论是关于一个外延二元关系的理论（当然还带相等：外延性无法在没有相等的语言中定义）。因此可以说，一个集合（或者更好地说，一个集合图像）是由域、外延二元关系以及载体集的一个指定元素所组成的二元结构的同构类。这类关系结构看起来像集合的传递闭包，而域中的指定元素指明其传递闭包正在被描绘的那个集合。（因此对指定元素有一个可达性条件：若把外延关系看作图，则从任何元素到指定元素都必须有有向路径。）
