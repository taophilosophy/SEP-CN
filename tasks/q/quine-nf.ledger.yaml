      ## 6. Implementation of Mathematical Concepts in NF
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      To the extent that mathematical concepts can be implemented in the theory of wellfounded sets (*aka* ZF) they can also be interpreted in NF – since NF has a theory of wellfounded sets. However this is not the way in which we routinely interpret mathematics in NF since the interpreting formulæ are unstratified and unwieldy: extra axioms are needed. For example, the Von Neumann implementation of natural numbers tries to tell us that the collection of natural numbers is not the extension of a stratified formula, so it cannot be expected to be a set. By the same token, ordinary functions from the naturals to the naturals can fail to have extensions that are sets. Instead we trade on the fact that NF (and NFU too) admits a natural implementation of various kinds of mathematical entities as *global isomorphism classes* – which will of course be big sets (qv). The natural number $n$ is implemented as the set of all $n$-membered sets: this is the Frege implementation used also in TST. Rosser [1953a] uses NF instead of ZF as a foundation for presenting ordinary mathematics (and to this day remains the only book to do so, though Holmes [1998] uses NFU for this purpose).
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      As we have seen, implementing mathematical objects (ZF-style) as wellfounded sets and then reasoning about those wellfounded sets) is not a very satisfactory way to proceed, since NF does not have sufficient strength for us to manipulate the implemented objects with the freedom we want. The situation with the endogenous interpretation (mathematical objects as global equivalence classes) is potentially more satisfactory. In this scenario cardinals are implemented as equivalence classes under equipollence and are (big) sets. The collection of all cardinals is a set. Ordinals can be handled similarly: ordinals are (big) sets and the collection of all ordinals is a (big) set; the collection of all groups is a set, the collection of all rings is a set; …. Being big, these sets cannot be manipulated in the freewheeling way that small sets can be. (The axiom of scheme of (full, unstratified) separation fails for big sets: if it didn’t then the Russell class would be $\{x \in V: x \not\in x\})$ and their manipulation is complicated by the appearance on the scene of various analogues of the $T$ function (that we saw in connection with the cardinals) that are needed to work round the stratification constraints. However, it is most striking that this doesn’t turn out to be much of a problem. On the whole, ordinary mathematics seems to be what the Computer Scientists call *strongly typed*, and to a large extent the stratification constraints of NF coincide with the endogenous strong typing of the mathematical objects being implemented. Sadly there is no space here for a proper discussion of this deep and interesting question.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      However, the expression “Ordinary mathematics” is disputed turf. On another front there are logicians that are fond of making the point that some of the further reaches of large cardinal theory, routinely disregarded – and even disparaged – by many mathematicians nevertheless have implications for a kind of low-level mathematics whose core significance is not in dispute. Inevitably the question of the adequacy of NF for “Ordinary mathematics” will overlap with this debate. However there is a further complication to be considered. All these big collections that implement the collection of all cardinals (or of all ordinals etc.) are nevertheless sets, so there are questions arising from their sethood that we can ask about them, and some of these questions have no parallel in ZF. What is the cofinality of the wellordering of the ordinals? Can we map onto $V$ the set of those sets that do not map onto $V$? No doubt there will be people who say that these questions are not proper mathematical questions at all, but are mere pathological artefacts of a misconceived system of axioms. However, there is the intriguing possibility that answers to these questions could have implications for the study of the kind of small sets that appear in “ordinary mathematics”. No such implications have been found so far, but then no-one has looked very hard. We know of subclasses of the naturals definable by formulæ that have big sets as parameters, so we know where to start looking. It is tempting to speculate what the consequences might be for NF studies were any to be discovered.
