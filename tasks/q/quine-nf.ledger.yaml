      难的部分在于彻底理解分层。对于处于原始记法中的公式，有一条容易的经验法则：只要问自己，能否通过添加类型指称使该公式成为类型论的合式公式。当公式不再处于原始记法时，事情就难了，而读者很早就会遇到这些困难，因为有序对并不是集合论的概念。当一个公式含有 $f(x) = y$ 这样的子公式时，如何判定它是否分层？这里的技术／记法困难又一如往常地叠加在概念困难之上。答案是：当然必须先固定一种有序对的实现并坚持用它。这是否意味着——对于涉及有序对的公式——给定公式是否分层取决于如何实现有序对？答案是“是”，但情况并没有这么严重。有序对有种种标准定义，它们在 NF 中都合法，而且都令人满意，即都是“齐平”的或*homogeneous*的。它们都使公式 “$\langle x, y\rangle = z$” 分层，并给变量 $x$ 与 $y$ 相同的类型；$z$ 在多数情形下取更高的类型（绝不会更低）。高出多少取决于所用的有序对版本，但很少有公式在一种有序对版本下分层、在另一种下不分层，而这类公式全都病态得让人想起悖论。
