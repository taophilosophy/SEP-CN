      It turns out that unconditionally secure two-party bit commitment, based solely on the principles of quantum or classical mechanics (without exploiting special relativistic signaling constraints, or principles of general relativity or thermodynamics) is impossible. See Mayers 1997, Lo and Chau 1997 and Lo’s article “Quantum Cryptology” in Lo, Popescu, and Spiller 1998 for further discussion. (Kent 1999 has shown that one can implement a secure classical bit commitment protocol by exploiting relativistic signaling constraints in a timed sequence of communications between verifiably separated sites for both Alice and Bob.)[^kent-1999] Roughly, the impossibility arises because at any step in the protocol where either Alice or Bob is required to make a determinate choice (perform a measurement on a particle in the quantum channel, choose randomly and perhaps conditionally between a set of alternative actions to be implemented on the particle in the quantum channel, etc.), the choice can delayed by entangling one or more ancilla particles with the channel particle in an appropriate way. By suitable operations on the ancillas, the channel particle can be ‘steered’ so that this cheating strategy is undetectable. In effect, if Bob can obtain no information about the committed bit, then entanglement will allow Alice to ‘steer’ the bit to either 0 or 1 at will.
    step1: |-
      结果表明：只依据量子力学或经典力学的原理（不借助狭义相对论的信号传递约束，也不借助广义相对论或热力学的原理），无条件安全的两方比特承诺是不可能的。进一步讨论见 Mayers 1997、Lo and Chau 1997，以及 Lo 的“Quantum Cryptology”一文，收于 Lo, Popescu, and Spiller 1998。（Kent 1999 表明，通过在对爱丽丝与鲍勃双方均可验证地分离的站点之间进行定时通信序列，利用相对论性的信号传递约束，可以实施一个安全的经典比特承诺协议。）[^kent-1999] 粗略地说，这种不可能性之所以出现，是因为在协议中任何要求爱丽丝或鲍勃作出确定选择的步骤（对量子信道中的一个粒子进行测量，随机地、也许有条件地在一组要对量子信道中的粒子实施的不同行动之间作选择，等等），这个选择都可以通过以适当方式让一个或多个辅助粒子与信道粒子纠缠起来而被推迟。通过对辅助粒子作适当操作，信道粒子可以被“操控”，从而使这种作弊策略无法被发现。实际上，如果鲍勃无法获得关于所承诺比特的任何信息，那么纠缠就会让爱丽丝能够随意地把该比特“操控”成 0 或 1。
    step2: |-
      结果表明：仅仅依据量子力学或经典力学的原理（既不借狭义相对论的信号传递约束，也不借广义相对论或热力学原理），无条件安全的两方比特承诺是不可能的。进一步讨论见 Mayers 1997、Lo and Chau 1997，以及 Lo 的“Quantum Cryptology”，收于 Lo, Popescu, and Spiller 1998。（Kent 1999 表明：在对爱丽丝与鲍勃双方都可验证地分离的站点之间安排定时通信序列，利用相对论性的信号传递约束，就能实施一个安全的经典比特承诺协议。）[^kent-1999] 大略说来，不可能性出在这里：协议中凡要求爱丽丝或鲍勃作出确定选择的步骤（对量子信道中的某个粒子作测量，随机地、也许还是有条件地在若干要施加于该粒子的备选行动之间作选择，等等），这个选择都可以通过恰当地让一个或多个辅助粒子与信道粒子纠缠起来而推迟。再对辅助粒子作适当操作，信道粒子就能被“操控”，使这种作弊策略无法被识破。实际上，只要鲍勃得不到关于所承诺比特的任何信息，纠缠便能让爱丽丝随心所欲地把该比特“操控”成 0 或 1。
