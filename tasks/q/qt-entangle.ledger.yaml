      大多数物理学家把纠缠量子态那些令人困惑的特征，归因于爱因斯坦对物理理论不恰当的“超然观察者”观点，并把玻尔对 EPR 论证的回应（Bohr, 1935）视为捍卫了哥本哈根诠释。这很不幸，因为纠缠的研究被忽视了三十年，直到约翰·贝尔重新审视 EPR 论证（Bell, 1964）。贝尔考察的是比 EPR 例子更简单的系统中的纠缠：处于纠缠态的两个分离系统之间，二值动力学量——比如沿某个特定方向的偏振，或沿某个特定方向的自旋——之间的匹配关联。贝尔表明：对两个系统上适当选择的*不同*量作测量，其测量结果之间的统计关联，与一条可由爱因斯坦的可分离性和定域性假定推出的不等式相冲突——实际上就是与“这些关联有共同原因”这一假定推出的不等式相冲突。这条不等式现在被称为贝尔不等式，而各种相关的不等式都可以作为经典关联或共因关联的必要条件推导出来。
