      经典信息与量子信息的差异可以用来实现成功的密钥分发，但另有一些密码学协议恰恰被量子纠缠挡住了去路。比特承诺就是这样一个关键协议，它可作为子程序用于多种重要的密码学任务。在比特承诺协议里，爱丽丝交给鲍勃一个编码过的比特。该编码所含的信息应当不足以让鲍勃确定这个比特的取值；但若再加上进一步的信息（由爱丽丝在后续阶段、即她该揭示比特取值之时提供），就足以让鲍勃确信：这个协议不让爱丽丝有作弊的余地——她没法把比特编码成自己想揭示 0 就揭示 0、想揭示 1 就揭示 1 的样子。
