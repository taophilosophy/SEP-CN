      Bell’s investigation generated an ongoing debate on the foundations of quantum mechanics. One important feature of this debate was confirmation that entanglement can persist over long distances, thus falsifying Schrödinger’s supposition of the spontaneous decay of entanglement as two entangled particles separate. (Free space entanglement of photons has been demonstrated over a distance of 143 km and, using satellites to distribute entanglement, between locations more than 1200 km apart on earth. See Herbst *et al* 2014 and Yin *et al* 2017.)[^yin-2017] But it was not until the 1980s that physicists, computer scientists, and cryptologists began to regard the non-local correlations of entangled quantum states as a new kind of non-classical physical resource that could be exploited, rather than an embarrassment for quantum mechanics to be explained away. For a discussion of entanglement — what it is, why it is conceptually puzzling, and what you can do with it, including a simple proof of Bell’s theorem — see the graphic novel *Totally Random: Why Nobody Understands Quantum Mechanics (A Serious Comic on Entanglement)*, Bub and Bub 2018. For further discussion of entanglement as a physical resource, including measuring entanglement, and the manipulation and purification of entanglement by local operations, see “The Joy of Entanglement” by Popescu and Rohrlich in Lo, Popescu, and Spiller 1998, Bub 2016, and the classic Nielsen and Chuang 2011. Alain Aspect, John F. Clauser, and Anton Zeilinger were awared the 2022 Nobel Prize in physics for their pioneering experiments on entangled photons, validating Bell’s insight and initiating the field of quantum information.
