      贝尔的探究引发了一场关于量子力学基础的持续争论。这场争论的一个重要特征，是确认了纠缠能够在远距离上持续存在，从而否证了薛定谔的猜想：随着两个纠缠粒子分离，纠缠会自发衰变。（光子的自由空间纠缠已在 143 公里的距离上得到演示；利用卫星分发纠缠，已在地球上相距 1200 多公里的地点之间实现。见 Herbst *et al* 2014 与 Yin *et al* 2017。）[^yin-2017] 但直到 1980 年代，物理学家、计算机科学家和密码学家才开始把纠缠量子态的非定域关联看作一种可加利用的新非经典物理资源，而不是量子力学一处需要被解释掉的窘迫。关于纠缠的讨论——它是什么、为什么在概念上令人困惑、以及你能拿它做什么，包括贝尔定理的一个简单证明——见图像小说 *Totally Random: Why Nobody Understands Quantum Mechanics (A Serious Comic on Entanglement)*，Bub and Bub 2018。关于纠缠作为物理资源的进一步讨论，包括纠缠的测量、以及通过局部操作对纠缠的操控与纯化，见 Popescu 与 Rohrlich 的“The Joy of Entanglement”一文，收于 Lo, Popescu, and Spiller 1998、Bub 2016，以及经典的 Nielsen and Chuang 2011。阿兰·阿斯佩、约翰·F. 克劳泽与安东·蔡林格因其在纠缠光子上的开创性实验获得 2022 年诺贝尔物理学奖，这些实验验证了贝尔的洞见，并开创了量子信息领域。
