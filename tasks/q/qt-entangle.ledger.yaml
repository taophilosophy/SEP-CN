      > 从历史上看，基础物理学的很大一部分一直致力于发现自然的基本粒子，以及描述其运动与相互作用的方程。现在看来，另一项纲领可能同样重要：去发现自然以何种方式允许、又以何种方式阻止*信息*被表达和被操纵，而不只是粒子的运动。
