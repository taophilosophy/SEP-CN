      再想想薛定谔的那个洞见：纠缠态可以用来以某个概率把远处的粒子操控进一组状态中的某一个。事实上，这种“远程操控”的可能性比薛定谔所演示的还要引人注目。假设爱丽丝与鲍勃共享一个贝尔所考虑的那种纠缠纯态，比如说两个光子处于偏振的纠缠态，爱丽丝持有其中一个纠缠光子，鲍勃持有第二个成对的光子。假设爱丽丝收到一个额外的光子，处于未知的偏振态 $\ket{u}$，其中记号“$\ket{\ }$”表示一个量子态。爱丽丝有可能对她手中的两个光子实施某种操作，把鲍勃的光子转变成四个态中的一个，这取决于爱丽丝操作的四种可能（随机）结果：要么是态 $\ket{u}$，要么是某个以确定方式与 $\ket{u}$ 相关的态。爱丽丝的操作使她手中的两个光子纠缠，同时使鲍勃的光子解纠缠，把它操控进态 $\ket{u^*}$。在爱丽丝把她操作的结果告知鲍勃之后，鲍勃便知道要么 $\ket{u^*}$ = $\ket{u}$，要么知道如何通过局部操作把 $\ket{u^*}$ 变换为 $\ket{u}$。这种现象被称为“量子隐形传态”。在隐形传态程序之后，态 $\ket{u}$ 对爱丽丝和鲍勃来说仍然是未知的。
