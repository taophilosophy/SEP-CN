      这个现象非同寻常之处在于：爱丽丝与鲍勃设法把他们共享的纠缠态用作量子通信信道，在宇宙中爱丽丝所在的部分摧毁一个光子的态 $\ket{u}$，并在宇宙中鲍勃所在的部分把它重新创造出来。由于光子的线偏振态要求指定空间中的一个方向（一个可以连续变化的角的值），若没有共享的纠缠态，爱丽丝就必须向鲍勃传送无穷多的经典信息，鲍勃才能精确地重构态 $\ket{u}$。与一个二值选项（表示为 0 或 1，两个选项概率相等）相关联的经典信息的量，是一个二进制位，即“比特”。要用十进制指定一个任意的角，需要 0 到 9 之间的无穷数字序列；用二进制记号则需要 0 与 1 的无穷序列。爱丽丝操作的结果有四种可能结果，概率各为 1/4，可以由两个比特的经典信息来指定。值得注意的是，鲍勃仅凭爱丽丝告知的两个比特经典信息就能重构态 $\ket{u}$，这显然是把纠缠态用作量子通信信道来传递其余信息的结果。这个想法最早由 Bennett *et al* 于 1993 年提出。关于量子隐形传态的进一步讨论，见 Nielsen and Chuang 2011，或 Richard Josza 的“Quantum Information and its Properties”一文，收于 Lo, Popescu, and Spiller 1998。量子隐形传态已在地球上约 100 公里的距离上实现，并在地球与卫星之间 1400 公里的距离上实现（Zeilinger, 2018）。利用卫星传输纠缠光子来发展量子互联网，将依赖量子隐形传态。
