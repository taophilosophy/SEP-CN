      认为量子态描述物理实在的观点，有时被称为 $\psi$-本体论的，以区别于 $\psi$-认识论的的观点，即量子态表示能动者关于某个底层物理态的不完备信息。Harrigan & Spekkens（2010）最初定义这些术语时，只把它们用于他们所称的量子理论本体模型。但此后别人更宽泛地使用它们，以在本体论模型框架之外划分替代的量子态观点。QBists 与实用主义者并非唯一采取某种更宽泛意义上既非 $\psi$-本体论也非 $\psi$-认识论观点的人。另有一些观点共享实用主义的想法：量子态不是任何能动者实际认识状态的函数，因为量子态指派须符合客观正确性标准。本节介绍两种这样的观点。
