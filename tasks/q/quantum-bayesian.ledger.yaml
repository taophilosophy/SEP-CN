      His argument depends on results proved within the ontological models framework of Harrigan & Spekkens 2010. Myrvold defends this framework as merely codifying a form of reasoning implicit in much of science and daily life which there is no good reason to reject when applied in the quantum domain. One reasons that an action on a physical system affects what one will experience later only via the physical transmission of that action’s effect from the system to events one later experiences. If so, then the action of preparing a system’s quantum state must affect some physical property of the system reflected in what the framework calls its ontic state.
    step1: |-
      他的论证依赖 Harrigan & Spekkens 2010 本体论模型框架内证明的结果。Myrvold 为该框架辩护，认为它只是把科学和日常生活中大量隐含的推理方式加以编纂，而在量子领域应用它没有好理由拒绝。人们推理说：对物理系统的行动，只有通过该行动的效果从系统物理地传递到人后来所经验的事件，才会影响人后来经验到什么。若如此，那么制备系统量子态的行动必定影响该系统的某个物理性质，该性质反映在框架所称的其本体态中。
    step2: |-
      他的论证依赖 Harrigan & Spekkens 2010 本体论模型框架内已证的结论。Myrvold 为该框架辩护说：它只是把科学和日常生活中的大量隐含推理加以条理化；在量子领域应用它，没有好理由拒绝。推理是：作用于物理系统的行动，只有其效果从系统物理地传到人后来所经验的事件，才会影响人后来的经验。若然，制备系统量子态的行动就必定影响该系统某个物理性质，而该性质反映在框架所谓“本体态”之中。
