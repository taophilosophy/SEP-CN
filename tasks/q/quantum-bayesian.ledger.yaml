      QBists（Caves, Fuchs, & Schack 2007）拒绝这一等同，并通过否认这一前提来驳倒 EPR 关于量子描述不完备的论证。他们摒弃一切客观物理概率，而把概率 1 等同于能动者的主观确定性——对某一陈述或事件的完全相信，而一个同样知情、同样理性的能动者对它可能抱较低的置信，或者根本不信。
