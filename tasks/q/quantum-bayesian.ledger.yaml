      Instead, QBists Fuchs & Schack (2012) have viewed unitary evolution and decoherence as different conditions on an agent’s present assignment of a quantum state to a system following one contemplated measurement, when making decisions regarding the possible outcomes of a second measurement. As such, each functions as a normative synchronic coherence condition that may be seen as a consequence of van Fraassen’s (1984) Reflection Principle. Instead of taking decoherence to select possible outcomes of a physical measurement process, QBists take these to be just whatever experiences may follow the agent’s action on the world. DeBrota, Fuchs & Schack (2024) give a unified QBist account of quantum dynamics and decoherence.
    step1: |-
      反之，QBists Fuchs & Schack（2012）把幺正演化与退相干视为能动者在考虑过一次测量之后、就第二次测量的可能结果作决定时，对其当下量子态指派的两种不同条件。如此，二者各自充当一条规范性的同时性融贯条件，可视为范·弗拉森（1984）反思原则的推论。QBists 不把退相干看作选出一次物理测量过程的可能结果，而把这些结果看作能动者作用于世界之后可能随之而来的任何经验。DeBrota, Fuchs & Schack（2024）给出了 QBism 关于量子动力学与退相干的统一说明。
    step2: |-
      反之，QBists Fuchs & Schack（2012）把幺正演化与退相干视为：能动者在考虑过一次测量之后、为就第二次测量的可能结果作决定而指派当下量子态时，所要满足的两种不同条件。如此，二者各为一条规范性的同时性融贯条件，可视作范·弗拉森（1984）反思原则的推论。QBists 不认为退相干选出的是某个物理测量过程的结果，而认为这些结果就是能动者作用于世界后可能随之而来的一切经验。DeBrota, Fuchs & Schack（2024）给出了 QBism 关于量子动力学与退相干的统一说明。
