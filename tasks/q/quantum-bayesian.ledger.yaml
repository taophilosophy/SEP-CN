      DP is pragmatist, or more precisely neopragmatist (see Gert 2023, entry on pragmatism §1.2)[^gert-2023] in several respects. It prioritizes use over representation in its general approach to quantum theory; its account of probability and causation is pragmatist, in quantum theory and elsewhere; and it rests on a theory of content that Brandom (2000) calls inferentialist pragmatism. While not endorsing any pragmatist identification of truth with “what works”, in its deflationary approach to truth and representation it follows the contemporary pragmatist Huw Price (2003, 2011). Healey (2020) argues for a conception of realism according to which this pragmatist approach is realist rather than anti-realist.
    step1: |-
      DP 在若干方面是实用主义的，或更确切地说是新实用主义的（见 Gert 2023，pragmatism 词条 §1.2）[^gert-2023]。它在其量子理论总进路中把使用置于表征之先；它对概率与因果的说明在量子理论和其他领域都是实用主义的；它依托一种布兰顿（2000）称为推论主义实用主义的内容理论。它虽不赞同任何把真理等同于“行之有效”的实用主义做法，但在其对真理与表征的紧缩论进路中，追随当代实用主义者 Huw Price（2003, 2011）。Healey（2020）论证一种实在论概念，按之这种实用主义进路是实在论的而非反实在论的。
    step2: |-
      DP 在几方面是实用主义的，更确切地说是新实用主义的（见 Gert 2023，“实用主义”词条 §1.2）[^gert-2023]。它在其量子理论总进路中把使用置于表征之先；它对概率与因果的说明，无论在量子理论还是别处都属实用主义；它还依托一种布兰顿（2000）称为“推论主义实用主义”的内容理论。它并不赞同任何把真理等同于“行之有效”的实用主义做法；但在对真理与表征的紧缩论进路中，它追随当代实用主义者 Huw Price（2003, 2011）。Healey（2020）论证了一种实在论概念，按之这种实用主义进路是实在论的，而非反实在论的。
