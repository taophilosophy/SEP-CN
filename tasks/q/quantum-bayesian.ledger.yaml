      ## 1 QBism
  - id: 3
    kind: body
    source: |-
      Because the term ‘Bayesianism’ may be understood in many different ways, a variety of views of quantum theory could be considered Quantum-Bayesian. QBism is a form of Quantum Bayesianism that may be traced back to a point of view on states and probabilities in quantum theory adopted by C.M. Caves, C.A. Fuchs, and R. Schack (2002). In its more recent incarnation (Fuchs, Mermin, & Schack 2014) its proponents have adopted the name QBism for reasons discussed in §1.1. In deference to its contemporary proponents, this shorter name is used. Fuchs, Mermin, & Schack 2014, and DeBrota & Stacey 2019 [Other Internet Resources] provide elementary introductions to QBism; Fuchs & Schack 2015, and Fuchs & Stacey 2019 give more detailed summaries of the view; von Baeyer 2016 is a popular book-length introduction; Fuchs 2023, and Fuchs and Stacey 2025 [Other Internet Resources] offer updated restatements.
    step1: |-
      由于“贝叶斯主义”一词可以有多种理解，各种量子理论观点都可以算作量子贝叶斯。QBism 是量子贝叶斯主义的一种形态，可追溯到 C. M. Caves、C. A. Fuchs 与 R. Schack（2002）就量子理论中的态与概率所采取的观点。在其较晚近的形态中（Fuchs, Mermin, & Schack 2014），其倡导者采用了 QBism 这一名称，理由见 §1.1。为尊重其当代倡导者，本文使用这个较短的名称。Fuchs, Mermin, & Schack 2014 与 DeBrota & Stacey 2019 [Other Internet Resources] 提供 QBism 的入门导论；Fuchs & Schack 2015 与 Fuchs & Stacey 2019 给出更详细的概述；von Baeyer 2016 是篇幅如书的通俗导论；Fuchs 2023 与 Fuchs and Stacey 2025 [Other Internet Resources] 提供更新的重述。
    step2: |-
      “贝叶斯主义”一词可有多种理解，故不少量子理论观点都可算作量子贝叶斯。QBism 是量子贝叶斯主义的一种形态，源头是 C. M. Caves、C. A. Fuchs 与 R. Schack（2002）关于量子理论中态与概率的观点。在其晚近形态中（Fuchs, Mermin, & Schack 2014），倡导者采用了 QBism 这一名号，缘由见 §1.1。为尊重当代倡导者，本文沿用这一简称。入门导论见 Fuchs, Mermin, & Schack 2014 与 DeBrota & Stacey 2019 [Other Internet Resources]；较详的概述见 Fuchs & Schack 2015 与 Fuchs & Stacey 2019；von Baeyer 2016 是通俗的整书导论；更新的重述见 Fuchs 2023 与 Fuchs and Stacey 2025 [Other Internet Resources]。
  - id: 4
    kind: body
    source: |-
      QBists maintain that rather than (either directly or indirectly) representing a physical system, a quantum state represents the epistemic state of the one who assigns it concerning that agent’s possible future experiences. It does this by specifying the agent’s coherent degree of belief (credence) in each of a variety of alternative experiences that may result from a specific act the agent may perform. To get an idea of the kinds of experience and act the QBist has in mind it is helpful to think of the possible outcomes of a quantum measurement on a physical system. But QBists have proposed the extension of the view to encompass *every* experience that may result from *any* action (Fuchs, Mermin, and Schack 2014; Mermin 2017)[^mermin-2017].
    step1: |-
      QBists 主张，量子态不是（无论直接还是间接地）表示一个物理系统，而是表示指派它的能动者关于该能动者未来可能经验的认识状态。它通过规定能动者对可能由某特定行动引起的各种替代经验的融贯置信度（credence）来做到这一点。要领会 QBist 心中所想的那类经验与行动，可以设想对一个物理系统作量子测量的可能结果。但 QBists 提出把这一观点扩展到涵盖由任何行动引起的每一个经验（Fuchs, Mermin, and Schack 2014; Mermin 2017）[^mermin-2017]。
    step2: |-
      QBists 主张：量子态并不（直接或间接地）表示某一物理系统，它表示的是指派者关于自己未来可能经验的认识状态。其办法是：对能动者某一特定行动可能带来的种种替代经验，规定该能动者的融贯置信度。要领会 QBists 所指的经验与行动，可以设想一次量子测量对一个物理系统的可能结果。但 QBists 主张把这一观点扩展至由任何行动引起的一切经验（Fuchs, Mermin, and Schack 2014; Mermin 2017）[^mermin-2017]。
  - id: 5
    kind: body
    source: |-
      As quantum theory is usually presented, the Born Rule provides an algorithm for generating probabilities for alternative outcomes of a measurement of one or more observables on a quantum system. These probabilities have traditionally been regarded as objective, in line with the idea that the theory is irreducibly indeterministic.
    step1: |-
      按量子理论通常的表述，玻恩规则给出一种算法，用于为一个量子系统上一个或多个可观测量的测量之替代结果生成概率。这些概率传统上被视为客观的，与理论不可约地非决定论这一观念相符。
    step2: |-
      量子理论通常的表述是：玻恩规则提供一种算法，为一个量子系统上一个或多个可观测量的测量生成各种结果的概率。这些概率历来被视为客观的，与“理论不可约地非决定论”这一看法相合。
  - id: 6
    kind: body
    source: |-
      By contrast, QBists hold a subjective Bayesian or personalist view of quantum probabilities (see entry on interpretations of probability). Taking a quantum state merely to provide input to the Born Rule specifying these probabilities, they regard quantum state assignments as equally subjective. The quantum state assigned by an agent then provides a convenient representation of an important part of his or her own overall state of belief. So quantum theory as a whole is “a users’ manual that any agent can pick up and use to help make wiser decisions in this world of inherent uncertainty” (Fuchs 2010: 8), Other Internet Resources).
    step1: |-
      相反，QBists 对量子概率持主观贝叶斯主义或个人主义的观点（见 probability 的解释词条）。他们把量子态仅仅视为玻恩规则的输入，以规定这些概率，因此同样把量子态指派视为主观的。能动者所指派的量子态，于是为她自己整体信念状态的一个重要部分提供了便利的表示。因此，整个量子理论是“一本用户手册，任何能动者都可以拿起来使用，以在这个固有不确定的世界中作出更明智的决定”（Fuchs 2010: 8，Other Internet Resources）。
    step2: |-
      相反，QBists 对量子概率持主观贝叶斯主义或个人主义观点（见“概率的解释”词条）。他们把量子态只看作玻恩规则的输入，用来规定这些概率，因而把量子态指派也视为主观的。能动者所指派的量子态，便为她自身整体信念状态的一个重要部分提供了便利表示。于是整个量子理论有如“一本用户手册，任何能动者都可拿来使用，以在这个固有不确定的世界里作出更明智的决定”（Fuchs 2010: 8，Other Internet Resources）。
  - id: 7
    kind: body
    source: |-
      QBists argue that from this point of view quantum theory faces no conceptual problems associated with measurement or non-locality. While QBism has implications for the nature of physical science, from this point of view quantum theory has few if any *direct* implications for the nature of physical reality.
    step1: |-
      QBists 论证，从这个观点看，量子理论不面临任何与测量或非定域性相关的概念问题。虽然 QBism 对物理科学的性质有所蕴涵，但从此观点看，量子理论对物理实在的性质鲜有、乃至没有任何*直接*蕴涵。
    step2: |-
      QBists 论证：由此观点看，量子理论与测量、非定域性相关的概念难题一概不复存在。QBism 对物理科学的性质固然有所蕴涵，但就此观点而言，量子理论对物理实在的性质殊少——乃至并无——**直接的**蕴涵。
