      Most people take it for granted that a competently performed quantum measurement procedure has a unique, objective outcome.[^note-5] QBists deny this, assimilating a measurement outcome to an agent’s personal experience—including her experience of another agent’s verbal report of his outcome. QBists take a measurement outcome to be personal to the agent whose action elicited it. This tenet is key both to QBist denial that quantum phenomena involve any nonlocal influence (Fuchs, Mermin & Schack 2014)[^mermin-2014] and to the QBist (DeBrota, Fuchs & Schack 2020) resolution of the paradox of Wigner’s friend (see the entry on Everett’s relative-state formulation of quantum mechanics). But their notions of experience and agency are broad enough to encompass personal experiences of agents other than individual, conscious humans.
