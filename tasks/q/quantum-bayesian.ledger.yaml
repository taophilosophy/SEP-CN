      While QBists follow de Finetti in taking all probabilities to be credences of actual agents, DP takes probabilities to exist independently of the existence of agents but not to be physical propensities or frequencies, nor even to supervene on Lewis’s Humean mosaic (see entry on David Lewis §5). There are probabilities insofar as probability statements are objectively true, which they may be when sensitive to though not determined by physical facts.
    step1: |-
      QBists 随德·菲内蒂把所有概率理解为实际能动者的置信度；DP 则认为概率独立于能动者的存在而存在，但既非物理倾向，也非频率，甚至不随附于刘易斯的休谟式拼图（见 David Lewis 词条 §5）。概率存在，只要概率陈述客观为真；当它们敏感于（虽不由之决定）物理事实时，便可能客观为真。
    step2: |-
      QBists 随德·菲内蒂，把所有概率都当作实际能动者的置信度；DP 则认为概率独立于能动者之存在而存在，但既非物理倾向，也非频率，甚至不随附于刘易斯的休谟式拼图（见“大卫·刘易斯”词条 §5）。概率之存在，在于概率陈述客观为真；当这些陈述敏感于（虽不由之决定）物理事实时，便可能客观为真。
  - id: 113
    kind: body
    source: |-
      There is no measurement problem since reassignment of quantum state on measurement is not a physical process but corresponds to relativization of that state to a different physical situation from which additional information has become physically accessible to a hypothetical agent so situated. QBists contend that measurement is the central concept of quantum theory, and that measurement outcomes are just personal experiences for an agent gambling upon them. But according to DP a measurement outcome is an objective physical fact, accessible to any agents there might be; and a precise formulation of quantum theory may be given with no reference to agents and no use of a term like “measurement”.
    step1: |-
      没有测量问题，因为测量时量子态的重新指派不是一个物理过程，而对应着把该态相对于另一物理情境来理解——从那一情境，额外的信息对一个如此定位的假设能动者变得物理上可及。QBists 主张测量是量子理论的核心概念，而测量结果只是能动者在其上下注的个人经验。但按 DP，测量结果是客观物理事实，任何可能存在的能动者都可及；并且，量子理论的精确表述可以给出，而不提及能动者，也不使用“测量”之类的术语。
    step2: |-
      这里没有测量问题：测量时重新指派量子态并非物理过程，而是把该态相对于另一物理情境来相对化——从那个情境看，额外信息对一个如此定位的假设能动者已在物理上可及。QBists 主张，测量是量子理论的核心概念，测量结果不过是能动者下注时的个人经验。按 DP 则不然：测量结果是客观物理事实，任何可能存在的能动者都可及；而且，量子理论的精确表述可以不提能动者，也不用“测量”这类术语。
