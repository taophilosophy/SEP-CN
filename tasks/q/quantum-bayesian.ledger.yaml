      Quantum models of environmental decoherence are commonly thought to provide such an account (see entry on the role of decoherence in quantum mechanics). These typically involve the Schrödinger equation, specifying the unitary dynamical evolution of the *total* quantum state of a system in interaction with its quantum environment. The application can show how interactions entangle the quantum states of system and environment in a way that selects a “pointer basis” in which the system’s own reduced (mixed) state remains very nearly diagonal indefinitely. Somehow a particular element of this basis is supposed to be identifiable as the system’s physical state, evolving in a way that approximates classical dynamics.
    step1: |-
      环境退相干的量子模型常被认为提供了这样的说明（见 decoherence 在量子力学中的作用词条）。这些模型通常涉及薛定谔方程，规定一个与其量子环境相互作用的系统的*总体*量子态之幺正动力学演化。其应用可以表明，相互作用如何以某种方式纠缠系统与环境的量子态，从而选出一个“指针基”，在该基下系统自身的约化（混合）态无限期地几乎保持对角。这个基的某个特定要素理当被认定为系统的物理态，并以近似经典动力学的方式演化。
