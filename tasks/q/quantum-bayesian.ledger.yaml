      多数人想当然地认为，一次称职施行的量子测量程序有唯一、客观的结果。[^note-5] QBists 否认这一点，把测量结果同化于能动者的个人经验——包括她对另一能动者关于其结果之口头报告的经验。QBists 认为测量结果对引起它的能动者是个人性的。这一信条既是 QBist 否认量子现象涉及任何非定域影响（Fuchs, Mermin & Schack 2014）[^mermin-2014] 的关键，也是 QBist（DeBrota, Fuchs & Schack 2020）解决维格纳朋友悖论（见 Everett 的相对态表述词条）的关键。但他们的经验与能动性概念足够宽，可以涵盖个体有意识人类之外的能动者的个人经验。
