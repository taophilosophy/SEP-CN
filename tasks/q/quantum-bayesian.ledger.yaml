      Most QBists are physicists rather than philosophers. But Fuchs locates QBism in the tradition of classical American pragmatism (see entry on pragmatism). While quoting Peirce and referring to Dewey, Fuchs (2011; 2016 [Other Internet Resources]) acknowledges especially the influence of William James’s ideas of pure experience and an open and pluralistic universe in which “new being comes in local spots and patches which add themselves or stay away at random, independently of the rest” (2016: 9 [Other Internet Resources]). Mermin’s CBist introduction of the “Now” into physics and Fuchs’s choice of title for his 2014 [Other Internet Resources] both show affinity with James’s reaction against what he called the block-universe (see entry being and becoming in modern physics). Moreover, they both credit the influence on QBism of Niels Bohr. Bohr himself never acknowledged pragmatist influences on his view of quantum theory. But in a late interview[^note-6] he expressed enthusiasm for James’s conception of consciousness, and he was almost certainly acquainted with some of James’s ideas by the Danish philosopher Høffding, a friend and admirer of James.
    step1: |-
      多数 QBists 是物理学家而非哲学家。但 Fuchs 把 QBism 定位在古典美国实用主义传统中（见 pragmatism 词条）。他引用皮尔士、提及杜威，尤其承认威廉·詹姆斯关于纯粹经验、以及关于一个开放而多元的宇宙的观念之影响——在这个宇宙中，“新的存在在当地的小点和斑块中出现，它们自行加入或随机离开，独立于其余”（2016: 9 [Other Internet Resources]）。Mermin 的 CBist 把“现在”引入物理学，与 Fuchs 为他 2014 年 [Other Internet Resources] 所选题名，都显示出与詹姆斯对其所谓“块状宇宙”之反应的亲近（见 being and becoming in modern physics 词条）。此外，二者都归功于尼尔斯·玻尔对 QBism 的影响。玻尔本人从未承认实用主义对其量子理论观的影响。但在一次晚年访谈[^note-6]中，他对詹姆斯的意识概念表示热情，且他几乎肯定通过丹麦哲学家赫夫丁（詹姆斯的朋友与仰慕者）接触过詹姆斯的一些想法。
