  - id: 116
    kind: body
    source: |-
      On Healey’s desert pragmatist approach, an application of the Born rule directly specifies probabilities for claims about the values of physical magnitudes (dynamical variables of classical physics as well as new variables such as strangeness and flavor): it does not explicitly specify probabilities for measurement outcomes. But the Born rule is legitimately applied only to claims with sufficiently well-defined content. The content of a claim about the value of a physical magnitude on a system depends on how the system interacts with its environment. Quantum theory may be used to model (but not to describe) such interaction. Only if a system’s quantum state is then stably decohered in some basis (see entry on the role of decoherence in quantum mechanics) do claims about the value of the associated “pointer magnitude” acquire a sufficiently well-defined content to license application of the Born rule to them. Because of this restriction on its legitimate application, the Born rule may be consistently applied to claims of this form (not just to claims about the outcomes of measurements) without running afoul of no-go results such as that of Kochen and Specker (see entry on the Kochen-Specker theorem).
    step1: |-
      按 Healey 的荒漠实用主义进路，应用玻恩规则直接规定关于物理量值（经典物理的动力学变量，以及奇异数、味之类的新变量）的主张的概率：它并不明确规定测量结果的概率。但玻恩规则只可正当地应用于内容足够明确的主张。关于某系统某物理量值的主张，其内容取决于该系统如何与其环境相互作用。量子理论可以用来建模（而非描述）这种相互作用。只有当系统的量子态随后在某基下稳定退相干时（见 decoherence 在量子力学中之作用词条），关于相关“指针量”之值的主张才获得足够明确的内容，从而许可对之应用玻恩规则。由于这一对其正当应用的限制，玻恩规则可以一致地应用于这种形式的主张（不只是关于测量结果的主张），而不致与 Kochen 与 Specker 的不可行结果之类相冲突（见 Kochen-Specker 定理词条）。
    step2: |-
      按 Healey 的荒漠实用主义进路，应用玻恩规则直接规定关于物理量值之主张的概率——这些量包括经典物理的动力学变量，也包括奇异数、味之类的新变量；它并不明确规定测量结果的概率。但玻恩规则只能正当地用于内容足够明确的主张。关于某系统某物理量值的主张，其内容取决于该系统如何与环境相互作用；量子理论可用来建模（而非描述）这种相互作用。唯有当系统的量子态随后在某基下稳定退相干（见“退相干在量子力学中的作用”词条），关于相关“指针量”之值的主张才获得足够明确的内容，才许可对之应用玻恩规则。正因有这一正当性限制，玻恩规则才能一致地用于这种形式的主张（而不只是关于测量结果的主张），且不致与科亨-施佩克尔（Kochen-Specker）那类不可行结果相冲突（见“科亨-施佩克尔定理”词条）。
  - id: 117
    kind: body
    source: |-
      What endows a claim (e.g., about the value of a magnitude) with content is the web of inferences in which it is located. Such a claim has a well-defined content if many reliable inferences link it to other claims with well-defined content. It is the nature of a system’s interaction with its environment that determines which inferences to and from a magnitude claim about it are reliable. Quantum decoherence and inferentialist pragmatism work together here to make objective sense of the Born rule with no need to mention measurement: Though of course at some stage all actual measurements do involve interactions with an environment well modeled by quantum decoherence.
    step1: |-
      赋予一个主张（例如关于某量值的主张）以内容的，是它所处的推理之网。若有许多可靠的推理把它与内容明确的其他主张联系起来，该主张便有明确内容。系统与其环境相互作用的性质，决定了出入于关于该系统的量值主张的哪些推理是可靠的。量子退相干与推论主义实用主义在此协力，使玻恩规则获得客观意义，而无须提及测量：当然，在某个阶段，一切实际测量确实都涉及与环境的相互作用，而该环境可被量子退相干很好地建模。
    step2: |-
      赋予一个主张（如关于某量值的主张）以内容的，是它所处的推理之网。若有许多可靠推理把它与内容明确的其他主张相连，该主张便内容明确。系统与环境相互作用的性质，决定了出入于“关于该系统的量值主张”的哪些推理可靠。量子退相干与推论主义实用主义在此协同，使玻恩规则获得客观意义，而无须言及测量。当然，到了某一阶段，一切实际测量确实都涉及与环境的相互作用，而这一环境可由量子退相干很好地建模。
