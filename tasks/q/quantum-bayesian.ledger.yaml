      A QBist is convinced that an agent should take quantum mechanics as a guide for setting her subjective degrees of belief about the outcomes of future measurements. Myrvold (2020a,b) has used results of Pusey, Barrett and Rudolph 2012 and Barrett, Cavalcanti, Lal, & Maroney 2014 to argue that anyone with that conviction should also believe that preparations with which she associates distinct pure quantum states result in ontically distinct states of affairs, a conclusion that QBists reject.
    step1: |-
      QBist 确信，能动者应把量子力学当作设定其关于未来测量结果的主观置信度的指南。Myrvold（2020a,b）利用 Pusey, Barrett and Rudolph 2012 与 Barrett, Cavalcanti, Lal, & Maroney 2014 的结果论证：任何持此确信的人也应相信，她据以关联不同纯量子态的制备会导致本体上不同的事态——这是 QBists 拒绝的结论。
    step2: |-
      QBist 确信：能动者应把量子力学当作设定其关于未来测量结果之主观置信度的指南。Myrvold（2020a,b）借助 Pusey, Barrett and Rudolph 2012 与 Barrett, Cavalcanti, Lal, & Maroney 2014 的结果论证：凡持此确信者，也应相信她据以关联不同纯量子态的制备会产生本体上相异的事态——这一结论 QBists 拒绝接受。
