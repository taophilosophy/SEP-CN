      Born probabilities are neither credences nor frequencies. They are objective because they are authoritative. Setting credences equal to Born probabilities derived from the correct quantum state for anyone in that physical situation is a wise epistemic policy for an agent in a world like ours. Born probabilities are equally objective even when they differ more radically from Lewis’s (1986) chances because they are based on more (physically) limited information.
    step1: |-
      玻恩概率既不是置信度，也不是频率。它们客观，因为它们是权威性的。把来自正确量子态的玻恩概率设为置信度，对处于那种物理情境中的任何人来说，都是一种明智的认识政策。即便玻恩概率与刘易斯（1986）的机遇更为剧烈地不同，它们同样客观，因为它们基于更（物理上）有限的信息。
    step2: |-
      玻恩概率既非置信度，也非频率。它们之所以客观，因为它们具有权威性。对处于该物理情境中的任何人，把由正确量子态导出的玻恩概率设为置信度，都是明智的认识政策。即便玻恩概率与刘易斯（1986）的机遇差别更大，它们同样客观——因为它们所依据的（物理）信息更有限。
