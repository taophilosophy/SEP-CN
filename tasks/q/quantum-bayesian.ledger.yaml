    source: |-
      While QBists take quantum state assignments to be subject only to the demand that an agent’s degrees of belief be coherent and conform to Equation $(\ref{ex2})$, DP takes these to be answerable to the statistics of objective events, including (but not restricted to) outcomes of quantum measurements. This makes the objective existence of quantum states and measurement outcomes independent of that of agents, even though quantum states’ main function is as a source of good advice to any agents there happen to be. And it makes quantum states as well as measurement outcomes relative, not to the epistemic situation of actual agents, but to the physical situation of actual or merely hypothetical agents. The statistics of outcomes of our quantum measurements provide objective evidence for quantum theory even though each outcome is not absolute, but relative to an agent-situation. This is because the objectivity of such scientific data arises not through accurate representation of the physical world, but through the authority acquired by conforming to all tests performed by scientists, no matter how each is situated.
    step1: |-
      QBists 认为量子态指派只受这一要求约束：能动者的置信度须融贯并符合方程 $(\ref{ex2})$；DP 则认为这些指派须对客观事件的统计负责，包括（但不限于）量子测量的结果。这使量子态与测量结果的客观存在独立于能动者的存在，尽管量子态的主要功能是为恰好存在的任何能动者提供善策。这也使量子态与测量结果相对于实际或仅假设的能动者的物理情境，而非实际能动者的认识情境。我们量子测量结果的统计为量子理论提供客观证据，尽管每个结果都不是绝对的，而是相对于某一能动者情境。这是因为此类科学数据的客观性并非来自对物理世界的准确表征，而来自通过符合科学家所作的一切检验而获得的权威——无论每个科学家处于何种情境。
    step2: |-
      QBists 认为，量子态指派只受一条要求约束：能动者的置信度须融贯，并符合方程 $(\ref{ex2})$；DP 则认为，这些指派须向客观事件的统计负责，包括（但不限于）量子测量的结果。于是，量子态与测量结果的客观存在不依赖能动者的存在，尽管量子态的主要功能是为碰巧存在的任何能动者提供良策。并且，量子态与测量结果所相对的，不是实际能动者的认识情境，而是实际或仅属假设的能动者的物理情境。我们量子测量结果的统计为量子理论提供客观证据，尽管每个结果都非绝对，而是相对于某一能动者情境。原因在于：此类科学数据的客观性不来自对物理世界的准确表征，而来自“符合科学家所作的一切检验”所获得的权威——无论各人处于何种情境。
