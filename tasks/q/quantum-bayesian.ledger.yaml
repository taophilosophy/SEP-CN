      Their idea is that when the fiducial measurement is a SIC, $r(j\mathbin{|}i)$) encodes the agent’s belief about the type of measurement $M$, while $p(i)$ encodes his or her quantum state for the system on which this measurement is performed. They maintain that the Born Rule in this form is an empirically motivated addition to probability theory—a normative requirement of quantum Bayesian coherence (Fuchs & Schack 2013; DeBrota, Fuchs, Pienaar, & Stacey 2021)[^fuchs-2013] that supplements the usual coherence conditions on degrees of belief required to avoid a Dutch book (a set of bets an agent is guaranteed to lose, come what may).
    step1: |-
      他们的想法是：当基准测量是 SIC 时，$r(j\mathbin{|}i)$ 编码能动者关于测量 $M$ 类型的信念，而 $p(i)$ 编码他或她关于该测量所作用之系统的量子态。他们主张，这种形式的玻恩规则是概率论的有经验动机的补充——量子贝叶斯融贯性的一条规范要求（Fuchs & Schack 2013; DeBrota, Fuchs, Pienaar, & Stacey 2021）[^fuchs-2013]，它补充了避免荷兰书（一套能动者无论怎样都注定会输的赌注）所需的通常置信度融贯条件。
    step2: |-
      他们的构想是：基准测量若为 SIC，则 $r(j\mathbin{|}i)$ 编码能动者关于测量 $M$ 类型之信念，$p(i)$ 编码该能动者关于被测量系统的量子态。他们主张，这种形式的玻恩规则是对概率论的有经验动机的补充——量子贝叶斯融贯性的一条规范要求（Fuchs & Schack 2013; DeBrota, Fuchs, Pienaar, & Stacey 2021）[^fuchs-2013]，以补足为避免荷兰书（一套能动者无论如何都注定输的赌注）所需的通常置信度融贯条件。
