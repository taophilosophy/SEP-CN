    source: |-
      Quantum theory is fundamental to contemporary physics.[^note-1] It is natural to view a fundamental physical theory as describing or representing the physical world. But many physicists and some philosophers have questioned or rejected this view of quantum theory. They have viewed the theory as concerned with our observation and description of, knowledge or beliefs about, or interactions with the world. Views of this kind have been expressed since the 1920s when quantum theory emerged in close to its present form. This entry is concerned with more recent developments of this tradition by physicists and philosophers, much of it described as quantum-Bayesian or pragmatist. This entry discusses the form of quantum-Bayesianism known as QBism in section 1, addressing common objections in section 2. After section 3 briefly notes pragmatist influences on QBism section 4 sketches a variety of self-described pragmatist approaches to quantum theory, while section 5 mentions some related views.
    step1: |-
      量子理论是当代物理学的基石。[^note-1] 把一种基础物理理论看作对物理世界的描述或表征，是很自然的想法。但许多物理学家和部分哲学家质疑或拒绝了这种量子理论观。他们把理论看作关乎我们对世界的观察与描述、知识与信念，或与世界的相互作用。这类观点自 1920 年代量子理论以接近现今形态出现以来就有人提出。本词条关注物理学家与哲学家晚近对这一传统的发展，其中多被称为量子贝叶斯或实用主义。第 1 节讨论称为 QBism 的量子贝叶斯主义形态，第 2 节回应常见反对意见；第 3 节简述实用主义对 QBism 的影响，第 4 节概述若干自称实用主义的量子理论进路，第 5 节提及一些相关观点。
    step2: |-
      量子理论是当代物理学的基石。[^note-1] 人们自然会认为，一门基础物理理论描述或表征着物理世界。但不少物理学家和部分哲学家质疑、乃至拒斥这种量子理论观；他们着眼于我们对世界的观察与描述、知识与信念，或与世界的相互作用。这类观点自 1920 年代量子理论成形以来便已出现。本词条关注物理学家与哲学家晚近对这一传统的发展，其中多被称为量子贝叶斯或实用主义。第 1 节讨论量子贝叶斯主义的一种形态 QBism，第 2 节回应常见反对意见；第 3 节简述实用主义对 QBism 的影响；第 4 节概述若干自称实用主义的量子理论进路；第 5 节提及若干相关观点。
