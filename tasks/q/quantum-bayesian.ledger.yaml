      QBists (Caves, Fuchs, & Schack 2007) reject this identification and refute EPR’s argument that quantum description is incomplete by denying this premise. Eschewing all objective physical probabilities, they rather identify probability 1 with an agent’s subjective certainty—full belief in a statement or event that an equally well informed rational agent may believe to a lesser degree, or not at all.
