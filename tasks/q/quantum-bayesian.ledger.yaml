      So far Friederich’s therapeutic approach parallels desert pragmatism (though there are significant differences of detail, especially as regards their treatments of probability and causation). But Friederich rejects Healey’s inferentialist account of the content of claims about the values of physical magnitudes, taking restrictions on legitimate applications of the Born Rule to follow directly from the constitutive rules governing its use rather than from the need to apply it only to magnitude claims with well-defined content. And Friederich seriously explores the possibility that a set of magnitude claims collectively assigning a precise value to *all* dynamical variables may be not only meaningful but true together. His idea is that the constitutive rules governing the Born Rule may forbid any attempt to apply the rule in a way that would imply the existence of a non-contextual probability distribution over their possible values, thus avoiding conflict with no-go theorems like that of Kochen and Specker.
    step1: |-
      至此，Friederich 的治疗式进路与荒漠实用主义平行（尽管细节上有重大差异，尤其在概率与因果的处理上）。但 Friederich 拒绝 Healey 关于物理量值主张内容的推论主义说明，认为对玻恩规则正当应用的限制直接来自支配其使用的构成性规则，而非来自只把它用于内容明确的量值主张之需要。Friederich 还认真探索一种可能：一组量值主张若集体为*所有*动力学变量指派精确值，则不仅有意义，而且可以同真。他的想法是：支配玻恩规则的构成性规则可能禁止任何这样的应用尝试，即会蕴涵存在关于其可能值的非语境概率分布，从而避免与 Kochen 与 Specker 之类不可行定理冲突。
