      According to DP, there is no instantaneous action at a distance in a quantum world, despite the probabilistic counterfactual dependencies between space-like separated events such as (macroscopic) outcomes of measurements confirming violation of Bell inequalities. On a pragmatist approach, these dependencies admit no conceptual possibility of intervention on one outcome that would alter (any relevant probability of) the other. So there is no instantaneous non-local influence, in conformity to Einstein’s principle of local action.
    step1: |-
      按 DP，量子世界中不存在瞬时超距作用，尽管诸如（宏观）确认贝尔不等式被违反的测量结果之类类空分离事件之间，存在概率性的反事实依赖。按实用主义进路，这些依赖不容许一种概念上的可能性：对一个结果作干预会改变另一个结果的（任何相关概率）。因此不存在瞬时非定域影响，符合爱因斯坦的定域作用原理。
    step2: |-
      按 DP，量子世界中并无瞬时超距作用，尽管类空分离事件之间——例如确认贝尔不等式被违反的（宏观）测量结果之间——存在概率性的反事实依赖。按实用主义进路，这些依赖在概念上不容许“干预一个结果即可改变另一个结果的（相关）概率”这种可能。于是不存在瞬时非定域影响，合于爱因斯坦的定域作用原理。
