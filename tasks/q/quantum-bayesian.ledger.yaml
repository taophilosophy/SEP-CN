      Here and elsewhere (Schack 2023, DeBrota *et al*. 2024)[^debrota-2024] a QBist like Schack or Fuchs denies that *any* laws (whether deterministic or stochastic) mediated by an effect of their actions on the physical systems with which they interact govern the connection between an agent’s action and their subsequent experience of a measurement outcome. For a QBist, an agent can act rationally with no beliefs about any such hypothetical mediating effects. QBists take that action to participate with the agent’s external world in directly bringing the outcome into existence with no such mediation. Of course, this leaves them with the important unfinished business of explaining why the form of reasoning Myrvold codifies works as well as it does in more familiar applications.
    step1: |-
      在这里和其他地方（Schack 2023, DeBrota *et al*. 2024）[^debrota-2024]，像 Schack 或 Fuchs 这样的 QBist 都否认：*任何*定律（无论是决定论的还是随机论的），只要以能动者行动对与其相互作用的物理系统之效果为中介，就支配着能动者行动与其随后对测量结果的经验之间的联系。对 QBist 来说，能动者可以在对任何此类假设性中介效果毫无信念的情况下理性行动。QBists 认为，该行动与能动者的外部世界一道，直接使结果产生，而无需此类中介。当然，这给他们留下了一项重要的未竟事业：解释 Myrvold 所编纂的推理形式为何在更熟悉的应用中如此奏效。
    step2: |-
      在此处及其他地方（Schack 2023, DeBrota *et al*. 2024）[^debrota-2024]，Schack、Fuchs 这样的 QBist 都否认：**任何**定律（无论决定论还是随机论）支配能动者行动与其随后测量经验之间的联系——即便以行动对相互作用系统的效果为中介。对 QBist 而言，能动者可以在对这类假设性中介效果毫无信念的情况下理性行动。QBists 认为，行动与能动者的外部世界一道，直接使结果产生，无须此类中介。当然，这留下一个重要而未竟的任务：解释 Myrvold 所条理化的推理方式，为何在更熟悉的场合如此奏效。
