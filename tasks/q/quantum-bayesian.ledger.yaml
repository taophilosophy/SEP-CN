  - id: 12
    kind: body
    source: |-
      Applied to radioactive decay, the Born Rule of quantum theory is taken successfully to predict such things as the half-life of the first excited state of the hydrogen atom—that the probability that an atom of hydrogen in this state will be found to have decayed to the ground state after $1.1 \times 10^{-9}$ seconds (i.e., just over a billionth of a second) is ½. This prediction has been experimentally confirmed by measuring how the frequency with which photons are emitted by a large number of hydrogen atoms in the decay of this excited state decreases over time. Most physicists regard this and other probabilities predicted by quantum theory as objective physical features of the world, typically identifying the probability of decay with the relative frequency of decay as measured in such an experiment.
    step1: |-
      应用于放射性衰变时，量子理论的玻恩规则被认为成功预测了诸如氢原子第一激发态的寿命：处于该态的氢原子在 $1.1 \times 10^{-9}$ 秒（即略多于十亿分之一秒）后被发现在基态的概率为 ½。这一预言已通过测量大量处于该激发态衰变的氢原子发射光子的频率如何随时间下降而得到实验证实。多数物理学家把这一概率以及量子理论所预言的其他概率视为世界的客观物理特征，通常把衰变概率等同于此类实验中测得的衰变相对频率。
    step2: |-
      用于放射性衰变时，量子理论的玻恩规则被认为能成功预言氢原子第一激发态的寿命之类：处于该态的氢原子，在 $1.1 \times 10^{-9}$ 秒（略多于十亿分之一秒）之后被发现在基态的概率为 ½。此预言已获实验证实：测量大量处于该激发态衰变的氢原子，看其光子发射频率如何随时间下降。多数物理学家把这一概率以及量子理论预言的其他概率当作世界的客观物理特征，通常将衰变概率等同于此类实验测得的相对频率。
  - id: 13
    kind: body
    source: |-
      But there are strong reasons not to equate probability with any actual relative frequency (see entry interpretations of probability, §3.4). Many philosophers, including Karl Popper (1967) and David Lewis (1986), have taken Born probabilities instead to exemplify a distinctive kind of objective property (propensity or chance, respectively) that may be ascribed to actual or possible individual events. Lewis took quantum indeterminism to be the last hold-out of objective chance.
    step1: |-
      但有强烈理由不把概率等同于任何实际的相对频率（见 probability 的解释词条 §3.4）。许多哲学家，包括卡尔·波普尔（1967）与大卫·刘易斯（1986），转而把玻恩概率视为一种独特的客观性质（分别为倾向或机遇）的例示，这种性质可被赋予实际或可能的个别事件。刘易斯把量子非决定论视为客观机遇的最后堡垒。
    step2: |-
      但把概率等同于任何实际相对频率，有很强的理由反对（见“概率的解释”词条 §3.4）。卡尔·波普尔（1967）、大卫·刘易斯（1986）等许多哲学家转而认为，玻恩概率例示了一种独特的客观性质（分别为倾向与机遇），可赋予实际或可能的个别事件。刘易斯视量子非决定论为客观机遇的最后一块阵地。
  - id: 14
    kind: body
    source: |-
      By contrast, QBists adopt a subjectivist or personalist interpretation of probability, in quantum theory as elsewhere (see entry on interpretations of probability, §3.3). This makes the Born Rule of quantum theory not a law of nature but an empirically motivated norm of rationality a wise agent should follow in addition to those whose violation would render the agent’s degrees of belief incoherent. As usually formulated, the Born Rule specifies probabilities for various possible measurement outcomes given a quantum state: But QBists also adopt a subjectivist or personalist interpretation of quantum states and their time development.
    step1: |-
      相反，QBists 在量子理论一如在其他地方，对概率采取主观主义或个人主义的解释（见 probability 的解释词条 §3.3）。这使量子理论的玻恩规则不是一条自然律，而是明智的能动者除避免其置信度不融贯的那些条件之外应当遵循的、有经验动机的合理性规范。按通常的表述，玻恩规则在给定量子态之下规定各种可能测量结果的概率；但 QBists 也对量子态及其随时间的发展采取主观主义或个人主义的解释。
    step2: |-
      相反，QBists 对概率——量子理论中的概率与其他领域的概率一样——取主观主义或个人主义解释（见“概率的解释”词条 §3.3）。于是玻恩规则不是自然律，而是一条有经验动机的合理性规范：明智的能动者除了须遵守避免置信度不融贯的那些条件，也应当遵循它。按通常表述，玻恩规则在给定量子态的前提下规定各种可能测量结果的概率；但 QBists 对量子态及其随时间的发展，同样取主观主义或个人主义解释。
