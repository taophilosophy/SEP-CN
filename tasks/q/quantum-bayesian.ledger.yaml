      By rejecting the objective authority of observation reports QBists challenge what many have considered a presupposition of the scientific method. This rejection also threatens to undercut the standard personalist argument (see entry on statistics, §4.2.2) that the opinions of agents with very different prior degrees of belief will converge after they have accumulated sufficient common evidence.
