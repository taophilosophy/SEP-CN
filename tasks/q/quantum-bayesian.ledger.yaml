      Nevertheless, in certain circumstances different users may be expected to come to assign similar or even identical quantum states by updating their prior credences to take account of common (though never identical) experiences, some of which each may describe as experiences of the outcomes of quantum measurements on systems. Because QBists take the quantum state to have the role of representing an agent’s epistemic state they may avail themselves of personalist Bayesian arguments purporting to show the convergence of priors on updating in the light of common information. Also, just as de Finetti showed that a subjectivist agent’s credences may evolve as if refining estimates of an unknown objective probability, QBists (Caves, Fuchs, & Schack 2002b) have shown that the credences of a user of quantum theory may evolve as if refining his or her assignment of an unknown objective quantum state.
    step1: |-
      不过，在某些情形下，可以预期不同使用者通过更新其先验置信度、把共同（但从不完全相同）的经验纳入考虑，而逐渐指派相似甚至相同的量子态，这些经验中有些各自可被描述为对系统作量子测量的结果的经验。由于 QBists 把量子态看作表征能动者认识状态，他们可以采用个人主义贝叶斯论证，这类论证意在表明先验在共同信息之光照下更新时收敛。此外，正如德·菲内蒂表明主观主义能动者的置信度可以演化得仿佛在精化对一个未知客观概率的估计，QBists（Caves, Fuchs, & Schack 2002b）也表明，量子理论使用者的置信度可以演化得仿佛在精化其对某个未知客观量子态的指派。
    step2: |-
      不过，在某些情形下，不同使用者会更新其先验置信度，纳入共同（但从不完全相同）的经验——其中一些经验，各自可以说成是“对系统作量子测量所得结果”的经验；于是他们可望逐渐指派相似乃至相同的量子态。QBists 既然把量子态看作能动者认识状态的表征，便可以采用个人主义贝叶斯论证：这类论证意在表明，先验在共同信息的光照下更新时会收敛。此外，德·菲内蒂证明主观主义能动者的置信度可以演化得仿佛在精化对某一未知客观概率的估计；与此相仿，QBists（Caves, Fuchs, & Schack 2002b）证明，量子理论使用者的置信度也可以演化得仿佛在精化其对某个未知客观量子态的指派。
