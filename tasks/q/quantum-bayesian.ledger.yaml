      In its usual formulation the Born Rule does not look like a normative constraint on credences. QBists prefer to reformulate it purely as a relation among (subjective) probabilities without reference to a quantum state. In the form of Equation $(\ref{ex2})$ it relates probabilities $q$ of actual measurement outcomes $j$ to probabilities of outcomes of a hypothetical *fiducial* measurement of a special kind called a SIC.[^note-2]

      $$\tag{2}\label{ex2} q(j) = \sum_{i=1}^{d^2} [(d+1) p(i) -1/d].r(j\mathbin{|}i) $$
    step1: |-
      按通常表述，玻恩规则不像是对置信度的一种规范约束。QBists 更愿意把它纯粹重述为（主观）概率之间的关系，而不涉及量子态。在方程 $(\ref{ex2})$ 的形式中，它把实际测量结果 $j$ 的概率 $q$ 与一种特殊类型的假设性*基准*测量（称为 SIC）的结果概率联系起来。[^note-2]

      $$\tag{2}\label{ex2} q(j) = \sum_{i=1}^{d^2} [(d+1) p(i) -1/d].r(j\mathbin{|}i) $$
    step2: |-
      按通常表述，玻恩规则不像对置信度的规范约束。QBists 宁可把它纯粹重述为（主观）概率之间的关系，不提及量子态。在方程 $(\ref{ex2})$ 的形式中，它把实际测量结果 $j$ 的概率 $q$ 与一种称为 SIC 的特殊假设性**基准**测量的结果概率联系起来。[^note-2]

      $$\tag{2}\label{ex2} q(j) = \sum_{i=1}^{d^2} [(d+1) p(i) -1/d].r(j\mathbin{|}i) $$
