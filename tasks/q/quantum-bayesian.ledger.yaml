    source: |-
      One taking a desert pragmatist approach to quantum theory could reply as follows (see Healey 2020, §7.7)[^healey-2020]. The primary target of an explanatory application of quantum theory is not a collection of events but a probabilistic phenomenon they manifest. A probabilistic phenomenon is a probabilistic data model of a statistical regularity. One explains the phenomenon by demonstrating how the probabilities of the model are a consequence of the Born rule, as applied to events that manifest the regularity. Since the *explanandum* is not itself a physical condition, it is inappropriate to demand a physical *explanans* (such as a physically real quantum state). But the demonstration is explanatory only if each event manifesting the regularity itself depended on whatever physical conditions obtained, including whatever conditions backed assignment of the quantum state input to the Born rule. One can have good evidence for such backing conditions while unable to specify exactly what they are. The more complete the description of the physical conditions on which each event manifesting the regularity depended, the better the explanation of the probabilistic phenomenon they manifest.
    step1: |-
      采取荒漠实用主义进路的人可以这样回应（见 Healey 2020, §7.7）[^healey-2020]。量子理论解释性应用的首要对象不是一堆事件，而是它们所表现的某种概率现象。概率现象是统计规律性的概率数据模型。解释该现象，就是表明该模型的概率如何是玻恩规则应用于表现该规律性的事件的结果。既然*被解释项*本身不是物理状况，要求一个物理的*解释项*（如物理上实在的量子态）便不恰当。但只有当真表现该规律性的每个事件本身依赖于所获得的物理条件——包括支撑玻恩规则输入（量子态）之指派的一切条件——这一论证才具解释力。人们可以对这类支撑条件有良好证据，却无法确切说明它们是什么。对表现该规律性的每个事件所依赖的物理条件之描述越完备，对它们所表现的概率现象的解释就越好。
    step2: |-
      采取荒漠实用主义进路者可以这样回应（见 Healey 2020, §7.7）[^healey-2020]。量子理论解释性应用的首要对象，不是一堆事件，而是这些事件所表现的概率现象。概率现象是统计规律性的概率数据模型。解释该现象，就是表明该模型的概率如何由玻恩规则应用于表现该规律性的事件而得。既然**被解释项**本身并非物理状况，要求一个物理的**解释项**（例如物理上实在的量子态）便不合适。但只有当表现该规律性的每个事件本身都依赖于所获的物理条件——包括支撑玻恩规则输入（量子态）之指派的一切条件——这一论证才具解释力。人们可以对这类支撑条件握有良好证据，却无法确切说出它们是什么。对每个事件所依赖的物理条件描述得越完备，对它们所表现的概率现象的解释就越好。
