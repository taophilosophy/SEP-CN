      According to Brown 2019 (75) “…a variant of Berkeleyan idealism suffuses QBism.” QBists insist on the existence of a real world in which agents and their experiences are embedded, along with rocks, trees and everything else in the usual world of common experience. But they deny that quantum mechanics itself describes this world, while hoping eventually to infer more about it from our successful use of quantum mechanics to anticipate each of our experiences when acting on it. Brown objects to the currently ineffable character of the world for a QBist, contrasting this unfavorably with the way a realist about a quantum state can use it to describe the physical world and explain how it gives rise to our experiences by affecting our brains.
    step1: |-
      据 Brown 2019（75）：“……一种贝克莱式唯心论的变体弥漫于 QBism。” QBists 坚持存在一个真实世界，能动者及其经验嵌于其中，连同石头、树木以及通常日常经验世界中的一切。但他们否认量子力学本身描述这个世界，同时希望最终能从我们成功运用量子力学预想各自作用于世界时的经验，推断出更多关于它的东西。Brown 反对 QBist 眼中世界目前不可言说的性质，并不利地对比道：量子态的实在论者可以用它描述物理世界，并解释它如何通过影响我们的大脑而产生我们的经验。
    step2: |-
      据 Brown 2019（75）：“……一种贝克莱式唯心论的变体弥漫于 QBism。” QBists 坚持存在一个真实世界：能动者及其经验嵌于其中，石头、树木以及通常日常经验世界中的一切都在此列。但他们否认量子力学本身描述这个世界；同时希望终有一天，能由我们成功运用量子力学、预想各自作用于世界时的经验，推断出更多关于它的东西。Brown 反对 QBist 眼中世界当前不可言说的性质，并不利地对比说：量子态实在论者能用它描述物理世界，并解释它如何影响我们的大脑而产生经验。
