      In more detail, suppose an agent has degrees of belief $p(i)$ that the outcome of a SIC on a system would be the $i$ᵗʰ, and degree of belief $r(j\mathbin{|}i)$ in the $j$ᵗʰ outcome of an actual measurement $M$ conditional on the $i$ᵗʰ outcome for the hypothetical SIC on that system. Then QBists take Equation $(\ref{ex2})$, stating a condition on the agent’s degree of belief $q(j)$ that the outcome of $M$ will be the $j$ᵗʰ, as their preferred formulation of the Born Rule. In this expression $d$ stands for the dimension of the system’s Hilbert space (assumed to be a positive integer).
    step1: |-
      更详细地说，设能动者对某系统上一 SIC 的结果为第 $i$ 个抱有置信度 $p(i)$，并对实际测量 $M$ 的第 $j$ 个结果——在该系统上假设性 SIC 的第 $i$ 个结果的条件之下——抱有置信度 $r(j\mathbin{|}i)$。那么 QBists 把方程 $(\ref{ex2})$——它陈述关于能动者对 $M$ 结果为第 $j$ 个的置信度 $q(j)$ 的条件——当作他们偏好的玻恩规则表述。此式中 $d$ 表示系统希尔伯特空间的维数（假定为正整数）。
    step2: |-
      说得细些：设能动者对某系统上一 SIC 的第 $i$ 个结果抱有置信度 $p(i)$；并设在该系统上假设性 SIC 的第 $i$ 个结果这一条件下，该能动者对实际测量 $M$ 的第 $j$ 个结果抱有置信度 $r(j\mathbin{|}i)$。QBists 便以方程 $(\ref{ex2})$——陈述能动者对 $M$ 结果为第 $j$ 个的置信度 $q(j)$ 所须满足的条件——作为他们偏好的玻恩规则表述。式中 $d$ 为系统希尔伯特空间的维数（假定为正整数）。
