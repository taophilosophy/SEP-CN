  - id: 9
    kind: body
    source: |-
      Contemporary QBists (Mermin 2014: 422; Fuchs 2011)[^fuchs-2011][^mermin-2014] have sought precedents among such authorities as Erwin Schrödinger, Niels Bohr, Wolfgang Pauli, J.A. Wheeler, and William James. But what came to be known as quantum-Bayesianism and later QBism began as a collaboration between Caves, Fuchs, & Schack at the turn of the 21ˢᵗ century (Caves, Fuchs, & Schack 2002a,b), although Caves no longer considers himself a QBist. N. David Mermin (2014, 2019) became a convert more recently and has proposed extending the QBist vision of science to resolve at least one long-standing conceptual issue raised by classical physics. Stacey 2019 [Other Internet Resources] tracks changes from the Quantum-Bayesianism of 2002 to the QBism of 2019. Fuchs 2023, Fuchs & Stacey 2025 [Other Internet Resources] include more recent developments, while the paper by DeBrota, Fuchs, & Schack 2024 amplifies QBism’s account of dynamics and decoherence.
    step1: |-
      当代 QBists（Mermin 2014: 422; Fuchs 2011）[^fuchs-2011][^mermin-2014] 曾在埃尔温·薛定谔、尼尔斯·玻尔、沃尔夫冈·泡利、J. A. 惠勒与威廉·詹姆斯等权威那里寻找先驱。但后来被称为量子贝叶斯主义、再后被称为 QBism 的立场，起初是 Caves、Fuchs 与 Schack 在 21 世纪之交的合作（Caves, Fuchs, & Schack 2002a,b），尽管 Caves 已不再自视为 QBist。N. David Mermin（2014, 2019）较晚近才皈依，并提议把 QBist 的科学观推广，以至少解决古典物理学提出的一个长期概念问题。Stacey 2019 [Other Internet Resources] 追踪从 2002 年的量子贝叶斯主义到 2019 年的 QBism 的变迁。Fuchs 2023、Fuchs & Stacey 2025 [Other Internet Resources] 包含更晚近的发展，而 DeBrota, Fuchs, & Schack 2024 一文则扩充了 QBism 对动力学与退相干的说明。
    step2: |-
      当代 QBists（Mermin 2014: 422; Fuchs 2011）[^fuchs-2011][^mermin-2014] 曾到埃尔温·薛定谔、尼尔斯·玻尔、沃尔夫冈·泡利、J. A. 惠勒、威廉·詹姆斯等权威那里寻找先驱。但“量子贝叶斯主义”（后称 QBism）起初是 Caves、Fuchs 与 Schack 于世纪之交的合作（Caves, Fuchs, & Schack 2002a,b），尽管 Caves 现已不自视为 QBist。N. David Mermin（2014, 2019）较晚皈依，并提议把 QBist 科学观加以推广，以至少解决古典物理提出的一个长期概念问题。Stacey 2019 [Other Internet Resources] 梳理了从 2002 年量子贝叶斯主义到 2019 年 QBism 的变迁；更晚近的发展见 Fuchs 2023、Fuchs & Stacey 2025 [Other Internet Resources]，DeBrota, Fuchs, & Schack 2024 一文则扩充了 QBism 关于动力学与退相干的说明。
  - id: 10
    kind: body
    source: |-
      In conformity with standard terminology, on which the word “Bayesian” does not carry a commitment to denying objective probability, proponents of QBism no longer take the “B” to refer simply to Bayesianism. Insisting that probability has no physical existence even in a quantum world, they follow Bruno de Finetti in identifying probability with coherent degree of belief or credence. But according to Fuchs (2017a) “B” should not be taken to abbreviate “Brunism” since de Finetti would not have accepted all of QBism’s metaphysics: so “QBism” is now best understood simply as a stand-alone proper name for the view of quantum theory described in what follows.
    step1: |-
      依照标准术语——其中“贝叶斯”一词并不承诺否认客观概率——QBism 的倡导者不再把其中的“B”单纯理解为贝叶斯主义。他们坚持概率即便在量子世界中也没有物理存在，并随布鲁诺·德·菲内蒂把概率等同于融贯置信度。但据 Fuchs（2017a），“B”不应被理解为“Brunism”（布鲁诺主义）的缩写，因为德·菲内蒂不会接受 QBism 的全部形而上学：因此“QBism”现在最好被理解为下述量子理论观点的独立专名。
    step2: |-
      按标准术语，“贝叶斯”并不承诺否认客观概率；据此，QBism 的倡导者不再把“B”单纯理解为贝叶斯主义。他们坚持：即便在量子世界，概率也无物理存在；并追随布鲁诺·德·菲内蒂，把概率等同于融贯置信度。但 Fuchs（2017a）指出，“B”不宜解作“Brunism”（布鲁诺主义）的缩写，因为德·菲内蒂未必接受 QBism 的全部形而上学。故“QBism”如今最好只作下述量子理论观点的独立专名。
