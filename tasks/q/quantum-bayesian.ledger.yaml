      In recent work, Healey has also taken what he came to call a “desert pragmatist” approach to quantum theory (DP). He developed his (2012a) presentation in several papers now reprinted in Healey (2026a), and published an introduction to quantum mechanics following this approach in Healey (2017b). Healey (2026b) is a brief recent restatement of DP. He contrasts this with interpretations that attempt to say what the world would (or could) be like if quantum theory were true of it. On his approach quantum states as well as measurement outcomes are objective, though a quantum state assignment does not describe or represent the condition or behavior of a physical system. But quantum states are relational: Different agents may correctly and consistently assign different quantum states to the same system in the same circumstances—not because these represent their subjective personal beliefs, but because each agent has access to different objective information backing these (superficially conflicting) state assignments. Each such quantum state assignment may be said to correctly represent objective probabilistic relations between its backing conditions and meaningful claims about values of magnitudes, and so also about outcomes of measuring some system magnitudes.
    step1: |-
      在晚近工作中，Healey 还对量子理论采取他后来称为“荒漠实用主义”的进路（DP）。他在数篇现已重印于 Healey（2026a）的论文中发展了他（2012a）的表述，并出版了遵循此进路的量子力学导论（Healey 2017b）。Healey（2026b）是 DP 晚近的简要重述。他把它与那些试图说“若量子理论对世界为真，世界会（或可能）是什么样”的解释相对照。按他的进路，量子态与测量结果都是客观的，尽管量子态指派并不描述或表征一个物理系统的状况或行为。但量子态是关系性的：不同能动者可以在同样情形下正确且一致地把不同量子态指派给同一系统——不是因为这些态表示他们主观的个人信念，而是因为每个能动者可及不同的客观信息，支撑这些（表面上冲突的）态指派。每一种这样的量子态指派，都可以说正确表征了其支撑条件与关于量值的意义主张（因而也是关于测量某系统量值之结果的主张）之间的客观概率关系。
    step2: |-
      在晚近工作中，Healey 还对量子理论采取一种他后来称为“荒漠实用主义”的进路（DP）。他在若干现已重印于 Healey（2026a）的论文中发展了他（2012a）的表述，并出版了遵循此进路的量子力学导论（Healey 2017b）；Healey（2026b）是 DP 的晚近简要重述。他将此与那些试图说出“量子理论若对世界为真，世界会（或可能）是什么样”的解释相对照。按他的进路，量子态与测量结果都是客观的，尽管量子态指派并不描述或表征系统的状况或行为。然而量子态是关系性的：不同能动者可以在同样情形下正确而一致地把不同量子态指派给同一系统——不是因为它们表示各人主观的个人信念，而是因为每个能动者可及不同的客观信息，支撑这些（表面冲突的）指派。每一种这样的指派，都可以说正确表征了其支撑条件与关于量值的有意义主张（因而是关于测量某些系统量值之结果的主张）之间的客观概率关系。
