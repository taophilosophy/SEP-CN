      A variety of QBist and pragmatist views of quantum theory have been proposed since quantum theory assumed close to its present form. In recent years this has been an active area of research especially by philosophically aware physicists working in quantum foundations. Philosophers have tended to dismiss such approaches, objecting to their supposed instrumentalism and/or anti-realism. But there is much to learn from responses to such objections and good *philosophical* reasons to take these views more seriously.
    step1: |-
      自量子理论以接近现今形态出现以来，人们提出了各种 QBist 与实用主义的量子理论观点。近年来，这已成为一个活跃的研究领域，尤其是由从事量子基础研究、有哲学意识的物理学家推动。哲学家往往轻蔑地看待这类进路，反对其所谓的工具主义和/或反实在论。但从对这些反对的回应中可学到很多，而且有很好的*哲学*理由更认真地对待这些观点。
    step2: |-
      自量子理论以接近现今形态出现以来，人们提出了多种 QBist 与实用主义的量子理论观点。近年来，这已成为一个活跃的研究领域，尤其由从事量子基础研究、具哲学意识的物理学家推动。哲学家往往对此类进路不屑一顾，指责其所谓的工具主义或反实在论。然而，从对这些反对的回应中大有可学；而且有充分的**哲学**理由更认真地对待这些观点。
