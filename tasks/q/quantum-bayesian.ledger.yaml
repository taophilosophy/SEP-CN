      Bell’s arguments (2004) have convinced some physicists and many philosophers that certain patterns of correlation among spatially separated events correctly predicted by quantum theory manifest non-local influences between some of these events. QBists use their view of measurement-as-experience to reject any such non-local influences.
    step1: |-
