      For a QBist, what science rests on are not objective reports of localized physical events but the individual agent’s experiences. Being present at a single location, at no time does an individual agent experience spatially separated events.[^note-3] Correlations taken to manifest non-local influences supposedly concern events in different places—say where Alice is and where Bob is. But Alice can only experience events where she is, not at Bob’s distant location. When she hears Bob’s report of what he experienced at a distant location, this is an experience she has where *she* is, not where Bob reports having had his experience. So quantum theory is answerable to patterns of correlation not among spatially separated physical events, but among Alice’s (as also among Bob’s) spatially coincident experiences. QBists argue that Alice, Bob, and any other agent can use quantum theory successfully to account for her or his experiences with no appeal to any physical states (hidden or otherwise) or non-local physical influences.
    step1: |-
      对 QBist 来说，科学所依赖的不是对定域物理事件的客观报告，而是个体能动者的经验。一个个体能动者处于单一位置，因而在任何时候都不会经验空间上分离的事件。[^note-3] 被认为表现非定域影响的相关，涉及不同地点的事件——比如说爱丽丝所在之处与鲍勃所在之处。但爱丽丝只能经验她所在之处的事件，而不能经验鲍勃远在他方的事件。当她听到鲍勃关于他在远方所经验之事的报告时，这是她在*她*所在之处拥有的经验，而非鲍勃报告他经验之事的所在之处。因此，量子理论要对之负责的，不是空间分离物理事件之间的相关模式，而是爱丽丝（以及鲍勃）空间上重合的经验之间的相关模式。QBists 论证，爱丽丝、鲍勃及任何其他能动者都能成功地用量子理论来说明她或他的经验，而不诉诸任何物理状态（隐藏的或其他）或非定域物理影响。
    step2: |-
