      Impressed by the initial success of Dirac’s equation of the spinning electron within the special relativistic context, Weyl adapted Dirac’s special relativistic theory of the electron to the general theory of relativity in three groundbreaking papers (Weyl (1929b,c,d)). A complete exposition of this formalism is presented in (Weyl (1929b)). O’Raifeartaigh (1997) says of this paper:
    step1: TBD
    step2: TBD
  - id: 480
    kind: body
    source: |-
      > Although not fully appreciated at the time, Weyl’s 1929 paper has turned out to be one of the seminal papers of the century, both from the philosophical and from the technical point of view.
    step1: TBD
    step2: TBD
  - id: 481
    kind: body
    source: |-
      In this ground braking paper, as well as in (Weyl (1929c,d)), Weyl explicitly abandons his earlier attempt to unify electromagnetism with the theory of general relativity. In his early attempt he associated the electromagnetic vector potential $A_{j}(x)$ with the additional connection coefficients that arise when a conformal structure is reduced to a Weyl structure (see §4.1). The important concept of gauge invariance, however, is preserved in his 1929 paper. Rather than associating gauge transformations with the scale or gauge of the spacetime metric tensor, Weyl now associates gauge transformations with the phase of the Dirac spinor field $\psi$ that represents matter. In the introduction of (Weyl (1929b)), which presents in detail the new formalism, Weyl describes his reinterpretation of the gauge principle as follows:
    step1: TBD
    step2: TBD
  - id: 482
    kind: body
    source: |-
      > The Dirac field-equations for $\psi$ together with the Maxwell equations for the four potentials $f_{p}$ of the electromagnetic field have an invariance property which, from a formal point of view, is similar to the one that I called gauge invariance in my theory of gravitation and electromagnetism of 1918; the equations remain invariant when one makes the simultaneous replacements
      >
      > $$\begin{array}{ccc} \psi \text{ by } e^{i\lambda}\psi & \text{and} & f_p \text{ by } f_p - \dfrac{\partial\lambda}{\partial x^p}, \end{array}$$
      >
      > where $\lambda$ is understood to be an arbitrary function of position in the four-dimensional world. Here the factor $\bfrac{e}{ch}$, where $- e$ is the charge of the electron, $c$ is the speed of light, and $\bfrac{h}{\pi}$ is the quantum of action, has been absorbed in $f_{p}$. The connection of this “gauge invariance” to the conservation of electric charge remains untouched. But an essential difference, which is significant for the correspondence to experience, is that the exponent of the factor multiplying $\psi$ is not real but purely imaginary. $\psi$ now assumes the role that $ds$ played in Einstein’s old theory. It seems to me that this new principle of gauge invariance, which follows not from speculation but from experiment, compellingly indicates that *the electromagnetic field is a necessary accompanying phenomenon, not of gravitation, but of the material wave field represented by* $\psi$. Since gauge invariance includes an arbitrary function $\lambda$ it has the character of “general” relativity and can naturally only be understood in that context.
    step1: TBD
    step2: TBD
  - id: 483
    kind: body
    source: |-
      Weyl then introduces his two-component spinor theory in Minkowski space. Since one of his aims is to adapt Dirac’s theory to the curved spacetime of general relativity, Weyl develops a theory of *local* spinor structures for curved spacetime.[^note-106] He achieves this by providing a systematic formulation of *local* tetrads or Vierbeins (orthonormal basis vectors). Orthonormal frames had already been introduced as early as 1900 by Levi-Civita and Ricci. Somewhat later, Cartan had shown the usefulness of employing local orthonormal-basis vector fields, the so-called “moving frames” in his investigation of Riemannian geometry in the 1920s. In addition, Einstein (1928) had used tetrads or Vierbeins in his attempt to unify gravitation and electricity by resorting to *distant parallelism* with *torsion*. In Einstein’s theory, the effects of gravity and electromagnetism are associated with a specialized torsion of spacetime rather than with the curvature of spacetime. Since the curvature vanishes everywhere, distant parallelism is a feature of Einstein’s theory. However, distant parallelism appeared to Weyl to be quite unnatural from the viewpoint of Riemannian geometry. Weyl expressed his criticism in all three papers (Weyl (1929b,c,d)) and he contrasted the way in which Vierbeins are employed in his own work with the way they were used by Einstein. In the introduction Weyl (1929b) says:
    step1: TBD
    step2: TBD
  - id: 484
    kind: body
    source: |-
      > I prefer not to believe in distant parallelism for a number of reasons. First, my mathematical attitude resists accepting such an artificial geometry; it is difficult for me to understand the force that would keep the local tetrads at different points and in rotated positions in a rigid relationship. There are, I believe, two important physical reasons as well. In particular, by loosening the rigid relationship between the tetrads at different points, the gauge factor $e^{i\lambda}$, which remains arbitrary with respect to the quantity $\psi$, changes from a constant to an arbitrary function of spacetime location; that is, only through the loosening of the rigidity does the actual gauge invariance become understandable. Secondly, the possibility to rotate the tetrads at different points independently from each other, is as we shall see, equivalent to the symmetry of the energy-momentum tensor or with the validity of its conservation law.
    step1: TBD
    step2: TBD
  - id: 485
    kind: body
    source: |-
      Every tetrad uniquely determines the pseudo-Riemannian spacetime metric $g_{ij}$. However, the converse does not hold since the tetrad has 16 independent components whereas the spacetime metric, $g_{ij} = g_{ji}$, has only 10 independent components. The extra 6 degrees of freedom of the tetrads that are not determined by the metric may be represented by the elements of a 6-parameter internal Lorentz group. That is, the local tetrads are determined by the spacetime metric up to local Lorentz transformations. The tetrad formalism made it possible, therefore, for Weyl to derive, as a special case of Noether’s second theorem[^note-107], the energy-momentum conservation laws for general coordinate transformations and the internal Lorentz transformations of the tetrads. Moreover, Weyl had always emphasized the strong analogy between gravitation and electricity. The tetrad formalism and the conservation laws both made explicit and supported this analogy.
    step1: TBD
    step2: TBD
  - id: 486
    kind: body
    source: |-
      Weyl introduced the final section of his seminal 1929 paper saying “We now come to the critical part of the theory”, and presented a derivation of electromagnetism from the new gauge principle. The initial step in Weyl’s derivation exploits the intrinsic gauge freedom of his two-component theory of spinors for Minkowski space, namely

      $$ \psi(x) \rightarrow e^{i\lambda}\psi(x), $$
    step1: TBD
    step2: TBD
  - id: 487
    kind: body
    source: |-
      where the gauge factor is a constant. Since Weyl wished to adapt his theory to the curved spacetime of general relativity, the above phase transformation must be generalized to accommodate *local*tetrads. That is, each spacetime point has its own tetrad and therefore its own point-dependent gauge factor. The phase transformation is thus given by

      $$ \psi(x) \rightarrow e^{i\lambda(x)}\psi(x), $$
    step1: TBD
    step2: TBD
  - id: 488
    kind: body
    source: |-
      where the $\lambda(x)$ is a function of spacetime. Weyl says:
    step1: TBD
    step2: TBD
  - id: 489
    kind: body
    source: |-
      > We come now to the critical part of the theory. In my view the origin and the necessity for the electromagnetic field lie in the following justification. The components $\psi_{1},\psi_{2}$ are, in fact, not uniquely determined by the tetrad but only to the extent that they can still be multiplied by an arbitrary “gauge-factor” $e^{i\lambda}$ of absolute value 1. The transformation of the $\psi$ induced by a rotation of the tetrad is determined only up to such a factor. In the special theory of relativity one must regard this gauge factor as a constant, since we have here only a single point-independent tetrad. This is different in the general theory of relativity. Every point has its own tetrad, and hence its own arbitrary gauge factor, because the gauge factor necessarily becomes an arbitrary function of position through the removal of the rigid connection between tetrads at different points.
    step1: TBD
    step2: TBD
