      [^note-85]: Like the Einstein universe, de Sitter’s universe was *assumed*to be static. However, unlike Einstein’s universe, it contained no matter. It is tempting to reject de Sitter’s solution on the grounds that de Sitter’s universe is empty. Consequently, the initial interest in de Sitter’s solution focused primarily on Einstein’s mistaken claim that his field equations do not permit vacuum solutions. However, de Sitter’s universe has some other interesting properties which subsequently came to be appreciated because of new astronomical discoveries in the early 1920’s that suggested that the universe is not static, but expanding. This engendered an interest to find a cosmological model of such a universe. Because de Sitter’s relativistic model provided the only alternative to Einstein’s model, it aroused new interest and was reexamined in light of these astronomical discoveries. It was realized that mathematically placing hypothetical particles into de Sitter’s empty spacetime—particles that have no mass and do not influence the spacetime geometry—they accelerate away from each other. This means that while de Sitter’s universe is empty from a dynamic point of view, kinematically it is non-static, it is expanding. Moreover, although de Sitter’s specific coordinate representation of the metric of his solution might lead one to think that his universe is static, there exists another set of coordinates with respect to which the metric of de Sitter’s universe assumes an explicitly dynamical form. According to Eddington (1933, 46): “The situation has been summed up in the statement that Einstein’s universe contains matter but no motion and de Sitter’s contains motion but no matter.”
