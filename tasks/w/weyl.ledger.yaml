      During the period 1925–1926 Weyl published a sequence of groundbreaking papers (Weyl (1925, 1926a,b,c)) in which he presented a general theory of the representations and invariants of the classical Lie groups. In these celebrated papers Weyl drew together I. Schur’s work on invariants and representations of the $n$-dimensional rotation group, and É. Cartan’s work on semisimple Lie algebras. In doing so, Weyl utilized different fields of mathematics such as, tensor algebra, invariant theory, Riemann surfaces and Hilbert’s theory of integral equations. Weyl himself considered these papers his greatest work in mathematics.
    step1: TBD
    step2: TBD
  - id: 421
    kind: body
    source: |-
      The central role that group theoretic techniques played in Weyl’s analysis of spacetime was one of several factors which led Weyl to his general theory of the representations and invariants of the classical Lie groups. It was in the context of Weyl’s investigation of the space-problem (see §4.2) that Weyl came to appreciate the value of group theory for investigating the mathematical and philosophical foundations of physical theories in general, and for dealing with fundamental questions motivated by the general theory of relativity, in particular.
    step1: TBD
    step2: TBD
  - id: 422
    kind: body
    source: |-
      A motivation of quite another sort, which led Weyl to his general representation theory, was provided by Study when he attacked Weyl specifically, as well as other unnamed individuals, by accusing them “of having neglected a rich cultural domain (namely, the theory of invariants), indeed of having completely ignored it”.[^note-89] Weyl (1924c) replied immediately providing a new foundation for the theory of invariants of the special linear groups $SL(n, \mathbb{C})$ and its most important subgroups, the special orthogonal group $SO(n, \mathbb{C})$ and the special symplectic group $SSp(\bfrac{n}{2}, \mathbb{C})$ (for $n$ even) based on algebraic identities due to Capelli. In a footnote, Weyl (1924c) sarcastically informed Study that “even if he [Weyl] had been as well versed as Study in the theory of invariants, he would not have used the symbolic method in his book *Raum, Zeit, Materie* and even with the last breath of his life would not have mentioned the algebraic completeness theorem for invariant theory”. Weyl’s point was that in the context of his book *Raum-Zeit-Materie*, the kernel-index method of tensor analysis is more appropriate than the methods of the theory of algebraic invariants.[^note-90]
    step1: TBD
    step2: TBD
  - id: 423
    kind: body
    source: |-
      While this account of events leading up to Weyl’s groundbreaking papers on group theory seems reasonable enough, Hawkins (2000) has suggested a fuller account, which brings into focus Weyl’s deep philosophical interest in the mathematical foundations of the theory of general relativity by drawing attention to Weyl (1924d) on tensor symmetries, which, according to Hawkins, played an important role in redirecting Weyl’s research interests toward pure mathematics.[^note-91] Weyl (1949b, 400) himself noted that his interest in the philosophical foundations of the general theory of relativity motivated his analysis of the representations and invariants of the continuous groups: “I can say that the wish to understand what really is the mathematical substance behind the formal apparatus of relativity theory led me to the study of representations and invariants of groups; and my experience in this regard is probably not unique”. Weyl’s paper (Weyl (1924a)), and the first chapter Weyl (1925) of his celebrated papers on representation theory, have the same title: “The group theoretic foundation of the tensor calculus”. Hawkins (1998) says, Weyl
    step1: TBD
    step2: TBD
  - id: 424
    kind: body
    source: |-
      > had obtained through the theory of groups, and in particular through the theory of group representations—as augmented by his own contributions—what he felt was a proper mathematical understanding of tensors, tensor symmetries, and the reason they represent the source of all linear quantities that might arise in mathematics or physics. Once again, he had come to appreciate the importance of the theory of groups—and now especially the theory of group representation—for gaining insight into mathematical questions suggested by relativity theory. Unlike his work on the space problem …Weyl now found himself drawing upon far more than the rudiments of group theory. … And of course Cartan[^note-92] had showed that the space problem could also be resolved with the aid of results about representations. In short, the representation theory of groups had proved itself to be a powerful tool for answering the sort of mathematical questions that grew out of Weyl’s involvement with relativity theory.
    step1: TBD
    step2: TBD
