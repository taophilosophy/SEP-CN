      Weyl soon grasped the significance of Hilbert’s program, and came to acknowledge its “immense significance and scope”[^note-29]. Whether that program could be successfully carried out was, of course, still an open question. But independently of this issue Weyl was concerned about what he saw as the loss of content resulting from Hilbert’s thoroughgoing formalization of mathematics. “Without doubt,” Weyl warns, “if mathematics is to remain a serious cultural concern, then some *sense* must be attached to Hilbert’s game of formulae.” Weyl thought that this sense could only be supplied by “fusing” mathematics and physics so that “the mathematical concepts of number, function, etc. (or Hilbert’s symbols) generally partake in the theoretical construction of reality in the same way as the concepts of energy, gravitation, electron, etc.”[^note-30] Indeed, in Weyl’s view, “it is the function of mathematics to be at the service of the natural sciences”. But still:
    step1: |-
      外尔很快把握了希尔伯特纲领的意义，并逐渐承认其“巨大的意义与范围”[^note-29]。该纲领能否被成功实施，当然仍是一个悬而未决的问题。但与此问题无关，外尔关切的是他所看到的、由希尔伯特对数学的彻底形式化所造成的内容丧失。“毫无疑问，”外尔警告说，“如果数学要继续作为一种严肃的文化关切，那么就必须给希尔伯特的公式游戏赋予某种*意义*。”外尔认为，这种意义只能通过把数学与物理学“融合”起来而提供，从而使“数、函数等数学概念（或希尔伯特的符号）一般而言以与能量、引力、电子等概念相同的方式参与对实在的理论建构。”[^note-30] 实际上，在外尔看来，“数学的职分就在于为自然科学服务”。但尽管如此：
    step2: |-
      外尔迅即领会了希尔伯特纲领的分量，并渐次承认其“意义与范围之巨大”[^note-29]。该纲领能否成功实施，固然仍属悬案；但外尔所忧者另有其事：他以为希尔伯特对数学的彻底形式化导致了内容的丧失。“毋庸置疑，”外尔告诫道，“数学若要继续作为一项严肃的文化关切，就必须为希尔伯特这场公式游戏赋予某种*意义*。”在他看来，此种意义唯有通过把数学与物理学“熔合”方能给出，从而使“数、函数等数学概念（或希尔伯特的符号）一般地像能量、引力、电子等概念那样，参与对实在的理论建构。”[^note-30] 实则外尔认为，“数学的职分正在于为自然科学效劳”。然而：
