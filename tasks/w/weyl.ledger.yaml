      It is symbolic construction which, in Weyl’s vision, allows us access to the “objective” world presumed to underpin our immediate perceptions; indeed, Weyl holds that the objective world, being beyond the grasp (the “lighted circle”) of intuition, can *only* be presented to us in symbolic form[^note-5]. We can see a double dependence on the Ego in Weyl’s idea of symbolic construction to get hold of an objective world beyond the mental. For not only is that world “constructed” by the Ego, but the materials of construction, the symbols themselves, as signs intended to convey meaning, have no independent existence beyond their graspability by a consciousness. By their very nature these symbols cannot point directly to an external world (even given an unshakable belief in the existence of that world) lying beyond consciousness. Weyl’s metaphysical triad thus reduces to what might be called a *polarized dualism*, with the mental (I, Thou) as the primary, independent pole and objective reality as a secondary, dependent pole[^note-6].
