      Only a year after Pauli’s review article in 1921, in which Pauli had argued that Weyl’s defence of his unified field theory deprives it of its inherent convincing power from a physical point of view, Schrödinger (1922) suggested the possibility that Weyl’s 1918 gauge theory could suitably be employed in the quantum mechanical description of the electron.[^note-97] Similar proposals were subsequently made by Fock (1926) and London (1927).
    step1: TBD
    step2: TBD
  - id: 467
    kind: body
    source: |-
      With the advent of the quantum theory of the electron around 1927/28 Weyl abandoned his gauge theory of 1918. He did so because in the new quantum theory a different kind of gauge invariance associated with Dirac’s theory of the electron was discovered which, as had been suggested by Fock (1926) and London (1927), more adequately accounted for the conservation of electric charge.[^note-98] Why did Weyl hold on to his gauge theory for almost a decade despite a preponderance of compelling empirical arguments that were mounted against it by Einstein, Pauli and others?[^note-99] In one of Weyl’s (1918/1998) last letters to Einstein concerning his unified field theory, Weyl made it clear that *it was mathematics and not physics* that was the driving force behind his unified field theory.[^note-100]
    step1: TBD
    step2: TBD
  - id: 468
    kind: body
    source: |-
      > Incidentally, you must not believe that it was because of physics that I introduced the linear differential form d$\varphi$ in addition to the quadratic form. I wanted rather to eliminate this “inconsistency” which always has been a bone of contention to me.[^note-101] And then, to my surprise, I realized that it looked as if it might explain electricity. You clap your hands above your head and shout: But physics is not made this way!
    step1: TBD
    step2: TBD
  - id: 469
    kind: body
    source: |-
      As London (1927, 376–377) remarks, one must admire Weyl’s immense courage in developing his gauge invariant interpretation of electromagnetism and holding on to it on the mere basis of purely formal considerations. London observes that the principle of equivalence of inertial and gravitational mass, which prompted Einstein to provide a geometrical interpretation of gravity, was at least a physical fact underlying gravitational theory. In contrast, an analogous fact was not known in the theory of electricity; consequently, it would seem that there was no compelling physical reason to think that rigid rods and ideal clocks would be under the universal influence of the electromagnetic field. To the contrary, London says, experience strongly suggests that atomic clocks exhibit sharp spectral lines that are unaffected by their history in the presence of a magnetic field, contrary to Weyl’s non-integrability assumption. London concludes, that in the face of such elementary empirical facts it must have been an unusually clear metaphysical conviction which prevented Weyl from abandoning his idea that nature ought to make use of the beautiful geometrical possibilities that a pure infinitesimal geometry offers.
    step1: TBD
    step2: TBD
