    source: |-
      A metric $g$ on a manifold determines a first-order conformal structure on the manifold, namely, an equivalence class of conformally related metrics

      $$\tag{27} [g] = \{\overline{g} \mid \overline{g} = e^{\theta} g \}. $$
    step1: TBD
    step2: TBD
  - id: 283
