      That is, at each point of $M$ there exists a coordinate system (defined up to an element of the orthogonal group $O(n)$ in which the square root of the homogeneous function of second degree can be expressed in the above standard form. Riemann’s well-known general expression for the measure of length at $p \in M$ with respect to an arbitrary coordinate system is given by

      $$\tag{25} ds^{2} = g_{ij}(x(p))dx^{i}(p)dx^{\,j}(p), $$
