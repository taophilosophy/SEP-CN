      It is interesting in this context to consider the following remarks by Yang. Referring to Einstein’s objection to Weyl’s 1918 gauge theory, Yang (1986, 18) asked, “what has happened to Einstein’s original objection after quantum mechanics inserted an $-i$ into the scale factor and made it into a phase factor?” Yang continuous:
    step1: TBD
    step2: TBD
  - id: 493
    kind: body
    source: |-
      > Apparently no one had, after 1929, relooked at Einstein’s objection until I did in 1983. The result is interesting and deserves perhaps to be a footnote in the history of science: Let us take Einstein’s Gedankenexperiment …. When the two clocks come back, because of the insertion of the factor $-i$, they would not have different scales but different phases. That would not influence their rates of time-keeping. Therefore, Einstein’s original objection disappears. But you can ask a further question: Can one measure their phase difference? Well, to measure a phase difference one must do an interference experiment. Nobody knows how to do an interference experiment with big objects like clocks. However, one can do interference experiments with electrons. So let us change Einstein’s Gedankenexperiment to one of bringing electrons back along two different paths and ask: Can one measure the phase difference? The answer is yes. That was in fact a most important development in 1959 and 1960 when Aharonov and Bohm realized—completely independently of Weyl—that electromagnetism has some meaning which was not understood before.[^note-109]
    step1: TBD
    step2: TBD
  - id: 494
    kind: body
    source: |-
      We end the discussion on Weyl’s gauge theory by quoting the following remarks by Dyson (1983).
    step1: TBD
    step2: TBD
  - id: 495
    kind: body
    source: |-
      > A more recent example of a great discovery in mathematical physics was the idea of a gauge field, invented by Hermann Weyl in 1918. This idea has taken only 50 years to find its place as one of the basic concepts of modern particle physics. Quantum chromodynamics, the most fashionable theory of the particle physicists in 1981, is conceptually little more than a synthesis of Lie’s group-algebras with Weyl’s gauge fields. The history of Weyl’s discovery is quite unlike the history of Lie groups and Grassmann algebras. Weyl was neither obscure nor unrecognized, and he was working in 1918 in the most fashionable area of physics, the newborn theory of general relativity. He invented gauge fields as a solution of the fashionable problem of unifying gravitation with electromagnetism. For a few months gauge fields were at the height of fashion. Then it was discovered by Weyl and others that they did not do what was expected of them. Gauge fields were in fact no good for the purpose for which Weyl invented them. They quickly became unfashionable and were almost forgotten. But then, very gradually over the next fifty years, it became clear that gauge fields were important in a quite different context, in the theory of quantum electrodynamics and its extensions leading up to the recent development of quantum chromodynamics. The decisive step in the rehabilitation of gauge fields was taken by our Princeton colleague Frank Yang and his student Bob Mills in 1954, one year before Hermann Weyl’s death [Yang and Mills, 1954]. There is no evidence that Weyl ever knew or cared what Yang and Mills had done with his brain child.
      >
      > So the story of gauge fields is full of ironies. A fashionable idea, invented for a purpose which turns out to be ephemeral, survives a long period of obscurity and emerges finally as a corner-stone of physics.[^note-110]
