      There are cosmologists who, like Einstein, are favourably disposed towards some version of Mach’s Principle, and who believe that the local laws, which are satisfied by various physical fields, are determined by the large scale structure of the universe. On the other hand, there are those cosmologists who, like Weyl, take a conservative approach; they take empirically confirmed *local*laws and investigate what these laws might imply about the universe as a whole. Our understanding of the large scale structure of the universe, Weyl emphasized, must be based on theories and principles which are verified locally. Einstein’s general theory is a *local* field theory; like electromagnetism, it is a *close action* *theory*.[^note-86] Weyl (1924b) says:
    step1: TBD
    step2: TBD
