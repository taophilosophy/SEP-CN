      By the late 1920s Weyl’s methodological approach to gauge theory underwent an “empirical turn”. In contrast to $a$ *priori* geometrical reasoning, which guided his early unification attempts—Weyl calls it a “speculative theory” in the above citation—by 1928/1929 Weyl emphasized *experimentally-based principles* which underlie gauge invariance.[^note-103]
    step1: TBD
    step2: TBD
  - id: 475
