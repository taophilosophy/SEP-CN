      The relationship of the Ego with the external world, the realm of “objective” reality, is of an entirely different nature. There is no analogy that the Ego can draw—as it can with the Thou—between itself and the external world, since that world (presumably) lacks consciousness. The external world is radically other, and opaque to the Ego[^note-2]. Like Kant’s noumenal realm, the external world is outside the immediacy of consciousness; it is, in a word, *transcendent*. Since this transcendent world is not directly accessible to the Ego, as far as the latter is concerned the existence of that world must arise through *postulation*, “a matter of metaphysics, not a judgment but an act of acknowledgment or belief.”[^note-3] Indeed, according to Weyl, it is not strictly necessary for the Ego to postulate the existence of such a world, even given the existence of a world of Thous:
    step1: |-
