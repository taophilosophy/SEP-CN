      #### 4.5.4 Weyl’s two-component Neutrino theory
    step1: TBD
    step2: TBD
  - id: 497
    kind: body
    source: |-
      It is remarkable that Weyl’s (1929b) two-component spinor formalism led him to anticipate the existence of particles that violate conservation of parity, that is, left-right symmetry. In 1929 left-right symmetry was taken for granted and considered a basic fact of all the laws of Nature. Weyl formulated the four-component Dirac spinor $\psi$ in terms of a two-component left-handed Weyl spinor $\psi_{L}$ and a two-component right-handed Weyl spinor $\psi_{R}$:

      $$\begin{align} \psi &= (\psi^{1}, \psi^{2}, \psi^{3}, \psi^{4})^{T} \\ &= (\psi^{1}_{L}, \psi^{2}_{L}, \psi^{1}_{R}, \psi^{2}_{R})^{T} \\ &= (\psi_L, \psi_R)^T \end{align}$$
    step1: TBD
    step2: TBD
  - id: 498
    kind: body
    source: |-
      The four-component Dirac spinor, formulated in terms of the two Weyl spinors

      $$ \psi = \left[\matrix{\psi_L \\ \psi_R}\right] $$
    step1: TBD
    step2: TBD
  - id: 499
    kind: body
    source: |-
      preserves parity; it applies to all massive spin $\bfrac{1}{2}$ particles (fermions) and all massive fermions are known to obey parity conservation. However, a single Weyl spinor, either $\psi_{L}$ or $\psi_{R}$, does not preserve parity. Weyl noted that instead of the four-component Dirac spinor “two components suffice if the requirement of left-right symmetry (parity) is dropped”. A little later he added, “the restriction 2 removes the equivalence of left and right. It is only the fact that left-right symmetry actually appears in Nature that forces us to introduce a second pair of $\psi$-components”. Weyl’s two-spinor version of the Dirac equation is a *coupled* system of equations requiring both Weyl spinors $\psi_{L}$ and $\psi_{R}$ in order to preserve parity. Weyl considerd massless particles in his two-spinor version of the Dirac equation. In this case, the equations of the two-spinor version of Dirac’s equation *decouple*, yielding an equation for $\psi_{L}$ and for $\psi_{R}$. These equations are independent of each other, and the equation for the 2-component left-handed Weyl spinor $\psi_{L}$ is called *Weyl’s equation*; it is applicable to the massless particle called the *neutrino*[^note-111], a spin $\bfrac{1}{2}$ particle, that was discovered in 1956. Yang (1986, 12) remarks
    step1: TBD
    step2: TBD
  - id: 500
    kind: body
    source: |-
      > Now I come to another piece of work of Weyl’s which dates back to 1929, and is called Weyl’s two-component neutrino theory. He invented this theory in 1929 in one of his very important articles … as a mathematical possibility satisfying most of the requirements of physics. But it was rejected by him and by subsequent physicists because it did not satisfy left-right symmetry. With the realisation that left-right symmetry was not exactly right in 1957 it became clear that this theory of Weyl’s should immediately be re-looked at. So it was and later it was verified theoretically and experimentally that this theory gave, in fact, the correct description of the neutrino.[^note-112]
