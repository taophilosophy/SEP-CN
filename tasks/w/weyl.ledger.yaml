      ### 4.2 The Riemann-Helmholtz-Lie Problem of Space
    step1: TBD
    step2: TBD
  - id: 209
    kind: body
    source: |-
      Prior to the works of Gauss, Grassmann and Riemann, the study of geometry tended to emphasize the employment of empirical intuitions and images of the three dimensional physical space. Physical space was thought of as having definite metrical attributes. The task of the geometer was to take physical mensuration devices in that space and work with them.
    step1: TBD
    step2: TBD
  - id: 210
    kind: body
    source: |-
      Under the influence of Gauss and Grassmann, Riemann’s great philosophical contribution consisted in the demonstration that, unlike the case of a discrete manifold, where the determination of a set necessarily implies the determination of its quantity or cardinal number, in the case of a continuous manifold, the concept of such a manifold and of its continuity properties, can be separated form its metrical structure. Using modern terminology, Riemann separated a manifold’s local differential topological structure from its metrical structure. Thus Riemann’s separation thesis gave rise to the *space problem*, or as Weyl called it, *das Raumproblem*: how can metric relations be determined on a continuous manifold $M$?[^note-56]
    step1: TBD
    step2: TBD
  - id: 211
    kind: body
    source: |-
      A metric manifold is a manifold on which a distance function $f : M \times M \rightarrow \mathbb{R}$ is defined. Such a distance function must satisfy the following minimal conditions: for all $p, q, r \in M$,
    step1: TBD
    step2: TBD
  - id: 212
    kind: body
    source: |-
      1. $f(p, q) \ge 0$, and if $f(p,q) = 0$, then $p = q$,
      2. $f(p, q) = f(q,p)$, (symmetry)
      3. $f(p, q) + f(q,r) \ge f(p,r)$ (triangle inequality).
    step1: TBD
    step2: TBD
  - id: 213
    kind: body
    source: |-
      In his famous inaugural lecture at Göttingen, entitled *Über die Hypothesen, welche der Geometrie zu* *Grunde liegen* (*About the hypotheses which lie at the basis of geometry*), Riemann (1854) examined how metric relations can be determined on a continuous manifold; that is, what specific form $f : M \times M \rightarrow \mathbb{R}$ should have. Consider the coordinates $x^{i}(p)$ and $x^{i} (p) + dx^{i} (p)$ of two neighboring points $p, q \in M$. The measure of the distance $ds = f(p,q)$ must be some function $F_{p}$ at $p$ of the differential increments $dx^{i}(p)$; that is,

      $$\tag{22} ds = F_{p}(dx^{1}(p), \ldots ,dx^{n}(p)). $$
    step1: TBD
    step2: TBD
  - id: 214
    kind: body
    source: |-
      Riemann states that $F_{p}$ should satisfy the following requirements:
    step1: TBD
    step2: TBD
  - id: 215
    kind: body
    source: |-
      **Functional Homogeneity:** If $\lambda \gt 0$ and $ds = F_{p}(dx(p))$, then

      $$\tag{23} \lambda ds = \lambda F_{p}(dx(p)) = F_{p}(\lambda dx(p)). $$
    step1: TBD
    step2: TBD
  - id: 216
    kind: body
    source: |-
      **Sign Invariance:** A change in sign of the differentials should leave the value of $ds$ invariant.
    step1: TBD
    step2: TBD
  - id: 217
    kind: body
    source: |-
      Sign invariance is satisfied by every positive homogeneous function of degree $2m$ $(m = 1, 2, 3, \ldots)$. In the simple case $m = 1$, and the length element $ds$ is the square root of a homogeneous function of second degree, which can be expressed in the standard form

      $$\tag{24} ds = \left[ \sum_{i=1}^n (dx^{\,i}(p))^{2} \right]^{\bfrac{1}{2}}. $$
    step1: TBD
    step2: TBD
  - id: 218
