      [^note-58]: It should be noted that this characterization of Weyl’s problem of space is based on Coleman and Korté (2001), which differs radically from the commonly held view that can be found in, for example, Scheibe (1957, 1988), Laugwitz (1958) and Scholz (1999b, 2001). Coleman and Korté (2001) have argued that the commonly held view of Weyl’s problem of space had its origin in the work of Cartan, who got his understanding of what Weyl was doing from the French translation of the fourth edition of Weyl’s book *Raum-Zeit-Materie*. A detailed account of the commonly held view, together with an argument in favour of the view that Weyl’s problem of space was really concerned only with Finsler metrics, and that Cartan invented a different problem of space, which was concerned with $G$-structures instead, is given in §4.6, and §4.7 of Coleman and Korté (2001).

      It is interesting to note in this context that according to a recent article by Chern (1996), virtually all of the important theorems pertaining to Riemannian geometry have been extended to the setting of general Finsler metrics, and that Riemannian geometry, therefore, should be regarded merely as a special case of Finsler geometry.

