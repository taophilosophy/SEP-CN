      By this time Weyl had repudiated atomistic theories of the continuum, including that of Das Kontinuum.[^note-19] While intuitive considerations, together with Brouwer’s influence, must certainly have fuelled Weyl’s rejection of such theories, it also had a logical basis. For Weyl had come to regard as meaningless the formal procedure—employed in Das Kontinuum—of negating universal and existential statements concerning real numbers conceived as developing sequences or as sets of rationals. This had the effect of undermining the whole basis on which his theory had been erected, and at the same time rendered impossible the very formulation of a “law of excluded middle” for such statements. Thus Weyl found himself espousing a position[^note-20] considerably more radical than that of Brouwer, for whom negations of quantified statements had a perfectly clear constructive meaning, under which the law of excluded middle is simply not generally affirmable.
    step1: |-
      到这个时候，外尔已经摒弃了原子论的连续统理论，包括《连续统》中的那一理论。[^note-19] 虽然直观方面的考虑，加上布劳威尔的影响，必定为外尔对这类理论的拒斥提供了动力，但这种拒斥也有一个逻辑基础。因为外尔已开始认为，《连续统》中所使用的那种形式程序——即否定关于被设想为发展序列或有理数集合的实数的全称陈述与存在陈述——是无意义的。这产生了一个后果：动摇了他的理论赖以竖立的整个基础，同时使得为这类陈述制定“排中律”根本成为不可能。于是外尔发现自己所拥护的立场[^note-20]远比布劳威尔的立场激进：对布劳威尔来说，被量化陈述的否定具有完全清楚的构造性含义，在此含义下，排中律只是不普遍可肯定而已。
