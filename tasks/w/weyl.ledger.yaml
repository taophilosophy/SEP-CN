      [^note-76]: Sklar (1974, 229–233) has suggested that the problem of absolute acceleration arises because we tend to think of acceleration as a *dyadic* relation: something accelerates either with respect to some observable or unobservable entity. Sklar suggests that there is an alternative way to think of absolute acceleration, which, if adopted by the relationalist, will avoid the traditional relationalist difficulties concerning absolute acceleration. He proposes that we think of acceleration as a *monadic* relation so that “the expression ‘$A$ is absolutely accelerated’ is a complete assertion, as is, for example, ‘$A$ is red’….” It should be clear from the foregoing, however, that Sklar’s suggestion is incoherent within the context of GTR. The inhomogeneity of the transformation law of the 3-acceleration entails that an acceleration that is zero with respect to one coordinate system is not zero with respect to another coordinate system. Consequently, absolute nonacceleration conceived of as a monadic property is not a well defined concept because it is not a coordinate independent notion. A monadic property which can be transformed away by means of a passive coordinate transformation can hardly represent a brute, inexplicable fact about the world. However, the difference $\xi^{\alpha}_{2} - \Pi^{\alpha}_{2}(x^{i}, \xi^{\alpha}_{1})$ transforms linearly and homogeneously; consequently, the vanishing or non-vanishing of these *field-body relations* is coordinate independent.
