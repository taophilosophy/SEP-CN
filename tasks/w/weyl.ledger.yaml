      In §6 of *Das Kontinuum* Weyl presents his conclusions as to the relationship between the intuitive and mathematical continua. He poses the question: Does the mathematical framework he has erected provide an adequate representation of physical or temporal continuity as it is *actually experienced*? In posing this question we can see the continuing influence of Husserl and phenomenological doctrine. Weyl begins his investigation by noting that, according to his theory, if one asks whether a given function is continuous, the answer is not fixed once and for all, but is, rather, dependent on the extent of the domain of real numbers which have been defined up to the point at which the question is posed. Thus the continuity of a function must always remain *provisional*; the possibility always exists that a function deemed continuous *now* may, with the emergence of “new” real numbers, turn out to be discontinuous *in the future*. [^note-16]
    step1: |-
      在《连续统》第 6 节中，外尔陈述了他关于直观连续统与数学连续统之间关系的结论。他提出问题：他所竖立的数学框架，是否为*实际被经验的*物理连续性或时间连续性提供了充分的表示？在这个问题中，我们可以看到胡塞尔与现象学学说持续的影响。外尔以指出如下一点开始他的考察：按照他的理论，若问某一给定函数是否连续，答案并非一劳永逸地固定，而是取决于到问题提出之时为止已被定义的实数域的范围。因此，一个函数的连续性必须永远保持*暂定的*；始终存在这样的可能：某个*当下*被视为连续的函数，随着“新的”实数的出现，将来可能被发现是不连续的。[^note-16]
    step2: |-
      《连续统》第 6 节里，外尔陈述了他对直观连续统与数学连续统之关系的结论。他设问：他所竖立的数学框架，能否充分表示*实际被经验的*物理连续性或时间连续性？此问之中，胡塞尔与现象学学说的影响犹存。外尔的考察始于一点：依其理论，若问某个给定函数是否连续，答案并非一锤定音，而取决于至发问之刻为止已被定义的实数域之广狭。故函数的连续性永远只是*暂定的*：凡*当下*被视作连续者，随“新”实数之出现，来日或被发现不连续。[^note-16]
