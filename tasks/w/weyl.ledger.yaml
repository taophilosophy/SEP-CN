      [^note-70]: Einstein’s field equations for the metric tensor in matter-free regions are not linear. That is, the linear combination of two solutions to the field equations is not necessarily a solution. The gravitational field of a body can do work and therefore contains energy, and since it contains energy it must possess mass, which in turn creates an additional gravitational field. Consequently, the gravitational field *itself* contributes to its own source. This means that the gravitational field produced by two bodies is not simply the sum of the separate fields but also involves contributions from their interaction. Thus in providing solutions to *linearized* field equations the gravitational effects are simply considered as additive, thereby ignoring the effects which the gravitational field has on its own source.
