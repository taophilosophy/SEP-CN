      赫尔曼·外尔是 20 世纪一位伟大而多才多艺的数学家。他的研究范围极广，涵盖分析、代数、数论、拓扑、微分几何、时空理论、量子力学与数学基础。他的科学写作浸润着一种罕见的文学与艺术感受力——用他自己的话说，“表达与形态对我而言几乎比知识本身更重要”。在同时代的科学家与数学家中，他被唯心论哲学所吸引，这一点颇为罕见：其唯心论倾向尤其见于他在数学基础方面的工作。青年时代，康德的学说给他留下深刻印象；后来，他既受费希特形而上学唯心论的激发，也受胡塞尔现象学的激发。尽管外尔后来开始质疑唯心论所宣称的确定性，但他始终坚守最初从康德那里习得的直观优先性，以及费希特对这种优先性的表达——个体意识的“内在之光”。
