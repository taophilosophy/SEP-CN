      Weyl was first and foremost a mathematician, and certainly not a “professional” philosopher. But as a German intellectual of his time it was natural for him to regard philosophy as a pursuit to be taken seriously. In Weyl’s case, unusually even for a German mathematician, it was idealist philosophy that from the beginning played a significant role in his thought. Kant, Husserl, Fichte, and, later, Leibniz, were at various stages major influences on Weyl’s philosophical thinking. As a schoolboy Weyl had been impressed by Kant’s “Critique of Pure Reason.” He was especially taken with Kant’s doctrine that space and time are not inherent in the objects of the world, existing as such and independently of our awareness, but are, rather, forms of our intuition As he reports in Insight and Reflection, (Weyl 1955), his youthful enthusiasm for Kant crumbled soon after he entered Göttingen University in 1904. There he read Hilbert’s Foundations of Geometry, a tour-de-force of the axiomatic method, in comparison to which Kant’s “bondage to Euclidean geometry” now appeared to him naïve. After this philosophical reverse he lapsed into an indifferent positivism for a while. But in 1912 he found a new and exciting source of philosophical enlightenment in Husserl’s phenomenology.[^note-1] It was also at about this time that Fichte’s metaphysical idealism came to “capture his imagination.” Although Weyl later questioned idealist philosophy, and became dissatisfied with phenomenology, he remained faithful throughout his life to the primacy of intuition that he had first learned from Kant, and to the irreducibility of individual consciousness that had been confirmed in his view by Fichte and Husserl.
    step1: |-
      外尔首先是数学家，绝非“职业”哲学家。但作为他那个时代的德国知识分子，把哲学视为一门须认真对待的志业对他来说是自然的。在外尔身上——即便在德国数学家中也属罕见——自始便起重要作用的是唯心论哲学。康德、胡塞尔、费希特，以及后来的莱布尼茨，都在不同阶段对外尔的哲学思考产生过重大影响。还是学童时，外尔就对康德的《纯粹理性批判》印象深刻。他尤其服膺康德的学说：空间与时间并非内在于世界之物、作为自存者而独立于我们的觉察，而是我们直观的形式。正如他在《洞见与反思》（Weyl 1955）中所述，他 1904 年进入哥廷根大学后不久，对康德的少年热情便崩塌了。他在那里读到希尔伯特的《几何学基础》——公理方法的一部力作——与之相比，康德“对欧几里得几何的束缚”在他看来显得幼稚。这次哲学上的逆转之后，他一度陷入漠然的实证主义。但 1912 年，他在胡塞尔的现象学中找到了一个新的、令人兴奋的哲学启迪之源。[^note-1] 大约也在此时期，费希特的形而上学唯心论开始“攫住他的想象”。虽然外尔后来质疑唯心论哲学、并对现象学感到不满，但他终生忠于他最初从康德那里学到的直观优先性，以及在他看来已由费希特与胡塞尔所确证的个体意识之不可还原性。
