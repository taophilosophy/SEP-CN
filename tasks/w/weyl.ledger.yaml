      In early 1928 P. A. M. Dirac provided the first physically compelling theoretical account of the dynamics of an electron in the presence of an electric field. The components $\psi^{i} (x)$ of Dirac’s four-component wave function or *spinor field* in Minkowski space, $\psi(x) = (\psi^{1}(x), \psi^{2}(x), \psi^{3}(x), \psi^{4}(x))$, are complex-valued functions that satisfy Dirac’s first-order partial differential equation and provide probabilistic information about the electron’s dynamical behaviour, such as angular momentum and location. Prior to the appearance of *spinor fields* $\psi$ in Dirac’s equation, it was generally thought that scalars, vectors and tensors provided an adequate system of mathematical objects that would allow one to provide a mathematical description of reality independently of the choice of coordinates or reference frames.[^note-104] For example, spin zero particles $(\pi$ mesons, $\alpha$ particles) could be described by means of scalars; spin 1 particles (deuterons) by vectors, and spin 2 particles (hypothetical gravitons) by tensors. However, the most frequently occurring particles in Nature are electrons, protons, and neutrons. They are spin $\bfrac{1}{2}$ particles, called *fermions* that are properly described by mathematical objects called *spinors*, which are neither scalars, vectors or tensors.[^note-105] Weyl referred to the $\psi(x)$ in Dirac’s equation as the “Dirac quantity” and von Neumann called it the “$\psi(x)$-vector”. Both von Neumann and Weyl, and others, immediately recognized that Dirac had introduced something that was new in theoretical physics. v. Neumann (1928, 876) remarks:
    step1: TBD
    step2: TBD
  - id: 476
    kind: body
    source: |-
      > … $\psi$ does by no means have the relativistic transformation properties of a common four-vector. … The case of a quantity with four components that is not a four-vector is a case which has never occurred in relativity theory; the Dirac $\psi$-vector is the first example of this type.
    step1: TBD
    step2: TBD
  - id: 477
    kind: body
    source: |-
      (Weyl (1929c)) notes that the spinor representation of the orthogonal group $O(1, 3)$ cannot be extended to a representation of the general linear group $GL(n)$, $n = 4$, with the consequence that it is necessary to employ the *Vierbein*, *tetrad* or Lorentz-structure formulation of the theory of general relativity in order to incorporate Dirac’s spinor fields $\psi(x)$:
    step1: TBD
    step2: TBD
  - id: 478
    kind: body
    source: |-
      > The tensor calculus is not the proper mathematical instrument to use in translating the quantum-theoretic equations of the electron over into the *general theory of relativity.* Vectors and terms [tensors] are so constituted that the law which defines the transformation of their components from one Cartesian set of axes to another can be extended to the most general linear transformation, to an affine set of axes. That is not the case for quantity $\psi$, however; this kind of quantity belongs to a representation of the rotation group which cannot be extended to the affine group. Consequently we cannot introduce components of $\psi$ relative to an arbitrary coordinate system in general relativity as we can for the electromagnetic potential and field strengths. We must rather describe the metric at a point $p$ by local Cartesian axes $e(a)$ instead of by the $g_{pq}$. The wave field has definite components $\psi^{+}_{1}, \psi^{+}_{2}, \psi^{-}_{1}, \psi^{-}_{2}$ relative to such axes, and we know how they transform on transition to any other Cartesian axes in $p$.
    step1: TBD
    step2: TBD
