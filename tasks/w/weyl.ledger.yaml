      $$\tag{29} \Gamma^{i}_{jk} \rightarrow \overline{\Gamma}^{i}_{jk} = \Gamma^{i}_{jk} + \frac{1}{2}(\delta^{i}_{j}\theta_{k} + \delta^{i}_{k}\theta_{j} - g_{jk}g^{ir}\theta_{r}). $$
    step1: TBD
    step2: TBD
