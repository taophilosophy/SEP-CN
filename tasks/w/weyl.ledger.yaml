      Hilbert was unalterably opposed to any restriction of mathematics “by decree”, an obstacle he had come up against in the early stages of his career in the form of Leopold Kronecker’s (the influential 19ᵗʰ century German mathematician) anathematization of all mathematics venturing beyond the finite. In Brouwer’s intuitionistic program—with its draconian restrictions on what was admissible in mathematical argument, in particular, its rejection of the law of excluded middle, “pure” existence proofs, and virtually the whole of Cantorian set theory—Hilbert saw the return of Kroneckerian constaints on mathematics (and also, perhaps, a trace of du Bois-Reymond’s “ignorabimus”) against which he had struggled for so long. Small wonder, then, that Hilbert was upset when Weyl joined the Brouwerian camp.[^note-25]
    step1: |-
      希尔伯特坚决反对“奉令”对数学作任何限制；他在职业生涯早期就撞上过这样的障碍：利奥波德·克罗内克（那位有影响的 19 世纪德国数学家）对一切越出有限范围之数学的咒骂。在布劳威尔的直觉主义纲领里——它对数学论证中可容许之物的严苛限制，尤其它对排中律、“纯粹”存在证明以及几乎整个康托尔集合论的拒斥——希尔伯特看到了克罗内克式对数学的约束（或许还有杜·博瓦-雷蒙“ignorabimus”的余响）的重演，而他为反抗这些已奋斗良久。因此，当外尔加入布劳威尔阵营时，希尔伯特感到不快，也就不足为怪了。[^note-25]
    step2: |-
      希尔伯特毫不动摇地反对一切“奉令”而来的数学限制。他早年便撞上这类障碍：利奥波德·克罗内克——那位影响甚巨的 19 世纪德国数学家——曾咒骂一切越出有限之域的数学。在布劳威尔的直觉主义纲领里，他看到的是克罗内克式约束（或许还有杜·博瓦-雷蒙“ignorabimus”的余响）之复归：那纲领对数学论证所可容许者苛加限制，尤其拒斥排中律、“纯粹”存在证明与几乎整个康托尔集合论——而希尔伯特为此已抗争多年。故外尔一转投布劳威尔阵营，希尔伯特便大为不快，也就不奇怪了。[^note-25]
