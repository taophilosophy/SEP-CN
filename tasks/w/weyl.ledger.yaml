      [^note-52]: It is useful in this context to recall Einstein’s (1954) distinction between *principle*theories and *constructive* theories. The aim of a constructive theory, such as, for example, the kinetic theory of gases, is to reduce a wide class of diverse complex physical processes to simpler ones. On the other hand, a principle theories, such as, for example, the special and the general theories of relativity, postulate abstract structural constraints which events are held to satisfy. In order to exhibit the physical basis for the structural constraints, which a principle theory postulates certain events must satisfy, such structures contained in the mathematical model of the theory should have a link to physical experience. It must therefore be possible, at least in principle, to relate those structural constraints to experience in a way that is consistent with the theory. As Bohr and Rosenfeld (1933, 1950) suggest, any principle theory should satisfy the basic requirement of a *proper* or *complete* theory. According to Marzke and Wheeler (1964), Bohr and Rosenfeld “have stressed that every proper theory should provide in and by itself its own means for defining the quantities with which it deals. According to this principle, classical general relativity should admit to calibrations of space and time that are altogether free of any reference to the quantum of action.” That is, completeness requires that there is a link to physical experience of the various structures inherent in the mathematical model of a principle theory of spacetime, and that this link is realizable, by means of relatively simple physical probative systems which are themselves well defined within the classical spacetime theory, and which therefore can provide within the classical framework, at least in principle, epistemic access to the relevant structures postulated by the spacetime theory.
