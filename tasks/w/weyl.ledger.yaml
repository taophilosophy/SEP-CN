      Hilbert’s response was to develop an entirely new approach to the foundations of mathematics with the ultimate goal of establishing beyond doubt the consistency of the whole of classical mathematics, including arithmetic, analysis, and Cantorian set theory. With the attainment of that goal, classical mathematics would be placed securely beyond the destructive reach of the intuitionists. The core of Hilbert’s program was the translation of the whole apparatus of classical mathematical demonstration into a simple, finitistic framework (which he called “metamathematics”) involving nothing more, in principle, than the straightforward manipulation of symbols, taken in a purely formal sense, and devoid of further meaning.[^note-26] Within metamathematics itself, Hilbert imposed a standard of demonstrative evidence stricter even than that demanded by the intuitionists, a form of finitism rivalling (ironically) that of Kronecker. The demonstration of the consistency of classical mathematics was then to be achieved by showing, within the constraints of strict finitistic evidence insisted on by Hilbert, that the formal metamathematical counterpart of a classical proof in that system can never lead to an assertion evidently false, such as $0 = 1$.
    step1: |-
      希尔伯特的回应是发展一种全新的数学基础进路，其最终目标在于毋庸置疑地确立整个古典数学——包括算术、分析与康托尔集合论——的一致性。一旦达到这一目标，古典数学便被稳妥地置于直觉主义者破坏性力量所不及之处。希尔伯特纲领的核心，是把整个古典数学论证装置翻译进一个简单、有限论的框架（他称之为“元数学”），原则上只涉及对符号的直接操作；这些符号取纯粹形式意义，不帶任何进一步含义。[^note-26] 在元数学本身之内，希尔伯特施加了比直觉主义者所要求的更为严格的证明明证性标准，一种（吊诡地）堪与克罗内克相匹敌的有限论。古典数学一致性的证明，于是应当如此达成：在希尔伯特所坚持的严格有限论明证性的限制之内，表明该系统中一个古典证明的形式化元数学对应物永不能导致明显虚假的断言，例如 $0 = 1$。
    step2: |-
      希尔伯特的回应是另辟一条全新的数学基础进路，最终目标在于毋庸置疑地确立整个古典数学——算术、分析与康托尔集合论在内——的一致性。此目标既达，古典数学便稳坐于直觉主义者破坏之力所不能及之地。纲领的核心是把整个古典数学论证装置译入一个简单、有限论的框架（他称之为“元数学”），原则上只是对符号的径直操作，符号纯取形式意义，不涉任何进一步含义。[^note-26] 在元数学内部，希尔伯特所定的证明明证性标准甚至比直觉主义者更苛，形成一种（吊诡地）足与克罗内克相匹的有限论。古典数学之一致性证明遂当如此达成：在他所坚持的严格有限论明证性之内，表明该系统中任一古典证明的形式化元数学对应物永不能导出显然为假的断言，例如 $0 = 1$。
