      Weyl’s point is that while space and time exist within the realm of conscious experience, or, according to Kant, as $a$ *priori*forms underlying all of our conscious experiences, they are unsuited as elements with which to construct the objective world and must be replaced by means of a purely arithmetical symbolic representation. All that we are left with, according to Weyl, is symbolic construction. If this still needed any confirmation, Weyl (1948, 313) says, it was provided by the theory of relativity and quantum theory.[^note-116] For ease of reference we repeat a citation of Weyl (1988, 4–5) in §4.3.1:
    step1: TBD
    step2: TBD
  - id: 546
    kind: body
