      A year after Einstein (1916) had established the field equations of his new general theory of relativity, Einstein (1917) applied his theory for the first time to cosmology. In doing so, Einstein made several assumptions:
    step1: TBD
    step2: TBD
  - id: 374
    kind: body
    source: |-
      **Cosmological Principle:** Like Newton, Einstein assumed that the universe is *homogeneous* and *isotropic* in its distribution of matter.
    step1: TBD
    step2: TBD
  - id: 375
    kind: body
    source: |-
      **Static Universe:** Einstein assumed, as did Newton and most cosmologists at that time, that the universe is static on the large scale.
    step1: TBD
    step2: TBD
  - id: 376
    kind: body
    source: |-
      **Mach’s Principle:** Einstein believed that the metric field is completely determined through the masses of bodies. The metric field is determined through the energy-momentum tensor of the field equations.
    step1: TBD
    step2: TBD
  - id: 377
    kind: body
    source: |-
      The *cosmological principle* continuous to play an important role in cosmological modelling to this day. However, Einstein’s second assumption that the universe is static was in conflict with his field equations, which permitted models of the universe that were homogeneous and isotropic, but *not static*. In this regard, Einstein’s difficulties were essentially the same that Newton had faced: A static Newtonian model involving an infinite container with an infinite number of stars was unstable; that is, local regions would collapse under gravity. Because Einstein was committed to Mach’s Principle he faced a problem concerning the *boundary conditions* for *infinite* space containing *finite*amount of matter.[^note-82] Einstein recognized that it was impossible to choose boundary conditions such that the ten potentials of the metric $g_{ij}$ are completely determined by the energy-momentum tensor $T_{ij}$, as required by Mach’s Principle. That is, the boundary conditions “flat at infinity” entail a *global inertial frame* that is tied to *empty flat space at infinity*, and hence is unrelated to the mass-energy content of space, contrary to Mach’s Principle, according to which *only* mass-energy can influence inertia.
    step1: TBD
    step2: TBD
  - id: 378
    kind: body
    source: |-
      Einstein thought that he could solve the difficulties of an unstable non-static universe with boundary conditions at infinity that do not satisfy Mach’s Principle, by introducing the cosmological term $\Lambda$ into his field equations. He showed that for positive values of the cosmological constant, his modified field equation admitted a solution for a static[^note-83] universe in which space is curved, unbounded and finite; that is, space is a hyper surface of a *sphere in four* *dimensions*. Einstein’s spatially closed universe is often referred to as Einstein’s “cylinder” world: with two of the spatial dimensions suppressed, the model universe can be pictured as a cylinder where the radius $A$ represents the space and the axis the time coordinate.
    step1: TBD
    step2: TBD
