      外尔的程序因而归结如下。在第一步中，一个给定的构形被施以变化。随后人们识别出该构形在变化下保持不变的那些特征——即*不变的*特征；这些特征又通过一个实体化过程被视为某个不变基底——即“事物本身”——的属性。正是这类特征的不变性，使它们（以及“事物本身”）能够被外尔在第二步中引入的那些“抗时间”的符号所表示。作为（书写下来的）符号，它们可以在没有时间失真的情况下被交流，并可以被无限制地操作而不致退化。正是由此获得的灵活性，使符号的使用能够与实在相符合。然而（第三步）符号并非针对当下刺激而被随意创造；它们是以一种有结构却又自由择取的方式被引入的，这种方式反映着一个底层秩序的观念——即“唯一真实的世界”——关于它并非一切都已知晓、也不可能已知晓，它像未来一样“向无限敞开”。外尔指出，符号建构程序中隐含的实体化不可避免地导致该程序的迭代，因为“从一个步骤到下一个步骤的过渡之所以必要，是由于一个步骤上的对象显露自身为一种更高实在、即下一个步骤的实在的显现”（Weyl (1934), 32–33）。但最终“系统的科学解释将最终颠倒这一秩序：它首先自行竖立起它的符号世界，不作任何指涉，然后跳过一切中间步骤，试图描述哪些符号构形导向哪些意识材料”（*同上*）。这样一来，符号世界便（错误地）与超越世界相等同。
