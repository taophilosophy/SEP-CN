      Riemann’s ideas were brought to a concrete realization fifty years later in Einstein’s general theory of relativity. The basic idea underlying the general theory of relativity was Einstein’s recognition that the metric field, which has such powerful real effects on matter, cannot be a rigid once and for all given geometric structure of the spacetime, but must itself be something real, that not only has effects on matter, but is in turn also affected by matter. Riemann had already suggested that analogous to the electromagnetic field, the metric field reciprocally interacts with matter. Einstein came to this idea of reciprocity between matter and field independently of Riemann, and in the context of his theory of general relativity, applied this principle of reciprocity to four dimensional spacetime. Thus Einstein could adopt Riemann’s infinitesimal geometry with the important difference: given the causal requirements of Einstein’s theory of special relativity, Riemann’s quadratic form is not positive definite but indefinite; it has signature 1.[^note-38] Weyl (1922a) says:
    step1: |-
      黎曼的观念在五十年后由爱因斯坦的广义相对论得到了具体实现。广义相对论的基本观念，是爱因斯坦认识到：对物质有如此强大实在效应的度规场，不可能是一成不变地被给予的时空几何刚性结构，而本身必须是某种实在的东西——它不仅作用于物质，而且反过来也受物质影响。黎曼早已提示，度规场可类比于电磁场而与物质相互作用。爱因斯坦独立于黎曼达到这种物质与场相互作用的观念，并在其广义相对论的语境中把这一相互作用原理应用于四维时空。于是爱因斯坦可以采用黎曼的无穷小几何，但有重要差别：鉴于狭义相对论的因果要求，黎曼的二次型不是正定的而是不定的；其符号差为 1。[^note-38] 外尔（1922a）说：
    step2: |-
      五十年后，黎曼的观念在爱因斯坦的广义相对论中获得具体实现。广义相对论的基本观念，在于爱因斯坦认识到：度规场对物质有如此强大的实在效应，它便不可能是一劳永逸地被给予的时空刚性几何结构，其本身必是某种实在之物——不但作用于物质，亦反过来受物质影响。黎曼已然提示：度规场可如电磁场那样与物质相互交感。爱因斯坦独立于黎曼得此交感之见，并在广义相对论语境中把它施于四维时空。于是爱因斯坦可采黎曼的无穷小几何，然有一重要差异：鉴于狭义相对论的因果要求，黎曼的二次型非正定而不定，其符号差为 1。[^note-38] 外尔（1922a）说：
