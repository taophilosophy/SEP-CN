      As Weyl saw it, there is an unbridgeable gap between intuitively given continua (e.g. those of space, time and motion) on the one hand, and the “discrete” exact concepts of mathematics (e.g. that of natural number[^note-13]) on the other. The presence of this chasm meant that the construction of the mathematical continuum could not simply be “read off” from intuition. It followed, in Weyl’s view, that the mathematical continuum must be treated as if it were an element of the transcendent realm, and so, in the end, justified in the same way as a physical theory. It was not enough that the mathematical theory be *consistent*; it must also be *reasonable*.
    step1: |-
      在外尔看来，直观地被给予的连续统（如空间、时间与运动的连续统）与数学的“离散的”精确概念（如自然数概念[^note-13]）之间，存在一道无法架桥的鸿沟。这一鸿沟的存在意味着，数学连续统的建构不能简单地从直观中“读出”。外尔由此得出结论：数学连续统必须被当作超越领域的一个要素来处理，因而最终要像物理理论一样得到辩护。数学理论仅仅*一致*还不够；它还必须是*合理的*。
    step2: |-
      在外尔看来，直观所予的连续统（如空间、时间与运动的连续统）与数学的“离散”精确概念（如自然数概念[^note-13]）之间横着一道无法弥合的鸿沟。有此鸿沟，数学连续统的建构便不能径直从直观中“读出”。外尔由此断言：数学连续统须被视作超越领域之一员，最终须像物理理论那样得到辩护；数学理论仅只*一致*尚不足够，还须*合理*。
