    source: |-
      Riemann assumed the validity of the Pythagorean metric only in the infinitely small. Riemannian geometry is essentially a geometry of infinitely near points and conforms to the requirement that all laws are to be formulated as *field* laws. Field laws are *close-action-laws* which relate the field magnitudes only to infinitesimally neighbouring points in space.[^note-35] The value of some field magnitude at each point depends only on the values of other field magnitudes in the infinitesimal neighbourhoods of the corresponding points. The field magnitudes consist of partial derivatives of position functions at some point, and this requires the knowledge of the behavior of the position functions only with respect to the neighbourhood of that point[^note-36] To construct a field law, only the behavior of the world in the infinitesimally small is required.[^note-37]
    step1: |-
      黎曼只在无穷小范围内假定毕达哥拉斯度规有效。黎曼几何本质上是无穷邻近点的几何，并符合这样一项要求：一切定律均须表述为*场*定律。场定律是*近距作用定律*，它们只把场量联系于空间中的无穷邻近点。[^note-35] 某一场量在每一点的值，只取决于相应点无穷小邻域内其他场量的值。场量由某点上位置函数的偏导数构成，而这要求仅就该点邻域了解位置函数的行为[^note-36]。要构造一条场定律，只需世界在无穷小范围内的行为。[^note-37]
    step2: |-
      黎曼仅于无穷小范围假定毕达哥拉斯度规成立。黎曼几何实质上是无穷邻近点之几何，且合于如下要求：一切定律皆须表述为*场*定律。场定律即*近距作用定律*，只将场量联系于空间中的无穷邻近点。[^note-35] 场量在某点之值，仅取决于相应点的无穷小邻域内其他场量之值。场量由某点上位置函数的偏导数构成，故只需了解位置函数在该点邻域内的行为[^note-36]。欲构造场定律，唯需世界在无穷小范围内的行为。[^note-37]
