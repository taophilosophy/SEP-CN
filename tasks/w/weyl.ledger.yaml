      [^note-47]: Many commentators – eg., Ryckman (2005, chapter 6, and 2020) – have argued and emphasized that Husserl’s phenomenology was a decisive factor that led Weyl to his construction of a pure infinitesimal geometry. Other commentators disagree. Drawing on Scholz (2001, 97), McCoy (2022) argues that it was the Göttingen mathematical—physics tradition, in particular Riemann — its key figure, which played a central role in Weyl’s construction of a pure infinitesimal geometry. Afriat (2009, 2019) argues that Weyl’s theory of gravitation and electricity derives from ‘mathematical justice’, namely, the equal rights of direction and length. As Weyl observes (see above citation), if it is not reasonable to assume integrability for the transfer of direction, then it is likewise not reasonable, aside from historical considerations, to make the integrability assumption in the case of length–transfer.

      One might in this context also recur to Hans Reichenbach’s (1938, 1968) (see also Schickore and Steinle (2006)) important distinction between “the context of discovery ” and “the context of justification.” While Husserl’s phenomenology may well have played a role in Weyl’s discovery of a pure infinitesimal geometry and gauge invariance, it does not follow that it also played a role in Weyl’s justification of them. In subsequent scientific publications, including his reply to Einstein’s critique, Weyl’s justification of his unification attempt adduces only mathematical and physical, and not phenomenological reasons. It is not unreasonable to suggest, therefore, that Weyl, or for that matter any other competent mathematician or physicist, would have discovered a pure infinitesimal geometry and gauge theory, without any knowledge of or exposure to Husserl’s phenmenology.

      It is interesting to note that aesthetic reasons also played a justificatory role for Weyl. In his obituary of Weyl, Freeman Dyson (1956) says that Weyl once said to him, half jokingly, “My work always tried to unite the true with the beautiful; but when I had to choose one or the other, I usually chose the beautiful.” Subrahmanyan Chandrasekhar (1987, 66) tells us that he once inquired of Dyson

      > whether Weyl had given an example of his having sacrificed truth for beauty. I learned that the example which Weyl gave was his gauge theory of gravitation … Apparently, Weyl became convinced that this theory was not true as a theory of gravitation; but still it was so beautiful that he did not wish to abandon it and so he kept it alive for the sake of its beauty. But much later, it did turn out that Weyl’s instinct was right after all, when the formalism of gauge invariance was incorporated into quantum electrodynamics.
      >
      > Another example which Weyl did not mention, but to which Dyson drew attention, is Weyl’s two-component relativistic wave equation of the neutrino. Weyl discovered this equation and the physicists ignored it for some thirty years because it violated parity invariance. And again, it turned out that Weyl’s instincts were right.
