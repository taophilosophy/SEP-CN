      Weyl’s major contribution to cosmology is known as “Weyl’s Hypothesis”. The name was coined by Weyl (1926d) himself in an article in the *Encyclopedia of* *Britannica*.[^note-69] According to Weyl’s Postulate, the worldlines of all galaxies are non-intersecting diverging geodesics that have a common origin in the distant past. From this system of worldlines Weyl derived a common cosmic time. On the basis of his postulate, Weyl (1923c, Appendix III) was also the first to show that there is an approximately *linear* relation between the redshift of galactic spectra and distance. Weyl had basically discovered *Hubble’s Law* six years prior to Hubble’s formulation of it in 1929. Another contribution to cosmology is Weyl’s (1919b) spherically symmetric static exact solution to Einstein’s linearized[^note-70] field equations.
