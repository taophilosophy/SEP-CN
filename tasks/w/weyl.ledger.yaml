      Above and beyond the claims of logic, Weyl welcomed Brouwer’s construction of the continuum by means of sequences generated by free acts of choice, thus identifying it as a “medium of free Becoming” which “does not dissolve into a set of real numbers as finished entities”. Weyl felt that Brouwer, through his doctrine of Intuitionism[^note-21], had come closer than anyone else to bridging that “unbridgeable chasm” between the intuitive and mathematical continua. In particular, he found compelling the fact that the Brouwerian continuum is not the union of two disjoint nonempty parts—that it is, in a word, indecomposable. “A genuine continuum,” Weyl says, “cannot be divided into separate fragments.”[^note-22] In later publications he expresses this more colourfully by quoting Anaxagoras to the effect that a continuum “defies the chopping off of its parts with a hatchet.”
    step1: |-
      在逻辑的要求之上，外尔欢迎布劳威尔以自由选择行为所生成的序列来构造连续统，从而把它认定为一个“自由生成之媒介”，它“并不消解为一组作为完成实体的实数”。外尔感到，布劳威尔凭借直觉主义学说[^note-21]，比任何人都更接近于架起直观连续统与数学连续统之间那道“无法架桥的鸿沟”。特别是，布劳威尔的连续统不是两个不相交的非空部分之和——一言以蔽之，它是不可分解的——这一事实使外尔深受说服。外尔说：“一个真正的连续统不能切割为分离的碎片。”[^note-22] 在后来的出版物中，他更生动地引用阿那克萨戈拉的话来表达这一点：连续统“抗拒用斧头砍下它的部分”。
    step2: |-
      除逻辑的要求外，外尔更欢迎布劳威尔以自由选择行为生成的序列构造连续统，把它认作“自由生成之媒介”，它“并不消解为作为完成实体的实数之集”。外尔感到，布劳威尔凭其直觉主义学说[^note-21]，比任何人都更近乎架通直观连续统与数学连续统之间那道“无法架桥的鸿沟”。尤其令他信服的是：布劳威尔式连续统不是两个不相交非空部分之和——一言以蔽之，不可分解。“真正的连续统不容劈成分离的碎片。”[^note-22] 后来的著作里，他引阿那克萨戈拉之语说得更为生动：连续统“抗拒斧头砍去其部分”。
