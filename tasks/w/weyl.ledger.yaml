    source: |-
      After Einstein applied Riemannian geometry to his theory of general relativity, Riemannian geometry became the focus of intense research. In particular, G. Ricci and T. Levi-Civita’s so-called *Absolute Differential Calculus* developed and clarified the Riemannian notions of an *affine connection* and *covariant differentiation*. The decisive step in this development, however, was T. Levi-Civita’s discovery in 1917 of the concept of *infinitesimal parallel vector displacement*, and the fact that such parallel vector displacement is uniquely determined by the metric field of Riemannian geometry. Levi-Civita’s construction of infinitesimal parallel transport on a manifold required the process of embedding the manifold into a flat higher-dimensional metric space. In 1918, Weyl generalized Levi-Civita’s concept of parallel transport by means of an *intrinsic* construction that does not require the process of such an embedding, and is therefore independent of a metric. Weyl’s intrinsic construction results in a *metric-independent, symmetric linear connection*. Weyl simply referred to the latter as *affine* *connection*.[^note-39]
    step1: |-
      在爱因斯坦把黎曼几何应用于其广义相对论之后，黎曼几何成为密集研究的焦点。特别是 G. 里奇与 T. 莱维-奇维塔所谓的*绝对微分学*，发展并澄清了黎曼几何中*仿射联络*与*协变微分*的概念。然而这一发展中决定性的步骤，是 T. 莱维-奇维塔 1917 年对*无穷小平行矢量位移*这一概念的发现，以及这样一个事实：此种平行矢量位移由黎曼几何的度规场唯一确定。莱维-奇维塔对流形上无穷小平行移动的构造，需要把流形嵌入一个平坦的高维度规空间的过程。1918 年，外尔以一种*内蕴的*构造推广了莱维-奇维塔的平行移动概念，这种构造不需要这样的嵌入过程，因而独立于度规。外尔的内蕴构造得出一个*度规无关的、对称的线性联络*。外尔径称之为*仿射联络*。[^note-39]
    step2: |-
      爱因斯坦把黎曼几何用于广义相对论之后，黎曼几何遂成密集研究之焦点。尤以 G. 里奇与 T. 莱维-奇维塔的所谓*绝对微分学*，发展并厘清了黎曼几何中*仿射联络*与*协变微分*的概念。然而此一发展中决定性的一步，是 T. 莱维-奇维塔 1917 年发现*无穷小平行矢量位移*概念，并揭明此种平行矢量位移由黎曼几何的度规场唯一确定。莱维-奇维塔对流形上无穷小平行移动的构造，须经把流形嵌入一平坦高维度规空间之过程。1918 年，外尔以*内蕴的*构造推广了平行移动概念——此构造无需嵌入，因而独立于度规。外尔的内蕴构造给出*一个与度规无关的对称线性联络*，他径称之为*仿射联络*。[^note-39]
