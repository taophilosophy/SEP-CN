      Weyl also agreed with Brouwer that all functions everywhere defined on a continuum are continuous, but here certain subtle differences of viewpoint emerge. Weyl contends that what mathematicians had taken to be discontinuous functions actually consist of several continuous functions defined on separated continua. In Weyl’s view, for example, the “discontinuous” function defined by $f(x) = 0$ for $x \lt 0$ and $f(x) = 1$ for $x \ge 0$ in fact consists of the *two* functions with constant values and 1 respectively defined on the separated continua $\{x: x \lt 0\}$ and $\{x: x \ge 0\}$. (The union of these two continua fails to be the whole of the real continuum because of the failure of the law of excluded middle: it is not the case that, for be any real number $x$, either $x \lt 0$ or $x \ge 0$.) Brouwer, on the other hand, had not dismissed the possibility that discontinuous functions could be defined on proper parts of a continuum, and still seems to have been searching for an appropriate way of formulating this idea.[^note-23] In particular, at that time Brouwer would probably have been inclined to regard the above function $f$ as a genuinely discontinuous function defined on a proper part of the real continuum. For Weyl, it seems to have been a self-evident fact that all functions defined on a continuum are continuous, but this is because Weyl confines attention to functions which turn out to be continuous by definition. Brouwer’s concept of function is less restrictive than Weyl’s and it is by no means immediately evident that such functions must always be continuous.
    step1: |-
      外尔也同意布劳威尔的看法：在连续统上处处定义的一切函数都是连续的，但在这一点上出现了一些微妙的观点差异。外尔主张，数学家先前当作不连续函数的东西，实际上是由分别定义在分离连续统上的几个连续函数构成的。例如，在外尔看来，由 $f(x) = 0$（当 $x \lt 0$）与 $f(x) = 1$（当 $x \ge 0$）所定义的“不连续”函数，实际上由常值为 0 与 1 的这两个函数构成，二者分别定义在分离的连续统 $\{x: x \lt 0\}$ 与 $\{x: x \ge 0\}$ 上。（之所以这两个连续统之和不是整个实连续统，是因为排中律的失效：并非对任何实数 $x$，都有 $x \lt 0$ 或 $x \ge 0$。）另一方面，布劳威尔并不排除在不连续函数可以在连续统的真部分上被定义的可能性，而且看来他仍在寻找表述这一想法的适当方式。[^note-23] 特别是，那时的布劳威尔大概倾向于把上面的函数 $f$ 视为定义在实连续统的一个真部分上的真正不连续的函数。对外尔来说，一切定义在连续统上的函数都是连续的，这似乎是不言自明的事实，但这是因为外尔把注意力限于那些按定义便是连续的函数。布劳威尔的函数概念没有外尔的那么受限，而这类函数是否必定连续，绝非一目了然。
    step2: |-
      外尔同样同意布劳威尔：在连续统上处处定义的函数皆连续；不过此处显出若干微妙的观点差异。外尔主张，数学家昔日视为不连续的函数，实为几个分别定义在分离连续统上的连续函数。例如在他看来，由 $f(x) = 0$（$x \lt 0$ 时）与 $f(x) = 1$（$x \ge 0$ 时）定义的“不连续”函数，其实是由常值为 0 与 1 的*两个*函数构成，分别定义于分离的连续统 $\{x: x \lt 0\}$ 与 $\{x: x \ge 0\}$。（这两个连续统之和之所以不是整个实连续统，正因排中律失效：并非对任何实数 $x$ 都有 $x \lt 0$ 或 $x \ge 0$。）布劳威尔则未排除不连续函数可在连续统的真部分上定义的可能，且似乎仍在寻找表述此想的适当方式。[^note-23] 当时他多半会把上述函数 $f$ 看作定义在实连续统某一真部分上、真正不连续的函数。对外尔而言，“连续统上定义的一切函数皆连续”貌似不言自明，但这是因为他把论域限定在那些依定义即连续的函数上。布劳威尔的函数概念较少限制，此类函数是否必然连续，就绝非一目了然了。
