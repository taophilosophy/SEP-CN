      Extending and abstracting from Gauss’s treatment of curved surfaces in Euclidian space, Riemann constructed an infinitesimal geometry of $n$-dimensional manifolds. The coordinate assignments $x^{k}(p)\ [k \in \{1, \ldots ,n\}$] of the points $p$ in such an $n$-dimensional Riemannian manifold are quite arbitrary, subject only to the requirement of arbitrary differential coordinate transformations.[^note-33] Riemann’s assumption that in an infinitesimal neighbourhood of a point, Euclidean geometry and hence Pythagoras’s theorem holds, finds its formal expression in Riemann’s equation

      $$\tag{1} ds^2 = \sum_{i,j} g_{ij}(x^{k}(p))dx^{i}dx^{j}\ [\text{where } g_{ij}(x^{k}(p)) = g_{ji}(x^{k}(p))] $$
    step1: |-
      把高斯关于欧几里得空间中曲面的处理加以扩展与抽象，黎曼构造了 $n$ 维流形的无穷小几何。在此种 $n$ 维黎曼流形中，点 $p$ 的坐标指定 $x^{k}(p)\ [k \in \{1, \ldots ,n\}$] 相当任意，只受任意微分坐标变换这一要求的约束。[^note-33] 黎曼假定在一点的无穷小邻域内欧几里得几何从而毕达哥拉斯定理成立，这一假定在黎曼方程中得到其形式表达：

      $$\tag{1} ds^2 = \sum_{i,j} g_{ij}(x^{k}(p))dx^{i}dx^{j}\ [\text{where } g_{ij}(x^{k}(p)) = g_{ji}(x^{k}(p))] $$
    step2: |-
      黎曼把高斯关于欧氏空间中曲面的处理加以推广与抽象，构造出 $n$ 维流形的无穷小几何。此类 $n$ 维黎曼流形中，点 $p$ 的坐标指定 $x^{k}(p)\ [k \in \{1, \ldots ,n\}$] 完全任意，仅受任意微分坐标变换这一要求之约束。[^note-33] 黎曼假定：在一点的无穷小邻域内欧氏几何成立、从而毕达哥拉斯定理成立；此假定于其方程的如下形式中得到表达：

      $$\tag{1} ds^2 = \sum_{i,j} g_{ij}(x^{k}(p))dx^{i}dx^{j}\ [\text{where } g_{ij}(x^{k}(p)) = g_{ji}(x^{k}(p))] $$
