      #### 4.3.3 The Ehlers, Pirani, Schild Construction of the Causal-Inertial Method
    step1: TBD
    step2: TBD
  - id: 295
    kind: body
    source: |-
      Ehlers et al. (1972) generalized Weyl’s causal-inertial method by deriving the metric field *directly* from the conformal and projective fields and derived a unique pseudo-Riemannian spacetime metric solely as a consequence of a set of natural, physically well-motivated, constructive, “geometry-free” axioms concerning the incidence and differential properties of light propagation and free (fall) motion. Ehlers, Pirani and Schild adopt Reichenbach’s (1924) term, *constructive axiomatics* to describe the nature of their approach. The “geometry-free” axioms are propositions about a few general qualitative assumptions concerning free (fall) motion and light propagation that can be verified directly through experience in a way that does not presuppose the full blown edifice of the general theory of relativity. From these axioms, the theoretical basis of the theory is reconstructed step by step.
    step1: TBD
    step2: TBD
  - id: 296
    kind: body
    source: |-
      The constructive axiomatic approach to spacetime structure is roughly this:
    step1: TBD
    step2: TBD
  - id: 297
    kind: body
    source: |-
      1. **Primitive Notions.**The constructive axiomatic approach is based on a triple of sets $$ \langle M, \mathcal{P}, \mathcal{L}\rangle $$ of objects corresponding respectively to the notions of *events, particle paths* and *light rays*, which are taken as primitive. The set $M$ of events is assumed to have a Hausdorff topology with a countable basis in order to state local axioms through the use of such terms as “neighborhood”. Members of the sets $\mathcal{P} = \{P, Q, P_{1}, Q_{1}, \ldots \}$ and $\mathcal{L} = \{ L, N, L_{1}, N_{1}, \ldots \}$ are subsets of $M$ that represent the possible or actual paths of massive particles and light rays in spacetime.
      2. **Differential Structure.** The differential structure is not presupposed; rather through the first few axioms a differential-manifold structure is introduced on the set of events $M$ that is sufficient for the localization of events by means of local coordinates, such as radar coordinates. Once $M$ is given a differential-manifold structure through the introduction of local radar coordinates by means of particles and light rays (such that any two radar coordinates are smoothly related to one another), one can do calculus on $M$ and one may speak of tangent and direction spaces. It is important to emphasize that the members of $\mathcal{P}$ represent possible or actual paths of *arbitrary* massive particles that may have some internal structure such as higher order gravitational and electromagnetic multipole moments and that may therefore interact in complicated ways with various physical fields. In order to constructively establish the projective structure of spacetime, it is necessary to single out a subset of $\mathcal{P}$, namely $\mathcal{P}_{f}$, the set of possible or actual paths of spherically symmetric, electrically neutral particles (that is, the world lines of freely falling particles). However, the set $\mathcal{P}_{f} \subset \mathcal{P}$, can be properly characterized only after a coordinate system (differential structure) is available. *Consequently, one must employ* arbitrary*particles in the statement of those axioms that lead to the local differential structure of spacetime.*
      3. **Second-Order Conformal Structure.** The *Law of Causality* asserts the existence of a unique first-order conformal structure on spacetime (27), that is, a field of infinitesimal light cones. Only null one-directions are determined. Therefore no special choice of parameters along light rays is determined by this structure. The first-order conformal structure can be measured using only the local differential-topological structure. Moreover, by a purely mathematical process involving only differentiation, the first-order conformal structure determines a second-order conformal structure, namely, an equivalence class $K$ of conformally related symmetric linear connections.
      4. **Projective Structure.** The motions of freely falling particles governed by the guiding field reveal the geodesics of spacetime, that is, the geodesics corresponding to an equivalence class $\Pi$ of projectively equivalent symmetric linear connections. Only geodesic one-directions are determined, that is, no special choice of parameters is involved in characterizing free fall motion.
      5. **Compatibility between the Conformal and Projective Structures.** That the conformal and projective structures are compatible is suggested by high energy experiments, according to Ehlers, Pirani and Schild: “A massive particle $(m \gt 0)$, though always slower than a photon, can be made to chase a photon arbitrarily closely.” Ehlers, Pirani and Schild therefore assume an axiom of compatibility between the conformal and projective structures, and this leads to a *Weyl space*: If the projective and conformal structures are compatible, then the intersection $$ \Pi \cap K = \Gamma\ \text{ (Weyl connection)} $$ of the equivalence class $K$ of conformally equivalent symmetric linear connections, and the equivalence class $\Pi$ of projectively equivalent symmetric linear connections, contains a unique symmetric linear connection, a *Weyl connection*. Thus light propagation and free (fall) motion reveal on spacetime a unique Weyl connection which determines the parallel transport of vectors, preserving their timelike, null or spacelike character, and for any pair of non-null vectors, the Weyl connection leaves invariant the ratio of their lengths and the angle between them, provided the vectors are transported along the same path.
      6. **Pseudo-Riemannian Metric.**Since length transfer is non-integrable (i.e., path-dependent) in a Weyl space, a Weyl geometry reduces to a pseudo-Riemannian geometry if and only if Weyl’s *length-curvature* (*Streckenkrümmung*) tensor equals zero, in which case the length of a vector is path-independent under parallel transport, and there exists no second clock effect.
