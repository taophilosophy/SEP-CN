      Hilbert’s program rested on the insight that, *au fond*, the only part of mathematics whose reliability is entirely beyond question is the *finitistic*, or *concrete* part: in particular, finite manipulation of surveyable domains of distinct objects including mathematical symbols presented as marks on paper. Mathematical propositions referring only to concrete objects in this sense Hilbert called *real*, *concrete*, or *contentual* propositions, and all other mathematical propositions he distinguished as possessing an *ideal*, or *abstract* character. (Thus, for example, $2 + 2 = 4$ would count as a real proposition, while *there exists an odd perfect number* would count as an ideal one.) Hilbert viewed ideal propositions as akin to the ideal lines and points “at infinity” of projective geometry. Just as the use of these does not violate any truths of the “concrete” geometry of the usual Cartesian plane, so he hoped to show that the use of ideal propositions—even those of Cantorian set theory—would never lead to falsehoods among the real propositions, that, in other words, such use *would never contradict any self-evident fact about concrete objects*. Establishing this by strictly concrete, and so unimpeachable means was thus the central aim of Hilbert’s program. Hilbert may be seen to have followed Kant in attempting to ground mathematics on the apprehension of spatiotemporal configurations; but Hilbert restricted these configurations to concrete signs (such as inscriptions on paper). Hilbert regarded consistency as the touchstone of existence, and so for him the important thing was the fact that no inconsistencies can arise within the realm of concrete signs, since correct descriptions of concrete objects are always mutually compatible. In particular, within the realm of concrete signs, actual infinity cannot generate inconsistencies since, again along with Kant, he held that this concept cannot correspond to any concrete object. Hilbert’s view seems accordingly to have been that the formal soundness of mathematics issues ultimately, not from a *logical* source, but from a *concrete* one[^note-27], in much the same way as the consistency of truly reported empirical statements is guaranteed by the concreteness of the external world[^note-28].
    step1: |-
      希尔伯特纲领立足于这样一个洞见：从根本上说（*au fond*），数学中其可靠性完全无可置疑的唯有一部分，即*有限论的*、或*具体的*部分：尤其是指对可通览的、由诸个不同对象（其中包括作为纸上记号呈现的数学符号）构成的域的有限操作。希尔伯特把仅涉及此种意义上的具体对象的数学命题称为*实在的*、*具体的*或*内容的*命题，而把其余一切数学命题区分为具有*理想的*或*抽象的*性格者。（因此，例如 $2 + 2 = 4$ 会被算作一个实在命题，而*存在一个奇完全数*则会被算作一个理想命题。）希尔伯特把理想命题看作类似于射影几何中“无穷远处”的理想直线与理想点。正如使用这些理想元素并不违反通常笛卡尔平面的“具体”几何的任何真理，他希望能表明：使用理想命题——即便是康托尔集合论的那些命题——也绝不会在实在命题中导致虚假，换言之，这种使用*绝不会与关于具体对象的任何自明事实相矛盾*。以严格具体、因而无可指摘的手段确立这一点，正是希尔伯特纲领的中心目标。可以说，希尔伯特追随康德，试图把数学奠基于对时空构形的领会之上；但希尔伯特把这些构形限于具体记号（例如纸上的书写）。希尔伯特把一致性视为存在的试金石，因此在他看来要紧的是这一事实：在具体记号领域内不可能出现任何不一致，因为关于具体对象的正确描述总是彼此相容的。特别是，在具体记号的领域内，实无限无法产生不一致，因为（同样与康德一致）他主张这一概念不能对应于任何具体对象。据此，希尔伯特的观点似乎是：数学的形式可靠性最终并非出自*逻辑的*源泉，而是出自*具体的*源泉[^note-27]，这与真正被报道的经验陈述之一致性由外部世界的具体性所保证颇为相似[^note-28]。
    step2: |-
      希尔伯特纲领所本的洞见是：归根结底（*au fond*），数学中可靠性完全无可置疑者只限于*有限论的*即*具体的*部分——尤其是对可通览的、由诸个不同对象（含作为纸上记号呈现的数学符号）构成的域所作的有限操作。仅涉及此种具体对象的数学命题，希尔伯特称之为*实在的*、*具体的*或*内容的*命题；其余一切数学命题则被他判为具*理想的*或*抽象的*品性。（故 $2 + 2 = 4$ 算是实在命题，而*存在一个奇完全数*算是理想命题。）希尔伯特视理想命题为近似于射影几何中“无穷远”的理想直线与理想点：正若使用后者并不触犯通常笛卡尔平面“具体”几何的任何真理，他亦希望表明，使用理想命题——即便是康托尔集合论者——也绝不在实在命题间引出假，换言之，此种使用*绝不与关于具体对象的任何自明事实相抵触*。以严格具体、因而无懈可击的手段确立此事，正是希尔伯特纲领的枢纽。可以说，希尔伯特随康德而试图把数学奠基于对时空构形的把握；但他把这些构形限于具体记号（如纸上的书写）。他以一致性为存在之试金石，故于他最要紧者乃是：具体记号之域内不可能生出不一致，因为关于具体对象的正确描述总是彼此相容。尤其在具体记号域内，实无限无从造成不一致——此因（同样随康德）他主张该概念不能对应于任何具体对象。据此看来，希尔伯特的主张是：数学的形式可靠性最终并非出于*逻辑的*源头，而出于*具体的*源头[^note-27]，颇似真正被如实报道的经验陈述之一致性由外部世界的具体性作保[^note-28]。
