      In Weyl’s eyes, Hilbert’s approach embodied the “symbolic representation of the transcendent, which demands to be satisfied”, and so he regarded its emergence as a natural development. But by 1927 Weyl saw Hilbert’s doctrine as beginning to prevail over intuitionism, and in this an adumbration of *“a decisive defeat of the philosophical attitude of pure phenomenology*, which thus proves to be insufficient for the understanding of creative science even in the area of cognition that is most primal and most readily open to evidence—mathematics.”[^note-31] Since by this time Weyl had become convinced that “creative science” must *necessarily* transcend what is phenomenologically given, he had presumably already accepted that pure phenomenology is incapable of accounting for theoretical physics, let alone the whole of existence. But it must have been painful for him to concede the analogous claim in the case of *mathematics*. In 1932, he asserts: “If mathematics is taken by itself, one should restrict oneself with Brouwer to the intuitively cognizable truths … nothing compels us to go farther.” If mathematics could be “taken by itself”, then there would be no need for it to justify its practices by resorting to “symbolic construction”, to employ symbols which in themselves “signify nothing”—nothing, at least, accessible to intuition. But, unlike Brouwer, Weyl seems finally to have come to terms with the idea that mathematics could not simply be “taken by itself”, that it has a larger role to play in the world beyond its service as a paradigm, however pure, of subjective certainty.
    step1: |-
      在外尔眼中，希尔伯特的进路体现了“对超越者的符号表象——这种表象要求得到满足”，因此他把它的出现视为一种自然的发展。但到 1927 年，外尔看到希尔伯特的学说开始压过直觉主义，并认为其中透露出*“纯粹现象学之哲学态度的一次决定性失败*，从而表明，即使在最原初、最容易向明见性敞开的知识领域——数学——之中，现象学也不足以理解创造性的科学。”[^note-31] 由于此时外尔已确信“创造性的科学”*必然*超越现象学地被给予者，他大概已经接受了纯粹现象学无力说明理论物理学，遑论整个存在。但要在*数学*的情形中承认类似的主张，对他必定是痛苦的。1932 年，他断言：“如果数学被就其自身来看待，人就应当随布劳威尔而止于直观上可认知的真理……没有什么迫使我们走得更远。”如果数学能够被“就其自身来看待”，那它便无需诉诸“符号建构”、使用那些自身“不表示任何东西”——至少不表示任何直观可及之物——的符号，来为自己的实践辩护。但与布劳威尔不同，外尔似乎最终接受了这样的想法：数学不能被简单地“就其自身来看待”，除了充当主观确定性的范式（无论多么纯粹）之外，它在世界中还有更大的作用要发挥。
    step2: |-
      在外尔看来，希尔伯特的进路体现了“对超越者的符号表象——而此种表象是要求满足的”，故他视其出现为自然之势。然而至 1927 年，外尔已见希尔伯特的学说渐占直觉主义之上风，并从中窥见*“纯粹现象学之哲学态度的一次决定性挫败*：它表明，即便在最原初、最易向明见性敞开的认知领域——数学——之内，现象学亦不足以理解创造性的科学。”[^note-31] 此时外尔既已确信“创造性的科学”*必然*超越现象学所予，他大约早已承认纯粹现象学无从说明理论物理学，更遑论整个存在。然而要在*数学*一例上承认同样的主张，于他必定痛切。1932 年他断言：“数学若就其自身而观，人便当随布劳威尔止于直观可认知的真理……并无何物迫使我们越出此界。”倘数学真能“就其自身而观”，它便无须借“符号建构”、无须使用那些本身“不表示什么”——至少不表示任何直观可及之物——的符号，来为自己的实践作辩护。但与布劳威尔不同，外尔似终于接受了这一想法：数学不能径被“就其自身而观”，除充当主观确定性的范型（无论多么纯粹）之外，它在这个世界中尚有更大的职分。
