      Another mathematical “possible” to which Weyl gave a great deal of thought is the *continuum*. During the period 1918–1921 he wrestled with the problem of providing the mathematical continuum—the real number line—with a logically sound formulation. Weyl had become increasingly critical of the principles underlying the set-theoretic construction of the mathematical continuum. He had come to believe that the whole set-theoretical approach involved vicious circles[^note-11] to such an extent that, as he says, “every cell (so to speak) of this mighty organism is permeated by contradiction.” In *Das Kontinuum* he tries to overcome this by providing analysis with a *predicative* formulation—not, as Russell and Whitehead had attempted, by introducing a hierarchy of logically ramified types, which Weyl seems to have regarded as excessively complicated—but rather by confining the comprehension principle to formulas whose bound variables range over just the initial given entities (numbers). Accordingly he restricts analysis to what can be done in terms of natural numbers with the aid of three basic logical operations, together with the operation of substitution and the process of “iteration”, i.e., primitive recursion. Weyl recognized that the effect of this restriction would be to render unprovable many of the central results of classical analysis—e.g., Dirichlet’s principle that any bounded set of real numbers has a least upper bound[^note-12]—but he was prepared to accept this as part of the price that must be paid for the security of mathematics.
    step1: |-
      外尔反复思考的另一个数学“可能者”是*连续统*。1918—1921 年间，他为如何给数学连续统——实数直线——提供一种逻辑上可靠的表述而苦苦挣扎。外尔对数学连续统之集合论建构所依据的那些原理日益持批评态度。他逐渐相信，整个集合论进路都含有恶性循环[^note-11]，程度之深到了如他所说“这一庞大有机体的每一个细胞（可以说）都渗透着矛盾”的地步。在《连续统》中，他试图通过为分析提供一种*直谓的*表述来克服这一点——不是像罗素与怀特海所尝试的那样引入逻辑分枝类型论的层级（外尔似乎认为那过于复杂），而是把概括原则限制在那些约束变元仅取值于初始被给予的实体（数）的公式上。据此，他把分析限制在借助三种基本逻辑运算、替换运算以及“迭代”过程（即原始递归）就自然数所能做到的范围之内。外尔承认，这一限制的后果将是使经典分析的许多核心结果无法被证明——例如狄利克雷原理，即任何有界实数集都有最小上界[^note-12]——但他准备接受这一点，作为为数学的安全性必须付出的部分代价。
    step2: |-
      外尔反复思量的另一数学“可能者”是*连续统*。1918—1921 年间，他为如何给数学连续统——实数直线——提供逻辑上可靠的表述而苦苦求索。他对数学连续统之集合论建构所依的原理日益不满，终至相信整个集合论进路都陷入恶性循环[^note-11]，如他所言，“这一庞大有机体的每一个细胞（可以说）都渗透着矛盾”。在《连续统》中，他试图为分析提供一种*直谓的*表述来克服此弊：他不是像罗素与怀特海那样引入逻辑分枝类型论的层级（外尔似觉其过于繁复），而是把概括原则限于约束变元只取值于初始所予实体（数）的公式。于是分析被限制于：以三种基本逻辑运算、替换运算以及“迭代”即原始递归，在自然数范围内所能成就者。外尔承认，如此限制将使经典分析的许多核心结果不可证——例如狄利克雷原理，即任一有界实数集皆有最小上界[^note-12]——但他甘愿以此作为换取数学之安全所付的代价。
