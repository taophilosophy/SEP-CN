      Material nature does not contain goodness; it can only be found in the human mind. Nature is depicted as a mechanical machine and should be studied by the natural sciences. Abstract economic theory is the mechanical analogy of these natural sciences: it is restricted to an investigation of the social world as a mechanical machine, and no ethical or religious considerations are taken into account. Jevons refutes the claims of some “sentimental writers” who regard economics as a “dismal science”, because its scope is restricted to wealth. These authors depict economics as a mechanical and miserable body of theories, whereas they hold true that a moral science should be concerned with sympathies, feelings and duties. Jevons uses an analogy from the natural sciences to refute this opinion: division of labour implies that some people investigate the mechanical aspects of iron, while other researchers devote their time to the study of its electrical or magnetic aspects. A physician may conclude that the health of a particular person will be fostered if he goes to the sea, but this person may decide otherwise by taking other considerations into account. This is the position of economics: charity for humanitarian reasons remains possible, but abstract economic theory shows that this may endanger future accumulation of wealth (Black 1977d, pp. 7–8)[^black-1977d].
    step1: |-
      物质本性不包含善；善只能在人的心灵中找到。自然被描绘成一部机械的机器，应当由自然科学来研究。抽象经济理论是这些自然科学的力学类比：它仅限于把社会世界当作机械机器来研究，不考虑任何伦理或宗教的考虑。杰文斯驳斥了一些“感伤作家”的说法，他们把经济学称作“沉闷的科学”，因为其范围仅限于财富。这些作者把经济学描绘成一套机械而可悲的理论体系，而他们坚称，真正的道德科学应当关心同情、感情与义务。杰文斯用自然科学中的一个类比来反驳这种意见：分工意味着一些人研究铁的力学方面，另一些研究者则把时间用于研究铁的电学或磁学方面。医生可以断定，某人如果去海边，其健康将得到增进，但这个人考虑其他因素后可以另作决定。经济学的处境正是如此：出于人道理由的慈善仍然可能，但抽象经济理论表明这可能危及未来的财富积累（Black 1977d, pp. 7–8）[^black-1977d]。
