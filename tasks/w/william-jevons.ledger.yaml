      Jevons seems to be a mathematical, deductive economist. Market prices are derived directly from a series of fundamental motive forces, such as “the mechanics of utility and self-interest”. Markets are depicted in the most abstract fashion and economic agents are perfectly rational, perfectly foresighted and in possession of perfect information. A perfectly rational human being would anticipate future feelings and include discounted future utility in his calculations. However, this ability varies according to certain circumstances, as there are “the intellectual standing of the race, or the character of the individual” (Jevons 1879: 34)[^jevons-1879]. The ability of foresight depends on the state of civilisation: the class or race with the most foresight will work most for the future, because a powerful feeling for the future is the main incentive to industry and saving. Moreover, even the ‘quality’ of tastes increases with every improvement of civilisation. Jevons' conception of an economic agent should therefore be altered according to the institutional setting in which the agent appears (the class or race to which the individual belongs).
    step1: |-
      杰文斯看上去是一位数学化的、演绎的经济学家。市场价格直接从一系列基本动力推出，例如“效用与自利的力学”。市场以最抽象的方式得到描绘，经济行为者完全理性、完全有远见并拥有完备信息。一个完全理性的人会预见未来的感受，并把折现的未来效用计入其计算。然而，这种能力随某些情形而变化，例如“种族的智识地位，或个人的品性”（Jevons 1879: 34）[^jevons-1879]。远见能力取决于文明的状态：最有远见的阶级或种族最肯为未来劳作，因为对未来的强烈感情是勤劳与储蓄的主要激励。此外，连趣味的“品质”也随文明的每一次改进而提高。因此，杰文斯的经济行为者概念应当随行为者所处的制度环境（个人所属的阶级或种族）而调整。
    step2: |-
      杰文斯看上去是一位数学化的、演绎的经济学家：市场价格直接从一系列基本动力推出，例如“效用与自利的力学”；市场以最抽象的方式得到描绘，经济行为者完全理性、完全有远见、拥有完备信息。一个完全理性的人会预见未来的感受，并把折现后的未来效用计入自己的计算。然而，这种能力随某些情形而变化，例如“种族的智识地位，或个人的品性”（Jevons 1879: 34）[^jevons-1879]。远见能力取决于文明的状态：最有远见的阶级或种族最肯为未来劳作，因为对未来的强烈感情是勤劳与储蓄的主要动因。此外，连趣味的“品质”也随文明的每一次进步而提高。因此，杰文斯的经济行为者概念应当随行为者所处的建制环境（个人所属的阶级或种族）而调整。
