      The growing critical attitude of Unitarianism coincides historically with the rise of evolutionary theory: especially Darwinism, but also wider theory such as the work of Auguste Comte and Herbert Spencer. Jevons was particularly favourable towards Spencer’s evolutionary ethics. The evolutionary perspective allows Jevons to integrate his religious beliefs in a view on the world as growing towards higher moral consciousness and rationality. Like Spencer, Jevons argues that there is no conflict at all between science and religion. On the contrary: they are both directed towards truth, and therefore they cannot contradict each other. Jevons congratulated John Herschel for his condemnation of the Theological Declaration of Scientific Man, which equated freedom of inquiry with a tendency to irreligion (Black 1977a: 60)[^black-1977a]. Jevons even intended to write the Tenth Bridgewater Treatise (following Charles Babbage’s Ninth Bridgewater Treatise) to show the perfect compatibility between science and religion, but he never completed this work.
    step1: |-
      一神论派日益增长的批判态度在历史上恰与进化论的兴起重合：尤其是达尔文主义，但也包括更宽泛的理论，例如奥古斯特·孔德与赫伯特·斯宾塞的著作。杰文斯对斯宾塞的进化论伦理学尤其有好感。进化论的视角使杰文斯能够把自己的宗教信念整合进一种世界图景——世界正朝着更高的道德意识与合理性生长。与斯宾塞一样，杰文斯主张科学与宗教之间完全没有冲突。恰恰相反：二者都指向真理，因此不可能彼此矛盾。杰文斯曾就约翰·赫歇尔对《科学人的神学宣言》的谴责向赫歇尔表示祝贺，该宣言把探究自由等同于无宗教的倾向（Black 1977a: 60）[^black-1977a]。杰文斯甚至打算步查尔斯·巴贝奇《第九部布里奇沃特论丛》之后写一部《第十部布里奇沃特论丛》（Bridgewater Treatise），以表明科学与宗教的完美相容，但他从未完成这部著作。
