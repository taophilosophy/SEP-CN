      杰文斯虽未明确讨论三位一体，但显然相信唯一之神的存在。他没有把神描述为人格性的存在者或父亲，而是描述为抽象善的一般原则（Black 1973: 258）[^black-1973]。这个抽象原则与科学发现完美符合：他自述其上帝观念得自对物质与心灵的考察。世界是一个“巨大的有机体”，其秩序与形式表达着意向与心灵，这意味着神与他的作品不可分离。神“在自然的奇妙秩序与单纯性之中，在手段对目的的适应之中，在万有所归趋的人的创造之中，带着能够无限改进的力量”显现可见（Black & Könekamp 1972: 155）[^black-1972][^könekamp-1972]。杰文斯把信仰奠基于“人及其感情”，因为人类心灵中爱与同情的感觉是唯一能够发现善之意向的地方。每种宗教都指向同样的永恒原则或“道德真理”，而文明的状态决定它们被歪曲的程度。不同的宗教只是抛在这些原则之上的外衣，而一神论派包含“最简单、最接近真理”的一套宗教信念。神被描绘为抽象善的原则，耶稣则被看作把永恒道德真理带给人类的信使。牛顿是自然科学的天才，莫扎特是音乐的天才，耶稣则是道德的天才。一神论派的历史也是以理性态度对待宗教、以批判态度对待《圣经》的历史。总的来说，一神论派并不反对科学发展；相反，他们主张科学与宗教应被看作同一枚硬币的两面。
