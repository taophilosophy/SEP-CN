      The truths of science are expressed in the form of propositions. “Propositions may assert an identity of time, space, manner, quantity, degree, or any other circumstance in which things may agree or differ” (Jevons 1874: 36)[^jevons-1874]. Simple propositions *A* = *B* express the most elementary judgment regarding identity. The use of the mathematical symbol ‘=’ implies that the distinction between subject and predicate vanishes, which makes quantification of the predicate possible. Several logicians opted for what Jevons calls the “indeterminate adjective” ‘some’, represented symbolically by ‘V’. Jevons rejects the usage of indeterminate symbols and suggests that *A* = V*B* (All *A*s are some *B*s) should be written as *A* = *AB*. Propositions of this kind express an identity between a part of *B* and the whole of *A*.
    step1: |-
      科学的真理以命题的形式表达。“命题可以断定时间、空间、方式、数量、程度或事物在其中一致或相异的任何其他情形上的同一”（Jevons 1874: 36）[^jevons-1874]。简单命题 *A* = *B* 表达关于同一的最基本判断。数学符号“=”的使用意味着主项与谓项的区分消失了，这就使谓项的量化成为可能。若干逻辑学家选择了杰文斯所说的“不确定形容词”——“有些”（some），以符号 V 表示。杰文斯拒绝使用不确定符号，主张 *A* = V*B*（所有 *A* 是有些 *B*）应当写作 *A* = *AB*。这类命题表达 *B* 的一部分与 *A* 的全体之间的同一。
    step2: |-
      科学的真理以命题的形式来表达。“命题可以断定时间、空间、方式、数量、程度，或事物在其中可能一致或相异的任何其他情形上的同一”（Jevons 1874: 36）[^jevons-1874]。简单命题 *A* = *B* 表达关于同一的最基本的判断。数学符号“=”的使用意味着主项与谓项之分消失，这就使谓项的量化成为可能。若干逻辑学家选择了杰文斯所谓的“不确定形容词”，即“有些”（some），以符号 V 表示。杰文斯拒绝使用不确定符号，主张 *A* = V*B*（所有 *A* 都是有些 *B*）应当写作 *A* = *AB*。这类命题表达的是 *B* 的一部分与 *A* 的全体之间的同一。
