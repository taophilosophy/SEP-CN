      Jevons' principles of number reflect his insistence that mathematics should be based on logic, not the other way round. He occupies a somewhat contradictory position in the history of logic, since his formalism was inspired by the works of Boole, who gave mathematics priority over logic. Jevons attempts to define ‘number’ by counting ‘units’ in space or time. When counting coins, every coin should receive a proper name: we should count *C*′ + *C*″ + *C*′′′ + *C*′′′′ + … The coins are equal to each other (they all belong to the class *C*); they are different only because they reside on different points in space. Before counting, we should reduce all identical alternatives; the remaining ‘units’ reside on different points in space and time. “A unit is any object of thought which can be discriminated from every other object treated as a unit in the same problem” (Jevons 1874: 157)[^jevons-1874]. The concept of ‘unit’ encounters some severe difficulties, as noted by Frege. We can only add up *C*s that are identical, but they cannot denote different things if the same symbol *C* is used. Jevons was unable to resolve this contradiction.
    step1: |-
      杰文斯的数的原则反映出他坚持数学应当以逻辑为基础，而不是相反。他在逻辑史上占据着一个多少自相矛盾的位置，因为他的形式体系受布尔著作的启发，而布尔把数学置于逻辑之先。杰文斯试图通过清点空间或时间中的“单元”来定义“数”。数硬币时，每枚硬币都应得到一个专名：我们应当数 *C*′ + *C*″ + *C*′′′ + *C*′′′′ + …。这些硬币彼此相等（它们都属于类 *C*）；它们之所以不同，只是因为位于空间中的不同点。数数之前，我们应当化归所有相同的备选项；剩下的“单元”位于空间和时间中的不同点。“单元是任何一个思想对象，它可以与同一问题中被当作单元的所有其他对象区分开来”（Jevons 1874: 157）[^jevons-1874]。“单元”概念遇到了一些严重的困难，弗雷格指出了这一点。我们只能加总彼此相同的那些 *C*，但如果使用同一个符号 *C*，它们就无法指称不同的东西。杰文斯未能解决这一矛盾。
