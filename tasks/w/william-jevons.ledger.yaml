      Earlier we discussed Jevons' use of ‘representative individuals’ and the notion of ‘character’. It is also the case that Unitarians believe that the formation of an improved character is essential, since otherwise no religious warmth can emerge. It is unclear to what extent improvement of people with presumed inferior character (due to class, race or gender) can be done. In Jevons we encounter a mixture of enlightened belief in education and prejudiced opinions against certain parts of the population, which is certainly not unusual for the 19ᵗʰ century. Nevertheless, Jevons does believe that policies to ameliorate working class conditions and attitudes are possible, desirable and required.
    step1: |-
      前面我们讨论了杰文斯对“代表性个体”的运用与“品性”概念。一神论派同样相信，造就改良的品性是根本的，否则宗教的热忱便无从产生。那些被认定品性低劣（由于阶级、种族或性别）的人能在多大程度上得到改善，并不清楚。在杰文斯那里，我们遇到启蒙的教育信念与对人口中某些部分的偏见意见的混合，这在十九世纪当然并不罕见。尽管如此，杰文斯确实相信，改善工人阶级处境与态度的政策是可能的、可取的，也是必要的。
    step2: |-
      前文讨论了杰文斯对“代表性个体”的运用与“品性”概念。一神论派同样相信，造就改良的品性至关重要，否则宗教的热忱便无从生发。至于那些被认定品性低劣（因阶级、种族或性别）的人能在多大程度上得到改善，并不清楚。在杰文斯那里，我们遇到启蒙的教育信念与针对部分人群的偏见意见的混合——这在十九世纪当然并不罕见。尽管如此，杰文斯确实相信，改善工人阶级处境与心态的政策是可能的、可取的，也是必要的。
