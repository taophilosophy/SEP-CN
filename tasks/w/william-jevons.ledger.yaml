  - id: 11
    kind: body
    source: |-
      Like many other logicians of the 19ᵗʰ century, Jevons wants to establish clear links between mathematics and logic. He would like to derive mathematics from logic, which is based on the Laws of Thought, and in doing so he makes (a rather controversial) use of mathematical symbols when establishing his logical formalism. Jevons denotes terms by capital letters *A*, *B*, *C*, etc. and their negative counterparts by small italic letters *a,b,c*, etc. The relation of identity or sameness is represented by the sign ‘=’. The expression ‘*A* ~ *B*’ indicates that *A* and *B* are not identical with each other; ‘*A* § *B*’ indicates that there exists any relation between *A* and *B*, which includes but is not restricted to the relations of equality or inequality. The general formula of logical inference implies that from *A* = *B* § *C* we can conclude that *A* § *C*. Jevons defines the concept ‘term’ in his *Pure Logic*: “*Term* will be used to mean *name*, or any combination of names and words describing the qualities and circumstances of a thing”. Jevons distinguishes between the extent and the intent of a term or a name. “The objects denoted form the *extent* of meaning of the term; the qualities implied form the *intent* of meaning”. It follows that extent and intent of meaning are negatively correlated: when more qualities are added to the meaning of a term, less objects will correspond to that meaning. Abstract qualities, denoted by abstract terms, originate when objects are compared and resemblances and differences identified. Abstract terms possess only one kind of meaning. Substantial terms, such as ‘gold’, denote substances. Nothing is denoted by the symbol ‘0’, which in logic means “the non-existent, the impossible, the self-inconsistent, the inconceivable”. Jevons lists several “special laws” which govern the combination of terms. The “Law of Simplicity” implies that a term combined with itself has no effect, hence *A* = *AA* = *AAA* = etc. The law of commutativeness indicates that the order of the combination does not matter, hence *AB* = *BA*, *ABC* = *ACB* = *BCA* = etc.
    step1: |-
      与十九世纪许多其他逻辑学家一样，杰文斯想在数学与逻辑之间建立清晰的联系。他想从逻辑推导出数学，而逻辑以思维规律为基础；在建立其逻辑形式体系时，他（颇有争议地）使用了数学符号。杰文斯用大写字母 *A*、*B*、*C* 等表示词项，用小写斜体字母 *a,b,c* 等表示其否定对应项。同一或相同的关系用符号“=”表示。表达式“*A* ~ *B*”表示 *A* 与 *B* 彼此不同一；“*A* § *B*”表示 *A* 与 *B* 之间存在某种关系，这种关系包括但不限于相等或不相等的关系。逻辑推理的一般公式意味着：从 *A* = *B* § *C* 可以得出 *A* § *C*。杰文斯在其《纯逻辑》（*Pure Logic*）中定义了“词项”概念：“*Term* 将用来意指 *name*，或指任何描述一事物之性质与情形的名称与语词的组合”。杰文斯区分了词项或名称的外延与内涵：“所指称的对象构成该词项意义的外延（*extent*）；所蕴含的性质构成意义的内涵（*intent*）”。由此可知，意义的外延与内涵负相关：给一个词项的意义添加的性质越多，与该意义对应的对象就越少。抽象性质由抽象词项指称，产生于对象之间的比较以及相同与差异的辨识。抽象词项只有一种意义。“金子”这样的实体词项指称实体。符号“0”不指称任何东西，它在逻辑中的意思是“不存在者、不可能者、自相矛盾者、不可设想者”。杰文斯列举了支配词项组合的若干“特殊规律”。“简单律”（Law of Simplicity）意味着词项与自身组合没有效果，因此 *A* = *AA* = *AAA* = 等等。交换律表明组合的次序无关紧要，因此 *AB* = *BA*，*ABC* = *ACB* = *BCA* = 等等。
    step2: |-
      与十九世纪许多其他逻辑学家一样，杰文斯想在数学与逻辑之间建立清晰的联系：他愿意从逻辑推导出数学，而逻辑以思维规律为基础；在建立逻辑形式体系时，他（颇有争议地）使用了数学符号。杰文斯用大写字母 *A*、*B*、*C* 等表示词项，用小写斜体字母 *a,b,c* 等表示它们的否定对应项。同一或相同的关系由符号“=”表示。表达式“*A* ~ *B*”表示 *A* 与 *B* 彼此不同一；“*A* § *B*”表示 *A* 与 *B* 之间存在某种关系——它包括但不限于相等或不相等的关系。逻辑推理的一般公式意味着：由 *A* = *B* § *C* 可得出 *A* § *C*。杰文斯在其《纯逻辑》（*Pure Logic*）中给出“词项”的定义：“*Term* 将用来意指 *name*，或指任何描述一事物之性质与情形的名称与语词的组合”。杰文斯区分了词项或名称的外延与内涵：“所指对象构成该词项意义的外延（*extent*）；所蕴含的性质构成意义的内涵（*intent*）”。由此可知，意义的外延与内涵负相关：添加到一个词项意义中的性质越多，与该意义对应的对象就越少。抽象性质由抽象词项指称，产生于对象的相互比较以及相同与差异的辨识。抽象词项只具有一种意义。“黄金”之类的实体词项指称实体。符号“0”不指称任何东西，它在逻辑中意谓“不存在者、不可能者、自相矛盾者、不可设想者”。杰文斯列举了支配词项组合的若干“特殊规律”。“简单律”（Law of Simplicity）意味着词项与自身组合不产生任何效果，故 *A* = *AA* = *AAA* = 等等；交换律表明组合次序无关紧要，故 *AB* = *BA*，*ABC* = *ACB* = *BCA* = 等等。
