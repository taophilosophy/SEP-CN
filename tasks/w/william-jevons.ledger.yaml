      Although Jevons does not discuss explicitly the Trinity, it is clear that he believes in the existence of one God. He does not describe him as a personal being or father, but as a general principle of abstract goodness (Black 1973: 258)[^black-1973]. This abstract principle is in perfect accordance with scientific findings: he reports that his conception of God is derived from an examination of matter and mind. The world is a “vast organism” with order and form expressing intention and mind, which implies that God is inseparable from his works. He is visible “in the wonderful order and simplicity of Nature, in the adaptation of means to ends, and in the creation of man to which everything refers, with power capable of indefinite improvement” (Black & Könekamp 1972: 155)[^black-1972][^könekamp-1972]. Jevons founds his faith “on Man and his feelings”, because humanity’s mental feelings of love and sympathy are the only places where intentions of good can be discovered. Every religion refers to the same eternal principles or “moral truths”, but the state of civilization determines their degree of misrepresentation. Different religions are merely costumes thrown over these principles, and Unitarianism contains the “most simple and truth-like” set of religious beliefs. God is depicted as a principle of abstract goodness, and Jesus is seen as the messenger who brought the eternal moral truths to humankind. Whereas Newton was a genius of natural science and Mozart of music, Jesus was a moral genius. The history of Unitarianism is also the history of a rational approach to religion, and a critical approach to the Holy Scripture. In general, Unitarians did not oppose scientific development, but on the contrary they argued that science and religion should be seen as two sides of the same coin.
