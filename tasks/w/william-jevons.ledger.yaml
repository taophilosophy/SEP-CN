      ## 2 思维规律
  - id: 6
    kind: body
    source: |-
      Like many representatives of 19ᵗʰ-century logic and philosophy of science, Jevons starts his investigation by examining the nature of the Laws of Thought. Jevons argues that these Laws are true both “in the nature of thought and things”. Given that science is in the mind and not in the things, the Laws of Thought seem to be purely subjective and only verified in the observation of the external world. However, Jevons argues that it is impossible to prove the fundamental laws of logic by reasoning, since they are already presupposed by the notion of a proof. Hence, the Laws of Thought must be presupposed by science as “the prior conditions of all thought and all knowledge”. Furthermore, our thoughts cannot be used as a criterion of truth, since we all know that mistakes are possible and omnipresent. Hence, we need to presuppose objective Laws of Thought in order to discriminate between correct and incorrect reasoning. It follows that Jevons regards the Laws of Thought as objective laws.
    step1: |-
      与十九世纪逻辑学与科学哲学的许多代表人物一样，杰文斯从考察思维规律的本质入手展开研究。杰文斯论证说，这些规律无论“在思想的本性中还是在事物的本性中”都为真。既然科学存在于心灵之中而非事物之中，思维规律似乎就是纯主观的，只能在外部世界的观察中得到验证。然而杰文斯指出，用推理来证明逻辑的基本规律是不可能的，因为它们已经被“证明”这一概念所预设。因此，科学必须把思维规律预设为“一切思想与一切知识的先在条件”。此外，我们的思想不能被用作真理的标准，因为谁都知道错误是可能的、无处不在的。因此，我们需要预设客观的思维规律，以便区分正确的推理与错误的推理。由此可见，杰文斯把思维规律看作客观规律。
    step2: |-
      与十九世纪逻辑学和科学哲学的许多代表人物一样，杰文斯从考察思维规律的本质入手展开研究。他论证说，这些规律无论在思想还是事物的本性之中都为真。既然科学存在于心灵而非事物之中，思维规律似乎就是纯主观的，只能在外部世界的观察中得到验证。然而杰文斯指出，用推理去证明逻辑的基本规律是不可能的，因为“证明”这一观念本身已经预设了它们。因此，科学必须把思维规律预设为“一切思想与一切知识的先在条件”。此外，我们的思想不能充当真理的标准，因为谁都知道错误是可能的、无处不在的。于是我们必须预设客观的思维规律，才能把正确推理与错误推理区分开来。由此可见，杰文斯把思维规律视为客观规律。
