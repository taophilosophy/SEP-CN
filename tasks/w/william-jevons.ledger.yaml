    source: |-
      William Stanley Jevons was born in Liverpool on 1 September 1835. His father Thomas Jevons (1791–1855) was an iron merchant; his mother Mary Anne Roscoe (1795–1845) grew up in an intellectual and artistic milieu. The railway boom crisis of 1847 caused the bankruptcy of the family firm. William Stanley Jevons went to University College School in London in 1850, and in 1851 to University College. He studied chemistry under Graham and Williamson, two pioneers in the development of atomic theory and the theory of molecular motion. Another major influence at University College was Augustus De Morgan (1806–1871), with his courses on mathematics and logic. Jevons left University College without taking his degree. In 1854 he travelled to Sydney, in order to become an assayer at the Australian mint. Jevons devoted much time to private study. His work covered many different areas: railway policy, meteorology, protection, land policy, cloud formation, gunpowder and lightning, geology, etc. Jevons left Australia in 1859 and returned to University College to complete his education. The early 1860s are important for Jevons' intellectual development, and he reports in his diary that he received significant insights in both economics and logic: a “true comprehension of value” (Black 1981: 120, La Nauze 1953)[^black-1981][^la-1953] and the “substitution of similars” (Black & Könekamp 1972: 179)[^black-1972][^könekamp-1972].
    step1: |-
      威廉·斯坦利·杰文斯 1835 年 9 月 1 日生于利物浦。父亲托马斯·杰文斯（Thomas Jevons，1791–1855）是铁器商人；母亲玛丽·安妮·罗斯科（Mary Anne Roscoe，1795–1845）在充满智识与艺术气息的环境中长大。1847 年的铁路繁荣危机导致家族商行破产。杰文斯 1850 年进入伦敦大学学院附中，1851 年升入大学学院。他在格雷厄姆（Graham）与威廉姆森（Williamson）门下学习化学，这二人是原子论和分子运动理论发展的先驱。大学学院的另一位重要影响者是奥古斯都·德摩根（Augustus De Morgan，1806–1871），他开设数学与逻辑课程。杰文斯没有取得学位就离开了大学学院。1854 年他远赴悉尼，出任澳大利亚造币厂的化验师。杰文斯把大量时间用于私人研究，所涉领域甚广：铁路政策、气象学、贸易保护、土地政策、云的形成、火药与闪电、地质学等等。1859 年他离开澳大利亚，回到大学学院完成学业。十九世纪六十年代初对杰文斯的心智发展十分重要，他在日记中自述，在经济学与逻辑两方面都获得了重要洞见：对价值的“真正理解”（Black 1981: 120, La Nauze 1953）[^black-1981][^la-1953]，以及“相似替换”（Black & Könekamp 1972: 179）[^black-1972][^könekamp-1972]。
    step2: |-
      威廉·斯坦利·杰文斯 1835 年 9 月 1 日生于利物浦。父亲托马斯·杰文斯（Thomas Jevons，1791–1855）是铁商；母亲玛丽·安妮·罗斯科（Mary Anne Roscoe，1795–1845）在智识与艺术氛围中长大。1847 年的铁路繁荣危机令家族商行破产。1850 年杰文斯进入伦敦大学学院附中，1851 年升入大学学院，在格雷厄姆（Graham）与威廉姆森（Williamson）门下攻读化学——二人是原子论与分子运动理论发展的先驱。大学学院的另一位重要影响者是奥古斯都·德摩根（Augustus De Morgan，1806–1871）及其数学与逻辑课程。杰文斯未取学位便离开了大学学院。1854 年他远赴悉尼，出任澳大利亚造币厂化验师。他投入大量时间私人研读，所涉领域极广：铁路政策、气象学、贸易保护、土地政策、云的形成、火药与闪电、地质学等等。1859 年他离开澳大利亚，回到大学学院完成学业。十九世纪六十年代初对杰文斯的心智发展至关重要：他在日记中自述，在经济学与逻辑两方面都获得了重要洞见——对价值的“真正理解”（Black 1981: 120, La Nauze 1953）[^black-1981][^la-1953]，以及“相似替换”（Black & Könekamp 1972: 179）[^black-1972][^könekamp-1972]。
