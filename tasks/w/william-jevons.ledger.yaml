      Michael White elaborates on Jevons' use of the concepts of ‘character’ (White 1994a)[^white-1994a], ‘gender’ (White 1994b)[^white-1994b] and ‘race’ (White 1993)[^white-1993]. Jevons' work was not directed to the explanation of the behaviour of specific individuals per se, unless these individuals were representative for all market participants of a certain uniform character. The science of economics deals with the lowest motives, and the *Theory* contains ‘representative individuals’, which behave in the way required by the *Theory*. All economic actors do not have to behave in exactly the same way, but disturbing causes would balance and therefore the ‘representative individual’ may be an appropriate model for the *Theory*. The theory is however indeterminate in cases when more information is required. For example, it is unclear whether an increase in the real wage rate, proportionate to an increase in labour productivity, results in increased or reduced hours of work. More information about the ‘character’ of the person under consideration is required: whereas learned professionals might be expected to work more severely, common labourers might prefer idleness over labour and prefer greater ‘ease’ in the case of rising real incomes. Irish labourers are said to be responsible for the higher mortality rates in several districts, because Jevons considered the Irish to be a race that would become more easily subject to drunkenness. The proper place of women is the home: women with children younger than three years should not be allowed to work, as this would only give rise no a neglect of the children, and would encourage the males to choose for idleness. In all these cases, the characters of labourers, Irish people or women are taken for granted, and are not in need of further explanation. The Victorian middle-class is used as a yardstick for evaluation.
    step1: |-
      迈克尔·怀特（Michael White）详细阐述了杰文斯对“品性”（White 1994a）[^white-1994a]、“性别”（White 1994b）[^white-1994b]与“种族”（White 1993）[^white-1993]概念的运用。杰文斯的工作并不是要解释特定个体本身的行为，除非这些个体对具有某种一致品性的全体市场参与者具有代表性。经济学科学处理最低等的动机，《政治经济学理论》（下称《理论》）中的“代表性个体”按《理论》所要求的方式行事。并非所有经济行为者都必须以恰好相同的方式行事，但干扰性原因会彼此平衡，因此“代表性个体”可以是《理论》的恰当模型。然而，在需要更多信息的情形中，这个理论是不确定的。例如，实际工资率的提高与劳动生产率的提高成比例时，工时究竟会增加还是减少，并不清楚。这需要关于所考虑者的“品性”的更多信息：有学识的专业人士大概会工作得更勤勉，普通劳动者却可能宁要闲暇而不要劳动，在实际收入上升时偏好更大的“安逸”。据说若干地区死亡率较高应归咎于爱尔兰劳工，因为杰文斯认为爱尔兰人是一个更容易染上酗酒习气的种族。妇女的正当位置是家庭：有不满三岁孩子的妇女不应被允许工作，因为这只会导致对子女的忽视，还会鼓励男性选择闲散。在所有这些情形中，劳动者、爱尔兰人或妇女的品性都被视为理所当然，无需进一步解释。维多利亚时代的中产阶级被用作评判的标尺。
    step2: |-
      迈克尔·怀特（Michael White）详细阐述了杰文斯对“品性”（White 1994a）[^white-1994a]、“性别”（White 1994b）[^white-1994b]与“种族”（White 1993）[^white-1993]概念的运用。杰文斯的工作并非要解释特定个体本身的行为，除非这些个体对具有某种一致品性的全体市场参与者具有代表性。经济学这门科学处理的是最低等的动机，《政治经济学理论》（下称《理论》）中的“代表性个体”按《理论》所要求的方式行事。并非所有经济行为者都必须以恰好相同的方式行事，但干扰性原因会彼此抵消，因此“代表性个体”可以是《理论》的恰当模型。然而，一旦需要更多信息，这个理论便是不确定的。例如，实际工资率的提高与劳动生产率的提高成比例时，工时究竟会增加还是减少，并不清楚。这需要更多关于所考虑者之“品性”的信息：有学识的专业人士大概会工作得更加勤勉，普通劳动者却可能宁要闲暇而不要劳动，在实际收入上升时更偏好“安逸”。据说若干地区死亡率较高应归咎于爱尔兰劳工，因为杰文斯认为爱尔兰人是一个更容易染上酗酒习气的种族。妇女的正当位置是家庭：有不满三岁孩子的妇女不应被允许做工，因为这只会导致对子女的疏忽，还会纵容男性选择闲散。在所有这些情形中，劳动者、爱尔兰人或妇女的品性都被视作理所当然，无需进一步解释。维多利亚时代的中产阶级被用作评判的标尺。
