      In *The Principles of Science* Jevons devotes a (short) section on the theory of evolution, followed by a section on the possibility of divine interference (Jevons 1874, pp. 761–9)[^jevons-1874]. Jevons embraces Spencer’s idea that the homogenous is unstable and differentiates itself in the process of evolutionary development. This explains why a variety of human institutions and characters emerged. He recognizes that evolutionary theory has not been proved, but nevertheless he adheres to its truthfulness. It is certainly not in conflict with theology, since it does not lead to the conclusion that creation was and is impossible. Evolutionary theory discloses several natural laws that explain how primitive life evolved to humankind by processes of adaptation to changing circumstances — but the initial distribution of atoms in the primeval world is very important as well. Jevons argues that this initial distribution is the result of the “arbitrary choice of the Creator”, which could have been very different and therefore present life would have been very different as well. Evolutionary theory tells us only that similar circumstances will lead to similar results since the same laws apply, but this is not in conflict with an initial act of creation. In close accordance with Spencer’s *First Principles*, Jevons states that it would be absurd to deny that anything exists, and that it therefore might be equally conceivable that the world was created out of nothing or that it existed from eternity. He also states clearly that science cannot disprove the possibility of divine intervention, which implies that a positivist attitude does not necessarily lead to materialism or atheism. Jevons also takes distance from Comte’s positivistic philosophy, by arguing — like Spencer — that scientific reflection on higher notions of creation must necessarily end up in contradictions.
    step1: |-
      在《科学的原则》（*The Principles of Science*）中，杰文斯用（短短的）一节讨论进化论，随后一节讨论神意干预的可能性（Jevons 1874, pp. 761–9）[^jevons-1874]。杰文斯接受斯宾塞的观念：同质者是不稳定的，会在进化发展的过程中分化自身。这解释了为什么会出现形形色色的人类制度与品性。他承认进化论尚未得到证明，但仍然坚持其为真。进化论当然不与神学冲突，因为它并不导致“创造曾经且现在不可能”的结论。进化论揭示了若干自然规律，说明原始生命如何通过适应变化环境的过程演化为人类——但太初世界中原子的初始分布也非常重要。杰文斯论证说，这种初始分布是“造物主的任意选择”的结果，它本可以大不相同，因此现今的生命也会大不相同。进化论告诉我们的只是：由于同样的规律起作用，相似的环境会导致相似的结果，但这与初始的创造行为并不冲突。与斯宾塞的《第一原理》（*First Principles*）密切一致，杰文斯声称，否认任何东西存在是荒谬的，因此世界究竟是无中生有被创造的，还是永恒存在的，或许同样可以设想。他还明确指出，科学无法否证神意干预的可能性，这意味着实证主义态度并不必然导向唯物主义或无神论。杰文斯也与孔德的实证主义哲学保持距离，主张——与斯宾塞一样——对创造的更高观念进行科学反思必然陷入矛盾。
