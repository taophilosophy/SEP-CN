      ### 3.1. Properties of terms
    step1: |-
      ### 3.1 词项特性
    step2: |-
      ### 3.1 词项特性
  - id: 14
    kind: body
    source: |-
      The theory of the properties of terms forms the basis of medieval semantic theory and provides an account of how terms function within the broader context of sentences, as well as how these different functions can account for the different rules governing inference. Sherwood identifies the four main properties of terms as (1) signification; (2) supposition; (3) copulation; and (4) appellation (Kretzmann 1966, p. 105)[^kretzmann-1966]. In this classification he differs from other accounts which mention (1) signification; (2) supposition and copulation; (3) ampliation and restriction; (4) appellation; and (5) relation.
    step1: |-
      词项特性理论构成中世纪语义理论的基础，它说明词项在语句这一更广语境中如何起作用，以及这些不同作用如何解释支配推理的不同规则。舍伍德把词项的四种主要特性确定为（1）意谓；（2）指代；（3）结合；（4）称谓（Kretzmann 1966, p. 105）[^kretzmann-1966]。在这一分类上，他有别于其他说法，后者提到的是（1）意谓；（2）指代与结合；（3）扩展与限制；（4）称谓；（5）关系。
    step2: |-
      中世纪语义理论以词项特性学说为基础：它说明词项在语句这一更大语境中怎样起作用，也说明这些不同作用如何解释各类支配推理的规则。舍伍德把词项的主要特性列为四种：（1）意谓；（2）指代；（3）结合；（4）称谓（Kretzmann 1966, p. 105）[^kretzmann-1966]。这一分类不同于另一种流行说法——后者列出的是（1）意谓；（2）指代与结合；（3）扩展与限制；（4）称谓；（5）关系。
  - id: 15
    kind: body
    source: |-
      Sherwood defines ‘signification’ as “a presentation of the form of something to the understanding”, a definition harking back to 12th-century semantic theory (Kretzmann 1966, p. 105, fn. 2)[^kretzmann-1966]. Supposition and copulation are symmetrically related to each other; ‘supposition’ is “an ordering of the understanding of something under something else” while ‘copulation’ is “an ordering of the understanding of something over something else” (Kretzmann 1966, p. 105)[^kretzmann-1966]. Only substantive nouns, pronouns, and definite descriptions can have supposition, while only adjectives, participles, and verbs can have copulation (Kretzmann 1966, p. 106)[^kretzmann-1966].
    step1: |-
      舍伍德把“意谓”定义为“把某物的形式呈现给理解力”，这一定义上承 12 世纪的语义理论（Kretzmann 1966, p. 105, fn. 2）[^kretzmann-1966]。指代与结合彼此对称相关；“指代”是“把对某物的理解置于另一物之下的一种安排”，而“结合”是“把对某物的理解置于另一物之上的一种安排”（Kretzmann 1966, p. 105）[^kretzmann-1966]。只有实词名词、代词和限定摹状词可以有指代，而只有形容词、分词和动词可以有结合（Kretzmann 1966, p. 106）[^kretzmann-1966]。
    step2: |-
      舍伍德将“意谓”界说为“把某物的形式呈交理解力”，此说上承 12 世纪语义理论（Kretzmann 1966, p. 105, fn. 2）[^kretzmann-1966]。指代与结合则互为对称：“指代”是“把对某物的理解置于另一物之下的一种安排”，“结合”是“把对某物的理解置于另一物之上的一种安排”（Kretzmann 1966, p. 105）[^kretzmann-1966]。能有指代的，只有实体名词、代词和限定摹状词；能有结合的，只有形容词、分词和动词（Kretzmann 1966, p. 106）[^kretzmann-1966]。
  - id: 16
    kind: body
    source: |-
      Finally, ‘appellation’ is “the present correct application of a term — i.e., the property with respect to which what the term signifies can be said of something through the use of the verb ‘is’” (Kretzmann 1966, p. 106)[^kretzmann-1966]. That is, the *appellata* of a term are the presently existing things of which the term can currently be truly predicated. Appellation is between supposition and copulation: Substantive nouns, adjectives, and participles can have appellation, but pronouns and verbs cannot (Kretzmann 1966, p. 106)[^kretzmann-1966].
    step1: |-
      最后，“称谓”是“一个词项在当下的正确施用——即，凭借它，该词项所意谓的东西可以通过动词‘是’的用法而被说成属于某物的那种特性”（Kretzmann 1966, p. 106）[^kretzmann-1966]。也就是说，一个词项的*被称谓者*，是该词项当前能够真正断言于其上的、当下存在的事物。称谓介于指代与结合之间：实词名词、形容词和分词可以有称谓，但代词和动词不能（Kretzmann 1966, p. 106）[^kretzmann-1966]。
    step2: |-
      最后是“称谓”：“一个词项在当下的正确施用，即这样一种特性——凭借它，词项所意谓的东西能借动词‘是’而被说成属于某物”（Kretzmann 1966, p. 106）[^kretzmann-1966]。换句话说，一个词项的*被称谓者*，就是当下实存、且该词项此刻能真正断言于其上的那些事物。称谓夹在指代与结合之间：实体名词、形容词、分词都可有称谓，代词与动词则不能（Kretzmann 1966, p. 106）[^kretzmann-1966]。
