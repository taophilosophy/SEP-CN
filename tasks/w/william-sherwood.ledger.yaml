    source: |-
      William of Sherwood (Guilelmus, Willelmus, Schyrwode, Shirwode, Shyreswode, and others) was a 13th century English logician who taught at the University of Paris and who worked in the Realist tradition of logic. His *Introduction to Logic*, written in the middle of the century, was one of the four most influential textbooks on logics in the 13th century, along with Lambert of Auxerre’s *Summary*, Roger Bacon’s *Art and Science of Logic*, and Peter of Spain’s *Summaries of Logic*. Roger Bacon in his *Opus tertium* (1267) singles Sherwood out for high praise, describing him as “much wiser than Albert [the Great]; for in *philosophia communis* no one is greater than he” (Kretzmann 1966, pp. 5–6; Kretzmann 1968, pp. 3–4)[^kretzmann-1966][^kretzmann-1968].
    step1: |-
      舍伍德的威廉（Guilelmus、Willelmus、Schyrwode、Shirwode、Shyreswode 等）是 13 世纪英格兰逻辑学家，曾在巴黎大学任教，属于逻辑学中的实在论传统。他在本世纪中叶写成的《逻辑导论》，是与奥塞尔的兰贝尔《纲要》、罗吉尔·培根《逻辑的技艺与科学》以及西班牙的彼得《逻辑摘要》并列的 13 世纪最有影响的四部逻辑教科书之一。罗吉尔·培根在《第三著作》（1267）中单独点名称赞舍伍德，称他“比阿尔伯特[大帝]高明得多；因为在 *philosophia communis*（共同哲学）中无人比他更伟大”（Kretzmann 1966, pp. 5–6；Kretzmann 1968, pp. 3–4）[^kretzmann-1966][^kretzmann-1968]。
    step2: |-
      舍伍德的威廉（Guilelmus、Willelmus、Schyrwode、Shirwode、Shyreswode 等拼法）是 13 世纪的英格兰逻辑学家，任教于巴黎大学，站在逻辑学的实在论传统一边。他于世纪中叶写下的《逻辑导论》，是 13 世纪影响最大的四部逻辑教科书之一，与之并列的还有奥塞尔的兰贝尔《纲要》、罗吉尔·培根《逻辑的技艺与科学》和西班牙的彼得《逻辑摘要》。罗吉尔·培根在《第三著作》（1267）里单单把他挑出来大加称许，说他“比阿尔伯特[大帝]高明得多；因为在 *philosophia communis*（共同哲学）上，无人出其右”（Kretzmann 1966, pp. 5–6；Kretzmann 1968, pp. 3–4）[^kretzmann-1966][^kretzmann-1968]。
