      The second is his treatment of singular (also called ‘discrete’) terms, such as proper names or demonstrative phrases like ‘this cat’. Such terms were often omitted from explicit consideration in treatises on supposition, or were mentioned but ultimately excluded (Brumberg-Chaumont 2013, p. 173)[^brumberg-chaumont-2013]. Sherwood, on the other hand, recognizes that singular terms can have both simple supposition as well as personal supposition (Brumberg-Chaumont 2013, p. 174)[^brumberg-chaumont-2013]; this makes him “the only logician to take on all the implications of this position [that discrete supposition is a type of personal supposition] and to attribute to discrete terms a real capacity for semantic variation” (Brumberg-Chaumont 2013, pp. 184–185)[^brumberg-chaumont-2013].
    step1: |-
      第二个是他对单称（又称“离散”）词项的处理，例如专名或“这只猫”这样的指示短语。这类词项在论指代的论文中常被略去不予考虑，或者虽被提及却最终排除在外（Brumberg-Chaumont 2013, p. 173）[^brumberg-chaumont-2013]。舍伍德则承认，单称词项既能有简单指代，也能有人称指代（Brumberg-Chaumont 2013, p. 174）[^brumberg-chaumont-2013]；这使他成为“唯一一位承担了这一立场[离散指代是人称指代的一种]的全部蕴含、并赋予离散词项真正语义变化能力的逻辑学家”（Brumberg-Chaumont 2013, pp. 184–185）[^brumberg-chaumont-2013]。
    step2: |-
      第二个特色是他对单称词项（又称“离散”词项）的处理，如专名或“这只猫”之类的指示短语。此类词项在论指代的著作里常被略过不提，或者提了之后又排除在外（Brumberg-Chaumont 2013, p. 173）[^brumberg-chaumont-2013]。舍伍德却承认，单称词项既能作简单指代，也能作人称指代（Brumberg-Chaumont 2013, p. 174）[^brumberg-chaumont-2013]；这使他成为“唯一一位把这一立场[离散指代属人称指代]的全部蕴含都担当起来、并赋予离散词项真正语义变化能力的逻辑学家”（Brumberg-Chaumont 2013, pp. 184–185）[^brumberg-chaumont-2013]。
