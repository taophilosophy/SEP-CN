      Roger Bacon’s approbation of Sherwood is not the only explicit reference we have to him by his contemporaries. The copy of Chapter Five of the *Introduction* found in MS Worcester Cath. Q. 13 mentioned earlier is followed by a collection of anonymous notes (also edited in Pinborg & Ebbesen 1984 and there called the *Dubitationes*)[^pinborg-1984]. Pinborg and Ebbesen argue that these lecture notes, composed either for a teacher’s or a student’s use, are unlikely to have been written in response to lectures given in the 1290s, i.e., when the manuscript was copied, but rather date from the 1260s or the 1270s, favoring a date around 1270 (Pinborg and Ebbesen 1984, p. 104)[^pinborg-1984]. This text thus provides evidence that Sherwood’s works continued to be taught and circulated.
    step1: |-
      罗吉尔·培根对舍伍德的赞许，并不是我们仅有的同代人对他的明确提及。前面提到的伍斯特座堂手稿 MS Q. 13 中《导论》第五章抄本之后，紧跟着一组匿名笔记（亦经 Pinborg 与 Ebbesen 1984 编辑，那里称为《疑问集》）[^pinborg-1984]。Pinborg 与 Ebbesen 论证说，这些讲课笔记——无论供教师还是学生使用——不大可能是针对 1290 年代的讲授所作（即手稿抄写之时），而应成于 1260 或 1270 年代，他们倾向于定在 1270 年前后（Pinborg and Ebbesen 1984, p. 104）[^pinborg-1984]。因此，这一文本提供了证据，表明舍伍德的著作仍在被讲授和流传。
    step2: |-
      罗吉尔·培根的那番推许，并非同代人提到他的唯一明确记载。前述伍斯特座堂手稿 MS Q. 13 中《导论》第五章之后，紧接一组匿名笔记（Pinborg 与 Ebbesen 1984 亦曾编刊，题为《疑问集》）[^pinborg-1984]。Pinborg 与 Ebbesen 论证：这些讲课笔记无论供教师还是学生用，都不像是对 1290 年代——即手稿抄写之时——的讲授所作，而应成于 1260 或 1270 年代，他们倾向于 1270 年前后（Pinborg and Ebbesen 1984, p. 104）[^pinborg-1984]。由此可见，舍伍德的著作当时仍在讲授、仍在流传。
