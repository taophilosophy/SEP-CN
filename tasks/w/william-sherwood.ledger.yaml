      The first is the inclusion of ‘manerial’ supposition, a type which does not appear outside of Sherwood. Some have considered *manerialis* an error for *materialis*, and considered Sherwood to have been talking here about material supposition (Grabmann 1937)[^grabmann-1937]. However, the manuscript shows *n* rather than *t*, and the type of supposition is not the same as the material supposition, which is distinguished from formal supposition, but is itself a type of formal supposition. Sherwood says that manerial supposition is a type of simple supposition in which “a word can be posited for its *significatum* without any connection with things”, and he gives as an example “Man is a species”. The explanation is that this is manerial supposition because ‘man’ “supposits for the specific character in itself” (Kretzmann 1966, p. 111)[^kretzmann-1966]. The notion of *maneries* meaning ‘character, way, mode, manner’ can be found in 12th-century discussions of universals; for example, John of Salisbury notes that Joscelin, Bishop of Soissons, says that sometimes the words *genus* and *species* “are to be understood as things of a universal kind” and sometimes he “interprets them as modes (*maneries*) of things” (Hall, Book II, ch. 17, p. 84). John says he does not know where Joscelin got such a distinction, but it occurs in Abelard and in the 12th-century *Fallacie Parvipontane* (Hall, Book II, ch. 17, p. 84, fnn. a, b; de Rijk 1962, pp. 139, 562)[^rijk-1962].
    step1: |-
      第一个是“manerial”指代的纳入，这一类型在舍伍德之外未曾出现。有人认为 *manerialis* 是 *materialis* 的讹写，认为舍伍德在此谈的是质料指代（Grabmann 1937）[^grabmann-1937]。然而，手稿上是 *n* 而非 *t*，而且这一指代类型并不等同于质料指代——质料指代与形式指代相区分，但它本身又是形式指代的一种。舍伍德说，manerial 指代是简单指代的一种，其中“一个词可以不与事物有任何关联而被设定为其*所意谓者*”，他给出的例子是“人是种”。解释是：这是 manerial 指代，因为“人”一词“为其自身中的种性而指代”（Kretzmann 1966, p. 111）[^kretzmann-1966]。*maneries* 一词意为“性质、方式、样式、做法”，可见于 12 世纪关于共相的讨论；例如，索尔兹伯里的约翰指出，苏瓦松主教若斯兰说，*genus* 与 *species* 两个词有时“应被理解为普遍种类的事物”，有时他“把它们解释为事物的样式（*maneries*）”（Hall, Book II, ch. 17, p. 84）。约翰说他不知道若斯兰从哪里得到这一区分，但它见于阿伯拉尔，也见于 12 世纪的《小桥谬误论》（Hall, Book II, ch. 17, p. 84, fnn. a, b；de Rijk 1962, pp. 139, 562）[^rijk-1962]。
    step2: |-
      第一个特色是纳入“manerial”指代，此类型在舍伍德之外不见。有人以为 *manerialis* 是 *materialis* 的讹写，因而认为他讲的其实是质料指代（Grabmann 1937）[^grabmann-1937]。可是手稿上写的是 *n* 而非 *t*；何况这种指代同质料指代并不相同——质料指代与形式指代相对，而它本身又是形式指代的一类。舍伍德说，manerial 指代是简单指代的一种，其中“一个词可以完全脱离事物而被设定为其*所意谓者*”；他举的例子是“人是种”。解释说：这属于 manerial 指代，因为“人”一词“为其自身之中的种性而指代”（Kretzmann 1966, p. 111）[^kretzmann-1966]。*maneries* 意为“性质、方式、样式、做法”，12 世纪讨论共相时已见其踪。例如索尔兹伯里的约翰提到，苏瓦松主教若斯兰说，*genus* 与 *species* 二词有时“该理解为普遍种类的事物”，有时他又“把它们解释为事物的样式（*maneries*）”（Hall, Book II, ch. 17, p. 84）。约翰自称不知若斯兰此说从何而来；但它在阿伯拉尔那里出现过，也见于 12 世纪的《小桥谬误论》（Hall, Book II, ch. 17, p. 84, fnn. a, b；de Rijk 1962, pp. 139, 562）[^rijk-1962]。
