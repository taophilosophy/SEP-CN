      It is in this treatise that we can see evidence for what some have said is a distinctively English approach to syncategorematic terms (Uckelman & Lagerlund 2016)[^uckelman-2016]. Sherwood and his English contemporary Roger Bacon both consider distributive terms such as ‘every’ to be syncategorematic, while in continental works such as those by John le Page, Peter of Spain, and Nicholas of Paris, distributive terms are usually considered in summary treatises in the chapter on distribution (a chapter found in no English summary) (Braakhuis 1981, pp. 138–139)[^braakhuis-1981]. In his consideration of ‘every’, Sherwood argues that propositions involving ‘all’ require that there be at least three things for which the predicate term truly stands:
    step1: |-
      正是在这篇论文中，我们可以看到有人所谓的对待非范畴词的一种独特英格兰进路（Uckelman & Lagerlund 2016）[^uckelman-2016]。舍伍德与其英格兰同代人罗吉尔·培根都把“每个”这样的周延词项视为非范畴词；而在约翰·勒佩奇、西班牙的彼得、巴黎的尼古拉等人的欧陆著作中，周延词项通常在摘要性论著的“周延”章中处理（这一章不见于任何英格兰摘要）（Braakhuis 1981, pp. 138–139）[^braakhuis-1981]。在讨论“每个”时，舍伍德论证说，含有“所有”的命题要求至少有三个事物是谓项词项真正代表的对象：
    step2: |-
      这篇论文恰能让我们看到有人所称的一种英格兰特有的非范畴词进路（Uckelman & Lagerlund 2016）[^uckelman-2016]。舍伍德与其英格兰同代人罗吉尔·培根，都把“每个”这类周延词项算作非范畴词；而在约翰·勒佩奇、西班牙的彼得、巴黎的尼古拉等欧陆学者的著作里，周延词项通常是在摘要性论著专论“周延”的一章中处理——这一章在任何英格兰摘要中都不见（Braakhuis 1981, pp. 138–139）[^braakhuis-1981]。论及“每个”时，舍伍德主张：含有“所有”的命题，要求谓项词项真正代表的对象至少有三个：
