      Sherwood is also noteworthy for being the first logician we know of to treat ‘is’ as a syncategorematic term (Kretzmann 1968, p. 90)[^kretzmann-1968]. He argues that ‘is’ is equivocal, in that it can indicate either (1) actual being (*esse actuale*) or (2) habitual being (*esse habituale*) (Kretzmann 1968, p. 92, Kretzmann 1966, p. 125; Kretzmann translates *habituale* as ‘relational’ in Kretzmann 1966 and as ‘conditional’ in Kretzmann 1968)[^kretzmann-1966][^kretzmann-1968]. As a result, the sentence ‘Every man is an animal’ is ambiguous. When ‘is’ is taken to indicate actual being, ‘Every man is an animal’ “is false when no man exists” (Kretzmann 1968, p. 93)[^kretzmann-1968]. When ‘is’ is taken to indicate habitual being, then “insofar as [”Every man is an animal“] is necessary it has the force of this conditional: ‘if it is man it is an animal’” (Kretzmann 1966, p. 125)[^kretzmann-1966]. In analyzing universal affirmative categorical sentences in this way, Sherwood can be seen as an ‘early adopter’ of our modern truth conditions for these sentences. A consequence of this view is a commitment to the existence of *possibilia*, things that could exist but which actually do not; such *possibilia* have a diminished sort of being (*esse diminutum*) (Kretzmann 1968, p. 93)[^kretzmann-1968]. This was an unusual position in the thirteenth century (Knuuttila 1993)[^knuuttila-1993], and it was later denounced by William of Ockham (Freddoso & Schuurman 1980, p. 99)[^freddoso-1980].
    step1: |-
      舍伍德还因是已知第一位把“是”当作非范畴词项处理的逻辑学家而值得注意（Kretzmann 1968, p. 90）[^kretzmann-1968]。他论证说，“是”是歧义的，因为它既可以标示（1）现实存在（*esse actuale*），也可以标示（2）习惯性存在（*esse habituale*）（Kretzmann 1968, p. 92，Kretzmann 1966, p. 125；Kretzmann 在 1966 年译本中把 *habituale* 译为“relational”，在 1968 年译本中译为“conditional”）[^kretzmann-1966][^kretzmann-1968]。因此，“每个人都是动物”这个句子是有歧义的。当“是”被理解为标示现实存在时，“每个人都是动物”“在无人存在时为假”（Kretzmann 1968, p. 93）[^kretzmann-1968]。当“是”被理解为标示习惯性存在时，那么“就[“每个人都是动物”]是必然的而言，它具有这一条件句的力量：‘如果它是人，它就是动物’”（Kretzmann 1966, p. 125）[^kretzmann-1966]。以这种方式分析全称肯定直言句，可以说舍伍德是我们现代这些句子真值条件的“早期采用者”。这一观点的一个后果，是承诺*可能物*的存在，即可能存在而实际不存在的东西；这类*可能物*具有一种减损的存在（*esse diminutum*）（Kretzmann 1968, p. 93）[^kretzmann-1968]。这在 13 世纪是个不寻常的立场（Knuuttila 1993）[^knuuttila-1993]，后来受到奥卡姆的威廉的谴责（Freddoso & Schuurman 1980, p. 99）[^freddoso-1980]。
    step2: |-
      舍伍德还有一点值得注意：就我们所知，他是头一个把“是”当作非范畴词项来处理的逻辑学家（Kretzmann 1968, p. 90）[^kretzmann-1968]。他论证说，“是”是歧义的，可标示（1）现实存在（*esse actuale*），也可标示（2）习惯性存在（*esse habituale*）（Kretzmann 1968, p. 92；Kretzmann 1966, p. 125；*habituale* 在 1966 年译本中译作“relational”，在 1968 年译本中译作“conditional”）[^kretzmann-1966][^kretzmann-1968]。由此，“每个人都是动物”便有两解。若“是”标示现实存在，则“每个人都是动物”“在无人存在时为假”（Kretzmann 1968, p. 93）[^kretzmann-1968]；若标示习惯性存在，那么“就[“每个人都是动物”]作为必然命题而言，它相当于这个条件句：‘如果它是人，它就是动物’”（Kretzmann 1966, p. 125）[^kretzmann-1966]。如此分析全称肯定直言句，可谓舍伍德早已“抢先采用”了现代为这类句子规定的真值条件。此说的一个后果，是承认*可能物*的存在——它们可能存在，却实际不存在；这类*可能物*具有一种减损的存在（*esse diminutum*）（Kretzmann 1968, p. 93）[^kretzmann-1968]。这在 13 世纪实属异数（Knuuttila 1993）[^knuuttila-1993]，后来遭到奥卡姆的威廉斥责（Freddoso & Schuurman 1980, p. 99）[^freddoso-1980]。
