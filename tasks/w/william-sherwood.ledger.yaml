      Here it must be noted that Sherwood’s views of modality differ significantly from modern views. Modern modal logic interprets modes in a nominal way, e.g., ‘necessary:’, ‘impossible:’, etc. But Sherwood is reluctant to admit a statement such as “That Socrates is running is necessary” as genuinely modal (Kretzmann 1966, p. 43)[^kretzmann-1966], instead viewing this as an assertoric categorical statement predicating ‘necessary’ of ‘that Socrates is running’. Similarly, ‘Socrates is running necessarily’ does not count as a modal statement, because here ‘necessarily’ modifies ‘running’, not “the inherence of the predicate in the subject”. The only genuinely modal construction is that exhibited by ‘Socrates is necessarily running’ (Kretzmann 1966, p. 42)[^kretzmann-1966]. The importance of the adverbial construction, where the modal adverb modifies the inherence of the predicate with the subject, is emphasized in the discussions of modal adverbs in *Syncategoremata*, which include not only the chapter mentioned above but also analyses of how modal adverbs interact with other syncategorematic terms such as ‘only’, ‘unless’, and ‘if’ (Uckelman 2020, §5)[^uckelman-2020].
    step1: |-
      这里必须指出，舍伍德的模态观点与现代观点大不相同。现代模态逻辑以一种名词性的方式解释诸模态，例如“必然：”“不可能：”等等。但舍伍德不愿把“苏格拉底在跑这件事是必然的”这样的语句承认为真正模态的（Kretzmann 1966, p. 43）[^kretzmann-1966]，而把它看作一个直言语句，把“必然的”断言于“苏格拉底在跑这件事”。同样，“苏格拉底必然地在跑”也不算模态语句，因为这里的“必然地”修饰的是“跑”，而不是“谓项在主语中的内属”。唯一真正的模态构造，是“苏格拉底必然在跑”所展示的那种（Kretzmann 1966, p. 42）[^kretzmann-1966]。副词性构造——模态副词修饰谓项与主语的内属——的重要性，在《非范畴词论》讨论模态副词的各章中得到强调；这些讨论不仅包括上述那一章，还包括对模态副词如何与“只有”“除非”“如果”等其他非范畴词项相互作用所作的分析（Uckelman 2020, §5）[^uckelman-2020]。
    step2: |-
      此处须注意，舍伍德的模态观与现代看法相去甚远。现代模态逻辑把诸模态作名词式处理，如“必然：”“不可能：”等。舍伍德却不肯承认“苏格拉底在跑这件事是必然的”这类语句为真正的模态语句（Kretzmann 1966, p. 43）[^kretzmann-1966]，而把它视为直言语句，将“必然的”断言于“苏格拉底在跑这件事”。同理，“苏格拉底必然地在跑”也不算模态语句，因为这里的“必然地”修饰“跑”，并不修饰“谓项在主语中的内属”。真正称得上模态构造的，只有“苏格拉底必然在跑”这一形态（Kretzmann 1966, p. 42）[^kretzmann-1966]。副词构造——模态副词修饰谓项与主语的内属——何以重要，《非范畴词论》论模态副词的各章有充分强调：除上述一章外，还分析了模态副词同“只有”“除非”“如果”等其他非范畴词项的相互作用（Uckelman 2020, §5）[^uckelman-2020]。
