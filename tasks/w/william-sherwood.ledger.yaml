      Sherwood was one of the first medieval logicians to explicitly integrate singular statements into the Square of Opposition. The result is a Hexagon of Opposition which shows how singular statements entail and can be inferred from partial and universal statements with the same subject and predicate terms. While no depiction of this hexagon occurs in any extant manuscript of Sherwood’s *Introduction*, Khomskii has argued that it is likely that at one point, the diagram was included in the text (Khomskii 2010)[^khomskii-2010].
    step1: |-
      舍伍德是最早把单称语句明确纳入对当方阵的中世纪逻辑学家之一。其结果是对当六角形，它显示单称语句如何蕴涵主谓词项相同的特称与全称语句、又如何可由后者推出。虽然舍伍德《导论》现存任何手稿中都没有这一六角形的图示，Khomskii 论证说，这一图示很可能曾在某个时候被收入文本（Khomskii 2010）[^khomskii-2010]。
    step2: |-
      在中世纪逻辑学家中，舍伍德属于最早把单称语句明确纳入对当方阵的一批。由此得出的是对当六角形：它呈现单称语句如何蕴涵、又如何可由主谓词项相同的特称、全称语句推出。舍伍德《导论》现存各手稿中都不见此六角形的图；但 Khomskii 论证说，文本里很可能一度有过这幅图（Khomskii 2010）[^khomskii-2010]。
