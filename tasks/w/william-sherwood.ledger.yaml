  - id: 23
    kind: body
    source: |-
      Statements are composed of two types of parts: principal and secondary. The principal parts of a statement are the nouns and verbs, that is, the subjects and predicates whose properties are the focus of the first branch of terminist logic. The secondary parts are those that remain: “the adjectival name, the adverb, and conjunctions and prepositions, for they are not necessary for the statement’s being” (Kretzmann 1968, p. 13)[^kretzmann-1968]. These are words which do not have signification in themselves, but only in conjunction with other significative words, namely the subject and predicate (Kretzmann 1966, p. 24)[^kretzmann-1966]. Because these words do not have signification in themselves, they do not have any of the usual properties of terms — supposition, copulation, and ampliation. Nevertheless, they still have a significative function. Explaining this function is the focus of Sherwood’s treatise on syncategorematic terms.
    step1: |-
      语句由两类部分构成：主要部分与次要部分。语句的主要部分是名词与动词，即其特性构成词项逻辑第一分支之焦点的主语与谓语。次要部分是余下的部分：“形容词性的名称、副词，以及连词和介词，因为它们对语句的存在并非必需”（Kretzmann 1968, p. 13）[^kretzmann-1968]。这些词本身没有意谓，只有在与其他有意谓的词即主语和谓语相结合时才有（Kretzmann 1966, p. 24）[^kretzmann-1966]。由于这些词本身没有意谓，它们不具有词项的通常特性——指代、结合和扩展。然而它们仍然具有一种意谓功能。解释这一功能，正是舍伍德非范畴词论文的焦点。
    step2: |-
      语句由两类部分合成：主要部分与次要部分。主要部分是名词与动词，也就是主语与谓语——词项逻辑第一分支所关注的，正是它们的特性。次要部分即其余者：“形容词性的名称、副词，以及连词与介词，因为它们并非语句存在所必需”（Kretzmann 1968, p. 13）[^kretzmann-1968]。这些词本身没有意谓，唯与有意谓的主语、谓语连用时才有（Kretzmann 1966, p. 24）[^kretzmann-1966]。既无自身意谓，它们便不具备词项的通常特性——指代、结合与扩展；但它们仍有一种意谓功能。说明这种功能，正是舍伍德非范畴词论文的宗旨。
