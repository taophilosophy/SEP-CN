      > [impossible] is used in one way of whatever cannot be true now or in the future or in the past; and this is ‘impossible *per se*’ … It is used in the other way of whatever cannot be true now or in the future although it could have been true in the past … and this is ‘impossible *per accidens*’. Similarly, in case something cannot be false now or in the future or in the past it is said to be ‘necessary *per se*’ … But it is ‘necessary *per accidens*’ in case something cannot be false now or in the future although it could have been [false] in the past (Kretzmann 1966, p. 41)[^kretzmann-1966].
    step1: |-
      > [不可能]的一种用法，指无论现在、将来还是过去都不能为真者；这是“自性不可能”…… 另一种用法，指现在或将来不能为真、但过去本可以为真者……这是“偶性不可能”。同样，若某物无论现在、将来还是过去都不能为假，就说它是“自性必然”…… 但若某物现在或将来不能为假、尽管过去本可以[为假]，它就是“偶性必然”（Kretzmann 1966, p. 41）[^kretzmann-1966]。
