      > 在这些诗句中，‘a’ 表示全称肯定命题，‘e’ 表示全称否定命题，‘i’ 表示特称肯定命题，‘o’ 表示特称否定命题，‘s’ 表示简单换位[*conversio simplex*]，‘p’ 表示限量换位[*conversio per accidens*]，‘m’ 表示前提的换位，‘b’ 与 ‘r’ 出现在同一个词中时表示归谬还原。前两行属于第一格，第三行的四个词属于第二格，其余所有的词属于第三格（Kretzmann 1968, p. 67）[^kretzmann-1968]。
    step2: |-
      > 这些诗句里，‘a’ 指全称肯定命题，‘e’ 指全称否定命题，‘i’ 指特称肯定命题，‘o’ 指特称否定命题，‘s’ 指简单换位（*conversio simplex*），‘p’ 指限量换位（*conversio per accidens*），‘m’ 指前提易位，‘b’ 与 ‘r’ 同处一词时则指归谬还原。前两行属第一格，第三行四个词属第二格，其余各词属第三格（Kretzmann 1968, p. 67）[^kretzmann-1968]。
