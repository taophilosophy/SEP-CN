      (Remember that an *appellatum* is something which both exists and which the subject stands for or refers to.) The justification for this is taken from Aristotle, who Sherwood quotes as saying, “Of two men we say that they are two, or both, and not that they are all” (Kretzmann 1968, p. 23)[^kretzmann-1968]; that is, if there were fewer than three, it would be more appropriate to say ‘Both’ or ‘One’ rather than ‘All’ (for further discussion, see Mora-Márquez 2015, p. 197)[^mora-márquez-2015].
