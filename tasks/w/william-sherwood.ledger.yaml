      Beyond these explicit mentions, it is clear that Sherwood’s works were widely influential among logicians at the University of Paris in the second half of the 13th century. The most direct line of influence runs from William of Sherwood to his much better-known colleague Peter of Spain. It was for many years believed that Peter was the first person to translate Psellus’s text (Mullinger 1873, p. 176)[^mullinger-1873], prior to the rediscovery of Sherwood’s *Introduction*, which pre-dates Peter by two decades and which is closer to Psellus’s work. Peter’s *Summary of Logic* is clearly indebted to Sherwood. Kretzmann notes that “many of the features of the *Summulae* that made it far and away the most popular logic textbook in the Middle Ages seem quite plainly to have developed as modifications of more difficult discussions and less felicitous mnemonic devices in the *Introductiones*” (Kretzmann 1968, p. 6)[^kretzmann-1968]. On the other hand, Sherwood appears to have been influenced by Peter’s treatise on syncategorematic terms in writing his own; Kretzmann provides a summary of passages in Sherwood’s treatise which “can be read as allusions to positions taken by Peter” (1968, p. 7). Other influences can be found in Albert the Great, who used Sherwood’s notion of appellation rather than Peter of Spain’s (Kretzmann 1966, p. 5)[^kretzmann-1966], and Thomas Aquinas, whose analysis of modal propositions follows Sherwood (Kretzmann 1966, p. 5; Uckelman 2008)[^kretzmann-1966][^uckelman-2008].
    step1: |-
      除了这些明确提及之外，舍伍德的著作显然在 13 世纪后半叶的巴黎大学逻辑学家中影响广泛。最直接的传承线从舍伍德的威廉通向他名气大得多的同僚西班牙的彼得。多年来人们相信，彼得是第一个翻译普塞洛斯文本的人（Mullinger 1873, p. 176）[^mullinger-1873]，直到舍伍德《导论》被重新发现——它比彼得的著作早二十年，且更接近普塞洛斯的作品。彼得的《逻辑摘要》显然受惠于舍伍德。Kretzmann 指出，“《纲要》中那些使它成为中世纪远为最流行的逻辑教科书的许多特征，看来分明是作为对《导论》中更困难的讨论与不那么讨喜的助记装置的修改而发展出来的”（Kretzmann 1968, p. 6）[^kretzmann-1968]。另一方面，舍伍德在撰写自己的非范畴词论文时，似乎也受到彼得那部论文的影响；Kretzmann 概述了舍伍德论文中的若干段落，它们“可以读作对彼得所持立场的暗示”（1968, p. 7）。其他影响可见于大阿尔伯特——他采用舍伍德的称谓概念而非西班牙的彼得的（Kretzmann 1966, p. 5）[^kretzmann-1966]——以及托马斯·阿奎那，后者对模态命题的分析追随舍伍德（Kretzmann 1966, p. 5；Uckelman 2008）[^kretzmann-1966][^uckelman-2008]。
    step2: |-
      除这些明文提及外，舍伍德的著作显然在 13 世纪后半叶巴黎大学的逻辑学家间影响甚广。最直接的传承线，由舍伍德的威廉通向名气远大于他的同僚西班牙的彼得。多年间人们相信彼得是头一个翻译普塞洛斯文本的人（Mullinger 1873, p. 176）[^mullinger-1873]；直到舍伍德《导论》重见天日——它比彼得早二十年，且更贴近普塞洛斯的原作。彼得的《逻辑摘要》显然受惠于舍伍德。Kretzmann 说：“《纲要》之成为中世纪遥遥领先的最流行逻辑教科书，其中许多特色，分明是由《导论》里那些较艰深的讨论、以及不那么讨喜的助记装置修改而来”（Kretzmann 1968, p. 6）[^kretzmann-1968]。反过来说，舍伍德写自己的非范畴词论文时，似也受彼得那部论文影响；Kretzmann 列举了舍伍德文中若干段落，说它们“可读作对彼得所持立场的暗指”（1968, p. 7）。其他影响见于大阿尔伯特——他取用舍伍德的称谓概念，而不用西班牙的彼得的（Kretzmann 1966, p. 5）[^kretzmann-1966]——以及托马斯·阿奎那，其对模态命题的分析即步舍伍德后尘（Kretzmann 1966, p. 5；Uckelman 2008）[^kretzmann-1966][^uckelman-2008]。
  - id: 56
    kind: body
    source: |-
      Though Sherwood’s indirect influence on the development of logic and semantics, via his influence on Peter of Spain, should not be underestimated, his direct influence beyond the 13th century was more minimal, in part because the influence of Peter of Spain was so great. In the 14th century, any influence Sherwood’s approach to the properties of terms might have still had was almost entirely eclipsed by figures such as William of Ockham, John Buridan, and Albert of Saxony (Bos 2011, p. 773)[^bos-2011].
    step1: |-
      舍伍德通过影响西班牙的彼得而对逻辑与语义学的发展产生了间接影响，这不应低估；但他在 13 世纪之后的直接影响较为有限，部分原因是西班牙的彼得影响太大。在 14 世纪，舍伍德词项特性进路可能还有的任何影响，几乎完全被奥卡姆的威廉、让·布里丹和萨克森的阿尔伯特等人遮蔽（Bos 2011, p. 773）[^bos-2011]。
    step2: |-
      舍伍德假道西班牙的彼得而间接影响逻辑与语义学的发展，这一点不可小觑；但他在 13 世纪之后的直接影响反倒有限，部分正因彼得的影响太大。到了 14 世纪，他那套词项特性进路纵有余绪，也几乎全被奥卡姆的威廉、让·布里丹、萨克森的阿尔伯特等人盖过（Bos 2011, p. 773）[^bos-2011]。
