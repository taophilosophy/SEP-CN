      For a discussion of most of the notions in this division as well as a comparison of Sherwood’s views to those of his 13th-century contemporaries and his 14th-century posterity, see the entry on medieval theories: properties of terms. We briefly comment on two distinctive aspects of Sherwood’s supposition theory.
    step1: |-
      关于这一划分中的大多数概念，以及舍伍德的观点与其 13 世纪同代人及 14 世纪后学的比较，参见论中世纪词项特性理论的词条。我们简要评论舍伍德指代理论的两个特色方面。
    step2: |-
      这一划分中的多数概念，以及舍伍德与 13 世纪同人、14 世纪后学的异同，可参见论中世纪词项特性理论的词条。这里只简评其指代理论的两个特色。
