      In his *Introduction*, Sherwood gives two definitions for ‘mode’, depending on whether the term is being used broadly or strictly: “Broadly speaking, a mode is the determination of an act, and in this respect it goes together with every adverb”, while strictly speaking we count not all adverbs as modes but only those which determine the inherence of the predicate in the subject (Kretzmann 1966, p. 40)[^kretzmann-1966]. Thus, on the broad conception of ‘mode’, both ‘Socrates is necessarily running’ and ‘Socrates is swiftly running’ count as modal statements, but on the narrow conception, only the former does. The six modes are ‘true’, ‘false’, ‘possible’, ‘contingent’, ‘impossible’, and ‘necessary’, though “the first two do not distinguish a modal proposition from an assertoric statement” (Kretzmann 1966, pp. 40–41)[^kretzmann-1966]. The other four modes give rise to properly modal propositions, and in statements expressing these propositions, the associated modal adverbs are ‘possibly’, ‘contingently’, ‘impossibly’, and ‘necessarily’. Each of these modal adverbs is a syncategorematic term; and in the *Syncategoremata*, Sherwood devotes an entire chapter to *necessario* (‘necessarily’) and *contingenter* (‘contingently’).
    step1: |-
      在《导论》中，舍伍德给“模态”下了两个定义，视该词作宽泛用法还是严格用法而定：“宽泛地说，模态是对行为的限定，就此而言它与每一个副词同类”；而严格说来，我们并不把所有副词都算作模态，只把限定谓项在主语中的内属者算作模态（Kretzmann 1966, p. 40）[^kretzmann-1966]。于是，按宽泛的“模态”概念，“苏格拉底必然在跑”与“苏格拉底迅速地在跑”都算模态语句；但按狭窄概念，只有前者算。六种模态是“真”“假”“可能”“偶然”“不可能”与“必然”，不过“前两种并不使一个模态命题有别于一个直言语句”（Kretzmann 1966, pp. 40–41）[^kretzmann-1966]。其余四种模态产生严格意义上的模态命题，而表达这些命题的语句中，相关的模态副词是“可能地”“偶然地”“不可能地”与“必然地”。这些模态副词每一个都是非范畴词项；在《非范畴词论》中，舍伍德用整整一章讨论 *necessario*（“必然地”）与 *contingenter*（“偶然地”）。
    step2: |-
      《导论》给“模态”下了两个定义，随宽严二义而别：“宽泛地说，模态是对行为的限定，就此而言，它与一切副词同类”；严格说来则不然，并非所有副词都算模态，只有限定谓项在主语中内属的才算（Kretzmann 1966, p. 40）[^kretzmann-1966]。因此，按宽义，“苏格拉底必然在跑”与“苏格拉底飞快地跑”都是模态语句；按狭义则只有前者是。六种模态为“真”“假”“可能”“偶然”“不可能”“必然”；不过“前两种并不使模态命题有别于直言语句”（Kretzmann 1966, pp. 40–41）[^kretzmann-1966]。其余四种模态才生成严格意义上的模态命题，相应语句中的模态副词是“可能地”“偶然地”“不可能地”“必然地”。这些模态副词个个都是非范畴词项；《非范畴词论》中专辟一章讨论 *necessario*（“必然地”）与 *contingenter*（“偶然地”）。
