      Note that, conveniently, ‘a’ and ‘i’ are the first two vowels in Latin *affirmo* ‘I affirm’, and ‘e’ and ‘o’ are the two vowels in Latin *nego* ‘I deny’. While the names that Sherwood introduces are typical/traditional, the explanation he gives of the names is *not*. First, he doesn’t note that the first letter of the name indicates to which of the four basic syllogisms, Barbara, Celarent, Darii, and Ferio, the others can be reduced. Second, his identification of ‘b’ and ‘r’ as the cues for *reductio per impossibile* are atypical.
    step1: |-
      请注意，方便的是，‘a’ 与 ‘i’ 正是拉丁文 *affirmo*（“我肯定”）的头两个元音，而 ‘e’ 与 ‘o’ 是拉丁文 *nego*（“我否定”）的两个元音。舍伍德引入的这些名称是典型／传统的，但他对名称的解释却*不是*。第一，他没有指出名称的首字母表明其余三段论可以还原为四种基本三段论 Barbara、Celarent、Darii 与 Ferio 中的哪一种。第二，他把 ‘b’ 与 ‘r’ 认定为*归谬还原*的提示，这一点不合常规。
    step2: |-
      顺带一提，‘a’ 与 ‘i’ 恰好是拉丁文 *affirmo*（“我肯定”）的头两个元音，‘e’ 与 ‘o’ 则是 *nego*（“我否定”）里的两个元音。名称本身都是传统套路，可舍伍德对它们的解释*并不*传统。其一，他没有说明名称首字母标示着可还原为 Barbara、Celarent、Darii、Ferio 四个基本三段论中的哪一个；其二，他把 ‘b’ 与 ‘r’ 当作*归谬还原*的提示，也不循惯例。
