  - id: 3
    kind: body
    source: |-
      William of Sherwood was born between 1200 and 1205, probably in Nottinghamshire, and died between 1266 and 1272. His school career is uncertain, but given references to his works and his influence on people such as Peter of Spain, Lambert of Auxerre, Albert the Great, and Thomas Aquinas, it is likely that he was teaching logic at the University of Paris between 1235 and 1250. After that period, he seems to have left logic. He was a master at Oxford in 1252 and treasurer of the cathedral of Lincoln about two years later; still later, he was rector at Aylesbury, in Buckinghamshire, and Attleborough, in Norfolk. He was still alive in 1266 but dead by 1272 (Kretzmann 1968, p. 3)[^kretzmann-1968].
    step1: |-
      舍伍德的威廉生于 1200 至 1205 年之间，大概在诺丁汉郡，卒于 1266 至 1272 年之间。他的求学经历不确定，但鉴于其著作的引用情况以及他对西班牙的彼得、奥塞尔的兰贝尔、大阿尔伯特和托马斯·阿奎那等人的影响，他很可能在 1235 至 1250 年间在巴黎大学讲授逻辑。此后，他似乎离开了逻辑学。1252 年他是牛津的一名教师，约两年后任林肯大教堂司库；再往后，他先后任白金汉郡艾尔斯伯里和诺福克郡阿特尔伯勒的教区长。1266 年他仍在世，至 1272 年已去世（Kretzmann 1968, p. 3）[^kretzmann-1968]。
    step2: |-
      舍伍德的威廉约生于 1200—1205 年间，出生地大概在诺丁汉郡，卒于 1266—1272 年间。他的求学经历已难考实；不过，从其著作屡被征引、又影响了西班牙的彼得、奥塞尔的兰贝尔、大阿尔伯特与托马斯·阿奎那等人来看，1235—1250 年间他多半在巴黎大学讲逻辑。此后他似乎告别了逻辑。1252 年他在牛津任硕士（教师），两年上下之后出任林肯大教堂司库；更晚又先后任白金汉郡艾尔斯伯里、诺福克郡阿特尔伯勒两地的教区长。1266 年他尚在人世，1272 年已不在了（Kretzmann 1968, p. 3）[^kretzmann-1968]。
  - id: 4
    kind: body
    source: |-
      Part of the difficulty with establishing his biography is that he has previously been conflated with various other 13th-century Englishmen named William, such as William of Leicester (d. 1213) and William of Durham (d. 1249) (cf. Grabmann 1937, pp. 11–13; Kretzmann 1966, p. 3; Mullinger 1873, p. 177)[^grabmann-1937][^kretzmann-1966][^mullinger-1873]. He has also sometimes been identified with others bearing the same surname, such as the author of commentary, now lost, on the *Sentences* of Peter Lombard with the title *Shirovodus super sententias*, a work that was known to John Leland in the 16th century (Kretzmann 1966, p. 12)[^kretzmann-1966], or Ricardus de Schirewode, who wrote a treatise on insolubles surviving in Cambridge, St John’s MS 100. This confusion, along with the usual problems presented by anonymous material, makes it difficult to identify William’s works with certainty.
    step1: |-
      确立其生平之所以困难，部分原因在于他先前一直被混同于其他一些名为威廉的 13 世纪英格兰人，例如莱斯特的威廉（卒于 1213 年）和达勒姆的威廉（卒于 1249 年）（参见 Grabmann 1937, pp. 11–13；Kretzmann 1966, p. 3；Mullinger 1873, p. 177）[^grabmann-1937][^kretzmann-1966][^mullinger-1873]。他有时还被认定是另一些同姓者，例如一部今已佚失的、题为《舍伍德注〈箴言四书〉》的彼得·伦巴德《箴言四书》评注的作者——该作品在 16 世纪尚为约翰·利兰所知（Kretzmann 1966, p. 12）[^kretzmann-1966]——或写有一部论不可解命题的论文、今存剑桥圣约翰学院 MS 100 的里卡德·德·希雷伍德。这种混淆，加上匿名材料惯有的问题，使人难以确凿认定威廉的著作。
    step2: |-
      生平难考，一半是因为他长期以来被同其他一些同名的 13 世纪英格兰人混为一谈，如莱斯特的威廉（卒于 1213 年）、达勒姆的威廉（卒于 1249 年）（参 Grabmann 1937, pp. 11–13；Kretzmann 1966, p. 3；Mullinger 1873, p. 177）[^grabmann-1937][^kretzmann-1966][^mullinger-1873]。他有时还被认作同姓的其他人：或是彼得·伦巴德《箴言四书》一部今已佚失评注（题作《舍伍德注〈箴言四书〉》）的作者——16 世纪的约翰·利兰尚知此书（Kretzmann 1966, p. 12）[^kretzmann-1966]；或是写过一篇论不可解命题的论文、今存剑桥圣约翰学院 MS 100 的里卡德·德·希雷伍德。这类混淆，再添上匿名文献常见的老难题，叫人很难把哪些著作确凿归到威廉名下。
  - id: 5
    kind: body
    source: |-
      Two works can be confidently ascribed to Sherwood, an *Introduction to Logic* and a treatise on syncategorematic terms, the *Syncategoremata*. The *Introduction* survives in complete form in only one manuscript, Bibliothèque Nationale MS. Lat. 16,617, from the late 13th or 14th century, which begins with the heading *Introductiones Magistri Guilli. de Shyreswode in logicam*, “Introduction to Logic of Master William of Sherwood”. The *Syncategoremata* immediately follows, and is likewise explicitly attributed to Sherwood. The *Syncategoremata* also survives in a second manuscript, Bodleian MS Digby 55, where it is again explicitly labeled, *Sincategoreumata Magistri Willielmi de Sirewode* “[Treatise on] Syncategorematics of Master William of Sherwood”, and Chapter Five of the *Introduction* survives in a second manuscript, MS Worcester Cath. Q. 13, written around 1293/94, and edited by Pinborg & Ebbesen (1984).
    step1: |-
      有两部著作可以确凿归于舍伍德：一部《逻辑导论》和一部论非范畴词的论文《非范畴词论》。《导论》全篇仅存于一份手稿，即 13 世纪末或 14 世纪的法国国家图书馆 MS Lat. 16,617，其开头标题为 *Introductiones Magistri Guilli. de Shyreswode in logicam*（“舍伍德的威廉导师的《逻辑导论》”）。《非范畴词论》紧随其后，同样被明确归于舍伍德。《非范畴词论》还见于第二份手稿博德利图书馆 MS Digby 55，其中它也明确标为 *Sincategoreumata Magistri Willielmi de Sirewode*（“舍伍德的威廉导师的《非范畴词论》”）；而《导论》第五章另存于约 1293/94 年写成的伍斯特座堂手稿 MS Q. 13，由 Pinborg 与 Ebbesen 编辑（1984）。
    step2: |-
      可以确凿归于舍伍德的著作有两部：一部《逻辑导论》和一部论非范畴词的论文《非范畴词论》。《导论》全篇仅存一份手稿，即约 13 世纪末或 14 世纪的法国国家图书馆 MS Lat. 16,617；其标题为 *Introductiones Magistri Guilli. de Shyreswode in logicam*（“舍伍德的威廉导师《逻辑导论》”）。紧接其后的是《非范畴词论》，同样明确署名舍伍德。《非范畴词论》另见于博德利图书馆 MS Digby 55，标题同样明确：*Sincategoreumata Magistri Willielmi de Sirewode*（“舍伍德的威廉导师《非范畴词论》”）。《导论》第五章则另存于约 1293/94 年抄写的伍斯特座堂手稿 MS Q. 13，由 Pinborg 与 Ebbesen 编辑刊行（1984）。
  - id: 6
    kind: body
    source: |-
      The *Introduction* was almost certainly written while William was lecturing on logic at the University of Paris; Ebbesen (2020, fn. 6) argues it probably dates from the 1230s. It was first edited by Grabmann (1937) and translated into English by Kretzmann (1966). A new critical edition was produced by Brands and Kann (1995), accompanied by a translation into German. It has been argued (Mullinger 1873, p. 177)[^mullinger-1873] that this book was heavily influenced by a *Synopsis* treatise written by the 11th-century Byzantine logician Michael Constantine Psellus. The *Introduction* contains the first appearance of the syllogistic mnemonic verse ‘Barbara, Celarent…’, which Augustus de Morgan described as “magic words … more full of meaning than any that ever were made”, and Sherwood may even have been the inventor of the verse, though references to individual names appear earlier (Kretzmann 1966, pp. 66–67)[^kretzmann-1966].
    step1: |-
      《导论》几乎可以肯定写于威廉在巴黎大学讲授逻辑期间；Ebbesen（2020, fn. 6）论证它可能成于 1230 年代。它最初由 Grabmann（1937）编辑，由 Kretzmann（1966）译成英语。Brands 与 Kann（1995）产出新的校勘本，并附德译。有人论证（Mullinger 1873, p. 177）[^mullinger-1873]此书深受 11 世纪拜占庭逻辑学家迈克尔·康斯坦丁·普塞洛斯一部《纲要》论著的影响。《导论》包含三段论助记诀“Barbara, Celarent…”的首次出现，奥古斯都·德摩根曾形容这些词是“有魔力的词……比任何曾经造出的词都更充满意义”，舍伍德甚至可能就是这一助记诀的发明者，不过对各个专名的引用出现得更早（Kretzmann 1966, pp. 66–67）[^kretzmann-1966]。
    step2: |-
      《导论》几乎可以肯定写于威廉在巴黎大学讲逻辑之时；Ebbesen（2020, fn. 6）论证其成书当在 1230 年代。此书最初由 Grabmann 编辑刊行（1937），Kretzmann 将其译成英文（1966）；Brands 与 Kann（1995）出了新的校勘本，附德译。有人认为（Mullinger 1873, p. 177）[^mullinger-1873]，此书深受 11 世纪拜占庭逻辑学家米哈伊尔·康斯坦丁·普塞洛斯一部《纲要》式论著的影响。《导论》首次记下了那条三段论助记诀“Barbara, Celarent…”，奥古斯都·德摩根形容它是“有魔力的词……比任何曾经造出的词都更充满意义”；舍伍德甚至可能就是这条诀的发明人，尽管其中各个专名更早已见于文字（Kretzmann 1966, pp. 66–67）[^kretzmann-1966]。
  - id: 7
    kind: body
    source: |-
      Sherwood’s treatise on syncategorematic terms has long been held to be if not the earliest such treatise, then the earliest still accessible (Boehner 1952, p. 7)[^boehner-1952]. The text was first edited by O’Donnell (1941), and this edition along with the Paris MS was the basis of Kretzmann’s 1968 translation into English. O’Donnell’s edition has since been superseded by the critical edition of Kann and Kirchhoff (2012), which also includes a translation into German. Kirchhoff (2008) is an extensive discussion and commentary on the *Syncategormeta*.
    step1: |-
      舍伍德的非范畴词论文长期被认为即便不是最早的此类论文，也是最早尚可寓目的论文（Boehner 1952, p. 7）[^boehner-1952]。该文本最初由 O'Donnell（1941）编辑，这一版本连同巴黎手稿构成了 Kretzmann 1968 年英译的底本。O'Donnell 的版本后来被 Kann 与 Kirchhoff（2012）的校勘本取代，后者也附德译。Kirchhoff（2008）是对《非范畴词论》的详尽讨论与评注。
    step2: |-
      舍伍德这部非范畴词论文，长期以来被认作：即便不是此类论文中最早的，至少也是最早仍可寓目的一部（Boehner 1952, p. 7）[^boehner-1952]。文本最初由 O'Donnell 编辑（1941）；这一版本连同巴黎手稿，正是 Kretzmann 1968 年英译的底本。O'Donnell 本后来为 Kann 与 Kirchhoff 的校勘本（2012）所取代，后者同样附德译。Kirchhoff（2008）则是对《非范畴词论》的详尽讨论与评注。
  - id: 8
    kind: body
    source: |-
      Three other logical treatises follow the *Introductiones* and the *Syncategoremata* in the Paris manuscript, which have as a result been tentatively attributed to Sherwood. The first is a treatise on insolubles, ff. 46–54, edited by Roure (1970), and the second a treatise on *obligationes* found in Paris, Bibl. Nat. 16617. This text was edited by Green (1963), who tentatively attributed it to Sherwood. The third is the text *Petitiones Contrariorum*, edited by de Rijk (1976), covering puzzles arising from hidden contradictions in sets of premises. Sherwood may also be the author of the *Fallaciae magistri Willelmi* “Fallacies, of Master William” preserved in British Museum, King’s Library MS 9 E XII, as well as the treatise ascribed to Richard of Sherwood noted above.
    step1: |-
      巴黎手稿中还有另外三部逻辑论文紧随《逻辑导论》与《非范畴词论》之后，因此有人暂把它们归于舍伍德。第一部是论不可解命题的论文，见 ff. 46–54，由 Roure（1970）编辑；第二部是见于巴黎 Bibl. Nat. 16617 的义务理论论文，由 Green（1963）编辑，他暂将其归于舍伍德。第三部是《相反者的请求》，由 de Rijk（1976）编辑，涉及隐藏于前提集之中的矛盾所引发的难题。舍伍德也可能是藏于不列颠博物馆国王图书馆 MS 9 E XII 的《威廉导师的谬误论证》的作者，以及上文提到的归于里卡德·德·舍伍德名下那部论文的作者。
    step2: |-
      在巴黎手稿里，《逻辑导论》与《非范畴词论》之后还跟着三部逻辑论文，故有人暂且把它们归于舍伍德。其一为论不可解命题的论文（ff. 46–54），Roure 编辑（1970）；其二为见于巴黎 Bibl. Nat. 16617 的义务理论论文，Green 编辑（1963）并暂归舍伍德；其三为《相反者的请求》，de Rijk 编辑（1976），讨论前提集中隐匿矛盾所生的种种难题。藏于不列颠博物馆国王图书馆 MS 9 E XII 的《威廉导师的谬误论证》，以及上文归于里卡德·德·舍伍德名下的那篇论文，作者也可能是他。
  - id: 9
    kind: body
    source: |-
      Three further treatises have previously also been attributed to Sherwood, but the evidence for their attribution is less clear: the commentary on the *Sentences* of Peter Lombard noted above, a *Distictiones theologicae*, and a *Concionces*, or collection of sermons (Kretzmann 1968, p. 4)[^kretzmann-1968].
    step1: |-
      另有三部论文此前也曾归于舍伍德，但归属的证据不那么清楚：上面提到的彼得·伦巴德《箴言四书》评注、一部《神学辨析集》，以及一部《布道集》即布道文汇编（Kretzmann 1968, p. 4）[^kretzmann-1968]。
    step2: |-
      此外还有三部论文曾归于舍伍德名下，但证据不那么扎实：前述彼得·伦巴德《箴言四书》评注、一部《神学辨析集》，以及一部《布道集》，即布道文汇编（Kretzmann 1968, p. 4）[^kretzmann-1968]。
