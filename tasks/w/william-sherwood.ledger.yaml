      ## 2 学说语境
  - id: 11
    kind: body
    source: |-
      Along with Peter of Spain, Lambert of Auxerre, and Roger Bacon, William of Sherwood was one of the first terminist logicians, working in a context where the newly discovered and translated Aristotelian material of the 12th century had become fully integrated into the logical and philosophical curricula through the works of people such as John le Page (Uckelman & Lagerlund, 2016). The terminist period of logic was marked by the development of logical genres and techniques that go beyond Aristotle and mere commentaries on his works. The two primary branches of terminist logic are the study of the properties of terms and the study of the meaning and function of syncategorematic words. Sherwood’s *Introduction* picks up the first of these two branches in its fifth chapter (the most interesting chapter of the *Introduction*), and his *Syncategoremata* deals with the second. The remainder of the *Introductiones* is devoted to the standard Aristotelian material: Chapter One on statements corresponds to *On Interpretation*; Chapter Two on predicables to the *Categories*; Chapter Three on syllogisms to the *Prior Analytics*; Chapter Four on dialectical reasoning to the *Topics*; and Chapter Six on sophistical reasoning to the *Sophistical Refutations*. We will focus our attention in this article on the unusual or distinctive aspects of his logical and semantic theory, primarily found in Chapter Five of the *Introduction* and in the *Syncategoremata*.
    step1: |-
      与西班牙的彼得、奥塞尔的兰贝尔和罗吉尔·培根一道，舍伍德的威廉是最早的词项主义逻辑学家之一；他们所处的语境是，12 世纪新发现并翻译的亚里士多德材料，经由约翰·勒佩奇等人的著作，已完全融入逻辑与哲学课程（Uckelman & Lagerlund, 2016）。词项主义时期的逻辑以发展出超出亚里士多德及其单纯评注的逻辑体裁与技巧为标志。词项逻辑的两大主要分支，一是对词项特性的研究，二是对非范畴词的意义与功能的研究。舍伍德的《导论》在其第五章（全篇最有趣的章节）处理前一分支，其《非范畴词论》处理后一分支。《导论》其余部分则用于处理标准的亚里士多德材料：第一章论语句，对应《解释篇》；第二章论谓项，对应《范畴篇》；第三章论三段论，对应《前分析篇》；第四章论辩证推理，对应《论题篇》；第六章论诡辩推理，对应《辨谬篇》。本文将把注意力集中在他的逻辑与语义理论中不寻常或有特色的方面，主要见于《导论》第五章与《非范畴词论》。
    step2: |-
      与西班牙的彼得、奥塞尔的兰贝尔、罗吉尔·培根并列，舍伍德的威廉是最早一批词项主义逻辑学家；在他们所处的语境里，12 世纪新发现并译出的亚里士多德材料，经约翰·勒佩奇等人的著述，已完全融入逻辑与哲学课程（Uckelman & Lagerlund, 2016）。词项主义时期的特点，是发展出一批超出亚里士多德、也超出单纯评注的逻辑体裁与技术。词项逻辑两大主干：一是研究词项特性，二是研究非范畴词的意义与功能。舍伍德的《导论》在第五章（全篇最有趣的一章）处理前者，其《非范畴词论》处理后者。《导论》其余各章则处理标准亚里士多德材料：第一章论语句，对应《解释篇》；第二章论谓项，对应《范畴篇》；第三章论三段论，对应《前分析篇》；第四章论辩证推理，对应《论题篇》；第六章论诡辩推理，对应《辨谬篇》。本文着重谈其逻辑与语义理论中不寻常、有特色的方面，主要见于《导论》第五章与《非范畴词论》。
