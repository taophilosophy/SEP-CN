    source: |-
      > [Singular statements] differ [from partial statements] in this respect: if two statements are singular and of different quality, they are not subcontraries but, in accordance with the theory, contradictories — e.g., ‘Socrates is running,’ ‘Socrates is not running’ (Kretzmann 1968, p. 31)[^kretzmann-1968].
    step1: |-
      > [单称语句]在这一点上有别于[特称语句]：如果两个语句是单称的且性质不同，它们就不是下反对关系，而是按理论说构成矛盾关系——例如“苏格拉底在跑”“苏格拉底没在跑”（Kretzmann 1968, p. 31）[^kretzmann-1968]。
    step2: |-
      > [单称命题]与[特称命题]的分别在于：两个单称命题若质不同，彼此就不是下反对关系，按理论说倒成矛盾关系——例如“苏格拉底在跑”与“苏格拉底不在跑”（Kretzmann 1968, p. 31）[^kretzmann-1968]。
