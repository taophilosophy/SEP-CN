      （记住，一个*被称谓者*是既存在、又为主语所代表或指涉的东西。）其依据取自亚里士多德，舍伍德引述他说：“对于两个人，我们说他们是两个，或两者，而不说他们全都是”（Kretzmann 1968, p. 23）[^kretzmann-1968]；也就是说，如果少于三个，说“两者”或“一个”比说“全部”更恰当（进一步讨论见 Mora-Márquez 2015, p. 197）[^mora-márquez-2015]。
