      Since Aristotle it was standard practice to note that ‘possible’ can be used in two ways. In the first ‘possible’ is compatible with ‘necessary’, but in the second, that which is necessary is not (merely) possible. This second way is usually called ‘contingent’. Sherwood mentions this distinction, but goes on to say that he will be using it in a broader sense, in which possibility is compatible with necessity (Kretzmann 1966, p. 41)[^kretzmann-1966]. However, he makes a further distinction, which he does maintain, between the two ways that ‘impossible’ and ‘necessary’ can be used. These different ways are expressed in temporal notions:
    step1: |-
      自亚里士多德以来，指出“可能”有两种用法是标准做法。在第一种用法中，“可能”与“必然”相容；但在第二种用法中，必然者并不（仅仅）是可能的。第二种用法通常称为“偶然”。舍伍德提到这一区分，但接着说，他将在更宽泛的意义上使用该词，在这一意义中可能与必然相容（Kretzmann 1966, p. 41）[^kretzmann-1966]。然而他又作出一个他确实坚持的进一步区分，即“不可能”与“必然”的两种用法之别。这些不同用法以时间概念来表达：
    step2: |-
      自亚里士多德以来，指出“可能”有两义已是惯例。第一义与“必然”相容；第二义下，必然者并不（只）是可能的——这第二义通常叫“偶然”。舍伍德提到这一区分，却说自己要用较宽的义，即可能与必然相容（Kretzmann 1966, p. 41）[^kretzmann-1966]。不过他另作一层区分，且确实坚持：即“不可能”与“必然”各有两义，而以时间概念表述：
