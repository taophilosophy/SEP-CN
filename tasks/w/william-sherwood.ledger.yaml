      Categorical statements are traditionally divided into universal statements (‘All P are Q’, ‘No P are Q’) and partial statements (‘Some P is Q’, ‘Some P is not Q’), and it was routine, since Aristotle, for logicians to investigate these types of statements through the traditional Square of Opposition. Sherwood, however, explicitly distinguished a third type of categorical statement, the singular, where the subject term is a singular term. He argues that
    step1: |-
      直言语句传统上分为全称语句（“所有 P 都是 Q”“没有 P 是 Q”）和特称语句（“有的 P 是 Q”“有的 P 不是 Q”），并且自亚里士多德以来，逻辑学家通常通过传统对当方阵来研究这些类型的语句。然而，舍伍德明确区分出第三种直言语句，即主项词项为单称词项的单称语句。他论证说：
    step2: |-
      直言语句历来分为全称（“所有 P 都是 Q”“没有 P 是 Q”）与特称（“有的 P 是 Q”“有的 P 不是 Q”）两类；自亚里士多德以来，逻辑学家惯于借传统对当方阵来考察它们。舍伍德却明确划出第三类直言语句——单称语句，其主项为单称词项。他论证道：
  - id: 31
