      Kretzmann notes that this is “the oldest known surviving version of these famous mnemonic verses, and Sherwood may have been the inventor of them … However, there were earlier attempts at the same sort of device in the thirteenth century, and the word ‘Festino’ appears ‘in a MS dating at the latest from 1200′” (Kretzmann 1968, pp. 66–67, quoting Bochenski)[^kretzmann-1968], and similar verses also occur in the 12th-century *Logica Ut Dicit* and the *Logic ‘cum sit nostra’* (Bacon 2009, p. 146)[^bacon-2009], both of which texts influenced Sherwood (Brumberg-Chaumont 2013, p. 184)[^brumberg-chaumont-2013]. Later, in the same footnote, Kretzmann compares Sherwood’s verses to those in Peter of Spain and concludes that the differences between the two “strongly suggest at least one earlier version on which both men were drawing” (Kretzmann 1968, p. 67)[^kretzmann-1968]. The verse is in dactylic hexameter, a classical style found in Homer (in Greek) and Ovid and Virgil (in Latin), suggesting “that the anonymous creator of the mnemonic was schooled in poetry over and above, as we will see, being masterful in his knowledge of Aristotle and imaginative in logic” (Corcoran, et al., 2018, p. 13).
    step1: |-
      Kretzmann 指出，这是“这些著名助记诗现存最古老的版本，舍伍德可能就是它们的发明者……不过，13 世纪已有同类装置的其他尝试，而‘Festino’一词‘见于一份至迟 1200 年的手稿’”（Kretzmann 1968, pp. 66–67，引 Bochenski）[^kretzmann-1968]；类似的诗句也见于 12 世纪的《如其所言之逻辑》和《我们的逻辑》，这两部文本都影响了舍伍德（Bacon 2009, p. 146）[^bacon-2009]（Brumberg-Chaumont 2013, p. 184）[^brumberg-chaumont-2013]。后来，在同一条脚注中，Kretzmann 把舍伍德的诗句与西班牙的彼得的诗句相比较，得出结论说，二者的差异“强烈提示至少有一个更早的版本为两人所取材”（Kretzmann 1968, p. 67）[^kretzmann-1968]。这首诗用扬抑抑六音步写成，这是一种古典诗体，见于荷马（希腊文）以及奥维德与维吉尔（拉丁文），这表明“这位无名助记诀创造者受过诗歌训练，不仅如此，我们还将看到，他还精通亚里士多德、在逻辑上富于想象”（Corcoran, et al., 2018, p. 13）。
    step2: |-
      Kretzmann 指出，这是“这些著名助记诗现存最早的版本，说不定就是舍伍德所造……不过 13 世纪已有同类设计的其他尝试，而‘Festino’一词‘见于一份至迟 1200 年的手稿’”（Kretzmann 1968, pp. 66–67，引 Bochenski）[^kretzmann-1968]。类似的诗句也见于 12 世纪的《如其所言之逻辑》与《我们的逻辑》，两部文本都影响了舍伍德（Bacon 2009, p. 146）[^bacon-2009]（Brumberg-Chaumont 2013, p. 184）[^brumberg-chaumont-2013]。后来在同一条脚注里，Kretzmann 把舍伍德的诗句同西班牙的彼得的诗句相较，断定二者的差别“强烈提示曾有一个更早的版本，为两人所共同取材”（Kretzmann 1968, p. 67）[^kretzmann-1968]。此诗用的是扬抑抑六音步——荷马（希腊文）、奥维德与维吉尔（拉丁文）所用的一种古典诗体；这说明“这位佚名助记诀作者受过诗的训练，而且，下文将见，他还精通亚里士多德、于逻辑富有机想”（Corcoran, et al., 2018, p. 13）。
