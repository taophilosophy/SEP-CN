      The idea of the success condition is that one puts one’s knowledge into practice. Or, rather than using the terminology of success, one might require that a wise person’s beliefs and values cohere with one’s actions (Tiberius, 2008). The main idea is that one’s actions are reflective of one’s understanding of what it means to live well. A view along the lines of (KLS) would be embraced by Aristotle and Zagzebski (for practical wisdom), and by Kekes, Nozick, and Tiberius. (KLS) would not be universally embraced, however (see Ryan 1999, for further criticisms)[^ryan-1999]. One criticism of (KLS) is that one might think that all the factual knowledge required by (WFK) is missing from this theory. One might argue that (WFK), the view that a wise person has extensive factual knowledge, was rejected only because it did not provide sufficient conditions for wisdom. Many philosophers would claim that (WFK) does provide a necessary condition for wisdom. A wise person, such a critic would argue, needs to know how to live well (as described by Nozick), but she also needs to have some deep and far-reaching theoretical, or factual, knowledge that may have very little impact on her daily life, practical decisions, or well being. In the preface of his *Principles of Philosophy*, Descartes insisted upon factual knowledge as an important component of wisdom. Descartes wrote, “It is really only God alone who has Perfect Wisdom, that is to say, who has a complete knowledge of the truth of all things; but it may be said that men have more wisdom or less according as they have more or less knowledge of the most important truths” (*Principles*, 204). Of course, among those important truths, one might claim, are truths about living well, as well as knowledge in the basic academic subject areas.
    step1: |-
      成功条件的想法是：一个人把知识付诸实践。或者，人们可以不用成功的术语，而要求有智慧者的信念与价值同其行动相一致（Tiberius, 2008）。主要想法是，一个人的行动反映其对“过好生活意味着什么”的理解。沿着（KLS）的思路，这样的见解会得到亚里士多德与 Zagzebski（就实践智慧而言）以及 Kekes、Nozick 和 Tiberius 的赞同。然而，（KLS）不会得到普遍赞同（进一步的批评参见 Ryan 1999）[^ryan-1999]。对（KLS）的一项批评是：人们可能认为，（WFK）所要求的一切事实知识在这一理论中都缺失了。人们可以论证说，（WFK）——即有智慧者拥有广博事实知识这一见解——之所以被拒绝，只是因为它没有提供智慧的充分条件。许多哲学家会主张，（WFK）确实提供了智慧的一个必要条件。这样的批评者会论证说，有智慧的人需要懂得如何过好生活（如 Nozick 所描述），但她还需要拥有某种深刻而影响深远的理论或事实知识，这种知识对她日常生活、实践决定或福祉也许影响甚小。笛卡尔在其《哲学原理》序言中坚持事实知识是智慧的重要组成部分。笛卡尔写道：“真正只有上帝才有完善的智慧，也就是说，只有上帝才完全知道一切事物的真理；但可以说，人按其知道最重要的真理之多寡，而有较多或较少的智慧”（《哲学原理》, 204）。当然，人们可以说，这些重要真理当中包括关于过好生活的真理，也包括基础学术科目领域的知识。
    step2: |-
      成功条件的意思就是：把知识用起来。或者不叫“成功”，而要求智者的信念、价值同行动相合（Tiberius, 2008）——核心是：行动要体现自己对“何谓过好生活”的理解。沿（KLS）这条路子的见解，会得到亚里士多德与 Zagzebski（就实践智慧而言）、以及 Kekes、Nozick、Tiberius 的首肯；但它不会人人买账（进一步的批评见 Ryan 1999）[^ryan-1999]。对（KLS）的一项批评是：有人会说，它把（WFK）要求的那一大堆事实知识全丢了。他们会说，（WFK）——即“智者拥有广博事实知识”之说——被否掉，只是因为它没给出智慧的充分条件；而许多哲学家恰恰认为，（WFK）给出了智慧的一个必要条件。批评者会说：智者固然要懂得如何过好生活（如 Nozick 所述），但也得有某种深刻而影响深远的理论或事实知识，哪怕这种知识对他的日常起居、实践决策或福祉帮助不大。笛卡尔在《哲学原理》序言里就坚持事实知识是智慧的重要成分：“真正只有上帝才拥有完善的智慧，也就是说，只有上帝才完全知道万物的真理；但可以说，人知道最重要的真理越多，智慧就越多，知道得越少，智慧就越少”（《哲学原理》, 204）。当然，人们可以说，这些重要真理中既有关于过好生活的真理，也有基础学科的知识。
