      让我们不加论证地假定：有可能建立一种关于单一、一般的智慧种类的理论。许多哲学家会论证说，一般的智慧要求关于生活的实践知识。许多人会主张，亚里士多德所谓理论智慧根本不是智慧。亚里士多德的理论智慧只是广博的知识或深刻的理解。Nicholas Maxwell（1984）在为其教育改革主张辩护时论证说，我们应当为智慧而教，而他严格地把智慧与标准的学术知识区分开来。Robert Sternberg（2001）与 Andrew Norman（1996）也提出了类似论点。Robert Nozick 所持的见解与亚里士多德实践智慧理论非常相似，但 Nozick 试图把握的是智慧本身的本质，而不是要定义智慧的某一种替代类型。Nozick 声称：“智慧是你为了过好生活、应付核心问题、避开人类所处困境中的危险而需要理解的东西”（1989, 267）。而 John Kekes 主张：“因此，有智慧的人所知道的，是如何构造一种在人类处境下很可能通向好生活的模式”（1983, 280）。晚近以来，Valerie Tiberius（2008）发展出一种实践观点，把智慧与福祉联系起来，并要求有智慧的人过一种他或她经过反思能够真诚认可的生活。这类关于智慧的实践观点，大体可以表达如下。
