      ## 1. Wisdom as Epistemic Humility
    step1: |-
      ## 1 智慧即认知谦逊
    step2: |-
      ## 1 智慧即认知谦逊
  - id: 3
    kind: body
    source: |-
      Socrates’ view of wisdom, as expressed by Plato in *The Apology* (20e-23c), is sometimes interpreted as an example of a humility theory of wisdom (see, for example, Ryan 1996 and Whitcomb, 2010)[^ryan-1996]. In Plato’s *Apology*, Socrates and his friend Chaerephon visit the oracle at Delphi. As the story goes, Chaerephon asks the oracle whether anyone is wiser than Socrates. The oracle’s answer is that Socrates is the wisest person. Socrates reports that he is puzzled by this answer since so many other people in the community are well known for their extensive knowledge and wisdom, and yet Socrates claims that he lacks knowledge and wisdom. Socrates does an investigation to get to the bottom of this puzzle. He interrogates a series of politicians, poets, and craftsmen. As one would expect, Socrates’ investigation reveals that those who claim to have knowledge either do not really know any of the things they claim to know, or else know far less than they proclaim to know. The most knowledgeable of the bunch, the craftsmen, know about their craft, but they claim to know things far beyond the scope of their expertise. Socrates, so we are told, neither suffers the vice of claiming to know things he does not know, nor the vice of claiming to have wisdom when he does not have wisdom. In this revelation, we have a potential resolution to the wisdom puzzle in *The Apology*.
    step1: |-
      苏格拉底关于智慧的见解，如柏拉图在《申辩篇》（20e–23c）中所表述的，有时被解释为智慧谦逊理论的一个例子（例如参见 Ryan 1996 与 Whitcomb, 2010）[^ryan-1996]。在柏拉图《申辩篇》中，苏格拉底与他的朋友凯瑞丰前往德尔菲的神谕。故事说，凯瑞丰问神谕，有没有人比苏格拉底更有智慧。神谕的回答是：苏格拉底是最有智慧的人。苏格拉底报告说，他对这一回答感到困惑，因为共同体中还有那么多人以其广博的知识与智慧著称，而苏格拉底却自称缺乏知识与智慧。苏格拉底作了一番调查，以求弄清这一谜团。他盘问了一系列政治家、诗人和工匠。正如人们所料，苏格拉底的调查表明，那些自称有知识的人，要么并不真正知道他们所自称知道的任何事情，要么所知远少于他们所宣称知道的。这批人中最有知识的工匠，懂自己的手艺，却自称知道远超其专长范围的事情。据说，苏格拉底既没有犯下自称知道他所不知道之事的毛病，也没有犯下并无智慧而自称有智慧的毛病。在这一揭示中，我们得到了《申辩篇》中智慧谜团的一种可能解答。
    step2: |-
      苏格拉底对智慧的见解，见柏拉图《申辩篇》（20e–23c），有时被当作智慧谦逊理论的一例（例如参 Ryan 1996、Whitcomb, 2010）[^ryan-1996]。篇中苏格拉底偕友人凯瑞丰去德尔菲求问神谕：凯瑞丰问，可有人比苏格拉底更有智慧？神谕答曰：苏格拉底最有智慧。苏格拉底说这回答令他困惑——城邦里以博学多识著称的人比比皆是，而他偏偏自称无知无慧。于是他着手调查，要解开这个谜。他逐一盘问政治家、诗人、工匠。不出所料，调查显示：那些自称有知识的人，要么其实并不知道他们所自称知道的任何事，要么所知远少于所宣称的。其中最有知识的工匠，固然懂自己的手艺，却自称知道远超本行的事。而苏格拉底呢，据说既没有自称知道他所不知道的毛病，也没有无智慧而自称有智慧的毛病。这一揭示，为《申辩篇》的智慧之谜提供了一个可能的解答。
