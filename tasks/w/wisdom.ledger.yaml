      Although the story may initially appear to deliver a clear theory of wisdom, it is actually quite difficult to capture a textually accurate and plausible theory here. One interpretation is that Socrates is wise because he, unlike the others, believes he is not wise, whereas the poets, politicians, and craftsmen arrogantly and falsely believe they are wise. This theory, which will be labeled Humility Theory 1 (H1), is simply (see, for example, Lehrer & Smith 1996, 3)[^lehrer-1996][^lehrer-1996-2]:
    step1: |-
      尽管这个故事初看似乎给出了一个明确的智慧理论，实际上要在此捕捉一个文本上准确且可信的理论却相当困难。一种解释是：苏格拉底有智慧，是因为他与别人不同，相信自己没有智慧，而诗人、政治家、工匠则傲慢而错误地相信自己有智慧。这一理论将被称为谦逊理论 1（H1），它简单说来就是（例如参见 Lehrer & Smith 1996, 3）[^lehrer-1996][^lehrer-1996-2]：
    step2: |-
      故事乍看像是在交付一个明确的智慧理论；可在文本上要抓出一个既准确又可信的理论，其实相当困难。一种读法是：苏格拉底之所以有智慧，是因为他与众人相反，自认无智慧；而诗人、政治家、工匠则狂妄地误以为自己有智慧。这一理论不妨称为谦逊理论 1（H1），其内容简单说就是（例如参 Lehrer & Smith 1996, 3）[^lehrer-1996][^lehrer-1996-2]：
  - id: 5
    kind: body
    source: |-
      > **Humility Theory 1 (H1)**: *S* is wise iff *S* believes s/he is not wise.
    step1: |-
      > **谦逊理论 1（H1）**：*S* 有智慧，当且仅当 *S* 相信自己没有智慧。
    step2: |-
      > **谦逊理论 1（H1）**：*S* 有智慧，当且仅当 *S* 相信自己无智慧。
  - id: 6
    kind: body
    source: |-
      This is a tempting and popular interpretation because Socrates certainly thinks he has shown that the epistemically arrogant poets, politicians, and craftsmen lack wisdom. Moreover, Socrates claims that he is not wise, and yet, if we trust the oracle, Socrates is actually wise.
    step1: |-
      这是一个诱人且流行的解释，因为苏格拉底确实认为自己已经表明，那些认知上傲慢的诗人、政治家和工匠缺乏智慧。而且，苏格拉底自称没有智慧，然而，如果我们相信神谕，苏格拉底实际上是有智慧的。
    step2: |-
      这一读法既诱人又流行：苏格拉底确实认为自己已证明，那些认知上傲慢的诗人、政治家、工匠缺乏智慧；而他自称无智慧，可按神谕，他偏偏是有智慧的。
  - id: 7
    kind: body
    source: |-
      Upon careful inspection, (H1) is not a reasonable interpretation of Socrates’ view. Although Socrates does not *boast* of his own wisdom, he does believe the oracle. If he was convinced that he was not wise, he would have rejected the oracle and gone about his business because he would not find any puzzle to unravel. Clearly, he believes, on some level, that he is wise. The mystery is: what *is* wisdom if he has it and the others lack it? Socrates nowhere suggests that he has become unwise after believing the oracle. Thus, (H1) is not an acceptable interpretation of Socrates’ view.
    step1: |-
      仔细考察之下，（H1）并不是对苏格拉底见解的合理解释。尽管苏格拉底并不*夸耀*自己的智慧，他确实相信神谕。如果他确信自己没有智慧，他就会拒绝神谕、回去做自己的事，因为他不会发现任何有待解开的谜。显然，他在某种程度上相信自己有智慧。谜在于：如果他有智慧而别人缺乏智慧，那么智慧*究竟*是什么？苏格拉底从未暗示，他在相信神谕之后反倒变得没有智慧了。因此，（H1）不是对苏格拉底见解可接受的解释。
    step2: |-
      细究起来，（H1）并不是对苏格拉底见解的合理解释。苏格拉底虽不*夸耀*自己的智慧，却是信神谕的。倘若他确信自己无智慧，他大可以否掉神谕、照旧过日子——反正也没什么谜可解。可见他在某种意义上相信自己有智慧。真正的谜是：既然他有而众人无，智慧*究竟*是什么？苏格拉底从未暗示自己信了神谕之后就变得无智慧。所以（H1）不能算可接受的解释。
  - id: 8
    kind: body
    source: |-
      Moreover, (H1) is false. Many people are clear counterexamples to (H1). Many people who believe they are not wise are correct in their self-assessment. Thus, the belief that one is not wise is not a sufficient condition for wisdom. Furthermore, it seems that the belief that one is not wise is not necessary for wisdom. It seems plausible to think that a wise person could be wise enough to realize that she is wise. Too much modesty might get in the way of making good decisions and sharing what one knows. If one thinks Socrates was a wise person, and if one accepts that Socrates did, in fact, accept that he was wise, then Socrates himself is a counterexample to (H1). The belief that one is wise could be a perfectly well justified belief for a wise person. Having the belief that one is wise does not, in itself, eliminate the possibility that the person is wise. Nor does it guarantee the vice of arrogance. We should hope that a wise person would have a healthy dose of epistemic self-confidence, appreciate that she is wise, and share her understanding of reality with the rest of us who could benefit from her wisdom. Thus, the belief that one is not wise is not required for wisdom.
    step1: |-
      此外，（H1）是假的。许多人是（H1）的明确反例。许多相信自己没有智慧的人，其自我评价是正确的。因此，相信自己没有智慧并不是智慧的充分条件。而且，相信自己没有智慧似乎也不是智慧的必要条件。看来可以合理地认为，一个有智慧的人可以智慧到足以意识到自己有智慧。过度的谦虚也许会妨碍作出好决定、妨碍分享自己所知。如果有人认为苏格拉底是个有智慧的人，并且接受苏格拉底实际上确实承认自己有智慧，那么苏格拉底本人就是（H1）的反例。相信自己有智慧，对一个有智慧的人来说可能是一个完全得到良好证成的信念。怀有自己有智慧的信念，本身并不排除此人有智慧的可能性，也不保证傲慢这一毛病。我们倒应希望，一个有智慧的人会有恰如其分的认知自信，赏识自己有智慧，并把其对实在的理解分享给我们其余这些能从中受益的人。因此，相信自己没有智慧并非智慧所必需。
    step2: |-
      再者，（H1）本身就是假的，反例比比皆是：不少自认无智慧的人，这个自我评价一点不错。可见“自认无智慧”既非智慧的充分条件，看来也非必要条件。有智慧的人完全可以智慧到自知有智慧。过分谦虚，反倒可能妨碍拿主意、妨碍把所知分享于人。若认为苏格拉底有智慧，又承认他确实承认自己有智慧，那么苏格拉底本人就是（H1）的反例。对智者而言，“我有智慧”完全可以是一个证成充分的信念；怀有这个信念，本身既不排除他有智慧，也不等于染上傲慢。我们倒该希望，智者有恰到好处的认知自信，懂得赏识自己的智慧，并把对实在的理解分享给旁人，让我们受益。所以说，自认无智慧并不是智慧的必要条件。
