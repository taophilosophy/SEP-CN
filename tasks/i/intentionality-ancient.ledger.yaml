      在其对话中，柏拉图处处强调各种心理状态的关系性：看、听、触以及一般意义上的知觉、记忆、信念、知识、概念、言说、爱（《泰阿泰德篇》152c、160a–b、163e、188d–189b；《理想国》V，476e、478b；《巴门尼德篇》132b–c；《智者篇》262e、263c；《会饮篇》199d）。在每一处，苏格拉底（或其他主要说话者）都追问所论心理状态是“关于某物还是关于无”，对话者都同意它总是 *关于某物*：这样的状态不可能根本不关于任何东西。在《卡尔米德篇》中，苏格拉底让克里提亚斯同意一个更强的说法：这些状态中许多（看、听及其他知觉形式、欲望、意图、爱、恐惧、信念）必须有一个 *不同于自身* 的对象；他还提出，知识若不合此理，反倒奇怪（167c–168a）。但在这方面，心理状态与别的相对者并无不同，苏格拉底本人也强调这一点：他有时补入非意向性的例子，如兄弟姐妹、父母子女、两倍与一半，以说明其观点。在上述某些段落中，苏格拉底还追问一个只对心理状态相关的问题：它们是否总是关于“存在者”，而非“不存在者”。尽管对话者欣然同意这些状态必定总是关于存在者，但意向性问题已隐约浮现，只因他提出了这样一种可能：某些状态有时可能关于不存在者，或关于非实情，或关于不存在物。在《斐莱布篇》中，这一替代被明确采纳：正如人可以相信某事，而该信念并不关于任何曾在、现在在或将来的东西；人也可以对某事发乐，或恐惧、发怒等等，即便它并不关于任何曾在、现在在或将来的东西。在所有这类情形里，信念、快乐、恐惧等都被说成“假的”（*pseudē*，《斐莱布篇》40c–e）。
