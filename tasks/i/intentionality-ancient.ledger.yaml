      究竟为什么人们会被巴门尼德论题所吸引？它背后可能有一个简单的直觉，即：思想在于与所思之物的一种*直接关系*（对其他心理状态及其所关涉者亦然）。因为既然一个关系除非其所有关系项都存在或成立便不能成立，那么就会推出：我们永远不能思考不存在或不成立的东西（“非存在”）。只要这种直接关系模型对我们有支配力，我们就将被逼向巴门尼德式或普罗塔哥拉式的结论。事实上，我们可以把这些假定合起来重述为一个不一致的三元组（用“思想”概略地代表更一般的心理状态，并容许“存在”与“成立”之间的含混）：
    step2: |-
      人何以竟为此题所动？其背或有一简之直觉：思者，与所思之物之*直接关系*也（他心状与其所关，准此）。盖关系非诸端皆存皆立则不成，则推之：凡不存在、不成立者（“非存在”），吾人永不得思之。此直接关系之模既执于吾，则必逼而至巴门尼德或普罗塔哥拉之论。实则吾侪可合此诸设而重述为一不一致之三元（以“思想”概代心状，且容“存在”与“成立”之歧）：
