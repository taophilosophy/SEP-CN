      Such generic objects will further be incomplete or indeterminate. It will not be true to say that the generic human (*genikos anthrōpos*) is Greek, for example, or equally to say that it is not Greek, even in an “as if” sort of way, since some, but not all, humans are Greek (Sextus Empiricus, *Adv. math.* VII 246). A generic object will be “as if” it were *F* if, and only if, *all* the individuals falling under it are *F*. This claim need not violate the Principle of the Excluded Middle, since it would still be true of the generic human that it is *either* Greek *or* not Greek, since it is true that all humans are either Greek or not Greek. But it would violate the Principle of Bivalence, since it still will be neither true nor false to say that the generic human is Greek. (For further discussion of *ennoēmata*, see Caston 1999.)[^caston-1999]
    step1: |-
      这类一般对象还会是不完整或不确定的。例如，说一般的人（*genikos anthrōpos*）是希腊人，并不为真；同样，说它不是希腊人，即便以“仿佛”的方式说，也不为真，因为有些人是希腊人，但并非所有人都是（塞克斯都·恩披里柯《驳数学家》VII 246）。一般对象“仿佛”是 *F*，当且仅当落在其下的 *全部* 个体都是 *F*。这一主张不必违反排中律，因为对一般的人而言，“它或是希腊人，或不是希腊人”仍然为真，因为“所有人或是希腊人，或不是希腊人”为真。但它会违反二值原则，因为说一般的人是希腊人，仍然既不真也不假。（关于 *ennoēmata* 的进一步讨论，见 Caston 1999。）[^caston-1999]
