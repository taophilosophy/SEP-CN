      ## 1 术语的历史
  - id: 4
    kind: body
    source: |-
      The received view, which takes the notion to originate in Arabic philosophy, traces back to an article by the phenomenologist Herbert Spiegelberg, originally published in 1933 (for a translation of a revised version, see Spiegelberg 1976)[^spiegelberg-1976]. It turns entirely on philosophical terminology: it only considers texts that use cognates of ‘intention’ in a specific technical sense, that of a mental act’s *being directed at* or *referring to* something, in contrast with a usage that applies exclusively to practical contexts, where an agent intends to do something. Spiegelberg claims that before the high scholastic period, uses of the Latin *intentio* were exclusively practical and so have no bearing on the problem of the intentionality of mental states more generally. The closest antecedents, he claims, are the Arabic *ma’na* and *ma’qul*, which were translated into Latin in the high scholastic period by *intentio*.
    step1: |-
      认为该概念源于阿拉伯哲学的传统看法，可以追溯到现象学家 Herbert Spiegelberg 的一篇文章，最初发表于 1933 年（修订版的译文见 Spiegelberg 1976）[^spiegelberg-1976]。此说完全依赖哲学术语：它只考察在特定技术意义上使用“intentio”同源词的文本——即一个心理行动“指向”或“指涉”某物的意义，与专用于实践语境的用法相对，后者指行动者打算做某事。Spiegelberg 主张，在经院盛期之前，拉丁语 intentio 的用法全然是实践的，因此与心理状态意向性这一更一般的问题无关。他认为最接近的前身是阿拉伯语的 ma’na 与 ma’qul，后者在经院盛期被译为 intentio。
    step2: |-
      以此概念源于阿拉伯哲学之旧说，其源可溯至现象家 Herbert Spiegelberg 一文，初刊 1933（修订本译文见 Spiegelberg 1976）[^spiegelberg-1976]。其说纯系于术语：惟取以特定技术义用“intentio”同源词之文本——即一心理之行“指向”或“指涉”某物之义，与专施于实践之用法相对，后者谓行者谋有所为。Spiegelberg 谓经院盛期以前，拉丁 intentio 之用全然是实践的，故与心状意向性之通题无涉。其最近之前身，则阿拉伯语 ma’na 与 ma’qul，于经院盛期译为 intentio 云。
  - id: 5
    kind: body
    source: |-
      Even when considered simply as a history of the terminology, this account is seriously mistaken. Late scholastic discussions often cite Augustine, in particular Book XI of his *On the Trinity*, in which *intentio* plays a central role. And while Augustine does identify *intentio* there with will (*uoluntas*) and even love (*amor*), he does not have practical concerns exclusively or even primarily in mind. On the contrary, his focus is on cognition, starting with vision and continuing on with memory, thought, and self-knowledge. It is just that he thinks that in order to account for the directedness of these states, their analysis must ultimately include a certain practical element, rather than the other way around, where all practical attitudes must be explained in terms of cognition. Augustine argues that vision and perception generally cannot be analyzed simply into subject and object (as on Aristotle’s account). That would leave out something essential, which is needed to direct the sense to the perceptible object and keep it fixed on it. Augustine identifies this third element as the perceiver’s *intentio*, which he characterizes as a kind of striving or will. It is precisely because a trio of factors are required, in fact, that he believes psychology can be useful to Trinitarian theology. Since humans are made in God’s image, each human (or more precisely, each “inner man”) must also replicate God’s triune structure. The role *intentio* plays in cognition is parallel to that of the Holy Spirit, mediating between the Father and the Son: it mediates between the object and the cognitive faculty. Later scholastics were thus right to cite Augustine’s use of *intentio* in discussions of cognition, establishing a direct link to late antiquity, independent of the contributions of Arabic philosophy, in the history of what Spiegelberg called “extra-practical” intentionality.
    step1: |-
      即使仅把它当作术语史来看，这一说明也大错特错。晚期经院讨论常引用奥古斯丁，尤其是其《论三位一体》第十一卷，intentio 在其中居于中心地位。奥古斯丁虽然在该书中把 intentio 与意志（uoluntas）甚至爱（amor）等同，但他心里所想的并不是排他的、甚至主要的实践关切。恰恰相反，他关注的是认知：从视觉开始，继之以记忆、思想与自我认识。只是他认为，要说明这些状态的指向性，其分析最终必须包含某种实践要素——而不是相反，把一切实践态度都以认知来解释。奥古斯丁论证说，视觉与知觉一般而言不能像亚里士多德的说明那样被单纯分析为主体与对象。那样会遗漏某种本质的东西——把感觉引向可感对象并使之固定于其上的东西。奥古斯丁把这第三个要素认定为知觉者的 intentio，并把它刻画为一种奋力或意志。正因为需要三个因素，他才相信心理学可以有助于三位一体的神学。既然人是按上帝的形象造的，每个人（或更确切地说，每个“内在的人”）也必须复制上帝的三位一体结构。intentio 在认知中所起的作用，与圣灵居间于圣父与圣子之间的作用平行：它在对象与认知官能之间居间调停。后来的经院学者在认知讨论中引用奥古斯丁对 intentio 的使用，因而是对的：这就在 Spiegelberg 所谓“超实践的”意向性的历史上，建立了与古代晚期的直接联系，独立于阿拉伯哲学的贡献。
    step2: |-
      即以术语史论，此说亦大谬。晚世经院论学，恒引奥古斯丁，尤《论三位一体》卷十一，intentio 于焉居中。奥氏虽于此以 intentio 当意志（uoluntas），乃至爱（amor），然其所注，非专乎实践，亦非以实践为先；所注者认知也：自发端于视，继以记忆、思想与自知。特以谓欲明诸状之指向，其析终须涵一实践之要素——非倒而以认知尽释诸实践态度也。奥氏谓视觉与知觉，通而论之，不得如亚里士多德之解，径析为主客。如是则遗其要者——引感觉以赴所对、且使之定于所对者也。奥氏以此第三要素为知觉者之 intentio，而状之为一种奋力、或意志。惟其须三，故彼信心理学有裨于三位一体之神学。人既依上帝之像而造，则每人——或切言之，每一“内人”——亦必重演上帝三位一体之构。intentio 于认知之所居，正平行于圣灵之居于圣父子之间：其于对象与认知之官能间居间也。后之经院家引奥氏 intentio 之用于认知之论，固为得之：此于 Spiegelberg 所谓“超实践”意向性之史，立与古代晚叶之直接连结，而无所赖于阿拉伯哲学之贡献。
  - id: 6
    kind: body
    source: |-
      Augustine, moreover, is adapting and developing earlier Greek views. In Book XII of his *Literal Commentary on Genesis*, he offers an extensive analysis of vision that relies heavily on Stoic theory. In both theories, vision depends on the active role of the perceiver’s *pneuma* (Greek) or *spiritus* (Latin), “breath” in its original meaning and for the Stoics a kind of hot gaseous body, but for Augustine something immaterial. (The same words, not insignificantly, are used in the Christian scriptures for the Holy Spirit). Vision occurs when the *pneuma* extends through the optic nerve and the eye to the object, either by reaching out through the pupil to make contact with the object directly (as on Augustine’s theory) or by pricking and tensing the intervening air beginning at the pupil into a cone with its base at the object (as on the Stoic theory). The words that the Stoic Chrysippus uses for the extension of the visual cone to the object are the Greek verb *enteinein* and noun *entasis* (Diogenes Laertius VII 157), which are cognate with the Latin *intendere* and *intentio*. So if our goal was to find not just a continuous transmission of technical terminology for intentionality, but cognates of *intentio*, we could trace it back at least to Greek theories of vision in the third century bce, if not still earlier extromission theories of vision. (For further discussion of Augustine’s theory, as well as the history of the terminology, see Caston 2001.)[^caston-2001]
    step1: |-
      再者，奥古斯丁是在改铸并发展更早的希腊观点。在《创世记字义注》第十二卷，他给出一个广泛依赖斯多亚理论的视觉分析。在两种理论中，视觉都依赖于知觉者的 pneuma（希腊语）或 spiritus（拉丁语）的能动作用——“气息”是其本义；对斯多亚派而言它是一种热的气状物体，对奥古斯丁而言则是非物质的（同样的词，并非无关紧要地，在基督教圣经中被用来指圣灵）。当 pneuma 经视神经与眼延伸至对象时，视觉发生：或是穿过瞳孔伸出而与对象直接接触（如奥古斯丁的理论），或是从瞳孔起刺紧中间的空气、使之成为锥体而其底在对象处（如斯多亚派的理论）。斯多亚派克吕西波用来表示视觉锥体向对象延伸的词，是希腊语动词 enteinein 与名词 entasis（第欧根尼·拉尔修 VII 157），它们与拉丁语 intendere 和 intentio 同源。因此，如果我们的目标不只是寻找意向性技术术语的连续传递，而是寻找 intentio 的同源词，那么我们至少可以追溯到公元前三世纪的希腊视觉理论，甚或更早的外发射视觉理论（关于奥古斯丁理论的进一步讨论，以及术语的历史，见 Caston 2001）[^caston-2001]。
    step2: |-
      且奥氏固承希腊旧说而改铸发展之也。其《创世记字义注》卷十二为视觉之广析，大抵资于斯多亚。二说之中，视觉皆系于知觉者 pneuma（希腊）或 spiritus（拉丁）之能动——“气”者其本义；于斯多亚为热气之体，于奥氏则为非物质（同一之词，基督教圣经亦以称圣灵，非无关也）。pneuma 经视神经与目而延于所对，视觉乃成：或自瞳孔直出而亲接其所对（如奥氏之说），或自瞳孔刺紧其间之气，束为锥而其底在所对（如斯多亚之说）。斯多亚克吕西波言视锥之延于所对也，用希腊动词 enteinein 与名词 entasis（第欧根尼·拉尔修 VII 157），与拉丁 intendere、intentio 同源。故使吾之所求，不徒在意向性术语之传递不断，而在 intentio 之同源词，则至少可溯至公元前三世纪之希腊视觉论，甚或更早之外射视觉说（奥氏理论之详论，与术语之史，见 Caston 2001）[^caston-2001]。
  - id: 7
    kind: body
    source: |-
      Other expressions and figures of speech familiar to us from modern discussions of intentionality can be found in ancient philosophy, even though we cannot trace a continuous connection from them to our own usage. Throughout antiquity, for example, we find the antithesis of ‘presence in absence’ (*parōn apōn*) to describe the way a mental state can make something “present” to the subject that is nevertheless absent from the current surroundings and perhaps even from reality altogether. Aristotle mentions such presence in absence explicitly as an *aporia* or difficulty that must be resolved (*On Memory and Recollection* 1, 450a25 ff.). Certain Stoics speak of immanent objects of thought, items that are literally present “in thought” (*ennoēmata*). Later thinkers use the phrase ‘existing in mere thoughts alone’ (*en psilais epinoiais monais*) to characterize merely intentional objects, which do not exist in reality. Even the metaphor of directedness – of aiming the mind at something (*intendere animum in*), like an arrow – can be found in ancient texts. In Plato’s *Cratylus* (420b–c), Socrates suggests that the word for belief, *doxa*, derives etymologically from the word for bow, *toxon*: it “goes toward” each thing and how it is in reality. Socrates then extends this analysis to the vocabulary for deliberative states: the word for plan, *boulē*, for example, derives from the word for shot, *bolē*. The metaphor is repeated again in the *Theaetetus* (194a): someone who believes falsely is “like a bad archer who, in shooting, goes wide of the mark and errs”.
    step1: |-
      其他一些我们熟悉于现代意向性讨论中的表达式与比喻，在古代哲学中也能找到，尽管我们无法从它们追溯到与我们自己用法的连续联系。例如在整个古代，我们都能看到“缺席中的在场”（parōn apōn）这一对立，用以描述心理状态使某物向主体“呈现”的方式——尽管该物缺席于当下环境，甚至完全缺席于实在。亚里士多德明确把这种缺席中的在场当作必须解决的困难（aporia）提及（《论记忆与回想》1, 450a25 以下）。某些斯多亚派谈到思想中的内在对象，即字面上“在思想中”在场的东西（ennoēmata）。后来的思想家则用“仅仅存在于纯思想中”（en psilais epinoiais monais）这一短语来刻画单纯意向性的对象，即不存在于实在中的对象。甚至“指向”这一隐喻——把心灵瞄准某物（intendere animum in），像一支箭——也能在古代文本中找到。在柏拉图的《克拉底鲁篇》（420b–c）中，苏格拉底提示：信念一词 doxa 在词源上出自弓一词 toxon：它“走向”每个事物及其在实在中的情况。苏格拉底又把这一分析扩展到审议状态的词汇：例如“计划”一词 boulē 出自“射”一词 bolē。这一隐喻在《泰阿泰德篇》（194a）中再次出现：错误地相信的人“像一个蹩脚的射手，射击时偏离目标而失误”。
    step2: |-
      他若现于今意向性之论之名言与譬，古学中亦往往遇之，虽不能由彼溯至吾人今日用法之连续也。如通古皆有“缺席中之在场”（parōn apōn）之对，以状心状使某物“现”于主体之式——其物缺席于当下之境，甚且全缺于实在。亚里士多德明举此缺席中之在场，以为必解之难（aporia）（《论记忆与回想》1, 450a25 以下）。某斯多亚言所思之内在对象，即字面“在思想中”在场者（ennoēmata）。后哲乃以“徒存于纯思想”之语（en psilais epinoiais monais）状纯意向之对象——不存于实在者也。至“指向”之譬——引心而注于某物（intendere animum in），如矢之的——古书亦有之。柏拉图《克拉底鲁篇》（420b–c），苏格拉底谓信念一词 doxa，语源出于弓 toxon：其“趋”于每物及其在实在中之然。又以此析施于审议之词：“谋”boulē 出于“射”bolē 是已。此譬复见于《泰阿泰德篇》（194a）：妄信者“如拙于射者，发而失的”。
