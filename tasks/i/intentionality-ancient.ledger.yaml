      Aristotle also considers higher-order perception and thought. He offers a regress argument at the beginning of *On the Soul* III 2 to show that when we perceive that we see or hear, we have a higher-order perceptual awareness of the first-order perceiving (425b12–25) and, while the precise details are a matter of controversy, it is arguably the same act of perception being directed at itself (Caston 2002*b*; for a response, see Johansen 2005)[^caston-2002][^caston-2002-2][^johansen-2005]. But Aristotle elsewhere claims that in general states like knowledge, perception, belief, or thought are always directed at *something else* primarily and themselves only peripherally or “on the side” (*en parergōi*); only God’s self-reflexive thinking, which he characterizes as a “thinking of thinking” (*noēsis noēseōs*), has itself as its primary object (*Metaph.* XII 9, 1074b34–36). Self-directed intentionality raises a number of questions, in particular whether Aristotle is committed to it being a part of *every* mental act – as he seems to claim at *Nicomachean Ethics* IX 9, 1170a29–b1, which Brentano 1874 [1995], Book II, chs 2–4 takes up and champions – and whether he thinks it is possible to be in error about the content or character of the first-order state, even if not about its existence (Caston 2002*b*)[^caston-2002][^caston-2002-2].
    step1: |-
      亚里士多德还考虑高阶知觉与思想。他在《论灵魂》III 2 开头提出一个倒退论证，以表明当我们知觉到自己在看或听时，我们对一阶知觉有一种高阶知觉意识（425b12–25）；尽管具体细节尚有争议，但可以说这是同一知觉活动指向自身（Caston 2002*b*；回应见 Johansen 2005）[^caston-2002][^caston-2002-2][^johansen-2005]。但亚里士多德在别处主张，一般而言，知识、知觉、信念或思想这类状态总是首要地指向 *某个别的东西*，只在边缘处或“顺带地”（*en parergōi*）指向自身；唯有上帝的自我反思思想，他刻画为“思想之思想”（*noēsis noēseōs*），才以自身为首要对象（《形而上学》XII 9，1074b34–36）。自我指向的意向性引出一系列问题，尤其是：亚里士多德是否主张它属于 *每一个* 心理活动，正如他在《尼各马可伦理学》IX 9，1170a29–b1 似乎主张的那样，而布伦塔诺 1874 [1995] 第二卷第二至四章正是接过并大力主张这一点；以及他是否认为人可能在关于一阶状态之内容或性质上出错，尽管不会在其存在上出错（Caston 2002*b*）[^caston-2002][^caston-2002-2]。
