      Augustine, moreover, is adapting and developing earlier Greek views. In Book XII of his *Literal Commentary on Genesis*, he offers an extensive analysis of vision that relies heavily on Stoic theory. In both theories, vision depends on the active role of the perceiver’s *pneuma* (Greek) or *spiritus* (Latin), “breath” in its original meaning and for the Stoics a kind of hot gaseous body, but for Augustine something immaterial. (The same words, not insignificantly, are used in the Christian scriptures for the Holy Spirit). Vision occurs when the *pneuma* extends through the optic nerve and the eye to the object, either by reaching out through the pupil to make contact with the object directly (as on Augustine’s theory) or by pricking and tensing the intervening air beginning at the pupil into a cone with its base at the object (as on the Stoic theory). The words that the Stoic Chrysippus uses for the extension of the visual cone to the object are the Greek verb *enteinein* and noun *entasis* (Diogenes Laertius VII 157), which are cognate with the Latin *intendere* and *intentio*. So if our goal was to find not just a continuous transmission of technical terminology for intentionality, but cognates of *intentio*, we could trace it back at least to Greek theories of vision in the third century bce, if not still earlier extromission theories of vision. (For further discussion of Augustine’s theory, as well as the history of the terminology, see Caston 2001.)[^caston-2001]
    step1: |-
      此外，奥古斯丁是在改造并发展更早的希腊观点。在其《创世记字解》第十二卷中，他提供了一套详尽的视觉分析，大量依赖斯多亚派理论。在两种理论中，视觉都依赖知觉者的 *pneuma*（希腊语）或 *spiritus*（拉丁语）的主动作用；“精气”原义为气息，对斯多亚派而言是一种热的气态物体，对奥古斯丁而言则是某种非物质的东西。（同样两个词也用于基督教圣经中的圣灵，这并非无关紧要。）视觉发生于 *pneuma* 经由视神经与眼睛延伸至对象之时：或者如奥古斯丁的理论那样，从瞳孔伸出直达对象；或者如斯多亚派的理论那样，从瞳孔开始刺戳并绷紧居间的空气，使之形成一个以对象为底的锥体。斯多亚派的克吕西波用来表示视觉锥体伸向对象的词，是希腊语动词 *enteinein* 与名词 *entasis*（第欧根尼·拉尔修 VII 157），它们与拉丁语 *intendere*、*intentio* 同源。因此，若我们的目标不只是找出意向性技术术语的连续传承，还要找出 *intentio* 的同源词，那么至少可以追溯到公元前 3 世纪的希腊视觉理论，甚至可能更早的外射视觉理论。（关于奥古斯丁理论的进一步讨论，以及术语史的讨论，见 Caston 2001。）[^caston-2001]
