      More importantly, there are several passages where Socrates discusses falsehood in belief and speech at length, as a familiar and important problem in need of resolution. In the *Cratylus*, Socrates says that a great many people, both in the past and in the present, have held that it is impossible to speak falsely, on the grounds that it is impossible to say something without saying something *that is*; Cratylus concludes that in such cases, instead of speaking falsely and saying something that is not, the speaker would simply be making noise, no more meaningful than banging a pot (429d–430a). A similar puzzle about false speech is posed in the *Euthydemus*, initially by the brothers Euthydemus and Dionysodorus, a visiting tag team of Sophists who are displaying their eristic prowess (283e–284e). It is later reprised by Socrates, who attributes it explicitly to “Protagoras’ followers” and still earlier thinkers, and it is explicitly extended to false belief as well (286c–d). These versions of the puzzle frame it in terms of whether one can speak (or think) of “what is not”: one cannot speak without there being something that one is saying (or thinking); yet it is impossible for there to be such a thing and for it not to be. But that is what speaking falsely would amount to, since on this view speaking falsely just is to say something that is not. Plato never explicitly questions the relational character of speaking and believing or rejects the requirement that the relata must exist or obtain. In the inconsistent triad we considered above, it is the third proposition, “Sometimes we can think about what does not exist/obtain,” which is consistently under pressure in these contexts. At the same time, Socrates objects that such a position would be self-undermining (*Euthyd.* 287e–288a), though he does not offer a further diagnosis here.
    step1: |-
      更重要的是，有几段文字中苏格拉底详细讨论信念与言语中的虚假，把它当作一个熟悉而亟待解决的重要问题。在《克拉底鲁篇》中，苏格拉底说，过去与现在的许多人都主张不可能说假话，理由是不说出*存在者*就什么也说不出；克拉底鲁由此得出结论：在这类情形中，说话者不会说假话、说非存在者，而只是发出声响，其意义不外乎敲打一口锅（429d–430a）。《欧绪德谟篇》提出了一个关于假话的类似难题，最初由欧绪德谟与狄奥尼索多洛兄弟提出——这是一对来访的智者搭档，正在展示其论辩本领（283e–284e）。后来由苏格拉底重述，他明确把它归于“普罗塔哥拉的追随者”与更早的思想家，并且明确扩展到假信念（286c–d）。这些版本的难题以如下方式表述：人能否言说（或思考）“非存在者”：没有一个人所说（或所思）的东西，就无法言说；然而这个东西既存在又不存在是不可能的。但说假话恰恰就是这种情况，因为按这种看法，说假话就是说出非存在者。柏拉图从未明确质疑言说与信念的关系性特征，也从未拒绝关系项必须存在或成立的要求。在上面考虑的不一致三元组中，第三命题——“有时我们能思考不存在/不成立者”——在这些语境中始终处于压力之下。与此同时，苏格拉底反驳说，这样的立场会自我瓦解（《欧绪德谟篇》287e–288a），尽管他在这里没有给出进一步的诊断。
    step2: |-
      尤要者，有数节苏格拉底详论信念与言语之妄，以为熟而待解之要题。《克拉底鲁篇》，苏格拉底谓古今多人主不可妄言，以谓不出*存在者*则无言之可也；克拉底鲁遂谓如是则言者非妄言、非言非存在者，特作声耳，与叩釜无异（429d–430a）。《欧绪德谟篇》复设言妄之类似难，首发于欧绪德谟与狄奥尼索多洛兄弟——来访之智者对，方炫其论辩之能（283e–284e）。后苏格拉底重申之，明归诸“普罗塔哥拉之徒”与更早诸家，且明扩于假信念（286c–d）。此诸版本，以“能否言（思）非存在者”为式：无所言（所思）者，则不能言；然一物既存在又不存在，不可也。然妄言适是：以妄言即言非存在者故。柏拉图固未尝疑言与信之关系性，亦未拒“关系项必存在或成立”之求。前所举不一致三元，其第三命题——“有时吾人能思不存在、不成立者”——于此诸境恒受压。同时苏格拉底驳曰：是说将自毁（《欧绪德谟篇》287e–288a），虽未更诊之。
