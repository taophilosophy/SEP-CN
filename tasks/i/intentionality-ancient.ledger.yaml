      更重要的是，有好几处段落里，苏格拉底长篇讨论信念与言说中的虚假，把它当作一个熟悉而重要、有待解决的问题。在《克拉底鲁篇》中，苏格拉底说，过去和现在都有很多人主张不可能虚假地言说，理由是：人不可能说出什么而不说出某个 *存在者*；克拉底鲁由此断定，在这类情形里，说话者并非虚假地言说、说出不存在者，而只是发出声音，其意义并不比敲锅更强（429d–430a）。《欧绪德谟篇》提出了一个关于虚假言说的类似谜题，最初由欧绪德谟与狄奥尼索多洛两兄弟提出，他们是一对来访的智者，正在展示其论辩本领（283e–284e）。苏格拉底后来重提此谜，并明确把它归给“普罗塔戈拉的信徒”以及更早的思想家，还明确把它推广到虚假信念（286c–d）。这些版本的谜题都这样框定问题：人能否言说（或思想）“不存在者”？人不能言说而无任何东西可说（或可想）；但要有这样的东西而又不存在，却是不可能的。而虚假言说恰恰会是这么回事，因为按这种观点，虚假言说就是说出不存在者。柏拉图从未明确质疑言说与信念的关系性，也从未拒斥关系项必须存在或成立这一要求。在我们上面考察的不一致三元组中，一贯受压的其实是第三个命题：“有时我们能够思想不存在/不成立的东西”。与此同时，苏格拉底反对说，这样的立场会自我瓦解（《欧绪德谟篇》287e–288a），不过他在这里没有给出进一步诊断。
