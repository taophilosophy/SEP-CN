      《泰阿泰德篇》在论证的关键节点重新出现假信念难题。苏格拉底与泰阿泰德已经拒斥了“知识即知觉”的提议，随之也拒斥了其底下的普罗塔哥拉式观点：凡显得如此者即如此。泰阿泰德的新提议——知识即真信念——并无进展，除非他们能够表明假信念是可能的，以对抗我们刚从《欧绪德谟篇》看到的智者式难题；而苏格拉底虽然说他“常常”为此忧虑，却自称无法说出假信念是什么、它如何发生（187b–e）。随后他以比先前精微得多的方式展开这一忧虑。有一个比我们迄今所见更充分的难题版本，它明确把相信“非存在者”等同于什么也不信（188d–189b）。但苏格拉底还引入一个独特的、新的心理忧虑。如果假定假信念就其本性而言具有某种结构——把一物误作另一物——那么我们必须追问：我们对每一项的认知通达是什么？我们认识其中的每一个，还是只认识其一，还是都不认识？（188a–c）苏格拉底继续把假信念分析为一种“他信”（allodoxia）——在思想中说某物是甲而不是乙——此时他把这一底层结构挑明（189c–190e）。这一分析避开了早先的困难，因为两个项都可以是存在者，它把错误定位于我们抓住了错误的那个项。从第三人称视角看，这富有启发，因为它精确揭示信念为何是错的。但正因同样的理由，这一描述对于被蒙骗的主体、从第一人称视角来看，是不可接受的：苏格拉底坚持说，没有人会*对自己*说苏格拉底就是泰阿泰德，或说一物是与其有别之物（190a–c）。事实上，柏拉图反复把思考刻画为对自己说话，既在此对话中（189e–190a），也在后来的《智者篇》中（263e–264a）；一个类似的观点似乎也隐含在《斐勒布篇》38e–39a 的意象中：内在的书写者把我们的信念写在我们灵魂中。《泰阿泰德篇》对他信的这一处理，因此似乎预设：两个项都必须以某种方式呈现在思想面前，替换才会发生（190d）。人或许只通过知觉或其他方式在心中拥有其中一个，然后把它不知怎么应用于世上的错误之物——这一可能性未被考虑（尽管柏拉图在《克拉底鲁篇》430a–431b 论不正确的名称时容许这一点，在那里他说到指称或以其他方式展示该物，同时把一个名称加之于它）。
    step2: |-
      《泰阿泰德篇》于论证之枢，复起假信之难。苏格拉底与泰阿泰德既拒“知识即知觉”之议，并拒其底普罗塔哥拉之说：凡显然者即然。泰阿泰德新议：知识即真信；然非能明假信可能，以御如《欧绪德谟篇》之智者难题，则无进矣。苏格拉底虽自言“屡”忧之，而自陈不能言假信为何、由何而成（187b–e）。既而其申此忧，精微远胜于昔。有较前更全之难：明以信“非存在者”等乎无所信（188d–189b）。而苏格拉底更设一新且殊之心理之忧。使假信本性自有其构——误一物为他物——则当问：吾侪于二者之认知通达何若？识其全乎？识其一乎？抑皆不识？（188a–c）苏格拉底继而析假信为“他信”（allodoxia）——于心中谓某物为甲而非乙——而其底构乃显（189c–190e）。此析免前难，以二项皆得为存在者，而误在其执其非者也。自第三人观之，此有启焉，以其明示信之所以误。然正以此故，自受欺者第一人称观之，其说不堪：苏格拉底坚谓无人肯*自语*曰苏格拉底即泰阿泰德，或曰一物为其所异之物（190a–c）。实则柏拉图屡以思为自语，此篇（189e–190a）与后《智者篇》（263e–264a）皆然；《斐勒布篇》38e–39a 内史书吾信于魂中之喻，殆亦隐同此旨。《泰阿泰德篇》之待他信也，似预设二项必皆以某式呈于思想，替换乃起（190d）。人惟得其一于心中——由知觉或他途——而误施之于世上他物，此可能未尝见虑（虽柏拉图于《克拉底鲁篇》430a–431b 论谬名时许之，彼言指而示其物，且以名加之）。
