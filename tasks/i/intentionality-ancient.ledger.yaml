      Gorgias challenges this thesis in his treatise *On Not Being* (preserved in two slightly different versions in the pseudo-Aristotelian *On Melissus, Xenophanes, and Gorgias* and in Sextus Empiricus’ *Adversus Mathematicos* VII 65 ff.). It takes direct aim at Eleatic assumptions, and especially those of Parmenides, by arguing that (i) there isn’t anything; (ii) even if there is something, it cannot be known; and finally, (iii) even if something can be known, one could not inform anyone of this. The second part is of particular interest, since Gorgias offers a *reductio ad absurdum* of the Parmenidean thesis, especially when deployed in the positive way we have just seen in Protagoras. Given that we obviously can have in mind, for example, a chariot-team racing on the sea – in fact, just by reading this, you have put it in mind – it should follow from the Parmenidean thesis that there *is* a chariot-team racing on the sea; but (*pace* Protagoras) plainly there is not. If both these intuitions are maintained, the only option left is to reject the Parmenidean thesis itself: it is *not* the case that one can only think or speak of what is – thought is not so tightly bound to reality. Gorgias immediately goes on to argue for a sceptical conclusion, on the grounds that we have no basis for telling which mental states correspond to reality and which do not, and so cannot know anything at all. But this further argument rests on having shown that our ordinary intuitions about what we can think and what exists or obtains together undermine the Parmenidean thesis. (For further discussion, see Caston 2002*a*)[^caston-2002][^caston-2002-2]
    step1: |-
      高尔吉亚在其《论非存在》（以两个略有不同的版本保存在伪亚里士多德《论梅里索斯、克塞诺芬尼与高尔吉亚》与塞克斯都·恩披里柯《驳数学家》VII 65 以下）中挑战这一论题。它直接针对埃利亚派的假定，尤其是巴门尼德的假定，论证：（i）没有任何东西存在；（ii）即使有东西存在，它也不能被认识；（iii）最后，即使有东西能被认识，人们也无法把这一点告知任何人。第二部分尤其值得注意，因为高尔吉亚对巴门尼德论题给出了一个*归谬*——尤其当该论题按我们刚才在普罗塔哥拉那里看到的正面方式被运用时。既然我们显然能在心中拥有，例如，一支在海上竞驰的战车队——事实上，仅仅读这句话，你就已经把它置于心中——那么按巴门尼德论题就该推出：*确实有*一支在海上竞驰的战车队；但（与普罗塔哥拉相反）显然没有。如果两个直觉都被保持，剩下的唯一选择就是拒斥巴门尼德论题本身：并非人只能思考或言说存在者——思想并不与实在绑得那么紧。高尔吉亚紧接着论证一个怀疑论结论，理由是我们没有根据分辨哪些心理状态与实在相符、哪些不符，因而根本不能认识任何东西。但这进一步的论证，是以“我们关于能思考什么与存在或成立什么的日常直觉合起来已摧毁巴门尼德论题”为前提的（进一步讨论见 Caston 2002*a*）[^caston-2002][^caston-2002-2]。
    step2: |-
      高尔吉亚于其《论非存在》（存于伪亚里士多德《论梅里索斯、克塞诺芬尼与高尔吉亚》与塞克斯都·恩披里柯《驳数学家》VII 65 以下，二本微异）攻此论题。其锋直指埃利亚之设，尤巴门尼德之设，而谓：（一）无有一物；（二）即有物，亦不可知；（三）终之，即有可知，亦不能以告人。其第二部分尤可味，盖高尔吉亚于巴门尼德之题出一*归谬*——尤当此题为如普罗塔哥拉之正面运用时。吾人既显然能于心中有一海上竞驰之战车之队——实言之，读此一语，汝已置之心中——则由巴门尼德之题当推：*实有*一海上竞驰之战车之队；然（与普罗塔哥拉相反）固无之。二直觉既皆守，则所余惟拒巴门尼德之题本身：非谓人惟能思言存在者——思之系于实，不若是之密也。高尔吉亚即继以怀疑之论，谓吾人无据以辨何心状合于实、何者不合，故竟不能知任何物。然此进一步之论，实以“吾人于所能思与所有之常直觉，合而倾巴门尼德之题”为据（详论见 Caston 2002*a*）[^caston-2002][^caston-2002-2]。
