      The problem of intentionality is the problem of explaining what it is in general for mental states to have content, as well as the particular conditions responsible for specific variations in content. The difficulty of providing such an account lies in explaining why mental states often seem to violate familiar entailment patterns (whether or not we take such violations to be criterial of intentionality). To begin with, the content of many mental states does not correspond with what is in the world: what we imagine may not exist, our beliefs may be false, our desires may go unfulfilled. To put it more paradoxically, a mental state may be about something, even if there isn’t any such thing in the world. This is one of a number of peculiarities that prove difficult to account for, and which are sometimes thought to pose a particular stumbling block for naturalistic approaches to the mind. As Wittgenstein once quipped, you can’t hang a man unless he is there, but you can look for him even if he’s not, or even if he does not exist at all (*Philosophical Investigations* 1.133, §462). There are other peculiarities as well, concerning our ability to focus selectively on certain aspects of objects, without having others in mind. For example, while I cannot greet a person without greeting a person of some particular height, I can think of a person without thinking of a person of any particular height. I can also entertain different attitudes to the same object at the same time, depending on the aspect under which I consider it. So I might believe that the Morning Star is a star but that Venus is not one, despite the fact that Venus *is* the Morning Star; yet for just the same reason, we cannot land a space probe on the one without thereby landing it on the other. These and other difficulties form a loose family of phenomena that give rise to the problem of intentionality. Different philosophers may regard these phenomena differently, perhaps focusing on some but not others, or even excluding some as not belonging together with the rest. A philosophical history should be generous about such differences: what is important philosophically is that a philosopher recognizes that some of them pose a difficulty, at least *prima facie*, in accounting for mental states. (For further discussion of the methodology, see Caston 2001)[^caston-2001]
    step1: |-
      意向性问题，就是说明心理状态何以一般地具有内容，以及哪些具体条件造成了内容上的具体差异。提供这种说明的困难在于：心理状态常常似乎违反人们熟悉的蕴含模式（无论我们是否把这类违反视为意向性的判准）。首先，许多心理状态的内容并不与世界中的实情相对应：我们想象的东西可能不存在，我们的信念可能为假，我们的欲望可能得不到满足。说得更悖论一些，一个心理状态可以关于某物，即使世界中根本没有这样的东西。这是诸多难以说明的独特之处之一，有时被认为对自然主义的心灵进路构成了特别的障碍。正如维特根斯坦曾打趣说，人不在场，你无法把他绞死；但即便他不在，甚至根本不存在，你仍可以寻找他（《哲学研究》1.133，§462）。还有其他独特之处，涉及我们选择性地聚焦于对象某些方面的能力，而不同时想到其他方面。例如，我问候一个人时，不可能不问候某个特定身高的人；但我想到一个人时，却不必想到任何特定身高的人。我还可以同时对同一对象持不同态度，取决于我把它放在哪个方面来考虑。因此，我可能相信晨星是一颗星，却相信金星不是星，尽管金星 *就是* 晨星；然而正因如此，我们不能把探测器降落在其中一个上，却不因此也降落在另一个上。这些困难及其他困难构成一个松散的现象家族，意向性问题正由此产生。不同哲学家可能对这些现象看法不同，或许只关注其中一些而不关注另一些，甚至把某些现象排除在外，认为它们不属于同一类。哲学史对此应当宽容：哲学上要紧的是，一位哲学家认识到其中某些现象至少在 *初看之下* 会给心理状态的说明带来困难。（关于方法论的进一步讨论，见 Caston 2001。）[^caston-2001]
