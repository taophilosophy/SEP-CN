      If *lekta* serve here, as elsewhere, as the content of these states, then *lekta* will not correspond *solely* to rational representations. But how, one might reasonably ask, can the represenations in nonrational animals and very young humans, who are without concepts and incapable of articulate speech, have *lekta* corresponding to them? There is a widespread assumption in the secondary literature that whether a *lekton* corresponds to a representation depends upon which concepts (if any) an individual possesses. But the Stoics cannot accept this assumption. Quite the contrary. They believe that a *lekton* is involved in *every* causal interaction, whether animate or inanimate: one body causes a *lekton* to become true or hold of another body, where the *lekton* specifies the fully determinate effect of the agent on the patient (Stobaeus 1.138.14; Sextus Empiricus *Adv. math.* 9.211; Clement of Alexandria *Stromata* 8.9.3–4; this point is rightly emphasized by Frede 1994)[^frede-1994]. But this analysis of causation immediately becomes pertinent once we acknowledge that the Stoics also hold a causal theory of representation: they define representations as the effect – literally, an “impression” (*tupōsis*) – that in the paradigmatic case the object of representation produces on the soul (which on their view is a body); and they expressly compare this to the impression a signet ring makes in wax (Diogenes Laertius VII 50; Aetius 4.12.1–4; Plutarch *On Common Conceptions* 1084f–1085a), and they appeal to sigillary language again when they define the “secure” representation they regard as the criterion of truth and foundation of knowledge (*phantasia katalēptikē*), which represents the object that produces it in such rich detail that it could be distinguished from anything else, no matter how similar (Cicero *Acad.* 2.77–78; Sextus Empiricus *Adv. math.* 7.248 ff.; Diogenes Laertius VII 46).
    step1: |-
      若 *lekta* 在此处如别处一样充当这些状态的内容，那么 *lekta* 就不会 *只* 对应于理性表象。但人们自然会问：非理性动物与尚不能使用清晰语言的幼童没有概念，它们的表象如何能有与之对应的 *lekta*？二手文献中有一个广泛假定：一个 *lekton* 是否对应于一个表象，取决于个体拥有哪些概念（如果有的话）。但斯多亚派不能接受这一假定。恰恰相反。他们相信，每一个因果互动，无论有生命与否，都牵涉一个 *lekton*：一个物体使某个 *lekton* 变为真或对另一物体成立，该 *lekton* 规定施动者对受动者完全确定的效果（斯托拜乌斯 1.138.14；塞克斯都·恩披里柯《驳数学家》9.211；亚历山大的克雷芒《杂记》8.9.3–4；Frede 1994 正确强调了这一点）[^frede-1994]。但一旦我们承认斯多亚派同时持有表象的因果理论，这一因果分析就立刻变得切题：他们把表象定义为在范式情形中表象对象在灵魂上产生的效果，字面上说是一种“印象”（*tupōsis*），而按他们的观点灵魂是物体；他们还明确把这比作印章戒指在蜡上留下的印痕（第欧根尼·拉尔修 VII 50；埃提乌斯 4.12.1–4；普鲁塔克《论共同概念》1084f–1085a）。在定义他们视为真理判准与知识基础的“可靠”表象（*phantasia katalēptikē*）时，他们再次使用印章式语言：这种表象以如此丰富的细节表象产生它的对象，以致可以同任何其他东西区分开来，无论后者多么相似（西塞罗《学园派》2.77–78；塞克斯都·恩披里柯《驳数学家》7.248 以下；第欧根尼·拉尔修 VII 46）。
