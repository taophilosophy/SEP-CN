      The received view, which takes the notion to originate in Arabic philosophy, traces back to an article by the phenomenologist Herbert Spiegelberg, originally published in 1933 (for a translation of a revised version, see Spiegelberg 1976)[^spiegelberg-1976]. It turns entirely on philosophical terminology: it only considers texts that use cognates of ‘intention’ in a specific technical sense, that of a mental act’s *being directed at* or *referring to* something, in contrast with a usage that applies exclusively to practical contexts, where an agent intends to do something. Spiegelberg claims that before the high scholastic period, uses of the Latin *intentio* were exclusively practical and so have no bearing on the problem of the intentionality of mental states more generally. The closest antecedents, he claims, are the Arabic *ma’na* and *ma’qul*, which were translated into Latin in the high scholastic period by *intentio*.
    step1: |-
      通行的看法认为，这一观念起源于阿拉伯哲学；该看法可追溯到现象学家赫伯特·施皮格伯格的一篇文章，原文发表于 1933 年（修订版英译见 Spiegelberg 1976）[^spiegelberg-1976]。这种看法完全着眼于哲学术语：它只考虑使用“意向”同源词的文本，而且是在一种特定的技术意义上使用，即心理活动 *指向* 或 *指涉* 某物；与之相对，另一种用法则专用于实践语境，即行动者打算做某事。施皮格伯格主张，在经院哲学盛期之前，拉丁语 *intentio* 的用法完全是实践性的，因而与一般意义上的心理状态之意向性问题无关。他还主张，最接近的先驱是阿拉伯语的 *maʿnā* 与 *maʿqūl*，二者在经院哲学盛期被译为拉丁语 *intentio*。
    step2: |-
      通行的看法认为，这一观念起源于阿拉伯哲学；它可追溯到现象学家赫伯特·施皮格伯格 1933 年发表的一篇文章（修订版英译见 Spiegelberg 1976）[^spiegelberg-1976]。该看法完全着眼于哲学术语：它只考虑使用“意向”同源词的文本，且只取一种特定技术含义，即心理活动 *指向* 或 *指涉* 某物；与之相对的另一用法则专用于实践语境，指行动者打算做某事。施皮格伯格主张，在经院哲学盛期之前，拉丁语 *intentio* 的用法纯属实践性的，因而与一般意义上的心理状态之意向性问题无关。他还主张，最接近的先驱是阿拉伯语的 *maʿnā* 和 *maʿqūl*，二者在经院哲学盛期被译作拉丁语 *intentio*。
