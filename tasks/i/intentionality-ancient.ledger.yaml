      This definition, though, also poses a difficulty. In recent decades, it has been thought to imply that *lekta* subsist *only* in connection with the representations of rational animals – something not stated explicitly in our reports – even though this would have problematic consequences: it would imply that nonrational animals and indeed very young humans, before they develop reason, would either paradoxically have representations without any content at all or solely with nonconceptual content that could not be articulated. (For a classic statement of the view, see Frede 1983 [1987], 153–54, 156; for a discussion of the consequences, see Sorabji 1993, 20–28.)[^frede-1983][^sorabji-1993] Neither the Stoics nor their critics ever mention such consequences, and it would make it difficult, if not impossible, for them to account for animal behavior, much less the emergence of reason itself in humans. They insist that we have no concepts (*ennoiai*) at birth, comparing the mind to a blank sheet of papyrus, ready to be written upon: it is first inscribed by perceptions and then subsequently, through the sorting and collection of perceptual memories, by experience, issuing in our first natural concepts, from which we can later construct even more complex concepts. Reason only appears later – some sources say at age seven, others at fourteen – when there are sufficient concepts to form a stable, interrelated system (Aetius 4.11.1–4; Plutarch *On Common Conceptions* 1084f–1085a; Diogenes Laertius VII 53). So on the Stoics’ view, children will possess concepts at some stage *before* they have reason, since reason emerges from the cumulative acquisition and systematization of concepts, and evidently some of these concepts are formed naturally from perceptions and memories alone, unaided by reason, from which they presumably derive their content at least in part. Since all these states undoubtedly possess content, there is no principled ground for denying analogous content in the case of representations in nonrational animals either, at least for perceptual representations.
    step1: |-
      不过，这一定义也带来一个困难。近数十年来，人们认为它意味着 *lekta* *只* 在与理性动物表象的关联中潜存；我们的记载并未明说这一点。但这会带来有问题的后果：它将意味着非理性动物、乃至尚未发展出理性的幼童，要么悖论式地拥有完全无内容的表象，要么只拥有无法用语言表达的、非概念的内容。（关于该观点的经典表述，见 Frede 1983 [1987], 153–54, 156；关于其后果的讨论，见 Sorabji 1993, 20–28。）[^frede-1983][^sorabji-1993] 斯多亚派及其批评者都从未提到这类后果；而且，这将使他们难以乃至无法说明动物行为，更不用说人类理性的出现。他们坚持我们出生时没有任何概念（*ennoiai*），把心灵比作一张空白莎草纸，随时可被书写：它先由知觉刻写，随后通过对知觉记忆的分类与汇集，由经验刻写，产生我们最初的自然概念；此后我们又能由这些概念构造更复杂的概念。理性只是后来才出现（有些资料说七岁，有些说十四岁），此时已有足够的概念形成一个稳定、相互关联的系统（埃提乌斯 4.11.1–4；普鲁塔克《论共同概念》1084f–1085a；第欧根尼·拉尔修 VII 53）。因此按斯多亚派观点，儿童在拥有理性 *之前* 的某个阶段就已拥有概念，因为理性正是从概念的累积获得与系统化中产生的；显然其中一些概念仅凭知觉与记忆自然形成，无需理性协助，它们的内容至少部分来自这些知觉与记忆。既然所有这些状态无疑都具有内容，那么也没有原则性理由否认非理性动物的表象同样具有类似内容，至少就知觉表象而言。
