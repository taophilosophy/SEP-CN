      Throughout his dialogues, Plato emphasizes the relational character of various mental states: sight, hearing, touch and perception generally, memory, belief, knowledge, concepts, speech, love (*Tht.* 152c, 160a–b, 163e, 188d–189b; *Rep.* V, 476e, 478b; *Parm.* 132b–c; *Soph.* 262e, 263c; *Symp.* 199d). In each case, Socrates (or the other main speaker) asks whether the mental state in question is “of something or of nothing”, and the interlocutors agree that it is always *of something* – it is impossible for such a state not to be of anything at all. In the *Charmides*, Socrates gets Critias to agree to something stronger, namely, that many of these states – seeing, hearing, and other forms of perception, desire, intention, love, fear, and belief – must have an object *other* than themselves; and he suggests that it would be odd if knowledge were not like this as well (167c–168a). But in this regard, mental states do not differ from other relatives, as he himself emphasizes: Socrates sometimes adds nonintentional cases, such as siblings, parents and children, and doubles and halves, in order to illustrate his point. In some of the passages above, Socrates follows up this question with a further one, which has bearing only for the mental states, namely, whether they are always of something “that is” rather than something “that is not”. Although the speakers readily agree that these states must always be of something that is, the problem of intentionality already looms, merely by his raising the possibility that on occasion some states might be of what is not, either of what is not the case or of what does not exist. In the *Philebus*, this alternative is explicitly taken up: just as one can believe something without that belief being of anything that ever was, is, or will be, so one can feel pleasure about something, or fear, anger, and so on, even if it is not about anything that ever was, is, or will be. In all such cases, the beliefs, pleasures, fears, and so on are said to be “false” (*pseudē*, *Phlb.*40c–e).
    step1: |-
      在其全部对话中，柏拉图强调多种心理状态的关系性特征：视、听、触以及一般知觉、记忆、信念、知识、概念、言语、爱（Tht. 152c, 160a–b, 163e, 188d–189b; Rep. V, 476e, 478b; Parm. 132b–c; Soph. 262e, 263c; Symp. 199d）。在每一情形中，苏格拉底（或其他主要发言者）都问：该心理状态是“关于某物的还是关于无物的”？对话者同意它总是*关于某物*——这种状态完全不关于任何东西，是不可能的。在《卡尔米德篇》中，苏格拉底使克里提亚同意一个更强的主张：许多这类状态——看、听及其他知觉形式、欲望、意图、爱、恐惧与信念——必定有一个*不同于自身*的对象；他提示，如果知识不是这样，反而奇怪（167c–168a）。但在这一点上，心理状态与其他关系项并无不同，正如他自己强调的：苏格拉底有时增加非意向性的例子——兄弟姊妹、父母与子女、加倍与减半——来说明其观点。在上面某些段落中，苏格拉底在这一问题之后追问一个只与心理状态有关的进一步问题：它们是否总是关于“存在者”而非“非存在者”。虽然发言者乐于同意这些状态必总是关于存在者，意向性问题已然隐现——仅仅因为他提出这一可能：有时某些状态可能关于非存在者，或关于并非如此者，或关于不存在者。在《斐勒布篇》中，这一选项被明确采纳：正如人可以相信某物而该信念并不关于任何曾经、正在或将要是的东西，人也可以对某物感到快乐，或恐惧、愤怒等等，即使它不关于任何曾经、正在或将要是的东西。在所有这类情形中，信念、快乐、恐惧等等被说成“假的”（pseudē，Phlb. 40c–e）。
    step2: |-
      柏拉图遍其对话，恒申诸心状关系之性：视、听、触及通乎知觉，记忆、信念、知识、概念、言语、爱（Tht. 152c, 160a–b, 163e, 188d–189b; Rep. V, 476e, 478b; Parm. 132b–c; Soph. 262e, 263c; Symp. 199d）。每于此，苏格拉底（或主言者）问曰：此心状“关于某物乎，关于无物乎”？对曰必*关于某物*——全不关于任何物，不可也。《卡尔米德篇》，苏格拉底使克里提亚许更强之说：诸态——视、听及他知觉、欲、意、爱、惧与信——必有一*异乎己*之对象；且谓知识不如是，殆怪（167c–168a）。然此节心理之态与他关系项无异，彼亦自申之：苏格拉底间增非意向之例——兄弟、父母子、倍与半——以明其旨。上引数处，苏格拉底又进而问一惟关于心状者：其恒关于“存在者”而非“非存在者”乎？言者乐许诸态恒关于存在者，而意向性之难已隐然而兴——特以其举“间或有态关于不然者、或不存在者”之可能也。《斐勒布篇》明取此别项：人可信某物而其信不关于任何曾经、方今、将然者，如是可以乐某物，或惧、怒之属，虽其不关于曾经、方今、将然者。凡此，其信、其乐、其惧，皆谓之“妄”（pseudē，Phlb. 40c–e）。
