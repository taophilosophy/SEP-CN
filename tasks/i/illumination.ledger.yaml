      Ghent’s argument is interestingly different from that of Augustine and his Franciscan followers. Whereas they had dismissed the physical world as too changeable to be a fit subject for human knowledge, Ghent believes that pure truth and certain knowledge can be had of the physical world, provided we manage to grasp the real essences of things. Since we cannot do so on our own, we need divine illumination to go beyond sensory appearances, to have genuine insight into the nature of reality. At its most basic level, Ghent is offering a critique of the agent intellect. Although he accepts the doctrine of agent intellect, he refuses to give that faculty the kind of efficacy that it has for Aquinas and other medieval Aristotelians. Not surprisingly, Ghent proposes reviving the earlier thirteenth-century tradition of referring to God himself as a kind of agent intellect (*Quodlibet* 9.15). The way Ghent would synthesize Augustine and Aristotle, in this area, is by identifying those aspects of Aristotle that are incomplete and supplementing them with the necessary Augustinian illumination. (This is a summary of the account in Pasnau 1995. All of Henry’s important initial article from his *Summa* on the possibility of knowledge is now available in a translation from Roland Teske.)[^pasnau-1995]
    step1: |-
      根特的亨利的论证与奥古斯丁及其方济各会追随者的论证有一种耐人寻味的差别。他们曾以物理世界过于可变、不适于作人类知识的对象为由将之排除；根特的亨利则相信，只要我们设法把握事物的真实本质，关于物理世界的纯粹真理与确定知识是可以获得的。既然我们自己做不到这一点，就需要神圣光照来超越感官显象，对实在的本性获得真正的洞见。在最基本的层面上，根特的亨利是在批评主动理智。他虽接受主动理智的学说，却拒绝赋予这一官能以阿奎那及其他中世纪亚里士多德主义者所给的那种效力。不出所料，根特的亨利主张复兴十三世纪早期把上帝本人称作某种主动理智的传统（《杂题》*Quodlibet* 9.15）。在这一领域，根特的亨利综合奥古斯丁与亚里士多德的方式是：找出亚里士多德体系中不完整的方面，用必要的神圣光照来补充它们。（这是 Pasnau 1995 所述内容的概述。亨利《大全》中关于知识可能性的那篇重要开篇论文，现有 Roland Teske 的译本可读。）[^pasnau-1995]
    step2: |-
      根特的亨利的论证与奥古斯丁及其方济各会追随者有一处耐人寻味的分别。他们曾以物理世界过分可变、不堪充当人类知识的对象为由把它排除；根特的亨利却相信，只要我们把握到事物的真实本质，关于物理世界的纯粹真理与确定知识是可以得到的。既然我们凭自己做不到，便需要神圣光照来越过感官显象，对实在的本性取得真正的洞见。在最基本的层面上，这是对主动理智的批评。他接受主动理智的学说，却不肯给这一官能以阿奎那等中世纪亚里士多德主义者所赋予的那种效力。不出所料，他主张复活十三世纪早期的一个传统：把上帝本人说成某种主动理智（《杂题》*Quodlibet* 9.15）。在这一领域，他综合奥古斯丁与亚里士多德的路数是：指出亚里士多德体系中残缺的环节，再以必要的神圣光照补齐。（此为 Pasnau 1995 所论的概述。亨利《大全》中论知识可能性那篇重要的开篇文章，现有 Roland Teske 的译本。）[^pasnau-1995]
