  - id: 3
    kind: body
    source: |-
      The theory of divine illumination is generally conceived of as distinctively Christian, distinctively medieval, and distinctively Augustinian. There is some justification for this, of course, inasmuch as Christian medieval philosophers gave the theory serious and sustained discussion, and inasmuch as Augustine gave illumination a very prominent role in his theory of knowledge. Still, it is better to think of the theory in a wider context. Divine illumination played a prominent part in ancient Greek philosophy, in the later Greek commentary tradition, in neo-Platonism, and in medieval Islamic philosophy. Moreover, it was Christian medieval philosophers, near the end of the thirteenth century, who were ultimately responsible for decisively refuting the theory. I will suggest that we view this last development as the first great turning point in the history of cognitive theory.
    step1: |-
      神圣光照理论通常被视为带有鲜明的基督教色彩、鲜明的中世纪色彩、鲜明的奥古斯丁主义色彩。这当然有一定道理：中世纪基督教哲学家对这一理论进行过严肃而持续的讨论，奥古斯丁也确实让光照在其知识论中占据十分突出的位置。不过，更好的做法是在更宽的语境中理解这一理论。神圣光照在古希腊哲学、后期希腊注疏传统、新柏拉图主义以及中世纪伊斯兰哲学中都扮演过重要角色。而且，恰恰是中世纪基督教哲学家在十三世纪末最终决定性地驳倒了这一理论。我建议把这一最终的发展视为认知理论历史上的第一个伟大转折点。
    step2: |-
      神圣光照理论通常被视为基督教特有的、中世纪特有的、奥古斯丁主义特有的。这当然有几分道理：中世纪基督教哲学家对这一理论作过严肃而持续的讨论，奥古斯丁也确实让光照在其知识论中占据显要位置。不过，更好的做法是把这一理论放进更宽的语境。神圣光照在古希腊哲学、后期希腊注疏传统、新柏拉图主义与中世纪伊斯兰哲学中都曾扮演要角。而且，恰恰是中世纪基督教哲学家在十三世纪末最终决定性地驳倒了它。我建议把这一结局视为认知理论史上的第一个伟大转折点。
  - id: 4
    kind: body
    source: |-
      I understand a theory of divine illumination to be a theory on which the human mind regularly relies on some kind of special supernatural assistance in order to complete (some part of) its ordinary cognitive activity. The assistance must be *supernatural*, of course, or it will not count as *divine* illumination. It must be *special*, in the sense that it must be something more than the divine creation and ongoing conservation of the human mind. (If this by itself were to count as illumination, then all theists would be committed to the theory of divine illumination.) The mind must *regularly* rely on this assistance, in order to complete its *ordinary* cognitive activity: otherwise, an occasional mystical experience might suffice to confirm a theory of divine illumination. But a defender of the theory need hold only that we require this assistance for *some part of* our ordinary cognitive activities: hardly anyone has supposed that every form of human cognition requires divine illumination.
    step1: |-
      我把神圣光照理论理解为这样一种理论：人类心灵为了完成其日常认知活动的（某一部分），会经常性地依赖某种特殊的超自然援助。这种援助必须是超自然的，否则它就算不上神圣光照。它必须是特殊的，意思是它必须超出对人类心灵的神圣创造与持续保存。（如果仅凭这一点就算光照，那么所有有神论者都会被卷入神圣光照理论。）心灵必须经常性地依赖这种援助来完成其日常认知活动：否则，一次偶然的神秘体验就足以确证某种神圣光照理论。但该理论的辩护者只需主张：我们完成日常认知活动的某一部分需要这种援助——几乎没有人认为人类认知的一切形式都需要神圣光照。
    step2: |-
      我所谓神圣光照理论，指这样一种理论：人类心灵为了完成日常认知活动的某一部分，会经常性地依赖某种特殊的超自然援助。援助必须超自然，否则算不上神圣光照；必须是特殊的，即须超出对人类心灵的神圣创造与持续保存。（若仅凭这一点就算光照，则一切有神论者都将被卷入神圣光照理论。）心灵必须经常性地依赖这种援助来完成日常认知活动：否则，一次偶然的神秘体验便足以确证某种光照理论。但辩护者只需主张，我们完成日常认知活动的某一部分需要这种援助——几乎无人认为人类认知的一切形式都需神圣光照。
  - id: 5
    kind: body
    source: |-
      It is useful to think of divine illumination as analogous to grace. Just as a proponent of grace postulates a special divine role on the volitional side, so a proponent of divine illumination postulates a special divine role on the cognitive side. Grace is intended as an explanation not of all human desires and motivations, nor even of all virtuous desires and motivations. Rather, the proponent of grace holds that there is a certain class of volitional states, crucial to human well-being, that we can achieve only with special divine assistance. Likewise, the theory of divine illumination is intended as an explanation not of all belief, nor even of all knowledge. Rather, the theory holds that there are certain kinds of knowledge, crucial to cognitive development, that we can achieve only with special divine assistance. It is an odd fact that, despite the close analogy, grace is regarded not as a philosophical question, but as a theological one. It is an equally odd fact that, whereas divine illumination hasn’t generally been regarded as plausible since the thirteenth century, grace continues to be taken seriously by many theologians. Perhaps both of these facts can be accounted for by motivational psychology’s relative obscurity in comparison to cognitive psychology.
    step1: |-
      把神圣光照类比为恩典（grace）是有益的。正如恩典论者在意志方面设定一种特殊的神圣作用，神圣光照论者也在认知方面设定一种特殊的神圣作用。恩典并不打算解释人类所有的欲望与动机，甚至也不解释所有有德性的欲望与动机。恩典论者主张的是：有一类意志状态对人的福祉至关重要，而我们只有借助特殊的神圣援助才能达到。同样，神圣光照理论也不打算解释所有信念，甚至不解释所有知识。该理论主张的是：有几类知识对认知发展至关重要，而我们只有借助特殊的神圣援助才能获得。一个奇怪的事实是：尽管二者高度类似，恩典却不被当作哲学问题，而被当作神学问题。同样奇怪的是：十三世纪以来神圣光照已很少被视为可信，而恩典却仍被许多神学家严肃对待。也许这两个事实都可以用动机心理学相对于认知心理学的不受重视来解释。
    step2: |-
      不妨把神圣光照类比于恩典。恩典论者在意志一侧设定一种特殊的神圣作用，光照论者则在认知一侧设定一种特殊的神圣作用。恩典并不解释人类全部的欲望与动机，甚至不解释全部有德性的欲望与动机；恩典论者只说，有一类意志状态对人的福祉至关重要，而唯有借助特殊的神圣援助才能达到。光照理论亦然：它不解释全部信念，甚至不解释全部知识；它只说，有几类知识对认知发展至关重要，而唯有借助特殊的神圣援助才能获得。一个奇怪的事实是：尽管二者高度相似，恩典被当作神学问题而非哲学问题。另一个同样奇怪的事实是：十三世纪以降，神圣光照已普遍不再被视为可信，恩典却仍为许多神学家认真对待。这两个事实或许都可用动机心理学相对认知心理学的长期冷落来解释。
  - id: 6
    kind: body
    source: |-
      For most people today it is hard to take divine illumination seriously, hard to view it as anything other than a quaint relic. A first step toward developing a proper perspective on the theory is to see it in its broader context, not as peculiarly Christian or medieval, but as an assumption shared by most premodern philosophers. A second step in the same direction is to identify and to take seriously the philosophical problem that drives illumination theory. In large part, the theory has been invoked to explain rational insight — that is, a priori knowledge. For much of the modern era, philosophers have been preoccupied with empirical knowledge and have not had much interest in this topic. (Recently, this situation has changed notably; for foundational recent treatments, see Bealer 2000 and Bonjour 1998.)[^bealer-2000][^bonjour-1998] To see how something like divine illumination could have ever seemed at all plausible, one has to see how deeply puzzling the phenomenon of rational insight actually is. One way of seeing this, and of seeing how little we understand rational insight, is to look at cases where something goes wrong. A recent biography of the Nobel-prize winning mathematician John Nash describes his long period of mental illness, during which time he held various odd beliefs such as that extraterrestrials were recruiting him to save the world. How could he believe this, a friend asked during a hospital visit, given his devotion to reason and logic?
    step1: |-
      今天的大多数人很难严肃看待神圣光照，很难把它当作古董以外的任何东西。培养对这一理论的恰当视角，第一步是把它放进更宽的语境：它不是基督教或中世纪特有的，而是前现代大多数哲学家共同接受的一个假定。第二步是识别并认真对待驱动光照理论的那个哲学问题。在很大程度上，这一理论被援引来解释理性洞见——即先天知识。在近现代的大部分时间里，哲学家专注于经验知识，对这个话题兴趣不大。（近来情况已显著改观；奠基性的近期讨论见 Bealer 2000 与 Bonjour 1998。）[^bealer-2000][^bonjour-1998] 要看清神圣光照之类的东西怎么会显得可信，就得看清理性洞见现象实际上有多令人困惑。看清这一点、并看清我们对理性洞见理解得何其少的一个办法，是考察出问题的案例。诺贝尔奖得主数学家约翰·纳什（John Nash）的一部近传描述了他长期罹患精神疾病的岁月，其间他持有各种古怪信念，例如外星人正在招募他去拯救世界。住院探视时一位朋友问他：既然他如此献身于理性与逻辑，怎么会相信这种事？
    step2: |-
      今天大多数人难以认真看待神圣光照，只觉得它是件古旧的遗物。要取得恰当的视角，第一步是把它放回更宽的语境：它并非基督教或中世纪所独有，而是前现代多数哲学家共有的假定。第二步是识别并认真对待驱动光照理论的那个哲学问题。这一理论在很大程度上是被用来解释理性洞见的，也就是先天知识。近现代哲学家长时间专注于经验知识，对此题兴味索然。（近来局面已明显改观；奠基性的近期讨论见 Bealer 2000 与 Bonjour 1998。）[^bealer-2000][^bonjour-1998] 要理解神圣光照之类何以曾显得可信，先得看清理性洞见这一现象本身有多令人困惑。看清这一点、也看清我们对它理解得何其少，一个办法是考察出岔子的案例。诺奖得主、数学家约翰·纳什（John Nash）的一部近传写到他漫长的精神疾病岁月，其间他抱有种种古怪信念，例如外星人正在招募他去拯救世界。住院探视时，一位朋友问他：既然他如此服膺理性与逻辑，怎么会信这种事？
