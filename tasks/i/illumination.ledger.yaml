  - id: 12
    kind: body
    source: |-
      This appears to be an entirely straightforward expression of a theory of divine illumination. It is not clear who is providing the illumination. Apuleius (fl. 150 CE) would later identify the source as a certain kind of friendly demon, and argue that it was only fitting for Socrates, the most perfect of all human beings, to receive such illumination (*De deo Socratis*, XVII–XIX). (This idea that illumination comes to those who deserve it would be proposed by Augustine as well [e.g., *De magistro* 11.38], but abandoned in his later writings as untenable.) As one might expect from Socrates, his illumination seems restricted to the moral sphere. Its form is unclear: is it propositional? (see *Phaedrus* 242bc) Is it merely the pang of conscience? (For discussion of these and other questions, see e.g. the papers collected in Destrée and Smith 2005.)[^destrée-2005] Whatever the details, Socrates is explicitly describing a kind of cognitive guidance that has a “divine or spiritual” source. The passage may be an embarrassment to classicists, but it surely belongs in the same tradition as later medieval endorsements of illumination.
    step1: |-
      这似乎是对神圣光照理论全然直白的表达。提供光照者是谁并不清楚。阿普列乌斯（约 150 年活跃）后来把来源定为某种友善的精灵（daimon），并论证说：只有苏格拉底这样人类中最完美的人，才配得上接受这样的光照（《论苏格拉底之神》*De deo Socratis*，XVII–XIX）。（光照降临于配得上它的人——这一观念奥古斯丁后来也提出过［如《论教师》*De magistro* 11.38］，但在其晚期著作中作为站不住脚的东西放弃了。）不出所料，苏格拉底的光照似乎限于道德领域。其形式并不清楚：它是命题性的吗？（见《斐德罗篇》242bc）抑或只是良心的刺痛？（关于这些问题及其他问题的讨论，参见收录于 Destrée and Smith 2005 的论文。）[^destrée-2005] 无论细节如何，苏格拉底明确描述了一种具有“神圣或精神”来源的认知引导。这段文字也许令古典学者尴尬，但它无疑与后来中世纪对光照的拥护属于同一传统。
    step2: |-
      这看起来是神圣光照理论的直白表述。但究竟谁在提供光照，并不清楚。阿普列乌斯（约 150 年在世）后来把来源定为某一类友善的精灵（daimon），并论证说：唯有人类中最完美的苏格拉底才配得到这样的光照（《论苏格拉底之神》*De deo Socratis*，XVII–XIX）。（光照降临于配得其人者，这一观念奥古斯丁亦曾提出［如《论教师》*De magistro* 11.38］，后来却因站不住脚而在晚年著作中放弃。）如人所料，苏格拉底的光照似乎局限于道德领域。其形式也不清楚：是命题性的吗？（见《斐德罗篇》242bc）抑或只是良心的刺痛？（关于这些问题及其他问题，参见 Destrée and Smith 2005 所收论文。）[^destrée-2005] 无论细节如何，苏格拉底明确描述的是一种有“神圣或精灵”来源的认知引导。这段话或许让古典学者难堪，却无疑与中世纪后期为光照辩护的传统同属一脉。
