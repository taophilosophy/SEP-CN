      围绕这段文本的含义当然有无穷的争论。古人与今人共有的一种极常见解读是：这个主动理智是某种神性之物，根本不是人类官能。若再作一个自然的进一步假设——主动理智参与普通人认知——那么亚里士多德显然就主张某种版本的神圣光照论。（但应谨慎：不要以为亚里士多德的 *nous poietikos* 在多大程度上扮演了经院哲学 *intellectus agens* 的角色。见 Haldane 1992。）[^haldane-1992] 并非所有人都被说服：这个主动理智是字面上分离且神性的。但即使假定主动理智是人类灵魂的一部分，人们仍难以避免这样的怀疑：某种特殊的神圣影响在起作用。这段文字中的每一处都在呼唤人类认知中的某种超自然要素。
