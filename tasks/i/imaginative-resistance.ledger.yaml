      达斯汀·斯托克斯（2006）提出一种不愿论版本，修订柯里的说明，把欲求式想象所扮演的角色交给其所称的“价值式想象”。他借鉴大卫·刘易斯关于珍视的说明（珍视 x 就是欲求自己欲求 *x*，即对 *x* 持有二阶欲求），主张价值式想象涉及想象性地欲求自己欲求世界处于某种状态。例如在 *吉塞尔达* 案例中，当我们不想象性地欲求自己欲求杀女婴发生时，想象阻力便产生。
