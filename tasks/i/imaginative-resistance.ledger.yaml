      Engaging with works of fiction involves taking on perspectives that are prescribed by the narrators. That is how non-propositional content is communicated to audiences. In cases of imaginative resistance, what we resist is taking on alien perspectives. Our resistance might be caused by various types of inconsistencies embedded in the work or we might resist on prudential, moral, or aesthetic grounds. One important aspect of Camp’s theory is that these resistance reactions are not always voluntary (2017: 92–3). She also argues that her account has an advantage over competing theories because she does not reduce the content of imaginings to propositional content. (See also Goldie 2003, for a similar explanation of imaginative resistance, and Szanto 2020, for an explanation of imaginative resistance as a breakdown in empathic perspective-taking.)[^goldie-2003][^szanto-2020]
