      所举粗粝英雄之例包括《绝命毒师》的沃尔特·怀特与《沉默的羔羊》的汉尼拔·莱克特。粗粝英雄的有趣之处在于：尽管他们有这些负面特征，尽管我们起初感到抵抗，最终仍会因叙事所规定的亲态度而站到他们一边。实际上，这种被制造出的张力是恰当欣赏所必需的：因主人公道德缺陷而谴责他，与因叙事鼓励而对其发展亲态度，二者之间的张力最终使我们克服对主人公的初始抵抗，站到他一边。伊顿把这种被制造的张力及随后对张力的克服，视为叙事的艺术成就（2012: 285）。
