      The variety of resistance reactions due to the context of the fiction as well as the imaginer’s own context leads eliminativists to dismiss the phenomenon of imaginative resistance as a genuine phenomenon (see Tanner 1994, Mothersill 2003, and Dain 2020 for other defenses of eliminativism, and Nolan 2020 for his discussion of how readers can either overcome or intentionally invite resistance reactions through playful or resistant readings, as well as his argument that even if the phenomenon exists, it is not a reliable guide for addressing issues in modal epistemology). However, the eliminativists’ insights concerning context relativity have led to further research on imaginative resistance (more on that in section 2.3).
