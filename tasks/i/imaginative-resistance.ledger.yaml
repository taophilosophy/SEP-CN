      Emine Hande Tuna (2024) also suggests alternatives to strict cantianism and strict wontianism. She reconstructs a Humean and a Kantian explanation of the phenomenon of imaginative resistance and claims that both approaches are committed to what she calls the variety thesis: our resistance reactions can fall on a spectrum varying between can’ts and won’ts. Tuna (forthcoming) also claims that cantianism and wontianism are not opposing but complementary positions that explain different aspects of imaginative resistance: Cantianism addresses why we cannot *panoramically* imagine deviations, while wontianism explains our unwillingness to *selectively* imagine them. According to Tuna, cantianism attributes resistance to an inability to *panoramically* imagine deviations, which involves the comprehensive imagining of all apprehended propositions within the fiction and ensuring global consistency, akin to belief. Wontianism, in contrast, links resistance to an unwillingness to *selectively* imagine deviations, which involves focusing on local coherence without the need for global consistency. (See also Michel-Antoine Xhignesse [2021] for his distinction between occurrent and reflective reading, which influenced Tuna’s own distinction, and his argument that occurrent reading, which Tuna associates with selective imagining, cannot overcome the imaginative blockages encountered during reflective engagement with contradictory fiction. The main difference between Tuna and Xhignesse on the possibility of overcoming resistances lies in how they construe fictional truth.)
    step1: |-
      埃米内·汉德·图纳（2024）也提出严格不能论与严格不愿论之外的替代方案。她重构了对想象阻力现象的休谟式与康德式解释，主张两种进路都承诺她所称的“多样性论题”：我们的抵抗反应可落在从“不能”到“不愿”的连续谱上。图纳（即将发表）还主张，不能论与不愿论并非对立，而是互补立场，解释想象阻力的不同方面：不能论说明我们为何不能*全景式*地想象偏离，不愿论则解释我们为何不愿*选择性*地想象偏离。按图纳，不能论把抵抗归于不能*全景式*地想象偏离——这涉及对虚构中所有被领会命题作综合想象并确保全局一致，类似信念。不愿论则把抵抗与不愿*选择性*地想象偏离联系起来——这涉及关注局部融贯，无须全局一致。（另见米歇尔-安托万·希涅斯（2021）关于发生式阅读与反思式阅读的区分，该区分影响了图纳自己的区分；他还主张，图纳与选择性想象相联的发生式阅读，无法克服反思式投入矛盾虚构时所遇的想象阻塞。图纳与希涅斯在能否克服抵抗上的主要差异，在于他们如何构想虚构之真。）
