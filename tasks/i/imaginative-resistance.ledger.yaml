      Adam Green’s (2024) explanation, which falls roughly under wontianism, links imaginative resistance to moral dumbfounding—a psychological phenomenon where one experiences a strong moral reaction but lacks a clear rationale for it (see section 1.2 of the entry on moral reasoning). Green argues that both phenomena stem from a particular aspect of our moral psychology: when faced with positions or practices deemed unacceptable by our moral communities, we tend to resist considering them as viable options for moral discussion, even within fictional contexts. Instead, we shift from open deliberation to reaffirming the boundaries of acceptable discourse or outright rejecting narratives that support morally deviant behavior (2024: 2). Green posits that this form of resistance becomes more pronounced when narratives touch upon issues that are widely considered morally indefensible within our communities (2024: 15).
    step1: |-
      亚当·格林（2024）的解释大致属于不愿论，把想象阻力与道德哑然失语联系起来——那是一种心理学现象：人产生强烈的道德反应，却缺乏清晰理由（见道德推理词条第 1.2 节）。格林主张，两种现象都源于我们道德心理的某个方面：面对被我们道德共同体视为不可接受的主张或实践时，我们倾向于抵制把它们当作道德讨论的可行选项，即便在虚构语境中也如此。我们转而从开放审议退回到重申可接受话语的边界，或干脆拒绝支持道德偏离行为的叙事（2024: 2）。格林设定，当叙事触及我们共同体中广被认为道德上站不住脚的问题时，这种抵抗更为明显（2024: 15）。
