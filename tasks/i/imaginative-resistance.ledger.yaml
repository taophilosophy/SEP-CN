      The use of the word “resistance” in “imaginative resistance” has been criticized for privileging one of the rival explanations of imaginative resistance over the others. Three main rival explanations of imaginative resistance have been provided thus far: the Cantian, the Wontian, and the Eliminativist (Gendler 2006 coined the first two terms; Gendler and Liao 2016 the third one)[^gendler-2006][^gendler-2016][^liao-2016]. Eliminativists deny that the phenomenon exists outside philosophers’ carefully constructed vignettes. The remaining camps, while accepting the existence of the phenomenon, present competing explanations of it. Cantians claim that imaginative resistance occurs when we *can’t* engage in the prompted imaginative activity. Wontians, by contrast take the phenomenon to involve *unwillingness* (rather than inability) to engage on the part of the reader or the audience. Cantians and eliminativists have been critical of the use of the word “resistance” because the term itself seems to privilege the Wontian explanation. Even though some philosophers choose to use “imaginative failure” instead of “imaginative resistance”, the replacement term has not stuck—after all, this entry itself is titled “imaginative resistance” (see Stock 2005, Brock 2012, Stear 2015, Tooming 2018)[^brock-2012][^stear-2015][^stock-2005][^tooming-2018]. With the acknowledgment that “imaginative resistance” is an umbrella term for the phenomenon that some prefer to explain not in terms of *resistance* but *inability*, let’s have a closer look at competing explanations of imaginative resistance.
    step1: |-
      “想象阻力”中“抵抗”一词的用法，被批评为偏袒想象阻力诸竞争解释中的一种。迄今提出的三种主要竞争解释是：不能论（Cantian）、不愿论（Wontian）与消除论（Gendler 2006 首创前两个术语，Gendler and Liao 2016 首创第三个）[^gendler-2006][^gendler-2016][^liao-2016]。消除论否认该现象存在于哲学家精心构造的小故事之外。其余阵营接受该现象存在，但给出彼此竞争的解释。不能论者主张，想象阻力发生于我们*不能*投入所促发的想象活动之时。不愿论者则认为，该现象涉及读者或受众*不愿*（而非不能）投入。不能论者与消除论者一直批评“抵抗”一词的用法，因为该词本身似乎偏袒不愿论解释。尽管有些哲学家选择用“想象失败”而非“想象阻力”，替代术语并未流行——毕竟本词条本身就题为“想象阻力”（见 Stock 2005、Brock 2012、Stear 2015、Tooming 2018）[^brock-2012][^stear-2015][^stock-2005][^tooming-2018]。在承认“想象阻力”是该现象的统称（有人更愿以*不能*而非*抵抗*来解释它）之后，让我们更仔细地考察想象阻力的竞争解释。
