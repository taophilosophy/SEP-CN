    source: |-
      According to cognitive imagination theories, imaginative resistance reactions reflect either our inability or unwillingness to take on belief-like imaginings. We might not be able to take on the imaginings because cognitive imaginings are processed by the same system that is in charge of processing similar beliefs (see Nichols 2004, 2006a; Weinberg & Meskin 2006)[^nichols-2004][^weinberg-2006]. Or we might not be able to cognitively imagine higher-level claims in the absence of support from lower-level facts because such belief-like imaginings are possible only when they receive adequate lower-level support as ordinary beliefs do (see Walton 1994, 2006; Weatherson 2004; Stear 2015)[^stear-2015][^walton-1994][^weatherson-2004]. Or we might be unable or unwilling to take on the belief-like imaginings because we do not want to export them or believe them given a conflicting belief we hold or our lack of trust for the narrator (Gendler 2000, 2006; Matravers 2003; Stock 2017)[^gendler-2000][^matravers-2003][^stock-2017].
    step1: |-
      按认知想象理论，想象阻力反应反映我们无法或不愿采取信念式想象。我们可能无法采取这些想象，因为认知想象由负责加工类似信念的同一系统加工（见 Nichols 2004, 2006a; Weinberg & Meskin 2006）[^nichols-2004][^weinberg-2006]。或者，我们可能无法在缺乏较低层事实支持时认知地想象较高层主张，因为这类信念式想象只有在像普通信念那样获得充分较低层支持时才可能（见 Walton 1994, 2006; Weatherson 2004; Stear 2015）[^stear-2015][^walton-1994][^weatherson-2004]。或者，我们可能无法或不愿采取信念式想象，因为鉴于我们所持的冲突信念或对叙述者缺乏信任，我们不想把它们输出或相信（Gendler 2000, 2006; Matravers 2003; Stock 2017）[^gendler-2000][^matravers-2003][^stock-2017]。
    step2: |-
      按认知想象理论，想象阻力反应反映我们无法或不愿采取信念式想象。我们可能无法采取这些想象，因为认知想象由负责加工类似信念的同一系统加工（见 Nichols 2004, 2006a; Weinberg & Meskin 2006）[^nichols-2004][^weinberg-2006]。或者，我们可能无法在缺乏较低层事实支持时认知地想象较高层主张，因为这类信念式想象只有在像普通信念那样获得充分较低层支持时才可能（见 Walton 1994, 2006; Weatherson 2004; Stear 2015）[^stear-2015][^walton-1994][^weatherson-2004]。或者，我们可能无法或不愿采取信念式想象，因为鉴于我们所持的冲突信念或对叙述者缺乏信任，我们不想把它们输出或相信（Gendler 2000, 2006; Matravers 2003; Stock 2017）[^gendler-2000][^matravers-2003][^stock-2017]。
