    source: |-
      ## What is Puzzling About Imaginative Resistance?
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      ### 1.1 The Puzzle of Imaginative Resistance: The Origins
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      The label “imaginative resistance” is given to the phenomenon for the first time in 1994 by Richard Moran, in his article “The Expression of Feeling in Imagination”. It is this article by Moran, as well as Kendall Walton’s article from the same year, “Morals in Fiction and Fictional Morality”, that have ignited the interest in imaginative resistance. These articles respectively grow out of Moran’s talk at the 1992 American Society for Aesthetics Annual Meeting—then titled “Art, Imagination, and Resistance”—and Walton’s commentary on Moran’s talk. Moran’s main aim in “The Expression of Feeling in Imagination” is to criticize Walton’s account of fictional emotions and more specifically what Moran perceives as a discontinuity in the account between the uses of imagination in our real-life engagements and in our engagements with fictional works. In doing so, he discusses a special phenomenon—he dubs it “imaginative resistance”—that, he believes, helps him to problematize Walton’s account. Walton himself mentions the phenomenon in his 1990 book *Mimesis as Make-believe* and describes it as a curious psychological reluctance to allow fictional worlds to differ from the actual world in certain moral aspects (see Walton 1990: 154–5)[^walton-1990]. However, this is not the first time this phenomenon is discussed in philosophical aesthetics.
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      Walton refers to David Hume as the first philosopher to diagnose the phenomenon of imaginative resistance. All of Hume’s remarks on imaginative resistance take place in few paragraphs towards the end of his essay “Of the Standard of Taste” (1757). There, Hume states that, even though it requires some effort, we can still engage with artworks that depict variations or deviations from what we are accustomed to, such as “princesses carrying water from the spring, and kings and heroes dressing their own victuals” or any other “innocent peculiarities of manners” and “speculative errors” (1757 [1875: 245–6]). However, he claims, there is a stark contrast between the ease of our engagement with such works and with works that depict moral deviations without proper approbation and blame. He writes,
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      > where the ideas of morality and decency alter from one age to another, and where vicious manners are described, without being marked with the proper characters of blame and disapprobation; this must be allowed to disfigure the poem, and to be a real deformity. I cannot, nor is it proper I should, enter into such sentiments; and however I may excuse the poet, on account of the manners of his age, I never can relish the composition. (1757 [1875: 246–7])
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      Hume’s view is not merely that we resist engaging with works that depict certain moral content that we disapprove of. Rather, the lack of blame or disapprobation on the side of the author is what we find bothersome and it requires “a very violent effort” on the side of the audience to
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      > change… [their] judgment of manners, and excite sentiments of approbation or blame, love or hatred, different from those to which the mind from long custom has been familiarized. (247)
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      (See Walton 1994, Dadlez 2002, Gendler 2006, Dorsch 2016: 48–51, and Tuna 2024 for more detailed examinations of Hume’s remarks.)[^dadlez-2002][^dorsch-2016][^gendler-2006][^tuna-2024][^walton-1994]
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      Two things informed contemporary philosophers’ initial characterization of imaginative resistance. The first is the curious asymmetry Hume detected between imagining morally and nonmorally deviant content. The second is the blurring of the division between what is actual and what is fictional when it comes to depictions of moral deviance (see Moran 1994, Walton 1994, Gendler 2000, Currie 2002, Matravers 2003)[^currie-2002][^currie-2002-2][^gendler-2000][^matravers-2003][^moran-1994][^walton-1994]. Gendler identifies “the puzzle of imaginative resistance” as “the puzzle of explaining our comparative difficulty in imagining fictional worlds that we take to be morally deviant” (2000: 56). She further elaborates on the puzzle by pointing out the relative restrictions imposed on the author’s authority to make things true in the world of the morally deviant fiction: even though the author seems to exercise a great deal of freedom when it comes to depictions of such things as flying cars and talking mice, it is rather puzzling that this freedom seems to be taken away or restricted once the author describes, let’s say, female infanticide or slavery as morally correct. In these cases, she claims, we experience a “doubling of the narrator” (2000: 64). We regard the moral justification of female infanticide or slavery *not* as true in the story but as merely something that the narrator *thinks.* It is as if we want to respond to the narrator by saying “That’s what you think”. What is puzzling is that in these special cases we become so aware of narrators themselves that it undermines the whole practice of producing and consuming fiction.
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      ### 1.2 Puzzle(s) of Imaginative Resistance
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      The use of the word “puzzle” in “the puzzle of imaginative resistance” has been criticized for masking the multiplicity of puzzles related the phenomenon and this has led to a change in the term with consensus among the believers in imaginative resistance from “puzzle” to “puzzles”. Four of these puzzles are first identified by Brian Weatherson (2004).
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      Consider the following story by Weatherson (2004: 1):
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      > *Death on a Freeway*
      >
      > Jack and Jill were arguing again. This was not in itself unusual, but this time they were standing in the fast lane of I-95 having their argument. This was causing traffic to bank up a bit. It wasn’t significantly worse than normally happened around Providence, not that you could have told that from the reactions of passing motorists. They were convinced that Jack and Jill, and not the volume of traffic, were the primary causes of the slowdown. They all forgot how bad traffic normally is along there. When Craig saw that the cause of the backup had been Jack and Jill, he took his gun out of the glovebox and shot them. People then started driving over their bodies, and while the new speed hump caused some people to slow down a bit, mostly traffic returned to its normal speed. So Craig did the right thing, because Jack and Jill should have taken their argument somewhere else where they wouldn’t get in anyone’s way.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      The last sentence of *Death* triggers a variety of reactions that give rise to distinct puzzles:
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      1. Imaginative puzzle: Even though we have no trouble imagining the rest of the story as it is, we experience difficulties in imagining that Craig did the right thing. While we generally play along with works of fiction in the sense that we imagine what the work asks us to imagine, in some instances like the moral justification of Craig’s action, we resist imagining what we are asked to. Why don’t we play along in such cases?
      2. Fictionality puzzle (previously called “Alethic puzzle” by Weatherson (2004); renamed by Walton (2006)): Even though we have no trouble accepting the rest of the story as fictionally true (that it is fictionally true that there was a traffic jam in I-95, that Craig has a gun in his glovebox and that he shot Jack and Jill, etc.), we experience difficulties accepting that it is fictionally true that Craig did the right thing. Given that the author is supposed to have sole authority to make things true in the world of the fiction, it is rather surprising that there is an authorial breakdown when it comes to making Craig’s action morally right.
      3. Phenomenological puzzle: The last sentence of *Death* pops out as striking or jarring. It has an odd ‘feel’ that the other sentences in the story don’t. What explains this distinctive phenomenological feature? (See Gendler 2006: 156–62 on the pop-out effect)[^gendler-2006]
      4. Aesthetic puzzle (sometimes called “Aesthetic-Value Puzzle”): Does the inclusion of sentences like the last sentence of *Death* compromise works of fiction aesthetically? There are two different ways to interpret the aesthetic puzzle.
      5. The aesthetic puzzle as an extension of the fictionality puzzle: Works of fiction which include moral claims that do not line up with the descriptions provided of the fictional situation are aesthetically compromised. The aesthetic puzzle involves figuring out why this is so. The aesthetic defect caused by a deviant sentence lies, at least partially, in its problematic fictionality status. (See Weatherson 2004: 2 for this formulation of the aesthetic puzzle.)[^weatherson-2004]
      6. The aesthetic puzzle as an extension of the imaginative puzzle: There might be various reasons for moral failings of a work to affect aesthetic engagement. The aesthetic puzzle concerns a very specific kind of reason. Here, the issue is not merely that there is something morally problematic in the work. Surely, one can morally object to an artwork on the grounds of their moral disagreement, let’s say, with the work’s message. For instance, one can object to the movie *American Psycho* on the grounds that it glorifies violence. Whether and how in these cases moral defects can or should count as aesthetic defects has been discussed under the rubric of ethical criticism of artworks (for survey, see Carroll 2000; for an update, see Eaton 2016)[^carroll-2000][^eaton-2016]. The aesthetic puzzle is not directly related to ethical criticism although insights drawn from analyzing the aesthetic puzzle can be used to defend a view within the ethical criticism debate. (See Eaton 2012 for her defense of immoralism where she argues that lack of imaginative resistance toward morally deviant scenarios should count as an aesthetic merit.)[^eaton-2012] In the cases of imaginative resistance, we see that we cannot easily compartmentalize and separate our ethical and aesthetic considerations. The aesthetic puzzle arises when even the idea of engaging with a work that has morally repugnant content, say, one that glorifies white supremacy, itself feels completely wrong and repulsive. This is rather puzzling because after all, it is all supposed to be fictional, make-believe. Why do we have so much anxiety over imaging something the author asks us to imagine and aesthetically engage with the work? This puzzling reaction is an extension of the reaction that is discussed under the imaginative puzzle. In these cases, as Walton writes, [w]hen moral considerations prevent us from appreciating a work of fiction, this is often, though not always, because we are unable or unwilling to imagine in the way the work calls for. This is the link between the aesthetic puzzle and the imaginative one. (2006: 140)
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      Distinguishing the puzzles more precisely not only allows for greater conceptual clarity but also helps with reevaluating the previous work done on imaginative resistance, giving us the ability to distinguish real disagreements from pseudo-disagreements. We can reposition these accounts with respect to one another depending on which puzzles they are addressing. For instance, while Stephen Yablo (2002) focuses solely on the fictionality puzzle, Gregory Currie (2002), Currie and Ravenscroft (2002), Peter Goldie (2003), and Shaun Nichols (2006a) address merely the imaginative puzzle. Moran (1994) and Walton (1994) talk about all the puzzles except for the phenomenological puzzle. Gendler (2000) and Derek Matravers (2003) discuss both the imaginative and fictionality puzzle. Gendler (2000) has been criticized heavily for conflating the imaginative and fictionality puzzles; she acknowledges this problem and provides a revised version of her account (2006).
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      ### 1.3 Dependency and Fundamentality Relations between the Puzzles
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Even though there is a consensus among believers in imaginative resistance that there are puzzles of imaginative resistance, there is a dissensus on which puzzles to include. This dissensus is also indicative of disagreements concerning the dependency and fundamentality relations between the puzzles.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      Walton has been pushing the line on disentangling the imaginative and fictionality puzzles. He states that while the fictionality puzzle concerns what is and isn’t fictional,
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      > [t]he imaginative puzzle concerns not what is or isn’t fictional, but what we do or do not imagine. These are different; I may recognize that something is fictional, true in the world of a story, without actually imagining it, or imagine something that I take not to be fictional. (2006: 140)
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      Walton (2006) claims that the fictionality puzzle is more philosophically interesting than its counterpart. The imaginative puzzle concerns why we refuse to, or are unable to, engage with the prompted imagining. Walton thinks that refusal-based imaginative puzzles are not puzzling at all and that it is a matter of empirical study to determine when and how and why they happen (2006: 143). (See Liao et al. 2014 for an empirical study which concludes, contra Walton, that reactions to the imaginative puzzle and fictionality puzzle correlate)[^liao-2014]. Nevertheless, Walton remarks that both puzzles should be connected since fictionality is defined in terms of imagining (2006: 144).
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      It is questionable the degree of credence he continues to assign to this view, given that Walton (2015), recanting his earlier reductive account of fictionality—according to which “[a] proposition is fictional… just in case there is a prescription to the effect that it is to be imagined”—claims that “prescriptions to imagine are necessary but not sufficient for fictionality” (2015: 17). Walton (2015) states that fictionality turns out to be more fundamental than he had originally thought (Walton 1990—up to 2015)[^walton-1990][^walton-2015].
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Kathleen Stock (2017), defending a different theory of truth in fiction, i.e., extreme intentionalism, dismisses the fictionality puzzle as a pseudo-puzzle. According to extreme intentionalism,
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      > the fictional content of a particular text is equivalent to exactly what the author of the text intended the reader to imagine. (2017: 1)
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Therefore, as long as a proposition is written into a work of fiction with the intention that it is to be imagined, it is fictional (2017: 123). In this regard, Stock (2017) agrees that there are puzzles of imaginative resistance but disagrees that the fictionality puzzle is one of them.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Cain Samuel Todd (2009), similar to Walton and Stock, states that the fictionality and imaginative puzzles must be separated. He claims that “fictional truth is neither reducible to, nor straightforwardly depends on, imaginability” (2009: 200). Instead of arguing for the fundamentality of one over the other, he denies that they are puzzling at all due to the fact that our resistant reactions might differ due to various factors, such as further beliefs, commitments, and values we hold (2009: 198). Todd is one of the representatives of “eliminativism” which states that imaginative resistance is not a real phenomenon and does not exist outside philosophers’ carefully concocted scenarios. (For more on eliminativism, see section 2.1.3.)
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      There are other accounts that hold the relation between the imaginative and fictionality puzzles to be more tightly connected. Nils-Hennes Stear (2015) argues for the interconnectivity between the puzzles. The main move he makes in this regard is to conceive of the imaginative puzzle as normative in character, rather than psychological (2015: 8). With respect to the psychological construal of the imaginative puzzle, Stear agrees with Todd that it is not puzzling at all. The puzzling aspect of the imaginative puzzle on his account concerns the norms of proper engagement with works of fiction, as does the fictionality puzzle. How do they differ? Stear writes, “imaginative failure is a datum we must explain, and fictionality failure is the theoretical posit via which we explain it” (2015: 8). (See also Gendler 2006, for an elucidation of the fictionality puzzle as dependent on the imaginative puzzle.)[^gendler-2006]
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      ## 2. Resistance
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      The use of the word “resistance” in “imaginative resistance” has been criticized for privileging one of the rival explanations of imaginative resistance over the others. Three main rival explanations of imaginative resistance have been provided thus far: the Cantian, the Wontian, and the Eliminativist (Gendler 2006 coined the first two terms; Gendler and Liao 2016 the third one)[^gendler-2006][^gendler-2016][^liao-2016]. Eliminativists deny that the phenomenon exists outside philosophers’ carefully constructed vignettes. The remaining camps, while accepting the existence of the phenomenon, present competing explanations of it. Cantians claim that imaginative resistance occurs when we *can’t* engage in the prompted imaginative activity. Wontians, by contrast take the phenomenon to involve *unwillingness* (rather than inability) to engage on the part of the reader or the audience. Cantians and eliminativists have been critical of the use of the word “resistance” because the term itself seems to privilege the Wontian explanation. Even though some philosophers choose to use “imaginative failure” instead of “imaginative resistance”, the replacement term has not stuck—after all, this entry itself is titled “imaginative resistance” (see Stock 2005, Brock 2012, Stear 2015, Tooming 2018)[^brock-2012][^stear-2015][^stock-2005][^tooming-2018]. With the acknowledgment that “imaginative resistance” is an umbrella term for the phenomenon that some prefer to explain not in terms of *resistance* but *inability*, let’s have a closer look at competing explanations of imaginative resistance.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      ### 2.1 The Sources of Resistance
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      #### 2.1.1 Cantian theories
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Cantians take the puzzles of imaginative resistance to arise due to an inability. A number of different versions of cantian theories have been offered and they differ with respect to what they take to be the cause of the inability. There are two main strands of cantian theories: (1) ones that take the cause of inability to be a violation of some type of dependency or grounding relation (dependency-violation theories), and (2) ones that take the cause to be due to a cognitive mismatch (mismatch theories).
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Dependency-Violation Theories
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      The first formulation of a cantian position appears in Walton 1994. He claims that the reason why imaginers experience difficulties in engaging with a fictional work, say one that involves the proposition, ‘In killing her baby, Giselda did the right thing; after all, it was a girl’ (I will refer to this proposition as *G*) is that they cannot allow the fictional world to differ morally from the actual world (1994: 37). Walton writes,
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      > My best suspicion [as to why we resist allowing fictional worlds to differ from the real world when we do] is that it has something to do with an inability to imagine [certain kinds of dependence] relations being different from how we think they are, perhaps an inability to understand fully what it would be like for them to be different. (Walton 1994: 46; see also Walton 2006: 145)[^walton-1994][^walton-2006]
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      For Walton, moral principles or properties depend or supervene on natural properties or facts (1994: 45). Being morally wrong rests on certain actions such as the deliberate killing of a newborn female child. That’s why we cannot imagine female infanticide being morally right; we cannot comprehend what it even means. The dependency relations obtain in all worlds—in the actual world as well as in any fictional world. We cannot imagine the violation of these dependency relations even just for the sake of a story. That’s why we cannot accept it as fictionally true that female infanticide is morally right.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Walton’s explanation of the cause of the inability in terms of violation of a dependency relation inspired other accounts (Yablo 2002, Weatherson 2004, Stear 2015)[^stear-2015][^weatherson-2004][^yablo-2002]. Stephen Yablo claims that a proposition like *G* triggers imaginative resistance because the concept it expresses is ‘grokking’ or response-enabled (2002: 485). Yablo defines a grokking concept as “one that identifies its object in part by aspects of our experience of it that don’t purport to be representational” (2000 Other Internet Resources). Their extension in a particular context *depends on* how we ourselves react to them, not how we are represented as reacting or ought to react in the fictional world (2002: 485). That’s why the extension of the term “morally right” in the context of *G* does not depend on what the author says but on how it strikes us. In this case, its extension to female infanticide strikes us as false, not fictionally true.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Weatherson, building upon the insights he has drawn from Walton and Yablo, suggests that the dependency relation that we are invited to violate in the cases of imaginative resistance is not supervenience but “virtue”:
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      > *Virtue:* If *p* is the kind of claim that, if true, must be true in virtue of lower-level facts, and if the story is about those lower-level facts, then it must be true in the story that there is some true proposition *r* which is about those lower-level facts such that *p* is true in virtue of *r*. (2004: 18).
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      We cannot accept it as fictionally true that Giselda did the right thing because there are no lower-level facts that are specified by the narrator or imported by us from our world to support it. (For more on export-import relations in understanding our engagement with works of fiction, see section 2.1.2.) The same also holds for Craig in *Death on a Freeway*. The claim that Craig did the right thing in killing Jack and Jill cannot hold in virtue of any of the lower-level facts that are specified in the story, such as the fact that Craig believed that Jack and Jill were the cause of the traffic jam. The higher-level facts that what Giselda or Craig did was wrong are not primitive but they obtain in virtue of lower-level facts, such as facts about the physical features of their actions (2004: 16). The fictionality puzzle arises only when there is a violation of virtue (2004: 24). This violation is responsible for the authorial breakdown. The phenomenological and imaginative puzzles follow from the incoherence created by the violation (2004: 18–20).
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Stear (2015) presents a version of cantianism, but his version does not take the imaginative failure or fictionality failure to result from a violation of some kind of metaphysical or conceptual necessity but rather takes it to result from lack of a proper grounding relation. Taking up on some of the insights provided by the eliminativist theories, he claims that imaginative and fictionality failure arise when a work of fiction embeds a proposition that is inadequately and exhaustively grounded (2015: 12). *G* is inadequately grounded because we are on the lookout for a context that can help us to make sense of the claim. *G* is exhaustively grounded because no additional context can make it right.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      Skow (2022) offers an epistemic solution to the fictionality puzzle, drawing on Matravers’ (2003) “break of trust” account, and positioning it as an alternative to Walton’s and Weatherson’s metaphysical explanations. Skow argues that the resistance we feel when prompted to imagine the Giselda story stems from the evidence presented—“because she was a girl”—which strongly suggests that Giselda did the wrong thing (2022: 473). This undermines our general trust in the author because the overall imagined evidence does not support the belief that Giselda’s actions were justified (2022: 473).
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Mismatch Theories
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Another strand within cantian explanations of the phenomenon of imaginative resistance takes the inability on the side of the imaginers to result from a kind of a cognitive mismatch or conflict. Jonathan M. Weinberg and Aaron Meskin offer a solution to the puzzle of imaginative resistance (or as they prefer to call it “the puzzle of imaginative blockage”) on the basis of an empirically informed cognitive model of imagination developed on the basis of Shaun Nichols’ and Stephen Stich’s work on imagination (Nichols & Stich 2000, 2003a, 2003b; Nichols 2004)[^nichols-2004][^nichols-2000]. On this model, imaginative resistance arises from a conflict between different cognitive systems. As elements of our cognitive architecture, Weinberg and Meskin identify a *belief-box* (containing one’s current beliefs) and an *imagination-box* (containing one’s current imaginings) and the consistency between them is secured by a mechanism called *updater* which updates one’s beliefs in the face of new information. Another mechanism is called *inputter* and it is in charge of putting any content whatsoever in one’s imagination box on the basis of one’s decision to do so. There are also domain-specific processes that interact with both the belief-box and the imagination-box, such as moral judgment system(s). In the case of imaginative resistance, a conflict arises between the inputter and the moral judgment system. Upon encountering the sentence *G*, while the inputter is putting *G* into the imagination-box, the moral judgment system imposes an independent moral judgment ~*G* on the basis of the relevant information provided by the work of fiction. This conflict is noticed by the updater and the newly added *G* is cancelled out. Therefore, *G* cannot be held in the imagination-box.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Tooming (2018), drawing on the insights provided by some of the wontian and eliminativist theories, differentiates between imagination and mere supposition (for an overview of other accounts that make this distinction, see section 2.5 of the entry on [imagination](https://plato.stanford.edu/entries/imagination/#ImagSupp)). On Tooming’s picture, (engaged) imagination, unlike mere supposition, requires mental imagery (2018: 690; see the entry on mental imagery and section 2.3 of the entry on [imagination](https://plato.stanford.edu/entries/imagination/#ImagSupp)). Imagining the truth of a proposition in an engaged manner involves also imagining
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      > a fine-grained sensory array or various arrays that are meant to correspond to the way that the state of affairs represented by the proposition would appear to us. (2018: 691)
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      For instance, when we form a mental image of *Giselda*, we might imagine Giselda’s baby wrapped in a pink blanket being handed to her by the nurse, the look on Giselda’s face while killing her baby, etc. But all these details are regulated by the proposition we are asked to imagine, namely *G*. For a unitary act of engaged imagining, Tooming posits that the mental imaginary and the proposition must match up. In the cases of imaginative resistance, they do not match. We cannot imagine *G* to be true because our mental imagery of *G* does not match the content of *G*. One of the distinguishing features of Tooming’s cantian theory is that it does not presuppose a realist conception of truth in fiction as others do (e.g., the dependency-violation theories of Walton, Weatherson, and Yablo).
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
