    kind: body
    source: |-
      Skow reports that when he first read the book, he did not question the father’s lack of concern, his long absence, or his casual attitude upon finding Sam. He suggests that most readers similarly accept the narrative’s moral stance without resistance. However, Skow argues that if readers were encouraged to reflect more critically, many would likely deem the father’s behavior as poor parenting.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      From this, Skow develops a broader theory (2021: 579): readers resist a story’s moral judgment when (i) the relevance of the judgment’s correctness is salient, and (ii) they perceive the judgment as incorrect. Conversely, readers do not resist when (i) the relevance is not salient, or (ii) they perceive the judgment as correct.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      Skow believes this theory also explains why readers often resist the moral conclusions in the Giselda story, where the question of the protagonist’s actions is almost always salient (2021: 579).
    step1: TBD
    step2: TBD
