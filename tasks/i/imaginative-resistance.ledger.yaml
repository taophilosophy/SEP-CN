      She claims that imaginative failure results from “the contingent incomprehensibility of the relevant proposition” because one cannot think of a context that would make the proposition we are prompted to imagine true (2005: 608). The account has been criticized for disregarding what Weatherson calls the “That’s all” clause that is implicitly embedded in works that trigger resistance (Weatherson 2004: 20)[^weatherson-2004]. Of course, the addition of the life of slavery into the context may affect resistance reactions, but the whole issue is that there is no such elaborate context supplied by the author. As long as no such context is implied or explicitly stated, we should assume that there is nothing more to the *Giselda* story other than that Giselda did the right thing by killing her baby just because she was a girl. The question posed by the phenomenon of imaginative resistance is why we experience imagining *Giselda* in the way that we do given that we know that it is just fiction. (See Nanay 2010, for an explanation of imaginative resistance as involving another type of incomprehensibility. According to Nanay, resistance arises because the narrator appears to the imaginer to be violating a maxim akin to Grice’s Cooperative Principle. This turns the imaginer’s attention away from the fiction and towards its author, hence producing the doubling of the narrator effect discussed by Gendler (Nanay 2010: 591)[^nanay-2010]. For another pragmatic approach, see Voltolini and Barbero 2024.)
    step1: |-
      她主张，想象失败源于“相关命题的偶然不可理解性”，因为人想不出一个能使我们被促发想象的命题成真的语境（2005: 608）。该说明因忽视韦瑟森所称的“到此为止”条款而受到批评——该条款隐含于触发抵抗的作品中（Weatherson 2004: 20）[^weatherson-2004]。当然，把奴役生活加入语境可能影响抵抗反应，但整个问题在于作者并未提供如此精细的语境。只要没有这样的语境被蕴含或明说，我们就应假定《吉塞尔达》故事除了“吉塞尔达仅因婴儿是女孩就杀死她、且做得对”之外别无其他。想象阻力现象提出的问题是：既然我们知道这只是虚构，我们为何会以这种方式经历对《吉塞尔达》的想象？（关于把想象阻力解释为涉及另一类不可理解性，见 Nanay 2010。按纳奈，抵抗产生是因为叙述者在想象者看来违反了类似格赖斯合作原则的准则。这使想象者的注意从虚构转向作者，从而产生根德勒所讨论的叙述者双重化效应（Nanay 2010: 591）[^nanay-2010]。关于另一种语用进路，见 Voltolini and Barbero 2024。）
