      The imaginative resistance debate came about as an attempt to unpack what’s going on in these special, puzzling cases. It is no surprise that Tamar Szabó Gendler referred to the phenomenon as “the puzzle of imaginative resistance” (2000). Since the phenomenon seems to be relatively narrow, the driving force behind scholars’ interest in it has been the possibility of drawing insights from analyses of this relatively insulated phenomenon for broader, hard-to-pin-down issues, such as the ethics-aesthetics relation, the nature of fiction and imagination, the functional role of imagination, and how imagination relates to belief and other states. (See Gendler and Liao 2016: 412–15, for a detailed survey of various accounts that use imaginative resistance related insights for solving a range of different philosophical problems.)[^gendler-2016][^liao-2016] However, as with any new and rapidly growing area of research, there has been much disagreement and confusion among scholars as to the precise nature of the phenomenon. Indeed, scholars disagree on
    step1: |-
      想象阻力之争的出现，正是为了剖析这些特殊而令人困惑的案例究竟怎么回事。塔玛·萨博·根德勒把该现象称为“想象阻力之谜”（2000），并不令人意外。由于该现象似乎相对狭窄，学者兴趣的驱动力，在于可能从这一相对孤立现象的分析中汲取洞见，用于更广泛、更难捉摸的问题，如伦理与美学的关系、虚构与想象的本性、想象的功能角色，以及想象与信念等其他状态的关系。（关于利用想象阻力洞见解决各类哲学问题的各种说明，详参 Gendler and Liao 2016: 412–15。）[^gendler-2016][^liao-2016] 然而，与任何新兴而迅速成长的研究领域一样，学者对该现象的确切本性分歧甚多、混乱不少。实际上，学者在以下问题上并不一致：
