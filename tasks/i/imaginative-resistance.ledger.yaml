      According to conative imagination theories, we cannot desire-like or value-like imagine what we are asked to because we lack the necessary desire or second-order desire to do so (see Currie 2002 and Stokes 2006)[^currie-2002][^currie-2002-2][^stokes-2006].
    step1: |-
      按意欲想象理论，我们无法欲求式或价值式地想象被要求想象的东西，因为我们缺乏这样做所需的欲求或二阶欲求（见 Currie 2002、Stokes 2006）[^currie-2002][^currie-2002-2][^stokes-2006]。
    step2: |-
      按意欲想象理论，我们无法欲求式或价值式地想象被要求想象的东西，因为我们缺乏这样做所需的欲求或二阶欲求（见 Currie 2002、Stokes 2006）[^currie-2002][^currie-2002-2][^stokes-2006]。
