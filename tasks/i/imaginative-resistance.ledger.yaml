      Walton’s explanation of the cause of the inability in terms of violation of a dependency relation inspired other accounts (Yablo 2002, Weatherson 2004, Stear 2015)[^stear-2015][^weatherson-2004][^yablo-2002]. Stephen Yablo claims that a proposition like *G* triggers imaginative resistance because the concept it expresses is ‘grokking’ or response-enabled (2002: 485). Yablo defines a grokking concept as “one that identifies its object in part by aspects of our experience of it that don’t purport to be representational” (2000 Other Internet Resources). Their extension in a particular context *depends on* how we ourselves react to them, not how we are represented as reacting or ought to react in the fictional world (2002: 485). That’s why the extension of the term “morally right” in the context of *G* does not depend on what the author says but on how it strikes us. In this case, its extension to female infanticide strikes us as false, not fictionally true.
    step1: |-
      沃尔顿以违反依赖关系来解释不能的原因，启发了其他说明（Yablo 2002、Weatherson 2004、Stear 2015）[^stear-2015][^weatherson-2004][^yablo-2002]。斯蒂芬·亚布洛主张，像 *G* 这样的命题会触发想象阻力，因为它所表达的概念是“领会式”（grokking）或回应使能的（2002: 485）。亚布洛把领会式概念定义为“部分通过我们对它的经验中并不自称表征性的方面来识别其对象的概念”（2000 其他网络资源）。这类概念在特定语境中的外延*取决于*我们自己如何对之反应，而非我们在虚构世界中被表征为如何反应或应当如何反应（2002: 485）。这就是为什么“道德上正确”一词在 *G* 语境中的外延不取决于作者说什么，而取决于它给我们什么印象。在此情形中，把它应用于杀女婴给我们以虚假的印象，而非虚构中为真。
