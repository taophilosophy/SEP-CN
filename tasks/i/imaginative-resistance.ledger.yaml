      The existence of variation in imaginative resistance reactions led the eliminativists to conclude that imaginative resistance is not a genuine phenomenon. Starting with a second wave of research on imaginative resistance (around 2010), variation is taken to be something that can be accounted for (see Gendler and Liao 2016 for the first and second wave distinction)[^gendler-2016][^liao-2016]. According to some, it should be accounted for by an all-encompassing theory (e.g., Peterson 2019)[^peterson-2019], and according to others it should be addressed by adopting explanatory pluralism (e.g., Liao et al. 2014)[^liao-2014]. This variation-sensitivity has since been one of the general themes in imaginative resistance research and one of the influences responsible for the proliferation of empirical research in the field. (See Black and Barnes 2017 for a psychological study that aims to show that there are different influences on our resistance reactions, such as disgust sensitivity, and Campbell, Kidder, D’Cruz, and Gaesser 2021 for a study that examines whether individual differences in emotion—specifically anxiety and psychopathy—predict varying levels of imaginative resistance.)
    step1: |-
      想象阻力反应的变异存在，使消除论者断定想象阻力并非真正现象。从想象阻力研究的第二波（约 2010 年）开始，变异被视为可以解释的东西（关于第一波与第二波的区分，见 Gendler and Liao 2016）[^gendler-2016][^liao-2016]。一些人认为应由一个包罗万象的理论来解释（如 Peterson 2019）[^peterson-2019]，另一些人则认为应采取解释多元主义（如 Liao et al. 2014）[^liao-2014]。此后，这种变异敏感性一直是想象阻力研究的一般主题之一，也是推动该领域经验研究激增的影响因素之一。（关于旨在表明厌恶敏感性等不同因素影响抵抗反应的心理学研究，见 Black and Barnes 2017；关于考察情绪个体差异——特别是焦虑与精神病态——是否预测不同程度想象阻力的研究，见 Campbell, Kidder, D’Cruz, and Gaesser 2021。）
