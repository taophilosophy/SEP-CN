      Another strand within cantian explanations of the phenomenon of imaginative resistance takes the inability on the side of the imaginers to result from a kind of a cognitive mismatch or conflict. Jonathan M. Weinberg and Aaron Meskin offer a solution to the puzzle of imaginative resistance (or as they prefer to call it “the puzzle of imaginative blockage”) on the basis of an empirically informed cognitive model of imagination developed on the basis of Shaun Nichols’ and Stephen Stich’s work on imagination (Nichols & Stich 2000, 2003a, 2003b; Nichols 2004)[^nichols-2004][^nichols-2000]. On this model, imaginative resistance arises from a conflict between different cognitive systems. As elements of our cognitive architecture, Weinberg and Meskin identify a *belief-box* (containing one’s current beliefs) and an *imagination-box* (containing one’s current imaginings) and the consistency between them is secured by a mechanism called *updater* which updates one’s beliefs in the face of new information. Another mechanism is called *inputter* and it is in charge of putting any content whatsoever in one’s imagination box on the basis of one’s decision to do so. There are also domain-specific processes that interact with both the belief-box and the imagination-box, such as moral judgment system(s). In the case of imaginative resistance, a conflict arises between the inputter and the moral judgment system. Upon encountering the sentence *G*, while the inputter is putting *G* into the imagination-box, the moral judgment system imposes an independent moral judgment ~*G* on the basis of the relevant information provided by the work of fiction. This conflict is noticed by the updater and the newly added *G* is cancelled out. Therefore, *G* cannot be held in the imagination-box.
    step1: |-
      不能论解释想象阻力现象的另一条脉络，把想象者一方的不能归于某种认知错配或冲突。乔纳森·温伯格与亚伦·梅斯金基于肖恩·尼科尔斯与斯蒂芬·斯蒂奇关于想象的工作所发展的、有经验依据的想象认知模型，为想象阻力之谜（或他们更愿称之为“想象阻塞之谜”）提供解决方案（Nichols & Stich 2000, 2003a, 2003b; Nichols 2004）[^nichols-2004][^nichols-2000]。按此模型，想象阻力源于不同认知系统之间的冲突。作为认知架构的要素，温伯格与梅斯金识别出*信念箱*（容纳当前信念）与*想象箱*（容纳当前想象），二者之间的一致性由一个称为*更新器*的机制保障，该机制在新信息面前更新信念。另一机制称为*输入器*，负责依据主体的决定把任何内容放入其想象箱。还有一些领域特异过程与信念箱和想象箱都互动，如道德判断系统。就想象阻力而言，冲突发生于输入器与道德判断系统之间。遇到句子 *G* 时，输入器正把 *G* 放入想象箱，而道德判断系统依据虚构作品提供的相关信息，施加一个独立的道德判断 ~*G*。更新器注意到这一冲突，新加入的 *G* 被取消。因此，*G* 无法留在想象箱中。
