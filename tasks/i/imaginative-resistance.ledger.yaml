      One of the main contributions of eliminativist accounts to discussions regarding the scope of imaginative resistance comes from their insistence on the importance of context. When this insight is combined with Gendler’s (2000) emphasis on the importance of the realist genre, the result has been a proliferation of accounts defending the relevance of genre in determining the quantitative differences between people’s resistance reactions (Weinberg 2008, Nanay 2010, Liao et al. 2014, Liao 2016, and Nolan 2020)[^liao-2016][^liao-2014][^nanay-2010][^nolan-2020][^weinberg-2008]. The main idea is that our reactions to the same moral deviation, let’s say female infanticide, can differ depending on the genre of the work in which they occur. One might take place in the context of an Aztec or a Greek myth, or science-fiction, and the other might take place in the context of a realist fiction. Liao et al. (2014) conducted two empirical studies to put this idea to the test and demonstrate that genre is salient in explaining resistance reactions and variations. On the basis of their Study 1, they concluded that lack of genre competence strongly correlates with comparative difficulties in imagining a morally deviant proposition and accepting it as true. On the basis of their Study 2, they concluded that genre manipulation can lead to variation in the resistance reactions triggered by the same proposition. (See Phelan 2017 in Other Internet Resources for a replication of the studies; see Black et al. 2018 for a study that examines the salience of genre familiarity to resistance reactions.)[^black-2018]
    step1: |-
      消除论说明对想象阻力范围讨论的主要贡献之一，在于坚持语境的重要性。把这一洞见与根德勒（2000）对现实主义体裁重要性的强调结合起来，结果便是大量说明主张体裁在决定人们抵抗反应的数量差异上具有相关性（Weinberg 2008、Nanay 2010、Liao et al. 2014、Liao 2016、Nolan 2020）[^liao-2016][^liao-2014][^nanay-2010][^nolan-2020][^weinberg-2008]。其主要想法是：我们对同一道德偏离（比如说杀女婴）的反应，可能因作品所属体裁而异。一种可能发生在阿兹特克或希腊神话、科幻小说语境中，另一种可能发生在现实主义虚构语境中。廖等人（2014）开展了两项经验研究检验这一想法，表明体裁在解释抵抗反应及其变异上十分显著。基于研究一，他们得出结论：体裁能力缺乏与想象道德偏离命题并接受其为真的相对困难高度相关。基于研究二，他们得出结论：体裁操纵可导致同一命题所触发的抵抗反应发生变化。（关于研究的重复，见“其他网络资源”中的 Phelan 2017；关于考察体裁熟悉度对抵抗反应显著性的研究，见 Black et al. 2018。）[^black-2018]
