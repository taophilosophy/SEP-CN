      根德勒把讨论限于现实主义虚构中出现的想象阻力案例（她称之为“非扭曲虚构”（2000: 77））。读现实主义虚构时，我们觉得可以自由地把真实世界的事实输入虚构世界。实际上，作者预设：与明确陈述的事实一致，读者会引入真实世界事实，填补故事中未说之处。例如，读一部现实主义小说——姑且叫它《医生》——讲旧金山一家医院一群医生交织的生活，我们可能把自己的世界中的各种事实输入故事的虚构世界，如物理定律、北加州天气状况、社会互动的规则与事实等。同时，我们也觉得可以自由地从《医生》输出我们相信不仅在该虚构世界、而且在实际世界也成立的虚构之真。其中一些真理可以像证言知识那样加入我们的知识库。例如，我们可以从虚构中输出医学事实，如格雷夫斯病可表现为甲状腺功能亢进和眼部炎症，或甲状腺全切除后仍有可能再生。我们也可以输出因思考《医生》而得知的事实。我们可以把“职场恋情会变得过于复杂”之类事实加入认知库存，方式如同把建模所得知识加入库存。
