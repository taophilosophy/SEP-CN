      Gendler (2000) develops the first contemporary version of a wontian theory in response to what she perceives as intractable difficulties facing cantian accounts. Focusing on dependency-violation cantian theories, she conceives of these accounts as premised on the unimaginability of impossibilities. The reason we cannot imagine a proposition such as *G* is that it represents a conceptually impossible state of affairs and the conceptual impossibility of that state of affairs renders *G* unimaginable (Gendler 2000: 66 calls this “the impossibility hypothesis”; see Walton 2006: 145 for his rejection of Gendler’s characterization of his account)[^gendler-2000][^walton-2006]. Gendler then argues that impossibilities are indeed imaginable because imagination does not require possibility but rather only conceivability. To demonstrate this, she concocts a story, *The Tower of Goldbach*, where twelve turns out to both be and not be the sum of five and seven (2000: 68, cf. Graham Priest’s (1997) *Sylvan’s Box*, where Sylvan finds an empty box that contains a statue). Even if we are asked to imagine something that is conceptually impossible, we can do so according to Gendler by exploiting our capacity for selective attention. By paying attention to different parts of the story at different times and ignoring others we can ultimately succeed in imagining a conceptual impossibility. Given that we *can* imagine what is conceptually impossible, some further explanation is required as to why we resist imagining *Giselda* or *Death on the Freeway*.
    step1: |-
      根德勒（2000）提出当代第一个不愿论版本，以回应她认为不能论说明所面临的棘手困难。她聚焦于依赖违反式不能论，把这些说明理解为以“不可能之事不可想象”为前提。我们不能想象 *G* 这样的命题，是因为它表征概念上不可能的事态，而该事态的概念不可能性使 *G* 不可想象（Gendler 2000: 66 称之为“不可能性假说”；关于沃尔顿拒绝根德勒对其说明的刻画，见 Walton 2006: 145）[^gendler-2000][^walton-2006]。根德勒随后主张，不可能之事其实可想象，因为想象不要求可能性，只要求可设想性。为证明这一点，她编了一个故事《哥德巴赫之塔》，其中十二既是又不是五与七之和（2000: 68；参 Graham Priest（1997）《西尔万之盒》，西尔万发现一个空盒子，里面却有一尊雕像）。根德勒认为，即便被要求想象概念上不可能之事，我们也能做到，办法是运用选择性注意能力：在不同时刻注意故事的不同部分而忽略其他部分，最终就能成功想象一个概念不可能。既然我们*能*想象概念上不可能之事，那就还需要进一步解释：我们为何抵抗想象*吉塞尔达*或《高速公路上的死亡》？
