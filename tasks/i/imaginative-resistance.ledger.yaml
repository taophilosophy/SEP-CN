      Other wontian accounts emphasize the integral role of real emotions in imaginative resistance responses. Both Niall Connolly (2022) and Nils Franzén (2021), independently, highlight the significance of affective and emotional reactions in our interactions with fictional worlds and point out different mechanisms by which these responses contribute to imaginative resistance. Building on Walton’s conception of participants of make-believe as reflexive props, Connolly argues that while trying to engage with morally deviant scenarios, such as the Giselda story, we use ourselves and our real-world feelings as props in the imaginative process (2022: 109–111; see also Walton 1990: 213–220 for reflexive props)[^walton-1990]. Our actual anti-femicide feelings hinder our acceptance of *G* (2022: 111). Echoing Yablo’s solution, Franzén’s sensibilist approach posits that our real-world sentiments continue to govern the truth of evaluative statements even within fictional contexts, leading to resistance when those fictional evaluations diverge from our actual emotions (2021: 160).
    step1: |-
      其他不愿论说明强调真实情感在想象阻力反应中的整合作用。尼尔·康诺利（2022）与尼尔斯·弗兰岑（2021）各自独立地强调情感与情绪反应在我们与虚构世界互动中的重要性，并指出这些反应促成想象阻力的不同机制。康诺利依托沃尔顿把假装参与者视为反身道具的构想，主张在试图投入吉塞尔达故事这类道德偏离场景时，我们把自身及真实世界感受当作想象过程中的道具（2022: 109–111；关于反身道具另见 Walton 1990: 213–220）[^walton-1990]。我们实际的反对杀女婴的情感阻碍我们接受 *G*（2022: 111）。弗兰岑的感性论进路呼应亚布洛的解决方案，主张我们的真实世界情感即便在虚构语境中也继续支配评价性陈述之真，当虚构评价偏离我们实际情感时便产生抵抗（2021: 160）。
