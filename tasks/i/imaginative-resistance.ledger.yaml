      Bradford Skow (2021) argues that readers resist engaging with a story’s moral judgment only when the question of that judgment’s correctness is salient. He illustrates this idea with Jean Craighead George’s 1959 novel *My Side of the Mountain*. In the novel, fourteen-year-old Sam Gribley runs away from his New York City home to live alone in the Catskill Mountains. There, he survives by foraging for edible plants, trapping animals for food, and creating a home inside a hollowed-out hemlock tree. After several months, Sam’s father finally comes looking for him. Surprisingly, his father is impressed with Sam’s new lifestyle, shows no anger or sadness over his son’s departure, and returns to New York the next day. Sam remains isolated from his family for another six months.
    step1: TBD
    step2: TBD
