    source: |-
      The phenomenon of “imaginative resistance” refers to psychological difficulties otherwise competent imaginers experience when engaging in particular imaginative activities prompted by works of fiction. Usually, we seem to have no trouble engaging with time-travel or space-exploration stories, superhero movies, or talking non-human animal fables. At other times, we do not seem to be able to play along that easily; for instance, when we are presented with an alternative *Macbeth* where
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      > the facts of [Duncan’s] murder remain as they are in fact presented in the play, but it is prescribed in this alternate fiction that this was unfortunate only for having interfered with Macbeth’s sleep. (Moran 1994: 95)[^moran-1994]
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      The imaginative resistance debate came about as an attempt to unpack what’s going on in these special, puzzling cases. It is no surprise that Tamar Szabó Gendler referred to the phenomenon as “the puzzle of imaginative resistance” (2000). Since the phenomenon seems to be relatively narrow, the driving force behind scholars’ interest in it has been the possibility of drawing insights from analyses of this relatively insulated phenomenon for broader, hard-to-pin-down issues, such as the ethics-aesthetics relation, the nature of fiction and imagination, the functional role of imagination, and how imagination relates to belief and other states. (See Gendler and Liao 2016: 412–15, for a detailed survey of various accounts that use imaginative resistance related insights for solving a range of different philosophical problems.)[^gendler-2016][^liao-2016] However, as with any new and rapidly growing area of research, there has been much disagreement and confusion among scholars as to the precise nature of the phenomenon. Indeed, scholars disagree on
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      - whether such a phenomenon exists;
      - whether it is really puzzling;
      - whether it is puzzling for various reasons, and if so, whether these reasons are reducible to others;
      - whether we resist imagining only moral deviations or whether the phenomenon is broader than that;
      - whether the resistance to engaging in the imaginative activity is a result of the subject’s inability to engage in the prompted activity or the subject’s unwillingness to do so; and
      - whether imaginative resistance cases put constraints on our cognitive imagination or conative imagination, or whether they have nothing to do with imagination at all.
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      As Kendall Walton puts it, the only thing that has been uncontested is the word “of” in “the puzzle of imaginative resistance” (2006: 146).
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      This entry is an attempt to get clear on the central issues surrounding imaginative resistance and examines the proposed solutions to the puzzle(s).
    step1: TBD
    step2: TBD
  - id: 7
