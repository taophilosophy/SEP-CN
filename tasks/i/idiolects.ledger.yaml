      While this captures the sense in which Chomsky is taking an internalist (and individualist) approach to the study of language, it does not yet reveal where the notion of a language, internalized or otherwise, sits within the approach, or why any appeal to language*s* (with “language” used as a count noun rather than a mass noun) is needed at all. Chomsky’s discussion of language acquisition can provide us with a good illustration of this further step. It will also bring out a revealing contrast with Lewis’s approach (see 2.1).[^note-4]
