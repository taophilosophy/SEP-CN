      A special issue of the journal *Inquiry* (see Begby & Ramberg 2016)[^begby-2016] contains a handful of useful discussions of Davidson’s influential 1986 article. These include Stainton 2016, which rejects what the author describes as Davidson’s case against public languages, adding to parallel criticisms of Chomskian arguments to the same end in Stainton 2011. For work on the pragmatics/semantics boundary, much of it raising similar issues, see Stanley 2000, Carston 2002, Borg 2004, Recanati 2004, Cappelen and Lepore 2005, and Szabó 2005. In earlier work on Davidson’s paper, his anti-conventionalism is discussed by Hacking 1986, Dummett 1986, Pietroski 1994, and Reimer 2004. Hacking addresses the extent to which Davidson’s conclusion undermines his earlier philosophy of language. Dummett attempts to show that the notion of a prior theory presupposes the notion of a linguistic community, and hence of a shared language.
    step1: |-
      期刊 *Inquiry* 的一个专号（见 Begby & Ramberg 2016）[^begby-2016] 收有几篇对戴维森 1986 年那篇影响深远的文章的有益讨论。其中包括 Stainton 2016，它拒斥作者所称的戴维森针对公共语言的论证，并补充了 Stainton 2011 中对乔姆斯基式同目的论证的平行批评。关于语用学/语义学边界的研究，其中许多提出类似问题，见 Stanley 2000, Carston 2002, Borg 2004, Recanati 2004, Cappelen and Lepore 2005, 与 Szabó 2005。在关于戴维森论文的较早研究中，其反惯例主义由 Hacking 1986, Dummett 1986, Pietroski 1994, 与 Reimer 2004 讨论。Hacking 讨论戴维森结论在多大程度上削弱其较早的语言哲学。Dummett 试图表明，先在理论概念预设语言共同体概念，因而预设共享语言概念。
    step2: |-
      *Inquiry* 曾出专号（见 Begby & Ramberg 2016）[^begby-2016]，收有几篇讨论戴维森 1986 年名文的有用之文，包括 Stainton 2016——它拒斥作者所称戴维森对公共语言的论证，并以 Stainton 2011 中对乔姆斯基式同类论证的平行批评相补充。关于语用／语义边界的研究多涉类似问题，见 Stanley 2000；Carston 2002；Borg 2004；Recanati 2004；Cappelen and Lepore 2005；Szabó 2005。较早讨论戴文反惯例主义的有 Hacking 1986、Dummett 1986、Pietroski 1994、Reimer 2004：Hacking 论戴维森结论在多大程度上动摇其早期语言哲学；Dummett 则力图表明，“先在理论”概念预设了语言共同体概念，因而预设了共享语言概念。
