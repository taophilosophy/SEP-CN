      Many critics have focused on an unacknowledged commitment to externalism that they think is implicit in Chomsky’s terminology. The charge can be made using any of the different phrasings he has used to express his internalism, including *competence*, *knowledge*, and *representation*. For the first: competence implies competence *in* something. For that something to be defined in terms of the language faculty itself, there would be no such thing as incompetence, making a nonsense of talk of competence. Error would be impossible (see Barber 2001)[^barber-2001]. For the second: knowledge implies something known—an external language or some subset of its properties. Chomsky has described these criticisms as arising from a misinterpretation of his view, and said that he was using competence and knowledge in a technical sense rather than in full accordance with ordinary usage. He has occasionally suggested “cognize” as an alternative term of art to prevent confusion, where to cognize an I-language is for it to be represented in one’s language faculty.[^note-5] Recent iterations of the criticism have thus tended to focus on representation. It seems that there can be no representing without something’s being represented—something external to the thing doing the representating, and so external to the language faculty or even the individual. Chomsky’s response has been to say that he is not using representation in a relation sense, *representation* *of* (1995a: 53 and in Antony and Hornstein 2003: 276–7)[^antony-2003].
    step1: |-
      许多批评者聚焦于他们认为暗含在乔姆斯基术语中的、未被承认的外在主义承诺。这一指责可以用他表达内在主义所用的任何一种说法来提出，包括能力、知识与表征。就第一种说：能力意味着对某物的能力。若该物本身由语言官能来界定，就不会有“无能”这回事，谈能力便成无意义之谈。错误将不可能（见 Barber 2001）[^barber-2001]。就第二种说：知识意味着有被知道的东西——一种外部语言或其属性的某个子集。乔姆斯基把这些批评描述为对其观点的误解，并说他是在技术意义上使用能力与知识，而非完全依照日常用法。他偶尔建议用“认知”（cognize）作为替代性术语，以防混淆；所谓认知一种 I-语言，就是它被表征于某人的语言官能中。[^note-5] 晚近的批评迭代因此倾向于聚焦于表征。似乎没有表征便没有所表征者——某物外在于作表征者，因而外在于语言官能乃至个体。乔姆斯基的回应是：他并不是在关系意义上使用表征，即“关于……的表征”（1995a: 53，及 Antony and Hornstein 2003: 276–7）[^antony-2003]。
    step2: |-
      许多批评者指其术语暗含一种未加承认的外在主义承诺。这一责难可从其表述内在主义的任一用语入手：能力、知识、表征。先看“能力”：能力总是对某物的能力。若该物由语言官能本身界定，便无所谓“无能”，谈能力即成空话；错误也将不可能（见 Barber 2001）[^barber-2001]。再看“知识”：知识总有所知——某种外部语言或其属性的子集。乔姆斯基称这些批评系误解其说：他是在专门意义上用“能力”“知识”，并非全然依照日常用法。他曾偶尔提出改用“认知”（cognize）这一术语以免混淆：认知一种 I-语言，即它被表征于某人的语言官能中。[^note-5] 晚近批评遂多聚焦“表征”：似乎无表征便无所表征者——总须有某物外在于作表征者，故也外在于语言官能乃至个体。乔姆斯基回应说：他并非在关系意义上使用“表征”，即不说“关于……的表征”（1995a: 53；Antony and Hornstein 2003: 276–7）[^antony-2003]。
