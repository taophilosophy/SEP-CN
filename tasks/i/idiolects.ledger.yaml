  - id: 17
    kind: body
    source: |-
      The problem with these and similar judgements (Crystal 2007 recounts their history in the case of English)[^crystal-2007] is not that they are obnoxiously conservative, a tool for social exclusion. Often they don’t play this role. Some dictionaries now include red as a possible meaning of “livid”, for example, but this, too, is a normative stance and it is normativity, not conservativism in particular, that is incompatible with a scientific stance. Even liberal views on linguistic acceptability (e.g., that it is okay to end sentences with a preposition) are prescriptions. In so far as such normativity is unavoidable in the determination of the properties of English and other languages in the folk ontology, these languages have no place in science (save as a fictional object for sociological investigation—because belief in the fiction has social effects—or as a useful shorthand).
    step1: |-
      这些及类似判断的问题（Crystal 2007 叙述了它们在英语中的历史）[^crystal-2007] 不在于它们令人反感地保守，是社会排斥的工具。它们往往并不起这种作用。例如，现在有些词典把红色列为“livid”的可能意义，但这也是一种规范立场，而与科学立场不相容的是规范性，而非特指保守主义。即便对语言可接受性的自由主义观点（例如句子可以介词结尾）也是规定。既然在确定英语及民间本体论中其他语言的属性时，这种规范性不可避免，这些语言在科学中就没有位置（除非作为社会学研究的虚构对象——因为对这种虚构的信念有社会效应——或作为方便的简称）。
    step2: |-
      这类判断（其英语史见 Crystal 2007）[^crystal-2007] 的毛病，不在于它们顽固保守、是社会排斥的工具——它们往往并不起这种作用。比如，如今有些词典也把“红色”列为“livid”的可能义项，但这同样是规范立场；而与科学立场不相容的正是规范性，不特指保守主义。即便对语言可接受性的开明主张（如允许句子以介词收尾）也仍是规定。既然确定英语以及民间本体论中其他语言的属性时规范性无法避免，这些语言便无科学地位（除非作为社会学研究的虚构对象——相信该虚构会产生社会效应——或作为方便简称）。
