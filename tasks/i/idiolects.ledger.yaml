      (a) At the most general level, members of any population often want the others to think and act in a particular way. This requires them to recognize each other’s intentions, share thoughts, and to act accordingly. Members of the population must therefore find a way to display their intentions, etc., and, in equal measure, to recognize the intentions, etc., of others. Using the same language (i.e., the same function from sentences to meanings) to convey their mental states offers an excellent way of meeting this need. It gives members of the population a way to “control others’ beliefs and actions to some extent by means of sounds and marks” (Lewis 1975 [1983: 166])[^lewis-1975]. Lewis explains how they do this—and in particular how they settle on the same language—by invoking his general notion of a convention.
    step1: |-
      (a) 在最一般的层面上，任何群体的成员常常希望别人以特定方式思考和行动。这要求他们认识彼此的意图、共享思想并据此行动。因此，群体成员必须找到一种方式展示自己的意图等，并以同等程度识别他人的意图等。使用同一种语言（即同一个从句子到意义的函数）来传达心理状态，为满足这一需要提供了极佳方式。它使群体成员能够“借助声音与记号在一定程度上控制他人的信念与行动”（Lewis 1975 [1983: 166]）[^lewis-1975]。刘易斯通过援引他关于惯例的一般概念，说明他们如何做到这一点——尤其是如何选定同一种语言。
    step2: |-
      (a) 最一般地说，任何群体的成员都常望他人按特定方式思考、行动。这就要彼此认出意图、共享想法并照此行事。于是成员们须设法表明自己的意图等等，也同样须认出他人的意图等等。以同一语言（即同一句子—意义函数）传达心理状态，正是满足此需的良方：它让成员能够“借声音与记号在一定程度上控制他人的信念与行动”（Lewis 1975 [1983: 166]）[^lewis-1975]。刘易斯借其一般惯例概念，说明他们如何办到——尤其是如何选定同一语言。
