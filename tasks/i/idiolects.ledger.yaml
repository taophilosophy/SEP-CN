      Criticisms of Chomsky’s internalism, and so by implication his notion of an I-language, stretch back over half a century, as do his responses. Three collections (George 1989; McGilvray 1999; Antony and Hornstein 2003)[^antony-2003][^george-1989][^mcgilvray-1999] between them contain a full array of philosophical commentary. In this and the next section we focus on concerns that have particular currency.
    step1: |-
      对乔姆斯基内在主义的批评——因而隐含地也针对他的 I-语言概念——可追溯到半个多世纪之前，他的回应亦然。三部文集（George 1989；McGilvray 1999；Antony and Hornstein 2003）[^antony-2003][^george-1989][^mcgilvray-1999] 合起来包含全套哲学评论。本节与下一节聚焦于当下尤为切题的关切。
    step2: |-
      对乔姆斯基内在主义（从而隐含地对其 I-语言概念）的批评可回溯半个多世纪，其回应亦然。三部文集（George 1989；McGilvray 1999；Antony and Hornstein 2003）[^antony-2003][^george-1989][^mcgilvray-1999] 合起来收有相当齐全的哲学评论。本节与下节只谈当下最切题者。
