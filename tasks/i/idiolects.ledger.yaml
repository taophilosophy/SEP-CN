      The “I-” in “I-language” is short, not for “idiolectal”, but for a cluster words that connote an idiolectal approach and coincidentally begin with the same letter, especially “internal” and “individualistic”.[^note-3] “E-language” is used critically by Chomsky to refer to those things, whatever they are, that are the target of study for those who take languages and their properties to be external to the mind. This includes many philosophers of language. Chomsky’s case for introducing and using the notion of an I-language is, in the end, indistinguishable from his case for a cognitivist approach to the study of language as a natural phenomenon. And his case against E-languages is that there is no scientifically coherent project to which they belong as posits.
    step1: |-
      “I-语言”中的“I-”不是“个人语的”（idiolectal）的缩写，而是一组词的缩写；这些词暗示一种个人语进路，并碰巧以同一字母开头，尤其是“内在的”（internal）与“个体主义的”（individualistic）。[^note-3] “E-语言”被乔姆斯基批判性地用来指那些东西——无论它们是什么——即把语言及其属性视为外在于心灵的人的研究对象。这包括许多语言哲学家。乔姆斯基引入并使用 I-语言概念的理由，最终与他就把语言作为自然现象进行认知主义研究的主张无法区分。而他反对 E-语言的理由是：不存在任何科学上融贯的、以 E-语言为设定项的研究纲领。
    step2: |-
      “I-语言”的“I-”，并非“个人语”之缩写，而是几个既暗示个人语进路、又恰巧同首字母的词之缩写，尤指“内在的”（internal）与“个体主义的”（individualistic）。[^note-3] 乔姆斯基用“E-语言”作批判性称谓，指那些把语言及其属性视为心灵之外者所研究的对象——无论那是什么，其中不乏语言哲学家。他为引入并使用 I-语言概念所给的理据，归根到底与他把语言当作自然现象作认知主义研究的理据无异；他反对 E-语言的理据则是：并无任何科学上融贯的研究纲领以 E-语言为设定。
