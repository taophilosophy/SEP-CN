      As theoretical posits, I-languages earn their keep through their role in this kind of enquiry. By treating states on the path to normal mature linguistic competence in humans as representational states, states of knowledge (where what is represented or known is an I-language), important empirical generalizations can be formulated and assessed. One would not even have to sit at the nativist end of the spectrum in the debate on language acquisition to accept this way of framing the question. Moreover, this conception of the brain as a representational, information processing system, or as an integrated bundle of such systems, has application beyond the specific instance of language, developmental or otherwise. Chomsky’s case against behaviorism in the study of language (1959), and his alternative vision of how it might be studied, was pivotal in the cognitive revolution across psychology and affiliated disciplines (see e.g., Glass, Holyoak, & Santa 1979; Marr 1982; Pylyshyn 1984; Fodor 1987)[^fodor-1987][^marr-1982][^pylyshyn-1984].
    step1: |-
      作为理论设定项，I-语言通过其在这类探究中的作用而证明自己的价值。通过把通向人类正常成熟语言能力之路上的状态当作表征状态、知识状态（其中所表征或所知的是 I-语言），重要的经验概括得以表述与评估。人们甚至不必站在语言习得之争的天赋论一端，才能接受这种提问方式。此外，这种把大脑视为表征性的信息处理系统、或视为这类系统的整合束的构想，其应用超出语言这一特定实例，无论发展与否。乔姆斯基反对行为主义语言研究的论证（1959），以及他关于如何研究语言的替代性构想，在跨心理学与相关学科的认知革命中起了枢纽作用（例如见 Glass, Holyoak, & Santa 1979；Marr 1982；Pylyshyn 1984；Fodor 1987）[^fodor-1987][^marr-1982][^pylyshyn-1984]。
    step2: |-
      作为理论设定，I-语言借其在此类探究中的角色而立足。把通向人类正常成熟语言能力之路上的状态视为表征状态、知识状态（所表征或所知者为 I-语言），便可提出并评估重要的经验概括。人不必站到语言习得之争的天赋论一端，也可接受这种提法。再者，把大脑看作表征性信息处理系统、或此类系统的整合束，这一构想的适用面超出语言一例（无论是否涉发展）。乔姆斯基反对行为主义语言研究的论证（1959）及其关于语言研究应如何进行的替代构想，在横跨心理学与相关学科的认知革命中居于枢纽（例见 Glass, Holyoak, & Santa 1979；Marr 1982；Pylyshyn 1984；Fodor 1987）[^fodor-1987][^marr-1982][^pylyshyn-1984]。
