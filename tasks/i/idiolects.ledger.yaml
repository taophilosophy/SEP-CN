      For the coordination problem within *P* to be solved by using *L*, all members of *P* must be in a position to determine the meaning of all the sentences of *L*. In other words, it must be that members of *P* have a way to identify the function that, for any given sentence, will deliver the corresponding meaning. Given the limitations of speakers, both physical and cognitive, there must be a finite and simple way to do this. The compositionality of *L* can help explain how this is possible (see entry on compositionality). Roughly put, for *L* to be compositional is for the meaning of all complex expressions *e*₁…*eₙ* of *L* to be fully determined by the meaning of their parts and by the way such parts are composed. Thus, the functions that map sentences into their meanings will take into account the meaning of their parts and the way they are combined.
    step1: |-
      要使 *P* 内的协调问题通过使用 *L* 得到解决，*P* 的所有成员都必须有能力确定 *L* 中所有句子的意义。换言之，*P* 的成员必须有一种办法识别这样的函数：对任何给定句子，它将给出相应意义。鉴于说话者在身体与认知上的局限，必须有一种有限而简单的办法做到这一点。*L* 的组合性可以帮助解释这如何可能（见组合性词条）。粗略地说，*L* 具有组合性，就是 *L* 中所有复杂表达式 *e*₁…*e*ₙ 的意义完全由各部分的意义以及这些部分的组合方式决定。于是，把句子映射到其意义的函数将考虑其各部分的意义及其结合方式。
    step2: |-
