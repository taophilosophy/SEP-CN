      Lewis, we saw, thinks a language is an arbitrary pairing of sentences and meanings. This arbitrariness is overcome through the co-ordination embodied in a conventional practice, an E-language in Chomsky’s terminology. Chomsky does not deny the existence of some linguistic arbitrariness, manifest in linguistic diversity but he holds that this diversity is limited by human psychology (1995a: 15f). On a “learning” model of language development, which Chomsky rejects, infants are little scientists observing and inferring the linguistic conventions prevailing among adult users (e.g., to be truthful and trusting in some *L*). But these learners could not possibly rule out all but one of the languages that are logically compatible with the data. Even if the child was exceptionally smart, the evidence available in the typical linguistic environment is insufficiently rich—there is a “poverty of stimulus”. If the information in a child’s environment is too poor to account for developments in her competence, anterior knowledge must be providing her with mental stirrups (see Laurence and Margolis 2001 and the entry on innateness and language)[^laurence-2001].
    step1: |-
      我们看到，刘易斯认为语言是句子与意义的任意配对。这种任意性通过体现于惯例实践中的协调而被克服，用乔姆斯基的术语说，这是一种 E-语言。乔姆斯基并不否认某种语言任意性的存在，它体现在语言多样性中；但他认为这种多样性受人类心理限制（1995a: 15f）。在乔姆斯基所拒斥的“学习”式语言发展模型中，婴儿是小小科学家，观察并推断成人使用者中流行的语言惯例（例如在某个 *L* 中真诚且信任）。但这些学习者不可能把与数据逻辑相容的语言中除一种以外的全部排除掉。即便孩子格外聪明，典型语言环境中所提供的证据也不够丰富——存在“刺激贫乏”。如果孩子环境中的信息太贫瘠，不足以说明其能力的发展，那么必有前先知识为她提供心智上的马镫（见 Laurence and Margolis 2001 以及天赋与语言词条）[^laurence-2001]。
    step2: |-
      如前所见，刘易斯把语言看作句子与意义的任意配对，其任意性靠惯例实践中的协调来克服——用乔姆斯基的术语，这是一种 E-语言。乔姆斯基不否认存在某种语言任意性（体现于语言多样性），但认为多样性受人类心理限制（1995a: 15f）。在他所拒斥的“学习”模型中，婴儿像小科学家，观察并推断成人中流行的语言惯例（如在某个 *L* 中真诚并信任）。可这类学习者无法在与数据逻辑相容的诸语言中只留一种。即便孩子格外聪慧，典型语言环境提供的证据仍不够丰富——“刺激贫乏”。若环境信息贫弱到不足以解释其能力发展，便须有前先知识为她提供心智上的马镫（见 Laurence and Margolis 2001 及“天赋与语言”词条）[^laurence-2001]。
