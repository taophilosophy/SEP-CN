      以上刻画了乔姆斯基以内在主义（与个体主义）进路研究语言的意义，但尚未揭示“语言”概念（无论内化与否）在这一进路中的位置，也未说明为何需要诉诸语言们（把“语言”用作可数名词而非物质名词）。乔姆斯基关于语言习得的讨论可以为此提供良好例证，也会显出与刘易斯进路的鲜明对比（见 2.1）。[^note-4]
