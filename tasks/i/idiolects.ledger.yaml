      One apparent corollary of this is significant for those many philosophers of language who have agonized over how to construct a theory of meaning for English. A common thought is that such a theory ought to take the form of a statement of the referential properties of the expressions of English—a link between words and objects in the world—from which the truth conditions of all English sentences can be derived (e.g., Davidson 1970, Montague 1970; see the entries for theories of meaning and reference)[^davidson-1970][^montague-1970]. Echoing P.F. Strawson (1950), Chomsky suggests that referring is something people do. They use words in doing so, it is true, but referring is not something that words somehow do by themselves, through some fantastical medium, English (2000: 40–1). If referential properties of expressions amount to anything, rather than being relational properties between expressions and external objects (or “word-world” relations) they should be thought of as embodying instructions to the individual’s conceptual system, one of the performance systems with which the language faculty interfaces (an idea explored in Jackendoff 2002)[^jackendoff-2002]. If Chomsky is right, a great deal of the philosophy of language is either radically off beam or needs considerable re-interpretation (see Hornstein 1989, Ludlow 2003, Pietroski 2003, Stainton 2006)[^hornstein-1989][^ludlow-2003][^pietroski-2003][^stainton-2006].
    step1: |-
      一个明显的推论对那许多为如何为英语构造意义理论而苦恼的语言哲学家意义重大。一个常见想法是：这样的理论应当采取陈述英语表达式指称属性的形式——词与世界中的对象之间的联系——由此可导出全部英语句子的真值条件（例如 Davidson 1970, Montague 1970；见意义理论与指称诸词条）[^davidson-1970][^montague-1970]。乔姆斯基呼应 P. F. 斯特劳森（1950），建议指称是人所做的事。他们做此事时使用词语，诚然，但指称并不是词语凭某种奇幻媒介“英语”自行做出的事（2000: 40–1）。如果表达式的指称属性毕竟意味着什么，那么与其把它们当作表达式与外部对象之间的关系属性（或“词—世界”关系），不如把它们设想为对个体概念系统的指令，而概念系统是与语言官能接口的表现系统之一（这一想法见 Jackendoff 2002 的探索）[^jackendoff-2002]。若乔姆斯基正确，语言哲学的一大部分要么严重偏离，要么需要大幅重新解释（见 Hornstein 1989, Ludlow 2003, Pietroski 2003, Stainton 2006）[^hornstein-1989][^ludlow-2003][^pietroski-2003][^stainton-2006]。
