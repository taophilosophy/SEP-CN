      Chomsky does not deny that language (in the mass-noun sense) is at least in part “a social product” (1986: 18). He cites Putnam’s famous “division of linguistic labor” hypothesis (Putnam 1975)[^putnam-1975], for example, arguing that, suitably described, the phenomenon of semantic deference is compatible with his internalized perspective. The E-languages (“E-” for “externalized”) of which he is skeptical are languages in the count-noun sense. These objects have properties that are independent of the mind/brain, or of the language faculty in particular. He offers a number of examples (1986: 19): Bloomfield’s view that a language is a totality of utterances that can be made in a speech community; Saussure’s notion of a *langue* (an arbitrary association of sounds with concepts); and Lewis’s pairing of sentences and meanings, the actual language of a population when the regularities described earlier hold. Chomsky also includes any system of actions or behaviours, where this system is individualist but is the product of a myriad of performance systems interacting with the language faculty and each other. A grammar, on the E-language approach, purports to describe these mind-external (or at least language-faculty external) entities.
    step1: |-
      乔姆斯基并不否认（物质名词意义上的）语言至少部分上是“社会产物”（1986: 18）。例如他援引帕特南著名的“语言劳动分工”假说（Putnam 1975）[^putnam-1975]，论证经适当描述，语义恭顺现象与他的内化视角相容。他所怀疑的 E-语言（“E-”指“外化的”）是可数名词意义上的语言。这些对象具有独立于心灵/大脑、或特别独立于语言官能的属性。他举了几个例子（1986: 19）：布龙菲尔德关于语言是在言语共同体中可说出的一切话语之总体的观点；索绪尔的 *langue*（声音与概念的任意联系）概念；以及刘易斯的句子与意义配对——当先前提到的规则性成立时，它是一个群体的实际语言。乔姆斯基还把任何行动或行为系统包括在内，其中该系统是个体主义的，但是众多表现系统与语言官能及彼此交互作用的产物。按 E-语言进路，语法意图描述的就是这些心灵外部（或至少语言官能外部）的实体。
    step2: |-
      乔姆斯基并不否认（物质名词意义上的）语言至少部分是“社会产物”（1986: 18）。他援引帕特南著名的“语言劳动分工”假说（Putnam 1975）[^putnam-1975]，主张语义恭顺现象经适当描述，与他的内化视角相容。他所质疑的 E-语言（“E-”即“外化的”）是可数名词意义上的语言，它们具有独立于心灵／大脑、尤其独立于语言官能的属性。他举数例（1986: 19）：布龙菲尔德认为语言是言语共同体中可能说出的一切话语的总和；索绪尔的 *langue*（声音与概念的任意联结）；以及刘易斯的句子—意义配对（先前提到的规则性成立时，它即一个群体的实际语言）。乔姆斯基还把任何行动或行为系统计入其中——该系统虽属个体主义，却是众多表现系统与语言官能及彼此交互作用的产物。按 E-语言进路，语法所要描述的正是这些心灵之外（至少是语言官能之外）的实体。
