      Linguistic precriptivism, the view that speakers should follow a given set of rules (prescriptions) specifying how they are to use a language *L*, is commonly a motivation behind the folk ontology. On this view there are proper, rule-following, ways of using *L*, and improper ones that fail to follow the said prescriptions. Linguistic prescriptivism is supported by arguments having to do with social and political concerns, such as the homogeneity and unity of a given population into a common social behavioral practice. Linguistic descriptivism opposes prescriptivism in claiming that a proper account of *L*-use should be limited to describing how speakers in fact use *L*. Linguistic descriptivism is regarded as offering a more evolutionarily, and historically, accurate account of language change.
    step1: |-
      语言规定主义——即认为说话者应遵循一组给定的规则（规定）来使用语言 *L* 的观点——通常是民间本体论背后的动机。按此观点，使用 *L* 有正当的、遵循规则的方式，也有不当的、不遵循上述规定的方式。语言规定主义得到关乎社会与政治关切的论证支持，例如使某个人群同质、统一为共同的社会行为实践。语言描述主义反对规定主义，主张对 *L* 之使用的恰当说明应限于描述说话者事实上如何使用 *L*。语言描述主义被认为对语言变化提供了在演化与历史方面更准确的说明。
    step2: |-
      民间本体论背后常见的动机是语言规定主义：说话者应遵循一套给定的规则（规定）来使用语言 *L*。按此说，使用 *L* 有合乎规则的正用法，也有不合规定的误用法。支持规定主义的论证多涉社会政治关切，例如要使某个人群同质并统一于共同的社会行为实践。语言描述主义则反对规定主义，主张对 *L* 用法的恰当说明只应描述说话者事实上如何使用 *L*；一般认为，描述主义对语言演变给出了在演化史与历史两方面更准确的说明。
