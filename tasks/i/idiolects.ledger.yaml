      This is the context in which introducing talk of I-languages can be useful, according to Chomsky (1986: 22–3; 2000: 4–5). Language acquisition can be thought of as a development through states of the brain from *S*₀ through intermediate states into a relatively stable mature state, *S_{M}*. *S*₀ is the initial state common to all humans, idealizing away from individual linguistic impairments and the like. Subsequent states arise through exposure to a particular linguistic environment. Nothing said so far requires that these states be thought of as representational states we could call “knowing a language”. But if we describe being-in-state *S_{L}* as knowing a language *L*, knowledge that a linguist might in principle make explicit in a theory of *L*, language acquisition can be described—usefully—as a matter of children evolving through various stages of knowledge *en* *route* to acquiring adult competence. This description is useful because the empiricist/nativist debate can now be couched as a debate over what linguistic information must already be known by someone in *S*₀ if information supplied by the linguistic environment is to culminate in knowledge of the mature language *M*. Empiricists claim that nothing much is needed, that *S*₀ is a “blank slate” to be filled in using environmental data. Nativists claim that plenty of information must already be provided, in the form of innate knowledge of a language dubbed Universal Grammar (UG) by Chomsky. We each come predisposed to acquire only certain languages, the humanly possible ones that can grow out of UG.
    step1: |-
      按乔姆斯基（1986: 22–3；2000: 4–5），正是在这一语境中引入 I-语言的说法可能有用。语言习得可以被设想为大脑状态从 *S*₀ 经中间状态发展到一个相对稳定的成熟状态 *S_{M}* 的过程。*S*₀ 是所有人共有的初始状态，把个体语言障碍等理想化掉。随后的状态通过接触特定语言环境而产生。迄今所说的一切都不要求把这些状态设想为我们可称为“知道一种语言”的表征状态。但如果我们把处于状态 *S_{L}* 描述为知道语言 *L*——一种语言学家原则上可以在关于 *L* 的理论中明述的知识——语言习得便可以有用地被描述为孩子经由各知识阶段、在获得成人能力途中演进的过程。这一描述有用，是因为经验论/天赋论之争现在可以被重新表述为：若语言环境提供的信息要最终成就成熟语言 *M* 的知识，处于 *S*₀ 的人必须已经知道哪些语言信息？经验论者主张所需不多，*S*₀ 是一块待用环境数据填充的“白板”。天赋论者主张必须已提供大量信息，其形式是对一种被乔姆斯基称为普遍语法（UG）的语言的天赋知识。我们每个人都预先倾向于只习得某些语言，即能从 UG 生长出来的人类可能语言。
    step2: |-
      乔姆斯基认为（1986: 22–3；2000: 4–5），正是在此语境下，谈 I-语言才有用。语言习得可视为大脑状态由 *S*₀ 经诸中间状态发展为较稳定的成熟状态 *S_{M}*：*S*₀ 为全人类共有的初始状态（把个体语言障碍等理想化掉），其后各状态由接触特定语言环境而生。以上所说并不要求把这些状态视为可称“知道一种语言”的表征状态。但若把处于 *S_{L}* 说成知道语言 *L*——语言学家原则上可在 *L* 之理论中明述的知识——则语言习得便可有益地描述为孩子沿各知识阶段、在获得成人能力途中演进。此描述之益在于：经验论与天赋论之争可改述为“处于 *S*₀ 者须预先知道哪些语言信息，环境所供信息方能最终成就成熟语言 *M* 之知识”。经验论者说所需无几，*S*₀ 只是待环境数据填充的“白板”；天赋论者说须预先供给大量信息，即对一种被乔姆斯基名为普遍语法（UG）的语言的天赋知识。我们每个人都预先只倾向于习得某些语言——能从 UG 生长出的人类可能语言。
