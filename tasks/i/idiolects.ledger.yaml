      In “A Nice Derangement of Epitaphs”, Donald Davidson argues that languages, if they are “anything like what many philosophers and linguists have supposed”, do not exist (1986: 446). He does not list the philosophers and linguists he has in mind, but somewhere near the centre of the cloud of positions he is criticizing is Lewis’s conventionalist theory.[^note-1] More broadly, he rejects the notion of socially established links between expressions and meanings, shared participation in which enables a community to communicate. Davidson’s article is jargon-rich and so his argument is tricky to unpack. In this statement of it, we begin by explaining his formulation of the view he rejects, then outline his case against the view so formulated.[^note-2]
    step1: |-
      在《墓志铭的巧妙错乱》一文中，唐纳德·戴维森论证说，语言——如果它们“大致像许多哲学家与语言学家所设想的那样”——并不存在（1986: 446）。他没有列出他所想的哲学家与语言学家，但在他所批评的观点云团的某处中心附近，正是刘易斯的惯例主义理论。[^note-1] 更广泛地说，他拒斥表达式与意义之间社会性确立的联系这一观念，认为共享参与这种联系才能使一个共同体交流。戴维森的文章术语密集，因此其论证不易拆解。在本文的陈述中，我们先解释他对所拒斥观点的表述，再概述他针对如此表述的观点的论证。[^note-2]
    step2: |-
      唐纳德·戴维森在《墓志铭的巧妙错乱》中主张：语言若“大致如许多哲学家与语言学家所设想的那样”，便不存在（1986: 446）。他未点名所指，但在他所批评的那团立场中，靠近中心者正是刘易斯的惯例论。[^note-1] 更广地说，他不承认表达式与意义之间存在社会确立的联结、并靠共享参与此联结而使共同体得以交流。戴文术语密集，论证不易拆解。下文先说明他所拒斥的观点如何表述，再略述他针对该表述的论证。[^note-2]
