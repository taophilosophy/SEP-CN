      由此，刘易斯式回应可以循两种策略之一进行。一种是承认该说明不扩展到马拉克普罗普情形，而把词语误用当作特例，一种非纯语言现象的实例，因而必然涉及一般智力。这一策略的成败取决于这些情形可推广到什么程度。
    step2: |-
      至此，刘易斯派可循两策之一回应。其一，承认该说明不覆盖词语误用，而视之为特例——一种非纯语言现象，因而必然牵涉一般智力。此策成败，要看这类情形能推广到何种地步。
