      An I-language, then, is something that is represented in the language faculty of an (idealized) individual at a particular stage of development. But it is not anything beyond the language faculty. Statements about I-languages being represented in the brain are “statements about the structures of the brain formulated at a certain level of abstraction from mechanisms” (1986: 33). In other words, to talk of the language faculty as representing some piece of information is simply one way among others of giving an abstract description of the language faculty, a human “organ” (Chomsky 1975: 10; Anderson & Lightfoot 2000)[^anderson-2000][^chomsky-1975]. Another way might be to describe it in chemical terms, but the representationalist description is—for reasons just sketched—rather more helpful than a chemical one within the context of explaining language acquisition. A grammar for an individual, a linguistic theory in other words, is an abstract statement of this I-language, but what it purports to describe is their language faculty, not something external to it.
    step1: |-
      那么，I-语言就是某个（理想化的）个体在特定发展阶段的语言官能中被表征的东西。但它并不超出语言官能之外。关于 I-语言在大脑中被表征的陈述，是“关于大脑结构在某种程度上脱离机制的抽象层次上所作的陈述”（1986: 33）。换言之，把语言官能说成表征某条信息，只是对语言官能这一人类“器官”给出抽象描述的诸多方式之一（Chomsky 1975: 10；Anderson & Lightfoot 2000）[^anderson-2000][^chomsky-1975]。另一种方式可能是用化学术语描述它，但表征主义描述——由于刚才勾勒的理由——在解释语言习得的语境中比化学描述更有帮助。个体的语法，换言之一种语言学理论，是对这一 I-语言的抽象陈述，但它所意图描述的是他们的语言官能，而非其外部的什么东西。
    step2: |-
      可见 I-语言是某个（经过理想化的）个体在特定发展阶段的语言官能中被表征者，但并非语言官能之外的东西。说 I-语言“在大脑中被表征”，是“关于大脑结构、在某种脱离机制的抽象层次上所作的陈述”（1986: 33）。换言之，说语言官能表征某条信息，只是对语言官能这一人类“器官”作抽象描述的诸法之一（Chomsky 1975: 10；Anderson & Lightfoot 2000）[^anderson-2000][^chomsky-1975]；也可用化学术语描述它，但按上述理由，在解释语言习得的语境中，表征主义描述比化学描述更有用。个体的语法——即一种语言学理论——是对该 I-语言的抽象陈述；它所要描述的却是此人的语言官能，而非官能之外的什么。
