      This second strategy might itself be developed in two distinct ways, in an effort to show its compatibility with the broad sweep of Lewis’s theory. First, it could be admitted that there is no prior *L* with respect to which the conventions of truthfulness and trust both hold. The conventions hold, however, with respect to their *passing* theories. Participants arrive at these passing theories from their (potentially divergent) prior theories plus some general intelligence. Compositionality, moreover, also plays an essential role in the extraction of passing theories from prior theories, with the conventions of truthfulness and trust being observed in the resulting passing *L*. However, the principle of compositionality would have to be weakened so as to not consider the strictly linguistic process it describes as fully determining meaning, thus leaving room for extra elements to take part. Alternatively, there could be truthfulness and trust in prior *L* if Lewis’s fine-grained individuation of languages is rejected. On this second version of the theory, one and the same *L* may sometimes have different sentence-to-meaning mappings; alternatively, it could be claimed that the conventions hold with respect to different common *L*s or a set of sufficiently similar such languages.
    step1: |-
      第二种策略本身可以朝两个不同方向发展，以显示其与刘易斯理论大局的相容性。第一，可以承认不存在先在 *L*，使得真诚与信任两种惯例都相对于它成立。但惯例相对于他们的当下理论成立。参与者从他们（可能分歧的）先在理论加上某种一般智力，达成这些当下理论。此外，组合性在从先在理论提取当下理论中也起本质作用，真诚与信任惯例在所得的当下 *L* 中得到遵守。然而，组合性原则将必须被弱化，以便不把它所描述的严格语言过程看作完全决定意义，从而为额外要素留出参与余地。另一种做法是，如果拒斥刘易斯对语言的精细个体化，则可以有对先在 *L* 的真诚与信任。按这一理论版本，同一个 *L* 有时可以有不同的句子到意义映射；或者可以主张，惯例相对于不同的共同 *L* 或一组足够相似的此类语言成立。
    step2: |-
      第二策略又可分两路发展，以见其与刘易斯理论大体相容。其一，承认不存在使真诚与信任两项惯例同时成立的先在 *L*；但惯例相对于双方的“当下”理论成立。参与者由（可能分歧的）先在理论加若干一般智力，得出当下理论；组合性在从先在理论得出当下理论时仍不可少，而真诚与信任惯例则在所得的当下 *L* 中遵守。不过，组合性原则须予弱化，不再把其所描述的纯语言过程视为完全决定意义，从而给额外要素留出余地。其二，若放弃刘易斯对语言的精细个体化，则可说真诚与信任相对于先在 *L* 成立：同一个 *L* 有时可有不同的句子—意义映射；或可说惯例相对于若干不同的共同 *L*、或一组足够相似的 *L* 而成立。
