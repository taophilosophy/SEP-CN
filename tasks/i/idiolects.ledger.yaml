      The notion of representation is central to a good deal of cognitive science and is a topic that has preoccupied many philosophers of mind and language who share Chomsky’s naturalistic bent. Many of the latter have been surprised and puzzled by his rejection of both the relational notion of representation (where the relation is between vehicles of representation in the mind/brain, and the things they represent) and attempts to define this relation in naturalistic language (see causal theories of mental content, intentionality, and mental representation). Georges Rey, for example, sees the intentionality, the “aboutness”, implicit in the notion of representation as essential to the computational-representational theory of mind—precisely the theory that he and others think Chomsky’s work has helped to inspire and shape (Rey 2003a,b & 2005)[^rey-2003a]. Rey concludes that Chomsky is mistaken about the status his own theory, and offers instead what he thinks is a more charitable interpretation: that the representations are of something, but typically inaccurate and harmlessly so.
    step1: |-
      表征概念对认知科学的一大部分至关重要，也是许多与乔姆斯基一样持自然主义倾向的心灵与语言哲学家孜孜讨论的题目。其中许多人对他既拒斥关系性表征概念（其关系在心灵/大脑中的表征载体与它们所表征之物之间），又拒斥以自然主义语言界定此关系的尝试，感到惊讶与困惑（见心理内容因果理论、意向性、心理表征诸词条）。例如，乔治·雷伊认为，表征概念中暗含的意向性即“关于性”，对计算—表征心灵理论至关重要——而雷伊等人认为，正是乔姆斯基的工作帮助启发并塑造了这一理论（Rey 2003a,b & 2005）[^rey-2003a]。雷伊的结论是：乔姆斯基对自己理论地位的看法有误，他转而提出他认为更同情的解释：表征是关于某物的，但通常不准确，且无伤大雅。
    step2: |-
      表征概念是认知科学一大部分的支柱，也是许多与乔姆斯基同样倾向自然主义的心灵与语言哲学家长期关注的题目。其中不少人为他既拒斥关系性表征（关系项是心灵／大脑中的表征载体与其所表征之物），又拒斥以自然主义语言界定此关系，而感到诧异不解（见“心理内容的因果理论”“意向性”“心理表征”诸词条）。例如乔治·雷伊认为，表征概念所含的意向性即“关于性”，对计算—表征心灵理论至为关键——而他与许多人认为，这一理论正受乔姆斯基工作启发与塑造（Rey 2003a,b & 2005）[^rey-2003a]。雷伊断言乔姆斯基误判了自己理论的地位，并给出他认为更宽容的解读：表征确有所指，只是通常不准确，且无伤大雅。
