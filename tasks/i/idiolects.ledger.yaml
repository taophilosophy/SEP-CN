      Because there is considerable variety here in the underlying conceptions of languages, Chomsky’s criticisms can seem sweeping, but the underlying thought is that, because E-languages are less “real” than I-languages, “the concept [of an E-language] appears to play no role in the theory of language” (1986: 26). The argument for this negative conclusion is not so different from the positive argument for an I-language perspective outlined in 3.1.1. Linguistic behaviour is the product of both the language faculty on the one hand and external influences—performance systems in the mind/brain of the individual and social factors—on the other. At issue is not whether anything at all can ever be said, usefully, about these “downstream” effects, but whether the notion of an E-language has any pivotal explanatory role to play in saying it (save as a useful shorthand). Nothing much is added to the account of language learning in 3.1.1, for example, by describing it as development towards the learning of an externalistically specified social language, as opposed to some specific mature state, S_{M}, of an individual.
    step1: |-
      因为这里对语言的基本构想差异甚大，乔姆斯基的批评可能显得笼统，但其底层想法是：由于 E-语言不如 I-语言“实在”，“E-语言这一概念在语言理论中似乎不起作用”（1986: 26）。支持这一否定结论的论证，与 3.1.1 所勾勒的肯定 I-语言视角的论证并无很大不同。语言行为既是一方面语言官能、另一方面外部影响——个体心灵/大脑中的表现系统与社会因素——的产物。问题不在于对这些“下游”效应是否根本能说任何有用的话，而在于 E-语言概念在说这些话时是否有任何枢纽性的解释作用（除非作为有用的简称）。例如，把 3.1.1 中的语言学习说明描述为朝着习得一种以外在方式规定的社会语言发展，而不是朝着个体某个特定成熟状态 S_{M} 发展，并未给该说明增添多少东西。
