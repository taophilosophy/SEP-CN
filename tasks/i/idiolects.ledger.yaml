      With appropriate extrapolation, then, Lewis’s main tenets may be perfectly compatible with Davidson’s own description of these supposedly troublesome cases. Even in cases of malapropism, speaker and hearer are trying to solve a coordination problem by using a common language *L* (i.e., a common passing *L*, a common open or dynamic *L*, or a common set of sufficiently similar *L*s) in a way that observes the conventions of truthfulness and trust. Of course, Lewis must include some form of general explanatory reasoning, thereby contradicting his apparent assumption that successful uses of *L* are fully systematic (or compositional). Yet it is worth considering how damaging this would be for Lewis’s account. It seems clear that something like Lewis’s theory (including some appropriately weakened version of his compositionality assumption, such as that developed in García-Ramírez 2019)[^garcía-ramírez-2019], will be needed.
    step1: |-
      于是，经适当外推，刘易斯的主要信条可能与戴维森本人对这些所谓麻烦情形的描述完全相容。即便在词语误用情形中，说话者与听者也都在试图通过使用共同语言 *L*（即共同的当下 *L*、共同的开放或动态 *L*，或一组足够相似的共同 *L*）来解决协调问题，其方式遵守真诚与信任的惯例。当然，刘易斯必须纳入某种一般解释性推理，从而与他显然的假定——*L* 的成功使用完全系统（或组合）——相矛盾。然而，值得考虑这对刘易斯说明有多大损害。看来很清楚，某种类似刘易斯的理论（包括其组合性假定的某种适当弱化版本，如 García-Ramírez 2019 所发展的）将是必需的。
    step2: |-
      可见经适当外推，刘易斯的主要主张与戴维森对这些“麻烦”情形本身的描述或可完全相容。即便词语误用之时，双方也都试图借共同语言 *L*（共同的当下 *L*、共同的开放或动态 *L*，或一组足够相似的共同 *L*）解决协调问题，并遵守真诚与信任惯例。当然，刘易斯须纳入某种一般解释推理，这便与他显然的假定——*L* 的成功使用完全系统（或组合）——相冲突。但这究竟有多伤及刘易斯之说，值得掂量：看来很清楚，某种刘易斯式理论（连同其组合性假定的某种适当弱化，如 García-Ramírez 2019 所论）[^garcía-ramírez-2019]仍属必需。
