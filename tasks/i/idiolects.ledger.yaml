      The theory of conventions used in Lewis 1975 [1983] is developed at length in his earlier book (1969). The resulting theory of language is elaborated by Bennett 1976 and criticized in Burge 1975 and Laurence 1996. Wiggins 1997 and Millikan 2005, like Lewis, see languages as essentially social in nature (Chomsky replies to a version of the latter in Antony and Hornstein 2003)[^antony-2003].
    step1: |-
      刘易斯 1975 [1983] 所用的惯例理论，在其较早的著作（1969）中得到详尽发展。由此产生的语言理论由 Bennett 1976 加以阐发，并受到 Burge 1975 与 Laurence 1996 的批评。Wiggins 1997 与 Millikan 2005 同刘易斯一样，认为语言本质上是社会性的（乔姆斯基在 Antony and Hornstein 2003 中回应了后者一个版本）[^antony-2003]。
    step2: |-
      刘易斯 1975 [1983] 所用的惯例理论，在其 1969 年的著作中有详尽展开；由此得出的语言理论经 Bennett 1976 阐发，并遭 Burge 1975、Laurence 1996 批评。Wiggins 1997 与 Millikan 2005 同刘易斯一样，主张语言本质上是社会性的（乔姆斯基在 Antony and Hornstein 2003 中回应了后者某一版本）[^antony-2003]。
