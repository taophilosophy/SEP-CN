      在较早的阐述（3.1.1）中，我们试图把握乔姆斯基非关系性的表征概念：把某物描述为表征一种 I-语言，只是抽象地描述它的一种方式。约翰·柯林斯为“可以有没有所表征者的表征”这一提法做了更多工作（2014）。他说，采用“二元表征说法”有助于我们“表述关于一元表征状态的概括”。所表征者不过是语法学家试图对心灵/大脑所能处于或经过的非关系状态进行分类的副产品。援引它们并不产生任何本体论承诺，认定所描述的语言外在于心灵/大脑。
