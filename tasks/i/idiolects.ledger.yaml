      ### 3.3 Second Response to the I-language Perspective: Psycholinguistics
    step1: |-
      ### 3.3 对 I-语言视角的第二种回应：心理语言学
    step2: |-
      ### 3.3 对 I-语言视角的第二种回应：心理语言学
  - id: 101
    kind: body
    source: |-
      More recently, a whole field of scientific research, psycholinguistics, has been precisely dedicated to studying external, anti-individualistic, mind-independent properties of language, massively advancing our understanding of language development in the process (see Hoff and Shatz 2007)[^hoff-2007]. The guiding assumption within this field is that external factors, such as the child’s social and physical environment, can play a substantial role in determining both the child’s linguistic competence and the vocabulary and syntax of the acquired language. On this view, such external factors supply most, if not all, of the relevant stimuli for language acquisition, contrary to Chomsky’s central poverty of stimulus argument for I-languages.
    step1: |-
      更晚近，整个科学研究领域即心理语言学，恰恰致力于研究语言的外部的、反个体主义的、独立于心灵的属性，在此过程中大大推进了我们对语言发展的理解（见 Hoff and Shatz 2007）[^hoff-2007]。这一领域的指导假定是：外部因素，如孩子的社会与物理环境，可以在决定孩子的语言能力以及所习得语言的词汇与句法方面起实质作用。按此观点，这类外部因素提供了语言习得的大部乃至全部相关刺激，与乔姆斯基支持 I-语言的核心刺激贫乏论证相反。
    step2: |-
      晚近，心理语言学这一整片研究领域恰恰致力于语言的外部的、反个体主义的、独立于心灵的属性，并在此过程中极大推进了对语言发展的理解（见 Hoff and Shatz 2007）[^hoff-2007]。该领域的指导假定是：外部因素（如孩子的社会与物理环境）可实质地决定孩子的语言能力，以及所习得语言的词汇与句法。按此说，这些外部因素提供了语言习得的大部乃至全部相关刺激——与乔姆斯基为 I-语言所提的核心“刺激贫乏”论证针锋相对。
  - id: 102
    kind: body
    source: |-
      Several different inquires have benefited from psycholinguistic studies of overt linguistic behavior. These include questions about the relative autonomy of distinct areas of linguistic knowledge, such as the question: are syntax, semantics and pragmatics independent from each other, or do they rather support each other? (see Gleitman, Cassidy, et al. 2005; Gleitman 1990; Naigles and Swensen 2007; and Diesendruck 2007)[^diesendruck-2007][^gleitman-1990][^naigles-2007]; and about the role of the child in the process of language acquisition: is the child a passive subject, or an active participant within her linguistic community (see Shatz 1987, 1994; Shafer and Garrido-Nag 2007; and Poulin-Dubois and Graham 2007)[^poulin-dubois-2007][^shafer-2007][^shatz-1987]?
    step1: |-
      若干不同探究已受益于对公开语言行为的心理语言学研究。这些探究包括关于语言知识不同领域相对自主性的问题，例如：句法、语义与语用彼此独立，还是相互支撑？（见 Gleitman, Cassidy, et al. 2005；Gleitman 1990；Naigles and Swensen 2007；Diesendruck 2007）[^diesendruck-2007][^gleitman-1990][^naigles-2007]；以及关于孩子在语言习得过程中的角色：孩子是被动的对象，还是其语言共同体中的主动参与者（见 Shatz 1987, 1994；Shafer and Garrido-Nag 2007；Poulin-Dubois and Graham 2007）[^poulin-dubois-2007][^shafer-2007][^shatz-1987]？
    step2: |-
      若干探究已从对公开语言行为的心理语言学研究获益。其一是语言知识各领域的相对自主性：句法、语义、语用彼此独立，还是相互支撑？（见 Gleitman, Cassidy, et al. 2005；Gleitman 1990；Naigles and Swensen 2007；Diesendruck 2007）[^diesendruck-2007][^gleitman-1990][^naigles-2007] 其二是孩子在习得中的角色：孩子是被动的对象，还是其语言共同体中的主动参与者（见 Shatz 1987, 1994；Shafer and Garrido-Nag 2007；Poulin-Dubois and Graham 2007）[^poulin-dubois-2007][^shafer-2007][^shatz-1987]？
  - id: 103
    kind: body
    source: |-
      We saw (in section 3.1.1 and 3.1.2) that Chomsky’s case for I-languages and against E-languages is heavily entwined with the poverty of stimulus assumption. This is used to defend the claim that human languages are little more than modifications of UG, and that the process of language acquisition and development is the process of such modifications. But studies have shown that social input, which children may pick up from and rely on, is rich both in content and structure (see Baldwin and Meyer 2007)[^baldwin-2007]. In child-directed speech, adults use words in a way that makes it easier for children to identify the relevant information (see Brent and Siskind 2001; Akhtar, Dunham, and Dunham 1991)[^brent-2001], suggesting that social input is highly relevant to the development of semantic knowledge. Even if we limit the UG hypothesis to a claim about syntax there are empirical challenges. According to this more limited reading, the acquisition of syntactic process is “seen to rely most heavily on the operation of innate structural principles” (Baldwin and Meyer 2007: 95)[^baldwin-2007]. Social input, on this view, plays a mere triggering role. Further studies have shown this hypothesis to be controversial. Alternative, socio-pragmatic, accounts have shown that children can learn syntax from adult language use (see Tomasello 2003, 2004)[^tomasello-2003]. Children’s domain general abilities of statistical analysis, and pattern and intention recognition, are believed to assist the child in identifying and acquiring syntactic structure from the social linguistic input they receive (see Saffran, Aslin, and Newport 1996; Gentner, Holyoak, and Kokinov 2001). In general, the empirical evidence obtained by psycholinguistic studies strongly suggests that language acquisition and development is much more than just a process of UG modifications by means of mind/brain maturation.
    step1: |-
      我们已看到（3.1.1 与 3.1.2 节），乔姆斯基支持 I-语言、反对 E-语言的论证与刺激贫乏假定紧密交织。该假定被用来捍卫“人类语言不过是 UG 的微小改动，语言习得与发展的过程就是这种改动的过程”这一主张。但研究显示，孩子可能吸收并依赖的社会输入，在内容与结构上都很丰富（见 Baldwin and Meyer 2007）[^baldwin-2007]。在儿童导向言语中，成人用词的方式使孩子更容易识别相关信息（见 Brent and Siskind 2001；Akhtar, Dunham, and Dunham 1991）[^brent-2001]，这表明社会输入与语义知识的发展高度相关。即便把 UG 假说限于关于句法的主张，仍有经验挑战。按这一更有限的解读，句法过程的习得“被视为最倚重天赋结构原则的运作”（Baldwin and Meyer 2007: 95）[^baldwin-2007]。按此观点，社会输入只起触发作用。进一步研究显示这一假说有争议。替代性的社会—语用说明显示，孩子可以从成人语言使用中学到句法（见 Tomasello 2003, 2004）[^tomasello-2003]。孩子的一般领域能力——统计分析、模式与意图识别——被认为有助于孩子从所接受的社会语言输入中识别并习得句法结构（见 Saffran, Aslin, and Newport 1996；Gentner, Holyoak, and Kokinov 2001）。总的来说，心理语言学研究获得的经验证据强烈表明，语言习得与发展远不止是 UG 经心灵/大脑成熟而发生改动过程。
    step2: |-
      前已见（3.1.1、3.1.2 节），乔姆斯基支持 I-语言、反对 E-语言的理据与“刺激贫乏”假定紧密缠结。该假定用来捍卫：人类语言不过是 UG 的细微变体，习得与发展即是此变体过程。但研究表明，孩子可能吸收并倚赖的社会输入，无论内容还是结构都颇为丰富（见 Baldwin and Meyer 2007）[^baldwin-2007]。在儿童指向言语中，成人用词方式使孩子更易识别相关信息（见 Brent and Siskind 2001；Akhtar, Dunham, and Dunham 1991）[^brent-2001]，可见社会输入与语义知识发展关系密切。即便把 UG 假说限于句法，仍有经验难题：按此较窄读法，句法过程的习得“被视为最倚重天赋结构原则的运作”（Baldwin and Meyer 2007: 95）[^baldwin-2007]，社会输入只起触发作用。后续研究显示此假说仍有争议：社会—语用的替代说明表明，孩子能从成人用语中学到句法（见 Tomasello 2003, 2004）[^tomasello-2003]。孩子的一般性领域能力——统计分析、模式识别与意图识别——被认为有助于其从所接受的社会语言输入中辨识并习得句法结构（见 Saffran, Aslin, and Newport 1996；Gentner, Holyoak, and Kokinov 2001）。总体上，心理语言学所得经验证据强烈提示：语言习得与发展远不只是 UG 经心—脑成熟而发生变异的过程。
  - id: 104
    kind: body
    source: |-
      However these debates evolve, two things seem clear. First, the external, anti-individualistic, mind-independent properties of language, including overt linguistic behavior, are apt for proper scientific investigation. Exactly how much of a threat this is to Chomsky’s view is a matter for debate, since as we saw (in 3.1.2) he insists he is not denying that language is at least partly a social product; but the claims made on the back of these results certainly seem to run contrary to the thrust of his internalism. And, second, against Chomsky’s skepticism, there are good reasons to develop such research into external influences, as it may prove to be central for a proper understanding of the semantics, and even the grammar and syntax, of human language and its acquisition.
    step1: |-
      无论这些争论如何演变，两件事似乎清楚。第一，语言的外部、反个体主义、独立于心灵的属性，包括公开语言行为，适合进行恰当的科学探究。这对乔姆斯基观点究竟是多大的威胁尚有争论，因为如我们所见（3.1.2），他坚称自己并不否认语言至少部分是社会产物；但基于这些结果所提出的主张，显然似乎与他的内在主义要旨相悖。第二，与乔姆斯基的怀疑相反，有充分理由把这类关于外部影响的研究发展下去，因为它可能被证明对恰当理解人类语言的语义、乃至语法与句法及其习得至为关键。
    step2: |-
      无论争论如何演变，两点似可肯定。其一，语言的外部、反个体主义、独立于心灵的属性（包括公开语言行为）适宜作严格的科学研究。这对乔姆斯基之说构成多大威胁尚有争议——如 3.1.2 所见，他坚称并不否认语言至少部分是社会产物；但据这些结果所提的主张，显然与他的内在主义要旨相反。其二，与乔姆斯基的怀疑相反，发展此类关于外部影响的研究大有理由，因为它可能对恰当理解人类语言的语义、乃至语法、句法及其习得，至为关键。
