      While it may be socio-politically debatable whether linguistic prescriptivism is correct, it seems less contentious that it has no place within the idiolectal perspective. Recall Chomsky’s view that *L* is whatever grammar is represented within an individual’s brain via the language faculty. Whatever principles are thus represented, they will not be determined by socio-political prescriptions on how best to unify the behavior of a given community. Given their intrinsic, biological nature, idiolects cannot be affected by extrinsic, social-political prescriptions.
    step1: |-
      语言规定主义是否正确或许在社会政治上有争议，但它在个人语视角中没有位置，这一点似乎争议较小。回想乔姆斯基的观点：*L* 就是通过语言官能在个体大脑中被表征的任何语法。无论由此表征的是什么原则，它们都不会由关于如何最好地统一某个共同体行为的社会政治规定来决定。鉴于其内在的、生物的本性，个人语不可能受外在的社会政治规定影响。
    step2: |-
      规定主义在社会政治上是否正确，或有争议；但它在个人语视角中无立足之地，这似乎较少争议。回想乔姆斯基：*L* 即个体大脑中经语言官能得到表征的那套语法。无论被表征的是什么原则，都不会由“如何最好地统一某共同体行为”的社会政治规定来决定。个人语既属内在的生物学事实，便不受外在的社会政治规定左右。
