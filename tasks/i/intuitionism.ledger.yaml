    source: |-
      The existence of the natural numbers is given by the first act of intuitionism, that is by the perception of the movement of time and the falling apart of a life moment into two distinct things: what was, 1, and what is together with what was, 2, and from there to 3, 4, … In contrast to classical mathematics, in intuitionism all infinity is considered to be potential infinity. In particular this is the case for the infinity of the natural numbers. Therefore statements that quantify over this set have to be treated with caution. On the other hand, the principle of induction is fully acceptable from an intuitionistic point of view.
    step1: |-
      自然数的存在由直觉主义的第一幕给出，即由对时间运动的知觉、以及一个生命瞬间分裂为两个不同之物给出：曾在者，1；当下与曾在者，2；由此到 3、4、…… 与经典数学相反，在直觉主义中一切无限都被视为潜无限。自然数的无限尤其如此。因此，对该集合作量化的陈述须谨慎对待。另一方面，归纳原则从直觉主义观点看完全可以接受。
    step2: |-
      自然数之存在由第一幕给出，即由对时间运动的知觉、以及一个生命瞬间的分裂给出：曾在者，1；当下连同曾在者，2；由此而有 3、4、…… 与经典数学不同，直觉主义视一切无限为潜无限，自然数之无限尤然。故对该集合作量化的陈述须审慎处理。另一方面，归纳原则在直觉主义观点下完全可以接受。
  - id: 43
    kind: body
    source: |-
      Because of the finiteness of a natural number in contrast to, for example, a real number, many arithmetical statements of a finite nature that are true in classical mathematics are so in intuitionism as well. For example, in intuitionism every natural number has a prime factorization; there exist computably enumerable sets that are not computable; $(A \vee \neg A)$ holds for all quantifier free statements $A$. For more complex statements, such as van der Waerden’s theorem or Kruskal’s theorem, intuitionistic validity is not so straightforward. In fact, the intuitionistic proofs of both statements are complex and deviate from the classical proofs (Coquand 1995, Veldman 2004)[^coquand-1995][^veldman-2004].
    step1: |-
      由于自然数（与实数等不同）具有有限性，许多在经典数学中为真的有限性算术陈述在直觉主义中也为真。例如，在直觉主义中每个自然数都有素因数分解；存在不可计算的可计算枚举集；对所有无量词陈述 $A$，$(A \vee \neg A)$ 成立。对更复杂的陈述，如范德瓦尔登定理或克鲁斯卡尔定理，直觉主义有效性就不那么直接了。事实上，这两个陈述的直觉主义证明都很复杂，且偏离经典证明（Coquand 1995, Veldman 2004）[^coquand-1995][^veldman-2004]。
    step2: |-
      自然数有限——实数则不然——故许多具有有限性质的算术陈述，在经典数学中为真者，在直觉主义中亦真。例如：直觉主义中每个自然数皆有素因数分解；存在可计算枚举而不可计算的集合；对一切无量词陈述 $A$，$(A \vee \neg A)$ 成立。至于更复杂的陈述，如范德瓦尔登定理、克鲁斯卡尔定理，其直觉主义有效性便不那么直截；实则二者的直觉主义证明皆繁复，且与经典证明有别（Coquand 1995, Veldman 2004）[^coquand-1995][^veldman-2004]。
