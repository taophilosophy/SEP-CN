      棒原则与连续性公理一节提到的邻域函数之间有密切联系。设 $\mathcal{IK}$ 为归纳定义的邻域函数类，它由所有非零常序列 $\lambda m.n+1$ 组成，并且：若 $f(0)=0$ 且对所有 $x$ 有 $\lambda m.f(x\cdot m)\in \mathcal{IK}$，则 $f \in \mathcal{IK}$。陈述 $\mathcal{K}=\mathcal{IK}$，即邻域函数可以归纳生成这一陈述，等价于 **BI_{D}**。
