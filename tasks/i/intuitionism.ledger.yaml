      ## 1 布劳威尔
  - id: 7
    kind: body
    source: |-
      Luitzen Egbertus Jan Brouwer was born in Overschie, the Netherlands. He studied mathematics and physics at the University of Amsterdam, where he obtained his PhD in 1907. In 1909 he became a lecturer at the same university, where he was appointed full professor in 1912, a position he held until his retirement in 1951. Brouwer was a brilliant mathematician who did ground-breaking work in topology and became famous already at a young age. All his life he was an independent mind who pursued the things he believed in with ardent vigor, which brought him in conflict with many a colleague, most notably with David Hilbert. He had admirers as well, and in his house “the hut” in Blaricum he welcomed many well-known mathematicians of his time. To the end of his life he became more isolated, but his belief in the truth of his philosophy never wavered. He died in a car accident at the age of 85 in Blaricum, seven years after the death of his wife Lize Brouwer.
    step1: |-
      吕伊岑·埃赫贝图斯·扬·布劳威尔（Luitzen Egbertus Jan Brouwer）出生于荷兰的奥弗斯希。他在阿姆斯特丹大学学习数学与物理，1907 年在该校获博士学位。1909 年他成为该校讲师，1912 年被任命为正教授，直至 1951 年退休。布劳威尔是一位杰出的数学家，在拓扑学上做了开创性工作，年纪轻轻便已成名。他终生思想独立，以炽热的精力追求自己所信之事，因此与不少同僚冲突，最著名的是与大卫·希尔伯特。他也有仰慕者，在布拉里屈姆的住所“小屋”里，他接待过当时许多知名数学家。晚年他日趋孤立，但对自身哲学之真的信念从未动摇。他在布拉里屈姆因车祸去世，享年 85 岁，时在其妻莉泽·布劳威尔（Lize Brouwer）去世七年后。
    step2: |-
      吕伊岑·埃赫贝图斯·扬·布劳威尔生于荷兰奥弗斯希，在阿姆斯特丹大学攻读数学与物理，1907 年获博士学位；1909 年任该校讲师，1912 年升任正教授，直至 1951 年退休。他是一位才华出众的数学家，在拓扑学上作出开创性贡献，年少即已成名。他终生独立思考，以炽热劲头追求所信，故与不少同僚龃龉，其中尤以与大卫·希尔伯特之争最为著名。他也拥有仰慕者：在布拉里屈姆那所名为“小屋”的宅中，他款待过同时代许多知名数学家。晚年他愈见孤寂，然对自身哲学之真的信念未尝动摇。他在布拉里屈姆死于车祸，享年 85 岁，距其妻莉泽·布劳威尔离世七年。
  - id: 8
    kind: body
    source: |-
      At the age of 24 Brouwer wrote the book *Life, Art and Mysticism* (Brouwer 1905)[^brouwer-1905], whose solipsistic content foreshadows his philosophy of mathematics. In his dissertation the foundations of intuitionism are formulated for the first time, although not yet under that name and not in their final form. In the first years after his dissertation most of Brouwer’s scientific life was devoted to topology, an area in which he is still known for his theory of dimension and his fixed point theorem. This work is part of classical mathematics; according to Brouwer’s later view, his fixed point theorem does not hold, although an analogue cast in terms of approximations can be proved to hold according to his principles.
    step1: |-
      24 岁时，布劳威尔写了《生命、艺术与神秘主义》一书（Brouwer 1905）[^brouwer-1905]，其唯我论内容预示了他的数学哲学。在他的博士论文中，直觉主义的基础首次得到表述，尽管当时尚未用这个名称，形态也非最终形态。博士论文之后的头几年，布劳威尔科学生涯的大部分用于拓扑学，他至今仍以维数理论和不动点定理闻名于该领域。这项工作属于经典数学；按照布劳威尔后来的观点，他的不动点定理并不成立，尽管依照他的原则可以证明一个以逼近方式表述的类似定理成立。
    step2: |-
      24 岁那年，布劳威尔写成《生命、艺术与神秘主义》（Brouwer 1905）[^brouwer-1905]，书中唯我论的内容已预示其数学哲学。其博士论文首次表述了直觉主义的基础，只是尚未用此名，形态亦非定稿。此后数年间，他的科学生涯大半投入拓扑学，至今仍以维数理论与不动点定理知名于该领域。这部分工作属于经典数学；按布劳威尔后来的看法，他的不动点定理并不成立，只是依其原则可证得一个以逼近方式表述的类似结果。
  - id: 9
    kind: body
    source: |-
      From 1913 on, Brouwer increasingly dedicated himself to the development of the ideas formulated in his dissertation into a full philosophy of mathematics. He not only refined the philosophy of intuitionism but also reworked mathematics, especially the theory of the continuum and the theory of sets, according to these principles. By then, Brouwer was a famous mathematician who gave influential lectures on intuitionism at the scientific meccas of that time, Cambridge, Vienna, and Göttingen among them. His philosophy was considered awkward by many, but treated as a serious alternative to classical reasoning by some of the most famous mathematicians of his time, even when they had a different view on the matter. Kurt Gödel, who was a Platonist all his life, was one of them. Hermann Weyl at one point wrote “So gebe ich also jetzt meinen eigenen Versuch Preis und schließe mich Brouwer an” (Weyl 1921, 56)[^weyl-1921]. And although he rarely practised intuitionistic mathematics later in life, Weyl never stopped admiring Brouwer and his intuitionistic philosophy of mathematics.
    step1: |-
      自 1913 年起，布劳威尔日益致力于把博士论文中表述的想法发展为完整的数学哲学。他不仅精炼了直觉主义的哲学，还依这些原则重做了数学，尤其是连续统理论与集合论。此时布劳威尔已是著名数学家，在当时科学界的麦加——剑桥、维也纳、哥廷根等——作过有影响的直觉主义讲演。他的哲学被许多人视为别扭，却被当时一些最著名的数学家当作对经典推理的严肃替代方案，即便他们对此事持不同看法。终生为柏拉图主义者的库尔特·哥德尔便是其中之一。赫尔曼·外尔一度写道：“So gebe ich also jetzt meinen eigenen Versuch Preis und schließe mich Brouwer an”（意即：如今我放弃自己的尝试，转而追随布劳威尔）（Weyl 1921, 56）[^weyl-1921]。尽管外尔晚年很少实践直觉主义数学，他对布劳威尔及其直觉主义数学哲学的钦佩从未停止。
    step2: |-
      自 1913 年起，布劳威尔愈益致力于把博士论文中的想法发展为完整的数学哲学。他既精炼了直觉主义哲学，又依此原则重铸数学，尤以连续统理论与集合论为要。其时他已是知名数学家，在当时的科学重镇——剑桥、维也纳、哥廷根等地——作过颇具影响的直觉主义讲演。其哲学被不少人视为别扭，却被同时代一些最著名的数学家当作经典推理的严肃替代，即便他们对此别有看法；终生持柏拉图主义立场的库尔特·哥德尔即其一例。赫尔曼·外尔一度写道：“So gebe ich also jetzt meinen eigenen Versuch Preis und schließe mich Brouwer an”（意即：如今我放弃自己的尝试，转而追随布劳威尔）（Weyl 1921, 56）[^weyl-1921]。外尔晚年虽少作直觉主义数学，对布劳威尔及其直觉主义数学哲学的钦佩却未曾稍减。
  - id: 10
    kind: body
    source: |-
      The life of Brouwer was laden with conflicts, the most famous one being the conflict with David Hilbert, which eventually led to Brouwer’s expulsion from the board of the *Mathematische Annalen*. This conflict was part of the *Grundlagenstreit* that shook the mathematical society at the beginning of the 20th century and that emerged as a result of the appearance of paradoxes and highly nonconstructive proofs in mathematics. Philosophers and mathematicians were forced to acknowledge the lack of an epistemological and ontological basis for mathematics. Brouwer’s intuitionism is a philosophy of mathematics that aims to provide such a foundation.
    step1: |-
      布劳威尔的一生充满冲突，最著名的是与大卫·希尔伯特的冲突，最终导致布劳威尔被逐出《数学年刊》编委会。这场冲突是“基础之争”（Grundlagenstreit）的一部分，后者在 20 世纪初震动了数学界，因数学中悖论与高度非构造性证明的出现而起。哲学家与数学家被迫承认数学缺乏认识论与本体论基础。布劳威尔的直觉主义正是旨在提供这样一种基础的数学哲学。
    step2: |-
      布劳威尔一生多龃龉，最著者是与大卫·希尔伯特之争，终致其被逐出《数学年刊》（*Mathematische Annalen*）编委会。此争属“基础之争”（*Grundlagenstreit*）之一环：该争论随数学中悖论与高度非构造性证明的出现而兴起，震动 20 世纪初的数学界，迫使哲学家与数学家承认数学尚缺认识论与本体论根基。布劳威尔的直觉主义，正是一种旨在提供此根基的数学哲学。
