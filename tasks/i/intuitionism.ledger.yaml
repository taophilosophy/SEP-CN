      经典数学中许多存在性定理都有构造性类似物：其中存在性陈述被替换为关于逼近的陈述。上文弱反例一节已见一例，即介值定理。数学的很大部分可以类似方式构造性地恢复。此处不再进一步处理它们，原因在于本词条的焦点是直觉主义使之有别于其他构造性数学分支的那些方面。关于构造主义的详尽处理，读者可参阅本百科全书中相应的词条。
    step2: |-
      经典数学中许多存在性定理都有构造性对应物：把存在性陈述换成关于逼近的陈述。上文弱反例一节所举介值定理即其一例。数学的大部分皆可以类似方式作构造性重获。此处不再深论，盖本词条着重直觉主义区别于其他构造性数学分支之处；构造主义的系统处理，读者可参阅本百科全书相应词条。
