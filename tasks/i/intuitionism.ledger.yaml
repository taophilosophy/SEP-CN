      Another approach to the study of subsets of the continuum, or of a topological space in general, has appeared through the development of formal or abstract topology (Fourman 1982, Martin-Löf 1970, Sambin 1987)[^fourman-1982][^martin-löf-1970][^sambin-1987]. In this constructive topology the role of open sets and points is reversed; in classical topology an open set is defined as a certain set of points, in the constructive case open sets are the fundamental notion and points are defined in terms of them. Therefore this approach is sometimes referred to as point-free topology.
    step1: |-
      研究连续统（或一般拓扑空间）子集的另一条进路，随着形式拓扑或抽象拓扑的发展而出现（Fourman 1982, Martin-Löf 1970, Sambin 1987）[^fourman-1982][^martin-löf-1970][^sambin-1987]。在这种构造性拓扑中，开集与点的角色被颠倒：在经典拓扑中，开集被定义为某种点集；在构造性情形中，开集是基本概念，点则借开集来定义。因此这条进路有时被称为无点拓扑。
    step2: |-
      研究连续统（或一般拓扑空间）子集，尚有形式拓扑、抽象拓扑一途（Fourman 1982, Martin-Löf 1970, Sambin 1987）[^fourman-1982][^martin-löf-1970][^sambin-1987]。此构造性拓扑把开集与点的角色颠倒过来：经典拓扑以某种点集定义开集，构造性拓扑则以开集为基本概念、由之定义点。故此法或称无点拓扑。
