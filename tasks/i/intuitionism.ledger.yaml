      > Admitting two ways of creating new mathematical entities: firstly in the shape of more or less freely proceeding infinite sequences of mathematical entities previously acquired …; secondly in the shape of mathematical species, i.e. properties supposable for mathematical entities previously acquired, satisfying the condition that if they hold for a certain mathematical entity, they also hold for all mathematical entities which have been defined to be “equal” to it …. (Brouwer 1981, 8)[^brouwer-1981]
    step1: |-
      > 准许两种创造新数学实体的方式：其一，以或多或少自由进行的、由先前已获得的数学实体构成的无限序列的形式……；其二，以数学“种”（species）的形式，即对先前已获得的数学实体可设想的性质，且满足如下条件：若这些性质对某一数学实体成立，则对一切被定义为与它“相等”的数学实体也成立……。（Brouwer 1981, 8）[^brouwer-1981]
    step2: |-
