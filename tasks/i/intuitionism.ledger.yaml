      Intuitively, if $f$ represents $\Phi$ then $f(\alpha(\overline{n}))=0$ means that $\alpha(\overline{n})$ is not long enough to compute $\Phi(\alpha)$, and $f(\alpha(\overline{n}))=m+1$ means that $\alpha(\overline{n})$ is long enough to compute $\Phi(\alpha)$ and that the value of $\Phi(\alpha)$ is $m$. If $\mathcal{K}$ denotes the class of neighborhood functions, then the continuity axiom ${\bf C\mbox{-}N}$ can be rephrased as $$ \forall \alpha\exists n A(\alpha,n) \rightarrow \exists f \in \mathcal{K}\, \forall m(f(m) \gt 0 \rightarrow \forall \beta \in m A(\beta,f(m-1))), $$
    step1: |-
      直观上，若 $f$ 表示 $\Phi$，则 $f(\alpha(\overline{n}))=0$ 意味着 $\alpha(\overline{n})$ 不够长，无法计算 $\Phi(\alpha)$；而 $f(\alpha(\overline{n}))=m+1$ 意味着 $\alpha(\overline{n})$ 足够长，可以计算 $\Phi(\alpha)$，且 $\Phi(\alpha)$ 的值为 $m$。若 $\mathcal{K}$ 表示邻域函数的类，则连续性公理 ${\bf C\mbox{-}N}$ 可重述为 $$ \forall \alpha\exists n A(\alpha,n) \rightarrow \exists f \in \mathcal{K}\, \forall m(f(m) \gt 0 \rightarrow \forall \beta \in m A(\beta,f(m-1))), $$
    step2: |-
      直观地说，若 $f$ 表示 $\Phi$，则 $f(\alpha(\overline{n}))=0$ 谓 $\alpha(\overline{n})$ 尚不足以算出 $\Phi(\alpha)$；$f(\alpha(\overline{n}))=m+1$ 则谓 $\alpha(\overline{n})$ 已足以算出 $\Phi(\alpha)$，且 $\Phi(\alpha)$ 之值为 $m$。以 $\mathcal{K}$ 记邻域函数之类，则连续性公理 ${\bf C\mbox{-}N}$ 可改写为 $$ \forall \alpha\exists n A(\alpha,n) \rightarrow \exists f \in \mathcal{K}\, \forall m(f(m) \gt 0 \rightarrow \forall \beta \in m A(\beta,f(m-1))), $$
