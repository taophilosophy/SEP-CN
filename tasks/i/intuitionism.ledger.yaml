      > Completely separating mathematics from mathematical language and hence from the phenomena of language described by theoretical logic, recognizing that intuitionistic mathematics is an essentially languageless activity of the mind having its origin in the perception of a move of time. This perception of a move of time may be described as the falling apart of a life moment into two distinct things, one of which gives way to the other, but is retained by memory. If the twoity thus born is divested of all quality, it passes into the empty form of the common substratum of all twoities. And it is this common substratum, this empty form, which is the basic intuition of mathematics. (Brouwer 1981, 4–5)[^brouwer-1981]
    step1: |-
      > 把数学与数学语言完全分离，因而也与理论逻辑所描述的语言现象完全分离，认识到直觉主义数学本质上是心灵的一种无语言活动，其起源在于对时间之推移的知觉。这种对时间推移的知觉，可以描述为一个生命瞬间分裂为两个不同之物，其一让位于另一，而由记忆保留下来。若如此产生的“二重性”被剥去一切性质，它便转入一切二重性之共同基底这一空形式。而正是这一共同基底、这一空形式，是数学的基本直觉。（Brouwer 1981, 4–5）[^brouwer-1981]
    step2: |-
      > 将数学与数学语言完全分离，从而也与理论逻辑所描述的语言现象完全分离；认识到直觉主义数学本质上是心灵的一种无语言活动，其源头在于对时间推移的知觉。这一知觉可描述为：一个生命瞬间裂为两个不同之物，其一让位于另一，而由记忆留存。若如此诞生的“二重性”被剥去一切性质，便进入一切二重性之共同基底这一空形式。正是这一共同基底、这一空形式，构成数学的基本直觉。（Brouwer 1981, 4–5）[^brouwer-1981]
  - id: 16
    kind: body
    source: |-
      As will be discussed in the section on mathematics, the first act of intuitionism gives rise to the natural numbers but implies a severe restriction on the principles of reasoning permitted, most notably the rejection of the principle of the excluded middle. Owing to the rejection of this principle and the disappearance of the logical basis for the continuum, one might, in the words of Brouwer, “fear that intuitionistic mathematics must necessarily be poor and anaemic, and in particular would have no place for analysis” (Brouwer 1952, 142)[^brouwer-1952]. The second act, however, establishes the existence of the continuum, a continuum having properties not shared by its classical counterpart. The recovery of the continuum rests on the notion of choice sequence stipulated in the second act, i.e. on the existence of infinite sequences generated by free choice, which therefore are not fixed in advance.
    step1: |-
      正如关于数学的一节将要讨论的，直觉主义的第一幕产生了自然数，却对允许的推理原则施加了严格限制，最显著的是拒斥排中律。由于拒斥这一原则，又由于连续统的逻辑基础消失，人们或许会如布劳威尔所说，“担心直觉主义数学必定贫乏而苍白，尤其将无分析容身之地”（Brouwer 1952, 142）[^brouwer-1952]。然而第二幕确立了连续统的存在，这一连续统具有经典对应物所不具备的性质。连续统的恢复有赖于第二幕所规定的选择序列概念，即有赖于由自由选择生成的无限序列之存在——这类序列因而并非预先确定。
    step2: |-
      如后文论数学一节所述，第一幕生出自然数，却对可允许的推理原则施加严格限制，尤以拒斥排中律为要。因拒斥此原则、又因连续统的逻辑基础随之消失，人们或如布劳威尔所言，“担心直觉主义数学势必贫乏而苍白，尤其容不下分析”（Brouwer 1952, 142）[^brouwer-1952]。然而第二幕确立了连续统的存在，且此连续统具有经典对应物所无的性质。连续统之失而复得，系于第二幕所立的选择序列概念，即系于由自由选择生成的无限序列之存在——此类序列故非预先固定。
