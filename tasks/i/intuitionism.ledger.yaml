    source: |-
      The axiom of choice in its full form is unacceptable from a constructive point of view, at least in the presence of certain other central axioms of set theory, such as extensionality (Diaconescu 1975)[^diaconescu-1975]. For let $A$ be a statement that is not known to be true or false. Then membership of the following two sets is undecidable.

      $$ \begin{align} X &= \{ x \in \{0,1\} \mid x=0 \vee (x=1 \wedge A) \} \\ Y &= \{ y \in \{0,1\} \mid y=1 \vee (y=0 \wedge A) \} \end{align} $$
    step1: |-
      选择公理的完整形式从构造性观点看不可接受，至少在有集合论某些其他核心公理（如外延性）在场时如此（Diaconescu 1975）[^diaconescu-1975]。因为设 $A$ 是一个未知为真或假的陈述。则下列两个集合的成员关系不可判定。

      $$ \begin{align} X &= \{ x \in \{0,1\} \mid x=0 \vee (x=1 \wedge A) \} \\ Y &= \{ y \in \{0,1\} \mid y=1 \vee (y=0 \wedge A) \} \end{align} $$
    step2: |-
      选择公理的完整形式，从构造性观点看不可接受——至少当集合论另有外延性等核心公理在场时如此（Diaconescu 1975）[^diaconescu-1975]。设 $A$ 为真伪未知之陈述，则下列两集合之成员关系不可判定：

      $$ \begin{align} X &= \{ x \in \{0,1\} \mid x=0 \vee (x=1 \wedge A) \} \\ Y &= \{ y \in \{0,1\} \mid y=1 \vee (y=0 \wedge A) \} \end{align} $$
  - id: 91
    kind: body
    source: |-
      The existence of a choice function $f:\{X,Y\} \rightarrow \{0,1\}$ choosing an element from $X$ and $Y$ would imply $(A \vee \neg A)$. For if $f(X)\neq f(Y)$, it follows that $X\neq Y$, and hence $\neg A$, whereas $f(X)=f(Y)$ implies $A$. Therefore a choice function for $\{X,Y\}$ cannot exist.
    step1: |-
      若存在选择函数 $f:\{X,Y\} \rightarrow \{0,1\}$，从 $X$ 与 $Y$ 中各选一个元素，则蕴含 $(A \vee \neg A)$。因为若 $f(X)\neq f(Y)$，则 $X\neq Y$，从而 $\neg A$；而 $f(X)=f(Y)$ 蕴含 $A$。因此 $\{X,Y\}$ 的选择函数不可能存在。
    step2: |-
      若有选择函数 $f:\{X,Y\} \rightarrow \{0,1\}$ 分别从 $X$、$Y$ 中各取一元素，则蕴含 $(A \vee \neg A)$：盖若 $f(X)\neq f(Y)$，则 $X\neq Y$，故 $\neg A$；若 $f(X)=f(Y)$，则 $A$。故 $\{X,Y\}$ 之选择函数不可能存在。
