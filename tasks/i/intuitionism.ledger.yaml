      According to Brouwer every real number is represented by a choice sequence, and the choice sequences enabled him to capture the intuitionistic continuum via the controversial continuity axioms. Brouwer first spoke of choice sequences in his inaugural address (Brouwer 1912)[^brouwer-1912], but at that time he did not yet treat them as a fundamental part of his mathematics. Gradually they became more important and from 1918 on Brouwer started to use them in a way explained in the next section.
    step1: |-
      按照布劳威尔，每个实数都由一个选择序列表示，而选择序列使他能借有争议的连续性公理捕捉直觉主义连续统。布劳威尔在其就职演说中首次谈到选择序列（Brouwer 1912）[^brouwer-1912]，但当时他尚未把它们当作其数学的根本部分。它们逐渐变得更重要，自 1918 年起，布劳威尔开始以下一节所说明的方式使用它们。
    step2: |-
      布劳威尔认为，每个实数皆由一个选择序列表示；正是借选择序列，他得以通过颇有争议的连续性公理把握直觉主义连续统。他首次谈及选择序列是在就职演说中（Brouwer 1912）[^brouwer-1912]，其时尚未视之为其数学的根本成分。此后其地位渐重，自 1918 年起，布劳威尔开始按下节所述方式使用之。
