      The two acts of intuitionism do not in themselves exclude a psychological interpretation of mathematics. Although Brouwer only occasionally addressed this point, it is clear from his writings that he did consider intuitionism to be independent of psychology. Brouwer’s introduction of the *Creating Subject* (Brouwer 1948)[^brouwer-1948] as an idealized mind in which mathematics takes place already abstracts away from inessential aspects of human reasoning such as limitations of space and time and the possibility of faulty arguments. Thus the intersubjectivity problem, which asks for an explanation of the fact that human beings are able to communicate, ceases to exist, as there exists only one Creating Subject. In the literature, also the name *Creative Subject* is used for Creating Subject, but here Brouwer’s terminology is used. In (Niekus 2010)[^niekus-2010], it is argued that Brouwer’s Creating Subject does not involve an idealized mathematician. For a phenomenological analysis of the Creating Subject as a transcendental subject in the sense of Husserl see (van Atten 2007)[^atten-2007].
    step1: |-
      直觉主义的两幕本身并不排除对数学作心理学解释。尽管布劳威尔只是偶尔谈及这一点，从他的著作可以清楚看出，他确实认为直觉主义独立于心理学。布劳威尔引入*创造主体*（Brouwer 1948）[^brouwer-1948]作为数学在其中发生的理想化心灵，这已经抽去了人类推理的非本质方面，如空间与时间的限制、出错论证的可能性。于是，那个要求解释人类何以能够交流的主体间性问题便不复存在，因为只存在一个创造主体。文献中也用“创造性主体”（*Creative Subject*）一名指创造主体，但此处沿用布劳威尔的术语。在（Niekus 2010）[^niekus-2010]中，有人论证布劳威尔的创造主体并不涉及一位理想化的数学家。关于把创造主体作为胡塞尔意义上的先验主体所作的现象学分析，见（van Atten 2007）[^atten-2007]。
    step2: |-
      两幕本身并不排除对数学的心理学解释。布劳威尔虽只偶尔谈及此点，但从其著作可见，他确以为直觉主义独立于心理学。他引入*创造主体*（Brouwer 1948）[^brouwer-1948]，作为数学在其中展开的理想化心灵；此举已然抽去人类推理中的非本质成分，如时空限制与出错之可能。于是，那个要求解释人类何以能相互交流的主体间性问题不复存在——因为只有一个创造主体。文献中亦有以“创造性主体”（*Creative Subject*）称之者，此处仍从布劳威尔术语。Niekus（2010）[^niekus-2010] 论证布劳威尔的创造主体并不蕴含一位理想化的数学家；至于把创造主体视为胡塞尔意义上的先验主体所作的现象学分析，见 van Atten（2007）[^atten-2007]。
