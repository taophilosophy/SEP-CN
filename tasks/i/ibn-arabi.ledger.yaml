      After *tawhīd*, the remaining two principles of Islamic faith are prophecy (*nubuwwa*) and the Return (*ma‘ād*), a word that is often translated as eschatology. For both philosophers and Sufis, discussion of prophecy focused on human deiformity, and the issues they raised led theologians and jurists to accuse them of claiming to be greater than the prophets; Ibn ‘Arabī in particular was the center of a long controversy concerning the relationship between prophets and saints (Chodkiewicz 1993b; Nair 2025)[^chodkiewicz-1993b][^nair-2025].
    step1: |-
      在 *tawhīd* 之后，伊斯兰信仰的其余两原则是预言（*nubuwwa*）与回归（*ma‘ād*）；后者常被译为末世论。对哲学家与苏非而言，关于预言的讨论聚焦于人的似神性；他们提出的问题导致神学家与法学家指责他们自称高于先知；伊本·阿拉比尤其成为一场关于先知与圣者关系的长期争论的中心（Chodkiewicz 1993b; Nair 2025）[^chodkiewicz-1993b][^nair-2025]。
