    kind: body
    source: |-
      Ibn ‘Arabī’s writings remained unknown in the West until modern times, but they spread throughout the Islamic world within a century of his death. The early Orientalists, with few exceptions, paid little attention to him because he had no discernable influence in Europe. His works, moreover, are notoriously difficult, making it easy to dismiss him as a “mystic” or a “pantheist” without trying to read him. Not until books by Henry Corbin (1958) and Toshihiko Izutsu (1966) was he recognized as an extraordinarily broad-ranging and highly original thinker with much to contribute to the world of philosophy. These two scholars, however, limited their attention almost entirely to one of his short works, *Fusūs al-hikam* (“The Ringstones of the Wisdoms”), which has remained the focus of modern research. Translated into English at least five times, it has seen four critical editions in the past few years. (See the latest of these, Golfetto 2024, which includes a long introduction on the text and its reception as well as an extensive bibliography of works in Western languages.) Although *Ringstones* was the focus of commentary for centuries, it represents but a small fraction of what Ibn ‘Arabī offers in his massive *al-Futūhāt al-makkiyya* (“The Meccan Openings”). More recently, scholars have begun to look at this work (which now has two critical editions and an on-going translation into English by Eric Winkel). Everything that has been translated, however, is in need of further explanation and interpretation, not to speak of contextualization in the history of philosophy (for a stab at the last, see Ebstein 2013)[^ebstein-2013].
    step1: |-
      伊本·阿拉比的著作直到现代才为西方所知，但在他身后一个世纪之内便传遍伊斯兰世界。早期东方学家少有例外，对他关注甚少，因为他在欧洲没有可辨认的影响。而且他的著作以艰深著称，不经研读便容易把他打发为“神秘主义者”或“泛神论者”。直到 Henry Corbin（1958）与 Toshihiko Izutsu（1966）的著作问世，他才被承认为一位范围极广、极具原创性的思想家，对哲学世界贡献良多。不过这两位学者几乎把注意力全部限于他的一部短作《智慧宝座》，现代研究迄今仍以它为中心。它至少被英译过五次，过去几年又出现了四个校勘本。（关于其中最新者，见 Golfetto 2024：它有一篇论该文本及其接受史的长篇导言，以及一份西方语言作品的详尽书目。）尽管《宝座》数百年来一直是评注的焦点，但它只占伊本·阿拉比在其巨著《麦加开示》（*al-Futūḥāt al-makkiyya*）中所给出内容的一小部分。晚近，学者们开始研究这部著作（它现已有两个校勘本，且 Eric Winkel 的英译正在进行）。然而，一切已被翻译的内容都需要进一步的解释与诠释，更不必说放在哲学史中定位（就后者的一次尝试，见 Ebstein 2013）[^ebstein-2013]。
