      The unique characteristics of human beings derive from their ability to name things, which in turn results from the fact that they alone were created in the form of the all-comprehensive name. A proof-text is the verse, “God taught Adam the names, all of them” (Koran 2:30). This means not only the names of the particulars—God’s signs in the Three Books—but also the names of the universals, which the Koran calls God’s “most beautiful names” (*al-asmā’ al-husnā*). Human beings in any case have the potential to know all names, but not the Essence named by the names. About that one can only know “that it is” (the fact of its existence), not “what it is” (its quiddity). Inasmuch as the names correspond to the Essence, their meanings remain unknown, so they are simply markers of transcendence or “incomparability” (*tanzīh*). Inasmuch as they denote added attributes, such as mercy, knowledge, life, forgiveness, or vengeance, they indicate God’s immanence or “similarity” (*tashbīh*). In short, Ibn ‘Arabī’s theological vision combines the apophatic and kataphatic approaches.
    step1: |-
      人的独特特征源于其给事物命名的能力，而这又源于：唯独人被按总括之名的形象创造。一个证明经文是：“真主把万物的名字都教给了阿丹”（《古兰经》2:30）。这不仅意味着个别物——真主在三部书中的迹象——的名字，也意味着共相的名字，即《古兰经》所称真主“最美的名字”（*al-asmā’ al-husnā*）。无论如何，人都有认识一切名字的潜能，却不能认识名字所指称的本质。关于本质，人只能知道“它存在”（其存在这一事实），而不能知道“它是什么”（其什么性）。就名字与本质相对应而言，其意义仍不可知，故它们只是超越性或“不可比拟”（*tanzīh*）的标记。就它们表示附加属性——如慈悯、知识、生命、宽恕或报复——而言，它们指示真主的内在性或“相似”（*tashbīh*）。简言之，伊本·阿拉比的神学视野结合了否定神学与肯定神学两种进路。
