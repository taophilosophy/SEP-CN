      Both philosophers and Sufis also had a great deal to say about the Return, which was viewed in two respects: compulsory and voluntary. From the standpoint of the compulsory Return, the cosmos unfolds following its own ineluctable laws, and human beings go back to God in a series of stages that mirror the stages of cosmogenesis. From the standpoint of the voluntary Return, free will allows human beings to play a role in determining the trajectory of their own becoming. To a certain degree they are co-creators of their own souls and the posthumous realms, which are experienced in karmic terms, that is, as the result of a chain of causality set in motion by their own individual understandings, character traits, and activities. Ibn ‘Arabī marks a watershed in the discussion of both sorts of Return, not least because his explications of the *mundus imaginalis* allowed him to provide rational arguments for issues like bodily resurrection that, according to Avicenna, could not be understood by reason but can only be accepted on the basis of faith (Avicenna, *al-Shifā’*, 347–48; *al-Najāt*, 3:291). Ibn ‘Arabī’s leads were expanded on by later thinkers, most exhaustively by Mullā Sadrā in the fourth book of his magnum opus, *al-Asfār al-arba‘a*, on the topic of the soul and its unfolding (Mullā Sadrā 2008)[^mullā-2008].
    step1: |-
      哲学家与苏非对回归也都有许多话要说；回归可从两方面看：强制的与自愿的。从强制回归的观点看，宇宙依其自身不可逃避的法则展开，人则在一系列镜像宇宙生成阶段的阶段中返回真主。从自愿回归的观点看，自由意志使人得以在决定自身生成轨迹中起作用。在某种程度上，人是自己灵魂与后世诸领域的共同创造者；这些领域按业报方式被经验，即作为由各人自身的理解、品格特质与活动所启动的因果链的结果。伊本·阿拉比在关于两种回归的讨论中标志着一个分水岭，尤其是因为他对 *mundus imaginalis* 的阐释，使他能为诸如身体复活之类问题提供理性论证；按阿维森纳，这些问题不能被理性理解，只能基于信仰接受（Avicenna, *al-Shifā’*, 347–48; *al-Najāt*, 3:291）。伊本·阿拉比的线索被后世思想家扩展，最详尽者是穆拉·萨德拉在其巨著《四重旅行》第四卷中关于灵魂及其展开的讨论（Mullā Sadrā 2008）[^mullā-2008]。
