      ### 5.3 The Two Commands
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Ibn ‘Arabī often addresses the cosmic uniqueness of human beings using the word “command” (*amr*), an important Koranic term that has a strong bearing on the way theologians and philosophers addressed the issue of determinism and free will, or nature and nurture. It was said earlier that “the engendering command” (*al-amr al-takwīnī*) is the creative word “Be!” (*kun*) and that it turns the nonexistent entities into existent entities. God has addressed this command to all existent things without exception, and everything is obedient to it. The engendering command provides no way to distinguish between right and wrong, good and evil, better and worse, because all things are exactly what they must be. Everything manifests the Real, *al-Haqq*, and each is a specific face of God with its own *haqq*. From this standpoint, nothing in the cosmos is *bātil*—false, vain, or wrong.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      The fact is, however, that human beings, created in the form of God’s all-comprehensive name, are always faced with choices. Rational investigation is handicapped in its ability to choose the good over the bad, the right over the wrong, the beautiful over the ugly, the *haqq* over the *bātil*, because, without outside help, it cannot transcend the evanescent images that make up the cosmos. It has no access to the ultimate criteria whereby the *haqq* of things—their reality, truth, rightness, and appropriateness vis-à-vis the Real—can be discerned. In other words, the cosmic and human books cannot be interpreted rightly (*bi’l-haqq*) without guidance (*hudā*) from the Real (*al-haqq*), the author of the engendering command. Guidance is precisely the function of the prophets, by means of whom God issues commandments and prohibitions. This act of issuing is called “the prescriptive command” (*al-amr al-taklīfī*), because it sets down principles and directives that need to be followed in order to discern the *haqq*s of things and act appropriately.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      The engendering command brings the cosmos into existence, but the divine attributes demand much more than life, awareness, desire, power, and other qualities that are presupposed by the existence of minerals, plants, and animals. Among the ontological possibilities actually present in the Essence and actually manifest in the universe are mercy, love, compassion, forgiveness, justice, fairness, wisdom, and many other moral and ethical traits whose significance only becomes clear in human activity and interactions. All these are ontological qualities, but, in order for them to become fully manifest, the engendering command must give rise to the prescriptive command, which instructs people in the *haqq* of love, mercy, beneficence, kindness, and other traits. Becoming rightly characterized by the divine names does not happen simply by the natural course of events; it calls for the engagement of the human will. Only by choosing the *haqq* over the *bātil*, right over wrong, good over evil, can people realize the full possibilities of their own deiformity.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      By making guidance available, the prescriptive command also provides the possibility of error and misguidance. It is the occasion, in other words, for the actualization of various possibilities of being and becoming that are demanded by divine attributes such as severity, wrath, pride, and vengeance, not to speak of forgiveness and pardon. In any case, human beings, through their own freedom, play a role in actualizing possibilities of the Divine Infinity that otherwise would have no raison d’être, paradise and hell being the most salient examples. Distinguishing between the two commands allows us to grasp the difference between fact and value, between what is and what ought to be. But these are two sides of the same self-disclosure of Existence. By issuing commands and prohibitions, the Real introduces causal factors that force human beings to assume responsibility for what they will become on the moral and spiritual levels. This is why Ibn ‘Arabī says that people are “compelled to be free” (*majbūr fī ikhtiyārihim*). The degree to which they conform to the letter and spirit of the prescriptive command determines “the levels, stations, and stages” that they will reach in the ascending arc of the Return; posthumously, their levels and stages will become differentiated in the ascending levels of paradise and the descending levels of hell. Without human (or analogous, all-comprehensive, free beings), an infinity of ontological possibilities would not find their actualization. As Ibn ‘Arabī puts it, “If not for us, the last world would never have become distinct from this world” (Ibn ‘Arabī 1911, 3:253.21; Chittick 1998, 62)[^chittick-1998].
