      ### 5.2 Stages of Ascent
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      It was noted that one of Ibn ‘Arabī’s cosmological schemes describes the universe in terms of twenty-eight letters that articulate words in the All-Merciful Breath. Twenty-one of these letters correspond to stages of the descending arc, which reaches its lowest point with the four elements. The remaining letters designate the stages of the ascending arc, beginning with minerals, going on to plants, animals, angels, and jinn, and then on to man, the twenty-seventh letter. The twenty-eighth and final letter designates “the levels, stations, and stages”, that is, the invisible degrees of perfection achieved by the unfolding of human souls on the path of the Return.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      The decisive difference between animals and humans lies not in speech or rationality, but rather in man’s creation in the form of God per se, that is, God as designated by the all-comprehensive name. Everything else was created under the care of less comprehensive names. Adam’s divine form is God’s all-inclusive face, the Reality of Realities that embraces the full range of the possible entifications of Nondelimited Existence. The human microcosm has the potential to realize—that is, to actualize the reality of—everything present in the Book of the Cosmos and the Book of Scripture. Just as the visible, corporeal world came into manifestation in successive stages of entification, beginning with the Reality of Realities and descending by way of the invisible worlds until it reached the minerals, so also the “levels, stations, and stages” come into existence through the on-going self-disclosure of Real Existence in the invisible realms of the ascending arc and they reach their fruition when they return to the Origin. It is at that point that the circle of existence is completed, the dividing line disappears, and the imaginal distinction between Real and creation is effaced. As Ibn ‘Arabī writes:
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      > “He was two-bows’-length away.” Nothing makes the two bows/arcs manifest from the circle save the imagined line. It is sufficient that you have said that it is “imagined”, since the imagined is that which has no existence in its entity… . The cosmos, next to the Real, is something imagined to have existence, not an existent thing. The existent thing and existence are nothing but the Entity of the Real. This is His words, “Or closer.” The “closer” is the removal of this imagined thing. When it is removed from imagination, nothing remains but a circle, and the two arcs are not entified. (Ibn ‘Arabī 1911, 4:40.9; Chittick 1989, 237)[^chittick-1989]
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Human embodiment at the visible level represents an essential stage in the manifestation of the Reality of Realities, but realization of that Reality takes place within the soul, that is, on the imaginal and spiritual levels. The possibilities of manifestation represented by plants and animals are relatively limited; external appearance reveals their secrets to observers, and no one confuses a cabbage with a carrot, or a horse with a rabbit. But such is not the case with human beings, whose external uniformity conceals an unlimited inner diversity. The imaginal and spiritual contours of human souls, their awareness and character traits, can never be judged by the body’s appearance; human virtue and vice pertain to unseen realms. Culture, art, literature, politics, science, technology, and other peculiarly human accomplishments are the soul’s exteriorizations. Ibn ‘Arabī is not concerned, however, with every human possibility, because the paths that lead away from the full and balanced realization of the divine form are legion. Rather, he wants to delineate the broad contours of the perfections of deiformity, for it is these that lead to harmony with the Real in the posthumous realms. Even on this level, however, it is impossible even to enumerate these perfections, given that, as he tells us, their archetypes number 124,000, in keeping with the number of prophets from the time of Adam.
    step1: TBD
    step2: TBD
