      What then determines the measure of preparedness? This goes back to a thing’s “reality” (*haqīqa*), its “whatness” or “quiddity” (*māhiyya*). This is determined not by our definitions, but by God’s knowledge, because he knows the things always and forever, whether or not they exist in the cosmos. Ibn ‘Arabī commonly refers to these known realities simply as “things” (*ashyā’*, pl. of *shay’*) or “entities” (*a‘yān*, pl. of *‘ayn*). They do not exist in themselves, because nothing truly exists but the Real Existence, so they are “the nonexistents” (*al-ma‘dūmāt*). In philosophical terms, they are “the possible things” (*al-mumkināt*), so they may or may not come into existence, in contrast to the Real Existence, which is necessary (*wājib*), so it cannot not exist.
    step1: |-
      那么，什么决定准备的程度？这可追溯到一物的“实在”（*haqīqa*），即其“什么性”或“什么”（*māhiyya*）。这不是由我们的定义决定，而是由真主的知识决定，因为他永远知晓万物，无论它们在宇宙中是否存在。伊本·阿拉比通常把这些已知的实在简称为“事物”（*ashyā’*，*shay’* 的复数）或“实体”（*a‘yān*，*‘ayn* 的复数）。它们本身不存在，因为除实在的存在外无物真正存在，故它们是“非存在者”（*al-ma‘dūmāt*）。用哲学术语说，它们是“可能事物”（*al-mumkināt*），故可能存在也可能不存在；与此相对，实在的存在是必然的（*wājib*），故不可能不存在。
    step2: |-
      那么，什么决定准备的程度？这可追溯到一物的“实在”（*haqīqa*），即其“什么性”或“什么”（*māhiyya*）。这不是由我们的定义决定，而是由真主的知识决定，因为他永远知晓万物，无论它们在宇宙中是否存在。伊本·阿拉比通常把这些已知的实在简称为“事物”（*ashyā’*，*shay’* 的复数）或“实体”（*a‘yān*，*‘ayn* 的复数）。它们本身不存在，因为除实在的存在外无物真正存在，故它们是“非存在者”（*al-ma‘dūmāt*）。用哲学术语说，它们是“可能事物”（*al-mumkināt*），故可能存在也可能不存在；与此相对，实在的存在是必然的（*wājib*），故不可能不存在。
