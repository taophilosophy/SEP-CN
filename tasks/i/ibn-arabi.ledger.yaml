      It is difficult to overestimate the importance of the Koran as Ibn ‘Arabī’s source of inspiration (Chodkiewicz 1993a)[^chodkiewicz-1993a]. Far more than either the theologians or the philosophers, he dedicated his efforts to absorbing God’s word and being absorbed by it, and his writings are suffused with quotations and terminology from the text. As the divine speech (*kalām*), the Koran is understood as nonmanifest and indistinct from the Divine Essence, though it becomes manifest in recitation and writing. God’s speech reveals itself not only in scripture, but also in the universe and the soul. The homologies among cosmos, soul, and scripture follow easily on the Koran’s imagery. In several verses it speaks of God’s creative act as his command “Be!”, and it alludes to the individual creatures as his words (*kalimāt*). The identity of speech and creativity is also seen in the Koran’s frequent use of the term “sign” (*āya*) to designate the phenomena of the universe, the interior events of the soul, and its own verses. In effect, when God speaks—and he speaks because the Infinite Real cannot but display its qualities and characteristics—he voices three books, each of which is made up of signs/verses. As Ibn ‘Arabī says of the cosmos, “It is all letters, words, chapters, and verses, so it is the Great Koran” (Ibn ‘Arabī 1911, 4:167.22; Chittick 1998, 71; Chittick 2022b)[^chittick-1998][^chittick-2022b].
    step1: |-
      《古兰经》作为伊本·阿拉比灵感来源的重要性难以高估（Chodkiewicz 1993a）[^chodkiewicz-1993a]。他远比神学家或哲学家更致力于吸收真主之言并被其吸收，其著作充满经文的引文与术语。作为神圣言语（*kalām*），《古兰经》被理解为非显白的、与神圣本质不可区分，尽管它在诵读与书写中变得显白。真主之言不仅在经典中显现，也在宇宙与灵魂中显现。宇宙、灵魂与经典之间的同构关系，顺《古兰经》的意象而来。数节经文把真主的创造行为说成他的命令“有！”，并暗示个体受造物是他的言语（*kalimāt*）。言语与创造性的同一，也见于《古兰经》频繁使用“迹象”（*āya*）一词来指宇宙现象、灵魂的内在事件以及它自身的节文。实际上，当真主言说时——他言说，因为无限实在者不能不展示其性质与特征——他发出三部书，每一部都由迹象／节文构成。正如伊本·阿拉比论宇宙所说：“它全是字母、词语、篇章与节文，故它就是伟大的《古兰经》”（Ibn ‘Arabī 1911, 4:167.22; Chittick 1998, 71; Chittick 2022b）[^chittick-1998][^chittick-2022b]。
    step2: |-
