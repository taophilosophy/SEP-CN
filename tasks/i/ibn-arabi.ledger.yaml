      When Ibn ‘Arabī talks about imagination as one of the heart’s two eyes, he is using the language established by the philosophers when they spoke about the faculties of the soul. But he is more concerned with imagination’s ontological status, about which the early philosophers had little to say. Here his use of *khayāl* accords with its everyday meaning, which is closer to image than imagination. The word was employed to designate not only the mental faculty, but also mirror images, shadows, scarecrows, and everything that appears in dreams and visions; in this sense it is synonymous with the term *mithāl*, which was often preferred by later authors when speaking of its ontological status. Ibn ‘Arabī stresses that an image brings together two sides and unites them as one; it is both the same as and different from the two. A mirror image is both the mirror and the object that it reflects; or, it is neither the mirror nor the object. A dream is both the soul and what is seen; or, it is neither the soul nor what is seen. By nature images are/are not. In the eye of reason, a notion is either true or false. Imagination perceives notions as images and recognizes that they are simultaneously true and false, or neither true nor false. The implications for ontology become clear when we look at the three “worlds of imagination”.
    step1: |-
      当伊本·阿拉比把想象说成心的两眼之一时，他使用的是哲学家谈论灵魂官能时确立的语言。但他更关心想象的本体论地位，早期哲学家对此少有论述。此处他对 *khayāl* 的使用与日常义一致，后者更接近“影像”而非“想象”。这个词不仅指心理官能，还指镜像、影子、稻草人，以及梦中与异象中出现的一切；在此意义上，它与 *mithāl* 同义，后世作者谈及其本体论地位时往往偏好后者。伊本·阿拉比强调，影像把两侧聚合起来、合为一；它既与二者相同，又与二者不同。镜中影像既是镜子又是其所反映的对象；或者说，它既不是镜子也不是对象。梦既是灵魂又是所见者；或者说，它既不是灵魂也不是所见者。按其本性，影像既是／又不是。在理性眼中，一个观念要么真要么假。想象把观念知觉为影像，并认识到它们同时既真又假，或既不真也不假。当我们考察三个“想象世界”时，其对本体论的意涵便清楚了。
