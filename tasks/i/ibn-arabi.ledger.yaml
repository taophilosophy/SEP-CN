      ### 4.1 Fixed Entities
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Most famously, Ibn ‘Arabī discusses the things known to God as “fixed entities” (*a‘yān thābita*). Early translators opted for expressions like immutable or permanent “archetypes” or “essences”, without noting that there is no difference in whatness between the fixed entity and “existent entity” (*‘ayn mawjūda*). The fixed entity is the thing inasmuch as it is nonexistent in itself but known to God. The existent entity is the exact same thing, but it has become manifest as an imaginal or delimited existence due to the engendering command, the word “Be!” The fixed entities are not the “archetypes” of the existent entities but are rather identical (*‘ayn*) with them; nor are they “essences”, if by this is meant anything other than the entities’ specific whatness. But use of the word “essence” to translate *‘ayn*obscures the important distinction between the words *‘ayn*and *dhāt*.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      By having recourse to the fixity of entities in the divine knowledge, Ibn ‘Arabī is able to say that the dispute between theologians and philosophers over the eternity of the world goes back to their perception of the entities. Those who maintain that the world is eternal have understood that “the Real is never qualified by first not seeing the cosmos, then seeing it. On the contrary, He never ceases seeing it.” Those who maintain that the world is qualified by new arrival (*hudūth*) “consider the existence of the cosmos in relation to its own entity”, which is nonexistent. Hence they understand that it must have come into existence (Ibn ‘Arabī 1911, 2:666.35; Chittick 1989, 85)[^chittick-1989].
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Followers of Ibn ‘Arabī sometimes distinguished between divine names and fixed entities by calling the former “the universal names” and the latter “the particular names”. Ibn ‘Arabī observes theological norms when he declares that the divine names are “conditional” (*tawqīfī*), which is to say that we should call God only by those names that he himself uses in scripture. He also acknowledges, however, that every single thing is a divine name, because each designates the Nondelimited in respect of a certain delimitation. In this sense, each thing, each entity, is a “specific face” (*wajh khāss*) of God that differentiates it from every other thing. After quoting the prophetic saying that God has “ninety-nine” names, Ibn ‘Arabī explains that these names designate the “mothers” of the names, which give birth to all the rest. He continues:
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      > Every one of the possible entities has a specific divine name that gazes upon it and gives it its specific face, thereby distinguishing it from every other entity. The possible things are infinite, so the names are infinite, for new relations arrive with the new arrival of the possible things. (Ibn ‘Arabī 1911, 4:288.1; Chittick 1989, 42)[^chittick-1989]
    step1: TBD
