      Ibn ‘Arabī has typically been called the founder of the doctrine of *wahdat al-wujūd*, the Oneness of Being or the Unity of Existence, but this is misleading, for he never uses the expression. Passages in his writings that approximate it have no special significance, nor are they out of place in the general trend of contemporary philosophy and theology, both of which affirmed the unity of the Necessary Existence. Why *wahdat al-wujūd* was singled out to typify Ibn ‘Arabī’s position is not clear. Part of the reason was that he highlighted *tawhīd* as his guiding principle and gave *wujūd* a special prominence in his vocabulary. It was utterly obvious to him that there is no *wujūd*but God, which is to say that there is no real existence and no real finding but God, and that in itself everything other than God is unreal and neither finds nor is found. This is another way of saying what Avicenna says, that all things are possible or contingent save the Necessary Existence. In short, Ibn ‘Arabī, and even more so his followers like Qūnawī, focused on the Real *Wujūd* as the one, unique reality from which all other realities derive. On the rare occasions when Ibn ‘Arabī’s students used the expression *wahdat al-wujūd*, they did not give it a technical sense. The one exception is Qūnawī’s student Sa‘īd al-Dīn Farghānī, who described the vision of the Oneness of Existence as the fruit of the first of the four journeys that must be accomplished if seekers are to attain union with God (Chittick 2024). But this technical sense of the expression played little or no role in the later debates.
    step1: |-
      伊本·阿拉比通常被称为存在单一论（*wahdat al-wujūd*）——存在之单一或存在之统一——的创立者，但这是误导，因为他从不使用这一表述。其著作中接近它的段落并无特殊意义，也不脱离当时哲学与神学的一般趋势——两者都肯定必然存在者的统一。为何 *wahdat al-wujūd* 被挑出来作为伊本·阿拉比立场的代表，并不清楚。部分原因是：他把 *tawhīd* 凸显为指导原则，并在其词汇中给 *wujūd* 特殊地位。对他而言，除真主外没有 *wujūd* 是显而易见的；这就是说，除真主外没有真存在也没有真找到，而除真主之外的一切就其本身而言都不实在，既不找到也未被找到。这是阿维森纳所言之另一种说法：除必然存在者外，万物皆可能或偶然。简言之，伊本·阿拉比、尤其其追随者如库纳维，把实在的 *wujūd* 视为一且唯一的实在，一切其他实在皆由之而来。伊本·阿拉比的学生极少使用 *wahdat al-wujūd* 这一表述；使用时也未给它技术意义。唯一的例外是库纳维的学生赛义德丁·法尔加尼：他把存在单一论的视见描述为四段旅程中第一段的果实；求道者若要与真主合一，必须完成这四段旅程（Chittick 2024）。但这一表述的技术意义在后来的争论中所起作用甚小或没有。
