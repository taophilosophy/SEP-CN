      Qūnawī differentiates Ibn ‘Arabī’s position from that of *falsafa* and scholastic theology (Kalam) by calling it *mashrab al-tahqīq*, “the school of realization”. *Tahqīq* is the cornerstone of Ibn ‘Arabī’s vast corpus, so it is important to have a sense of what the word means. The word is derived from the same root as *haqq* and *haqīqa*, key terms in all the sciences. *Haqq* means true, real, right, worthy, and appropriate (in modern times, it is used in talk of human “rights”); *haqīqa* means reality and truth. The Koran uses *haqq*, the conceptual opposite of *bātil* (false, vain, unreal, inappropriate), in a variety of senses, not least as a divine name, “the Real, the True”, and to designate the content of revelation (the Koran and earlier scriptures). *Haqīqa* is not a Koranic term, but it was used in the Hadith literature and given special attention in philosophy. *Tahqīq* or “realization” means to speak, affirm, and actualize *haqq* and *haqīqa*—truth, reality, rightness, appropriateness. Ibn ‘Arabī finds its role in human becoming encapsulated in the Prophet’s saying, “Everything has a *haqq*, so give to each that has a *haqq* its *haqq*”. In other words, everything in the universe, society, and the soul has a rightness and an appropriateness, and the human task vis-à-vis each thing is to act rightly and appropriately; or, everything has rights, and people have the responsibility (that is, the *haqq* “against them”, *‘alayhim*) to observe those rights.
    step1: |-
      库纳维把伊本·阿拉比的立场与*法尔萨法*及经院神学（凯拉姆）区分开来，称之为 *mashrab al-tahqīq*，“实现学派”。*Tahqīq* 是伊本·阿拉比庞大著作的基石，因此理解这个词的含义很重要。该词与 *haqq*、*haqīqa* 同根，而后两者是一切科学中的关键术语。*Haqq* 意为真实、实在、正当、配得、恰当（现代用于谈论人的“权利”）；*haqīqa* 意为实在与真理。《古兰经》以多种意义使用 *haqq*，它是 *bātil*（虚假、徒然、不实、不当）的概念对立面，尤其作为神名“实在者、真实者”，并用以指启示的内容（《古兰经》与更早的经典）。*Haqīqa* 不是《古兰经》术语，但见于圣训文献，并在哲学中受到特别关注。*Tahqīq* 或“实现”意为言说、肯定并实现 *haqq* 与 *haqīqa*——真理、实在、正当、恰当。伊本·阿拉比在先知的一句话中看到它在人之生成中的角色：“万物皆有 *haqq*，故凡有 *haqq* 者，当予其 *haqq*。”换言之，宇宙、社会与灵魂中的万物都有其正当与恰当，人对每一物的任务是正当而恰当地行动；或者，万物皆有权利，人有责任（即“对其不利的” *haqq*，*‘alayhim*）去尊重这些权利。
