      God’s words, like our own spoken words, dissipate quickly, so they are renewed constantly, “at every breath” (*ma‘ al-anfās*). This is to say that “everything other than God” (the standard definition of the cosmos) is re-created at each instant (*tajdīd al-khalq fi’l-ānāt*) and all things undergo constant change. The notion that “There is no repetition in [God’s] self-disclosure” (*lā takrār fi’l-tajallī*) is a basic principle of Ibn ‘Arabī’s thought. He sees it as a straightforward application of *tawhīd*. By acknowledging the unity of the Real, we recognize that it is one and unique in its every act, which means that each created thing and each moment of each thing is one and unique; nothing can ever be repeated precisely because of each thing’s uniqueness and the divine infinity.
    step1: |-
      真主之言像我们说出的话一样迅速消散，因此不断更新，“在每一次呼吸中”（*ma‘ al-anfās*）。这就是说，“除真主之外的一切”（宇宙的标准定义）在每一瞬间都被重新创造（*tajdīd al-khalq fi’l-ānāt*），万物都经历持续变化。“［真主的］自我显现中没有重复”（*lā takrār fi’l-tajallī*）这一观念，是伊本·阿拉比思想的基本原则。他视之为 *tawhīd* 的直接应用。通过承认实在者的独一，我们认识到它在每一行为中都是一且唯一，这意味着每一受造物、每一物的每一瞬间都是一且唯一；正因为每一物的独一性与神圣的无限，任何事物都永不可能重复。
