      In one of his best known explications of the nature of things, Ibn al-‘Arabī looks at God’s creativity as an analogue of human speech. Just as we create words and sentences in the substratum of breath, so God creates the universe by articulating words in the Breath of the All-Merciful (*nafas al-rahmān*), which is the deployment of existence (*inbisāt al-wujūd*); indeed, existence itself is synonymous with mercy (*rahma*). His most elaborate cosmological scheme (among several) depicts the basic levels of cosmic deployment as corresponding with the twenty-eight letters of the Arabic alphabet, each representing a specific modality of articulated existence (Burckhardt 1977, Chittick 1998)[^burckhardt-1977][^chittick-1998].
    step1: |-
      在他最著名的关于万物本性的阐释之一中，伊本·阿拉比把真主的创造性看作人类言语的类似物。正如我们在气息的基质中创造词语与句子，真主通过在至慈者的气息（*nafas al-rahmān*）中发出词语来创造宇宙；这气息就是存在的展开（*inbisāt al-wujūd*）；的确，存在本身与慈悯（*rahma*）同义。他最精细的宇宙论图式（在若干图式之中）把宇宙展开的基本层级对应于阿拉伯字母表的二十八个字母，每个字母代表已发出存在的一种特定样式（Burckhardt 1977; Chittick 1998）[^burckhardt-1977][^chittick-1998]。
