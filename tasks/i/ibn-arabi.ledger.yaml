      Most famously, Ibn ‘Arabī discusses the things known to God as “fixed entities” (*a‘yān thābita*). Early translators opted for expressions like immutable or permanent “archetypes” or “essences”, without noting that there is no difference in whatness between the fixed entity and “existent entity” (*‘ayn mawjūda*). The fixed entity is the thing inasmuch as it is nonexistent in itself but known to God. The existent entity is the exact same thing, but it has become manifest as an imaginal or delimited existence due to the engendering command, the word “Be!” The fixed entities are not the “archetypes” of the existent entities but are rather identical (*‘ayn*) with them; nor are they “essences”, if by this is meant anything other than the entities’ specific whatness. But use of the word “essence” to translate *‘ayn*obscures the important distinction between the words *‘ayn*and *dhāt*.
    step1: |-
      伊本·阿拉比最著名地讨论为真主所知的事物，称之为“固定实体”（*a‘yān thābita*）。早期译者选用不变的或永久的“原型”或“本质”之类说法，却未指出：固定实体与“存在实体”（*‘ayn mawjūda*）在什么性上并无差别。固定实体就是事物，就其本身非存在但为真主所知而言。存在实体是完全同一的事物，只是由于生成命令“有！”而显白为意象性的或限定的存在。固定实体不是存在实体的“原型”，而与它们同一（*‘ayn*）；若“本质”一词意指实体特定什么性之外的任何东西，它们也不是“本质”。但用“本质”来翻译 *‘ayn*，会遮蔽 *‘ayn* 与 *dhāt* 两词之间的重要区分。
