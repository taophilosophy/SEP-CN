      Foremost among the technical terms of philosophy that Ibn ‘Arabī employs is *wujūd*, existence or being, a word that had come to the center of philosophical discourse with Avicenna. In the Koran and everyday Arabic, *wujūd* means to find, come across, become conscious of, enjoy, be ecstatic. It was used to designate existence because what exists is what is found and experienced. For Ibn ‘Arabī, the act of finding—that is, perception, awareness, and consciousness—is never absent from the fact of being found. If on the one hand he speaks of *wujūd* in the standard Avicennan language of necessity and possibility, he simultaneously talks of it—in terms long established by the Sufi tradition—as the fullness of divine presence and human consciousness that is achieved in realization (Dobie 2007)[^dobie-2007].
    step1: |-
      伊本·阿拉比所用的哲学术语中，最要紧的是 *wujūd*——存在或存在。这个词随阿维森纳而进入哲学话语的中心。在《古兰经》与日常阿拉伯语中，*wujūd* 意为找到、遭遇、意识到、享受、狂喜。它被用来指存在，因为存在者就是被找到、被经验者。对伊本·阿拉比而言，找到的行为——即知觉、觉知与意识——从不在“被找到”这一事实中缺席。一方面，他以阿维森纳标准的必然与可能语言谈论 *wujūd*；另一方面，他又同时以苏非传统早已确立的术语，把 *wujūd* 谈作在实现中所达成的神圣在场与人类意识的充盈（Dobie 2007）[^dobie-2007]。
