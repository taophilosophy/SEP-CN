      ### 6.3 Divine Presences
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      Ibn ‘Arabī’s followers often summarized the notion of Perfect Man by having recourse to a scheme that was sometimes called “the Five Divine Presences” (*al-hadarāt al-ilāhiyyat al-khams*). Ibn ‘Arabī uses presence (*hadra*) to designate any realm in which Existence (i.e., finding and being found) becomes manifest under the auspices of a general quality; in this sense it is roughly synonymous with world (*‘ālam*) or level (*martaba*). In one passage, for example, he explains that the cosmos is made up of two worlds or two presences, that of the Unseen and that of the Visible, “though a third presence is born between the two from the totality”, and that is the world of imagination (Ibn ‘Arabī 1911, 3:42.5; Chittick 1998, 258)[^chittick-1998]. Most commonly, as in his chapter on the divine names in *Openings*, he uses presence to designate a name’s realm of influence and then describes various ways in which the properties and traces of the name are displayed in the cosmos and human beings; one might say that he is describing how things participate in Platonic ideas. The most inclusive of these presences is the “divine presence” (*al-hadrat al-ilāhiyya*), that is, the realm that comes under the sway of the all-comprehensive name, God. Concerning it Ibn ‘Arabī writes, “There is nothing in Existence but the Divine Presence, which is His Essence, His attributes, and His acts” (Ibn ‘Arabī 1911, 2:114.14).
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Qūnawī seems to have been the first to speak of “the Five Divine Presences”, and the expression soon became commonplace, though several different schemes were proposed. He used the expression to explain how the Reality of Realities, or the First Entification, embraces all entifications and thereby becomes manifest in five basic realms. The first presence is the Reality of Realities in divinis, embracing the divine knowledge of the cosmos. The second, third, and fourth presences are the same three worlds that are commonly discussed: the unseen (spiritual), the imaginal, and the visible (corporeal). The fifth presence is Perfect Man in his all-comprehensive deployment, embracing the other four presences in a synthetic whole: his fixed entity is identical with the Reality of Realities, his spirit with the unseen world, his soul with the imaginal world, and his body with the visible realm (Chittick 1984). In this way of conceiving of man, the role played by the Logos in giving birth to the cosmos is clear. Qūnawī puts it in a nutshell: Perfect Man is “the perfected human reality of the Essence, one of whose levels is the Godhead [*al-ulūhiyya*]; all existent things are the loci of manifestation for his differentiated qualities and properties” (Qūnawī 1996, 66–67)[^qūnawī-1996].
