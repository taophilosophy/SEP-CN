      What exactly are things? They are the concomitants (*lawāzim*) of Existence, or the potentialities of manifestation latent in Infinite Possibility, or the never-ending delimitations of the Nondelimited. If a thing is found in the cosmos, it is a specific self-disclosure of Real Existence, a face of God, a word articulated in the All-Merciful Breath, a color made visible by the radiance of Light. Inasmuch as things appear, they display Existence and its attributes; inasmuch as their receptivity is delimited and defined, they act as veils. Each is a *barzakh*, an imaginal thing, simultaneously an image of Existence and an image of nonexistence.
    step1: |-
      事物究竟是什么？它们是存在的伴随物（*lawāzim*），或潜在于无限可能性中的显现潜能，或未限定者永无止境的限定。若一物在宇宙中被找到，它就是实在存在的一次特定自我显现，是真主的一面，是在至慈者气息中发出的一个词，是因光的照耀而可见的一种颜色。就事物显现而言，它们展示存在及其属性；就它们的接受性受限且被界定而言，它们起帷幕作用。每一物都是 *barzakh*，一个意象性事物，同时是存在的影像与非存在的影像。
