      ### 4.2 The Reality of Realities
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Ibn al-‘Arabī calls the word *shay’*, thing, “one of the most indefinite of the indefinites” (*min ankar al-nakirāt*), because it can refer to anything whatsoever, existent or nonexistent, real or unreal. Nonetheless, he says that he avoids using it in reference to God because God does not use it to name himself. He does call God an entity, however, especially in the expression “the One Entity” (*al-‘ayn al-wāhida*), typically in contexts that bring to mind what some later scholars called the doctrine of the Oneness of Existence. For example:
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      > Through Him we [existent entities] become manifest to Him and to us. In one respect we are through Him, but He is not through us, since He is the Manifest, and we remain with our own root [i.e., nonexistence], even if we bestow—through the preparedness of our entities—certain affairs that belong to our entities, and even if we are named by names that the veiled person supposes to be our names, such as Throne, Footstool, Intellect, Soul, nature, sphere, body, earth, heaven, water, air, fire, inanimate object, plant, animal, and jinn. All this belongs to One Entity, nothing else. (Ibn ‘Arabī 1911, 1:691.14; Chittick 1998, 75)[^chittick-1998]
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Ibn ‘Arabī does refer to God as a thing in an early work, *Inshā’ al-dawā’ir*, and this caught the attention of several observers. There he mentions “the third thing”, a notion that seems to throw light on his whole approach (Takeshita 1982, Bashier 2004)[^bashier-2004][^takeshita-1982]. At first he seems to be talking in the standard Avicennan language of necessity and possibility, but then he brings up the notion of *barzakh* to explain how these two can be interrelated. “Things,” he says, can be divided into three sorts. The first sort is qualified by *wujūd* in its very essence, and this is the Necessary Existence, which is nondelimited in existence (*mutlaq al-wujūd*) and bestows existence on all things. The second sort is existent (*mawjūd*) through God, namely delimited existence (*al-wujūd al-muqayyad*), which is the cosmos, everything other than God. “As for the Third Thing”, he writes:
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      > it is qualified neither by existence nor by nonexistence, neither by new arrival nor by eternity…. The cosmos becomes manifest from this Third Thing, for this thing is the Reality of the Universal Realities of the cosmos, which are intelligible to the mind…. If you say that this thing is the cosmos, you speak the truth, and if you say that it is the Eternal Real, you speak the truth. If you say that it is neither the cosmos nor the Real but rather an added meaning, you speak the truth. (Ibn ‘Arabī, *Inshā’*, 16–17)
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Given the detailed description of the Third Thing provided in the full passage, it is clear that Ibn ‘Arabī is discussing Nondelimited Imagination as the Supreme Barzakh. The Third Thing, however, never became established as a technical term, in contrast to the synonym that he mentions in this same passage, the Reality of Realities, also called the Universal Reality and the Muhammadan Reality. Reality (*haqīqa*), as already noted, is used to mean entity, quiddity, thing, and possible thing, though it is commonly used more broadly as well.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      > There is no existent possible thing in everything other than God that is not connected to the divine relations and lordly realities that are known as the Most Beautiful Names. Therefore every possible thing is in the grasp of a divine reality. (Ibn ‘Arabī 1911, 2:115.27; Chittick 1989, 37)[^chittick-1989]
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      By mentioning “universal” realities in talking about the Third Thing, Ibn ‘Arabī means the divine names and attributes, which become manifest through the particular realities as the existent entities. He has in view a version of the Tree of Porphyry, though he never uses the expression: Each individual (leaf) is a member of a species (twig), which in turn belongs to a genus (branch), and so on, until all are eventually subsumed under the genus of the genera, the Reality of Realities. This Reality is neither the Necessary Existence nor the cosmos. In God it is the divine knowledge of all things, and as such is eternal; in the cosmos, it is the ever-changing totality that is temporal creation. Drawing from terminology he uses elsewhere, his followers often called this Reality in God “the Most Holy Effusion” (*al-fayd al-aqdas*), and they defined it as God’s self-disclosure to himself in himself, or the self-knowledge by which he knows every concomitant of his own infinity. They contrasted it with “the Holy Effusion” (*al-fayd al-muqaddas*), the creative act that brings all realities and entities into manifestation.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      After Ibn ‘Arabī probably the best known synonym of the Reality of Realities is “the Muhammadan Reality” (*al-haqīqat al-muhamaddiyya*). Ibn ‘Arabī sometimes used the expression, but only in passing. The first author to explain its meaning in detail was the same author who gave a clear meaning to the term *wahdat al-wujūd*, namely Farghānī (Chittick 2023)[^chittick-2023].
