      To call Real Existence “one” is to speak of the unity of the Essence. In other terms, it is to say that Existence—Light in itself—is nondelimited (*mutlaq*), that is, boundless and absolute, undefined and indefinable, indistinct and indistinguishable. In contrast, everything other than Existence—every existent, found thing (*mawjūd*)—is distinct, defined, and limited. The Real is incomparable and transcendent, but it discloses itself (*tajallī*) in all things, so it is also similar and immanent. It possesses such utter nondelimitation that it is not delimited by nondelimitation. “God possesses Nondelimited Existence, but no delimitation prevents Him from delimitation. On the contrary, He possesses all delimitations, so He is nondelimited delimitation” (Ibn ‘Arabī 1911, 3:162.23; Chittick 1989, 109)[^chittick-1989].
    step1: |-
      称实在的存在为“一”，就是谈本质的统一。用其他话说，就是：存在——本身即光——是未限定的（*mutlaq*），即无边界、绝对、未界定、不可界定、不区分、不可区分。相反，除存在之外的一切——每个存在者、被找到之物（*mawjūd*）——都是区分的、已界定的、有限的。实在者不可比拟、超越，但它在万物中自我显现（*tajallī*），故也相似、内在。它具有如此彻底的未限定性，以至不被“未限定性”所限定。“真主拥有未限定存在，但没有任何限定能阻止他受限定。相反，他拥有一切限定，故他是未限定的限定”（Ibn ‘Arabī 1911, 3:162.23; Chittick 1989, 109）[^chittick-1989]。
