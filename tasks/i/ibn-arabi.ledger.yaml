      > Were it not for light, nothing whatsoever would be perceived [*idrāk*], neither the known, nor the sensed, nor the imagined. The names of light are diverse in keeping with the names of the faculties…. Smell, taste, imagination, memory, reason, reflection, conceptualization, and everything through which perception takes place are light. As for the objects of perception… they first possess manifestation to the perceiver, then they are perceived; and manifestation is light…. Hence every known thing has a relation with the Real, for the Real is Light. It follows that nothing is known but God. (Ibn ‘Arabī 1911, 3:276–77; Chittick 1989, 214)[^chittick-1989]
