    source: |-
      Ibn ‘Arabī (1165–1240) can be considered the greatest of all Muslim philosophers, provided we understand philosophy in the broad, modern sense and not simply as the discipline of *falsafa*, whose outstanding representatives are Avicenna and, many would say, Mullā Sadrā. Salman Bashier (2012) has even argued that “the story of Islamic philosophy” depicts an initial rationalistic phase and culminates with an “illuminative phase” best represented by Ibn ‘Arabī. Most Western scholarship and much of the later Islamic tradition have classified Ibn ‘Arabī as a “Sufi”, though he himself did not; his works cover the whole gamut of Islamic sciences, not least Koran commentary, Hadith (sayings of Muhammad), jurisprudence, principles of jurisprudence, theology, philosophy, and mysticism. Unlike al-Ghazālī, whose range of work is similar to his, he did not usually write in specific genres, but tended rather to integrate and synthesize the sciences in the context of thematic works, ranging in length from one or two folios to several thousand pages. Nor did he depart from the highest level of discourse, or repeat himself in different works. In the later Sufi tradition he was often called *al-Shaykh al-Akbar*, the Greatest Master, a title that was understood to mean that no one else has been or will be able to unpack the multi-layered significance of the sources of the Islamic tradition with such detail and profundity.
    step1: |-
      伊本·阿拉比（1165–1240）可被视为一切穆斯林哲学家中最伟大者——前提是我们按宽泛的现代意义理解哲学，而不只把它当作*法尔萨法*（falsafa）这门学科：其杰出代表是阿维森纳，许多人还会说，还有穆拉·萨德拉。Salman Bashier（2012）甚至论证，“伊斯兰哲学的故事”描绘了一个起初的理性主义阶段，并以“照明阶段”告终；后者的最佳代表正是伊本·阿拉比。多数西方研究与后来伊斯兰传统的大部分把伊本·阿拉比归为“苏非”，尽管他本人并不如此；他的著作涵盖伊斯兰诸科学的全部范围，尤其是经注、圣训（穆罕默德言行）、教法学、法理学、教义学、哲学与神秘主义。与作品范围相近的安萨里不同，他通常不按特定体裁写作，而是在专题著作的语境中整合、综合诸学科；这些著作篇幅从一两张对开纸到数千页不等。他也不曾从最高的论述层次退下来，或在不同的著作中重复自己。在后来的苏非传统中，他常被称为 *al-Shaykh al-Akbar*（至大师），此称号意谓：除他之外，无人曾经或将要能以如此的细致与深刻解读伊斯兰传统诸源头的多层意义。
