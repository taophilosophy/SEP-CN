      Another hadith explains that the primary *haqq*, upon which all other *haqq*s are based, is “There is no god but God”, which is to say that there is nothing truly real but the Real, there is nothing truly right but the Right. In Islamic theology, understanding this notion is called *tawhīd* or “the acknowledgement of [divine] unity” and is considered the first of the three principles of faith; *tawhīd* also underlies the standpoints of the philosophers, even if some of them seldom spoke of God per se, preferring terms like the First, the Good, and the Necessary. This particular hadith tells us that God’s *haqq* against people (that is, their responsibility toward him) is for them to acknowledge *tawhīd*, and, if they do so, their right against God (his responsibility toward them) is for them to receive everlasting happiness, *sa‘āda*—the term philosophers used to translate *eudaimonia*.
    step1: |-
      另一则圣训说明，首要的 *haqq*——一切其他 *haqq* 所依据者——是“万物非主，唯有真主”；这就是说，除实在者外无物真正实在，除正当者外无物真正正当。在伊斯兰神学中，理解这一观念被称为 *tawhīd*（“承认［真主的］独一”），被视为信仰三原则之首；*tawhīd* 也是哲学家立场的根基，尽管他们中有些人很少直接谈论真主，而偏好“第一者”“善”“必然者”等术语。这则圣训告诉我们：真主对人拥有的 *haqq*（即人对他的责任）是让他们承认 *tawhīd*；若他们如此，则他们对真主拥有的权利（他对他们的责任）是获得永恒的幸福 *sa‘āda*——哲学家用来翻译 *eudaimonia* 的词。
