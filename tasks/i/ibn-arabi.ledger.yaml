      The diffusion of Ibn ‘Arabī’s teachings in the writings of later philosophers, theologians, and Sufis has not received nearly as much attention as it deserves. Good beginnings are found in studies by Alexander Knysh (1999), Caner Dagli (2016), Ali Mokhtar (2021), and Arjun Nair (2025).
    step1: |-
      伊本·阿拉比的教义在后来的哲学家、神学家与苏非著作中的传播，尚未得到应有的重视。Alexander Knysh（1999）、Caner Dagli（2016）、Ali Mokhtar（2021）与 Arjun Nair（2025）的研究是好的开端。
