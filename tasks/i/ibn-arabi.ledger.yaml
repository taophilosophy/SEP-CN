      By having recourse to the fixity of entities in the divine knowledge, Ibn ‘Arabī is able to say that the dispute between theologians and philosophers over the eternity of the world goes back to their perception of the entities. Those who maintain that the world is eternal have understood that “the Real is never qualified by first not seeing the cosmos, then seeing it. On the contrary, He never ceases seeing it.” Those who maintain that the world is qualified by new arrival (*hudūth*) “consider the existence of the cosmos in relation to its own entity”, which is nonexistent. Hence they understand that it must have come into existence (Ibn ‘Arabī 1911, 2:666.35; Chittick 1989, 85)[^chittick-1989].
    step1: |-
      借助神圣知识中实体的固定性，伊本·阿拉比得以说，神学家与哲学家关于世界永恒的争论，源于他们对实体的知觉。主张世界永恒者已理解到：“实在者绝不会先不见宇宙、后见宇宙。相反，他从不停止注视它。”主张世界有新来（*hudūth*）者“考虑宇宙的存在相对于其自身实体”，而实体非存在。因此他们理解到，宇宙必定已进入存在（Ibn ‘Arabī 1911, 2:666.35; Chittick 1989, 85）[^chittick-1989]。
