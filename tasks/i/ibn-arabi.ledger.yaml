      ### 4.3 Entification
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Qūnawī gave currency to a technical term, *ta‘ayyun* or “entification”, that plays a major role in discussions of existence after Ibn ‘Arabī. The word is derived from *‘ayn*, “entity,” and means to become an entity. Given that an entity is a thing, one might translate it as “reification”, not in the sense of a human cognitive process, however, but as a designation for the manner in which Nondelimited Existence becomes determined, limited, defined, and “thingified” in the process of disclosing itself as everything other than God. Thus all things are entifications or delimitations or determinations of the Nondelimited Real, which is then called “the Nonentification” (*al-lā ta‘ayyun*). As for the Reality of Realities, it is the First Entification, because all other entifications follow in its wake.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      In her lengthy, though far from complete, study of Ibn ‘Arabī’s technical terms, Su‘ād al-Hakīm (1981) mentions forty synonyms for the Reality of Realities, all under the heading *al-insān al-kāmil*, “the Perfect Man”. This notion, which can perhaps best be understood in Western terms as the Logos through which all things are created, stands at the center of Ibn ‘Arabī’s worldview and integrates its disparate dimensions. Hakīm does not mention the Third Thing as one of the synonyms, but the continuation of the passage in which Ibn ‘Arabī speaks of it does make clear that the Reality of Realities is indeed the reality (or the fixed entity) of the Perfect Man:
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      > Man has two perfect relations, one through which he enters into the divine level, and one through which he enters into the cosmic level…. He is as it were a *barzakh* between the cosmos and the Real, bringing together and embracing both creation and the Real. He is the dividing line between the cosmic and divine levels, like the dividing line between shadow and sunlight. This is his *reality*. So he has nondelimited perfection in both new arrival and eternity, while God has nondelimited perfection in eternity and does not enter into new arrival—high exalted is He!—and the cosmos has nondelimited perfection in new arrival and does not enter into eternity—it is too base for that! Thus man is all-comprehensive. (Ibn ‘Arabī, *Inshā’* 90)
