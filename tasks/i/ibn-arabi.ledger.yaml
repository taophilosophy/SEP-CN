      ### 6.2 Perfect Man
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      As the model of human possibility, Perfect Man represents the individual who has traversed the circle of existence, reached the station of Two-Bows’ Length, and returned to his origin, the Reality of Realities. Standing in the Station of No Station, he is He/not He, Eternal/newly arrived, Infinite/finite. He alone functions as God’s “vicegerent” (*khalīfa*) or representative, the intermediary between God and creation, which is precisely the role for which Adam was created (Koran 2:30). Qūnawī writes:
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      > The true Perfect Man is the *barzakh* between Necessity and possibility, the mirror that brings together in its essence and level the attributes and properties of Eternity and new arrival… . He is the intermediary between the Real and creation… . Were it not for him and the fact that he acts as a *barzakh* no different from the two sides, nothing of the cosmos would receive the divine, unitary effusion, because of the lack of correspondence and interrelationship. (Qūnawī 1992, 248)[^qūnawī-1992]
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      To put this in another way, Perfect Man is the spirit that animates the cosmos. This is the theme that begins the first chapter of Ibn ‘Arabī’s *Ringstones*, which explains the manner in which Adam—the human being—manifests the wisdom of the all-comprehensive name. In a parallel way, he writes in the *Openings*:
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      > The whole cosmos is the differentiation of Adam, and Adam is the All-Comprehensive Book. In relation to the cosmos he is like the spirit in relation to the body. Hence man is the spirit of the cosmos, and the cosmos is the body. By bringing all this together, the cosmos is the great man, so long as man is within it. But, if you look at the cosmos alone, without man, you will find it to be like a proportioned body without a spirit. (Ibn ‘Arabī 1911, 2:67.28)
