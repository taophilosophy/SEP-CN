      ### 6.1 The Station of No Station
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Each of “the levels, stations, and stages” represents an actualization of a potential deiformity, or an instance of becoming characterized by one or more divine names. Each divine attribute and prophetic archetype sets up a “station” (*maqām*) in which human beings can stand and from which they can observe the nature of things. There are countless stations of knowledge and spiritual perfection, and each bestows specific character traits and points of view. Ibn ‘Arabī often tells us that such-and-such a chapter of the *Openings* pertains to the standpoint of Moses, or Jesus, or Abraham. In the same way, he divides *Ringstones* into twenty-seven chapters, each of which is dedicated to a prophet or sage who is presented as a word or logos (*kalima*) embodying the wisdom (*hikma*) of a specific divine name. His ultimate purpose in describing the various standpoints is to highlight the Station of No Station (*maqām lā maqām*), also called “the Muhammadan Station”. This is full realization of the Reality of Realities, embracing all stations and standpoints without being determined or defined by any of them. “The people of perfection have realized all stations and states and passed beyond these to the station above both majesty and beauty, so they have no attribute and no description” (Ibn ‘Arabī 1911, 2:133.19; Chittick 1989, 376)[^chittick-1989].
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Perfect Man, standing in the Station of No Station, is in effect the human analogue of Nondelimited Existence, which assumes every delimitation without itself becoming limited. Qūnawī sometimes calls this station “the point at the center of the circle of existence” because it has no dimensions in itself, but all of manifest reality is arranged in reference to it. He also explains it in terms of the contrast between Existence and quiddity (i.e., fixed entity). Everything and everyone other than Perfect Man has a specific whatness, distinguishing it from everything else, which is to say that each existent thing stands in a defined “level, station, and stage”. Perfect Man, however, manifests the Real per se, so his whatness is identical with Existence, not with this or that. Qūnawī writes:
    step1: TBD
