      ### 6.1 The Station of No Station
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Each of “the levels, stations, and stages” represents an actualization of a potential deiformity, or an instance of becoming characterized by one or more divine names. Each divine attribute and prophetic archetype sets up a “station” (*maqām*) in which human beings can stand and from which they can observe the nature of things. There are countless stations of knowledge and spiritual perfection, and each bestows specific character traits and points of view. Ibn ‘Arabī often tells us that such-and-such a chapter of the *Openings* pertains to the standpoint of Moses, or Jesus, or Abraham. In the same way, he divides *Ringstones* into twenty-seven chapters, each of which is dedicated to a prophet or sage who is presented as a word or logos (*kalima*) embodying the wisdom (*hikma*) of a specific divine name. His ultimate purpose in describing the various standpoints is to highlight the Station of No Station (*maqām lā maqām*), also called “the Muhammadan Station”. This is full realization of the Reality of Realities, embracing all stations and standpoints without being determined or defined by any of them. “The people of perfection have realized all stations and states and passed beyond these to the station above both majesty and beauty, so they have no attribute and no description” (Ibn ‘Arabī 1911, 2:133.19; Chittick 1989, 376)[^chittick-1989].
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Perfect Man, standing in the Station of No Station, is in effect the human analogue of Nondelimited Existence, which assumes every delimitation without itself becoming limited. Qūnawī sometimes calls this station “the point at the center of the circle of existence” because it has no dimensions in itself, but all of manifest reality is arranged in reference to it. He also explains it in terms of the contrast between Existence and quiddity (i.e., fixed entity). Everything and everyone other than Perfect Man has a specific whatness, distinguishing it from everything else, which is to say that each existent thing stands in a defined “level, station, and stage”. Perfect Man, however, manifests the Real per se, so his whatness is identical with Existence, not with this or that. Qūnawī writes:
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      > No one tastes this and reaches its source except him whose essence has come to be nondelimited. Then the bonds—the contingent properties, states, attributes, stations, configurations, acts, and beliefs—are loosened, and he is not confined by any of them. By his essence he flows in everything, just as existence flows in the realities of all things without end or beginning…. When the Real gave me to witness this tremendous place of witnessing, I saw that its possessor has no fixed entity and no reality. (Qūnawī, 1996, 265–66; cited in Chittick 2004)[^chittick-2004]
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      ### 6.2 Perfect Man
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      As the model of human possibility, Perfect Man represents the individual who has traversed the circle of existence, reached the station of Two-Bows’ Length, and returned to his origin, the Reality of Realities. Standing in the Station of No Station, he is He/not He, Eternal/newly arrived, Infinite/finite. He alone functions as God’s “vicegerent” (*khalīfa*) or representative, the intermediary between God and creation, which is precisely the role for which Adam was created (Koran 2:30). Qūnawī writes:
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      > The true Perfect Man is the *barzakh* between Necessity and possibility, the mirror that brings together in its essence and level the attributes and properties of Eternity and new arrival… . He is the intermediary between the Real and creation… . Were it not for him and the fact that he acts as a *barzakh* no different from the two sides, nothing of the cosmos would receive the divine, unitary effusion, because of the lack of correspondence and interrelationship. (Qūnawī 1992, 248)[^qūnawī-1992]
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      To put this in another way, Perfect Man is the spirit that animates the cosmos. This is the theme that begins the first chapter of Ibn ‘Arabī’s *Ringstones*, which explains the manner in which Adam—the human being—manifests the wisdom of the all-comprehensive name. In a parallel way, he writes in the *Openings*:
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      > The whole cosmos is the differentiation of Adam, and Adam is the All-Comprehensive Book. In relation to the cosmos he is like the spirit in relation to the body. Hence man is the spirit of the cosmos, and the cosmos is the body. By bringing all this together, the cosmos is the great man, so long as man is within it. But, if you look at the cosmos alone, without man, you will find it to be like a proportioned body without a spirit. (Ibn ‘Arabī 1911, 2:67.28)
    step1: TBD
    step2: TBD
