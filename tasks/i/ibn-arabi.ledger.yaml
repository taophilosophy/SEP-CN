    kind: body
    source: |-
      Among the Koranic divine names is “Light” (*al-nūr*), for God is “the light of the heavens and the earth” (24:35). Naming God “Light” is tantamount to naming him Existence, for, as Qūnawī explains, “True Light brings about perception but is not perceived”, just as True Existence brings about manifestation and finding but is neither manifest nor found. Qūnawī continues by saying that True Light is “identical with the Essence of the Real in respect of Its disengagement from relations and attributions” (Qūnawī 1992, 225)[^qūnawī-1992]. In other words, True Light is Nondelimited Existence (*al-wujūd al-mutlaq*), and it discloses itself as delimited existence (*al-wujūd al-muqayyad*). It is precisely this Light that brings about finding, awareness, and perception. Just as there is no true existence but God, so also there is no true finder but God and nothing truly found but God. As Ibn ‘Arabī explains:
