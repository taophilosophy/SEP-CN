      > He who stops with the Koran inasmuch as it is a *qur’ān* has but a single eye that unifies and brings together. For those who stop with it inasmuch as it is a totality of things brought together, however, it is a *furqān*…. When I tasted the latter…, I said, “This is lawful, that is unlawful, and this is indifferent. The schools have become various and the religions diverse. The levels have been distinguished, the divine names and the engendered traces have become manifest, and the names and the gods have become many in the world”. (Ibn ‘Arabī 1911, 3:94.16; Chittick 1989, 363)[^chittick-1989]
    step1: |-
