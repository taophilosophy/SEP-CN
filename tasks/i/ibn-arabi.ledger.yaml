      The word used to designate the Essence, *al-dhāt*, is a pronoun meaning “possessor of”. Originally it was an abbreviation for *dhāt al-asmā’*, “the possessor of the names”; hence the synonymous term, *al-musammā*, “the Named”. The Koran refers to the Essence as “He” (*huwa*), a pronoun that alerts us only to the fact that something is there. The word can just as well be translated as “It”, of course, because the Essence is beyond gender. Arabic grammar, however, classifies all nouns and pronouns as masculine or feminine (indeed, when speaking of the Essence, authors use the pronoun *hiya*, “She”, because *dhāt* is feminine, and they sometimes explain why the Essence is more properly feminine than masculine; Murata 1992, 196–99)[^murata-1992]. What we know from the names is that “He/She” is merciful, knowing, alive, and so on, but in itself the Essence remains unknown. Each name designates a specific quality that becomes manifest the moment there is talk of the Real (*al-haqq*) and creation (*al-khalq*). Hence Ibn ‘Arabī says that the divine names can properly be called relations (*nisab*).
    step1: |-
      用来指称本质的词 *al-dhāt* 是一个意为“拥有者”的代词。它原先是 *dhāt al-asmā’*（“名字的拥有者”）的缩写；因此有同义词 *al-musammā*（“被命名者”）。《古兰经》以“他”（*huwa*）指称本质，这个代词只提醒我们有某物在那里。当然，这个词也完全可以译为“它”，因为本质超越性别。然而，阿拉伯语语法把所有名词与代词分为阳性或阴性（的确，论及本质时，作者们用代词 *hiya*“她”，因为 *dhāt* 是阴性；他们有时还解释为何本质更宜用阴性而非阳性；Murata 1992, 196–99）[^murata-1992]。我们从名字得知的是，“他／她”是慈悯的、全知的、永生的等等，但本质本身仍不可知。每个名字都指称一种特定性质，一旦谈及实在者（*al-haqq*）与创造（*al-khalq*），这种性质便显现。因此伊本·阿拉比说，神圣名字恰当地说可称为关系（*nisab*）。
