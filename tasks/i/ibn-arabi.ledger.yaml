      The first author to say that Ibn ‘Arabī believed in *wahdat al-wujūd* seems to have been the Hanbalite polemicist Ibn Taymiyya (d. 1328), who called this notion worse than unbelief. According to him, it means that no distinction can be drawn between God and the world. His attack set in motion a long controversy over the term, usually with little or no attempt to define it. At least seven different meanings were ascribed to it in the later literature, and Orientalists followed suit, declaring that Ibn ‘Arabī invented the doctrine, and then interpreting it negatively (à la Ibn Taymiyya) or, less commonly, positively (à la ‘Abd al-Rahmān Jāmī [d. 1492], the first of Ibn ‘Arabī’s defenders to embrace the expression) (Chittick, 1994b).
    step1: |-
      第一个说伊本·阿拉比信奉 *wahdat al-wujūd* 的作者，似乎是罕百里派论战家伊本·泰米叶（卒于 1328）；他称此观念比不信更糟。据他，这意味着真主与世界之间无法作任何区分。他的攻击引发了一场围绕该词的长期争论，人们通常很少或根本不去界定它。后来的文献至少给它归了七种不同含义，东方学家也随声附和：宣称伊本·阿拉比发明了此说，然后予以负面解释（如伊本·泰米叶）或较少见地予以正面解释（如阿卜杜勒·拉赫曼·贾米［卒于 1492］，他是伊本·阿拉比辩护者中第一个接受这一表述的人）（Chittick, 1994b）。
