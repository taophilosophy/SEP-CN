      ### 3.3 Imagination
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      Imagination (*khayāl*), as Corbin (1958) has shown, plays a major role in Ibn ‘Arabī’s writings. In the *Openings*, for example, he says about it, “After the knowledge of the divine names and of self-disclosure and its all-pervadingness, no pillar of knowledge is more complete” (Ibn ‘Arabī 1911, 2:309.17; Chittick 1989, 121)[^chittick-1989]. He frequently criticizes philosophers and theologians for their failure to acknowledge imagination’s full cognitive and ontological significance. In his view, *‘aql*—intellect or reason, a word that derives from the same root as *‘iqāl*, fetter—can only delimit, define, and analyze. It perceives difference and distinction, and quickly grasps the divine transcendence and incomparability. In contrast, properly disciplined imagination has the capacity to perceive God’s self-disclosure in all Three Books. The symbolic and mythic language of scripture, like the constantly shifting and never-repeated self-disclosures that are cosmos and soul, cannot be interpreted away with reason’s strictures. What Corbin calls “creative imagination” (a term that has no equivalent in Ibn ‘Arabī’s vocabulary) must complement rational perception.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      In Koranic terms, the locus of awareness and consciousness is the heart (*qalb*), a word that has the verbal sense of fluctuation and transmutation (*taqallub*). According to Ibn ‘Arabī, the heart has two eyes, reason and imagination, and the dominance of either distorts perception and awareness. The rational path of philosophers and theologians needs to be complemented by the mystical intuition of the Sufis, the “unveiling” (*kashf*) that allows for imaginal—not “imaginary”—vision. The heart, which in itself is unitary awareness, must become attuned to its own fluctuation, seeing at one beat God’s incomparability with the eye of reason, at the next beat his similarity with the eye of imagination. The heart’s two visions are prefigured in the two primary names of the Scripture, *al-qur’ān*, “that which brings together”, and *al-furqān*, “that which differentiates”. These two demarcate the contours of ontology and epistemology. The first alludes to the unifying oneness of Existence (perceived by imagination), and the second to the differentiating manyness of knowledge and discernment (perceived by reason). The Real, as Ibn ‘Arabī often says, is the One/the Many (*al-wāhid al-kathīr*), that is, One in Essence and many in names, the names being the principles of all multiplicity, limitation, and definition. In effect, with the eye of imagination, the heart sees Existence present and immanent in all things, and with the eye of reason it discerns its transcendence and the diversity of the divine faces.
    step1: TBD
    step2: TBD
