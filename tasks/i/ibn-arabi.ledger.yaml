      In discussing the ontological role of image/imagination, Ibn ‘Arabī often uses the term *barzakh* (isthmus, barrier, limit). In the Koran an isthmus is that which stands between the sweet and salty seas (25:53, 55:20) and what prevents the deceased soul from returning to the world (23:100). Generally, theologians understood it to be the “location” of the soul after death and before the Day of Resurrection. Ibn ‘Arabī employs the term to designate anything that simultaneously divides and brings together two things, without itself having two sides, like the “line” that separates sunlight and shade. He uses the term Supreme Barzakh (*al-barzakh al-a‘lā*) as a synonym for Nondelimited Imagination. It is, in other words, the cosmos, the realm of possible things, which in themselves are neither necessary nor impossible, neither infinite nor finite. The cosmos is the “line” that separates the infinite light of Existence from the absolute darkness of nonexistence. Or, it is the Breath of the All-Merciful, which is neither Nondelimited Existence nor articulated words.
    step1: |-
      在讨论影像／想象的本体论角色时，伊本·阿拉比常用 *barzakh*（地峡、屏障、界限）一词。在《古兰经》中，地峡是位于甜海与咸海之间者（25:53, 55:20），也是阻止亡魂返回世界者（23:100）。一般地，神学家把它理解为灵魂死后、复活日之前所在的“位置”。伊本·阿拉比用这个词指任何同时区分并聚合两物、而自身没有两侧的东西，如分隔阳光与阴影的“线”。他用“最高间隔”（*al-barzakh al-a‘lā*）作为未限定想象的同义词。换言之，它就是宇宙、可能事物的领域；这些事物本身既不必然也不可能，既非无限也非有限。宇宙是分隔存在的无限之光与非存在的绝对黑暗的“线”。或者，它是至慈者的气息，既不是未限定存在，也不是已发出的词语。
