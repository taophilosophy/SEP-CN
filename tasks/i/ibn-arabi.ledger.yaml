      > There is no true existence that does not accept change except God, for there is nothing in realized Existence but God. As for everything other than He, that dwells in imaginal being…. Everything other than the Essence of the Real is intervening imagination and vanishing shadow. No created thing remains upon a single state in this world, the next world, and what is between the two, neither spirit, nor soul, nor anything other than the Essence of God. Rather, each continuously changes from form to form, constantly and forever. And imagination is nothing but this…. So the cosmos only became manifest within imagination…. It is it, and it is not it. (Ibn ‘Arabī 1911, 2:313.12; Chittick 1989, 118)[^chittick-1989]
