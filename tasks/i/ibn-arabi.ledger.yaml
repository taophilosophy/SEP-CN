    source: |-
      Several scholars have pointed to parallels between Ibn ‘Arabī and figures like Eckhart and Cusanus (Sells 1994, Shah-Kazemi 2006, Smirnov 1993, Dobie 2009)[^dobie-2009][^sells-1994][^shah-kazemi-2006][^smirnov-1993], and others have suggested that he anticipates trends in physics (Yousef 2007)[^yousef-2007] or modern philosophy (Almond 2004, Coates 2002, Dobie 2007)[^almond-2004][^coates-2002][^dobie-2007]. The most serious attempt to fit him into the history of Western philosophy argues that his notion of *barzakh* (see section 3.4) offers a viable solution to the problem of defining the indefinable, which has dogged epistemology from the time of Aristotle and led to the despair of modern philosophers like Rorty (Bashier 2004)[^bashier-2004]. Other scholars have compared him to Eastern thinkers like Shankara, Zhuangzi, and Dôgen (Shah-Kazemi 2006, Izutsu 1966, Izutsu 1977)[^izutsu-1966][^izutsu-1977][^shah-kazemi-2006]. Nor were the similarities to Eastern thought lost on premodern scholars; during the eighteenth and nineteenth centuries, the Muslims of China established a Chinese-language school (the Han Kitab) that drew from Ibn ‘Arabī’s legacy and presented the Islamic worldview in terms drawn from Confucian thought (Murata *et al*. 2008)[^murata-2008]. Implications of his thought for contemporary concerns have been addressed by a diverse array of scholars and devotees in the *Journal of the Muhyiddin Ibn ‘Arabi Society*, which has been published since 1983. All the attention he has been receiving, and specifically from scholars and thinkers labelled “perennialists,” has led some to question the validity of the modern lenses through which he is often read (Lipton 2018, Abdel-Hadi 2025)[^abdel-hadi-2025][^lipton-2018]. What follows is an outline of some of the topics Ibn ‘Arabī addresses.
    step1: |-
      有几位学者指出伊本·阿拉比与埃克哈特、库萨努斯等人物之间的平行（Sells 1994; Shah-Kazemi 2006; Smirnov 1993; Dobie 2009）[^dobie-2009][^sells-1994][^shah-kazemi-2006][^smirnov-1993]；另有人提出他预示了物理学（Yousef 2007）[^yousef-2007] 或现代哲学的趋势（Almond 2004; Coates 2002; Dobie 2007）[^almond-2004][^coates-2002][^dobie-2007]。把他纳入西方哲学史的最严肃尝试主张：他的*间隔*（barzakh，见 3.4 节）概念为“定义不可定义者”问题提供了可行的解法，此问题自亚里士多德以来一直困扰认识论，并令 Rorty 等现代哲学家陷入绝望（Bashier 2004）[^bashier-2004]。另有学者把他与商羯罗、庄子、道元等东方思想家比较（Shah-Kazemi 2006; Izutsu 1966; Izutsu 1977）[^izutsu-1966][^izutsu-1977][^shah-kazemi-2006]。对前现代学者而言，与东方思想的相似也未逃过他们的眼睛：十八至十九世纪，中国穆斯林建立了一个汉语学派（汉克塔布），取自伊本·阿拉比的遗产，并以借自儒家思想的语汇呈现伊斯兰世界观（Murata et al. 2008）[^murata-2008]。他的思想对当代关切的意涵，由形形色色的学者与信众在《穆希丁·伊本·阿拉比学会学报》（自 1983 年起出版）中讨论。他所获得的一切关注——尤其来自被标为“永恒论者”的学者与思想家——已使一些人质疑人们常用的现代透镜是否有效（Lipton 2018; Abdel-Hadi 2025）[^abdel-hadi-2025][^lipton-2018]。以下概述伊本·阿拉比讨论的部分主题。
    step2: |-
      有几位学者指出伊本·阿拉比与埃克哈特、库萨努斯等人物之间的平行（Sells 1994; Shah-Kazemi 2006; Smirnov 1993; Dobie 2009）[^dobie-2009][^sells-1994][^shah-kazemi-2006][^smirnov-1993]；另有人提出他预示了物理学（Yousef 2007）[^yousef-2007] 或现代哲学的趋势（Almond 2004; Coates 2002; Dobie 2007）[^almond-2004][^coates-2002][^dobie-2007]。把他纳入西方哲学史的最严肃尝试主张：他的*间隔*（barzakh，见 3.4 节）概念为“定义不可定义者”问题提供了可行的解法，此问题自亚里士多德以来一直困扰认识论，并令 Rorty 等现代哲学家陷入绝望（Bashier 2004）[^bashier-2004]。另有学者把他与商羯罗、庄子、道元等东方思想家比较（Shah-Kazemi 2006; Izutsu 1966; Izutsu 1977）[^izutsu-1966][^izutsu-1977][^shah-kazemi-2006]。对前现代学者而言，与东方思想的相似也未逃过他们的眼睛：十八至十九世纪，中国穆斯林建立了一个汉语学派（汉克塔布），取自伊本·阿拉比的遗产，并以借自儒家思想的语汇呈现伊斯兰世界观（Murata et al. 2008）[^murata-2008]。他的思想对当代关切的意涵，由形形色色的学者与信众在《穆希丁·伊本·阿拉比学会学报》（自 1983 年起出版）中讨论。他所获得的一切关注——尤其来自被标为“永恒论者”的学者与思想家——已使一些人质疑人们常用的现代透镜是否有效（Lipton 2018; Abdel-Hadi 2025）[^abdel-hadi-2025][^lipton-2018]。以下概述伊本·阿拉比讨论的部分主题。
