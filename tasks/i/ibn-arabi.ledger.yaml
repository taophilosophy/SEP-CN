      Qūnawī gave currency to a technical term, *ta‘ayyun* or “entification”, that plays a major role in discussions of existence after Ibn ‘Arabī. The word is derived from *‘ayn*, “entity,” and means to become an entity. Given that an entity is a thing, one might translate it as “reification”, not in the sense of a human cognitive process, however, but as a designation for the manner in which Nondelimited Existence becomes determined, limited, defined, and “thingified” in the process of disclosing itself as everything other than God. Thus all things are entifications or delimitations or determinations of the Nondelimited Real, which is then called “the Nonentification” (*al-lā ta‘ayyun*). As for the Reality of Realities, it is the First Entification, because all other entifications follow in its wake.
