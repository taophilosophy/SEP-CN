      The divine names designate the universal attributes that suffuse existence, such as life, knowledge, desire, power, speech, generosity, and justice (these are called “the seven leaders” of the names). These attributes are found in everything, because they pertain to the very Essence of the Real and accompany its self-disclosure. They remain largely potential in created things, however, because each thing has its own preparedness (*isti‘dād*) or receptivity (*qābiliyya*), and none can display the Real per se. Although each thing is a face, each is also a veil; He/not He.
    step1: |-
      神圣名字指称充溢存在的普遍属性，如生命、知识、意愿、能力、言语、慷慨与正义（这些被称为名字的“七位领袖”）。这些属性见于万物，因为它们属于实在者的本质本身，并伴随其自我显现。然而，它们在受造物中大体仍是潜能性的，因为每一物都有自己的准备（*isti‘dād*）或接受性（*qābiliyya*），没有一物能就其本身展示实在者。尽管每一物都是面，每一物也是帷幕；他／非他。
