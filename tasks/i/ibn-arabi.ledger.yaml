      Some of the implications of *tahqīq* can be understood when it is contrasted with its conceptual opposite, *taqlīd*, which means imitation or following authority. Knowledge can be divided into two sorts, which in Arabic were often called *naqlī*, transmitted, and ‘*aqlī*, intellectual; or *husūlī*, acquired, and *hudūrī*, presential. Transmitted knowledge is everything that one can learn only by imitating others, like language, culture, scripture, history, law, and science. Intellectual knowledge is what one comes to know by realizing its truth within oneself, like mathematics and metaphysics, even if these are initially learned by imitation. Mullā Sadrā calls intellectual knowledge “non-instrumental” (*al-ghayr al-ālī*), because it accrues to the soul not by the instruments of sense perception, imagination, and rational argumentation, but by the soul’s conformity with reason or intelligence (*‘aql*), which, in its fullest reality, is nothing but the shining light of the Real. In short, Ibn ‘Arabī, like many of the Islamic philosophers, holds that real knowledge cannot come from imitating others but must be discovered by realization, which is the actualization of the soul’s potential. Ibn ‘Arabī differs from most philosophers in maintaining that full realization can only be achieved by following in the footsteps of the prophets.
    step1: |-
      *tahqīq* 的一些意涵可通过与其概念对立面 *taqlīd*（模仿或追随权威）对照来理解。知识可分为两类，阿拉伯语常称之为 *naqlī*（传述的）与 *‘aqlī*（智识的）；或 *husūlī*（获得的）与 *hudūrī*（在场的）。传述知识是人只能通过模仿他人学到的一切，如语言、文化、经典、历史、法律与科学。智识知识是人通过在自身之内实现其真理而得知的东西，如数学与形而上学，即便这些最初是通过模仿学来的。穆拉·萨德拉把智识知识称为“非工具性的”（*al-ghayr al-ālī*），因为它之归于灵魂，不是靠感官知觉、想象与理性论证这些工具，而是靠灵魂与理性或智识（*‘aql*）的符合；后者在其最充分的实在中，无非是实在者闪耀的光。简言之，伊本·阿拉比与许多伊斯兰哲学家一样主张，真正的知识不能来自模仿他人，而必须通过实现去发现，而实现就是灵魂潜能的现实化。伊本·阿拉比与多数哲学家不同之处在于坚持：充分的实现只有循先知们的足迹才能达到。
