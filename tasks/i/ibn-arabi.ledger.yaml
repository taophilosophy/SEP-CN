      When Ibn ‘Arabī talks about imagination as one of the heart’s two eyes, he is using the language established by the philosophers when they spoke about the faculties of the soul. But he is more concerned with imagination’s ontological status, about which the early philosophers had little to say. Here his use of *khayāl* accords with its everyday meaning, which is closer to image than imagination. The word was employed to designate not only the mental faculty, but also mirror images, shadows, scarecrows, and everything that appears in dreams and visions; in this sense it is synonymous with the term *mithāl*, which was often preferred by later authors when speaking of its ontological status. Ibn ‘Arabī stresses that an image brings together two sides and unites them as one; it is both the same as and different from the two. A mirror image is both the mirror and the object that it reflects; or, it is neither the mirror nor the object. A dream is both the soul and what is seen; or, it is neither the soul nor what is seen. By nature images are/are not. In the eye of reason, a notion is either true or false. Imagination perceives notions as images and recognizes that they are simultaneously true and false, or neither true nor false. The implications for ontology become clear when we look at the three “worlds of imagination”.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      In the broadest sense of the term, imagination/image designates everything other than God, the entire cosmos inasmuch as it is contingent and evanescent. This is what Ibn ‘Arabī calls “Nondelimited Imagination” (*al-khayāl al-mutlaq*). Each of the infinite words articulated in the All-Merciful Breath discloses Existence in a limited form. Everything without exception is both God’s face (*wajh*), revealing certain divine attributes, and God’s veil (*hijāb*), concealing other attributes. Inasmuch as a thing exists, it can be nothing but that which is, the Real Existence; inasmuch as it does not exist, it must be other than the Real. Each thing, in Ibn ‘Arabī’s most succinct expression, is He/not He (*huwa/lā huwa*)—Real/unreal, Existence/nonexistence, Face/veil. “In reality, the ‘other’ is affirmed/not affirmed, He/not He” (Ibn ‘Arabī 1911, 2:501.4; Chittick 189, 115).
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      In a narrower sense of the word, imagination denotes what Corbin calls the *mundus imaginalis* (*‘ālam al-khayāl*). Like most traditions, Islam conceives of the cosmos as a hierarchy of worlds, usually two or three; the Koran contrasts the Unseen (*ghayb*) with the Visible (*shahāda*), and these are typically called the world of spirits and the world of bodies, or, in philosophical terms, the intelligible realm and the sensible realm. The Koran also speaks of “heaven, earth, and everything in between”, and one of Ibn ‘Arabī’s contributions was to bring out the full implications of the in-between domain, which in one respect is unseen, spiritual, and intelligible, and in another respect visible, corporeal, and sensible. This is precisely the *mundus imaginalis*, where spiritual beings are corporealized, as when Gabriel appeared in human form to the Virgin Mary; and where corporeal beings are spiritualized, as when bodily pleasure or pain is experienced in the posthumous realms. The *mundus imaginalis* is a real, external realm in the Cosmic Book, more real than the visible, sensible, physical realm, but less real than the invisible, intelligible, spiritual realm. Only its actual existence can account for angelic and demonic apparitions, bodily resurrection, visionary experience, and other nonphysical yet sensory phenomena that the earlier philosophers typically explained away. Ibn ‘Arabī’s foregrounding of the in-between realm was one of several factors that prevented Islamic philosophy from falling into the trap of a mind/body dichotomy or a dualistic worldview.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      The third world of imagination belongs to the microcosmic human book, in which it is identical with the soul or self (*nafs*), which is the meeting place of spirit (*rūh*) and body (*jism*). Human experience is always imaginal or soulish (*nafsānī*), which is to say that it is simultaneously spiritual and bodily. Human becoming wavers between spirit and body, light and darkness, wakefulness and sleep, knowledge and ignorance, virtue and vice. Only because the soul dwells in an in-between realm can it choose to strive for transformation and realization. Only as an imaginal reality can it travel “up” toward the luminosity of the spirit or “down” toward the darkness of matter.
