      In the broadest sense of the term, imagination/image designates everything other than God, the entire cosmos inasmuch as it is contingent and evanescent. This is what Ibn ‘Arabī calls “Nondelimited Imagination” (*al-khayāl al-mutlaq*). Each of the infinite words articulated in the All-Merciful Breath discloses Existence in a limited form. Everything without exception is both God’s face (*wajh*), revealing certain divine attributes, and God’s veil (*hijāb*), concealing other attributes. Inasmuch as a thing exists, it can be nothing but that which is, the Real Existence; inasmuch as it does not exist, it must be other than the Real. Each thing, in Ibn ‘Arabī’s most succinct expression, is He/not He (*huwa/lā huwa*)—Real/unreal, Existence/nonexistence, Face/veil. “In reality, the ‘other’ is affirmed/not affirmed, He/not He” (Ibn ‘Arabī 1911, 2:501.4; Chittick 189, 115).
    step1: |-
      就这个词最宽泛的意义而言，想象／影像指真主之外的一切，即整个宇宙，就其偶然且易逝而言。这就是伊本·阿拉比所称的“未限定想象”（*al-khayāl al-mutlaq*）。在至慈者气息中发出的无限词语，每一个都以有限形式显示存在。无一例外，万物既是真主的面（*wajh*），揭示某些神圣属性，又是真主的帷幕（*hijāb*），遮蔽另一些属性。就一物存在而言，它只能是存在者，即实在的存在；就它不存在而言，它必定是实在者之外的东西。用伊本·阿拉比最简洁的说法，每一物都是“他／非他”（*huwa/lā huwa*）——实在／非实在、存在／非存在、面／帷幕。“实际上，‘他者’既被肯定又不被肯定，既是他又不是他”（Ibn ‘Arabī 1911, 2:501.4; Chittick 1989, 115）。
