      ## 4. Things and Realities
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      The divine names designate the universal attributes that suffuse existence, such as life, knowledge, desire, power, speech, generosity, and justice (these are called “the seven leaders” of the names). These attributes are found in everything, because they pertain to the very Essence of the Real and accompany its self-disclosure. They remain largely potential in created things, however, because each thing has its own preparedness (*isti‘dād*) or receptivity (*qābiliyya*), and none can display the Real per se. Although each thing is a face, each is also a veil; He/not He.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      > God says, “The giving of your Lord can never be walled up” (Koran 17:20). In other words, it can never be withheld. God is saying that He gives constantly, while the loci receive in the measure of the realities of their preparedness. In the same way, you say that the sun spreads its rays over the existent things. It is not miserly with its light toward anything. The loci receive the light in the measure of their preparedness. (Ibn ‘Arabī 1911, 1:287.10; Chittick 1989, 91)[^chittick-1989]
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      What then determines the measure of preparedness? This goes back to a thing’s “reality” (*haqīqa*), its “whatness” or “quiddity” (*māhiyya*). This is determined not by our definitions, but by God’s knowledge, because he knows the things always and forever, whether or not they exist in the cosmos. Ibn ‘Arabī commonly refers to these known realities simply as “things” (*ashyā’*, pl. of *shay’*) or “entities” (*a‘yān*, pl. of *‘ayn*). They do not exist in themselves, because nothing truly exists but the Real Existence, so they are “the nonexistents” (*al-ma‘dūmāt*). In philosophical terms, they are “the possible things” (*al-mumkināt*), so they may or may not come into existence, in contrast to the Real Existence, which is necessary (*wājib*), so it cannot not exist.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      What exactly are things? They are the concomitants (*lawāzim*) of Existence, or the potentialities of manifestation latent in Infinite Possibility, or the never-ending delimitations of the Nondelimited. If a thing is found in the cosmos, it is a specific self-disclosure of Real Existence, a face of God, a word articulated in the All-Merciful Breath, a color made visible by the radiance of Light. Inasmuch as things appear, they display Existence and its attributes; inasmuch as their receptivity is delimited and defined, they act as veils. Each is a *barzakh*, an imaginal thing, simultaneously an image of Existence and an image of nonexistence.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      > There is no true existence that does not accept change except God, for there is nothing in realized Existence but God. As for everything other than He, that dwells in imaginal being…. Everything other than the Essence of the Real is intervening imagination and vanishing shadow. No created thing remains upon a single state in this world, the next world, and what is between the two, neither spirit, nor soul, nor anything other than the Essence of God. Rather, each continuously changes from form to form, constantly and forever. And imagination is nothing but this…. So the cosmos only became manifest within imagination…. It is it, and it is not it. (Ibn ‘Arabī 1911, 2:313.12; Chittick 1989, 118)[^chittick-1989]
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      The philosophers and theologians commonly debated God’s knowledge of the particulars. The Koran says repeatedly that God knows everything. “Not a leaf falls”, it says, “but God knows it” (6:59). Ibn ‘Arabī held that God’s knowledge of both universals and particulars pertains to the Essence and does not change. God knows the falling leaf always and forever, and when the time comes for it to fall, he says to it, “Fall!,” so it falls. Such are all things: “His only command, when He desires a thing, is to say to it ‘Be!’, and it comes to be” (Koran 36:82).
