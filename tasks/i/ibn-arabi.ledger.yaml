      In a narrower sense of the word, imagination denotes what Corbin calls the *mundus imaginalis* (*‘ālam al-khayāl*). Like most traditions, Islam conceives of the cosmos as a hierarchy of worlds, usually two or three; the Koran contrasts the Unseen (*ghayb*) with the Visible (*shahāda*), and these are typically called the world of spirits and the world of bodies, or, in philosophical terms, the intelligible realm and the sensible realm. The Koran also speaks of “heaven, earth, and everything in between”, and one of Ibn ‘Arabī’s contributions was to bring out the full implications of the in-between domain, which in one respect is unseen, spiritual, and intelligible, and in another respect visible, corporeal, and sensible. This is precisely the *mundus imaginalis*, where spiritual beings are corporealized, as when Gabriel appeared in human form to the Virgin Mary; and where corporeal beings are spiritualized, as when bodily pleasure or pain is experienced in the posthumous realms. The *mundus imaginalis* is a real, external realm in the Cosmic Book, more real than the visible, sensible, physical realm, but less real than the invisible, intelligible, spiritual realm. Only its actual existence can account for angelic and demonic apparitions, bodily resurrection, visionary experience, and other nonphysical yet sensory phenomena that the earlier philosophers typically explained away. Ibn ‘Arabī’s foregrounding of the in-between realm was one of several factors that prevented Islamic philosophy from falling into the trap of a mind/body dichotomy or a dualistic worldview.
    step1: |-
      就较窄的意义而言，想象指科尔宾所谓的 *mundus imaginalis*（*‘ālam al-khayāl*）。像多数传统一样，伊斯兰把宇宙设想为诸世界的层级，通常为两个或三个；《古兰经》以“幽玄”（*ghayb*）与“可见”（*shahāda*）相对，二者通常被称为精神世界与身体世界，或用哲学语言说，可理知领域与可感领域。《古兰经》也谈到“天、地以及其间的一切”；伊本·阿拉比的贡献之一，是充分揭示中间领域的意涵：它一方面是不可见的、精神的、可理知的，另一方面又是可见的、形体的、可感的。这正是 *mundus imaginalis*：精神存在在此形体化，如加百列以人形向童贞玛利亚显现；形体存在在此精神化，如身体苦乐在后世诸领域中经验到。*mundus imaginalis* 是宇宙之书中一个真实的外在领域，比可见、可感、物理的领域更实在，但比不可见、可理知、精神的领域较不实在。唯有其实际存在，才能解释天使与恶魔的显现、身体复活、异象经验，以及早期哲学家通常解释掉的非物理却感觉性的现象。伊本·阿拉比把中间领域置于前景，是阻止伊斯兰哲学落入心物二分或二元论世界观陷阱的若干因素之一。
