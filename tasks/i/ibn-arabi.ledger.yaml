      The philosophers and theologians commonly debated God’s knowledge of the particulars. The Koran says repeatedly that God knows everything. “Not a leaf falls”, it says, “but God knows it” (6:59). Ibn ‘Arabī held that God’s knowledge of both universals and particulars pertains to the Essence and does not change. God knows the falling leaf always and forever, and when the time comes for it to fall, he says to it, “Fall!,” so it falls. Such are all things: “His only command, when He desires a thing, is to say to it ‘Be!’, and it comes to be” (Koran 36:82).
    step1: |-
      哲学家与神学家常争论真主对个别物的知识。《古兰经》反复说真主知晓万物。“没有一片叶子落下，”它说，“除非真主知道它”（6:59）。伊本·阿拉比主张，真主对共相与个别物的知识属于本质，并不变化。真主永远知晓那片落下的叶子；当它该落下时，他对它说“落！”，它便落下。万物皆如此：“当他意欲一物时，他的命令只是对它说‘有！’，它便有了”（《古兰经》36:82）。
