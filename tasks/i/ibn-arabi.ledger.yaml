      When the experts in Kalam discussed the Return, they tried to prove the accuracy of the Koranic depictions of the Day of Resurrection, hell, and paradise, mainly by appealing to the authority of God’s word. They had little to say about the actual nature of the soul, the structure of the cosmos, or the ontological status of the posthumous realms. In contrast, both philosophers and Sufis were intensely interested in these issues, as well as in the complementary question of the Origin (*mabda’*). Origin and Return became major themes in both schools of thought, but, in contrast to the philosophers, Sufis highlighted the exemplary role of Muhammad. Thus, for example, they drew a favorite image from a Koranic verse related to the Prophet’s “night journey” (*isrā’*, also called the *mi‘rāj* or “ladder” or “ascension”), when he was taken up through the heavens and beyond to encounter God: “He was two-bows’-length away, or closer” (53:9). In Arabic the word *qaws* or bow, like Latin *arcus*, also means the arc of a circle, so the two bows can be understood as two arcs. These came to be called “the descending arc” (*al-qaws al-nuzūlī*), that is, the path of increasing delimitation and darkness that leads away from the Origin, and “the ascending arc” (*al-qaws al-su‘ūdī*), the ever-increasing disengagement (*tajarrud*) and luminosity of the soul on the path of the Return.
    step1: |-
      当凯拉姆专家讨论回归时，他们主要诉诸真主之言的权威，试图证明《古兰经》对复活日、地狱与天堂描绘的准确。他们对灵魂的实际本性、宇宙的结构或后世诸领域的本体论地位少有论述。相反，哲学家与苏非对这些问题以及与之互补的起源（*mabda’*）问题都极感兴趣。起源与回归成为两个思想流派的主要主题，但与哲学家不同，苏非凸显穆罕默德的典范角色。例如，他们从与先知“夜行”（*isrā’*，又称 *mi‘rāj*“梯子”或“升天”）相关的经文里取来一幅钟爱的意象：他被带过诸天、更远，去与真主相会：“他相距两弓之遥，或更近”（53:9）。在阿拉伯语中，*qaws*（弓）一词如拉丁语 *arcus* 一样，也指圆的弧，故两弓可理解为两弧。它们后来被称为“下降之弧”（*al-qaws al-nuzūlī*），即离开起源、限定与黑暗日益增加的道路；以及“上升之弧”（*al-qaws al-su‘ūdī*），即灵魂在回归之路上日益增长的超脱（*tajarrud*）与光明。
