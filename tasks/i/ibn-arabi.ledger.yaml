      Human embodiment at the visible level represents an essential stage in the manifestation of the Reality of Realities, but realization of that Reality takes place within the soul, that is, on the imaginal and spiritual levels. The possibilities of manifestation represented by plants and animals are relatively limited; external appearance reveals their secrets to observers, and no one confuses a cabbage with a carrot, or a horse with a rabbit. But such is not the case with human beings, whose external uniformity conceals an unlimited inner diversity. The imaginal and spiritual contours of human souls, their awareness and character traits, can never be judged by the body’s appearance; human virtue and vice pertain to unseen realms. Culture, art, literature, politics, science, technology, and other peculiarly human accomplishments are the soul’s exteriorizations. Ibn ‘Arabī is not concerned, however, with every human possibility, because the paths that lead away from the full and balanced realization of the divine form are legion. Rather, he wants to delineate the broad contours of the perfections of deiformity, for it is these that lead to harmony with the Real in the posthumous realms. Even on this level, however, it is impossible even to enumerate these perfections, given that, as he tells us, their archetypes number 124,000, in keeping with the number of prophets from the time of Adam.
    step1: TBD
    step2: TBD
