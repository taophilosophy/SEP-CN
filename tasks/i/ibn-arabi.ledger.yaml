      库纳维使一个技术术语 *ta‘ayyun*（“实体化”）通行起来，它在伊本·阿拉比之后关于存在的讨论中起重要作用。该词源自 *‘ayn*（“实体”），意为成为实体。既然实体就是事物，人们或可把它译为“物化”，但并非指人的认知过程，而是指未限定存在在把自己显示为真主之外一切的过程中被确定、限制、界定并“事物化”的方式。于是万物都是未限定实在者的实体化、限定或确定；未限定实在者则被称为“非实体化”（*al-lā ta‘ayyun*）。至于实在之实在，它是第一实体化，因为其他一切实体化都随其后。
