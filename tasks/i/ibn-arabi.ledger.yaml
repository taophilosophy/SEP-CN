      Ibn ‘Arabī’s basic project is to map out the possibilities of human becoming, to clarify the distinction between *haqq* and *bātil*—truth and falsehood, reality and unreality, right and wrong—and to point his readers toward the achievement of perfection, that is, realization of the Real “to the extent of human capacity” (‘*alā qadr tāqat al-bashar*), as the philosophers liked to put it. This in turn requires becoming characterized by the divine names (*al-takhalluq bi asmā’ Allāh*), a process discussed by al-Ghazālī among others and called by philosophers like Avicenna *al-ta’alluh*, being like unto God, or deiformity. God created human beings in the form of the name God (Allāh) itself, which is called “the all-comprehensive name” (*al-ism al-jāmi‘*), because it is the referent of all other divine names. Realization is then the process of actualizing knowledge of the Three Books and bringing the soul into perfect harmony with the Real, a harmony that becomes apparent in the transformation of character and the flowering of virtue. The science of “ethics” (*akhlāq*, pl. of *khuluq*, character) does not concern itself simply with knowledge of right behavior, but aims rather at understanding the soul’s rootedness in the divine names and mapping out the path of becoming characterized by them. The Koran sets up Muhammad as the perfect model here with the words it directs at him, “You have a magnificent character [*khuluq ‘azīm*]” (68:4). This can be nothing but the full realization of the divine speech, “the magnificent Koran” (*al-qur’ān al-‘azīm*, 15:87). According to Ibn ‘Arabī, this is why Muhammad’s wife ‘ā’isha said about him, “His character was the Koran.” (Chittick 1989, Chapter 16; Chittick 2022b)[^chittick-1989][^chittick-2022b].
    step1: |-
      伊本·阿拉比的基本计划是勾勒人之生成的各种可能，阐明 *haqq* 与 *bātil*——真理与虚妄、实在与非实在、正当与不当——的区分，并引导读者走向完美之境，即如哲学家们爱说的，“按人力所及”（*‘alā qadr tāqat al-bashar*）实现实在者。这又要求以神圣名字为特质（*al-takhalluq bi asmā’ Allāh*）；安萨里等人讨论过这一过程，阿维森纳等哲学家称之为 *al-ta’alluh*，即肖似神，或似神性。真主按神（Allāh）这一名字本身的形象创造人；此名被称为“总括之名”（*al-ism al-jāmi‘*），因为它是其他一切神圣名字的所指。于是实现就是这样一个过程：现实化对三部书的知识，使灵魂与实在者达至完美和谐；这种和谐显现在品格的转化与德性的开花中。“伦理学”（*akhlāq*，*khuluq*“品格”的复数）这门学问并不只关心正当行为的知识，而更旨在理解灵魂植根于神圣名字，并勾画以之为特质的生成之路。《古兰经》以对穆罕默德说的话把他立为这里的完美典范：“你确具有一种伟大的品格［*khuluq ‘azīm*］”（68:4）。这只能是神圣言语“伟大的《古兰经》”（*al-qur’ān al-‘azīm*, 15:87）的充分实现。据伊本·阿拉比，这就是为什么穆罕默德的妻子阿伊莎这样说他：“他的品格就是《古兰经》。”（Chittick 1989, Chapter 16; Chittick 2022b）[^chittick-1989][^chittick-2022b]。
