      ## 5. The Return
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      After *tawhīd*, the remaining two principles of Islamic faith are prophecy (*nubuwwa*) and the Return (*ma‘ād*), a word that is often translated as eschatology. For both philosophers and Sufis, discussion of prophecy focused on human deiformity, and the issues they raised led theologians and jurists to accuse them of claiming to be greater than the prophets; Ibn ‘Arabī in particular was the center of a long controversy concerning the relationship between prophets and saints (Chodkiewicz 1993b; Nair 2025)[^chodkiewicz-1993b][^nair-2025].
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Both philosophers and Sufis also had a great deal to say about the Return, which was viewed in two respects: compulsory and voluntary. From the standpoint of the compulsory Return, the cosmos unfolds following its own ineluctable laws, and human beings go back to God in a series of stages that mirror the stages of cosmogenesis. From the standpoint of the voluntary Return, free will allows human beings to play a role in determining the trajectory of their own becoming. To a certain degree they are co-creators of their own souls and the posthumous realms, which are experienced in karmic terms, that is, as the result of a chain of causality set in motion by their own individual understandings, character traits, and activities. Ibn ‘Arabī marks a watershed in the discussion of both sorts of Return, not least because his explications of the *mundus imaginalis* allowed him to provide rational arguments for issues like bodily resurrection that, according to Avicenna, could not be understood by reason but can only be accepted on the basis of faith (Avicenna, *al-Shifā’*, 347–48; *al-Najāt*, 3:291). Ibn ‘Arabī’s leads were expanded on by later thinkers, most exhaustively by Mullā Sadrā in the fourth book of his magnum opus, *al-Asfār al-arba‘a*, on the topic of the soul and its unfolding (Mullā Sadrā 2008)[^mullā-2008].
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      ### 5.1 The Circle of Existence
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      When the experts in Kalam discussed the Return, they tried to prove the accuracy of the Koranic depictions of the Day of Resurrection, hell, and paradise, mainly by appealing to the authority of God’s word. They had little to say about the actual nature of the soul, the structure of the cosmos, or the ontological status of the posthumous realms. In contrast, both philosophers and Sufis were intensely interested in these issues, as well as in the complementary question of the Origin (*mabda’*). Origin and Return became major themes in both schools of thought, but, in contrast to the philosophers, Sufis highlighted the exemplary role of Muhammad. Thus, for example, they drew a favorite image from a Koranic verse related to the Prophet’s “night journey” (*isrā’*, also called the *mi‘rāj* or “ladder” or “ascension”), when he was taken up through the heavens and beyond to encounter God: “He was two-bows’-length away, or closer” (53:9). In Arabic the word *qaws* or bow, like Latin *arcus*, also means the arc of a circle, so the two bows can be understood as two arcs. These came to be called “the descending arc” (*al-qaws al-nuzūlī*), that is, the path of increasing delimitation and darkness that leads away from the Origin, and “the ascending arc” (*al-qaws al-su‘ūdī*), the ever-increasing disengagement (*tajarrud*) and luminosity of the soul on the path of the Return.
    step1: TBD
    step2: TBD
