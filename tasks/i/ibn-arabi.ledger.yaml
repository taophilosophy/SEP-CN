      Names are basic to the quest for deiformity because the Real in itself, in its very Essence (*dhāt*), is known only to itself. “Others” (*ghayr*), which are the signs/verses written out in the Three Books, know the Essence only inasmuch as it reveals itself to them. In other words, although everything is a “face” (*wajh*) of God—“Wherever you turn, there is God’s face” (Koran 2:115)—to distinguish among the omnipresent faces we need to know their names and recognize their *haqq*s.
    step1: |-
      名字是探求似神性的基础，因为实在者本身、在其本质（*dhāt*）中，只为自身所知。“他者”（*ghayr*）——写在三部书中的迹象／节文——只在本质向其显现的范围内认识本质。换言之，尽管万物都是真主的“面”（*wajh*）——“无论你们转向何处，那里都有真主的面”（《古兰经》2:115）——要在无处不在的各面之间作出区分，我们需要知道它们的名字并认识它们的 *haqq*。
    step2: |-
