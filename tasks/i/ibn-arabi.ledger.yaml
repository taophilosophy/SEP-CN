  - id: 8
    kind: body
    source: |-
      Ibn ‘Arabī wrote many scores of books and treatises, though scholars have not been able to establish a definitive list (see the link to The Writings of Ibn Arabi [Other Internet Resources]). *Ringstones* became the standard text to transmit his teachings and, during the next six centuries, was the object of more than one hundred commentaries. Among his talented disciples, the most influential was his stepson Sadr al-Dīn Qūnawī (1210–74), who began the process of systematizing his teachings and elucidating his perspective in conversation with contemporary philosophy, even initiating a correspondence with Nasīr al-Dīn al-Tūsī, the important reviver of Avicenna (Qūnawī, 1995*)*. Ibn ‘Arabī’s vast influence in the later tradition was mediated largely by Qūnawī and his major students, such as Sa‘īd al-Dīn Farghānī (Chittick 2023, 2025)[^chittick-2023], ‘Afīf al-Dīn al-Tilimsānī (2023), and Muʾayyid al-Dīn Jandī (1982), the last of whom wrote an extensive commentary on *Ringstones*.
    step1: |-
