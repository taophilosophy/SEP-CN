      The Koran often speaks of God’s “names” (*asmā’*), and it mentions a good number of them—not “ninety-nine”, as is traditionally said, but anywhere between seventy and twice as many, depending on the criteria used in counting. These names, which are often called “attributes” (*sifāt*), provide the points of reference for Islamic theology. Ibn ‘Arabī distinguishes between “the names of the names” (*asmā’ al-asmā’*), which are the names voiced in human language, and the names in themselves, which are realities in divinis. Theologians wrote many books listing the names and explaining their significance for God, the cosmos, and the human soul. Ibn ‘Arabī devoted a book-length chapter of the *Openings* specifically to them, and he composed an independent treatise summarizing their role in human becoming (Ibn ‘Arabī, *Kitāb kashf al-ma‘nā* 1997)[^kitāb-1997].
    step1: |-
      《古兰经》常谈到真主的“名字”（*asmā’*），并提及相当多的名字——不是传统所说的“九十九个”，而是七十到两倍于此之间，取决于计数的标准。这些名字常被称为“属性”（*sifāt*），为伊斯兰神学提供参照点。伊本·阿拉比区分“名字的名字”（*asmā’ al-asmā’）——以人类语言发出的名字——与名字本身，即神内的实在。神学家写了许多书，列举这些名字并解释它们对真主、宇宙与人的灵魂的意义。伊本·阿拉比在《开示》中以整整一章的篇幅专门讨论它们，并撰写了一部独立论著，概述它们在人之生成中的角色（Ibn ‘Arabī, *Kitāb kashf al-ma‘nā* 1997）[^kitāb-1997]。
