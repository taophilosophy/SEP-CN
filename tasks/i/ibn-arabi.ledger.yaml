  - id: 6
    kind: body
    source: |-
      Ibn ‘Arabī referred to himself with fuller versions of his name, such as Abū ‘Abdallāh Muhammad ibn ‘Alī ibn al-‘Arabī al-Tā’ī al-Hātimī (the last three names indicating his noble Arab lineage). He was born in Murcia in 1165 to the family of a minor official and received the standard education of a literatus, without any special attention to religious topics. In his early teens he underwent a visionary conversion “at the hands of Jesus” (albeit the Jesus of the Koran), and this resulted in an “opening” (*futūh*) of his soul toward the divine realm. Shortly thereafter, in about 1180, his father took him to meet his friend Averroes. Ibn ‘Arabī recounts an elliptical conversation in which he explained to the philosopher the limits of rational perception. Corbin has taken this event as a symbolic parting of ways between Islam and the West: with the help of Latin Averroism, Western thinkers were soon to pursue an exclusively rationalistic path leading “to the conflict between theology and philosophy, between faith and knowledge, between symbol and history” (Corbin 1969, 13). In contrast, Muslim intellectuals tended to ignore Averroes, though Avicenna, Suhrawardī, and other philosophers continued to be read, annotated, and improved upon. At the same time, no one could fail to notice Ibn ‘Arabī’s challenge to merely rational understanding, and many Muslim philosophers followed paths that undertook to harmonize reason, mystical intuition, and revelation.
    step1: |-
      伊本·阿拉比以更完整的名字称呼自己，如阿布·阿卜杜拉·穆罕默德·伊本·阿里·伊本·阿拉比·泰伊·哈提米（最后三个名字标示其高贵的阿拉伯世系）。他 1165 年生于穆尔西亚一个小官吏之家，受过文人的标准教育，未特别留意宗教题材。十三四岁时，他经历了一场幻象性的皈依，“在耶稣之手”（尽管是《古兰经》中的耶稣）；这使其灵魂向神圣领域“开启”（*futūḥ*）。此后不久，约 1180 年，父亲带他去见朋友阿威罗伊。伊本·阿拉比记述了一场意蕴深远的谈话：他向这位哲学家解释理性知觉的界限。科尔宾把这一事件当作伊斯兰与西方分道扬镳的象征：借拉丁阿威罗伊主义之助，西方思想家不久便走上纯然理性主义的道路，通向“神学与哲学的冲突、信仰与知识的冲突、象征与历史的冲突”（Corbin 1969, 13）。与此相反，穆斯林知识分子往往不理会阿威罗伊，尽管阿维森纳、苏赫拉瓦尔迪与其他哲学家仍被阅读、批注与改进。同时，无人会注意不到伊本·阿拉比对纯理性理解的挑战；许多穆斯林哲学家走上寻求协调理性、神秘直觉与启示的道路。
