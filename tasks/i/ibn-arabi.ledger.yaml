      The pivotal importance of the written Koran rests on the fact that it voices the divine names and the signs/verses in human language, thereby providing the key to deciphering the other two books. By interpreting the Koran, we also interpret the cosmos and ourselves. Ibn ‘Arabī typically begins any discussion with a verse or two. Then he proceeds to draw out meanings that have a bearing on whatever the context may be. He insists that readings must conform to the Arabic language as spoken by the original recipients of the Book, but more often than not he offers surprising and highly original interpretations. On close examination, these are seen to be consistent with the language, even when they fly in the face of common sense. It is precisely his ability to stick to the transmitted sources and simultaneously bring out new meanings—which, once expressed, seem almost self-evident—that has convinced the later tradition of his exceptional mastery. He tells us that the author of the Koran intends every meaning understood by every reader, and he reminds us that human authors cannot have the same intention. Moreover, he tells us that if someone re-reads a Koranic verse and sees exactly the same meaning that he saw the previous time, he has not read it “properly”—that is, in keeping with the *haqq* of the divine speech—for the meanings disclosed in the Three Books are never repeated (Chittick 2005)[^chittick-2005].
    step1: |-
      书写《古兰经》的关键重要性在于：它以人类语言发出神圣名字与迹象／节文，从而提供解读另外两部书的钥匙。通过解释《古兰经》，我们也解释宇宙与我们自身。伊本·阿拉比通常以一两节经文开始任何讨论，然后引出与当下语境相关的意义。他坚持读解必须符合《古兰经》最初接受者所说的阿拉伯语，但他往往给出令人惊讶、极具原创性的解释。细察之下，这些解释与语言一致，即便它们与常识相悖。正是他既能坚守传述源头、又能同时引出新意义——这些意义一经表达，便几乎自明——的能力，使后世传统确信其非凡造诣。他告诉我们，《古兰经》的作者意欲每一位读者所理解的每一种意义；他提醒我们，人类作者不可能有同样的意图。此外，他说，若某人重读一节经文，所见的含义与上次完全相同，他就没有“恰当地”读它——即没有依神圣言语的 *haqq* 去读——因为三部书中所揭示的意义从不重复（Chittick 2005）[^chittick-2005]。
