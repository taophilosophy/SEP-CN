      From earliest times, Muslim philosophers recognized that *haqq*—truth, reality, rightness—was basic to the quest for wisdom and the happiness of the soul. Already al-Kindī, at the beginning of his most famous work, *On First Philosophy*, wrote that the goal of the philosopher is to reach *haqq* and to practice *haqq*. Scholars translate the word here and in similar contexts as “truth”, but doing so suggests that the issue was logical and epistemological, when in fact it was ontological and existential; for the philosophers, the goal of the quest for wisdom was the transformation of the soul, and that could not be achieved simply by logic and argumentation. Al-Kindī’s statement is an early definition of *tahqīq*, and the term itself became common in philosophical texts, though it seldom had the same urgency that it has in Ibn ‘Arabī’s works. For him it is the guiding principle of all knowledge and activity and the highest goal to which a human soul can aspire. It means knowing the truth and reality of the cosmos, the soul, and human affairs on the basis of the Supreme Reality, *al-Haqq*; knowing the Supreme Reality inasmuch as it reveals itself in the *haqq*s of all things; and acting in keeping with these *haqq*s at every moment and in every situation. In short, the “realizers” (*muhaqqiqūn*) are those who fully actualize the spiritual, cosmic, and divine potential of the soul (Chittick 2005, chap. 5)[^chittick-2005].
    step1: |-
      自最早时期起，穆斯林哲学家就认识到，*haqq*——真理、实在、正当——是探求智慧与灵魂幸福的基础。金迪已在其最著名作品《论第一哲学》的开篇写道，哲学家的目标是达到 *haqq* 并实践 *haqq*。学者们把此处的这个词以及类似语境中的它译为“真理”，但这样做会暗示问题是逻辑的与认识论的，而实际上它是本体论的与存在性的；对哲学家而言，探求智慧的目标是灵魂的转化，而这不能仅靠逻辑与论证达成。金迪的陈述是对 *tahqīq* 的早期定义，该词本身也在哲学文本中通行起来，尽管它很少具有在伊本·阿拉比著作中那样的紧迫性。对他而言，它是一切知识与活动的指导原则，是人的灵魂所能企盼的最高目标。它意味着以最高实在 *al-Haqq* 为基础，认识宇宙、灵魂与人事的真理与实在；认识最高实在在其于万物之 *haqq* 中显现自身的范围内；并在每一时刻、每一情境中依这些 *haqq* 行动。简言之，“实现者”（*muhaqqiqūn*）是那些充分实现灵魂的精神、宇宙与神圣潜能的人（Chittick 2005, chap. 5）[^chittick-2005]。
