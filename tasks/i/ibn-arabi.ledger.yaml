    source: |-
      Ibn ‘Arabī studied the Islamic sciences with numerous teachers in Andalus and North Africa. In 1201 he left the Muslim West to perform the pilgrimage to Mecca, traveled extensively in Iraq and Anatolia, and finally settled down in Damascus in 1223, where he trained disciples and wrote prolifically until his death in November 1240.
    step1: |-
      伊本·阿拉比在安达卢斯与北非随众多教师学习伊斯兰诸科学。1201 年，他离开穆斯林西方去麦加朝觐，在伊拉克与安纳托利亚广泛旅行，1223 年最终定居大马士革，在那里培养弟子并大量写作，直至 1240 年 11 月去世。
