      ## 6. Human Perfection
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      Like the philosophers, Ibn ‘Arabī sees the human soul as an unlimited potential and understands the goal of life to lie in the actualization of that potential. Avicenna sums up the philosophical view in a passage found in two of his major works:
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      > The perfection specific to the rational soul is for it to become an intellective world within which is represented the form of the Whole, the arrangement intelligible in the Whole, and the good that is effused upon the Whole…. It turns into an intelligible world, parallel with the entire existent world, and witnesses what is unconditioned comeliness, unconditioned good, and real, unconditioned beauty while it is unified with it, imprinted with its likeness and guise, strung upon its thread, and coming to be of its substance. (Avicenna, *al-Shifā’*, 350; Avicenna, *al-Najāt*, 3:293)
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      Ibn ‘Arabī agrees with this general picture, but he considers it barren, because it fails to take into account those dimensions of reality—the vast majority of dimensions, as he sees it—that do not properly belong to the world of intellection; all the intermediary realms, not to speak of the sensible realm itself, are essentially imaginal, not intelligible. He insists, in fact, that “Imagination is the widest known thing” because “it exercises its properties through its reality over every thing and non-thing. It gives form to absolute nonexistence, the impossible, the Necessary, and possibility; it makes existence nonexistent and nonexistence existent” (Ibn ‘Arabī 1911, 1:306.17, 306.6; Chittick 1989, 122)[^chittick-1989].
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In several passages, Ibn ‘Arabī describes the ascent of the soul on the ladder to God. One of these is Chapter 167 of the *Openings*, called “On the true knowledge of the alchemy of happiness”. Here he contrasts the parallel ladders of a philosopher and a follower of a prophet. In each stage of the ascent, the follower meets what Muhammad met in his Night Journey, but the philosopher finds only what his knowledge of the natural world allows him to find; in short, when seekers pass through the ascending realms of the *mundus imaginalis*, they gain what accords with their own cognitive preparation. In the first heaven, for example, the follower meets the prophet Adam, whom God had “taught all the names”, and he benefits from Adam’s omniscience, but the philosopher meets only the moon. In each successive level, the follower encounters a prophet and assimilates his knowledge, but the philosopher finds the celestial spheres (Ibn ‘Arabī, *al-Futūhāt*, Chapter 167, 1997, 2019). It is worth noting that Avicenna himself had written an interpretation of Muhammad’s night journey in philosophical terms that runs parallel to what Ibn ‘Arabī ascribes to the philosopher here, but the text was in Persian, so Ibn ‘Arabī would not have seen it (Heath 1992)[^heath-1992].
    step1: TBD
    step2: TBD
