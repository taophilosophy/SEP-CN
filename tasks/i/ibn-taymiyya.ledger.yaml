      ## 2. 本体论
  - id: 7
    kind: body
    source: |-
      Contrary to the dominant currents of post-classical Islamic thought, Ibn Taymiyya’s ontology is physicalist or materialist. All existents, including God, are concrete particulars capable of being perceived (*maḥsūs*) by at least one of the five senses of sight, hearing, smell, taste, and touch. Whatever is not susceptible to perception by the senses does not exist. Even existents in the unseen world (*ʿālam al-ghayb*) are accessible to sense perception under certain conditions. The unseen, according to Ibn Taymiyya, is not an intellectual world or a world of immaterial images. Instead, the unseen world, like the seen, consists of concrete particulars with temporal and spatial dimensions that may be perceived by the senses when unimpeded. Among other things, the unseen includes God, angels, the afterlife, and the human soul, which is distinct from the human body but not immaterial. Some things in the unseen world have already been perceived in this life by prophets in visions and dreams, and believers will see God in front of them with their eyes in the hereafter. God is in fact more seeable than any other existent because God’s existence is more perfect than the existence of anything else. Conversely, according to Ibn Taymiyya, the incorporeal God of *kalām* theology and philosophers like Ibn Sīnā (Avicenna, d. 1037) and Ibn Rushd is tantamount to a nonexistent. That God is no more than a concept in the mind (Moustafa 2017; Suleiman 2019: 98–102; El-Tobgui 2020: 230–5, 251–2; Hoover 2022: 647–8)[^el-tobgui-2020][^hoover-2022][^moustafa-2017][^suleiman-2019].
    step1: |-
      与后古典伊斯兰思想的主流相反，伊本·泰米叶的本体论是物理主义或唯物主义的。一切存在者，包括真主，都是具体个别物，至少能被五种感官（视、听、嗅、味、触）之一感知（*maḥsūs*）。凡不能被感官感知者，便不存在。即便幽玄世界（*ʿālam al-ghayb*）中的存在者，在特定条件下也可被感官感知。在伊本·泰米叶看来，幽玄并非理智世界或无形影像的世界。相反，幽玄世界与可见世界一样，由具有时间与空间维度的具体个别物构成，在不受阻碍时可被感官感知。除其他外，幽玄包括真主、天使、后世与人的灵魂；灵魂区别于人的身体，但并非无形。幽玄世界中的某些事物，已在此生由先知在异象与梦境中感知；信士在后世将用眼睛看见真主在面前。事实上，真主比任何其他存在者更可见，因为真主的存在比任何其他事物的存在更完满。反之，在伊本·泰米叶看来，凯拉姆神学以及伊本·西那（阿维森纳，卒于 1037）与伊本·鲁世德等哲学家所说的无形体真主，无异于不存在者。那样的真主不过是心中的概念（Moustafa 2017; Suleiman 2019: 98–102; El-Tobgui 2020: 230–5, 251–2; Hoover 2022: 647–8）[^el-tobgui-2020][^hoover-2022][^moustafa-2017][^suleiman-2019]。
