      It has been observed that Ibn Taymiyya’s ethics of God’s creative and commanding activity follows the utilitarian maxim of the greatest happiness for the greatest number (Vasalou 2016: 172)[^vasalou-2016]. This is readily apparent in Ibn Taymiyya’s theodicy: God continuously produces the greatest possible benefit for the greatest number by creating the best-of-all-possible-worlds. Ibn Taymiyya’s metaethical theory on the human plane mirrors this divine utilitarianism. He rejects the moral rationalism of the Muʿtazilī *kalām* theologians who argue that acts are objectively good or bad in themselves such that God commands an act because it is good or forbids an act because it is bad. He also rebuffs classical Ashʿarī divine command theory in which the moral values of acts are determined solely by God’s will such that an act is good only because God commands it. Ibn Taymiyya instead follows the consequentialist inclinations of post-classical Ashʿarīs like Fakhr al-Dīn al-Rāzī. The moral values of acts depend on the outcomes of those acts, whether they produce pleasure or pain, benefit or detriment, profit or harm. The goodness of an act depends on the degree to which it is advantageous to the actor or wider society, and rational human communities should seek to maximize their overall benefit. The role of God’s law then is to point humankind to what is of ultimate benefit in both this life and the hereafter, namely, worshipping God alone according to God’s law (Hoover 2007: 34–9; Vasalou 2016: 11–136)[^hoover-2007][^vasalou-2016].
    step1: |-
      有人指出，伊本·泰米叶关于真主创造与命令活动的伦理学，遵循“最大多数人的最大幸福”这一功利主义格言（Vasalou 2016: 172）[^vasalou-2016]。这在其神义论中显而易见：真主通过创造一切可能世界中最好的世界，不断为最大多数人产生最大可能利益。伊本·泰米叶在人类层面的元伦理学理论映照这种神圣功利主义。他拒绝穆尔太齐赖派凯拉姆神学家的道德理性主义，后者主张行为本身客观地善恶，故真主因某行为善而命令它、因某行为恶而禁止它。他也拒绝古典艾什尔里派神命论，即行为的道德价值完全由真主意愿决定，故某行为善只因真主命令它。伊本·泰米叶反而跟随法赫尔·丁·拉齐等后古典艾什尔里派的后果论倾向。行为的道德价值取决于行为后果，无论产生快乐或痛苦、利益或损害、收益或伤害。行为的善取决于它对行动者或更广社会的有利程度，理性的人类共同体应寻求最大化整体利益。于是神法的作用，是指引人类认识今生与后世中具有终极利益者，即按神法只崇拜真主（Hoover 2007: 34–9; Vasalou 2016: 11–136）[^hoover-2007][^vasalou-2016]。
