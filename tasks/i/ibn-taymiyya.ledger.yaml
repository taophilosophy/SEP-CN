    source: |-
      Ibn Taymiyya willingness to discuss the meanings of God’s attributes opens the door to theological explanation and argumentation. With his traditionalist sensibility, he often reminds readers that the modality and reality of God’s names and attributes cannot be known. He also prefers to speak of God only in words found in revealed texts. Nonetheless, he permits engaging the terminologies of theological opponents as needed to clarify the meanings of the revelation, and he justifies this by analogy to the permission to translate the Qurʾān into other languages to convey its message. He condemns the *kalām* theologians for introducing innovated and non-scriptural technical terms like substance (*jawhar*), accident (*ʿaraḍ*), body (*jism*), and spatial extension (*taḥayyuz*) into theological discourse, but he permits using such terms when necessary to translate the revelation into the idiom of the day (Hoover with Mahajneh 2018)[^hoover-2018][^hoover-2018-2].
    step1: |-
      伊本·泰米叶愿意讨论真主属性的意义，这为神学解释与论证打开了大门。以其传统主义感受力，他常提醒读者，真主尊名与属性的样式与实在不可知。他也宁愿只用启示文本中的词语谈论真主。尽管如此，他允许在需要澄清启示意义时使用神学对手的术语，并以允许把《古兰经》译成其他语言以传达其信息为类比来辩护。他谴责凯拉姆神学家把实体（*jawhar*）、偶性（*ʿaraḍ*）、物体（*jism*）与空间延展（*taḥayyuz*）等创新且非经文的术语引入神学话语，但允许在必要时用这类术语把启示译成当时的习语（Hoover with Mahajneh 2018）[^hoover-2018][^hoover-2018-2]。
