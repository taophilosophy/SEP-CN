      A major stream of theological traditionalism prohibits debating with *kalām* theologians and shuns all attempts to understand God’s attributes. This traditionalist noncognitivism deems the meaning (*maʿnā*) and the condition or modality (*kayfiyya*) of the attributes to be entirely inaccessible to human comprehension. While the verbal forms of “hearing” and “hand” are the same when applied to God and creatures, the meanings of these words when applied to God are unknowable and must not be probed (Hoover with Mahajneh 2018: 43–7)[^hoover-2018][^hoover-2018-2].
    step1: |-
      神学传统主义的一大潮流禁止与凯拉姆神学家辩论，并回避一切理解真主属性的尝试。这种传统主义非认知主义认为，属性的意义（*maʿnā*）与状况或样式（*kayfiyya*）完全非人类理解所能及。尽管“听”与“手”的语词形式在用于真主与受造物时相同，但这些词用于真主时的意义不可知，且不得探究（Hoover with Mahajneh 2018: 43–7）[^hoover-2018][^hoover-2018-2]。
