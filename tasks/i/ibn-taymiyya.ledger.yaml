      ### 3.2 Refutation of Aristotelian Logic
    step1: |-
      ### 3.2 对亚里士多德逻辑的驳斥
    step2: |-
      ### 3.2 对亚里士多德逻辑的驳斥
  - id: 21
    kind: body
    source: |-
      Ibn Taymiyya devotes his *Refutation of the Logicians* (*al-Radd ʿalā al-manṭiyyīn*) to Aristotelian logic as reformulated by Ibn Sīnā. The Avicennan logical system is foundationalist. New knowledge is built up from primary knowledge through discursive reasoning. Otherwise, without a foundation of primary knowledge, rational inferences would regress infinitely. Avicennan logic furthermore divides knowledge (*ʿilm*) into conceptualization (*taṣawwur*) and assent (*taṣdīq*). Conceptualization is the formation of a notion or concept in the mind. Some concepts like “thing” and “existent” are primary; they are known immediately without discursive reasoning (*naẓar*). Other concepts are acquired by formation of a real definition (*ḥadd*), which indicates the essence or quiddity (*māhiyya*) of a species by specifying its genus and specific difference. For example, the definition of “human” as “rational animal” is acquired through reflection on prior knowledge of the species “animal” and the specific difference “rational”. The definition generates a concept in the mind that corresponds to the quiddity of the existing thing in extramental reality. Assent, the second division of Avicennan logic, affirms the truthfulness of a proposition. Assents are also primary or acquired, and they may be either certain (*yaqīn*) or probable. Primary assents that are certain include, among other things, primary truths (e.g., the whole is greater than the part); sense perceptions (e.g., seeing that the sun is shining), and abundantly transmitted reports (e.g., of the existence of a given city). Probable primary assents include beliefs about human customs and laws. Acquired assents are derived through induction, analogy, and syllogism. Induction and analogy impart no more than probability, but a valid categorical syllogism with certain premises provides apodictic certainty. Such a syllogism is called a demonstration (*burhān*) (Inati 1984; Hallaq 1993: xiv–xvii, xxvii–xxviii, 4–5 n. 4; Ahmed 2011; Black 2013)[^ahmed-2011][^black-2013][^hallaq-1993][^inati-1984].
    step1: |-
      伊本·泰米叶把《驳逻辑学家》（*al-Radd ʿalā al-manṭiqiyyīn*）用于驳斥经伊本·西那重新表述的亚里士多德逻辑。阿维森纳逻辑体系是基础主义的：新知识通过推理由原初知识建构起来；否则，若无原初知识的基础，理性推理将无限倒退。阿维森纳逻辑还把知识（*ʿilm*）分为概念化（*taṣawwur*）与断定（*taṣdīq*）。概念化是在心灵中形成观念或概念。有些概念如“事物”与“存在者”是原初的，无须推理（*naẓar*）便直接得知。其他概念则通过形成真实定义（*ḥadd*）而获得；定义通过指定属与种差，指明一个种的本质或实质（*māhiyya*）。例如，把“人”定义为“理性动物”，是经由反思对“动物”这一种与“理性”这一种差的先在知识而获得。定义在心灵中生成一个概念，对应于心外实在中现存之物的实质。断定是阿维森纳逻辑的第二部分，肯定一个命题为真。断定也分原初与获得，且可以是确定的（*yaqīn*）或或然的。确定的原初断定除其他外包括原初真理（如整体大于部分）、感官知觉（如看见太阳在照耀）与大量传递的传述（如某座城市存在）。或然的原初断定包括关于人类习俗与法律的信念。获得的断定通过归纳、类比与三段论得出。归纳与类比只提供或然性，但前提确定的有效直言三段论提供必然确定性；这种三段论称为证明（*burhān*）（Inati 1984; Hallaq 1993: xiv–xvii, xxvii–xxviii, 4–5 n. 4; Ahmed 2011; Black 2013）[^ahmed-2011][^black-2013][^hallaq-1993][^inati-1984]。
