      Reason for Ibn Taymiyya is both a rational faculty and a kind of immediate (*badīhī*) and necessary (*ḍarūrī*) knowledge. The latter includes logical axioms like those noted above (e.g., the law of excluded middle and the law of non-contradiction) and basic moral intuitions (e.g., that God must be the only object of worship and that what is beneficial is good). The functions of reason as a faculty include forming universals in the mind from the extramental concrete particulars known through the senses and carrying out rational inferences (El-Tobgui 2020: 253–60)[^el-tobgui-2020].
    step1: |-
      对伊本·泰米叶而言，理性既是理性能力，也是一种直接（*badīhī*）而必然（*ḍarūrī*）的知识。后者包括上述逻辑公理（如排中律与不矛盾律）以及基本道德直觉（如真主必是唯一崇拜对象、有益者即善）。作为能力的理性，其功能包括从感官所知的心外具体个别物在心灵中形成共相，并进行理性推理（El-Tobgui 2020: 253–60）[^el-tobgui-2020]。
    step2: |-
      对伊本·泰米叶而言，理性既是理性能力，也是一种直接（*badīhī*）而必然（*ḍarūrī*）的知识。后者包括上述逻辑公理（如排中律与不矛盾律）以及基本道德直觉（如真主必是唯一崇拜对象、有益者即善）。作为能力的理性，其功能包括从感官所知的心外具体个别物在心灵中形成共相，并进行理性推理（El-Tobgui 2020: 253–60）[^el-tobgui-2020]。
