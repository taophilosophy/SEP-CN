      Religion for Ibn Taymiyya cannot do without temporal power, and he criticizes two errors in this regard. One is avoiding power and wealth so as not to sully religion with the compromises of temporal affairs, and the other is deploying power and wealth for personal gain instead of advancing religion. To avert these errors, Ibn Taymiyya seeks to infuse public authority with the ethical impulses of the revealed law in his book *Law-Guided Public Policy* (*al-Siyāsa al-Sharʿiyya*). The purpose of the public authorities, whether they be political, military, judicial or scholarly, is “to reform the religion of the people” in order “that religion is entirely for God and that the word of God is most high” (*Siyāsa* 30, 33). Rulers are to further the cause of religion and enable worship of God alone within whatever political structures happen to be in place. While Ibn Taymiyya speaks to the appointment of public officials, the distribution of public wealth, the conduct of war, the provision of public services, and criminal and personal status law among other things, he does not outline a blueprint for a perfect Islamic state. He instead exhorts public officials to work toward religious reform to the best of their abilities within the circumstances, using force as deemed prudent (Khan 1992: 23–64, 98–170; Johanson 2008; Anjum 2012; Belhaj 2013; Michot 2014; Bori 2021)[^anjum-2012][^belhaj-2013][^bori-2021][^khan-1992][^michot-2014].
    step1: |-
      在伊本·泰米叶看来，宗教离不开世俗权力；他批评此方面两种错误。其一是回避权力与财富，以免世俗事务的妥协玷污宗教；其二是把权力与财富用于个人利益而非推进宗教。为避免这些错误，伊本·泰米叶在《遵循教法的公共政策》（*al-Siyāsa al-Sharʿiyya*）中力图把启示律法的伦理冲动注入公共权威。公共权威——无论政治的、军事的、司法的还是学术的——其目的是“改革人民的宗教”，以便“宗教全归真主，真主之言至高”（*Siyāsa* 30, 33）。统治者应在既有政治结构中推进宗教事业，使只崇拜真主成为可能。伊本·泰米叶论及公共官员任命、公共财富分配、战争进行、公共服务提供、刑法与身份法等，但并未勾勒完美伊斯兰国家的蓝图。他反而劝勉公共官员在具体情势中尽力推进宗教改革，审慎使用强制（Khan 1992: 23–64, 98–170; Johanson 2008; Anjum 2012; Belhaj 2013; Michot 2014; Bori 2021）[^anjum-2012][^belhaj-2013][^bori-2021][^khan-1992][^michot-2014]。
