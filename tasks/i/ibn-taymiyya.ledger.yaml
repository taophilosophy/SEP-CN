      The second target of Ibn Taymiyya’s polemic is the esotericism of Ismāʿīlī Shīʿīs, philosophers in the Neoplatonic and Aristotelian traditions, al-Ghazālī (d. 1111), and the Sufi theorist Ibn al-ʿArabī (d. 1240) and his followers. Esotericism affirms two meanings for revelation, one for the commoners and another for an elite. The philosophers Ibn Sīnā and Ibn Rushd, for example, understand the corporeal imagery of exoteric revelation as pious fiction for the commoners. The commoners should not be told what the philosophers know to be true, namely, that God and the hereafter are incorporeal. That would too easily suggest to commoners that God and the hereafter do not exist at all and so undermine their faith. Ibn Taymiyya welcomes the philosophers’ rejection of *kalām* reinterpretation at the exoteric level, but he fiercely condemns their esoteric interpretations confined to an elite. The revelation that is accessible to all is true for all in its plain sense (Michot 2003a, 2008, 2012a, 2015, 2019; von Kügelgen 2004)[^michot-2003a].
    step1: |-
      伊本·泰米叶论战的第二个目标，是伊斯玛仪派什叶派、新柏拉图主义与亚里士多德传统中的哲学家、安萨里（卒于 1111）以及苏菲理论家伊本·阿拉比（卒于 1240）及其追随者的秘传主义。秘传主义肯定启示有两重意义，一重给大众，一重给精英。例如，哲学家伊本·西那与伊本·鲁世德把显白启示的形体意象理解为给大众的虔诚虚构。不应告诉大众哲学家所知为真之事，即真主与后世无形体；那太容易让大众以为真主与后世根本不存在，从而破坏其信仰。伊本·泰米叶欢迎哲学家在显白层面拒绝凯拉姆式重新解释，但猛烈谴责他们限于精英的秘传解释。人人可及的启示，其字面意义对人人皆为真（Michot 2003a, 2008, 2012a, 2015, 2019; von Kügelgen 2004）[^michot-2003a]。
