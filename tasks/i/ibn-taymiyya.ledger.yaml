      Like other post-classical Muslim jurists, Ibn Taymiyya sometimes overrides explicit legal prohibitions on the grounds of benefit and necessity. For example, Islamic law forbids eating carrion, but Ibn Taymiya permits eating it if necessary to avoid starvation. More generally, Ibn Taymiyya maintains the revealed law as his guiding ideal, but he insists that the benefits and detriments of actions must be weighed up carefully when human weakness or sin make following the law difficult or impossible or when the law is not fully known. His reflection on the caliphate is a poignant example of such utilitarian calculation. Ibn Taymiyya maintains that the “caliphate of prophecy”, the normative caliphate of the first four Sunnī caliphs following the death of the Prophet Muḥammad, is an obligation for the Muslim community. Morally inferior “kingship”, which predominated in Muslim lands after the first four Sunnī caliphs, is only permissible in case of need. Nonetheless, Ibn Taymiyya maintains, kingship is only a minor sin, and Muslims should weigh up the benefits and detriments in the circumstances to attain the greatest possible benefit for religion. It might be beneficial, for example, to indulge a king’s wine drinking if calling upon him to stop would lead to the greater detriment of his apostasy from Islam. Moreover, Ibn Taymiyya explains, such weighing up of benefits and detriments is the way of the Prophet (Michot 2006: 14–7, 20, 50–3, 85–100; Hoover 2019a)[^hoover-2019a][^michot-2006].
    step1: |-
      与其他后古典穆斯林法学家一样，伊本·泰米叶有时以利益与必要性为由，超越明确的律法禁令。例如，伊斯兰律法禁止吃自死物，但伊本·泰米叶允许在避免饿死所必需时吃它。更一般地说，伊本·泰米叶把启示律法作为指导理想，但坚持当人的软弱或罪使守法困难或不可能、或律法未被完全知晓时，必须仔细权衡行为的利弊。他对哈里发制度的思考，是这种功利计算的鲜明例子。伊本·泰米叶主张，“先知哈里发”即先知穆罕默德死后前四位逊尼派哈里发的规范哈里发制，是穆斯林共同体的义务。道德上较低的“王权”在前四位逊尼派哈里发之后的穆斯林土地上占主导，只在需要时才可允许。然而伊本·泰米叶主张，王权只是小罪，穆斯林应权衡情势中的利弊，为宗教求得最大可能利益。例如，若呼吁国王戒酒会导致他叛教的更大害处，那么纵容国王饮酒也许有益。此外，伊本·泰米叶解释说，这种利弊权衡正是先知之道（Michot 2006: 14–7, 20, 50–3, 85–100; Hoover 2019a）[^hoover-2019a][^michot-2006]。
    step2: |-
