      Report is related to sense perception insofar as it derives from the sense perceptions of others who have experienced what they report. Reports may be of particulars and universals and of the seen and the unseen. Much of what we know comes from reports because our own sense perception is limited in range. Divine revelation constitutes a special category of reports providing knowledge about the unseen world and the hereafter. Reports provide certain knowledge only if they are so abundantly transmitted as to preclude collusion and forgery. Muslims consider the Qurʾān and some reports from the Prophet Muḥammad to be abundantly transmitted (*mutawātir*). Ibn Taymiyya regards some reports of the early Muslims, the *salaf*, to be abundantly transmitted as well (El-Tobgui 2020: 227–9, 235–41)[^el-tobgui-2020].
    step1: |-
      传述与感官知觉相关，因为它源自其他经历过其所传述之事者的感官知觉。传述可以是关于个别物与共相、可见与幽玄的。我们所知甚多来自传述，因为我们自己的感官知觉范围有限。神圣启示构成传述的一个特殊类别，提供关于幽玄世界与后世的知识。只有当传述被如此大量地传递，以至排除了串通与伪造时，它才提供确定知识。穆斯林认为《古兰经》与先知穆罕默德的一些传述是大量传递的（*mutawātir*）。伊本·泰米叶也认为早期穆斯林（*salaf*）的一些传述是大量传递的（El-Tobgui 2020: 227–9, 235–41）[^el-tobgui-2020]。
    step2: |-
