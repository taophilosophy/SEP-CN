      More substantively, Ibn Taymiyya argues that certain knowledge may be acquired without a categorical syllogism. Different people come to certainty in different ways. What is acquired knowledge for some may be immediate knowledge for others. Some need the middle term of a syllogism to acquire certain knowledge while others do not. A rational inference producing certainty also need not be composed of exactly two premises, counter to what logicians require for a demonstrative syllogism. The number of premises varies according to the ability of the one seeking knowledge, and some inferences require only one premise, that is, a single indicant (*dalīl*) with its necessarily entailment (*luzūm*). As an example, Ibn Taymiyya notes that every created thing known with certainty to exist entails the existence of the Creator necessarily. The argument does not need to be reformulated into a categorical syllogism to provide certainty, and to require the syllogistic form is mere pedantry. Moreover, and following on from Ibn Taymiyya’s empiricist outlook, the universal proposition in a demonstrative syllogism is in fact superfluous in matters pertaining to the extramental world because knowledge of that world is rooted in particulars. For example, to determine whether the universal, “All flames burn”, is true in the world outside the mind, one would need to examine all flames to see whether they all burn. In this attempt at complete induction, one would discover along the way that a particular flame burns. There would then be no need to construct a demonstrative syllogism with the universal premise, “All flames burn”, to attain certainty that that one flame burns. It has already been ascertained that it burns. Additionally, in view of the difficulty of achieving complete induction of particulars, acquired knowledge of the extramental world will be merely probable, not certain (*Manṭiqiyyīn* 113–4/155, 250–3/294–7; Hallaq 1993: xxvii–xxxv, 30–42, 134–7; von Kügelgen 2005: 204–9; Rayan 2011a, 2012)[^hallaq-1993][^rayan-2011a].
    step1: |-
      更实质地说，伊本·泰米叶主张，确定知识可以不经直言三段论而获得。不同的人以不同方式达到确定。对某些人是获得知识者，对另一些人可能是直接知识。有些人需要三段论的中项来获得确定知识，另一些人则不需要。产生确定性的理性推理也不必恰好由两个前提构成，这与逻辑学家对证明三段论的要求相反。前提数目随求知者能力而异，有些推理只需一个前提，即一个指示项（*dalīl*）及其必然蕴含（*luzūm*）。例如，伊本·泰米叶指出，每个被确定知道存在的被造物都必然蕴含创造者的存在。该论证无须改写成直言三段论便能提供确定性；要求三段论形式纯属迂腐。此外，依循伊本·泰米叶的经验论构想，证明三段论中的全称命题在关涉心外世界时其实多余，因为关于该世界的知识根植于个别物。例如，要判定全称命题“凡火焰皆燃烧”在心外世界是否为真，人须检查所有火焰，看它们是否都燃烧。在这一完全归纳的尝试中，人会沿途发现某一特定火焰燃烧。于是便无须构造带全称前提“凡火焰皆燃烧”的证明三段论，来确定那一火焰燃烧；它已被确认燃烧。再者，鉴于对个别物作完全归纳的困难，关于心外世界的获得知识将只是或然的，而非确定的（*Manṭiqiyyīn* 113–4/155, 250–3/294–7; Hallaq 1993: xxvii–xxxv, 30–42, 134–7; von Kügelgen 2005: 204–9; Rayan 2011a, 2012）[^hallaq-1993][^rayan-2011a]。
