      The *fiṭra* frames Ibn Taymiyya’s epistemological outlook as the “original normative disposition” (El-Tobgui 2020: 260)[^el-tobgui-2020] or “natural constitution” (Hoover 2007: 39)[^hoover-2007] of the human being to believe in and worship God alone just as an infant instinctively seeks to drink its mother’s milk. God creates human beings with a Godward orientation, and this includes many things known by reason such as the basic rules of thought and fundamental moral intuitions. Corrupting influences and incorrect *kalam* and philosophical reasoning may divert the *fiṭra* from its proper ends. The role of prophecy and divine revelation then is to perfect the *fiṭra* by removing sources of corruption, providing correct arguments, and revealing aspects of the divine law not known through natural means (Holtzman 2010: 165–78; Anjum 2012: 215–27; Kazi 2013: 232–313; Vasalou 2016: 77–92; El-Tobgui 2020: 260–4; Candiard 2023: 309–28)[^anjum-2012][^candiard-2023][^el-tobgui-2020][^holtzman-2010][^kazi-2013][^vasalou-2016].
    step1: |-
      *fiṭra* 把伊本·泰米叶的认识论构想框定为人的“原初规范禀性”（El-Tobgui 2020: 260）[^el-tobgui-2020] 或“自然构造”（Hoover 2007: 39）[^hoover-2007]：人倾向于信仰并只崇拜真主，正如婴儿本能地寻求吮吸母乳。真主创造人时赋予其朝向真主的取向，其中包括许多由理性所知之事，如思维的基本规则与根本道德直觉。败坏性影响以及错误的凯拉姆与哲学推理，可能使 *fiṭra* 偏离其恰当目的。预言与神圣启示的作用，便是通过移除败坏之源、提供正确论证、揭示自然手段所不知的神法方面，来完善 *fiṭra*（Holtzman 2010: 165–78; Anjum 2012: 215–27; Kazi 2013: 232–313; Vasalou 2016: 77–92; El-Tobgui 2020: 260–4; Candiard 2023: 309–28）[^anjum-2012][^candiard-2023][^el-tobgui-2020][^holtzman-2010][^kazi-2013][^vasalou-2016]。
    step2: |-
