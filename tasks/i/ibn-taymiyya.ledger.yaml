      Ibn Taymiyya furthermore explains that once the necessitating cause in an analogy has been identified (e.g., intoxication as the cause of forbiddance), it becomes a universal, and the original case in the analogical argument is no longer needed. Whenever the cause obtains, the ruling follows necessarily. Yet, Ibn Taymiyya continues, a universal only exists with respect to a particular case, and specifying the original case is how the universal comes to be known (*Manṭiqiyyīn* 116–8/158–60). For Ibn Taymiyya, it is divine revelation that makes the cause of a ruling known. In the case of date wine, it is known from the consensus of the Muslim community and unambiguous revealed texts that every intoxicant is forbidden. Among unambiguous texts are two statements of the Prophet Muḥammad in the hadith collection of Muslim: “Every intoxicant is wine (*khamr*), and every intoxicant is forbidden”, and, “Every intoxicant is wine, and every wine is forbidden” (*Manṭiqiyyīn* 111–2/152–3; Heer 1988; Hallaq 1993: xxxv–xxxviii, 43–51, 159–64; von Kügelgen 2005: 209–12; von Kügelgen 2013: 313–22)[^hallaq-1993][^heer-1988]. Divine revelation can provide certain knowledge of the world outside the mind even if empirical observation of extramental particulars cannot. This leads Hallaq to call Ibn Taymiyya “an ardent sceptic, but a sceptic saved by religion” (Hallaq 1993: xxxix)[^hallaq-1993]. However, Hallaq’s comment is apt only to a point because, as will be seen below, Ibn Taymiyya maintains that knowledge about God may be derived through rational inferences as well.
    step1: |-
      伊本·泰米叶进一步解释，一旦类比中起必然作用的原因被识别（如致醉是禁止的原因），它就变成全称的，类比论证中的原初案例便不再需要。只要原因成立，判决便必然随之。然而伊本·泰米叶继续说，全称只相对于特定案例而存在，而指定原初案例正是全称得以被知的方式（*Manṭiqiyyīn* 116–8/158–60）。在伊本·泰米叶看来，正是神圣启示使判决的原因被知。就椰枣酒而言，从穆斯林共同体的共识与明确无歧义的启示文本可知，凡致醉物皆被禁止。明确文本包括先知穆罕默德在穆斯林·本·哈贾吉圣训集中的两句话：“凡致醉物皆是酒（*khamr*），凡致醉物皆被禁止”，以及“凡致醉物皆是酒，凡酒皆被禁止”（*Manṭiqiyyīn* 111–2/152–3; Heer 1988; Hallaq 1993: xxxv–xxxviii, 43–51, 159–64; von Kügelgen 2005: 209–12; von Kügelgen 2013: 313–22）[^hallaq-1993][^heer-1988]。即便对心外个别物的经验观察不能提供确定知识，神圣启示仍能提供关于心外世界的确定知识。这使哈拉克称伊本·泰米叶为“热忱的怀疑论者，但也是被宗教拯救的怀疑论者”（Hallaq 1993: xxxix）[^hallaq-1993]。然而哈拉克的评论只在某一点上恰当，因为如下文所见，伊本·泰米叶主张关于真主的知识也可通过理性推理获得。
