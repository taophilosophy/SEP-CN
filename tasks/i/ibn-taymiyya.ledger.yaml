      On these grounds, Ibn Taymiyya reasons that God must be living, knowing, powerful, seeing, hearing, and speaking. Otherwise, God would be dead, ignorant, impotent, blind, deaf, and mute, respectively, and He would be less perfect than living creatures that He has created. Moreover, God must be moving and not immovable. Otherwise, God would be inferior to inanimate objects, which can at least be moved by something else. In similar fashion, God has hands because having the ability to choose to act with hands is more perfect than not having that ability. God also has the attributes of laughter and joy to exclude crying and sadness which imply weakness. God furthermore loves perfection and hates imperfection because it is more perfect to distinguish perfection and imperfection through love and hate than not to do so. However, God does not eat and drink because eating and drinking imply need whereas having no need is more perfect than being in need. Moreover, Ibn Taymiyya contends that it is in God’s perfection to be qualified by attributes of perfection such that He is unlike created things (Hoover 2007: 56–67; Suleiman 2019: 225–59)[^hoover-2007][^suleiman-2019].
    step1: |-
      据此，伊本·泰米叶推论真主必是永生、全知、全能、全观、全听、能言的。否则，真主便会分别是死的、无知的、无能的、盲的、聋的、哑的，比他所造的活物更不完满。此外，真主必是运动的，而非不动的；否则，真主便不如无生命物，后者至少能被其他东西推动。类似地，真主有手，因为拥有选择用手行动的能力比没有更完满。真主还有笑与欢乐的属性，以排除暗示软弱的哭与悲伤。真主还爱完满、恨缺陷，因为通过爱与恨区分完满与缺陷比不区分更完满。然而，真主不吃不喝，因为吃喝蕴含需要，而无需要比有需要更完满。此外，伊本·泰米叶主张，真主以完满属性为特质、以致不同于受造物，这本身就在其完满之中（Hoover 2007: 56–67; Suleiman 2019: 225–59）[^hoover-2007][^suleiman-2019]。
