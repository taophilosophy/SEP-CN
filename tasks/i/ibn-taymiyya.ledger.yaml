      It is then the unique essences that distinguish existents from each other and render them all completely unique individuals. The essence of something is in fact its very existence along with its attributes (El-Tobgui 2020: 246–50)[^el-tobgui-2020]. Ibn Taymiyya’s views on universals are not entirely unique within post-classical Islam; he is part of a wider drift toward nominalism or conceptualism found in earlier figures such as Shihāb al-Dīn al-Suhrawardī (d. 1191) (Adamson & Benevich 2023: 189–256)[^adamson-2023].
    step1: |-
      正是独特本质使存在者彼此区分，并使它们全都成为完全独特的个体。某物的本质事实上就是其存在连同其属性（El-Tobgui 2020: 246–50）[^el-tobgui-2020]。伊本·泰米叶关于共相的观点在后古典伊斯兰中并非全然独特；他属于一种更广泛的唯名论或概念论转向，早期人物如希哈布·丁·苏赫拉瓦迪（卒于 1191）已有此倾向（Adamson & Benevich 2023: 189–256）[^adamson-2023]。
