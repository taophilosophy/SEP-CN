      Parallel to this physicalism, Ibn Taymiyya denies that universals exist in extramental reality. He rejects universals existing independently of particulars (Platonic realism) or as shared essences or quiddities (*māhiyyāt*) within particulars that the mind abstracts as universals (Aristotelian and Avicennan moderate realism). Shared meanings and universal notions abstracted from concrete particulars in the extramental world exist only in the mind. There is for example no extramental “absolute human” in which concrete and particular humans participate or of which they are instantiations, and there is no real quiddity “human” that exists in every human. There are only ontologically distinct existents that a mind groups together under a shared meaning or mental universal called “human”. Ibn Taymiyya’s rejection of real universals is often called “nominalism” (e.g., Hallaq 1993: xvi–xxiv)[^hallaq-1993], but it has also been argued that “conceptualism” is the better label. Conceptualism acknowledges the existence of universals in the mind whereas nominalism may imply rejection of that as well (Suleiman 2019: 106–19)[^suleiman-2019].
    step1: |-
      与这种物理主义平行，伊本·泰米叶否认共相存在于心外实在中。他拒绝柏拉图式实在论（共相独立于个别物而存在），也拒绝亚里士多德与阿维森纳式温和实在论（共相作为个别物内部共享的本质或实质 *māhiyyāt*，由心灵抽象为共相）。共享意义与从心外具体个别物抽象出的普遍概念，只存在于心灵中。例如，并不存在心外的“绝对的人”，让具体个别的人分有或作为其例示；也不存在真实存在于每个人之中的“人”之实质。存在的只是本体上彼此不同的存在者，心灵把它们归入一个称为“人”的共享意义或心理共相之下。伊本·泰米叶对真实共相的拒绝常被称为“唯名论”（如 Hallaq 1993: xvi–xxiv）[^hallaq-1993]，但也有人主张“概念论”是更好的标签。概念论承认共相存在于心灵中，而唯名论可能连这一点也否认（Suleiman 2019: 106–19）[^suleiman-2019]。
