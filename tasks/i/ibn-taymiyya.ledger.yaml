      Ibn Taymiyya’s view of creation is closer to the philosophers Ibn Sīnā and Ibn Rushd than to the *kalām* theologians. He follows both philosophers in affirming that God’s perfection entails the production of the world, but like Ibn Rushd, he rejects Ibn Sīnā’s emanation scheme in favor of God’s continuous creation of the world. Ibn Taymiyya may well have been inspired by Ibn Rushd since we know that he read the philosopher’s texts. Ibn Taymiyya also adopts Ibn Sīnā’s and Ibn Rushd’s criticism of the *kalām* theologians’ account of creation ex nihilo. If the world had had a beginning, as the *kalām* theologians argue, God would have been imperfect before creating it and subject to change when He began the creation process. A preponderator (*murajjiḥ*) or efficient cause would need to have arisen to cause God to start originating. The *kalām* theologians counter that it is was in the very nature of God’s will to begin originating the world, and no additional preponderator was needed to cause God to begin creating. Ibn Taymiyya rejects this as positing something impossible, namely, preponderance without a preponderator (Hoover 2004; Abu AbdurRahman 2023)[^abu-2023][^hoover-2004].
    step1: |-
      伊本·泰米叶的创造观更接近哲学家伊本·西那与伊本·鲁世德，而非凯拉姆神学家。他跟随两位哲学家肯定真主的完满蕴含世界的产生；但像伊本·鲁世德一样，他拒绝伊本·西那的流溢图式，主张真主持续创造世界。伊本·泰米叶很可能受伊本·鲁世德启发，因为我们知道他读过这位哲学家的文本。伊本·泰米叶还采纳伊本·西那与伊本·鲁世德对凯拉姆神学家“从无创造”说明的批评。若世界有开端（如凯拉姆神学家所论），真主在创造它之前便不完满，且在开始创造过程时会发生变化。需要出现一个偏重者（*murajjiḥ*）或动力因，使真主开始创造。凯拉姆神学家回应说，开始创造世界本就在真主意愿的本性之中，无须额外偏重者使真主开始创造。伊本·泰米叶斥之为设定不可能之事，即无偏重者的偏重（Hoover 2004; Abu AbdurRahman 2023）[^abu-2023][^hoover-2004]。
