      Ibn Taymiyya retains the unknowability of the modality of God’s attributes, as well as their ultimate reality (*ḥaqīqa*), but he rejects traditionalist noncognitivism. He also rejects the literalism of *kalām* theology. Words like “hand” and “sitting” do not have literal meanings that must be denied and perhaps replaced with other terms when applied to God. Rather, Ibn Taymiyya affirms, the plain senses of God’s attributes are accessible to human cognition and shaped by their theological context. Ibn Taymiyya’s theory of meaning is contextual and pragmatic. Words have no meanings apart from context, and their meanings are modulated according to contextual indicators (Ali 2000: 87–114; Belhaj 2008; Mustafa 2018)[^ali-2000][^belhaj-2008][^mustafa-2018]. Names and attributes applied to both God and creatures have meanings in the human mind, but they apply to God and creatures in different ways according to the precedence of God over creatures. Universal meanings occur only in the mind, and there are no real universals outside the mind. Yet, the mind identifies features in the particulars of extramental reality that can be said to be shared, albeit differently in the particulars that are God and creatures because God is necessary while creatures are merely contingent or possible. Adapting distinctions developed by Ibn Sīnā and his successors, Ibn Taymiyya construes the relation between the meanings of terms applied to both God and humans as neither equivocal nor purely univocal but analogical or modulated (*mushakkik*). Ibn Taymiyya elaborates in a passage from his *Refutation of the Logicians*:
    step1: |-
      伊本·泰米叶保留真主属性样式以及其终极实在（*ḥaqīqa*）的不可知性，但拒绝传统主义非认知主义。他也拒绝凯拉姆神学的字面主义。“手”与“端坐”等词用于真主时，并不具有必须否认、也许还须替换为其他术语的字面意义。相反，伊本·泰米叶肯定，真主属性的字面意义可为人类认知所及，并受其神学语境塑造。他的意义理论是语境论的、语用论的。语词离开语境便无意义，其意义随语境指示项而调节（Ali 2000: 87–114; Belhaj 2008; Mustafa 2018）[^ali-2000][^belhaj-2008][^mustafa-2018]。用于真主与受造物的尊名与属性在人心中有意义，但依真主对受造物的优先性，以不同方式适用于真主与受造物。普遍意义只出现在心灵中，心外没有真实共相。然而，心灵识别心外实在个别物中可说是共享的特征，尽管在真主与受造物这些个别物中方式不同，因为真主是必然的，而受造物只是偶然的或可能的。伊本·泰米叶借用伊本·西那及其后继者发展的区分，把同时用于真主与人的术语意义之间的关系，构想为既非纯歧义、也非纯单义，而是类比或调节的（*mushakkik*）。伊本·泰米叶在《驳逻辑学家》的一段话中详述：
