      As with Ibn Taymiyya’s approach to God’s self-sufficiency, Avicennan Neoplatonic inclinations color his theodicy as well. God creates all things, including evils, for wise purposes that are ultimately good. Pure or absolute evil does not exist. Evil is only evil relative to those afflicted by it. Ibn Taymiyya sometimes says that God’s wise purposes in evil cannot be known. At other times, however, he indicates that God’s wise purposes have to do with nurturing religious virtues such as repentance, humility, and patience. Ibn Taymiyya ultimately affirms that everything God creates is good and that this world is the best of all possible worlds. To avoid the charge that this limits God’s power, Ibn Taymiyya asserts that God could create other than this world. However, God creates the world that He does out of His perfection and wise purpose (Hoover 2007: 146–65, 177–228)[^hoover-2007].
    step1: |-
      与伊本·泰米叶对真主自足的处理一样，阿维森纳式新柏拉图倾向也渲染其神义论。真主为最终为善的智慧目的创造万物，包括恶。纯粹或绝对的恶不存在。恶只相对于受其折磨者才是恶。伊本·泰米叶有时说，真主在恶中的智慧目的不可知。然而另一些时候，他暗示真主的智慧目的关乎培育悔罪、谦卑与忍耐等宗教美德。伊本·泰米叶最终肯定真主所造一切皆善，且这个世界是一切可能世界中最好的。为避免“这限制了真主能力”的指责，伊本·泰米叶断言真主能创造这个世界之外的别的世界。然而，真主出于其完满与智慧目的创造了这个世界（Hoover 2007: 146–65, 177–228）[^hoover-2007]。
