    source: |-
      Ibn Taymiyya did not write systematic works of theology or philosophy. He instead left a vast corpus of refutations and fatwas of widely varying lengths and degrees of organization. It is difficult to date Ibn Taymiyya’s writings, and it is for this reason challenging to trace development in his thought. Nonetheless, it is possible to sequence his three largest theological tomes. Ibn Taymiyya wrote *Explication of the Deceit of the Jahmiyya* (*Bayān talbīs al-Jahmiyya*), a refutation of Ashʿarī incorporealism, during his first 12 months in prison in Egypt, that is, between April 1306 and April 1307. He composed his masterwork *Averting the Conflict between Reason and Revealed Tradition* (*Darʾ taʿāruḍ al-ʿaql wa-l-naql*) sometime after 1313 followed by his refutation of Twelver Shīʿism *The Way of the Prophetic Sunna* (*Minhāj al-sunna al-nabawiyya*). These three works take up ten, eleven, and nine volumes, respectively, in their modern Arabic critical editions. Ibn Taymiyya also wrote large works on law, prophecy, and Christianity. Of special philosophical interest is his *Refutation of the Logicians* (*al-Radd ʿalā al-manṭiqiyyīn*), which he started while under house arrest in Alexandria in 1309–1310 and completed later in Damascus. Also of interest is Ibn Taymiyya’s work on political theology *Law-Guided Public Policy* (*al-Siyāsa al-Sharʿiyya*), which appears to have been drafted around 1310 and then completed upon his return to Damascus. While Ibn Taymiyya’s large works have been published separately, a great many of his small and medium length writings have been published in collections, the most cited of which is the 37 volume *Majmūʿ fatāwā* first published 1961–7 (Murad 1979; Bori 2009, 2010, 2021; Hoover 2019b: 1–39)[^bori-2009][^hoover-2019b][^murad-1979].
    step1: |-
      伊本·泰米叶没有写系统的神学或哲学著作，而是留下大量长短不一、组织程度各异的驳论与教法判决。其著作年代难以确定，因此追踪其思想发展颇具挑战。尽管如此，仍可为他三部最大的神学巨著排序。伊本·泰米叶在埃及第一次入狱的 12 个月里（即 1306 年 4 月至 1307 年 4 月）写成《阐明贾赫米派的欺骗》（*Bayān talbīs al-Jahmiyya*），驳斥艾什尔里派的无形体论。1313 年后的某个时候，他完成代表作《消除理性与启示传统之间的冲突》（*Darʾ taʿāruḍ al-ʿaql wa-l-naql*），随后又写成驳斥十二伊玛目派什叶主义的《先知逊奈之道》（*Minhāj al-sunna al-nabawiyya*）。这三部著作在现代阿拉伯文校勘版中分别占十、十一、九卷。伊本·泰米叶还写了关于法律、先知预言与基督教的大部头著作。特别有哲学趣味的是《驳逻辑学家》（*al-Radd ʿalā al-manṭiqiyyīn*），他于 1309–1310 年在亚历山大软禁期间开始撰写，后在大马士革完成。同样有趣的是其政治神学著作《遵循教法的公共政策》（*al-Siyāsa al-Sharʿiyya*），似于 1310 年前后起草，返回大马士革后完成。伊本·泰米叶的大部头著作已单独出版，但他大量中小篇幅著作收入文集，其中被引用最多的是 1961–7 年首次出版的 37 卷《教法判决全集》（*Majmūʿ fatāwā*）（Murad 1979; Bori 2009, 2010, 2021; Hoover 2019b: 1–39）[^bori-2009][^hoover-2019b][^murad-1979]。
    step2: |-
