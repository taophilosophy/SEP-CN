      To sum up Ibn Taymiyya’s views on God and space, God is a huge indivisible, spatially extended existent that surrounds the entire universe. God is not an existent in space, nor does God transcend space. Rather, God is spatial in God’s essence. There is no void space, and no space exists apart from God and the universe that God has created (Holtzman 2018: 457–63; Suleiman 2019: 119–25; Hoover 2022)[^holtzman-2018][^hoover-2022][^suleiman-2019].
    step1: |-
      总结伊本·泰米叶关于真主与空间的观点：真主是巨大的、不可分割的、空间延展的存在者，包围整个宇宙。真主不是空间中的存在者，也不超越空间。相反，真主在其本质上就是空间性的。没有虚空，除真主与真主所造的宇宙外，也没有空间存在（Holtzman 2018: 457–63; Suleiman 2019: 119–25; Hoover 2022）[^holtzman-2018][^hoover-2022][^suleiman-2019]。
