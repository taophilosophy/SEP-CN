      > The God (*al-ilāh*) is the one worshipped and asking for help is linked to His lordship. The Lord of the servants is He who lords over them. This entails that He is Creator of everything that is in them and from them. The divinity is the final cause, and lordship is the efficient cause. The final [cause] is that which is aimed at, and it is the efficient cause of the efficient cause. Therefore, He made “You alone we worship” precede “You alone we ask for help”. Confessing the exclusiveness of the divinity (*tawḥīd al-ilāhiyya*) includes confessing the exclusiveness of the lordship (*tawḥīḍ al-rubūbiyya*). Included in worshipping only God is not confessing the lordship of any other. (*Bayān talbīs al-Jahmiyya* 4: 533, trans. Hoover 2007:28–9)[^hoover-2007]
    step1: |-
      > 神（*al-ilāh*）是被崇拜者，求相助则与其主性相联。众仆的主是统辖他们者。这蕴含他是他们之内与出自他们的一切的创造者。神性是目的因，主性是动力因。目的[因]是被追求者，且是动力因的动力因。因此，他把“我们只崇拜你”置于“我们只求你相助”之前。承认真主神性的排他性（*tawḥīd al-ilāhiyya*）包含承认真主主性的排他性（*tawḥīd al-rubūbiyya*）。只崇拜真主包含不承认任何他者的主性。（*Bayān talbīs al-Jahmiyya* 4: 533，译 Hoover 2007: 28–9）[^hoover-2007]
