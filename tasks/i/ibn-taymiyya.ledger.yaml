      Ibn Taymiyya affirms that God’s activity is rational. God creates on account of a cause (*ʿilla*) or wise purpose (*ḥikma*), and, given that God has been creating from eternity, the wise purposes of God’s creative acts regress infinitely into the past within God’s essence. Moreover, God’s rationality is not purely altruistic. God acts for benefits that redound not only to creatures but also to God Himself. For Ibn Taymiyya it is neither rational nor praiseworthy for agents to commit acts that are of no benefit to themselves. Ashʿarī theologians object that a God who acts for wise purposes must be needy and dependent on those acts to attain perfection. Ibn Taymiyya counters that it is rational for agents to be perfected by their acts and that it is a greater perfection to create things for wise purposes at the right times than to create without purpose. God is self-sufficient, not in the sense of being free to act or not act without reason—the Ashʿarī view—but in needing no help in the act of creation. Furthermore, God’s love for the love and obedience of His servants does not derive from God’s need for love. Rather, it follows on from God’s love of God’s self. God’s self-love is primary, and from God’s self-love flows God’s love for human beings and the creation of everything that they do, including their love for God and obedience to Him. God does not act to acquire perfection. Instead, God’s creative acts, and with them the created world, are necessary concomitants of the perfection of God’s essence. Ibn Taymiyya’s resolution to the problem of God’s self-sufficiency is Neoplatonic, and the notion of God’s self-love giving rise to the world as a necessary concomitant is found in the Neoplatonism of Ibn Sīnā (Bell 1979: 71–3; Hoover 2007: 70–102; Vasalou 2016: 167–79)[^bell-1979][^hoover-2007][^vasalou-2016].
    step1: |-
      伊本·泰米叶肯定真主的活动是理性的。真主因某个原因（*ʿilla*）或智慧目的（*ḥikma*）而创造；既然真主从永恒起就在创造，真主创造活动的智慧目的便在真主本质中无限上溯。此外，真主的理性并非纯粹利他。真主行动所得益处不仅归予受造物，也归予真主自身。在伊本·泰米叶看来，能动者从事对自身无益的行为，既非理性也不可赞。艾什尔里派神学家反对说，为智慧目的行动的真主必定有需要，并依赖这些行为来达到完满。伊本·泰米叶反驳说，能动者因其行为而完善是理性的；在恰当时机为智慧目的创造万物，比无目的地创造更完满。真主自足，不是说真主可以无理由地行动或不行动（艾什尔里派观点），而是说真主在创造行为中不需要帮助。此外，真主对其仆人的爱与顺服的喜爱，并非源于真主对爱的需要，而是源于真主对自身的爱。真主的自爱是首要的；从真主的自爱流出真主对人的爱，以及对他们一切行为的创造，包括他们对真主的爱与顺服。真主行动不是为了获取完满。相反，真主的创造活动、连同受造世界，是真主本质完满的必然伴随物。伊本·泰米叶对真主自足问题的解决是新柏拉图式的；真主自爱产生世界作为必然伴随物这一观念，见于伊本·西那的新柏拉图主义（Bell 1979: 71–3; Hoover 2007: 70–102; Vasalou 2016: 167–79）[^bell-1979][^hoover-2007][^vasalou-2016]。
