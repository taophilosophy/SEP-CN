      Ibn Taymiyya falls within a tradition going back to the twelfth century that subjected Ibn Sīnā’s Aristotelian notion of real definition to skeptical critique. He rejects the ontology underpinning Avicennan definitions: definitions do not delineate real Avicennan quiddities shared by multiple existents outside the mind, and the attributes of extramental realities are not divided into those which are quiddative or essential and those which are not. Ibn Taymiyya maintains instead that definitions are matters of linguistic convention. They simply name and identify what is defined, and they distinguish one thing from another. This is the view of definitions common among *kalām* theologians. Following on from this, Ibn Taymiyya asserts that Aristotelian definitions are not needed to form concepts and that in fact, as the Ashʿarī theologian Fakhr al-Dīn al-Rāzī (d. 606/1210) argued earlier, real definitions cannot lead to the acquisition of conceptualizations at all. Conceptualizations are all primary and empirical in character; they arise from experience and the senses, both external (e.g., sight and hearing) and internal (e.g., hunger, pain, love). Aristotelian definitions do not impart knowledge not already known. Those who hear definitions will not understand them unless they have previously conceptualized and understood the terms used to form the definitions themselves. The definition of human as rational animal for example is merely an assertion of the person who defines it. A hearer who knows this to be true will know it based on prior knowledge and not from the definition. A hearer who does not know it to be true cannot be sure that the testimony of this one person who defined it is correct without further corroboration (*Manṭiqiyyīn* 7–87/49–129; Hallaq 1993: xvii–xx, xlvi–xlvii; von Kügelgen 2005: 179–204; Rayan 2009, 2010, 2011b; on earlier critiques of definition, including al-Rāzī’s, see Jacobsen Ben Hammed 2020; Griffel 2021: 312–3, 336–87; Benevich 2022)[^benevich-2022][^griffel-2021][^hallaq-1993][^jacobsen-2020][^rayan-2009].
    step1: |-
      伊本·泰米叶属于可追溯至 12 世纪的传统，该传统对伊本·西那的亚里士多德式真实定义概念作怀疑论批评。他拒绝支撑阿维森纳定义的形而上学：定义并不刻画心外多个存在者共享的真实阿维森纳式实质，心外实在的属性也不分为本质性的与非本质性的。伊本·泰米叶反而主张，定义是语言约定之事。它们只是命名并标识被定义者，使一物区别于另一物。这是凯拉姆神学家中常见的定义观。由此，伊本·泰米叶断言，亚里士多德式定义并非形成概念所需；事实上，正如艾什尔里派神学家法赫尔·丁·拉齐（卒于 606/1210）早先所论，真实定义根本不能导致概念化的获得。概念化全是原初的、经验性的；它们源于经验与感官，包括外在感官（如视、听）与内在感官（如饥饿、痛苦、爱）。亚里士多德式定义并不传达尚未知晓的知识。听定义者除非事先已概念化并理解构成定义所用术语，否则不会理解定义。例如，把人定义为理性动物，不过是下定义者的断言。知道其为真的听者，是依据先在知识而非定义知道；不知道其为真的听者，若无进一步佐证，便不能确定这一定义者的证言正确（*Manṭiqiyyīn* 7–87/49–129; Hallaq 1993: xvii–xx, xlvi–xlvii; von Kügelgen 2005: 179–204; Rayan 2009, 2010, 2011b；关于包括拉齐在内的早期定义批评，见 Jacobsen Ben Hammed 2020; Griffel 2021: 312–3, 336–87; Benevich 2022）[^benevich-2022][^griffel-2021][^hallaq-1993][^jacobsen-2020][^rayan-2009]。
