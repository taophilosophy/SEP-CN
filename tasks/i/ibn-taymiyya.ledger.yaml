      Ibn Taymiyya frequently signifies God’s unique worthiness of worship with the terms *ulūhiyya* and *ilāhiyya*. Both mean “divinity” in the sense of that which is worshipped, and he compounds them with the term *tawḥīd* (confessing the oneness or exclusivity of God) to denote the act of taking God as the sole object of worship and obedience (*tawḥīd al-ulūhiyya* and *tawḥīd al-ilāhiyya*). Ibn Taymiyya also uses the terms *rubūbiyya* and *rabbāniyya* (lordship) to denote God’s role as creator, sustainer, and source. The confession that God is the one and only Lord of the universe (*tawḥīd al-rubūbiyya* or *tawḥīd al-rabbāniyya*) means that God is creator of everything that exists, all human acts included. Ibn Taymiyya often complains that the Ashʿarī *kalām* theologians give primacy to confessing the exclusiveness of God’s lordship (*tawḥīd al-rubūbiyya*) and lose sight of God’s sole right to worship. Instead, he argues, the Qurʾān gives priority to devoting worship to God alone (*tawḥīd al-ulūhiyya*), as in the invocation in the first chapter of the Qurʾān, “You alone we worship; You alone we ask for help” (Qurʾān 1:5). “You alone we worship” comes first as an expression of *tawḥīd al-ulūhiyya* and is then followed by “You alone we ask for help” as a confession that God is the sole source of sustenance, an expression of *tawḥīd al-rubūbiyya* (Hoover 2007: 26–9, 120–2; Michot 2012b: 123–68)[^hoover-2007][^michot-2012b].
    step1: |-
      伊本·泰米叶常用 *ulūhiyya* 与 *ilāhiyya* 表示真主独特配得崇拜。二者都指“神性”，即被崇拜者；他把它们与 *tawḥīd*（承认真主的独一或排他）复合，表示把真主作为唯一崇拜与顺服对象的行为（*tawḥīd al-ulūhiyya* 与 *tawḥīd al-ilāhiyya*）。伊本·泰米叶还用 *rubūbiyya* 与 *rabbāniyya*（主性）表示真主作为创造者、维系者与本源的角色。承认真主是宇宙唯一的主（*tawḥīd al-rubūbiyya* 或 *tawḥīd al-rabbāniyya*）意味着真主是一切存在者——包括一切人类行为——的创造者。伊本·泰米叶常抱怨艾什尔里派凯拉姆神学家把承认真主主性的排他性（*tawḥīd al-rubūbiyya*）置于首位，却忽视真主独有的崇拜权利。他主张，相反，《古兰经》优先把崇拜专归真主（*tawḥīd al-ulūhiyya*），如《古兰经》首章的祈祷：“我们只崇拜你；我们只求你相助”（Q. 1:5）。“我们只崇拜你”在前，表达 *tawḥīd al-ulūhiyya*；随后“我们只求你相助”承认真主是生计的唯一来源，表达 *tawḥīd al-rubūbiyya*（Hoover 2007: 26–9, 120–2; Michot 2012b: 123–68）[^hoover-2007][^michot-2012b]。
