      > Every living being must have an object of love, which is the goal of its love and its will and towards which its inner and outer movements are directed. That is its god. That [love, will, and movement] is of no benefit unless it is for God alone, without giving Him an associate. Everything other than Islam is worthless.…Every religion, obedience, and love must have two things. The first is the object of religion, love, and obedience. This is the object of intention and the object of will. The second is the form of the deeds by which [that object] is obeyed and worshipped. This is the way, the path, the law, the method, and the means of access.…Religion encompasses two things: the object of worship and the worship. The object of worship is the one God. Worship is obeying Him and obeying His Messenger. This is the religion of God with which He is well pleased. As He said, “I am well pleased with Islam as a religion for you” (Qurʾān 5:3). (*Qāʾida fī al-maḥabba* 39–40; trans. Hoover 2019b: 43–4; see further Abbasi 2021: 64–70)[^abbasi-2021][^hoover-2019b]
    step1: |-
      > 每个有生命者都必有一个爱的对象，即其爱与意志的目标，其内外运动都朝向它。那就是它的神。这种[爱、意志与运动]若非专为真主、不给他设配主，便无益处。伊斯兰之外的一切都无价值……每种宗教、顺服与爱都必有两样东西。第一是宗教、爱与顺服的对象，即意图对象与意志对象。第二是借以顺服并崇拜[该对象]的行为形式，即道路、路径、律法、方法与接近手段……宗教包含两样：崇拜对象与崇拜。崇拜对象是独一真主；崇拜是顺服他、顺服他的使者。这是真主所喜悦的宗教。如他所说：“我已为你们喜悦伊斯兰为宗教”（《古兰经》5:3）。（*Qāʾida fī al-maḥabba* 39–40；译 Hoover 2019b: 43–4；进一步见 Abbasi 2021: 64–70）[^abbasi-2021][^hoover-2019b]
