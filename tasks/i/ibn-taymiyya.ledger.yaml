      According to Ibn Taymiyya, God’s perfection entails perpetual dynamism and not timeless eternity as in *kalām* theology and Avicennan philosophy. Ibn Taymiyya’s understanding of time, much like his interpretation of space, is Aristotelian in tenor. God does not transcend time, but God does not exist within time either. Rather, time derives from God’s internal dynamism and God’s perpetual creation of the world. Furthermore, there has always been time. The genus of time is eternal because God has been doing one thing after another from eternity. However, time does not subsist as an eternal entity independently of God. Time has no independent existence apart from the movement from which it derives (Suleiman 2019: 125–8)[^suleiman-2019].
    step1: |-
      据伊本·泰米叶，真主的完满蕴含永恒的动态，而非凯拉姆神学与阿维森纳哲学中的无时间永恒。伊本·泰米叶对时间的理解，颇似其对空间的解释，带有亚里士多德色彩。真主不超越时间，但真主也不存在于时间之中。相反，时间源自真主的内部动态与真主对世界的永恒创造。此外，时间一直存在。时间的种是永恒的，因为真主从永恒起就一件接一件地做。然而，时间并不作为永恒实体独立于真主而存在。时间离开其所由派生的运动，便无独立存在（Suleiman 2019: 125–8）[^suleiman-2019]。
