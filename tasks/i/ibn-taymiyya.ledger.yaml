      > If the subject matter of the syllogistic form is known [with certainty], then there is no doubt that it yields certainty. If it is said that every A is B and every B is C, and the two premises are known [with certainty], then there is no doubt that this combination yields [certain] knowledge that every A is C. This is not disputed. (*Manṭiqiyyīn* 293/339; cf. Hallaq 1993: 141)[^hallaq-1993]
    step1: |-
      > 若三段论形式的主项材料被[确定地]知道，那么它无疑产生确定性。若说“凡 A 是 B，凡 B 是 C”，且两个前提被[确定地]知道，那么这个组合无疑产生“凡 A 是 C”的[确定]知识。这没有争议。（*Manṭiqiyyīn* 293/339；参 Hallaq 1993: 141）[^hallaq-1993]
    step2: |-
      > 若三段论形式的主项材料被[确定地]知道，那么它无疑产生确定性。若说“凡 A 是 B，凡 B 是 C”，且两个前提被[确定地]知道，那么这个组合无疑产生“凡 A 是 C”的[确定]知识。这没有争议。（*Manṭiqiyyīn* 293/339；参 Hallaq 1993: 141）[^hallaq-1993]
