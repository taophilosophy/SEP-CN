      In Ibn Taymiyya’s view, the means of worship most pleasing to God and most beneficial to humankind is the law (*sharīʿa*) revealed to the Prophet Muḥammad. This law encompasses everything that God loves for human beings to believe and do, and it includes religious ritual, theological doctrines, contractual and moral obligations toward others, and religious virtues like patience and gratitude. Ibn Taymiyya maintains as well that the law of Islam is coextensive with justice and maximum human benefit (*maṣlaḥa*) in much the same way that he claims that reason and revelation coincide in matters of theology. Ibn Taymiyya is as much an apologist for the rationality of the divine law as he is for the rationality of his theological doctrines. The two terms “law” and “justice” are for him interchangeable, and he goes so far as to say that God will give victory to a just state that is not Muslim over a Muslim state that is not just. Furthermore, there is nothing outside the revealed law whose benefit outweighs its detriment. The religious law never neglects a benefit, and Muslim jurists who imagine that some acts not mentioned in the law are beneficial are mistaken. Al-Ghazālī had developed a process for authorizing unstated benefits (*al-maṣāliḥ al-mursala*) by identifying five fundamental purposes of the law: the preservation of religion, intellect, life, progeny and property. Benefits not found directly in the revealed law may be legitimized as part of that law by aligning them with the main purposes of the law. Ibn Taymiyya criticizes this strategy for adding rulings to the law that God did not legislate. Additionally, according to Ibn Taymiyya, al-Ghazālī’s five purposes are too narrowly focused on worldly affairs, and they do not take sufficient account of benefits found in legislated worship rituals like the ritual prayer (*ṣalāh*). For Ibn Taymiyya, innovated religious rituals, like commemorating the Prophet’s birthday, and other acts not found within the law may yield some benefit for those who perform them, but the detriments always outweigh the benefits. Ibn Taymiyya therefore condemns such acts and urges abandoning them if possible (Opwis 2010: 181–199; Rapoport 2010; Ukeles 2010; Vasalou 2016: 197–210; Mustafa 2023)[^mustafa-2023][^opwis-2010][^rapoport-2010][^rapoport-2010-2][^ukeles-2010][^vasalou-2016].
    step1: |-
      在伊本·泰米叶看来，最令真主喜悦、最有益于人类的崇拜手段，是启示给先知穆罕默德的律法（*sharīʿa*）。该律法涵盖真主愿人类信仰并做的一切，包括宗教仪式、神学教义、对他人的契约与道德义务，以及忍耐、感恩等宗教美德。伊本·泰米叶还主张，伊斯兰律法与正义及最大人类利益（*maṣlaḥa*）外延相同，正如他主张理性与启示在神学事务上一致。他既是神法理性性的辩护者，也是其神学教义理性性的辩护者。“律法”与“正义”二词对他可互换；他甚至说，真主会使一个非穆斯林但正义的国家战胜一个穆斯林但不正义的国家。此外，启示律法之外没有任何东西的益处超过其害处。宗教律法从不忽视利益；那些以为律法未提及的某些行为有益的穆斯林法学家错了。安萨里曾发展一套授权未明言利益（*al-maṣāliḥ al-mursala*）的程序，通过识别律法的五个基本目的：保护宗教、理智、生命、后代与财产。启示律法未直接提及的利益，可通过与律法主要目的对齐而被合法化为律法的一部分。伊本·泰米叶批评这一策略，认为它把真主未立法的判决加进律法。此外，据伊本·泰米叶，安萨里的五个目的过于狭窄地聚焦世俗事务，未充分考虑礼拜（*ṣalāh*）等定制的崇拜仪式中的利益。对伊本·泰米叶而言，创新的宗教仪式（如纪念先知诞辰）以及律法之外的其他行为，也许给践行者带来某些利益，但害处总是超过益处。因此他谴责此类行为，并敦促尽可能放弃（Opwis 2010: 181–199; Rapoport 2010; Ukeles 2010; Vasalou 2016: 197–210; Mustafa 2023）[^mustafa-2023][^opwis-2010][^rapoport-2010][^rapoport-2010-2][^ukeles-2010][^vasalou-2016]。
