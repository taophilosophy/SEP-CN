      Ibn Taymiyya’s *Refutation of the Logicians* received very little attention from logicians in his own day or in the following centuries (von Kügelgen 2013: 270–3). One possible reason for this is that he does not take the later logical tradition into account. Arab logicians from the twelfth century onward are not uniformly committed to the existence of extramental universals, as noted above, nor to the Avicennan claim that definitions and demonstrative syllogisms are the only means to acquire certain knowledge through rational reflection (Spevack 2010)[^spevack-2010]. Another possible reason is that Ibn Taymiyya is sometimes imprecise. For example, he reports baldly that the logicians claim, “No assents are known except by means of the syllogism” (*Manṭiqiyyīn* 88/130). As a few modern scholars have noted, this is not true when taken at face value; Avicennan logicians also recognize a variety of primary assents, as well as probable assents acquired through induction or analogy (Hallaq 1993: 30; El-Rouayheb 2016: 418)[^el-rouayheb-2016][^hallaq-1993]. Ibn Taymiyya is aware of this wider teaching about assent (*Manṭiqiyyīn* 4–7/46–8), and it becomes apparent during his *Refutation* that he is addressing the more limited claim that no acquired, certain assents are known except by means of the categorical syllogism. In sum Ibn Taymiyya’s imprecision and the fact that he gives later logical developments minimal attention may help explain why pre-modern logicians did not interact with his criticism (El-Rouayheb 2016: 417–22)[^el-rouayheb-2016].
    step1: |-
      伊本·泰米叶的《驳逻辑学家》在他生前及此后数世纪几乎未受逻辑学家注意（von Kügelgen 2013: 270–3）。一个可能原因是他未考虑后来的逻辑传统。如上所述，12 世纪以后的阿拉伯逻辑学家并非一致承诺心外共相存在，也并非一致承诺阿维森纳式主张——定义与证明三段论是经由理性反思获得确定知识的唯一手段（Spevack 2010）[^spevack-2010]。另一可能原因是他有时不够精确。例如，他直白地报告逻辑学家主张“除三段论外，无断定可知”（*Manṭiqiyyīn* 88/130）。正如一些现代学者指出，按字面看这并不成立；阿维森纳逻辑学家也承认各种原初断定，以及通过归纳或类比获得的或然断定（Hallaq 1993: 30; El-Rouayheb 2016: 418）[^el-rouayheb-2016][^hallaq-1993]。伊本·泰米叶知道关于断定的更广泛教导（*Manṭiqiyyīn* 4–7/46–8），且在其《驳论》中可以看出，他所针对的是更有限的主张：除直言三段论外，无获得的确定断定可知。总之，伊本·泰米叶的不精确，以及他对后来逻辑发展关注甚少，或可帮助解释前现代逻辑学家为何未与其批评互动（El-Rouayheb 2016: 417–22）[^el-rouayheb-2016]。
