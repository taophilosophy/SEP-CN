    source: |-
      It is also Ibn Taymiyya’s conviction that much of what is known about God through revelation is known equally and primally from reason and the human natural constitution (*fiṭra*). Prophets complete and perfect what humans already know, and revelation reiterates rational proofs relevant to religion and exposes incorrect reasoning for what it is. There is therefore no conflict between true revelation and correct reason, and this is the main claim to which Ibn Taymiyya’s devotes his masterwork *Averting the Conflict* (*Darʾ taʿāruḍ*). Ibn Taymiyya condemns philosophers and post-classical *kalām* theologians like the Ashʿarī Fakhr al-Dīn al-Rāzī for demoting the Qurʾān to mere information and subjecting it to alien and erroneous regimes of reason that lead to stripping God of his rightful attributes. Ibn Taymiyya’s apologetic aim is to take the rational high ground away from philosophers and *kalām* theologians by showing that his theology is what both reason and the texts of revelation indicate (Abrahamov 1992; Michot 1994; Kazi 2013; Zouggar 2014; Griffel 2018; Hoover with Mahajneh 2018; El-Tobgui 2020; Candiard 2023)[^abrahamov-1992][^candiard-2023][^el-tobgui-2020][^griffel-2018][^hoover-2018][^hoover-2018-2][^kazi-2013][^michot-1994][^zouggar-2014]. What follows here and in the following subsections will focus more on clarifying Ibn Taymiyya’s theological concepts than on their textual indicants. We begin with the basics of his natural theology.
    step1: |-
      伊本·泰米叶还确信，通过启示所知的许多关于真主之事，同样也可原初地从理性与人的自然禀赋（*fiṭra*）得知。先知完善并成全人已知之事，启示重申与宗教相关的理性证明，并揭露错误推理的真面目。因此，真启示与正确理性之间没有冲突；这正是伊本·泰米叶代表作《消除冲突》的主旨。他谴责哲学家与后古典凯拉姆神学家（如艾什尔里派法赫尔·丁·拉齐）把《古兰经》降为单纯信息，使之服从陌生而错误的理性体制，导致剥离真主的应有属性。伊本·泰米叶的护教目标，是从哲学家与凯拉姆神学家手中夺走理性高地，表明其神学正是理性与启示文本共同指示的（Abrahamov 1992; Michot 1994; Kazi 2013; Zouggar 2014; Griffel 2018; Hoover with Mahajneh 2018; El-Tobgui 2020; Candiard 2023）[^abrahamov-1992][^candiard-2023][^el-tobgui-2020][^griffel-2018][^hoover-2018][^hoover-2018-2][^kazi-2013][^michot-1994][^zouggar-2014]。以下及随后各小节将更多澄清伊本·泰米叶的神学概念，而非其文本指示。我们先从其自然神学基础开始。
