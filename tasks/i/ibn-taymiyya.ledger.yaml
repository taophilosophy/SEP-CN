      Al-Rāzī argues that a God located in space would need that space. Al-Rāzī here adopts a Platonic conception of space that subsists independently of the objects it contains (Adamson 2017)[^adamson-2017]. A space occupying God is thus dependent on the space in which He is located, and this impugns His self-sufficiency. Ibn Taymiyya denies the existence of space that subsists independently of other existents. He takes inspiration from Ibn Rushd who denies the existence of void space and defines place (*makān*) in Aristotelian terms as the inner surface of the body surrounding and containing it. The place of one celestial sphere, for example, is the inner surface of the celestial sphere surrounding it, but the universe has no place because it is not surrounded by anything at all, not even void space. Ibn Taymiyya likewise affirms that there is no void space. Space (*ḥayyiz*) is the boundary of an object inside of which the object extends and obtains. The boundaries are part of the object and do not exist apart from it. Without the object, no space exists. To put it differently, existents do not occupy space; instead, existents are spatially extended (*mutaḥayyiz*). So, nothing exists except God and the world below. There is nothing above the world except God, and there is no space above God that God could be said to occupy.
    step1: |-
      拉齐主张，位于空间中的真主会需要该空间。拉齐在此采纳柏拉图式空间概念，即空间独立于其所含对象而存在（Adamson 2017）[^adamson-2017]。占据真主的空间因而依赖真主所处之空间，这损害其自足性。伊本·泰米叶否认独立于其他存在者而存在的空间。他受伊本·鲁世德启发；后者否认虚空存在，并以亚里士多德术语把位置（*makān*）定义为包围并包含物体的物体的内表面。例如，一个天球的位置是包围它的天球的内表面，但宇宙没有位置，因为它不被任何东西包围，甚至不被虚空包围。伊本·泰米叶同样肯定没有虚空。空间（*ḥayyiz*）是物体内部的边界，物体在其中延展并成立。边界是物体的一部分，不脱离物体而存在。没有物体，便没有空间。换言之，存在者不占据空间；存在者是空间延展的（*mutaḥayyiz*）。所以，除真主与下方世界外，无物存在。世界之上除真主外无物，真主之上也没有可供真主占据的空间。
