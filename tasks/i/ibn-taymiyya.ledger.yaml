    source: |-
      Ibn Taymiyya (1263–1328) of Damascus was a prominent Sunnī religious scholar, activist, and reformer who sought to root out religious innovation and return Islam to the Qurʾān, the practice (*sunna*) of the Prophet Muḥammad, and the interpretations of the early Muslims (*salaf*). Ibn Taymiyya is best known today as a major inspiration to the global Salafism movement (Meijer 2009)[^meijer-2009]. A few modern scholars have heralded him as a philosopher on account of his nominalism, empiricism, and similarities with the philosopher Ibn Rushd (Averroes, d. 1198) (Ajhar 2014; Tamer 2013 provides a survey of such views)[^ajhar-2014][^tamer-2013]. Others have denigrated him for slavish traditionalism, literalism, and hatred of reason thanks to his refutation of Aristotelian logic and his call for revelation-based reform (e.g., Fakhry 2004: 326–9; Walbridge 2011: 5, 115)[^fakhry-2004][^walbridge-2011]. Ibn Taymiyya was in fact very well read in the philosophical and theological literature of his day (Michot 2000b: 599)[^michot-2000b], and he deployed extensive hermeneutical reflection and rational argumentation to defend his interpretation of Islamic revelation as fully congruent with reason. While it may go too far to call Ibn Taymiyya a philosopher (Tamer 2013: 373)[^tamer-2013], he was certainly an apologist for the rationality of Islamic revelation, and there is much of philosophical interest in his writings. Ibn Taymiyya’s approach has thus been called philosophical theology (Hoover 2004: 295)[^hoover-2004] and Qurʾānic rational theology (Özervarli 2010: 78)[^özervarli-2010].
    step1: |-
      伊本·泰米叶（1263–1328）是大马士革著名的逊尼派宗教学者、活动家与改革者，力图根除宗教创新，使伊斯兰回归《古兰经》、先知穆罕默德的实践（*sunna*，逊奈）以及早期穆斯林（*salaf*，萨拉夫）的解释。今天，伊本·泰米叶最广为人知的身份是全球萨拉菲主义运动的重要灵感来源（Meijer 2009）[^meijer-2009]。少数现代学者因他的唯名论、经验论以及与哲学家伊本·鲁世德（阿威罗伊，卒于 1198）的相似性，称他为哲学家（Ajhar 2014; Tamer 2013 综述了此类观点）[^ajhar-2014][^tamer-2013]。另一些人则因他驳斥亚里士多德逻辑、呼吁以启示为基础的改革，而诋毁他是奴性传统主义、字面主义与仇视理性（如 Fakhry 2004: 326–9; Walbridge 2011: 5, 115）[^fakhry-2004][^walbridge-2011]。事实上，伊本·泰米叶对当时哲学与神学文献涉猎极广（Michot 2000b: 599）[^michot-2000b]，并运用大量解释学反思与理性论证，捍卫他对伊斯兰启示的解释——它完全符合理性。称伊本·泰米叶为哲学家也许言过其实（Tamer 2013: 373）[^tamer-2013]，但他无疑是伊斯兰启示之理性性的辩护者，其著作中颇有哲学趣味。因此，伊本·泰米叶的进路被称为哲学神学（Hoover 2004: 295）[^hoover-2004] 与《古兰经》理性神学（Özervarli 2010: 78）[^özervarli-2010]。
