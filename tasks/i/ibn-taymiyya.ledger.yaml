      Ibn Taymiyya’s understanding of God’s internal dynamism is similar to views held earlier by the philosopher Abū Barakāt al-Baghdādī (d. ca. 1165) and the Karrāmī theologians who thrived in what is today Iran and Afghanistan. He also acknowledges that his position is tantamount to what *kalām* theologians identify as temporally originating events (*ḥawādith*) subsisting in God’s essence. However, Ibn Taymiyya prefers to avoid the non-scriptural term *ḥawādith* and speak instead of God’s dynamism in terms of God’s voluntary attributes (*al-ṣifāt al-ikhtiyāriyya*). God’s voluntary attributes include God’s creation, love, mercy, wrath, justice, sitting and descending. These attributes subsist in God’s essence, and God exercises them by means of His will and power. Ibn Taymiyya contrasts his view with those of the Ashʿarīs and Muʿtazilīs, taking speech as a prime example. The Ashʿarīs maintain along with Ibn Taymiyya that God’s speech, will, and power subsist in God’s essence, but they insist that these attributes are timelessly eternal to avert temporality in the essence of God. Ibn Taymiyya counters that the Ashʿarīs thereby abolish the instrumentality between God’s will and power on the one hand and God’s speech on the other. They impugn God’s perfection by making it impossible for God to speak by means of His will and power. Additionally, Ibn Taymiyya does not believe that it is possible to correlate a timelessly eternal attribute of speech with temporal events in the world. The Muʿtazilīs for their part do affirm that God speaks by His will, but they seek to safeguard God’s timeless eternity by understanding God’s speech to be something created in a substrate disjoined from God’s essence. Ibn Taymiyya responds that such speech is no longer God’s own because it does not subsist within Him. For Ibn Taymiyya, the correct view, the view of the *salaf*, is that God has been speaking by His will and power from eternity with individual acts of speech subsisting in His essence. These divine speech acts are not themselves eternal, but neither are they created because created things do not subsist in the essence of God. Ibn Taymiyya breaks the *kalām* identity of the temporal with the created and the timelessly eternal with the uncreated. God’s internal dynamism is temporal in character but not created. God’s uncreated speech acts are temporal and can address temporal events in the world (Hoover 2004: 296–9; Hoover 2010: 58–60; Suleiman 2019: 298–312)[^hoover-2004][^hoover-2010][^suleiman-2019].
    step1: |-
      伊本·泰米叶对真主内部动态的理解，类似哲学家阿布·巴拉卡特·巴格达迪（约卒于 1165）与卡兰米派神学家早先的观点；后者活跃于今伊朗与阿富汗一带。他也承认，其立场等同于凯拉姆神学家所谓“在真主本质中成立的时间性生起事件（*ḥawādith*）”。然而，伊本·泰米叶宁愿回避非经文的 *ḥawādith* 一词，转而以真主的自愿属性（*al-ṣifāt al-ikhtiyāriyya*）谈真主的动态。真主的自愿属性包括真主的创造、爱、慈悯、愤怒、正义、端坐与降临。这些属性在真主本质中成立，真主借其意志与能力运用它们。伊本·泰米叶以言语为首要例子，把自己的观点与艾什尔里派和穆尔太齐赖派对照。艾什尔里派与伊本·泰米叶一样主张，真主的言语、意志与能力在真主本质中成立，但他们坚持这些属性无时间地永恒，以避免真主本质中的时间性。伊本·泰米叶反驳说，艾什尔里派由此取消了真主意愿与能力同真主言语之间的工具关系。他们使真主不能借其意志与能力言说，从而损害真主的完满。此外，伊本·泰米叶不相信能把无时间永恒的言语属性与世界中的时间事件关联起来。穆尔太齐赖派则肯定真主借其意志言说，但他们试图通过把真主言语理解为在被造基质中、与真主本质分离的东西，来保障真主的无时间永恒。伊本·泰米叶回应说，这样的言语不再是真主自己的，因为它不在真主之中成立。在伊本·泰米叶看来，正确观点、即 *salaf* 的观点是：真主从永恒起就借其意志与能力言说，个别的言语行为在真主本质中成立。这些神圣言语行为本身不是永恒的，但也不是被造的，因为被造物不在真主本质中成立。伊本·泰米叶打破了凯拉姆关于“时间性的即被造的、无时间永恒的即非被造的”这一等同。真主的内部动态在性质上是时间性的，但不是被造的。真主非被造的言语行为是时间性的，可以针对世界中的时间事件（Hoover 2004: 296–9; Hoover 2010: 58–60; Suleiman 2019: 298–312）[^hoover-2004][^hoover-2010][^suleiman-2019]。
