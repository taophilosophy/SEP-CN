      > The names applied [both] to [God] and others are applied by way of modulation (*tashkīk*), which is a kind of general univocity (*al-tawāṭuʾ al-ʿāmm*). It is neither a matter of equivocity, nor a matter of univocity in which the individuals to which it applies are alike. Rather, it is a matter of univocity in which the individuals to which it applies take precedence over each other. For example, the word “white” or “black” is applied to what is intense, like the whiteness of snow, and to what is less [intense], like the whiteness of ivory. Likewise, the word “existence” is applied to [both] the necessary and the possible….Modulated names must have a shared universal meaning, even if that occurs only in the mind….The fact that the existence of the necessary is more perfect than the existence of the possible does not prevent what is called “existence” from being a universal meaning shared between the two of them. This is likewise the case with regard to the other names and attributes applied to the Creator and the creature, like the names Living, Knowing, Powerful, Hearing, and Seeing, and likewise with His attributes, like His knowledge, His power, His mercy, His good pleasure, His anger, and His joy, and the rest of His names and His attributes that the messengers applied to Him. (*Manṭiqiyyīn* 155/198; see further Ali 2000: 114–25; Suleiman 2019: 145–77; El-Tobgui 2020: 193–206, 285–8; on the Avicennan background, see Janos 2022; Adamson & Benovich 2023: 109–37)[^adamson-2023][^ali-2000][^el-tobgui-2020][^janos-2022][^suleiman-2019]
    step1: |-
      > 用于[真主]与他者的尊名，是以调节（*tashkīk*）的方式使用的，这是一种普遍单义（*al-tawāṭuʾ al-ʿāmm*）。它既非歧义，也非其适用个体彼此相似的单义，而是其适用个体有先后等级的单义。例如，“白”或“黑”一词用于浓者，如雪之白，也用于较淡者，如象牙之白。同样，“存在”一词用于必然者与可能者……调节的尊名必有共享的普遍意义，即便这只出现在心灵中……必然者的存在比可能者的存在更完满，这并不妨碍被称为“存在”者成为二者共享的普遍意义。用于创造者与受造物的其他尊名与属性亦然，如“永生”“全知”“全能”“全听”“全观”，其属性如他的知识、能力、慈悯、喜悦、愤怒、欢乐，以及众使者用于他的其余尊名与属性。（*Manṭiqiyyīn* 155/198；进一步见 Ali 2000: 114–25; Suleiman 2019: 145–77; El-Tobgui 2020: 193–206, 285–8；关于阿维森纳背景，见 Janos 2022; Adamson & Benovich 2023: 109–37）[^adamson-2023][^ali-2000][^el-tobgui-2020][^janos-2022][^suleiman-2019]
