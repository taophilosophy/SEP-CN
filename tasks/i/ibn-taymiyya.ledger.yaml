      Apart from prophecy, Ibn Taymiyya also appeals to the collective *fiṭra* of humankind to secure the reliability of sensory knowledge and rational axioms against the corrupt reasoning of *kalām* theologians and philosophers. For example, the axiom that one of two existents is either suffused within the other or distinct from it is so abundantly transmitted from ordinary people of sound *fiṭra* as to preclude collusion and error. This unmasks the faulty reasoning of theologians of corrupted *fiṭra* who posit a third type of existent that is neither suffused within another existent nor distinct from it (i.e., God). With this, abundant transmission (*tawāṭur*) guarantees for Ibn Taymiyya not only the authenticity of divine revelation but also the certainty of knowledge that accords with logical axioms and sense perception (El-Tobgui 2018a; El-Tobgui 2020: 267–75)[^el-tobgui-2018a][^el-tobgui-2020].
    step1: |-
      除预言外，伊本·泰米叶还诉诸人类的集体 *fiṭra*，以保障感官知识与理性公理的可靠性，对抗凯拉姆神学家与哲学家的败坏推理。例如，“两个存在者之一要么渗透于另一个之中、要么与之区分”这一公理，从具有健全 *fiṭra* 的普通人那里被如此大量地传递，以至排除了串通与错误。这揭穿了 *fiṭra* 已败坏的神学家们的错误推理：他们设定第三种存在者，既不渗透于另一存在者之中，也不与之区分（即真主）。由此，大量传递（*tawāṭur*）对伊本·泰米叶而言不仅保障神圣启示的真实性，也保障符合逻辑公理与感官知觉的知识之确定性（El-Tobgui 2018a; El-Tobgui 2020: 267–75）[^el-tobgui-2018a][^el-tobgui-2020]。
