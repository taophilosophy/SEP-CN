      > It is not permissible that God—Exalted is He—and another be included in a categorical syllogism whose terms are on the same level or in an analogy in which the judgment of the original case and that of the assimilated case are on the same level. Indeed, God—Exalted is He—there is nothing like Him, neither in His essence which is mentioned through His names, nor in His attributes, nor in His acts. However, the a fortiori argument is followed with respect to Him. As He said, “And to God is the highest similitude (*al-mathal al-aʿlā*)” (Q. 16:60). With respect to every perfection and attribute praiseworthy in itself and devoid of imperfection that belongs to some created, originated existents, it is known that the Lord, Creator, Self-Subsistent, Everlasting, Eternal and Necessary Existent in Himself is all the worthier of it, and [with respect to] every imperfection and defect from which some originated, possible creatures must be exonerated, the Lord, Creator, Holy, Peace, Eternal, Necessary of Existence in Himself is all the worthier of being exonerated from it. (*Sharḥ al-Iṣbahāniyya* 456–7; trans. adapted from Hoover 2007: 59)[^hoover-2007]
    step1: |-
      > 不允许把真主——至高无上——与他者纳入词项同等层次的直言三段论，或纳入原初案例与归入案例判断同等层次的类比。的确，真主——至高无上——没有任何物像他，无论在其尊名所述的本质中，还是在其属性中，还是在其行动中。然而，对真主可使用强化论证。如他所说：“真主有最高的典型”（Q. 16:60）。凡本身可赞、且无缺陷的完满性与属性，若属于某些被造的、被生成的存在者，那么主、创造者、自存者、永恒者、自在必然存在者更配得它；凡某些被造的、可能的存在者必须免除的缺陷与不足，主、创造者、神圣者、和平者、永恒者、自在必然存在者更配得免除它。（*Sharḥ al-Iṣbahāniyya* 456–7；译文据 Hoover 2007: 59 改编）[^hoover-2007]
