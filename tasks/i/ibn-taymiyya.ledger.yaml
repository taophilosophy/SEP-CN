      Ibn Taymiyya also maintains that certain rational principles obtain universally, both in the mind and in extramental reality. These principles accord with his physicalist ontology, and they include logical axioms like the law of noncontradiction and the law of the excluded middle. It is not possible, for example, that something exist and not exist at the same time or that something exist neither inside the world nor outside of it. Likewise, one of two existents cannot be neither suffused within the other nor distinct from it. Ibn Taymiyya also affirms the division of existents into two fundamental types. Every existent is either eternal or originated, necessary or possible, and self-subsisting or subsisting in another. He insists on the universal applicability of efficient causality as well. Nothing possible or temporal can come into existence without a sufficient cause. Everything originated requires an originator (*muḥdith*), and everything preponderated needs a preponderator (*murajjīḥ*). It is for this reason, Ibn Taymiyya maintains, that normally functioning human beings perceive directly from their own existence that there must be a God who created them (El-Tobgui 2020: 255–60, 283)[^el-tobgui-2020].
    step1: |-
      伊本·泰米叶还主张，某些理性原则普遍成立，既在心灵中，也在心外实在中。这些原则与其物理主义本体论一致，包括不矛盾律与排中律等逻辑公理。例如，某物不可能同时存在又不存在，也不可能既不在世界之内又不在世界之外。同样，两个存在者之一不可能既不渗透于另一个之中，也不与之区分。伊本·泰米叶还肯定存在者分为两个基本类型：每个存在者要么永恒要么被造，要么必然要么可能，要么自存要么依存于他者。他也坚持动力因的普遍适用性：任何可能或时间中的事物，若无充分原因便不能进入存在。一切被造者都需要一个创造者（*muḥdith*），一切被偏重者都需要一个偏重者（*murajjīḥ*）。正因如此，伊本·泰米叶主张，正常运作的人从自身存在直接感知到必有一位创造他们的真主（El-Tobgui 2020: 255–60, 283）[^el-tobgui-2020]。
    step2: |-
