      The polemic against likening and stripping away is aimed at two broad trends. First, according to Ibn Taymiyya, Muʿtazilī and post-classical Ashʿarī *kalām* theologians liken God’s attributes to those of creatures. Then, they strip God of those attributes that imply anthropomorphism and corporealism and sometimes reinterpret them. God cannot have a literal “hand”, for example, and so the literal sense must be denied and perhaps reinterpreted non-literally as God’s “power”. Likewise, it must be denied that God’s “sitting” has anything to do with motion, place, or space, and it may perhaps be reinterpreted as God’s “possessing”. Ibn Taymiyya rejects the *kalām* approach and insists that all God’s attributes must be affirmed equally as uniquely befitting God. Divine attributes that could imply corporeality may not be denied while other attributes are affirmed (Hoover 2007: 48–52)[^hoover-2007].
    step1: |-
      反对比附与剥离的论战针对两大潮流。第一，据伊本·泰米叶，穆尔太齐赖派与后古典艾什尔里派凯拉姆神学家把真主的属性比附于受造物的属性。随后，他们剥离真主那些蕴含拟人化与形体论的属性，有时重新解释它们。例如，真主不可能有字面意义上的“手”，故必须否认字面意义，也许非字面地重新解释为真主的“能力”。同样，必须否认真主的“端坐”与运动、位置或空间有任何关系，也许重新解释为真主的“占有”。伊本·泰米叶拒绝凯拉姆进路，坚持真主的一切属性都必须同样肯定为独特地适于真主。不得在肯定某些属性的同时否认可能蕴含形体性的神性属性（Hoover 2007: 48–52）[^hoover-2007]。
