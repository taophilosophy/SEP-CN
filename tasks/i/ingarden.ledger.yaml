      In addition to his work on the ontology of works of art and their values, Ingarden also engaged in directly phenomenological investigations into the nature of our experience of works of art of various kinds. For example, he examines our experience of literature in *The Cognition of the Literary Work of Art.* As Jeff Mitscherling notes, Ingarden interrupted his work on *The Controversy over the Existence of the World* to write this volume—in order to first establish “that the literary work of art subsists independently of the acts of consciousness both of its author and of its readers, and that it persists in such a way as to be intersubjectively accessible to any number of aestheticaly engaged subjects” (2023, 114), thus beginning with problems about the intersubjectivity of the cultural world, before moving on to address the problem of the existence of the ‘real’ world. The investigations of the experience of works of literature found in *The Literary Work of Art* and *The Cognition of the Literary Work of Art* are unparalleled in richness of insights. One particularly interesting contribution is his discussion of the difference between our ordinary experience of time, time as it is represented in works of literature, and as it is experienced in reading works of literature. For discussion of this contribution and its relevance to work not only in philosophy of literature but also in the philosophy of time, see Elsby (2023).
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Ingarden also investigates our experience of music in *The Work of Music and the Problem of its Identity*, and of aesthetic experience more generally (including experience of sculpture) in “Aesthetic Experience and Aesthetic Object”. In each case he is concerned not only to offer a detailed analysis of the development of the relevant aesthetic experience (including its development over time), but also to contrast such aesthetic experiences with cases of ordinary sense perception, undertaken in what he calls a ’practical’ or an ‘investigating attitude’ (1961, 295). For an overview of Ingarden’s work on the aesthetic attitude and comparison to Bence Nanay’s recent work, see Mäcklin (2023).
