  - id: 3
    kind: body
    source: |-
      Roman Witold Ingarden was born on February 5, 1893 in Kraków. He initially studied philosophy, mathematics and physics in Lwów (now known as ‘Lviv’ and in Ukraine). With the support of Kazimierz Twardowski, Ingarden went to Göttingen in 1912, where he studied philosophy under Edmund Husserl, taking four semesters of seminars with Husserl, from 1912 to 1914 and again during the spring and summer of 1915. There he was in close contact with other members of Husserl’s Göttigen circle of students, including Adolf Reinach and Edith Stein. Husserl considered Ingarden one of his best students, and the two remained in close touch until Husserl’s death in 1938 (their philosophical correspondence was eventually published as Husserl’s *Briefe an Roman Ingarden*). Ingarden also studied philosophy with Kazimierz Twardowski (who, like Husserl, was a student of Franz Brentano) both in Lwów and in Vienna during World War 1. When Husserl accepted the chair at Freiburg, Ingarden followed him in 1916 and they had regular extensive discussions of phenomenology. Ingarden submitted his dissertation “*Intuition und Intellekt bei Henri Bergson*” in 1917, for which he received his Ph.D. in 1918, with Husserl as director.
    step1: |-
      罗曼·维托尔德·英伽登 1893 年 2 月 5 日生于克拉科夫。他最初在利沃夫（今属乌克兰，称“利维夫”）学习哲学、数学与物理学。在卡齐米日·特瓦尔多夫斯基的资助下，英伽登于 1912 年前往哥廷根，师从埃德蒙德·胡塞尔研习哲学，1912 至 1914 年以及 1915 年春夏两度随胡塞尔修习研讨课，共四个学期。他在那里与胡塞尔哥廷根学生圈的其他成员往来密切，其中包括阿道夫·莱纳赫与艾迪特·施泰因。胡塞尔视英伽登为其最优秀的学生之一，二人保持密切联系，直至 1938 年胡塞尔去世（他们的哲学通信后来以胡塞尔《致罗曼·英伽登的书信》之名出版）。英伽登还曾在利沃夫与维也纳随卡齐米日·特瓦尔多夫斯基研习哲学（特瓦尔多夫斯基与胡塞尔一样，也是弗朗茨·布伦塔诺的学生），时为第一次世界大战期间。1916 年胡塞尔接任弗莱堡教席，英伽登随之前往，二人经常就现象学作长时间的深入讨论。英伽登于 1917 年提交学位论文《亨利·柏格森那里的直观与理智》（*Intuition und Intellekt bei Henri Bergson*），1918 年以胡塞尔为导师获博士学位。
    step2: |-
      罗曼·维托尔德·英伽登 1893 年 2 月 5 日生于克拉科夫。他先在利沃夫（今属乌克兰，称“利维夫”）攻读哲学、数学与物理学。得卡齐米日·特瓦尔多夫斯基之助，英伽登 1912 年赴哥廷根，随埃德蒙德·胡塞尔治哲学，1912 至 1914 年及 1915 年春夏两度听其研讨课，前后共四个学期。其间他与胡塞尔哥廷根学生圈中人过从甚密，包括阿道夫·莱纳赫与艾迪特·施泰因。胡塞尔视英伽登为最得意的门生之一，两人书信不断，直至 1938 年胡塞尔谢世（二人哲学通信后以胡塞尔《致罗曼·英伽登书信集》刊行）。一战期间，英伽登又在利沃夫与维也纳随卡齐米日·特瓦尔多夫斯基治哲学——特瓦尔多夫斯基与胡塞尔同出弗朗茨·布伦塔诺门下。1916 年胡塞尔接弗莱堡教席，英伽登随之而去，两人常就现象学作长篇讨论。1917 年英伽登呈交博士论文《亨利·柏格森那里的直观与理智》（*Intuition und Intellekt bei Henri Bergson*），1918 年在胡塞尔指导下获博士学位。
