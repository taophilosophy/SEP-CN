      In his Habilitationscrhift, *Essentiale Fragen* (*Essential Questions*) from 1925, Ingarden aims to develop a general theory of questions (as contrasted with judgments). In *Essential Questions*, the focus is on different ways in which one may ask questions about essences. The goals of this work were twofold: on the one hand, it is an extended defense of the idea that we must accept essences, as a way of defending the practice of phenomenology. On the other hand, it also works towards addressing the realism-idealism controversy that would occupy his work for the rest of his life (Corbella 2023, 69)[^corbella-2023]. His work in *Essential Questions* “paves the way for his future metaphysics of the world”, such as he later develops in *The Controversy over the Existence of the World* (de Santis 2015). Ingarden argues that a question, though it makes no judgment, points towards (or, as Ingarden says “knocks at”) reality, and aims to be determined by a reality that transcends our own cognition. In this text, Ingarden also lays out important differences between ideal beings (such as essences) and real individual objects (Corbella 2023, 69)[^corbella-2023]—a start at distinguishing different modes of being. Ingarden assumes (as was characteristic in the phenomenological tradition) that there is a correlation between types of judgment and entities judged about. He thus uses the differences in the sorts of *judgments* that would answer the various questions as the basis for distinguishing different *categories* of ideas. (For further discussion of *Essential Questions*, see Corbella 2023, de Santis 2015, Ryle 1927)[^corbella-2023][^ryle-1927].
    step1: |-
      在其 1925 年的教授资格论文《本质问题》（*Essentiale Fragen*）中，英伽登试图建立一套关于提问（相对于判断）的一般理论。《本质问题》关注的是人们就本质提问的各种不同方式。该著作有双重目标：一方面，它是对“我们必须接受本质”这一观念的长篇辩护，以此捍卫现象学的实践；另一方面，它也致力于处理那个将占据其后半生的实在论—唯心论之争（Corbella 2023, 69）[^corbella-2023]。他在《本质问题》中的工作“为其后来的世界形而上学铺平了道路”，一如他后来在《关于世界存在性的争论》中所发展的那样（de Santis 2015）。英伽登主张，一个问题虽不作判断，却指向（或如英伽登所说，“叩击”）实在，并旨在由一种超越我们自身认知的实在来判定。在这部文本中，英伽登还阐明了观念性存在者（如本质）与实在个体对象之间的重要差别（Corbella 2023, 69）[^corbella-2023]——这是区分不同存在方式的开端。英伽登假定（如现象学传统所常见的那样）判断的类型与被判断的实体之间存在相关。因此他以回答各类问题所需的*判断*类型之差异，作为区分不同观念*范畴*的依据。（关于《本质问题》的进一步讨论，见 Corbella 2023、de Santis 2015、Ryle 1927。）[^corbella-2023][^ryle-1927]
