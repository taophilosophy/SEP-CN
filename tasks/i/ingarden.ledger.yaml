      Ingarden’s influence on philosophy and literary studies continues to grow. His phenomenological approach to aesthetics strongly influenced the work of Mikel Dufrenne in *The Phenomenology of Aesthetic Experience* (1953)*.* Ingarden’s work on literature (especially in *The Literary Work of Art*) has been an enormous influence in literary studies, where its effects are visible in Wolfgang Kayser’s work *Das sprachliche Kunstwerk* and in the development of the schools of New Criticism and Reader Response Theory in the work of such theorists as René Wellek and Wolfgang Iser, respectively. Ingarden’s greatest impact in analytic philosophy has also been in aesthetics. There are strong resonances between his work on the ontology of art and contemporary analytic work in aesthetics, e.g., by Joseph Margolis, Nelson Goodman and Jerrold Levinson. Ingarden’s contributions to musical aesthetics are compared to recent work by Scruton and Levinson in Świderski (2023). There has been ongoing discussion of his studies of aesthetic experience in recently revived discussions about the ‘aesthetic attitude’. As Harri Mäcklin puts it, “Ingarden’s thinking on the aesthetic attitude in many ways prefigures, exceeds, and augments the contemporary debate on aesthetic attention” (2023, 139). Theories of fiction and fictional characters (such as Thomasson 1999)[^thomasson-1999] have been heavily influenced by Ingarden’s work. Others have used his work to help understand new art forms, as Matthew Gladden (2023) appeals to Ingarden’s notions of concretization and of the ‘life cycle’ of the work of art to help explain the enduring appeal of relatively indeterminate 8-bit computer games from the 1980s.
    step1: |-
      英伽登对哲学与文学研究的影响持续增长。他的现象学美学进路强烈影响了 Mikel Dufrenne 的《审美经验现象学》（1953）*。*他在文学方面的工作（尤其是《文学的艺术作品》）对文学研究影响巨大：Wolfgang Kayser 的《语言的文学作品》一书以及新批评与读者反应理论这两个学派的发展中都能看到其痕迹，后者分别见于 René Wellek 与 Wolfgang Iser 等理论家的著作。英伽登在分析哲学中最大的影响也在美学。他关于艺术本体论的工作与分析美学当代工作（如 Joseph Margolis、Nelson Goodman 与 Jerrold Levinson 的著作）之间存在强烈的呼应。英伽登对音乐美学的贡献，在 Świderski（2023）中被与 Scruton 和 Levinson 的近期工作相比较。近来“审美态度”讨论复兴，他的审美经验研究也随之被持续讨论。正如 Harri Mäcklin 所说：“英伽登关于审美态度的思考在许多方面预示、超越并拓展了当代关于审美注意的争论”（2023, 139）。虚构与虚构人物的理论（如 Thomasson 1999）[^thomasson-1999]深受英伽登工作的影响。另有学者用他的工作来理解新的艺术形式：Matthew Gladden（2023）借助英伽登的具体化概念与艺术作品的“生命周期”概念，说明 1980 年代那些不确定性较强的 8 位电脑游戏何以魅力持久。
