      Most of Ingarden’s major work focuses on ontology, which he considers a purely *a priori* enterprise, concerned not with what actually exists, but with what could possibly exist (which concepts are non-contradictory), and with what (according to the contents of the relevant ideas) it would take for objects of various kinds to exist, or entail if they existed. He thus contrasts ontology with metaphysics, which is concerned with answering factual questions about what sorts of things actually exist and what they are like. Ontology, in Ingarden’s hands, thus bears close resemblance to the sorts of conceptual analysis that became common in analytic philosophy in roughly the same period. Ingarden’s work on the ontology of art is ontological in this sense, e.g. he attempts to determine, by analyzing the essential meanings of experiences that could present something as a work of literature, music, or architecture, what sort of an entity such an object would have to be to satisfy those experiences and meanings, and how it would have to relate to consciousness and physical objects.
    step1: |-
      英伽登的主要工作大多集中于本体论。他视本体论为纯粹*先天*的事业，关心的不是实际存在什么，而是可能存在着什么（哪些概念不自相矛盾），以及（依相关观念的内容）各类对象要存在需要什么、若存在则蕴含什么。他因此把本体论与形而上学相对照，后者关心的是关于实际存在何种事物、它们如何这类事实问题。在英伽登手中，本体论与大约同一时期在分析哲学中流行起来的概念分析颇为相似。他关于艺术本体论的工作即属此义的本体论：例如，他试图通过分析那些能够把某物呈现为文学作品、音乐作品或建筑作品的体验之本质意义，判定这样的对象必须是什么样的实体才配得上这些体验与意义，以及它必须如何与意识和物理对象相关联。
