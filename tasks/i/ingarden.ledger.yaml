    kind: body
    source: |-
      After submitting his dissertation, Ingarden returned to Poland for the remainder of his academic career, first teaching mathematics, psychology and philosophy in secondary schools while he worked on his Habilitationschrift. That work, published as *Essentiale Fragen* in 1925, attracted some attention in the English speaking philosophical world, being reviewed twice in *Mind* (by A.C. Ewing in 1926 and by Gilbert Ryle in 1927)[^ewing-1926][^ryle-1927]. With the publication of his Habilitationschrift, Ingarden was appointed as Privatdozent at the Jan Kazimierz University in Lwów, where he was promoted to Professor in 1933. During this time his most well known work, *The Literary Work of Art*, was first published (1931, in German), followed by *The Cognition of the Literary Work* (1936, in Polish). His academic career was interrupted from 1941–1944, when (due to the war) the university was closed, and he secretly taught philosophy at the university, and mathematics to secondary school children in an orphanage. At the same time (and despite the bombing of his house in Lwów), Ingarden was working intensively on his magnum opus *The Controversy over the Existence of the World* (the first two volumes of which were published in Polish in 1947 and 1948 respectively). In 1945 he moved to Jagiellonian University in Kraków, where he was given a chair in 1946, however in 1949, (under Stalinization) he was banned from teaching because of his alleged “idealism” (ironically, a philosophical position against which Ingarden fought for most of his life) and for being an “enemy of materialism”. The ban continued until 1957, at which point Ingarden was reappointed to his post at Jagiellonian University, where he taught until his retirement in 1963 and continued to write, publishing such works as *The Ontology of the Work of Art* (1962) and *Experience, Artwork and Value* (1969). Ingarden died suddenly of a cerebral hemorrhage on June 14, 1970, while still fully engaged in his philosophical projects. A careful, detailed, and fully documented account of Ingarden’s biography may be found in Mitscherling (1997), as well as in a recent lovingly detailed biography (Kuliniak and Pandura 2025)[^kuliniak-2025] researched in part from primary resources of the Ingarden Family Archives managed by Ingarden’s grandson, the architect Professor Krzysztof Ingarden.
    step1: |-
      提交论文后，英伽登返回波兰度过余下的学术生涯。起初他在中学教授数学、心理学与哲学，同时撰写教授资格论文。该文于 1925 年以《本质问题》（*Essentiale Fragen*）之名出版，在英语哲学界引起一定关注，《心灵》杂志两度发表书评（1926 年 A. C. Ewing 撰，1927 年 Gilbert Ryle 撰）[^ewing-1926][^ryle-1927]。教授资格论文出版后，英伽登受聘为利沃夫扬·卡齐米日大学无薪讲师，1933 年升任教授。此期间他最著名的著作《文学的艺术作品》首次出版（1931 年，德文），随后是《对文学作品的认知》（1936 年，波兰文）。1941 至 1944 年，因战争大学关闭，他的学术生涯随之中断；他秘密地在大学讲授哲学，又在孤儿院为中学生讲授数学。同一时期（且不顾其利沃夫住宅遭轰炸），英伽登正紧张撰写其代表作《关于世界存在性的争论》（第一、二卷分别于 1947、1948 年以波兰文出版）。1945 年他迁往克拉科夫雅盖隆大学，1946 年获教席；然而 1949 年在斯大林化运动中，他因所谓“唯心论”（讽刺的是，这正是英伽登大半生所反对的哲学立场）以及身为“唯物主义的敌人”而被禁止授课。禁令持续到 1957 年，此后英伽登复职于雅盖隆大学，执教至 1963 年退休，并继续写作，出版了《艺术作品的本体论》（1962）与《体验、艺术作品与价值》（1969）等书。1970 年 6 月 14 日，英伽登因脑溢血猝然去世，其时仍全力投入其哲学计划。关于英伽登生平的严谨、详尽且有完整文献依据的叙述，见 Mitscherling（1997），以及晚近一部用情甚深的详细传记（Kuliniak and Pandura 2025）[^kuliniak-2025]，后者部分依据英伽登之孙、建筑师 Krzysztof Ingarden 教授所管理的英伽登家族档案的一手材料写成。
    step2: |-
      交出论文后，英伽登回到波兰，此后一生都在此治学。他先在中学教数学、心理学与哲学，同时写教授资格论文。该文 1925 年以《本质问题》（*Essentiale Fragen*）出版，在英语哲学界颇受注意，《心灵》杂志先后两次刊出书评（1926 年 A. C. Ewing、1927 年 Gilbert Ryle）[^ewing-1926][^ryle-1927]。论文出版后，他受聘为利沃夫扬·卡齐米日大学编外讲师，1933 年升教授。此间他最负盛名的《文学的艺术作品》初版问世（1931 年，德文），继之为《对文学作品的认知》（1936 年，波兰文）。1941 至 1944 年战争使大学停办，其教职随之中断：他暗中在大学讲哲学，又到孤儿院给中学生讲数学。与此同时（且不顾利沃夫寓所被炸），他正全力撰写代表作《关于世界存在性的争论》（第一、二卷分别于 1947、1948 年以波兰文刊行）。1945 年他转赴克拉科夫雅盖隆大学，1946 年获教席；但 1949 年斯大林化运动中，他被禁讲坛。罪名有二：一是所谓“唯心论”——讽刺的是，这正是他大半生与之搏斗的立场；二是身为“唯物主义的敌人”。禁令直到 1957 年才解除，英伽登复职于雅盖隆大学，授课至 1963 年退休，退而不辍，先后刊出《艺术作品的本体论》（1962）与《体验、艺术作品与价值》（1969）。1970 年 6 月 14 日，他因脑溢血遽然辞世，时仍全力投入其哲学计划。关于其生平，严谨周详、文献足征的叙述见 Mitscherling（1997），以及晚近一部考订用心的详传（Kuliniak and Pandura 2025）[^kuliniak-2025]，后者部分取材于英伽登之孙、建筑师 Krzysztof Ingarden 教授所掌的英伽登家族档案。
