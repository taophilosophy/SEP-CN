      Ingarden takes Husserl to have been driven to transcendental idealism largely by his epistemological goals and transcendental approach to phenomenology. If the very idea of three-dimensional external objects makes sense, it would be essential that our perceptions of them are inevitably inadequate: Such objects may be presented from one point of view or another, but never exhaustively and entirely—so room is always left open for new perceptions that would lead us to entirely revise our past judgments. Such objects thus would inherently transcend any finite set of experiences of them; no external object could be part of any experience of it, and any judgments we attempt to make about them would be open to doubt. Thus, if phenomenology is to be a ‘rigorous science’ grounded only in what does not go beyond our experience, it must limit its study to objects of ‘immanent perception’, the meaningful series of (actual and possible) contents of consciousness rather than any supposedly transcendent objects presented by them. Moreover, as Husserl argues in §41 of the *Cartesian Meditations*, since the transcendental ego is the source of all sense, any meaning of ‘transcendent object’, ‘outside of consciousness’, etc. must be a meaning constructed through layerings of the senses of our conscious acts, and transcendental phenomenology can analyze how these meanings are built up out of other meanings of individual acts of perception and intention (e.g. ‘is perceived from this angle’, ‘could be perceived from another angle, in these other ways’, etc.) This is the meaning that the question e.g. ‘is this object real?’ may have from within the standpoint of transcendental phenomenology. Any attempt to go beyond this understanding of ‘transcendent object’ or ‘real object outside of consciousness’, however, to talk of something beyond what can be constituted by any actual or possible experience, is literally going beyond what can be meaningfully asked; it is literally non-sense. The very idea of a world outside of and independent from all actual and possible experience is thus, from this point of view, an illegitimate concept, a kind of disguised nonsense. The only ‘real world’ of which we can legitimately speak, have knowledge, or enter into other intentional relations with is the ‘real world’ as constituted by, and essentially correlated with, meaningful series’ of intentional acts.
    step1: |-
      英伽登认为，胡塞尔之所以被推向先验唯心论，主要出于其认识论目标与现象学的先验进路。如果三维外部对象这一观念本身是有意义的，那么我们对它们的知觉必然是不充分的，这一点便是本质性的：这类对象可以从某一视角或另一视角被呈现，但永远不能被穷尽无遗地呈现——因此总留有空间，让新的知觉彻底修正我们过去的判断。这类对象因而在本性上超越任何有限的体验集合；没有任何外部对象能成为关于它的体验的一部分，我们对它们作出的一切判断都可能受到怀疑。于是，若现象学要成为一门只以不超出我们经验者为根基的“严格科学”，它就必须把自己的研究限制在“内在知觉”的对象上，即有意义的（实际的与可能的）意识内容序列，而不是这些内容所呈现的任何所谓超越对象。此外，正如胡塞尔在《笛卡尔式的沉思》第 41 节所论：既然先验自我是一切意义的源头，那么“超越对象”“意识之外”等等的任何意义，都必然是通过我们意识行为的诸意义层叠建构出来的意义；先验现象学可以分析这些意义如何由各个知觉与意向行为的意义（如“是从这个角度被知觉到的”“也可以从另一角度、以这些其他方式被知觉”等）层层建构起来。这就是“这个对象是实在的吗？”之类问题在先验现象学立场内部可能具有的意义。然而，任何想要超出这种对“超越对象”或“意识之外的实在对象”的理解、去谈论某种超出任何实际或可能经验所能构成之物者，都是字面上越出了可以被有意义地追问的范围；那是字面上的无意义。因此，从这个观点看，“一个外在于并独立于一切实际与可能经验的世界”这一观念本身就是一个不合法的概念，一种伪装起来的胡说。我们能够合法地谈论、获得知识、或与之建立其他意向关系的唯一“真实世界”，就是那个由有意义的意向行为序列所构成、并在本质上与之相关的“真实世界”。
    step2: |-
      英伽登认为，胡塞尔之转向先验唯心论，主要出于其认识论目标与现象学的先验进路。三维外部对象的观念若要成立，则我们对它的知觉必然不充分，这点属本质。这类对象只能从这个或那个视角被给出，永远不能穷尽——总还留着余地，让新知觉把过去的判断整个推翻。故这类对象在本性上超越任何有限的体验集合；外部对象不可能成为关于它的体验之一部分；我们关于它的一切判断都可生疑。于是，现象学若要成为一门只立足于“不超出经验者”的“严格科学”，就得把研究对象限为“内在知觉”的对象。这类对象就是有意义（实际与可能）的意识内容序列，而非它们所呈现的所谓超越对象。胡塞尔在《笛卡尔式的沉思》第 41 节又论：先验自我是一切意义之源，故“超越对象”“意识之外”等词的一切意义，都必是由我们意识行为的诸层意义叠建而成；先验现象学可以分析这些意义如何由各个知觉与意向行为的意义（如“从这一角度看，它被知觉到”“也可从别的角度、以别的方式知觉到”等等）层层叠起。这就是“这对象是实在的吗？”一类问题在先验现象学立场内所能有的意义。但若有人想越过这一理解，去谈某种超出任何实际或可能经验所能构成的东西，那便是字面上越出了可有意义地追问的界限：字面上的无意义。由此可见，“一个外在于、独立于一切实际与可能经验的世界”这一观念本身即属非法，是一种化装的胡说。我们能够合法谈论、取得知识、或与之建立其他意向关系的唯一“真实世界”，只能是那个由有意义的意向行为序列所构成、并在本质上与之相应的“真实世界”。
