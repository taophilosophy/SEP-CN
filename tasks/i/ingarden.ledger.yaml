    source: |-
      Roman Ingarden (1893–1970) was a Polish phenomenologist, ontologist and aesthetician. A student of Edmund Husserl’s in both Göttingen and Freiburg, Ingarden was a realist phenomenologist who spent much of his career working against what he took to be Husserl’s turn to transcendental idealism. As preparatory work for narrowing down possible solutions to the realism/idealism problem, Ingarden developed ontological studies unmatched in scope and detail, distinguishing different kinds of dependence and different modes of being. He is best known, however, for his work in aesthetics, particularly on the ontology of the work of art and the status of aesthetic values, and is credited with being the founder of phenomenological aesthetics. His work *The Literary Work of Art* has been widely influential in literary theory as well as philosophical aesthetics, and has been crucial to the development of New Criticism and Reader Response Theory.
    step1: |-
      罗曼·英伽登（Roman Ingarden，1893–1970）是波兰现象学家、本体论者与美学家。他先后在哥廷根与弗莱堡师从埃德蒙德·胡塞尔，是一位实在论现象学家，其学术生涯的大部分时间都在反对他眼中的胡塞尔转向先验唯心论。作为缩小实在论／唯心论问题各种可能解答范围的准备工作，英伽登建立了在广度与细致程度上都无与伦比的本体论研究，区分了不同种类的依赖关系与不同的存在方式。然而他最广为人知的是美学方面的著作，尤其是关于艺术作品的本体论与审美价值的地位，他被视为现象学美学的创始人。其《文学的艺术作品》一书在文学理论与哲学美学两方面都影响广泛，对新批评与读者反应理论的发展起了关键作用。
    step2: |-
      罗曼·英伽登（Roman Ingarden，1893–1970）是波兰现象学家、本体论者、美学家。他先后在哥廷根与弗莱堡师从埃德蒙德·胡塞尔，属于实在论现象学家，其学术生涯大半用于反对他所认定的胡塞尔向先验唯心论的转向。为了缩小实在论／唯心论问题可能解答的范围，英伽登先行建立了广度与精细程度都罕有其匹的本体论研究，厘清不同种类的依赖关系与不同的存在方式。不过他最为人知的仍是美学著述，尤其是论艺术作品本体论与审美价值地位的部分，他被公认为现象学美学的奠基人。《文学的艺术作品》在文学理论与哲学美学两方面影响深远，对新批评与读者反应理论的形成至关重要。
