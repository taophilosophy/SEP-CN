      Ingarden was also a significant influence on the life and work of Pope John Paul II (Karol Wojtyła). Ingarden was his teacher at the Jagiellonian University in Krakow, introduced him to work in phenomenology, and the two later collaborated on work in phenomenology (Kuliniak and Pandura 2025, 4)[^kuliniak-2025]. From Ingarden, as well as his study of Max Scheler, Wojtyła took on a realist phenomenological approach that combined “a commitment to the irreducible nature of the human subject with an acknowledgement of objective reality” (Köchler 2008. 175)[^köchler-2008]. Wojtyła also delivered the homily at Ingarden’s funeral in 1970 (Rice 2008, 305)[^rice-2008]. For discussion of Wojtyła’s philosophical work, its relation to phenomenology, and to his leadership as Pope John Paul II, see Köchler (2008).
