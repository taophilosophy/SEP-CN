    source: |-
      Ingarden’s four highest existential-ontological categories or ‘modes of being’ are: Absolute, Real, Ideal, and Purely Intentional. The absolute mode of being could be exhibited only by a being such as God, which could exist even if nothing else whatsoever ever existed. The ideal mode of being is a timeless mode of existence suitable for platonistically conceived numbers; the real mode of being is that of contingent spatio-temporal entities such as the realist assumes ordinary rocks and trees to be; while the purely intentional mode of being is that occupied by fictional characters and other entities which owe their existence and nature to acts of consciousness. Thus in Ingarden’s hands, the realism/idealism controversy is reconfigured as the controversy over whether the so-called ‘real world’ has the real or purely intentional mode of being. (For further discussion of the Purely Intentional mode of being and its role in the theory of perception, see Chrudzimski 2015 and Uemura 2019)[^chrudzimski-2015][^uemura-2019]
    step1: |-
      英伽登四个最高的存在本体论范畴或“存在方式”是：绝对者、实在者、观念者与纯意向者。绝对的存在方式只有上帝这样的存在者才能展示，因为即使其他一切都不存在，它仍能存在。观念的存在方式是一种无时间的存在，适于柏拉图式地设想的数；实在的存在方式属于偶然的时空实体，实在论者以为寻常岩石与树木即是；而纯意向的存在方式则为虚构人物以及其他其存在与本性归功于意识行为的实体所占。这样，在英伽登手中，实在论／唯心论之争就被重新表述为：所谓“真实世界”究竟具有实在的存在方式，还是纯意向的存在方式。（关于纯意向存在方式及其在知觉理论中的作用的进一步讨论，见 Chrudzimski 2015 与 Uemura 2019。）[^chrudzimski-2015][^uemura-2019]
    step2: |-
      英伽登的四个最高存在论范畴，即四种“存在方式”，是：绝对者、实在者、观念者、纯意向者。绝对的存在方式唯上帝这样的存在者可以具备：纵使其他一切皆不存在，它仍能在。观念的存在方式无时间，适于柏拉图式设想的数。实在的存在方式属偶然的时空实体，即实在论者所理解的寻常岩石草木。纯意向的存在方式则为虚构人物等实体所占，它们的存在与本性系于意识行为。于是英伽登把实在论／唯心论之争改写成：所谓“真实世界”究竟具实在的存在方式，还是纯意向的存在方式。（关于纯意向存在方式及其在知觉理论中的角色，另见 Chrudzimski 2015、Uemura 2019。）[^chrudzimski-2015][^uemura-2019]
