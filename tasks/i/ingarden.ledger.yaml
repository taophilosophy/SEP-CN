      In 1928, immediately after writing *The Literary Work of Art*, Ingarden expanded his analyses of the ontology of art from literature, to also discuss music, painting, and architecture in a series of essays originally intended as an appendix to *The Literary Work of Art*. As it happened, however, the appendix was not published along with *The Literary Work of Art*, and remained dormant until after the war, when (in 1946) essays on the picture and the architectural work were published in Polish. The three studies were expanded and finally published in German in 1961, along with an article on film, and were not translated into English until 1989. The late date of their release and the fact that they remain little known is a great shame, as they address many of the same ontological issues as those debated in ‘analytic’ aesthetics, and provide not only compelling arguments against many popular positions but also analyses of the ontological structure of works of various kinds, which are unsurpassed in subtlety and detail.
