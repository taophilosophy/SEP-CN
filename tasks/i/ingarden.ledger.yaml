      1. 语词声音与更高阶的语音构成（包括各类短语、句子、段落所特有的节奏与旋律）
      2. 意义单元（由语言中所用的声音与观念概念结合而成；从单词的个别意义，直到短语、句子、段落等更高阶的意义）
      3. 图式化外观（即作品中再现的人物与场所可借以被“准感官地”把握的那些视觉的、听觉的或其他“外观”）
      4. 再现的客体（文学作品中再现的对象、事件、事态等，构成其人物、情节等）。
