      Ingarden accepted that, as long as we approach the realism problem from the standpoint of epistemology, or from within the standpoint of transcendental phenomenology, there is no way out to establish the existence and knowledge of a mind-independent world. Nor, however, can one establish that the real world depends on consciousness, since any attempted talk about the world in-itself and its nature would be meaningless—thus from that standpoint, the controversy over the existence of the world would have to remain undecided. But he also thought that other approaches to philosophy were legitimate, and indeed that one should begin from ontology rather than epistemology (Corbella 2023. 69)[^corbella-2023].
    step1: |-
      英伽登承认：只要我们以认识论的立场、或从先验现象学的立场内部来处理实在论问题，就没有出路可以确立一个心灵独立世界的存在与关于它的知识。然而，人们也无法确立真实世界依赖于意识，因为任何试图谈论世界本身及其本性的做法都会是无意义的——因此从该立场看，关于世界存在性的争论只能悬而未决。但他也认为，哲学的其他进路是正当的，而且人应当从本体论而非认识论出发（Corbella 2023. 69）[^corbella-2023]。
    step2: |-
      英伽登承认：只要从认识论立场、或从先验现象学立场内部处理实在论问题，便无出路可确立一个心灵独立世界的存在与关于它的知识；但同样也无法确立真实世界依赖于意识，因为任何谈论世界本身及其本性的尝试都会沦为无意义——故从该立场看，世界存在之争只能悬而不决。不过他坚持哲学还有其他正当进路，而且应当从本体论而非认识论起步（Corbella 2023. 69）[^corbella-2023]。
