      英伽登最著名、也最有影响的著作——尤其在英语世界——无疑是《文学的艺术作品》。该书约写于 1926 年，1931 年首次以德文出版。它在根本上是英伽登意义上的本体论著作（见上文第 2 节），阐明任何东西要被算作文学作品必须具备的本质特征、它必须具备哪些部分以及这些部分如何相互关联，还阐明文学作品这样的实体如何与作者、文本副本、读者以及观念意义等其他种类的实体相关联。
