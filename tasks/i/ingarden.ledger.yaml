      英伽登最负盛名、影响最大的著作——在英语世界尤其如此——当推《文学的艺术作品》。书约成于 1926 年，1931 年以德文初版。它骨子里是一部英伽登意义上的本体论著作（见上文第 2 节）：摆出任何东西要被算作文学作品所需具备的本质特征、必须具备的各个部分及其相互关系，也摆出文学作品这类实体与作者、文本副本、读者、观念意义等实体的关系。
