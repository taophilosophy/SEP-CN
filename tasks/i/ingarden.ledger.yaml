    kind: body
    source: |-
      Like many of Husserl’s students from the Göttingen period, Ingarden is a realist phenomenologist who ardently resisted Husserl’s apparent turn to transcendental idealism in the *Ideas* and thereafter. Although his training is phenomenological, his work on the whole is directed not towards understanding the basic structures of consciousness, but rather towards ontology. Indeed, Ingarden is one of the foremost practitioners of phenomenological ontology, which attempts to determine what the ontological structure and status of objects of various types must be, based on examining essential features of any experience that could present or provide knowledge of such objects—a method based in the assumption that there are essential correlations between kinds of objects and the modes of cognition by means of which they can be known.
    step1: |-
      与胡塞尔哥廷根时期的许多学生一样，英伽登是一位实在论现象学家，激烈抗拒胡塞尔在《观念》及其后著作中显然转向先验唯心论的倾向。他虽受现象学训练，其工作整体上却并非指向理解意识的基本结构，而是指向本体论。事实上，英伽登是现象学本体论最重要的实践者之一。这一进路试图依据任何能够呈现某类对象、或提供关于它们之知识的体验的本质特征，来判定各类对象的本体论结构与地位——其方法立足于这样一个假定：对象的种类与认知方式之间存在本质性的相关。
    step2: |-
      和胡塞尔哥廷根时期的许多学生一样，英伽登是实在论现象学家，对胡塞尔在《观念》及以后著作中显然转向先验唯心论一事抗拒甚力。他虽出身现象学，工作整体上却不指向意识的基本结构，而指向本体论。实际上，他是现象学本体论最重要的实践者之一。这一路子要问：任何能够呈现某类对象、或提供关于它们之知识的体验，其本质特征是什么？据此判定各类对象的本体论结构与地位。其方法预设了一点：对象的种类与认知方式之间有本质性的相应。
  - id: 6
    kind: body
    source: |-
      Ingarden’s best-known works, indeed the only ones known to most of his readers in the English-speaking world, are his works on aesthetics, especially literature—works that offer unrivalledly sophisticated and subtle accounts both of the ontological status of works of art of various kinds, and of our means of cognizing them. Nonetheless, the frequently exclusive focus on Ingarden’s work in aesthetics can be misleading about his overall philosophical focus and goals. For Ingarden produced an enormous body of work on a wide variety of topics. He raised early and important criticisms of what he called “methodological Positivism” in a paper delivered in 1934 to the 8th World Congress of Philosophy in Prague, where Rudolf Carnap and Otto Neurath were present as respondents. There Ingarden argues that, by the positivist’s own lights, ‘metalogical’ sentences about sentences should be counted as meaningless, since sentences themselves are not mere physical objects (to be sentences they must have a certain *sense*), and yet the methodological Positivist accepts only sentences about the physical as intersubjectively verifiable. If on the other hand, we do consider sentences to be mere physical ‘mounds of ink’ or ‘sound waves’, then they would not be verifiable (this, he seems to be suggesting, would be something like a category mistake: how can one verify a heap of ink?). Moreover, he argues (in what Pelletier and Linsky (2018) identify as a version of the ‘Hysteron Proteron Objection’) that in order to decide whether a sentence is verifiable, one must first identify its meaning “independently of its verification”. The paper is now translated into English as “A Logical Attempt at a New Formulation of Philosophy: A Critical Remark”, and reprinted alongside the brief responses by Rudolf Carnap and Otto Neurath, and interesting contemporary discussion and evaluation by Pelletier and Linsky (2018), who suggest that Carnap never adequately responded to these criticisms.
    step1: |-
      英伽登最著名的著作——实际上也是英语世界多数读者唯一知道的著作——是他在美学、尤其是文学方面的研究；这些著作对各类艺术作品的本体论地位以及我们认知它们的方式，提供了无与伦比的精密而微妙的说明。然而，人们常常只盯着英伽登的美学著作，这会造成对其整体哲学关切与目标的误解。因为英伽登在众多题目上留下了卷帙浩繁的作品。他很早就提出了重要批评，针对他所谓“方法论实证主义”：1934 年他在布拉格第八届世界哲学大会上宣读论文，鲁道夫·卡尔纳普与奥托·纽拉特在场作回应人。英伽登在那里论证：按实证主义者自己的标准，关于语句的“元逻辑”语句应算作无意义，因为语句本身并非单纯的物理对象（要成为语句，须有某种*意义*），而方法论实证主义者只承认关于物理之物的语句才是可主体间验证的。反过来说，若真把语句当作单纯的物理“墨迹堆”或“声波”，它们便无从验证（他似乎是在提示，这近乎一种范畴错误：一堆墨迹怎么验证？）。此外他还论证（Pelletier and Linsky（2018）称之为“后项先行反驳”的一个版本）：要判定一个语句是否可验证，必须先“独立于其验证”辨明其意义。该文现有英译，题为《从逻辑上尝试哲学的新表述：一则批评性评论》，与鲁道夫·卡尔纳普、奥托·纽拉特的简短回应，以及 Pelletier and Linsky（2018）颇有兴味的当代讨论与评价一并重印；后者认为卡尔纳普从未对这些批评作出恰当回应。
    step2: |-
      英伽登最出名、也是英语世界多数读者唯一知道的，是他论美学、尤其是论文学的著作：这些书对各类艺术作品的本体论地位、以及我们认知它们的方式，给出了罕有其匹的精细说明。然而只把目光锁在他的美学上，会误判其整体关切与志向。英伽登的著述横跨极广，数量惊人。他很早就对他所谓的“方法论实证主义”提出了重要批评：1934 年他在布拉格第八届世界哲学大会宣读论文，鲁道夫·卡尔纳普与奥托·纽拉特当场回应。他指出，按实证主义者自家的标准，谈论语句的“元逻辑”语句便该算无意义——语句本身不是单纯的物理对象（要成其为语句，总得有某种*意义*），而方法论实证主义者只认关于物理之物的语句可作主体间验证。可是若真把语句当作一堆物理“墨迹”或“声波”，它又无从验证（他似乎在暗示这近乎范畴错误：一堆墨迹如何验证？）。他还论证（Pelletier and Linsky（2018）称之为“后件先出反驳”的变体）：判断一个语句可否验证，先得“撇开验证”辨明其意义。该文已有英译，题为《对哲学新表述的一次逻辑尝试：一则批评性评论》，与卡尔纳普、纽拉特的简短答复，以及 Pelletier and Linsky（2018）的讨论一并重印；后者认为卡尔纳普始终没有正面回应这些批评。
