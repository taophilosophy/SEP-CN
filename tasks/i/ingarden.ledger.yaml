    source: |-
      Ingarden also produced a large body of work in epistemology, ontology, metaphysics, phenomenology, and value theory. The relative obscurity of Ingarden’s work in these other areas is attributable in part to the relative isolation and interruption of academic philosophy in Poland in the period of World War Two and Soviet occupation, and in part to language barriers. Before the second world war, Ingarden (being German trained) published his works mainly in German, thus his early works such as *The Literary Work of Art* appeared in German early in his career, and were to have a broad impact. But during the war, Ingarden (in a gesture of solidarity) switched to writing in Polish, a language speakers of English and other Western European languages were unlikely to read, and so his major works on ontology went largely unnoticed by the wider European and Anglo-American philosophical circles. His major work in ontology, *The Controversy over the Existence of the World*, for example, was not translated into German until 1964, and only in 2013 did Part 1 become fully available in English translation (an earlier partial translation was published in 1964 as *Time and Modes of Being*).
