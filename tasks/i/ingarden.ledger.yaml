      Seen more as a whole, Ingarden’s body of work revolves not around aesthetics, but rather around the realism/idealism problem—an issue that was to dominate his thinking ever since, as a young man, he recoiled against Husserl’s transcendental idealism. As I will discuss in §3.1 below, Ingarden’s work in aesthetics was actually motivated by his interest in the realism/idealism problem. His studies in fiction and the ontology of art were intended to form part of a large-scale argument against transcendental idealism, based in emphasizing the difference between ‘real’ entities entirely independent of our minds, and social and cultural entities that (as ‘purely intentional objects’) owe their existence, at least in part, to human consciousness—thus showing that, in virtue of the very meanings of the ideas involved, the ‘real world’ as a whole cannot be properly treated as a purely intentional object that owes its existence to consciousness.
    step1: |-
      若从整体看，英伽登的全部工作并非围绕美学，而是围绕实在论／唯心论问题——这个问题自他年轻时起便支配着他的思考，因为他反感胡塞尔的先验唯心论。正如我将在下文第 3.1 节讨论的，英伽登的美学工作实际上是由他对实在论／唯心论问题的兴趣所驱动的。他对虚构与艺术本体论的研究，本想构成一场反对先验唯心论的大规模论证的一部分；该论证立足于强调“实在”实体（完全独立于我们心灵）与社会的、文化的实体之间的差别：后者作为“纯意向对象”，其存在至少部分归功于人类意识。这样便可表明：仅凭相关观念的意义，就不能把整个“真实世界”恰当地当作一个其存在归功于意识的纯意向对象。
