      The modes of being are defined in terms of different characteristic combinations of ‘existential moments’. The existential moments mostly concern either an object’s temporal determinations (or lack thereof), or the different dependencies it bears (or does not bear) to other sorts of object. He uses these existential moments in distinguishing different categories of object, in a multi-dimensional system. For a detailed presentation and critical discussion of Ingarden’s existential moments and their relation to Ingarden’s clasificatory system, see Simons (2023).
    step1: |-
      存在方式是通过“存在环节”的不同特征组合来定义的。这些存在环节大多涉及对象的时间规定（或其缺失），或涉及它与其他种类对象之间所承担（或不承担）的不同依赖关系。英伽登正是用这些存在环节，在一个多维体系中区分不同类别的对象。关于英伽登诸存在环节及其与英氏分类系统之关系的详细呈现与批判性讨论，见 Simons（2023）。
    step2: |-
      存在方式由“存在环节”的不同特征组合来定义。这些环节多关乎对象的时间规定（或全无规定），或关乎它与其他种类对象所负（或不负）的种种依赖关系。英伽登即以这些环节，在多维体系中划分对象类别。关于诸存在环节及其与英氏分类系统之关系的详细呈现与批判性讨论，见 Simons（2023）。
