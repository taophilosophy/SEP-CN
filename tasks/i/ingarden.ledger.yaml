      As with so much of Ingarden’s philosophical work, he undertakes this study of the ontology of the literary work in part with the motive of using its results to argue against transcendental idealism—indeed he conceived of *The Literary Work of Art* as a preliminary study for *The Controversy*. Literary works and the characters and objects represented in them were to provide examples of purely intentional objects—objects owing their existence and essence to consciousness. Thus a detailed study of works of literature and their represented objects could serve to explicate the purely intentional mode of being, with a view to contrasting this with the real mode of being and ultimately demonstrating that it is impossible to reduce the ‘real world’ to the status of a purely intentional creation. (*Streit*, vii–viii). Nonetheless, this motive remains largely behind the scenes of the detailed studies of language and literature in *The Literary Work of Art*, which can be (and largely has been) described and evaluated without reference to these broader motives, as an independent contribution to aesthetics and literary theory.
    step1: |-
      与英伽登许多哲学工作一样，他从事这项文学作品本体论研究，部分动机是要用其结果来反驳先验唯心论——事实上他把《文学的艺术作品》设想为《争论》的预备性研究。文学作品以及其中所再现的人物与对象，本应提供纯意向对象的实例——其存在与本质归功于意识的对象。于是，对文学作品及其再现对象的细致研究，可以阐明纯意向的存在方式，以便与实在的存在方式相对照，并最终表明：不可能把“真实世界”贬为一种纯意向的创造物。（*Streit*, vii–viii）然而，这一动机在《文学的艺术作品》中对语言与文学的具体研究中大体隐于幕后；这些研究可以（而且大体已经）在不涉及上述更宽动机的情况下被描述与评价，作为对美学与文学理论的独立贡献。
