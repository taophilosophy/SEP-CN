      和英伽登的许多哲学工作一样，他做这项文学作品本体论研究，部分是为了以其结论反驳先验唯心论：他实际上把《文学的艺术作品》当作《争论》的预备研究。文学作品及其所再现的人物与对象，本该充当纯意向对象的实例——其存在与本质系于意识。如此，对文学作品及其再现对象的细致研究，就能阐明纯意向的存在方式，以与实在的存在方式对照，最终表明“真实世界”不可能被贬为纯意向的造物。（*Streit*, vii–viii）不过这一动机在书中的语言与文学研究里大体隐于幕后；那些研究可以（事实上也大体已经）撇开这层更宏阔的动机来评述，作为对美学与文学理论的独立贡献。
