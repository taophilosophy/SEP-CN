      In investigating the existential moments that characterize a temporal mode of being, Ingarden makes original contributions to work in the ontology and phenomenology of time, arguing that the past and future exist, but in a different mode of being than the present (for more on Ingarden’s contribution to these debates see Kobiela 2019)[^kobiela-2019]. In drawing out the different dependencies that an entity can bear on another, Ingarden goes beyond Husserl’s influential work on dependence to distinguish four different existential moments of dependence (and their contrasting moments of independence): Contingency (the dependence of a separate entity on another in order to *remain in* existence); Derivation (the dependence of an entity on another in order to *come into* existence); Inseparateness (the dependence of an entity that can only exist if it coexists with something else *in a single whole*); and Heteronomy (the dependence of an entity for its existence *and entire qualitative endowment* on another). In so doing, Ingarden develops one of the richest and most detailed analyses of dependence ever offered, providing distinctions in the notion of dependence that can clarify many philosophical problems including but certainly not limited to the realism/idealism problem. For further discussion of Ingarden’s theory of dependence, see DeRizzo (2021).
    step1: |-
      在考察刻画某种时间性存在方式的存在环节时，英伽登对时间本体论与时间现象学作出了原创贡献：他主张过去与未来都存在，但其所具有的存在方式不同于现在（关于英伽登在这些争论中的贡献，另见 Kobiela 2019）[^kobiela-2019]。在抽绎一个实体可能对另一实体承担的种种依赖时，英伽登超出了胡塞尔关于依赖的有影响的工作，区分出四种不同的依赖存在环节（及其对应的独立环节）：偶存性（一个分离实体为*继续*存在而依赖另一实体的那种依赖）；派生性（一个实体为*开始*存在而依赖另一实体的那种依赖）；不可分离性（一个实体只有在与某物*共处于一个整体之中*才能存在的那种依赖）；以及他律性（一个实体在其存在*与全部性质禀赋*上依赖另一实体的那种依赖）。英伽登由此发展出有史以来最丰富、最细致的依赖分析之一，为依赖概念提供了诸多区分，足以澄清许多哲学问题——当然不限于实在论／唯心论问题。关于英伽登依赖理论的进一步讨论，见 DeRizzo（2021）。
    step2: |-
      考察刻画某一时间性存在方式的存在环节时，英伽登于时间本体论与时间现象学皆有创获：他主张过去与未来同样存在，只是存在方式不同于现在（关于他在这些争论中的贡献，另见 Kobiela 2019）[^kobiela-2019]。而在抽绎一实体可能对另一实体所负的种种依赖时，他越出胡塞尔论依赖的名作，厘出四种依赖存在环节（及其相反的独立环节）：偶存性（分离实体为*继续*存在而依赖他者的那种依赖）；派生性（实体为*开始*存在而依赖他者的依赖）；不可分离性（实体唯有与某物*共处一整体*方能存在的依赖）；他律性（实体在其存在*与全部性质禀赋*上依赖他者的依赖）。英伽登因此给出了有史以来最丰富、最细密的依赖分析之一，其区分足以澄清许多哲学难题，而不限于实在论／唯心论之争。关于其依赖理论的进一步讨论，见 DeRizzo（2021）。
