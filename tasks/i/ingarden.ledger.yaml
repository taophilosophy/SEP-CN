      英伽登还在《音乐作品及其同一性问题》中考察我们对音乐的体验，并在《审美经验与审美对象》中考察更一般意义上的审美经验（包括对雕塑的体验）。在每一情形中，他不仅细致分析相关审美经验的发展（包括其随时间而展开的过程），还把这类审美经验与在他所谓“实践”态度或“探究”态度中进行的日常感官知觉相对照（1961, 295）。关于英伽登审美态度工作的概览及其与 Bence Nanay 近期工作的比较，见 Mäcklin（2023）。
