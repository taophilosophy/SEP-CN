      Philosophers of action usually understand autonomy as governance over one’s own agency—acting according to a law that one sets for oneself. Likewise, for bioethicists Beauchamp and Childress, “The autonomous individual acts freely in accordance with a self-chosen plan, analogous to the way an independent government manages its territories and establishes its policies” (Beauchamp and Childress 2008, 99–100)[^beauchamp-2008]. As the authors emphasize (Beauchamp and Childress 2008, 100–1)[^beauchamp-2008], autonomy so understood differs from autonomy as having the will that one wants to have (Frankfurt 1988)[^frankfurt-1988]. It also differs from many other uses of “autonomy” in bioethics and biolaw (Dworkin 1988, 101ff.)[^dworkin-1988]—so many as to prompt some to question the force of autonomy-based justifications (O’Neill 2003)[^o’neill-2003]. However, initially, autonomy seems like a promising ground for informed consent requirements. The rationale for not transfusing a protesting, decisionally-capacitated Jehovah’s Witness even when forced transfusion would save the witness’s life or limb is clearly not protection of her health. Instead, it may seem to do with maintaining her self-rule on such momentous issues: a matter of respect for an autonomous decision maker’s refusal. And sufficiently informed consent usually assumes freedom from controlling interference and from an inadequate understanding of the basic risks of the intervention, additional components of fully autonomous choice as well (Beauchamp and Childress 2008, 100–1)[^beauchamp-2008].
    step1: |-
      行动哲学家通常把自主性理解为对自身能动性的治理——按照自己为自己设定的法则行动。同样，生命伦理学家 Beauchamp 与 Childress 说：“自主的个体按照自选计划自由行动，类似于独立政府管理其领土并确立其政策的方式”（Beauchamp and Childress 2008, 99–100）[^beauchamp-2008]。正如作者所强调（Beauchamp and Childress 2008, 100–1）[^beauchamp-2008]，如此理解的自主性不同于“拥有自己想要的意志”意义上的自主性（Frankfurt 1988）[^frankfurt-1988]。它也不同于生命伦理学与生命法中对“自主性”的许多其他用法（Dworkin 1988, 101ff.）[^dworkin-1988]——用法之多，以致有人质疑以自主性为据的正当化有多大效力（O’Neill 2003）[^o’neill-2003]。然而，起初自主性似乎是知情同意要求一个有希望的基础。对于一位抗议的、有决定能力的耶和华见证人，即便强制输血能挽救其生命或肢体，不予输血的理据显然不是保护其健康。相反，它似乎关乎在此类重大问题上维持其自我治理：尊重自主决定者的拒绝。而充分知情的同意通常还预设免于控制性干涉，以及对干预基本风险缺乏充分理解这两点，它们也是完全自主选择的附加要素（Beauchamp and Childress 2008, 100–1）[^beauchamp-2008]。
