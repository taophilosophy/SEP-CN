      In recent years, a number of philosophers have argued that “Informed consent… is generally important [in part] because it can make a distinctive contribution to the restoration of trust” (O’Neill 2002, 145; see also Bok 1999, 11, 26–7, 63; Jackson 1994, 491; Kass et al 1996; Tännsjö 1999, 24)[^bok-1999][^jackson-1994][^kass-1996][^o’neill-2002][^tännsjö-1999]. Their trust rationale is future-looking. It points out the importance of ongoing societal trust in caretakers and medical institutions, for example, as a precondition of ongoing compliance with medical advice, registration for organ donor cards, and participation in medical research. Since violations of informed consent would jeopardize that trust, they are something to be avoided. This rationale has the advantage of potentially demanding informed consent even to certain low-risk and low-impact interventions. For example, forced testicular exam may be medically “safe”, but, if discovered, could profoundly shake public trust in providers. The rationale also addresses the special wrongness of outright lying to patients (perhaps worse than non-lying deceit: Jackson 1991, 7–9)[^jackson-1991]), say, in order to realize beneficial placebo effects. If discovered, lying and battery could easily puncture public trust in physicians.
    step1: |-
      近年来，不少哲学家主张，“知情同意……通常重要［部分］因为它能对恢复信任作出独特贡献”（O’Neill 2002, 145; 亦见 Bok 1999, 11, 26–7, 63; Jackson 1994, 491; Kass et al 1996; Tännsjö 1999, 24）[^bok-1999][^jackson-1994][^kass-1996][^o’neill-2002][^tännsjö-1999]。他们的信任理据是前瞻性的。它指出，社会对看护者与医疗机构的持续信任十分重要，例如作为持续遵从医嘱、登记器官捐献卡以及参与医学研究的前提。既然违反知情同意会危及这种信任，它们就是应当避免的事。这一理据的优点在于，它有可能要求即便是某些低风险、低影响的干预也须获得知情同意。例如，强制睾丸检查在医学上可能“安全”，但一旦被发现，可能深深动摇公众对医疗服务提供者的信任。该理据也说明了对病人公然撒谎的特殊错误（也许比不撒谎的欺骗更糟：Jackson 1991, 7–9）[^jackson-1991]，譬如为了取得有益的安慰剂效应。一旦被发现，撒谎与人身侵害很容易刺穿公众对医生的信任。
