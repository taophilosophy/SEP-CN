      The trust rationale is most plausible as a partial rationale. It faces serious objections if it is taken as a comprehensive justification of informed consent (Eyal 2014)[^eyal-2014]. For one thing, being forward-looking, this rationale is vulnerable to the objection that, intuitively, informed consent can remain necessary even when the public could never find out that a core violation of the requirement took place. While the requirement of informed consent might not obtain across the board, it seems inappropriate to determine whether it obtains in a given context based on e.g. how chemically traceable is the medication whose forced administration is being considered, although that would affect how much this act would jeopardize future public trust in physicians. Another challenge to this version of the trust rationale is that invasive interventions without a person’s informed consent are usually thought to wrong that person, not to wrong only the potential future victims of a decline in public trust.
    step1: |-
      信任理据作为部分理据最为可信。若把它当作知情同意的全面正当化，就会遭遇严重反对（Eyal 2014）[^eyal-2014]。其一，由于是前瞻性的，这一理据易受如下反驳：直觉上，即便公众永远不可能发现某项违反核心要求的行为发生过，知情同意仍可能必要。虽然知情同意要求未必普遍成立，但依据诸如“正在考虑强制给药的药物在化学上有多容易被追踪”来判断它在特定情境中是否成立，似乎并不恰当——尽管那会影响该行为在多大程度上危及未来公众对医生的信任。对这一版本信任理据的另一项挑战是：未经某人知情同意的侵入性干预，通常被认为错待了那个人，而不只是错待了未来可能因公众信任下降而受害的人。
