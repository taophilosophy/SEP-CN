      This version of the autonomy rationale is criticizable as well. Kant associated respect for persons with treating them only in ways that they could possibly or rationally consent to, not with treating them in ways that they have actually consented to—rationally, voluntarily, or otherwise (Wertheimer 2014, 149)[^wertheimer-2014]. The notion of autonomy as bioethicists understand it hardly resembles Kant’s notion of autonomy (O’Neill 2003)[^o’neill-2003]. And while some contemporary Kantians interpret autonomy as “our authority to determine our own actions” (Buss 2018)[^buss-2018], many gross violations of informed consent do not directly transgress that alleged authority. A surgeon who exploits a patient’s surgical anesthesia to force an experimental intervention grossly violates informed consent by affecting heavily the incognizant patient’s body and life, but less directly if at all by thwarting the patient’s determination of what actions to perform. During the violation, the anesthetized patient was not performing any action. Likewise, informed consent finds some interventions far more reprehensible than others, although their impacts on our autonomous action and pursuits are similar. Performing a testicular cancer exam without the patient’s informed consent is a serious transgression, and transgresses core informed consent requirements. It is far harder to justify than looking carefully at a skin mole on a patient’s cheek from across a clinic desk, in order to detect cancer, without the patient’s informed consent. Non-consensual facial scrutiny might not even violate informed consent. The main difference seems to be in whether a sensitive area of the patient’s body is being touched and scrutinized without the patient’s consent, which can constitute extreme battery; and not in the patient’s exercise of agency, say, in the number or nature of the patient’s actions and plans that are thereby blocked. It may be true that extreme battery symbolizes extreme contempt towards the patient as a sovereign agent, but here, at least, it does not involve greater interference with his autonomy as characterized above (compare Mazor 2019)[^mazor-2019].
    step1: |-
      自主性理据的这一版本同样可受批评。康德把尊重人同“只以他们可能或理性上会同意的那些方式对待他们”相联系，而不是同“以他们实际上已经同意的方式对待他们”相联系——无论这种同意是理性的、自愿的还是别的（Wertheimer 2014, 149）[^wertheimer-2014]。生命伦理学家所理解的自主性概念，几乎不像康德的自主性概念（O’Neill 2003）[^o’neill-2003]。而且，尽管一些当代康德主义者把自主性解释为“我们决定自身行动的权威”（Buss 2018）[^buss-2018]，许多对知情同意的严重违反并未直接侵犯那种所谓的权威。一位外科医生利用病人的手术麻醉强行实施实验性干预，严重影响这位不知情病人的身体与生命，从而严重违反知情同意；但若说它阻挠了病人决定自己施行何种行动，则至多是间接的。在侵害期间，被麻醉的病人并未施行任何行动。同样，知情同意认为某些干预远比另一些可谴责，尽管它们对我们自主行动与追求的影响相似。未经病人知情同意而做睾丸癌检查是严重侵害，且侵犯知情同意的核心要求。相比之下，为发现癌症而隔着诊桌仔细查看病人脸颊上的痣——未经病人知情同意——则远难证明为不当。未经同意的面部查看甚至可能不算违反知情同意。主要差别似乎在于：是否未经病人同意而触碰并查看病人身体的敏感区域，这可构成严重的人身侵害；而不在于病人能动性的行使，譬如说，病人被阻却的行动与计划的数量或性质。严重的人身侵害或许象征对作为主权行动者的病人的极端蔑视，但至少在此处，它并不涉及对上述意义上的自主性更大的干涉（参 Mazor 2019）[^mazor-2019]。
