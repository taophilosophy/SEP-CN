      As a final challenge to grounding informed consent in autonomy, consider a patient who has been treated fairly and offered a simple explanation of her treatment and the alternatives, which she could comprehend if she tried; her failure to comprehend it and to choose autonomously is the fruit of her own neglect. Can the physician or the investigator really be blamed for the patient’s consequent non-autonomous choice (Sreenivasan 2003; Miller and Wertheimer 2010, 85, 95; Millum and Bromwich 2013)[^miller-2010][^miller-2010-2][^millum-2013][^sreenivasan-2003][^wertheimer-2010]? In many areas of life in which consent seems necessary, what matters is not so much the “quality of choice,” say, how autonomous it is, but whether the person had been given the opportunity to make a choice of that quality (Scanlon 1988)[^scanlon-1988]. Advocates of the autonomy rationale may respond in one of two ways. First, they may insist that when an investigator did due diligence to help candidate participants understand the significant risks of a study yet sees that they have not been understood, she has a reason to explain again, or recruit other candidates, precisely because the autonomy of study participation matters; alternatively, they may insist that having been given real opportunity to decide autonomously already counts as having been given autonomy over the matter.
    step1: |-
      作为把知情同意奠基于自主性的最后一项挑战，考虑一位病人：她受到公平对待，并获得关于其治疗及替代方案的简单说明，只要她努力便能理解；她未能理解并自主选择，是她自己疏忽的果实。医生或研究者真能因病人随之而来的非自主选择而受责备吗（Sreenivasan 2003; Miller and Wertheimer 2010, 85, 95; Millum and Bromwich 2013）[^miller-2010][^miller-2010-2][^millum-2013][^sreenivasan-2003][^wertheimer-2010]？在生活许多看似需要同意的领域，重要的与其说是“选择的质量”，譬如它有多自主，不如说是此人是否获得了作出那种质量选择的机会（Scanlon 1988）[^scanlon-1988]。自主性理据的倡导者可作两种回应之一。第一，他们可以坚持：当研究者已尽力帮助候选参与者理解研究的重大风险，却发现他们仍未理解时，她有理由再次解释，或招募其他候选人，恰恰因为参与研究的自主性很重要；或者，他们可以坚持：已获得真正自主决定的机会，就已算在该事务上获得了自主性。
