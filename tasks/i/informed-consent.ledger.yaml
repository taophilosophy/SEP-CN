      This opposition seems to interpret “presumed consent” ascriptions as meaning: *Presumably, the patient has given actual (albeit tacit) consent*. The opponents seem right on point: it goes too far to assume that, just because a patient fails to carry in her pocket a directive forbidding care or organ harvesting in the event of an emergency or death, she is consenting. However, on a different interpretation, presumed consent ascriptions mean: *Presumably, the patient would have consented to the intervention if, under the current circumstances, she were decisionally-capacitated*. A possible ground for such counterfactual ascriptions (often referred to as “hypothetical consent”) is that there is no special information that indicates that the patient would not consent, and most people would consent. This interpretation seems to sidestep the difficulty.
    step1: |-
      这种反对似乎把“推定同意”的归属理解为：*大概，病人已给出实际的（尽管默示的）同意*。反对者在这点上似乎是对的：仅因病人未在口袋中携带一份禁止在紧急情况或死亡时施予照护或采集器官的指示，就假定她同意，走得太远。然而，按另一种解释，“推定同意”的归属意味着：*假如在当前情形下有决定能力，病人本会同意该干预*。此类反事实归属（常被称为“假设同意”）的一个可能依据是：没有特别信息表明病人不会同意，而多数人都会同意。这一解释似乎绕开了困难。
