      Another challenge for the abuse-prevention rationale is that it is difficult to anchor in the deontological morality that is typically invoked to motivate it. It is challenging for agent relative and moment relative deontological morality, which focuses on the agent’s contemporaneous action type and not on minimizing certain actions in the world to provide strong reasons to prevent future deontological offenses by others. For that reason, a truly deontological abuse-prevention rationale might not recognize strong reasons to enforce informed consent requirements on others (Eyal 2022, II.2)[^eyal-2022]. Nevertheless, some informed consent rights are surely legally enforceable by third parties. Such a rationale might also not recognize strong reasons against coercive medical intervention when the coercion is performed by third parties only; for example, against extracting a live kidney from a consenting patient who consents only due to her family’s coercion. But reasons against relying on such coerced consent are widely recognized.
    step1: |-
      防止滥用理据的另一项挑战是：它难以锚定在通常被用来推动它的道义论道德之中。行动者相对与时刻相对的道义论道德聚焦于行动者当下的行动类型，而不聚焦于尽量少让世界中出现某些行动，因而难以为他人提供强有力的理由去防止未来的道义论过犯。因此，一个真正道义论的防止滥用理据或许不会承认有强理由把知情同意要求强加于他人（Eyal 2022, II.2）[^eyal-2022]。然而，某些知情同意权利无疑可由第三方在法律上强制执行。这种理据或许也不会承认有强理由反对强制医疗干预——当强制仅由第三方施行时；例如，反对从一位仅因家人胁迫才同意的病人身上摘取活体肾脏。但反对依赖此种被胁迫同意的理由却广受承认。
