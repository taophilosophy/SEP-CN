      ## 8. The status of informed consent
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      When informed consent is required, what kind of requirement does it represent? In particular, does it correlate to a natural right, to a legal right, or to something else?
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Bioethicists and human rights lawyers tend to assume that informed consent is a natural right that generates a correlative objective moral duty and, downstream, legal and institutional duties. Many contemporary philosophers assume that consent has moral “magic” that turns what would have been a wrongful action into a right one, in an objective, moral sense (Hurd 1996)[^hurd-1996]. But some of the aforementioned justifications for informed consent better support other assumptions.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      For example, the forward-looking trust rationale mentioned earlier can be understood to mean that, morally, we should enshrine and then honor legal (and cultural) informed consent requirements to protect trust in medical practitioners. On that view, violating informed consent requirements toward a patient does not necessarily violate that patient’s natural moral rights, only what *are* and morally *should* remain everyone’s legally protected interests.
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      In a further model, the uniform requirement of informed consent across circumstances reflects our sheer epistemological problem telling in advance the typical circumstances when it objectively applies from relative exceptions on which it does not (Wertheimer 2014, about the requirement in intervention research; see also Alexander 2014)[^alexander-2014][^wertheimer-2014]. In a still further model, the informed consent requirement only appears to apply homogeneously across circumstances in the eyes of agents who have cultivated, as morally they should, a fruitful yet false belief in the requirement’s objectively homogeneous application (Eyal 2015)[^eyal-2015]. In a final model, the justified legal standing of informed consent bolsters its moral standing (Miller and Wertheimer 2010, 82–3)[^miller-2010][^miller-2010-2][^wertheimer-2010].
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      One reason to take non-naturalistic approaches to the status of informed consent seriously is that not all natural rights are legally enforceable. Therefore, a moral informed consent right that is legally enforceable (as that right is usually taken to be in at least some institutional settings) may stand in need of additional moral justification, even if a natural right has been established. That additional, inescapable moral justification may then turn out to justify informed consent regulations even absent natural informed consent rights, say as trust-building measures. In particular, recall that many bioethicists ground informed consent in duties to treat rational, autonomous persons respectfully. Some such duties are clearly non-enforceable. For example, the moral duty not to lie to friends, disrespectfully and in breach of their autonomous decision-making, is seldom legitimately enforceable. Thus, additional justification would be needed, beyond simple appeal to respect for autonomy, in order to establish an enforceable informed consent requirement. That inescapable additional moral justification may then turn out, if successful, to justify informed consent regulations and the surrounding ethos on its own. It may do so even if the project of grounding informed consent in autonomy, and all other attempts to justify natural informed consent rights, founder.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      ## 9. Consent in other domains
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      For decades, bioethicists have discussed medical informed consent in relative isolation from consent in political philosophy, contract theory, and sexual ethics, where notions of consent are also pivotal. This is finally changing, and it raises new technical and philosophical questions about how to put these different discourses in dialogue with each other. For instance, is what bioethicists call “presumed consent” the same thing as what political philosophers call “hypothetical consent”? Is what bioethicists call “proxy consent” one with what lawyers call “impersonal consent”? What bioethicists dub “invalid consent” would often be described by contract law experts as “lack of consent” (Beauchamp 2010, 56; Kleinig 2010, 13, 15)[^beauchamp-2010][^kleinig-2010].
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      This new development also raises substantive normative questions. For example, imagine that the same basic principle underlies legitimate political regimes and legitimate medical experimentation. It may follow that either tacit consent to a political regime, which Lockean contract theorists often cite, cannot successfully legitimize political regimes—because it would not suffice for most medical studies; or that tacit consent successfully legitimizes medical experimentation. Likewise, imagine that the same basic principle underlies the redistributive agency’s legitimate procurement of income and that of organs for transplantation. Then perhaps either income tax—without tax-payers’ consent—is illegitimate (Nozick 1986)[^nozick-1986], or a “kidney tax” could be perfectly legitimate (Fabre 2008, chs. 4–5)[^fabre-2008]. Either way, existing practice in one of these domains would be misguided.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      On a different approach, fundamentally different right-making principles and rationales regarding consent apply in domains like medicine, sex, political life, and the marketplace, as might be indicated by the variety of approaches to consent between these domains. For example, in most commercial transactions, unlike in the medical sphere, there are no legal requirements to disclose all relevant information and to verify that it is understood (Miller and Wertheimer 2010, 80; Joffe and Truog 2010, 351)[^joffe-2010][^miller-2010][^miller-2010-2][^wertheimer-2010], perhaps indicating that in commerce, fairness or the right to be spared exhausting disclosures (Chomanski and Lauwaert, forthcoming) generally matter more than autonomous decision-making. Likewise, whereas once we consent to sell a car or to support a political candidate (by signing a contract or casting a vote) our consent is not retractable, invasive medical intervention is usually considered illegitimate once a previously consenting patient or research participant expresses a change of mind—as though the point of consent in the medical arena were not simply autonomous authorization but ongoing control. Finally, if A mishears B’s consent to sex as refusal yet proceeds with sexual advances, a third party who understands the full picture has strong reasons to stop A’s advances (*pace* Alexander 2014, 105)[^alexander-2014]. But if a physician mishears a patient’s consent to medically beneficial treatment as refusal yet proceeds to it, it is far less clear that a third party who understands the full picture should thwart the treatment. The point of medical care is, after all, not defeated by discordance of attitudes in quite the same way that the point of sex is. One possible conclusion from this variety is that the very point of requiring informed consent, and hence what is fundamentally required and when, vary between domains.
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      ## 10. Conclusion: the core of informed consent
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      Recent decades have seen doubts surfacing about informed consent, but that just makes the resilience of other parts of the requirement all the more striking. Even purported critics usually revise only the requirement’s prevalent justifications and interpretations in borderline areas, and leave a certain “core” intact. Given how much philosophers usually disagree, it is remarkable that, when a medical intervention is risky, value-laden, high-impact, physically invasive, and/or medically controversial, especially when a patient of sound mind explicitly refuses the intervention, most of us would feel that only the most dire costs would justify imposition of care. The grudging nature of relative skeptics’ acceptance of this core part of the requirement only attests to its philosophical resilience.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      In seeking justification for the requirement of informed consent, we may therefore not have one task, but many. We need to justify this powerful, relatively non-controversial core, as well as a weaker and more questionable rim. It is possible that the core stems directly from natural right, whereas the rim is merely instrumental or conventional. It is also possible that they both rely on the same ground, say, the value of autonomy, but touch on it in different measures. Even if the core of the requirement of informed consent commands high priority, other parts may turn out to be easily overridable by competing values, including the value of advancing scientific research.
    step1: TBD
    step2: TBD
