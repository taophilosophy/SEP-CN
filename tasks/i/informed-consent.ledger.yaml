      But an account based on self-ownership raises more questions than it settles. Self-ownership may just *mean* that the individual should be the final arbiter in the relevant sphere, and that seems like a part of what informed consent requires—hardly an edifying rationalization for requiring informed consent (compare Cohen 1995, chs. 9–10)[^cohen-1995]. Alternatively, self-ownership may designate a more circumscribed list of rights (Fried 2005; Archard 2008, 29–30)[^archard-2008][^fried-2005], but this list would also stand in need of a defense, and cannot by itself count as adequate justification. A further challenge is that the self-ownership rationale fails to clarify why touching sensitive areas of the body without consent seems worse than touching less sensitive areas without consent. Property violation is not usually a matter of degree (compare Archard 2008, 30–1)[^archard-2008]. Finally, the self-ownership rationale fails to clarify why physicians must disclose and ensure our comprehension of information prior to intervention, something which proprietary rights seldom require. Indeed, the notion of self-ownership could be used *against* coercing doctors to give patients that information—because such coercion may violate these physicians’ self-ownership rights to interact as they will.
    step1: |-
      但基于自我所有权的说明提出的问题多于它解决的。自我所有权或许*仅仅意味着*个人应在相关领域成为最终裁决者，而这似乎正是知情同意所要求的一部分——很难说这是对要求知情同意的一种有益合理化（参 Cohen 1995, chs. 9–10）[^cohen-1995]。或者，自我所有权可能指一份更有限的权利清单（Fried 2005; Archard 2008, 29–30）[^archard-2008][^fried-2005]，但这份清单同样需要辩护，本身不能算作充分的正当化。进一步的挑战是：自我所有权理据未能澄清，为什么未经同意触碰身体敏感区域似乎比未经同意触碰较不敏感区域更糟。财产侵犯通常不是程度问题（参 Archard 2008, 30–1）[^archard-2008]。最后，自我所有权理据未能澄清，为什么医生必须在干预前披露信息并确保我们理解，而所有权权利很少要求这些。的确，自我所有权的观念甚至可被用来*反对*强制医生向病人提供该信息——因为这种强制可能侵犯这些医生按自己意愿交往的自我所有权。
