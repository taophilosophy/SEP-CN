      Whether being informed is cashed out in terms of disclosure or of comprehension, and whichever standard is used, asking that patients or study participants be even adequately informed is sometimes asking too much. U.S. federal regulations waive the information requirement in research for some studies that involve no more than a minimal risk (see [U.S. federal code 45 CFR 46.110](https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/revised-common-rule-regulatory-text/index.html#46.110)). In clinical care, many patients would rather not think about risks and prognoses that would turn their stomachs and that they can do little about. The legal defense of therapeutic privilege can be available to doctors who had reasonable belief that full disclosure or full comprehension would harm the patient physically or psychologically. In some such contexts it seems cogent not to demand informing in any form (see sections 6, 7 below). However, outright lies surely remain forbidden even in such circumstances. A possible conclusion is that informed consent encompasses several layers of requirements which differ in their stringency.
    step1: |-
      无论把“知情”落实为披露还是理解，也无论采用哪条标准，要求病人或研究参与者哪怕仅获得适当知情，有时都是要求过高。美国联邦法规对某些不超过最小风险的研究免除信息要求（见 [美国联邦法典 45 CFR 46.110](https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/revised-common-rule-regulatory-text/index.html#46.110)）。在临床照护中，许多病人宁愿不去想那些会让他们反胃、且他们无能为力的风险与预后。当医生有合理理由相信充分披露或充分理解会在身体或心理上伤害病人时，可援引治疗特权的法律抗辩。在某些此类情境中，不要求任何形式的知情似乎是令人信服的（见下文第 6、7 节）。然而，即便在此类情形中，公然撒谎无疑仍被禁止。一个可能的结论是：知情同意包含若干层要求，其严格程度各不相同。
