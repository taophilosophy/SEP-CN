      A different version of the autonomy rationale states, in the spirit of Immanuel Kant’s ethics, that autonomy should command our awe and reverence, whether or not it is good for us (Hill 1991, 43)[^hill-1991]. The literature on informed consent regularly cites Kant’s Formula of Humanity (Kant 1996, 80 [4:429])[^kant-1996] to establish that duties of respect for autonomy bind physicians (Beauchamp and Childress 2008, 63, 103; Dworkin 1988, 110; Levine 1988, 96–7; Pellegrino and Thomasma 1993, 128)[^beauchamp-2008][^dworkin-1988][^levine-1988][^pellegrino-1993]. Alan Donagan’s defense of the requirement of informed consent illustrates this Kantian approach: “Recognition of every human being as having a unique dignity as human, and as therefore being an end in every relation in which others may morally stand to him, entails that no human being may legitimately be interfered with in pursuing his conception of his happiness in whatever way seems best to him” (Donagan 1977, 31)[^donagan-1977].
    step1: |-
      自主性理据的另一种版本本着伊曼纽尔·康德伦理学的精神主张：无论自主性对我们是否有利，它都应激起我们的敬畏与尊崇（Hill 1991, 43）[^hill-1991]。知情同意文献经常引用康德的人性公式（Kant 1996, 80 [4:429]）[^kant-1996] 来确立医生负有尊重自主性的义务（Beauchamp and Childress 2008, 63, 103; Dworkin 1988, 110; Levine 1988, 96–7; Pellegrino and Thomasma 1993, 128）[^beauchamp-2008][^dworkin-1988][^levine-1988][^pellegrino-1993]。Alan Donagan 对知情同意要求的辩护体现了这种康德式进路：“承认每个人作为人具有独特尊严，因而在他人可能与他发生的每一种道德关系中都是目的，这蕴含：任何人追求自己所理解的幸福，无论以何种方式显得最好，都不得被正当地干涉”（Donagan 1977, 31）[^donagan-1977]。
    step2: |-
