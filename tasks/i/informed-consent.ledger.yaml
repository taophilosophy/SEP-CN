      However, insofar as the goal is to protect patients and trial participants from harm, why honor informed consent requirements when many physicians and patients—a Condorcet “jury”—are fairly certain that a particular patient or participant is not making a decision that furthers her own medical interests? In clinical care, for example, patients’ biases and ignorance about medicine arguably tend to exceed those of physicians; sometimes, patients refuse interventions that *everyone* considers best for them—even family, friends, and these patients themselves, before a change of heart. A family-oriented, supposedly Confucian, alternative to Western individualized informed consent culture (Fan (ed.) 2015) vests decision power on patients’ care with their families, which know them well and have the Condorcet advantage of comprising several people not one. In the future, patients may refuse interventions that highly-reliable algorithms or large language models predict patients like them will be glad to have undergone (compare Rid and Wendler 2010; Valdman 2010; Borg, Sinnott-Armstrong, and Conitzer 2024)[^rid-2010][^valdman-2010]. Indeed, some patients knowingly jeopardize their own health in the name of religious or moral commitments. This being the case, why is it important—as it seems to many of us and as is enshrined in law—to honor the requirement of informed consent? For example, why honor the requirement when a fully capacitated Jehovah’s Witness refuses a blood transfusion on religious grounds, risking injury? Why honor it when health is not at stake, for example, in experiments on stored tissue? Finally, specifically from a utilitarian standpoint, why honor the requirement on occasions when it seems to set back collective health, for example, when we cannot develop a new drug that would help many, because no one is altruistic enough to consent to participate in its risky study?
    step1: |-
      然而，既然目标是保护病人与试验参与者免受伤害，那么当许多医生与病人——一个孔多塞式“陪审团”——相当确信某位病人或参与者并未作出促进其自身医学利益的决定时，为什么还要遵守知情同意要求？例如在临床照护中，病人对医学的偏见与无知可以说往往超过医生；有时，病人会拒绝*所有人*都认为对他们最好的干预——甚至家人、朋友以及这些病人在改变主意之前自己也这么认为。一种以家庭为导向、据称属儒家式的替代方案（Fan (ed.) 2015）与西方个体化知情同意文化相对，把决定权交给病人及其家属，家属了解病人，且具有由数人而非一人组成的孔多塞式优势。未来，病人可能拒绝那些高度可靠的算法或大型语言模型所预测的、像他们这样的病人会庆幸自己接受过的干预（参 Rid and Wendler 2010; Valdman 2010; Borg, Sinnott-Armstrong, and Conitzer 2024）[^rid-2010][^valdman-2010]。的确，有些病人明知故犯地以宗教或道德承诺之名危及自身健康。既然如此，为什么——如我们许多人似乎认为、并已写入法律的那样——遵守知情同意要求很重要？例如，当一位有完全决定能力的耶和华见证人基于宗教理由拒绝输血、甘冒伤害风险时，为什么还要遵守该要求？当健康并非关键时，例如对储存组织进行实验时，为什么还要遵守？最后，特别从功利主义立场看，当遵守该要求似乎会损害集体健康时——例如，由于没有人利他到愿意同意参与一项有风险的研究，我们无法开发一种能帮助许多人的新药——为什么还要遵守？
