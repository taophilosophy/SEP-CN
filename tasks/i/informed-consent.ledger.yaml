      A second challenge to grounding informed consent requirements in autonomy is that violating informed consent requirements can have positive impact on autonomy. One example is when closing off an option, in violation of informed consent, enables more important freedoms. For instance, closing off patients’ options for voluntary euthanasia was said to increase their autonomy by freeing them, as well as similar patients, from family pressure to use that option (Velleman 1992)[^velleman-1992]; surely it may do so even when accomplished through forced injection of an antidote or other violations of informed consent.
    step1: |-
      把知情同意要求奠基于自主性的第二个挑战是：违反知情同意要求可能对自主性产生正面影响。一个例子是，违反知情同意而封闭某个选项，反而促成了更重要的自由。例如，有人说，封闭病人选择自愿安乐死的选项，通过使他们以及类似病人免于使用该选项的家庭压力，反而增进了他们的自主性（Velleman 1992）[^velleman-1992]；即便这一效果是通过强制注射解毒剂或其他违反知情同意的方式实现的，它显然仍可能如此。
