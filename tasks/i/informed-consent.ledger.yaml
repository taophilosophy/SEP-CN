      ### 7.1 Benign interventions
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      The reality is that informed consent procedures (form filling, mandatory disclosures, and so forth) are not legally mandated for the lion’s share of medical care, e.g. standard blood draws, in contrast to more invasive interventions like surgery. Nor are they necessary intuitively (Manson and O’Neill 2007, 81f)[^manson-2007]. In medical research, United States federal regulations authorize review boards to omit informed consent requirements on many occasions when “research involves no more than minimal risk to the participants”, a provision expanded in 2018. Likewise, a relatively safe and low-impact study comparing two widely used drugs to ascertain which is best seems morally permissible, even without a full-fledged informed consent process (Truog et al. 1999)[^truog-1999], and recent US regulations waive consent requirements in many such cases (Propes, O’Rourke, and Morain 2024).
    step1: TBD
    step2: TBD
