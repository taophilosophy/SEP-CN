      In some areas of practical ethics, the lack of decent alternatives to accepting a bad offer, a so-called “no choice” situation (Wertheimer 1987, e.g., p. 13)[^wertheimer-1987], is said to make us forced or compelled to choose the offer (Cohen 1979)[^cohen-1979], or to undermine voluntariness or independent decisionmaking otherwise (Millum & Garnett 2019)[^millum-2019]. While in such cases, indecent alternatives remain in principle open to us—the offer is not physically forced—the same could be said of paradigmatic cases of coercion. In “your money or your life” situations, the option of dying remains open to the victim.
    step1: TBD
    step2: TBD
