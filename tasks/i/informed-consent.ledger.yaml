      What is the point of the disclosure process? The Nuremberg Code can be understood to answer that one point is that a research participant should “have sufficient knowledge and comprehension of the elements of the subject matter involved as to enable him to make an understanding and enlightened decision.” Clearly, mere disclosure does not ensure that. Even when information is given in plain terms in the participant’s language, many participants fail to appreciate statistical information about risks, or the fact that in placebo controlled trials, they might not receive the treatment under investigation, or the fact that trials aim to further scientific knowledge and not necessarily their own medical good. The result is that participants tend to overestimate the benefits of trial participation and downplay its risks, part of a phenomenon called the “therapeutic misconception” (Candilis and Lidz 2010; Miller 2010, 382ff.; Beauchamp and Childress 2008, 129)[^beauchamp-2008][^candilis-2010][^miller-2010][^miller-2010-2].
    step1: |-
      披露流程意义何在？《纽伦堡法典》可被理解为回答：其意义之一在于，研究参与者应“对涉及主题的各要素有充分的知识与理解，从而能作出明智而开明的决定”。显然，仅凭披露并不能确保这一点。即便信息以参与者的语言、用平实词语给出，许多参与者仍未能领会关于风险的统计信息，或未能领会以下事实：在安慰剂对照试验中，他们可能得不到正在研究的治疗；或试验旨在推进科学知识，未必有利于其自身医疗。结果是，参与者往往高估参与试验的益处、低估其风险，这属于所谓“治疗性误解”现象的一部分（Candilis and Lidz 2010; Miller 2010, 382ff.; Beauchamp and Childress 2008, 129）[^beauchamp-2008][^candilis-2010][^miller-2010][^miller-2010-2]。
