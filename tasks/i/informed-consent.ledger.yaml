      Some authors have used such examples to downplay the need for informed consent, criticizing what they call bioethicists’ “fixation” with informed consent (O’Neill 2002, 47–8; Brownsword 2004, 224)[^brownsword-2004][^o’neill-2002]. In response, some proponents of informed consent insist that, in many of the alleged counter-examples, something in the way of informed consent remains vital. In blood draws, in particular, when the patient is shown the needle and silently stretches her arm forward, she is said to give tacit or non-verbal consent (Beauchamp and Childress 2008, 107; and see also Manson and O’Neill 2007, 11)[^beauchamp-2008][^manson-2007]. This particular response may be insufficient. For example, when a busy nurse with many patients in line realizes that a patient is very ignorant about a blood draw, such that her tacit consent is uninformed, intuitively the nurse does *not* owe the patient a long explanation of the risks from a sanitized needle prick, which are remote and minor.
