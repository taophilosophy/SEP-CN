      A quite different version of trust rationale is backward-looking. This version defends informed consent as an intrinsically important way to honor the trust that the patient has placed in the physician, and as part of the fiduciary role that the physician has undertaken (Joffe and Truog 2010, 352ff.)[^joffe-2010], perhaps a matter of virtuous trustworthiness (Pellegrino and Thomasma 1993, 65–78)[^pellegrino-1993]. However, the backward-looking version of the trust rationale has difficulty explaining the need for informed consent outside pre-existing caretaker-patient relationships. Forced bodily trespass, for example, seems (not much less) wrong when it comes from complete strangers.
    step1: |-
      信任理据还有一个相当不同的版本，是回溯性的。这一版本把知情同意辩护为尊重病人已寄予医生的信任的内在重要方式，也是医生所承担的信义角色的一部分（Joffe and Truog 2010, 352ff.）[^joffe-2010]，或许还关乎有德的值得信赖（Pellegrino and Thomasma 1993, 65–78）[^pellegrino-1993]。然而，回溯性版本的信任理据难以解释：在事先并不存在的看护者—病人关系之外，为何需要知情同意。例如，来自完全陌生人的强制身体侵入，似乎（并不逊色多少地）是错的。
