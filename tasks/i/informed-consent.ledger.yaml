    source: |-
      The simplest rationale for the informed consent requirement is that it protects study participants’ and patients’ health and welfare. It protects participants from investigators’ overzealous attempts to promote science and personal careers even on participants’ backs, and it also protects regular patients from neglectful clinicians or from overconfident, but often wrong, paternalistic ones. While many moral doctrines oppose harming study participants or patients, bioethicists’ expositions of this instrumental rationale typically echo utilitarian philosopher John Stuart Mill, for whom “Over himself, over his own body and mind, the individual is sovereign” (Mill 1990, 135; see also ch. 3)[^mill-1990]. They explain that patients and research participants are typically the best judges of their own good and mind it far more than the doctor does, even when the doctor is convinced that he or she acts in their best interests (compare Mill 1990, e.g. 215)[^mill-1990]. They add that doctors’ training scarcely prepares them to know patients’ distinctive non-medical interests.
    step1: |-
      知情同意要求最简单的理据是：它保护研究参与者与病人的健康与福祉。它保护参与者，使其免遭研究者为推进科学与个人事业而不顾一切、甚至以参与者为代价的尝试；它也保护普通病人，使其免遭疏忽的临床医生，或过度自信却常常出错的家长主义医生之害。尽管许多道德学说都反对伤害研究参与者或病人，生命伦理学家对这一工具性理据的阐述通常呼应功利主义哲学家约翰·斯图亚特·密尔，后者称“在自身之上、在自己的身心之上，个人是主权者”（Mill 1990, 135; 亦见第 3 章）[^mill-1990]。他们解释说，病人与研究参与者通常是自身利益的最佳判断者，也比医生更在意这些利益，即便医生确信自己的作为符合其最佳利益（参 Mill 1990, 如 215）[^mill-1990]。他们还说，医生的训练几乎不足以让他们了解病人特有的非医学利益。
