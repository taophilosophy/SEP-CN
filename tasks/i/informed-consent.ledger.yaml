      Fully autonomous decision-making is sometimes bad for us in at least certain respects, say, when it involves tortuous deliberations, makes us more accountable for embarrassing mistakes, or invites social pressure to make certain choices (Dworkin 1988, ch. 5)[^dworkin-1988]. The cost of ensuring that a single decision is absolutely autonomous may be a severe, permanent, or fatal health problem. This health problem will usually affect well-being more than a small marginal decrease in our autonomy would—yet some informed consent requirements apply. Indeed, on no theory of well-being—neither desire satisfaction, hedonic state, nor objective list—does it seem to follow that either informed consent or autonomous choice invariably makes a patient’s life better (Buchanan and Brock 1989, ch. 1 §4, esp. p. 40)[^buchanan-1989]. And if they did, then it would be difficult to claim, as proponents of the autonomy rationale do (Beauchamp and Childress 2008, e.g. pp. 12, 14)[^beauchamp-2008], that informed consent and the principle of autonomy are distinct from, sometimes conflict with, and often supersede, the principle of beneficence.
    step1: |-
      完全自主的决策有时至少在有些方面对我们不利，譬如当它涉及痛苦的斟酌、使我们更需为令人尴尬的错误负责，或招致社会压力去作某些选择（Dworkin 1988, ch. 5）[^dworkin-1988]。确保某一决定绝对自主的代价，可能是一个严重、永久或致命性的健康问题。这一健康问题对福祉的影响通常大于自主性微小边际下降的影响——然而某些知情同意要求仍然适用。的确，在关于福祉的任何理论——无论欲望满足论、快乐状态论还是客观清单论——之下，似乎都不能推出：知情同意或自主选择必定使病人的生活更好（Buchanan and Brock 1989, ch. 1 §4, esp. p. 40）[^buchanan-1989]。倘若确实如此，那就难以像自主性理据的拥护者那样主张（Beauchamp and Childress 2008, e.g. pp. 12, 14）[^beauchamp-2008]，知情同意与自主性原则有别于行善原则、有时与之冲突，且常常取代行善原则。
    step2: |-
      完全自主的决策有时至少在有些方面对我们不利，譬如当它涉及痛苦的斟酌、使我们更需为令人尴尬的错误负责，或招致社会压力去作某些选择（Dworkin 1988, ch. 5）[^dworkin-1988]。确保某一决定绝对自主的代价，可能是一个严重、永久或致命性的健康问题。这一健康问题对福祉的影响通常大于自主性微小边际下降的影响——然而某些知情同意要求仍然适用。的确，在关于福祉的任何理论——无论欲望满足论、快乐状态论还是客观清单论——之下，似乎都不能推出：知情同意或自主选择必定使病人的生活更好（Buchanan and Brock 1989, ch. 1 §4, esp. p. 40）[^buchanan-1989]。倘若确实如此，那就难以像自主性理据的拥护者那样主张（Beauchamp and Childress 2008, e.g. pp. 12, 14）[^beauchamp-2008]，知情同意与自主性原则有别于行善原则、有时与之冲突，且常常取代行善原则。
