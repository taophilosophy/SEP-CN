      An account in terms of personal integrity would require more specification. For example, what is the relation between this account and the offense of battery? Would this account condemn the use of a magic wand to treat an unwilling patient’s ailments without cutting his skin and so, perhaps without battery (Brock 1999, 529f)[^brock-1999]? Would it also condemn threat of fines that coerces patients to move their bodies in certain ways, even without touching them? Is the account ultimately grounded in an *a priori* argument, in evolutionary psychology (Wertheimer 2003, 113f.)[^wertheimer-2003], in non-ideal realities (Kukla 2021)[^kukla-2021], in the typical material harms from violations of bodily integrity, or in still other considerations?
