    kind: body
    source: |-
      Consider then a poor person who knows that his only way to gain access to an expensive life-saving drug is to participate in a risky or very unpleasant study where the drug is provided free of charge. He is not, strictly speaking, coerced (Hawkins 2008, 24–5)[^hawkins-2008], but some believe that his consent is involuntary and that the trial is unethical, because none of the options available to him are decent. However, there is a problem with this claim too. On its logic, whenever a very sick rich person has no decent alternative to taking a badly unpleasant life-saving drug, there is no voluntary consent, and drug delivery is illegitimate. Even when the nasty side effects remain far better for her than her only alternative—to die of the disease—she is not providing voluntary consent to take the drug, and it is unethical to give it to her. Since the latter reasoning is surely flawed, the former reasoning may be flawed as well.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Some have responded that the poor man’s inability to give voluntary consent to trial participation stems from injustice, not natural disease, and that this makes a big difference. But surely medical aid that saves consenting victims from the horrible results of *injustice* and carries unpleasant side effects can remain fully permissible. For example, following the 2010 earthquake in Haiti, it was fully permissible for the U.S. military and its physicians to perform consensual life-saving leg amputations. It was permissible whether earthquake injuries were purely natural, partly the result of non-U.S. injustice (local contractors’ independent neglect of safety rules), or partly the result of U.S.-perpetrated injustice (long-standing U.S. meddling in Haitian politics at the expense of accountability, including accountability for neglectful construction projects).
    step1: TBD
    step2: TBD
