      The non-domination rationale has difficulty explaining why physicians and investigators who are closely monitored and cannot mistreat patients with impunity would also be obligated to let patients decide. Arguably, some existing systems have ample institutional guardrails to predictably prevent physicians and investigators from exercising arbitrary control, even without informed consent requirements, yet commonsense insists on those requirements.
