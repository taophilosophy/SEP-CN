      In English, “consent” has several meanings. In the relevant sense, consent transactions have a distinct structure: agent *A* consents to *B*’s *φ*­-ing on *A*, under a certain description of *φ*­-ing, whether or not the offer was initiated by *B*. For example, a man may consent to a physician’s touching the man’s testicles as part of a testicular cancer exam upon the physician’s suggestion (compare Kleinig 2010, 6–7)[^kleinig-2010].
    step1: |-
      在英语中，“consent”有数种含义。在相关意义上，同意行为具有独特结构：行动者 *A* 在某种关于 *φ* 的描述下，同意 *B* 对 *A* 做 *φ*，无论提议是否由 *B* 发起。例如，一名男子可以在医生建议下，同意医生为做睾丸癌检查而触碰自己的睾丸（参 Kleinig 2010, 6–7）[^kleinig-2010]。
