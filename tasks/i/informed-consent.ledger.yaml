      Regardless of either the exact meaning of autonomy or the extent to which autonomy is good for us, grounding informed consent in autonomy turns out to be difficult. First, autonomous decision making over *all* matters that heavily affect one’s health is not something to which any patient has a right. Organ waitlists, for instance, can be perfectly legitimate even when some patients demand in full voluntariness the next available organ and autonomously refuse to wait in line. Just because receiving the organ would serve their autonomous wills does not make it their right to obtain organs designated to others ahead of them on the list. Admittedly, the autonomy rationale may here be conjoined with a clarification as to which matters concerning patients’ health they have a right to determine. But for some that right would then be the reason why their consent is required, when it is required (McConnell 2018)[^mcconnell-2018], potentially making any further reference to autonomy redundant.
    step1: |-
      无论自主性的确切含义为何，也无论自主性在多大程度上对我们有利，把知情同意奠基于自主性结果都很困难。第一，对*一切*严重影响自身健康的事务作自主决策，并不是任何病人都有权做的事。例如，器官等候名单完全可以正当，即便某些病人完全自愿地要求得到下一个可用器官，并自主地拒绝排队。仅仅因为获得器官会符合他们的自主意志，并不使他们有权先于名单上排在前面的人获得分配给那些人的器官。诚然，自主性理据在此可以与一项澄清相结合：病人在哪些关涉自身健康的事务上有权决定。但对某些人来说，这项权利随后就成了他们的同意为何被要求（当它被要求时）的理由（McConnell 2018）[^mcconnell-2018]，这有可能使任何进一步诉诸自主性变得多余。
