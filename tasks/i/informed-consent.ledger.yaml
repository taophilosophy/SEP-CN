      Lies about pertinent matters are broadly assumed to violate the informed consent requirement. So does non-lying deceit that intentionally prompts a false impression, for example, complete concealment of a potentially despairing prognosis, or its statement in obscure Latin terms that the patient cannot understand, in order to maintain the patient’s hope and medical adherence. So does non-lying deceit that is voluntary but unintentional, say an explanation in obscure Latin terms meant only to impress the patient but foreseen to hamper comprehension (Jackson 1991, 6)[^jackson-1991]. Interestingly, ignorance of side effects that results purely from the early stage of scientific inquiry into them is taken to permit informed consent and autonomous decisionmaking (Millum and Bromwich 2013)[^millum-2013]. A recent question is how much certain mild forms of intentional manipulation—for example, placing the hopeful news both at the beginning and at the end of a prognostic report so as to make its affect more hopeful—invalidate informed consent (Eyal 2016)[^eyal-2016].
    step1: |-
      关于相关事项的撒谎，被广泛认为违反知情同意要求。非撒谎的欺骗亦然——若它有意造成虚假印象，例如彻底隐瞒可能令人绝望的预后，或以病人听不懂的晦涩拉丁术语陈述，以维持病人的希望与遵医行为。自愿但非故意的非撒谎欺骗亦然，譬如以晦涩拉丁术语解释，本意只是让病人印象深刻，却可预见会妨碍理解（Jackson 1991, 6）[^jackson-1991]。有趣的是，纯粹因科学探究尚处早期而对副作用无知，被认为不妨碍知情同意与自主决策（Millum and Bromwich 2013）[^millum-2013]。晚近的一个问题是：某些轻度的故意操纵——例如把好消息同时置于预后报告的开头与结尾，使其情感色调更显希望——在多大程度上使知情同意无效（Eyal 2016）[^eyal-2016]。
