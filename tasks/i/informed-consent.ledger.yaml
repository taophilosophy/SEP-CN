      Clinical trials are commonly anticipated by a formalized process in which participants receive explanations of the purpose, methods, risks, benefits, and alternatives to study participation, as well as other matters, before they sign informed consent forms (Beauchamp and Childress 2008, 129)[^beauchamp-2008]. Fairly similar processes exist in invasive care. But what is the point of these processes? One of Plato’s characters mocks doctors who set aside time to keep sick patients informed: “Foolish fellow, … you are not healing the sick man, but you are educating him; and he does not want to be made a doctor, but to get well” (Plato *Laws*, IV.720a–c, p. 413). Let us discuss two forms of transgression of the information requirement: (1) lies, deceit, and merely-partial disclosure, and (2) the patient’s failure to comprehend well-presented information. We shall then discuss (3) the content and (4) the cogency of the information requirement.
    step1: |-
      临床试验通常以一个正式化流程为先导：参与者签署知情同意书之前，会获得关于研究目的、方法、风险、益处、参与研究的替代方案以及其他事项的说明（Beauchamp and Childress 2008, 129）[^beauchamp-2008]。侵入性照护中也有相当类似的流程。但这些流程意义何在？柏拉图笔下的一个人物嘲笑那些腾出时间让病人知情的医生：“蠢货……你不是在医治病人，而是在教育他；他不想被变成医生，只想痊愈”（柏拉图《法义》IV.720a–c, p. 413）。让我们讨论违反信息要求的两种形式：（1）撒谎、欺骗与仅部分披露；（2）病人未能理解表述良好的信息。然后我们将讨论信息要求的（3）内容与（4）说服力。
