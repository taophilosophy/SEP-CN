    kind: body
    source: |-
      To some, this may suggest that fully-fledged informed consent requirements simply do not apply to highly benign interventions. Surely the need to protect health and welfare, at least, through informed consent procedures is lesser when that risk is negligible in the first place. Interestingly, similar logic suggests that when an intervention is not benign yet informed consent cannot improve upon other protections, informed consent may also be unnecessary. A possible case in point is observational studies of anonymized electronic health records, where the main risk comes from breach of data security and confidentiality—a serious yet technical matter that few individual patients could assess reliably—and thus informed consent might be an ineffective, unhelpful protection. What is needed instead is legal and information technology solutions, as well as democratic decision making on any remaining risk.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Still, some elements of the requirement of informed consent obtain even in standard blood draws and other benign interventions (Dickert et al. 2017)[^dickert-2017]. Physical duress against a refusing patient and the intentional exploitation of a patient’s ignorance about blood draws both usually remain wrong. This may suggest that informed consent bundles together requirements of variable stringency, some of which obtain apply only sometimes. An alternative account of the impermissibility of duress even for benign blood draws is that informed consent is a bulwark against coercive or fraudulent medical interventions, risky or benign. However, the arguable permissibility of some benign studies without informed consent calls this defense into question.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      ### 7.2 Some risky experiments
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Advancing the field of emergency medicine requires medical experimentation, including trials that compare different interventions and that only sometimes serve the best interests of trial participants. But in emergency circumstances, it is often impossible to obtain consent from the patient or her family in time. Many physicians believe that because the field of emergency medicine simply cannot progress absent experimentation, there should be an exception to informed consent requirements for these trials, however risky, with substitutes for fully-fledged informed consent sought. That elements of informed consent, such as retrospective debriefing, remain necessary in such trials, again suggests a “bundled” requirement (Fost 1998; Dickert et al. 2017)[^dickert-2017][^fost-1998].
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      ### 7.3 Some public health policies
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Interestingly, that for public health interventions, whose impact on human health can exceed that of clinical interventions, usually little, if any, informed consent is mandated. Exposure to ads and “nudges” that promote populations’ health seems legitimate to most of us even when the authority executing the interventions discloses very little about these interventions, their risks, their alternatives, and any real opportunities to avert them. Changes to traffic regulations that affect accident rates on a grand scale are not thought to demand the consent of each individual citizen. Nor are such changes considered necessary when they are experimental (despite Richter et al. 2001)[^richter-2001]--health policy trials may require a very different approach to consent than clinical trials (Faden et al. 2013, Mackay and Chakrabarti 2019)[^faden-2013].
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Differently put, even in the absence of public health emergencies (which can warrant transgressions like forced geographical isolation), the widely accepted standard in public health seems more intrusive than the one in clinical care. As further illustration, many would agree that it is legitimate to implement smoke-free bar laws that somewhat increase anti-smoking stigma, partly in order to goad smokers to quit (and not only as measures to protect third parties from second-hand smoke). But most would condemn a clinician who deliberately boosts stigma to goad an individual patient to quit smoking (e.g. mocking the stink), and might explain that such pressure undermines the patient’s freedom to decide whether to quit. Is one of these arguably different approaches to informed consent right and the other one, wrong? Or is informed consent morally required for some interventions and not for others?
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      ### 7.4 Informed consent—when?
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      An emerging picture is that the need for informed consent depends on many variables. Just like being informed, the voluntariness of choices comes in degrees (Beauchamp and Childress 2008, 101)[^beauchamp-2008]. Threats, for example, control us to different degrees, depending on the degree of harm being threatened (Beauchamp 2010, 70–1)[^beauchamp-2010]. The level of voluntariness necessary for valid consent to medical intervention may vary according to the type of intervention offered. So does the level of decision-making capacity necessary for valid consent (Buchanan and Brock 1989, ch. 1; Beauchamp 2010, 71)[^beauchamp-2010][^buchanan-1989]. Robust informed consent that requires a great deal of information, voluntariness, and decisional capacity and is formalized and relatively non-waiveable, is necessary sometimes, but not always. Roughly speaking, robust informed consent (Joffe and Truog 2010, 358; Miller 2010, 391; Beauchamp and Childress 2008, 101; Beauchamp 2010, 70–1)[^beauchamp-2010][^beauchamp-2008][^joffe-2010][^miller-2010][^miller-2010-2] tends to be necessary the more risky the intervention, the more it is a high-impact (e.g. a definitive “critical life choice”: Archard 2008)[^archard-2008], the more it is value-laden and controversial, the more private the area of the body that the intervention directly affects (Mazor 2019)[^mazor-2019], and the more conflicted and unsupervised the practitioner. On other occasions, the need for very robust informed consent, and indeed, for consent of any form, is lesser (Miller 2010, 393)[^miller-2010][^miller-2010-2]. On those occasions, high financial or other costs of robust consent procedures easily override that need.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      Does the need for informed consent depend, among other variables, on whether the consent is for research or for care? Currently, consent procedures for research tend to be more demanding and more regulated than consent procedures for equally intrusive treatment (Levine 1988, 127–30; Miller 2010, 381)[^levine-1988][^miller-2010][^miller-2010-2]. Why? A standard account is that the proper goal of research is to gather generalizable knowledge, and not to help the individual, and that this different goal enhances the need for protections like informed consent (Fried 1974)[^fried-1974]. However, actual goals often differ from proper goals. In reality, many researchers are highly committed to promoting participants’ health, and many clinicians seek primarily financial gain, sometimes at patients’ expense. In addition, studies are reviewed independently for their safety, making some so safe that (with or without consent) they impose less risk than similar clinical care. Another rationale for the fewer consent requirements in care is that the relationship between the clinician and the patient is typically a fiduciary one whereas the relationship between the investigator and the study participant is scarcely fiduciary (Joffe and Truog 2010, 364)[^joffe-2010]. But this rationale could easily work the other way around: assuming that the fiduciary relationship is a ground for informed consent (Joffe and Truog 2010, 352ff.)[^joffe-2010], the more fiduciary clinical relationship should demand more, not less, by way of informed consent.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      Let us return to the general picture of scalar need for informed consent, which depends on many variables and generates different requirements on different occasions (Dickert et al. 2017)[^dickert-2017]. It also raises interesting practical questions. First, who should decide when (relatively exacting and burdensome) informed consent is necessary (Joffe and Truog 2010, 361)[^joffe-2010]? Might a crude, one-size-fits-all requirement of informed consent serve most practical purposes (Wertheimer 2014)[^wertheimer-2014]? Perhaps a fair compromise is to use an “intervention ladder” that defines broad categories of intervention as more or less intrusive, then specifies broad categories of circumstance that require especially robust consent in some cases and only minimal consent in others (Nuffield Council on Bioethics 2007, 41–3)[^nuffield-2007]? What seems, in any event, to emerge is that the need for informed consent would be misrepresented as fundamentally a single constraint or threshold. In this area, at least, commonsense morality acknowledges that prescriptions’ strengths and characters vary, with multiple determinants.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
