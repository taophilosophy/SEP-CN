      Some attempt to justify autonomy on merely instrumental grounds, suggesting, for example, that concordance between our care and our values is often key to our continued satisfaction and cooperation with assigned medical teams. Others add that autonomy is inherently good for us. First, self-rule is central to a good life, perhaps because it makes us less self-alienated and more worthy of praise for our virtuous decisions. Second, autonomous choices promote our ultimate goals. They allegedly do so because medicine affects non-technical and controversial matters of value and faith on which physicians lack expertise (say, a Jehovah’s Witness’s faith), and these goals (as well as their independent pursuit: Pugh 2020, ch. 9)[^pugh-2020] define how well our lives go (President’s Commission for the Study of Ethical Problems in Medicine and Biomedical and Behavioral Research 1982; Dworkin 1988, 113)[^dworkin-1988].
    step1: |-
      有人试图仅以工具性理由为自主性辩护，例如提出：我们的照护与我们的价值相一致，往往是我们持续满意并配合指定医疗团队的关键。另有人补充说，自主性本身对我们有益。第一，自我治理是善好生活的核心，或许因为它使我们较少自我异化，也使我们因有德的决定更值得称赞。第二，自主选择促进我们的终极目标。据称，这是因为医学涉及非技术性的、有争议的价值与信仰事务，医生在这些事务上缺乏专业（比如耶和华见证人的信仰），而这些目标（以及对它们的独立追求：Pugh 2020, ch. 9）[^pugh-2020] 界定了我们生活过得如何（President’s Commission for the Study of Ethical Problems in Medicine and Biomedical and Behavioral Research 1982; Dworkin 1988, 113）[^dworkin-1988]。
