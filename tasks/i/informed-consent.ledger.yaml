      How much do “implicit threats” count as threats? Imagine a practitioner who asks her own patient to participate in a study that the practitioner runs, and the patient fears that care would suffer if he declines, without the practitioner actually saying so. When the patient’s fear is well-founded, or even intentionally instilled by the practitioner, the norm has been to consider consent invalid. This clearly makes sense if what makes coercion problematic is (unjust) curtailment of options. However, even when the fear is unintended and not founded on the researcher’s specific behavior, the remaining uncertainty, combined with the typical power inequality of the physician-patient relationship, are often still thought to make such consent involuntary, perhaps by keeping the fear rationally legitimate (Hempeler et al 2024).
    step1: |-
      “隐性威胁”在多大程度上算作威胁？设想一位从业者请自己的病人参与她主持的一项研究，病人担心若拒绝，照护会受影响，尽管从业者并未明说。当病人的恐惧有充分根据，甚至由从业者有意灌输时，规范一向认为同意无效。若使强制成为问题的正是（不正义的）选项削减，这显然说得通。然而，即便恐惧并非有意造成、也并非基于研究者的具体行为，残余的不确定性加上医患关系典型的权力不平等，往往仍被认为使此种同意非自愿，或许是因为它使恐惧在理性上仍然正当（Hempeler et al 2024）。
