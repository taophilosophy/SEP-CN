      A third challenge is that not all acts that are generally assumed to violate informed consent seem contrary to autonomous decision-making. Suppose that a sufficiently capacitated adult patient refuses a safe, beneficial, and time-sensitive surgery to prevent a moderate disability, due to a simple misunderstanding of medical facts. There is no time to convince him of his mistake. Being uninformed, his decision cannot count as autonomous. But present medical practices surrounding informed consent continue to forbid, possibly for good reasons, forcing care on such a patient—for example, strapping him to the bed to deliver an operation. In such instances, the problem with forced care cannot be simply violation of autonomy. Some have argued in somewhat similar cases that forced care is legitimate, because it would contravene “mere desire” not “rational desire” (Savulescu 1994)[^savulescu-1994], and because “the state has the right to prevent self-regarding harmful conduct…*when…* that conduct is substantially nonvoluntary…” (Feinberg 1986, 12)[^feinberg-1986]. A different possible conclusion is that present informed consent practices are sound, they just rest on justifications other than respect for personal autonomy; surely a “No” to an intervention in the body is often a “No” even when the patient lacks the capacity or the information to authorize an autonomous “Yes” (compare Estlund 2007, 121–5; Gunderson 1990)[^estlund-2007][^gunderson-1990]. A third possible conclusion is that while what is wrong with forced care in this setting is the violation of autonomy, what “autonomy” means here is simply a domain over which one should remain sovereign and have the final say, even if uninformed, incapacitated, and so forth (Enoch 2017, 31–32)[^enoch-2017]. This, however, would disallow appeal to autonomy to clarify why certain actions fall inside that domain whereas others are permitted despite the patient’s refusal.
    step1: |-
      第三个挑战是：并非所有通常被认为违反知情同意的行为都似乎与自主决策相悖。假设一位有充分决定能力的成年病人，因对医学事实的简单误解，拒绝一项安全、有益且时间紧迫、可预防中度残疾的手术。已没有时间说服他认识错误。由于不知情，他的决定不能算自主。但现行围绕知情同意的医疗实践仍然禁止——也许有充分理由——把照护强加给这样的病人，例如把他绑在床上施行手术。在此类情形中，强制照护的问题不能简单说是侵犯自主性。有人在一些类似情形中主张，强制照护是正当的，因为它违背的是“单纯欲望”而非“理性欲望”（Savulescu 1994）[^savulescu-1994]，也因为“国家有权防止自涉的伤害行为……*当……*该行为实质上是非自愿的……”（Feinberg 1986, 12）[^feinberg-1986]。另一种可能的结论是：现行知情同意实践是健全的，只是它们依据的是尊重个人自主性之外的正当化理由；对侵入身体的干预说“不”，往往就是说“不”，即便病人缺乏能力或信息去作出自主的“是”（参 Estlund 2007, 121–5; Gunderson 1990）[^estlund-2007][^gunderson-1990]。第三种可能的结论是：在此情形中，强制照护的过错虽然在于侵犯自主性，但这里的“自主性”仅指一个领域，在其中人应保持主权并有最终发言权，即便不知情、无能力等等（Enoch 2017, 31–32）[^enoch-2017]。然而，这会使我们无法诉诸自主性来说明：为什么某些行动落在这个领域之内，而另一些行动尽管病人拒绝却被允许。
