      A final rationale for informed consent requirements is the need to protect patients’ sense of personal integrity. One reason offered for keeping surrogate pregnancy contracts non-enforceable is the need to maintain surrogate carriers’ sense of personhood by never coercively taking babies away (Radin 1983, e.g., 960)[^radin-1983]. A similar rationale may be thought to justify informed consent in general, and to reflect our special relation to our bodies. As Gerald Dworkin put a slightly different point, “one’s body is irreplaceable and inescapable. If my architect doesn’t listen to me and this results in a house I do not like, I can always move. I cannot move from my body.” (Dworkin 1988, 113)[^dworkin-1988]. By one interpretation, personal integrity underlies self-ownership norms. What it requires is, in Ronald Dworkin’s words, “a prophylactic line that comes close to making the body inviolate” (Dworkin 1983, 39)[^dworkin-1983]. However, personal integrity may instead give rise to a normative continuum, on which the outer line of the body is only one stop. Touching someone’s cheek without his informed consent is hardly as bad as touching more sensitive areas of his body without his informed consent. The continuum may also extend outside the body. As Judith Thomson pointed out, it is a greater transgression to touch an unwilling person’s body than to touch his shoes, yet a small transgression exists–even when he is not wearing them (Thomson 1990, 207–8)[^thomson-1990]. It also matters how and why these areas are touched. Such continua may be thought to track the typical degree of injury to personal integrity.
    step1: |-
      知情同意要求的最后一种理据，是需要保护病人的人格完整感。有人提出，代孕合同之所以不可强制执行，原因之一是需要通过从不强制夺走婴儿来维持代孕者的人格感（Radin 1983, e.g., 960）[^radin-1983]。类似的理据或可被认为能一般地辩护知情同意，并反映我们与身体的特殊关系。正如 Gerald Dworkin 以一个稍有不同的论点所说：“一个人的身体不可替代、不可逃离。如果我的建筑师不听我的，结果造出一栋我不喜欢的房子，我总还能搬家。我却无法搬离自己的身体。”（Dworkin 1988, 113）[^dworkin-1988]。按一种解释，人格完整是自我所有权规范的基础。它所要求的，用 Ronald Dworkin 的话说，是“一条近乎使身体不可侵犯的预防性界线”（Dworkin 1983, 39）[^dworkin-1983]。然而，人格完整也可能产生一个规范连续统，身体的外缘只是其中一站。未经某人知情同意触碰其脸颊，几乎不如未经其知情同意触碰其身体更敏感区域那样糟。这一连续统也可能延伸到身体之外。正如 Judith Thomson 指出，触碰一个不情愿者的身体比触碰他的鞋子是更大的侵害，但即便他没穿鞋，也存在轻微侵害（Thomson 1990, 207–8）[^thomson-1990]。这些区域如何被触碰、为何被触碰也很重要。此类连续统或可被认为追踪了对人格完整的典型伤害程度。
