      Another rationale surrounds self-ownership: we are presumed to hold proprietary rights over ourselves and our bodies, perhaps in line with John Locke’s idea that “every Man has a *Property* in his own *Person*” (Locke 1988, V. 27, 305)[^locke-1988]. Naturally, once an owner’s consent is given, the alleged proprietary prohibition on access and on direct impact is removed. This rationale may better explain why we must normally grant our permission, even for medical intervention that is safe, low-impact, and clearly beneficial, and requires no agency on our part. Trespass into a private sphere can be forbidden even when it involves mere touching, and the owner is foolish or selfish to reject it (Nozick 1986; Thomson 1990, ch. 8; Archard 2008, 27f; Mazor 2019)[^archard-2008][^mazor-2019][^nozick-1986][^thomson-1990].
    step1: |-
      另一种理据围绕自我所有权：我们被推定对自己与自己的身体拥有所有权，或许与约翰·洛克的观点一致：“每个人对其*人身*都拥有*财产权*”（Locke 1988, V. 27, 305）[^locke-1988]。自然，一旦所有者给出同意，所谓对接触与直接影响的所有权禁令便解除。这一理据或许更能解释：为什么我们通常必须给予许可，即便对安全、低影响且明显有益、并不需要我们行使能动性的医疗干预也是如此。侵入私人领域即便只涉及触碰也可被禁止，而所有者拒绝它是愚蠢或自私的（Nozick 1986; Thomson 1990, ch. 8; Archard 2008, 27f; Mazor 2019）[^archard-2008][^mazor-2019][^nozick-1986][^thomson-1990]。
    step2: |-
