      Voluntary consent is usually thought incompatible with coercion, which most philosophers define, roughly, as a threat to make someone seriously worse off than she is or should be, unless she consents (Wertheimer 1987)[^wertheimer-1987]. Nonetheless, the prevailing medical ethos tends to treat more cases as cases of coercion than this philosophical definition would suggest. For example, a threat to cause even slight pain unless a patient acquiesces would be taken to invalidate her consent even when the patient and the physician know that it would not make her seriously worse off and so, that it would not amount to coercion.
    step1: |-
      自愿同意通常被认为与强制不相容；多数哲学家大致把强制定义为：除非她同意，否则威胁使其处境严重恶化，甚于她目前或本应处的状况（Wertheimer 1987）[^wertheimer-1987]。然而，主流医学伦理气质往往把比这一定义所暗示的更多情形当作强制。例如，即便病人与医生都知道，除非病人默许否则就造成哪怕轻微疼痛的威胁并不会使其处境严重恶化、因而并不构成强制，这种威胁也会被认为使她的同意无效。
    step2: |-
