      Let us now review the different elements of fully free and informed consent in greater detail, starting with the notion of consent itself. English admits of both psychological and behavioral senses of consent. Psychologically, consent can designate “a state of mind of acquiescence” (Westen 2003, 5)[^westen-2003], and “an act of will—a subjective mental state…” (Hurd 1996, 121)[^hurd-1996]. But the medical requirement of informed consent seems to include at least some behavioral expression of consent (Kleinig 2010, 9–10; Dougherty 2021)[^dougherty-2021][^kleinig-2010], ranging from a patient’s signature, to her *not* protesting when a nurse approaches with a syringe (so-called implicit or tacit consent). That said, the need for some comprehension and voluntariness means that mental states also affect when consent legitimizes medical intervention, perhaps supporting a hybrid view of one sort (Miller and Wertheimer 2010, 84)[^miller-2010][^miller-2010-2][^wertheimer-2010] or another (Alexander 2014)[^alexander-2014].
    step1: |-
      现在让我们更细致地考察完全自由且知情的同意的各个要素，从同意概念本身开始。英语中，同意既有心理意义，也有行为意义。在心理上，同意可指“一种默许的心态”（Westen 2003, 5）[^westen-2003]，以及“一种意志行为——一种主观心理状态……”（Hurd 1996, 121）[^hurd-1996]。但医学上的知情同意要求似乎至少包含同意的某种行为表达（Kleinig 2010, 9–10; Dougherty 2021）[^dougherty-2021][^kleinig-2010]，从病人签字，到护士拿着注射器走近时她*不*抗议（所谓默示同意或默许同意）。话虽如此，需要某种理解与自愿，意味着心理状态也影响同意何时使医疗干预正当化，这或许支持某种混合观点（Miller and Wertheimer 2010, 84）[^miller-2010][^miller-2010-2][^wertheimer-2010] 或另一种混合观点（Alexander 2014）[^alexander-2014]。
