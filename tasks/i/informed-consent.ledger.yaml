      The abuse-prevention rationale may be unable to account for the full extent of clinicians’ informed consent duties. We have already mentioned that physicians should make some effort to explain information again if they discover that their patients misunderstand crucial risks. Intuitively, this is so even if the patient was given an excellent explanation that worked with similar patients, ruling out reasonable suspicion of deceit, exploitation, or fraud. If their patients still misunderstand crucial risks, these doctors or researchers should at least make some effort to re-explain (Keren and Lev 2022)[^keren-2022]. Given that abuse has already been ruled out, the abuse-prevention rationale fails to account for this duty (Beauchamp and Childress 2008, 118; compare Manson and O’Neill 2007, 82–3)[^beauchamp-2008][^manson-2007]. That said, advocates of the abuse-prevention rationale can explain that duty based on complementary rationales for informed consent (Millum and Bromwich 2013, 218)[^millum-2013].
    step1: |-
      防止滥用理据可能无法解释临床医生知情同意义务的全部范围。我们已提到，医生若发现病人误解关键风险，应当再作些解释努力。直觉上，即便病人已获得一份在类似病人身上奏效的出色说明，从而排除了对欺骗、剥削或欺诈的合理怀疑，情况依然如此。若病人仍误解关键风险，这些医生或研究者至少应作些重新解释的努力（Keren and Lev 2022）[^keren-2022]。既然滥用已被排除，防止滥用理据便无法解释这项义务（Beauchamp and Childress 2008, 118; 参 Manson and O’Neill 2007, 82–3）[^beauchamp-2008][^manson-2007]。话虽如此，防止滥用理据的倡导者可依据知情同意的补充理据来解释这项义务（Millum and Bromwich 2013, 218）[^millum-2013]。
