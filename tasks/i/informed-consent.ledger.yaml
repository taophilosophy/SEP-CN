      When emergency intervention is needed but normal consent cannot be obtained, say, because the patient is unconscious and neither she nor her family’s specific preferences can be identified in time, proponents of informed consent often justify intervention by invoking a potentially different form of consent. They say that *presumed consent* obtains, even if actual and express consent does not. Presumed consent is also often invoked in order to legitimize a general policy of harvesting organs from healthy deceased persons to use in transplantation unless they explicitly indicated their opposition, and a similar general policy of testing all incoming patients for HIV except those who explicitly request not to be tested. Such policies reverse the usual default assumptions about what is permissible and place the onus on any individual who has reservations, to “opt out.” The underlying thought is that when opting out remains easy, so-called presumed consent is perfectly consonant with patient sovereignty (Sunstein and Thaler 2008)[^sunstein-2008].
    step1: |-
      当需要紧急干预却无法取得正常同意时——譬如因为病人昏迷，她本人或家人的具体偏好都无法及时查明——知情同意的拥护者常诉诸一种可能不同的同意形式来辩护干预。他们说，即便实际的、明示的同意并不存在，*推定同意*仍然成立。推定同意也常被援引来使一项一般政策正当化：除非健康死者明确表示反对，否则从其遗体采集器官用于移植；以及类似的一般政策：除非病人明确要求不做检测，否则对所有入院病人做 HIV 检测。此类政策颠倒了通常关于何为可允许的默认假定，把责任置于任何有保留的个人身上，由其“选择退出”。其潜在想法是：当退出仍然容易时，所谓的推定同意完全符合病人主权（Sunstein and Thaler 2008）[^sunstein-2008]。
