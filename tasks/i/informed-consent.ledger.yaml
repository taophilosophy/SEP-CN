      The *professional standard* mandates informing patients and participants of those details that it is conventional for professionals in the field to mention. Once predominant, this standard has lost much of its traction with U.S., English, and Welsh courts. Indeed, no professional convention exists on this issue, and courts have opined that patients should decide which information is pertinent to them. The *reasonable person standard* mandates disclosing whatever details a reasonable patient would find pertinent. Finally, the *individual standard* mandates informing the patient or participant of those details that she, given her determinate and potentially unreasonable conception of the good, would find pertinent if she were otherwise reasonable (Beauchamp and Childress 2008, 122f.; Levine 1988, 104–5; Berg et al. 2001, 46–52)[^beauchamp-2008][^berg-2001][^levine-1988]. An argument against requiring the disclosure or comprehension of *any* risk is that neither is necessary for the restoration of trust and for deterring abuse of patients and trial participants; what is necessary is only ready patient and trial participant access to the relevant information in the event that abuse is suspected (Manson and O’Neill 2007, 179ff.)[^manson-2007].
    step1: |-
      *专业标准*要求告知病人与参与者该领域专业人士习惯上会提及的那些细节。这一标准曾占主导，但在美国、英格兰与威尔士法院已失去不少吸引力。的确，在此问题上并不存在专业惯例，法院也认为应由病人决定哪些信息与其相关。*理性人标准*要求披露任何一位理性病人会认为相关的细节。最后，*个体标准*要求告知病人或参与者：鉴于她确定且可能不合理的善观念，若她在其他方面是理性的，她会认为相关的那些细节（Beauchamp and Childress 2008, 122f.; Levine 1988, 104–5; Berg et al. 2001, 46–52）[^beauchamp-2008][^berg-2001][^levine-1988]。反对要求披露或理解*任何*风险的一项论证是：两者都不是恢复信任、遏制对病人与试验参与者滥用所必需的；所必需的只是病人在怀疑滥用时能随时获取相关信息（Manson and O’Neill 2007, 179ff.）[^manson-2007]。
