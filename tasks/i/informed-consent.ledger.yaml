      Another category often said to undermine voluntariness is undue inducement, a term of art meaning that something is being offered that is alluring to the point that it clouds rational judgment, for instance, allegedly, glittering cash in hand or airline tickets in return for kidney donation or risky study participation. Attention is fixated on the benefit, disallowing proper consideration of risks. The thought here is not that the offer is too good to decline rationally, but that, as in deceit and hypnosis, proper reasoning and decision-making about it becomes impossible, at least for some patient populations (Wilkinson 2003, 117–118)[^wilkinson-2003]. A common worry among bioethics practitioners, undue inducement is less concerning to philosophers who have tried to make sense of the notion, partly because these philosophers find that inability to reason properly is somewhat rarer than the worry assumes (Wertheimer 2010)[^wertheimer-2010].
    step1: TBD
