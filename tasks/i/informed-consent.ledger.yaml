      The intentional use of the placebo effect in clinical care, commonly a deceitful means to help a patient feel better, is condemned by prominent bioethicists in the name of informed consent (Bok 1999, 61ff.; Beauchamp and Childress 2008, 125)[^beauchamp-2008][^bok-1999]. Other seeming breaches of the information component of informed consent are somewhat more popular with bioethicists. First, the well-established “nocebo” effect is when the patient’s expectation of a negative outcome as a possibility generates corresponding symptoms or exacerbates them. When a severe, unavoidable nocebo effect from disclosure is predictable, most philosophical observers support withholding certain information (Cohen 2014)[^cohen-2014]. In some cultures, patients are averse to hearing about risks because they falsely believe that the mention of remote risks makes those risks likelier to materialize. While the expectation is false, it means that full disclosure of these risks would meet with aversion, potential anxiety, and fewer clinic visits, and many bioethicists permit partial disclosure in such settings (Beauchamp and Childress 2008, 106)[^beauchamp-2008]. Finally, so-called deceptive studies can begin while the participant is waiting in the corridor for what she believes is an altogether different experiment, precisely because full disclosure would foil the investigation. Their deceitful nature notwithstanding, such studies are ubiquitous in psychology and some bioethicists find forms of them acceptable (but see condemnation in Bok 1995)[^bok-1995].
    step1: |-
      在临床照护中故意利用安慰剂效应——通常是帮助病人感觉好些的欺骗手段——被知名生命伦理学家以知情同意的名义谴责（Bok 1999, 61ff.; Beauchamp and Childress 2008, 125）[^beauchamp-2008][^bok-1999]。其他看似违反知情同意信息成分的做法，在生命伦理学家中则较受欢迎。第一，已确立的“反安慰剂”效应，指病人对负面结果之可能性的预期产生相应症状或使之加剧。当披露可预见会造成严重且不可避免的反安慰剂效应时，多数哲学观察者支持保留某些信息（Cohen 2014）[^cohen-2014]。在某些文化中，病人不愿听到风险，因为他们误以为提及遥远风险会使这些风险更可能成真。尽管这一预期是假的，它意味着充分披露这些风险会招致反感、潜在焦虑与更少的就诊，许多生命伦理学家在此类情境中允许部分披露（Beauchamp and Childress 2008, 106）[^beauchamp-2008]。最后，所谓的欺骗性研究可以在参与者于走廊等候、以为自己要参加一项完全不同的实验时开始，恰恰因为充分披露会破坏调查。尽管具有欺骗性质，此类研究在心理学中比比皆是，一些生命伦理学家认为其中某些形式可接受（但见 Bok 1995 的谴责）[^bok-1995]。
