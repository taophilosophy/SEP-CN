      An alternate rationale defends informed consent requirements as a bulwark against such deontological offenses as assault, deceit, coercion, and exploitation (Manson and O’Neill 2007, 75f.)[^manson-2007], or fraud (Millum and Bromwich 2013)[^millum-2013]. From this viewpoint, informed consent requirements are instrumental against certain abusive acts, not (only) against setbacks to health and welfare.
    step1: |-
      另一种理据把知情同意要求辩护为抵御道义论过犯——如殴打、欺骗、强制与剥削（Manson and O’Neill 2007, 75f.）[^manson-2007]——或欺诈（Millum and Bromwich 2013）[^millum-2013] 的堡垒。从此观点看，知情同意要求是防范某些滥用行为的工具，而非（只）防范对健康与福祉的损害。
