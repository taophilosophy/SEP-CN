    source: |-
      Another way out is to say that consent is insufficiently voluntary only when the patient’s options are unfairly curtailed by the offer itself (Miller and Wertheimer 2010, 92, 97)[^miller-2010][^miller-2010-2][^wertheimer-2010]. The reason why “Your money or your life” curtails voluntariness is that it curtails our options. By contrast, the above-mentioned offers to the poor trial candidate and to the rich patient do not curtail options. They maintain voluntariness. However, one may insist that, while not *coercive*, “no choice” situations somewhat undermine voluntariness (Feinberg 1986, 233–244)[^feinberg-1986], the good of independent decisionmaking (Millum & Garnett 2019)[^millum-2019], the appropriateness of the offer to participate (Bomann-Larse 2013, 72ff.), or even the (likely overall) permissibility of intervention. Imagine impoverished potential study participants who lack alternative ways to obtain life-saving drugs. The investigators offer them these drugs whether or not they consent to participate, free of charge. The intuition is that this free, unconditional offer increases the voluntariness of these potential participants’ decisions on whether to participate, and it makes their invitation to participate in a risky trial easier to defend ethically.
