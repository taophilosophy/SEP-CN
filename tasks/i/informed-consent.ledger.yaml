      While occasionally, the need for autonomous authorization of medical intervention is considered “axiomatic” (Beauchamp 2010, 58)[^beauchamp-2010], it is commonplace to defend autonomy on independent grounds. A complete autonomy-based justification for the informed consent requirement would explain both why personal autonomy, under a plausible explication, matters—why it has high value or status, at least in the health arena; and how honoring the informed consent requirement engages with its value or status correctly.
    step1: |-
      尽管偶尔有人把医疗干预需要自主授权视为“公理”（Beauchamp 2010, 58）[^beauchamp-2010]，但依据独立理由为自主性辩护仍是常见做法。一个完整的、以自主性为据的知情同意要求正当化，须同时说明：在一种可信的阐释下，个人自主性为何重要——为何具有高价值或高地位，至少在健康领域如此；以及遵守知情同意要求如何正确地与其价值或地位相关联。
    step2: |-
      尽管偶尔有人把医疗干预需要自主授权视为“公理”（Beauchamp 2010, 58）[^beauchamp-2010]，但依据独立理由为自主性辩护仍是常见做法。一个完整的、以自主性为据的知情同意要求正当化，须同时说明：在一种可信的阐释下，个人自主性为何重要——为何具有高价值或高地位，至少在健康领域如此；以及遵守知情同意要求如何正确地与其价值或地位相关联。
