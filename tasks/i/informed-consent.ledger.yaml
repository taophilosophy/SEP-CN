      ### 2.6 Non-domination
    step1: |-
      ### 2.6 无支配
    step2: |-
      ### 2.6 无支配
  - id: 42
    kind: body
    source: |-
      Bioethicists rarely explore the value of non-domination as a rationale for informed consent, although this rationale is used extensively in sexual ethics and political philosophy. The idea here would be that no one should be under the arbitrary control of another and that informed consent requirements help to prevent such arbitrary control. One would argue that medicine is rife with potential to become hierarchical, given the utter dependency of patients and research participants on physicians (Levine 1988, 121–2)[^levine-1988], as well as the knowledge gaps between them, especially in the investigational context. Therefore, it is important to ensure that patients and research participants retain a high degree of control over what happens to them, and informed consent helps with this. This rationale may shed light on the special importance of informed consent to research participation—where the knowledge gap is especially high. Indeed, there is a specific informed consent right to withdraw from research at any point–perhaps because even if one has autonomously waived protection, arbitrary control by others, without the protection of a consent requirement, would constitute domination (compare Pateman 1990, 79 on the wrongness of forcing sexual interaction even within otherwise consensual marital relations–because rights to nondomination cannot be waived)[^pateman-1990]. Inasmuch as shared decisionmaking with patient groups can prevent domination, it is a natural complement to individual informed consent (Kestigian 2017, 11).
    step1: |-
      生命伦理学家很少探讨把无支配作为知情同意理据的价值，尽管这一理据在性伦理学与政治哲学中被广泛使用。这里的想法是：没有人应处于他人的任意控制之下，而知情同意要求有助于防止这种任意控制。有人会论证，鉴于病人与研究参与者完全依赖医生（Levine 1988, 121–2）[^levine-1988]，以及双方之间的知识差距（在研究情境中尤甚），医学充满变得等级化的潜能。因此，重要的是确保病人与研究参与者对他们身上发生的事保有高度控制，而知情同意有助于此。这一理据可揭示知情同意对参与研究的特殊重要性——此处的知识差距尤其大。的确，有一项特定的知情同意权利，即随时退出研究——或许因为即便某人已自主放弃保护，在缺少同意要求保护的情况下受他人任意控制仍会构成支配（参 Pateman 1990, 79 论即便在其他方面合意的婚姻关系中强制性的性互动的错误——因为无支配权不可放弃）[^pateman-1990]。既然与病人群体共同决策可防止支配，它便是个体知情同意的自然补充（Kestigian 2017, 11）。
