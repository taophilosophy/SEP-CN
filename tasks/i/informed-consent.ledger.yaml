      When, if ever, is a person authorized to waive her informed consent rights? Should participants who donate blood in a medical trial be permitted to authorize its use in any future trial, without their specific consent for each token (as U.S. federal regulations allow them, since 2018, to do)? What about a patient or a candidate study participant who asks to be spared tedious descriptions of her different options, and would rather entrust the medical team, or her village elder, with key decisions? What about someone who asks her physician to lie to her, if he is willing, should her prognosis be despairing? And what about a woman who would like to sell pregnancy services with a fully enforceable contract to hand over the baby even if she develops strong maternal feelings toward him or her and seeks to revoke her consent?
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      In democratic politics, we delegate many decisions to representatives. But we keep ourselves barred from signing away others, including the decision to waive our voting rights altogether. The question as to which decisions our institutions should allow patients to delegate to third parties is complex and under-explored. Bioethicists usually frown upon letting patients grant so-called *carte blanche*, or general consent, to whatever the physician considers appropriate for them (Dworkin 1988, e.g., 125–6)[^dworkin-1988]. Instead, patients are usually encouraged or compelled to make decisions on a more ongoing basis—to give so-called specific consent (Kleinig 2010, 18)[^kleinig-2010]—although there are logical limits to how specific consent can be (Manson and O’Neill 2007, 12)[^manson-2007].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      The requirement of informed consent is often attacked on the ground that many patients would rather have physicians make certain decisions for them, and that such delegation often seems acceptable (Schneider 1998)[^schneider-1998]. One answer to the attack argues that informed consent is a patient’s right, not her duty (Beauchamp and Childress 2008, 105, 107)[^beauchamp-2008], and that, since informed consent serves autonomy, it ought to be autonomously waiveable (Beauchamp and Childress 2008, 106)[^beauchamp-2008]. Indeed, autonomously signed advance directives that bind one’s future self can be perfectly consensual and autonomous. What we may call “waiveable waivers” of informed consent rights (“Please spare me the full disclosure or decide in my name unless I ask to resume full disclosure or active control”) seem relatively easy to accept and fairly consistent with autonomy. However, we do impose some rights, which we consider inalienable, on unwilling rights holders. The right not to become a slave is inalienable, and the same may apply to some informed consent rights, such as the right not to become a participant of a clinical trial that one cannot exit.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      An alternative answer to the attack is therefore that some informed consent rights are waiveable (perhaps including many disclosure rights), and others are non-waiveable (perhaps including the right to revoke prior consent to bodily intrusion). Theory is needed in order to tell which informed consent rights are waiveable and which are not. (Is the alleged second-order right to *waive* informed consent rights alienable?) Theory should also explore whether non-waiveable consent requirements are consistent with patient autonomy, say, because what such requirements impose is autonomous decision-making (potentially out of *paternalistic* concern with protecting the patient’s autonomy). It should also characterize how much the waiveability of informed consent should depend on the health worker’s relative expertise on the subject matter (Brown 2024)[^brown-2024].
    step1: TBD
