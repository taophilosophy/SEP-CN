      Informed consent is shorthand for informed, voluntary, and decisionally-capacitated consent. Consent is typically considered sufficiently informed when a capacitated (or “competent”) patient or research participant to whom full disclosures have been made and who understands fully all that has been disclosed consents voluntarily to treatment or participation on this basis.
    step1: |-
      知情同意是“知情的、自愿的且有决定能力的同意”的简称。通常认为，当一位有决定能力（或“有行为能力”）的病人或研究参与者已获得充分披露，且完全理解所披露的一切，并在此基础上自愿同意接受治疗或参与研究时，其同意才算充分知情。
    step2: |-
