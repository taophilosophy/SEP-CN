      Since the 1970s, extensive bioethics writing focuses on how to define and achieve “valid” consent—sufficiently capacitated, informed, and voluntary consent—and the conditions, especially in medical research, have become increasingly demanding in later decades. The contrast between these post-informed consent expectations and an earlier medical ethos is vivid in an excerpt of the Hippocratic Oath (fifth century B.C.E.): “Conceal most things from the patient… Give necessary orders with cheerfulness and serenity… revealing nothing of the patient’s future or present condition.” Present-day physicians like to think that they treat their patients differently, but recent literature and regulatory reforms may be paddling back a bit on the stringency, demandingness, and universality of informed consent requirements, especially in research.
    step1: |-
      自 1970 年代以来，大量生命伦理学文献关注如何定义并实现“有效”同意——有充分决定能力、知情且自愿的同意——其后数十年间，相关条件（尤其在医学研究中）变得日益苛刻。这些知情同意之后的期望与早先医学伦理气质之间的反差，在《希波克拉底誓言》（公元前五世纪）的一段摘录中十分鲜明：“对病人隐瞒多数事情……愉快而安详地下达必要命令……不透露病人未来或当下的病情。”今日的医生乐于认为自己对待病人的方式已不同，但晚近文献与监管改革或许正在稍微收回知情同意要求的严格性、苛刻性与普遍性，尤其是在研究中。
