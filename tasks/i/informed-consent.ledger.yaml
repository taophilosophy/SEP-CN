      Sometimes, comprehension remains poor despite repeated efforts to elicit comprehension. That can happen because patients are not doing their parts to learn, because some pertinent risks are too complicated to explain effectively, or because some experience and what they would do to us impossible to comprehend in advance, as in so-called transformative experiences,which produce radical change in what we know or in who we are, especially with respect to personal values or core preferences (Paul 2014)[^paul-2014]. When that is the case, is clinical intervention or enlistment in a trial illegitimate, because no autonomous authorization took place (Faden and Beauchamp 1986; Candilis and Lidz 2010)[^candilis-2010][^faden-1986]? Some philosophers respond that it remains legitimate, because by giving candidates the *opportunity* to issue autonomous authorization, investigators do their parts (Sreenivasan 2003)[^sreenivasan-2003], avoid any potential fraud (Millum and Bromwich 2013)[^millum-2013], and treat the candidates fairly (Miller and Wertheimer 2010)[^miller-2010][^miller-2010-2][^wertheimer-2010], conditions that they find sufficient for valid consent. (Indeed, even the permissibility of skipping disclosure when the patient is a medical expert might be taken to indicate that part of the point of informed consent is to prevent fraud (not necessarily to ensure autonomous authorization); fraud is impossible when the patient can easily detect the fraud.) A different response is that consent remains valid so long as the patient or the participant know that their comprehension is poor and accordingly withhold judgement (Keren and Lev 2022)[^keren-2022] or prefer treatment or study participation despite that knowledge (Villiger 2024; Kious, Peterson, and McGuire 2024)[^villiger-2024].
    step1: |-
      有时，尽管反复努力促成理解，理解仍然不佳。这可能因为病人未尽自己学习的本分，因为某些相关风险过于复杂而无法有效解释，或因为某些经验及其对我们会有何影响无法事先理解，如所谓转化性经验——它们使我们的所知或我们是谁发生根本改变，尤其在个人价值或核心偏好方面（Paul 2014）[^paul-2014]。若是如此，临床干预或招募入组试验是否因未发生自主授权而不正当（Faden and Beauchamp 1986; Candilis and Lidz 2010）[^candilis-2010][^faden-1986]？一些哲学家回应说，它仍然正当，因为通过给候选人*机会*作出自主授权，研究者尽了自己的本分（Sreenivasan 2003）[^sreenivasan-2003]，避免了任何潜在欺诈（Millum and Bromwich 2013）[^millum-2013]，并公平对待候选人（Miller and Wertheimer 2010）[^miller-2010][^miller-2010-2][^wertheimer-2010]；他们认为这些条件足以构成有效同意。（的确，即便当病人是医学专家时允许跳过披露，也可被用来说明知情同意的一部分意义在于防止欺诈（未必在于确保自主授权）；当病人能轻易察觉欺诈时，欺诈不可能发生。）另一种回应是：只要病人或参与者知道自己的理解不佳，并据此不作判断（Keren and Lev 2022）[^keren-2022]，或尽管知道仍偏好接受治疗或参与研究（Villiger 2024; Kious, Peterson, and McGuire 2024）[^villiger-2024]，同意就仍然有效。
