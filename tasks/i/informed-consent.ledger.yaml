      Many contemporary writers therefore emphasize that truly informed consent requires much more than mere disclosure, and that the point of disclosure, rather, is the comprehension potentially gained through effective communication (Beauchamp and Childress 2008, 127ff; Manson and O’Neill 2007, e.g., 184–5)[^beauchamp-2008][^manson-2007]. Psychologists and health literacy experts seek effective ways to improve comprehension among patients and candidate study participants (Candilis and Lidz 2010)[^candilis-2010]. And when a patient or a candidate participant is known to understand the relevant information anyhow because she is a physician specializing in the field, intuitively disclosure is unnecessary, evidence that its point is comprehension and hence, perhaps, autonomous decision-making (Beauchamp 2010, 57)[^beauchamp-2010].
    step1: |-
      因此，许多当代作者强调，真正知情的同意远不止于披露；披露的意义倒在于通过有效沟通可能获得的理解（Beauchamp and Childress 2008, 127ff; Manson and O’Neill 2007, e.g., 184–5）[^beauchamp-2008][^manson-2007]。心理学家与健康素养专家寻求有效方式以改善病人与候选参与者的理解（Candilis and Lidz 2010）[^candilis-2010]。而当已知某位病人或候选参与者因是该领域专科医生而本就理解相关信息时，直觉上披露便不必要——这证明披露的意义在于理解，因而也许在于自主决策（Beauchamp 2010, 57）[^beauchamp-2010]。
    step2: |-
      因此，许多当代作者强调，真正知情的同意远不止于披露；披露的意义倒在于通过有效沟通可能获得的理解（Beauchamp and Childress 2008, 127ff; Manson and O’Neill 2007, e.g., 184–5）[^beauchamp-2008][^manson-2007]。心理学家与健康素养专家寻求有效方式以改善病人与候选参与者的理解（Candilis and Lidz 2010）[^candilis-2010]。而当已知某位病人或候选参与者因是该领域专科医生而本就理解相关信息时，直觉上披露便不必要——这证明披露的意义在于理解，因而也许在于自主决策（Beauchamp 2010, 57）[^beauchamp-2010]。
