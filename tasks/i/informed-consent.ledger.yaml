    source: |-
      Even absent own-waivers, and despite absolutist statements of the informed consent requirement, such as the Nuremberg Code, many contemporary theorists agree that there are cases where informed consent procedures are not necessary. The law, and many bioethicists, recognize exceptions to informed consent requirements, such as lack of decision-making capacity, or emergency circumstances where the patient’s wishes are unknown (Tännsjö 1999; Emanuel, Wendler, and Grady 2000)[^tännsjö-1999]. That said, these exceptions serve the spirit of informed consent; they can be plausibly woven into full statements of the requirement (as proposed, for instance, in Dworkin 1988, 117)[^dworkin-1988], and they question only its crudest, most absolutist statements. Other exceptions seem harder to reconcile with full-blown commitment to informed consent and its central justifications. Let us discuss, specifically, the extent to which informed consent is needed in (1) benign care and benign experiments, (2) certain risky experiments, and (3) public health policy. We shall then present the general question, (4) When is informed consent necessary?
    step1: TBD
    step2: TBD
