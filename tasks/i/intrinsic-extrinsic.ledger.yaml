      Given the simplifying assumption that ‘some’ is the only perfectly natural quantifier expression, (3), (17), (Q) and (19) provide the complete account of what it is for a property to be intrinsic according to perfect naturalness account 2.
    step1: TBD
    step2: TBD
  - id: 174
    kind: body
    source: |-
      As with perfect naturalness account 1, perfect naturalness account 2 assumes that each perfectly natural property is intrinsic and that the perfectly natural properties, relations, operators and quantifiers are able to completely describe every possible world. If someone rejects these assumptions, they will therefore be unable to endorse this account.
    step1: TBD
