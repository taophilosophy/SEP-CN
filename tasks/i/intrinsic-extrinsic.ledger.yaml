      Just as being cubical is intuitively a local property, while being an uncle and being such that there is a number are intuitively non-local properties, the former property is intuitively an identity interiority property, while the latter properties are both intuitively not identity interior. (Those that claim that being such that there is a number is a local property, however, are likely to also claim that this property is identity interior. See, for example, Sider (1993a), Eddon (2011), Vallentyne (1997), Hoffman-Kolls (2014) and Francescotti (2014) for the relevant debate.) The identity interior properties, however, plausibly do not coincide with the local properties, since, while being identical to Obama is not a local property, it is plausibly an identity interior property. This is because, necessarily, for any $x$ that is identical to Obama, the state of affairs of $x$ being identical to Obama is plausibly about how $x$ and its parts are and how they are related to each other, as opposed to how they are related to other things and how other things are.
    step1: |-
      正如"是立方体"直观上是局部属性，而"身为叔叔"与"有数存在"直观上是非局部属性，前一属性直观上是一个同一内部性属性，而后两个属性直观上都不是同一内部的。（不过，主张"有数存在"是局部属性的人，很可能也会主张这一属性是同一内部的。相关争论例如见 Sider 1993a、Eddon 2011、Vallentyne 1997、Hoffman-Kolss 2014 与 Francescotti 2014。）然而，同一内部属性可信地不与局部属性重合，因为，虽然"等同于奥巴马"不是局部属性，它却可信地是一个同一内部属性。这是因为：必然地，对任意等同于奥巴马的 $x$，$x$ 等同于奥巴马这一事态可信地关乎 $x$ 及其部分各自之所是以及它们彼此如何相关，而非它们如何与其他事物相关、以及其他事物之所是。
