      In addition to the metaphysical project of determining what it is for a property to be intrinsic, there is an epistemological project of determining how we can come to know with respect to particular properties whether they are intrinsic, and whether such knowledge is possible. To some extent, the metaphysical project of determining what it is to be intrinsic can help with this epistemological project. For example, if it can be shown that being intrinsic can be analysed as the possession of such and such features, and we have knowledge of which properties have such and such features, then we can use this analysis to explain how we can know of particular properties that they are intrinsic. In addition to employing such analyses of intrinsicality, however, we might hope to develop and describe further methods for obtaining justified beliefs regarding what properties are intrinsic. For further discussion that bears on this issue, see McQueen and van Woudenberg 2016.
    step1: |-
      除了确定属性之为内在究竟是什么这一形而上学计划之外，还有一个认识论计划：确定对于特定属性我们如何能知道它们是否是内在的，以及这种知识是否可能。在某种程度上，确定内在之所是的形而上学计划可以帮助这一认识论计划。例如，如果能证明"是内在的"可以分析为具有某某特征，并且我们知道哪些属性具有某某特征，那么我们可以用这一分析来解释我们如何能知道特定属性是内在的。不过，除了运用这类内在性分析之外，我们或许还希望发展并描述进一步的方法，以获得关于哪些属性是内在的证成信念。与这一问题相关的进一步讨论，见 McQueen 与 van Woudenberg 2016。
