  - id: 1
    kind: body
    source: |-
      We have some of our properties purely in virtue of the way we are. (Our mass is an example.) We have other properties in virtue of the way we interact with the world. (Our weight is an example.) The former are the intrinsic properties, the latter are the extrinsic properties. This seems to be an intuitive enough distinction to grasp, and hence the intuitive distinction has made its way into many discussions in philosophy, including discussions in ethics, philosophy of mind, metaphysics, epistemology and philosophy of physics. Unfortunately, when we look more closely at the intuitive distinction, we find reason to suspect that it conflates a few related distinctions, and that each of these distinctions is somewhat resistant to analysis.
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      ## 1. Introduction
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      The standard way to introduce the distinction between intrinsic and extrinsic properties is by the use of a few orientating characterisations. David Lewis provides the following list:
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      > A sentence or statement or proposition that ascribes intrinsic properties to something is entirely about that thing; whereas an ascription of extrinsic properties to something is not entirely about that thing, though it may well be about some larger whole which includes that thing as part. (Lewis 1983a: 197)[^lewis-1983a]
      >
      > A thing has its intrinsic properties in virtue of the way that thing itself, and nothing else, is. Not so for extrinsic properties, though a thing may well have these in virtue of the way some larger whole is … (Lewis 1983a: 197)[^lewis-1983a]
      >
      > If something has an intrinsic property, then so does any perfect duplicate of that thing; whereas duplicates situated in different surroundings will differ in their extrinsic properties. (Lewis 1983a: 197)[^lewis-1983a]
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      The other way to introduce the subject matter is by providing examples of paradigmatic intrinsic and extrinsic properties. One half of this task is easy: everyone agrees that being an uncle is extrinsic, as is being six metres from a rhododendron. The other half is more challenging, since there is much less agreement about which properties are intrinsic. Lewis (1983a, 1986a, 1988), for example, has insisted that shape properties are intrinsic, but one could hold that an object’s shape depends on the curvature of the space in which it is located at, and this might not even be intrinsic to that space (Nerlich 1979)[^nerlich-1979], let alone the object (Bricker 1993, McDaniel 2007, and Skow 2007)[^bricker-1993][^mcdaniel-2007][^skow-2007]. Lewis also mentions charge and internal structure as being examples of intrinsic properties. (For ease of exposition, we will assume below that shape properties are intrinsic. We will also assume that properties like being made of tin, and having a mass of 500kg are intrinsic.)
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      ### 1.1 Philosophical Importance
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      The distinction between intrinsic and extrinsic properties plays an essential role in stating several interesting philosophical problems. Historically, the most prominent of these has to do with notions of intrinsic value. G. E. Moore (1903: §18) noted that we can make a distinction between things that are good in themselves, or possess intrinsic value, and those that are good as a means to other things. To this day there is still much debate over whether this distinction can be sustained (Feldman 1998, Kagan 1998)[^feldman-1998][^kagan-1998], and, if it can, which kinds of things possess intrinsic value (Krebs 1999)[^krebs-1999]. In particular, one of the central topics in contemporary environmental ethics is the question of which kinds of things (intelligent beings, conscious beings, living things, species, etc) might have intrinsic value. While this is the oldest (and still most common) use of the intrinsic/extrinsic distinction in philosophy, it has not played much role in the discussions of the distinction in metaphysics, to which we now turn.
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      As P. T. Geach (1969) noted, the fact that some object $a$ is not $F$ before an event occurs but is $F$ after that event occurs does not mean that the event constitutes, in any deep sense, a change in $a$. To use a well-worn example, at the time of Socrates’s death Xanthippe became a widow; that is, she was not a widow before the event of her husband’s death, but she was a widow when it ended. Still, though that event constituted (or perhaps was constituted by) a change in Socrates, it did not in itself constitute a change in Xanthippe. Geach noted that we can distinguish between real changes, such as what occurs in Socrates when he dies, from mere changes in which predicates one satisfies, such as what occurs in Xanthippe when Socrates dies. The latter he termed ‘mere Cambridge’ change. There is something of a consensus that an object undergoes real change in an event iff there is some **intrinsic** property it instantiated before the event but not afterwards.
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      David Lewis (1986a, 1988) built on this point of Geach’s to mount an attack on **endurantism**, the theory that objects persist by being wholly located at different times, and that there can be strict identity between an object existing at one time and one existing at another time. Lewis argues that this is inconsistent with the idea that objects undergo real change. If the very same object can be both $F$ (at one time) and not $F$ (at another), this means that $F$-ness must be a relation to a time, but this means that it is not an intrinsic property. So any property that an object can change must be extrinsic, so nothing undergoes real change. Lewis says that this argument supports the rival theory of **perdurantism**, which says that objects persist by having different temporal parts at different times. While this argument is controversial (see Haslanger (1989), Johnston (1987) and Lowe (1988) for some responses), it does show how considerations about intrinsicality can resonate within quite different areas of metaphysics.
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      A third major area where the concept of intrinsicality has been put to work is in stating various supervenience theses. Frank Jackson (1998) defines physicalism in terms of duplication and physical duplication, which are in turn defined in terms of intrinsic properties. Similarly, Jaegwon Kim (1982) defines a mind/body supervenience thesis in terms of intrinsic properties. As Theodore Sider (1993) notes, the simplest way to define the **individualist** theory of mental content that Tyler Burge (1979) attacks is as the claim that the content of a thinker’s propositional attitudes supervenes on the intrinsic properties of the thinker. And many **internalist** theories in epistemology are based around the intuition that whether a thinker is justified in believing some proposition supervenes on the intrinsic properties of the thinker.
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      A fourth area where the concept of intrinsically has been employed is to state recombination principles intended to describe what possible states of the world there are. (See Lewis 1986a.)[^lewis-1986a] An initial attempt to state such a principle might be (R1), where $x$ is wholly distinct from $y$ iff $x$ and $y$ have no parts in common. (As is standard in philosophical usage, each thing is counted as a part of itself. Hence, things are not wholly distinct from themselves.)
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      **(R1)**
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      For any properties $p$ and $q$ , it is possible that there are two wholly distinct things, $x$ and $y$, such that $x$ has $p$ and $y$ has $q$.
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      Given an abundant theory of properties according to which each (non-defective) predicate expresses a property, however, (R1) clearly fails, since it isn’t possible for there to be an $x$ and a $y$ such that $x$ has the property of being made of gold, and $y$ has the property of being such that nothing is made of gold. This defect with (R1) can be fixed by replacing (R1) with (R2).
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      **(R2)**
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      For any *intrinsic* properties $p$ and $q$, it is possible that there are two wholly distinct things, $x$ and $y$, such that $x$ has $p$ and $y$ has $q$.
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      While being made of gold and being such that nothing is made of gold refute (R1), they don’t refute (R2), since being such that nothing is made of gold is clearly non-intrinsic.
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      In addition to the above four applications of the distinction between intrinsic and extrinsic properties, the distinction has also been employed for many other purposes. For example, it has been used to formulate principles of universalizability for moral principles and moral laws (Rabinowicz 1979)[^rabinowicz-1979], formulate a requirement on an explanation being a good explanation, namely that it be an intrinsic explanation (Field 1980, Maya 2014)[^field-1980], and formulate a non-trivial version of Mill’s principle of the uniformity of nature (Schlesinger 1990)[^schlesinger-1990]. The distinction (or distinctions definable in terms of it) has also been used to argue against the magical ersatz theory of possible worlds (Lewis 1986a, Sect. 3.4)[^lewis-1986a], defend the transitivity of causation (Hall 2000, Hall 2004)[^hall-2000][^hall-2004], defend the modal theory of essence (Denby 2014)[^denby-2014], argue for the immanent theory of properties (Audi 2019)[^audi-2019], and argue against the thesis that determinable facts are always soley grounded by determinate facts (Shumener 2022)[^shumener-2022].
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      Most of the philosophical applications of intrinsicality are independent of its precise analysis. Work on its analysis, however, has helped clarify these applications by allowing us to distinguish between different notions of intrinsicality and different notions in the vicinity of intrinsicality, and by giving us a greater understanding of these various notions and of what properties satisfy them. A good example of the latter kind of advance is Theodore Sider’s (2003) observation that most of the properties in folk theory are ‘maximal’ and hence not intrinsic properties. This observation provides a strong argument against various theories that appeal to the intuitive intrinsicality of some everyday property.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      ### 1.2 Global and Local
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      In addition to the “global” concept of a property being intrinsic, there is a “local” concept of something having a property in an intrinsic fashion (see Humberstone 1996, p. 206)[^humberstone-1996]. For each of Lewis’s characterisations concerning the concept of an intrinsic property quoted in section 1.1, there is a corresponding characterisation for the concept of a thing having a property in an intrinsic fashion. These are:
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      1. $x$ has $F$ in an intrinsic fashion iff a sentence ascribing $F$ to $x$ is entirely about that thing.
      2. $x$ has $F$ in an intrinsic fashion iff $x$ has $F$ in virtue of how $x$ itself, and nothing else, is.
      3. $x$ has $F$ in an intrinsic fashion iff every duplicate of $x$ has $F$.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      It follows from at least the third of these characterisations that something can have an extrinsic property in an intrinsic fashion. For example, since every duplicate of a piece of tin has the property of being made of tin, every duplicate of a piece of tin also has the extrinsic property of being either made of tin or married. As a result, it follows from the third characterisation that each piece of tin has the property of being either made of tin or married in an intrinsic fashion, despite this property being extrinsic.
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Two plausible principles linking the local and global concepts of intrinsicality are (GTL) and (LTG) (see Humberstone 1996, p. 228)[^humberstone-1996].
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      **(GTL)**
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      If $F$ is an intrinsic property, then it is necessary that every $x$ that has $F$ has $F$ in an intrinsic fashion
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      **(LTG)**
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      If it is necessary that every $x$ that has $F$ has $F$ in an intrinsic fashion, then $F$ is an intrinsic property
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      In addition to the two-place predicate ‘has … in an intrinsic fashion’, we can introduce a modifier ‘intrinsically’, where, adapting one of the characterisations above, $x$ is intrinsically $F$ iff $x$ is $F$ in virtue of how $x$ itself, and nothing else, is. (cf. Humberstone 1996, p. 228)[^humberstone-1996]. This modifier takes predicates as arguments rather than names of properties or variables ranging over properties. Nominalists, who don’t believe in properties, might attempt to use this modifier to capture the intuitive distinctions associated with intrinsicality without committing themselves to properties. For example, a nominalist might claim that a table is intrinsically rectangular, while claiming to consistently hold that there is no property of being rectangular. (For simplicity, we will assume in the following that nominalism is false and that there are abundantly many properties and relations, some of which are intrinsic and some of which are extrinsic.)
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      There might be further reasons to employ either the two place predicate ‘has … in an intrinsic fashion’, or the modifier ‘intrinsically’, rather than the one-place predicate ‘is intrinsic’. For example, one might think that at least one of the former two notions is more fundamental than the latter notion, or that the latter notion is misguided in some way that at least one of the former notions isn’t. (See, for example, Figdor 2008.)[^figdor-2008]
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      ### 1.3 Relations
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      While this article focuses on the distinction between intrinsic and extrinsic one-place properties, it is important to recognize that the distinction between intrinsic and extrinsic also applies to multiple place relations. As in the case of one-place properties, the distinction between intrinsic and extrinsic multiple place relations can be introduced by characterisations and examples. One characterisation is the following:
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      > An $n$-place intrinsic relation is an $n$-place relation that $n$ things stand in in virtue of how they are and how they are related to each other, and not in virtue of anything else; whereas, this is not the case for extrinsic $n$-place relations.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Examples of extrinsic two-place relations include *being as popular as*, and *having the same cousin as*. Possible examples of intrinsic two-place relations include *being 1 m away from* and *being made of the same type of metal as*. (The claim that distance relations like *being 1 m away from* are intrinsic will be denied by philosophers who deny that shape properties are intrinsic.)
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      As well as the global notion of an $n$-place relation being intrinsic, there is the local notion of $n$ things standing in a relation in an intrinsic fashion. A characterisation of this local notion is:
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      > $n$ things stand in a relation $R$ in an intrinsic fashion iff the $n$ things stand in $R$ in virtue of how they are and how they are related to each other, and not in virtue of anything else.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      ## 2. Notions of Intrinsicality
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      A number of different distinctions have been called the intrinsic/extrinsic distinction. As J. Michael Dunn (1990) notes, some authors have used ‘intrinsic’ and ‘extrinsic’ to mean ‘essential’ and ‘accidental’. Dunn is surely right in saying that this is a misuse of the terms. A more interesting distinction is noted by Brian Ellis (1991; discussed in Humberstone 1996: 206)[^humberstone-1996]. (See also Figdor 2008 and Figdor 2014 for a discussion of a related notion of intrinsicality.)[^figdor-2008][^figdor-2014] Ellis suggests we should distinguish between properties that objects have independently of any outside forces acting on them (what we will call the Ellis-intrinsic properties), and those that they have in virtue of those outside forces (the Ellis-extrinsic properties). For many objects (such as, say, a stretched rubber band) their shape will be dependent on the outside forces acting on them, so their shape will be Ellis-extrinsic. If one is committed to the idea that shapes are intrinsic, one should think this means that the distinction between the Ellis-intrinsic and Ellis-extrinsic properties is not the same as the intrinsic/extrinsic distinction. Such a judgement may seem a little hasty, but in any case we will turn now to distinctions that have received more attention in the philosophical literature.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      ### 2.1 Relational vs. Non-Relational Properties
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Many writers, especially in the literature on intrinsic value, use ‘relational’ for the opposite of intrinsic. This seems to be a mistake since many properties seem to be both be relational and intrinsic. For example, most people have the property *having longer legs than arms*, and indeed seem to have this property in an intrinsic fashion, even though the property consists in a certain relation being satisfied. Maybe the property is not intrinsic if whether or not something is an arm or a leg is extrinsic, so perhaps this isn’t a conclusive example, but it seems troubling. And, in any case, there are other examples that can’t be responded to in this way. For example, the property of having a proper part is surely intrinsic, but it also appears to be a relational property.
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      As Humberstone 1996 notes, some might respond by suggesting that a relational property is one such that if an object has it, then it bears some relation to a non-part of it. But this won’t do either. *Not being within a mile of a rhododendron* is clearly relational, but does not consist in bearing a relation to any non-part, as we can see by the fact that a non-rhododendron all alone in a world can satisfy it.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      A further response might be to say that a relational property should be a property that involves a relation that can only relate wholly distinct things, and that, given this construal of a relational property, non-intrinsic properties are relational properties. However, this response faces difficulties also. For example, this account would presumably classify the property of being such that there is a cube as being intrinsic. This property, however, is not intrinsic.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      While the notion of a relational property should be distinguished from the notion of a non-intrinsic property, it might be that the notion of intrinsic properties can be given an account in terms of relationality. One such account due to Francesscotti is discussed in the supplement:
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      [The Relational Account of Intrinsicality](intrinsic-extrinsic.relational-theory.md).
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      ### 2.2 Local vs. Non-Local Properties
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      We now turn to the notion of intrinsicality characterised by the characterisations listed in section 1. Or perhaps better, we now turn to the *notions* of intrinsicality characterised by these characterisations, since, while Lewis thought that each of these characterisations characterise a single notion of intrinsically, it is plausible that they characterise different notions. In this subsection, we will discuss the notion characterised by the first characterisation which involves aboutness. In the next two subsections, we will discuss the notions characterised by the other two characterisations.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Lewis’s first characterisation is:
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      > A sentence or statement or proposition that ascribes intrinsic properties to something is entirely about that thing; whereas an ascription of extrinsic properties to something is not entirely about that thing, though it may well be about some larger whole which includes that thing as part. (Lewis 1983a: 111–2)[^lewis-1983a]
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      The notion of aboutness employed in this characterisation is plausibly that of *intrinsic aboutness*, where intrinsic aboutness can be intuitively characterised by (1).
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      **(1)**
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      A state of affairs $s$ is intrinsically about a thing $x$ iff $s$ (either truly or falsely) describes how $x$ and its parts are and how they are related to each other, as opposed to how $x$ and its parts are related to other things and how other things are.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      Using the notion of intrinsic aboutness, Lewis’s first characterisation can be more precisely stated by the schema (2).
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      **(2)**
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      The property of being $F$ is intrinsic iff, necessarily, for any $x$, the state of affairs of $x$ being $F$ is intrinsically about $x$.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      For any predicate $F$ expressing a property $p$, and any name $n$ referring to an $x$, define the ascription of $p$ to $x$ to be the state of affairs expressed by $\ulcorner Fn\urcorner$. Using this definition, we can replace the schema (2) with the sentence (3).
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      **(3)**
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      For any property $p, p$ is intrinsic iff, necessarily, for any $x$, the ascription of $p$ to $x$ is intrinsically about $x$.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      (3) plausibly classifies *being a cube* as intrinsic, since, for any $x$, the state of affairs of $x$ being a cube plausibly describes how $x$ and its parts are and how they are related to each other, as opposed to how they are related to other things and how other things are. In contrast, (3) plausibly classifies *being an uncle* as non-intrinsic, since its ascription to a thing is not only about how it and its parts are and how they are related to each other, but also about how it is related to things outside of it. (3) also plausibly classifies being Obama as non-intrinsic since the ascription of being Obama to Clinton, namely the state of affairs of Obama being identical to Clinton, is not wholly about Clinton, but is also about Obama. Finally, (3) also appears to classify being such that there is a number as non-intrinsic, even if it is necessary that there are numbers. This is because the ascription of this property to Clinton, namely the state of affairs that Clinton is such that there is a number, appears to be not wholly about how Clinton is, but is also about how things wholly distinct from Clinton are. (We will assume that the intuition underlying this judgement is correct. However, this is not uncontroversial. See Sider 1996 for a rejection of a closely related intuition and Eddon 2011 for a reply to this rejection.)[^eddon-2011]
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      In the following, we will call the properties classified as intrinsic by (3) *local* properties, and call the properties classified by (3) as not intrinsic *non-local* properties. (This notion of a local property needs to be distinguished from the local conception of something having a property in an intrinsic fashion discussed in section 1.2.)
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      ### 2.3 Interior vs. Exterior Properties
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      The second characterisation listed in the quote by Lewis in section 1 was “A thing has its intrinsic properties in virtue of the way that thing itself, and nothing else, is”.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      This characterisation can be stated more precisely by schema (4), where ‘how $x$ is intrinsically’ abbreviates ‘how $x$ and its parts are and how they are related to each other, as opposed to how $x$ and its parts are related to other things and how other things are’.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      **(4)**
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Being $F$ is intrinsic iff, necessarily, for any $x$, if $x$ is $F$ then $x$ is $F$ in virtue of how $x$ is intrinsically.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      Call the properties that are classified as intrinsic by (4) *interior* properties, and call the properties that are classified as non-intrinsic by (4) *exterior* properties. An important question is what meaning ‘in virtue’ is meant to have in (4). One possible answer is that it is meant to have a reading corresponding to metaphysical grounding, where metaphysical grounding is the relation that stands to metaphysical explanation as causation stands to causal explanation. Under such a reading of ‘in virtue’, (5) is necessarily true.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      **(5)**
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      ‘$\varphi$ in virtue of it being the case that $\phi$’ is true iff the state of affairs expressed by $\phi$ metaphysically grounds the state of affairs expressed by $\varphi$.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      While it might be initially appealing to think that ‘in virtue’ in (4) expresses metaphysical grounding, Marshall 2015 has given an argument that (4) fails to characterise a notion of intrinsicality when ‘in virtue’ has this reading. The argument relies on (6) being necessarily true and (7) being true on any notion of intrinsicality.
    step1: TBD
    step2: TBD
