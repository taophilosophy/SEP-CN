      ### 3.3 Non-Disjunctivity Theories
    step1: TBD
    step2: TBD
  - id: 176
    kind: body
    source: |-
      Instead of analysing intrinsicality in terms of perfect naturalness, one might try to analyse it in terms of non-disjunctivity, where non-disjunctivity is regarded as an objective metaphysical feature of properties rather than merely a syntactical feature of predicates. The most prominent attempt to do this is the account of Langton and Lewis 1998. (A similar theory is in an appendix to Zimmerman 1997.)[^zimmerman-1997]
    step1: TBD
    step2: TBD
  - id: 177
    kind: body
    source: |-
      Langton and Lewis’s account involves the following three steps. First, they analyse the non-disjunctive properties as follows:
    step1: TBD
    step2: TBD
  - id: 178
    kind: body
    source: |-
      > [T]he *disjunctive* properties [are] those properties that can be expressed by a disjunction of (conjunctions of) natural properties; but that are not themselves natural properties. (Or, if naturalness admits of degrees, they are much less natural than the disjuncts in terms of which they can be expressed.) (Langton and Lewis 1998: 61, author’s emphasis)[^langton-1998]
    step1: TBD
    step2: TBD
  - id: 179
    kind: body
    source: |-
      Secondly, they say a property is *basic intrinsic* iff it is non-disjunctive, is not the negation of a disjunctive property, and is independent of accompaniment. Finally, they say that (i) two objects are duplicates iff they share the same basic intrinsic properties, and (ii) $F$ is an intrinsic property iff two duplicates never differ with respect to it.
    step1: TBD
    step2: TBD
  - id: 180
    kind: body
    source: |-
      The last step of their account is in a form that requires Lewis’s concretist theory of possible worlds. The last step in a form suitable for a typical abstractionist theory of possible worlds is instead:
    step1: TBD
    step2: TBD
  - id: 181
    kind: body
    source: |-
      1. $x$ at $u$ is a duplicate of $y$ at $v$ iff, for any basic intrinsic property $P, x$ has $P$ at $u$ iff $y$ has $P$ at $v$; and
      2. $F$ is intrinsic iff, for any $x$ and $y$, and for any possible worlds $u$ and $v$ such that $x$ at $u$ is a duplicate of $y$ at $v, x$ has $F$ at $u$ iff $y$ has $F$ at $v$.
    step1: TBD
    step2: TBD
  - id: 182
    kind: body
    source: |-
      Note that (ii) is just the abstractionist version of the duplication characterisation for intrinsicality given by (13) in section 2.4.
    step1: TBD
    step2: TBD
  - id: 183
    kind: body
    source: |-
      Langton and Lewis claim their account works given a variety of ways of understanding ‘natural’ and ‘more natural than’ in their analysis of ‘non-disjunctive’. In particular, they hold that the account will work if ‘natural’ is understood to express the notion of perfect naturalness, or fundamentality, in the Lewis (1986a) account, and ‘more natural than’ is understood to mean ‘is more fundamental than’. They also claim that the account will work if the natural properties are those taken to correspond to Armstrongian universals, or the properties expressed by the predicates in canonical formulations of physics, or the properties expressed by the predicates in canonical formulations of common-sense. Langton and Lewis say that it should not matter how we draw the distinction between natural and non-natural properties for present purposes, as long as we have it, and properties like *being lonely and round or accompanied and cubical* are not natural. As a result of this, Langton and Lewis think that their account is more neutral than Lewis’s earlier account and should therefore should appeal to a larger range of philosophers than the earlier account.
    step1: TBD
    step2: TBD
  - id: 184
    kind: body
    source: |-
      Langton and Lewis put forward their account as only an analysis of qualitative intrinsic properties, rather than intrinsic properties in general. Their account, however, arguably fails as an account of qualitative identity interior properties since, given numbers necessarily exist, it classifies being such that there is a number as intrinsic. Therefore, like the Lewis 1986a account, the Langton and Lewis account is arguably most charitably interpreted as an account of duplication preservation, or perhaps of qualitative metaphysical necessitation interiority.
    step1: TBD
    step2: TBD
  - id: 185
    kind: body
    source: |-
      In addition to failing to give an account of the standard account of intrinsicality, there are reasons to think that Langton and Lewis cannot be as neutral as they claim to be regarding what account of naturalness is combined with their account. As noted above, Langton and Lewis claim that their account of intrinsicality is compatible with any construal of naturalness on which the natural properties are those that play a special role in our thinking. On one such conception of naturalness, the natural properties include those properties for which we have simple words or concepts, which do not strike us as strange or odd, and on which we have relied in past inductions (Sider 2001: 362)[^sider-2001]. Given this conception of naturalness, the property of being a rock is a natural property, and hence is classified as intrinsic on the Langton and Lewis account. However, as Sider 2001 argues, being a rock is plausibly not an intrinsic property. Just as an object that is qualitatively intrinsically the same as a house and is a large part of a house is not itself a house, an object that is qualitatively intrinsically the same as a rock and is a large part of a rock is not itself a rock. Hence, whether something is a rock is partly a matter of what is the case outside of it. Hence, contra the combination of the Langton and Lewis account with the above conception of naturalness, being a rock is not intrinsic.
    step1: TBD
    step2: TBD
  - id: 186
    kind: body
    source: |-
      Another objection to the Langton and Lewis account is that there appear to be counterexamples to the account, even given Lewis’s favoured conception of naturalness. On this conception, the perfectly natural properties and relations are the fundamental properties and relations, and a property $p$ is more natural than a property $q$ iff the shortest definition of $p$ in terms of the perfectly natural properties and relations is shorter than the shortest definition of $q$ in terms of the perfectly natural properties and relations. (See (Lewis 1986: 61).) As Marshall and Parsons 2001 argue, given this construal of naturalness, the property of being such that there is a cube appears to be neither a disjunctive property nor the negation of a disjunctive property according to Langton and Lewis’s account of disjunctivity. If this is the case, however, then, since being such that there is a cube is independent of accompaniment, the Langton and Lewis account classifies this property as a basic intrinsic property, and hence classifies it as an intrinsic property. This property, however, is clearly not intrinsic.
    step1: TBD
    step2: TBD
  - id: 187
    kind: body
    source: |-
      Langton and Lewis 2001 have responded to this objection by claiming that being such that there is a cube is less natural than both being a cube and being accompanied by a cube, since (I) being such that there is a cube can be expressed as the disjunction ‘being either a cube or accompanied by a cube’, (II) disjoining unrelated properties always reduces naturalness, and (III) being a cube and being accompanied by a cube are unrelated properties. One problem with this response is that it is not obvious why (II) is meant to be true given Lewis’s favoured conception of naturalness above, or what other notion of naturalness it might be true of. A second problem with the response is that, even granting (II) is true, it is not clear what it is for two properties to be unrelated in the sense that is at issue in (II), and hence it is not clear why being a cube and being accompanied by a cube are meant to be unrelated. For further discussion of attempts to analyse intrinsicality in terms of non-disjunctivity, see the supplementary document:
    step1: TBD
    step2: TBD
  - id: 188
    kind: body
    source: |-
      [More on Non-Disjunctive Theories](intrinsic-extrinsic.non-disjunctive.md).
    step1: TBD
    step2: TBD
