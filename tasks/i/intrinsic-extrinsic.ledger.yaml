      Given philosophers typically use ‘intrinsic’ to express some notion of interiority, there are several reasons to think that the notion of interiority they typically express is that of identity interiority. First, identity interiority is more fundamental, or simpler, than the other notions of interiority, and philosophers are often interested in employing more fundamental notions than less fundamental notions. Second, the intrinsic properties of a thing should be the properties that thing has “in itself”, rather than merely the properties that are metaphysically necessitated, or nomically necessitated, or metaphysically explained, by the properties the thing has “in itself”. But this suggests that the intrinsic properties should be the identity interior properties, rather than the metaphysical necessitation interior properties, or the nomic necessitation interior properties, or the weak grounding interior properties. Finally, while the identity interiority of necessarily coextensive properties can intuitively differ, this is not true for at least some of the other notions of interiority, such as metaphysical necessitation interiority and nomic necessitation interiority. (Properties $p$ and $q$ are necessarily coextensive iff, necessarily, for any $x$, $x$ has $p$ iff $x$ has $q$.) Since it is a widespread intuition that necessarily coextensive properties can differ in whether they are intrinsic, this suggests these other notions of interiority aren’t what philosophers typically express by ‘intrinsic’. (This last reason also provides a further reason to think that duplication preservation isn’t the notion of intrinsicality philosophers typically employ, since it also does not differ among necessarily equivalent properties.)
    step1: |-
      既然哲学家通常用"内在的"表达某种内部性概念，有若干理由认为他们通常表达的正是同一内部性。第一，同一内部性比其他内部性概念更基本（或更简单），而哲学家通常更关心运用更基本的概念而非较不基本的概念。第二，一个事物的内在属性应当是该事物"就其自身"而具有的属性，而不只是由该事物"就其自身"而具有的属性所形而上学必然化、律则必然化或形而上学地解释出来的属性。但这提示：内在属性应当是同一内部属性，而非形而上学必然化内部属性、律则必然化内部属性或弱奠基内部属性。最后，虽然必然共延属性的同一内部性可以直观地有所不同，这对至少某些其他内部性概念并不成立，例如形而上学必然化内部性与律则必然化内部性。（属性 $p$ 与 $q$ 必然共延，当且仅当必然地，对任意 $x$，$x$ 具有 $p$ 当且仅当 $x$ 具有 $q$。）既然"必然共延属性可以在是否内在上有所不同"是一个广泛持有的直觉，这就提示：这些其他内部性概念并不是哲学家通常用"内在的"所表达的东西。（最后这条理由也提供了进一步的根据，认为复制保持不是哲学家通常运用的内在性概念，因为复制保持在必然等价的属性之间也不有所不同。）
