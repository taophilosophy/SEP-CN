      ### 3.2 Perfect Naturalness Theories
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      The most influential attempt to analyse intrinsicality over the last 30 years has arguably been Lewis’s 1986a account of intrinsicality in terms of perfect naturalness.
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      The perfectly natural properties and relations are the fundamental properties and relations. Lewis wrote:
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      > Sharing of [the perfectly natural properties] makes for qualitative similarity, they carve at the joints, they are intrinsic, they are highly specific, the set of their instances are ipso facto not entirely miscellaneous, there are only just enough of them to characterise things completely and without redundancy. Physics has its short list of ‘fundamental physical properties’: the charges and masses of particles, also their is so-called ‘spins’ and ‘colours’ and ‘flavours’, and maybe a few more that have yet to be discovered. (Lewis 1986b, p. 60, author’s emphasis)[^lewis-1986b]]
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      The notion of a perfectly natural, or fundamental, property or relation suggests an appealing approach to analysing intrinsicality. Consider the non-intrinsic property of being an uncle. It is appealing to think that the reason this property fails to be intrinsic is that it can be analysed in terms of more fundamental relations, such as being a sibling of and being a child of, in a manner that reveals how something being an uncle is at least partially a matter of how it is related to things that aren’t part of it. In particular, it is plausible to think that the reason being an uncle is non-intrinsic is that for $x$ to be an uncle is for $x$ to have a sibling that has a child, where this child fails to be part of $x$. More generally, it is plausible that, if being $F$ is a non-intrinsic property, then the fact that it is non-intrinsic can be revealed by analysing being $F$ in terms of more fundamental properties and relations in a manner that reveals how something being $F$ may partly be a matter of being related to a non-part or may be partly a matter of how non-parts are. If this is true, then it has the following two consequences. First, it follows that every fundamental property is intrinsic, since it being non-intrinsic cannot be revealed by analysis in terms of more fundamental properties and relations. Secondly, and even more importantly, it follows that whether a property is intrinsic should be analysable in terms of how that property can be analysed in terms of the fundamental properties and relations.
    step1: TBD
    step2: TBD
  - id: 149
    kind: body
    source: |-
      Lewis in effect adopts the above approach to analysing intrinsicality by analysing intrinsicality in terms of a particular kind of supervenience on the fundamental properties and relations. Lewis’s 1986 account (formulated so as to be compatible with standard abstractionist theories of possible worlds) consists of (15) and (16).
    step1: TBD
    step2: TBD
  - id: 150
    kind: body
    source: |-
      **(15)**
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      $p$ is an intrinsic property iff (i) $p$ is a property, and (ii) for any $x$ and $y$, and for any worlds $w_1$ and $w_2$ such that $x$ at $w_1$ is a duplicate of $y$ at $w_2$, $x$ has $p$ at $w_1$ iff $y$ has $p$ at $w_2$.
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      **(16)**
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      $x$ at $w_1$ is a duplicate of $y$ at $w_2$ iff there is a one-to-one correspondence $f$ between $x$’s parts at $w_1$ and $y$’s parts at $w_2$ such that, for any perfectly natural property or relation $R$, for any $x_1, x_2,\ldots$ that are part of $x$ at $w_1$: $x_1, x_2\ldots$ stand in $R$ at $w_1$ iff $f(x_1), f(x_2)\ldots$ stand in $R$ at $w_2$.
    step1: TBD
    step2: TBD
  - id: 154
    kind: body
    source: |-
      Lewis’s account, which I will call perfect naturalness account 1, is best seen as an attempt at analysing duplication preservation, rather than as analysing identity interiority which we argued in section 2.5 is the dominant notion of intrinsicality in philosophy. This account rests heavily on the claim that all perfectly natural properties are intrinsic, and, implicitly, that the perfectly natural properties and relations are sufficient to characterise the world completely. The last assumption is needed because the theory rules out the possibility that there are two things that share all their perfectly natural properties and lack proper parts, but differ with respect to some of their intrinsic properties.
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      The first assumption that all perfectly natural properties are intrinsic has been rejected by Weatherson (2006). (See also Yablo 1999 who holds that, even if every perfectly natural property is intrinsic, this fact is at best a lucky accident and that this renders Lewis’s account unsuccessful as a philosophical account of intrinsicality.)[^yablo-1999] Weatherson claims that it is metaphysically possible for the instantiated perfectly natural properties to be vector properties. He then argues that, since vector properties must be extrinsic, it follows that at least some perfectly natural properties fail to be intrinsic, namely the perfectly natural properties instantiated at such worlds. The claim that vector properties need to be extrinsic, however, is highly contentious. It is natural to understand a vector property to be a property that is usefully represented for theoretical purposes by a certain kind of mathematical object, namely a vector. Given this construal, however, there is no reason to think that vector properties cannot be intrinsic. For example, due to the similarity relationships between colours represented by the colour solid it might be useful to represent colours by vectors. However, doing this is compatible with metaphysical theories of colour on which colours are intrinsic. There might be other conceptions of being a vector property on which vector properties cannot be intrinsic. However, it is unclear whether there an conception of vector properties on which they cannot be intrinsic but can be fundamental. (See Busse (2009) and Marshall (2016b) for more discussion.)
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      The second assumption, that the perfectly natural properties and relations are sufficient to characterise each possible world, has been rejected by Sider (1995) and Schaffer (2004). Both claim that it is metaphysically possible for there to be endless sequences of more and more natural properties, without any set of perfectly natural properties out of which all the other properties can be defined. In response to this problem, Sider (1993b) has proposed a modification of Lewis’s account which he claims is consistent with there being such endless sequences of more and more natural properties. Sider (2011) and Marshall (2016b) have recently argued in favour of the second assumption, with Sider’s argument appealing to his Humean theory of metaphysical possibility.
    step1: TBD
    step2: TBD
  - id: 157
    kind: body
    source: |-
      As noted above, Lewis’s account fails to provide an account of identity interiority, which is the most standard notion of intrinsicality, and at best provides an analysis of duplication preservation. Marshall 2016b has recently provided an account in terms of perfect naturalness that, if successful, does provide an analysis of identity interiority. If this account works, it can also be modified to provide analyses of the other notions of intrinsicality described in section 2.4.
    step1: TBD
    step2: TBD
  - id: 158
    kind: body
    source: |-
      The basic idea behind this alternative account of intrinsicality, which I will call perfect naturalness account 2, is that the ascription of a property to a thing is intrinsically about that thing iff the ascription can be expressed in fundamental terms while only referring to, and quantifying over, the parts of $x$. (A similar account is briefly sketched in Skow 2007, p. 112.)[^skow-2007] In more detail, perfect naturalness account 2 first analyses intrinsicality in terms of intrinsic aboutness by (3).
    step1: TBD
    step2: TBD
  - id: 159
    kind: body
    source: |-
      **(3)**
    step1: TBD
    step2: TBD
  - id: 160
    kind: body
    source: |-
      $p$ is intrinsic iff, necessarily, for any $x$, the ascription of $p$ to $x$ is intrinsically about $x$.
    step1: TBD
    step2: TBD
  - id: 161
    kind: body
    source: |-
      It then provides an account of intrinsic aboutness in terms of perfect naturalness and qualitivity by (17), where qualitivity is analysed by (Q). (In (17) and (Q), perfectly natural operators and quantifiers are fundamental operators and quantifiers.)
    step1: TBD
    step2: TBD
  - id: 162
    kind: body
    source: |-
      **(17)**
    step1: TBD
    step2: TBD
  - id: 163
    kind: body
    source: |-
      $s$ is intrinsically about $x$ iff $s$ is a non-qualitative state of affairs that can be expressed by a sentence $\phi$ containing at most brackets, commas, lambda abstractors, names referring to parts of $x$, predicates expressing perfectly natural properties and relations, operator expressions expressing perfectly natural operators, and quantifier expressions that express perfectly natural quantifiers and whose occurrences in $\phi$ quantify only over parts of $x$.
    step1: TBD
    step2: TBD
  - id: 164
    kind: body
    source: |-
      **(Q)**
    step1: TBD
    step2: TBD
  - id: 165
    kind: body
    source: |-
      $p$ is a qualitative property iff $p$ is a property, and $p$ can be expressed by a predicate containing at most brackets, commas, variables, lambda abstractors, predicates expressing perfectly natural relations, quantifier expressions expressing perfectly natural quantifiers, and operator expressions expressing perfectly natural operators.
    step1: TBD
    step2: TBD
  - id: 166
    kind: body
    source: |-
      (17) entails that any state of affairs that is intrinsically about something is non-qualitative. This consequence of (17) can be justified by noting that, if $s$ is intrinsically about $x$, then there must be at least one particular thing that it is about, and hence it cannot be a qualitative state of affairs.
    step1: TBD
    step2: TBD
  - id: 167
    kind: body
    source: |-
      (17), as it stands, fails to provide a completely specified account of intrinsic aboutness, since it contains the locution ‘quantifies only over parts of $x$’ which needs to be defined, and giving the needed definition is not straightforward. The account of ‘quantifying over parts of $x$’ given by perfect naturalness account 2 can be simplified if we assume that ‘some’ expresses the only perfectly natural quantifier. Say that a property $p$ necessitates a property $q$ iff, necessarily, for any $x$, if $x$ has $p$ then $x$ has $q$. If $\Phi$ is a set of formulas, let $\bigvee\Phi$ be the disjunction of the formulas in $\Phi$. (So $\bigvee\{\phi_1 , \phi_2,\ldots\}$ = $\ulcorner\phi_1 \vee \phi_2 \vee\ldots\urcorner$.) Given these definitions and the above simplifying assumption, perfect naturalness account 2 endorses (18), where $F$ and $G$ are predicates expressing properties and ‘$\leq$’ symbolises ‘is part of’.
    step1: TBD
    step2: TBD
  - id: 168
    kind: body
    source: |-
      **(18)**
    step1: TBD
    step2: TBD
  - id: 169
    kind: body
    source: |-
      The initial occurrence of ‘Some’ in $\ulcorner [\text{Some } v|Fv]Gv\urcorner$ quantifies only over parts of $x$ iff, for any set $\Pi $ of names of all the parts of $x$, the property expressed by $F$ necessitates the property expressed by $\ulcorner\lambda v\bigvee\{\ulcorner v\leq a\urcorner \mid a\in\Pi\}\urcorner$.
    step1: TBD
    step2: TBD
  - id: 170
    kind: body
    source: |-
      For example, according to this account, if $d$ has exactly three proper parts (which are $a$, $b$ and $c$), then ‘some’ in ‘[Some $v \mid Fv](Gv)$’ quantifies only over parts of $d$ iff the property of being $F$ necessitates the property of being part of either $a$, $b$, $c$ or $d$ (that is, iff, necessarily, any thing that is $F$ is part of either $a$, $b$, $c$ or $d$). More generally, this account endorses (19).
    step1: TBD
    step2: TBD
  - id: 171
    kind: body
    source: |-
      **(19)**
    step1: TBD
    step2: TBD
  - id: 172
    kind: body
    source: |-
      For any formulas $\phi$ and $\psi$, the initial occurrence of ‘Some’ in $\ulcorner [\text{Some }v\mid \phi]\psi\urcorner$ quantifies only over parts of $x$ iff, for any set $\Pi$ of names of all the parts of $x$, under any assignment $g$ to the free variables in $\phi$ that are not $v$, the property expressed by $\ulcorner\lambda v\phi\urcorner$ necessitates the property expressed by $$\begin{align} \ulcorner\lambda v\big( \bigvee\{\ulcorner v\leq u \urcorner \mid u& \text{ is a free variable in } \phi \text{ that is not } v\} \\ &\vee \bigvee\{\ulcorner v\leq a\urcorner \mid a\in\Pi\}\urcorner. \end{align}$$
    step1: TBD
    step2: TBD
  - id: 173
    kind: body
