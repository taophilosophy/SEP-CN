      Philosophers who instead endorse standard abstractionist theories of possible worlds, however, can’t accept (12). According to standard abstractionist theories of possible worlds, possible worlds do not contain concrete entities such as 500 kg men as parts. According to standard abstractionists, then, there are no 500 kg men, there are only possible worlds that represent that there are 500 kg men. Philosophers who endorse standard abstractionist theories of possible worlds, however, can replace (12) with (13) (see Moore 1922 and Francescotti 1999)[^francescotti-1999][^moore-1922]. (Or at least, they can replace (12) with (13) given they hold that there are things that exist according to non-actual possible worlds that don’t exist according to the actual world. Abstractionists who deny this will have to further modify (13).)
