      > 如果某物具有一个内在属性，那么该物的任何完全复本亦然；而处于不同环境中的复本，则会在外在属性上有所不同。（Lewis 1983a: 197）[^lewis-1983a]
  - id: 5
    kind: body
    source: |-
      The other way to introduce the subject matter is by providing examples of paradigmatic intrinsic and extrinsic properties. One half of this task is easy: everyone agrees that being an uncle is extrinsic, as is being six metres from a rhododendron. The other half is more challenging, since there is much less agreement about which properties are intrinsic. Lewis (1983a, 1986a, 1988), for example, has insisted that shape properties are intrinsic, but one could hold that an object’s shape depends on the curvature of the space in which it is located at, and this might not even be intrinsic to that space (Nerlich 1979)[^nerlich-1979], let alone the object (Bricker 1993, McDaniel 2007, and Skow 2007)[^bricker-1993][^mcdaniel-2007][^skow-2007]. Lewis also mentions charge and internal structure as being examples of intrinsic properties. (For ease of exposition, we will assume below that shape properties are intrinsic. We will also assume that properties like being made of tin, and having a mass of 500kg are intrinsic.)
    step1: |-
      引入这一主题的另一方式，是提供范例性的内在属性与外在属性的例子。这项任务的一半是容易的：人人都同意，身为叔叔是外在的，距一株杜鹃花六米亦然。另一半则更具挑战，因为关于哪些属性是内在的，共识要少得多。例如，刘易斯（Lewis 1983a, 1986a, 1988）坚持认为形状属性是内在的，但人们也可以主张，一个对象的形状依赖于它所位于其中的空间的曲率，而这种曲率甚至可能不是该空间本身的内在属性（Nerlich 1979）[^nerlich-1979]，更不用说该对象的了（Bricker 1993、McDaniel 2007 与 Skow 2007）[^bricker-1993][^mcdaniel-2007][^skow-2007]。刘易斯还提到电荷与内部结构作为内在属性的例子。（为便于论述，下文将假定形状属性是内在的。我们还将假定，由锡制成、具有 500 千克的质量这类属性是内在的。）
    step2: |-
      引入这一主题的另一方式，是给出范例性的内在属性与外在属性各是什么的例子。这项任务的一半是容易的：人人都同意，身为叔叔是外在的，距一株杜鹃花六米亦是如此。另一半则更具挑战，因为关于哪些属性是内在的，共识要少得多。例如，刘易斯（Lewis 1983a, 1986a, 1988）坚持认为形状属性是内在的；但人们也可以主张，一个对象的形状依赖于它所处空间的曲率，而这种曲率甚至可能不是该空间本身的内在属性（Nerlich 1979）[^nerlich-1979]，更不用说该对象的了（Bricker 1993、McDaniel 2007 与 Skow 2007）[^bricker-1993][^mcdaniel-2007][^skow-2007]。刘易斯还提到电荷与内部结构作为内在属性的例子。（为便于论述，下文将假定形状属性是内在的。我们还将假定，由锡制成、具有 500 千克的质量这类属性是内在的。）
