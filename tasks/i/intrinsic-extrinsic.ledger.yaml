      > A sentence or statement or proposition that ascribes intrinsic properties to something is entirely about that thing; whereas an ascription of extrinsic properties to something is not entirely about that thing, though it may well be about some larger whole which includes that thing as part. (Lewis 1983a: 197)[^lewis-1983a]
      >
      > A thing has its intrinsic properties in virtue of the way that thing itself, and nothing else, is. Not so for extrinsic properties, though a thing may well have these in virtue of the way some larger whole is … (Lewis 1983a: 197)[^lewis-1983a]
      >
      > If something has an intrinsic property, then so does any perfect duplicate of that thing; whereas duplicates situated in different surroundings will differ in their extrinsic properties. (Lewis 1983a: 197)[^lewis-1983a]
    step1: |-
      > 把内在属性归予某物的句子、陈述或命题，完全是关于该物的；而把外在属性归予某物的归予，则不完全是关于该物的，尽管它很可能是关于某个以该物为部分的整体的。（Lewis 1983a: 197）[^lewis-1983a]
      >
      > 一个事物具有其内在属性，是凭借该事物自身、且仅凭该事物自身之所是；外在属性则不然，尽管事物很可能是凭某个更大整体之所是而具有这些属性……（Lewis 1983a: 197）[^lewis-1983a]
      >
      > 如果某物具有一个内在属性，那么该物的任何完全复本（perfect duplicate）亦然；而处于不同环境中的复本，则会在外在属性上有所不同。（Lewis 1983a: 197）[^lewis-1983a]
    step2: |-
      > 把内在属性归予某物的句子、陈述或命题，完全是关于该物的；而把外在属性归予某物的归予，则不完全是关于该物的，尽管它很可能是关于某个以该物为部分的整体的。（Lewis 1983a: 197）[^lewis-1983a]
      >
