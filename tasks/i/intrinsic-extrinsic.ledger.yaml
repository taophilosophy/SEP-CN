      There are therefore reasons to think that the notion philosophers typically use ‘intrinsic’ to express is identity interiority. These reasons, however, are not decisive. First, philosophers often take intrinsic properties to be qualitative, and use ‘intrinsic’ to distinguish only among qualitative properties. (See Sider 1996.) Since each local property and each duplication preserving property is qualitative, but this is not true for interior properties, this possibly suggests that at least some philosophers at least some of the time use ‘intrinsic’ to express either locality or duplication preservation. Secondly, while identity interiority can do much of the theoretical work intrinsicality is meant to do, it arguably cannot do all of it, with some of this work being better done by some of the other notions of intrinsicality described above. For example, Sider (1996) has argued that duplication preservation is better able to be used to define individualism about mental states than identity interiority. Finally, the failure of many philosophers to clearly distinguish which notion of intrinsicality they are employing provides at least some reason to suspect that those philosophers have often used ‘intrinsic’ indeterminately to express a multiplicity of notions of intrinsicality.
