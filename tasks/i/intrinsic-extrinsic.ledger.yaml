      As Langton and Lewis (1998) point out, however, this strengthened analysis still fails (see also Lewis 1983a)[^lewis-1983a]. Given intrinsic properties, such as being a cube, are independent of accompaniment, the extrinsic property of being either a lonely cube or an accompanied non-cube is also independent of accompaniment. Hence, provided the strengthened analysis correctly classifies *being a cube* as intrinsic, it will falsely classify *being either a lonely cube or an accompanied non-cube* as intrinsic.
    step1: |-
      然而，正如 Langton and Lewis 1998 指出的，这一强化后的分析仍然失败（另见 Lewis 1983a）[^lewis-1983a]。既然内在属性（如"是立方体"）独立于有伴，外在属性"是孤立的立方体或有伴的非立方体"也独立于有伴。于是，只要强化后的分析正确地把"是立方体"归为内在的，它就会错误地把"是孤立的立方体或有伴的非立方体"归为内在的。
    step2: |-
