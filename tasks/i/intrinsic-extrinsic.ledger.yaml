      applies to $q_1$, it also applies to $q_2$. Hence, the reductio assumption is false, and there is no broadly logical analysis of intrinsicality. This argument can easily be adapted to show that there is no broadly logical analysis of intrinsicality given more realistic assumptions about what possible worlds there are.
