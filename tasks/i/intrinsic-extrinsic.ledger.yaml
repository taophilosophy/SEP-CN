      In the face of this failure, we might still hope that a yet more sophisticated broadly logical analysis might succeed. An argument due to Marshall 2009 and Parsons 2001, however, shows that, given standard views about what is possible, and given the absence of special assumptions about the abundance and structure of properties, no such analysis can be given. This argument considers the intrinsic property of being an electron and the extrinsic property of being either an accompanied electron or a lonely positron. It then shows that, given certain common views about properties and possibility, these properties have the same pattern of instantiation through logical, mereological and set-theoretic space. Since formulas containing only broadly logical expressions cannot distinguish between properties having the same such pattern, it then follows that no broadly logical analysis of intrinsically is possible.
    step1: |-
      面对这一失败，我们或许仍希望某种更精巧的广义逻辑分析能够成功。然而，一个出自 Marshall 2009 与 Parsons 2001 的论证表明：在关于何者为可能的标准观点下，且在对属性的丰富性与结构性缺乏特殊假设的情况下，这样的分析无法给出。该论证考察内在属性"是电子"与外在属性"是有伴电子或孤立正电子"。它进而表明：在关于属性与可能性的某些通行观点下，这两个属性在逻辑、分体论与集合论空间中具有相同的实例化模式。既然只含广义逻辑表达式的公式无法区分具有相同模式的属性，由此可得：内在性的广义逻辑分析是不可能的。
    step2: |-
