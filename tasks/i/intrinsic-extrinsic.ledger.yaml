      Another objection to the Langton and Lewis account is that there appear to be counterexamples to the account, even given Lewis’s favoured conception of naturalness. On this conception, the perfectly natural properties and relations are the fundamental properties and relations, and a property $p$ is more natural than a property $q$ iff the shortest definition of $p$ in terms of the perfectly natural properties and relations is shorter than the shortest definition of $q$ in terms of the perfectly natural properties and relations. (See (Lewis 1986: 61).) As Marshall and Parsons 2001 argue, given this construal of naturalness, the property of being such that there is a cube appears to be neither a disjunctive property nor the negation of a disjunctive property according to Langton and Lewis’s account of disjunctivity. If this is the case, however, then, since being such that there is a cube is independent of accompaniment, the Langton and Lewis account classifies this property as a basic intrinsic property, and hence classifies it as an intrinsic property. This property, however, is clearly not intrinsic.
    step1: |-
      对 Langton 与刘易斯说明的另一个反驳是：即使按刘易斯偏好的自然性构想，也似乎存在该说明的反例。在这一构想下，完全自然的属性与关系是基本的属性与关系，且属性 $p$ 比属性 $q$ 更自然，当且仅当 $p$ 依据完全自然属性与关系的最短定义，短于 $q$ 依据完全自然属性与关系的最短定义。（见 Lewis 1986: 61。）正如 Marshall 与 Parsons 2001 所论证的，给定这一自然性解释，"存在一个立方体"这一属性，按 Langton 与刘易斯的析取性说明，似乎既不是析取属性，也不是析取属性的否定。然而如果情况如此，那么既然"存在一个立方体"独立于有伴，Langton 与刘易斯的说明就会把这一属性归为基本内在属性，从而归为内在属性。然而这一属性显然不是内在的。
