      This modified version of Rosen’s account appears to correctly classify existence as a local property given the above metaphysical theses. Given these metaphysical theses, however, it arguably ends up classifying too many properties as local. For example, given the above theses, it appears to classify the property of having a member as a local property. It does this, since, given the above metaphysical theses, necessarily, if $x$ has a member, then the fact that $x$ has a member is plausibly grounded by the fact that $y$ is a member of $x$, where $y$ is some member of $x$, and where $x$ is ontologically dependent on $y$. Provided members of sets aren’t parts of those sets, however, the property of having a member appears to be just as non-local as the property of having something be two meters away from one.
