      One reason to attempt an analysis of intrinsicality is that the orientating characterisations of intrinsicality discussed in section 1 and sections 2.2 – 2.4 are all to some degree circular. (Cf Lewis 1983a and Yablo 1999.)[^lewis-1983a][^yablo-1999] For example, a property $p$ whose ascription to a thing $x$ is about $x$ is intrinsic only if it is about how $x$ is *intrinsically*; $p$ is not intrinsic if the ascription of $p$ to $x$ is about how $x$ is *extrinsically*. Similarly, a property $p$ that is had by $x$ in virtue of how $x$ is is intrinsic only if $x$ has $p$ in virtue of how $x$ is *intrinsically*; $p$ need not be *intrinsic* if $x$ has $p$ in virtue of how $x$ is *extrinsically*.
    step1: |-
      尝试分析内在性的一个理由是：第 1 节与第 2.2–2.4 节所讨论的内在性引导性刻画都在某种程度上是循环的。（参见 Lewis 1983a 与 Yablo 1999。）[^lewis-1983a][^yablo-1999] 例如，一个属性 $p$，其归予某物 $x$ 是关于 $x$ 的，仅当它是关于 $x$ 如何**内在地**之所是，才是内在的；如果 $p$ 对 $x$ 的归予是关于 $x$ 如何**外在地**之所是，$p$ 就不是内在的。类似地，一个由 $x$ 凭 $x$ 之所是而具有的属性 $p$，仅当 $x$ 凭 $x$ 如何**内在地**之所是而具有 $p$，才是内在的；如果 $x$ 凭 $x$ 如何**外在地**之所是而具有 $p$，$p$ 不必是**内在的**。
