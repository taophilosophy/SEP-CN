      The notion of a perfectly natural, or fundamental, property or relation suggests an appealing approach to analysing intrinsicality. Consider the non-intrinsic property of being an uncle. It is appealing to think that the reason this property fails to be intrinsic is that it can be analysed in terms of more fundamental relations, such as being a sibling of and being a child of, in a manner that reveals how something being an uncle is at least partially a matter of how it is related to things that aren’t part of it. In particular, it is plausible to think that the reason being an uncle is non-intrinsic is that for $x$ to be an uncle is for $x$ to have a sibling that has a child, where this child fails to be part of $x$. More generally, it is plausible that, if being $F$ is a non-intrinsic property, then the fact that it is non-intrinsic can be revealed by analysing being $F$ in terms of more fundamental properties and relations in a manner that reveals how something being $F$ may partly be a matter of being related to a non-part or may be partly a matter of how non-parts are. If this is true, then it has the following two consequences. First, it follows that every fundamental property is intrinsic, since it being non-intrinsic cannot be revealed by analysis in terms of more fundamental properties and relations. Secondly, and even more importantly, it follows that whether a property is intrinsic should be analysable in terms of how that property can be analysed in terms of the fundamental properties and relations.
    step1: |-
      完全自然的（或基本的）属性与关系这一概念，提示了一条有吸引力的内在性分析路径。考虑非内在属性"身为叔叔"。有吸引力的想法是：这一属性之所以不是内在的，是因为它可以用更基本的关系（如"是……的兄弟姐妹"与"是……的孩子"）来分析，而这种分析揭示了某物之为叔叔至少部分地关乎它如何与非其部分的事物相关。特别地，可信的想法是："身为叔叔"之所以是非内在的，是因为 $x$ 之为叔叔，就是 $x$ 有一个有孩子的兄弟姐妹，而这个孩子不是 $x$ 的部分。更一般地，可信的想法是：如果"是 $F$"是一个非内在属性，那么它之为非内在这一点，可以通过用更基本的属性与关系分析"是 $F$"来揭示——只要这种分析揭示出：某物之为 $F$ 可能部分地关乎与非部分处于关系之中，或部分地关乎非部分之所是。如果这是真的，那么它有两个推论。第一，每个基本属性都是内在的，因为它之为非内在无法通过用更基本属性与关系的分析来揭示。第二，也是更重要地，一个属性是否内在，应当可以用该属性如何能通过基本属性与关系来分析而得到分析。
