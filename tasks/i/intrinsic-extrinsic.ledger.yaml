      It is at least initially appealing to think that, if an object has a property in an intrinsic fashion, then it has it independently of the way the rest of the world is. The rest of the world could disappear, and the object might still have that property. Hence a *lonely* object, an object that doesn’t coexist with any contingent objects wholly distinct from it, could have the property. Many extrinsic properties, on the other hand, cannot be possessed by lonely objects – no lonely object has the property of being six metres from a rhododendron, for example. This suggests an analysis of intrinsicality: $F$ is an intrinsic property iff it is possible for a lonely object to be $F$. This analysis is usually attributed to Kim (1982) (e.g. in Lewis 1983a and Sider 1993)[^lewis-1983a], though Humberstone (1996) dissents from this interpretation. If this analysis is successful then it would constitute a broadly logical analysis, since the expressions on the right hand side of the account can each be defined using only broadly logical vocabulary.
    step1: |-
      至少初看之下，以下想法很有吸引力：如果一个对象以内在方式具有某属性，那么它独立于世界其余部分之所是而具有该属性。世界其余部分可以消失，而该对象或许仍具有那一属性。于是，一个**孤立的**对象——即不与任何完全相异于它的偶然对象共存的对象——可能具有该属性。另一方面，许多外在属性不能为孤立对象所具有——例如，没有任何孤立对象具有"距一株杜鹃花六米"这一属性。这提示了一种内在性分析：$F$ 是内在属性，当且仅当孤立对象可能是 $F$。这一分析通常归于金在权（Kim 1982）（例如 Lewis 1983a 与 Sider 1993 中即如此）[^lewis-1983a]，尽管 Humberstone 1996 不认同这一解读。如果这一分析成功，它就构成一个广义逻辑的分析，因为该说明右边各式都能只用广义逻辑词汇来定义。
