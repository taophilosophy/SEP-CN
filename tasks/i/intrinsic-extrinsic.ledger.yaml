      (3) plausibly classifies *being a cube* as intrinsic, since, for any $x$, the state of affairs of $x$ being a cube plausibly describes how $x$ and its parts are and how they are related to each other, as opposed to how they are related to other things and how other things are. In contrast, (3) plausibly classifies *being an uncle* as non-intrinsic, since its ascription to a thing is not only about how it and its parts are and how they are related to each other, but also about how it is related to things outside of it. (3) also plausibly classifies being Obama as non-intrinsic since the ascription of being Obama to Clinton, namely the state of affairs of Obama being identical to Clinton, is not wholly about Clinton, but is also about Obama. Finally, (3) also appears to classify being such that there is a number as non-intrinsic, even if it is necessary that there are numbers. This is because the ascription of this property to Clinton, namely the state of affairs that Clinton is such that there is a number, appears to be not wholly about how Clinton is, but is also about how things wholly distinct from Clinton are. (We will assume that the intuition underlying this judgement is correct. However, this is not uncontroversial. See Sider 1996 for a rejection of a closely related intuition and Eddon 2011 for a reply to this rejection.)[^eddon-2011]
