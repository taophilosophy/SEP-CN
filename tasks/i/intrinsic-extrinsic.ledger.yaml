      An alternative view has been put forward by Plate 2018, who has argued that there is a single notion of intrinsicality and that none of the notions discussed above correspond to it. Plate points out that, on each of the alleged notions of intrinsicality discussed above, either the property of having Paris as a part is classified as non-intrinsic or the uninstantiable property of being such that Socrates is non-self-identical is classified as intrinsic. Plate then argues that, since having Paris as a part is intrinsic while being such that Socrates is non-self-identical is non-intrinsic, it follows that none of the above notions is intrinsicality. A response to Plate’s argument is given by Marshall 2021, who argues that there is no notion of intrinsicality on which these properties are respectively intrinsic and non-intrinsic. Instead, according to this response, there are only notions of intrinsicality on which either both are intrinsic or both are non-intrinsic.
    step1: |-
      另一种观点由 Plate 2018 提出：存在单一的内在性概念，而上文讨论的所有概念都不对应于它。Plate 指出：在上文所讨论的每一个所谓内在性概念上，要么"以巴黎为部分"这一属性被归为非内在的，要么"苏格拉底非自等同"这一不可实例化属性被归为内在的。Plate 进而论证：既然"以巴黎为部分"是内在的，而"苏格拉底非自等同"是非内在的，那么上述概念都不是内在性。Marshall 2021 对 Plate 的论证给出了回应：不存在这样一个内在性概念，使这两个属性分别为内在的与非内在的；按照这一回应，只有"两者皆为内在"或"两者皆为非内在"的内在性概念。
