      There are, however, problems with Yablo’s defense of Vallentyne’s contractionist approach to intrinsicality. One problem, discussed in Parsons 2007 and Marshall 2014, is that, on Yablo’s version of contractionism, we need to be able to make sense of sentences like ‘In $w$, Prince Philip is not a husband’, where $w$ is the world consisting of just Prince Philip. Making sense of such sentences, however, is difficult without appealing to the distinction between intrinsic and non-intrinsic properties. Appealing to this distinction when interpreting Yablo’s account, however, would render it circular.
    step1: |-
      然而，雅布洛对 Vallentyne 收缩论路径的辩护存在问题。其中一个问题（Parsons 2007 与 Marshall 2014 有所讨论）是：在雅布洛版本的收缩论下，我们需要能够理解诸如"在 $w$ 中，菲利普亲王不是丈夫"这样的语句，其中 $w$ 是仅由菲利普亲王组成的世界。然而，不诉诸内在属性与非内在属性之分，就很难理解这样的语句。而在解读雅布洛的说明时诉诸这一区分，又会使其循环。
