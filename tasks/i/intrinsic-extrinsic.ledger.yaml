    step1: |-
      除了属性之为内在的这一“全局”概念之外，还有一个“局部”概念，即某物以内在方式具有某属性（见 Humberstone 1996, p. 206）[^humberstone-1996]。对于第 1 节所引刘易斯关于内在属性概念的每一条刻画，都有一条针对“某物以内在方式具有某属性”这一概念的对应刻画。它们是：
    step2: |-
