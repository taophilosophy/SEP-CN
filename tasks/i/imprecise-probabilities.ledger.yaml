      Since you are in a state of ignorance with respect to $X$, your representor contains probabilities that take $Y$ to be good evidence that $H$ and probabilities that take $Y$ to be good evidence that $\neg H$. So, despite the fact that $P(H)=\{1/2\}$ we have $P(H\mid Y) = [0,1]$. This phenomenon—posteriors being wider than their priors—is known as dilation. The phenomenon has been thoroughly investigated in the mathematical literature (Walley 1991; Seidenfeld and Wasserman 1993; Herron, Seidenfeld, and Wasserman 1994; Pedersen and Wheeler 2014)[^pedersen-2014][^pedersen-2014-2][^seidenfeld-1993][^walley-1991][^wheeler-2014]. Levi and Seidenfeld reported an example of dilation to Good following Good (1967). Good mentioned this correspondence in his follow up paper (Good 1974)[^good-1974]. Recent interest in dilation in the philosophical community has been generated by White’s paper (White 2010)[^white-2010].
    step1: |-
      由于你对 $X$ 处于无知状态，你的表征集既包含把 $Y$ 视为 $H$ 之良好证据的概率，也包含把 $Y$ 视为 $\neg H$ 之良好证据的概率。因此，尽管 $P(H)=\{1/2\}$，我们却有 $P(H\mid Y) = [0,1]$。这一现象——后验比先验更宽——被称为膨胀。这一现象在数学文献中已被彻底研究（Walley 1991; Seidenfeld and Wasserman 1993; Herron, Seidenfeld, and Wasserman 1994; Pedersen and Wheeler 2014）[^pedersen-2014][^pedersen-2014-2][^seidenfeld-1993][^walley-1991][^wheeler-2014]。Levi 与 Seidenfeld 在 Good（1967）之后向 Good 报告了一个膨胀的例子。Good 在其后续论文中提到了这一通信（Good 1974）[^good-1974]。哲学界近期对膨胀的兴趣，由 White 的论文引发（White 2010）[^white-2010]。
    step2: |-
      由于你对 $X$ 一无所知，你的表征集里既有把 $Y$ 当作 $H$ 之好证据的概率，也有把 $Y$ 当作 $\neg H$ 之好证据的概率。于是，尽管 $P(H)=\{1/2\}$，却有 $P(H\mid Y) = [0,1]$。这一现象——后验宽于先验——即所谓膨胀，数学文献中已有充分研究（Walley 1991; Seidenfeld and Wasserman 1993; Herron, Seidenfeld, and Wasserman 1994; Pedersen and Wheeler 2014）[^pedersen-2014][^pedersen-2014-2][^seidenfeld-1993][^walley-1991][^wheeler-2014]。Levi 与 Seidenfeld 曾在 Good（1967）之后向 Good 报告过一例膨胀，Good 在随后的论文中提及了这通通信（Good 1974）[^good-1974]。哲学界近来对膨胀的兴趣，则由 White 的论文引发（White 2010）[^white-2010]。
