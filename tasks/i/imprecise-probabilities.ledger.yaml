      ### 3.6 What makes a good imprecise belief?
    step1: TBD
    step2: TBD
  - id: 162
    kind: body
    source: |-
      There are, as we have seen, certain structural properties that are necessary conditions on rational belief. What exactly these are depends on your views. However, there are further ways of assessing belief. Strongly believing true things and strongly believing the negations of false things seem like good-making-features of beliefs. For the case of precise credences, we can make this precise. There is a large literature on “scoring rules”: methods for measuring how good a probability is relative to the actual state of the world (Brier 1950; Savage 1971; Joyce 2009; Pettigrew 2011)[^brier-1950][^joyce-2009][^pettigrew-2011][^savage-1971]. These are numerical methods of measuring how good a probability is given the true state of the world.
    step1: TBD
    step2: TBD
  - id: 163
    kind: body
    source: |-
      For the case of imprecise probabilities, however, the situation looks bleak. No real valued scoring rule for imprecise probabilities can have the desirable property of being *strictly proper* (Seidenfeld, Schervish, and Kadane 2012). Schoenfield (2017) presents a simple version of the result. Since strict propriety is a desirable property of a scoring rule (Bröcker and Smith 2007; Joyce 2009; Pettigrew 2011)[^bröcker-2007][^joyce-2009][^pettigrew-2011], this failing is serious. So further work is needed to develop a well-grounded theory of how to assess imprecise probabilities. Mayo-Wilson and Wheeler (2016) provide a neater version of the proof, and offer a property weaker than strict propriety that an imprecise probability scoring rule can satisfy. Carr (2015) and Konek (forthcoming) both present positive suggestions for moving forward with imprecise scoring rules. Levinstein (forthcoming) suggests that the problem really only arises for determinately imprecise credences, but not for indeterminate credence.
    step1: TBD
    step2: TBD
