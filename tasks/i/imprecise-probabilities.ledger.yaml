      There are two apparent problems with dilation. First, the belief-moving effect of apparently irrelevant evidence; and second, the fact that learning some evidence can cause your belief-intervals to widen. The above comments speak to the first of these. Pedersen and Wheeler (2014)[^wheeler-2014] also are focused on mitigating this worry. We turn now to the second worry.
    step1: |-
      膨胀有两个明显问题。第一，看似无关的证据会产生移动信念的效果；第二，学习某些证据会使你的信念区间变宽。上述评论针对的是第一个问题。Pedersen 与 Wheeler（2014）[^wheeler-2014] 也着眼于缓解这一忧虑。现在转向第二个忧虑。
