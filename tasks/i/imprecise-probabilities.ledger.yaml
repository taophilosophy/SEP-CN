      I want to give a couple of examples of this idea. First consider some physical process that doesn’t have a limiting frequency but has a frequency that varies, always staying within some interval. This would be a process that is chancy, but fairly predictable. It might be that the best description of such a system is to just put bounds on its relative frequency. Such processes have been studied using IP models (Kumar and Fine 1985; Grize and Fine 1987; Fine 1988)[^fine-1988][^grize-1987][^kumar-1985], and have been discussed as a potential source of imprecision in credence (Hájek and Smithson 2012)[^hájek-2012]. A certain kind of non-standard understanding of a quantum-mechanical event leads naturally to upper probability models (Suppes and Zanotti 1991; Hartmann and Suppes 2010)[^hartmann-2010][^suppes-1991]. John Norton has discussed the limits of probability theory as a logic of induction, using an example which, he claims, admits no reasonable probabilistic attitude (Norton 2007, 2008a,b)[^norton-2007][^norton-2008a]. One might hope that IP offers an inductive logic along the lines Norton sketches. Norton himself has expressed scepticism on this line (Norton 2007)[^norton-2007], although Benétreau-Dupin (2015)[^benétreau-dupin-2015] has defended IP as a candidate system for Norton’s project. Finally, particular views on vagueness might well prompt a rethinking of the formal structure of chance (Bradley 2016)[^bradley-2016][^bradley-2016-2].
    step1: |-
      我想举几个这一观念的例子。首先考虑某种没有极限频率、但频率不断变化且始终停留在某个区间内的物理过程。这会是一个具有机遇性却相当可预测的过程。对这样一个系统，最好的描述也许就是对其相对频率给出界。这类过程已用 IP 模型研究过（Kumar and Fine 1985; Grize and Fine 1987; Fine 1988）[^fine-1988][^grize-1987][^kumar-1985]，并作为信度非精确性的一个潜在来源得到讨论（Hájek and Smithson 2012）[^hájek-2012]。对量子力学事件的某种非标准理解会自然导致上概率模型（Suppes and Zanotti 1991; Hartmann and Suppes 2010）[^hartmann-2010][^suppes-1991]。John Norton 用一个他声称不承认任何合理概率态度的例子，讨论了概率论作为归纳逻辑的限度（Norton 2007, 2008a,b）[^norton-2007][^norton-2008a]。人们或许希望 IP 能提供一种沿 Norton 所勾画路线的归纳逻辑。Norton 本人对这条路线表示怀疑（Norton 2007）[^norton-2007]，尽管 Benétreau-Dupin（2015）[^benétreau-dupin-2015] 已为 IP 作为 Norton 方案的候选系统辩护。最后，关于模糊性的特定看法很可能促使我们重新思考机遇的形式结构（Bradley 2016）[^bradley-2016][^bradley-2016-2]。
