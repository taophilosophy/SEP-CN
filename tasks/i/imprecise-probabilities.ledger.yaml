      Consider $\underline{P}(X)$ as representing the degree to which the evidence supports $X$. Now consider $I(X) = 1- (\underline{P}(X) + \underline{P}(\neg X))$. This measures the degree to which the evidence is silent on $X$. Huber (2009)[^huber-2009][^huber-2009-2] points out that precise probabilism can then be understood as making the claim that no evidence is ever silent on any proposition. That is, $I(X)=0$ for all $X$. One can never suspend judgement. This is a nice way of seeing the strangeness of the precise probabilist’s attitude to evidence. Huber is making this point about Dempster-Shafer belief functions (see historical appendix, section 7), but it carries over to IP in general.
    step1: |-
      把 $\underline{P}(X)$ 视为表征证据支持 $X$ 的程度。再考虑 $I(X) = 1- (\underline{P}(X) + \underline{P}(\neg X))$。它度量证据对 $X$ 保持沉默的程度。Huber（2009）[^huber-2009][^huber-2009-2] 指出，精确概率论由此可以被理解为主张：没有任何证据会对任何命题保持沉默。也就是说，对所有 $X$ 都有 $I(X)=0$。人永远无法悬置判断。这是看清精确概率论者证据态度之怪异的一个好方式。Huber 是针对 Dempster-Shafer 信念函数提出这一点的（见历史附录第 7 节），但它一般地适用于 IP。
