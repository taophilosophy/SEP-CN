      What if the objective chances were not probabilities? If we endorse some kind of connection between known objective chances and belief—for example, a principle of direct inference or Lewis’ Principal Principle (Lewis 1986)[^lewis-1986]—then we might have an additional reason to endorse imprecise probabilism. It seems to be a truth universally acknowledged that chances ought to be probabilities, but it is a “truth” for which very little argument has been offered. For example, Schaffer (2007)[^schaffer-2007] makes obeying the probability axioms one of the things required in order to play the “chance role”, but offers no argument that this should be the case. Joyce says “some have held objective chances are not probabilities. This seems unlikely, but explaining why would take us too far afield” (2009: 279, fn.17). Various other discussions of chance—for example in statistical mechanics (Loewer 2001; Frigg 2008)[^frigg-2008][^loewer-2001] or “Humean chance” (Lewis 1986, 1994)[^lewis-1986][^lewis-1994]—take for granted that chances should be precise and probabilistic (Dardashti et al. 2014 is an exception)[^dardashti-2014]. Obviously things are confused by the use of the concept of chance as a way of interpreting probability theory. There is, however, a perfectly good pre-theoretic notion of chance: this is what probability theory was originally invented to reason about, after all. This pre-theoretic chance still seems like the sort of thing that we should apportion our belief to, in some sense. And there is very little argument that chances must always be probabilities. If the chances were nonprobabilistic in a particular way, one might argue that your credences ought to be nonprobabilistic in the same way. What form a chance-coordination norm should take if chances and credences were to have non-probabilistic formal structures is currently an open problem.
    step1: |-
      如果客观机遇不是概率，那会怎样？如果我们认可已知客观机遇与信念之间的某种联系——例如直接推断原则或 Lewis 的主要原则（Principal Principle，Lewis 1986）[^lewis-1986]——那么我们可能就有额外理由支持非精确概率论。机遇应当是概率，这似乎是普遍公认的真理，但极少有人为这一“真理”提供论证。例如，Schaffer（2007）[^schaffer-2007] 把遵守概率公理列为扮演“机遇角色”的必要条件之一，却未论证为何应当如此。Joyce 说：“有人主张客观机遇不是概率。这似乎不太可能，但要解释为什么，会让我们离题太远”（2009: 279，注 17）。其他关于机遇的讨论——例如统计力学中的讨论（Loewer 2001; Frigg 2008）[^frigg-2008][^loewer-2001] 或“休谟式机遇”（Lewis 1986, 1994）[^lewis-1986][^lewis-1994]——都把机遇应当是精确且概率性的这一点视为理所当然（Dardashti et al. 2014 是例外）[^dardashti-2014]。显然，把机遇概念用作解释概率论的方式，使事情变得混乱。然而，有一个完全良好的前理论机遇概念：毕竟概率论最初正是为了推理它而发明的。这种前理论机遇似乎仍是我们应当在某种意义上分配信念的东西。而很少有人论证机遇必须始终是概率。如果机遇以某种特定方式是非概率性的，人们或许可以论证你的信度也应当以同样方式是非概率性的。如果机遇与信度具有非概率性的形式结构，机遇—信度协调规范应当采取何种形式，目前仍是一个未决问题。
