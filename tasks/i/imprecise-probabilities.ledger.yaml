      It is also helpful to distinguish belief itself from the elicitation of that belief and also from your introspective access to those beliefs. The same goes for other attitudes (values, utilities and so on). It may be that you have beliefs that are not amenable to (precise) elicitation, in practice or even in principle. Likewise, your introspective access to your own beliefs might be imperfect. Such imperfections could be a source of imprecision. Bradley (2009)[^bradley-2009] distinguishes many distinct sources of imperfect introspection. The imperfection could arise from your unawareness of the prospect in question, the boundedness of your reasoning, ignorance of relevant contingencies, or because of conflict in your evidence or in your values (pp. 240–241). See Bradley and Drechsler (2014) for further discussion of types of uncertainty.
    step1: |-
      还有助于把信念本身与对信念的引出区分开来，也与其内省通达区分开来。其他态度（价值、效用等）也是如此。你可能持有某些信念，在实践中乃至原则上都无法（精确地）引出。同样，你对自己信念的内省通达可能并不完美。这种不完美可以成为非精确性的一个来源。Bradley（2009）[^bradley-2009] 区分了许多不同的不完美内省来源。这种不完美可能源于：你对所涉前景缺乏觉察、推理能力有限、对相关可能情形无知，或你的证据或价值存在冲突（第 240–241 页）。关于不确定性类型的进一步讨论，见 Bradley and Drechsler（2014）。
