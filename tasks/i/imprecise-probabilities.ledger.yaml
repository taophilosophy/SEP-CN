      If we assume you have beliefs represented by $P(H)=[0,1]$, these bets have expectations of $[-10,15]$. Refusing each bet has expectation of 0. So accepting and refusing $A$ are incomparable with respect to your beliefs. Likewise for $B$. The problem is that refusing *both* bets seems to be irrational, since accepting both bets gets you a guaranteed payoff of 5. Elga argues that no decision rule for imprecise probabilities can rule out refusing both bets. He then argues that this shows that imprecise probabilities are bad epistemology. Neither argument works. Chandler (2014)[^chandler-2014] and Sahlin and Weirich (2014) both point out that a certain kind of imprecise decision rule does make refusing both bets impermissible and Elga has acknowledged this in an erratum to his paper. Bradley and Steele (2014a) argue that decision rules that make refusing both bets merely permissible are legitimate ways to make imprecise decisions. They also point out that the rule that Chandler, and Sahlin and Weirich advocate has counterintuitive consequences in other decision problems.
    step1: |-
      如果我们假定你的信念由 $P(H)=[0,1]$ 表征，那么这两个赌局的期望为 $[-10,15]$。拒绝每个赌局的期望为 0。因此，就你的信念而言，接受还是拒绝 $A$，二者不可比。$B$ 同样如此。问题在于，拒绝 **两个** 赌局似乎不理性，因为接受两个赌局能保证得到 5。Elga 论证，没有任何非精确概率决策规则能排除拒绝两个赌局。他进而论证，这表明非精确概率是糟糕的认识论。两个论证都不成立。Chandler（2014）[^chandler-2014] 与 Sahlin、Weirich（2014）都指出，某类非精确决策规则确实使拒绝两个赌局不被允许；Elga 已在其论文的勘误中承认这一点。Bradley 与 Steele（2014a）主张，使拒绝两个赌局仅为可允许的决策规则，是作非精确决策的合法方式。他们还指出，Chandler 以及 Sahlin、Weirich 所主张的规则在其他决策问题中会有反直觉后果。
