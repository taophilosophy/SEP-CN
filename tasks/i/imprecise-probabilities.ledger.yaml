      So if your belief state or doxastic state is represented by $p$, then your degree of belief in $X$ is the value assigned to $X$ by $p$; that is, $p(X)$.
    step1: |-
      因此，若你的信念状态或信态由 $p$ 表征，则你对 $X$ 的置信度就是 $p$ 赋予 $X$ 的值，即 $p(X)$。
    step2: |-
      因此，若你的信念状态或信态由 $p$ 表征，则你对 $X$ 的置信度就是 $p$ 赋予 $X$ 的值，即 $p(X)$。
