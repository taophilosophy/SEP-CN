      So dilation can perhaps be tamed or rationalised, and the issue with reflection can be mitigated. But there is still a puzzle that dilation raises: in the precise context we have a nice result – due to Good (1967)[^good-1967] – that says roughly that learning new information has positive expected value. Information has positive value. This result is, to some extent, undermined by dilation. Bradley and Steele (2016) suggest that there is some sense in which Good’s result can be partially salvaged in the IP setting.
    step1: |-
      因此，膨胀也许可以驯服或合理化，反思原则的问题也可以缓解。但膨胀仍提出一个谜题：在精确语境中，我们有一个漂亮的结果——由 Good（1967）[^good-1967] 给出——它大致是说，学习新信息具有正的期望价值。信息具有正价值。这一结果在某种程度上被膨胀削弱。Bradley 与 Steele（2016）提出，在某种意义上，Good 的结果在 IP 设定中可以部分挽救。
