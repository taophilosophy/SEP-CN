      Imprecise probabilities is a theory born of our limitations as reasoning agents, and of limitations in our evidence base. If only we had better evidence, a single probability function would do. But since our evidence is weak, we must use a set. In a way, the same is true of precise probabilism. If only we knew the truth, we could represent belief with a truth-valuation function, or just a set of sentences that are fully believed. But since there are truths we don’t know, we must use a probability to represent our intermediate confidence. And indeed, the same problem arises for the imprecise probabilist. Is it reasonable to assume that we know what set of probabilities best represents the evidence? Perhaps we should have a set of sets of probabilities… Similar problems arise for theories of vagueness (Sorensen 2012)[^sorensen-2012]. We objected to precise values for degrees of belief, so why be content with sets-valued beliefs with precise boundaries? This is the problem of “higher-order vagueness” recast as a problem for imprecise probabilism. Why is sets of probabilities the right level to stop the regress at? Why not sets of sets? Why not second-order probabilities? Why not single probability functions? Williamson (2014)[^williamson-2014] makes this point, and argues that a single precise probability is the correct level at which to get off the “uncertainty escalator”. Williamson advocates the betting interpretation of belief, and his argument here presupposes that interpretation. But the point is still worth addressing: for a particular interpretation of what belief is, what sort of level of uncertainty is appropriate. For the *functionalist* interpretation suggested above, this is something of a pragmatic choice. The further we allow this regress to continue, the harder it is to deal with these belief-representing objects. So let’s not go further than we need.
    step1: |-
      非精确概率是一门源于我们作为推理行动者的局限、以及我们证据基础之局限的理论。只要我们拥有更好的证据，单一概率函数就够了。但既然我们的证据薄弱，就必须使用集合。在某种意义上，精确概率论也是如此。只要我们知晓真理，就可以用真值赋值函数、或直接用一组被完全相信的句子来表征信念。但既然有些真理我们不知道，就必须用概率来表征我们居间的信心。确实，非精确概率论者也面临同样的问题。假定我们知道哪组概率最好地表征证据，这合理吗？也许我们应当有一组概率集……模糊性理论也有类似问题（Sorensen 2012）[^sorensen-2012]。我们反对为置信度设定精确值，那为什么满足于具有精确边界的集合值信念？这就是把“高阶模糊性”问题改写为非精确概率论的问题。为什么概率集是阻止倒退的正确层次？为什么不是集合的集合？为什么不是二阶概率？为什么不是单一概率函数？Williamson（2014）[^williamson-2014] 提出这一点，并主张单一精确概率才是从“不确定性自动扶梯”上下来的正确层次。Williamson 提倡信念的下注解释，而他这里的论证预设了该解释。但这一点仍值得处理：给定关于信念是什么的特定解释，何种不确定性层次才算恰当。对上面建议的 **功能主义** 解释来说，这多少是一个实用主义选择。我们让这一倒退继续得越远，处理这些表征信念的对象就越困难。所以，不要走得超过所需。
