      The problem for IP decision making, in short, is that your credal committee can disagree on what the best course of action is, and when they do, it is unclear how you should act (recall the definitions in section 1.1). Imagine betting on a coin of unknown bias. Consider the indicator gambles on heads and tails. Both bets have imprecise expectation $[0,1]$. How are you supposed to compare these expectations? The bets are incomparable. (If the coin case appears to have too much exploitable symmetry, consider unit bets on Elga pulling toothpaste or jellyfish from his bag.) This incomparability, argues Williamson, leads to decision making paralysis, and this highlights a flaw in the epistemology (2010: 70). This argument seems to be missing the point, however, if one of our motivations for IP is precisely to be able to represent such incompatibility of prospects (see section 2.2)! The incommensurability of options entailed by IP is not a bug, it’s a feature. Decision making with imprecise probabilities is discussed by Seidenfeld (2004)[^seidenfeld-2004], Troffaes (2007)[^troffaes-2007], Seidenfeld, Schervish, and Kadane (2010), Bradley (2015)[^bradley-2015], Williams (2014)[^williams-2014], Huntley, Hable, and Troffaes (2014)[^troffaes-2014].
    step1: |-
      简言之，IP 决策的问题在于：你的信度委员会可能对最佳行动方案意见不一；一旦如此，你应当如何行动就不清楚了（回想 1.1 节的定义）。设想对一枚偏向未知的硬币下注。考虑关于正面与反面的指示赌局。两个赌局的非精确期望都是 $[0,1]$。你应当如何比较这些期望？这两个赌局不可比。（如果硬币例子看起来有过多可利用的对称性，可以考虑对 Elga 从袋中掏出牙膏还是水母作单位赌局。）Williamson 主张，这种不可比导致决策瘫痪，并凸显了该认识论的缺陷（2010: 70）。然而，如果 IP 的动机之一正是要能够表征前景之间的这种不相容性（见 2.2 节），这一论证似乎就未抓住要点！IP 所蕴含的选项不可通约性不是缺陷，而是特征。用非精确概率作决策的讨论，见 Seidenfeld（2004）[^seidenfeld-2004]、Troffaes（2007）[^troffaes-2007]、Seidenfeld, Schervish, and Kadane（2010）、Bradley（2015）[^bradley-2015]、Williams（2014）[^williams-2014]、Huntley, Hable, and Troffaes（2014）[^troffaes-2014]。
