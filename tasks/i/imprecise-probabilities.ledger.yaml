      We shall need to talk about decision making so we shall introduce a simple model of decisions in terms of gambles. We can view bounded real valued functions $f$ as “gambles” that are functions from some set $\Omega$ to real numbers. A gamble $f$ pays out $f(\omega)$ if *ω* is the true state. We assume that you value each further unit of this good the same (the gambles’ pay outs are linear in utility) and you are indifferent to concerns of risk. Your attitude to these gambles reflects your attitudes about how likely the various contingencies in $\Omega$ are. That is, gambles that win big if *ω* look more attractive the more likely you consider *ω* to be. In particular, consider the indicator function $I_X$ on a proposition $X$ which outputs $1$ if $X$ is true at the actual world and $0$ otherwise. These are a particular kind of gamble, and your attitude towards them straightforwardly reflects your degree of belief in the proposition. The more valuable you consider $I_X$, the more likely you consider $X$ to be. Call these indicator gambles.
    step1: |-
      我们还需要讨论决策，因此将引入一个以赌局表述决策的简单模型。我们可以把有界实值函数 $f$ 视为“赌局”，即从某个集合 *Ω* 到实数的函数。若 *ω* 是真实状态，赌局 $f$ 支付 $f(\omega)$。我们假定，你对这种善的每一新增单位给予相同评价（赌局支付与效用呈线性），并且对风险问题无差别。你对这些赌局的态度，反映你对 *Ω* 中各种可能情形之可能性的态度。也就是说，若 *ω* 发生则赢得很多的赌局，在你认为 *ω* 越可能时就越有吸引力。特别地，考虑命题 $X$ 上的指示函数 $I_X$：若 $X$ 在现实世界为真则输出 $1$，否则输出 $0$。这类赌局很特殊：你对它们的态度直接反映你对相应命题的置信程度。你认为 $I_X$ 越有价值，就认为 $X$ 越可能。我们称它们为指示赌局。
