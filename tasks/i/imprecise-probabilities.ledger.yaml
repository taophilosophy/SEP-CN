      If your prior in $H_1$ is *vacuous*—if $P(H_1) = [0,1]$—then the above equation shows that your posterior is vacuous as well. That is, if $p(H_1) = 0$ then $p(H_1\mid E) = 0$ and likewise for $p(H_1) = 1 = p(H_1\mid E)$, and since the right hand side of the above equation is a continuous function of $p(H_1)$, for every $r\in [0,1]$ there is some $p(H_1)$ such that $p(H_1\mid E) = r$. So $P(H_1\mid E)=[0,1]$.
    step1: |-
      若你对 $H_1$ 的先验是空洞的——即 $P(H_1) = [0,1]$——则上式表明你的后验同样是空洞的。也就是说，若 $p(H_1) = 0$，则 $p(H_1\mid E) = 0$；$p(H_1) = 1 = p(H_1\mid E)$ 亦然；而由于上式右端是 $p(H_1)$ 的连续函数，对每个 $r\in [0,1]$ 都存在某个 $p(H_1)$ 使 $p(H_1\mid E) = r$。于是 $P(H_1\mid E)=[0,1]$。
    step2: |-
      倘若你对 $H_1$ 的先验是空洞的——即 $P(H_1) = [0,1]$——上式便表明你的后验同样空洞。也就是说，$p(H_1) = 0$ 时 $p(H_1\mid E) = 0$，$p(H_1) = 1 = p(H_1\mid E)$ 亦然；而上式右端是 $p(H_1)$ 的连续函数，故对每个 $r\in [0,1]$ 都有某个 $p(H_1)$ 使 $p(H_1\mid E) = r$。于是 $P(H_1\mid E)=[0,1]$。
