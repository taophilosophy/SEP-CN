      Gärdenfors and Sahlin’s *Unreliable Probabilities* model enriches a basic IP approach with a “reliability index” (see the [historical appendix](imprecise-probabilities.supplement-historical.md)). Lyon (2017)[^lyon-2017] enriches the standard IP picture in a different way: he adds a privileged “best guess” probability. This modification allows for better aggregation of elicited IP estimates. How best to interpret such a model is still an open question. Other enriched IP models are no doubt available.
    step1: |-
      Gärdenfors 与 Sahlin 的 **不可靠概率**（Unreliable Probabilities）模型用一个“可靠性指数”丰富了基本 IP 进路（见[历史附录](imprecise-probabilities.supplement-historical.md)）。Lyon（2017）[^lyon-2017] 以另一种方式丰富标准 IP 图景：他添加了一个享有特权的“最佳猜测”概率。这一修改使被引出的 IP 估计能更好地聚合。如何最好地解释这样的模型，仍是一个未决问题。无疑还有其他丰富的 IP 模型。
