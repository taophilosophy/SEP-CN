      因此，若你的证据约束了你对 $X$ 与对 $Y$ 的信念，却对二者的相互作用保持沉默，那么你只能把这些复合事件确定到某些区间。任何对特定概率函数的选择，都会在假定 $X$ 与 $Y$ 之间某种特定证据关系上超出证据。也就是说，$p(X)$ 与 $p(X\mid Y)$ 的差异将缺乏证据上的根据。
