      人们可以采取这样的观点：信度是在建模头脑中某种心智或心理量。信念强度是一个真实的心理量，信度应当度量的正是它。与上述诸观点不同，这一信度解释不易操作化。这一关于信念强度的理解似乎还使信度与它在理解决策中的角色相疏离。上述行为主义观点把信念在决策中的角色视为信念之核心，甚至是其定义。这一心理学解释似乎把信念与决策割裂开来。是否存在这样稳定的神经结构，也仍有争议（Fumagalli 2013; Smithson and Pushkarskaya 2015）[^fumagalli-2013][^smithson-2015]。
