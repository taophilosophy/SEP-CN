      For the case of imprecise probabilities, however, the situation looks bleak. No real valued scoring rule for imprecise probabilities can have the desirable property of being *strictly proper* (Seidenfeld, Schervish, and Kadane 2012)[^seidenfeld-2012]. Schoenfield (2017)[^schoenfield-2017] presents a simple version of the result. Since strict propriety is a desirable property of a scoring rule (Bröcker and Smith 2007; Joyce 2009; Pettigrew 2011)[^bröcker-2007][^joyce-2009][^pettigrew-2011], this failing is serious. So further work is needed to develop a well-grounded theory of how to assess imprecise probabilities. Mayo-Wilson and Wheeler (2016) provide a neater version of the proof, and offer a property weaker than strict propriety that an imprecise probability scoring rule can satisfy. Carr (2015)[^carr-2015] and Konek (forthcoming) both present positive suggestions for moving forward with imprecise scoring rules. Levinstein (forthcoming) suggests that the problem really only arises for determinately imprecise credences, but not for indeterminate credence.
    step1: |-
      然而，对非精确概率情形，情况看起来不妙。没有任何实值评分规则能对非精确概率具有 **严格正当**（strictly proper）这一可取性质（Seidenfeld, Schervish, and Kadane 2012）[^seidenfeld-2012]。Schoenfield（2017）[^schoenfield-2017] 给出了该结果的一个简单版本。既然严格正当是评分规则的可取性质（Bröcker and Smith 2007; Joyce 2009; Pettigrew 2011）[^bröcker-2007][^joyce-2009][^pettigrew-2011]，这一缺陷是严重的。因此，需要进一步工作来发展一套有充分根据的非精确概率评估理论。Mayo-Wilson 与 Wheeler（2016）提供了该证明的一个更简洁版本，并提出一种比严格正当更弱的性质，非精确概率评分规则可以满足。Carr（2015）[^carr-2015] 与 Konek（即出）都提出了推进非精确评分规则的积极建议。Levinstein（即出）提出，该问题实际上只对确定地非精确的信度出现，而对非确定信度不出现。
    step2: |-
      然而，对非精确概率情形，情况看起来不妙。没有任何实值评分规则能对非精确概率具有 **严格正当**（strictly proper）这一可取性质（Seidenfeld, Schervish, and Kadane 2012）[^seidenfeld-2012]。Schoenfield（2017）[^schoenfield-2017] 给出了该结果的一个简单版本。既然严格正当是评分规则的可取性质（Bröcker and Smith 2007; Joyce 2009; Pettigrew 2011）[^bröcker-2007][^joyce-2009][^pettigrew-2011]，这一缺陷是严重的。因此，需要进一步工作来发展一套有充分根据的非精确概率评估理论。Mayo-Wilson 与 Wheeler（2016）提供了该证明的一个更简洁版本，并提出一种比严格正当更弱的性质，非精确概率评分规则可以满足。Carr（2015）[^carr-2015] 与 Konek（即出）都提出了推进非精确评分规则的积极建议。Levinstein（即出）提出，该问题实际上只对确定地非精确的信度出现，而对非确定信度不出现。
