      Imprecise probabilities aren’t a radically new theory. They are merely a slight modification of existing models of belief for situations of ambiguity. Often your credences will be precise enough, and your available actions will be such that you act more or less *as if* you were a strict Bayesian. One might analogize imprecise probabilities as the “Theory of Relativity” to the strict Bayesian “Newtonian Mechanics”: all but indistinguishable in all but the most extreme situations. This analogy goes deeper: in both cases, the theories are “empirically indistinguishable” in normal circumstances, but they both differ radically in some conceptual respects. Namely, the role of absolute space in Newtonian mechanics/GR; how to model ignorance in the strict/imprecise probabilist case. Howson (2012)[^howson-2012] makes a similar analogy between modelling belief and models in science. Both involve some requirement to be somewhat faithful to the target system, but in each case faithfulness must be weighed up against various theoretical virtues like simplicity, computational tractability and so on. Likewise Hosni (2014)[^hosni-2014] argues that what model of belief is appropriate is somewhat dependent on context. There is of course an important disanalogy in that models of belief are supposed to be *normative* as well as descriptive, whereas models in science typically only have to play a descriptive role. Walley (1991)[^walley-1991] discusses a similar view but is generally sceptical of such an interpretation.
    step1: |-
      非精确概率并非一种彻底全新的理论。它只是针对歧义情境对既有信念模型作轻微修改。你的信度常常足够精确，而你可用的行动会如此这般，以致你的行事多多少少 **仿佛** 你是严格贝叶斯主义者。人们可以把非精确概率类比为“相对论”，把严格贝叶斯主义类比为“牛顿力学”：除最极端的情形外，二者几乎无法区分。这一类比还可以更深入：在两种情形中，理论在正常情况下都“经验上不可区分”，但都在某些概念方面有根本差异。具体说，牛顿力学／广义相对论中绝对空间的作用；严格／非精确概率论情形中如何建模无知。Howson（2012）[^howson-2012] 在信念建模与科学建模之间作了类似类比。二者都要求对目标系统保持某种忠实，但在每种情形中，忠实都必须与简单性、计算可处理性等各种理论德性相权衡。同样，Hosni（2014）[^hosni-2014] 主张，何种信念模型恰当，多少取决于语境。当然，有一个重要的不类比之处：信念模型被设定为既描述又 **规范**，而科学中的模型通常只须发挥描述作用。Walley（1991）[^walley-1991] 讨论了类似观点，但一般对这种解释持怀疑态度。
