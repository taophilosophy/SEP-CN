      A more serious worry confronts IP when you have to make sequences of decisions. There is a rich literature in economics on sequences of decisions for agents who fail to be orthodox expected utility maximisers (Seidenfeld 1988; 1994; Machina 1989; Al-Najjar and Weinstein 2009, and the references therein)[^al-najjar-2009][^machina-1989][^seidenfeld-1988]. This topic was brought to the attention of philosophers again after the publication of Elga’s (2010)[^elga-2010] paper *Subjective Probabilities Should Be Sharp* which highlights the problem with a simple decision example, although a very similar example appears in Hammond (1988)[^hammond-1988] in relation to Seidenfeld’s discussion of Levi’s decision rule “E-admissibility” (Seidenfeld 1988)[^seidenfeld-1988].
    step1: |-
      当必须作一连串决策时，IP 面临更严重的忧虑。经济学中有丰富文献讨论不按正统期望效用最大化者行事的行动者的决策序列（Seidenfeld 1988; 1994; Machina 1989; Al-Najjar and Weinstein 2009 及其中的参考文献）[^al-najjar-2009][^machina-1989][^seidenfeld-1988]。Elga（2010）[^elga-2010] 的论文 *Subjective Probabilities Should Be Sharp* 发表后，这一话题再次引起哲学家注意；该文用一个简单决策例子凸显了问题，尽管 Hammond（1988）[^hammond-1988] 中已出现一个非常相似的例子，与 Seidenfeld 对 Levi 决策规则“E-可容许性”的讨论相关（Seidenfeld 1988）[^seidenfeld-1988]。
