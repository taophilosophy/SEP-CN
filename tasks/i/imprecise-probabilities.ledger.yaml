      Levi also argued that individual agents can be in conflict in the same way as groups, and thus that individuals’ credal states are also better represented by sets of probabilities. (Levi also argued for the *convexity* of credal states, which brings him into conflict with the above argument about independence (see historical appendix section 3).) One doesn’t need to buy the claim that groups and individuals must be modelled in the same way to take something away from this idea. One merely needs to accept the idea that an individual can be *conflicted* in such a way that a reasonable representation of her belief state—or belief and value state—is in terms of sets of functions. Bradley (2009)[^bradley-2009] calls members of such sets “avatars”. This suggests that we interpret an individual’s credal set as a *credal committee* made up of her avatars. This interpretation of the representor is due to Joyce (2011)[^joyce-2011], though Joyce attributes it Adam Elga. This committee represents all the possible prior probabilities you could have that are consistent with the evidence. Each credal committee member is a fully opinionated Jamesian voluntarist. The committee as a whole, collectively, is a Cliffordian objectivist.
    step1: |-
      Levi 还主张，个体行动者也能像群体一样处于冲突之中，因此个体的信度状态也最好由概率集来表征。（Levi 还主张信度状态的 **凸性**，这使他与上述关于独立性的论证发生冲突（见历史附录第 3 节）。）人们不必接受“群体与个体必须以同样方式建模”这一主张，也能从这一观念中得到启发。只需接受：个体可以以这样一种方式 **冲突**，以致其信念状态——或信念与价值状态——的合理表征是函数集。Bradley（2009）[^bradley-2009] 把这类集合的成员称为“化身”（avatars）。这提示我们：个体信度集就是一个 **信度委员会**，成员是她的化身。这一表征集解释来自 Joyce（2011）[^joyce-2011]，尽管 Joyce 将其归功于 Adam Elga。这个委员会表征你所能拥有的、与证据一致的全部可能先验概率。每个信度委员会成员都是完全有主张的 James 式意志主义者。委员会整体则是 Clifford 式客观主义者。
    step2: |-
      Levi 还主张，个体行动者也能像群体一样处于冲突之中，因此个体的信度状态也最好由概率集来表征。（Levi 还主张信度状态的 **凸性**，这使他与上述关于独立性的论证发生冲突（见历史附录第 3 节）。）人们不必接受“群体与个体必须以同样方式建模”这一主张，也能从这一观念中得到启发。只需接受：个体可以以这样一种方式 **冲突**，以致其信念状态——或信念与价值状态——的合理表征是函数集。Bradley（2009）[^bradley-2009] 把这类集合的成员称为“化身”（avatars）。这提示我们：个体信度集就是一个 **信度委员会**，成员是她的化身。这一表征集解释来自 Joyce（2011）[^joyce-2011]，尽管 Joyce 将其归功于 Adam Elga。这个委员会表征你所能拥有的、与证据一致的全部可能先验概率。每个信度委员会成员都是完全有主张的 James 式意志主义者。委员会整体则是 Clifford 式客观主义者。
