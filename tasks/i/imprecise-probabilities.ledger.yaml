      If committee members have credences *and* utilities that differ among the group, then no precise probability-utility pair distinct from the probabilities and utilities of the agents can satisfy the *Pareto condition* (Seidenfeld, Kadane, and Schervish 1989). The Pareto condition requires that the group preference respect agreement of preference among the group. That is, if all members of the group prefer $A$ to $B$ (that is, if each group member finds that $A$ has higher expected utility than $B$) then the aggregate preference (as determined by the aggregate probability-utility pair) should satisfy that preference. Since this “consensus preservation” is a reasonable requirement on aggregation, this result shows that precise models of group agents are problematic. Walley discusses an example of a set of probabilities where each probability represents the beliefs of a member of a group, then $P$ is an incomplete description of the beliefs of each agent, in the sense that if all members of $P$ agree on something, then that thing is something each agent believes. Sets of probabilities allow us to represent an agent who is *conflicted* in their judgements (Levi 1986, 1999)[^levi-1986].
    step1: |-
      若委员会成员的信度与效用各不相同，那么任何不同于各行动者之概率与效用的精确概率—效用配对，都无法满足帕累托条件（Seidenfeld, Kadane, and Schervish 1989）。帕累托条件要求群体偏好尊重群体内部的偏好一致。也就是说，若群体中所有成员都偏好 $A$ 甚于 $B$（即每位成员都认为 $A$ 的期望效用高于 $B$），则聚合偏好（由聚合的概率—效用配对决定）应当满足这一偏好。既然这种“共识保持”是对聚合的合理要求，这一结果便表明，群体行动者的精确模型是有问题的。Walley 讨论了一个概率集的例子：其中每个概率代表群体一位成员的信念，于是 $P$ 是对每个行动者信念的不完备描述——其意义是：若 $P$ 中所有成员在某事上一致，则该事是每位行动者都相信的。概率集使我们得以表征一个在其判断上充满冲突的行动者（Levi 1986, 1999）[^levi-1986]。
    step2: |-
      倘若委员会成员的信度与效用彼此不一，那么任何有别于各行动者自身概率与效用的精确概率—效用配对，都无法满足 *Pareto condition*（帕累托条件，Seidenfeld, Kadane, and Schervish 1989）。帕累托条件要求群体偏好尊重群体内部的一致：若所有成员都偏好 $A$ 甚于 $B$（即都认为 $A$ 的期望效用高于 $B$），聚合偏好也应满足这一偏好。聚合偏好由聚合的概率—效用配对决定。既然这种“共识保持”是对聚合的合理要求，该结果便表明群体行动者的精确模型有毛病。Walley 讨论过一例概率集：其中每个概率代表群体一位成员的信念，于是 $P$ 对各行动者信念的描述并不完备——其义为：若 $P$ 中所有成员在某点上一致，该点便是每位行动者都相信的。概率集使我们能够表征一个在判断上 *conflicted*（充满冲突）的行动者（Levi 1986, 1999）[^levi-1986]。
