      Further, learning in the Bayesian model of belief is effected by *conditionalisation*. If you learn a proposition $E$ (and nothing further) then your post-learning belief in $X$ is given by $p(X\mid E) = p(X\cap E)/p(E)$.
    step1: |-
      此外，在贝叶斯信念模型中，学习通过 **条件化** 实现。如果你得知命题 $E$（且未得知其他任何东西），那么你学习之后对 $X$ 的信念由 $p(X\mid E) = p(X\cap E)/p(E)$ 给出。
    step2: |-
      此外，在贝叶斯信念模型中，学习通过 **条件化** 实现。如果你得知命题 $E$（且未得知其他任何东西），那么你学习之后对 $X$ 的信念由 $p(X\mid E) = p(X\cap E)/p(E)$ 给出。
  - id: 15
    kind: body
    source: |-
      The alternative approach that will be the main focus of this article is the approach that represents belief by a *set* of probability functions instead of a single probability. So instead of having some $p$ represent your belief state, you have $P$, a set of such functions. van Fraassen (1990)[^fraassen-1990] calls this your *representor*, Levi calls it a *credal set*. I will discuss various ways you might interpret the representor later but for now we can think of it as follows. Your representor is a *credal committee*: each probability function in it represents the opinions of one member of a committee that, collectively, represents your beliefs.
    step1: |-
      本文的主要关注点是另一条进路：它用概率函数的 **集合** 而非单一概率来表征信念。因此，不是由某个 $p$ 表征你的信念状态，而是由 $P$——一个由这类函数组成的集合——来表征。van Fraassen（1990）[^fraassen-1990] 称之为你的 **表征集**（representor），Levi 称之为 **信度集**（credal set）。后文将讨论解释表征集的各种方式。眼下可以这样理解：你的表征集是一个 **信度委员会**，其中每个概率函数代表委员会一名成员的意见，而委员会集体地表征你的信念。
    step2: |-
      本文的主要关注点是另一条进路：它用概率函数的 **集合** 而非单一概率来表征信念。因此，不是由某个 $p$ 表征你的信念状态，而是由 $P$——一个由这类函数组成的集合——来表征。van Fraassen（1990）[^fraassen-1990] 称之为你的 **表征集**（representor），Levi 称之为 **信度集**（credal set）。后文将讨论解释表征集的各种方式。眼下可以这样理解：你的表征集是一个 **信度委员会**，其中每个概率函数代表委员会一名成员的意见，而委员会集体地表征你的信念。
