      Strictly speaking, what we have here is only half the story. There *is* a difference between the representations of belief as regards weight and balance. But that still leaves open the question of exactly what is representing the weight of evidence? What aspect of the belief reflects this difference? One might be tempted to view $\overline{P}(H)-\underline{P}(H)$ as a measure of the weight of evidence for $H$. Walley (1991)[^walley-1991] tentatively suggests as much. However, this would get wrong cases of conflicting evidence. (Imagine two equally reliable witnesses: one tells you the coin is biased towards heads, the other says the bias is towards tails.) The question of whether and how IP does better than precise probabilism has not yet received an adequate answer. Researchers in IP have, however, made progress on distinguishing cases where your beliefs happen to have certain symmetry properties from cases where your beliefs capture evidence about symmetries in the objects of belief. This *is* a distinction that the standard precise model of belief fails to capture (de Cooman and Miranda 2007)[^cooman-2007].
    step1: |-
      严格说来，我们在这里看到的只是故事的一半。信念表征在权重与平衡方面 **确实** 存在差异。但这仍然留下一个问题：究竟什么在表征证据权重？信念的哪个方面反映了这一差异？人们可能倾向于把 $\overline{P}(H)-\underline{P}(H)$ 视为 $H$ 的证据权重的度量。Walley（1991）[^walley-1991] 试探性地提出了这一看法。然而，这会在证据冲突的情形中判断有误。（设想两位同样可靠的证人：一位告诉你硬币偏向正面，另一位说偏向反面。）IP 是否以及如何优于精确概率论，这一问题尚未得到充分回答。不过，IP 研究者已在区分两类情形上取得进展：一类是你的信念恰好具有某些对称性质，另一类是你的信念捕捉了关于信念对象中对称性的证据。后一种区分 **确实** 是标准精确信念模型未能捕捉的（de Cooman and Miranda 2007）[^cooman-2007]。
