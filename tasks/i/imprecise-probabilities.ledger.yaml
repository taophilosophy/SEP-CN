      Isaac Levi (1974, 1985)[^levi-1974][^levi-1985] makes a distinction between “imprecise” credences and “indeterminate” credences (the scare quotes are indicating that these aren’t uses of the terms “imprecise” and “indeterminate” that accord with the usage I adopt in this article). The idea is that there are two distinct kinds of belief state that might require a move to an IP representation of belief. An “imprecise” belief in Levi’s terminology is an imperfectly introspected or elicited belief in mine, while an “indeterminate” belief is a (possibly) perfectly introspected belief that is still indeterminate or unspecific (or both). Levi argues that the interesting phenomenon is “indeterminate” credence. Walley (1991)[^walley-1991] also emphasises the distinction between cases where there is a “correct” but unknown probability from cases of “indeterminacy”.
    step1: |-
      Isaac Levi（1974, 1985）[^levi-1974][^levi-1985] 区分了“非精确的”信度与“非确定的”信度（引号表示：他所谓“非精确”“非确定”，与本文用法并不一致）。其想法是：有两类不同的信念状态，可能都需要转向 IP 的信念表征。在 Levi 的术语中，“非精确的”信念，在本文术语中就是不完美内省或不完美引出的信念；而“非确定的”信念则是（可能）被完美内省、却仍然非确定或不具体（或二者兼有）的信念。Levi 主张，有趣的现象是“非确定的”信度。Walley（1991）[^walley-1991] 也强调，要区分存在“正确”但未知概率的情形与“非确定性”情形。
    step2: |-
      Isaac Levi（1974, 1985）[^levi-1974][^levi-1985] 区分了“非精确的”信度与“非确定的”信度（引号表示：他所谓“非精确”“非确定”，与本文用法并不一致）。其想法是：有两类不同的信念状态，可能都需要转向 IP 的信念表征。在 Levi 的术语中，“非精确的”信念，在本文术语中就是不完美内省或不完美引出的信念；而“非确定的”信念则是（可能）被完美内省、却仍然非确定或不具体（或二者兼有）的信念。Levi 主张，有趣的现象是“非确定的”信度。Walley（1991）[^walley-1991] 也强调，要区分存在“正确”但未知概率的情形与“非确定性”情形。
