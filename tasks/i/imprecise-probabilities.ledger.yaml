      Since you are in a state of ignorance with respect to $X$, your representor contains probabilities that take $Y$ to be good evidence that $H$ and probabilities that take $Y$ to be good evidence that $\neg H$. So, despite the fact that $P(H)=\{1/2\}$ we have $P(H\mid Y) = [0,1]$. This phenomenon—posteriors being wider than their priors—is known as dilation. The phenomenon has been thoroughly investigated in the mathematical literature (Walley 1991; Seidenfeld and Wasserman 1993; Herron, Seidenfeld, and Wasserman 1994; Pedersen and Wheeler 2014)[^herron-1994][^pedersen-2014][^pedersen-2014-2][^seidenfeld-1994][^seidenfeld-1993][^walley-1991][^wheeler-2014]. Levi and Seidenfeld reported an example of dilation to Good following Good (1967)[^good-1967]. Good mentioned this correspondence in his follow up paper (Good 1974)[^good-1974]. Recent interest in dilation in the philosophical community has been generated by White’s paper (White 2010)[^white-2010].
    step1: |-
      由于你对 $X$ 处于无知状态，你的表征集包含这样一些概率：它们把 $Y$ 视为 $H$ 的良好证据；也包含这样一些概率：它们把 $Y$ 视为 $\neg H$ 的良好证据。因此，尽管 $P(H)=\{1/2\}$，却有 $P(H\mid Y) = [0,1]$。这一现象——后验比先验更宽——被称为膨胀。数学文献已对这种现象作了透彻研究（Walley 1991; Seidenfeld and Wasserman 1993; Herron, Seidenfeld, and Wasserman 1994; Pedersen and Wheeler 2014）[^herron-1994][^pedersen-2014][^pedersen-2014-2][^seidenfeld-1994][^seidenfeld-1993][^walley-1991][^wheeler-2014]。Levi 与 Seidenfeld 在 Good（1967）[^good-1967] 之后向 Good 报告了一个膨胀例子。Good 在其后续论文中提到了这一对应关系（Good 1974）[^good-1974]。哲学界近来对膨胀的兴趣，由 White 的论文引发（White 2010）[^white-2010]。
    step2: |-
