      Suppose we wanted our epistemology to apply not just to individuals, but to “group agents” like committees, governments, companies, and so on. Such agents may be made up of members who disagree. Levi (1986, 1999)[^levi-1986][^levi-1999] has argued that representation of such conflict is better handled with sets of probabilities than with precise probabilities. There is a rich literature on combining or aggregating the (probabilistic) opinions of members of groups (Genest and Zidek 1986)[^genest-1986] but the outcome of such aggregation does not adequately represent the *disagreement* among the group. Some forms of aggregation also fail to respect plausible constraints on group belief. For example, if every member of the group agrees that $X$ and $Y$ are probabilistically independent, then it seems plausible to require that the group belief respects this unanimity. It is, however, well known that linear pooling—a simple and popular form of aggregation—does not respect this desideratum. Consider two probability functions $p, q$ such that $p(X) = p(Y) = 1/3$ and $p(X\mid Y)=p(X)$ while $q(X) = q(Y) = 2/3$ and $q(X\mid Y)=q(X)$. Consider aggregating these two probabilities by taking an unweighted average of them: $r = p/2 + q/2$. Now, calculation shows that $r(X\cap Y) = 5/18$ while $r(X)r(Y) = 1/4$, thus demonstrating that $r$ does not consider $X$ and $Y$ to be independent. So such an aggregation method does not satisfy the above desideratum (Kyburg and Pittarelli 1992; Cozman 2012)[^cozman-2012][^kyburg-1992]. For more on judgement aggregation in groups, see List and Pettit (2011), especially chapter 2.
    step1: |-
      假设我们希望自己的认识论不仅适用于个体，也适用于“群体行动者”，如委员会、政府、公司等。这类行动者可能由意见不合的成员组成。Levi（1986, 1999）[^levi-1986][^levi-1999] 主张，这种冲突用概率集来表征比用精确概率更好。关于合并或聚合群体成员（概率性）意见的文献很丰富（Genest and Zidek 1986）[^genest-1986]，但聚合的结果不能充分表征群体内部的 **分歧**。某些聚合形式也无法尊重对群体信念的合理约束。例如，如果群体每个成员都同意 $X$ 与 $Y$ 概率独立，那么要求群体信念尊重这一全体一致似乎是合理的。然而，众所周知，线性池化——一种简单而流行的聚合形式——并不尊重这一要求。考虑两个概率函数 $p, q$，满足 $p(X) = p(Y) = 1/3$ 且 $p(X\mid Y)=p(X)$，而 $q(X) = q(Y) = 2/3$ 且 $q(X\mid Y)=q(X)$。考虑取二者的无权平均来聚合：$r = p/2 + q/2$。计算表明 $r(X\cap Y) = 5/18$，而 $r(X)r(Y) = 1/4$，从而证明 $r$ 并不认为 $X$ 与 $Y$ 独立。因此，这种聚合方法不满足上述要求（Kyburg and Pittarelli 1992; Cozman 2012）[^cozman-2012][^kyburg-1992]。关于群体中的判断聚合，见 List and Pettit（2011），尤其是第 2 章。
