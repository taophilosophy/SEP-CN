      我想给出这一想法的几个例子。首先考虑某个物理过程，它没有极限频率，但其频率不断变化，始终处于某个区间之内。这将是一个随机但相当可预测的过程。对这样一个系统，最好的描述也许就是给其相对频率加上界。这类过程已用 IP 模型研究过（Kumar and Fine 1985; Grize and Fine 1987; Fine 1988）[^fine-1988][^grize-1987][^kumar-1985]，并作为信度非精确性的一个潜在来源被讨论过（Hájek and Smithson 2012）[^hájek-2012]。对量子力学事件的某种非标准理解，自然导向上概率模型（Suppes and Zanotti 1991; Hartmann and Suppes 2010）[^hartmann-2010][^suppes-1991]。John Norton 讨论过概率论作为归纳逻辑的限度，所用的例子他声称容许不了任何合理的概率态度（Norton 2007, 2008a,b）[^norton-2007]。人们或许希望 IP 能提供一种沿着 Norton 所勾勒思路的归纳逻辑。Norton 本人对这条路线表示怀疑（Norton 2007）[^norton-2007]，不过 Benétreau-Dupin（2015）曾为 IP 作为 Norton 计划的一个候选系统辩护。最后，关于模糊性的某些观点很可能促使人们重新思考机遇的形式结构（Bradley 2016）[^bradley-2016][^bradley-2016-2]。
