      Wheeler (2014)[^wheeler-2014] criticises Sturgeon on this “character matching” thesis. However, an argument for IP based on the nature of evidence only requires that the character of the evidence sometimes allows (or mandates?) imprecise belief and not that the characters must always match. In opposition, Schoenfield (2012)[^schoenfield-2012] argues that evidence always supports precise credence, but that for reasons of limited computational capacity, real agents needn’t be required to have precise credences. However, her argument only really supports the claim that *sometimes* indeterminacy is due to complexity of the evidence and computational complexity. She doesn’t have an argument against the claims Levi, Kaplan, Joyce and others make that there are evidential situations that warrant imprecise attitudes.
    step1: |-
      Wheeler（2014）[^wheeler-2014] 批评 Sturgeon 的这一“性质匹配”论题。然而，基于证据本性的 IP 论证只要求证据的性质有时允许（或要求？）非精确信念，而不要求二者的性质始终匹配。相反，Schoenfield（2012）[^schoenfield-2012] 主张证据始终支持精确信度，但出于计算能力有限，不必要求现实行动者持有精确信度。然而，她的论证实际上只支持这一主张：**有时** 非确定性源于证据的复杂性与计算复杂性。她并未论证反对 Levi、Kaplan、Joyce 等人所主张的：存在一些证据情境，它们保证非精确态度。
