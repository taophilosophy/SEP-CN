      Joyce (2011)[^joyce-2011] and Rinard (2013)[^rinard-2013] have both discussed this problem. Rinard’s solution to it is to argue that this shows that the vacuous prior is never a legitimate state of belief. Or rather, that we only ever need to model your beliefs using non-vacuous priors, even if these are incomplete descriptions of your belief state. This is similar to Walley’s “non-exhaustive” representation of belief. Vallinder (2018)[^vallinder-2018] suggests that the problem of belief inertia is quite a general one. Castro and Hart (forthcoming) use the looming danger of belief inertia to argue against what I have called an "objectivist" interpretation of IP.
    step1: |-
      Joyce（2011）[^joyce-2011] 与 Rinard（2013）[^rinard-2013] 都讨论过这个问题。Rinard 的解决办法是主张：这表明空洞先验从来不是合法的信念状态；或者说，我们始终只需用非空洞先验来建模你的信念，即便这些先验是对你信念状态的不完备描述。这类似 Walley 的“非穷尽”信念表征。Vallinder（2018）[^vallinder-2018] 提出，信念惰性问题相当普遍。Castro 与 Hart（即出）利用信念惰性的迫近危险，来反对我所谓的 IP “客观主义”解释。
