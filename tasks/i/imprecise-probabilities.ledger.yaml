      What if the objective chances were not probabilities? If we endorse some kind of connection between known objective chances and belief—for example, a principle of direct inference or Lewis’ Principal Principle (Lewis 1986)[^lewis-1986]—then we might have an additional reason to endorse imprecise probabilism. It seems to be a truth universally acknowledged that chances ought to be probabilities, but it is a “truth” for which very little argument has been offered. For example, Schaffer (2007) makes obeying the probability axioms one of the things required in order to play the “chance role”, but offers no argument that this should be the case. Joyce says “some have held objective chances are not probabilities. This seems unlikely, but explaining why would take us too far afield” (2009: 279, fn.17). Various other discussions of chance—for example in statistical mechanics (Loewer 2001; Frigg 2008)[^frigg-2008][^loewer-2001] or “Humean chance” (Lewis 1986, 1994)[^lewis-1986]—take for granted that chances should be precise and probabilistic (Dardashti et al. 2014 is an exception)[^dardashti-2014]. Obviously things are confused by the use of the concept of chance as a way of interpreting probability theory. There is, however, a perfectly good pre-theoretic notion of chance: this is what probability theory was originally invented to reason about, after all. This pre-theoretic chance still seems like the sort of thing that we should apportion our belief to, in some sense. And there is very little argument that chances must always be probabilities. If the chances were nonprobabilistic in a particular way, one might argue that your credences ought to be nonprobabilistic in the same way. What form a chance-coordination norm should take if chances and credences were to have non-probabilistic formal structures is currently an open problem.
    step1: |-
      若客观机遇不是概率，会怎样？若我们认可已知客观机遇与信念之间的某种联系——例如直接推断原则或 Lewis 的 Principal Principle（Lewis 1986）[^lewis-1986]——那么我们可能就有了认可非精确概率主义的额外理由。机遇应当是概率，这似乎是人人公认的真理，但为此给出的论证却少得可怜。例如，Schaffer（2007）把服从概率公理列为扮演“机遇角色”所必需的事情之一，却没有论证为何应当如此。Joyce 说：“有些人主张客观机遇不是概率。这看来不太可能，但解释其缘由会使我们离题太远”（2009: 279, 注 17）。关于机遇的其他各种讨论——例如统计力学中的（Loewer 2001; Frigg 2008）[^frigg-2008][^loewer-2001] 或“休谟式机遇”（Lewis 1986, 1994）[^lewis-1986]——都把机遇应当精确且是概率的这一点视为理所当然（Dardashti et al. 2014 是例外）[^dardashti-2014]。显然，由于“机遇”概念被用作解释概率论的一种方式，事情变得混乱了。然而，有一个完全站得住脚的前理论机遇概念：毕竟概率论最初就是为了对之推理而发明的。这种前理论的机遇，在某种意义上仍像是我们应当把信念分配于其上的东西。而“机遇必须始终是概率”这一主张，几乎没有论证。若机遇以某种特定方式是非概率的，人们就可以论证：你的信度也应当以同样的方式是非概率的。当机遇与信度都具有非概率的形式结构时，机遇—信度协调规范应当采取何种形式，目前仍是一个开放问题。
    step2: |-
      倘若客观机遇不是概率，情形会如何？只要我们认可以下这类联系——已知的客观机遇与信念之间的直接推断原则，或 Lewis 的 Principal Principle（主要原则，Lewis 1986）[^lewis-1986]——便又多了一条认可非精确概率主义的理由。“机遇应当是概率”仿佛是一条人皆认可的真理，可为之给出的论证却少得可怜。例如 Schaffer（2007）把服从概率公理列为扮演“机遇角色”的必要条件之一，却未论证何以必须如此。Joyce 亦坦言：“有人主张客观机遇不是概率。这看似不太可能，但要解释个中缘由，会把我们带得太远”（2009: 279, 注 17）。关于机遇的其他讨论——诸如统计力学中的机遇（Loewer 2001; Frigg 2008）[^frigg-2008][^loewer-2001]，或“休谟式机遇”（Lewis 1986, 1994）[^lewis-1986]——大多径自假定机遇应当精确而合乎概率（Dardashti et al. 2014 属例外）[^dardashti-2014]。事情的混乱，显然与把“机遇”概念当作解释概率论的手段有关。然而，前理论的机遇概念本身完全站得住：概率论最初正是为了对之推理而发明的。这种前理论的机遇，在某种意义上仍是我们应当分配信念的对象。而“机遇必定始终是概率”一说，几乎没有论证支撑。倘若机遇以某种特定方式为非概率的，便可主张你的信度也应以同样方式为非概率的。至于当机遇与信度都具非概率的形式结构时，机遇—信度协调规范该取何种形式，眼下仍是开放问题。
