      Inspired by the famous “Bertrand paradox”, Chandler (2014)[^chandler-2014] offers a neat argument that the precise probabilist cannot jointly satisfy two desiderata relating to suspension of judgment about a variable. First desideratum: if you suspend judgement about the value of a bounded real variable $X$, then it seems that different intervals of possible values for $X$ of the same size should be treated the same by your epistemic state. Second desideratum: if $Y$ essentially describes the same quantity as $X$, then suspension of judgement about $X$ should entail suspension of judgement about $Y$. Let’s imagine now that you have precise probabilities and that you suspend judgement about $X$. By the first desideratum, you have a uniform distribution over values of $X$. Now consider $Y = 1/X$. $Y$ essentially describes the same quantity that $X$ did. But a uniform distribution over $X$ entails a non-uniform distribution over $Y$. So you do not suspend judgement over $Y$. A real-world case of variables so related is “ice residence time in clouds” and “ice fall rate in clouds”. These are inversely related, but describe essentially the same element of a climate system (Stainforth et al. 2007: 2154)[^stainforth-2007].
    step1: |-
      受著名的“伯特兰悖论”启发，Chandler（2014）[^chandler-2014] 给出了一个简洁论证：精确概率论者无法同时满足关于某个变量悬置判断的两项要求。第一项要求：你若对某个有界实变量 $X$ 的取值悬置判断，你的认知状态就应当同等对待 $X$ 可能取值中大小相同的不同区间。第二项要求：如果 $Y$ 本质上描述与 $X$ 相同的量，那么对 $X$ 悬置判断应当蕴含对 $Y$ 悬置判断。现在设想你持有精确概率，并且对 $X$ 悬置判断。按第一项要求，你在 $X$ 的取值上有均匀分布。现在考虑 $Y = 1/X$。$Y$ 本质上描述与 $X$ 相同的量。但 $X$ 上的均匀分布蕴含 $Y$ 上的非均匀分布。所以你对 $Y$ 并未悬置判断。现实中有这样一对变量：“云中冰滞留时间”与“云中冰降落速率”。二者成反比，却描述气候系统中本质上相同的要素（Stainforth et al. 2007: 2154）[^stainforth-2007]。
