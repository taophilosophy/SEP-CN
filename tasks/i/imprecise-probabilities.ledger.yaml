      Further, learning in the Bayesian model of belief is effected by *conditionalisation*. If you learn a proposition $E$ (and nothing further) then your post-learning belief in $X$ is given by $p(X\mid E) = p(X\cap E)/p(E)$.
    step1: |-
      此外，在贝叶斯信念模型中，学习通过 *conditionalisation* 来实现。如果你得知命题 $E$（此外别无所知），那么你学习之后对 $X$ 的信念由 $p(X\mid E) = p(X\cap E)/p(E)$ 给出。
    step2: |-
      再者，贝叶斯信念模型中的学习通过 *conditionalisation*（条件化）来完成。若你获知命题 $E$（此外无他），则学习之后你对 $X$ 的信念为 $p(X\mid E) = p(X\cap E)/p(E)$。
