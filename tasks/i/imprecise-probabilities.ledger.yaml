      As Steele (2007)[^steele-2007] points out, the above analysis rationalises the Ellsberg choices only if we are dealing with genuinely indeterminate or unspecific beliefs. If we were dealing with a case of imperfectly introspected belief then there would exist some $p$ in the representor such that rational choices maximise $E_{p}$. For the Ellsberg choices, there is no such $p$.
    step1: |-
      Steele（2007）[^steele-2007] 指出，上述分析只有在我们处理的是真正非确定或不具体的信念时，才能把 Ellsberg 选择合理化。如果我们处理的是不完美内省的信念，那么表征集里会存在某个 $p$，使理性选择最大化 $E_{p}$。就 Ellsberg 选择而言，不存在这样的 $p$。
