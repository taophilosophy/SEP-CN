      概率论是一门成果极丰的理论，其应用几乎遍及每一个科学分支。在哲学中，概率论的某些重要应用以“贝叶斯主义”之名著称；这一纲领极为成功（例如见 Howson and Urbach 2006; Bovens and Hartmann 2003; Talbott 2008）[^bovens-2003][^howson-2006][^talbott-2008]。然而，概率论似乎向信念提出了远比其应分更为丰富、更为确定的要求。对于“全球平均地表温度到 2080 年将升高四度以上”这一事件，你的理性置信度应当是多少？或许是 0.75？为什么不是 0.75001？为什么不是 0.7497？这一事件比“掷两枚公平硬币至少出现一次正面”更可能，还是更不可能？看来有许多事件，我们可以（也许还应当）对之持有比正统概率所允许的更不精确的态度。质疑正统的理由之一在于：坚持信念状态必须由单一实值概率函数来表征，是一种相当不切实际的理想化，并会带来若干颇为棘手的后果，后文将会讨论。其实，人们早已认识到，概率论所提供的只是一个相当理想化的信念模型。早在十九世纪中叶，乔治·布尔（George Boole）就说过：
