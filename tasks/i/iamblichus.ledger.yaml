      杨布里科斯对《范畴篇》的解经（尤其是他对诸等级结构之属的说明以及他对类比的使用）照亮了他哲学的其他领域，并构成《答波菲利》中他对波菲利神圣等级说明之批判的背景（见 Chiaradonna 2023: 138–162）[^chiaradonna-2023]。在《答波菲利》中，杨布里科斯指斥波菲利对神圣等级的说明是误导性的，因为波菲利把诸神圣存在者的类当作排在同一属之下、并由充当种差的“特性”（*idiōmata*）所规定的种（《答波菲利》I, 4 [SS-2013: 7.21–8.6]）[^ss--2013]。如此一来，波菲利毁掉了等级观念本身：*divine*（神圣的）成了被谓述于其一切种的公共属，正如*animal*（动物）被谓述于（比如说）*horse*（马）与*dog*（狗）。与波菲利相对，杨布里科斯要求对逻辑概念作一种有节制的使用，使不同类神圣存在者之间的等级关系变得清晰。每一层级都作为整体而区别于其他层级，而非如同一个公共属之下的不同种那样被划分。如前所述，在《范畴篇》解读中，杨布里科斯主张：属是一种等级关系，其中来自不同层级的诸项以类比的方式关联于其本源。这可以与杨布里科斯在《答波菲利》中所说平行而观：
