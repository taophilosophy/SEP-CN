      There is also another hint in support of this interpretation. Damascius explicitly states that according to Iamblichus divinity is closely correlated to degrees of unity: the intelligible gods are “crystallised, as it were, around the One” (*De principiis* II, 36.17). According to this conception, the higher a god is situated on the scale of reality, the more “unified” and undifferentiated it is, and the less accessible to the intellect and to conceptual knowledge: one can only know such realities by resorting to intuition. This doctrine is hinted at in various passages of Iamblichus’ *Reply to Porphyry* (where unity, “friendship”—*philia*—and goodness are all described as fundamental attributes of the gods: “whatever Being might be in them, this is equivalent to their unity”, I, 19 [SS-2013: 45.8–10])[^ss--2013] and is also compatible with his stressing the fact that knowledge of the gods is innate, lying as it does within the heart of every individual (I, 3 [SS-2013: 5.14–20])[^ss--2013]. From an historical point of view, this gradual diffusion of unity also represents a major contribution to the representation of reality as a continuum, thereby somewhat bridging the rift that, following Plotinus, had emerged between the One and the Intellect. “Unification” too (*henōsis*) also becomes a key philosophical term, and this opens up the possibility of an anti-intellectual slant, as can be found in a famous extract of the *Reply to Porphyry* (II, 11 [SS-2013: 73.1–16])[^ss--2013].
        step1: |-
      支持这一解释还有另一条线索。达马斯基乌斯明确陈述：依杨布里科斯，神性与统一性的程度紧密相关——理知诸神“可以说是在太一周围结晶而成”（《论第一原理》II, 36.17）。按照这一观念，一位神在实在的等级中位置越高，就越“统一”、越无分化，也越不为人智与概念知识所及：人们只有诉诸直觉才能认识这类实在。这一学说在《答波菲利》的多处段落中有所暗示（其中统一性、“友爱”——*philia*——与善都被描述为诸神的根本属性：“无论存在在他们之中可能是什么，这都等同于他们的统一性”，I, 19 [SS-2013: 45.8–10]）[^ss--2013]；它也与杨布里科斯强调对诸神的知识是天赋的、内在于每个个体心中这一事实相容（I, 3 [SS-2013: 5.14–20]）[^ss--2013]。从历史的角度看，这种统一性的渐次扩散也是对实在之连续体表象的重大贡献，从而多少弥合了自普罗提诺以来出现于太一与努斯之间的裂隙。“统一化”（*henōsis*）同样成为一个关键哲学术语，而这开启了某种反理智倾向的可能，正如《答波菲利》一处著名段落所示（II, 11 [SS-2013: 73.1–16]）[^ss--2013]。
        step2: |-
      支持上述解释还有另一条线索。达马斯基乌斯明确指出：依杨布里科斯，神性与统一性的程度紧密相关；理知诸神“可以说是在太一周围结晶而成”（《论第一原理》II, 36.17）。按这一观念，一位神在实在等级中的位置越高，就越“统一”、越无分化，也越难为人智与概念知识所把握：唯有诉诸直觉，方能认识这类实在。此说在《答波菲利》多处段落中已有端倪（其中统一性、“友爱”——*philia*——与善皆被列为诸神的根本属性：“无论存在在他们之中是什么，这都等同于他们的统一性”，I, 19 [SS-2013: 45.8–10]）[^ss--2013]；这也与他强调对诸神的知识乃天赋、内在于每个个体心中相合（I, 3 [SS-2013: 5.14–20]）[^ss--2013]。从历史角度看，这种统一性的渐次弥散，又是对实在之连续体表象的一大贡献：它多少弥合了普罗提诺以降横亘于太一与努斯之间的裂隙。“统一化”（*henōsis*）也由此成为关键哲学术语，并开启了某种反理智倾向的可能——《答波菲利》一处著名段落即其例证（II, 11 [SS-2013: 73.1–16]）[^ss--2013]。
