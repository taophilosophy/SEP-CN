      Iamblichus’ work exerted a very profound influence on the subsequent course of Neoplatonic philosophy. In particular, he stands out as an important theologian owing to the shift he brought about with respect to Plotinianism. With Iamblichus, Plotinus’ economical approach to metaphysical principles was developed into full-fledged metaphysical laws: in this respect, Iamblichus emerges as a remote forerunner of Medieval scholasticism. He himself vindicated a “scientific theology” (*Reply to Porphyry* I, 4 [SS-2013: 10.18])[^ss--2013] and established a canon of texts that gave it the justification of tradition.
        step1: |-
      杨布里科斯的著作对此后新柏拉图哲学的进程施加了极为深刻的影响。特别值得一提的是，由于他相对普罗提诺主义造成的转向，他卓然立于重要神学家之列。经由杨布里科斯，普罗提诺对形而上学本原的节俭处理发展为一整套完备的形而上学法则：就此而言，杨布里科斯是中世纪经院哲学的一位远祖。他本人倡导一种“科学神学”（《答波菲利》I, 4 [SS-2013: 10.18]）[^ss--2013]，并确立了一个文本正典，使这一神学获得传统的证成。
        step2: |-
      杨布里科斯的著作对此后新柏拉图哲学的进程影响至深。尤其因他相对普罗提诺主义促成的转向，他卓然立于重要神学家之列。经他之手，普罗提诺对形而上学本原的节俭处理，扩展为一整套完备的形而上学法则；就此而言，杨布里科斯堪称中世纪经院哲学的远祖。他本人倡导一种“科学神学”（《答波菲利》I, 4 [SS-2013: 10.18]）[^ss--2013]，并立定一个文本正典，使这门神学获得传统的证成。
