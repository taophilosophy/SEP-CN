      A picture of Late Antique philosophy jumping from Iamblichus to Proclus would however be misleading. Actually, more than one century separates Iamblichus’ death from the foundation of the Neoplatonist school at Athens by Plutarch of Athens. Some crucial details escape us: for example, we don’t even know how and when Iamblichus’ teaching entered the philosophical schools in Athens (Goulet 2012)[^goulet-2012]. In addition to this, Iamblichus’ posterity in the fourth century does not suggest that his philosophical approach was immediately and unanimously followed. Praechter (1910) regarded those disciples of Iamblichus’ who settled in Pergamon, gathering around Iamblichus’ student Aedesius, as forming a school (the “school of Pergamon”), where rational methods were abandoned in favor of theurgy and religious practices. In addition, these philosophers are sometimes regarded as forming an ideologically engaged Pagan group threatened by Christian persecution after Constantine. Such views are somewhat oversimplistic. Our main source for reconstructing this phase of Neoplatonism is Eunapius’ *Lives of Philosophers and Sophists* (Goulet 2014)[^goulet-2014]. As already noted, Eunapius is a tendentious source, with his own hagiographical agenda and with little taste for philosophical technicalities. Whatever we make of this, he says that Iamblichus’ students formed a large crowd and that those who were eager to learn flocked to him from all parts (see Eunapius *Lives* VI, 4 [Goulet 2014: 12–14])[^goulet-2014]. This and other passages suggest that Pagan philosophical teaching definitely did not go underground under and after Constantine (the elite of the Roman Empire was still largely Pagan at that time). Eunapius’ list of Iamblichus’ students confirms the echo of his teaching: the list includes Sopater the Syrian (see above, Section 1.1), Aedesius, Eustathius from Cappadocia, Theodorus, and Euphrasius (see Eunapius *Lives* V, 5 [Goulet 2014: 12.14–20])[^goulet-2014]. Among these, Theodorus is likely to coincide with Theodorus of Asine who, while being a student of Iamblichus, is said to have held different philosophical views and reverted to an intellectualist Platonism of the Plotinian sort. Aedesius’ school too certainly hosted different positions and internal debates. Thus Eusebius of Myndus was a member of that school, but apparently held an attitude closer to that of Plotinus and he was inclined to reject theurgical and magical practices. On the other hand, theurgy was adopted by Aedesius’ Iamblichean disciples such as Chrysanthius of Sardis, Maximus of Ephesus, and Priscus of Thesprotia. Maximus and Priscus were charismatic figures who are mainly known as masters and counsellors of the Emperor Julian (Julian studied philosophy at Pergamon around 350). Iamblichus’ teaching actually forms the philosophical background of Julian’s project of restoration of Paganism, as shown by Julian’s own writings (see De Vita 2011) and by the short treatise *On the Gods and the Cosmos* by one Salustius (possibly Saturninius Secundus Salutius, a dignitary at Julian’s court). It is worth noting, however, that even committed theurgists like Maximus did not abandon rational methods (we know about Maximus’ work on Aristotle’s *Categories* and *Prior Analytics*).
        step1: |-
      然而，一幅从杨布里科斯直接跳到普罗克洛斯的古代晚期哲学图景会引人误解。实际上，杨布里科斯去世与雅典的普鲁塔克（Plutarch of Athens）创建雅典新柏拉图主义学园之间，相隔一个多世纪。一些关键细节我们无从知晓：例如，我们甚至不知道杨布里科斯的学说如何、何时进入雅典的哲学学园（Goulet 2012）[^goulet-2012]。此外，杨布里科斯在四世纪的后学状况并不表明其哲学取径立刻得到一致追随。普雷希特（Praechter 1910）把那些聚拢在杨布里科斯弟子埃德西乌斯（Aedesius）周围、定居帕加马的弟子们视为一个学派（“帕加马学派”），在那里理性方法被弃置，转而倚重通神术与宗教实践。此外，这些哲学家有时被视为一个在意识形态上投入的异教团体，在君士坦丁之后受到基督教迫害的威胁。这类看法有些过于简单化。我们重构新柏拉图主义这一阶段的主要来源是欧纳皮乌斯的《哲人与智者传》（Goulet 2014）[^goulet-2014]。如前所述，欧纳皮乌斯是一个有倾向性的来源，自有其圣徒传式的议程，且对哲学技术细节兴致寥寥。无论我们如何评判，他说杨布里科斯的学生聚成一大群，渴望学习的人从各地涌向他（见欧纳皮乌斯《哲人与智者传》VI, 4 [Goulet 2014: 12–14]）[^goulet-2014]。这一段与其他段落表明，异教哲学教学在君士坦丁治下及其后肯定没有转入地下（当时罗马帝国的精英大多仍是异教徒）。欧纳皮乌斯的杨布里科斯学生名单印证了其教学的回响：名单包括叙利亚人索帕特（见上文 1.1 节）、埃德西乌斯、来自卡帕多基亚的欧斯塔提乌斯（Eustathius）、狄奥多鲁斯（Theodorus）与欧弗拉西乌斯（Euphrasius）（见欧纳皮乌斯《哲人与智者传》V, 5 [Goulet 2014: 12.14–20]）[^goulet-2014]。其中，狄奥多鲁斯很可能就是阿西内的狄奥多鲁斯（Theodorus of Asine）；他虽是杨布里科斯的弟子，却据说持不同的哲学观点，退回到普罗提诺式的理智主义柏拉图主义。埃德西乌斯的学园也无疑容纳了不同的立场与内部辩论。例如，缪恩杜斯的优西比乌（Eusebius of Myndus）是该学园的成员，但态度显然更接近普罗提诺，并倾向于拒斥通神术与魔法实践。另一方面，通神术则被埃德西乌斯的扬布里柯斯派弟子们采纳，如萨迪斯的克吕桑提乌斯（Chrysanthius of Sardis）、以弗所的马克西穆斯（Maximus of Ephesus）与特斯普罗提亚的普里斯库斯（Priscus of Thesprotia）。马克西穆斯与普里斯库斯是魅力型人物，主要作为皇帝尤利安的师傅与顾问而为人所知（尤利安约于 350 年在帕加马学习哲学）。杨布里科斯的学说实际上构成了尤利安复兴异教计划的哲学背景，尤利安本人的著作为此作证（见 De Vita 2011），一位名叫萨卢斯提乌斯（Salustius）者（可能即萨图尔尼尼乌斯·塞昆杜斯·萨卢提乌斯，尤利安宫廷的一位显贵）的短论《论诸神与宇宙》亦然。然而值得注意的是，即便是马克西穆斯这样虔诚的通神术师也没有放弃理性方法（我们知道马克西穆斯著有关于亚里士多德《范畴篇》与《前分析篇》的作品）。
        step2: |-
      不过，一幅从杨布里科斯一步跨到普罗克洛斯的古代晚期哲学图景，会引人误解。事实上，从杨布里科斯辞世到雅典的普鲁塔克（Plutarch of Athens）创建雅典新柏拉图主义学园，相隔一个多世纪。若干关键细节我们无从把握：例如，我们甚至不知道杨布里科斯的学说于何时、以何种方式进入雅典的哲学学园（Goulet 2012）[^goulet-2012]。此外，四世纪中杨布里科斯后学的状况也不表明其哲学取径立刻赢得一致追随。普雷希特（Praechter 1910）把定居帕加马、聚拢在杨布里科斯弟子埃德西乌斯（Aedesius）周围的那些弟子视为一个学派（“帕加马学派”），认为在那里理性方法被弃置，取而代之的是通神术与宗教实践。此外，这些哲学家有时又被当作一个意识形态上高度投入的异教团体，在君士坦丁之后处于基督教迫害的威胁之下。这类看法不免失之简单。我们重构新柏拉图主义这一阶段的主要依据是欧纳皮乌斯的《哲人与智者传》（Goulet 2014）[^goulet-2014]。如前所述，欧纳皮乌斯是一个有倾向性的来源：自有圣徒传式的议程，对哲学的技术细节也兴味索然。姑且不论如何评价，他确实说到杨布里科斯的学生聚成一大群，渴望向学之人从四方涌来（见欧纳皮乌斯《哲人与智者传》VI, 4 [Goulet 2014: 12–14]）[^goulet-2014]。这一段与其他段落表明，异教哲学教学在君士坦丁治下及其后并未转入地下（当时罗马帝国的精英大多仍是异教徒）。欧纳皮乌斯所列的杨布里科斯弟子名单印证了其教学的回响：名单中有叙利亚人索帕特（见上文 1.1 节）、埃德西乌斯、来自卡帕多基亚的欧斯塔提乌斯（Eustathius）、狄奥多鲁斯（Theodorus）与欧弗拉西乌斯（Euphrasius）（见欧纳皮乌斯《哲人与智者传》V, 5 [Goulet 2014: 12.14–20]）[^goulet-2014]。其中，狄奥多鲁斯很可能就是阿西内的狄奥多鲁斯（Theodorus of Asine）：他虽师从杨布里科斯，却据说持不同见解，退回到普罗提诺式的理智主义柏拉图主义。埃德西乌斯的学园无疑也容纳不同的立场与内部论辩。例如，缪恩杜斯的优西比乌（Eusebius of Myndus）即是该学园成员，但态度显然更近于普罗提诺，倾向于拒斥通神术与魔法实践。另一方面，通神术为埃德西乌斯门下的扬布里柯斯派弟子所采纳，如萨迪斯的克吕桑提乌斯（Chrysanthius of Sardis）、以弗所的马克西穆斯（Maximus of Ephesus）与特斯普罗提亚的普里斯库斯（Priscus of Thesprotia）。马克西穆斯与普里斯库斯皆魅力人物，主要以皇帝尤利安的师傅与顾问身份为人所知（尤利安约于 350 年在帕加马研习哲学）。杨布里科斯的学说实际上构成了尤利安复兴异教之事业的哲学底色：尤利安本人的著述为证（见 De Vita 2011），一位名叫萨卢斯提乌斯（Salustius）者（可能即尤利安宫廷显贵萨图尔尼尼乌斯·塞昆杜斯·萨卢提乌斯，Saturninius Secundus Salutius）的短论《论诸神与宇宙》亦然。不过值得注意：即便是马克西穆斯这样虔诚的通神术师，也未曾放弃理性方法（我们知道马克西穆斯撰有关于亚里士多德《范畴篇》与《前分析篇》的著作）。
