    source: |-
      Little is known about Iamblichus’ life and career, since Eunapius of Sardis’ biography of Iamblichus (*Lives of Philosophers and Sophists* V [Goulet 2014, Baltussen 2023])[^goulet-2014][^baltussen-2023] is merely hagiographical in nature. His birthplace is traditionally taken to be Chalcis ad Belum (modern Qinnasrin), although support has been voiced in favor of a different Chalcis, Chalcis sub Libanum (Aliquot 2010: 307 and n. 7)[^aliquot-2010]. What is uncontroversial is that Iamblichus hailed from a very influential Syrian family, the Sampsigeramids of Emesa (Damascius, *Philosophical History*, Athanassiadi 1999: 334.10–14 [Zintzen 1967: 2.8–10])[^athanassiadi-1999][^zintzen-1967], who had gained access to the Imperial throne along with Elagabalus (218–222).
        step1: |-
      人们对杨布里科斯的生平与事业所知甚少，因为萨迪斯的欧纳皮乌斯（Eunapius of Sardis）为其所作的传记（《哲人与智者传》V [Goulet 2014, Baltussen 2023]）[^goulet-2014][^baltussen-2023]本质上只是圣徒传式的文字。他的出生地传统上被认为是贝尔河畔的哈尔基斯（今基纳斯林），但也有学者支持另一处哈尔基斯，即黎巴嫩山麓的哈尔基斯（Aliquot 2010: 307 及注 7）[^aliquot-2010]。无可争议的是，杨布里科斯出身于一个极具势力的叙利亚家族——埃梅萨的萨姆西格拉米德家族（Damascius, 《哲学史》, Athanassiadi 1999: 334.10–14 [Zintzen 1967: 2.8–10]）[^athanassiadi-1999][^zintzen-1967]，该家族曾与埃拉伽巴路斯（218–222）一同问鼎皇位。
        step2: |-
      关于杨布里科斯的生平与事业，我们所知甚少：萨迪斯的欧纳皮乌斯（Eunapius of Sardis）为他所作的传记（《哲人与智者传》V [Goulet 2014, Baltussen 2023]）[^goulet-2014][^baltussen-2023]本质上只是圣徒传式的文字。他的出生地传统上被认定为贝尔河畔的哈尔基斯（今基纳斯林），也有论者支持另一处哈尔基斯，即黎巴嫩山麓的哈尔基斯（Aliquot 2010: 307 及注 7）[^aliquot-2010]。不过有一点无可争议：杨布里科斯出自一个极具势力的叙利亚家族——埃梅萨的萨姆西格拉米德家族（Damascius, 《哲学史》, Athanassiadi 1999: 334.10–14 [Zintzen 1967: 2.8–10]）[^athanassiadi-1999][^zintzen-1967]，该家族曾与埃拉伽巴路斯（218–222）一同问鼎帝国皇位。
