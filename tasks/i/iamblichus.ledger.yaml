      Neoplatonism has often been regarded as a theological and other-worldly philosophy which assigns little (if any) significance to politics and conceives of ethics merely as an ascetic path for the separation of the soul from the body. This view has been questioned by D.J. O’Meara and the significance of Neoplatonist political philosophy is gaining increasing attention (see O’Meara 2003; Schramm 2013)[^o’meara-2003][^schramm-2013]. Iamblichus wrote a whole treatise *On virtues*, which is lost but whose content can be inferred from later sources. In addition to this, references to ethics and politics can be gathered from his extant works, especially the letters preserved by Johannes Stobaeus (see DP-2009; TP-2010)[^dp--2009][^tp--2010]. It is a notable fact that some of Iamblichus’ interlocutors were influential figures in the fourth-century Roman empire, as is for example the case with Sopater of Apamea (see above, Section 1.1). It is somewhat difficult to clearly grasp Iamblichus’ position on these issues, since his treatise on virtues is lost, the later testimonia are cursory and Iamblichus’ letters are for the most part introductory and refrain from philosophical technicalities.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      The extant evidence nonetheless suffices to outline some of Iamblichus’ views. Two letters focus on providence, fate and free will against the background of Iamblichus’ account of causation, which sees the One as the principle of all being and the lower levels of reality as characterized by increasing degrees of multiplicity (see the letters to Macedonius and Sopater: Johannes Stobaeus I, 5, 17 and I, 5, 18). Iamblichus identifies the sphere of operation of fate with nature, i.e., “the immanent causal principle of the cosmos and that which immanently comprises the totality of causes of the realm of generation” (DP-2009: 35)[^dp--2009]. These views are reminiscent of the Stoic deterministic model of causation, but Iamblichus also emphasises that the soul contains within itself a free and independent life and is able to emancipate itself from worldly influences (see Johannes Stobaeus I, 8, 45a).
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      This theological and metaphysical framework also grounds Iamblichus’ views about politics. In his letters he describes the art of rulership as a kind of divinisation based on wisdom: through wisdom human beings are assimilated to gods and political rulership is an image of divine rulership in cosmos (see Johannes Stobaeus III, 3, 26). Leadership is connected with philanthropy, which makes the ruler mild, pleasant and approachable. Such views outline a characteristically theocratic conception. Elsewhere, however, Iamblichus suggests a more modest view about rulership: he emphasises the importance of law, which he sees as the genuine expression of a divine model, the ruler being only its guardian (see Johannes Stobaeus IV, 5, 77). Such views can certainly be traced back to Plato: the passages about kingship can be set in parallel with Plato’s account of philosopher-kings in the *Republic*, whereas those about the primacy of laws obviously recall Plato’s political views in the *Laws*. But parallels are abundant even outside the Platonist tradition (e.g., in Stoicism and in Dio Chrysostomus, in the Pseudo-Pythagorean writings) and the introductory tone of Iamblichus’ letters makes it difficult to isolate characteristic Neoplatonist elements. According to some interpreters, however, Iamblichus’ interest in politics is likely to be connected to his views about the embodied soul. As O’Meara remarks,
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      > Human soul, alienated from its divine origins, finds its identity in its relation to body. As a consequence, the material, bodily aspects of the human condition were to be of much greater relevance for the divinization of soul in later Neoplatonism than in Plotinus. (2003: 39)
    step1: TBD
