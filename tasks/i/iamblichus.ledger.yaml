      ### 1.2 著作
  - id: 8
    kind: body
    source: |-
      Few of Iamblichus’ works are preserved in the direct manuscript tradition. Four of these texts pertain to a summa *On Pythagoreanism* (conflicting testimonies exist about its title: cf. O’Meara 1989: 32–33)[^o’meara-1989]: *On the Pythagorean Life*; the *Protrepticus*; *On General Mathematical Science*; and an *Introduction to Arithmetic* based on Nicomachus of Gerasa’s treatise of the same name. Sadly, they are for the most part impersonal works: the *Protrepticus* consists in lengthy quotations from previous hortatory literature, and its interest mostly lies in the fact that it provides evidence for valuable lost works (most notably Aristotle’s own *Protrepticus* and the so-called *Anonymus Iamblichi*), while *On the Pythagorean Life* plagiarizes previous biographies of the master, although it certainly contains valuable insights on Iamblichus’ conception of the “divine man”. Neither of these works seems to have had any impact over the subsequent course of philosophy, whereas *On General Mathematical Science* was at least a formative influence on Proclus’ commentary to Euclid’s *Elements*, as well as on Syrianus’ commentary on *Metaphysics* Μ–Ν (see DGU-2020)[^dgu--2020]. It also provides the basic material for the reconstruction of Iamblichus’ philosophy of mathematics (see below, Section 4). For a general characterization of *On Pythagoreanism* and its context, see Huffman (2006 [2019: sect. 4.4]).
        step1: |-
      杨布里科斯的著作很少以直接的手稿传统保存下来。其中四篇属于一部名为《论毕达哥拉斯主义》的总纲性著作（关于其书名证据相互冲突：参见 O'Meara 1989: 32–33）[^o'meara-1989]：《论毕达哥拉斯的生平》；《劝勉篇》；《论一般数学科学》；以及一部以杰拉萨的尼科马霍斯（Nicomachus of Gerasa）同名著作为基础的《算术引论》。遗憾的是，这些著作大都是非个人性的：《劝勉篇》由对前人劝勉文献的长篇征引组成，其价值主要在于它为珍贵的佚作（最著名的如亚里士多德本人的《劝勉篇》和所谓的《扬布里柯斯氏匿名者》）提供了证据；而《论毕达哥拉斯的生平》则剽窃了此前关于这位大师的传记，尽管它确实包含关于杨布里科斯“神圣之人”观念的宝贵洞见。这两部著作似乎都对此后的哲学进程没有产生什么影响，而《论一般数学科学》至少对普罗克洛斯的欧几里得《几何原本》注以及叙里亚努斯（Syrianus）的《形而上学》Μ–Ν 注形成了塑造性的影响（见 DGU-2020）[^dgu--2020]。它还为重构杨布里科斯的数学哲学提供了基本材料（见下文第 4 节）。关于《论毕达哥拉斯主义》及其语境的一般性刻画，参见 Huffman（2006 [2019: sect. 4.4]）。
        step2: |-
      杨布里科斯的著作很少经由直接的手稿传统传世。其中四种属于一部题为《论毕达哥拉斯主义》的总纲性著作（其书名诸证互有出入：参见 O'Meara 1989: 32–33）[^o'meara-1989]：《论毕达哥拉斯的生平》、《劝勉篇》、《论一般数学科学》，以及一部以杰拉萨的尼科马霍斯（Nicomachus of Gerasa）同名著作为蓝本的《算术引论》。可惜这些著作大多缺乏个人色彩：《劝勉篇》由前人劝勉文献的长篇征引缀成，其意义主要在于见证了多部珍贵的佚作（最要者如亚里士多德本人的《劝勉篇》与所谓《扬布里柯斯氏匿名者》）；《论毕达哥拉斯的生平》则大量袭用此前关于这位大师的传记，尽管其中确实含有关于杨布里科斯“神圣之人”观念的宝贵洞见。这两部书对此后的哲学进程似乎都无甚影响；相比之下，《论一般数学科学》至少塑造了普罗克洛斯的欧几里得《几何原本》注疏，也影响了叙里亚努斯（Syrianus）的《形而上学》Μ–Ν 注疏（见 DGU-2020）[^dgu--2020]。它还为重构杨布里科斯的数学哲学提供了基本材料（见下文第 4 节）。至于《论毕达哥拉斯主义》及其历史语境的一般性论述，参见 Huffman（2006 [2019: sect. 4.4]）。
