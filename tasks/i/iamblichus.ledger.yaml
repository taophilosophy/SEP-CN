      Whether Iamblichus introduced the doctrine of “henads” into the teachings of the Neoplatonic School remains controversial (see Clark 2010; Mesyats 2012; Opsomer in Opsomer et al. 2018: 1365–1366)[^opsomer-2018][^clark-2010][^mesyats-2012]. The henads (literally “unities”) are the very first plurality emanating from the One: since they are located beyond Being itself, they are meant to bridge the gap between the absolute One and the intelligible world. Iamblichean authorship of this theory would make it predate Syrianus and Proclus—its first explicit proponents—by almost a century, and indeed several hints point in that direction, in particular the fact that, according to Proclus, Iamblichus identified “God and the gods” as the subject of the first hypothesis of Plato’s *Parmenides*. These “gods” might be self-sufficient items located right below the One and, judging by the—admittedly very allusive—testimonies of Proclus (references in Saffrey & Westerink 1968–1997: III, pp. XVII–XXVI)[^saffrey-1968] and Damascius, might indifferently be called “henads” or “intelligible gods”, in contradiction with Syrianus’ and Proclus’ later terminological distinctions.
        step1: |-
      杨布里科斯是否把“诸一”（henads，字面义为“诸统一体”）学说引入了新柏拉图主义学派的教义，仍有争议（见 Clark 2010；Mesyats 2012；Opsomer, 载 Opsomer et al. 2018: 1365–1366）[^opsomer-2018][^clark-2010][^mesyats-2012]。诸一是从太一流溢而出的最初复多：由于它们被置于存在本身之外，其用意是在绝对的太一与理知世界之间架设桥梁。若此说确出杨布里科斯之手，它将比叙里亚努斯与普罗克洛斯——其最早明确的倡导者——早近一个世纪；而且若干线索确实指向这一方向，特别是如下事实：据普罗克洛斯，杨布里科斯把“神与诸神”认定为柏拉图《巴门尼德篇》第一假设的主题。这些“神”或许是恰位于太一之下、自足自在的存在项；而依据普罗克洛斯那些公认十分隐晦的证词（参考文献见 Saffrey & Westerink 1968–1997: III, pp. XVII–XXVI）[^saffrey-1968]与达马斯基乌斯，它们或许可以不加区分地称作“诸一”或“理知诸神”——这与叙里亚努斯和普罗克洛斯后来的术语区分相抵触。
        step2: |-
      杨布里科斯是否把“诸一”（henads，字面义为“诸统一体”）学说引入了新柏拉图主义学派的教义，至今聚讼未决（见 Clark 2010；Mesyats 2012；Opsomer, 载 Opsomer et al. 2018: 1365–1366）[^opsomer-2018][^clark-2010][^mesyats-2012]。诸一是自太一流出的最初复多：因其被置于存在本身之外，用意便是在绝对的太一与理知世界之间搭桥。倘若此说确出杨布里科斯，它将比叙里亚努斯与普罗克洛斯——这两人是其最早明确的倡导者——早出近一个世纪；也确有若干线索指向该方向，尤其据普罗克洛斯，杨布里科斯把“神与诸神”认定为柏拉图《巴门尼德篇》第一假设的主题。这些“神”或许是恰置于太一之下、自足自立的存在项；而依照普罗克洛斯那些公认极为隐晦的证词（文献见 Saffrey & Westerink 1968–1997: III, pp. XVII–XXVI）[^saffrey-1968]与达马斯基乌斯，它们尽可或称“诸一”、或称“理知诸神”——这与叙里亚努斯、普罗克洛斯后来的术语区隔有所抵牾。
