      Eunapius gives Anatolius and then Porphyry as Iamblichus’ two teachers, and there are no decisive reasons to doubt this: on the one hand, it is evident that he was influenced by the kind of theological arithmology Anatolius championed; on the other hand, Porphyry dedicated his treatise *On the “Know thyself”* to Iamblichus (Stobaeus, *Anthology* III, 21, 26) and provides information about the philosopher’s son (*Life of Plotinus* 9). Since this son is said by Porphyry to have married a Roman aristocrat, it is very likely that Iamblichus studied in Rome under Porphyry, who would have carried on the philosophical circle Plotinus had founded in 244. Dalsgaard Larsen’s (DL-1972: I, 38–39)[^dl--1972] supposition of a prolonged stay at Alexandria is dubious at best.
        step1: |-
      欧纳皮乌斯列出的杨布里科斯的两位老师，先是阿纳托利乌斯（Anatolius），然后是波菲利；我们没有决定性的理由怀疑这一点：一方面，他显然受到阿纳托利乌斯所倡导的那种神学数论的影响；另一方面，波菲利把自己的论文《论“认识你自己”》题献给杨布里科斯（斯托拜乌斯，《文选》III, 21, 26），并提供了这位哲学家之子的信息（《普罗提诺传》9）。由于波菲利说这个儿子娶了一位罗马贵族，杨布里科斯很可能是在罗马从波菲利受业，并由此接续了普罗提诺于 244 年创立的哲学圈子。达尔斯加德·拉森（DL-1972: I, 38–39）[^dl--1972]关于他长期逗留亚历山大里亚的猜想，充其量是可疑的。
        step2: |-
      据欧纳皮乌斯记载，杨布里科斯的老师先是阿纳托利乌斯（Anatolius），后是波菲利；我们没有决定性的理由怀疑这一说法。一方面，他显然受到了阿纳托利乌斯所倡导的那类神学数论的影响；另一方面，波菲利曾把专文《论“认识你自己”》题献给杨布里科斯（斯托拜乌斯，《文选》III, 21, 26），并传下了这位哲学家之子的信息（《普罗提诺传》9）。既然波菲利说到这个儿子娶了罗马贵族之女，杨布里科斯就很可能是赴罗马从波菲利受业，从而接续了普罗提诺 244 年创立的哲学圈子。至于达尔斯加德·拉森（DL-1972: I, 38–39）[^dl--1972]所设想的长期逗留亚历山大里亚，则至多存疑。
