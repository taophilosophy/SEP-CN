    source: |-
      Iamblichus’ significance in Late Antique philosophy can hardly be overestimated. Karl Praechter described him as the second founder of Neoplatonism after Plotinus and argued that Iamblichus’ position was similar to that of Chrysippus in ancient Stoicism (Praechter 1910: 143)[^praechter-1910]. This statement aptly expresses Iamblichus’ historical and philosophical significance, but needs qualification: unlike the Stoa, “Neoplatonism” is not an ancient philosophical school, but a modern historical category (whose reliability scholars are sometimes inclined to question: see Catana 2013)[^catana-2013]. Iamblichus is likely, as was mentioned above (Section 1.1) to have been a student of Porphyry who was, in turn, a student of Plotinus. Iamblichus’ school was, however, separate from that of Plotinus, both in time and in place: consequently, despite late, ideological attempts to reconstruct a continuous “golden chain” of Neoplatonist exegetes (see, e.g., Hierocles, *De Providentia*, *apud* Photius cod. 214, 173 a; Proclus, *Platonic Theology* I, p. 6.16–7.8), there is no institutional continuity between Plotinus and Iamblichus and, from this point of view, the situation is different from that of the ancient Stoa. Iamblichus is not the second founder of the Neoplatonic school for the simple reason that there is no unitary Neoplatonic school in Late Antiquity. What scholars call Greek Neoplatonism is actually a multifaceted philosophical movement that covers some three centuries and includes several schools scattered throughout the Roman Empire: these schools certainly shared doctrines and methods, but their relations were sometimes close, sometimes much more tenuous. Certainly, Iamblichus accepts and further develops some distinctive features of Plotinus’ philosophy and he can be seen as a follower of Plotinus and Porphyry: this holds in particular for Iamblichus’ general metaphysical and philosophical approach, for his account of the One and of the first principles, for his exegesis of some works such as Plato’s *Parmenides* and Aristotle’s *Categories*. On the other hand, Iamblichus’ original position *vis-à-vis* Plotinus and Porphyry emerges clearly with respect to both his theories and his methods (see Taormina 1999)[^taormina-1999].
        step1: |-
      杨布里科斯在古代晚期哲学中的重要性，无论如何估计都不过分。卡尔·普雷希特（Karl Praechter）称他为普罗提诺之后新柏拉图主义的第二奠基人，并认为杨布里科斯的地位类似于克吕西波在古代斯多葛主义中的地位（Praechter 1910: 143）[^praechter-1910]。这一说法恰当地表达了杨布里科斯的历史与哲学意义，但需要限定：与斯多亚学派不同，“新柏拉图主义”并不是一个古代哲学学派，而是一个现代史学范畴（学者们有时倾向于质疑这一范畴的可靠性：见 Catana 2013）[^catana-2013]。如上所述（1.1 节），杨布里科斯很可能是波菲利的弟子，而波菲利又是普罗提诺的弟子。然而，杨布里科斯的学校无论在时间上还是地点上都与普罗提诺的学校分开：因此，尽管晚期有人出于意识形态的动机试图重构一条连续的新柏拉图主义解经家的“金链”（例如见希罗克勒斯（Hierocles），《论天意》，载佛提乌（Photius）cod. 214, 173 a；普罗克洛斯，《柏拉图神学》I, p. 6.16–7.8），但普罗提诺与杨布里科斯之间并不存在建制上的连续性；从这个角度看，情况不同于古代斯多亚学派。杨布里科斯并不是新柏拉图主义学派的第二奠基人，原因很简单：古代晚期并不存在一个统一的新柏拉图主义学派。学者们所谓的希腊新柏拉图主义，实际上是一个多面向的哲学运动，绵延约三个世纪，包括散布于罗马帝国各处的若干学派：这些学派固然共享一些学说与方法，但它们之间的关系有时紧密，有时则相当疏远。诚然，杨布里科斯接受并进一步发展了普罗提诺哲学的某些独特特征，可以被视为普罗提诺与波菲利的后学：这尤其体现在杨布里科斯总体的形而上学与哲学取径上，体现在他对太一与最初本原的论述上，也体现在他对某些著作——如柏拉图《巴门尼德篇》与亚里士多德《范畴篇》——的解经上。另一方面，杨布里科斯相对于普罗提诺与波菲利的独创立场，在其理论与方法两方面都清晰地显现出来（见 Taormina 1999）[^taormina-1999]。
        step2: |-
      杨布里科斯在古代晚期哲学中的重要性，无论怎样估计都不为过。卡尔·普雷希特（Karl Praechter）称他为普罗提诺之后的新柏拉图主义第二奠基人，并把他的地位比作克吕西波之于古代斯多葛主义（Praechter 1910: 143）[^praechter-1910]。这一定位恰切地表达了杨布里科斯的历史与哲学分量，但须加限定：与斯多亚学派不同，“新柏拉图主义”并非古代哲学学派，而是一个现代史学范畴（学者们有时会质疑这一范畴的可靠性：见 Catana 2013）[^catana-2013]。如上所述（1.1 节），杨布里科斯很可能是波菲利的弟子，而波菲利又师承普罗提诺。然而，杨布里科斯的学园无论在时间上还是地点上都与普罗提诺的学园彼此分立。因此，尽管晚期有人出于意识形态动机，试图把历代新柏拉图主义解经家重构为一条绵延不断的“金链”（例如希罗克勒斯（Hierocles）《论天意》，载佛提乌（Photius）cod. 214, 173 a；普罗克洛斯《柏拉图神学》I, p. 6.16–7.8），普罗提诺与杨布里科斯之间却并无建制上的连续性；就此而言，局面不同于古代斯多亚。杨布里科斯之所以算不上新柏拉图主义学派的第二奠基人，理由很简单：古代晚期本无一个统一的新柏拉图主义学派。学者们所说的希腊新柏拉图主义，实则是一场面向多元的哲学运动，绵延约三个世纪，囊括散布于罗马帝国各地的若干学派：它们固然共享一些学说与方法，彼此的关系却时密时疏。诚然，杨布里科斯接受并进一步发展了普罗提诺哲学的若干独特之处，可视为普罗提诺与波菲利的后学：这尤其体现在他总体的形而上学与哲学取径上，体现在他对太一与最初本原的论述上，也体现在他对柏拉图《巴门尼德篇》、亚里士多德《范畴篇》等著作的解经上。但另一方面，杨布里科斯相对于普罗提诺与波菲利的独创立场，无论在学说还是在方法上都清晰可辨（见 Taormina 1999）[^taormina-1999]。
