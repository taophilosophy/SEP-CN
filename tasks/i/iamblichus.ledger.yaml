      In order to assess Iamblichus’ reliability as a witness of ancient Pythagoreanism, one has to take into account a variety of factors, including his attitude towards the information available to him (ranging from literal dependence to creative elaboration for his own ideological and systematic purposes). This is crucial, since the *Pythagorean Life* in particular is one of our major sources on this subject (for details, see the studies collected in Huffman 2014; von Albrecht et al. 2002)[^albrecht-2002][^huffman-2014].
        step1: |-
      要评估杨布里科斯作为古代毕达哥拉斯主义见证者的可靠性，必须把多种因素考虑在内，其中包括他对可得信息的态度（从字面依赖到为自己的意识形态与体系目标而作的创造性加工，程度不等）。这一点至关重要，因为《论毕达哥拉斯的生平》尤其是我们关于这一主题的主要来源之一（详情见 Huffman 2014 所集论文；von Albrecht et al. 2002）[^albrecht-2002][^huffman-2014]。
