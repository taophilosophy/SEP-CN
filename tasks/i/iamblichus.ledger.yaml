      Four overarching principles govern Iamblichus’ exegetical practice. First, the idea that every authoritative work is fully self-consistent and strives to demonstrate a certain thesis which acts as its “goal” or “target” (*skopos*). This principle is applied rigorously: for instance, since the *skopos* of the *Timaeus* is the theory of nature, this means that even the work’s prologue, however autonomous it may seem at first glance, should be interpreted in this way (*In Timaeum* [D-1973: Fr. 3]). This amounts to considering literary works living organisms, in accordance with what Plato writes in *Phaedrus* 264C (see Coulter 1976: 73)[^coulter-1976]. Guidelines to determining a given work’s *skopos* are found in a late anonymous composition, the *Prolegomena to Platonic Philosophy* (§§ 21–23).
        step1: |-
      四条总纲性的原则支配着杨布里科斯的解经实践。第一，每一部权威著作都完全自洽，并力图论证某一个充当其“目标”或“鹄的”（*skopos*）的论题。这一原则被严格地贯彻：例如，既然《蒂迈欧篇》的论旨是自然理论，这就意味着，即便该书的序言乍看起来再怎么自成一体，也应当循此来解读（《蒂迈欧注》[D-1973: Fr. 3]）。这相当于把文学作品视为活的机体，与柏拉图在《斐德罗篇》264C 中所写的一致（见 Coulter 1976: 73）[^coulter-1976]。判定一部著作论旨的指导原则，见于晚期一部匿名著作《柏拉图哲学导论》（§§ 21–23）。
        step2: |-
      四条总纲性原则支配着杨布里科斯的解经实践。其一，每一部权威著作都完全自洽，且力图论证某个充当其“目标”或“鹄的”（*skopos*）的论题。这条原则被执行得一丝不苟：例如，既然《蒂迈欧篇》的论旨是自然理论，那么即便其序言乍看之下何等独立成章，也必须依循这一论旨来解读（《蒂迈欧注》[D-1973: Fr. 3]）。这等于把文学作品当作活的机体来看待，正与柏拉图《斐德罗篇》264C 所言相合（见 Coulter 1976: 73）[^coulter-1976]。至于如何判定一部著作的论旨，相关指导原则见于晚期一部匿名著作《柏拉图哲学导论》（§§ 21–23）。
