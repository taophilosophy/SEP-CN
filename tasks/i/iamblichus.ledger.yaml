      Through a comparison between Julian and Proclus (see Lecerf 2012)[^lecerf-2012], one may conclude that Iamblichus had conceived of a variety of Demiurges, the main one (identified with Zeus) acting as a principle or “monad” for the others. While Zeus creates the world insofar as it is governed by rational laws and populated with beings pertaining to species and genera (themselves of intelligible nature), other demiurgic entities are tasked with informing matter and bodies (which undergo a process of generation and corruption) according to such laws.
        step1: |-
      通过尤利安与普罗克洛斯的比较（见 Lecerf 2012）[^lecerf-2012]，可以得出：杨布里科斯构想过众多的巨匠造物主，其中主要者（与宙斯等同）充当其他诸神的本原或“单子”。宙斯在世界的运转服从理性法则、并栖居着属于种与属（其本身具有理知本性）的存在者的意义上创造世界；而其他创世性实体则受命依这些法则赋予质料与形体（它们经历生成与朽坏的过程）以形式。
        step2: |-
      把尤利安与普罗克洛斯加以比较（见 Lecerf 2012）[^lecerf-2012]，可以推知：杨布里科斯构想过众多巨匠造物主，其中主位者（与宙斯等同）充当其余诸神的本原或“单子”。就世界受理性法则支配、栖居着隶属种与属（这些种属本身具有理知本性）的存在者而言，世界由宙斯创造；而其他创世性实体的职分，则是依循这些法则，赋予质料与形体——它们历经生成与朽坏——以形式。
