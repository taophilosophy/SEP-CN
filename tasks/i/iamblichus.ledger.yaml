      In fact, Neoplatonist philosophical ideas shaped not only Iamblichus’ views about politics, but also those of the Emperor Julian, whose Neoplatonist background (ultimately deriving from the Iamblichean teaching of his masters at Pergamon) informs both his account of law and rulership (see Julian’s *Letter to Themistius*) and his theological foundation of the Roman Empire (Elm 2012)[^elm-2012].
