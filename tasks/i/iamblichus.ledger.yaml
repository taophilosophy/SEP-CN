      杨布里科斯的解读典型地包括对亚里士多德这部论著之“鹄的”（*skopos*〔论旨〕）的界定：他认为该论著关注的是表义表达式，就其经由概念指示事物而言（见 Hoffmann 1987）[^hoffmann-1987]。这一看法并不新鲜：辛普里丘把它追溯到始于早期逍遥学派注疏家的前人传统（辛普里丘，《范畴篇注》13.15–18）。然而，杨布里科斯添加了两个独特特征。第一，他对亚里士多德论著的鹄的给出了更系统的说明（例如，波菲利也主张《范畴篇》关注简单的表义表达式，就其指示事物而言；但据我们所知，他没有提及概念）。除此之外，杨布里科斯关于语义学的讨论纳入了一种以新柏拉图主义形而上学与心理学为根基的语言与意指理论（辛普里丘，《范畴篇注》12.16–13.12：见 Griffin 2012）[^griffin-2012]。杨布里科斯诉诸类比（*analogia*）来解释亚里士多德的范畴学说如何也能适用于理知存在者。例如，辛普里丘报道说：依杨布里科斯，“在数量上是一且同一却又接受相反者”这一属性（参亚里士多德，《范畴篇》5, 4a10–11）经由类比（*kata analogian*，辛普里丘，《范畴篇注》116.25–26 [DL-1972: Fr. 33]）[^dl--1972]适用于实体的一切层级（可感的与理知的皆是）：在理知实体中，相反者同时属于实体；而在可感实体中，它们相继存在。相应地，存在的不同层级显示出相应的结构（等级中越低的层级意味着越大的复多与散布）。这一形而上学框架说明了杨布里科斯关于属与谓述的观点。杨布里科斯对先前的逍遥学派传统持批判态度：他批评阿弗罗狄西亚的亚历山大（Alexander of Aphrodisias）误把形体与无形体的存在者当作排在同一属（即实体*ousia*）之下的种（辛普里丘，《范畴篇注》83.20–23 [DL-1972: Fr. 24]）[^dl--1972]。杨布里科斯的要点是：逍遥学派对《范畴篇》的解读没有顾及实在的等级结构。依他之见，应当充分重视属的等级观念，即把属看作自本原而来的派生统一体（实际上，属既是本原本身，又是依系于该本原的各项的等级）。这一结构并不意味着排于同一属下的各层级共享任何公共项。毋宁说，不同而等级有序的诸层级经由类比相连，以致低层级映照高层级，却不与其共享任何公共项。于是，类比使杨布里科斯得以把其形而上学的两个互补方面结合起来：一方面是分隔诸存在层级的纵向等级，另一方面是把诸层级连为一个统一整体的连续性。杨布里科斯的取径见于他对本质谓述或同名谓述（同一范畴内诸项的谓述）的说明。波菲利曾论证：在这种谓述中，主词与谓词指称两个不同的项，即*akatakakton*（不协调者/未分配者）与*katatetagmenon*（协调者/已分配者）（辛普里丘，《范畴篇注》53.6–9；79.24–30）。这些表达式的含义有争议。“已分配的属”要等同于为诸个别者所共享的*in re*（在物之中）普遍者；未分配者则或是分离的、柏拉图式的*ante rem*（先于物）普遍者，或是抽象的*post rem*（后于物）普遍概念。无论我们如何评价波菲利的观点，杨布里科斯都从波菲利的解经出发而赋予其不同的取向（见 Chiaradonna 2023: 138–162）[^chiaradonna-2023]。如此，杨布里科斯暗示：亚里士多德的本质谓述是表达形体存在者分有其超越诸属的一种方式（辛普里丘，《范畴篇注》53.9–18 [DL-1972: Fr. 16]）[^dl--1972]。更确切地说，“苏格拉底是人”表达的正是：形体的苏格拉底分有超越的人之理念。分离的诸属为本质谓述提供基础，尽管它们本身并不被恰当地谓述（被谓述的毋宁是被分有者）。有趣的是，杨布里科斯提到了*ptōsis*（“格”）这一术语，它与亚里士多德在《范畴篇》中对引申构词的说明相关联：*ptōsis*是一个词的屈折形式（如“语法的”或“勇敢的”），它与名词形式构成引申关系并从之派生（“语法的”与“勇敢的”都是形容词形式，分别派生自“语法”与“勇气”）。因此，杨布里科斯认为：在谓述句“苏格拉底是人”中，“人”不恰当地出现于谓述之中，而未用其*ptōsis*；此处他所指的或许是一个如“人的”这样的形容词构式。这样的引申形式将正确地指称苏格拉底对其超越理念的分有。辛普里丘也告诉我们，杨布里科斯聚焦于亚里士多德对运动与活动的说明：普罗提诺曾批评亚里士多德不把运动当作单一范畴，并主张可感存在者中的运动是完全活动的一种形式（辛普里丘，《范畴篇注》303.35–306.12 [DL-1972: Fr. 86]）[^dl--1972]。杨布里科斯拒绝普罗提诺的说明，旨在把亚里士多德对可感运动作为“不完善现实”的说明整合进一个柏拉图主义的哲学框架（见 Taormina 1999: 第三章）[^taormina-1999]。
