      Iamblichus already uses the terminology “hypercosmic” vs. “encosmic” or “pericosmic” (e.g., *Reply to Porphyry* VIII, 8 [SS-2013: 200.25–27])[^ss--2013], inherited from Middle Platonism but destined to become technical in later Neoplatonism. In anticipation of this later use, they are meant to bridge the gap between the Demiurge and the sublunar realm, although their exact role in Iamblichus remains unclear (the aforementioned passage speaks of the help they give to souls in their ascent). Such lower entities seem to be produced according to a geometric progression (cf. *In Timaeum* [D-1973: Fr. 79]). The terminological continuity allows one to conceive of Iamblichus’ system as the matrix for later variations, particularly Proclus’ one, although it is to be noted that no text bears witness to the presence of Proclus’ intermediate “intelligible-intellective” and “hypercosmic-encosmic” levels in Iamblichus.
        step1: |-
      杨布里科斯已经在使用“超宇宙的”对“宇宙内的”或“环宇宙的”这一术语（如《答波菲利》VIII, 8 [SS-2013: 200.25–27]）[^ss--2013]，这一对术语承自中期柏拉图主义，但注定要在后来的新柏拉图主义中成为术语。作为对这种后来用法的预演，它们意在弥合巨匠造物主与月下领域之间的鸿沟，尽管它们在杨布里科斯那里的确切作用仍不清楚（前引段落谈到它们如何帮助灵魂上升）。这些较低的存在者似乎按几何级数被产生（参《蒂迈欧注》[D-1973: Fr. 79]）。术语上的连续性使人可以把杨布里科斯的体系构想为后来诸变体——尤其是普罗克洛斯的体系——的母型；不过应当注意，没有任何文本见证普罗克洛斯那些中间的“理知—智性”与“超宇宙—宇宙内”层级存在于杨布里科斯。
