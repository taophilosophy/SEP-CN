      Iamblichus brought about a shift towards religion and theology in Neoplatonism which proved crucial for the later development of this movement and for its Christian appropriation (see Lecerf and Taormina 2022). The *Reply to Porphyry*, where Iamblichus rejects Porphyry’s over-confident intellectualism in theological and religious matters, is certainly our major source on debates in early Neoplatonism. Scholars have traditionally described Iamblichus’ stance as irrational, contrasting it with Plotinus and Porphyry’s rational and philosophical approach (see Dodds 1951: 285–298)[^dodds-1951]. Recent scholarship, however, has effectively questioned this view (see Tanaseanu-Döbler 2013)[^tanaseanu-döbler-2013]. In his *Reply to Porphyry* (I, 2 [SS-2013: 4.5–5.11])[^ss--2013] Iamblichus distinguishes three disciplines, each with its own distinctive methods: philosophy, theology, and theurgy. Theurgy certainly goes beyond reason and philosophy, but Iamblichus’ appeal to theurgy and rituals is based on sophisticated philosophical views and arguments dealing with the nature of divine beings and the status of human souls (see below, Section 6). It would therefore be misleading to draw a strict opposition between theurgy and rational methods. What is distinctive about Iamblichus *vis-à-vis* Plotinian Platonism is the thorough integration of theological traditions into his account of reality. This emerges in two related areas. Whether or not he wrote a work by this title, Iamblichus is the first Neoplatonist to develop a “Platonic theology” (see Proclus, *Platonic Theology* III, 44.1–5 [Saffrey & Westerink 1968–1997])[^saffrey-1968]. This approach will be carried further in Athenian Neoplatonism, especially by Proclus. Plotinus had already connected the hypotheses about the One in the second part of Plato’s *Parmenides* with his distinction of metaphysical principles (see *Enn.* V, 1.8). Iamblichus goes one step further in that he connects the metaphysical reading of this dialogue with the gods of the Greek pantheon. His interpretation of Plato’s *Parmenides* can therefore be described not only as “metaphysical” but also as “theological”. In addition to this, Iamblichus provides a harmonising account of the different theological traditions, again paving the way for the later developments in Athenian Neoplatonism (see below, Section 3.2). In his *Reply to Porphyry* Iamblichus establishes a triad of foundational traditions: the Egyptian, the Chaldaic and the Greek, represented by the philosophical wisdom of Pythagoras and Plato. The term “Chaldaic” refers to the *Chaldaean Oracles* (see above, Section 2.2). The extant evidence suggests that Plotinus and Porphyry accorded limited significance to the *Oracles* which, instead, become a crucial source for Iamblichus: he wrote an extensive commentary on this work and the revealed Platonizing theology of the *Oracles* is an integral part of his thought. The Egyptian tradition is represented by the so-called Hermetic books and, according to Iamblichus, this is the genuine source of Greek philosophy (*Reply to Porphyry* I, 2 [SS-2013: 4.7–9])[^ss--2013].
        step1: |-
      杨布里科斯在新柏拉图主义中促成了一次向宗教与神学的转折，这对该运动此后的发展及其被基督教的吸收都至关重要（见 Lecerf and Taormina 2022）。《答波菲利》中，杨布里科斯驳斥了波菲利在神学与宗教事务上过分自信的理智主义；它无疑是我们了解早期新柏拉图主义内部辩论的最重要来源。学界传统上把杨布里科斯的立场描述为非理性的，并与普罗提诺和波菲利理性而哲学的进路相对照（见 Dodds 1951: 285–298）[^dodds-1951]。然而晚近的研究已有效地质疑了这一看法（见 Tanaseanu-Döbler 2013）[^tanaseanu-döbler-2013]。在《答波菲利》（I, 2 [SS-2013: 4.5–5.11]）[^ss--2013]中，杨布里科斯区分了三门学科，每门各有其独特的方法：哲学、神学与通神术。通神术当然超出了理性与哲学，但杨布里科斯诉诸通神术与仪式，其根据是关于神圣存在者之本性以及人类灵魂之地位的一套精微的哲学观点与论证（见下文第 6 节）。因此，在通神术与理性方法之间画出一道截然的对立，会引人误入歧途。杨布里科斯相对于普罗提诺式柏拉图主义的独特之处，在于他把神学传统彻底整合进了自己的实在图景。这一点显现在两个相互关联的领域。无论是否写过以此为题的著作，杨布里科斯都是第一位发展出“柏拉图神学”的新柏拉图主义者（见普罗克洛斯，《柏拉图神学》III, 44.1–5 [Saffrey & Westerink 1968–1997]）[^saffrey-1968]。这一取径将在雅典新柏拉图主义中——尤其在普罗克洛斯那里——得到进一步推进。普罗提诺已把《巴门尼德篇》第二部分关于太一的诸假设与其形而上学本原的区分联系起来（见《九章集》V, 1.8）。杨布里科斯更进一步：他把这部对话的形而上学解读与希腊万神殿中的诸神联系起来。因此，他对柏拉图《巴门尼德篇》的解读不仅可以称为“形而上学的”，也可以称为“神学的”。除此之外，杨布里科斯对各种神学传统给出了一个调和性的说明，再次为雅典新柏拉图主义的后续发展铺平了道路（见下文 3.2 节）。在《答波菲利》中，杨布里科斯确立了三大奠基传统：埃及的、迦勒底的与希腊的，第三者以毕达哥拉斯与柏拉图的哲学智慧为代表。“迦勒底的”一词指《迦勒底神谕》（见上文 2.2 节）。现存的证据表明，普罗提诺与波菲利对《神谕》的评价有限；相反，它成了杨布里科斯的关键来源：他为这部著作写了浩繁的注疏，而《神谕》中启示性的、柏拉图化的神学是其思想的有机部分。埃及传统则由所谓的赫尔墨斯文集来代表；依杨布里科斯之见，这才是希腊哲学的真正源头（《答波菲利》I, 2 [SS-2013: 4.7–9]）[^ss--2013]。
        step2: |-
      杨布里科斯在新柏拉图主义中促成了一次转向宗教与神学的转折；这对该运动此后的走向、乃至它后来被基督教吸收，都至关重要（见 Lecerf and Taormina 2022）。在《答波菲利》中，杨布里科斯驳斥了波菲利在神学与宗教事务上过分自信的理智主义；此书无疑是我们了解早期新柏拉图主义内部论辩的头号文献。学界传统上把杨布里科斯的立场描述为非理性的，以之与普罗提诺和波菲利理性而哲学的进路相对照（见 Dodds 1951: 285–298）[^dodds-1951]。然而，晚近研究已对这一看法提出了有力质疑（见 Tanaseanu-Döbler 2013）[^tanaseanu-döbler-2013]。在《答波菲利》（I, 2 [SS-2013: 4.5–5.11]）[^ss--2013]中，杨布里科斯区分了三门学科，各门都有其独特方法：哲学、神学与通神术。通神术当然超越理性与哲学，但杨布里科斯对通神术与仪式的诉诸，是立足于一套精微的哲学观点与论证的，所涉正是神圣存在者的本性与人类灵魂的地位（见下文第 6 节）。因此，在通神术与理性方法之间画一道截然的对立，便会引人误入歧途。杨布里科斯区别于普罗提诺式柏拉图主义之处，在于他把神学传统彻底整合进自己的实在图景。这显现在两个相互关联的领域。且不论他是否写过以此为题的书，杨布里科斯都是第一位阐发“柏拉图神学”的新柏拉图主义者（见普罗克洛斯《柏拉图神学》III, 44.1–5 [Saffrey & Westerink 1968–1997]）[^saffrey-1968]。这一取径将在雅典新柏拉图主义中——尤其在普罗克洛斯那里——被继续推进。普罗提诺早已把《巴门尼德篇》第二部分关于太一的诸假设与其形而上学本原的区分勾连起来（见《九章集》V, 1.8）；杨布里科斯更进一步，把这部对话的形而上学解读与希腊万神殿的诸神勾连起来。于是，他对柏拉图《巴门尼德篇》的解读不仅可称“形而上学的”，也可称“神学的”。此外，杨布里科斯还为各神学传统给出调和性的说明，再度为雅典新柏拉图主义后来的发展铺路（见下文 3.2 节）。在《答波菲利》中，杨布里科斯立定了三大奠基传统：埃及的、迦勒底的与希腊的；第三者以毕达哥拉斯与柏拉图的哲学智慧为代表。“迦勒底的”一词指《迦勒底神谕》（见上文 2.2 节）。现存证据表明，普罗提诺与波菲利给《神谕》的分量有限；而在杨布里科斯那里，它却成了关键来源：他为这部书写下浩繁的注疏，《神谕》那启示性的、柏拉图化的神学由此成为其思想的有机部分。至于埃及传统，其代表是所谓的赫尔墨斯文集；依杨布里科斯之见，这才是希腊哲学的真正源头（《答波菲利》I, 2 [SS-2013: 4.7–9]）[^ss--2013]。
