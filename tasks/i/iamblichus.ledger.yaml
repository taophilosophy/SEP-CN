      The most important extant treatise by Iamblichus, however, is the *Reply of Master Abamon to Porphyry’s Letter to Anebo, and Solutions to the Difficulties Contained Therein* (abbreviated to *Reply to Porphyry* and traditionally known as *De mysteriis Ægyptiorum* since Marsilio Ficino’s original Latin translation: see SS-2013: ix–xxi)[^ss--2013]. The work is a defense of Pagan religious practice (sacrifice, prayer, divination etc.; on the latter, see Timotin 2022)[^timotin-2022] against the objections raised by Porphyry, and to serve this purpose it introduces several philosophical developments on the divine nature and orders, as well as the pretensions of the human soul. The whole debate is framed with a fictional Egyptian scenario: Porphyry had raised his objections in an epistle addressed to Anebo, an Egyptian priest, while Iamblichus wrote his reply under the assumed guise of the Egyptian prophet Abamon. While it had limited direct transmission (the only ancient testimonium being Proclus, *In Timaeum* I, 386.8–13 [D-1973: Fr. 38], although Taormina (2014) expressed reservations), its importance as a touchstone against which one can safely compare what can be gathered from other sources is invaluable.
        step1: |-
      然而，杨布里科斯现存最重要的论著是《阿巴蒙大师对波菲利致阿涅波书信的答复暨其中疑难之解答》（简称《答波菲利》；自马尔西利奥·费奇诺（Marsilio Ficino）的拉丁文首译以来，传统上以《论埃及秘仪》之名著称：参见 SS-2013: ix–xxi）[^ss--2013]。该著作是为异教宗教实践（献祭、祈祷、占卜等；关于后者参见 Timotin 2022）[^timotin-2022]辩护，以回应波菲利提出的诘难，并为此目的引入了关于神圣本性、神圣秩序以及人类灵魂之僭求的若干哲学进展。整场辩论被置于一个虚构的埃及场景之中：波菲利在致埃及祭司阿涅波（Anebo）的书信中提出诘难，而杨布里科斯则假托埃及先知阿巴蒙（Abamon）之名作答。此书的直接流传有限（古代唯一的证词是普罗克洛斯，《蒂迈欧注》I, 386.8–13 [D-1973: Fr. 38]，尽管 Taormina（2014）对此有所保留），但它作为试金石的价值无可估量——凭借它，我们可以稳妥地比较从其他来源收集到的东西。
        step2: |-
      不过，杨布里科斯现存最重要的论著是《阿巴蒙大师对波菲利致阿涅波书信的答复暨其中疑难之解答》（简称《答波菲利》；自费奇诺（Marsilio Ficino）首次拉丁译出以来，传统上以《论埃及秘仪》知名：参见 SS-2013: ix–xxi）[^ss--2013]。此书为异教宗教实践（献祭、祈祷、占卜等；占卜问题参见 Timotin 2022）[^timotin-2022]辩护，回击波菲利的种种诘难；为达成这一目的，它引入了关于神圣本性、诸神圣秩序以及人类灵魂之僭求的若干哲学进展。整场论辩被安放在一个虚构的埃及场景中：波菲利在致埃及祭司阿涅波（Anebo）的书信中提出诘难，杨布里科斯则假托埃及先知阿巴蒙（Abamon）之名作答。此书直接流传有限——古代唯一的见证是普罗克洛斯《蒂迈欧注》I, 386.8–13 [D-1973: Fr. 38]（Taormina（2014）对此有所保留）——然而，作为一块可据以稳妥比较其他来源所得信息的试金石，其价值无可估量。
