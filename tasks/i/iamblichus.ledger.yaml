      Iamblichus wrote an extensive commentary on the *Categories*, fragments of which have been preserved by Simplicius and Dexippus (a student of Iamblichus): in addition to literal quotes, Iamblichus is behind much of Simplicius’ extant exegesis of this treatise. We also have evidence that Iamblichus wrote a commentary on Aristotle’s *Prior Analytics* and we know about his exegetical work on the *De interpretatione* and the *De caelo* (see Opsomer 2015)[^opsomer-2015]. From the first century BC onwards, Platonist philosophers had been familiar with Aristotle’s *Categories*: Platonists such as Eudorus of Alexandria and Nicostratus raised objections against Aristotle’s doctrine; Plotinus wrote a very important treatise *On the Genera of Being,* where he critically discussed Aristotle’s categories (*Ennead* VI, 1–3). To the best of our knowledge, however, no Platonist wrote a commentary on Aristotle’s *Categories* before Porphyry, who was the author of two commentaries on this treatise: a short and extant elucidation in a question-and-answer format and a very extensive commentary in seven books dedicated to someone called Gedalius, which is now lost. In addition, Porphyry wrote an introduction to logic, the *Isagoge*, which is closely connected to the *Categories*. With Porphyry, then, Aristotle’s *Categories* became an integral part of the Platonist curriculum and this was a crucial move for the subsequent history of Late Antique and medieval philosophy. As is often the case, Iamblichus’ exegetical work relies on Porphyry but introduces some changes which are probably aimed to supplement (and possibly supplant) Porphyry’s approach. Simplicius informs us that Iamblichus followed the great and now lost commentary written by Porphyry, while adding two distinctive features. First Iamblichus “applied his Intellective Theory (*noera theōria*) everywhere, to almost all of the chapter-headings” (Simplicius, *In Categorias*, 2.13–15 [DL-1972: Fr. 2], trans. Chase; see Dillon 1997)[^dl--1972][^dillon-1997]. Iamblichus employs the same expression, *noera theōria* in the opening section of the *Reply to Porphyry* (I, 2 [SS-2013: 4.16])[^ss--2013], in a passage where he characterizes the mode of inquiry that is typical of theology. Secondly, Iamblichus took Archytas’ treatise *On the All* to be Aristotle’s source and he developed a thoroughly Pythagorising interpretation of the *Categories* (Simplicius, *In Categorias*, 2.15–25 [DL-1972: Fr. 2]; see Hoffmann 1980)[^dl--1972][^hoffmann-1980]. Archytas’ treatise is actually a forgery which scholars now date to the first century BC. Iamblichus, however, took it to be a genuine work by Archytas and in doing so he claimed a Pythagorean origin for Aristotle’s theory. To sum up, Iamblichus’ exegesis of the *Categories* was an integral part of his Pythagorean philosophical programme and in interpreting the *Categories* Iamblichus made use of his metaphysical and theological views. Apparently, Iamblichus pushed his reading of Aristotle along Platonic/Pythagorean lines so far that (as later sources report) he did not refrain from assuming that Aristotle was not opposed to Plato on the theory of Ideas (see Elias/David, *In Categorias*, 123.2–3).
        step1: |-
      杨布里科斯写了一部浩繁的《范畴篇》注，其残篇由辛普里丘与德克西普斯（Dexippus，杨布里科斯的学生）保存：除字面征引之外，辛普里丘现存的这部论著解经大半出自杨布里科斯。我们还有证据表明杨布里科斯注疏过亚里士多德的《前分析篇》，并且我们知道他对《解释篇》与《论天》的解经工作（见 Opsomer 2015）[^opsomer-2015]。自公元前一世纪起，柏拉图主义者已熟习亚里士多德的《范畴篇》：欧多鲁与尼科斯特拉图斯（Nicostratus）等柏拉图主义者曾对亚里士多德的学说提出异议；普罗提诺写有极重要的论文《论存在诸属》，其中批判性地讨论了亚里士多德的范畴（《九章集》VI, 1–3）。然而，据我们所知，在波菲利之前没有柏拉图主义者为亚里士多德《范畴篇》写过注疏；波菲利为此论著写过两部注：一部以问答形式写成的简短疏解，现存；另一部是献给一位名为盖达利乌斯（Gedalius）者的七卷浩繁注疏，今已亡佚。此外，波菲利还写有逻辑导论《导论》，它与《范畴篇》紧密相关。经由波菲利，亚里士多德的《范畴篇》成为柏拉图主义课程的整体部分；这对古代晚期与中世纪哲学的后续历史是关键一步。与常例相同，杨布里科斯的解经工作依赖波菲利，但引入了一些或许旨在补充（并可能取代）波菲利进路的变化。辛普里丘告诉我们，杨布里科斯追随波菲利那部伟大而今已亡佚的注疏，同时添加了两个独特特征。第一，杨布里科斯“把他的智性理论（*noera theōria*）到处应用于几乎所有的章节标题”（辛普里丘，《范畴篇注》2.13–15 [DL-1972: Fr. 2]，Chase 英译；见 Dillon 1997）[^dl--1972][^dillon-1997]。杨布里科斯在《答波菲利》的开篇部分（I, 2 [SS-2013: 4.16]）[^ss--2013]也使用同一表达式*noera theōria*，用以刻画神学特有的探究方式。第二，杨布里科斯把阿尔基塔斯的《论万有》当作亚里士多德的来源，并对《范畴篇》发展出一种彻底毕达哥拉斯化的解读（辛普里丘，《范畴篇注》2.15–25 [DL-1972: Fr. 2]；见 Hoffmann 1980）[^dl--1972][^hoffmann-1980]。阿尔基塔斯的这部论著实为伪作，学界今定其年代于公元前一世纪。然而，杨布里科斯视之为阿尔基塔斯的真作，并由此为亚里士多德的理论宣称一种毕达哥拉斯起源。总而言之，杨布里科斯对《范畴篇》的解经是其毕达哥拉斯哲学纲领的有机部分；在解读《范畴篇》时，杨布里科斯动用了他的形而上学与神学观点。显然，杨布里科斯把他对亚里士多德的解读沿柏拉图/毕达哥拉斯路线推进到如此地步，以至于（如后来来源所报道）他不忌讳假定亚里士多德在理念理论上并不反对柏拉图（见 Elias/David，《范畴篇注》123.2–3）。
        step2: |-
      杨布里科斯写过一部浩繁的《范畴篇》注，残篇由辛普里丘与德克西普斯（Dexippus，杨布里科斯的学生）保存。除字面征引外，辛普里丘现存的这部论著解经大半出自杨布里科斯之手。另有证据表明，杨布里科斯注疏过亚里士多德《前分析篇》；我们对他的《解释篇》与《论天》解经工作也有所知（见 Opsomer 2015）[^opsomer-2015]。自公元前一世纪起，柏拉图主义者便已熟习亚里士多德《范畴篇》：欧多鲁、尼科斯特拉图斯（Nicostratus）等柏拉图主义者曾对亚里士多德的学说提出异议；普罗提诺更写下极重要的《论存在诸属》，批判性地讨论亚里士多德的范畴（《九章集》VI, 1–3）。然而据我们所知，在波菲利之前，从未有柏拉图主义者为《范畴篇》作过注疏；而波菲利为此篇写过两部注：一部以问答体写就的简短疏解，尚存于世；另一部是献给一位名叫盖达利乌斯（Gedalius）者的七卷浩繁注疏，今已亡佚。此外，波菲利还著有逻辑导论《导论》，与《范畴篇》紧密相扣。经由波菲利，《范畴篇》遂成为柏拉图主义课程的固定部分；这对古代晚期与中世纪哲学的后续历史而言，是关键一步。一如常例，杨布里科斯的解经依傍波菲利，却引入若干变动，其用意或许是补充（乃至取代）波菲利的进路。辛普里丘告诉我们：杨布里科斯追随波菲利那部伟大而今亡佚的注疏，同时加上两个独特特征。其一，杨布里科斯“把他的智性理论（*noera theōria*）到处应用于几乎所有的章节标题”（辛普里丘《范畴篇注》2.13–15 [DL-1972: Fr. 2]，Chase 英译；见 Dillon 1997）[^dl--1972][^dillon-1997]。杨布里科斯在《答波菲利》开篇（I, 2 [SS-2013: 4.16]）[^ss--2013]也用了*noera theōria*这同一表达式，用以刻画神学特有的探究方式。其二，杨布里科斯把阿尔基塔斯的《论万有》奉为亚里士多德的来源，由此对《范畴篇》发展出一种彻底毕达哥拉斯化的解读（辛普里丘《范畴篇注》2.15–25 [DL-1972: Fr. 2]；见 Hoffmann 1980）[^dl--1972][^hoffmann-1980]。阿尔基塔斯这部论著实为伪作，学界今定其年代于公元前一世纪；杨布里科斯却视之为真作，并借此为亚里士多德的理论宣称一个毕达哥拉斯起源。要言之，杨布里科斯对《范畴篇》的解经是其毕达哥拉斯哲学纲领的有机部分：在解读《范畴篇》时，他动用了自己的形而上学与神学观点。显然，他把对亚里士多德的解读沿柏拉图/毕达哥拉斯路线推进到如此地步，以至于（如后来来源所报道）他不忌讳假定：在理念理论上，亚里士多德并不反对柏拉图（见 Elias/David《范畴篇注》123.2–3）。
