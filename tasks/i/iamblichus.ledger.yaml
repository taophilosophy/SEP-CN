      In contradistinction with the gods, the soul receives a plethora of negative traits: it is imperfect, intermittent, it leans towards matter; and while the causes of Order and Beauty exist in full communion with the gods, the soul can never be given more than a mere share of it (*Reply to Porphyry* I, 6–7 [SS-2013: 15.14–17.7])[^ss--2013]. The immutability of this celestial hierarchy is striking, and foreshadows the later works of Hierocles, Proclus, and pseudo-Dionysius the Areopagite. Although the soul’s versatility—its ability to “make use of varied forms and life-principles”—allows it to attach itself to superior beings and lay claim “to receiving perfection as an angelic, immaculate soul” (*Reply to Porphyry* II, 2 [SS-2013: 51.10–52.11])[^ss--2013], on closer reading it appears to be unable to escape its condition by virtue of its own essence: its ascent is never complete (it is an endeavor, *ephesis* or *henōsis*, with a suffix expressing verbal action) and it presupposes, moreover, the gods’ “goodwill and illumination”. Porphyry had previously drawn a similar distinction between demons that are so “by essence” (*kat’ ousian*) or by mere “relation” (*kata skhesin*), the latter being those humans who, by virtue of their excellent life, are allotted demonic status. On the other hand, the human soul is also unable to be relegated to the rank of animals via metempsychosis (cf. the title of one of Iamblichus’ psychological works preserved by Nemesius of Emesa, *On the Nature of Man*, chap. 2, p. 35.7–11 Morani). Some points, however, remain unclear, such as how exactly Iamblichus’ generic distinction between human souls and “divine” ones would fit within such a structure; or what we are to make of the souls of exceptional, even semi-divine characters such as Pythagoras or the theurgists. Similar preoccupations underlie Frs. 82 and 83 *In Timaeum* [D-1973], interpreting *Timaeus* 41d.
        step1: |-
      与诸神相对照，灵魂带有一大堆否定性特征：它不完善、断续、倾向于质料；而当秩序与美的原因与诸神处于完全的共融之中时，灵魂所能得到的至多只是对它们的分有（《答波菲利》I, 6–7 [SS-2013: 15.14–17.7]）[^ss--2013]。这一天界等级的不变性令人瞩目，预示了希罗克勒斯、普罗克洛斯与伪狄奥尼修斯（雅典最高法院法官狄奥尼修斯）后来的著作。虽然灵魂的多变性——它“使用各种形式与生命本原”的能力——使它得以依系于较高存在者，并宣称“作为天使般纯洁无瑕的灵魂接受成全”（《答波菲利》II, 2 [SS-2013: 51.10–52.11]）[^ss--2013]，但细读之下可见：灵魂凭其本质无法逃脱自身的处境——它的上升从不完成（这是一种努力，*ephesis* 或*henōsis*，是带有表示言语动作之后缀的名词）；而且，它还以诸神的“善意与照亮”为前提。波菲利此前曾区分“依本质”（*kat' ousian*）为精灵者与仅“依关系”（*kata skhesin*）为精灵者；后者指那些凭卓越生活而被分配精灵身份的人。另一方面，人的灵魂也不可能经由轮回被贬入动物的等级（参杨布里科斯一部灵魂论著的标题，该著由埃梅萨的涅梅西乌斯（Nemesius of Emesa）《论人的本性》第 2 章保存，p. 35.7–11 Morani）。然而有几点仍不清楚：例如，杨布里科斯对人的灵魂与“神圣”灵魂的类上区分如何嵌入这一结构；或者我们该如何看待毕达哥拉斯或通神术师这类卓越乃至半神圣人物的灵魂。类似的关切构成《蒂迈欧注》Fr. 82 与 83 [D-1973] 的底层，它们解读《蒂迈欧篇》41d。
