      Limit and the Unlimited are also principles active among mathematical entities (*On General Mathematical Science*, chap. 13). Here they play a role similar to that of the pairs Monad and Dyad, Odd and Even, or Same and Other according to Nicomachus of Gerasa, the neo-Pythagorean author of the *Introduction to Arithmetic* and one of Iamblichus’ intellectual heroes; similar pairs studied by the mathematical sciences are “continuous” and “discrete” (*sunekhes*, *diōrismenon*), “magnitude” and “plurality” (*megethos*, *plēthos*: cf. Nicomachus, *Intr*. *arith*. I, 2, 4–5), all of which concur to form a dynamic picture of reality. The four mathematical sciences—arithmetic, which takes precedence over the others; geometry, music and astronomy—each study a corresponding kind of being, and were the object of *On Pythagoreanism* vol. IV and VIII–X respectively (see the plan of the work as outlined by O’Meara 1989)[^o’meara-1989].
        step1: |-
      限定与无限定也是数学存在者之中活动的本原（《论一般数学科学》第 13 章）。在这里，它们扮演的角色类似于杰拉萨的尼科马霍斯——新毕达哥拉斯派、《算术引论》作者、杨布里科斯的思想英雄之一——笔下的这样几对：一元与二元、奇与偶、同与异。数学科学研究的相关成对概念还有“连续”与“离散”（*sunekhes*、*diōrismenon*）、“大小”与“多”（*megethos*、*plēthos*：参尼科马霍斯，《算术引论》I, 2, 4–5）；凡此种种，共同构成一幅动态的实在图景。四门数学科学——居首的算术、几何、音乐与天文——各研究一类相应的存在，分别是《论毕达哥拉斯主义》第四卷与第八至十卷的对象（见 O'Meara 1989 所勾画的该书计划）[^o'meara-1989]。
        step2: |-
      在数学存在者的领域，限定与无限定同样是活动的本原（《论一般数学科学》第 13 章）。在这里，它们的角色类似于杰拉萨的尼科马霍斯笔下的那几对：一元与二元、奇与偶、同与异。尼科马霍斯是新毕达哥拉斯派、《算术引论》的作者，也是杨布里科斯的思想英雄之一。数学科学研究的成对概念还有“连续”与“离散”（*sunekhes*、*diōrismenon*）、“大小”与“多”（*megethos*、*plēthos*：参尼科马霍斯《算术引论》I, 2, 4–5）；凡此种种，共同织成一幅动态的实在图景。四门数学科学——算术（居诸科之首）、几何、音乐与天文——各研究一类相应的存在，分别对应《论毕达哥拉斯主义》第四卷与第八至十卷（见 O'Meara 1989 所勾画的该书规划）[^o'meara-1989]。
