      According to Iamblichus, “soul” is but the last and weakest link in the chain of “higher genera” (*kreittona genē*). In the *Reply to Porphyry*, those entities are enumerated in full: gods—archangels—angels—demons—heroes—archons ruling the world—enmattered archons—souls. This is a token of Iamblichus’ receptiveness towards the religious speculation of his day, although most of this theological bestiary was in fact already present in Porphyry’s *Letter to Anebo*. Iamblichus’ acceptance of “evil demons” (cf. O’Neill 2018)[^o’neill-2018] is particularly interesting, since it seems to undermine Iamblichus’ monism and providentialism, and is best explained as reflecting the influence of the *Chaldean Oracles*.
        step1: |-
      依杨布里科斯之见，“灵魂”不过是“更高属”（*kreittona genē*）之链上最后也是最弱的一环。在《答波菲利》中，这些实体被完整列举：神明——大天使——天使——精灵——英雄——统辖世界的执政官——具质料的执政官——灵魂。这是杨布里科斯对其时代宗教思辨持开放态度的一个标记，尽管这份神学谱系志中的大部分其实已见于波菲利的《致阿涅波书》。杨布里科斯对“邪恶精灵”的接受（参 O'Neill 2018）[^o'neill-2018]尤其耐人寻味，因为它似乎动摇了杨布里科斯的一元论与神意论，最好的解释是它反映了《迦勒底神谕》的影响。
