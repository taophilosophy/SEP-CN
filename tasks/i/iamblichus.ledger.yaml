      Perhaps the most conspicuous trait of Iamblichean metaphysics is its highly vertical conception of causality. For Iamblichus, an effect does not enjoy any ontological independence with respect to its cause: anything it adds amounts to failure and nothingness. This idea predates Iamblichus, but he was the first Pagan philosopher to apply it with absolute consistency. Most of his system follows from this one axiom, particularly his doctrine of the soul (see Section 6). The principles’ supervision always lurks in the background: see, e.g., the idea that the intelligible gods “contain” the visible gods (i.e., planets; *Reply to Porphyry* I, 19 [SS-2013: 45.14–20])[^ss--2013]. The idea of the vacuity of effects leads to the notion that their sole purpose is to render themselves apt to receive the influx of their causes: Iamblichus calls this *epitēdeiotēs,* or “receptivity”. This process of adaptation accounts for most of the diversity in the phenomenal world. Another important law states that “everything is in everything according to its property”: Damascius ascribes it to both Iamblichus and Porphyry (*In Philebum* § 130 = Iamblichus *In Philebum* [D-1973: Fr. 5]). The last words are the most important: superior beings keep their prerogatives in spite of the existence of a universal homology, which means for example that causes are present to their effects *as causes*, i.e., are not encompassed by them or relegated to their status. In this way, Iamblichus manages to preserve at the same time the benefits of divine immanence (the world is not abandoned by the gods) and the requirement of divine transcendence, which he feels the need to constantly affirm, lest he be accused of debasing divinity.
        step1: |-
      扬布里柯斯式形而上学最显著的特征，或许是它高度纵向的因果观。对杨布里科斯而言，结果相对于原因不享有任何存在论上的独立：它所增添的一切都等于失败与虚无。这一观念先于杨布里科斯，但他是第一位以绝对一贯的方式应用它的异教哲学家。其体系的大部分都由这一条公理推出，尤其是他的灵魂学说（见第 6 节）。诸本原的监管始终隐伏于背景之中：例如，理知诸神“包含”可见诸神（即行星；《答波菲利》I, 19 [SS-2013: 45.14–20]）[^ss--2013]这一观念。结果之虚空导向如下观念：结果的唯一目的，是使自己适于承受其原因的流入：杨布里科斯称之为*epitēdeiotēs*，即“承受性”（适配性）。这一适应过程说明了现象世界的大部分多样性。另一条重要法则是“一切都在一切之中，各按其本性”：达马斯基乌斯把它同时归于杨布里科斯与波菲利（《斐莱布注》§ 130 ＝ 杨布里科斯，《斐莱布注》[D-1973: Fr. 5]）。最后几个字最为重要：尽管存在普遍的同构，较高的存在者仍保持其特权；这意味着，例如，原因作为原因而在场于其结果，即不被结果所囊括，也不被贬入结果的地位。如此，杨布里科斯同时保住了神圣内在性的益处（世界并未被诸神抛弃）与神圣超越性的要求——他感到必须不断申言后者，以免被指控贬低了神性。
        step2: |-
      扬布里柯斯式形而上学最显著的特征，或许是它高度纵向的因果观。在杨布里科斯看来，结果相对原因不享有丝毫存在论独立：结果所增添的一切，皆是失败与虚无。这一观念先于杨布里科斯，但他是最早以绝对一贯的方式运用它的异教哲学家。其体系的大部分由这条公理推出，尤其是他的灵魂学说（见第 6 节）。诸本原的监管始终隐伏于幕后：例如，理知诸神“包含”可见诸神（即行星）之说（《答波菲利》I, 19 [SS-2013: 45.14–20]）[^ss--2013]。结果之虚空，则导向另一个观念：结果的唯一目的，是使自己适于承受原因的流入；杨布里科斯称之为*epitēdeiotēs*，即“承受性”（适配性）。现象世界的大部分多样性，正是由这一适应过程说明的。另一条重要法则是“一切都在一切之中，各按其本性”：达马斯基乌斯把它同时归于杨布里科斯与波菲利（《斐莱布注》§ 130 ＝ 杨布里科斯《斐莱布注》[D-1973: Fr. 5]）。末句最为关键：尽管存在普遍的同构，较高的存在者仍保有其特权。这意味着，例如，原因是作为原因而对其结果在场的——不被结果所囊括，也不被贬入结果的地位。如此，杨布里科斯同时保住了神圣内在性的益处（世界并未被诸神抛弃）与神圣超越性的要求；他感到必须不断申言后者，以免被指控贬低神性。
