      Iamblichus’ notion of Nature displays little originality when compared to that of other Neoplatonists. It acts as a productive power for cosmic beings, originating in the celestial gods (*Reply to Porphyry* III, 28 [SS-2013: 127.2–12])[^ss--2013], but it does not act according to reason. This ambiguity explains why, depending on the context, it can be considered either a positive entity, insofar as it is part of a reality governed by Providence, or a deceitful, almost evil force, a view strongly influenced by the *Chaldean Oracles* (see, e.g., V, 18 [SS-2013: 166.18–24])[^ss--2013]: it comes as no surprise that, in this respect, Nature is also closely associated with Fate. The same ambivalence is to be found with regard to astrology, which Iamblichus deems useful, yet not the best way to determine the identity of our personal *daimōn* (IX, 4–5 [SS-2013: 205.1–207.9])[^ss--2013].
        step1: |-
      与其他新柏拉图主义者相比，杨布里科斯的自然概念几乎没有原创性。它作为宇宙存在者的生产性力量发挥作用，源于天界诸神（《答波菲利》III, 28 [SS-2013: 127.2–12]）[^ss--2013]，但它并不依理性行事。这一暧昧性解释了为什么视语境而定，它既可被视为一个肯定性的实体——就它是受神意支配的实在的一部分而言——也可被视为一种骗人的、近乎邪恶的力量；后一种观点深受《迦勒底神谕》影响（例如见 V, 18 [SS-2013: 166.18–24]）[^ss--2013]：无怪乎就此而言，自然也与命运紧密相连。同样的双重性也见于占星术：杨布里科斯认为它有用，却又不是确定我们个人守护精灵身份的最佳途径（IX, 4–5 [SS-2013: 205.1–207.9]）[^ss--2013]。
        step2: |-
      较之其他新柏拉图主义者，杨布里科斯的自然概念几无原创性可言。它作为宇宙存在者的生产性力量发挥作用，发源于天界诸神（《答波菲利》III, 28 [SS-2013: 127.2–12]）[^ss--2013]，却不依理性行事。这层暧昧解释了为何随着语境变换，它既可被当作一个肯定性实体——就它是受神意支配的实在之一部而言——又可被当作一种骗人的、近乎邪恶的力量；后一种看法深受《迦勒底神谕》影响（例如见 V, 18 [SS-2013: 166.18–24]）[^ss--2013]。无怪乎就此而言，自然也与命运紧密相连。同样的双重性也见于占星术：杨布里科斯认为占星有用，却不是确定我们个人守护精灵之身份的最佳途径（IX, 4–5 [SS-2013: 205.1–207.9]）[^ss--2013]。
