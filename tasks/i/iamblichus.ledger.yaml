      Matter also displays both these traits—integration into the world order and a connection with corporeality and evil. Iamblichus’ *Reply to Porphyry* is replete with allusions to matter as a taint and source of corruption: “what is mixed with the irrationality and darkness associated with bodies and matter is overcome with ignorance” (VI, 4 [SS-2013: 182.7–10])[^ss--2013]. By contrast, “divine fire” strives to eradicate materiality and generation (V, 12 [SS-2013: 161.2])[^ss--2013]. In such passages, Iamblichus inherits the strongly negative views on matter developed by Middle Platonists such as Numenius and further developed by Plotinus. However, a testimony from John Lydus (*De Mensibus* 175.1–176.7 Wünsch) states, apropos Matter, that “nothing imperfect stems from the paternal (i.e., demiurgic) triad”. Thus the possibility of a monistic interpretation remains open: this evidence is studied by Taormina (2016). Accordingly, several testimonies (e.g., Simplicius, *In Categorias* 418.3–8) also state that Iamblichus attributed no real existence to Evil, only a *parhupostasis*.
        step1: |-
      质料同样显示出这两个特征——被整合进世界秩序，以及与形体性、恶的关联。杨布里科斯的《答波菲利》充满把质料当作污点与腐坏之源的暗示：“凡与形体和质料相关的非理性与黑暗相混合者，都被无知所压倒”（VI, 4 [SS-2013: 182.7–10]）[^ss--2013]。相反，“神圣之火”则力图根除物质性与生成（V, 12 [SS-2013: 161.2]）[^ss--2013]。在这类段落中，杨布里科斯继承了中期柏拉图主义者（如努梅尼乌斯）所发展、又由普罗提诺进一步推进的对质料的强烈否定看法。然而，约翰·利杜斯的一条证词（《论月令》175.1–176.7 Wünsch）就质料说道：“没有任何不完善者出自父性的（即创世的）三一体”。于是一元论解读的可能性仍然敞开：这条证据由 Taormina（2016）研究。相应地，若干证词（如辛普里丘，《范畴篇注》418.3–8）也表明，杨布里科斯不曾赋予恶以实在的存在，只赋予它一种*parhupostasis*（副实体）。
        step2: |-
      质料同样兼具这两个特征——既被整合进世界秩序，又与形体性、恶相牵连。杨布里科斯的《答波菲利》通篇暗示质料是污点与腐坏之源：“凡与形体和质料相伴的非理性与黑暗相混者，皆为无知所压倒”（VI, 4 [SS-2013: 182.7–10]）[^ss--2013]；相反，“神圣之火”则力图根除物质性与生成（V, 12 [SS-2013: 161.2]）[^ss--2013]。在这类段落里，杨布里科斯继承了中期柏拉图主义者（如努梅尼乌斯）发展、复经普罗提诺推进的那套对质料的强烈否定之见。然而，约翰·利杜斯的一条证词（《论月令》175.1–176.7 Wünsch）却就质料说道：“没有任何不完善者出自父性的（即创世的）三一体”。一元论解读的可能性由此仍然敞开；这条证据已由 Taormina（2016）研究。与之相应，若干证词（如辛普里丘《范畴篇注》418.3–8）同样表明：杨布里科斯不曾赋予恶以实在的存在，只赋予它一种*parhupostasis*（副实体）。
