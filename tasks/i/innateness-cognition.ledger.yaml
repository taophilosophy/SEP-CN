      For Wellman this supports the radical constructivist perspective on theory of mind development. However, such evidence is not decisive and could be interpreted along the following more nativistically orientated lines. A theory of mind of the kind envisaged by the nativist will only go so far in enabling one to uncover the mental states of other people. This is because some of our behavior is driven by local cultural conventions and some of our behavior reflects our personal idiosyncrasies. Hence, it helps to have both knowledge of local conventions and knowledge about specific individuals, knowledge that no sensible person would claim to be innate. Though such knowledge is to be distinguished from the core of an individual’s theory of mind it couldn’t be learned without a theory of mind and it sits alongside such a theory once it is learned rather than superseding or replacing it.
