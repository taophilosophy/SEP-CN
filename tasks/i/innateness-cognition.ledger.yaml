      Strongly nativist perspectives such as the core cognition approach have not gone unchallenged in the recent empirical literature. Opposition has been presented by an alternative post-Piagetian approach that has developed over roughly the same time frame. This is known as rational constructivism and is a particular development of what is known as the theory theory according to which we have evolved learning mechanisms that enable us to learn about key aspects of the external world during childhood. These include the familiar domains of medium-sized physical objects and the workings of the mind. The knowledge so learned takes the form of a theory akin to a scientific theory in virtue of being “abstract, complex, highly structured, veridical representations and rules” (Gopnik 2003: 240)[^gopnik-2003]. According to Alison Gopnik (2003), one of its key champions, the theory theory is a species of empiricism as it characterizes childhood learning as drawing on domain general learning mechanisms. However, there is a concession to nativism in the form of a commitment to innate starting theories. But these starting theories, in contrast to systems of core cognition, are not held onto by the developing child for very long as they are overwritten in the light of experience.
    step1: |-
      核心认知进路这类强烈的先天论视角，在晚近经验文献中并非未受挑战。一个大致在同一时期发展起来的替代性后皮亚杰式进路提出了反对。这就是所谓理性建构主义，是所谓理论论的一种特定发展；按理论论，我们演化出学习机制，使我们在童年学会外部世界的关键方面。这些包括中等大小物理对象与心灵运作等熟悉的领域。如此学得的知识采取类似科学理论的形式，因为它们是“抽象的、复杂的、高度结构化的、真实的表征与规则”（Gopnik 2003: 240）[^gopnik-2003]。按其关键倡导者之一艾莉森·戈普尼克（2003）的说法，理论论是经验论的一个物种，因为它把童年学习刻画为动用领域一般的学习机制。然而，其中有一项对先天论的让步，即承诺天赋的起始理论。但与核心认知系统不同，这些起始理论不会被发展中的儿童保留很久，因为它们会在经验之光下被覆盖。
    step2: |-
      核心认知进路这类强烈的先天论视角，在晚近经验文献中并非没有对手。大致同一时期兴起的另一条后皮亚杰式进路便提出反对，即所谓“理性建构主义”。它是“理论论”的一个特定发展：按理论论，我们演化出学习机制，使童年得以学会外部世界的关键方面，包括中等大小物理对象与心灵运作等熟悉领域。如此学得的知识取类似科学理论的形式，因为它们是“抽象的、复杂的、高度结构化的、真实的表征与规则”（Gopnik 2003: 240）[^gopnik-2003]。其关键倡导者之一艾莉森·戈普尼克（2003）称，理论论是经验论的一个变种，因为它把童年学习刻画为动用领域一般的机制；不过它也向先天论让了一步，承诺存在天赋的起始理论。但与核心认知系统不同，这些起始理论不会被儿童保留太久，很快就依经验被覆盖。
