      As its name suggests, the agency based approach emphasizes our agency; humans, like all animals, “are built for action” (Tomasello 2024: 11)[^tomasello-2024]. Accordingly, cognition evolved in order to enable us to decide how to act so as to satisfy our needs. Tomasello (2022) argues that over the course of evolutionary history three distinct forms of cognitive architecture have evolved to support the process of deciding how to act thereby giving rise to three distinct forms of individual agency. The first of these is goal-directed agency as exemplified by lizard-like creatures. This form of agency involves making go/no-go decisions as when a creature in a particular situation has to decide whether or not to respond in a particular way (for example, whether or not to strike at a perceived insect). Learning is based on the perceived outcome of such go/no-go decisions.
    step1: |-
      顾名思义，基于能动性的进路强调我们的能动性；人类与一切动物一样，“是为行动而造的”（Tomasello 2024: 11）[^tomasello-2024]。相应地，认知演化出来，是为使我们能决定如何行动以满足需要。托马塞洛（2022）主张，在演化史进程中，三种不同的认知架构演化出来支撑“决定如何行动”的过程，从而产生三种不同的个体能动性形式。第一种是目标导向的能动性，以蜥蜴类生物为例。这种能动性涉及做“行／不行”的决定，例如某生物在特定情境中须决定是否以特定方式作出反应（比如是否扑击一只察觉到的昆虫）。学习基于此类“行／不行”决定所感知到的结果。
