      Chomsky’s position has received multiple objections over the past few decades. Some argue that corpus analysis suggest that the primary linguistic data is not as impoverished as Chomsky suggests (Cowie 1999; Scholz & Pullum 2006; Sampson 2005)[^cowie-1999][^sampson-2005][^scholz-2006]. Some argue that children focus on sentences spoken in Motherese or Child Directed Speech (Gopnik, Meltzoff, & Kuhl 1999) and as a result of this the primary linguistic data they learn from is much cleaner than Chomsky supposes (Newport, Gleitman, & Gleitman 1977; Snow 1977)[^snow-1977]. Cowie (1999) draws a distinction between negative data and negative evidence and argues that children get negative evidence to the effect that the ungrammatical structures that they produce are ungrammatical even if they are not explicitly told that they are. Tomasello (2003) argues that children would attain syntactic maturity much earlier than they actually do were linguistic development a matter of parameter setting. Some linguists have questioned the reality of syntactic universals and argue that languages vary more than Chomsky thinks (Evans & Levinson 2009; Everett 2012)[^evans-2009][^everett-2012]. On the other hand, focusing on nativist positions that portray language as an evolutionary adaptation, (for example, Pinker & Bloom 1990 and Jackendoff & Pinker 2005)[^jackendoff-2005][^pinker-1990] Christiansen and Chater (2008) argue that languages don’t vary as much as they would were they products of evolution. Finally, some connectionists argue that their success in modelling particular aspects of language acquisition motivate the idea that language is learned by means of experience driven changes to connectionist networks embodied in the brain (Elman 1991; Elman et al. 1996)[^elman-1991][^elman-1996].
    step1: |-
      过去数十年，乔姆斯基的立场受到多方反对。有人认为，语料库分析表明原始语言材料并不像乔姆斯基所说那样贫乏（Cowie 1999; Scholz & Pullum 2006; Sampson 2005）[^cowie-1999][^sampson-2005][^scholz-2006]。有人认为，儿童关注的是以“母亲语”或“儿童指向言语”说出的句子（Gopnik, Meltzoff, & Kuhl 1999），因此他们据以学习的原始语言材料远比乔姆斯基设想的干净（Newport, Gleitman, & Gleitman 1977; Snow 1977）[^snow-1977]。考伊（1999）区分否定性材料与否定性证据，主张儿童即便没有被告知，也能获得表明其所产出的不合语法结构不合语法的否定性证据。托马塞洛（2003）主张，若语言发展真是参数设定之事，儿童达到句法成熟会比实际早得多。一些语言学家质疑句法普遍性的实在性，主张语言变异比乔姆斯基所想的更大（Evans & Levinson 2009; Everett 2012）[^evans-2009][^everett-2012]。另一方面，克里斯蒂安森与查特（2008）聚焦于把语言描绘为演化适应的先天论立场（如 Pinker & Bloom 1990; Jackendoff & Pinker 2005）[^jackendoff-2005][^pinker-1990]，主张语言的变异并不像“语言是演化产物”所应有的那样大。最后，一些联结主义者主张，他们在模拟语言习得某些方面的成功，支持“语言是经由经验驱动、发生于脑中联结主义网络的变化而学得”这一想法（Elman 1991; Elman et al. 1996）[^elman-1991][^elman-1996]。
