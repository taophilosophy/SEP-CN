      The area where the debate about nativism has raged most vociferously relates to language acquisition. This debate has focused on the work of Noam Chomsky who revolutionized linguistics and initiated the cognitive revolution and the associated decline of behaviorism. Chomsky’s work remains important and influential but has faced increasingly significant challenges in recent years.
    step1: |-
      关于先天论的争论最激烈之处，是语言习得。这场争论聚焦于诺姆·乔姆斯基的工作；乔姆斯基革新了语言学，开启了认知革命以及随之而来的行为主义衰落。乔姆斯基的工作仍然重要而有影响，但近年面临日益重大的挑战。
    step2: |-
