  - id: 82
    kind: body
    source: |-
      Tomasello’s agency based approach constitutes an important alternative to both the core cognition approach and rational constructivism and is the least nativistically orientated of the three with respect to the postulation of innate concepts and knowledge. Although Tomasello seems to be committed to the existence of innate cognitive mechanisms underlying our capacities for joint and collective intentionality he is parsimonious when it comes to the postulation of domain specific innate theories and modules. The battle between these three approaches lies at the forefront of the contemporary debate concerning the nature and extent of our innate cognitive resources.
    step1: |-
      托马塞洛的基于能动性的进路，构成对核心认知进路与理性建构主义两者的一种重要替代，且在设定天赋概念与知识方面是三者中最不偏先天论的。尽管托马塞洛似乎承诺存在支撑共同意向性与集体意向性能力的先天认知机制，但他在设定领域特异的天赋理论与模块方面十分节制。这三种进路之间的较量，处于当代关于我们天赋认知资源之性质与范围的争论前沿。
