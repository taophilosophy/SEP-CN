      国际关系学虽不如从前流行，曾一度由现实主义者主导，他们主张政治国家在与外国国家及个人打交道时不受道德约束。驱动这一进路的基本想法，往往是霍布斯式假定：道德仅由契约构成，而契约只在有能强制执行的主权者时才有约束力。既然没有能惩罚国家的世界主权者，后者便不能受任何据称适用于它们的契约的道德约束。因此，现实主义者传统上设想，国家会且应以最大程度适合其国家利益的方式安排与外国人的交道。若此正确，就不存在任何对外国国家或个人负有的义务，因而也没有向外国人开放边界的义务。
