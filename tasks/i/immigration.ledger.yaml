      ### 1.8 Jurisdiction
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      The jurisdictional theory of immigration emphasizes that, while political states are morally required to respect everyone’s human rights, they are obligated to *protect* the rights of only those within their territory. Given this, whenever someone moves to a new state, the citizens of the receiving country become responsible for this newcomer in a way that they were not before her arrival. It would thus seem weird to suppose that everyone should be free to move to whatever country they like, because this would entitle each of us to unilaterally impose moral responsibilities upon others. If we value individual liberty, then we should begin with at least a presumption against others being at liberty to unilaterally foist these responsibilities on us (Blake 2013)[^blake-2013]. Our immunity against unwelcome obligations may not be absolute, but it would presumably require a compelling competing consideration to outweigh it. If someone could not enjoy sufficient protection of her human rights unless she moved to Canada, for instance, then this vulnerable person may be entitled to immigrate without permission even though this move will saddle Canadian citizens with moral duties to which they did not consent. But if someone whose rights are adequately respected elsewhere sought to move to Canada merely because she thinks she would be happier there, Canadians would be well within their rights to forcibly exclude her if they would prefer not to be responsible for protecting her human rights.
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Those who think that there is a natural duty to support just institutions may question the pivotal premise in this approach: that we should be skeptical of political obligations to which we have not consented. After all, if each of us was really immune from political duties to which we did not consent, then many of us would not have duties to protect the human rights of our compatriots. But if we must do our part of the collective chore of protecting the human rights of our fellow citizens despite the fact that we never agreed to do so, why think that there is anything distinctively problematic about our similarly having such duties to newcomers who have recently immigrated? Indeed, given that we are already morally encumbered with duties to protect the human rights of those within our state’s territorial boundaries, an influx of newcomers does not create any new types of duties, at most it creates additional tokens which would make fulfilling these responsibilities more costly (Kates and Pevnick 2014)[^kates-2014].
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      In response, an advocate of the jurisdictional approach might counter that prospective immigrants have no right to unilaterally act in ways that make our natural duties more demanding. But retreating to this position raises new questions. Given that immigrants also contribute to the state’s performance of its political functions, it is not obvious why an influx of prospective immigrants would necessarily make it more difficult for those already present to fulfill their political obligations. (Indeed, given economies of scale, the newcomers may often lighten the load of the native population.) And even if there are instances in which the arrival of immigrants would create net costs for a state’s existing population, this fact would generate a right to forcibly exclude outsiders only if the increased demands upon those already present should be given moral precedence over the costs imposed upon prospective immigrants who are denied entry. Because prospective immigrants often have pressing interests in entering a country (even if their human rights are satisfactorily protected), however, there may be many cases in which the interests of those who want to enter would prevail over a native population’s desire to avoid more costly political responsibilities (Kates and Pevnick 2014)[^kates-2014].
