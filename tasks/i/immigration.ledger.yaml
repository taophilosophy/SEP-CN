      The vast bulk of the discussion concerning the morality of immigration concerns the exclusion of outsiders, but some also worry about the way in which wealthy countries currently admit skilled workers from poorer states, especially when the specialists are actively recruited away from their native lands. This practice would not garner the attention of moral theorists if it were restricted to countries like the United States targeting the most talented long-distance runners from Kenya, for instance, but it is thought to rise to the level of injustice when the wealthiest countries actively recruit professionals from developing countries where people with their skill sets are already in terribly short supply. Perhaps the most noteworthy and worrisome instance of this is the manner in which wealthy, western states actively recruit medical professionals away from Africa. As Gillian Brock comments, “Arguably, it is not the total number of health care professionals that exist in the world today that is a problem, but rather their distribution. Consider how, for instance, while only 21 per cent of the world’s population resides in Europe and North America, it commands 45 per cent of the world’s doctors and 61 of its nurses. Africa, which contains 13 per cent of the world’s population, has only 3 per cent of its doctors and 5 per cent of its nurses. An estimated 1.3 per cent of the world’s health care workers provide services to 13.8 per cent of the world’s population in a region suffering 25 per cent of the world’s disease burden.” (Brock 2009: 200)[^brock-2009]
    step1: |-
      关于移民道德性的讨论绝大部分涉及排斥外人，但也有人担忧富裕国家目前从较穷国家接纳技术工人的方式，尤其是当专家被主动从其故土挖走时。若这一实践仅限于美国等国瞄准肯尼亚最有才华的长跑运动员，它不会引起道德理论家的注意；但当最富裕国家主动从发展中国家招募专业人员，而具备其技能的人在那些国家本已极度短缺时，这被认为已构成不义。也许最值得注意、最令人担忧的实例，是富裕西方国家主动从非洲挖走医疗专业人员的方式。正如吉莉安·布罗克所评论的：“可以说，问题不在于当今世界卫生保健专业人员的总数，而在于其分布。例如，世界人口只有 21% 住在欧洲与北美，但这两个地区却拥有世界 45% 的医生与 61% 的护士。非洲拥有世界 13% 的人口，却只有 3% 的医生与 5% 的护士。据估计，世界 1.3% 的卫生保健工作者，为世界 13.8% 的人口提供服务，而该地区承受着世界 25% 的疾病负担。”（Brock 2009: 200）[^brock-2009]
