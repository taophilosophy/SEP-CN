      The classic analysis of guest workers is Michael Walzer’s discussion of Western European countries’ former practice of hiring laborers from nearby states such as Turkey. This practice was a sensible solution for all, since it enabled a country like West Germany to hire foreign workers to do various relatively onerous jobs for considerably less than it would have had to pay its domestic labor force, and the imported laborers also profited, as they were able to earn considerably more than they could have in their own countries. Walzer objects to this practice, however, because these workers were not given equal political status in their host countries. Even when Turkish workers lived in West Germany with their families for many years, for instance, they would have no chance of acquiring German citizenship. For understandable reasons, Walzer is deeply troubled by the creation of this political underclass. As he puts it, “These guests experience the state as a pervasive and frightening power that shapes their lives and regulates their every move—and never asks for their opinion. Departure is only a formal option; deportation, a continuous practical threat. As a group, they constitute a disenfranchised class. They are typically exploited or oppressed as a class as well, and they are exploited or oppressed at least in part because they are disenfranchised, incapable of organizing effectively for self-defense.” (Walzer 1983: 59)[^walzer-1983] As a consequence, Walzer insists that, while countries are perfectly within their rights to either hire or exclude foreign workers, they are not free to bring in outsiders without according them all the standard rights and privileges of equal citizenship. Thus, if a country is willing to embrace foreign workers as political equals, it may invite in as many as it would like. If a political community is unwilling to treat guest workers as equals, on the other hand, then it may not hire them and must pay the higher wages demanded by the domestic labor market.
    step1: |-
      对客籍工人的经典分析是迈克尔·沃尔泽对西欧国家从前从土耳其等邻近国家雇佣劳工之实践的讨论。这一实践对各方都是明智解决方案：它使西德这样的国家能以远低于本国劳动力的成本雇佣外国工人从事各种相对繁重的工作，而被输入的劳工也获益，因为他们能挣到远高于本国的收入。然而沃尔泽反对这一实践，因为这些工人在东道国未获平等政治地位。例如，即便土耳其工人与家人在西德居住多年，他们也没有机会获得德国公民身份。出于可理解的原因，沃尔泽对这种政治下层阶级的制造深感不安。正如他所说：“这些客人把国家体验为一种无处不在、令人恐惧的权力，它塑造其生活、规制其一举一动——却从不征求其意见。离境只是形式上的选项；驱逐则是持续的实际威胁。作为一个群体，他们构成一个被剥夺权利的阶级。他们通常也作为一个阶级被剥削或压迫，而他们被剥削或压迫，至少部分是因为他们被剥夺权利、无法有效组织自卫。”（Walzer 1983: 59）[^walzer-1983] 因此，沃尔泽坚持：各国完全有权雇佣或排斥外国工人，但不得在引进外人时不予其平等公民身份的全部标准权利与特权。因此，若一国愿意把外国工人当作政治平等者接纳，它可以邀请任意多的人。反之，若一个政治共同体不愿平等对待客籍工人，它就不得雇佣他们，而必须支付国内劳动力市场所要求的更高工资。
    step2: |-
      关于客籍工人的经典分析，是迈克尔·沃尔泽对西欧国家昔日从土耳其等邻国招募劳工之做法的讨论。此做法对各方都算明智：西德之类国家能以远低于本国劳动力的成本，雇外国工人干各种较繁重的工作；被输入的劳工也获益，因为收入远高于本国。然而沃尔泽反对此做法，因为这些工人在东道国没有平等政治地位。即便土耳其工人携家在西德住了多年，也毫无机会取得德国国籍。沃尔泽对这种政治下层阶级的制造深感不安，其理由不难理解。他说：“这些客人所体验的国家，是一种无处不在、令人恐惧的权力：它塑造其生活、规制其一举一动，却从不问其意见。离境只是形式上的选择；驱逐才是持续的实际威胁。作为一个群体，他们构成被剥夺权利的阶级。他们通常也作为一个阶级受到剥削或压迫，而部分原因正是他们被剥夺权利、无法有效组织自卫。”（Walzer 1983: 59）[^walzer-1983] 因此沃尔泽坚持：各国完全有权雇用或排斥外国工人，但不得在引入外人时不给予平等公民身份的全部标准权利与特权。愿把外国工人当作政治平等者，便可请进任意多人；不愿平等对待客籍工人，便不得雇用，而须支付国内劳动力市场要求的更高工资。
