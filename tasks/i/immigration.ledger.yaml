      ### 3.5 Selection Criteria
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      Finally, one of the most complex and controversial issues within the literature on the morality of immigration is what criteria a state may permissibly employ to distinguish among applicants for admission. Countries might use either a lottery or a first-come, first-admitted waitlist, but they might also screen the applicants and give preference to those whose language, culture and/or skill sets make them most likely to assimilate in the host state’s economy and political culture. But what if a country’s immigration policies differentiate among applicants on the basis of race, ethnicity, gender, religion or country of origin? What if a country flatly refused to even consider applications for immigration from Asians or Africans, for instance?
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      As with so many issues in this area, Walzer’s (1983) treatment of this question is seminal. In this case, though, many have recoiled at his conclusions. To see why, consider his take on “White Australia,” Australia’s erstwhile practice of recruiting immigration from England while explicitly prohibiting immigration from non-European countries. Walzer writes, “Assuming, then, that there actually is superfluous land, the claim of necessity would force a political community like that of White Australia to confront a radical choice. Its members could yield land for the sake of homogeneity, or they could give up homogeneity (agree to the creation of a multiracial society) for the sake of the land. And those would be their only two choices. White Australia could survive only as Little Australia.” (Walzer 1983: 47)[^walzer-1983] Walzer may well be right that Australia had a duty to share its vast land with those who needed it, but it is striking that he had no principled objection aimed specifically at Australia’s racism. If Australia did not have so much territory, then Walzer apparently would not object to their excluding immigrants on the basis of their race or ethnicity.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      A number of critics agree that Walzer’s analysis is misguided, but there has been no consensus as to precisely where and why it goes off the tracks. Consider, for instance, the conflicting accounts offered by David Miller, Joseph Carens and Michael Blake. Miller’s take is interesting, because he accepts Walzer’s arguments and conclusion that political communities enjoy a general right to design and enforce their own immigration policies. Unlike Walzer, though, Miller stops short of concluding that states may exclude potential immigrants on whatever grounds they like. As he puts it,
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      > I have tried to hold a balance between the interest that migrants have in entering the country they want to live in, and the interest that political communities have in determining their own character. Although the first of these interests is not strong enough to justify a right of migration, it is still substantial, and so the immigrants who are refused entry are owed an explanation. To be told that they belong to the wrong race, or sex (or have hair of the wrong color) is insulting, given that these features do not connect to anything of real significance to the society they want to join. Even tennis clubs are not entitled to discriminate among applicants on grounds such as these. (Miller 2014: 373–374)[^miller-2014]
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Miller’s analysis will be attractive to many, but some may worry that it is too quick. What would we say about a white woman who refused to even consider marrying someone outside of her race, for instance? We might well condemn her racism as deplorable, and we should not be the least bit surprised if non-whites were sorely offended by her attitudes, but presumably we would stop short of saying that she had a duty to marry a black person. And if a white person is within her rights to refuse to marry anyone who is not white, then why is a predominantly white political community not equally entitled to reject potential immigrants on the basis of their race?
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      Joseph Carens offers an answer to this question by invoking the standard distinction between public and private spheres. He writes, “There is a deep tension between the right of freedom of association and the right to equal treatment. One way to address this tension is to say that in the private sphere freedom of association prevails and in the public sphere equal treatment does. You can pick your friends on the basis of whatever criteria you wish, but in selecting people for offices you must treat all candidates fairly….So, the fact that private clubs may admit or exclude whomever they choose says nothing about the appropriate admission standards for states. When the state acts it must treat individuals equally.” (Carens 1987: 267–8)[^carens-1987] This answer is promising, but even if one is generally sympathetic to the public/private distinction, it is not obvious that it applies to admissions *into* a country in the same way that it applies to decisions regarding those already *within* this state. This is because, many presume that in order to be legitimate, states must treat all of their constituents as free and equal, and one way to pursue this freedom and equality is to ensure that individuals are not excluded from various spheres of power and prestige on the basis of their membership in historically disadvantaged groups. But because states need not ensure that their constituents are free and equal to all outsiders, it does not have the same reason to protect against foreigners being excluded on the basis of characteristics that would rightly be ruled out if used by public groups within the state.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Finally, Michael Blake (2003) has offered an account which promises to avoid all of these pitfalls. His view is striking because it explains the impermissibility of excluding outsiders on the basis of racist criteria in terms of how it mistreats insiders. If Australia refuses to allow Asians to enter the country, for instance, then this is an affront to all Asian Australians who are thereby treated as second class citizens. As he says, “To identify the purpose of the state with the preservation of a cultural group is inevitably to draw an invidious distinction against those citizens who do not happen to belong to that community. In all cases in which there are national or ethnic minorities—which is to say, the vast majority of actual cases—to restrict immigration for national or ethnic reasons is to make some citizens politically inferior to others…. Seeking to eliminate the presence of a given group from your society by selective immigration is insulting to the members of that group already present.” (Blake 2003: 232–3)[^blake-2003] Thus, Blake is able to explain what is objectionable about racist selection criteria by invoking the requirement that states treat all of their own constituents as free and equal, since these criteria clearly treat those insiders in the dispreferred group as inferior and subordinate.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Blake’s account has much to offer, but it has at least one major drawback: it appears unable to explain the impermissibility of a racially or culturally homogenous political community excluding potential immigrants on the basis of their race or culture. If Australia had no Asian citizens, for instance, then there would be no insiders who would be wronged by a policy excluding Asian immigrants, and thus Blake’s argument would provide us with no grounds to criticize it.
