      This liberal nationalist account invites all the usual questions: Do liberal democracies really depend upon sufficient trust and fellow-feeling among their compatriots, and, if so, is a common culture genuinely necessary to secure this trust and mutual concern? Just how homogenous must such a culture be? Liberal democracies like the United States and Canada seem to operate just fine despite a great deal of cultural diversity, for instance. In light of this, why worry that outsiders pose a substantial threat? Is it plausible to think that immigrants will not assimilate to the requisite degree once they have settled in their new state? And even if this account can in some cases justify excluding culturally distinct foreigners, it would appear to provide no grounds for limiting outsiders who share the requisite cultural attributes. Assuming that the answers to these empirical questions ultimately vindicate the liberal nationalist account, tricky moral questions remain. For instance, do the inhabitants of well-oiled liberal democracies have not only an interest, but a *moral right* to the exclusive protection afforded by their enviable political regimes? One potential response to this challenge is to suggest that citizens own their own state’s institutions because (by obeying the law and paying taxes, for instance) they have built and maintained them (Pevnick 2011)[^pevnick-2011]. And if citizens have a special moral claim to these institutions, this would explain their right to determine with whom, if anyone, they would like to share them. Some question this account, however, because they doubt that political institutions can be owned (Stilz 2019)[^stilz-2019].
    step1: |-
      这一自由民族主义说明引出一切常见问题：自由民主国家真的依赖同胞间足够的信任与休戚感吗？若是，共同文化真是获得这种信任与相互关切的必要条件吗？这种文化必须多同质？例如，美国与加拿大这样的自由民主国家，尽管文化多样性极大，似乎运作得挺好。有鉴于此，何必担心外人构成实质威胁？认为移民在新国家定居后不会同化到所需程度，这可信吗？而且，即便这一说明在某些情形下能为排斥文化上独特的外人提供辩护，它似乎也没有为限制具有必要文化属性的外人提供任何根据。假定这些经验问题的答案最终支持自由民族主义说明，棘手的道德问题依然存在。例如，运转良好的自由民主国家的居民，对其令人羡慕的政治制度所提供的排他性保护，是否不仅有一种利益，而且有一种道德权利？对这一挑战的一种可能回应是：公民拥有本国制度，因为（例如通过守法与纳税）他们建设并维护了这些制度（Pevnick 2011）[^pevnick-2011]。而若公民对这些制度有特殊道德主张，这就能解释他们有权决定愿与谁（如果有人的话）共享这些制度。然而，有人质疑这一说明，因为他们怀疑政治制度能否被拥有（Stilz 2019）[^stilz-2019]。
