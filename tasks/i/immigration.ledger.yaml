      As was explained above, Phillip Cole has offered reasons to question the view that democratic governance depends upon there being closed borders. More recently, though, Arash Abizadeh (2008) has extended this reasoning to argue that democratic principles are actually incompatible with a state’s right to unilaterally exclude outsiders. As he puts it, “anyone who accepts a genuinely democratic theory of political legitimation domestically is thereby committed to rejecting the unilateral domestic right to control and close the state’s boundaries…” (Abizadeh 2008: 38)[^abizadeh-2008] His argument involves two core premises, one moral and the second descriptive. The moral premise is his construal of the democratic justification thesis, which stipulates that a state’s coercive presence is illegitimate unless it is democratically justified to everyone coerced. The second premise is merely the descriptive observation that a state coerces foreigners when it forcibly prevents unwelcome immigrants from entering the state’s territory. In light of these two points, Abizadeh concludes that a state may not unilaterally exclude outsiders; it can permissibly adopt an exclusive immigration policy only if it democratically justifies this practice to outsiders. In other words, it would be impermissible for a state to forcibly restrict outsiders without first giving these outsiders a vote in the referendum which decided whether or not to adopt this restrictive immigration policy.
    step1: |-
      如前所述，菲利普·科尔提出了质疑“民主治理依赖于关闭边界”这一观点的理由。不过更晚近，阿拉什·阿比扎德（2008）把这一推理推进一步，论证民主原则实际上与单方面排斥外人的国家权利不相容。正如他所说：“任何在国内接受真正民主的政治正当化理论的人，由此也就承诺拒绝单方面控制并关闭国家边界的国内权利……”（Abizadeh 2008: 38）[^abizadeh-2008] 他的论证包含两个核心前提，一为道德，一为描述。道德前提是他对民主正当化论题的构想，该论题规定：除非对每个被强制者都得到民主正当化，国家的强制存在便不合法。第二个前提只是描述性观察：当国家以强制阻止不受欢迎的移民入境时，它强制了外国人。有鉴于此两点，阿比扎德得出结论：国家不得单方面排斥外人；只有当它向外国人民主地正当化这一做法时，才能可允许地采取排他性移民政策。换言之，国家若不先让这些外人在决定是否采取该限制性移民政策的公投中投票，就强制限制外人，将是不可允许的。
    step2: |-
      前已提及，菲利普·科尔曾质疑民主治理必须依赖关闭边界。晚近阿拉什·阿比扎德（2008）更进一步，论证民主原则实际上与国家单方面排斥外人的权利不相容。他说：“任何在国内接受真正民主的政治正当化理论者，也就承诺拒绝单方面控制并关闭国界的国内权利……”（Abizadeh 2008: 38）[^abizadeh-2008] 其论证有两个核心前提：道德的与描述的。道德前提是其对民主正当化论题的构想——除非对每个受强制者都作出民主正当化，国家的强制存在即不合法。描述前提只是一项观察：国家强行阻止不受欢迎的移民入境时，就是在强制外国人。据此，阿比扎德断言：国家不得单方面排斥外人；唯有向外国人民主地正当化该做法，排他性移民政策才可允许。换言之，国家若不先让外人在决定是否采行该政策的公投中投票，便不得强制限制外人。
