      As with so many issues in this area, Walzer’s (1983) treatment of this question is seminal. In this case, though, many have recoiled at his conclusions. To see why, consider his take on “White Australia,” Australia’s erstwhile practice of recruiting immigration from England while explicitly prohibiting immigration from non-European countries. Walzer writes, “Assuming, then, that there actually is superfluous land, the claim of necessity would force a political community like that of White Australia to confront a radical choice. Its members could yield land for the sake of homogeneity, or they could give up homogeneity (agree to the creation of a multiracial society) for the sake of the land. And those would be their only two choices. White Australia could survive only as Little Australia.” (Walzer 1983: 47)[^walzer-1983] Walzer may well be right that Australia had a duty to share its vast land with those who needed it, but it is striking that he had no principled objection aimed specifically at Australia’s racism. If Australia did not have so much territory, then Walzer apparently would not object to their excluding immigrants on the basis of their race or ethnicity.
    step1: TBD
    step2: TBD
