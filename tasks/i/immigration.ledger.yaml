      Another account of a country’s right to close its borders alleges that this right is merely one component of a state’s more general right to political self-determination (Walzer 1983; Pevnick 2011;Song 2019)[^pevnick-2011][^song-2019][^walzer-1983]. Specifically, some contend that a legitimate state’s right to freedom of association entitles it to choose whether or not to admit any given immigrants (Wellman 2008)[^wellman-2008]. This type of argument involves three basic premises (1) legitimate states have a right to political self-determination, (2) freedom of association is an essential component of self-determination, and (3) freedom of association entitles one to refuse to associate with others. Thus, just as we would consider it an egregious violation of an individual’s personal self-determination if she had no choice but to marry the suitor of her father’s choice, for instance, we should recognize that no political community is fully self-determining unless it has discretion over which potential immigrants to invite into its political community. According to this line of argument, then, there is nothing mysterious or complicated about a country’s right to screen applicants for admission: it is merely a standard component of a state’s more general right to self-determination.
    step1: |-
      另一种关于国家关闭边界权利的说明主张，这一权利只是国家更一般的政治自决权的一个组成部分（Walzer 1983; Pevnick 2011; Song 2019）[^pevnick-2011][^song-2019][^walzer-1983]。具体说，有人主张，合法国家的结社自由权使其有权选择是否接纳任何给定移民（Wellman 2008）[^wellman-2008]。这类论证包含三个基本前提：(1) 合法国家有政治自决权；(2) 结社自由是自决的必要组成部分；(3) 结社自由使一个人有权拒绝与他人结社。因此，正如若一个女人别无选择只能嫁给父亲选定的求婚者，我们会认为这是对其个人自决的严重侵犯，我们也应承认：任何政治共同体若无权酌情决定邀请哪些潜在移民进入其政治共同体，就不是完全自决的。按这一论证，一国筛选入境申请者的权利并无神秘或复杂之处：它只是国家更一般的自决权的标准组成部分。
