      Finally, Michael Blake (2003) has offered an account which promises to avoid all of these pitfalls. His view is striking because it explains the impermissibility of excluding outsiders on the basis of racist criteria in terms of how it mistreats insiders. If Australia refuses to allow Asians to enter the country, for instance, then this is an affront to all Asian Australians who are thereby treated as second class citizens. As he says, “To identify the purpose of the state with the preservation of a cultural group is inevitably to draw an invidious distinction against those citizens who do not happen to belong to that community. In all cases in which there are national or ethnic minorities—which is to say, the vast majority of actual cases—to restrict immigration for national or ethnic reasons is to make some citizens politically inferior to others…. Seeking to eliminate the presence of a given group from your society by selective immigration is insulting to the members of that group already present.” (Blake 2003: 232–3)[^blake-2003] Thus, Blake is able to explain what is objectionable about racist selection criteria by invoking the requirement that states treat all of their own constituents as free and equal, since these criteria clearly treat those insiders in the dispreferred group as inferior and subordinate.
    step1: TBD
    step2: TBD
