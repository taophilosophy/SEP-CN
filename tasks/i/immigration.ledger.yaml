      For the sake of argument, though, let us suppose that the gains of open borders would be greater than the costs. Even so, it is not clear that the utilitarian case for open borders is decisive, since, as a moral matter, it may be that states have the right to organize their affairs in a suboptimal fashion. Most believe that parents would retain the right to raise their natural children in exclusive, nuclear families even if Plato were right that it would be preferable if a community’s children were raised together by the community as a whole. And if we think, contra utilitarianism, that individuals are entitled to arrange their lives in suboptimal ways in the domestic sphere, why presume that political states lack the analogous right to organize themselves as they see fit in the geo-political context? Even if it were true that Norway and the European Union would be better off if the former joined this regional body, for instance, it seems to many that Norway should have the right to refrain from joining this Union. And if Norway has the right to (inefficiently) refuse to associate fully with the European Union, it might also be entitled to (inefficiently) refuse to associate with various individuals who would like to join Norway’s political community.
