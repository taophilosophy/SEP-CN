      沙克诺夫推测，这种对难民的狭窄理解很可能是现实政治压力的产物，来自那些对更宽泛定义会带来的国际法律义务心存警惕的领导人。正如他所说：“……各国从其恐惧出发反向推理：它们害怕将被迫单方面承担援助难民的重担，于是推出一种限制请求权人数的狭窄难民概念。”（Shacknove 1985: 277）然而，无论人们接受国际法律定义还是游说争取更宽泛的概念，都有广泛支持这样一种观点：难民构成潜在移民中的一个特殊类别，拥有格外紧迫的入境主张。因此，尽管理论家们对于国家是否有权设计并执行自己的移民政策可能激烈分歧，即便那些肯定国家一般有权排斥外国人的人，通常也对难民作例外处理。例如，美国拒绝接纳一位想在纽约学习并演出的俄罗斯芭蕾舞演员是一回事，而拒绝一位有充分理由恐惧本国压迫政权迫害的政治异见者则完全是另一回事。在后一情形中，难民处境的严峻被认为赋予她一项紧迫主张，压倒国家通常拥有的拒绝满怀希望的移民的推定权利。然而更晚近，有人开始质疑这一思路。很少有人主张国家对其境况危殆的外国人毫无义务，但理论家日益质疑：国家援助难民的义务是否必须以接纳他们的形式兑现。以伊拉克北部的库尔德人为例。鉴于他们在萨达姆·侯赛因统治下遭受的虐待，许多人会论证他们本应符合难民资格。提供援助的一种方式是在各外国给他们庇护。但历史表明，这不是唯一方式。另一种选择是在他们居住的地方保护他们，即在伊拉克北部设立由禁飞区保护的安全避难所。（第三种可能选择是富国付钱给较穷国家接纳难民。）当然，出于各种原因，各国可能不愿干预外国事务，但要点在于一个更一般的教训：即便我们认定稳定富裕国家对难民负有严格义务，也推不出这些义务必须以开放边界的形式履行。
