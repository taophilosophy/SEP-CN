      今天许多人不愿再 endorse 现实主义，部分因为他们拒斥霍布斯式道德进路，也因为他们相信，即便没有单一全球主权者，国家仍可被问责。有鉴于此，理论家通常觉得无需击败支持关闭边界的现实主义论证。然而值得指出，关闭边界的可允许性并不自动从现实主义推出，因为（更）开放的边界可能符合一国的国家利益。不仅是任何给定国家都可能以各种方式从移民中受益，也可能是该国本国公民拥有要求边界多孔的权利。例如，若个人拥有财产权，使其有权邀请外国人进入其土地，或拥有结社自由权，使其有权在国内与外国人结社，那么一国很可能有义务允许开放移民，即便它对局外人并不负任何道德义务。
