      One of the most sophisticated arguments on behalf of a state’s right to close its borders is the liberal nationalist approach, which suggests that liberal welfare states must exclude outsiders in order to function properly. This account emphasizes that states of this kind are able to operate as they do only because their citizens are willing to make the enormous political sacrifices necessary to sustain a vibrant democracy and equitable welfare state. What is more, these citizens are inclined to freely sacrifice in these ways only because they identify with one another. Were it not for this fellow feeling among compatriots, far fewer would be motivated to invest their personal energy in the democratic process or to give up a portion of their wealth in order to assist less fortunate fellow citizens. And finally, this identification among compatriots depends upon the existence of a shared culture (Miller 2014)[^miller-2014].
    step1: |-
      支持国家关闭边界权利的最精致论证之一，是自由民族主义进路；它主张自由的福利国家必须排斥外人才能正常运作。这一说明强调，这类国家之所以能如此运作，仅因其公民愿意作出维持蓬勃民主与公平福利国家所必需的重大政治牺牲。更重要的是，这些公民之所以愿意如此自由地牺牲，仅因他们彼此认同。若非同胞间的这种休戚与共感，愿意把个人精力投入民主进程、或放弃部分财富以帮助较不幸同胞的人会少得多。最后，同胞间的这种认同依赖于共同文化的存在（Miller 2014）[^miller-2014]。
    step2: |-
      支持国家关闭边界的最精致论证之一，是自由民族主义：自由的福利国家必须排斥外人，方能正常运转。此说强调，这类国家之所以能如此运作，只因公民愿意作出维系蓬勃民主与公平福利国家所需的重大政治牺牲；而他们之所以甘愿如此，只因彼此认同。若无同胞间这份休戚与共，愿意投身民主进程、或让出部分财富以助较不幸同胞者将少得多。而这种同胞认同，又依赖共同文化的存在（Miller 2014）[^miller-2014]。
