      ### 1.2 Sustaining the Economy
    step1: |-
      ### 1.2 维持经济
    step2: |-
      ### 1.2 维持经济
  - id: 8
    kind: body
    source: |-
      Another popular argument against open borders is that the influx of newcomers will hurt the economy. In its most straightforward version, this argument simply assumes that the domestic economy can support only a certain number of workers, but more nuanced renditions allege more specifically that at least some types of foreigners should be excluded because, given the cultural differences between insiders and these particular outsiders, the inclusion of the latter would not be conducive to economic growth (perhaps because these outsiders lack the requisite work ethic, for instance).
    step1: |-
      反对开放边界的另一个流行论证是：新来者的涌入会损害经济。在其最直白的版本中，这一论证只假定国内经济只能支撑一定数量的工人；但更细致的表述更具体地主张，至少某些类型的外国人应被排斥，因为鉴于内部人与这些特定外来者之间的文化差异，纳入后者不利于经济增长（也许因为这些外来者缺乏必要的工作伦理，例如）。
    step2: |-
      另一常见论证说，开放边界会让大量新来者涌入，损害经济。最直白的版本只假定国内经济仅能容纳一定数量的工人；较精细的版本则主张，至少某些类别的外国人应予排斥，因为内部人与这些外来者文化不同，纳入后者不利于经济增长（例如这些外来者缺乏必要的工作伦理）。
  - id: 9
    kind: body
    source: |-
      The most common response to this argument is simply to contest that allowing immigrants will have negative economic consequences. It seems clear that some in the domestic economy may be harmed (typically the less skilled workers disproportionately bear the brunt of the costs, since they must now compete with immigrants whose presence drives down wages), but the economy as a whole often benefits as (1) firms are able to hire cheaper labor (and pass along correspondingly lower prices to consumers), and (2) there is an increased demand for various goods and services. More generally, even if a given domestic economy might suffer if it did not restrict immigration, economists tend to agree that the global economy as a whole would profit from fewer restrictions on who can work where. (From an purely economic perspective, the inefficiencies of barring Africans from competing for work in European countries are costly, just as those which resulted from prohibiting women from working in a ‘man’s’ job were.) This recognition that there will inevitably be net winners and losers whenever a market restriction is lifted points toward the important moral question as to whether anyone has a moral right to the economic benefits of the status quo. For example, let us suppose that less skilled American laborers would be harmed, whereas American firms and consumers along with Mexican immigrants would benefit if the current restriction on Mexican immigration were lifted. If so, then immigration would be impermissible in this case only if the potentially displaced American workers have a right not to face the increased competition for their jobs (Macedo 2007)[^macedo-2007].
    step1: |-
      对这一论证最常见的回应，就是径直质疑允许移民会有负面经济后果。看来清楚的是，国内经济中一些人可能受损（通常是技术较低的工人不成比例地承担代价，因为他们现在必须与压低了工资的移民竞争），但整体经济往往受益，因为 (1) 企业能够雇佣更廉价的劳动力（并把相应更低的价格转给消费者），(2) 对各种商品与服务的需求增加。更一般地说，即便某个国内经济体若不加限制可能受损，经济学家往往同意，对谁能在哪里工作的限制越少，全球经济整体越受益。（从纯经济角度看，禁止非洲人在欧洲国家竞争工作的低效代价高昂，正如先前禁止女性从事“男人的”工作所造成的低效一样。）这种承认——每当市场限制被解除，必然有净赢家与净输家——指向一个重要道德问题：任何人是否有道德权利获得现状的经济利益。例如，假设取消对墨西哥移民的现行限制会使技术较低的美国劳工受损，而使美国企业、消费者以及墨西哥移民受益。若如此，则只有在可能被取代的美国工人拥有“免于面对工作竞争加剧”的权利时，此情形下的移民才是不可允许的（Macedo 2007）[^macedo-2007]。
    step2: |-
      最常见的回应是直接否认允许移民会有负面经济后果。国内经济中确有人可能受损——通常技术较低的工人不成比例地承受代价，因为他们须与压低工资的移民竞争——但整体经济往往受益：(1) 企业可雇到更廉价的劳动力（并把更低价格转给消费者）；(2) 对各类商品与服务的需求增加。更一般地说，纵使某个国内经济体因不加限制而受损，经济学家多半同意：对“谁能在哪里工作”的限制越少，全球经济整体越受益。（纯从经济看，禁止非洲人在欧洲国家竞争工作，与当年禁止女性从事“男人的”工作一样，低效而代价高昂。）由此可知：市场限制一旦解除，必有净赢家与净输家。这就逼出一个道德问题——任何人是否有道德权利享有现状的经济利益？例如，假设取消对墨西哥移民的现行限制会使技术较低的美国劳工受损，而美国企业、消费者与墨西哥移民受益。那么，唯当可能被取代的美国工人拥有“免于工作竞争加剧”的权利时，此情形下的移民才不可允许（Macedo 2007）[^macedo-2007]。
  - id: 10
    kind: body
    source: |-
      We cannot presume that these domestic workers necessarily lack such a right, but neither should we assume that they have it. What is more, even if these workers have a right not to be harmed, it does not follow that opening the economy to foreign workers must be impermissible, at least if there were some way the workers could be adequately compensated for the costs that they disproportionately bear. (Think, for instance, of how the US government routinely provides special unemployment and educational benefits to displaced workers, like those in the textile industry, who lose their jobs as a consequence of new legislation liberalizing trade with foreign countries.) To be successful, then, the economic argument must be much more sophisticated than it might initially appear; in addition to establishing that at least some people will incur economic losses, proponents of this approach must demonstrate that these victims have a moral right to be spared these costs, a right for which they cannot be adequately compensated in other ways.
    step1: |-
      我们不能预设这些国内工人必然没有这种权利，但也不应假定他们有。更重要的是，即便这些工人有不受损害的权利，也推不出向外国工人开放经济必然不可允许——至少如果存在某种办法能充分补偿他们不成比例承担的代价。（例如想想美国政府如何惯常地为因与外国贸易自由化的新立法而失业的流离失所工人——如纺织业工人——提供特别失业与教育补助。）因此，经济论证若要成功，必须远比初看时精细：除了确立至少一些人会蒙受经济损失之外，这一进路的支持者还必须证明这些受害者有道德权利免于这些代价，且这种权利无法以其他方式得到充分补偿。
    step2: |-
      我们不能预设这些国内工人没有此类权利，也不该假定他们有。更重要的是：即便工人有不受损害的权利，也推不出向外国工人开放经济必然不可允许——只要存在某种办法足以补偿他们不成比例承受的代价。（试看美国政府如何惯常为因贸易自由化新法而失业的工人——如纺织业者——提供特别失业与教育补助。）所以，经济论证若要成立，必须远比初看精细：不但要证明至少有人蒙受经济损失，还须证明这些受害者拥有免于该代价的道德权利，且此种权利无法以其他方式获得充分补偿。
