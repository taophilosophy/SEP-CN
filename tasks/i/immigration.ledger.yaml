      移民的管辖权理论强调，政治国家在道德上须尊重每个人的人权，但只有义务保护其领土内者的人权。有鉴于此，每当有人移居新国家，接收国公民便以她到来之前所无的方式对新来者负有责任。因此，设想人人都应能自由移居任何喜欢的国家，似乎很奇怪，因为这会赋予我们每个人单方面把道德责任强加于他人的资格。若我们珍视个人自由，就至少应以“反对外人有权单方面把这类责任硬塞给我们”为起点（Blake 2013）[^blake-2013]。我们对非自愿义务的豁免也许不是绝对的，但大概需要某种有说服力的竞争性考虑才能压倒它。例如，若某人除非移居加拿大否则不能享有对其人权的充分保护，那么这一脆弱者或有资格未经许可移民，尽管此举会使加拿大公民背负他们未曾同意的道德义务。但若某人的人权在别处已获充分尊重，却仅因觉得在加拿大更幸福而想移居，那么加拿大人若不愿为其人权保护负责，就完全有权强制排斥她。
