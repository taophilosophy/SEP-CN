      Some defend open borders on the grounds that excluding outsiders violates their human rights. Virtually everyone agrees that states are morally required to respect human rights, so this approach is particularly promising. The crucial question, of course, is whether any human rights are necessarily violated when states deny entry to prospective immigrants. The most frequently invoked human right in this context is freedom of movement (Cole 2000)[^cole-2000]. After all, if a country forcibly restricts outsiders from entering its territory, it thereby limits their freedom of movement. Authors like David Miller have questioned this approach, however, on the grounds that it requires an implausible conception of the human rights (Miller 2014)[^miller-2014]. If we understand human rights as the institutional protections one needs against the standard threats to living a minimally decent human life, we might doubt whether one’s human right to freedom of movement requires the option to move anywhere in the world one likes. On the contrary, as long as one has sufficient freedom of movement to explore an adequate range of personal and professional opportunities, one would appear to be able to live a minimally decent human life.
    step1: |-
      有人以排斥外人侵犯其人权为由为开放边界辩护。几乎人人都同意国家在道德上须尊重人权，因此这一进路特别有希望。关键问题当然是：当国家拒绝潜在移民入境时，是否必然侵犯任何人权。此语境中最常援引的人权是迁徙自由（Cole 2000）[^cole-2000]。毕竟，若一国强制限制外人进入其领土，它便限制了他们的迁徙自由。然而，大卫·米勒等作者质疑这一进路，理由是它需要一种不可信的人权概念（Miller 2014）[^miller-2014]。若把人权理解为过一种最低限度体面人类生活所需、用以抵御标准威胁的制度性保护，我们便可怀疑：一个人的迁徙自由人权是否要求拥有移居世界任何喜欢之处的选项。相反，只要一个人有充分的迁徙自由去探索足够范围的个人与职业机会，他似乎就能过最低限度体面的生活。
