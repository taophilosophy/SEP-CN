      ### 1.3 Distributing State Benefits
    step1: |-
      ### 1.3 分配国家福利
    step2: |-
      ### 1.3 分配国家福利
  - id: 12
    kind: body
    source: |-
      A related but distinct argument for closed borders focuses on the distribution of state benefits like welfare payments and health insurance. The basic idea here is that countries like Sweden and Canada, for instance, must limit immigration in order to sustain anything like their current provision of state benefits. If an affluent welfare state placed no restrictions on who could enter, then masses of poor people from around the world would flock to this country in order to take advantage of its provision of health and welfare benefits. Indeed, presumably so many would immigrate that there would be no way for this state to continue distributing these benefits at anything like their current rate. Thus, given the existing levels of global poverty, it appears as though you can have open borders or welfare states, but you cannot have both.
    step1: |-
      一个相关但不同的支持关闭边界的论证聚焦于国家福利（如福利金与医疗保险）的分配。基本想法是：像瑞典和加拿大这样的国家必须限制移民，才能维持其目前水平的国家福利供给。如果一个富裕福利国家不限制谁能进入，那么世界各地的大量穷人就会涌向这个国家，利用其提供的医疗与福利。确实，大概会有太多人移民，以致该国无法以接近目前的速度继续分配这些福利。因此，鉴于全球贫困的现有水平，看来你要么可以有开放边界，要么可以有福利国家，但不能两者兼得。
    step2: |-
      另一相关而不同的论证着眼于国家福利（福利金、医疗保险等）的分配。其基本想法是：瑞典、加拿大之类国家必须限制移民，方能维持现有福利供给水平。富裕福利国家若不加限制，世界各地的大量穷人便会涌来，享用其医疗与福利；涌入者恐怕多到该国无法再按接近现有的水平发放。于是，以当今全球贫困的程度看，开放边界与福利国家似乎只能二选一。
  - id: 13
    kind: body
    source: |-
      It seems hard to deny that rich welfare states like the Scandinavian countries would be inundated with migrants if they lifted all restrictions on immigration, but not everyone agrees that this fact necessarily justifies keeping people out. A libertarian, for instance, would likely regard this as just one more reason to abandon the welfare state. That is, faced with the choice between either respecting everyone’s right to freedom of movement or designing states that can effectively guarantee ample levels of health coverage and welfare transfers to their citizens, the libertarian would favor the former. It is important to recognize, though, that these are not the only two options; the best answer may lie in some middle ground between these two stark alternatives. In particular, perhaps existing welfare states could open their borders to everyone and then provide no, or at least delayed, welfare benefits to newcomers (Kukathas 2014)[^kukathas-2014]. Imagine, for instance, if Sweden stipulated that immigrants would have their income and wealth taxed from the moment they entered the country, but they would not become vested until they had contributed to the state coffers for something like five years. If immigrants were forced to contribute during a waiting period, such an arrangement would presumably strengthen rather than jeopardize the host state’s capacity to provide state benefits. Thus, while some would no doubt object to newcomers facing a period in which they were net losers, this proposal at least shows that welfare states need not be incompatible with open borders.
    step1: |-
      很难否认，像斯堪的纳维亚国家这样的富裕福利国家若取消一切移民限制，会被移民淹没；但并非人人都同意这一事实必然为把人拒之门外提供辩护。例如，自由至上主义者很可能把这看作放弃福利国家的又一个理由。也就是说，面对“尊重每个人自由迁徙的权利”与“设计能有效保障公民充分医保与福利转移的国家”之间的选择，自由至上主义者会偏爱前者。然而，重要的是要认识到，这并非仅有的两个选项；最佳答案可能在这两个截然对立的选项之间的某种中间地带。尤其，也许现有福利国家可以向所有人开放边界，然后不给新来者提供福利，或至少延迟提供（Kukathas 2014）[^kukathas-2014]。例如，设想瑞典规定：移民自入境之时起即须缴纳所得税与财富税，但须缴满约五年才取得福利资格。如果移民在等待期内被迫缴费，这样的安排大概会增强而非危及东道国提供国家福利的能力。因此，虽然无疑会有人反对新来者经历一段净损失期，但这一提议至少表明，福利国家不必与开放边界不相容。
