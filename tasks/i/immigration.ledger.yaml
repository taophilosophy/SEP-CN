      Not everyone accepts this restricted construal of the right to freedom of movement. Keiran Oberman, for instance, acknowledges that there is currently no legal human right to immigrate, but he argues that the same reasons that support the moral human right to freedom of movement within countries vindicate a moral human right to move from one country to another. As he emphasizes, “We should not then reject the conventional view of human rights as protecting the freedom to access the full range of available life options. However, if we accept this conventional view, then we must accept that people have an essential interest in being free to immigrate to other states, for otherwise the range of life options they can access is greatly constrained” (Oberman 2016: 44). One might resist this argument, however, if one believes either that restricting domestic freedom of movement is distinctively pernicious or that countries have special reasons to control immigration. As David Miller puts it, “states can have legitimate grounds for opposing an international right to free movement that they do not have in the domestic case. The other side of the coin is that restrictions on international movement, unlike restrictions on domestic movement, are not targeted at specific groups with the aim of disadvantaging them in ways that put their human rights at risk” (Miller 2016a: 25)[^miller-2016a].
