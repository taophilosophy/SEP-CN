      Those who think that there is a natural duty to support just institutions may question the pivotal premise in this approach: that we should be skeptical of political obligations to which we have not consented. After all, if each of us was really immune from political duties to which we did not consent, then many of us would not have duties to protect the human rights of our compatriots. But if we must do our part of the collective chore of protecting the human rights of our fellow citizens despite the fact that we never agreed to do so, why think that there is anything distinctively problematic about our similarly having such duties to newcomers who have recently immigrated? Indeed, given that we are already morally encumbered with duties to protect the human rights of those within our state’s territorial boundaries, an influx of newcomers does not create any new types of duties, at most it creates additional tokens which would make fulfilling these responsibilities more costly (Kates and Pevnick 2014)[^kates-2014].
