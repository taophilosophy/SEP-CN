      ### 3.4 Irregular Migrants
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Following Joseph Carens (2013), I call those who have settled in a foreign country without authorization (who some label “undocumented” or “illegal” immigrants) *irregular* migrants. Irregular migrants pose vexing moral questions even for those who are convinced that states have the right to control immigration, because many believe that over time an irregular migrant can gradually acquire a moral right to stay (and perhaps even to full and equal citizenship), despite the fact that she had no right to migrate without authorization in the first place. Carens articulates this sentiment nicely when he writes:
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      > The moral right of states to apprehend and deport irregular migrants erodes with the passage of time. As irregular migrants become more and more settled, their membership in society grows in moral importance, and the fact that they have settled without authorization becomes correspondingly less relevant. At some point a threshold is crossed, and they acquire a moral claim to have their actual social membership legally recognized. They should acquire a legal right of permanent residence and all the rights that go with that, including eventual access to citizenship. (Carens 2013: 150)[^carens-2013]
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Given the psychological importance of social membership and the fact that (authorized or not) a migrant will typically become deeply socially imbedded in her new society after a prolonged period, the appeal of this judgment is easy to appreciate. Critics might counter, however, that this account wrongly presumes that psychological attachment is sufficient to generate moral entitlement. To see why one might doubt this, imagine that I grow incredibly attached to the Mona Lisa during the ten years that it takes for the authorities to discover that I am the one who stole it from the Louvre. No matter how attached I become to the painting (and regardless of how psychologically difficult it would be for me to be happy without it), most would presumably deny that I have therefore acquired a right to retain the stolen painting. And given that we are so resistant to suppose that the right of authorities to reclaim the Mona Lisa and return it to the Louvre erodes with the passage of time, perhaps we should similarly be suspicious of the notion that the “moral right of states to apprehend and deport irregular migrants erodes with the passage of time” (as in the quote from Carens above).
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      One exception to this line of thought may be the children of irregular migrants who were brought to the new country at a very young age. After all, because they had no choice in their migration, they have no culpability which needs to erode over time. Critics have room to resist even this case, however, because the crucial issue is *entitlement*, not *culpability*. Suppose that I pass the Mona Lisa on to my son, Jackson (who has no idea that I stole it), and that he becomes incredibly attached to it over the course of several years. Despite the twin facts that (1) Jackson is in no way culpable for possessing the Mona Lisa and (2) he has gradually become very attached to it, he does not seem entitled to keep the painting. And if we believe the authorities would violate none of Jackson’s rights if they took the Mona Lisa from him and returned it to the Louvre, why think that the authorities would violate the rights of an irregular migrant who at a young age had settled without authorization in a foreign country with her parents? Just as Jackson should not be punished for his possession of the painting, the child should clearly not be punished for having entered a foreign country without authorization. But Jackson’s right against being punished is distinct from his right to retain the Mona Lisa, and the child’s right not to be punished for her family’s migration is distinct from her right to remain in the new country. These objections do not show that irregular migrants do not gradually acquire a right to stay, but they do suggest that advocates of this position who also believe in the state’s right to control immigration must do more than merely point to the psychological costs to those who might be deported.
