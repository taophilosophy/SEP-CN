      ### 1.9 Realism
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Though less popular than it once was, international relations was once dominated by realists who argued that political states are not constrained by morality in their dealings with foreign states and individuals. The basic idea motivating this approach was most often the Hobbesian presumption that morality consists solely of contracts that are binding only in the presence of a sovereign who could enforce them. And since there is no world sovereign capable of punishing states, the latter cannot be morally bound by any putative contracts which purport to apply to them. As a consequence, realists have traditionally supposed that states will and should orient their dealings with foreigners in whatever fashion maximally suits their national interests. And if this is correct, there can be no duties of any kind owed to foreign states or individuals, and thus no duty to open one’s borders to foreigners.
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Many are reluctant today to endorse realism, in part because they reject the Hobbesian approach to morality, but also because they believe that states can be held accountable even in the absence of a single, global sovereign. Given this, theorists typically feel no need to defeat the realist case for closed borders. It is worth noting, however, that the permissibility of closed borders does not automatically follow from realism, because (more) open borders may be in a country’s national interest. It is not just that any given country might stand to benefit in various ways from immigration, it may also be that a country’s own citizens have rights which require the state’s borders to be porous. If individuals have property rights which entitle them to invite foreigners onto their land or rights to freedom of association which entitle them to associate domestically with foreigners, for instance, a country may well be duty-bound to allow open immigration *even if it owes no moral duties to outsiders*.
