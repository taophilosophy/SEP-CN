      作为回应，菲利普·科尔（2000）等理论家提出至少两条理由，质疑民主是否需要关闭边界。第一，即便惠兰正确，即除非把人划分入地域界定的群体，民主便不能正常运作（例如，一个民主的世界国家有什么错？），为何由此推出任何给定领土边界内的成员必须对入境拥有控制权？科尔以更大联邦结构内的地方与区域民主单位为反例，提出：“看来清楚的是，民主权利可以限于一个区域，人们自由进出该区域，并在居留期间行使地方民主权利。”（Cole 2000: 184）[^cole-2000] 第二，科尔提出，坚持民主的主要理由之一，大概是这样一个信念：除非被强制者在政治安排如何排序上获得平等发言权，强制性的政治制度便不可允许地强加于人。但若如此，则只把选举权扩展给已在领土边界内的人就成问题，因为正如科尔提醒我们的，“有两群人受制于国家法律：其自身成员，以及申请加入的非成员。”（Cole 2000: 186）[^cole-2000] 因此，由于排他性移民法是对寻求入境的外国人的强制施加，民主原则表明这些外人在移民法上也应有发言权。所以若科尔正确，关闭边界的民主理由有双重问题。不仅“开放边界与运作中的民主不一致”为假，民主原则甚至可能禁止国家强制排除被剥夺选举权的外国人入境。
