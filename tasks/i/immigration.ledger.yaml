      In response, an advocate of the jurisdictional approach might counter that prospective immigrants have no right to unilaterally act in ways that make our natural duties more demanding. But retreating to this position raises new questions. Given that immigrants also contribute to the state’s performance of its political functions, it is not obvious why an influx of prospective immigrants would necessarily make it more difficult for those already present to fulfill their political obligations. (Indeed, given economies of scale, the newcomers may often lighten the load of the native population.) And even if there are instances in which the arrival of immigrants would create net costs for a state’s existing population, this fact would generate a right to forcibly exclude outsiders only if the increased demands upon those already present should be given moral precedence over the costs imposed upon prospective immigrants who are denied entry. Because prospective immigrants often have pressing interests in entering a country (even if their human rights are satisfactorily protected), however, there may be many cases in which the interests of those who want to enter would prevail over a native population’s desire to avoid more costly political responsibilities (Kates and Pevnick 2014)[^kates-2014].
