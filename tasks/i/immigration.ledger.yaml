      ### 2.1 Cosmopolitan Egalitarianism
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      The cosmopolitan egalitarian case for open borders combines the core moral insight that all human beings, whether they are compatriots or foreigners, are equally deserving of moral consideration with the central empirical observation that one’s country of birth often has a profound impact upon one’s life prospects. The staggering levels of international inequality would not be so objectionable if the typical Swede had done something to deserve a better life than the typical Chadian, for instance, but the truth, of course, is that Swedes were merely lucky to have been born in Sweden rather than Chad. And given this, what justification could the Swedes have for putting guns at their borders to deter Chadians from trying to move north and take advantage of the preferable social, political and economic environment? In the eyes of cosmopolitan egalitarians, they have none. As Joseph Carens puts it, “Citizenship in Western liberal democracies is the modern equivalent to feudal privilege—an inherited status that greatly enhances one’s life chances. Like feudal birthrights privileges, restrictive citizenship is hard to justify when one thinks about it closely.” (Carens 1987: 252)[^carens-1987] In other words, egalitarians regard open borders as the requisite response to the enormous economic inequalities which currently exist between countries.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      This case for open borders presumes a specific, highly contentious version of cosmopolitan egalitarianism. Thus, if one were not an egalitarian (or, more specifically, if one were not a so-called “luck” egalitarian who believes that justice requires that we correct for all inequalities which stem merely from luck), or if one denied that egalitarian (or at least luck egalitarian) considerations extend beyond one’s political borders, then one would be unmoved by this argument. More importantly, even if one accepts all of the cosmopolitan egalitarian’s moral premises, it is not clear that the desired conclusion follows. This is because wealthy states seem to have other ways to fulfill their duties of distributive justice. Even if Sweden has demanding duties of distributive justice to Chad, for instance, why may Sweden not keep its borders closed as long as it transfers the requisite amount to Chad? That is typically how we handle duties of distributive justice in the domestic realm. Consider Jeff Bezos, for instance. While there are various accounts of Bezos’s duties to share his wealth with those who are less fortunate, no one supposes that he must remarry, adopt or otherwise open his family to a poor person. Rather, whatever he must transfer to others, everyone agrees that he can exclude others from his home life as long as he fulfills his duties of distributive justice. And if duties of distributive justice do not undermine an individual’s right to freedom of association in the domestic realm, why need they do so for a state in the international arena? If Jeff Bezos need not open his home to those who are less fortunate, then why must Sweden welcome poor foreigners into their political community?
