      When one thinks of the individual rights that might conflict with a state’s control over immigration, an outsider’s right to freedom of movement is likely to come to mind. As Joseph Carens reminds us, though, the rights of insiders are also limited when the political community as a whole has dominion over immigration. As he explains, “Suppose a farmer from the United States wanted to hire workers from Mexico. The government would have no right to prohibit him from doing this. To prevent the Mexicans from coming would violate the rights of both the American farmer and the Mexican workers to engage in voluntary transactions.” (Carens 1987: 253)[^carens-1987] Thus, a state’s exclusive immigration policy is doubly disrespectful of individual rights, because it interferes with both an outsider’s freedom of movement and an insider’s property right to unilaterally invite foreigners onto her land.
    step1: |-
      当人们想到可能与国家对移民的控制相冲突的个人权利时，外人的自由迁徙权很可能浮现脑际。然而，正如约瑟夫·卡伦斯提醒我们的，当政治共同体整体对移民拥有支配权时，内部人的权利也受限制。他解释说：“假设一位美国农场主想雇佣来自墨西哥的工人。政府无权禁止他这样做。阻止墨西哥人前来会侵犯美国农场主与墨西哥工人从事自愿交易的权利。”（Carens 1987: 253）[^carens-1987] 因此，国家的排他性移民政策对个人权利有双重不敬，因为它既干涉外人的自由迁徙，也干涉内部人单方面邀请外国人进入其土地的财产权。
    step2: |-
      说到可能与国家移民控制相冲突的个人权利，人们先想到的往往是外人的自由迁徙权。但约瑟夫·卡伦斯提醒：当政治共同体整体支配移民时，内部人的权利同样受限制。他写道：“假设一位美国农场主想雇用墨西哥工人，政府无权禁止。阻止墨西哥人来，既侵犯美国农场主的权利，也侵犯墨西哥工人的权利——他们从事自愿交易的权利。”（Carens 1987: 253）[^carens-1987] 于是，排他性移民政策对个人权利的冒犯是双重的：既干涉外人迁徙自由，也干涉内部人单方面邀外国人入其土地的财产权。
