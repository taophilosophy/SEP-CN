      这一支持开放边界的论证预设了一种特定而极具争议的世界主义平等主义版本。因此，若一个人不是平等主义者（更具体说，若不是所谓“运气”平等主义者——相信正义要求我们矫正一切仅源于运气的平等），或者否认平等主义（或至少运气平等主义）考量延伸至政治边界之外，那么他就不会为这一论证所动。更重要的是，即便接受世界主义平等主义者的全部道德前提，所期望的结论是否随之而来也不清楚。这是因为富裕国家似乎有其他方式履行其分配正义义务。例如，即便瑞典对乍得负有苛刻的分配正义义务，为何瑞典不能在向乍得转移所需数额的同时保持边界关闭？我们通常就是这样处理国内领域的分配正义义务的。以杰夫·贝索斯为例。关于贝索斯与较不幸者分享财富的义务有各种说明，但没人认为他必须再婚、收养或以其他方式向一个穷人开放自己的家庭。相反，无论他必须向他人转移什么，人人都同意，只要履行分配正义义务，他就可以把他人排除在自己的家庭生活之外。而若分配正义义务在国内领域并不削弱个人的结社自由权，为何在国际舞台上一个国家就须如此？若杰夫·贝索斯无须向较不幸者开放家庭，瑞典为何必须欢迎贫穷的外国人进入其政治共同体？
