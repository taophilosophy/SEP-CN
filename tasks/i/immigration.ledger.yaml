      ### 1.1 Preserving Culture
    step1: |-
      ### 1.1 保全文化
    step2: |-
      ### 1.1 保全文化
  - id: 4
    kind: body
    source: |-
      The most popular argument for the permissibility and importance of closing borders to outsiders is that this exclusion is necessary in order to preserve a state’s distinctive culture. The appeal of cultural continuity is easy to appreciate. As David Miller explains, “the public culture of their country is something that people have an interest in controlling: they want to be able to shape the way that their nation develops, including the values that are contained in the public culture. They may not of course succeed: valued cultural features can be eroded by economic and other forces that evade political control. But they may certainly have good reason to try, and in particular to try to maintain cultural continuity over time, so that they can see themselves as the bearers of an identifiable cultural tradition that stretches backward historically.” (Miller 2014: 370)[^miller-2014] Think of the United States, for instance. If the US placed no limits on immigration from Canada, it is clear neither how many Canadians would move south, nor whether their migration would have a discernible affect upon American culture. If the United States did not limit immigration from Mexico, on the other hand, it seems almost certain that much larger numbers of Mexicans would migrate north and that the changes to American culture would be regarded by many as rapid and dramatic. (Huntington 2005) If so, it seems likely that open borders would quickly lead to changes that would leave many Americans less comfortable in their own homeland. Given this, the concern to preserve one’s native culture seems to provide a reasonable justification for restricting immigration.
    step1: |-
      支持对外人关闭边界之可允许性与重要性，最流行的论证是：这种排斥对于保全一国独特文化是必要的。文化连续性的吸引力不难理解。正如大卫·米勒所解释的：“他们国家的公共文化是人们有兴趣控制的东西：他们想要能够塑造其民族发展的方式，包括公共文化所包含的价值。他们当然可能不会成功：受珍视的文化特征可能被逃逸于政治控制之外的经济及其他力量侵蚀。但他们当然可能有充分理由去尝试，尤其是尝试随时间维持文化连续性，以便能把自己看作一种可辨认的、在历史上向后延伸的文化传统的承载者。”（Miller 2014: 370）[^miller-2014] 以美国为例。如果美国对来自加拿大的移民不设任何限制，那么既不清楚会有多少加拿大人南迁，也不清楚其迁移是否会对美国文化产生可辨的影响。另一方面，如果美国不限制来自墨西哥的移民，则几乎可以肯定会有多得多的墨西哥人北迁，而美国文化的变化会被许多人视为迅速而剧烈。（Huntington 2005）若如此，开放边界很可能迅速带来变化，使许多美国人在自己的家园中感到不那么自在。有鉴于此，保全本土文化的关切似乎为限制移民提供了合理辩护。
    step2: |-
      主张对外关闭边界既正当又重要，最流行的论证是：非如此不足以保全一国特有文化。文化连续性的吸引力不难体会。大卫·米勒说：“本国公共文化是人们有意加以掌控者：他们希望塑造民族发展的方式，包括公共文化所含的价值。他们当然未必成功——受珍视的文化特征可能被经济等不受政治控制的力量侵蚀。但他们完全可能有充分理由一试，尤其是力图维持文化在时间上的连续，好让自己成为某种可辨认、在历史上向后延伸的文化传统之担纲者。”（Miller 2014: 370）[^miller-2014] 以美国为例：若对加拿大移民不设限额，既不知会有多少加拿大人南下，也不知其迁徙能否在美国文化上留下可辨痕迹。但若对墨西哥移民不设限，则几乎肯定会有远为众多的墨西哥人北上，而美国文化之变会被许多人视为迅速而剧烈（Huntington 2005）。果如此，开放边界恐将很快带来变化，使许多美国人在故土上反觉不适。于是，保全本土文化的关切似为限制移民提供了合理理由。
  - id: 5
    kind: body
    source: |-
      This line of argument invites a number of empirical and moral questions. Among the empirical questions, we might ask how confident we can be about the numbers and influence of the potential immigrants. Is the immigrants’ culture really that distinctive? And are we sure that these newcomers will resist assimilation? Also, how can we be sure that the cultural changes will be rapid and detrimental? Skeptics of this line of argument often object that people tend to (1) exaggerate how distinctive—and distinctively valuable—their existing cultures are (it is notoriously difficult to characterize “American” culture, for instance), (2) irrationally fear change, and (3) underestimate how much their culture is changing anyway, in the absence of immigration. Even if all of these descriptive objections can be definitively answered, important moral challenges remain. In particular, even if citizens have an understandable *interest* in maintaining cultural continuity, it remains an open question as to whether they have a corresponding moral right (and, if so, one might wonder about how weighty this right is). These questions matter, because outsiders may also have competing interests in, and/or rights to, enter the country in question, and thus they may permissibly be excluded only if the rights of insiders to preserve their cultural continuity outweigh any rights of foreigners to enter the political territory.
    step1: |-
      这一论证路数引出若干经验问题与道德问题。在经验问题中，我们可以问：我们对潜在移民的数量与影响能有多大把握？移民的文化真的那么独特吗？我们能确定这些新来者会抵制同化吗？又如何确知文化变化会迅速而有害？怀疑这条论证的人常常反驳说，人们倾向于：(1) 夸大自己既有文化的独特性——以及独特的价值（例如“美国”文化就以难以刻画著称）；(2) 非理性地恐惧变化；(3) 低估在没有移民的情况下，其文化本来就在变化多少。即便所有这些描述性反对意见都能被明确回答，仍有重要的道德挑战：尤其，即便公民对维持文化连续性有一种可理解的利益，他们是否有相应的道德权利仍是一个开放问题（若有，人们还会问这权利有多重）。这些问题要紧，因为外人对于进入该国也可能有竞争性的利益和/或权利，因此，只有当内部人保全文化连续性的权利重于外国人进入政治领土的权利时，排斥外人才可能是可允许的。
    step2: |-
      这条论证引出若干经验与道德问题。经验方面：我们对潜在移民的人数与影响能有几分把握？移民文化果真那么独特？我们能确定新来者会抗拒同化？又何以确知文化变化既快又有害？怀疑者常反驳：人们往往 (1) 夸大既有文化之独特（及其独特价值，例如“美国”文化就以难以界定著称）；(2) 非理性地惧怕变化；(3) 低估即使没有移民，文化本来也在变。纵使这些描述性反对都能圆满答复，重大道德挑战仍在：公民对维持文化连续性虽有可理解的利益，是否拥有相应道德权利仍属未决（若确有，其分量亦待衡量）。此点要紧，因为外人进入该国也或有竞争性利益与权利；故唯有内部人保全文化连续性的权利重于外人进入政治领土的权利，排斥外人才站得住。
  - id: 6
    kind: body
