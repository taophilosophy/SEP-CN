      ## 4. Conclusion
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      As the preceding analysis makes plain, there is room for reasonable people to disagree about a variety of important issues regarding the morality of immigration. It is important to recognize, though, that no one defends the status quo. Rather than suggest that all existing states may exclude outsiders as they see fit, for instance, those who defend the right to restrict immigration typically argue that *some* states may *in some circumstances* exclude *some* prospective immigrants. And while many deny that refugees have a claim to move to the destination of their choice, everyone acknowledges that the current situation, in which millions of refugees are detained indefinitely in horrid conditions, is utterly indefensible. Even if some believe that countries may take proportionate steps to enforce their rights to exclude outsiders, no one defends all the measures that exiting states currently employ in defense of their borders (Mendoza 2015)[^mendoza-2015]. Finally, even if there is a presumptive case for restricting immigration, we should pause to consider the enormous costs of our extraordinary attempts to deter, detain and deport those we seek to exclude (Kukathas 2021)[^kukathas-2021].
