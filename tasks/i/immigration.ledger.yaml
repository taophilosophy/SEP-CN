      There are a number of ways in which one might contest this line of argument (Fine 2010; Wellman and Cole 2011)[^fine-2010][^wellman-2011]. Most obviously, one might question whether corporate political entities are even eligible for moral rights. Value-individualists, for instance, contend that only individual persons ultimately matter morally, and thus, while political states may be extremely valuable instruments, they are merely instruments and, as such, are not the type of entities to which we can sensibly ascribe moral rights. Secondly, even if countries can somehow qualify for moral rights, it seems far-fetched to liken a country’s freedom of association with respect to immigrants to an individual’s right to refuse a marriage proposal, since presumably marital freedom of association is incalculably more important to an individual than her right to exclude potential compatriots. What is more, it is not clear that the analogy between personal and political freedom of association is even apt, because states that deny immigrants do not merely refuse to politically associate with those who seek to migrate, they also forcibly exclude them from the state’s territory. Finally, even if all of these concerns could somehow be addressed, notice that this argument purports to establish only that *legitimate* states have a *presumptive* right to exclude outsiders. Both of these qualifications are important. The condition that only legitimate states are morally entitled to be self-determining is significant because, given the plausible assumption that many existing states are illegitimate, this argument would not justify the immigration policies of many current states. And the fact that this argument would at best ground only a presumptive right to exclude outsiders is noteworthy, because it leaves open the possibility that this right could be over-ridden by the weightier rights various foreigners may have to be admitted. If a refugee needs to gain entrance in order to escape persecution or a child needs to be admitted in order to reunite with her mother, for instance, then defenders of political self-determination cannot antecedently assume that the legitimate state’s right to freedom of association necessarily trumps these individuals’ claims.
    step1: |-
      有多种方式可以质疑这条论证（Fine 2010; Wellman and Cole 2011）[^fine-2010][^wellman-2011]。最明显的是，人们可以质疑法人式的政治实体是否有资格享有道德权利。例如，价值个体主义者主张，最终只有个人在道德上要紧，因此，政治国家虽可能是极有价值的工具，却只是工具，因而并非我们可合理赋予道德权利的那类实体。第二，即便国家能以某种方式获得道德权利资格，把一国对移民的结社自由比作个人拒绝求婚的权利也显得牵强，因为婚姻结社自由对个人的重要性，大概远非其排斥潜在同胞的权利可比。更重要的是，个人与政治结社自由之间的类比是否恰当也不清楚，因为拒绝移民的国家不只是拒绝与寻求移居者在政治上结社，还强制把他们排除在国家领土之外。最后，即便所有这些关切都能以某种方式得到回应，也要注意，这一论证只意在确立合法国家有推定权利排斥外人。这两项限定都很重要。只有合法国家在道德上有权自决这一条件之所以重要，是因为，鉴于许多现有国家不合法这一可信假定，这一论证不能为许多现有国家的移民政策辩护。而这一论证至多只奠立排斥外人的推定权利这一事实之所以值得注意，是因为它留下一种可能：这一权利可能被各种外国人可能拥有的、更有分量的入境权利所压倒。例如，若一名难民需要入境以逃离迫害，或一名儿童需要入境以与母亲团聚，那么政治自决的辩护者就不能预先假定合法国家的结社自由权必然压倒这些个人的主张。
