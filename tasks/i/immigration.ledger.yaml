      The 1951 Convention Relating to the Status of Refugees defines a refugee as someone who “owing to a well-founded fear of being persecuted for reasons of race, religion, nationality, membership of a particular social group, or political opinion, is outside the country of his nationality, and is unable to or, owing to such fear, is unwilling to avail himself of the protection of that country.” (Article 1A[2]) Critics like Andrew Shacknove (1985) have questioned this definition on at least three grounds. First, why focus exclusively on victims of group-based persecution? And even if we do think in terms of groups, why restrict ourselves to these particular groups? What if someone is persecuted *qua* woman or *qua* homosexual, for instance? Second, given the variety of threats to living a minimally decent human life, why insist that only those vulnerable to persecution can qualify as refugees? What about so-called “economic refugees” or people fleeing a civil war, for instance? Third, why stipulate that someone who is not “outside the country of his nationality” cannot be a refugee? What if an individual is being detained at the border or simply lacks the means to migrate without assistance, for example?
    step1: |-
      1951 年《关于难民地位的公约》把难民定义为：“由于种族、宗教、国籍、属于某一特定社会团体或具有某种政治见解而畏惧迫害，滞留于其国籍国之外，且不能或由于此种畏惧而不愿受该国保护的人。”（第一条甲款[2]）安德鲁·沙克诺夫（1985）等批评者至少从三方面质疑这一定义。第一，为何只关注基于群体的迫害的受害者？即便按群体思考，为何只限于这些特定群体？例如，若某人因身为女性或因身为同性恋而受迫害，又当如何？第二，鉴于对最低限度体面人类生活的威胁多种多样，为何坚持只有易受迫害者才能算难民？例如，所谓“经济难民”或逃离内战的人呢？第三，为何规定不在“其国籍国之外”者不能为难民？例如，若某人被扣留在边境，或只是缺乏无援助迁移的手段，又当如何？
