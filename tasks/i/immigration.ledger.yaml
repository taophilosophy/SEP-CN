      The utilitarian case for open borders stresses that restricting freedom of movement leads to obvious inefficiencies and is therefore impermissible. There are any number of ways in which it is suboptimal to forcibly restrain people within territorial boundaries, but one of the most obvious worries is that it is economically inefficient. Restricting Mexicans from fully developing and capitalizing upon their talents in the United States economy, for instance, makes no more sense than relegating men and women into separate spheres. Just as a system in which only men may be doctors and only women may work as nurses unjustifiably deprives the world of countless excellent female doctors and male nurses, a geo-political system in which countries are entitled to exclude outsiders regrettably fails to capitalize upon the talents and work ethic of foreigners who are denied access to the world’s most robust labor markets. Given this, it seems reasonable to believe that people would on average be much better off if there were no restrictions on immigration.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      This argument can be contested on either empirical or moral grounds. For instance, without questioning whether restricting immigration is in some ways inefficient, one might still defend the merits of dividing the globe into separate states, each of which has sovereign control over its territory. This view seems plausible if the advantages to such a state system outweigh the inefficiencies in question. For instance, David Miller (2014) argues that restrictions on immigration improve our ability effectively to address population control. As Miller recognizes, we will make progress in this regard only if leaders in countries like India and China are able and willing to enact the relatively unpopular laws necessary to limit population growth. And these laws would be met with much more resistance than they already are if there were no restrictions on migration, because the costs of population growth would not be wholly internalized. If a country’s exploding population were free to move anywhere in the world, for instance, then its citizens would not bear the full costs of population growth and would therefore be that much more resistant to laws designed to limit the number of children born. If Miller is right, the advantages of restricting immigration may more than compensate for the costs involved.
    step1: TBD
    step2: TBD
