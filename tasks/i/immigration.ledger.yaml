      Democratic governance provides another potential link between self-determination and controls on immigration. Given that democracy’s principal virtue is thought to be its connection to self-determination, democrats often favor bounded groups which enjoy dominion over their own affairs. As Frederick Whelan puts it, “democracy requires that *people* be divided into *peoples* (each people hopefully enjoying its own democratic institutions), with each unit distinguishing between its own citizens—understood in a political sense as those eligible to exercise democratic political rights *here*—and others, who are regarded as aliens *here*, although (hopefully) citizens somewhere else.” (Whelan 1988: 28) The basic idea here is that, in order for democracies to function, there must be rule *by* the same people upon whom the rule is imposed. But this is possible only if the same group of individuals who first vote are subsequently bound by the outcome. If membership constantly fluctuated, however, then self-determination would not occur, because the “self” that votes would not match the “self” which is then bound by the results.
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      In response, theorists like Phillip Cole (2000) have suggested at least two grounds on which we might question whether democracy requires closed borders. First, even if Whelan is right that democracy cannot function properly unless we sort people into territorially defined groups (What is wrong with a democratic world state, for instance?), why does it follow that the constituents within any given set of territorial boundaries must have control over admissions? Citing local and regional democratic units within larger federal structures as counterexamples, Coles suggests that “[i]t seems clear that democratic rights can be confined to a region, with people entering and leaving that region freely and exercising the local democratic rights during their residency.” (Cole 2000: 184)[^cole-2000] Second, Cole suggests that one of the chief reasons to insist upon democracy in the first place is presumably the belief that coercive political institutions could not permissibly be imposed unless those coerced are given an equal say in how the political arrangements are ordered. But if so, this makes extending suffrage to only those already within the territorial boundaries objectionable, because, as Cole reminds us, “there are two groups subjected to the laws of the state: its own members, and those non-members who are applying for inclusion.” (Cole 2000: 186)[^cole-2000] Thus, because exclusive immigration laws are coercively imposed upon foreigners who seek to enter, democratic principles suggest that these outsiders should also have a say in immigration laws. So if Cole is right, the democratic case for closed borders is doubly problematic. Not only is it false that open borders is inconsistent with a functioning democracy, democratic principles may even prohibit a state’s coercively excluding disenfranchised foreigners from entering its territory.
