      Other passages afford us an opportunity to sample how *ḥads* is employed in various scientific, or, as we would judge today, occult contexts. In laying forth an account of some twelve phenomena, including various optical effects in the atmosphere, thunder, lightning, and comets, all of which are produced by “vapors” originating in the earth (much as Aristotle had argued in his *Meteorology*), Ibn Kammūna adds that, conjoined to those causes, *ḥads* judges that there must be “spiritual forces” that are due to celestial configurations (Ziai & Alwishah 2003, 254)[^ziai-2003]. Animals other than man have a rational soul; this ties in to the question of metemsomatosis. The reasoning will be evident to someone who employs *ḥads*, but not to someone who either willfully shuts off *ḥads*, or was simply not born with that gift (Ziai & Alwishah 2003, 346–7)[^ziai-2003].
    step1: |-
      其他段落让我们有机会抽样了解 *ḥads* 如何在各种科学——或按我们今天的判断，神秘学——语境中被使用。在阐述大约十二种现象时——包括大气中的各种光学效应、雷、闪电与彗星，它们都由源于大地的“蒸气”产生（与亚里士多德在《气象学》中的论证大致相同）——伊本·凯姆那补充说，与这些原因相结合，*ḥads* 判定必定存在由天体配置所致的“精神力量”（Ziai & Alwishah 2003, 254）[^ziai-2003]。人以外的动物具有理性灵魂；这与灵魂转生问题相关。对于运用 *ḥads* 的人，这一推理是显明的；但对于故意关闭 *ḥads*、或生来就没有这种天赋的人，则不然（Ziai & Alwishah 2003, 346–7）[^ziai-2003]。
    step2: |-
      另一些段落让我们得以一窥 *ḥads* 在各种科学语境——按今日的判断，或可谓神秘学语境——中的用法。伊本·凯姆那在铺陈十二种现象时——包括大气中的种种光学效应、雷、电与彗星，皆由生于大地的“蒸气”造成（大致如亚里士多德《气象学》所论）——又补上一句：与这些原因相合，*ḥads* 判定必有源于天体配置的“精神力量”（Ziai & Alwishah 2003, 254）[^ziai-2003]。人以外的动物也有理性灵魂；这牵涉到灵魂转生的问题。运用 *ḥads* 的人对此推理一目了然；有意关闭 *ḥads* 的人，或生来便无此禀赋的人，则不然（Ziai & Alwishah 2003, 346–7）[^ziai-2003]。
