      We examine first the theoretical discussions (following Langermann 2005, 286–302)[^langermann-2005]. In the chapter dealing with demonstration (*burhan*), Ibn Kammūna lists the seven types of judgment (*hukm*) by means of which one asserts or verifies (*tasdiq*) premises that are to be employed in a syllogism. *Ḥadsiyyāt*, intuitive judgments, are the last on the list, and Ibn Kammūna defines them simply as “what the soul judges to be certain on the basis of evidence (*qara’in*) other than that found in the [six] sources (*mabadi’*) that have been mentioned above” (al-Kabisi 1982, 196; author’s translation)[^kabisi-1982]. Ibn Sina does not include *ḥadsiyyāt* in his classification of premises; Suhrawardī does include *ḥadsiyyāt* in two of his lists, but neither is identical to the one found in *al-Jadīd*. Despite all of these developments, however, Ibn Kammūna supplies here exactly the same time-worn example used by Ibn Sina (and before him by Aristotle), i.e., the fact that the moon’s light derives from the sun.
    step1: |-
      我们首先考察理论讨论（依据 Langermann 2005, 286–302）[^langermann-2005]。在讨论证明（*burhān*）的那一章中，伊本·凯姆那列举了七种判断（*ḥukm*），人借以断定或证实（*taṣdīq*）三段论中所要用到的前提。*Ḥadsiyyāt*，即直觉判断，位列最后，伊本·凯姆那将其简单定义为“灵魂根据［上述六种］本原（*mabādi’*）之外所见的证据（*qarā’in*）而判定为确定的东西”（al-Kabisi 1982, 196；作者自译）[^kabisi-1982]。伊本·西那在其前提分类中未列入 *ḥadsiyyāt*；苏赫拉瓦尔迪则在其两份清单中列入了 *ḥadsiyyāt*，但两者都与 *al-Jadīd* 中的那份不同。然而，尽管有这一切发展，伊本·凯姆那在此提供的恰恰是伊本·西那（以及在他之前的亚里士多德）所用的那个陈旧例子，即月亮的光来自太阳这一事实。
