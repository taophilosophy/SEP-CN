      *Al-Jadīd fī ‘l-ḥikma* (*The New Wisdom*); is a comprehensive exposition of thirteenth century science and philosophy. (For a preliminary study, see Langemann 2005; the titles of this book are discussed in the final sections below.) Numerous manuscript copies exist (Pourjavady & Schmidtke 2006, 87–92)[^pourjavady-2006]. Ibn Kammūna experimented with different formats and especially different lengths in his philosophical writing. He adhered to the traditional tri-partite classification of logic, physics, and metaphysics, in a lengthy format (*al-Jadīd*), a highly condensed version (*Talkhīṣ*; see Pourjavady & Schmidtke 2006, 94, for bibliography, and an edition of the Arabic text, 196–206)[^pourjavady-2006], and quite likely a middle length version (*Risala fī ‘l-ḥikma*), whose authenticity is still unresolved (Langermann 2005, 279–286)[^langermann-2005].
    step1: |-
      *Al-Jadīd fī ‘l-ḥikma*（*The New Wisdom*）是对十三世纪科学与哲学的全面阐述。（初步研究见 Langemann 2005；本书的书名将在下文最后几节讨论。）现存大量抄本（Pourjavady & Schmidtke 2006, 87–92）[^pourjavady-2006]。伊本·凯姆那在其哲学写作中试验了不同的格式，尤其是不同的篇幅。他遵循逻辑学、物理学与形而上学的传统三分法，采用长篇格式（*al-Jadīd*）、高度压缩的版本（*Talkhīṣ*；文献目录见 Pourjavady & Schmidtke 2006, 94，阿拉伯文校勘本见 196–206）[^pourjavady-2006]，并且很可能还有一个中等篇幅的版本（*Risāla fī ‘l-ḥikma*），其真伪问题仍未解决（Langermann 2005, 279–286）[^langermann-2005]。
    step2: |-
      《新智慧》（*al-Jadīd fī ’l-ḥikma*）系统阐述了十三世纪的科学与哲学（初步研究见 Langemann 2005；书名问题详见本文最后几节）。此书抄本甚多（Pourjavady & Schmidtke 2006, 87–92）[^pourjavady-2006]。伊本·凯姆那在哲学写作中尝试过不同体式，尤以篇幅长短之别为要。他恪守逻辑学、物理学与形而上学的三分格局，而有长篇（*al-Jadīd*）、高度压缩本（*Talkhīṣ*，文献见 Pourjavady & Schmidtke 2006, 94，阿拉伯文校勘本见 196–206）[^pourjavady-2006]，很可能还有一部中等篇幅本（*Risāla fī ’l-ḥikma*），其真伪至今未定（Langermann 2005, 279–286）[^langermann-2005]。
