      The Ishraqi philosophy of which Shihab al-Din al-Suhrawardī (d. 1191) is considered the founder, has intuition as the basis of its epistemology, at least in theory.[^note-2] Illumination (*ishraq* in Arabic), in a word, describes the event, which many speakers of English would also call intuition, which yields knowledge swiftly and certainly. Intuition plays a major role in *al-Talwīḥāt*, which is considered to be one of Suhrawardi’s more peripatetic writings. It is not surprising, then, that Ibn Kammūna frequently mentions intuition in his commentary to *al-Talwīḥāt*. It should be borne in mind, though, that true to his role as commentator, Ibn Kammūna will as a rule try to flesh out and expand upon Suhrawardi’s intentions, rather than expressly developing his own ideas.
    step1: |-
      什哈卜丁·苏赫拉瓦尔迪（卒于 1191 年）被视为创立者的照明哲学，至少在理论上以直觉为其认识论的基础。[^note-2] 照明（阿拉伯语 *ishrāq*），一言以蔽之，描述的是那种事件：许多英语使用者也会称之为直觉，它迅速而确定地产生知识。直觉在 *al-Talwīḥāt* 中扮演主要角色，该著作被认为是苏赫拉瓦尔迪较具逍遥学派色彩的著作之一。因此，伊本·凯姆那在其对 *al-Talwīḥāt* 的注疏中频繁提到直觉，就不足为奇了。不过应当记住，忠于其注疏者角色，伊本·凯姆那通常试图充实并扩展苏赫拉瓦尔迪的意图，而不是明确发展自己的观念。
    step2: |-
      以什哈卜丁·苏赫拉瓦尔迪（卒于 1191 年）为创立者的照明哲学，至少在理论上以直觉为其认识论基础。[^note-2] 照明（阿拉伯语 *ishrāq*），一言以蔽之，所描述的那种事件，许多英语使用者也会称作直觉：它迅速而确定地给出知识。直觉在《暗示书》（*al-Talwīḥāt*）中作用甚大，而此书被视为苏赫拉瓦尔迪较近逍遥学派的著作之一。因此，伊本·凯姆那在为此书作注时屡屡言及直觉，并不奇怪。不过须记住：伊本·凯姆那恪守注疏者的本分，通常只是充实、引申苏赫拉瓦尔迪的意图，而不明确发挥自己的见解。
