      > 只有体验过（字面意思是“品尝过”）神圣芳香的真正实在的人，才能为自己再现这些东西。但在那些并非凭其先天禀赋达到这一点的心灵中，有些［设法］获得了它，而另一些则完全无法获得任何东西。凡弃绝身体上的过度、善用必需品、远离人群［而居于］山巅与空阔之地、思索神圣智慧的精微之处、热切而纯粹地献身于祂、并且有时以知名的和谐旋律用诗的语言歌唱至高神的伟大者——他将领受某些神圣的快乐，那是无法描述、言语也过于局促而难以表达的；也就是说，如果他被赋予接受这条道路的禀赋。这一切，对于在自己内心发现它的人，是通过经验得知的；对于有禀赋的人，则是通过反复与直觉得知的（Musawi 2003, p. 85，作者自译）[^musawi-2003]。
