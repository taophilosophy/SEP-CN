      Earlier attempts to explain the phenomenon of prophecy in terms of the then-accepted workings of the human psyche, for example, that of Maimonides, found analogous or proto-prophetic symptoms in two types of human inspiration. The first of these includes veridical dreams, divination, and other cases in which the unknown is revealed. The second comprises instances where people spontaneously perform acts of bravery, leadership, or literary creativity, and thus act in a manner that appears to be above the ordinary. These ideas were helpful in developing a political theory of prophecy; the prophet, like the philosopher-king, is a visionary, gifted with bold leadership as well as the ability to impose a code of behavior upon his people. The main difference is that the code of the prophet is expressly not of his own devise, but rather revealed by some supernal source. On the whole, Ibn Kammūna downplays the political function of prophecy. The prophet does have an important role to play in organizing and ordering society. However, the thrust of Ibn Kammūna’s analysis emphasizes the epistemological advantages of the prophet rather than his political skill. Moreover, as political leader, he is charged with inculcating correct religious belief; Ibn Kammūna sharply distinguishes between the prophet on the one hand, and rulers of *jahiliyya* (uncultured, lacking a proper revealed code) cities on the other.
    step1: |-
      早先试图用当时公认的人类心理运作来解释预言现象的努力，例如迈蒙尼德的努力，在两类人类灵感中发现了类似或前预言性的征兆。第一类包括真实的梦、占卜以及其他未知得以揭示的情形。第二类包括人们自发表现出勇敢、领导或文学创造的行为，从而以看来超乎寻常的方式行动。这些观念有助于发展一种政治性的预言理论；先知像哲人王一样，是一位有远见者，既有大胆的领导才能，也有能力将一套行为规范加于其人民。主要差别在于，先知的规范明言不是他自己的设计，而是由某个超验来源启示的。总体而言，伊本·凯姆那淡化了预言的政治功能。先知确实在组织与安排社会方面扮演重要角色。然而，伊本·凯姆那分析的着力点强调先知在认识论上的优势，而非其政治才能。而且，作为政治领袖，他负有灌输正确宗教信仰之责；伊本·凯姆那严格区分先知与蒙昧（*jāhiliyya*，未开化、缺乏正当启示规范）城市的统治者。
    step2: |-
