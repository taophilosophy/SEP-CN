      Another “problem” is a sophistry that ties in with some recondite issues in logic that exercised Ibn Kammūna and his contemporaries, especially conversion by contraposition (Langermann 2007, 11–13)[^langermann-2007]. It appears that Ibn Kammūna tried to manipulate the simple observation that creation (*ḥudūth al-‘alam*) is not counterfactual, that is to say, it does not require one to deny immediate reality (*al-waqi’*, reality or actuality as it presents itself here and now), into a formal proof: creation does not necessitate the denial of immediate reality; whatever does not necessitate the denial of immediate reality is immediately real; ergo, the creation of the world is immediately real.
    step1: |-
      另一个“问题”是一种诡辩，它与伊本·凯姆那及其同时代人所钻研的逻辑学中某些深奥问题相关，尤其是通过换质位法的换位（Langermann 2007, 11–13）[^langermann-2007]。看来伊本·凯姆那试图把“创世（*ḥudūth al-‘alam*）并非反事实的”这一简单观察——也就是说，它并不要求人否认直接现实（*al-wāqi‘*，如其在此刻自行呈现的实在或现实性）——操弄成一个形式证明：创世并不必然导致对直接现实的否认；凡不必然导致对直接现实之否认者，就是直接现实的；所以，世界的创世是直接现实的。
    step2: |-
      另一项“疑难”是一则诡辩，牵涉到伊本·凯姆那及其同代人所究心的逻辑学中若干幽深问题，尤以换质位法（conversion by contraposition）为要（Langermann 2007, 11–13）[^langermann-2007]。看来，伊本·凯姆那想把一个简单观察——世界之生成（*ḥudūth al-ʿālam*）并非反事实的，也就是说，它并不要求人否认直接现实（*al-wāqiʿ*，即在此刻自行呈现的实在或现实）——操弄成一道形式证明：创世并不必然导致否认直接现实；凡不必然导致否认直接现实者，即为直接现实；故世界之创世是直接现实的。
