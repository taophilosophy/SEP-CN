    source: |-
      The centuries following the remarkable achievement of Ibn Sina (Avicenna; d. 1037) were a remarkably creative period in the sciences and philosophy. Sa‘d ibn Mansur Ibn Kammūna, a Jew from Baghdad, actively participated in the lively discourse of his day. In his copious writings he takes up the entire gamut of philosophical issues discussed by his contemporaries. Editions, translations and studies of works by Ibn Kammūna and other thinkers of the time have appeared in recent years. Nonetheless, it remains difficult at this stage to contextualize Ibn Kammūna’s work satisfactorily, or to decide wherein lies his most noteworthy contribution.
    step1: |-
      在伊本·西那（阿维森纳；卒于 1037 年）的卓越成就之后的几个世纪，是科学与哲学中一个极为创造性的时期。萨阿德·伊本·曼苏尔·伊本·凯姆那，一位来自巴格达的犹太人，积极参与了他那个时代活跃的论辩。在他卷帙浩繁的著作中，他论及同时代人讨论过的哲学问题的全部范围。近年来出现了伊本·凯姆那与当时其他思想家著作的校勘本、译本与研究。然而，在现阶段，仍难以令人满意地确定伊本·凯姆那著作的语境，也难以判定他最值得注意的贡献究竟何在。
    step2: |-
      伊本·西那（阿维森纳，卒于 1037 年）取得卓越成就之后的数百年，是科学与哲学史上一个极具创造力的时期。来自巴格达的犹太人萨阿德·伊本·曼苏尔·伊本·凯姆那（Saʿd ibn Manṣūr Ibn Kammūna）积极投身于当时活跃的思想论辩。其著作卷帙浩繁，举凡同时代人所讨论的哲学问题，几乎无所不包。近年陆续刊行了伊本·凯姆那及当时其他思想家著作的校勘本、译本与研究。但时至今日，仍很难恰当地厘定伊本·凯姆那著作的语境，也很难断定其最可称道的贡献究竟何在。
  - id: 2
    kind: body
    source: |-
      No topic so engaged Ibn Kammūna more than the study of the human soul, especially its proper characterization and the proofs for its survival after the death of the body. So, after first surveying Ibn Kammūna’s biography, writings, and image, we will present Ibn Kammūna’s views on the soul and its afterlife. Then we shall follow the thread of one concept whose significance for the thought of the age has been firmly established, namely, *ḥads* [most usually translated as “intuition”], through his major writings. At the very least, this shall afford us a glimpse at the way Ibn Kammūna handles a key notion of psychology, epistemology, and the theory of prophecy, in various literary formats. Following that, we will present the first-ever survey of his religious ethics; the key texts have only recently been published. Finally, we will have a look at some of the sophistries and paradoxes that are attributed to him.
    step1: |-
      没有任何主题比人类灵魂的研究更吸引伊本·凯姆那，尤其是对它的恰当刻画以及对其在身体死亡之后存续的证明。因此，在首先概述伊本·凯姆那的生平、著作与形象之后，我们将呈现伊本·凯姆那关于灵魂及其来世的观点。然后，我们将沿着一个其对该时代思想的意义已被牢固确立的概念的线索，即 *ḥads*［最通常译作“直觉”］，贯穿他的主要著作。至少，这将使我们得以一瞥伊本·凯姆那在各种文学形式中处理心理学、认识论与预言理论的一个关键概念的方式。此后，我们将呈现对他的宗教伦理的首次考察；其关键文本直到最近才出版。最后，我们将看看一些归于他的诡辩与悖论。
    step2: |-
      伊本·凯姆那用力最深的主题，莫过于对人类灵魂的研究，尤其是对灵魂的恰当刻画，以及灵魂在身体死亡之后仍然存续的证明。因此，本文先概述伊本·凯姆那的生平、著作与形象，继而呈现他关于灵魂及其来世的观点。随后，我们将沿一条线索展开：一个对该时代思想具有确凿意义的概念，即 *ḥads*［通常译作“直觉”］，在其主要著作中的流转。这样做至少可以让我们窥见，伊本·凯姆那如何在不同的文体形式中处理心理学、认识论与预言理论共有的一个关键概念。接下来，我们将首次梳理他的宗教伦理；相关关键文本直到晚近才刊行。最后，我们再考察若干归于他名下的诡辩与悖论。
  - id: 3
    kind: body
    source: |-
      All agree that the publication of editions of Ibn Kammūna’s writings (all of which are in Arabic) are a necessary first step in the study of his contribution. There is far less agreement as to how to assess the worth of editions, as well as the need or lack thereof for redoing editions that are already available. Discussion of these and related issues are essential to our topic, and bear upon the proper understanding of Ibn Kammūna’s position on the issues of his day. With this in mind, we will end with a short, critical discussion of some editions that have appeared, just before the bibliography.
    step1: |-
      所有人都同意，伊本·凯姆那著作（全部为阿拉伯文）校勘本的出版，是研究其贡献的必要第一步。至于如何评估校勘本的价值，以及是否有必要重做已有的校勘本，意见则远不一致。对这些及相关问题的讨论对我们的主题至关重要，并关系到对伊本·凯姆那在其时代各种问题上立场的恰当理解。有鉴于此，我们将在参考文献之前，以对一些已出版校勘本的简短批判性讨论作结。
    step2: |-
      学界一致认为，刊行伊本·凯姆那著作（全部以阿拉伯文写成）的校勘本，是研究其贡献的必要起点。至于如何评价校勘本的价值、已有的校勘本有无必要重做，则远非一致。讨论这些问题及相关事项，对本文主题至关重要，也关系到能否恰当理解伊本·凯姆那在当世诸问题上的立场。有鉴于此，本文在文献目录之前，先对已出的若干校勘本作一简短批评。
