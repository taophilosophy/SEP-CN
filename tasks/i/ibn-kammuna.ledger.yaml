      The tension-free concord between reasoned, independently verifiable knowledge and knowledge based on revelation and tradition (science and faith, to put it more simply) manifest in these writings is noteworthy. Ibn Kammūna raises none of the ostensible contradictions that so troubled Ibn Sina, al-Ghazali, and Maimonides. A series of generally facile arguments are given for the existence of God and his attributes. In general, the conception of the deity is informed more by His goodness and bounty than it is by His power and judgment.
