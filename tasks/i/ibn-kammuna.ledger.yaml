      Both treatises display a thorough integration of religious as well as [the masters of] philosophical ideas and ideals. As Ibn Kammūna writes at the beginning of *Subtle Insights*: “The masters of traditional religions and of intellectual tenets agree that salvation and eternal felicity depend upon belief in God, [belief in] the end of days, and doing good works” (Langermann 2019, 36)[^langermann-2019]. Elsewhere Ibn Kammūna speaks of “the people of wisdom and revelation.” The values and ideas expounded in these two works look to represent a consensus that has been reached by these two groups, who, in different circumstances, were thought to be very much at odds with one another. We cannot say as yet how widespread this concordance was as a social phenomenon. In any event, it was shattered a century later by Ibn Taymiyya and his followers, who assaulted the “foreign” sciences from different angles.
