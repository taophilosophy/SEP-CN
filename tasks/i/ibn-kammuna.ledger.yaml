      We shall limit ourselves here to a few examples drawn from the partial edition of this commentary published by H. Ziai and A. Alwishah, which covers part two of *al-Talwīhāt* and whose subject is natural science or physics. Ibn Kammūna in one place quotes approvingly Suhrawardi’s account of how greatly people differ in this respect: “People differ with regard to *ḥads*. There are the doltish, who have never had any success in thinking; and there are those with powerful *ḥads*. Many of the latter exceed others in quantity and quality; but there is no limit, at which one must perforce stop. It is possible for there to be someone who perceives by means of *ḥads* most of the intelligibles in a short time and without a teacher; and there is a [type of] soul called ‘holy’ whose capacity is as powerful as that of the prophets” (Ziai & Alwishah 2003, 456)[^ziai-2003].
    step1: |-
      这里我们将仅限于从 H. Ziai 与 A. Alwishah 刊布的这一注疏的部分校勘本中举几个例子；该本涵盖 *al-Talwīḥāt* 第二部分，主题是自然科学或物理学。伊本·凯姆那在一处赞同地引述了苏赫拉瓦尔迪关于人们在此方面差异极大的论述：“人们在 *ḥads* 上各不相同。有愚钝者，从未在思考上取得任何成功；也有 *ḥads* 强大的人。后者中许多人在这方面的量与质上超过他人；但并没有必须止步的限度。可能存在这样的人：他在短时间内、无需老师，凭 *ḥads* 把握大多数可知对象；还有一种被称为‘神圣的’灵魂，其能力与先知们的一样强大”（Ziai & Alwishah 2003, 456）[^ziai-2003]。
    step2: |-
      此处只举几例，取自 H. Ziai 与 A. Alwishah 刊布的这一注疏节本；该本涵盖《暗示书》第二部分，主题是自然科学即物理学。有一处，伊本·凯姆那赞许地引述苏赫拉瓦尔迪关于人与人在这方面差异极大的说法：“人在 *ḥads* 上各有不同。有愚钝者，思考从无所得；也有 *ḥads* 强劲者。后者之中许多人，在量与质上都胜过他人；然而并无必须止步的界限。可能有人凭 *ḥads* 在短时间内、无须师授而把握大多数可知对象；另有一种被称为‘神圣的’灵魂，其能力之强，堪比先知”（Ziai & Alwishah 2003, 456）[^ziai-2003]。
