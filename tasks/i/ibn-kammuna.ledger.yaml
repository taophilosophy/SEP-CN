      It is not difficult to find numerous examples of the application of *ḥads* in *The New Wisdom*; it has much harder to see how *ḥads* is to be integrated consistently into a comprehensive scientific program. Here follow some items of knowledge that are said to derive from *ḥads*. *Ḥads* indicates to astronomers, even where logical necessity does not, that the planets require more than one orb in order to complete their motions [ed. 402]. In the life sciences, we know by means of *ḥads* that irrational animals carry out their biological functions unconsciously [ed. 424]. As for metaphysics and psychology, we conclude by means of *ḥads* that intellect is more perfect than soul [ed. 517], and that bodies (or their species) are but shadows of spiritual entities [ed. 522]. *Ḥads* and repeated experience (*tajriba*) together indicate that the body is the only impediment to the soul’s conjunction with the pure forms [ed. 492].
    step1: |-
      在《新智慧》中找到 *ḥads* 应用的众多例子并不困难；困难得多的是看清 *ḥads* 如何被一致地整合进一个全面的科学纲领。以下是一些据说源自 *ḥads* 的知识项。*Ḥads* 向天文学家指出——即使在逻辑必然性并不要求之处——行星需要多于一个天球才能完成其运动［校勘本 402］。在生命科学中，我们借 *ḥads* 知道，非理性动物无意识地执行其生物功能［校勘本 424］。至于形而上学与心理学，我们借 *ḥads* 断定，理智比灵魂更完善［校勘本 517］，而物体（或其种）不过是精神实体的影子［校勘本 522］。*Ḥads* 与反复经验（*tajriba*）合在一起表明，身体是灵魂与纯粹形式相结合的惟一障碍［校勘本 492］。
    step2: |-
      在《新智慧》中找 *ḥads* 的应用之例并不难；难得多的是看清 *ḥads* 怎样被一贯地编入一个整全的科学纲领。下面举几条据说源于 *ḥads* 的知识。*Ḥads* 使天文学家看出——即便逻辑必然性并未要求——行星运动需不止一个天球方能完成［校勘本 402］。在生命科学中，我们借 *ḥads* 得知，无理性动物无意识地履行其生物功能［校勘本 424］。在形而上学与心理学中，我们借 *ḥads* 断定：理智比灵魂更完善［校勘本 517］；物体（或其种）不过是精神实体的影子［校勘本 522］。*Ḥads* 与反复经验（*tajriba*）合而言之，则表明身体是灵魂与纯粹形式相结合的唯一障碍［校勘本 492］。
