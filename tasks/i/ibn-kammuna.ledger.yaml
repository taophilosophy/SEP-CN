      Ibn Kammūna looms as a philosophical writer, a learned and keen student, who bequeathed to posterity not a “philosophy” but rather a rich assortment of philosophical studies. Some, such as his *New Wisdom*, aimed at a synthesis; others, like his commentary to Suhrawardi, are primarily an essay in the interpretation of the thought of others; yet others, e.g., the monographs mentioned in the preceding section, address specific issues to whose resolution Ibn Kammūna feels he can contribute. Scholarship on his output, however, has displayed less interest in literary form, intended audience, and specific objectives; instead, in keeping with an academic tradition, it has focused by and large upon the identification of his “sources”, even at the level of sentence by sentence, or phrase by phrase, analysis. This approach has reaped some important insights, for example, the combination of Avicennan and Suhrawardian statements in connection with the notion of existence.
    step1: |-
      伊本·凯姆那作为一位哲学写作者、一位博学而敏锐的学人出现，他留给后世的不是一种“哲学”，而是丰富多样的哲学研究。其中一些，如他的 *New Wisdom*，意在综合；另一些，如他对苏赫拉瓦尔迪的注疏，首先是诠释他人思想的文章；还有一些，如上一节提到的专著，处理他觉得自己能够有所贡献的特定问题。然而，对其成果的学术研究较少关注文学形式、预期读者与具体目标；相反，遵循一种学术传统，它大体上聚焦于辨认他的“来源”，甚至达到逐句或逐短语分析的层次。这一进路收获了一些重要洞见，例如在存在概念方面阿维森纳式与苏赫拉瓦尔迪式陈述的结合。
    step2: |-
      伊本·凯姆那是一位哲学作家，博学而敏锐的学人；他留给后世的并非一套“哲学”，而是一批丰富多样的哲学研究。其中有的意在综合，如《新智慧》；有的首先是解释他人思想的文章，如他对苏赫拉瓦尔迪的注疏；还有的则处理他自信能有所贡献的具体问题，如前节提到的几部专著。然而，学界对其成果的研究，对文体形式、预期读者与具体目标兴趣不大；它沿袭一种学术传统，大体上致力于辨认他的“来源”，甚至细到逐句、逐短语的分析。这一进路确有若干重要收获，例如在存在概念上把阿维森纳式与苏赫拉瓦尔迪式的表述结合起来。
