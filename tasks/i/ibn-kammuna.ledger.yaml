      Ibn Kammūna took the Avicennan reformulation as his basic conception of the soul. In lengthier writings he would of course review the faculties, properties, and so forth associated with the soul; but the fundamental notion was that of the individual’s self-awareness. For example, in the introduction to his essay *On the Immortality of the Soul*, he writes “The (word) soul is a designation of the essence of the individual, to which one refers when one employs the pronoun ‘I’ in saying ‘I have done thus and so’, ‘I have reached such and such’” [trans. Nemoy 1958, p. 86][^nemoy-1958]. In his pietistic *Subtle Insights*, Ibn Kammūna complains that a full discussion of the soul’s properties, mode of binding to the body, and so forth, would be “lengthy”; he is content to refer the reader to “books that have already appeared”. For his purposes, “the most important thing that has been mentioned about this and the most accessible to comprehension is what I am setting down in this flash (*lamʻa*). The first of these is to ascertain that the soul is that to which everyone points when saying ‘I apprehended such and such’ or ‘I did such and such’ ” (Langermann 2019, 73–74)[^langermann-2019].
    step1: |-
      伊本·凯姆那以阿维森纳的重新表述作为其灵魂概念的基础。在较长的著作中，他当然会检视与灵魂相关的各种能力、属性等等；但根本概念是个体的自我意识。例如，在其《论灵魂不朽》一文的导言中，他写道：“（词）灵魂是对个体本质的一种指称，当人们在说‘我做了如此这般’、‘我达到了某某’而使用代词‘我’时，所指的就是它”[Nemoy 1958 译，p. 86][^nemoy-1958]。在其虔修著作《幽微洞见》中，伊本·凯姆那抱怨说，充分讨论灵魂的属性、与身体结合的方式等等将会“冗长”；他满足于让读者参阅“已经问世的书籍”。就他的目的而言，“关于此事所提到的最重要、也最易于理解的东西，就是我在这道灵光（*lam‘a*）中所记下的。其中第一项是确定：灵魂就是每个人在说‘我领会了某某’或‘我做了某某’时所指向的东西”（Langermann 2019, 73–74）[^langermann-2019]。
    step2: |-
      伊本·凯姆那以阿维森纳的重新表述为灵魂概念之基础。在篇幅较长的著作中，他自然会逐一检视灵魂的各种能力、属性之类；但其根本观念，是个体的自我意识。例如，《论灵魂不朽》的导言写道：“（词）灵魂是对个体本质的一种指称；当人们用代词‘我’说‘我做了如此这般’、‘我达到了某某’时，所指的正是它”[Nemoy 1958 译，p. 86][^nemoy-1958]。在虔修之作《幽微洞见》中，伊本·凯姆那坦言，若要充分讨论灵魂的属性、与身体结合的方式等等，篇幅将“冗长”；他宁愿让读者参阅“已经问世的书籍”。就他的目的而言，“关于此事所道及者，最重要而又最易懂的，就是我在这道灵光（*lamʿa*）中写下的。其中第一事，是确认灵魂即人人说‘我领会了某某’或‘我做了某某’时所指向者”（Langermann 2019, 73–74）[^langermann-2019]。
