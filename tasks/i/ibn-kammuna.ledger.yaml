      It is a common complaint in the field of Islamic philosophy, especially in its post-Avicennan phases, that we lack editions of primary texts; this complaint was voiced in the first version of this entry. In the intervening years, not a few editions of writings by Ibn Kammūna have appeared. Two key texts have been reissued in the original. Dr Lwiis Saliba has reissued the *Tanqīḥ al-Abḥāth* (*Examination the Three Faiths*, published by Byblion, in Byblos, Lebanon 2009; a second printing was made already in 2010) in a volume of nearly 600 pages, provided with a detailed introduction and copious notes, all in Arabic, but with a very good command of academic publications in European languages. Simon Bellahsen has published a French translation of the *Examination*, including a translation of portions from the biography in Pourjavady and Schmidtke 2006: Examen de la critique des trois religions monothéistes, Paris: Vrin, 2012. H.J. Isfahani published a new edition of the *New Wisdom*, which he chose to give an alternative title, *Kitāb al-Kāshif* (*The Revealor*), published jointly by the Iranian Institute of Philosophy and the Institute of Islamic Studies of the Free University of Berlin, Tehran 2008.
    step1: |-
      伊斯兰哲学领域——尤其是其后阿维森纳阶段——一个常见的抱怨是，我们缺乏原始文本的校勘本；这一抱怨在本词条的第一版中曾提出。在此期间，伊本·凯姆那著作的校勘本出现了不少。两部关键文本已以原文重新刊行。Lwiis Saliba 博士重新刊行了 *Tanqīḥ al-Abhāth*（《三教审查》，Byblion 出版社，黎巴嫩朱拜勒 2009；2010 年即已第二次印刷），近 600 页，附有详细导论与大量注释，全部为阿拉伯文，但对欧洲语言的学术出版物有很好的掌握。Simon Bellahsen 刊布了《审查》的法译本，其中包括 Pourjavady 与 Schmidtke 2006 年著作中生平部分的若干段落的翻译：Examen de la critique des trois religions monothéistes, Paris: Vrin, 2012。H.J. Isfahani 刊布了《新智慧》的新校勘本，他为之另取了书名 *Kitāb al-Kāshif*（*The Revealor*），由伊朗哲学研究所与柏林自由大学伊斯兰研究所联合出版，德黑兰 2008。
    step2: |-
      伊斯兰哲学领域——尤其是后阿维森纳阶段——常有抱怨说，我们缺少原始文本的校勘本；本词条初版也曾发出这一抱怨。此后的岁月里，伊本·凯姆那的著作已出了不少校勘本。两部关键文本以原文重新刊行。Lwiis Saliba 博士重刊了《审查三教》（*Tanqīḥ al-Abhāth*，Byblion 出版社，黎巴嫩朱拜勒，2009；2010 年即再印），近六百页，附详细导论与大量注释，全用阿拉伯文，却对欧洲语言的学术出版物掌握甚佳。Simon Bellahsen 出版了《审查》的法译本，其中还译出了 Pourjavady 与 Schmidtke 2006 年著作中传记部分的若干段落：Examen de la critique des trois religions monothéistes, Paris: Vrin, 2012。H. J. Isfahani 刊行了《新智慧》的新校勘本，并为之另题书名 *Kitāb al-Kāshif*（*The Revealor*）；此书由伊朗哲学研究所与柏林自由大学伊斯兰研究所联合出版，德黑兰，2008。
