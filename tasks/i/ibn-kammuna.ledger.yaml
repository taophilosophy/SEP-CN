      *’Amal* is definitely subordinate to *‘ilm*; in this sense, the pietistic treatises continue the strong scientific orientation evident in all of Ibn Kammūna’s writings. However, praxis is by no means a concession to the low intellectual level of the masses, as it is often thought to be in “political” conceptions of religion; nor is it merely a device to restrain bodily drives. Praxis and science reinforce each other in a specific way: “Sometimes the postures of the [bodily] limbs lift lights into the heart, just as lights from the items of knowledge of the heart go down to the limbs. This is the secret of the exaltation of the souls by means of bodily forms of worship” (Langermann 2019, 110)[^langermann-2019]. There is thus a distinct and immediate spiritual reward for praxis, even for—perhaps especially for—the enlightened.
    step1: |-
      *’Amal* 肯定从属于 *‘ilm*；在这个意义上，虔修论著延续了伊本·凯姆那所有著作中显而易见的强烈科学取向。然而，实践绝不是对大众低智识水平的让步——在宗教的“政治”构想中常被如此认为；它也不只是约束身体冲动的装置。实践与科学以特定方式相互增强：“有时，［身体］肢体的姿态把光提升到心中，正如心中知识项的光下降到肢体。这就是灵魂借身体崇拜形式而提升的秘密”（Langermann 2019, 110）[^langermann-2019]。因此，实践有独特而直接的精神报偿，即使对——或许尤其对——已启蒙者也是如此。
