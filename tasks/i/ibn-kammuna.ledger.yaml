      If we also keep in mind the nascent state of scholarship on the man and the period in which he flourished, the best course of action for the present essay seems to be this. We shall take one very central concept, *ḥads*, most often translated “intuition”, and follow it through Ibn Kammūna’s major works. (It will become clear that in this context, intuition is a sui generis state, which, on the epistemological scale, falls between the discursive reasoning of very bright individuals and the gift of prophecy.) This will allow us to get a handle on a key feature of his philosophical thinking, as well as to observe the different ways the same concept is treated within the different projects that Ibn Kammūna undertook. Note that we shall be alert to the utilization of the concept, even if the term *ḥads* does not appear in the text under scrutiny.
    step1: |-
      如果我们还考虑到关于此人和他所活跃时代的研究尚处初创状态，本文的最佳做法似乎是这样。我们将选取一个非常核心的概念——*ḥads*，最常译作“直觉”——并在伊本·凯姆那的主要著作中追踪它。（将会清楚的是，在此语境中，直觉是一种自成一格的状态，在认识论的刻度上，它处于非常聪颖者的推理性推理与预言天赋之间。）这将使我们把握其哲学思维的一个关键特征，并观察同一概念在伊本·凯姆那所从事的不同计划中得到处理的不同方式。请注意，即使 *ḥads* 一词并未出现在所考察的文本中，我们也将留意该概念的运用。
    step2: |-
      何况，关于此人及其时代的研究尚在草创。因此，本文以为最稳妥的做法是：择定一个极为核心的概念——*ḥads*，通常译作“直觉”——顺着它走一遍伊本·凯姆那的主要著作。（下文将显示，此处的直觉是一种自成一格的状态，在认识论的阶序上，介于极聪慧者的推论理性与先知禀赋之间。）如此，我们既可把握其哲学思维的一大关节，又可观察同一概念在他所从事的不同课题中如何得到不同处理。需说明的是，即便所考察的文本中没有出现 *ḥads* 一词，我们仍会留意该概念的运用。
