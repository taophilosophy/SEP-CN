      The Arabic originals of these two intimately related treatises were published for the first time by Pourjavady & Schmidtke (2006); an annotated translation of the *Ithbat* was published by Langermann (2017). In these writings, Ibn Kammūna pays far less attention to questions of cognition than he does in his other writings. However, here as elsewhere, he takes note of the abilities of gifted people to grasp issues that remain recalcitrant to others who are not so endowed. Here again Ibn Kammūna connects this special mode of cognition with *tajriba*, repeated experience. In addition, he emphasizes here that the fruits of this special type of knowledge can be fully appreciated only by someone who has experienced them. It is thus striking that he does not employ the technical term *ḥads* in the course of his exposition, or, indeed, anywhere at all in these two writings.
    step1: |-
      这两部密切相关的论著的阿拉伯文原稿由 Pourjavady & Schmidtke（2006）首次刊布；*Ithbāt* 的译注本由 Langermann（2017）刊布。在这些著作中，伊本·凯姆那对认知问题的关注远少于他在其他著作中的关注。然而，这里与其他地方一样，他注意到有天赋者把握那些对未如此禀赋者仍属顽固难解的问题的能力。这里伊本·凯姆那再次把这种特殊的认知方式与 *tajriba*（反复经验）联系起来。此外，他在这里强调，这类特殊知识的果实，只有亲身体验过的人才能充分领会。因此，值得注意的是，他在阐述过程中并未使用 *ḥads* 这一术语，事实上，这两部著作中任何地方都没有使用。
    step2: |-
      这两部关系密切的论著，其阿拉伯文原本由 Pourjavady & Schmidtke（2006）首次刊行；《确立本原》的译注本则出自 Langermann（2017）。在这些著作里，伊本·凯姆那对认知问题的措意，远不及他别的著作。然而，与别处一样，他仍注意到有天赋者能把握那些对无此禀赋者始终难解的问题。此处他再次把这种特殊的认知方式与 *tajriba* 即反复经验相连。他还强调，此类特殊知识的果实，唯亲历者方能充分领会。因此颇堪玩味的是：他在行文中并不使用 *ḥads* 这一术语；事实上，两部著作通篇都未出现该词。
