      There is little difference between the ideas expressed in these two treatises and those in the other writings. In all cases the basic thought is that some people are born with an innate ability to swiftly arrive at conclusions that are certainly true. There remains the technical distinction, in that *ḥads*, and *ḥads* specifically, is said to disclose the middle term of the syllogism. However, one should not make too much of this. For one matter, even in cases where *ḥads* is invoked, we rarely if ever can determine just what the syllogism is for which *ḥads* has revealed the middle term. One important exception is the reasoning that leads to the momentous conclusions drawn from the “Flying Man” experiment (see Muehlethaler 2009)[^muehlethaler-2009]. Moreover, whether or not *ḥads* is specifically mentioned, intuition or spontaneous comprehension is paired to *tajriba*.
    step1: |-
