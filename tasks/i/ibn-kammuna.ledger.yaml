      伊本·凯姆那究竟吸纳了多少犹太伦理——圣经的、拉比的与中世纪的——难以断定。犹太伦理与伊斯兰伦理本就始终交缠；到十三世纪，一方面某些拉比观念已彻底伊斯兰化，另一方面犹太形态的苏非主义也早已立足。犹太人摘引古兰经文，是当作普世智慧的箴言，而非某一信仰共同体的经典。[^note-4] 那么，伊本·凯姆那说“智慧之始（*ra’s*，参希伯来语 *reishit*），在于敬畏神”时，是否自觉地引进了《诗篇》111:10 的经文？总体说来，伊本·凯姆那似乎锻造出一种原创的“亚伯拉罕式”哲学虔敬。其哲学根基（关于神与人的概念）与道德价值、精神修炼，都经过精心打磨，务求为一切一神论者所接受。
