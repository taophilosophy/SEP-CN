      Similarly, he has left us a medium length pietistic work (*Kalimat wajiza*) and a much shorter version of the same treatise (*Ithbāt al-mabdaʾ*); but he also confides that he may expand upon the *Kalimāt wajīza* (Pourjavady & Schmidtke 2006, 140)[^pourjavady-2006]. Even if that plan never came to fruition (no evidence of this longer version has as yet turned up), it indicates his conviction that important topics ought to be discussed in all three formats, which presumably take into consideration the varying abilities of people to devote time to study. The two extant pietistic texts are published (Arabic text only, with no discussion of the contents) by Pourjavady & Schmidtke 2006, 139–195. Langermann (2017) has published an annotated translation of the *Ithbāt* as well as a book length translation and study of *Kalimāt wajīza* under the title *Subtle Insights Concerning Knowledge and Practice* (2019).
    step1: |-
      同样，他留给我们一部中等篇幅的虔修著作（*Kalimāt wajīza*）以及同一论著的一个短得多的版本（*Ithbāt al-mabda’*）；但他也吐露，他可能会扩充 *Kalimāt wajīza*（Pourjavady & Schmidtke 2006, 140）[^pourjavady-2006]。即使这一计划从未实现（迄今未发现这一较长版本的任何证据），它也表明了他的信念：重要主题应当以三种格式讨论，这些格式想必考虑到了人们在投入学习的时间上能力各异。现存的两部虔修文本由 Pourjavady & Schmidtke 2006, 139–195 刊布（仅有阿拉伯文，未讨论内容）。Langermann（2017）刊布了 *Ithbāt* 的译注本，以及一部以《知识与实践的幽微洞见》（2019）为题、具有专著篇幅的翻译与研究。
    step2: |-
      与此相类，他留下一部中等篇幅的虔修著作（《简明箴言》，*Kalimāt wajīza*），以及同一论著的一个短得多的本子（《确立本原》，*Ithbāt al-mabda’*）；不过他也自陈，日后或会扩充《简明箴言》（Pourjavady & Schmidtke 2006, 140）[^pourjavady-2006]。这一计划纵未实现（迄今未见较长本的任何踪迹），却透露出他的信念：重要论题应当以三种篇幅呈现，而篇幅之别想来是顾及人们投入研习的时间各有不同。现存两部虔修文本由 Pourjavady & Schmidtke 2006, 139–195 刊行（仅阿拉伯文，未附内容讨论）。Langermann（2017）刊布了《确立本原》的译注本，并于 2019 年以《知识与实践的幽微洞见》（*Subtle Insights Concerning Knowledge and Practice*）为题，出版了《简明箴言》的全译与研究。
