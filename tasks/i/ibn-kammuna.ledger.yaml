      Ibn Kammūna wrote glosses to an important work of Islamic theology, Fakhr al-Dīn al-Rāzī’s *al-Ma‘ālim* (Schmidtke & Pourjavady 2007)[^schmidtke-2007]. In part this is a supercommentary, that is, a response to an earlier set of glosses prepared by his contemporary, Najm al-Din al-Katibi al-Qazwini (d. 1277). In some places Ibn Kammūna defends al-Razi against the strictures of al-Katibī al-Qazwinī, but in others raises criticisms of his own against al-Rāzī. Some of the latter betray upon close reading a subtle anti-Islamic polemic. For example, his long gloss on the first query in chapter seven (Schmidtke & Pourjavady 2007, 96–98)[^schmidtke-2007] is a critique of the role of miracles in establishing the prophetic mission. Ibn Kammūna names no prophets, concentrating instead on the precise definition of *mu‘jiza* (the Arabic term for miracle) given by al-Rāzī himself in other writings, which contradicts his definition in this particular work; and further arguing, again on theoretical grounds, that a tradition can be false (or at least contain some falsity) even if the transmitters are many. However, in the query under scrutiny, al-Rāzī is speaking specifically about Muhammad. Thus Ibn Kammūna’s critiques amount in effect to a rejection of the proofs for Muhammad’s prophetic mission. Later on, though, Ibn Kammūna makes specific criticisms of Judaism and Christianity (Schmidtke & Pourjavady 2007, 226)[^schmidtke-2007]. The glosses are written in a the highly technical language of Islamic theology, which is very different from the philosophical diction he uses in other writings. Ibn Kammūna has clearly mastered both idioms.
    step1: |-
      伊本·凯姆那为伊斯兰神学的一部重要著作——法赫尔丁·拉齐的 *al-Ma‘ālim*——写了评注（Schmidtke & Pourjavady 2007）[^schmidtke-2007]。其中一部分是超注疏，即对同时代人卡提比·卡兹维尼（卒于 1277 年）先前一套评注的回应。在某些地方，伊本·凯姆那为拉齐辩护，反驳卡提比·卡兹维尼的责难；但在另一些地方，他自己也对拉齐提出批评。细读之下，后一类批评中有些透露出微妙的、反伊斯兰的论战。例如，他对第七章第一个问题的长篇评注（Schmidtke & Pourjavady 2007, 96–98）[^schmidtke-2007]批判了奇迹在确立先知使命中的作用。伊本·凯姆那没有点名任何先知，而是集中讨论拉齐本人在其他著作中对 *mu‘jiza*（阿拉伯语的“奇迹”）所下的精确定义，这一定义与此书中拉齐的定义相矛盾；他并进一步依据理论理由论证：即使传述者众多，一个传统也可能是假的（或至少含有某些虚假）。然而，在所考察的那个问题中，拉齐具体谈论的是穆罕默德。因此，伊本·凯姆那的批评实际上等于否定穆罕默德先知使命的证明。不过，在后文中，伊本·凯姆那对犹太教与基督教作了具体批评（Schmidtke & Pourjavady 2007, 226）[^schmidtke-2007]。这些评注用高度技术性的伊斯兰神学语言写成，与他其他著作中所用的哲学措辞大不相同。伊本·凯姆那显然精熟两种语文。
    step2: |-
      伊本·凯姆那曾为伊斯兰神学要籍、法赫尔丁·拉齐的《纲要》（*al-Maʿālim*）作评注（Schmidtke & Pourjavady 2007）[^schmidtke-2007]。此书部分属于超注疏，即针对其同时代人纳杰姆丁·卡提比·卡兹维尼（卒于 1277 年）先前所作评注的回应。有些地方，伊本·凯姆那为拉齐辩护，回击卡提比·卡兹维尼的苛评；另一些地方，他又自出机杼，批评拉齐。细读之下，后一类批评中有些暗含反伊斯兰的论战。比如，他对第七章第一个问题的长篇评注（Schmidtke & Pourjavady 2007, 96–98）[^schmidtke-2007]，即批评奇迹在确立先知使命中的作用。伊本·凯姆那不点任何先知之名，转而紧扣拉齐本人在其他著作中对 *muʿjiza*（阿拉伯语“奇迹”）所下的定义，而该定义与此书中的定义相抵牾；他更从理论上论证：即便传述者众多，传统仍可能是假的（或至少含有虚妄）。然而，所论那个问题中，拉齐谈的正是穆罕默德。故伊本·凯姆那的批评实质上否定了穆罕默德先知使命的证明。不过后文之中，他也对犹太教与基督教作了具体批评（Schmidtke & Pourjavady 2007, 226）[^schmidtke-2007]。评注以伊斯兰神学高度专门的语言写成，与他书中的哲学词藻迥异。显然，两种语体他都运用自如。
