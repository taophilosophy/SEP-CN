      One drawback of this approach is the patchwork image it impresses upon the modern student, as if Ibn Kammūna set out to prepare a quiltwork of philosophical sources rather than to take a stand on the issues. But is this the way his writings present themselves to the reader who is innocent of academic scholarship? Ibn Kammūna is aware of the questions that are under debate, and as a rule he formulates a clear point of view. Nonetheless, his views may well have changed over the years—not at all surprising, if, as some think, he made the more traumatic act of switching religious affiliation. It is in any event clear enough that his expressions, emphases, agreements and disagreements, inclusions and exclusions, were in part functions of the literary genre which he chose for any given work. He could be critical in his commentaries, insofar as he would look closely at the text he was explicating and cite alternative views, but he would not reject outright the views of the author whose work he was commenting upon. In his original writings he was freer to take a personal stand.
    step1: |-
      这一进路的一个缺点，是它给现代学生留下的拼布式形象，仿佛伊本·凯姆那着手准备一幅哲学来源的拼被，而不是就问题表明立场。但这就是他的著作呈现给不懂学术考据的读者的样子吗？伊本·凯姆那清楚争论中的问题，并且通常表述明确的观点。不过，他的观点很可能多年间有所变化——如果如某些人所想，他经历了改换宗教归属这一更为创伤性的举动，那也毫不奇怪。无论如何足够清楚的是，他的表达、强调、赞同与反对、纳入与排除，部分地是他为某一著作所选文类的功能。他在注疏中可以持批评态度，因为他会细察所解释的文本并引述替代观点，但他不会直截了当地拒斥其所注疏作者的观点。在自己的原创著作中，他更自由地采取个人立场。
    step2: |-
      这种进路有一个毛病：它在现代读者心中印下一个拼缀而成的形象，仿佛伊本·凯姆那只想把各家哲学来源拼成一条百衲被，而非就问题表明立场。可是，他的著作呈现给不谙学术考据的读者时，真是这副模样吗？伊本·凯姆那对争论中的问题了如指掌，且通常都给出明确看法。当然，他的观点很可能随年岁而变——若如某些人所想，他甚至经历了改换宗教信仰这样更剧烈的举动，那也不足为怪。无论如何，有一点足够清楚：他的表述、强调、赞同与异议、纳入与排除，部分地取决于他为某部作品所选定的文体。在注疏中他尽可批评，因为他会细读所解之文并列举异说，却不会断然否定所注作者的观点；在自己原创的著作里，他则更能自由地站定个人立场。
