      The terminological conundrum intensifies when we bring into the discussion another term, *dhawq*, literally “taste”. *Dhawq* is a Sufi term and refers to a usually fleeting, intense religious experience, which leaves the adept knowing something more than he knew beforehand. Viewed as a phenomenon of the human mind, it is essentially the same thing as intuition. It is used in exactly this sense by Ibn Sīnā—significantly, in the monograph on the rational soul considered to be his very last work.[^note-3] Suhrawardī adopted the term for his version of knowledge based upon intuition, *ḥikma dhawqiyya*; in Ibn Kammūna’s *New Wisdom*, *ḥads* and *dhawq* are synonymous (Langermann 2005, 300)[^langermann-2005]. Yet in the pietistic writings, where one would expect to find the usual Sufi term, *dhawq* is not employed.
    step1: |-
      当我们把另一个术语 *dhawq*（字面意思“品尝”）带入讨论时，术语上的难题就加剧了。*Dhawq* 是个苏非术语，指通常短暂而强烈的宗教体验，它使修行者所知多于此前。作为人类心灵的现象来看，它本质上与直觉是同一回事。伊本·西那正是在这个意义上使用它——意味深长的是，是在被认为是他最后一部著作的论理性灵魂的专著中。[^note-3] 苏赫拉瓦尔迪采纳该术语来指其基于直觉的知识版本，即 *ḥikma dhawqiyya*；在伊本·凯姆那的《新智慧》中，*ḥads* 与 *dhawq* 是同义词（Langermann 2005, 300）[^langermann-2005]。然而在虔修著作中——人们本会期待找到通常的苏非术语之处——*dhawq* 却没有被使用。
    step2: |-
      若再把另一术语 *dhawq*（字面义“品尝”）也拉进来，术语上的纠结就更深了。*Dhawq* 是苏非用语，指一种通常短暂而强烈的宗教体验，使修行者所知多于先前。就人类心灵的现象而言，它与直觉实为一事。伊本·西那正是在此意义上使用它——耐人寻味的是，这见于那部论理性灵魂、被视为其绝笔的专著。[^note-3] 苏赫拉瓦尔迪取此词指称其以直觉为本的知识形态，即 *ḥikma dhawqiyya*；在伊本·凯姆那的《新智慧》中，*ḥads* 与 *dhawq* 乃同义词（Langermann 2005, 300）[^langermann-2005]。然而在虔修著作里——本该见到这一常用苏非术语的地方——*dhawq* 却未被采用。
