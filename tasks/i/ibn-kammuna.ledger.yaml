      These are welcome developments, to be sure, but there is cause for further reflection. In particular, the arguments advanced by Ibn Kammūna have as a rule not been taken into account by the editors, who must decide between variants in the manuscripts, or by the critics who review the editions. Simply taking note of variants missed by one or more editor, even if these seem to be significant, is not enough; we would like to see a discussion of sample passages, with full analysis of the implications of the different readings. At times there is no grammatical, syntactical, or lexical reason a priori to choose one variant over the other. Without fully understanding the passage in question, errors may ensue; an example of this given by Langermann 2009, p. 282. Earlier editions must not be dismissed as worthless unless one can provide examples to prove such an extreme claim. Moreover, changing the title of a book in mid-course without any justification (all agree, for example, that Ibn Kammūna himself gave no title to the work commonly referred to as the *New Wisdom*) introduces confusion with no compensatory payoff.
    step1: |-
      这些当然是值得欢迎的发展，但仍有进一步反思的理由。尤其是，伊本·凯姆那所提出的论证，通常既没有被编者——他们必须在抄本的异文中作取舍——考虑，也没有被审阅校勘本的批评者考虑。仅仅指出一位或多位编者遗漏的异文，即使这些异文看来重要，也是不够的；我们希望看到对样段的讨论，并充分分析不同读法的含义。有时并没有语法、句法或词汇上的先验理由来在异文之间作出选择。如果不完全理解所涉段落，错误就可能随之而来；Langermann 2009, p. 282 给出了一个例子。不能把较早的校勘本贬为毫无价值，除非能提供例子来证明如此极端的论断。此外，中途毫无理由地更改书名（例如，大家都同意，伊本·凯姆那本人并未给通常称为《新智慧》的著作题名）会带来混乱，且无补偿性收益。
    step2: |-
      这些诚然都是可喜的进展，但仍值得再想一想。尤其是，编者要在抄本异文之间取舍，书评者要审断校勘本，可他们通常都不曾考虑伊本·凯姆那所提出的论证。仅仅指出某位或某几位编者漏掉的异文——哪怕这些异文看来重要——还不够；我们想看到的是对样段的讨论，并充分分析不同读法所蕴涵的后果。有时，在异文之间作取舍，并无语法、句法或词汇上的先验理由。若不彻底理解所涉段落，错误便可能随之而生；Langermann 2009, p. 282 即举了一例。除非能拿出例证来支持如此极端的论断，否则不该把较早的校勘本贬得一文不值。此外，中途毫无理由地改换书名（例如，众所公认，伊本·凯姆那本人并未给通常称作《新智慧》的那部书题名），只会招致混乱，而毫无补偿。
