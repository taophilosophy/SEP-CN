      Finally, the second Gulf War and its severe impact on the Iraqi cultural heritage have produced some positive developments in the study of Ibn Kammūna. Most notably, the efforts at recataloguing the collections of Iraqi institutions have brought to light a great deal of valuable information about still extant manuscripts of the writings of Ibn Kammūna and their contents, most notably in in the Maktabat al-Rawḍa al-Ḥaydariyya at Najaf. Sabine Schmidtke (2022) has reported in detail on items related to Ibn Kammūna. As of this writing (June 2024) images of these texts are not available for research. However, and not surprisingly, some items have found their way to the public auction block, and Schimdke has secured images of one related to Ibn Kammūna and his engagement with the logic of al-Nakhjuwani (see above). These are reproduced at the end of the paper cited in the preceding sentence.
    step1: |-
      最后，第二次海湾战争及其对伊拉克文化遗产的严重冲击，在伊本·凯姆那研究方面产生了一些积极的进展。最值得注意的是，重新编目伊拉克各机构藏书的努力，揭示了大量关于伊本·凯姆那著作现存抄本及其内容的宝贵信息，尤其是在纳杰夫的 Maktabat al-Rawḍa al-Ḥaydariyya。Sabine Schmidtke（2022）详细报告了与伊本·凯姆那相关的条目。截至本文写作（2024 年 6 月），这些文本的图像尚不可供研究使用。然而，不出所料，有些条目已流入公开拍卖，Schmidtke 获得了其中一件与伊本·凯姆那及其与 al-Nakhjuwani 逻辑学之关联（见上文）相关的图像。这些图像复制于上一句所引论文的末尾。
    step2: |-
      最后，第二次海湾战争及其对伊拉克文化遗产的重创，也给伊本·凯姆那研究带来了一些积极变化。最突出的是，重新编目伊拉克各机构藏书的努力，使大量有关伊本·凯姆那现存抄本及其内容的宝贵信息重见天日，纳杰夫的 Maktabat al-Rawḍa al-Ḥaydariyya 所藏尤为可观。Sabine Schmidtke（2022）已就与伊本·凯姆那相关的条目作了详细报告。截至本文写作之时（2024 年 6 月），这些文本的图像仍不开放供研究之用。不过，不出所料，有些条目已流入公开拍卖；Schmidtke 取得了其中一件的图像，该件与伊本·凯姆那及其对 al-Nakhjuwani 逻辑学的涉猎有关（见上文）。这些图像复制于上句所引论文的末尾。
