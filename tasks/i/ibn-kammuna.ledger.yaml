      Ibn Kammūna wrote a much shorter treatise on the differences between the two main Jewish groupings, Rabbinites and Karaites (English translation by Nemoy). Here again, despite the absence of any open polemics, it is clear that Ibn Kammūna’s sympathies lie with the Rabbinic majority.
    step1: |-
      伊本·凯姆那写了一篇短得多的论著，讨论犹太两大群体——拉比派与卡拉派——之间的差异（Nemoy 英译）。这里同样，尽管没有公开论战，但很清楚伊本·凯姆那的同情在拉比派多数一边。
    step2: |-
      伊本·凯姆那另撰有一篇篇幅短得多的论著，讨论犹太教两大群体拉比派与卡拉派之间的分歧（Nemoy 英译）。此书同样没有公开论战，但伊本·凯姆那同情拉比派多数，这一点十分清楚。
  - id: 10
    kind: body
    source: |-
      Ibn Kammūna’s most significant contribution to the history of philosophy is his detailed commentary to Suhrawardī’s *al-Talwīḥāt*. (Several editions have appeared and are discussed in the last section of this entry). This is the first known commentary to that work, which, though more Aristotelian than other writings of Suhrawardī, still conveys essential points of the Ishraqi philosophy. Directly through his commentary, and indirectly by means of his influence upon Quṭb al-Dīn al-Shirazī (1236–1311), Ibn Kammūna was very instrumental in the initial phases of the exposition and diffusion of Suhrawardī’s thought.
    step1: |-
      伊本·凯姆那对哲学史最重要的贡献，是他对苏赫拉瓦尔迪 *al-Talwīḥāt* 的详细注疏。（已有数个版本问世，将在本词条最后一节讨论。）这是已知最早的该著作注疏；该著作虽比其他苏赫拉瓦尔迪著作更具亚里士多德色彩，仍传达了照明哲学的要旨。直接通过其注疏，并间接通过他对库特卜丁·设拉子（1236–1311）的影响，伊本·凯姆那在苏赫拉瓦尔迪思想之阐发与传播的初期阶段起了很大作用。
    step2: |-
      伊本·凯姆那对哲学史最重要的贡献，是为苏赫拉瓦尔迪的《暗示书》（*al-Talwīḥāt*）所作的详细注疏（已有数种版本行世，详见本文末节）。这是该著作已知最早的注疏。此书虽较苏赫拉瓦尔迪其他著作更近亚里士多德一路，却仍传达出照明哲学的要旨。伊本·凯姆那既直接借注疏，又间接借其对库特卜丁·设拉子（Quṭb al-Dīn al-Shīrāzī，1236–1311）的影响，在苏赫拉瓦尔迪思想之阐扬与流布的初期发挥了极大作用。
