      The science of the soul (*‘ilm al-nafs*) is an important topic in all of Ibn Kammūna’s philosophical treatises. In addition, he wrote three monographs, two of which aim to prove that the soul is eternal, and a third which refutes the claim that the soul is nothing but the temperament or mixture of the bodily humours, as well as the view that the soul comes into being along with the body. (Pourjavady & Schmidtke 2006, 100–106)[^pourjavady-2006]. His special interest in studying the soul (*nafs*) calls for explanation. Like so many other features of his work, it can be understood only in the context of the Avicennan legacy. Avicenna took his perception of his own self to be the most certain piece of knowledge that he possessed. (It may be noted in passing that in Arabic, *nafs* means both “soul” and “self”; though Avicenna took care to be as precise as possible in his terminology, this double-entendre has an inevitable presence in Arabic psychological literature, especially in the wake of Avicenna). This approach is totally at odds with the Aristotelianism that, in all of its flavors, was the foundation of Islamic philosophies. Throughout his life Avicenna struggled with the complex of problems ensuing from his insight, especially in the realms of psychology and epistemology, without ever arriving at a satisfactory solution. The conundrum reverberated in the work of the following generations.[^note-1]
    step1: |-
      灵魂的科学（*‘ilm al-nafs*）是伊本·凯姆那所有哲学论著中的重要主题。此外，他写了三部专著，其中两部旨在证明灵魂永恒，第三部驳斥“灵魂不过是身体体液的气质或混合”这一主张，以及“灵魂与身体一同生成”的观点。（Pourjavady & Schmidtke 2006, 100–106）[^pourjavady-2006]。他对研究灵魂（*nafs*）的特殊兴趣需要解释。像他工作的许多其他特征一样，这只能在阿维森纳遗产的语境中理解。阿维森纳把对自身的知觉视为他所拥有的最确定的知识。（顺带一提，在阿拉伯语中，*nafs* 既指“灵魂”也指“自我”；尽管阿维森纳在术语上力求精确，这一双关在阿拉伯心理学文献中不可避免地存在，尤其是在阿维森纳之后。）这一进路与亚里士多德主义完全相左，而后者在其一切变体中都曾是伊斯兰哲学的基础。终其一生，阿维森纳都在与其洞见所引发的复杂问题搏斗，尤其是在心理学与认识论领域，却从未获得令人满意的解决。这一难题在随后几代人的著作中回响。[^note-1]
    step2: |-
      灵魂之学（*ʿilm al-nafs*）是伊本·凯姆那全部哲学论著的重要主题。他另外撰有三部专著：其中两部旨在证明灵魂永恒，第三部则驳斥“灵魂不过是身体体液的气质或混合”之说，以及“灵魂随身体一同生成”之见（Pourjavady & Schmidtke 2006, 100–106）[^pourjavady-2006]。他对灵魂（*nafs*）研究的特殊兴趣，本身需要解释。与他著作的许多特征一样，这只能放在阿维森纳遗产的脉络中才能理解。阿维森纳把对自身的知觉看作自己所拥有的最确定的一项知识。（顺便说一句，阿拉伯语的 *nafs* 兼有“灵魂”与“自我”二义；阿维森纳虽在术语上力求精确，这一双关仍不可避免地弥漫于阿拉伯心理学文献，阿维森纳之后尤然。）这一进路与亚里士多德主义完全相左，而后者无论何种形态，都是伊斯兰哲学的基础。阿维森纳终其一生都在与其洞见所引出的问题群搏斗，心理学与认识论领域尤其如此，却始终未得满意解决。该难题在随后数代人的著作中反复回响。[^note-1]
