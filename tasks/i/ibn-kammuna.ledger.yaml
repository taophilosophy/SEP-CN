      Just how much Jewish ethics, biblical, rabbinic, and medieval, Ibn Kammūna has included is difficult to determine. Jewish and Islamic ethics have been intertwined all along; by the thirteenth century, some rabbinic ideas had become thoroughly islamicized on the one hand, and, on the other, Jewish versions of Sufism were well-established. Jews cited snippets of the Qur’an as apothegms of universal wisdom, rather than as the scripture of a particular faith community.[^note-4] So when Ibn Kammūna says that “The beginning (*ra’s*, cf. Hebrew *reishit*) of wisdom is fear of God,” is he consciously importing the verse from Psalms 111:10? Overall, Ibn Kammūna appears to have formulated an original “Abrahamic” philosophical piety. Both the philosophical foundations underpinnings (concepts of the deity and of humanity) as well as the moral values and spiritual exercises, were carefully crafted so as to be acceptable to all monotheists .
