      Strictly speaking, *ḥads* is the revelation—some would add instantaneously—of the middle term of the syllogism, leading to an infallible conclusion. In practice, though, it had much wider application and less precise definition. Rare indeed is the case, when *ḥads* is cited as the source of knowledge, that the writer will display the full syllogism and specify the middle term (see Langermann 2005, 286–302, and Gutas 2001)[^gutas-2001][^langermann-2005]. In effect, it is of the same species as the “revelations” by which Avicenna learned of his own existence (and indeed the great bulk of his education) and, like that Avicennan moment, it shifted epistemology in the direction of a reliance upon a person’s sense of security in his personal illuminations . In the work of later thinkers, including Ibn Kammūna, the evaluation of *ḥads* served to legitimize alchemy and astrology and, more generally, to blur the distinction between demonstrative knowledge and revelation.
    step1: |-
      严格说来，*ḥads* 是对三段论中项的启示——有人会补充说，是瞬间的启示——它导向不可错的结论。但在实践中，它的应用范围要广得多，定义也不那么精确。当 *ḥads* 被引为知识来源时，作者会展示完整三段论并指明中项，这种情况实在罕见（见 Langermann 2005, 286–302 与 Gutas 2001）[^gutas-2001][^langermann-2005]。实际上，它与阿维森纳借以得知自身存在（以及其教育的大部分）的那些“启示”属于同一类；并且像那个阿维森纳式时刻一样，它把认识论推向依赖个人对其个人照明之确定感的境地。在包括伊本·凯姆那在内的后世思想家著作中，对 *ḥads* 的评估起到了使炼金术与占星术合法化的作用，更一般地说，模糊了证明性知识与启示之间的区别。
    step2: |-
      严格地说，*ḥads* 是对三段论中项的启示——有人还会加上“瞬间的”——由此得出不可错的结论。但在实际使用中，它的范围宽得多，定义也含糊得多。当作者把 *ḥads* 引为知识来源时，极少会摆出完整的三段论并指明其中项（见 Langermann 2005, 286–302 及 Gutas 2001）[^gutas-2001][^langermann-2005]。实际上，它与阿维森纳借以得知自身存在（乃至其学问之大半）的那些“启示”同属一类；与那个阿维森纳式时刻一样，它把认识论推向一端：倚赖个人对自己那些私人照明的确定感。在伊本·凯姆那等后世思想家笔下，对 *ḥads* 的论说还被用来为炼金术与占星术张目，并且更一般地抹平了证明性知识与启示之间的界限。
