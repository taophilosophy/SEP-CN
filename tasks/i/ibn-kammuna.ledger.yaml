      *Subtle Insights* is dedicated to a Muslim patron, and it easily and naturally reads as a work of Muslim piety. However, on close inspection, there is nothing distinctly Muslim about it. Ibn Kammūna is driven by the same idea of spirituality and religiosity common to Muslims, Jews, Christians, or non-denominational philosophic theists of the type described by Judah Halevi in his *Kuzari*, a book that Ibn Kammūna studied closely. It is striking that the only Qur’anic verse cited, from the fifty-seventh *sura* (“Iron”, verse 3) has, at least for its first part (“He is the first and the last…”), an exact parallel in both the Hebrew and Christian bibles.
