      Consistent with the concerns so prominent in his other writings, Ibn Kammūna devotes a great deal of space (half of part one of *Subtle Insights*, which deals with *‘ilm*, whose meaning in this text has been described two paragraphs above) to the human soul (*nafs*; the meaning of this term in this text has been given above, section II), its quasi-divine nature, and its survival after death. His discourse on these issues is philosophical. In the second part of this treatise, however, Ibn Kammūna shifts to a Sufi mode of exposition. In keeping with Sufi notions, he emphasizes the key, critical role of the *qalb*, literally “heart”, as the epicenter of human goodness. However, he does not adopt the very common Sufi opposition of *nafs*, “soul”, to *qalb*, where the former stands for passions and bad moral traits. Instead, he defines *qalb* as “the eye of *nafs*. (”Eye“ in this context has much the same meaning as it has in the English phrase, ”the eye of the storm“).”
