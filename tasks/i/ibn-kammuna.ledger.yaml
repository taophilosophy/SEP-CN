      *Ḥads* was not just one more function to be added to the basket of terminologies used to explain psychological processes. Two applications in particular must be singled out. First of all, *ḥads* offered an analogy to prophecy; no other phenomenon from the world of humans, extraordinary as it may be, seemed as close to prophetic revelation. Second, it offered a way to account for great scientific acumen. Prophecy, scientific discovery, and intuition in general all lead those who experience them to certain knowledge in a moment of revelation, in general, knowledge that had not been available before.
    step1: |-
      *Ḥads* 不只是要被添入解释心理过程的那一篮术语中的又一项功能。尤其必须挑出两种应用。首先，*ḥads* 提供了与预言的类比；人类世界中再没有别的现象，无论多么非凡，看起来比它更接近先知式的启示。其次，它提供了一种解释卓越科学敏锐性的方式。预言、科学发现与一般的直觉，都使经历者在某个启示瞬间获得确定的知识——一般而言，是此前未曾拥有的知识。
    step2: |-
      *Ḥads* 并非只是在解释心理过程的那一堆术语里再添一项功能而已。有两种用法尤须指出。其一，*ḥads* 提供了一个与预言相类的例子：人类世界之中，再没有哪种现象——无论多么奇异——看上去比它更接近先知式的启示。其二，它提供了一种说明杰出科学洞察力的办法。预言、科学发现与一般意义上的直觉，都在某个启示的瞬间把确定的知识——而且往往是此前未曾有过的知识——带给亲历者。
