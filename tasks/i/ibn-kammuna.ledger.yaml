      伊本·凯姆那纳入了多少犹太伦理——圣经的、拉比的与中世纪的——难以确定。犹太伦理与伊斯兰伦理一直交织在一起；到十三世纪，一方面某些拉比观念已彻底伊斯兰化，另一方面犹太版本的苏非主义也已确立。犹太人引用古兰经片段，是把它当作普遍智慧的箴言，而非某一特定信仰群体的经典。[^note-4] 所以，当伊本·凯姆那说“智慧的开端（*ra’s*，参希伯来语 *reishit*）是敬畏神”时，他是否有意识地在引进《诗篇》111:10 的经文？总体而言，伊本·凯姆那似乎构想了一种原创的“亚伯拉罕式”哲学虔敬。无论是哲学基础（关于神与人的概念），还是道德价值与精神修炼，都被精心打造，以便为所有一神论者所接受。
