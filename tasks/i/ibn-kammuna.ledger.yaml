      ## 1 生平
  - id: 5
    kind: body
    source: |-
      Few facts of Ibn Kammūna’s biography are confirmed (Pourjavady & Schmidtke 2006, 8–22, for most biographical details and bibliography)[^pourjavady-2006]. He is presumed to have been born in Baghdad and to have spent most of his life there. However, there is good evidence that he spent some time in Aleppo; his presence in that important intellectual center explains certain facets of his activity that are otherwise difficult to account for (Langermann 2007)[^langermann-2007]. He may have been descended from a family of courtiers; he certainly had connections to some high officials, some of whom were his patrons. Ibn Kammūna also corresponded with some leading intellectuals, notably Nasir al-Din al-Tusi. Shortly before his death in 1284, Ibn Kammūna fled Baghdad for the nearby town of Hilla. This move has long been thought to have been forced upon Ibn Kammūna by hostile reaction to one of his books. However, it has recently been suggested that it is more likely to be connected to the execution of one of his patrons.
    step1: |-
      伊本·凯姆那生平中得到确认的事实很少（关于大部分生平细节与参考书目，见 Pourjavady & Schmidtke 2006, 8–22）[^pourjavady-2006]。人们推测他生于巴格达，并在那里度过了一生的大部分时间。然而，有很好的证据表明他曾在阿勒颇待过一段时间；他在这座重要知识中心的存在，解释了其活动的某些侧面，否则这些侧面难以解释（Langermann 2007）[^langermann-2007]。他可能出身于一个朝臣家庭；他肯定与一些高级官员有联系，其中一些人是他的赞助人。伊本·凯姆那还与一些一流知识分子通信，尤其是纳西尔丁·图西。1284 年去世前不久，伊本·凯姆那逃离巴格达，前往附近的希拉镇。长期以来，人们认为这一迁居是伊本·凯姆那因一本书遭到敌意反应而被迫为之。然而，最近有人提出，这一迁居更可能与他的某位赞助人被处死有关。
    step2: |-
      关于伊本·凯姆那的生平，得到确证的事实很少（生平细节与文献目录主要依据 Pourjavady & Schmidtke 2006, 8–22）[^pourjavady-2006]。学界推测他生于巴格达，且大半生都在那里度过。不过也有可靠证据显示，他曾在阿勒颇居留；他在这一重要知识中心的活动，恰好解释了其生涯中若干否则难以说明的方面（Langermann 2007）[^langermann-2007]。他或许出身于廷臣之家；他无疑与一些高官有往来，其中数人还是他的赞助人。伊本·凯姆那亦与一些顶尖知识分子通信，尤以纳西尔丁·图西（Naṣīr al-Dīn al-Ṭūsī）为要。1284 年去世前不久，他离开巴格达，避居附近的希拉镇。长期以来，人们认为这次迁居是因其一部著作招致敌意、被迫而行；晚近则有研究提出，此事更可能与他的一位赞助人被处死相关。
  - id: 6
    kind: body
    source: |-
      Ibn Kammūna was certainly born into a Jewish family. Though his writings as a rule do not betray his Judaism—if anything, they read like the work of a devout, if philosophically inclined, Muslim—his two forays into comparative religion exhibit a clear bias in favor of rabbinic Judaism. Some subtle polemics are detectable in glosses that he wrote to an important work of Islamic theology. (This is discussed in the next section.) On the other hand, his attraction to Sufi-style piety does not betray any influences of earlier Jewish ventures in the same direction, notably by the descendants of Maimonides. But did he remain Jewish until his death? There are counter-indications; one may take note of numerous pious references to the Prophet in Ibn Kammūna’s writings, not all of which can easily be ascribed to later scribes. The great bibliographer Moritz Steinschneider opined that Ibn Kammūna in fact converted; his arguments were countered by some of the great pioneers of Judaeo-Arabic studies, notably D.H. Baneth. Pourjavady & Schmidtke, in their recent book-length study (2006), doubt the story of Ibn Kammūna’s conversion. However, the most telling testimony in this regard is provided by Rashid al-Din Hamadani, who was of origin but certainly embraced Islam and castigated his predecessor Ibn Kammūna for not doing the same (Brack 2023, 17)[^brack-2023].
    step1: |-
      伊本·凯姆那肯定出生于一个犹太家庭。虽然他的著作通常并不暴露其犹太身份——如果说有什么的话，它们读起来像一位虔诚的、尽管倾心哲学的穆斯林的作品——但他两度涉足比较宗教，都表现出明显偏向拉比犹太教的倾向。在他为一部重要的伊斯兰神学著作所写的评注中，可以发现一些微妙的论战。（这一点将在下一节讨论。）另一方面，他对苏非式虔敬的倾慕，并未显示出受犹太人在同一方向上较早尝试的任何影响，尤其是迈蒙尼德后裔的尝试。但他是否一直保持犹太身份直到去世？有反面迹象；人们可以注意到伊本·凯姆那著作中对先知的大量虔敬提及，这些提及并非都能轻易归诸后来的抄写者。伟大的书志学家莫里茨·施泰因施奈德认为伊本·凯姆那实际上皈依了；他的论证遭到一些犹太-阿拉伯研究伟大先驱的反驳，尤其是 D. H. Baneth。Pourjavady 与 Schmidtke 在其晚近的专著性研究（2006）中，怀疑伊本·凯姆那皈依的说法。然而，这方面最有说服力的证词来自拉施德丁·哈马丹尼：他出身于同一群体，却肯定皈依了伊斯兰教，并斥责其前辈伊本·凯姆那未这样做（Brack 2023, 17）[^brack-2023]。
    step2: |-
      伊本·凯姆那无疑出身犹太家庭。他的著作通常并不流露其犹太身份——读来反倒像一位虔敬而倾心哲学的穆斯林之作——但他两度涉足比较宗教，都明显偏向拉比犹太教。他为一部重要的伊斯兰神学著作所写的评注，字里行间透出微妙的论战意味（详见下节）。另一方面，他对苏非式虔敬的向往，并未见出受犹太人先前同类尝试（尤其是迈蒙尼德后裔）的影响。但他是否终其一生都是犹太人？也有反证：其著作中多有对先知的虔敬称引，而这些并非都能轻易归咎于后世抄手。大书志学家莫里茨·施泰因施奈德（Moritz Steinschneider）主张伊本·凯姆那实已改宗；其论证遭到犹太-阿拉伯研究若干先驱的反驳，其中尤以 D. H. Baneth 为著。Pourjavady 与 Schmidtke 晚近的专著（2006）亦怀疑改宗之说。不过，此问题最有力的证词出自拉施德丁·哈马丹尼（Rashīd al-Dīn Hamadānī）：他本人出身于同一群体，却无疑归信了伊斯兰教，并斥责其前辈伊本·凯姆那未能如此（Brack 2023, 17）[^brack-2023]。
