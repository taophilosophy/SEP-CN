      In a later section of *The New Wisdom* Ibn Kammūna reproduces almost word-for-word the final definition of *ḥads* given by Ibn Sina in his *Pointers* (*al-Ishārāt*), one of his later writings. He begins by noting that progress from first intelligibles to secondary ones can be either by means of *fikr* (cogitation or reflection) or by *ḥads*, “in that the middle term presents itself to the mind all at once, either as the result of a search and desire [*shawq*] for it, without any [corresponding] motion [of the soul], or without any impulse [*ishtiyaq*] or motion.” Ibn Kammūna continues, “Along with it, the object of the search [i.e. the conclusion of the syllogism] and that which it entails present themselves. There is no difference between reflection and intuition, other than the presence of motion in reflection and its absence in intuition” [ed. 441].
    step1: |-
      在《新智慧》后面的一节中，伊本·凯姆那几乎逐字复述了伊本·西那在其晚期著作之一《指点书》（*al-Ishārāt*）中给出的 *ḥads* 最终定义。他首先指出，从第一可知对象到第二可知对象的进展，既可以借 *fikr*（思考或反思），也可以借 *ḥads*，“其方式是中项一下子呈现于心灵，或由［对它的］寻求与渴望（*shawq*）所致，而没有任何［相应的］运动，或没有任何冲动（*ishtiyāq*）或运动”。伊本·凯姆那接着说：“随之，所寻求的对象［即三段论的结论］及其蕴含者也一同呈现。反思与直觉之间没有差别，除了反思中有运动而直觉中没有”［校勘本 441］。
    step2: |-
      《新智慧》后面的一节，几乎逐字照录了伊本·西那晚年著作《指点书》（*al-Ishārāt*）中为 *ḥads* 所下的最后定义。他先指出，由第一可知对象进至第二可知对象，或借 *fikr*（思虑、反思），或借 *ḥads*：“中项一下子呈于心灵，或由对它的寻求与渴慕（*shawq*）而致，其间并无［相应的］运动；或竟无冲动（*ishtiyāq*）、无运动。”伊本·凯姆那接着写道：“随之而现的，是所寻求者［即三段论的结论］及其所蕴涵者。反思与直觉之别，只在于反思有运动、直觉无运动”［校勘本 441］。
