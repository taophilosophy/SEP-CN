      Ibn Kammūna communicated this “proof” to Nasir al-Din al-Tusi, who proceeded to uncover its fallacies.[^note-5] For example, the contraposed major premise, “whatever does not necessitate the denial of immediate reality is immediately real,” when written in its positive formulation, requires a rider: “Whatever is absent from immediate reality (*ghayr waqi’*, grammatically a positive sentence in Arabic) necessitates the negation of immediate reality, as long as it remains absent from immediate reality.” The rider, however, makes the premise hypothetical, and that, in turn, changes the rules as far as conversion is concerned, and does not allow the conclusion Ibn Kammūna wishes to draw.
    step1: |-
      伊本·凯姆那把这一“证明”告知纳西尔丁·图西，图西进而揭示其谬误。[^note-5] 例如，换质位后的大前提“凡不必然导致对直接现实之否认者，就是直接现实的”，当以其肯定表述写出时，需要一个附加条件：“凡不在直接现实之中者（*ghayr wāqi‘*，在阿拉伯语中语法上是肯定句），只要它仍不在直接现实之中，就必然导致对直接现实的否定。”然而这一附加条件使前提成为假言命题，而这又改变了换位方面的规则，并且不允许伊本·凯姆那希望得出的结论。
    step2: |-
      伊本·凯姆那把这套“证明”寄给纳西尔丁·图西，后者随即揭出其谬误。[^note-5] 例如，经换质位后的大前提“凡不必然导致否认直接现实者，即为直接现实”，若写成其肯定式，就须附加一个限制：“凡不在此直接现实之中者（*ghayr wāqiʿ*，在阿拉伯语中语法上属肯定句），只要仍不在直接现实之中，就必然导致对直接现实的否定。”可是这一限制使前提变成了假言命题，从而改变了换位方面的规则，伊本·凯姆那所欲得出的结论也就不能成立。
