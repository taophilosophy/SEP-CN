      Ibn Kammūna’s work in psychology attracted the interest of the great pioneer in Islamic studies, Ignace Goldziher (1896), who devoted a short study to Ibn Kammūna’s arguments for the soul’s immortality. However, Ibn Kammūna’s main claim to fame in the twentieth century was certainly his *Examination*, which was widely hailed as the first dispassionate, scientific, non-polemical comparative study of its sort. Henri Corbin’s (1945) 2-volume work in French opened up the world of Suhrawardi and the Ishraqi philosophers for western scholarship, and signaled Ibn Kammūna’s key role in the diffusion of Suhrawardi’s thought. Nonetheless, we still have no clear picture of a distinctive Ibn Kammunian interpretation of Suhrawardi, if such a thing exists. His philosophy belongs to the elaboration, refinement, and defense of the Avicennian tradition, led in his day by Nasir al-Din al-Tusi, with whom he corresponded. On the other hand, he evidently accepted some of the criticisms leveled at Avicenna by Abu-l-Barakat al-Baghdadi and Fakhr al-Din al-Razi. Finally, the present article hopes to add to his intellectual portrait the deep piety evident in his ethical treatises, which draw upon Jewish, Islamic, and non-denominational philosophic sources.
    step1: |-
      伊本·凯姆那在心理学方面的工作引起了伊斯兰研究伟大先驱伊格纳茨·戈德齐赫（1896）的兴趣，他为伊本·凯姆那关于灵魂不朽的论证写了一篇简短研究。然而，伊本·凯姆那在二十世纪的主要名声无疑来自他的 *Examination*，该书被广泛誉为同类著作中第一部冷静、科学、非论战的比较研究。亨利·科尔班的（1945）两卷本法文著作向西方学术界打开了苏赫拉瓦尔迪与照明哲学家的世界，并标示出伊本·凯姆那在苏赫拉瓦尔迪思想传播中的关键作用。然而，对于是否存在一种独特的伊本·凯姆那式苏赫拉瓦尔迪解释，我们仍无清晰图景。他的哲学属于对阿维森纳传统的阐发、精炼与辩护，该传统在他那个时代由纳西尔丁·图西领导，而他与图西有通信往来。另一方面，他显然接受了阿布·巴拉卡特·巴格达迪与法赫尔丁·拉齐对阿维森纳的某些批评。最后，本文希望在其思想肖像中补上其伦理论著中显而易见的深厚虔敬——这些论著取材于犹太教、伊斯兰教与非宗派的哲学资源。
    step2: |-
      伊本·凯姆那的心理学研究引起了伊斯兰研究巨擘伊格纳茨·戈德齐赫（Ignace Goldziher，1896）的注意，后者就其灵魂不朽的论证写了一篇短论。不过，伊本·凯姆那在二十世纪赢得声名，靠的无疑是《审查》：此书被普遍誉为同类中第一部冷静、科学、非论战的比较研究。亨利·科尔班（Henri Corbin）1945 年的两卷本法文著作，为西方学界打开了苏赫拉瓦尔迪与照明哲学家的世界，也凸显了伊本·凯姆那在传播苏赫拉瓦尔迪思想中的关键作用。然而，是否真有一种独特的伊本·凯姆那式苏赫拉瓦尔迪诠释，我们至今仍看不清楚。他的哲学属于阿维森纳传统的阐发、精炼与辩护，而这一传统在他那个时代由纳西尔丁·图西执其牛耳，他本人与图西有书信往还。另一方面，他也显然接受了阿布·巴拉卡特·巴格达迪（Abu-l-Barakat al-Baghdadi）与法赫尔丁·拉齐对阿维森纳的部分批评。最后，本文还希望在其思想肖像上添一笔：其伦理论著中那种深厚的虔敬，取材于犹太教、伊斯兰教与非宗派的哲学资源。
