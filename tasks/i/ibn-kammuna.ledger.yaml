      Nonetheless, Ibn Kammūna parted ways with Avicenna, and with the mainstream philosophical tradition, on the key issue of the soul’s pre-existence. Avicenna denied that the soul existed before the human was born, but Ibn Kammūna held that the soul’s pre-existence is intimately connected with its immateriality, and a doctrine that must be accepted in order to prove the soul’s survival after the death of the body. And, indeed, as Lukas Muehlethaler has shown in a series of publications, Ibn Kammūna labored to shore up the demonstrations of psychological doctrines throughout. In his commentary to Avicenna’s *Ishārāt* (“Pointers”), where the “Flying Man” thought experiment is displayed, Ibn Kammūna puts Avicenna’s verbal argument into syllogistic form. (Whether the syllogism is productive, and, in general, just how well Ibn Kammūna has succeeded in answering the modern critics of Avicenna, remain open questions; see Muhlethaler 2009 for full discussion). Ibn Kammūna boldly claims to have formulated the first demonstrative proof for the soul’s eternity a parte ante. Indeed, for Ibn Kammūna the soul is really an intellect (*‘aql*) that is called “soul” when it is associated with a particular body (Muehlethaler 2012)[^muehlethaler-2012].
    step1: |-
      然而，在灵魂先存这一关键问题上，伊本·凯姆那与阿维森纳以及主流哲学传统分道扬镳。阿维森纳否认灵魂在人出生之前存在，但伊本·凯姆那认为，灵魂的先存与其非物质性密切相连，而且这是为了证明灵魂在身体死亡后存续而必须接受的一条学说。事实上，正如 Lukas Muehlethaler 在一系列论著中所表明的，伊本·凯姆那始终致力于为心理学说的论证提供支撑。在他对阿维森纳《指点书》（“Pointers”）的注疏中——该处展示了“飞人”思想实验——伊本·凯姆那把阿维森纳的言辞论证改写成三段论形式。（该三段论是否有效，以及一般而言伊本·凯姆那在回应阿维森纳的现代批评者方面究竟有多成功，仍是未决问题；详尽讨论见 Muhlethaler 2009。）伊本·凯姆那大胆宣称，他首次为灵魂的无始永恒（a parte ante）提出了证明性的论证。事实上，对伊本·凯姆那而言，灵魂实在是理智（*‘aql*），当它与某一特定身体相关联时就被称为“灵魂”（Muehlethaler 2012）[^muehlethaler-2012]。
    step2: |-
      然而，在灵魂是否先于身体而存在这一关键问题上，伊本·凯姆那与阿维森纳及主流哲学传统分道扬镳。阿维森纳否认灵魂在人出生之前就已存在；伊本·凯姆那则主张，灵魂的先在与它的非物质性密不可分，而且必须接受这一学说，才能证明灵魂在身体死亡之后仍然存续。诚如 Lukas Muehlethaler 在一系列论著中所显示的，伊本·凯姆那始终在用力加固心理学说的论证。在他为阿维森纳《指点书》（*al-Ishārāt*）所作的注疏中——“飞人”思想实验即见于该书——他把阿维森纳的言辞论证改写为三段论形式。（该三段论是否真能成立，以及总体而言伊本·凯姆那回应阿维森纳现代批评者的成效如何，仍是悬而未决的问题；详见 Muhlethaler 2009。）伊本·凯姆那大胆声称，自己首次给出了灵魂无始永恒（a parte ante）的证明。确实，在伊本·凯姆那看来，灵魂其实正是理智（*ʿaql*），只是当它与某一特定身体相联系时，才被称为“灵魂”（Muehlethaler 2012）[^muehlethaler-2012]。
