      ## 2 著作
  - id: 8
    kind: body
    source: |-
      The latest studies on Ibn Kammūna have focused mainly on his psychology; his writings and doctrines in that field will be discussed below. Judging in terms of its impact on modern scholarship, especially when one moves beyond the rather narrow confines of specialists in late medieval Jewish and Islamic philosophy, as well its impact upon his own personal life, Ibn Kammūna’s *Tanqīḥ* (*Examination of the Three Faiths*, English translation by Perlmann) is his most important work. The fundamental premise of the treatise, and one that informs other of his writings as well, is that there is a single theory of prophecy that is accepted by Jews, Christians, and Muslims alike, and which, moreover, meets the truth standards of philosophy. What remains, then, is to compare the claims that are particular to each of the three faiths. Though the *Examination* should not be classified as a polemical work, as it contains no outright attack on any faith, its pro-Jewish bias is quite evident. Ibn Kammūna constructed the Jewish view he presents by means of a combination of ideas drawn from Maimonides and Judah Halevi. While this seems at first to be an odd mismatch of authorities, Ibn Kammūna was not the only Jewish thinker to harmonize the two eminent Andalusians. Christians and Muslims rejected the way their tenets were presented, and representatives of both penned rebuttals (Pourjavady & Schmidtke 2006, 106–113)[^pourjavady-2006]. On the other hand, no Jewish reaction of any sort to the *Examination* has reached us. It should be added that neither in the *Examination*, nor in any other work, does Ibn Kammūna make any unambiguous reference to Buddhism; given the political realities of Mongol rule (the Mongols had not yet converted to Islam) as well as Ibn Kammūna’s broad interests, one might have expected him to exhibit some curiosity.
    step1: |-
      关于伊本·凯姆那的最新研究主要集中于他的心理学；他在该领域的著作与学说将在下文讨论。就其对现代学术的影响——尤其是当我们越出晚期中世纪犹太与伊斯兰哲学专家的狭窄圈子时——以及对其个人生活的影响而言，伊本·凯姆那的 *Tanqīḥ*（*Examination of the Three Faiths*，Perlmann 英译）是他最重要的著作。该论著的基本前提，同时也是贯穿他其他著作的前提，是：存在一种为犹太人、基督徒与穆斯林共同接受的预言理论，而且它还符合哲学的真理标准。于是，剩下的工作就是比较三种信仰各自特有的主张。虽然 *Examination* 不应被归为论战性著作，因为它并未对任何信仰作直截了当的攻击，但其亲犹太的偏向相当明显。伊本·凯姆那通过结合取自迈蒙尼德与犹大·哈列维的观念，构造了他所呈现的犹太观点。虽然这初看像是权威的奇特错配，但伊本·凯姆那并不是唯一调和这两位杰出安达卢西亚人的犹太思想家。基督徒与穆斯林都拒绝接受其教义被呈现的方式，双方的代言人都撰写了反驳（Pourjavady & Schmidtke 2006, 106–113）[^pourjavady-2006]。另一方面，我们没有收到任何犹太人对 *Examination* 的反应。还应补充的是，无论在 *Examination* 还是在任何其他著作中，伊本·凯姆那都未对佛教作任何明确提及；鉴于蒙古统治的政治现实（蒙古人当时尚未皈依伊斯兰教）以及伊本·凯姆那广泛的兴趣，人们或许会期待他表现出某种好奇心。
    step2: |-
      晚近关于伊本·凯姆那的研究主要着眼其心理学，他在这一领域的著作与学说详见下文。若论对现代学术的影响——尤其当我们越出晚期中世纪犹太与伊斯兰哲学专家那个狭窄圈子时——以及对他人生的影响，则伊本·凯姆那最重要的著作当推《审查》（*Tanqīḥ*；英译本题作 *Examination of the Three Faiths*，Perlmann 译）。此书的基本前提，也是贯穿他其他著作的前提，是：有一种先知理论，犹太人、基督徒与穆斯林都接受，而且符合哲学的真理标准。剩下的工作，只是比较三种信仰各自特有的主张。尽管《审查》不应算作论战之作——它并未对任何信仰正面攻击——其亲犹太的偏向却相当明显。伊本·凯姆那呈现的犹太观点，糅合了迈蒙尼德与犹大·哈列维的观念。这初看像是把两位不相干的权威硬凑在一起，但调和这两位杰出安达卢西亚人的犹太思想家，并不止他一位。基督徒与穆斯林都拒不接受其教义的那种呈现方式，双方且各有代言人撰文反驳（Pourjavady & Schmidtke 2006, 106–113）[^pourjavady-2006]。反过来，犹太人对《审查》的任何反应，都未传到我们手中。还应补一句：无论在《审查》还是别的著作中，伊本·凯姆那都未曾明确提及佛教；考虑到蒙古统治的政治现实（蒙古人其时尚未归信伊斯兰教），再考虑到他兴趣之广，人们本会指望他对此有所好奇。
