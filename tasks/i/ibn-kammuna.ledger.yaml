      Humans exhibit the full range of endowments, from the dull witted who never intuit, to those who are able to satisfy all or nearly all of their quests by means of intuition. The variation is seen both in the quantity of percepts that are obtained intuitively as well as in the speed of intuitive act. (Nonetheless, it should be added that Ibn Kammūna places the limit at “the quickest and shortest instant”; unlike Ibn Sina, for example, he does not claim here that intuition takes no time at all.) It is certainly possible that, at the upper bounds of human capacity, one may find an individual blessed with “an intense purity and an intense connection to the supernal sources” such that he can intuit all or most of what humans are capable of knowing, “not by means of an uncertain tradition, but by means of middle terms and demonstrative proofs.” *Ḥads* accounts not only for the quickness and independence of the prophet’s knowledge, but for its certainty as well. It meets the requirements of formal logic, since it supplies the middle term of the syllogism, and hence is demonstrative.
    step1: |-
      人类展现出禀赋的整个范围，从从不直觉的愚钝者，到能够凭直觉满足全部或几乎全部探究的人。这种差异既见于凭直觉获得的知觉数量，也见于直觉活动的速度。（不过应当补充，伊本·凯姆那把限度定在“最快最短的瞬间”；例如，与伊本·西那不同，他在这里并未主张直觉完全不费时间。）确实可能的是，在人类能力的上限处，人们会发现某位蒙受“强烈的纯净与与超验来源的强烈联系”的个人，以致他能直觉到人类所能知的全部或大部分事物，“不是凭借不确定的传统，而是凭借中项与证明性论证”。*Ḥads* 不仅解释了先知知识的迅捷与独立，也解释了它的确定性。它满足形式逻辑的要求，因为它提供三段论的中项，从而是证明性的。
