      A number of “problems” (*shubuhāt*; the Arabic refers to all forms of obscurities, including what we call paradoxes and sophistries) are attributed to Ibn Kammūna. These have challenged Iranian philosophers in particular from the sixteenth century onwards (Pourjavady & Schmidtke 2006, 37–51)[^pourjavady-2006]. Some but not all can be traced to known writings of Ibn Kammūna. One of these is the famous liar paradox, which Ibn Kammūna discusses in *The New Wisdom*; some later figures mistakenly thought that Ibn Kammūna had invented it. Another, much discussed item is “the problem of unity” (*shubhat al-tawḥīd*). Especially since Ibn Sina, the deity was widely identified with *wājib al-wujūd*, “that whose existence is necessary”; but, as a philosophical category, is “necessary existence” necessarily unique? Muslim and Jewish thinkers would certainly want it to be so, but proving this point was no simple matter. At one place Ibn Kammūna argues from the interconnectedness of all reality, which implies that a single “necessary existence” must stand at the top of the causal chain. He may have picked this up from Maimonides who noted in his *Guide of the Perplexed* (Part I, Ch. 72) that the unity of reality is an important indication for the unity of God. Elsewhere, however, he chose a more torturous route. Were there more than one “necessary existence”, then, rather than being a unique essential characteristic, “necessary existence” would perforce be demoted to the rank of an accident shared by two or more beings. It was this proposal that was debated and criticized by later thinkers.
    step1: |-
      若干“问题”（*shubuhāt*；阿拉伯语指一切形式的晦暗不明，包括我们所谓的悖论与诡辩）被归于伊本·凯姆那。这些问题尤其从十六世纪起一直挑战着伊朗哲学家（Pourjavady & Schmidtke 2006, 37–51）[^pourjavady-2006]。其中有些可以追溯到伊本·凯姆那已知的著作，但并非全部。其中之一是著名的说谎者悖论，伊本·凯姆那在《新智慧》中讨论了它；后来某些人物误以为这是伊本·凯姆那发明的。另一个讨论甚多的问题是“统一性问题”（*shubhat al-tawḥīd*）。尤其是自伊本·西那以来，神被广泛等同于 *wājib al-wujūd*，即“其存在为必然者”；但作为一个哲学范畴，“必然存在”必然独一无二吗？穆斯林与犹太思想家当然希望如此，但证明这一点绝非易事。在一处，伊本·凯姆那从一切实在的相互关联出发论证，这蕴含单一的“必然存在”必须处于因果链的顶端。他可能是从迈蒙尼德那里学来的；迈蒙尼德在《迷途指津》（第一部分第 72 章）中指出，实在的统一是神之统一的重要标志。然而在别处，他选择了一条更迂曲的路。如果“必然存在”不止一个，那么“必然存在”就不成其为独特的本质特征，而势必要降格为两个或多个存在者共有的偶性。正是这一提法受到后世思想家的辩论与批评。
    step2: |-
      有一批“疑难”（*shubuhāt*；阿拉伯语泛指种种晦暗不明之事，包括我们所谓的悖论与诡辩）被归到伊本·凯姆那名下。自十六世纪以降，这些问题尤其困扰着伊朗的哲学家（Pourjavady & Schmidtke 2006, 37–51）[^pourjavady-2006]。其中有几项可溯至伊本·凯姆那已知的著作，但并非全部。一项是著名的说谎者悖论，伊本·凯姆那在《新智慧》中讨论过；后世某些人误以为这是他的发明。另一项讨论甚多的是“统一性疑难”（*shubhat al-tawḥīd*）。尤其是自伊本·西那以来，神被广泛等同于 *wājib al-wujūd*，即“其存在为必然者”；然而作为一个哲学范畴，“必然存在”是否必然独一无二？穆斯林与犹太思想家当然希望如此，但此事证明起来绝非易事。有一处，伊本·凯姆那从万有的相互关联立论，由此推出：必有一单独的“必然存在”居于因果链之顶端。此说或得自迈蒙尼德——《迷途指津》（第一部分第 72 章）曾指出，万有之统一是神之统一的重要徵示。然而在别处，他走了一条更迂曲的路：倘若“必然存在”不止一个，那么它便不再是独特的本质属性，而势将降格为两个或多个存在者共有的偶性。正是这一提法，招来后世思想家的争论与批评。
