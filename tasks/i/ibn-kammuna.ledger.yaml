      The last example is particularly important because it illustrates the intimate connection between *ḥads* and *tajriba*, a connection maintained by Ibn Kammūna (and others) throughout. *Tajriba* is the most usual justification for the knowledge claimed by astrologers and alchemists. Hence both *ḥads* and *tajriba* aim to function as sources for hidden knowledge within scientific systems that are based upon (ultimately) Aristotelian logic. Although it is repeatedly invoked as the source for scientific knowledge, *ḥads* is not a tool of scientific inquiry, but rather a way of explaining, *post facto*, how a thinker hit upon the solution to a difficult problem. As such its function in science is very much the same as its function in explaining religious inspiration and prophecy.
    step1: |-
      最后一个例子特别重要，因为它说明了 *ḥads* 与 *tajriba* 之间的密切联系，伊本·凯姆那（以及其他人）始终维持这一联系。*Tajriba* 是占星家与炼金术士所主张的知识最常见的辩护。因此，*ḥads* 与 *tajriba* 都力图在以（归根结底）亚里士多德逻辑为基础的科学体系内充当隐秘知识的来源。尽管 *ḥads* 一再被援引为科学知识的来源，它却不是科学探究的工具，而是一种事后解释思想家如何碰上一个困难问题之解决办法的方式。就此而言，它在科学中的功能与它在解释宗教灵感与预言时的功能非常相似。
    step2: |-
      末一例尤其要紧，因为它显出 *ḥads* 与 *tajriba* 之间的紧密关联，而这层关联在伊本·凯姆那（及他人）那里贯穿始终。*Tajriba* 是占星家与炼金术士为所主张的知识提供的最常见理据。于是，*ḥads* 与 *tajriba* 都想在以（归根结底）亚里士多德逻辑为基础的科学体系之内，充当隐秘知识的来源。虽然 *ḥads* 屡屡被援引为科学知识的来源，它却并非科学探究的工具，而是一种事后说明：一位思想家如何碰巧找到了难题的答案。就此而论，它在科学中的作用，与它在解释宗教灵感与预言时的作用极其相似。
