      > As for their [prophets’] perfection, it is due to the perfection of their speculative intellect, and for this reason. The middle term, by means of which one succeeds in acquiring intelligibles that were [hitherto] unknown, is at times obtained by means of *ḥads*, at others by means of instruction. However, *ḥads* is the basis of instruction. Things thus trace back without a doubt to intuitions which the masters [of intuition] arrived at. They then conveyed them to students. However, it is possible for someone to have an intuition on his own; the reasoning gels in his mind without a teacher. [Perlmann (ed.) 1971, p. 12; translation by the author]
