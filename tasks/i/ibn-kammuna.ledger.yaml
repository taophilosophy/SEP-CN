      Ibn Kammūna’s writings as a rule deal exclusively with speculative matters. Two recently published treatises, however, give equal weight to praxis, in line with the pairing of *‘ilm* and *’amal* (knowledge and practice) that appears in the title of the longer work; this pairing was widespread among Sufis but by no means limited to them alone. Ibn Kammūna usually identifies the reader of these tracts as an *‘āqil*, literally someone who employs his intellect; this too is quite common. Other expressions he uses to describe his audience are “seeker of perfection” and “seeker of salvation (*najat*) and perfection.”
