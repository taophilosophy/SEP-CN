      Information technologies have not been content to remain confined to virtual worlds and software implementations. These technologies are also interacting directly with us through robotics applications. Robotics is an emerging technology but it has already produced a number of applications that have important moral implications. Technologies such as military robotics, medical robotics, personal robotics, and the world of sex robots are just some of the already existent uses of robotics that impact on and express our moral commitments (see, Anderson and Anderson 2011; Capurro and Nagenborg 2009; Lin et al. 2012, 2017)[^anderson-2011][^capurro-2009][^lin-2012].
    step1: |-
      信息技术并不甘于困守虚拟世界与软件实现。这些技术还在通过机器人技术的应用与我们直接互动。机器人技术方兴未艾，但已经催生了一批具有重大道德意涵的应用。军用机器人、医疗机器人、个人机器人，以及性机器人世界，只是机器人技术已然存在的若干用途——它们冲击并表达着我们的道德承诺（见 Anderson and Anderson 2011; Capurro and Nagenborg 2009; Lin 等 2012, 2017）[^anderson-2011][^capurro-2009][^lin-2012]。

    step2: |-
      信息技术并不甘心困在虚拟世界与软件实现里，它们还借机器人技术的应用同我们直接打交道。机器人技术虽属新兴，却已催生一批道德意涵重大的应用。军用机器人、医疗机器人、个人机器人，乃至性机器人的世界——这些已然存在的用途，正冲击并表达着我们的道德承诺（见 Anderson and Anderson 2011; Capurro and Nagenborg 2009; Lin 等 2012, 2017）[^anderson-2011][^capurro-2009][^lin-2012]。

