      ### 4.2 Information Technology as a Moral System
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Early in the twentieth century, the American philosopher John Dewey (see entry on John Dewey) proposed a theory of inquiry based on the instrumental uses of technology. Dewey had an expansive definition of technology which included not only common tools and machines but also information systems such as logic, laws, and even language as well (Hickman 1990)[^hickman-1990]. Dewey argued that we are in a ‘transactional’ relationship with all of these technologies within which we discover and construct our world (Hickman 1990)[^hickman-1990]. This is a helpful standpoint to take as it allows us to advance the idea that information technology of morality and ethics is not impossible. As well as allowing us to take seriously the idea that the relations and transactions between human agents and those that exist between humans and their artifacts have important ontological similarities. While Dewey could only dimly perceive the coming revolutions in information technologies, his theory is useful to us still because he proposed that ethics was not only a theory but a practice and solving problems in ethics is like solving problems in algebra (Hickman 1990)[^hickman-1990]. If he is right, then an interesting possibility arises, namely the possibility that ethics and morality are computable problems and therefore it should be possible to create an information technology that can embody moral systems of thought.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      In 1974 the philosopher Mario Bunge proposed that we take the notion of ‘technoethics’ seriously arguing that moral philosophers should emulate the way engineers approach a problem. Engineers do not argue in terms of reasoning by categorical imperatives but instead they use:
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      > … the forms If *A* produces *B*, and you value *B*, chose to do *A*, and If *A* produces *B* and *C* produces *D*, and you prefer *B* to *D*, choose *A* rather than *C*. In short, the rules he comes up with are based on fact and value, I submit that this is the way moral rules ought to be fashioned, namely as rules of conduct deriving from scientific statements and value judgments. In short ethics could be conceived as a branch of technology. (Bunge 1977, 103)[^bunge-1977]
    step1: TBD
