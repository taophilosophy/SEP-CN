      This conflict in values has been debated by philosophers. While many of the hackers interviewed by Levy argue that hacking is not as dangerous as it seems and that it is mostly about gaining access to hidden knowledge of how information technology systems work, Eugene Spafford counters that no computer break-in is entirely harmless and that the harm precludes the possibility of ethical hacking except in the most extreme cases (Spafford 2007)[^spafford-2007]. Kenneth Himma largely agrees that the activity of computer hacking is unethical but that politically motivated hacking or “Hacktivism” may have some moral justification, though he is hesitant to give his complete endorsement of the practice due to the largely anonymous nature of the speech entailed by the hacktivist protests (Himma 2007b)[^himma-2007b]. Mark Manion and Abby Goodrum agree that hacktivism could be a special case of ethical hacking but warn that it should proceed in accordance with the moral norms set by the acts of civil disobedience that marked the twentieth century or risk being classified as online terrorism (Manion and Goodrum 2007)[^manion-2007].
    step1: |-
      这种价值冲突哲学家们已有辩论。利维访谈的许多黑客辩称，黑客行为并不像看上去那样危险，它主要是为了获取关于信息技术系统如何运作的隐秘知识；尤金·斯帕福德（Eugene Spafford）则反驳说，没有任何一次计算机入侵是完全无害的，这种危害排除了伦理黑客的可能性，除非处于最极端的情形（Spafford 2007）[^spafford-2007]。肯尼斯·希马（Kenneth Himma）大体同意计算机黑客行为不合伦理，但认为有政治动机的黑客行为或“黑客行动主义”（Hacktivism）或许有几分道德正当性；不过由于黑客行动主义抗议所涉言论大多匿名，他对完全背书这种做法持保留态度（Himma 2007b）[^himma-2007b]。马克·马尼翁（Mark Manion）与艾比·古德鲁姆（Abby Goodrum）同意黑客行动主义可以是伦理黑客行为的一种特例，但警告说，它应当循着二十世纪那些标志性的公民不服从行动所确立的道德规范行事，否则就有被归类为网络恐怖主义之虞（Manion and Goodrum 2007）[^manion-2007]。

    step2: |-
      这场价值之争，哲学家们已有交锋。利维访谈过的许多黑客辩称：黑客行为远不像看上去那么危险，多半只是想弄到信息技术系统运作方式的隐秘知识。尤金·斯帕福德（Eugene Spafford）则针锋相对：天下没有完全无害的计算机入侵；其危害足以排除“伦理黑客”的可能，除非在最极端的情形（Spafford 2007）[^spafford-2007]。肯尼斯·希马（Kenneth Himma）大体赞同计算机黑客行为不合伦理，但认为怀有政治动机的黑客行为，即“黑客行动主义”（Hacktivism），或许有几分道德依据；不过黑客抗议所涉言论大多匿名，他因此不肯完全背书这种实践（Himma 2007b）[^himma-2007b]。马克·马尼翁（Mark Manion）与艾比·古德鲁姆（Abby Goodrum）承认黑客行动主义可算伦理黑客的特例，同时警告：它必须循着二十世纪公民不服从行动树立的道德规范行事，否则便有被划为网络恐怖主义之虞（Manion and Goodrum 2007）[^manion-2007]。

