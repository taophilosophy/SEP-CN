      Early in the information technology revolution Richard Mason suggested that the coming changes in information technologies, such as their roles in education and economic impacts, would necessitate rethinking the social contract (Mason 1986)[^mason-1986]. He worried that they would challenge privacy, accuracy, property and accessibility (PAPA) and to protect our society we “… must formulate a new social contract, one that insures everyone the right to fulfill his or her own human potential” (Mason 1986 P. 11)[^mason-1986] What he could not have known then was how often we would have to update the social contract as these technologies rapidly change. Information technologies change quickly and move in and out of fashion at a bewildering pace. This makes it difficult to try to list them all and catalog the moral impacts of each. The very fact that this change is so rapid and momentous has caused some to argue that we need to deeply question the ethics of the process of developing emerging technologies (Moor 2008). It has also been argued that the ever morphing nature of information technology is changing our ability to even fully understand moral values as they change. Lorenzo Magnani claims that acquiring knowledge of how that change confounds our ability to reason morally “…has become a duty in our technological world” (Magnani 2007, 93)[^magnani-2007]. The legal theorist Larry Lessig warns that the pace of change in information technology is so rapid that it leaves the slow and deliberative process of law and political policy behind and in effect these technologies become lawless, or extralegal. This is due to the fact that by the time a law is written to curtail, for instance, some form of copyright infringement facilitated by a particular file sharing technology, that technology has become out of date and users are on to something else that facilitates even more copyright infringement (Lessig 1999)[^lessig-1999]. But even given this rapid pace of change, it remains the case that information technologies or applications can all be categorized into at least three different types – each of which we will look at below.
    step1: |-
      在信息技术革命的早期，理查德·梅森（Richard Mason）就提出，信息技术的即将到来的变化，例如它们在教育中的作用和经济影响，将不得不促使我们重新思考社会契约（Mason 1986）[^mason-1986]。他担心这些变化会挑战隐私、准确性、财产和可及性（PAPA），为了保护我们的社会，我们“……必须制定一个新的社会契约，确保每个人都拥有实现自身人类潜能的权利”（Mason 1986 P. 11）[^mason-1986]。他当时无法知道的是，随着这些技术的快速变化，我们将不得不多么频繁地更新社会契约。信息技术变化迅速，以令人眼花缭乱的速度忽而流行忽而过时。这使得我们很难把它们一一列举并逐一编目其道德影响。这一变化如此迅速且意义重大，这一事实本身已使一些人主张，我们需要深刻追问开发新兴技术这一过程的伦理（Moor 2008）。也有人论证，信息技术不断变形的本性正在改变我们全面理解道德价值的能力，因为道德价值也在变化。洛伦佐·马尼亚尼（Lorenzo Magnani）主张，了解这种变化如何扰乱我们的道德推理能力，“……在我们这个技术世界里已成为一项义务”（Magnani 2007, 93）[^magnani-2007]。法学理论家拉里·莱西格（Larry Lessig）警告说，信息技术变化的速度如此之快，以至于把缓慢而深思熟虑的法律和政治政策制定过程甩在身后，这些技术实际上变得无法无天，或者说处于法律之外。原因在于：等到一部法律写成，用来遏制例如某种由特定文件共享技术促成的版权侵犯时，那项技术已经过时，用户又转向了别的东西，促成更多的版权侵犯（Lessig 1999）[^lessig-1999]。但即便变化如此迅速，信息技术或应用仍然可以归入至少三种不同的类型——下文将逐一讨论。

    step2: |-
      信息技术革命初期，理查德·梅森（Richard Mason）便提出：信息技术即将发生的变化——比如它们在教育中的角色与对经济的冲击——将迫使人们重新思考社会契约（Mason 1986）[^mason-1986]。他担心这些变化会冲击隐私、准确性、财产与可及性（PAPA）；为护佑社会，我们“……必须制定一个新的社会契约，确保每个人都享有实现自身人类潜能的权利”（Mason 1986 P. 11）[^mason-1986]。他当时无从知晓的是：随着技术疾变，社会契约将要经历多少次更新。信息技术迭代迅速，忽而风靡、忽而过时，令人目不暇给，要把它一一列举、逐一清点各自的道德影响，殊为不易。变化既如此迅猛而重大，有人据此主张：对开发新兴技术这一过程本身的伦理，我们必须深究（Moor 2008）。也有人论证，信息技术那不断变形的本性，正在改变我们能否充分理解道德价值——因为价值本身也在流变。洛伦佐·马尼亚尼（Lorenzo Magnani）声称，弄清这种变化如何搅乱我们的道德推理能力，“……在我们这个技术世界里已成为一项义务”（Magnani 2007, 93）[^magnani-2007]。法学理论家拉里·莱西格（Larry Lessig）警告：信息技术变化之快，把迟缓而讲究审慎的法律与政策制定进程甩在身后，这些技术在实效上便成了“法外之物”。道理很简单：等到一部法律写成，去遏制比如某种由特定文件共享技术助长的侵权行为时，那项技术早已过时，用户早已转向别的工具，促成更多的侵权（Lessig 1999）[^lessig-1999]。但纵有这般疾速变化，信息技术或应用终归可以归入至少三种不同的类型——下文将逐一考察。

