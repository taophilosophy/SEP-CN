      A description of the test and its implications to philosophy outside of moral values can be found here (see entry on the Turing test). Turing’s prediction may have been overly ambitious and some have argued that we are nowhere near the completion of Turing’s dream. For example, Luciano Floridi (2011a) argues that while AI has been very successful as a means of augmenting our own intelligence, but as a branch of cognitive science interested in intelligence production, AI has been a dismal disappointment. The opposite opinion has also been argued and some claim that the Turing Test has already been passed or at least that programmers are on the verge of doing so. For instance, it was reported by the BBC in 2014 that the Turing Test had been passed by a program that could convince the judges that it was a 13-year-old Ukrainian boy, but even so, many experts remain skeptical (BBC 2014)[^bbc-2014].
    step1: |-
      关于该测试及其在道德价值之外的哲学意涵的说明，可在此找到（参见“图灵测试”词条）。图灵的预测或许过于雄心勃勃，有人论证我们离图灵之梦的完成还很遥远。例如，卢西亚诺·弗洛里迪（Luciano Floridi）（2011a）论证，AI 作为增强我们自身智能的手段非常成功，但作为关心智能生产的认知科学的一个分支，AI 一直令人大失所望。相反的意见也有人主张，有人宣称图灵测试已被通过，或至少程序员们已接近成功。例如，BBC 在 2014 年报道，一个程序已通过图灵测试——它能让评委相信自己是 13 岁的乌克兰男孩；即便如此，许多专家仍持怀疑态度（BBC 2014）[^bbc-2014]。

    step2: |-
      这项测试及其在道德价值之外的哲学蕴涵，另有专述（参见“图灵测试”词条）。图灵的预言或许野心过大：有人论证，图灵之梦离完成还远得很。例如卢西亚诺·弗洛里迪（Luciano Floridi）（2011a）便论证：AI 作为增强我们自身智能的手段相当成功；可作为认知科学里关心“造出智能”的一支，AI 的成绩单却惨不忍睹。反面意见同样有人持守，甚至有人说图灵测试早已被通过，或至少程序员们眼看就要成功。比如 BBC 2014 年报道：一个程序已通过图灵测试——它让评委们信了它是 13 岁的乌克兰男孩；纵然如此，许多专家依旧存疑（BBC 2014）[^bbc-2014]。

