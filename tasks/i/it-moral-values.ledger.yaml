      The difficulty in obtaining complete digital security rests on the fact that the moral value of security can be in conflict with the moral values of sharing and openness, and it is these later values that guided many of the early builders of information technology. Steven Levy (1984) describes in his book, “Hackers: Heroes of the Computer Revolution,” a kind of “Hacker ethic,” that includes the idea that computers should be freely accessible and decentralized in order to facilitate “world improvement” and further social justice (Levy 1984; see also Markoff 2005)[^levy-1984][^markoff-2005]. So it seems that information technology has a strong dissonance created in the competing values of security and openness that is worked right into the design of these technologies and this is all based on the competing moral values held by the various people who designed the technologies themselves.
    step1: |-
      完全的数字安全之所以难以获得，原因在于安全这一道德价值可能与共享和开放这些道德价值相冲突，而后一类价值正是指引许多信息技术早期建造者的价值。史蒂文·利维（Steven Levy）（1984）在其《黑客：计算机革命的英雄》（Hackers: Heroes of the Computer Revolution）一书中描述了一种“黑客伦理”，其中包括这样的理念：计算机应当可以自由访问并且去中心化，以促成“世界改良”并推进社会正义（Levy 1984；另见 Markoff 2005）[^levy-1984][^markoff-2005]。如此看来，信息技术内部存在一种强烈的不和谐音：安全与开放两种价值互相竞争，而这恰恰被铸进了这些技术的设计之中——这一切的根源，是设计技术本身的各种人所持的相互竞争的道德价值。

    step2: |-
      想要滴水不漏的数字安全，难就难在这里：安全这一道德价值，可能与共享、开放的价值相互冲突，而后者恰恰是许多信息技术早期建造者的指路明灯。史蒂文·利维（Steven Levy）（1984）在《黑客：计算机革命的英雄》（Hackers: Heroes of the Computer Revolution）一书中刻画了一种“黑客伦理”，其要义包括：计算机应当自由开放、去中心化，以促成“世界改良”、推进社会正义（Levy 1984；另见 Markoff 2005）[^levy-1984][^markoff-2005]。如此看来，信息技术内里藏着一道强烈的不和谐音：安全与开放两值相争，而这道裂隙干脆被浇铸进了技术设计本身——追根溯源，这正是技术设计者们各持己见的道德价值互相较劲的结果。

