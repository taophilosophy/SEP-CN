      A very similar value split plays out in other areas as well, particularly in the field of intellectual property rights (see entry on intellectual property/) and pornography and censorship (see entry on pornography and censorship). What information technology adds to these long standing moral debates is the nearly effortless access to information that others might want to control such as intellectual property, dangerous information and pornography (Floridi 1999)[^floridi-1999][^floridi-1999-2], as well as providing technological anonymity for both the user and those providing access to the information in question (Nissenbaum 1999; Sullins 2010)[^nissenbaum-1999][^sullins-2010]. For example, even though cases of bullying and stalking occur regularly, the anonymous and remote actions of cyber-bullying and cyberstalking make these behaviors much easier and the perpetrator less likely to be caught. Given that information technologies can make these unethical behaviors more likely, then it can be argued that the design of cyberspace itself tacitly promotes unethical behavior (Adams 2002; Grodzinsky and Tavani 2002)[^adam-2002][^grodzinsky-2002]. Since the very design capabilities of information technology influence the lives of their users, the moral commitments of the designers of these technologies may dictate the course society will take and our commitments to certain moral values will then be determined by technologists (Brey 2010; Bynum 2000; Ess 2009; Johnson 1985; Magnani 2007; Moor 1985; Spinello 2001; Sullins 2010)[^brey-2010][^bynum-2000][^ess-2009][^johnson-1985][^magnani-2007][^moor-1985][^spinello-2001][^sullins-2010].
    step1: |-
      极其类似的价值分裂也出现在其他领域，尤其是知识产权（参见“知识产权”词条）与色情和审查（参见“色情与审查”词条）的领域。信息技术给这些由来已久的道德辩论添上的是：对他人可能想控制的信息——知识产权、危险信息与色情内容——几乎毫不费力的获取（Floridi 1999）[^floridi-1999][^floridi-1999-2]，以及为用户和提供信息获取渠道者双方提供的技术匿名性（Nissenbaum 1999; Sullins 2010）[^nissenbaum-1999][^sullins-2010]。例如，欺凌与跟踪的案例时有发生，而网络欺凌与网络跟踪的匿名和远程特性使这些行为容易得多，行为人也更难被抓到。既然信息技术会使这类不道德行为更容易发生，那就可以论证：网络空间本身的设计在不知不觉中助长了不道德行为（Adams 2002; Grodzinsky and Tavani 2002）[^adam-2002][^grodzinsky-2002]。信息技术的种种设计能力既然影响着用户的生活，这些技术设计者的道德承诺便可能左右社会将走的道路，我们对某些道德价值的承诺到头来将由技术专家来决定（Brey 2010; Bynum 2000; Ess 2009; Johnson 1985; Magnani 2007; Moor 1985; Spinello 2001; Sullins 2010）[^brey-2010][^bynum-2000][^ess-2009][^johnson-1985][^magnani-2007][^moor-1985][^spinello-2001][^sullins-2010]。

    step2: |-
      类似的价值裂隙同样出现在其他领域，最突出的是知识产权（参见“知识产权”词条）与色情和审查（参见“色情与审查”词条）。信息技术给这些由来已久的道德论辩添了两样东西：其一，对他人或想控制的信息——知识产权、危险信息、色情内容——近于毫不费力的获取（Floridi 1999）[^floridi-1999][^floridi-1999-2]；其二，给用户与信息提供者双方罩上一层技术匿名（Nissenbaum 1999; Sullins 2010）[^nissenbaum-1999][^sullins-2010]。欺凌与跟踪本就时有发生，而网络欺凌、网络跟踪凭其匿名与远程，让这类行为愈发轻易、行为人愈发难落法网。信息技术既能让这类不德之行更容易得手，便有理由说：网络空间自身的设计就在默默纵容不道德行为（Adams 2002; Grodzinsky and Tavani 2002）[^adam-2002][^grodzinsky-2002]。信息技术的设计能力既如此渗入用户的生活，设计者的道德承诺便可能圈定社会的走向——我们对某些道德价值的承诺，到头来竟要由技术专家拍板（Brey 2010; Bynum 2000; Ess 2009; Johnson 1985; Magnani 2007; Moor 1985; Spinello 2001; Sullins 2010）[^brey-2010][^bynum-2000][^ess-2009][^johnson-1985][^magnani-2007][^moor-1985][^spinello-2001][^sullins-2010]。

