      There is a counterargument to this. Herman Tavani and James Moor (2004) argue that in some cases giving the user more control over their information may result in greater loss of privacy. Their primary argument is that no one can actually control all of the information about oneself that is produced every day by our activities. If we focus only on the fraction of it that we can control, we lose sight of the vast mountains of data we cannot (Tavani and Moor, 2004). Tavani and Moor argue that privacy must be recognized by the third parties that do control your information and only if those parties have a commitment to protecting user privacy, will we acquire any privacy worth having. Towards this end, they suggest that we think in terms of restricted access to information rather than strict personal control of information (ibid).
    step1: |-
      对此存在一个反驳。赫尔曼·塔瓦尼（Herman Tavani）与詹姆斯·穆尔（James Moor）（2004）论证说，在某些情况下，给用户对其信息更多的控制反而可能导致更大的隐私损失。他们的主要论据是：没有人真能控制我们日常活动所产生的关于自身的一切信息。如果我们只盯着自己能控制的那一小部分，就看不见我们无法控制的茫茫数据大山（Tavani and Moor, 2004）。塔瓦尼与穆尔论证说，隐私必须由真正掌控你信息的第三方来承认；只有当这些第三方承诺保护用户隐私，我们才能获得任何值得拥有的隐私。为此，他们建议我们用“限制对信息的获取”而非“对信息的严格个人控制”来思考问题（同上）。

    step2: |-
      对此有一说反驳。赫尔曼·塔瓦尼（Herman Tavani）与詹姆斯·穆尔（James Moor）（2004）论证：某些情形下，让用户对自家信息握有更多控制，反倒会赔上更多隐私。他们的主论据是：无人真能控制我们的日常活动每天制造出的关于自身的一切信息；若只盯住我们能控制的那一小角，便看不见我们控制不了的滔滔数据大山（Tavani and Moor, 2004）。塔瓦尼与穆尔主张：隐私必须由那些实际掌控你信息的第三方来承认——唯有这些当事方真心承诺保护用户隐私，我们才谈得上拥有值得拥有的隐私。为此，他们建议换一个思路想问题：与其苛求对信息的严格个人控制，不如着眼于限制对信息的获取（同上）。

