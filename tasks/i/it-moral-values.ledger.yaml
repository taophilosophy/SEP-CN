  - id: 4
    kind: body
    source: |-
      Information technology is ubiquitous in the lives of people across the globe. These technologies take many forms such as personal computers, smart phones, internet technologies, as well as AI and robotics. In fact, the list is growing constantly and new forms of these technologies are working their way into every aspect of daily life. They all have some form of computation at their core and human users interface with them mostly through applications and other software operating systems. In some cases, such as massive multiplayer online games (see section 3.1.1 below), these technologies are even opening up new ways for humans to interacting with each other. Information technologies are used to record, communicate, synthesize or organize information through the use of computer technologies. Information itself can be understood as any useful data, instructions, or meaningful message content. The word literally means to “give form to” or to shape one’s thoughts. A basic type of information technology might be the proverbial string tied around one’s finger that is used to remind, or inform, someone that they have some specific task to accomplish that day. Here the string stands in for a more complex proposition such as “buy groceries before you come home.” The string itself is not the information, it merely symbolizes the information and therefore this symbol must be correctly interpreted for it to be useful. Which raises the question, what is information itself?
    step1: |-
      信息技术在全球人们的生活中无处不在。这些技术形式多样，如个人电脑、智能手机、互联网技术，以及人工智能和机器人技术。事实上，这个清单在不断增长，这些技术的新形式正在进入日常生活的方方面面。它们的核心都有某种形式的计算，人类用户主要通过应用程序和其他软件操作系统与它们交互。在某些情况下，例如大型多人在线游戏（见下文 3.1.1 节），这些技术甚至为人与人之间的交往开辟了新途径。信息技术被用来通过计算机技术记录、传递、综合或组织信息。信息本身可以被理解为任何有用的数据、指令或有意义的信息内容。这个词的字面意思是“赋予形式”，即塑造一个人的思想。一种基本的信息技术可能是那根系在手指上的老生常谈的细绳，用来提醒或告知某人当天有某项特定任务要完成。在这里，细绳代表一个更复杂的命题，如“回家前先买菜”。细绳本身不是信息，它只是信息的象征，因此必须正确解读这一象征，它才是有用的。这就引出了一个问题：信息本身是什么？

    step2: |-
      信息技术在全球各地人们的生活中无处不在。这类技术形态繁多：个人电脑、智能手机、互联网技术，还有人工智能与机器人技术。这份清单事实上还在不断加长，各种新技术形态正渗入日常生活的每一个方面。它们的核心都是某种形式的计算，人类用户主要通过应用程序和其他软件操作系统与之打交道。在某些情形下——例如大型多人在线游戏（见下文 3.1.1 节）——这类技术甚至为人际交往开辟了新的途径。信息技术借助计算机技术来记录、传递、综合或组织信息。信息本身可以理解为任何有用的数据、指令或有意义的内容。这个词的字面含义是“赋予形式”，即把人的思想加以塑造。一种最基本的信息技术，或许就是老话里说的那根系在指头上的细绳，用来提醒（也就是告知）某人当天有一件特定的事要办。在这里，细绳代表一个更复杂的命题，比如“回家前先买菜”。细绳本身并不是信息，它只是信息的象征；要让这象征有用，就得把它解读对。由此便引出那个问题：信息本身究竟是什么？

  - id: 5
    kind: body
    source: |-
      Unfortunately there is not a completely satisfying and philosophically rigorous definition available, though there are at least two very good starting points. For those troubled by the ontological questions regarding information, we might want to simply focus on the symbols and define information as any meaningfully ordered set of symbols. Mathematicians and engineers prefer to focus on this aspect of information, which is called “syntax” and leave the meaningfulness of information or its “semantics” for others to figure out. Claude E. Shannon working at Bell Labs in the forties produced a landmark mathematical theory of communication (1948). In this work he utilized his experiences in cryptography and telephone technologies to work out a mathematical formulation describing how syntactical information can be turned into a signal that is transmitted in such a way as to mitigate noise or other extraneous signals which can then be decoded by the desired receiver of the message (Shannon 1948; Shannon and Weaver 1949)[^shannon-1948][^shannon-1949]. The concepts described by Shannon, (along with additional important innovations made by others who are too many to list), explain the way that information technology works, but we still have the deeper questions to resolve if we want to thoroughly trace the impact of information technologies on moral values. Some philosophers noted the fact that information technologies had highlighted the distinction between syntax and semantics, and have been vocal critics about the inability of technologies to bridge the gap between the two concepts. Meaning that while information technologies might be adept at manipulating syntax, they would be incapable of ever understanding the semantics, or meanings, of the information upon which they worked.
    step1: |-
      遗憾的是，目前并没有一个完全令人满意且在哲学上严格的定义，不过至少有两个非常好的出发点。对于那些为信息的本体论问题所困扰的人，我们或许可以只关注符号本身，把信息定义为任何有意义的有序符号集合。数学家和工程师倾向于关注信息的这一方面，即所谓“语法”，而把信息的有意义性即“语义”留给别人去解决。克劳德·E. 香农（Claude E. Shannon）四十年代在贝尔实验室工作期间提出了一项具有里程碑意义的数学通信理论（1948）。在这项工作中，他利用自己从事密码学和电话技术的经验，构建了一个数学表述，描述句法信息如何被转换为一种信号，这种信号的传输方式能够减轻噪声或其他无关信号的干扰，并可由信息的预期接收者解码（Shannon 1948; Shannon and Weaver 1949）[^shannon-1948][^shannon-1949]。香农所描述的概念（加上其他许多人做出的重要创新，不胜枚举）解释了信息技术的工作方式，但如果我们要彻底追踪信息技术对道德价值的影响，仍有更深层次的问题需要解决。一些哲学家注意到信息技术凸显了语法与语义之间的区别，并直言批评技术无法弥合两个概念之间的鸿沟。也就是说，信息技术或许擅长处理语法，却永远无法理解它们所处理信息的语义或意义。

    step2: |-
      可惜，至今还没有一个完全令人满意、在哲学上又足够严格的定义，不过至少有两个很好的出发点。那些为信息的本体论问题所苦的人，不妨只盯住符号本身，把信息定义为任何有意义的有序符号集合。数学家与工程师偏爱信息的这一侧面，即所谓“语法”（syntax），至于信息的有意义性——“语义”——则留给他人去琢磨。克劳德·E. 香农（Claude E. Shannon）四十年代在贝尔实验室做出了里程碑式的数学通信理论（1948）。他在该工作中调用自己从事密码学与电话技术的经验，给出一个数学表述：句法信息如何变成一种信号，其传输方式能抑制噪声及其他杂讯，然后由信息的预期接收者解码（Shannon 1948; Shannon and Weaver 1949）[^shannon-1948][^shannon-1949]。香农描述的这些概念（再加上许多他人的重要创新，难以尽列）解释了信息技术的工作原理；但若要彻底追踪信息技术对道德价值的影响，更深的问题仍有待解决。一些哲学家注意到，信息技术凸显了语法与语义之别，并激烈批评技术无力弥合两个概念之间的鸿沟：信息技术纵然长于摆弄语法，也永远理解不了它们所处理的信息的语义，即意义。

  - id: 6
    kind: body
    source: |-
      One famous example can be found in the “Chinese Room Argument” (Searle 1980)[^searle-1980] in which the philosopher John Searle argued that even if one were to build a machine that could take stories written in Chinese as input and then output coherent answers to questions about those stories, it would not prove that the machine itself actually understood what it was doing. The argument rests on the claim that if you replaced the workings of the machine with a person who was not a native Chinese speaker who would then painstakingly follow a set of rules to transform the set of Chinese logograms input into other output symbols. The claim is that that person would not understand the input and also would not know what the system is saying as its output, it is all meaningless symbol manipulation to them. The conclusion is that this admittedly strange system could skillfully use the syntax of the language and story while the person inside would have no ability to understand the semantics, or meaning, of the stories (Searle 1980)[^searle-1980]. Replace the person with electronics and it follows that the electronics also have no understanding of the symbols they are processing. This argument, while provocative is not universally accepted and has lead to decades worth of argument and rebuttal (see the entry on the Chinese room argument).
    step1: |-
      一个著名的例子是“中文屋论证”（Searle 1980）[^searle-1980]，哲学家约翰·塞尔（John Searle）在其中论证说，即使造出一台机器，它能接收中文写成的故事作为输入，然后输出关于这些故事的连贯回答，这也不能证明机器本身真的理解自己在做什么。该论证的依据是：假如把机器的运转换成一个不懂中文的人，让他费力地按照一套规则把输入的中文方块字变换成其他输出符号，那么这个人既不理解输入，也不知道系统输出的内容是什么，对他来说这一切都只是无意义的符号操作。结论是：这个公认怪异的系统能够熟练使用语言和故事的语法，而屋子里的人却没有能力理解故事的语义或意义（Searle 1980）[^searle-1980]。把人换成电子元件，可以推知电子元件同样不理解它们正在处理的符号。这一论证虽然颇具挑衅性，但并未被普遍接受，并引发了数十年的争论与反驳（参见“中文房间论证”词条）。

    step2: |-
      一个著名的例子是“中文房间论证”（Searle 1980）[^searle-1980]。哲学家约翰·塞尔（John Searle）借此论证：哪怕造出一台机器，它能以中文写就的故事为输入，并就故事输出前后连贯的回答，也证明不了机器真的理解自己在做什么。论证系于这样一个主张：把机器的运转换成一个人——他不懂中文，只是辛苦地依照一套规则，把输入的汉字符号变换成别的输出符号——那么这个人既不理解输入，也不明白系统在输出什么；对他而言，一切皆是无意义的符号操作。结论便是：这个公认古怪的系统能熟练运用语言与故事的语法，屋里那人却没有能力领会故事的语义，即意义（Searle 1980）[^searle-1980]。再把人换成电子器件，顺理成章，电子器件同样不理解自己处理的符号。这一论证虽富挑衅性，却未获普遍接受，引来数十年的论战与驳议（参见“中文房间论证”词条）。

  - id: 7
    kind: body
    source: |-
      Information technology has also had a lasting impression on the philosophical study of logic and information. In this field logic is used as a way to understand information as well as using information science as a way to build the foundations of logic itself (see the entry on logic and information).
    step1: |-
      信息技术也给哲学对逻辑与信息的研究留下了持久的印象。在这一领域中，逻辑被用作理解信息的方式，信息科学也被用来构建逻辑本身的基础（参见“逻辑与信息”词条）。

    step2: |-
      信息技术同样给哲学关于逻辑与信息的研究打下了持久的烙印：在这个领域，逻辑既被用来理解信息，信息科学也被用来为逻辑本身奠基（参见“逻辑与信息”词条）。

  - id: 8
    kind: body
    source: |-
      The issues just discussed are fascinating but they are separate arguments that do not necessarily have to be resolved before we can enter a discussion on information technology and moral values. Even purely syntactical machines can still impact many important ethical concerns even if they are completely oblivious to the semantic meaning of the information that they compute.
    step1: |-
      刚才讨论的这些问题很引人入胜，但它们是独立的论证，不必先得到解决，我们才能进入信息技术与道德价值的讨论。即使是纯句法层面的机器，即使完全觉察不到它们所计算信息的语义，也仍然会影响到许多重要的伦理关切。

    step2: |-
      前述问题固然引人入胜，但它们各自独立，无须先行解决，我们就可以转入信息技术与道德价值的讨论。即便一台机器只懂句法、对所处理信息的语义全然无知，它照样会触及许多重要的伦理关切。

