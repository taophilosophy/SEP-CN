      Assuming we are justified in granting access to some store of information that we may be in control of, there is a duty to ensure that that information is truthful, accurate, and useful. A simple experiment will show that information technologies might have some deep problems in this regard. Load several different search engines and then type the same search terms in each of them, each will present different results and some of these searches will vary widely from one another. This shows that each of these services uses a different proprietary algorithm for presenting the user with results from their search. It follows then that not all searches are equal and the truthfulness, accuracy, and usefulness of the results will depend greatly on which search provider you are using and how much user information is shared with this provider. All searches are filtered by various algorithms to ensure that the information the search provider believes is most important to the user is listed first. Since these algorithms are not made public and are closely held trade secrets, users are placing a great deal of trust in this filtering process. The hope is that these filtering decisions are morally justifiable but it is difficult to know. A simple example is found in “clickjacking.” If we are told a link will take us to one location on the web yet when we click it we are taken to some other place, the user may feel that this is a breach of trust. This is often called “clickjacking” and malicious software can clickjack a browser by taking the user to some other site than what is expected; it will usually be rife with other links that pay the clickjacker for bringing traffic to them (Hansen and Grossman, 2008). Again the anonymity and ease of use that information technology provides can facilitate deceitful practices such as clickjacking. Pettit (2009) suggests that this should cause us to reevaluate the role that moral values such as trust and reliance play in a world of information technology. Anonymity and the ability to hide the authors of news reports online have contributed to the rise of “fake news” or propaganda of various sorts posing as legitimate news. This is a significant problem and will be discussed in section (2.2.3) below
    step1: |-
      即便我们有理由准许他人获取我们掌控的某批信息，我们也有责任确保这些信息真实、准确、有用。一个简单的实验就能表明信息技术在这方面可能有深层的毛病。打开几个不同的搜索引擎，输入同样的搜索词，各家给出的结果各不相同，有些甚至大相径庭。这表明每家服务都用各自专有的算法向用户呈现搜索结果。由此可知，搜索并非一律平等：结果的真实性、准确性与有用性，很大程度上取决于你用的是哪家搜索服务商，以及你与这家服务商共享了多少用户信息。所有搜索都经过各种算法过滤，以确保搜索服务商认为对用户最重要的信息排在前列。这些算法不公开，是严守的商业机密，用户正是在这种过滤过程中托付了大量信任。人们希望这些过滤决定在道德上站得住脚，但这很难知道。“点击劫持”就是一个简单的例子。如果有人告诉我们某个链接会带我们到网上某处，而我们一点击却被带到了别的地方，用户会觉得这是一种背信。这常被称为“点击劫持”：恶意软件把用户带往并非其所期待的站点，那里通常满是其他链接，点击劫持者靠给这些站点输送流量赚取报酬（Hansen and Grossman, 2008）。信息技术提供的匿名与易用，又一次便利了点击劫持这类欺骗行径。佩蒂特（Pettit）（2009）提示我们，这应当促使我们重新评估信任与依赖这类道德价值在信息技术世界中所扮演的角色。匿名与隐藏网上新闻作者的能力，助长了“假新闻”或各类乔装成正当新闻的宣传的兴起。这是个重大问题，下文（2.2.3 节）将予讨论。

    step2: |-
      即便我们有理由准许他人获取我们掌控的某批信息，也仍有责任确保这批信息真实、准确、有用。一个简单的实验就能看出信息技术在这里可能藏着的深坑：打开几个不同的搜索引擎，输入同样的搜索词，各家呈现的结果互不相同，有些甚至天差地别。可见每家服务都在用自家的专有算法向你呈现结果。由此推知：搜索并非一律平等——结果真实与否、准确与否、有用与否，很大程度上系于你用哪家搜索服务商，以及你向它交出了多少用户信息。所有搜索都要过算法过滤这一道，为的是让搜索服务商认为对用户最重要的信息排在最前。这些算法不公开，是严守的商业机密；用户正是在这道过滤工序上托付了重重的信任。人们指望这些过滤决定在道德上站得住脚，可谁又知道呢。“点击劫持”（clickjacking）就是个现成的例子：明明被告知某链接会带你去网上某处，一点击却落到别的地方——用户难免觉得这是背信。恶意软件就这样“劫持”浏览器，把用户送往本不该去的站点；那些站点通常满是待价而沽的链接，点击劫持者靠输送流量收取报酬（Hansen and Grossman, 2008）。信息技术的匿名与易用，又一次给点击劫持这类骗术开了方便之门。佩蒂特（Pettit）（2009）提示：这应当促使我们重新掂量信任与依赖这类道德价值在信息技术世界里扮演的角色。匿名，以及遮掩网上新闻报道作者的能力，助长了“假新闻”与各色乔装成正经新闻的宣传的兴起。这是个重大问题，下文（2.2.3 节）将予讨论。

