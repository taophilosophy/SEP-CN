      The social value of pursuing this is debatable, but the economic value has been undeniable. At the time this was written, Mark Zuckerberg has been constantly listed in the top ten richest billionaires by Forbes Magazine where he is typically in the top five of that rarefied group. An achievement built on providing a free service to the world. What companies like Facebook do charge for are services, such as directed advertising, which allow third-party companies to access information that users have provided to the social media applications. The result is that ads bought on an application such as Facebook are more likely to be seen as useful to viewers who are much more likely to click on these ads and buy the advertised products. The more detailed and personal the information shared, the more valuable it will be to the companies that it is shared with. This radical transparency of sharing deeply personal information with companies like Facebook is encouraged. Those who do use social networking technologies do receive value as evidenced by the rapid growth of this technology. Statista reports that in 2019 there will be 2.77 billion users of social media worldwide and it will grow to 3.02 by 2021 (Statista, 2018). The question here is, what do we give up in order to receive this “free” service? In 2011, back when there were less than a billion social media users the technology critic Andrew Keen warned that, “sharing is a trap,” and that there was a kind of cult of radical transparency developing that clouded our ability to think critically about the kind of power we were giving these companies (Keen, 2011). Even before companies like Facebook were making huge profits, there were those warning of the dangers of the cult of transparency with warnings such as:
    step1: |-
      追求这一点的社会价值尚有争论，但其经济价值毋庸置疑。撰写本文之时，马克·扎克伯格持续位列《福布斯》最富有的十大亿万富翁，且通常位居这个稀有群体前五。这一成就建立在向全世界提供免费服务之上。脸书这类公司真正收费的是某些服务，例如定向广告：第三方公司由此可以获取用户提供给社交媒体应用的信息。其结果是，在脸书这类应用上投放的广告更有可能被观众觉得有用，观众也更可能点击这些广告、购买宣传的商品。分享的信息越详细、越切身，对接收信息的公司就越有价值。这种与脸书一类公司分享深度个人信息的高度透明受到鼓励。确实使用社交网络技术的人也确实得到了价值——这一技术的迅速增长便是明证。Statista 报告称，2019 年全球社交媒体用户将达 27.7 亿，到 2021 年将增至 30.2 亿（Statista, 2018）。这里的问题是：为了得到这项“免费”服务，我们付出了什么？2011 年，社交媒体用户还不足十亿，技术批评家安德鲁·基恩（Andrew Keen）就警告说“分享是一个陷阱”，一种激进透明崇拜正在成形，它遮蔽了我们批判性思考所让渡给这些公司之权力的能力（Keen, 2011）。早在脸书这类公司赚得巨额利润之前，就有人发出透明崇拜之危险的警告，比如：

