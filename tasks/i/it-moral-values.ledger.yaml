      Malware and computer virus threats continue to grow at an astonishing rate. Security industry professionals report that while certain types of malware attacks such as spam are falling out of fashion, newer types of attacks such as Ransomware and other methods focused on mobile computing devices, cryptocurrency, and the hacking of cloud computing infrastructure are on the rise outstripping any small relief seen in the slowing down of older forms of attack (Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018)[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]. What is clear is that this type of activity will be with us for the foreseeable future. In addition to the largely criminal activity of malware production, we must also consider the related but more morally ambiguous activities of hacking, hacktivism, commercial spyware, and informational warfare. Each of these topics has its own suite of subtle moral ambiguities. We will now explore some of them here.
    step1: |-
      恶意软件与计算机病毒的威胁仍在以惊人的速度增长。安全行业专业人士报告说，虽然垃圾邮件这类恶意软件攻击正在失宠，但勒索软件等较新的攻击类型，以及盯上移动计算设备、加密货币与云计算基础设施入侵的手段正在上升，盖过了老式攻击放缓所带来的些许宽慰（Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018）[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]。可以确定的是，在可预见的未来，这类活动都将与我们同在。除了大体属于犯罪活动的恶意软件生产，我们还必须考虑相关的、但道德上更暧昧的活动：黑客行为、黑客行动主义、商业间谍软件与信息战。这些话题各自都有一套微妙的道德含混之处。现在就来探讨其中若干。

    step2: |-
      恶意软件与计算机病毒的威胁仍在以骇人的速度滋长。安全业内报告：垃圾邮件这类攻击虽已渐失时兴，勒索软件一类新式攻击，连同盯着移动设备、加密货币与云计算基础设施下手的种种手段，正节节攀升，老式攻击放缓带来的些许喘息，全被盖过（Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018）[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]。可以断言的是：可预见的将来，这类活动都会缠着我们不放。恶意软件的生产大体是犯罪勾当；除此之外，我们还须掂量几种相关而道德上更暧昧的活动——黑客行为、黑客行动主义、商业间谍软件、信息战。每个话题都自带一簇微妙的道德含混。此处择其若干，逐一探看。

