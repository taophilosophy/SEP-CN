      While violence is easy to see in online games, there is a much more substantial moral value at play and that is the politics of virtual worlds. Peter Ludlow and Mark Wallace describe the initial moves to online political culture in their book, *The Second Life Herald: The Virtual Tabloid that Witnessed the Dawn of the Metaverse* (2007). Ludlow and Wallace chronicle how the players in massive online worlds have begun to form groups and guilds that often confound the designers of the game and are at times in conflict with those that make the game. They contend that designers rarely realize that they are creating a space where people intend to live large portions of their lives and engage in real economic and social activity and thus the designers have moral duties somewhat equivalent to those who may write a political constitution (Ludlow and Wallace 2007)[^ludlow-2007]. According to Purcell (2008), there is little commitment to democracy or egalitarianism by those who create and own online games and this needs to be discussed, if more and more of us are going to spend time living in these virtual societies.
    step1: |-
      暴力在在线游戏中显而易见，但还有一种分量重得多的道德价值在起作用，那就是虚拟世界的政治。彼得·拉德洛（Peter Ludlow）与马克·华莱士（Mark Wallace）在《第二生命先驱报：见证元宇宙黎明的虚拟小报》（*The Second Life Herald: The Virtual Tabloid that Witnessed the Dawn of the Metaverse*）（2007）一书中描述了在线政治文化的最初动向。拉德洛与华莱士编年记录了大型在线世界中的玩家如何开始结成团体与行会——这些组织常常让游戏设计者摸不着头脑，有时还与游戏制作者发生冲突。他们主张，设计者很少意识到，自己创造的是一个人们打算在其中度过大半人生的场所，是从事真实经济与社会活动的地方；因此设计者负有的道德义务，与政治宪法的起草者颇有几分相当（Ludlow and Wallace 2007）[^ludlow-2007]。按照珀塞尔（Purcell）（2008）的说法，在线游戏的创造者与所有者对民主或平等主义鲜有承诺；如果我们当中越来越多的人要花时间生活在这些虚拟社会里，这一点就必须拿出来讨论。

    step2: |-
      在线游戏里的暴力一目了然；可真正压秤的道德价值另有所在——虚拟世界的政治。彼得·拉德洛（Peter Ludlow）与马克·华莱士（Mark Wallace）在《第二生命先驱报：亲历元宇宙黎明的虚拟小报》（*The Second Life Herald: The Virtual Tabloid that Witnessed the Dawn of the Metaverse*）（2007）一书中，细数了在线政治文化的头几步棋。两人编年纪事：大型在线世界里的玩家如何开始结团成会——这些团体行会常令游戏设计者晕头转向，有时更与游戏制作者正面相争。他们的主张是：设计者很少意识到，自己营造的是一方天地，人们打算把大半辈子安顿在其中，从事实实在在的经济与社会活动；故而设计者肩负的道德义务，与政治宪法的执笔人不遑多让（Ludlow and Wallace 2007）[^ludlow-2007]。照珀塞尔（Purcell）（2008）的说法，在线游戏的缔造者与拥有者对民主、对平等主义都谈不上有多少承诺；若我们中越来越多的人要在这类虚拟社会里消磨光阴，这一点就必须摆上台面。

