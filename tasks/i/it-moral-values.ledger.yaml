      AI is certainly capable of creating machines that can converse effectively in simple ways with human beings. In addition, there are still many other applications that use AI technology. Nearly all of the information technologies we discussed above such as, search, computer games, data mining, malware filtering, robotics, etc., all utilize AI programming techniques. Thus AI will grow to be a primary location for the moral impacts of information technologies. Many governments and professional associations are now developing ethical guidelines and standards to help shape this important technology, one good example is the Global Initiative on the Ethics of Intelligent and Autonomous Systems (IEEE 2018)[^ieee-2018].
    step1: |-
      AI 当然有能力造出能与人类进行简单而有效对话的机器。此外，还有许多其他应用在使用 AI 技术。我们上文讨论过的几乎所有信息技术——搜索、电脑游戏、数据挖掘、恶意软件过滤、机器人技术等——都利用 AI 编程技术。因此，AI 将成长为信息技术道德影响的主要场所。许多政府与专业协会正在制定伦理准则与标准，以帮助塑造这项重要技术，一个很好的例子是智能与自主系统伦理全球计划（IEEE 2018）[^ieee-2018]。

    step2: |-
      AI 自然造得出能与人简单而有效对话的机器。何况用 AI 技术的应用还多得很：上文谈过的信息技术——搜索、电脑游戏、数据挖掘、恶意软件过滤、机器人技术——几乎无一不用 AI 编程技术。所以，AI 终将成为信息技术道德冲击的主战场。许多政府与专业协会正为这项要紧技术拟定伦理准则与标准；一个好例子是智能与自主系统伦理全球计划（IEEE 2018）[^ieee-2018]。

