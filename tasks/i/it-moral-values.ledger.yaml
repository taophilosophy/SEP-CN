      When malware and spyware is created by state actors, we enter the world of informational warfare and a new set of moral concerns. Every developed country in the world experiences daily cyber-attacks, with the major target being the United States which experienced a purported 1.8 billion attacks a month in 2010 (Lovely 2010)[^lovely-2010] and 80 billion malicious scans worldwide in 2017 (Lewis 2018)[^lewis-2018]. The majority of these attacks seem to be just probing for weaknesses but they can devastate a country’s internet such as the cyber-attacks on Estonia in 2007 and those in Georgia which occurred in 2008. While the Estonian and Georgian attacks were largely designed to obfuscate communication within the target countries more recently informational warfare has been used to facilitate remote sabotage. The famous Stuxnet virus used to attack Iranian nuclear centrifuges is perhaps the first example of weaponized software capable of creating remotely damaging physical facilities (Cisco Systems 2018)[^cisco-2018]. The coming decades will likely see many more cyber weapons deployed by state actors along well-known political fault lines such as those between Israel-America-Western Europe vs Iran, and America-Western Europe vs China (Kaspersky Lab 2018). The moral challenge here is to determine when these attacks are considered a severe enough challenge to the sovereignty of a nation to justify military reactions and to react in a justified and ethical manner to them (Arquilla 2010; Denning 2008, Kaspersky Lab 2018)[^arquilla-2010][^denning-2008].
    step1: |-
      当恶意软件与间谍软件由国家行为者制造时，我们便进入信息战的世界，一组新的道德关切随之而来。世界上每个发达国家每天都经历网络攻击，主要目标是美国：据报道，2010 年美国每月遭受 18 亿次攻击（Lovely 2010）[^lovely-2010]，2017 年全球有 800 亿次恶意扫描（Lewis 2018）[^lewis-2018]。这些攻击大多数似乎只是刺探弱点，但它们可以摧毁一国的互联网，例如 2007 年对爱沙尼亚的网络攻击和 2008 年格鲁吉亚遭受的攻击。爱沙尼亚与格鲁吉亚的攻击大体旨在扰乱目标国国内的通信，而近来信息战已被用于支持远程破坏。用于攻击伊朗核离心机的著名震网（Stuxnet）病毒，或许是能够远程破坏实体设施的武器化软件的首例（Cisco Systems 2018）[^cisco-2018]。未来几十年，国家行为者很可能沿着著名的政治断层线——如以色列-美国-西欧对伊朗、美国-西欧对中国——部署更多网络武器（Kaspersky Lab 2018）。这里的道德挑战在于：判定这些攻击何时构成对一国主权严重到足以证成军事反应的挑战，并以正当且合乎伦理的方式作出反应（Arquilla 2010; Denning 2008, Kaspersky Lab 2018）[^arquilla-2010][^denning-2008]。

    step2: |-
      恶意软件与间谍软件一旦出自国家行为者之手，我们便踏入信息战的世界，一整套新的道德关切接踵而至。世上每个发达国家天天都在挨网络攻击，头号目标是美国：据报道，2010 年美国每月遭袭 18 亿次（Lovely 2010）[^lovely-2010]，2017 年全球恶意扫描达 800 亿次（Lewis 2018）[^lewis-2018]。这些攻击多半只是探路摸底，却足以瘫掉一国的互联网——2007 年爱沙尼亚遭袭、2008 年格鲁吉亚遭袭，即是先例。爱、格两役大体只为搅乱目标国国内的通信；近年来，信息战已然用来策应远程破坏。攻击伊朗核离心机的著名震网（Stuxnet）病毒，大概是武器化软件得以远程损毁实体设施的第一例（Cisco Systems 2018）[^cisco-2018]。往后几十年，沿着熟知的政治断层线——以色列-美国-西欧对伊朗、美国-西欧对中国——国家行为者多半还会部署更多网络武器（Kaspersky Lab 2018）。这里的道德挑战是：判定这些攻击何时严重到足以撼动一国主权、从而证成军事反应，又该如何以正当而合乎伦理的方式应对（Arquilla 2010; Denning 2008, Kaspersky Lab 2018）[^arquilla-2010][^denning-2008]。

