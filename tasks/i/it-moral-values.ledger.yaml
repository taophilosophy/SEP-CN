      Who has the final say on whether or not some information about a user is communicated or not? Who is allowed to sell your medical records, your financial records, your email, your browser history, etc.? If you do not have control over this process, then how can you enforce your own moral right to privacy? For instance Alan Westin argued in the very early decades of the advance of digital information technologies that control of access to one’s personal information was the key to maintaining privacy (Westin, 1967). It follows that if we care about privacy, then we should give all the control of access to personal information to the individual. Most corporate entities resist this notion for the simple reason that information about users has become a primary commodity in the digital world boosting the vast fortunes of corporations like Google or Facebook. Indeed, there is a great deal of utility each of us gains from the services provided by internet search companies like Google and social networks such as Facebook. It might be argued that it is actually a fair exchange we receive since they provide search results and other applications for free and they offset the cost of creating those valuable serviced by collecting data from individual user behavior that can be monetized in various lucrative ways. A major component of the profit model for these companies is based on directed advertising where the information collected on the user is used to help identify advertising that will be most effective on a particular user based on his or her search history and other online behaviors. Simply by using the free applications offered, each user tacitly agrees to give up some amount of privacy that varies with the applications they are using. Even if we were to agree that there is some utility to the services users receive in this exchange, there are still many potential moral problems with this arrangement. If we follow the argument raised by Westin earlier that privacy is equivalent to information control (ibid.), then we do seem to be ceding our privacy away little by little given that we have almost no control or even much understanding of the vast amounts of digital information that is collected about us.
    step1: |-
      关于某条用户信息是否应当传递，谁有最终决定权？谁被允许出售你的医疗记录、财务记录、电子邮件、浏览器历史等等？如果你对这一过程没有控制权，你又如何行使自己的隐私道德权利？例如，阿兰·威斯汀（Alan Westin）在数字信息技术发展的最初几十年就主张，控制对个人信息的获取是维护隐私的关键（Westin, 1967）。由此推论，如果我们关心隐私，就应当把对个人信息获取的全部控制交给个人。大多数公司实体抵制这一主张，理由很简单：用户信息已成为数字世界中的主要商品，支撑着谷歌或脸书这类公司的巨额财富。诚然，我们每个人从谷歌这类互联网搜索公司和脸书这类社交网络提供的服务中获得大量效用。有人可能会说，这其实是一笔公平交易：它们免费提供搜索结果和其他应用，又通过收集个体用户行为的数据来抵偿创建那些宝贵服务的成本，这些数据可以以各种有利可图的方式变现。这些公司利润模型的主要组成部分是定向广告：收集到的用户信息被用来帮助识别对特定用户最有效的广告，依据是其搜索历史和其他在线行为。仅仅使用这些免费应用，每个用户就默许放弃一定数量的隐私，多少随所用应用而异。即便我们同意用户在这种交换中获得的服务确有效用，这种安排仍有许多潜在的道德问题。如果我们接受威斯汀前文的论证——隐私即信息控制（同上）——那么鉴于我们对被收集的关于我们的海量数字信息几乎没有控制、甚至缺乏了解，我们确实正在一点点放弃自己的隐私。

    step2: |-
      用户信息该不该传出去，最终谁说了算？谁有权出卖你的医疗记录、财务记录、电子邮件、浏览历史？若你对这一过程毫无控制，又谈何行使自己的隐私道德权利？比如，阿兰·威斯汀（Alan Westin）早在数字信息技术起步的头几十年就主张：守住对个人信息获取的控制，正是维护隐私的关键（Westin, 1967）。顺着这条理路：我们既然在乎隐私，就应当把个人信息获取的控制权悉数交归个人。多数公司却抵制这个主张，道理不复杂——用户信息如今已是数字世界里的大宗商品，撑起了谷歌、脸书这类公司的泼天财富。诚然，谷歌这样的搜索公司、脸书这样的社交网络，其服务确令我们每个人受益良多。也有人说这桩交换其实公平：它们免费供给搜索结果与种种应用，亏空靠收集个体用户行为的数据来填补，而这些数据可以多种途径变现，利润可观。这类公司盈利模式的支柱是定向广告：拿收集到的用户信息，按其搜索历史与其他上网行为，锁定对这位用户最奏效的广告。用户一经使用这些免费应用，便默许让渡一部分隐私，分量几何，视所用应用而定。就算承认用户在这场交换中所得的服务确有效用，这种安排仍潜伏着诸多道德问题。倘若我们沿用威斯汀前文的论证——隐私即信息控制（同上）——那么面对被收集的关于我们的海量数字信息，我们既几无控制，也谈不上了解，确实正把自己的隐私一点点让渡出去。

  - id: 29
