      In the beginning of the web, most malware creation was motivated by hobbyists and amateurs, but this has changed and now much of this activity is criminal in nature (Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018)[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]. Aycock and Sullins (2010) argue that relying on a strong defense is not enough and the situation requires a counteroffensive reply as well and they propose an ethically motivated malware research and creation program. This is not an entirely new idea and it was originally suggested by the Computer Scientist George Ledin in his editorial for the *Communications of the ACM*, “Not Teaching Viruses and Worms is Harmful” (2005). This idea does run counter to the majority opinion regarding the ethics of learning and deploying malware. Many computer scientists and researchers in information ethics agree that all malware is unethical (Edgar 2003; Himma 2007a; Neumann 2004; Spafford 1992; Spinello 2001)[^edgar-2003][^himma-2007a][^neumann-2004][^spafford-1992][^spinello-2001]. According to Aycock and Sullins, these worries can be mitigated by open research into understanding how malware is created in order to better fight this threat (2010).
    step1: |-
      万维网之初，恶意软件的创作多出于爱好者和业余玩家，但今非昔比，如今这类活动大多属犯罪性质（Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018）[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]。艾科克与萨林斯（2010）论证，仅靠坚固的防御并不够，局势还需要反攻式的回应；他们提出一项有伦理动机的恶意软件研究与创作计划。这不是全新的想法，最初由计算机科学家乔治·莱丁（George Ledin）在《ACM 通讯》（*Communications of the ACM*）的社论《不教病毒与蠕虫反而有害》（2005）中提出。这个想法确实与关于学习与部署恶意软件之伦理的主流意见相悖。许多计算机科学家与信息伦理研究者都同意，一切恶意软件皆不道德（Edgar 2003; Himma 2007a; Neumann 2004; Spafford 1992; Spinello 2001）[^edgar-2003][^himma-2007a][^neumann-2004][^spafford-1992][^spinello-2001]。照艾科克与萨林斯的说法，只要公开研究、弄清恶意软件如何被造出来以便更好地对抗这一威胁，这些担忧便可缓解（2010）。

    step2: |-
      万维网草创之时，写恶意软件的多是发烧友与业余玩家；时移世易，如今这类勾当多半已归入犯罪行当（Cisco Systems 2018; Kaspersky Lab 2017, Lewis 2018, Symantec 2018）[^cisco-2018][^kaspersky-2017][^lewis-2018][^symantec-2018]。艾科克与萨林斯（2010）论证：单靠严防死守不够，局面还需要反攻式的应手；两人遂提议一项带有伦理动机的恶意软件研究与创作计划。这并非石破天惊的新见，最初是计算机科学家乔治·莱丁（George Ledin）在《ACM 通讯》（*Communications of the ACM*）社论《不教病毒与蠕虫反而有害》（2005）里提出的。此论确实与学习、部署恶意软件之伦理的主流意见相抵。许多计算机科学家与信息伦理研究者都认定：一切恶意软件皆属不德（Edgar 2003; Himma 2007a; Neumann 2004; Spafford 1992; Spinello 2001）[^edgar-2003][^himma-2007a][^neumann-2004][^spafford-1992][^spinello-2001]。艾科克与萨林斯的答复是：公开研究、摸清恶意软件如何出炉，方能更好地对抗这一威胁；如此，上述忧虑可以缓解（2010）。

