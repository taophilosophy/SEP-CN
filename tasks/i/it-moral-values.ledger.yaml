      A persistent concern about the use of computers and especially computer games is that this could result in anti-social behavior and isolation. Yet studies might not support these hypotheses (Gibba, et al. 1983). With the advent of massively multiplayer games as well as video games designed for families the social isolation hypothesis is even harder to believe. These games do, however, raise gender equality issues. James Ivory used online reviews of games to complete a study that shows that male characters outnumber female characters in games and those female images that are in games tend to be overly sexualized (Ivory 2006)[^ivory-2006]. Soukup (2007) suggests that gameplay in these virtual worlds is most often based on gameplay that is oriented to masculine styles of play thus potentially alienating women players. And those women who do participate in gameplay at the highest level play roles in gaming culture that are very different from those of the largely heterosexual white male gamers, often leveraging their sexuality to gain acceptance (Taylor et al. 2009)[^taylor-2009]. Additionally, Joan M. McMahon and Ronnie Cohen have studied how gender plays a role in the making of ethical decisions in the virtual online world, with women more likely to judge a questionable act as unethical than men (2009). Marcus Johansson suggests that we may be able to mitigate virtual immorality by punishing virtual crimes with virtual penalties in order to foster more ethical virtual communities (Johansson 2009)[^johansson-2009].
    step1: |-
      对计算机、尤其是电脑游戏使用的一个持久担忧是：这可能导致反社会行为与孤立。但研究未必支持这些假设（Gibba 等 1983）。随着大型多人游戏以及面向家庭设计的视频游戏的出现，社会孤立假说更难令人相信。不过这些游戏确实提出了性别平等问题。詹姆斯·艾沃里（James Ivory）利用游戏在线评论完成的一项研究显示：游戏中男性角色数量超过女性角色，而游戏中的女性形象往往被过度性化（Ivory 2006）[^ivory-2006]。苏库普（Soukup）（2007）指出，这些虚拟世界中的玩法多半基于面向男性风格的玩法，因而可能疏远女性玩家。而那些确实参与最高水平游戏的女性，在游戏文化中扮演的角色与大体上异性恋白人男性玩家很不一样，往往借助自身性感来获得接纳（Taylor 等 2009）[^taylor-2009]。此外，琼·M. 麦克马洪（Joan M. McMahon）与罗妮·科恩（Ronnie Cohen）研究了性别如何在虚拟在线世界的伦理决策中发挥作用，发现女性比男性更倾向于把可疑行为判定为不合伦理（2009）。马库斯·约翰松（Marcus Johansson）则提示：我们或许可以用虚拟惩罚来制裁虚拟罪行，以培育更有德性的虚拟社区（Johansson 2009）[^johansson-2009]。

    step2: |-
      关于用计算机、尤其是玩电脑游戏，有一种挥之不去的忧虑：会不会招致反社会行为与自我封闭？研究却未必站在这些假说一边（Gibba 等 1983）。大型多人游戏与阖家同乐的视频游戏接连问世之后，社会孤立假说愈发难以取信。这些游戏倒是实打实提出了性别平等的问题。詹姆斯·艾沃里（James Ivory）借游戏在线评论完成的研究显示：游戏中男性角色远多于女性角色，而游戏里为数不多的女性形象又往往被过度性化（Ivory 2006）[^ivory-2006]。苏库普（Soukup）（2007）指出，这些虚拟世界的玩法多以男性风格为底色，从而可能把女性玩家晾在一边。至于跻身最高水平对局的女性，她们在游戏文化里扮演的角色，与那群大体是异性恋白人男性的玩家迥然不同，常要靠展示性感来换取接纳（Taylor 等 2009）[^taylor-2009]。此外，琼·M. 麦克马洪（Joan M. McMahon）与罗妮·科恩（Ronnie Cohen）研究了性别如何在虚拟在线世界的伦理决策中起作用，发现女性比男性更倾向把可疑行为判为不德（2009）。马库斯·约翰松（Marcus Johansson）则提示：以虚拟惩罚制裁虚拟罪行，或可遏制虚拟中的不德，滋养更有德性的虚拟社区（Johansson 2009）[^johansson-2009]。

