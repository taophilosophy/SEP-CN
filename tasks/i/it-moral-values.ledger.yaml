    source: |-
      Every action we take leaves a trail of information that could, in principle, be recorded and stored for future use. For instance, one might use the older forms of information technologies of pen and paper and keep a detailed diary listing all the things one did and thought during the day. It might be a daunting task to record all this information this way but there is a growing list of technologies and software applications that can help us collect all manner of data, which in principle, and practice, can be aggregated together for use in building a data profile about you, a digital diary with millions of entries. Some examples of which might be: a detailed listing of all of your economic transactions; a GPS-generated plot of where you traveled; a list of all the web addresses you visited and the details of each search you initiated online; a listing of all your vital signs such as blood pressure and heart rate; all of your dietary intakes for the day; and any other kind of data that can be measured. As you go through this thought experiment you begin to see the complex trail of data that you generate every day and how that same data might be efficiently collected and stored through the use of information technologies. It is here we can begin to see how information technology can impact moral values. As this data gathering becomes more automated and ever-present, we must ask who is in control of collecting this data and what is done with it once it has been collected and stored? Which bits of information should be made public, which is held private, and which should be allowed to become the property of third parties like corporations? Questions about the production, access, and control of information will be at the heart of moral challenges surrounding the use of information technology.
    step1: |-
      我们采取的每一个行动都会留下一串信息，这些信息原则上可以被记录并储存起来以备将来使用。例如，人们可以使用钢笔和纸张这类较老的信息技术，记一本详细的日记，列出自己一天中做过和想过的一切。用这种方式记录所有信息可能是一项令人生畏的任务，但如今有越来越多的技术和软件应用可以帮助我们收集各种各样的数据，这些数据原则上并且在实践中都可以聚合在一起，用于建立关于你的数据档案——一本有数百万条目的数字日记。其中一些例子可能是：你所有经济交易的详细清单；GPS 生成的你旅行路线图；你访问过的所有网址以及你在网上发起的每次搜索的详情；你所有生命体征（如血压和心率）的记录；你一天的全部饮食摄入；以及任何其他可以被测量的数据。当你进行这个思想实验时，你开始看到你每天生成的复杂数据轨迹，以及这些数据如何可以通过信息技术被高效地收集和储存。正是在这里，我们可以开始看到信息技术如何能够影响道德价值。随着这种数据收集变得更加自动化和无孔不入，我们必须追问：谁在控制这些数据的收集？数据被收集和储存之后又拿去做什么？哪些信息应当公开，哪些应当保密，哪些又应当被允许成为公司等第三方的财产？关于信息的生产、获取和控制的问题，将处于围绕信息技术使用的道德挑战的核心。

    step2: |-
      我们采取的每一个行动都会留下一串信息，这些信息原则上可记录、可储存，以备将来取用。举例来说，人们可以用纸笔这类较老的信息技术记一本详细的日记，把一天中所做的、所想的事一一列出。这样记录一切固然繁难，但能帮我们收集各类数据的技术和软件应用正越来越多；这些数据无论在原则上还是在实践中都能聚合起来，用以建立关于你的数据档案——一部数百万条目的数字日记。这类档案可能包括：你全部经济往来的明细；GPS 绘出的出行路线；你访问过的全部网址与你发起的每一次网上搜索的详情；血压、心率等全部生命体征；一整天的饮食摄入；以及其他任何可测量的数据。走完这个思想实验，你就会看到自己每天生成的复杂数据轨迹，也会看到信息技术如何高效地把这些数据收集、储存起来。正是在这里，我们开始看到信息技术何以影响道德价值。随着数据收集愈发自动化、无孔不入，我们必须追问：由谁掌控这些数据的收集？数据收存之后又作何用途？哪些信息应当公开，哪些应当保密，哪些又可被允许成为企业等第三方的财产？围绕信息技术使用的种种道德挑战，其核心正是信息的生产、获取与控制问题。

  - id: 2
    kind: body
    source: |-
      One might argue that the situation just described is no different from the moral issues revolving around the production, access, and control of any basic necessity of life. If one party has the privilege of the exclusive production, access, and/or control of some natural resource, then that by necessity prohibits others from using this resource without the consent of the exclusive owner. This is not necessarily so with digital information. Digital information is nonexclusive, meaning we can all, at least theoretically, possess the same digital information without excluding its use from others. This is because copying digital information from one source to another does not require eliminating the previous copy. Unlike a physical object, theoretically, we can all possess the same digital object as it can be copied indefinitely with no loss of fidelity. Since making these copies is often so cheap that it is almost without cost, there is no technical obstacle to the spread of all information as long as people are willing to copy and distribute it. Only appeals to morality, or economic justice might prevent the distribution of certain forms of information. For example, digital entertainment media, such as songs, images, or videos, has been a recurring battleground as users and producers of digital media fight to either curtail or extend the free distribution of this material. Therefore, understanding the role of moral values in information technology is indispensable to the design and use of these technologies (Johnson, 1985, Moore, 1985, Nissenbaum, 1998, Spinello, 2001). It should be noted that this entry will not directly address the phenomenological approach to the ethics of information technology since there is a detailed entry on this subject available (see the entry on phenomenological approaches to ethics and information technology).
    step1: |-
      有人可能会争辩说，刚才描述的情形与围绕任何基本生活必需品的生产、获取和控制而产生的道德问题并无不同。如果一方拥有对某种自然资源的排他性生产、获取和/或控制的权利，那么这就必然禁止他人未经该独占所有者同意而使用这种资源。数字信息的情况则未必如此。数字信息是非排他性的，这意味着我们所有人至少在理论上都可以拥有相同的数字信息，而不排斥他人使用它。这是因为把数字信息从一个源头复制到另一个源头并不需要消除先前的副本。与物理对象不同，理论上我们都可以拥有同一个数字对象，因为它可以被无限次复制而不损失保真度。由于制作这些副本往往如此便宜以至于几乎零成本，只要人们愿意复制和分发，信息的传播就没有技术障碍。只有诉诸道德或经济正义，才可能阻止某些形式的信息的传播。例如，歌曲、图像或视频等数字娱乐媒体一直是反复出现的战场，数字媒体的用户和生产者为限制或扩展这类材料的自由分发而斗争。因此，理解道德价值在信息技术中的作用，对于这些技术的设计和使用是必不可少的（Johnson, 1985, Moore, 1985, Nissenbaum, 1998, Spinello, 2001）。应当指出，本词条不会直接探讨信息技术伦理的现象学进路，因为关于这一主题已有详细的词条（参见“信息技术伦理学的现象学方法”词条）。

    step2: |-
      有人或会辩称，上述情形与围绕任何生活基本必需品之生产、获取与控制而生的道德问题并无二致：一方若独占某种自然资源的生产、获取或控制，他人未经其同意便不得使用该资源。数字信息却未必如此。数字信息是非排他的，这意味着至少在理论上，我们所有人可以同时拥有同一份数字信息，而不妨碍他人使用。原因在于，把数字信息从一处复制到另一处，并不需要抹掉原有的副本。与物理对象不同，同一个数字对象可以被无限复制而不失真，因而理论上人人皆可拥有它。复制又往往便宜到近乎免费，只要有人愿意复制分发，信息的传播就没有技术障碍；能阻止某些信息流通的，只有道德或经济正义方面的诉求。例如，歌曲、图像、视频等数字娱乐媒体历来是拉锯的战场：数字媒体的用户与生产者始终在为限制还是扩展这类内容的自由分发而相争。因此，理解道德价值在信息技术中的作用，对这些技术的设计与使用不可或缺（Johnson, 1985, Moore, 1985, Nissenbaum, 1998, Spinello, 2001）。需要说明的是，本词条不直接讨论信息技术伦理的现象学进路，该主题另有专条详述（参见“信息技术伦理学的现象学方法”词条）。

