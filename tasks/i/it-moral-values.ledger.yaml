      Information security is another important moral value that impacts the communication and access of user information. If we grant control of our information to third parties in exchange for the services they provide, then these entities must also be responsible for restricting access to that information by others who might use it to harm us (See Epstein 2007; Magnani 2007; Tavani 2007)[^epstein-2007][^magnani-2007][^tavani-2007]. With enough information, a person’s entire identity can be stolen and used to facilitate fraud and larceny. This type of crime has grown rapidly since the advent of digital information technologies. The victims of these crimes can have their lives ruined as they try to rebuild such things as their credit rating and bank accounts. This has led to the design of computer systems that are more difficult to access and the growth of a new industry dedicated to securing computer systems. Even with these efforts the economic and social impact of cybercrime is growing at a staggering rate. In February of 2018, the cyber-security company McAfee released a report that estimated the world cost of cybercrime was up from 445 billion dollars in 2014 to 608 billion dollars or 0.8 of the global GDP in 2018, and that is not counting the hidden costs of increased friction and productivity loss in time spent trying to fight cybercrime (Lewis 2018)[^lewis-2018].
    step1: |-
      信息安全是另一个影响用户信息传递与获取的重要道德价值。如果我们把信息的控制权交给第三方以换取其提供的服务，那么这些实体也必须负责限制可能利用信息伤害我们的他人获取这些信息（见 Epstein 2007; Magnani 2007; Tavani 2007）[^epstein-2007][^magnani-2007][^tavani-2007]。只要信息足够多，一个人的全部身份就可能被窃取，用来实施欺诈和盗窃。自数字信息技术问世以来，这类犯罪增长迅速。犯罪的受害者可能生活尽毁，因为他们要努力重建自己的信用评级和银行账户。这推动了更难侵入的计算机系统的设计，也催生了一个致力于保障计算机系统安全的新产业。即便有这些努力，网络犯罪的经济与社会影响仍以惊人速度增长。2018 年 2 月，网络安全公司迈克菲（McAfee）发布报告估计：全球网络犯罪代价已从 2014 年的 4450 亿美元升至 2018 年的 6080 亿美元，占全球 GDP 的 0.8%；这还不算摩擦增加与生产力损失的隐性成本——即人们为对抗网络犯罪而耗费的时间（Lewis 2018）[^lewis-2018]。

    step2: |-
      信息安全是另一项关涉用户信息传递与获取的重要道德价值。我们若把信息控制权交给第三方，换取其服务，那么这些实体同时必须负责拦住他人对信息的获取——免得有人拿它来害我们（见 Epstein 2007; Magnani 2007; Tavani 2007）[^epstein-2007][^magnani-2007][^tavani-2007]。信息攒得够多，一个人的完整身份便可被人窃走，用来行骗、行窃。自数字信息技术问世，这类犯罪一路猛增。受害者可能生活尽毁：信用评级、银行账户，样样要从头重建。由此推动了两件事：设计更难侵入的计算机系统，以及一个专门保障系统安全的新产业应运而生。纵有这些努力，网络犯罪的经济与社会冲击仍以骇人的速度扩大。2018 年 2 月，网络安全公司迈克菲（McAfee）发布报告估计：全球网络犯罪代价已由 2014 年的 4450 亿美元涨至 2018 年的 6080 亿美元，约占全球 GDP 的 0.8%；这还没算隐性成本——摩擦加剧，以及人们为对抗网络犯罪耗费时间造成生产力损失（Lewis 2018）[^lewis-2018]。

