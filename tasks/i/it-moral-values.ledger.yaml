      There have already been a number of valuable contributions to the growing fields of machine morality and robot ethics (roboethics). For example, in Wallach and Allen’s book *Moral Machines: Teaching Robots Right from Wrong* (2010), the authors present ideas for the design and programming of machines that can functionally reason on moral questions as well as examples from the field of robotics where engineers are trying to create machines that can behave in a morally defensible way. The introduction of semi and fully autonomous machines, (meaning machines that make decisions with little or no human intervention), into public life will not be simple. Towards this end, Wallach (2011) has also contributed to the discussion on the role of philosophy in helping to design public policy on the use and regulation of robotics.
    step1: |-
      在日益壮大的机器道德与机器人伦理（roboethics）领域，已有不少有价值的贡献。例如，瓦拉克与艾伦的《道德机器：教机器人分辨对错》（*Moral Machines: Teaching Robots Right from Wrong*）（2010）一书提出了设计与编程这类机器的构想——它们能在道德问题上做功能性推理——并给出机器人领域的实例：工程师们正试图创造能以道德上可辩护的方式行事的机器。半自主与全自主机器（即几乎或完全无须人类干预便做决定的机器）进入公共生活，不会是简单的事。为此，瓦拉克（2011）还参与了关于哲学在协助设计机器人使用与监管的公共政策中的作用的讨论。

    step2: |-
      机器道德与机器人伦理（roboethics）这两个领域方兴未艾，已有不少有分量的贡献。比如瓦拉克与艾伦合著的《道德机器：教机器人分辨对错》（*Moral Machines: Teaching Robots Right from Wrong*）（2010）：书中既提出设计与编程之策——造出能在道德问题上作功能性推理的机器——也举出机器人领域的实例：工程师们正设法造出能以道德上立得住脚的方式行事的机器。半自主与全自主机器（即几乎或全然无须人类干预便自行决断的机器）要走进公共生活，绝非易事。为此，瓦拉克（2011）还加了一场讨论：哲学该如何出力，帮着设计机器人使用与监管的公共政策。

  - id: 94
    kind: body
    source: |-
      Military robotics has proven to be one of the most ethically charged robotics applications (Lin et al. 2008, 2013, Lin 2010; Strawser, 2013)[^lin-2010][^lin-2008]. Today these machines are largely remotely operated (telerobots) or semi-autonomous, but over time these machines are likely to become more and more autonomous due to the necessities of modern warfare (Singer 2009)[^singer-2009]. In the first decades of war in the 21ˢᵗ century, robotic weaponry has been involved in numerous killings of both soldiers and noncombatants (Plaw 2013)[^plaw-2013], and this fact alone is of deep moral concern. Gerhard Dabringer has conducted numerous interviews with ethicists and technologists regarding the implications of automated warfare (Dabringer 2010)[^dabringer-2010]. Many ethicists are cautious in their acceptance of automated warfare with the provision that the technology is used to enhance ethical conduct in war, for instance by reducing civilian and military casualties or helping warfighters follow International Humanitarian Law and other legal and ethical codes of conduct in war (see Lin et al. 2008, 2013; Sullins 2009b)[^lin-2008][^sullins-2009b], but others have been highly skeptical of the prospects of an ethical autonomous war due to issues like the risk to civilians and the ease in which wars might be declared given that robots will be taking most of the risk (Asaro 2008; Sharkey 2011)[^asaro-2008][^sharkey-2011].
    step1: |-
      军用机器人已被证明是道德争议最大的机器人应用之一（Lin 等 2008, 2013, Lin 2010; Strawser, 2013）[^lin-2010][^lin-2008]。如今这类机器大体是遥控的（遥操作机器人）或半自主的；但假以时日，由于现代战争的需要，它们很可能越来越自主（Singer 2009）[^singer-2009]。在 21 世纪战争的最初几十年里，机器人武器已卷入对士兵与非战斗人员的无数次杀戮（Plaw 2013）[^plaw-2013]，仅此一端便足以构成深重的道德关切。格哈德·达布林格（Gerhard Dabringer）就自动化战争的影响访谈过众多伦理学家与技术专家（Dabringer 2010）[^dabringer-2010]。许多伦理学家对自动化战争的接受持谨慎态度，附带的条件是这项技术须用于提升战争中的伦理操守，比如减少平民与军人伤亡，或帮助作战人员遵循国际人道法及战争中的其他法律与伦理规范（见 Lin 等 2008, 2013; Sullins 2009b）[^lin-2008][^sullins-2009b]；另一些人则对合乎伦理的自主战争前景深表怀疑，理由包括平民面临的风险，以及既然机器人将承担大部分风险，宣战可能变得轻而易举（Asaro 2008; Sharkey 2011）[^asaro-2008][^sharkey-2011]。

    step2: |-
      军用机器人已被证明是道德火药味最浓的机器人应用之一（Lin 等 2008, 2013, Lin 2010; Strawser, 2013）[^lin-2010][^lin-2008]。今日这类机器多为遥控（遥操作机器人）或半自主；但现代战争的需要摆在那里，假以时日，它们多半会越来越自主（Singer 2009）[^singer-2009]。21 世纪开战的头几十年，机器人武器已染指对军人与非战斗人员的无数杀戮（Plaw 2013）[^plaw-2013]；单凭这一件事，道德上的关切就已深重。格哈德·达布林格（Gerhard Dabringer）就自动化战争的影响遍访伦理学家与技术专家（Dabringer 2010）[^dabringer-2010]。许多伦理学家接受自动化战争时小心翼翼，附一条件：这项技术须用来提升战争中的伦理操守——比如减少平民与军人伤亡，或帮作战人员守住国际人道法及战争中的其他法律与伦理规范（见 Lin 等 2008, 2013; Sullins 2009b）[^lin-2008][^sullins-2009b]；另一些人则对“合乎伦理的自主战争”前景大摇其头：平民的风险摆在眼前，更何况机器人把风险都担了，宣战岂不成了轻而易举的事（Asaro 2008; Sharkey 2011）[^asaro-2008][^sharkey-2011]。

