      Machines make decisions that have moral impacts. Wendell Wallach and Colin Allen tell an anecdote in their book “Moral Machines” (2008). One of the authors left on a vacation and when he arrived overseas his credit card stopped working, perplexed, he called the bank and learned that an automatic anti-theft program had decided that there was a high probability that the charges he was trying to make were from someone stealing his card and that to protect him the machine had denied his credit card transactions. Here we have a situation where a piece of information technology was making decisions about the probability of nefarious activity happening that resulted in a small amount of harm to the person that it was trying to help. Increasingly, machines make important life-changing financial decisions about people without much oversight from human agents. Whether or not you will be given a credit card, mortgage loan, the price you will have to pay for insurance, etc., is very often determined by a machine. For instance, if you apply for a credit card, the machine will look for certain data points, like your salary, your credit record, the economic condition of the area you reside in, etc., and then calculate the probability that you will default on your credit card. That probability will either pass a threshold of acceptance or not and determine whether or not you are given the card. The machine can typically learn to make better judgments given the results of earlier decisions it has made. This kind of machine learning and prediction is based on complex logic and mathematics (see for example, Russell and Norvig 2010)[^russell-2010], this complexity may result in slightly humorous examples of mistaken predictions as told in the anecdote above, or it might be more eventful. For example, the program may interpret the data regarding the identity of one’s friends and acquaintances, his or her recent purchases, and other readily available social data, which might result in the mistaken classification of that person as a potential terrorist, thus altering that person’s life in a powerfully negative way (Sullins 2010)[^sullins-2010]. It all depends on the design of the learning and prediction algorithm, something that is typically kept secret so that it is hard to justify the veracity of the prediction.
    step1: |-
      机器做出的决定具有道德影响。温德尔·瓦拉克（Wendell Wallach）与科林·艾伦（Colin Allen）在《道德机器》（Moral Machines）（2008）一书中讲过一则轶事：其中一位作者出门度假，抵达海外时信用卡却刷不了了；他一头雾水，打电话给银行，才知道一个自动防盗程序判定，他想刷的这笔消费极有可能出自盗刷者之手，为保护他，机器拒绝了他的信用卡交易。这里的情况是：一件信息技术在就恶性活动发生的概率做决定，结果却给它正想帮助的那个人造成了些许伤害。如今，机器在人身上做出足以改变人生的重要财务决定，而人类行动者对此几乎不加监督。你会不会获批信用卡、房贷，你要为保险付多少钱，等等，往往由机器说了算。比如你申请信用卡，机器会查找某些数据点——你的薪水、你的信用记录、你所在地区的经济状况等——然后计算你违约的概率。该概率要么过、要么不过一个接受阈值，从而决定给不给你这张卡。机器通常能根据先前决定的结果学习，做出更好的判断。这种机器学习与预测以复杂的逻辑与数学为基础（例如见 Russell and Norvig 2010）[^russell-2010]；其复杂性可能造成上面轶事里那种略带滑稽的预测失误，也可能闹出更大的事端。例如，程序可能解读关于一个人朋友与熟人的身份、其近期购物记录以及其他随手可得的社会数据，结果错把这个人归类为潜在恐怖分子，从而给这个人的生活带来强烈的负面改变（Sullins 2010）[^sullins-2010]。一切都取决于学习与预测算法的设计，而算法通常保密，预测的真实性因而难以证成。

    step2: |-
      机器在做决定，决定又带着道德分量。温德尔·瓦拉克（Wendell Wallach）与科林·艾伦（Colin Allen）在《道德机器》（Moral Machines）（2008）一书中讲过一则轶事：某位作者出门度假，人刚到海外，信用卡忽然刷不动了；他满头雾水地打电话给银行，才知是自动防盗程序判定：他想刷的这笔消费极可能出自盗刷者之手，为保护他，机器拒了这笔交易。此处的情形是：一件信息技术在估量恶性活动发生的概率，结果却给它一心想护着的人平添了几分损害。而今，机器在人身上做那些足以改变人生的重要财务决定，人类行动者却几乎不过问。你能不能批下信用卡、房贷，你的保险该掏多少钱，诸如此类，常常是机器说了算。比如申请信用卡：机器会找某些数据点——你的薪水、信用记录、所在地区的经济状况之类——然后算出你违约的概率；该概率过不过一道接受阈值，便定下这张卡给还是不给。机器通常还能依据先前决定的结果学习，把判断越做越准。这类机器学习与预测，底下是复杂的逻辑与数学（例如见 Russell and Norvig 2010）[^russell-2010]；其复杂性可能酿出上文轶事里那种略带滑稽的预测失误，也可能闹出更大的乱子。比如，程序或许会解读一个人的朋友与熟人身份、近期购物记录等唾手可得的社会数据，结果错把他归为潜在恐怖分子，从此给这个人的生活蒙上浓重的阴影（Sullins 2010）[^sullins-2010]。一切系于学习与预测算法的设计；算法照例保密，预测是否属实，也就难以证成了。

