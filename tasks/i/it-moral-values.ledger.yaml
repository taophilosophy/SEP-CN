      In the section above, the focus was on the moral impacts of information technologies on the individual user. In this section, the focus will be on how these technologies shape the moral landscape at the societal level. At the turn of the twentieth century the term “web 2.0” began to surface and it referred to the new way that the World Wide Web was being used as a medium for information sharing and collaboration as well as a change in the mindset of web designers to include more interoperability and user-centered experiences on their websites. This term has also become associated with “social media” and “social networking.” While the original design of the World Wide Web in 1989 by its creator Tim Berners-Lee was always one that included notions of meeting others and collaborating with them online, users were finally ready to fully exploit those capabilities by 2004 when the first Web 2.0 conference was held by O’Reilly Media (O’Reilly 2007 [2005])[^o’reilly-2007]. This change has meant that a growing number of people have begun to spend significant portions of their lives online with other users experiencing a new unprecedented lifestyle. Social networking is an important part of many people’s lives worldwide. Vast numbers of people congregate on sites like Facebook and interact with friends old and new, real and virtual. The Internet offers the immersive experience of interacting with others in virtual worlds where environments are constructed entirely out of information. Just now, emerging onto the scene are technologies that will allow us to merge the real and the virtual. This new form of “augmented reality” is facilitated by the fact that many people now carry GPS enabled smart phones and other portable computers with them upon which they can run applications that let them interact with their surroundings and their computers at the same time, perhaps looking at an item though the camera in their device and the “app” calling up information about that entity and displaying it in a bubble above the item. Each of these technologies comes with its own suite of new moral challenges some of which will be discussed below.
    step1: |-
      上一节关注的是信息技术对个体用户的道德影响；本节关注的是这些技术如何在社会层面塑造道德图景。二十世纪之交，“web 2.0”一词开始出现，指的是万维网作为信息共享与协作媒介的新用法，以及网页设计师心态的转变——在网站上纳入更多互操作性与以用户为中心的体验。这个词后来也与“社交媒体”和“社交网络”联系在一起。万维网由其创造者蒂姆·伯纳斯-李（Tim Berners-Lee）于 1989 年完成原始设计，其中始终包含与他人相会并在线协作的理念；但用户直到 2004 年奥莱利传媒（O'Reilly Media）举办首届 Web 2.0 大会时，才终于准备好充分利用这些能力（O'Reilly 2007 [2005]）[^o’reilly-2007]。这一变化意味着，越来越多的人开始把生活的相当部分放到网上，与其他用户一道体验一种前所未有的新生活方式。社交网络如今是世界上许多人生活中的重要部分。海量用户聚集在脸书这类网站上，与新旧朋友、真实与虚拟的朋友互动。互联网提供了一种沉浸式体验：在完全由信息构造出的虚拟世界中与他人互动。此刻，让我们能够融合真实与虚拟的技术正崭露头角。这种新形态的“增强现实”之所以成为可能，是因为许多人如今随身携带支持 GPS 的智能手机和其他便携计算机，可在上面运行应用程序，让人同时与周围环境和计算机互动：也许正通过设备的摄像头看着某件物品，“应用”便调出关于该实体的信息，以气泡形式显示在物品上方。每一项这类技术都带来自己的一整套新道德挑战，其中一些将在下文讨论。

    step2: |-
