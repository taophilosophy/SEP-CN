      Marcus Schulzke (2010) defends the depiction of violence in video games. Schulzke’s main claim is that actions in a virtual world are very different from actions in the real world. Although a player may “kill” another player in a virtual world, the offended player is instantly back in the game and the two will almost certainly remain friends in the real world. Thus virtual violence is very different from real violence, a distinction that gamers are comfortable with (Schulzke 2010)[^schulzke-2010]. While virtual violence may seem palatable to some, Morgan Luck (2009) seeks a moral theory that might be able to allow the acceptance of virtual murder but that will not extend to other immoral acts such as pedophilia. Christopher Bartel (2011) is less worried about the distinction Luck attempts to draw; Bartel argues that virtual pedophilia is real child pornography, which is already morally reprehensible and illegal across the globe.
    step1: |-
      马库斯·舒尔茨克（Marcus Schulzke）（2010）为视频游戏中的暴力刻画辩护。舒尔茨克的主张是：虚拟世界中的行动与现实世界中的行动大不相同。虽然玩家可能在虚拟世界中“杀死”另一个玩家，但被“杀”的玩家立刻回到游戏中，两人几乎肯定仍是现实世界的朋友。因此虚拟暴力与真实暴力大异其趣，游戏玩家们对这一区分心安理得（Schulzke 2010）[^schulzke-2010]。虚拟暴力虽然在一部分人看来尚可接受，摩根·勒克（Morgan Luck）（2009）却想寻找一种道德理论：它能容许我们接受虚拟谋杀，却不延伸到恋童癖这类其他不道德行为。克里斯托弗·巴特尔（Christopher Bartel）（2011）则不那么担心勒克试图划出的界线；巴特尔论证说，虚拟恋童癖就是真实的儿童色情制品，后者在全球范围内早已是道德上应受谴责且违法的东西。

    step2: |-
      马库斯·舒尔茨克（Marcus Schulzke）（2010）为视频游戏的暴力刻画辩护。舒尔茨克的主论点是：虚拟世界里的行动与现实世界里的行动判然有别。玩家固然可能在虚拟世界里“杀死”另一位玩家，可被“杀”的玩家转眼复活归队，两人回到现实几乎笃定仍是朋友。虚拟暴力与真实暴力，由此判然两途；这一区分，玩家们安之若素（Schulzke 2010）[^schulzke-2010]。虚拟暴力纵然在有些人眼里尚能下咽，摩根·勒克（Morgan Luck）（2009）却想找出一套道德理论：容得下虚拟谋杀，又不会延伸到恋童癖这类其他恶行。克里斯托弗·巴特尔（Christopher Bartel）（2011）对勒克苦心划出的那条界线倒不那么在意；巴特尔论证：虚拟恋童癖就是实实在在的儿童色情制品，后者本就举世皆曰不德、举世皆属违法。

