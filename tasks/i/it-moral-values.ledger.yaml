      ## 4. Information Technologies of Morality
    step1: |-
      ## 4. 道德的信息技术

    step2: |-
      ## 4 道德的信息技术

  - id: 96
    kind: body
    source: |-
      A key development in the realm of information technologies is that they are not only the object of moral deliberations but they are also beginning to be used as a tool in moral deliberation itself. Since artificial intelligence technologies and applications are a kind of automated problem solvers, and moral deliberations are a kind of problem, it was only a matter of time before automated moral reasoning technologies would emerge. This is still only an emerging technology but it has some very interesting moral implications which will be outlined below. The coming decades are likely to see many advances in this area and ethicists need to pay close attention to these developments as they happen. Susan and Michael Anderson have collected several articles regarding this topic in their book, *Machine Ethics* (2011), and Rocci Luppicini has a section of his anthology devoted to this topic in the *Handbook of Research on Technoethics* (2009).
    step1: |-
      信息技术领域的一个关键进展是：它们不仅是道德审议的对象，还开始被用作道德审议本身的工具。人工智能技术与应用是一种自动化的问题求解器，而道德审议也是一种问题；自动道德推理技术的出现，只是时间问题。这仍是一门新兴技术，但它有一些非常有趣的道德意涵，下文将作勾勒。未来几十年，这一领域可能取得许多进展；伦理学家须密切关注这些进展的发生。苏珊·安德森与迈克尔·安德森（Susan and Michael Anderson）在其《机器伦理》（*Machine Ethics*）（2011）一书中汇集了关于这一主题的多篇文章；罗基·卢皮奇尼（Rocci Luppicini）在其《技术伦理学研究手册》（*Handbook of Research on Technoethics*）（2009）文集中也有一节专门讨论这一主题。

    step2: |-
      信息技术领域的一个关键动向：它们不单是道德审议的对象，还开始被拿来做道德审议本身的工具。人工智能技术与应用是一种自动化解题器，而道德审议也是一种问题——自动道德推理技术的冒头，不过是个时间问题。这仍属新兴技术，却已带着几分很有意思的道德意涵，下文将作勾勒。往后几十年，这一领域多半会步步推进；伦理学家须盯紧这些动向。苏珊·安德森与迈克尔·安德森（Susan and Michael Anderson）把这一主题的若干文章汇成《机器伦理》（*Machine Ethics*）（2011）一书；罗基·卢皮奇尼（Rocci Luppicini）的《技术伦理学研究手册》（*Handbook of Research on Technoethics*）（2009）中也辟有一节，专论此题。

