      As was mentioned in the introduction above, information technologies are in a constant state of change and innovation. The internet technologies that have brought about so much social change were scarcely imaginable just decades before they appeared. Even though we may not be able to foresee all possible future information technologies, it is important to try to imagine the changes we are likely to see in emerging technologies. James Moor argues that moral philosophers need to pay particular attention to emerging technologies and help influence the design of these technologies early on to encourage beneficial moral outcomes (Moor 2005)[^moor-2005]. The following sections contain some potential technological concerns.
    step1: |-
      如上文引言所说，信息技术处于不断的变革与创新之中。互联网技术带来了如此多的社会变化，而在它们出现前几十年，人们还几乎无法想象。虽然我们未必能预见所有可能的未来信息技术，但尽力想象新兴技术中可能出现的变革，是重要的。詹姆斯·穆尔论证说，道德哲学家需要特别关注新兴技术，并尽早参与影响这些技术的设计，以促成有益的道德结果（Moor 2005）[^moor-2005]。以下几节包含一些潜在的技术关切。

    step2: |-
      前文引言已提过：信息技术无时无刻不在变，无时无刻不在翻新。互联网技术搅动了如此多的社会变化，可就在它们问世前几十年，人们还几乎无从想象。纵然我们预见不了未来信息技术的全部可能，尽力去想新兴技术里大概率将出现的变革，仍然要紧。詹姆斯·穆尔论证：道德哲学家须格外留意新兴技术，赶早施加影响、参与其设计，好促成有益的道德结果（Moor 2005）[^moor-2005]。以下几节收录若干潜在的技术关切。

