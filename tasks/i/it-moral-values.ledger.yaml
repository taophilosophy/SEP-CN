      These systems are not normally designed to explicitly infringe on individual privacy, but since these services are typically free there is a strong economic drive for the service providers to harvest at least some information about their user’s activities on the site to sell that information to advertisers for directed marketing. This marketing can be done with the provider just selling access to users’ data that has been made anonymous so that the advertiser knows that the user may be likely to buy a pair of jeans but they do not give the exact identity of that person. In this way, a social network provider can try to maintain the moral value of privacy for its users while still profiting off of linking them with advertisers.
