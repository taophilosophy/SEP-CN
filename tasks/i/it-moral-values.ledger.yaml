      The first moral impact one encounters when contemplating online games is the tendency for these games to portray violence, sexism, and sexual violence. There are many news stories that claim a cause-and-effect relationship between violence in computer games and real violence. The claim that violence in video games has a causal connection to actual violence has been strongly critiqued by the social scientist Christopher J. Ferguson (Ferguson 2007). However, Mark Coeckelbergh argues that since this relationship is tenuous at best the real issue at hand is the effect these games have on one’s moral character (Coeckelbergh 2007)[^coeckelbergh-2007]. But Coeckelbergh goes on to claim that computer games could be designed to facilitate virtues like empathy and cosmopolitan moral development, thus he is not arguing against all games just those where violence inhibits moral growth (Coeckelbergh 2007)[^coeckelbergh-2007]. A good example of this might be the virtual reality experience that was designed by Planned Parenthood in 2017, “…which focuses on the experience of accessing abortion in America, positively influences the way viewers feel about the harassment that many patients, providers, and health center staff experience from opponents of safe, legal abortion” (Planned Parenthood, 2017).
    step1: |-
      思考在线游戏时首先遇到的道德影响，是这类游戏倾向刻画暴力、性别歧视与性暴力。许多新闻报道声称电脑游戏中的暴力与现实暴力之间存在因果关系。视频游戏暴力与真实暴力有因果联系这一主张，受到了社会科学家克里斯托弗·J. 弗格森（Christopher J. Ferguson）的有力批评（Ferguson 2007）。不过，马克·库克尔贝赫（Mark Coeckelbergh）论证说，既然这种关系至多勉强成立，真正的问题是这些游戏对一个人道德品格的影响（Coeckelbergh 2007）[^coeckelbergh-2007]。但库克尔贝赫接着主张，电脑游戏可以被设计来促成共感与世界主义式的道德发展这类德性；因此他并非反对所有游戏，只反对那些暴力妨碍道德成长的游戏（Coeckelbergh 2007）[^coeckelbergh-2007]。这方面的一个好例子，或许是美国计划生育联合会（Planned Parenthood）2017 年设计的虚拟现实体验：“……它聚焦于在美国获得堕胎服务的经历，正面地影响了观看者对许多患者、服务提供者和健康中心工作人员遭到安全合法堕胎反对者骚扰一事的感受”（Planned Parenthood, 2017）。

    step2: |-
      一想到在线游戏，最先撞上的道德影响便是：这类游戏偏爱刻画暴力、性别歧视与性暴力。新闻里常见一种说法：电脑游戏中的暴力与现实暴力之间存在因果链条。“视频游戏暴力与真实暴力有因果关联”这一主张，遭到社会科学家克里斯托弗·J. 弗格森（Christopher J. Ferguson）的有力批驳（Ferguson 2007）。不过马克·库克尔贝赫（Mark Coeckelbergh）论证：这种关联至多勉强算数，眼下真正的问题，倒是这些游戏对人的道德品格有何影响（Coeckelbergh 2007）[^coeckelbergh-2007]。库克尔贝赫进而主张：电脑游戏尽可以设计得能促成共感、世界主义式的道德成长这类德性；所以他并不反对一切游戏，只反对其中暴力妨碍道德成长的那类（Coeckelbergh 2007）[^coeckelbergh-2007]。一个好例子是美国计划生育联合会（Planned Parenthood）2017 年设计的虚拟现实体验：“……它聚焦于在美国获得堕胎服务的经历，能让观看者对众多患者、服务者与健康中心职员遭安全合法堕胎反对者骚扰一事，抱持更积极的感受”（Planned Parenthood, 2017）。

