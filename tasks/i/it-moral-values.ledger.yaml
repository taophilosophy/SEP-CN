      > 1984 年秋，在第一届黑客大会上，我在一个讨论小组里说过：“一方面，信息想要变得昂贵，因为它太有价值了。正确的信息出现在正确的位置，会改变你的一生。另一方面，信息想要变得自由，因为把信息发布出去的成本一直在降。于是这两个方向就在互相较劲”（Clarke 2000——见“其他网络资源”）[^note-1]

