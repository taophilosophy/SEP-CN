      Artificial Intelligence (AI) refers to the many longstanding research projects directed at building information technologies that exhibit some or all aspects of human-level intelligence and problem-solving. Artificial Life (ALife) is a project that is not as old as AI and is focused on developing information technologies and or synthetic biological technologies that exhibit life functions typically found only in biological entities. A more complete description of logic and AI can be found in the entry on logic and artificial intelligence. ALife essentially sees biology as a kind of naturally occurring information technology that may be reverse-engineered and synthesized in other kinds of technologies. Both AI and ALife are vast research projects that defy simple explanations. Instead, the focus here is on the moral values that these technologies impact and the way some of these technologies are programmed to affect emotion and moral concern. See also the entry on ethics of artificial intelligence and robotics.
    step1: |-
      人工智能（AI）指许多历史悠久的研发项目，它们致力于建造展现人类水平智能与问题解决的部分或全部方面的信息技术。人工生命（ALife）是比 AI 年轻的项目，专注于开发展现生命功能的信息技术或合成生物技术——这些功能通常只见于生物体。逻辑与 AI 更完整的说明见“逻辑与人工智能”词条。ALife 的要义是把生物学看作一种自然发生的信息技术，可以对它做逆向工程并在其他技术中加以合成。AI 与 ALife 都是庞大到难以简单概括的研究计划。这里的焦点是这些技术冲击的道德价值，以及其中一些技术被编程来影响情感与道德关切的方式。另见“人工智能与机器人技术的伦理”词条。

    step2: |-
      人工智能（AI）指的是一连串历史悠久的研发项目：目标是造出能在部分或全部方面达到人类水平的智能与解题能力的信息技术。人工生命（ALife）比 AI 年轻，专攻开发展现生命功能的信息技术或合成生物技术——那些功能往常只在生物身上见得到。逻辑与 AI 的更完备说明，见“逻辑与人工智能”词条。ALife 的核心主张：生物学无非一种自然发生的信息技术，可以拿来做逆向工程，再在别的技术里把它合成出来。AI 与 ALife 都是大到难以三言两语说清的研究计划。所以此处只盯一点：这些技术冲击着哪些道德价值，其中一些技术又是如何被编程来拨动情感与道德关切的。另见“人工智能与机器人技术的伦理”词条。

