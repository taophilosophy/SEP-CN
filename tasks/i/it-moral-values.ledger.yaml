      Scientists at the J. Craig Venter Institute were able to synthesize an artificial bacterium called JCVI-syn1.0 in May of 2010. While the media paid attention to this breakthrough, they tended to focus on the potential ethical and social impacts of the creation of artificial bacteria. Craig Venter himself launched a public relations campaign trying to steer the conversation about issues relating to creating life. This first episode in the synthesis of life gives us a taste of the excitement and controversy that will be generated when more viable and robust artificial protocells are synthesized. The ethical concerns raised by Wet ALife, as this kind of research is called, are more properly the jurisdiction of bioethics (see entry on theory and bioethics). But it does have some concern for us here in that Wet ALife is part of the process of turning theories from the life sciences into information technologies. This will tend to blur the boundaries between bioethics and information ethics. Just as software ALife might lead to dangerous malware, so too might Wet ALife lead to dangerous bacteria or other disease agents. Critics suggest that there are strong moral arguments against pursuing this technology and that we should apply the precautionary principle here which states that if there is any chance of a technology causing catastrophic harm, and there is no scientific consensus suggesting that the harm will not occur, then those who wish to develop that technology or pursue that research must prove it to be harmless first (see Epstein 1980)[^epstein-1980]. Mark Bedau and Mark Traint argue against a too strong adherence to the precautionary principle by suggesting that instead, we should opt for moral courage in pursuing such an important step in human understanding of life (2009). They appeal to the Aristotelian notion of courage, not a headlong and foolhardy rush into the unknown, but a resolute and careful step forward into the possibilities offered by this research.
    step1: |-
      J. 克雷格·文特研究所的科学家于 2010 年 5 月成功合成了一种名为 JCVI-syn1.0 的人工细菌。媒体关注这一突破时，多聚焦于人工细菌创造的潜在伦理与社会影响。克雷格·文特本人则发起公关运动，试图引导关于创造生命之议题的讨论方向。这场生命合成的首演，让我们预尝到当更有活力、更强健的人工原始细胞被合成出来时将会激起的热忱与争议。所谓“湿”人工生命（Wet ALife）——这类研究的名称——所引发的伦理关切，其实更应归生物伦理学管辖（参见“理论与生物伦理学”词条）。但它也与我们这里的关切有些牵连，因为湿 ALife 是把生命科学理论转化为信息技术这一进程的一部分。这将趋向于模糊生物伦理学与信息伦理学的边界。正如软件 ALife 可能带来危险的恶意软件，湿 ALife 也可能带来危险的细菌或其他病原体。批评者认为，反对推进这项技术的道德论证相当有力，我们在此应适用预防原则：如果某项技术有可能造成灾难性伤害，而科学上又无共识表明该伤害不会发生，那么想开发该技术或推进该研究的人就必须先证明其无害（见 Epstein 1980）[^epstein-1980]。马克·贝多与马克·特林特（Mark Traint）反对过分死守预防原则，主张我们应改取道德勇气，推进人类理解生命的重要一步（2009）。他们诉诸亚里士多德的勇气概念：不是莽撞冒失地冲向未知，而是坚定而审慎地朝这项研究所展示的可能性迈进一步。

    step2: |-
      2010 年 5 月，J. 克雷格·文特研究所的科学家合成出一种唤作 JCVI-syn1.0 的人工细菌。媒体蜂拥报道这一突破，着眼的却多半是人工细菌之创造的潜在伦理与社会冲击。克雷格·文特本人则发起公关攻势，想把“创造生命”议题的讨论往自己的方向带。生命合成的这第一幕，让我们先尝了一口滋味：等更有活力、更皮实的人工原始细胞问世之时，热潮与争议只会更烈。这类研究唤作“湿”人工生命（Wet ALife）；它惹起的伦理关切，严格说该归生物伦理学管辖（参见“理论与生物伦理学”词条）。但它与我们此处的关切并非无涉：湿 ALife 恰是“把生命科学理论变成信息技术”这一进程的一环，而这条边界一糊，生物伦理学与信息伦理学的界线也就跟着糊了。软件 ALife 可能养出危险的恶意软件；同样，湿 ALife 也可能养出危险的细菌或其他病原体。批评者说，反对推进这项技术的道德论证相当硬，此处应祭出预防原则：技术若有一丝造成灾难性伤害的可能，而科学界又无共识担保其不会发生，那么想开发它、研究它的人，就必须先证其无害（见 Epstein 1980）[^epstein-1980]。马克·贝多与马克·特林特（Mark Traint）则反对把预防原则守得过死，主张改取道德勇气，迈出人类理解生命的重要一步（2009）。他们求助于亚里士多德的勇气概念：不是一头扎进未知的莽撞，而是朝着这项研究所敞开的种种可能，坚定而小心地向前迈一步。

