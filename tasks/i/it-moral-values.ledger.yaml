      Patrick Grim has been a longtime proponent of the idea that philosophy should utilize information technologies to automate and illustrate philosophical thought experiments (Grim et al. 1998; Grim 2004)[^grim-2004][^grim-1998]. Peter Danielson (1998) has also written extensively on this subject beginning with his book *Modeling Rationality, Morality, and Evolution* with much of the early research in the computational theory of morality centered on using computer models to elucidate the emergence of cooperation between simple software AI or ALife agents (Sullins 2005)[^sullins-2005].
    step1: |-
      帕特里克·格里姆（Patrick Grim）长期主张，哲学应当利用信息技术使哲学思想实验自动化并加以图示（Grim 等 1998; Grim 2004）[^grim-2004][^grim-1998]。彼得·丹尼尔森（Peter Danielson）（1998）对这一主题也有大量著述，始于其《理性、道德与演化的建模》（*Modeling Rationality, Morality, and Evolution*）一书；道德计算理论的早期研究多以计算机模型阐明简单软件 AI 或 ALife 行动者之间合作的涌现（Sullins 2005）[^sullins-2005]。

    step2: |-
      帕特里克·格里姆（Patrick Grim）多年鼓吹：哲学应当借信息技术让思想实验自动化、可视化（Grim 等 1998; Grim 2004）[^grim-2004][^grim-1998]。彼得·丹尼尔森（Peter Danielson）（1998）就此题也着墨甚多，发端于《理性、道德与演化的建模》（*Modeling Rationality, Morality, and Evolution*）一书；道德的计算理论早期研究，多半围着计算机模型打转——用它们阐明简单软件 AI 或 ALife 行动者之间合作如何涌现（Sullins 2005）[^sullins-2005]。

