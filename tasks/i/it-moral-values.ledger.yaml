      Lastly in this section, we must address the impact that access to information has on social justice. Information technology was largely developed in the Western industrial societies during the twentieth century. But even today the benefits of this technology have not spread evenly around the world and to all socioeconomic demographics. Certain societies and social classes have little to no access to the information easily available to those in more well-off and developed nations, and some of those who have some access have that access heavily censored by their governments. This situation has come to be called the “digital divide,” and despite efforts to address this gap, it may be growing wider. It is worth noting that as the cost of smartphones decreases these technologies are giving some access to the global internet to communities that have been shut out before (Poushter 2016)[^poushter-2016]. While much of this gap is driven by economics (see Warschauer 2003)[^warschauer-2003], Charles Ess notes that there is also a problem with the forces of a new kind of cyber-enabled colonialism and ethnocentrism that can limit the desire of those outside the industrial West to participate in this new “Global Metropolis” (Ess 2009)[^ess-2009]. John Weckert also notes that cultural differences in giving and taking offense play a role in the design of more egalitarian information technologies (Weckert 2007)[^weckert-2007]. Others argue that basic moral concerns like privacy are weighed differently in Asian cultures (Hongladarom 2008; Lü 2005)[^hongladarom-2008].
    step1: |-
      最后，本节还须讨论信息的获取对社会正义的影响。信息技术主要于二十世纪在西方工业社会发展起来。但直到今天，这项技术的好处仍未均匀地遍及世界和所有社会经济群体。某些社会和社会阶层几乎无法获取那些在较富裕发达国度唾手可得的信息，而一些有所获取的人，其获取又被本国政府严加审查。这种局面后来被称为“数字鸿沟”；尽管各方努力弥合，鸿沟或许还在加宽。值得注意的是，随着智能手机成本下降，这些技术正让一些此前被隔绝在外的群体获得接触全球互联网的机会（Poushter 2016）[^poushter-2016]。这道鸿沟固然主要由经济因素驱动（见 Warschauer 2003）[^warschauer-2003]，但查尔斯·埃斯（Charles Ess）指出，还有一股新型的、由网络助殖的殖民主义与种族中心主义的力量在作祟，它可能抑制工业西方之外的人们参与这座新的“全球都会”的意愿（Ess 2009）[^ess-2009]。约翰·韦克特（John Weckert）也指出，在冒犯与被冒犯上的文化差异，会在设计更平等的信息技术时发生作用（Weckert 2007）[^weckert-2007]。还有人论证，隐私这类基本道德关切在亚洲文化中的权重有所不同（Hongladarom 2008; Lü 2005）[^hongladarom-2008]。

    step2: |-
      本节最后要谈的，是信息获取对社会正义的冲击。信息技术大体是二十世纪在西方工业社会里发展起来的。可时至今日，这项技术的好处并未均匀洒遍全球、惠及各个社会经济群体。有些社会与社会阶层，对富庶发达国度唾手可得的信息近乎无缘；另一些有所沾及的人，接触渠道又被本国政府重重审查。这种局面后来得名“数字鸿沟”；弥合的努力虽有，鸿沟却可能越拉越宽。值得留意的是，智能手机成本一路下探，此前被隔绝在外的社群正借此获得接入全球互联网的机会（Poushter 2016）[^poushter-2016]。这道鸿沟固然多半由经济因素驱动（见 Warschauer 2003）[^warschauer-2003]，但查尔斯·埃斯（Charles Ess）指出，还有一股新式的、借网络张目的殖民主义与种族中心主义在发力，足以浇灭工业西方之外的人们投身这座新“全球都会”的热情（Ess 2009）[^ess-2009]。约翰·韦克特（John Weckert）也指出，各方文化在施予冒犯与领受冒犯上的差异，会左右更平等的信息技术的设计（Weckert 2007）[^weckert-2007]。另有人主张，隐私这类基本道德关切在亚洲文化里的权重别有分寸（Hongladarom 2008; Lü 2005）[^hongladarom-2008]。

