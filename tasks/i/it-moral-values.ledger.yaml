      The control of information is power, and in an information economy such as we find ourselves today, it may be the ultimate form of political power. We live in a world rich in data and the technology to produce, record, and store vast amounts of this data has developed rapidly. The primary moral concern here is that when we collect, store, and/or access information, it is vital that this be done in a just manner that can reasonably be seen as fair and in the best interests of all parties involved. As was mentioned above, each of us produces a vast amount of information every day that could be recorded and stored as useful data to be accessed later when needed. But moral conundrums arise when that collection, storage and use of our information is done by third parties without our knowledge or done with only our tacit consent. The social institutions that have traditionally exercised this power are things like, religious organizations, universities, libraries, healthcare officials, government agencies, banks and corporations. These entities have access to stored information that gives them a certain amount of power over their customers and constituencies. Today each citizen has access to more and more of that stored information without the necessity of utilizing the traditional mediators of that information and therefore a greater individual share of social power (see Lessig 1999)[^lessig-1999].
    step1: |-
      控制信息就是权力，在我们今天所处的信息经济中，它也许是政治权力的终极形式。我们生活在一个数据丰富的世界里，生产、记录和储存海量数据的技术发展迅速。这里的首要道德关切是：当我们收集、储存和/或获取信息时，必须以正义的方式进行，即可以合理地视为公平并符合所有相关方的最佳利益。如上所述，我们每个人每天都在产生大量信息，这些信息可以被记录并储存为有用的数据，以备日后需要时获取。但当我们的信息被第三方在我们不知情的情况下收集、储存和使用，或者仅凭我们的默许来完成时，道德难题便出现了。传统上行使这种权力的社会机构包括宗教组织、大学、图书馆、医疗保健机构、政府机构、银行和公司。这些实体可以获取储存的信息，从而对其顾客和拥护者拥有一定的权力。今天，每个公民无需借助这些信息的传统中介，就能获取越来越多的储存信息，因而个人对社会权力的份额也随之增大（见 Lessig 1999）[^lessig-1999]。

    step2: |-
      控制信息即握有权力；在我们身处的信息经济里，它甚至可能是政治权力的终极形态。我们生活的世界数据充盈，生产、记录、储存海量数据的技术一路疾进。这里头等重要的道德关切是：无论收集、储存还是获取信息，都必须做得公正——公道得让人可以合理认可，并真正照顾到所有相关方的利益。前文说过，我们每个人每天都在制造海量信息，它们可以录为有用的数据储存起来，供日后需要时调用。麻烦出在：这些收集、储存与使用若由第三方在背地里完成，或仅凭我们不明言的默许而行，道德难题便接踵而至。传统上握有这份权力的，是宗教组织、大学、图书馆、医疗部门、政府机构、银行与公司这类建制。它们可及储存的信息，由此对顾客与所辖人群握有相当的支配力。而今天，每个公民无须再经过信息的传统中介，就能触及越来越多的储存信息——个人在社会权力中的份额因此水涨船高（见 Lessig 1999）[^lessig-1999]。

