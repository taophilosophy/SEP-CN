      Artificial Life (ALife) is an outgrowth of AI and refers to the use of information technology to simulate or synthesize life functions. The problem of defining life has been an interest in philosophy since its founding. See the entry on life for a look at the concept of life and its philosophical ramifications. If scientists and technologists were to succeed in discovering the necessary and sufficient conditions for life and then successfully synthesize it in a machine or through synthetic biology, then we would be treading on territory that has a significant moral impact. Mark Bedau has been tracing the philosophical implications of ALife for some time now and argues that there are two distinct forms of ALife and each would thus have different moral effects if and when we succeed in realizing these separate research agendas (Bedau 2004; Bedau and Parke 2009)[^bedau-2004][^bedau-2009][^bedau-2009-2]. One form of ALife is completely computational and is the earliest form of ALife studied. ALife is inspired by the work of the mathematician John von Neumann on self-replicating cellular automata, which von Neumann believed would lead to a computational understanding of biology and the life sciences (1966). The computer scientist Christopher Langton simplified von Neumann’s model greatly and produced a simple cellular automata called “Loops” in the early eighties and helped get the field off the ground by organizing the first few conferences on Artificial Life (1989). Artificial Life programs are quite different from AI programs. Where AI is intent on creating or enhancing intelligence, ALife is content with very simple-minded programs that display life functions rather than intelligence. The primary moral concern here is that these programs are designed to self-reproduce and in that way resemble computer viruses and indeed successful ALife programs could become as malware vectors. The second form of ALife is much more morally charged. This form of ALife is based on manipulating actual biological and biochemical processes in such a way as to produce novel life forms not seen in nature.
    step1: |-
      人工生命（ALife）是 AI 的一个分支，指利用信息技术来模拟或合成生命功能。定义生命的问题自哲学创立以来就是哲学的兴趣所在。关于生命概念及其哲学牵连，参见“生命”词条。如果科学家与技术专家成功发现生命的充要条件，然后通过机器或合成生物学成功地合成生命，那我们将踏入具有重大道德影响的领域。马克·贝多（Mark Bedau）追踪 ALife 的哲学意涵已有时日，他论证存在两种截然不同的 ALife 形态；当我们真的实现这些各自的研究议程时，每一种都将产生不同的道德效应（Bedau 2004; Bedau and Parke 2009）[^bedau-2004][^bedau-2009][^bedau-2009-2]。一种 ALife 完全是计算性的，也是最早被研究的 ALife 形态。ALife 的灵感来自数学家约翰·冯·诺伊曼（John von Neumann）关于自我复制元胞自动机的工作，冯·诺伊曼相信这类工作将带来对生物学与生命科学的计算性理解（1966）。计算机科学家克里斯托弗·兰顿（Christopher Langton）把冯·诺伊曼的模型大大简化，在八十年代初造出一种名为“圈”（Loops）的简单元胞自动机，并通过组织最初几届人工生命会议（1989）帮助这个领域起步。人工生命程序与 AI 程序颇为不同：AI 一心创造或增强智能，ALife 则满足于展示生命功能而非智能的头脑极简单的程序。这里的首要道德关切是：这类程序被设计为自我复制，因而与计算机病毒相似；事实上，成功的 ALife 程序可能成为恶意软件的载体。第二种 ALife 形态的道德分量重得多：它以操纵真实的生物与生化过程为基础，以产出自然界未见的新型生命形式。

    step2: |-
      人工生命（ALife）从 AI 中生长出来，指的是用信息技术模拟或合成生命功能。怎么定义生命，自哲学草创起就是哲学的一块心病；生命概念及其哲学牵连，见“生命”词条。倘若科学家与技术专家真找到了生命的充要条件，进而用机器或合成生物学把生命合成出来，那我们就踏进了道德分量极重的一片领地。马克·贝多（Mark Bedau）追索 ALife 的哲学意涵已久；他论证：ALife 有两种判然有别的形态，一旦这些各自的研究议程得偿所愿，其道德效应也将各不相同（Bedau 2004; Bedau and Parke 2009）[^bedau-2004][^bedau-2009][^bedau-2009-2]。头一种 ALife 纯是计算性的，也是最早被研究的形态。它的灵感来自数学家约翰·冯·诺伊曼（John von Neumann）的自我复制元胞自动机之业——冯·诺伊曼相信这条路通向对生物学与生命科学的计算性理解（1966）。计算机科学家克里斯托弗·兰顿（Christopher Langton）把冯·诺伊曼的模型大幅简化，八十年代初做出一种唤作“圈”（Loops）的简单元胞自动机，又操办了头几届人工生命会议（1989），把这个领域扶上马。人工生命程序与 AI 程序大异其趣：AI 一门心思要造智能、增智能；ALife 只求一些头脑简单到极点的程序能显出生命功能——智能则非所问。此地头号的道德关切是：这类程序以自我复制为设计目标，与计算机病毒形貌酷似；事实上，成功的 ALife 程序完全可能沦为恶意软件的载体。第二种 ALife 的道德分量重得多：它建立在摆弄真实的生物与生化过程之上，要造出自然界从未有过的新型生命。

