    source: |-
      In addition to storing and communicating information, many information technologies automate the organizing of information as well as synthesizing or mechanically authoring or acting on new information. Norbert Wiener first developed a theory of automated information synthesis which he called *Cybernetics* (Wiener 1961 [1948])[^wiener-1961]. Wiener realized that a machine could be designed to gather information about the world and derive logical conclusions about that information which would imply certain actions, which the machine could then implement, all without any direct input from a human agent. Wiener quickly saw that if his vision of cybernetics was realized, there would be tremendous moral concerns raised by such machines and he outlined some of them in his book *The Human Use of Human Beings* (Wiener 1950)[^wiener-1950]. Wiener argued that, while this sort of technology could have drastic moral impacts, it was still possible to be proactive and guide the technology in ways that would increase the moral reasoning capabilities of both humans and machines (Bynum 2008)[^bynum-2008].
    step1: |-
      除了储存和传递信息，许多信息技术还把信息的组织自动化，也进行综合，或以机械方式创作新信息、依据新信息采取行动。诺伯特·维纳（Norbert Wiener）首先发展了一种自动信息综合理论，他称之为“控制论”（*Cybernetics*）（Wiener 1961 [1948]）[^wiener-1961]。维纳意识到，可以设计出一种机器来收集关于世界的信息，从这些信息推出逻辑结论，这些结论暗含某些行动，机器随后可以执行这些行动——全程无须人类行动者的任何直接输入。维纳很快看到，如果他的控制论愿景得以实现，这类机器将引发巨大的道德关切；他在《人有人的用处》（*The Human Use of Human Beings*）（Wiener 1950）[^wiener-1950] 一书中概述了其中的一些。维纳论证说，虽然这类技术可能带来剧烈的道德冲击，但人们仍然可以主动行事，引导技术以提升人类与机器双方道德推理能力的方式发展（Bynum 2008）[^bynum-2008]。

    step2: |-
      除了储存与传递信息，许多信息技术还把信息的组织交给自动化：或综合信息，或机械地执笔创作新信息，或依新信息采取行动。诺伯特·维纳（Norbert Wiener）率先发展出一门自动信息综合的理论，他名之曰“控制论”（*Cybernetics*）（Wiener 1961 [1948]）[^wiener-1961]。维纳意识到：完全可以设计出一种机器，让它收集关于世界的信息，从信息推出逻辑结论，结论暗含某些行动，机器随即照办——全程无须人类行动者插手。他很快预见到，控制论的愿景一旦实现，这类机器将掀起滔天的道德波澜；若干关切，他已在《人有人的用处》（*The Human Use of Human Beings*）（Wiener 1950）[^wiener-1950] 一书中勾勒。维纳的立场是：这类技术纵然可能带来剧烈的道德冲击，人仍可未雨绸缪，引导技术朝着同时提升人类与机器道德推理能力的方向走（Bynum 2008）[^bynum-2008]。

