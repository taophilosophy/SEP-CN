      The media has raised moral concerns about the way that childhood has been altered by the use of information technology (see for example Jones 2011)[^jones-2011]. Many applications are now designed specifically for babies and toddlers with educational applications or just entertainment to help keep the children occupied while their parents are busy. This encourages children to interact with computers from as early an age as possible. Since children may be susceptible to media manipulation such as advertising we have to ask if this practice is morally acceptable or not. Depending on the particular application being used, it may encourage solitary play that may lead to isolation but others are more engaging with both the parents and the children playing (Siraj-Blatchford 2010)[^siraj-blatchford-2010]. It should also be noted that pediatricians have advised that there are no known benefits to early media use amongst young children but there potential risks (Christakis 2009)[^christakis-2009]. Studies have shown that from 1998 to 2008, sedentary lifestyles amongst children in England resulted in the first measured decline in strength since World War Two (Cohen et al. 2011)[^cohen-2011]. It is not clear if this decline is directly attributable to information technology use but it may be a contributing factor. In 2018 the American Academy of Pediatrics released some simple guidelines for parents who may be trying to set realistic limits on this activity ([Tips from the American Academy of Pediatrics](https://www.healthychildren.org/English/family-life/Media/Pages/Tips-for-Parents-Digital-Age.aspx)).
    step1: |-
      媒体已就童年被信息技术使用所改变一事提出道德关切（例如见 Jones 2011）[^jones-2011]。如今许多应用专为婴儿与学步幼儿设计，有教育应用，也有纯粹的娱乐，好让孩子在父母忙碌时有人照看。这鼓励儿童从尽可能小的年纪就开始与计算机互动。儿童可能易受广告之类的媒体操纵，我们必须追问这种做法在道德上是否可接受。视所用应用而定，有的应用鼓励独自玩耍，可能导致孤立；另一些应用则更具互动性，父母与孩子可以一起玩（Siraj-Blatchford 2010）[^siraj-blatchford-2010]。还应指出，儿科医生已告诫：幼儿过早使用媒体并无已知益处，反倒有潜在风险（Christakis 2009）[^christakis-2009]。研究表明，1998 至 2008 年间，英格兰儿童久坐不动的生活方式造成自二战以来首次测得的体质下降（Cohen 等 2011）[^cohen-2011]。这一下降是否可直接归因于信息技术的使用尚不清楚，但它可能是一个促成因素。2018 年，美国儿科学会发布了简明指南，帮助试图给这项活动设定现实限度的父母（[美国儿科学会的建议](https://www.healthychildren.org/English/family-life/Media/Pages/Tips-for-Parents-Digital-Age.aspx)）。

    step2: |-
      媒体对“信息技术改写童年”一事早有道德层面的忧心（例如见 Jones 2011）[^jones-2011]。如今不少应用专为婴儿与学步儿打造：或寓教于乐，或纯供消遣，好让忙不开身的父母把孩子安顿住。这等于鼓励孩子从能多早、就多早地跟计算机打交道。儿童或许经不起广告之类的媒体操纵，这种做法在道德上可不可接受，我们必须问个明白。视应用而定：有的应用怂恿独自玩耍，日久或致孤僻；另一些应用则两代同乐，父母孩子一起玩（Siraj-Blatchford 2010）[^siraj-blatchford-2010]。还应记下儿科医生的告诫：幼儿过早接触媒体，未见其益，先见其险（Christakis 2009）[^christakis-2009]。有研究显示，1998 到 2008 年间，英格兰儿童的久坐生活造成二战以来首次测得的体能下滑（Cohen 等 2011）[^cohen-2011]。下滑能否直接算到信息技术头上，尚无定论，但它多半是推手之一。2018 年，美国儿科学会发布了一份简明指南，给那些想给这类活动定个现实限度的家长支招（[美国儿科学会的建议](https://www.healthychildren.org/English/family-life/Media/Pages/Tips-for-Parents-Digital-Age.aspx)）。

