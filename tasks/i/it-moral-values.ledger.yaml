      Social networking is a term given to sites and applications that facilitate online social interactions that typically focus on sharing information with other users referred to as “friends.” The most famous of these sites today is Facebook but there are many others, such as Instagram, Twitter (now known as X), and Snapchat, to name just a few. There are several moral values that these sites call into question. Shannon Vallor (2011, 2016) has reflected on how sites like Facebook change or even challenge our notion of friendship. Her analysis is based on the Aristotelian theory of friendship (see entry on Aristotle’s ethics). Aristotle argued that humans realize a good and true life through virtuous friendships. Vallor notes that four key dimensions of Aristotle’s ‘virtuous friendship,’ namely: reciprocity, empathy, self-knowledge, and the shared life, and that the first three are found in online social media in ways that can sometimes strengthen friendship (Vallor 2011, 2016)[^vallor-2011]. Yet she argues that social media is not yet up to the task of facilitating what Aristotle calls ‘the shared life.’ Meaning that social media can give us shared activities but not the close intimate friendship that shared daily lives can give. (Here is a more complete discussion of Aristotelian friendship). Thus these media cannot fully support the Aristotelian notion of complete and virtuous friendship by themselves (Vallor 2011)[^vallor-2011]. Vallor also has a similar analysis of other Aristotelian virtues such as patience, honesty, and empathy, and their problematic application in social media (Vallor 2010)[^vallor-2010]. Vallor has gone on to argue that both the users and designers of information technologies need to develop a new virtue that she terms “technomoral wisdom” which can help us foster better online communities and friendships (Vallor, 2016).
    step1: |-
      “社交网络”是对那些便利在线社交互动的站点与应用的称呼，这类互动通常聚焦于与其他被称为“朋友”的用户共享信息。今天最有名的是脸书（Facebook），但还有许多其他站点，如 Instagram、Twitter（今称 X）和 Snapchat，姑举数例。这些站点对若干道德价值提出了疑问。香农·瓦洛尔（Shannon Vallor）（2011, 2016）思考了脸书这类站点如何改变甚至挑战我们对友谊的观念。她的分析基于亚里士多德的友谊理论（参见“亚里士多德伦理学”词条）。亚里士多德主张，人通过有德性的友谊实现良好而真实的生活。瓦洛尔指出亚里士多德“有德性的友谊”的四个关键维度：互惠、共感、自我认识与共同生活；前三维可以在在线社交媒体中找到，有时还能巩固友谊（Vallor 2011, 2016）[^vallor-2011]。但她论证说，社交媒体尚不足以促成亚里士多德所谓“共同生活”；意思是，社交媒体能给我们共同的活动，却给不了共同生活所能给予的那种亲密无间的友谊（关于亚里士多德式友谊，这里有更完备的讨论）。因此，单凭这些媒介，亚里士多德那里完整而有德性的友谊观念无法得到充分支撑（Vallor 2011）[^vallor-2011]。瓦洛尔对耐心、诚实、共感等其他亚里士多德式德性及其在社交媒体中的成问题的运用也有类似分析（Vallor 2010）[^vallor-2010]。她进一步论证，信息技术的用户与设计者都需要培养一种新德性，她称之为“技术道德智慧”（technomoral wisdom），它有助于我们营造更好的在线社区与友谊（Vallor, 2016）。

    step2: |-
      “社交网络”是个名号，赠给了那些便利在线社交往来的站点与应用；这类互动通常围着与“朋友”——即其他用户——共享信息打转。如今名气最响的是脸书（Facebook），但其余也不少：Instagram、Twitter（今名 X）、Snapchat，姑举数例。这些站点把好些道德价值推上了被审问的位置。香农·瓦洛尔（Shannon Vallor）（2011, 2016）细想过脸书这类站点如何改动、乃至挑战我们对友谊的观念。她的分析立在亚里士多德的友谊理论之上（参见“亚里士多德伦理学”词条）。亚里士多德主张，人要靠有德性的友谊来实现良好而真实的生活。瓦洛尔点出亚里士多德“有德性的友谊”的四个关键维度——互惠、共感、自我认识与共同生活——并指出前三维在在线社交媒体里找得到，有时还真能巩固友谊（Vallor 2011, 2016）[^vallor-2011]。但她论证：社交媒体还没本事促成亚里士多德所谓“共同生活”；换句话说，社交媒体给得了我们共同的活动，却给不了共同生活才给得了的那份贴身的亲密友谊（亚里士多德式友谊另有更完备的讨论）。是以，单凭这些媒介，撑不起亚里士多德那里完整而有德性的友谊（Vallor 2011）[^vallor-2011]。瓦洛尔对耐心、诚实、共感这类亚里士多德式德性及其在社交媒体上的别扭应用，做过如出一辙的分析（Vallor 2010）[^vallor-2010]。她再进一步：信息技术的用户与设计者都得培养一种新德性——她名之曰“技术道德智慧”（technomoral wisdom）——它能帮我们把在线社区与友谊经营得更好（Vallor, 2016）。

