      For argument’s sake, assume Turing is correct even if he is off in his estimation of when AI will succeed in creating a machine that can converse with you. Yale professor David Gelernter worries that that there would be certain uncomfortable moral issues raised. “You would have no grounds for treating it as a being toward which you have moral duties rather than as a tool to be used as you like” (Gelernter 2007)[^gelernter-2007]. Gelernter suggests that consciousness is a requirement for moral agency and that we may treat anything without it in any way that we want without moral regard. Sullins (2006) counters this argument by noting that consciousness is not required for moral agency. For instance, nonhuman animals and the other living and nonliving things in our environment must be accorded certain moral rights, and indeed, any Turing capable AI would also have moral duties as well as rights, regardless of its status as a conscious being (Sullins 2006)[^sullins-2006].
    step1: |-
      为论证起见，姑且假定图灵是对的，即便他对 AI 何时能造出可与你对话的机器估计有误。耶鲁教授大卫·盖伦特（David Gelernter）担心，这将引发某些令人不安的道德问题：“你将没有任何理由把它当作一个你对其负有道德义务的存在者，而不把它当作一件随你使用的工具”（Gelernter 2007）[^gelernter-2007]。盖伦特提示，意识是道德行动者的必要条件，对于没有意识的任何东西，我们可以随意处置，无须道德上的顾忌。萨林斯（2006）反驳这一论证，指出道德行动者并不需要意识。例如，非人类动物以及我们环境中的其他生物与非生物，都必须被授予某些道德权利；事实上，任何具备图灵能力的 AI 也将拥有道德义务与权利，无论它是否是有意识的存在（Sullins 2006）[^sullins-2006]。

    step2: |-
      为论证方便，姑且认下图灵——哪怕他对 AI 何时造得出能与你对谈的机器估计失准。耶鲁教授大卫·盖伦特（David Gelernter）担心，这会牵出几桩让人如坐针毡的道德问题：“你将再无理由把它当作你对其负有道德义务的存在者，而只能把它当作一件随你使唤的工具”（Gelernter 2007）[^gelernter-2007]。照盖伦特的说法，意识是道德行动者的门槛；没有意识的东西，我们尽可随意处置，谈不上道德上的顾忌。萨林斯（2006）反唇相驳：道德行动者并不以意识为前提。比如，非人类动物，乃至我们环境中的其他生物与非生物，都必须被授以若干道德权利；果真如此，任何具备图灵能力的 AI 也同样兼有道德义务与道德权利——无论它算不算有意识的存在（Sullins 2006）[^sullins-2006]。

