      这些系统通常并非有意明着侵犯个人隐私，但由于这类服务一般免费，服务商有强烈的经济动力去收割至少一些用户在站内的活动信息，卖给广告商做定向营销。这种营销可以这样进行：服务商只出售对已匿名化的用户数据的访问权，广告商由此知道这位用户可能想买一条牛仔裤，却得不到这个人的确切身份。这样一来，社交网络服务商既能设法为其用户守住隐私这一道德价值，又能继续靠把用户与广告商撮合起来牟利。

