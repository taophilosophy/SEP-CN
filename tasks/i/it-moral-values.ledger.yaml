      Information technologies have an interesting growth pattern that has been observed since the founding of the industry. Intel engineer Gordon E. Moore noticed that the number of components that could be installed on an integrated circuit doubled every year for a minimal economic cost and he thought it might continue that way for another decade or so from the time he noticed it in 1965 (Moore 1965)[^moore-1965]. History has shown his predictions were rather conservative. This doubling of speed and capabilities along with a halving of costs to produce it has roughly continued every eighteen months since 1965 and is likely to continue. This phenomenon is not limited to computer chips and can also be found in many different forms of information technologies. The potential power of this accelerating change has captured the imagination of the noted inventor and futurist Ray Kurzweil. He has famously predicted that if this doubling of capabilities continues and more and more technologies become information technologies, then there will come a point in time where the change from one generation of information technology to the next will become so massive that it will change everything about what it means to be human. Kurzweil has named this potential event “the Singularity” at which time he predicts that our technology will allow us to become a new post-human species (2006). If this is correct, there could be no more profound change to our moral values. There has been some support for this thesis from the technology community with institutes such as the Acceleration Studies Foundation, Future of Humanity Institute, and H+.[^note-2] Reaction to this hypothesis from philosophers has been mixed but largely critical. For example, Mary Midgley (1992) argues that the belief that science and technology will bring us immortality and bodily transcendence is based on pseudoscientific beliefs and a deep fear of death. In a similar vein Sullins (2000) argues that there is often a quasi-religious aspect to the acceptance of transhumanism that is committed to certain outcomes such as the uploading of human consciousness into computers as a way to achieve immortality, and that the acceptance of the transhumanist hypothesis influences the values embedded in computer technologies, which can be dismissive or hostile to the human body.
    step1: |-
      信息技术有一种有趣的增长模式，自行业奠基以来就被人观察到。英特尔工程师戈登·E. 摩尔（Gordon E. Moore）注意到，一块集成电路上可安装的元件数量每年翻一番，而经济成本极小；他认为，从他 1965 年注意到这一点起，这种态势可能再持续十年左右（Moore 1965）[^moore-1965]。历史证明他的预测相当保守。这种速度与能力的倍增，连同生产成本减半，自 1965 年以来大体每十八个月延续一次，而且很可能继续下去。这一现象不限于计算机芯片，也可以在许多其他形式的信息技术中找到。这种加速变化的潜在力量，抓住了著名发明家与未来学家雷·库兹韦尔（Ray Kurzweil）的想象力。他有名的预测是：如果这种能力倍增继续下去，越来越多的技术变成信息技术，那么终有一刻，信息技术从一代到下一代的变迁会如此巨大，以至于改变作为人类意味着什么的一切。库兹韦尔把这个潜在事件命名为“奇点”（the Singularity）；他预测，届时我们的技术将让我们成为一个新的后人类物种（2006）。如果这是正确的，那么对我们的道德价值而言，再没有比这更深刻的改变了。技术界对这一论题已有一些支持，加速研究基金会、人类未来研究所、H+ 等机构即是[^note-2]。哲学家对这一假说的反应毁誉参半，但以批评为主。例如，玛丽·米奇利（Mary Midgley）（1992）论证，科学与技术将带给我们永生与身体超越的信念，立足于伪科学的信念和对死亡的深深恐惧。萨林斯（2000）以相近的笔调论证，超人类主义的接受往往带有准宗教的一面——它执着于把人类意识上传到计算机以实现永生这类特定结果；而对超人类主义假说的接受，影响着植入计算机技术中的价值，这些价值可能蔑视乃至敌视人体。

    step2: |-
      信息技术的增长轨迹颇为耐人寻味，自这个行业奠基起就有人留意。英特尔工程师戈登·E. 摩尔（Gordon E. Moore）注意到：一块集成电路上装得下的元件数每年翻番，而所费经济成本微乎其微；他估计，自他 1965 年发现这一点算起，这般势头大约还能再走十年（Moore 1965）[^moore-1965]。历史证明，他的预言实在偏于保守。速度与能力翻番、制造成本折半，自 1965 年以来大体每十八个月续一轮，多半还会续下去。这股风并不限于计算机芯片，形形色色的信息技术里都见得到。这股加速变化的潜在伟力，迷住了大名鼎鼎的发明家兼未来学家雷·库兹韦尔（Ray Kurzweil）。他有名的预言是：能力倍增若不停步，越来越多的技术又纷纷化作信息技术，那么终有一刻，信息技术代与代之间的更迭将大到足以改写“作为人意味着什么”的全部内涵。库兹韦尔把这个潜在事件唤作“奇点”（the Singularity）：他预言，届时我们的技术将使我们蜕变为一个全新的后人类物种（2006）。倘若果真如此，我们的道德价值便再无更深刻的变革可言。技术界对这一论题不乏声援，加速研究基金会、人类未来研究所、H+ 等机构即是[^note-2]。哲学家对这一假说的反应有捧有贬，贬者居多。比如玛丽·米奇利（Mary Midgley）（1992）论证：科学与技术将赐我们永生与身体超越——这份信念的根子是伪科学与对死亡的深深恐惧。萨林斯（2000）同调相和：超人类主义的接纳常带准宗教的气味，它一口咬定若干结果——把人类意识上传到计算机以求不朽即是一例；接纳超人类主义假说，还会渗入计算机技术内嵌的价值里，这些价值可以蔑视乃至仇视人的肉身。

