      The philosopher Shannon Vallor critiques the cult of transparency as a version of what she calls the “Technological Transparency Paradox” (Vallor, 2016). She notes that those in favor of developing technologies to promote radically transparent societies do so under the premise that this openness will increase accountability and democratic ideals. But the paradox is that this cult of transparency often achieves just the opposite with largely unaccountable organizations that are not democratically chosen holding information that can be used to weaken democratic societies. This is due to the asymmetrical relationship between the user and the companies with whom she shares all the data of her life. The user is, indeed radically open and transparent to the company, but the algorithms used to mine the data and the identity of third parties that this data is shared with is opaque and not subject to accountability. We, the users of these technologies, are forced to be transparent but the companies profiting off our information are not required to be equally transparent.
    step1: |-
      哲学家香农·瓦洛尔批评透明崇拜，视之为她所谓“技术透明性悖论”的一个版本（Vallor, 2016）。她指出，支持开发技术以促成彻底透明社会的人，其前提是：这种开放将增进问责与民主理想。但悖论在于，这种透明崇拜往往恰恰达成相反的结果：几乎无须问责、也非民主遴选的组织，握着足以削弱民主社会的信息。症结在用户与公司之间不对称的关系——用户把自己生活的全部数据都交给了公司。用户对公司确实彻底开放、彻底透明；但用来开采数据的算法，以及数据共享给的第三方的身份，却是不透明的、不受问责的。我们这些技术的用户被迫透明，而靠我们的信息牟利的公司却无须同样透明。

    step2: |-
      哲学家香农·瓦洛尔把透明崇拜批作她所谓“技术透明性悖论”的一个变种（Vallor, 2016）。她指出：主张开发技术以推动彻底透明社会的人，立论的前提是这种开放能增进问责、光大民主理想。可悖论偏偏在此：透明崇拜时常落得个相反的结局——一群几乎无须问责、也非民选的组织，攥着足以削弱民主社会的信息。根子在用户与公司之间那道不对称：用户把自家生活的全部数据都交了出去。用户对公司确实敞得彻底、透得彻底；可用来掘取数据的算法，以及数据所共享的第三方的身份，偏偏一概黑箱、不受问责。我们这些用户被迫透明，靠我们的信息坐地生金的公司，却没人要求它们同样透明。

