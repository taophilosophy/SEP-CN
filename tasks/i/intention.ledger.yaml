      If we hope to defend an evaluative theory of intention, despite this possibility, we will have to equate intending with judgement of some other evaluative proposition, not entailed by claims about the balance of reasons (as in Rödl 2007, Ch. 2)[^rödl-2007], distinguish kinds of judgement or ways of representing an action as to be done, one of which constitutes intending, the other of which we act against in *akrasia* (as in Tenenbaum 2007, Ch. 7)[^tenenbaum-2007], or otherwise weaken the relationship between intention and the good (as in Shah 2008). Whichever way we go, we will need to motivate the evaluative theory. What is it about the role of intention in intentional action, or in practical reasoning, that requires it to take an evaluative shape? What is missing from theories of intention on which it does not?
