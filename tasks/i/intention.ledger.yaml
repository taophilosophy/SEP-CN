      Reactions to this problem vary widely. Those who restrict the content of intention to what is in progress and emphasize how little is involved in being embarked on intentional action may suggest that the beliefs in question verify themselves. It is sufficient for doing *A* intentionally, in the relevant sense, that one intends to do it. As we saw in section 1, however, there are reasons to doubt this sufficiency. And the view seems to deflate the interest of practical knowledge. Anscombe warns against the ‘false avenue of escape’ on which ‘I really “do” in the intentional sense whatever I think I am doing’ (Anscombe 1963, p. 52)[^anscombe-1963], and seems to allow for practical knowledge of what I will actually do or what I have done (Moran 2004: 146; Setiya 2016a; Haase 2018)[^haase-2018][^moran-2004][^setiya-2016a].
    step1: |-
      对此问题的反应差别很大。那些把意图内容限于进行中之事、并强调已着手有意行动所涉甚少的人，可能提出：相关信念自我证实。在相关意义上，有意做 *A* 的充分条件就是意图做它。然而如第 1 节所见，有理由怀疑这一充分性。且该观点似乎贬低了实践知识的趣味。安斯库姆警告不要走上“虚假的逃路”——“凡我以为自己在做的事，我就真的在有意意义上‘做’了”（Anscombe 1963, p. 52）[^anscombe-1963]——她似乎也容许对我实际将做或将已做之事的实践知识（Moran 2004: 146; Setiya 2016a; Haase 2018）[^haase-2018][^moran-2004][^setiya-2016a]。
