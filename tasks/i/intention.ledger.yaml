      Reactions to causal deviance vary widely. Some are convinced that the problem is hopeless (Anscombe 1989, pp. 110–1; Wilson 1989, Ch. 9; O’Brien 2007, Ch. 8)[^anscombe-1989][^o’brien-2007][^wilson-1989]. Others aim to solve it by distinguishing deviance in the causation of non-basic actions, performed by intentional means, from deviance in basic intentional action. The former happens when things do not happen as we planned; the latter can be solved by appeal to forms of causal direction or guidance found outside the province of intentional action (Thalberg 1984; Mele 1992, Ch. 11; Setiya 2007a, pp. 31–2, Hyman 2014)[^hyman-2014][^mele-1992][^setiya-2007a][^thalberg-1984]. But the existence of basic intentional actions is disputed (Lavin 2013)[^lavin-2013], as is their internal structure or teleology (Valaris 2015; Small 2019)[^small-2019][^valaris-2015].
    step1: |-
      对因果偏离的反应差别很大。有人认为问题无望（Anscombe 1989, pp. 110–1; Wilson 1989, Ch. 9; O’Brien 2007, Ch. 8）[^anscombe-1989][^o’brien-2007][^wilson-1989]。有人则试图区分：通过有意手段完成的非基本行动中的偏离，与基本有意行动中的偏离。前者发生于事情未按计划发生；后者可诉诸有意行动领域之外的因果方向或引导形式来解决（Thalberg 1984; Mele 1992, Ch. 11; Setiya 2007a, pp. 31–2, Hyman 2014）[^hyman-2014][^mele-1992][^setiya-2007a][^thalberg-1984]。但基本有意行动是否存在本身有争议（Lavin 2013）[^lavin-2013]，其内部结构或目的论亦然（Valaris 2015; Small 2019）[^small-2019][^valaris-2015]。
    step2: |-
