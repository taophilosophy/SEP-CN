      There is variation even among those accounts that give a motivational role to belief. On Velleman’s early view, intentions are ‘self-fulfilling expectations that are motivated by a desire for their fulfillment and that represent themselves as such’ (Velleman 1989, p. 109)[^velleman-1989]. Such expectations interact with a general desire for self-knowledge to motivate action by which they are confirmed. More recently, Velleman has replaced the desire for self-knowledge with a sub-personal aim or disposition (Velleman 2000: 19–21)[^velleman-2000]. Either way, his view threatens to generate what Bratman (1991, pp. 261–2) calls ‘the problem of promiscuity’: in attributing a general tendency that motivates us to conform to our own expectations, it predicts that we will be just as strongly motivated by beliefs that do not constitute intentions, like the belief that I am going to trip over the step, or mispronounce a word.
    step1: |-
      即便在赋予信念以动机角色的说明之间也有差异。按维尔曼早期观点，意图是“自我实现的预期，它们由对其实现的欲求所驱动，并把自身表征为如此”（Velleman 1989, p. 109）[^velleman-1989]。这类预期与一般的自我知识欲求互动，驱动那些证实它们的行动。晚近，维尔曼以次人格层面的目标或倾向取代自我知识欲求（Velleman 2000: 19–21）[^velleman-2000]。无论如何，其观点有产生布拉特曼（1991, pp. 261–2）所称“无差别问题”之险：由于它归予我们一种使我们依自己预期行动的一般倾向，它便预测：那些不构成意图的信念也会同样强烈地驱动我们，如“我会在台阶上绊倒”或“我会读错一个词”的信念。
    step2: |-
      即便在赋予信念以动机角色的说明之间也有差异。按维尔曼早期观点，意图是“自我实现的预期，它们由对其实现的欲求所驱动，并把自身表征为如此”（Velleman 1989, p. 109）[^velleman-1989]。这类预期与一般的自我知识欲求互动，驱动那些证实它们的行动。晚近，维尔曼以次人格层面的目标或倾向取代自我知识欲求（Velleman 2000: 19–21）[^velleman-2000]。无论如何，其观点有产生布拉特曼（1991, pp. 261–2）所称“无差别问题”之险：由于它归予我们一种使我们依自己预期行动的一般倾向，它便预测：那些不构成意图的信念也会同样强烈地驱动我们，如“我会在台阶上绊倒”或“我会读错一个词”的信念。
