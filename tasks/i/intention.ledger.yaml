      Bratman (1987) argues that these advantages are best secured if our intentions are consistent with one another and with our beliefs, if they conform to principles of means-end coherence—for instance, that when we intend *E* and believe that intending *M* is necessary to achieve *E*, we also intend *M*, and if they are resistant to reconsideration. There is, he claims, a ‘pragmatic rationale’ for such requirements, ‘one grounded in [their] long-run contribution to getting what we (rationally) want’ (Bratman 1987, p. 35)[^bratman-1987].
