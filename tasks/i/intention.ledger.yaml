      A related objection is that we can fail to act, or intend, in accordance with our evaluations. In a typical case of *akrasia*, I conclude that I ought to quit, but decide to continue smoking instead. Davidson (1970) replied to this by distinguishing ‘all things considered’ from ‘unconditional’ evaluative judgement. In ‘conditional’ or ‘prima facie’ judgements one takes some body of considerations, *r*, to support *A* over *B*. All things considered judgement is the special case of this in which *r* includes all the considerations one holds relevant. There is no inconsistency in judging that the sum of these particular considerations favours *A* over *B* while judging that *B* is better than *A*, perhaps in light of other facts one has not explicitly considered. Since it is the latter judgement that constitutes intention, one can act intentionally against the former. This is how Davidson makes sense of my continuing to smoke.
    step1: |-
      相关反对是：我们可能不按自己的评价行动或意图。在典型的 *akrasia* 情形中，我断定自己应当戒烟，却决定继续抽。戴维森（1970）通过区分“考虑一切之后”的评价判断与“无条件”评价判断来回应。在“有条件”或“ prima facie”判断中，人取某组考虑 *r* 支持 *A* 胜过 *B*。“考虑一切之后”的判断是其中特例：*r* 包含人认为相关的全部考虑。断定这些特定考虑的总和力挺 *A* 胜过 *B*，同时断定 *B* 比 *A* 更好（也许依据人未明确考虑的其他事实），并不矛盾。既然构成意图的是后一判断，人就可以有意地违背前一判断行动。戴维森由此说明我为何继续抽烟。
