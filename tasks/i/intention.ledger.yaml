      An alternative view identifies intention with the unconditional judgement that a given action is no less desirable than others. It thus permits me to intend either of two equivalent options. The problem is that it permits me to intend *both* options, even if I know that they are incompatible. Against this, Bratman claims that it is irrational to intend *A* and intend *B* if one cannot rationally intend *A*-and-*B*, as when doing both is inconsistent with one’s beliefs (Bratman 1985, §(Bratman 1985, §V)[^bratman-1985].
