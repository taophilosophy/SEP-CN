      A more subtle line would concede that we do not always use the progressive quite so liberally, but insist that doing so carves nature at its joints. According to Michael Thompson (2008, pp. 91–2, 133–46), intending to do *A* is not a mental state because it is not static; instead it is a form of imperfectivity or being in progress towards the intentional completion of an act, where the progress may be so vestigial or ineffectual or interrupted that it would be odd to remark, ‘He is doing *A*.’ (See Thompson 2008, pp. 91–2, 133–45; Moran and Stone 2009, pp. 146–8; Ferrero 2017; Russell 2018.)[^ferrero-2017][^moran-2009][^russell-2018][^thompson-2008] The unity of prospective intention and ‘doing *A* intentionally’ is that the latter, too, consists of being in progress, though perhaps with the implication of some success.
    step1: |-
      更微妙的路线会承认我们并不总把进行式用得如此宽松，但坚持这样做才切中自然关节。按迈克尔·汤普森（2008, pp. 91–2, 133–46），打算做 *A* 不是心理状态，因为它不是静态的；它是不完全性、或处于朝向行动之有意完成的进行之中，而这种进展可能极其退化、无效或中断，以至于说“他正在做 *A*”会显得古怪。（见 Thompson 2008, pp. 91–2, 133–45; Moran and Stone 2009, pp. 146–8; Ferrero 2017; Russell 2018。）[^ferrero-2017][^moran-2009][^russell-2018][^thompson-2008] 面向未来的意图与“有意做 *A*”的统一在于：后者同样在于处于进行之中，尽管也许带有某种成功的含义。
    step2: |-
