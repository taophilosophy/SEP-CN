      Other views account for knowledge in intention in reliabilist terms: where one’s intention to do *A* reliably issues in doing *A*, it may amount to knowledge of what one is doing, or what one is going to do (Newstead 2006, §2; Velleman 2007, §5)[^newstead-2006][^velleman-2007]. Non-reliabilists may dismiss the need for *prior* evidence, holding that we are entitled to form a belief if we know that it will be true, and that we will have sufficient evidence for its truth, once formed; this condition can be met when we form an intention to act (Harman 1976, p. 164, n. 8; Velleman 1989, pp. 56–64)[^harman-1976][^velleman-1989]. So long as I know what I intend, and that my intention will be effective, I have sufficient evidence for what I am doing, or what am I going to do, even though this evidence did not precede the forming of my intention.
    step1: |-
      另一些观点以可靠主义方式解释意图中的知识：当人做 *A* 的意图可靠地引出做 *A*，它便可算作对自己正在做什么或将要做什么的知识（Newstead 2006, §2; Velleman 2007, §5）[^newstead-2006][^velleman-2007]。非可靠主义者可否认需要*先在*证据，主张：若我们知道某信念将为真，且一旦形成便会有充分证据支持其真，我们就有权形成它；形成行动意图时可满足此条件（Harman 1976, p. 164, n. 8; Velleman 1989, pp. 56–64）[^harman-1976][^velleman-1989]。只要我知道自己的意图是什么，且知道该意图会有效，我就有充分证据支持自己正在做或将要做什么，尽管这证据先于意图形成并不存在。
