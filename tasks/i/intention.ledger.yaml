      Having criticized Davidson’s theory, Bratman offers a diagnosis of his mistake that appeals to the functional role of intention as a mental state. According to Bratman (1985, §VI), Davidson neglects the place of prospective intentions in cross-temporal and inter-personal coordination, and as inputs to further practical thought. There is room for doubt about this verdict, since all-out evaluative judgement may well appear as a premise of practical syllogism (‘I ought to do *A*; doing *B* is a means to that; so I ought to do *B*’) and since it may sustain ‘diachronic autonomy,’ at least to some extent, just through the working of memory (a point emphasized by Ferrero 2006)[^ferrero-2006]. But Bratman is right to indicate a gap in Davidson’s story, which he has done more than anyone to fill.
    step1: |-
      批评戴维森理论之后，布拉特曼给出一种诊断，诉诸意图作为心理状态的功能角色。按布拉特曼（1985, §VI），戴维森忽视了面向未来的意图在跨时间、人际协调中的作用，以及作为进一步实践思想输入的作用。这一判定有可怀疑之处：全盘评价判断完全可以作为实践三段论的前提出现（“我应当做 *A*；做 *B* 是达致它的手段；所以我应当做 *B*”），也可仅凭记忆的作用而维持“跨时间自主”，至少在某种程度上如此（Ferrero 2006 强调此点）[^ferrero-2006]。但布拉特曼正确指出戴维森故事中的缺口，而他比任何人贡献都大，填补了这个缺口。
