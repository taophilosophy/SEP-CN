      If intention involves belief, what more does it require? On the simplest proposal, to intend an action is to believe that one will perform it and to have an appropriate guiding desire (Audi 1973, p. 395)[^audi-1973]. But a mere conjunction seems insufficient: the desire and belief could be utterly unrelated (Davis 1984, pp. 141–2)[^davis-1984]. This prompts the suggestion that, when *S* intends to do *A*, his belief rests on his desire: to intend an action is to believe that one will perform it on the ground that one wants to do so (Davis 1984, p. 147; see also Grice 1971, pp. 278–9)[^davis-1984][^grice-1971]. The principal defect of this account is that it makes the belief component of intention epiphenomenal. This belief merely registers one’s activity: the motivational work is done by a prior desire. (Something similar is true on more subtle theories that divorce the motivational role of intention from belief; as, for instance, Ross 2009, pp. 250–1.)[^ross-2009] If the claim that intention involves belief is to capture the essence of the will, not a superficial fact about the word ‘intend,’ the belief must be implicated in the functions of intending and the explanation of action. (For objections of this kind, see Bratman 1987, pp. 19–20 and Mele 1992, Ch. 8 on ‘intention*’; on the role of beliefs in planning for the future, see Velleman 1989, Ch. 8; Velleman 2007; Marušić and Schwenkler 2018, §2.3; Alonso 2020; Alonso 2021.)[^alonso-2020][^alonso-2021][^bratman-1987][^marušić-2018][^mele-1992][^velleman-1989][^velleman-2007]
    step1: |-
      若意图涉及信念，它还需要什么？按最简单提议，意图一个行动就是相信自己将执行它，并具有恰当的引导性欲求（Audi 1973, p. 395）[^audi-1973]。但单纯合取似乎不够：欲求与信念可能毫不相干（Davis 1984, pp. 141–2）[^davis-1984]。这引出建议：当 *S* 打算做 *A* 时，其信念基于其欲求——意图一个行动就是基于自己想要做它而相信自己将做它（Davis 1984, p. 147; 另见 Grice 1971, pp. 278–9）[^davis-1984][^grice-1971]。此说明的主要缺陷，是使意图的信念成分成为副现象。该信念只登记人的活动；动机工作由先在欲求完成。（更微妙的、把意图的动机角色与信念分开的理论也类似；如 Ross 2009, pp. 250–1。）[^ross-2009] 若“意图涉及信念”要捕捉意志的本质，而非关于“打算”一词的表面事实，信念就必须参与意图的功能与行动的解释。（此类反对见 Bratman 1987, pp. 19–20 与 Mele 1992, Ch. 8 关于“意图*”；关于信念在未来计划中的作用，见 Velleman 1989, Ch. 8; Velleman 2007; Marušić and Schwenkler 2018, §2.3; Alonso 2020; Alonso 2021。）[^alonso-2020][^alonso-2021][^bratman-1987][^marušić-2018][^mele-1992][^velleman-1989][^velleman-2007]
    step2: |-
      若意图涉及信念，它还需要什么？按最简单提议，意图一个行动就是相信自己将执行它，并具有恰当的引导性欲求（Audi 1973, p. 395）[^audi-1973]。但单纯合取似乎不够：欲求与信念可能毫不相干（Davis 1984, pp. 141–2）[^davis-1984]。这引出建议：当 *S* 打算做 *A* 时，其信念基于其欲求——意图一个行动就是基于自己想要做它而相信自己将做它（Davis 1984, p. 147; 另见 Grice 1971, pp. 278–9）[^davis-1984][^grice-1971]。此说明的主要缺陷，是使意图的信念成分成为副现象。该信念只登记人的活动；动机工作由先在欲求完成。（更微妙的、把意图的动机角色与信念分开的理论也类似；如 Ross 2009, pp. 250–1。）[^ross-2009] 若“意图涉及信念”要捕捉意志的本质，而非关于“打算”一词的表面事实，信念就必须参与意图的功能与行动的解释。（此类反对见 Bratman 1987, pp. 19–20 与 Mele 1992, Ch. 8 关于“意图*”；关于信念在未来计划中的作用，见 Velleman 1989, Ch. 8; Velleman 2007; Marušić and Schwenkler 2018, §2.3; Alonso 2020; Alonso 2021。）[^alonso-2020][^alonso-2021][^bratman-1987][^marušić-2018][^mele-1992][^velleman-1989][^velleman-2007]
