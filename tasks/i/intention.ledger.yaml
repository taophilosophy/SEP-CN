      Corresponding issues have been pursued in the philosophy of perception, where causal and disjunctive theories are often opposed (as by Snowdon 1980–1)[^snowdon-1980], and in epistemology more broadly. Instead of explaining knowledge as belief that meets further conditions, some epistemologists treat knowledge as basic, explaining mere belief as its defective form (McDowell 1995; Williamson 2000)[^mcdowell-1995][^williamson-2000]. The parallel view of intentional action treats mere intending as a defective form of intentional action (O’Brien 2007; Rödl 2007, Ch. 2; McDowell 2010, §7; Marcus 2012, Ch. 2; Levy 2021)[^levy-2021][^marcus-2012][^mcdowell-2010][^o’brien-2007][^rödl-2007]. A question for this view is how the state of intending can be a form of something dynamic: the event or process of acting. To answer this question, we need to say more about the kind of state intention is.
    step1: |-
      相应问题在知觉哲学中已被追讨，那里因果理论与析取理论常相对立（如 Snowdon 1980–1）[^snowdon-1980]；在更广的认识论中亦然。一些认识论者不把知识解释为满足进一步条件的信念，而把知识视为基本，把单纯信念解释为其缺陷形式（McDowell 1995; Williamson 2000）[^mcdowell-1995][^williamson-2000]。有意行动的平行观点把单纯意图视为有意行动的缺陷形式（O’Brien 2007; Rödl 2007, Ch. 2; McDowell 2010, §7; Marcus 2012, Ch. 2; Levy 2021）[^levy-2021][^marcus-2012][^mcdowell-2010][^o’brien-2007][^rödl-2007]。此观点面临的问题是：意图状态怎能是某种动态之物——行动的事件或过程——的形式？要回答，需进一步说明意图是何种状态。
