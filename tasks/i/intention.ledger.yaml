      One source of concern about intention as efficient cause is that intention need not precede intentional action, while causes must precede their effects. But causal theorists may deny that claim about the temporality of causes, conceiving intention as the simultaneous, sustaining cause of what one is doing (Thalberg 1984, pp. 257–8; Setiya 2007a, pp 56–9)[^setiya-2007a][^thalberg-1984].
    step1: |-
      对意图作为动力因的一种担忧是：意图不必先于有意行动，而原因必须先于结果。但因果论者可否认关于原因时间性的说法，把意图设想为与行动同时的持续原因（Thalberg 1984, pp. 257–8; Setiya 2007a, pp 56–9）[^setiya-2007a][^thalberg-1984]。
