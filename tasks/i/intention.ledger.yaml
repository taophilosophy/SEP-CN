      Few have been convinced by Davidson’s account. Can’t we act—intentionally and without self-contradiction—against an unconditional evaluative judgement? Or fail to intend in accordance with one? (McDowell 2010 is a recent critic of Davidson on this score; Chislenko 2020 argues that *akrasia* involves contradictory beliefs.)[^chislenko-2020][^mcdowell-2010] Davidson himself concedes that ‘*A* is better than *B*, all things considered’ entails ‘*A* is better than *B*’ if ‘all things considered’ means ‘all truths, moral and otherwise’ (Davidson 1970, p. 40)[^davidson-1970]. He may intend this to be trivial, counting that fact that *A* is better than *B* among the relevant truths. But it is both plausible and non-trivial to claim that *A* is better than *B*, in the relevant sense, if and only if the balance of reasons favours *A* over *B*, where the reasons are distinct from that evaluative fact. If it is possible to grasp this connection, to hold that the balance of reasons favours quitting, and still not intend to quit, Davidson’s theory must be false. (A consequence of this fact is the need to distinguish weakness as *akrasia*, or acting against one’s better judgement, from weakness as a failure of will; see Holton 2009, Ch. 4.)[^holton-2009]
    step1: |-
      很少人被戴维森的说明说服。我们难道不能——有意地、且不自相矛盾地——违背无条件评价判断行动吗？或不能未能按其形成意图吗？（McDowell 2010 是新近批评者；Chislenko 2020 主张 *akrasia* 涉及矛盾信念。）[^chislenko-2020][^mcdowell-2010] 戴维森自己承认：若“考虑一切之后”指“一切真理，道德的与其他方面的”，则“考虑一切之后，*A* 比 *B* 更好”蕴含“*A* 比 *B* 更好”（Davidson 1970, p. 40）[^davidson-1970]。他也许想把这视为琐屑，把“*A* 比 *B* 更好”这一事实算作相关真理之一。但如下主张既可信又非琐屑：在相关意义上，*A* 比 *B* 更好，当且仅当理由的权衡支持 *A* 胜过 *B*，而理由不同于该评价事实。若能把握这一联系、坚持理由权衡支持戒烟，却仍不打算戒烟，戴维森的理论必假。（其后果之一，是须区分作为 *akrasia* 的意志薄弱——违背自己更好判断行动——与作为意志失败的薄弱；见 Holton 2009, Ch. 4。）[^holton-2009]
