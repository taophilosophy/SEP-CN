      The force of this objection is unclear. While there is something wrong with an account of what it is to φ that appeals to being or doing φ, it is not so obviously problematic to appeal to mental states that *represent* something as being or doing φ. Our task is not to introduce the concept of intentional action to someone who lacks that concept, but to spell out the metaphysics of doing *A* intentionally. It is an open question whether ‘metaphysical definition’—saying what it is to φ—can be permissibly circular, so long as the circularity is contained in the scope of an attitude. Such circularity is characteristic of ‘response-dependent’ accounts of evaluative and other properties. (This response may fail if the attitude in question is knowledge; see Ford 2011, §4.)[^ford-2011]
