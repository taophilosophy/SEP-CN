      Finally, there is Anscombe’s own view, on which there is a normative contrast between intention and ordinary belief. If one fails to act as one intends, and not through a mistaken belief about the means or possibilities for action, ‘the mistake is not one of judgment but of performance’ (Anscombe 1963, pp. 56–7)[^anscombe-1963]. Intention sets a standard of success for what does. (For discussions of this point, see Frost 2014; Setiya 2016a; Campbell 2018a; Campbell 2018b.)[^campbell-2018a][^campbell-2018b][^frost-2014][^setiya-2016a] What is more, there is ‘a difference of form between reasoning leading to action and reasoning for the truth of a conclusion’ (Anscombe 1963, p. 60)[^anscombe-1963]. Intention is justified by the former, not the latter: by practical not theoretical reasoning (Anscombe 1963, pp. 57–62)[^anscombe-1963].
    step1: |-
      最后是安斯库姆自己的观点：意图与普通信念之间有规范性对照。若人未按意图行动，且不是因对手段或行动可能性的错误信念，“错误就不是判断的错误，而是执行的错误”（Anscombe 1963, pp. 56–7）[^anscombe-1963]。意图为其所做之事设定成功标准。（对此的讨论见 Frost 2014; Setiya 2016a; Campbell 2018a; Campbell 2018b。）[^campbell-2018a][^campbell-2018b][^frost-2014][^setiya-2016a] 再者，“导致行动的推理与为结论之真而作的推理，在形式上有差异”（Anscombe 1963, p. 60）[^anscombe-1963]。意图由前者而非后者证成：由实践理性而非理论理性（Anscombe 1963, pp. 57–62）[^anscombe-1963]。
