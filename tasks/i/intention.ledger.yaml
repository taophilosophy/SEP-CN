      The postulation of beliefs formed without sufficient prior evidence is sometimes taken as a fatal flaw. In a memorable formulation, Grice (1971, p. 268) wrote that it makes decision ‘a case of licensed wishful thinking.’ According to Grice, we are not epistemically permitted to form beliefs about what we are doing, or what we are going to do, without sufficient prior evidence. Instead, we know what we are doing, or what we are going to do, by inference from the condition of our will, along with premises about our own abilities (Grice 1971, pp. 275–9; Paul 2009)[^grice-1971][^paul-2009]. The condition of the will cannot itself involve belief.
    step1: |-
      设定无须充分先在证据即可形成信念，有时被视为致命缺陷。格赖斯（1971, p. 268）有一句令人难忘的表述：这使决定成为“一桩获准的一厢情愿”。据格赖斯，我们在认识论上不被允许在没有充分先在证据时形成关于自己正在做什么或将要做什么的信念。相反，我们依据意志状态以及关于自身能力的前提，通过推理知道自己正在做什么或将要做什么（Grice 1971, pp. 275–9; Paul 2009）[^grice-1971][^paul-2009]。意志状态本身不能涉及信念。
    step2: |-
