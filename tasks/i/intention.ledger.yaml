      A note of caution is essential here: it is important to distinguish the more modest project of explaining what it is to act intentionally in terms of intending and doing from the more ambitious project of explaining what it is for *S* to act intentionally in terms of goings-on of which S is not the agent. The latter project is implied by Wittgenstein’s notorious arithmetic: “What is left over when I subtract the fact that my arm goes up from the fact that I raise my arm?” (Wittgenstein 1953, §621)[^wittgenstein-1953]. Some philosophers attempt to answer this question, explaining what it is to do *A* intentionally without appeal to doing *A*. But one need not share that aim in giving an account of intentional action in terms of intention as a mental state: one can take for granted that I am raising my arm, for instance, and ask what more is involved in raising my arm intentionally (Setiya 2011, §2; Setiya 2016b, pp. 3–9)[^setiya-2011][^setiya-2016b].
    step1: |-
      此处必须提醒：要区分两个计划。较谦逊的计划是用“意图”与“做”解释何为有意行动；较宏大的计划是用 *S* 并非其行动者的种种发生来解释 *S* 何以有意行动。后者由维特根斯坦那句著名的算术式问题所暗示：“我从‘我的手臂举起来’这一事实中减去‘我举起手臂’这一事实，剩下的是什么？”（Wittgenstein 1953, §621）[^wittgenstein-1953] 一些哲学家试图回答这一问题，在不诉诸做 *A* 的情况下解释何为有意做 *A*。但用作为心理状态的意图说明有意行动，不必共享这一目标：人可以理所当然地承认我在举起手臂，然后追问：有意举臂还涉及什么（Setiya 2011, §2; Setiya 2016b, pp. 3–9）[^setiya-2011][^setiya-2016b]。
