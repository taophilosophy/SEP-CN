      A final objection to Bratman’s theory is more general, and would apply as well to the theory of intention as guiding desire. The question is whether such accounts reveal the unity of intentional action, intention for the future, and intention-with-which. McCann’s objection concerned the latter. The more basic objection is about the role of intention in intentional action. Bratman (1987, Ch. 8) does not ignore this connection: he proposes necessary and sufficient conditions for doing *A* intentionally that rely on the state of intending, though not always the intention of doing *A* itself. But it is open to question how deep the envisaged unity goes. Why must there be intention in intentional action, if intentions are plans? (See Velleman 2007, §3.)[^velleman-2007]
    step1: |-
      对布拉特曼理论的最后一项反对更一般，也适用于把意图视为引导性欲求的理论。问题是：这类说明是否揭示了有意行动、面向未来的意图与行动所带意图的统一。麦肯的反对关涉后者；更基本的反对关涉意图在有意行动中的角色。布拉特曼（1987, 第 8 章）并未忽视这一联系：他提出有意做 *A* 的充要条件，这些条件依赖意图状态，尽管不总是做 *A* 本身的意图。但所设想的统一有多深，仍可质疑。若意图是计划，为什么有意行动中必须有意图？（见 Velleman 2007, §3。）[^velleman-2007]
    step2: |-
      对布拉特曼理论的最后一项反对更一般，也适用于把意图视为引导性欲求的理论。问题是：这类说明是否揭示了有意行动、面向未来的意图与行动所带意图的统一。麦肯的反对关涉后者；更基本的反对关涉意图在有意行动中的角色。布拉特曼（1987, 第 8 章）并未忽视这一联系：他提出有意做 *A* 的充要条件，这些条件依赖意图状态，尽管不总是做 *A* 本身的意图。但所设想的统一有多深，仍可质疑。若意图是计划，为什么有意行动中必须有意图？（见 Velleman 2007, §3。）[^velleman-2007]
