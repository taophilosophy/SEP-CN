      Along with this unity, and the hint supplied by the use of the progressive in anticipation, there are two main arguments for the theory of intending as being embarked on intentional action. First, it readily explains why intending is always intending to *do* something. (For this argument, see Thompson 2008, pp. 120–3, 127–8, 130–1, drawing on Baier 1970; Moran and Stone 2009, pp. 143, 147.)[^baier-1970][^moran-2009][^thompson-2008] Although we sometimes report intention as a propositional attitude—‘I intend that *p*’—such reports can be recast as ‘intending to…’ as when I intend to bring about that *p*. By contrast, it is difficult to rephrase such mundane expressions as ‘I intend to go home’ in propositional terms. ‘I intend that I am (will be) going home’ suggests indifference to getting there. ‘I intend that I (will) have got home’ suggests indifference to my own agency. ‘I intend that I go home’ can only be read as an intention with a habitual object, describing a general practice of going home; it is not directed at a particular action. If intending is being on the way to intentional action, it is no surprise that its proper object—what one is on the way to doing—is not a proposition or state of affairs, but something one might do.
    step1: |-
      与这一统一，以及预期中用进行式所给的提示一道，还有两个主要论证支持“意图即已着手有意行动”的理论。第一，它顺理成章地解释为何意图总是做某事的意图。（此论证见 Thompson 2008, pp. 120–3, 127–8, 130–1，取自 Baier 1970; Moran and Stone 2009, pp. 143, 147。）[^baier-1970][^moran-2009][^thompson-2008] 尽管我们有时把意图报告为命题态度——“我意图 *p*”——但这类报告可改述为“意图去……”，如我意图促成 *p*。相反，“我打算回家”这类日常说法很难改述为命题形式。“我意图我将回家”暗示对是否到家漠不关心；“我意图我将已到家”暗示对我的能动性漠不关心；“我意图我回家”只能读作带习惯性对象的意图，描述一种回家的一般做法，并不指向特定行动。若意图就是处于通往有意行动的路上，那么其恰当对象——人正在通往所做之事——不是命题或事态，而是人可能做的某事，这毫不奇怪。
