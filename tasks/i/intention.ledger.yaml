      The second objection is epistemic. If forming an intention is, among other things, coming to believe that one is doing *A*, or that one is going to do *A*, what entitles us to form such beliefs? Not, or not ordinarily, that we have sufficient evidence of their truth. Forming an intention is not predicting the future on the basis of what one takes to be, or what ought to be, adequate grounds. That is why Anscombe calls practical knowledge ‘knowledge without observation,’ meaning to exclude not only observation in the narrow sense but knowledge by inference (Anscombe 1963, p. 50)[^anscombe-1963]. And it is why Velleman (1989) writes about ‘spontaneous’ knowledge of action. Even though he hopes to reduce practical to theoretical reasoning, and holds that intention involves belief, he denies that intentions are formed on the basis of sufficient prior evidence. Anscombe and Velleman concede that knowledge in intention often rests in part on observation; the claim is that it goes beyond what observation, or inference from prior evidence, can support. (For differing views of the role of perception in practical knowledge, see Pickard 2004; Gibbons 2010; Schwenkler 2011; Ford 2016.)[^ford-2016][^gibbons-2010][^pickard-2004][^schwenkler-2011]
    step1: |-
      第二个反对是认识论的。若形成意图（除其他外）就是开始相信自己正在做 *A* 或将要这么做，那么是什么授权我们形成这类信念？不是、通常也不是我们对其真有充分证据。形成意图不是依据自认为、或应当认为充分的根据预测未来。这就是为什么安斯库姆称实践知识为“不经观察的知识”，意在排除狭义观察，也排除由推理所得的知识（Anscombe 1963, p. 50）[^anscombe-1963]；也是为什么维尔曼（1989）写“自发”的行动知识。尽管他希望把实践推理还原为理论推理，并主张意图涉及信念，他仍否认意图是依据充分先在证据形成的。安斯库姆与维尔曼承认，意图中的知识常部分依赖观察；其主张是，它超出观察、或由先在证据所作推理所能支持的范围。（关于知觉在实践知识中的作用的不同观点，见 Pickard 2004; Gibbons 2010; Schwenkler 2011; Ford 2016。）[^ford-2016][^gibbons-2010][^pickard-2004][^schwenkler-2011]
