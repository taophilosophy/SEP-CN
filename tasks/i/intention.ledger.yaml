      This picture raises many difficulties, and needs considerable refinement and defence. (For variations, see Velleman 1989; Velleman 2000; Setiya 2007a, Part One; Rödl 2007, Ch. 2; Setiya 2016b.)[^rödl-2007][^setiya-2007a][^setiya-2016b][^velleman-1989][^velleman-2000] Some will resist the claim that acting for a reason is acting with self-knowledge—though it is important to stress that the knowledge attributed here need not involve conscious belief. There is also disagreement about the kind of explanation involved in giving the reasons for which one acts (Wilson 1989, Ch. 7; Ginet 1990, Ch. 6; Dancy 2000; Davis 2005; Alvarez 2010; Setiya 2011)[^alvarez-2010][^dancy-2000][^davis-2005][^ginet-1990][^setiya-2011][^wilson-1989]. But if the picture is basically right, it suggests that the unity of intention can be found in knowledge or belief about action. Assuming that knowledge entails belief, the basic thought is that intention in action involves the belief that one is doing *A*. Doing something for a reason involves a belief about one’s reason for doing it that constitutes intention in action. And prospective intention, or intention for the future, involves a belief about what one is going to do and why. The idea that intention involves belief is what unifies intentional action, prospective intention, and intention-with-which. (On an alternative view, which may be Anscombe’s, intention contrasts with belief: they correspond to radically different kinds of knowledge. See the treatment of mistakes below.)
    step1: |-
      这幅图景引出许多困难，需要大量精炼与辩护。（各种变体见 Velleman 1989; Velleman 2000; Setiya 2007a, Part One; Rödl 2007, Ch. 2; Setiya 2016b。）[^rödl-2007][^setiya-2007a][^setiya-2016b][^velleman-1989][^velleman-2000] 有人会抵抗“因理由行动即带着自我知识行动”这一主张——尽管须强调，这里所归的知识不必涉及有意识信念。关于给出行动理由时所涉解释的种类，也有分歧（Wilson 1989, Ch. 7; Ginet 1990, Ch. 6; Dancy 2000; Davis 2005; Alvarez 2010; Setiya 2011）[^alvarez-2010][^dancy-2000][^davis-2005][^ginet-1990][^setiya-2011][^wilson-1989]。但若图景基本正确，它表明意图的统一可在关于行动的知识或信念中找到。假定知识蕴含信念，基本想法是：行动中的意图涉及“自己正在做 *A*”的信念；因理由做某事涉及关于自己理由的信念，而该信念构成行动中的意图；面向未来的意图则涉及关于自己将做什么及为何的信念。意图涉及信念这一想法，统一了有意行动、面向未来的意图与行动所带的意图。（在另一种观点——也许属于安斯库姆——中，意图与信念相对：它们对应根本不同的知识种类。见下文关于错误的讨论。）
