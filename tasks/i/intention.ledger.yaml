      In an influential critique, Bratman objects that choice is possible even when one knows that neither option is best (Bratman 1985, §(Bratman 1985, §V)[^bratman-1985]. One can decide between options that are equivalent (like the identical bales of hay that stumped Buridan’s ass) or that are ‘on a par’, in that neither is better or worse than the other, though they are too different to count as equally good. (On parity, see Chang 2002)[^chang-2002]. If unconditional judgement presents its object as more desirable than any alternative, Davidson’s theory wrongly prohibits such decisions. Eugene Chislenko defends that implication, arguing that the practical problem is solved by allowing oneself to drift non-intentionally until one option stands out (Chislenko 2016)[^chislenko-2016]. But while this might work for Buridan’s ass, who finds himself slightly closer to one bale of hay than the other, and so decides to eat it, it won’t work for decision-making under parity, where small improvements fail to break the tie.
    step1: |-
      在一篇有影响的批评中，布拉特曼反对说：即便知道两个选项都不最好，选择仍可能（Bratman 1985, §V）[^bratman-1985]。人可以在等价选项之间决定（如让布里丹之驴为难的两捆相同干草），或在“不相上下”的选项之间决定：二者谁也不比谁更好或更坏，但差异太大，不能算同等好。（关于“不相上下”，见 Chang 2002）[^chang-2002]。若无条件判断把其对象呈现为比任何替代者更可欲，戴维森的理论便错误地禁止此类决定。尤金·奇斯连科为该蕴含辩护，主张实践问题可通过允许自己非有意地拖延、直到某个选项凸显而解决（Chislenko 2016）[^chislenko-2016]。但这也许对布里丹之驴有效——它发现自己离一捆干草稍近，于是决定吃它——对“不相上下”下的决策却无效，因为微小改进无法打破平局。
