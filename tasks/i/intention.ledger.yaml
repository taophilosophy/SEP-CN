  - id: 7
    kind: body
    source: |-
      The majority of work since Davidson’s conversion has followed him in acknowledging the state of prospective intention as irreducible to action, and has been led to seek unity in the forms of intention by explaining the others—intentional action and intention-with-which—in terms of intending as a mental state. Recently, however, philosophers inspired by Anscombe’s *Intention* have offered resistance to this move. Anscombe denies that there is a sharp distinction between ‘I am doing *A*’ and ‘I am going to do *A*’ offered as answers to the question ‘Why are you doing *B*?’ (Anscombe 1963, pp. 39–40)[^anscombe-1963]. Nor does she regard intention for the future as needing further explanation once intentional action and intention-with-which have been understood (Anscombe 1963, pp. 90–4)[^anscombe-1963]. Thus, Anscombe appears to solve the problem of unity without acknowledging intention as a mental state.
    step1: |-
      戴维森转变立场以来的多数工作都跟随他，承认面向未来的意图不能还原为行动，并转而通过把其他形式——有意行动与行动所带的意图——解释为作为心理状态的意图，来寻求诸意图形式的统一。然而晚近，受安斯库姆《意图》启发的哲学家对此举提出抵抗。安斯库姆否认：作为对“你为何做 *B*？”的回答，“我正在做 *A*”与“我将要做 *A*”之间有截然区分（Anscombe 1963, pp. 39–40）[^anscombe-1963]。她也不认为，一旦理解了有意行动与行动所带的意图，面向未来的意图还需进一步解释（Anscombe 1963, pp. 90–4）[^anscombe-1963]。因此，安斯库姆似乎在不承认意图是心理状态的情况下解决了统一问题。
    step2: |-
