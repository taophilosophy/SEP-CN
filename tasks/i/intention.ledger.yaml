      There are two main arguments against this conception. The first turns on apparent cases of intention without belief. According to Davidson, ‘[a] man may be making ten carbon copies as he writes, and this may be intentional; yet he may not know that he is; all he knows is that he is trying’ (Davidson 1971, p. 50; see also Davidson 1978, pp. 91–4)[^davidson-1971][^davidson-1978]. Or imagine I am recovering from paralysis, and movement slowly returns to my hand. At a certain point, I am not sure that I can clench my fist. As it happens, I can. But if I try to do so behind my back, under anesthesia, I may not believe that I am clenching my fist, even though—on the face of it—I am doing so intentionally, and that is just what I intend (Setiya 2008, pp. 390–1)[^setiya-2008]. Something similar crops up in planning for the future. I intend to mail the bills on the way to work, but I know that I am forgetful, and don’t believe that I will do it (see Bratman 1987, pp. 37–8)[^bratman-1987].
    step1: |-
      反对这一构想的主要论证有两个。第一关涉看似无信念的意图。据戴维森，“一个人写作时可能在复写十份，这可能是有意的；但他可能不知道自己正在这样做；他所知道的只是自己在尝试”（Davidson 1971, p. 50; 另见 Davidson 1978, pp. 91–4）[^davidson-1971][^davidson-1978]。或设想我正从瘫痪中恢复，手部运动慢慢恢复。某一刻，我不确定自己能否握拳。碰巧我能。但若我在背后、在麻醉下尝试，我可能不相信自己正在握拳，尽管——表面上看——我正有意这样做，而这正是我的意图（Setiya 2008, pp. 390–1）[^setiya-2008]。类似情形也出现在未来计划中。我打算在上班路上寄账单，但知道自己健忘，不相信自己会寄（见 Bratman 1987, pp. 37–8）[^bratman-1987]。
