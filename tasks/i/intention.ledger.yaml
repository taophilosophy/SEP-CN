      Second, and more obviously, there is room to doubt whether intending to do *A* is sufficient for me to count as doing it intentionally, even when we admit that I can be doing what I will never successfully do. Isn’t there a distinction between taking preparatory steps towards doing *A* and beginning to do it, as in the contrast between buying flour and eggs with the intention of baking, and turning on the oven the following week? This distinction may be significant in ethics and the criminal law (Paul 2014a)[^paul-2014a]. There is also the prospect of plans that require no preparatory steps, as for instance, to blink tomorrow at 3:00pm. Isn’t some intending utterly pure, as Davidson thought? Once we move away from the simple theory of intending as doing, however, and introduce the abstract notion of imperfectivity or being in progress, it is more difficult to say what such examples show. That the theory is false? Or just how liminal being in progress can be?
