      The claim that intention entails belief—most commonly, that if one intends to do *A*, one believes that one is going to do it—is widespread among those who draw no particular inspiration from Anscombe. (See Audi 1973; Harman 1976; Davis 1984; Ross 2009.)[^audi-1973][^davis-1984][^harman-1976][^ross-2009] As Grice (1971, pp. 264–6) observed, there is peculiarity of some sort in asserting ‘I intend to do *A*, but I might not do it,’ a peculiarity readily explained if intention is a species of belief. It is equally striking that the ordinary expression of intention for the future is ‘I am going to do A’ (Anscombe 1963, p. 1)[^anscombe-1963], which looks like the assertoric expression of belief. The same point holds for intention in action: ‘What are you up to?’; ‘I am doing *A*.’ Although such evidence is suggestive, however, it might be explained in other ways. (See Davidson 1978, pp. 91, 100; for criticism, Pears 1985; and for more recent discussion, Marušić and Schwenkler 2018, §2.2; Levy 2018; Asarnow forthcoming.)[^davidson-1978][^levy-2018][^marušić-2018][^pears-1985]
    step1: |-
      意图蕴含信念这一主张——最常见的是：若人打算做 *A*，就相信自己将要做它——在那些并不特别受安斯库姆启发的人中也广为流行。（见 Audi 1973; Harman 1976; Davis 1984; Ross 2009。）[^audi-1973][^davis-1984][^harman-1976][^ross-2009] 正如格赖斯（1971, pp. 264–6）所观察，断言“我打算做 *A*，但也许不会做”有某种古怪；若意图是信念的一个种类，这种古怪便容易解释。同样引人注目的是，面向未来意图的日常表达是“我将要做 A”（Anscombe 1963, p. 1）[^anscombe-1963]，这看起来像信念的断言式表达。行动中的意图亦然：“你在干什么？”“我在做 *A*。”然而，尽管这类证据有启发性，也可能有其他解释。（见 Davidson 1978, pp. 91, 100；批评见 Pears 1985；晚近讨论见 Marušić and Schwenkler 2018, §2.2; Levy 2018; Asarnow forthcoming。）[^davidson-1978][^levy-2018][^marušić-2018][^pears-1985]
