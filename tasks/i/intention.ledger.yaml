      In his 1987 book, Bratman in effect pursued the second path, hoping to soften its peculiarity by distinguishing ‘internal’ and ‘external’ perspectives on rationality and deliberation (Bratman 1987, §3.5)[^bratman-1987]. More recently, he has argued that the benefits of consistency and coherence are more than pragmatic, since they allow for a form of self-governance that is of non-instrumental value (Bratman 2009b)[^bratman-2009b], and that they are closely tied to the functional role of intentions as plans (Bratman 2009c, §§VIII–IX)[^bratman-2009c]. He also adopts John Broome’s (2004) idea that the relevant norms take ‘wide scope.’ For instance, it is irrational to [intend *E*, believe that intending *M* is necessary to achieve *E*, and not intend *M*]. It does not follow from this that, if one intends *E*, one is under rational pressure to intend the necessary means, since one can just as well avoid the forbidden combination of attitudes by giving up one’s intention for the end. By the same token, there is no need to admit that intentions provide reasons for acting. We thus avoid both horns of the dilemma sketched above. How far this strategy succeeds is a matter of ongoing dispute (Setiya 2007b; Bratman 2009b; Brunero 2010; Way 2010)[^bratman-2009b][^brunero-2010][^setiya-2007b][^way-2010]. There is also a question how far Bratman’s functional explanation of means-end rationality commits him to a wider form of rationalism or ‘constitutivism’ about practical reason (Setiya 2014; Bratman 2018)[^bratman-2018][^setiya-2014].
    step1: |-
      在 1987 年书中，布拉特曼实际上走第二条路，希望区分理性与审议的“内部”视角与“外部”视角，以缓和其古怪性（Bratman 1987, §3.5）[^bratman-1987]。晚近，他主张一致与融贯的好处不止于实用，因为它们允许一种具有非工具价值的自我治理（Bratman 2009b）[^bratman-2009b]，且与意图作为计划的功能角色紧密相关（Bratman 2009c, §§VIII–IX）[^bratman-2009c]。他还采纳约翰·布鲁姆（2004）的想法：相关规范取“宽域”。例如，[意图 *E*、相信意图 *M* 是达致 *E* 的必要手段、却不意图 *M*]是非理性的。但不能由此推出：若人意图 *E*，就受理性压力去意图必要手段，因为人也可以放弃对目的的意图，从而同样避免被禁止的态度组合。同理，无须承认意图为行动提供理由。我们由此避开上述两难的两角。此策略成功多少仍有争议（Setiya 2007b; Bratman 2009b; Brunero 2010; Way 2010）[^bratman-2009b][^brunero-2010][^setiya-2007b][^way-2010]。还有一个问题：布拉特曼对手段-目的理性的功能解释，在多大程度上使他承诺一种关于实践理性的更广泛理性主义或“构成主义”（Setiya 2014; Bratman 2018）[^bratman-2018][^setiya-2014]。
