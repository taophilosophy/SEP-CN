      A more direct response to the challenge would deny its premise. While it is true that the execution of intention is intentional action, it does not follow that the *object* of intention is doing *A* intentionally (cf. Searle 1983, pp. 85–6)[^searle-1983]. If I intend to be smiling and am doing so involuntarily, I am doing what I intend, though not intentionally. Likewise, if I intend to skip breakfast and do so because I forget about it, my intention was fulfilled, though not by intentional action. Even paying, hiring, and marrying are things one can do unintentionally; intentionality is not built into the object of intention in a way that makes for circularity (see Beddor and Pavese forthcoming, §6, responding to Piñeros Glasscock 2020)[^piñeros-2020]. This point is consistent with the view that, when I act for reasons, those reasons figure in my intention as a Kantian ‘maxim’. In that case, my intention is fulfilled, in its entirety, only if I act on them and thereby act intentionally. (See Wallace 1999, pp. 60–2; Setiya 2007a, pp. 39–49; Korsgaard 2008; Schapiro 2011; and, for resistance, Sinhababu 2013, §3. On the content of intention, more generally, see Harman 1976, pp. 156–8; Velleman 1989, pp. 94–7; Mele 1992, Ch. 11; and Ross, pp. 255–7, Appendix B.)[^harman-1976][^korsgaard-2008][^mele-1992][^schapiro-2011][^setiya-2007a][^sinhababu-2013][^velleman-1989][^wallace-1999]
    step1: |-
      对挑战更直接的回应，是否认其前提。确实，意图的执行就是有意行动，但不能推出意图的*对象*是有意做 *A*（参 Searle 1983, pp. 85–6）[^searle-1983]。若我打算在微笑，而我不由自主地微笑，我做了我打算做的事，却不是有意做的。同样，若我打算不吃早饭，并因忘了此事而没吃，我的意图实现了，却不是通过有意行动实现的。就连付款、雇用、结婚，也可能无意地做；有意性并非以造成循环的方式内置于意图对象之中（见 Beddor and Pavese forthcoming, §6，回应 Piñeros Glasscock 2020）[^piñeros-2020]。此点与如下观点相容：当我因理由行动时，这些理由作为康德式“准则”出现在我的意图中。那样，我的意图只有在我依理由行动、因而有意行动时才完整实现。（见 Wallace 1999, pp. 60–2; Setiya 2007a, pp. 39–49; Korsgaard 2008; Schapiro 2011；反对意见见 Sinhababu 2013, §3。关于意图内容，更一般地见 Harman 1976, pp. 156–8; Velleman 1989, pp. 94–7; Mele 1992, Ch. 11; Ross, pp. 255–7, Appendix B。）[^harman-1976][^korsgaard-2008][^mele-1992][^schapiro-2011][^setiya-2007a][^sinhababu-2013][^velleman-1989][^wallace-1999]
