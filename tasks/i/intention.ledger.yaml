      This refinement preserves the idea that doing *A* intentionally requires an intention whose object is doing *A*. This is what Bratman (1987, p. 112) has dubbed ‘the Simple View.’ It is open to serious objections, the more subtle of which will be examined in section 4. For now, it is sufficient to note that I sometimes count as doing *A* intentionally when it is a merely foreseen and unintended consequence of what I intend to do. (See Harman 1976, pp. 151–2; Bratman 1987, pp. 123–5.)[^bratman-1987][^harman-1976] Thus if I am paid to pump water into the cistern of a house, and I continue to do so even when I realize that the water is poisoned, I poison the inhabitants of the house intentionally, despite the fact that I did not intend or desire such harm (cf. Anscombe 1963, pp. 41–2)[^anscombe-1963]. Even here, however, an intention is executed: I intend to pump water into the house. In general, when it is not the execution of a directly corresponding intention, doing *A* intentionally is a foreseen or desired consequence of an action that is. Admittedly, this condition is necessary, not sufficient, for intentional action, a concept whose vagaries are hard to map. But the execution of intention remains the core phenomenon from which all instances of intentional action are derived.
    step1: |-
      这一精细区分保留了如下想法：有意做 *A* 需要一个以做 *A* 为对象的意图。布拉特曼（1987, p. 112）称之为“简单观点”。它面临严重反对，较微妙的将在第 4 节考察。目前只需指出：有时，当 *A* 只是我所意图之事的可预见且非意图的后果时，我也算有意做 *A*。（见 Harman 1976, pp. 151–2; Bratman 1987, pp. 123–5。）[^bratman-1987][^harman-1976] 因此，若我受雇向一栋房子的蓄水池泵水，且在我意识到水有毒后仍继续，我就是有意毒害屋中居民，尽管我并未意图或欲求此种伤害（参 Anscombe 1963, pp. 41–2）[^anscombe-1963]。然而即便在此，也有一个意图被执行：我打算向房子泵水。一般地说，当有意做 *A* 并非执行直接对应的意图时，它就是某个行动的可预见或所欲后果，而该行动执行了意图。诚然，这一条件是有意行动的必要条件而非充分条件；有意行动这一概念的种种变化难以刻画。但意图的执行仍是核心现象，一切有意行动实例都由此派生。
