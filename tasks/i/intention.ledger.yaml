      Other puzzles concern the formulation and defense of diachronic requirements of rationality for intention: the idea that intentions should persist over time, resisting reconsideration, especially in light of temptations they were designed to forestall. (On the nature of such requirements, see Holton 2009; Broome 2013: Ch. 10; Paul 2014b; Bratman 2018; Tenenbaum 2020; Brunero forthcoming.)[^bratman-2018][^broome-2013][^holton-2009][^paul-2014b][^tenenbaum-2020] The idea that intentions resist reconsideration creates potential moral risks: what if they make us insensitive or indifferent to changing moral reasons? (See Bok 1996; Paul 2017.)[^bok-1996][^paul-2017] What do ethical concerns of this kind mean for the role of intention in diachronic autonomy or self-governance?
    step1: |-
      其他谜题关涉意图的跨时间理性要求的表述与辩护：意图应随时间持续、抗拒重新考虑，尤其面对它们本欲预防的诱惑时。（关于此类要求的本性，见 Holton 2009; Broome 2013: Ch. 10; Paul 2014b; Bratman 2018; Tenenbaum 2020; Brunero forthcoming。）[^bratman-2018][^broome-2013][^holton-2009][^paul-2014b][^tenenbaum-2020] 意图抗拒重新考虑这一想法带来潜在道德风险：若它们使我们对变化的道德理由不敏感或漠不关心，怎么办？（见 Bok 1996; Paul 2017。）[^bok-1996][^paul-2017] 这类伦理关切对意图在跨时间自主或自我治理中的角色意味着什么？
