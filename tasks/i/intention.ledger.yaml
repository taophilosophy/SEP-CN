      A further objection to the demands for consistency and coherence in intention turns on an implication that Bratman (1987, Ch. 8) himself draws out. According to the Simple View, doing *A* intentionally involves an intention whose object is *A*. As Bratman argues, however, it is sometimes rational to attempt both *A* and *B*, hoping to achieve one or the other, when I know that I cannot do both. If I succeed in doing *A*, I will have done so intentionally, and thus, on the Simple View, I must have intended to do *A*. Considerations of symmetry imply that I also intended to do *B*. But then my intentions are not jointly consistent with my beliefs. Bratman concludes that the Simple View is false, since it would be irrational to have such intentions. Instead, I intend to try doing *A* and to try doing *B*, knowing that I can make both attempts, though both cannot succeed. Bratman admits that, when I try to do *A*, I take the relevant means ‘with the intention’ of doing it. But he finds this phrase ambiguous. On one reading, it ascribes the intention to do *A*, but in the present case it does not. Instead, I merely ‘endeavour’ to do *A*, where this is a matter of ‘guiding desire’ (Bratman 1987, Ch. 9)[^bratman-1987].
    step1: |-
      对意图一致性与融贯要求的另一反对，涉及布拉特曼（1987, 第 8 章）自己引出的一个蕴含。按简单观点，有意做 *A* 涉及一个以 *A* 为对象的意图。然而布拉特曼主张，有时我知道自己不能同时做成 *A* 与 *B*，却理性地尝试二者，希望成就其一。若我成功做成 *A*，我就是有意做成它；因而按简单观点，我必定曾意图做 *A*。对称性考虑蕴含我也曾意图做 *B*。但那样我的意图与我的信念并不共同一致。布拉特曼结论说简单观点为假，因为持有这类意图将是非理性的。相反，我意图尝试做 *A* 并意图尝试做 *B*，知道自己可以作两种尝试，尽管二者不能都成功。布拉特曼承认，当我尝试做 *A* 时，我“带着做它的意图”采取相关手段。但他认为这一短语有歧义。一种读法把它归于做 *A* 的意图，但在当前情形并非如此。相反，我只是“努力”做 *A*，而这属于“引导性欲求”（Bratman 1987, 第 9 章）[^bratman-1987]。
