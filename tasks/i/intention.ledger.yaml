      The idea of explaining intentional action through intention-with-which is associated with resistance to causal accounts of acting for a reason. It begins instead with intentional teleology—doing *A* in order to do *B*, or with the intention of doing *B*—treating this as primitive and not involving intention as efficient cause. If we assume that every intentional action is done for a reason, and that this reason can be cast in teleological form, we can identify doing *A* intentionally with doing *A* in order to do something else. We thereby unify two guises of intention.
