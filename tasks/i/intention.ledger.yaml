      Difficulties arise, however, from the case of idle behaviour, in which I am doing *A* intentionally for no particular reason (Anscombe 1963, p. 25)[^anscombe-1963], and from the possibility—or necessity—that teleological series come to an end. I am doing *A* in order to do *B* in order to do *C* … in order to do *Z*, which I am doing for its own sake. Not all intentional actions are performed with a further end. The purported unity fades. In order to solve this problem while leaving room for basic intentional actions, not performed by intentionally taking further means, George Wilson (1989) and Carl Ginet (1990, Ch. 6) appeal to intention *de re*. One need not intend one’s doing *A* to promote some further end in order to count as doing *A* intentionally. It is sufficient to intend, of something one is doing, that it promote or constitute one’s doing *A*.
    step1: |-
      然而困难来自闲置行为：我有意做 *A*，却无特定理由（Anscombe 1963, p. 25）[^anscombe-1963]；也来自目的论序列可能（或必然）终止：我为做 *B* 而做 *A*，为做 *C* 而做 *B*……直到为做 *Z* 而做 *Y*，而 *Z* 是我为其自身而做。并非所有有意行动都带进一步目的。所谓统一便消退了。为在保留基本有意行动（不通过有意采取进一步手段而做）的同时解决此问题，乔治·威尔逊（1989）与卡尔·吉内特（1990, 第 6 章）诉诸 *de re* 意图。要算作有意做 *A*，人无须意图自己的做 *A* 促进某个进一步目的；只要对自己正在做的某事持有意图，认为它促进或构成自己做的 *A*，便足够了。
