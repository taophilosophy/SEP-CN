      A deeper problem for the teleological approach is how to complete this construction with an account of prospective intention in terms of intention-with-which. In cases of pure intending, there is no intention with which I am doing anything yet. It is thus no accident that Wilson (1989, pp. 222–30) is led to deny the possibility of pure intention. When I intend to do *A* in the future, I am doing something now with the intention of doing *A*, in that I intend, of what I am doing, that it promote or constitute my doing *A*. The action in question may be as minimal as keeping track of opportunities for doing *A*, or biding my time.
    step1: |-
      目的论进路更深的问题，是如何用行动所带的意图完成对面向未来意图的构造。在纯粹意图情形中，尚无我做任何事所带的意图。因此，威尔逊（1989, pp. 222–30）被引向否认纯粹意图之可能，并非偶然。当我打算未来做 *A* 时，我此刻正在做某事，且带着做 *A* 的意图：我对自己正在做的事持有意图，认为它促进或构成我做的 *A*。所涉行动可以小到留意做 *A* 的机会，或静待时机。
