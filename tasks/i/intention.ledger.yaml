      The second problem is more a question: whether ‘the relation of *being done in execution of a certain intention*, or *being done intentionally*, is a causal relation between act and intention.’ (Anscombe 1983, p. 95)[^anscombe-1983] Anscombe denies that it is. When she writes of ‘practical knowledge’ as ‘the cause of what it understands’ she means formal not efficient cause: practical knowledge is essential to the action it represents, at least when ‘the description of the action is of a type to be formally the description of an executed intention.’ (See Anscombe 1963, pp. 87–8, and for conflicting interpretations: Hursthouse 2000; Vogler 2002; Moran 2004; Newstead 2006; Velleman 2007; Paul 2011; Ford 2015; Schwenkler 2015; Lavin 2016; Setiya 2016a; Campbell 2018a; Campbell 2018b.)[^anscombe-1963][^campbell-2018a][^campbell-2018b][^ford-2015][^hursthouse-2000][^lavin-2016][^moran-2004][^newstead-2006][^paul-2011][^schwenkler-2015][^setiya-2016a][^velleman-2007][^vogler-2002]
    step1: |-
      第二个问题更像一个追问：“*在某个意图的执行中被做*或*被有意地做*这一关系，是否是行动与意图之间的因果关系？”（Anscombe 1983, p. 95）[^anscombe-1983] 安斯库姆否认。她写道“实践知识”是“它所理解之物的原因”时，指的是形式因而非动力因：实践知识对它表征的行动是本质性的，至少当“行动的描述属于那种在形式上就是已执行意图之描述的类型”时如此。（见 Anscombe 1963, pp. 87–8；相互冲突的解读见 Hursthouse 2000; Vogler 2002; Moran 2004; Newstead 2006; Velleman 2007; Paul 2011; Ford 2015; Schwenkler 2015; Lavin 2016; Setiya 2016a; Campbell 2018a; Campbell 2018b。）[^anscombe-1963][^campbell-2018a][^campbell-2018b][^ford-2015][^hursthouse-2000][^lavin-2016][^moran-2004][^newstead-2006][^paul-2011][^schwenkler-2015][^setiya-2016a][^velleman-2007][^vogler-2002]
