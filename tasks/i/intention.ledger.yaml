      The simplest version of this approach would emphasize the ‘openness’ of the progressive, that ‘He is doing *A*’ does not imply that he will succeed in doing *A*, or that he has or will get very far with it. (That I am crossing the road is consistent with being hit by a car the moment I step off the curb.) It then identifies the fact that *S* intends to do *A* with the fact that *S* is doing *A* intentionally, though perhaps he has barely begun. If I intend to visit the zoo next Thursday, I am already on the way to doing so. Here it is striking that we sometimes employ the present progressive in anticipation: ‘Kieran is visiting the zoo next Thursday’ sounds perfectly fine when said today, before I have taken any overt steps (see Falvey 2000 pp. 25–6; Thompson 2008, pp. 140–1; Moran and Stone 2009, pp. 145–6)[^falvey-2000][^moran-2009][^thompson-2008].
    step1: |-
      这一进路的最简单版本会强调进行式的“开放性”：“他正在做 *A*”并不蕴含他将成功做成 *A*，也不蕴含他已在此事上取得或将会取得很大进展。（“我正在过马路”与“我一离开路缘就被车撞”并不矛盾。）它随后把“*S* 打算做 *A*”这一事实等同于“*S* 正在有意做 *A*”这一事实，尽管他也许才刚开始。若我打算下周四去动物园，我已在上路。此处值得注意的是，我们有时用现在进行式作预期：“基兰下周四去动物园”在今天说、在我尚未采取任何公开步骤之前，听起来完全没问题（见 Falvey 2000 pp. 25–6; Thompson 2008, pp. 140–1; Moran and Stone 2009, pp. 145–6）[^falvey-2000][^moran-2009][^thompson-2008]。
    step2: |-
