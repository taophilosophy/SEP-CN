      Finally, the teleological theorist must account for the connection between intentions with which one acts and psychological states of belief and desire. Why does it follow from the fact that one intends, of what one is doing, that it promote or constitute one’s doing *A* that one wants to do *A* and that one believes, of what one is doing, that it is a means to that end? These implications make sense if intention is a species of desire that interacts with means-end belief when one does *A* with the intention of doing *B*. They are more difficult to explain if intention-with-which is the basic material from which intention and intentional action are built. (This argument is developed at greater length in Setiya 2011, pp. 146–9.)[^setiya-2011]
    step1: |-
      最后，目的论理论家必须说明行动所带意图与信念、欲求等心理状态的联系。为何从“人对自己正在做的事持有意图，认为它促进或构成自己做的 *A*”可推出“人想要做 *A*”，以及“人相信自己正在做的事是达致该目的的手段”？若意图是欲求的一个种类，在人为做 *B* 而做 *A* 时与手段-目的信念互动，这些蕴含便说得通。若行动所带的意图是构造意图与有意行动的基本材料，这些蕴含就更难解释。（此论证在 Setiya 2011, pp. 146–9 有更详细展开。）[^setiya-2011]
