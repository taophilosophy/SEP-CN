  - id: 5
    kind: body
    source: |-
      In ‘Actions, Reasons and Causes,’ Donald Davidson gave a reductive theory of ‘intention with which’ as ‘syncategorematic’: the phrase does not refer to an event or state of the agent, but is a way of redescribing what she is doing in terms of a ‘primary reason,’ where this is understood as a pro-attitude towards actions having some feature, *F*, along with the belief that the original action has that feature (Davidson 1963, pp. 5–8)[^davidson-1963]. It is in virtue of its relation to a primary reason that the action counts as intentional, and this reason gives the intention with which the action is done. Davidson thereby unified, or took himself to have unified, intentional action and intention-with-which.
    step1: |-
      在《行动、理由与原因》中，唐纳德·戴维森对“行动所带的意图”给出一种还原论说明，称之为“兼范畴的”：该短语不指行动者的某个事件或状态，而是以“首要理由”重新描述她正在做的事；所谓首要理由，被理解为对具有某种特征 *F* 的行动的亲态度，加上该原初行动具有 *F* 的信念（Davidson 1963, pp. 5–8）[^davidson-1963]。行动正是凭借与首要理由的关系才算有意，而这一理由给出行动所带的意图。戴维森由此统一了（或自认为统一了）有意行动与行动所带的意图。
    step2: |-
