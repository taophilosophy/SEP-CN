      A partial answer cites the need for direction and guidance in doing anything that takes time or requires the selection of means. But it is not clear that such guidance requires intention (see Bratman 1987, pp. 126–7 on spontaneous action)[^bratman-1987]. Nor would this forge a general connection between the state of intending and the phenomenon of acting for reasons or the application of Anscombe’s (1963, p. 9) question ‘Why?’ If *S* is doing *A* on the ground that *p*, she is doing it intentionally. Bratman’s conditions do not explain why intention must be involved in the antecedent of this conditional. Why must reasons attach to what I am doing by way of plans or guiding desires? One response is to admit that they may not: there can be intentional action without intention (see Bratman 2000, pp. 51–2)[^bratman-2000]. But if we hope to unify intention with intentional action, we cannot accept this. Intention must figure in the correct account of acting for a reason, and thus intentionally. In order to avoid disunity, the theory of intentions as plans (or as guiding desires) needs such an account.
    step1: |-
      部分回答诉诸：做任何耗时或需要选择手段之事，都需要方向与引导。但这类引导是否需要意图，并不清楚（关于自发行动，见 Bratman 1987, pp. 126–7）[^bratman-1987]。这也不会在意图状态与因理由行动现象、或安斯库姆（1963, p. 9）“为什么？”问题的应用之间，建立一般联系。若 *S* 以 *p* 为根据做 *A*，她是有意做它。布拉特曼的条件未解释：为何这个条件句的前件必须涉及意图？为何理由必须通过计划或引导性欲求附着于我正在做的事？一种回应是承认未必如此：可以有无意图的有意行动（见 Bratman 2000, pp. 51–2）[^bratman-2000]。但若我们希望统一意图与有意行动，就不能接受这一点。意图必须出现在因理由行动、因而有意行动的正确说明中。为避免不统一，计划论（或引导性欲求论）需要这样的说明。
