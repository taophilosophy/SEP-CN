      It is a matter of consensus in the philosophy of intention that intending to do *A* entails wanting to do *A*, in the motivational sense for which the ‘primitive sign of wanting is *trying to get*’ (Anscombe 1963, p. 68)[^anscombe-1963]. Doubts about this entailment are attributed to ambiguities in ‘desire.’ When I intend to do *A* reluctantly, from the motive of duty, I may deny that I want to do it, but what I lack is ‘appetite’ not ‘volition’ (Davis 1984, pp. 135–40; Thompson 2008, pp. 103–5)[^davis-1984][^thompson-2008].
    step1: |-
      意图哲学中有一项共识：打算做 *A* 蕴含想要做 *A*，这里的“想要”是动机意义上的，即“想要的原始标志是*试图得到*”（Anscombe 1963, p. 68）[^anscombe-1963]。对此蕴含的怀疑，被归因于“欲求”的歧义。当我出于义务动机而不情愿地打算做 *A* 时，我可能否认自己想要做它，但我缺乏的是“欲望”而非“意志”（Davis 1984, pp. 135–40; Thompson 2008, pp. 103–5）[^davis-1984][^thompson-2008]。
