      Even the more modest project runs into difficulties. First, although we sometimes form an intention prior to acting, this is not essential. I can wave my arm intentionally without planning in advance. This fact elicits a refinement often credited to Searle (1983, pp. 84–5): the distinction between prospective intention and intention in action. In the former case, one intends to do *A*, perhaps at some point in the future. In the latter, one intends to be doing it now. When *S* is doing *A* intentionally, she is doing it in execution of an intention in action, though except in very unusual cases she also intends to do *A*: to complete the action she is in the midst of performing.
    step1: |-
      即便较谦逊的计划也遇困难。第一，尽管我们有时在行动前形成意图，但这并非必要。我可以不预先计划就有意挥臂。这一事实引出常归于塞尔（1983, pp. 84–5）的精细区分：面向未来的意图与行动中的意图之别。前者中，人打算做 *A*，也许在未来某时；后者中，人打算此刻正在做它。当 *S* 有意做 *A* 时，她是在执行一个行动中的意图，尽管除极不寻常的情形外，她也打算做 *A*：完成她正在进行的行动。
