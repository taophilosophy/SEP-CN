      Along with such matters of detail, two problems of principle can be raised against the present approach. The first contends that it is tacitly circular, because the content of intention always includes the concept of intentionality (Wilson 1989, pp. 274–5; Ginet 1990, pp. 34–5)[^ginet-1990][^wilson-1989]. In prospective intention, I intend not only to do *A*, but to do *A* *intentionally*, and the same point holds for the object of intention in action. This prevents us from explaining what it is to act intentionally in terms of intention as a mental state. Alternatively, one might hold, as Anscombe (1963, §47) apparently does, that for some values of ‘*A*’—as perhaps, paying, hiring, or marrying—it is essential to doing *A* that one do it intentionally (see Ford 2015; Setiya 2016a)[^ford-2015][^setiya-2016a].
    step1: |-
      除这些细节问题外，还可对本进路提出两个原则性问题。第一，它暗中循环，因为意图的内容总已包含有意性概念（Wilson 1989, pp. 274–5; Ginet 1990, pp. 34–5）[^ginet-1990][^wilson-1989]。在面向未来的意图中，我不只打算做 *A*，还打算有意做 *A*；行动中意图的对象亦然。这使我们无法用作为心理状态的意图解释何为有意行动。或者，也可以像安斯库姆（1963, §47）显然那样主张：对某些“*A*”取值——也许如付款、雇用或结婚——有意做 *A* 是做 *A* 的本质要素（见 Ford 2015; Setiya 2016a）[^ford-2015][^setiya-2016a]。
