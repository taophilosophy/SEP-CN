      So far, we have only the fragment of a theory, an alleged condition of intending, not an adequate account of what intention is. Here there are several possibilities. It is sometimes said that intention *is* belief (Velleman 1989; Marušić and Schwenkler 2018)[^marušić-2018][^velleman-1989]. But this creates a risk of confusion. It is not clear that anyone believes there is a value of *p* such that intending to do *A* is no more than believing *p*. Instead they hold that part of what it is to intend to do *A* is to believe *p*; other conditions must be met. The confusion stems from talk of particular ‘tokens’ of intending which may be identified with tokens of belief. But the idea of a token state may not be coherent (Steward 1997)[^steward-1997] and the would-be cognitivist need think otherwise.
    step1: |-
      至此，我们只有一个理论的碎片，一个所谓的意图条件，而不是对意图本身的充分说明。此处有若干可能。有时人们说意图*就是*信念（Velleman 1989; Marušić and Schwenkler 2018）[^marušić-2018][^velleman-1989]。但这有混淆之险。并不清楚有谁相信存在某个 *p*，使“打算做 *A*”不过就是“相信 *p*”。相反，他们主张：打算做 *A* 的部分内容就是相信 *p*；还须满足其他条件。混淆源于谈论意图的具体“个例”，并把它等同于信念个例。但个例状态这一想法本身可能不融贯（Steward 1997）[^steward-1997]，而想当认知主义者的人也无需那样想。
    step2: |-
