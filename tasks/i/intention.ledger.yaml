      In this respect, Anscombe’s doctrine differs most sharply from Velleman’s. As well as thinking of intention as a kind of belief, Velleman holds that ‘practical reasoning is a kind of theoretical reasoning’ (Velleman 1989, p. 15; see also Ross 2009)[^ross-2009][^velleman-1989]. In a review of Velleman’s book, Bratman (1991, pp. 250–1) dubbed the conjunction of these claims ‘cognitivism about practical reason.’ It prompts what Davidson (1978, p. 95) called ‘the strongest argument against identifying [intention] with [belief],’ that ‘reasons for intending to do something are in general quite different from reasons for believing one will do it.’ Though Velleman (1989, pp. 122–5) defends that identification, one need not do so in order to accept the theory of intention as a form of belief or the idea of ‘knowledge in intention.’
    step1: |-
      在这方面，安斯库姆的学说与维尔曼的差异最尖锐。维尔曼不仅把意图视为一种信念，还主张“实践推理是一种理论推理”（Velleman 1989, p. 15; 另见 Ross 2009）[^ross-2009][^velleman-1989]。在评论维尔曼的书时，布拉特曼（1991, pp. 250–1）把这两个主张的合取称为“关于实践理性的认知主义”。它引出戴维森（1978, p. 95）所称“反对把[意图]等同于[信念]的最强论证”：打算做某事的理由，一般与相信自己会做它的理由大不相同。尽管维尔曼（1989, pp. 122–5）为该等同辩护，但接受“意图是信念的一种形式”或“意图中的知识”这一想法，并不需要那样做。
