      Implicit these debates is a question about the scope of groundless (non-perceptual, non-inferential) self-knowledge. A blanket objection to beliefs formed without sufficient prior evidence cannot be sustained: I often know what I believe without having come to know on the basis of perception or inference. Is groundless knowledge of this kind restricted to our mental states? Or can it extend to what we are doing and what we are going to do? Compare externalism about content: at least typically, believing *p* has implications for the constitution of the world outside one’s skin; but it remains accessible to self-knowledge (Burge 1988)[^burge-1988]. Why should that not be true of intentional action? On any reading, part of the aim of Anscombe’s *Intention* was to break the Cartesian prejudice against self-knowledge of what is happening in the world. If she failed in that endeavour, she at least prescribed a task for future work: to say whether it is indeed a prejudice or a decisive obstacle to the possibility of practical knowledge and the theory that intention involves belief.
    step1: |-
      这些争论背后隐含一个问题：无根据（非知觉、非推理）自我知识的范围有多大。对无充分先在证据而形成信念的一概反对站不住脚：我常知道自己相信什么，却并非通过知觉或推理得知。这类无根据知识是否仅限于心理状态？还是可延伸至我们正在做什么、将要做什么？比较内容外在论：至少典型地，相信 *p* 对肌肤之外世界的构成有所蕴含；但它仍可为自我知识所及（Burge 1988）[^burge-1988]。为何有意行动不能如此？无论如何解读，安斯库姆《意图》的部分目标，是打破笛卡尔式偏见——反对关于世界中正在发生之事的自我知识。若她未竟全功，至少为未来工作规定了一项任务：说明这究竟是偏见，还是实践知识之可能性及“意图涉及信念”理论的决定性障碍。
