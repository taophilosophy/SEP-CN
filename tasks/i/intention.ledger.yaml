      The main objection to this view, pressed forcefully by Hugh McCann (1991), is that it generates an unhappy proliferation of intention-like states, and that, by finding ambiguity in ‘intention with which,’ it fails to unify the guises of intention. What is more, there are natural alternatives. One equates intention with guiding desire, defends the Simple View, and finds the requirement of consistency defeasible. There is rational pressure to conform to it, in general, but this pressure can be outweighed, as when it makes sense to intend both *A* and *B*, despite their manifest inconsistency, hoping to achieve just one. Another alternative appeals to partial intention, by analogy with partial belief (see Holton 2009; Goldstein 2016; Shpall 2016; Archer 2017; Muñoz 2018)[^archer-2017][^goldstein-2016][^holton-2009][^muñoz-2018][^shpall-2016]. There is also room for a more radical view, on which the reasons for being consistent in one’s intentions, or conforming to means-end coherence, reduce to the reasons for acting in one way or another: Bratman’s alleged requirements are a ‘myth’ (Raz 2005; Kolodny 2008; Tenenbaum 2014)[^kolodny-2008][^raz-2005][^tenenbaum-2014].
    step1: |-
      休·麦肯（1991）有力提出的主要反对是：这会产生意图样状态的恼人增殖；且通过在“行动所带的意图”中发现歧义，它未能统一意图的诸面目。此外还有自然的替代方案。其一，把意图等同于引导性欲求，捍卫简单观点，并认为一致性要求可废止。一般有理性压力遵守它，但这种压力可被压倒，例如在同时意图 *A* 与 *B*（尽管二者明显不一致）以求成就其一时说得通。另一替代诉诸部分意图，类比部分信念（见 Holton 2009; Goldstein 2016; Shpall 2016; Archer 2017; Muñoz 2018）[^archer-2017][^goldstein-2016][^holton-2009][^muñoz-2018][^shpall-2016]。还有一种更激进的观点：意图保持一致或符合手段-目的融贯的理由，可还原为以某种方式行动的理由；布拉特曼所谓要求是“神话”（Raz 2005; Kolodny 2008; Tenenbaum 2014）[^kolodny-2008][^raz-2005][^tenenbaum-2014]。
