    source: |-
      Philosophical perplexity about intention begins with its appearance in three guises: intention for the future, as I intend to complete this entry by the end of the month; the intention with which someone acts, as I am typing with the further intention of writing an introductory sentence; and intentional action, as in the fact that I am typing these words intentionally. As Elizabeth Anscombe wrote in a similar context, ‘it is implausible to say that the word is equivocal as it occurs in these different cases’ and from the fact that ‘we are tempted to speak of “different senses” of a word which is clearly not equivocal, we may infer that we are pretty much in the dark about the character of the concept which it represents’ (Anscombe 1963, p. 1)[^anscombe-1963].
    step1: |-
      对意图的哲学困惑，始于它以三种面目出现：面向未来的意图，如我打算在本月底前写完本词条；某人行动时所带的意图，如我打字时还带着写一句导言的意图；以及有意行动，如我正有意打出这些字这一事实。正如伊丽莎白·安斯库姆在类似语境中所写：把这些不同场合下出现的同一个词说成有歧义，是不可信的；而从一个明明没有歧义的词那里我们却忍不住要谈它的“不同含义”，由此可以推断：对于该词所代表的概念之特性，我们多半还蒙在鼓里（Anscombe 1963, p. 1）[^anscombe-1963]。
