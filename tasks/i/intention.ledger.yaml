      Critics may object to the necessity of these conditions. According to Berislav Marušić (2015), I can form the ‘practical belief’ that I will do *A* without knowing that my intention will be effective, so long as I know that its execution is up to me. A more common objection is that the conditions are not sufficient. They assimilate intention to faith, as when I form the belief that I can leap a great chasm even though I have no evidence of my ability to do so, knowing that the belief itself will ensure success. It is not clear that such acts of faith are possible, that they are epistemically rational, or that they provide a plausible model for intention (Langton 2004; Setiya 2008, §III)[^langton-2004][^setiya-2008]. On an alternative view, there is a general demand for prior evidence in forming beliefs, but our intentions are sometimes exempt from it, as perhaps when we know how to perform the relevant acts (Setiya 2008; Setiya 2009; Setiya 2012)[^setiya-2008][^setiya-2009][^setiya-2012]. It is know-how that explains why the execution of our intentions, and thus the truth of the beliefs that they involve, can be credited to us.
    step1: |-
      批评者可反对这些条件的必要性。据贝里斯拉夫·马鲁希奇（2015），只要我知道意图的执行取决于我，我就可以形成“我将做 *A*”的“实践信念”，而无需知道意图会有效。更常见的反对是条件不充分。它们把意图同化为信仰，如我形成“我能跃过深渊”的信念，尽管没有能力证据，只知道信念本身将确保成功。这类信仰行为是否可能、是否认识论上理性、是否为意图提供可信模型，都不清楚（Langton 2004; Setiya 2008, §III）[^langton-2004][^setiya-2008]。另一种观点认为，形成信念一般需要先在证据，但我们的意图有时可豁免，也许当我们知道如何执行相关行动时如此（Setiya 2008; Setiya 2009; Setiya 2012）[^setiya-2008][^setiya-2009][^setiya-2012]。正是“知道如何”解释了为何我们意图的执行、因而其所含信念之真，可归功于我们。
