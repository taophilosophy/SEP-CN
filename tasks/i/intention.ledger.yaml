      这一反对的力度不明。说明何为 φ 时诉诸“是 φ 或做 φ”确有问题，但诉诸“把某物表征为是 φ 或做 φ”的心理状态，问题就不那么明显。我们的任务不是向缺乏有意行动概念的人引入该概念，而是阐明有意做 *A* 的形而上学。所谓“形而上学定义”——说出何为 φ——是否可容许循环，只要循环被限制在态度之内，仍是开放问题。这种循环是评价性及其他属性的“回应依赖”说明的特征。（若所涉态度是知识，此回应可能失败；见 Ford 2011, §4。）[^ford-2011]
