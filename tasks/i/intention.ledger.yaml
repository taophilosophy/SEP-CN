      Such examples can be dealt with in various ways. One strategy insists that, when I do not believe that I am clenching my fist, or that I will mail the bills, I do not intend the corresponding actions, I merely intend to *try* (Harman 1986, pp. 364–5; Velleman 1989, pp. 115–6)[^harman-1986][^velleman-1989]. But do I really act as I intended if I try and fail? (See Pears 1985, p. 86; McCann 1991, p. 212.)[^mccann-1991][^pears-1985] And when I know that I am forgetful, do I even believe that I will try to mail the bills? A more radical theory points to the simplifying assumption, often made in epistemology, that belief is binary and does not come by degree. On that assumption, it may be harmless to claim that intention involves belief. But the truth is bound to be more complex: that in forming an intention one becomes more confident than one would otherwise be (Setiya 2008, pp. 391–2)[^setiya-2008]; or that the will is a capacity to know what one is doing, or what one is going to do, whose exercise may be impeded, yielding mere belief or partial belief instead of knowledge (Pears 1985, pp. 78–81; Setiya 2009, pp. 129–31; Setiya 2012, pp. 300–303; Marušić and Schwenkler 2018, §3.1)[^marušić-2018][^pears-1985][^setiya-2009][^setiya-2012].
    step1: |-
      这类例子可用多种方式处理。一种策略坚持：当我不相信自己正在握拳、或相信自己会寄账单时，我并不意图相应行动，我只是意图*尝试*（Harman 1986, pp. 364–5; Velleman 1989, pp. 115–6）[^harman-1986][^velleman-1989]。但若我尝试而失败，我真的按意图行动了吗？（见 Pears 1985, p. 86; McCann 1991, p. 212。）[^mccann-1991][^pears-1985] 且当我知道自己健忘时，我甚至相信自己会尝试寄账单吗？一种更激进的理论指向认识论中常作的简化假定：信念是二值的，不按程度分。按此假定，主张意图涉及信念也许无害。但真相必然更复杂：形成意图时，人变得比原本更有信心（Setiya 2008, pp. 391–2）[^setiya-2008]；或意志是一种知道自己正在做什么或将要做什么的能力，其运用可能受阻，只产出单纯信念或部分信念而非知识（Pears 1985, pp. 78–81; Setiya 2009, pp. 129–31; Setiya 2012, pp. 300–303; Marušić and Schwenkler 2018, §3.1）[^marušić-2018][^pears-1985][^setiya-2009][^setiya-2012]。
