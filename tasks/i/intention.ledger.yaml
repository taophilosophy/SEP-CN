      For Bratman (1987), intention is a distinctive practical attitude marked by its pivotal role in planning for the future. Intention involves desire, but even predominant desire is insufficient for intention, since it need not involve a commitment to act: intentions are ‘conduct-controlling pro-attitudes, ones which we are disposed to retain without reconsideration, and which play a significant role as inputs to [means-end] reasoning’ (Bratman 1987, p. 20)[^bratman-1987]. The plans for action contained in our intentions are typically partial and must be filled out in accordance with changing circumstances as the future comes.
    step1: |-
      在布拉特曼（1987）看来，意图是一种独特的实践态度，其特征是未来计划中的枢纽作用。意图涉及欲求，但即便占主导的欲求也不足以构成意图，因为它不必包含行动承诺：意图是“控制行为的亲态度，我们倾向于不经重新考虑就保留它们，且它们作为[手段-目的]推理的输入起重要作用”（Bratman 1987, p. 20）[^bratman-1987]。我们意图中所含的行动计划通常是不完整的，须随未来情势变化而补全。
