      A more common anxiety turns on ‘causal deviance’ (Davidson 1973, p. 79)[^davidson-1973]. If we are trying to say what it is to act intentionally, the condition of doing *A* because one so intends looks insufficient. For it says nothing about the causal path from intention to action. If I intend to be shaking in order to signal my confederate, and this intention makes me nervous, so that I shake, I am shaking because I so intend—though not intentionally. My intention did not cause me to shake ‘in the right way.’ Nor is the ‘right way’ obviously a matter of ‘proximate’ causation or the absence of causal intermediaries, since a causal theorist may well allow for neural intermediaries, and further intentions, in the causal path from intention to action. There is a failure of intentional action only when the intermediaries are of the wrong kind.
    step1: |-
      更常见的忧虑围绕“因果偏离”（Davidson 1973, p. 79）[^davidson-1973]。若我们要说明何为有意行动，“因为人如此打算而做 *A*”这一条件看来不充分，因为它未说明从意图到行动的因果路径。若我打算发抖以向同伙示意，而这个意图使我紧张，于是我发抖，我是因如此打算而发抖——却不是有意发抖。我的意图并未“以正确方式”使我发抖。“正确方式”显然也不在于“邻近”因果或没有因果中介，因为因果论者完全可以允许从意图到行动的路径中有神经中介与进一步意图。只有当中介属于错误种类时，才出现有意行动的失败。
    step2: |-
