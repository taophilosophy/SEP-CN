      Intending is thus a ‘pro-attitude’ of some kind—assuming, for simplicity, that intention is a mental state. In his later work, Davidson specified this pro-attitude as ‘an all-out, unconditional judgement that the action is desirable’ (Davidson 1978, p. 99)[^davidson-1978]. He made two further refinements. First, when one is doing *A* intentionally, ‘at least when the action is of brief duration, nothing seems to stand in the way of an Aristotelian identification of the action with [all-out evaluative judgement]’ (Davidson 1978, p. 99)[^davidson-1978]. Second, one counts as intending an action only if one’s beliefs are consistent with one’s performing it; one cannot intend to do what one believes to be impossible (Davidson 1978, pp. 100–1)[^davidson-1978].
    step1: |-
      因此，打算是某种“亲态度”——为简单起见，假定意图是心理状态。戴维森在后期著作中把这种亲态度规定为“一种全盘、无条件的判断：该行动是可欲的”（Davidson 1978, p. 99）[^davidson-1978]。他作了两点进一步限定。第一，当人有有意做 *A* 时，“至少当行动持续时间短暂，似乎没有什么妨碍亚里士多德式地把行动等同于[全盘评价判断]”（Davidson 1978, p. 99）[^davidson-1978]。第二，只有当人的信念与其执行该行动相容时，人才算打算做某行动；人不能打算做自己相信不可能的事（Davidson 1978, pp. 100–1）[^davidson-1978]。
