      This way of putting things prompts the objection that merely having that intention is not enough. If the intention is idle or ineffective, one will not, despite one’s wishes, count as doing *A* intentionally, or as acting in order to do *A* (Mele 1992, pp. 248–55)[^mele-1992]. We need to add a causal relation, after all. But this objection misconstrues the teleological view. It is not that the mere presence of a mental state—intending of … that it …—constitutes acting with an intention, or acting intentionally, but that intention-with-which is a basic form of teleology, distinct from causation by a mental state, out of which we can construct the unity of intention.
