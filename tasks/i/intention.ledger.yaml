      A final response casts doubt on the examples. When we recall the ‘openness’ of the progressive, we can insist that Davidson’s carbon-copier knows that he is making ten copies, even if he is not sure the copies are going through first time (see Thompson 2011; Wolfson 2012)[^thompson-2011]. It is not a condition of being embarked on intentional action that one will in fact succeed. The same might be said when I am clenching my first, if what I know is merely that I am in progress towards doing so, in some liminal way. (This points back to the theory of intending as doing, discussed in section 1.) This strategy struggles with prospective intention and the belief that I am going to act. But its advocates may insist that the content of prospective intention is also imperfective (Thompson 2008, pp. 142–5)[^thompson-2008]. We have practical knowledge only of what is in progress, not what has happened, or what will.
    step1: |-
      最后一种回应质疑这些例子。回想进行式的“开放性”，我们可以坚持：戴维森的复写者知道自己正在复写十份，即便他不确定这些副本能否一次成功（见 Thompson 2011; Wolfson 2012）[^thompson-2011]。已着手有意行动并不以实际成功为条件。若我所知的只是自己正以某种边缘方式走向握拳，握拳情形也可这样说。（这指回第 1 节讨论的“意图即行动”理论。）此策略在面向未来的意图与“我将行动”的信念上吃力。但其倡导者可坚持：面向未来意图的内容也是不完全的（Thompson 2008, pp. 142–5）[^thompson-2008]。我们只有对进行中之事、而非已发生或将发生之事的实践知识。
