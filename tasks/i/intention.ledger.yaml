      Acknowledging these problems, some philosophers turn back to Davidson and the project of reducing intention to desire and means-end belief (see, especially, Ridge 1998; Sinhababu 2013; and, for discussion, Mulder 2018)[^mulder-2018][^ridge-1998][^sinhababu-2013]. But others see a promise of unity in the idea—influentially proposed by Elizabeth Anscombe (1963, pp. 11–15) and Stuart Hampshire (1959, pp. 95, 102)—that when *S* is doing *A* intentionally, *S* knows that she is doing *A*. What is more, acting for a reason, in a sense that contrasts with mere purposive behavior (of the sort characteristic of other animals), essentially involves such knowledge: in acting for a reason, I know an explanation of what I am doing that cites that reason, and therefore know that I am doing it. That is why, for Anscombe, the question ‘Why?’ is ‘given application’ by the agent. Intentional action turns on knowing the answer to that question.
    step1: |-
      承认这些问题后，一些哲学家转回戴维森，回到把意图还原为欲求与手段-目的信念的计划（尤其见 Ridge 1998; Sinhababu 2013；讨论见 Mulder 2018）[^mulder-2018][^ridge-1998][^sinhababu-2013]。另一些人则在如下想法中看到统一的希望（该想法由伊丽莎白·安斯库姆 1963, pp. 11–15 与斯图尔特·汉普希尔 1959, pp. 95, 102 有影响地提出）：当 *S* 有意做 *A* 时，*S* 知道自己正在做 *A*。再者，在与单纯目的性行为（其他动物的典型行为）相对的意义上，因理由行动本质上涉及这种知识：因理由行动时，我知道一个援引该理由的解释，因而知道自己正在做它。这就是为什么对安斯库姆而言，“为什么？”问题由行动者“给予应用”。有意行动取决于知道该问题的答案。
