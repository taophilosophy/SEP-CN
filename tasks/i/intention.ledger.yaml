      A more modest ‘cognitivism’ would hold that intention involves belief, that practical reasoning does not reduce to theoretical, but that some requirements that govern intention are best understood as requirements of theoretical reason. It is often regarded as a virtue of such cognitivism that it explains why there should be an indefeasible requirement of consistency among intentions and beliefs (Ross 2009, pp. 244–7)[^ross-2009]. It has also been argued that the requirement of means-end coherence follows from requirements of theoretical reason on the beliefs that figure in our intentions (Harman 1976, p. 153; Wallace 2001; Setiya 2007b; Ross 2009, pp. 261–5)[^harman-1976][^ross-2009][^setiya-2007b][^wallace-2001]. If I intend to do *E* and thus believe that I will do it, and I believe that doing *M* is a necessary means to doing *E*, but do not intend or believe that I am going to do *M*, I fail to believe a practically salient logical consequence of what I believe. The principal challenge for a cognitivist account of means-end coherence is to explain why one must avoid such theoretical failures by forming the relevant intention, not just the corresponding belief (Bratman 2009a)[^bratman-2009a]. But once again, one need not defend cognitivism, even in its less ambitious form, in conceiving intention as a kind of belief.
    step1: |-
      一种更谦逊的“认知主义”会主张：意图涉及信念；实践推理不还原为理论推理；但支配意图的某些要求，最好理解为理论理性的要求。此类认知主义常被认为有一优点：它解释为何意图与信念之间应有一致性的不可废止要求（Ross 2009, pp. 244–7）[^ross-2009]。也有人主张，手段-目的融贯要求可从理论理性对我们意图中信念的要求推出（Harman 1976, p. 153; Wallace 2001; Setiya 2007b; Ross 2009, pp. 261–5）[^harman-1976][^ross-2009][^setiya-2007b][^wallace-2001]。若我意图做 *E*，因而相信自己将做它，且相信做 *M* 是达致 *E* 的必要手段，却不意图或不相信自己将做 *M*，我便未能相信我所相信之物的一个实践上显著逻辑后承。认知主义说明手段-目的融贯的主要挑战，是解释为何人必须通过形成相关意图、而不只是相应信念来避免这类理论失败（Bratman 2009a）[^bratman-2009a]。但同样，把意图构想为一种信念，并不需要捍卫认知主义，即便其较不宏大的形式。
