      A different proposal, due to Harman (1976, p. 168) is that intentions are ‘conclusion[s] of practical reasoning’ (see also Ross 2009, pp. 270–2; Marušić and Schwenkler 2018)[^marušić-2018][^ross-2009]. But it seems possible to intend an action spontaneously, for no particular reason. In later work, Harman looks downstream of intention, rather than upstream: an intention is a belief about what one is doing or what one is going to do that has the power to guide and motivate action through practical thought (Harman 1986, pp. 375–6; Setiya 2007a, pp. 48–53)[^harman-1986][^setiya-2007a]. This claim interacts with the question about ‘disjunctive’ theories left unanswered at the end of section 2. If intention involves belief, those who treat knowledge as basic, with mere belief its defective form, will take a similar view of ‘knowledge in intention’ (Rödl 2007; Ch. 2; McDowell 2010, §7; Marcus 2012, Ch. 2)[^marcus-2012][^mcdowell-2010][^rödl-2007]. In the good case, one’s intention in action involves knowledge of what one is doing: it entails, so cannot cause or motivate, one’s action. In the bad case, one merely intends to act. If not its causal role, however, what distinguishes knowledge in intention from knowledge of other kinds?
    step1: |-
      另一提议出自哈曼（1976, p. 168）：意图是“实践推理的结论”（另见 Ross 2009, pp. 270–2; Marušić and Schwenkler 2018）[^marušić-2018][^ross-2009]。但人似乎可以无特定理由地自发意图一个行动。在后期工作中，哈曼转而看意图的下游而非上游：意图是关于自己正在做什么或将要做什么的信念，该信念能通过实践思想引导并驱动行动（Harman 1986, pp. 375–6; Setiya 2007a, pp. 48–53）[^harman-1986][^setiya-2007a]。这一主张与第 2 节末尾未答的“析取式”理论问题互动。若意图涉及信念，那些把知识视为基本、把单纯信念视为其缺陷形式的人，会对“意图中的知识”持类似看法（Rödl 2007; Ch. 2; McDowell 2010, §7; Marcus 2012, Ch. 2）[^marcus-2012][^mcdowell-2010][^rödl-2007]。在好的情形中，人的行动中意图涉及对自己正在做什么的知识：它蕴含、因而不能引起或驱动其行动。在坏的情形中，人只是打算行动。然而，若不是因果角色，究竟是什么把意图中的知识与其他知识区分开？
    step2: |-
      另一提议出自哈曼（1976, p. 168）：意图是“实践推理的结论”（另见 Ross 2009, pp. 270–2; Marušić and Schwenkler 2018）[^marušić-2018][^ross-2009]。但人似乎可以无特定理由地自发意图一个行动。在后期工作中，哈曼转而看意图的下游而非上游：意图是关于自己正在做什么或将要做什么的信念，该信念能通过实践思想引导并驱动行动（Harman 1986, pp. 375–6; Setiya 2007a, pp. 48–53）[^harman-1986][^setiya-2007a]。这一主张与第 2 节末尾未答的“析取式”理论问题互动。若意图涉及信念，那些把知识视为基本、把单纯信念视为其缺陷形式的人，会对“意图中的知识”持类似看法（Rödl 2007; Ch. 2; McDowell 2010, §7; Marcus 2012, Ch. 2）[^marcus-2012][^mcdowell-2010][^rödl-2007]。在好的情形中，人的行动中意图涉及对自己正在做什么的知识：它蕴含、因而不能引起或驱动其行动。在坏的情形中，人只是打算行动。然而，若不是因果角色，究竟是什么把意图中的知识与其他知识区分开？
