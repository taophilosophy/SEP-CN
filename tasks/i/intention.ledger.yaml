      As he came to see, however, this story neglects and cannot easily incorporate prospective intention or intention for the future (Davidson 1978)[^davidson-1978]. There are apparent cases of ‘pure intending’ in which no steps of any kind are taken. Suppose that I intend to write a book review but have yet to open the book. On the face of it, such pure intending cannot be reduced to intentional action. What is more, once we recognize the existence of pure intending, ‘there is no reason not to allow that intention of exactly the same kind is also present when the intended action eventuates’ (Davidson 1978, p. 89)[^davidson-1978]. If what I am doing intentionally takes time, as almost everything does, there will be early phases in which I stand to the completion of the deed as I stand to future actions I intend to perform but have yet to begin.
    step1: |-
      然而，他后来认识到，这一故事忽视了面向未来的意图，且难以把它纳入（Davidson 1978）[^davidson-1978]。显然存在“纯粹意图”的情形，其中尚未采取任何步骤。假设我打算写一篇书评，但还没翻开书。表面上看，这种纯粹意图不能还原为有意行动。再者，一旦承认纯粹意图存在，“就没有理由不允许：当所意图的行动发生时，同样类型的意图也仍然在场”（Davidson 1978, p. 89）[^davidson-1978]。若我有意做的事需要时间（几乎一切事都如此），就会有早期阶段，此时我相对于行动之完成的关系，正如我相对于那些已打算做但尚未开始的未来行动的关系。
