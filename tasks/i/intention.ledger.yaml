      Anscombe’s position on the matter is elusive, and may have to do with her normative claims about intention and belief. Is practical knowledge exempt from ordinary requirements of evidence because there is a mistake of performance, not of judgement, when its object is false? (See Anscombe 1963, pp. 4–5, 56–7; Campbell 2018a.)[^anscombe-1963][^campbell-2018a] Would it then amount to knowledge of what is not the case? Anscombe may seem to suggest as much (Anscombe 1963, p. 82)[^anscombe-1963], but it is unclear whether she accepts or merely entertains this prospect.
    step1: |-
      安斯库姆在此问题上的立场难以捉摸，也许与她对意图和信念的规范性主张有关。实践知识是否因对象为假时发生的错误是执行错误而非判断错误，而豁免于普通的证据要求？（见 Anscombe 1963, pp. 4–5, 56–7; Campbell 2018a。）[^anscombe-1963][^campbell-2018a] 那样它岂不成了对并非实情之事的知识？安斯库姆似乎暗示如此（Anscombe 1963, p. 82）[^anscombe-1963]，但她是接受还是仅提出这一前景，并不清楚。
