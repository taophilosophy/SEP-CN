      > [E]ven if the proposition that it is wrong to encourage children to smoke is obvious to ordinary people in normal circumstances, it is not a good candidate for a self-evident proposition. For a person might understand the claim perfectly and yet not be justified in believing it …. (2019: 145)
    step1: TBD
