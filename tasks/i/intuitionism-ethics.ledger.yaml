    source: |-
      1. A pluralist deontology—there are several basic moral duties that are not analyzed in terms of promoting the good.
      2. Realism about moral facts—some moral facts are independent of the attitudes or stances of any actual or hypothetical beings (and are likely non-natural or *sui generis*, too).
      3. Cognitivism about moral judgments—moral judgments are beliefs, not desire-like attitudes.
      4. The self-evidence of some moral propositions.
      5. The apparent (/seeming) truth of some moral propositions.
