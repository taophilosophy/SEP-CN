      What would philosophical ethics be without intuitions? Consider the following sample of cases and propositions, which are meant to elicit an intuitive response.
    step1: |-
      倘若没有直觉，哲学伦理学将会是什么样子？请考虑下面这组案例与命题，它们旨在引出直觉性的回应。
    step2: |-
      没有直觉，哲学伦理学将会是什么样子？请看下面这组案例与命题——它们都是为了引出直觉回应而设的。
