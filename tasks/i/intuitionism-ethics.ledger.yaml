      ## 1. The History of Ethical Intuitionism
    step2: |-
      ## 1 伦理直觉主义史
  - id: 22
    kind: body
    source: |-
      There is a school of thought known as Ethical Intuitionism associated with some figures in British moral philosophy beginning in the late seventeenth century and up through the mid-twentieth century. Though Ethical Intuitionism introduces and elaborates on some epistemic views, it typically bundles those views with other commitments in first-order ethics and moral metaphysics. In terms of first-order ethics, it affirms a plurality of moral principles. In terms of moral metaphysics, it affirms non-naturalism for moral properties and facts. This section briefly highlights major themes of this school of thought, touching on the work of Samuel Clarke, Richard Price, H. A. Prichard, and W. D. Ross.
    step1: |-
      有一个思想学派被称为伦理直觉主义，它与 17 世纪末至 20 世纪中叶的一些英国道德哲学家相联系。伦理直觉主义虽然提出并阐发了一些认识论观点，但它通常把这些观点与第一阶伦理学及道德形而上学中的其他承诺捆绑在一起。就第一阶伦理学而言，它肯定道德原则的多元性；就道德形而上学而言，它肯定道德属性与道德事实的非自然主义。本节简要勾勒这一学派的主要主题，涉及 Samuel Clarke、Richard Price、H. A. Prichard 与 W. D. Ross 的工作。
    step2: |-
      有一个思想学派名为伦理直觉主义，与 17 世纪末至 20 世纪中叶的一批英国道德哲学家相关联。该学派固然提出并阐发了一些认识论主张，但通常把它们与第一阶伦理学、道德形而上学方面的其他承诺捆在一起：在第一阶伦理学上，它肯定道德原则的多元性；在道德形而上学上，它肯定道德属性与道德事实的非自然主义。本节简述这一学派的几个主要论题，涉及塞缪尔·克拉克（Samuel Clarke）、理查德·普莱斯（Richard Price）、H. A. 普里查德（H. A. Prichard）与 W. D. 罗斯（W. D. Ross）的工作。
  - id: 23
    kind: body
    source: |-
      Clarke wrote in the early eighteenth century, and he was largely reacting to Hobbes’s moral and political philosophy. Hobbes had argued that our moral duties are the result of a social contract. Clarke, on the other hand, thought there were moral duties that exist prior to and independently of any contract (including the duty to abide one’s contracts), and these duties ultimately rest on fundamental, necessary facts about which of our behaviors are fitting and which of them unfitting (1706 [1969: § 225]).
    step1: |-
      Clarke 写作于 18 世纪初，他主要是在回应霍布斯的道德与政治哲学。霍布斯论证说，我们的道德义务是社会契约的产物。Clarke 则认为，有些道德义务先于并独立于任何契约而存在（包括遵守契约的义务本身），而这些义务最终建立在关于我们哪些行为适宜、哪些不适宜的种种根本的、必然的事实之上（1706 [1969: § 225]）。
    step2: |-
      克拉克写作于 18 世纪初，主要针对霍布斯的道德与政治哲学。霍布斯主张，人的道德义务乃社会契约的产物；克拉克则认为，有些道德义务先于任何契约、且不依赖契约而存在（其中也包括信守契约的义务），它们最终植根于一些根本而必然的事实——关于人的哪些行为适宜、哪些不适宜的事实（1706 [1969: § 225]）。
  - id: 24
    kind: body
    source: |-
      For Clarke, there is more than one fundamental duty. There is a fundamental duty of piety to God (1706 [1969: § 240]), a fundamental duty of equity and love toward others (1706 [1969: § 241]), and a fundamental duty of self-preservation (1706 [1969: § 245]). All other duties can be derived from these fundamental ones (1706 [1969: § 245]).
    step1: |-
      对 Clarke 而言，根本义务不止一项：有对上帝虔敬的根本义务（1706 [1969: § 240]），有对他人公正与仁爱的根本义务（1706 [1969: § 241]），还有自我保存的根本义务（1706 [1969: § 245]）。所有其他义务都可从这些根本义务推导出来（1706 [1969: § 245]）。
    step2: |-
      在克拉克看来，根本义务不止一条：有对上帝虔敬的义务（1706 [1969: § 240]），有对他人持守公平与博爱的义务（1706 [1969: § 241]），还有自我保存的义务（1706 [1969: § 245]）；其余一切义务均可由这几条根本义务推出（1706 [1969: § 245]）。
  - id: 25
    kind: body
    source: |-
      In terms of epistemology, Clarke maintained that the fittingness and unfittingness of these behaviours are “self-evident” (1706 [1969: § 227]). Clarke also said that the behaviors that are fitting or unfitting will *appear* to be so to the *understandings* of all intelligent beings (1706 [1969: § 230]). As we shall see, talk of self-evidence and how things appear to the understanding are both central to discussions of contemporary intuitionism.
    step1: |-
      在认识论方面，Clarke 主张这些行为的适宜与不适宜是“自明的”（1706 [1969: § 227]）。Clarke 还说，适宜或不适宜的行为将会在一切智能存在者的*理智*面前*显得*如此（1706 [1969: § 230]）。我们将看到，关于自明性的谈论、以及事物如何在理智面前显现，这两者在当代直觉主义的讨论中都居于核心地位。
    step2: |-
      在认识论上，克拉克主张这些行为的适宜与否是“自明的”（1706 [1969: § 227]）。他还说，适宜或不适宜的行为，在一切智能存在者的 *understanding*（理智）看来都会 *appear*（显得）如此（1706 [1969: § 230]）。下文将表明，自明性之谈与“事物如何在理智面前显现”，正是当代直觉主义讨论的两大枢纽。
  - id: 26
    kind: body
    source: |-
      Let me next turn to Price, who was writing in the mid to late eighteenth century. Whereas Clarke was largely responding to Hobbes’ contractualism, Price was largely responding to the sentimentalism of philosophers like Hutcheson and Hume, and it is probably fair to characterize him as a realist about some moral duties. That is, some moral duties are independent of our attitudes and stances toward those actions that are our duties, and moral judgments about these duties are not sourced in our sentiments or other conative attitudes. Like Clarke, Price is a pluralist about basic moral duties. He believed in duties to God, duties to ourselves, duties of benevolence as well as duties of gratitude, veracity, and justice (1758 [1969: §§ 733–741]).
    step1: |-
      接下来谈 Price，他写作于 18 世纪中后期。Clarke 主要在回应霍布斯的契约论，而 Price 主要在回应 Hutcheson、Hume 等哲学家的情感主义；把他刻画为某些道德义务的实在论者，大概是公允的。也就是说，某些道德义务独立于我们对那些作为我们义务的行为所持的态度与立场，而关于这些义务的道德判断并不源自我们的情感或其他意动态度。与 Clarke 一样，Price 在基本道德义务上持多元论。他相信对上帝的义务、对自己的义务、仁慈的义务，以及感恩、诚实与正义的义务（1758 [1969: §§ 733–741]）。
    step2: |-
      下面转向普莱斯，其写作年代在 18 世纪中后期。克拉克所回应者主要是霍布斯的契约论，普莱斯所回应者则主要是哈奇森、休谟等人的情感主义；把他称为某些道德义务上的实在论者，大体公允——即某些道德义务不依赖我们对相应行为所持的态度与立场，关于这些义务的道德判断也不出自情感或其他意动态度。与克拉克一样，普莱斯在基本道德义务上持多元论，相信对上帝的义务、对自己的义务、仁慈的义务，以及感恩、诚实与正义的义务（1758 [1969: §§ 733–741]）。
  - id: 27
    kind: body
    source: |-
      According to Price, we come to know about fundamental moral duties via *understanding*, which is taken to be a rational way of knowing to be distinguished from the sentimentalists’ *moral sense*. Moreover, Price uses the term “intuition” (which Clarke did not as far as we know) and says that intuition is the use of understanding to discern the nature of things (1758 [1969: § 674]).
    step1: |-
      按照 Price 的看法，我们是通过*理智*来认识根本道德义务的；理智被视为一种理性的认识方式，与情感主义者的*道德感*相区别。此外，Price 使用了“直觉”一词（据我们所知 Clarke 没有用过），并说直觉就是运用理智去辨识事物的本性（1758 [1969: § 674]）。
    step2: |-
      按普莱斯之说，根本道德义务是凭 *understanding*（理智）认识的，而理智是一种理性的认识方式，与情感主义者的 *moral sense*（道德感）分属两途。此外，普莱斯还使用了“直觉”一词（据我们所知，克拉克未曾用过），并说直觉即运用理智去辨识事物的本性（1758 [1969: § 674]）。
  - id: 28
    kind: body
    source: |-
      The simplicity of moral properties, such as rightness and goodness, and our ideas of them, was important for many early intuitionists such as Price. He accepted the empiricist doctrine that simple ideas must be acquired by immediate intuition, as all simple ideas must “be ascribed to some power of *immediate* perception in the human mind” (1758 [1969: § 672]), i.e., either sensibility or the understanding. Consequently, the ideas of right and wrong must be immediate perceptions of either sensibility or the understanding.
    step1: |-
      道德属性——如正当与善——及其观念的单纯性，对 Price 等许多早期直觉主义者来说十分重要。他接受经验主义者的学说：单纯观念必须通过直接直觉获得，因为一切单纯观念都必须“被归于人类心灵中某种*直接*知觉的能力”（1758 [1969: § 672]），即要么归于感性，要么归于理智。因此，正当与错误的观念必然是感性或理智的直接知觉。
    step2: |-
      对普莱斯等许多早期直觉主义者而言，道德属性（如正当、善）及其观念的单纯性至关紧要。他接受经验主义的学说：单纯观念必由直接直觉获得，因为一切单纯观念都必“被归于人类心灵中某种 *immediate*（直接的）知觉能力”（1758 [1969: § 672]），亦即归于感性或理智。由此，正当与错误的观念便只能是感性或理智的直接知觉。
