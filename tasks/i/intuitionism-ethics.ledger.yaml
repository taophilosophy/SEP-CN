      World W₁ has ten billion people all with a high quality of life. Let the aggregate welfare in W₁ be *n*. World W₂ has many, many more people all with lives barely worth living. The aggregate welfare in W₂ is much greater than *n*, for the lesser welfare of each person is more than made up for by the sheer number of people. Intuitively, is W₂ better than W₁? (Parfit 1984: ch. 17)[^parfit-1984].
    step1: |-
      世界 W₁ 有 100 亿人，全都享有高质量的生活。设 W₁ 的总福利为 *n*。世界 W₂ 有远为更多的人，全都过着勉强值得过的生活。W₂ 的总福利远大于 *n*，因为每个人较少的福利被其庞大的人数所远远补偿。直觉上，W₂ 比 W₁ 更好吗？（Parfit 1984: 第 17 章）[^parfit-1984]
    step2: |-
      世界 W₁ 有 100 亿人，人人都过着高质量的生活，设其总福利为 *n*。世界 W₂ 的人数多得多，人人过着勉强值得一过的生活；其总福利远大于 *n*，因为人多势众，足以远远补偿每个人所享有的较少福利。直觉上，W₂ 比 W₁ 更好吗？（Parfit 1984: 第 17 章）[^parfit-1984]
