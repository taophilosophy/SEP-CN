      In some cases there will be more than one *pro tanto* duty operative and the duties will conflict. For Ross, what one ought to do all considered in such cases is not self-evident (which might conflict with Prichard’s view), nor can it be derived from the *pro tanto* duties and their weights. To resolve conflicts of duties, one must use judgment (1930 [2002: 30–31]).
    step1: |-
      在某些情形中，会有一项以上的*pro tanto*义务起作用，而这些义务会冲突。对罗斯来说，在此类情形中，综合考虑之后一个人应当做什么，并不是自明的（这一点可能与普里查德的观点相冲突），也不能从各项*pro tanto*义务及其权重推导出来。要解决义务冲突，必须运用判断力（1930 [2002: 30–31]）。
    step2: |-
      有时会有不止一项*pro tanto*义务同时起作用，彼此冲突。在罗斯看来，此类情形中“通盘考虑后应当做什么”并非自明的（这或许与普里查德相左），也无法由各项*pro tanto*义务及其权重推得；解决义务冲突，须靠判断力（1930 [2002: 30–31]）。
  - id: 43
