      Ross posited seven “*prima facie*” duties—duties of (1) fidelity, (2) reparation, (3) gratitude, (4) justice, (5) beneficence, (6) self-improvement, and (7) non-maleficence (1930 [2002: 21]). Though he uses the term “*prima facie*”, it is generally agreed that he meant these are duties as far as they go, or *pro tanto* (1930 [2002: 19]).
    step1: |-
      罗斯提出了七项“*prima facie*”（初显）义务——（1）信守义务，（2）补偿义务，（3）感恩义务，（4）正义义务，（5）行善义务，（6）自我完善义务，（7）不伤害义务（1930 [2002: 21]）。尽管他使用“*prima facie*”一词，学界一般认为，他的意思是这些义务就其本身而言即为义务，即*pro tanto*（在此范围内）的义务（1930 [2002: 19]）。
    step2: |-
      罗斯列举了七项“*prima facie*”（初显）义务：信守、补偿、感恩、正义、行善、自我完善与不伤害（1930 [2002: 21]）。他虽用“*prima facie*”一语，学界一般认为其意为：这些义务就其自身而言即是义务，亦即*pro tanto*（就此而言）的义务（1930 [2002: 19]）。
  - id: 41
    kind: body
    source: |-
      In terms of epistemology, these duties are self-evident just like mathematical axioms or the validity of a form of inference is self-evident (1930 [2002: 29]). Price claimed that self-evident truths are “incapable of proof” (1758 [1969: § 704]). At one point Ross appears to agree, as he says self-evident moral propositions “cannot be proved, but … just as certainly need no proof” (1930 [2002: 30]). But elsewhere he makes only the more restricted claim that such propositions do not *need* any proof, which should be his considered view (1930 [2002: 29]). A self-evident proposition is one that we *can* be justified in believing without an argument, but this does not rule out the possibility that there may be such an argument, or that the proposition can be (justifiably) believed regardless of its self-evident status, as might happen were we to believe them on the basis of testimony (Audi 2004: 45)[^audi-2004].
    step1: |-
      在认识论方面，这些义务是自明的，正如数学公理或某种推理形式的有效性是自明的（1930 [2002: 29]）。普莱斯声称，自明的真理“无法被证明”（1758 [1969: § 704]）。罗斯一度似乎同意，他说自明的道德命题“无法被证明，但……也确实无需证明”（1930 [2002: 30]）。但在别处，他只提出限制更强的说法：这类命题不*需要*任何证明，而这应是他深思熟虑的观点（1930 [2002: 29]）。一个自明的命题，就是我们*可以*在没有论证的情况下有理由相信的命题；但这并不排除可能存在这样的论证，也不排除该命题可以不依其自明地位而（有理由地）被相信——例如我们凭见证而相信它们时就会如此（Audi 2004: 45）[^audi-2004]。
    step2: |-
      在认识论上，这些义务是自明的，一如数学公理或某种推理形式的有效性是自明的（1930 [2002: 29]）。普莱斯称自明真理“无法被证明”（1758 [1969: § 704]）。罗斯一度似表赞同，称自明的道德命题“无法证明，却……确实无需证明”（1930 [2002: 30]）；但他在别处只作较弱的断言：此类命题不*需要*任何证明——这应视为其成熟观点（1930 [2002: 29]）。自明命题即我们*可以*不经论证而有理由相信的命题；但这既不排除可能存在此种论证，也不排除该命题可脱离其自明地位而（有理由地）被相信，正如我们依据他人证言而相信它们那样（Audi 2004: 45）[^audi-2004]。
