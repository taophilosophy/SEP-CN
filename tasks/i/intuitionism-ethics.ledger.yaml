      ## 3. Intuitive Seemings
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      There are multiple kinds of mental states whereby some content can seem true. The prototypical example is perception. Looking at a green apple, it perceptually seems that this apple is green; looking at a stick dipped in water, it perceptually seems that the stick is bent. Another example is memory. Thinking back, I seem to remember locking the door to the car; I seem to remember my grandfather’s birthday. Another example is proprioceptive. Closing my eyes, I have some sense of where my limbs are. In general epistemology we see the suggestion that intuitions are just another kind of seeming state, or appearance state, distinct from these others (Bealer 1998; Pust 2000; Huemer 2006; Chudnoff 2011a, 2013, 2020; Bengson 2015)[^bealer-1998][^bengson-2015][^chudnoff-2011a][^huemer-2006][^pust-2000]. And in moral epistemology intuitionism is often associated with the idea that ethical intuitions are just intuitive seemings where the content that seems true is ethical content.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Just as perceptual, memorial, and proprioceptive seemings are fallible, so too intuitions qua seeming states are fallible. It can seem to you that *p* when *p* is not the case. And just as perceptual, memorial, and proprioceptive seemings are not beliefs, so too intuitions are not beliefs. You can have an intuition that *p* while failing to believe that *p*. Similarly, we can plausibly distinguish intuitions from hunches, guesses, blind impulses, vague sentiments, preferences for action, or familiar opinion (Sidgwick 1907 [1981]: 211–212)[^sidgwick-1907]. Some have suggested that intuitions are merely inclinations to believe (Williamson 2000; Sosa 2007; Earlenbaugh & Molyneux 2009)[^earlenbaugh-2009][^sosa-2007][^williamson-2000]. But the more common view is that, though intuitions might provide some categorical basis for a disposition to believe what is intuitive, we can distinguish intuitions from mere inclinations to believe. One can be inclined to belief without anything seeming to be the case in an intuitive way.
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      It is natural to wonder if there is some relation between the idea that some propositions are self-evident and seeming state theory. One thing to note is that seeming state theory is not necessarily an alternative to self-evidence theory. For it could be that when one adequately understands a self-evident proposition this manifests as a seeming state. McGrath suggests an alternative way to blend the two theories. She suggest that we characterize the self-evident in terms of seemings:
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      > The self-evident propositions are simply those propositions—if any—whose intellectually seeming true to a subject can be correctly explained by their being true. (McGrath 2019: 148)[^mcgrath-2019]
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
