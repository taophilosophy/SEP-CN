      ## 2. Self-Evident Propositions
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      The notion of a self-evident proposition is a term of art in intuitionist thought, and it needs to be distinguished from certain common-sense understandings with which it may easily be conflated. The first thing to note is that a self-evident proposition is not the same as an obvious truth. To begin with, obviousness is relative to certain individuals or groups. What is obvious to you may not be obvious to me. But self-evidence is not relative in this way. A proposition cannot be self-evident to one person, but not to another. A proposition is just self-evident, not self-evident *to* someone. Secondly, there are many obvious truths that are not self-evident. Certain well-known empirical truths, for example, that if I drop a heavy object it will fall, or that the world is bigger than a football, are obvious but not self-evident. There are also self-evident propositions that may not be obvious to everyone, at least prior to reflection, e.g., that if all *A*s are *B*s and no *B*s are *C*s then no *C*s are *A*s, or that one man can be the father and grandfather of the same child.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      What then is it for a proposition to be self-evident? Locke says that a self-evident proposition is one that “carries its own light and evidence with it, and needs no other proof: he that understands the terms, assents to it for its own sake” (1689: 1.3.4). Price tells us that a self-evident proposition is immediate, and needs no further proof, and goes on to say that self-evident propositions need only be understood to gain assent (1758 [1969: § 747]). Ross writes that a self-evident proposition is “evident without any need of proof, or of evidence beyond itself” (1930 [2002: 29]), and Broad describes self-evident propositions as being
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      > such that a rational being of sufficient insight and intelligence could see it to be true by merely inspecting it and reflecting on its terms and their mode of combination. (Broad 1936: 102–3)[^broad-1936]
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      These passages may have led to the standard account of a self-evident proposition in the contemporary literature. According to Robert Audi, a self-evident proposition is “a truth” such that
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      > an adequate understanding of it is sufficient both for being justified in believing it and for knowing it if one believes it on the basis of that understanding. (Audi 1998: 20; 1999: 206; 2004: 49; see also Audi 2008: 478)[^audi-1998][^audi-2008].
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Similarly, Russ Shafer-Landau says
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      > A proposition *p* is self-evident = if *p* is such that adequately understanding and attentively considering just *p* is sufficient to justify believing that *p*. (Shafer-Landau 2003: 247)[^shafer-landau-2003]
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      It seems fairly clear that this is not going to be inferential justification, for it is not as though understanding plays the role of some premise from which belief in the self-evident proposition is inferred.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      As for candidate self-evident moral propositions, many philosophers have focused on certain general moral principles. W. D. Ross, as we have seen, thought that there were seven self-evident moral duties, such as the duty to keep one’s promises. But others have suggested that verdicts on cases can be self-evident (Clarke 1706: 192; Prichard 1912 [2002: 13])[^clarke-1706][^prichard-1912].
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      One should distinguish knowing a self-evident proposition from knowing that that proposition is self-evident. The former does not imply the latter. Someone might know some self-evident proposition, such as that if *A* is better than *B* and *B* is better than *C* then *A* is better than *C*, but lack the concept of self-evidence, so couldn’t know that that proposition is self-evident. One might even know a self-evident proposition whilst endorsing a theory according to which no propositions are self-evident.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      According to the standard account, a self-evident proposition is one which an adequate understanding of the proposition justifies us in believing it. That may sound odd. It is natural to think that justified belief requires evidence for the proposition believed, whereas adequately understanding a proposition never entails evidence for the proposition. Robert Audi has, however, recently offered an account of adequate understanding. He suggests that adequate understanding is a kind of direct apprehension of the truth-makers for the proposition, particularly concepts and relations that help make the proposition true. This, he suggests, “tends to yield an intuition,” which is the right sort of thing to justify belief (Audi 2019: 379–380)[^audi-2019].
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      Be that as it may, most recent intuitionists have shied away from relying on the notion of a self-evident proposition. Before turning to other themes, note that self-evident propositions have been characterized in terms of their *epistemic role* when what we ultimately want is some metaphysical account of self-evident propositions capable of explaining that epistemic role. Not all true propositions are such that adequate understanding justifies us in believing them. If there is a special sub-class of propositions that have these epistemic properties, plausibly they have them in virtue of their non-epistemic properties. So what are those non-epistemic properties? Some of the examples offered suggest an answer.
    step1: TBD
    step2: TBD
