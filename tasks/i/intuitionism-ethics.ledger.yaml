      This brief historical overview concludes with the figure most influential in contemporary debates: W. D. Ross. Ross wrote in the early to mid-twentieth century as well, and he was largely criticizing the consequentialism of G.E. Moore. Ross asked us to consider a right action like keeping a promise, and ask what *makes* it right. The consequentialist reply is that right actions are right because they produce the most good. Ross rejoined that this is not what the “plain man” really thinks. Instead, the plain man thinks that what makes the action right is that one promised to do it (1930 [2002: 17–18]).
    step1: |-
      这份简短的历史概述以当代争论中最有影响力的人物收尾：W. D. 罗斯。罗斯同样写作于二十世纪早期至中期，主要批评 G. E. 摩尔的后果论。罗斯请我们考虑一个正当行为，比如信守承诺，并追问是什么*使*它成为正当的。后果论的回答是：正当行为之所以正当，是因为它们产生最多的善。罗斯反驳说，这并不是“常人”真正所想的。相反，常人认为，使该行为成为正当的，是一个人曾许诺去做它（1930 [2002: 17–18]）。
    step2: |-
      这份简短的历史梳理以当代讨论中最具影响的人物作结：W. D. 罗斯。罗斯也写作于二十世纪前中期，主要批评 G. E. 摩尔的后果论。他请我们考虑一个正当行为——比如信守承诺——并追问：究竟是什么*使*它正当？后果论答曰：正当行为之所以正当，端在于它们产生最多的善。罗斯反驳说，“常人”并不真作如是想；常人以为，使该行为正当的，是当事人曾许诺去做它（1930 [2002: 17–18]）。
