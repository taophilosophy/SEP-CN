    kind: body
    source: |-
      But there are those who maintain that some ethical intuitions are *sentimental* seemings. Sabine Roeser, for example, defends what she calls *affectual intuitionism*, which is the view that moral emotions are felt value judgments that provide epistemic access to objective moral truths (2011: ch. 5). To be clear, though she uses the term “intuitionism”, she does not think that ethical intuitions are non-doxastic states. For her, moral emotions are partly constituted by moral judgments, which provide epistemic access to moral truths by reliably tracking the moral facts. For this reason, it is not clear how she might distinguish intuitions from other sorts of states, as the seeming state theory tries to do. Christine Tappolet has a similar view, though she denies that having an emotion entails having an evaluative judgment. Still, she thinks emotions track and represent values in some way, and emotions are epistemically indispensable to discovering evaluative facts (Tappolet 2011)[^tappolet-2011]. Indeed, there are many neo-sentimentalists who think moral judgments “come from” sentiment in some way, but who do not explicitly talk about intuitions as distinct from moral judgments.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      A neo-sentimentalist view that more clearly fits with seeming state theory is that of Antti Kauppinen. For him, substantive moral emotions are quasi-perceptual: they present evaluative content (e.g., indignation presents injustice). These emotional appearances are *prima facie* justifiers, just like any other appearance. But Kauppinen argues that grounding the seemings in emotion instead of the intellect does a better job explaining two key features that distinguish substantive moral intuitions from intuitions of other sorts:
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      1. their phenomenology is distinctive and diverse, often involving an affective tone and
      2. they provide (intrinsic) motivation (2013; see also Dancy 2014)[^dancy-2014].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      On the differences between moral intuitions and intuitions of other sorts see also DePaul (2009: 211), Wielenberg (2014: 111), Bedke (2008, 2016).
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Similarly, James Hutton (2022) defends a view he calls “emotional intuitionism”. As with Roeser and Tappolet, it is not clear that intuition *per se* plays a role. His main claim is that moral *experiences* consist of emotions. He argues that this best explains two observations:
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      1. in the most compelling cases of moral experience, emotions are present, and
      2. the moral experience covaries with the presence of the emotions.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Insofar as moral experiences consist of moral seemings, this would classify moral intuitions and sentimental seemings.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      There is the possibility of pluralism about intuitive seemings in ethics, where some are intellectual and others are sentimental. Intuitions about formal matters like the transitivity of value, for example, are not likely sentimental even if some substantive moral intuitions are sentimental. And substantive intuitions about the moral statuses of actions, perhaps the impermissibility of rape, are arguably better candidates for sentimental seemings.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      ## 4. Apprehension
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Some intuitionists embrace an ability to rationally *apprehend* certain facts. We find this idea both in those who are friendly to self-evident propositions and those who are friendly to seeming state theory. Unlike seeming states, apprehensions are factive. There are different ways to develop this thought. You might think some propositions are true thanks to the relations of the properties/universals featured in the proposition. If so, you might posit an intellectual ability to grasp these properties/universals and relations among them (Huemer 2005: 124–126; see also Russell 1912: chs. IX–XI; Cuneo & Shafer-Landau 2014)[^cuneo-2014][^huemer-2005][^russell-1912]. Similarly, Bengson, Cuneo and Schafer-Landau (2023; 2024) endorse Price’s view that we can intellectually apprehend the *essences* of certain act types. According to them, we can thereby intellectually see (via what they call “Pricean reflection”) that certain act types are essentially morally valanced (2024: ch. 4). For example, we can intellectually see that
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      > [I]t is essential to protecting one’s children from lethal danger that an action instantiates this property only if there is strong moral reason to perform it. (2024: 340).
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      These theories of intellectual apprehension might help flesh out the idea of a self-evident proposition. As noted above, we would like to know what it is about some true propositions, or what it is about our understanding, such that those propositions can be justifiably believed or known on a basis of understanding them. We could start an answer along the following lines. First, some propositions are true thanks to the relations of the properties/universals featured therein. Second, our powers of understanding are such that we can grasp the relations between certain properties/universals, and when we do so it is a kind of apprehension.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      For those who embrace intuitions as intellectual seemings and also maintain that sometimes we intellectually apprehend certain moral facts, there is a nice parallel with perceptual seemings and perception. We can divide perceptual seemings into the good cases and the bad cases. In good cases it not only perceptually seems that *p*, but we perceive that *p*. In the bad cases, it only perceptually seems that *p*, and we do not perceive that *p*. From the inside, these might be indistinguishable and it might be that the seemings in both cases provide justification, but only in the good cases do we get knowledge. The same can be said for intellectual seemings. Intellectual seemings always justify but only in the good cases—the cases that are also intellectual apprehensions—do we get knowledge.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      ## 5. Conceptual Competence
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Intuitions are often associated with conceptual competence in roughly the following way. When one has a certain degree of conceptual competence one possesses, perhaps implicitly and in ways that are difficult to capture in language, criteria for what it takes to fall under the concept (or what it takes to fall outside the concept). It is then possible to craft cases and propositions in such a way that they directly engage one’s conceptual competence, and enable one to apply a concept or concepts solely on the basis of conceptual competence. For some views sympathetic to this line of thought see, e.g., Goldman (2007: 4; 2013: passim), Graham and Horgan (1994), and Ludwig (2007).
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Applied to the ethical domain, the thought is that some case-based intuitions just are states of categorizing with a concept based solely on conceptual competence (or this plus reflection), and some intuitions concerning more general propositions are recognitions of conceptual connections based solely on one’s conceptual competence (or this plus reflection).
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      We could psychologize concept possession and competence, whereby having a concept is to psychologically encode some criteria for how to apply it. Or we could make the view less psychologized. For this second option, we could connect it back with the apprehension account above, and with a capacity of our understanding to apprehend abstract relations between properties/universals. One such view would say that what it is to fully grasp a concept is to have the capacity, if favorable conditions, to apprehend those abstract relations.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Robert Audi appears to endorse a view like this, though he makes use of the idea of conceptual containment. He suggests that a self-evident proposition is one where the concept of the subject *contains* the concept of the predicate (Audi 2008: 479)[^audi-2008]. Conceptual containment is typically associated with analytic propositions, where one tries to explain what it is for a proposition to be true in virtue of the meanings of its constituents. Thus, “a vixen is a female” is analytically true (or so the proposal goes) because the concept of being a vixen contains the concept of being a female.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Audi suggests, however, that not all cases of containment are associated with analytic propositions. In support of this idea, Audi proposes the following example: that burning a person with a red-hot poker would cause him excruciating pain is a moral reason not to do it (Audi 2008: 479)[^audi-2008]. Here the concept of being a moral reason for action allegedly contains the concept of avoiding the causing of pain in a way that makes the second a sufficient condition for the first. It takes grasping these concepts and some reflection to see the correlative fact: that phi avoids the causing of pain is a reason to phi.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Similarly, Robert Cowan (2017) has suggested that one way to develop Ross’s view of self-evident *prima facie* duties is to make those duties implicit commitments for anyone who possesses the relevant moral concept. Adequate understanding, on this view, enables one to make explicit conceptual connections (perhaps with the help of reflection), and the Rossian duties are propositions that make explicit those conceptual connections.
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      The main problem with tying one’s moral metaphysics and epistemology too closely to conceptual competence is that it seems to over-generate cases of conceptual incompetence. Start with your favorite intuition that survives scrutiny and which you use to form a belief. Is it not possible for someone to disagree with you even though they possess the relevant concepts (to a very high degree), they reflect adequately, and they are not otherwise cognitively impaired? They might be mistaken in their judgment, but it does not seem to be a *conceptual* mistake akin to the mistake one makes when they deny that a vixen is a female (see Bedke 2008, 2010, 2016)[^bedke-2008].
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      ## 6. Outputs of System 1 Processing
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      It is worth mentioning a theory of intuitions more prevalent in the psychology literature. It starts with the idea that cognition has two reasoning processes, system 1 and system 2. System 1 processing is characterized as implicit, fast, automatic, low effort, and modular (think of gut reactions based on stereotypes and heuristics), while system 2 processing is explicit, slow, deliberative, effortful, and general-purpose (think of deductive reasoning with many premises). Drawing on this distinction in cognitive science, some psychologists working on moral cognition have suggested that some intuitions are affective responses from system 1 processing (Haidt 2001; Haidt & Bjorklund 2007)[^haidt-2001][^haidt-2007]. Based on fMRI scans of brain activation, Joshua Greene (2008) has argued that consequentialist judgments are largely the products of system 2 while deontologist judgments are largely the products of system 1.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      This approach is not necessarily inconsistent with other approaches. But without any finer grained distinctions, it would lump intuitions together with all sorts of other judgments that do not have the same surface features or the same epistemic role. Hunches, impulses, and other states whereby there is no proposition that seems true, and which do not defeasibly justify, are likely some of the outputs of system 1.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      ## 7. Some Challenges
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      ### 7.1 Disagreement
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Many philosophers think that pervasive moral disagreement casts doubt on the claim that certain moral propositions are self-evident. If there were certain moral propositions that can be known if adequately understood, then people with an adequate understanding of them would believe them, and there would be universal assent amongst mature, comprehending people. But there is no such universal assent, at least for the substantive ethical propositions that intuitionists have used to craft a moral theory. So none of those principles are self-evident. Or so one can argue.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      One way intuitionists could defend the view is to grant disagreement over allegedly self-evident propositions and suggest ways to deal with the problem. This was Sidgwick’s strategy. He thought that if there was significant disagreement about the truth of some apparently self-evident moral proposition, then that proposition might not be self-evident. To deal with it, he gives guidance on how to do the best we can in discerning what is self-evident. To guide us, he sets forth four conditions sufficient to establish “a significant proposition, apparently self-evident, in the highest degree of certainty attainable” (1907: 338):
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      1. the target proposition must be clear and precise,
      2. its self-evidence must be ascertained by careful reflection,
      3. taken as a whole, propositions taken as self-evident must be mutually consistent, and
      4. the target proposition must lack universal or general denial by others, or at least lack denial among experts (Sidgwick 1907 [1981]: 211–212, 338–342)[^sidgwick-1907].
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      He also warned that it is easy to confuse intuitions with blind impulses, vague sentiments, preferences for action, conclusions from rapid half-conscious processing, and current opinions to which familiarity has given an illusory air of self-evidence, such as conventional law (Sidgwick 1907 [1981]: 211–12)[^sidgwick-1907]. His own attempts to be mindful of these considerations led him to propose the following as self-evident: that the good of any one person is as important as the good of any other, and that one is rationally bound to aim at the good generally, not any part of it (Sidgwick 1907 [1981]: 382)[^sidgwick-1907]. From these and supplementary claims about the good, he argues for a form of consequentialism called *Hedonic Utilitarianism*.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Other intuitionists allow that various other factors can lead to disagreement over what is self-evident. Clarke, for instance, allowed that stupidity, corruption, or perverseness may make one doubt self-evident propositions (1706 [1969: § 227]). John Balguy also acknowledges that self-evident moral principles, like many other plain and evident truths, may be, and have been, doubted, “even by philosophers and men of letters” whom, presumably, he did not regard as stupid or corrupt (1728 [1969: § 458]). And Price maintained that all forms of knowledge, including intuitive knowledge, may be evident in different degrees (1758 [1969: § 706]). Intuition may be clear and perfect, but may sometimes be faint and obscure. Such variance in degrees of clarity allows that a self-evident proposition may be imperfectly and obscurely grasped, and this may lead someone to deny its truth. Similarly, Moore claimed that “every way in which it is possible to cognise a true proposition, it is also possible to grasp a false one” (1903 [1993: 36]), and Ross notes that self-evident propositions may only be evident to us once we reach a certain moral maturity (1930 [2002: 29]). Given all these ways in which the truth of a self-evident proposition may be missed, it is no surprise that there is no universal assent. But the absence of universal assent is quite consistent with self-evidence, as long as one does not regard “self-evidence” to mean, or imply, obviousness.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Despite what has been said above, critics of intuitionism can claim that the fact that there is fundamental disagreement between moral philosophers and even between intuitionists themselves undermines the view that certain propositions are self-evident. These philosophers will have thought long and hard about the relevant propositions, and (we would hope) have a very clear understanding of them. One would, therefore, expect that if there were certain moral propositions the truth of which could be apprehended by understanding, then moral philosophers would converge on these truths. Persistent disagreement amongst reflective, thoughtful, and comprehending moral philosophers may cast doubt on the view that any of these propositions are self-evident.
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      An alternative strategy for intuitionists is to downplay the amount of fundamental disagreement over allegedly self-evident propositions. They might claim that a lot of moral disagreement stems from disagreement about non-moral facts, such as what the consequences of a certain act will be. For instance, two people might disagree about whether it is permissible to boil lobsters alive just because they disagree about whether lobsters can feel pain. Since the basis of their moral disagreement is this disagreement about the relevant neurological fact, if they agreed on this non-moral fact, we could expect them to agree about the permissibility of boiling lobsters alive.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      Furthermore, although people might disagree about the permissibility of boiling lobsters alive, we may assume that they agree that pain is a bad thing, and the infliction of undeserved pain is *prima facie* wrong. If this assumption is correct, then the disputants agree about the moral facts here. They disagree only about the empirical, non-moral facts.
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      Another factor that might explain moral disagreement is disagreement about the strength of certain moral reasons. Many disputants might agree about the non-moral facts, and about what is morally relevant, but disagree about the weight that should be given to the different moral considerations. So, for example, two people might disagree about whether they ought to push a large man onto the rail tracks to derail a trolley that would otherwise kill five people, but this is quite consistent with them agreeing that the fact that this act would save five people counts in favour of pushing the man off the bridge, and that the fact that he would die if this were done counts against doing it. In such a case there is agreement about what is relevant, and how it is relevant, but disagreement about the weight of the competing moral considerations—one person regards the evil of killing one person as weightier than the good of saving five, while the other regards the evil of killing one as outweighed by the good of saving the five. There is still moral disagreement here, but it is simply a difference in judgement about the application of agreed moral principles.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      This fits with the intuitionist view held, e.g., by Ross, that causing good outcomes is *prima facie* right, and that causing harm is *prima facie* wrong, for Ross held that both of these propositions are self-evident. He denied, however, that the stringency, or weight, of these different *prima facie* duties is self-evident (1939: 188).
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      So far we have only discussed disagreement that concerns self-evident propositions. Turning to the idea that intuitions are seemings, one question is the extent to which different people have different intuitive seemings when considering the same proposition or case. It is worth emphasizing here that disagreement in moral judgment does not imply that people have different intuitive seemings. Two people could start with the same intuitions on cases. Reflection and lots of other influences could lead one to embrace consequentialism and the other to embrace deontology.
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      Still, Michael Huemer (2008) has claimed that some ethical intuitions are not shared, and he suggests this is due to a number of reasons: that they have been influenced by one’s culture, that they have been influenced by evolutionary pressures, that they sometimes support theories that promote one’s self- interests, that they sometimes line up with strong emotion, and that the abstract ones are prone to an overgeneralization bias. On these grounds he is inclined to place more trust in formal intuitions, like the intuition that if *a* is better than *b* and *b* is better than *c*, then *a* is better than *c* (the transitivity of value), for he thinks such intuitions are less susceptible to the distorting influences.
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      Stich and Machery (2023) have compiled a helpful chart of some experiments that purport to find differences in intuitions that correlate with various demographic categories (e.g., religion, age, gender, social class, etc.). To evaluate the significance of the experiments, first note that it is difficult to experimentally measure what intuitions people have. They can self-report, but it is not clear the extent to which reports tap into intuitions as opposed to beliefs or other mental states that are not intuitions *per se* (Bengson 2013)[^bengson-2013]. As lately noted, it is easy for there to be a mismatch between our intuitions and our judgments. Indeed, it is often quite reasonable to fail to believe what one finds intuitive, just as it is often reasonable to fail to believe what perceptually seems to be the case. Consider someone who is familiar with the Müller-Lyer illusion, where one line can look longer than another, but one reasonably believes it is not longer. Similarly, it is plausible to suppose that many act consequentialists still have the intuition that it is wrong to harvest organs from a healthy but non-consenting donor to save five other lives. But because they have persuaded themselves of the truth of act consequentialism, they would not believe this act is wrong.
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Be that as it may, suppose there are demographic differences in what people find intuitive. Though it is commonly supposed that this somehow undermines the epistemic role of intuitions, nothing here undermines the basic idea that intuitions provide pro-tanto, *defeasible* justification for believing that which is intuitive. Whether inter-personal differences in intuitions provide a defeater is another question. Sinnott-Armstrong suggests that relying on intuitions that vary between persons is akin to reliance on the reading of one random thermometer in a box of one hundred thermometers, some portion of which are known to be unreliable (2006b: 201). Bedke (2013) argues that this overstates the case. Drawing an analogy with cases where others report *perceptual* seemings that differ from your own, it is not always the case that reported differences in seemings defeat the justification provided by one’s seeming states.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      Some of this literature taps into the broader issue of peer disagreement, where the rough idea is that not any kind of disagreement undermines your justification, but disagreement with an epistemic peer could. It is not always clear that differences in intuitive seemings are differences among peers, and indeed the very fact that another does not share your intuitions might be some evidence that they are not a peer (Audi 2008: 490; Enoch 2010: 979–981)[^audi-2008][^enoch-2010].
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      ### 7.2 Framing and Ordering Effects
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Consider the following three cases:
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      - **Switch:** there are five people on the rail track, and an out of control trolley that will kill all five of them. There is a lever that would divert the trolley onto a different track. But there is a single person on that track who would be killed if you pull the lever and divert the trolley.
      - **Bridge:** there are five people on the rail track, and an out of control trolley that will kill all five of them. There is a large man standing on the bridge over the track. If you pushed him off the bridge onto the track, he would be killed. But he would derail the trolley and so the five people on the track would be saved.
      - **Trap door:** there are five people on the rail track, and an out of control trolley that will kill all five of them. There is a man standing on the bridge over the track. If he fell onto the track he would be killed, but would derail the trolley thus saving the five people on the track. He is standing on a trap door that would open and drop him onto the track if you pulled a lever.
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      People tend to say that they should pull the lever in Switch, but that they ought not to push the man off the bridge in Bridge. Bridge looks similar to Switch in that you would be killing one person to save five. So why the different intuitions? One could try to explain away these apparently conflicting intuitions by providing principles that identify the morally relevant differences between the cases. That is grist for the deontologist’s mill.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      It would be troubling if the intuitions on these cases were not stable, and particularly if they could be pushed around by morally irrelevant influences. One does not want to base one’s beliefs on unreliable intuitions. Some experiments have tried to address the issue. In Petrinovich and O’Neill (1996) participants were given trolley-type cases where the framing of the case was manipulated. If given an option couched in terms of “kill” wording (e.g., “to throw the switch which will result in the death of the one innocent person”), participants on average disagree slightly with the action, whereas if given an option in terms of “save” wording (e.g., “to throw the switch which will result in the five innocent people on the main track being saved”), subjects on average slightly agree with the action.
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      That same paper reported other studies that showed ordering effects. Subjects were asked to indicate their approval of actions (described in terms of saving) in three trolley-type questions given in sequence. One set of subjects got the questions in one sequence, and another set of subjects got the same questions in reverse sequence. On average, subjects more strongly approved of an action when it appeared first in the sequence than when it appeared last, and the degree of approval for the middle case varied depending on which of the other two trolley-type cases came first.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      From framing effects like these, Sinnott-Armstrong argues that it is reasonable to “assign a large probability of error to moral intuitions in general” (Sinnott-Armstrong 2008: 99)[^sinnott-armstrong-2008]. For him, any given moral intuition must be shown to be immune from such effects before it can be justified.
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      But it is not clear that this is the conclusion to draw. For one, it is not clear these experiments tapped intuitions. The studies ask participants to register their *approval of action* rather than to classify actions under moral categories (e.g., impermissible, permissible). So it is not clear that the findings reflect the apparent truth of moral propositions. This is a difficult problem to overcome. Other studies have asked for people’s *judgments* about what is obligatory or permissible on hypothetical cases (Tobia, Buckwalter & Stich 2013; Schwitzgebel & Cushman 2012; Lombrozo 2009)[^lombrozo-2009][^schwitzgebel-2012], but as we noted above people’s judgments do not necessarily reflect their intuitions. Still, it might be that judgments show order effects for both philosophers and non-philosophers (Schwitzgebel & Cushman 2012; see also Lombrozo 2009)[^lombrozo-2009][^schwitzgebel-2012]. Tobia, Buckwalter & Stich (2013) reported an “actor-observer” bias for both philosophers and non-philosophers, where judgments differ depending on whether the experimental participant or some other party is cast as the actor (e.g., the one considering slipping the switch). But there are two other studies where that failed to replicate (Tobia, Chapman, & Stich 2013; Horvath & Wiegmann 2022)[^horvath-2022]. For a recent set of studies showing some framing effects and biases among philosophers and non-philosophers see Horvath and Wiegmann (2022).
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      Second, it is worth noting that in some of these studies what is measured is the degree to which participants agree with certain claims, or the degree to which certain actions are bad or good. Statistically significant differences in such things is not necessarily a signal of the unreliability of the judgment. One could reliably approve or reliably judge something good, but unreliably approve to the same degree, or say it is good to the same degree, across morally irrelevant manipulations.
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      Third, even if we grant that there are framing and ordering effects for intuitive seemings in some studies concerning some cases, and these effects carry over to judgments based on the intuitions, it is not the case that we should assign a large probability of error to *all* intuitively based ethical beliefs. For one, we do not have enough evidence to generalize from the cases where the effects have been shown to say that *all* intuitions are subject to these effects. For another, we are aware of these effects in a number of other domains, but we do not conclude in those domains that all judgments in those domains are unreliable (cf. Horne & Livengood 2017)[^horne-2017]. So though the framing and ordering effects are interesting and we should take them into consideration when improving our moral outlooks, it is not clear that they support the conclusion that moral intuitions as a class are unreliable.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Fourth, these experiments are trying to test intuitions about our overall moral duties—that is, about what we should, or may do in certain circumstances. As we have seen, not all intuitionists claim that principles about what we ought to do are intuitive. W. D. Ross for example claimed that only principles of *prima facie* duty are self-evident, and principles of *prima facie* duty are, roughly, principles stating that certain facts count in favour of an act and others count against. So these principles state, for instance, that the fact that one’s act would produce some good, or the fact that it would be the keeping of a promise, or the expression of gratitude, etc., counts in favour of it, and the fact that, for example, it would involve the infliction of harm on someone counts against it. For one study on the stability of intuitions on the moral valence (counting against or counting in favor) of Rossian-type considerations, see James Andow (2018).
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      ### 7.3 Debunking Certain Views in Normative Ethics
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Other studies have shown emotional influence on moral judgment. Joshua Greene, for instance, uses fMRI technology to look at what areas of the brain are most active when subjects report moral judgments (Greene, Sommerville, et al. 2001; Greene 2008)[^greene-2008][^greene-2008-2]. He finds that regions of the brain associated with more emotional, “intuitive” processing are more active in subjects who report characteristically deontological judgments—for example, the intuition that it is impermissible to push the fat man off the bridge in the footbridge version of the trolley case—whereas regions of the brain associated with deliberative cognition are more active in subjects who report consequentialism-friendly judgments. (Because some emotional areas of the brain are activated for subjects who give consequentialism-friendly responses, Greene now says that the deontological intuitions are more alarm-like, whereas the consequentialist intuitions are more currency-like (Greene 2008: 41)[^greene-2008][^greene-2008-2].) Moreover, Greene reports that cognitive load, which is the burden of being taxed with tasks that interfere with deliberative cognition, selectively interferes with consequentialism-friendly responses. So subjects who give the consequentialism-friendly response to Footbridge while under cognitive load show longer response times (Greene, Morelli, et al. 2008).
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      Both Joshua Greene and Peter Singer have used results like these to argue that moral intuitions, or at least deontology-friendly intuitions, are likely unreliable (Greene 2008; Singer 2005)[^greene-2008][^greene-2008-2][^singer-2005]. Why unreliable? First, deontological intuitions are sensitive to *morally* *irrelevant* factors, such as whether you kill someone by pushing him versus throwing a switch. Second, deontological intuitions are the result of fast and frugal “intuitive processes” that were selected by evolution to produce fitness enhancing behaviors in some environment, rather than to track the moral facts (which perhaps this helps to explain the first thread of reasoning; see also Timmons 2008)[^timmons-2008].
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      What are we to make of these results and the conclusions drawn by the researchers? First, it is not clear whether intuitions as characterized by Audi, Shafer-Landau, Huemer and others are elicited in these studies, though this can be obfuscated by the fact that psychologists call the fast and frugal processes responsible for some moral judgments “intuitive processes”. Haidt and Bjorklund, for example, define a moral intuition as “the sudden appearance in consciousness or at the fringe of consciousness, of an evaluative feeling (like-dislike, good-bad)…” (2007: 188). That does not sound like intuitions as characterized by intuitionists themselves. We should try to make sure that the propositions or mental states to which intuitional epistemologists attribute epistemic roles are the ones under study before we draw any negative conclusions about the justificatory role of intuitions from these empirical results.
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      Supposing that these studies do elicit intuitions as intuitional epistemologists have understood them, still, any claim like Greene’s and Singer’s that deontology-friendly intuitions are sensitive to *morally irrelevant factors*, or are the product of something selected by evolution *without regard to the facts*, stakes some claim on what is and what is not morally relevant, or what the moral facts are. These commitments are not the result of empirical inquiry, but intuition. So even if some intuitive justification is defeated when one appreciates these findings, it is in part because intuition succeeds in justifying beliefs about what is or is not morally relevant, or beliefs about the moral facts. Also, the status of being a defeater is something the empirical results do not deliver—at best they exploit the fact that we treat certain considerations as defeaters (Berker 2009)[^berker-2009].
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      ### 7.4 Debunking and Metaethics
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      The concerns just mentioned target deontological intuitions. Other concerns are in a way broader, targeting general metaethical theories that mix an intuitive epistemology with metaphysical doctrines about the corresponding moral facts.
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      The most influential criticism along these lines is the evolutionary debunking argument. Sharon Street (2006) has pressed an evolutionary debunking argument against moral realism (but see also Vavova 2015)[^vavova-2015]. She argues that we have many of our moral judgments (or tendencies toward certain moral judgments) because they are adaptive, and not because they are mind-independently true. More generally, we might wonder if any of the causal forces that make us have the intuitions that we do have anything to do with the moral facts, particularly if we understand those facts to be non-natural or otherwise *sui generis* (Bedke 2009; 2014)[^bedke-2009].
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      These points are meant to be debunking in some way, but it is not clear how to articulate the debunking premise. It could concern modality—our intuitions or beliefs or the methods we use are not safe or sensitive or modally reliable. It could concern probability—our intuitions or beliefs are not likely true, or are not likely to track truth. It could concern explanation—the target facts are not explanatorily connected to why we have our intuitions or beliefs. Whether some concern in this ballpark is genuinely debunking remains hotly contested.
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      If our moral metaphysics is non-naturalist, perhaps moral facts and properties are non-causal. In that case, the debunking premise could say we cannot know of something that is causally impotent. This would be an application of a more general debunking argument against causally impotent facts or properties. Applied to mathematics, for example, it has been known as the Benacerraf-Field objection. Intuitionists might respond by asking why a property must be causally efficacious if we are to be able to know which things have that property. Causal theories of knowledge have been largely rejected. Alternatively, intuitionists could back off any commitment to non-naturalism. That does not appear to be an obligatory metaphysical position to pair with an intuitional epistemology (Bengson 2013)[^bengson-2013].
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      Debunking arguments like these are a topic unto themselves, and they can be applied regardless of whether one’s moral epistemology is intuitional or not. That is to say, they are not a special problem for intuitional moral epistemology.
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
