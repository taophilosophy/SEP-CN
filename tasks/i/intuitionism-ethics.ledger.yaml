      ### 3.1 The Epistemology of Intuitive Seemings
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      Epistemically, the idea is that all these seeming states, intuitions included, play an important epistemic role. We can follow Huemer’s nomenclature and call the epistemic principle Phenomenal Conservatism: For all *p*, if it seems to you that *p*, and if you believe that *p* based on it seeming to you that *p*, your belief is *pro tanto*, defeasibly justified (cf. Chudnoff 2011b; Huemer 2006; Pryor 2000)[^chudnoff-2011b][^huemer-2006][^pryor-2000]. This basing relation is not typically considered an inferential relation. In fact, this epistemic role is well suited to an internalist, foundationalist epistemology where seeming states are unjustified justifiers. Beliefs based on them are foundationally justified and from that foundation we can infer other beliefs that thereby enjoy inferential justification.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      As articulated, Phenomenal Conservatism allows intuitions to justify beliefs without any externalist conditions, such as a reliable connection to the moral facts. To see this, imagine that we are being massively deceived by an evil demon (unbeknownst to us) and none of our seeming states are veridical. Still, according to the principle, we are justified in believing that things are as they seem to be. A more externalist epistemology would pay more attention to the right connections with the external facts, and it would not allow beliefs to be justified unless they had some good connection with the facts. For example, we might not want a belief to be justified unless it was produced by a reliable belief-forming process, in which case we want beliefs based on intuitions to be part of a reliable belief-forming process (Markie 2005: 356–357)[^markie-2005]. And there is nothing to prevent an epistemology of seemings that assigns some role to external connections. Shafer-Landau (2003: chs. 11–12), for example, has a moral epistemology that mixes internalist and externalist elements.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      If we stick with Phenomenal Conservatism and its internalism, note that it underwrites a standard practice in ethics where intuitions play a central role in getting our beliefs off the ground, but best explanations, reflective equilibrium, and coherence can ultimately lead us to reject some things that were initially intuitive. Suppose we have a bunch of moral intuitions: an intuition that P, and intuition that Q,… and so on. On this basis we believe, and have some defeasible justification for believing, that P, that Q,… and so on. We can then consider what plausible theory best explains any pattern that emerges from P, Q, etc. The outcome of this process might be to ultimately reject some of P, Q, etc. But the main idea here is that intuitions legitimately feed into a respectable form of inquiry that gives intuitions some *pro tanto* and defeasible epistemic weight, much like other seeming states. And much like other seeming states, we might come to disbelieve some of the things that seem true, based on our best overall theories (as we reject the proposition that the stick in water is bent even though it appears so.)
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Seen in this light, moral theory that relies on moral intuitions is just one domain among many where some things seem true, one thereby has some justification for believing that which seems true, and theory helps to best explain all that is true. This resonates with Ross’s position. Recall that he said “the moral convictions of thoughtful and well-educated people are the data of ethics, just as sense-perceptions are the data of natural science” (1930 [2002: 41]). Seeming state theorists simply think seeming states play this role, not the convictions of thoughtful and well-educated people.
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      ### 3.2 Intellectual vs Sentimental Seemings
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      So far, the seemings at issue have been characterized as intuitive seemings. But virtually everyone who characterizes intuitions as seeming states call them *intellectual* seemings or appearances (see, e.g., Bealer 1998; Huemer 2005: ch. 5; Bengson 2015)[^bealer-1998][^bengson-2015][^huemer-2005]. If ethical intuitions are intellectual seemings, this highlights continuity with the rationalist tradition found in Ethical Intuitionism.
