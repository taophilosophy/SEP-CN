      To approach these issues, we begin with the history of Ethical Intuitionism in section 1. Section 2 discusses moral epistemologies that give a significant role to self-evident moral propositions. Section 3 discusses moral epistemologies that identify intuitions as seeming states that play a foundational epistemic role. Section 4 discusses the role of intellectual apprehension in some intuitional theories. Section 5 discusses the role of conceptual competence. Section 6 discusses psychological theories that locate intuitions in fast cognitive processes psychologists refer to system 1 processing. Section 7 discusses a host of challenges to intuitions and their epistemic roles.
    step1: |-
      为处理这些问题，我们先从第 1 节的伦理直觉主义史谈起。第 2 节讨论赋予自明道德命题以重要作用的道德认识论。第 3 节讨论把直觉认定为发挥基础性认知作用的显象状态的道德认识论。第 4 节讨论理智领悟在某些直觉理论中的作用。第 5 节讨论概念能力的作用。第 6 节讨论那些把直觉定位在心理学家称为“系统 1 加工”的快速认知过程中的心理学理论。第 7 节讨论对直觉及其认知作用的一大堆挑战。
    step2: |-
      为处理这些问题，本文先在第 1 节梳理伦理直觉主义的历史；第 2 节讨论赋予自明道德命题以重要地位的道德认识论；第 3 节讨论把直觉视为发挥基础性认知作用的显象状态的道德认识论；第 4 节讨论理智领悟在某些直觉理论中的角色；第 5 节讨论概念能力的作用；第 6 节讨论那些把直觉安置在心理学家所谓“系统 1 加工”这类快速认知过程中的心理学理论；第 7 节则检视针对直觉及其认知作用的一系列挑战。
