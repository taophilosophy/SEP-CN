      ### 7.5 Non-Inferential Justification?
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      Intuitive justification is meant to be non-inferential. It is not entirely clear what an inference is. But the basic idea is that a mental state M2 is inferentially justified if it there is some movement of mind from a distinct, justified mental state M1 to M2 whereby the justification of M1 is transmitted to M2. Intuitive justification is non-inferential because intuitions are not the sorts of things that are justified or not. They are unjustified justifiers. This could also rule out perceptual justification as inferential, for perceptual states are arguably not the sorts of things that are justified or not.
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      Sinnott-Armstrong (2006a), however, challenges the existence of any non-inferential justification for moral beliefs. First, he argues that the following considerations should lead one to mistrust intuitively justified judgments:
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      1. which moral view one adopts affects one’s self-interests, so one is likely going to be biased when adopting a moral view;
      2. there is often moral disagreement without reason to think one party is more likely to be right than the other;
      3. emotions influence one’s moral view, and emotions cloud judgment;
      4. moral views are likely to be formed in circumstances conducive to illusion, and shown by heuristics and framing effects; and
      5. moral beliefs might be the product of morally suspicious sources, e.g., if they are the result of the influences of the rich and powerful.
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      He does not deny that some moral intuitions can justify moral beliefs. But given that the defeasible justification they provide is undermined by distorting factors, we need to check that any given moral intuition is not one of the undermined ones, and we must seek corroboration of their contents, before we can take it to provide justification. For him, the beliefs that are justified by this process are inferentially justified. If he is right, then those who have appreciated the influences mentioned in (i)–(v) have at best inferentially justified moral beliefs. They do not have non-inferential justification.
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Nathan Ballantyne and Joshua C. Thurow (2013) disagree on this last point. Couched in terms of undercutting defeaters, they say the distorting factors that Sinnott-Armstrong mentions are offered as undercutting defeaters of the justification of most of our moral beliefs. One way to reinstate justification, they point out, is to defeat the defeater. That reinstates the initial, non-inferential support provided by the intuitions. Though we could get inferential corroboration of our intuitively justified beliefs, it is also possible that we simply assure ourselves that (i)–(v) do not apply to a given intuition, in which case that intuition can carry on as an unjustified justifier.
    step1: TBD
    step2: TBD
