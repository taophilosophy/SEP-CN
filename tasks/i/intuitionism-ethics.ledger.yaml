      Be that as it may, most recent intuitionists have shied away from relying on the notion of a self-evident proposition. Before turning to other themes, note that self-evident propositions have been characterized in terms of their *epistemic role* when what we ultimately want is some metaphysical account of self-evident propositions capable of explaining that epistemic role. Not all true propositions are such that adequate understanding justifies us in believing them. If there is a special sub-class of propositions that have these epistemic properties, plausibly they have them in virtue of their non-epistemic properties. So what are those non-epistemic properties? Some of the examples offered suggest an answer.
