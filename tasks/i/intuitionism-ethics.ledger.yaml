      > This apprehension [of a particular moral obligation] is immediate, in precisely the sense in which a mathematical apprehension is immediate, *e.g.*, the apprehension that this three-sided figure, in virtue of its being three-sided, must have three angles. Both apprehensions are immediate in the sense that in both insight into the nature of the subject directly leads us to recognise its possession of the predicate; and it is only stating this fact from the other side to say that in both cases the fact apprehended is self-evident. (1912 [2002: 13])
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
