      This brief historical overview concludes with the figure most influential in contemporary debates: W. D. Ross. Ross wrote in the early to mid-twentieth century as well, and he was largely criticizing the consequentialism of G.E. Moore. Ross asked us to consider a right action like keeping a promise, and ask what *makes* it right. The consequentialist reply is that right actions are right because they produce the most good. Ross rejoined that this is not what the “plain man” really thinks. Instead, the plain man thinks that what makes the action right is that one promised to do it (1930 [2002: 17–18]).
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Expanding on this thought, Ross thinks utilitarianism ignores morally significant relations we bear to others by assuming that the only relevant relation is that between benefactor and beneficiary. For him, that one has promised to do something, for example, is morally relevant in its own right. If it is, consequentialism is extensionally and explanatorily inadequate. Suppose I promise to help someone move apartments, but I can produce slightly more good by breaking that promise and doing something else instead. Consequentialism says I should break the promise, whereas Ross claims there are cases like this where the duty of fidelity (as he calls it) is more weighty than the duty to promote the good (a duty of beneficence) (1930 [2002: 17–18, 35]).
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      Ross posited seven “*prima facie*” duties—duties of (1) fidelity, (2) reparation, (3) gratitude, (4) justice, (5) beneficence, (6) self-improvement, and (7) non-maleficence (1930 [2002: 21]). Though he uses the term “*prima facie*”, it is generally agreed that he meant these are duties as far as they go, or *pro tanto* (1930 [2002: 19]).
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      In terms of epistemology, these duties are self-evident just like mathematical axioms or the validity of a form of inference is self-evident (1930 [2002: 29]). Price claimed that self-evident truths are “incapable of proof” (1758 [1969: § 704]). At one point Ross appears to agree, as he says self-evident moral propositions “cannot be proved, but … just as certainly need no proof” (1930 [2002: 30]). But elsewhere he makes only the more restricted claim that such propositions do not *need* any proof, which should be his considered view (1930 [2002: 29]). A self-evident proposition is one that we *can* be justified in believing without an argument, but this does not rule out the possibility that there may be such an argument, or that the proposition can be (justifiably) believed regardless of its self-evident status, as might happen were we to believe them on the basis of testimony (Audi 2004: 45)[^audi-2004].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      In some cases there will be more than one *pro tanto* duty operative and the duties will conflict. For Ross, what one ought to do all considered in such cases is not self-evident (which might conflict with Prichard’s view), nor can it be derived from the *pro tanto* duties and their weights. To resolve conflicts of duties, one must use judgment (1930 [2002: 30–31]).
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      In addition to appealing to the idea of self-evidence, Ross also seems to think that we apprehend the truth of the self-evident principles by something like intuitive induction. That is, the epistemology starts with particular cases where the general principles are operative, and via those particular cases we come to see the truth of the generality (1930 [2002: 33]). Moreover, he thinks that ethics is unlike science in that it cannot appeal to sense experience for data in support of one ethical theory or another. Instead, “the moral convictions of thoughtful and well-educated people are the data of ethics, just as sense-perceptions are the data of natural science” (1930 [2002: 41]).
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      So much for quick historical notes. We can see that Ethical Intuitionism is a family of views where the following features are salient.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      1. A pluralist deontology—there are several basic moral duties that are not analyzed in terms of promoting the good.
      2. Realism about moral facts—some moral facts are independent of the attitudes or stances of any actual or hypothetical beings (and are likely non-natural or *sui generis*, too).
      3. Cognitivism about moral judgments—moral judgments are beliefs, not desire-like attitudes.
      4. The self-evidence of some moral propositions.
      5. The apparent (/seeming) truth of some moral propositions.
      6. Non-inferential justification for some moral beliefs—for some justified moral belief, *B*(*q*), the justification is not based in the justification enjoyed by some other belief, *B*(*p*), where one infers *q* from *p*.
      7. Rationalism for some moral knowledge—some moral facts can be known *a priori* and through rational faculties, as opposed to empirical or sentimental faculties.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      The remainder of this entry focuses on (4)–(7), which are most closely associated with intuitionism in ethics in contemporary discussions. They most directly concern epistemology, which is separable from the other ethical and metaethical views.
