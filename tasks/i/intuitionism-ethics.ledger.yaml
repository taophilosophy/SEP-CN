      Next, consider Prichard. Writing in the early and mid-twentieth century, Prichard was largely responding to the consequentialism of figures like Sidgwick and Moore. Sidgwick had characterized intuitionism as the view that right conduct is conduct that conforms to certain unconditionally binding principles (1907: book I, ch. 8), to be contrasted with a consequentialist view where right conduct is conduct that brings about good outcomes. Prichard wants to defend intuitionism so understood, largely by criticizing consequentialism. His considered positive view can be hard to discern, but he seems to think one’s moral obligations are grounded in (1) the nature of the state of affairs produced, and (2) the relations one bears to oneself or others (e.g., being a parent) (1912 [2002: 12]).
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
