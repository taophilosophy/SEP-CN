      A. A trolley is bearing down on five innocent people tied to the track. There is a side track that only has one innocent person tied to it. You are standing in front of a switch that will turn the trolley onto the side track. If you do not flip the switch the trolley will hit and kill the innocent five. If you flip the switch, the trolley will hit and kill the innocent one. Intuitively, is it permissible to flip the switch?
    step1: |-
      A. 一辆电车正冲向被绑在轨道上的五名无辜者。有一条岔道，上面只绑着一名无辜者。你站在一个转辙器前，它能把电车转到岔道上。如果你不扳动转辙器，电车将撞死那五名无辜者；如果你扳动它，电车将撞死那一名无辜者。直觉上，扳动转辙器是许可的吗？
    step2: |-
      A. 一辆电车正冲向被绑在轨道上的五名无辜者。旁边有一条岔道，上面只绑着一名无辜者。你站在一个能把电车转上岔道的转辙器前：不扳，电车会撞死那五名无辜者；扳了，电车会撞死那一名无辜者。直觉上，扳动转辙器是许可的吗？
