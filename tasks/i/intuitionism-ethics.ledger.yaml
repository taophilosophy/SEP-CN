      Just as perceptual, memorial, and proprioceptive seemings are fallible, so too intuitions qua seeming states are fallible. It can seem to you that *p* when *p* is not the case. And just as perceptual, memorial, and proprioceptive seemings are not beliefs, so too intuitions are not beliefs. You can have an intuition that *p* while failing to believe that *p*. Similarly, we can plausibly distinguish intuitions from hunches, guesses, blind impulses, vague sentiments, preferences for action, or familiar opinion (Sidgwick 1907 [1981]: 211–212)[^sidgwick-1907]. Some have suggested that intuitions are merely inclinations to believe (Williamson 2000; Sosa 2007; Earlenbaugh & Molyneux 2009)[^earlenbaugh-2009][^sosa-2007][^williamson-2000]. But the more common view is that, though intuitions might provide some categorical basis for a disposition to believe what is intuitive, we can distinguish intuitions from mere inclinations to believe. One can be inclined to belief without anything seeming to be the case in an intuitive way.
    step1: |-
      正如知觉的、记忆的与本体感受的显似会出错，直觉作为显似状态也会出错。事情并非如此时，它也可能对你显得如此。而且，正如知觉的、记忆的与本体感受的显似不是信念，直觉也不是信念。你可能对*p*有直觉，却不相信*p*。同样，我们似乎有理由把直觉与预感、猜测、盲目的冲动、模糊的情绪、行动偏好或习见区分开来（Sidgwick 1907 [1981]: 211–212）[^sidgwick-1907]。有人提出，直觉仅仅是相信的倾向（Williamson 2000; Sosa 2007; Earlenbaugh & Molyneux 2009）[^earlenbaugh-2009][^sosa-2007][^williamson-2000]。但更常见的观点是：尽管直觉或许为“相信直观之物”的倾向提供了某种范畴性基础，我们仍可把直觉与单纯的相信倾向区分开来。一个人可以倾向于相信，却没有任何东西以直观的方式显得如此。
