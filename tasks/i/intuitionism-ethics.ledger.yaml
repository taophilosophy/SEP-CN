      Epistemically, the idea is that all these seeming states, intuitions included, play an important epistemic role. We can follow Huemer’s nomenclature and call the epistemic principle Phenomenal Conservatism: For all *p*, if it seems to you that *p*, and if you believe that *p* based on it seeming to you that *p*, your belief is *pro tanto*, defeasibly justified (cf. Chudnoff 2011b; Huemer 2006; Pryor 2000)[^chudnoff-2011b][^huemer-2006][^pryor-2000]. This basing relation is not typically considered an inferential relation. In fact, this epistemic role is well suited to an internalist, foundationalist epistemology where seeming states are unjustified justifiers. Beliefs based on them are foundationally justified and from that foundation we can infer other beliefs that thereby enjoy inferential justification.
    step1: |-
      在认识论上，其想法是：所有这些显似状态，包括直觉在内，都起着重要的认识论作用。我们可以沿用 Huemer 的命名，把这条认识论原则称为“现象保守主义”（Phenomenal Conservatism）：对任意*p*，若它对你显得是*p*，且你基于它对你显得是*p*而相信*p*，那么你的信念就得到*pro tanto*的、可废止的证成（参 Chudnoff 2011b; Huemer 2006; Pryor 2000）[^chudnoff-2011b][^huemer-2006][^pryor-2000]。这种基于关系通常不被视为推论关系。事实上，这一认识论作用非常适合内在主义的基础主义认识论：在其中，显似状态是未获证成的证成者。基于它们的信念获得基础证成，而从这一基础出发，我们可以推论出其他信念，后者因而享有推论证成。
    step2: |-
      认识论上的要点是：包括直觉在内的所有这些显似状态都担当重要的认识论角色。沿用 Huemer 的命名，可将该原则称为“现象保守主义”（Phenomenal Conservatism）：对任意*p*，若它对你显得是*p*，而你正是基于这种显似而相信*p*，则该信念获得*pro tanto*的、可废止的证成（参 Chudnoff 2011b; Huemer 2006; Pryor 2000）[^chudnoff-2011b][^huemer-2006][^pryor-2000]。这种基于关系通常不算推论关系。实际上，这一角色恰合于内在主义的基础主义认识论：显似状态本身未获证成，却是证成者；基于其上的信念得到基础证成，再由这一基础推论出其他信念，后者便享有推论证成。
