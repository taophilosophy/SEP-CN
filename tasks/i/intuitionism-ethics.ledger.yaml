      When people have intuitive responses, it is thought that the intuitions provide some epistemic support for that which is intuitive. But there are good questions about what intuitions are and what the nature of the epistemic support is meant to be.
    step1: |-
      当人们产生直觉反应时，人们认为直觉为直觉所及之物提供了某种认知支持。但关于直觉究竟是什么、以及这种认知支持的本性应当如何理解，都还存在一些真问题。
    step2: |-
      人一旦产生直觉回应，通常便认为该直觉为直觉所及之物提供了某种认知支持。然而，直觉究竟是什么？这种支持又究竟属于何种性质？这些都仍是值得追问的真问题。
