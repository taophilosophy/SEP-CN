      The notion of a self-evident proposition is a term of art in intuitionist thought, and it needs to be distinguished from certain common-sense understandings with which it may easily be conflated. The first thing to note is that a self-evident proposition is not the same as an obvious truth. To begin with, obviousness is relative to certain individuals or groups. What is obvious to you may not be obvious to me. But self-evidence is not relative in this way. A proposition cannot be self-evident to one person, but not to another. A proposition is just self-evident, not self-evident *to* someone. Secondly, there are many obvious truths that are not self-evident. Certain well-known empirical truths, for example, that if I drop a heavy object it will fall, or that the world is bigger than a football, are obvious but not self-evident. There are also self-evident propositions that may not be obvious to everyone, at least prior to reflection, e.g., that if all *A*s are *B*s and no *B*s are *C*s then no *C*s are *A*s, or that one man can be the father and grandfather of the same child.
    step1: |-
      “自明命题”这一概念是直觉主义思想中的一个术语，需要把它与某些容易混淆的常识理解区分开来。首先要指出，自明命题并不等于显而易见的真理。第一，显而易见性是相对于特定个人或群体的：对你而言显而易见的，对我而言未必如此；而自明性并不是以这种方式相对的。一个命题不可能对一个人自明而对另一个人不自明。命题就是自明的，而不是对某人自明的。第二，有许多显而易见的真理并不是自明的。某些著名的经验真理，例如重物脱手会下落，或者世界比一个足球大，就是显而易见却非自明的。也有一些自明命题并非对每个人都显而易见，至少在反思之前如此，例如：若所有*A*都是*B*且没有*B*是*C*，则没有*C*是*A*；又如，一个人可以是同一个孩子的父亲兼祖父。
    step2: |-
      “自明命题”是直觉主义思想中的专门术语，须与若干易混的常识理解区分开。第一，自明命题不同于显而易见的真理。显而易见性是相对于特定个人或群体的：于你显而易见者，于我未必如此；自明性却无此种相对性。命题不可能对某甲自明、对某乙不自明；命题只是自明，而非“对某人”自明。第二，许多显而易见的真理并不自明。某些公认的经验真理——如重物脱手会坠落、世界比一只足球大——显而易见却非自明。反过来，也有自明命题并非人人（至少在反思之前）都觉显而易见，例如：若所有*A*皆为*B*，且无*B*为*C*，则无*C*为*A*；又如，同一个人可以是某个孩子的父亲兼祖父。
