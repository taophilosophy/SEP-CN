      If we stick with Phenomenal Conservatism and its internalism, note that it underwrites a standard practice in ethics where intuitions play a central role in getting our beliefs off the ground, but best explanations, reflective equilibrium, and coherence can ultimately lead us to reject some things that were initially intuitive. Suppose we have a bunch of moral intuitions: an intuition that P, and intuition that Q,… and so on. On this basis we believe, and have some defeasible justification for believing, that P, that Q,… and so on. We can then consider what plausible theory best explains any pattern that emerges from P, Q, etc. The outcome of this process might be to ultimately reject some of P, Q, etc. But the main idea here is that intuitions legitimately feed into a respectable form of inquiry that gives intuitions some *pro tanto* and defeasible epistemic weight, much like other seeming states. And much like other seeming states, we might come to disbelieve some of the things that seem true, based on our best overall theories (as we reject the proposition that the stick in water is bent even though it appears so.)
    step1: |-
      如果我们坚持现象保守主义及其内在主义，请注意，它支持伦理学中的一种标准做法：直觉在使我们的信念起步时起核心作用，但最佳解释、反思平衡与融贯性最终可能引导我们拒斥某些起初觉得直观的东西。假设我们有一批道德直觉：对 P 的直觉、对 Q 的直觉……等等。在此基础上，我们相信 P、Q……并对之拥有某种可废止的证成。然后我们可以考虑：哪一种可信的理论最好地解释了 P、Q 等所呈现的任何模式。这一过程的结果可能是最终拒斥 P、Q 等中的某些。但这里的要点是：直觉正当地进入一种可敬的探究形式，它赋予直觉某种*pro tanto*的、可废止的认识论分量，正如其他显似状态一样。而且，正如其他显似状态一样，我们可能基于我们最好的整体理论，开始不相信某些显得为真的东西（正如我们尽管看到水中的棍子显得弯曲，却拒斥“水中的棍子是弯的”这一命题）。
    step2: |-
      若坚持现象保守主义及其内在主义，则须注意：它支撑伦理学的一种通行做法——直觉在信念起步阶段居核心地位，而最佳解释、反思平衡与融贯性最终可能使我们拒斥某些起初显得直观的东西。设有若干道德直觉：对 P 的直觉、对 Q 的直觉……；据此我们相信 P、Q……，并获可废止的证成。随后可追问：哪一种可信理论最能解释由 P、Q 等呈现出的模式？这一过程的结果，也许最终要拒斥 P、Q 等中的某些。要点在于：直觉正当地进入一种可敬的探究，并获得*pro tanto*的、可废止的认识论分量，与其他显似状态无异。也正因如此，我们可能依据最佳的整体理论而不信某些显得为真者——正如水中的棍子虽显得弯曲，我们仍拒斥“棍子弯了”。
