      If right and wrong are just feelings of approval or disapproval caused in us by natural properties or objects, then the idea of right and wrong will be given by our senses, for these ideas will be merely the effect that the perception of certain things has on sensibility. If, however, right and wrong are real properties of actions, then they could not be apprehended by any empirical sense, for we have no such sensation of right and wrong when we apprehend right or wrong actions. Rather, what we “see” via the understanding is that these actions are right, or wrong. This seeing is an immediate apprehension, but it is intellectual rather than sensible.
    step1: |-
      若正当与错误只是由自然属性或对象在我们身上引起的赞许或不赞许之感，那么正当与错误的观念便由我们的感官给出，因为这些观念将只是对某些事物的知觉作用于感性所产生的效果。然而，若正当与错误是行为的真实属性，那么它们就不可能被任何经验性的感官所把握，因为当我们把握正当或错误的行为时，并没有这样的正当与错误之感。毋宁说，我们通过理智所“看见”的是：这些行为是正当的，或错误的。这种看见是一种直接把握，但它是理智的，而非感性的。
    step2: |-
      倘若正当与错误不过是由自然属性或对象在我们心中引起的赞许、不赞许之感，那么正当与错误的观念便由感官给出——它们只是知觉某物时作用于感性而产生的效果。可倘若正当与错误是行为的真实属性，它们就不可能为任何经验感官所把握，因为我们在把握正当或错误的行为时，并无相应的正当、错误之感；毋宁说，我们经由理智“看见”的是：这些行为正当，或错误。这种“看见”是一种直接把握，只是它属于理智，而非感性。
