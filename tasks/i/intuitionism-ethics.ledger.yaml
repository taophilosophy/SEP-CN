      As articulated, Phenomenal Conservatism allows intuitions to justify beliefs without any externalist conditions, such as a reliable connection to the moral facts. To see this, imagine that we are being massively deceived by an evil demon (unbeknownst to us) and none of our seeming states are veridical. Still, according to the principle, we are justified in believing that things are as they seem to be. A more externalist epistemology would pay more attention to the right connections with the external facts, and it would not allow beliefs to be justified unless they had some good connection with the facts. For example, we might not want a belief to be justified unless it was produced by a reliable belief-forming process, in which case we want beliefs based on intuitions to be part of a reliable belief-forming process (Markie 2005: 356–357)[^markie-2005]. And there is nothing to prevent an epistemology of seemings that assigns some role to external connections. Shafer-Landau (2003: chs. 11–12), for example, has a moral epistemology that mixes internalist and externalist elements.
    step1: |-
      如上述表述所示，现象保守主义允许直觉在没有任何外在主义条件（例如与道德事实的可靠联系）的情况下证成信念。要看出这一点，可设想我们正被一个恶魔大规模欺骗（而我们并不知情），我们的显似状态没有一个是如实的。即便如此，按照该原则，我们仍有理由相信事情正如它们所显现的那样。更偏外在主义的认识论会更注意与外部事实的正确联系，除非信念与事实有某种良好联系，否则不会允许其获得证成。例如，我们可能希望：除非一个信念由可靠的信念形成过程产生，否则它不应获得证成；在这种情况下，我们就要求基于直觉的信念属于可靠的信念形成过程（Markie 2005: 356–357）[^markie-2005]。而没有什么能阻止一种给外在联系留出位置的显似认识论。例如，Shafer-Landau（2003: chs. 11–12）的道德认识论就混合了内在主义与外在主义要素。
    step2: |-
      按上述表述，现象保守主义允许直觉在任何外在主义条件（如与道德事实的可靠关联）之外证成信念。设想我们正被恶魔大规模欺骗（自己却浑然不觉），显似状态无一如实；即便如此，依该原则，我们仍有理由相信事情如其所显。更偏外在主义的认识论则更看重与外部事实的恰当关联，非有良好关联便不许信念获证成。例如，或可要求信念须由可靠的信念形成过程产生，才得证成——于是我们便要求基于直觉的信念属于可靠的信念形成过程（Markie 2005: 356–357）[^markie-2005]。但也没有任何东西阻止一种给外在关联留出位置的显似认识论；例如 Shafer-Landau（2003: chs. 11–12）的道德认识论就兼采内在主义与外在主义要素。
