      These theories of intellectual apprehension might help flesh out the idea of a self-evident proposition. As noted above, we would like to know what it is about some true propositions, or what it is about our understanding, such that those propositions can be justifiably believed or known on a basis of understanding them. We could start an answer along the following lines. First, some propositions are true thanks to the relations of the properties/universals featured therein. Second, our powers of understanding are such that we can grasp the relations between certain properties/universals, and when we do so it is a kind of apprehension.
