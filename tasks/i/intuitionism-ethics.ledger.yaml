      What then is it for a proposition to be self-evident? Locke says that a self-evident proposition is one that “carries its own light and evidence with it, and needs no other proof: he that understands the terms, assents to it for its own sake” (1689: 1.3.4). Price tells us that a self-evident proposition is immediate, and needs no further proof, and goes on to say that self-evident propositions need only be understood to gain assent (1758 [1969: § 747]). Ross writes that a self-evident proposition is “evident without any need of proof, or of evidence beyond itself” (1930 [2002: 29]), and Broad describes self-evident propositions as being
    step1: |-
