      And, indeed, often Anti-Haecceitism is presented as a thesis about possible worlds. In this sense Anti-Haecceitism is the thesis that no distinct possible worlds are purely qualitatively indiscernible (though see Skow 2008 for an argument that Haecceitism and Anti-Haecceitism should not be defined in terms of possible worlds)[^skow-2008]. In so far as (PIIa) and (PIIb) quantify over all objects of all kinds, they entail Anti-Haecceitism understood in terms of possible worlds, for those two principles entail that any two possible worlds differ in some of their pure properties. (PII), on the other hand, does not entail this version of Anti-Haecceitism, since (PII) does not require objects (possible worlds included) to differ purely qualitatively. Anti-Haecceitism understood in this way does not entail any of the three versions of the Identity of Indiscernibles here distinguished, since Anti-Haecceitism thus understood is a thesis that rules out the qualitative indiscernibility of certain objects, namely possible worlds, while (PIIa) and (PIIb) rule out the qualitative indiscernibility of all types of objects, and (PII) rules out a different kind of indiscernibility of all types of objects.
    step1: |-
      而且，反此性论常常被表述为关于可能世界的论题。在这一意义上，反此性论是这样一个论题：没有不同的可能世界是纯质性地不可分辨的（不过参见 Skow 2008 的一个论证：此性论与反此性论不应以可能世界来定义）[^skow-2008]。就 (PIIa) 与 (PIIb) 对一切种类的全部对象作量化而言，它们蕴含以可能世界理解的反此性论，因为这两个原则蕴含任何两个可能世界都在其某些纯属性上有别。(PII) 则不如是，它不蕴含这一版本的反此性论，因为 (PII) 不要求对象（包括可能世界）在纯质性上有别。如此理解的反此性论不蕴含这里区分的三个不可分辨者的同一性版本中的任何一个，因为如此理解的反此性论是一个排除某些对象（即可能世界）的质性不可分辨性的论题，而 (PIIa) 与 (PIIb) 排除一切类型对象的质性不可分辨性，(PII) 则排除一切类型对象的另一种不可分辨性。
