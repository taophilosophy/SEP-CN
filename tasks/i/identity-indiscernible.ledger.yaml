      Finally, a subtraction argument has been advanced against (PIIa) (Rodriguez-Pereyra 2022: 87–100)[^rodriguez-pereyra-2022]. This argument presupposes the falsity of (PIIb) and it is based on the basic idea that if there is a possible world with objects sharing all their intrinsic pure properties that are spatiotemporally and causally symmetrically and independently related to each other, then there is a possible world where everything else has been “subtracted” and those objects are the only objects, and in such a world those objects share all their pure properties, intrinsic and extrinsic. Assuming that there is a possible world with objects that share all their pure properties if and only if it is possible that there are objects that share all their pure properties, the conclusion of the argument is equivalent to the claim that (PIIa) is false. (Again, the reference to possible worlds is not essential and the argument can be formulated using modal operators instead.)
    step1: |-
      最后，有人提出了一个针对 (PIIa) 的 *减法论证*（Rodriguez-Pereyra 2022: 87–100）[^rodriguez-pereyra-2022]。这一论证预设 (PIIb) 为假，其基本想法是：如果存在一个可能世界，其中有分享其全部内在纯属性的对象，且这些对象在时空上与因果上以对称而独立的方式相互关联，那么就存在一个可能世界，其中其他一切都已被“减去”，那些对象就是仅有的对象，而在这样一个世界中，那些对象分享其全部纯属性，无论内在的还是外在的。假定“存在分享全部纯属性的对象的可能世界”当且仅当“分享全部纯属性的对象是可能的”，论证的结论就等值于 (PIIa) 为假这一主张。（同样，对可能世界的提及并非本质性的，论证也可以用模态算子来表述。）
    step2: |-
      最后还有一个针对 (PIIa) 的“减法论证”（Rodriguez-Pereyra 2022: 87–100）[^rodriguez-pereyra-2022]。它以 (PIIb) 为假为前提，基本思路是：若有一个可能世界，其中的对象共有全部内在纯属性，且彼此在时空与因果上对称而独立地相关联，则另有一个可能世界，其中其余一切都被“减去”，那些对象成了仅有的对象；在这样的世界里，那些对象共有全部纯属性，无论内外。再假定“存在共有全部纯属性的对象之可能世界”当且仅当“共有全部纯属性的对象是可能的”，结论便等值于“ (PIIa) 为假”。（同样，提及可能世界并非必需，改用模态算子也能表述。）
