      There are several possible reactions to this. One is to accept the entailment and, on the premise that the relevant versions of the Identity of Indiscernibles (PIIa and PIIb) are false, reject the Bundle Theory (Armstrong 1978: 91)[^armstrong-1978]. Another one is, of course, to accept the relevant versions of the Identity of Indiscernibles on the premise that the Bundle Theory is true (Ayer 1953; see section 4 above)[^ayer-1953]. A third option is to defend the Bundle Theory from the falsity of the Identity of Indiscernibles by holding that the relevant versions of it have not been proved to be false (O’Leary-Hawthorne 1995)[^o’leary-hawthorne-1995]. Yet another option is to reject the assumption that no two objects can have exactly the same constituents, and thereby reject the entailment from the Bundle Theory to the Identity of Indiscernibles, which allows one to simultaneously uphold the Bundle Theory and reject the relevant version of the Identity of Indiscernibles, i.e., (PIIa) and/or (PIIb) (Rodriguez-Pereyra 2004)[^rodriguez-pereyra-2004].
    step1: |-
      对此有几种可能的反应。一种是接受蕴含关系，并以相关版本的不可分辨者的同一性 (PIIa 与 PIIb) 为假为前提，拒斥束论（Armstrong 1978: 91）[^armstrong-1978]。另一种当然是以束论为真为前提接受相关版本的不可分辨者的同一性（Ayer 1953；见上文第 4 节）[^ayer-1953]。第三种选择是以“相关版本尚未被证明为假”来为束论辩护，使之免于不可分辨者的同一性为假之累（O’Leary-Hawthorne 1995）[^o’leary-hawthorne-1995]。还有一种选择是拒斥“没有两个对象能具有完全相同的构成物”这一假定，从而拒斥从束论到不可分辨者的同一性的蕴含，这使人能够同时坚持束论并拒斥相关版本的不可分辨者的同一性，即 (PIIa) 和/或 (PIIb)（Rodriguez-Pereyra 2004）[^rodriguez-pereyra-2004]。
    step2: |-
      对此可有几种反应。其一，接受该蕴含，并以 (PIIa)、(PIIb) 为假为前提拒斥束论（Armstrong 1978: 91）[^armstrong-1978]。其二（当然），以束论为真为前提接受相关版本（Ayer 1953；见上文第 4 节）[^ayer-1953]。其三，以“相关版本尚未被证伪”为束论辩护，使其免于该原则为假之累（O’Leary-Hawthorne 1995）[^o’leary-hawthorne-1995]。其四，拒斥“没有两个对象能有完全相同构成物”这一假定，从而切断由束论到该原则的蕴含，这样便可同时坚持束论并拒斥 (PIIa) 和／或 (PIIb)（Rodriguez-Pereyra 2004）[^rodriguez-pereyra-2004]。
