      The final element in the Identity of Indiscernibles that is open to variation or interpretation is the modal operator. The Identity of Indiscernibles is normally understood as metaphysically necessary. But the modal operator in it could be taken to express other kinds of necessity, e.g., logical necessity or physical necessity. Besides, the Identity of Indiscernibles need not contain any modal operator at all, in which case (PII) states that it is the case that no two objects (of the relevant kind) share all their non-trivializing properties, and (PIIa) and (PIIb) make the corresponding *de facto* statements. Of course, the Identity of Indiscernibles can also be understood to make a modal claim without making a necessity claim; for instance, it could be understood to say that *contingently* no two objects (of the relevant kind) share all their properties (of the relevant kind). Indeed, some philosophers have argued that the Identity of Indiscernibles is only contingently true (Casullo 1984; see French 1989 for discussion)[^casullo-1984][^french-1989] and others have argued that in his letter to Clarke Leibniz was trying to establish only the truth of the Identity of Indiscernibles, without making any commitments as to whether it is necessarily or only contingently true (Rodriguez-Pereyra 2014; the modal status of the Identity of Indiscernibles in Leibniz’s philosophy is a traditional topic of Leibnizian scholarship—for further recent discussion see Jauernig 2008; Jorati 2017; Bender 2019; Lin 2025; Ruiz-Gómez 2017)[^bender-2019][^jauernig-2008][^jorati-2017][^lin-2025][^rodriguez-pereyra-2014][^ruiz-gómez-2017].
    step1: |-
      不可分辨者的同一性中最后一个可变化或解释的要素是模态算子。不可分辨者的同一性通常被理解为形而上学必然的。但其中的模态算子也可以被理解为表达其他种类的必然性，例如逻辑必然性或物理必然性。此外，不可分辨者的同一性根本不必包含任何模态算子，在这种情况下，(PII) 陈述的是：没有两个（相关种类的）对象分享其全部非平凡化属性，(PIIa) 与 (PIIb) 则作出相应的事实陈述。当然，不可分辨者的同一性也可以被理解为作出模态断言而不作出必然性断言；例如，它可以被理解为说：偶然地，没有两个（相关种类的）对象分享其全部（相关种类的）属性。确实，一些哲学家论证不可分辨者的同一性只是偶然为真（Casullo 1984；讨论见 French 1989）[^casullo-1984][^french-1989]，另一些人则论证莱布尼茨在致克拉克的信中只是试图确立不可分辨者的同一性的真，而未对它究竟是必然真还是仅偶然真作出任何承诺（Rodriguez-Pereyra 2014；不可分辨者的同一性在莱布尼茨哲学中的模态地位是莱布尼茨研究的传统话题——进一步的近期讨论见 Jauernig 2008；Jorati 2017；Bender 2019；Lin 2025；Ruiz-Gómez 2017）[^bender-2019][^jauernig-2008][^jorati-2017][^lin-2025][^rodriguez-pereyra-2014][^ruiz-gómez-2017]。
    step2: |-
      最后一个可变动、可解释的要素是模态算子。该原则通常被当作形而上学必然的；但其中的算子也可理解为表达逻辑必然、物理必然等其他必然性。它甚至可以不含量词式模态算子：此时 (PII) 直陈“没有两个（相关种类的）对象共有全部非平凡化属性”，(PIIa)、(PIIb) 亦作出相应的 *de facto* 断言。当然，它也可以表达模态而不断言必然——例如“偶然地，没有两个（相关种类的）对象共有全部（相关种类的）属性”。事实上，有哲学家主张该原则只是偶然为真（Casullo 1984；讨论见 French 1989）[^casullo-1984][^french-1989]；也有人主张，莱布尼茨在致克拉克的信中只想确立该原则为真，并未承诺它究竟是必然真还是偶然真（Rodriguez-Pereyra 2014；该原则在莱布尼茨哲学中的模态地位是莱布尼茨学界的传统题目，近期讨论见 Jauernig 2008；Jorati 2017；Bender 2019；Lin 2025；Ruiz-Gómez 2017）[^bender-2019][^jauernig-2008][^jorati-2017][^lin-2025][^rodriguez-pereyra-2014][^ruiz-gómez-2017]。
