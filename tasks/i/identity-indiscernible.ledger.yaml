      There is a further option: to reject the assumption that properties are universals and take them to be tropes, and take substances or objects to be entirely constituted by their tropes (for such theories see Keinänen & Hakkarainen 2024)[^keinänen-2024]. Tropes have the peculiarity that, while they cannot be shared by objects, they can resemble each other exactly. This option requires accepting the entailment from the Bundle Theory (interpreted as a Trope Bundle Theory) to the Identity of Indiscernibles, and yet it does not jeopardize the Bundle Theory since on this view the relevant versions of the Identity of Indiscernibles are true, given that tropes cannot be shared by any objects. However, it might be argued that only the letter, but not the spirit, of the Identity of Indiscernibles is preserved under this strategy. For although no two objects can share tropes, since tropes can resemble each other exactly, two objects can resemble each other exactly if they have exactly resembling tropes. And it is plausible that the point of (PIIa) and (PIIb) is to rule out perfect resemblance between objects.
    step1: |-
      还有一个选项：拒斥“属性是共相”这一假定，把它们当作特普（tropes），并认为实体或对象完全由它们的特普构成（关于这类理论，见 Keinänen & Hakkarainen 2024）[^keinänen-2024]。特普有一个特点：它们虽然不能被对象分享，却可以彼此完全相似。这一选项要求接受从束论（解释为特普束论）到不可分辨者的同一性的蕴含，然而它并不危及束论，因为在这种观点下，相关版本的不可分辨者的同一性为真，鉴于特普不能被任何对象分享。不过，人们可能论证，在这一策略下，只有不可分辨者的同一性的字面，而非其精神，得到了保留。因为虽然任何两个对象不能分享特普，但既然特普可以彼此完全相似，两个对象若具有完全相似的特普，就可以彼此完全相似。而 (PIIa) 与 (PIIb) 的要点很可能正是在于排除对象之间的完全相似。
