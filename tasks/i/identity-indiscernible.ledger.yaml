      反此性论也常被表述为关于可能世界的论题：没有任何不同的可能世界是纯质性上不可分辨的（不过 Skow 2008 论证，此性论与反此性论不该用可能世界来定义）[^skow-2008]。既然 (PIIa) 与 (PIIb) 量化于一切种类的全部对象，它们便蕴含以可能世界表述的反此性论——因为二者都要求任何两个可能世界在某些纯属性上有别。反之，(PII) 不蕴含这一版本：它并不要求对象（可能世界亦在其中）在纯质性上有别。如此理解的反此性论并不蕴含上述三个版本中的任何一个：它排除的只是某一类对象（可能世界）的质性不可分辨性，而 (PIIa)、(PIIb) 排除一切类型对象的质性不可分辨性，(PII) 排除的又是另一种不可分辨性。
