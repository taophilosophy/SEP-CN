      另有两个支持 (PII) 的较新论证。一个假定一条相对较弱的休谟式原则，大意是：必然地，没有两个对象在每一个非平凡化属性上必然共同变化——也就是说，必然地，对任何两个对象 $x$ 与 $y$，都不存在这样的情况：对每一个非平凡化属性 $F$，必然地，$x$ 是 $F$ 当且仅当 $y$ 是 $F$。这条原则为真是可信的。因为任何在每一个非平凡化属性上都必然共同变化的 $x$ 与 $y$ 都会如此：必然地，$x$ 是方的当且仅当 $y$ 是方的；$x$ 是左翼活动者当且仅当 $y$ 是左翼活动者；$x$ 在时刻 $t$ 恰位于地点 $p$ 当且仅当 $y$ 在时刻 $t$ 恰位于地点 $p$；对每一个非平凡化属性都如此。但这样的对象会表现出某种程度的相互依赖，这似乎与作为一个具体对象所需的本体论自主程度不相容。此外，违反 (PII) 的对象会必然地在每一个非平凡化属性上共同变化。因为必然地，每个对象 $x$ 对每一个非平凡化属性 F 都具有这一属性：*necessarily, having* $F$ *if and only if* $x$ *has* $F$。因此，一个特定对象 $a$ 对每一个非平凡化属性 $F$ 都具有这一属性：*necessarily, having $F$ if and only if a has $F$*。但后一属性本身就是一个非平凡化（不纯）属性，因为在这个属性上有别要求数外有别，因为任何两个对象在这个属性上有别，就是它们在“拥有 $F$ 是否必然与 $a$ 拥有 $F$ 相联”上有别，而不是仅在究竟是哪些对象上有别。既然对每一个属性 $F$，“*necessarily, having $F$ if and only if a has $F$*”这一属性都是非平凡化属性，那么任何与 $a$ 分享其全部平凡化属性的对象也会与 $a$ 分享这类属性，因而它会与 $a$ 在每一个非平凡化属性上必然共同变化。于是，一般而言，违反 (PII) 的对象会必然地在每一个非平凡化属性上共同变化——因此，给定那条休谟式原则：必然地，没有两个对象在每一个非平凡化属性上必然共同变化，(PII) 为真。
