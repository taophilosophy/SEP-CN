      The other argument assumes an idea about grounding, namely that for every concrete object $x$ that exists at a particular time $t$, $x$ exists in time because $x$ exists at $t$, and for no object $y$ other than $x$ is it the case that $x$ exists in time because $y$ exists at $t$. Now, a property like *existing in time because $a$ exists at time $t$* is a non-trivializing (impure) property, since for objects to differ with respect to it they must differ extra-numerically, that is, they must differ with respect to which object’s existence at a particular time grounds their existence in time, rather than differing merely with respect to which objects they are. So, given any two concrete objects $a$ and $b$ that exist at time $t$, they must differ with respect to some of their non-trivializing properties, since they must differ with respect to the properties of *existing in time because $a$ exists at time t* (only $a$ will have it), and *existing in time because $b$ exists at time t* (only $b$ will have it). Thus, the argument goes, (PII) is true of concrete objects. But the argument can be extended to abstract objects too, since properties like *being abstract or concrete because $b$ is abstract* are non-trivializing (impure) properties that cannot be shared, and therefore any two two objects, whether abstract or concrete, must differ in some non-trivializing properties, which is what (PII) demands (For this argment and the previous one see Rodriguez-Pereyra 2022: 106–125)[^rodriguez-pereyra-2022].
    step1: |-
      另一个论证假定一个关于奠基的想法，即：对每一个在特定时间 $t$ 存在的具体对象 $x$，$x$ 在时间中存在是因为 $x$ 在 $t$ 存在，并且对任何不同于 $x$ 的对象 $y$，都不是 $x$ 在时间中存在是因为 $y$ 在 $t$ 存在。现在，像“在时间中存在是因为 $a$ 在时间 $t$ 存在”这样的属性是一个非平凡化（不纯）属性，因为对象在这个属性上有别必须数外有别，也就是说，它们必须在“究竟是哪个对象在特定时间的存在奠基了它们在时间中的存在”上有别，而不是仅在究竟是哪些对象上有别。因此，给定任何两个在时间 $t$ 存在的具体对象 $a$ 与 $b$，它们必然在某些非平凡化属性上有别，因为它们必然在“在时间中存在是因为 $a$ 在时间 t 存在”这一属性上有别（只有 $a$ 有它），以及在“在时间中存在是因为 $b$ 在时间 t 存在”这一属性上有别（只有 $b$ 有它）。于是，该论证说，(PII) 对具体对象为真。但该论证也可以推广到抽象对象，因为像“因为 $b$ 是抽象的而是抽象的或具体的”这样的属性是非平凡化（不纯）属性，不能被分享，因此任何两个对象，无论抽象还是具体，都必然在某些非平凡化属性上有别，这正是 (PII) 所要求的（关于此论证与前一论证，见 Rodriguez-Pereyra 2022: 106–125）[^rodriguez-pereyra-2022]。
    step2: |-
      另一个论证则诉诸奠基：对每一个在特定时间 $t$ 存在的具体对象 $x$，$x$ 在时间中存在，是因为 $x$ 在 $t$ 存在；而对任何不同于 $x$ 的对象 $y$，都不是 $x$ 在时间中存在是因为 $y$ 在 $t$ 存在。现在，像“在时间中存在是因为 $a$ 在时间 $t$ 存在”这样的属性属于非平凡化（不纯）属性：在此属性上有别须数外有别，即须在“是哪个对象在某一时刻的存在奠基了其在时间中的存在”上有别，而非仅在“是哪些对象”上有别。于是，任取在时间 $t$ 存在的两个具体对象 $a$ 与 $b$，它们必在某些非平凡化属性上有别——它们必在“在时间中存在是因为 $a$ 在时间 t 存在”上有别（只有 $a$ 有此属性），也必在“在时间中存在是因为 $b$ 在时间 t 存在”上有别（只有 $b$ 有此属性）。由此，(PII) 对具体对象成立。论证还可推广到抽象对象：像“因为 $b$ 是抽象的而是抽象的或具体的”这类属性同为非平凡化（不纯）属性，无法被共有；故任何两个对象，不论抽象具体，都必在某些非平凡化属性上有别，这正是 (PII) 所求（关于此论证与前一论证，见 Rodriguez-Pereyra 2022: 106–125）[^rodriguez-pereyra-2022]。
