      One assumption of this argument is that the relevant kind of conceivability entails the relevant kind of possibility. But resisting this assumption is not the only way to resist this kind of argument against (PIIa) and (PIIb). One might also resist it by arguing that the content of our imaginative act leaves open whether what we imagine is two spheres at a distance from each other or merely one sphere at a distance from itself (Hacking 1975: 251; O’Leary-Hawthorne 1995: 195)[^hacking-1975][^o’leary-hawthorne-1995], and thus it is not legitimate to conclude that Black’s world is possible. But there are reasons to be sceptical of this kind of reply since it might be the case, as Calosi and Varzi have argued, that this kind of reply adds nothing to the simple denial that there can be indiscernible objects (Calosi & Varzi 2016)[^calosi-2016]. Another reply to the argument, similar in vein in that it also exploits the fact that the content of our imaginative act does not guarantee that we are imagining two spheres at a distance from each other, is that all we might be imagining in such a case is a simple and scattered object occupying two spherical regions (cf. Hawley 2009)[^hawley-2009]. This object is not a sphere, nor does it contain any spheres as parts. A fourth response to the argument argues that the spheres are fusions of pure properties and that they share, among their qualitative parts, an unlocated sphere that consists of all the spheres’ pure properties except their location properties. Thus, on this line of thought, Black’s world does not contain two spheres that share all their pure properties but one unlocated sphere and two located ones, and the two located ones differ with respect to their location properties (Shiver 2014: 909–10)[^shiver-2014]. Sometimes it is argued that the spheres in Black’s world do not counterexemplify the Identity of Indiscernibles because they are weakly discernible, since although they are at a distance from each other, neither is at a distance from itself; thus, for instance, sphere $a$ is two miles away from sphere $b$ but it is not two miles away from itself (Saunders 2006, Muller 2015)[^muller-2015][^saunders-2006]. But although this point is correct, it does not touch the claim that Black’s spheres constitute a counterexample to (PIIa), which is what Black’s example was intended to counterexemplify.
    step1: |-
      这一论证有一个假定：相关种类的可设想性蕴含相关种类的可能性。但要抵制这种反对 (PIIa) 与 (PIIb) 的论证，抵制这一假定并不是唯一的方式。人们也可以这样抵制它：论证我们的想象行为的内容并未确定我们所设想的是两个彼此相隔一定距离的球，还是仅仅一个与自身相隔一定距离的球（Hacking 1975: 251；O’Leary-Hawthorne 1995: 195）[^hacking-1975][^o’leary-hawthorne-1995]，因此没有理由断定布莱克世界是可能的。但有理由怀疑这类答复，因为正如 Calosi 与 Varzi 所论证的，这类答复可能并未给“不可能有不可分辨的对象”这一简单否认增添任何东西（Calosi & Varzi 2016）[^calosi-2016]。对这一论证的另一种答复，路数相似，也利用我们的想象行为的内容不能保证我们正在设想两个彼此相隔一定距离的球这一事实：它说，在这种情形下我们所设想的可能只是一个占据两个球形区域的简单而分散的对象（参 Hawley 2009）[^hawley-2009]。这个对象不是球，也不以任何球为部分。对论证的第四种回应论证说，球是纯属性的融合体，而它们在各自的质性部分中共享一个无位置的球，该球由两球除位置属性之外的全部纯属性构成。因此，按这一思路，布莱克世界并不包含两个分享其全部纯属性的球，而包含一个无位置的球与两个有位置的球，且两个有位置的球在位置属性上有别（Shiver 2014: 909–10）[^shiver-2014]。有时人们论证，布莱克世界中的球并不构成对不可分辨者的同一性的反例，因为它们是弱可分辨的，虽然彼此相隔一段距离，但谁也不与自身相隔一段距离；例如，球 $a$ 与球 $b$ 相隔两英里，但它不与自身相隔两英里（Saunders 2006, Muller 2015）[^muller-2015][^saunders-2006]。但这一点虽然正确，却并不触及“布莱克的球构成 (PIIa) 的反例”这一主张，而布莱克的例子本就是要为 (PIIa) 提供反例。
    step2: |-
      该论证有一个前提：相关类型的可设想性蕴含相关类型的可能性。要抗拒这类针对 (PIIa)、(PIIb) 的论证，不一定非得否定这个前提。也可以这样反驳：我们的想象行为之内容本身并未确定，所设想的究竟是两个彼此相隔一段距离的球，还是只有一个与自身相隔一段距离的球（Hacking 1975: 251；O’Leary-Hawthorne 1995: 195）[^hacking-1975][^o’leary-hawthorne-1995]；据此便不能断言布莱克世界是可能的。但这种答复值得怀疑：Calosi 与 Varzi 指出，这类答复恐怕并没有比径直否认“可能有不可分辨的对象”多说什么（Calosi & Varzi 2016）[^calosi-2016]。第二种答复与上述思路相近，同样抓住“想象内容不足以保证我们设想的是两个相隔一段距离的球”这一点，主张此时所设想的也许只是一个占据两个球状区域的简单分散对象（参 Hawley 2009）[^hawley-2009]；该对象不是球，也不以任何球为部分。第四种回应则主张，球是纯属性的融合体，两球在各自的质性部分中共享一个无位置之球，后者由两球除位置属性以外的全部纯属性构成。按此思路，布莱克世界所含并非两个共有全部纯属性的球，而是三个：一个无位置之球与两个有位置之球，且两个有位置之球在位置属性上有别（Shiver 2014: 909–10）[^shiver-2014]。另有一种说法是，布莱克世界中的球并不构成反例，因为它们弱可分辨：它们虽彼此相隔一段距离，却谁也不与自身相隔一段距离——例如球 $a$ 距球 $b$ 两英里，但并不距自身两英里（Saunders 2006；Muller 2015）[^muller-2015][^saunders-2006]。这话固然不错，却无损于“布莱克的球构成 (PIIa) 的反例”这一主张，而布莱克的例子本就是要反驳 (PIIa)。
