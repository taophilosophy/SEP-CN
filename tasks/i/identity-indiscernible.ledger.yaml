      Another argument against (PIIb) is based on the idea that all intrinsic pure properties are not only individually shareable but also jointly shareable. Thus, for any set of intrinsic pure properties that an object could have, there could be two objects having the same set of intrinsic pure properties (Rodriguez-Pereyra 2022: 82–86)[^rodriguez-pereyra-2022]. If this is the case, then (PIIb) is false.
    step1: |-
      另一个反对 (PIIb) 的论证基于这样一个想法：全部内在纯属性不仅各自可分享，而且可联合分享。因此，对任何一组一个对象可能具有的内在纯属性，都可能有两个对象具有同一组内在纯属性（Rodriguez-Pereyra 2022: 82–86）[^rodriguez-pereyra-2022]。若情况如此，则 (PIIb) 为假。
    step2: |-
      还有一个反对 (PIIb) 的论证出于这样的想法：一切内在纯属性不仅单独可以共有，而且可以成组共有。于是，对任何一个对象可能具有的内在纯属性集合，都可能有两个对象具有同一集合（Rodriguez-Pereyra 2022: 82–86）[^rodriguez-pereyra-2022]。若然，则 (PIIb) 为假。
