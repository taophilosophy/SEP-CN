      The other Leibnizian argument for the Identity of Indiscernibles to be mentioned here appears in Leibniz’s Correspondence with Samuel Clarke (Leibniz & Clarke *Letters,* fifth letter to Clarke, page 61). According to this argument, if there were objects sharing all their intrinsic pure properties, God would have had no reason to place them where he did rather than swap them around, since the world would not have been less valuable if the objects had been swapped around and no other change had been made; but since God does not act without a reason, God did not create objects sharing all their intrinsic pure properties, that is, (PIIb) is true. Of course, this argument depends on the assumption that a certain kind of god exists, namely one for whom the only reason to create one world rather than another is that the world to be created instantiates more value than the other. Needless to say, the assumption that such a god, or any god for that matter, exists, is extremely controversial and rests on weak rational grounds. Furthermore, the argument also presupposes that any two objects could have been swapped around, leaving everything else intact. But this presupposition fails in the case of two atomic objects that are the only objects in a world whose space is relational (see Rodriguez-Pereyra 2014: 108–112)[^rodriguez-pereyra-2014].
    step1: |-
      这里要提到的莱布尼茨支持不可分辨者的同一性的另一个论证出现在他与塞缪尔·克拉克的通信中（Leibniz & Clarke *Letters,* 致克拉克第五封信，第 61 页）。按这一论证，如果存在分享其全部内在纯属性的对象，上帝就没有理由把它们放在他所放的地方，而不把它们互换位置，因为把它们互换而别无其他改变，世界并不会更少价值；但既然上帝无理由不行动，上帝就没有创造分享其全部内在纯属性的对象，也就是说，(PIIb) 为真。当然，这一论证依赖于一个假定：某种上帝存在，即这样一位上帝，对他而言，创造一个世界而非另一个世界的唯一理由，是被创造的世界比另一个世界例示更多价值。不用说，假定这样一位上帝（或任何上帝）存在，是极具争议的，且建立在薄弱的理性根据上。此外，该论证还预设任何两个对象都可以被互换而其余一切不变。但这一预设对两个原子对象不成立，它们是某个空间为关系的世界中仅有的对象（见 Rodriguez-Pereyra 2014: 108–112）[^rodriguez-pereyra-2014]。
    step2: |-
      另一个要提到的莱布尼茨式论证见于他与塞缪尔·克拉克的通信（Leibniz & Clarke *Letters,* 致克拉克第五封信，第 61 页）。其大意是：倘若存在共有全部内在纯属性的对象，上帝便没有理由把它们置于所在之处而不互换其位置，因为互换它们而别无改动，世界并不会因此减损价值；而上帝不会无缘无故地行动，故上帝未创造共有全部内在纯属性的对象，亦即 (PIIb) 成立。这一论证当然依赖一个假定：存在某位这样的神，对他而言，创造此世界而非彼世界的唯一理由，在于前者实现了更多价值。不用说，假定这样一位神（或任何神）存在，极具争议，理性根据也很薄弱。此外，论证还预设任何两个对象都可互换而其余一切不变；该预设对“两个原子对象是某关系性空间世界中仅有的对象”这一情形并不成立（见 Rodriguez-Pereyra 2014: 108–112）[^rodriguez-pereyra-2014]。
