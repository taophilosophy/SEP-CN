  - id: 3
    kind: body
    source: |-
      The Identity of Indiscernibles has long been a topic of philosophical reflection. For instance, the Stoics and Nicholas of Cusa maintained the Identity of Indiscernibles, and Aquinas asserted it of separated intelligences, i.e., non-material minds. But it was Leibniz who made the Identity of Indiscernibles a distinctive topic of philosophical reflection. Indeed, by producing arguments for and from it, and by making it a central element of his influential philosophical system, Leibniz made the Identity of Indiscernibles more salient to his contemporaries and successors (for discussion of the role and place of the Identity of Indiscernibles in Leibniz’s system, and his arguments for and from it, see Rodriguez-Pereyra 2014)[^rodriguez-pereyra-2014]. After Leibniz, philosophers of the calibre of Kant, Bolzano, Russell, Wittgenstein, and MacTaggart all discussed the Identity of Indiscernibles. And in the mid twentieth century it was Max Black, in a now classic article published in *Mind*, who, by putting forward a provocative, if not completely original, thought experiment, produced a renewal of interest in the Identity of Indiscernibles and set much of the agenda for discussion of it since the 1950s onwards (see Black 1952)[^black-1952]. Black’s thought experiment consists in conceiving a universe where there are only two iron spheres, at a certain distance from each other, having the same diameter as each other, the same colour as each other, the same temperature as each other, etc. If such a universe is possible then at least some versions of the Identity of Indiscernibles are not true. The Identity of Indiscernibles has continued to be discussed since then up until the present.
    step1: |-
      不可分辨者的同一性长期以来是哲学反思的话题。例如，斯多亚派与库萨的尼古拉都主张不可分辨者的同一性，阿奎那则对分离的理智，即非物质的心灵，断言了这一原则。但正是莱布尼茨使不可分辨者的同一性成为一个独特的哲学反思话题。确实，通过提出支持它的论证与从它出发的论证，并使之成为其影响深远的哲学体系的核心要素，莱布尼茨使不可分辨者的同一性对他的同代人与后继者更为突出（关于不可分辨者的同一性在莱布尼茨体系中的作用与地位，以及他支持它和从它出发的论证，见 Rodriguez-Pereyra 2014）[^rodriguez-pereyra-2014]。莱布尼茨之后，康德、波尔查诺、罗素、维特根斯坦与麦克塔格特这一水准的哲学家都讨论过不可分辨者的同一性。二十世纪中叶，马克斯·布莱克在一篇如今已成为经典的、发表于 *Mind* 的文章中，提出了一个颇具挑衅性（若非完全原创）的思想实验，从而重新唤起了人们对不可分辨者的同一性的兴趣，并为自 1950 年代以来关于它的讨论设定了大部分议程（见 Black 1952）[^black-1952]。布莱克的思想实验是设想一个宇宙，其中只有两个铁球，彼此相隔一定距离，直径相同、颜色相同、温度相同，等等。如果这样的宇宙是可能的，那么不可分辨者的同一性至少某些版本就不成立。此后直到现在，不可分辨者的同一性一直得到讨论。
    step2: |-
      不可分辨者的同一性历来是哲学反思的题目。斯多亚派与库萨的尼古拉都持守这一原则，阿奎那则把它用于分离的理智，即非物质的心灵。然而，真正使它成为独立哲学论题的还是莱布尼茨：他既提出支持它的论证，也由它推出进一步结论，并把它置于自己影响深远的哲学体系的中心，因而使这一原则在同代人与后继者眼中格外醒目（关于该原则在莱布尼茨体系中的角色与位置，以及他为之和为自之的论证，参 Rodriguez-Pereyra 2014）[^rodriguez-pereyra-2014]。莱布尼茨之后，康德、波尔查诺、罗素、维特根斯坦、麦克塔格特等一流哲学家都曾讨论它。到二十世纪中叶，马克斯·布莱克在 *Mind* 上发表的那篇如今已成经典的文章，以一个颇具挑衅性（尽管未必全然原创）的思想实验重新激起了学界的兴趣，并为此后自 1950 年代起的讨论定下了大部分议程（参 Black 1952）[^black-1952]。他设想一个宇宙，其中只有两个铁球，彼此相隔一定距离，而直径、颜色、温度等一概相同。倘若这样的宇宙可能，该原则的某些版本便不成立。自那时以降直至今日，这一原则始终是讨论的对象。
