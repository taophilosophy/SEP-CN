      Bernard Bolzano, sometimes known as the “Bohemian Leibniz”, rejected some Leibnizian principles, and accepted others, and one of those he accepted was the Identity of Indiscernibles. He argues for (PIIb) and his argument for it is different from any argument for the Identity of Indiscernibles one finds in Leibniz. Bolzano believes that all finite substances are causally connected. On this basis he infers the Identity of Indiscernibles, since he thinks that for two substances to have the same intrinsic pure properties they must not only have been given the same original properties by God, but they must also be surrounded by substances that have exactly the same causal effects on them. But Bolzano thinks that there are infinitely more possible situations in which any two substances are surrounded by substances causally affecting them differently than situations in which they are surrounded by substances causally affecting them equally. Since he takes all these possible situations to be equiprobable, Bolzano infers that (PIIb) is true (Bolzano 1837: 532–33 [2014: volume 1, pp. 384–85])[^bolzano-1837]. There are a few problems with this argument, one of which is that the fact that something is improbable, however highly improbable it is, does not entail that it is not true, and another one is that it is not clear that there are infinitely more possible situations in which any two substances are surrounded by substances causally affecting them differently than situations in which they are surrounded by substances causally affecting them equally. Thus, the argument seems to fall short of establishing its intended conclusion.
    step1: |-
      伯纳德·波尔查诺，有时被称为“波希米亚的莱布尼茨”，拒斥某些莱布尼茨式原则，接受另一些，而他所接受的原则之一就是不可分辨者的同一性。他为 (PIIb) 作论证，其论证与莱布尼茨那里任何支持不可分辨者的同一性的论证都不同。波尔查诺相信一切有限实体都在因果上相互关联。基于此，他推出不可分辨者的同一性，因为他认为，两个实体要具有相同的内在纯属性，它们不仅必须被上帝赋予相同的原初属性，还必须被那些对它们具有完全相同因果作用的实体所环绕。但波尔查诺认为，任何两个实体被以不同方式对它们起因果作用的实体所环绕的可能情境，比它们被以相同方式对它们起因果作用的实体所环绕的情境无限地多。既然他把所有这些可能情境看作等概率的，波尔查诺就推出 (PIIb) 为真（Bolzano 1837: 532–33 [2014: volume 1, pp. 384–85]）[^bolzano-1837]。这一论证有几个问题，其中之一是：某事物是或然的，无论多么高度或然，并不蕴含它不为真；另一个是：不清楚任何两个实体被以不同方式起因果作用的实体所环绕的可能情境是否真的无限多于它们被以相同方式起因果作用者。因此，该论证似乎未能确立其意图的结论。
