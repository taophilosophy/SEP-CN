      For example, if premise 1 is true, there is a possible world $w_1$ where there are only two iron spheres, at a certain distance from each other, and sharing all their pure properties, with only one exception: whilst one sphere has temperature $T$, the other one has a slightly different temperature, $T^*$, e.g., the second sphere is one degree hotter than the first. And if premise 2 is true, then if there is a world with objects sharing almost all their pure properties, there is a world with objects that share all their pure properties, e.g., a world $w_2$ where the spheres of $w_1$ are exactly as they are in $w_1$ except that in $w_2$ they both have the same temperature, say $T$. The two premises entail the conclusion. And assuming that there is a possible world with objects that share all their pure properties if and only if it is possible that there are objects that share all their pure properties, the conclusion of the argument is equivalent to the claim that (PIIa) is false. It has been argued that either the second premise lacks adequate support, or almost indiscernible objects are dispensable to establish the conclusion of the argument. If the premise lacks support, the argument does not establish the possibility of indiscernible objects; if almost indiscernible objects are dispensable, the argument is not needed to establish the possibility of indiscernible objects (Rodriguez-Pereyra 2017a)[^rodriguez-pereyra-2017a].
    step1: |-
      例如，如果前提 1 为真，就存在一个可能世界 $w_1$，其中只有两个铁球，彼此相隔一定距离，并分享其全部纯属性，只有一个例外：一个球温度为 $T$，另一个球温度略有不同，$T^*$，例如第二个球比第一个热一度。而如果前提 2 为真，那么如果存在一个对象分享几乎全部纯属性的世界，就存在一个对象分享全部纯属性的世界，例如一个世界 $w_2$，其中 $w_1$ 的球与它们在 $w_1$ 中完全一样，只是 $w_2$ 中它们都有相同的温度，比如说 $T$。两个前提蕴含结论。并且，假定“存在对象分享全部纯属性的可能世界”当且仅当“对象分享全部纯属性是可能的”，论证的结论就等值于 (PIIa) 为假这一主张。有人论证说，要么第二前提缺乏充分支持，要么几乎不可分辨的对象对于确立论证的结论是多余的。如果前提缺乏支持，论证就没有确立不可分辨对象的可能性；如果几乎不可分辨的对象是多余的，论证对于确立不可分辨对象的可能性就不是必需的（Rodriguez-Pereyra 2017a）[^rodriguez-pereyra-2017a]。
