      The case of physical particles is different, and indeed some philosophers have argued that there are indiscernible physical particles (Cortes 1976, French 1989, Erdrich 2020)[^cortes-1976][^erdrich-2020][^french-1989]. Admittedly, the attribution of properties to particles is justified in terms of explanatory fecundity, and it would be unjustified to attribute to particles properties other than those that are explanatorily necessary. There are two aspects of this argument that make it less cogent than it might seem at first. The first is that from the fact that one is not justified in attributing different properties to particles it does not follow that one is justified in denying of them any other properties. The second, related to the first, is that this argument is contingent on the science of the day, and therefore it is not absolutely conclusive, since science changes continuously, and it might be that the science of tomorrow will assert that any two physical particles have different properties.
    step1: |-
      物理粒子的情形不同，确实有些哲学家论证存在不可分辨的物理粒子（Cortes 1976, French 1989, Erdrich 2020）[^cortes-1976][^erdrich-2020][^french-1989]。诚然，对粒子属性的归属是根据解释上的丰产性来辩护的，而把解释上不必要的属性归属给粒子则是没有辩护的。这一论证有两个方面使它不如初看时那么有说服力。第一，从我们没有理由把不同属性归属给粒子，推不出我们有理由否认粒子的任何其他属性。第二，与第一点相关，这一论证依赖于当时的科学，因此并非绝对具有结论性，因为科学在持续变化，也许明天的科学会断言任何两个物理粒子都具有不同的属性。
    step2: |-
      物理粒子则是另一番情形，有些哲学家确实主张存在不可分辨的物理粒子（Cortes 1976；French 1989；Erdrich 2020）[^cortes-1976][^erdrich-2020][^french-1989]。当然，给粒子归属何种属性，取决于解释上的丰产性；凡解释上不必要的属性，都不应归属给它们。这个论证有两处使其说服力不如初看那么大。其一，无权给粒子归属不同属性，并不意味着就有权否认它们的其他属性。其二（与上一点相关），该论证系于一时一地的科学，因而并不具有绝对的结论性——科学在不断变化，也许明天的科学就会断言任何两个物理粒子都具有不同属性。
