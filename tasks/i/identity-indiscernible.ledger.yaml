  - id: 5
    kind: body
    source: |-
      As stated above, the Identity of Indiscernibles is the thesis that there cannot be numerical difference without extra-numerical difference. There is numerical difference between any objects when those objects are not one, i.e., when they, taken collectively, are more than one. Thus, the Identity of Indiscernibles means that, necessarily, any two objects differ other than merely numerically. The three elements of this thesis, the modal operator, the domain of the quantifier (objects), and the relation that is said to obtain between any two members of that domain (extra-numerical difference) are open to variation and/or interpretation, and any such variation or interpretation produces a different version of the Identity of Indiscernibles.
    step1: |-
      如上所述，不可分辨者的同一性是这样的论题：没有数外差异，就没有数上差异。任何对象之间，当它们不是一，即把它们合起来看多于一个时，就存在数上差异。因此，不可分辨者的同一性意味着：必然地，任何两个对象都在纯数上之外有所差异。这一论题的三个要素——模态算子、量词的定义域（对象）以及据说在该定义域任意两个成员之间成立的关系（数外差异）——都可以变化和/或解释，任何这样的变化或解释都会产生不可分辨者的同一性的不同版本。
    step2: |-
      如前所述，不可分辨者的同一性主张：没有数外差异，便无数上差异。所谓对象之间有数上差异，是指它们并非同一，即合起来看不止一个。于是这一论题是说：必然地，任何两个对象都在纯数之外有所分别。该论题包含三个要素——模态算子、量词的定义域（对象）、以及据称在该定义域任意两个成员之间成立的关系（数外差异）；三者皆可变动或作不同解释，而任何一种变动或解释都会产生该原则的一个不同版本。
  - id: 6
    kind: body
    source: |-
      Let us start with extra-numerical difference. Two objects differ numerically when they differ with respect to which objects they are, while they differ extra-numerically when they differ with respect to how they are. One can interpret extra-numerical difference in terms of properties, or in terms of similarity. On the first interpretation, two objects differ extra-numerically when they differ with respect to some property. On the second interpretation, two objects differ extra-numerically when they don’t resemble exactly. In the contemporary discussion of the Identity of Indiscernibles extra-numerical difference is invariably understood in the former way. However, it is interesting to note that Leibniz typically formulated the Identity of Indiscernibles in terms of perfect similarity, e.g.: “It is not true that two substances *resemble each other* *entirely* and differ *solo numero*” (Leibniz 1686: §9 [2020: 14])[^leibniz-1686]. The former conception of extra-numerical difference is the focus in what follows, given its dominance in the contemporary discussion of the Identity of Indiscernibles.
    step1: |-
      让我们从数外差异开始。两个对象在它们于自己究竟是哪些对象上有别时，就在数上有别；而当它们在自己是怎样的上有别时，就在数外有别。人们可以用属性来解释数外差异，也可以用相似性来解释。按第一种解释，两个对象在某个属性上有别时就在数外有别。按第二种解释，两个对象在并非完全相似时就在数外有别。在当代关于不可分辨者的同一性的讨论中，数外差异一律按前一种方式理解。不过有趣的是，莱布尼茨通常用完全相似来表述不可分辨者的同一性，例如：“两个实体完全彼此相似而仅在数上不同，这是不真的”（Leibniz 1686: §9 [2020: 14]）[^leibniz-1686]。鉴于前一种数外差异概念在当代讨论中的支配地位，下文将聚焦于它。
    step2: |-
      先从数外差异说起。两个对象在“是哪些对象”上有别，便是数上有别；在“是怎样的”上有别，才是数外有别。数外差异可借属性来解释，也可借相似性来解释：按前者，两个对象只要在某属性上有别便数外有别；按后者，两个对象只要并非完全相似便数外有别。当代讨论一律取前一解释。值得一提的是，莱布尼茨本人通常以“完全相似”来表述这一原则，例如：“说两个实体彼此完全相似而仅在数上不同，并不为真”（Leibniz 1686: §9 [2020: 14]）[^leibniz-1686]。下文之所以聚焦前者，是因为它在当代讨论中占据主导。
  - id: 7
    kind: body
    source: |-
      With extra-numerical difference thus understood, the Identity of Indiscernibles can take a very weak form, namely as stating that, necessarily, any two objects must differ in at least one property. In other words:
    step1: |-
      在如此理解数外差异之后，不可分辨者的同一性可以采取一种极弱的形式，即断言：必然地，任何两个对象都至少在某一属性上有别。换言之：
    step2: |-
      数外差异既如此理解，不可分辨者的同一性便可取一种极弱形式：必然地，任何两个对象至少在一个属性上有所不同。换言之：
