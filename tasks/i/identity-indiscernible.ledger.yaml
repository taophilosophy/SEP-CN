      Although it has traditionally been thought that concrete objects fail to satisfy some version of the Identity of Indiscernibles, presumably (PIIa), while abstract objects satisfy it (see, e.g., Baldwin 1996: 233)[^baldwin-1996], in recent years there has been considerable debate about whether there are any abstract objects that violate the corresponding version of the Identity of Indiscernibles. The debate has focused mainly on whether there are numbers and graphs that satisfy some version of the Identity of Indiscernibles (e.g., Keränen 2001; MacBride 2006; Leitgeb & Ladyman 2008; de Clercq 2012; Duguid 2016; Assadian 2024)[^assadian-2024][^duguid-2016][^keränen-2001][^leitgeb-2008][^macbride-2006]. Numbers and graphs are mathematical objects, and the discussion has taken place mainly in the context of realist mathematical structuralism. But similar debates could be had about whether propositions, concepts, meanings, or any other abstract objects satisfy some version of the Identity of Indiscernibles.
    step1: |-
      尽管传统上人们认为具体对象不能满足不可分辨者的同一性的某个版本（大概是 (PIIa)），而抽象对象能满足它（例如见 Baldwin 1996: 233）[^baldwin-1996]，近年来却出现了大量争论：是否存在违反相应版本的不可分辨者的同一性的抽象对象。争论主要集中于数与图是否满足该原则的某个版本（例如 Keränen 2001；MacBride 2006；Leitgeb & Ladyman 2008；de Clercq 2012；Duguid 2016；Assadian 2024）[^assadian-2024][^duguid-2016][^keränen-2001][^leitgeb-2008][^macbride-2006]。数与图是数学对象，讨论主要在实在论数学结构主义的语境中展开。但类似的争论也可以就命题、概念、意义或任何其他抽象对象是否满足该原则的某个版本而展开。
    step2: |-
      传统看法是：具体对象不能满足该原则的某个版本（大概是 (PIIa)），抽象对象则能满足（例如 Baldwin 1996: 233）[^baldwin-1996]。然而近年来，是否存在违反相应版本的抽象对象，引发了相当多的争论，焦点主要在数与图（例如 Keränen 2001；MacBride 2006；Leitgeb & Ladyman 2008；de Clercq 2012；Duguid 2016；Assadian 2024）[^assadian-2024][^duguid-2016][^keränen-2001][^leitgeb-2008][^macbride-2006]。二者都是数学对象，争论多在实在论数学结构主义的框架内进行；同样的争论也完全可以就命题、概念、意义或其他抽象对象展开。
