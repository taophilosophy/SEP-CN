      One thesis which is often thought to interact with the Identity of Indiscernibles is Anti-Haecceitism. As is well known, there are many different senses of Haecceitism and Anti-Haecceitism, and we shall here briefly discuss the relations between various of these senses and the Identity of Indiscernibles (see Cowling 2015b [2023] for a discussion of Haecceitism and Anti-Haecceitism)[^cowling-2015b].
    step1: |-
      有一个常被认为与不可分辨者的同一性相互作用的论题，即反此性论。众所周知，此性论与反此性论有许多不同的含义，我们在此简要讨论其中若干含义与不可分辨者的同一性之间的关系（关于此性论与反此性论的讨论，见 Cowling 2015b [2023]）[^cowling-2015b]。
    step2: |-
      另一个常被视为与该原则相关的论题是反此性论（Anti-Haecceitism）。此性论与反此性论的含义众说纷纭，以下简述其中几种含义与该原则的关系（关于此性论与反此性论，见 Cowling 2015b [2023]）[^cowling-2015b]。
