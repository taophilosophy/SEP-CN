      Another element that is open to variation in the Identity of Indiscernibles is the domain of entities it is about. The Identity of Indiscernibles has been formulated as a thesis about objects where an object is understood as anything that can be the value of a first order variable. Objects thus understood include both concrete and abstract objects, and it is possible to restrict the thesis to either concrete or abstract objects (for the distinction between concrete and abstract objects see Falguera et al. 2021 [2022])[^falguera-2021]. It is, indeed, possible to restrict the thesis to any class of objects—though it is likely that the more restricted the thesis, the less interesting it is, especially if it is restricted to a class of arbitrarily specified objects. And it is also possible to make the domain more inclusive and allow in it the values of higher order variables, though this is not discussed in what follows.
    step1: |-
      不可分辨者的同一性中另一个可变化的要素是它所谈论的实体定义域。不可分辨者的同一性曾被表述为一个关于对象的论题，其中对象被理解为任何可以成为一阶变元取值的东西。如此理解的对象既包括具体对象，也包括抽象对象，而把该论题限制于具体对象或抽象对象都是可能的（关于具体对象与抽象对象的区分，见 Falguera et al. 2021 [2022]）[^falguera-2021]。确实可以把该论题限制于任何一类对象——不过很可能限制越多，论题越无趣，尤其是当它被限制于任意指定的一类对象时。也可以使定义域更具包容性，允许高阶变元的取值进入其中，不过这不在下文讨论之列。
    step2: |-
      另一可变要素是论域，即该原则所谈的实体范围。它曾被表述为关于对象的论题，而“对象”在此指一切可作一阶变元取值者。如此理解的对象兼含具体对象与抽象对象，因此该论题可以只限于具体对象，也可以只限于抽象对象（关于二类对象之别，见 Falguera et al. 2021 [2022]）[^falguera-2021]。原则上，论域可任意收窄至某类对象，但收得越窄，论题通常越乏味，若收窄到任意指定的类别更是如此。反过来，也可以扩大论域，把高阶变元的取值纳入其中；本文不讨论这一路线。
