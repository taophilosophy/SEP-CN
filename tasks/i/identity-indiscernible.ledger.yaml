  - id: 9
    kind: body
    source: |-
      Necessarily, no two objects share all their properties.
    step1: |-
      必然地，没有两个对象分享其全部属性。
    step2: |-
      必然地，任何两个对象都不可能共有全部属性。
  - id: 10
    kind: body
    source: |-
      But, as has been noted innumerable times, although this thesis is true, it is trivially true (e.g., Adams 1979: 11, Van Cleve 2002: 389–90, to mention just two philosophers who have made the point)[^adams-1979][^van-2002]. For no two objects, $a$ and $b$, can share all their properties. For if they did, they would also share their properties of identity (i.e., the properties of *being identical with* $a$ and *being identical with* $b$) and their properties of difference (e.g., the properties of *being numerically different from* $a$ and *being numerically different from* $b$), and many other similar properties. But if they shared these properties, $a$ and $b$ would not be two objects. Therefore, necessarily, any two objects must differ in at least some such properties—but that any two objects differ at least with respect to their properties of identity and difference is a triviality.
    step1: |-
      但正如人们无数次指出的，这一论题虽然为真，却是平凡地为真（例如 Adams 1979: 11, Van Cleve 2002: 389–90，仅举两位提出此点的哲学家）[^adams-1979][^van-2002]。因为任何两个对象 $a$ 与 $b$ 都不可能分享其全部属性。若它们分享了，它们也会分享其同一性属性（即“与 $a$ 同一”与“与 $b$ 同一”这两种属性）及其差异属性（例如“在数上不同于 $a$”与“在数上不同于 $b$”），以及许多其他类似属性。但若它们分享这些属性，$a$ 与 $b$ 就不会是两个对象。因此，必然地，任何两个对象都至少在某些这类属性上有别——而任何两个对象至少在各自的同一性与差异属性上有别，乃是一桩平凡事。
    step2: |-
      然而，正如无数论者早已指出，这一论题虽然成立，却只是平凡地成立（例如 Adams 1979: 11；Van Cleve 2002: 389–90，这里只举两位）[^adams-1979][^van-2002]。因为任意两个对象 $a$ 与 $b$ 都不可能共有全部属性：倘若共有，它们就会连同一性属性（即“与 $a$ 同一”“与 $b$ 同一”）和差异属性（例如“在数上不同于 $a$”“在数上不同于 $b$”）以及许多同类属性也一并共有；而一旦共有这些属性，$a$ 与 $b$ 便不再是两个对象。所以，必然地，任何两个对象至少在某类属性上有别——但“任何两个对象至少在各自的同一性与差异属性上有别”纯属平凡之论。
  - id: 11
    kind: body
    source: |-
      But this trivial thesis is not even a version of the Identity of Indiscernibles, since differing with respect to properties of identity, properties of difference, and similar ones, is differing numerically. Indeed, for objects to differ with respect to properties of identity and properties of difference is for them to differ with respect to which objects they are, not to differ with respect to how they are; but what the Identity of Indiscernibles requires is that every two objects differ with respect to how they are, that is, it requires that they differ extra-numerically.
    step1: |-
      但这一平凡论题甚至不是不可分辨者的同一性的一个版本，因为在同一性属性、差异属性及类似属性上有别，就是数上有别。确实，对象在同一性属性与差异属性上有别，就是它们在究竟是哪些对象上有别，而不是在是怎样的上有别；而不可分辨者的同一性所要求的，是每两个对象都在是怎样的上有别，也就是说，它要求它们在数外有别。
    step2: |-
      然而这个平凡论题连该原则的一个版本都算不上：在同一性属性、差异属性之类属性上有别，本身就是数上有别。对象在这两类属性上有别，说的是它们“是哪些对象”不同，而非“是怎样的”不同；不可分辨者的同一性恰恰要求每两个对象在“是怎样的”上有所不同，亦即要求数外差异。
  - id: 12
    kind: body
    source: |-
      Whether or not (1) should count as a version of the Identity of Indiscernibles, properties of identity and properties of difference are not the only properties that trivialize it. For instance, properties like *being a member of {a}* and *being identical with a and being green* also trivialize (1). There is thus the problem of finding a characterization of the properties that trivialize (1). Roughly, a trivializing property is one that differing with respect to it does not require differing extra-numerically, while a non-trivializing property is one that is not trivializing, i.e., a property that differing with respect to it requires differing extra-numerically. So, for objects to differ with respect to a non-trivializing property is for them to differ with respect to how they are and not merely with respect to which objects they are. (For more specific proposals about the characterization of non-trivializing properties see Katz 1983; Rodriguez-Pereyra 2022: 50–51.)[^katz-1983][^rodriguez-pereyra-2022]
    step1: |-
      无论 (1) 是否应算作不可分辨者的同一性的一个版本，同一性属性与差异属性并不是唯一使它变得平凡的属性。例如，*being a member of {a}* 与 *being identical with a and being green* 这类属性也会使 (1) 平凡。于是就有这样一个问题：找出使 (1) 平凡的属性的刻画。粗略地说，平凡化属性就是这样一种属性：在它上面有别并不要求数外有别；而非平凡化属性则是非平凡化的属性，即在它上面有别要求数外有别。因此，对象在非平凡化属性上有别，就是它们在是怎样的上有别，而不仅仅是在究竟是哪些对象上有别。（关于非平凡化属性刻画更具体的提议，见 Katz 1983；Rodriguez-Pereyra 2022: 50–51。）[^katz-1983][^rodriguez-pereyra-2022]
    step2: |-
      不论 (1) 是否算得上该原则的一个版本，同一性属性与差异属性都远非唯一使其平凡的属性：像 *being a member of {a}*、*being identical with a and being green* 这样的属性同样使 (1) 平凡。于是问题在于如何刻画这类使它平凡的属性。大致说来，平凡化属性指无需数外差异即可有所不同的属性；非平凡化属性则相反，在它上面有别必然意味着数外有别。因此，对象在非平凡化属性上有别，意味着它们在“是怎样的”上有别，而不只是“是哪些对象”不同。（关于非平凡化属性之刻画的更具体方案，参 Katz 1983；Rodriguez-Pereyra 2022: 50–51。）[^katz-1983][^rodriguez-pereyra-2022]
  - id: 13
    kind: body
    source: |-
      Thus, to formulate a non-trivial version of the Identity of Indiscernibles, or indeed to formulate a version of the Identity of Indiscernibles at all, one needs to either vary or interpret differently the notion of property (and thereby the notion of extra-numerical difference). For instance, some philosophers take properties to be universals that make a causal difference to their possessors (e.g., Armstrong 1997)[^armstrong-1997]. Now, since on such a conception of properties there are no properties corresponding to predicates like “is identical with $a$”, “is numerically different from $b$”, etc., on such conception of properties the thesis that, necessarily, no two objects share all their properties is not a triviality.
    step1: |-
      因此，要表述一个非平凡的不可分辨者的同一性版本，甚至要表述该原则的任何版本，人们都需要改变或另行解释属性概念（并由此改变数外差异概念）。例如，一些哲学家把属性视为对其拥有者造成因果差异的共相（如 Armstrong 1997）[^armstrong-1997]。既然在这种属性观下，并不存在对应于“与 $a$ 同一”“在数上不同于 $b$”之类谓词的属性，那么在这种属性观下，“必然地，没有两个对象分享其全部属性”这一论题就不是平凡的。
    step2: |-
      由此可见，要给出非平凡版本的该原则——其实要给出该原则的任何版本——都必须改变属性概念，或对它另作解释（数外差异概念也随之改变）。举例来说，有的哲学家把属性理解为对其拥有者造成因果差异的共相（如 Armstrong 1997）[^armstrong-1997]。在这种属性观之下，既不存在与“与 $a$ 同一”“在数上不同于 $b$”这类谓词相对应的属性，“必然地，任何两个对象都不共有全部属性”便不再是平凡之论。
  - id: 14
    kind: body
    source: |-
      But one could still have a very broad notion of property, on which there are such properties as *being identical with* $a$ and *being numerically different from $b$*, and decide to restrict the properties referred to in the Identity of Indiscernibles to properties that do not render it trivially true. There are several ways in which one could implement this strategy, but in the contemporary discussion the most common one is to restrict the Identity of Indiscernibles to so-called *pure*, or *purely qualitative*, properties. Different philosophers have different conceptions of pure properties, but the general idea is that pure properties are those that “do not mention” any particular object. For instance, *being red*, *being next to a tower*, and *being a lover* are pure properties, while *being next to the Eiffel Tower* and *being a lover of Napoleon* are impure properties, since they “mention” particular objects, i.e., the Eiffel Tower and Napoleon (for discussion of pure properties and how to characterize them precisely see, among others, Adams 1979: 7; Cowling 2015a; Khamara 1988; Plate 2022; and Rodriguez-Pereyra 2022: 21–27)[^adams-1979][^cowling-2015a][^khamara-1988][^plate-2022][^rodriguez-pereyra-2022]. Another option consists in restricting the properties referred to in the Identity of Indiscernibles to intrinsic properties—roughly, those properties such that having them does not depend on how their possessors are related to anything external to them. The literature on the distinction between intrinsic and extrinsic properties is huge, but no proposed distinction seems to be entirely satisfactory. Nevertheless, on any plausible account of extrinsic properties, these include many relational properties (e.g., those relational properties that objects have in virtue of relations to external objects, as opposed to relational properties had in virtue of relations objects bear to themselves or their parts). The version of the Identity of Indiscernibles produced by this restriction is usually associated with Leibniz (N.B.: for Leibniz quantitative differences are extrinsic differences and so, in his philosophy, the idea that necessarily, no two objects share all their intrinsic properties entails that, necessarily, no two objects differ in size alone).
    step1: |-
      但人们仍然可以持一种极宽泛的属性概念，按此存在“与 $a$ 同一”“在数上不同于 $b$”之类属性，同时决定把不可分辨者的同一性所提及的属性限制为不使它平凡地为真的属性。实施这一策略有若干方式，但在当代讨论中最常见的是把不可分辨者的同一性限制于所谓 *纯* 属性或 *纯质性* 属性。不同哲学家对纯属性有不同构想，但总的想法是：纯属性是那些“不提及”任何特定对象的属性。例如，*being red*、*being next to a tower*、*being a lover* 是纯属性，而 *being next to the Eiffel Tower*、*being a lover of Napoleon* 是不纯属性，因为它们“提及”特定对象，即埃菲尔铁塔与拿破仑（关于纯属性及其精确刻画的讨论，见 Adams 1979: 7；Cowling 2015a；Khamara 1988；Plate 2022；Rodriguez-Pereyra 2022: 21–27）[^adams-1979][^cowling-2015a][^khamara-1988][^plate-2022][^rodriguez-pereyra-2022]。另一种选择是把不可分辨者的同一性所提及的属性限制为内在属性——大致说来，即拥有它们不取决于其拥有者与外部事物如何相关的那些属性。关于内在属性与外在属性之区分的文献浩如烟海，但似乎没有一种提议的区分完全令人满意。尽管如此，按任何可信的外在属性说明，它们都包括许多关系属性（例如对象因与外部对象的关系而具有的那些关系属性，相对于对象因其与自身或其部分的关系而具有的关系属性）。由此限制产生的不可分辨者的同一性版本通常与莱布尼茨联系在一起（注意：对莱布尼茨而言，量的差异是外在差异，因此在他的哲学中，“必然地，没有两个对象分享其全部内在属性”这一想法蕴含“必然地，没有两个对象仅在大小上有别”）。
    step2: |-
      然而也可以保留一种极宽泛的属性概念，承认“与 $a$ 同一”“在数上不同于 $b$”之类属性的存在，只是决定把该原则所涉及的属性限定为不会使它平凡成立的属性。实现这一策略的路径不止一条，当代讨论中最常见者是把该原则限定于所谓 *pure* 或 *purely qualitative* 属性。各人对纯属性的理解不尽相同，但大意是：纯属性即“不提及”任何特定对象的属性。例如 *being red*、*being next to a tower*、*being a lover* 是纯属性，而 *being next to the Eiffel Tower*、*being a lover of Napoleon* 是不纯属性，因为它们“提及”了特定对象，即埃菲尔铁塔与拿破仑（关于纯属性及其精确刻画的讨论，见 Adams 1979: 7；Cowling 2015a；Khamara 1988；Plate 2022；Rodriguez-Pereyra 2022: 21–27）[^adams-1979][^cowling-2015a][^khamara-1988][^plate-2022][^rodriguez-pereyra-2022]。另一条路径是把所涉属性限定为内在属性——粗略地说，就是“拥有它不取决于拥有者与外部事物处于何种关系”的属性。内在／外在属性之辨的文献汗牛充栋，却似乎没有一种区分完全令人满意。不过，任何可信的外在属性说明都会承认其中包含大量关系属性（即对象因与外部对象的关系而具有的关系属性，区别于因与自身或其部分的关系而具有的关系属性）。由此得到的该原则版本通常与莱布尼茨相联（注意：在莱布尼茨看来，量的差异属于外在差异，因此在他的哲学中，“必然地，任何两个对象都不共有全部内在属性”蕴含“必然地，任何两个对象不可能仅在大小上有别”）。
