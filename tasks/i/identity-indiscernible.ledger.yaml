      In one sense of the term, Anti-Haecceitism is the view that fixing all purely qualitative facts fixes *all* facts. That is, necessarily, any purely qualitative description of reality entails all facts. This version of Anti-Haecceitism rules out the possibility of merely non-qualitative differences; for instance, it rules out the possibility that I could have had all the pure properties of Napoleon Bonaparte, or that someone who does not actually exist could have had all the pure properties of Indira Ghandi (Skow 2008 and Scarpati 2023 argue that Anti-Haecceitism should be understood along these lines)[^scarpati-2023][^skow-2008]. This version of Anti-Haecceitism entails neither (PIIa) nor (PIIb), since nothing in it requires that a purely qualitative description of reality entails that there are no objects having the same pure properties, or even the same intrinsic pure properties—indeed, that there are two objects sharing all their pure properties is a purely qualitative description, and therefore it might be part of a purely qualitative description of reality. And nor does such a version of Anti-Haecceitism entail (PII) either, since the fact that, necessarily, any purely qualitative description of reality entails all facts does not entail that no two objects can share all their non-trivializing properties, pure and impure. However, Alexander Roberts has argued that Anti-Haecceitism entails (PIIa) on the basis of some recombination assumptions—for instance, that it is metaphysically possible for any concrete object to be either the tallest, the smallest, the most massive, or the least massive of its kind, or that for any intrinsic pure property that neither of two objects has, it is possible that at least one of those objects has it while the other one does not have it. In effect, what Roberts argues is that, necessarily, there are no objects that, necessarily, share all their pure properties. Some of these assumptions will not be accepted by everyone, and indeed Roberts himself has noted that some of them do not hold up in certain ontologies (Roberts 2024: 95, fn. 4)[^roberts-2024], so there is some degree of conditionality to Roberts’ conclusion.
    step1: |-
      在该术语的一种意义上，反此性论是这样的观点：固定全部纯质性事实就固定了全部事实。也就是说，必然地，对实在的任何纯质性描述都蕴含一切事实。这一版本的反此性论排除了仅有非质性差异的可能性；例如，它排除这样的可能性：我本可以具有拿破仑·波拿巴的全部纯属性，或者某个并不现实存在的人本可以具有英迪拉·甘地的全部纯属性（Skow 2008 与 Scarpati 2023 论证反此性论应沿这些线索理解）[^scarpati-2023][^skow-2008]。这一版本的反此性论既不蕴含 (PIIa) 也不蕴含 (PIIb)，因为它内部没有任何东西要求对实在的纯质性描述蕴含“不存在具有相同纯属性、甚至相同内在纯属性的对象”——确实，“有两个对象分享其全部纯属性”本身就是一个纯质性描述，因此它可能是对实在的纯质性描述的一部分。这一版本的反此性论也不蕴含 (PII)，因为“必然地，任何对实在的纯质性描述都蕴含一切事实”这一事实并不蕴含“没有两个对象能分享其全部非平凡化属性（无论纯还是不纯）”。然而，亚历山大·罗伯茨曾基于一些重组假定论证反此性论蕴含 (PIIa)——例如，任何具体对象在形而上学上可能成为其同类中最高、最小、质量最大或质量最小者；或者，对任何两个对象都不具有的内在纯属性，至少其中一个对象可能具有它而另一个不具有它。实际上，罗伯茨论证的是：必然地，不存在这样的对象，它们必然地分享其全部纯属性。这些假定中有些不会得到所有人接受，罗伯茨本人也指出其中一些在某些本体论中不成立（Roberts 2024: 95, fn. 4）[^roberts-2024]，所以罗伯茨的结论有一定程度的有条件性。
    step2: |-
      在一种意义上，反此性论主张：确定全部纯质性事实，就确定了全部事实；亦即必然地，任何对实在的纯质性描述都蕴含一切事实。这一版本排除了“仅有非质性差异”的可能——例如排除了这样的可能：我本可拥有拿破仑·波拿巴的全部纯属性，或某个并不现实存在者本可拥有英迪拉·甘地的全部纯属性（Skow 2008 与 Scarpati 2023 主张反此性论应如此理解）[^scarpati-2023][^skow-2008]。该版本既不蕴含 (PIIa) 也不蕴含 (PIIb)：它并未要求纯质性描述蕴含“不存在具有相同纯属性乃至相同内在纯属性的对象”——何况“有两个对象共有全部纯属性”本身就是一句纯质性描述，因而完全可能成为实在之纯质性描述的一部分。它也不蕴含 (PII)：由“必然地，任何纯质性描述都蕴含一切事实”推不出“没有两个对象能共有全部非平凡化属性（无论纯杂）”。不过，亚历山大·罗伯茨曾根据若干重组假定论证反此性论蕴含 (PIIa)，例如：任何具体对象在形而上学上皆可能成为其同类中最高、最小、最重或最轻者；或者，对任何两个对象都不具有的某个内在纯属性，至少其中一个可能具有它而另一个不具有。罗伯茨实际论证的是：必然地，不存在必然地共有全部纯属性的对象。这些假定未必人人接受，罗伯茨本人也承认其中一些在某些本体论中站不住（Roberts 2024: 95, fn. 4）[^roberts-2024]，故其结论带有某种程度的条件性。
