    source: |-
      Obviously, this puzzle does not affect those who think identity is ungrounded, fundamental. But even those who accept that identity is grounded have resources to avoid the puzzle. One obvious way out of the puzzle is to reject the transitivity of grounding, which some have found reason to reject (e.g., Schaffer 2012)[^schaffer-2012]. But there are other options. One of them is to restrict the properties whose sharing grounds identity to purely qualitative ones. That, of course, assumes the truth of (PIIa), which is very controversial, to say the least. Alternatively, one can attempt to ground identity in necessary indiscernibility, as Thornton proposes (Thornton forthcoming). According to this proposal, what grounds that $a = a$ is that $a$ is necessarily indiscernible from $a$, and what grounds that $a$ is numerically different from $b$ is that $a$ and $b$ are possibly discernible from each other. On this proposal indiscernibility is restricted to purely qualitative properties. The proposal presupposes that there cannot be numerically distinct entities that are necessarily (purely qualitative) indiscernible, and so its viability depends on whether such a presupposition is true. Another option is to maintain that $a = a$ is grounded in the fact that $a$ bears only purely qualitative reflexive relations to $a$. But this is vulnerable to the possibility of co-located purely qualitatively indiscernible objects, since some such objects will not stand in any purely qualitative irreflexive relations with respect to each other (bosons might be an example of such objects). Finally, Elgin has argued that what grounds the fact that $a = a$ is a relation that obtains between the second-order universal quantifier and *being a property that a has if and only if a has it*. This avoids the circularity problem mentioned above, since a relation is not a fact and so the problem that the identity fact partially grounds itself does not arise (Elgin forthcoming). (Of course there are other accounts of the grounds of identity, but here the focus is on a very brief description of some accounts on which indiscernibility, or something very close to it, grounds identity. For more general discussion of the grounds of identity see Lo 2023, forthcoming and Shumener 2020).
    step1: |-
      显然，这一谜题不影响那些认为同一性是无奠基的、基础性的人。但即便接受同一性有奠基的人也有资源避开这一谜题。一个显然的出路是拒斥奠基的传递性，有些人确有理由拒斥（例如 Schaffer 2012）[^schaffer-2012]。但还有其他选择。其中之一是把其分享奠基同一性的属性限制为纯质性属性。那当然假定了 (PIIa) 为真，而这至少可以说是极具争议的。或者，可以尝试把同一性奠基在必然的不可分辨性中，如桑顿所提议（Thornton forthcoming）。按这一提议，使 $a = a$ 成立的根据是 $a$ 必然不可分辨于 $a$，而使 $a$ 在数上不同于 $b$ 的根据是 $a$ 与 $b$ 可能彼此可分辨。在这一提议中，不可分辨性被限制于纯质性属性。该提议预设：不可能存在必然（纯质性上）不可分辨的数上不同实体，因此其可行性取决于这一预设是否为真。另一个选择是主张 $a = a$ 奠基于这样一个事实：$a$ 对 $a$ 只具有纯质性自反关系。但这容易受到共处且纯质性上不可分辨的对象的可能性之威胁，因为某些这类对象彼此之间不会处于任何纯质性非自反关系中（玻色子也许就是这样的例子）。最后，埃尔金论证说，使 $a = a$ 成立的根据是二阶全称量词与 *being a property that a has if and only if a has it* 之间成立的一种关系。这避开了上述循环问题，因为关系不是事实，因而同一性事实部分地奠基自身的问题不会出现（Elgin forthcoming）。（当然还有其他关于同一性根据的说明，但这里只聚焦于对某些说明的非常简短的描述，这些说明以不可分辨性、或非常接近它的东西奠基同一性。关于同一性根据的更一般讨论，见 Lo 2023, forthcoming 与 Shumener 2020。）
    step2: |-
      当然，这一谜题对认为同一性无奠基、属基础层的人不生效力；但即便接受“同一性有奠基”者，也有办法避开它。最直接的一条是拒斥奠基的传递性——有人正有理由如此（例如 Schaffer 2012）[^schaffer-2012]。此外还有别的出路。其一，把可作为同一性之根据的属性限定为纯质性属性；这当然假定了 (PIIa)，而该假定至少可说是极具争议。其二，可以尝试以必然的不可分辨性奠基同一性，如桑顿所主张（Thornton forthcoming）：使 $a = a$ 成立者，是 $a$ 必然不可分辨于 $a$；使 $a$ 在数上不同于 $b$ 者，是 $a$ 与 $b$ 可能彼此可分辨。此说把不可分辨性限于纯质性属性，并预设不存在必然地（纯质性上）不可分辨的数上不同实体，其可行性系于该预设。其三，主张 $a = a$ 奠基于“$a$ 对 $a$ 只持有纯质性自反关系”这一事实。但此说易受“共处且纯质性上不可分辨的对象”之可能的威胁：某些这类对象彼此之间不处于任何纯质性非自反关系（玻色子或是一例）。最后，埃尔金主张，使 $a = a$ 成立者，是二阶全称量词与 *being a property that a has if and only if a has it* 之间成立的一种关系；由于关系不是事实，上述“同一性事实部分地奠基自身”的问题便不会出现（Elgin forthcoming）。（当然还有别的同一性根据理论，此处只简述以不可分辨性、或与之极近的东西奠基同一性的若干说明。关于同一性根据的更一般讨论，见 Lo 2023, forthcoming；Shumener 2020。）
