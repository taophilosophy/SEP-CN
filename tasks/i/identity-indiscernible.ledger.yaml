      Another argument against (PIIb) is based on the so-called *Recombination Principle*, according to which putting together duplicates of parts of different possible worlds yields another possible world (Lewis 1986b: 87–8; see also van Cleve 2002: 391)[^lewis-1986b]. If so, if there is a possible world with an object having certain intrinsic pure properties, and there is another possible world with an object having those intrinsic pure properties, then there is a third possible world containing a duplicate of the first object and a duplicate of the second object; this third world contains objects sharing all their intrinsic pure properties and, assuming that there is a possible world with objects sharing all their intrinsic pure properties if and only if it is possible that there are objects sharing all their intrinsic pure properties, this argument, if sound and valid, proves (PIIb) false. As formulated, this argument obviously presupposes the controversial Lewisian ontology of possible worlds, and it is thereby weakened in its persuasive power. This is not, however, an essential presupposition, and the argument could be reformulated using only combinatorial principles without assuming the Lewisian ontology of possible worlds. Nevertheless, it has been argued that the argument cannot be reformulated in an actualist setting and that it is actually invalid, since given that the objects in the first two worlds are duplicates of each other, any duplicate of either is a duplicate of the other, and so there is no guarantee that in the third world there are two objects rather than one object at a distance from itself (Rodriguez-Pereyra 2022: 81–82)[^rodriguez-pereyra-2022].
    step1: |-
      另一个反对 (PIIb) 的论证基于所谓 *重组原则*，按此原则，把来自不同可能世界的部分的复本组合起来会产生另一个可能世界（Lewis 1986b: 87–8；另见 van Cleve 2002: 391）[^lewis-1986b]。若如此，如果存在一个可能世界含有一个具有某些内在纯属性的对象，又存在另一个可能世界含有一个具有那些内在纯属性的对象，那么就存在第三个可能世界，其中含有第一个对象的复本与第二个对象的复本；这第三个世界含有分享其全部内在纯属性的对象，并且，假定“存在分享全部内在纯属性的对象的可能世界”当且仅当“分享全部内在纯属性的对象是可能的”，那么这一论证若健全且有效，就证明 (PIIb) 为假。如其所表述，这一论证显然预设了有争议的刘易斯式可能世界本体论，因而其说服力被削弱。然而这并不是本质性的预设，该论证可以仅用组合原则重新表述，而不假定刘易斯式可能世界本体论。尽管如此，有人论证该论证无法在现实论框架内重新表述，并且实际上无效，因为既然前两个世界中的对象彼此是复本，任何一方的复本也就是另一方的复本，因此在第三个世界中并不能保证有两个对象，而不是一个与自身相隔一段距离的对象（Rodriguez-Pereyra 2022: 81–82）[^rodriguez-pereyra-2022]。
    step2: |-
      反对 (PIIb) 的另一个论证依据所谓 *Recombination Principle*（重组原则）：把来自不同可能世界的部分之复本拼合起来，便得到另一个可能世界（Lewis 1986b: 87–8；另见 van Cleve 2002: 391）[^lewis-1986b]。果真如此，那么只要一个可能世界里有对象具有某些内在纯属性、另一个可能世界里有对象具有同样的内在纯属性，就会有第三个可能世界，其中包含前一个对象的复本与后一个对象的复本；该世界里的对象共有全部内在纯属性。又假定“存在共有全部内在纯属性的对象的可能世界”当且仅当“共有全部内在纯属性的对象是可能的”，则这一论证若健全有效，便证明 (PIIb) 为假。如此表述的论证显然预设了颇有争议的刘易斯式可能世界本体论，说服力因之大减。不过这一预设并非本质性的，论证可以只用组合原则改写。尽管如此，已有论者指出该论证无法在现实论框架内改写，而且本就不成立：既然前两个世界中的对象互为复本，任何一方的复本都是另一方的复本，于是第三个世界里未必有两个对象，说不定只是一个与自身相隔一段距离的对象（Rodriguez-Pereyra 2022: 81–82）[^rodriguez-pereyra-2022]。
