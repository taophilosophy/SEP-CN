      Another interesting interaction is that between the Identity of Indiscernibles and the Bundle Theory. It is often thought that the Bundle Theory entails a version of the Identity of Indiscernibles, namely (PIIa) and/or (PIIb) (Armstrong 1978: 91; Loux 1998: 107)[^armstrong-1978][^loux-1998]. There are different versions of the Bundle Theory, but one version of it says that properties are universals, and individual objects are entirely constituted by the universals they instantiate (thus individuals are “bundles” of universals, hence the theory’s name). Given this, the thought is, there cannot be two objects instantiating exactly the same universals, since objects that instantiated exactly the same universals would be entirely constituted by the same entities (namely the same universals), and no two objects, it is assumed, could have exactly the same constituents. Since universals are supposed to be pure properties, the idea is that the Bundle Theory entails either (PIIa) or (PIIb).
    step1: |-
      另一个有趣的相互作用是不可分辨者的同一性与束论之间的。人们常认为束论蕴含不可分辨者的同一性的某个版本，即 (PIIa) 和/或 (PIIb)（Armstrong 1978: 91；Loux 1998: 107）[^armstrong-1978][^loux-1998]。束论有不同的版本，但其一个版本说，属性是共相，个体对象完全由它们所例示的共相构成（因此个体是共相的“束”，理论之名由此而来）。据此，想法是：不可能有两个对象例示完全相同的共相，因为例示完全相同共相的对象会完全由相同的实体（即相同的共相）构成，而假定没有两个对象能具有完全相同的构成物。既然共相应当是纯属性，其想法是束论蕴含 (PIIa) 或 (PIIb)。
    step2: |-
      另一个有趣的关联是束论与该原则的关系。人们常说束论蕴涵该原则的某个版本，即 (PIIa) 和／或 (PIIb)（Armstrong 1978: 91；Loux 1998: 107）[^armstrong-1978][^loux-1998]。束论版本不一，其中一种主张：属性是共相，个体对象完全由其所例示的共相构成（个体因此是共相的“束”，理论由此得名）。照此想法，不可能有两个对象例示完全相同的共相——因为那样的对象会由同一批实体（同样的共相）完全构成，而据假定，没有两个对象能有完全相同的构成物。既然共相被当作纯属性，结论便是束论蕴含 (PIIa) 或 (PIIb)。
