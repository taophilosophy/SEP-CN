      Universals, as usually conceived, are the referents of singular terms (i.e., “wisdom”, “redness”, etc.) and therefore they are values of first-order variables. Consequently, they are objects as the term is understood here. Is the Identity of Indiscernibles true of them? It has traditionally been thought that (PIIa) is true of universals (see, e.g., Armstrong 1997: 50, Heil 2003: 159; cf. Lewis 1986a [1999: 98])[^armstrong-1997][^heil-2003][^lewis-1986a]. Indeed, some have thought that what distinguishes universals from particulars is that the former can be indiscernible, while the latter cannot (e.g., Ehring 2011: 35, Williams 1986: 3, Wisdom 1934: 208)[^ehring-2011][^williams-1986][^wisdom-1934]. But recently this line of thought has been questioned, and it has been argued that there is nothing in the concept of a universal that rules out indiscernible universals, and that postulating indiscernible universals can be theoretically useful (Giberman 2016, Rodriguez-Pereyra 2017b; for further discussion see Ou 2024)[^giberman-2016][^rodriguez-pereyra-2017b].
    step1: |-
      共相，按通常的构想，是单称词项（即“智慧”“红性”等）的指称物，因而是阶变元的取值。因此，按本文对“对象”的理解，它们是对象。不可分辨者的同一性对它们为真吗？传统上人们认为 (PIIa) 对共相为真（例如见 Armstrong 1997: 50, Heil 2003: 159；参 Lewis 1986a [1999: 98]）[^armstrong-1997][^heil-2003][^lewis-1986a]。确实，有人曾认为，共相与殊相的区别就在于前者可以是不可分辨的，而后者不能（例如 Ehring 2011: 35, Williams 1986: 3, Wisdom 1934: 208）[^ehring-2011][^williams-1986][^wisdom-1934]。但近来这一思路受到质疑，有人论证共相概念中没有任何东西排除不可分辨的共相，并且设定不可分辨的共相在理论上可能是有用的（Giberman 2016, Rodriguez-Pereyra 2017b；进一步讨论见 Ou 2024）[^giberman-2016][^rodriguez-pereyra-2017b]。
    step2: |-
      按通常理解，共相是“智慧”“红性”这类单称词项的指称物，因而是阶变元的取值，也就属于本文所说的对象。那么该原则对共相成立吗？传统答案是 (PIIa) 成立（例如 Armstrong 1997: 50；Heil 2003: 159；参 Lewis 1986a [1999: 98]）[^armstrong-1997][^heil-2003][^lewis-1986a]。甚至有人认为，共相与殊相之别正在于前者可以不可分辨，后者则不能（例如 Ehring 2011: 35；Williams 1986: 3；Wisdom 1934: 208）[^ehring-2011][^williams-1986][^wisdom-1934]。晚近这一思路遭到质疑：有论者主张，共相概念并不排除不可分辨的共相，设定它们甚至可能在理论上有所助益（Giberman 2016；Rodriguez-Pereyra 2017b；进一步讨论见 Ou 2024）[^giberman-2016][^rodriguez-pereyra-2017b]。
