      Faithful to his style, Leibniz produced a battery of different arguments for the Identity of Indiscernibles. As was pointed out before, Leibniz’s intended version of the Identity of Indiscernibles is a principle stronger than (PIIb), one that entails (PIIb). Here we shall briefly concentrate only on two of Leibniz’s arguments. The first argument, typical from his philosophy in the 1680s and whose *locus classicus* is Section 9 of the *Discourse on Metaphysics*, tries to derive the Identity of Indiscernibles from Leibniz’s idea that individual substances have complete individual concepts, concepts that contain absolutely everything that is true of them, past, present, and future (Leibniz 1686 [2020])[^leibniz-1686]. The argument, however, is subject to two related objections. Firstly, nowhere does Leibniz argue that numerically different individual substances cannot share an individual complete concept, that is, there is no argument from Leibniz that, necessarily, no two individual substances have one and the same individual complete concept. But if they did, given that such concepts contain all the intrinsic pure properties of the substances having those concepts, there would be indiscernible substances in the sense ruled out by (PIIb), i.e., substances sharing all their intrinsic pure properties. Secondly, even if, necessarily, no two substances share their individual complete concepts, Leibniz has not ruled out the possibility of indiscernible individual complete concepts—that is, Leibniz has not ruled out the possibility of numerically distinct individual complete concepts that specify the same intrinsic pure properties. But if such indiscernible concepts are possible, then two or more individual substances could falsify (PIIb) by virtue of having indiscernible individual complete concepts.
    step1: |-
      莱布尼茨忠于自己的风格，提出了一整套不同的支持不可分辨者的同一性的论证。如前所述，莱布尼茨所意图的不可分辨者的同一性版本是一条比 (PIIb) 更强的原则，它蕴含 (PIIb)。这里我们只简要集中于莱布尼茨的两个论证。第一个论证是其 1680 年代哲学的典型，其 *locus classicus* 是《形而上学谈》第 9 节，它试图从莱布尼茨关于个体实体具有完整个体概念的想法——这些概念包含关于它们的绝对一切真理，过去的、现在的与未来的——推出不可分辨者的同一性（Leibniz 1686 [2020]）[^leibniz-1686]。然而，这一论证有两点相关的反对意见。首先，莱布尼茨从未论证数上不同的个体实体不能分享一个完整的个体概念，也就是说，莱布尼茨没有论证：必然地，没有两个个体实体具有同一个完整的个体概念。但若它们真有，鉴于这类概念包含具有这些概念的实体的全部内在纯属性，那就会出现 (PIIb) 所排除意义上的不可分辨实体，即分享其全部内在纯属性的实体。其次，即便必然地没有两个实体分享其完整的个体概念，莱布尼茨也没有排除不可分辨的完整个体概念的可能性——也就是说，莱布尼茨没有排除数上不同却规定相同内在纯属性的完整个体概念的可能性。但若这类不可分辨的概念是可能的，那么两个或更多个体实体就可以凭借具有不可分辨的完整个体概念而使 (PIIb) 为假。
    step2: |-
      莱布尼茨一如既往，抛出成串不同的论证来支持该原则。前已指出，他所设想的版本比 (PIIb) 更强，并蕴含 (PIIb)。这里只简略谈其中两个。第一个是其 1680 年代哲学的典型论证，*locus classicus* 为《形而上学谈》第 9 节：它试图由“个体实体具有完整个体概念，而这些概念包含关于该实体过去、现在与未来的一切真理”这一想法，推出该原则（Leibniz 1686 [2020]）[^leibniz-1686]。此论证面临两点相关的责难。其一，莱布尼茨从未论证数上不同的个体实体不能共有一个完整个体概念，即他并未论证：必然地，没有两个个体实体具有同一个完整个体概念。但假如真有，那么由于这类概念包含实体的全部内在纯属性，就会出现 (PIIb) 所不容的不可分辨实体，即共有全部内在纯属性的实体。其二，纵使必然地没有两个实体共有一个完整个体概念，莱布尼茨也没有排除“不可分辨的完整个体概念”之可能，即数上不同却规定着相同内在纯属性的完整个体概念之可能。而这类概念若可能，两个或更多个体实体便可凭此使 (PIIb) 为假。
