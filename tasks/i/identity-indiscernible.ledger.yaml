      The notion of weak discernibility, the notion featuring in the third version of the Identity of Indiscernibles just distinguished, has been much discussed in recent years, especially in relation to the indiscernibility of physical particles (see, for instance, Saunders 2003, 2006; Muller 2015)[^muller-2015][^saunders-2003]. Weak discernibility can be explained by saying that two objects are weakly discernible if and only if there is a relation R that they bear to each other but at least one them does not bear to itself. What (PIIQw) demands is that every two objects be at least weakly discernible.
    step1: |-
      弱可分辨性这一概念，即刚才区分的第三个不可分辨者的同一性版本所涉及的概念，近年来得到了大量讨论，尤其是联系到物理粒子的不可分辨性（例如见 Saunders 2003, 2006；Muller 2015）[^muller-2015][^saunders-2003]。弱可分辨性可以这样说明：两个对象是弱可分辨的，当且仅当存在一种它们彼此具有、但至少其中一方并不对自身具有的关系 R。(PIIQw) 所要求的，是每两个对象至少是弱可分辨的。
    step2: |-
      第三个版本所用的“弱可分辨性”概念，近年讨论甚多，尤其与物理粒子的不可分辨性相关（例如 Saunders 2003, 2006；Muller 2015）[^muller-2015][^saunders-2003]。所谓两个对象弱可分辨，当且仅当存在一种关系 R，它们彼此之间具有该关系，而至少其中一方并不对自身具有它。(PIIQw) 要求的正是：任何两个对象至少弱可分辨。
