      以下著作除《元素书》之外，均由亚历山大·阿尔特曼与 S. M. 施特恩在其专著《伊萨克·伊斯拉埃利：十世纪早期的一位新柏拉图主义哲学家》中译出。20 世纪 50 与 60 年代，这两位学者还在若干期刊上发表了这些著作残篇与抄本的转录本。除了出版并翻译伊萨克·伊斯拉埃利的已知著作之外，阿尔特曼与施特恩还牢固地确立了格肖姆·朔勒姆提出的假说：伊萨克·伊斯拉埃利撰有一部先前被误归给亚里士多德的著作，即《论元素章》（曼图亚文本）。此外，在他们对伊斯拉埃利文本的广泛分析中（其中常把伊斯拉埃利的文本与肯迪及其他作者的相应段落相比较），他们确立了亚伯拉罕·伊本·哈斯代（卒于 1240 年）附在其《王子与苦行者》希伯来语译本之后的这部新柏拉图主义论著具有惊人的古老性。这部论著被他们称为“伊本·哈斯代的新柏拉图主义者”，实际上早于并影响了伊萨克·伊斯拉埃利与《亚里士多德神学长编本》；施特恩论“伊本·哈斯代的新柏拉图主义者”的文章，是任何深入研究伊萨克·伊斯拉埃利哲学的工作的重要组成部分。
