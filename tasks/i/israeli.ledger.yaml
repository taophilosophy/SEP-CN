      Another of the Golden Age Hebrew poets of Spain, Moses Ibn Ezra (c. 1060–1139) quotes Isaac Israeli without attribution in his treatise *The Book of the Garden, explaining the meaning of Metaphor and Literal Expression* (Originally in Judeo-Arabic: *Kitab al-Hadiqa fi Maᶜna ‘l-Majaz wa’l-Haqiqa*). Stern explores this matter in his article “Isaac Israeli and Moses ibn Ezra.” The poet and philosopher Joseph Ibn Tzaddiq of Cordoba (d. 1149) authored a work *The Microcosm* (the Judeo-Arabic original is lost, but the work survived in Hebrew translation as *Ha-ᶜolam ha-Qatan*) containing many ideas indebted to Israeli. Parallels between the two thinkers are illuminated in Altmann and Stern’s *Isaac Israeli* (pp. 30, 44, 73–74, 117)*.*
