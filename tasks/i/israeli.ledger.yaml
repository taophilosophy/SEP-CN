    source: |-
      The four kinds of inquiry, introduced by Aristotle in his *Posterior Analytics*, and subsequently modified by Neoplatonist commentators, were such a universal and fundamental component of the cultural *episteme*, that elaboration of the four inquiries often formed part of the introduction to philosophical and medical treatises. Aristotle lists the four questions thusly:
    step1: |-
      四类探究由亚里士多德在《后分析篇》中引入，后经新柏拉图主义评注者修改，是当时文化知识型（episteme）中如此普遍而基本的成分，以至于对四类探究的阐述常常构成哲学与医学论著导论的一部分。亚里士多德如此列举四个问题：
    step2: |-
      四类探究首见于亚里士多德《后分析篇》，后为新柏拉图主义注家所损益；此说在当时的文化知识型（episteme）中既普遍又根本，故哲学与医学论著之导论往往列而述之。亚里士多德所列四问如下：
  - id: 16
    kind: body
    source: |-
      “(1) whether the connexion of an attribute with a thing is a fact, (2) what is the reason of the connexion, (3) whether a thing exists, (4) what is the nature of the thing.” (*Posterior Analytics* ii.1, G.R.G. Mure translation)
    step1: |-
      “（1）属性与事物的联系是否为事实；（2）该联系的原因为何；（3）事物是否存在；（4）事物的本性为何。”（《后分析篇》ii.1，G.R.G. Mure 英译）
    step2: |-
      “（1）一属性与一事物之联系是否为事实；（2）此联系之理由为何；（3）此物是否存在；（4）此物之本性为何。”（*Posterior Analytics* ii.1，G.R.G. Mure 译本）
  - id: 17
    kind: body
    source: |-
      Following the practice of thinkers of his age, at the very beginning of his *Book of Definitions* and also at the beginning of his *Book on Fevers*, Isaac Israeli introduces the Aristotelian distinction of the four kinds of inquiry, in a slightly modified form:
    step1: |-
      遵循同时代思想家的做法，伊萨克·伊斯拉埃利在《定义之书》的开头以及《热病之书》的开头，都以略微修改的形式引入了亚里士多德关于四类探究的区分：
    step2: |-
      伊萨克·伊斯拉埃利亦步同时诸家之后尘，于《定义之书》与《热病之书》开篇，以稍加改易的形式揭出亚里士多德四类探究之别：
  - id: 18
    kind: body
    source: |-
      “(1) The first is existence: when one inquires whether so-and-so exists; (2) the second is quiddity: when one inquires what so-and-so is; (3) the third is quality: when one inquires how so-and-so is; (4) the fourth is ‘quarity’: when one inquires why so-and-so is.” (Altmann and Stern, *Isaac Israeli*, pp. 10–11)
    step1: |-
      “（1）第一是存在：当人探究某某是否存在；（2）第二是本质：当人探究某某是什么；（3）第三是性质：当人探究某某如何；（4）第四是‘何因’：当人探究某某为何如此。”（Altmann and Stern, *Isaac Israeli*, pp. 10–11）
    step2: |-
      “（1）其一为存在，即问某某是否存在；（2）其二为本质（quiddity），即问某某是什么；（3）其三为性质，即问某某如何；（4）其四为‘何因’（quarity），即问某某为何如此。”（Altmann and Stern, *Isaac Israeli*, pp. 10–11）
  - id: 19
    kind: body
    source: |-
      Israeli’s description mirrors the list of al-Jahiz (d. ca. 869) in the *Book of Indications and Considerations* (Arabic: *Kitab al-Dala’il wa’l-ᶜItibar*) as well as ᶜAli ibn Sahl Rabban al-Tabari (fl. 9ᵗʰ century), in his medical text *Firdaws al-Hikmah fi al-Tibb*. His list varies slightly from that of al-Kindi, who in his treatise on metaphysics *Al-Falsafah al-ᶜula* defines the third inquiry as *which*, rather than *how*.
    step1: |-
      伊斯拉埃利的描述与贾希兹（卒于约 869 年）在《迹象与思量之书》（阿拉伯语：*Kitab al-Dala’il wa’l-ᶜItibar*）中的列举相似，也与塔巴里（活跃于 9 世纪）在其医学文本《智慧乐园论医学》（*Firdaws al-Hikmah fi al-Tibb*）中的列举相似。他的列举与肯迪略有不同：肯迪在其形而上学论著《第一哲学》（*Al-Falsafah al-ᶜula*）中把第三类探究界定为“哪一个”，而非“如何”。
    step2: |-
      伊斯拉埃利此说，与贾希兹（卒于约 869 年）《迹象与思量之书》（*Kitab al-Dala’il wa’l-ᶜItibar*）之列举相合，亦与塔巴里（9 世纪人）医书《智慧乐园论医学》（*Firdaws al-Hikmah fi al-Tibb*）相合。唯与肯迪稍异：肯迪于其形而上学论著《第一哲学》（*Al-Falsafah al-ᶜula*）中，以第三问为“哪一个”，而非“如何”。
