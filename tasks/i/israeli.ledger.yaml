    source: |-
      We have only a few scant clues of his biography, and we cannot be sure of their veracity, especially in the issue of the date of his death. We know that he lived the first half of his life in Egypt, before moving to Karouan, Tunisia between the years of 905–907. Most biographers agree that he lived to the age of 100, though they disagree on the years of birth and death. Saᶜid al-Andalusi (mid-11ᵗʰ century), in his work *Kitab Tabakat al-Umam*, indicates that he died in 932 (R. Blachere 1935, p. 157)[^blachere-1935]. However, one of Israeli’s pupils, Ibn al-Jazzar died in 1009 at an approximate age of 80. If Israeli had died in 932, Ibn al-Jazzar would have been only five years old at his death, thus this date is unlikely. Abraham Ibn Hasday, a translator of Israeli’s works from Arabic into Hebrew, provides the date of his passing as 942. But Altmann and Stern (*Isaac Israeli*, p. xx) have pointed out that Ibn Hasday likely made a transcription error in his quotation of Saᶜid al-Andalusi. Another student of Israeli, Dunash Ibn Tamim, wrote a commentary on the Jewish mystical work *Sefer Yetzirah* in 956, and indicated therein that Israeli was no longer alive, though not mentioning the year of his death.
    step1: |-
      关于他的生平，我们只有少许零星的线索，并且无法确定其真实性，尤其是在卒年问题上。我们只知道他前半生居于埃及，后在 905–907 年间迁往突尼斯的凯鲁万。多数传记作者都同意他活到百岁，但对生卒年份意见不一。萨伊德·安达卢西（11 世纪中叶）在《民族分类之书》（*Kitab Tabakat al-Umam*）中称他卒于 932 年（R. Blachere 1935, p. 157）[^blachere-1935]。然而，伊斯拉埃利的一位学生伊本·贾扎尔卒于 1009 年，享年约八十。若伊斯拉埃利卒于 932 年，则伊本·贾扎尔在其去世时年仅五岁，故此说不大可能。亚伯拉罕·伊本·哈斯代曾把伊斯拉埃利的著作从阿拉伯语译为希伯来语，他给出的卒年是 942 年。但 Altmann 与 Stern（*Isaac Israeli*, p. xx）指出，伊本·哈斯代在引述萨伊德·安达卢西时很可能发生了抄录错误。伊斯拉埃利的另一位学生杜纳什·伊本·塔米姆于 956 年为犹太神秘主义著作《创造之书》（*Sefer Yetzirah*）撰写评注，其中表明伊斯拉埃利已不在人世，但未提及卒年。
    step2: |-
      其生平留给我们的是若干零星线索，真伪难辨，卒年尤为可疑。可知者：他前半生居于埃及，约 905–907 年间移居突尼斯的凯鲁万。传记作者多谓其寿至百岁，而生卒年份则言人人殊。萨伊德·安达卢西（11 世纪中叶）《民族分类之书》（*Kitab Tabakat al-Umam*）称其卒于 932 年（R. Blachere 1935, p. 157）[^blachere-1935]。然其门生伊本·贾扎尔卒于 1009 年，年约八十；若伊斯拉埃利卒于 932 年，则其时伊本·贾扎尔方五岁，此说自难成立。亚伯拉罕·伊本·哈斯代——伊斯拉埃利著作的希伯来语译者——则记其卒年为 942 年。唯 Altmann 与 Stern（*Isaac Israeli*, p. xx）指出，伊本·哈斯代引述萨伊德·安达卢西时恐有笔误。另一门生杜纳什·伊本·塔米姆 956 年为犹太神秘主义典籍《创造之书》（*Sefer Yetzirah*）作评注，书中言及伊斯拉埃利已谢世，而未著其卒年。
  - id: 4
    kind: body
    source: |-
      The Arab chroniclers of physicians indicate that Isaac Israeli served as a doctor to Ubayd Allah al-Mahdi, the founder of the Fatimid Dynasty of North Africa, who reigned from 910–934. In his capacity as physician, Israeli wrote several medical treatises which were widely regarded in the Islamic world, and highly valued in Christian scholastic circles as well. These works include the *Book of Fevers*, the *Book of Foodstuffs and Drugs*, and the *Book of Urine*. Later Islamic historians relate accounts that the first and third Fatimid rulers died from not following the sound advice of Isaac Israeli, though the absence of these anecdotes in the earlier chronicles, combined with their literary trope-like character, render the tales suspect. Nonetheless, these narratives do indicate the great respect accorded to Isaac Israeli.
    step1: |-
      阿拉伯的医生编年史家记载，伊萨克·伊斯拉埃利曾为北非法蒂玛王朝的创建者乌拜德·阿拉·马赫迪（在位 910–934 年）担任医生。作为医生，伊斯拉埃利撰写了若干医学论著，在伊斯兰世界广为推崇，在基督教经院圈子里也备受重视。这些著作包括《热病之书》（*Book of Fevers*）、《食物与药物之书》（*Book of Foodstuffs and Drugs*）与《尿之书》（*Book of Urine*）。后来的伊斯兰史家记载说，法蒂玛王朝的第一位与第三位统治者都因未听从伊斯拉埃利的良言而死去；不过这些轶事不见于较早的编年史，且带有文学套语的性质，故其真实性可疑。尽管如此，这些叙述确实表明伊斯拉埃利备受尊崇。
    step2: |-
      阿拉伯医学编年史家载，伊萨克·伊斯拉埃利曾任北非法蒂玛王朝开国之君乌拜德·阿拉·马赫迪（在位 910–934 年）的医生。居医职期间，他撰成医学论著数种，伊斯兰世界推重之，基督教经院圈亦珍视之，其中有《热病之书》（*Book of Fevers*）、《食物与药物之书》（*Book of Foodstuffs and Drugs*）与《尿之书》（*Book of Urine*）。后世伊斯兰史家记有传闻，谓法蒂玛朝第一、第三位君主皆因不纳伊斯拉埃利之谏而殒命；然此等轶事不见于较早编年史，且迹近文学套语，真伪难信。惟诸家记述仍足以见伊斯拉埃利见重之深。
  - id: 5
    kind: body
    source: |-
      Although the chronicler Ibn Abi Usaybi’a, as well as titles of some of Israeli’s work in manuscripts, assign Israeli the patronymic term Abu Yaᶜqub (“father of Jacob”), the biographers state that he never married or fathered children, and attribute to him the statement that his books will cause his name to be remembered far better than children would. The assignment of patronymics to persons who did not marry and beget offspring is not altogether rare—thus we also see the patronymic “Abu Ayub” applied to the childless poet and philosopher Solomon Ibn Gabirol. As some of Israeli’s treatises have survived over a millennium and remain the occasional subject of scholarly research, his prediction is correct.
    step1: |-
      尽管编年史家伊本·阿比·乌赛比阿以及一些抄本中伊斯拉埃利著作的标题，都给他加上了父名“阿布·雅库布”（“雅各之父”），但传记作者们说他从未结婚，也没有子女，并称他曾说过：他的书将比子女更好地使他的名字被人记住。给未婚无子者加父名并不十分罕见——例如，无子的诗人兼哲学家所罗门·伊本·加比罗尔也被冠以父名“阿布·阿尤布”。伊斯拉埃利的一些论著流传千年有余，至今仍偶为学术研究的对象，可见他的预言是对的。
    step2: |-
      编年史家伊本·阿比·乌赛比阿以及部分抄本所题伊斯拉埃利著作之名，均以父名称之曰“阿布·雅库布”（“雅各之父”）；然传记作者谓其终身未娶、无嗣，并传其言：吾书之使吾名传世，远胜于子嗣。未婚无子而受父名者，本非罕事——无子的诗人哲学家所罗门·伊本·加比罗尔亦被冠以“阿布·阿尤布”之称。伊斯拉埃利若干论著历千年而犹存，至今偶为学界研讨之资，其言信然。
