      Although the chronicler Ibn Abi Usaybi’a, as well as titles of some of Israeli’s work in manuscripts, assign Israeli the patronymic term Abu Yaᶜqub (“father of Jacob”), the biographers state that he never married or fathered children, and attribute to him the statement that his books will cause his name to be remembered far better than children would. The assignment of patronymics to persons who did not marry and beget offspring is not altogether rare—thus we also see the patronymic “Abu Ayub” applied to the childless poet and philosopher Solomon Ibn Gabirol. As some of Israeli’s treatises have survived over a millennium and remain the occasional subject of scholarly research, his prediction is correct.
    step1: |-
      虽然编年史家伊本·阿比·乌赛比阿以及伊斯拉埃利某些著作的抄本题名，都给伊斯拉埃利加上了父名式称谓阿布·雅各布（“雅各之父”），但传记作者们说，他从未结婚，也没有子女，并为他记下这样一句话：他的书使他的名字被人记住，远胜于子女所能做到的。给未曾结婚生育的人加上父名，并不十分罕见；因此我们也看到，无子女的诗人兼哲学家所罗门·伊本·盖比鲁勒被冠以“阿布·阿尤布”的父名。伊斯拉埃利的若干论著存世已逾千年，至今仍偶尔成为学术研究的对象，可见他的预言应验了。
