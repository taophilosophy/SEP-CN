      伊萨克·本·所罗门·伊斯拉埃利（约 855–955）不可与较晚的西班牙天文学家小伊萨克·伊斯拉埃利（卒于 1322 年）相混。他曾任北非法蒂玛王朝创建者的御医，以阿拉伯语撰写多部哲学与医学论著，这些论著后来被译成拉丁语和希伯来语，流传甚广。伊斯拉埃利是中世纪最早的犹太新柏拉图主义作家之一，但论思想的原创性，他不及后来的犹太哲学家，如所罗门·伊本·盖比鲁勒（阿维斯布隆）、摩西·迈蒙尼德与格森尼德。他的著作反映并概括了当时占主导地位的哲学范式，即以新柏拉图主义的透镜读解亚里士多德思想。伊斯拉埃利的思想主要受阿拉伯哲学家肯迪（卒于约 870 年）和当时可得的新柏拉图主义文献影响：或是《亚里士多德神学》，或是（依 S. M. 施特恩的假说）一部伪托的新柏拉图主义论著，其阿拉伯文原本已不存。后者后来由亚伯拉罕·伊本·哈斯代（卒于 1240 年）译为希伯来语，附在美文集《王子与苦行者》之后。他的著作大部分是对这两个来源的改写和评注，但仍有几处偏离肯迪，例如影之流溢的观念，以及对肯迪模型所述理智活动过程的反转。伊斯拉埃利的哲学著作曾为后来若干犹太与基督教作者所阅读，他们偶尔加以引用，有时并不注明出处。他的医学论著则在穆斯林和基督教地区被医生广泛阅读、长期推崇，达数百年之久。
