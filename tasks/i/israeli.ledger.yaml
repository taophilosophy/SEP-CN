      A single Hebrew translation (*Shaᶜar ha-Yesodot le-Aristo*) is extant in manuscript Mantua 28c, folios 16r–18r. This unsigned work was initially regarded as an anonymous commentary on Aristotle. Altmann, developing a hypothesis first proposed by Gershom Scholem, argues that this text is the work of Isaac Israeli. Also called the *Mantua Text*, it is available in English translation by Altmann in two publications—*Journal of Jewish Studies*, vii (1956) pp. 31–57 and in Altmann and Stern’s *Isaac Israeli*, pp. 119–32.
