      In a few instances in his *Book of Definitions*, Israeli diverges from models given by his forerunner al-Kindi. Although Israeli posits a *first intellect* and a *second intellect*, Israeli describes three hypostases of intellect. *First intellect*, the entity which emerges from the conjunction of first matter and first form, contains all subsequent forms, which emanate from the f*irst intellect* and determine the specificality of all substances and knows all things eternally. The secondary hypostasis of intellect is actually in the rational soul, and is potential intellect before it passes into the actual intellect of the first intellect. The “second intellect” (actually the third hypostasis of intellect) is a faculty of the rational soul, which via sense perception and imagination (the “internal senses”) conveys information to the higher hypostasis in the rational soul. The second intellect of the rational soul unites with the objects of its intellection in a spiritual, non-corporeal sense and similarly, upon conveyance of the intellection to the higher intellect of the rational soul, the higher hypostasis of intellect within the rational soul also spiritually unites with the objects of its intellection. (Altmann and Stern, *Isaac Israeli*, pp. 36–7) Since Israeli here diverges from al-Kindi, Stern accuses Israeli of a clumsy misreading of the latter. (*Isaac Israeli*, p. 39) However, since Israeli’s description of internal senses largely mirrors the description in John of Damascus’ *De Fide Orthodoxa*, (Book II, Chapter 20) it is likely that Israeli derived his overall schema of intellection from another source. While Stern rejected the connection between the text of John of Damascus and Israeli (Isaac Israeli, p. 59), Harry Wolfson rejoined that *De Fida Orthodoxa* was available in Arabic translation in the tenth century (Wolfson, 1961, p. 279). Further, it is possible that Israeli was drew his conception from another lost source common to himself and John of Damascus, or from a lost Arabic commentator on the latter.
    step1: |-
      在《定义书》的少数几处，伊斯拉埃利偏离了他的先行者肯迪所给出的模型。伊斯拉埃利虽然设定了 *第一理智*（*first intellect*）与 *第二理智*（*second intellect*），却描述了三个理智本体。*第一理智* 是第一质料与第一形式结合而产生的实体，它包含随后的一切形式，这些形式由第一理智流溢而出，规定一切实体的种性，并永恒地认识万物。理智的次级本体实际上就在理性灵魂之中，它在进入第一理智的现实理智之前是潜能理智。“第二理智”（实际上是理智的第三个本体）是理性灵魂的一种能力，它经由感官知觉与想象（“内部感觉”）把信息传达给理性灵魂中较高的本体。理性灵魂的第二理智以精神的、非形体的方式与其理智活动的对象结合；同样，当理智活动被传达给理性灵魂中较高的理智时，理性灵魂中较高的理智本体也以精神的方式与其理智活动的对象结合。（Altmann and Stern, *Isaac Israeli*, pp. 36–7）由于伊斯拉埃利在此偏离肯迪，施特恩指责他笨拙地误读了后者。（*Isaac Israeli*, p. 39）然而，伊斯拉埃利对内部感觉的描述大体上与大马士革的约翰《正统信仰阐详》（第二卷第二十章）的描述相应，因此他的理智活动总体图式很可能取自另一来源。施特恩虽否认大马士革的约翰文本与伊斯拉埃利之间的联系（Isaac Israeli, p. 59），哈里·沃尔夫森却回应说，《正统信仰阐详》在 10 世纪已有阿拉伯语译本（Wolfson, 1961, p. 279）。此外，伊斯拉埃利也可能从另一个与他本人及大马士革的约翰共同的佚失来源，或从一位佚失的阿拉伯语约翰注疏家那里取得这一构想。
