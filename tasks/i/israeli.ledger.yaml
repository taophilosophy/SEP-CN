      In Plotinus’ *Enneads*, the founding text of Neoplatonist philosophy, *The One* contains a will which is not separate from itself (*Enneads*, vi 8.21), and precedes the emanation of *Nous* (The Intellect/Intelligence) a secondary entity from which all lower beings emanate. In Arabic paraphrases of Plotinus, the *Will* or *Word* of God is a secondary hypostasis which creates *Intellect* (ᶜAql). This model is also seen in later Jewish Neoplatonist philosophers Solomon Ibn Gabirol and Judah Halevi. However, Isaac Israeli, like Plotinus, does not treat the will of God as a separate hypostasis or secondary being.
    step1: |-
      在普罗提诺的《九章集》这部新柏拉图主义哲学奠基之作中，*太一* 包含一个不与自身分离的意志（《九章集》vi 8.21），并且先于 *理智*（Nous，即智性/理智）的流溢；理智是一个次级的实体，一切较低存在者都由它流溢而出。在普罗提诺的阿拉伯语改写本中，上帝的 *意志* 或 *道* 是一个次级本体，它创造 *理智*（ᶜAql）。这一模型也见于后来的犹太新柏拉图主义哲学家所罗门·伊本·盖比鲁勒与犹大·哈列维。然而，伊萨克·伊斯拉埃利同普罗提诺一样，并不把上帝的意志当作一个分离的本体或次级存在者。
