    source: |-
      We have only a few scant clues of his biography, and we cannot be sure of their veracity, especially in the issue of the date of his death. We know that he lived the first half of his life in Egypt, before moving to Karouan, Tunisia between the years of 905–907. Most biographers agree that he lived to the age of 100, though they disagree on the years of birth and death. Saᶜid al-Andalusi (mid-11ᵗʰ century), in his work *Kitab Tabakat al-Umam*, indicates that he died in 932 (R. Blachere 1935, p. 157)[^blachere-1935]. However, one of Israeli’s pupils, Ibn al-Jazzar died in 1009 at an approximate age of 80. If Israeli had died in 932, Ibn al-Jazzar would have been only five years old at his death, thus this date is unlikely. Abraham Ibn Hasday, a translator of Israeli’s works from Arabic into Hebrew, provides the date of his passing as 942. But Altmann and Stern (*Isaac Israeli*, p. xx) have pointed out that Ibn Hasday likely made a transcription error in his quotation of Saᶜid al-Andalusi. Another student of Israeli, Dunash Ibn Tamim, wrote a commentary on the Jewish mystical work *Sefer Yetzirah* in 956, and indicated therein that Israeli was no longer alive, though not mentioning the year of his death.
    step1: |-
      关于他的生平，我们只有少许零星的线索，而且无法确定其真实性，死亡日期问题尤其如此。我们确知他前半生住在埃及，公元 905–907 年间移居突尼斯的凯鲁万。多数传记作者都同意他活到一百岁，但对生年与卒年意见不一。赛义德·安达卢西（11 世纪中叶）在《诸民族分类书》中指出他卒于 932 年（R. Blachere 1935, p. 157）[^blachere-1935]。然而，伊斯拉埃利的一位学生伊本·贾扎尔卒于 1009 年，享年约八十岁。倘若伊斯拉埃利卒于 932 年，则伊本·贾扎尔在他去世时年仅五岁，因此这一日期不大可能。将伊斯拉埃利著作由阿拉伯语译为希伯来语的亚伯拉罕·伊本·哈斯代，给出的卒年是 942 年。但阿尔特曼与施特恩（*Isaac Israeli*, p. xx）指出，伊本·哈斯代引用赛义德·安达卢西时很可能发生了抄写错误。伊斯拉埃利的另一位学生杜纳什·伊本·塔米姆于 956 年为犹太神秘主义著作《创世书》（*Sefer Yetzirah*）撰写注释，并在其中表明伊斯拉埃利已不在人世，但没有提及他卒于何年。
    step2: |-
      关于他的生平，可靠的线索只有零星几点，其真实性也无法确证，死亡日期尤其如此。我们确知他前半生居于埃及，905 至 907 年间移居突尼斯的凯鲁万。多数传记作者都同意他活到一百岁，但对生卒年份说法不一。赛义德·安达卢西（11 世纪中叶）在《诸民族分类书》中称他卒于 932 年（R. Blachere 1935, p. 157）[^blachere-1935]。可是，伊斯拉埃利的学生伊本·贾扎尔卒于 1009 年，享年约八十岁。若伊斯拉埃利卒于 932 年，则伊本·贾扎尔在他去世时只有五岁，此说因此难以成立。把伊斯拉埃利著作从阿拉伯语译成希伯来语的亚伯拉罕·伊本·哈斯代给出的卒年是 942 年。但阿尔特曼与施特恩（*Isaac Israeli*, p. xx）指出，伊本·哈斯代引用赛义德·安达卢西时很可能抄录有误。伊斯拉埃利的另一位学生杜纳什·伊本·塔米姆于 956 年为犹太神秘主义著作《创世书》（*Sefer Yetzirah*）撰写注释，其中表明伊斯拉埃利已不在人世，但没有提到卒年。
