      在新柏拉图主义哲学的奠基文本普罗提诺《九章集》中，太一含有一个不与自身分离的意志（《九章集》VI.8.21），并且先于理智（Nous）的流溢；理智是一个次级实体，一切较低的存在者都从它流溢而出。在普罗提诺的阿拉伯语改写本中，上帝的意志或道是一个次级的位格，它创造理智（ᶜAql）。这一模式也见于后来的犹太新柏拉图主义哲学家所罗门·伊本·加比罗尔与犹大·哈列维。然而，伊萨克·伊斯拉埃利与普罗提诺一样，不把上帝的意志当作一个分离的位格或次级存在者。
