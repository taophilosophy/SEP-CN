      One may interpret Israeli here as saying that if a man has an imperfect knowledge that it is bad to eat unhealthy candies, his knowledge and his temptation for these candies are in struggle in his soul. His capacities of consideration and cogitation (אלפכר) have to decide between this imperfect knowledge and the temptation. Once this person attains perfect knowledge, he or she no longer wishes to eat the candies. S. Sadik argues that Israeli’s remarks constitute a Socratic negation of akrasia (Sadik 2013)[^sadik-2013].
    step1: |-
      此处可以这样理解伊斯拉埃利：如果一个人抱有不完善的知识，知道吃不健康的糖果不好，那么他的知识与他对这些糖果的诱惑便在灵魂中相互斗争。他的考量与思考能力（אלפכר）必须在不完善的知识与诱惑之间作出决定。一旦此人获得完善的知识，他或她便不再想吃糖果。S. Sadik 论证，伊斯拉埃利的论述构成了对意志薄弱的苏格拉底式否定（Sadik 2013）[^sadik-2013]。
