      Though Hamilton himself did not use the term, his idea quickly became known as ‘kin selection’, for obvious reasons. Kin selection theory predicts that animals are more likely to behave altruistically towards their relatives than towards unrelated members of their species. Moreover, it predicts that the *degree* of altruism will be greater, the closer the relationship. In the years since Hamilton's theory was devised, these predictions have been amply confirmed by empirical work. For example, in various bird species, it has been found that ‘helper’ birds are much more likely to help relatives raise their young, than they are to help unrelated breeding pairs. Similarly, studies of Japanese macaques have shown that altruistic actions, such as defending others from attack, tend to be preferentially directed towards close kin. In most social insect species, a peculiarity of the genetic system known as ‘haplodiploidy’ means that females on average share more genes with their sisters than with their own offspring. So a female may well be able to get more genes into the next generation by helping the queen reproduce, hence increasing the number of sisters she will have, rather than by having offspring of her own. Kin selection theory therefore provides a neat explanation of how sterility in the social insects may have evolved by Darwinian means. (Note, however, that the precise significance of haplodiploidy for the evolution of worker sterility is a controversial question; see Maynard Smith and Szathmary 1995 ch.16, Gardner, Alpedrinha and West 2012.)[^maynard-1995]
    step1: |-
      汉密尔顿本人虽未使用该词，其想法很快因显而易见的原因被称为“亲缘选择”。亲缘选择理论预测，动物更可能对亲属而非同种中无亲缘关系的成员表现出利他行为。此外，它预测亲缘关系越近，利他的*程度*越大。在汉密尔顿理论提出后的岁月里，这些预测已由经验工作充分证实。例如，在各种鸟类中发现，“帮手”鸟帮助亲属养育幼鸟的可能性远高于帮助无亲缘关系的繁殖对。类似地，对日本猕猴的研究表明，诸如保护他人免受攻击的利他行为，往往优先指向近亲。在多数社会性昆虫物种中，称为“单倍二倍体”的遗传系统特性意味着雌性平均与姐妹共享的基因多于与自己后代共享的基因。因此，雌性通过帮助蚁后繁殖、从而增加自己将拥有的姐妹数，可能比通过留下自己后代，把更多基因带入下一代。亲缘选择理论由此为下列问题提供了简洁解释：社会性昆虫中的不育如何可能通过达尔文式手段演化。（不过请注意，单倍二倍体对工蚁不育演化的确切意义仍是有争议的问题；见 Maynard Smith and Szathmary 1995 第 16 章、Gardner, Alpedrinha and West 2012。）[^maynard-1995]
