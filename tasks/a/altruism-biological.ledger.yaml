      Also indicative of the difference between altruistic behaviour and behaviour that benefit both self and others is the fact that in the latter case, though not the former, the beneficiary may be a member of a different species, without altering the evolutionary dynamics of the behaviour. Indeed, there are numerous examples where the self-interested activities of one organism produce an incidental benefit for a non-conspecific; such behaviours are sometimes called ‘mutualistic’, though again, this is not the only way that the latter term has been used (West *et al*. 2007)[^west-2007]. By contrast, in the case of altruism, it makes an enormous difference whether the beneficiary and the donor are con-specifics or not; for if not, then kin selection can play no role, and it is quite unclear how the altruistic behaviour can evolve. Unsurprisingly, virtually all the bona fide examples of biological altruism in the living world involve donors and recipients that are con-specifics. (Cases of so-called ‘reciprocal altruism’ are sometimes thought to be exceptions to this generalization; but see section 4 below.)
    step1: |-
      利他行为与既利己又利他行为之别的另一标志是：在后一类情形（而非前一类）中，受益者可以属于不同物种，而不改变该行为的演化动力学。事实上，有无数例子表明，一个生物的自利活动会给非同类带来附带好处；这类行为有时称为“互利共生的”，不过该词也并非只有这一种用法（West *et al*. 2007）[^west-2007]。相反，在利他情形中，受益者与施予者是否同种差别巨大；因为若不同种，亲缘选择便无法起作用，而利他行为如何演化也就很不清楚。不出所料，现存世界中几乎所有真正的生物学利他实例，都涉及同种的施予者与接受者。（所谓“互惠利他”的情形有时被视为这一概括的例外；但见下文第 4 节。）
