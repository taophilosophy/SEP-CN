      From a theoretical point of view, the most satisfactory resolution of this ambiguity is to use lifetime fitness as the relevant parameter (cf. West *et al*. 2007)[^west-2007] Thus an action only counts as altruistic if it reduces an organism's lifetime fitness. This stipulation makes sense, since it preserves the key idea that the evolution of altruism requires statistical association between donor and recipient; this would not be true if short-term fitness were used to define altruism, for behaviours which reduce short-term fitness but boost lifetime fitness can evolve with no component of kin selection, or donor-recipient correlation. However, the stipulation has two disadvantages: (i) it makes it harder to tell whether a given behaviour is altruistic, since lifetime fitness is notoriously difficult to estimate; (ii) it has the consequence that most models of ‘reciprocal altruism’ are mis-named.
    step1: |-
      从理论观点看，解决这一歧义最令人满意的方式，是用终生适合度作为相关参数（参 West *et al*. 2007）[^west-2007]。于是，只有降低生物终生适合度的行动才算利他。这一规定讲得通，因为它保留了关键想法：利他演化需要施予者与接受者之间的统计关联；若用短期适合度定义利他，这一点便不成立，因为降低短期适合度却提升终生适合度的行为，可以在没有亲缘选择或施予者—接受者相关成分的情况下演化。然而，这一规定有两个缺点：（i）它使判断某一行为是否利他变得更难，因为终生适合度众所周知难以估计；（ii）它导致多数“互惠利他”模型名不副实。
