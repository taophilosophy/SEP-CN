      Another popular misconception is that kin selection theory is committed to ‘genetic determinism’, the idea that genes rigidly determine or control behaviour. Though some sociobiologists have made incautious remarks to this effect, evolutionary theories of behaviour, including kin selection, are not committed to it. So long as the behaviours in question have a genetical *component*, i.e. are influenced to some extent by one or more genetic factor, then the theories can apply. When Hamilton (1964) talks about a gene which ‘causes’ altruism, this is really shorthand for a gene which increases the probability that its bearer will behave altruistically, to some degree. This is much weaker than saying that the behaviour is genetically ‘determined’, and is quite compatible with the existence of strong environmental influences on the behaviour's expression. Kin selection theory does not deny the truism that all traits are affected by both genes and environment. Nor does it deny that many interesting animal behaviours are transmitted through non-genetical means, such as imitation and social learning (Avital and Jablonka 2000)[^avital-2000].
    step1: |-
      另一种流行误解是，亲缘选择理论承诺“遗传决定论”，即基因严格决定或控制行为。尽管一些社会生物学家曾就此说过不谨慎的话，但包括亲缘选择在内的行为演化理论并不承诺这一点。只要所讨论的行为具有遗传*成分*，即在某种程度上受一个或多个遗传因素影响，这些理论便可适用。当汉密尔顿（1964）谈到“引起”利他的基因时，这其实只是“在某种程度上增加其携带者表现出利他行为概率”的基因的简写。这比说行为由遗传“决定”弱得多，也完全相容于行为表现受强烈环境影响。亲缘选择理论并不否认一切性状都同时受基因与环境影响这一老生常谈；也不否认许多有趣的动物行为通过模仿与社会学习等非遗传方式传递（Avital and Jablonka 2000）[^avital-2000]。
