      Kin selection theory is often presented as a triumph of the ‘gene's-eye view of evolution’, which sees organic evolution as the result of competition among genes for increased representation in the gene-pool, and individual organisms as mere ‘vehicles’ that genes have constructed to aid their propagation (Dawkins 1976, 1982)[^dawkins-1976]. The gene's eye-view is certainly the easiest way of understanding kin selection, and was employed by Hamilton himself in his 1964 papers. Altruism seems anomalous from the individual organism's point of view, but from the gene's point of view it makes good sense. A gene wants to maximize the number of copies of itself that are found in the next generation; one way of doing that is to cause its host organism to behave altruistically towards other bearers of the gene, so long as the costs and benefits satisfy the Hamilton inequality. But interestingly, Hamilton showed that kin selection can also be understood from the organism's point of view. Though an altruistic behaviour which spreads by kin selection reduces the organism's personal fitness (by definition), it increases what Hamilton called the organism's *inclusive* fitness. An organism's inclusive fitness is defined as its personal fitness, plus the sum of its weighted effects on the fitness of every other organism in the population, the weights determined by the coefficient of relationship r. Given this definition, natural selection will act to maximise the inclusive fitness of individuals in the population (Grafen 2006)[^grafen-2006]. Instead of thinking in terms of selfish genes trying to maximize their future representation in the gene-pool, we can think in terms of organisms trying to maximize their inclusive fitness. Most people find the ‘gene's eye’ approach to kin selection heuristically simpler than the inclusive fitness approach, but mathematically they are in fact equivalent (Michod 1982, Frank 1998, Boyd and McIlreath 2006, Grafen 2006)[^boyd-2006][^frank-1998][^grafen-2006][^michod-1982].
    step1: |-
      亲缘选择理论常被呈现为“演化的基因视角”的胜利：这一视角把有机演化看作基因之间为增加在基因库中的代表而竞争的结果，而把个体生物看作基因所建造、用以助其传播的单纯“载体”（Dawkins 1976, 1982）[^dawkins-1976]。基因视角当然是理解亲缘选择最容易的方式，汉密尔顿本人在其 1964 年论文中也采用了它。从个体生物的观点看，利他似乎反常；但从基因的观点看，它完全讲得通。一个基因想最大化自身在下一代中的拷贝数；做到这一点的一种方式，是使其宿主生物对基因的其他携带者表现出利他行为，只要代价与收益满足汉密尔顿不等式。但有趣的是，汉密尔顿表明，亲缘选择也可以从生物的观点理解。通过亲缘选择扩散的利他行为虽按定义降低生物的个人适合度，却增加汉密尔顿所谓的生物*包容*适合度。一个生物的包容适合度定义为：其个人适合度，加上其对种群中每一其他生物适合度的加权效应之和，权重由亲缘系数 r 决定。按此定义，自然选择将作用于最大化种群中个体的包容适合度（Grafen 2006）[^grafen-2006]。我们不必设想自私基因试图最大化其未来在基因库中的代表，而可设想生物试图最大化其包容适合度。多数人觉得“基因视角”进路在启发上比包容适合度进路更简单，但二者在数学上其实等价（Michod 1982, Frank 1998, Boyd and McIlreath 2006, Grafen 2006）[^boyd-2006][^frank-1998][^grafen-2006][^michod-1982]。
