      For reciprocal altruism to work, there is no need for the two individuals to be relatives, nor even to be members of the same species. However, it is necessary that individuals should interact with each more than once, and have the ability to recognize other individuals with whom they have interacted in the past.[^note-1] If individuals interact only once in their lifetimes and never meet again, there is obviously no possibility of return benefit, so there is nothing to be gained by helping another. However, if individuals encounter each other frequently, and are capable of identifying and punishing ‘cheaters’ who have refused to help in the past, then the helping behaviour can evolve. A ‘cheat’ who refuses to help will ultimately sabotage his own interests, for although he does not incur the cost of helping others, he forfeits the return benefits too—others will not help him in the future. This evolutionary mechanism is most likely to work where animals live in relatively small groups, increasing the likelihood of multiple encounters.
    step1: |-
      互惠利他要起作用，两个个体无需是亲属，甚至无需属于同一物种。然而，个体必须不止一次地互动，并且具备识别过去曾与自己互动的其他个体的能力。[^note-1] 若个体一生只互动一次、此后不再相见，显然没有回报收益的可能，帮助他者也就无所得。然而，若个体频繁相遇，且能识别并惩罚过去拒绝帮助的“作弊者”，帮助行为便能演化。拒绝帮助的“作弊者”最终会损害自身利益，因为他虽不承担帮助他人的代价，却也丧失回报收益——将来他人不会帮助他。这种演化机制最可能在动物生活在相对较小群体、从而增加多次相遇可能性的地方起作用。
