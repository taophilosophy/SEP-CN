      The concept of reciprocal altruism is closely related to the Tit-for-Tat strategy in the iterated Prisoner's Dilemma (IPD) from game theory. In the IPD, players interact on multiple occasions, and are able to adjust their behaviour depending on what their opponent has done in previous rounds. There are two possible strategies, co-operate and defect; the payoff matrix (per interaction) is as in section 2.1 above. The fact that the game is iterated rather than one-shot obviously changes the optimal course of action; defecting is no longer necessarily the best option, so long as the probability of subsequent encounters is sufficiently high. In their famous computer tournament in which a large number of strategies were pitted against each other in the IPD, Axelrod and Hamilton (1981) found that the Tit-for-Tat strategy yielded the highest payoff. In Tit-For-Tat, a player follows two basic rules: (i) on the first encounter, cooperate; (ii) on subsequent encounters, do what your opponent did on the previous encounter. The success of Tit-for-Tat was widely taken to confirm the idea that with multiple encounters, natural selection could favour social behaviours that entail a short-term fitness cost. Subsequent work in evolutionary game theory, much of it inspired by Axelrod and Hamilton's ideas, has confirmed that repeated games permit the evolution of social behaviours that cannot evolve in one-shot situations (cf. Nowak 2006)[^nowak-2006]; this is closely related to the so-called 'folk theorem' of repeated game theory in economics (cf. Bowles and Gintis 2011)[^bowles-2011]. For a useful discussion of social behaviour that evolves via reciprocation of benefits, see Sachs *et al*. 2004.
    step1: |-
      互惠利他概念与博弈论中重复囚徒困境（IPD）的“一报还一报”（Tit-for-Tat）策略密切相关。在 IPD 中，玩家多次互动，并能根据对手先前回合的行为调整自己的行为。有两种可能策略：合作与背叛；收益矩阵（每次互动）如上文第 2.1 节。博弈是重复而非单次，显然改变了最优行动路线；只要后续相遇概率足够高，背叛不再必然是最佳选择。在 Axelrod and Hamilton（1981）著名的计算机竞赛中，大量策略在 IPD 中相互对抗，结果“一报还一报”策略收益最高。在“一报还一报”中，玩家遵循两条基本规则：（1）首次相遇时合作；（2）后续相遇时，做对手上一回合所做之事。“一报还一报”的成功被广泛视为证实了这一想法：在多次相遇中，自然选择可以偏爱承担短期适合度代价的社会行为。随后演化博弈论的工作（多受 Axelrod 与 Hamilton 想法启发）已确认，重复博弈容许那些在单次情境中无法演化的社会行为演化（参 Nowak 2006）[^nowak-2006]；这与经济学中重复博弈的所谓“民间定理”密切相关（参 Bowles and Gintis 2011）[^bowles-2011]。关于通过利益互惠而演化的社会行为的有益讨论，见 Sachs *et al*. 2004。
