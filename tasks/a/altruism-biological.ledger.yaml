      If group selection is not the correct explanation for how the altruistic behaviours found in nature evolved, then what is? In the 1960s and 1970s a rival theory emerged: kin selection or ‘inclusive fitness’ theory, due originally to Hamilton (1964). This theory, discussed in detail below, apparently showed how altruistic behaviour could evolve *without* the need for group-level selection, and quickly gained prominence among biologists interested in the evolution of social behaviour; the empirical success of kin selection theory contributed to the demise of the group selection concept. However, the precise relation between kin and group selection is a source of ongoing controversy (see for example the recent exchange in *Nature* between Nowak, Tarnita and Wilson 2010 and Abbot et. al. 2011)[^abbot-2011]. Since the 1990s, proponents of ‘multi-level selection theory’ have resuscitated a form of group-level selection—sometimes called ‘new’ group selection—and shown that it can permit altruism to evolve (cf. Sober and Wilson 1998)[^sober-1998]. But ‘new’ group selection turns out to be mathematically equivalent to kin selection in most if not all cases, as a number of authors have emphasized (Grafen 1984, Frank 1998, West *et al*. 2007, Lehmann *et al*. 2007, Marshall 2011)[^frank-1998][^grafen-1984][^lehmann-2007][^marshall-2011][^west-2007]; this point was already appreciated by Hamilton (1975). Since the relation between ‘old’ and ‘new’ group selection is itself a point of controversy, this explains why disagreement about the relation between kin and group selection should persist.
    step1: |-
      若群体选择不是自然界所见利他行为如何演化的正确解释，那又是什么？1960 与 1970 年代出现了一种竞争理论：亲缘选择或“包容适合度”理论，最初由汉密尔顿（1964）提出。这一理论（详见下文）显然表明，利他行为可以在*无需*群体层次选择的情况下演化，并很快在关心社会行为演化的生物学家中崭露头角；亲缘选择理论的经验成功促成了群体选择概念的衰落。然而，亲缘选择与群体选择的确切关系仍是持续争议之源（例如见 Nowak, Tarnita and Wilson 2010 与 Abbot 等 2011 在《自然》上的近期交锋）[^abbot-2011]。自 1990 年代以来，“多层次选择理论”的倡导者复活了一种群体层次选择——有时称“新”群体选择——并表明它可以容许利他演化（参 Sober and Wilson 1998）[^sober-1998]。但正如若干作者所强调的，“新”群体选择在多数（若非全部）情形中在数学上等价于亲缘选择（Grafen 1984, Frank 1998, West *et al*. 2007, Lehmann *et al*. 2007, Marshall 2011）[^frank-1998][^grafen-1984][^lehmann-2007][^marshall-2011][^west-2007]；这一点汉密尔顿（1975）已经认识到。由于“旧”与“新”群体选择的关系本身就是争议点，这解释了为何关于亲缘选择与群体选择关系的分歧应当持续存在。
