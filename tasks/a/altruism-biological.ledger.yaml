      Sober argues that, even if we accept an evolutionary approach to human behaviour, there is no particular reason to think that evolution would have made humans into egoists rather than psychological altruists (see also Schulz 2011)[^schulz-2011]. On the contrary, it is quite possible that natural selection would have favoured humans who genuinely do care about helping others, i.e., who are capable of ‘real’ or psychological altruism. Suppose there is an evolutionary advantage associated with taking good care of one's children—a quite plausible idea. Then, parents who *really do* care about their childrens' welfare, i.e., who are ‘real’ altruists, will have a higher inclusive fitness, hence spread more of their genes, than parents who only pretend to care, or who do not care. Therefore, evolution may well lead ‘real’ or psychological altruism to evolve. Contrary to what is often thought, an evolutionary approach to human behaviour does *not* imply that humans are likely to be motivated by self-interest alone. One strategy by which ‘selfish genes’ may increase their future representation is by causing humans to be *non*-selfish, in the psychological sense.
    step1: |-
      索伯论证，即便我们接受对人类行为的演化进路，也没有特别理由认为演化会把人类变成利己主义者而非心理利他主义者（另见 Schulz 2011）[^schulz-2011]。相反，自然选择很可能偏爱真正关心帮助他人的人类，即有能力做出“真正”或心理利他的人类。假定好好照料自己的孩子具有演化优势——这是一个相当可信的想法。那么，*真正*关心自己孩子福祉的父母（即“真正”利他者），将比只假装关心或根本不关心的父母有更高的包容适合度，从而传播更多基因。因此，演化很可能导致“真正”或心理利他演化出来。与通常所想相反，对人类行为的演化进路*并不*蕴含人类很可能仅受自利驱动。“自私基因”增加其未来代表的一种策略，正是使人类在心理意义上成为*非*自私者。
