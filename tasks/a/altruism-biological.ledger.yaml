      Do theories of the evolution of biological altruism apply to humans? This is part of the broader question of whether ideas about the evolution of animal behaviour can be extrapolated to humans, a question that fuelled the sociobiology controversy of the 1980s and is still actively debated today (cf. Boyd and Richerson 2006, Bowles and Gintis 2011, Sterelny 2012)[^bowles-2011][^boyd-2006][^sterelny-2012]. All biologists accept that *Homo sapiens* is an evolved species, and thus that general evolutionary principles apply to it. However, human behaviour is obviously influenced by culture to a far greater extent than that of other animals, and is often the product of conscious beliefs and desires (though this does not necessarily mean that genetics has no influence.) Nonetheless, at least some human behaviour does seem to fit the predictions of the evolutionary theories reviewed above. In general, humans behave more altruistically (in the biological sense) towards their close kin than towards non-relatives, e.g. by helping relatives raise their children, just as kin selection theory would predict. It is also true that we tend to help those who have helped us out in the past, just as reciprocal altruism theory would predict. On the other hand, humans are unique in that we co-operate extensively with our non-kin; and more generally, numerous human behaviours seem anomalous from the point of view of biological fitness. Think for example of adoption. Parents who adopt children instead of having their own reduce their biological fitness, obviously, so adoption is an altruistic behaviour. But it does not benefit kin—for parents are generally unrelated to the infants they adopt—and nor do the parents stand to gain much in the form of reciprocal benefits. So although evolutionary considerations can help us understand some human behaviours, they must be applied judiciously.
    step1: |-
      生物学利他演化的理论是否适用于人类？这属于一个更广泛的问题：关于动物行为演化的想法能否外推到人类；这个问题曾助燃 1980 年代的社会生物学争论，至今仍被积极讨论（参 Boyd and Richerson 2006、Bowles and Gintis 2011、Sterelny 2012）[^bowles-2011][^boyd-2006][^sterelny-2012]。所有生物学家都接受*智人*是演化而来的物种，因而一般演化原则适用于它。然而，人类行为显然比其它动物更大程度受文化影响，且往往是自觉信念与欲望的产物（尽管这未必意味着遗传毫无影响）。尽管如此，至少某些人类行为似乎符合上述演化理论的预测。一般说来，人类对近亲比对非亲属更利他（在生物学意义上），例如帮助亲属抚养子女，正如亲缘选择理论所预测。我们也确实倾向于帮助过去帮助过我们的人，正如互惠利他理论所预测。另一方面，人类的独特之处在于我们与非亲属广泛合作；更一般地说，许多人类行为从生物适合度角度看似乎反常。例如收养。收养孩子而非自己生育的父母显然降低其生物适合度，因此收养是利他行为。但它并不利于亲属——因为父母通常与被收养婴儿无亲缘关系——父母也得不到多少互惠收益。因此，尽管演化考虑能帮助我们理解某些人类行为，它们必须被审慎应用。
