      在这个简单模型中，若伙伴间的相关足够强，条件 *W*(*A*) > *W*(*S*) 就可能满足，从而利他得以演化。最容易看出这一点的方式，是假定相关完全，即自私型总是与自私型配对，利他型亦然，于是 P(*S* partner/*S*) = P(*A* partner/*A*) = 1。这一假定蕴含 *W*(*A*)=11 且 *W*(*S*)=5，于是利他演化。在中等程度的相关下，给定上述模型中的特定收益值，条件 *W*(*S*) > *W*(*A*) 也可能满足。
