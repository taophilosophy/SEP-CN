      The importance of kinship for the evolution of altruism is very widely accepted today, on both theoretical and empirical grounds. However, kinship is really only a way of ensuring that altruists and recipients both carry copies of the altruistic gene, which is the fundamental requirement. If altruism is to evolve, it must be the case that the recipients of altruistic actions have a greater than average probability of being altruists themselves. Kin-directed altruism is the most obvious way of satisfying this condition, but there are other possibilities too (Hamilton 1975, Sober and Wilson 1998, Bowles and Gintis 2011, Gardner and West 2011)[^bowles-2011][^hamilton-1975][^sober-1998]. For example, if the gene that causes altruism also causes animals to favour a particular feeding ground (for whatever reason), then the required correlation between donor and recipient may be generated. It is this correlation, however brought about, that is necessary for altruism to evolve. This point was noted by Hamilton himself in the 1970s: he stressed that the coefficient of relationship of his 1964 papers should really be replaced with a more general correlation coefficient, which reflects the probability that altruist and recipient share genes, whether because of kinship or not (Hamilton 1970, 1972, 1975)[^hamilton-1970]. This point is theoretically important, and has not always been recognized; but in practice, kinship remains the most important source of statistical associations between altruists and recipients (Maynard Smith 1998, Okasha 2002, West *et al*. 2007)[^maynard-1998][^okasha-2002][^west-2007].
    step1: |-
      亲缘关系对利他演化的重要性，今天在理论与经验两方面都得到广泛接受。然而，亲缘关系其实只是确保利他者与接受者都携带利他基因拷贝的一种方式，而后者才是根本要求。若利他要演化，利他行为的接受者成为利他者的概率就必须高于平均。亲缘导向的利他是满足这一条件最明显的方式，但也还有其他可能（Hamilton 1975, Sober and Wilson 1998, Bowles and Gintis 2011, Gardner and West 2011）[^bowles-2011][^hamilton-1975][^sober-1998]。例如，若引起利他的基因也（无论何故）使动物偏好某一特定觅食地，那么施予者与接受者之间所需的相关性就可能产生。正是这种相关性——无论由何产生——为利他演化所必需。汉密尔顿本人在 1970 年代指出了这一点：他强调，其 1964 年论文中的亲缘系数其实应替换为更一般的相关系数，以反映利他者与接受者共享基因的概率，无论是否因亲缘关系（Hamilton 1970, 1972, 1975）[^hamilton-1970]。这一点在理论上重要，却未被一贯认识；但在实践中，亲缘关系仍是利他者与接受者之间统计关联最重要的来源（Maynard Smith 1998, Okasha 2002, West *et al*. 2007）[^maynard-1998][^okasha-2002][^west-2007]。
