      Why might a social behaviour reduce an animal's short-term fitness but boost its lifetime fitness? This could arise in cases of ‘directed reciprocation’, where the beneficiary of the behaviour returns the favour at some point in the future (cf. Sachs *et al*. 2004)[^sachs-2004]. By performing the behaviour, and suffering the short-term cost, the animal thus ensures (or raises the chance) that it will receive return benefits in the future. Similarly, in symbioses between members of different species, it may pay an organism to sacrifice resources for the benefit of a symbiont with which it has a long-term relationship, as its long-term welfare may be heavily dependent on the symbiont's welfare.
    step1: |-
      为什么一种社会行为会降低动物的短期适合度，却提升其终生适合度？这可能出现在“定向回报”的情形中：行为的受益者在未来某个时候回报恩惠（参 Sachs *et al*. 2004）[^sachs-2004]。通过表现该行为并承受短期代价，动物从而确保（或提高几率）自己将来获得回报。类似地，在不同物种成员之间的共生关系中，生物可能值得为有长期关系的共生者牺牲资源，因为其长期福祉可能严重依赖共生者的福祉。
