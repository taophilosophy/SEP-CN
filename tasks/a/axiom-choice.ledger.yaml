      | **Dis** | $\forall x[\alpha \vee \beta(x)] \rightarrow \alpha\vee\forall x\beta(x)$（*α* 为任意语句，$\beta(x)$ 为至多以 $x$ 为自由变元的任意公式） |
    step2: |-
