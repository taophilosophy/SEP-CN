      ### 2.2 Further Principles
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      In addition to the Acquaintance Principle, there are two further (related) kinds of principles that those within the debate have most often appealed to. The first kind of principle, the Autonomy Principle, stresses the importance of forming one’s aesthetic judgements in an autonomous manner: “One ought to arrive at one’s aesthetic judgements through the application of one’s own faculties and abilities” (Nguyen 2020a)[^nguyen-2020a]. This is taken (Nguyen 2020a)[^nguyen-2020a] to derive from a related principle, “the Requirement”, introduced by Hopkins (2011) that: “Having the right to an aesthetic belief requires one to grasp the *aesthetic* grounds for it”. Nevertheless, the differences between the Autonomy Principle and the Requirement should not be overlooked. The thought behind the Autonomy Principle is that there is something valuable about autonomous aesthetic engagement such that our aesthetic lives are going well when we endeavour to examine the aesthetic value of an object for ourselves. The thought behind the Requirement is that there is something interesting about aesthetic belief formation which requires the possession of a certain kind of comprehension of the reasons why an aesthetic judgement has been made. The further assumption here is that such comprehension cannot be attained unless we have engaged with the object (or a relevant surrogate) for ourselves.
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Whilst *AP* places demands that we gain direct access to the object of aesthetic judgement, the Requirement demands that we grasp the reasons why an aesthetic judgement has been made, and the Autonomy Principle demands that we at least attempt to grasp the reasons why an aesthetic judgement has been made, *for ourselves*. Of course, these principles are often related since, for example, we might think that firsthand acquaintance of a certain kind is required for grasping reasons in the relevant sense. Still, it is certainly possible to accept one principle while rejecting the others. Another common theme in terms of broader principles involves appeals to aesthetic understanding (Page 2022)[^page-2022], claiming that there would be something problematic, or at least non-ideal, about forming aesthetic beliefs in the absence of understanding. For example, Hills (2022) argues that aesthetic understanding—where this is “factive and requires a grasp of the reasons for” (2022: 26) a judgement that a work has, or lacks, a certain kind of aesthetic value—is required for aesthetic virtue. Again, this can easily be linked with *AP*. Someone could, for example, maintain that direct acquaintance is required for forming aesthetic judgement since it is the only means for acquiring the requisite level of understanding (and it seems even more plausible that “grasping” aesthetic grounds in Hopkins’ sense is going to require understanding). It is, however, by no means guaranteed that a requirement for understanding would entail a requirement for acquaintance (or vice versa). One possible advantage of understanding-based principles is that they allow us—in a way which *AP* does not—to link pessimism in aesthetics with the parallel view in the moral case. While it is implausible to take acquaintance (at least as standardly interpreted) as a requirement for moral judgement, understanding has frequently been touted as just that (Hills 2009; McGrath 2011)[^hills-2009][^mcgrath-2011].
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      Behind this narrow agreement on the importance of understanding, though, there are some deep disagreements about why understanding is so important. And, of course, the pessimist needs more than merely the claim that aesthetic understanding is valuable (either in itself or as a means to attaining some other value quality or state). It is, after all, no part of the optimist’s position that everything valuable in aesthetics can be attained via testimony (we discuss the value of testimony further in §7). As Meskin (2004: 76) acknowledges, even the optimist will allow that “there are things that testimony may never provide—aesthetic experiences and artistic appreciation”. The pessimist must, therefore, also give some account linking the importance of understanding in aesthetics to their claims about the illegitimacy or reliance on testimony.
    step1: TBD
