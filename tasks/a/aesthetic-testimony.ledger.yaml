      Interestingly the basic expressivist approach also appears to fall upon similar hurdles to that facing error theory and relativism (see Meskin 2006)[^meskin-2006]. The pessimist is (see the nuance of §3.1.3) often keen to observe an asymmetry between the epistemic status of someone who has developed an aesthetic judgement on the basis of aesthetic testimony and the status of someone who has first-hand acquaintance with the object (Hopkins 2011)[^hopkins-2011]. Nevertheless, if this crude expressivist is right, there is no asymmetry here, neither testimony nor acquaintance can be used as a source of knowledge (Meskin 2007: 115). When it comes to more sophisticated forms of relativism and expressivism, there have certainly been attempts to link both of these to pessimism (see McGonigal 2006 and Andow 2015 for the former and Scruton 1974; Todd 2004; Franzén 2018; and, arguably, Gorodeisky & Marcus 2018 for the latter)[^andow-2015][^franzén-2018][^gorodeisky-2018][^mcgonigal-2006][^scruton-1974][^todd-2004].
    step1: |-
      有趣的是，基本版表达主义进路似乎也遇到与错误论、相对主义相似的障碍（见 Meskin 2006）[^meskin-2006]。悲观论者（见 §3.1.3 的细微区分）常常热衷于指出这样一种不对称：基于审美证言形成审美判断的人，与对对象有第一手亲知的人，其认知地位并不相同（Hopkins 2011）[^hopkins-2011]。然而，如果这种粗糙表达主义是对的，这里就没有不对称：无论证言还是亲知，都不能用作知识来源（Meskin 2007: 115）。至于更精致的相对主义与表达主义形式，确实有过把它们与悲观论相连的尝试（前者见 McGonigal 2006 与 Andow 2015；后者见 Scruton 1974; Todd 2004; Franzén 2018；以及可谓 Gorodeisky & Marcus 2018）[^andow-2015][^franzén-2018][^gorodeisky-2018][^mcgonigal-2006][^scruton-1974][^todd-2004]。
