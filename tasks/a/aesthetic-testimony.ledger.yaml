      除亲知原则外，争论中的论者最常援引的还有两类（相关的）原则。第一类是自主性原则（the Autonomy Principle），强调以自主方式形成审美判断的重要性：“人应当通过运用自己的官能与能力，形成自己的审美判断”（Nguyen 2020a）[^nguyen-2020a]。据认为（Nguyen 2020a）[^nguyen-2020a]，它派生自 Hopkins（2011）引入的另一条相关原则——“要求”（the Requirement）：“拥有审美信念的权利，要求人把握其*审美*根据”。不过，自主性原则与要求之间的差异不应忽视。自主性原则背后的想法是：自主的审美投入自有其价值；当我们努力亲自审察一个对象的审美价值时，我们的审美生活便进行得良好。要求背后的想法则是：审美信念的形成里有一种耐人寻味的东西——它要求对“一个审美判断为何作出”的理由握有某种理解。这里还进一步假定：除非我们亲自与对象（或某个相关替代物）打过交道，否则这种理解无法获得。
