      ### 4.1 Optimistic Responses to Unavailability Pessimism
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      #### 4.1.1 Anti-Realist Approaches: An Optimistic Response
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Whilst aesthetic error theory and aesthetic relativism can accommodate the pessimistic intuition that aesthetic testimony fails to serve as a means of forming legitimate aesthetic judgement, aesthetic error theory and relativism (or at least relativism of the crude kind which would straightforwardly rule out appeals to aesthetic testimony)—are commonly rejected by those within the aesthetic testimony debate. It is typically accepted that there are aesthetic truths and that these (or at least some significant subset of them) don’t vary in their truth value between speakers. Indeed, it is given these basic assumptions, that theorists typically set for themselves the challenge of accounting for how aesthetic testimony nevertheless seems to have (i) an asymmetrical epistemic status to the testimony of mundane domains and (ii) an asymmetrical epistemic status to first-hand acquaintance with the object (Meskin 2006: 112–113; Hopkins 2011: 141)[^hopkins-2011][^meskin-2006]. Meskin (2006: 113) has also highlighted that the relativist’s approach faces additional difficulties in accounting for why aesthetic testimony may well have an asymmetrical status—in both of the senses mentioned above—in the context of like-minded valuers.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      Interestingly the basic expressivist approach also appears to fall upon similar hurdles to that facing error theory and relativism (see Meskin 2006)[^meskin-2006]. The pessimist is (see the nuance of §3.1.3) often keen to observe an asymmetry between the epistemic status of someone who has developed an aesthetic judgement on the basis of aesthetic testimony and the status of someone who has first-hand acquaintance with the object (Hopkins 2011)[^hopkins-2011]. Nevertheless, if this crude expressivist is right, there is no asymmetry here, neither testimony nor acquaintance can be used as a source of knowledge (Meskin 2007: 115). When it comes to more sophisticated forms of relativism and expressivism, there have certainly been attempts to link both of these to pessimism (see McGonigal 2006 and Andow 2015 for the former and Scruton 1974; Todd 2004; Franzén 2018; and, arguably, Gorodeisky & Marcus 2018 for the latter)[^andow-2015][^franzén-2018][^gorodeisky-2018][^mcgonigal-2006][^scruton-1974][^todd-2004].
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Starting with expressivism, the expressivist can often (using the machinery developed by, e.g., Blackburn 1993)[^blackburn-1993] happily appeal to the key notions of truth, knowledge etc. that their realist counterparts can use. As such, there’s no concern that the pessimist would have to reject aesthetic knowledge in general alongside aesthetic knowledge from testimony. However, the concern for such views (discussed in, e.g., Meskin 2004: 71 and Robson & Sinclair 2023)[^meskin-2004][^robson-2023][^robson-2023-2] is that, once such realist notions are in place, it’s no longer clear that expressivism entails pessimism. We aren’t aware of any optimistic versions of expressivism in the aesthetic case but it’s worth noting that one of the most prominent versions of expressivism in ethics (Gibbard 1992: 174–88)[^gibbard-1992] allows that:
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      > When conditions are right and someone else finds a norm independently credible, I must take that as favoring my own accepting the norm, (Gibbard 1992: 180)[^gibbard-1992]
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      which (given Gibbard’s view of moral judgements as favouring a norm) commits him to an at least somewhat optimistic view. Further Gibbard (1992: 52) seems inclined to paint a similar picture in the aesthetic case. The challenge for the pessimist, then, is to formulate a version of expressivism which follows the realist far enough to give a plausible account of aesthetic truth, argumentation etc. but doesn’t go so far as to also rule in appeals to aesthetic testimony. Of course, even if their favoured version of expressivism doesn’t entail pessimism, then the expressivist might still wish to be a pessimist but they would need some independent reason (of the kind we discuss in §5) for doing so.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      What about relativism? A very similar challenge awaits here. The kind of crude relativism which easily leads to pessimism is, understandably, unpopular with aestheticians. Rather, any plausible form of relativism will have to account for (amongst much else) the widespread level of aesthetic agreement, the importance of aesthetic expertise and our practice of offering reasons for and against aesthetic judgements (for discussion of some contemporary forms of relativism see, e.g., Young 2009 and Goldman 1995; for some historical context see Korsmeyer 1975)[^goldman-1995][^korsmeyer-1975][^young-2009]. Once we have developed relativism this far, though, it isn’t always an easy matter to see why the relativist should be a pessimist. For example, as Meskin (2006: 113) highlights, the sophisticated relativist faces the difficulty of accounting for why aesthetic testimony may well have an asymmetrical status—in both of the senses mentioned above—in the context of like-minded valuers. And even more pessimistic relativists do tend to be rather attenuated in their pessimism; for example, Andow (2015: 217) seems happy to allow that the relativist views he discuss can sometimes enable us to legitimately arrive at aesthetic knowledge via testimony.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      #### 4.1.2 Realist Approaches: An Optimistic Response
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Let’s begin by considering the idea that aesthetic judgement is governed by a distinctive kind of epistemic norm which requires a certain kind of comprehension of the judgement in question—a kind which can only be attained through acquaintance. Budd (2003: 378–8) takes Tanner (2003: 33) to be suggesting a pessimistic argument of this kind but, as Budd (2003: 387–8) points out, it isn’t clear why understanding the claim that “*x* is beautiful” would require the experience of the determinate beauty which *x* possesses rather than just having a reasonable general grasp of the determinable property of beauty (just as understanding “*x* is green” might require our having some experience of greenness but doesn’t require our having experienced *x*’s particular determinate share of greenness). In order to ascribe a quality to something, we typically need basic familiarity with the concept being ascribed to the object of appreciation. We do not need familiarity or an understanding about how the specific quality is realised in the object of appreciation in order to form the belief that the quality is present (Budd 2003: 388)[^budd-2003]. Lord (2018) argues for the importance of being acquainted with a particular determinate aesthetic property but he doesn’t take this to place any limit (let alone an epistemic limit) on the permissibility of our aesthetic judgements. The burden of proof remains on the pessimist to explain why we would need a distinctive kind of comprehension for aesthetic belief formation, and to explain why the standards for knowledge in the aesthetic case are different from those in mundane cases.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
