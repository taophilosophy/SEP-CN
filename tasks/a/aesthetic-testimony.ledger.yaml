    source: |-
      The precise nature of testimony is itself a matter of philosophical controversy and various different accounts have been offered. Elizabeth Fricker (2012: 254) takes testimony to be a very broad matter concerning “tellings generally”, similarly Sosa (1991: 219) describes testimony as a “statement [or expression] of someone”s thoughts or beliefs, which they might direct to the world at large, and to no one in particular’. Other plausible accounts build in the condition that the expression must be communicated with the intention to impart information that has the potential to tell us something new (Lackey 2008: Ch1)[^lackey-2008] and still others build in certain positive epistemic aspects, such as that the testifier has some degree of competence regarding the issue at hand (Coady 1992: 42)[^coady-1992]. In what follows, we will have little to say about these general debates but will focus, as the debate in aesthetics has tended to, on testimony in a very broad sense—aiming to accommodate the basic idea that when one testifies, one makes an assertion to the truth of some proposition.
    step1: |-
      证言的确切性质本身就是哲学争论的对象，已有多种不同的说明。伊丽莎白·弗里克（Elizabeth Fricker）（2012: 254）把证言当作一个非常宽泛的问题，关乎“一般而言的告知”；类似地，Sosa（1991: 219）把证言描述为“对某人的思想或信念的陈述［或表达］，他们可能将其指向整个世界，而不指向任何特定的人”。其他合理的说明则加入条件：该表达必须以传递信息的意图被传达，且该信息有可能告诉我们某些新东西（Lackey 2008: Ch1）[^lackey-2008]；还有一些说明加入了某些积极的认知条件，例如作证者对眼下议题有某种程度的胜任力（Coady 1992: 42）[^coady-1992]。在下文中，我们对这些一般性争论着墨不多，而是像美学中的争论一贯所做的那样，聚焦于非常宽泛意义上的证言——力求容纳这样一个基本观念：当一个人作证时，他就是在断言某个命题为真。
    step2: |-
      证言的确切性质本身就是哲学争论的对象，人们已提出多种不同的说明。伊丽莎白·弗里克（Elizabeth Fricker）（2012: 254）把证言当作一个非常宽泛的问题，关乎“一般而言的告知”；类似地，Sosa（1991: 219）把证言描述为“对某人思想或信念的陈述［或表达］，说话者可能将其指向整个世界，而不指向任何特定的人”。其他合理的说明则附加了这样的条件：这一表达必须以传递信息的意图来传达，且该信息有可能告诉我们一些新东西（Lackey 2008: Ch1）[^lackey-2008]；还有一些说明附加了某些积极的认知要素，例如作证者须对眼下议题具备某种程度的胜任力（Coady 1992: 42）[^coady-1992]。下文对这些一般性争论着墨不多；我们将像美学中的讨论一贯做的那样，聚焦于非常宽泛意义上的证言——力求容纳这样一个基本观念：一个人作证时，就是在断言某个命题为真。
