      The second kind of claim (Wallbank 2021)[^wallbank-2021] holds that the real problem with aesthetic testimony, is not that aesthetic testifiers are typically unreliable, but rather that we don’t know how reliable they are, we don’t have sufficient resources to test this. Standard monitoring techniques aren’t available to us in aesthetics (Nguyen 2020b; see also §1.2 on aesthetic principles of taste)[^nguyen-2020b]. That is not to say that there is no evidence at all available, if testifier *T* makes an aesthetic judgement that “x is beautiful”, and the receiver of testimony *R* also experiences *x* as beautiful, then, *R* will have some direct evidence to support the idea that *T* has expertise (Sibley 1965)[^sibley-1965]. Yet whilst this evidence is available, it does not seem to provide sufficient support for our belief in the competence of the testifier, it only provides sufficient support for the idea that the purported expert has a similar standard of aesthetic taste to oneself, and it is not clear why we should think our faculties of aesthetic taste are accurate. (Irvin 2007 discusses a similar challenge, and possible methods for addressing it, in a different context)[^irvin-2007].
    step1: |-
      第二种主张（Wallbank 2021）[^wallbank-2021]认为：审美证言的真正问题不在于审美证言者通常不可靠，而在于我们不知道他们有多可靠——我们没有足够的资源去检验这一点。在美学中，标准的监测技术对我们并不适用（Nguyen 2020b; 关于审美鉴赏原则，另见 §1.2）[^nguyen-2020b]。这并不是说完全没有任何可用证据：如果证言者 *T* 作出“x 是美的”这一审美判断，而证言接收者 *R* 也经验到 *x* 是美的，那么 *R* 就拥有一些直接证据，支持 *T* 具有专业能力这一想法（Sibley 1965）[^sibley-1965]。然而，尽管有这些可用证据，它似乎并不足以支持我们相信证言者的胜任力；它只足以支持这样一个想法：这位所谓的专家与自己具有相似的审美鉴赏标准；而我们为何应当认为自己的审美鉴赏官能是准确的，并不清楚。（Irvin 2007 在另一语境中讨论了类似的挑战以及应对它的可能方法）[^irvin-2007]。
    step2: |-
