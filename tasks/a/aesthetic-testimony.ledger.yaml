      #### 3.1.2 Realist Approaches
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      If the pessimist wants to accept that there is aesthetic truth, and that testimony can generally be a valuable epistemic resource then one approach available to them is to defend the idea that there is something particular about aesthetic judgement such that it is formed in accordance with non-standard epistemic norms. Two plausible candidates for such a non-standard epistemic norm are the Acquaintance Principle and the Requirement (seen in §2.2). Although the plausibility of their candidacy rests on precisely how these principles are to be understood. They might, for example, reflect an epistemic norm which governs the formation of knowledge, or they might simply reflect a norm of use—such that we can form knowledge in this manner but we should not (Hopkins 2011 places them both in the latter category)[^hopkins-2011]. Alternatively, Lopes (2014) and Shelley (2023) suggest they are a norm of an entirely different kind (we saw in §2.1 that Wollheim himself took *AP* to be at least compatible with an epistemic reading but our concern here is no longer with Wollheim exegesis but with which version of the principle, if any, is correct).
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      One way to develop the Requirement as a concern from unavailability pessimism is to say that the formation of aesthetic judgement requires a sufficient kind of understanding of that which we are invited to accept on the basis of testimony. In order to accept testimony that “*x* is *p*” where *p* represents some aesthetic property or quality requires one to grasp both “*x*” and “*p*”, and more specifically, “*p* as particularly instantiated in *x*”, and that this can only be attained through first-hand acquaintance (see Tanner 2003; Todd 2004)[^tanner-2003][^todd-2004]. One way to develop this approach is to draw upon the idea that aesthetic qualities are dependent upon non-aesthetic qualities, and that there is no sufficient law-like connection between any set of non-aesthetic qualities and the aesthetic qualities (following Sibley 1959, 1965)[^sibley-1959]. On this line, each instance of an aesthetic property, beauty say, is manifested or instantiated in a unique manner. Drawing from this one might hold that we cannot truly comprehend the claim “*x* is beautiful” without having direct, first-hand acquaintance with *x*, and in turn one might insist that one cannot legitimately form an aesthetic judgement or attain aesthetic knowledge without this kind of comprehension.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      #### 3.1.3 “Moderately Optimistic” Approaches.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      There is one final approach that might plausibly qualify as a form of unavailability pessimism, as defined above. The interesting feature of this approach, nevertheless, is that defenders typically label their arguments in terms of “optimism”.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      The distinction between optimism and pessimism was defined roughly in Section 1 as reflecting a divide between those who think we can legitimately form aesthetic judgements on the basis of testimony, and those who think we cannot, respectively (a distinction used in Hopkins 2011; Whiting 2015; and Ransom 2019 amongst others)[^hopkins-2011][^ransom-2019][^whiting-2015]. As we have seen (§3.1.1), this position has often been connected with a seemingly pessimistic claim that aesthetic testimony has an asymmetrical epistemic status to that of mundane testimony. However, it is important that we add some nuance here. There are some self-identifying pessimists who explicitly admit that there are rare cases where we may (legitimately) acquire aesthetic knowledge on the basis of testimony (Hopkins 2011:154; Wollheim 1980: 233)[^hopkins-2011][^wollheim-1980]. Moreover, there are certain self-identifying optimists who will happily endorse the idea that aesthetic testimony has an asymmetrical epistemic status to mundane testimony (and to firsthand aesthetic experience).
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Hopkins (2007: 613; 2011: 139–32) has suggested that we mark the division between pessimism and optimism as follows: pessimists hold that there is a principle or norm which is active in the aesthetic case, but which is not active in the mundane case which thwarts the possibility for aesthetic testimony to serve as a source of legitimate aesthetic judgement while optimists deny this (see Robson 2023: 24–6 for discussion as to why this nuance may not be that helpful.)[^robson-2023][^robson-2023-2] If we were to accept Hopkin’s suggestion, an approach which denies that there are any distinct/non-standard epistemic (or non-epistemic) norms which govern the formation of aesthetic knowledge, but which holds, nevertheless, that aesthetic testimony has an asymmetrical epistemic status to that of mundane testimony is relevantly optimistic. This is an approach which could insist that aesthetic testimony fails (or at least typically fails) to meet the standard conditions to serve as a legitimate source of aesthetic knowledge.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      There are two main positions which take this kind of approach, both argue that the asymmetry between aesthetic and mundane testimony can be accounted for by acknowledging the circumstances surrounding aesthetic practice. The first holds that:
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      **(i)**
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      in assessing the evidence we find that aesthetic testifiers tend to be unreliable.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      The second holds that:
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      **(ii)**
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      as receivers of testimony we struggle to assess first-order evidence available, we experience difficulty in determining the reliability of such evidence, and this in turn may provide us with sufficient reason to doubt that we can justifiably believe the testimony.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      The first kind of claim has been made by Aaron Meskin (2004, 2006). He argues that aesthetic testifiers are more likely than non-aesthetic testifiers to be both insincere (for reasons of snobbery) and incompetent (for reasons of education)—and thus aesthetic testimony is on the whole unreliable (Meskin 2004, 2006)[^meskin-2004]. He argues that aesthetic testimony could, in principle, have the same epistemic standing as the testimony of other domains but he insists that aesthetic testimony on the whole tends to be inferior to the testimony of other domains due to the fact that testifiers are typically unreliable.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      The second kind of claim (Wallbank 2021)[^wallbank-2021] holds that the real problem with aesthetic testimony, is not that aesthetic testifiers are typically unreliable, but rather that we don’t know how reliable they are, we don’t have sufficient resources to test this. Standard monitoring techniques aren’t available to us in aesthetics (Nguyen 2020b; see also §1.2 on aesthetic principles of taste)[^nguyen-2020b]. That is not to say that there is no evidence at all available, if testifier *T* makes an aesthetic judgement that “x is beautiful”, and the receiver of testimony *R* also experiences *x* as beautiful, then, *R* will have some direct evidence to support the idea that *T* has expertise (Sibley 1965)[^sibley-1965]. Yet whilst this evidence is available, it does not seem to provide sufficient support for our belief in the competence of the testifier, it only provides sufficient support for the idea that the purported expert has a similar standard of aesthetic taste to oneself, and it is not clear why we should think our faculties of aesthetic taste are accurate. (Irvin 2007 discusses a similar challenge, and possible methods for addressing it, in a different context)[^irvin-2007].
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
