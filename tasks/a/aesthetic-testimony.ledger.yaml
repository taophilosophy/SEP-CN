      The most common optimistic responses to norms of use are based around the objection which Hopkins himself considers near the start of this discussion (2011: 145). That is, the challenge of defending the view according to which there can be beliefs governed by non-epistemic norms. It is quite common (Simion et al. 2016)[^simion-2016] for epistemic norms (or aims or functions but these, otherwise significant, differences are of little import here) to be taken to constitutively govern beliefs, such that something even partially governed by non-epistemic norms just couldn’t be a belief. Indeed, it is parallel considerations which lead Hills (2015) to consider positing a new kind of mental state (uliefs) when it comes to moral judgements, which she takes to be constitutively governed by understanding (rather than knowledge). Hopkins’ own defence here focuses (2011: 146–8) on arguing that there are familiar examples where we are used to employing non-epistemic norms of belief formation. However, there have been a number of challenges (McKinnon 2017)[^mckinnon-2017] to the claim that these examples really involve any non-epistemic norms.
    step1: |-
      针对使用规范的最常见乐观论回应，基于 Hopkins 本人在讨论开头附近所考虑的反对（2011: 145）。也就是说，挑战在于为这样一种观点辩护：可以存在受非认知规范支配的信念。人们相当普遍地（Simion et al. 2016）[^simion-2016] 认为认知规范（或目标、功能——这些差异虽然重要，但在此无关紧要）构成性地支配信念，以至于任何哪怕部分受非认知规范支配的东西，根本就不能是信念。事实上，正是平行的考虑使 Hills（2015）考虑在道德判断方面设定一种新的心理状态（uliefs），她认为这种状态由理解（而非知识）构成性地支配。Hopkins 本人的辩护（2011: 146–8）则聚焦于论证：有一些我们惯常使用非认知信念形成规范的熟悉例子。然而，对这些例子是否真的涉及任何非认知规范，已有若干质疑（McKinnon 2017）[^mckinnon-2017]。
