      Let’s begin by considering the idea that aesthetic judgement is governed by a distinctive kind of epistemic norm which requires a certain kind of comprehension of the judgement in question—a kind which can only be attained through acquaintance. Budd (2003: 378–8) takes Tanner (2003: 33) to be suggesting a pessimistic argument of this kind but, as Budd (2003: 387–8) points out, it isn’t clear why understanding the claim that “*x* is beautiful” would require the experience of the determinate beauty which *x* possesses rather than just having a reasonable general grasp of the determinable property of beauty (just as understanding “*x* is green” might require our having some experience of greenness but doesn’t require our having experienced *x*’s particular determinate share of greenness). In order to ascribe a quality to something, we typically need basic familiarity with the concept being ascribed to the object of appreciation. We do not need familiarity or an understanding about how the specific quality is realised in the object of appreciation in order to form the belief that the quality is present (Budd 2003: 388)[^budd-2003]. Lord (2018) argues for the importance of being acquainted with a particular determinate aesthetic property but he doesn’t take this to place any limit (let alone an epistemic limit) on the permissibility of our aesthetic judgements. The burden of proof remains on the pessimist to explain why we would need a distinctive kind of comprehension for aesthetic belief formation, and to explain why the standards for knowledge in the aesthetic case are different from those in mundane cases.
    step1: |-
      让我们从这样一个观念开始：审美判断受一种独特的认知规范支配，这种规范要求对相关判断有某种理解——而这种理解只能通过亲知获得。Budd（2003: 378–8）认为 Tanner（2003: 33）提示了这类悲观论论证；但正如 Budd（2003: 387–8）指出的，并不清楚为什么理解“*x* 是美的”这一主张会要求经验到 *x* 所具有的确定之美，而不是仅仅对“美”这一可确定性质有合理的总体把握（正如理解“*x* 是绿的”也许要求我们对绿色有所经验，但不要求我们经验过 *x* 那一特定的确定绿色）。为了把某种性质归于某物，我们通常需要对被赋予该性质的概有基本的熟悉。我们不需要熟悉或理解该特定性质在欣赏对象中如何实现，就能形成“该性质在场”的信念（Budd 2003: 388）[^budd-2003]。Lord（2018）论证亲知某种特定的确定审美性质的重要性，但他不认为这会给我们审美判断的可许性设置任何限制（更不用说认知限制）。举证责任仍在悲观论者一方：解释为什么审美信念的形成需要一种独特的理解，并解释为什么审美情形中的知识标准不同于日常情形。
