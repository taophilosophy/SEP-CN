    kind: body
    source: |-
      ### 5.2 Appeals to Cases
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Probably the most common kind of argument for pessimism involves the appeal to our intuitions concerning cases. For example, Hills (2022: 22) ask us to
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      > Suppose the editor of Sight and Sound gives Evelyn a piece of “pure” aesthetic testimony, e.g., that Citizen Kane is a great film—one of the greatest films of all time. It would be odd for her simply to take his word, to form a confident opinion that it is excellent.
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      (for similar cases see, e.g., Whiting 2015: 91; Hopkins 2011: 138; and Hazlett 2017: 49)[^hazlett-2017][^hopkins-2011][^whiting-2015]. The general idea here being that our intuition that someone does, or would do, something wrong by forming an aesthetic judgement in these cases is best explained by the truth of pessimism. Three kinds of response to such cases are worth considering.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      First, there is the hardnosed approach of simply denying that there is anything problematic about the judgements in question. However, it is rare to see a view of this kind actually defended. This is, perhaps, surprising given that there has recently been considerable scepticism expressed elsewhere about the general practice of philosophers appealing to intuitions concerning particular cases (Weinberg 2007)[^weinberg-2007]. Further, there is empirical evidence (Andow 2019)[^andow-2019] to suggest that the folk are rather more sceptical about both testimony in general, and aesthetic judgement in general, than most philosophers are inclined to think appropriate.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      A second, and far more common, kind of response is to argue that these intuitions can be accommodated within an optimistic framework. Remember that the optimist is not, qua optimist, committed to taking every case of reliance on aesthetic testimony as legitimate. We might, for example, wonder whether, in the case mentioned above, we have quite mundane grounds for thinking that the editor of Sight and Sound is unreliable (or unreliable on topics of this kind or…). More general responses have also been proposed. For example, Robson (2015a) argues that our intuitions about these cases can be accommodated by an optimist who is willing to endorse a certain form of epistemic contextualism. An optimist of this ilk can maintain, roughly, that we don’t count as knowing in these cases but only because of the very same contextual factors which would also produce this result in non-aesthetic cases. Of course, the challenge then becomes explaining why these factors seem to be operative more often in the aesthetic case than elsewhere. A different response of this kind allows that there our intuition in these cases do show some genuine weakness of aesthetic testimony but that this isn’t enough to lead to a full-on endorsement of pessimism. As we saw in §4.2.4, there are a variety of positions (such as Meskin’s 2004 & 2006 unreliability view)[^meskin-2004][^meskin-2006] which admit that significant challenges arise for forming judgements based on aesthetic testimony but which are still routinely classified as optimistic. Classification aside, one concern here is that intuitions about such cases tend to stay fairly stable even when we are explicitly assured about the testifier’s bona fides (as we are in the cases presented by, e.g., Hazlett 2017: 49)[^hazlett-2017].
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      Finally, it has been argued, as we will see in the next section, that these arguments have tended to rely on a very narrow range of cases (Nguyen 2017)[^nguyen-2017] and that a full assessment of the evidence will require widening our diet of cases considerably. And, as we will see, some have argued that such an approach undermines the pessimist’s arguments or even provides a positive reason for endorsing optimism.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      ### 5.3 Arguments from Assertion
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      Another prominent argument for pessimism concerns the (apparent) impermissibility of certain assertions. It seems unremarkable to claim that, e.g., “Lisbon is the capital of Portugal”, “the Korean war started in 1950” or “the bus stop is on Main Street” entirely on the basis of testimony. By contrast, if someone where to assert “Guernica is harrowing” without having experienced the object for themselves, something would seem amiss. As with the kinds of cases discussed above, the thought is typically that these intuitions are best accounted for by appeal to some form of pessimism (Andow 2015: 211–2; Mothersill 1994: 160; and Gorodeisky 2010: 53)[^andow-2015][^gorodeisky-2010][^mothersill-1994]. Indeed, a link to *AP* seems an obvious move here, suggesting that such assertions are problematic in the absence of experience for the simple reason that the beliefs in question would also be problematic.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      As with the cases above, it is open to the optimist to maintain that the assertions in question are unproblematic and that intuitions to the contrary are simply based on misleading folk theories or similar. However, optimists typically concede that aesthetic assertions—or at least aesthetic assertions of a particular kind—are illegitimate on the basis of testimony but try to offer some explanation of this which doesn’t impugn the corresponding judgements. And a number of optimist-friendly explanations have been suggested. Lackey (2011) takes this to be the result of a more general phenomenon which prevents our making “isolated second-hand assertions” in certain cases even though there is no concern with the status of the corresponding belief, Franzén (2018: 681) suggests that aesthetic assertions are “expressive affective states of mind” and Robson (2015b) that assertions of the relevant kind carry a misleading implicature regarding the source of the speaker’s judgements.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Each kind or proposal raises its own concerns though. Lackey proposes a norm of assertion which requires significant revisions of some prominent theories and the non-aesthetic examples she uses to motivate it are far from uncontroversial (see McKinnon 2017)[^mckinnon-2017]. Franzén suggests a semantics which looks to closely match some contemporary expressivist claims but which, as he himself (2018: 680) points out, it is one which doesn’t sit well with other aspects of contemporary expressivist views. Robson proposes that the infelicity results from some kind of implicature but (as discussed in Franzén 2018: 670–1 and Ninan 2014: 297)[^franzén-2018][^ninan-2014] these cases don’t appear to reflect any standard model of implicature or similar phenomena. For example, “it is a characteristic—some would say defining—feature of conversational implicatures that they are cancelable” (2014: 297) but this doesn’t seem to apply here. If I say “Jill has four cars (but I don”t mean to suggest that she has only four)’ I cancel the standard conversational implicature that Jill has exactly four cars. However, explicitly adding “but I haven”t seen it’ to a claim about the beauty of a painting seems to merely highlight, rather than remove, the infelicity.
    step1: TBD
    step2: TBD
