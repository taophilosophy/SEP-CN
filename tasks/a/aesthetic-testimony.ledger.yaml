      There have, of course, been earlier discussions of the legitimacy of testimony (for example in Augustine [*Revisions* I.3]; Locke 1689 [*An Essay Concerning Human Understanding* IV.16]; Reid 1764 [An Inquiry into the Human Mind on the Principles of Common Sense VI.24])[^locke-1689][^reid-1764] as well as of the means by which we form aesthetic judgements (Hume 1757; Hutcheson 1725/26)[^hume-1757][^hutcheson-1725] but Kant appears to have been the first to explicitly rule out testimony as grounds for specifically aesthetic judgement. (Or at least, if there are any relevant historical precursors to this, they have yet to be highlighted within the current literature on the topic.)
    step1: |-
      当然，更早也有关于证言正当性的讨论（例如 Augustine [*Revisions* I.3]；Locke 1689 [*An Essay Concerning Human Understanding* IV.16]；Reid 1764 [An Inquiry into the Human Mind on the Principles of Common Sense VI.24]）[^locke-1689][^reid-1764]，也有关于我们形成审美判断之方式的讨论（Hume 1757; Hutcheson 1725/26）[^hume-1757][^hutcheson-1725]；但康德似乎是把证言明确排除在审美判断之根据以外的第一人。（或者说，即便存在相关的历史先例，它们也尚未在该主题的现有文献中得到强调。）
    step2: |-
      当然，关于证言正当性的更早讨论固然存在（例如 Augustine [*Revisions* I.3]；Locke 1689 [*An Essay Concerning Human Understanding* IV.16]；Reid 1764 [An Inquiry into the Human Mind on the Principles of Common Sense VI.24]）[^locke-1689][^reid-1764]，关于我们形成审美判断之方式的讨论也是如此（Hume 1757; Hutcheson 1725/26）[^hume-1757][^hutcheson-1725]；但康德似乎是第一位明确将证言排除在审美判断之根据以外的人。（或者说，即便存在相关的历史先例，它们也尚未在该主题的现有文献中得到着力强调。）
