      ### 6.1 The Range of Aesthetic Judgements
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      One common line of argument concerns certain kinds of aesthetic judgement where pessimist intuitions seem (at the very least) to be significantly less common. These include judgements of natural beauty (Meskin 2004: 88–9)[^meskin-2004], of the aesthetic status of lost works and performances (Laetz 2008: 355)[^laetz-2008], of mathematical proofs (Meskin 2004: 89–90)[^meskin-2004], and judgements of aesthetic matters which seem to be common knowledge (Levinson 2005: 213)[^levinson-2005]. In all of these cases, it has been suggested that our intuitions favour optimism or, at the very least, favour pessimism considerably less than the standard kind of case (often featuring extant but non-canonical works of art).
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      A first kind of pessimist response denies that (some of) these cases are genuine exceptions. That is because the judgement in question either fail to be legitimate or fail to be aesthetic (or both). The claim that these aren’t genuinely aesthetic judgements seems rather more plausible in some cases than others. There is, for example, already independent debate about whether apparent ascriptions of beauty to mathematical proofs are genuinely aesthetic or, for example, merely metaphorical ways of expressing certain non-aesthetic claims concerning simplicity and the like (for a sceptical discussion of this possibility see Inglis & Aberdein 2015)[^inglis-2015]. Even with cases such as lost works, though (which might seem paradigmatically aesthetic), there are still things which could be said. First, it is open to pessimists to maintain that these claims, while aesthetic, aren’t genuinely aesthetic *judgements*. For example, as we saw in §2 the kind of hybrid view which (Gorodeisky & Marcus 2018)[^gorodeisky-2018] propose, aesthetic judgements are appreciation-like states, rather than belief-like states but our aesthetic assertions still sometimes express beliefs (which they allow can be legitimately formed on the basis of testimony). The challenge for such an approach would be to give a non-ad hoc explanation of why the assertions in these particular domains are exceptional in this way. A second approach is to maintain that the claims involved here are actually elliptical for some non-aesthetic claim. As Blackburn (1998: 60) points out, there are contexts in which it seems that someone’s apparent report of their aesthetic judgement will really be a self-effacing report of what they take, e.g., the general consensus on this matter to be. If this was what was happening in these cases, then this would be no problem for the pessimist as they are not committed to denying that we can legitimately learn *that* others hold certain aesthetic views on the basis of testimony. Further, in some cases at least, it might seem desirable to adopt paraphrases of these kinds. If someone were to maintain that “Cleopatra was the most beautiful woman in the ancient world”, then it would be very natural, and certainly more charitable, to interpret this as something like a report of her reputation, rather than as a serious attempt to make a comparative aesthetic judgement in relation to millions of other, largely entirely unknown, individuals (other cases, such as those involving natural beauty, are harder to motivate though).
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      A second general kind of response stresses that our intuitions about such cases are, of course, compatible with an attenuated version of pessimism. Hopkins (2011: 153–4), for example, mentions that the pessimistic norms he proposes don’t hold come what may but, rather, “lapse” under certain circumstances. And other pessimists might, to similar effect, say that the norms they propose are operative, but not violated in these cases, since they merely make it harder, rather than impossible, to form legitimate aesthetic judgements on the basis of testimony. Still, the optimist might reasonably ask for an explanation as to why the pessimist’s norms lapse with respect to, or otherwise fail to capture, these particular cases.
    step1: TBD
    step2: TBD
