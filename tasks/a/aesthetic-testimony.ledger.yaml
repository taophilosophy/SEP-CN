      While it was rare to see aesthetic testimony given explicit focus in the twentieth century (Scruton 1974 being another notable exception)[^scruton-1974], this has been far from the case in the twenty-first. Following the publication of three highly influential papers in relatively quick succession—Hopkins (2000), Budd (2003), and Meskin (2004)—aesthetic testimony has quickly grown into a prominent area for debate. Something which parallels an increasing focus on testimony within philosophy more generally (Coady 1992; Lackey 2008; Lackey & Sosa 2006; Matilal & Chakrabarti 1994)[^coady-1992][^lackey-2008][^lackey-2006][^matilal-1994] as well as with other putatively exceptional areas such as ethics (Hills 2009)[^hills-2009] and religion (Jay 2016)[^jay-2016].
    step1: |-
      虽然 20 世纪的审美证言很少获得专门关注（Scruton 1974 是另一个值得注意的例外）[^scruton-1974]，21 世纪的情况已截然不同。随着三篇影响深远的论文在较短时间内相继发表——Hopkins（2000）、Budd（2003）与 Meskin（2004）——审美证言迅速成长为重要的争论领域。这一趋势与哲学中更一般地对证言的日益关注相平行（Coady 1992; Lackey 2008; Lackey & Sosa 2006; Matilal & Chakrabarti 1994）[^coady-1992][^lackey-2008][^lackey-2006][^matilal-1994]，也与对其他被认为例外领域的关注相平行，例如伦理学（Hills 2009）[^hills-2009]与宗教（Jay 2016）[^jay-2016]。
