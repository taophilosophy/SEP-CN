      ### 7. The Value of Testimony
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      One final point of consideration worth acknowledging is the possibility that deference to aesthetic testimony could in fact be aesthetically (or otherwise) valuable. Much previous discussion of aesthetic testimony (Meskin 2004: 76; Ransom 2019: 426)[^meskin-2004][^ransom-2019]—from both optimists and pessimists—has highlighted that there is much of value which is lost when we defer to testimony rather than engaging with works themselves (most obviously, aesthetic *appreciation*). However, there might also be under-recognised sources of value here (Wallbank & Robson 2022)[^wallbank-2022]. The literature on trust in testimony has frequently noted that deference to testimony plays a valuable social role. It can serve as a socially bonding experience (Faulkner 2007; Jones 1996)[^faulkner-2007][^jones-1996], and it is often understood as a means of fostering interpersonal relationships and ensuring social cooperation. (Relatedly distrust and non-trust in someone’s testimony can often be seen to serve a socially negative role [Hazlett 2017])[^hazlett-2017]. The idea here is that if *A* were to testify to *B* that *p*, *A* would be inviting *B* to trust that she has done the relevant epistemic work and is sufficiently competent and sincere, such that *B* may simply take *A*’s word for it that *p*. If *B* were to reject this invitation, *A* would arguably have some reason to feel insulted by the implicit discredit to her sincerity or competence. Note also that whilst the literature typically focuses on the fostering of inter-personal relationships, some accounts of trust accommodate the possibility that this socially-bonding experience can occur between an individual and a collective (Wallbank 2021)[^wallbank-2021]. Accordingly, an individual’s trust in a culturally accepted aesthetic judgement—say, that the works of Mozart are magnificent—might then reflect a community-forming experience, group cohesion, and may strengthen a collective sense of identity. Considering this in light of recent work in aesthetics concerning the possibility of an intimate relationship between aesthetic value and social value (Riggle 2022; Cross forthcoming)[^riggle-2022], it is interesting to observe that there is opportunity for researchers to pave the way towards advocating for the idea that deference to aesthetic testimony is not merely aesthetically permissible, and not merely useful as a temporary tool for aesthetic development, but it is in itself aesthetically valuable. (See King 2021 for discussion of nuances concerning the grounding of aesthetic judgement and McShane 2018 for arguments that deference to testimony in ethics can be positively valuable.)[^king-2021][^mcshane-2018]
    step1: TBD
    step2: TBD
