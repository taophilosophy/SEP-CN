      In addition to the Acquaintance Principle, there are two further (related) kinds of principles that those within the debate have most often appealed to. The first kind of principle, the Autonomy Principle, stresses the importance of forming one’s aesthetic judgements in an autonomous manner: “One ought to arrive at one’s aesthetic judgements through the application of one’s own faculties and abilities” (Nguyen 2020a)[^nguyen-2020a]. This is taken (Nguyen 2020a)[^nguyen-2020a] to derive from a related principle, “the Requirement”, introduced by Hopkins (2011) that: “Having the right to an aesthetic belief requires one to grasp the *aesthetic* grounds for it”. Nevertheless, the differences between the Autonomy Principle and the Requirement should not be overlooked. The thought behind the Autonomy Principle is that there is something valuable about autonomous aesthetic engagement such that our aesthetic lives are going well when we endeavour to examine the aesthetic value of an object for ourselves. The thought behind the Requirement is that there is something interesting about aesthetic belief formation which requires the possession of a certain kind of comprehension of the reasons why an aesthetic judgement has been made. The further assumption here is that such comprehension cannot be attained unless we have engaged with the object (or a relevant surrogate) for ourselves.
    step1: |-
      除亲知原则外，争论中的论者最常援引的还有两类（相关的）原则。第一类是自主性原则，强调以自主的方式形成审美判断的重要性：“人应当通过运用自己的官能与能力而形成自己的审美判断”（Nguyen 2020a）[^nguyen-2020a]。这一原则被认为（Nguyen 2020a）[^nguyen-2020a]派生自一个相关的原则——“要求”——由 Hopkins（2011）引入：“拥有审美信念的权利要求人把握其*审美*根据”。不过，自主性原则与要求之间的差异不应忽视。自主性原则背后的想法是：自主的审美投入有其价值；当我们努力亲自审察一个对象的审美价值时，我们的审美生活便进行得良好。要求背后的想法则是：审美信念的形成中有某种耐人寻味的东西——它要求拥有对“一个审美判断为何作出”的理由的某种理解。这里还有一个进一步的假定：除非我们亲自与对象（或某个相关替代物）打过交道，否则这种理解无法获得。
