    source: |-
      Testimony is an important source of knowledge which is used ubiquitously in our daily lives (Coady 1992; Lackey 2008; Lackey & Sosa 2006; Matilal & Chakrabarti 1994; Faulkner 2011; Moran 2018; Wright 2019)[^coady-1992][^faulkner-2011][^lackey-2008][^lackey-2006][^matilal-1994][^moran-2018][^wright-2019]. Given this, it is particularly interesting that—despite the widespread general reliance on testimony—there are influential strands of thought which hold that we ought to avoid such reliance in certain atypical areas. The aesthetic domain has long been held to be one of these atypical areas (for discussion of other putative exception cases see, e.g., Hills 2009; Sliwa 2012; Sweeney 2007; Jay 2016; and Ranalli 2020)[^hills-2009][^jay-2016][^ranalli-2020][^sliwa-2012][^sweeney-2007]. Indeed, ever since Kant’s *Critique of the Power of Judgment* (1790), it has been argued that when we engage with matters of an aesthetic character, first-hand experience of the aesthetic qualities in question is, in some sense, required (Kant 1790; Mothersill 1961; Tormey 1973)[^kant-1790][^mothersill-1961][^tormey-1973]. The central idea is that when determining, for example, whether the painting is harmonious, the dance graceful, or the sunset beautiful, we must experience the aesthetic character of the object of appreciation for ourselves. It simply will not do—though there has been considerably less consensus about *why* it won’t do—for us to rely on testimony.
    step1: |-
      证言是一种重要的知识来源，在我们日常生活中无处不在（Coady 1992; Lackey 2008; Lackey & Sosa 2006; Matilal & Chakrabarti 1994; Faulkner 2011; Moran 2018; Wright 2019）[^coady-1992][^faulkner-2011][^lackey-2008][^lackey-2006][^matilal-1994][^moran-2018][^wright-2019]。有鉴于此，格外耐人寻味的是：尽管人们对证言有普遍的依赖，却有几支有影响的思想路线主张，在某些非典型的领域中我们应当避免这种依赖。审美领域长久以来就被视为这样的非典型领域之一（关于其他被认为的例外领域，例如见 Hills 2009; Sliwa 2012; Sweeney 2007; Jay 2016; and Ranalli 2020）[^hills-2009][^jay-2016][^ranalli-2020][^sliwa-2012][^sweeney-2007]。的确，自康德的《判断力批判》（*Critique of the Power of Judgment*，1790）以来，一直有人主张：当我们处理具有审美性质的事务时，就需要——在某种意义上——对相关审美性质的第一手经验（Kant 1790; Mothersill 1961; Tormey 1973）[^kant-1790][^mothersill-1961][^tormey-1973]。核心观念是：例如在判定一幅画是否和谐、一支舞是否优雅、一场日落是否美丽时，我们必须亲自经验欣赏对象的审美性质。依赖证言是行不通的——尽管对*为什么*行不通，共识要少得多。
    step2: |-
      证言是知识的一个重要来源，在我们的日常生活中无处不在（Coady 1992; Lackey 2008; Lackey & Sosa 2006; Matilal & Chakrabarti 1994; Faulkner 2011; Moran 2018; Wright 2019）[^coady-1992][^faulkner-2011][^lackey-2008][^lackey-2006][^matilal-1994][^moran-2018][^wright-2019]。正因如此，有一点才格外耐人寻味：尽管人们在一般事务上普遍依赖证言，却有几支有影响的思想路线主张，在某些非典型的领域，我们应当避免这种依赖。而审美领域长久以来就被视为这样的非典型领域之一（关于其他被认为的例外领域，例如见 Hills 2009; Sliwa 2012; Sweeney 2007; Jay 2016 与 Ranalli 2020）[^hills-2009][^jay-2016][^ranalli-2020][^sliwa-2012][^sweeney-2007]。的确，自康德的《判断力批判》（*Critique of the Power of Judgment*，1790）以来，就一直有人主张：当我们处理具有审美性质的事务时，在某种意义上需要亲身经验到相关的审美性质（Kant 1790; Mothersill 1961; Tormey 1973）[^kant-1790][^mothersill-1961][^tormey-1973]。核心观念是：例如在判定一幅画是否和谐、一支舞是否优雅、一场日落是否美丽时，我们必须亲自经验欣赏对象的审美性质。依赖证言是行不通的——尽管对于*为什么*行不通，共识要少得多。
