      Whilst *AP* places demands that we gain direct access to the object of aesthetic judgement, the Requirement demands that we grasp the reasons why an aesthetic judgement has been made, and the Autonomy Principle demands that we at least attempt to grasp the reasons why an aesthetic judgement has been made, *for ourselves*. Of course, these principles are often related since, for example, we might think that firsthand acquaintance of a certain kind is required for grasping reasons in the relevant sense. Still, it is certainly possible to accept one principle while rejecting the others. Another common theme in terms of broader principles involves appeals to aesthetic understanding (Page 2022)[^page-2022], claiming that there would be something problematic, or at least non-ideal, about forming aesthetic beliefs in the absence of understanding. For example, Hills (2022) argues that aesthetic understanding—where this is “factive and requires a grasp of the reasons for” (2022: 26) a judgement that a work has, or lacks, a certain kind of aesthetic value—is required for aesthetic virtue. Again, this can easily be linked with *AP*. Someone could, for example, maintain that direct acquaintance is required for forming aesthetic judgement since it is the only means for acquiring the requisite level of understanding (and it seems even more plausible that “grasping” aesthetic grounds in Hopkins’ sense is going to require understanding). It is, however, by no means guaranteed that a requirement for understanding would entail a requirement for acquaintance (or vice versa). One possible advantage of understanding-based principles is that they allow us—in a way which *AP* does not—to link pessimism in aesthetics with the parallel view in the moral case. While it is implausible to take acquaintance (at least as standardly interpreted) as a requirement for moral judgement, understanding has frequently been touted as just that (Hills 2009; McGrath 2011)[^hills-2009][^mcgrath-2011].
    step1: |-
      *AP* 要求我们直接接触审美判断的对象；要求则要求我们把握审美判断何以作出的理由；自主性原则则要求我们至少*亲自*尝试把握这些理由。当然，这些原则常常相关：例如，我们可能认为，要在相关意义上把握理由，需要某种第一手亲知。尽管如此，接受一条原则而拒斥其余，完全可能。在更宽泛原则方面，另一个常见主题是诉诸审美理解（Page 2022）[^page-2022]，主张在缺乏理解的情况下形成审美信念，会有某种问题，或至少不理想。例如，Hills（2022）主张，审美理解——其中理解是“事实性的，且要求把握理由”（2022: 26），即理解一件作品具有或缺乏某种审美价值的判断——是审美德性所必需的。这同样容易与 *AP* 相连。例如，有人可以主张：形成审美判断需要直接亲知，因为这是获得所需理解水平的唯一途径（而按 Hopkins 的意义“把握”审美根据更需要理解，这一点似乎更加可信）。然而，理解的要求并不必然蕴含亲知的要求（反之亦然）。基于理解的原则有一个可能的优点：它们允许我们——以 *AP* 所不允许的方式——把美学中的悲观论与道德领域的平行观点相连。把亲知（至少按标准解读）当作道德判断的要求难以成立，而理解却常被鼓吹为恰恰如此（Hills 2009; McGrath 2011）[^hills-2009][^mcgrath-2011]。
