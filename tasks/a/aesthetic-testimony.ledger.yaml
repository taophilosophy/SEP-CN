      ### 2.1 The Acquaintance Principle
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      By far the most commonly appealed to principle here is Richard Wollheim’s (1980: 233) acquaintance principle (*AP*), according to which
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      > judgements of aesthetic value, unlike judgements of moral knowledge, must be based on first-hand experience of their objects and are not, except within very narrow limits, transmissible from one person to another.
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      A principle which (at least modulo the tantalising mention of “very narrow limits”) appears to doubly rule out appeal to aesthetic testimony, since testimony cannot provide us with first hand acquaintance and clearly requires some kind of interpersonal transmission.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      Appeals to *AP* as an explanation for pessimism are, however, fraught for two reasons. First, Wollheim’s principle, and his subsequent discussion of it, are sometimes rather difficult to interpret. Second, there are those who hold that *AP* itself is false. These two issues are, of course, related and it is common for both advocates and detractors of *AP* to argue that various interpretations of the principle clearly render it either trivial or implausible (Hopkins 2006; Budd 2003; Ransom 2019; Lord 2018)[^budd-2003][^hopkins-2006][^lord-2018][^ransom-2019]. For example, it seems clear that a requirement that we must always engage with the work itself in order to make any aesthetic judgement of it is implausibly demanding and that a suitably accurate reproduction or sufficiently detailed photograph would allow for *some* aesthetic insight in many cases. Where these theorists differ is whether there are any versions of the principle which aren’t benighted in this way. And there have been further concerns about *AP*’s ability to handle certain kinds of art works such as conceptual art (for a discussion of these and some responses see Hanson (2015)). Some, such as Livingston (2003) take these concerns to undermine the prospects for any version of *AP* which is both true and non-trivial but others are more hopeful. Lord (2018), for example, has suggested that we should think about acquaintance not with a particular artwork but, rather, with some particular highly determinate aesthetic property which the object instantiates. Acquaintance with this property doesn’t, strictly, require acquaintance with the work itself but, rather, allows for acquaintance with reproductions or photographs. However, a principle of this kind would still rule out forming our aesthetic judgements on the basis of induction or testimony. Regardless of how we interpret the scope of the principle, though, there remains the question of how the “must” should be interpreted here. On some accounts, the demand is interpreted as an epistemic one, with acquaintance being a prerequisite for aesthetic knowledge (Pettit 1983; Budd 2003)[^budd-2003][^pettit-1983], but—as we will see in §3.2—even amongst pessimists there has been an increasing move towards interpreting the demand as relating to some manner of non-epistemic norm (Hopkins 2006)[^hopkins-2006].
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      More recently, though, debate has arisen as to whether *AP* should even be interpreted as supporting a (non-trivial) version of pessimism. Lopes (2014: 170), has claimed that “the controversy over the acquaintance principle ensues from an incorrect interpretation of it”. Many philosophers interpret “aesthetic judgement” as referring to some belief-like state—which might fail to meet some norm, epistemic or otherwise. According to Lopes “aesthetic judgement” should rather be interpreted as a certain kind of experiential / appreciative state which, by its very nature, cannot be entered into on the basis of, say, testimony. (Shelley 2023 offers a rather different, but equally revisionary, interpretation of *AP*.)[^shelley-2023] Such exegetical moves certainly have precedent, consider the case of Frank Sibley. A number of discussions of aesthetic testimony (such as Gorodeisky [2010: 58–9], Laetz [2008: 356], and Meskin [2006: 111]) have taken Sibley to be endorsing some form of pessimism in his famous (1965: 137) claim that
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      > To suppose indeed that one can make aesthetic judgments without aesthetic perception … is to misunderstand aesthetic judgment. (alongside similar remarks in, e.g., Sibley 1959: 424–6 and 1974: 16)[^sibley-1959][^sibley-1974]
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      This interpretation is, however, controversial and it has been suggested (by, e.g., Livingston [2003: 268] and Lopes himself [2014: 174]) that Sibley is merely making a certain kind of stipulation and isn’t intending to endorse any kind of substantive pessimistic thesis. However, it seems difficult to regard Lopes’ proposals for a version of *AP*—regardless of what other merits they might have—as providing an accurate exegesis of Wollheim’s views. (Something similar also applies to Shelley’s (2023: 405) interpretation, but he clarifies that he isn’t particularly concerned with whether his interpretation of *AP* matches Wollheim’s own understanding and he does not suggest that others are making exegetical errors.) As Wallbank and Robson (2022: 42–4) point out, a number of Wollheim’s own remarks (1980: 231–2) make it clear that he is open to considering a number of different interpretations of *AP*, at least one of which is clearly epistemic in nature.
    step1: TBD
