      With this notion of testimony in mind, the central controversy we will focus on concerns the suggestion that we should not defer to testimony in aesthetics. Deferential responses to pure testimony require accepting the invitation to form a judgement that *p* on the basis of the testifier’s testimony, even though the testifier has not added any supporting reasons for this judgement—and require one to do so without attempting to further verify the matter for oneself. Non-deferential responses are typically understood to be ones in which we, e.g., suspend judgement (Hopkins 2001: 167–169)[^hopkins-2001] on the matter and actively respond to the matter in question, using testimony as a prompt to investigate and try to form the judgements for ourselves (a less charitable interlocutor might simply disregard the testimony entirely but this isn’t required for being non-deferential in the relevant sense). One might still qualify as deferring if, when forming the judgement that p, one consults wider information about the testifier’s general competence and sincerity—one might, for example, take into consideration the testifier’s general track-record in the aesthetic domain, or consult any available information about the testifier’s tendency to lie for social gain—just so long as one does not attempt to specifically verify for oneself whether or not *p* is true. Those who take a negative view of deference to testimony in aesthetics will typically also—as we will see in §1.2 below—be sceptical of the role of other methods (such as inductive inference) other than first-person judgement in establishing aesthetic claims. However, we don’t take this to be definitive of the position itself.
    step1: |-
      带着这一证言观念，我们将聚焦的核心争议关乎这样一种主张：在美学中我们不应顺从证言。对纯粹证言的顺从性回应要求接受这一邀请，即基于作证者的证言形成“*p*”的判断——尽管作证者没有为这一判断添加任何支持性理由——并且要求人们这样做时不试图亲自进一步核实此事。非顺从性回应通常被理解为：例如，就此悬置判断（Hopkins 2001: 167–169）[^hopkins-2001]，并主动回应该问题，把证言当作调查的提示，尝试自己形成判断（一个不那么宽容的对话者可能干脆全然无视证言，但这对相关意义上的非顺从性并非必需）。如果一个人在形成“p”的判断时，查阅了关于作证者一般胜任力与真诚性的更广信息，他可能仍算作顺从——例如，他可以把作证者在审美领域的一般履历考虑在内，或查阅任何关于作证者为社会利益而撒谎倾向的现有信息——只要他不试图特别地亲自核实 *p* 是否为真。对美学中顺从证言持否定看法的人，通常也会——正如下文 §1.2 将看到的——对除第一人称判断之外的其他方法（如归纳推理）在确立审美主张中的作用持怀疑态度。然而，我们不认为这一点是该立场的定义性特征。
    step2: |-
      带着这一证言观念，我们将聚焦的核心争议关乎这样一种主张：在美学中，我们不应顺从证言。对纯粹证言的顺从性回应，要求接受作证者的邀请、基于其证言形成“*p*”这一判断——尽管作证者并未为该判断补充任何支持性理由——并且要求人们不试图亲自进一步核实此事。非顺从性回应通常被理解为：就此悬置判断（Hopkins 2001: 167–169）[^hopkins-2001]，同时主动处理手头的问题，把证言当作提示，去调查并尝试亲自形成判断（一个不那么宽容的对话者也许干脆完全无视证言，但在相关意义上做到非顺从并不要求这一点）。即使一个人在形成“p”的判断时查阅了关于作证者一般胜任力与真诚性的更广信息，他可能仍算作在顺从：例如，他可以把作证者在审美领域的一般履历考虑在内，或者查阅作证者有无为社会利益而撒谎的现成信息——只要他不专门去亲自核实 *p* 是否为真。对美学中顺从证言持否定看法的人，通常也会对第一人称判断之外的其他方法（例如归纳推理）在确立审美主张上的作用持怀疑态度——正如下文 §1.2 将要说明的。不过，我们不认为这一点是这一立场的定义性特征。
