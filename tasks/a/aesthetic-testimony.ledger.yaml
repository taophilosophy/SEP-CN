      #### 4.1.3 “Moderately Optimistic Approaches”: A (More) Optimistic Response
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The primary difficulty facing accounts which insist on (i)—the unreliability of aesthetic testifiers—is the difficulty we face in verifying this claim (see §3.1.3). The primary difficulty facing accounts which insist on (ii)—the absence of viable information to identify the reliability of aesthetic testifiers—is the difficulty we face in maintaining the possibility of aesthetic knowledge through other means. As noted by Hopkins (2011: 141) it is difficult for the latter kind of accounts to proceed without mandating agnosticism. Upon this account there seems to be no real epistemic asymmetry between aesthetic testimony and one’s first-hand perception (particularly since recent discussion (see, e.g., Irvin 2014 and Lopes 2014)[^irvin-2014][^lopes-2014] has provided a number of challenges to our reliability at judging our own aesthetic competence).
    step1: TBD
    step2: TBD
