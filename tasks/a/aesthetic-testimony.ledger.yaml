      这（鉴于 Gibbard 把道德判断看作支持规范的观点）使他承诺一种至少某种程度上的乐观论观点。此外，Gibbard（1992: 52）似乎倾向在审美情形中描绘相似的图景。于是，悲观论者的挑战是：构想出一种表达主义版本，它跟随实在论足够远，以致能给出关于审美真理、论证等等的合理说明，但不至于远到也把诉诸审美证言纳入其中。当然，即便他们所偏好的表达主义版本不蕴含悲观论，表达主义者也许仍想当悲观论者；但他们需要为此找一些独立的理由（即我们在 §5 讨论的那类理由）。
