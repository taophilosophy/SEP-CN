      First, as highlighted by, e.g., Gorodeisky and Marcus (2018: 135–7) participants in this debate don’t typically take themselves to just be arbitrarily stipulating a usage of “aesthetic judgement” but, rather, to be picking out a certain kind of mental state which our aesthetic talk typically tracks. The substantive debate, then, will often concern whether we can legitimately form these states on the basis of testimony. Robson (2023: 16–8) maintains that these states are something like beliefs, Todd (2004) takes them to be appreciative states and Gorodeisky and Marcus (2018) opt for a hybrid view where these correlates are typical appreciative states but, in some non-standard cases, are beliefs (Briesen [forthcoming] defends a very different kind of hybrid view). Second, while it is clear why reliance on testimony would be ruled out on the second understanding of “aesthetic judgement”, it is far from a trivial matter to determine that testimony is a legitimate means for forming judgements in the first sense (Robson 2017 argues that optimism is entailed by treating aesthetic judgements as beliefs but this is controversial)[^robson-2017]. On the contrary, some pessimists have explicitly endorsed the first interpretation.
    step1: |-
      第一，正如（例如）Gorodeisky 与 Marcus（2018: 135–7）所强调的，这场争论的参与者通常并不认为自己只是在任意约定“审美判断”的用法，而是在挑出我们的审美谈论通常所追踪的某种心理状态。于是，实质性的争论往往关乎：我们能否基于证言正当地形成这些状态。Robson（2023: 16–8）坚持这些状态类似于信念；Todd（2004）认为它们是欣赏性状态；Gorodeisky 与 Marcus（2018）则选择一种混合观点：这些对应物通常是欣赏性状态，但在某些非标准情形中是信念（Briesen［即将出版］捍卫一种非常不同的混合观点）。第二，虽然按第二种“审美判断”理解，依赖证言为何被排除是清楚的，但要确定证言是第一种意义上形成判断的正当手段，却远非琐事（Robson 2017 论证：把审美判断当作信念就蕴含乐观论，但这有争议）[^robson-2017]。相反，一些悲观论者明确认可第一种解读。
