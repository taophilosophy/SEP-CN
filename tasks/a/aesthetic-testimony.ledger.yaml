      One of the most influential attempts to give a non-epistemic (but still cognitive) version of pessimism is Hopkins’ (2011) appeal to what he terms “norms of use”. Roughly speaking, these are norms which determine whether it’s permissible to form a belief on a particular subject but which don’t concern whether the belief in question would count as knowledge. In Hopkins’ view, testimony can often make aesthetic knowledge available to us but some further norm (or norms) of belief still makes it impermissible to form a belief on this basis. Hopkins doesn’t take any clear position on what norm this might be but considers some possibilities including a non-epistemic version of *AP* (Hopkins 2011: 150)[^hopkins-2011] and the other possibilities for the unusability pessimist we look at below could also be taken as ways to fill in this gap (though, as we will see, some of these make rather weaker claims than Hopkins’ contention that the beliefs in question would be impermissible).
    step1: |-
      霍普金斯（Hopkins）（2011）诉诸他所称的“使用规范”，是给出悲观论之非认知（但仍属认知性）版本的最有影响的尝试之一。粗略地说，这些规范决定在某个主题上形成信念是否许可，但不关心该信念是否算作知识。在霍普金斯看来，证言常常能使审美知识为我们所用，但某种（或某些）进一步的信念规范仍使以此为基础形成信念成为不许可。霍普金斯没有明确表态这条规范究竟是什么，但考虑了一些可能，包括 *AP* 的非认知版本（Hopkins 2011: 150）[^hopkins-2011]；我们下文考察的不可用悲观论者的其他可能，也可以视为填补这一空缺的方式（不过，正如我们将看到的，其中一些主张比霍普金斯“相关信念不许可”的论断要弱得多）。
    step2: |-
      霍普金斯（Hopkins）（2011）诉诸他所称的“使用规范”（norms of use），这是给出悲观论之非认知（但仍属认知性）版本的最有影响的尝试之一。粗略地说，使用规范决定在某个主题上形成信念是否许可，却不追问该信念是否算作知识。在霍普金斯看来，证言常常能使审美知识为我们所用，但某种（或某些）进一步的信念规范仍使以此为基础形成信念成为不许可。霍普金斯没有明确表态这条规范究竟是什么，但考虑了一些可能，包括 *AP* 的非认知版本（Hopkins 2011: 150）[^hopkins-2011]；我们下文考察的不可用悲观论者的其他可能，也可以视为填补这一空缺的方式（不过，正如我们将看到的，其中一些主张比霍普金斯“相关信念不许可”的论断要弱得多）。
