      There are three notable ways in which one might launch an Anti-Realist form of Unavailability Pessimism in line with (a) (see Meskin 2006; Hopkins 2011)[^hopkins-2011][^meskin-2006]. One might adopt an aesthetic error theory and hold that all aesthetic claims are systematically false. One might adopt aesthetic relativism and accept that there is aesthetic truth, but the truth would here be relative to some set of people. Alternatively one might adopt aesthetic expressivism and hold that aesthetic claims express some non-cognitive state (typically captured as pro- or con-attitudes) to the object in question..
    step1: |-
      依循 (a)，人们可以用三种值得注意的方式发起反实在论形式的不可得悲观论（见 Meskin 2006; Hopkins 2011）[^hopkins-2011][^meskin-2006]。其一，采纳审美错误论，主张一切审美主张都系统地虚假。其二，采纳审美相对主义，承认存在审美真理，但这里的真理将相对于某一人群。又或者，采纳审美表达主义，主张审美主张表达对相关对象的某种非认知状态（通常被刻画为赞成或反对的态度）。
