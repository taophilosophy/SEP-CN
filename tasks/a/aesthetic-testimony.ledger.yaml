    source: |-
      One thing that has become increasingly clear in recent years (Andow 2019: 33)[^andow-2019] is that it is surprisingly difficult to specify precisely what claim the pessimist is making (and the optimist denying). We initially formulated pessimism as something like the claim that we cannot legitimately form aesthetic judgements on the basis of testimony. At least three elements of this claim need to be clarified though. First, what do we mean by “aesthetic judgement”? Second, why is it that we cannot form legitimate aesthetic judgements in this way? Third, how strictly should we interpret the “cannot” here? We will see below that it is surprisingly rare for a pessimist to maintain that we can *never* form a legitimate aesthetic judgement on the basis of testimony, what about the first two questions though?
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      In terms of the nature of aesthetic judgement, there is a clear general divide between two camps. The first takes aesthetic judgement to be belief, either in a narrow cognitivist sense (Hopkins 2006, 2011; Whiting 2015)[^hopkins-2006][^whiting-2015] or a broader sense which allows for certain expressivist or quasi-realist equivalents (Robson 2023: 16–8)[^robson-2023][^robson-2023-2]. The second takes the term “judgement” to capture something like a state of appreciation. Understood in terms of appreciation the debate is largely resolved as a matter of definition and no optimist would want to maintain that we can, say, achieve a state of appreciation—typically understood as something like experiencing the qualities of a thing’ in such a way as to find them “worthy or valuable” (Dickie 1974: 40)—on the basis of testimony alone (Konigsberg 2012 is an apparent exception but this is only because he understands “testimony” much more broadly than the kind of pure testimony we’re focusing on)[^konigsberg-2012]. It might easily seem that, as we have already seen Lopes (2014) suggest with regards to *AP*, the participants in this debate might merely be talking past each other, with optimists maintaining that we can legitimately form aesthetic beliefs on the basis of testimony and pessimists denying that we can legitimately appreciate aesthetic qualities on that basis. However, while we don’t deny that there might be some level of misunderstanding within these debates, we think that this irenic approach is mistaken for two reasons.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      First, as highlighted by, e.g., Gorodeisky and Marcus (2018: 135–7) participants in this debate don’t typically take themselves to just be arbitrarily stipulating a usage of “aesthetic judgement” but, rather, to be picking out a certain kind of mental state which our aesthetic talk typically tracks. The substantive debate, then, will often concern whether we can legitimately form these states on the basis of testimony. Robson (2023: 16–8) maintains that these states are something like beliefs, Todd (2004) takes them to be appreciative states and Gorodeisky and Marcus (2018) opt for a hybrid view where these correlates are typical appreciative states but, in some non-standard cases, are beliefs (Briesen [forthcoming] defends a very different kind of hybrid view). Second, while it is clear why reliance on testimony would be ruled out on the second understanding of “aesthetic judgement”, it is far from a trivial matter to determine that testimony is a legitimate means for forming judgements in the first sense (Robson 2017 argues that optimism is entailed by treating aesthetic judgements as beliefs but this is controversial)[^robson-2017]. On the contrary, some pessimists have explicitly endorsed the first interpretation.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      Pessimists employing this understanding of “aesthetic judgement” have raised various objections against deference to aesthetic testimony, following (Hopkins 2011)[^hopkins-2011] these lines of resistance have typically been divided into two broad camps: “unavailability pessimism” and “unusability pessimism”. Unavailability pessimists hold that aesthetic testimony simply fails to meet the epistemic conditions that govern the formation of legitimate aesthetic judgements, such that aesthetic testimony fails to serve as a source of knowledge. Unusability pessimists, by contrast, hold that aesthetic testimony may well yield aesthetic knowledge but, nevertheless, there is a further non-epistemic norm which prevents us from using aesthetic testimony as a legitimate resource for forming such knowledge. Many theorists take there to be an intuitive asymmetry between the status of mundane testimony (that is, roughly, testimony about ordinary matters where those who are not inclined towards any general testimonial scepticism typically agree that testimony is unproblematic) and aesthetic testimony. Further, as we have seen, these theorists also typically take there to be a related intuitive asymmetry between the status of first-hand and second-hand sources of aesthetic judgement. Unusability pessimists take their further norm to explain these asymmetries. (For more on the viability of an appeal to such intuitions see §5.2.)
    step1: TBD
    step2: TBD
