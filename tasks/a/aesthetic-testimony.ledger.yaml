      ## 5. Arguments for Pessimism
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      In the earliest writing on aesthetic testimony, there was a notable paucity of arguments for pessimism. Kant’s mention of testimony quickly moves on to discussion of the illegitimacy of inferring aesthetic judgements from general principles, and he seems to focus the positive arguments he offers entirely on the latter. Similarly, Wollheim (1980: 233) seems to take *AP*, and by extension pessimism, to be (something close to) a truism which needs to be accommodated by any view of the aesthetic, rather than a controversial thesis in need of defence (similar things occur in, e.g., Tormey 1973: 39 and Pettit 1983: 25)[^pettit-1983][^tormey-1973]. Given the range of recent defences of optimism, though, the need for pessimists to argue for their view has become rather more salient of late.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      ### 5.1 Reluctance to form aesthetic judgements
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      One (often tacit) argument in support of pessimism is our tendency to avoid forming—or at least being reluctant to form—aesthetic judgements on the basis of testimony. If, as Kant (1790: Part I, Div. 1, §33 [1914: 157]), and Nguyen (2020a: 1128) suggest, we are less willing to form aesthetic judgements on the basis of testimony (when compared to forming mundane judgements on that basis or aesthetic judgements on the basis of first-hand experience), then this stands in need of explanation. And, we might suggest, a tacit folk acceptance of pessimism is the best explanation (for discussion of empirical work on “folk” views of aesthetic testimony see, e.g., Andow 2019 and Cova, Garcia, & Liao 2015: 931–2)[^andow-2019]. There are a number of possible responses here. First, Meskin (2004: 81) suggests that we might equally well explain these facts not by appeal to pessimism but to a mistaken folk belief which is taken to entail pessimism. There are certain apparent folk beliefs—such as Meskin’s example of the endorsement of certain crude forms of aesthetic relativism—which would seem to legitimise pessimism but which are almost universally rejected by philosophically minded aestheticians. A different approach is suggested by Robson (2014: 2517–24) who questions whether the required explanandum is even genuine, suggesting that we are typically poor judges of the sources of our own (aesthetic) judgements and that there is empirical evidence to suggest that we form aesthetic beliefs on the basis of testimony rather more than we’re inclined to think.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
