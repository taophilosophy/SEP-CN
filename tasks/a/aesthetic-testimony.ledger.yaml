      Hopkins (2007: 613; 2011: 139–32) has suggested that we mark the division between pessimism and optimism as follows: pessimists hold that there is a principle or norm which is active in the aesthetic case, but which is not active in the mundane case which thwarts the possibility for aesthetic testimony to serve as a source of legitimate aesthetic judgement while optimists deny this (see Robson 2023: 24–6 for discussion as to why this nuance may not be that helpful.)[^robson-2023][^robson-2023-2] If we were to accept Hopkin’s suggestion, an approach which denies that there are any distinct/non-standard epistemic (or non-epistemic) norms which govern the formation of aesthetic knowledge, but which holds, nevertheless, that aesthetic testimony has an asymmetrical epistemic status to that of mundane testimony is relevantly optimistic. This is an approach which could insist that aesthetic testimony fails (or at least typically fails) to meet the standard conditions to serve as a legitimate source of aesthetic knowledge.
    step1: |-
      Hopkins（2007: 613; 2011: 139–32）建议我们这样划分悲观论与乐观论：悲观论者认为，有一条原则或规范在审美情形中起作用、在日常情形中不起作用，它阻断了审美证言充当正当审美判断之来源的可能；乐观论者则否认这一点（关于这一细微区分为何可能不那么有用，见 Robson 2023: 24–6 的讨论）[^robson-2023][^robson-2023-2]。如果我们接受 Hopkins 的建议，那么这样一种进路在相关意义上就是乐观的：它否认有任何独特的／非标准的认知（或非认知）规范支配审美知识的形成，但又认为审美证言的认知地位与日常证言不对称。这种进路可以坚持：审美证言不能（或至少通常不能）满足充当审美知识正当来源的标准条件。
