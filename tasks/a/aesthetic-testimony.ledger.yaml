      There are three notable ways in which one might launch an Anti-Realist form of Unavailability Pessimism in line with (a) (see Meskin 2006; Hopkins 2011)[^hopkins-2011][^meskin-2006]. One might adopt an aesthetic error theory and hold that all aesthetic claims are systematically false. One might adopt aesthetic relativism and accept that there is aesthetic truth, but the truth would here be relative to some set of people. Alternatively one might adopt aesthetic expressivism and hold that aesthetic claims express some non-cognitive state (typically captured as pro- or con-attitudes) to the object in question..
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      The appeal of approaches aesthetic error theory to those who doubt the value of aesthetic testimony is clear, we can expect aesthetic testimony to have no epistemic value if aesthetic claims are incapable of being true. However, this position would equally entail that there can’t be true aesthetic claims on the basis of firsthand experience. As such, while it would meet the letter of how pessimism is often articulated, it would fail to capture a key asymmetry, between firsthand and second-hand aesthetic judgements, which most pessimists clearly take themselves to be committed to (see Meskin 2006)[^meskin-2006].
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      An appeal to aesthetic relativism initially seems better able to capture the asymmetry since the obvious concerns with accepting testimony—about whether we, say, share a similar standard of judgement to the testifier—don’t apply in the case of firsthand judgement. Further, (as shall be explored in §5.1) it is possible that a generally held lay-person assumption of relativism may account for why aesthetic testimony is often intuitively assumed to be of little epistemic value. However, when it comes to more sophisticated forms of relativism, the situation becomes rather more complex (see §4.1.1).
    step1: TBD
