      Principles of this kind are certainly at least suggested by some of Kant’s precursors and contemporaries but much could be said exegetically about whether any of these writers are really committed to fully fledged principles of taste. Hutcheson (1725/26), for example, famously thought of beautiful objects as those displaying an appropriate ratio of uniformity to variety. However, it’s unclear whether (even if we accept this particular view of beauty) someone who lacked aesthetic judgement could independently identify the appropriate kind of unity in variety and so infer beauty from this. This debate surrounding principles of taste, or the lack of same, subsequently went on to become a mainstay of twentieth century analytic aesthetics (see, e.g., Beardsley 1962 and Mothersill 1961)[^beardsley-1962][^mothersill-1961], leaving specific discussion of aesthetic testimony somewhat neglected. Similarly, there were significant debates concerning the kinds of broader principles we’ll discuss in Section 2. Principles which rule out basing one’s aesthetic judgements on testimony but also, *inter alia*, doing so on the basis of argument.
    step1: |-
      这类原则至少被康德的某些前辈与同时代人明确提示过，但这些作者是否真的完全接受了充分发展的鉴赏原则，训诂上还有许多可说。例如，Hutcheson（1725/26）著名地把美的对象设想为在整一与多样之间呈现恰当比例的对象。然而（即便我们接受这一特定的美的观念），缺乏审美判断的人是否能独立地识别多样之中恰当的整一、并由此推出美，并不清楚。围绕鉴赏原则（或其缺失）的这场争论，随后成为二十世纪分析美学的一大支柱（例如见 Beardsley 1962 与 Mothersill 1961）[^beardsley-1962][^mothersill-1961]，而对审美证言的具体讨论则多少受到冷落。类似地，关于我们将在第 2 节讨论的那类更宽泛原则，也有过重要争论——这些原则不仅排除把审美判断建立在证言之上，也排除（除其他外）建立在论证之上。
