      ### 5.3 Arguments from Assertion
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      Another prominent argument for pessimism concerns the (apparent) impermissibility of certain assertions. It seems unremarkable to claim that, e.g., “Lisbon is the capital of Portugal”, “the Korean war started in 1950” or “the bus stop is on Main Street” entirely on the basis of testimony. By contrast, if someone where to assert “Guernica is harrowing” without having experienced the object for themselves, something would seem amiss. As with the kinds of cases discussed above, the thought is typically that these intuitions are best accounted for by appeal to some form of pessimism (Andow 2015: 211–2; Mothersill 1994: 160; and Gorodeisky 2010: 53)[^andow-2015][^gorodeisky-2010][^mothersill-1994]. Indeed, a link to *AP* seems an obvious move here, suggesting that such assertions are problematic in the absence of experience for the simple reason that the beliefs in question would also be problematic.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      As with the cases above, it is open to the optimist to maintain that the assertions in question are unproblematic and that intuitions to the contrary are simply based on misleading folk theories or similar. However, optimists typically concede that aesthetic assertions—or at least aesthetic assertions of a particular kind—are illegitimate on the basis of testimony but try to offer some explanation of this which doesn’t impugn the corresponding judgements. And a number of optimist-friendly explanations have been suggested. Lackey (2011) takes this to be the result of a more general phenomenon which prevents our making “isolated second-hand assertions” in certain cases even though there is no concern with the status of the corresponding belief, Franzén (2018: 681) suggests that aesthetic assertions are “expressive affective states of mind” and Robson (2015b) that assertions of the relevant kind carry a misleading implicature regarding the source of the speaker’s judgements.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Each kind or proposal raises its own concerns though. Lackey proposes a norm of assertion which requires significant revisions of some prominent theories and the non-aesthetic examples she uses to motivate it are far from uncontroversial (see McKinnon 2017)[^mckinnon-2017]. Franzén suggests a semantics which looks to closely match some contemporary expressivist claims but which, as he himself (2018: 680) points out, it is one which doesn’t sit well with other aspects of contemporary expressivist views. Robson proposes that the infelicity results from some kind of implicature but (as discussed in Franzén 2018: 670–1 and Ninan 2014: 297)[^franzén-2018][^ninan-2014] these cases don’t appear to reflect any standard model of implicature or similar phenomena. For example, “it is a characteristic—some would say defining—feature of conversational implicatures that they are cancelable” (2014: 297) but this doesn’t seem to apply here. If I say “Jill has four cars (but I don”t mean to suggest that she has only four)’ I cancel the standard conversational implicature that Jill has exactly four cars. However, explicitly adding “but I haven”t seen it’ to a claim about the beauty of a painting seems to merely highlight, rather than remove, the infelicity.
    step1: TBD
    step2: TBD
