      ## 6. Arguments for Optimism
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      We have seen above that pessimism has sometimes been assumed, rather than argued for, in the literature on aesthetic testimony but it has also been suggested that the reverse should be the case. That is, that we should assume optimism (of quite an extreme flavour) unless we have good arguments to the contrary. After all, both the optimist and the pessimist tend to accept that most kinds of judgement we make are governed by norms which permit our forming judgements via testimony. It has been suggested that the requirements for the legitimacy of testimony in a particular domain are rather limited. Indeed, Fricker (2006: 225) goes so far as to suggest that we
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      > are essentially social creatures, and it is not clear that we do or could possess any knowledge at all which is not in some way, perhaps obliquely, dependent on testimony.
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      Robson’s (2017) case for favouring optimism goes even further, arguing that, at least if we take aesthetic judgements to be anything like beliefs as traditionally understood, then optimism is pretty much entailed by the nature of aesthetic judgement (Todd 2004 seems to share this view but takes it as a reason to reject the claim that aesthetic judgements are belief-like)[^todd-2004]. Beyond such concerns about “default status”, though, there are also some positive arguments which have been offered in favour of optimism.
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      ### 6.1 The Range of Aesthetic Judgements
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      One common line of argument concerns certain kinds of aesthetic judgement where pessimist intuitions seem (at the very least) to be significantly less common. These include judgements of natural beauty (Meskin 2004: 88–9)[^meskin-2004], of the aesthetic status of lost works and performances (Laetz 2008: 355)[^laetz-2008], of mathematical proofs (Meskin 2004: 89–90)[^meskin-2004], and judgements of aesthetic matters which seem to be common knowledge (Levinson 2005: 213)[^levinson-2005]. In all of these cases, it has been suggested that our intuitions favour optimism or, at the very least, favour pessimism considerably less than the standard kind of case (often featuring extant but non-canonical works of art).
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      A first kind of pessimist response denies that (some of) these cases are genuine exceptions. That is because the judgement in question either fail to be legitimate or fail to be aesthetic (or both). The claim that these aren’t genuinely aesthetic judgements seems rather more plausible in some cases than others. There is, for example, already independent debate about whether apparent ascriptions of beauty to mathematical proofs are genuinely aesthetic or, for example, merely metaphorical ways of expressing certain non-aesthetic claims concerning simplicity and the like (for a sceptical discussion of this possibility see Inglis & Aberdein 2015)[^inglis-2015]. Even with cases such as lost works, though (which might seem paradigmatically aesthetic), there are still things which could be said. First, it is open to pessimists to maintain that these claims, while aesthetic, aren’t genuinely aesthetic *judgements*. For example, as we saw in §2 the kind of hybrid view which (Gorodeisky & Marcus 2018)[^gorodeisky-2018] propose, aesthetic judgements are appreciation-like states, rather than belief-like states but our aesthetic assertions still sometimes express beliefs (which they allow can be legitimately formed on the basis of testimony). The challenge for such an approach would be to give a non-ad hoc explanation of why the assertions in these particular domains are exceptional in this way. A second approach is to maintain that the claims involved here are actually elliptical for some non-aesthetic claim. As Blackburn (1998: 60) points out, there are contexts in which it seems that someone’s apparent report of their aesthetic judgement will really be a self-effacing report of what they take, e.g., the general consensus on this matter to be. If this was what was happening in these cases, then this would be no problem for the pessimist as they are not committed to denying that we can legitimately learn *that* others hold certain aesthetic views on the basis of testimony. Further, in some cases at least, it might seem desirable to adopt paraphrases of these kinds. If someone were to maintain that “Cleopatra was the most beautiful woman in the ancient world”, then it would be very natural, and certainly more charitable, to interpret this as something like a report of her reputation, rather than as a serious attempt to make a comparative aesthetic judgement in relation to millions of other, largely entirely unknown, individuals (other cases, such as those involving natural beauty, are harder to motivate though).
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      A second general kind of response stresses that our intuitions about such cases are, of course, compatible with an attenuated version of pessimism. Hopkins (2011: 153–4), for example, mentions that the pessimistic norms he proposes don’t hold come what may but, rather, “lapse” under certain circumstances. And other pessimists might, to similar effect, say that the norms they propose are operative, but not violated in these cases, since they merely make it harder, rather than impossible, to form legitimate aesthetic judgements on the basis of testimony. Still, the optimist might reasonably ask for an explanation as to why the pessimist’s norms lapse with respect to, or otherwise fail to capture, these particular cases.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      ### 6.2 Aesthetic Practice
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      There also seem to be cases where what we might term our aesthetic practice speaks in favour of optimism. The most common examples here involve our tendency to defer—when it comes to which artworks we engage with—to the recommendations of friends and critics (see Gorodeisky 2010: 60 and Hopkins 2011: 153)[^gorodeisky-2010][^hopkins-2011]. Most of us would, for example, be more likely to watch a particular film if it was praised by a friend or lauded by a trusted critic. The benefit of such cases for the optimist shouldn’t be overstated though. One reason for caution is that these recommendations often involve more than pure aesthetic testimony. Professional critics are typically employed not merely to give an overall verdict on a work but to give reasons in support of this and, more generally, to present descriptive information about the work (though the importance of overall “Rotten Tomatoes” scores and similar is also worth considering here). Similarly, friends who provide recommendations will often give reasons for doing so and even comparisons to other works they know you’re already familiar with. Further, we might think that such recommendations can legitimise our behaviour without providing us with a particularly high degree of warrant. If we are deciding which of two unfamiliar novels to read, then it seems reasonable—in the absence of any other “tie breakers”—to act on the basis of a friend’s testimony, even if we think that this testimony provides very little in the way of warrant. However, as Gorodeisky (2010: 60) points out, we can sometimes undergo significant outlays—in terms of time, money and so forth—to engage with art works which have been praised by friends or critics. Behaviour of this kind seems hard to account for unless we are at least close to *knowing* that the work in question has aesthetic merit (Gorodeisky uses this as part of an argument for unusability pessimism but it could easily be adapted into the service of optimism).
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      While deferral to such recommendations is the most commonly cited practice, it isn’t the only one which has been discussed in the literature. For example, Nguyen (2017: 22–5) highlights the various roles which testimony plays within aesthetic education and Laetz (2008: 361–2) points to our tendency to enlist the testimony of others in reaching a judgement concerning a piece about which our own initial feelings are ambivalent. What should the pessimist say about such practices? It is open to the pessimist to deny that these practices really are legitimate but—so far as we are aware—this approach hasn’t been explored. The typical response is, rather, to aim to accommodate these practices within a pessimistic framework. One way of doing so—paralleling the approach commonly taken with apparently legitimate aesthetic judgements formed on the basis of testimony—is to simply allow that these cases highlight exceptions to the relevant pessimistic norms or cases where such norms lapse (Hopkins 2011: 153–4)[^hopkins-2011]. Another approach would involve arguing that some aspect(s) of our aesthetic practice which seems best explained by pessimism (see Whiting 2015; Nguyen 2017: 25)[^nguyen-2017][^whiting-2015]. If this were the case, then it would, again, become a question of balancing these competing considerations and determining which account (whether optimistic or pessimistic) is best able to accommodate them.
    step1: TBD
    step2: TBD
