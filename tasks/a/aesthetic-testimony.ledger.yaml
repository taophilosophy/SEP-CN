      In terms of the nature of aesthetic judgement, there is a clear general divide between two camps. The first takes aesthetic judgement to be belief, either in a narrow cognitivist sense (Hopkins 2006, 2011; Whiting 2015)[^hopkins-2006][^whiting-2015] or a broader sense which allows for certain expressivist or quasi-realist equivalents (Robson 2023: 16–8)[^robson-2023][^robson-2023-2]. The second takes the term “judgement” to capture something like a state of appreciation. Understood in terms of appreciation the debate is largely resolved as a matter of definition and no optimist would want to maintain that we can, say, achieve a state of appreciation—typically understood as something like experiencing the qualities of a thing’ in such a way as to find them “worthy or valuable” (Dickie 1974: 40)—on the basis of testimony alone (Konigsberg 2012 is an apparent exception but this is only because he understands “testimony” much more broadly than the kind of pure testimony we’re focusing on)[^konigsberg-2012]. It might easily seem that, as we have already seen Lopes (2014) suggest with regards to *AP*, the participants in this debate might merely be talking past each other, with optimists maintaining that we can legitimately form aesthetic beliefs on the basis of testimony and pessimists denying that we can legitimately appreciate aesthetic qualities on that basis. However, while we don’t deny that there might be some level of misunderstanding within these debates, we think that this irenic approach is mistaken for two reasons.
    step1: |-
      就审美判断的本性而言，两个阵营之间有明显的总体分野。第一阵营把审美判断当作信念，或取狭义的认知主义意义（Hopkins 2006, 2011; Whiting 2015）[^hopkins-2006][^whiting-2015]，或取更宽泛的意义、容许某些表达主义或准实在论的对应物（Robson 2023: 16–8）[^robson-2023][^robson-2023-2]。第二阵营则认为“判断”一词捕捉的是某种欣赏状态。若按欣赏来理解，这场争论在很大程度上作为定义问题就解决了：没有哪个乐观论者会主张，我们能仅凭证言就（比如说）达到一种欣赏状态——这种状态通常被理解为以某种方式经验一物的性质、从而觉得它们“值得或有价值”（Dickie 1974: 40）（Konigsberg 2012 是个表面上的例外，但那只是因为他把“证言”理解得比我们聚焦的纯粹证言宽泛得多）[^konigsberg-2012]。人们可能很容易觉得——正如我们已经看到 Lopes（2014）就 *AP* 所指出的——这场争论的参与者也许只是在各说各话：乐观论者坚持我们能基于证言正当地形成审美信念，悲观论者则否认我们能基于证言正当地欣赏审美性质。然而，虽然我们不否认这些争论中存在某种程度的误解，但我们认为这种调和主义的路子是错的，理由有二。
