      转向“顺从审美证言会阻碍我们审美发展”这一关切。重要的是再次指出（依循 §4.2.2）：获取某些信息并不必然阻止一个人日后亲自探究此事。事实上，在审美领域中，听到关于某事的证言，也许恰好能激励一个对自己审美判断毫无信心的人亲自投入此事。Wallbank 与 Reisner（2020）在一篇论文中阐明了这一点：他们论证顺从可以成为认知上的促进因素，接受相关信念可以成为进一步调查与投入的跳板。即便顺从证言意味着接受虚假，长远来看，它也可能因为充当进一步投入的跳板而证明有认知上的助益，从而让我们有潜力获得更多真理。正如 Ransom（2019）与 Lord（2018）自己承认的，顺从审美证言在这里显得对审美上特别稚嫩、需要鼓励的人尤其有益。
