      Appeals to *AP* as an explanation for pessimism are, however, fraught for two reasons. First, Wollheim’s principle, and his subsequent discussion of it, are sometimes rather difficult to interpret. Second, there are those who hold that *AP* itself is false. These two issues are, of course, related and it is common for both advocates and detractors of *AP* to argue that various interpretations of the principle clearly render it either trivial or implausible (Hopkins 2006; Budd 2003; Ransom 2019; Lord 2018)[^budd-2003][^hopkins-2006][^lord-2018][^ransom-2019]. For example, it seems clear that a requirement that we must always engage with the work itself in order to make any aesthetic judgement of it is implausibly demanding and that a suitably accurate reproduction or sufficiently detailed photograph would allow for *some* aesthetic insight in many cases. Where these theorists differ is whether there are any versions of the principle which aren’t benighted in this way. And there have been further concerns about *AP*’s ability to handle certain kinds of art works such as conceptual art (for a discussion of these and some responses see Hanson (2015)). Some, such as Livingston (2003) take these concerns to undermine the prospects for any version of *AP* which is both true and non-trivial but others are more hopeful. Lord (2018), for example, has suggested that we should think about acquaintance not with a particular artwork but, rather, with some particular highly determinate aesthetic property which the object instantiates. Acquaintance with this property doesn’t, strictly, require acquaintance with the work itself but, rather, allows for acquaintance with reproductions or photographs. However, a principle of this kind would still rule out forming our aesthetic judgements on the basis of induction or testimony. Regardless of how we interpret the scope of the principle, though, there remains the question of how the “must” should be interpreted here. On some accounts, the demand is interpreted as an epistemic one, with acquaintance being a prerequisite for aesthetic knowledge (Pettit 1983; Budd 2003)[^budd-2003][^pettit-1983], but—as we will see in §3.2—even amongst pessimists there has been an increasing move towards interpreting the demand as relating to some manner of non-epistemic norm (Hopkins 2006)[^hopkins-2006].
    step1: |-
      然而，把 *AP* 用作悲观论的解释，有两点困难。其一，沃尔海姆的原则及其随后的讨论，有时相当难以解读。其二，有人认为 *AP* 本身是假的。这两个问题当然相关；*AP* 的支持者与批评者都常主张：该原则的种种解读显然要么使其变得琐屑，要么使其不可信（Hopkins 2006; Budd 2003; Ransom 2019; Lord 2018）[^budd-2003][^hopkins-2006][^lord-2018][^ransom-2019]。例如，很明显：要求我们在对一件作品作出任何审美判断之前都必须与作品本身打交道，这种要求苛刻得难以成立；而在许多情形中，一件足够精确的复制品或足够细致的照片也能提供*某种*审美洞见。这些理论家的分歧在于：是否存在不受这种困境困扰的原则版本。此外，对 *AP* 能否处理某些艺术作品（如概念艺术）也有进一步的担忧（对这些担忧及若干回应的讨论见 Hanson（2015））。有些人（如 Livingston（2003））认为这些担忧破坏了任何既真又非琐屑的 *AP* 版本的前景；但另一些人更有希望。例如，Lord（2018）建议：我们应把亲知的对象理解为某种对象所例示的高度确定的审美性质，而非特定作品本身。对这种性质的亲知严格来说并不要求对作品本身的亲知，而是容许对复制品或照片的亲知。然而，这类原则仍会排除以归纳或证言为据形成审美判断。不过，无论我们如何解读该原则的范围，这里仍有“必须”当作何解的问题。在一些说明中，这一要求被解读为认知性的：亲知是审美知识的先决条件（Pettit 1983; Budd 2003）[^budd-2003][^pettit-1983]；但——正如 §3.2 将要说明的——即便在悲观论者内部，也日益倾向于把这一要求解读为关乎某种非认知性规范（Hopkins 2006）[^hopkins-2006]。
    step2: |-
      然而，诉诸 *AP* 来解释悲观论有两点困难。其一，沃尔海姆的原则及其后续讨论，有时相当难以解读。其二，有人认为 *AP* 本身是假的。这两个问题当然相关；*AP* 的支持者与批评者都常说：对该原则的种种解读，显然要么使它变得琐屑，要么使它不可信（Hopkins 2006; Budd 2003; Ransom 2019; Lord 2018）[^budd-2003][^hopkins-2006][^lord-2018][^ransom-2019]。例如，有一点很明显：要求我们对一件作品作出任何审美判断都必须先与作品本身打交道，苛刻得难以成立；在许多情形中，足够精确的复制品或足够细致的照片也能带来*某种*审美洞见。这些理论家的分歧在于：是否存在没有这种毛病的原则版本。此外，对 *AP* 能否处理概念艺术这类作品，也有进一步的担忧（对这些担忧及若干回应的讨论，见 Hanson（2015））。有些人（如 Livingston（2003））认为这些担忧断送了任何既真又非琐屑的 *AP* 版本的前景；另一些人则更为乐观。例如，Lord（2018）建议：我们应把亲知的对象理解为对象所例示的某种高度确定的审美性质，而不是特定作品本身。严格说来，对这种性质的亲知并不要求亲知作品本身，而是容许亲知复制品或照片。然而，这类原则仍会排除以归纳或证言为据形成审美判断。不过，无论怎样解读该原则的范围，“必须”二字当作何解，仍是一个悬而未决的问题。按某些说明，这一要求是认知性的：亲知是审美知识的先决条件（Pettit 1983; Budd 2003）[^budd-2003][^pettit-1983]；但——正如 §3.2 将要说明的——即便在悲观论者内部，也日益倾向于把这一要求解读为关乎某种非认知性规范（Hopkins 2006）[^hopkins-2006]。
