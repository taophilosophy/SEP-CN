      What about relativism? A very similar challenge awaits here. The kind of crude relativism which easily leads to pessimism is, understandably, unpopular with aestheticians. Rather, any plausible form of relativism will have to account for (amongst much else) the widespread level of aesthetic agreement, the importance of aesthetic expertise and our practice of offering reasons for and against aesthetic judgements (for discussion of some contemporary forms of relativism see, e.g., Young 2009 and Goldman 1995; for some historical context see Korsmeyer 1975)[^goldman-1995][^korsmeyer-1975][^young-2009]. Once we have developed relativism this far, though, it isn’t always an easy matter to see why the relativist should be a pessimist. For example, as Meskin (2006: 113) highlights, the sophisticated relativist faces the difficulty of accounting for why aesthetic testimony may well have an asymmetrical status—in both of the senses mentioned above—in the context of like-minded valuers. And even more pessimistic relativists do tend to be rather attenuated in their pessimism; for example, Andow (2015: 217) seems happy to allow that the relativist views he discuss can sometimes enable us to legitimately arrive at aesthetic knowledge via testimony.
    step1: |-
      相对主义又如何呢？这里等待着非常相似的挑战。那种容易导向悲观论的粗糙相对主义，在美学家中不受欢迎，这是可以理解的。相反，任何可信的相对主义形式都必须说明（除许多其他事情外）审美共识的广泛程度、审美专家能力的重要性，以及我们为审美判断提供支持与反对理由的实践（关于某些当代相对主义形式的讨论，例如见 Young 2009 与 Goldman 1995；一些历史脉络见 Korsmeyer 1975）[^goldman-1995][^korsmeyer-1975][^young-2009]。然而，一旦相对主义发展到这一步，要看清相对主义者为何应当成为悲观论者，就不总是件容易的事。例如，正如 Meskin（2006: 113）所指出的，精致的相对主义者在解释“在志趣相投的评价者之间，审美证言为何仍可能具有不对称地位”（上述两种意义上的不对称）时面临困难。而即便更为悲观论化的相对主义者，其悲观论也往往相当淡化；例如，Andow（2015: 217）似乎乐于允许：他所讨论的相对主义观点有时能让我们正当地经由证言获得审美知识。
