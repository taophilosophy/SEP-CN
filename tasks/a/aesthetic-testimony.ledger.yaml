      An approach developed by Nguyen (2020a) rests on the Autonomy Principle mentioned in §2.2. It broadly emphasises the importance of asserting aesthetic agency. Key to Nguyen’s argument for this claim is the assumption that what we primarily value about our aesthetic practice is forming judgements as opposed to “getting our judgements right” (Nguyen 2020a: 1129)[^nguyen-2020a]. On this account, the activity of forming judgements is the point and purpose of our aesthetic engagement, not epistemic gain; and whilst deference to aesthetic testimony can enable us to improve our epistemic standing, it can thwart our aesthetic engagement. One thing that emerges as important for this account is the prolongation of appreciative aesthetic activity. Such prolongation is purportedly promoted by the autonomous control of our attention, whilst deference is seen to undermine it serving as an endpoint for our appreciative aesthetic activities. Nguyen describes deference in this context as comparable to a marathon runner taking a taxi to the finish line. (Nguyen 2020a: 1147; see Friend 2023 for a critical yet sympathetic discussion)[^friend-2023][^nguyen-2020a].
    step1: |-
      Nguyen（2020a）提出的一种进路，立足于 §2.2 提到的自主性原则。它大体上强调主张审美能动性的重要性。Nguyen 这一主张的关键，是一个假定：我们在审美实践中主要看重的，是形成判断，而不是“把判断弄对”（Nguyen 2020a: 1129）[^nguyen-2020a]。按这一说明，形成判断的活动就是我们审美投入的要点与目的，而非认知收获；顺从审美证言虽能改善我们的认知地位，却可能挫败我们的审美投入。对这套说明而言显得重要的一点，是欣赏性审美活动的延长。据说，这种延长由我们对注意力的自主控制所促进；而顺从则被视为破坏它，构成欣赏性审美活动的终点。Nguyen 在此语境中把顺从比作马拉松选手打车去终点线。（Nguyen 2020a: 1147；批判而同情的研究见 Friend 2023）[^friend-2023][^nguyen-2020a]。
