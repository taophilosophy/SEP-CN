  - id: 15
    kind: body
    source: |-
      Aristotle explains that, given its peculiar status as the firmest first principle, PNC is not susceptible to demonstration. A demonstration is a deductive argument, the conclusion of which is deduced from firmer, prior premises. It follows that if PNC could be deduced from another premise, then that premise would have to be a firmer and prior principle, with the result that PNC could not have been the firmest first principle. Aristotle also says that if PNC could be demonstrated, then everything would be subject to demonstration, which would lead to an infinite regress. Therefore demonstration is ruled out, and it is important to be wary of reconstructions of Aristotle’s discussion in terms of ordinary deductive arguments. Anyone asking for a deductive argument for PNC, as Aristotle points out, is missing the point, or, rather, is asking for something that is impossible without using PNC. You cannot engage in argument unless you rely on PNC. Anyone who claims to reject PNC “for the sake of argument” is similarly misguided.
    step1: |-
      亚里士多德解释说，鉴于不矛盾律作为最牢固第一原理的特殊地位，它不适合被证明。证明是一种演绎论证，其结论由更牢固、在先的前提推出。由此可推：若不矛盾律能从另一前提推出，那么该前提必是更牢固、在先的原理，结果不矛盾律便不可能是最牢固的第一原理。亚里士多德还说，若不矛盾律可被证明，那么一切都将成为可证明的，从而导致无穷倒退。因此证明被排除；同时，须警惕用普通演绎论证来重构亚里士多德的讨论。正如他指出的，任何要求为不矛盾律提供演绎论证的人，都未抓住要点；毋宁说，他要求的是不用不矛盾律便不可能之事。你不依赖不矛盾律，就无法进行论证。任何人声称“为论证起见”拒斥不矛盾律，同样误入歧途。
