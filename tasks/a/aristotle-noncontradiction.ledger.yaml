      进一步的问题围绕普罗塔戈拉本人观点的表述。《形而上学》IV 6 中，亚里士多德解释普罗塔戈拉式不矛盾律怀疑者应如何表述其观点以避免违反不矛盾律：“那些想受论证强制、同时又要求为自己的观点作出交代的人，必须如此设防：真理并非‘显现者存在’，而是‘显现者对于它向其显现的人、在它显现的时候、对它显现的感官、在它显现的条件下存在’。”否则他们就会自相矛盾（《形而上学》IV 6 1011a20–25）。然而，亚里士多德仍挑出这一观点的毛病，因为它使一切相对于感知，包括感知者。按照亚里士多德，并非一切都可相对于感知。正如他在前一章末尾所解释的，感知之外还有某种引起感知且在先的东西。亚里士多德借不矛盾律与普罗塔戈拉的讨论，标定出一种实在论立场。
