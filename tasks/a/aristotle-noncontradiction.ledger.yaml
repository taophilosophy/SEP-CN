      Besides dialetheists, some modern logicians, who need not be dialetheists, think that logic can be paraconsistent, i.e., that, contrary to classical logic, one contradiction need not lead to an explosion where anything goes. While Aristotle is obviously not a dialetheist, it is not clear where he stands on the issue of paraconsistency in *Metaph* IV. Although Aristotle does claim that if his opponent rejects PNC across the board, she is committed to a world in which anything goes, he never argues that if (*per impossibile*) his opponent is committed to one contradiction, she is committed to anything, and he even considers that the opponent’s view might apply to some statements but not to others (*Metaph* IV 4 1008a10–12). However one understands these passages, in the *Prior Analytics*, Aristotle does commit himself to the view that syllogistic is paraconsistent (*APr.* II 15 64a15).
    step1: |-
      除双面真理论者外，一些现代逻辑学家（不必是双面真理论者）认为逻辑可以是弗协调的，即与经典逻辑相反，一个矛盾不必导致“什么都行”的爆炸。亚里士多德显然不是双面真理论者，但他在《形而上学》第四卷中对弗协调性问题持何立场并不清楚。尽管他确实主张：若对手全面拒斥不矛盾律，她便承诺一个什么都行的世界；他却从未论证：若（不可能地）对手承诺一个矛盾，她便承诺一切。他甚至考虑对手的观点可能适用于某些陈述而不适用于另一些（《形而上学》IV 4 1008a10–12）。无论怎样理解这些段落，在《前分析篇》中，亚里士多德确实承诺三段论是弗协调的（《前分析篇》II 15 64a15）。
