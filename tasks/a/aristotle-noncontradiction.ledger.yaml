      1. There are three sorts of cases of conflicting appearances:
      2. Things appear different to different members of the same species, e.g., the same thing is thought bitter by some and sweet by others (*Metaph* IV 5 1009b2–3).
      3. Things appear different to members of different species (e.g., to other animals and to us) (*Metaph* IV 5 1009b7–8).
      4. Things do not always appear the same even to the senses of the same individual (*Metaph* IV 5 1009b8–9).
