      According to Aristotle, first philosophy, or metaphysics, deals with ontology and first principles, of which the principle (or law) of non-contradiction is the firmest. Aristotle says that without the principle of non-contradiction we could not know anything that we do know. Presumably, we could not demarcate the subject matter of any of the special sciences, for example, biology or mathematics, and we would not be able to distinguish between what something is, for example a human being or a frog, and what it is like, for example pale or green. Aristotle’s own distinction between essence and accident would be impossible to draw, and the inability to draw distinctions in general would make rational discussion impossible. According to Aristotle, the principle of non-contradiction is a principle of scientific inquiry, reasoning and communication that we cannot do without.
    step1: |-
      按照亚里士多德，第一哲学或形而上学研究存在论与第一原理，而第一原理中最牢固者是不矛盾原理（或称不矛盾律）。亚里士多德说，没有不矛盾律，凡我们所知者便都无从知晓。想必我们也就无法划定任何专门科学（例如生物学或数学）的主题，也无法区分某物是什么（例如人还是青蛙）与它什么样（例如苍白还是绿色）。亚里士多德本人关于本质与偶性的区分将无法作出；而一般地区分能力的缺失，将使理性讨论成为不可能。按照亚里士多德，不矛盾律是科学探究、推理与交流的一条原理，我们离了它便寸步难行。
