    kind: body
    source: |-
      There are two basic interpretations. According to one interpretation, Aristotle does indeed include contradictions, but these are idle and play no real logical role in the argument he presents. According to the other interpretation, following Aquinas’s commentary (lecture 20), Aristotle is not claiming that Callias both is and is not Callias or that he is and is not a human being, for example, but that the term “animal”covers Callias and those who are not Callias and not human beings, as Aristotle himself explains when he says that the major term (“animal”) is more extensive than the middle term (“human”). (In the syllogism All *A*s are *B*s; All *B*s are *C*s; therefore All *A*s are *C*s, “A” is the major term and “*B*” is the middle term.)
    step1: |-
      有两种基本解释。按一种解释，亚里士多德确实纳入了矛盾，但这些矛盾是闲置的，在他所呈现的论证中不起真正逻辑作用。按另一种解释（依阿奎那评注，第 20 讲），亚里士多德并非主张卡里亚斯既是又不是卡里亚斯，或既是人又不是人，而是主张“动物”一词涵盖卡里亚斯以及那些不是卡里亚斯、不是人者；正如他本人所解释的：大词（“动物”）比中词（“人”）外延更广。（在三段论“所有*A*是*B*；所有*B*是*C*；所以所有*A*是*C*”中，“A”是大词，“*B*”是中词。）
    step2: |-
