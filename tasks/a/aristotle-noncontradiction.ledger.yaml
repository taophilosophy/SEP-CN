      Aristotle’s account of the PNC has been challenged anew by modern-day dialetheists, who hold that there are some true contradictions, and that Aristotle’s discussion fails to show otherwise. One approach is to argue that some of Aristotle’s discussion of PNC begs the question in favor of PNC. (Of course, Aristotle would agree that any argument in favor of PNC must beg the question.) Another approach is for dialetheists to refuse to let the Aristotelian reformulate their supposed counterexamples to PNC by adding qualifications so that these supposed counterexamples do not violate PNC after all. The Aristotelian can counter that without those qualifications the dialetheist has not said anything meaningful at all. Finally, the dialetheist may ask how Aristotle would deal with the liar’s paradoxical sentence “I am lying”. Why is this not both true and false at the same time as the dialetheist contends?
    step1: |-
      亚里士多德对不矛盾律的说明，近来受到当代双面真理论者的新挑战。他们主张存在某些真矛盾，而亚里士多德的讨论未能表明不是这样。一种进路是论证：亚里士多德关于不矛盾律的某些讨论以不矛盾律为论题而窃取论题。（当然，亚里士多德会同意：任何支持不矛盾律的论证都必定窃取论题。）另一种进路是：双面真理论者拒绝让亚里士多德派通过增加限定来重新表述其所谓的反例，使这些反例终究不违反不矛盾律。亚里士多德派可以回应：没有这些限定，双面真理论者根本没说任何有意义的话。最后，双面真理论者可以问：亚里士多德会如何处理说谎者悖论句“我正在说谎”？为何它不像双面真理论者所主张的那样同时为真又为假？
