      我把灵性定义为一种*强化的*宗教性形式，它为共同体中某些个体所达到，这些人拥有、或声称拥有与超自然者、神圣者的神秘接触。然而可以正确断言，在非洲传统环境中，这些相遇是宗教的*结果*，而非其来源。而且，尽管传统非洲宗教的践行者可能通过这些神秘相遇接受“灵性讯息”，其中一部分（“讯息”）可能与道德行为有关，然而这类讯息似乎太少、太零星，不足以构成一个连贯伦理体系的充分基础。此外，在非启示的宗教语境中，这类“讯息”的道德性质必须由人们自己依据其自身的道德洞见来判断。这是一个有说服力的要点，它意味着人们的道德态度相对于灵性存在者的行为具有独立性（自律性）。这就是为什么一位加纳著名社会学家观察到：“神祇若带来好处就受到尊敬，若失败就遭到蔑视……对［神祇］的态度取决于他们的成功［即神祇的成功］，并从健康的尊敬到嗤之以鼻的蔑视不等”（K. A. Busia in Forde, 1954: 205）。人们对诸神行为——尤其是不成功的行为——的道德非难，构成了某些神祇从阿肯（或许是非洲）万神殿中消亡的根据。一个超自然存在者的行为竟然受制于*人的*责难，这一事实意味着神祇有可能发出被传统宗教践行者视为不合伦理的命令。这一切无疑意味着，与其把非洲伦理视为宗教性的（或基于宗教的），不如把非洲宗教视为*伦理性的*，这样断言更为正确。
