      1. When a speaker of the Akan language wants to say, “He has no morals”, or, “He is immoral”, or “He is unethical”, “His conduct is unethical”, he would almost invariably say, “He has no *character*” (*Onni suban*).
      2. The statement, “He has no morals”, or “He is unethical”, is expressed by a speaker of the Ewe language as, *nonomo mele si o* (which means “He has no character”).
      3. In Yoruba language and thought the word *iwa* means both character and morality (it also means ‘being’ or ‘nature’).
      4. In Igbo language of Eastern Nigeria, the word *agwa*, meaning character, is used in such a statement as “he has no morals” (*onwe ghi ezi agwa)*.
      5. In Shona, the language spoken by a substantial majority of the people of Zimbabwe, the word *tsika* means ‘ethics’ or ‘morality’. But when they want to say of a person that “He has no morals”, or “He is unethical”, they would often use the word *hunhu* which directly means ‘character’. Thus, *Haana hunhu* means “He has no character”, “He is not moral”, “He is unethical”.
      6. In South Sotho, a language spoken widely in Lesotho and southern Zimbabwe (Matebeleland), there are no words that are the direct equivalents of ‘ethics’ or ‘morality’. References to the moral or ethical life or behavior are made using words that mean behavior or character. Thus, moral statements such as “he has no morals” or “his action is unethical” will be expressed by words such as *maemo*—which means character or behavior: thus, *maemo a mabe* means “he has a bad character”, “his behavior (action) is unethical.” When a person behaves (or acts) in ways that are morally right, they would say “he has a good character”, using the words *lokileng* or *boitswaro*, both of which mean good character or good behavior.
