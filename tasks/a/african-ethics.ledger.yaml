      第二种解释——人被创造为善（或创造得向善）——暗示人类存在者仅具有德性的能力：即可追求善，也可追求恶。这意味着人类存在者被赋予了道德感，因而同时具有德性与恶德的能力；他在某个道德问题上的判断可以朝任一方向：善的方向或恶的方向。于是，道德中性的观念得以保留。这样，人类存在者就可以被看作道德能动者：不是说他德性的品性是已定之事，而是说他具有德性的能力，因而具有道德成就的可能，因而能够达到人格。
