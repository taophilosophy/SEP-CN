      大多数学者把这种联系理解为：非洲的道德价值与原则源自宗教，因而暗示非洲道德是一种宗教道德（Opoku, 1978: 152）、Danquah（1944: 3）、Sarpong（1972: 41）、Busia（1967: 16）、Parrinder（1969: 28–9）、Idowu（1962: 146）。这一主张又意味着：非洲人民的道德信念与原则源自宗教的信念与原则；宗教为道德价值与信念提供了必要的证成；诸如好、坏、对、错这样的道德概念，是（或必须）依宗教规诫或命令来定义的。然而，另一些学者——如戈弗雷·威尔逊、莫妮卡·威尔逊、马凯、维雷杜——否认他们所研究社会的道德体系具有宗教基础。夸西·维雷杜观察到，“阿肯的道德观因此在逻辑上独立于宗教”（Kwasi Wiredu in H. Odera Oruka and D. A. Masolo, 1983: 13）。戈弗雷·威尔逊写道：“在尼亚库萨人中，关于社会行为的观念与宗教并无关联，然而它们确实存在”；在提到尼亚库萨人的道德德性之后，他又补充说，“但这些德性的正面、理想的表述并不是以宗教语汇作出的”（Godfrey Wilson in Ottenberg and Ottenberg eds., 1960: 348）。关于卢旺达人的道德，马凯写道：“因此，巴尼亚卢旺达人的伦理并未建立在诸如上帝意志这样的宗教基础之上”（J. J. Maquet in Forde, 1954: 184）。在门德人的伦理中，“错误行为被视为对某条具体行为规则的破坏，而不是对某种神圣的或绝对的宇宙律法的蔑视”（Kenneth Little, in Forde, 1954: 134）。这些都是关于至少某些非洲社会道德之非宗教基础的无歧义陈述。
