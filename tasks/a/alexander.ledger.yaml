      In 1893, Alexander accepted a Professorship at the University of Manchester. He took an active part in the university life there, and strongly supported feminism. Alexander remained at Manchester for the rest of his life, and in 1902 he brought various family members over—including his mother and three of his siblings—from Australia to Manchester. He did not marry. Although Alexander never returned to Australia he maintained a correspondence with several Australian philosophers, including the Scottish-born John Anderson.
