      One of the optimistic conclusions of *Space, Time, and Deity* is that, in the future, deity will emerge as a quality of the universe as a whole. This deity-world emergence is akin to mind-body emergence. In the following passage, Alexander explains that we should not identity God with spacetime. Instead, the spacetime system is in the process of “engendering” God:
    step1: |-
      《空间、时间与神性》的乐观结论之一是：将来，神性会作为整个宇宙的一种性质而突现。这种神性—世界的突现类似于心身突现。下面这段文字中，亚历山大解释说，我们不应把上帝与时空等同；相反，时空系统正处在“生育”上帝的过程之中：
    step2: |-
      《空间、时间与神性》的乐观结论之一是：将来，神性会作为整个宇宙的一种性质而突现。这种神性—世界的突现类似于心身突现。下面这段文字中，亚历山大解释说，我们不应把上帝与时空等同；相反，时空系统正处在“生育”上帝的过程之中：
