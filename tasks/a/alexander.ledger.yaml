      “The Historicity of Things” (1936) is one of Alexander’s last papers. One reason it is valuable is that it gives a concise overview of Alexander’s spacetime metaphysics in his own words. Another reason it is valuable is that it tackles an unusual theme: the relationship between history and nature. Alexander argues that while some of the contributions to philosophy from science are clear, it is less clear what philosophy can learn from history (Alexander 1936: 12). Alexander argues that, as time and motion belong to the most fundamental level of reality, all that exists is “historical”. As such, science begins with history:
    step1: |-
      《事物的历史性》（1936）是亚历山大最后的论文之一。其价值之一在于，它以亚历山大自己的话简明概述了其时空形而上学。另一价值在于，它处理了一个不寻常的主题：历史与自然的关系。亚历山大论证，科学对哲学的某些贡献固然清楚，哲学能从历史学到什么却远不清楚（Alexander 1936: 12）。他论证，既然时间与运动属于最根本的实在层级，一切存在者都是“历史性的”。因此，科学始于历史：
    step2: |-
