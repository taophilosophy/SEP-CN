      Alexander’s ethical system is a kind of evolutionary ethics, akin to that of Leslie Stephen. By applying evolution to ethics, Alexander explains that one can mean either the mere integration of the biological into the ethical sphere, or treating morals as one part of a comprehensive view of the universe, in which a steady development from the lower to the higher can be observed, a development which follows the law of the survival of the fittest (Alexander 1889: 14). Alexander, of course, means both. He emphasises that while his ethical system, based on the organic nature of society, is due in part to the influence of the biological sciences, it would be an “entire misapprehension” to think that it were entirely due to this influence; his views are also the result of progress in ethics and politics (Alexander 1889: 7–8).
    step1: |-
      亚历山大的伦理体系是一种进化论伦理学，近似于莱斯利·斯蒂芬的体系。把进化论应用于伦理学，亚历山大解释说，可以指仅把生物学整合进伦理领域，也可以指把道德视为一种宇宙总观的一部分——在这种总观中，可以看到从低到高的稳定发展，而这一发展遵循最适者生存的规律（Alexander 1889: 14）。亚历山大当然二者兼指。他强调：其以社会有机本性为基础的伦理体系虽部分归因于生物科学的影响，但若以为它完全源于这种影响，那便是“彻底的误解”；他的观点也是伦理学与政治学进步的结果（Alexander 1889: 7–8）。
