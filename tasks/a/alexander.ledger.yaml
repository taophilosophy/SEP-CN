      According to Alexander, we perceive the world directly: we do not perceive representations or ideas of tables, but the tables themselves (or aspects of the tables). We are conscious of our perceptual process, a consciousness he labels “enjoyment”. Any direct theory of perception must account for error. If we perceive the world directly, how do we make mistakes about it? Alexander’s answer is that we do not perceive the world incorrectly, but we can incorrectly apply partial perceptions to wholes. For example, we may correctly perceive a table as having a flat edge, but incorrectly apply that perception to the table as a whole.
    step1: |-
      按照亚历山大，我们直接知觉世界：我们知觉的不是桌子的表象或观念，而是桌子本身（或桌子的某些方面）。我们对自己的知觉过程有所意识，他把这种意识称为“享有”（enjoyment）。任何直接知觉理论都必须说明错误。若我们直接知觉世界，又何以会出错？亚历山大的回答是：我们并未错误地知觉世界，却可能错误地把部分的知觉应用于整体。例如，我们可能正确地知觉到桌子有一条平坦的边缘，却错误地把这一知觉应用于整张桌子。
