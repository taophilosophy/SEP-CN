    source: |-
      Alexander was born in Sydney on 6 January 1859, to a Jewish family. He was the third son of Samuel Alexander, a British emigrant and saddler. Alexander’s father died a few weeks after his birth, and five years later the remaining family moved to Melbourne. Alexander was home-educated by tutors before entering Wesley College in 1871. Alexander entered the University of Melbourne in 1875, and subsequently won awards in arts, sciences, languages and natural philosophy. In 1877, Alexander sailed for England, in an attempt to win a scholarship at Oxbridge. He successfully obtained a scholarship at Balliol College, Oxford, and went on to win a First in 1881. The following year, Alexander was awarded a Fellowship at Lincoln College, Oxford.
    step1: |-
      亚历山大 1859 年 1 月 6 日生于悉尼一个犹太家庭。他是英国移民、马鞍匠塞缪尔·亚历山大的第三个儿子。父亲在他出生几周后去世，五年后全家迁往墨尔本。亚历山大先在家中由家庭教师教育，1871 年进入韦斯利学院。1875 年进入墨尔本大学，随后在文科、理科、语言与自然哲学方面获奖。1877 年，亚历山大渡海赴英格兰，力图在牛津或剑桥赢得奖学金。他成功获得牛津大学贝利奥尔学院奖学金，并于 1881 年获得一等荣誉。次年，亚历山大获牛津林肯学院研究员职位。
