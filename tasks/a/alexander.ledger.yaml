      Alexander’s writing on art falls into two kinds. First, there are essays on literature and art. These are all reprinted in Alexander’s (1939), and cover a wide range of topics: from the art of Jane Austen, to the writings of Pascal, to the origin of the creative impulse. Second, there are the pieces comprising Alexander’s account of value. Alexander’s early interest in ethics—exemplified in his first monograph (1889)—survived in his later work as a preoccupation with the nature of value, albeit with a focus on the aesthetic value of beauty. Alexander’s (1920) contained several chapters on the nature of value, and he goes on to supplement these with further papers on the same theme. These include “Naturalism and Value”, and “Value”, both reprinted in Alexander’s *Philosophical and Literary Pieces* (1939); and “Morality as An Art” (1928). These papers culminate in another monograph, *Beauty and Other Forms of Value* (1933), Alexander’s most important work on the topic. His writings on value are of greater philosophic interest than those on literature and art.
    step1: |-
      亚历山大的艺术写作分两类。第一类是论文学与艺术的随笔，全部重印于其（1939）文集，涵盖范围甚广：从简·奥斯汀的艺术，到帕斯卡的著作，再到创造冲动的起源。第二类是构成其价值说明的诸篇文字。亚历山大早期对伦理学的兴趣——以其第一部专著（1889）为代表——在其晚期工作中延续为对价值本性的关注，尽管焦点转向美的审美价值。其（1920）一书包含数章论价值本性，他随后又以同一主题的论文加以补充，包括《自然主义与价值》与《价值》（均重印于 1939 年《哲学与文学文集》），以及《作为艺术的道德》（1928）。这些论文最终汇成另一部专著《美与其他价值形式》（1933），即亚历山大在这一主题上最重要的著作。其价值论述比文学艺术论述更具哲学旨趣。
