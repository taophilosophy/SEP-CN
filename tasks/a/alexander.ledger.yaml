      As Alexander developed his anti-idealist views, he published on naturalism and realism. He corresponded at length with fellow British emergentists C. Lloyd Morgan and C. D. Broad on psychology and metaphysics. Whilst he rejected idealism, he also continued to correspond with F. H. Bradley and Bosanquet. During the War, Alexander canvassed for recruits, and assisted Belgian refugees.
