      Interest in Alexander’s work grew as he became President of the Aristotelian Society from 1908–1911 (he became President again, from 1936–1937). He was invited to deliver the Gifford lectures during the war years 1917 and 1918. These were called ‘Space, time, and deity’ and would form the basis of his (1920) *Space, Time, and Deity*. Laird reports that, after the war, Alexander struggled with writing its two volumes: “He was overwhelmed by a sense of his littleness in comparison with the task to which he was tied” (Laird 1939: 61)[^laird-1939]. Nonetheless, *Space, Time, and Deity* was finally finished, assuring Alexander’s place within the British philosophical landscape. It was praised by new realists and idealists alike. As John Passmore puts it:
