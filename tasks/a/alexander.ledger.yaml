      Alexander’s retirement did not stem the tide of his output. Having completed *Space, Time, and Deity*, Alexander continued to produce a stream of articles as prolific as it was diverse. He wrote several pieces comparing his metaphysics to that of Spinoza, and Alexander took pride—rooted partly in their shared Jewish heritage—in the deep similarity he perceived there. Alexander also wrote on the nature of art, history, Moliere, Pascal, theology, and Jane Austen. Alexander was a lifelong fan of Austen, and particularly loved *Persuasion*. His friend and colleague, J. H. Muirhead, suggested that Alexander’s love of literature may have resulted from partial deafness, which made it difficult for him to appreciate music.
