      Alexander’s early monograph *Locke* (1908) discusses John Locke’s *Essay* on ethics, politics, and religion. This short book reveals Alexander’s admiration for Locke, and Lockean empiricism. Whilst this work is mainly of scholarly interest, Alexander spends one chapter “Observations on the *Essay*” critiquing Locke, and here Alexander reveals the bent of his own early views. For example, Alexander complains that Locke might have gone further had he applied his observations regarding the continuity of mental experience to substance (Alexander 1908: 52). This is suggestive, given that one of Alexander’s later key claims concerning spacetime—the stuff of substances—is that it is continuous.
    step1: |-
      亚历山大的早期专著《洛克》（1908）讨论约翰·洛克《人类理解论》中关于伦理、政治与宗教的内容。这本小书显露出亚历山大对洛克与洛克式经验论的钦佩。此书主要具有学术旨趣，但亚历山大用一章“《人类理解论》札记”批评洛克，并在此透露了自己早期观点的倾向。例如，他抱怨洛克若把关于心理经验连续性的观察应用于实体，本可走得更远（Alexander 1908: 52）。这一点颇具提示性：亚历山大后来关于时空——实体之材料——的关键主张之一，正是时空具有连续性。
