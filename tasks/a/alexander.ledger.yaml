      Building on the many smaller pieces that preceded it, *Beauty and Other Forms of Value* provides a full naturalist account of value. Alexander’s approach is to discuss the supreme values in turn, beginning with beauty, and moving on to truth and goodnes. He continues down to lesser values. He aims to explain not just what values are, but also how they came to be.
