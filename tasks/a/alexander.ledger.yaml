      Bleakness of Cambridge aside, Alexander received many honours during his lifetime. These include his election as a Fellow of the British Academy in 1913, an honorary D.Litt from Oxford in 1924, an honorary Litt.D from the University of Liverpool in 1925, and another from the University of Cambridge in 1934. In 1923, Alexander retired from Manchester. In a speech, he described how proud and happy he was during his time as a professor there, “during which I tried to do my part” (Alexander, cited in Laird 1939: 71)[^laird-1939].
