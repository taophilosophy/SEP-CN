      As we saw above, Alexander argues that humans construct values in response to certain needs or instincts. The final part of *Beauty and Other Forms of Value* identifies the animal origin of our supreme values. For example, there is an analogy to be drawn between the social impulse in humans and in bees. “Naturalism and Value” explains that in the same way that bees’ instinct for finding honey once seemed to be “magical” and yet has been explained by biology in naturalistic terms, similarly values appear to be magical and yet can be explained naturally (Alexander 1939: 282). He goes on to argue that Darwin’s theory of evolution plays an important role in the development of value:
    step1: |-
      如我们上文所见，亚历山大论证，人类为回应某些需要或本能而建构价值。《美与其他价值形式》最后一部分确认了我们最高价值的动物起源。例如，可以在人类与蜜蜂的社会冲动之间作出类比。《自然主义与价值》解释说，正如蜜蜂寻蜜的本能曾显得“神奇”，后来却被生物学以自然主义方式解释；类似地，价值也显得神奇，却可以得到自然解释（Alexander 1939: 282）。他进而论证，达尔文的进化论在价值发展中起重要作用：
