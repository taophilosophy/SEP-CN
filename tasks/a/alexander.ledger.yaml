      An objection to this view is that beauty is not constructed; we might find it in a natural landscape, for example. Alexander replies to this that landscapes and other natural phenomena are rendered beautiful by the parts that we pick out, akin to a photographer composing a picture. As such, the beauty of nature is composed by us (Alexander 1928:149). This entails that there is no difference in kind between natural beauty and art; for more on this, see Alexander’s “Art and the Material” (reprinted in Alexander 1939).
    step1: |-
      对此观点的一个反对意见是：美并非被建构；例如，我们可能在自然风景中发现美。亚历山大回应说，风景与其他自然现象之所以显得美，是因为我们挑出的部分使之如此，类似于摄影师构图。因此，自然之美是由我们构成的（Alexander 1928: 149）。这意味着自然美与艺术之间没有种类差异；关于这一点，另见亚历山大的《艺术与材料》（重印于 Alexander 1939）。
