      Although Alexander remained largely UK-based, in 1882 he travelled to Germany for a year, spending at least some of this time at the University of Berlin, where he became familiar with the physiological psychology of Hermann von Helmholtz. In 1890 he travelled to Freiburg, Germany, to spend roughly another year working in Hugo Münsterberg’s new psychological laboratory.
