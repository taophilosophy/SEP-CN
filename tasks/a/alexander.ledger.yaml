      Alexander’s first publication, “Hegel’s Conception of Nature” (1886), reveals Alexander’s philosophic upbringing in Oxford’s British Hegelian enclave. Alexander aims to set out Hegel’s conception of nature, “so fantastic and so poetical that it may often be thought not to be serious”, as clearly as possible. He also aims to show where it agrees with, and diverges from, contemporary science. The article explains that science leads to a philosophy of nature through observation—for example, transforming seemingly isolated individuals into universals by discovering their general character—and the discovery of laws. Alexander also compares Hegel’s account to contemporary theories of evolution, and argues there is a “great likeness” (Alexander 1886: 518). Arguably, some of the positions that Alexander attributes to Hegel are similar to his own mature views; for example, Alexander reads Hegel as holding that space and time are “in the world” as much as matter (Alexander 1886: 506).
    step1: |-
      亚历山大的首篇发表作品《黑格尔的自然概念》（1886）透露出他在牛津英国黑格尔派圈子的哲学教养。亚历山大力图尽可能清楚地阐述黑格尔的自然概念——它“如此奇幻、如此诗意，常令人以为并不认真”。他还力图指出这一概念在何处与当代科学一致、在何处分歧。文章说明：科学经由观察导向自然哲学，例如通过发现看似孤立的个体的普遍性格而将其转化为共相，并通过发现规律。亚历山大还把黑格尔的说明与当代进化论相比较，论证二者有“极大相似”（Alexander 1886: 518）。可以说，亚历山大归给黑格尔的某些立场与他本人成熟的观点相似；例如，他把黑格尔读作主张空间与时间如同物质一样“在世界之中”（Alexander 1886: 506）。
