      > But why, of the many unsailed seas he must have been tempted to chart, did his insatiable curiosity launch him on a last voyage into the rough waters of aesthetic theory? There is no certain answer to this question. What we do know is that the third person of the hallowed trinity whose members are Truth, Goodness, and Beauty had hitherto been sadly neglected as compared with the first two, and that a treatise on aesthetics was urgently required as the coping stone of a neatly finished philosophical system. Yet it would be a grievous error to suppose that his fondness for the subject was due solely or even mainly to systematic grounds. Art, in its manifold shapes, attracted him irresistibly… [he] wrote and talked about Art because he really loved the pictures, statues, mansions, poems, novels, and plays that are its concrete manifestations. (Listowel 1939: 181)[^listowel-1939]
