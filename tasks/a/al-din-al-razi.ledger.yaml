      Just as “substance” (*ousia*) may rightfully be called the central notion of Aristotelian metaphysics, so is “existence” (*wujūd*) the core notion of Avicennan metaphysics. Ibn Sīnā’s metaphysics is a study of the relationship between different kinds of things and the mode of their existence, which ultimately results in identifying a special, necessary mode of existence, which belongs to one being alone, namely God (see, e.g., Bertolacci 2016)[^bertolacci-2016]. There are two core doctrines of Ibn Sīnā’s metaphysics, both widely discussed after him in the Islamic world, and both addressed by Fakhr al-Dīn in detail: the distinction between essence and existence, and the idea that God is sheer existence, necessary in all respects.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      “Existence” refers for Ibn Sīnā to the very fact that things are, irrespective of what they are. For instance, it is one thing for a red apple to be a red apple, and it is a completely different thing for the red apple to *be*. To establish the distinction between what things are (that is, their essence), and whether they are (that is, their existence), Ibn Sīnā uses an argument from conceivability. We can conceive of a red apple without knowing whether it exists, hence its existence must be different from its essence (*Išārāt*, *namaṭ* 4, 266). But how should we understand this distinction between essence and existence? In the post-Avicennan tradition, there are two main answers to this question: the distinction between essence and existence is real (*ḥaqīqī*) or it is merely conceptual (*iʿtibārī*). The first answer requires that there are two different items outside the mind, which together make up the existent red apple. The second response means that there is just one item in the extramental world, the existent red apple; but we can analyse it conceptually into “existence” and “red apple” (Wisnovsky 2012, Eichner 2011b)[^eichner-2011b][^wisnovsky-2012].
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Within this debate, Fakhr al-Dīn seems to take the realist stance that essence and existence are distinct outside the mind (Benevich 2017)[^benevich-2017]. For instance, he feels compelled to address one of the most pressing issues for the realists. If essence and existence are distinct in reality, does this mean that all essences are already somehow out there before existence attaches to them? Fakhr al-Dīn is not puzzled by that difficulty:
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      > The essence as such (*min ḫayṯu hiya hiya*) is an essence distinct from existence and non-existence. This does not imply the subsistence of something existent in something non-existent (*Arbaʿīn*, vol.1, 88).
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      The essence of the red apple as such (*min ḥaythu hiya hiya*) is indeed prior to its existence. The essences of things, considered as such, are in a different, third state of being, neither existent nor non-existent (*Mabāḥith*, vol.1, 129). Of course, this does not mean that there are essences of red apples hanging around before they even become existent. Just like Ibn Sīnā, Fakhr al-Dīn accepts that essence and existence are extensionally identical: all instances of essence are also instances of existence (Wisnovsky 2012)[^wisnovsky-2012]. But Fakhr al-Dīn offers a realist take on the Avicennan distinction by introducing a clear priority of essence over existence; more recent interpreters disagree as to whether this is faithful to Ibn Sīnā’s own metaphysics (Bertolacci 2012, Benevich 2019b, Janos 2020)[^benevich-2019b][^bertolacci-2012][^janos-2020].
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Fakhr al-Dīn consistently uses his theory of the priority of essence over existence to discuss what Ibn Sīnā considered a special case, God. In Fakhr al-Dīn’s understanding, for Ibn Sīnā, God’s essence is just identical to His existence. For Ibn Sīnā, this would be the only way to guarantee that God exists necessarily. For, if there were any composition at all of *A* and *B*, *A* could fail to be *B*, and *B* could fail to attach to *A*; some further cause would be needed to guarantee the connection between the two. Thus, the only way to secure that *A* is necessarily *B* is just to say that *A* is *B*. That would mean that God’s essence is not even conceptually distinct from God’s existence. There is an obvious problem with this doctrine, however. If God’s essence is sheer existence, but existence also belongs to, for example, a red apple, how is the existence of the red apple different from the divine essence? Ibn Sīnā’s reply depends on the notion of the analogy or modulation (*taskīk*) of existence, whereby one kind of existence belongs to the red apple and another kind belongs to—or rather, just *is*—God (Treiger 2012, De Haan 2015, Druart 2014, Zamboni 2020, Janos 2021)[^druart-2014][^janos-2021][^treiger-2012][^zamboni-2020]. But Fakhr al-Dīn, again much like Duns Scotus almost a century later, refuses to take this route. Instead, he insists on the univocity of existence. Everything that exists, does so in the same manner of existence. Thus Fakhr al-Dīn is also compelled to deny the identity of essence and existence in God’s case. God’s existence will still be necessary, because His essence is such that it implies its own existence. So in God essence is prior to existence. This priority should not bother or indeed surprise us, since we just have learned that *all* essences are prior to their existence. The upshot is that what is special about God is His essence, not a unique kind of existence (*Muḥaṣṣal*, 67; see further Mayer 2003, Benevich 2020a)[^benevich-2020a][^mayer-2003].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      Fakhr al-Dīn’s contribution to history of metaphysics recalls not only Duns Scotus but also Thomas Aquinas. Like Aquinas, he offers a taxonomy of proofs for God’s existence, which becomes standard in philosophy of the Islamic world after him. Fakhr al-Dīn distinguishes between four mains proofs for God’s existence available to him at his time: from the contingency of essences; from the temporal origination (*ḥudūth*) of essences; from the contingency of attributes; and from the temporal origination of attributes. The first argument may be easily identified with Ibn Sīnā’s proof for God’s existence, which establishes the existence of the Necessary Being by reasoning from the contingency of all beings in the world (Marmura 1980; Mayer 2001; Zarepour 2022)[^marmura-1980][^mayer-2001][^zarepour-2022]. The second argument is the *kalām* cosmological argument. It argues for the existence of a Creator based on the fact that the world came to be at some point. The third argument, from the contingency of attributes, alludes to the fact that everything in the world exists in a certain way, while it could have easily been some other way. Therefore, there needs to be some agent that determined how things would exist. Finally, the fourth argument comes closest to what we would designate as a design argument. The attributes of things in the world are not just one way when they could have been different, but are in the best way possible. Hence, there must be a wise agent who chose these marvelous features for the world. Fakhr al-Dīn contends that the first argument, that is, Ibn Sīnā’s argument for the existence of a Necessary Being is more fundamental than all other arguments (*Maʿālim*, 42).
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      So, while disagreeing with Ibn Sīnā whether God’s essence and existence are identical, Fakhr al-Dīn does accept that God is a Necessary Being. Still, probably due to his *kalām* allegiances, he is not ready to accept that God is a necessary being in all respects. For instance, Ibn Sīnā’s God cannot know particular individuals. Knowledge of what is happening right now while you are reading this article would involve a change in God, since He would need to stop knowing that you are reading this sentence as soon as you move on to the next one. But if God changes, then He is not necessary in all respects, since necessity implies immutability. So the only way for God to know what happens in the world is to conceive of universal rules, laws of nature, and causation, without knowing which of those rules are being at work right now (Marmura 2005, Adamson 2005; cf. Acar 2004 and Nusseibeh 2009)[^acar-2004][^adamson-2005][^marmura-2005][^nusseibeh-2009]. Following Abū l-Barakāt and al-Ghazālī, Fakhr al-Dīn rejects this line of reasoning, on the grounds that change in God’s knowledge is merely relational (*Arbaʿīn*, vol.1, 198). Imagine that you are standing still and something passes by you from right to left; in such a case you do not change, but your relation to that moving thing does change. Now, we need to imagine the same with respect to God’s knowledge the chain of events: it passes by God and God observes it, without God essentially changing.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      This account of divine knowledge requires a very specific understanding of knowledge and cognition. Fakhr al-Dīn al-Rāzī, again following Abū l-Barakāt and al-Ghazālī, defines cognition as a relational state (*ḥāla iḍāfiyya*). Fakhr al-Dīn opposes this theory to the representationalist theory of cognition, commonly ascribed to Ibn Sīnā at this time:
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      > Perception does not just come down to the making of an impression. The truth is rather that it is a relational connective state. For we know self-evidently that we have seen Zayd, given that our visual capacity faculty has a certain relation to him. Anyone who claims that the object seen is not Zayd, who exists extramentally and is not seen at all, and that the object seen is rather his representation (*miṯāl*) and likeness (*šabaḥ*), has put into doubt the most important and powerful items of necessary knowledge (*Šarḥ al-Išārāt* vol.2, 233).
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      According to representationalism, cognition involves the inherence of the cognized object in the object of cognition. For instance, when I think of a red apple, the idea of a red apple must be “imprinted” in my mind. For Fakhr al-Dīn, cognition is a direct relation between the agent of cognition and the object of cognition itself, that is, the red apple in itself. Representations—if there are any—are not the objects of cognition (Benevich 2019a, 2020b; Griffel 2021: 341–84)[^benevich-2019a][^griffel-2021].
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      One may wonder how this theory could explain the cognition of non-existent objects. To what does my mind relate when I think of a phoenix, or of a square circle? Ibn Sīnā introduced the notion of mental existence in response to this kind of question. The phoenix may fail to be existent *outside* the mind, but it exists in my mind while I am thinking about it, again being imprinted in my mind (Black 1997)[^black-1997]. Just as Fakhr al-Dīn rejects the representationalist theory of cognition, he consistently rejects the Avicennan notion of mental existence (*wujūd dhihnī*). For him, when I think of non-existent beings, I just think of elements that constitute those beings and are observable in the world. For instance, thinking of a square circle means thinking of a square and a circle as if they were combined (Benevich 2018; on the related issue of the “paradox of the unknown” see Lameer 2014)[^benevich-2018][^lameer-2014].
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      With this relational theory of cognition in hand, Fakhr al-Dīn is able to resolve the puzzle of how God knows about changing things. Objects of cognition are external to the agent of cognition, so that change in those objects and the subsequent change in the process of cognition does not involve any change in the agent. Thus we can say that God is a necessary being, but not necessary in all respects, since His relational cognition of current events is constantly in the process of change. Yet this implies no change in God’s essence. Moreover, we have seen above that Ibn Sīnā suggests that God has knowledge of universal rules of causation and natural laws. Fakhr al-Dīn argues that precisely this kind of knowledge that Ibn Sīnā ascribes to God, that is, the knowledge of universal rules and causation, results in knowing every single event in the world at the time when it happens (*Maṭālib*, vol.3, 163–64).
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Fakhr al-Dīn’s reasoning here presupposes a strictly determinist account of the world. There is a causal explanation for each event, and God knows it. And indeed, Fakhr al-Dīn is willing to embrace determinism fully. For instance, with respect to human actions, he argues that they are determined by the combination of our motivations, beliefs, and capacities. We do not have control over any of these (as we saw in Section 1, Fakhr al-Dīn insists that our beliefs are not up to us); so we do not have any control over our actions either (*Maṭālib*, vol.9, 35–43). There are two important premises underlying Fakhr al-Dīn’s determinism, both borrowed from Ibn Sīnā. One is that there must be, for everything that exists but could have failed to exist, some reason why it exists; this is said to “preponderate” the thing to exist rather than not existing. Second, when that reason is present, the phenomenon must inevitably happen. Therefore, in the presence of our capacities and motivations, we have no choice but to act, and do so necessarily (*Maṭālib*, vol.9, 21–23; *Mabāḥith*, vol.2, 517; on al-Rāzī’s theory of action see further Shihadeh 2006)[^shihadeh-2006].
    step1: TBD
    step2: TBD
