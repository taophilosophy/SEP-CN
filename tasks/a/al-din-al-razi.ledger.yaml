      Fakhr al-Dīn’s decision to devote such a detailed commentary to a work by Ibn Sīnā is historically revealing. While his contemporary Sharaf al-Dīn al-Masʿūdī (d. before 1204) did compose a set of *Doubts* (*Shukūk*) on the same text, the commentary of al-Rāzī on *al-Ishārāt* seems to be the first lemmatized exegesis of an Arabic philosophical work (see also Wisnovsky 2013, Shihadeh 2014 and 2017)[^shihadeh-2014][^shihadeh-2017][^wisnovsky-2013], as had been devoted to Aristotle in late antiquity and earlier Arabic philosophy. Even a casual perusal of Fakhr al-Dīn’s corpus makes clear that he has identified Ibn Sīnā as the chief representative of *falsafa*, a word which is most naturally translated “philosophy” (since it is likewise derived from the Greek *philosophia*) but which really has a narrower meaning in this period, since it is so closely tied to Ibn Sīnā’s distinctive teachings. To be a *faylasūf* is to uphold such doctrines as the necessary and eternal emanation of the universe from God. (A more generic word for the discussion of such issues, without any particular doctrinal commitment, would be *ḥikma*, literally meaning “wisdom”; see Griffel 2021.)[^griffel-2021] While Fakhr al-Dīn follows his famous predecessor and fellow Ashʿarite al-Ghazālī (d. 1111) in targeting Ibn Sīnā as the outstanding exponent of *falsafa*, he does not go along with al-Ghazālī’s idea that the *falāsifa* were heretics and apostates from Islam.
