      When he writes the *Mulakhkhaṣ*, by contrast, he is coming around to the view that beforeness and afterness are “items of consideration” (*umūr iʿtibāriyya*). Yet at the end of his career, he has adopted the contrary view. Now he endorses what he says is Plato’s view of time: it is “a substance subsisting in itself and independent in itself” (*Maṭālib* vol.6, 76). The allusion to Plato presumably refers to the *Timaeus*. He is apparently following his fellow philosopher of Rayy, Abū Bakr al-Rāzī, both in accepting the independence of time and place and in seeing Plato as an authority for that physical theory (Adamson 2021a: ch.5)[^adamson-2021a]. One difference between the two Rāzīs, however, is that Fakhr al-Dīn makes it clear that time and place are both created by God, and not “eternal” principles. Thus his overall account of physics envisions a created spatio-temporal framework within which bodies may, but need not, exist.
