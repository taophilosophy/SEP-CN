      By using this “dialectical” procedure (Wisnovsky 2004, Shihadeh 2005, Griffel 2011)[^griffel-2011][^shihadeh-2005][^wisnovsky-2004] Fakhr al-Dīn is able to stand in judgment over the whole historical tradition leading up to him. Alongside Ibn Sīnā and other philosophers, notably the slightly earlier Abū l-Barakāt al-Baghdādī (d. 1160s), the *kalām* tradition supplies him with a stock of positions and arguments to rehearse and critique. He will thus frequently refer in the third person to “theologians (*mutakallimūn*)”, as if this were a group that does not include him. The upshot is that Fakhr al-Dīn puts himself forward as the arbiter in debates that span the *falsafa-kalām* divide. If he is not consistent in adopting one or another teaching himself (many times, a lengthy investigation in his works ends with only a brief statement of the likeliest answer, or none at all, followed with a pious “but God knows best”), this is perhaps because the exhaustive method of testing arguments and doctrines is more important to him than the assertion of any one doctrine.
    step1: |-
      凭借这种“辩证”程序（Wisnovsky 2004, Shihadeh 2005, Griffel 2011）[^griffel-2011][^shihadeh-2005][^wisnovsky-2004]，法赫尔丁得以对他之前的整个历史传统作出裁断。除伊本·西那与其他哲学家——尤其是稍早的阿布·巴拉卡特·巴格达迪（卒于 1160 年代）——之外，凯拉姆传统也为他提供了一批可供演练与批判的立场与论证。因此他会时常以第三人称提到“教义学家（mutakallimūn）”，仿佛这个群体不包括他本人。结果是，法赫尔丁把自己摆在了横跨法尔萨法-凯拉姆分野的辩论的仲裁者位置。他若在采纳某一学说上并不一致（许多时候，其著作中长篇考察的结尾只有一句最可能答案的简短陈述，甚至没有，而代之以一句虔诚的“但神最知”），这也许是因为，检验论证与学说的穷尽性方法对他而言，比断言某一具体学说更重要。
