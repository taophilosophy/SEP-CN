      Void is defined either as a case in which two bodies fail to be in contact, with no body between them (*Arbaʿīn* vol.2, 32) or as a space that has nothing placed within it (*Maṭālib* vol.5, 155). Physical arguments provide evidence that void is in fact not just possible but actually occurs, as when two flat surfaces are pulled apart: it will take some time, however minimal, until air rushes in to fill the empty space (*Arbaʿīn* vol.2, 35). The second definition of void just mentioned brings us to Fakhr al-Dīn’s notion of space or place, and already suggests his view that place is not dependent on bodies, as Ibn Sīnā had claimed (Adamson 2017)[^adamson-2017]. For Ibn Sīnā, following Aristotle, place is the inner boundary of a containing body, for example the interior surface of a jug that surrounds the water placed in the jug (Lammer 2018: §5.3)[^lammer-2018]. Fakhr al-Dīn subjects this conception to a barrage of criticisms, for example that a jewel inside a bag would remain in the same “place” even as it is being transported between cities (*Maṭālib* vol.5, 147). Instead, place is for him indeed “space” (*faḍāʾ*, *ḥayyiz*), which is independent of bodies and may be either occupied by a body or not.
    step1: |-
      虚空或者定义为两个物体不相接触且中间无物（《四十问》卷 2，32），或者定义为其中没有放置任何东西的空间（《至高论题》卷 5，155）。物理论证提供的证据表明，虚空不仅可能，而且实际发生：例如把两个平面拉开时，要过一段时间——无论多么短暂——空气才会冲进来填满空出的空间（《四十问》卷 2，35）。刚才提到的虚空第二定义，把我们引到法赫尔丁关于空间或地点的概念，且已经暗示他的观点：地点不依赖于物体——这与伊本·西那的主张相反（Adamson 2017）[^adamson-2017]。对伊本·西那（追随亚里士多德）而言，地点是包容物体的内边界，例如包围壶中之水的壶的内表面（Lammer 2018: §5.3）[^lammer-2018]。法赫尔丁对这一构想加以一连串批评，例如：袋中宝石在城与城之间运送时，将始终处于同一“地点”（《至高论题》卷 5，147）。对他而言，地点其实是“空间”（faḍāʾ、ḥayyiz），独立于物体，可被物体占据，也可不被占据。
