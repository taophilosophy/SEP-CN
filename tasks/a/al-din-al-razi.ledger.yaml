  - id: 5
    kind: body
    source: |-
      Despite his extensive travels and political maneuvering, Fakhr al-Dīn found time to compose a startlingly large body of work. Many will associate his name most immediately with his titanic *Great Commentary on the Quran* (also called *Keys to the Hidden*: *Mafāṭih al-ghayb*). The modern printing runs to no fewer than 32 volumes (here it is almost obligatory to cite Ibn Taymiyya’s barb that the work “contains everything apart from exegesis of the Quran”). Fakhr al-Dīn wrote extensively on law, theology, and “occult sciences” like magic and astrology. As can be learned from studies of his Quranic commentary (Jaffer 2015)[^jaffer-2015] and a treatise of his on the occult disciplines (Noble 2021)[^noble-2021], every work of Fakhr al-Dīn al-Rāzī can be profitably read with his philosophical interests in mind. But in this overview we will largely restrict our focus to the theological-philosophical treatises that are of most evident importance for the historian of philosophy. Scholars sometimes refer to these as *summae*, which suggests a parallel with Latin scholastic works like those by Thomas Aquinas. The comparison is not misleading, insofar as Fakhr al-Dīn was avowedly a theologian, but one who pursued philosophical problems at length and with great sophistication.
    step1: |-
      尽管游历广泛、政治周旋不断，法赫尔丁仍抽时间写出数量惊人的著作。许多人一提到他的名字，最先想到的便是那部体量巨大的《古兰经大注》（又名《幽玄之钥》：Mafāṭīḥ al-ghayb）。现代印本不下 32 卷（此处几乎必须引伊本·泰米叶的讥评：此书“除《古兰经》注疏之外，无所不包”）。法赫尔丁大量撰写法学、教义学以及魔法、星占之类“秘术”之作。从对其《古兰经》注疏的研究（Jaffer 2015）[^jaffer-2015]及其论秘术学科的专文（Noble 2021）[^noble-2021]可以看出，法赫尔丁·拉齐的每一部作品，都可以带着他的哲学关切来读而有所得。但本文大体上只聚焦于对哲学史家显然最重要的神学-哲学论著。学者有时称之为“大全”（summae），这暗示其与托马斯·阿奎那之类拉丁经院著作的平行。这一比较不算误导，因为法赫尔丁公开以教义学家自居，但又是长期而极为精细地钻研哲学问题的人。
