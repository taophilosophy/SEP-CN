      ## 6. Ethics
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      One passage which makes that point is found in his *Book on the Soul and Spirit* (*Kitāb al-Nafs wa-l-rūḥ* 86–7): humans differ so much in their character traits that one may suspect they do not all share the same essence. That exemplifies the approach of this separate treatise, which is to stage a joint inquiry into ethics and the soul. One theme addressed here is the improvement of our “character traits (*akhlāq*)”. This is hardly surprising: the centrality of this concept in Arabic moral thinking was such that ethics itself was referred to as *ʿilm al-akhlāq* (literally, “the science of character traits”). And philosophers both before Fakhr al-Dīn, like Miskawayh (d.1040) and Yaḥyā Ibn ʿAdī (d.974), and after him, like Naṣīr al-Dīn al-Ṭūsī (d.1274), put character traits in both the thematic focus of their writings on ethics and the titles of those writings. These works are part of a broadly Aristotelian tradition of virtue ethics, which encourages readers to pursue excellent rather than base character. Ibn Sīnā also contributed to this tradition, as in two short works called *On Ethics* (again*, Fī l-ʿilm al-akhāq*) and *On Governance* (*Fī l-Siyāsa*; for Ibn Sīnā’S influence on later practical philosophy see Kaya 2014)[^kaya-2014].
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Fakhr al-Dīn was of course aware of this approach to ethics, and took an interest in the topic of virtue (al-Shaar 2012). But he was no Aristotelian. Historically, we can say that he responds more to *kalām* ethics; philosophically, we can say that he was a consequentialist rather than a virtue theorist (for this the essential reading is Shihadeh 2006; see also his 2016)[^shihadeh-2006]. Taking the historical point first, as an Ashʿarite he is committed to what would now be called a “divine command theory”. That is, the right action is whatever is commanded by God, the wrong action is whatever is forbidden. The Ashʿarite stance emerged as a critique of the Muʿtazilite position, which holds that certain types of action are known to be wrong without recourse to revelation, for example lying. We can always imagine circumstances in which “intrinsically wrong” action types turn out to be right after all, like lying to a tyrant to avoid betraying a prophet (*Arbaʿīn* vol.1, 348). Therefore this Muʿtazilite theory is untenable.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Fakhr al-Dīn’s early works uphold a straightforward divine command theory. But he comes to pair this with a hedonist and consequentialist ethics, which assumes that pleasure is good for humans and pain bad. To avoid a regress of normative explanation, there must be some fundamental norm, and in Fakhr al-Dīn’s view hedonism provides that norm. The connection between hedonism and Ashʿarite ethics is that God has promised us pleasure if we follow His commands, and pain if we do not. Thus, the divine command theory turns out to be justified on egoistic, consequentialist grounds (Shihadeh 2016: 66)[^shihadeh-2016]. This also opens the prospect for determining what we should do in the absence of a divine command: whatever is “beneficial”, in other words pleasure-maximizing for the agent. Because pleasure is now so central to his ethical theory, he devotes significant attention to its nature, refuting the originally Platonic “restoration theory” according to which all pleasure is a return to a natural state from a harmful or painful state (*Sharḥ* vol.2, 552–4). This analysis might apply to the base pleasures of food or sex, but would not hold for higher pleasures like the grasping of knowledge (see his *Epistle Censuring the Pleasures of this World*, in Shihadeh 2016)[^shihadeh-2016].
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      If we again take his late work, the *Maṭālib*, as our best evidence for Fakhr al-Dīn’s final philosophical views, then we can infer that he retained his commitment to consequentialism. Characteristically, he itemizes arguments against his own position and refutes them one by one (*Maṭālib* vol.3, 66–9). For example, you might encounter an ill person in a wasteland where no one else is around to see, and help them. What pleasure are you getting out of this? None, it would seem, yet you would and should do it nonetheless. Fakhr al-Dīn explains that you would be acting on the principle that, if you were in the same position as the unfortunate person, you would want to be treated in the same way. This is not an appeal to some kind of Kantian categorical imperative, but more like what we now call “rule utilitarianism”. That is, we should act in such a way that if people in general acted like this, pleasure would be maximized and pain minimized (for a similar interpretation see Shihadeh 2016: 80, who emphasizes that the motivation is “neither altruistic nor based on a sense of duty… but is a self-centred, prudential motivation”)[^shihadeh-2016].
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      This example shows that Fakhr al-Dīn was not simply reacting to Avicennan *falsafa* by rehearsing an Ashʿarite *kalām* view (though he does also refute Ibn Sīnā’s proposal, inspired by Neoplatonism, that evils are cases of non-being). He also applied his philosophical acuity to reflect on, and modify, the Ashʿarite position. In the later tradition he was sometimes accused of adopting skepticism. A representative anecdote has him weeping after being disabused of something he had formerly taken as certain truth and lamenting, “what is there to prove that all my beliefs are not of this nature?” (quoted at Kholeif 1966: 18)[^kholeif-1966]. The impression of skepticism could also be encouraged by his tendency to provide only a minimal verdict, or no verdict at all, at the end of a lengthy dialectical investigation of some issue. This is something else that annoyed later readers: the sheer accumulation of arguments he offered for unacceptable views was dangerous, even if refutations of these arguments were given thereafter. And it does seem that he saw certain demonstration as being impossible on many theological and philosophical issues. But he was not a global skeptic. As discussed above, he had views about what it would mean to have knowledge, and assumed that knowledge is indeed attainable. His massive and still inadequately explored corpus testifies to his determination to attain that knowledge like no one else in his time, and thus to supplant Ibn Sīnā as the indispensable thinker of the Islamic world.
