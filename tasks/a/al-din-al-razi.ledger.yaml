      ## 5. Psychology
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      A fundamental assumption of Aristotelian psychology is that the souls of all living things are characterized by a range of “powers” or “faculties” (Greek *dunameis*, Arabic *quwan*). These powers account for the distinction between plants, animals, and humans: plants have the “vegetative” powers of nutrition, growth, and reproduction; animals the powers of sensation, locomotion, and imagination; humans alone (among embodied beings) have the power of reason or intellect. Ibn Sīnā made significant alterations to this scheme, not least by introducing a theory of “internal senses” to account for cognitive capacities lying between sensation and full-blown intellection. But broadly speaking, he adhered to the tradition of faculty psychology. Fakhr al-Dīn’s earlier contemporary Abū l-Barakāt al-Baghdādī rejected this whole approach. For him the soul is a unity and is the single subject of all cognition (Kaukua 2016)[^kaukua-2016].
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      Fakhr al-Dīn agrees, and in several of his works offers arguments intended to confirm Abū l-Barakāt’s thesis. The most powerful of these is that the soul is capable of what we might call “hybrid judgments”. These are modeled on the sort of case considered already by Aristotle, that honey is both white and sweet: here vision and taste might seem to be making a judgment about the same object, suggesting that they belong to a single subject, which could be the entire soul. Such is Aristotle’s commitment to faculty psychology, though, that he instead introduces a new power within the soul (the “common sense”) to take responsibility for judgments that involve more than one sense modality. Or at least, this is how he was understood in the later tradition.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Fakhr al-Dīn argues, however, that the same pattern repeats across all the faculties. For example, Ibn Sīnā had drawn a strict contrast between the human intellect and the lower cognitive faculties, on the grounds that the former grasps universals while the latter powers—from sensation to imagination and memory—deal only with particulars. But, says Fakhr al-Dīn, we are able to apply a universal to a particular (“Zayd is human”). It must be the unified soul that is responsible for such judgments:
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      > When we perceive a particular individual human, we know that he is a particular belonging to the universal “human” and not a particular belonging to the universal “horse”. That which judges a particular man to be a particular belonging to the universal “human” and not a particular belonging to the universal “horse”, must inevitably be perceptive of the particular man, the universal “human”, and the universal “horse”. And so that which perceives particulars is also that which perceives universals (*Mabāḥith* vol.2, 255; 345–6; *Sharḥ al-Ishārāt* vol.2, 265–7; the unity of the soul is discussed in depth at *Maṭālib* vol.7, 159ff).
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Another point, which again is taken over from Abū l-Baghdādī, is that the human soul at least has a kind of “first person perspective” on its cognitive actions. It is capable of grasping itself directly—as argued by Ibn Sīnā himself in his famous “flying man” argument—and of grasping itself as the subject of all its cognitions. Note that, since these arguments all turn on active cognition, Fakhr al-Dīn is willing to exempt the non-cognitive vegetative powers from this unified soul (*Mabāḥith* vol.2, 256–7). But there is no division of powers distinguishing the “animal soul” from the rational soul that is distinctive of humans.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      This does not stop Fakhr al-Dīn from using Ibn Sīnā’s method for proving that the human soul is an immaterial substance (Adamson 2021b, Alpina 2021)[^adamson-2021b][^alpina-2021]. Ibn Sīnā’s proof inferred the rational soul’s nature from the nature of its objects: since it grasps indivisible intelligible forms, it must itself be indivisible, and therefore not a body. In this case Fakhr al-Dīn chooses not to refute the Avicennan line of argument but to improve upon it, by adding further arguments to show that intelligibles are indeed indivisible (*Mabāḥith* vol.2, 362–5, also *Sharḥ* vol.2, 285–8). He does still worry that the argument is incomplete: the rational soul could be indivisible but not immaterial if it were an atom (*Maṭālib* vol.7, 62), so the cogency of the argument will depend on showing that atomism is incoherent (see above, Section 3). And even if we reject atomism, Avicennan prime matter is arguably also indivisible (*Sharḥ* vol.2, 295). Still Fakhr al-Dīn seems to be at least well-disposed towards the idea that the soul’s ability to grasp intelligibles establishes its immateriality.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Since this ability belongs to the entire, unified soul and not is just one “faculty” that could exist on its own as a disembodied mind, this should secure immateriality, and hence the prospect of immortality, for the human soul. When he speaks about the nature of the human soul, he sometimes says that it is a luminous substance that fuses with the body like rosewater in rose petals or oil in sesame, which seems to make it a kind of very subtle body but not, he says, like those perceptible to the senses (for passages see Jaffer 2015: 192)[^jaffer-2015]. But it other contexts, Fakhr al-Dīn seems to be ready to embrace full-fledged substance dualism. For this conclusion he typically uses argumentation based on introspection, such as his version of Ibn Sīnā’s Flying Man argument, or the immediate awareness of personal identity over time (see, e.g., *Maṭālib*, vol.7, 101; 105).
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      What about animal souls? The arguments presented so far clearly blur the sharp distinction that Ibn Sīnā and other *falāsifa* drew between human and animal souls. But Fakhr al-Dīn goes further. In both his *Mulakhkhaṣ* and his *Maṭālib* he suggests that non-human animals have intelligence that is not different in kind from human rationality (Adamson & Somma forthcoming, Virgi 2022)[^virgi-2022]. Animals are self-aware, know that they persist through time, grasp universals, and can make plans and solve problems. This does not necessarily mean that animals are equal to humans in their intelligence. Rather there may be a continuum of cognitive capacities, with some animals ranged further away from humans, others closer to them. But
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      > if what is meant by “reason” is any of the types of intelligence, then this intelligence should be attributed to [non-human] animals. (*Maṭālib* vol.7, 311)
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      He may have found this view plausible in part because, again following Abū l-Barakāt, he is open to the idea that even just within the human “species” we have differences that amount to distinctions in quiddity (*Maṭālib* vol.7, 141). So from this point of view too, there is little reason to embrace a stark opposition between human and non-human animal nature.
