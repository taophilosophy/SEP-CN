      Fakhr al-Dīn complements this picture with his critique of definitions, a rejection of the intentional acquisition of knowledge through conceptualization (Falaturi 1969, Ibrahim 2013, Özturan 2018, Jacobsen Ben Hammed 2020, Benevich 2022a)[^benevich-2022a][^falaturi-1969][^ibrahim-2013][^jacobsen-2020][^özturan-2018]. According to the traditional Aristotelian epistemology, wholly embraced by Ibn Sīnā, we know what a human is by acquiring a complete definition of the essence of what it means to be a human, through a combination of all inherent generic and specific aspects, for instance “being an animal” and “being rational”. Fakhr al-Dīn denies that this is how we learn what things are. For him, as for his contemporaries Abū l-Barakāt and al-Suhrawardī, the best that we can hope to achieve with the traditional Aristotelian-Avicennan approach is a nominal definition, the explication of a meaning we have in our minds (*Muḥaṣṣal*, 84; *Mulakhkhaṣ*: *Manṭiq*, 106). By defining humans as “rational animals”, we do not learn anything new about real humans. Rather, we just explain what we meant by “humans” in the first place.
    step1: |-
      法赫尔丁以一种对定义的批判，补足这幅图景：他拒斥通过概念化有意获取知识（Falaturi 1969、Ibrahim 2013、Özturan 2018、Jacobsen Ben Hammed 2020、Benevich 2022a）[^benevich-2022a][^falaturi-1969][^ibrahim-2013][^jacobsen-2020][^özturan-2018]。按伊本·西那全盘接受的亚里士多德式传统认识论，我们通过获得关于“人之所以为人”之本质的完整定义，即综合一切固有的属与种差方面（例如“是动物”与“是有理性的”），而知道人是什么。法赫尔丁否认我们就是这样认识事物的。他与其同时代人阿布·巴拉卡特、苏赫拉瓦尔迪一样认为，用传统的亚里士多德-阿维森纳进路，我们最多只能得到名义定义，即对我们心中已有之含义的阐明（《精要》，84；《纲要·逻辑学》，106）。把人定义为“理性动物”，我们并没有学到关于现实之人的任何新东西；我们只是解释了最初说“人”时意指什么。
