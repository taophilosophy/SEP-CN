      Another important contribution in logic is Fakhr al-Dīn’s distinction between two readings of the subject term of a proposition: externalist (*khārijī*) and essentialist (*ḥaqīqī*). When we say “Every *A* is *B*” on the externalist reading, we mean that every single thing which actually happens to be *A* in the real world is *B*. On the essentialist reading, “Every *A* is *B*” means “everything, were it to be described as *A*, would be *B*” (*Mulakhkhaṣ: Manṭiq*, 141–42). The distinction between the externalist and the essentialist reading is Fakhr al-Dīn’s response to the earlier Arabic discussions of the subject term by al-Farābī and Ibn Sīnā. Al-Farābī was credited with the ampliation of the subject term to the possible. In other words, for him, “Every *A* is *B*” means “everything that is possibly *A*, is *B*”. Ibn Sīnā was more restrictive: “Every *A* is *B*” means “everything that is actually *A*, is *B*”. This need not mean “everything that actually is *A* in *the real world*” but can also refer to whatever is actually described as *A* in the mind (Street 2005, 2010, 2014, and 2016, cf. Chatti 2016)[^chatti-2016][^street-2005]. Fakhr al-Dīn’s distinction between the essentialist and the externalist readings of the subject term may be a reaction to Ibn Sīnā’s ampliation of the subject term to include the mental realm. As we will see in Section 4, Fakhr al-Dīn denies mental existence, and hence requires different formulation for the readings of the subject term that do not refer to real-world actuality.
    step1: |-
      逻辑学上的另一项重要贡献，是法赫尔丁对命题主词两种读法的区分：外延读法（khārijī）与本质读法（ḥaqīqī）。按外延读法说“每个 *A* 都是 *B*”，意思是现实世界中每一个恰好是 A 的东西都是 B。按本质读法，“每个 *A* 都是 *B*”意为“任何东西，若被描述为 A，就会是 B”（《纲要·逻辑学》，141–42）。外延读法与本质读法之分，是法赫尔丁对法拉比与伊本·西那早先关于主词之讨论的回应。法拉比被认为是把主词扩及可能者：换言之，对他而言“每个 *A* 都是 *B*”意为“每一个可能是 A 的东西都是 B”。伊本·西那限制更严：“每个 *A* 都是 *B*”意为“每一个实际上是 A 的东西都是 B”。这不必指“现实世界中实际是 A 的一切”，也可指心中实际被描述为 A 的一切（Street 2005, 2010, 2014, 2016；参 Chatti 2016）[^chatti-2016][^street-2005]。法赫尔丁对主词本质读法与外延读法的区分，也许是回应伊本·西那把主词扩及心灵领域之举。正如我们将在第 4 节看到，法赫尔丁否认心灵存在，因而需要对主词读法另作表述，不指涉现实世界中的实际性。
