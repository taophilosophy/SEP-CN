      We find a parallel between this idea about space and his account of time (Setia 2008, Adamson 2018b, Adamson & Lammer 2020)[^adamson-2018b][^adamson-2020][^setia-2008]. For Ibn Sīnā time is a measure of motion (ʿAbd al-Mutaʿāl 2003, McGinnis 2003 and 2008)[^abd-2003][^mcginnis-2003][^mcginnis-2008]. In the first instance it is the measure of the motion of the outermost heaven, since this is the fastest motion in the cosmos, which accounts for the apparent diurnal rotation of the fixed stars around the Earth. This, for Fakhr al-Dīn, is the “peripatetic” account of time. In his *Maṭālib* he refutes it and also a variant of the view found in Abū l-Barakāt, according to which time is the measure of *existence* rather than motion. Fakhr al-Dīn does at least agree that time is real. To establish this he cites an old *kalām* idea that time offers a coordination between independent events (*Mabāḥith* vol.1, 761; *Maṭālib* vol.5, 47), which is why it is possible for me to arrange to meet with you tomorrow (one event) when the sun rises (another event). But time’s existence is not supervenient on motions or cases of existence. Were that the case, then we would have multiple, simultaneous times for the various motions, which would need a superordinate time to coordinate them.
    step1: |-
      关于空间的这一想法，与他对时间的论述形成平行（Setia 2008、Adamson 2018b、Adamson & Lammer 2020）[^adamson-2018b][^adamson-2020][^setia-2008]。对伊本·西那而言，时间是运动的度量（ʿAbd al-Mutaʿāl 2003、McGinnis 2003 与 2008）[^abd-2003][^mcginnis-2003][^mcginnis-2008]。首先，它是最外层天体之运动的度量，因为那是宇宙中最快的运动，正是它解释了恒星围绕地球的视周日旋转。在法赫尔丁看来，这是“逍遥学派”的时间观。在《至高论题》中他反驳了这一观点，以及阿布·巴拉卡特的变体——按后者，时间是存在的度量而非运动的度量。法赫尔丁至少同意时间是实在的。为确立这一点，他引用凯拉姆旧说：时间使各自独立的事件得以协调（《东方探究》卷 1，761；《至高论题》卷 5，47）。正因为此，我才能约定明天太阳升起时（另一事件）与你会面（一个事件）。但时间的存在并不随附于运动或存在之事。若是那样，各种运动就会各有多个同时的时间，而这些时间又需要一个更上位的时间来协调。
