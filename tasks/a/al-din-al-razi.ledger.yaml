      法赫尔丁·拉齐（Fakhr al-Dīn al-Rāzī，1149–1210）是所谓“后古典”伊斯兰思想第一阶段最具创新性与影响力的思想家之一。他与十二世纪伊斯兰东方的其他重要思想家——尤其是阿布·巴拉卡特·巴格达迪与苏赫拉瓦尔迪——一道，对伊本·西那（阿维森纳）的哲学作出了批判性回应。他著述宏富，往往难以从中辨认法赫尔丁本人深思熟虑的见解，但其中充满对伊本·西那思想几乎各个方面的细致哲学论证。法赫尔丁也确实提出了自己的独特立场，例如在提供实在定义的问题上、在本质与存在的区分上、在物理学原理上、在人的灵魂的统一性上，以及在伦理规范的来源上。这些丰硕的哲学产出只是他毕生事业的一部分；其著作还包括伊斯兰法、教义学、星占学之作，以及历史上最重要的《古兰经》注疏之一。
