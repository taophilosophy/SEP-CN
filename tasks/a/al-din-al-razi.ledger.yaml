      How can we learn something new if we do not even know what to look for; and if we already know what we are looking for, what sense does it make to learn something new about it? Al-Fārābī and Ibn Sīnā mostly accepted the Aristotelian solution to the paradox, namely that we can know something in one respect, and inquire into it and learn something new about it in another respect (Black 2008, Marmura 2009)[^black-2008][^marmura-2009]. Fakhr al-Dīn rejects this solution, on the grounds that the problem may be applied to each aspect individually. If we do not know one aspect but already know another aspect, new inquiry is impossible for both, with the two aspects falling prey to the two different horns of the paradox.
    step1: |-
      如果我们连要找什么都不知道，又怎能学到新东西？而如果我们已经知道要找什么，再对它学点什么又有什么意义？法拉比与伊本·西那大体接受亚里士多德对这一悖论的解决：我们可以在一个方面知道某物，而在另一个方面对它探究并学到新东西（Black 2008、Marmura 2009）[^black-2008][^marmura-2009]。法赫尔丁拒斥这一解决，理由是：问题可逐一施于每个方面。假如我们不知某一方面而已知另一方面，那么对两者而言新的探究都不可能——两个方面分别落入悖论的两个犄角。
