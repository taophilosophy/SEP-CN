      Instead, he seems to welcome the powerful challenge posed by Ibn Sīnā’s thought, since it gives him something worthy of his own considerable critical acumen and helps him to map out the wide range of issues tackled in his *summae*. These fall into the domains of logic, physics, psychology, ethics, and above all, metaphysics (general survey in Zarkān 1963)[^zarkān-1963]. Indeed Fakhr al-Dīn used metaphysics to restructure the curriculum of the sciences, something we especially see in his *Mulakhkhaṣ* (Eichner 2007, 2009)[^eichner-2007]. This work adopts a new arrangement, which would be influential on later thinkers. Fakhr al-Dīn first tackles logic, then “generalities (*al-umūr al-ʿāmma*)”, then natural philosophy, and finally philosophical theology. The second and fourth parts of the project correspond to what is called general and special metaphysics in the Latin scholastic tradition, and the parallel does not end there. Like Duns Scotus, Fakhr al-Dīn offers an analysis of existence (the central case of a metaphysical “generality”) by way of disjunction, e.g., existence may be one or many, necessary or contingent, infinite or finite, self-sufficient or dependent, etc. While these contrasts are largely drawn from Ibn Sīnā, Fakhr al-Dīn innovates with his systematic use of the disjunctions to structure general metaphysics. This also means, as we will see below, that his discussions of metaphysics are by no means restricted to raising and answering questions about God, as we might expect from a “theologian”.
    step1: |-
      相反，他似乎欢迎伊本·西那思想提出的有力挑战，因为这给了他值得施展其相当批判才华的对象，并帮助他勾勒出其《大全》所处理的广泛论题。这些论题分属逻辑学、物理学、心理学、伦理学，而首先是形而上学（总体概览见 Zarkān 1963）[^zarkān-1963]。事实上，法赫尔丁用形而上学重构了科学课程，这一点在《纲要》中尤为可见（Eichner 2007, 2009）[^eichner-2007]。该书采用一种新编排，对后世思想家颇有影响。法赫尔丁先处理逻辑学，然后是“一般事项（al-umūr al-ʿāmma）”，再是自然哲学，最后是哲学神学。该计划的第二与第四部分，对应于拉丁经院传统所谓的一般形而上学与特殊形而上学，平行还不止于此。与邓斯·司各脱一样，法赫尔丁以析取方式分析存在（形而上学“一般事项”的核心情形），例如：存在可以是一或多、必然或偶然、无限或有限、自足或依赖，等等。这些对子大多取自伊本·西那，但法赫尔丁的创新在于系统运用析取来结构一般形而上学。这也意味着（详见下文），他对形而上学的讨论绝不限于提出并回答关于神的问题——那样倒符合我们对“教义学家”的预期。
