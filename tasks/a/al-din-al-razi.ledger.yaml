      The fundamental distinction in *kalām* physics is that between the atomic substance (*jawhar*) or “indivisible part”, on the one hand, and the accidental properties (*aʿrāḍ*) that belong to these atoms, on the other hand (Dhanani 1994, Sabra 2006)[^dhanani-1994][^sabra-2006]. As far back as the initial reception of Greek philosophy into Arabic, *falāsifa* like al-Kindī (in a lost work) had rejected atomism in favor of Aristotelian continuism. This is the view that every part of every body, no matter how small, can in principle be divided into yet smaller sub-parts. Ibn Sīnā was also a strong opponent of atomism (Lettinck 1988, McGinnis 2013, Dhanani 2015)[^dhanani-2015][^lettinck-1988][^mcginnis-2013], and his arguments provoked discussion in a number of twelfth century authors (see, e.g., McGinnis 2019)[^mcginnis-2019]. Fakhr al-Dīn is thus joining a long-running debate when he addresses the cogency of atomism. His statements on the question present a typically confusing picture. He seems to reject atomism in his “philosophical” (*falsafī*, *ḥikmī*) works, only to accept it in his *kalām* works (Zarkān 1963: 67–98)[^zarkān-1963]. However his late *summa*, the *Maṭālib*, may show that he came to embrace *kalām* atomism as his own considered view (Dhanani 2015; see also Setia 2004 and 2006, and Baffioni 1982: 211–75; for his opposition to hylomorphism see Ibrahim 2020)[^baffioni-1982][^dhanani-2015][^ibrahim-2020][^setia-2004][^setia-2006].
    step1: |-
      凯拉姆物理学的基本区分，是原子实体（jawhar）或“不可分部分”与属于这些原子的偶性（aʿrāḍ）之间的区分（Dhanani 1994, Sabra 2006）[^dhanani-1994][^sabra-2006]。早在希腊哲学传入阿拉伯之初，金迪等法拉萨法就已拒斥原子论，转向亚里士多德式连续论。连续论认为，每一个物体的每一部分，无论多小，原则上都可再分为更小的子部分。伊本·西那也是原子论的坚决反对者（Lettinck 1988, McGinnis 2013, Dhanani 2015）[^dhanani-2015][^lettinck-1988][^mcginnis-2013]，其论证引发十二世纪若干作者的讨论（见如 McGinnis 2019）[^mcginnis-2019]。因此，法赫尔丁讨论原子论是否成立，是加入一场旷日持久的辩论。他在这个问题上的陈述呈现出典型的混乱图景：他似乎在其“哲学性”（falsafī、ḥikmī）著作中拒斥原子论，却在其凯拉姆著作中接受它（Zarkān 1963: 67–98）[^zarkān-1963]。不过，他晚年的《大全》即《论题》（Maṭālib），也许表明他最终把凯拉姆原子论接受为自己深思熟虑的观点（Dhanani 2015；另见 Setia 2004 与 2006，Baffioni 1982: 211–75；关于他对质料形式论的反对，见 Ibrahim 2020）[^baffioni-1982][^dhanani-2015][^ibrahim-2020][^setia-2004][^setia-2006]。
