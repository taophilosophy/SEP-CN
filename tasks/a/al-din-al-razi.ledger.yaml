      In the Islamic world, representatives of *falsafa* largely accept the traditional Aristotelian presentation of the manner of the acquisition of knowledge. This is the Peripatetic *Organon*, which starts from the predicables and moves through syllogistic to demonstrative science and essential definitions. Fakhr al-Dīn, however, presents a different structure for logic and epistemology, which leaves the traditional organization of the *Organon* behind. The new structure revolves around two ways of acquiring knowledge, conceptualization (*taṣawwur*) and assent (*taṣdīq*) (El-Rouayheb 2019: 29). “Conceptualization” stands for mentally entertaining a concept, such as “human” or “rational animal”, without ascribing any truth-value to it, while “assent” stands for claiming that the human is rational animal in the real world (Lameer 2006)[^lameer-2006]. Fakhr al-Dīn’s reorganization of logic and epistemology may have been one inspiration for later authors who re-define the subject matter of logic as “the objects of conception and assent” (El-Rouayheb 2012).
    step1: |-
      在伊斯兰世界，法尔萨法的代表人物大体接受亚里士多德关于知识获取方式的传统表述。这就是逍遥学派的《工具论》：从谓项出发，经由三段论，走向证明科学与本质定义。然而，法赫尔丁为逻辑学与认识论提出了另一种结构，把《工具论》的传统编排抛在后面。这一新结构围绕两种获取知识的方式：概念化（taṣawwur）与确认（taṣdīq）（El-Rouayheb 2019: 29）。“概念化”指在心里把握一个概念，如“人”或“理性动物”，而不对其赋予真值；“确认”则指主张人在现实世界中确实是理性动物（Lameer 2006）[^lameer-2006]。法赫尔丁对逻辑学与认识论的重组，也许是后来把逻辑学主题重新定义为“概念与确认之对象”的作者的灵感之一（El-Rouayheb 2012）。
