      In his analysis of the acquisition of knowledge, Fakhr al-Dīn addresses the traditional epistemological distinction inherited from *kalām* between “necessary” (*ḍarūrī*) and “acquired” (*iktisābī*) knowledge. We receive “necessary” items of knowledge as a given, whether or not we want to do so. For instance, when I look at a red apple, I have no power over seeing that the apple is red. I cannot just decide to see it as blue. By contrast, acquired knowledge means that we are intentionally involved in the acquisition of knowledge. I might for instance try to learn why humans have certain features that belong to them, though I need not do so (see further Abrahamov 1993, Radhi Ibrahim 2013, Benevich 2022b)[^abrahamov-1993][^benevich-2022b][^ibrahim-2013][^radhi-2013]. Fakhr al-Dīn goes against this standard *kalām* account by denying the second type of knowledge. According to him, we do not have any power over our conceptualization of things, nor over any beliefs that derive from conceptualization (*Arbaʿīn*, vol.1, 330–332). Rather, all items of conceptualization and assent are given to us, which in the occasionalist Ashʿarite framework means given directly by God (Jacobsen Ben Hammed 2020, Benevich 2022a)[^benevich-2022a][^jacobsen-2020]. We are thus “forced” to have whatever knowledge we wind up having. The nature of the objects known is not so clear: it has been argued that for Fakhr al-Dīn we can only get to objects of phenomenal experience (Ibrahim 2013)[^ibrahim-2013], and also that for him we can get at the things in themselves (Benevich 2022a)[^benevich-2022a]. Either way, the necessary items of knowledge are the primary data for epistemic agents. We do not learn what humans are through an inquiry and by producing essential definitions. We know what humans are through direct experience, which is not up to us.
    step1: |-
      在分析知识获取时，法赫尔丁处理了凯拉姆传统传下的“必然”（ḍarūrī）知识与“获得”（iktisābī）知识之分。我们接受“必然”的知识项，如同接受给定之物，无论愿不愿意。例如，当我看着一个红苹果，我无力不看见苹果是红的；我不能干脆决定把它看成蓝的。相反，“获得的知识”意味着我们有意参与知识的获取。例如，我可能试图弄清楚人为何具有某些特征，但我并非必须如此（另见 Abrahamov 1993、Radhi Ibrahim 2013、Benevich 2022b）[^abrahamov-1993][^benevich-2022b][^ibrahim-2013][^radhi-2013]。法赫尔丁背离这一标准凯拉姆说法，否认第二类知识。按他，我们对事物的概念化没有能力，对任何由概念化而来的信念也没有能力（《四十问》，卷 1，330–332）。相反，一切概念化与确认之项都是被给予我们的；在偶因论的艾什尔里框架中，这意味由神直接给予（Jacobsen Ben Hammed 2020、Benevich 2022a）[^benevich-2022a][^jacobsen-2020]。因此，我们“被迫”拥有我们最终拥有的任何知识。所知对象的性质则不那么清楚：有论证认为，按法赫尔丁我们只能达到现象经验的对象（Ibrahim 2013）[^ibrahim-2013]；也有论证认为，按他我们能达到事物本身（Benevich 2022a）[^benevich-2022a]。无论哪种，必然知识项都是认识主体的基本材料。我们不是通过探究、通过给出本质定义来认识人是什么；我们是靠直接经验认识人是什么，而那不由我们作主。
    step2: |-
      在分析知识获取时，法赫尔丁处理了凯拉姆传统传下的“必然”（*ḍarūrī*）知识与“获得”（*iktisābī*）知识之分。必然的知识项如同给定之物，我们受之，无论愿不愿意。例如，我看着一个红苹果，便无力不看见它是红的，也不能干脆决定把它看成蓝的。相反，“获得的知识”意味着我们有意参与知识的获取：我可能设法弄清人为何有某些特征，却并非必须如此（另见 Abrahamov 1993、Radhi Ibrahim 2013、Benevich 2022b）[^abrahamov-1993][^benevich-2022b][^ibrahim-2013][^radhi-2013]。法赫尔丁背离这一标准凯拉姆说法，否认第二类知识。按他，我们对事物的概念化没有能力，对任何由概念化而来的信念也没有能力（《四十问》，卷 1，330–332）。相反，一切概念化与确认之项都是被给予我们的；在偶因论的艾什尔里框架中，这意味着由神直接给予（Jacobsen Ben Hammed 2020、Benevich 2022a）[^benevich-2022a][^jacobsen-2020]。于是我们“被迫”拥有最终拥有的任何知识。所知对象的性质则不那么清楚：有论证认为，按法赫尔丁我们只能达到现象经验的对象（Ibrahim 2013）[^ibrahim-2013]；也有论证认为，按他能达到事物本身（Benevich 2022a）[^benevich-2022a]。无论哪种，必然知识项都是认识主体的基本材料。人是什么，不靠探究、不靠给出本质定义去认识，而靠不由我们作主的直接经验。
