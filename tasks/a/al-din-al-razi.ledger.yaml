      法赫尔丁决定为伊本·西那的一部作品写下如此详细的注疏，这在历史上颇能说明问题。与他同时代的沙拉夫丁·马斯欧迪（卒于 1204 年之前）确曾就同一文本写下一组《疑惑》（Shukūk），但拉齐对《指示》的注疏，似乎是第一部对阿拉伯哲学著作的逐条注疏（亦见 Wisnovsky 2013、Shihadeh 2014 与 2017）[^shihadeh-2014][^shihadeh-2017][^wisnovsky-2013]，正如晚古与早期阿拉伯哲学中曾对亚里士多德所作的那样。即使随便翻阅法赫尔丁的著作，也能看出他已把伊本·西那认定为法尔萨法（falsafa）的首要代表：这个词最自然地译作“哲学”（因为它同样源自希腊语 philosophia），但在这一时期其实含义更窄，因为它与伊本·西那的独特学说紧密绑定。做一个法伊拉苏夫（faylasūf，哲学家），就是主张宇宙自神必然而永恒地流溢之类学说。（讨论此类问题而不带特定教义承诺的更通用词，是希克玛（ḥikma），字面意为“智慧”；见 Griffel 2021。）[^griffel-2021] 法赫尔丁追随其著名前辈、同为艾什尔里派的安萨里（卒于 1111 年），把伊本·西那当作法尔萨法的杰出代表；但他不赞同安萨里的看法，即法拉萨法（falāsifa）是伊斯兰的异端与叛教者。
