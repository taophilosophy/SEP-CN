      The mature career of Fakhr al-Dīn has been divided into three phases in a recent detailed overview of his life (Griffel 2021: 264–303; see also Street 1997, Griffel 2007, Altaş 2013a and 2013b, Shihadeh 2022)[^altaş-2013a][^altaş-2013b][^griffel-2007][^griffel-2021][^shihadeh-2022][^street-1997]. These phases were marked by patronage relationships with two political powers who were vying for dominance in central Asia, the Khwārazm-Shāhs and the Ghūrids. Fakhr al-Dīn first enjoyed the support of the Khwārazm-Shāhs for about two decades, before joining the Ghūrids in 1197 after a military defeat of the Khwārazm-Shāhs at the hands of the Ghūrids. By all accounts this led to great wealth and standing, as Fakhr al-Dīn became an ornament to the Ghūrid court and a close companion and teacher of the sultan Ghiyāth al-Dīn (d.1203). This did not mean he could stay above the political fray, though. He was accused of lingering loyalty to the enemies of the court and was also involved in a religious rivalry between Ashʿarism and the more literalist, less rationalist Karrāmite theological movement. His travels in Transoxania seeking out debates with other jurists and theologians have similarly been explained as an attempt to promote Ashʿarite *kalām* against Maturīdī opponents, and Shāfiʿī legal thought against Hanbalī opponents (for his legal thought see, e.g., Opwis 2012, Başoğlu 2014)[^başoğlu-2014][^opwis-2012][^opwis-2012-2]. In a record of these encounters around the year 1186, called *Debates* (*Munāẓarāṭ*), Fakhr al-Dīn presents himself as “the only respectable scholar among a swarm of dimwits” (Griffel 2021: 296; for this work see Kholeif 1966)[^griffel-2021][^kholeif-1966]. At the end of his life, we see a third phase of patronage as he rejoins the Khwārazm-Shāhs after they take the city of Herat from the Ghūrids. Fakhr al-Dīn died two years later in that city, in 1210 CE (606 of the Muslim calendar).
    step1: |-
      在晚近一份详细的生平综述中，法赫尔丁的成熟生涯被划分为三个阶段（Griffel 2021: 264–303；亦见 Street 1997、Griffel 2007、Altaş 2013a 与 2013b、Shihadeh 2022）[^altaş-2013a][^altaş-2013b][^griffel-2007][^griffel-2021][^shihadeh-2022][^street-1997]。这些阶段以他与两个争夺中亚霸权的政治势力的庇护关系为标志：花剌子模沙与古尔王朝。法赫尔丁先受花剌子模沙支持约二十年，后于 1197 年花剌子模沙被古尔人击败后转投古尔王朝。据各种记载，这使他获得巨大财富与地位，成为古尔宫廷的装饰、苏丹吉亚斯丁（卒于 1203 年）的近臣与老师。但这并不意味着他能置身政治纷争之外。他被指控对宫廷敌人怀有残余忠诚，还卷入艾什尔里主义与更重字面、较少理性主义的卡拉米派神学运动之间的宗教竞争。他在河中地区遍寻与其他法学家、教义学家辩论，同样被解释为试图针对马图里迪派对手推扬艾什尔里派凯拉姆，针对罕百里派对手推扬沙斐仪派法学思想（关于其法学思想，见如 Opwis 2012、Başoğlu 2014）[^başoğlu-2014][^opwis-2012][^opwis-2012-2]。在约 1186 年这些交锋的记录《论辩集》（Munāẓarāt）中，法赫尔丁自述为“一群蠢材中唯一体面的学者”（Griffel 2021: 296；关于此书见 Kholeif 1966）[^griffel-2021][^kholeif-1966]。晚年，随着花剌子模沙从古尔人手中夺取赫拉特城，他重归其麾下，可见第三个庇护阶段。两年后，他卒于该城，时为公元 1210 年（伊斯兰历 606 年）。
