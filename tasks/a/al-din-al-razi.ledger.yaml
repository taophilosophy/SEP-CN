      For someone who denies that we can voluntarily acquire knowledge through either conceptualization or assent, Fakhr al-Dīn devotes surprising effort to discussing the ways of acquiring assents. He introduces a few substantial innovations in the Avicennan theories of the types of propositions and syllogistics. In fact, Fakhr al-Dīn introduces several notions and distinctions that become standard in the subsequent history of Arabic logic. Most of them are rooted in Ibn Sīnā’s logical apparatus, but Fakhr al-Dīn makes great effort to critically revise and re-organize them, creating the foundations of what has been called “revisionist Avicennan logic” (El-Rouayheb 2019: 68–69). One of the most important innovations is Fakhr al-Dīn’s suggestion that Ibn Sīnā failed to distinguish between the alethic and temporal understanding of necessity. “Every *A* is necessarily *B*” does not need to mean the same as “Every *A* is always *B*”. With this distinction, Fakhr al-Dīn creates what Street has called “profusion of propositional types”, which would be extensively discussed in the later period of Arabic logic (Street 2014, 2016; see further Strobino & Thom 2016)[^street-2014][^strobino-2016].
    step1: |-
      对于一个否认我们能通过概念化或确认自愿获取知识的人来说，法赫尔丁讨论确认之获取方式所费的力气，多得令人意外。他在阿维森纳关于命题类型与三段论的理论中引入了几项实质创新。事实上，法赫尔丁提出的若干概念与区分，成为后来阿拉伯逻辑史的标准。它们大多扎根于伊本·西那的逻辑装置，但法赫尔丁着力批判性地修订与重组，奠定了所谓“修正派阿维森纳逻辑”的基础（El-Rouayheb 2019: 68–69）。最重要的创新之一，是法赫尔丁提出：伊本·西那未能区分必然性的真势理解与时间理解。“每个 *A* 都必然地是 *B*”不必等同于“每个 *A* 都总是 *B*”。凭借这一区分，法赫尔丁造就了 Street 所谓“命题类型的繁盛”，这在阿拉伯逻辑后期得到广泛讨论（Street 2014, 2016；另见 Strobino & Thom 2016）[^street-2014][^strobino-2016]。
    step2: |-
      一个否认我们能凭概念化或确认自愿获取知识的人，却花了出人意料的大力气讨论确认如何获取。法赫尔丁在阿维森纳关于命题类型与三段论的理论中，引入了数项实质创新；其中有若干概念与区分，后来成为阿拉伯逻辑史的标准。它们大多扎根于伊本·西那的逻辑装置，但法赫尔丁着力作批判性修订与重组，奠定了所谓“修正派阿维森纳逻辑”的基础（El-Rouayheb 2019: 68–69）。最重要的创新之一，是他指出：伊本·西那未区分必然性的真势义与时间义。“每个 *A* 都必然地是 *B*”，不必等同于“每个 *A* 都总是 *B*”。凭此区分，法赫尔丁造就了 Street 所谓“命题类型的繁盛”，阿拉伯逻辑后期对此讨论甚多（Street 2014, 2016；另见 Strobino & Thom 2016）[^street-2014][^strobino-2016]。
