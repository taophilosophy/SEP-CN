      既然按亚里士多德的理论，灵魂是有合适结构的有生命身体所拥有并展现的能力系统，那么显然：按亚里士多德，灵魂本身不是身体或形体性事物。这样，亚里士多德与《斐多篇》的主张一致：灵魂与身体非常不同。再者，亚里士多德似乎认为，构成植物、兽与人灵魂的一切能力，其行使都涉及并要求身体部分与器官。这显然适用于（例如）位移运动能力（如行走或飞行）与感觉知觉能力（后者要求感官）。然而亚里士多德并不认为存在思维的器官，因而也不认为思维能力的行使涉及专门为此用途而存在的身体部分或器官。尽管如此，他似乎确实认为：人类理智的活动总是涉及知觉装置的某种活动，因此要求合适的身体部分与器官在场并有恰当的排列；因为他似乎认为，感觉印象[phantasmata]以某种方式参与每一次现存的思维活动——至少就人而言（《论灵魂》3.7, 431a14–7；3.8, 432a7–10；参《论记忆》1, 449b31 及下）。若如此，亚里士多德实际上似乎承诺了与柏拉图立场相反的观点：即使是人的灵魂，也不能在身体之外存在与（或许同样重要的是）活动（参《论灵魂》1.1, 403a3–25，尤 5–16）。（Cohoe 2022 提出不同且不相容的观点。）[^cohoe-2022]
