      从《斐多篇》的灵魂理论视角看，《理想国》的理论与其说是灵魂的划分，不如说是把那些曾被成问题地归给身体的心理功能整合进灵魂。在两个对话中，苏格拉底都诉诸《奥德赛》的同一段落（《奥德赛》20.17–18 见《斐多篇》94d；《奥德赛》20.17 见《理想国》卷四 441b）：奥德修斯克制自己的愤怒——《斐多篇》用它例示灵魂与身体之间的冲突，《理想国》用它例示灵魂的两个部分或方面（理性与激情）之间的冲突。《理想国》所提供的灵魂理论，使（原则上）一切心理功能都可归给单一主体——灵魂——从而以一种《斐多篇》理论所无的方式尊重心灵的统一。而且《理想国》理论还给出欲望之不同种类的有吸引力且论证充分的划分，对“灵魂（或心灵）处于最佳状态意味着什么”以及“这种状态如何最好地达成”都有深刻含义。（要看柏拉图对这些含义的敏锐自觉，只需看《理想国》关于德性与教育的论述。）不过或许值得再强调：不应无视《理想国》的灵魂构想仍宽于我们的心灵概念——这一构想仍包含灵魂说明相关有生命有机体的生命。但若灵魂说明（比方说）人的有机体的生命，那么人的灵魂便必须在某种意义上不仅说明思想与欲望等心理功能，还说明营养与生殖系统的活动与运作等其他生命功能。在多大程度上，《理想国》及之后的柏拉图灵魂理论仍未说明白灵魂究竟如何与这些关键地参与有灵魂有机体之生命的活动（等等）相关，柏拉图的灵魂理论就仍在多大程度上未完成。当然，《理想国》不正面处理灵魂如何与生命功能相关——亚里士多德承认（《尼各马可伦理学》1.13, 1102b11–2）这些功能与《理想国》的伦理政治关切无关——这并不奇怪。但语境与主题并未对《蒂迈欧篇》的“可信神话”施加这种限制；而那一对话虽提出了《理想国》说法的一个略作修订的版本（《蒂迈欧篇》69c 及下），却仍未处理灵魂如何与非心理的生命功能相关这一问题。
