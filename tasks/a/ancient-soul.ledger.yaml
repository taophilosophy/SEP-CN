      此外，除了是否不朽的问题之外，还有一个进一步的问题：灵魂若在一个人死后确实以某种形式存在，它是否“仍拥有某种力量与智慧”（《斐多》70b；参 76c）。苏格拉底对两个问题都作了回答：他不仅说灵魂不朽，而且说灵魂在死亡之时与身体分离之后仍沉思真理。不用说，苏格拉底所用的四条主要论证路线，没有一条成功确立了灵魂的不朽，也没有一条证明了脱离身体的灵魂过着思维与智性的生活（详细讨论见 Bostock 1986 与 Ebrey 2023）[^bostock-1986][^ebrey-2023]。不过，这些论证确实照亮了柏拉图的灵魂概念，尤其是“亲缘性论证”（78b–80b）。这一论证正面迎击一个普遍忧虑：灵魂在死亡之时或其后不久因消散而被毁灭。它首先区分两类东西：一类是可感知的、由部分组成的、会消散和毁灭的；另一类是不可感知而可理解的（由思想把握的）、非由部分组成的、免于消散和毁灭的。这两类显然互斥。它们是否意在穷尽一切，并不清楚。此外，不朽的、可理解的存在这一类，由相等、美之类的柏拉图型相来例示，但看来并不由它们穷尽（*contra* Bostock 1986, 118）[^bostock-1986]。可理解的存在显然包括苏格拉底所谓的“神圣者”，其本性在于统治与引导（80a）；也没有迹象表明型相穷尽了神圣者，或甚至包含了如此理解的神圣者。因此，这一论证为这样的观念留出了余地：灵魂不是型相，却仍然可理解、无部分且不朽（*contra* Robinson 1995, 29）[^robinson-1995]。事实上，柏拉图以这种方式构造论证，恰好提供了说身体与灵魂种类不同所需的概念框架：一者可感知且可朽，另一者可理解且免于毁灭。然而，这一论证并不支持如此强的结论，苏格拉底也意识到这一点。
