      We make nonsense of the argument if we suppose (with Robinson 1995, 36)[^robinson-1995] that when Socrates introduces *living* as part of the function of soul, he has *being alive* in mind. The idea of being good (or bad) at being alive is, obviously, very odd, as is the idea of being alive well or badly. But there is no need to suppose that such ideas are involved here, or that Socrates passes from one sense of ‘living’ [*to zên*] to another. It is, after all, open to us to interpret what Socrates is saying in terms of a conception that integrates the things that Socrates attributes to the soul as functions, or as parts or aspects of its function, namely in terms of the conception of living a life, and not just any kind of life, but a distinctively human one. Caring for the right sorts of things in the right way, ruling or regulating oneself and (when appropriate) others, and deliberating about how to act are not just necessary, but central aspects of living a human life, and all of these things can be done well or badly. Depending on the condition of their soul, a person can be better or worse at doing these things. The just person, whose soul is in the best condition, is truly excellent at living a human life, in that they are excellent at doing the various things that are importantly involved in leading a distinctively human life. If this is along the right lines, we might be in a position to see Plato’s answer to the question how it can be that one thing, the soul, accounts for the life of an organism as well as for its cognitive and intellectual functions, and is also the bearer of virtues or excellences. The answer suggested by the Book 1 argument is this. The way in which the human soul accounts for the life of a human organism is by accounting for the distinctively human life that the individual in question leads. But to account for such a life, it must also account for the cognitive and intellectual functions which guide and shape such a life. Moreover, the dramatic differences in how good people are at leading lives, and relatedly the dramatic differences in how well they exercise their cognitive and intellectual functions, are due to differences in the conditions of their souls, namely the presence or absence of the virtues of justice, wisdom, courage and temperance. This answer significantly clarifies (the relevant aspects of) the ordinary Greek notion of soul (see section 1).
    step1: |-
      如果我们（随 Robinson 1995, 36）[^robinson-1995]设想：当苏格拉底把*活着*引入灵魂的功能时，他心里想的是*处于存活状态*，那就把论证弄成了胡说。擅长（或不擅长）活着这一观念显然非常古怪，活得好或活得糟这一观念同样如此。但没有必要设想这里涉及这类观念，也没有必要设想苏格拉底从一个“活着”［*to zên*］含义滑到另一个。毕竟，我们完全可以用一种把苏格拉底归给灵魂的各功能（或功能的各部分、各方面）整合起来的构想，来解释苏格拉底所说的话，即用“过一种生活”的构想——而且不是随便哪种生活，而是独特地属于人的生活。以恰当方式照料恰当的事物、统治或调节自己（并在适当时候调节他人），以及思虑如何行动，不仅是过人之生活所必需的，更是其核心方面；而所有这些都可以做得好或做得糟。一个人可以依其灵魂的状况，把这些做得更好或更糟。正义者灵魂处于最佳状态，因而在过人之生活上真正卓越：他擅长做那些在过一种独特属人的生活时重要地涉及的事情。若这条思路正确，我们或许就能看清柏拉图如何回答这个问题：同一个东西即灵魂，如何既能说明生物的生命，又能说明其认知与理智功能，并且还是德性或卓越的承载者。第一卷论证所提示的答案是：人的灵魂说明人的生物生命的方式，是说明该个体所过的独特属人的生活；而要说明这样的生活，它也必须说明引导并塑造这种生活的认知与理智功能。此外，人们在过生活上好坏差别巨大，相应地，在运用认知与理智功能上好坏差别也巨大，这些都源于他们灵魂状况的差异，即正义、智慧、勇气与节制这些德性之有无。这一答案显著澄清了（日常希腊灵魂观念的）相关方面（见 §1）。
