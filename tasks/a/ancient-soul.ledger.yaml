      值得注意的是，亚里士多德的理论并未以某种不同于且超出一般生命功能与灵魂相关的方式，把心理功能特殊地关联于灵魂而加以标示。亚里士多德的理论当然不主张：灵魂通过独自执行心理功能而特殊地、直接地负责它们，而对有机体执行其他生命功能（如生长）则负责得较不直接。正如理论的这一侧面所示，亚里士多德相信：一旦恰当理解如何解释自然现象的一般方式，就没有理由认为知觉、欲望以及至少某些形式的思维等心理功能不能仅凭解释自然现象的原理得到解释（参 Frede 1992, 97）[^frede-1992]。
