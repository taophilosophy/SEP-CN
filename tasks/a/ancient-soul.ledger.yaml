      《理想国》还提出了一种新的灵魂理论，其主张是：具身的人类灵魂（至少）有三个部分或方面，即理性、精神与欲望。这一主张的论证见于第四卷，大致这样展开。苏格拉底先提出一条原则：相反的行动、情态与状态不能归给同一个东西的同一个部分、在相同关系下、相对于同一对象、在同一时间。随后各方同意：欲求与拒斥是相反的，因此想做什么与拒斥做同一件事，相对于同一对象而言是相反的。但苏格拉底指出、格劳孔也同意：灵魂常常想做什么，同时又拒斥做同一件事。例如，一个人口渴，并据此想喝水，但同时依据某种计算或思虑希望不喝，而且尽管口渴，事实上也成功地忍住不喝。由上述前提可推出：人的灵魂至少包含两个不同主体，于是一个相反项（想喝）可归给其中一个，另一个相反项（拒斥喝）可归给另一个。苏格拉底认为自己已确认理性与欲望是灵魂的不同部分，随后又把注意力转向欲望之间的其他冲突；这些冲突意在揭示灵魂的第三部分，即精神。
