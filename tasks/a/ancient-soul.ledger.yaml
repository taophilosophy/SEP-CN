      此外，有理由认为哲学活动——尤其是毕达哥拉斯派思辨（约始于六世纪中叶）——促成了“灵魂”的语义扩展。如我们所见，现存最早把勇敢以外的道德德性与灵魂相连的文本，至少有一部分暗示毕达哥拉斯派的影响。事实上不难看出毕达哥拉斯主义如何推动了“灵魂”的扩展。毕达哥拉斯主义关心的事项之一，就是人（或某种宜于人者）死后的持续存在。显然，在荷马的背景下，“灵魂”是个极恰当的词，用来指死后继续存在的人或准-人；毕竟，荷马那里本就有“灵魂”在人死后存续于冥府的熟见用法。要使这条灵魂的继续存在具有“所涉之人继续存在”的意义，至少得把一些看来对人同一性至关重要的状态、活动、运作等归给灵魂（依 Furley 1956, 11；他更进一步，写到灵魂须“包含人格的全部功能”；参 Barnes 1982, 103–6；Huffman 2009）[^furley-1956][^barnes-1982][^huffman-2009]。这一倾向由一则关于毕达哥拉斯的轶事生动说明，该轶事由色诺芬尼记载（fr. 7, KR&S 260）：“据说有一次他路过，见一只小狗挨打，便心生怜悯说：‘住手，别打它；那是我一位朋友的灵魂，我听见它的声音就认出来了。’”不只是毕达哥拉斯的朋友的灵魂解释了那声哀叫（或诸如此类）；实际上，引述的毕达哥拉斯是说，正在哀叫的正是他朋友的灵魂！
