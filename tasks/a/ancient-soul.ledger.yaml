    kind: body
    source: |-
      However, it is not just that soul is said to be present in every living thing. It is also the case that an increasingly broad range of ways of acting and being acted on is attributed to the soul. Thus it has come to be natural, by the end of the fifth century, to refer pleasure taken in food and drink, as well as sexual desire, to the soul. (For detailed discussion, see Claus 1981, 73–85.)[^claus-1981] People are said, for example, to satisfy their souls with rich food (Euripides, *Ion* 1170), and the souls of gods and men are claimed to be subject to sexual desire (fragment assigned by Nauck to Euripides’ first *Hippolytus*). In contexts of intense emotion or crisis, feelings like love and hate, joy and grief, anger and shame are associated with the soul. “Nothing bites the soul of a man more than dishonor”, says Ajax in a fragment from a tragedy of unknown authorship, just before he dies by suicide (Nauck, *TGF, Adesp.* fr. 110). Oedipus says that his soul laments the misery of his city and its inhabitants (*Oedipus Tyrannus* 64). Moreover, the soul is also importantly connected with boldness and courage, especially in battle. Courageous people are said, for instance in Herodotus and Thucydides, to have enduring or strong souls (cf. Laches’ second definition of the virtue that is courage, in Plato’s *Laches* 192c, as “strength of the soul”; also relevant is Pindar, *Pythian* 1.47–8, “standing in battle with an enduring soul”). In the Hippocratic text *Airs, Waters, Places*, the soul is thought of as the place of courage or, as the case may be, its opposite: in the case of lowland inhabitants, courage and endurance are not in their souls by nature, but must be instilled by law (ch. 23); similarly in benign climates, men are fleshy, ill-jointed, moist, without endurance and weak in soul (ch. 24).
    step1: |-
      然而，并不只是灵魂被说成存在于每一个生物之中。情况还是，越来越广泛的行为方式和受作用方式被归给灵魂。因此，到五世纪末，把在饮食中获得的快乐以及性欲归于灵魂，已经变得自然。（关于详细的讨论，见 Claus 1981, 73–85。）[^claus-1981] 例如，人们被说成用丰盛的食物满足他们的灵魂（欧里庇得斯，《伊翁》1170），并且神与人的灵魂被断言受性欲的支配（Nauck 归给欧里庇得斯第一部《希波吕托斯》的残篇）。在强烈情感或危机的语境中，爱和恨、快乐和悲伤、愤怒和羞耻这样的感受与灵魂联系在一起。埃阿斯在一段作者不明的悲剧残篇中——就在他自杀而死之前——说：“没有什么比不光彩更咬噬一个人的灵魂”（Nauck, *TGF, Adesp.* fr. 110）。俄狄浦斯说，他的灵魂为他城邦及其居民的苦难而哀叹（《俄狄浦斯王》64）。此外，灵魂还与胆量和勇气有重要的联系，尤其是在战斗中。例如在希罗多德和修昔底德那里，勇敢的人被说成拥有持久的或强健的灵魂（参看柏拉图《拉刻斯》192c 中拉刻斯对勇敢这一德性的第二个定义，即“灵魂的力量”；同样相关的是品达《皮托竞技胜利歌》1.47–8，“以持久的灵魂立于战斗之中”）。在希波克拉底文集《空气、水与处所》中，灵魂被认为是勇气所在，或者视情况相反：就低地居民而言，勇气和忍耐并非天生在他们的灵魂之中，而必须由法律灌输（第 23 章）；类似地，在温和的气候中，男人肉厚、关节不良、湿润、缺乏忍耐且灵魂软弱（第 24 章）。
    step2: |-
      然而，并不只是说灵魂存在于每一个生物之中。而且，越来越广泛的行为方式与受作用方式也被归给灵魂。因此到五世纪末，把饮食之乐以及性欲归给灵魂，已成自然。（详见 Claus 1981, 73–85。）[^claus-1981] 例如，人们被说成用丰盛的食物满足自己的灵魂（欧里庇得斯，《伊翁》1170）；神与人的灵魂也被说成受性欲支配（Nauck 归入欧里庇得斯第一部《希波吕托斯》的残篇）。在强烈情感或危机的场合，爱恨、悲喜、愤怒与羞耻之类的感受都与灵魂联系在一起。“没有什么比耻辱更咬噬人的灵魂，”埃阿斯在一段作者不明的悲剧残篇中说，随即自杀而死（Nauck, *TGF, Adesp.* fr. 110）。俄狄浦斯说，他的灵魂为他城邦及其居民的苦难而悲叹（《俄狄浦斯王》64）。此外，灵魂还与胆量和勇气有重要联系，尤其是在战斗中。例如在希罗多德与修昔底德那里，勇敢的人被说成拥有持久或强健的灵魂（参看柏拉图《拉刻斯》192c 中拉刻斯对勇敢这一德性的第二个定义：“灵魂的力量”；另参品达《皮托竞技胜利歌》1.47–8：“以持久的灵魂立于战阵”）。在希波克拉底文集《空气、水与处所》中，灵魂被认为是勇气所在，或视情形相反：就低地居民而言，勇气与忍耐并非天生在其灵魂之中，而必须由法律灌输（第 23 章）；同样，在温和气候中，人肉厚、关节松弛、湿润、缺乏忍耐且灵魂软弱（第 24 章）。
