  - id: 4
    kind: body
    source: |-
      The Homeric poems, with which most ancient writers can safely be assumed to be intimately familiar, use the word ‘soul’ in two distinguishable, probably related, ways. The soul is, on the one hand, something that is risked in battle and lost in death. On the other hand, it is what at the time of death departs from a person’s limbs and travels to the underworld, where it has a more or less pitiful afterlife as a shade or image of the deceased person. It has been suggested (for instance, by Snell 1975, 19)[^snell-1975] that what is referred to as soul in either case is in fact thought of as one and the same thing, something that a person can risk and lose and that, after death, endures as a shade in the underworld. The suggestion is plausible, but cannot be verified. In any case, once a person’s soul has departed for good, the person is dead. The presence of soul therefore distinguishes a living body from a corpse. However, this is plainly not to say that the soul is thought of as what accounts for, or is responsible for, the activities, responses, operations and the like that constitute a person’s life. Homer never says that anyone does anything in virtue of, or with, their soul, nor does he attribute any activity to the soul of a living person. Thus, though the presence or absence of soul marks out a person’s life, it is not otherwise associated with that life. Moreover, it is a striking feature of Homeric usage that, in Furley’s words (Furley 1956, 4)[^furley-1956], to mention soul is to suggest death: someone’s soul comes to mind only when their life is thought, by themselves or others, to be at risk. Thus Achilles says that he is continuously risking his soul (*Iliad* 9.322), and Agenor reflects on the fact that even Achilles has just one soul (*Iliad* 11.569). It should also be pointed out that in the Homeric poems, having and losing soul is generally reserved to humans (*Odyssey* 14.426 is an outlier; I am grateful to Gregory Frost-Arnold for calling my attention to it). Correspondingly, Homer never envisages shades or images of non-human creatures in the underworld. These two facts taken together suggest that in whatever precise way the soul is conceived of as associated with life, it is in any case thought to be connected not so much with life in general, or life in all its forms, as, more specifically, with the life of a human being.
    step1: |-
      荷马史诗——可以稳妥地假定大多数古代作者都对其极为熟悉——以两种可区分、可能相关的方式使用“灵魂”一词。一方面，灵魂是在战斗中被冒风险、在死亡中失去的东西。另一方面，它是在死亡之时离开人的肢体、前往冥府的东西，在那里作为死者的阴魂或影像过着多少可怜的后世生活。有人提出（例如 Snell 1975, 19）[^snell-1975]，两种情况下被称为灵魂的东西实际上被当作同一个东西，即人可以冒险并失去、在死后作为阴魂在冥府存续的东西。这一说法说得通，却无法证实。无论如何，一个人的灵魂一旦永久离去，这个人就死了。因此，灵魂的在否，把活的身体与尸体区分开来。不过，这显然不等于说，灵魂被看作解释或负责构成一个人生命的活动、反应、运作等等的东西。荷马从未说过任何人凭借或用自己的灵魂做什么事，也从未把任何活动归给活人的灵魂。所以，灵魂的在否虽标出一个人是否活着，除此之外却与这一生命无关。此外，荷马用法的显著之处在于，用弗利的话说（Furley 1956, 4）[^furley-1956]，提到灵魂即暗示死亡：只有当某人自己或他人认为其生命有危险时，才会想到他的灵魂。所以阿喀琉斯说自己一直在拿灵魂冒险（《伊利亚特》9.322），阿革诺尔则想到，连阿喀琉斯也只有一条灵魂（《伊利亚特》11.569）。还应当指出，在荷马史诗中，拥有和失去灵魂一般只限于人（《奥德赛》14.426 是个例外；感谢 Gregory Frost-Arnold 提醒我注意这一点）。相应地，荷马从未设想冥府里有非人生物的阴魂或影像。这两个事实合起来表明，无论灵魂以何种确切方式被设想为与生命相关，它无论如何都被认为与其说与一般生命或一切形式的生命相连，不如说更具体地与人的生命相连。
    step2: |-
      可以肯定，大多数古代作者都熟稔荷马史诗；史诗使用“灵魂”一词的方式有两种，彼此可辨，且很可能相关。一方面，灵魂是在战斗中冒险、在死亡时失去的东西。另一方面，它又在死亡之时离开人的肢体，前往冥府，在那里作为死者的阴魂或影像，过着多少有些可怜的生活。有人主张（如 Snell 1975, 19）[^snell-1975]，两种语境中所谓的灵魂其实是同一样东西：人可以拿它冒险、将它失去，而它在死后作为阴魂存续于冥府。这一说法说得通，却无法证实。无论如何，一个人的灵魂一旦永久离去，这个人就死了。因此，灵魂的在否，把活的身体与尸体区分开来。不过，这显然不等于说，灵魂被看作解释或负责构成一个人生命的活动、反应、运作等等的东西。荷马从未说过任何人凭借或用自己的灵魂做什么事，也从未把任何活动归给活人的灵魂。所以，灵魂的在否虽标出一个人是否活着，除此之外却与这一生命无关。此外，荷马用法的显著之处在于，用弗利的话说（Furley 1956, 4）[^furley-1956]，提到灵魂即暗示死亡：只有当某人自己或他人认为其生命有危险时，才会想到他的灵魂。所以阿喀琉斯说自己一直在拿灵魂冒险（《伊利亚特》9.322），阿革诺尔则想到，连阿喀琉斯也只有一条灵魂（《伊利亚特》11.569）。还应当指出，在荷马史诗中，拥有和失去灵魂一般只限于人（《奥德赛》14.426 是个例外；感谢 Gregory Frost-Arnold 提醒我注意这一点）。相应地，荷马从未设想冥府里有非人生物的阴魂或影像。这两个事实合起来表明，无论灵魂以何种确切方式被设想为与生命相关，它无论如何都被认为与其说与一般生命或一切形式的生命相连，不如说更具体地与人的生命相连。
  - id: 5
    kind: body
    source: |-
      Several significant developments occurred in the ways Greeks thought and spoke about the soul in the sixth and fifth centuries. The questions about the soul that are formulated and discussed in the writings of Plato and Aristotle to some extent arise from, and need to be interpreted against the background of, these sixth and fifth century developments. One factor that is of central importance is the gradual loss of the Homeric connection between mentioning a person’s soul and the thought that their life is vulnerable or at risk (*contra* Burnet 1916, 253)[^burnet-1916]. In ordinary fifth century Greek, having soul is simply being alive; hence the emergence, at about this time, of the adjective ‘ensouled’ [*empsuchos*] as the standard word meaning “alive”, which was applied not just to human beings, but to other living things as well. There is some reason to think that the word ‘soul’ was used in this straightforwardly positive way already in the sixth century. Thales of Miletus, who is credited with successfully predicting a solar eclipse occurring in 585, reportedly attributed soul to magnets, on the grounds that magnets are capable of moving iron (Aristotle, *De Anima* 1.2, 405a19–21). Thales’ thought was presumably that since it is distinctive of living things to be able to initiate movement, magnets must in fact be alive or, in other words, ensouled. Thus, while Homer spoke of soul only in the case of human beings, in sixth and fifth century usage soul is attributed to every kind of living thing. What is in place, then, at this time is the notion that soul is what distinguishes that which is alive from that which is not.
    step1: |-
      在希腊人于六世纪和五世纪思考和谈论灵魂的方式中，发生了若干重要的发展。柏拉图和亚里士多德著作中所提出并讨论的关于灵魂的问题，在某种程度上从这些六、五世纪的发展中产生，并且需要在这些发展的背景下得到解释。一个具有核心重要性的因素是，荷马那里提到一个人的灵魂与想到其生命脆弱或处于危险之间的联系的逐渐丧失（*contra* Burnet 1916, 253）[^burnet-1916]。在五世纪的日常希腊语中，拥有灵魂就是活着；因此大约在这个时候，形容词“有灵魂的”[*empsuchos*] 作为表示“活着的”的标准词出现，它不只被用于人，也被用于其他生物。有某些理由认为，“灵魂”一词在六世纪就已经以这种直截了当的肯定方式被使用。米利都的泰勒斯被认为成功预言了发生于 585 年的日食，据记载他把灵魂归给磁石，理由是磁石能够移动铁（亚里士多德，《论灵魂》1.2，405a19–21）。泰勒斯的想法大概是：既然能够发起运动是生物的特征，那么磁石事实上必定是活的，或者换句话说，是有灵魂的。因此，荷马只在人的情形中谈论灵魂，而在六、五世纪的用法中，灵魂被归给每一种生物。于是，在这个时候已经确立的观念是：灵魂是区分活着的东西与不活着的东西的东西。
    step2: |-
      公元前六、五世纪，希腊人思考和谈论灵魂的方式出现了若干重要变化。柏拉图和亚里士多德著作中提出并讨论的关于灵魂的问题，在某种程度上源自这些发展，也需放在这些发展的背景下解读。一个至关重要的因素是，荷马那里“提到某人的灵魂”与“想到其生命脆弱或处于危险”之间的关联逐渐消失（*contra* Burnet 1916, 253）[^burnet-1916]。在公元前五世纪的日常希腊语中，有灵魂就是活着；因此大约在这一时期，形容词“有灵魂的”[*empsuchos*] 作为表示“活着的”的标准词出现，它不仅用于人，也用于其他生物。有理由认为，“灵魂”一词在公元前六世纪就已经以这种直截了当的肯定方式使用。据说，米利都的泰勒斯（据信成功预言了公元前 585 年的日食）把灵魂归给磁石，理由是磁石能移动铁（亚里士多德，《论灵魂》1.2，405a19–21）。泰勒斯的意思大概是：既然生物的特征在于能够自行发起运动，那么磁石必定也是活的，换言之，是有灵魂的。于是，荷马只在人的情形中谈论灵魂，而六、五世纪的用法则把灵魂归给每一种生物。到这时已经确立的观念是：灵魂是区分活物与非活物的东西。
