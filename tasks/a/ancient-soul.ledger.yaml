      《斐多篇》框架有一个多少令人意外、也许令人困惑的特征。一方面，苏格拉底显然认为灵魂以某种方式负责任何活体的生命，因而大概也负责构成或关键地参与任何有机体生命的全部各类活动等等。另一方面，他也认为存在一类受限的活动，灵魂以某种特殊方式负责它们，以致灵魂并不实际地以这种特殊方式负责活体所从事的一切相关活动。于是，既然灵魂以某种方式负责任何活体的全部生命，人们当然会预期：灵魂也以某种方式负责那些生命包含此类心理状态的有机体的欲望、情感与信念——而且不只是其中某个受限子集，事实上是全部。然而，苏格拉底把（用《理想国》框架说）理性的一切且仅有的欲望、情感与信念归给灵魂，这其实与“灵魂负责有机体从事的全部生命活动”的观点相容——包括《理想国》框架中非理性灵魂的欲望等等。苏格拉底所需要的，是可以肯定提供的东西：对“灵魂以不同方式负责活体相关活动”的一种合适阐明。其中一种方式是：有机体之所以能够从事相关活动，是因为它有灵魂，或许以特定方式有灵魂（例如像动物那样有，而非像植物那样）。另一种（更强的）方式是直接负责：灵魂不只是有机体得以做或经受某事的基础（例如口渴并因此形成喝的欲望），它也可以自身直接施行某些活动（例如观照数学真理）。所以，更清楚地说：《斐多篇》的灵魂构想窄于我们的心灵概念，其方式如下。灵魂直接负责的活动范围——可以严格地说是“灵魂的活动”者——显著窄于心理活动的范围。它不包括一个人的全部欲望，也不必包括全部情感反应，甚至不必包括全部信念。没有灵魂，人当然不可能有饥饿、口渴这类“身体的”欲望，但这并不意味着形成或维持这类欲望的一定是灵魂本身。
