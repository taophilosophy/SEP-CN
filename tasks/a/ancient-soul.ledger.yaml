      此外，不论不朽与否，还有一个进一步的问题：灵魂若在人死后确有某种形式的存在，它是否“仍保有某种力量与智慧”（《斐多篇》70b；参 76c）。对这两个问题，苏格拉底的回答是：灵魂不仅不朽，而且在死亡时与身体分离之后仍观照真理。无须说，苏格拉底所采用的四条主要论证路线，没有一条成功确立了灵魂不朽，或证明了脱离身体的灵魂过着思想与理智的生活（详细讨论见 Bostock 1986 与 Ebrey 2023）[^bostock-1986][^ebrey-2023]。然而，这些论证确能揭示柏拉图的灵魂构想，尤其是“亲缘论证”（78b–80b）。该论证正面迎击一个普遍的忧虑：灵魂在死亡之时或之后不久，会因被驱散而毁灭。它首先区分两类事物：一类是可感知、由部分构成、可分解可毁灭的；另一类是不可感知但可理知（由思想把握）、不由部分构成、免于分解毁灭的。这两类显然互斥；它们是否意在穷尽一切，则不清楚。再者，不灭的可理知存在这一范畴，由平等、美之类的柏拉图形式所例示，但看来并不被它们穷尽（*contra* Bostock 1986, 118）[^bostock-1986]。可理知存在显然包括苏格拉底所谓的神性——其本性是统治与引领（80a）——而没有迹象表明形式穷尽了神性，甚至没有表明形式包含如此理解的神性。因此，该论证为这一想法留出了空间：灵魂不是形式，却仍然可理知、无部分、不灭（*contra* Robinson 1995, 29）[^robinson-1995]。事实上，柏拉图以这种方式构架论证，恰好提供了必要的概念框架，以便说身体与灵魂在种类上不同：一者可感知、可朽，另一者可理知、免于毁灭。然而，该论证并不支持如此强的结论，苏格拉底也知道这一点。
