      Coming from the theories of Plato and Aristotle, the first thing that might strike us about the theories of soul adopted by the two dominant Hellenistic schools, Epicurus’ Garden and the Stoa, is the doctrine, shared by both, that the soul is corporeal. A number of Stoic arguments for the claim that the soul is a body have come down to us (see Annas 1992, 39–41)[^annas-1992][^annas-1992-2][^annas-1992-3]. The best one of these is that the soul is a body because (roughly) only bodies affect one another, and soul and body do affect one another, for instance in cases of bodily damage and emotion. Epicurus employs the same argument in his *Letter to Herodotus*, which provides an outline of his physical doctrines (Long & Sedley 1987 [in what follows L&S] 14A7)[^long-1987]. In a way that reminds one of Presocratic theories, both Epicurus and the Stoics hold that the soul is a particularly fine kind of body, diffused all the way through the perceptible (flesh-and-blood) body of the animate organism. As if echoing the view of the soul that Simmias in the *Phaedo* presents as the majority view, Epicurus thinks that the soul is dispersed at death along with its constituent atoms, losing the powers that it has while it is contained by the body of the organism that it ensouls (L&S 14A6). The Stoics agree that the human soul is mortal, but they also take it that it can and does survive the person’s death — that is, its separation from the perceptible body. Chrysippus apparently thought that the souls of wise persons persist (as fine, imperceptible corporeal structures) all the way to the next conflagration in the cosmic cycle, whereas the souls of other people last for some time, and then get dispersed (Diogenes Laertius 7.157; cf. L&S 53W). Thus Chrysippus can accept, at least for the souls of the wise, Socrates’ claim in the *Phaedo* that the soul is “altogether indissoluble, *or nearly so*” (*Phaedo* 80b), even though he plainly cannot accept all of Socrates’ argument for this claim.
