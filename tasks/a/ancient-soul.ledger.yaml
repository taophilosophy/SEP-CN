      他实际上得出的结论是：灵魂**最像**、也**最亲近**可理知存在，而身体最像可感知、可朽的存在。这样说，显然既不是断言、也不蕴含（如 Robinson 1995, 30 似乎以为）[^robinson-1995]：灵魂以某种方式不及可理知、不灭的存在——正如也不是断言或蕴含：身体以某种方式不及、或毋宁说高于可感知、可朽的存在。该论证留下一个开放问题：灵魂究竟是完全可敬的可理知实在之成员（正如人的身体是完全可敬的可感知实在之成员），还是具有某种介于可理知与可感知存在之间的中间地位——高于后者，却只是近似于前者。苏格拉底似乎确实认为其结论蕴含、或至少强烈暗示：灵魂“要么完全不可分解，要么几乎如此”是自然的；但无论如何，灵魂比身体更不易于分解毁灭，而不是像流行看法那样相反。若这一立场能确立，苏格拉底便能驳斥流行看法：灵魂由以太质料构成，因而**比**身体更易被驱散、毁灭。然而，正如齐贝斯指出（88b），除非苏格拉底能确立灵魂完全免于毁灭，否则面对死亡时的存续信心便是错置的。苏格拉底的灵魂或许比他的身体耐久得多，但只要它并非真正不灭，就无法保证它能挺过苏格拉底即将到来的死亡。因为它可能已经经历过无数次转世，而当前这一次也许是最后一次。于是苏格拉底展开他最精细、也是最后的灵魂不朽论证，其结论是：既然生命本质上属于灵魂，灵魂必不死——即不朽。
