      Heraclitus (fl. around 500 BC), who repeatedly mentions Pythagoras, attributes wisdom to the soul provided that it is in the right state or condition: “a dry soul”, he claims, “is wisest and best” (fr. 118, KR&S 230). He may have been the first thinker to articulate a connection between soul and motor functions. “A man when he is drunk”, Heraclitus remarks, “is led by an unfledged boy, stumbling and not knowing where he goes, having his soul moist” (fr. 117, KR&S 231). On the most plausible construal of Heraclitus’ sentence, he is saying that the drunken person stumbles because his perceptual abilities have been impaired, and this impairment is due to moistness of soul (Schofield 1991, 22)[^schofield-1991]. Like many (or indeed all) sixth and fifth century thinkers who expressed views on the nature or constitution of the soul, Heraclitus thought that the soul was bodily, but composed of an unusually fine or rare kind of matter, e.g. air or fire. (A possible exception is the Pythagorean Philolaus, who may have held that the soul is an ‘attunement’ of the body; cf. Barnes 1982, 488–95, and Huffman.)[^barnes-1982] The prevalence of the idea that the soul is bodily explains the absence of problems about the relation between soul and body. Soul and body were not thought to be radically different in kind; their difference seemed just to consist in a difference in degree of properties such as fineness and mobility.
    step1: |-
      赫拉克利特（鼎盛期约公元前 500 年）屡次提到毕达哥拉斯，他把智慧归给灵魂，前提是灵魂处于恰当状态或状况：他声称，“干燥的灵魂最智慧、最优秀”（fr. 118, KR&S 230）。他也许是最早表述灵魂与运动功能之间联系的思想家。赫拉克利特说：“人喝醉了，便由一个未成年的男孩牵着走，跌跌撞撞，不知往哪里去，因为他的灵魂是湿的”（fr. 117, KR&S 231）。按对赫拉克利特此句最可信的解释，他是说醉汉之所以跌撞，是因为其知觉能力受损，而这损伤源于灵魂的湿（Schofield 1991, 22）[^schofield-1991]。像许多（甚至所有）对灵魂性质或构造发表过看法的六、五世纪思想家一样，赫拉克利特认为灵魂是物体性的，但由一种格外精细或稀薄的物质——如气或火——构成。（可能的例外是毕达哥拉斯派的菲洛劳斯，他也许主张灵魂是身体的一种“和谐”；参 Barnes 1982, 488–95，以及 Huffman。）[^barnes-1982] “灵魂是物体性的”这一观念流行，解释了为何不存在灵魂与身体关系的问题。灵魂与身体并不被认为在种类上根本不同；它们的差别似乎只是精细程度与可动性等属性的程度差别。
