      To educated fifth century speakers of Greek, it would have been natural to think of qualities of soul as accounting for, and being manifested in, a person’s morally significant behavior. Pericles acts courageously, and Hippolytus temperately (or chastely), because of the qualities of their souls from which such actions have a strong tendency to flow, and their actions express and make evident the courage, temperance and the like that characterize their souls. Once we are in a position properly to appreciate the connection between soul and moral character that must already have been felt to be natural at this stage, it should come as no surprise that the soul is also taken to be something that engages in activities like thinking and planning. If the soul is, in some sense, responsible for courageous acts, for instance, it is only to be expected that the soul also grasps what, in the circumstances, courage calls for, and how, at some suitable level of detail, the courageous act must be performed. Thus in a speech of Antiphon, the jury is urged to “take away from the accused the soul that planned the crime”, in striking juxtaposition of the ideas of life-soul (as in Homer) and of soul as responsible for practical thought. Somewhat similarly, in a Sophoclean fragment (fr. 97) someone says that “a kindly soul with just thoughts is a better inventor than any sophist” (cf. also Euripides, *Orestes* 1180). Moreover, it is easy to see that there are connections between familiar uses of ‘soul’ in emotional contexts and attributions to the soul of cognitive and intellectual activities and achievements. There is, after all, no clear-cut and manifest difference between, say, being in the emotional state of fear and having a terrifying thought or perception. When Oedipus’ soul laments, or Ajax’s soul is bitten by dishonor, emotion obviously goes hand in hand with cognition, and if it is natural to refer the one to the soul, there should be nothing puzzling about attributions to it of the other. Thus in non-philosophical Greek of the fifth century the soul is treated as the bearer of moral qualities, and also as responsible for practical thought and cognition. For further discussion on the contrary claims of Burnet 1916, see:
    step1: |-
      对五世纪受过教育的希腊语使用者来说，把灵魂的品质视为解释一个人的道德上重要的行为、并在其中得到表现的东西，本来会是自然的。伯里克利勇敢地行动，希波吕托斯节制地（或贞洁地）行动，是因为他们灵魂的品质，这类行动有强烈的倾向从这些品质流出；而他们的行动表达并使得显明：勇气、节制等等是刻画其灵魂的特征。一旦我们处于一个能够恰当地领会灵魂与道德品格之间联系的位置——在这一阶段，这种联系必定已经被感觉很自然——那么，灵魂也被认为是从事思维和筹划这样的活动的东西，就不应该令人惊讶了。例如，如果灵魂在某种意义上对勇敢的行为负责，那么就可以预料，灵魂也把握在具体情况下勇气要求什么，以及在某种合适的细节层面上，勇敢的行为必须如何被执行。因此在安提丰的一篇演说中，陪审团被敦促“从被告身上夺走那个策划了犯罪的灵魂”，把生命灵魂（如荷马那里）和灵魂作为实践思维之负责者的观念醒目地并置在一起。与此有些类似，在索福克勒斯的一段残篇（fr. 97）中，有人说“一个拥有正义思想的善良灵魂，是比任何智术师都更好的发明者”（另参欧里庇得斯，《俄瑞斯忒斯》1180）。此外，很容易看出，在情感语境中“灵魂”的熟悉用法与把认知和理智的活动及成就归给灵魂之间，存在联系。毕竟，比方说，处于恐惧的情感状态与拥有一个可怕的想法或知觉之间，并没有清晰而明显的区别。当俄狄浦斯的灵魂哀叹，或埃阿斯的灵魂被不光彩咬噬时，情感显然与认知携手并进；而如果把这些中的一个归给灵魂是自然的，那么把另一个也归给它就不应有任何令人困惑之处。因此在五世纪的非哲学希腊语中，灵魂既被当作道德品质的承担者，也被当作实践思维和认知的负责者。关于伯内特 1916 的相反主张的进一步讨论，见：
    step2: |-
      对受过教育的五世纪希腊语使用者来说，把灵魂的品质看作解释一个人的道德重要行为、并在其中显现出来，是自然而然的。伯里克利勇敢地行动，希波吕托斯节制地（或贞洁地）行动，都是由于其灵魂的品质，这类行动有强烈的倾向从这些品质流出；他们的行动表达并显明了其灵魂所具有的勇气、节制等等。一旦我们能恰当地领会灵魂与道德品格之间的联系（在这一阶段，这种联系必定已被感觉很自然），那么灵魂也被当作从事思维、筹划之类活动的东西，就不足为奇了。例如，如果灵魂在某种意义上负责勇敢的行为，那么可以预期，灵魂也把握在具体情形中勇气要求什么，以及在某种适当的细节层面上，勇敢的行为必须如何施行。因此在安提丰的一篇演说中，陪审团被敦促“从被告身上夺走那个策划了罪行的灵魂”，这就把生命灵魂（如荷马那里）与负责实践思维的灵魂这两个观念醒目地并置起来。与此类似，在索福克勒斯的一段残篇（fr. 97）中，有人说“一个心怀正义思想的善良灵魂，比任何智术师都更善于发明”（另参欧里庇得斯，《俄瑞斯忒斯》1180）。此外，不难看出，情感语境中“灵魂”的常见用法与把认知和理智活动及成就归给灵魂之间有联系。毕竟，比如说，处于恐惧的情感状态与怀有可怕的想法或知觉之间，并没有清晰显明的区别。当俄狄浦斯的灵魂悲叹，或埃阿斯的灵魂为耻辱所咬噬时，情感显然与认知携手同行；如果把这些归给灵魂是自然的，那么把那些也归给它，就不该有什么费解之处。因此，在五世纪的非哲学希腊语中，灵魂既被当作道德品质的承担者，也被当作负责实践思维与认知的东西。关于伯内特 1916 所持相反主张的进一步讨论，见：
