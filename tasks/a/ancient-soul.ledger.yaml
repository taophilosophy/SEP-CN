      《理想国》还提出一种新灵魂论，主张有身之人的灵魂有（至少）三个部分或方面：理性、激情与欲望。论证见卷四，大致如下。苏格拉底先立一条原理：同一事物在同一部分上、就同一对象、在同一时间，不能承受相反的行动、感受与状态。众人随之同意：欲求与厌恶相反，故欲求做某事与厌恶做同一件事，就同一对象而言相反。然而苏格拉底指出、格劳孔也同意：灵魂欲求做某事、同时又厌恶做同一件事，这种情形屡见不鲜。例如人渴了，并因此想喝；但同时出于某种计算或深思不愿喝，且事实上克制住不喝，尽管渴着。由上述前提可推出：人的灵魂至少包含两个不同主体，于是一个相反者（喝的欲求）归给其一，另一个（对喝的厌恶）归给其二。苏格拉底自认已认出理性与欲望是灵魂的不同部分，遂把注意力转向欲求之间的其他冲突，意在揭示灵魂的第三部分——激情。
