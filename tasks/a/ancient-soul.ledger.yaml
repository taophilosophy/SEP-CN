  - id: 4
    kind: body
    source: |-
      The Homeric poems, with which most ancient writers can safely be assumed to be intimately familiar, use the word ‘soul’ in two distinguishable, probably related, ways. The soul is, on the one hand, something that is risked in battle and lost in death. On the other hand, it is what at the time of death departs from a person’s limbs and travels to the underworld, where it has a more or less pitiful afterlife as a shade or image of the deceased person. It has been suggested (for instance, by Snell 1975, 19)[^snell-1975] that what is referred to as soul in either case is in fact thought of as one and the same thing, something that a person can risk and lose and that, after death, endures as a shade in the underworld. The suggestion is plausible, but cannot be verified. In any case, once a person’s soul has departed for good, the person is dead. The presence of soul therefore distinguishes a living body from a corpse. However, this is plainly not to say that the soul is thought of as what accounts for, or is responsible for, the activities, responses, operations and the like that constitute a person’s life. Homer never says that anyone does anything in virtue of, or with, their soul, nor does he attribute any activity to the soul of a living person. Thus, though the presence or absence of soul marks out a person’s life, it is not otherwise associated with that life. Moreover, it is a striking feature of Homeric usage that, in Furley’s words (Furley 1956, 4)[^furley-1956], to mention soul is to suggest death: someone’s soul comes to mind only when their life is thought, by themselves or others, to be at risk. Thus Achilles says that he is continuously risking his soul (*Iliad* 9.322), and Agenor reflects on the fact that even Achilles has just one soul (*Iliad* 11.569). It should also be pointed out that in the Homeric poems, having and losing soul is generally reserved to humans (*Odyssey* 14.426 is an outlier; I am grateful to Gregory Frost-Arnold for calling my attention to it). Correspondingly, Homer never envisages shades or images of non-human creatures in the underworld. These two facts taken together suggest that in whatever precise way the soul is conceived of as associated with life, it is in any case thought to be connected not so much with life in general, or life in all its forms, as, more specifically, with the life of a human being.
    step1: |-
      荷马史诗——古代作家大都可以稳妥地假定对其烂熟于心——以两种可分辨、且大概相关的用法使用“灵魂”一词。一方面，灵魂是战场上可以拿去冒险、在死亡中丧失的东西。另一方面，它是死亡之际从人的四肢离去、前往冥府的东西；在冥府，它作为死者的魂影或形象，过着多少有些可悲的来生。有人提出（如 Snell 1975, 19）[^snell-1975]：两种用法的“灵魂”其实指同一物——人可以拿去冒险与丧失、死后在冥府以魂影存续的东西。此说可信，却无法证实。无论如何，一个人的灵魂一旦永久离去，他就死了。因此，灵魂在场与否，把活体与尸体区分开来。然而，这显然不等于说：灵魂被认为解释或负责构成人之生命的种种活动、反应、运作等。荷马从未说任何人凭其灵魂、或用其灵魂做什么，也从未把任何活动归给活人的灵魂。因此，灵魂的有无固然标出一个人的生命，此外却与这生命无关。再者，荷马用法有一个引人注目的特点，用弗利的话说（Furley 1956, 4）[^furley-1956]：提及灵魂即是暗示死亡——只有当一个人（无论其本人还是他人）认为其生命危殆时，其灵魂才浮现于心。因此阿喀琉斯说自己不断拿灵魂冒险（《伊利亚特》9.322），而阿革诺尔则想到：连阿喀琉斯也只有一条灵魂（《伊利亚特》11.569）。还须指出：在荷马史诗中，有灵魂与失灵魂一般只属于人（《奥德赛》14.426 是例外；感谢 Gregory Frost-Arnold 提醒我注意）。相应地，荷马从不设想冥府中有非人之物的魂影或形象。这两点合起来表明：无论灵魂以何种精确方式被构想为与生命相关，它都被认为不是一般地与生命、或与一切形式的生命相连，而是更具体地与人的生命相连。
