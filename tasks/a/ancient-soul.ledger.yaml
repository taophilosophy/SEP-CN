      从《斐多》所呈现的灵魂理论看，《理想国》的理论与其说是划分灵魂，不如说是把此前多少有问题地归给身体的心理或精神功能整合进灵魂。在两篇对话中，苏格拉底都诉诸同一段《奥德赛》文本（《奥德赛》20.17–18 见《斐多》94d；20.17 见《理想国》4, 441b），其中奥德修斯压住了自己的愤怒：在《斐多》中，用以例示灵魂与身体之间的冲突；在《理想国》中，用以例示灵魂两个部分或方面即理性与精神之间的冲突。《理想国》提供的是一种灵魂理论，它除其他外，允许把（原则上）全部心理或精神功能归给单一主体，即灵魂。该理论因此尊重心灵的统一性，而《斐多》理论则不然。此外，《理想国》理论还对欲望作了有吸引力且证据充分的种类区分，这对灵魂（或心灵）处于最佳状态意味着什么、以及如何最好地促成这种状态，都有深远含义。（要看出柏拉图对这些含义有敏锐意识，只需看《理想国》关于德性与教育说了什么。）然而，也许值得再次强调：我们不应忽视，《理想国》中的灵魂构想比我们的心灵概念更宽，因为该构想仍然包含这一点：是灵魂说明相关有灵魂生物的生命。但若说是灵魂说明（比如说）人的生物生命，那么必定在某种意义上，人的灵魂不仅说明思想与欲望之类心理功能，也说明其他生命功能，例如营养与生殖系统的活动与运作。就它未能清楚说明灵魂究竟如何与生物生命中关键涉及的大量活动（等等）相关而言，柏拉图在《理想国》及其后的灵魂理论仍发展得不完整。当然，《理想国》不去面对下述问题并不令人意外：灵魂如何与那些（如亚里士多德所认识到的，《尼各马可伦理学》1.13, 1102b11–12）与《理想国》的伦理政治关切无关的生命功能相关。然而，语境与主题对《蒂迈欧》的“可信神话”并无此类约束，而该对话在呈现《理想国》说明的某种修订版时（《蒂迈欧》69c 以下），也未能回答灵魂如何与非心理的生命功能相关。
