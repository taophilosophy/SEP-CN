      ### 5.2 The Stoic Theory of Soul
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Stoic physics allows for three different kinds of *pneuma* (lit. ‘breath’), a breath-like material compound of two of the four Stoic elements, fire and air. The kinds of *pneuma* differ both in degree of tension that results from the expanding and contracting effects, respectively, of its two constituents, and in their consequent functionality. The lowest kind accounts for the cohesion and character of inanimate bodies (e.g., rocks); the intermediate kind, called natural *pneuma*, accounts for the vital functions characteristic of plant life; and the third kind is soul, which accounts for the reception and use of impressions (or representations) (*phantasiai*) and impulse (*hormê*: that which generates animal movement) or, to use alternative terminology, cognition and desire. Our evidence, which unfortunately is fragmentary and often unclear, suggests strongly that according to the Stoic theory, the body of an animal (human or non-human) contains *pneuma* of all the three kinds, with the lowest kind responsible for the cohesion and character of parts like teeth and bones, natural *pneuma* in charge of metabolism, growth and the like, and finally soul accounting for distinctively mental or psychological functions, crucially cognition, by sense and (in the case of humans) intellect, and desire (cf. Long 1999, 564, for discussion and references)[^long-1999][^long-1999-2]. If this is indeed the picture that the theory presents, the soul is no longer responsible for all vital functions, and for all aspects of life, but only for specifically mental or psychological functions. (Accordingly, the Stoics depart from the Platonic and Aristotelian view that plants are ensouled organisms.) At the same time, the Stoic theory does attempt to explain non-mental vital functions as well, in terms of the activity of ‘nature’, the intermediate kind of *pneuma*. In severing the deeply entrenched, Greek ordinary-language connection between soul and life in all its forms, the Stoic theory is taking an enormously momentous step, one that obviously restricts rather dramatically the proper subject matter of a theory of soul. In fact it is arguable that the Stoics, in limiting the functions of soul in the way they did, played an important role in a complicated history that resulted in the Cartesian conception of mind, according to which the mind plainly is not something that animates living bodies. This narrowing of the conception of soul is one of two aspects of the Stoic theory that, for our purposes, deserve particular notice.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      The second noteworthy aspect is the insistence of the Stoic theory that the mind of an adult human being is a single, partless item that is rational all the way down. According to the Stoic theory, there are eight parts of the soul, the ‘commanding faculty’ [*hêgemonikon*] or mind, the five senses, voice and (certain aspects of) reproduction. The mind, which is located at the heart, is a center that controls the other soul-parts as well as the body, and that receives and processes information supplied by the subordinate parts. The minds of non-human animals and of non-adult humans have faculties only of impression and impulse. Achieving adulthood, for humans, involves gaining assent and reason. Reason (it would seem) makes assent possible, in that it enables the subject to assent to or withhold assent from impressions, and it transforms mere impressions and mere impulses, such as other animals experience, into rational impressions and rational impulses. The rationality of an impression (for example, of a tree one sees before oneself) consists in its being articulated in terms of concepts, possession of which is constitutive of having reason; the rationality of an impulse consists in the fact that it is generated or constituted by a voluntary act of assent of the mind to a suitable practical (‘impulsive’) impression — the impression, for instance, that something within view would be nice to eat. Thus, depending on the type of impression assented to, assent generates or constitutes belief (or knowledge) concerning some matter of fact, or an impulse to act in some way or other.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      It is crucially important not to misunderstand these various faculties as parts or aspects of the mind, items that operate with some degree of autonomy from one another and can therefore conflict. On the Stoic theory, the faculties of the mind are simply abilities to do things. Moreover, it is a central part of the theory that, in the case of an adult human being, there is no such thing as an impulse without an act of assent of the mind to a corresponding practical impression. In a rational subject, the faculty of impulse depends on the faculty of assent, which, like all faculties of such a subject, is a rational faculty. This theory leaves no room for the Platonic conception that the souls of adult human beings contain non-rational parts which can, and frequently do, generate impulse and behavior independently of, and even contrary to, the designs and purposes of reason. Nor, relatedly, does it leave room for the shared Platonic and Aristotelian view that desire, even in the case of adult humans, comes in three forms, two of which are such that desires of these forms do not arise from, or depend on, activities of reason. The Stoic theory has the attractive consequence that each adult person is, through their own reasoned assent, unambiguously and equally responsible for all their voluntary behavior: there are no Platonic nonrational parts, or Platonic-Aristotelian nonrational desires, that could produce actions against one’s own reason’s helpless protestations. However, the theory needed to be defended both against rival philosophical theories and against pre-theoretical intuitions that militate in favor of these theories. One such intuition is that passion can, and frequently does, conflict with reason. To judge from a report by Plutarch, it appears that the Stoics were able to explain away this particular intuition, and also to disarm the argument for tripartition of the soul in *Republic* 4, which depends on the *simultaneity* of a desire for and an aversion to one and the same thing. According to Plutarch (L&S 65G1),
    step1: TBD
