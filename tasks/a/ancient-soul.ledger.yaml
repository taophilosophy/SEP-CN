      From Homer to the end of the fifth century, the word ‘soul’ undergoes remarkable semantic expansion, in the course of which it comes to be natural not only to speak of soul as what distinguishes the living from the dead and (not the same distinction) the animate from the inanimate, but also to attribute to the soul a wide variety of activities and responses, cognitive as well as emotional, and to think of it as the bearer of such virtues as courage, temperance and justice. As a result of these developments, the language made available something that Homeric Greek lacked, a distinction between body and soul. Thus the Hippocratic author of *Airs, Waters, Places* writes of “endurance in body and soul” (ch. 23). Antiphon says of a defendant who is sure of his innocence that though his body may surrender, his soul saves him by its willingness to struggle, through knowledge of its innocence. For the guilty, on the other hand, even a strong body is to no avail, since his soul fails him, “believing the vengeance coming to him is for his impieties” (Antiphon 5). Homer, by contrast, knows and speaks of a whole lot of different sources and bearers of psychological predicates, but lacks a word to pick out the soul as a single item to which the predicates in question can, in some way or other, be referred and which can be distinguished from, and in suitable contexts contrasted with, the body (cf. Snell 1975, 18–25)[^snell-1975].
    step1: |-
      从荷马到五世纪末，“灵魂”一词经历了可观的语义扩展。在此过程中，人们不仅自然地把灵魂说成区分生者与死者、以及（另一重区分）有生命者与无生命者的东西，而且把形形色色的活动与反应——认知的与情感的——归给灵魂，并把它视为勇敢、节制、正义等德性的承担者。这些发展的结果是：语言提供了一种荷马希腊语所缺的东西，即身体与灵魂的区分。于是，《论空气、水与地方》的希波克拉底作者写到“身体与灵魂中的坚韧”（第 23 章）。安提丰谈到一位确信自己无辜的被告说：他的身体或可屈服，但他的灵魂凭着对自己无辜的认知、以其奋力抗争的意愿拯救他。反之，对有罪者，即便身体强壮也无济于事，因为他的灵魂弃他而去，“相信临到他身上的报复正是对其不虔之举”（安提丰 5）。相比之下，荷马知道并说到许多不同的心理谓词的来源与承担者，却缺少一个词，用来挑出灵魂作为单一项目——这些谓词可在某种意义上归给它，且可与身体区分、并在适当语境中与身体对举（参 Snell 1975, 18–25）[^snell-1975]。
