      The affinity argument is supposed to show not only that the soul is most like intelligible, imperishable being, but also that it is most akin to it. Socrates argues that the soul is like intelligible being on the grounds that it is not visible and, in general, not perceptible (anyhow to humans, as Cebes adds at 79b), and that it shares its natural function with the divine, namely to rule and lead (the body in the one case, mortals in the other). There is a separate argument for the kinship of the soul with intelligible being. When the soul makes use of the senses and attends to perceptibles, “it strays and is confused and dizzy, as if it were drunk” (79c). By contrast, when it remains “itself by itself” and investigates intelligibles, its straying comes to an end, and it achieves stability and wisdom. It is not just that the soul is in one state or another depending on which kind of object it is attending to, in such a way that its state somehow corresponds to the character of the object attended to. That would not by itself show that the soul is more akin to the one domain rather than the other (this is the point of Bostock’s criticism, Bostock 1986, 119)[^bostock-1986]. To understand the argument properly, it is crucial to note that when the soul attends to perceptibles, it is negatively affected in such a way that its functioning is at least temporarily reduced or impaired (“dizzy, as if drunk”), whereas there is no such interference when it attends to intelligibles (cf. Socrates’ fear, at 99e, that by studying things by way of the senses he might blind his soul). The claim that the soul is akin to intelligible reality thus rests, at least in part, on the view that intelligible reality is especially suited to the soul, as providing it with a domain of objects in relation to which, and only in relation to which, it can function without inhibition and interference and fully in accordance with its own nature, so as to achieve its most completely developed and optimal state, wisdom.
    step1: |-
      亲缘论证本应表明的不只是灵魂最像可理知、不灭的存在，还包括它与后者最亲近。苏格拉底论证说，灵魂像可理知存在，理由是它不是可见的，一般说来也不是可感知的（至少对人如此，齐贝斯在 79b 补充），且它与神性共有其自然功能，即统治与引领（对前者是身体，对后者是有死者）。此外还有一个独立的论证，论证灵魂与可理知存在的亲缘。当灵魂使用感官、专注于可感知之物时，“它便游荡、混乱、眩晕，仿佛醉了一般”（79c）。反之，当它保持“自身独自”，探究可理知之物时，它的游荡便告终止，获得稳定与智慧。这并不只是说：灵魂依其所专注的对象种类而处于某种状态，其状态以某种方式对应所关注对象的性质。那样本身并不能表明灵魂更亲近其中一个领域而非另一个（这正是 Bostock 批评的要点，Bostock 1986, 119）[^bostock-1986]。要正确理解该论证，关键是指出：当灵魂关注可感知之物时，它受到负面作用，其功能至少暂时被削弱或损伤（“眩晕，仿佛醉了”）；而当它关注可理知之物时，则没有此类干扰（参苏格拉底在 99e 的担忧：靠感官研究事物，可能会弄瞎自己的灵魂）。因此，“灵魂亲近可理知实在”这一主张至少部分依据于：可理知实在特别适合灵魂，为它提供了一个对象领域；只在与此领域的关系中，灵魂才能不受抑制与干扰地、完全依照其本性运作，从而达到其最充分发展、最优的状态，即智慧。
