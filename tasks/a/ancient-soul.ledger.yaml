      ## 4. Aristotle’s Theory of Soul
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Aristotle’s theory, as it is presented primarily in the *De Anima* (for a complete account, see Aristotle’s Psychology), comes very close to providing a comprehensive, fully developed account of the soul in all its aspects and functions, an account that articulates the ways in which all of the vital functions of all animate organisms are related to the soul. In doing so, the theory comes very close to offering a comprehensive answer to a question that arises from the ordinary Greek notion of soul, namely how precisely it is that the soul, which is agreed to be in some way or other responsible for a variety of things living creatures (especially humans) do and experience, also is the distinguishing mark of the animate. According to Aristotle’s theory, a soul is a particular kind of nature, a principle that accounts for change and rest in the particular case of living bodies, i.e. plants, nonhuman animals and human beings. The relation between soul and body, on Aristotle’s view, is also an instance of the more general relation between form and matter: thus an ensouled, living body is a particular kind of in-formed matter. Slightly simplifying things by limiting ourselves to the sublunary world (cf. *De Anima* 2.2, 413a32; 2.3, 415a9), we can describe the theory as furnishing a unified explanatory framework within which all vital functions alike, from metabolism to reasoning, are treated as functions performed by natural organisms of suitable structure and complexity. The soul of an animate organism, in this framework, is nothing other than its system of active abilities to perform the vital functions that organisms of its kind naturally perform, so that when an organism engages in the relevant activities (e.g., nutrition, movement or thought) it does so in virtue of the system of abilities that is its soul.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      Given that the soul is, according to Aristotle’s theory, a system of abilities possessed and manifested by animate bodies of suitable structure, it is clear that the soul is, according to Aristotle, not itself a body or a corporeal thing. Thus Aristotle agrees with the *Phaedo*’s claim that souls are very different from bodies. Moreover, Aristotle seems to think that all the abilities that are constitutive of the souls of plants, beasts and humans are such that their exercise involves and requires bodily parts and organs. This is obviously so with, for instance, the abilities for movement in respect of place (e.g., by walking or flying), and for sense-perception, which requires sense-organs. Aristotle does not, however, think that there is an organ of thought, and so he also does not think that the exercise of the ability to think involves the use of a bodily part or organ that exists specifically for this use. Nevertheless, he does seem to take the view that the activity of the human intellect always involves some activity of the perceptual apparatus, and hence requires the presence, and proper arrangement, of suitable bodily parts and organs; for he seems to think that sensory impressions [*phantasmata*] are somehow involved in every occurrent act of thought, at least as far as human beings are concerned (*De Anima* 3.7, 431a14–7; 3.8, 432a7–10; cf. *De Memoria* 1, 449b31ff.). If so, Aristotle in fact seems to be committed to the view that, contrary to the Platonic position, even human souls are not capable of existence and (perhaps as importantly) activity apart from the body (cf. *De Anima* 1.1, 403a3–25, esp. 5–16). (Cohoe 2022 offers a different, and incompatible, view.)[^cohoe-2022]
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      It is noteworthy that Aristotle’s theory does not mark off those vital functions that are mental by relating them to the soul in some special way that differs from and goes beyond the way in which vital functions in general are so related. It is certainly not part of Aristotle’s theory that the soul is specially and directly responsible for mental functions by performing them on its own, whereas it is less directly responsible for the performance by the living organism of other vital functions such as growth. As this aspect of his theory suggests, Aristotle is confident that once one has a proper understanding of how to explain natural phenomena in general, there is no reason to suppose that mental functions like perception, desire and at least some forms of thinking cannot be explained simply by appealing to the principles in terms of which natural phenomena in general are properly understood and explained (cf. Frede 1992, 97)[^frede-1992].
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      It might be thought that since Aristotle’s theory treats mental functions and other vital functions exactly alike, it obscures a crucial distinction. This worry, however, turns out to be unjustified. The theory treats mental and other vital functions alike only in that it views both kinds of functions as performed by natural organisms of the right kind of structure and complexity. Viewing mental and other vital functions in this way is perfectly compatible with introducing a distinction between mental and other functions if concerns of some kind or other call for such a distinction. Aristotle is perfectly capable, for instance, of setting aside non-mental vital functions as irrelevant for the purposes of practical philosophy (*NE* 1.13, 1102b11–12).
