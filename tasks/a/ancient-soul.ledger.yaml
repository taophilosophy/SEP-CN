      Moreover, sense-impressions, interpreted and articulated in terms of concepts or preconceptions, yield experience concerning evident matters, which in turn forms the basis for conclusions about non-evident matters. For example, extensive experience can make clear to one not only that the human beings one has interacted with have a certain feature (say, rationality), but also (later Epicureans will say, probably somewhat developing Epicurus’ position) that it is inconceivable that any human being could fail to have that feature (cf. L&S 18F4–5). And so, experience will not only make one expect, with a very great deal of confidence, that any human being one will ever encounter anywhere will be rational. Experience also, according to the Epicureans, supports the inference to, and hence justifies one in accepting, the (non-evident) conclusion that all human beings, everywhere and at all times, are rational (for detailed discussion, cf. Allen 2001, 194–241)[^allen-2001]. This obviously is an extremely generous view of what experience, and ultimately sense-perception, can do! Once we recognize the enormously powerful and fundamental role Epicurus and his followers assign to sense-perception, we will not be surprised to see that they feel the need to include in the composition of the soul a very special kind of material that accounts specifically for sense-perception, but apparently do not think that, in addition to that, some further special material is needed to enable intellectual or rational activity.
