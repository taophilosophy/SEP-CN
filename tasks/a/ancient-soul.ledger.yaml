      《理想国》包含大量可供我们刻画苏格拉底所引入的灵魂三部分的信息，不仅见卷四，也见于（其他地方）卷八、卷九对败坏的城邦与灵魂形式的清单。概要如下。理性是灵魂的那个部分：就其本性而言，它系于知识与真理。但它也关切引导与调节它所负责的生活——至少应当负责的生活——理想上以智慧为指引，既考虑三个部分各自的需要，也考虑灵魂整体的需要（442c）；这些需要须被认为包括一个人的身体需要，大概通过欲望部分的关切而来。激情的自然所系是荣誉，更一般地说，是他人的承认与尊重（581a）。作为一种动力，它一般说明自我主张与抱负。当其欲望受挫，它引发愤怒与义愤之类的情感反应，以及表达并自然流自这些反应的行为。苏格拉底认为激情是理性的天然盟友，其功能至少包括：在理性与欲望的冲突中支持理性（440ef、442ab）。把这一功能归给它，并不是说也不蕴含：激情在一个败坏而失其本性的灵魂中不会反噬理性——即便格劳孔那样教养良好的人，无论在自己还是他人身上都不熟悉这种败坏（440b）（*pace* Robinson 1995, 45，他认为苏格拉底在此自相矛盾）[^robinson-1995]。欲望（appetite）首先关切食物、饮料与性（439d、580e）。它引发对这类东西的欲望，每种欲望都单纯而直接地基于这样的想法：得到所欲之物是或将是愉快的。苏格拉底也称欲望为爱财的部分，因为至少在成熟的人那里，欲望也强烈地系于财富，因为其首要欲望主要靠财富来实现（580e–581a）。这个想法必然是：在人类社会中生活的语境里，经由合适的习惯养成与文化教化，欲望倾向于系于财富，并由此开始引发对财富的欲望——每种欲望都单纯而直接地基于这样的想法：得到财富是或将是愉快的；这想法自然而相当可信。（Irwin 1995 与 Price 1995, 57–67 提供另一种不相容的解释。）[^price-1995][^irwin-1995]
