      既然灵魂是一切生物——包括植物——的区分性标志，希腊的灵魂观念如前所见便比我们的“心灵”概念更宽。因为至少可以设想，而且事实上大概也真有其事：存在有生命（因而有灵魂）却没有心灵的有机体，即没有欲望、没有通过感官或理智而来的认知。（柏拉图似乎认为植物确有这种意义上的心灵，因为他认为植物表现出欲望与感觉知觉（《蒂迈欧篇》77b），但那大概被当作经验事实或推断的问题，而非仅仅由“植物有灵魂”这一事实推出。）
