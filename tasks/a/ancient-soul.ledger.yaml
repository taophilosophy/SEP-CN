      如我们已详细所见，希腊的灵魂观念大约早在六世纪——泰勒斯把灵魂归给磁石之时——就已包含灵魂使身体有生命的观念。灵魂与勇敢、节制、正义等道德意义特性的关联，以及与认知、理智功能（尤其筹划与实际思想）的关联，在五世纪希腊用法中已牢固确立。但显然远不清楚的是：从荷马史诗直到五世纪末发展的日常灵魂概念，是否是一个良构、融贯的概念，能否恰当地支撑柏拉图在《斐多篇》以及其他对话中赋予灵魂的突出角色。最紧迫的是，远不清楚的是：区分有生命者与无生命者的那个东西，是否正是——在某些有生命的生物那里——负责感觉知觉与思想等认知功能的东西，是否正是——具体在人那里——承担正义、勇敢等道德品质的东西。《斐多篇》既未明确提出这个问题，当然也未解决它；但《理想国》（352d–354a）的一段（我们将在 3.2 节讨论）提示：柏拉图把日常灵魂概念——连同其全部丰富性与令人困惑的复杂性——当作良构而融贯的，且能支撑其理论的要求。
