      于是，柏拉图在《斐多篇》中所设想的灵魂，其关键特征在于认知与理智方面：它是进行推理者，推理得好坏取决于身体与感官对它的干扰或分心程度；它是调节、控制身体及其欲望与情感者，“尤其若它是一个智慧的灵魂”（94b），大概以某种方式涉及并落实关于何为最佳行动、如何最佳行事的判断；它还具有真正适合它的装饰，即节制、正义与勇敢等德性（114e 及下页）。然而，应当清楚：这里所设想的灵魂并不就是我们设想的“心灵”。它比心灵既宽又窄。宽的一面在于，柏拉图显然保留着灵魂区分有生命者与无生命者的传统观念。灵魂不朽的四条主要论证中，有两条并不依赖灵魂的认知乃至专门心理特征，而只依赖灵魂与生命的熟见联系。按循环论证（70c–72d），活着一般而言既先于死亡、也后于死亡。苏格拉底认为这表明：一个生物死亡时，所涉灵魂继续存在，经过一段与身体分离的时期，然后回来使另一个身体有生命；这一变化是此前变化即死亡的对反。按苏格拉底在《斐多篇》中提出的最后一条论证，灵魂不朽，因为它本质上具有生命，正如火本质上具有热。显然，这两条论证都适用于一切生物的灵魂，包括植物（参 70d, 71d）。而在那条最终论证中，苏格拉底明确诉诸这一观念：正是灵魂使生物的身体有生命（105c）：
