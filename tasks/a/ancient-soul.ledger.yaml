      古代读者也知道《斐多篇》名为柏拉图的《论灵魂》，而《理想国》另有一个古题《论正义》。不过柏拉图把正义构想为灵魂的卓越状态，因此《理想国》对柏拉图的灵魂构想投下大量光亮，并不奇怪。它这样做的一种方式，是把日常灵魂概念的若干核心特征明确整合起来——这些特征在《斐多篇》中多少有些不安地共存着：即对有机体生命的责任（在人那里，即对其作为人而活着并保持活着的责任）、对认知与（尤其）理智功能的责任、以及对勇敢与正义等道德德性的责任。《理想国》卷一末尾，苏格拉底向色拉叙马霍斯提出一个精巧论证，结论是“不义绝不多利过于正义”（354a）。若我们搁置与辩证语境无关的可能性——不义与正义同样有利——那么显然，此结论等价于《理想国》在卷二开头为回应格劳孔的请求而要确立的立场：请苏格拉底说服他“无论如何，做正义的人总比做不义的人好”（357a）。卷一末的论证试图证明一个不必要地强的中介结论：正义者幸福，而不义者悲惨。要确立目标结论，证明正义者总比不义者更幸福就足够了；这与“正义不足以成就（完成的）幸福”相容——后者还需要合适的外部环境。苏格拉底对格劳孔（与阿德曼托斯）的长答中，没有任何东西使他承诺“正义足以（完全）成就幸福”的观点（参 Irwin 1999）[^irwin-1999]。而且，苏格拉底在卷一论证中依赖的灵魂构想，也不蕴含那一观点。再者，《理想国》没有任何东西与这一灵魂构想相矛盾或修改它（相反：参 445a9 及以下、609b 及以下），因此没有理由不把它当作柏拉图对灵魂之持续反思的一个贡献认真对待——即使环绕它的论证本为支持一个苏格拉底随后成功避开的结论。
