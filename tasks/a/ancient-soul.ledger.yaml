      Given that the soul is, according to Aristotle’s theory, a system of abilities possessed and manifested by animate bodies of suitable structure, it is clear that the soul is, according to Aristotle, not itself a body or a corporeal thing. Thus Aristotle agrees with the *Phaedo*’s claim that souls are very different from bodies. Moreover, Aristotle seems to think that all the abilities that are constitutive of the souls of plants, beasts and humans are such that their exercise involves and requires bodily parts and organs. This is obviously so with, for instance, the abilities for movement in respect of place (e.g., by walking or flying), and for sense-perception, which requires sense-organs. Aristotle does not, however, think that there is an organ of thought, and so he also does not think that the exercise of the ability to think involves the use of a bodily part or organ that exists specifically for this use. Nevertheless, he does seem to take the view that the activity of the human intellect always involves some activity of the perceptual apparatus, and hence requires the presence, and proper arrangement, of suitable bodily parts and organs; for he seems to think that sensory impressions [*phantasmata*] are somehow involved in every occurrent act of thought, at least as far as human beings are concerned (*De Anima* 3.7, 431a14–7; 3.8, 432a7–10; cf. *De Memoria* 1, 449b31ff.). If so, Aristotle in fact seems to be committed to the view that, contrary to the Platonic position, even human souls are not capable of existence and (perhaps as importantly) activity apart from the body (cf. *De Anima* 1.1, 403a3–25, esp. 5–16). (Cohoe 2022 offers a different, and incompatible, view.)[^cohoe-2022]
    step1: |-
      既然按照亚里士多德的理论，灵魂是由结构适当的活体所拥有并表现出来的能力系统，那么显然，在亚里士多德看来，灵魂本身并非身体或形体之物。因此亚里士多德同意《斐多》的主张：灵魂与身体大不相同。此外，亚里士多德似乎认为，构成植物、兽类与人类灵魂的一切能力，其运用都涉及并要求身体部分与器官。对于（比如说）位置运动的能力（如行走或飞行）以及需要感觉器官的感知能力，这一点显而易见。然而，亚里士多德并不认为有思想器官，因此他也不认为思维能力的运用涉及使用专为此用而存在的身体部分或器官。尽管如此，他似乎确实认为，人类理智的活动总是涉及某种知觉装置的活动，因而要求合适身体部分与器官的在场与适当安排；因为他似乎认为，至少就人而言，感觉印象［*phantasmata*］以某种方式参与每一次现实的思想活动（《论灵魂》3.7, 431a14–17；3.8, 432a7–10；参《论记忆》1, 449b31 以下）。若如此，亚里士多德实际上似乎承诺了下述与柏拉图立场相反的看法：即便人的灵魂也不能脱离身体而存在，且（也许同样重要地）不能脱离身体而活动（参《论灵魂》1.1, 403a3–25，尤其 5–16）。（Cohoe 2022 提供了一种不同且不相容的看法。）[^cohoe-2022]
