      《斐多》在古代读者中也被称为柏拉图的《论灵魂》，而《理想国》的古代别题则是《论正义》。不过，柏拉图把正义设想为灵魂的卓越状态，因此《理想国》极大地照亮了柏拉图的灵魂构想，并不令人意外。它这样做的一种方式，是把日常灵魂观念中若干核心特征明确整合起来；这些特征在《斐多》中多少不安地并存：即对生物生命（在人这里，就是对其作为人而存在并继续存活）的责任、对认知与（尤其）理智功能的责任，以及对勇气、正义之类道德德性的责任。在《理想国》第一卷末尾，苏格拉底向色拉叙马霍斯提出了一个精细论证，结论是“不正义从不比正义更有利”（354a）。如果我们把不正义与正义*同等*有利这一可能性搁置一旁（它与辩证语境无关），那么这里的结论显然等同于《理想国》第二卷开头应格劳孔之请所要确立的立场：使苏格拉底说服他“做正义者无论如何都比做不义者更好”（357a）。第一卷末尾的论证试图证明一个不必要地过强的中间结论，即正义者幸福而不义者悲惨。要确立所需结论，只需证明正义者总是比不义者*更幸福*；与那个过强的中间结论不同，这一点与下述看法相容：正义不足以带来（完满的）幸福，因为后者还需要合适的外部环境。苏格拉底对格劳孔（与阿德曼图斯）的长篇回答，并未使他承诺正义足以带来（完全的）幸福（参 Irwin 1999）[^irwin-1999]。然而，苏格拉底在此（第一卷）论证中所依赖的灵魂构想，并不蕴含那种看法。此外，《理想国》没有任何内容矛盾或修改这一灵魂构想（相反：参 445a9 以下、609b 以下），因此没有理由不把它认真看作柏拉图持续思考灵魂的一部分，尽管环绕它的论证意在支持一个苏格拉底后来成功避开的结论。
