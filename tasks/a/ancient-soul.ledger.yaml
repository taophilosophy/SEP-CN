      论证从这样一个前提开始：事物若具有适合自身的德性，就履行其功能良好；若具有相关的恶，就履行得糟糕（353c）。接着，论证把“照料事物、统治与思虑（以及诸如此类）”的功能归给灵魂，并补充说*活着*也是灵魂功能的一部分（353d）。由此得出一个中间结论：好的灵魂照料、统治、思虑（等等）并活得好，而坏灵魂则把这些做得糟糕。第三个前提是：正义是适合灵魂的德性，不义则是其恶。于是又得出一个中间结论：正义的灵魂活得好，不义的灵魂活得糟。但下一个前提说，活得好就是幸福（活得糟就是悲惨）。于是苏格拉底可以得出我们已遇到过的中间结论：正义者（即灵魂正义的人）幸福，而灵魂不义的人悲惨。
