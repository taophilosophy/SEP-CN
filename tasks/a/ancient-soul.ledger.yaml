      另一方面，《斐多篇》的灵魂构想在某些方面又显著窄于我们的心灵概念：在这一对话中所设想的灵魂，并不负责——或并不直接负责——一个人的全部心理活动与反应，而只负责其中相当有限的一个子集。苏格拉底把大量心理状态等等归于（有生命的）身体而非灵魂，例如信念与快乐（83d）、欲望与恐惧（94d）。同时，灵魂也不是狭义的理智性的：它也有欲望（81d），甚至有激情的欲望（如非哲学灵魂对形躯之物的爱[erôs]，80b），也有快乐，如学习的快乐（114e）。而且如前所见，灵魂的功能不限于把握与领会真理，还突出地包括调节、控制身体及其情感（如信念与快乐、欲望与恐惧），无疑是依据由推理得出、或无论如何由推理支持与控制的适当判断。《斐多篇》的灵魂，事实上恰是《理想国》卷四中仅被认作灵魂一个部分的那个东西，即理性；而较低部分（欲望与激情）的功能，在《斐多篇》的心理框架中被归给有生命的身体。正如理性（在《理想国》中）与灵魂（在《斐多篇》中）的功能不限于认知，还包括欲望与情感（如对学习的欲望与快乐），非理性灵魂（在《理想国》中）与身体（在《斐多篇》中）的功能也不限于欲望与情感，还包括认知，例如关于欲望对象的（大概的）信念：“描述性的”或（毋宁说）非评价性的（“那边有食物”），以及（*contra* Lovibond 1991, 49）[^lovibond-1991]评价性的（“这饮料真好喝”）（参《斐多篇》83d）。
