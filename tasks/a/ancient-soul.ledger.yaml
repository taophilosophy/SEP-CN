      此外，感觉印象经概念或预念解释与表述之后，会产生关于显明事项的经验，而经验又构成关于非显明事项之结论的基础。例如，广泛经验不仅能让人清楚看出：与自己打过交道的人具有某种特征（比如说理性）；而且（后来的伊壁鸠鲁派会说，这大概多少发展了伊壁鸠鲁的立场）还能让人清楚看出：任何人都不可设想会缺乏该特征（参 L&S 18F4–5）。于是，经验不仅会使人以极大的信心期待：自己将来在任何地方遇到的任何人都将具有理性。按照伊壁鸠鲁派的说法，经验还支持推出、因而使人们有理由接受这个（非显明的）结论：一切人，无论何处、无论何时，都具有理性（详细讨论参 Allen 2001, 194–241）[^allen-2001]。这显然是对经验、并最终对感知所能做到之事的一种极为慷慨的看法！一旦我们认识到伊壁鸠鲁及其追随者赋予感知的巨大而根本的作用，就不会惊讶于他们感到需要在灵魂构成中纳入一种非常特殊的、专门说明感知的物质，却显然不认为除此之外还需要某种进一步的特别物质来促成理智或理性活动。
