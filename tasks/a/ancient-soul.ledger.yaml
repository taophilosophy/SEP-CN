  - id: 5
    kind: body
    source: |-
      Several significant developments occurred in the ways Greeks thought and spoke about the soul in the sixth and fifth centuries. The questions about the soul that are formulated and discussed in the writings of Plato and Aristotle to some extent arise from, and need to be interpreted against the background of, these sixth and fifth century developments. One factor that is of central importance is the gradual loss of the Homeric connection between mentioning a person’s soul and the thought that their life is vulnerable or at risk (*contra* Burnet 1916, 253)[^burnet-1916]. In ordinary fifth century Greek, having soul is simply being alive; hence the emergence, at about this time, of the adjective ‘ensouled’ [*empsuchos*] as the standard word meaning “alive”, which was applied not just to human beings, but to other living things as well. There is some reason to think that the word ‘soul’ was used in this straightforwardly positive way already in the sixth century. Thales of Miletus, who is credited with successfully predicting a solar eclipse occurring in 585, reportedly attributed soul to magnets, on the grounds that magnets are capable of moving iron (Aristotle, *De Anima* 1.2, 405a19–21). Thales’ thought was presumably that since it is distinctive of living things to be able to initiate movement, magnets must in fact be alive or, in other words, ensouled. Thus, while Homer spoke of soul only in the case of human beings, in sixth and fifth century usage soul is attributed to every kind of living thing. What is in place, then, at this time is the notion that soul is what distinguishes that which is alive from that which is not.
    step1: |-
      第六与第五世纪，希腊人关于灵魂的思考与言说出现了几项重要发展。柏拉图与亚里士多德著作中提出并讨论的灵魂问题，在某种程度上正源自这些六、五世纪的发展，也须置于其背景下来解释。其中一个因素至关重要：荷马那里“提及某人之灵魂”与“其生命脆弱或危殆”之间的联系，逐渐松脱（*contra* Burnet 1916, 253）[^burnet-1916]。在五世纪的日常希腊语里，有灵魂就是活着；大约此时，形容词“有灵魂的”[empsuchos]兴起，成为“活着”的标准用词，不仅用于人，也用于其他生物。有理由认为，“灵魂”一词早在六世纪就被以这种直白的肯定方式使用。米利都的泰勒斯——据说他成功预言了 585 年的日食——据传把灵魂归给磁石，理由是磁石能移动铁（亚里士多德，《论灵魂》1.2, 405a19–21）。泰勒斯的思路大概是：既然生物的特异之处在于能发起运动，磁石实际上必定是活的，换言之，有灵魂的。于是，荷马只在人的情形下谈灵魂，而六、五世纪的用法却把灵魂归给每一种生物。此时确立的观念便是：灵魂是活物区别于死物的所在。
    step2: |-
      公元前六、五世纪，希腊人关于灵魂的思考与言说出现了几项重要发展。柏拉图与亚里士多德著作中提出并讨论的灵魂问题，在某种程度上正源自这些发展，也须置于其背景下来解释。其中一个因素至关重要：荷马那里“提及某人之灵魂”与“其生命脆弱或危殆”的关联，逐渐松脱（*contra* Burnet 1916, 253）[^burnet-1916]。在五世纪的日常希腊语里，有灵魂就是活着；大约此时，形容词“有灵魂的”[ *empsuchos* ]兴起，成了“活着”的标准用词，不仅用于人，也用于其他生物。有理由认为，“灵魂”一词早在六世纪就被以这种直白的肯定方式使用：米利都的泰勒斯——据说他成功预言了 585 年的日食——据传把灵魂归给磁石，理由是磁石能移动铁（亚里士多德，《论灵魂》1.2, 405a19–21）。泰勒斯的思路大概是：生物的特异之处在于能发起运动，磁石便必定是活的，换言之，有灵魂的。于是，荷马只在人那里谈灵魂，六、五世纪的用法却把灵魂归给每一种生物。此时确立的观念便是：灵魂是活物区别于死物的所在。
