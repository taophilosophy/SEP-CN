      It is crucially important not to misunderstand these various faculties as parts or aspects of the mind, items that operate with some degree of autonomy from one another and can therefore conflict. On the Stoic theory, the faculties of the mind are simply abilities to do things. Moreover, it is a central part of the theory that, in the case of an adult human being, there is no such thing as an impulse without an act of assent of the mind to a corresponding practical impression. In a rational subject, the faculty of impulse depends on the faculty of assent, which, like all faculties of such a subject, is a rational faculty. This theory leaves no room for the Platonic conception that the souls of adult human beings contain non-rational parts which can, and frequently do, generate impulse and behavior independently of, and even contrary to, the designs and purposes of reason. Nor, relatedly, does it leave room for the shared Platonic and Aristotelian view that desire, even in the case of adult humans, comes in three forms, two of which are such that desires of these forms do not arise from, or depend on, activities of reason. The Stoic theory has the attractive consequence that each adult person is, through their own reasoned assent, unambiguously and equally responsible for all their voluntary behavior: there are no Platonic nonrational parts, or Platonic-Aristotelian nonrational desires, that could produce actions against one’s own reason’s helpless protestations. However, the theory needed to be defended both against rival philosophical theories and against pre-theoretical intuitions that militate in favor of these theories. One such intuition is that passion can, and frequently does, conflict with reason. To judge from a report by Plutarch, it appears that the Stoics were able to explain away this particular intuition, and also to disarm the argument for tripartition of the soul in *Republic* 4, which depends on the *simultaneity* of a desire for and an aversion to one and the same thing. According to Plutarch (L&S 65G1),
    step1: |-
      至关重要的是，不要把这些能力误解为心灵的诸部分或方面，即若干彼此具有某种自主性、因而可能冲突的项目。按照斯多亚理论，心灵的各种能力只是做事的能力。此外，该理论的核心部分之一是：在成年人那里，不存在没有心灵对相应实践印象作出同意行为的冲动。在理性主体中，冲动的能力依赖于同意的能力，而后者如同此类主体的一切能力一样，是理性能力。这一理论没有为柏拉图式构想留出空间：成年人的灵魂包含非理性部分，而这些部分能够、且常常确实独立于理性的设计或目的、甚至违背它们，产生冲动与行为。相关地，它也没有为柏拉图与亚里士多德共有的看法留出空间：欲望即使在成年人那里也有三种形式，其中两种形式的欲望并非源自、也不依赖于理性的活动。斯多亚理论有一个吸引人的推论：每个成年人通过自己的理性同意，都对其全部自愿行为无歧义地、同等地负责——不存在柏拉图式的非理性部分，也不存在柏拉图-亚里士多德式的非理性欲望，能够违背一个人自己理性的无力抗议而产生行动。然而，这一理论既需要抵御竞争性哲学理论，也需要抵御有利于这些理论的前理论直觉。其中一种直觉是：情感能够、且常常确实与理性冲突。从普鲁塔克的一则报道看，斯多亚派似乎能够消解这一特定直觉，也能化解《理想国》第四卷中基于对同一事物同时既有欲望又拒斥而为灵魂三分所作的论证。按照普鲁塔克（L&S 65G1）：
