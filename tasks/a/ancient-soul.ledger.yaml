      In another way, the conception of soul that is in evidence in the *Phaedo* is significantly narrower than our concept of mind, in that the soul, as conceived of in this particular dialogue, is not, in fact, responsible, or *directly* responsible, for all of a person’s mental or psychological activities and responses, but only for a rather severely limited subset of them. Socrates attributes a large variety of mental states (etc.) not to the soul, but to the (animate) body, such as, for instance, beliefs and pleasures (83d), and desires and fears (94d). At the same time, the soul is not narrowly intellectual: it too has desires (81d), even passionate ones (such as the nonphilosophical soul’s love [*erôs*] of the corporeal, 80b), and pleasures as well, such as the pleasures of learning (114e). Moreover, the soul’s functions are, as we have seen already, not restricted to grasping and appreciating truth, but prominently include regulating and controlling the body and its affections (such as beliefs and pleasures, desires and fears), no doubt in light of suitable judgments, arrived at, or anyhow supported and controlled, by reasoning. The soul of the *Phaedo*in fact seems to be precisely what in *Republic* 4 is identified as just one part of the soul, namely reason, whereas the functions of the lower parts, appetite and spirit, are assigned, in the psychological framework of the *Phaedo*, to the animate body. And just as the functions of reason (in the *Republic*) and of the soul (in the *Phaedo*) are not restricted to cognition, but include desire and emotion, such as desire for and pleasure in learning, so the functions of non-rational soul (in the *Republic*) and of the body (in the *Phaedo*) are not restricted to desire and emotion, but include cognition, such as beliefs (presumably) about objects of desire, ‘descriptive’ or (rather) non-evaluative (“there’s food over there”) as well as (*contra* Lovibond 1991, 49)[^lovibond-1991] evaluative (“this drink is delightful”) (cf. *Phaedo* 83d).
