      Thus the soul, as Plato conceives of it in the *Phaedo*, is crucially characterized by cognitive and intellectual features: it is something that reasons, more or less well depending on the extent to which it is disturbed or distracted by the body and the senses; something that regulates and controls the body and its desires and affections, “especially if it is a wise soul” (94b), presumably in a way that involves, and renders effective, judgments about what it is best to do, and how it is best to behave; and something that has, as the kind of adornment that is truly appropriate to it, virtues such as temperance, justice and courage (114e f.). However, it should be clear that the soul, as it is conceived of here, is not simply the mind, as we conceive of it. It is both broader and narrower than that. It is broader in that Plato evidently retains the traditional idea of soul as distinguishing the animate from the inanimate. Two of the four main lines of argument for the immortality of the soul rely not on cognitive or indeed specifically psychological features of the soul, but simply on the familiar connection between soul and life. According to the cyclical argument (70c-72d), being alive in general is preceded by, just as it precedes, being dead. Socrates takes this to show that a creature’s death involves the continued existence of the soul in question, which persists through a period of separation from body, and then returns to animate another body in a change which is the counterpart of the previous change, dying. According to the last line of argument that Socrates offers in the *Phaedo*, the soul is immortal because it has life essentially, the way fire has heat essentially. It is plain that both of these arguments apply to the souls of all living things, including plants (cf. 70d, 71d). And in that final argument, Socrates explicitly appeals to the idea that it is the soul that animates the body of a living thing (105c):
