      The semantic expansion of ‘soul’ in the sixth and fifth centuries is reflected in the philosophical writings of the period. For instance, once it becomes natural to speak of soul as what distinguishes the animate from the inanimate, rather than as something that is restricted to humans, it becomes clear that the domain of ensouled things is not limited to animals, but includes plants as well. Empedocles and, apparently, Pythagoras (cf. Bremmer 1983, 125)[^bremmer-1983] thought that plants have souls, and that human souls, for instance, can come to animate plants. (Note, though, that Empedocles, in extant fragments, rarely uses the word ‘soul’, preferring the word *daimôn*.) Empedocles in fact claimed to have been a bush in a previous incarnation, as well as, among other things, a bird and a fish (fr. 117, Kirk, Raven & Schofield 1983 [in what follows KR&S], 417). Incidentally, Empedocles, like Anaxagoras and Democritus, referred to plants as animals, presumably precisely because they are alive (*zên*, from which the word for animal, *zôon*, derives) (for details, cf. Skemp 1947, 56)[^skemp-1947]. In this he was followed by Plato (*Timaeus* 77b), but emphatically not by Aristotle (*De Anima* 2.2, 413b1f).
    step1: |-
      “灵魂”在六世纪和五世纪的语义扩展，反映在那个时期的哲学著述中。例如，一旦把灵魂说成区分有生者与无生者的东西、而不是某种限于人的东西，变得自然，那么就清楚了：有灵魂之物的范围并不限于动物，而是也包括植物。恩培多克勒以及（看来）毕达哥拉斯（参 Bremmer 1983, 125）[^bremmer-1983] 认为植物有灵魂，并且人的灵魂能够转而赋予植物以生命。（不过要注意，恩培多克勒在今存残篇中很少使用“灵魂”一词，更偏爱 *daimôn* 一词。）恩培多克勒实际上声称自己在前世曾是一丛灌木，除此之外还曾是一只鸟和一条鱼（fr. 117，Kirk, Raven & Schofield 1983［以下简称 KR&S］，417）。顺带一提，恩培多克勒与阿那克萨戈拉、德谟克利特一样，把植物称为动物，想必正因它们是活的（*zên*，“动物”一词 *zôon* 即由此派生）（详见 Skemp 1947, 56）[^skemp-1947]。在这一点上，柏拉图（《蒂迈欧》77b）追随了他，而亚里士多德（《论灵魂》2.2，413b1f）则断然没有。
