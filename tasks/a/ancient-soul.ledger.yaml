      It is probably true that in mainstream fifth century Greek culture, belief in an afterlife of the soul was weak and unclear (Claus 1981, 68; Burnet 1916, 248–9)[^burnet-1916][^claus-1981]. If so, it is fitting that Socrates’ arguments for the immortality of the soul, most prominently in the *Phaedo*, are offered to interlocutors who, at the outset of the discussion, are by no means convinced of the idea. (In fact, in the *Apology*, 40c, Socrates himself is presented as being noncommittal about what happens to the soul at death, and even about whether it survives at all.) “Men find it very hard to believe”, Cebes says at *Phaedo* 70a, “what you said about the soul. They think that after it has left the body it no longer exists anywhere, but that it is destroyed and dissolved on the day the man dies.” This view is restated by Simmias (at 77b) as the opinion of the majority (cf. 80d); note that the view includes the idea that the soul is a material thing, and is destroyed by being dispersed, “like breath or smoke” (70a). Glaucon, in the last book of the *Republic* (608d), is taken aback by Socrates’ question,
