      既然灵魂是一切生物（包括植物）的区分标志，那么如我们已见，希腊人的灵魂观念就比我们的心灵概念更宽。因为至少可以设想——而且事实上很可能为真——存在没有心灵的活（因而有灵魂的）有机体；也就是说，它们没有欲望，也没有经由感官或理智的认知。（柏拉图似乎认为植物确实具有这种意义上的心灵，因为他认为植物表现出欲望与感知（《蒂迈欧》77b）；但这想必应被视为经验事实或推论，而不是植物有灵魂这一事实的简单推论。）
