      那么，一旦我们正确理解《斐多》的灵魂理论，就能看出它提供了一个前后融贯的心理学框架，尽管远未充分展开。但我们也应指出，这一理论有些不能令人满意：它似乎相当醒目地未能公正对待心灵的统一性。我们称为心理或精神活动的各种活动（等等），例如（最重要的是）欲望与认知，似乎是、或向我们显现为单一整合主体的活动；它们（通常）并不显得属于若干彼此多少独立运作的、彼此不同的项目。当苏格拉底对数学真理的沉思被对食物的强烈欲望打断时，看来并不是一个东西（比如说他的灵魂）一直在沉思，另一个东西（比如说他的身体）现在想吃点东西。毋宁说，沉思与想吃的欲望似乎都属于同一个整合主体，无论我们愿意说该主体是苏格拉底的心灵，还是更愿意说是有心灵的苏格拉底（或诸如此类）。实际情况是，《斐多》的心理学理论把苏格拉底的沉思直接归给他的灵魂，却把他的食欲奇怪地搁得远远的，似乎认为（比如说）“身体”欲望与灵魂的关系，颇类似于（比如说）新陈代谢与生长所涉及的操作与灵魂的关系。（后者之所以发生，也只是因为他的身体有灵魂。）柏拉图很可能感受到了这个问题的压力，尽管并不确定。无论如何，《理想国》提出的新灵魂理论解决了它。
