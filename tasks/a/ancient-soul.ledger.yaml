      Moreover, apart from the question of immortality or otherwise, there is the further question whether the soul, if it does have some form of existence after the person has died, “still possesses some power and wisdom” (*Phaedo*, 70b; cf. 76c). Answering both questions, Socrates says not only that the soul is immortal, but also that it contemplates truths after its separation from the body at the time of death. Needless to say, none of the four main lines of argument that Socrates avails himself of succeeds in establishing the immortality of the soul, or in demonstrating that disembodied souls enjoy lives of thought and intelligence (for a detailed discussion, see Bostock 1986 and Ebrey 2023)[^bostock-1986][^ebrey-2023]. However, the arguments do shed light on Plato’s conception of the soul, especially the affinity argument (78b-80b). This argument confronts head-on the widespread worry that the soul, at or soon after death, is destroyed by being dispersed. It begins by distinguishing between two kinds of things: on the one hand, things that are perceptible, composed of parts, and subject to dissolution and destruction; on the other hand, things that are not perceptible, but intelligible (grasped by thought), not composed of parts, and exempt from dissolution and destruction. These two categories are obviously mutually exclusive. It is not clear whether or not they are meant to be exhaustive. Moreover, the category of imperishable, intelligible being is exemplified, but not, it seems, exhausted, by Platonic forms such as equality, beauty and the like (*contra* Bostock 1986, 118)[^bostock-1986]. Intelligible being evidently includes what Socrates calls the divine, whose nature it is to rule and to lead (80a), and there is no indication that the forms exhaust the divine, or even include the divine, so understood. Thus the argument leaves room for the idea that souls are not forms, but are nevertheless intelligible, partless and imperishable (*contra* Robinson 1995, 29)[^robinson-1995]. In fact, in framing the argument in the way he does Plato furnishes the conceptual framework needed for saying that body and soul differ in kind, the one being perceptible and perishable, the other being intelligible and exempt from destruction. However, the argument does not support such a strong conclusion, and Socrates is aware of this.
