      What he does, in fact, conclude is that the soul is *most like*, and *most akin to*, intelligible being, and that the body is most like perceptible and perishable being. To say this is plainly neither to assert nor to imply (as Robinson 1995, 30, appears to think)[^robinson-1995] that soul in some way or other falls short of intelligible, imperishable being, any more than it is to assert or imply that body in some way or other falls short of, or rather rises above, perceptible, perishable being. The argument leaves it open whether soul is a perfectly respectable member of intelligible reality, the way human bodies are perfectly respectable members of perceptible reality, or whether, alternatively, soul has some intermediate status in between intelligible and perceptible being, rising above the latter, but merely approximating to the former. Socrates does seem to take his conclusion to imply, or at least strongly suggest, that it is natural for the soul either “to be altogether indissoluble, or nearly so”, but, in any case, that the soul is less subject to dissolution and destruction than the body, rather than, as the popular view has it, more so. If this position can be established, Socrates is in a position to refute the popular view that the soul, being composed of ethereal stuff, is *more* liable to dispersion and destruction than the body. However, as Cebes points out (88b), unless Socrates can establish that the soul is altogether exempt from destruction, confidence of survival in the face of death is misplaced. Socrates’ soul may be a great deal more durable than his body, but as long as it is not truly imperishable, there can be no guarantee that it will survive Socrates’ impending death. For it might have experienced any number of incarnations already, and the current one might be its last. So Socrates launches his most elaborate and final argument for the immortality of the soul, which concludes that since life belongs to soul essentially, the soul must be deathless — that is, immortal.
    step1: |-
      他实际上得出的结论是：灵魂*最像*、也*最亲近*可理解的存在，而身体最像可感知且可朽的存在。这样说显然既没有断言、也没有蕴含（如 Robinson 1995, 30 似乎认为的那样）[^robinson-1995]灵魂在某种方式上不及可理解、不朽的存在，正如它既没有断言也没有蕴含身体在某种方式上不及、或毋宁说高于可感知、可朽的存在。这一论证对以下两点保持开放：灵魂究竟是可理解实在中一个完全正派的成员（正如人的身体是可感知实在中完全正派的成员），还是灵魂具有某种介于可理解存在与可感知存在之间的中间地位，高于后者而仅近似于前者。苏格拉底看来确实认为自己的结论蕴含、或至少强烈提示：灵魂自然“完全不可分解，或近乎如此”；但无论如何，灵魂比身体更不易消散和毁灭，而不是像流行看法那样更易。若这一立场能够成立，苏格拉底就能驳倒流行看法：灵魂由以太般的东西组成，因而*更*容易消散和毁灭，甚于身体。然而，正如齐贝斯指出（88b），除非苏格拉底能确立灵魂完全免于毁灭，否则面对死亡仍确信其存续，便是错置的信心。苏格拉底的灵魂也许比他的身体耐久得多，但只要它并非真正不朽，就无法保证它能捱过苏格拉底迫在眉睫的死亡。因为它可能已经经历过无数次轮回，而当前这一次也许是最后一次。于是苏格拉底发起他为灵魂不朽所作的最精细、也是最后的论证；其结论是：既然生命本质上属于灵魂，灵魂必定不死，即不朽。
