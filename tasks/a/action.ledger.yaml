      Bratman also tries to expand his planning theory to explain the rationality of acting on a future-directed intention even in cases in which judgment or preference shifts might seem to justify acting otherwise. In earlier work, Bratman (1999b)[^bratman-1999b] appeals to a “no-regret” condition; roughly, a requirement that we should not reconsider or revise an intention if we’ll regret having done so at the conclusion of our planned actions. In later work, Bratman (2018)[^bratman-2018] appeals to the end of self-governance, an end that is typically shared by human agents, to explain the rationality of sticking to one’s intentions in face of temptation (for somewhat similar ideas in the context of cooperation, see Velleman 1997)[^velleman-1997]. According to Bratman, self-governance is a form of agency in which the agent acts from a standpoint that is truly his own; a self-governing agent is guided “by attitudes that constitute where he stands” (Bratman 2018, 159)[^bratman-2018].[^note-4] On this view, self-governance has both a synchronic and diachronic form. Synchronic self-governance requires a coherent practical standpoint at a time that can constitute where the agent stands in a coherent manner, while diachronic self-governance requires a coherent standpoint across different times when the agent’s plans stretch through an extended period. Since typically planning agents also have self-governance as one of their ends, the need for such a coherent standpoint generates reasons to conform to a requirement not to revise intentions not only in cases of temptation, but also in cases in which an agent forms a future-directed intention to choose one of a number of alternatives that are either indifferent or incommensurable. Even though in such cases an agent has sufficient reasons to act differently than she intends (since other options are just as good or at least on a par), self-governance requires that she preserves a coherent standpoint over time (for a different way to justify normative reasons against “brute shuffling” in terms of self-governance, see Paul 2014; for skepticism about some of these requirements against brute shuffling, see Ferrero 2010; Nefsky and Tenenbaum 2022)[^ferrero-2010][^nefsky-2022].
    step1: |-
      布拉特曼还试图扩展其计划理论，以解释如下情形中的合理性：即使判断或偏好发生转变似乎为另作行动提供了理由，依据面向未来的意图行动仍属合理。在早期工作中，布拉特曼（1999b）[^bratman-1999b] 诉诸一个“不后悔”条件；大致而言，该要求是：如果我们会在计划行动结束时后悔曾重新考虑或修改某个意图，我们就不应那样做。在后期工作中，布拉特曼（2018）[^bratman-2018] 诉诸自我治理这一目的——人类行动者通常共有这一目的——来解释在诱惑面前坚持自己意图的合理性（关于合作语境中有些类似的想法，见 Velleman 1997）[^velleman-1997]。按布拉特曼的看法，自我治理是一种能动性形式，其中行动者从一个真正属于他自己的立场出发行动；自我治理的行动者受“构成其立场的那些态度”引导（Bratman 2018, 159）[^bratman-2018]。[^note-4] 按此观点，自我治理既有共时形式，也有历时形式。共时自我治理要求在某一时刻持有一个融贯的实践立场，它能以融贯方式构成行动者所处立场。历时自我治理则要求：当行动者的计划延展于较长时期时，在不同时间持有融贯的立场。既然计划性行动者通常也把自我治理作为其目的之一，对这种融贯立场的需要就产生了理由，使我们遵从一项不修改意图的要求。这不仅适用于诱惑情形，也适用于行动者形成面向未来的意图、要从若干要么无差别、要么不可通约的备选项中选定一个的情形。即使在这类情形中，行动者有充足理由采取不同于其所意图的做法（因为其他选项同样好，或至少不相上下）。自我治理仍要求她在时间中保持融贯的立场（关于以自我治理为依据、为反对“粗暴更换”提供规范理由的另一种方式，见 Paul 2014；关于反对这类针对粗暴更换之要求的怀疑，见 Ferrero 2010; Nefsky and Tenenbaum 2022）[^ferrero-2010][^nefsky-2022]。
