      Thus, Bratman, as well as a number of other philosophers afterwards (for instance, Holton 2004; Holton 2009; Yaffe 2010; Paul 2014)[^holton-2004][^holton-2009][^yaffe-2010], suggest that an account of planning agency reshapes our understanding of agency and practical rationality. Bratman (1987)[^bratman-1987] argues, for instance, that certain dispositions for nonreconsideration are essential to understanding the rationality of limited agents like ourselves. Holton (2004; 2009)[^holton-2004][^holton-2009] extends Bratman’s account to another function of a future-directed intention: resisting temptation when we expect preferences and judgment shifts. We achieve this, according to Holton, by forming *resolutions*: intentions to remain firm in our intentions, which are harder to reconsider than simple desires or (first-order) intentions. (See Paul 2011a for some skepticism about this extension.)[^paul-2011a]
    step1: |-
      因此，布拉特曼以及后来不少哲学家（例如 Holton 2004; Holton 2009; Yaffe 2010; Paul 2014）[^holton-2004][^holton-2009][^yaffe-2010] 提出，一种关于计划性能动性的说明会重塑我们对能动性与实践合理性的理解。例如，布拉特曼（1987）[^bratman-1987] 论证，某些不重新考虑的倾向对于理解我们这类有限行动者的合理性至关重要。霍尔顿（2004; 2009）[^holton-2004][^holton-2009] 把布拉特曼的说明扩展到面向未来意图的另一种功能：在我们预计偏好与判断会发生转变时抵抗诱惑。按霍尔顿的看法，我们通过形成 **决心** 来做到这一点：决心是保持自己意图不变的意图，它比简单欲望或（一阶）意图更难被重新考虑。（关于这一扩展的若干怀疑，见 Paul 2011a。）[^paul-2011a]
