      The most influential alternative to this “coarse-grained” account is a “fine-grained” account that individuates actions (and events, more generally) in terms of their properties (Kim 1966; 1969; 1973; 1976; Goldman 1970)[^goldman-1970][^kim-1966]. On this view, *A* and *B* are the same action just in case *A* has all and only the properties that *B* has; and for each set of such properties, there is an event. Since moving one’s hands, pumping water, and poisoning are distinct properties, this view entails that the pumper’s moving of his hands, his pumping of the water, and his poisoning of the inhabitants are distinct actions.
    step1: |-
      这一“粗粒度”说明最有影响的替代方案，是一种“细粒度”说明，它依据属性来个体化行动（以及更一般而言，事件）（Kim 1966; 1969; 1973; 1976; Goldman 1970）[^goldman-1970][^kim-1966]。按此观点，*A* 与 *B* 是同一个行动，当且仅当 *A* 具有 *B* 所具有的全部属性且仅具有这些属性；并且，对每一组这样的属性，都有一个事件。既然移动双手、抽水与投毒是彼此不同的属性，该观点就蕴涵：抽水者移动双手、抽水与毒害居民是彼此不同的行动。
    step2: |-
