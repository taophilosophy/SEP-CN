      在此论证的基础上，Lavin（2013）对“必定存在（目的论的）基本行动”这一观点提出了进一步挑战。Lavin 的论证聚焦于行动者与其行动的关系。先考虑一个非基本行动，如毒害屋里的居民。行动者与该行动的关系本身是一件能动性的事情，因为行动者是通过有意向地做别的事（操作水泵）来毒害居民的。现在考虑任意的基本行动 *A*。按定义，行动者不是通过做别的事来做 *A* 的。然而，这是一个在时间中发生的行动，因此想必存在发生之事 *h₁, h₂, …, hₙ*，*A* 经由它们而发生。但既然 *h₁, h₂, …, hₙ* 只是发生之事，这就意味着行动者与 *A* 的关系是非能动性的。Lavin 承认，我们有时或许可以以非能动的方式与自己的行动相关联；但若这必然如此，那就令人警觉了，而基本行动的辩护者恰恰不得不主张这一点（即这种情况必然如此）。这将意味着行动者必然与其行动相异化，正如在马克思对资本主义的批判中劳动者与其劳动相异化一样。Lavin 进而论证，这会使行动者不可能对自己的行动拥有自我知识，因为自我知识以我们的能动关系为基础。
