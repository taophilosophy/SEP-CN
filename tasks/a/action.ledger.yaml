      This reveals at least one important sense in which practical knowledge is the “cause of what it understands”. It is the formal cause because the agent’s grasp determines what the action is (an intentional action with a determinate content). In turn, this shows why, in the phrase Anscombe borrows from Aristotle’s *Magna Moralia,* “the mistake is in the performance” when it doesn’t conform to the judgment (§32): qua formal cause, the knowledge sets the standard for what is known. Whether, like Aristotle, Anscombe holds that practical knowledge is also an efficient cause is a complex, and disputed question (see Setiya 2016a for skepticism, and Piñeros Glasscock 2020a for endorsement)[^piñeros-2020a][^setiya-2016a].
