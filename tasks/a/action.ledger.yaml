      The problems of subsuming practical activity in general to making find echoes in some contemporary thinkers. For example, Thompson (2008)[^thompson-2008], following Baier (1970)[^baier-1970] and Mueller (1979)[^mueller-1979], criticizes attempts like Castañeda’s (1970) and Chisholm’s (1970)[^chisholm-1970] of construing actions in terms of a schemas such as ‘bringing it about that *p*’; such propositional complexes, according to critics, threaten to undermine the practical form of the thought they mean to capture (cf. Hornsby 2016, Wilson 1980, pp.111–117 for further discussion)[^hornsby-1980][^hornsby-2016][^wilson-1980]. Arendt herself thought that this tendency underlay the attraction of utilitarianism, but she argued that, like Marxism, that view was incapable of ever giving further meaning to our practical endeavours (p.105). Korsgaard concludes with equal severity that given a distinction between praxis and poíêsis, “utilitarianism is not a moral theory, for utility is a property of [productions], not actions” (2009, p.18n26).
    step1: |-
      把一般实践活动归摄于制作之下所带来的问题，在当代一些思想家那里得到呼应。例如，汤普森（2008）[^thompson-2008] 追随 Baier（1970）[^baier-1970] 与 Mueller（1979）[^mueller-1979]，批评 Castañeda（1970）与 Chisholm（1970）[^chisholm-1970] 等人以‘使 *p* 发生’这类图式来理解行动的尝试；批评者认为，此类命题复合体会损害它们想要把握的思想的实践形式（进一步讨论参看 Hornsby 2016、Wilson 1980, pp.111–117）[^hornsby-1980][^hornsby-2016][^wilson-1980]。阿伦特本人认为，这一倾向是功利主义吸引力的根源；但她论证，与马克思主义一样，这种观点永远无法为我们的实践努力赋予进一步的意义（p.105）。科尔斯戈德同样严厉地断言：一旦区分 praxis 与 poíêsis，“功利主义就不是一种道德理论，因为效用是［制作物］的属性，而不是行动的属性”（2009, p.18n26）。
