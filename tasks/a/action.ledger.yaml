      Secondly, Setiya (2010)[^setiya-2010] relies on the distinction between an explanatory reason and a normative reason to argue against the “guise of the good” (see Alvarez 2017 for a detailed account of the distinction)[^alvarez-2017]; his argument there could be extended to other proposals for the constitutive aim of action. An intentional action is an action done for an *explanatory* reason, namely, a reason that explains why the agent acted as she did, in Anscombe’s special sense of the question ‘Why’. However, Setiya points out that an explanatory reason need not be a *normative* reason; in fact, any reason that the agent believes to be her reason to act can be an explanatory reason, even if the object of such a reason is not good in any way. But since the reasons that explain intentional action need not be good in any way, it seems false that the agent must act only on reasons that she regards to be good in some way, and thus that she aims at the good in acting.
    step1: |-
      其二，针对善的外观：塞蒂亚（2010）[^setiya-2010] 借助说明性理由与规范理由的区分来反驳“善的外观”（关于这一区分，详见 Alvarez 2017）[^alvarez-2017]；他在那里的论证可推广到其他关于行动构成性目的的提议。意向行动是出于 **说明性** 理由而做的行动，所谓说明性理由，就是在安斯康姆“为什么”这一问题的特殊意义上，解释行动者为何如此行动的理由。然而塞蒂亚指出，说明性理由不必是 **规范性** 理由；事实上，行动者相信是自己行动理由的任何理由都可以是说明性理由，即便这种理由的对象在任何意义上都不好。但既然解释意向行动的理由不必在任何意义上都好，那么“行动者只按她认为在某种意义上是好的理由行动”“她在行动中追求善”，似乎就是错的。
