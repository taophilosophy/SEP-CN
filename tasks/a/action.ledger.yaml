      Other scholars grant the basic links between agency and reasons or means-ends reasoning but question further presuppositions of the argument. For example, some scholars grant that actions must be done for a reason, but hold that (some) animals meet this condition, since they are capable of having non-conceptual thoughts (Hurley 2003)[^hurley-2003]; they can engage in certain forms of inference in virtue of a non-linguistic sensitivity to inferential relations; and at least some of them (like chimpanzees) manifest a distinctive kind of sensitivity to reasons that doesn’t presuppose higher-order thought (Glock 2009; Arruda and Povinelli 2016)[^arruda-2016][^glock-2009]. Using a similar strategy, Camp and Shupe (2017) grant that action presupposes the capacity to distinctively represent means and ends but argue that the features presupposed by such a capacity are more minimal than skeptics about animal agency assume: for example, they may include metacognitive resources that keep track of a state without representing it as such.
    step1: |-
      另一些学者承认能动性与理由或手段—目的推理之间的基本关联，却质疑该论证的进一步预设。例如，一些学者承认行动必须为理由而做，但主张（某些）动物满足这一条件，因为它们能够拥有非概念性思想（Hurley 2003）[^hurley-2003]；它们凭借对推理关系的非语言敏感性而能从事某些形式的推理；并且至少其中一些（如黑猩猩）表现出一种独特类型的理由敏感性，它并不预设高阶思想（Glock 2009; Arruda and Povinelli 2016）[^arruda-2016][^glock-2009]。Camp 与 Shupe（2017）采用类似策略，承认行动预设了以独特方式表象手段与目的的能力，但论证这种能力所预设的特征比动物能动性怀疑论者所设想的更为起码。例如，这些特征可能包括某些元认知资源，它们追踪某一状态，却并不把它表象为如此。
    step2: |-
      另一些学者承认能动性与理由或手段—目的推理之间的基本关联，却质疑该论证的进一步预设。例如，一些学者承认行动必须为理由而做，但主张（某些）动物满足这一条件，因为它们能够拥有非概念性思想（Hurley 2003）[^hurley-2003]；它们凭借对推理关系的非语言敏感性而能从事某些形式的推理；并且至少其中一些（如黑猩猩）表现出一种独特类型的理由敏感性，它并不预设高阶思想（Glock 2009; Arruda and Povinelli 2016）[^arruda-2016][^glock-2009]。Camp 与 Shupe（2017）采用类似策略，承认行动预设了以独特方式表象手段与目的的能力，但论证这种能力所预设的特征比动物能动性怀疑论者所设想的更为起码。例如，这些特征可能包括某些元认知资源，它们追踪某一状态，却并不把它表象为如此。
