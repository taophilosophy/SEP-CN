      One alternative to the causal view understands agency as a form of irreducible agent-causation. Chisholm (1964)[^chisholm-1964] presents a classic version of the view; Alvarez and Hyman (1998) presents a radically different version which denies that agents cause the actions themselves; Mayr (2011)[^mayr-2011] develops a version of the view that, unlike Chisholm’s version, tries to show that human agency is not essentially different from other forms of substance causation that we find in the natural world. A second alternative sees intentional explanations as teleological rather than causal explanations (Wilson 1980; Cleveland 1997; Schueler 2003; Sehon 2005)[^cleveland-1997][^schueler-2003][^sehon-2005][^wilson-1980]; that is, an intentional explanation cites the goal, the purpose, or the reason for which the agent acted *rather than* the antecedent causes of the action. Defenders of this view also try to provide an understanding of the teleological structure of intentional action that denies that teleological explanations reduce to causal explanations; they are instead a *sui generis* form of explanation. One way this view can meet Davidson’s Challenge is to argue that the truth of certain counterfactuals distinguishes potential reasons from the actual reasons. For instance, it could be true that even though the fact that the asparagus was delicious was a potential reason for Mary to eat asparagus, she would not have eaten them if they were not healthy and she would have eaten them even if they were not delicious (Löhrer and Sehon 2016)[^löhrer-2016]; such counterfactuals, on this view, are not grounded on causal relations between mental states and the bodily movements, but on the teleological structures that constitute intentional action. Finally, the causal account also contrasts with the neo-Aristotelian view in which human action is constituted, roughly, by a special form of practical knowledge (Anscombe 1957)[^anscombe-1957]; on this view, in intentional action, “knowledge is the [formal] cause of what it understands” (see section 4 of this entry).
    step1: |-
      因果观点的一种替代方案把能动性理解为一种不可还原的行动者因果性。Chisholm（1964）[^chisholm-1964] 给出了该观点的经典版本；Alvarez 与 Hyman（1998）给出了一个截然不同的版本，它否认行动者引起行动本身；Mayr（2011）[^mayr-2011] 发展出一种版本，与 Chisholm 的版本不同，它试图表明人类能动性与我们在自然界中发现的其他实体因果形式并无本质区别。第二种替代方案把意向解释视为目的论解释而非因果解释（Wilson 1980; Cleveland 1997; Schueler 2003; Sehon 2005）[^cleveland-1997][^schueler-2003][^sehon-2005][^wilson-1980]；也就是说，意向解释援引行动者行动的目的、目标或理由，**而非** 行动的先行原因。该观点的辩护者还试图提供一种对意向行动目的论结构的理解，否认目的论解释可还原为因果解释；它们毋宁是一种 *sui generis* 的解释。该观点回应戴维森挑战的一种方式是论证：某些反事实的真值可区分潜在理由与实际理由。例如，情形可能是：尽管芦笋美味是玛丽吃芦笋的潜在理由，但如果芦笋不健康，她就不会吃；而即使芦笋不美味，她也会吃（Löhrer and Sehon 2016）[^löhrer-2016]；按该观点，这类反事实并非基于心理状态与身体运动之间的因果关系，而是基于构成意向行动的目的论结构。最后，因果说明还与一种新亚里士多德主义观点形成对比：按该观点，人类行动大体上由一种特殊形式的实践知识构成（Anscombe 1957）[^anscombe-1957]；在该观点看来，在意向行动中，“知识是其所理解之物的［形式］原因”（见本词条第 4 节）。
