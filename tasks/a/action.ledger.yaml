      On a somewhat different vein, some philosophers have challenged the view that there is a significant metaphysical “break” between a prior intention and an action in progress. From the time I decide to make an omelet, to the time the finished product is on my plate, my agency unfolds in various stages and phases in pursuit of this end: I plan to make an omelet, I check which ingredients I need, I make sure that I leave myself enough time to go to the store while engaged in other activities in the morning, I buy the milk, go back home, melt the butter, break the eggs, drop them on the pan, and so forth. These are all parts, or phases, of the unfolding of the activity that, if nothing untoward happens, will result in my having made an omelet. Although we can impose various breaks and divide the process into “intending”, “preparing”, “making the omelet”, these breaks are largely arbitrary from the point of view of the activity itself (Thompson 2008; Moran and Stone 2009; Ferrero 2017; Russell 2018)[^ferrero-2017][^moran-2009][^russell-2018][^thompson-2008]; a metaphysics of intention that emphasizes differences risks losing sight of the continuity of the phenomena (for criticisms of these deflationary ideas about the differences between the various phases of the activity from intending to doing, see Yaffe 2010; Paul 2014)[^yaffe-2010].
    step1: |-
      在略有不同的方向上，一些哲学家质疑如下观点：先前的意图与进行中的行动之间存在重大断裂，而且是形而上学的断裂。从我决定做一份煎蛋卷，到成品摆在我盘子里，我的能动性在追求这一目的的过程中以若干阶段与环节展开。我计划做一份煎蛋卷，我查看需要哪些食材，我确保自己在早晨从事其他活动的同时留出足够时间去商店，我买牛奶、回家、融化黄油、打鸡蛋、把蛋倒进平底锅，如此等等。若没有意外发生，这些都是这一活动之展开的部分或环节，而该活动最终将使我做成一份煎蛋卷。尽管我们可以设置各种断点，把这一过程划分为“意图”“准备”“制作煎蛋卷”，但从活动本身来看，这些断点大体上是任意的（Thompson 2008; Moran and Stone 2009; Ferrero 2017; Russell 2018）[^ferrero-2017][^moran-2009][^russell-2018][^thompson-2008]；一种强调差异的意图形而上学，有看不到现象之连续性的风险（对于这些认为从意图到行动的各阶段之间差异无关紧要的紧缩论观念，Yaffe 2010 与 Paul 2014 提出了批评）[^yaffe-2010]。
