      例如，如果要做 *A* 就必须做 *B*，要做 *B* 就必须做 *C*，如此以至无穷（*ad infinitum*），那么做任何事似乎都要求做无穷多件事。更令人担忧的是，行动的开端对行动者来说似乎是“在逻辑上无法企及”的，因为在她开始做任何事之前，总还有别的事需要她去做（Danto 1979, 471）[^danto-1979]。再者，行动者若要知道自己当前在做什么，就需要知道如何去做她借以做成此事的事情；但除非有某件事是她仅凭做它就能知道如何去做的，否则她根本不可能知道自己正在做什么（Hornsby 2013）[^hornsby-2013]。
