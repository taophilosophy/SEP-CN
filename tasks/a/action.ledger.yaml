      This also gives us the barebones of a causal theory of action: according to “causalists”, intentional action is explained in terms of mental states that are the causal antecedents, or concomitants, of the agent’s behaviour or bodily movement. Subsequent to Davidson, causalists have aimed to provide reductive explanations: intentional action is identified with behaviour or bodily movement (or in less “ambitious” versions of the view, a more general form of action, see Setiya 2011)[^setiya-2011] whose causal antecedents (or concomitants) are certain specified mental states. Although Davidson himself is often portrayed as proposing a reductive analysis, he never presents any of his views as fulfilling such ambition and expresses skepticism that such analysis is possible given the problem of deviance (see below).
    step1: |-
