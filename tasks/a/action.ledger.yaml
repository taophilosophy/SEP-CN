      Thus far, we have examined ways in which defenders of animal agency can play defense, by criticizing different parts of the argument for animal skepticism. When playing offense, defenders of animal agency commonly appeal to our common ways of speaking and thinking about animals, which, as noted, provide prima facie good grounds to ascribe them agency. In addition, it has been noted that the heightened conditions on agency commonly used to exclude animals would have counterintuitive effects *for human actions.* After all, many of our human intentional actions (such as habitual actions) do not seem to involve higher-order thought, or previous deliberation (a key insight that leads Hyman 2015 to distinguish different senses of “acting”)[^hyman-2015].
    step1: |-
      至此，我们考察了动物能动性的辩护者如何打防守战，即通过批评动物怀疑论论证的不同部分。而在打进攻战时，动物能动性的辩护者通常诉诸我们谈论和思考动物的通行方式；如前所述，这些方式为把能动性归于动物提供了初看之下良好的根据。此外，有人指出，通常用来排除动物的那些加高了的能动性条件，会 **对人类行动** 产生反直觉的后果。毕竟，我们人类的许多意向行动（如习惯性行动）似乎并不涉及高阶思想或先前的慎思（这一关键洞见促使 Hyman 2015 区分“行动”（acting）的不同含义）[^hyman-2015]。
    step2: |-
      至此，我们考察了动物能动性的辩护者如何打防守战，即通过批评动物怀疑论论证的不同部分。而在打进攻战时，动物能动性的辩护者通常诉诸我们谈论和思考动物的通行方式；如前所述，这些方式为把能动性归于动物提供了初看之下良好的根据。此外，有人指出，通常用来排除动物的那些加高了的能动性条件，会 **对人类行动** 产生反直觉的后果。毕竟，我们人类的许多意向行动（如习惯性行动）似乎并不涉及高阶思想或先前的慎思（这一关键洞见促使 Hyman 2015 区分“行动”（acting）的不同含义）[^hyman-2015]。
