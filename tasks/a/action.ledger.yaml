      Finally, it has been suggested that the process view can better accommodate the type of direct guidance that Frankfurt identified as essential to intentional action (see above, section 2.4). It seems attractive to explain the nature of this direct guidance in terms of how substances in general cause changes by engaging in certain processes (Hornsby 2012)[^hornsby-2012], or in terms of the different ways in which an agent can manifest her agency in a process (slower, faster, more or less skillfully) (Charles 2018)[^charles-2018]. And, as Steward (2012) suggests, this might give a substantial role to the agent in the explanation of action. By contrast, since events have settled natures and spatial-temporal properties, it seems that the agent can at best interact with them in the indirect way in which she interacts with other objects, such as a car.
    step1: |-
      最后，有人提出，过程观能更好地容纳法兰克福所指认为意向行动之本质的那类直接引导（见上文第 2.4 节）。以下两种说明似乎都颇具吸引力：一是以一般实体如何通过参与某些过程而引起变化，来说明这种直接引导的本性（Hornsby 2012）[^hornsby-2012]；二是以行动者在过程中展现其能动性的不同方式（更慢、更快、更熟练或不那么熟练）来说明（Charles 2018）[^charles-2018]。而且，正如斯图尔德（2012）所提示的，这可能让行动者在行动解释中扮演实质角色。相比之下，既然事件具有已确定的本性与空间—时间属性，行动者似乎充其量只能以她与其他对象（例如一辆汽车）互动的那种间接方式与事件互动。
