      What are actions? The traditional answer is: they are *events* of a certain sort (e.g. events with a distinctive causal history). That, at any rate, is the letter of the views found in Anscombe (1957)[^anscombe-1957], Davidson (1963; 1967a; 1967b; 1985)[^davidson-1963][^davidson-1967a][^davidson-1967b][^davidson-1985], and much subsequent literature. However, some scholars have recently argued that Anscombe’s position is better captured by the claim that actions are *processes*, and that there are philosophical advantages to this view. Yet, others take actions to be something else altogether. This section explains what this dispute is about, and explores some of its implications for other ontological debates such as the individuation of action. It then considers further important questions about the metaphysics of action, such as whether there must be basic actions, and whether *Action* constitutes a unified category.
    step1: |-
      行动是什么？传统的回答是：行动是某种 **事件**（例如具有独特因果历史的事件）。无论如何，这正是安斯康姆（1957）[^anscombe-1957]、戴维森（1963；1967a；1967b；1985）[^davidson-1963][^davidson-1967a][^davidson-1967b][^davidson-1985] 以及此后大量文献中诸观点的字面意思。然而，一些学者近来论证，安斯康姆的立场更适合用“行动是 **过程**”这一主张来把握，且这一观点具有哲学上的优势。不过，另一些人则认为行动完全是别的东西。本节说明这场争论究竟争的是什么，并探讨它对行动个体化等其他本体论争论的一些意涵。随后，本节还考察行动形而上学中另外一些重要问题，例如是否必定存在基本行动，以及 **行动** 是否构成一个统一的范畴。
