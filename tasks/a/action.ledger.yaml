      Davidson’s work focuses mostly on “punctual actions”, actions that take place very quickly, and that have already occurred. A typical example of an action for Davidson will be described by a sentence like “*α* flicked the switch” (see Davidson 1971)[^davidson-1971]. Flicking a switch happens almost instantaneously; moreover, when I describe my action as “flicked the switch”, the sentence picks up a completed event in which the action is already done. And flicking a switch, buttering toast, etc. are actions typically performed from beginning to end without interruption. In sum, Davidson’s typical examples of actions are short-lived, continuous, and completed actions. Davidson’s conception of an intention follows a similar pattern, focusing on intentions that are executed in actions that follow the aforementioned pattern. At first, Davidson takes intentions in (short-lived) action to be primary, and later (Davidson 1970b)[^davidson-1970b] expands the model to prospective intention (intentions for a future action), but still focusing mostly on intentions for a simply executed action that happens to lie in the future. However our actions often extend through long stretches of time, and seem to rely on future-directed intentions that govern very complex plans and activities. Moreover, we only seem to have a completed action when we are no longer engaged in the relevant activity (when it is true that I’ve crossed the street I am no longer engaged in the activities that constitute or are means to having crossed the street); agency arguably manifests itself only in action in progress (I am engaged in these activities while *I am crossing the street*). By keeping our focus on completed action, we risk losing sight of another seemingly essential feature of human action: that it extends through time under the guidance of the agent. Of course, this kind of initial focus on nearly momentary, completed actions does not necessarily mean that the theory cannot accommodate extended action that requires complex planning or action in progress (or any form of agency that necessarily stretches through time). But a number of philosophers have tried to either expand, modify, or reject Davidson’s theory to account for extended agency or action in progress, or to argue that a proper theory of action should focus on the nature and structure of action in progress (Thompson 2008; Ford 2018)[^ford-2018][^thompson-2008]. This section will focus on extended agency of the former kind, and the relevance of action in progress will be discussed in section 4.
    step1: |-
      戴维森的工作大多聚焦于“时点行动”，即发生得极快、并且已经发生的行动。对戴维森而言，行动的典型例子可由“*α* 扳动了开关”这样的句子来描述（见 Davidson 1971）[^davidson-1971]。扳动开关几乎瞬间发生；而且，当我把我的行动描述为“扳动了开关”时，这个句子捕捉的是一个已完成的事件，其中行动已经做完。而扳动开关、给吐司抹黄油等等，通常都是从头到尾不中断地完成的行动。总之，戴维森笔下典型的行动都短暂、连续、已经完成。戴维森对意图的构想遵循类似模式：聚焦的是在上述模式行动中得到执行的意图。起初，戴维森认为（短暂）行动中的意图是首要的；后来（Davidson 1970b）[^davidson-1970b] 把模型扩展到面向未来的意图（prospective intention，为未来行动而有的意图），但仍主要聚焦于针对恰好落在未来、被简单执行的行动所抱的意图。然而，我们的行动常常延展于很长的时间跨度，并且似乎依赖于面向未来的意图，这类意图支配着极为复杂的计划与活动。此外，我们似乎只有在不再从事相关活动时才拥有一个已完成的行动（当“我已穿过街道”为真时，我已不再从事那些构成穿过街道、或作为其手段的活动）；能动性可以说只表现于进行中的行动（在 **我正在穿过街道** 之时，我正从事这些活动）。若始终只看已完成的行动，我们就有看不到人类行动另一本质特征的风险：它受行动者引导，延展于时间之中。当然，起初只关注近乎瞬间、已经完成的行动，并不必然意味着该理论无法容纳需要复杂计划的延展行动或进行中的行动（乃至任何跨越时间的能动性形式）。但不少哲学家已尝试扩展、修正或拒斥戴维森的理论，以说明延展能动性或进行中的行动，或论证一种恰当的行动理论应聚焦于进行中行动的本性与结构（Thompson 2008; Ford 2018）[^ford-2018][^thompson-2008]。本节将聚焦于前一类延展能动性，进行中行动的相关性将在第 4 节讨论。
