      There are two more influential arguments inspired by Anscombe that have been used to defend the connection with knowledge. The first begins with the observation that a process in progress bears a non-accidental connection to its completion (Thompson 2011; Small 2012; Wolfson 2012; Valaris 2021)[^small-2012][^thompson-2011][^valaris-2021][^wolfson-2012]. If a house is burning, it would not be an accident if it is burnt later; and if you are writing a letter, it won’t be an accident if it is written later. What distinguishes intentional action is that the non-accidental connection obtains in virtue of the agent’s representation—her intention—to act in some way. That the agent is writing a letter—even while she takes a break, cooks a snack, and goes to the bathroom—is true precisely because she represents herself as writing a letter, and this representation guides her proceedings. Intentions, in other words ground what Falvey (2000)[^falvey-2000] calls the “openness of the progressive”: the fact that “a person may be doing something, in a suitably broad sense, when at the moment she is not doing anything, in a more narrow sense, that is for the sake of what she is doing in the broad sense” (p.22). Suppose, then, that an agent is intentionally φ-ing. Then it is true that she represents herself as doing so, the representation is true, and non-accidentally so. It is a short step to the conclusion that she knows that she is φ-ing.
    step1: |-
      还有两个受安斯康姆启发、被用来捍卫知识与行动之联系的更有影响力的论证。第一个从这一观察开始：进行中的过程与其完成之间具有非偶然的联系（Thompson 2011; Small 2012; Wolfson 2012; Valaris 2021）[^small-2012][^thompson-2011][^valaris-2021][^wolfson-2012]。如果一座房子正在燃烧，那么它稍后被烧毁就不会是偶然的；如果你正在写一封信，那么它稍后被写成也不会是偶然的。意向行动的特征在于，这种非偶然联系凭借行动者的表征——即她以某种方式行动的意图——而成立。行动者正在写一封信——即使在她休息、做点心、如厕的时候——之所以为真，恰恰是因为她把自己表征为在写一封信，而且这一表征引导着她的进程。换言之，意图为法尔维（2000）[^falvey-2000] 所谓的“进行体的开放性”奠定了基础：这一事实是，“一个人可以在一种适当宽泛的意义上正在做某事，而此刻她在一种较狭窄的意义上并没有做任何事，那些事是为了她在这种宽泛意义上正在做的某事”（第 22 页）。那么，假设行动者正在有意向地 φ。于是，她把自己表征为这样做，这一表征为真，而且并非偶然为真。距“她知道自己正在 φ”这一结论只有一步之遥。
