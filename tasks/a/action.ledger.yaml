      Although the distinction is barely mentioned in analytical philosophy, it has influenced other traditions, such as the Marxist one. From his earliest writings, Marx accepts an Aristotelian threefold analysis of labour in terms of the labourer, the process of labouring, and its product. Marx implicitly rejects the distinction between action proper and production, in favour of a dichotomy of his own between different forms of productions. This is because for Marx the characteristic activity of the human species is conscious free labouring: an activity that has no end beyond itself (it does not seek anything beyond the living activity that such labouring consists in) (Marx 1844a; 1844b; 1867)[^marx-1844a]. This is what Aristotle took as the distinguishing feature of proper actions, done for their own sake. One of Marx’s central criticisms of capitalist societies is that it prevents humans from engaging in such an activity. In capitalist societies, the labourer, the labour process, and the product all become commodities that serve as mere means for the enjoyment of the owner of labour and product (“the capitalist”). Members of capitalist societies are, in this sense, alienated (Marx 1844b; 1867)[^marx-1844b]. As such, capitalist societies make it impossible for humans to engage in their most fundamental life activity of free production, an activity that the Marxist tradition came to designate as “praxis” (Petrovic 1983)[^petrovic-1983], reappropriating the quite different Aristotelian notion.
    step1: |-
      尽管这一区分在分析哲学中很少被提及，它却影响了其他传统，例如马克思主义传统。从最早的著作起，马克思就接受亚里士多德式的劳动三重分析：劳动者、劳动过程及其产品。马克思暗中拒斥本义行动与生产之分，转而提出自己的二分法，区分不同形式的生产。这是因为，对马克思而言，人类这一物种的特征活动是有意识的自由劳动：一种在自身之外没有目的的活动（它不寻求超出这种劳动所构成的生命活动之外的任何东西）（Marx 1844a; 1844b; 1867）[^marx-1844a]。而这正是亚里士多德视为本义行动之标志——为其自身之故而做——的东西。马克思对资本主义社会的核心批评之一，就是它阻止人类从事这样的活动。在资本主义社会中，劳动者、劳动过程与产品全都成为商品，仅作为供劳动与产品的所有者（“资本家”）享用的手段。在这个意义上，资本主义社会的成员被异化了（Marx 1844b; 1867）[^marx-1844b]。因此，资本主义社会使人类不可能从事其最根本的生命活动——自由生产，而马克思主义传统后来把这一活动称为“praxis”（实践）（Petrovic 1983）[^petrovic-1983]，重新挪用了那个颇为不同的亚里士多德概念。
