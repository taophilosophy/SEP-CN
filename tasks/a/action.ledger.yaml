      Moreover, several authors grant that full-fledged intentional human action is special, but argue that we must recognize a more basic form of agency for animals. (This appears to be the view favoured by Anscombe (1957)[^anscombe-1957], who held that animals could act intentionally, although not in the language-dependent way that humans could, where we can draw a significant distinction between the action itself and an expression of intention. See Gustafsson 2016; Marcus 2021). The need to recognize a more basic form of agency can be motivated by noting that otherwise the development of full-fledged human agency becomes developmentally mysterious, both at the inter- and intra-species level. Thus, unless we can ascribe agency to non-rational animals, it will be hard to explain how rational capacities might emerge in humans at the evolutionary level; and unless we ascribe agency to human infants, it will be hard to explain how conceptual capacities emerge (Cussins 1992; MacIntyre 1999; Lovibond 2006; Steward 2009; Fridland 2013)[^cussins-1992][^fridland-2013][^lovibond-2006][^macintyre-1999][^steward-2009].
    step1: |-
      此外，有几位作者承认充分发展的人类意向行动是特殊的，但论证我们必须承认动物具有一种更基本的能动性形式。（这似乎是安斯康姆（1957）[^anscombe-1957] 所倾向的观点。她认为动物能够有意向地行动，尽管不是以人类那种依赖语言的方式——在人类那里，我们可以重要地区分行动本身与意图的表达。参看 Gustafsson 2016; Marcus 2021。）主张必须承认一种更基本的能动性形式，理由在于：否则，充分发展的人类能动性如何发展，就在发生上变得神秘，无论在种间层面还是种内层面都是如此。因此，除非我们能把能动性归于非理性动物，就很难解释理性能力如何在进化层面于人类身上出现；而除非我们把能动性归于人类婴儿，就很难解释概念能力如何出现（Cussins 1992; MacIntyre 1999; Lovibond 2006; Steward 2009; Fridland 2013）[^cussins-1992][^fridland-2013][^lovibond-2006][^macintyre-1999][^steward-2009]。
    step2: |-
      此外，有几位作者承认充分发展的人类意向行动是特殊的，但论证我们必须承认动物具有一种更基本的能动性形式。（这似乎是安斯康姆（1957）[^anscombe-1957] 所倾向的观点。她认为动物能够有意向地行动，尽管不是以人类那种依赖语言的方式——在人类那里，我们可以重要地区分行动本身与意图的表达。参看 Gustafsson 2016; Marcus 2021。）主张必须承认一种更基本的能动性形式，理由在于：否则，充分发展的人类能动性如何发展，就在发生上变得神秘，无论在种间层面还是种内层面都是如此。因此，除非我们能把能动性归于非理性动物，就很难解释理性能力如何在进化层面于人类身上出现；而除非我们把能动性归于人类婴儿，就很难解释概念能力如何出现（Cussins 1992; MacIntyre 1999; Lovibond 2006; Steward 2009; Fridland 2013）[^cussins-1992][^fridland-2013][^lovibond-2006][^macintyre-1999][^steward-2009]。
