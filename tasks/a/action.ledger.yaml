      For example, if to do *A* one must do *B*, and to do *B* one must do *C*, and so on *ad infinitum,* doing anything would seem to require doing an infinite number of things. More worrying, the beginning of action seems to be “logically out of reach” for the agent, since there is always something else that she would have to do before she begins to do anything (Danto 1979, 471)[^danto-1979]. Again, it seems that for an agent to know what she is currently doing, she needs to know how to do the things by which she does it; but unless there is something that she can know how to do just by doing it, it will be impossible for her to know what she is doing at all (Hornsby 2013)[^hornsby-2013].
