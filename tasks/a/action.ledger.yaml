      Regardless of how these questions are answered, a remaining challenge is to explain the *unity* between processes and events, the fact that there is a non-accidental connection between the process of buttering, and the event of one’s having buttered the toast that results if the action is successful (Haase 2022)[^haase-2022]. Moreover, it is worth noting that although the process-view is the most important alternative available to the events-view, other proposals have been advanced recently, including the view that actions are thoughts (Rödl 2007; 2011; Marcus 2012; Valaris 2020)[^marcus-2012][^rödl-2007][^valaris-2020]. For example, Marcus holds that to act intentionally just is to judge that the action is to be done.
