      These sentences seem to attribute to animals the capacity to take means for remote ends, the capacity to desire objects and act in pursuit of these desires, and the capacity to employ their thoughts about their surroundings in the service of such pursuits. Unless we are skeptics about the folk-psychological concepts involved in these ascriptions, then, we should hold that animals are agents (but see Godfrey-Smith 2003, who holds that these folk concepts may be particularly problematic when applied to animals)[^godfrey-smith-2003]. It is not surprising, then, that Aristotle defined animal life in terms of the capacity for a type of action, movement in place (*DA* 432a), or that Kant attributes a faculty of desire to all animals, through which they actualize their representations (KpV9).
    step1: |-
      这些句子似乎把下列能力归于动物：为遥远目的采取手段，欲求对象并追求这些欲望而行动，以及把关于周遭环境的想法用于此类追求。那么，除非我们对这些归属所涉的民间心理学概念持怀疑态度，我们就应当认为动物是行动者（但可参看 Godfrey-Smith 2003，他认为这些民间概念应用于动物时可能尤其成问题）[^godfrey-smith-2003]。因此，亚里士多德以某种行动即位移的能力来界定动物生命（*DA* 432a），或康德把欲求能力归于一切动物、动物借此实现其表象（KpV9），也就不足为奇了。
