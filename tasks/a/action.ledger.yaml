      A number of challenges have been raised in the literature to the claim that there must be a constitutive aim of action. First, suppose we accept the causal theory of action: an intentional action just is the effect of a “primary reason”. On such a view, it seems that an intentional action is constituted by its causal antecedents, rather than by a necessary aim that one has in acting. However, causal theories are not incompatible with constitutivism. Since on these views, some of the causal antecedents of the action will be conative states (like an intention), the question of whether intentional action has a constitutive aim will depend on whether the conative state has a constitutive aim or whether a specific conative state must always figure on the genesis of intentional action. For instance, in Velleman’s early work (for instance, Velleman 1989)[^velleman-1989], intentional action was an action that was caused by a desire for self-knowledge, and the content of such a desire was thus the constitutive aim of agency. Smith (2013; 2015; 2019)[^smith-2013][^smith-2015][^smith-2019] also develops a form of constitutivism that endorses the standard story of action.
    step1: |-
      文献中对“必定存在行动的构成性目的”这一主张提出了若干挑战。其一，针对因果论：假定我们接受行动因果论：意向行动就是“首要理由”的结果。按这种观点，意向行动似乎由其因果先行项构成，而不是由行动中必然具有的某个目的构成。然而，因果论与构成主义并非不相容。既然按这些观点，行动的某些因果先行项将是意动状态（如意图）。那么，意向行动是否具有构成性目的，就取决于该意动状态是否具有构成性目的，或者是否总有某种特定的意动状态必须出现在意向行动的生成过程中。例如，在维勒曼的早期作品（如维勒曼 1989）[^velleman-1989] 中，意向行动由自我知识欲望引起，而这种欲望的内容因此就是能动性的构成性目的。Smith（2013; 2015; 2019）[^smith-2013][^smith-2015][^smith-2019] 也发展出一种构成主义，它认可行动的标准故事。
