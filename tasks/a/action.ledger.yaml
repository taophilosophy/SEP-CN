      Here is a simple answer: A person can know that *p* (e.g. that she (herself) is walking), on the basis of exercising her will, because when she does so successfully *p* is true. Two related problems immediately arise for this simple account. First, truth is insufficient for knowledge. Minimally, epistemic warrant is also needed, but the simple account does not give even a hint as to how such warrant could be acquired through agency (Newstead 2006)[^newstead-2006]. Second, there are notorious cases that seem to meet the conditions provided by the simple answer, but where there isn’t knowledge. One case is lucky wishful thinking (Langton 2004)[^langton-2004], e.g., if partly on the basis of optimistic thinking I luckily pull off a jump I would not normally make. Another is pessimistic thinking (Harman 1986; 1997)[^harman-1986], e.g., if I trip partly on the basis of thinking that I will trip. In neither case do I possess knowledge on the basis of my thoughts, despite the thoughts bringing about the truth of their contents. At best, therefore, the simple answer is incomplete, and must be supplemented with a story that explains how it is that the characteristic thoughts of the agent differ from wishful and pessimistic thoughts, such as to provide epistemic warrant.
    step1: |-
      这里有一个简单的回答：一个人可以基于运用自己的意志而知道 *p*（例如知道自己［本人］正在走路），因为当她做到这一点时，*p* 为真。对这个简单说明，立刻会出现两个相关的问题。第一，真对于知识并不充分。最低限度还需要认知担保，而这个简单说明甚至没有暗示这种担保如何能通过能动性获得（Newstead 2006）[^newstead-2006]。第二，有一些著名的例子似乎满足简单回答所提供的条件，却没有知识。一个例子是幸运的一厢情愿（Langton 2004）[^langton-2004]，例如，我部分基于乐观的想法，侥幸完成了一次平时做不到的跳跃。另一个例子是悲观思维（Harman 1986; 1997）[^harman-1986]，例如，我部分基于“我会绊倒”的想法而绊倒。在这两种情形中，尽管这些想法使其内容成真，我都没有基于这些想法而拥有知识。因此，这个简单回答充其量是不完整的，必须补充一个说明，解释行动者那些特征性想法何以不同于一厢情愿与悲观的想法，从而提供认知担保。
