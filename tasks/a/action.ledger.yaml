      Perhaps the most influential modern version of a distinction among types of practical activity is drawn by Arendt (1998)[^arendt-1998]. Arendt distinguishes between three kinds of practical activities: labour, work, and action. The most basic of these is *labour*, which Arendt conceives as simply an extension of our animal lives: a “metabolism” (Marx’s phrase) between the human animal and the world, characterized by a cycle of consumption and the production of goods to be consumed, and aiming at meeting our basic biological needs (p.69). Since this is a cycle, Arendt suggests that there is no sense of speaking here of means and ends: there is no fact of the matter as to whether the production of goods is for the sake of consumption, or the consumption for the sake of production (p.145; 155). Means and ends enter at the next level of practical activity, *work* (the Aristotelian *poíêsis*). Like Aristotle, Arendt takes the aim of working to be the finished work, the product, whether it be a work of art, like a painting, a tool, like a knife, or a way to safeguard living, like a house. The central importance of work lies in its ability to produce lasting products that lie beyond the activity of the producer (p.136; 144). Arendt contends that these products can begin to shape an objective *world* of objects that stands against the humans who produce them. However, the world does not emerge in its fullness except by way of the third level of practical activity, *action* (the Aristotelian *praxis*). Action is the means by which humans reveal themselves in the public sphere, a revelation needed to give reality to a personality that otherwise remains entirely unactualized in subjectivity. It is thus essentially communicative, and depends on other humans to whom one might make herself known (pp.38–49; 95; 202–7); and it depends, given its essential ephemeral nature, for its permanence in the continued existence of a polity that may preserve words and deeds in more enduring forms, like sculptures and tales. Ungoverned by either the natural laws of labor, or by the norms arising from a particular aim, action is for Arendt unproductive, free, and unpredictable. It is the distinguishing activity of human beings as such (p.177; 204–6).
    step1: |-
      也许，区分各类实践活动的最有影响的现代版本出自阿伦特（1998）[^arendt-1998]。阿伦特区分三种实践活动：劳动、工作与行动。其中最基本的是 **劳动**，阿伦特把它理解为动物生命的单纯延伸。人类动物与世界之间的“新陈代谢”（马克思的说法），其特征是消费与生产供消费之物的循环，旨在满足我们的基本生物需要（p.69）。由于这是一个循环，阿伦特认为在此谈论手段与目的没有意义：究竟是物品的生产为了消费，还是消费为了生产，并无事实可言（p.145; 155）。手段与目的出现在实践活动的下一层次，即 **工作**（亚里士多德式的 *poíêsis*）。与亚里士多德一样，阿伦特认为工作的目的是完成的作品、产品，无论是一件艺术品（如一幅画）、一件工具（如一把刀），还是一种保障生活的方式（如一座房屋）。工作的核心重要性在于，它能生产出超出生产者活动之外的持久产品（p.136; 144）。阿伦特主张，这些产品可以开始塑造一个客观的 **世界**，由诸多对象构成，与生产它们的人相对而立。然而，世界只有经由实践活动的第三个层次——**行动**（亚里士多德式的 *praxis*）——才以其充实形态出现。行动是人类在公共领域中显示自身的手段；这一显示之所以必要，是为了赋予一种否则完全停留于主体性中而未被实现的人格以实在性。因此，行动本质上是交往性的，依赖于可以向其显示自身的他人（pp.38–49; 95; 202–7）；而且，鉴于其本质上的短暂性，行动要获得持存，还依赖于一个政治共同体的持续存在，该共同体可以以更持久的形式——如雕塑与传说——保存言与行。行动既不受劳动的自然规律支配，也不受由特定目的产生的规范支配；对阿伦特而言，它无产品、自由、不可预测。它是人之所以为人的标志性活动（p.177; 204–6）。
