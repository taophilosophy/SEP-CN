      It has also been contended that philosophers who offer the standard answers make important methodological assumptions. These philosophers approach questions about agency as though they were on par with scientific questions to this extent: they seek mechanistic, or causal explanations of agency, explanations that can be grasped from an objective perspective. However, drawing inspiration from Kant, some philosophers contend that philosophy of action should be done from the agential perspective (Nagel 1989; Korsgaard 2009; Bilgrami 2012; Schapiro 2021)[^bilgrami-2012][^korsgaard-2009][^nagel-1989][^schapiro-2021]; and other philosophers drawing from Aristotle and Frege have argued for similar views (Thompson 2008; Lavin 2013; Ford 2017)[^ford-2017][^thompson-2008]. From a different standpoint, the standard methodology has been criticized as not being scientific enough. It has been argued that certain empirical results disprove some of the basic assumptions behind these answers. For example, Libet’s experiments have been taken to suggest that intentions are causally ineffective, and that to understand the true causes of action we would have to focus on neural processes (‘action potentials’) about which we could only learn through standard scientific methods (Libet 1985; Libet et al. 1993)[^libet-1985][^libet-1993]. Although these radical views are now widely held to be based on faulty conceptual and empirical grounds (e.g. Mele. 2010; Levy 2005; Brass, Furstenberg, and Mele 2019)[^brass-2019][^levy-2005][^mele-2010], surprising scientific results continue to challenge commonly held views in philosophy of action (see e.g. Wegner 2002 and Nahmias 2014 for critical discussion of recent findings)[^nahmias-2014][^wegner-2002].
    step1: |-
      也有人主张，给出标准回答的哲学家作出了重要的方法论假定。这些哲学家处理能动性问题的方式，在如下意义上与科学问题同等看待：他们寻求对能动性的机械论说明或因果说明，即可以从客观视角把握的说明。然而，一些哲学家受康德启发，主张行动哲学应当从能动者视角来做（Nagel 1989; Korsgaard 2009; Bilgrami 2012; Schapiro 2021）[^bilgrami-2012][^korsgaard-2009][^nagel-1989][^schapiro-2021]；另一些哲学家则从亚里士多德与弗雷格出发，主张类似观点（Thompson 2008; Lavin 2013; Ford 2017）[^ford-2017][^thompson-2008]。从另一立场看，标准方法论又被批评为不够科学。有人论证，某些经验结果否证了这些回答背后的部分基本假定。例如，利贝特实验曾被用来暗示意图在因果上无效，要理解行动的真正原因，我们必须关注神经过程（“动作电位”），而我们只能通过标准科学方法了解这些过程（Libet 1985; Libet et al. 1993）[^libet-1985][^libet-1993]。尽管这些激进观点如今被广泛认为基于错误的概念与经验根据（例如 Mele. 2010; Levy 2005; Brass, Furstenberg, and Mele 2019）[^brass-2019][^levy-2005][^mele-2010]，令人惊讶的科学结果仍在继续挑战行动哲学中的常见观点（关于近期发现的批判性讨论，参见例如 Wegner 2002 与 Nahmias 2014）[^nahmias-2014][^wegner-2002]。
