      It is contentious whether the foregoing response works (see Kirley forthcoming, for criticism), but it shows that Davidson’s example is far from decisive. However, other examples appear to be immune from this type of response. For instance, Schwenkler (2019)[^schwenkler-2019] presents a case of an agent who is trying to fill a cistern in the kind of environment where doubts that he is doing so are appropriate (e.g. where he is filling up one of many cisterns, but he knows several of them are broken, but not which). Suppose, however, that he is in fact filling up the cistern (it is not broken). If he does so to poison the inhabitants of the house, Anscombe’s question “Why?” appears to have application, which means that he is filling up the cistern intentionally, even though the best he could say is that “he thinks” he is doing so (Schwenkler 2019, 188–9; cf. Vekony, Mele, and Rose 2021; Shepherd & Carter forthcoming)[^schwenkler-2019][^vekony-2021].
    step1: |-
      上述回应是否奏效尚有争议（批评见 Kirley forthcoming），但它表明戴维森的例子远非决定性的。然而，其他例子似乎不受这类回应的触及。例如，施文克勒（2019）[^schwenkler-2019] 提出一个例子。行动者试图给一个蓄水池注水，而所处环境使人有理由怀疑他正在这样做（例如，他正在给众多蓄水池之一注水，他知道其中几个是坏的，但不知道是哪几个）。不过，假设他事实上正在给那个蓄水池注水（它没有坏）。如果他这样做是为了毒害屋里的人，安斯康姆的“为什么？”问题似乎就有适用之处，这意味着他是在有意向地给蓄水池注水，尽管他最多只能说“他认为”自己在这样做（Schwenkler 2019, 188–9; 参看 Vekony, Mele, and Rose 2021; Shepherd & Carter forthcoming）[^schwenkler-2019][^vekony-2021]。
