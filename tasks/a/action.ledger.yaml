      Together, these arguments force defenders of the knowledge condition into an uncomfortable position: if they wish to uphold the knowledge condition, they must reject safety for practical knowledge. However, this threatens to undermine the point of counting this as knowledge, given how epistemically frail it can be. On the other hand, it has been argued that a suitable understanding of the knowledge condition may evade these worries (Beddor and Pavese 2021; Valaris 2021)[^beddor-2021][^valaris-2021].
    step1: |-
      这些论证合在一起，把知识条件的捍卫者逼入一个尴尬境地：若要维护知识条件，他们就必须为实践知识拒绝安全性。然而，鉴于实践知识在认知上可能如此脆弱，这又有损于把它算作知识的要旨。另一方面，也有人论证，对知识条件作恰当理解，或许可以避开这些忧虑（Beddor and Pavese 2021; Valaris 2021）[^beddor-2021][^valaris-2021]。
