      Setiya raises a couple of important challenges to the idea that action has a constitutive aim. According to Setiya (2007)[^setiya-2007], any theory of action needs to account for the fact that practical knowledge (or a belief condition in his version; see section 4 of this entry) is essential to intentional action. However, the belief condition seems to be conceptually independent of any constitutive aim of action, and thus accepting that both are constitutive of intentional action amounts to postulating an unexplained necessary connection.
    step1: |-
      塞蒂亚对“行动具有构成性目的”这一观念提出了若干重要挑战。按塞蒂亚（2007）[^setiya-2007] 的看法，任何行动理论都必须说明这样一个事实：实践知识（在他的版本中则是信念条件；参看本词条第 4 节）对意向行动至关重要。然而，信念条件似乎在概念上独立于任何行动的构成性目的，因此，承认二者都是意向行动的构成要素，就等于设定了一种未加说明的必然联系。
