      There are at least two ways in which causal theorists try to answer these charges. One possibility is to argue that even though intentional omissions are absences, what makes them intentional is that facts about their causal history are analogous to the facts about causal history that make “positive actions” instances of agency (Clarke 2010; 2014)[^clarke-2010]. On this view, just as positive actions are caused by an intention, intentional omissions are cases in which the non-obtaining of a certain event is similarly explained by an intention. However, Sartorio (2009)[^sartorio-2009] argues that intentional omissions pose a serious challenge even to this broader understanding of the standard causal theory of action. Sartorio argues that intentional omissions are often not best explained by other events (such as the formation of an intention), but by the *non-occurrence* of certain events (the best explanation of why I omitted to help my friend move might be that I *omitted* to form the intention to help them, rather than that I did form the intention not to help them). Another strategy to make omissions compatible with the standard causal theory is to try to show that omissions are events, while avoiding the questionable view that the omission must be identified with what the agent intentionally did at the time of the omission (Payton 2021)[^payton-2021].
    step1: |-
      因果论者至少有两种方式试图回应这些指责。一种可能是论证：尽管意向性遗漏是缺失，使它们成为意向性的，是其因果历史方面的事实与使“积极行动”成为能动性实例的因果历史事实彼此类似（Clarke 2010; 2014）[^clarke-2010]。按这种观点，正如积极行动由意图引起，意向性遗漏则是这样的情形：某个事件不发生，同样可由意图来解释。然而，Sartorio（2009）[^sartorio-2009] 论证，意向性遗漏甚至对标准因果论这一更宽泛的理解也构成严峻挑战。Sartorio 论证，意向性遗漏往往并非最好由其他事件（如意图的形成）来解释，而是由某些事件的 **不发生** 来解释。以帮朋友搬家为例，最好的解释也许是：我 **遗漏了** 形成帮他们的意图，而不是我确实形成了不帮他们的意图。使遗漏与标准因果论相容的另一种策略，是试图表明遗漏是事件，同时避开那种可疑观点：遗漏必须与行动者在遗漏发生时所意向性地做的事情相等同（Payton 2021）[^payton-2021]。
