      Inferentialist accounts give up on a feature that was central to Anscombe’s understanding of practical knowledge, its immediate character (see e.g. O’Brien 2007)[^o’brien-2007]. However, Paul (2009a)[^paul-2009a] argues that the appearance of immediacy can be explained by the fact that inferences “can take place rapidly and automatically at a non-conscious level, without the mindful entertaining of premises or feeling of drawing a conclusion” (p.10). Yet, several challenges have been raised against inferentialist accounts, including: (i) that they can’t explain the tight nexus between intentional action and practical knowledge (Setiya 2007, 2008, 2009)[^setiya-2007][^setiya-2008][^setiya-2009]; (ii) that they can’t explain the first-personal character of practical knowledge (Wilson 2000; Schwenkler 2012)[^schwenkler-2012][^wilson-2000]; and (iii) that they at best give us alienated, observational knowledge (Piñeros Glasscock 2021)[^piñeros-2021].
    step1: |-
      推论主义说明放弃了安斯康姆实践知识理解中的一个核心特征：其直接性（见例如 O’Brien 2007）[^o’brien-2007]。然而，保罗（2009a）[^paul-2009a] 论证，直接性的外观可以由这一事实来解释：推论“可以在非意识层面迅速而自动地进行，无需用心地考虑前提，也无需有得出结论之感”（第 10 页）。不过，针对推论主义说明也提出了若干挑战，包括：（i）它们无法解释意向行动与实践知识之间的紧密关联（Setiya 2007, 2008, 2009）[^setiya-2007][^setiya-2008][^setiya-2009]；（ii）它们无法解释实践知识的第一人称特征（Wilson 2000; Schwenkler 2012）[^schwenkler-2012][^wilson-2000]；（iii）它们至多给予我们异化的、观察性的知识（Piñeros Glasscock 2021）[^piñeros-2021]。
