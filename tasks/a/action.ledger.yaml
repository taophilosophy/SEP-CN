      The idea that an action is rationalized by its mental states is still very popular; much less so is the view that the only relevant states are beliefs and desires (though see Sinhababu 2017 for a modern defense of this simple “Humean” account)[^sinhababu-2017]. As Bratman (1987)[^bratman-1987] argues, desires do not have the conduct-controlling and settling functions characteristic of intentions, and thus intentions seem to be better placed to be at the center of an account in which intentional actions are constituted by their causal genesis. My desire to have my teeth cleaned, when conjoined with my belief that in order to get my teeth cleaned I need to go to a dentist, will not result in my moving towards the dentist until I actually *intend* to go to the dentist. In fact, when Velleman comes to dub this kind of causal theory of action “the standard story of action”, he explicitly describes the view as one in which intention plays a central role between the “primary reason” and the action. In the standard story, the agent’s “desire for the end, and his belief in the action as a means … *jointly cause an intention to take it*, which in turn causes the corresponding movements of the agent’s body.” (Velleman 1992, 461). Davidson (1970b)[^davidson-1970b] himself came to accept that intentions play an important role in the causation and constitution of action and that intentions could not be reduced to beliefs or desires. But common to all these views is the idea that human actions are events that bear the right kind of causal relation to certain mental states or events of the agent that also explain the action.
    step1: |-
      行动由其心理状态合理化，这一观念仍然十分流行；不那么流行的是如下观点：唯一相关的状态是信念与欲望（不过可参看 Sinhababu 2017 对这一简单“休谟式”说明的现代辩护）[^sinhababu-2017]。正如布拉特曼（1987）[^bratman-1987] 所论证，欲望不具有意图特有的控制行为与定夺功能，因此意图似乎更适合居于这样一种说明的中心：意向行动由其因果发生过程构成。我想清洁牙齿的欲望，连同“要清洁牙齿就得去看牙医”这一信念，并不会使我走向牙医，除非我实际 **意图** 去看牙医。事实上，当维勒曼把这种行动因果论称为“行动的标准故事”时，他明确把该观点描述为：意图在“首要理由”与行动之间起核心作用。在标准故事中，行动者“对目的的欲望，以及他把行动视为手段的信念…… **共同导致采取该行动的意图**，后者又导致行动者身体的相应运动。”（维勒曼 1992, 461）。戴维森（1970b）[^davidson-1970b] 本人后来也接受，意图在行动的因果作用与构成中起重要作用，且意图不能还原为信念或欲望。但所有这些观点的共同之处在于：人类行动是与行动者的某些心理状态或事件具有恰当因果联系的事件，而这些心理状态或事件同时也解释该行动。
