      Although initially presented as an account of the nature of action explanation, Davidson’s account also contains the basic structure of an understanding of human action: according to Davidson, a true action statement (of the form “x φ-ed”) denotes an event, and more specifically, a bodily movement. A bodily movement is an action if, and only if, the event is an intentional action (Davidson 1971)[^davidson-1971]. Davidson does not say this explicitly,[^note-2] but clearly on his view, an event is an intentional action under a certain description, if and only if, there is a true rationalizing explanation of the event under this description. Davidson (1971)[^davidson-1971] (following Anscombe) points out that “x φ-ed intentionally” creates an intensional context; that is whether an action is intentional depends on how the action is described. To use Davidson’s example, if I flip a switch, I also turn on the light, and alert the burglar. On Davidson’s view “flipping the switch”, “turning on the light”, and “alerting the burglar” are all descriptions of the same action. The “accordion effect” (so dubbed by Feinberg 1965), characteristic of human action, makes it the case that the causal consequences of an intentional action provide further descriptions of human actions. If my flipping the switch caused the light to go on and the burglar to be alerted, then I also turned the light on and alerted the burglar. However, only the first two are intentional actions. On Davidson’s view, all these descriptions are descriptions of the same action; alerting the burglar is an action in virtue of the fact that these same bodily movements, under a different description, are a case of intentional action (flipping the switch). Thus Davidson concludes that, “we never do more than move our bodies: the rest is up to nature” (Davidson 1971, 23)[^davidson-1971]. We can see now how the claims developed in these papers provide us with a theory of action: an action is a bodily movement such that, under some description, the bodily movement is causally explained by a primary reason.
    step1: |-
      戴维森的说明最初虽旨在阐明行动解释的本性，却也包含一种理解人类行动的基本结构：按戴维森的看法，一个为真的行动陈述（形式为“x φ 了”）指称一个事件，更具体地说，指称一个身体运动。一个身体运动是行动，当且仅当该事件是意向行动（Davidson 1971）[^davidson-1971]。戴维森并未明确这样说，[^note-2] 但按他的观点，一个事件在某种描述下是意向行动，当且仅当对该描述下的事件存在一个为真的合理化解释。戴维森（1971）[^davidson-1971]（沿袭安斯康姆）指出，“x 有意向地 φ 了”造成一种内涵语境；也就是说，一个行动是否为意向行动取决于该行动如何被描述。用戴维森的例子：如果我扳动开关，我也打开了灯，并惊动了窃贼。按戴维森的观点，“扳动开关”“打开灯”与“惊动窃贼”都是对同一行动的描述。人类行动特有的“手风琴效应”（Feinberg 1965 如此命名）使得意向行动的因果后果为人类行动提供了更多描述。如果我扳动开关导致了灯亮并使窃贼警觉，那么我也打开了灯并惊动了窃贼。然而，只有前两个是意向行动。按戴维森的观点，所有这些描述都是对同一行动的描述；惊动窃贼之所以是行动，是因为这些相同的身体运动在另一种描述下属于意向行动（扳动开关）。因此戴维森得出结论：“我们从未做得比移动自己的身体更多：其余的都取决于自然”（Davidson 1971, 23）[^davidson-1971]。现在我们可以看到，这些论文中提出的主张如何为我们提供了一种行动理论：行动是这样一种身体运动——在某种描述下，该身体运动由首要理由因果地解释。
