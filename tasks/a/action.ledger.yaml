    source: |-
      The central question in philosophy of action is standardly taken to be: “What makes something an action?” However, we obtain different versions of the question depending on what we take as the contrast class from which actions are to be differentiated. The different questions in turn encode important presuppositions. First, we may understand the question as asking us to differentiate between intentional action and the notions of acting and activity considered above (cf. Hyman 2015)[^hyman-2015]. Most commonly, however, the question is taken in terms of Wittgenstein’s classic formulation: “What is left over if I subtract the fact that my arm goes up from the fact that I raise my arm?” (1953 [2010], §621). A common, though contested, reading of this passage is this: there are certain events of an arm’s going up that are actions, and some that are not (e.g. if someone tickles me in my sleep). What further factor does the action have that the event resulting from tickling lacks?
    step1: |-
      行动哲学的核心问题通常被理解为：“是什么使某物成为行动？”然而，取决于我们把什么当作据以区分行动的对照类，我们会得到该问题的不同版本。这些不同的问题又蕴含重要预设。首先，我们可以把该问题理解为要求我们区分意向行动与上文考察的行动（acting）与活动（activity）概念（参看 Hyman 2015）[^hyman-2015]。然而，最常见的是按维特根斯坦的经典表述来理解该问题：“如果我从‘我抬起手臂’这一事实中减去‘我的手臂抬起’这一事实，还剩下什么？”（1953 [2010], §621）。对这段话的一种常见但有争议的读法是：有些手臂抬起的事件是行动，有些则不是（例如，有人在我睡着时挠我）。行动具有什么进一步的因素，而挠痒所导致的事件却不具有？
    step2: |-
      行动哲学的核心问题通常被理解为：“是什么使某物成为行动？”然而，取决于我们把什么当作据以区分行动的对照类，我们会得到该问题的不同版本。这些不同的问题又蕴含重要预设。首先，我们可以把该问题理解为要求我们区分意向行动与上文考察的行动（acting）与活动（activity）概念（参看 Hyman 2015）[^hyman-2015]。然而，最常见的是按维特根斯坦的经典表述来理解该问题：“如果我从‘我抬起手臂’这一事实中减去‘我的手臂抬起’这一事实，还剩下什么？”（1953 [2010], §621）。对这段话的一种常见但有争议的读法是：有些手臂抬起的事件是行动，有些则不是（例如，有人在我睡着时挠我）。行动具有什么进一步的因素，而挠痒所导致的事件却不具有？
