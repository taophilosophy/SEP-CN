      Aristotle’s account of practical knowledge is complex, and our focus shall lie on three points of particular significance. First, Aristotle claimed that skill is the “cause” (*aitia*) of the things produced by it. For instance, he claimed that the craft of building is the cause of the house (*Phys.* 2.5, 196b26). Second, Aristotle imposed epistemic conditions on voluntary and, a fortiori, intentional action: according to him, to act voluntarily one must know, among other things, what one is doing, to whom, and why (*NE* 3.1 1111a3–6; *EE* 2.9 1225a36–b10). Third, Aristotle identified a distinctive kind of reasoning associated with practical knowledge, a form of reasoning traditionally rendered “practical syllogism” (though see Segvic 2011)[^segvic-2011]. Such reasoning begins from a certain good and its conclusion is an action. For instance, on the basis of thinking that walks are good after lunch, and that he has eaten lunch, a man might take a walk (*DMA* 7, 701a13–14). (For more on ancient views on action, see Parry 2021.)[^parry-2021]
    step1: |-
      亚里士多德对实践知识的说明颇为复杂，我们将聚焦于三个尤其重要的点。第一，亚里士多德主张，技能是其产物之“原因”（*aitia*）。例如，他主张建筑术是房屋的原因（*Phys.* 2.5, 196b26）。第二，亚里士多德为自愿行动、更不用说为意向行动设定了认知条件：按他的看法，要自愿地行动，人必须知道——除其他事项外——自己在做什么、对谁做、为何做（*NE* 3.1 1111a3–6; *EE* 2.9 1225a36–b10）。第三，亚里士多德确认了一种与实践知识相关的独特推理，传统上称为“实践三段论”（不过见 Segvic 2011）[^segvic-2011]。这种推理从某种善开始，其结论是一个行动。例如，一个人基于“午后散步有益”以及“自己已吃过午饭”的想法，就可能去散步（*DMA* 7, 701a13–14）。（关于古代行动观的更多讨论，见 Parry 2021。）[^parry-2021]
