      Building on similar considerations, Piñeros Glasscock (2020b) presents a version of Williamson (2000)[^williamson-2000]’s anti-luminosity argument, aiming to show that the knowledge condition is incompatible with a safety principle, to the effect that to constitute knowledge, a representation could not easily be wrong. He argues that since agents can slowly transition from φ-ing to not-φ-ing through changes so small as to outstrip the agent’s discriminating capacities, agents must sometimes find themselves in situations where they are acting intentionally but either lack the confidence to possess knowledge, or, if they have it, it is misplaced. Either way, they do not know.
    step1: |-
      在类似考虑的基础上，皮涅罗斯·格拉斯科克（2020b）提出了威廉姆森（2000）[^williamson-2000] 反明见性（anti-luminosity）论证的一个版本，旨在表明知识条件与一项安全性原则不相容。该原则大意是：要构成知识，一个表征不能轻易出错。他论证，行动者可以通过极其微小、超出其辨别能力的变化，缓慢地从正在 φ 过渡到不在 φ。因此，行动者有时必定处于这样的处境：他们在有意向地行动，但要么缺乏拥有知识的信心，要么即使有这种信心，也是错置的。无论哪种情况，他们都不知道。
