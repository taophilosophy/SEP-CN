      However, this widespread consensus about teleological basicness has recently been called into question by Michael Thompson and other defenders of “naive” action theory (Thompson 2008, 107–119)[^thompson-2008]. Thompson considers the case of a person, *P,* who has pushed a stone from point α to ω. Let β be the halfway point between α and ω. It seems that if *P* pushed the stone from α to ω intentionally, then he pushed the stone from α to β intentionally. Now, let γ be the halfway point between α and β. Once again, it seems that *P* pushed the stone from α to γ intentionally. And so on. It seems, then, that there will always be a further action by which *P* pushed the stone. In other words, there is no basic action. Moreover, as a number of authors have noted (Small 2012; Lavin 2013)[^small-2012], the argument can be generalized for virtually every action, since it can be presented in terms of a series of time-segments (instead of place-segments), and virtually every action takes place over time. (For critical discussion, see Ford 2018.)[^ford-2018]
    step1: |-
      然而，这一关于目的论基本性的广泛共识近来受到迈克尔·汤普森及其他“素朴行动理论”辩护者的质疑（Thompson 2008, 107–119）[^thompson-2008]。汤普森考察一个人 *P* 把一块石头从 α 点推到 ω 点的情形。设 β 为 α 与 ω 之间的中点。似乎，如果 *P* 有意向地把石头从 α 推到 ω，那么他就是有意向地把石头从 α 推到 β。现在设 γ 为 α 与 β 之间的中点。再一次，似乎 *P* 就是有意向地把石头从 α 推到 γ。如此递推。于是似乎总会存在 *P* 借以推石头的又一个行动。换言之，不存在基本行动。此外，正如若干作者所指出的（Small 2012; Lavin 2013）[^small-2012]，该论证几乎可以推广到每一个行动，因为它可以用一系列时间段（而非空间段）来表述，而几乎每个行动都在时间中展开。（批判性讨论见 Ford 2018。）[^ford-2018]
