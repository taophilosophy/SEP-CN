      我们不行动的范围极其广大；每一刻都有许多事情是我不做的。此刻，我没有在参加奥运会，没有在写诗，没有在横渡英吉利海峡，没有飞越月球，也没有踏上通往地心的旅程。然而，这些事没有一件能被合理地描述为遗漏或克制的事例；若有人告诉我，我克制着不去参加奥运会，或说我遗漏了飞越月球，那会很奇怪。哲学家常把遗漏的事例描述为：我未能做某件我在某种意义上“本该做”的事（Bach 2010）[^bach-2010]。我的遗漏中只有一些是意向性的，甚至出于自愿：如果闹钟没响，我因睡过头而缺课，那么我遗漏了授课，却不是有意为之。另一方面，如果我因为抗议学校削减薪资而不到场，我的遗漏就是意向性的。意向性遗漏与（意向性）克制，一般被视为不行动之中唯一可能属于能动性实例的候选（关于这一观念的表述，参看 Vermazen 1985）[^vermazen-1985]。因此，我们将聚焦于这些情形。意向性遗漏与克制这两个范畴未必同一。如果我在一阵愤怒中克制住不去打我的对手，那么说我遗漏了打她似乎不对，因为我在任何意义上都并不“本该”打我的对手。
