      Several worries have been raised against Velleman’s view. One is that it makes dubious empirical claims, theorizing about the mind from the armchair. In response, Velleman (2000a)[^velleman-2000a] has provided empirical support for his more contentious psychological claim, that humans have a deep desire for self-knowledge. Another worry is that this epistemic mechanism still looks too much like wishful thinking, believing that something is the case just because one wants it to be so (Langton 2004; see Setiya 2008; Velleman 2014 for replies)[^langton-2004][^setiya-2008][^velleman-2014]. Finally, it is unclear why, if an agent realizes that the content of her intention is not realized, she must make it true that it is, rather than simply give up the belief (that she will act in a certain way). After all, we can pursue the aim of knowing ourselves both by ensuring that beliefs about ourselves are true *and* by giving up beliefs about ourselves that are false.
    step1: |-
      针对维勒曼的观点，人们提出了若干忧虑。其一是它提出了可疑的经验主张，是在扶手椅上对心灵作理论建构。作为回应，维勒曼（2000a）[^velleman-2000a] 为其更具争议的心理学主张——人类有一种对自我知识的深层欲望——提供了经验支持。另一个忧虑是，这一认知机制仍显得太像一厢情愿：仅仅因为一个人希望某事如此，就相信它如此（Langton 2004; 回应见 Setiya 2008; Velleman 2014）[^langton-2004][^setiya-2008][^velleman-2014]。最后，尚不清楚为什么：如果行动者意识到其意图的内容未被实现，她就必须使之成真，而不是干脆放弃那个（关于她将以某种方式行动的）信念。毕竟，我们可以通过确保关于我们自己的信念为真 **并且** 通过放弃关于我们自己的虚假信念，来追求认识自身这一目的。
