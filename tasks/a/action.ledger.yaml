      There seems to be a parallel structure in the case of belief: in deliberating about what to believe, it seems that I must be similarly guided by an ideal of correct belief (Shah and Velleman 2006)[^shah-2006]. In fact, philosophers who accept that there is a constitutive aim of action often compare action and belief (Velleman 1992; 1996; Tenenbaum 2007; 2012; 2018b; Schafer 2013)[^schafer-2013][^tenenbaum-2007]. Belief is supposed to have truth as its constitutive aim, and just as belief is held, at least in the good case, in accordance with this constitutive aim (as Hume 1748 said, “a wise man … proportions his belief to the evidence”)[^hume-1748], intentional agency is guided by its constitutive aim.
