      Needless to say, there is no agreed upon solution to the problem of deviance (for general skepticism about the possibility of a solution see Anscombe 1995; Vogler 2001; O’Brien 2012; Levy 2013; Horst 2015; Valaris 2015)[^anscombe-1995][^horst-2015][^levy-2013][^o’brien-2012][^valaris-2015][^vogler-2001]; on the other hand, philosophers have also argued that competing accounts suffer from problems that parallel the problem of deviant causation for theories of action (Paul 2011b)[^paul-2011b].
    step1: |-
      毋庸赘言，关于偏离问题尚无公认的解决方案（关于解决方案之可能性的普遍怀疑，见 Anscombe 1995; Vogler 2001; O’Brien 2012; Levy 2013; Horst 2015; Valaris 2015）[^anscombe-1995][^horst-2015][^levy-2013][^o’brien-2012][^valaris-2015][^vogler-2001]；另一方面，哲学家也论证，竞争性说明同样受制于与行动理论中偏离因果问题相平行的问题（Paul 2011b）[^paul-2011b]。
