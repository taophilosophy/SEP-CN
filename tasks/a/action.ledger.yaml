      There are very many attempts to solve the problem of causal deviance for a causal theory of action and we cannot cover in detail any of them or mention all of them; here we’ll just list a few influential strategies (and, of course, some solutions incorporate more than one of these strategies). The first appeals to the notion of a “proximate cause” (Mele 1992)[^mele-1992] such that an action is intentional only if, for instance, the formation of an intention to φ is the proximate cause of your φ-ing. Another family of solutions appeal to sensitivity and feedback conditions (Peacocke 1979; Bishop 1989; Smith 2012)[^bishop-1989][^peacocke-1979][^smith-2012]: the climber’s bodily movements would not count as an intentional action because they would not be sensitive to variations in conditions and information on what needs to be done (the climber would not release their hands differently if the rope turned out to be stickier or would not change their behaviour if they were to realize that the rope had a safety latch fastened to their hips). A different type of approach (though with some relevant similarities to the latter) takes the central problem for the Davidsonian approach, the reason why the problem of deviance is endemic to Davidson’s causalism, to be the attempt to understand action in terms of its *causal antecedents*, rather than its *sustaining* causes. For Frankfurt (1978)[^frankfurt-1978] the relevant causal mechanisms involved must be guiding the action. Given that action is a form of purposive behaviour, we cannot hope to understand what distinguishes action from mere bodily movements by focusing on what *precedes* the action, rather than by what happens *while the agent is acting*. As Setiya puts it:
    step1: |-
      为行动因果论解决因果偏离问题的尝试非常之多，我们无法详细讨论其中任何一种，也无法全部提及；这里只列出若干有影响力的策略（当然，有些解决方案融合了不止一种策略）。第一种策略诉诸“近因”概念（Mele 1992）[^mele-1992]：例如，只有当做 φ 的意图之形成是你做 φ 的近因时，行动才是意向性的。另一类解决方案诉诸敏感性与反馈条件（Peacocke 1979; Bishop 1989; Smith 2012）[^bishop-1989][^peacocke-1979][^smith-2012]：登山者的身体运动不会算作意向行动，因为这些运动对条件变化以及关于需要做什么的信息不敏感（如果绳子更黏，登山者不会以不同方式松手；或者，如果他意识到绳子上有安全扣系在腰间，他也不会改变行为）。另一种进路（尽管与后一类有一些相关相似之处）认为，戴维森式进路的中心问题——偏离问题何以在戴维森因果论中根深蒂固——在于它试图根据行动的 **因果先行项** 而非 **维持性原因** 来理解行动。对 Frankfurt（1978）[^frankfurt-1978] 而言，所涉及的因果机制必须始终在引导行动。既然行动是一种有目的的行为，我们就不能指望靠关注行动 **之前** 发生了什么、而不是关注 **行动者行动之际** 发生了什么，来理解行动与单纯身体运动的区别。正如 Setiya 所说：
