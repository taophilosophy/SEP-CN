      Despite all this, even Aristotle hedges on the ascription of action to animals: although he grants that they are capable of voluntary (*hekusion*) action (*DMA* 11, 703b2 et passim; *NE* 3.1, 1111a), he also says that only mature human beings are capable of action proper (*praxis*) (*NE* 3.1, 1111b). This is because action proper requires the capacity for deliberation, which animals lack. A modern version of this view is defended by Stoecker (2009)[^stoecker-2009], who argues that agency presupposes the capacity to act on the basis of “arguments” understood as grounds on which one might (reasonably) act. Similar reasons for skepticism about animal agency were influentially advanced by Davidson (1982; 2003)[^davidson-1982]. For, as we saw, Davidson takes it that intentional action is action for a reason; but acting for a reason requires possession of beliefs. Yet, Davidson held that ascription of belief makes sense only to beings who possess the concept of belief, which in turn requires the capacity for higher-order thought. Since Davidson assumed that animals possess neither concepts nor the capacity for higher-order thought, he concluded that animals are not capable of intentional action. (Davidson, to our knowledge, does not address the question whether animals are capable of acting simpliciter. However, he seems committed to saying that animals cannot act at all, given that he defines actions in terms of intentional actions: for him an action is an event that is intentional under a certain description, see Davidson 1971).
    step1: |-
      尽管如此，就连亚里士多德在把行动归于动物时也有所保留：他虽然承认动物能够做出自愿（*hekusion*）行动（*DMA* 11, 703b2 等处；*NE* 3.1, 1111a），却又说唯有成熟的人才能做出本义行动（*praxis*）（*NE* 3.1, 1111b）。这是因为本义行动要求慎思的能力，而动物缺乏这种能力。Stoecker（2009）[^stoecker-2009] 为这一观点辩护了一个现代版本，他论证说，能动性预设了依据“理由”来行动的能力，而所谓“理由”被理解为人们可以（合理地）据以行动的依据。戴维森（1982; 2003）[^davidson-1982] 也曾颇具影响力地以类似理由引发了对动物能动性的怀疑。因为，如我们所见，戴维森认为意向行动是为理由而行动；但为理由而行动要求拥有信念。然而戴维森主张，信念归属只对拥有信念概念的存在者才有意义，而信念概念又要求高阶思想的能力。既然戴维森假定动物既不拥有概念，也不具备高阶思想的能力，他便断言动物不可能有意向地行动。（据我们所知，戴维森并未讨论动物能否不加限定地行动这一问题。但既然他以意向行动来界定行动，他似乎不得不承认动物根本不能行动：在他看来，行动就是在某种描述下具有意向性的事件，见 Davidson 1971。）
