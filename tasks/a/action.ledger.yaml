      The question of what, if anything, is the constitutive (or formal) aim (or end) of intentional actions is a question about whether there is anything that all actions necessarily pursue, irrespective of their particular ends. Some philosophers (Setiya 2016b)[^setiya-2016b] deny that there is a constitutive aim of acting or that there is something that every action as such aims at. On this view, there is no such thing as an aim contained in acting as such; each action just aims at its particular end. On the other hand, many philosophers try to derive important consequences for ethics from the idea that action or agency has a constitutive aim. However, we will leave aside the examinations of these claims and focus only on the question as it pertains to the characterization of agency. (Cf. Bagnoli 2017; 2022.)[^bagnoli-2017]
    step1: |-
      所谓意向行动的构成性（或形式）目的（或目标）究竟是什么、是否真有这样一种目的，这个问题问的是：是否存在某种一切行动都必然追求的东西，而不论其特定目的为何。一些哲学家（Setiya 2016b）[^setiya-2016b] 否认行动具有构成性目的，也否认存在每个行动本身都追求的东西。按这种观点，行动本身并不包含任何目的；每个行动只追求其特定目的。另一方面，许多哲学家试图从行动或能动性具有构成性目的这一观念中，推出对伦理学重要的结论。不过，我们将搁置对这些主张的考察，只聚焦于与能动性刻画相关的那个问题。（参看 Bagnoli 2017; 2022。）[^bagnoli-2017]
