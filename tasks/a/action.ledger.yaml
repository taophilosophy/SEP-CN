      We can immediately see how to generate counterexamples to any such formula: find cases in which there is a causal path from [S₁, …, Sₙ] to *B*, but not through the “normal” causal path that would presumably give rise to the bodily movement in a genuine case of action. This is the problem of deviance for the causal theory of action; Davidson himself was among the first who provided classical examples of such causal deviance for his own account of action (but Frankfurt 1978’s presentation of the problem was particularly influential)[^frankfurt-1978]:
    step1: |-
      我们可以立刻看出如何为任何此类公式构造反例。办法是找出这样的情形——从 [S₁, …, Sₙ] 到 *B* 存在一条因果路径，但它不是经由真正行动情形中大概会产生该身体运动的那条“正常”因果路径。这就是行动因果论的偏离问题；戴维森本人是最早为其行动说明给出此类因果偏离经典例子的人之一（但法兰克福 1978 对该问题的呈现尤具影响力）[^frankfurt-1978]：
