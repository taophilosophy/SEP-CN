      The connection between imperfective aspect and processes provides further impetus for the view that actions are processes (the argument to follow is based on Michael Thompson’s ideas (2008, 122–30), though he rejects the view that actions are processes, understood as particulars (pp.134–7)). After all, it seems essential to actions that they can enter into rationalizing explanations (Anscombe 1957; Thompson 2008; Wiland 2013; Ford 2015; 2017)[^anscombe-1957][^ford-2015][^thompson-2008][^wiland-2013], and such explanations can easily be given in imperfective language. To see this, consider again Anscombe’s case of a man who operates a lever to pump poisoned water to a house, with the plan of killing the inhabitants (Anscombe 1957, §23)[^anscombe-1957]. We could represent his thoughts as follows: “I am moving the lever up and down *because* I am pumping water to the house *because* I am poisoning its inhabitants.” Indeed, such formulations seem to express canonical answers to Anscombe’s special question “Why?” (Thompson 2008; Wiland 2013; Ford 2015)[^ford-2015][^thompson-2008][^wiland-2013]. However, we cannot capture the same thoughts without imperfective expressions (Thompson 2008)[^thompson-2008]. The train of thought that goes, “I have moved the lever up and down *because* I have pumped the water *because* I have poisoned the inhabitants of the house” makes it sound like the man is acting on a conditional promise to move the lever if the men are killed by his hand. This suggests that whereas processes can directly enter into the kinds of rationalizing explanations definitive of intentional action, events cannot (except, perhaps, derivatively), which in turn suggests that actions are processes.
    step1: |-
      未完成体与过程之间的联系，为“行动是过程”这一观点提供了进一步动力（下文的论证基于迈克尔·汤普森的想法（2008, 122–30），尽管他本人反对把过程视为殊相的那种过程观（第 134–7 页））。毕竟，行动似乎本质上就能进入合理化解释（Anscombe 1957; Thompson 2008; Wiland 2013; Ford 2015; 2017）[^anscombe-1957][^ford-2015][^thompson-2008][^wiland-2013]，而这类解释很容易用未完成体语言给出。要看清这一点，请再次考虑安斯康姆的例子：一个人操作杠杆，把有毒的水抽到一座房子，打算杀死屋里的居民（Anscombe 1957, §23）[^anscombe-1957]。我们可以把他的想法表述如下：“我正在上下扳动杠杆，**因为** 我正在把水抽到那座房子，**因为** 我正在给屋里的居民下毒。”确实，这类表述似乎表达了对安斯康姆那个特殊问题“为什么？”的典范回答（Thompson 2008; Wiland 2013; Ford 2015）[^ford-2015][^thompson-2008][^wiland-2013]。然而，没有未完成体表达，我们就无法把握同样的想法（Thompson 2008）[^thompson-2008]。像“我已经上下扳动了杠杆，**因为** 我已经抽了水，**因为** 我已经给屋里的居民下了毒”这样的思路，听起来像是这个人依据一项条件性承诺在行动。其内容是：如果那些人死于他手，他就去扳动杠杆。这表明，过程可以直接进入界定意向行动的那类合理化解释，而事件则不能（或许只能派生地进入），这进而表明行动是过程。
    step2: |-
      未完成体与过程之间的联系，为“行动是过程”这一观点提供了进一步动力（下文的论证基于迈克尔·汤普森的想法（2008, 122–30），尽管他本人反对把过程视为殊相的那种过程观（第 134–7 页））。毕竟，行动似乎本质上就能进入合理化解释（Anscombe 1957; Thompson 2008; Wiland 2013; Ford 2015; 2017）[^anscombe-1957][^ford-2015][^thompson-2008][^wiland-2013]，而这类解释很容易用未完成体语言给出。要看清这一点，请再次考虑安斯康姆的例子：一个人操作杠杆，把有毒的水抽到一座房子，打算杀死屋里的居民（Anscombe 1957, §23）[^anscombe-1957]。我们可以把他的想法表述如下：“我正在上下扳动杠杆，**因为** 我正在把水抽到那座房子，**因为** 我正在给屋里的居民下毒。”确实，这类表述似乎表达了对安斯康姆那个特殊问题“为什么？”的典范回答（Thompson 2008; Wiland 2013; Ford 2015）[^ford-2015][^thompson-2008][^wiland-2013]。然而，没有未完成体表达，我们就无法把握同样的想法（Thompson 2008）[^thompson-2008]。像“我已经上下扳动了杠杆，**因为** 我已经抽了水，**因为** 我已经给屋里的居民下了毒”这样的思路，听起来像是这个人依据一项条件性承诺在行动。其内容是：如果那些人死于他手，他就去扳动杠杆。这表明，过程可以直接进入界定意向行动的那类合理化解释，而事件则不能（或许只能派生地进入），这进而表明行动是过程。
