      Building on this argument, Lavin (2013) presents a further challenge to the view that there must be (teleological) basic action. Lavin’s argument centers on the relation of the agent to her actions. Consider first a non-basic action, like poisoning the inhabitants of the house. The agent’s relation to this action is itself an agential matter, since the agent poisons the inhabitants by doing something else intentionally (operating the pump). Now consider an arbitrary basic action, *A*. By definition, the agent doesn’t do *A* by doing anything else. However, this is an action that occurs through time, so, presumably there are happenings *h₁, h₂, …, hₙ* by which *A* takes place. But since *h₁, h₂, …, hₙ* are mere happenings, this means that the agent relates to *A* non-agentially. Now, Lavin grants that it may be possible sometimes for us to relate to our actions non-agentially; but it would be alarming if this was necessarily the case, as defenders of basic action are committed to hold. It would mean that agents are necessarily alienated from their actions, in the way labourers are alienated from their labour in Marx’s critique of capitalism. In turn, Lavin argues that this would make it impossible for agents to have self-knowledge of their own actions, since self-knowledge is grounded on our agential relation.
