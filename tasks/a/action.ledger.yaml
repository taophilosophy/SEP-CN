      Only recently practical knowledge has received sustained interest in philosophy of action. Much of the resulting work aims to clarify and defend Anscombe’s view (Moran 2004; Thompson 2008, 2011; Haddock 2011; Rödl 2011; Small 2012; Wolfson 2012; Marcus 2012; Stathopoulos 2016; Campbell 2018; Marcus 2018; Frey 2019; Valaris 2021)[^campbell-2018][^haddock-2011][^marcus-2012][^moran-2004][^rödl-2011][^small-2012][^stathopoulos-2016][^thompson-2008][^thompson-2011][^valaris-2021][^wolfson-2012]; but several critics question her arguments, as well as application of the notion to the definition of intentional action (e.g., Houlgate 1966; Grice 1971; Paul 2009b; 2011b)[^grice-1971][^houlgate-1966][^paul-2009b]. In response, a number of scholars who still find inspiration in Anscombe have sought to accommodate the criticisms by giving up on some of her most ambitious claims. This section concentrates on contemporary debates about practical knowledge stemming from Anscombe’s discussion, but we start by briefly examining its origins in ancient Greek and mediaeval philosophy.
