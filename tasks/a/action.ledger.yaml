      Finally, views that fall under (iii) aim to show that even if there isn’t a relation of *entailment* between action and practical knowledge, there might yet be an interesting connection between them. For instance, some authors have argued that agents *normally* or *generally* know what they are doing (Peacocke 2003; O’Brien 2007; Gibbons 2010; Schwenkler 2015; 2019; Piñeros Glasscock 2020b)[^gibbons-2010][^o’brien-2007][^peacocke-2003][^piñeros-2020b][^schwenkler-2015]; or that the kind of knowledge that agents have of their intentional action has special properties, such as being first-personal knowledge (Dunn 1998; Moran 2001; 2004; O’Brien 2007; Marcus 2012; Schwenkler 2019)[^dunn-1998][^marcus-2012][^o’brien-2007][^schwenkler-2019].
    step1: |-
      最后，属于（iii）的观点旨在表明，即使行动与实践知识之间不存在 **蕴涵** 关系，二者之间仍可能有一种有趣的联系。例如，一些作者论证，行动者 **通常** 或 **一般** 知道自己正在做什么（Peacocke 2003; O’Brien 2007; Gibbons 2010; Schwenkler 2015; 2019; Piñeros Glasscock 2020b）[^gibbons-2010][^o’brien-2007][^peacocke-2003][^piñeros-2020b][^schwenkler-2015]；或论证行动者对其意向行动所具有的那类知识具有特殊属性，例如是第一人称知识（Dunn 1998; Moran 2001; 2004; O’Brien 2007; Marcus 2012; Schwenkler 2019）[^dunn-1998][^marcus-2012][^o’brien-2007][^schwenkler-2019]。
    step2: |-
