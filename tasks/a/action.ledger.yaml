      Early attempts to explain how an agent might intentionally *not* do something, without claiming that intentional omissions and refraining are actions, go back at least to Ryle (1973)[^ryle-1973]; Ryle argues that negative “actions” are not actions, but what he calls “lines of actions”, a category that also includes general policies such as “Take only cold baths”. More recently, Alvarez (2013)[^alvarez-2013] argues that the fact that omissions and refrainings can also manifest agency is a consequence of the fact that the power to act (intentionally) is a two-way power: a power to either do or *not* do something. Thus, when I refrain from driving my car, I manifest my agency not by engaging in an action, but rather by settling on *not* driving it (See Steward 2012; 2020 for further defense of the idea of agency as a two-way power).
    step1: |-
      早期解释行动者如何可能意向性地 **不** 做某事、同时又不主张意向性遗漏与克制是行动的尝试，至少可追溯至赖尔（1973）[^ryle-1973]；赖尔论证，否定的“行动”不是行动，而是他所称的“行动路线”（lines of actions），这一范畴还包括“只洗冷水澡”之类的一般方针。晚近，Alvarez（2013）[^alvarez-2013] 论证，遗漏与克制也能展现能动性，这一事实的根据在于：（意向地）行动的能力是一种双向能力，即要么做、要么 **不** 做某事的能力。因此，当我克制住不开车时，我展现能动性并非通过从事某个行动，而是通过最终决意 **不** 开车（关于能动性即双向能力这一观念的进一步辩护，参看 Steward 2012; 2020）。
