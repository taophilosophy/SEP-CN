      As several scholars have noted, part of what is at issue in this debate are different notions of basicness, corresponding to different understandings of the clause “by doing something else” (Baier 1971; Annas 1978; Hornsby 1980)[^annas-1978][^baier-1971][^hornsby-1980]. It is common to draw a three-fold distinction: (i) know-how basicness; (ii) causal basicness; and (iii) teleological basicness. An action is know-how basic iff there is no other (type of) action by which the agent knows how to do the one in question. An action is causally basic iff there is no other (token) action that causes it. An action is teleologically basic iff there is no other (token) action by means of which the agent does it. To illustrate in a way that highlights the differences, consider pitching a baseball. Arguably, this action is know-how basic, since the pitcher may not know a more basic action by which to do it: of course, the agent may know how to move her hands independently, but she may be unable to move her hands in the particular way in which she does when she throws the baseball unless she were actually throwing the baseball. Whether the action is causally basic depends on whether we think there is another action that causes it, such as the pitcher’s moving of his hands. Finally, and independently of the question of causation, the action appears to be teleologically non-basic, since the moving of his hands is certainly both a means and an action by which the pitcher pitches. The consensus for many years was that there must be basic actions in all three senses.
    step1: |-
      正如若干学者所指出的，这场争论部分取决于基本性概念的分歧，这些概念对应着对“通过做别的事”这一短语的不同理解（Baier 1971; Annas 1978; Hornsby 1980）[^annas-1978][^baier-1971][^hornsby-1980]。常见的做法是作三重区分：（i）知道如何的基本性；（ii）因果基本性；（iii）目的论基本性。一个行动是知道如何的基本行动，当且仅当不存在另一种（类型的）行动，行动者借以知道如何做所讨论的行动。一个行动是因果基本行动，当且仅当不存在引起它的另一种（殊例，token）行动。一个行动是目的论基本行动，当且仅当不存在行动者借以做成它的另一种（殊例）行动。为了以凸显差异的方式说明这一点，请考虑投棒球。可以说，这一行动是知道如何的基本行动，因为投手可能并不知道借以完成它的更基本的行动。当然，行动者可能知道如何独立地移动双手，但除非她确实在投棒球，否则她可能无法以投球时的那种特定方式移动双手。该行动是否为因果基本行动，取决于我们是否认为存在引起它的另一行动，例如投手移动双手。最后，且与因果问题无关，该行动似乎是目的论上非基本的，因为移动双手确实既是投手投球的手段，也是他借以投球的一个行动。多年来的共识是，三种意义上的基本行动都必定存在。
