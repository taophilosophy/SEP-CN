      Several mediaeval philosophers built on these Aristotelian ideas, especially to understand God’s knowledge of creation (see Schwenkler 2015)[^schwenkler-2015]. Anscombe (1957)[^anscombe-1957]’s account of practical knowledge draws on this tradition. She first characterizes intentional action as that to which a special sense of the question “Why?” applies, the sense that requests a reason for action (§5). Later, Anscombe appeals to Aristotle’s notion of practical reasoning to connect the notion of reason for action and the deliberative structure by which an agent determines how to attain a goal by acting (§33ff.). What the question “Why?” reveals, then, is the rational “order” of means-to-ends that define practical reasoning, and the answers reveal the descriptions under which the action is intentional.
    step1: |-
      若干中世纪哲学家在这些亚里士多德观念的基础上有所发展，尤其是为了理解上帝对创造的知识（见 Schwenkler 2015）[^schwenkler-2015]。安斯康姆（1957）[^anscombe-1957] 对实践知识的说明即取材于这一传统。她先把意向行动刻画为“为什么？”这一问题之特殊含义所适用者，即要求给出行动理由的那种含义（安斯康姆 1957, §5）。后来，安斯康姆诉诸亚里士多德实践推理的概念，把行动理由概念与行动者借以确定如何通过行动达成目标的慎思结构联系起来（§33 及以下）。于是，“为什么？”所揭示的，是界定实践推理的手段—目的之合理“秩序”，而其回答则揭示行动在哪些描述下是意向性的。
