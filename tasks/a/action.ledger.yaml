      Many historical as well as contemporary thinkers hope to answer just this question. A simple answer, common in the early modern period (e.g. Descartes 1641 AT VII 57; Hobbes 1651/1668, i.6; Hume 1739–1740 T II.3.iii; SB 413–18)[^descartes-1641][^hobbes-1651][^hume-1739], is that what distinguishes actions from other events is that they are the causal outcomes of desires, volitions, or acts of will. A modern version of this view, considered below, appeals instead to intentions, regarded as distinctive mental states. Despite the intuitiveness of these “standard” answers, there have been increasing worries that they are based on disputable assumptions. First, there is an assumption about the metaphysical category to which actions belong. Although it is natural to take them as events, some philosophers have argued that there are good reasons to group them under a different category. Second, the common reading of Wittgenstein’s question presupposes what has been called “additive” or “decompositional” conceptions of action (Ford 2011; Lavin 2015, 2013; cf. Boyle 2016)[^boyle-2016][^ford-2011][^lavin-2015]: it is assumed that an account of action can be given in terms of distinct, and simpler components. However, a number of authors have argued that this reductive project is bound to fail (Anscombe 1995; Vogler 2001; O’Brien 2012; Levy 2013; Horst 2015; Valaris 2015; Della Rocca 2020, ch.4)[^anscombe-1995][^della-2020][^horst-2015][^levy-2013][^o’brien-2012][^valaris-2015][^vogler-2001].
    step1: |-
      许多历史与当代思想家都希望回答的正是这一问题。近代早期常见的一个简单回答是：行动区别于其他事件之处，在于它们是欲望、意志行为或意愿行为的因果结果（例如 Descartes 1641 AT VII 57; Hobbes 1651/1668, i.6; Hume 1739–1740 T II.3.iii; SB 413–18）[^descartes-1641][^hobbes-1651][^hume-1739]。下文将考察该观点的一种现代版本，它转而诉诸意图，把意图视为独特的心理状态。尽管这些“标准”回答颇为直观，但人们越来越担心它们基于可疑的假定。首先是一个关于行动所属形而上学范畴的假定。虽然把行动视为事件很自然，但一些哲学家已论证，有充分理由把它们归入另一范畴。其次，对维特根斯坦问题的常见读法预设了所谓“加法式”或“分解式”的行动概念（Ford 2011; Lavin 2015, 2013; 参看 Boyle 2016）[^boyle-2016][^ford-2011][^lavin-2015]：它假定可以用彼此不同且更简单的组分来给出行动说明。然而，不少作者已论证，这一还原方案注定失败（Anscombe 1995; Vogler 2001; O’Brien 2012; Levy 2013; Horst 2015; Valaris 2015; Della Rocca 2020, ch.4）[^anscombe-1995][^della-2020][^horst-2015][^levy-2013][^o’brien-2012][^valaris-2015][^vogler-2001]。
