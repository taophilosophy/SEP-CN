      It is only recently that an alternative to the event view has been clearly formulated and defended. As such, much work remains to be done in this area, and even among defenders of the process view there are important disagreements. One important disagreement is over whether processes are particulars (Galton 2006; Steward 2012; Charles 2018)[^charles-2018][^galton-2006] or not (Stout 1997; Crowther 2011; Hornsby 2012; Crowther 2018; cf. Thompson 2008)[^crowther-2018][^crowther-2011][^hornsby-2012][^stout-1997][^thompson-2008]. Another disagreement is about whether a unique thing is a process and an event (at different times) (Steward 2012; Charles 2018)[^charles-2018], or whether the process and the event are distinct things (Stout 1997; Crowther 2011; Hornsby 2012; Charles 2015; Crowther 2018)[^charles-2015][^crowther-2018][^crowther-2011][^hornsby-2012][^stout-1997].
    step1: |-
      事件观的替代方案直到晚近才得到清晰表述与辩护。因此，这一领域仍有大量工作要做，甚至在过程观的辩护者之间也存在重要分歧。一个重要分歧是：过程是否为殊相（Galton 2006; Steward 2012; Charles 2018）[^charles-2018][^galton-2006]，抑或不是（Stout 1997; Crowther 2011; Hornsby 2012; Crowther 2018; 参看 Thompson 2008）[^crowther-2018][^crowther-2011][^hornsby-2012][^stout-1997][^thompson-2008]。另一个分歧是：是否同一个东西（在不同时刻）既是过程又是事件（Steward 2012; Charles 2018）[^charles-2018]，还是说过程与事件是彼此不同的东西（Stout 1997; Crowther 2011; Hornsby 2012; Charles 2015; Crowther 2018）[^charles-2015][^crowther-2018][^crowther-2011][^hornsby-2012][^stout-1997]。
