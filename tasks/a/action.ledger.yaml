      Another strategy has been developed by “empirically informed” philosophers, who hold that attention to the details of control mechanisms implemented at the cognitive level yields a response to the deviance problem. For example, it has been argued that cases of deviance involve lack of attention (Wu 2016), failures at the fine-grained level of motor (as opposed to distal and proximal) intentions (Mylopoulos and Pacherie 2019)[^mylopoulos-2019], or failures in the causal pathways responsible for flexible agency (Shepherd 2021)[^shepherd-2021].
    step1: |-
      另一种策略由受经验研究启发的哲学家提出，他们认为关注认知层面所实现的控制机制细节，可以为偏离问题提供回答。例如，有人论证，偏离情形涉及注意力缺失（Wu 2016）、运动意图（而非远端与近端意图）这一精细层面的失败（Mylopoulos and Pacherie 2019）[^mylopoulos-2019]，或负责灵活能动性的因果通路失败（Shepherd 2021）[^shepherd-2021]。
    step2: |-
