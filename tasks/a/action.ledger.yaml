      Although these challenges to Davidson’s original theory of action are different from the challenges that focus on the nature of action in progress, some philosophers argue that they are not unrelated. Tenenbaum (2018; 2020)[^tenenbaum-2020] argues that understanding better the nature of intentional action as actions that are *always* extended through time, and the nature of the instrumental reasoning involved in intentional action in progress, makes Bratman’s appeal to a *sui generis* state of future-directed intention superfluous in our understanding of practical rationality. On this view, there is no difference between the rational requirements governing the various phases of an action in progress and the requirements governing the execution of a plan that contains various steps, or of a general intention that contains various instances (and thus purported requirements that are specific to future-directed intentions turn out to be redundant or spurious).
    step1: |-
      尽管这些对戴维森原有行动理论的挑战，与聚焦于进行中行动本性的挑战不同，一些哲学家仍论证二者并非无关。特南鲍姆（2018; 2020）[^tenenbaum-2020] 论证：意向行动 **总是** 延展于时间之中；只要更好地理解其本性，并更好地理解进行中意向行动所涉工具性推理的本性，布拉特曼诉诸一种 *sui generis* 的面向未来意图状态，在我们对实践合理性的理解中就是多余的。按此观点，支配进行中行动各阶段合理性的要求，与支配多步骤计划之执行的各项要求、或支配多实例一般意图的各项要求，并无差别。因此，那些据称专属于面向未来意图的要求，结果要么冗余，要么虚假。
