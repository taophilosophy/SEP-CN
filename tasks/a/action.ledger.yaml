      There are various proposals of what the constitutive aim of an action might be. Perhaps the most traditional version of this view is the idea that the good is the constitutive aim of agency, possibly going back to Socrates (*Protagoras* 351a–8e; *Gorgias* 467c–8d). The notion of “good” involved here can be very thin, meaning no more than “considering matters aright” (Williams 1981)[^williams-1981] in the realm of practical reason; such views are versions of the thesis often called “the guise of the good” (Tenenbaum 2007; Clark 2010; Schafer 2013)[^clark-2010][^schafer-2013][^tenenbaum-2007]. According to the guise of the good, if I φ intentionally, then I must take φ-ing to be good. Arguably some other versions of the constitutive aim of agency are specifications of the thin notion of “good” or “human good” (see Boyle and Lavin 2010)[^boyle-2010]. Other constitutive aims that have been defended in literature are self-understanding or autonomy (Velleman 1989; 1992; 1996; 2009)[^velleman-1989], self-constitution (Korsgaard 1996; 2008; 2009)[^korsgaard-1996], and the will to power (Katsafanas 2013)[^katsafanas-2013].
    step1: |-
      关于行动的构成性目的究竟是什么，有各种提议。这一观点最传统的版本也许是：善是能动性的构成性目的，这可追溯至苏格拉底（*Protagoras* 351a–8e；*Gorgias* 467c–8d）。此处“善”的概念可以非常单薄，在实践理性领域中，其含义不过“对事情作出正确考量”（Williams 1981）[^williams-1981]；此类观点是常被称为“善的外观”这一论题的诸版本（Tenenbaum 2007; Clark 2010; Schafer 2013）[^clark-2010][^schafer-2013][^tenenbaum-2007]。按善的外观论，如果我有意向地 φ，那么我必定认为 φ 是善的。可以说，能动性构成性目的的其他一些版本，是对“善”或“人类善”这一单薄概念的细化（参看 Boyle and Lavin 2010）[^boyle-2010]。文献中还辩护过其他构成性目的：自我理解或自主（Velleman 1989; 1992; 1996; 2009）[^velleman-1989]、自我构成（Korsgaard 1996; 2008; 2009）[^korsgaard-1996]，以及权力意志（Katsafanas 2013）[^katsafanas-2013]。
