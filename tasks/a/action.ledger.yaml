      The scope of our inactivity is vast; at each moment, there are many things I don’t do. Right now, I am not competing in the Olympics, not writing poetry, not swimming in the English Channel, not flying over the moon, or taking a journey to the center of the earth. However, none of the things could be plausibly described as cases of omissions or refrainings; it would be odd if I were told that I was refraining from competing in the Olympics or omitting to fly over the moon. Philosophers often describe cases of omissions as cases of my failing to do something that I was somehow “supposed to do” (Bach 2010)[^bach-2010]. Only some of my omissions are intentional or even voluntary: if my alarm does not go off and I miss my class because I overslept, I omitted to teach but not intentionally. On the other hand, if I fail to show up because I am protesting my university’s salary cuts, my omission was intentional. Intentional omissions and (intentional) refrainings are generally taken to be the only possible candidates for being instances of agency among not-doings (see Vermazen 1985 for an expression of this idea)[^vermazen-1985]. Thus, we will focus on these cases. The categories of intentional omissions and refraining are not necessarily identical. If I refrain from striking my opponent in a fit of anger, it seems wrong to say that I omitted to strike her as there is no sense in which I was “supposed to” strike my opponent.
