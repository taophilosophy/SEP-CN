      If we accept that omissions are absences, or at least that they are not events, the possibility of intentional omissions seem to present a challenge to the causal theory of action. After all, if agency can be manifested without any events being present, it is difficult to see how agency can be explained in the terms of the standard story of action (that is, in terms of the causal history of the bodily movements that manifest our agency). Hornsby (2004)[^hornsby-2004] argues that the failure of the standard causal theory to account for omissions is symptomatic of its more general failure to locate the agent in an account of intentional action that reduces agency to causal connections between non-agential happenings.
    step1: |-
      如果我们接受遗漏是缺失，或至少不是事件，那么意向性遗漏的可能性似乎对行动因果论构成了挑战。毕竟，如果无需任何事件在场就能展现能动性，那就很难看出如何能用行动的标准故事（也就是用那些展现我们能动性的身体运动的因果历史）来解释能动性。Hornsby（2004）[^hornsby-2004] 论证，标准因果论无力说明遗漏，这显示出其更普遍的失败：未能在一套把能动性化约为非能动事件间因果联系的意向行动说明中为行动者定位。
