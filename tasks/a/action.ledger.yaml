      > In the case of basic action, the crucial concept is that of *guidance*: when an agent intentionally φs, he *wants* to φ, and this desire not only causes but continues to guide behaviour towards its object. (It is this condition that fails in Davidson’s example). (Setiya 2007, 32)[^setiya-2007]
    step1: |-
      > 就基本行动而言，关键概念是 **引导**：当行动者有意向地 φ 时，他 **想要** φ，而这种欲望不仅引起行为，还持续引导行为朝向其对象。（戴维森的例子所缺失的正是这一条件）。（Setiya 2007, 32）[^setiya-2007]
    step2: |-
