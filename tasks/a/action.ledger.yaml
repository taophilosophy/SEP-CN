      There is a growing literature responding to Thompson’s and Lavin’s challenges, both refining the arguments, or presenting objections to it (Setiya 2012; Hornsby 2013; Lynch 2017; Frost 2019; Small 2019)[^frost-2019][^hornsby-2013][^lynch-2017][^setiya-2012][^small-2019]. This is not surprising, since the debate about basic actions has important repercussions for other questions about the nature of intentional action. For example, Lavin (2013) holds that defenders of (teleologically) basic action are committed to a “decompositional account” of agency (see section 1). After all, if there are basic actions, we may be able to give an account of what makes something an action in terms of the non-agential relation an agent bears to her basic actions. Moreover, Ford (2017; 2018)[^ford-2017][^ford-2018] notes that Thompson’s argument suggests a novel way to pursue action theory, one that defines action not in terms of *reasons for action* but, in the first instance, in terms of the means by which an action is pursued.The latter, Ford holds, better captures the agential perspective: in the context of deliberation, what the agent asks is *How* to pursue a particular course of action, rather than *Why* she is doing something. Finally, the debate may have repercussions for our understanding of the relation between skill and intentional action. For example, both Frost and Small suggest that at the most fundamental level, our agency depends on our exercise of practical *skills* by which we enter an instrumental order without consciously representing that order at the level of propositional thought (Small 2012; 2019; Frost 2019)[^frost-2019][^small-2012].
    step1: |-
      回应汤普森与 Lavin 挑战的文献日益增多，它们或精炼这些论证，或对其提出反对（Setiya 2012; Hornsby 2013; Lynch 2017; Frost 2019; Small 2019）[^frost-2019][^hornsby-2013][^lynch-2017][^setiya-2012][^small-2019]。这并不奇怪，因为关于基本行动的争论对其他关于意向行动本性的问题有重要影响。例如，Lavin（2013）认为，（目的论上）基本行动的辩护者承诺了一种关于能动性的“分解式说明”（见第 1 节）。毕竟，如果存在基本行动，我们或许就能依据行动者与其基本行动之间的非能动关系，来说明是什么使某物成为行动。此外，Ford（2017; 2018）[^ford-2017][^ford-2018] 指出，汤普森的论证提示了一种推进行动理论的新方式：它首先不是依据 **行动的理由** 来定义行动，而是依据追求行动所凭借的手段来定义行动。Ford 认为，后者更好地把握了能动者视角：在慎思的语境中，行动者问的是 **如何** 追求某一特定行动路线，而不是她为什么在做某事。最后，这场争论可能影响我们对技能与意向行动之关系的理解。例如，Frost 与 Small 都提示，在最基本的层面上，我们的能动性取决于我们对实践 **技能** 的运用，借此我们进入一种工具性秩序，却不在命题思想的层面上有意识地表征该秩序（Small 2012; 2019; Frost 2019）[^frost-2019][^small-2012]。
