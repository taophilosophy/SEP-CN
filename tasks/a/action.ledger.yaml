      Though regarded as Anscombe’s central opponent, Davidson himself recommended a version of (i). According to him, although agents need not know what they are doing under every description under which they act intentionally, they must know what they are doing under *at least one* description under which the action is intentional (Davidson 1971, 51)[^davidson-1971]. The carbon copier, for instance, may not know that he is making 10 carbon copies, but he would have to know that he is making carbon copies, or that he is moving his hands, etc. Arguably, the idea that practical knowledge is restricted to knowledge of actions *in progress* is also a weakening of the thesis, since Anscombe appears to include also knowledge of future actions (§§51–2) and of completed actions such as the knowledge that I *wrote* my name on the board (§48) or even of what is *written* (§19). Indeed, it has been argued that imperfective and perfective knowledge are interdependent (Haase 2018)[^haase-2018]. Finally, other weakenings include the view that agents must know what they intend (Fleming 1964)[^fleming-1964], what they are trying to do/that they are trying (Searle 1985; cf. Grice 1971)[^grice-1971], or what basic actions they are performing (Setiya 2008; 2009; 2012)[^setiya-2008]. Since Anscombe’s thesis is strictly stronger than these, it follows that they will avoid certain problems that hers faces. However, it is not clear that such retreats help avoid the general problem, and restricting the thesis to more immediate occurrences—basic actions, intentions, or attempts—risks losing on the aforementioned feature that makes Anscombe’s view so interesting: the idea that we might bear the same intimate epistemic connection to something external as we bear to parts of our mental lives (Piñeros Glasscock 2020b)[^piñeros-2020b].
    step1: |-
      戴维森本人虽被视为安斯康姆的主要对手，却建议了一种（i）的版本。按他的看法，行动者不必在每一个自己据以有意向地行动的描述下都知道自己在做什么。但他们必须在 **至少一个** 行动据以成为意向行动的描述下知道自己正在做什么（Davidson 1971, 51）[^davidson-1971]。例如，复写副本的制作者可能不知道自己正在制作十份复写副本，但他必须知道自己正在制作复写副本，或知道自己正在移动双手，等等。可以说，把实践知识限制为对 **进行中** 行动的知识，也是一种弱化；安斯康姆似乎还包括对未来行动的知识（§§51–2），以及对已完成行动的知识，例如知道我在黑板上 **写下** 了自己的名字（§48），甚至知道 **写着** 什么（§19）。的确，有人论证未完成体知识与完成体知识相互依赖（Haase 2018）[^haase-2018]。最后，其他弱化包括：行动者必须知道自己意图什么（Fleming 1964）[^fleming-1964]、知道自己试图做什么／知道自己正在尝试（Searle 1985; 参看 Grice 1971）[^grice-1971]，或知道自己正在施行哪些基本行动（Setiya 2008; 2009; 2012）[^setiya-2008]。既然安斯康姆的论题严格强于这些弱化版本，就可推出它们会避开她的论题所面临的某些问题。然而，尚不清楚这类退让是否有助于避开一般性问题；而把论题限制于更直接的事件——基本行动、意图或尝试——则有失去前述使安斯康姆观点如此有趣之特征的风险。这一特征就是：我们也许能与某种外部事物保持同我们与心理生活各部分所保持的同样亲密的认知联系（Piñeros Glasscock 2020b）[^piñeros-2020b]。
    step2: |-
