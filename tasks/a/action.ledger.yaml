      The most straightforward reason to think that actions are processes is that actions appear to have these properties, as is indicated by the examples used in the previous paragraph (Stout 1997; Steward 2012; Charles 2015; 2018)[^charles-2015][^stout-1997]. Thus, one’s action can speed up or slow down, be done in one way or another at different times in its history, and may culminate at different times. Indeed, an ongoing action may never be completed.
    step1: |-
      认为行动是过程的最直截理由在于：行动似乎具有这些属性，上一段所用的例子已表明了这一点（Stout 1997; Steward 2012; Charles 2015; 2018）[^charles-2015][^stout-1997]。因此，一个人的行动可以加快或放慢，可以在其历史的不同时刻以这种或那种方式来做，也可能在不同时刻完成。确实，一个仍在进行中的行动可能永远不会完成。
