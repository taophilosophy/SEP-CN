      For a long time, this and similar examples (e.g. Bratman 1987, 37, Mele 1992, ch.8)[^bratman-1987][^mele-1992] were taken as decisive refutations in the literature, but their force has been contested recently (Thompson 2011; Small 2012; Wolfson 2012; Stathopoulos 2016; Beddor and Pavese 2021; Pavese forthcoming)[^beddor-2021][^small-2012][^stathopoulos-2016][^thompson-2011][^wolfson-2012]. The impetus for many of these responses stems from Thompson’s work on the importance of aspect for action-theory. In particular, actions in progress display what Falvey (2000)[^falvey-2000] has called “openness”, which corresponds to the inaptly-named “imperfective paradox” in the linguistic literature (more below): Someone can be doing something and never get around to have done it (e.g. I can be crossing the street, but never cross it). It is thus possible for someone to know that they are φ-ing even if they don’t, in fact, get to have φ-ed. To apply these considerations to Davidson’s argument, we need to distinguish between two cases. First, the normal case where the agent intends to make 10 carbon copies, but has the opportunity to correct and continue on if things go wrong (e.g. if he initially only makes 5, but then makes 5 more). Second, the one-shot case where the agent must make 10 carbon copies in one go (say, because he is competing in a copy-making tournament). In the normal case, it appears like the agent may know that he is making 10 carbon copies (even if he doesn’t know that he will complete the 10 in one go). So it raises no problems for the knowledge condition. What, then, of the one-shot case? Although here it may be granted that the agent doesn’t know that he is making 10 carbon copies, it is questionable whether he is making 10 carbon copies intentionally. The reason is that *if* he were to make 10 carbon copies as a result of pressing as hard as he can, this would be too much an accidental result of his performance. But, as we saw (see section 2.4), accidentality is incompatible with intentional action. Hence, in the normal case the agent acts intentionally while knowing, while in the one-shot case he doesn’t even act intentionally.
    step1: |-
      在很长一段时间里，这个例子以及类似的例子（例如 Bratman 1987, 37, Mele 1992, ch.8）[^bratman-1987][^mele-1992] 在文献中被当作决定性的反驳，但它们的力度近来受到质疑（Thompson 2011; Small 2012; Wolfson 2012; Stathopoulos 2016; Beddor and Pavese 2021; Pavese forthcoming）[^beddor-2021][^small-2012][^stathopoulos-2016][^thompson-2011][^wolfson-2012]。许多回应的动力来自汤普森关于体（体貌）对行动理论之重要性的工作。具体而言，进行中的行动展现出法尔维（2000）[^falvey-2000] 所谓的“开放性”，它对应于语言文献中名称不当的“未完成体悖论”（详见下文）。一个人可以正在做某事，却始终没能做完（例如，我可以正在穿过街道，却从未穿过它）。因此，一个人即使事实上并未做成 φ，也可能知道自己正在 φ。要把这些考虑应用于戴维森的论证，我们需要区分两种情况。第一，正常情形：行动者意图制作十份复写副本，但若事情出错，他有机会修正并继续（例如，他起初只做了五份，然后又做了五份）。第二，一次性情形：行动者必须一气呵成地制作十份复写副本（比如因为他在参加一场复写锦标赛）。在正常情形中，行动者似乎可以知道自己正在制作十份复写副本（即使他不知道自己会一气呵成地完成十份）。因此，这对知识条件不构成问题。那么，一次性情形又如何？尽管这里可以承认行动者不知道自己正在制作十份复写副本，但他是否在有意向地制作十份复写副本，则大可怀疑。理由是：**如果** 他因尽力按压而制作出十份复写副本，那会太像是其施行的偶然结果。但正如我们所看到的（见第 2.4 节关于偏离因果的讨论），偶然性与意向行动不相容。因此，在正常情形中，行动者有意向地行动并且知道自己在做什么；而在一次性情形中，他甚至不是有意向地行动。
    step2: |-
