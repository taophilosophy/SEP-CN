      Anscombe complained that treating these as different actions would be like treating the author of *David Copperfield* and the author of *Bleak House* as different men, rather than a single author, Dickens (Anscombe 1979, 222)[^anscombe-1979]. Indeed, the fine-grained view has similar counterintuitive implications. Consider: the properties of pumping water, pumping water while smiling, and pumping water at noon, are all different properties. So, the man who pumped water at noon while smiling would have engaged in three different pumpings according to the fine-grained view.
