      Finally, the coarse- and fine-grained views obviously do not exhaust the conceptual landscape. A number of philosophers have offered individuation principles stricter than those advanced by coarse-grained theorists, but laxer than those advanced by fine-grained theorists (e.g. Ginet 1990)[^ginet-1990]. Charles (1984)[^charles-1984], for example, argues that Aristotle would individuate actions in terms of capacities. This allows us to say that the moving of one’s hands is the same action as the moving of one’s hands quickly (since a single capacity is thereby actualized), even though it is a different action from the poisoning, which actualizes a different set of capacities. The challenge for this view is to provide an account of the individuation of capacities independent of the account of the individuation of actions.
