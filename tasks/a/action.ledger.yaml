      An influential account of this sort was provided in foundational work by Velleman (1989)[^velleman-1989]. Simplifying somewhat, Velleman argues that human beings have a core desire to know themselves. Like any desire, this one will motivate agents to satisfy it. In addition, they have the capacities to (a) have thoughts about what they are doing and will do, and (b) have thoughts that are self-referential, e.g. <this very thought won’t make me famous>. Suppose, then, that someone has the thought <I will go to the store in virtue of this thought>. Then, given the desire to know herself, the agent will be motivated to make this thought true. Hence, thought structures of this sort (‘intentions’) will give the agent reasons to believe that what she intends will be true.
    step1: |-
      维勒曼（1989）[^velleman-1989] 的基础性工作提供了这样一种有影响力的说明。稍作简化：维勒曼论证，人类有一种认识自身的核心欲望。像任何欲望一样，这种欲望会促动行动者去满足它。此外，行动者具有如下能力：（a）对自己正在做与将要做的事形成想法；（b）形成自指的想法，例如 <这一想法本身不会让我出名>。那么，假设某人有这样的想法 <我将凭借这一想法去商店>。于是，鉴于认识自身的欲望，行动者会受到促动去使这一想法成真。因此，这类想法结构（“意图”）将给行动者理由相信：她所意图的将会成真。
