      Davidson’s view in ARC is presented against a number of philosophers (mostly influenced by Wittgenstein), who, on his view, take action explanations to provide a different kind of understanding than causal explanations (for a sympathetic overview of this Wittgenstein-inspired work, see Sandis 2015)[^sandis-2015]. Some of the identified targets of the paper (such as Melden 1961) are clearly arguing for the views Davidson rejects. Others (such as Anscombe 1957 and Ryle 1949)[^anscombe-1957][^ryle-1949] do not clearly embrace the theses Davidson objects to, or at least not all of them. These philosophers took intentional explanations to display how an action is made intelligible or justified. So Melden says that “citing a motive [gives] a fuller characterization of the action; it [provides] a better understanding of what the [agent] is doing” (Melden 1961, 88). Similarly, Anscombe’s special sense of the question ‘Why?’, discussed below (section 4.1), is supposed to pick out the particular way in which actions are explained. This claim is not one that Davidson denies; according to Davidson, in intentional explanations, or ‘rationalizations’, “the agent is shown in his Role of Rational Animal … There is an irreducible … sense in which every rationalization justifies: from the agent’s point of view there was, when he acted, something to be said for the action.” (Davidson 1963, 690–1)[^davidson-1963]. But Melden, and other Wittgensteineans, argue that this kind of explanation cannot be a causal explanation. Melden’s central argument is the “logical connection” argument. According to Melden, since the supposedly causal antecedents of an action (mental items such as desires and intentions) are logically related to the intentional action (I would not count as intentionally signalling a turn if I did not desire/intend to signal a turn), the explanation of the action in terms of such mental items cannot be an explanation in terms of “Humean causes”. After all, Humean causation connects events that are logically independent.
    step1: |-
      戴维森在 ARC 中的观点是针对若干（大多受维特根斯坦影响的）哲学家提出的。在他看来，这些人认为行动解释提供的是一种不同于因果解释的理解（关于这项受维特根斯坦启发的工作的同情性概述，见 Sandis 2015）[^sandis-2015]。该文所确定的一些靶子（如 Melden 1961）显然在论证戴维森所拒斥的观点。另一些（如 Anscombe 1957 与 Ryle 1949）[^anscombe-1957][^ryle-1949] 则并未明确接受戴维森所反对的论题，或至少并未全部接受。这些哲学家认为，意向解释展示了行动如何变得可理解或得到证成。因此，Melden 说：“给出一个动机［会］对行动作出更充分的刻画；它［提供］对［行动者］正在做什么的更好理解”（Melden 1961, 88）。同样，安斯康姆对“为什么？”这一问题的特殊用法（下文第 4.1 节讨论）理应标识出行动得到解释的特定方式。这一主张并非戴维森所否认；按戴维森的说法，在意向解释或“合理化”中，“行动者被展示在‘理性动物’这一角色中……在一种不可还原的意义上，每一种合理化都在证成：从行动者的观点看，当他行动时，该行动总有某种可取之处。”（Davidson 1963, 690–1）[^davidson-1963]。但 Melden 及其他维特根斯坦派论证，这类解释不可能是因果解释。Melden 的核心论证是“逻辑关联”论证。按 Melden 的看法，行动所谓的原因性先行项（欲望与意图之类的心理项目）与意向行动有逻辑关联：如果我不想／不意图示意转弯，我就不会算作有意向地示意转弯。因此，用这类心理项目对行动所作的解释不可能是用“休谟式原因”所作的解释。毕竟，休谟式因果关系连接的是逻辑上独立的事件。
