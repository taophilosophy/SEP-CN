      Philosophers have tried to answer these challenges. One can argue that a knowledge or belief condition, to the extent that it is valid, is explained by the constitutive aim of action. Moreover, perhaps the possibility of a third-person explanation of an action in terms of explanatory reasons whose objects are not good in any way is compatible with the fact that from the first-person point of view, these objects must have been regarded to be good in some way. So even if the fact that Rugen kills his father explains why Inigo Montoya killed Rugen without providing a normative reason for it, it still might be the case that avenging his father must have appeared good *to Inigo Montoya* in some way if he killed Rugen intentionally (see Tenenbaum 2012)[^tenenbaum-2012].
    step1: |-
      哲学家试图回应这些挑战。人们可以论证：知识条件或信念条件只要有效，就可由行动的构成性目的来解释。此外，从第三人称视角用对象在任何意义上都不好的说明性理由来解释行动，这或许与下述事实相容：从第一人称视角看，这些对象必定在某种意义上被视为好的。因此，即便 Rugen 杀死自己父亲这一事实解释了 Inigo Montoya 为何杀死 Rugen，却并未为此提供规范理由。仍然可能的情形是：如果 Inigo Montoya 是意向地杀死 Rugen 的，那么为父复仇必定在某种意义上 **对 Inigo Montoya 而言** 显得是好的。参看 Tenenbaum 2012[^tenenbaum-2012]。
