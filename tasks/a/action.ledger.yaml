      在布拉特曼看来，面向未来的意图在我们的慎思中至少有两种重要功能：定夺功能与协调功能。假设我正在决定下次假期去哪里，并假定我把选择缩小到两种可能：波基普西与代托纳海滩。在某个时刻——通常远在假期第一天之前——我会形成一个去度其中某个具体假期的意图（比如去代托纳海滩），而这个意图的形成独立于对任一选项的评价性判断；我可能确信两者同样可欲，但我一年只能度一次假。形成去代托纳海滩的意图，为我 **定夺** 了这个问题，并终结了对此事的慎思。既然慎思在原则上可以无限持续下去，定夺功能就在管理我们这类有限存在者的认知资源方面发挥重要作用。但面向未来的意图也在延展能动性中发挥重要协调功能。去度假是一项复杂的事业，没有事先的计划，我们就无法完成这一行动。如果我要去代托纳海滩，我就需要计划待多久、在那里做什么、预订旅馆等等。随着这些行动展开，计划本身还需要进一步细化。如果我打算为印地 500 赛车带上零食，就需要计划带哪些零食，然后计划去哪里、何时买到它们，再计划如何到达选定的杂货店，如此等等。我们能够形成这些不同类型的面向未来意图（计划、方针以及更具体的面向未来意图）。这使我们能够从事这些复杂的延展能动性形式（用布拉特曼的说法，成为“计划着的行动者”）。为履行这些功能，面向未来的意图必须抵抗重新考虑，并在时间中保持稳定。如果我在形成去代托纳海滩旅行的意图之后不断改变主意，我的意图就没有定夺问题，也没有排除进一步的慎思。这还会使个人内部与个人之间的协调都成为不可能：如果我预计自己会改变主意，那么在代托纳海滩预订旅馆就毫无意义。此外，这些功能对我的意图施加融贯性约束：例如，缺乏手段—目的融贯，同样会使面向未来的意图无法正常发挥功能。
