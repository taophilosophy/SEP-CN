      One argument has already been mentioned: If a person is asked, “Why are you φ-ing?” and she (sincerely) replies, “I didn’t realize I was φ-ing” then she wasn’t φ-ing intentionally. It would seem to follow that a person must know what she is doing if acting intentionally. However, this argument is unsound. First, the expression “I didn’t realize…” is colloquially used to express complete lack of awareness, rather than mere ignorance (Schwenkler 2019, 189)[^schwenkler-2019]. At most, then, the argument would show that the action cannot be completely beyond the agent’s purview. Second, even if the person’s state is in fact knowledge *after* the question is asked, this may be a conversational effect: By asking “Why are you φ-ing?”, the speaker intimates that the agent is φ-ing. This puts the agent in a position to know this, but not in a way that is tied to her agency.
    step1: |-
      其中一个论证已经提到过：如果有人被问“你为什么在 φ？”，而她（真诚地）回答“我没意识到自己在 φ”，那么她就不是在有意向地 φ。由此似乎可以推出：如果在意向地行动，人就必须知道自己正在做什么。然而，这个论证并不健全。第一，“我没意识到……”这一说法在口语中用来表达完全没有觉察，而不仅仅是无知（Schwenkler 2019, 189）[^schwenkler-2019]。那么，该论证至多表明，行动不可能完全超出行动者的视野。第二，即使在该问题被提出 **之后**，此人的状态事实上是知识，这也可能是对话效应：通过问“你为什么在 φ？”，说话者暗示行动者正在 φ。这使行动者处于知道此事的位置，但并非以与其能动性相关联的方式。
