      (6) refers to an ongoing occurrence in the midst of development. As such, many of its properties are still indeterminate and may change over time. It may be happening in the bathroom in a matter of seconds if Donald stays there; but he could take a break, forget about it, and continue on with it several minutes later in the kitchen. Moreover, the manner in which it takes place can change as it occurs: it may speed up (if Donald is suddenly in a hurry) or slow down (if Donald is distracted by a noise), and he may start doing it more mindfully, or distractedly. Indeed, however Donald is *doing* the buttering, it may happen that he never ends up *having buttered* the toast (a nearby scream might cause him to drop it in the toilet halfway through). This is sometimes called the “imperfective paradox”: in general, ⌜*x* is φ-ing⌝ does not entail ⌜*x* has φ’d⌝. By contrast, the event itself, denoted by (7), cannot speed up or slow down, nor change the manner in which it is done, since it is already complete. This is why it has a determinate temporal-spatial location in terms of which some have sought to individuate it (Lemmon 1967; Quine 1985; Davidson 1985)[^davidson-1985][^lemmon-1967][^quine-1985]. By contrast, processes do not have an essential temporal-spatial location: the same process of buttering that is now taking place at 12:01 could culminate in a minute or in an hour.
    step1: |-
      （6）指的是一种仍在展开之中的发生过程。正因如此，它的许多属性仍未确定，并且可能随时间改变。如果唐纳德一直待在那里，它可能就在浴室里几秒钟内发生；但他也可以中途休息、把它忘掉，几分钟后在厨房里接着做下去。此外，它发生的方式也可以在其展开过程中改变：它可以加快（如果唐纳德突然赶时间）或放慢（如果他因噪声而分心），他也可能开始更用心地做，或者心不在焉地做。确实，无论唐纳德 **正在怎样** 抹黄油，都可能出现他最终从未 **抹好** 吐司的情形（附近一声尖叫可能使他在半途把它掉进马桶）。这有时被称为“未完成体悖论”：一般而言，⌜*x* 正在 φ⌝ 并不蕴涵 ⌜*x* 已经 φ 了⌝。相比之下，（7）所指的事件本身不能加快或放慢，也不能改变其完成方式，因为它已经完成。正因如此，它才具有确定的时间—空间位置，有些人正是据此试图对它作个体化（Lemmon 1967; Quine 1985; Davidson 1985）[^davidson-1985][^lemmon-1967][^quine-1985]。相比之下，过程并不具有本质性的时间—空间位置：同一个现在于 12:01 发生的抹黄油过程，可能在一分钟后完成，也可能在一小时后才完成。
