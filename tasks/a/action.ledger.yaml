      One last important aspect of Anscombe’s conception of practical knowledge is the contention that an agent knows what she is doing “without observation” (1957, §8). This is because, intuitively, whereas I need to look at what is being written on the board to know what someone else is writing, I don’t need to look at what *I* am doing to know what I am writing. Beyond intuitive examples, however, it has proven difficult to explain what non-observational knowledge is.[^note-5] Nevertheless, there are three points on which there is wide agreement. First, the class of practical knowledge is a proper subclass of the class of non-observational knowledge, one that also includes, for instance, knowledge of our limbs’s position (§§9–10). Second, to say that knowledge is non-observational is minimally to say that it is non-inferential. Third, and finally, the non-observational character of this knowledge is of the sort traditionally associated with mental states. Hence, one of the most remarkable theses of *Intention* is that public happenings—actions—could be known in the distinctive way traditionally reserved for internal mental states, so that there would be “spontaneous knowledge of material reality” (Rödl 2007, 121)[^rödl-2007].
    step1: |-
      安斯康姆实践知识观念的最后一个重要方面是这一主张：行动者“无需观察”就知道自己在做什么（1957, §8）。这是因为，直观上，我需要看黑板上正在写什么，才能知道别人在写什么；但我不需要看 **我** 正在做什么，就知道我在写什么。然而，除直观例子之外，要解释非观察性知识究竟是什么，已被证明颇为困难。[^note-5] 尽管如此，有三点是广泛一致的。第一，实践知识类是较广的非观察性知识类中的一个真子类，后者还包括例如关于我们肢体位置的知识（§§9–10）。第二，说知识是非观察性的，最低限度是说它是非推论性的。第三，也是最后一点，这种知识的非观察特征属于传统上与心理状态相联系的那一类。因此，《意图》（*Intention*）最引人注目的论题之一是：公共发生的事件——行动——可以以传统上专为内部心理状态保留的独特方式被知道，于是可以有“对物质实在的自发知识”（Rödl 2007, 121）[^rödl-2007]。
