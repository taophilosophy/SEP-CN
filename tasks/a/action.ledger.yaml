      Suppose all the Faculty at State University are upset about the recently announced cuts, and each of them express their dissatisfaction but in different ways: Mary wears a T-shirt that says “No More Cuts”, Terry writes a letter to the local paper, and Larry simply decides not to go to the department’s holiday party. It seems that in all these cases, the Faculty members are manifesting their agency—they are all equally expressing their dissatisfaction with the cuts—even if Larry does so by (intentionally) *not* doing something. Such cases of refrainings and intentional omissions seem paradigmatic instances of agency and yet they do not seem to be cases of action: after all, the agent did nothing. But how could the absence of an action be a manifestation of agency? One might be tempted to avoid any puzzling conclusions by simply denying that omissions are absences; by, for instance, proposing that Larry’s intentional omission consists in doing whatever acting he did *instead* of engaging in the omitted action. So if he goes to the bar instead of going to the holiday party, Larry omits to go to the party *by* going to the bar and so his going to the bar and his omitting to go to the party are the same event. However, this view immediately encounters difficulties as it seems that I can intentionally omit to do things without engaging in any positive act. I can refrain from laughing at my enemy’s jokes just by staying still and I can intentionally omit things even while asleep (Clarke 2014)[^clarke-2014]: indeed, instead of going to the bar, Larry could have omitted to go to the party by simply sleeping through it.
    step1: |-
      假定州立大学全体教员都对最近宣布的削减感到不满，各人以不同方式表达不满。玛丽穿着一件印有“不要再削减”的 T 恤，特里给当地报纸写信，拉里则干脆决定不参加系里的节日聚会。在所有这些情形中，教员们似乎都在展现其能动性——他们同样都在表达对削减的不满——即便拉里是通过（有意向地） **不做** 某事来表达的。这类克制与意向性遗漏似乎是能动性的典型实例，却似乎不构成行动的事例：毕竟，行动者什么也没做。但行动的缺失何以能成为能动性的展现？人们或许会忍不住干脆否认遗漏是缺失，以此回避任何令人困惑的结论；例如提出，拉里的意向性遗漏就在于他为了代替所遗漏的行动而做出的任何行为（无论那是什么行为）。因此，如果他不是去参加节日聚会而是去酒吧，那么拉里就是 **通过** 去酒吧而遗漏了去参加聚会，于是他去酒吧与遗漏去参加聚会是同一事件。然而，这种观点立刻遇到困难，因为我似乎可以意向性地遗漏做某些事而不做出任何积极行为。我可以只是保持不动就克制住不去嘲笑敌人的笑话，甚至可以在睡着时意向性地遗漏某些事（Clarke 2014）[^clarke-2014]。事实上，拉里本可以不去酒吧，而是干脆睡过去，从而遗漏了去参加聚会。
