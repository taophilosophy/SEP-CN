      In the case of secondary deviance, a seemingly promising approach is to require that a “non-basic” action counts as intentional only if (roughly) it follows the agent’s plan (Mele and Moser 1994)[^mele-1994]. Davidson’s killer’s plan to kill his enemy did not involve a stampede, and thus it should not count as intentional action.
    step1: |-
      就继发偏离而言，一个看似有希望的办法是要求：“非基本”行动只有（大致）遵循行动者的计划时，才算意向行动（Mele and Moser 1994）[^mele-1994]。戴维森笔下凶手的杀敌计划并不包括惊动野猪，因此不应算作意向行动。
