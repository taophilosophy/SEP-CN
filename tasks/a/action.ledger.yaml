      There are, finally, several non-inferentialist stories about how practical knowledge is possible. Some accounts appeal to knowledge-how or skill as the state by which an intention ensures that its content is not only true but also justified, so as to amount to knowledge (Setiya 2012; Small 2012; Valaris 2021)[^setiya-2012][^small-2012][^valaris-2021]. Another view, due to O’Brien (2007)[^o’brien-2007], explains practical knowledge in terms of the exercise of deliberative capacities. The agent knows what she is doing because the selection of an action is done via the exercise of capacities that narrow options in terms of the practical possibilities of the agent. Others take practical knowledge to be inferential, but the inference in question is practical inference. On this view, practical knowledge is warranted by the practical considerations that constitute the agent’s practical reasoning (Harman 1997; Tenenbaum 2007; Ross 2009; Marušić and Schwenkler 2018; Campbell 2018; Frey 2019)[^campbell-2018][^harman-1997][^marušić-2018][^ross-2009][^tenenbaum-2007]. Finally, some have tried to show that accounts of epistemic warrant or entitlement designed to explain how we can directly believe on the basis of perception might explain how we can directly believe on the basis of our wills (Peacocke 2003; Newstead 2006; Piñeros Glasscock 2020a)[^newstead-2006][^peacocke-2003][^piñeros-2020a]. As this brief and incomplete summary indicates, there is not yet anything close to a consensus about how best to explain the epistemic standing for practical knowledge.
    step1: |-
      最后，还有若干关于实践知识如何可能的非推论主义说明。一些说明诉诸知道如何或技能，把它视为意图借以确保其内容不仅为真而且得到证成、从而构成知识的状态（Setiya 2012; Small 2012; Valaris 2021）[^setiya-2012][^small-2012][^valaris-2021]。另一种观点由奥布莱恩（2007）[^o’brien-2007] 提出，以慎思能力的运用来解释实践知识。行动者知道自己正在做什么，因为行动的选择是通过运用以行动者的实践可能性来缩小选项的能力而完成的。另一些人认为实践知识是推论性的，但所涉推论是实践推论。按此观点，实践知识由构成行动者实践推理的实践考虑所担保（Harman 1997; Tenenbaum 2007; Ross 2009; Marušić and Schwenkler 2018; Campbell 2018; Frey 2019）[^campbell-2018][^harman-1997][^marušić-2018][^ross-2009][^tenenbaum-2007]。最后，一些人试图表明，那些旨在解释我们如何能直接基于知觉而相信的认知担保或认知资格说明，或许能解释我们如何能直接基于自己的意志而相信（Peacocke 2003; Newstead 2006; Piñeros Glasscock 2020a）[^newstead-2006][^peacocke-2003][^piñeros-2020a]。正如这份简短而不完整的概述所表明的，关于如何最好地解释实践知识的认知地位，尚无任何接近共识的东西。
