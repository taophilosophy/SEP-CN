      Although this entry largely follows suit in focusing on intentional human action as a manifestation of reason, we flag from the start that there are other philosophical traditions that call this assumption into question. For example, Japanese (as well as Buddhist) philosophers have discussed the possibility of action without the need of a self (Kasulis 2019, section 5.3)[^kasulis-2019]. And on one reading of the *Daode Jing*, the highest forms of human agency are, in some sense, beyond reason. This is one way to understand the notion of wuwei, or “nonaction,” which describes an ideal way of acting that is neither unconscious or involuntary, nor purposeful or goal-oriented (cf. Hansen 2020, section 9.4 and Wong 2021, section 4.1)[^hansen-2020]. Similarly, the Inner Chapters of the *Zhuangzi* may present a view of human action as going beyond thought and reason. By ceasing to think about his action, Butcher Ding, appears to achieve such a sublime level of harmony with his activity as to obviate the need for effort (3.2). On one reading, Zhuangzi is presenting a non-intellectualist account of skill, not unlike that defended by Dreyfus and Dreyfus (2004) as the highest form of expertise (Ivanhoe 1993)[^ivanhoe-1993]. On a more radical reading, the Inner Chapters do not present a higher form of skill, but rather a more radical notion, *Dao* (way), opposing skill (Schwitzgebel 2019)[^schwitzgebel-2019].[^note-1]
    step1: |-
      本词条大体上也沿此路径，聚焦于作为理性表现的人类意向行动；但我们要从一开始就指出，还有其他哲学传统质疑这一假定。例如，日本（以及佛教）哲学家讨论过无需自我的行动的可能性（Kasulis 2019, section 5.3）[^kasulis-2019]。而按对《道德经》的一种解读，人类能动性的最高形式在某种意义上超出理性。这是理解“无为”（wuwei）或“非行动”（nonaction）的一条途径：无为描述一种理想的行动方式，它既不是无意识或非自愿的，也不是有目的或以目标为导向的（参看 Hansen 2020, section 9.4 与 Wong 2021, section 4.1）[^hansen-2020]。同样，《庄子》内篇也可能呈现了一种超出思想与理性的人类行动观。庖丁通过停止思考自己的行动，似乎达到了与其活动如此崇高的和谐，以致无需努力（3.2）。按一种解读，庄子提出了一种非理智主义的技能说明，与德雷福斯与德雷福斯（2004）所主张的最高专长形式并无二致（Ivanhoe 1993）[^ivanhoe-1993]。按一种更激进的解读，内篇呈现的不是更高形式的技能，而是一个更激进的概念——道（way），它与技能相对（Schwitzgebel 2019）[^schwitzgebel-2019]。[^note-1]
