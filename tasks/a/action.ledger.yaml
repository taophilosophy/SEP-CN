      Possibly the most widespread and accepted theory of intentional action (though by no means without its challengers) is the causal theory of action, a theory according to which something counts as an intentional action in virtue of its causal connection to certain mental states. In fact, this view is often dubbed (following Velleman 1992) the ‘standard story of action’. Although other philosophers proposed similar views before, the contemporary causal theory of action, or “causalism,” was pioneered by Donald Davidson, especially the essays collected in Davidson (2001a)[^davidson-2001a]. Davidson has contributed to many topics in the philosophy of action, such as action individuation, the logical form of action sentences, the relation between intention and evaluative judgments, among others, but here we will focus mostly on his arguments for, and his formulation of, the causal theory of action. In *Action, Reasons, and Causes* (ARC), Davidson provides an account of the nature of rationalizing explanations of actions, or what is often called ‘intentional explanations’. Such explanations explain the action by providing the reason why the agent acted. ARC tries to understand how a reason can explain an action. The two central theses of ARC, or modified versions of them, became subsequently widely, though certainly not universally, accepted. The first thesis is that the explanation of an action involves a “primary reason”: a belief and a desire pair that rationalizes the action by expressing the end pursued in the action (desire) and how the agent thought the action would accomplish this end (instrumental belief). So, for instance, in “Larry went to Gus the Barber because he wanted a haircut”, Larry’s action is explained by a desire (his wanting a haircut) and a belief, left implicit in this case (his believing that he could get a haircut by going to Gus the Barber). The second central thesis is that the primary reason is also the cause of the action.
    step1: |-
      关于意向行动，流传最广、接受度最高的理论（尽管绝非没有挑战者）或许是行动因果论。按此理论，某物凭借其与某些心理状态的因果联系而算作意向行动。事实上，这一观点常被称为（沿袭 Velleman 1992）“行动的标准故事”。尽管此前已有其他哲学家提出类似观点，当代的行动因果论，或称“因果论”，是由唐纳德·戴维森开创的，尤其是收于 Davidson（2001a）的诸篇论文[^davidson-2001a]。戴维森在行动哲学的许多主题上都有贡献，例如行动个体化、行动语句的逻辑形式、意图与评价判断的关系等，但这里我们主要关注他为行动因果论所作的论证及其表述。在《行动、理由与原因》（Action, Reasons, and Causes，简称 ARC）中，戴维森说明了行动的合理化解释——常被称为“意向解释”——的性质。此类解释通过提供行动者行动的理由来解释行动。ARC 试图理解理由如何能够解释行动。ARC 的两个核心论题（或其修正版本）随后被广泛接受，尽管当然并非普遍接受。第一个论题是：对行动的解释涉及一个“首要理由”，即信念与欲望的配对，它通过表达行动所追求的目的（欲望）以及行动者认为该行动将如何实现这一目的（工具性信念）而使行动合理化。例如，在“拉里因为想理发而去格斯理发店”中，拉里的行动由一种欲望（他想理发）和一种在此例中未明言的信念（他相信去格斯理发店就能理发）来解释。第二个核心论题是：首要理由同时也是行动的原因。
