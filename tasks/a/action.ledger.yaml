      Finally, there are scholars who argue—largely based on empirical findings—against premise 2 on the grounds that animals possess the very capacities denied by skeptics of animal agency. For example, Kaufmann (2015)[^kaufmann-2015] argues that chimpanzees are capable of a fairly sophisticated form of planning that meets the constraints of Bratman’s account of planning agency. They are thus capable of acting, even though they lack conceptual representations. The question whether some animals (and, if so, which) have beliefs has also been the subject of debate on the basis of empirical research. While both early and recent studies appeared to support the Davidsonian view that animals lack beliefs (Heyes and Dickinson 1990; Marticorena et al. 2011, Horschler, MacLean, and Santos 2020;)[^heyes-1990][^horschler-2020][^marticorena-2011], later research complicates the question (de Waal 2016; Krupenye et al. 2016)[^krupenye-2016][^waal-2016].
    step1: |-
      最后，有学者——主要基于经验发现——反对前提 2，理由是动物恰恰具备动物能动性怀疑论者所否认的那些能力。例如，Kaufmann（2015）[^kaufmann-2015] 论证黑猩猩能够进行相当复杂形式的计划，符合布拉特曼计划性能动性说明的约束条件。因此，尽管它们缺乏概念性表象，却能够行动。某些动物是否拥有信念（若有，是哪些）这一问题，也一直是基于经验研究而争论的主题。早期与晚近的研究似乎都支持戴维森式观点，即动物缺乏信念（Heyes and Dickinson 1990; Marticorena et al. 2011, Horschler, MacLean, and Santos 2020;）[^heyes-1990][^horschler-2020][^marticorena-2011]，而后来的研究使该问题变得复杂（de Waal 2016; Krupenye et al. 2016）[^krupenye-2016][^waal-2016]。
    step2: |-
