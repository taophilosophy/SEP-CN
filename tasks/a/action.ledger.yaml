      There are several reasons to categorize actions as events. A central one concerns their connection to causation (Davidson 1967a; Goldman 1970)[^davidson-1967a][^goldman-1970]. Actions are directly implicated in causal relations: modifying Davidson’s example (pp.4–5), the burglar’s entering my house might cause me to turn on the light, which in turn might cause him to be startled. On the widespread assumption that events are the primary causal relata, it would follow that actions, such as my turning on of the light, are events.
    step1: |-
      有若干理由把行动归入事件。其中一个核心理由涉及行动与因果的联系（Davidson 1967a; Goldman 1970）[^davidson-1967a][^goldman-1970]。行动直接卷入因果关系：对戴维森的例子（第 4–5 页）略作改动——窃贼进入我家，可能使我打开灯，而开灯又可能使他受惊。按“事件是首要的因果相关项”这一广泛接受的假定，由此便可推出：行动（例如我打开灯）是事件。
