      Michael Bratman’s work (Bratman 1987; 1999a; 2007; 2018, among others)[^bratman-1987] was seminal in arguing for the importance of intentions, policies, and plans (all of which he classifies as intentions or planning states) in our understanding of how limited rational beings coordinate their actions through time and can pursue ends and projects through extended periods of time. Bratman’s planning theory of agency starts from rejecting Davidson’s account of intention, and replacing it with a new understanding of the function (and nature) of intentions and planning states. Davidson had identified intention with an “all-out” or unconditional judgment, “which, if we were to express it in words, would have a form like ‘This action is desirable’” (Davidson 1970b, 55)[^davidson-1970b]; that is, an intention is a distinctive kind of evaluative judgment (“this action is good” or “this action is desirable”). On this view, to intend to φ is to have φ-ing as the conclusion of one’s practical reasoning. Bratman finds this view problematic in many ways, but arguably his most important objection to Davidson’s view is that Davidson’s theory of intention misses out one of the “two faces” of intentions. Intentions, on Bratman’s views, are tied not only to intentional action but also to coordinating plans (Bratman 1987)[^bratman-1987]; Davidson’s identification of intentions with certain evaluative judgments seems incapable of making room for the latter “face”. However, this role of *future-directed intentions* in planning and coordinating action through time is essential to agency. Among our future-directed intentions, there are very specific intentions to, say, make huevos rancheros for brunch later today, but also more complex plans and projects (my plan to write a book on tricycles is also a specific, though not significantly filled out, intention for a specific action or set of actions), and policies (my policy to exercise once a week is a “repeatable”, general, intention to perform various futures actions).[^note-3]
    step1: |-
      迈克尔·布拉特曼的工作（Bratman 1987; 1999a; 2007; 2018 等）[^bratman-1987] 具有开创性。它论证了意图、方针与计划的重要性：他把这些都归为意图或计划状态；这些状态有助于我们理解有限理性的存在者如何跨越时间协调其行动，如何历经漫长时期追求目的与规划。布拉特曼的能动性计划理论始于拒斥戴维森对意图的说明，并以对意图与计划状态之功能（以及本性）的新理解取而代之。戴维森曾把意图等同于一种“全盘”判断或无条件的判断，“若用语言表达出来，其形式大致是‘这一行动是可欲的’”（Davidson 1970b, 55）[^davidson-1970b]；也就是说，意图是一种独特的评价性判断（“这一行动是好的”或“这一行动是可欲的”）。按此观点，意图做 φ 就是以 φ 作为自己实践推理的结论。布拉特曼认为这一观点在许多方面都有问题，但可以说他对戴维森观点最重要的反驳是：戴维森关于意图的理论漏掉了意图“两张面孔”中的一张。按布拉特曼的看法，意图不仅与意向行动相联系，也与协调性的计划相联系（Bratman 1987）[^bratman-1987]；戴维森把意图等同于某些评价性判断，似乎无法为后一张“面孔”留出余地。然而，**面向未来的意图** 在计划与跨时间协调行动中的这一作用，对能动性至关重要。在我们面向未来的意图之中，既有非常具体的意图，比如今天稍晚做早午餐时煎墨西哥式煎蛋（huevos rancheros）；也有更复杂的计划与规划（比如我写一本关于三轮车的书，这也是一个针对某个具体行动或某组行动的具体意图，尽管内容尚未充分展开）；还有方针（比如我每周锻炼一次，这是一种“可重复的”、一般的意图，用来执行未来各种行动）。[^note-3]
