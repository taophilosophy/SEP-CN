      Another well-known challenge to the idea that actions have a constitutive aim is David Enoch’s “schmagency” objection (Enoch 2006; 2011)[^enoch-2006]; in this context, the objection raises the possibility that for any purported constitutive aim, one could spurn such an aim and merely “schmact” or be a mere “schmagent”—someone who behaves just like an agent except for having the constitutive aim of agency. Enoch’s objection, however, is specifically concerned with attempts to derive normative consequences from the constitutive aim of action (for further discussion, see Bagnoli 2017; 2022)[^bagnoli-2017].
    step1: |-
      另一个著名挑战是大卫·伊诺克（David Enoch）的“虚构能动性”（schmagency）反驳（Enoch 2006; 2011）[^enoch-2006]；在此语境中，该反驳提出这样一种可能性：对于任何所谓的构成性目的，人们都可以拒斥它，而只是“虚构地行动”（schmact），或成为一个纯粹的“虚构行动者”（schmagent）。这种虚构行动者的行为与行动者完全一样，唯独不具有能动性的构成性目的。不过，伊诺克的反驳专门针对一种尝试：从行动的构成性目的中推出规范性结论（进一步讨论参看 Bagnoli 2017; 2022）[^bagnoli-2017]。
