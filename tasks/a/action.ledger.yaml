      This is a case of what is often called “primary deviance” (Mele and Moser 1994)[^mele-1994], in which the bodily movements in question are not even actions, but the causal theory seems to imply they are. In contrast, in cases of “secondary deviance”, the theory misdescribes one of the consequences of the action as intentional when it clearly is not. The same Davidson paper provides an example of the latter:
    step1: |-
