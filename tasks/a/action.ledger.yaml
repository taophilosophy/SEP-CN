      Worries of this sort led Velleman to distinguish “directive” from “receptive” cognition (Velleman 2000, ch.7); but it has led others to consider the alternative view that practical knowledge is a standard form of inferential knowledge (Grice 1971; O’Shaughnessy 1980, 2003; Paul 2009a)[^grice-1971][^o’shaughnessy-1980][^paul-2009a]. On the most sophisticated inferentialist account, due to Paul (2009a)[^paul-2009a], agents take advantage of the special knowledge they have of their intentions to make inferences about what is happening and will happen. Given that intentions are reliably executed, such inferences reliably yield knowledge. A more radical inferentialist alternative, suggested by authors like Carruthers (2011)[^carruthers-2011] on the basis of empirical evidence, is that we know our actions on the basis of the same processes by which we know others’ minds: we essentially predict what actions are most likely to happen, given what else we know about others’ motives and beliefs—it’s just that we know a lot more about our own minds. (Similar views about self-knowledge in general are defended by Gopnik 1993, and have their origin in Ryle 1949. For criticisms, see Boyle 2022; Levy 2022.)[^boyle-2022][^gopnik-1993][^levy-2022][^ryle-1949]
    step1: |-
      这类忧虑促使维勒曼区分“指导性”认知与“接受性”认知（Velleman 2000, ch.7）；但也促使另一些人考虑另一种观点：实践知识是推论知识的一种标准形式（Grice 1971; O’Shaughnessy 1980, 2003; Paul 2009a）[^grice-1971][^o’shaughnessy-1980][^paul-2009a]。在保罗（2009a）[^paul-2009a] 提出的最精致的推论主义说明中，行动者利用自己关于意图的特殊知识，去推论正在发生与将要发生的事。鉴于意图会被可靠地执行，这类推论可靠地产生知识。一种更激进的推论主义替代方案由卡拉瑟斯（2011）[^carruthers-2011] 等作者依据经验证据提出：我们对自己行动的认知，与我们认知他人心灵所依据的过程相同——我们本质上是在预测，鉴于我们关于他人动机与信念的其他所知，哪些行动最可能发生；只不过我们对自己心灵的所知要多得多。（关于自我知识的一般类似观点由 Gopnik 1993 辩护，其源头在 Ryle 1949。批评见 Boyle 2022; Levy 2022。）[^boyle-2022][^gopnik-1993][^levy-2022][^ryle-1949]
