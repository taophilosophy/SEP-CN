      Arguments of this sort convinced most scholars that there must be basic actions (though see Baier 1971 and Sneddon 2001 for early dissent)[^baier-1971][^sneddon-2001]. The debate then centered on *which* actions are basic. Many scholars held that simple bodily movements, like moving a finger or raising an eyebrow, were basic, while others held that they could be more complex (tying one’s shoes), or that they must be simpler: perhaps only mental actions, or tryings were basic. After all, I move my finger by attempting to move it; and we need to distinguish between the attempt and the movement, since sometimes the attempt occurs without the movement (e.g. if my fingers are suddenly paralized) (Prichard 1945: Hornsby 1980; O’Shaughnessy 1980; see Cleveland 1997, ch.5 for criticism)[^cleveland-1997][^hornsby-1980][^o’shaughnessy-1980][^prichard-1945].
    step1: |-
      这类论证使大多数学者相信必定存在基本行动（不过早期异议见 Baier 1971 与 Sneddon 2001）[^baier-1971][^sneddon-2001]。此后的争论便集中于 **哪些** 行动是基本的。许多学者认为，简单的身体运动——如动一根手指或扬一下眉毛——是基本的；另一些学者则认为基本行动可以更复杂（系鞋带），或者相反，认为它必须更简单：也许只有心理行动或尝试才是基本的。毕竟，我是通过尝试移动手指来移动手指的；而且我们需要区分尝试与运动，因为有时尝试发生了而运动没有发生（例如我的手指突然瘫痪）（Prichard 1945: Hornsby 1980; O’Shaughnessy 1980；批评见 Cleveland 1997, ch.5）[^cleveland-1997][^hornsby-1980][^o’shaughnessy-1980][^prichard-1945]。
