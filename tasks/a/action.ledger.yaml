      A prominent way of criticizing the argument is to call premise 1 into question. For example, Steward (2009)[^steward-2009] criticizes Davidson’s view that agency requires the capacity to act for reasons (Premise 1 in Davidson’s argument). Her objection is based on empirical research suggesting that agency ascriptions are developmentally prior to propositional attitude ascriptions. She argues that implicit in these earlier ascriptions is a less demanding account of agency that presupposes more basic object-directed attitudes (as well as other capacities, such as subjectivity and agential control). Since animals possess these features, there is an important sense in which they act. Other arguments in a similar vein include Dretske’s (1999)[^dretske-1999] argument to the effect that agency presupposes only the capacity for representing the world (understood, roughly, as a learned response whose operations are shaped by the environment through experience), and the idea defended by Korsgaard (2018)[^korsgaard-2018], Sebo (2017)[^sebo-2017], and Schapiro (2021)[^schapiro-2021] that animals act on the basis of simpler, perceptual-like, representations.
    step1: |-
      批评该论证的一条显著途径是质疑前提 1。例如，斯图尔德（2009）[^steward-2009] 批评戴维森关于能动性要求为理由而行动之能力的观点（戴维森论证中的前提 1）。她的反对基于经验研究，这些研究提示，能动性归属在发生上先于命题态度归属。她论证说，这些较早的归属中隐含一种要求较低的能动性说明，它预设了更为基本的对象导向态度（以及其他能力，如主体性与能动者控制）。既然动物具备这些特征，那么在一种重要意义上，它们是在行动。Dretske（1999）[^dretske-1999] 也从类似思路出发，论证能动性只预设表象世界的能力（大致理解为一种习得反应，其运作方式经由经验而受环境塑造）；还有科尔斯戈德（2018）[^korsgaard-2018]、Sebo（2017）[^sebo-2017] 与 Schapiro（2021）[^schapiro-2021] 所主张的观点：动物依据更简单、类似知觉的表象而行动。
    step2: |-
      批评该论证的一条显著途径是质疑前提 1。例如，斯图尔德（2009）[^steward-2009] 批评戴维森关于能动性要求为理由而行动之能力的观点（戴维森论证中的前提 1）。她的反对基于经验研究，这些研究提示，能动性归属在发生上先于命题态度归属。她论证说，这些较早的归属中隐含一种要求较低的能动性说明，它预设了更为基本的对象导向态度（以及其他能力，如主体性与能动者控制）。既然动物具备这些特征，那么在一种重要意义上，它们是在行动。Dretske（1999）[^dretske-1999] 也从类似思路出发，论证能动性只预设表象世界的能力（大致理解为一种习得反应，其运作方式经由经验而受环境塑造）；还有科尔斯戈德（2018）[^korsgaard-2018]、Sebo（2017）[^sebo-2017] 与 Schapiro（2021）[^schapiro-2021] 所主张的观点：动物依据更简单、类似知觉的表象而行动。
