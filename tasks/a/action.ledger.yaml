      Another, related, way to motivate the idea that action has a constitutive aim focuses on the standpoint of deliberation. When deliberating about what to do, it seems that I need to find an answer to the question “what to do” or “whether to φ” (Hieronymi 2005; 2006; Shah 2008)[^hieronymi-2005][^shah-2008]; in the good case, my action expresses an adequate answer to this question. But how could I go about answering these questions if action did not have a constitutive aim; if there’s nothing that could count as the correct way of answering this question? Similarly, from the point of view of action explanation, some answers seem to provide an intelligible explanation of action while others seem to invite the question “but why would you aim at (want) *that*?” If you ask me “Why are we eating the jello?”, “Because it is blue” seems to invite further questions, while “Because I find the taste pleasant” brings the inquiry to an end. Anscombe argues that the search for further explanations ends when we hit a “desirability characterization”, something that is not just conceived as good but “*really* … one of the many forms of the good” (Anscombe 1957, §40)[^anscombe-1957].
    step1: |-
      还有一种与之相关的进路，也意在说明行动具有构成性目的，它聚焦于慎思的立场。在慎思该做什么时，我似乎需要为“该做什么”或“是否要 φ”这一问题找到答案（Hieronymi 2005; 2006; Shah 2008）[^hieronymi-2005][^shah-2008]；在好的情形下，我的行动恰当地回答了该问题。但倘若行动没有构成性目的，倘若没有任何东西能算作回答该问题的正确方式，我又怎能着手回答这些问题呢？同样，从行动说明的观点看，有些回答似乎为行动提供了可理解的说明，另一些回答则似乎会招来这样的追问：“可你为什么会以 **那个** 为目的（想要 **那个**）？”如果你问我“我们为什么吃这果冻？”，“因为它是蓝色的”似乎会招致进一步追问，而“因为我觉得它味道不错”则终止了探究。安斯康姆论证，对进一步说明的寻求，会在我们触及“可欲性刻画”时终止——那东西不只是被设想为好的，而且“**确实**……是善的诸多形式之一”（Anscombe 1957, §40）[^anscombe-1957]。
