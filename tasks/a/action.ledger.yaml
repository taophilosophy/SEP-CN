      Davidson’s ARC exposes a crucial fallacy with Melden’s argument (similar problems had been pointed out by Annette Baier (then Annette Stoop) in Stoop 1962). Accepting Hume’s account of causal relations does not commit us to the view that any description of a cause is logically independent of any description of its effect. An event can only be described as “sunburning” if it is caused by exposure to the sun, but this does not mean that the cause of a sunburn is not a “separate entity” from the sunburn. We can describe an event as “The event that caused X” without thereby refuting Humeanism about causation. Davidson argues that, on the contrary, the mental items cited in an action explanation can only explain the action if they are also the cause of the action (the second central thesis of ARC). In our example above, Larry might have had other belief-desire pairs that rationalized his action of going to the barber. For instance, Larry might also have wanted a bottle of cream soda and believed that he could procure such an item at Gus the Barber. However, he did not (we may stipulate) go there because he wanted cream soda but because he wanted a haircut (and believed he could get one at Gus the Barber). The only way we can explain the difference between potentially rationalizing, but non-explanatory belief-desire pairs, is that the belief-desire pair that genuinely explains the action, the primary reason, also causes the action. The question of how non-causal theories can distinguish between merely potentially explanatory reasons for an action from the reasons that actually explain it became known as “Davidson’s Challenge” to non-causal theories of action (Mele 1992; Mele 2013)[^mele-1992][^mele-2013].
    step1: |-
      戴维森的 ARC 揭示了 Melden 论证中的一个关键谬误（Annette Baier（当时姓 Stoop）已在 Stoop 1962 中指出类似问题）。接受休谟的因果关系说明，并不使我们承诺如下观点：对原因的任何描述都与其对结果的任何描述在逻辑上独立。一个事件只有由日晒引起，才能被描述为“晒伤”，但这并不意味着晒伤的原因与晒伤不是“分离的实体”。我们可以把某事件描述为“引起 X 的事件”，却并不因此驳倒关于因果作用的休谟主义。戴维森论证，恰恰相反，行动解释所援引的心理项目只有同时也是行动的原因，才能解释该行动（ARC 的第二个核心论题）。在上文例子中，拉里可能还有其他使自己去理发店这一行动合理化的信念—欲望配对。例如，拉里可能也想喝一瓶奶油苏打，并相信他能在格斯理发店弄到这种饮料。然而（我们可以规定），他去那里不是因为他想喝奶油苏打，而是因为他想理发（并相信能在格斯理发店理发）。要解释那些可能使行动合理化但不具解释力的信念—欲望配对与真正解释行动的配对之间的差别，唯一办法是：真正解释行动的那个信念—欲望配对，即首要理由，同时也引起该行动。非因果理论如何区分仅仅可能解释行动的理由与真正解释行动的理由，这一问题被称为针对非因果行动理论的“戴维森挑战”（Mele 1992; Mele 2013）[^mele-1992][^mele-2013]。
