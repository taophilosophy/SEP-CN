      Views that fall under (ii) have been influentially defended by several authors (Grice 1971; Harman 198;1997; Setiya 2007; 2008; 2009; 2012; Velleman 2001; Tenenbaum 2007; Ross 2009; Clark 2020)[^clark-2020][^grice-1971][^ross-2009][^setiya-2007][^tenenbaum-2007]. A popular version of this view rejects a knowledge condition in favor of a belief condition (Setiya 2007; Velleman 2001; Ross 2009; Clark 2020)[^clark-2020][^ross-2009][^setiya-2007]: if the agent φs intentionally [intends to φ], she believes that she is φ-ing [believes that she will φ]. Such a view is arguably better supported by some of Anscombe’s own arguments (such as the argument in terms of conversation dynamics above); and it seems to preserve a special place for actions as occurrences that are public but to which our minds bear a special epistemic relation. However, it has been argued that such views also suffer from problems, and fail to avoid counterexamples with the same structure as Davidson’s carbon copier, even though they are explanatorily weaker (Bratman 1991; Paul 2009a; 2009b; Levy 2018)[^bratman-1991][^levy-2018][^paul-2009a]. Since authors like Setiya see the avoidance of counterexamples as a central payoff of the weakenings, it is unclear whether they are worth the costs in explanatory value.
    step1: |-
      属于（ii）的观点得到了若干作者的有力辩护（Grice 1971; Harman 198;1997; Setiya 2007; 2008; 2009; 2012; Velleman 2001; Tenenbaum 2007; Ross 2009; Clark 2020）[^clark-2020][^grice-1971][^ross-2009][^setiya-2007][^tenenbaum-2007]。①该观点一个流行的版本拒斥知识条件而赞成信念条件（Setiya 2007; Velleman 2001; Ross 2009; Clark 2020）[^clark-2020][^ross-2009][^setiya-2007]：如果行动者有意向地 φ［意图 φ］，她就相信自己正在 φ［相信她将 φ］。可以说，这种观点得到安斯康姆本人某些论证（如上文关于对话动态的论证）的更好支持；而且它似乎为行动保留了一个特殊位置：行动是公共发生的事件，但我们的心灵与它们保持着特殊的认知关系。然而，也有人论证，这类观点同样受问题困扰，未能避开与戴维森复写副本例子结构相同的反例，尽管它们在解释力上更弱（Bratman 1991; Paul 2009a; 2009b; Levy 2018）[^bratman-1991][^levy-2018][^paul-2009a]。既然像塞蒂亚这样的作者把避开反例视为这些弱化方案的核心收益，那么它们是否值得在解释力上付出代价，就并不清楚。
