    source: |-
      An inquisitive child, Anscombe decided to convert to Roman Catholicism in her early teens. She attended the Sydenham School, graduating in 1937, and went on to St. Hugh’s College, Oxford. During her early years at Oxford she met three young women who also had remarkable careers in philosophy: Iris Murdoch, Mary Midgley, and, above all, Philippa Foot, with whom she developed a deep friendship her entire life (Mac Cumhaill & Wiseman 2022)[^mac-2022]. Anscombe received a First in Literae Humaniores (Classics and Philosophy) in 1941. After her graduation she remained at St. Hugh’s as a research student, and in 1942 moved to Newnham College, Cambridge, where she met Ludwig Wittgenstein. She believed that attending Wittgenstein’s lectures freed her from the trap of phenomenalism that had so plagued her (MPM, ix). In 1946 she was offered a Research Fellowship at Somerville College, Oxford, and was appointed to a teaching Fellowship there in 1964. She moved from Oxford to Cambridge in 1970 when she was awarded a Chair of Philosophy at Cambridge – the Chair formerly occupied by Wittgenstein. She remained at Cambridge until her retirement in 1986.
    step1: |-
      安斯康姆自幼好奇，十几岁便决定皈依罗马天主教。她就读于西德纳姆学校，1937 年毕业，随后进入牛津大学圣休学院。在牛津的早年间，她结识了三位后来同样在哲学上事业斐然的女青年：艾丽丝·默多克、玛丽·米奇利，尤其是菲利帕·富特，后者与她结下了终身不渝的深厚友谊（Mac Cumhaill & Wiseman 2022）[^mac-2022]。1941 年，安斯康姆以一等成绩毕业于人文文学（古典学与哲学）专业。毕业后她留在圣休学院做研究生，1942 年转至剑桥大学纽纳姆学院，并在那里结识了路德维希·维特根斯坦。她相信，听维特根斯坦的课使她摆脱了长期困扰她的现象主义窠臼（MPM, ix）。1946 年，她获牛津大学萨默维尔学院研究员职位，1964 年被聘为该校教学研究员。1970 年，她获剑桥大学哲学教席——即维特根斯坦曾担任的教席——遂由牛津迁往剑桥。她在剑桥一直工作到 1986 年退休。
