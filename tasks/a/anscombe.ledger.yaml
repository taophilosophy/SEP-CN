      Beginning with Searle (1975), a different thesis gets very widely attributed to Anscombe in the literature: one about ‘mental states’ like beliefs and desires, each of which supposedly has a different “direction of fit”. Anscombe, however, says nothing here about believing or desiring or other kinds of mental states; the example instead displays two *ways of knowing*. Her point is that you can know something either by believing something that is (already) true, or by intentionally doing something. Both are forms of knowledge, and indeed there can be two ways to know one and the same thing. (See Frost 2014.)[^frost-2014]
