      道德真理可以偶性地被启示的第二种情形是：其事实根据只能通过宗教启示被知道。例如，考虑苦修生活。如休谟所指出的，它似乎没有什么好处。因此，如果有人告诉你它确实有好处，那根本谈不上相信他们。
