      Anscombe also became one of Wittgenstein’s good friends and then, after his death in 1951, the chief translator of his work into English. Ray Monk wrote that Anscombe was “…one of Wittgenstein’s closest friends and one of his most trusted students, an exception to his general dislike of academic women and especially of female philosophers.” (Monk 1991, 498)[^monk-1991].
    step1: |-
      安斯康姆后来成为维特根斯坦的挚友之一，并在 1951 年维特根斯坦去世后，成为其著作英译的主要译者。雷·蒙克写道，安斯康姆是“……维特根斯坦最亲密的朋友之一，也是他最信任的学生之一，是他对学术女性、尤其对女性哲学家的普遍反感的一个例外。”（Monk 1991, 498）[^monk-1991]。
