      This claim is very intuitive, but let us try to say something more in support of it. It seems to be a deep fact about beauty and other aesthetic properties that they are inherently “sociable”; beauty cannot be lonely. Something cannot be barely beautiful; if something is beautiful then it must be in virtue of its nonaesthetic properties. Furthermore, knowing this is a constraint on our judgments about beauty and other aesthetic properties. We cannot just judge that something is beautiful; we must judge that it is beautiful in virtue of its nonaesthetic properties. We usually do so, and not to do so is bizarre. (Even in cases of testimony, we think that the aesthetic properties of a thing hold in virtue of nonaesthetic properties that the aesthetic expert knows.) Of course, we might not have in mind every single nonaesthetic property of the thing, nor know exactly how the nonaesthetic properties produce their aesthetic effects. But we think that certain nonaesthetic properties are *responsible* for the aesthetic properties and that without those nonaesthetic properties, the aesthetic properties would not have been instantiated. Beauty does not float free, and recognizing this is constitutive of aesthetic thought. Our aesthetic thought, therefore, is fundamentally different from our thought about colors, with which it is often compared. Perhaps colors are tied in some intimate way to intrinsic or extrinsic physical properties of the surfaces of things, such as reflectance properties. But color thought does not presuppose this. Someone might even think that colors are bare properties of things. But one cannot think that beauty is bare; it is essential to aesthetic thought to realize that the aesthetic properties of a thing arise from its nonaesthetic properties.
    step1: |-
      这一主张非常符合直觉，但让我们试着多说一些来支持它。美与其他审美属性有一个似乎很深的事实：它们在本质上“合群”；美不能孤独。某物不可能只是单纯地美；如果某物是美的，它必定凭借其非审美属性而美。而且，知道这一点是对我们关于美及其他审美属性之判断的约束。我们不能只判断某物是美的；我们必须判断它凭借其非审美属性而美。我们通常这样做，不这样做就很古怪。（即使在证言的情形中，我们也认为一个事物的审美属性凭借审美专家所知的非审美属性而成立。）当然，我们未必心中装着该事物每一个非审美属性，也未必确切知道非审美属性如何产生其审美效果。但我们认为某些非审美属性对审美属性负有责任，且若没有那些非审美属性，审美属性就不会被实例化。美不自由漂浮；认识到这一点是审美思想的构成要素。因此，我们的审美思想从根本上不同于我们关于颜色的思想，后者常被拿来与审美思想相比。也许颜色以某种亲密方式与物体表面的内在或外在物理属性（如反射率属性）相关联。但颜色思想并不预设这一点。有人甚至可能认为颜色是事物的裸属性。但人不能认为美是裸的；认识到事物的审美属性源自其非审美属性，是审美思想的本质。
