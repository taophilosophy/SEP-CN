      Granting the anomalousness of aesthetic properties, then, we need to explain it. There is much plausibility in Hume and Kant’s suggestion that what explains the anomalousness of the aesthetic is the first feature of judgments of taste—that judgments of taste are essentially subjective, unlike ordinary empirical judgments about physical, sensory, or semantic properties (Hume 1757 [1985: 231–232]; Kant 1790, 5: 213–216, 281–286 [2000: 99–101, 136–142, 162–167])[^hume-1757][^kant-1790]. This is why the two sorts of concepts are not “nomologically made for each other” (as Donald Davidson [1970] says about mental and physical concepts). How can we bring an essentially subjective range of judgments nomologically into line with a range of empirical judgments? The two kinds of judgments answer to quite different sets of constraints. Frank Sibley observed that aesthetic concepts are not positively “condition-governed” (Sibley 1959)[^sibley-1959]. And Mary Mothersill claimed that there are no laws of taste. But neither did much to explain those facts. The appeal to subjectivity explains what Sibley and Mothersill notice and describe. Indeed, Mothersill writes of her “First Thesis” (FT) that there are no genuine principles or laws of taste: “…FT is central to aesthetics, and there is nothing more fundamental from which it could be derived” (Mothersill 1984: 143)[^mothersill-1984]. But it seems that it *can* be derived from the subjectivity of judgments of taste.
    step1: |-
      那么，承认审美属性的反常性之后，我们需要解释它。休谟与康德的建议颇有道理：解释审美反常性的，是趣味判断的第一个特征——趣味判断本质上是主观的，不同于关于物理、感官或语义属性的普通经验判断（Hume 1757 [1985: 231–232]; Kant 1790, 5: 213–216, 281–286 [2000: 99–101, 136–142, 162–167]）[^hume-1757][^kant-1790]。这就是为什么两类概念并非“为彼此而由法则造就”（如唐纳德·戴维森[1970]论心理概念与物理概念时所说）。我们如何能把本质上主观的一类判断，以法则方式与一类经验判断对齐？两类判断服从相当不同的约束。弗兰克·西布利观察到，审美概念并不正面地“受条件支配”（Sibley 1959）[^sibley-1959]。玛丽·马瑟西尔则声称没有趣味规律。但两人都没有多做解释。诉诸主观性，正好解释了西布利与马瑟西尔所注意并描述的事实。事实上，马瑟西尔谈到她的“第一论题”（FT）说：不存在真正的趣味原则或规律；“……FT 是美学的核心，没有比它更根本的东西可以从中推出它”（Mothersill 1984: 143）[^mothersill-1984]。但看来它**可以**从趣味判断的主观性推出。
    step2: |-
      承认了审美属性的反常性，就得解释它。休谟与康德的想法颇有道理：审美的反常，根子在趣味判断的第一个特征——趣味判断本质上是主观的，不同于关于物理、感官或语义属性的寻常经验判断（Hume 1757 [1985: 231–232]；Kant 1790，5: 213–216, 281–286 [2000: 99–101, 136–142, 162–167]）[^hume-1757][^kant-1790]。正因如此，两类概念并非“在法则上为彼此而生”（借唐纳德·戴维森[1970]论心理与物理概念之语）。本质上主观的一类判断，如何能与一类经验判断在法则上对齐？两类判断所服从的约束大不相同。弗兰克·西布利指出，审美概念并不正面地“受条件支配”（Sibley 1959）[^sibley-1959]；玛丽·马瑟西尔则断言趣味无规律。但两人都未多加解释。诉诸主观性，恰好解释了西布利与马瑟西尔所注意并描述的现象。马瑟西尔论其“第一论题”（FT）时写道：不存在真正的趣味原则或规律，“……FT 是美学的枢纽，再没有比它更根本的东西可供推导”（Mothersill 1984: 143）[^mothersill-1984]。但看来它 **可以** 从趣味判断的主观性推出。
