      An idea that plays a large role in Kant’s discussion of the subjective universality of the judgment of taste is that of disinterestedness; and the idea has appealed to many. Kant makes two claims: (a) that pleasure in the beautiful is “disinterested”; and (b) that only pleasure in the beautiful is “disinterested” (Kant 1790, 5: 204–210 [2000: 90–96: 42–50])[^kant-1790]. These claims are important for Kant’s project, for Kant connects disinterestedness with the claim to universal validity of the judgment of taste. Before we go any further, it is important to recognize that the German word “*interesse*” has a special meaning in eighteenth century German, and it should not be confused with similar sounding English words or contemporary German words. For Kant, an *interesse* means a kind of pleasure that is not connected with desire; it is neither grounded in desire, nor does it produce it.
    step1: |-
      在康德关于趣味判断之主观普遍性的讨论中，无利害性这一观念起了很大作用；这一观念也吸引了很多人。康德提出两个主张：（a）对美的愉悦是“无利害的”；（b）只有对美的愉悦是“无利害的”（Kant 1790, 5: 204–210 [2000: 90–96: 42–50]）[^kant-1790]。这些主张对康德的计划很重要，因为康德把无利害性与趣味判断的普遍有效性要求联系起来。在进一步讨论之前，重要的是认识到：德语词“interesse”在十八世纪德语中有特殊含义，不应与发音相似的英语词或当代德语词相混淆。对康德来说，interesse 意指一种不与欲望相连的愉悦；它既不基于欲望，也不产生欲望。
    step2: |-
      在康德关于趣味判断之主观普遍性的讨论中，“无利害性”是个吃重的观念，也颇得后人青睐。康德有两个主张：（a）对美的愉悦是“无利害的”；（b）唯有对美的愉悦是“无利害的”（Kant 1790，5: 204–210 [2000: 90–96, 42–50]）[^kant-1790]。这两条对康德的整个计划至为要紧，因为他把无利害性与趣味判断的普遍有效性要求挂钩。动身之前，须先辨明：德语词“interesse”在十八世纪德语中有特殊含义，不可与发音相近的英语词或现代德语词混为一谈。对康德来说，interesse 意指一种不与欲望相连的愉悦；它既不基于欲望，也不产生欲望。（译注：原文如此。按《判断力批判》，Interesse 恰恰指与对象实存相联、因而不离欲望的愉悦，与“无利害”相对；此处疑为原文笔误，译文照录。）
