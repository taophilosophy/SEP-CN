      The most common contemporary notion of an aesthetic judgment would take judgments of beauty and ugliness as paradigms—what we called “judgments of taste” in part 1. And it excludes judgments about physical properties, such as shape and size, and judgments about sensory properties, such as colors and sounds. However, in addition to judgments of beauty and ugliness, the contemporary notion of an aesthetic judgment is typically used to characterize a class of judgments that also includes judgments of daintiness, dumpiness, delicacy and elegance. In this respect, the contemporary notion seems to be broader than Kant’s, since he focused just on judgments of beauty and ugliness. However, there is also a respect in which the contemporary notion seems to be narrower than Kant’s notion. For Kant used the notion to include both judgments of beauty (or of taste) as well as judgments of the *agreeable*—for instance, the judgment that Canary-wine is nice (Kant 1790, 5: 203–204, 214 [2000: 89–90 and 99])[^kant-1790]. But the modern notion, unlike Kant’s, usually *excludes* judgments of the agreeable. Moreover, the contemporary notion usually excludes judgments about pictorial and semantic content of a work of art. For example, the judgment that a painting represents a flower might be “relevant” to an aesthetic judgment about it, but it is not itself an aesthetic judgment.
    step1: |-
      当代最常见的审美判断概念会以美与丑的判断为范式——即我们在第一部分所称的“趣味判断”。它排除关于形状、大小等物理属性的判断，以及关于颜色、声音等感官属性的判断。然而，除美与丑的判断之外，当代审美判断概念通常还用来刻画一类判断，其中包括关于精致、邋遢、细腻与优雅的判断。就此而言，当代概念似乎比康德的更宽，因为康德只聚焦于美与丑的判断。然而，也有一个方面，当代概念似乎比康德的概念更窄。因为康德用这一概念既包括美（或趣味）的判断，也包括适意的判断——例如加那利葡萄酒好喝的判断（Kant 1790, 5: 203–204, 214 [2000: 89–90 and 99]）[^kant-1790]。但现代概念与康德不同，通常排除适意判断。而且，当代概念通常排除关于艺术品图像内容与语义内容的判断。例如，“这幅画描绘了一朵花”这一判断可能与关于它的审美判断“相关”，但它本身不是审美判断。
    step2: |-
      当代最通行的审美判断概念，以美与丑的判断为范式——即第一部分所称的“趣味判断”，而把形状、大小等物理属性的判断与颜色、声音等感官属性的判断排除在外。不过，除美与丑的判断外，这一概念通常还涵盖一类判断，如关于精致、邋遢、细腻、优雅的判断。就此而言，当代概念似乎宽于康德，因为他只讲美与丑的判断。但换个方面看，当代概念又似乎窄于康德：康德的用法兼包美（趣味）的判断与 **适意** 的判断——例如“加那利葡萄酒好喝”（Kant 1790，5: 203–204, 214 [2000: 89–90, 99]）[^kant-1790]；而现代概念通常恰恰 **排除** 适意判断。此外，当代概念通常也排除关于作品图像内容与语义内容的判断。例如，“这幅画画的是一朵花”或许与关于它的审美判断“相关”，其本身却并非审美判断。
