      As noted in Section 2.4, Beardsley claimed, heroically, that aesthetic experience is distinguished by its unity, intensity and complexity. Dickie argued, in reply, that such characteristics were either not plausibly necessary conditions of aesthetic experience, or else that Beardsley’s description of them was inadequate. Part of Dickie’s attack was beside the point, since he confused aesthetic experiences with the experiences of works of art; the fact that some experiences of works of art are not as Beardsley describes is irrelevant. But it cannot be denied that Dickie was right that even if the problems with characterizing the three features were resolved, it would still not be plausible that the three Beardsleyian features are necessary (or sufficient) conditions of aesthetic experience. Nevertheless, all that would show would be that *Beardsley’s* account of the aesthetic is inadequate. That Beardsley’s extraordinary and heroic trinitarian doctrine cannot be maintained does not mean that the notion of the aesthetic should be abandoned. That would be a flawed induction from a single instance.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Sibley claimed that the discernment of aesthetic properties requires a special sensitivity, whereas the discernment of nonaesthetic properties could be achieved by anyone with normal eyes and ears. Furthermore, Sibley claimed that it was distinctive of aesthetic terms or concepts that they were not “condition-governed”, in the sense that they had no nonaesthetic positive criteria for their application. He thought of the faculty of taste as special mental faculty, possessed by people with a distinctive sensitivity. This account of the aesthetic was inadvisable, since it allowed critics like Cohen and Kivy to argue that ascribing many aesthetic properties did not in fact require a special faculty, since anyone can distinguish a graceful line from an ungraceful line. Moreover, some aesthetic ascriptions, such as elegance, do seem to be nonaesthetically “condition-governed”, in Sibley’s sense. Nevertheless—once again—that *Sibley’s* positive account of the aesthetic is implausible should not lead us to despair about the aesthetic. On the other hand, a pessimistic induction, now with two instances under its belt, is perhaps looking a little less unhealthy—especially given two such distinguished exponents.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Despite this, Sibley was surely minimally right to think that ascribing aesthetic properties to a thing requires more than merely knowing its nonaesthetic properties. Whether or not the extra something is distinctively difficult, erudite, sophisticated or non-condition-governed, it is something over and above nonaesthetic understanding. So perhaps we should keep on trying to articulate the notion of the aesthetic, or at least a useful notion of the aesthetic.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
