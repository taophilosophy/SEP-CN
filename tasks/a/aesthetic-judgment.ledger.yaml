      This subjectivist thesis would be over-strict if it were interpreted in an “atomistic” fashion, so that some subjective response corresponds to every judgment of taste, and vice versa. Sometimes one makes a judgment of taste on inductive grounds or on the basis of authority. But these cases indirectly rely on judgements made on the basis of subjective responses. A more holistic picture of the relation between response and judgment would preserve the spirit of the subjectivist doctrine while fitting our actual lives more accurately. The subjectivist doctrine needs to be refined in order to deal with the cases of induction and authority. But it must not be abandoned. The doctrine is basically right.
    step1: |-
      这一主观主义论题若按“原子论”方式解释，就会过于严格：仿佛每一个趣味判断都对应某种主观反应，反之亦然。有时人们基于归纳理由或权威作出趣味判断。但这些情形间接依赖于基于主观反应所作的判断。关于反应与判断之关系的一种更整体主义的图景，会保留主观主义学说的精神，同时更准确地契合我们的实际生活。主观主义学说需要加以精炼，以处理归纳与权威的情形。但绝不能抛弃它。这一学说基本上是正确的。
    step2: |-
      这一主观主义论题若作“原子论”式的理解，便过于严格——仿佛每个趣味判断都一一对应某种主观反应，反之亦然。有时人们凭归纳理由、或依据权威作出趣味判断；但这类情形仍间接依赖基于主观反应所作的判断。若对反应与判断的关系采取更整体主义的看法，既能保住主观主义学说的精神，又更贴合我们的实际生活。主观主义学说需要精炼，以容纳归纳与权威的情形，却不可抛弃：这一学说基本正确。
