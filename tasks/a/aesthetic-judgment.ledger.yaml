    source: |-
      Beauty is an important part of our lives. Ugliness too. It is no surprise then that philosophers since antiquity have been interested in our experiences of and judgments about beauty and ugliness. They have tried to understand the nature of these experiences and judgments, and they have also wanted to know whether these experiences and judgments were legitimate. Both these projects took a sharpened form in the twentieth century, when this part of our lives came under a sustained attack in both European and North American intellectual circles. Much of the discourse about beauty since the eighteenth century had deployed a notion of the “aesthetic”, and so that notion in particular came in for criticism. This disdain for the aesthetic may have roots in a broader cultural Puritanism, which fears the connection between the aesthetic and pleasure. At one time, from the 1960s to the 1990s, even to suggest that an artwork might be good because it is pleasurable, as opposed to cognitively, morally or politically beneficial, was to court derision. (This is less true now.) The twentieth century was not kind to the notions of beauty or the aesthetic. Nevertheless, there were always some thinkers—philosophers, as well as others in the study of particular arts—who persisted in thinking seriously about beauty and the aesthetic. In the first part of this essay, we will look at the particularly rich account of judgments of beauty given to us by Immanuel Kant. The notion of a “judgment of taste” is central to Kant’s account and also to virtually everyone working in traditional aesthetics; so we begin by examining Kant’s characterization of the judgment of taste. In the second part, we look at the issues that twentieth century thinkers raised. In the third part, we consider disinterestedness, which is taken by Kant to be part of the judgment of taste. We end, in the fourth part, by drawing on Kant’s account of the judgment of taste to consider whether the notion of the aesthetic is viable.
    step1: |-
      美是我们生活的重要部分。丑亦然。因此，自古以来哲学家就对美与丑的经验与判断感兴趣，这并不奇怪。他们试图理解这些经验与判断的性质，也想知道这些经验与判断是否正当。这两项事业在二十世纪都采取了更尖锐的形态，因为此时我们生活的这一部分在欧洲与北美的知识圈中受到持续攻击。自十八世纪以来关于美的大量论述都动用了“审美”（the aesthetic）这一概念，于是这一概念尤其受到批评。对审美的这种轻蔑，根源也许在于一种更广泛的文化清教主义，它畏惧审美与快乐之间的联系。曾有一个时期，从1960年代到1990年代，甚至只要提出一件艺术品可能因其令人愉悦——而非因其在认知、道德或政治上有益——而好，就会招致嘲弄。（如今这已不那么真了。）二十世纪对美或审美的概念并不友善。然而，总有一些思想家——哲学家，以及研究特定艺术的其他人士——坚持认真思考美与审美。本文第一部分，我们将考察伊曼努尔·康德给予我们的关于美的判断的特别丰富的论述。“趣味判断”这一概念是康德论述的核心，也是传统美学中几乎所有工作者的核心；因此我们首先考察康德对趣味判断的刻画。第二部分，我们考察二十世纪思想家提出的问题。第三部分，我们考虑无利害性，康德认为它是趣味判断的一部分。最后在第四部分，我们借助康德对趣味判断的论述，考虑审美这一概念是否可行。
