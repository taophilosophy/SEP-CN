      A relatively uncontroversial part of the less ambitious claim is that pleasure in the beautiful is not *grounded* in the satisfaction of desire. It is plausible, surely, that when we take pleasure in something that we find beautiful, this is not pleasure in the thought that we have got something that we desire. Kant wants pleasure in the beautiful to be open to all (so there should be no “aesthetic luck”), and if desires vary from person to person, it seems that we could not *require* that pleasure from everyone, as the idea of universal validity requires. The claim to universal validity would be lost if pleasure in beauty were not disinterested in the sense of not being based on desire. This part of the idea of disinterestedness has much plausibility.
    step1: |-
      较不宏大主张中相对无争议的部分是：对美的愉悦并不基于欲望的满足。当我们从觉得美的东西中获得愉悦时，这种愉悦并不是想到我们得到了想要的东西时的愉悦——这无疑是可信的。康德希望对美的愉悦向所有人开放（因此不应有“审美运气”），而如果欲望因人而异，看来我们就不能像普遍有效性观念所要求的那样，从每个人那里要求这种愉悦。如果对美的愉悦不是无利害的（即不基于欲望），普遍有效性要求就会落空。无利害性观念的这一部分很有道理。
