      Thus far we have been making positive claims about features of aesthetic judgments. Let us now consider the claim that there are no interesting nonaesthetic-to-aesthetic laws or principles, and the claim that an aesthetic/nonaesthetic dependence relation can obtain, even though there are no such interesting laws or principles. Here “interesting” laws or principles means generalizations to the effect that anything of such and such a nonaesthetic kind is of such and such aesthetic kind, *and* these generalizations can be used to predict aesthetic properties on the basis of knowledge of nonaesthetic properties. In this sense, many find it plausible that there are no laws of taste and aesthetic properties are anomalous.
    step1: |-
      到目前为止，我们一直在对审美判断的特征作肯定性主张。现在让我们考虑这一主张：不存在有意思的从非审美到审美的规律或原则；以及这一主张：尽管没有这类有意思的规律或原则，审美/非审美的依赖关系仍然可以成立。这里“有意思的”规律或原则，指的是这样的概括：凡属某某非审美种类的东西都属于某某审美种类；并且这些概括可用来根据非审美属性的知识预测审美属性。在这个意义上，许多人觉得可信：没有趣味规律，审美属性是反常的（anomalous）。
    step2: |-
      至此，我们谈的都是审美判断具有哪些特征。现在来看两个主张：一是不存在有意义的非审美→审美规律或原则；二是即便没有这类规律或原则，审美/非审美的依赖关系仍可成立。所谓“有意义的”规律或原则，指这样的概括——凡某某非审美类型之物，即属某某审美类型——且可据非审美属性的知识预测审美属性。在这个意义上，许多人认为：趣味无规律，审美属性是反常的（anomalous）。
