      The normativity of aesthetic judgments *can* be recast in terms of a particular conception of aesthetic truth. For some purposes, it is useful to do this. It might be thought that deploying the idea of *aesthetic truth* commits us to the existence of an aesthetic reality. But this springs from the assumption that a strong correspondence conception of truth is all there ever is to truth in any area where we might employ the notion. In many areas—scientific and psychological thought, for example—a strong correspondence conception of truth is likely to be in question. However, the conception of truth applicable in aesthetics might be one according to which truth only implies the sort of normativity described above, according to which there are correct and incorrect judgments of taste, or at least that some judgments are better than others.
    step1: |-
      审美判断的规范性可以用一种特定的审美真理概念来重述。对某些目的而言，这样做有用。人们也许以为，动用“审美真理”观念就承诺了审美实在的存在。但这种想法源于一个假定：在任何可能使用真理概念的领域，真理都只是强符合论的真理观。在许多领域——例如科学思想与心理学思想——强符合论的真理观恐怕都成问题。然而，适用于美学的真理概念也许是这样的：真理只蕴含上述规范性，即趣味判断有正确与错误之分，或至少某些判断比另一些更好。
