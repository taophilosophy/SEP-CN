      As described, normativity attaches to *judgments of taste* themselves. What does this imply for *pleasure* in beauty? Since judgments of taste are based on responses of pleasure, it would make little sense if our judgments were more or less appropriate but our responses were not. The normative claim of our judgments of taste must derive from the fact that we think that some *responses* are better or more appropriate to their object than others. Responses only license judgments which can be more or less appropriate because responses themselves can be more or less appropriate. If I get pleasure from drinking Canary-wine and you do not, neither of us will think of the other as being *mistaken*. But if you don’t get pleasure from Shakespeare’s *Sonnets*, I will think of you as being in error—not just your *judgment*, but your *liking*. I think that I am *right* to have my *response*, and that your *response* is *defective*. Someone who thinks that there is, in Hume’s words, “an equality of genius” between some inferior composer, on the one hand, and J. S. Bach, on the other, has a defective *sensibility* (Hume 1757 [1985: 230])[^hume-1757]. Roger Scruton puts the point well when he says:
    step1: |-
      如前所述，规范性附着于趣味判断本身。这对审美中的愉悦意味着什么？既然趣味判断基于愉悦反应，那么若我们的判断有恰当与否之分、反应却没有，就说不通了。趣味判断的规范性主张必来自这一事实：我们认为某些反应比另一些更好、或更适合其对象。反应之所以能授权那些有恰当与否之分的判断，正因为反应本身有恰当与否之分。我从喝加那利葡萄酒中得到愉悦而你没有，我们都不会认为对方弄错了。但如果你从莎士比亚的《十四行诗》中得不到愉悦，我就会认为你错了——不只是你的判断，还有你的喜爱。我认为自己的反应是对的，而你的反应有缺陷。若有人认为某个劣等作曲家与J. S. 巴赫之间，用休谟的话说“天才相等”，那他的感受力就有缺陷（Hume 1757 [1985: 230]）[^hume-1757]。罗杰·斯克鲁顿说得好：
    step2: |-
      如前所述，规范性附着于趣味判断本身。那么，它对审美中的愉悦意味着什么？既然趣味判断基于愉悦反应，若判断有恰当与否、反应却无，便说不通。趣味判断的规范性主张，必源于我们认为某些反应比另一些更佳、或更贴合其对象。反应本身有恰当与否之别，才使判断得以有恰当与否之别。我喝加那利葡萄酒得乐，你不得乐，彼此都不觉得对方弄错了；可你若读莎士比亚《十四行诗》而无动于衷，我便认为你错了——错的不只是判断，还有你的喜好。我认为自己的反应是对的，你的反应有缺陷。谁若以为某个二流作曲家与J. S. 巴赫之间，用休谟的话说“天才相等”，那他的感受力便出了毛病（Hume 1757 [1985: 230]）[^hume-1757]。罗杰·斯克鲁顿把这一点说得很透：
