      Beyond a certain point, this issue cannot be pursued independently of metaphysical issues about realism, for the metaphysics we favor is bound to affect our view of the nature of the pleasure we take in beauty. In particular, we need to know whether or not pleasure in beauty represents properties of beauty and ugliness that things possess. If not, does it involve the cognitive faculties that we deploy in understanding the world, as Kant thought? Or is it not a matter of the cognitive faculties, but a matter of sentimental reactions, which are schooled in various ways, as Hume and others thought? These are very hard questions. But there are some things we can say about the pleasure involved in finding something beautiful without raising the temperature too high.
    step1: |-
      超过某一点，这一问题就无法脱离关于实在论的形而上学问题来探讨，因为我们所倾向的形而上学必然会影响到我们对从美中获得的愉悦之性质的看法。尤其是，我们需要知道，对美的愉悦是否表象事物所具有的美与丑的属性。如果不是，它是否涉及我们理解世界时所运用的认识能力，如康德所想？或者，它无关认识能力，而关乎以各种方式受到训练的情感反应，如休谟等人所想？这些都是很难的问题。但关于发现某物为美所涉及的愉悦，有些话我们可以说，而不至于把温度升得太高。
    step2: |-
      越过某个限度，这个问题便无法脱离实在论的形而上学来讨论：我们所取的形而上学立场，必然影响我们对审美愉悦之性质的看法。关键尤在于：对美的愉悦是否表象事物本身所具有的美与丑的属性？若不表象，那么它是否涉及我们理解世界所用的认识能力（如康德所想）？抑或它无关认识能力，只关乎以各种方式受训而成的情感反应（如休谟等人所想）？这些都是极难的问题。不过，关于发现某物为美时所涉及的愉悦，我们仍可平实地谈上几句，不必把争论的温度升得太高。
