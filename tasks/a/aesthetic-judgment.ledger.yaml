      A notable exception to this consensus is Monroe Beardsley, who claims—heroically and extraordinarily—that there are exactly three aesthetic principles: things are aesthetically excellent either by being unified or intense or complex (Beardsley 1958: chapter XI)[^beardsley-1958]. However, Beardsley’s “trinitarian” position faces difficulties similar to those faced by moral philosophers who appeal to “thick” concepts. If Beardsley insists on a lawlike connection between his three thick substantive aesthetic properties (unity, intensity and complexity) and aesthetic value, he can only do so at the cost of conceding anomalousness between the three thick substantive aesthetic properties and nonaesthetic properties. There are three layers and one can hold onto laws between the top and middle layers only by losing laws between the middle and bottom layers. Maybe intensity is always aesthetically good, but there are no laws about what makes things intense.
    step1: |-
      这一共识的一个显著例外是门罗·比尔兹利，他勇敢而出奇地主张：恰好有三条审美原则——事物之所以在审美上卓越，或因其统一，或因其强烈，或因其复杂（Beardsley 1958: 第十一章）[^beardsley-1958]。然而，比尔兹利的“三位一体”立场面临与诉诸“厚”概念的道德哲学家相似的困难。如果比尔兹利坚持他的三个厚实质审美属性（统一、强烈、复杂）与审美价值之间的规律性联系，他只能以承认三个厚实质审美属性与非审美属性之间的反常性为代价。有三个层次，人只有放弃中间层与底层之间的规律，才能保住顶层与中间层之间的规律。也许强烈总是在审美上好的，但关于什么使事物强烈，却没有规律。
