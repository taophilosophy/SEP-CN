      这样一种规范性的真理概念，比仅仅作为“语义赞同”装置的真理概念更强；也就是说，规范性真理不止于单薄的“去引号”真理——按后者，真理概念只是语义上升的装置。于是我们可以说：“x是美的”为真，当且仅当x是美的。甚至关于可口、关于加那利葡萄酒是否好喝的判断，也能触及一种无关紧要的去引号真理概念。我们可以说“加那利葡萄酒好喝”为真，当且仅当加那利葡萄酒好喝，而不至于把温度升高。然而，关于加那利葡萄酒是否好喝的判断并不渴求规范性的真理概念。加那利葡萄酒是否真的好喝，这个问题没有对错答案。因此，无论“它好喝”还是“它不好喝”的判断，都不能说若它为真则其反面为假。但对我们的一些审美判断，我们正是这样说的。
