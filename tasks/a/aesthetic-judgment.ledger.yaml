      Such a normative conception of truth is stronger than a notion of truth which is merely a device for “semantic assent”; that is, normative truth is more than thin “disquotational” truth, according to which the notion of truth is merely a device for semantic ascent. Thus we can say “x is beautiful’ is true if and only if x is beautiful. Even judgments of the agreeable, about the niceness of Canary-wine, can have access to an inconsequential disquotational conception of truth. We can say “Canary-wine is nice’ is true if and only if Canary-wine is nice” without raising the temperature. However, judgments about the niceness of Canary-wine do not aspire to a normative conception of truth. There are no right and wrong answers to the question of whether Canary-wine really is nice. And so, of neither the judgment that it is nice nor the judgment that it is not nice can it be said that if it is true then its opposite is false. But this is what we do say of some aesthetic judgments.
