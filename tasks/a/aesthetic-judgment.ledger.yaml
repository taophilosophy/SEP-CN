      这一主张十分合乎直觉，但还可以再补充些理由。美与其他审美属性似乎有一个深层的事实：它们天生“合群”，美不能孤单。没有赤裸的美：某物若是美的，必是凭借其非审美属性而美。而且，明白这一点，本身就是对我们审美判断的约束：我们不能只判断某物美，必须判断它凭借哪些非审美属性而美；我们通常正是如此，不如此反倒古怪。（即便是凭他人证言下判断，我们也认为事物的审美属性凭借审美行家所知的非审美属性而成立。）当然，我们未必把事物的每一项非审美属性都放在心上，也未必确知非审美属性如何产生审美效果；但我们认定某些非审美属性对审美属性 **负有责任**，若没有它们，审美属性便无从实例化。美不自由漂浮，认清这一点是审美思想的构成部分。因此，我们的审美思想与常被拿来相比的颜色思想有根本差异：颜色或许以某种亲密方式系于物体表面的内在或外在物理属性（如反射率），但颜色思想并不预设这一点，甚至有人以为颜色是事物的裸属性；然而人不能以为美是裸的——审美思想的本质，正在于认识到事物的审美属性源自其非审美属性。
