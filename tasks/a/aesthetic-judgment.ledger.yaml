      But how *can* some feelings be better or worse than others? To answer this question, we need to ask: how far does the normativity of judgments of taste inhere in the feeling itself? The realist about beauty will say that the feeling has normativity built into it in virtue of its representational content; the feelings themselves can be more or less veridical. Pleasure in beauty, for example, has as its object the property of beauty; we *find* the beauty pleasurable. A Humean sentimentalist will probably say that normativity is something we somehow construct or foist upon our pleasures and displeasures, which have no such content. And Kant has his own account, which appeals to cognitive states that are not beliefs. The issue is controversial. However, what we can say for sure is that it is definitive of pleasure in beauty that it licenses judgments that make claim to correctness. Beyond this, there will be theoretical divergence.
    step1: |-
      但某些感受怎么可能比另一些更好或更坏？要回答这个问题，我们需要问：趣味判断的规范性在多大程度上内在于感受本身？关于美的实在论者会说，感受凭借其表象内容而内建了规范性；感受本身可以有或多或少的真实性。例如，对美的愉悦以美的属性为对象；我们觉得美是令人愉悦的。休谟式情感主义者大概会说，规范性是我们以某种方式建构或强加于我们的愉悦与不悦之上的东西，而这些感受本身没有此类内容。康德有他自己的说明，诉诸并非信念的认知状态。这个问题有争议。然而我们可以确定地说：对美的愉悦的决定性特征在于，它授权那些要求正确性的判断。在此之外，将出现理论分歧。
    step2: |-
      可是，某些感受如何能比另一些更好或更坏？要回答这个问题，须先问：趣味判断的规范性有多少内在于感受本身？美的实在论者会说，感受凭借其表象内容而自带规范性——感受本身可以有真实与否之别。例如，对美的愉悦以美的属性为对象，我们“觉得”美令人愉悦。休谟式情感主义者多半会说，规范性是我们以某种方式建构、或强加于自身愉悦与不悦之上的东西，这些感受并没有那样的内容。康德也自有说明，诉诸并非信念的认知状态。此问题争议未决。但能确定的是：对美的愉悦之决定性特征，正在于它授权那些要求正确性的判断。除此以外，理论分歧便开始了。
