      What is a judgment of taste? Kant isolated two fundamental necessary conditions for a judgment to be a judgment of taste—*subjectivity* and *universality* (Kant 1790/2000)[^kant-1790]. Other conditions may also contribute to what it is to be a judgment of taste, but they are consequential on, or predicated on, the two fundamental conditions. In this respect Kant followed the lead of Hume and other writers in the British sentimentalist tradition (Hume 1757/1985)[^hume-1757].
    step1: |-
      什么是趣味判断？康德分离出使一个判断成为趣味判断的两个根本必要条件——主观性与普遍性（Kant 1790/2000）[^kant-1790]。其他条件也可能对趣味判断之所是有所贡献，但它们是后果性的，或以这两个根本条件为前提。在这方面，康德追随休谟与英国情感主义传统其他作者的先导（Hume 1757/1985）[^hume-1757]。
    step2: |-
      什么是趣味判断？康德提出，一个判断要成为趣味判断，须满足两个根本的必要条件——主观性与普遍性（Kant 1790/2000）[^kant-1790]。其他条件或许也参与构成趣味判断，但都从属于这两个根本条件，或以它们为前提。在这一点上，康德追随休谟及英国情感主义传统诸作者的思路（Hume 1757/1985）[^hume-1757]。
