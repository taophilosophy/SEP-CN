      ### 4.4 Beauty and Sublimity
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      One notion that is hard to place among other aesthetic notions is that of sublimity. There is a long and venerable tradition of thinking that beauty and sublimity share equal status as fundamental aesthetic categories. Sublimity comes in different varieties. Kant distinguishes “mathematically” and “dynamically” sublime, roughly, corresponding to our sense of the enormity and power of things. The fundamental question about beauty and sublimity is whether they exclude each other. According to the long and venerable tradition, if something is sublime then it is not beautiful and vice versa. Many have conceived of sublimity such that it excludes beauty. But this is questionable.
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      If we conceive of beauty narrowly, where it merely means a certain elegance and prettiness (as Levinson does in Levinson 2012)[^levinson-2012], then that narrow concept of beauty would be a substantive aesthetic property. *That* notion of beauty may exclude sublimity. However, it is not clear that there is reason to restrict beauty in this way. If, on the contrary, beauty (or at least *a* concept of beauty) is a generic over-arching aesthetic value, then one suggestion would be that sublimity should be understood as a *kind* of beauty. In that case, it would turn out that it is *sublimity* that is a substantive aesthetic concept, not beauty. On that view, beauty and sublimity are not opposed to each other. Instead sublimity is a kind of magnificent beauty or a spectacular or extraordinary way of being beautiful.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      Edmund Burke links sublimity with pain as well as pleasure, perhaps drawing on Aristotle’s idea of “catharsis” (Burke 1757)[^burke-1757]. The idea seems to be that judgments of sublimity are grounded on both pleasure and pain, whereas judgments of beauty are grounded only on pleasure. While this may fit the aesthetic experience of wind and rain in a storm at sea or up a mountain, it does not fit the sublimity of the stars in the sky and sublime delicacy of a spider’s web, where there is no exciting terror. So the pain account is not generally true of the sublime.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Richard Wagner claimed that there was musical sublimity in Beethoven’s Ninth Symphony, and that was its great innovation, to take us beyond the merely musically-beautiful to the sublime (Wagner 1870, contrast Hanslick 1950, 1986)[^hanslick-1950][^wagner-1870]. Many musicologists follow Wagner, (such as Richard Taruskin [1989, 2019]). But on that view, if sublimity is associated with danger and extremity, it is not clear that we have a plausible story of why people seek out the sublime in music. Is it a kind of thrill-seeking, like fairground rides or rock climbing, where people believe themselves to be in danger or at least cannot help imagining that they are? Is their experience of Beethoven’s Ninth mixed with pain in this way? This seems unlikely. Pain and fear have natural expressions on the human face, but the human faces of audiences listening to Beethoven’s Ninth are not noticeably different from the human faces listening to Mozart, Chopin or Tchaikovsky. Their faces are unlike those of those on fairground rides or rock climbers who have to make difficult moves. Furthermore, the audience of the Ninth are not motivated to flee from the concert hall. Do they have to be strapped into their seats to prevent escape as on a fairground ride (contra McClary 1991)[^mcclary-1991]? By contrast, on the substantive view of the sublime as a kind of beauty, there is a distinctive kind of pleasure that characterizes the experience of the sublime, on which judgments of the sublime are based. It is an intense pleasure, to be sure. But intensity does not entail a mixture with pain.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Sublimity in a representational art, such as painting, is a different matter. John Martin’s wonderful painting *Apocalypse*, for example, does evoke a kind of terror, at least imagined terror. We might plausibly say that this sublimity is not a kind of beauty, even though it is certainly a kind of *artistic* excellence. What this suggests is that we should avoid a unitary theory of the sublime. Some sublimity is a way of being beautiful, and some is not.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      The main downside of this view is that it breaks with one major strand of the intellectual tradition in thinking about the sublime in opposition to beauty. But it is hard to know much to weigh that if we are seeking a useful concept for organizing our experiences of art and nature.
    step1: TBD
    step2: TBD
