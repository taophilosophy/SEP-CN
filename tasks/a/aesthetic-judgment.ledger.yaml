  - id: 12
    kind: body
    source: |-
      > … … if [someone] pronounces that something is beautiful, then he expects the very same satisfaction of others: he judges not merely for himself, but for everyone, and speaks of beauty as if it were a property of things. Hence he says that the *thing* is beautiful, and does not count on the agreement of others with his judgment of satisfaction because he has frequently found them to the agreeable with his own, but rather *demands* it from them. He rebukes them if they judge otherwise, and denies that they have taste, for he nevertheless requires that they ought to have it; and to this extent one cannot say, “Everyone has his special taste”. This would be as much as to say that there is no taste at all, i.e. no aesthetic judgment that could make a rightful claim to the assent of everyone. (Kant 1790, 5: 212–213 [2000: 98]; see also 2000: 164–166–139)[^kant-1790]
    step1: |-
      ……如果[某人]断言某物为美，他就期待他人也抱有完全相同的满足：他不只为自己、而且为一切人作判断，并把美说得仿佛是事物的属性。因此他说这个事物是美的，并且不指望他人同意他的满足判断是因为他常常发现他人与自己一致，而是要求他人同意。若他人作别的判断，他就责备他们，否认他们有品味，因为他仍然要求他们应当有品味；就此而言，不能说“人人各有其趣味”。这无异于说根本没有趣味，即没有任何审美判断能够正当地要求一切人的赞同。（Kant 1790, 5: 212–213 [2000: 98]；亦见 2000: 164–166–139）[^kant-1790]
    step2: |-
      ……若[某人]断言某物为美，他便期待他人也感到同样的满足：他不仅在为自己、更是在为所有人下判断，言谈之间把美当作事物的一种属性。所以他说这事物是美的；他并不因屡屡发现他人与自己同感，才指望别人赞同自己的满足判断，而是径直要求他们赞同。旁人若判断不同，他便加以责备，斥其没有品味——因为他仍坚持他们理当有品味。就此而言，不能说“人人各有各的趣味”；那无异于说根本没有趣味，即没有任何审美判断能正当地要求人人赞同。（Kant 1790，5: 212–213 [2000: 98]；亦见 2000: 164–166–139）[^kant-1790]
  - id: 13
    kind: body
    source: |-
      Kant’s idea is that in a judgment of taste, we demand or require agreement from other human beings in a way we do not in our judgments about the niceness of Canary-wine, which is just a question of individual preference. In many cases, in matters of taste and beauty, we think that others *ought* to share our judgment, and we blame them if they don’t. This is because the judgment of taste has this aspiration to universal validity that it seems “*as if* [beauty] were a property of things”.
    step1: |-
      康德的看法是：在趣味判断中，我们要求他人同意，其方式不同于我们对加那利葡萄酒之可口所作的判断——后者只是个人偏好的问题。在许多情形下，在趣味与美的事情上，我们认为他人应当分享我们的判断；若他们不分享，我们就责备他们。这是因为趣味判断有这种对普遍有效性的渴求，以至于它显得“仿佛”美是事物的属性。
    step2: |-
      康德的看法是：在趣味判断中，我们要求他人赞同，这与评判加那利葡萄酒是否可口大不相同——后者纯属个人偏好。在趣味与美的事情上，我们往往认为别人也应当同意我们的判断，不赞同便加以责备。缘何如此？因为趣味判断渴求普遍有效性，仿佛美真是事物自身的属性。
  - id: 14
