      However, the austere characterization attempts to catch a more basic idea of normativity—one that might serve as the target of rival explanations. In order to explain how subjectively universal judgments are possible, Kant has a complicated story about the harmonious interplay of the cognitive faculties—imagination and understanding—which he thinks constitutes pleasure in beauty (Kant 1790, 5: 219 [2000: 104])[^kant-1790]. This “deep” account of pleasure in beauty is highly controversial and not particularly plausible (see Budd 2001)[^budd-2001]. But we can see why Kant gives it. For Kant, the normative claim of the judgment of taste has its roots in the more general workings of our cognitive faculties, which Kant thinks we can assume others share. Thus, we have the beginnings of an explanation of how such a pleasure can ground a judgment that makes a universal claim. However, Kant does not have much to say about the nature of the “universality” or normativity that is being explained by such a speculative account of pleasure in beauty. It is no accident that Kant phrases the obligation in interpersonal terms, considering where he is going. And it is no great fault on his part that he does so. But for our purposes, we need to separate what is being explained from its explanation. For if Kant’s explanation does not work, we want to be left with a characterization of the normativity he was trying to explain. We need to separate Kant’s problem from his solution, so that the former is left if the latter fails. There may be alternative solutions to his problem.
    step1: |-
      然而，严格刻画试图抓住一种更基本的规范性观念——它可以充当各种竞争性解释的目标。为了解释主观上普遍的判断如何可能，康德有一套复杂的故事，讲认识能力——想象力与知性——的和谐相互作用，他认为这构成对美的愉悦（Kant 1790, 5: 219 [2000: 104]）[^kant-1790]。这种关于审美愉悦的“深层”说明极具争议，也并不特别可信（见 Budd 2001）[^budd-2001]。但我们能看出康德为何给出它。对康德来说，趣味判断的规范性主张根源于我们认识能力更一般的运作，而他以为可以假定他人也分享这些能力。于是，我们便有了说明的开端：这样一种愉悦如何能够为一个提出普遍性主张的判断奠基。然而，对于这种思辨性的审美愉悦说明所要解释的“普遍性”或规范性之性质，康德并没有多说。考虑到他的走向，康德用人与人之间的措辞来表述这一义务，绝非偶然；他这样做也算不上大错。但就我们的目的而言，我们需要把被解释的东西与解释分开。因为如果康德的解释不成立，我们希望留下的是他所要解释的规范性之刻画。我们需要把康德的问题与他的解答分开，以便在解答失败时仍保留问题。对他的问题可能存在别的解答。
