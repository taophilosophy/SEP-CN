      Some so-called “experimental philosophers” have questioned the thesis that judgments of taste aspire to correctness on the basis of empirical evidence about those who make judgments of taste (Cova & Pain 2012)[^cova-2012]. But it is not clear that the empirical evidence cited supports that skeptical thesis. For the evidence is just that that the experimental subjects tick boxes that ask directly about correctness in judgment. But in psychological experiments there is a requirement of opacity of the point of an experiment to the experimental subjects (Hughes 2016)[^hughes-2016]. Furthermore, people often wax philosophical in a way that is out of step with their actual conceptual practice. For example, some beginners in introductory moral philosophy classes inconsistently claim that all moral views are equally correct, and that it is very bad to think otherwise. People who think in a certain way may be defective in self-knowledge, just as those who take part in social rituals may not be able to describe those rituals (see Zangwill 2019 for critical discussion)[^zangwill-2019]. We should also bear in mind that the skeptical thesis would also be very surprising given that it departs from not just centuries but millennia of reflection on our aesthetic lives. The answers to questionnaires about correctness in judgment do not reveal the deep nature of people’s thoughts.
    step1: |-
      一些所谓“实验哲学家”依据关于作趣味判断者的经验证据，质疑趣味判断渴求正确性这一论题（Cova & Pain 2012）[^cova-2012]。但所引经验证据是否支持那种怀疑论论题，并不清楚。因为证据不过是：实验受试者在直接询问判断正确性的选项上打了勾。然而心理学实验要求实验要点对受试者保持不透明（Hughes 2016）[^hughes-2016]。此外，人们常常以与自己的实际概念实践不合的方式大谈哲学。例如，一些初学道德哲学导论课的学生，前后不一致地主张一切道德观点都同样正确，且认为不这样想很糟。以某种方式思考的人，可能在自我认识上有缺陷，正如参与社会仪式的人未必能描述那些仪式（批判性讨论见 Zangwill 2019）[^zangwill-2019]。我们也应记住：怀疑论论题还会显得非常惊人，因为它偏离的不是数百年、而是数千年来对我们审美生活的反思。关于判断正确性的问卷回答，并不揭示人们思想的深层性质。
