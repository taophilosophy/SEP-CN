      Of course, some people just *know* about food. There are experts and authorities on making delicious food and in knowing what will taste good (Kant 1790, 5: 213 [2000: 98])[^kant-1790]. But what these people know is what will taste pleasurable to a certain kind of palate. In a sense, some things just do taste better than others, and some judgments of excellence in food are better than others. There is even a sense in which some are correct and others incorrect. Still, this is only relative to “normal” human beings. There is no idea of correctness according to which someone with very unusual pleasures and displeasure is at fault, or according to which the majority of human beings can be wrong. (Kant says that judgments of agreeableness have “general” but not “universal” validity; 1790, 5: 213 [2000: 213].) But in the case of judgments of taste or beauty, correctness is not hostage to what most people like or judge. We may say that it is a mistake to use much salt or sugar but that is only because it swamps the flavors that are enjoyed by most people.
