      However, it is not so clear that pleasure in the beautiful does not *produce* desire, which Kant also requires for a pleasure to be disinterested. The issue here is whether the pleasure can produce desire *from itself*. Kant admits that we have certain general concerns with beauty that mean that desire may follow from a judgment of beauty, but according to Kant, such desires do not have their source solely in pleasure in the beautiful (Kant 1790, sections 41 and 42, on “empirical interest” and “intellectual interest)[^kant-1790]. It may be that we have desires concerning beautiful things, as Kant allows in sections 41 and 42 of the *Critique of Judgment*, but so long as those desires are not intrinsic to the pleasure in beauty, the doctrine that all pleasure in beauty is disinterested is undisturbed. (Critics of Kant sometimes miss this point.)
