      现在我们转向审美的当代概念。“审美的”这一谓词可以修饰许多不同种类的东西：判断、经验、概念、属性或词语。最好以审美判断为中心。其他审美种类的东西可以借审美判断来理解：审美属性是在审美判断中被归与的属性；审美经验是为审美判断奠基的经验；审美概念是在审美判断中被运用的概念；审美词语则具有在审美判断的语言表达中被使用的功能。
