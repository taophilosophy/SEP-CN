    source: |-
      The first necessary condition of a judgment of taste is that it is essentially *subjective*. What this means is that the judgment of taste is based on a feeling of pleasure or displeasure. This distinguishes judgments of taste from empirical judgments. Central examples of judgments of taste are judgments of beauty and ugliness. Judgments of taste can be about art or nature.
    step1: |-
      趣味判断的第一个必要条件是：它在本质上是主观的。这意味着，趣味判断基于一种愉悦或不悦的情感。这使趣味判断与经验判断区别开来。趣味判断的核心例子是美的判断与丑的判断。趣味判断可以关于艺术，也可以关于自然。
    step2: |-
      趣味判断的第一个必要条件，是它在本质上是主观的：它以愉悦或不悦之感为根据。正是这一点把趣味判断与经验判断区别开来。趣味判断的典型例子，是对美与丑的判断；其对象既可以是艺术，也可以是自然。
