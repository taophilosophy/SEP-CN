      美是我们生活的重要部分，丑也是。自古以来哲学家便关心我们对美与丑的经验和判断，这并不奇怪。他们试图弄清这类经验与判断的性质，也想追问它们是否正当。到了二十世纪，这两项事业都变得更尖锐：我们生活的这一部分，在欧洲与北美的知识圈中遭到持续攻击。自十八世纪以来，关于美的论述大多动用“审美”（the aesthetic）这一概念，于是这一概念首先成了批评的靶子。对审美的鄙薄，根子也许在一种更宽泛的文化清教主义——它惧怕审美与快乐之间的关联。曾有一个时期，从1960年代到1990年代，甚至只要说一件作品可能因其令人愉悦而好（而非因认知、道德或政治上有益而好），就会招来嘲弄。（如今已不那么严重。）二十世纪对美与审美的概念并不友善。然而始终有一些思想家——哲学家，以及治各种艺术之学的人——坚持认真思考美与审美。本文第一部分考察伊曼努尔·康德关于美的判断的丰富论述。“趣味判断”是康德论述的核心，传统美学中几乎人人也都以之为核心；所以我们从康德对趣味判断的刻画讲起。第二部分考察二十世纪思想家提出的问题。第三部分讨论无利害性——康德视之为趣味判断的组成部分。第四部分则借康德对趣味判断的论述，检讨“审美”这一概念是否还能成立。
