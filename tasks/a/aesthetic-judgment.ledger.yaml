      It is true that there is a popular idea that is sometimes expressed by saying that no judgments of taste are really better than others. People sometimes say, “There is no right and wrong about matters of taste”. Others express a related thought by saying that beauty is “relative” to individual judgment or preference, or that it is “socially relative”. Such skeptical views have some following outside the academy, as well as in certain of the humanities. Many even express distaste for the idea that judgments of taste have a normative claim, as if that would be uncouth or oppressive. However, if we are describing our thought as it is, not how it ought to be, then there is no getting away from the fact that normativity is a necessary condition of judgments of taste or beauty. Two points should embarrass the skeptic: firstly, people who express anti-normativist skeptical views are *merely theorizing*. In the case of judgments of beauty, anti-normativist skepticism is out of step with practice, especially their own practice. As with moral relativism, one can almost always catch a professed skeptic about judgments of beauty making and acting on non-skeptical judgments of beauty—for example, in their judgments about music, nature and everyday household objects around them. Skeptics do not practice what they preach. Secondly, one thing that *drives* people to this implausible skepticism, which is so out of line with their own practice, is a perceived connection with tolerance or anti-authoritarianism. This is what they see as attractive in it. But this is upside-down. For if “it is all relative” and no judgment is better than any other, then relativists put *their* own judgments beyond criticism, and they cannot get it wrong. Only those who think that there is a right and wrong in judgment can modestly admit that they might be wrong. What looks like an ideology of tolerance is, in fact, the opposite.
    step1: |-
      确实有一种流行观念，有时表述为：没有任何趣味判断真的比别的更好。人们有时说“趣味之事无对错”。另一些人用相关说法表达：美相对于个人判断或偏好，或美是“社会地相对的”。这类怀疑论观点在学院之外有一些追随者，在某些人文学科中也有。许多人甚至对趣味判断具有规范性主张这一观念表示厌恶，仿佛那是粗野或压迫性的。然而，如果我们描述的是我们实际的思想，而不是它应当如何，那么就无法回避这一点：规范性是趣味判断或美的判断的必要条件。有两点应让怀疑论者难堪：第一，表达反规范主义怀疑论观点的人只是在作理论。就美的判断而言，反规范主义怀疑论与实践脱节，尤其与他们自己的实践脱节。正如道德相对主义一样，几乎总能抓到自称怀疑美之判断的人实际作出并依据非怀疑的美的判断行事——比如他们对音乐、自然和周围日常家什的判断。怀疑论者并不践行自己所宣讲的。第二，驱使人们走向这种不可信怀疑论的、与他们自己的实践如此不合的东西，是一种被感知到的与宽容或反权威主义的联系。他们认为那一点有吸引力。但这恰恰颠倒过来。因为如果“一切皆相对”、没有判断比别的更好，那么相对主义者就让自己独有的判断免于批评，也永远不会出错。只有那些认为判断有对错的人，才能谦逊地承认自己可能出错。看似宽容的意识形态，实际上恰恰相反。
