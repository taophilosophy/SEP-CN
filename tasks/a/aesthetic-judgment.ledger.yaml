      We can recast the point about how we ought to judge in austere terms by saying that there is a certain *normative* constraint on our judgments of taste, which is absent in our judgments about the niceness of Canary-wine. The most primitive expression of this normativity is this: some are *correct*, others *incorrect*. Or perhaps, even more cautiously: *some judgments are better than others*. We do not think that something is beautiful merely *to me*, in the way that we might say that some things just happen to give *me* sensuous pleasure. Of course, we might well say “I *think* *X* is beautiful”, because we wish to express uncertainty, but where we judge confidently, we think of our judgment as being *correct*. And that means that we think that the opposite judgment would be incorrect. We assume that not all judgments of beauty are equally appropriate. “Each to their own taste” only applies to judgments of niceness and nastiness, which Kant calls “judgments of agreeableness” (see Kant 1790, 5: 212–213, 291–292 [2000: 97–98, 171–172])[^kant-1790].
    step1: |-
      我们可以用更严格的说法重新表述关于我们应当如何判断的论点：对我们的趣味判断存在着某种规范性约束，而这种约束在我们关于加那利葡萄酒是否可口的判断中是缺失的。这种规范性的最原始表达是：有些判断是正确的，另一些是不正确的。或者更谨慎地说：有些判断比另一些更好。我们并不认为某物仅仅“对我”是美的，就像我们可能说某些东西恰好给我感官快乐那样。当然，我们很可能说“我认为X是美的”，因为想表达不确定；但在我们有信心作判断的地方，我们认为自己的判断是正确的。而这意味着，我们认为相反的判断是不正确的。我们假定并非所有关于美的判断都同样恰当。“各人口味不同”只适用于关于可口与难吃的判断，康德称之为“适意判断”（见 Kant 1790, 5: 212–213, 291–292 [2000: 97–98, 171–172]）[^kant-1790]。
    step2: |-
      换一种严格的说法：我们的趣味判断受某种规范性约束，而关于加那利葡萄酒是否可口的判断并无此种约束。这种规范性最朴素的表现是：判断有正确与错误之分；或者更谨慎些说：判断有优劣之别。我们不会认为某物只是“对我而言”美，就像某些东西碰巧给我感官快乐那样。当然，我们也会说“我觉得X很美”，那是为了表示不确定；但凡有把握的判断，我们都视之为正确——这也就意味着视相反的判断为错误。我们认定，并非一切关于美的判断都同样恰当。“各人口味不同”只适用于可口与难吃之类的判断，康德称之为“适意判断”（见 Kant 1790，5: 212–213, 291–292 [2000: 97–98, 171–172]）[^kant-1790]。
