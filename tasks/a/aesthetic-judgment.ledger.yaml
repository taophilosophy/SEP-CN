      But this only follows if we follow Kant in locating pleasure in beauty, and our right to make judgments of beauty, in faculties that all human beings share. Perhaps there are rarefied beauties that only Nietzsche’s elite special souls can appreciate. For Kant, there is an aesthetic “ought” that binds all human beings only because we share the cognitive faculties that it takes to have the pleasure in question. But this is not the only conceivable source of the aesthetic “ought”. One non-Kantian suggestion would be to locate the source of normativity of the judgment of taste, in the world, not in what human beings share. This would be to invoke a kind of “aesthetic realism”, whereby beauty and ugliness are genuine properties of the world, which make our judgments better or worse. That view might seem metaphysically extravagant. The trouble, though, is how to understand the aesthetic “ought” without that kind of view. Not easy! On a realist view, beauty need not be universally available. But if so, it seems that the rationale for Kant’s doctrine(s) of disinterestedness falls away. The Kantian and perhaps Humean view locates the source of normativity in what we share. But Nietzsche would ask: is there, and should there, be something that humans share in their responses to beauty? Do we want aristocratic or democratic aesthetics?[^note-3]
