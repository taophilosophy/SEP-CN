      Some have argued that what aesthetic properties depend on (their “dependence base”) extends beyond the intrinsic physical and sensory features of the object of aesthetic assessment (for example Walton 1970)[^walton-1970], who follows Gombrich 1959, especially p. 313). On this view, the nonaesthetic dependence base always includes “contextual properties”—matters to do with the origin of the work of art, or other works of art. Others dispute this (Zangwill 1999)[^zangwill-1999]. This is one aspect of debates over formalism in many domains. These issues are both central theoretical commitments as well as reflecting substantive aesthetic differences in the approach to making and appreciating various arts, as well as the aesthetics of nature. But such debates all presuppose that *some* dependence thesis holds. The controversial questions are about the *extent* of the dependence base of aesthetic properties, not *whether* aesthetic properties have some nonaesthetic dependence base.
    step1: |-
      有人认为，审美属性所依赖的东西（其“依赖基础”）超出了审美评价对象的固有物理与感官特征（例如 Walton 1970[^walton-1970]，他追随 Gombrich 1959，尤其第 313 页）。按这种观点，非审美依赖基础总是包含“语境属性”——与艺术品来源或与其他艺术品相关的事项。另一些人对此有异议（Zangwill 1999）[^zangwill-1999]。这是许多领域中形式主义之争的一个侧面。这些问题既是核心的理论承诺，也反映了在创作与欣赏各门艺术以及自然美学进路上的实质审美差异。但此类争论都预设了某个依赖论题成立。有争议的问题是审美属性依赖基础的广度，而不是审美属性是否有某个非审美依赖基础。
