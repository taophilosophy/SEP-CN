      ### 4.3 A Hierarchical Proposal
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      One strategy is the following: begin with the account of what it is to be a judgment of taste, or of beauty and ugliness, that was outlined in part 1, and then use that to elucidate a broader notion of an aesthetic judgment. To recall, it was argued that Kant was right, with qualifications, to think that the crucial thing about the judgment of taste is that it has what he calls “subjective universality”; judgments of taste are those that are (a) based on responses of pleasure or displeasure, and (b) claim universal validity, where that can be minimally interpreted as a normative aspiration. The present strategy is to use this Kantian account in order to ground a wider category of the aesthetic, which includes judgments of taste along with judgments of daintiness, dumpiness, delicacy, elegance, and the rest.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Let us call judgments of taste, or judgments of beauty and ugliness, “verdictive aesthetic judgments”, and let us call the other aesthetic judgments (of daintiness, dumpiness, elegance, delicacy, etc.) “substantive aesthetic judgments”. The idea is that these substantive judgments are aesthetic in virtue of some special close relation to verdictive judgments of taste, which are subjectively universal. We can assume that judgments of beauty and ugliness coincide with judgments of aesthetic merit and demerit. However, even if beauty were taken to be a substantive aesthetic notion, like elegance, delicacy or daintiness, there would remain some other overarching notion of aesthetic merit or excellence, and we could take that notion as central.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      On this approach, judgments of daintiness, dumpiness, delicacy and elegance stand in some special and intimate relation to judgments of beauty and ugliness (or aesthetic merit and demerit), and it is only in virtue of this intimate relation that we can think of all these judgments as belonging to the same category. This is a hierarchical rather than an egalitarian conception of aesthetic notions
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      Now, what exactly is this special intimate relation between verdictive and substantive aesthetic judgments? One suggestion is this: first, substantive judgments describe *ways of being beautiful or ugly* (Burton 1992, Zangwill 1995)[^burton-1992][^zangwill-1995]. It is part of what it *is* for a thing to be elegant, delicate or dainty that it is beautiful in a particular *way*. And second, it is part of the *meaning* of substantive aesthetic judgments that they imply verdictive aesthetic judgments. This is the hierarchical proposal.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Remark: this claim need not be one about all *words* like “dainty” and “delicate”, but it is about the particular substantive *judgments* that we linguistically express in such words on particular occasions. Both Beardsley and Sibley seem to have made the mistake of casting these issues at the linguistic level rather than at the level of thought; they focused not on aesthetic words instead of aesthetic judgments and responses. Sibley did say in footnote 1 of Sibley 1959 that he was concerned with “uses” of aesthetic words, but he and everyone else ignored that qualification.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Let us now see how this hierarchical proposal works. Consider an abstract pattern of curving lines, which is elegant. It might be *necessary* that that pattern is beautiful. This is because the beauty *depends on* or *is determined by* that specific pattern. But it is not part of what it is to *be* that pattern that it is beautiful. That is, the pattern is necessarily beautiful but it is not essentially beautiful. (On the general distinction between necessity and essence, see Fine 1994.)[^fine-1994] Furthermore, we can think of that pattern without thinking of it as beautiful.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      By contrast, it is *both* necessary *and* essential that something that is elegant is beautiful. And this is reflected in our concepts and judgments. We can think of the pattern without thereby thinking of it as beautiful, but to think of the pattern as elegant is to think of it as beautiful, at least in certain respects. Hence elegance is an aesthetic concept.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      The hierarchical proposal thus seems to characterize a non-arbitrary and useful notion of the aesthetic. If so, the contemporary broad notion of the aesthetic can be vindicated.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      To see how this works, consider representational properties. Are they aesthetic properties? Suppose that a painting represents a tree and is a beautiful representation of a tree. It is not merely beautiful *and* a tree representation but beautiful *as* a tree representation (Zangwill 1999)[^zangwill-1999]. Of course, that the painting represents a tree is “relevant” to whether it is beautiful because it is part of what its beauty depends on. But being beautiful is not part of what it is to be a representation of a tree or even that representation of a tree. Moreover, to think that the painting represents a tree is not thereby to think that it is beautiful. Being beautiful is not an essential property of the representation, and thinking of the representation does not mean thinking of it as beautiful, even though it may be necessary that it is beautiful. Hence representational properties are not aesthetic properties.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      The proposal faces a challenge, however. Jerrold Levinson has argued that not all substantive properties have evaluative valence (Levinson 2001)[^levinson-2001]. One of his examples is of “starkly grim”. Being starkly grim seems not always to be a way of being beautiful or ugly. The defender of hierarchy could reply that it is specific uses of these words, in context, that pick out features that have evaluative valences. If so, the particular instance of stark grimness might be a valuable aspect of a thing however it is with other instances of stark grimness. But it might be replied that particular instances of stark grimness may be value-neutral? The issue is a difficult one, and I leave the issue here.
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      If the hierarchical suggestion fails, then we lack one way of vindicating the modern broad notion of the aesthetic. Maybe there are other ways to give unity to the notion of the aesthetic. However, it is not clear that there is another feasible way in the literature. Levinson thinks of aesthetic properties as a certain kind of appearance properties. We might note that this will immediately rule out the aesthetic properties of abstract objects by fiat. More importantly, there remains the question of what kind of appearance properties aesthetic properties are. Even if we are happy with indefinite boundaries of the aesthetic, we need some sense of what the sub-class is, and its relation to pleasure and beauty. (We might compare the difficulties in characterizing a notion of the aesthetic with the difficulties characterizing a notion of logic.)
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
