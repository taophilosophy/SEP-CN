      We also think that beauty, ugliness and other aesthetic properties *depend* on nonaesthetic properties. Dependence contrasts with mind-independence in that it says what aesthetic properties *do* depend on, as opposed to what they *do not* depend on: the aesthetic properties of a thing depend on its nonaesthetic properties. This dependence relation implies (but is not identical with) the supervenience relation or relations: (a) two aesthetically unlike things must also be nonaesthetically unlike; (b) something could not change aesthetically unless it also changed nonaesthetically; and (c) something could not have been aesthetically different unless it were also nonaesthetically different. These are, respectively: cross-object supervenience, cross-time supervenience, and cross-world supervenience. (“Supervenience” has often been discussed under the heading of “dependence” but they are distinct relations, related in a complex way.) Sibley’s papers “Aesthetic Concepts” and “Aesthetic/Nonaesthetic” were pioneering discussions of the dependence of the aesthetic on the nonaesthetic (Sibley 1959, 1965)[^sibley-1959]. (It is interesting that he never described the dependence in modal terms.)
    step1: |-
      我们也认为，美、丑及其他审美属性依赖于非审美属性。依赖与心灵独立性形成对照：依赖说的是审美属性确实依赖于什么，而不是不依赖于什么：一个事物的审美属性依赖于它的非审美属性。这种依赖关系蕴含（但不等于）随附关系：（a）两个审美上不同的东西，也必在非审美上不同；（b）某物若在审美上改变，也必在非审美上改变；（c）某物若非在非审美上不同，便不可能在审美上不同。这三者分别是：跨对象随附、跨时间随附、跨世界随附。（“随附”常在“依赖”标题下讨论，但它们是不同的关系，以复杂方式相关联。）西布利的论文《审美概念》与《审美的/非审美的》是讨论审美依赖于非审美这一问题的开创性文献（Sibley 1959, 1965）[^sibley-1959]。（有趣的是，他从未用模态术语描述这种依赖。
