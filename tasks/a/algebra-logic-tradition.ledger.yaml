      Furthermore, cylindric algebras, essentially Boolean algebras equipped with unary cylindric operations $C_x$ which are intended to capture the existential quantifiers ($\exists x$), were introduced in the years 1948–1952 by Tarski, working with his students Louise Chin and Frederick Thompson (see Henkin & Tarski 1961)[^henkin-1961], to create an algebra of logic that captured the expressive power of the first-order theory of binary relations. Polyadic algebra is another approach to an algebra of logic for first-order logic—it was created by Halmos (1956c). The focus of work in these systems was again to see to what extent one could parallel the famous results of Stone for Boolean algebra from the 1930s.
    step1: |-
      此外，柱形代数——本质上是配备一元柱形运算 $C_x$ 的布尔代数，这些运算意在捕捉存在量词（$\exists x$）——由塔斯基在 1948–1952 年间与其学生路易丝·钦（Louise Chin）和弗雷德里克·汤普森（Frederick Thompson）合作引入（见 Henkin & Tarski 1961）[^henkin-1961]，以创建一种能捕捉二元关系一阶理论表达力的逻辑代数。多元代数是为一阶逻辑建立逻辑代数的另一进路——由哈尔莫斯（1956c）创立。这些系统中的工作焦点，同样是看能在多大程度上平行于斯通 1930 年代关于布尔代数的著名结果。
    step2: |-
      此外，柱形代数——本质上是配备一元柱形运算 $C_x$ 的布尔代数，这些运算意在捕捉存在量词（$\exists x$）——由塔斯基在 1948–1952 年间与其学生路易丝·钦（Louise Chin）和弗雷德里克·汤普森（Frederick Thompson）合作引入（见 Henkin & Tarski 1961）[^henkin-1961]，以创建一种能捕捉二元关系一阶理论表达力的逻辑代数。多元代数是为一阶逻辑建立逻辑代数的另一进路——由哈尔莫斯（1956c）创立。这些系统中的工作焦点，同样是看能在多大程度上平行于斯通 1930 年代关于布尔代数的结果。
