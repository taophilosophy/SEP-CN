      According to Huntington (1933: 278), the term “Boolean algebra” was introduced by Henry M. Sheffer (1882–1964) in the paper where he showed that one could give a five-equation axiomatization of Boolean algebra using the single fundamental operation of joint exclusion, now known as the Sheffer stroke (see Sheffer 1913)[^sheffer-1913]. Whitehead and Russell claimed in the preface to the second edition of *Principia* that the Sheffer stroke was the greatest advance in logic since the publication of *Principia*. (Hilbert and Ackermann (1928), by contrast, stated that the Sheffer stroke was just a curiosity.) Neither realized that decades earlier Schröder had discovered that the dual of the Sheffer stroke was also such an operation—Schröder’s symbol for his operation was that of a double-edged sword.
    step1: |-
      据亨廷顿（1933: 278），“布尔代数”一词由亨利·M. 谢弗（Henry M. Sheffer，1882–1964）引入；谢弗在文中表明，可用单一基本运算——今称谢弗竖——给出布尔代数的五方程公理化（见 Sheffer 1913）[^sheffer-1913]。怀特海与罗素在《数学原理》第二版序言中宣称，谢弗竖是自《数学原理》出版以来逻辑的最大进展。（相比之下，希尔伯特与阿克曼（1928）说谢弗竖只是奇趣。）两人都未意识到，几十年前施罗德已发现谢弗竖的对偶也是这样的运算——施罗德为自己的运算所用符号是一把双刃剑。
