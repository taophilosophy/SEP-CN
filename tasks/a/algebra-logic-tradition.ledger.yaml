      Later, in his *Pure Logic* from 1864, Jevons changed Boole’s partial operation of union of disjoint sets to the modern unrestricted union and eliminated Boole’s questionable use of uninterpretable terms (see Jevons 1890)[^jevons-1890]. Peirce (1880) eliminated explicitly the Aristotelian derivation of particular statements from universal statements by giving the modern meaning for “All $A$ is $B$”. In addition, he extended the algebra of logic for classes to the algebra of logic for binary relations and introduced general sums and products to handle quantification. Ernst Schröder, taking inspiration from previous work by Hermann (1809–1877) and Robert Grassmann (1815–1901) and using the framework developed by Peirce, developed and systematized the 19ᵗʰ Century achievements in the algebra of logic in his three-volume work *Vorlesungen über die Algebra der Logik* (1890–1910).
    step1: |-
      后来，在 1864 年的《纯粹逻辑》中，杰文斯把布尔关于不相交集合之并的部分运算改为现代的无限制并，并消除了布尔对不可解释项的可疑使用（见 Jevons 1890）[^jevons-1890]。皮尔士（1880）通过赋予“所有 $A$ 是 $B$”以现代含义，明确取消了从全称陈述推出特称陈述的亚里士多德式导出。此外，他把关于类的逻辑代数扩展为关于二元关系的逻辑代数，并引入一般和与积以处理量化。恩斯特·施罗德受赫尔曼（1809–1877）与罗伯特·格拉斯曼（1815–1901）先前工作的启发，利用皮尔士发展的框架，在三卷本《逻辑代数讲义》（1890–1910）中发展并系统化了十九世纪逻辑代数的成就。
    step2: |-
