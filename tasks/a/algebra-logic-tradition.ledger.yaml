      During the first two decades of the twentieth century, the algebra of logic was further developed in the works of Platon Sergeevich Poretzsky (1846–1907), Louis Couturat (1868–1914), Leopold Löwenheim (1878–1957), and Heinrich Behmann (1891–1970) (see Styazhkin 1969)[^styazhkin-1969]. In particular, elimination theorems in the algebra of logic influenced decision procedures for fragments of first-order and second-order logic (see Mancosu, Zach, Badesa 2009).
    step1: |-
      二十世纪头二十年，逻辑代数在普拉顿·谢尔盖耶维奇·波列茨基（Platon Sergeevich Poretzsky，1846–1907）、路易·库蒂拉（Louis Couturat，1868–1914）、勒文海姆与海因里希·贝曼（Heinrich Behmann，1891–1970）的工作中得到进一步发展（见 Styazhkin 1969）[^styazhkin-1969]。尤其，逻辑代数中的消去定理影响了一阶与二阶逻辑片段的判定程序（见 Mancosu, Zach, Badesa 2009）。
    step2: |-
      二十世纪头二十年，逻辑代数在普拉顿·谢尔盖耶维奇·波列茨基（Platon Sergeevich Poretzsky，1846–1907）、路易·库蒂拉（Louis Couturat，1868–1914）、勒文海姆与海因里希·贝曼（Heinrich Behmann，1891–1970）的工作中得到进一步发展（见 Styazhkin 1969）[^styazhkin-1969]。尤其，逻辑代数中的消去定理影响了一阶与二阶逻辑片段的判定程序（见 Mancosu, Zach, Badesa 2009）。
  - id: 14
    kind: body
    source: |-
      After WWI David Hilbert (1862–1943), who had at first adopted the algebraic approach, picked up on the approach of *Principia*, and the algebra of logic fell out of favor. However, in 1941, Tarski treated relation algebras as an equationally defined class. Such a class has many models besides the *collection of all binary relations on a given universe* that was considered in the 1800s, just as there are many Boolean algebras besides the *power set Boolean algebras* studied in the 1800s. In the years 1948–1952 Tarski, along with his students Chin and Thompson, created cylindric algebras as an algebraic logic companion to first-order logic, and in 1956 Paul Halmos (1916–2006) introduced polyadic algebras for the same purpose. As Halmos (1956 b, c and d) noted, these new algebraic logics tended to focus on studying the extent to which they captured first-order logic and on their universal algebraic aspects such as axiomatizations and structure theorems, but offered little insight into the nature of the first-order logic which inspired their creation.
    step1: |-
      第一次世界大战后，起初采纳代数进路的希尔伯特（David Hilbert，1862–1943）转向《数学原理》的进路，逻辑代数遂失宠。然而，1941 年塔斯基把关系代数处理为一个由等式定义的类。这样的类除十九世纪所考虑的*给定论域上一切二元关系的集合*之外，还有许多模型；正如布尔代数除十九世纪所研究的*幂集布尔代数*之外还有许多。1948–1952 年间，塔斯基与其学生钦（Chin）和汤普森（Thompson）创建柱形代数，作为一阶逻辑的代数逻辑伴侣；1956 年哈尔莫斯（Paul Halmos，1916–2006）出于同一目的引入多元代数。正如哈尔莫斯（1956 b, c, d）所指出的，这些新代数逻辑倾向于聚焦于它们捕捉一阶逻辑的程度，以及其泛代数方面（如公理化与结构定理），却很少提供关于激发其创造的一阶逻辑之本性的洞见。
