    source: |-
      The *algebra of logic*, as an *explicit* algebraic system showing the underlying mathematical structure of logic, was introduced by George Boole (1815–1864) in his book *The Mathematical Analysis of Logic* (1847). It is therefore to be distinguished from the more general approach of *algebraic logic*. The methodology initiated by Boole was successfully continued in the 19ᵗʰ century in the work of William Stanley Jevons (1835–1882), Charles Sanders Peirce (1839–1914), Ernst Schröder (1841–1902), among many others, thereby establishing a tradition in (mathematical) logic. From Boole’s first book until the influence after WWI of the monumental work *Principia Mathematica* (1910–1913) by Alfred North Whitehead (1861–1947) and Bertrand Russell (1872–1970), versions of the algebra of logic were the most developed form of mathematical logic above all as presented in Schröder’s three volumes *Vorlesungen über die Algebra der Logik* (1890–1905). Furthermore, this tradition motivated the investigations of Leopold Löwenheim (1878–1957) that eventually gave rise to model theory. In addition, in 1941, Alfred Tarski (1901–1983) in his paper “On the calculus of relations” returned to Peirce’s relation algebra as presented in Schröder’s *Algebra der Logik*. The tradition of the algebra of logic played a key role in the notion of *Logic as Calculus* as opposed to the notion of *Logic as Universal Language*. Beyond Tarski’s algebra of relations, the influence of the algebraic tradition in logic can be found in other mathematical theories, such as category theory. However this influence lies outside the scope of this entry, which is divided into 10 sections.
    step1: |-
      *逻辑代数*（algebra of logic）作为展示逻辑之底层数学结构的*显式*代数系统，由乔治·布尔（George Boole，1815–1864）在《逻辑的数学分析》（*The Mathematical Analysis of Logic*，1847）中引入。因此它须与更一般的*代数逻辑*（algebraic logic）进路相区别。布尔开创的方法论在十九世纪由威廉·斯坦利·杰文斯（William Stanley Jevons，1835–1882）、查尔斯·桑德斯·皮尔士（Charles Sanders Peirce，1839–1914）、恩斯特·施罗德（Ernst Schröder，1841–1902）等人成功延续，从而在（数学）逻辑中确立了一个传统。自布尔的第一部书，直到第一次世界大战后怀特海（Alfred North Whitehead，1861–1947）与罗素（Bertrand Russell，1872–1970）巨著《数学原理》（*Principia Mathematica*，1910–1913）产生影响为止，逻辑代数的各种版本都是数理逻辑最发达的形式，尤其体现在施罗德三卷本《逻辑代数讲义》（*Vorlesungen über die Algebra der Logik*，1890–1905）中。此外，这一传统激发了勒文海姆（Leopold Löwenheim，1878–1957）的研究，最终催生模型论。再者，1941 年塔斯基（Alfred Tarski，1901–1983）在《论关系演算》一文中，回到施罗德《逻辑代数》所呈现的皮尔士关系代数。逻辑代数传统在“逻辑作为演算”（Logic as Calculus）这一观念、而非“逻辑作为普遍语言”（Logic as Universal Language）观念中起了关键作用。除塔斯基的关系代数之外，代数传统在逻辑中的影响还可见于其他数学理论，如范畴论。不过这一影响超出本词条范围；本词条分为 10 节。
    step2: |-
      *逻辑代数*（algebra of logic）作为展示逻辑底层数学结构的*显式*代数系统，由乔治·布尔（George Boole，1815–1864）在《逻辑的数学分析》（*The Mathematical Analysis of Logic*，1847）中引入，因此须与更一般的*代数逻辑*（algebraic logic）进路相区别。布尔开创的方法论在十九世纪由威廉·斯坦利·杰文斯（William Stanley Jevons，1835–1882）、查尔斯·桑德斯·皮尔士（Charles Sanders Peirce，1839–1914）、恩斯特·施罗德（Ernst Schröder，1841–1902）等人成功延续，从而在（数学）逻辑中确立了一个传统。自布尔的第一部书，直到第一次世界大战后怀特海（Alfred North Whitehead，1861–1947）与罗素（Bertrand Russell，1872–1970）巨著《数学原理》（*Principia Mathematica*，1910–1913）产生影响为止，逻辑代数的各种版本都是数理逻辑最发达的形式，尤其体现在施罗德三卷本《逻辑代数讲义》（*Vorlesungen über die Algebra der Logik*，1890–1905）中。此外，这一传统激发了勒文海姆（Leopold Löwenheim，1878–1957）的研究，最终催生模型论。1941 年，塔斯基（Alfred Tarski，1901–1983）又在《论关系演算》一文中，回到施罗德《逻辑代数》所呈现的皮尔士关系代数。逻辑代数传统在“逻辑作为演算”（Logic as Calculus）而非“逻辑作为普遍语言”（Logic as Universal Language）这一观念中起了关键作用。除塔斯基的关系代数，代数传统在逻辑中的影响还可见于范畴论等其他数学理论。不过这一影响超出本词条范围；本词条分为 10 节。
