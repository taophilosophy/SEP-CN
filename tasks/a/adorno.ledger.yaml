      Philosophical analysis seeks to clarify conceptually the truth content based on the social-historical content and aesthetic material constituting the work’s individual form that in its critical, negative stance both reflects antagonistic late capitalist society and holds onto art’s “promise of happiness” (Finlayson 2012)[^finlayson-2012]. For Adorno, then, philosophy and art, the experiences of a philosophical text and an artwork, are closely intertwined (Hulatt 2016b, 105–134)[^hulatt-2016b] . Philosophy “must strive, by way of the concept, to transcend the concept” (1966a [1973, 15]; for theological aspects of transcendence here, see Kaufmann 2000)[^kaufmann-2000], that is, to indicate by determinate negation that concept and the principle of exchange fail to know the particular, the non-identical, non-conceptual. Art, by way of sensuous intuition, as the “refuge” of mimesis, can reach the particular, the non-identical, but only by way of semblance, falsity: “Art has truth as the semblance of that which has no semblance” (1970 [1997, 132, trans. mod.]). For Adorno philosophical, “metaphysical” experience on the one hand, from the side of the concept, and aesthetic experience on the other, from the side of intuition, grapple with the same problems of rationality, epistemology, and metaphysics, the fateful legacy of the dialectic of enlightenment.
