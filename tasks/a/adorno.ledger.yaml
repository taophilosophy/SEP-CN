      Arguably, the idea of “truth content” (*Wahrheitsgehalt*) is the pivotal center around which all the concentric circles of Adorno’s aesthetics turn: “All aesthetic questions terminate in those of the truth content of artworks” but “the truth content of an artwork requires philosophy” (1970 [1997, 335, 341; Zuidervaart 1991; Wellmer 1991, 1–35 ; Jarvis 1998, 90–123; Hammer 2015, 101–131; Hulatt 2016b; Zuidervaart 2024, 101–128)[^hammer-2015][^hulatt-2016b][^jarvis-1998][^wellmer-1991][^zuidervaart-1991][^zuidervaart-2024]. For Adorno (as for Hegel), truth is dialectical, disclosive, and non-propositionally object-oriented, as when one speaks of a “true” friend. The modernist artwork, however, does not fulfill a concept, rather it has a “enigmatic character” because it is a processual “force field” of tensions and tendencies of conceptual polarities: sensuousness and meaning, spirit and constellation, form and content, autonomy and heteronomy, mimesis and rational construction, semblance and expression, etc.. The artwork has social-historical content (its relationship to the societal context in which it was made), which, along with the historical tradition of artistic forms, techniques, genres, etc., is reflected and “sedimented” in the form of the artwork, which in turn indicates the truth content of the work as it unfolds in the ongoing reception of the work. While classical aesthetics sees the balanced, harmonious, organic unified form of aesthetic semblance as embodying the work’s truth content – the Hegelian “sensuous appearing of the Idea,” the underlying essence that is manifested in society’s observable characteristics (for example the ideal of social freedom in the bourgeois age) –, modern art’s truth content is negative and critical, the tendency toward unified semblance (*Schein*) and meaning interrupted by dissonance, heteronomy, abrupt and particular expression (*Ausdruck*) eliciting mimetic responses such that Adorno likens artwork and animality (Hofstätter and Steuer 2022)[^hofstätter-2022].
