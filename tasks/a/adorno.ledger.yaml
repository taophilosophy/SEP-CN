      弗洛伊德之于紧随阿多诺（与马尔库塞）之后工作的法兰克福批判理论家已不那么重要（Whitebook 2004a）[^whitebook-2004a]；但近来，批判理论家重返精神分析，为的是再度把心灵与社会之间的能动互动理论化。霍克海默与阿多诺似乎给社会心理学留下了一道“权威的悖论”：抵抗权威似乎要求形成具有自律理性自我的个体，可这一形成恰恰通过内化父亲的支配与权威而发生。杰西卡·本雅明（Jessica Benjamin）主张，“解放的潜能应当奠基于一种主体间的人格理论，而非一种内化的个体心理学”（1977, 42–43）。Whitebook (1995) 借升华概念重构自我形成。Fong (2016) 考虑一个基本无意识的“权威”之源，以成就某种自律。Allen (2021；Allen and O’Connor 2019)[^allen-2019] 则发展弗洛伊德移情理论、克莱因派主体间的开放式自我形成学说与客体关系理论中的诸潜能。
