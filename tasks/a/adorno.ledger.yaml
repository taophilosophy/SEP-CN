      The primary clues to these revisions come from a theory of reification proposed by the Hungarian philosopher Georg Lukács in the 1920s and from interdisciplinary projects and debates conducted by members of the Institute for Social Research in the 1930s and 1940s. Building on Max Weber’s theory of rationalization, Lukács argues that the capitalist economy is no longer one sector of society alongside others. Rather, commodity exchange has become the central organizing principle for all sectors of society. This allows commodity fetishism to permeate all social institutions (e.g., economic, legal, political, cultural, etc.) as well as all academic disciplines, including philosophy. “Reification” refers to the historical situation when the commodity form “becomes the universal category of society as a whole” such that “a man’s [sic] own activity, his own labor becomes something objective and independent of him, something that controls him by virtue of an autonomy alien to man” (Lukács 1971, 86, 87)[^lukács-1971].
    step1: |-
      这些修正的主要线索，来自匈牙利哲学家格奥尔格·卢卡奇（Georg Lukács）1920 年代提出的一种物化理论，也来自社会研究所成员在 1930 与 1940 年代开展的跨学科项目与辩论。卢卡奇立足马克斯·韦伯的理性化理论论证：资本主义经济不再是与其他部门并立的诸多社会部门之一；毋宁说，商品交换已成为社会一切部门的核心组织原则。这使得商品拜物教得以渗透一切社会建制（经济的、法律的、政治的、文化的等等），也渗透一切学科，包括哲学。“物化”指的是这样一种历史处境：商品形式“成为整个社会的普遍范畴”，以至于“一个人[sic]自身的活动、他自己的劳动变成了某种客观的、独立于他的东西，凭借一种异于人的自主性来控制他”（Lukács 1971, 86, 87）[^lukács-1971]。
