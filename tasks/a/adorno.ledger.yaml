      在一系列著述中，阿多诺概述了权威主义人格受法西斯主义政治心理操纵的技巧与机制（例如 1943 [2000]，1951b [1991]）。2019 年，苏尔坎普出版社出版了阿多诺 1967 年的一次演讲，检视当时正在战后德国兴起的新右翼政党所用的类似手法；这篇文章成了畅销书（1967c [2020]）。《权威主义人格》始终是社会心理学的试金石（例如 Stone, Lederer, and Christie 1993）；当代思想家也援引阿多诺的著作，来理解当下大众威权主义的兴起（Brown, Gordon and Pensky 2018；Abromeit 2022；Weigel 2022）[^abromeit-2022][^weigel-2022]。
