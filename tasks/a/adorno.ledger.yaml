      起初，阿多诺与卢卡奇共享这一关切，尽管他从未像卢卡奇那样相信革命的工人阶级能够克服物化。后来，阿多诺把意识的物化称作一个“副现象”：批判社会理论真正需要回答的，是为什么饥饿、贫困与其他形式的人类苦难，在技术与社会有潜力缓解乃至彻底消除它们的情况下依然持续。阿多诺说，根源在于资本主义生产关系支配了整个社会的方式，这导致了财富与权力极端——尽管常常不可见——的集中（1966a [1973, 189–92]）。社会已经围绕为生产交换价值而生产交换价值组织起来；这当然总是已经要求对剩余价值的无声占有。阿多诺把这一生产与权力的联结称为“交换原则”（*Tauschprinzip*）；这一联结占支配地位的社会即是“交换社会”（*Tauschgesellschaft*）。阿多诺对交换社会的诊断分三个层面：政治经济的、文化的、社会心理的。
