      Almost from its inception the Institute pursued a “marriage of Marx and Freud” (Jay 1996, 86–112; Whitebook 2004a)[^jay-1996][^whitebook-2004a], including a practicing analyst, Erich Fromm, among its members. Adorno’s first, failed *Habilitationsschrift* sought to combine Kant and Freud, arguing that the contents of the unconscious were at least partly determined by social reality (Whitebook 2004b; Bloch 2019)[^bloch-2019][^whitebook-2004b], a claim that can also be found operating in several lines of argument in *Dialectic of Enlightenment* (Sherratt 2002)[^sherratt-2002]*.* Adorno’s critique of Fromm’s (and his followers’) “revisionist” psychoanalysis clarified his own position: historicizing Freud’s account of the drives, repression, the Oedipal conflict, narcissicism, etc. showed that “not only the individual but the category of individuality is already a product of society” (1962 [2014, 330]; cf. 1955 [1967–68]); individual intrapsychic developmental conflict is the dynamic site where antagonistic society and antagonistic faculties of the psyche interact.
