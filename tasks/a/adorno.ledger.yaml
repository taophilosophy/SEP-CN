      In his 1931 inaugural lecture upon joining the University of Frankfurt philosophy faculty, “The Actuality of Philosophy,” which can be considered a kind of philosophical manifesto deeply indebted to Benjamin as well as to modernist aesthetic responses to experience under rationalized industrialization (Foster 2020)[^foster-2020], Adorno rejects Heideggerian fundamental ontology for its implicit idealism and logical positivism for its coercive restiction of experience (Gordon 2016, 37–83)[^gordon-2016]. Instead Adorno advocates philosophy as interpretation (*Deutung*), likening it to riddle-solving: “philosophy has to bring its elements, which it receives from the sciences, into changing constellations … into changing trial combinations until they fall into a figure which can be read as an answer, while at the same time the question disappears” (1931 [1977, 127]; Pickford 2018)[^pickford-2018]. His example of the method and its materialist commitment is the recognition by Marx of the structuring role of the commodity form in bourgeois society. The method of discontinuous, non-deductive presentation of material as a way to elicit recognition of an essence underlying socio-historical, and ideological, appearances operates throughout Adorno’s writings, and is elaborated and defended in the programmatic “Essay as Form” (1958 [1991]), *Hegel: Three Studies* (1963a [1993, 109]), the introduction to *Negative Dialectics* (1966a [1973: 3–57]), and also thematically in *Aesthetic Theory* as the “enigmatic character” of art (1970 [1997, 118–135]).
    step1: |-
      在 1931 年加入法兰克福大学哲学系教职的就职演说《哲学的现实性》中——这篇演说可视为一份哲学宣言，深深受惠于本雅明，也受惠于理性化工业化之下现代主义美学对经验的回应（Foster 2020）[^foster-2020]——阿多诺拒斥海德格尔式的基础存在论，指其隐含唯心论；又拒斥逻辑实证主义，指其强制性地限定经验（Gordon 2016, 37–83）[^gordon-2016]。相反，阿多诺提倡哲学作为阐释（*Deutung*），并把它比作解谜：“哲学必须把它从诸科学那里收到的要素置入不断变化的星丛……置入不断尝试的组合，直到它们落成一个可读作答案的图形，而与此同时，问题本身消失了”（1931 [1977, 127]；Pickford 2018）[^pickford-2018]。他举出马克思对商品形式在市民社会中构成作用的识别，作为这一方法及其唯物主义承诺的范例。这种以不连续的、非演绎的方式呈现材料，从而引出对社会历史表象与意识形态表象之下本质的识别的方法，贯穿阿多诺的全部著述；它在纲领性的《作为形式的论说文》（1958 [1991]）、《黑格尔：三研究》（*Hegel: Three Studies*，1963a [1993, 109]）、《否定的辩证法》导论（1966a [1973: 3–57]）中得到阐发与辩护，也在《美学理论》中作为艺术的“谜语性质”得到主题化的处理（1970 [1997, 118–135]）。
