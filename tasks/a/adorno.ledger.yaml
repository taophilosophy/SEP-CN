      With his book Adorno sought to attack the validity of existentialism, to present a Marxist alternative by analyzing “existence” as a social, rather than individual, category, and to revalue Kierkegaard’s dismissal of the aesthetic by showing how it can be interpreted to reveal objective, social-historical truth. He shows how Kierkegaard’s abstract, idealist inwardness and “objectless dialectic” is unintentionally permeated by socio-historical concrete objectivity. Adorno does this by constructing “objective images” in taking “literally” the metaphors in Kierkegaard’s texts: for example, the *intérieur* of the bourgeois apartment which “serves only as a metaphor for the nexus of his fundamental concepts. The relation is reversed as soon as interpretation gives up the compulsion of identity [exerted by Kierkegaard’s thought]…” (1933 [1989, 41]). Kierkegaard’s intended use of the image of the “window mirror” in apartment interiors – to invoke speculative reflection – is belied by the unintended presence of the socio-historical world within the apartment, for “the function of the window mirror is to project the endless row of apartment buildings into the isolated bourgeois living room; by the mirror, the living room dominates the reflected row at the same time that it is delimited by it – just as in Kierkegaard’s philosophy the ‘situation’ [the concept of what the completely self-sufficient subject decides upon] is subordinated to subjectivity and yet is defined by it” (ibid., 42) However, the external world of social production and circulation, as mirrored reflections or bourgeois decorations, is present merely as images – semblance –, abstracted from use and appearing as timeless “second nature” to the “objectless inwardness” of Kierkegaard’s dialectic of individual subjectivity, thereby revealing the “truth content,” the concrete historical conditions indirectly expressed within Kierkegaard’s spiritual dialectic of individual self-abnegation (Buck-Morss 1977, 111-121)[^buck-morss-1977]. Adorno as it were resurrects and revalues the lowly aesthetic sphere, by finding the “utopian” character of hope for redemption in the loss of the concrete, the fragmentary, the enigmatic that is cast aside in the dialectic of “objectless inwardness.”
