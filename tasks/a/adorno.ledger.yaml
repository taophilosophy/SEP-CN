      Like Hegel, Adorno criticizes Kant’s distinction between phenomena and noumena by arguing that the transcendental conditions of experience can be neither so pure nor so separate from each other as Kant seems to claim. As concepts, for example, the a priori categories of the faculty of understanding (*Verstand*) would be unintelligible if they were not already about something that is nonconceptual. Conversely, the supposedly pure forms of space and time cannot simply be nonconceptual intuitions. Not even a transcendental philosopher would have access to them apart from concepts about them. So too, what makes possible any genuine experience cannot simply be the “application” of concepts to a priori structured intuitions via the “schematism” of the imagination (*Einbildungskraft*). Genuine experience is made possible by that which exceeds the grasp of thought and sensibility. Adorno does not call this excess the “thing in itself,” however, for that would assume the Kantian framework he criticizes. Rather, he calls it “the nonidentical” (*das Nichtidentische*), and it has a plurality of operational meanings (Thyen 2007; Silberbusch 2018)[^thyen-2007].
    step1: TBD
    step2: TBD
