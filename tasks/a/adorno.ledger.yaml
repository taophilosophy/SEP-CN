      While during the liberal stage of capitalism, the proletariat existed “half outside” society and thus for Lukács possessed the potential of class consciousness and revolutionary activity as the “subject of history,” in late capitalism society had become “totally integrated” and “societized” (*vergesellschaftet*, a concept from Weber), either in a totalitarian or democratic form (Adorno 1966b [1969]). Because “material production, distribution, consumption are administered jointly… The totality of the processes of mediation, which amounts in reality to the principle of exchange, has produced a second, deceptive immediacy. This enables people to ignore the evidence of their own eyes and forget the difference and conflict or repress it from consciousness … No overall social subject exists” (Adorno 1969a **[**2003, 124, trans. mod.]). The “integration” of society (e.g., the “safety net” in welfare-state democracies integrates the proletariat) eliminates the possibility of external or “transcendent” social critique, thus “immanent criticism” or “determinate negation” becomes Adorno’s primary method: “It is no longer possible to adopt a vantage point outside the mechanism that would enable us to give the horror a name; one can tackle it only where it is inconsistent with itself” (ibid., trans. mod.). While Pollock claimed that state capitalism effectively neutralized class conflict and softened economic crises, in the 1940s Adorno criticized him for inadequately appreciating that not only did society remain antagonistic, but that class division (based who does and does not own the means of production) and the asymmetries in political power had intensified in late capitalism, though accompanied by intensified ideological veiling that Adorno associates with fascism: “The latest phase of class society is dominated by monopolies; it tends toward fascism, the form of political organization worthy of it. While it vindicates the doctrine of class struggle with its concentration and centralization, extreme power and extreme impotence directly confronting one another in total contradiction, it makes people forget the actual existence of hostile classes … The total organization of society by big business and its ubiquitous technology has taken such utter possession of the world and the imagination that even to conceive of the idea that things might be otherwise calls for an almost hopeless effort” (Adorno 1942a [2003a, 96]; Cook 1998)[^cook-1998]. Furthermore, no appeal to basic invariant human needs (as in orthodox Marxism) can be made because needs are thoroughly societally mediated: nature and history are inextricably intertwined (Adorno 1942b [2017]). These features of integrated society under state capitalism tend to thwart the emergence of a proletarian class consciousness (Hammer 2005, 54–65; Braunstein 2023)[^braunstein-2023][^hammer-2005].
    step1: |-
      在资本主义的自由阶段，无产阶级“半在外”地存在于社会之中，因而在卢卡奇看来握有阶级意识与革命活动的潜能，堪称“历史的主体”；而到了晚期资本主义，社会已经“彻底整合”并“社会化”（*vergesellschaftet*，来自韦伯的概念），或以极权的形式，或以民主的形式（Adorno 1966b [1969]）。由于“物质的生产、分配与消费被联合管理……诸中介过程的总体——它实际上就等于交换原则——生产出一种第二重的、欺骗性的直接性。这使人能够无视自己眼前的证据，忘记差别与冲突，或把它们从意识中压抑出去……不存在任何总体的社会主体”（Adorno 1969a **[**2003, 124, trans. mod.）。社会的“整合”（例如福利制民主国家的“安全网”整合了无产阶级）排除了外在的或“超越的”社会批判的可能，于是“内在批判”或“规定的否定”成为阿多诺的首要方法：“已不可能站在机制之外找到一个立足点，好为恐怖命名；人们只能就它与自身不一致之处着手对付它”（同上，trans. mod.）。波洛克声称国家资本主义实际上中和了阶级冲突、缓和了经济危机；1940 年代，阿多诺批评他对下述情况估计不足：社会不仅依然对立，而且阶级划分（以是否占有生产资料为准）与政治权力的不对称在晚期资本主义中愈演愈烈，只是伴随着愈发加重的意识形态遮蔽——阿多诺把这种遮蔽与法西斯主义联系起来：“阶级社会的最新阶段由垄断支配；它趋向法西斯主义，即与它相称的政治组织形式。它以其集中与集中化印证阶级斗争学说，使极端的权力与极端的无能处于全然对立的正面对峙，又使人们忘记敌对阶级的实际存在……大企业及其无处不在的技术对世界与想象的总体组织，已经如此彻底地占有世界与想象，以至于连‘事情可能是另一个样子’这一念头，都需要近乎无望的努力才能设想”（Adorno 1942a [2003a, 96]；Cook 1998）[^cook-1998]。此外，也不能再诉诸基本而恒定的人类需要（如正统马克思主义那样），因为需要已被社会彻底中介：自然与历史难解难分（Adorno 1942b [2017]）。国家资本主义之下这个整合社会的这些特征，往往挫败无产阶级阶级意识的萌生（Hammer 2005, 54–65；Braunstein 2023）[^braunstein-2023][^hammer-2005]。
