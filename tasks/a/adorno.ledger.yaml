      As commentary and criticism, Adorno’s aesthetic writings are unparalleled in the subtlety and sophistication with which they trace work-internal tensions and relate them to unavoidable sociohistorical conflicts (for individual readings, see Witkin 1998; Plass 2006; Hohendahl 2013, 103–151; Macdonald 2019b)[^hohendahl-2013][^macdonald-2019b][^plass-2006][^witkin-1998]. One gets frequent glimpses of this in *Aesthetic Theory*. For the most part, however, the book proceeds at the level of metacritique—reflections on categories employed in actual commentary and criticism, with a view to their suitability for what artworks express and to their societal implications. Typically he elaborates these categories as polarities or dialectical pairs.
    step1: |-
      作为评论与批评，阿多诺的美学著述无与伦比：它追踪作品内部的张力、并把它们与无可回避的社会历史冲突关联起来的细致与精妙无可企及（个读见 Witkin 1998；Plass 2006；Hohendahl 2013, 103–151；Macdonald 2019b）[^hohendahl-2013][^macdonald-2019b][^plass-2006][^witkin-1998]。在《美学理论》中，人们时时窥见这一点。但该书大体在元批判的层面推进——对实际评论与批评所 Employ 的诸范畴加以反思，考察其是否切合艺术品之所表达、及其社会蕴含。典型地，他把这些范畴阐发为两极或辩证对子。
    step2: |-
      作为评论与批评，阿多诺的美学著述无可匹敌：它追踪作品内部的张力，再把它们与无可回避的社会历史冲突关联起来，其细致与精妙无人能及（个读见 Witkin 1998；Plass 2006；Hohendahl 2013, 103–151；Macdonald 2019b）[^hohendahl-2013][^macdonald-2019b][^plass-2006][^witkin-1998]。在《美学理论》里，人们时时能窥见这一点。不过该书大体在元批判的层面推进——反思实际评论与批评所用的诸范畴，看它们是否切合艺术品之所表达，又有什么社会蕴含。典型地，他把这些范畴阐发为两极或辩证对子。
