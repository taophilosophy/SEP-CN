      In his 1932 posthumously published paper “The Idea of Natural History” Adorno outlines a philosophy of history comprised of the opposition between figures of necessity and contingency. “Nature” is “what has always been, what as fatefully arranged pre-given being underlies history and appears within history; it designates what is substantial within history”; it names what is taken to be immutable, necessary, and identical. “History” is “a movement that does not play itself out in pure identity, but is one in which the new occurs and gains its true character through what appears in it as new” (1932 [1984, 111]); it is characterized as the new, contingent, non-identical vis-à-vis the “ever-same” of nature. The relationship between these moments is one of dialectical but “discontinuous” tension (ibid., 122**)**: what appears to be fateful and natural might be revealed to have been produced historically as “second nature” and hence contingent; and the new, the advent of the historical, can itself ossify and become second nature. The critic must interpret the semblance of reality as “cipher” and “riddle” to reveal the inherent discrete potentials of “transience” (*Vergängnis*) (Macdonald 2019a, 58–68)[^macdonald-2019a]. The non-teleological, non-linear and non-synthesizing philosophy of history named “nature-history” recurs in later writings by Adorno (and Benjamin), e.g. the essay “Progress” (1964 [2005]), the lecture course *History and Freedom* (1964–65 [2006]), and *Negative Dialectics*: “History is the unity of continuity and discontinuity” (1966a [1973, 320]). Recent thinkers have interpreted the account as a “therapeutic” heuristic for criticizing reality (Whyman 2016)[^whyman-2016] and put the account to work in developing a non-Hegelian idea of historical progress (Allen 2016; Jaeggi 2023)[^allen-2016][^jaeggi-2023].
    step1: |-
      在 1932 年身后出版的论文《自然历史的观念》中，阿多诺勾画了一种历史哲学，它由必然性与偶然性诸形象之间的对立构成。“自然”是“向来如此的东西，是作为命定安排的先行给予的存在而奠基于历史之中、又显现于历史之内的东西；它指称历史中实体性的东西”；它命名那些被视为不可更易的、必然的、同一的东西。“历史”是“一场并不在纯粹同一性中自行上演的运动，而是一场新的事物在其中发生、并借其中显现的新东西获得其真正性格的运动”（1932 [1984, 111]）；它被刻画为相对于自然之“永恒同一者”的新、偶然与非同一。这些环节之间的关系是一种辩证的但“不连续的”张力（同上，122**）**：看似命定而自然的东西，可能被揭示为历史上被制造的“第二自然”，因而是偶然的；而新的东西、历史事件的来临，本身也可能僵化而变成第二自然。批评者必须把实在的假象解读为“密码”与“谜”，以揭示“消逝”（*Vergängnis*）所固有的离散潜能（Macdonald 2019a, 58–68）[^macdonald-2019a]。这种被称为“自然-历史”的非目的论的、非线性的、非综合的历史哲学，在阿多诺（与本雅明）后来的著述中反复出现，例如论文《进步》（1964 [2005]）、讲座课程《历史与自由》（*History and Freedom*，1964–65 [2006]），以及《否定的辩证法》：“历史是连续性与非连续性的统一”（1966a [1973, 320]）。晚近的思想家把这一论述解读为批判现实的“治疗性”启发（Whyman 2016）[^whyman-2016]，并把它用于发展一种非黑格尔式的历史进步观念（Allen 2016；Jaeggi 2023）[^allen-2016][^jaeggi-2023]。
