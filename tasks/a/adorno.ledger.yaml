      Adorno’s claims about art in general stem from his reconstruction of the modern art movement. So a summary of his philosophy of art sometimes needs to signal this by putting “modern” in parentheses. The book begins and ends with reflections on the social character of (modern) art. Two themes stand out in these reflections. One is an updated Hegelian question whether art can survive in a late capitalist world. The other is an updated Marxian question whether art can contribute to the transformation of this world. When addressing both questions, Adorno retains from Kant the notion that art proper (“fine art” or “beautiful art”—*schöne* *Kunst*—in Kant’s vocabulary) is characterized by formal autonomy. But Adorno combines this Kantian emphasis on form with a Hegelian emphasis on intellectual import (*geistiger* *Gehalt*) and a Marxian emphasis on art’s embeddedness in society as a whole. The result is a complex account of the simultaneous necessity and illusoriness of the artwork’s autonomy. The artwork’s necessary and illusory autonomy, in turn, is the key to (modern) art’s social character, namely, to be “the social antithesis of society” (1970 [1997, 8]; Gordon 2021)[^gordon-2021].
    step1: TBD
    step2: TBD
