      Adorno’s negativism runs together logical negation and normative rejection: what is “false” is what should not be (Theunissen 2007)[^theunissen-2007]. A preliminary here is the so-called “normative deficit” or “normativity problem” in Adorno’s thought. This objection, first voiced by Habermas (1987, 119), generalizes to the claim that the normative force in Adorno’s writing is undone by the absence of knowledge of or appeal to a norm or standard which can justify his normative claims (the apparent self-undermining of reason in *Dialectic of Enlightenment* is an example). In the moral context, the strongest view (Freyenhagen 2013)[^freyenhagen-2013] interprets Adorno claiming that society is “radically evil” (“substantive negativism”) and that in the current social-historical context one can attain no knowledge of the good or right life (“epistemic negativism”), but that knowledge of the bad alone suffices to provide some normative force for social critique (“metaethical negativism”). Hence, “there is life no longer”; “there is no right living in the false [life] [*Es gibt kein richtiges Leben im falschen*]”; “The whole is the false” (1951a [2005, 15, 39, 50]); “life itself is so deformed and distorted that no one is able to live the good life in it or to fulfill his destiny as a human being” (1963b [2000, 167]). In this situation, all one can do is strive to live “less wrongly”: to know, immanently criticize, and resist the bad (both Freyenhagen 2013 and Setiya 2023 work with verisons of neo-Aristotelian ethical naturalism here)[^freyenhagen-2013][^freyenhagen-2023]. More moderate interpretations argue that Adorno identifies and explicates discrete experiences of happiness and ethical goodness, for instance in idealized childhood reminiscences, “metaphysical” and aesthetic experiences that can serve as empirical sources of normativity without, however, bearing justificatory force (Gordon 2024)[^gordon-2024] or that Adorno’s oblique writing is intended to evoke without naming insights that can serve as a normative basis (Finlayson 2002)[^finlayson-2002], or that Adorno’s contemplative phenomenological experiences of objectivity themselves bear positive normative force (Seel 2004; Richter 2019)[^richter-2019][^seel-2004].
