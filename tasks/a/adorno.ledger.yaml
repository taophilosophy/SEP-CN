      The question of politics arose most forcefully in the student protest movement of the 1960s, some of whose organizers looked to Horkheimer and Adorno for support (Kraushaar 1998)[^kraushaar-1998]. Adorno, in contrast to Marcuse, demurred for political and philosophical reasons. Politically, he judged the situation to be one in which direct revolutionary action had scarce chance of success. Philosophically, in a posthumously published essay on the historical relationship between theory and praxis he distinguished between political action in the service of reasonable ends and “pseudo-activity” that insists on theory’s subservience to concrete praxis as an epicycle of the dialectic of enlightenment (1969c [2005, 259–278]; Berman 2002; Freyenhagen 2014)[^berman-2002][^freyenhagen-2014]. Scholars continue to elaborate the relationship and prospects between Adorno’s thought and activities and an “activist tradition” in Critical Theory (e.g., Holloway, Matamoros and Tischler 2009; Sebastian 2024 and forthcoming)[^sebastian-2024].
    step1: TBD
    step2: TBD
