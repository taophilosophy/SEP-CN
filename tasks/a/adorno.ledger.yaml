      While Freud was less important to Frankfurt Critical Theorists working immediately after Adorno (and Marcuse) (Whitebook 2004a)[^whitebook-2004a], recently Critical Theorists have returned to psychoanalysis in order to theorize again the dynamic interplay between psyche and society. Horkheimer and Adorno seemed to have bequeathed social psychology with “the paradox of authority”: to resist authority seems to require the formation of individuals with an autonomous, rational ego, but this formation occurs by internalizing the domination and authority of the father; Jessica Benjamin suggests that “the potential for emancipation be grounded in an intersubjective theory of personality rather than an individual psychology of internalization” (1977, 42–43). Whitebook (1995) reconceptualizes ego-formation through the concept of sublimation. Fong (2016) considers a mostly unconscious source of “authority” to fulfill a kind of autonomy. Allen (2021; Allen and O’Connor 2019)[^allen-2019] develops potentials from Freudian transference theory, a Kleinian intersubjective, open-ended account of ego-formation, and object relations theory.
