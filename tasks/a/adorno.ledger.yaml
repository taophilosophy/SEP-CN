      Several of Adorno’s posthumously published postwar university lecture courses and his Hegel book (1963a [1993]) record his thinking toward his magnum opus, *Negative Dialectics*, which includes his most sustained presentation of his metaphysical and epistemological claims, as will be considered in this section. These claims, in turn, consolidate and extend the historiographic and social-theoretical arguments already canvassed. As Simon Jarvis demonstrates, *Negative Dialectics* tries to formulate a “philosophical materialism” that is historical and critical but not dogmatic. Alternatively, one can describe the book as a “metacritique” of idealist philosophy, especially of the philosophy of Kant and Hegel (Jarvis 1998, 148–74; O’Connor 2004 and 2013, 54–109)[^jarvis-1998][^o’connor-2004][^o’connor-2013]. Adorno says the book aims to complete what he considered his lifelong task as a philosopher: “to use the strength of the subject to break through the deception [*Trug*] of constitutive subjectivity” (1966a [1973, xx]); cf. 1969b [2005, 247]).
