      Scholars have in recent years turned to Adorno as one interlocutor in discussions about the social ontology and politics of identity (see the Adorno and Identity Seminars, Other Internet Resources). Oberle (2018) is an expansive historical study of Adorno’s experiences in exile and his theorizing about subjectivity under the category “negative identity” and its social, economic and political conditions. Okiji (2018) argues that Adorno’s notoriously dismissive analyses of jazz presuppose a subjectivity denied black people; on the other hand, jazz performance exhibits qualities of the avant-garde modernist music extolled by Adorno in a context of a Marxian negativism shared by the Black radical tradition (Kelly 2024 finds problematic differences between Adorno and Black aesthetics)[^kelly-2024]. Such studies seem to keep faith with Adorno: “The only thing that can perhaps be said is that the good life [*das richtige Leben*] today would consist in resistance to the forms of a wrong life [*eines* *falschen Lebens*] that have been seen through and critically dissected by the most progressive consciousness” (1963b [2000, 167–8, trans mod.]).
    step1: |-
      近年来，学者们把阿多诺当作关于社会存在论与身份政治之讨论中的一位对话者（见“阿多诺与身份研讨会”，其他网络资源）。Oberle (2018) 以“否定性身份”为范畴，对阿多诺的流亡经验及其关于主体性的理论化作了宽宏的历史研究。Okiji (2018) 论证：阿多诺那出了名的拒斥性的爵士乐分析，预设了一种被否认给黑人的主体性；另一方面，爵士乐演奏展现出阿多诺所推崇的先锋现代主义音乐的诸特质，其语境是黑人激进传统所共享的马克思主义否定主义（Kelly 2024 发现阿多诺与黑人美学之间存在成问题的差异）[^kelly-2024]。这类研究似乎未负阿多诺：“或许唯一能说的是：今天良善的生活[*das richtige Leben*]，将在于对错误生活[*eines* *falschen* *Lebens*]之诸形式的抵抗——这些形式已被最进步的意识看穿并批判地剖析”（1963b [2000, 167–8, trans mod.]）。
