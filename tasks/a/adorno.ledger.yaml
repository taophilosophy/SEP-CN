      *Dialectic of Enlightenment* presupposes a critical social theory indebted to Karl Marx and Max Weber. Adorno reads Marx as a Hegelian materialist whose critique of capitalism unavoidably includes a critique of the ideologies that capitalism sustains and requires. The most important of these is what Marx called “the fetishism of commodities”: “The social character of activity as well as the social form of the product, and the share of individuals in production here appear as something alien and objective”; “a definite social relation between men assumes the phantasmagoric form of a relation between things” (quoted in Rose 2024, 33)[^rose-2024]. Marx aimed his critique of commodity fetishism against bourgeois social scientists who simply describe the capitalist economy as though it were a natural reality but, in so doing, simultaneously misdescribe it and prescribe a false social vision. According to Marx, bourgeois economists necessarily ignore the exploitation intrinsic to capitalist production. They fail to understand that capitalist production, for all its surface “formal freedom” and “equality in exchange,” must extract surplus value from the coerced labor of the working class. Like ordinary producers and consumers under capitalist conditions, bourgeois economists treat the commodity as a fetish. They treat it as if it were a positively given, neutral object, with an inherent value, that directly relates to other commodities, in independence from the human interactions that actually sustain all commodities. Marx, by contrast, argues that whatever makes a product a commodity goes back to human needs, desires, and practices. The commodity would not have “use value” if it did not satisfy human wants and needs; it would not have “exchange value” if no one wished to exchange it for something else. And its exchange value could not be calculated if the commodity did not share with other commodities a “value” created by the expenditure of human labor power and measured by the socially necessary labor time that is abstracted from the average concrete labor needed to produce commodities of various sorts.
