      This occurs in four stages. First, a long Introduction (1966a [1973, 1–57]) works out a concept of “philosophical experience” that both challenges Kant’s distinction between “phenomena” and “noumena” and rejects Hegel’s construction of “absolute spirit.” Then Part One (ibid., 59–131) distinguishes Adorno’s project from the “fundamental ontology” in Heidegger’s *Being and Time* (Gordon 2016, 120–158; Zuidervaart 2024, 55–76)[^gordon-2016][^zuidervaart-2024]. Part Two (ibid., 133–207) works out Adorno’s alternative with respect to the categories he reconfigures from German idealism. Part Three (ibid., 209–408), composing nearly half the book, elaborates philosophical “models.” These present negative dialectics in action upon key concepts of moral philosophy (Kant’s concept of “freedom”), philosophy of history (Hegel’s “world spirit” and “natural history”), and metaphysics. Adorno says the final model, devoted to metaphysical questions, “tries by critical self-reflection to give the Copernican revolution an axial turn” (ibid., xx). Alluding to Kant’s self-proclaimed “second Copernican revolution,” this description echoes Adorno’s comment about breaking through the deception of constitutive subjectivity.
    step1: |-
      这一突破分四个阶段。首先，一篇长导论（1966a [1973, 1–57]）制定了一个“哲学经验”的概念，既挑战康德对“现象”与“本体”的区分，又拒斥黑格尔对“绝对精神”的构造。继而第一部（同上，59–131）把阿多诺的方案与海德格尔《存在与时间》（*Being and Time*）中的“基础存在论”区分开来（Gordon 2016, 120–158；Zuidervaart 2024, 55–76）[^gordon-2016][^zuidervaart-2024]。第二部（同上，133–207）就他从德国观念论重新铸造的诸范畴，阐发阿多诺的替代方案。第三部（同上，209–408）几乎占全书一半，展开哲学的诸“模型”。这些模型展示否定的辩证法在道德哲学的关键概念（康德的“自由”概念）、历史哲学（黑格尔的“世界精神”与“自然历史”）以及形而上学上的运作。阿多诺说， devoted to 形而上学问题的最后一个模型“试图以批判性的自我反思，给哥白尼式革命一个轴向的转动”（同上，xx）。这一说法暗指康德自命的“第二次哥白尼式革命”，又呼应阿多诺关于突破构成性主体性之欺瞒的评论。
