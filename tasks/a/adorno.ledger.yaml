      借这本书，阿多诺意在攻击实存主义的效准，把“生存”分析为一个社会范畴而非个体范畴，从而提出一种马克思主义的替代方案；并要通过展示克尔凯郭尔对审美的拒斥如何可以反过来揭示客观的社会历史真理，重新评估这一拒斥。他表明，克尔凯郭尔抽象的、唯心论的内向性及其“无对象的辩证法”，如何在不经意间被社会历史的具体客观性所渗透。阿多诺的做法是“照字面”理解克尔凯郭尔文本中的隐喻，以构造“客观意象”：例如市民公寓的内部（*intérieur*），“只不过用作他基本概念之纽结的隐喻。一旦阐释放弃同一性的强制[克尔凯郭尔思想所施加的强制]，这一关系便颠倒过来……”（1933 [1989, 41]）。克尔凯郭尔有意用公寓内室中“窗镜”的意象唤起思辨反思，但公寓中社会历史世界的无意在场却使这一用意落空；因为“窗镜的功能是把连绵无尽的公寓楼排投射进孤立的市民客厅；借这面镜子，客厅既支配被反射的楼排，又被楼排所限定——正如克尔凯郭尔哲学中的‘处境’[完全自足的主体所决断之物的概念]被置于主观性之下，却又由主观性所界定”（同上，42）。然而，社会生产与流通的外部世界，作为镜中映像或市民装饰，仅仅作为意象——假象——而在场；它们脱离使用，呈现为无时间的“第二自然”，呈现于克尔凯郭尔个体主体性辩证法的“无对象的内向性”面前，由此揭示出“真理内容”，即间接表达于克尔凯郭尔个体自我弃绝之精神辩证法中的具体历史条件（Buck-Morss 1977, 111-121）[^buck-morss-1977]。阿多诺仿佛复活并重估了低贱的审美领域：他在具体的、片段的、谜样的东西之丧失中，找到了救赎希望所具有的“乌托邦”性格，而这些东西正是在“无对象的内向性”的辩证法中被抛掷的东西。
