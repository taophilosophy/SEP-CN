      由于这一新人类学类型不能以反思的方式处理社会经济总体中的矛盾与对立，其无意识的焦虑与暴怒便经由“虚假投射”（“真正模仿的反面”，1947 [2002, 154]）指向那些人：其刻板心象（*imago*）使它想起自己在适应总体时承受的弃绝与欺骗。这是阿多诺著述中解释反犹主义的若干进路之一；犹太人的形象提示着那部分逃逸出自我物化的东西：“没有权力的幸福、没有劳动的报偿、没有边界的家园、没有神话的宗教”（同上，164–5；Jay 1980；Rabinbach 2000）[^jay-1980][^rabinbach-2000]。在美国以及战前与战后的德国展开的若干经验研究中（Jacobs 2015；Rensmann 2017）[^jacobs-2015][^rensmann-2017]，研究所发展出探测这一新人类学类型之存在的技术；其中最著名的是促成《权威主义人格》的伯克利研究：参与者被问及一些间接显露人格倾向的问题，依四项度量记分——反犹主义（AS）量表、民族中心主义（E）量表、政治经济保守主义（PEC）量表与法西斯主义（F）量表。借鉴《启蒙辩证法》反犹主义一章的分析，阿多诺推断：因袭主义、顺从、攻击性、对主观性与想象的嫌恶、迷信/刻板性、强硬、对他人性生活的关切等等特质，指示高 F 量表得分。他又推理说，其中若干特质指示一种人格“症候群”，它浮现于童年，因而比政治思想与政治承诺更深、更早，并预示一种新的社会类型（Marasco 2018）[^marasco-2018]。在他为《权威主义人格》所作贡献的第二部分（未出版）中，阿多诺坚持：这一人格类型只有在其社会条件的语境中才能得到充分理解（Adorno et al., 1950 [2019, xli-lxvi]）。
