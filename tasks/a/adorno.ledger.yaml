      Philosophical and sociological studies of the arts and literature, above all music (Paddison 1993)[^paddison-1993], make up more than half of Adorno’s collected works (*Gesammelte* *Schriften*). All of his most important social-theoretical claims show up in these studies. Yet his “aesthetic writings” are not simply “applications” or “test cases” for theses developed in “nonaesthetic” texts. Adorno rejects any such separation of subject matter from methodology and all neat divisions of philosophy into specialized subdisciplines. This is one reason why academic specialists find his texts so challenging, not only musicologists and literary critics but also epistemologists and aestheticians. All of his writings contribute to a comprehensive and interdisciplinary social philosophy (Zuidervaart 2007)[^zuidervaart-2007].
