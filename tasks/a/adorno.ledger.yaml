      阿多诺与霍克海默论证：弗洛伊德的主体形成理论与自由资本主义的较早时期相合——彼时市民父权家庭会在婴儿身上引发俄狄浦斯冲突，结果是强健的自我从本我中分裂出来、超我得以安装，即市民时代自律个体所需的精神分析组件。然而，在垄断资本主义权力巨大不对称、国家与经济相整合的时代，父家长失去了其独有的权威，取而代之的是国家的代表，但首先是文化工业。在这些变化了的社会条件下，个体——即基于“良知、自我保存与驱力之间一场痛苦的内心对话”作出理性决断的、自律而成熟（*mündig*）的人——趋于消失（1947 [2002, 168]）。新条件偏爱一种“新人类学类型”（Adorno 1941 [2009]），阿多诺称之为“权威主义人格”与“操纵型人格”：其特征是自我软弱、物化意识、易于认同独裁领袖、一种钝化模仿反应性的“市民式冷漠”（Macdonald 2011）[^macdonald-2011]，以及退行到未升华的驱力。总之，在阿多诺看来，权威主义人格显示出一种深刻的“无力拥有经验”——就自觉地感知矛盾与辩证可能性而言（Adorno et al., 1950 [2019, 973]；参看 Fong forthcoming）。
