      Habermas inaugurated an influential line of criticism by objecting to the supposed conflation of instrumental rationality with rationality *tout court* and rationality with power, and argued for a perceived “normative deficit” in critical theory as practiced in *Dialectic of Enlightenment*: “it denounces the Enlightenment’s becoming totalitarian with its own tools. Adorno was quite aware of this performative contradiction [i.e., a contradiction between the act of assertion and the content of the assertion] inherent in totalized critique” (1987, 119); practicing “a critique that attacks the presuppositions of its own validity,” the book’s arguments have no “ultimate groundings” or “normative foundations” and must “therefore eschew theory and practice determinate negation on an ad hoc basis” (ibid., 128, 129). Habermas’s own positive theory argues for, alongside instrumental (strategic) rationality, intersubjective communicative rationality oriented toward mutual understanding (*Verständigung*) that relies on normative presuppositions and the regulative ideal of the “unforced force of the better argument” (Habermas 1984; see also Benhabib 1986)[^benhabib-1986][^habermas-1984]. For a defense of Adorno’s “ad hoc” ideology critique against Habermas’s more Kantian variety, see Geuss (1981).
