      Adorno’s *Habilitationsschrift*, *Kierkegaard: Construction of the Aesthetic*, written 1929–1930 under the direction of Paul Tillich and the influence of Lukács and Benjamin (Morgan 2012, 15–64)[^morgan-2012] and published in 1933, pursues a “redemptive critique” of the Danish philosopher’s writings, which due to their focus on individual existence, were enjoying a revival in existentialist circles, including Heidegger’s fundamental ontology. Occupying the lowest condition within his three-stage dialectical development of the individual subject (aesthetic, ethical, religious), the aesthetic is characterized by Kierkegaard as the realm and attitude of subjective immediacy, hedonism, and irrationality from which the individual consciousness in a state of pure “inwardness” dialectically advances to a self-relation preparatory to a “leap into faith.”
