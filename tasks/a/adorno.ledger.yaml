      阿多诺提供了另一种唯物主义的自由说明，此说明暗含于他把理性自律批判为压抑的做法之中。他把自由定位于身体之中，作为自我凝聚为 ego 之前“一个古老冲动的记忆”（1966a [1973, 221]；1964–65 [2006, 213]）；作为无法归于理性主义解释的东西，而是一个自发的“附加之物”或“补充”（*das Hinzutretende*），先于心灵与身体之间的严格划分，因而“心灵之内的”（1966a [1973, 228]），并且原则上能够与理性及被恰当理解的主体性和解。这一自由的替代性构想对道德也有意涵：“希特勒给不自由的人类强加了一个新的定言命令：如此安排他们的思想与行动，以使奥斯维辛不再重演，使类似的事情不再发生。……新的命令给予我们道德附加之物的身体感受——身体性的，因为它如今是对难以忍受的身体痛苦的实践性憎恶……唯有在未加粉饰的唯物主义动机中，道德才得以存活”（1966a [1973, 365**]**）。“道德行为的真正第一现象”“出现在冲动的要素与意识的要素相合、产生一个自发行为之时”（1964–65 [2006, 240]）；为此阿多诺举出 1944 年暗杀希特勒密谋中一位密谋者的例子。究竟如何理解这一实践行动的模型，一直是细致讨论的课题，因为阿多诺明确承认理性的必要角色（Schweppenhäuser 1993；Bernstein 2001；Freyenhagen 2013, 133–61；Shuster 2014, 71–133）[^bernstein-2001][^freyenhagen-2013][^schweppenhäuser-1993][^shuster-2014]。与其说这是一套系统的道德理论，不如说阿多诺对道德冲动之无条件遵从的召唤，部分是为回应康德式道德理性主义；再结合他对“市民式冷漠”的批判——现代社会所要求的共情与情感的适应性缩减（1951a [2005, 26, 74]；1966a [1973, 263, 347]）——这为他伦理思想的这一面向提供了有趣的前景：把它看作一种置于社会历史语境中的关怀伦理学（Ferrarese 2021）[^ferrarese-2021]。
