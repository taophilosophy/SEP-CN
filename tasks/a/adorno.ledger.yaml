      Adorno and Horkheimer argue that Freud’s theory of subject formation accorded with the earlier period of liberal capitalism, when a bourgeois patriarchal family would elicit an Oedipal conflict in the infant resulting in the splitting off of strong ego from id and the installation of a superego, the psychoanalytic components required by autonomous individuals in the bourgeois era. However, in the age of monopoly capitalism’s massive asymmetry in power, and the integration of state and economy, the patriarch lost his unique authority, replaced by representatives of the state but above all by the culture industry. Under these changed social conditions the individual, in the sense of an autonomous and mature (*mündig*) person who makes reasoned decisions based on “a painful inner dialogue between conscience, self-preservation, and drives” (1947 [2002, 168]), tends to disappear. The new conditions favor a “new anthropological type” (Adorno 1941 [2009]) that Adorno calls “the authoritarian personality” and “the manipulative character,” characterized by ego-weakness, reified consciousness, susceptibility to identifying with autocratic leaders, a “bourgeois coldness” that deadens mimetic responsiveness (Macdonald 2011)[^macdonald-2011], and a regression to unsublimated drives. In sum, for Adorno the authoritarian personality exhibits a profound “inability to have experience” in the sense of consciously perceiving contradiction and dialectical possibility (Adorno et al., 1950 [2019, 973]; cf. Fong forthcoming).
