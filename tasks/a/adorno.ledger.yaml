      First published the year after Adorno died, *Aesthetic Theory*, his unfinished, second magnum opus*,* marks the incomplete culmination of his remarkably rich body of aesthetic reflections. It casts retrospective light on the entire corpus. It also comes closest to the model of “paratactical presentation” (Hullot-Kentor in Adorno 1970 [1997, xi-xxi]) that Adorno, inspired especially by Walter Benjamin, found to be the most appropriate compositional principle for his own “atonal philosophy” (Jameson 1990)[^jameson-1990]. Relentlessly tracing concentric circles, *Aesthetic Theory* carries out a dialectical double reconstruction. It reconstructs the modern art movement from the perspective of philosophical aesthetics, and it simultaneously reconstructs philosophical aesthetics, especially that of Kant and Hegel, from the perspective of modern art. From both sides Adorno tries to elicit the sociohistorical significance of the art and philosophy discussed. One could argue that Adorno’s theory of modernism encompasses his philosophical writings as a whole: aesthetics, epistemology, metaphysics, practical and social philosophy, in their relationship to modernity (Hammer 2015; Foster 2016)[^foster-2016][^hammer-2015].
    step1: TBD
    step2: TBD
