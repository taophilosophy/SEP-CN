      阿多诺的否定主义把逻辑否定与规范拒斥并在一起：“虚假的”就是不应是的（Theunissen 2007）[^theunissen-2007]。此处的一个前奏，是阿多诺思想中所谓的“规范性缺失”或“规范性问题”。这一批评首由哈贝马斯提出（1987, 119），后被推广为：阿多诺写作中的规范力量，被一个缺失所瓦解——既不知道、也不诉诸任何能为他的规范性主张作辩护的规范或标准（《启蒙辩证法》中理性明显的自我拆台即是一例）。在道德语境中，最强的解读（Freyenhagen 2013）[^freyenhagen-2013]认为阿多诺主张：社会是“根本恶的”（“实质否定主义”），在当下的社会历史语境中，人对善的生活或正当的生活不可能有任何知识（“认知否定主义”），但对恶的知识本身就足以给社会批判提供某种规范力量（“元伦理否定主义”）。因此，“生活已不复存在”；“错误的生活中不存在正确的生活[*Es gibt kein richtiges Leben im falschen*]”；“总体是虚假的”（1951a [2005, 15, 39, 50]）；“生活本身被扭曲变形至此，以至于无人能在其中过良善的生活、或实现其作为人的天命”（1963b [2000, 167]）。在这种处境下，人所能做的只是力求生活得“较少错误”：认识恶、内在地批判恶、抵抗恶（Freyenhagen 2013 与 Setiya 2023 都以新亚里士多德主义伦理自然主义的版本从事此项工作）[^freyenhagen-2013][^freyenhagen-2023]。较温和的解读则主张：阿多诺识别并阐明了幸福与伦理善的离散经验——例如理想化的童年追忆、“形而上学的”经验与审美经验——它们可以充当规范性的经验来源，却不承担辩护的力量（Gordon 2024）[^gordon-2024]；或者：阿多诺迂回的写作意在唤起而不点名那些可充当规范性基础的洞见（Finlayson 2002）[^finlayson-2002]；或者：阿多诺那沉思性的、现象学的对象性经验本身即带有积极的规范力量（Seel 2004；Richter 2019）[^richter-2019][^seel-2004]。
