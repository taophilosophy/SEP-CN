      In the first essay Adorno wrote in the USA, “On the Fetish Character in Music and the Regression of Listening,” he develops the idea of fetish, from Marx’s commodity fetishism, in light of the workings of radio music and music recordings, which he studied while working for Paul Lazarsfeld and the Princeton Radio Project. The “fetish character” Adorno emphasized comprised the fact that hit songs are evaluated based on the profit they bring as much as the quality of the song, and the fact that consumers listen “regressively,” that is, passively to discrete sensory effects without active intellectual engagement with the product as a complex whole (1938 [1991, 32–3]). Nor is it simply a matter of culturally produced ideological blindness requiring consciousness-raising, as in the earlier stage of capitalism; consumers see through the deception but self-preservation leads them to reify themselves to better adapt to the social totality anyways. In this way too the culture industry “impedes the development of autonomous, independent individuals who judge and decide consciously for themselves” (1967a [1991,104–6]; cf. 1947 [2002, 135–6]). Subsequent commentators have sought to elaborate the cognitive and psychological complexities at work in Adorno’s account of consumers’ reception and in light of arguably changed cultural conditions (Cook 1996; Gunster 2000)[^cook-1996]. Thanks to these complexities, Horkheimer and Adorno see fleeting possibilities for resistence within the integration of culture, for instance in an archaic layer of “stubbornly purposeless” activities such as the carnivalesque energy of the circus and the absurdity in writings by authors like Mark Twain (1947 [2002, 113–114]), in inchoate gestures of self-determination in choosing among the pseudo-individualized options (Mariotti 2016)[^mariotti-2016], and in montage and other techniques of discontinuity in avant-garde film (Hansen 2012; De la Fuente 2021)[^hansen-2012].
    step1: |-
      在阿多诺于美国写的第一篇论文《论音乐中的拜物特性与听觉的退化》中，他立足广播音乐与音乐唱片的运作——他为保罗·拉扎斯菲尔德（Paul Lazarsfeld）与普林斯顿广播研究项目工作期间对之有所研究——发展了来自马克思商品拜物教的拜物观念。阿多诺强调的“拜物特性”包含两点：流行金曲的评价既看歌曲质量、也看其带来的利润；消费者的聆听是“退行性的”，即被动地听取离散的感官效果，而不主动地以智识投入去把握作为复杂整体的产品（1938 [1991, 32–3]）。这也不单纯是文化制造的意识形态盲目、有待意识提升的问题——资本主义早期阶段是那样；消费者看穿了欺骗，但自我保存促使他们把自己物化，以便更好地适应社会总体。在这层意义上，文化工业同样“阻碍自主而独立的个体的发展，这类个体能有意识地自行判断与决定”（1967a [1991,104–6]；参看 1947 [2002, 135–6]）。后来的评论者着手阐发阿多诺关于消费者接受之说明中的认知与心理复杂性，并参照已 arguably 变化的文化条件（Cook 1996；Gunster 2000）[^cook-1996]。多亏这些复杂性，霍克海默与阿多诺在文化的整合之内看到转瞬即逝的抵抗可能：例如“顽固地无目的”活动的古老层次——马戏团狂欢式的能量、马克·吐温一类作者笔下的荒诞（1947 [2002, 113–114]）；在伪个体化的诸选项之间作选择时未成形的自决姿态（Mariotti 2016）[^mariotti-2016]；以及先锋电影中的蒙太奇与其他不连续技巧（Hansen 2012；De la Fuente 2021）[^hansen-2012]。
    step2: |-
      阿多诺在美国写的第一篇论文，是《论音乐中的拜物特性与听觉的退化》。他在这篇文章里发展了来自马克思商品拜物教的拜物观念。所依据的，是广播音乐与音乐唱片的运作——他为保罗·拉扎斯菲尔德（Paul Lazarsfeld）与普林斯顿广播研究项目工作期间，对之有切身研究。他强调的“拜物特性”包含两点：其一，流行金曲的评价既看歌曲质量，也看其带来的利润；其二，消费者的聆听是“退行性的”：被动地听取离散的感官效果，并不主动以智识投入去把握作为复杂整体的产品（1938 [1991, 32–3]）。这也不单纯是文化制造的意识形态盲目、有待意识提升的问题——资本主义早期阶段才如此；消费者看穿了欺骗，但自我保存促使他们把自己物化，以便更好地适应社会总体。在这层意义上，文化工业同样“阻碍自主而独立的个体的发展，这类个体能有意识地自行判断与决定”（1967a [1991,104–6]；参看 1947 [2002, 135–6]）。后来的评论者着手阐发阿多诺关于消费者接受之说明中的认知与心理复杂性，并参照已经发生——无论是否有争议——变化的文化条件（Cook 1996；Gunster 2000）[^cook-1996]。多亏这些复杂性，霍克海默与阿多诺在文化的整合之内看到转瞬即逝的抵抗可能。其一，“顽固地无目的”活动的古老层次——马戏团狂欢式的能量、马克·吐温一类作者笔下的荒诞（1947 [2002, 113–114]）；其二，在伪个体化的诸选项之间作选择时未成形的自决姿态（Mariotti 2016）[^mariotti-2016]；其三，先锋电影中的蒙太奇与其他不连续技巧（Hansen 2012；De la Fuente 2021）[^hansen-2012]。
