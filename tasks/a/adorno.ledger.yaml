      Adorno outlines an alternative theory that maintains the necessary inseparability of form and content and claims “through language history wins a share of truth” because “history and truth meet in the word” (1930s [2007, 35, 36]) according to the ideal of an objective unity of material reality and linguistic expression in the unique “name” for each thing. This “linguistic reality” has historically become divided into the “double character of language”: conceptualist, representational or significatory use (“communicability”) and a non-conceptual, evocative or gestural use (which Adorno will later call “expression” [*Ausdruck*] and associate with mimetic behavior and art). That is, “concrete, objective” material history has become sedimented in linguistic form, and “truth,” which Adorno conceives as disclosure and as having an historically indexed epistemic access, is revealed by the philosopher’s “hitting upon the word in which such truth dwells at the historical hour” (ibid., 36). In contrast to the “scientific dualism” of word and thing, formal logic and inference, Adorno calls for an explicitly “aesthetic” method of “configurative language”: “a dialectically intertwined and explicatively indissoluable unity of concept and thing” (ibid., 38) which makes disclosive truth possible. In *Negative Dialectics* he captures this idea with the claim that “In dialectics … the rhetorical element is on the side of content” (1966a [1973, 41]). Recent scholarship has attempted to bring Adorno’s thinking about language (and rationality) into critical discussion with certain Wittgensteinian, pragmatist, and neo-Hegelian strains of anglophone philosophy (Demmerling 1994; Bernstein 2001, 2004; Bowie 2013; Hogh 2017; Freyenhagen 2023)[^bernstein-2001][^bowie-2013][^demmerling-1994][^freyenhagen-2023][^hogh-2017].
    step1: |-
      阿多诺勾画了一种替代理论，主张形式与内容必然不可分离，并提出“透过语言，历史赢得一份真理”，因为“历史与真理在词语中相遇”（1930s [2007, 35, 36]）——这是就物质实在与语言表达在每一事物的独特“名称”中客观统一这一理想而言。这一“语言的实在”在历史中分裂为“语言的双重性格”：概念主义的、表象性的或意指性的使用（“可传达性”），与非概念的、唤起性的或姿态性的使用（阿多诺后来称之为“表现”[*Ausdruck*]，并将其与模仿行为及艺术联系起来）。也就是说，“具体的、客观的”物质历史已经沉淀于语言形式之中；而阿多诺所构想的“真理”——作为开显、并具有历史索引的认识通道——则由哲学家“在历史的时刻碰上这种真理栖居于其中的那个词”而得到揭示（同上，36）。与词语与事物、形式逻辑与推理的“科学二元论”相反，阿多诺呼唤一种明确“审美的”方法，即“构型语言”：“概念与物之间辩证地交织在一起、又在阐释上不可分解的统一”（同上，38），正是它使开显性的真理成为可能。在《否定的辩证法》中，他用如下命题概括了这一观念：“在辩证法中……修辞的要素站在内容一边”（1966a [1973, 41]）。近来的学术研究试图把阿多诺关于语言（与合理性）的思考，带入与英语哲学中某些维特根斯坦式、实用主义与新黑格尔主义路数的批判性对话（Demmerling 1994；Bernstein 2001, 2004；Bowie 2013；Hogh 2017；Freyenhagen 2023）[^bernstein-2001][^bowie-2013][^demmerling-1994][^freyenhagen-2023][^hogh-2017]。
