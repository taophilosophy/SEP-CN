      While studying composition with Eduard Steuermann in Frankfurt and then with Alban Berg in Vienna, Adorno was also fulfilling the institutional requirements to become an academic. Hitler’s seizure of power and the Nuremberg racial laws put an abrupt end to those plans and forced him to leave Germany, but several of his pre-exile writings during the 1930s, strongly influenced by Siegfried Kracauer, Georg Lukács, and above all Walter Benjamin, are significant for understanding his overall philosophy (Buck-Morss 1977)[^buck-morss-1977].
    step1: |-
      阿多诺先在法兰克福随爱德华·施托伊尔曼（Eduard Steuermann）、后在维也纳随阿尔班·贝尔格学习作曲，与此同时，他也在完成进入学术体制所需的各项要求。希特勒攫取政权与纽伦堡种族法骤然终结了这些计划，迫使他离开德国；但他在 1930 年代流亡之前的若干著述，深受齐格弗里德·克拉考尔、格奥尔格·卢卡奇，尤其是瓦尔特·本雅明的影响，对理解他的整体哲学意义重大（Buck-Morss 1977）[^buck-morss-1977]。
    step2: |-
      阿多诺一边在法兰克福随爱德华·施托伊尔曼（Eduard Steuermann）、继而在维也纳随阿尔班·贝尔格学习作曲，一边也在完成跻身学院体制所需的各项功课。希特勒攫取政权与纽伦堡种族法让这些计划戛然而止，也迫使他离开德国。不过，他 1930 年代流亡之前的几篇著述——深受齐格弗里德·克拉考尔、格奥尔格·卢卡奇，尤其是瓦尔特·本雅明的影响——对理解他的整体哲学至关重要（Buck-Morss 1977）[^buck-morss-1977]。
