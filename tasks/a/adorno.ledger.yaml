      What unifies all of these desiderata, and what most clearly distinguishes Adorno’s materialist epistemology from “idealism,” whether Kantian or Hegelian, is his emphasis on the “priority of the object” (*Vorrang* *des Objekts*, ibid., 183–97). Adorno regards as “idealist” any philosophy that affirms an identity between subject and object by assigning constitutive priority to the epistemic subject. In emphasizing the priority of the object, Adorno repeatedly makes three claims: first, that the epistemic subject is itself objectively constituted by the society to which it belongs and without which the subject could not exist; second, that no object can be fully known according to the rules and procedures of identity thinking; third, that the goal of thought itself, even when thought forgets its goal under societally induced pressures to impose identity on objects, is to honor them in their nonidentity, in their difference from what a restricted rationality declares them to be. Against empiricism, however, he argues that no object is simply “given” either, both because it can be an object only in relation to a subject and because objects are historical and have the potential to change. However, such “real possibilities” (currently realizable transformations) are obscured by ideological obstructions such society’s “context of delusion” (*Verblendungszusammenhang)* and utopia conceived as merely abstract wishful thinking within second nature as fate (Macdonald 2019a, 23–55)[^macdonald-2019a].
    step1: |-
      把这些要求统一起来、并最清楚地把阿多诺的唯物主义认识论与“唯心论”——无论康德式还是黑格尔式——区分开来的，是他强调“对象的优先性”（*Vorrang* *des Objekts*，同上，183–97）。阿多诺把任何通过赋予认识主体以构成性优先地位来肯定主体与对象之间同一性的哲学，都看作“唯心论的”。在强调对象的优先性时，阿多诺反复提出三个主张：其一，认识主体本身被它所属的社会客观地构成，没有这个社会主体便无法存在；其二，任何对象都不可能按同一性思维的规则与程序被完全认识；其三，思想本身的目标——即便思想在社会诱发的压力之下忘记这一目标、去把同一性强加于对象——是在其非同一性中、在其有别于受限理性所宣称之物的差异中尊重它们。然而，反对经验论，他又论证：没有任何对象是单纯“被给予的”，一是因为对象只有在与主体的关系中才是对象，二是因为对象是历史的、有改变的潜能。但是，这类“实在的可能性”（当下可实现的转变）被意识形态障蔽所遮蔽，比如社会的“蒙蔽语境”（*Verblendungszusammenhang*），以及被构想为第二自然之命运内单纯抽象想望的乌托邦（Macdonald 2019a, 23–55）[^macdonald-2019a]。
    step2: |-
