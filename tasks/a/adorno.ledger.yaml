      Adorno offers an alternative, materialist account of freedom implied by his critique of rational autonomy as repression. He locates freedom in the body, as the “memory of an archaic impulse” before the consolidation into an ego (1966a [1973, 221]; 1964–65 [2006, 213]), as what cannot be attributed to rationalistic explanation, but is a spontaneous “addendum” or “supplement” (*das Hinzutretende*), prior to the strict division between mental and somatic, hence “intramental” (1966a [1973, 228]) and that, in principle, could be reconciled with reason and a subjectivity properly understood. This alternative conception of freedom has implications for morality: “A new categorical imperative has been imposed by Hitler upon unfree mankind: to arrange their thoughts and actions so that Auschwitz will not repeat itself, so that nothing similar will happen. … the new imperative gives us a bodily sensation of the moral addendum – bodily, because it is now the practical abhorrence of the unbearable physical agony … It is in the unvarnished materialistic motive only that morality survives” (1966a [1973, 365**]**). “The true primal phenomenon of moral behavior” “occurs when the element of impulse joins with the element of consciousness to bring about a spontaneous act” (1964–65 [2006, 240]), for which Adorno adduces the example of one of the conspirators in the 1944 plot to assassinate Hitler. How exactly to understand this model of practical action has been a topic of careful discussion, as Adorno clearly acknowledges the necessary role of reason (Schweppenhäuser 1993; Bernstein 2001; Freyenhagen 2013, 133–61; Shuster 2014, 71–133)[^bernstein-2001][^freyenhagen-2013][^schweppenhäuser-1993][^shuster-2014]. Less a systematic moral theory, Adorno’s call for the unconditional adherence to the moral impulse in part operates in response to Kantian moral rationalism and Adorno’s critique of “bourgeois coldness” (1951a [2005, 26, 74]; 1966a [1973, 263, 347]), the adaptive diminution of empathy and affection that modern society requires, and offers interesting prospects for considering this strain of his ethical thought as a social-historically contextualized ethics of care (Ferrarese 2021)[^ferrarese-2021].
