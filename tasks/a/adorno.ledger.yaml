      Adorno regards authentic works of (modern) art as social monads: somehow representing society while causally isolated from it. The unavoidable tensions within them express unavoidable conflicts within the larger sociohistorical process from which they arise and to which they belong. These tensions enter the artwork through the artist’s struggle with sociohistorically laden materials (historically sedimented artistic techniques as well as empirical, social elements) to create the artwork’s individual form (Nicholsen 1997; Geuss 1999; Robinson 2018; Pickford 2020)[^geuss-1999][^nicholsen-1997][^pickford-2020][^robinson-2018]. Adorno sees all of these tensions and conflicts as “contradictions” to be worked through and eventually to be resolved. Their complete resolution, however, would require a transformation in society as a whole, which, given his social theory, does not seem imminent.
    step1: |-
      阿多诺把（现代）艺术的本真作品看作社会单子：以某种方式表现社会，又在因果上与社会隔离。作品内部无可回避的诸张力，表现着它们由之产生、又隶属其中的更大社会历史进程内部无可回避的诸冲突。这些张力经由艺术家与社会历史负载的材料（历史沉淀的技艺以及经验的社会要素）的搏斗而进入作品，以创造作品的个体形式（Nicholsen 1997；Geuss 1999；Robinson 2018；Pickford 2020）[^geuss-1999][^nicholsen-1997][^pickford-2020][^robinson-2018]。阿多诺把所有这些张力与冲突看作有待处理、并终将得到解决的“矛盾”。然而，它们的完全解决，将要求整个社会的转变；而照他的社会理论，这一转变并不迫近。
