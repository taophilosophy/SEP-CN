      The central claims of the book are that myth and enlightenment, traditionally held to be mutually exclusive concepts governing successive stages in Hegelian historiography, are actually entangled at each stage of reason’s development. Thus the two theses, “myth is already enlightenment, and enlightenment reverts to mythology” (ibid,, xviii), are expounded via an anthropologically inflected periodization. In prehistory, “neither [the unity of nature] nor the unity of the subject was presupposed” (ibid., 6), rather there is a fluidity between them governed by mimesis, “the organic adaption to otherness”: the human seeks to resemble nature by embodying particular qualities (ibid., 148; on the concept of mimesis, see Früchtl 2024)[^früchtl-2024]. Driven by self-preservation in the face of “mythic fear,” rituals develop which rely on sacrificial substitution (say, a hind for a daughter) to propitiate the gods and control, dominate nature, thereby inaugurating representation, exchangeability, abstraction: “The substitution which takes place in sacrifice marks a step towards discursive logic” (ibid., 6). The tendency intensifies during the historical Enlightenment, in which Kantian epistemology envisages a world of sensuous particulars given in intuition that are subsumed as mere instances under universal concepts operative in abstract laws of nature: what Adorno comes to call “identity-thinking” (Bernstein 2001, 75–234)[^bernstein-2001]. The result is “the single relationship between the subject who confers meaning and the meaningless object, between rational signification and its accidental bearer” and a closed world of immanence: “Just as myths already entail enlightenment, with every step enlightenment entangles itself more deeply in mythology… The principle of immanence, the explanation of every event as repetition, which enlightenment upholds against mythical imagination, is that of myth itself” (ibid., 7, 8). This development also entails the polarization between science/technology and art: “as sign [in science], language must resign itself to being calculation and, to know nature, must renounce the claim to resemble it. As image it must resign itself to being a likeness and, to be entirely nature, must renounce the claim to know it” (ibid., 13). The image, based on sensuous, qualitative resemblance given in intuition, becomes art, a “refuge” for mimetic comportment (1970 [1997: 53–54]).
    step1: |-
      本书的核心主张是：神话与启蒙——在黑格尔式编史学中被传统地当作支配相继阶段的相互排斥概念——实际上在理性发展的每一阶段都相互纠缠。于是，两个论题“神话已经是启蒙，启蒙又倒退回神话”（同上,, xviii），经由一种带有人类学色彩的分期得到阐发。在史前时期，“[自然的统一与主体的统一]两者都未被预设”（同上，6）；两者之间存在一种流动，受模仿（mimesis）支配，即“对他异性的有机适应”：人以体现特殊性质来求与自然相似（同上，148；论模仿概念，见 Früchtl 2024）[^früchtl-2024]。在“神话恐惧”面前，受自我保存驱使，仪式发展起来，依赖祭献替代（比如以一头母鹿顶替一个女儿）来安抚诸神、控制并支配自然，由此开启了表象、可交换性与抽象：“祭献中发生的替代，标志着朝向推论逻辑的一步”（同上，6）。这一倾向在历史性的启蒙时期愈演愈烈：康德认识论设想了一个由直觉所给予的感性殊例组成的世界，它们作为单纯实例被归摄于抽象自然法则中起作用的普遍概念之下——这就是阿多诺后来所称的“同一性思维”（Bernstein 2001, 75–234）[^bernstein-2001]。其结果是“授予意义的主体与无意义的对象之间的单一关系，理性意指与其偶然承载者之间的单一关系”，以及一个封闭的内在性世界：“正如神话已然蕴含启蒙，启蒙每前进一步，都更深地缠入神话……启蒙为对抗神话想象而坚持的内在性原则——把每一事件解释为重复——正是神话自身的原则”（同上，7、8）。这一发展也带来科学/技术与艺术的极化：“作为符号[在科学中]，语言必须听命于成为计算；为了认识自然，必须放弃与自然相似的要求。作为图像，它必须听命于成为相似物；为了完全是自然，必须放弃认识它的要求”（同上，13）。图像基于直觉中被给予的感性性质相似，成为艺术，成为模仿行为的“避难所”（1970 [1997: 53–54]）。
