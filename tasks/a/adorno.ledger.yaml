      On the other hand, Adorno persistently emphasized the political implications of his theory *as* praxis, e.g. immanent, ideology critique: “[the culture industry] impedes the development [*Bildung*] of autonomous, independent individuals who judge and decide consciously for themselves. These, however, would be the precondition for a democratic society which needs adults who have come of age [*in Mündigen*] in order to sustain itself and develop” (1967a [1991, 105]). Given then the diagnosis of integrated social totality under stated administered monopoly capitalism, reification and the new anthropological type, Adorno in his time sees more hope in capacity building than in direct political action. He invokes the German idealist notion of *Bildung* (socially mediated self-formation, education) to castigate contemporary educational and cultural institutions for purveying a conformist “Half-Bildung”: conveying enough information and relaxation to fulfill society’s functions without inducing any independent thought or personal growth (1959 [1993]). He also invokes Kant’s enlightenment notion of “political maturity” (*Mündigkeit*), the ability to think for oneself, without the guidance of another, and itself a necessary condition for autonomy in the sense of self-determination that, however, can be cultivated even in situations of limited freedom (O’Connor 2013, 130–135)[^o’connor-2013] (against reified consciousness and “coldness” Adorno also speaks of educating toward “unreduced experience”). Cultivating and reinforcing such capacities is “politically necessary,” for “an actual working democracy can only be conceived as a society of politically mature people” (1967d [1971, 107]).
    step1: |-
      另一方面，阿多诺始终坚持其理论*作为*实践的政治意涵，例如内在的意识形态批判：“[文化工业]阻碍自主而独立的个体的发展[*Bildung*]，这类个体能有意识地自行判断与决定。然而，这样的人正是一个民主社会的前提条件——民主社会需要已届成年者[*in Mündigen*]，方能维系自身并发展”（1967a [1991, 105]）。鉴于他对国家管理的垄断资本主义之下整合社会总体、物化与新人类学类型的诊断，阿多诺在其时代更寄望于能力建设，而非直接政治行动。他援引德国观念论的教化（*Bildung*）概念——受社会中介的自我形成与教育——抨击当代教育与文化机构兜售因袭的“半教育”：传递足够的信息与放松以履行社会功能，却不引发任何独立思考或个人成长（1959 [1993]）。他还援引康德启蒙意义上的“政治成熟”（*Mündigkeit*）——不借他人指导而自行思考的能力；这本身是自律（就自我规定而言）的必要条件，却即便在自由受限的处境中也可以培养（O’Connor 2013, 130–135）[^o’connor-2013]（针对物化意识与“冷漠”，阿多诺也谈向“未削减的经验”的教育）。培养并巩固这类能力是“政治上必要的”，因为“一个实际运转的民主，只能被设想为政治成熟的人的社会”（1967d [1971, 107]）。
