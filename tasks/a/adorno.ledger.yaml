      Born on September 11, 1903 as Theodor Ludwig Wiesengrund, Adorno lived in Frankfurt am Main for the first three decades of his life and the last two (Müller-Doohm 2005, Claussen 2008)[^claussen-2008][^müller-doohm-2005]. He was the only child of Oscar Wiesengrund, a wealthy German wine merchant of assimilated Jewish background and Maria Calvelli-Adorno, a devout Catholic of Corsican descent. Maria was an accomplished singer and her sister, Agathe Calvelli-Adorno, who lived with the family, a talented singer and pianist: together they provided Adorno a comfortable, sheltered, and highly cultured childhood. As a young man he read Kant and later philosophers weekly with the family friend and cultural critic Siegfried Kracauer. Adorno studied philosophy with the neo-Kantian Hans Cornelius in Frankfurt and music composition with Alban Berg in Vienna. He completed his *Habilitationsschrift* on Kierkegaard’s aesthetics in 1931, under the supervision of the left-wing socialist and Protestant theologian Paul Tillich and in close intellectual friendship with Walter Benjamin. After just two years as a university instructor (*Privatdozent*), he was expelled by the Nazis, along with other professors of Jewish heritage or on the political left. Through Benjamin in Berlin Adorno met Gretel Karplus; they married in 1937 shortly before emigrating to the United States.
    step1: |-
      阿多诺 1903 年 9 月 11 日生，本名西奥多·路德维希·维森格伦德（Theodor Ludwig Wiesengrund），一生中最初的三十年与最后的二十年都在美因河畔法兰克福度过（Müller-Doohm 2005，Claussen 2008）[^claussen-2008][^müller-doohm-2005]。他是奥斯卡·维森格伦德（Oscar Wiesengrund）的独子；父亲是富裕的德国酒商，出身已同化的犹太家庭；母亲玛丽亚·卡尔维利-阿多诺（Maria Calvelli-Adorno）则是科西嘉裔的虔诚天主教徒。玛丽亚是位造诣不凡的歌唱家；与她同住的外甥女、阿多诺的姨母阿加特·卡尔维利-阿多诺（Agathe Calvelli-Adorno）是才华出众的歌唱家兼钢琴家。她们一道为阿多诺提供了舒适、受庇护而文化气息浓厚的童年。年轻时，他每周与家里的朋友、文化批评家齐格弗里德·克拉考尔（Siegfried Kracauer）共读康德及后世哲学家的著作。阿多诺在法兰克福师从新康德主义者汉斯·科内利乌斯（Hans Cornelius）学哲学，又在维也纳随阿尔班·贝尔格（Alban Berg）学作曲。1931 年，他在左翼社会主义者、新教神学家保罗·蒂利希（Paul Tillich）的指导下完成论克尔凯郭尔美学的教授资格论文（*Habilitationsschrift*），并与瓦尔特·本雅明（Walter Benjamin）结成思想上的密友。他担任大学无俸讲师（*Privatdozent*）仅两年，便与其他犹太裔或政治立场左倾的教授一道被纳粹驱逐。在柏林，经由本雅明介绍，阿多诺结识了格蕾特尔·卡普卢斯（Gretel Karplus）；两人 1937 年成婚，婚后不久便移居美国。
    step2: |-
      阿多诺生于 1903 年 9 月 11 日，本名西奥多·路德维希·维森格伦德（Theodor Ludwig Wiesengrund）；他一生中最初的三十年与最后的二十年都在美因河畔法兰克福度过（Müller-Doohm 2005，Claussen 2008）[^claussen-2008][^müller-doohm-2005]。父亲奥斯卡·维森格伦德（Oscar Wiesengrund）是家境富裕的德国酒商，出身于已同化的犹太家庭；母亲玛丽亚·卡尔维利-阿多诺（Maria Calvelli-Adorno）是科西嘉裔的虔诚天主教徒。母亲是位造诣不凡的歌唱家；同住的家姨阿加特·卡尔维利-阿多诺（Agathe Calvelli-Adorno）是才华出众的歌唱家兼钢琴家。这一家给了阿多诺舒适、受庇护而文化气息浓厚的童年。青年时代，他每周与家中的朋友、文化批评家齐格弗里德·克拉考尔（Siegfried Kracauer）共读康德及后世哲学家的著作。随后，他在法兰克福师从新康德主义者汉斯·科内利乌斯（Hans Cornelius）学哲学，又赴维也纳随阿尔班·贝尔格（Alban Berg）学作曲。1931 年，他在左翼社会主义者、新教神学家保罗·蒂利希（Paul Tillich）指导下完成论克尔凯郭尔美学的教授资格论文（*Habilitationsschrift*），其间与本雅明（Walter Benjamin）结为思想上的至交。他出任大学无俸讲师（*Privatdozent*）仅仅两年，便与其他犹太裔或左倾的教授一同遭纳粹驱逐。在柏林，他经本雅明引介结识了格蕾特尔·卡普卢斯（Gretel Karplus）；两人于 1937 年成婚，随即移居美国。
