      对阿多诺而言，在晚期资本主义的条件下，道德哲学首先是消极的：“关于道德哲学今天是否可能的问题，我唯一能说的是：它在本质上将在于这样一项尝试——把对道德哲学的批判、对其诸选项的批判、对其二律背反的意识变成有意识的”（1963b [2000, 167]）。阿多诺虽考量多种既立的道德哲学，但首要目标是康德的道德哲学——市民时代的哲学。这与阿多诺的“元批判”方法相合：把对一个理论的哲学批判，与其社会历史条件——其“经验意蕴”（*Erfahrungsgehalt*）——的考量编织在一起。在《否定的辩证法》题为“自由，或实践理性的元批判”的模型中，阿多诺试图以唯物主义的方式重铸康德式自律（经由符合理性的理性意志而自我规定的能力）。就个体而言，他倾向于把理性必然性与因果必然性混为一谈，这在哲学上疑点重重（Pippin 2005；Jütten 2010）[^jütten-2010][^pippin-2005]。他还以弗洛伊德式的发展说明取代先验说明（呼应《启蒙辩证法》中的说明）：康德笔下与纯粹理性一同运作、把身体与心理动因置之度外的理性意志，实际上等于“自我经由压抑对本我的统治”（1966a [1973, 273]）。在社会语境中，阿多诺强调：这幅自律图景既合乎一个蒸蒸日上的市民社会的需要，又显示出意识形态的性格——智思与经验的全然分离支撑着纯全理性的意志，却被告发：个体实际上被社会所中介，例如被那些构成自由之真实约束的社会与经济角色所中介（1966a [1973, 152]）；随着晚期资本主义社会在功能上日益整合，这些约束将日益收紧：“自由与不自由不是第一性的现象，而是一个在每个时刻都对个体行使支配的总体性的衍生物”（1964–65 [2006, 207]）。
