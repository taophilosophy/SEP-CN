      《启蒙辩证法》预设了一种得自卡尔·马克思（Karl Marx）与马克斯·韦伯（Max Weber）的批判社会理论。阿多诺把马克思读作一个黑格尔式的唯物主义者：马克思对资本主义的批判，必然同时包含对资本主义所支撑、所要求的诸意识形态的批判。其中最重要的是马克思所谓的“商品拜物教”：“活动的社会性以及产品的社会形式，还有个人在生产中的份额，在这里显现为某种异己的、客观的东西”；“人与人之间确定的社会关系，采取了物与物之间关系的幻象形式”（转引自 Rose 2024, 33）[^rose-2024]。马克思把对商品拜物教的批判对准那些市民社会科学家的做法：他们把资本主义经济径直描述得仿佛一个自然实在，可与此同时，他们既在误述它，又在开列一幅虚假的社会图景。照马克思的说法，市民经济学家必然无视资本主义生产所固有的剥削。他们不明白：资本主义生产尽管表面上“形式自由”、“交换中平等”，却必须从工人阶级被强制的劳动中榨取剩余价值。同资本主义条件下的普通生产者与消费者一样，市民经济学家把商品当作拜物：把它当作一个被积极给予的、中性的对象，仿佛它自带内在价值、直接与其他商品发生关系，而独立于实际维系着一切商品的人与人的互动。马克思则相反地论证：使一个产品成为商品的 whatever，都回溯到人的需要、欲望与实践。商品若不满足人的所欲与所需，就不会有“使用价值”；若无人愿意用它交换别的东西，它就不会有“交换价值”。而它的交换价值之所以能够计算，是因为商品与其他商品共有一种“价值”——这种价值由人类劳动力的耗费所创造，由社会必要劳动时间来度量，而社会必要劳动时间正是从生产各类商品所需的平均具体劳动中抽象出来的。
