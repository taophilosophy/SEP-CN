      Fundamentally, Adorno’s thoughts on morality and moral philosophy remain critical, aporetic, and antinomian, for instance between “principle and practice,” as between legal procedural justice and impulsive vengeance in postwar Germany (1951a [2005, 56]; 1966a [1973, 287]). Principles of rational morality, as in Kant, are tailored to the self-reflection in which the modern autonomous subject engages, which simultaneously separates insight from action, exemplified, for Adorno, by Hamlet (1966a [1973, 228]; 1963b [2000, 112–13]). The moral addendum, as perhaps a rudimentary virtue ethics that immediately connects insight and action, is belied by the obsolescence of virtue (1963b [2000, 98]) under the conditions of modern society: value pluralism on the one hand, and interdependent functional integration to such a degree on the other that an agent’s action can be thwarted or its moral worth inverted by conditions outside their control (what Adorno calls the “context of guilt”, *Schuldzusammenhang*) (Menke 2005)[^menke-2005]. These antinomies illustrate how social conditions undermine moral insight and action, thus Adorno concludes his lecture course: “… anything that we can call morality today merges into the question of the organization of the world. We might even say that the quest for the good life is the quest for the right form of politics, if indeed such a right form of politics lay within the realm of what can be achieved today.” (1963b [2000, 176]).
    step1: |-
      从根本上说，阿多诺关于道德与道德哲学的思考始终保持批判性、困境性与二律背反性，例如在“原则与实践”之间——战后德国的法律程序正义与冲动复仇之间的张力（1951a [2005, 56]；1966a [1973, 287]）。理性道德的原则——如康德那里——量体裁衣于现代自律主体所从事的自我反思；这种自我反思同时把洞见与行动分开，阿多诺以哈姆雷特为例（1966a [1973, 228]；1963b [2000, 112–13]）。道德附加之物——或许是一种直接联结洞见与行动的初步德性伦理学——却被德性的过时（1963b [2000, 98]）所拆穿：现代社会的条件下，一边是价值多元主义，另一边是如此之深的相互依赖的功能整合，以至于行动者的行动可能被其控制之外的条件挫败，或其道德价值被颠倒（阿多诺所谓“罪责语境”，*Schuldzusammenhang*）（Menke 2005）[^menke-2005]。这些二律背反说明社会条件如何破坏道德洞见与道德行动；于是阿多诺如此结束其讲座课程：“……今天凡我们能称作道德的东西，都汇入世界组织的问题。我们甚至可以说：对良善生活的追求，就是对正当政治形式的追求——倘若这样一种正当的政治形式确实在今天所能成就的范围之内。”（1963b [2000, 176]）。
