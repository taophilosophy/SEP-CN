      For Adorno, under the conditions of late capitalism, moral philosophy is first and foremost negative: “On the question of whether moral philosophy is possible today, the only thing I would be able to say is that essentially it would consist in the attempt to make conscious the critique of moral philosophy, the critique of its options and an awareness of its antinomies” (1963b [2000, 167]). While Adorno considers a variety of established moral philosophies, the primary target is Kant’s as the philosophy of the bourgeois age; this is in keeping with Adorno’s method of “metacritique,” which weaves philosophical criticisms of a theory along with considerations of its social-historical conditions, its “experiential import” (*Erfahrungsgehalt*). In the model in *Negative Dialectics* entitled “Freedom, or the metacritique of practical reason,” Adorno seeks to recast Kantian autonomy (the capacity for self-determination via the rational will in accordance with reason) in materialist terms. In the context of the individual, he tends to conflate rational necessity with causal necessity, of dubious philosophical cogency (Pippin 2005; Jütten 2010)[^jütten-2010][^pippin-2005]. He also supplants the transcendental account with a Freudian developmental one (echoing the account in *Dialectic of Enlightenment*), whereby Kant’s picture of the rational will, operating with pure reason and discounting somatic and psychological incentives, amounts to “the ego’s rule over the id” through repression (1966a [1973, 273]). In the societal context Adorno emphasizes that this picture of autonomy accords with the needs of a burgeoning bourgeois society while demonstrating an ideological character: the absolute separation of intelligible and empirical, which underwrites the purely rational will, is belied by the actual mediation of individual by society, e.g. by social and economic roles which constitute real constraints on freedom (1966a [1973, 152]); as late capitalist society becomes increasingly functionally integrated, these constraints will increasingly constrict: “freedom and unfreedom are not primary phenomena, but derivatives of a totality that at any given time exercises dominion over the individual” (1964–65 [2006, 207]).
