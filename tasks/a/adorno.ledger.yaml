      The priority of import also informs Adorno’s stance on art and politics, which derives from debates with Lukács, Benjamin, and Bertolt Brecht in the 1930s (Bloch, Lukács, Brecht et al. 1977; Zuidervaart 1991, 28–43)[^zuidervaart-1991]. Because of the shift in capitalism’s structure, and because of Adorno’s own complex emphasis on (modern) art’s autonomy, he doubts both the effectiveness and the legitimacy of tendentious, agitative, or deliberately consciousness-raising art. Yet he does see politically engaged art as a partial corrective to the bankrupt aestheticism of much mainstream art. Under the conditions of late capitalism, the best art, and politically the most effective, so thoroughly works out its own internal contradictions that the hidden contradictions in society can no longer be ignored. The plays of Samuel Beckett, to whom Adorno had intended to dedicate *Aesthetic Theory*, are emblematic in that regard (Hammer 2015, 132–155)[^hammer-2015].
    step1: |-
      意蕴的优先性也塑造着阿多诺对艺术与政治的立场；这一立场源自 1930 年代与卢卡奇、本雅明、贝托尔特·布莱希特（Bertolt Brecht）的辩论（Bloch, Lukács, Brecht et al. 1977；Zuidervaart 1991, 28–43）[^zuidervaart-1991]。由于资本主义结构的变化，也由于阿多诺自身对（现代）艺术自律的复杂强调，他既怀疑倾向性的、鼓动性的或刻意唤起意识的艺术之效验，也怀疑其正当性。然而，他确实把有政治介入的艺术看作对许多主流艺术那破产的唯美主义的局部矫正。在晚期资本主义的条件下，最好的、也是政治上最有效的艺术，如此彻底地处理其自身的内部矛盾，以至于社会中隐伏的矛盾再也无法被无视。塞缪尔·贝克特（Samuel Beckett）的戏剧在那方面堪称典型；阿多诺原打算把《美学理论》题献给他（Hammer 2015, 132–155）[^hammer-2015]。
    step2: |-
      意蕴的优先性，也塑造了阿多诺对艺术与政治的立场；这一立场源自 1930 年代与卢卡奇、本雅明、贝托尔特·布莱希特（Bertolt Brecht）的辩论（Bloch, Lukács, Brecht et al. 1977；Zuidervaart 1991, 28–43）[^zuidervaart-1991]。资本主义结构变了，加上阿多诺自身对（现代）艺术自律的复杂强调，他对倾向性的、鼓动性的、刻意唤起意识的艺术，既怀疑其效验，也怀疑其正当性。然而，有政治介入的艺术，在他眼里仍是对许多主流艺术那破产的唯美主义的局部矫正。在晚期资本主义的条件下，最好的、也是政治上最有效的艺术，如此彻底地处理其自身的内部矛盾，以至于社会中隐伏的矛盾再也无法被无视。塞缪尔·贝克特（Samuel Beckett）的戏剧在这方面堪称典型——阿多诺原打算把《美学理论》题献给他（Hammer 2015, 132–155）[^hammer-2015]。
