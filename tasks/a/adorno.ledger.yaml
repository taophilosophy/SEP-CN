      ### 7.2 Politics
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      The new categorical imperative encompasses political considerations; according to Adorno, “the misdeeds of Auschwitz were only possible … in a political system in which freedom was completely suppressed” (1964–65 [2006, 202]; Tettlebaum 2005)[^tettlebaum-2005]. However, Adorno did not locate the primary danger at the level of the nature of the state or political organization, claiming that the conditions favoring a relapse continued unabated in postwar democratic West Germany (1967b [2005 191–204]), and he was accused by early critics and some of his own students of quietism, aestheticism, and failing to theorize a normative political theory. For Adorno, “the political” cannot be isolated from the larger, integrated social totality, which permeates and affects every aspect of quotidian life and has implications for how immanent critique can be effectuated (Jaeggi 2005; on “internal” critique, which holds norms fixed, vs. genuine “immanent critique,” which can modify norms, cf. Jaeggi 2018)[^jaeggi-2005][^jaeggi-2018]. His relationship to Marxism and liberalism is complex (Hammer 2006, 11–48): for instance, he rejects the prospects of the formation of class consciousness in “late capitalism,” and does not share liberalism’s neutral standpoint above rival doctrines of the good, nor its image of a ‘thin’ rational individual with contingent preferences (Geuss 2005)[^geuss-2005]; indeed, *Minima Moralia* can be read as critically registering the eclipse of liberalism (Norberg 2011)[^norberg-2011].
