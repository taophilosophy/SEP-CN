      This idea of reconciliation sustains Adorno’s meditations on metaphysics, the final part of *Negative Dialectics*. Metaphysics, understood as thought about what most fundamentally and generally is, reached its culmination as identity thinking in the planned industrial extermination of Auschwitz, which “confirmed the philosopheme of pure identity as death” (ibid., 362). While Kant’s critical method of transcendental idealism had consigned the concepts of dogmatic metaphysics (God, immortal soul, freedom) to the non-empirical, hence unknowable “intelligible realm,” its “constitutive subjectivity,” composed of a priori forms of intuition and categories of the understanding, constitutes a “Kantian block” delimiting possible experience. Like Heidegger, Adorno bristles against the priority of actuality over possibility in the Western metaphysical tradition (Macdonald 2019a, 103–156)[^macdonald-2019a], and so his aim is to rescue and legitimate the metaphysical impulse that Kant acknowledged: the ability of mind to transcend in thought that which is given: “And this thinking beyond itself, into *openness* – that, precisely, is metaphysics” (1965b [2000, 68]). This is one way to understand the role of non-identity and the “primacy of the object” in negative dialectics: as a structural placeholder for whatever leads thought beyond its given forms of cognition: “But the absolute, as it hovers before metaphysics, would be the nonidentical that refuses to emerge until the compulsion of identity has dissolved” (1966a [1973, 406]; Theunissen 2007)[^theunissen-2007]. “Metaphysical experience” is Adorno’s name for the experience of mind’s self-transcendence beyond what is cognitively given: he relates episodes of it in personal childhood reminiscences (e.g., 1966c [2023]), in Proust’s recollection of village names that seemed to promise fulfillment but do not disappoint when they don’t, and in the distinct phenomenology of “the situation of fruitless waiting” (1966a [1973, 372–76]; 1965b [2000, 143]). Metaphysical experience is “akin to the possibility of freedom” (1966a [1973, 396]), a possibility that, Adorno notes, “is tending to become paler and more desultory” (1965b [2000, 143]), part of his general lament of the “withering of experience” due to reification and administered life (1951a [2005, 40]; Skirke 2012, Gordon 2020)[^gordon-2020][^gordon-2020-2][^skirke-2012].
