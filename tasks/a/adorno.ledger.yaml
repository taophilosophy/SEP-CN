      Written by Adorno and Horkheimer from 1939–1944 while in wartime exile in California, *Dialectic of Enlightenment* pursues a critique of reason, society, and the self in Western modernity. An initial, hectographic version, accurately entitled *Philosophical Fragments*, appeared in 1944 in limited quantity. This title became the subtitle when a second version, which mitigated the Marxist, economic vocabulary, was published in 1947 (see editorial apparatus in 1947 [2002, 217–282]). “Adorno frequently mentioned that he saw all his later major writings as excursuses to *Dialectic of Enlightenment*” (Schweppenhäuser 2009, 32)[^schweppenhäuser-2009].
