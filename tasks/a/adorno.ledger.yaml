      In a series of writings Adorno outlined the techniques and mechanisms by which the authoritarian personality is psychologically manipulated by fascist politics (e.g., 1943 [2000], 1951b [1991]). In 2019 Suhrkamp published Adorno’s 1967 talk examining the similar tactics used by the new right-wing party emerging at that time in postwar Germany; the essay became a bestseller (1967c [2020]). *The Authoritarian Personality* has remained a touchstone for social psychology (e.g., Stone, Lederer, and Christie 1993), including contemporary thinkers drawing on Adorno’s work to understand the current rise of popular authoritarianism (Brown, Gordon and Pensky 2018; Abromeit 2022; Weigel 2022)[^abromeit-2022][^weigel-2022].
