      As suggested already in the considerations of how the culture industry’s commodities are consumed, with the concept “dialectical anthropology” (1947 [2002, xix]) Adorno (and Horkheimer) incorporated into his social theory a historically dynamic relationship between subjectivity, as studied by psychoanalysis, and society, as studied by sociology (Dahmer 2012**)[^dahmer-2012]**. Adorno’s explorations of that relationship help explain some aspects of his theory of the authoritarian personality and parts of his account of anti-Semitism.
    step1: |-
      正如前文对文化工业商品如何被消费的考量所示，阿多诺（与霍克海默）借“辩证人类学”概念（1947 [2002, xix]），把主体性——精神分析所研究的——与社会——社会学所研究的——之间的一种历史能动的关系，纳入他的社会理论（Dahmer 2012**）[^dahmer-2012]**。阿多诺对这一关系的探索，有助于解释其权威主义人格理论的某些方面，以及其反犹主义论述的部分内容。
    step2: |-
      前文考量文化工业的商品如何被消费时，已见端倪。阿多诺（与霍克海默）借“辩证人类学”概念（1947 [2002, xix]），把一种历史能动的关系纳入他的社会理论：一端是主体性（精神分析所研究），另一端是社会（社会学所研究）（Dahmer 2012**）[^dahmer-2012]**。阿多诺对这一关系的探索，有助于解释其权威主义人格理论的某些方面，也解释其反犹主义论述的部分内容。
