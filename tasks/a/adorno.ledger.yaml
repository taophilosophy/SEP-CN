      Although Adorno published no systematic treatise on moral philosophy, he gave a lecture course in 1963 posthumously published as *Problems of Moral Philosophy* (1963b [2000]), an earlier lecture course on moral philosophy (1956/57) that has not yet been published, and a 1964–65 lecture course on *History and Freedom* (1964–65 [2006]) that partly deals with practical philosophy; in some ways these texts are preparatory for arguments made in *Negative Dialectics*. Moreover, his works, including but not limited to *Minima Moralia*, are suffused with reflections on normative judgments and even occasional prescriptions such that many readers consider his corpus of writings to be ethical through and through (Bernstein 2001, Seel 2004; to the contrary Tassone 2005)[^bernstein-2001][^seel-2004][^tassone-2005], as the attempt to fathom and respond to the industrial, state-organized mass murder that Adorno consistently invokes with the name “Auschwitz” and which he sees as the culmination of the dialectic of enlightenment, reification and identity thinking that reduces every individual to a “specimen” (1966a [1973, 362]).
    step1: |-
      阿多诺虽未出版系统性的道德哲学专著，但 1963 年他开设了一个讲座课程，身后出版为《道德哲学的问题》（*Problems of Moral Philosophy*）（1963b [2000]）；还有一个更早的道德哲学讲座课程（1956/57），至今尚未出版；另有 1964–65 年关于《历史与自由》的讲座课程（1964–65 [2006]），部分处理实践哲学。在某些方面，这些文本都是《否定的辩证法》中诸论证的准备。此外，他的著作——包括但不限于《最低限度的道德》——充满对规范性判断的反思，甚至偶有规定；因此许多读者认为他的全部著述彻头彻尾是伦理性的（Bernstein 2001，Seel 2004；反对观点见 Tassone 2005）[^bernstein-2001][^seel-2004][^tassone-2005]：那是试图探测并回应工业化的、国家组织的大屠杀——阿多诺一贯以“奥斯维辛”之名提及它，并视之为启蒙辩证法、物化与同一性思维的顶点——它把每个个体还原为一个“标本”（1966a [1973, 362]）。
