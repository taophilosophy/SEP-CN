      The point of thinking in contradictions is not simply negative, however. It has a fragile, transformative horizon, namely, a rationality oriented toward an ideal “noetic” disclosure of the non-identical corresponding to Benjamin’s “hope of the name” (Schnädelbach 2007)[^schnädelbach-2007] and a society that would no longer be riven with fundamental antagonisms, thinking that would be rid of the compulsion to dominate through conceptual identification, and the flourishing of particular objects in their particularity: “Were speculation concerning the state of reconciliation allowed, then it would be impossible to conceive that state as either the undifferentiated unity of subject and object or their hostile antithesis: rather it would be the communication of what is differentiated. … In its proper place, even epistemologically, the relationship of subject and object would lie in a peace achieved between human beings as well as between them and their Other. Peace is the state of differentiation without domination, with the differentiated participating in each other” (1969b [2005, 247]). Because Adorno is convinced that contemporary society has the resources to alleviate the suffering it nevertheless perpetuates, his negative dialectics has a utopian reach: “In view of the concrete possibility of utopia, dialectics is the ontology of the false condition. A right condition would be freed from dialectics, no more system than contradiction” (1966a [1973, 11]). Such a “right condition” would be one of reconciliation between humans and nature, including the nature within human beings, and among human beings themselves.
    step1: |-
      然而，在矛盾中思考的意义不单是消极的。它有一个脆弱的、转变性的视域：一种理性，朝向对非同一之物的理想“智性”开显——对应于本雅明的“名称的希望”（Schnädelbach 2007）[^schnädelbach-2007]；一个不再被根本对立撕裂的社会；一种摆脱了以概念认同施行支配之强迫的思想；以及诸特殊对象在其特殊性中的繁荣：“倘若允许对和解状态的思辨，那就无法把该状态设想为主体与客体的无差分统一，也无法设想为它们敌对的对立：毋宁说，它是被分化者之间的沟通。……在其恰当的位置上，甚至在认识论上，主体与对象的关系将是一种和平：既达成于人与人之间，也达成于人与他们的他者之间。和平是无支配的分化状态，分化者彼此参与其中”（1969b [2005, 247]）。阿多诺深信：当代社会拥有缓解苦难的资源，却仍在延续苦难；因此，他的否定的辩证法带有乌托邦的伸距：“鉴于乌托邦的具体可能，辩证法是虚假状态的存在论。正确状态将摆脱辩证法，既无体系，也无矛盾”（1966a [1973, 11]）。这样一种“正确状态”，将是人与人、人与自然——包括人自身之内的自然——之间和解的状态。
