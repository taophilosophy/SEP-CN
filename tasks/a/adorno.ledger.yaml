      Because the new anthropological type cannot reflectively work through the contradictions and antagonisms of the socio-economic totality, its unconscious anxiety and rage is directed via “false projection” (“the reverse of genuine mimesis,” 1947 [2002, 154]) at those whose stereotyped *imago* remind it of the renunciations and deceptions incurred in its adaption to the totality. This is one of several kinds of explanation of anti-Semitism in Adorno’s writings; the image of the Jew suggests what has partly escaped self-reification: “happiness without power, reward without work, a homeland without frontiers, religion without myth” (ibid., 164–5; Jay 1980; Rabinbach 2000)[^jay-1980][^rabinbach-2000]. In several empirical studies carried out in both the USA and pre- and post-war Germany (Jacobs 2015; Rensmann 2017)[^jacobs-2015][^rensmann-2017], the Institute developed techniques for detecting the existence of this new anthropological type, the most famous of these being the Berkeley study that resulted in *The Authoritarian Personality*: participants were asked questions that indirectly revealed personality propensities according to four metrics: the Anti-Semitism (AS) scale, the Ethnocentrism (E) scale, the Political-Economic Conservativism (PEC) scale, and the fascism (F) scale. Drawing from the analyses in the anti-Semitism chapter of *Dialectic of Enlightenment,* Adorno surmised that qualities such as conventionalism, submissiveness, aggression, aversion to subjectivity and imagination, superstition/stereotypy, toughness, concern with others’ sexuality, etc., indicated a high F-scale score. Several of these qualities, Adorno reasoned, indicated a personality “syndrome” emerging in childhood, hence deeper and prior to political thought and commitment, and auguring a new social type (Marasco 2018)[^marasco-2018]. In a second, unpublished part of his contribution to the *Authoritarian Personality*, Adorno maintained that the personality type could only be fully understood in the context of its societal conditions (Adorno et al., 1950 [2019, xli-lxvi]).
