      This political imperative underwrites Adorno’s work as a public intellectual. Having closely studied and worked with institutions of the culture industry in the USA (Jenemann 2007)[^jenemann-2007], he identified and emphasized moments within the products and technology where incipient gestures of autonomy can be leveraged (Mariotti 2016)[^mariotti-2016]. When he returned to Germany, he pursued public enlightenment (*Aufklärungsarbeit*) through diverse media institutions (magazine essays, radio talks and conversations, television discussions, public lectures); this was the counterpoint to his analyses of modernist artworks by which the “truth content” of social antagonisms can be revealed, but which requires precisely the classical Bildung of which most people are cheated. Politically mature people will “not cooperate” (*nicht* *mitmachen*) or at least be cognizant of the material and ideological dynamics inducing their participation and conformism. In this way Adorno’s theoretical writings and practical activities constitutes an “ethics of resistance” (Hammer 2005; Pickford 2023)[^hammer-2005][^pickford-2023].
    step1: |-
      这一政治命令支撑着阿多诺作为公共知识分子的工作。在美国，他深入研习并合作过文化工业的诸建制（Jenemann 2007）[^jenemann-2007]；他识别并强调产品与技术内部那些可以利用的、初起的自律姿态（Mariotti 2016）[^mariotti-2016]。回到德国后，他经由多元的媒体机构（杂志文章、广播讲话与对话、电视讨论、公开演讲）从事公共启蒙（*Aufklärungsarbeit*）；这构成他对现代主义艺术品之分析的对应面——借后者的分析，社会对立的“真理内容”得以显露，但这恰恰需要大多数人被骗走的古典教化。政治成熟的人将“不合作”（*nicht* *mitmachen），或至少明察诱发其参与与从众的物质与意识形态动力学。由此，阿多诺的理论著述与实践活动构成一种“抵抗的伦理学”（Hammer 2005；Pickford 2023）[^hammer-2005][^pickford-2023]。
