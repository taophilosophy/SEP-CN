      在 1930 年代初一篇身后出版的短文《论哲学家的语言》中，阿多诺确立了一个二难，而他自己的替代性语言理论将免除这一二难。一方面，他拒斥实证主义（或“唯心论”）理论：这些理论把语言形式与内容截然分开，把事物仅仅当作“思想的功能”，亦即概念主义的、工具理性的输入，并因此主张语言意指是“任意的”；“原子化的、分崩离析的社会”的唯心论哲学把真理当作符应，把知识当作主体经由语言对独立对象的意向性“可传达性”。另一方面，他也拒斥海德格尔式的“存在论”新词，因为这些新词脱离具体的历史与社会关系，以及它们沉淀于词语中的方式。
