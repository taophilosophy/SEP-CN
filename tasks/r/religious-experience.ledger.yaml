      The two most important defeaters on the table for claims of the epistemic authority of religious experience are the fact of religious diversity, and the availability of naturalistic explanations for religious experiences. Religious diversity is a prima facie defeater for the veridicality of religious experiences in the same way that wildly conflicting eyewitness reports undermine each other. If the reports are at all similar, then it may be reasonable to conclude that there is some truth to the testimony, at least in broad outline. A version of this objection is the argument from divine hiddenness (cf. Lovering 2013)[^lovering-2013]. If God exists, and shows himself to some people in religious experiences, then the fact that he doesn’t do so for more people, more widely distributed, requires some explanation. Axtell provides another version of that objection. He argues that to insist that one’s own religious convictions are true in the face of the diversity of religions is to reason counter-inductively, and is therefore irrational. The reasoning is counter-inductive because your own convictions come from the same kinds of epistemic sources (investment in testimonial authority) as those you deem to be wrong, so if you are right, it is just a matter of luck. But if two eyewitness reports disagree on the most basic facts about what happened, then it seems that neither gives you good grounds for any beliefs about what happened. It certainly seems that the contents of religious-experience reports are radically different from one another. Some subjects of religious experiences report experience of nothingness as the ultimate reality, some a vast impersonal consciousness in which we all participate, some an infinitely perfect, personal creator. To maintain that one’s own religious experiences are veridical, one would have to a) find some common core to all these experiences, such that in spite of differences of detail, they could reasonably be construed as experiences of the same reality, or b) insist that one’s own experiences are veridical, and that therefore those of other traditions are not veridical. The first is difficult to manage, in the face of the manifest differences across religions. Nevertheless, John Hick (1989) develops a view of that kind, making use of a Kantian two-worlds epistemology. The idea is that the object of these experiences, in itself, is one and the same reality, but it is experienced phenomenally by different people differently. Thus, is possible to see how one and the same object can be experienced in ways that are completely incompatible with one another. This approach is only as plausible as the Kantian framework itself is. Jerome Gellman (2001) proposes a similar idea, without the Kantian baggage. Solutions like these leave the problem untouched: If the different practices produce experiences the contents of which are inconsistent with one another, one of the practices must be unreliable. Alston (1991) and Plantinga (2000) develop the second kind of answer. The general strategy is to argue that, from within a tradition, a person acquires epistemic resources not available to those outside the tradition, just as travelling to the heart of a jungle allows one to see things that those who have not made the journey can’t see. As a result, even if people in other traditions can make the same argument, it is still reasonable to say that some are right and the others are wrong. The things that justify my beliefs still justify them, even if you have comparable resources justifying a contrary view.
    step1: |-
      摆在宗教经验之知识论权威主张面前的两个最重要的击败因子是：宗教多样性的事实，以及宗教经验的自然主义解释的可得性。宗教多样性是宗教经验真实性的初步击败因子，正如彼此严重冲突的目击证词相互削弱一样。如果那些报告还有相似之处，那么得出结论说证言有某种真实性——至少在大致轮廓上——也许就是合理的。这一反驳的一个版本是神圣隐藏的论证（参见 Lovering 2013）[^lovering-2013]：如果上帝存在，并在宗教经验中向某些人显现自己，那么他没有向更多的人、在更广的分布中这样做，这一事实就需要某种解释。Axtell 给出了这一反驳的另一个版本。他论证说，面对宗教的多样性而坚持自己的宗教信念为真，是在作反归纳的推理，因此是非理性的。之所以是反归纳的，是因为你自己的信念来自与你认为错误的那些信念同类的知识论来源（对证言权威的投入），所以如果你是对的，那纯属运气。但如果两份目击证词就所发生之事的最基本事实意见相左，那么看来两者都不能为关于所发生之事的信念提供好根据。宗教经验报告的内容看来确实彼此截然不同。有些宗教经验的主体报告经验到空无是终极实在，有些报告一个我们全都参与其中的巨大的非人格意识，有些报告一位无限完美的位格创造者。要坚持自己的宗教经验是真实的，人们就得：a) 为所有这些经验找到某种共同内核，使得尽管细节有差异，它们仍可合理地被解释为对同一实在的经验；或者 b) 坚持自己的经验是真实的，因此其他传统的经验不真实。面对诸宗教之间显而易见的差异，第一条路很难走通。尽管如此，John Hick（1989）发展了那样一种观点，利用康德式的两界知识论。其想法是：这些经验的对象就其自身而言是同一个实在，但不同的人以现象的方式经验到它时各不相同。由此便可以说明，同一个对象如何能以彼此完全不相容的方式被经验。这一进路的可信度与康德框架本身的可信度相当。Jerome Gellman（2001）提出了一个类似的想法，但不带康德的包袱。这类方案并没有触动问题本身：如果不同的实践产生的经验内容彼此不一致，那么其中必有一个实践是不可靠的。Alston（1991）与普兰丁格（2000）发展了第二类回答。总的策略是论证：从传统内部出发，一个人会获得传统之外的人得不到的知识论资源，正如深入丛林腹地让人看到未曾同行者看不到的东西。由此，即便其他传统中的人能提出同样的论证，说有些人对而另一些人错仍然是合理的。证成我的信念的那些东西仍然证成它们，即使你有可比的资源证成一个相反的看法。
    step2: |-
      宗教经验的知识论权威面临两大击败因子：一是宗教多样性的事实，二是自然主义解释的可得性。宗教多样性的事实，以及宗教经验之自然主义解释的可得性。宗教多样性是宗教经验真实性的初步击败因子——正如互相严重冲突的目击证词彼此削弱。若各报告尚有相似之处，那么断认证言有某种真实性（至少在大致轮廓上）或许还算合理。这一反驳的一个版本是神的隐藏论证（参见 Lovering 2013）[^lovering-2013]：若上帝存在，并在宗教经验中向某些人显现，那么他未曾向更多的人、在更广的人群中显现，这一事实就需要解释。Axtell 给出另一版本：面对宗教多样性仍坚持一己宗教信念为真，是在作反归纳推理，故而非理性。你自己的信念，与被判为错误的那些信念出自同类的知识论来源（对证言权威的投入）：你若是对的，纯属运气。而若两份目击证词就事情的最基本事实相左，两者就都不能为关于此事的信念提供好根据。宗教经验报告的内容看来确实彼此悬殊：有的报告经验到空无为终极实在；有的报告一个众人皆参与其中的巨大非人格意识，有的报告一位无限完美的位格创造者。要坚持自己的宗教经验为真，就得：a) 为所有这些经验找到某种共同内核，使它们尽管细节有异，仍可合理地解作对同一实在的经验；或 b) 坚持自己的经验为真，故其他传统的经验不真。面对诸宗教间显著的差异，第一条路很难走。尽管如此，希克（1989）借康德式两界知识论发展了这样一套观点：这些经验的对象就其自身而言是同一个实在，只是不同的人以现象的方式经验它时各有所得。由此便说得通：同一个对象如何能以彼此完全不相容的方式被经验。这一进路的可信度不会高于康德框架本身。Jerome Gellman（2001）提出过一个类似想法，但不背康德的包袱。这类方案并未触动问题：不同实践产出的经验内容若彼此不一致，其中必有一个实践不可靠。Alston（1991）与普兰丁格（2000）发展了第二类回答，总策略是：身处传统之内的人，会获得局外人得不到的得不到的知识论资源——正如深入丛林腹地者能看到未同行者看不到的东西。于是，即便其他传统中的人能作同样的论证，说有些人对而另一些人错仍属合理。证成我信念的那些东西依然证成它们，哪怕你有可比的资源证成一个相反的看法。
