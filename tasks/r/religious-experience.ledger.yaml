      还有一个进一步的知识论担忧伴随着宗教经验。詹姆斯主张，虽然神秘经验对经历它们的人来说是信念的权威根据，它们却不能给经验被报告给的那个人提供根据。换言之，我的经验是我的证据，但不是你的。Bovens（2012）对这一主张给出了一个现代的扩展与解释。这一主张可以按多种方式理解，取决于所宣称的证据关系带有哪种规范性。有些人（例如见 Oakes 1976）[^oakes-1976]主张宗教经验在知识论上能必然化信念；也就是说，任何有此经验却不形成相应信念的人都在犯一个知识论错误，就像一个在正常条件下拒绝相信自己眼睛的人。更常见的是，宗教经验之知识论价值的辩护者主张，这些经验使形成信念在知识论上得到允许，但你仍然可以有理由不形成该信念。他人关于其所经验的证言大体相同。在某些情形中，一个人拒绝他人证言会是不合理性的；在另一些情形中，接受证言是合理性的，但无须接受。于是，假定经验的主体有理由基于自己的经验形成一个宗教信念、并且把这事告诉了别人，我们就剩下三种可能：证言也许为听者提供强迫性的证据，以至于他拒绝该主张就会是不合理性的；证言也许为听者接受该主张提供非强迫性的证成；或者证言也许不能为听者接受该主张提供任何根据。当主体基于一个寻常经验作出主张时，视主张的内容与听者的知识论处境，它可以落入这三类中的任何一类。关于宗教经验主张，最自然的说法是：它们以同样的方式起作用（假定它们给予作出主张的经验主体其信念的某种证成）。詹姆斯及其后的某些人主张，关于宗教经验的证言不能落入前两类中的任何一类。如果这是真的，那必定是因为这些经验的本性有某种特殊之处。如果我们假定这些经验不能被*先验地*表明有缺陷，并且宗教语言是可理解的——而如果我们不作这些假定，宗教证言的问题根本不会产生——那么必定是因为经验的证据价值太小，经不起向他人的传递；也就是说，必定是因为在向他人报告经验的寻常行为中，有某个击败因子在起作用，它总是强于经验本身具有的任何证据力量。尽管寻常感官经验与宗教经验之间存在重要差异（经验的清晰度、它所含信息量、竞争性解释的存在等等），这些差异是否大到足以使宗教证言在任何地方都永远不合格，并不清楚。
