      In Theravada Buddhism, the goal of meditation is to “see things as they are,” which is to see them as unsatisfactory, impermanent, and not-self (Gowans 2003, 191)[^gowans-2003]. The meditator, as he or she makes progress along the way, sheds various delusions and attachments. The last one to go is the delusion that he or she is a self. To see this is to see all of reality as made up of sequences of momentary events, each causally dependent on the ones that went before. There are no abiding substances, and no eternal souls. Seeing reality that way extinguishes the fires of craving, and liberates the meditator from the necessity of rebirth (Laumakis 2008, 158–161)[^laumakis-2008]. Seeing things as they are involves removing from the mind all the delusions that stand in the way of such seeing, which is done by meditation practices that develop the meditator’s mastery of his or her own mind. The type of meditation that brings this mastery and allows the meditator to see the true nature of things is called *Vipassana* (insight) meditation. It typically involves some object of meditation, which can be some feature of the meditator him- or herself, some feature of the physical or mental world, or some abstraction, which then becomes the focus of the meditator’s concentration and examination. In the end, it is hoped, the meditator will see in the object the unsatisfactory and impermanent nature of things and that there is no self to be found in them. At the moment of that insight, *nirvana* is achieved. While the experience of nirvana is essentially the realization of a kind of insight, it is also accompanied by other experiential elements, especially of the cessation of negative mental states. Nirvana is described in the Buddhist canon as the extinction of the fires of desire. The Theravada tradition teaches other kinds of meditation that can help the meditator make progress, but the final goal can’t be achieved without *vipassana* meditation.
    step1: |-
      在上座部佛教中，禅修的目标是“如实见”，即把事物看作不如意的、无常的与无我的（Gowans 2003, 191）[^gowans-2003]。禅修者沿这条路取得进步时，逐步摆脱种种错觉与执着，最后放下的是“他是一个自我”这一错觉。看到这一点，就是看到全部实在都由刹那事件串成，每一事件因果地依赖于先前的诸事件。没有恒存的实体，也没有永恒的灵魂。以这种方式看待实在，便熄灭了渴爱之火，把禅修者从再生的必然性中解放出来（Laumakis 2008, 158–161）[^laumakis-2008]。如实见要求从心中清除妨碍这种看见的一切错觉，而这要靠培养禅修者对自己心灵之掌握的禅修实践来完成。带来这种掌握、使禅修者见到事物真实本性的禅修类型称为*内观*（*vipassanā*，insight）禅。它通常有某个禅修对象——可以是禅修者自身的某个特征、物理或精神世界的某个特征，或某个抽象物——它成为禅修者专注与审察的焦点。人们期望，禅修者最终会在这对象中看到事物不如意与无常的本性，看到其中并无自我可得。在那洞见的一刻，*涅槃*达成。涅槃经验本质上是一种洞见的实现，但它也伴随其他经验要素，尤其是负面心理状态的止息。佛典把涅槃描述为贪欲之火的熄灭。上座部传统还教其他有助于进步的禅法，但最终目标离不开 *vipassana*（内观）禅修。
