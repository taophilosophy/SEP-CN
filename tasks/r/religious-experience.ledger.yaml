      A second challenge to religious-experience claims comes from Wittgensteinian accounts of language. Wittgenstein (1978) muses at some length on the differences between how ordinary language is used, and how religious language is used. Others (see Phillips 1970, for example)[^phillips-1970], following Wittgenstein, have tried to give an explanation of the strangeness of religious language by invoking the idea of a language-game. Each language-game has its own rules, including its own procedures for verification. As a result, it is a mistake to treat it like ordinary language, expecting evidence in the ordinary sense, in the same way that it would be a mistake to ask for the evidence for a joke. “I saw God” should not be treated in the same way as “I saw Elvis.” Some even go so far as to say the religious language-game is isolated from other practices, such that it would be a mistake to derive any claims about history, geography, or cosmology from them, never mind demand the same kind of evidence for them. On this view, religious experiences should not be treated as comparable to sense experiences, but that does not entail that they are not important, nor that they are not in some sense veridical, in that they could still be avenues for important insights about reality. Such a view can be attributed to D. Z. Phillips (1970).
    step1: |-
      对宗教经验主张的第二个挑战来自维特根斯坦式的语言观。维特根斯坦（1978）对日常语言的用法与宗教语言的用法之间的差异作了相当长的沉思。另一些人（例如见 Phillips 1970）[^phillips-1970]追随维特根斯坦，试图借语言游戏这个观念来解释宗教语言的奇特。每种语言游戏有自己的规则，包括自己的证实程序。因此，把宗教语言当作日常语言来对待、要求通常意义上的证据，是一个错误，就像要求为一个笑话给出证据是错误一样。“我看见了上帝”不应与“我看见了猫王”以同样的方式对待。有些人甚至走得更远，说宗教语言游戏与其他实践相隔离，以至于从它引出任何关于历史、地理或宇宙学的主张都是错误的，更不用说要求为它们提供同类的证据了。按这种看法，宗教经验不应被当作可与感官经验相比的东西，但这并不意味着它们不重要，也不意味着它们在某种意义上不真实——它们仍可以是通向关于实在之重要洞见的门径。这样一种看法可以归于 D. Z. Phillips（1970）。
