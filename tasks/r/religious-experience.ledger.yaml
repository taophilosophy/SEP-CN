      在大乘佛教传统中，宇宙不断流变这一观念以各种方式得到扩展。对一些派别而言，构成世界之流的那些刹那事件本身也被理解为空无固有存在（不同传统对固有存在的理解不同），以至于在觉悟经验中所见的是一切事物的终极空性（*sunyata*）。在大乘佛教的瑜伽行派中，这被理解为外境之空；也就是说，如实见就是见到一切法皆依心而立。在大乘佛教的禅宗中，觉悟经验（见性，*kensho*）揭示实在不包含任何分别或二元。既然概念与语言总是涉及分别，而分别总是涉及二元，由此获得的洞见便不能以概念的方式达成，也不能以语言表达。在一切大乘宗派中，带来觉悟的是对空作为实在之基本事实的直接领悟。
