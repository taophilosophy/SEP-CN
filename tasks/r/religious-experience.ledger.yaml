      Just as there are a variety of religions, each with its own claims about the nature of reality, there are a variety of objects and states of affairs that the subjects of these experiences claim to be aware of. Much analytic philosophy of religion has been done in Europe and the nations descended from Europe, so much of the discussion has been in terms of God as conceived of in the Jewish, Christian, and Islamic traditions. In those traditions, the object of religious experiences is typically God himself, understood as an eternal, omniscient, omnipotent, free, and perfectly good spirit. God, for reasons of his own, reveals himself to people, some of them unbidden (like Moses, Muhammad, and Saint Paul), and some because they have undertaken a rigorous practice to draw closer to him (like the mystics). To say that an experience comes unbidden is not to say that nothing the subject has done has prepared her, or primed her, for the experience (see Luhrmann 2012)[^luhrmann-2012]; it is only to claim that the subject has not undertaken any practice aimed at producing a religious experience. In such experiences, God frequently delivers a message at the same time, but he need not. He is always identifiable as the same being who revealed himself to others in the same tradition. Other experiences can be of angels, demons, saints, heaven, hell, or other religiously significant objects.
    step1: |-
      正如宗教多种多样、各自有关于实在之本性的主张，这些经验的主体声称觉知到的对象与事态也多种多样。大量的分析宗教哲学是在欧洲及欧洲人的后裔国家作出的，因此许多讨论是围绕犹太教、基督教与伊斯兰教传统所构想的神展开的。在这些传统中，宗教经验的对象典型地是上帝自身，被理解为一个永恒、全知、全能、自由且完全善的灵。上帝出于自己的原因向人们显现自己，有些是不请自来（如摩西、穆罕默德与圣保罗），有些则因为人们施行了严格的修行来亲近他（如神秘主义者）。说一个经验不请自来，并不是说主体所做的任何事情都没有为她准备好或预备好这一经验（见 Luhrmann 2012）[^luhrmann-2012]；这只是主张主体没有施行任何旨在产生宗教经验的修行。在这类经验中，上帝常常同时传递一个信息，但不必如此。他总是可以被辨认出是同一传统中向他人显现过的同一位存在者。其他经验的对象可以是天使、魔鬼、圣徒、天堂、地狱或其他具有宗教意义的对象。
