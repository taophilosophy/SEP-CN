      Alston 发展了一个关于信念实践的一般理论（信念形成机制的星座，连同特有的背景假设与击败因子集），说明了理性地投入这样一种实践是什么意思，然后论证：至少基于基督教宗教经验形成信念的实践满足那些要求。如果我们考察我们目前运用的那些宽泛的信念实践，会发现其中一些可以借其他实践来证成。例如科学实践大多可还原为感官知觉、演绎推理与归纳推理的实践（记忆与证言当然也有贡献）。该实践给予其产品信念的证成地位，来自那些更基本的实践。然而大多数实践不能如此还原。那么它们如何得到证成？看来它们无法被非循环地证成，也就是说，不使用从这些实践自身得出的前提就无法证成。我们继续信任这些实践的惟一证成是：它们牢固确立，与我们的其他实践和事业交织在一起，并且通过产生大体一致的信念集而“经受了时间的考验”。如果这些实践不在中心问题上——无论是内部还是与其他同等确立的实践的输出之间——产生大量的、不可避免的矛盾，它们就产生了一个足够一致的信念集。如果关于我们的寻常实践能说的就这么多，那么我们就应当把同样的地位延伸给具有同样特征的其他实践。然后他论证：基于宗教经验的基督教信念形成实践确实具有那些特征。与普兰丁格一样，他承认这样的论证可能同样适用于其他宗教实践；这全取决于有关的实践是否在中心问题上——无论是内部还是与其他同等确立的实践之间——产生大量不可避免的矛盾。要瓦解这个论证，就得表明要么 Alston 的实践合理性判据过于宽松，要么宗教实践永远逃不出大量矛盾。
