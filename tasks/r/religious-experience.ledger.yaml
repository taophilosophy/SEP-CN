      普兰丁格给出了另一种论证。按笛卡尔式的基础主义，一个信念要算得到证成，要么必须奠基于其他得到证成的信念之上，要么必须从某种特殊地位——如不可谬性、不可矫正性或不可怀疑性——获得其证成。关于知识也有一个平行的看法。普兰丁格（1981）论证说，这样的基础主义与我们把自己关于世界的寻常信念看作得到证成的（或知识）不相容，因为我们从感官经验得来的寻常信念并非从任何不可谬的、不可怀疑的或不可矫正的东西推导而来。事实上，我们通常把它们当作基础性的，无须进一步的证成。如果我们认为感官信念是恰当基本的，那么我们就必须把类似地形成的宗教信念——形成于上帝向信徒显现自身的经验（普兰丁格称之为“M-信念”）——也当作恰当基本的。他提出，人类拥有一种官能——加尔文称之为神圣感知（*sensus divinitatis*）——使他们能够觉知上帝相对于他们的行动或意向。如果由感官经验形成的信念可以是恰当基本的，那么由这种官能形成的信念就不能以任何有原则的方式被否认同样的地位。他发展出来的证成理论（2000）蕴含：如果这些信念为真，那么它们就是得到证成的。人们不先处理宗教主张是否为真的问题，就无法攻击宗教经验的主张。他承认，由于其他宗教传统中有人把关于宗教事情的信念建立在类似的自称显现之上，他们也许能就自己的宗教经验提出同样的论证。
