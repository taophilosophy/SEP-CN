  - id: 1
    kind: body
    source: |-
      Religious experiences can be characterized generally as experiences that seem to the person having them to be of some objective reality and to have some religious import. That reality can be an individual, a state of affairs, a fact, or even an absence, depending on the religious tradition the experience is a part of. A wide variety of kinds of experience fall under the general rubric of religious experience. The concept is vague, and the multiplicity of kinds of experiences that fall under it makes it difficult to capture in any general account. Part of that vagueness comes from the term ‘religion,’ which is difficult to define in any way that does not either rule out institutions that clearly are religions, or include terms that can only be understood in the light of a prior understanding of what religions are. Nevertheless, we can make some progress in elucidating the concept by distinguishing it from distinct but related concepts.
    step1: |-
      宗教经验一般可以这样刻画：它们对经历者来说显得是关于某种客观实在的经验，并且具有某种宗教意涵。这种实在可以是一个个体、一种事态、一个事实，甚至是一种缺席，取决于该经验所属的宗教传统。各种各样的经验都可以归入宗教经验这个总目之下。这个概念是含混的，归入其下的经验种类之多，使得很难用任何一般性的说明来把握它。这种含混部分来自“宗教”一词：要给宗教下定义而不排除明显是宗教的制度，或不掺入只有先理解了宗教是什么才能理解的语词，是很困难的。尽管如此，我们仍可以通过把宗教经验与一些不同但相关的概念区分开来，在阐明这一概念上取得一些进展。
    step2: |-
      宗教经验大致可以这样刻画：对经历者而言，它们显得是关于某种客观实在的经验，且带有某种宗教意涵。这种实在可以是一个个体、一种事态、一个事实，甚至是一种缺席——全看该经验属于哪个宗教传统。五花八门的经验都可归入“宗教经验”这个总目。这个概念是含混的；归入其下的经验种类繁多，任何一般性说明都难以尽收。这种含混部分源自“宗教”一词：给宗教下定义，若不把明显是宗教的制度排除在外，就难免掺入只有先懂宗教是什么才能懂的语词——两头都难。尽管如此，把宗教经验与几个不同而相关的概念区分开来，仍能让我们在阐明这一概念上有所推进。
  - id: 2
    kind: body
    source: |-
      First, religious experience is to be distinguished from religious feelings, in the same way that experience in general is to be distinguished from feelings in general. A feeling of elation, for example, even if it occurs in a religious context, does not count in itself as a religious experience, even if the subject later comes to think that the feeling was caused by some objective reality of religious significance. An analogy with sense experience is helpful here. If a subject feels a general feeling of happiness, not on account of anything in particular, and later comes to believe the feeling was caused by the presence of a particular person, that fact does not transform the feeling of happiness into a perception of the person. Just as a mental event, to be a perception of an object, must in some sense seem to be an experience *of* that object, a religiously oriented mental event, to be a religious experience, must in some way seem to be an experience *of* a religiously significant reality. So, although religious feelings may be involved in many, or even most, religious experiences, they are not the same thing. Discussions of religious experience in terms of feelings, like Schleiermacher’s (1998) “feeling of absolute dependence,” or Otto’s (1923) feeling of the numinous, were important early contributions to theorizing about religious experience, but some have since then argued (see Gellman 2001 and Alston 1991, for example)[^alston-1991][^gellman-2001] that religious affective states are not all there is to religious experience. To account for the experiences *qua* experiences, we must go beyond subjective feelings.
    step1: |-
      首先，宗教经验必须与宗教感受区分开来，正如一般意义上的经验必须与一般意义上的感受区分开来。例如，一种欣快之感，即便发生在宗教语境中，本身也不算宗教经验，即使主体后来认为这种感受是由某个具有宗教意义的客观实在引起的。这里用感官经验作个类比会有帮助。如果主体感到一种一般性的快乐，不是因为任何特殊的东西，后来又相信这种快乐是由某个特定的人在场引起的，这一事实并不会把快乐之感变成对那个人的知觉。正如一个心理事件要成为对一个对象的知觉，就必须在某种意义上显得是关于那个对象的经验，一个带有宗教取向的心理事件要成为宗教经验，也必须以某种方式显得是关于某个具有宗教意义的实在的经验。所以，尽管宗教感受可能卷入许多、甚至大多数宗教经验，它们并不是一回事。以感受来讨论宗教经验，如施莱尔马赫（1998）的“绝对依赖感”，或奥托（1923）的努秘（numinous）之感，是关于宗教经验理论化的重要早期贡献，但此后有些人论证说（例如见 Alston 1991 与 Gellman 2001）[^alston-1991][^gellman-2001]，宗教性的情感状态并不是宗教经验的全部。要说明经验之为经验，我们必须超出主观感受。
    step2: |-
      首先，宗教经验须与宗教感受区分开来，正如一般意义上的经验须与一般意义上的感受相区分。例如，一阵欣快之感，即便发生在宗教语境里，本身并不算宗教经验——哪怕主体事后认为这感受是某个具有宗教意义的客观实在引起的。这里借感官经验作个类比会有帮助：假如主体感到一种说不清缘由的快乐，事后又相信这是某个特定的人在场所致；这一事实并不会把快乐之感变成对那个人的知觉。一个心理事件要成为对某对象的知觉，就必须在某种意义上显得是关于该对象的经验；同理，一个带有宗教取向的心理事件要成为宗教经验，也必须以某种方式显得是关于某个具有宗教意义的实在的经验。所以，尽管宗教感受可能卷入许多、甚至大多数宗教经验，二者并不是一回事。以感受来讨论宗教经验——如施莱尔马赫（1998）的“绝对依赖感”、奥托（1923）的努秘（numinous）之感——是宗教经验理论化的重要早期贡献；但此后有人论证（例如见 Alston 1991 与 Gellman 2001）[^alston-1991][^gellman-2001]：宗教性的情感状态并非宗教经验的全部。要说明经验之为经验，我们必须超出主观感受。
  - id: 3
    kind: body
    source: |-
      Religious experience is also to be distinguished from mystical experience. Although there is obviously a close connection between the two, and mystical experiences are religious experiences, not all religious experiences qualify as mystical. The word ‘mysticism’ has been understood in many different ways. James (1902) took mysticism to necessarily involve ineffability, which would rule out many cases commonly understood to be mystical. Alston (1991) adopted the term grudgingly as the best of a bad lot and gave it a semi-technical meaning. But in its common, non-technical sense, mysticism is a specific religious system or practice, deliberately undertaken in order to come to some realization or insight, to come to unity with the divine, or to experience the ultimate reality directly. At the very least, religious experiences form a broader category; many religious experiences, like those of Saint Paul, Arjuna, Moses, Muhammad, and many others come unsought, not as the result of some deliberate practice undertaken to produce an experience.
    step1: |-
      宗教经验还必须与神秘经验区分开来。虽然二者之间显然联系紧密，神秘经验也确实是宗教经验，但并非所有宗教经验都够得上神秘。“神秘主义”一词已被以多种不同的方式理解。詹姆斯（1902）认为神秘经验必然涉及不可言说性，这就会把许多通常被理解为神秘的案例排除在外。Alston（1991）勉强采纳这个词，视之为一批坏选项中最好的一个，并给了它一个半技术的意义。但在其通常的、非技术的意义上，神秘主义是一种特定的宗教体系或实践，人们有意为之，以求达到某种领悟或洞见、与神圣者合一，或直接经验终极实在。至少可以说，宗教经验构成一个更宽的范畴；许多宗教经验——如圣保罗、阿周那、摩西、穆罕默德以及许多其他人的经验——是不请自来的，并非某种旨在产生经验的刻意修行的结果。
    step2: |-
      宗教经验还须与神秘经验相区分。二者显然联系紧密，神秘经验也确属宗教经验，但并非所有宗教经验都够得上“神秘”。“神秘主义”一词向有多种理解：詹姆斯（1902）认为神秘经验必然涉及不可言说性——这会把许多通常算作神秘的案例排除在外；Alston（1991）则勉强采纳此词，视之为一批坏选项里最不坏的，并给它一个半技术的意义。而在通常的、非技术的意义上，神秘主义是一套特定的宗教体系或修行：人有意为之，以求达成某种领悟或洞见、与神圣者合一，或直接经验终极实在。至少可以说，宗教经验是个更宽的范畴——许多宗教经验（如圣保罗、阿周那、摩西、穆罕默德等人的经验）不请自来，并不是刻意修行以求经验的产物。
  - id: 4
    kind: body
    source: |-
      ## 1. Types of Religious Experience
    step1: |-
      ## 1 宗教经验的类型
    step2: |-
      ## 1 宗教经验的类型
  - id: 5
    kind: body
    source: |-
      Reports of religious experiences reveal a variety of different kinds. Perhaps most are visual or auditory presentations (visions and auditions), but not through the physical eyes or ears. Subjects report “seeing” or “hearing,” but quickly disavow any claim to seeing or hearing with bodily sense organs. Such experiences are easy to dismiss as hallucinations, but the subjects of the experience frequently claim that though it is entirely internal, like a hallucination or imagination, it is nevertheless a veridical experience, through some spiritual analog of the eye or ear (James 1902 and Alston 1991 cite many examples)[^alston-1991][^james-1902].
    step1: |-
      对宗教经验的报告显示出多种不同的类型。也许大多数是视觉或听觉的呈现（异象与异声），但并非通过肉眼或肉耳。主体报告“看见”或“听见”，却随即否认那是用身体感官去看或听。这类经验很容易被斥为幻觉，但经验的主体常常声称：虽然它完全像幻觉或想象一样是内在的，它却仍然是一个真实的经验，是经由眼睛或耳朵的某种灵性类似物而发生的（James 1902 与 Alston 1991 引了许多例子）[^alston-1991][^james-1902]。
    step2: |-
      对宗教经验的报告显示出多种类型。也许最常见的是视觉或听觉的呈现（异象与异声），却不经由肉眼肉耳。主体报告“看见”或“听见”，却随即否认那是用身体感官看或听。这类经验很容易被斥为幻觉；但经验主体往往声称：它虽然像幻觉或想象一样完全是内在的，却仍是真实的经验。其发生之道，据称是眼睛或耳朵的某种灵性对应物（James 1902 与 Alston 1991 引有许多例子）[^alston-1991][^james-1902]。
  - id: 6
    kind: body
    source: |-
      In other cases, the language of “seeing” is used in its extended sense of realization, as when a yogi is said to “see” his or her identity with Brahman; Buddhists speak of “seeing things as they are” as one of the hallmarks of true enlightenment, where this means grasping or realizing the emptiness of things, but not in a purely intellectual way.
    step1: |-
      在另一些情形中，“看见”的语言是在其引申义——领悟——上使用的，例如据说瑜伽行者“看见”自己与梵同一；佛教徒说“如实见”是真正觉悟的标志之一，意指把握或领悟到诸法皆空，但不是纯智性的方式。
    step2: |-
      另一些情形里，“看见”用的是引申义——领悟。例如瑜伽行者据说“看见”自己与梵同一；佛教徒以“如实见”为真觉悟的标志之一——意指把握、领悟到诸法性空，却不是纯智性的把握。
  - id: 7
    kind: body
    source: |-
      A third type is the religious experience that comes through sensory experiences of ordinary objects, but seems to carry with it extra information about some supramundane reality. Examples include experiencing God in nature, in the starry sky, or a flower, or the like. Another person standing nearby would see exactly the same sky or flower, but would not necessarily have the further religious content to his or her experience. There are also cases in which the religious experience just is an ordinary perception, but the physical object is itself the object of religious significance. Moses’s experience of the burning bush, or the Buddha’s disciples watching him levitate, are examples of this type. A second person standing nearby would see exactly the same phenomenon. Witnesses to miracles are having that kind of religious experience, whether they understand it that way or not.
    step1: |-
      第三类宗教经验经由对普通对象的感官经验而来，但似乎附带了对某个超世间实在的额外信息。例子包括在自然中、在星空里、在一朵花或类似之物中经验到上帝。站在近旁的另一个人会看见完全相同的天空或花朵，但他的经验未必定带有这层进一步的宗教内容。还有些情形中，宗教经验恰恰就是一个普通的知觉，只是那个物理对象本身就是宗教意义的对象：摩西对燃烧荆棘的经验，或佛陀的弟子们看他悬浮，都属此类。站在近旁的第二个人会看见完全相同的现象。神迹的目击者所拥有的正是这类宗教经验，无论他们自己是否这样理解。
    step2: |-
      第三类宗教经验经由对普通对象的感官经验而来，却似乎附带关于某个超世间实在的额外信息——例如在自然中、星空下、一朵花或类似之物里经验到上帝。站在一旁的另一人看见完全相同的天空或花朵，其经验却未必带有这层宗教内容。还有些情形：宗教经验恰恰就是一个普通知觉，只是那个物理对象本身即是宗教意义的对象——摩西与燃烧的荆棘、佛陀弟子看他悬浮，皆属此类；站在近旁的第二个人看到的现象完全相同。神迹的目击者拥有的正是这类宗教经验，无论他们自己是否如此理解。
  - id: 8
    kind: body
    source: |-
      A fourth type of religious experience is harder to describe: it can’t be characterized accurately in sensory language, even analogically, yet the subject of the experience insists that the experience is a real, direct awareness of some religiously significant reality external to the subject. These kinds of experiences are usually described as “ineffable.” Depending on one’s purposes, other ways of dividing up religious experiences will suggest themselves. For example, William James (1902) divides experiences into “healthy-minded” and “sick-minded,” according to the personality of the subject, which colors the content of the experience itself. Keith Yandell (1993, 25–32) divided them into five categories, according to the content of the experiences: monotheistic, nirvanic (enlightenment experiences associated with Buddhism), kevalic (enlightenment experiences associated with Jainism), moksha (experiences of release from karma, associated with Hinduism), and nature experiences. Differences of object certainly make differences in content, and so make differences in what can be said about the experiences. See Section 4 for further discussion of this issue.
    step1: |-
      第四类宗教经验更难描述：它无法用感官语言——即便类比地——被准确刻画，然而经验的主体坚称，这是对某种外在于主体的、具有宗教意义的实在的真实而直接的觉知。这类经验通常被描述为“不可言说的”。视论者目的不同，划分宗教经验的其他方式也会浮现。例如，威廉·詹姆斯（1902）依主体的性格把经验分为“健康心态的”与“病态心态的”，主体性格为经验内容本身着色。Keith Yandell（1993, 25–32）则按经验内容把它们分为五类：一神论的、涅槃式的（与佛教相联系的觉悟经验）、kevalic 的（与耆那教相联系的觉悟经验）、moksha 的（与印度教相联系的从业中解脱的经验），以及自然经验。对象的不同当然造成内容的不同，从而造成关于这些经验所能说的话的不同。这一问题进一步见第 4 节。
    step2: |-
      第四类宗教经验更难描述：它无法用感官语言——即便作类比——被准确刻画，但经验主体坚称：这真实而直接地觉知到了某个外在的、具有宗教意义的实在。这类经验通常被称作“不可言说的”。视论者目的，别的划分方式也会浮现。例如威廉·詹姆斯（1902）按主体性格把经验分为“健康心态”与“病态心态”两类，主体性格为经验内容本身着色；Keith Yandell（1993, 25–32）则按经验内容分五类：一神论的、涅槃式的（佛教的觉悟经验）、kevalic 的（耆那教的觉悟经验）、moksha 的（印度教的从业解脱经验）与自然经验。对象不同自然造成内容不同，也就造成关于这些经验能说什么的不同。此问题详见第 4 节。
