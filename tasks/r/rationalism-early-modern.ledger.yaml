      ## 1. Introduction: Conceptualizing ‘Early Modern Rationalism’
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      As noted at the outset, ‘rationalism’ is a historiographical category that refers to a set of views more or less shared by a number of philosophers active in the seventeenth and eighteenth centuries. The following criteria aim to represent a traditional understanding of rationalism that is mainly satisfied by three figures: René Descartes (1596–1650), Baruch Spinoza (1632–1677), and Gottfried Wilhelm Leibniz (1646–1716). It will become clear that these criteria do not apply as straightforwardly to other early modern philosophers, though there is good reason to think that these commitments were shared by more than just three figures. For the sake of narrowing down the scope of ‘rationalism’ to workable parameters, in this entry, to be a rationalist requires at least one of the following commitments:
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      1. A privileging of reason over sensation, imagination, or experience.
      2. A commitment to the existence of innate knowledge/innate ideas.
      3. A commitment to an epistemology wherein certain knowledge plays a role.
      4. A commitment to the idea that reality is ordered in a rational and necessary way that is accessible to human reason.
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      These criteria are primarily epistemological in nature, though it is worth noting that metaphysical issues – particularly involving the ontology of substance – also occupy an important place among philosophers traditionally associated with rationalism. While all of the philosophers traditionally associated with rationalism meet several of these criteria, they also share a metaphysical commitment to the reality of substance as an underlying principle of intelligibility. This metaphysical commitment does not by itself sharpen the account of rationalism, however, since it manifests also in medieval metaphysics and, though not uncritically, in figures associated with early modern ‘empiricism’, such as Thomas Hobbes (1588–1679) and John Locke (1632–1704).
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      Importantly, the traditional division between rationalism and empiricism has been criticized in recent years. For an overview of objections to this distinction, see Dobre and Nydan 2013. Scholars have argued that the labels of ‘rationalism’ and ‘empiricism’ emerged for theoretical and pedagogical ends that are alien to the period they aim to characterize. Theoretically, the division between rationalism and empiricism played an important role in the tradition of German idealism. It provided a simplified narrative of early modern debates in epistemology and metaphysics, which made it possible for followers of Immanuel Kant (1724–1804) to present the critical system as the culmination of modern philosophy (Vanzo 2013, 2016)[^vanzo-2013]. Pedagogically, the division between rationalism and empiricism presents a simplified template for teaching the otherwise diverse history of early modern philosophy. But it also complicates the investigation of hundreds of figures who do not fit cleanly into this narrative. Given the possibility of such ulterior motives, one might wonder whether the labels of ‘rationalism’ and ‘empiricism’ reflect the commitments of philosophers writing in the early modern period at all. This entry acknowledges that these historical categories are open to questioning and welcomes the idea that they ought to be closely scrutinized.
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      Scholars have also criticized the geographical divisions invoked to substantiate the theoretical distinction between rationalism and empiricism. While ‘rationalism’ has been associated with thinkers on the continent of Europe, ‘empiricism’ has been associated with British thinkers – in the historical (colonial) sense, including Ireland. Norton (1981) criticizes this geographical division by noting the crucial role that the French philosopher Pierre Gassendi (1592–1655) played in propagating empiricism during the period (see also Loeb 1981)[^loeb-1981]. Indeed, philosophical crossings from Britain were frequent and fruitful. Many of the figures associated with British empiricism spent periods of time in different parts of continental Europe, and some of the authors discussed in this entry (such as Margaret Cavendish and Anne Conway) spent a majority of their lives in England. The narrative dividing ‘British’ and ‘continental’ theoretical developments holds some historical basis, as in the famous dispute over the development of calculus between the followers of Isaac Newton and Gottfried Wilhelm Leibniz (Hall 1980; Guicciardini 2017)[^guicciardini-2017][^hall-1980]. Yet, this entry suggests that strict geographical divisions are likely to limit and mislead histories of early modern philosophy. This entry drops the appeal to geography in the remainder of the article given that several of the figures discussed are British.
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      ### 1.1 An Instrumentalist Approach to Early Modern Rationalism
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      In recent decades, historians of philosophy have started paying considerable attention to the narratives employed to understand the development of ideas, arguments, and positions over the early modern period. Researchers are becoming increasingly committed to recovering the work of marginalized figures who, due to longstanding narratives originating in the nineteenth and twentieth centuries, are typically overlooked in scholarship. O’Neill (1997) was instrumental in this movement by emphasizing the recovery of women’s contributions to the history of philosophy in particular. It is traditional to tell the story of (European) early modern philosophy in terms of a ‘rationalist versus empiricist’ narrative. Indeed, this narrative is still a dominant one when it comes to *teaching* early modern (European) philosophy. However, increased scrutiny on this traditional narrative has led many scholars to question the *accuracy* of terms like ‘rationalism’ and ‘empiricism’ as descriptive labels. Of course, in general scholars have always been aware that thinkers like Descartes, Leibniz, and Spinoza did not label *themselves* rationalists. Like any ‘ism’-term in the history of philosophy, rationalism is useful insofar as it brings together ideas and thinkers that have important commitments in common (see above for an attempt to identify the criteria for being a ‘rationalist’). Even so, more recent narratives – especially those intended to bring historically under-represented figures (such as women, people of color, and philosophers of non-European descent) into the canon – have placed considerable pressure on whether we ought to continue to talk about ‘rationalists’ at all. An alternative approach might focus on concrete historical connections between early modern philosophers, preferring labels that authors ascribed to themselves (such as ‘Cartesian’).
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      This entry identifies three main approaches to conceptualizing ‘rationalism’ as a historiographical category: realism, eliminativism, and instrumentalism. The realist approach assumes that the criteria for rationalism strictly define a substantive theoretical trend that was genuinely present during the early modern period. The eliminativist approach, by contrast, suggests that these criteria are either inaccurate or overly restrictive in their representation of early modern philosophy. While there are good reasons to interrogate the scope and accuracy of the label ‘rationalism’, this entry adopts an instrumentalist approach to the concept.
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      This entry understands the changing attitudes towards categories such as ‘rationalism’ on the model of *conceptual fragmentation* in the sciences. Taylor and Vickers (2017) identify numerous scientific concepts – such as ‘species’, ‘intelligence’, ‘health’, and ‘chemical bonds’ – about which multiple interpretations have emerged from previously stable definitions (with one underlying meaning). A similar process seems to be underway with traditional historiographical categories. ‘Rationalism’ began as a substantive category that, like a shard of glass placed under increasing pressure, has begun to fragment into new and distinct categories. This pressure might lead to the shattering of the concept altogether, which is suggested by the growing dissatisfaction among teachers and researchers with traditional narratives dividing ‘rationalism’ and ‘empiricism’ (see Gordon-Roth and Kendrick 2015, Vanzo 2015, Shapiro 2016, O’Neill 2019, Detlefsen and Shapiro 2023, and the entry on feminist history of philosophy)[^detlefsen-2023][^gordon-roth-2015][^o’neill-2019][^shapiro-2016][^vanzo-2015]. Indeed, it may appear to future scholars that an entry on rationalism is outdated and unnecessary. At present, however, the category is still in popular use and requires an explanation of how it is standardly used and why one might be skeptical of its continued usage.
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      By adopting an instrumentalist rather than realist or eliminativist approach to the concept, this entry acknowledges but hopes to bracket the concern that ‘rationalism’ is descriptively inaccurate as a category of early modern philosophy (for a similar approach to the historiographical concept of ‘Western Philosophy’, see Moravec and West 2024)[^moravec-2024]. In other words, one might reject the idea that ‘rationalism’ is akin to a natural-kind term that accurately describes the historical situation and configuration of early modern philosophy in Europe. On this interpretation, we should continue to talk about early modern rationalism *only* insofar as it is *helpful* for us to do so – and only *because* it is helpful. Instrumentalists about the concept of rationalism would thus avoid talking as though ‘rationalism’ picks out a stable set of ideas or thinkers from the early modern period. Instead, they would think of it as just one lens through which we can examine what, from a contemporary perspective, brings groups of ideas and thinkers together. It would be a mistake, according to this instrumentalist approach, to think that, in an objective sense, *there was a group of philosophers who were the rationalists.* Questions about whether a particular thinker was *really* a rationalist become less important than questions like ‘why might we call that thinker a rationalist?’ and ‘what is our aim in doing so?’. This is the kind of approach taken in this entry. The criteria identified in the previous subsection are not necessary or sufficient conditions for including a particular philosopher amongst the rationalists. Rather, they should be seen as a cluster of concepts that pick out, at most, a family resemblance between thinkers who share certain metaphysical or epistemological commitments. (As we will find in §3, certain thinkers discussed in this entry do not satisfy some of those criteria.)
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      This approach fits well with a relatively new movement in the historiography of early modern philosophy which argues that it is necessary to retrieve and reassess the contributions of thinkers who are excluded by standard narratives of early modern philosophy (or who are, at best, recognized by these narratives as being of secondary importance: see, e.g., Rutherford 2006; Haakonssen 2007)[^haakonssen-2007][^rutherford-2006]. This push for a renewal opens up the possibility that the early modern philosophical canon that was consolidated for so long may be modified in terms of its authors, its works, and its themes (Vanzo 2016)[^vanzo-2016].
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      In sum, while the notion of rationalism can be a useful heuristic, especially for teaching and learning, it ought not be construed as a strict set of criteria. A less restrictive conception of rationalism not only supports a more historically accurate and nuanced understanding of philosophical movements in the period but it also enables us to apply the concept of ‘rationalism’ (or ‘being a rationalist’) to a more diverse set of thinkers and ideas. As historians of philosophy have increasingly worked to develop more inclusive canons in the past decades, such a reconceptualization is long overdue.
    step1: TBD
    step2: TBD
