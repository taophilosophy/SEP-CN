    kind: body
    source: |-
      Scholars have also criticized the geographical divisions invoked to substantiate the theoretical distinction between rationalism and empiricism. While ‘rationalism’ has been associated with thinkers on the continent of Europe, ‘empiricism’ has been associated with British thinkers – in the historical (colonial) sense, including Ireland. Norton (1981) criticizes this geographical division by noting the crucial role that the French philosopher Pierre Gassendi (1592–1655) played in propagating empiricism during the period (see also Loeb 1981)[^loeb-1981]. Indeed, philosophical crossings from Britain were frequent and fruitful. Many of the figures associated with British empiricism spent periods of time in different parts of continental Europe, and some of the authors discussed in this entry (such as Margaret Cavendish and Anne Conway) spent a majority of their lives in England. The narrative dividing ‘British’ and ‘continental’ theoretical developments holds some historical basis, as in the famous dispute over the development of calculus between the followers of Isaac Newton and Gottfried Wilhelm Leibniz (Hall 1980; Guicciardini 2017)[^guicciardini-2017][^hall-1980]. Yet, this entry suggests that strict geographical divisions are likely to limit and mislead histories of early modern philosophy. This entry drops the appeal to geography in the remainder of the article given that several of the figures discussed are British.
    step1: |-
      学者们还批评了为坐实理性主义与经验主义之理论区分而诉诸的地域划分。“理性主义”一向与欧洲大陆的思想家相联系，“经验主义”则与英国思想家相联系——此处“英国”取历史上的（殖民）含义，包含爱尔兰。Norton（1981）批评这一地域划分，指出法国哲学家皮埃尔·伽桑狄（1592–1655）于当世传播经验主义所起的关键作用（另见 Loeb 1981）[^loeb-1981]。事实上，来自英国的哲学往来既频繁又有收获：许多与英国经验主义相联系的人物都曾在欧洲大陆各地居留，而本词条讨论的某些作者（如玛格丽特·卡文迪许与安妮·康威）大半生都在英格兰度过。把“英国”与“大陆”的理论发展判然两分的叙事确有一定历史依据，例如艾萨克·牛顿与戈特弗里德·威廉·莱布尼茨的追随者之间关于微积分之发展的那场著名争执（Hall 1980; Guicciardini 2017）[^guicciardini-2017][^hall-1980]。然而本词条认为，严格的地域划分很可能限制并误导早期近代哲学史。鉴于所论人物中有数位是英国人，本文余下部分不再诉诸地域。
    step2: |-
      学者们还批评了用来支撑理性主义与经验主义之理论区分的地域划分。“理性主义”一向与欧洲大陆的思想家相联系，“经验主义”则与英国思想家相联系——此处的“英国”取历史上的（殖民）含义，包含爱尔兰。Norton（1981）批评这一地域划分，指出法国哲学家皮埃尔·伽桑狄（1592–1655）在当世传播经验主义方面所起的关键作用（另见 Loeb 1981）[^loeb-1981]。事实上，来自英国的哲学往来既频繁又有成果：许多与英国经验主义相联系的人物都曾在欧洲大陆各地居留，而本词条讨论的某些作者（如玛格丽特·卡文迪许与安妮·康威）大半生都在英格兰度过。把“英国”与“大陆”的理论发展判然两分的叙事确有一定历史依据，如艾萨克·牛顿与戈特弗里德·威廉·莱布尼茨的追随者之间关于微积分发明权的那场著名争执（Hall 1980; Guicciardini 2017）[^guicciardini-2017][^hall-1980]。然而本词条认为，严格的地域划分很可能限制并误导早期近代哲学史；鉴于所论人物中有数位是英国人，本文余下部分不再诉诸地域。
