      #### 2.2.2 Innateness in Spinoza’s Conception of Adequate Ideas
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      Several interpreters argue that innateness is a feature of Spinoza’s theory of adequate ideas. The main textual evidence for this reading appears in E2P11c, which establishes that adequate ideas are perceived by (and explained through) the human mind alone. Marshall argues that this passage expresses a distinct conception of adequacy as containment. She writes, “Idea *x* as it exists in God’s mind is adequate in human mind *y*, itself a complex idea, iff *x* as a whole is part of *y*. Thus, in E2P11c, Spinoza seems to equate an idea’s being adequate in a human mind with its being completely contained in that mind” (Marshall 2013: 26)[^marshall-2013]. In E2P24d and E2P25d, Spinoza additionally suggests that having an adequate idea of something requires having an adequate idea of its cause. Since adequate ideas are completely contained in the mind, Marshall argues, by appeal to Spinoza’s definition of adequate causation in E3D1, that the mind alone is the complete cause of the adequate idea (2013: 52). In other words, adequate ideas are innate.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Steinberg similarly argues that Spinoza ascribed innateness to adequate ideas. In particular, he draws attention to E3D1, E3D2, and E3P1, which establish that the mind acts only insofar as its effects can be clearly and distinctly perceived through its nature alone (Steinberg 2018: 198)[^steinberg-2018]. In other words, Spinoza’s conception of how the mind acts presupposes the view that adequate ideas are innate. He summarizes Spinoza’s reasoning in a *reductio* argument starting from the premise that there are adequate ideas that are not innate in the mind. For such ideas not to be innate in the mind, they would have to be understood partially through the nature of something extrinsic to the mind. But, by E2P11c, this contradicts the definition of adequate ideas. Thus, Steinberg concludes that for Spinoza all adequate ideas are innate in the mind (2018: 199).
    step1: TBD
    step2: TBD
