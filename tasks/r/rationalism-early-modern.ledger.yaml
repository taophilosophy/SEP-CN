      This approach fits well with a relatively new movement in the historiography of early modern philosophy which argues that it is necessary to retrieve and reassess the contributions of thinkers who are excluded by standard narratives of early modern philosophy (or who are, at best, recognized by these narratives as being of secondary importance: see, e.g., Rutherford 2006; Haakonssen 2007)[^haakonssen-2007][^rutherford-2006]. This push for a renewal opens up the possibility that the early modern philosophical canon that was consolidated for so long may be modified in terms of its authors, its works, and its themes (Vanzo 2016)[^vanzo-2016].
    step1: |-
      这一进路与早期近代哲学史学中一股较新的潮流颇为契合：该潮流主张，必须重新发掘并重新评估那些为早期近代哲学的标准叙事所排斥（或至多被这些叙事视为次要）的思想家的贡献（例如参见 Rutherford 2006; Haakonssen 2007）[^haakonssen-2007][^rutherford-2006]。这股求新的推动力带来一种可能：长期凝固的早期近代哲学正典，或可在作者、著作与主题三方面得到修改（Vanzo 2016）[^vanzo-2016]。
