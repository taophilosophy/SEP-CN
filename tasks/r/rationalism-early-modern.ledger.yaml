      With regard to the privileging of reason over sensation, it is important to bear in mind that Conway’s *Principles* presents a monist metaphysics and a hierarchy of beings (e.g., *Principles*, 6.7–8; see also Strok 2022)[^strok-2022][^strok-2022-2]. She affirms that “this distinction [between mind and body] is only modal and gradual, not essential or substantial” (*Principles*, 6.11). Body is merely “fixed and condensed” spirit, while spirit is “subtle and volatile” body (*Principles*, 8.5). This means that all substances are capable of reason, but may also be capable of sensation. Nonetheless, there are clear signs that Conway prioritizes rationality. In Conway’s hierarchy of reality, the most rational creatures are at the top. Further, reason and reasoning for Conway is ‘perfectible’ – i.e., can be increased ‘ad infinitum’ to borrow Hutton’s term (Hutton 2021: §4)[^hutton-2021], though it cannot become infinite itself. This means that ascending in the scale of beings ensures that (greater) rationality is achieved (Sample 2022: 63; Hutton 2020)[^hutton-2020][^sample-2022]. This shows that rationality is superior to other capacities. For instance, while a stone, or even a non-human animal, is capable of reason after transmutations (in time), human beings, who are closer to the top of the hierarchy, are *more* rational creatures.
    step1: |-
      关于理性对感觉的优先，需要记住的是，康威的《原理》呈现了一种一元论形而上学与存在的等级（如 *Principles*, 6.7–8；另见 Strok 2022）[^strok-2022][^strok-2022-2]。她肯定说，“这一区分［心灵与身体之间的］只是样式上的与程度上的，不是本质上的或实体上的”（*Principles*, 6.11）。身体只是“固定而凝聚的”精神，而精神是“精微而流动的”身体（*Principles*, 8.5）。这意味着所有实体都有理性的能力，但可能也有感觉的能力。尽管如此，有清楚的迹象表明康威把理性放在首位。在康威的实在等级中，最有理性的造物居顶端。而且，对康威而言，理性与推理是“可完善的”——即可以“至无穷”地增长，借用 Hutton 的说法（Hutton 2021: §4）[^hutton-2021]——尽管它不能变得无限。这意味着，在存在阶梯上上升保证了获得（更大的）理性（Sample 2022: 63; Hutton 2020）[^hutton-2020][^sample-2022]。这表明理性高于其他能力。例如，虽然一块石头、甚至一个非人动物，经过（时间中的）诸转变后也能拥有理性，但更接近等级顶端的人类是 *更有* 理性的造物。
    step2: |-
      论及理性对感觉的优先，须记住康威的《原理》呈现的是一种一元论形而上学与存在的等级（如 *Principles*, 6.7–8；另见 Strok 2022）[^strok-2022][^strok-2022-2]。她断言：“这一区分［心灵与身体之间的］只是样式上的、程度上的，而非本质上的、实体上的”（*Principles*, 6.11）。身体不过是“固定而凝聚”的精神，精神则是“精微而流动”的身体（*Principles*, 8.5）。这意味着，一切实体皆可有理性，却也可能有感觉。尽管如此，康威把理性置于首位，迹象清楚：在她的实在等级中，最有理性的造物居于顶端；而且在她那里，理性与推理是“可完善的”——借 Hutton 的说法，可以“至无穷”地增长（Hutton 2021: §4）[^hutton-2021]——尽管理性本身不能变成无限。这意味着，沿存在阶梯上升，便确保获得（更大的）理性（Sample 2022: 63; Hutton 2020）[^hutton-2020][^sample-2022]。可见理性高于其他能力：一块石头、甚至一头非人动物，经过（时间中的）诸转变也能拥有理性；但愈近等级顶端的人类，是 *更* 有理性的造物。
