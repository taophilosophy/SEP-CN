      These views have generated scholarly debates about exactly *how* Conway’s views on intelligible order should be characterized. Some have argued that she should be understood as a ‘trialist’ (Boyle 2006: 177)[^boyle-2006]. Others (Lascano 2023)[^lascano-2023][^lascano-2023-2] argue that while Conway may not be an existence monist (for there is more than one thing existing), she is a substance monist (i.e., Conway is “committed to one underlying stuff in which all things participate”). For further discussions of exactly how we ought to characterise Conway’s monistic account of nature’s order, see Gordon-Roth 2018, Thomas 2020, and Head 2020.
