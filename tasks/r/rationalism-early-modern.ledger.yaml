      In Amo scholarship, there is debate concerning how Amo develops a dualist account of the mind-body relation that is consistent with this strict separation of sensation from rational and spiritual activity. Some commentators (Nwala 1978)[^nwala-1978] take Amo to be defending Descartes’ view, others read him as closer to Leibniz in defending a theory of pre-established harmony (Emma-Adamah 2015; Smith 2015)[^emma-adamah-2015][^smith-2015], while others read Amo as endorsing some kind of theory of occasional causation (Meyns 2019, Walsh 2019, Menn and Smith 2020, West 2022)[^menn-2020][^meyns-2019][^walsh-2019][^west-2022].
