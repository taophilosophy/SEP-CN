      Recent scholarly debate has focused on the *modal* status of Leibniz’s principles: are the PSR and PII *contingent* or *necessary* features of reality? Whereas Rodriguez-Pereyra (2018) holds that PSR is necessary, Pikkert (2021) and Bender (2022b) argue that it is contingent. Regarding PII, Jorati (2017b) and Lin (2025) argue that it is contingent, while Bender (2019) argues that it is necessary.
    step1: |-
      近来的学术争论聚焦于莱布尼茨诸原则的 *模态* 地位：PSR 与 PII 是现实的 *偶然* 特征还是 *必然* 特征？Rodriguez-Pereyra（2018）主张 PSR 是必然的，而 Pikkert（2021）与 Bender（2022b）则论证它是偶然的。关于 PII，Jorati（2017b）与 Lin（2025）论证它是偶然的，而 Bender（2019）则论证它是必然的。
    step2: |-
      近来的学术争论，聚焦于莱布尼茨诸原则的 *模态* 地位：PSR 与 PII 是现实的 *偶然* 特征，还是 *必然* 特征？Rodriguez-Pereyra（2018）主张 PSR 必然；Pikkert（2021）与 Bender（2022b）则力主其偶然。至于 PII，Jorati（2017b）与 Lin（2025）认为它偶然，Bender（2019）则认为它必然。
