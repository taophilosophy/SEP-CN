      1. A privileging of reason over sensation, imagination, or experience.
      2. A commitment to the existence of innate knowledge/innate ideas.
      3. A commitment to an epistemology wherein certain knowledge plays a role.
      4. A commitment to the idea that reality is ordered in a rational and necessary way that is accessible to human reason.
