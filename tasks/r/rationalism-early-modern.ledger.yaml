      Spinoza also holds that adequate ideas are certain and indubitable. He writes, “He who has an adequate idea, or (by E2P34) who knows a thing truly, must at the same time have an adequate idea, or true knowledge, of his own knowledge. I.e. (as is manifest through itself), he must at the same time be certain” (E2P43d). The main question from this passage is: what is the nature of second-order knowledge? Some interpreters might read this passage literally, suggesting that adequate ideas necessitate second-order ideas – ideas of ideas – to be certain. This reading is open to interpreters who understand Spinoza to be committed to a theory of second-order ideas (Curley 1969, Melamed 2013, and Morrison 2017)[^curley-1969][^melamed-2013]. Conversely, Primus (2021) argues that second-order knowledge does not entail second-order ideas. Focusing on Spinoza’s claim in E2P21s that “the idea of the mind and the mind itself are one and the same thing,” Primus argues that second-order knowledge refers to the capacity of ideas to represent themselves reflexively (2021: 267). In her view, Spinoza discusses second-order ideas merely to illustrate the representational completeness of adequate ideas. While interpreters disagree over how to understand Spinoza’s conception of second-order knowledge, it remains clear that Spinoza views adequate ideas as certain and indubitable.
    step1: |-
      斯宾诺莎还主张，恰当观念是确定的、无可怀疑的。他写道：“凡拥有恰当观念者，或（据 E2P34）凡真正认识一物者，必须同时对自身的知识拥有恰当观念，即真知识。也就是说（此义自明），他必须同时是确定的”（E2P43d）。这段话引出的主要问题是：二阶知识的本性是什么？一些解释者可能按字面解读这段话，认为恰当观念须有二阶观念——观念的观念——方能确定。对于把斯宾诺莎理解为持二阶观念理论的解释者而言，这一读法是开放的（Curley 1969, Melamed 2013, and Morrison 2017）[^curley-1969][^melamed-2013]。相反，Primus（2021）论证，二阶知识并不蕴含二阶观念。她聚焦于斯宾诺莎在 E2P21s 中的主张——“心灵的观念与心灵本身是同一个东西”——论证二阶知识指的是观念反身地表象自身的能力（2021: 267）。在她看来，斯宾诺莎讨论二阶观念，只是为了说明恰当观念的表象完备性。虽然解释者们对如何理解斯宾诺莎的二阶知识构想意见不一，但清楚的是：斯宾诺莎视恰当观念为确定的、无可怀疑的。
