      This entry understands the changing attitudes towards categories such as ‘rationalism’ on the model of *conceptual fragmentation* in the sciences. Taylor and Vickers (2017) identify numerous scientific concepts – such as ‘species’, ‘intelligence’, ‘health’, and ‘chemical bonds’ – about which multiple interpretations have emerged from previously stable definitions (with one underlying meaning). A similar process seems to be underway with traditional historiographical categories. ‘Rationalism’ began as a substantive category that, like a shard of glass placed under increasing pressure, has begun to fragment into new and distinct categories. This pressure might lead to the shattering of the concept altogether, which is suggested by the growing dissatisfaction among teachers and researchers with traditional narratives dividing ‘rationalism’ and ‘empiricism’ (see Gordon-Roth and Kendrick 2015, Vanzo 2015, Shapiro 2016, O’Neill 2019, Detlefsen and Shapiro 2023, and the entry on feminist history of philosophy)[^detlefsen-2023][^gordon-roth-2015][^o’neill-2019][^shapiro-2016][^vanzo-2015]. Indeed, it may appear to future scholars that an entry on rationalism is outdated and unnecessary. At present, however, the category is still in popular use and requires an explanation of how it is standardly used and why one might be skeptical of its continued usage.
    step1: |-
      本词条参照科学中的**概念碎片化**模型，来理解人们对“理性主义”这类范畴态度的变化。Taylor 与 Vickers（2017）指出，许多科学概念——如“物种”“智力”“健康”“化学键”——都从先前稳定的定义（含一种底层含义）中衍生出多种解释。传统史学编目范畴似乎也在经历类似过程。“理性主义”起初是一个实质性的范畴，如今却像一片承受着越来越大压力的玻璃，已开始碎裂为若干新的、彼此有别的范畴。这份压力或许会使该概念彻底崩解——教师与研究者对划分“理性主义”与“经验主义”的传统叙事日渐不满，正透露出这一可能（见 Gordon-Roth and Kendrick 2015, Vanzo 2015, Shapiro 2016, O’Neill 2019, Detlefsen and Shapiro 2023，以及女性主义哲学史词条）[^detlefsen-2023][^gordon-roth-2015][^o’neill-2019][^shapiro-2016][^vanzo-2015]。未来的学者或许会觉得，一篇论理性主义的词条已然过时、多此一举。不过目前这一范畴仍在通行，因此有必要说明它通常如何被使用，以及人们何以会对继续使用它持怀疑态度。
