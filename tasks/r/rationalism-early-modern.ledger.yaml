      在阿莫研究中，关于阿莫如何发展一种与他将感觉同理性及精神活动严格分离相一致的身心关系二元论说明，存在争论。一些评论者（Nwala 1978）[^nwala-1978]认为阿莫在捍卫笛卡尔的观点；另一些人读他更接近莱布尼茨，捍卫一种前定和谐理论（Emma-Adamah 2015; Smith 2015）[^emma-adamah-2015][^smith-2015]；还有另一些人读阿莫为赞同某种偶因因果理论（Meyns 2019, Walsh 2019, Menn and Smith 2020, West 2022）[^menn-2020][^meyns-2019][^walsh-2019][^west-2022]。
