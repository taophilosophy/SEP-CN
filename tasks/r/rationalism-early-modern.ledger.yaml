      Sor Juana Inés de la Cruz was a prominent Mexican philosopher and author who incorporated rationalist epistemological commitments into her poetic and philosophical writings. The poem “Primero Sueño” (“First Dream”) describes the soul’s journey to knowledge while the body sleeps. The soul employs several strategies as it strives to achieve knowledge of the first cause, but each attempt is unsuccessful. These failures lead to a period of doubt which, unlike the methodological doubt in Descartes’ *Meditations*, provides the occasion for the soul to consider its own nature. The soul is reminded that it represents within itself all other species in the scale of beings and that it tends to the highest through its rational pursuit of knowledge (Strok 2022: 185)[^strok-2022][^strok-2022-2]. The poem concludes with the words “yo despierta” (“I awake”), which establishes a feminine subject – perhaps Sor Juana herself – suggesting that women can engage in the rational pursuit of knowledge as well. This conclusion is further supported in “Respuesta a Sor Filotea de la Cruz” (“Response to Sor Filotea de la Cruz”). Sor Juana shares her intellectual biography, including the fact that she found it difficult to avoid developing arguments and composing verses in her sleep. Throughout the letter, she advocates for the equal education of men and women, using her own disposition toward learning as evidence of women’s intellectual capabilities. The writings of Sor Juana thus present a sustained rejection of the unfair gendered expectations surrounding the pursuit of knowledge through rationality.
