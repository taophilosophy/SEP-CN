      Despite their central role in Descartes’ framework, innate ideas were rejected by two of his 17ᵗʰ-century followers: Nicolas Malebranche (1638–1715) and Robert Desgabets (1610–1678). Malebranche’s rejection of innate ideas follows from his overall rejection of the Cartesian account of ideas as modes of thought. His doctrine of Vision in God holds that ideas are perfections of God contained only in divine wisdom. Additionally, Malebranche argues that innate ideas violate the simplicity with which God acts, since God would have to implant an infinite stock of innate ideas in the mind (*SAT* III.ii.4, LO 226–7). Desgabets, by contrast, rejects innate ideas while remaining a proponent of the orthodox Cartesian view of ideas as modes of thought. Desgabets subscribes to a version of the Scholastic principle ‘*nihil est in intellect quod non prius fuerit in sensu*’ (‘nothing is in the intellect which was not previously in the senses’). By this principle Desgabets understands that there can be absolutely no operations of thought which are independent of experience. This is because all human thought is intrinsically successive: “all our thoughts have a beginning, continuation, and end” (RD 5: 189). For Desgabets, succession, or temporality, depends on (local) motion, and motion is a mode of body. Therefore, all the operations of the soul depend for their origin on the body, so that it is only by means of sense-experience that the soul can have its thoughts.
    step1: |-
      天赋观念虽在笛卡尔框架中居于核心，却为其两位十七世纪追随者所拒斥：尼古拉·马勒伯朗士（1638–1715）与罗伯特·戴加贝（1610–1678）。马勒伯朗士拒斥天赋观念，是其整体上拒斥“观念即思想样式”这一笛卡尔说明的结果。他的“在上帝中看见”学说主张：观念是上帝的完善，仅存在于神圣智慧之中。此外，马勒伯朗士论证：天赋观念违背上帝行动的单纯性，因为上帝将不得不往心灵中植入无穷库存的天赋观念（*SAT* III.ii.4，LO 226–7）。戴加贝则相反：他拒斥天赋观念，却仍是“观念即思想样式”这一正统笛卡尔观点的拥护者。戴加贝服膺经院哲学原则“*nihil est in intellect quod non prius fuerit in sensu*”（“凡不在感官中先有者，不在理智中”）的一种版本。依此原则，戴加贝的理解是：绝不可能有任何独立于经验的思想运作。这是因为一切人类思想本质上都是前后相继的：“我们的一切思想都有开端、延续与终结”（RD 5: 189）。在戴加贝看来，相继性亦即时间性，取决于（局部的）运动，而运动是物体的样式。因此，灵魂的一切运作在起源上都依赖于身体，灵魂唯有凭借感官经验才能有其思想。
