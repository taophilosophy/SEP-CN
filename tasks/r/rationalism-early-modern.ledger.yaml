    source: |-
      Importantly, the traditional division between rationalism and empiricism has been criticized in recent years. For an overview of objections to this distinction, see Dobre and Nydan 2013. Scholars have argued that the labels of ‘rationalism’ and ‘empiricism’ emerged for theoretical and pedagogical ends that are alien to the period they aim to characterize. Theoretically, the division between rationalism and empiricism played an important role in the tradition of German idealism. It provided a simplified narrative of early modern debates in epistemology and metaphysics, which made it possible for followers of Immanuel Kant (1724–1804) to present the critical system as the culmination of modern philosophy (Vanzo 2013, 2016)[^vanzo-2013]. Pedagogically, the division between rationalism and empiricism presents a simplified template for teaching the otherwise diverse history of early modern philosophy. But it also complicates the investigation of hundreds of figures who do not fit cleanly into this narrative. Given the possibility of such ulterior motives, one might wonder whether the labels of ‘rationalism’ and ‘empiricism’ reflect the commitments of philosophers writing in the early modern period at all. This entry acknowledges that these historical categories are open to questioning and welcomes the idea that they ought to be closely scrutinized.
    step1: |-
      要紧的是，理性主义与经验主义之间的传统二分近年已受到批评（对这一区分的种种反对意见的概述，见 Dobre and Nydan 2013）。学者们主张：“理性主义”与“经验主义”这两个标签是为理论目的与教学目的而生，而这些目的与它们所要刻画的时代并不相干。在理论上，理性主义与经验主义的二分在德国唯心论传统中起过重要作用：它为早期近代认识论与形而上学之争提供了一套简化叙事，使伊曼努尔·康德（1724–1804）的追随者得以把批判体系呈现为近代哲学的峰顶（Vanzo 2013, 2016）[^vanzo-2013]。在教学上，这一二分提供了一份简化模板，便于讲授本来纷繁多样的早期近代哲学史；但它也使对数百位无法干净归入这一叙事的人物的考察变得复杂。既有这类别有用心的可能，人们不妨追问：“理性主义”与“经验主义”这两个标签究竟是否反映了早期近代写作者本人的承诺。本词条承认这些历史范畴可受质疑，也欢迎对它们细加审视。
    step2: |-
      要紧的是，理性主义与经验主义的传统二分近年已受到批评（对这些反对意见的概述，见 Dobre and Nydan 2013）。学者们主张：“理性主义”与“经验主义”这两个标签是为理论目的与教学目的而生的，而这些目的与它们所要刻画的时代并不相干。就理论目的而言，理性主义与经验主义的二分在德国唯心论传统中起过重要作用：它为早期近代认识论与形而上学之争提供了一套简化叙事，使伊曼努尔·康德（1724–1804）的追随者得以把批判体系呈现为近代哲学的顶峰（Vanzo 2013, 2016）[^vanzo-2013]。就教学目的而言，这一二分提供了一份简化模板，便于讲授本来纷繁多样的早期近代哲学史；但它也使对数百位无法干净归入这一叙事的人物的考察变得复杂。既有这类别有用心的可能，人们不妨追问：“理性主义”与“经验主义”这两个标签究竟是否反映了早期近代写作者本人的承诺？本词条承认这些历史范畴可受质疑，也欢迎对它们细加审视。
