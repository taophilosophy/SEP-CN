      By adopting an instrumentalist rather than realist or eliminativist approach to the concept, this entry acknowledges but hopes to bracket the concern that ‘rationalism’ is descriptively inaccurate as a category of early modern philosophy (for a similar approach to the historiographical concept of ‘Western Philosophy’, see Moravec and West 2024)[^moravec-2024]. In other words, one might reject the idea that ‘rationalism’ is akin to a natural-kind term that accurately describes the historical situation and configuration of early modern philosophy in Europe. On this interpretation, we should continue to talk about early modern rationalism *only* insofar as it is *helpful* for us to do so – and only *because* it is helpful. Instrumentalists about the concept of rationalism would thus avoid talking as though ‘rationalism’ picks out a stable set of ideas or thinkers from the early modern period. Instead, they would think of it as just one lens through which we can examine what, from a contemporary perspective, brings groups of ideas and thinkers together. It would be a mistake, according to this instrumentalist approach, to think that, in an objective sense, *there was a group of philosophers who were the rationalists.* Questions about whether a particular thinker was *really* a rationalist become less important than questions like ‘why might we call that thinker a rationalist?’ and ‘what is our aim in doing so?’. This is the kind of approach taken in this entry. The criteria identified in the previous subsection are not necessary or sufficient conditions for including a particular philosopher amongst the rationalists. Rather, they should be seen as a cluster of concepts that pick out, at most, a family resemblance between thinkers who share certain metaphysical or epistemological commitments. (As we will find in §3, certain thinkers discussed in this entry do not satisfy some of those criteria.)
    step1: |-
      本词条对这一概念采取工具主义而非实在论或取消主义的进路，因而承认、但希望搁置如下顾虑：“理性主义”作为早期近代哲学的范畴在描述上并不准确（对“西方哲学”这一史学概念采取类似进路的，见 Moravec and West 2024）[^moravec-2024]。换言之，人们可以否认“理性主义”类似一个自然种类词、能准确描述欧洲早期近代哲学的历史状况与格局。按此解释，我们应当继续谈论早期近代理性主义，但**仅当**这样做对我们**有用**——且**正因为**它有用。持工具主义立场者于是不会说得好像“理性主义”从早期近代中挑出了一组稳定的观念或思想家；他们宁可把它只看作一面透镜，借以考察：从当代视角看，是什么把若干组观念与思想家归拢到一起。按这一工具主义进路，若认为客观地说**确实存在一群身为理性主义者的哲学家**，那就错了。“某位思想家是否**真的**是理性主义者”这类问题，不如“我们何以为这位思想家贴上理性主义的标签”“我们这样做意在何为”这类问题重要。本词条采取的正是这种进路。上一小节列出的诸判据，并不是把某位哲学家归入理性主义者的必要或充分条件；它们应被看作一簇概念，至多标示出持有某些形而上学或认识论承诺的思想家之间的家族相似。（我们将在第 3 节看到：本词条讨论的某些思想家并不满足其中一些判据。）
