      ### 2.4 The Intrinsic Intelligibility of Nature
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      The fourth commitment this entry identifies as a criterion for being considered a rationalist is the view that nature is intrinsically intelligible. This means that despite epistemic limits on what each person can know individually, the natural world is, in principle, knowable through reason.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      #### 2.4.1 Descartes on God’s Omnipotence and the Intelligibility of Nature
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      The intelligibility of reality, in Descartes’ developed system, depends on understanding the articulation of essences in terms of substances, principal attribute, and modes (see the entry on Descartes’ modal metaphysics). Descartes identifies the essence of a thing with its nature. In the realm of created beings, Descartes recognizes only two: the essence or nature of the mind, which is thought, and the essence or nature of body, which is extension (*Principles*, AT VIII-A 25, 30–1; CSM I, 210, 215).
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      The origin of essences, in turn, is dependent on divine will, as seen in the discussion of the free creation of eternal truths. Descartes asserts that God created eternal truths freely, including the power to render them false, which seems to conflict with the necessity of eternal truths. This apparent contradiction suggests a tension in Descartes’ philosophy regarding the nature of God’s omnipotence and the necessity of truths. The nature of the necessity or contingency of the eternal truths in Descartes is a topic of intense debate among interpreters of his thought. This debate contrasts possibilism – truths as contingent on God’s will (Frankfurt 1977)[^frankfurt-1977] – with necessitarianism, where truths are necessary but vary in kind. Curley (1984) sees them as necessary yet dependent on divine choice, while Bennett (1994) views their necessity as subjective, rooted in human cognition. While Descartes laid important groundwork for the principle of sufficient reason (cf. AT VII 109–112; CSM II 78–80), his rationale for developing a perspective on the intelligibility of reality differs from that of other traditional rationalists. The status of eternal truths – whether contingent or necessary – has a direct impact on the scope and validity of principles such as those of logic and mathematics in Descartes’ philosophy. In this sense, the intrinsic intelligibility of reality is closely tied to the precise meaning of Descartes’ thesis on the free creation of eternal truths. If eternal truths are contingent on God’s will, then they lack intrinsic necessity and cannot be fully explained by reason alone. This weakens the principle of sufficient reason, since not everything – especially fundamental truths – has a necessary ground, thereby limiting the overall intelligibility of reality.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
