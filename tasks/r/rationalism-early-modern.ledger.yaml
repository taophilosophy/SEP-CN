      Margaret Cavendish prioritizes reason over sensation most clearly in her arguments against the experimental philosophers. Her arguments focus especially on the use of microscopes in natural philosophy. In the mid-1600s, microscopes were a new technology and were often treated as curiosities rather than tools. Robert Hooke’s *Micrographia* (1665) was one of the earliest works demonstrating the usefulness of microscopes to natural philosophy (Turney 2005; Henderson 2019)[^henderson-2019][^turney-2005]. Hooke argued that microscopes remedy the natural deficiencies of human sensation. In his view, they reveal bodies’ inner motions and unveil the secret workings of nature.
    step1: |-
      玛格丽特·卡文迪许在其反对实验哲学家的论证中最清楚地优先考虑理性。她的论证尤其聚焦于自然哲学中对显微镜的使用。在 1600 年代中期，显微镜是一项新技术，常被当作珍玩而非工具。罗伯特·胡克的《显微图谱》（1665）是最早展示显微镜对自然哲学之用处的著作之一（Turney 2005; Henderson 2019）[^henderson-2019][^turney-2005]。胡克论证，显微镜补救人类感觉的自然缺陷。在他看来，显微镜揭示身体的内部运动，揭开自然的秘密运作。
    step2: |-
      玛格丽特·卡文迪许把理性置于感觉之上，这在她反对实验哲学家的论证中表现得最为清楚。她的论证尤其聚焦于自然哲学对显微镜的使用。17 世纪中叶，显微镜还是新事物，常被当作珍奇玩物而非研究工具。罗伯特·胡克的《显微图谱》（1665）是最早证明显微镜对自然哲学有用的著作之一（Turney 2005; Henderson 2019）[^henderson-2019][^turney-2005]。胡克主张，显微镜能补救人类感觉的自然缺陷；在他看来，显微镜揭示身体的内部运动，揭开自然界隐秘的运作。
