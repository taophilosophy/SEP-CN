      ## 4. Conclusion: The Future of ‘Rationalism’
    step1: TBD
    step2: TBD
  - id: 144
    kind: body
    source: |-
      One aim of this entry has been to provide an instrumentalist account of early modern rationalism. While a realist approach identifies necessary and sufficient criteria for applying the label of rationalism to specific figures, an instrumentalist approach uses the criteria of rationalism to identify forms of theoretical kinship or resonances between the philosophical commitments of different figures in the early modern period. With an instrumentalist methodology in mind, this entry demonstrates that there *is* a story to be told about rationalism that encompasses more diverse voices, including women and non-European thinkers, as presented here.
    step1: TBD
    step2: TBD
  - id: 145
    kind: body
    source: |-
      By way of conclusion – and in the spirit of provoking future research into the historical category of ‘rationalism’ – this section showcases an example of how rational commitments were applied to social and political philosophy. This approach is exemplified by two further figures who lie outside the traditional early modern canon: Sor Juana Inés de la Cruz (1648–1695) and François Poulain de la Barre (1647–1723). Like Amo, Cavendish, and Conway, these authors do not perfectly satisfy the criteria for rationalism stipulated in the Introduction. But this section briefly demonstrates how each author’s rationalist commitments were fruitfully applied to the topics of gender equality and women’s education. It should be noted that, as has been the case throughout this entry, this discussion is not intended to be exhaustive. No doubt, there are other thinkers who could also be discussed in connection with rationalism. The aim here is simply to show what such future discussions might look like.
    step1: TBD
    step2: TBD
  - id: 146
    kind: body
    source: |-
      Sor Juana Inés de la Cruz was a prominent Mexican philosopher and author who incorporated rationalist epistemological commitments into her poetic and philosophical writings. The poem “Primero Sueño” (“First Dream”) describes the soul’s journey to knowledge while the body sleeps. The soul employs several strategies as it strives to achieve knowledge of the first cause, but each attempt is unsuccessful. These failures lead to a period of doubt which, unlike the methodological doubt in Descartes’ *Meditations*, provides the occasion for the soul to consider its own nature. The soul is reminded that it represents within itself all other species in the scale of beings and that it tends to the highest through its rational pursuit of knowledge (Strok 2022: 185)[^strok-2022][^strok-2022-2]. The poem concludes with the words “yo despierta” (“I awake”), which establishes a feminine subject – perhaps Sor Juana herself – suggesting that women can engage in the rational pursuit of knowledge as well. This conclusion is further supported in “Respuesta a Sor Filotea de la Cruz” (“Response to Sor Filotea de la Cruz”). Sor Juana shares her intellectual biography, including the fact that she found it difficult to avoid developing arguments and composing verses in her sleep. Throughout the letter, she advocates for the equal education of men and women, using her own disposition toward learning as evidence of women’s intellectual capabilities. The writings of Sor Juana thus present a sustained rejection of the unfair gendered expectations surrounding the pursuit of knowledge through rationality.
    step1: TBD
    step2: TBD
  - id: 147
    kind: body
    source: |-
      François Poulain de la Barre (1647–1723) asserted the intellectual parity of women and advocated for their education and participation in public life. His trilogy of works – *De l’égalité des deux sexes* (1673), *De l’éducation des dames* (1674), and *De l’excellence des hommes* (1675) – present a coherent thesis on gender equality rooted in Cartesian metaphysics. He argued that while natural differences exist between the sexes, social disparities are culturally constructed and not inherent. As Shapiro (2021) notes, the search for clear and distinct knowledge led Poulain to adhere to the principles of Cartesian metaphysics, highlighting the real distinction between mind and body. Since he held that no characteristics are shared between mind and body, he concluded that the mind has no sex and is equal in men and women (Poulain de la Barre 2002: 82) Poulain’s application of Cartesian principles to social analysis laid the foundation for later feminist movements and contributed to the *Querelle des femmes* movement in 15th- to 18ᵗʰ-century France (Stuurman 1997, Shapiro 2021)[^shapiro-2021][^stuurman-1997]. His writings likewise showcase the application of rationalist principles to questioning gendered social norms.
    step1: TBD
    step2: TBD
  - id: 148
    kind: body
    source: |-
      Much remains to be said about the history of early modern rationalism. No doubt, future iterations of this entry will reflect this fact. Telling more inclusive stories about philosophy’s history requires that the concepts we employ (such as ‘rationalism’) not be static or stationary – that they be employed in a way that is fluid and adaptable to new aims and values that will inevitably emerge. An instrumentalist approach to the concept of rationalism makes it possible to understand the ideas and thinkers of the past in such a way that they continue to be relevant to contemporary perspectives and discourses.
