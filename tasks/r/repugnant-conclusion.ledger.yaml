      令人反感的结论之所以让人困惑，是因为强有力的论证似乎硬把人推向它。事实上已有一批这样的论证——思路与上文的纯粹增加推理相近(参见如 Parfit 1986；Arrhenius 2000b；Kitcher 2000；Tännsjö 2002；Rachels 2004)[^arrhenius-2000b][^kitcher-2000][^parfit-1986][^rachels-2004][^tännsjö-2002]。大致说来，这些论证的骨架相同：比较三个人口情形，第二个优于第一个，第三个优于第二个，于是第三个优于第一个；把这条推理反复用下去，就得到令人反感的结论(*Z* 优于 *A*)。对付这类论证，较激进的办法之一是干脆拒斥“优于”（或“同样好于”）的传递性。按传递性，若 *p* 优于 *q*、*q* 优于 *r*，则 *p* 优于 *r*；一旦否认“优于”的传递性，通向结论的那条推理就断了(Temkin 1987, 2012；Persson 2004；Rachels 2004)[^persson-2004][^rachels-2004][^temkin-1987]。
