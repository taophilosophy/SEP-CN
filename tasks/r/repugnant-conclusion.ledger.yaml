  - id: 1
    kind: body
    source: |-
      In Derek Parfit’s original formulation the Repugnant Conclusion is stated as follows: “For any possible population of at least ten billion people, all with a very high quality of life, there must be some much larger imaginable population whose existence, if other things are equal, would be better even though its members have lives that are barely worth living” (Parfit 1984)[^parfit-1984]. The Repugnant Conclusion highlights a problem in an area of ethics which has become known as *population ethics*. The last three decades have witnessed an increasing philosophical interest in questions such as “Is it possible to make the world a better place by creating additional happy people?” and “Is there a moral obligation to have children?” The main problem has been to find an adequate theory about the moral value of states of affairs where the number of people, the quality of their lives (or their life-time welfare or well-being—we shall use these terms interchangeably here), and their identities may vary. Since, arguably, any reasonable moral theory has to take these aspects of possible states of affairs into account when determining the normative status of actions, the study of population ethics is of general import for moral theory. As the name indicates, Parfit finds the Repugnant Conclusion unacceptable and many philosophers agree. However, it has been surprisingly difficult to find a theory that avoids the Repugnant Conclusion without implying other equally counterintuitive conclusions. Thus, the question as to how the Repugnant Conclusion should be dealt with and, more generally, what it shows about the nature of ethics has turned the conclusion into one of the cardinal challenges of modern ethics.
    step1: |-
      在德里克·帕菲特的原始表述中，令人反感的结论是这样陈述的：“对于任何至少有 100 亿人、且全都享有极高生活品质的可能人口，必定存在某个大得多的可想见人口，在其他条件相同的情况下，其存在会更好，哪怕其成员过的生活仅勉强值得一过”（Parfit 1984）[^parfit-1984]。令人反感的结论凸显了伦理学中一个已成所谓**人口伦理学**领域的问题。过去三十年里，哲学界对“通过创造额外的幸福人口，是否可能让世界变得更好？”以及“是否有生育孩子的道德义务？”这类问题的兴趣日增。主要问题一直是：要找到一种恰当的理论，来说明人数、其生活质量（或其一生的福祉或福利——此处互换使用这些术语），以及其身份都可能变化的事态的道德价值。既然任何合理的道德理论在判定行动的规范地位时，都须把可能事态的这些方面纳入考虑，人口伦理学研究对道德理论便具有普遍意义。正如名称所示，帕菲特认为令人反感的结论不可接受，许多哲学家也同意。然而，要找到一种既避开令人反感的结论、又不蕴含其他同样反直觉结论的理论，却出奇地困难。于是，如何处理令人反感的结论、更一般地说，它显示出伦理学的何种本性，这个问题使该结论成为现代伦理学的核心挑战之一。
    step2: |-
      在德里克·帕菲特最初的表述中，令人反感的结论是这样说的：“对任何至少有一百亿人、且人人享有极高生活品质的可能人口来说，总还存在某个大得多的可想见人口：在其他条件相同的情况下，这个人口的存在更好，尽管其成员的生活只是勉强值得一过”（Parfit 1984）[^parfit-1984]。这一结论把伦理学中一个如今称作 **人口伦理学** 的领域的问题凸显出来。近三十年来，哲学界对“多造些幸福的人，能否让世界变得更好？”“生儿育女有没有道德义务？”这类问题兴趣渐浓。核心难题在于：人数、生活质量（或一生的福祉——下文两词互换）与人的身份都可能变动，如何为这类事态的道德价值找到一种恰当理论？任何说得通的道德理论，在判定行动的规范地位时，都得顾及可能事态的这些方面，因此人口伦理学研究对整个道德理论都有普遍意义。顾名思义，帕菲特认为这个结论不可接受，不少哲学家也持同样看法。可是，要找到一种既躲开它、又不带出其他同样反直觉结论的理论，竟出奇地难。于是，如何对待令人反感的结论，以及它究竟透露了伦理学的什么本性，就成了现代伦理学的重大挑战之一。
