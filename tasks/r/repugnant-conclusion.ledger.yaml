      However, the logic of Benatar’s theory has been challenged (Bradley 2010)[^bradley-2010] and a theory of welfare that denies the possibility of lives worth living is quite counter-intuitive (Ryberg 1996a)[^ryberg-1996a]. Fehige’s theory, for example, implies that a life of one year with complete preference satisfaction has the same welfare as a completely fulfilled life of a hundred years, and has higher welfare than a life of a hundred years with all preferences but one satisfied. Moreover, the last life is not worth living.
    step1: |-
      然而，贝纳塔理论的逻辑已受质疑（Bradley 2010）[^bradley-2010]，而一种否认值得过的生活之可能的福祉理论颇反直觉（Ryberg 1996a）[^ryberg-1996a]。例如，费希格的理论蕴含：一年完全满足偏好的生活，其福祉与百年完全圆满的生活相同，且高于百年中除一个偏好外全部满足的生活。此外，后一种生活并不值得一过。
    step2: |-
      不过，贝纳塔理论的逻辑已遭质疑(Bradley 2010)[^bradley-2010]；而且一种否认“值得过的生活”之可能的福祉理论，实在颇违直觉(Ryberg 1996a)[^ryberg-1996a]。比如按费希格的理论，一年完全满足偏好的生活，其福祉等于百年圆满的一生，还高于百年里只差一个偏好没满足的生活。可后面这种生活，按它说并不值得一过。
