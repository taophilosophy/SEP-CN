      ### 2.8 Accepting the Repugnant Conclusion
    step1: |-
      ### 2.8 接受令人反感的结论
    step2: |-
      ### 2.8 接受令人反感的结论
  - id: 54
    kind: body
    source: |-
      When confronted with the Repugnant Conclusion, many share the view that the conclusion is highly counterintuitive. However, it has been suggested that it is premature to conclude from this that the conclusion is morally unacceptable. Two sorts of reasons can be given in favor of the view that the conclusion should be accepted. According to the first, while it is correct that the conclusion is counterintuitive, there are nevertheless certain theoretical considerations outweighing this intuition to such an extent that we should accept it. The claim that no plausible theory can avoid the Repugnant Conclusion or that the rejection of the conclusion would force one into rejecting claims which it is hard to get around—e.g. such as the premises of the Mere Addition Paradox—may constitute such considerations (Tännsjö 2002; Holtug 2004; Huemer 2008)[^holtug-2004][^huemer-2008][^tännsjö-2002]. According to the second, the source of the unacceptability of the conclusion is the fact that we are deluded by our intuition (Sikora 1978, 2004; Mackie 1985; Tännsjö 1992, 1998, 2002; Hare 1993; Ryberg 1996a, 2004)[^hare-1993][^mackie-1985][^ryberg-1996a][^sikora-1978][^sikora-1978-2][^tännsjö-1992]. Once we fully understand what the conclusion amounts to, we will cease to find it counterintuitive. For instance, it might be suggested that the repugnance, at least partly, is due to our limited apprehension of large numbers (Tännsjö 2002; Broome 2004)[^broome-2004][^tännsjö-2002]. We cannot imagine what it would be like for there to exist billions upon billions of people, and hence our intuition is not based on a sound picture of the moral significance of population *Z* (for a critical discussion of these kind of arguments, see Temkin 2012 and Pummer 2013)[^pummer-2013][^temkin-2012]. Moreover, several theorists have suggested that our intuition is misguided by a misapprehension of what it is like to lead a life in *Z*, i.e., a life that is barely worth living. The idea is that once we realize that such a life is not terrible but perhaps a life not much different from a normal privileged one, the conclusion loses its sting (Mackie 1985; Tännsjö 1992; Ryberg 1996a)[^mackie-1985][^ryberg-1996a][^tännsjö-1992]. Thus, on both views, though population ethics may constitute a complicated area of ethical research, it is at least devoid of what is traditionally regarded as one of the cardinal challenges.
    step1: |-
      面对令人反感的结论，许多人共有这样的看法：该结论极度反直觉。然而，有人提出，由此断定该结论在道德上不可接受，为时过早。有两类理由支持应当接受该结论的看法。按第一类，该结论反直觉是对的，但仍有某些理论考量在分量上压过这一直觉，到了我们应当接受它的地步。诸如“没有合理理论能避开令人反感的结论”或“拒斥该结论将迫使人拒斥难以绕过的主张（例如纯粹增加悖论的前提）”之类的说法，便可能构成这样的考量（Tännsjö 2002；Holtug 2004；Huemer 2008）[^holtug-2004][^huemer-2008][^tännsjö-2002]。按第二类，该结论之所以显得不可接受，是因为我们的直觉受了骗（Sikora 1978, 2004；Mackie 1985；Tännsjö 1992, 1998, 2002；Hare 1993；Ryberg 1996a, 2004）[^hare-1993][^mackie-1985][^ryberg-1996a][^sikora-1978][^sikora-1978-2][^tännsjö-1992]。一旦我们完全理解该结论说的是什么，就不会再觉得它反直觉。例如，有人提出，反感至少部分源于我们对大数目的理解有限（Tännsjö 2002；Broome 2004）[^broome-2004][^tännsjö-2002]。我们无法想象存在亿万又亿万的人会是什么样子，因此我们的直觉并不建立在人口 *Z* 道德意义之可靠图景上（对这些论证的批判性讨论，见 Temkin 2012 与 Pummer 2013）[^pummer-2013][^temkin-2012]。此外，若干理论家提出，我们的直觉被一种误解误导了：误解了在 *Z* 中过一种生活——即仅勉强值得过的生活——是什么样子。其想法是：一旦我们意识到这样的生活并不糟糕，也许和通常享有特权者的生活没多大差别，该结论便不再刺人（Mackie 1985；Tännsjö 1992；Ryberg 1996a）[^mackie-1985][^ryberg-1996a][^tännsjö-1992]。于是按这两种看法，人口伦理学固然可能是伦理研究中一个复杂的领域，至少已不再含有传统上被视为核心挑战之一的东西。
    step2: |-
      面对令人反感的结论，许多人一致认为它极度反直觉。但有人提出：就此断定它在道德上不可接受，为时过早。支持“应当接受”的理由有两类。第一类说，结论反直觉不假，可有些理论考量分量更重，重到我们该接受它——比如“没有哪种说得通的理论能躲开这个结论”，或“拒斥它就得拒斥那些绕不过去的主张（例如纯粹增加悖论的前提）”(Tännsjö 2002；Holtug 2004；Huemer 2008)[^holtug-2004][^huemer-2008][^tännsjö-2002]。第二类说，结论之所以显得不可接受，是因为我们的直觉上了当(Sikora 1978, 2004；Mackie 1985；Tännsjö 1992, 1998, 2002；Hare 1993；Ryberg 1996a, 2004)[^hare-1993][^mackie-1985][^ryberg-1996a][^sikora-1978][^sikora-1978-2][^tännsjö-1992]。等我们完全弄清它说的是什么，就不会再觉得反直觉了。比如，有人提出反感至少部分来自我们对大数目把握不住(Tännsjö 2002；Broome 2004)[^broome-2004][^tännsjö-2002]：亿万又亿万的人是什么光景，我们根本想象不出，所以直觉并不建立在 *Z* 之道德意义的可靠图景上(对这些论证的批判性讨论，见 Temkin 2012 与 Pummer 2013)[^pummer-2013][^temkin-2012]。还有几位理论家说，我们的直觉被另一种误解带偏了：误以为 *Z* 里的生活——那种仅勉强值得过的生活——很糟，其实未必。一旦明白这种生活并不凄惨，或许跟寻常有特权者的生活差不多少，结论就不刺人了(Mackie 1985；Tännsjö 1992；Ryberg 1996a)[^mackie-1985][^ryberg-1996a][^tännsjö-1992]。照这两类看法，人口伦理学固然可能是伦理研究中一个复杂的领域，至少不再包含传统上所谓核心挑战之一了。
