      The Repugnant Conclusion may seem to rely on a certain view about welfare. It treats welfare on an additive scale, where low numbers, if added to themselves often enough, must become larger than any initial larger number. This is like the Archimedean property of the real numbers: For any positive numbers *x* and *y*, there is a natural number *n* such that *nx* is greater than *y*. Any finite number of lives in population *A* can therefore be outweighed by a sufficiently large number of lives in *Z* because the gain in the quantity of lower values outweighs the loss of certain higher values. However, some theorists—including Parfit—have suggested that this axiological assumption is mistaken. (Parfit 1986, 2016; Griffin 1986; Rachels 2001; Crisp 1988, 1992; Glover 1977; Edwards 1979; Lemos 1993; Skorupski 1999; Klint Jensen 1996; Portmore 1999; Riley 1993, 1999, 2008, 2009)[^crisp-1988][^edwards-1979][^glover-1977][^griffin-1986][^klint-1996][^lemos-1993][^parfit-1986][^portmore-1999][^rachels-2001][^riley-1993]. The idea is that one type of good α can be superior to another type of good β, in the sense that any amount of α is better than any amount of β or that some amount of α is better than any amount of β. Suppose that what happens as we move down the alphabet from the high-quality population *A* to the low-quality population *Z* is that the best things in life are gradually lost. For instance, as Parfit has suggested, the first step from *A* to *B* involves the loss of Mozart’s music; in the move from *B* to *C* Haydn’s music is lost; in the move to *D* Venice is destroyed; and so on down the alphabet. All that is left in the final move to *Z* is “muzak and potatoes”. The claim is that the lives in the beginning of the sequence involve goods that are superior to the goods involved in the lives at the end of the sequence. The loss of the most worthwhile things in life cannot be compensated for by any gain in the quantity of muzak and potatoes. Consequently, whatever the number of people in population *Z*, there will be less welfare, or less valuable welfare, in this world as compared to population *A* and thus the Repugnant Conclusion is blocked.
    step1: |-
      令人反感的结论似乎依赖某种关于福祉的观点。它把福祉当作可加尺度处理：低数值若自身相加足够多次，必定大于任何起初更大的数值。这就像实数的阿基米德性质：对任何正数 *x* 与 *y*，都存在自然数 *n*，使 *nx* 大于 *y*。因此，人口 *A* 中任何有限数目的生命，都能被 *Z* 中数目足够多的生命所压过，因为较低价值在数量上的增益压过了某些较高价值的损失。然而，一些理论家——包括帕菲特——提出，这一价值论假定是错的。（Parfit 1986, 2016；Griffin 1986；Rachels 2001；Crisp 1988, 1992；Glover 1977；Edwards 1979；Lemos 1993；Skorupski 1999；Klint Jensen 1996；Portmore 1999；Riley 1993, 1999, 2008, 2009）[^crisp-1988][^edwards-1979][^glover-1977][^griffin-1986][^klint-1996][^lemos-1993][^parfit-1986][^portmore-1999][^rachels-2001][^riley-1993]。其想法是：一种善 α 可以优越于另一种善 β，意思是任何数量的 α 都优于任何数量的 β，或某个数量的 α 优于任何数量的 β。假定我们从高质量人口 *A* 沿字母表下移到低质量人口 *Z* 时，发生的是生活中最好的东西逐渐丧失。例如，如帕菲特所设想，从 *A* 到 *B* 的第一步丧失的是莫扎特的音乐；从 *B* 到 *C* 丧失海顿的音乐；移到 *D* 时威尼斯被毁；如此沿字母表而下。最终移到 *Z* 时，剩下的只有“背景音乐与土豆”。其主张是：序列开头的生活所含的善，优越于序列末尾生活所含的善。生活中最值得的东西之丧失，不能由“背景音乐与土豆”在数量上的任何增益来补偿。于是，无论人口 *Z* 中人数多少，这个世界与人口 *A* 相比福祉都更少、或价值更低的福祉更少，令人反感的结论因而被阻断。
    step2: |-
      令人反感的结论似乎靠的是某种福祉观：它把福祉当作可加的尺度，数值再低，只要自身相加的次数足够多，总能超过起初更大的任何数值。这就像实数的阿基米德性质：对任何正数 *x*、*y*，总有个自然数 *n*，使 *nx* 大于 *y*。所以 *A* 里有限多条生命，总能被 *Z* 里足够多的生命压过——低价值在数量上的增益压过了某些高价值的损失。然而一些理论家，包括帕菲特，主张这个价值论假定是错的。(Parfit 1986, 2016；Griffin 1986；Rachels 2001；Crisp 1988, 1992；Glover 1977；Edwards 1979；Lemos 1993；Skorupski 1999；Klint Jensen 1996；Portmore 1999；Riley 1993, 1999, 2008, 2009)[^crisp-1988][^edwards-1979][^glover-1977][^griffin-1986][^klint-1996][^lemos-1993][^parfit-1986][^portmore-1999][^rachels-2001][^riley-1993]。他们的想法是：一种善 α 可以比另一种善 β 更优越——任何数量的 α 都胜过任何数量的 β，或某个数量的 α 胜过任意数量的 β。不妨设想，从高质量的 *A* 沿字母表下滑到低质量的 *Z*，发生的是人生中最好的东西逐级丧失：按帕菲特的设想，*A* 到 *B* 的这一步丢掉了莫扎特的音乐，*B* 到 *C* 丢掉海顿的音乐，到 *D* 时威尼斯被毁，如此一路下去；最后到 *Z*，只剩“背景音乐和土豆”。照此主张，序列开头的生活所含的善，优越于末尾生活所含的善；人生中最值得的东西一旦失去，拿再多“背景音乐和土豆”也补不回来。于是不管 *Z* 里有多少人，比起 *A*，这个世界的福祉都更少，或者价值更低的福祉更少——令人反感的结论就此被挡住。
