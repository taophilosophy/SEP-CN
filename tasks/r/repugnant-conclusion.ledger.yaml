      Actually, it is unclear whether presentism, necessitarianism, or actualism can escape any of the problems discussed above in connection with “impersonal” theories, and in particular the Repugnant Conclusion. For example, assume that *A* is a population of present people (for example, the present people in country *x*) enjoying very high welfare and that *B* is a larger population of present people (for example, the present population in country *y*) with very low welfare but with higher total welfare than *A*. Which population is the better one according to presentism? It all depends on which method the presentist selects for determining better, worse and equally good in regard to the welfare of present people. Since this case involves only present people, all the problems discussed above will reappear in the search of this method. Likewise for necessitarianism and actualism. Moreover, the restriction might not help us avoid the Repugnant Conclusion but rather imply it given some other attractive conditions (Arrhenius 2015)[^arrhenius-2015][^arrhenius-2015-2].
    step1: |-
      实际上，现在主义、必然主义或现实论能否避开上文与“非人格的”理论相关而讨论的任何问题，尤其是令人反感的结论，尚不清楚。例如，假定 *A* 是一个由现在人构成的人口（例如 *x* 国的现在人口），享有极高福利；*B* 是一个更大的现在人口（例如 *y* 国的现在人口），福利极低，但总福利高于 *A*。按现在主义，哪个人口更好？这完全取决于现在主义者选定哪一种方法来确定就现在人的福祉而言何者更好、更糟与同样好。由于这一情形只涉及现在人，上文讨论的一切问题都会在这一方法的寻求中重现。必然主义与现实论亦然。此外，这一限制可能并不帮我们避开令人反感的结论，反而在给定某些其他有吸引力的条件时蕴含它（Arrhenius 2015）[^arrhenius-2015][^arrhenius-2015-2]。
    step2: |-
      实际上，现在主义、必然主义、现实论究竟能不能躲开上面针对“非人格”理论谈的那些问题，尤其是令人反感的结论，并不清楚。举例说，*A* 是个人口，由现在人组成（比如 *x* 国的现有居民），福利极高；*B* 是更大的现在人口（比如 *y* 国的现有居民），福利极低，总福利却高于 *A*。按现在主义，哪个更好？这就全看现在主义者挑什么方法来判定“就现在人的福祉而言”何者更好、更糟、一样好。既然这一情形只涉及现在人，上面谈过的问题全都会在寻找这个方法的过程中重现。必然主义、现实论亦复如是。况且，这条限制未必帮我们躲开令人反感的结论，反倒在某些同样有吸引力的条件配合下把它蕴含出来(Arrhenius 2015)[^arrhenius-2015][^arrhenius-2015-2]。
