      Another way of modifying total utilitarianism is to introduce a critical level (Kavka 1982, Parfit 1984; Locke 1984; Blackorby *et al*. 1997, 2004, 2005; Broome 2004)[^blackorby-1997][^broome-2004][^kavka-1982][^parfit-1984]. As is the case with the variable value view, a critical level view is based on a split between prudential and moral value. However, in this case the split is even more radical. The idea is that a person’s life contributes positively to the value of a population only if the quality of the person’s life is above a certain positive critical level. Below this level the contributive value of a life is neutral (Kavka 1982)[^kavka-1982], negative (Blackorby *et al.* 1997, 2004, 2005; cf. Feldman’s theory below)[^blackorby-1997], or introduces incommensurability or vagueness in the ordering of populations (Blackorby *et al.* 2005; Broome 2004; Rabinowicz 2009; cf. Parfit 2016)[^blackorby-2005][^broome-2004][^parfit-2016][^rabinowicz-2009], even though the person leads a life worth living. In its simplest form, the critical level view is a modified version of total utilitarianism. The contributive value of a person’s life is her welfare minus a positive critical level. The value of a population is calculated by summing these differences for all individuals in the population. The critical level view thereby succeeds in avoiding the Repugnant Conclusion. Assuming the critical level is higher than the individual welfare levels in population *Z*, the Repugnant Conclusion is blocked since the value of *Z* is negative, and thus worse than *A*, according to the critical level view.
    step1: |-
      修改总体功利主义的另一种方式，是引入一个临界水平（Kavka 1982, Parfit 1984；Locke 1984；Blackorby *et al*. 1997, 2004, 2005；Broome 2004）[^blackorby-1997][^broome-2004][^kavka-1982][^parfit-1984]。与可变价值观点一样，临界水平观点也基于审慎价值与道德价值之分。不过在此情形中，这一分裂更为彻底。其想法是：一个人的生命只有在其生活质量高于某个正临界水平时，才对人口价值有正贡献。低于此水平时，一条生命的贡献价值是中性的（Kavka 1982）[^kavka-1982]、负的（Blackorby *et al.* 1997, 2004, 2005；参见下文费尔德曼的理论）[^blackorby-1997]，或者在人口排序中引入不可通约性或模糊性（Blackorby *et al.* 2005；Broome 2004；Rabinowicz 2009；参见 Parfit 2016）[^blackorby-2005][^broome-2004][^parfit-2016][^rabinowicz-2009]，尽管此人过着值得过的生活。在其最简单的形式中，临界水平观点是总体功利主义的一个修改版：一个人生命的贡献价值，等于其福祉减去一个正临界水平；人口的价值，则通过把人口中所有个体的这些差额加总来计算。临界水平观点由此成功地避开了令人反感的结论。假定临界水平高于人口 *Z* 中个体的福祉水平，那么按临界水平观点，*Z* 的价值为负，从而劣于 *A*，令人反感的结论便被阻断。
    step2: |-
      另一条改造总体功利主义的路子，是设一个临界水平(Kavka 1982, Parfit 1984；Locke 1984；Blackorby *et al*. 1997, 2004, 2005；Broome 2004)[^blackorby-1997][^broome-2004][^kavka-1982][^parfit-1984]。和可变价值观点一样，它也把审慎价值与道德价值分开，只是分得更彻底：一条生命只有生活质量高过某个正临界水平，才对人口价值有正贡献；低于这个水平，其贡献价值或是中性的(Kavka 1982)[^kavka-1982]，或是负的(Blackorby *et al.* 1997, 2004, 2005；参见下文费尔德曼的理论)[^blackorby-1997]，或在人口排序中引入不可通约性或模糊性(Blackorby *et al.* 2005；Broome 2004；Rabinowicz 2009；参见 Parfit 2016)[^blackorby-2005][^broome-2004][^parfit-2016][^rabinowicz-2009]——哪怕此人过的生活值得一过。最简单形态下，临界水平观点是总体功利主义的改良版：一条生命的贡献价值，等于其福祉减去某个正临界水平；人口价值则是所有个体这些差额的总和。这样它就避开了令人反感的结论：只要临界水平高于 *Z* 中个体的福祉水平，按此观点 *Z* 的价值为负，自然劣于 *A*，结论就被挡住。
