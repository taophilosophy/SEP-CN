      However, this conclusion might not be much of a comfort since there are other impossibility results that do not rely on avoidance of the Repugnant Conclusions as one of its adequacy conditions but on avoidance of the intuitively even more unacceptable Very Repugnant Conclusion: For any perfectly equal population with very high positive welfare, and for any number of lives with any very negative welfare, there is a population consisting of the lives with negative welfare and lives with very low positive welfare which is better than the high welfare population, other things being equal (Arrhenius 2011)[^arrhenius-2011]. This conclusion seems much harder to accept than the Repugnant Conclusions. Here we are comparing one population where everybody enjoys very high quality of life with another population where people either have very low positive welfare or very negative welfare (any level of horrible suffering). Even if we were to accept the Repugnant Conclusion, we are not forced to accept the Very Repugnant Conclusion. We might, for example, accept the former but not the latter because we give greater moral weight to suffering than to happiness. Hence, to exorcise the paradoxes of population ethics, it is not sufficient to show that our intuition about the Repugnant Conclusion is wrong or epistemically unreliable. We also have to show that this is true of the Very Repugnant Conclusion, which might strike many as quite a tall order.
    step1: |-
      然而，这一结论未必是多大安慰，因为还有其他不可能性结果，它们不把避开令人反感的结论当作充分性条件之一，而是以避开直觉上更不可接受的极令人反感的结论为条件：对任何福利极高且完全平等的人口，以及对任何数目的、福祉极度为负的生命，都存在一个由负福利生命与极低正福利生命构成的人口，在其他条件相同的情况下，它优于那个高福利人口（Arrhenius 2011）[^arrhenius-2011]。这一结论看来比令人反感的结论更难接受。这里我们比较的是：一个人口人人享有极高生活质量，另一个人口中的人或享有极低正福利、或享有极度负福利（任何程度的可怕痛苦）。即便我们接受令人反感的结论，也未必被迫接受极令人反感的结论。例如，我们可以接受前者而不接受后者，因为我们对痛苦比对幸福赋予更大的道德分量。于是，要驱除人口伦理学的悖论，仅表明我们对令人反感的结论的直觉有误或在认识上不可靠还不够。我们还须表明极令人反感的结论也是如此，而在许多人看来，这是个相当苛刻的要求。
    step2: |-
      可这个结论未必能给人多少安慰。还有别的不可能性结果，它们的充分性条件不是躲开令人反感的结论，而是躲开直觉上更难接受的“极令人反感的结论”：对任何福利极高且完全平等的人口，以及对任何数目的、福祉极度为负的生命，总存在一个人口，由那些负福利生命加上极低正福利生命构成，在其他条件相同的情况下，它优于那个高福利人口(Arrhenius 2011)[^arrhenius-2011]。这个结论看来比令人反感的结论更难咽下。这里比的是一边人人生活质量极高，另一边的人要么只有极低正福利，要么极度负福利（各种程度的可怕痛苦都可能）。就算接受令人反感的结论，也未必得接受极令人反感的结论：比方说，我们可以接受前者而不接受后者，因为痛苦在道德上分量更重。所以，要驱除人口伦理学的悖论，光说明我们对令人反感的结论的直觉有错、或认识上不可靠，还不够；还得对极令人反感的结论也说明这一点——这在许多人看来，要求高得离谱。
