      ### 2.7 Accepting the impossibility of a satisfactory population ethics
    step1: |-
      ### 2.7 接受令人满意的人口伦理学之不可能
    step2: |-
      ### 2.7 接受令人满意的人口伦理学不可能
  - id: 52
