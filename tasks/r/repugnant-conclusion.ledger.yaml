      弗雷德·费尔德曼提出过一个按应得调整的功利主义版本，叫“公正主义”，声称它避得开令人反感的结论(Feldman 1997)[^feldman-1997]。在公正主义里，一段快乐的价值不只取决于快乐水平，还取决于接受者的应得水平。费尔德曼的提议是：有一种幸福水平，人人仅因生而为人便应得。他假定这水平相当于 100 单位快乐，而福利极低的人只享有 1 单位快乐。他给算了一笔账：应得 100 单位、恰好得到 100 单位的人，其生命内在价值是 200；应得 100 单位、却只得到 1 单位的人，其生命内在价值是 −49。由此，凡由福利极低、应得水平 100 的人构成的人口，价值为负；凡福利极高的人口，价值为正。这么看，公正主义似乎躲开了令人反感的结论。而且费尔德曼解释这结论为何不可接受时依据的直觉——总有一种福祉水平，人仅因为是人就该得到——相当有说服力，大概也流传甚广，还能给上文谈的临界水平观点之类的想法撑腰。
