      Still, *A*+ is clearly more unequal than *A*, and it isn’t unreasonable to claim that *A*+ is in this respect worse than *A*. For example, according to Temkin (1993a, p. 200), “the ultimate intuition underlying egalitarianism is that it is bad … for some to be worse off than others through no fault of their own”. Clearly, this is the case in *A*+ since the extra people have not done anything to deserve to be worse off than the better off people. Moreover, as suggested by Temkin, one might hold the view that the greater the number of worst off, the worse the inequality. (Temkin 1993a, p. 200–2)[^temkin-1993a]. Consequently, since the number of worse off extra people in the Mere Addition Paradox has to be enormous to reach the *Z* population (see figure 1) by redistribution of welfare, the inequality involved would be considerable. Hence, there seems to be a prima facie case that egalitarian concerns can solve the Mere Addition Paradox.
