      It has been pointed out, however, that Feldman’s reasoning involves a questionable interpretation of the *ceteris paribus* clause in the repugnant conclusion (Arrhenius 2003)[^arrhenius-2003]. He implicitly assumes that the *ceteris paribus* clause is satisfied whenever the people in the compared populations have the same desert level. A more plausible reading of the *ceteris paribus* clause is that it is satisfied if and only if the compared populations are (roughly) equally good in regard to all other axiologically relevant aspects apart from welfare, including their “desert value”. Hence, to satisfy the *ceteris paribus* clause, the compared populations should be equally good in regard to desert, that is, equally good in regard to the contributive value of the fit between what people deserve and what they get. Given this interpretation of the *ceteris paribus* clause, justicism does imply the repugnant conclusion. If *A* and *Z* are equally good in regard to desert, then justicism ranks *Z* as better than *A* since *Z* has greater total well-being.
    step1: |-
      然而，有人指出，费尔德曼的推理涉及对令人反感的结论中*其他条件不变*条款的可疑解释（Arrhenius 2003）[^arrhenius-2003]。他默然假定：只要所比较人口中的人应得水平相同，*其他条件不变*条款便得到满足。对*其他条件不变*条款更合理的解读是：当且仅当所比较人口在除福祉以外的一切价值论相关方面（包括其“应得价值”）大致同样好时，该条款才得到满足。因此，为满足*其他条件不变*条款，所比较人口应在应得方面同样好，即在“人所应得与其所得之间的匹配所具有的贡献价值”方面同样好。给定对*其他条件不变*条款的这一解释，公正主义确实蕴含令人反感的结论。若 *A* 与 *Z* 在应得方面同样好，那么公正主义把 *Z* 排为优于 *A*，因为 *Z* 的总福利更大。
    step2: |-
      不过有人指出，费尔德曼的推理对令人反感的结论里的*其他条件不变*条款作了一种可疑解读(Arrhenius 2003)[^arrhenius-2003]。他默认：只要所比人口中人的应得水平相同，*其他条件不变*就算满足了。更合理的读法是：当且仅当所比人口在福祉以外的一切价值论相关方面——包括其“应得价值”——大致同样好时，这一条款才满足。如此，要满足*其他条件不变*，所比人口就得在应得方面同样好，也就是在“人应得什么”与“人得到什么”之间那种匹配的贡献价值上同样好。按这个解释，公正主义其实蕴含令人反感的结论：只要 *A* 与 *Z* 在应得方面同样好，公正主义就把 *Z* 排在 *A* 之前，因为 *Z* 的总福利更大。
