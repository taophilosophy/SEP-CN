      Even though Parfit, despite his thorough investigations in *Reasons and Persons*, did not succeed in finding the sought-after ethical Theory X that would avoid the Repugnant Conclusion and other equally unattractive conclusions, this did not seem to destroy his hopes that such a theory could be found (Parfit 1984 p. 451)[^parfit-1984]. However, other theorists have regarded the search for this theory as having more gloomy prospects. This pessimism has been given a more formal content. It has been held that it can be proven that there is no population ethics that satisfies a set of apparently plausible adequacy conditions on such a theory. In fact, several such proofs have been suggested (Arrhenius 2000b, 2011)[^arrhenius-2000b]. What such a theorem would show about ethics is not quite clear. Arrhenius has suggested that an impossibility theorem leaves us with three options: (1) to abandon some of the conditions on which the theorem is based; (2) to become moral sceptics; or (3) to try to explain away the significance of the proofs—alternatives which do not invite an easy choice (cf. Temkin 2012)[^temkin-2012].
    step1: |-
      尽管帕菲特在《理与人》中作了彻底探究，却未能找到所求的伦理理论 X——那种既能避开令人反感的结论、又能避开其他同样不诱人的结论的理论——但这似乎并未摧毁他找到这种理论的希望（Parfit 1984 第 451 页）[^parfit-1984]。然而，另一些理论家认为这种理论的寻求前景更为黯淡。这一悲观主义已被赋予更形式化的内容。有人主张，可以证明不存在满足一组看来合理之充分性条件的人口伦理学。事实上，已有若干这样的证明被提出（Arrhenius 2000b, 2011）[^arrhenius-2000b]。这样的定理会就伦理学表明什么，并不很清楚。Arrhenius 提出，一个不可能性定理留给我们三种选择：(1) 放弃该定理所依据的某些条件；(2) 成为道德怀疑论者；或 (3) 设法把那些证明的重要性解释掉——这些选项都不容人轻易抉择（参见 Temkin 2012）[^temkin-2012]。
    step2: |-
      帕菲特在《理与人》里查了个遍，也没找到他想要的理论 X——那种既躲开令人反感的结论、又躲开其他同样不诱人结论的理论；不过他似乎并未因此放弃希望(Parfit 1984 第 451 页)[^parfit-1984]。另一些理论家则对这场寻求更悲观，并把悲观写成了较形式化的样子：可以证明，不存在满足一组看来合理之充分性条件的人口伦理学。这样的证明已有人给出好几个(Arrhenius 2000b, 2011)[^arrhenius-2000b]。这类定理究竟说明了伦理学的什么，并不很清楚。Arrhenius 说，一个不可能性定理留给我们三条路：(1) 放弃定理所依据的某些条件；(2) 当道德怀疑论者；(3) 想办法把那些证明的分量解释掉——哪条都不好选(参见 Temkin 2012)[^temkin-2012]。
