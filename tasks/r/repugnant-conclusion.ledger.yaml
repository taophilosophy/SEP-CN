      What makes the Repugnant Conclusion so perplexing is that strong arguments can be given which apparently force one into accepting the conclusion. In fact, several arguments to this effect—with affinity to the mere addition reasoning outlined above—have been presented (see e.g. Parfit 1986; Arrhenius 2000b; Kitcher 2000; Tännsjö 2002; Rachels 2004)[^arrhenius-2000b][^kitcher-2000][^parfit-1986][^rachels-2004][^tännsjö-2002]. Roughly, the arguments share the following structure: in comparison between three population scenarios the second scenario is considered better than the first and the third better than the second, leading to the conclusion that the third scenario is better than the first. By iterated application of this line of reasoning one ends up with the Repugnant Conclusion (that *Z* is better than *A*). One of the more radical approaches to such arguments has been to reject the transitivity of the relation “better than” (or “equally as good as”). According to transitivity, if *p* is better than *q*, and *q* is better than *r*, then *p* is better than *r*. However, if transitivity of “better than” is denied then the reasoning leading the Repugnant Conclusion is blocked (Temkin 1987, 2012; Persson 2004; Rachels 2004)[^persson-2004][^rachels-2004][^temkin-1987].
    step1: |-
      令人反感的结论之所以如此令人困惑，是因为可以给出强有力的论证，看来把人逼向接受这个结论。事实上，已有若干这样的论证被提出——它们与上文勾勒的纯粹增加推理相近（参见如 Parfit 1986；Arrhenius 2000b；Kitcher 2000；Tännsjö 2002；Rachels 2004）[^arrhenius-2000b][^kitcher-2000][^parfit-1986][^rachels-2004][^tännsjö-2002]。粗略地说，这些论证共享如下结构：在三个入口情形的比较中，第二个情形被认为优于第一个，第三个优于第二个，于是得出结论：第三个情形优于第一个。反复应用这一推理线，最终便得到令人反感的结论（即 *Z* 优于 *A*）。对付这类论证的较激进进路之一，是拒斥“优于”（或“同样好于”）这一关系的传递性。按传递性，若 *p* 优于 *q*、*q* 优于 *r*，则 *p* 优于 *r*。然而，若否认“优于”的传递性，通向令人反感的结论的推理便被阻断（Temkin 1987, 2012；Persson 2004；Rachels 2004）[^persson-2004][^rachels-2004][^temkin-1987]。
