      Another approach to the problems in population ethics has been the suggestion that the crux of the problem resides in an all too “impersonal” morality and that the problems of population ethics can be solved by a shift to a so-called “person-affecting” morality (Narveson 1967, 1976, 1978; Roberts 1998, 2002, 2004, 2007, 2011)[^narveson-1967][^roberts-1998]. This move has been especially popular in the context of medical ethics where many of the problems of population ethics are actualised. Examples are embryo or egg selection, pre-implantation genetic testing, assisted reproduction programs, abortion, to mention just a few. The idea behind this approach is the contention—sometimes referred to as “the person-affecting restriction” or simply “the slogan”—that an outcome can only be better (or worse) than another if it is better (or worse) for someone (Narveson 1967: Glover 1977; Temkin 1993a)[^glover-1977][^narveson-1967][^temkin-1993a]. If a quite strict interpretation of this restriction is combined with the assumption that non-existence and existence are incomparable in value for a person, we may derive a view called *comparativism*: We should disregard the welfare of uniquely realisable people, that is, people who only exist in one of the compared outcomes (Heyd 1988; Bykvist 1998)[^bykvist-1998]. A person-affecting morality so understood deviates from impersonal morality in important respects. If there is an overlap between the populations in *A* and *Z*, then *A* is ranked as better than *Z* since the people existing in both populations are worse off in *Z* as compared to *A* and since we should disregard the welfare of uniquely realisable people. However, if there are different people in the involved populations, such as two future populations, then the two populations are ranked as equally good or as incomparable in value, which is not a very satisfactory solution to the Repugnant Conclusion. Moreover, comparativism implies that any very huge loss in welfare for uniquely realisable people is compensated by any very small gain for non-uniquely realisable people. Less strict interpretations of the person-affecting restriction and comparativism can to a certain extent avoid these problems, but at the price of implying the Repugnant Conclusion again (Arrhenius 2009a; Holtug 2004)[^arrhenius-2009a][^holtug-2004].
    step1: |-
      面对人口伦理学问题的另一条进路，是主张问题的症结在于一种过于“非人格的”道德，而人口伦理学的问题可以通过转向所谓“影响个人的”道德来解决（Narveson 1967, 1976, 1978；Roberts 1998, 2002, 2004, 2007, 2011）[^narveson-1967][^roberts-1998]。这一转向在医学伦理语境中尤其流行，那里人口伦理学的许多问题都现实化了。例子有胚胎或卵子选择、植入前基因检测、辅助生殖项目、堕胎等等，仅举数端。这一进路背后的想法是这样一种主张——有时称作“影响个人的限制”或径称“口号”：一个结果只有对某人更好（或更糟），才能比另一结果更好（或更糟）（Narveson 1967: Glover 1977；Temkin 1993a）[^glover-1977][^narveson-1967][^temkin-1993a]。若把这一限制的严格解释与“非存在与存在对一个人而言在价值上不可比”的假定结合起来，便可得出一种称为*比较主义*的观点：我们应当无视唯一可实现者——即只在所比较结果之一中存在的人——的福祉（Heyd 1988；Bykvist 1998）[^bykvist-1998]。如此理解的影响个人的道德，在若干重要方面偏离非人格的道德。若 *A* 与 *Z* 的人口有重叠，那么 *A* 被排为优于 *Z*，因为两个人口中都存在的人在 *Z* 中境况比在 *A* 中更糟，而我们应当无视唯一可实现者的福祉。然而，若所涉人口中的人是不同的，比如两个未来人口，那么这两个人口便被排为同样好，或在价值上不可比；作为对令人反感的结论的解答，这并不令人满意。此外，比较主义蕴含：唯一可实现者福祉上的任何巨大损失，都由非唯一可实现者福祉上的任何微小增益所补偿。对影响个人的限制与比较主义作不那么严格的解释，能在一定程度上避开这些问题，但代价是再次蕴含令人反感的结论（Arrhenius 2009a；Holtug 2004）[^arrhenius-2009a][^holtug-2004]。
    step2: |-
      还有一条进路认为，人口伦理学的症结在于道德过于“非人格”，只要转向所谓“影响个人的”道德，问题就能解决(Narveson 1967, 1976, 1978；Roberts 1998, 2002, 2004, 2007, 2011)[^narveson-1967][^roberts-1998]。这股风在医学伦理里尤其盛行，因为人口伦理学的许多问题在那里都成了现实：胚胎或卵子选择、植入前基因检测、辅助生殖、堕胎，等等，仅举几例。这条进路的核心是一条主张——有时叫“影响个人的限制”，有时干脆叫“口号”：一个结果只有对某人更好（或更糟），才谈得上比另一个结果更好（或更糟）(Narveson 1967: Glover 1977；Temkin 1993a)[^glover-1977][^narveson-1967][^temkin-1993a]。若把这条限制作相当严格的解释，再假定“非存在与存在对一个人来说价值上不可比”，就会得出一种叫*比较主义*的观点：凡是唯一可实现的人——即只在所比结果之一里存在的人——其福祉一概不计(Heyd 1988；Bykvist 1998)[^bykvist-1998]。这样理解的影响个人的道德，在几处要紧地方偏离非人格的道德。假如 *A* 与 *Z* 的人口有重叠，那么 *A* 排在 *Z* 之前：两边都在的人一到 *Z* 就过得更差，而唯一可实现者的福祉又不计。可要是两边的人是不同的——比如两个未来人口——那就只好判为一样好，或价值上不可比；拿这个回答令人反感的结论，实在不能令人满意。再者，比较主义蕴含：唯一可实现者的福祉损失再大，也能被非唯一可实现者的极小增益抵消。把这条限制和比较主义解释得宽松些，可以在一定程度上绕开上述麻烦，但代价是令人反感的结论又回来了(Arrhenius 2009a；Holtug 2004)[^arrhenius-2009a][^holtug-2004]。
