      Fred Feldman has proposed a desert-adjusted version of utilitarianism, ‘justicism’ which he claims avoids the Repugnant Conclusion (Feldman 1997)[^feldman-1997]. In justicism, the value of an episode of pleasure is determined not only by the hedonic level but also by the recipient’s desert level. Feldman’s proposal is that there is some level of happiness that people deserve merely in virtue of being people. He assumes that this level corresponds to 100 units of pleasure and that people with very low welfare enjoy only one unit of pleasure. He suggests that the life of a person who deserves 100 units of pleasure and receives exactly that amount of pleasure has an intrinsic value of 200, whereas the life of a person deserving 100 units but who only receives one unit of pleasure has an intrinsic value of −49. It follows that any population consisting of people with very low welfare and desert level 100 has negative value, whereas any population with very high welfare has positive value. Consequently, it seems as if justicism avoids the Repugnant Conclusion. Moreover, the intuition behind Feldman’s explanation of the unacceptability of the Repugnant Conclusion—that there is some level of welfare that people deserve merely in virtue of being people—is compelling and probably widely shared and could give support to ideas such as the critical level view discussed above.
    step1: |-
      弗雷德·费尔德曼提出了一种按应得调整的功利主义版本——“公正主义”，他声称它避开了令人反感的结论（Feldman 1997）[^feldman-1997]。在公正主义中，一段快乐的价值不仅由快乐水平决定，也由接受者的应得水平决定。费尔德曼的提议是：存在某种幸福水平，人们仅凭其为人便应得。他假定这一水平相当于 100 个单位的快乐，而福利极低的人仅享有 1 个单位的快乐。他提出：一个应得 100 单位快乐且恰好得到这么多快乐的人，其生命的内在价值为 200；而一个应得 100 单位却只得到 1 单位快乐的人，其生命的内在价值为 −49。由此推出：任何由福利极低、应得水平为 100 的人构成的人口，其价值为负；而任何福利极高的人口，其价值为正。于是，公正主义似乎避开了令人反感的结论。此外，费尔德曼对令人反感的结论之不可接受性的解释背后的直觉——存在某种人们仅凭其为人便应得的福祉水平——颇具说服力，大概也广为分享，并能支持上文讨论的临界水平观点之类的想法。
