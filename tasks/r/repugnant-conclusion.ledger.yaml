      Depending on how precisely various different value principles are worked out they have different implications, which critics have regarded as devastating. For instance, on Ng’s explication of this view (Ng 1989) according to which the value of a population is determined by the product of the average welfare and a concave transformation of the number of lives, it follows that it can be better to add people with negative welfare rather than positive welfare to a population. More exactly, Ng’s theory implies the “Sadistic Conclusion” (Arrhenius 2000a)[^arrhenius-2000a]: For any number of lives with any negative welfare (e.g. tormented lives), there are situations in which it would be better to add these lives rather than some number of lives with positive welfare. Moreover, even if it might be reasonable to hold that the value of extra lives with positive welfare decreases asymptotically towards a limit, the analogous assumption about lives with negative welfare isn’t very attractive. Hence, given the reasonable assumption that the negative value of adding extra lives with negative welfare does not decrease relatively to population size, a proportional expansion in the population size can turn a good population into a bad one—a version of the so-called “Absurd Conclusion” (Parfit 1984)[^parfit-1984]. A population of one million people enjoying very high positive welfare and one person with negative welfare seems intuitively to be a good population. However, since there is a limit to the positive value of positive welfare but no limit to the negative value of negative welfare, proportional expansions (two million lives with positive welfare and two lives with negative welfare, three million lives with positive welfare and three lives with negative welfare, and so forth) will in the end yield a bad population.
    step1: |-
      取决于各种不同价值原则被制定得多么精确，它们有不同的蕴含，批评者视之为致命问题。例如，按 Ng 对这一观点的阐释（Ng 1989），人口的价值由平均福利与生命数目的凹变换之积决定；由此推出：向人口增加负福利的人，可能比增加正福利的人更好。更确切地说，Ng 的理论蕴含“施虐结论”（Arrhenius 2000a）[^arrhenius-2000a]：对任何数目的负福利生活（例如受折磨的生活），都存在一些情形，在其中增加这些生活比增加某些数目的正福利生活更好。此外，即便有理由认为正福利额外生命的价值渐近递减至某上限，关于负福利生活的类似假定却不怎么吸引人。于是，给定一个合理假定——增加负福利额外生命的负价值不随人口规模相对递减——人口规模的按比例扩张就能把一个好人口变成坏人口，这是所谓“荒谬结论”的一个版本（Parfit 1984）[^parfit-1984]。一个百万人享有极高正福利、另有一人负福利的人口，直觉上看来是个好人口。然而，正福利的正价值有上限，负福利的负价值却无下限，因此按比例扩张（两百万正福利生命加两条负福利生命，三百万加三条，依此类推）最终将得出一个坏人口。
    step2: |-
      这些价值原则怎么精确化，蕴含就怎么变，批评者认为其中一些是致命的。比如 Ng 的阐释(Ng 1989)：人口价值等于平均福利乘以生命数目的凹变换；照此，往人口里添负福利的人，竟可能比添正福利的人更好。更确切地说，Ng 的理论引出“施虐结论”(Arrhenius 2000a)[^arrhenius-2000a]：不管有多少条负福利生活（比如受折磨的生活），总有情形表明，添上这些生活比添上若干正福利生活更好。再者，说正福利的额外生命其价值渐近递减到某个上限，还算说得过去；可对负福利生活作同样的假定，就不太吸引人了。于是，只要承认一个合理的假定——添负福利生命的负价值并不随人口规模相对缩小——人口按比例扩张就能把好人口变成坏人口，这是所谓“荒谬结论”的一个版本(Parfit 1984)[^parfit-1984]。一百万条极高正福利生活加一条负福利生活，直觉上像是个好人口；但正福利的价值有上限，负福利的负价值却没有下限，按比例扩张下去（两百万正福利加两条负福利，三百万加三条，如此类推），到头来还是个坏人口。
