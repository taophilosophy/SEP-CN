      人们也可以尝试诉诸平等主义考量来解决纯粹增加悖论。再考虑图 2 中的人口 *A* 与 *A*+。按一条众所周知的原则——最大化最小值，我们应当按最差者的福祉来排列人口：最差者的福祉越低，人口越糟。最大化最小值把 *A*+ 排为劣于 *A*，从而在第一步就止住纯粹增加悖论。然而，最大化最小值在人口伦理学中还有若干其他反直觉的蕴含，因为它强加了一种最差者的独裁：最差者中某人福祉上的丝毫增益，压过任何数目境况较好者的极大损失。
