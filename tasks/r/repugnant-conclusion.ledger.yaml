      The comparativist interpretation of the distinction between “impersonal” and “person-affecting” theories is not the only one proposed in the literature. What the different theories that have been proposed under the banner of a person-affecting morality have in common, however, are that they are welfarist theories that count people’s welfare differently depending on the temporal location or the modal features of their lives. Apart from comparativists, we have *presentists* who draw a distinction between presently existing people and non-existing people (Narveson 1973; Heyd 1988); *necessitarians* who distinguish between people who exist or will exist irrespective of how we act and people whose existence is contingent on our choices (Singer 1993)[^singer-1993]; and *actualists* who differentiate between people that have existed, exist or who are going to exist in the actual world, on the one hand, and people who haven’t, don’t, and won’t exist, on the other (Bigelow and Pargetter 1988; Warren 1978; Parson 2002; for a critical discussion of actualism, see Carlson 1995; Arrhenius 2000b; Bykvist 1998, 2007b; Hare 2007; Howard-Snyder 2008)[^arrhenius-2000b][^bigelow-1988][^bykvist-1998][^carlson-1995][^hare-2007][^howard-snyder-2008][^parson-2002][^warren-1978]. These theories, apart from problems of their own, run into problems analogous to the problems of comparativism discussed above. For instance, presentism, in its strict guise according to which we only take into account the welfare of presently existing people, implies that any very small gain for present people outweighs any loss for future people, irrespective of how big it is. Again, a less strict interpretation of presentism (Dasgupta 1988, 1994)[^dasgupta-1988] can to a certain extent avoid this and related problems, but at the price of implying the Repugnant Conclusion again.
    step1: |-
      对“非人格的”与“影响个人的”理论之分的比较主义解释，并不是文献中提出的唯一解释。然而，以影响个人的道德为旗号提出的各种理论有一个共同点：它们都是福利主义理论，依据人们生命的时间位置或模态特征而以不同方式计算其福祉。除比较主义者外，还有*现在主义者*，他们区分现在存在的人与非存在的人（Narveson 1973；Heyd 1988）；*必然主义者*，他们区分不论我们如何行动都会存在或将存在的人，与存在取决于我们选择的人（Singer 1993）[^singer-1993]；以及*现实论者*，他们区分在现实世界中已存在、现存在或将存在的人，与未曾存在、现在不存在、将来也不会存在的人（Bigelow and Pargetter 1988；Warren 1978；Parson 2002；对现实论的批判性讨论见 Carlson 1995；Arrhenius 2000b；Bykvist 1998, 2007b；Hare 2007；Howard-Snyder 2008）[^arrhenius-2000b][^bigelow-1988][^bykvist-1998][^carlson-1995][^hare-2007][^howard-snyder-2008][^parson-2002][^warren-1978]。这些理论除了自身的问题外，还会落入与上文讨论的比较主义问题相类似的问题。例如，现在主义在其严格形态下——只考虑现在存在者的福祉——蕴含：现在人的任何极小增益都压过未来人的任何损失，无论损失多大。再说，对现在主义作不那么严格的解释（Dasgupta 1988, 1994）[^dasgupta-1988]，能在一定程度上避开这一问题及相关问题，但代价是再次蕴含令人反感的结论。
    step2: |-
      “非人格”与“影响个人”之分，文献里不止比较主义一种解读。不过，打着影响个人的道德旗号的各种理论有个共同点：都是福利主义理论，只是按生命的时间位置或模态特征，对人的福祉作不同计算。除了比较主义者，还有*现在主义者*，把现在存在的人与非存在的人分开(Narveson 1973；Heyd 1988)；有*必然主义者*，把不管我们怎么做都会存在（或将会存在）的人，与存在取决于我们选择的人分开(Singer 1993)[^singer-1993]；还有*现实论者*，把在现实世界中已存在、现存在或将会存在的人，与未存在、现不存在、也不会存在的人分开(Bigelow and Pargetter 1988；Warren 1978；Parson 2002；对现实论的批判性讨论见 Carlson 1995；Arrhenius 2000b；Bykvist 1998, 2007b；Hare 2007；Howard-Snyder 2008)[^arrhenius-2000b][^bigelow-1988][^bykvist-1998][^carlson-1995][^hare-2007][^howard-snyder-2008][^parson-2002][^warren-1978]。这些理论除了各自的麻烦，还会掉进跟上面比较主义类似的问题里。比如现在主义的严格形态只算现在存在者的福祉，于是蕴含：现在人的任何一丁点增益，都能压过未来人的任何损失，不管那损失多大。把现在主义解释得宽松些(Dasgupta 1988, 1994)[^dasgupta-1988]，能在一定程度上绕开这个问题及其相关问题，但代价还是令人反感的结论又冒出来。
