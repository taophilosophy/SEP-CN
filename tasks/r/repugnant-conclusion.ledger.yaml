      An attempt to produce a compromise between a total principle and an average principle is provided by a variable value principle. The idea behind this view is that the value of adding worthwhile lives to a population varies with the number of already existing lives in such a way that it has more value when the number of these lives is small than when it is large (Hurka 1983, Ng 1989; Sider 1991)[^hurka-1983][^sider-1991]. Taking this view, Noah’s obligation to procreate after the Deluge was much stronger than our obligation today. Variable value principles are sometimes called “compromise theories” since they can be said to be a compromise between total and average utilitarianism (for a version that is sensitive to more aspects regarding welfare, see Temkin 1997, 2012)[^temkin-1997]. With small populations enjoying high welfare, a variable value principle behaves like total utilitarianism and assigns most of the value to the total sum of welfare. For large populations with low welfare, the principle mimics average utilitarianism and assigns most of the value to average welfare. This property is what makes it possible to avoid the Repugnant Conclusion. If the value of extra lives decreases asymptotically, then there may exist an upper limit to the total value of a population (exactly as the sum of the infinite series 1+1/2+1/4+ … has the upper limit 2). As long as population *A* in Fig. 1 has a total value above this limit this population will be preferable no matter how populous the low quality population *Z* is (Hurka 1983, Ng 1989; Sider 1991; Temkin 1997, 2012)[^hurka-1983][^sider-1991][^temkin-1997].
    step1: |-
      可变价值原则提供了在总体原则与平均原则之间折中的一种尝试。其背后的想法是：向人口增加值得过的生活，其价值随既有生命数目的变化而变化——既有的生命数目小时，增加的价值大；数目大时，增加的价值小（Hurka 1983, Ng 1989；Sider 1991）[^hurka-1983][^sider-1991]。持此观点，挪亚在大洪水之后繁衍后代的义务远强于我们今日的义务。可变价值原则有时被称为“折中理论”，因为可以说它是总体功利主义与平均功利主义之间的折中（关于对更多福祉方面敏感的版本，见 Temkin 1997, 2012）[^temkin-1997]。在享有高福利的小人口中，可变价值原则表现得像总体功利主义，把大部分价值归于福祉的总和。在福利低的大人口中，该原则模仿平均功利主义，把大部分价值归于平均福利。正是这一性质使它有可能避开令人反感的结论。若额外生命的价值渐近递减，那么人口的总价值可能存在一个上限（正如无穷级数 1+1/2+1/4+ … 之和有上限 2）。只要图 1 中人口 *A* 的总价值高于这一上限，那么无论低质量人口 *Z* 多么众多，*A* 都更可取（Hurka 1983, Ng 1989；Sider 1991；Temkin 1997, 2012）[^hurka-1983][^sider-1991][^temkin-1997]。
    step2: |-
      可变价值原则想在总体原则与平均原则之间折中。它的想法是：往人口里添一条值得过的生活，这份增量的价值随既有生命数而变——人少时添头大，人多时添头小(Hurka 1983, Ng 1989；Sider 1991)[^hurka-1983][^sider-1991]。照此说来，挪亚在大洪水之后生养众多的义务，就比我们今天的义务重得多。可变价值原则有时被叫作“折中理论”，因为可以说它正是总体功利主义与平均功利主义之间的折中(对更多福祉面向敏感的版本，见 Temkin 1997, 2012)[^temkin-1997]。人口小、福利高时，它像总体功利主义，把大部分价值判给福祉总量；人口大、福利低时，它学平均功利主义，把大部分价值判给平均福利。正是这一点使它有可能避开令人反感的结论：若额外生命的价值渐近递减，人口总价值就可能有个上限（正如无穷级数 1+1/2+1/4+ … 之和以 2 为上限）。只要图 1 中 *A* 的总价值高于这个上限，那边低质量的 *Z* 人口再多，*A* 也照样更可取(Hurka 1983, Ng 1989；Sider 1991；Temkin 1997, 2012)[^hurka-1983][^sider-1991][^temkin-1997]。
