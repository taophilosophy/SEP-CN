      One of the questions raised by this radical proposal is whether arguments like the mere addition paradox themselves justify the rejection of transitivity or whether further arguments are needed since transitivity seems to be part of the meaning and logic of the relation “better than” (Broome 2004)[^broome-2004]. However, it has been suggested that there are two “better than”-concepts, one based on intrinsic value and one based on the stance that one ought to take towards the evaluated objects (Arrhenius 2004; Rabinowicz 2012)[^arrhenius-2004][^rabinowicz-2012]. The former is transitive in virtue of its meaning whereas the latter is non-transitive over different alternative sets, just like “ought to be chosen”. Moreover, Temkin (2012) argues that it is the latter “better than”-concept which is the important one for practical reasoning. This raises the question of the more general implications of this proposal for morality and practical reasoning and some worry that giving up the transitivity of “better than” would demand a major revision of our notion of practical reasoning (Temkin 1987, 2012)[^temkin-1987]. A transitive preference ordering has usually been assumed as part of the definition of a rational agent in economic and rational choice theory. For example, it seems that an agent with a non-transitive preference ordering can be exploited by a so-called ‘money-pump’ (see Section 5.1 of the entry on the philosophy of economics). The main problem with non-transitive value orderings in moral theory, however, is that such an ordering cannot form the basis of a satisfactory answer to the question of what one ought to choose. Coupled with the standard formulation of consequentialism (an action is right if and only if its outcome is at least as good as the outcomes of all the alternative actions, see the entry on consequentialism), for example, we get the counterintuitive result that no action is right in the mere addition paradox. Moreover, it has been shown that the mere addition argument and the like can be reconstructed on the normative level, in terms of what one ought to choose, without an appeal to transitivity (Arrhenius 2004)[^arrhenius-2004]. Instead of a non-transitive ordering of populations, one gets a situation in which all of the available actions are forbidden, i.e., a moral dilemma. Hence, it doesn’t look like we can exorcise the paradoxes of population ethics by giving up some formal condition like the transitivity of “better than”.
    step1: |-
      这一激进提议引出的问题之一是：纯粹增加悖论这类论证本身是否足以证成对传递性的拒斥，还是需要更多论证，因为传递性看来是“优于”这一关系的意义与逻辑的一部分（Broome 2004）[^broome-2004]。然而，有人提出存在两个“优于”概念，一个基于内在价值，一个基于人应当对被评价对象采取的态度（Arrhenius 2004；Rabinowicz 2012）[^arrhenius-2004][^rabinowicz-2012]。前者凭其意义而传递，后者则在不同备选项集合上不传递，正如“应当被选择”一样。此外，Temkin（2012）主张，对实践推理而言要紧的是后一个“优于”概念。这就引出这一提议对道德与实践推理的更一般蕴含，以及某种担忧：放弃“优于”的传递性会要求对我们的实践推理概念作重大修正（Temkin 1987, 2012）[^temkin-1987]。传递性的偏好排序通常被当作经济与理性选择理论中理性行为者定义的一部分。例如，偏好排序不传递的行为者似乎会被人利用，落入所谓“抽钱机”（见经济学哲学词条第 5.1 节）。然而，道德理论中不传递的价值排序的主要问题在于：这种排序无法构成对“人应当选择什么”这一问题的满意答案的基础。例如，与后果主义的标准化表述（一个行动是对的，当且仅当其结果至少与一切备选行动的结果一样好，见后果主义词条）相结合，我们便得到反直觉的结果：在纯粹增加悖论中没有任何行动是对的。此外，已有论证表明，纯粹增加论证之类可以在规范层面上重构，即以人应当选择什么来表述，而不诉诸传递性（Arrhenius 2004）[^arrhenius-2004]。我们得到的不是人口的不可传递排序，而是所有可选行动都被禁止的情形，即道德困境。看来，放弃“优于”的传递性这类形式条件，并不能驱除人口伦理学的种种悖论。
    step2: |-
      这个激进提议先要回答一个问题：是纯粹增加悖论这类论证本身就足以证成对传递性的拒斥，还是需要更多论证？毕竟传递性看来是“优于”这一关系的意义与逻辑的一部分(Broome 2004)[^broome-2004]。不过有人提出，其实有两个“优于”概念：一个基于内在价值，一个基于人该对被评价对象采取什么态度(Arrhenius 2004；Rabinowicz 2012)[^arrhenius-2004][^rabinowicz-2012]。前者因其意义而传递；后者面对不同的备选项集合则不传递，就像“应当被选择”一样。Temkin(2012)还主张，对实践推理要紧的恰是后一个概念。这样一来，就得追问这一提议对道德和实践推理有哪些更一般的蕴含，也有人担心：放弃“优于”的传递性，等于要求对实践推理观念作大修(Temkin 1987, 2012)[^temkin-1987]。在经济与理性选择理论里，偏好排序的传递性一向被当作理性行为者定义的一部分。偏好不传递的行为者，似乎会被人用“抽钱机”榨干(见“经济学哲学”词条第 5.1 节)。然而道德理论里不传递的价值排序，最大的麻烦是它撑不起“人应当选择什么”的满意答案。举例说，配上后果主义的标准表述(一个行动是对的，当且仅当其结果至少与一切备选行动的结果一样好；见“后果主义”词条)，就会得出反直觉的结果：在纯粹增加悖论里，任何行动都不对。何况已有论证表明，纯粹增加论证之类可以在规范层面重构，用“人应当选择什么”来表述，而不靠传递性(Arrhenius 2004)[^arrhenius-2004]。这样得到的不是人口的不可传递排序，而是所有可选行动都被禁止的局面，也就是道德困境。看来，想靠放弃“优于”的传递性这类形式条件来驱除人口伦理学的悖论，怕是办不到。
