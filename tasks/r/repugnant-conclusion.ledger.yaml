      An obvious challenge to critical level thinking is to make clear what constitutes the appropriate critical level. On the one hand, the level has to be high enough to avoid versions of the Repugnant Conclusion; on the other, the level has to be low enough not to rule out additions of clearly good lives (for an attempted answer to this challenge see Blackorby *et al.* 1997; Broome 2004)[^blackorby-1997][^broome-2004]. Critics have also been sceptical to the idea that the addition of lives worth living (albeit below the critical level) contribute negatively to the value of a population. Finally, it has been shown that this view leads to the Sadistic Conclusion (see above).
    step1: |-
      临界水平思路面临的一个明显挑战，是澄清什么构成恰当的临界水平。一方面，水平须高到足以避开各种版本的令人反感的结论；另一方面，水平又须低到不致排除对明显良好生活的增加（对这一挑战的尝试性回答，见 Blackorby *et al.* 1997；Broome 2004）[^blackorby-1997][^broome-2004]。批评者还怀疑这一想法：增加值得过的生活（尽管低于临界水平）会对人口价值有负贡献。最后，已有论证表明这一观点导向施虐结论（见上文）。
    step2: |-
      临界水平思路有个明显的难题：什么样的临界水平才算恰当？定得高，才躲得开各种版本的令人反感的结论；定得低，才不至于把添上明显良好的生活也排除掉(对这一挑战的尝试性回答，见 Blackorby *et al.* 1997；Broome 2004)[^blackorby-1997][^broome-2004]。批评者还怀疑另一个想法：添上值得过的生活（尽管低于临界水平），竟会对人口价值有负贡献。最后，已有论证表明这个观点会引出施虐结论（见上文）。
