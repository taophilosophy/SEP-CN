      This suggested way of blocking the Repugnant Conclusion obviously presupposes that the superiority view is justified in the first place (for a recent effort, see Parfit 2016)[^parfit-2016]. However, even if this is the case, critics have suggested that this view may still be consistent with some versions of the Repugnant Conclusion (e.g., Ryberg 1996b)[^ryberg-1996b]. Moreover, the superiority view has other implications that might be hard to accept. Assume that there are days of different qualities and that these can be arranged in a descending sequence of goodness or how much they would contribute to the well-being of a life. It seems plausible that there can be such a sequence where the difference in quality of any two adjacent days in the sequence is marginal. For example, consider two days of a life that only differ in respect to one pin-prick in the left thumb. Assume now, as Parfit suggests, that there are days of such quality that some number of these are better than any number of days eating potatoes and listening to muzak. One can then show (Arrhenius 2005; Klint Jensen 2008)[^arrhenius-2005][^klint-2008] that there must be two types of days, call them α-days and β-days, such that some number of α-days is better than any number of β-days although the difference in quality between these days is only marginal.
    step1: |-
      这一阻断令人反感的结论的提议，显然首先预设了优越论本身是正当的（晚近的努力见 Parfit 2016）[^parfit-2016]。然而，即便确实如此，批评者提出，这一观点仍可能与某些版本的令人反感的结论相容（如 Ryberg 1996b）[^ryberg-1996b]。此外，优越论还有其他可能难以接受的蕴含。假定有质量不同的日子，且它们可按善的程度、或按其对一条生命福祉的贡献排成一个下降序列。看来可信的是：可以存在这样的序列，其中任何两个相邻日子的质量差异都是边际的。例如，考虑一条生命中的两天，二者仅在左手拇指被针扎一下这点上不同。现在假定——如帕菲特所设想——存在这样质量的日子，使得其中若干天优于任意多天吃土豆听背景音乐的日子。那么可以证明（Arrhenius 2005；Klint Jensen 2008）[^arrhenius-2005][^klint-2008]：必定存在两类日子，称之为 α 日与 β 日，使得若干 α 日优于任何数目的 β 日，尽管这些日子之间的质量差异只是边际的。
    step2: |-
      这个挡住结论的法子，显然先得假定优越论本身站得住(晚近的努力见 Parfit 2016)[^parfit-2016]。可批评者说，就算它站得住，这个观点仍可能跟某些版本的令人反感的结论兼容(如 Ryberg 1996b)[^ryberg-1996b]。何况优越论还有别的蕴含，未必好接受。假定日子有好有坏，可以按善的程度、或按其对一条生命福祉的贡献，排成一个逐级下降的序列。听起来可信的是：这样的序列可以存在，而其中任何两个相邻日子的质量只差那么一丁点。比如一条生命里的两天，差别仅在左手拇指被针扎了一下。再假定，如帕菲特所设想，有些日子的质量高到这种地步：过若干天这样的日子，胜过任意多天吃土豆、听背景音乐的日子。于是可以证明(Arrhenius 2005；Klint Jensen 2008)[^arrhenius-2005][^klint-2008]：必有两类日子，姑且叫 α 日与 β 日，使若干 α 日优于任何数目的 β 日，而两类日子之间的质量差异却只是边际的。
