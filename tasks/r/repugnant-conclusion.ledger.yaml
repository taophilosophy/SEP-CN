      ## 1. Arriving at the Repugnant Conclusion
    step1: |-
      ## 1 通向令人反感的结论
    step2: |-
      ## 1 如何走到令人反感的结论
  - id: 3
    kind: body
    source: |-
      Parfit is not the first philosopher to have noticed that influential moral views may have implications of the sort outlined in the Repugnant Conclusion. Henry Sidgwick was close to acknowledging the implication when he pointed out that “… the point up to which, on utilitarian principles, population ought to be encouraged to increase, is not that at which the average happiness is the greatest possible—as appears to be often assumed by political economists of the school of Malthus—but that at which the happiness reaches its maximum” (Sidgwick 1907 p. 418; for other early sources, see Broad 1930 pp. 249–250; McTaggart 1927 pp. 452–53; Narveson 1967)[^broad-1930][^mctaggart-1927][^narveson-1967][^sidgwick-1907]. However, it is Parfit who has brought the conclusion to recent philosophical attention both by stressing the importance of the conclusion and by showing how difficult it is to avoid it (Parfit 1984)[^parfit-1984].
    step1: |-
      帕菲特并非第一个注意到有影响的道德观点可能含有令人反感的结论那类蕴含的哲学家。亨利·西季威克几乎承认了这一蕴含，他指出：“……按功利主义原则，人口应当被鼓励增长到的那一点，并不是平均幸福达到可能最大之处——马尔萨斯学派的政治经济学家似乎常作此假定——而是幸福达到其最大值之处”（Sidgwick 1907，第 418 页；其他早期文献见 Broad 1930，第 249–250 页；McTaggart 1927，第 452–53 页；Narveson 1967）[^broad-1930][^mctaggart-1927][^narveson-1967][^sidgwick-1907]。然而，正是帕菲特把这结论带到晚近哲学讨论的前台：他既强调其重要性，又表明要避开它何等困难（Parfit 1984）[^parfit-1984]。
    step2: |-
      有影响的道德观点会引出类似令人反感的结论这样的蕴含，帕菲特并非第一个发觉的人。亨利·西季威克差一点就承认了这一点。他指出：“……按照功利主义原则，人口该被鼓励增长到哪一点，并不在于平均幸福达到可能的最大值——马尔萨斯学派的政治经济学家似乎常这样假定——而在于幸福达到其最大值”(Sidgwick 1907，第 418 页；其他早期文献见 Broad 1930，第 249–250 页；McTaggart 1927，第 452–53 页；Narveson 1967)[^broad-1930][^mctaggart-1927][^narveson-1967][^sidgwick-1907]。不过，真正把这个结论推到晚近哲学聚光灯下的还是帕菲特：他一面强调其分量，一面揭示出要绕开它有多难(Parfit 1984)[^parfit-1984]。
  - id: 4
    kind: body
    source: |-
      Parfit was led to the Repugnant Conclusion by his considerations concerning how we ought to act in cases where our decisions have an impact on who will exist in the future. Consider the following two scenarios (see Parfit 1984 chapter 16)[^parfit-1984]:
    step1: |-
      帕菲特是被他对如下问题的思考引向令人反感的结论的：当我们的决定会影响到未来谁将存在时，我们应当如何行动。试看下面两个情形（见 Parfit 1984 第 16 章）[^parfit-1984]：
    step2: |-
      帕菲特走到令人反感的结论，是出于这样一个考虑：我们的决定会影响到未来谁将出生，这时我们应当如何行事？请比较下面两个情形(见 Parfit 1984 第 16 章)[^parfit-1984]：
  - id: 5
    kind: body
    source: |-
      1. A pregnant mother suffers from an illness which, unless she undergoes a simple treatment, will cause her child to have a permanent impairment which will cause significant suffering throughout the child’s life. If she receives the treatment and is cured her child will have no such impairment.
      2. A woman suffers from an illness which means that, if she gets pregnant now, her child will have a permanent impairment which will cause significant suffering throughout the child’s life. If she postpones her pregnancy a few months until she has recovered, her child will have no such impairment.
    step1: |-
      1. 一位怀孕的母亲罹患某种疾病；除非她接受一次简单治疗，否则会使孩子带有永久性缺陷，在孩子一生中造成显著痛苦。若她接受治疗并被治愈，孩子就不会有此缺陷。
      2. 一位妇女罹患某种疾病，这意味着：若她现在怀孕，她的孩子将带有永久性缺陷，在孩子一生中造成显著痛苦。若她把怀孕推迟几个月、待康复后再孕，孩子就不会有此缺陷。
    step2: |-
      1. 一位孕妇患了病。只要接受一次简单治疗就能治好；若不治疗，孩子会落下永久性缺陷，一生都要承受相当多的痛苦。治好之后，孩子便不会有这样的缺陷。
      2. 一位妇女患了病。这意味着她现在若怀孕，孩子会落下永久性缺陷，一生都要承受相当多的痛苦。她若把怀孕推迟几个月，等病好了再怀，孩子便不会有这样的缺陷。
  - id: 6
    kind: body
    source: |-
      What ought the women to do in the two cases? In case (1) the obvious answer is that the mother ought to undergo the treatment since her child will thereby get a better life. However, when we turn to case (2), it is problematic to appeal to the improved life of some child as the reason for taking action (i.e., postponing the pregnancy). If the woman postpones her pregnancy, then the child that is brought into existence will not be identical to the child she would have had, had she decided to become pregnant while she was ill (it will not be the same ovum and sperm that meet). Hence, the alternative for the child brought into existence during the mother’s illness is non-existence, and to claim that it would have been better for this child if the mother had postponed pregnancy is tantamount to claiming that the child’s non-existence would have been better for the child. Assuming that the child would have a life worth living, this seems wrong if not nonsensical. Indeed, in case (2), there are two hypothetical children and whether or not the mother postpones the pregnancy, neither child will have a “better life” as a result of the mother’s action. For both hypothetical children, the alternative is nonexistence. If the mother postpones her pregnancy while ill, the first child wouldn’t exist, and if she doesn’t postpone, the second child wouldn’t exist. (For a discussion, see Narveson 1967, Parfit 1984, appendix G; Adler 2012; Bykvist 2007c, 2015; Arrhenius & Rabinowicz 2015, McMahan 1981, 2009, 2013; Rabinowicz 2009; Holtug 2010; Fleurbaey & Voorhoeve 2015)[^adler-2012][^arrhenius-2015][^arrhenius-2015-2][^bykvist-2007c][^fleurbaey-2015][^holtug-2010][^mcmahan-1981][^narveson-1967][^parfit-1984][^rabinowicz-2009].
    step1: |-
      在这两个情形中，两位妇女应当怎么做？在情形 (1) 中，明显的答案是母亲应当接受治疗，因为孩子因此会得到更好的生活。然而，转到情形 (2) 时，以某个孩子的生活得到改善为理由来采取行动（即推迟怀孕），就有问题了。如果这位妇女推迟怀孕，那么被带到世上来的那个孩子，与她在患病期间怀孕所会有的孩子并不是同一个（相遇的卵子与精子不同）。于是，对在母亲患病期间被带到世上的那个孩子来说，其替代选项是不存在；而声称母亲若推迟怀孕对这孩子会更好，等于声称这孩子的非存在对它来说会更好。假定这孩子会过上值得一过的生活，这看来就是错的，甚至是无意义的。确实，在情形 (2) 中有两个假设的孩子，无论母亲是否推迟怀孕，两个孩子都不会因母亲的行动而获得“更好的生活”。对两个假设的孩子来说，替代选项都是不存在。若母亲在患病时推迟怀孕，第一个孩子不会存在；若她不推迟，第二个孩子不会存在。（讨论见 Narveson 1967；Parfit 1984 附录 G；Adler 2012；Bykvist 2007c, 2015；Arrhenius & Rabinowicz 2015；McMahan 1981, 2009, 2013；Rabinowicz 2009；Holtug 2010；Fleurbaey & Voorhoeve 2015）[^adler-2012][^arrhenius-2015][^arrhenius-2015-2][^bykvist-2007c][^fleurbaey-2015][^holtug-2010][^mcmahan-1981][^narveson-1967][^parfit-1984][^rabinowicz-2009]。
    step2: |-
      两位妇女各该怎么做？情形 (1) 的答案很清楚：母亲应当接受治疗，因为孩子因此能过上好一些的生活。可到了情形 (2)，再拿“某个孩子的生活会改善”当理由去行动（即推迟怀孕），就讲不通了。因为这位妇女若推迟怀孕，被带到世上的孩子，就跟她带病怀孕会有的那个孩子不是同一个（相遇的卵子与精子都不同）。于是，对母亲患病期间出生的那个孩子来说，替代选项就是不存在；说“母亲若推迟怀孕，对这孩子更好”，就等于说“这孩子不存在对它更好”。假定这孩子的一生值得一过，这话看来就是错的，甚至毫无意义。再说，情形 (2) 里有两个假设的孩子，母亲推不推迟怀孕，两个孩子都不会因她的行动而得到“更好的生活”——两者的替代选项都是不存在：她带病推迟，第一个孩子不会存在；她不推迟，第二个孩子不会存在。（讨论见 Narveson 1967；Parfit 1984 附录 G；Adler 2012；Bykvist 2007c, 2015；Arrhenius & Rabinowicz 2015；McMahan 1981, 2009, 2013；Rabinowicz 2009；Holtug 2010；Fleurbaey & Voorhoeve 2015）[^adler-2012][^arrhenius-2015][^arrhenius-2015-2][^bykvist-2007c][^fleurbaey-2015][^holtug-2010][^mcmahan-1981][^narveson-1967][^parfit-1984][^rabinowicz-2009]。
  - id: 7
    kind: body
    source: |-
      How, if at all, should a change in the identity of the involved parties in the compared outcomes affect our moral evaluation? Parfit refers to this as “the Non-Identity Problem” (see the entry on the nonidentity problem). Following what would probably strike most people as the most plausible answer Parfit favors what he calls the “No-Difference View” (1984 p. 367), which implies that a change in identity should not affect the answer: the woman in case (2) ought to postpone her pregnancy, just as the woman in case (1) ought to undergo the treatment. A straightforward way of capturing the No-Difference View is total utilitarianism according to which the best outcome is the one in which there would be the greatest quantity of whatever makes life worth living (Parfit 1984 p. 387)[^parfit-1984]. However, this view implies that any loss in the quality of lives in a population can be compensated for by a sufficient gain in the quantity of a population; that is, it leads to the Repugnant Conclusion. Consider the following diagram:
    step1: |-
      所比较结果中当事人身份的变化，究竟应当、或者是否应当影响我们的道德评价？帕菲特称之为“非同一性问题”（见非同一性问题词条）。遵循大概会让多数人觉得最合理的答案，帕菲特赞同他所谓的“无差别观点”（1984，第 367 页），它蕴含：身份的变化不应影响答案——情形 (2) 中的妇女应当推迟怀孕，正如情形 (1) 中的妇女应当接受治疗。把握无差别观点的一种直截了当的方式是总体功利主义：按它，最好的结果是能让生活值得一过的东西数量最大的结果（Parfit 1984，第 387 页）[^parfit-1984]。然而，这一观点蕴含：人口中生活质量的任何损失，都可以由人口数量的充分增加来补偿；也就是说，它导向令人反感的结论。试看下图：
    step2: |-
      在所比较的结果里，当事人换了一批，这该不该影响我们的道德评价？帕菲特把这件事称作“非同一性问题”（见“非同一性问题”词条）。他选了大概多数人都会觉得最靠谱的那个答案，称之为“无差别观点”(1984，第 367 页)：身份变了，答案不变。也就是说，情形 (2) 里的妇女应当推迟怀孕，正如情形 (1) 里的妇女应当接受治疗。要抓住无差别观点，最直白的办法是总体功利主义：最好的结果，就是使生活值得一过之物总量最大的那个结果(Parfit 1984，第 387 页)[^parfit-1984]。可这个观点蕴含：人口中生活质量的任何损失，都能用人口数量的足够增加来补偿——这就通向了令人反感的结论。请看下图：
