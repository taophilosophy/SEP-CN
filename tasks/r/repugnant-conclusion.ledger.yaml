      Despite these advantages, average utilitarianism has not obtained much acceptance in the philosophical literature. This is due to the fact that the principle has implications generally regarded as highly counterintuitive. For instance, the principle implies that for any population consisting of very good lives there is a better population consisting of just one person leading a life at a slightly higher level of well-being (Parfit 1984 chapter 19)[^parfit-1984]. More dramatically, the principle also implies that for a population consisting of just one person leading a life at a very negative level of well-being, e.g., a life of constant torture, there is another population which is better even though it contains millions of lives at just a slightly less negative level of well-being (Parfit 1984)[^parfit-1984]. That total well-being should not matter when we are considering lives worth ending is hard to accept. Moreover, average utilitarianism has implications very similar to the Repugnant Conclusion (see Sikora 1975; Anglin 1977)[^anglin-1977][^sikora-1975].
    step1: |-
      尽管有这些优点，平均功利主义在哲学文献中并未获得多少认可。这是因为该原则含有通常被视为极度反直觉的蕴含。例如，该原则蕴含：对任何由极好生活构成的人口，都存在一个更好的人口，仅由一个人构成，其生活处于略高的福祉水平（Parfit 1984 第 19 章）[^parfit-1984]。更富戏剧性的是，该原则还蕴含：对一个仅由一人构成、其生活处于极低负福祉水平（例如持续受折磨的生活）的人口，存在另一个更好的人口，尽管它含有数百万处于略低负福祉水平的生活（Parfit 1984）[^parfit-1984]。当我们考虑值得结束的生活时，总福祉竟不要紧，这难以接受。此外，平均功利主义还有与令人反感的结论非常相似的蕴含（见 Sikora 1975；Anglin 1977）[^anglin-1977][^sikora-1975]。
    step2: |-
      尽管有这些好处，平均功利主义在哲学文献里却没赢得多少认同。原因在于它带出的蕴含大多被视为极度反直觉。比如：任何由极好生活构成的人口，都存在一个更好的人口——只由一人构成，其福祉水平还略高些(Parfit 1984 第 19 章)[^parfit-1984]。更夸张的是：若一个人口只有一人，福祉水平极低（比如终身受折磨），也另有一个更好的人口，里面数百万人生活的福祉水平只比它略低一点(Parfit 1984)[^parfit-1984]。当我们谈论的是值得结束的生活，总福祉居然不算数，这很难接受。何况平均功利主义还会引出与令人反感的结论十分相似的蕴含(见 Sikora 1975；Anglin 1977)[^anglin-1977][^sikora-1975]。
