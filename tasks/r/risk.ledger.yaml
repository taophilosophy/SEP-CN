    source: |-
      Although most of the above-mentioned meanings of “risk” have been referred to by philosophers, a large part of the philosophical literature on risk refers to risk in the more informal sense that was mentioned at the beginning of this section, namely as a state of affairs in which an undesirable event may or may not occur. Several philosophers have criticized the technical definitions of risk for being too limited and not covering all aspects that should be included in risk assessments (Buchak 2014; Pritchard 2015; Shrader-Frechette 1991)[^buchak-2014][^pritchard-2015][^shrader-frechette-1991]. Linguistic evidence indicates that technical definitions of risk have had virtually no impact on the non-technical usage of the word (Boholm et al. 2016)[^boholm-2016].
    step1: |-
      尽管“风险”的上述含义大多曾被哲学家提及，但关于风险的哲学文献有很大一部分指的是本节开头提到的那个更非正式的用法，即这样一种事态：某个不受欢迎的事件可能发生、也可能不发生。若干哲学家批评风险的技术定义过于狭窄，未能涵盖风险评估应当包含的全部方面（Buchak 2014; Pritchard 2015; Shrader-Frechette 1991）[^buchak-2014][^pritchard-2015][^shrader-frechette-1991]。语言学证据表明，风险的技术定义对该词的非技术用法几乎没有影响（Boholm et al. 2016）[^boholm-2016]。
    step2: |-
      上述含义大多曾被哲学家提及，但关于风险的哲学文献有相当大一部分用的是本节开头那个更非正式的用法，即这样一种事态：某个不受欢迎的事件可能发生，也可能不发生。好几位哲学家批评风险的技术定义过于狭窄，未能涵盖风险评估本该包含的全部方面（Buchak 2014; Pritchard 2015; Shrader-Frechette 1991）[^buchak-2014][^pritchard-2015][^shrader-frechette-1991]。语言学证据则表明，风险的技术定义对该词的非技术用法几乎毫无影响（Boholm et al. 2016）[^boholm-2016]。
