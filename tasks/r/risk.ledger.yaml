      Most of the philosophical discussion on risk-benefit analysis has been focused on the assignment of a monetary value to the loss of a human life (MacLean 1994; Heinzerling 2000; 2002)[^heinzerling-2000][^maclean-1994]. It has been claimed that lives and money are incommensurable, and that the determination and use of such “live values” express a lack of respect for human lives. Defenders of risk-benefit analysis have countered that these values are just technical constructs representing what society tends to pay (alternative: ought to pay) in order to save a human life. Risk-benefit analysis can help decision-makers to save as many lives as possible, given that they have a fixed amount of resources that they can assign to life-saving policies (Sunstein 2005)[^sunstein-2005].
    step1: |-
      关于风险—收益分析的哲学讨论，大多集中在给人的生命损失赋予货币价值这一点上（MacLean 1994; Heinzerling 2000; 2002）[^heinzerling-2000][^maclean-1994]。有人声称，生命与金钱不可通约，确定并使用这类“生命价值”表达了对人命的不尊重。风险—收益分析的辩护者回应说，这些价值只是技术性构造，代表社会为拯救一条人命而往往愿意支付（另一说法：应当支付）的数额。给定决策者在救生政策上可支配的资源总量固定，风险—收益分析能帮助决策者尽可能多救人（Sunstein 2005）[^sunstein-2005]。
    step2: |-
      关于风险—收益分析的哲学讨论，大多集中在给生命损失定价这一点上（MacLean 1994; Heinzerling 2000; 2002）[^heinzerling-2000][^maclean-1994]。有人声称，生命与金钱不可通约，确定并使用这类“生命价值”是对人命的不尊重。辩护者则回应：这些数值只是技术性构造，代表社会为救一条人命往往愿意支付（或者说，应当支付）的数额。既然决策者用于救生政策的资源总量固定，风险—收益分析就能帮他们尽可能多救人（Sunstein 2005）[^sunstein-2005]。
