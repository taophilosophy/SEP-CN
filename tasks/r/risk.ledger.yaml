      Hence, a right not to be risk-exposed will have to be defeasible so that it can be overridden in some (but not necessarily all) cases when the increase in probability is small. However, it remains to find a credible criterion for when it should be overridden. As Nozick observed, a probability limit is not credible in “a tradition which holds that stealing a penny or a pin or anything from someone violates his rights. That tradition does *not* select a threshold measure of harm as a lower limit, in the case of harms certain to occur” (Nozick 1974, 75)[^nozick-1974].
    step1: |-
      因此，不被暴露于风险的权利必须可被推翻，以便在概率增幅很小时，能在某些（但不必是所有）情形中被压倒。然而，究竟何时应被压倒，仍有待找到可信的标准。正如诺齐克所观察到的，概率阈值在“一种认为偷人一分钱、一根别针或任何东西都侵害其权利的传统中”并不可信。“在伤害确定会发生的情形中，该传统 *并不* 选择某种伤害的阈值度量作为下限”（Nozick 1974, 75）[^nozick-1974]。
    step2: |-
      于是，“不被暴露于风险”这项权利必须可被推翻，好让它在概率增幅极小的某些（不必是全部）情形中让路。可究竟何时该让路，仍缺一个可信的标准。诺齐克指出：概率阈值在“一种认为偷人一分钱、一根别针或任何东西都侵害其权利的传统中”并不可信；而在伤害确定会发生的情形里，“该传统 *并不* 选取某种伤害的阈值度量作为下限”（Nozick 1974, 75）[^nozick-1974]。
