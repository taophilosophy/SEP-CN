      Safety and the avoidance of risk are major concerns in practical engineering. Safety engineering has also increasingly become the subject of academic investigations. However, these discussions are largely fragmented between different areas of technology. The same basic ideas or “safety philosophies” are discussed under different names for instance in chemical, nuclear, and electrical engineering. Nevertheless, much of the basic thinking seems to be the same in the different areas of safety engineering (Möller and Hansson 2008)[^möller-2008].
    step1: |-
      安全与避免风险是实际工程中的主要关切。安全工程也日益成为学术研究的对象。然而这些讨论在很大程度上分散于不同的技术领域。同样的基本想法或“安全哲学”，在化学工程、核工程、电气工程等领域以不同的名称被讨论。尽管如此，不同安全工程领域中的许多基本思路似乎是相同的（Möller and Hansson 2008）[^möller-2008]。
    step2: |-
      安全与避免风险，是实际工程的主要关切。安全工程也日益成为学术研究的对象，只是这些讨论大多分散在各个技术领域里：同样的基本想法或“安全哲学”，在化学、核能、电气工程中各有名称。尽管如此，各安全工程领域的基本思路看来大体相同（Möller and Hansson 2008）[^möller-2008]。
