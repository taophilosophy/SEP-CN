      Prospect theory can explain some of the ways in which actual behaviour deviates from standard economic models of rational behaviour under risk. Hence the overweighting of probability changes close to zero or unity can be used to explain why people both buy insurance and buy lottery tickets. However, prospect theory is not plausible as a normative theory for rational behaviour under risk. Probably, normative and descriptive theories of risk will have to go in different directions.
    step1: |-
      前景理论能够解释实际行为偏离风险下理性行为之标准经济模型的某些方式。因此，接近零或接近一的概率变化被赋予过高权重，可用来解释人们为什么既买保险又买彩票。然而，前景理论作为风险下理性行为的规范理论并不可信。大概，关于风险的规范理论与描述理论将不得不走不同的方向。
    step2: |-
      前景理论能解释实际行为偏离标准经济模型的某些方式。比如接近零或接近一的概率变化被赋予过高权重，这可以解释人们为什么既买保险又买彩票。但作为风险下理性行为的规范理论，前景理论并不成立。规范理论与描述理论，大概只能分道而行。
