      The probabilistic approach to risk dominates in philosophy as well as in other disciplines, but some philosophers have investigated an alternative, modal account of risk. According to this account, “[t]o say that a target event is risky is to say that (keeping relevant initial conditions for that event fixed) it obtains in close possible worlds” (Pritchard 2016, 562)[^pritchard-2016]. The risk is smaller, the more distant the nearest possible world is in which the target event takes place. This approach has interesting connections with psychological accounts of risk, but it is far from clear how distance between possible worlds should be defined and determined.
    step1: |-
      概率论进路在哲学中与其他学科中一样占主导，但一些哲学家探究了一种替代性的、模态的风险说明。按此说明，“说一个目标事件有风险，就是说（保持该事件的相关初始条件不变）它在邻近的可能世界中发生”（Pritchard 2016, 562）[^pritchard-2016]。目标事件在其中发生的最近可能世界越远，风险就越小。这一进路与关于风险的心理学说明有有趣的关联，但可能世界之间的距离该如何定义与确定，却远不清楚。
    step2: |-
      概率论进路在哲学中如同在其他学科中一样占主导，但有些哲学家探究了一种替代性的模态风险说明。照这种说明，“说一个目标事件有风险，就是说（在保持该事件相关初始条件不变的情况下）它在邻近的可能世界中发生”（Pritchard 2016, 562）[^pritchard-2016]。目标事件在其中发生的最近可能世界越远，风险越小。这一进路与关于风险的心理学说明有颇有意思的关联，但可能世界之间的距离究竟该如何定义、如何确定，却远不清楚。
