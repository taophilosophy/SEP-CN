      Many attempts have been made to predict the risks associated with emerging and future technologies. The role of philosophers in these endeavours has often been to point out the difficulties and uncertainties involved in such predictions (Allhoff 2009; Gordijn 2005)[^allhoff-2009][^gordijn-2005]. Experience shows that even after extensive efforts to make a new product safe, there is a need for post market surveillance (PMS) in order to discover unexpected problems. For instance, before the massive introduction of automobile air bags around 1990, safety engineers performed laboratory tests of different crash scenarios with dummies representing a variety of body weights and configurations (including infants and pregnant women). But in spite of the adjustments of the construction that these tests gave rise to, inflated airbags caused a considerable number of (mostly minor) injuries. By carefully analyzing experiences from actual accidents, engineers were able to substantially reduce the frequency and severity of such injuries (Wetmore 2008)[^wetmore-2008]. For pharmaceutical drugs and some medical devices, post market surveillance is legally required in many jurisdictions.
    step1: |-
      人们做过许多尝试，以预测与新兴技术和未来技术相关联的风险。哲学家在这些努力中的作用，常常是指出此类预测所涉的困难与不确定性（Allhoff 2009; Gordijn 2005）[^allhoff-2009][^gordijn-2005]。经验表明，即便为使新产品安全付出了大量努力，也仍然需要上市后监管（PMS），以发现意外问题。例如，在 1990 年前后大量引入汽车安全气囊之前，安全工程师用代表各种体重与体型的假人（包括婴儿与孕妇）对不同碰撞情形作了实验室测试。然而，尽管这些测试促成了构造上的调整，充气的气囊仍造成了相当数量（大多轻微）的伤害。通过仔细分析实际事故的经验，工程师得以大幅降低此类伤害的频率与严重程度（Wetmore 2008）[^wetmore-2008]。对药品与某些医疗器械，许多法域在法律上要求上市后监管。
    step2: |-
      预测新兴技术与未来技术的风险，人们作过许多尝试。哲学家在这些努力中常扮演的角色，是指出此类预测所涉的困难与不确定性（Allhoff 2009; Gordijn 2005）[^allhoff-2009][^gordijn-2005]。经验表明，即便为使新产品安全付出极大努力，仍需要上市后监管（PMS）来发现意外问题。例如 1990 年前后汽车安全气囊大规模上市之前，安全工程师曾用代表各种体重体型的假人（含婴儿与孕妇）做过不同碰撞情形的实验室测试。尽管这些测试促成了构造调整，充气的气囊还是造成了相当数量（多为轻微）的伤害。工程师仔细分析实际事故的经验，才把这类伤害的频率与严重程度大幅降下来（Wetmore 2008）[^wetmore-2008]。对药品和某些医疗器械，许多法域在法律上要求上市后监管。
