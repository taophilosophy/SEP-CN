      Cautiousness (risk aversion) and risk-seeking (risk affinity) concern a person’s decisions and actions, rather than her beliefs. When making a choice between different action alternatives, a cautious (risk-averse) person tends to choose an alternative with as small probabilities as possible for the worst outcomes. She does so even if it prevents her from maximizing the expected utility of her choice. In contrast, a risk-seeking person looks for options with a high probability for the best outcomes, and she does this even at the expense of not maximizing the expected utility of her choice. (See also section 7.2.)
    step1: |-
      谨慎（风险厌恶）与冒险（风险偏好）关涉一个人的决策与行动，而非其信念。在不同行动方案之间作选择时，谨慎（风险厌恶）的人倾向于选择最坏结果概率尽可能小的方案。她这样做，即便这使她无法最大化其选择的期望效用。相比之下，冒险的人寻求最好结果概率高的选项，她这样做即便牺牲了其选择的期望效用最大化。（亦见第 7.2 节。）
    step2: |-
      谨慎（风险厌恶）与冒险（风险偏好）关涉的是决策与行动，不是信念。在不同行动方案间作选择时，谨慎的人倾向于挑那种最坏结果概率尽可能小的方案，即便这使她无法最大化所选方案的期望效用；冒险的人则寻求最好结果概率高的选项，即便牺牲期望效用最大化也在所不惜。（亦见第 7.2 节。）
