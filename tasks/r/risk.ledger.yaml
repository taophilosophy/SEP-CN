      Several decision rules with this structure have been proposed. One of the earliest was Handa (1977). Currently, the best known proposal in this tradition is prospect theory (Kahneman and Tversky 1979; Tversky and Kahneman 1986)[^kahneman-1979][^tversky-1986], which was developed in order to describe observations from psychological decision experiments more accurately than in expected utility theory. Prospect theory a is a fairly complex theory that also deviates in other ways from expected utility theory. The traditional focus on outcomes is replaced by a focus on losses and gains, which are treated asymmetrically. (See also Section 7.3.)
    step1: |-
      人们提出过若干具有这种结构的决策规则。最早之一的是 Handa（1977）。目前这一传统中最著名的方案是前景理论（Kahneman and Tversky 1979; Tversky and Kahneman 1986）[^kahneman-1979][^tversky-1986]，它之被发展出来，是为了比期望效用理论更准确地描述心理学决策实验的观察结果。前景理论是一种相当复杂的理论，在其他方面也偏离期望效用理论。传统上对结果的关注，被对损失与收益的关注所取代，而二者被不对称地对待。（亦见第 7.3 节。）
    step2: |-
      具有这种结构的决策规则已提出若干。最早的是 Handa（1977）。目前这一传统中最著名的是前景理论（Kahneman and Tversky 1979; Tversky and Kahneman 1986）[^kahneman-1979][^tversky-1986]，它被发展出来，就是为了比期望效用理论更准确地描述心理学决策实验的观察结果。前景理论相当复杂，在其他方面也偏离期望效用理论：对结果的关注让位于对损失与收益的关注，而两者被不对称地对待。（亦见第 7.3 节。）
