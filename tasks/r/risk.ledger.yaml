      In an important class of alternative decision rules, the probabilities used in expected utility calculations are replaced by some other numbers (“decision weights”). This approach was proposed by William Fellner (1961). In most of these constructions, all probabilities are transformed by some transformation function *r*. Instead maximizing the standard expected utility $$p(x) \cdot u(x)$$ the agent will then maximize $$r(p(x)) \cdot u(x)$$
    step1: |-
      在一类重要的替代决策规则中，期望效用计算中所用的概率被替换为某些别的数字（“决策权重”）。这一进路由威廉·费尔纳（William Fellner，1961）提出。在大多数这类构造中，一切概率都经由某个变换函数 *r* 加以变换。于是行为人将不再最大化标准的期望效用 $$p(x) \cdot u(x)$$，而是最大化 $$r(p(x)) \cdot u(x)$$
    step2: |-
      有一类重要的替代决策规则，是把期望效用计算中的概率换成别的数字（“决策权重”）。这条进路由威廉·费尔纳（William Fellner，1961）提出。这类构造大多用一个变换函数 *r* 来变换全部概率：行为人不再最大化标准的期望效用 $$p(x) \cdot u(x)$$，而是最大化 $$r(p(x)) \cdot u(x)$$
