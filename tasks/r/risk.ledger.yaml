    source: |-
      Decision theory is concerned with determining the best way to achieve as valuable an outcome as possible, given the values that we have. In decision theory, our values and goals are taken as given, and the analysis concerns how best to achieve them to an as high degree as possible. Decision-making under risk and uncertainty is one of the major topics in decision theory. It is usually assumed that if the values of a set of potential outcomes are known (for instance from moral philosophy), then purely instrumental considerations are sufficient for determining how best to act under risk or uncertainty in order to achieve the best possible result. (For a critical discussion of that presumption, see Hansson 2013, 49–51.)[^hansson-2013] The values taken for given in decision-theoretical analysis can, but need not, be moral values of the types that are developed and analyzed in moral philosophy.
    step1: |-
      决策理论关涉的是：给定我们所拥有的价值，确定尽可能达成有价值结果的最佳方式。在决策理论中，我们的价值与目标被当作既定，分析关涉的是如何尽可能高水平地达成它们。风险与不确定性下的决策，是决策理论的主要论题之一。通常假定：若一组潜在结果的价值已知（例如来自道德哲学），则纯粹工具性的考量就足以确定在风险或不确定性下如何最佳行动，以取得尽可能最好的结果。（对这一预设的批判性讨论，见 Hansson 2013, 49–51。）[^hansson-2013] 决策论分析中当作既定而取用的价值，可以是、也不必是道德哲学中所发展并分析的那类道德价值。
    step2: |-
      给定我们拥有的价值，怎样尽可能达成有价值的结果？这是决策理论要回答的问题。决策理论把我们的价值与目标视为既定，只分析如何尽可能高水平地达成它们。风险与不确定性下的决策，是它的主要论题之一。通常的假定是：一组潜在结果的价值若已知（例如来自道德哲学），那么单凭工具性考量就足以确定在风险或不确定性下如何行动才能取得最好结果。（对这一预设的批判性讨论，见 Hansson 2013, 49–51。）[^hansson-2013] 决策论分析中当作既定的价值，可以是道德哲学所发展、分析的那类道德价值，但不必是。
