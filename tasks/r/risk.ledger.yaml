      The problem of dealing with risk in rights-based moral theories was formulated by Robert Nozick: “Imposing how slight a probability of a harm that violates someone’s rights also violates his rights?” (Nozick 1974, 74)[^nozick-1974].
    step1: |-
      权利论道德理论中处理风险的问题，由罗伯特·诺齐克提出：“施加多么微小的、侵害某人权利的伤害概率，才算也侵害了他的权利？”（Nozick 1974, 74）[^nozick-1974]。
    step2: |-
      权利论道德理论如何应对风险，这个问题由罗伯特·诺齐克提出：“施加多么微小的、侵害某人权利的伤害概率，才算也侵害了他的权利？”（Nozick 1974, 74）[^nozick-1974]。
  - id: 61
    kind: body
    source: |-
      An extension of a rights-based moral theory to indeterministic cases can be obtained by prescribing that if *A* has a right that *B* does not bring about a certain outcome, then *A* also has a right that *B* does not perform any action that (at all) increases the probability of that outcome. Unfortunately, such a strict extension of rights is untenable in social practice. Presumably, *A* has the right not to be killed by *B*, but it would not be reasonable to extend this right to all actions by *B* that give rise to a very small increase in the risk that *A* dies — such as driving a car in the town where *A* lives. Such a strict interpretation would make human society impossible.
    step1: |-
      把权利论道德理论扩展到不确定情形，可以规定：若 *A* 有权利要求 *B* 不造成某个结果，则 *A* 也有权利要求 *B* 不实施任何（哪怕只是略微）提高该结果概率的行为。不幸的是，这种严格的权利扩展在社会实践中站不住脚。可以设想，*A* 有权利不被 *B* 杀死，但把这一权利扩展到 *B* 一切使 *A* 死亡风险略微增加的行为——例如在 *A* 居住的城镇里开车——就不合理了。这样严格的解释会使人类社会无法存在。
    step2: |-
      要把权利论道德理论扩展到不确定情形，可以这样规定：若 *A* 有权利要求 *B* 不造成某个结果，则 *A* 也有权利要求 *B* 不实施任何会（哪怕略微）提高该结果概率的行为。可惜这种严格的权利扩展在社会实践中站不住脚。不妨说，*A* 有权利不被 *B* 杀死；但把这项权利扩展到 *B* 一切使 *A* 死亡风险略微增加的行为——比如在 *A* 居住的城镇里开车——就不合理了。这样严格的解释会让人类社会无法存在。
  - id: 62
