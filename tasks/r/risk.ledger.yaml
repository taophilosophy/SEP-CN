      Pessimism and optimism concerns a person’s patterns of value-related beliefs about future events. A person is pessimistic about some future development to the extent that she assigns a higher probability to undesired outcomes, and a lower probability to desired ones, than the most plausible assignment. She is optimistic to the extent that she assigns higher probabilities to desired outcomes, and lower probabilities to undesired ones, than the most plausible assignment.
    step1: |-
      悲观与乐观关涉一个人关于未来事件的、与价值相关的信念模式。一个人对某种未来发展是悲观的，程度取决于她把比最可几的赋值更高的概率赋给不想要的结果、把更低的概率赋给想要的结果。她之乐观的程度，则取决于她把更高的概率赋给想要的结果、把更低的概率赋给不想要的结果，超出最可几的赋值。
    step2: |-
      悲观与乐观关涉一个人关于未来事件的、与价值相关的信念模式。对某种未来发展，她若把不想要的结果的概率估得比最可几的赋值更高、把想要的结果估得更低，她就在相应程度上是悲观的；反之，若把想要的结果估得更高、不想要的结果估得更低，她就在相应程度上是乐观的。
