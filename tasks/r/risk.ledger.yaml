      A problem with the function $r$, as defined above, is that the transformed probabilities which it gives rise to will not add up to 1 except in the trivial case when *r* is the identity function (Fishburn 1978)[^fishburn-1978]. To solve this problem, Quiggin (1982) introduced the rule of maximizing *anticipated utility* (also called utility with rank dependent probabilities). Instead of replacing $p(x)$ by a function of the individual probability, $r(p(x))$, he replaced it by a function that also depends on the other probabilities and utilities involved in the problem. The outcomes are first ordered from worst to best, which results in a vector $\langle x_1, x_2 ,\ldots , x_n\rangle$ of outcomes, such that $u(x_1) \leq u(x_2) \leq \ldots \leq u(x_n)$. A decision weight can then be assigned to each outcome, taking into account both its probability and its position in the ranked sequence of outcomes. Since the decision-weight can be different for outcomes with the same probability, Fishburn’s trivialization result does not apply here. There is evidence indicating that rank-dependent utility models may be more empirically adequate than prospect theory (Harrison and Ross 2017)[^harrison-2017].
    step1: |-
      如上定义的函数 $r$ 有一个问题：它所给出的变换后概率，除非在 *r* 为恒等函数的平凡情形中，否则加起来不会等于 1（Fishburn 1978）[^fishburn-1978]。为解决这一问题，Quiggin（1982）引入了最大化 *预期效用*（亦称秩依概率效用）的规则。他不把 $p(x)$ 替换为个体概率的函数 $r(p(x))$，而是替换为一个同时依赖于该问题中所涉其他概率与效用的函数。结果首先从最差到最好排序，得到一个结果向量 $\langle x_1, x_2 ,\ldots , x_n\rangle$，使得 $u(x_1) \leq u(x_2) \leq \ldots \leq u(x_n)$。然后可以给每个结果赋予一个决策权重，同时考虑其概率及其在结果排序序列中的位置。既然概率相同的结果可以有不同决策权重，Fishburn 的平凡化结果在此并不适用。有证据表明，秩依效用模型在经验上可能比前景理论更为适当（Harrison and Ross 2017）[^harrison-2017]。
