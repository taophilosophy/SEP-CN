      Simple safety principles, often expressible as rules of thumb, have a central role in safety engineering. Three of the most important of these are inherent safety, safety factors, and multiple barriers.
    step1: |-
      简单的安全原则常可用经验法则表达，在安全工程中起核心作用。其中最重要的三条是固有安全、安全系数与多重屏障。
    step2: |-
      简单的安全原则往往可以写成经验法则，在安全工程中居于核心位置。其中最重要的三条是：固有安全、安全系数、多重屏障。
  - id: 42
