      In the risk sciences, it is common to distinguish between “objective risk” and “subjective risk”. The former concept is in principle fairly unproblematic since it refers to a frequentist interpretation of probability. The latter concept is more ambiguous. In the psychometric literature on risk from the 1970s, subjective risk was often conceived as a subjective estimate of objective risk. In more recent literature, a more complex picture has emerged. Subjective appraisals of (the severity of) risk depend to a large extent on factors that are not covered in traditional measures of objective risk, such as control and tampering with nature. If the terms are taken in this sense, subjective risk is influenced by the subjective estimate of objective risk, but cannot be identified with it. In the psychological literature, subjective risk is often conceived as the individual’s overall assessment of the seriousness of a danger or alleged danger. Such individual assessments are commonly called “risk perception”, but strictly speaking the term is misleading. This is not a matter of perception, but rather a matter of attitudes and expectations. Subjective risk can be studied with methods of attitude measurement and psychological scaling (Sjöberg 2004)[^sjöberg-2004].
    step1: |-
      在风险科学中，通常区分“客观风险”与“主观风险”。前者原则上相当不成问题，因为它指的是概率的频率论解释。后者则较为含糊。在 1970 年代关于风险的心理测量学文献中，主观风险常被设想为对客观风险的主观估计。在更晚近的文献中，出现了更为复杂的图景。对风险（严重程度）的主观评价，在很大程度上取决于传统客观风险度量未涵盖的因素，如控制与对自然的干预。若在此意义上使用这些术语，则主观风险受对客观风险的主观估计影响，但不能与之等同。在心理学文献中，主观风险常被设想为个体对某个危险或所谓危险之严重性的总体评估。这种个体评估通常被称为“风险感知”，但严格说来这一术语有误导性。这不是感知问题，而是态度与期待问题。主观风险可以用态度测量与心理量表的方法来研究（Sjöberg 2004）[^sjöberg-2004]。
    step2: |-
      风险科学中通常区分“客观风险”与“主观风险”。前者原则上相当不成问题，因为它取的是概率的频率论解释；后者则含糊得多。1970 年代关于风险的心理测量学文献，常把主观风险设想为对客观风险的主观估计。晚近文献呈现出更复杂的图景：对风险（严重程度）的主观评价，很大程度上取决于传统客观风险度量未涵盖的因素，比如控制感、对自然的干预。若在此意义上使用这两个术语，主观风险会受对客观风险的主观估计影响，却不能与之等同。心理学文献常把主观风险设想为个体对某个危险（或所谓危险）严重性的总体评估。这种个体评估通常称作“风险感知”，但严格说来这名字有误导：它关乎的不是感知，而是态度与期待。主观风险可以用态度测量与心理量表的方法来研究（Sjöberg 2004）[^sjöberg-2004]。
