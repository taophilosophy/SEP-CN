    source: |-
      1. It may be useful to shift the focus from risks, described two-dimensionally in terms of probability and severity (or one-dimensionally as the product of these), to actions of risk-taking and risk-imposing. Such actions have many morally relevant properties in addition to the two dimensions mentioned, such as who contributes causally to the risk and in what ways and with what intentions, and how the risk and its associated benefits are distributed.
      2. Important moral intuitions are accounted for by assuming that each person has a prima facie moral right not to be exposed to risk of negative impact, such as damage to her health or her property, through the actions of others. However, this is a prima facie right that has to be overridden in quite a few cases, in order to make social life at all possible. Therefore, the recognition of this right gives rise to what can be called an *exemption problem*, namely the problem of determining when it is rightfully overridden.
      3. Part of the solution to the exemption problem may be obtained by allowing for reciprocal exchanges of risks and benefits. Hence, if *A* is allowed to drive a car, exposing *B* to certain risks, then in exchange *B* is allowed to drive a car, exposing *A* to the corresponding risks. In order to deal with the complexities of modern society, this principle must also be applied to exchanges of different types of risks and benefits. Exposure of a person to a risk can then be regarded as acceptable if it is part of an equitable social system of risk-taking that works to her advantage. Such a system can be required to contain mechanisms that eliminate, or compensate for, social inequalities that are caused by disease and disability. (Hansson 2003; 2013)[^hansson-2003]
    step1: |-
      1. 把关注点从风险——以概率与严重程度两维描述（或作为二者之积一维描述）——转移到冒险与施加风险的行为上，可能是有用的。这类行为除了上述两维之外，还有许多在道德上相关的属性，例如谁在因果上促成了该风险、以何种方式、怀着何种意图，以及风险及其相关利益如何分配。
      2. 重要的道德直觉可以通过如下假定得到说明：每个人对不因他人行为而暴露于负面冲击（如对其健康或财产的损害）的风险，都有一项初显的道德权利。然而，这是一项初显权利，为使社会生活至少成为可能，它在相当多情形中必须被压倒。因此，承认这项权利就引出了可称为 *豁免问题* 的东西，即确定它在何时被正当地压倒的问题。
      3. 豁免问题的一部分解决办法，可能来自允许风险与利益的互惠交换。因此，若 *A* 被允许开车，使 *B* 承受某些风险，那么作为交换，*B* 也被允许开车，使 *A* 承受相应风险。为应对现代社会的复杂性，这一原则还必须应用于不同类型风险与利益的交换。一个人对风险的暴露，若属于一个对其有利的公平冒险社会体系的一部分，便可视为可被接受。这样的体系可以被要求包含消除或补偿由疾病与失能所造成的社会不平等的机制。（Hansson 2003; 2013）[^hansson-2003]
    step2: |-
      1. 把关注点从风险转到冒险与施加风险的行为上，或许有用。风险通常按概率与严重程度两维（或按二者之积一维）描述；而这类行为除了这两维，还带有许多道德上相关的属性：谁在因果上促成了风险、以什么方式、怀着什么意图，风险与相关利益又如何分配。
      2. 假定每个人对不因他人行为而暴露于负面冲击（如健康或财产受损）的风险，都有一项初显的道德权利，可以说明不少重要的道德直觉。但这是初显权利，为使社会生活至少还能运转，它在不少情形中必须让路。承认这项权利，于是引出可称为 *豁免问题* 的东西：它何时才算正当地被压倒？
      3. 豁免问题的部分解法，可能在于允许风险与利益的互惠交换：*A* 获准开车、使 *B* 承受某些风险，作为交换，*B* 也获准开车、使 *A* 承受相应风险。要应对现代社会的复杂性，这条原则还得用于不同类型风险与利益的交换。一个人对风险的暴露，若属于某个对他有利的公平冒险社会体系，便可视为可接受。这样的体系可以被要求含有一些机制，用以消除或补偿由疾病与失能造成的社会不平等。（Hansson 2003; 2013）[^hansson-2003]
