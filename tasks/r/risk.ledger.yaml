  - id: 64
    kind: body
    source: |-
      The problem of dealing with risks in deontological theories is similar to the corresponding problem in rights-based theories. The duty not to harm other people can be extended to a duty not to perform actions that increase their risk of being harmed. However, society as we know it is not possible without exceptions to this rule. The determination of criteria for such exceptions is problematic in the same way as for rights-based theories. All reasonable systems of moral obligations will contain a general prohibition against actions that kill another person. Such a prohibition can (and should) be extended to actions that involve a large risk that a person is killed. However, it cannot be extended to all actions that lead to a minuscule increase in the risk that a person is killed, since that would exclude many actions and behaviours that few of us would be willing to give up. A limit must be drawn between reasonable and unreasonable impositions of risk. It seems as if such delimitations will have to appeal to concepts, such as probabilities and/or the size of the benefits obtained by taking a risk, that are not part of the internal resources of deontological theories.
    step1: |-
      义务论理论中处理风险的问题，与权利论理论中的相应问题类似。不伤害他人的义务，可以扩展为不实施提高他人受伤害风险之行为的义务。然而，若不对这条规则设例外，我们所知的社会就无法存在。为这类例外确定标准，其困难与权利论理论中的相同。一切合理的道德义务体系都会包含一条禁止杀害他人的一般禁令。这样的禁令可以（也应该）扩展到包含较大致人死亡风险的行为。但它不能扩展到一切使致人死亡风险微量增加的行为，因为那将排除许多我们中很少有人愿意放弃的行为与举止。必须在合理与不合理的风险施加之间划出界限。看来这类界定将不得不求助于概率、以及（或）承担风险所获利益之大小这类概念，而它们并不属于义务论理论的内部资源。
    step2: |-
      义务论理论应对风险，难题与权利论理论相似。不伤害他人的义务，可以扩展为不实施提高他人受伤害风险之行为的义务。但只要不给这条规则设例外，我们所知的社会就无法存在。为这类例外定标准，困难与权利论一样。任何合理的道德义务体系都含有禁止杀害他人的一般禁令；这条禁令可以、也应该扩展到含有较大致死风险的行为，却不能扩展到一切使致死风险微量上升的行为——那会把许多我们几乎没人愿意放弃的行为举止都排除掉。总得在合理与不合理的风险施加之间划一条界。而这类划界看来非求助于概率、求助所获利益之大小不可，这些概念却不在义务论理论的内部资源里。
