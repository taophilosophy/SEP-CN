      Many controversies on risk assessment concern the balance between risks of type I and type II errors. Whereas science gives higher priority to avoiding type I errors than to avoiding type II errors, the balance can shift when errors have practical consequences. This can be seen from a case in which it is uncertain whether there is a serious defect in an airplane engine. A type II error, i.e., acting as if there were no such a defect when there is one, would in this case be counted as more serious than a type I error, i.e., acting as if there were such a defect when there is none. (The distinction between type I and type II errors depends on the delimitation of the effect under study. In discussions of risk, this delimitation is mostly uncontroversial. Lemons et al. 1997; van den Belt and Gremmen 2002.)[^lemons-1997][^belt-2002]
    step1: |-
      许多关于风险评估的争论，都关涉第一类错误与第二类错误之风险之间的平衡。科学给予避免第一类错误的优先性高于避免第二类错误，但当错误具有实践后果时，这种平衡可以发生转移。这可以从一个案例看出：某飞机发动机是否存在严重缺陷尚不确定。在此案例中，第二类错误——即当缺陷存在时却当作不存在——会被算作比第一类错误——即当缺陷不存在时却当作存在——更为严重。（第一类错误与第二类错误的区分，取决于对所研究效应的界定。在关于风险的讨论中，这种界定大多无争议。Lemons et al. 1997; van den Belt and Gremmen 2002。）[^lemons-1997][^belt-2002]
    step2: |-
      关于风险评估的许多争论，都涉及第一类错误与第二类错误之间的风险平衡。科学把避免第一类错误放在比避免第二类错误更高的位置，但一旦错误带有实践后果，这个平衡就可能移动。试看一例：某飞机发动机是否有严重缺陷，尚不确定。此时第二类错误——缺陷存在却当作不存在——会被认为比第一类错误——缺陷不存在却当作存在——更严重。（第一类与第二类错误的区分，取决于对所研究效应的界定。在风险讨论中，这种界定大多没有争议。Lemons et al. 1997; van den Belt and Gremmen 2002。）[^lemons-1997][^belt-2002]
