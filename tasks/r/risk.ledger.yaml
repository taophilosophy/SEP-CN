      The *precautionary principle* is often believed to be a general instruction to be cautious. However, this is not what is usually meant by the term “the precautionary principle”. This is a principle that is defined in international treaties and in European legislation. According to these definitions, the precautionary principle concerns how we should act when it is scientifically reasonable to suspect a risk to health or the environment, but the evidence is not strong enough to show conclusively that the risk exists. The precautionary principle says that in such cases we may, and often should, take measures against the potential danger. This definition has been the standard at least since 1992, when the precautionary principle was included both in the United Nations’ Rio Declaration and in the European Union’s Treaty of Rome, which is now called the Treaty on the Functioning of the European Union (Pyhälä et al., 2010). Its practical application depends on the interpretation of scientific evidence that indicates the presence of a danger, but is not strong enough for scientists to treat the existence of that danger as known. The evaluation of such evidence raises methodological and epistemological issues that are in need of further clarification, not least with conceptual tools developed in the philosophy of science.
    step1: |-
      *预防原则* 常被认为是一条要求谨慎的一般指令。然而，“预防原则”一词通常所指的并不是这个。这是一条在国际条约与欧洲立法中得到界定的原则。按这些界定，预防原则关涉的是：当科学上合理地怀疑存在对健康或环境的某个风险、而证据尚不足以确凿地表明该风险确实存在时，我们应如何行动。预防原则说，在此类情形中，我们可以、而且常常应当采取针对潜在危险的措施。至少自 1992 年以来，这一界定就是标准：当年预防原则既被纳入联合国《里约宣言》，也被纳入欧洲联盟的《罗马条约》（今称《欧洲联盟运行条约》）（Pyhälä et al., 2010）。它的实际适用，取决于对如下科学证据的解释：这类证据表明存在某个危险，但强度不足以让科学家把该危险的存在当作已知。对此类证据的评价，提出了有待进一步澄清的方法论与认识论问题，尤其需要科学哲学中发展出的概念工具。
    step2: |-
      *预防原则* 常被当作一条要求谨慎的一般指令，但“预防原则”一词通常并不是这个意思。它是在国际条约与欧洲立法中界定的一条原则，关涉的是这样一种情形：科学上有合理理由怀疑存在对健康或环境的某个风险，证据却不足以确凿地表明该风险确实存在。预防原则说，此时我们可以、而且常常应当采取针对潜在危险的措施。至少自 1992 年起，这一界定就是标准：那年预防原则同时被写入联合国《里约宣言》和欧洲联盟的《罗马条约》（今称《欧洲联盟运行条约》）（Pyhälä et al., 2010）。它在实践中如何适用，取决于如何解释这样一类科学证据——它们表明存在某种危险，强度却不足以让科学家把该危险当作已知。评价这类证据，会带出有待澄清的方法论与认识论问题，尤其需要科学哲学中发展出的概念工具。
