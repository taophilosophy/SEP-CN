      In economics, risk aversion is usually related to money. Let *X* represent a lottery ticket with a 50 per cent chance of winning € 100, and suppose that you consider this ticket to be worth € 30. We then have $EU(X) = u(100)/2$, and $CE(X) = u(30)$. This means that $u(30) = u(100)/2$. If this is a consistent pattern, then the utility of money, as illustrated in a diagram with amounts *x* of money on the x axis and their utilities $u(x)$ on the y axis, will be represented by a concave (hill-like) curve. Similarly, if a risk affine behaviour will be represented by a convex (valley-like curve). Provided that the utility function *u* is twice continuously differentiable, this can be expressed more precisely in the form of the Arrow-Pratt measure of risk aversion/affinity, according to which the agent’s risk aversion at any point *x* is equal to $-u''(x)/u'(x)$. Hence, a person with the utility function $u_1$ is more risk averse at a point *x* than one with utility function $u_2$ if and only if $$-{u_1}''(x)/{u_1}'(x) > -{u_2}''(x)/{u_2}'(x)$$ (Arrow 1965; Pratt 1964)[^arrow-1965][^pratt-1964]. The Arrow-Pratt measure has the advantage of being invariant under transformations of the utility function that preserve the preference relation that it represents (i.e. it is invariant under multiplication of the utility with a positive constant and addition of an arbitrary constant). On the other hand, it can be questioned on philosophical grounds whether risk attitudes can be adequately represented by variations in the utility of money. It can be argued that cautiousness and the utility of money are two separate issues and that they should therefore have independent representations.
    step1: |-
      在经济学中，风险厌恶通常与金钱相关。设 *X* 代表一张有 50% 机会赢得 100 欧元的彩票，并设你认为这张彩票值 30 欧元。于是我们有 $EU(X) = u(100)/2$，且 $CE(X) = u(30)$。这意味着 $u(30) = u(100)/2$。如果这是一种一贯的模式，那么金钱的效用——如以横轴上的金钱数额 *x* 与其在纵轴上的效用 $u(x)$ 所绘的图所示——将由一条凹的（山形的）曲线表示。类似地，风险偏好的行为将由一条凸的（谷形的）曲线表示。只要效用函数 *u* 是二次连续可微的，这一点就可以用阿罗—普拉特风险厌恶／偏好度量的形式更精确地表达：按此度量，行为人在任一点 *x* 的风险厌恶等于 $-u''(x)/u'(x)$。因此，具有效用函数 $u_1$ 的人在点 *x* 处比具有效用函数 $u_2$ 的人更厌恶风险，当且仅当 $$-{u_1}''(x)/{u_1}'(x) > -{u_2}''(x)/{u_2}'(x)$$（Arrow 1965; Pratt 1964）[^arrow-1965][^pratt-1964]。阿罗—普拉特度量的优点在于：在保持其所代表的偏好关系不变的效用函数变换下，它是不变的（即在效用乘以正常数并加上任意常数时不变）。另一方面，从哲学上可以质疑：风险态度是否能由金钱效用的变化来充分表示。可以论证，谨慎与金钱效用是两个不同的问题，因而应有各自独立的表示。
