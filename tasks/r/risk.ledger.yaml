      It is essential to distinguish here between two kinds of risk-related decision processes. One consists in determining which statements about risks should be included in the scientific corpus. The other consists in determining how risk-related information should influence practical measures to protect health and the environment. It would be a strange coincidence if the criteria of evidence in these two types of decisions were always the same. Strong reasons can be given for strict standards of proof in science, i.e. high entry requirements for the corpus. At the same time, there can be valid policy reasons to allow risk management decisions to be influenced by scientifically plausible indications of danger that are not yet sufficiently well-confirmed to qualify for inclusion into the scientific corpus.
    step1: |-
      这里至关重要的是区分两类与风险相关的决策过程。一类是确定关于风险的哪些陈述应被纳入科学知识库。另一类是确定与风险相关的信息应如何影响保护健康与环境的实际措施。如果这两类决策的证据标准总是一样，那将是个奇怪的巧合。人们可以给出强有力的理由，支持科学中严格的证明标准，即知识库的高准入要求。同时也可以有正当的政策理由，允许风险管理决策受到科学上可信但尚未得到充分确证、不足以进入科学知识库的危险迹象的影响。
    step2: |-
      这里要紧的是分清两类与风险相关的决策过程：一类决定关于风险的哪些陈述该进科学知识库；另一类决定与风险相关的信息该怎样影响保护健康与环境的实际措施。这两类决策的证据标准若总是一模一样，那才是奇怪的巧合。科学中严格的证明标准——知识库的高准入门槛——自有强有力的理由；同时，也可以有正当的政策理由，让风险管理决策受到这样一些危险迹象的影响：它们在科学上可信，却尚未得到充分确证，不够资格进入科学知识库。
