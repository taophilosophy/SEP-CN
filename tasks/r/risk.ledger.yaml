      Inherent safety, safety factors, and multiple barriers have an important common feature: They all aim at protecting us not only against risks that can be assigned meaningful probability estimates, but also against dangers that cannot be probabilized, such as the possibility that some unanticipated type of event gives rise to an accident. It remains, however, for philosophers of technology to investigate the principles underlying safety engineering more in detail and to clarify how they relate to other principles of engineering design (Doorn and Hansson 2015)[^doorn-2015].
    step1: |-
      固有安全、安全系数与多重屏障有一个重要的共同特征：它们都旨在保护我们，不仅防范那些可以赋予有意义的概率估计的风险，也防范那些无法概率化的危险，例如某种未预料到的事件引发事故的可能性。然而，技术哲学家仍有待更详细地探究安全工程背后的原则，并澄清它们与其他工程设计原则的关系（Doorn and Hansson 2015）[^doorn-2015]。
    step2: |-
      固有安全、安全系数、多重屏障有一个重要的共同点：它们要保护我们防范的，不只是那些能赋予有意义概率估计的风险，还有那些无法概率化的危险——比如某种未预料到的事件引发事故的可能性。不过，安全工程背后的原则究竟如何，它们与其他工程设计原则是什么关系，仍有待技术哲学家更细致地探究（Doorn and Hansson 2015）[^doorn-2015]。
