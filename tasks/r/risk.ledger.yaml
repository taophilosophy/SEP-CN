      ## 2 认识论
  - id: 18
    kind: body
    source: |-
      When there is a risk, there must be something that is unknown or has an unknown outcome. Therefore, knowledge about risk is knowledge about lack of knowledge. This combination of knowledge and lack thereof contributes to making issues of risk complicated from an epistemological point of view.
    step1: |-
      有风险，就必定有某物是未知的，或其结果未知。因此，关于风险的知识是关于知识之匮乏的知识。知识与知识之匮乏的这种结合，使风险问题从认识论角度看变得复杂。
    step2: |-
      有风险，就必定有某物未知，或某个结果未知。所以，关于风险的知识其实是关于知识之匮乏的知识。知识与知识之匮乏这样搅在一起，风险问题在认识论上就变得棘手。
  - id: 19
    kind: body
    source: |-
      In non-regimented usage, “risk” and “uncertainty” differ along the subjective—objective dimension. Whereas “uncertainty” seems to belong to the subjective realm, “risk” has a strong objective component. If a person does not know whether or not the grass snake is poisonous, then she is in a state of uncertainty with respect to its ability to poison her. However, since this species has no poison there is no risk to be poisoned by it. The relationship between the two concepts “risk” and “uncertainty” seems to be in part analogous to that between “truth” and “belief”.
    step1: |-
      在未加规范化的用法中，“风险”与“不确定性”沿主观—客观这一维度相区别。“不确定性”似乎属于主观领域，而“风险”有很强的客观成分。如果某人不清楚草蛇是否有毒，那么她对该蛇能否毒害她就处于不确定状态。然而，由于这一物种并无毒液，被它毒害的风险并不存在。“风险”与“不确定性”这两个概念之间的关系，似乎部分类似于“真”与“信念”之间的关系。
    step2: |-
      在未加规范化的用法里，“风险”与“不确定性”沿主观—客观这条线相区别。“不确定性”似乎属于主观领域，“风险”则带有很强的客观成分。某人若不知道草蛇是否有毒，那么对该蛇能否毒害自己，她就处于不确定状态。可这一物种根本没有毒液，被它毒害的风险并不存在。“风险”与“不确定性”的关系，似乎部分类似于“真”与“信念”的关系。
  - id: 20
    kind: body
    source: |-
      Regimented decision-theoretical usage differs from this. In decision theory, a decision is said to be made “under risk” if the relevant probabilities are available and “under uncertainty” if they are unavailable or only partially available. Partially determined probabilities are sometimes expressed with probability intervals, e.g., “the probability of rain tomorrow is between 0.1 and 0.4”. (The term “decision under ignorance” is sometimes used about the case when no probabilistic information at all is available.)
    step1: |-
      规范化的决策论用法与此不同。在决策论中，如果相关概率可获得，决策就被说成是在“风险下”作出的；如果概率不可获得或只能部分获得，则说成是在“不确定性下”作出的。部分确定的概率有时用概率区间表示，例如“明天下雨的概率在 0.1 与 0.4 之间”。（“无知下的决策”一词有时用于指完全没有任何概率信息的情形。）
    step2: |-
      规范化的决策论用法与此不同。在决策论中，相关概率可获得时，决策被说成是在“风险下”作出的；概率不可获得或只部分可获得时，则说成是在“不确定性下”作出的。部分确定的概率有时用概率区间表示，比如“明天下雨的概率在 0.1 与 0.4 之间”。（完全没有任何概率信息的情形，有时称作“无知下的决策”。）
  - id: 21
    kind: body
    source: |-
      Although this distinction between risk and uncertainty is decision-theoretically useful, from an epistemological point of view it is in need of clarification. Only very rarely are probabilities known with certainty. Strictly speaking, the only clear-cut cases of “risk” (known probabilities) seem to be idealized textbook cases that refer to devices such as dice or coins that are supposed to be known with certainty to be fair. In real-life situations, even if we act upon a determinate probability estimate, we are not fully certain that this estimate is exactly correct, hence there is uncertainty. It follows that almost all decisions are made “under uncertainty”. If a decision problem is treated as a decision “under risk”, then this does not mean that the decision in question is made under conditions of completely known probabilities. Rather, it means that a choice has been made to simplify the description of this decision problem by treating it as a case of known probabilities. This is often a highly useful idealization in decision theory. However, in practical applications it is important to distinguish between those probabilities that can be treated as known and those that are uncertain and therefore much more in need of continuous updating. Typical examples of the former are the failure frequencies of a technical component that are inferred from extensive and well-documented experience of its use. The latter case is exemplified by experts’ estimates of the expected failure frequencies of a new type of component.
    step1: |-
      风险与不确定性的这一区分虽然在决策论上有用，但从认识论角度看仍需澄清。概率被确定地知道，这种情形极少。严格说来，唯一清晰的“风险”案例（已知概率）似乎只是理想化的教科书案例，即涉及骰子、硬币之类据信可确定知道其公平的装置。在现实生活情境中，即便我们依据某个确定的概率估计行事，我们也不能完全确定该估计恰好正确，因此仍存在不确定性。由此可知，几乎一切决策都是在“不确定性下”作出的。若把某个决策问题当作“风险下”的决策来处理，这并不意味着该决策是在概率完全已知的条件下作出的，而是意味着：为了让该决策问题的描述更简单，人们选择把它当作概率已知的情形。这在决策论中常常是极为有用的理想化。然而在实际应用中，重要的是区分哪些概率可以当作已知的，哪些是不确定的、因而更需要不断更新。前者的典型例子，是由大量有据可查的使用经验推断出的某技术部件的失效频率；后者则以专家对某新型部件预期失效频率的估计为例。
    step2: |-
      风险与不确定性这一区分在决策论上固然有用，从认识论看却仍需澄清。概率能被确定地知道，这极少见。严格说来，唯一清晰的“风险”（已知概率）案例，似乎只是理想化的教科书案例，涉及骰子、硬币这类据信可确定知道其公平的装置。在现实情境中，即便我们照着某个确定的概率估计行事，也不能完全确定这个估计恰好正确，于是仍有不确定性。由此可见，几乎一切决策都是在“不确定性下”作出的。把某个决策问题当作“风险下”的决策来处理，并不是说该决策真是在概率完全已知的条件下作出的，而是说：为了简化对该决策问题的描述，人们选择把它当作概率已知的情形。这在决策论中常常是极有用的理想化。但在实际应用中，要紧的是分清哪些概率可以当作已知，哪些并不确定、因而更需不断更新。前者的典型例子，是由大量有据可查的使用经验推断出的某技术部件失效频率；后者则以专家对某新型部件预期失效频率的估计为例。
  - id: 22
    kind: body
    source: |-
      A major problem in the epistemology of risk is how to deal with the limitations that characterize our knowledge of the behaviour of unique complex systems that are essential for estimates of risk, such as the climate system, ecosystems, the world economy, etc. Each of these systems contains so many components and potential interactions that important aspects of it are unpredictable. However, in spite of this uncertainty, reasonably reliable statements about many aspects of these systems can be made. Anthropogenic climate change is an example of this. Although many details are unknown, the general picture is clear, and there is no reasonable doubt about the existence of anthropogenic climate change, about its major causes and mechanisms, or the overall nature of the risks that it creates for our societies (Mayer et al. 2017; Lewandowsky et al. 2018)[^lewandowsky-2018][^mayer-2017]. The epistemological status of such partial knowledge about complex systems, and the nature of the uncertainty involved, are still in need of further clarification (McKinney 1996, Shrader-Frechette 1997)[^mckinney-1996][^shrader-frechette-1997].
    step1: |-
      风险认识论中的一个主要问题，是如何处理我们关于独特复杂系统行为之知识的局限——这类系统对风险估计至关重要，如气候系统、生态系统、世界经济等等。这些系统每一个都包含如此多的组分与潜在相互作用，以致其重要方面无法预测。然而，尽管有这种不确定性，关于这些系统许多方面仍可作出相当可靠的陈述。人为气候变化即是一例。尽管许多细节未知，总体图景却是清楚的，对于人为气候变化的存在、其主要成因与机制、以及它给我们社会造成的风险的总体性质，都不存在合理的怀疑（Mayer et al. 2017; Lewandowsky et al. 2018）[^lewandowsky-2018][^mayer-2017]。关于复杂系统的这种部分知识的认识论地位，以及其中所涉不确定性的性质，仍有待进一步澄清（McKinney 1996, Shrader-Frechette 1997）[^mckinney-1996][^shrader-frechette-1997]。
    step2: |-
      风险认识论的一大难题，是如何处理我们关于独特复杂系统之知识的局限。这类系统对风险估计至关重要：气候系统、生态系统、世界经济，等等。它们每一个都含有太多组分与潜在相互作用，重要方面因而无法预测。但尽管有这种不确定性，关于这些系统许多方面仍能作出相当可靠的陈述。人为气候变化就是一例：许多细节未知，总体图景却清楚，对人为气候变化的存在、其主要成因与机制，以及它给我们社会带来的风险的总体性质，都不存在合理的怀疑（Mayer et al. 2017; Lewandowsky et al. 2018）[^lewandowsky-2018][^mayer-2017]。这种关于复杂系统的部分知识具有何种认识论地位，其中所涉不确定性又是何种性质，都还有待进一步澄清（McKinney 1996, Shrader-Frechette 1997）[^mckinney-1996][^shrader-frechette-1997]。
