      Hypothetical consensus has been developed as a criterion in contract theory in order to deal with inter-individual problems. We are invited to consider a hypothetical initial situation in which the social order of a future society has not yet been decided. When its future citizens meet to choose a social order, each of them is ignorant of her or his position in any of the social arrangements which they can choose among. According to John Rawls’s theory of justice, they will then all opt for a maximin solution, i.e. a social order in which the worst position that anyone can have in that society is as good as possible. In arguing for that solution, Rawls relied heavily on the assumption that none of the participants knows anything at all about the probability that she will end up in one or other of the positions in a future social order (Rawls 1957; 1971; 1974)[^rawls-1957]. John Harsanyi, who discussed this problem prior to Rawls, assumed that the probability of finding oneself in a particular social position is equal to the share of the population that will have the position in question, and that this is also known by all participants. Hence, if a fifth of the population in a certain type of society will be migrant workers, then each participant in Harsanyi’s initial situation will assume that she has a twenty per cent probability of becoming a migrant worker, whereas none of the participants in Rawls’s initial situation will have a clue what that probability can be. In Harsanyi’s initial situation, the participants will choose the social order with the highest expected utility (probability-weighted utility), thus taking all potential future positions into account, rather than only the least favourable one (Harsanyi 1953; 1955; 1975)[^harsanyi-1953].
    step1: |-
      假设的共识在契约论中被发展为一种标准，用来处理个体间问题。我们被邀请设想一个假设的初始情境，其中未来社会的社会秩序尚未被决定。当未来公民聚会选择社会秩序时，每个人都对自己在可供选择的任何社会安排中的位置一无所知。按照约翰·罗尔斯的正义理论，他们于是都会选择最大化最小值方案，即这样一种社会秩序：其中任何人在该社会中所能处的最差位置都尽可能好。在为该方案论证时，罗尔斯严重依赖如下假定：参与者中无人对自己最终落在未来社会秩序中这一或那一位置的概率有任何了解（Rawls 1957; 1971; 1974）[^rawls-1957]。约翰·海萨尼在罗尔斯之前讨论过这一问题，他假定：发现自己处于某一特定社会位置的概率，等于将拥有该位置的人口比例，且所有参与者都知道这一点。因此，若某种社会中有五分之一人口将是客籍工人，那么海萨尼初始情境中的每个参与者都会假定自己有百分之二十的概率成为客籍工人，而罗尔斯初始情境中的参与者则无人对概率可能是多少有任何线索。在海萨尼的初始情境中，参与者会选择一个期望效用（概率加权效用）最高的社会秩序，从而把一切潜在未来位置都纳入考量，而不只是最不利的那一个（Harsanyi 1953; 1955; 1975）[^harsanyi-1953]。
    step2: |-
      假设的共识则被契约论发展为处理个体间问题的标准。设想一个假设的初始情境：未来社会的社会秩序尚未确定，未来的公民聚在一起选择秩序，而每个人对自己在各种可选社会安排中的位置一无所知。按约翰·罗尔斯的正义理论，他们于是都会选最大化最小值方案，即这样一种秩序——任何人在其中所能处的最差位置都尽可能好。罗尔斯为这一方案论证时，严重依赖如下假定：参与者对自己最终落在未来社会秩序中某个位置的概率毫无所知（Rawls 1957; 1971; 1974）[^rawls-1957]。约翰·海萨尼在罗尔斯之前讨论过这一问题，他的假定是：发现自己处于某一特定社会位置的概率，等于将拥有该位置的人口比例，而且这一点所有参与者都知道。于是，若某类社会中有五分之一人口将是客籍工人，海萨尼初始情境中的每个参与者都会假定自己有百分之二十的概率成为客籍工人；而在罗尔斯的初始情境里，没人对概率可能是多少有半点线索。海萨尼的参与者会选期望效用（概率加权效用）最高的社会秩序，把一切潜在未来位置都算进去，而不只看最不利的那一个（Harsanyi 1953; 1955; 1975）[^harsanyi-1953]。
