      Examples are easily found that exhibit the problematic nature of this division between the two disciplines. Compare the act of throwing down a brick on a person from a high building to the act of throwing down a brick from a high building without first making sure that there is nobody beneath who can be hit by the brick. The moral difference between these two acts is not obviously expressible in a probability calculus. An ethical analysis of the difference will have to refer to the moral aspects of risk impositions as compared to intentional ill-doing. More generally speaking, a reasonably complete account of the ethics of risk must distinguish between intentional and unintentional risk exposure and between voluntary risk-taking, risks imposed on a person who accepts them, and risks imposed on a person who does not accept them. This cannot be done in a framework that treats risks as probabilistic mixtures of outcomes. In principle, these outcomes can be so widely defined that they include all relevant moral aspects, including rights infringements as well as intentionality and other pertinent mental states. However, this would still not cover the moral implications of risk taking *per se*, since these are not inherent properties of any of the potential outcomes.
    step1: |-
      很容易找到例子，显示两门学科之间这一分工的问题性质。试比较从高楼上把一块砖扔向某人的行为，与从高楼上把一块砖扔下、事先却不确认下方无人会被砸中的行为。这两个行为之间的道德差异，显然无法在概率演算中表达。对差异的伦理分析，将不得不援引风险施加相较于故意为恶的道德方面。更一般地说，关于风险伦理的相当完整的说明，必须区分有意与无意的风险暴露，并区分自愿承担风险、施加于接受这些风险的人的风险、以及施加于不接受这些风险的人的风险。在把风险当作结果之概率混合的框架中，这一切都做不到。原则上，这些结果可以被定义得足够宽，从而包含一切相关的道德方面，包括权利侵害以及故意性与其他相关心理状态。然而，这仍然涵盖不了冒险 *本身* 的道德意涵，因为这些意涵并非任何潜在结果的内在属性。
    step2: |-
      例子很容易找，足以显示两门学科这种分工的问题所在。试比较两个行为：从高楼上把一块砖砸向某人；从高楼上把一块砖扔下去，却不先确认下面没人会被砸中。两者的道德差异，显然没法在概率演算里表达。要作伦理分析，就得援引风险施加相对于故意为恶的道德方面。更一般地说，一套相当完整的风险伦理说明，必须区分有意与无意的风险暴露，还要区分自愿冒险、施加于接受者的风险、施加于不接受者的风险。在把风险当作结果之概率混合的框架里，这些统统做不到。原则上，结果可以定义得足够宽，把一切相关道德方面都包进来——权利侵害、故意性以及其他相关心理状态。可即便如此，仍涵盖不了冒险 *本身* 的道德意涵，因为这些意涵并非任何潜在结果的内在属性。
