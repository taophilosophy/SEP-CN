      Safety factors are also used in regulatory toxicology and ecotoxicology. For instance, in food toxicology, the highest dose allowed for human exposure has traditionally been calculated as one hundredth of the highest dose (per kilogram body weight) that gave no observable negative effect in experimental animals. Today, higher safety factors than 100 have become common (Dourson and Stara 1983; Pressman et al. 2017)[^dourson-1983][^pressman-2017].
    step1: |-
      安全系数也用于管理毒理学与生态毒理学。例如在食品毒理学中，允许人接触的最高剂量，传统上是按在实验动物身上未引起可观察负面效应的最高剂量（每公斤体重）的百分之一来计算的。今天，高于 100 的安全系数已变得常见（Dourson and Stara 1983; Pressman et al. 2017）[^dourson-1983][^pressman-2017]。
    step2: |-
      安全系数也用于管理毒理学和生态毒理学。例如在食品毒理学中，人可接触的最高剂量，传统上取实验动物身上未引起可观察负面效应的最高剂量（按每公斤体重计）的百分之一。如今高于 100 的安全系数已很常见（Dourson and Stara 1983; Pressman et al. 2017）[^dourson-1983][^pressman-2017]。
