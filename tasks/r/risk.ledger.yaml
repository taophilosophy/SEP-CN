    source: |-
      Since the 1970s, studies of risk have grown into a major interdisciplinary field of research. Although relatively few philosophers have focused their work on risk, there are important connections between risk studies and several philosophical subdisciplines. This entry summarizes the most well-developed of these connections and introduces some of the major topics in the philosophy of risk. It consists of seven sections dealing with the definition of risk and with treatments of risk related to epistemology, the philosophy of science, the philosophy of technology, ethics, decision theory, and the philosophy of economics.
    step1: |-
      自 1970 年代以来，风险研究已成长为一个重要的跨学科研究领域。虽然相对说来很少有哲学家把工作重心放在风险上，但风险研究与若干哲学分支之间存在着重要关联。本词条概述这些关联中发展得最充分的部分，并介绍风险哲学的一些主要论题。它由七节组成，分别讨论风险的定义，以及与认识论、科学哲学、技术哲学、伦理学、决策理论和经济学哲学相关的风险研究。
    step2: |-
      自 1970 年代以来，风险研究已发展成一个重要的跨学科领域。以风险为工作重心的哲学家固然不多，但风险研究与好几个哲学分支之间有着重要关联。本词条概述其中发展最充分的那些关联，并介绍风险哲学的一些主要论题。全文共七节，依次讨论风险的定义，以及认识论、科学哲学、技术哲学、伦理学、决策理论、经济学哲学中的风险研究。
