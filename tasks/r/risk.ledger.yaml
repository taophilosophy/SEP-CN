    source: |-
      Studies in experimental economics reveal that actual agents often do not conform with theoretically derived rationality criteria. One of the most popular descriptive theories that tries to capture actual behaviour under risk is prospect theory, which was developed by Daniel Kahneman and Amos Tversky around 1980 (Kahneman & Tversky 1979; Tversky & Kahneman 1986)[^kahneman-1979][^tversky-1986]. It distinguishes between two stages in a decision process. In the first phase, the *editing* phase, gains and losses in the different options are identified. They are defined relative to some neutral reference point that is usually the current asset position. In the second phase, the *evaluation* phase, the options are evaluated in a way that resembles expected utility analysis, but both utilities and probabilities are replaced by other, similar measures. Utility is replaced by a measure that is asymmetrical between gains and losses. Objective probabilities are transformed by a function that gives more weight to probability differences close to the ends than to those near the centre of the distribution. Thus it makes a greater difference to decrease the probability of a negative outcome from 2 to 1 per cent than to decrease it from 51 to 50 percent.
    step1: |-
      实验经济学的研究表明，实际行为人往往不符合理论推导出的合理性标准。试图刻画风险下实际行为的最流行的描述性理论之一，是丹尼尔·卡尼曼与阿莫斯·特沃斯基于 1980 年前后发展的前景理论（Kahneman & Tversky 1979; Tversky & Kahneman 1986）[^kahneman-1979][^tversky-1986]。它区分决策过程的两个阶段。在第一阶段，即 *编辑* 阶段，辨认出不同选项中的收益与损失。它们相对于某个中性的参照点来定义，参照点通常是当前的资产状况。在第二阶段，即 *评价* 阶段，各选项以类似于期望效用分析的方式得到评价，但效用与概率都被替换为其他类似的度量。效用被替换为一种在收益与损失之间不对称的度量。客观概率则经由一个函数变换，该函数给接近分布两端的概率差以比接近中心的概率差更大的权重。因此，把某个负面结果的概率从 2% 降到 1%，与从 51% 降到 50% 相比，前者造成的差别更大。
    step2: |-
      实验经济学的研究表明，实际行为人往往不符合理论推导出的合理性标准。试图刻画风险下实际行为的最流行的描述性理论之一，是丹尼尔·卡尼曼与阿莫斯·特沃斯基于 1980 年前后提出的前景理论（Kahneman & Tversky 1979; Tversky & Kahneman 1986）[^kahneman-1979][^tversky-1986]。它把决策过程分作两个阶段：第一阶段是 *编辑*，辨认各选项中的收益与损失——它们相对于某个中性参照点（通常是当前资产状况）来定义；第二阶段是 *评价*，各选项按类似期望效用分析的方式评价，但效用与概率都换成了别的类似度量。效用换成一种在收益与损失之间不对称的度量；客观概率则经一个函数变换，该函数给分布两端附近的概率差以比中心附近更大的权重。于是，把某个负面结果的概率从 2% 降到 1%，比从 51% 降到 50% 造成的差别更大。
