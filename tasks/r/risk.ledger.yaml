      The major problem in the construction of safety barriers is how to make them as independent of each other as possible. If two or more barriers are sensitive to the same type of impact, then one and the same destructive force can get rid of all of them in one swoop. For instance, if three safety valves are installed in one and the same factory hall, each with the probability 1/1,000 of failure, it does not follow that the probability of all three failing is $1 \times 10^{-9}$. The three valves may all be destroyed in the same fire, or damaged by the same mistake in maintenance operations. This is a common situation for many types of equipment.
    step1: |-
      建造安全屏障的主要问题，是如何使它们尽可能彼此独立。如果两道或更多屏障对同一类冲击敏感，那么同一种破坏力量就能一举除掉它们全部。例如，同一间厂房里装三个安全阀，每个失效概率为 1/1,000，并不能由此推出三个全部失效的概率是 $1 \times 10^{-9}$。三个阀门可能在同一场火灾中全部毁掉，也可能因维护操作中的同一个失误而受损。这对许多类型的设备来说都是常见情形。
    step2: |-
      建造安全屏障的主要难题，是让各道屏障尽可能彼此独立。若两道或更多屏障对同一类冲击敏感，同一种破坏力就能一举把它们全部除掉。例如同一间厂房里装三个安全阀，每个的失效概率都是 1/1,000，却不能由此推出三个全失效的概率是 $1 \times 10^{-9}$：三个阀门可能在同一场火灾里一起毁掉，也可能因维护中的同一个失误一起受损。许多类型的设备都有这种情形。
