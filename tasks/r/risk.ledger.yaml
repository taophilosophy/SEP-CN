      The role of values in science has been particularly controversial in issues of risk. Risk assessments have frequently been criticized for containing “hidden” values that induce a too high acceptance of risk (Cranor 2016; 2017; Intemann 2016; Heinzerling 2000)[^cranor-2016][^heinzerling-2000]. There is also a discussion on the need to strengthen the impact of certain values in risk assessment, such as considerations of justice (Shrader-Frechette 2005a), human rights (Shrader-Frechette 2005b), and the rights and welfare of future people (Caney 2009; Ng 2005)[^caney-2009]. Issues of risk have also given rise to heated debates on what levels of scientific evidence are needed for policy decisions. The proof standards of science are apt to cause difficulties whenever science is applied to practical problems that require standards of proof or evidence different from those of science.
    step1: |-
      价值在科学中的作用，在风险问题上尤其引起争议。风险评估屡遭批评，说它含有“隐藏的”价值，导致对风险的接受度过高（Cranor 2016; 2017; Intemann 2016; Heinzerling 2000）[^cranor-2016][^heinzerling-2000]。此外还有一场讨论，关乎是否需要加强某些价值在风险评估中的影响，如正义方面的考量（Shrader-Frechette 2005a）、人权（Shrader-Frechette 2005b）以及未来人的权利与福利（Caney 2009; Ng 2005）[^caney-2009]。风险问题还引发了关于政策决策需要何种水平科学证据的激烈争论。科学自身的证明标准，一旦被应用于需要不同于科学之证明或证据标准的实际问题，就很容易造成困难。
    step2: |-
      价值在科学中的作用，在风险问题上格外有争议。风险评估屡屡被批评含有“隐藏的”价值，致使对风险的接受度过高（Cranor 2016; 2017; Intemann 2016; Heinzerling 2000）[^cranor-2016][^heinzerling-2000]。另有一场讨论：风险评估中是否应加强某些价值的分量，例如正义（Shrader-Frechette 2005a）、人权（Shrader-Frechette 2005b）、未来人的权利与福利（Caney 2009; Ng 2005）[^caney-2009]。风险问题还激起激烈争论：政策决策究竟需要何等水平的科学证据？科学自己的证明标准一旦用于实际问题——而实际问题需要的证明或证据标准与科学不同——就容易出岔子。
