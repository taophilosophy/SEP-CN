      ### 7.4 风险—收益分析
  - id: 101
    kind: body
    source: |-
      Risk-benefit analysis (RBA), also called cost-benefit analysis (CBA) is a collection of decision-aiding techniques that weigh advantages against disadvantages in numerical terms. In a typical risk-benefit analysis, multi-dimensional problems are reduced to a single dimension. This is achieved by assigning monetary values to all potential outcomes. Usually, uncertain outcomes are evaluated according to the expected utility model. This means that the disvalue of a risk is obtained by multiplying the probability of the undesired event by a monetary value representing its severity (Sen 2000; Sunstein 2005)[^sen-2000][^sunstein-2005].
    step1: |-
      风险—收益分析（RBA），亦称成本—收益分析（CBA），是一组以数值方式权衡利与弊的决策辅助技术。在典型的风险—收益分析中，多维问题被化约为单一维度。这是通过给一切潜在结果赋予货币价值来实现的。通常，不确定结果按期望效用模型来评价。这意味着，风险的反值由不想要事件的概率乘以代表其严重程度的货币价值得到（Sen 2000; Sunstein 2005）[^sen-2000][^sunstein-2005]。
    step2: |-
      风险—收益分析（RBA），亦称成本—收益分析（CBA），是一套以数值权衡利弊的决策辅助技术。典型的风险—收益分析把多维问题压缩到单一维度，办法是给一切潜在结果赋予货币价值。不确定结果通常按期望效用模型评价，也就是说，风险的反值等于不想要事件的概率乘以代表其严重程度的一个货币额（Sen 2000; Sunstein 2005）[^sen-2000][^sunstein-2005]。
  - id: 102
    kind: body
    source: |-
      In order to make overall alternatives comparable in simple numerical terms, all consequences, including losses of human lives, have to be assigned monetary values. The discussion about assigning monetary value to human lives seems to have had its origin in criticism by the American Air Force against a report from the RAND Corporation in 1950. The report recommended a military strategy that would result in mortality rates for crew members that the military considered to be unacceptably high. This was because loss of crew members was not included in the calculations. This omission had the same effect as setting the value of a soldier’s life at zero. In response to the criticism, the RAND Corporation began to include a life value in their analyses, but they had considerable difficulties in deriving this value (Banzhof 2014). Their employee Thomas Schelling proposed that life values should be derived from a marginal analysis of individuals’ own valuation of risks of death (Schelling 1968)[^schelling-1968]. If a person would accept a death risk of 1/10,000 against a compensation of $400, then that is taken to express a life value of 10,000 $\times$ $400 or $4,000,000.
    step1: |-
      为使总体方案在简单的数值意义上可比，一切后果，包括人的生命损失，都必须赋予货币价值。关于给人的生命赋予货币价值的讨论，似乎起源于 1950 年美国空军对兰德公司一份报告的批评。该报告推荐一种军事战略，其结果是机组人员的死亡率在军方看来高得不可接受。这是因为机组人员的损失未被纳入计算。这一遗漏的效果，等于把一名士兵生命的价值设为零。作为对批评的回应，兰德公司开始在其分析中纳入生命价值，但他们在推导这一价值时遇到相当大的困难（Banzhof 2014）。其雇员托马斯·谢林提议，生命价值应从个体自身对死亡风险的估值作边际分析得出（Schelling 1968）[^schelling-1968]。如果一个人愿意接受 1/10,000 的死亡风险以换取 $400 的补偿，那么这就被当作表达了 10,000 $\times$ $400 即 $4,000,000 的生命价值。
    step2: |-
      要让总体方案在简单的数值上可比，一切后果——包括人的生命损失——都得赋予货币价值。给生命定价的讨论，似乎始于 1950 年美国空军对兰德公司一份报告的批评。该报告推荐一种军事战略，其造成的机组死亡率在军方看来高得不可接受，原因是机组人员的损失未计入计算；这一遗漏相当于把士兵生命的价值设为零。回应批评时，兰德公司开始在分析中纳入生命价值，却在如何推导这一价值上大费周章（Banzhof 2014）。其雇员托马斯·谢林提议，生命价值应从个体自身对死亡风险的估值作边际分析得出（Schelling 1968）[^schelling-1968]：一个人若愿以 $400 的补偿换取 1/10,000 的死亡风险，这就被当作表达了 10,000 $\times$ $400 即 $4,000,000 的生命价值。
