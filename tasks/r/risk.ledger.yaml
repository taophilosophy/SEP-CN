      Many of the value assignments used in cost-benefit analysis are based on estimates or measurements of (hypothetical) willingness to pay. Such estimates will give more influence to affluent people since they can pay more than others to have it their way. This can be corrected with income-based adjustments of the reported willingness to pay. However, there are considerable problems involved in the performance and interpretation of willingness-to-pay studies (Grüne-Yanoff 2009)[^grüne-yanoff-2009].
    step1: |-
      成本—收益分析中使用的许多价值赋值，都基于对（假设的）支付意愿的估计或测量。这类估计会给富裕者更多影响，因为他们比别人能支付更多来让事情按自己的意愿办。这可以用基于收入的调整来校正所报告的支付意愿。然而，支付意愿研究的实施与解释都涉及相当大的问题（Grüne-Yanoff 2009）[^grüne-yanoff-2009]。
    step2: |-
      成本—收益分析里的许多价值赋值，都基于对（假设的）支付意愿的估计或测量。这类估计会偏向富裕者，因为他们比别人出得起钱让事情按自己的意愿办。这可以用按收入作的调整来校正所报告的支付意愿。但支付意愿研究在实施与解释上都有不小的问题（Grüne-Yanoff 2009）[^grüne-yanoff-2009]。
  - id: 105
    kind: body
    source: |-
      Risk-benefit analysis gives rise to several other philosophical problems of considerable philosophical interest (Hansson 2007)[^hansson-2007]. Due to its quantitative nature, it tends to leave out problems that are difficult to quantify, such as risks of cultural impoverishment, social isolation, and increased tensions between social strata. Furthermore, due to its aggregative structure, risk-benefit analysis often leaves out social justice and other distributional aspects, although these are in fact accessible to quantitative treatment.
    step1: |-
      风险—收益分析还引出若干其他具有相当哲学意义的问题（Hansson 2007）[^hansson-2007]。由于其定量性质，它倾向于遗漏难以量化的问题，如文化贫乏、社会孤立以及社会阶层之间紧张加剧的风险。此外，由于其聚合结构，风险—收益分析常常遗漏社会正义及其他分配方面，尽管这些方面实际上是可以作定量处理的。
    step2: |-
      风险—收益分析还带出若干颇有哲学意味的问题（Hansson 2007）[^hansson-2007]。它天生偏于定量，于是容易漏掉难以量化的问题，比如文化贫乏、社会孤立、社会阶层间紧张加剧的风险。又因其聚合式结构，它常常漏掉社会正义以及其他分配方面——而这些其实并非不能作定量处理。
