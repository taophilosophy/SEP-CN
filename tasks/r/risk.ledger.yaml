      However, influential proposals have been made for alternative decision rules. There are two major types of justification for such endeavours. First, examples have been put forward in which it would seem implausible to claim that expected utility maximization is the only normatively reasonable decision rule (Allais 1953; Ellsberg 1961)[^allais-1953][^ellsberg-1961]. Secondly, numerous psychological experiments have shown that human decision-makers tend to deviate substantially from expected utility maximization. The first type of justification puts the normative soundness of expected utility in question, where the second exposes its shortcomings as a descriptive model.
    step1: |-
      然而，人们也提出过一些有影响力的替代决策规则方案。这类努力有两大类型的辩护。第一，人们举出了一些例子，在其中主张期望效用最大化是唯一在规范上合理的决策规则似乎不可信（Allais 1953; Ellsberg 1961）[^allais-1953][^ellsberg-1961]。第二，大量心理学实验表明，人类决策者往往严重偏离期望效用最大化。第一类辩护质疑期望效用的规范健全性，第二类则暴露其作为描述模型的缺陷。
    step2: |-
      不过，也有人提出过颇有影响的替代决策规则。为此辩护的理由有两大类。其一，人们举出一些例子，在其中硬说期望效用最大化是唯一在规范上合理的决策规则，似乎难以服人（Allais 1953; Ellsberg 1961）[^allais-1953][^ellsberg-1961]。其二，大量心理学实验表明，人类决策者往往严重偏离期望效用最大化。前者质疑期望效用的规范健全性，后者则暴露它作为描述模型的短处。
