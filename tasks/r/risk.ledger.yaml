      A decision to accept or reject a scientific statement (for instance an hypothesis) is in practice always subject to the possibility of error. The chance of such an error is often called the inductive risk (Hempel 1965, 92)[^hempel-1965]. There are two major types of errors. The first of these consists in concluding that there is a phenomenon or an effect when in fact there is none. This is called an error of type I (false positive). The second consists in missing an existing phenomenon or effect. This is called an error of type II (false negative). In the internal dealings of science, errors of type I are in general regarded as more problematic than those of type II. The common scientific standards of statistical significance substantially reduce the risk of type I errors but do not protect against type II errors (Shrader-Frechette 2008; John 2017)[^john-2017].
    step1: |-
      接受或拒绝某个科学陈述（例如某个假说）的决定，在实践中总是面临出错的可能。这种错误的机会常被称为归纳风险（Hempel 1965, 92）[^hempel-1965]。错误有两大类型。第一类是断定存在某个现象或效应，而实际上并无。这称为第一类错误（假阳性）。第二类是漏掉一个存在的现象或效应。这称为第二类错误（假阴性）。在科学的内部运作中，第一类错误一般被视为比第二类错误更有问题。通行的统计显著性科学标准大幅降低第一类错误的风险，却不能防住第二类错误（Shrader-Frechette 2008; John 2017）[^john-2017]。
    step2: |-
      在实践中，接受或拒绝某个科学陈述（例如某个假说）的决定，总伴随着出错的可能。这种错误的机会常称作归纳风险（Hempel 1965, 92）[^hempel-1965]。错误分两大类型：一是断定存在某个现象或效应，而实际并无，称为第一类错误（假阳性）；二是漏掉一个确实存在的现象或效应，称为第二类错误（假阴性）。在科学内部，第一类错误一般被视为比第二类更成问题。通行的统计显著性标准大幅降低了第一类错误的风险，却防不住第二类错误（Shrader-Frechette 2008; John 2017）[^john-2017]。
