      Inherent safety, also called primary prevention, consists in the elimination of a hazard. It is contrasted with secondary prevention that consists in reducing the risk associated with a hazard. For a simple example, consider a process in which inflammable materials are used. Inherent safety would consist in replacing them by non-inflammable materials. Secondary prevention would consist in removing or isolating sources of ignition and/or installing fire-extinguishing equipment. As this example shows, secondary prevention usually involves added-on safety equipment. The major reason to prefer inherent safety to secondary prevention is that as long as the hazard still exists, it can be realized by some unanticipated triggering event. Even with the best of control measures, if inflammable materials are present, some unforeseen chain of events can start a fire.
    step1: |-
      固有安全又称一级预防，在于消除危险源。它与二级预防相对，后者在于降低与危险源相关联的风险。举个简单的例子，设想一个使用易燃材料的工艺过程。固有安全在于用不可燃材料替代这些易燃材料。二级预防则在于移除或隔离点火源，以及（或）安装灭火设备。如这个例子所示，二级预防通常涉及附加的安全设备。优先选择固有安全而非二级预防的主要理由是：只要危险源仍然存在，它就可能被某种未预见到的触发事件实现。即便有最好的控制措施，只要易燃材料存在，某种未预见的事件链条就可能引发火灾。
    step2: |-
      固有安全又称一级预防，要点是消除危险源；与之相对的二级预防，则是降低危险源所带来的风险。举个简单的例子：某工艺过程使用易燃材料，固有安全就是用不可燃材料把它们替换掉，二级预防则是移除或隔离点火源、以及（或）加装灭火设备。由此可见，二级预防通常要靠附加的安全设备。之所以优先选固有安全而非二级预防，主要理由是：只要危险源还在，它就可能被某个未曾预料的触发事件现实化。控制措施再好，只要易燃材料还在，某条未预见的因果链就可能点起火来。
  - id: 43
    kind: body
    source: |-
      Safety factors are numerical factors employed in the design process for our houses, bridges, vehicles, tools, etc., in order to ensure that our constructions are stronger than the bare minimum expected to be required for their functions. Elaborate systems of safety factors have been specified in norms and standards. A safety factor most commonly refers to the ratio between a measure of the maximal load not leading to a specified type of failure and a corresponding measure of the maximal expected load. It is common to make bridges and other constructions strong enough to withstand twice or three times the predicted maximal load. This means that a safety factor of two or three is employed.
    step1: |-
      安全系数是设计与建造我们的房屋、桥梁、车辆、工具等时所采用的数值因子，用以确保我们的构造物比其功能所要求的最低限度更为坚固。规范与标准中已详细规定了成套的安全系数体系。安全系数最常见的含义，是不导致特定类型失效的最大载荷之度量，与相应的最大预期载荷之度量之间的比率。通常把桥梁及其他构造物造得足够坚固，能承受预测最大载荷的两倍或三倍。这意味着采用了二或三的安全系数。
    step2: |-
      设计房屋、桥梁、车辆、工具时所用的数值因子叫安全系数，目的是让构造物比其功能所要求的最低限度更结实。规范与标准里已订有整套安全系数体系。最常见的含义是：不致发生某类特定失效的最大载荷，与相应的最大预期载荷之比。桥梁等构造物通常要造得能承受预测最大载荷的两三倍，也就是采用二或三的安全系数。
