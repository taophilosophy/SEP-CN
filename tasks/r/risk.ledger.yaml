      Decision theory has traditionally had a predilection for consequentialism, whose structure is suitable for most formal models of decision-making. The standard decision-theoretical approach to risk is maximization of expected utility, which can be seen as a smooth extension of (act) utilitarianism. In expected utility theory, the value associated with an uncertain situation is equal to the sum of the probability-weighted values of all its possible outcomes. Let $p$ be a function that assigns probabilities to outcomes, and $u$ a function that assigns values to them. Then the value associated with a situation with three possible outcomes $x_1$, $x_2$ and $x_3$, is equal to

      $$p(x_1) \cdot u(x_1) + p(x_2) \cdot u(x_2)+ p(x_3) \cdot u(x_3).$$
    step1: |-
      决策理论传统上偏好后果主义，其结构适合大多数决策的形式模型。风险的标准决策论进路是期望效用最大化，它可以被视为（行为）功利主义的一种平滑扩展。在期望效用理论中，与某个不确定情境相关联的价值，等于其一切可能结果之概率加权价值的总和。设 $p$ 为给结果赋予概率的函数，$u$ 为给结果赋予价值的函数。那么与具有三个可能结果 $x_1$、$x_2$ 与 $x_3$ 的情境相关联的价值，等于

      $$p(x_1) \cdot u(x_1) + p(x_2) \cdot u(x_2)+ p(x_3) \cdot u(x_3).$$
    step2: |-
      决策理论历来偏爱后果主义，因为其结构适合多数决策的形式模型。风险的标准决策论进路是期望效用最大化，可以看作（行为）功利主义的一种平滑扩展。在期望效用理论中，一个不确定情境的价值，等于其一切可能结果之概率加权价值的总和。设 $p$ 是给结果赋概率的函数，$u$ 是给结果赋价值的函数，那么具有三个可能结果 $x_1$、$x_2$、$x_3$ 的情境，其价值等于

      $$p(x_1) \cdot u(x_1) + p(x_2) \cdot u(x_2)+ p(x_3) \cdot u(x_3).$$
