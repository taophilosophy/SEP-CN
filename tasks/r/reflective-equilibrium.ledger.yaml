      The mainstream view, by contrast, suggests that only *considered judgments* should be used in reflective equilibrium. These are “those judgments in which our moral capacities are most likely to be displayed without distortion” (Rawls 1971: 47)[^rawls-1971]. We should (1) be capable of reaching the right decision (e.g., be reasonably well informed), (2) be in circumstances where we can do so (e.g., not be scared or upset), and (3) be motivated to do so (e.g., not stand to gain or lose from the results of our deliberations). In short, we should have the ability, opportunity, and desire to make the right decision (Rawls 1971: 48)[^rawls-1971]. In moral and political philosophy, the judgments used in reflective equilibrium are usually these Rawlsian considered judgments.
    step1: |-
        相比之下，主流观点主张，反思平衡中只应使用 *经过考虑的判断*。这些是“我们的道德能力最可能不受扭曲地显现出来的那些判断”（Rawls 1971: 47）[^rawls-1971]。我们应当 (1) 有能力作出正确决定（例如，得到合理充分的信息），(2) 处于能够如此的情形（例如，不恐惧、不心烦），并且 (3) 有如此去做的动机（例如，不会因慎思的结果而得益或受损）。简言之，我们应当具备作出正确决定的能力、机会与意愿（Rawls 1971: 48）[^rawls-1971]。在道德与政治哲学中，反思平衡所使用的判断通常就是这些罗尔斯式的经过考虑的判断。
      step1: |-
        相比之下，主流观点主张，反思平衡中只应使用 *经过考虑的判断*。这些是“我们的道德能力最可能不受扭曲地显现出来的那些判断”（Rawls 1971: 47）[^rawls-1971]。我们应当 (1) 有能力作出正确决定（例如，得到合理充分的信息），(2) 处于能够如此的情形（例如，不恐惧、不心烦），并且 (3) 有如此去做的动机（例如，不会因慎思的结果而得益或受损）。简言之，我们应当具备作出正确决定的能力、机会与意愿（Rawls 1971: 48）[^rawls-1971]。在道德与政治哲学中，反思平衡所使用的判断通常就是这些罗尔斯式的经过考虑的判断。
    step2: |-
      主流观点则主张，反思平衡只应采用 **深思熟虑的判断**，即“我们的道德能力最可能不受扭曲地显现于其中的那些判断”（Rawls 1971: 47）[^rawls-1971]。为达此境，我们须：(1) 有能力正确决断（例如掌握合理充分的信息）；(2) 处于能够如此作的情境（例如不惊恐、不烦乱）；(3) 有如此作的动机（例如不会因慎思的结果而有所得或有所失）。简言之，须兼具正确决断的能力、机会与意愿（Rawls 1971: 48）[^rawls-1971]。在道德与政治哲学中，反思平衡所用的判断通常就是这类罗尔斯式的深思熟虑判断。
  - id: 17
