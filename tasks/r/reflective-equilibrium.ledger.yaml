      Narrow reflective equilibrium, described but not endorsed by Rawls and Daniels, matches principles to initial judgments, with only minor changes allowed (Rawls 1971: 49; Rawls 1974: 8; Daniels 1996: 22, 49)[^daniels-1996][^rawls-1971][^rawls-1974]. A more moderate position is that “initially tenable commitments have a presumption in their favor” (Elgin 1996: 107)[^elgin-1996]. On this view, “independently motivated, initially tenable commitments must underwrite coherence,” for however coherent the components of reflective equilibrium may be, “their mutual support may derive from a judicious disregard for contravening considerations” (Elgin 1996: 107; see also Baumberger & Brun 2021)[^baumberger-2021][^elgin-1996]. Initial judgments anchor reflective equilibrium to something outside itself. A similar suggestion is that inchoate initial judgments are “a central constraint” (Schroeter 2004: 122)[^schroeter-2004].
    step1: |-
      狭义反思平衡——罗尔斯与丹尼尔斯有所描述但并不赞同——使原则与初始判断相配，只允许作微小改动（Rawls 1971: 49; Rawls 1974: 8; Daniels 1996: 22, 49）[^daniels-1996][^rawls-1971][^rawls-1974]。一个更温和的立场是：“起初站得住的承诺具有有利于自身的推定”（Elgin 1996: 107）[^elgin-1996]。按此看法，“独立地得到推动力、起初站得住的承诺必须为融贯提供担保”，因为无论反思平衡的各组成部分多么融贯，“它们的相互支持也可能来自对相反考量的明智漠视”（Elgin 1996: 107; 亦见 Baumberger & Brun 2021）[^baumberger-2021][^elgin-1996]。初始判断把反思平衡锚定在自身之外的某种东西上。一个类似的提法是，初始的模糊判断是“一个核心约束”（Schroeter 2004: 122）[^schroeter-2004]。
    step2: |-
      狭义反思平衡——罗尔斯与丹尼尔斯虽加描述却不予采纳——让原则去迁就初始判断，只容许作细枝末节的改动（Rawls 1971: 49; Rawls 1974: 8; Daniels 1996: 22, 49）[^daniels-1996][^rawls-1971][^rawls-1974]。较为温和的立场则称：“起初站得住的承诺自带一种有利的推定”（Elgin 1996: 107）[^elgin-1996]。依此说，“独立地得到支撑、起初站得住的承诺必须为融贯性奠基”；因为反思平衡各要素纵然彼此融贯，“其相互支持也可能源自对反证考量的明智漠视”（Elgin 1996: 107; 亦见 Baumberger & Brun 2021）[^baumberger-2021][^elgin-1996]。初始判断使反思平衡得以锚定于自身之外的某种东西。与此相近的一种提法是：混沌未凿的初始判断乃是“一项核心约束”（Schroeter 2004: 122）[^schroeter-2004]。
