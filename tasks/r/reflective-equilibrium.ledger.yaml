      The prevalence of the coherentist interpretation is, in part, based on the obvious contrast with this traditional foundationalism. Wide reflective equilibrium is, furthermore, an exemplar of the broadly coherentist idea that beliefs can be justified by their coherence with a system of beliefs (Rawls 1974: 8; Daniels 1996: 60–61; Tersman 2008: 398–400)[^daniels-1996][^rawls-1974][^tersman-2008]. The deliberator is not expected to consider a principle in isolation, but rather to consider its connections with other principles as well as a wide range of moral and non-moral background theories. A principle can be justified by its fit with a comprehensive system of thought exhibiting logical, probabilistic, and explanatory relations among its members (Brink 1989: 103)[^brink-1989]. For example, and as we have seen, Rawls’ theory of justice justifies its principles of justice by appeal to theories of the person and of morality, among other background theories. Coherentists claim that moral beliefs alone are not enough for reflective equilibrium; they rely on theory-grounded second-order beliefs about the reliability of first order beliefs (Brink 1989: 127; Tersman 2008: 399)[^brink-1989][^tersman-2008].
    step1: |-
        融贯论解读的流行，部分基于它同这一传统基础主义的明显对照。此外，广义反思平衡还是如下这一宽泛融贯论观念的范例：信念可以通过与一个信念系统的融贯而得到证成（Rawls 1974: 8; Daniels 1996: 60–61; Tersman 2008: 398–400）[^daniels-1996][^rawls-1974][^tersman-2008]。并不指望慎思者孤立地考虑一个原则，而是考虑它与其他原则、以及与广泛的道德与非道德背景理论之间的联系。一个原则可以通过与一个思想体系的契合而得到证成——该体系在其成员之间展现出逻辑的、概率的与解释的关系（Brink 1989: 103）[^brink-1989]。例如，如我们所见，罗尔斯的正义理论通过诉诸关于人与道德的理论等背景理论来证成其正义原则。融贯论者主张，单有道德信念不足以达成反思平衡；他们还倚赖有理论根据的、关于一阶信念可靠性的二阶信念（Brink 1989: 127; Tersman 2008: 399）[^brink-1989][^tersman-2008]。
