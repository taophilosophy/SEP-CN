      This may motivate a final form of public reflective equilibrium, which uses the public’s judgments but not their theories, and in particular their case-specific judgments (Baderin 2017; see also Miller 1999)[^baderin-2017][^miller-1999]. The merit of using the public’s judgments is that they are *independent of principles*, which might be considered an essential requirement if a meaningful balance is to be struck between judgments and principles, but one which can hardly be met by philosophers’ judgments (Baderin 2017: 15–19)[^baderin-2017]. The point is similar to Elgin’s reason for giving priority to initial judgments—principles can enslave as well as enlighten. The philosopher remains the one undergoing reflective equilibrium, and is free to reject the public’s judgments, but a persistent refusal to adapt theory to public judgment suggests a refusal to earnestly engage in reflective equilibrium (Baderin 2017: 19–20)[^baderin-2017]. Among challenges for such a view are the lack of *mutual* adjustment of judgments and principles where judgments are the public’s rather than the individual’s.
    step1: |-
      这可能促使人提出公共反思平衡的最后一种形态：它使用公众的判断而不使用他们的理论，尤其是他们对具体情形的判断（Baderin 2017; 亦见 Miller 1999）[^baderin-2017][^miller-1999]。使用公众判断的优点在于，它们是 *独立于原则的*；若要在判断与原则之间达成有意义的平衡，这或许被视为一项本质要求，而哲学家的判断却几乎无法满足它（Baderin 2017: 15–19）[^baderin-2017]。这一点与埃尔金给初始判断以优先性的理由相似——原则既能启明，也能奴役。哲学家仍是经历反思平衡的那个人，尽可拒斥公众的判断；但若一味拒绝使理论适应公众判断，便显出不愿认真参与反思平衡（Baderin 2017: 19–20）[^baderin-2017]。此种观点面临的挑战之一，是当判断属于公众而非个人时，判断与原则之间缺乏 *相互的* 调整。
    step2: |-
      于是或可引出公共反思平衡的末一种形态：取用公众的判断而不取其理论，尤其取用他们对具体个案的判断（Baderin 2017; 亦见 Miller 1999）[^baderin-2017][^miller-1999]。取用公众判断之可取处，在于此类判断 **独立于原则**；倘若要在判断与原则之间求得有意义的平衡，这或可视为一项必要之举，而哲学家的判断却难以副此（Baderin 2017: 15–19）[^baderin-2017]。此理与埃尔金予初始判断以优先性的理由相仿——原则既能启迪人，也能奴役人。经历反思平衡的仍是哲学家本人，他尽可拒斥公众的判断；但若一味拒绝使理论迁就公众判断，便见其无意认真从事反思平衡（Baderin 2017: 19–20）[^baderin-2017]。此类主张所遇的难题之一，在于判断若取自公众而非个人，则判断与原则之间便乏 **相互的** 调整。
