      If you believe that conduct in some case is right or wrong, you have a moral judgment or intuition. Perhaps you have many such judgments about different cases. You might, nevertheless, consider that judgments alone do not *justify* the moral views they express. You and your moral interlocutors might be concerned that “what we actually accept is fraught with idiosyncrasy and vulnerable to vagaries of history and personality” (Elgin 1996: 108)[^elgin-1996] or displays “irregularities and distortions” (Rawls 1971: 48)[^rawls-1971].
    step1: |-
        如果你认为某情形下的行为是对的或错的，你就有了一个道德判断或直觉。也许你对不同情形有许多这样的判断。不过，你也许认为，判断本身并不 *证成* 它们所表达的道德观点。你与你的道德对话者可能担心，“我们实际接受的东西充满个人癖性，易受历史与人格之无常变故的摆布”（Elgin 1996: 108）[^elgin-1996]，或者显示出“不规则与扭曲”（Rawls 1971: 48）[^rawls-1971]。
