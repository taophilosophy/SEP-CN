      The mainstream reflective equilibrium of the early Rawls and Daniels is *individualist.* It is a method for a philosopher to work out her views (Rawls 1971; Daniels 1996)[^daniels-1996][^rawls-1971]. Further, they claim it is a method that makes those views reasonable or justified. Yet it might be claimed that a single philosopher’s views on a topic of public interest, such as Rawls’ and Daniels’ main substantive topic of social justice, cannot really be justified in that way. That individual may have justified their view to themselves, but they have not justified it to other people, who have different considered judgments and find different principles and theories appealing.
    step1: |-
      早期罗尔斯与丹尼尔斯的主流反思平衡是 *个人主义的*。它是哲学家借以厘清自己观点的方法（Rawls 1971; Daniels 1996）[^daniels-1996][^rawls-1971]。他们还主张，这是一种使那些观点显得合理或得到证成的方法。然而有人可能主张，单个哲学家对一个公共关切议题的观点——例如罗尔斯与丹尼尔斯的主要实质议题社会正义——并不能真以这种方式得到证成。那个人也许向自己证成了自己的观点，但没有向他人证成；他人拥有不同的经过考虑判断，觉得不同的原则与理论有吸引力。
    step2: |-
      早期罗尔斯与丹尼尔斯的主流反思平衡是 **个人主义的**：它是哲学家借以厘清一己之见的方法（Rawls 1971; Daniels 1996）[^daniels-1996][^rawls-1971]，并且他们还说，此法能使那些观点成为合理的、得到证成的。然而或可诘难：单个哲学家对某一公共关切议题（如罗尔斯与丹尼尔斯的主要实质议题社会正义）的看法，其实无从以这种方式获证成。那个人也许已向自己证成了自己的看法，却未向他人证成；他人持有不同的深思熟虑判断，觉得另一些原则与理论更为可取。
