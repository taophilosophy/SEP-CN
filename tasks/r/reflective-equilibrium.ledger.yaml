      This criticism of reflective equilibrium may be misplaced. Williams appears to “conflate Rawls’s contractualism with his coherentist justification” (Clarke 1987: 243)[^clarke-1987]. It is Rawls’ original position, not his reflective equilibrium, which aims to provide principles for a well-ordered society. Reflective equilibrium has no commitment to contractualism or justificatory devices generally; these are useful, where they are, simply because they place conditions on practical reason that the individual deliberator finds appealing. This may, however, seem to put reflective equilibrium in Baier’s sights, and in danger of solipsism; this concern is addressed below in the discussion of public reflective equilibrium.
