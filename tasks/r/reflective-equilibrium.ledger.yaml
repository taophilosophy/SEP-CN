      What if we are content with the decisions leading to *both* equilibria? Two conflicting views being equally justified is not really suggestive of relativism, but rather supports a pluralistic position (Scanlon 2014: 79)[^scanlon-2014]. It seems no less objective to judge that two equilibria are equally justified than it is to judge that one is more justified than the other.
    step1: |-
      假如我们对导致 *两个* 平衡的那些决定都感到满意，又当如何？两种相互冲突的观点同等地得到证成，并不真正提示相对主义，反而支持一种多元主义立场（Scanlon 2014: 79）[^scanlon-2014]。判定两个平衡同等得到证成，似乎并不比判定其中一个比另一个更得到证成更不客观。
    step2: |-
      倘若我们对导致 **两个** 平衡的那些决断都感到满意，又当如何？两种相互冲突的看法同等地得到证成，其实并不暗示相对主义，反倒支持一种多元主义的立场（Scanlon 2014: 79）[^scanlon-2014]。判定两个平衡同等获得证成，似乎并不比判定其一较另一更获证成少些客观性。
