      An opposing view gives initial judgments no priority over subsequent judgments. Moral beliefs may be formed that are not just different from but discontinuous with one’s initial beliefs, which may be rejected. One may, for instance, undergo a moral conversion, becoming convinced by the worldview of a Marx or Nietzsche (DePaul 1993: ch. 1)[^depaul-1993]. This “radical” version of reflective equilibrium allows the moral deliberator to comprehensively change their mind.
    step1: |-
      一种对立观点不给初始判断以任何优于后续判断的地位。可能形成这样的道德信念：它们不仅不同于、而且与某人最初的信念不连续，而后者可能被弃置。例如，一个人可能经历一场道德转变，被马克思或尼采的世界观说服（DePaul 1993: 第 1 章）[^depaul-1993]。反思平衡的这一“激进”版本允许道德慎思者彻底改变想法。
    step2: |-
      与此对立的一种观点则否认初始判断对后续判断有任何优先性。人可能形成某些道德信念，它们不但相异于、而且断裂于自己早先的信念，而那早先的信念尽可弃置。譬如有人经历一场道德上的改宗，为马克思或尼采的世界观所说服（DePaul 1993: 第 1 章）[^depaul-1993]。反思平衡的这一 **激进** 版本，允许道德慎思者彻底改变其想法。
