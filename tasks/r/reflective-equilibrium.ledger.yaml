      Fourth, as well as arguments, we should consider “devices of representation” (Rawls 2005: 23–28)[^rawls-2005] or “justificatory devices” (Daniels 1996: 59–60)[^daniels-1996]. It may be that we have greater confidence in certain conditions on the selection of principles than we antecedently have in any particular principles. Prominent examples of such justificatory devices are Rawls’ original position, other contemporary (Scanlon 1998)[^scanlon-1998] and historical (Locke 1689; Rousseau 1762)[^locke-1689][^rousseau-1762] contractualist devices, as well as their contractarian (Hobbes 1651; Gauthier 1986)[^gauthier-1986][^hobbes-1651] and ideal observer (Hume 1740, book 3; Smith 1759)[^hume-1740][^smith-1759] counterparts. Whether we find any such device useful is a matter of whether it fits our judgments in wide reflective equilibrium. If we do, we may have a powerful new argument for the principles that the device supports.
    step1: |-
      第四，除了论证，我们还应当考虑“表征装置”（Rawls 2005: 23–28）[^rawls-2005]或“证成装置”（Daniels 1996: 59–60）[^daniels-1996]。也许我们对原则选择上的某些条件的信心，胜过我们在预先对任何特定原则的信心。这类证成装置的著名例子有罗尔斯的原初状态、其他当代的（Scanlon 1998）[^scanlon-1998]与历史上的（Locke 1689; Rousseau 1762）[^locke-1689][^rousseau-1762]契约论装置，以及它们的契约主义（Hobbes 1651; Gauthier 1986）[^gauthier-1986][^hobbes-1651]与理想观察者（Hume 1740, 第 3 卷; Smith 1759）[^hume-1740][^smith-1759]对应物。我们是否觉得这类装置有用，取决于它在广义反思平衡中是否契合我们的判断。若契合，我们或许就获得了支持该装置所支撑之原则的一个有力的新论证。
