    step2: |-
      深思熟虑的判断纵已满足信心约束，其内容仍不受任何限制。一个人可能既有能力、又有机缘、也有意愿正确决断，却仍旧断送于大谬不然之决，且对此深信不疑（见 Sternberg [编] 2002）。这就可能引出一种 **认知约束**。温和版只排除逻辑上不自洽、或建立在经验错误之上的判断；更有抱负的版本则排除一切未获证成、无保证的信念（Kelly & McGrath 2010）[^kelly-2010]。例如，杰拉尔德·高斯（Gerald Gaus）便评论道：“明显未获证成的信念，倘若算什么，也只能是认知上的负债”；他还称引蒯因与厄利安（Quine and Ullian）之说以为佐证：“只要我们是理性的，一旦徒劳地寻求证据而不得，我们就会放弃那个信念”（Gaus 1996: 86; Quine & Ullian 1970: 16）[^gaus-1996][^quine-1970]。
