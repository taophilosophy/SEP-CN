      This line of objection is largely anticipated by Rawls, who acknowledges that there may be no unique equilibrium even for one person, and that the judgments we start with, or the “course of reflection itself,” may affect the principles we settle on (Rawls 1971: 50)[^rawls-1971]. He simply sets such questions aside, saying that reflective equilibrium “is, if you wish, a kind of psychology and does not presuppose the existence of objective moral truths” (Rawls 1974: 9)[^rawls-1974]. For reasons parallel to those in the interpersonal case, it may also be that the truth of moral realism, and the existence of objective moral facts, are compatible with drifting equilibria (Knight 2006: 220)[^knight-2006]. Advocates of reflective equilibrium do not claim that it gives direct access to or perfectly tracks moral truth, only that it can justify moral beliefs. Even where the ultimate facts are static, a belief can become more justified by becoming endorsed by the deliberators’ judgments and cohering with their reflectively-derived system of beliefs.
    step1: |-
        这一路反对意见大体上已被罗尔斯预见到，他承认即便对一个人而言也可能不存在唯一的平衡，而且我们据以出发的判断、或“反思过程本身”，都可能影响我们最终确定的原则（Rawls 1971: 50）[^rawls-1971]。他干脆把此类问题搁置一旁，说反思平衡“如果你愿意，可以说是一种心理学，并不预设客观道德真理的存在”（Rawls 1974: 9）[^rawls-1974]。出于与人际情形相平行的理由，道德实在论的真、以及客观道德事实的存在，也可能与漂移的平衡相容（Knight 2006: 220）[^knight-2006]。反思平衡的倡导者并不声称它直接通达或完美追踪道德真理，只声称它能证成道德信念。即便终极事实静止不变，一个信念也可以因得到慎思者判断的认可、并与他们由反思得出的信念系统相融贯而变得更获证成。
      step1: |-
        这一路反对意见大体上已被罗尔斯预见到，他承认即便对一个人而言也可能不存在唯一的平衡，而且我们据以出发的判断、或“反思过程本身”，都可能影响我们最终确定的原则（Rawls 1971: 50）[^rawls-1971]。他干脆把此类问题搁置一旁，说反思平衡“如果你愿意，可以说是一种心理学，并不预设客观道德真理的存在”（Rawls 1974: 9）[^rawls-1974]。出于与人际情形相平行的理由，道德实在论的真、以及客观道德事实的存在，也可能与漂移的平衡相容（Knight 2006: 220）[^knight-2006]。反思平衡的倡导者并不声称它直接通达或完美追踪道德真理，只声称它能证成道德信念。即便终极事实静止不变，一个信念也可以因得到慎思者判断的认可、并与他们由反思得出的信念系统相融贯而变得更获证成。
    step2: |-
      这一路诘难，罗尔斯大体早有预见：他承认即便对单独一人也未必有唯一平衡，且我们起初所持的判断、或“反思进程本身”，都可能左右最终所定的原则（Rawls 1971: 50）[^rawls-1971]。他只是把这类问题搁置一旁，谓反思平衡“若你愿意，可算一种心理学，并不预设客观道德真理之存在”（Rawls 1974: 9）[^rawls-1974]。与人际一例同理，道德实在论之为真、客观道德事实之存在，亦不妨与漂移的平衡相容（Knight 2006: 220）[^knight-2006]。反思平衡的倡导者从不声称它径直通达道德真理、或与之分毫不差地相应，只声称它能证成道德信念。纵令终极事实凝然不动，一个信念仍可因获慎思者判断之认可、且与其由反思所得的信念系统相融贯，而益增其证成。
