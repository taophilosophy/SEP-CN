      By this point the critic may be exasperated. If you identify a problem with someone’s way of doing philosophy, and they agree that it’s a problem, you might expect them to change how they do it. But the adherent of wide reflective equilibrium accepts the criticism but maintains their method, saying that they have adopted the criticism within the method. To critics this suggests that the method is “close to vacuous” (Singer 2005: 349)[^singer-2005], absorbing methodological controversies rather than adjudicating them (McPherson 2015: 661; Paulo 2020: 346; de Maagt 2017: 458)[^maagt-2017][^mcpherson-2015][^paulo-2020]. It just takes us
    step1: |-
      说到这里，批评者可能已经忍无可忍。如果你指出某人做哲学的方式有问题，而他们也同意那是个问题，你也许会期待他们改变做法。但广义反思平衡的信奉者接受批评却坚持其方法，声称他们已在方法内部采纳了该批评。在批评者看来，这说明该方法“近乎空洞”（Singer 2005: 349）[^singer-2005]，是吸收方法论争议而非裁断它们（McPherson 2015: 661; Paulo 2020: 346; de Maagt 2017: 458）[^maagt-2017][^mcpherson-2015][^paulo-2020]。它只是把我们
    step2: |-
      至此，批评者或已按捺不住：你若指出某人做哲学的方式有毛病，而他也承认确有毛病，你便会指望他改弦更张。然而广义反思平衡的信徒接受了批评，却仍固守其法，声称已把批评纳入方法之中。在批评者看来，这正表明该方法“近于空洞”（Singer 2005: 349）[^singer-2005]——它只是把方法论上的争议吸纳进来，而不加裁断（McPherson 2015: 661; Paulo 2020: 346; de Maagt 2017: 458）[^maagt-2017][^mcpherson-2015][^paulo-2020]。它不过是把我们
