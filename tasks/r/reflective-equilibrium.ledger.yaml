      Curiously, the index of Rawls’ *Political Liberalism* provides a concise statement of a principle-less method: “Reflective equilibrium: defined as when judgments at all levels of generality are in line on due reflection” (Rawls 2005: 514)[^rawls-2005]. Rather than bringing principles and judgments into agreement, as per Rawls’ official position, this variant would only bring judgments into agreement with each other. This would still allow us to retain major justificatory elements of wide reflective equilibrium, arriving at a coherent set of considered judgments revised in light of a wide range of competing principles, arguments, and background theories. The only difference is that our judgments are not necessarily represented in principles. Deliberators are free to follow the classic mutual adjustment of principles and judgments should they wish, but the output that is measured is judgments alone, “at all levels of generality”: utilitarians’ one big judgment, anti-theorists’ countless smaller ones, and every position in between.
    step1: |-
