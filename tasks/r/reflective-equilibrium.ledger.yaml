  - id: 4
    kind: body
    source: |-
      This requires that we reflect on a wide range of principles, arguments, and theories. Equilibrium is reached where principles and judgments have been revised such that they agree with each other. In short, the method of reflective equilibrium is the mutual adjustment of principles and judgments in the light of relevant argument and theory.
    step1: |-
      这要求我们反思广泛的原则、论证与理论。当原则与判断经过修正而彼此一致时，平衡便达成了。简言之，反思平衡的方法，就是在相关论证与理论的观照下，对原则与判断作相互调整。
    step2: |-
      这要求我们通盘反思各类原则、论证与理论。平衡达成于原则与判断经修正而彼此相符之处。简言之，反思平衡的方法，便是在相关论证与理论的引导下，使原则与判断相互调适。
  - id: 5
    kind: body
    source: |-
      Reflective equilibrium is the dominant method in moral and political philosophy (McPherson 2015: 652; Anderson 2015; de Maagt 2017: 444)[^anderson-2015][^maagt-2017][^mcpherson-2015]. Its advocates suggest that “it is the only rational game in town for the moral theorist” or “the only defensible method” (DePaul 1993: 6; Scanlon 2003: 149; see also Freeman 2007: 35–36; Floyd 2017: 377–378)[^depaul-1993][^floyd-2017][^freeman-2007][^scanlon-2003]. Though often endorsed, it is far more frequently used. Wherever a philosopher presents principles, motivated by arguments and examples, they are likely to be using the method. They are adjusting their principles—and with luck, their readers’—to the judgments suggested by the arguments and examples. Alternatively they might “bite the bullet” by adjusting initially discordant judgments to accommodate otherwise appealing principles. Either way, they are usually describing a process of reflective equilibrium, with principles adjusted to judgments or vice versa. Reflective equilibrium is a formal expression of standard methodological practice in moral and political philosophy. (See Rawls 1971, e.g., 19–21, for a famous application of reflective equilibrium, and Rechnitzer 2022 for a reconstruction of Thomson 2008 in terms of reflective equilibrium.)[^rawls-1971][^rechnitzer-2022][^thomson-2008]
    step1: |-
      反思平衡是道德与政治哲学中的主导方法（McPherson 2015: 652; Anderson 2015; de Maagt 2017: 444）[^anderson-2015][^maagt-2017][^mcpherson-2015]。其倡导者称，“对道德理论家而言，它是城里唯一理性的游戏”，或者说它是“唯一站得住的方法”（DePaul 1993: 6; Scanlon 2003: 149; 亦见 Freeman 2007: 35–36; Floyd 2017: 377–378）[^depaul-1993][^floyd-2017][^freeman-2007][^scanlon-2003]。尽管常被赞成，它被使用得更为频繁。凡哲学家提出原则、并以论证和例子为动机之处，他们很可能就在使用这一方法。他们在把原则——如果幸运，还有读者的原则——调整到论证与例子所提示的判断上去。另一种做法是“咬紧牙关”，把起初不协调的判断调整到本来有吸引力的原则上去。无论哪种方式，他们所描述的通常都是一个反思平衡的过程：原则被调整到判断，或反过来。反思平衡是道德与政治哲学中标准方法论实践的正式表达。（关于反思平衡的一个著名应用，见 Rawls 1971，例如 19–21；关于以反思平衡重构 Thomson 2008，见 Rechnitzer 2022。）[^rawls-1971][^rechnitzer-2022][^thomson-2008]
    step2: |-
      反思平衡是道德哲学与政治哲学中的主导方法（McPherson 2015: 652; Anderson 2015; de Maagt 2017: 444）[^anderson-2015][^maagt-2017][^mcpherson-2015]。其拥护者声称，对道德理论家来说，“这是现有唯一合乎理性的玩法”，或曰“这是唯一可辩护的方法”（DePaul 1993: 6; Scanlon 2003: 149; 亦见 Freeman 2007: 35–36; Floyd 2017: 377–378）[^depaul-1993][^floyd-2017][^freeman-2007][^scanlon-2003]。这一方法虽常获首肯，却更常被使用。举凡哲学家提出原则、并借论证与事例加以推动之处，他们多半就在运用此法：他们调整自己的原则——运气好时还有读者的原则——使之切合论证与事例所提示的判断。另一种做法是“咬紧牙关”，把起初不和谐的判断调整过来，以迁就本来颇具吸引力的原则。无论走哪条路径，所描述的通常都是一个反思平衡的过程：原则被调向判断，或判断被调向原则。反思平衡是道德与政治哲学中标准方法论实践的正式表达。（关于反思平衡的一个著名运用，见 Rawls 1971，如 19–21；以反思平衡重构 Thomson 2008 者，见 Rechnitzer 2022。）[^rawls-1971][^rechnitzer-2022][^thomson-2008]
