      Critics disagree, claiming that reflective equilibrium falls victim to *relativism.* The objection starts with the observation that different people following the method may reach different, conflicting equilibria (Dworkin 1973 [1975: 34–36]; de Maagt 2017: 450–451)[^maagt-2017][^dworkin-1973]. How can it be the case that each of two or more conflicting views are objectively justified? The justification rather looks to be relative to the deliberator.
    step1: |-
      批评者不同意，声称反思平衡沦为 *相对主义* 的牺牲品。这一反对意见从如下观察出发：遵循该方法的不同人可能达到不同而相互冲突的平衡（Dworkin 1973 [1975: 34–36]; de Maagt 2017: 450–451）[^maagt-2017][^dworkin-1973]。两个或更多相互冲突的观点怎么可能各自都得到客观证成？证成看起来毋宁是相对于慎思者的。
    step2: |-
      批评者不以为然，斥反思平衡已陷于 **相对主义**。此诘难始于一项观察：循法而行的不同人可能达到彼此相异、相互扞格的平衡（Dworkin 1973 [1975: 34–36]; de Maagt 2017: 450–451）[^maagt-2017][^dworkin-1973]。两个或更多相互冲突的看法，何以竟能各得其客观证成？此处的证成看来毋宁是相对于慎思者而言的。
