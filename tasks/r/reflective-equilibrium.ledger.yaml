      Though Michael DePaul states the radical position most clearly, contrasting it with a “conservative” reflective equilibrium that he takes as dominant (DePaul 1993: 31)[^depaul-1993], the radical view seems more in line with canonical reflective equilibrium, which encourages revision of judgment on theoretical grounds (see, e.g., Daniels 1996: 2–4, 26–28, 60–61, 70–71)[^daniels-1996]. While Rawls’ applications of reflective equilibrium assume that we have certain “convictions” (such as those opposing racial discrimination or religious intolerance), in explaining the method he is clear that “a person’s sense of justice may or may not undergo a radical shift” (Rawls 1971: 49)[^rawls-1971]—and on closer inspection we see that convictions are only “*provisional* fixed points” (Rawls 1971: 20; Rawls 2005: 8, emphasis added; see also Rawls 1974: 8)[^rawls-1971][^rawls-1974][^rawls-2005]. Even Elgin allows that “considerations with no initial tenability sometimes dislodge initially tenable commitments”; it’s just that the latter “are not to be given up without reason” (Elgin 1996: 108, 107)[^elgin-1996].
    step1: |-
      虽然迈克尔·德保罗最清楚地陈述了激进立场，并把它与他视为主导的“保守”反思平衡相对照（DePaul 1993: 31）[^depaul-1993]，但激进观点似乎更符合典范的反思平衡——后者鼓励基于理论理由修正判断（例如见 Daniels 1996: 2–4, 26–28, 60–61, 70–71）[^daniels-1996]。尽管罗尔斯对反思平衡的应用假定我们拥有某些“确信”（例如反对种族歧视或宗教不宽容的那些），但在解释该方法时他说得很清楚：“一个人的正义感可能会、也可能不会经历彻底转变”（Rawls 1971: 49）[^rawls-1971]——而细察之下我们会看到，确信只是“*暂时的* 固定点”（Rawls 1971: 20; Rawls 2005: 8, 强调为引者所加; 亦见 Rawls 1974: 8）[^rawls-1971][^rawls-1974][^rawls-2005]。即便埃尔金也承认，“毫无初始站得住性的考量有时会撬动起初站得住的承诺”；只是后者“不应无理由地被放弃”（Elgin 1996: 108, 107）[^elgin-1996]。
    step2: |-
      迈克尔·德保罗（Michael DePaul）把激进立场表述得最为清晰，并以之与他眼中居于主流的“保守”反思平衡相对举（DePaul 1993: 31）[^depaul-1993]；然而激进之说似乎更贴合典范的反思平衡，因为后者本就鼓励凭理论理由修正判断（例如见 Daniels 1996: 2–4, 26–28, 60–61, 70–71）[^daniels-1996]。罗尔斯在运用反思平衡时假定我们抱有某些“确信”（如反对种族歧视、反对宗教不宽容），但在阐释方法时他明确表示：“一个人的正义感或许会、也或许不会经历根本的转变”（Rawls 1971: 49）[^rawls-1971]；细究之下更可见，确信不过是“**暂时的** 固定点”（Rawls 1971: 20; Rawls 2005: 8, 强调为引者所加; 亦见 Rawls 1974: 8）[^rawls-1971][^rawls-1974][^rawls-2005]。就连埃尔金也承认，“毫无初始站得住性的考量，有时竟会撼动起初站得住的承诺”；只不过后者“不可无理由地放弃”（Elgin 1996: 108, 107）[^elgin-1996]。
