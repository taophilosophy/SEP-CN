      It might be added that critics of reflective equilibrium are rich sources of methods incompatible with reflective equilibrium. For instance, Brandt’s cognitive psychotherapy, Hare’s universal prescriptivism, Anderson’s pragmatism, or de Maagt’s transcendentalism describe methods for justifying moral views prior to, or without, reflective equilibrium (Brandt 1979; Hare 1981; Anderson 2015; de Maagt 2017)[^anderson-2015][^brandt-1979][^maagt-2017][^hare-1981]. Reflective equilibrium rules out
    step1: |-
      还可补充说，反思平衡的批评者正是与反思平衡不相容的方法的丰富来源。例如，布兰特的认识疗法、黑尔的普遍规定主义、安德森的实用主义、或德马格特的先验论，都描述了在反思平衡之前、或无需反思平衡而证成道德观点的方法（Brandt 1979; Hare 1981; Anderson 2015; de Maagt 2017）[^anderson-2015][^brandt-1979][^maagt-2017][^hare-1981]。反思平衡排除了
    step2: |-
