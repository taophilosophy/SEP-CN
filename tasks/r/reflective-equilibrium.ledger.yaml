      The further objection might then be raised that reflective equilibrium is vulnerable to arbitrary order or framing biases (McPherson 2015: 662–663; List & Valentini 2016: 542)[^list-2016][^mcpherson-2015]. One study found that professional philosophers were vulnerable to order and framing effects, and that this was not reduced by reflection or expertise on the topics in question (Schwitzgebel & Cushman 2015)[^schwitzgebel-2015]. The judgments of participants in reflective equilibrium might be considered unreliable in the sense that they vary with factors that they themselves consider irrelevant (Paulo 2020: 335–336)[^paulo-2020].
    step1: |-
      随后还可能提出进一步的反对意见：反思平衡易受任意的顺序或框架偏倚影响（McPherson 2015: 662–663; List & Valentini 2016: 542）[^list-2016][^mcpherson-2015]。一项研究发现，专业哲学家易受顺序效应与框架效应影响，且这种影响并未因反思或对所论议题的专门知识而减少（Schwitzgebel & Cushman 2015）[^schwitzgebel-2015]。反思平衡参与者的判断可能被视为不可靠，因为它们随参与者本人认为无关的因素而变化（Paulo 2020: 335–336）[^paulo-2020]。
    step2: |-
      继而或可提出更进一步的诘难：反思平衡易受任意的次序偏倚与框定偏倚之害（McPherson 2015: 662–663; List & Valentini 2016: 542）[^list-2016][^mcpherson-2015]。有研究显示，专业哲学家亦不免于次序效应与框定效应，且此弊并不因反思或对所论议题的专门素养而稍减（Schwitzgebel & Cushman 2015）[^schwitzgebel-2015]。反思平衡参与者的判断或可视为不可靠——因为它们随参与者自认为无关的因素而变（Paulo 2020: 335–336）[^paulo-2020]。
