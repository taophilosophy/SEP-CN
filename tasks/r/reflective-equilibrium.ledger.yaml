    step2: |-
      其二，初始判断是 **可修正的**。倘若你遇到一个原则，它似能契合你许多要紧的判断，甚或虽不契合却仍具吸引力，你便可自由改动与之抵牾的判断。有的原则也许还伸展到你从前未曾置判断的领域（例如生成式人工智能的道德面向），此时你尽可相机立下与之相合或相违的新判断。一切都可重新商定。（须注意，这第二项特征与前文所说的“不给初始判断任何优先性、或只给微弱推定优先性”并不冲突。）
