      Friends of reflective equilibrium largely reject such a constraint. The basic complaint is that it makes epistemological determinations in advance of the reflective process where these are rather the proper upshot of that process. Reflective equilibrium can be viewed as a negative method, i.e., as what we’re left with when we decide that positive criteria for epistemic success cannot be laid out prior to fully considering our substantive topics (Walden 2013: 255)[^walden-2013]. On this view, what counts as justification, warrant, or consistency should be decided with all relevant theory on the table as part of the process of reflective equilibrium and is not prescribed by the method itself.
    step1: |-
        反思平衡的友人们大体上拒斥这样一种约束。基本的不满在于：它在反思过程之前就作出认识论上的判定，而这些判定本应是那个过程的结果。反思平衡可以被看作一种否定性方法，即：当我们认定，关于认知成功的正面标准无法在充分考虑实质论题之前被列出时，我们所剩下的就是它（Walden 2013: 255）[^walden-2013]。按这种看法，什么算作证成、保证或一致性，应当在一切相关理论都摆上桌面之后、作为反思平衡过程的一部分来决定，而不由方法本身预先规定。
