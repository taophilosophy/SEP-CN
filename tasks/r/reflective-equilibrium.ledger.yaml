    step2: |-
      你若判定某一情形下的行为为对或为错，便拥有一个道德判断或直觉。这样的判断，你或许对许多不同情形都持有。然而你仍可能认为，单凭判断并不足以 **证成** 其所表达的道德观点。你与自己的道德对话者也许都会忧心：“我们实际所接受的东西充满了个人癖性，极易受历史与人格之无常的摆布”（Elgin 1996: 108）[^elgin-1996]，或者显出“种种不规则与扭曲”（Rawls 1971: 48）[^rawls-1971]。
