      He asks us to enquire as to the reasons for divergences between our equilibrium and that of another. Did we start with different considered judgments? Did the divergence arise due to later adjustments in considered judgments? Is it due to consideration of different moral principles? At each stage we are to ask whether we feel we made the better decisions or whether we might now revise our judgments and principles (Scanlon 2003: 152–153; Scanlon 2014: 79–81)[^scanlon-2003][^scanlon-2014].
    step1: |-
      他要求我们追问我们的平衡与另一人的平衡之间分歧的理由。我们是从不同的经过考虑判断出发的吗？分歧是由后来对经过考虑判断的调整引起的吗？是由于考虑了不同的道德原则吗？在每一阶段，我们都要问：我们是否觉得自己作了更好的决定，或者我们是否现在就要修正自己的判断与原则（Scanlon 2003: 152–153; Scanlon 2014: 79–81）[^scanlon-2003][^scanlon-2014]。
    step2: |-
      他教我们追问：自己的平衡与他人的平衡何以有歧。我们起初所持的深思熟虑判断是否不同？歧异是否起于后来对深思熟虑判断的调整？抑或起于所考量的道德原则有别？每一环节都须自问：我们是否觉得当初抉择较善，抑或此刻正该修正自己的判断与原则（Scanlon 2003: 152–153; Scanlon 2014: 79–81）[^scanlon-2003][^scanlon-2014]。
