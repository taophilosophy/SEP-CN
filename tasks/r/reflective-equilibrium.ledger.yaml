    source: |-
      Intuitions are frequently used interchangeably with considered judgments in the critical literature on reflective equilibrium. But intuitions as typically described have characteristics that are not generally true of considered judgments, especially non-inferentiality (Brun 2014; Greenspan 2015; Cath 2016: 228–229)[^brun-2014][^cath-2016][^greenspan-2015]. This entry will therefore focus on considered judgments rather than intuitions.
    step1: |-
      在关于反思平衡的批评文献中，直觉与经过考虑的判断常被交替使用。但按通常的描述，直觉具有一些并非普遍见于经过考虑的判断的特征，尤其是非推论性（Brun 2014; Greenspan 2015; Cath 2016: 228–229）[^brun-2014][^cath-2016][^greenspan-2015]。因此本文将聚焦于经过考虑的判断，而非直觉。
    step2: |-
      在批评反思平衡的文献里，直觉与深思熟虑的判断往往混用互替。然而按通常的刻画，直觉具有某些一般并不属于深思熟虑判断的特征，尤以非推论性为要（Brun 2014; Greenspan 2015; Cath 2016: 228–229）[^brun-2014][^cath-2016][^greenspan-2015]。有鉴于此，本文取深思熟虑的判断而舍直觉。
