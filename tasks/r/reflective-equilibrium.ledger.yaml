      Considered judgments, even those that satisfy the confidence constraint, are not limited as to their content. One might have the ability, opportunity, and desire to make the right decision, yet make a grossly mistaken decision, and be confident in it (see Sternberg [ed.] 2002). This may motivate an *epistemic constraint.* A modest version would exclude judgments that are logically inconsistent or founded on empirical error. A more ambitious constraint excludes any unjustified or unwarranted beliefs (Kelly & McGrath 2010)[^kelly-2010]. For example, Gerald Gaus comments that “clearly unjustified beliefs are, if anything, epistemic liabilities,” approvingly quoting Quine and Ullian’s suggestion that “insofar as we are rational, we will drop a belief when we have in vain tried to find evidence for it” (Gaus 1996: 86; Quine & Ullian 1970: 16)[^gaus-1996][^quine-1970].
    step1: |-
        经过考虑的判断，即便满足信心约束，在内容上也不受限制。一个人可能有能力、有机会、有意愿作出正确决定，却作出大错特错的决定，并且对此充满信心（见 Sternberg [编] 2002）。这或许促使人提出一种 *认知约束*。温和的版本会排除逻辑上不一致或基于经验错误的判断。更有雄心的约束则排除一切未获证成或无保证的信念（Kelly & McGrath 2010）[^kelly-2010]。例如，杰拉尔德·高斯评论说，“明显未获证成的信念，如果算什么的话，也是认知上的负债”，并赞同地引用蒯因与厄利安的建议：“就我们是理性的而言，当我们徒劳地寻找证据而不得时，我们就会放弃一个信念”（Gaus 1996: 86; Quine & Ullian 1970: 16）[^gaus-1996][^quine-1970]。
