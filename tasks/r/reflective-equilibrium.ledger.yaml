      First, we are not merely looking for principles that look like our initial judgments, giving our pre-theoretical opinions a philosophical sheen. Rather, *a wide range of principles* should be considered. Indeed, we should consider all principles to which our judgments might plausibly conform, though “it is doubtful whether one can ever reach this state” (Rawls 1971: 49)[^rawls-1971]. We will return to this contrast between the ideal and the practical.
    step1: |-
      第一，我们不只是寻找看起来像我们初始判断的原则，从而给我们的前理论意见涂上一层哲学光泽。相反，应当考虑 *广泛的原则*。我们实在应当考虑我们的判断有可能合理地与之相符的一切原则，尽管“人们是否能达到这种状态是可疑的”（Rawls 1971: 49）[^rawls-1971]。我们会回到理想与实践之间的这一对照。
    step2: |-
      其一，我们并非只求寻得看似吻合初始判断的原则，替自己的前理论意见镀一层哲学光泽；恰恰相反，须考量 **广泛的原则**。我们确应考虑一切原则——只要我们的判断有可能合理地与之相符——尽管“人能否企及这一境地，实在可疑”（Rawls 1971: 49）[^rawls-1971]。理想与实践之间的这一落差，后文还会论及。
