      > [p]eople have considered judgments at all levels of generality, from those about particular situations and institutions up through broad standards and first principles to formal and abstract conditions on moral conceptions. (Rawls 1974: 8)[^rawls-1974]
    step1: |-
      > 人们在各层次普遍性上都有经过考虑的判断，从关于特定情境与制度的判断，直到宽泛的标准与第一原则，乃至对道德构想的正式而抽象的条件。（Rawls 1974: 8）[^rawls-1974]
    step2: |-
      > 人们在一切普遍性层次上都持有深思熟虑的判断：既有关乎具体情境与制度者，亦有宽泛标准与第一原则，直至对道德构想所设的形式化、抽象的条件。（Rawls 1974: 8）[^rawls-1974]
