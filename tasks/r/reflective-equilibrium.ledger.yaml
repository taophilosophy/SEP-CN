      An alternative view suggests that, if, as Rawls supposes, we are trying to describe our moral capacity, it may appear self-defeating to exclude some of our moral judgments from consideration. Our lack of confidence in some judgments means they are likely to be rejected during the reflective process but gives no reason to dismiss them out of hand (Raz 1982: 318–319)[^raz-1982]. Such a move may increase rather than decrease the distortion of moral sensibilities that reflective equilibrium is supposed to address (Knight 2017: 47–48)[^knight-2017]. Consider someone with certain far right commitments, but not so far gone that they don’t recognize some appeal to such values as equality and liberty, though they have little confidence in them or a clear idea of their contours. It may seem peremptory to exclude the unconfident judgments supporting these values from consideration in reflective equilibrium, where they might have found principled support.
    step1: |-
      另一观点认为，如果像罗尔斯所设想的那样，我们是在描述自己的道德能力，那么把某些道德判断排除在考虑之外，可能反而是自我拆台的。我们对某些判断缺乏信心，这意味着它们很可能在反思过程中被否决，但这并不构成断然弃置它们的理由（Raz 1982: 318–319）[^raz-1982]。这种做法可能加重而非减轻反思平衡本应处理的道德感受性扭曲（Knight 2017: 47–48）[^knight-2017]。设想某人有某些极右主张，但尚未极端到看不出平等与自由之类价值有某种吸引力——尽管他对这些价值信心不足，对其轮廓也缺乏清晰观念。把这些支持此类价值的低信心判断排除在反思平衡的考虑之外，从而不让它们获得原则性支持，似乎过于武断。
    step2: |-
      另一种看法则主张：倘若如罗尔斯所设想，我们是在描述自己的道德能力，那么把一部分道德判断排除在考虑之外，便显得自拆台脚。对某些判断缺乏信心，只意味着它们很可能在反思过程中被淘汰，却并不构成径行弃置它们的理由（Raz 1982: 318–319）[^raz-1982]。这样做，非但不能减轻、反而可能加重反思平衡原欲矫正的道德感受性扭曲（Knight 2017: 47–48）[^knight-2017]。设某人有若干极右信念，但尚未偏激到对平等、自由这类价值毫无感应，只是对其信心寡薄、对其实质轮廓亦无清晰观念。此时若把这些支持此类价值的低信心判断排除于反思平衡之外——而它们本可在其中获得原则性的支持——便未免失之武断。
