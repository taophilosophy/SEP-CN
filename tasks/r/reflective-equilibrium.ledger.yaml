      Some advocates of reflective equilibrium combine the view with moral realism, maintaining that the method can provide evidence of objective moral truth (Brink 1989 and more tentatively Daniels 1996: 37–39)[^brink-1989][^daniels-1996]. Rawls takes a less metaethically ambitious approach, his constructivist theory providing “objectivity for its limited political purposes” (Rawls 2005: 110; see also Nielsen 1993; Brandstedt & Brännmark 2020)[^brandstedt-2020][^nielsen-1993][^rawls-2005]. On either view reflective equilibrium can offer objective support for moral principles.
    step1: |-
      一些反思平衡的倡导者把这一观点与道德实在论结合起来，主张该方法能提供客观道德真理的证据（Brink 1989，以及更为试探性的 Daniels 1996: 37–39）[^brink-1989][^daniels-1996]。罗尔斯采取一种在元伦理学上抱负较小的进路，其建构主义理论提供“为其有限政治目的服务的客观性”（Rawls 2005: 110; 亦见 Nielsen 1993; Brandstedt & Brännmark 2020）[^brandstedt-2020][^nielsen-1993][^rawls-2005]。按任一观点，反思平衡都能为道德原则提供客观支持。
    step2: |-
      有些反思平衡的倡导者将此说与道德实在论相结合，主张该方法能提供客观道德真理的证据（Brink 1989；Daniels 1996: 37–39 则较为迟疑）[^brink-1989][^daniels-1996]。罗尔斯的进路在元伦理学上抱负较小，其建构主义理论所提供的只是“为其有限政治目的服务的客观性”（Rawls 2005: 110; 亦见 Nielsen 1993; Brandstedt & Brännmark 2020）[^brandstedt-2020][^nielsen-1993][^rawls-2005]。无论取哪一说，反思平衡都能为道德原则提供客观支持。
