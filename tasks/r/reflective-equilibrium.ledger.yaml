      反思平衡，至少按经典理解，出现在判断与判断在原则中的表征汇合之处。理论有双重角色：既是反思平衡产出的原则与优先规则之聚集，也是选择那些原则的论证来源。本节考察原则与理论在反思平衡中的作用。
    step2: |-
      反思平衡——至少按经典的理解——成于判断同其在原则中的表征相会合之处。理论身兼二职：既汇聚反思平衡所产出的原则与优先规则，又充当择定这些原则的论证来源。本节讨论原则与理论在反思平衡中的地位。
