      > This charge of emptiness seems to me to be largely correct, but nonetheless mistaken in one important respect, and therefore not as damaging as it sounds. The charge is largely correct because the search for wide reflective equilibrium, as Rawls describes it, allows for what might have been seen as alternative methods of justification to be incorporated within it. … What the method of reflective equilibrium prescribes is, so to speak, a level playing field of intuitive justification on which principles and judgments of all levels of generality must compete for our allegiance. It thus allows all possible sources of justificatory force to be considered. But the method is not vacuous because it is incompatible with some views about these sources. It is incompatible, first, with the idea that any particular class of judgments or principles can be singled out in advance of this process as justified on some other basis and, second, with the idea that any class of considered judgments should be left out of this process. (Scanlon 2003: 151)[^scanlon-2003].
    step1: |-
      > 在我看来，这一空洞指控大体正确，但在一处重要方面却错了，因此并不像听上去那样有害。说它大体正确，是因为如罗尔斯所描述的，对广义反思平衡的探求，容许那些本可能被视为替代性证成方法的东西被纳入其中。……反思平衡的方法所规定的，可以说是一个直观证成的公平竞技场，一切普遍性层次的原则与判断都须在此争夺我们的效忠。它因而容许一切可能的证成性力量来源都被考虑在内。但该方法并非空洞，因为它与关于这些来源的某些看法不相容：第一，它与如下观念不相容——任何特定类别的判断或原则可以在这一过程之前被单独挑出，说它基于其他某种根据而得到证成；第二，它与如下观念不相容——任何类别的经过考虑判断都应被排除在这一过程之外。（Scanlon 2003: 151）[^scanlon-2003]
    step2: |-
      > 这一空洞之讥，我看大体是对的，然于一处要紧处却错了，故其杀伤力并不如听来之大。讥其大体为是，是因为如罗尔斯所述，对广义反思平衡的探求本容许那些本来或被视作替代性证成方法的东西被纳入其中。……反思平衡的方法所规定的，可谓一方直观证成的公平竞技场，一切普遍性层次的原则与判断俱须在此争夺吾人之归心。是故它容许一切可能的证成力量之源尽入考量。然而此法并不空洞，因为它与关于此类来源的某些见解不相容：其一，不容许任何特定类别的判断或原则在这一过程之前便被单独挑出，谓其依凭别的根据已获证成；其二，不容许任何类别的深思熟虑判断被摒除于这一过程之外。（Scanlon 2003: 151）[^scanlon-2003]
