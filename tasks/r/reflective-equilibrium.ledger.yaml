      > [o]ur “intuitions” are simply opinions; our philosophical theories are the same. Some are commonsensical, some are sophisticated; some are particular, some general; some are more firmly held, some less. But they are all opinions, and a reasonable goal for a philosopher is to bring them into equilibrium … If our official theories disagree with what we cannot help thinking outside the philosophy room, then no real equilibrium has been reached. (Lewis 1983: x; cf. Goodman 1965: 63–64)[^goodman-1965][^lewis-1983]
    step1: |-
      > 我们的“直觉”不过是意见；我们的哲学理论也一样。有些是常识的，有些是精致的；有些是特殊的，有些是普遍的；有些更为牢固，有些则不然。但它们全都是意见，而哲学家的一个合理目标，就是使之达到平衡……如果我们的正式理论与我们在哲学教室之外不得不持有的想法相抵触，那么就没有达到真正的平衡。（Lewis 1983: x; 参较 Goodman 1965: 63–64）[^goodman-1965][^lewis-1983]
    step2: |-
      > 我们的“直觉”无非是意见，我们的哲学理论亦然。其中有常识之见，也有精致之论；有特殊者，也有普遍者；有执之较坚者，也有执之较松者。但它们终究都是意见，而哲学家的合理目标，是使这些意见归于平衡……倘若我们的正式理论与我们在哲学讲堂之外不得不持有的想法相抵牾，那就谈不上真正的平衡。（Lewis 1983: x; 参较 Goodman 1965: 63–64）[^goodman-1965][^lewis-1983]
