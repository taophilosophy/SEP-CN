      One response here is to insist that, if you have followed the method correctly, it does justify one’s principles, and not only to oneself (see the discussions of credibility and relativism below). It might nevertheless be urged that, if our views are to have some impact in the real world, they should move other people as well as ourselves (Anderson 2015)[^anderson-2015]. This is a challenge to reflective equilibrium from political practice rather than moral epistemology, and philosophers may feel it is not their role to address it—it is enough for them to set out justified views. Still, those with policy ambitions for reflective equilibrium have described three broad forms of *public reflective equilibrium.*
