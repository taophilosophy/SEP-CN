      Support for the foundationalist interpretation comes from considered judgments’ clear justificatory role in reflective equilibrium. All justification in reflective equilibrium relies on the deliberator’s actual considered judgments. The most powerful principle or elegantly coherent theory must be rejected if they do not agree with judgment. Principles and theories have no influence on the process except through the medium of considered judgments—if the deliberator is not won around to them, they do not move the equilibrium one iota. For the foundationalist, a judgment does not need to prove itself as a principle or theory does. The mere fact that the deliberator holds it is enough for it to guide equilibrium. That said, the kind of foundationalism at hand is clearly rather modest (Ebertz 1993; Cath 2016: 219–220)[^cath-2016][^ebertz-1993]. Judgments are treated as revisable even where they are viewed as empirical data (Floyd 2017)[^floyd-2017]. The method, at least in its usual, wide form, gives no place to the unrevisable beliefs of traditional foundationalism or intuitionism (DePaul 1993: 34)[^depaul-1993].
    step1: |-
      对基础主义解读的支持，来自经过考虑的判断在反思平衡中显而易见的证成作用。反思平衡中的一切证成都依赖慎思者实际持有的经过考虑的判断。最有力的原则或最优美融贯的理论，若与判断不合，也必须被拒斥。原则与理论除经由经过考虑的判断这一媒介外，对过程没有影响——如果慎思者未被说服，它们就丝毫不能推动平衡。对基础主义者而言，一个判断不必像原则或理论那样证明自己；仅仅慎思者持有它，就足以让它引导平衡。话虽如此，这里所涉的基础主义显然相当温和（Ebertz 1993; Cath 2016: 219–220）[^cath-2016][^ebertz-1993]。即便判断被视为经验材料，也被当作可修正的（Floyd 2017）[^floyd-2017]。该方法至少在其通常的广义形态中，不给传统基础主义或直觉主义那些不可修正的信念留位置（DePaul 1993: 34）[^depaul-1993]。
    step2: |-
      基础主义解读之根据，在于深思熟虑的判断在反思平衡中显豁的证成作用。反思平衡里的一切证成，都系于慎思者实际持有的深思熟虑判断。再有力的原则、再优雅融贯的理论，苟与判断相违，也须弃置。原则与理论唯有借深思熟虑判断这一媒介方能施影响于过程——慎思者若不被说服，它们便不能使平衡挪动分毫。在基础主义者看来，判断无须像原则或理论那样自证其名分；只消慎思者持有它，便足以让它引导平衡。话虽如此，此处的基础主义显然甚为温和（Ebertz 1993; Cath 2016: 219–220）[^cath-2016][^ebertz-1993]。判断纵被视为经验材料，仍作可修正者看待（Floyd 2017）[^floyd-2017]。这一方法至少在其通常的广义形态下，不为传统基础主义或直觉主义的不可修正信念留一席之地（DePaul 1993: 34）[^depaul-1993]。
