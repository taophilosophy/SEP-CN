      A first distinction is, then, that while principles necessarily generalize to more than one case (List & Valentini 2016; Slavny et al. 2021)[^list-2016][^slavny-2021], judgments may be either general or particular. A second distinction is that judgments express an agent’s moral outlook while principles are candidate representations of that outlook (cf. Brun 2014)[^brun-2014]. In reflective equilibrium, judgments are the views actually held by the moral deliberator while a “scheme of principles represents their moral conception and characterizes their moral sensibility” (Rawls 1974: 7; see also Rawls 1971: 48)[^rawls-1971][^rawls-1974]. This section examines judgments, while the next considers principles.
    step1: |-
      那么第一个区分是：原则必然推广到不止一个情形（List & Valentini 2016; Slavny et al. 2021）[^list-2016][^slavny-2021]，而判断则可以是普遍的，也可以是特殊的。第二个区分是：判断表达行动者的道德视野，而原则是该视野的候选表征（参较 Brun 2014）[^brun-2014]。在反思平衡中，判断是道德慎思者实际持有的观点，而“一套原则表征其道德构想、刻画其道德感受性”（Rawls 1974: 7; 亦见 Rawls 1971: 48）[^rawls-1971][^rawls-1974]。本节考察判断，下一节考察原则。
    step2: |-
      由此得第一层区分：原则必定要推广及于不止一个场合（List & Valentini 2016; Slavny et al. 2021）[^list-2016][^slavny-2021]，判断则或普遍或特殊，皆无不可。第二层区分是：判断表达行动者本人的道德视野，原则则是对这一视野的候选表征（参较 Brun 2014）[^brun-2014]。在反思平衡中，判断是道德慎思者实际持有的看法，而“一套原则表征其道德构想，并刻画其道德感受性”（Rawls 1974: 7; 亦见 Rawls 1971: 48）[^rawls-1971][^rawls-1974]。本节专论判断，下节再论原则。
