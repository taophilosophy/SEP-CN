    source: |-
      To summarize, wide reflective equilibrium consists of agreement between revisable judgments and principles following reflection on a wide range of principles, arguments, justificatory devices, and background theories. In its pure form, it is an impossibly demanding method, drawing a vast and ever-growing expanse of principles, arguments and theories within its ambit. This exacting standard can nevertheless inform our approach to a more modest reflective equilibrium, as where Rawls compares his theory of justice’s “principles and arguments with a few other familiar views,” which “moves us closer to the philosophical ideal; it does not, of course, achieve it” (Rawls 1971: 49, 50; see also Rawls 2005: 97)[^rawls-1971][^rawls-2005].
    step1: |-
      总之，广义反思平衡在于：在反思了广泛的原则、论证、证成装置与背景理论之后，可修正的判断与原则之间达成一致。就其纯粹形态而言，它是一种要求高得不可能的方法，把大量且不断扩大的原则、论证与理论纳入自己的范围。然而这一严格标准仍可为我们走向较为温和的反思平衡提供指引，例如罗尔斯把他的正义理论的“原则与论证同少数其他熟悉的观点相比较”，而这样“使我们更接近哲学理想；当然它并未达到该理想”（Rawls 1971: 49, 50; 亦见 Rawls 2005: 97）[^rawls-1971][^rawls-2005]。
    step2: |-
      要之，广义反思平衡在于：经对广泛原则、论证、证成装置与背景理论的反思之后，可修正的判断与原则彼此相符。就其纯粹形态言，此法要求之苛，几无可能实现，它将日增无已的大量原则、论证与理论尽收入彀中。然而这一严格标准仍可引导我们走向较为朴素的反思平衡：如罗尔斯将其正义理论的“原则与论证同少数其他习见的观点相较”，此举“使我们更接近哲学理想；当然并未真正达到”（Rawls 1971: 49, 50; 亦见 Rawls 2005: 97）[^rawls-1971][^rawls-2005]。
