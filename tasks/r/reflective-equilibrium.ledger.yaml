      On, then, to the objection to the lack of a unique *intra*personal equilibrium. Just as different people may reach different equilibria, the same person may reach different equilibria at different times, as their judgments are revisable. The ethical deliberator can simply change their mind even if the relevant facts stay the same, the claimed standard of justification being a drifting one (Copp 1985: 165)[^copp-1985]. Alternatively, there may be multiple simultaneous equilibria even for a single person, where principles and judgments can be made to fit each other in different combinations (Haslett 1987: 310)[^haslett-1987]. Critics worry that such an indeterminate procedure cannot tell us what to believe or results in an arbitrary outcome (McPherson 2015: 662–663; List & Valentini 2016: 542)[^list-2016][^mcpherson-2015].
    step1: |-
      接下来是反对缺乏唯一 *个人内* 平衡的意见。正如不同的人可能达到不同的平衡，同一个人在不同时间也可能达到不同的平衡，因为其判断是可修正的。伦理慎思者即便相关事实不变，也能干脆改变主意；所谓证成标准于是成了漂移不定的东西（Copp 1985: 165）[^copp-1985]。另一种可能是，即便对单个人而言，也可能同时存在多个平衡，原则与判断可以以不同组合彼此相配（Haslett 1987: 310）[^haslett-1987]。批评者担心，这种不确定的程序无法告诉我们该相信什么，或者会导致任意的结果（McPherson 2015: 662–663; List & Valentini 2016: 542）[^list-2016][^mcpherson-2015]。
    step2: |-
      其次，是反对缺乏唯一的 **个人内** 平衡的意见。正如不同的人可能达到不同的平衡，同一个人在不同时候也可能达到不同的平衡，因为其判断可加修正。伦理慎思者纵然面对同一事实，也尽可改弦易辙；所谓证成的标准遂成漂移无定之物（Copp 1985: 165）[^copp-1985]。另一可能是，即便对单独一人而言，也可同时并存多个平衡，原则与判断能以不同方式彼此相配（Haslett 1987: 310）[^haslett-1987]。批评者忧心：这样一种游移不定的程序，既无从告诉我们该信什么，又会导致任意独断的结果（McPherson 2015: 662–663; List & Valentini 2016: 542）[^list-2016][^mcpherson-2015]。
