      A commonsense form of justification is *inferential* and *linear.* It is inferential because each belief is justified by another, and it is linear because beliefs cannot justify any of their antecedent beliefs. A is justified by B, which is justified by C, and so on. The problem with such inferential and linear justification is that it falls into infinite regress. For anything to be justified at all, it seems we have to give an endless chain of justification that we cannot possibly proffer. The regress can be ended either by permitting non-inferential justification, as *foundationalism* proposes, or by permitting non-linear justification, as *coherentism* proposes (Brink 1989: 105–106)[^brink-1989]. Some have interpreted reflective equilibrium as foundationalist, but most interpret it as coherentist.
    step1: |-
      一种常识形式的证成是 *推论式的* 与 *线性的*。它是推论式的，因为每个信念都由另一个信念证成；它是线性的，因为信念不能证成自己的任何在先信念。A 由 B 证成，B 由 C 证成，如此下去。这种推论式线性证成的问题在于，它陷入无穷倒退。要有什么得到证成，似乎我们就必须给出一条我们不可能给出的无尽证成链条。这一倒退只能这样终止：或者如 *基础主义* 所主张，允许非推论的证成；或者如 *融贯论* 所主张，允许非线性的证成（Brink 1989: 105–106）[^brink-1989]。有人把反思平衡解释为基础主义的，但多数人把它解释为融贯论的。
    step2: |-
      常识所理解的证成，是 **推论式** 的、**线性** 的。说它推论式，是因每一信念皆由另一信念证成；说它线性，是因信念无从证成其先前信念。A 由 B 证成，B 由 C 证成，如是递推。这种推论式线性证成的难处，在于坠入无穷倒退：似乎任何东西要获得证成，我们都得端出一条不可能端出的无尽证成之链。终止倒退之途有二：或如 **基础主义** 所倡，容许非推论的证成；或如 **融贯论** 所倡，容许非线性的证成（Brink 1989: 105–106）[^brink-1989]。有人把反思平衡解作基础主义的，多数人则解作融贯论的。
