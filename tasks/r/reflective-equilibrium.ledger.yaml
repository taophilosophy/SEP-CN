      We might, then, consider whether reflective equilibrium is possible without principles. On one view the core of reflective equilibrium is inspired by Socrates’ transformation of his pupils’ “inarticulate hunches into fully explicit beliefs” (Schroeter 2004: 121)[^schroeter-2004]. This “maieutic reflection” makes our inchoate moral notions more precise; sometimes we will endorse them, but at other times we may find they conflict and revise some of them. Maieutic reflection is a valuable tool of moral enquiry even if there is no “stable resting point” and no intention to build a moral theory (Schroeter 2004: 122)[^schroeter-2004]. Even antitheorists could use this method. An apparent qualification is that constructivists—those that hold that “moral facts are epistemically constrained” (Schroeter 2004: 111)[^schroeter-2004]—are committed to moral theory after all.
