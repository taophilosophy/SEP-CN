      But perhaps the more serious problem the constraint addresses is not deliberate circularity. We want to ensure that our moral principles are not merely “accidental generalizations” of “moral facts,” and we can do this by independently testing them against background theories, just as scientific generalizations that inadvertently correspond to observations can be distinguished from scientific laws by their lack of coherence with connected theory (Daniels 1996: 22)[^daniels-1996]. Critics suggest accidental generalizations might alternatively be weeded out simply by considering a sufficiently large number of cases (DePaul 1993: 15)[^depaul-1993]. A combination of the two approaches may be preferable (Holmgren 1989: 59)[^holmgren-1989].
