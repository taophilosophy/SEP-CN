      Third, we are to consider not just a very wide range of principles, but *a wide range of* *arguments* for them. Ideally we should consider all such arguments (Rawls 1971: 49)[^rawls-1971]. We are also to consider arguments *against* principles. The arguments show the strengths and weaknesses of the principles under consideration (Daniels 1996: 82)[^daniels-1996]. One important kind of argument is the thought experiment. For instance, in relation to the principle of utility, one might consider utilitarian sheriffs, utility monsters, experience machines, trolley problems, and repugnant conclusions, among countless others. A “directed reflective equilibrium” offers a sequencing for consideration of such cases (Slavny et al. 2021)[^slavny-2021]. Note that such arguments may not only support one principle over another, but generate new principles, such as variant forms of utilitarianism—and there will be new arguments for and against these variants, which generate their own variants, and so on.
    step1: |-
        第三，我们要考虑的不只是很广泛的原则，还有支持它们的 *广泛论证*。理想上我们应考虑一切这样的论证（Rawls 1971: 49）[^rawls-1971]。我们还要考虑 *反对* 原则的论证。这些论证显示所考虑原则的强处与弱处（Daniels 1996: 82）[^daniels-1996]。一类重要的论证是思想实验。例如就功利原则而言，人们可能考虑功利主义的治安官、效用怪物、体验机、电车难题与可憎结论等等，数不胜数。“有向反思平衡”为这类情形的考量提供了次序安排（Slavny et al. 2021）[^slavny-2021]。注意，这类论证不仅可以在原则之间有所取舍，还会生成新原则，例如功利主义的诸变体——而这些变体又会有支持与反对它们的新论证，后者再生出自己的变体，如此递进。
      step1: |-
        第三，我们要考虑的不只是很广泛的原则，还有支持它们的 *广泛论证*。理想上我们应考虑一切这样的论证（Rawls 1971: 49）[^rawls-1971]。我们还要考虑 *反对* 原则的论证。这些论证显示所考虑原则的强处与弱处（Daniels 1996: 82）[^daniels-1996]。一类重要的论证是思想实验。例如就功利原则而言，人们可能考虑功利主义的治安官、效用怪物、体验机、电车难题与可憎结论等等，数不胜数。“有向反思平衡”为这类情形的考量提供了次序安排（Slavny et al. 2021）[^slavny-2021]。注意，这类论证不仅可以在原则之间有所取舍，还会生成新原则，例如功利主义的诸变体——而这些变体又会有支持与反对它们的新论证，后者再生出自己的变体，如此递进。
    step2: |-
      其三，所须考量者不止极广泛的原则，还有 **广泛论证** 为之辩护。理想地说，一切此类论证都应在考量之列（Rawls 1971: 49）[^rawls-1971]；此外还须考虑 **反对** 诸原则的论证。论证能显出所论原则的短长（Daniels 1996: 82）[^daniels-1996]。思想实验是重要的一类：就功利原则而言，人们可以设想功利主义的治安官、效用怪物、体验机、电车难题、可憎结论，等等，不胜枚举。“有向反思平衡”为这类个案的考量安排了一套次序（Slavny et al. 2021）[^slavny-2021]。须注意，此类论证不仅能在原则之间分出高下，还会催生新的原则，如功利主义的种种变体——而这些变体又会引出新的支持与反对论证，再生变体，如此递嬗不已。
