      The first keeps individualist reflective equilibrium as its starting point, but aims to achieve convergence between equilibria (Daniels 1996: 33–39)[^daniels-1996]. The later Rawls particularly appeals to the idea of an “overlapping consensus” (Rawls 2005)[^rawls-2005]. The broad motivation here is that in a plural society with a diversity of comprehensive moral doctrines we cannot rely on any one comprehensive doctrine, such as utilitarianism, Kantianism, or a specific religious faith, to support our political principles. Rather, the reflective equilibria of adherents of each of these comprehensive doctrines can converge on a specific set of liberal principles, each for different reasons. The later Rawls continues to assume that reflective equilibria are wide, but now maintains that they should be *general:* “the same conception is affirmed in everyone’s considered judgments” (Rawls 2005: 384 n. 16)[^rawls-2005]. He refers to wide and general reflective equilibrium as *full reflective equilibrium.*
    step1: |-
