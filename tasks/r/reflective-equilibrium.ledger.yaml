      Wide reflective equilibrium may be able to take on board these concerns, and revise judgments accordingly. For instance, if we are moved by Singer’s argument about the strongly emotional and evolutionary character of some of our moral judgments, we could use a revised conception of considered judgments that excludes judgments distorted in this way (Tersman 2008: 398)[^tersman-2008]. Alternatively, we could allow such judgments to enter the process, but revise them given the background theory that Singer introduces (see Tersman 2008: 397)[^tersman-2008]. Order or framing effects would similarly be highlighted by psychological background theories, allowing the deliberator to take compensatory measures.
    step1: |-
        广义反思平衡也许能够吸纳这些顾虑，并据此修正判断。例如，如果我们为辛格关于我们某些道德判断具有强烈情感性与演化特征的论证所动，我们可以采用一种修正过的经过考虑判断概念，把以此方式被扭曲的判断排除在外（Tersman 2008: 398）[^tersman-2008]。或者，我们可以允许此类判断进入过程，但依据辛格所引入的背景理论修正它们（见 Tersman 2008: 397）[^tersman-2008]。顺序效应或框架效应同样会因心理学背景理论而被凸显出来，从而让慎思者采取补偿措施。
      step1: |-
        广义反思平衡也许能够吸纳这些顾虑，并据此修正判断。例如，如果我们为辛格关于我们某些道德判断具有强烈情感性与演化特征的论证所动，我们可以采用一种修正过的经过考虑判断概念，把以此方式被扭曲的判断排除在外（Tersman 2008: 398）[^tersman-2008]。或者，我们可以允许此类判断进入过程，但依据辛格所引入的背景理论修正它们（见 Tersman 2008: 397）[^tersman-2008]。顺序效应或框架效应同样会因心理学背景理论而被凸显出来，从而让慎思者采取补偿措施。
    step2: |-
      广义反思平衡或能容纳这些顾虑，并据以修正判断。例如，倘若我们为辛格关于某些道德判断之强烈情感性与演化品格的论证所动，便可采用一种经过修正的深思熟虑判断概念，将如此被扭曲的判断排除在外（Tersman 2008: 398）[^tersman-2008]；或者容许此类判断进入过程，却依据辛格所引入的背景理论修正之（见 Tersman 2008: 397）[^tersman-2008]。次序效应与框定效应，同样会因心理学的背景理论而彰显，慎思者遂可采取补救之策。
