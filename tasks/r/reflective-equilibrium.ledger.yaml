      ### 1.2 信心约束
  - id: 19
    kind: body
    source: |-
      Rawls proposes that “we can discard those judgments made with hesitation, or in which we have little confidence” (Rawls 1971: 47)[^rawls-1971]. In other words, considered judgments are subject to a *confidence constraint.* Relatedly, Rawls frequently refers to considered judgments as “convictions” (e.g., Rawls 1971: 19–21, 45, 48, 53, 246, 318–320, 447, 520, 580)[^rawls-1971]. The confidence constraint extends to *revisions* of judgments, which must be made “with conviction and confidence” (Rawls 1974: 8)[^rawls-1974]. A more modest version of the confidence constraint is a compromise between the ideal of accounting for all judgments and practical limitations (Scanlon 2003: 144)[^scanlon-2003].
    step1: |-
      罗尔斯提出，“我们可以舍弃那些犹豫不决、或我们对之信心不足的判断”（Rawls 1971: 47）[^rawls-1971]。换言之，经过考虑的判断须服从一个 *信心约束*。与此相关，罗尔斯常把经过考虑的判断称为“确信”（例如 Rawls 1971: 19–21, 45, 48, 53, 246, 318–320, 447, 520, 580）[^rawls-1971]。信心约束也延伸到对判断的 *修正*，这些修正必须“带着确信与信心”作出（Rawls 1974: 8）[^rawls-1974]。信心约束的一个较为温和的版本，是在“顾及一切判断”的理想与实践限制之间的折中（Scanlon 2003: 144）[^scanlon-2003]。
    step2: |-
      罗尔斯提出，“对于那些犹豫不决、或我们缺乏信心的判断，尽可弃置不顾”（Rawls 1971: 47）[^rawls-1971]。换言之，深思熟虑的判断须受一条 **信心约束** 的支配。与此相关，罗尔斯屡屡把这类判断称作“确信”（如 Rawls 1971: 19–21, 45, 48, 53, 246, 318–320, 447, 520, 580）[^rawls-1971]。信心约束亦及于判断的 **修正**：修正须“带着确信与信心”作出（Rawls 1974: 8）[^rawls-1974]。信心约束还有一种更为克制的版本，即在“顾及全部判断”的理想与实践限度之间取一折中（Scanlon 2003: 144）[^scanlon-2003]。
