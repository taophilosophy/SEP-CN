      A difficulty with this approach is that it may be too ambitious in its expectations of the general public’s theorizing, as it takes not only judgments but theories from consultees. Yet the general public may not have moral and political principles, if they do have such principles they may conflict, and their views certainly do not mirror theoretical divides in philosophy (e.g., between Kantians and utilitarians) (Baderin 2017: 11–12)[^baderin-2017].
    step1: |-
      这一进路的困难在于，它对一般公众的理论化能力期望过高，因为它不只从受访者那里取判断，还取理论。然而一般公众可能并无道德与政治原则；即便有，也可能相互冲突；而他们的观点肯定不反映哲学中的理论分野（例如康德主义者与功利主义者之别）（Baderin 2017: 11–12）[^baderin-2017]。
