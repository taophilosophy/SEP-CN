      To be sure, it is possible that some of those who claim to follow the method start with such unreasonable views (e.g., a cast iron commitment to random killing) that they will still have unreasonable views in equilibrium, but this could be seen as analogous to a scientist having such unreasonable views (e.g., a cast iron commitment to creationism or climate change denial) that their findings are unreasonable despite apparently following scientific procedure (Knight 2017: 53–54)[^knight-2017]. It might be held that, for people starting with such radically different beliefs from our own, it is not unreasonable to reach seemingly perverse equilibria (Cath 2016: 225–226)[^cath-2016]. Alternatively, and as explored below, the method might allow that their views are unjustified even though they are in equilibrium.
    step1: |-
      诚然，某些自称遵循该方法的人从如此不合理的观点出发（例如对随机杀人的铁一般承诺），以致他们在平衡中仍持有不合理的观点；但这可以类比于一位科学家持有如此不合理的观点（例如对神创论或否认气候变化的铁一般承诺），以致其研究结果不合理，尽管表面上遵循了科学程序（Knight 2017: 53–54）[^knight-2017]。或许可以说，对出发点与我们如此不同的人而言，达到看似反常的平衡并不算不合理（Cath 2016: 225–226）[^cath-2016]。另一种可能，如下文所探讨，是该方法允许他们的观点虽处于平衡却未获证成。
    step2: |-
      诚然，有些自称循法的人，其出发点之不合理（如对随机杀人的铁定执守）竟至于使他们即便在平衡中仍持不合理之见；但这可比于一位科学家抱有如此不合理的成见（如对神创论或否认气候变化的铁定执守），以致其研究结论虽外观上循科学程序，实则不合理（Knight 2017: 53–54）[^knight-2017]。或可主张：对出发点与我们如此悬隔的人而言，达到看似悖理的平衡并不为不合理（Cath 2016: 225–226）[^cath-2016]。另一种可能（详见下文）是：该方法容许其观点虽处平衡却未获证成。
