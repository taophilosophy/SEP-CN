    step2: |-
      反思平衡的拥护者大体拒斥此类约束。他们的基本不满是：这条约束在反思过程尚未展开之前便下了认识论上的判定，而这类判定恰应是从该过程中得出的结论。反思平衡不妨视为一种否定性的方法：一旦我们认定，认知成功的正面标准无法在充分考量实质论题之先被列出，剩下的便只有它（Walden 2013: 255）[^walden-2013]。依此看法，何谓证成、保证或一贯，须待一切相关理论摆上桌面之后、作为反思平衡过程的一环来裁定，而非由方法本身预先规定。
