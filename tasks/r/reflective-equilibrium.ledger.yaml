    source: |-
      This entry first addresses the judgments that are the starting point for reflective equilibrium, examining various interpretations of them found in the literature. It then explores the principles and theories that take us from merely having judgments to reaching reflective equilibrium. Finally, it considers some of the main objections to the method. Throughout the focus will be on reflective equilibrium in its archetypal setting of moral and political philosophy, especially as it has been developed by Rawls and Norman Daniels, though with some reference to versions of the method developed in other branches of philosophy (e.g., Goodman 1965; Lewis 1983; Elgin 1996)[^elgin-1996][^goodman-1965][^lewis-1983].
    step1: |-
      本文首先讨论作为反思平衡出发点的判断，考察文献中对这些判断的各种解读。随后探讨那些把我们从严仅有判断带到反思平衡的原则与理论。最后考虑对该方法的一些主要反对意见。通篇的焦点将放在反思平衡的典型场景，即道德与政治哲学中的反思平衡，尤其是罗尔斯与诺曼·丹尼尔斯所发展的形态；同时也会参照其他哲学分支中发展出的版本（例如 Goodman 1965; Lewis 1983; Elgin 1996）[^elgin-1996][^goodman-1965][^lewis-1983]。
    step2: |-
      本文先论反思平衡的出发点——判断，梳理文献中对判断的种种解释；继而探讨那些使人从仅仅拥有判断走向反思平衡的原则与理论；末了评述针对该方法的主要反对意见。全篇聚焦于反思平衡在道德与政治哲学这一典型场景中的形态，尤其是罗尔斯与诺曼·丹尼尔斯所发展的版本，间亦旁及哲学其他分支中形成的变体（如 Goodman 1965; Lewis 1983; Elgin 1996）[^elgin-1996][^goodman-1965][^lewis-1983]。
