      Suppose, for instance, that I have the conviction that no one should be very badly off. This judgment might support a sufficientarian principle of justice requiring that no one is very badly off (e.g., Frankfurt 1987)[^frankfurt-1987]. But suppose I now claim that this principle is also supported by the combination of the luck egalitarian background theory that no one should be badly off through no genuine choice of their own (Cohen 1989)[^cohen-1989] with the hard determinist background theory that no one is responsible for their choices, and my basis for the latter theory is the original judgment no one should be very badly off. In such a case it seems that the background theories give no independent support for the sufficientarian principle, i.e., no support that was not already there in the bare judgment that no one should be very badly off. If it were not for that judgment, I would not have a basis for my hard determinist background theory, and the luck egalitarian background theory alone would not support the sufficientarian principle, as it is consistent with some being very badly off due to choice.
    step1: |-
      例如，假定我有这样一个确信：没有人应当处境极差。这一判断可能支持一条充足主义正义原则，要求没有人处境极差（例如 Frankfurt 1987）[^frankfurt-1987]。但假定我现在主张，这条原则还由以下两者的结合所支持：运气平等主义的背景理论（没有人应当由于并非自己真正选择的原因而处境糟糕）（Cohen 1989）[^cohen-1989]，以及硬决定论的背景理论（没有人对自己的选择负责）；而我对后一理论的依据，正是最初的那个判断——没有人应当处境极差。在这种情形下，背景理论似乎并没有为充足主义原则提供独立支持，即没有提供原本不在“没有人应当处境极差”这一赤裸判断之中的支持。若不是那个判断，我就没有依据接受硬决定论的背景理论；而单独的运气平等主义背景理论也不会支持充足主义原则，因为它与“某些人因选择而处境极差”是相容的。
    step2: |-
