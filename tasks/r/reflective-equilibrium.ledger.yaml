      As mentioned above, a *narrow* reflective equilibrium is reached where principles are matched to initial judgments, allowing only for the “smoothing out of certain irregularities” (Rawls 1971: 49)[^rawls-1971]. In moral and political philosophy this is of interest mainly as a contrast with the *wide* reflective equilibrium endorsed by Rawls, Daniels, and many others in their wake (but see Beisbart, Betz, & Brun 2021). A wide reflective equilibrium is achieved where the deliberator has brought judgments and principles into agreement having reflected on a wide range of considerations. Wide reflective equilibrium contrasts with narrow reflective equilibrium in several respects.
    step1: |-
      如上所述，当一个 *狭义* 反思平衡使原则与初始判断相配、只允许“抹平某些不规则之处”时，它就达成了（Rawls 1971: 49）[^rawls-1971]。在道德与政治哲学中，它主要作为一种对照而有意义——对照的是罗尔斯、丹尼尔斯及其后学所赞成的 *广义* 反思平衡（但见 Beisbart, Betz, & Brun 2021）[^beisbart-2021]。当慎思者在反思了广泛考量之后使判断与原则达成一致时，广义反思平衡便实现了。广义反思平衡在若干方面与狭义反思平衡形成对照。
    step2: |-
      如前所述，**狭义** 反思平衡达成于原则与初始判断相配、而仅容许“抹平某些不规则之处”的境地（Rawls 1971: 49）[^rawls-1971]。在道德与政治哲学里，它的意义主要在于与 **广义** 反思平衡相对照——后者为罗尔斯、丹尼尔斯及其众多后学所称许（但见 Beisbart, Betz, & Brun 2021）。慎思者思量过广泛考量而使之判断与原则归于一致，广义反思平衡便告达成。二者的差别有以下数端。
