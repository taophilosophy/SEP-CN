      Although he recognized the fruitfulness of structural analyses of particular well-defined fields of experience, Ricoeur resisted those structuralists and post-structuralists who sought to reduce language itself to a closed system of signs having no reference to anything outside itself. Following clues found in the works of Emile Benveniste and Roman Jakobson, he defined discourse as the use of such sign systems by someone to say something about something to someone, using existing but malleable phonetic, lexical, syntactic, and stylistic rules. That is, discourse always involves a speaker or writer and a hearer or reader as well as something said in some situation about some reality, ultimately a world that we might inhabit. It follows that any interpretation of a form of discourse requires both the objective sort of analysis for which structuralism provides a tool and an acknowledgment that there is always a surplus of meaning that goes beyond what such objective techniques seek to explain. There is a surplus of meaning because we apply objective techniques to things we already understand as having a possible meaning without fully exhausting that meaning. The meaning of acts of discourse is moreover always open to new interpretations, particularly as time passes and the very context in which interpretation occurs itself changes.
    step1: |-
      尽管利科承认对特定界定良好的经验领域所作结构分析的丰产性，他却抵制那些力求把语言本身还原为封闭符号系统、不指涉自身之外任何东西的结构主义者与后结构主义者。循着埃米尔·本韦尼斯特与罗曼·雅各布森著作中的线索，他把话语定义为：某人使用这类符号系统，借助既存而可塑的语音、词汇、句法与文体规则，向某人就某事说些什么。也就是说，话语总是涉及一个说话者或写作者、一个听者或读者，以及在某种情境中就某种实在所说出的东西，最终是就一个我们可能栖居的世界所说出的东西。由此推出：对任何话语形式的解释，都既需要结构主义为之提供工具的那种客观分析，也需要承认总有一种超出这类客观技术所要解释之物的意义盈余。之所以有意义盈余，是因为我们把客观技术施用于我们已然理解为其具有某种可能意义、却并未被我们完全穷尽其意义的东西。此外，话语行为的意义总是向新的解释开放，尤其当时间流逝、解释所发生的语境本身也在变化之时。
