    source: |-
      Paul Ricoeur (1913–2005) is a distinguished French philosopher whose work has been widely translated and discussed across the world. In addition to his academic work, his public presence as a social and political commentator, particularly in France, led to a square in Paris being named in his honor on the centenary of his birth in 2013. Over the course of his long career he wrote on a broad range of issues and engaged many of the leading figures of his time. In addition to publishing more than 30 books, Ricoeur published more than 700 articles in French, many of which have been translated into English. Most of his articles in French have been made available online under the auspices of the Ricoeur Archive in Paris.
