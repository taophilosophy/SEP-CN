      Ricoeur’s work after *The Conflict of Interpretations* addressed a number of related topics. On one level, he explored the practice of interpretation as an arc leading from an initial situation and understanding to broadened understanding, both of the interpreter and the world as a world we can imagine ourselves as inhabiting. On a second level, he explored the broader notion of the fullness of language through investigation of different forms of extended discourse. These are uses of language that are longer than a single sentence and whose truth and meaning is not simply reducible to the sum of the truth values of the individual sentences which make up such extended discourse. On the basis of these two interwoven levels, he could also take up the questions of selfhood and responsible human action, allowing him to spell out in greater detail the ethical theory that had always been implicit in his philosophy. His discussion of ethics starts with a focus on person to person relations, the self and the other, characterized in the best case by solicitude for the other person and the possibility of friendship, then subsequently moved on to the question of justice and living with others beyond those we may meet every day or face to face. Here the question of rights and respect for the faceless other arises. The specific question of what is a just relation in such situations (*The* *Just*, 2000; *Reflections* *on* *the* *Just*, 2007), developed out of Ricoeur’s participation in a seminar for judges, led to his reflections in the last work published during his lifetime on the idea of mutual recognition (*The Course of Recognition*, 2005). In those final years, he also continued to explore other dimensions of the fullness of language, for example, through some significant essays on the notion of translation as occurring not just between languages but also within them (*On Translation*, 2006).
    step1: |-
      利科在《解释的冲突》之后的著作处理了若干相关论题。在一个层面上，他探究解释实践，把它看作一条弧线：从初始情境与初始理解，走向扩展了的理解——既是对解释者的理解，也是对世界的理解，即把世界理解为我们能想象自己栖居其中的世界。在第二个层面上，他通过考察扩展话语的不同形式，探究“语言的充实”这一更宽泛的概念。这些是长于单个句子的语言用法，其真值与意义不能简单还原为构成此类扩展话语的各个单句真值之和。在这两个相互交织的层面之上，他还能接手自身性与负责任的人类行动的问题，从而更详尽地阐明始终隐含在其哲学中的伦理学理论。他的伦理学讨论从人与人的关系、自我与他人出发，最好情形下以对他人的关切与友谊之可能为特征；随后转到正义问题，以及与我们未必每天见到或面对面相遇的他人共同生活的问题。这里出现了权利与对无面孔的他人之尊重的问题。究竟何为这类情境中的公正关系，这一具体问题（《论公正》，2000；《对公正的反思》，2007）源自利科参加的一个法官研讨班，并引出他生前出版的最后一部著作中对相互承认理念的思考（《承认的过程》，2005）。在那最后几年里，他还继续探究语言充实的其他维度，例如通过若干重要论文探讨翻译：翻译不仅发生在语言之间，也发生在语言之内（《论翻译》，2006）。
    step2: |-
      《解释的冲突》之后，利科处理了一组彼此相关的论题。一方面，他考察解释实践，把它视为一道弧线：从最初的情境与理解出发，走向更开阔的理解——既是对解释者自身的理解，也是对世界的理解，即把世界理解为我们能够想象自己栖居其中的那个世界。另一方面，他通过考察扩展话语的各种形态，探究“语言的充实”这一更宽的概念。所谓扩展话语，指的是长于一句的语言用法，其真与意义不能简单还原为组成它的各个单句真值之和。有了这两个相互交织的层面，他才能进而提出自身性与负责任行动的问题，从而把一向隐含在其哲学中的伦理学理论讲得更细。他的伦理学讨论从人与人的关系入手，即自我与他人的关系；这种关系在最好的情形下表现为对他人的关切，以及友谊的可能性。随后他转向正义问题，转向如何与我们未必天天见面、也未必面对面相遇的他人共同生活。权利问题与对“无面孔的他人”的尊重问题，便在这里出现。这类情境中何种关系才算公正（《论公正》，2000；《对公正的反思》，2007），这个具体问题源于利科参加的一个法官研讨班，并引出他生前最后一部著作对相互承认的思考（《承认的过程》，2005）。晚年他仍继续开掘语言充实的其他维度，例如写了几篇重要论文讨论翻译——翻译不仅发生在不同语言之间，也发生在同一种语言之内（《论翻译》，2006）。
