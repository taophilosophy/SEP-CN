  - id: 5
    kind: body
    source: |-
      Paul Ricoeur was born on February 27, 1913 in Valence, France. His mother died shortly thereafter and his father was killed in the Battle of the Marne in 1915, so Ricoeur and his sister were reared by their paternal grandparents and an unmarried aunt in Rennes. They were devout members of the French Reformed Protestant tradition. He was later to speak of the role of faith in his life as “an accident transformed into a destiny through an ongoing choice, while scrupulously respecting other choices.” As a war orphan his schooling was paid for by the French government. He studied philosophy first at the University of Rennes and then at the Sorbonne. Ricoeur was studying in Germany when World War II broke out. Soon after being called up for service in the French army in 1939 he was captured and spent the rest of the war in prison camps in Germany. There he was able to study the work of Karl Jaspers and to prepare a translation of Husserl’s *Ideas I* in the margins of the book which he had to conceal from his jailers. After the war, he completed his doctorate and was appointed lecturer, then professor of the history of philosophy at the University of Strasbourg, where he succeeded Jean Hyppolite. He remained there until 1956, when he was named to the chair of general philosophy at the Sorbonne. In 1965, he joined the faculty of the new University of Paris at Nanterre, now Paris X, whose establishment he had supported in light of the rapid growth in the number of university students at that time. He served a difficult year as Dean of the Faculty of Letters following the student uprising of 1968. Except for three years he then spent at Louvain, he continued to teach a seminar at the Husserl Archive in Paris until he reached the mandatory retirement age in 1980. From 1954 on, Ricoeur also lectured regularly in the United States and Canada. In 1970 he was named to succeed Paul Tillich as the John Nuveen professor of philosophical theology at the University of Chicago, with a joint appointment in the Divinity School, the Philosophy Department, and the Committee on Social Thought. He taught there regularly for a portion of each year until 1992. In 1986 he gave the Gifford Lectures in Edinburgh, Scotland. Ricoeur’s work was honored by a volume in the *Library* *of* *Living* *Philosophers* series. Among his many honorary doctorates are ones from Chicago (1967), Northwestern (1977), Columbia (1981), Göttingen (1987), and McGill (1992). He was the recipient of numerous awards, among them the Hegel Prize (Stuttgart, 1985), the Dante Prize (Florence, 1988), the Karl Jaspers Prize (Heidelberg, 1989), the Leopold Lucas Prize (Tübingen, 1990), the French Academy Grand Prize for Philosophy (1991), the Kyoto Prize (2000), and the Pope Paul VI International Prize (2003). In 2004, he was co-recipient of the John W. Kluge Prize in the Human Sciences awarded by the Kluge Center at the Library of Congress.
    step1: |-
      保罗·利科 1913 年 2 月 27 日生于法国瓦朗斯。他母亲不久后去世，父亲 1915 年在马恩河战役中阵亡，于是利科与妹妹由祖父母与一位未婚的姑母在雷恩抚养长大。他们是法国改革宗新教传统的虔信成员。他后来把信仰在其生活中的作用说成是“一桩偶发之事，通过持续的选择变为命运，同时严格尊重其他选择”。作为战争孤儿，他的学业由法国政府出资。他先在雷恩大学、后在索邦大学学习哲学。二战爆发时利科正在德国学习。1939 年他被征入法国军队服役后不久即被俘，在德国战俘营中度过了战争的其余岁月。在那里他得以研究卡尔·雅斯贝尔斯的著作，并在书页空白处起草胡塞尔《观念 I》的译本，该书必须对看守隐瞒。战后他完成博士学位，被任命为斯特拉斯堡大学讲师，随后任哲学史教授，接替让·伊波利特。他留在那里直到 1956 年，其时被聘为索邦大学普通哲学讲席。1965 年，他加入新的巴黎大学楠泰尔分校（今巴黎第十大学）的教师队伍；鉴于当时大学生人数迅速增长，他曾支持该校的创建。1968 年学生运动之后，他担任文学院长一年，其间颇为艰难。除随后在鲁汶度过的三年之外，他一直在巴黎胡塞尔档案库主持一个研讨班，直到 1980 年达到强制退休年龄。从 1954 年起，利科也定期在美国与加拿大讲学。1970 年他获任接替保罗·蒂利希，担任芝加哥大学约翰·努文哲学神学教授，同时在神学院、哲学系与社会思想委员会合聘。此后每年都有部分时间在那里任教，直到 1992 年。1986 年他在苏格兰爱丁堡作吉福德讲演。利科的著作得到《在世哲学家文库》丛书一卷本的致敬。在他的众多荣誉博士学位中，包括芝加哥大学（1967）、西北大学（1977）、哥伦比亚大学（1981）、哥廷根大学（1987）与麦吉尔大学（1992）所授。他获得许多奖项，其中包括黑格尔奖（斯图加特，1985）、但丁奖（佛罗伦萨，1988）、卡尔·雅斯贝尔斯奖（海德堡，1989）、利奥波德·卢卡斯奖（蒂宾根，1990）、法兰西学院哲学大奖（1991）、京都奖（2000）与教宗保禄六世国际奖（2003）。2004 年，他与另一位得主共同获得美国国会图书馆克鲁格中心颁发的约翰·W·克鲁格人文科学奖。
    step2: |-
      保罗·利科 1913 年 2 月 27 日生于法国瓦朗斯。母亲在他出生后不久去世，父亲 1915 年阵亡于马恩河战役，利科与妹妹便由祖父母和一位未出嫁的姑母在雷恩抚养成人。一家人是法国改革宗新教传统的虔诚信徒。后来他谈到信仰在自己生命中的位置，说那是“一次偶然，经由持续不断的选择而化为命运，同时一丝不苟地尊重别的选择”。作为战争孤儿，他的学费由法国政府承担。他先就读于雷恩大学，后入索邦大学研习哲学。二战爆发时，他正在德国求学。1939 年应征入伍，不久即被俘，此后的战争岁月都在德国的战俘营里度过。狱中他得以研读雅斯贝尔斯的著作，还在一本书的页边空白处着手翻译胡塞尔的《观念 I》——那本书他得瞒过看守。战后他取得博士学位，受聘为斯特拉斯堡大学讲师，继而接替让·伊波利特出任该校哲学史教授。他在斯特拉斯堡待到 1956 年，然后受聘索邦大学普通哲学教席。1965 年，他转入新办的巴黎大学楠泰尔分校（今巴黎第十大学）；当年大学生人数激增，他曾为该校的创办出力。1968 年学生运动之后，他出任文学院长，度过了艰难的一年。此后除了在鲁汶的三年，他一直在巴黎的胡塞尔档案库主持研讨班，直到 1980 年届龄强制退休。自 1954 年起，利科还定期赴美国与加拿大讲学。1970 年，他接替保罗·蒂利希，出任芝加哥大学约翰·努文哲学神学教授，同时在神学院、哲学系与社会思想委员会合聘。此后直到 1992 年，他每年都有一段时间在那里授课。1986 年，他在苏格兰爱丁堡主讲吉福德讲座。他的著作获得了《在世哲学家文库》专卷的礼遇。他获颁众多荣誉博士学位，包括芝加哥大学（1967）、西北大学（1977）、哥伦比亚大学（1981）、哥廷根大学（1987）与麦吉尔大学（1992）所授。他还获得许多奖项，如黑格尔奖（斯图加特，1985）、但丁奖（佛罗伦萨，1988）、卡尔·雅斯贝尔斯奖（海德堡，1989）、利奥波德·卢卡斯奖（蒂宾根，1990）、法兰西学院哲学大奖（1991）、京都奖（2000）与教宗保禄六世国际奖（2003）。2004 年，他与另一位学者共同获得美国国会图书馆克鲁格中心颁发的约翰·W·克鲁格人文科学奖。
