  - id: 7
    kind: body
    source: |-
      Ricoeur’s first major work was meant to appear in three volumes that would lay out a philosophy of the will starting from an eidetic phenomenology of the voluntary and the involuntary. The second volume would then turn to questions dealing with the empirical reality of the will. The third volume would address the misuse of the will and the existence of evil which cannot be explained through either a pure phenomenology of the will or its empirical existence. The projected third volume was announced as intending to present what Ricoeur called a poetics of the will and a vision of innocence in light of what Ricoeur, following Karl Jaspers, called Transcendence. This latter volume never appeared. It was delayed, then set aside when Ricoeur discovered new problems he had not foreseen and when he sought to respond to new challenges presented by the rise of structuralism.
    step1: |-
      利科的第一部重要著作原计划分三卷出版，从关于自愿者与非自愿者的本质现象学出发，铺陈一种意志哲学。第二卷将转向涉及意志之经验实在的问题。第三卷将处理意志的误用与恶的存在，而这些问题既不能通过纯粹的意志现象学、也不能通过意志的经验存在得到解释。据预告，这计划中的第三卷意在呈现利科所谓的意志诗学，以及一种依循利科从卡尔·雅斯贝尔斯那里借来的“超越者”概念的清白状态之见。这一卷后来从未问世。它先被推迟，随后又被搁置：利科发现了未曾预见的新问题，又力图回应结构主义兴起所带来的新挑战。
    step2: |-
      利科的第一部重要著作原拟出三卷，从自愿者与非自愿者的本质现象学入手，铺开一套意志哲学。第二卷转而处理意志的经验实在问题；第三卷则要处理意志的误用与恶的存在——这两者，单靠纯粹的意志现象学或单单考察意志的经验存在，都解释不了。按照预告，第三卷打算呈现利科所说的“意志的诗学”，并依循他从雅斯贝尔斯那里借来的“超越者”概念，勾画一种清白无罪的境界。这一卷始终没有写成：先是一再延宕，后来干脆搁下——因为他发现了自己未曾预见的新问题，也因为他要应对结构主义崛起带来的新挑战。
