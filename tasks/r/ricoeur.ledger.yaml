      利科把关于自由的论述延伸到恶的问题上，写成《易错的人》与《恶的象征》，两书均出版于 1960 年。它们追问的是：我们何以可能误用自己的自由？这个问题，在最初那卷现象学著作里被悬置了。《易错的人》动用先验分析，证明这种可能性扎根于人的存在所固有的基本不相称：经验是有限的、受视角限制的，而人在知觉、实践与感受中承接经验，又通向无限的理性维度；人就处在这两端之间，于是有了“易错性”这一概念。这种不相称渗入人的存在的每一面，从知觉、感受到思维，也明白地体现在人对占有、权力与声望的渴求里。正因这种不相称，我们从不与自身完全合一，所以我们会错。可是，误用自由、也就是作恶，既非与生俱来，也非势所必至，它只是一种永远存在的可能。
