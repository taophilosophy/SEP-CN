      The first volume of this projected trilogy, *Freedom and Nature: The Voluntary and the Involuntary* (1950), proposes a phenomenology of the will, while bracketing the reality of evil. It draws on the method of phenomenology developed by Edmund Husserl. In it one finds an expression of a theme central to Ricoeur’s anthropology, namely, the polarity of the subjective and objective features of human existence. Contrary to Sartre’s claim that there is radical difference between consciousness (or the for-itself) and materiality (or the in-itself), a difference that pits the freedom of the for-itself against the sheer facticity of the in-itself, Ricoeur argues that the voluntary and involuntary dimensions of human existence are complementary. This can be seen through a phenomenological description of the three structures that constitute the voluntary pole of human existence: deciding, choosing and moving to action, and our necessary consent to the involuntary as that which is acted upon through our will, whose organ is our body. There is no seamless harmony between these two poles, instead human beings struggle with the tension between them and ultimately consent to their embodied lives as something they do not fully create. The always fragile resolution of this conflict that ultimately defines human freedom.
    step1: |-
      这部计划中的三部曲的第一卷《自由与自然：自愿者与非自愿者》（1950）提出一种意志现象学，同时把恶的实在括置起来。它取材于埃德蒙德·胡塞尔所发展的现象学方法。在其中可以找到利科人类学的一个中心主题的表达，即人的存在之主观特征与客观特征的两极对立。与萨特的主张相反——萨特认为意识（或自为存在）与物质性（或自在存在）之间存在根本差异，这一差异使自为存在的自由与自在存在的纯粹事实性相互对峙——利科主张人的存在之自愿维度与非自愿维度是互补的。这可以通过对构成人的存在之自愿极的三个结构的现象学描述看出：决定，选择并推动行动，以及我们对非自愿者的必然认可——非自愿者是通过我们的意志而被作用者，而意志的器官是我们的身体。这两极之间并无无缝的和解；相反，人挣扎于二者之间的张力，最终把其具身的生活当作某种自己并未完全创造的东西加以认可。这一冲突的解决始终脆弱，而正是它最终规定了人的自由。
