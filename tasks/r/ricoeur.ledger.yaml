      利科承认，对某些界定分明的经验领域，结构分析确实富有成效；但他不赞成那些结构主义者与后结构主义者——他们要把语言本身化约为一个封闭的符号系统，不指涉自身之外的任何东西。他循着本韦尼斯特与雅各布森著作中的线索，把话语界定为：某人使用这类符号系统，凭借既存而可塑的语音、词汇、句法与文体规则，向某人就某事说些什么。也就是说，话语里总有说话者或写作者、听者或读者，还有在特定情境中说出、关于某种实在的某个东西——说到底，是关于一个我们可能栖居的世界。由此可知，解释任何一种话语形式，既要作结构主义所提供的那种客观分析，又要承认：总有超出这类客观技术所要解释之物的意义盈余。之所以有盈余，是因为我们动用客观技术的对象，本已被我们理解为具有某种可能的意义，而那意义又从未被我们穷尽。何况话语行为的意义永远向新解释敞开，尤其是当时间过去、解释所处的语境本身也变了的时候。
