      保罗·利科（1913–2005）是一位杰出的法国哲学家，其著作在世界各地被广泛翻译和讨论。除学术工作之外，他作为社会与政治评论者的公共存在，尤其在法国，使巴黎在 2013 年他诞辰一百周年之际以他的名字命名了一处广场。在他漫长的职业生涯中，他论及广泛的问题，并与同时代许多重要人物交锋。除出版三十多部著作之外，利科还以法语发表论文七百多篇，其中许多已被译成英语。他的大部分法语论文已在巴黎利科档案库的主持下在线公开。
    step2: |-
      保罗·利科（1913–2005）是杰出的法国哲学家，其著作译介至世界各地，讨论也极为广泛。他不仅在学界有影响，还以社会与政治评论者的身份活跃于公共领域，在法国尤然；2013 年他诞辰百年之际，巴黎有一处广场即以他的名字命名。在漫长的学术生涯中，他论题极广，与同时代许多重要思想家都有交锋。除三十余部著作外，利科还用法文发表论文七百余篇，其中不少已译成英文；他的大部分法文论文，已由巴黎的利科档案库（Ricoeur Archive）挂上网公开。
