      Human disproportion does not render our existence meaningless. Rather, the very disproportion that makes us fallible and makes human evil doing possible is also what makes goodness, knowledge, and achievement possible. It is what distinguishes us from one another—each one of us has his or her unique spatiotemporal location and perspective but we can know ourselves as one human among many and we can seek to know the world beyond our individual perspective on it. Our fallibility also makes it necessary and possible for us to communicate with each other through our use of the *logos* which seeks to transcend our localized points of view.
