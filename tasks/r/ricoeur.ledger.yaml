    kind: body
    source: |-
      In the course of developing his anthropology of the capable human being, Ricoeur made several major methodological shifts, partly in response to changes in his intellectual setting, sometimes in ways that challenged his own approach, and sometimes in response to questions that had arisen in his published work or that had not yet been adequately treated there. His early academic training was in the tradition of French reflexive philosophy, a tradition that seeks to understand how the “I” comes to be aware of its thoughts and actions starting from the lived experience of reflexive consciousness, our being aware of ourselves as existing, thinking, and acting. This focus on reflexive consciousness played a role in organizing Ricoeur’s thinking. His first major publications after World War II, drew both from the French tradition of reflexive philosophy and from existential phenomenology, reflecting his study of Husserl, which had begun prior to World War II, as well as of Karl Jaspers, Gabriel Marcel, Jean-Paul Sartre, and Maurice Merleau-Ponty. By 1960, however, Ricoeur had concluded that to study human reality properly, particularly given the existence of evil, he had to supplement direct phenomenological description with the hermeneutic work of interpretation. This shift led to an increasing focus on a theory of interpretation that could be grafted on to phenomenology, an approach which he characterized as hermeneutic phenomenology. For a hermeneutic phenomenology, meaning arises in and through our use of language to talk about our lived experience. While philosophical language and the categories it uses aspire for clear and univocal concepts, natural language is polysemic; it can have more than one meaning, more than one translation, so most uses of language call for interpretation. He took up this insight through the philosophy of discourse that he developed on the basis of the increased emphasis on language in his philosophy. This hermeneutic or linguistic turn in Ricoeur’s thought did not require him to disavow the basic results of his earlier investigations, however it did enable him to see more clearly its broader implications. It led to an increasing emphasis on the fact that we live in time and in history. His late writings also reflect a greater concern for questions of ethics at the individual as well as the societal and political levels, leading to his essays on the idea of the just and his last book on the possibility of mutual recognition and states of peace.
    step1: |-
      在发展其“有能力的人”的人类学过程中，利科作了几次重大的方法论转向：部分是为了回应其思想环境的变化，有时是以挑战自己原有进路的方式，有时则是为了回应其已发表著作中出现的、或尚未得到充分处理的问题。他早期的学术训练属于法国反省哲学传统；这一传统从反省意识的活的经验出发，即从我们意识到自身存在、思考和行动出发，来理解“我”如何意识到其思想与行动。这种对反省意识的关注在组织利科的思想方面起了作用。他二战后的头几部主要著作，同时取材于法国反省哲学传统与生存现象学，反映了他对胡塞尔的研究（该研究在二战前已开始），以及对卡尔·雅斯贝尔斯、加布里埃尔·马塞尔、让-保罗·萨特和莫里斯·梅洛-庞蒂的研究。然而到 1960 年，利科已断定：要恰当地研究人的实在，尤其鉴于恶的存在，他必须以诠释学的解释工作来补充直接的现象学描述。这一转向导致他日益关注一种可以嫁接在现象学上的解释理论，他把这种方法称作诠释学现象学。对一种诠释学现象学来说，意义产生于并且通过我们使用语言来谈论自己活的经验而产生。哲学语言及其范畴追求清晰而单义的概念，自然语言却是多义的：它可以有多个意义、多种译法，所以语言的大多数用法都需要解释。他借由话语哲学承接了这一洞见，而那套话语哲学，是他对自己哲学中日益重视语言这一点加以发展的结果。利科思想中的这次诠释学转向或语言转向，并不要求他放弃早先研究的基本成果，但确实使他更清楚地看到这些成果的更广泛意涵。它导致人们日益强调我们生活在时间中、生活在历史中这一事实。他晚期的著作也反映出对个人层面以及社会与政治层面伦理问题的更多关切，由此写出关于公正理念的论文集，以及最后一本讨论相互承认之可能与和平状态的著作。
    step2: |-
      在构建这套“有能力的人”的人类学的过程中，利科的方法论有过几次重大转向：有时是为回应思想环境的变化，有时反过来挑战自己原有的进路，有时则是为回应已刊著作中冒出来、或尚未得到充分处理的问题。他早年的学术训练出自法国的反省哲学传统；这一传统从反省意识的活的经验出发——也就是从我们意识到自己存在着、思维着、行动着出发——追问“我”如何察觉到自身的思想与行动。对反省意识的这份关注，一直是组织利科思想的一条线索。他二战后最早几部主要著作，同时取资于法国反省哲学传统与生存现象学，反映出他对胡塞尔的研究（这项工作早在二战前便已开始），也反映出他对雅斯贝尔斯、马塞尔、萨特与梅洛-庞蒂的研究。但到 1960 年，利科已经断定：要恰当地研究人的实在，尤其是考虑到恶的存在，单有直接的现象学描述并不够，还得补上诠释学的解释工作。这一转使他日益专注于一种能够嫁接在现象学上的解释理论，他把这条进路称作诠释学现象学。在诠释学现象学看来，意义就发生在我们用语言谈论自身活的经验之时，并且经由这种谈论而发生。哲学语言及其范畴追求清晰、单义的概念，自然语言却天生多义：一句话可以有几种意思、几种译法，因此语言的大部分用法都要求解释。他把自己哲学中日益重视语言这一点展开为话语哲学，上述洞见正是经由话语哲学承接下来的。这次诠释学转向（同时也是语言转向）并不要求他否弃早期研究的基本成果，却让他更清楚地看到这些成果的更广意涵：他由此越来越强调一个事实——我们生活在时间之中，也生活在历史之中。他晚年的著作还显出对伦理问题的更大关切，个人、社会与政治三个层面皆有，于是有了讨论公正理念的几篇论文，也有了那部探讨相互承认如何可能、和平状态如何可能的绝笔之作。
