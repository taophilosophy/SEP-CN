      Political discourse is a particularly fragile form of extended discourse since the political dimension of human existence is one realm among others like commerce or the arts and also the one that contains all the others. It is an especially rhetorical form of discourse in the sense of being discourse that aims at persuasion. Persuasion is necessary because there is no final resolution of the conflicts that can arise over questions about the best form of government or whether there should be, say, a law, what that law ought to be, or whether laws are required in this case at all. That politics also is about power, the power to make decisions and command others adds to the fragility of such discourse in that politics is always based on a revocable willingness to live together. This leads to a dialectic of ideology and utopia in Ricoeur’s political philosophy. Ideologies both claim to legitimate the positions of those in power or those seeking power and cover the gap between what they assert and the way things actually are. Utopian thinking, in return, imagines a world without or beyond ideology. It sometimes enables people to overthrow particularly ruinous forms of ideology, only to fall back into a dependence on ideology since utopia exists “nowhere”. Yet politics is necessary because it makes possible life together. That it always takes place between these two poles of ideology and utopia is another example of a mediating term between opposed poles in Ricoeur’s hermeneutics.
    step1: |-
      政治话语是扩展话语中一种格外脆弱的形式，因为人的存在的政治维度是与商业或艺术等并列的一个领域，同时也是包含其他一切领域的领域。它是一种尤其带修辞性的话语，即旨在说服的话语。说服之所以必要，是因为在诸如最佳政体形式为何、是否应当有某项法律、该项法律应当是什么、乃至此处是否根本需要法律等问题上可能发生的冲突，无法得到最终解决。政治还关乎权力，即作决定与命令他人的权力，这又加重此类话语的脆弱性：政治总基于一种可撤回的共同生活意愿。这引出利科政治哲学中意识形态与乌托邦的辩证法。意识形态既声称使当权者或谋权者的位置合法化，又掩盖它们所断言的东西与事情实际所是之间的差距。乌托邦思想则反过来想象一个没有意识形态或超越意识形态的世界。它有时使人得以推翻格外有害的意识形态形式，结果却又落回对意识形态的依赖，因为乌托邦存在于“无处”。然而政治是必要的，因为它使共同生活成为可能。政治总在意识形态与乌托邦这两极之间发生，这是利科诠释学中对立两极之间有一个中介项的另一例。
