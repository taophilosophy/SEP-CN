      Narrative discourse is another form of extended discourse investigated by Ricoeur. It is a use of language that allows us to make practical sense of human action and time. Ordinary language already contains concepts that apply to action—those of intentions, motives, causes, reasons, acts, consequences, agents and patients, for example—just as it contains concepts applicable to time: past, present, future, now, then, when. Narrative discourse configures such heterogeneous concepts into a discourse that locates actions in a time where one thing happens not just after something else but because of something else in a followable story or history. It refigures physical events as narrative events, events which make sense because they tell what happens in a story or history. But because narratives have endings or must end, they never fully exhaust time or the possible long-term meaning of action. Through their plots they are always a synthesis of heterogeneous concepts into a kind of discordant concordance which configures the episodes of the story into a told story. In so doing they resolve practically if not theoretically the conflict between time understood as a lived now—this present which has a past and a future—and cosmic time conceived of as a sequence of points, where any point can be a now point defined not in terms of its past and future but merely in terms of points that come before and after it. Narrative interweaves these two perspectives on time into human time without ever fully resolving the aporias raised by thinking about time in time.
    step1: |-
      叙事话语是利科考察的另一种扩展话语。它是一种语言用法，让我们能对人的行动与时间获得实践上的理解。日常语言已经含有适用于行动的概念——例如意图、动机、原因、理由、行动、后果、行为者与受动者——正如它含有适用于时间的概念：过去、现在、未来、此时、彼时、当……时。叙事话语把这类异质概念构形为一种话语，把行动安置在一个时间里：在那里，一件事不仅在另一件事之后发生，而且由于另一件事而发生，构成一个可跟随的故事或历史。它把物理事件重新构形为叙事事件，即因其讲述故事或历史中所发生之事而变得可理解的事件。但叙事有结局、必须收束，所以它们从不完全穷尽时间，也不穷尽行动可能的长期意义。通过其情节，叙事总是把异质概念综合为一种不协调的协调，把故事的各个插曲构形为一个被讲述的故事。这样做时，它们实践上、而非理论上解决了这样一种冲突：一方是被理解为活的当下的时间——这个带有过去与未来的现在；另一方是被设想为点之序列的宇宙时间，其中任何一点都可是一个现在点，其规定不在过去与未来，而仅在先于与后于它的各点。叙事把这两种时间视角编织为人的时间，却从未完全解决在时间中思考时间所引出的种种疑难。
