      Ricoeur extends his account of freedom to take up the topic of evil in *Fallible* *Man* and *The Symbolism of Evil,* both published in 1960. These works address the question of how it is possible for us to misuse our freedom, a question that had been bracketed in the initial phenomenological volume. In *Fallible* *Man* he deploys a transcendental analysis to show that this possibility is grounded in the basic disproportion that characterizes human existence as located between the finite, perspectival nature of experience and the infinite, rational dimensions of taking up that experience in perception, practice, and feeling, leading to the concept of fallibility. This disproportion shows up in every aspect of human existence, from perceiving to feeling to thinking. It is evident in the human desire for possessions, power, and prestige. By reason of this disproportion, we are never wholly at one with ourselves and hence we are fallible. Yet the misuse of our freedom, evil, is neither original nor necessary; it is only a permanent possibility.
    step1: |-
      利科扩展了他关于自由的论述，在《易错的人》与《恶的象征》中处理恶的主题，二者均出版于 1960 年。这些著作讨论我们如何可能误用我们的自由，这个问题在最初那卷现象学著作中被括置起来。在《易错的人》中，他运用先验分析表明，这种可能性植根于人的存在所特有的基本不相称——人的存在处于经验的有限、视角性的本性与在知觉、实践与感受中承接该经验的无限、理性维度之间，由此引出易错性这一概念。这种不相称在人的存在的每个方面都显露出来，从知觉到感受到思维。它在人对占有、权力与声望的欲望中显而易见。由于这种不相称，我们从不与自身完全合一，因此我们是易错的。然而，对我们自由的误用，即恶，既非原初的，也非必然的；它只是一种恒久的可能性。
