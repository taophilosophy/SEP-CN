      All these threads in Ricoeur’s philosophy come together in Ricoeur’s last big book (*Memory,* *History,* *Forgetting*, 2004) pointing to the final revised lectures on recognition. This three part work first takes up the question of memory and recollection in response to questions about uses and abuses of memory in contemporary society. Ricoeur lists these as occurring on a pathological-therapeutic level as the problem of blocked memory; on a practical level as manipulated memory, and on an ethical-political level as obligated memory. He then asks whether history is a remedy for or a hindrance to these problems. This leads him back to the question of the epistemology of historical research and writing, a topic he already had addressed in *History and Truth* (1965) and *Time and Narrative*. Now the question is to what extent history depends on memory. Historians know more about the past than individuals remember, but can history completely break with an appeal to memory as a kind of testimony? I was there, believe me. The problem here is suspicion not simply falsification. What is new to Ricoeur’s account is that he sees at work a closer tie between explanation and understanding than he had considered in his earlier work where explanation aids understanding. He now speaks of what he calls explanatory understanding. It runs through what, following the French historian Michel de Certeau, he now calls the historiographical operation that characterizes the whole process of historical documentation, research, and writing. This shift in Ricoeur’s thinking leads him to consider the question of historical representation as an image based on both narration and rhetoric. History as written, he suggests, “stands for” the past as “having been”.
    step1: |-
      利科哲学中的这些线索，都汇聚到他最后一本大书（《记忆、历史、遗忘》，2004）之中，并指向最后那批经修订的论承认的讲演。这部三部分之作首先接手记忆与回忆问题，以回应当代社会中对记忆之使用与滥用的种种疑问。利科把它们列为：在病理—治疗层面上，是受阻的记忆问题；在实践层面上，是被操纵的记忆；在伦理—政治层面上，是受义务约束的记忆。随后他问：历史是对这些问题的补救，还是障碍？这把他带回历史研究与历史写作的认识论问题，一个他已在《历史与真理》（1965）与《时间与叙事》中处理过的题目。现在的问题是：历史在多大程度上依赖记忆？历史学家对过去的了解多于个人所记得的，但历史能否完全断绝与作为一种见证的记忆的关联？我当时在场，请相信我。这里的问题不只是伪造，而是怀疑。利科论述中的新意在于，他看到解释与理解之间有一种比其早期著作所设想的更紧密的关联——在早期著作中，解释辅助理解。他现在谈到他所谓的解释性理解。它贯穿于他——随法国历史学家米歇尔·德·塞托——此时所称的历史编纂操作，这一操作刻画了历史文献整理、研究与写作的全过程。利科思想的这一转变，使他考察历史表现的问题，即把历史表现视为一种既基于叙述又基于修辞的形象。他提出，成文的历史“代表”作为“曾经存在”的过去。
