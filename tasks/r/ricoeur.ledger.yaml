      这一批判见于《解释的冲突》（1969）所收的论文，也见于利科对弗洛伊德的详尽哲学解读《弗洛伊德与哲学》（1970）。据利科说，弗洛伊德自己的哲学到头来是一种主体的考古学，意在提供一种文化理论（文明及其不满），但它缺少所需的那种与之相应的主体目的论，而唯有后者才容许人的创造力与“有能力的人”。这些研究强化了利科的观点：不存在无中介的自我理解；这导致他的著作转向一种更具辩证性的方法。这是一种进路，他借它寻找能在两个对立项之间起中介作用、并使我们能在二者之间往返的中间项。中介项带来增进的理解。这种理解总是通过解释而发生，却仍然对批判开放。换言之，对利科来说，诠释学是一种起中介与协商作用的方法，而非消除解释冲突的方法。
