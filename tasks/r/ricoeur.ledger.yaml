      Ricoeur’s investigation of practices of interpretation did not propose a single general theory applicable in each and every case. His approach was rather to formulate his theory of discourse as a use of language meant to say something to someone about something using examples of such discourse and their interpretation. But spoken language is ephemeral; it disappears. Ricoeur’s genial insight was to turn to examples that fixed such discourse by inscribing it in texts or what might be treated as analogous to a text. The event of speaking might disappear, but the text remains for anyone who knows how to read. Hence it is the meaning of the text rather than the original author’s intention or the originating situation that becomes the object of interpretation. Structuralism was correct that texts have a structure. But this structure varies depending on the kind of discourse inscribed in the text, so discerning that structure and how it contributes to shaping that discourse helps one identify the discourse as being of a certain type or genre. Initially recognizing this genre is something like a guess that has to be confirmed through interpreting the text, but a good reading also opens interpreters to being questioned about their initial assumptions by the text in question. What one discovers through such investigations, Ricoeur believed, is that there is something like a world of the text that lies not behind the text but metaphorically in front of it as something to be explored by the interpreter’s imagination. This is a world that we can think of ourselves as inhabiting. Interpretations, of course, need to be checked against and challenged by other interpretations, and they will sooner or later need to be redone as situations change over time. So there is a possibility of both internal and external critique: is a text coherent in terms of its generic form, can it be confirmed or falsified by other similar documents or subsequent data? Explanatory techniques also play a role, particularly when understanding breaks down. In a nice turn of phrase, Ricoeur liked to say one then seeks to explain more in order to understand better. He also agreed with Hans-Georg Gadamer’s theory of hermeneutics that what is finally at stake in interpretation is a kind of appropriation, although Ricoeur saw this as more oriented to action in the present than to what Gadamer called the appropriation of tradition, although tradition always did have a role to play, even when criticized or rejected.
    step1: |-
      利科对解释实践的探究，并未提出一种适用于每一场合的单一普遍理论。他的做法毋宁是：以这类话语及其解释为例，制定一种把语言当作“意在向某人就某事说些什么”的用法的理论。但口头语言是短暂的，它会消失。利科的天才洞见在于转向那些把此类话语固定下来的例子——将其铭刻在文本中，或铭刻在可被当作类似文本的东西中。说话的事件可能消失，但文本为任何会读的人留存下来。因此，成为解释对象的，是文本的意义，而不是原作者的意图或原初情境。结构主义认为文本有结构，这是对的。但这种结构随铭刻在文本中的话语类型而变化，所以辨认该结构、以及它如何参与塑造该话语，有助于把该话语识别为某种类型或体裁。最初辨认出这一体裁，有点像一种猜测，它必须通过对文本的解释得到确认；但好的阅读也让解释者面对这样的可能：所读的文本会就他们最初的假定向他们提出质疑。利科相信，通过这类探究所发现的，是某种类似“文本的世界”的东西：它不在文本背后，而是隐喻性地在文本前面，作为有待解释者想象去探索的东西。这是一个我们能把自己设想为栖居其中的世界。当然，解释需要与其他解释相互核对、彼此挑战，而且随着情境随时间变化，这些解释迟早需要重做。所以，内部批判与外部批判都有可能：一个文本就其体裁形式而言是否融贯？它能否被其他类似文献或后续数据证实或证伪？解释性技术也起作用，尤其当理解断裂之时。利科喜欢用一句妙语说：这时人们是为了理解得更好而力求解释得更多。他也同意伽达默尔的诠释学理论：解释最终关乎的是一种占有，不过利科认为，这种占有更朝向当下的行动，而不像伽达默尔所说的“对传统的占有”；当然，传统始终有它的作用，即便它遭到批判或拒斥。
    step2: |-
      利科探究解释实践，并不是要提出一套放之四海而皆准的普遍理论。他的做法是：以这类话语及其解释为实例，来制定一种理论，把语言视为“某人向某人就某事说些什么”的用法。可口头语言转瞬即逝，说过就没了。利科的过人之处，在于转向那些把话语固定下来的例子——把它铭刻进文本，或铭刻进可以当作文本看待的东西。说话的事件会消失，文本却留下来，任何会读的人都能读到。于是成为解释对象的，是文本的意义，而不是原作者的意图或原初情境。结构主义说文本有结构，这话没错；但结构随文本所铭刻的话语类型而变，因此辨明这一结构以及它如何参与塑造话语，有助于断定该话语属于哪一类型、哪一体裁。起初认出体裁，近乎一种猜测，还得靠解释文本加以证实；而好的阅读还会反过来让文本质问解释者最初的假定。利科相信，这样探究下去会发现一种类似“文本的世界”的东西：它不在文本背后，而可以隐喻地说在文本前方，是解释者的想象有待探索的领域。这个世界，我们可以设想自己住在里面。解释当然要与其他解释相互核对、彼此挑战，时过境迁，迟早还要重做。因此内部批判与外部批判都少不了：文本依其体裁形式是否融贯？能否被别的同类文献或后来的数据证实或证伪？解释性技术同样有用，尤其当理解卡住的时候。利科有句妙语：这时人们是为了理解得更好，才力求解释得更多。他也赞同伽达默尔的诠释学理论：解释终究是一种占有；不过在他看来，这种占有更朝向当下的行动，而不像伽达默尔所说的那样是对传统的占有——当然，传统始终有一份作用，即便它遭到批判或拒斥。
