      On this basis, he can again ask about human existence as historical, as being within time and ultimately uncanny. He seeks particularly to address the problem of forgetting in relation to the three problems listed earlier. Traces of the past can be lost, and that past will be forgotten in the sense of being beyond memory. But what of forgetting where the traces remain? Here is where the problems of blocked, manipulated, or commanded memory remain, especially in the latter case with attempts to order forgetting either through amnesty or censorship. This problem leads to an epilogue on the possibility of forgiveness, something Ricoeur admits is left incomplete. Along the way though, he shows that the idea of guilt, historical guilt necessarily runs up against the limit of the imprescriptible and that forgiveness, which is difficult but not impossible, is something like a gift, one that unbinds the agent from the act. Beyond the distinction of a happy memory and an unhappy one in other words lies the possibility of a forgetting held in reserve. To forgive is not to forget. It is this idea of forgiveness as a gift, but not one requiring or expecting a gift in return but as something received and passed on as a second gift that leads the discussion of mutual recognition and states of peace in Ricoeur’s last book, *The Course of Recognition*.
    step1: |-
      在此基础上，他能再次追问人的存在作为历史性的存在、作为在时间之中并最终令人不安的存在。他尤其力求处理遗忘问题，与先前所列的三个问题相关联。过去的痕迹可能失落，那个过去将作为超出记忆之物而被遗忘。但痕迹犹在的遗忘又当如何？阻滞的、被操纵的或受命令的记忆的问题仍在这里，尤其在后一种情形中，人们试图通过大赦或审查来命令遗忘。这一问题引出一篇关于宽恕之可能的结语，利科承认这部分未完成。不过在途中，他表明：罪责、历史罪责的观念必然撞上不可追诉者的限度，而宽恕虽难却非不可能，它有点像一种礼物，使行为者与其行动松绑。换言之，在幸福记忆与不幸记忆的区分之外，还有被留置的遗忘之可能。宽恕并非遗忘。正是这种宽恕即礼物的观念——这礼物不要求也不期待回礼，而是被接受并作为第二份礼物传递下去——引出了利科最后一本书《承认的过程》中关于相互承认与和平状态的讨论。
