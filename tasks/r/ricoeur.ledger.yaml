      This critique is found in the essays collected in *The Conflict of Interpretations* (1969) and in Ricoeur’s detailed philosophical reading of Freud, *Freud and Philosophy* (1970). Freud’s own philosophy, according to Ricoeur, turns out to be an archaeology of the subject meant to provide at a theory of culture (civilization and its discontents), but it lacks the required corresponding teleology of the subject that would allow for human creativity and a capable human being. These investigations reinforced Ricoeur’s view that there is no unmediated self-understanding, leading to a turn to a more dialectical method in his work. This is an approach through which he seeks to find the middle term that can mediate between two polar terms and allow us to move back and forth between them. The mediating term leads to enhanced understanding. This understanding always comes about through interpretation but still remains open to critique. In other words, for Ricoeur hermeneutics is a method that mediates and negotiates rather than removes the conflict of interpretations.
