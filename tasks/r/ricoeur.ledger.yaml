    source: |-
      Ricoeur examined a number of different forms of extended discourse, beginning with metaphorical discourse. Like the talk about symbols he had explored earlier a live metaphor is a kind of discourse that says more than one thing at the same time. Live metaphors are the product of sentences, not the result of substituting one word for another for decorative or rhetorical effect. They presuppose a kind of odd predication, a “metaphorical twist”. Unlike propositions which say something is or is not the case, a live metaphor says “is” and “is not” at the same time, leading possibly to a redescription of reality. As creative instances of the use of language, live metaphors can die and be absorbed into the dictionary (a watch runs). Live metaphors can also extend beyond a single sentence as in the case of poetic discourse. Poetic discourse is thus a use of language that redescribes reality. Its truth is more a matter of manifestation than of coherence or correspondence with what is assumed to be external reality. In an important sense, this experienced truth is the basis for talk about coherence and correspondence, yet paradoxically metaphorical discourse always presupposes an already existing language that it can make use of. In this sense, we are never at the origin of language. We can question back toward this origin but never reach it, since we always must begin by making use of existing language to question language. Philosophers of the fullness of language therefore always begin as having already begun.
    step1: |-
      利科考察了扩展话语的若干不同形式，从隐喻话语开始。如同他早先探究过的关于象征的谈论，活的隐喻是一种同时说出不止一件事的话语。活的隐喻是句子的产物，而不是为装饰或修辞效果以一词替换另一词的结果。它们预设一种奇特的述谓，一种“隐喻的转折”。与说某事是或不是如此这般的命题不同，活的隐喻同时说“是”与“不是”，可能引出对实在的重新描述。作为语言使用的创造性实例，活的隐喻会死去，被吸收进词典（表会走）。活的隐喻也可超出单个句子，如诗性话语的情形。诗性话语因此是一种重新描述实在的语言用法。它的真更关乎显现，而非与被视为外部实在者相融贯或相符合。在一种重要的意义上，这一被经验到的真，才是谈论融贯与符合的基础；然而悖谬的是，隐喻话语总预设一种已经存在的语言，供它取用。在这个意义上，我们从不处在语言的起源处。我们可以朝这一起源追问，却永远到不了它，因为我们总必须以取用既存语言来追问语言为开端。因此，语言的充实之哲学家总是已经开始地开始。
