      At the end of his three volume study of narrative (*Time and Narrative*, 1984–88) Ricoeur realized that what was said there pointed to the importance of the idea of a narrative identity. This has to do not just with the identity of the characters in a story or history, but with the larger claim that personal identity in every case can be considered in terms of a narrative identity: what story does a person tell about his or her life, or what story do others tell about it? In effect, narrative identity is one of the ways in which we answer the question “who?” Who is this? Who said that? Did that? Who is that? Who are we? In his 1986 Gifford Lectures (published as *Oneself as Another*, 1992) Ricoeur expanded this investigation to the broader question of what it is to be a self. This discussion was meant to reply to interpretations of the Cartesian *cogito* which either made it too strong (one can immediately be in touch with the self as certain of itself) or too weak (a merely abstract truth) or even said the self does not exist. Against this latter idea of a “shattered cogito” Ricoeur proposed a hermeneutics of a “wounded cogito”. This was the idea and reality of a person capable of attesting to his or her own existence and acting in the world, a self that both acted and was acted upon who could recount and take responsibility for its actions. Insofar as we can speak metaphysically of such a self it has to be in terms of act and potentiality rather than substance.
    step1: |-
      在结束其三卷本研究叙事之作（《时间与叙事》，1984–88）之际，利科意识到，书中所说指向叙事同一性这一观念的重要性。这不仅关涉故事或历史中人物的同一性，还关涉一项更大的主张：任何情形下的个人同一性，都可以按叙事同一性来考察——一个人讲述关于自己生命的什么故事，或者别人讲述关于它的什么故事？实际上，叙事同一性是我们回答“谁？”这一问题的方式之一。这是谁？谁说了那话？做了那事？那是谁？我们是谁？在 1986 年的吉福德讲演中（出版为《作为一个他者的自身》，1992），利科把这一探究扩展到更宽的问题：成为自我究竟意味着什么。这番讨论意在回应那些把笛卡尔式 *cogito* 解释得要么太强（人可以直接与自我接触、对自身确信不疑）、要么太弱（只是一种抽象真理）、乃至宣称自我并不存在的解释。针对后一种“破碎的 *cogito*”观念，利科提出一种“受伤的 *cogito*”的诠释学。这是这样一种人的理念与实在：他能够见证自己的存在、并在世界中行动；这是一个既行动又被作用、能够叙述并为其行动负责的自我。就我们能在形而上学意义上谈论这样一个自我而言，那只能以活动与潜能、而非以实体的方式谈论。
