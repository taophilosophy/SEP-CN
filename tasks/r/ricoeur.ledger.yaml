      Ricoeur saw that this conception of the disproportion that characterizes human beings was insufficient to account for actual occurrence of a bad will and evil deeds. No direct, unmediated inspection of the cogito, like that he saw in Descartes and Husserl, can show why these evils, contingent as each of them is, in fact came to be. Recognizing the opacity of the cogito in this respect confirmed his belief that all self-understanding comes about only through “signs deposited in memory and imagination by the great literary traditions” (Ricoeur, “Intellectual Autobiography”, in Hahn 1995: 16)[^hahn-1995]. This conclusion was a major motivator for his hermeneutic and, at the same time, “linguistic turn”.
