    kind: body
    source: |-
      A major theme that runs through Ricoeur’s writings is that of a philosophical anthropology. Ricoeur came to formulate this in terms of the “capable human being”, which refers to the fundamental capabilities and vulnerabilities that human beings display in the activities that make up their lives and enable them to engage in responsible human action. Though the accent is always on the possibility of understanding human beings as agents responsible for their actions, Ricoeur consistently rejects any claim that the self is immediately transparent to itself or fully master of itself. Self-knowledge only comes through the experience of our relation to the world and of our life with and among others. But if that is the case, the puzzle is to explain to what extent, if at all, the self can be held accountable for its own thoughts and deeds.
    step1: |-
      贯穿利科著作的一个主要主题是哲学人类学。利科最终用“有能力的人”来表述它，这指的是人类在构成其生活的活动中所显示的基本能力与脆弱性，这些活动使他们能够参与负责任的人类行动。尽管重点始终在于把人理解为对其行动负责的行为者，利科一贯拒绝任何关于自我对本身直接透明或完全主宰自身的说法。自我认识只通过我们与世界之关系、以及我们与他人共同生活的经验而来。但若是如此，难题就在于说明：自我在多大程度上、或者究竟能否为其自身的思想与行为负责。
    step2: |-
      贯穿利科全部著作的一条主线，是一种哲学人类学。他最终把这一构想表述为“有能力的人”：人在构成其生活的种种活动中，既显出根本的能力，也显出根本的脆弱，而正是这些活动使人得以负起责任、采取行动。他固然始终把重心放在把人理解为对自身行动负责的行为者这一点上，却一贯拒绝另一种主张——仿佛自我对自己直接透明、能够完全主宰自己。自我认识只能通过两种经验获得：我们与世界之关系的经验，以及我们与他人共同生活、身处他人之中的经验。可若果真如此，难题便来了：自我究竟在多大程度上——甚至究竟能不能——为自己的思想与行为负责。
