      Ricoeur next explored the problem of how to account for the existence of evil and its possible solution in *The Symbolism of Evil*. There, he argued that we should consider how people have sought to come to terms with their inability to make sense of the existence of evil by using language that draws on the great symbols and myths that speak of its origin and end. This is language that conveys more than a single meaning, language that can always be understood in more than one way; hence it needs always to be interpreted. This study concluded by saying that philosophy must learn to make sense of such language and learn to think starting from it, something Ricoeur summed up in a famous phrase: “the symbol gives rise to thought” (*The Symbolism of Evil*, 1967: 247–57). If philosophy is to take seriously this lesson taught by reflection on the symbolism of evil, it has to take up the problem of the “fullness of language”. This means considering those uses of language that extend beyond a single word or sentence, as well as those which cannot be interpreted as simple logical propositions that say S is P. Like the primary symbols of evil stain, sin, and guilt—these are forms of discourse that can have more than one meaning. To make sense of the fullness of language, therefore, philosophy has to develop a theory of interpretation since actual discourse is not always, if ever univocal and its meanings do change over time when acts of discourse outlive the speakers and situations in which they were originally produced.
    step1: |-
      利科接下来在《恶的象征》中探讨如何解释恶的存在及其可能的解决。他在那里主张，我们应当考察人们如何借助那些谈论恶之起源与终结的伟大象征与神话的语言，来设法应对自己无力理解恶之存在这一处境。这是一种传达不止单一意义的语言，一种总能以不止一种方式被理解的语言；因此它总需要被解释。这项研究在结尾处说，哲学必须学会理解这样的语言，并学会从它出发来思考；利科用一句名言概括了这一点：“象征激发思考”（《恶的象征》，1967: 247–57）。如果哲学要认真对待反思恶的象征体系所教给它的这一课，它就必须承担“语言的充实”这一问题。这意味着要考察那些超出单个词或句子的语言用法，以及那些不能被解释为“S 是 P”这类简单逻辑命题的语言用法。如同恶的原初象征——污点、罪与罪责——这些都是可以具有不止一种意义的话语形式。因此，为了理解语言的充实，哲学必须发展一种解释理论，因为实际话语并不总是、甚至可能从来不是单义的；而且当话语行为比产生它们的说话者与情境活得更久时，其意义确实会随时间而改变。
    step2: |-
      利科接着在《恶的象征》里追问：恶的存在该怎么解释，又有没有解决的可能？他的主张是，我们该去看人怎样对付自己无力理解恶之存在这件事——办法是动用语言，借助那些讲述恶之起源与终结的伟大象征与神话。这类语言传达的从来不止一重意义，总能作不止一种理解，所以永远需要解释。这项研究在结尾提出：哲学必须学会理解这样的语言，并且学会从它出发去思考。利科用一句名言把这一点概括下来：“象征激发思考”（《恶的象征》，1967: 247–57）。哲学若要认真对待反思恶的象征所得的这一教训，就得接手“语言的充实”问题。这就要考察两类语言用法：一是超出单词、单句的用法，二是无法被解释成“S 是 P”之类简单逻辑命题的用法。恶的原初象征——污点、罪、罪责——正是这样一些话语形式，其意义可以不止一重。所以，要理解语言的充实，哲学非发展出一套解释理论不可：实际话语并不总是单义的（恐怕从来不是），而且话语行为一旦活得比说话者和原初情境更久，其意义就会随时间而变。
