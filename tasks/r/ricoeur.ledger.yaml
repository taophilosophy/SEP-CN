      In working out this theory of interpretation in terms of a theory of language as discourse, Ricoeur saw that what he now called the hermeneutic field to which interpretations applied was itself divided internally between an approach such as that used in *The* *Symbolism* *of* *Evil* which sought to recover meaning that was assumed to be already there and what he now called a hermeneutics of suspicion, like that found in Marx, Nietzsche and Freud, which held that nothing ultimately means what it first seems to say. The rise of structuralism in the 1960s and 70s, drawing on developments in linguistics, contributed to this emphasis on suspicion by holding that it was an underlying impersonal structure or structures that gave rise to the apparent surface meaning. Structuralism also introduced the idea that such underlying structures could provide a reductive explanation of any surface-level meaning. Ricoeur’s philosophical project therefore turned to showing that while structuralism could be incorporated as a method of inquiry—look for and learn from the proposed generative structures—it went astray when it proposed itself as a theory of objectivity without subjectivity, or what Ricoeur called a transcendental philosophy without a transcendental subject. Over time, he came to see that this limiting of structural analysis to a method of interpretation can be demonstrated by the fact that structuralists always presupposed the surface meaning they were trying to explain away. Moreover, because they ignored time and discarded any notion of change, because the deep structures they discovered were understood to be static and atemporal, they could not really account for how structures generated surface meanings, that is, how one structure could change into a different structure.
    step1: |-
      在把这种解释理论作为“语言即话语”的理论来制定的过程中，利科看出，他此时所谓的“解释所适用的诠释学场域”本身在内部是分裂的：一边是诸如《恶的象征》所用的那种进路，它力求恢复被假定已经在那里的意义；另一边是他此时所称的“怀疑的诠释学”，如马克思、尼采与弗洛伊德那里所见，它主张没有什么东西最终就是它初看所说的样子。1960 与 70 年代结构主义的兴起，借语言学的发展，助长了这种对怀疑的强调，因为它主张：正是某种（些）底层的非人格结构产生了表面的意义。结构主义还引入一个观念：这类底层结构可以为任何表层意义提供还原性解释。于是利科的哲学方案转向表明：结构主义可以作为一种探究方法被纳入——去寻找并学习它所提出的生成结构——但当它自荐为一种没有主体性的客观性理论，或利科所称的“没有先验主体的先验哲学”时，它就误入歧途了。随着时间推移，他逐渐看出，把结构分析限定为一种解释方法，可以由这样一个事实来证明：结构主义者总是预设了他们试图解释掉的那种表层意义。此外，由于他们无视时间、抛弃任何变化概念，由于他们所发现的深层结构被理解为静态的、无时间的，他们实际上无法说明结构如何生成表层意义，即一种结构如何能变成另一种不同的结构。
    step2: |-
      利科把解释理论建立在“语言即话语”的理论之上。在这个过程中他发现，他当时称为“诠释学场域”的那个解释适用范围，内部本身就是分裂的：一边是《恶的象征》所用的进路，力求恢复一种被假定早已在那里的意义；另一边是他此时称作“怀疑的诠释学”的东西，见于马克思、尼采与弗洛伊德，主张没有什么是最终如其初看上去那样的。1960 与 70 年代结构主义兴起，借语言学的新发展，给这种怀疑添了柴：按它的说法，产生表面意义的是某种（或某些）底层的、非人格的结构。结构主义还带来一个想法：这类底层结构足以对任何表层意义作出还原性解释。于是利科的哲学方案转而要表明：结构主义作为一种探究方法大可纳入——去找出它提出的生成结构并向它学习——可一旦它自荐为“没有主体性的客观性理论”，或利科所谓“没有先验主体的先验哲学”，就走偏了。久而久之，他看出把结构分析限定为一种解释方法，是有据可依的：结构主义者总是先预设了他们想解释掉的那种表面意义。再者，他们无视时间，抛弃变化概念，把他们发现的深层结构理解为静态的、超时间的，因而实际上说不清结构如何生成表面意义，也说不清一种结构如何变成另一种结构。
