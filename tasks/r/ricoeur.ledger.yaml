      Along the way to this conclusion Ricoeur introduces a key distinction between two kinds of identity in relation to selfhood. *Idem* identity is the identity of something that is always the same which never changes, *ipse* identity is sameness across and through change. Self-identity involves both dimensions: I am and am not the person I was ten years ago. It is the existence of *ipse* identity that indicates that a self is better thought of in terms of the question “who?” than in terms of the question “what” is a self.
