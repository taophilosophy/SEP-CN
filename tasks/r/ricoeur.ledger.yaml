      Ricoeur’s argument there starts from the surprising fact that there has been no recognized theory of recognition similar to what exists for theories of knowledge. In fact, when he looks in the dictionary he finds that the word (which in French carries as strong a sense of gratitude as of what English calls recognition) has numerous lexical senses. Ricoeur therefore proposes to construct a chain of conceptual meanings that runs from recognition in the active voice to its use in the passive voice, to being recognized. The demand for recognition that runs through this sequence can only be answered, he claims, by mutual recognition, “where this mutual recognition either remains an unfulfilled dream or requires procedures and institutions that elevate recognition beyond the friendship of face-to-face relations to the political plane” (*The Course of Recognition*, 19). This sequence of concepts of recognition runs from identifying something to identifying oneself to recognizing and being recognized by others. In the process the concept moves away from simply being identified with knowledge. Instead it opens the way to knowledge as it relates to self- knowledge and genuine community for which one is and can be grateful in that recognition “lightens the weight of obligation to give in return and reorients this toward a generosity equal to the one that led to the first gift [of being recognized]” (243).
    step1: |-
      利科在那里的论证，始于一个令人惊讶的事实：关于承认，并不存在像知识理论那样得到公认的理论。事实上，当他查阅词典时，他发现这个词（在法语中，它既强烈地意味着感激，也意味着英语所谓的承认）有众多词义。因此利科提议构造一条概念意义的链条，从主动语态的承认，到它在被动语态中的用法，即被承认。他主张，贯穿这一序列的承认要求，只能由相互承认来满足：“在这种相互承认中，要么仍是一个未实现的梦，要么则需要程序与制度，把承认提升到政治层面，超出面对面的友谊关系”（《承认的过程》，19）。这一承认概念的序列，从识别某物，到识别自身，再到承认他人并被他人承认。在此过程中，这一概念不再仅仅等同于知识。相反，它为知识开辟了道路，使知识关联于自我认识与真正的共同体；对此人应当、也能够心怀感激，因为承认“减轻了回赠义务的分量，并把这种义务重新引向一种慷慨，其程度与导致〔被承认的〕第一份礼物者相当”（243）。
    step2: |-
      利科在那里从一件怪事讲起：关于承认，竟没有一种像知识理论那样得到公认的理论。他翻词典，发现这个词（法语里它既有“承认”之义，也强烈地含有“感激”之意）词义繁多。于是他提议构造一条概念意义的链条：从主动语态的“承认”，走到被动语态的用法，即“被承认”。他主张，贯穿这一序列的承认诉求，只能由相互承认来回应：“在这种相互承认中，它要么仍是一场未竟的梦，要么就需要程序与制度，把承认从面对面的友谊抬升到政治层面”（《承认的过程》，19 页）。这条承认概念的序列，从识别某物，到识别自身，再到承认他人、被他人承认。一路下来，这一概念不再只是与知识等同，反而为知识开了路——通向自我认识，也通向真正的共同体；人对这样的承认应当、也能够心怀感激，因为承认“减轻了回赠义务的分量，并把这份义务重新引向一种慷慨，其分量与带来〔被承认这份〕第一份礼物者相当”（243 页）。
