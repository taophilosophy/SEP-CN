      Following his death in 2005, many new materials have been brought into publication. One signficant contribution is the collected fragments that were published under the heading of *Living Up To Death* (2009). These writings are of interest partly for their interweaving of memory and imagination with questions of death and the afterlife. They are of special interest to Ricoeur enthusiasts inasmuch as they offer a rare glimpse into his personal life, capturing his grieving over the loss of others as well as his struggles with his failing health and his own mortality. More recently, his *Lectures on Imagination* (2024), based on a course taught at the University of Chicago in the 1970s, have been published. This new volume fills an important gap in Ricoeur’s oeuvre. It provides a book length treatment of the productive imagination. Although the imagination was never the primary focus of his books, this new publication offers a reminder of its central importance. To track the theme of imagination throughout Ricoeur’s work allows one to find its most valuable insights and inspirations.
    step1: |-
      2005 年他去世后，许多新材料被付梓。一项重要贡献，是以《活着直到死亡》（2009）为题出版的札记汇编。这些文字之所以引人注目，部分在于它们把记忆与想象同死亡与身后问题交织在一起。它们对利科的爱好者尤有意味，因为它们难得地让人一窥他的个人生活，捕捉到他对失去他人的哀伤，以及他与每况愈下的健康和自身必死性的挣扎。更晚近的是，他在 1970 年代于芝加哥大学讲授的一门课程为基础的《想象力讲座》（2024）已经出版。这一新卷填补了利科著作中的一个重要空白。它提供了对生产性想象的整本书篇幅的处理。尽管想象从未是他著作的首要焦点，这一新出版物却提醒人们它的核心重要性。追踪想象这一主题贯穿利科的全部著作，能让人找到其最有价值的洞见与灵感。
