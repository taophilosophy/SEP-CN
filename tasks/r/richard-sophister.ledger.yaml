      A complete answer to these questions would require not only a detailed examination of the use of this distinction in the resolution of sophisms in the *Abstractiones*, but also an examination of Richard’s position regarding terms that “assert non-being” and his account of negation and negatives generally.[^note-15] These tasks are clearly beyond the scope of this essay. With respect to the first question, it will have to suffice to record here that there are only three places in the *Abstractiones* where Richard employs the distinction in the resolution of sophisms and in none of these is it clear that this is his favored solution.[^note-16] More importantly, Richard’s use of the distinction in the resolution of sophisms seems to match the use made of the same distinction (under the terminology “*esse habituale*/*esse actuale*”) by William of Sherwood, that is, as essentially a way of marking a distinction between hypothetical and categorical propositions.[^note-17] It has been successfully argued by Braakhuis that the attacks of Roger Bacon do not apply to William’s use of the distinction, even though, of all the authors noted so far, only William’s terminology is exactly the same terminology used by Bacon.[^note-18] Thus, if the doctrine under attack by Bacon cannot be attributed to William, neither can it be attributed to Richard the Sophister. It appears, then, that Richard Rufus and Richard the Sophister cannot be identified, at least on the basis of these alleged doctrinal and terminological similarities.
    step1: |-
      要完整回答这些问题，不仅要详细考察 *Abstractiones* 在解答诡辩句时对这一区分的使用，还要考察理查德关于“断言非存在”的词项的立场，以及他关于否定与否定的词项的一般说明。[^note-15] 这些任务显然超出本文范围。关于第一个问题，这里只能记下这一点就够了：*Abstractiones* 中只有三处，理查德在解答诡辩句时运用了这一区分，而且这三处中没有任何一处清楚表明这是他偏好的解答。[^note-16] 更重要的是，理查德在解答诡辩句时对这一区分的运用，似乎与舍伍德的威廉（William of Sherwood）对同一区分的运用（以 “*esse habituale*／*esse actuale*” 的术语）相合，也就是说，基本上是标记假言命题与直言命题之间区别的一种方式。[^note-17] Braakhuis 已成功地论证，罗吉尔·培根的攻击不适用于威廉对这一区分的使用，尽管在迄今提到的所有作者中，唯有威廉的术语与培根所用术语完全相同。[^note-18] 这样一来，如果培根所攻击的学说不能归于威廉，那么它同样不能归于诡辩家理查德。于是看来，理查德·鲁弗斯与诡辩家理查德不能认定为同一人，至少凭这些所谓学说与术语上的类似不能。
    step2: |-
      要完整回答这些问题，不仅要详细考察 *Abstractiones* 解答诡辩句时对这一区分的使用，还要考察理查德对“断言非存在”的词项所持的立场，以及他关于否定和否定词项的一般说明。[^note-15] 这些任务显然超出本文范围。至于第一个问题，这里只能记下一件事：*Abstractiones* 中理查德在解答诡辩句时运用这一区分的地方只有三处，而且没有一处可以清楚认定这是他偏好的解答。[^note-16] 更重要的是，理查德在解答诡辩句时对这一区分的运用，似乎与舍伍德的威廉（William of Sherwood）的用法相合；威廉所用的是同一区分（术语作 “*esse habituale*／*esse actuale*”），基本上是借它标记假言命题与直言命题之别。[^note-17] Braakhuis 已经成功地论证，罗吉尔·培根的攻击并不适用于威廉对这一区分的使用，尽管在上述所有作者中，唯有威廉的术语与培根的术语完全相同。[^note-18] 于是，如果培根所攻击的学说不能归于威廉，它同样不能归于诡辩家理查德。看来，理查德·鲁弗斯与诡辩家理查德不能认定为同一人——至少凭这些所谓的学说与术语上的类似不能。
