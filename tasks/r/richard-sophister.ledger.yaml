      [^note-16]: These are in connection with the following sophisms: (1) OMNE COLORATUM EST: The distinction is introduced as a way of explaining a perceived mistake in one of the arguments in the disproof of the sophism, i.e., “*Omne coloratum est. Omne album est coloratum. Ergo omne album est*”. It is said that this argument equivocates upon “*esse*”, for in the first premiss it is “*esse operatio entis*”, whereas in the second it is “*esse habitudinis sive consequentiae*”. Richard goes on to interpret the former categorically, the latter hypothetically. Ockham’s criticisms (noted above) seem relevant here in that equivocation is a semantic fallacy, whereas the propositional distinction is essentially syntactic. As Ockham notes, any proposition can be turned into one or the other. The important observation, however, is that Richard is not adopting the distinction as a favored solution to the sophism itself, but only as what some people say about a mistake in the disproof of an argument. (2) OMNIS HOMO DE NECESSITATE EST ANIMAL: Here too he offers multiple solutions to the sophism, the second of which is again to note the fallacy of equivocation in connection with “*esse*”, as above. Here, however, it seems clear that this is not his favored solution to the sophism. Rather he argues the sophism is best solved through application of the composite and divided senses of “*necessitas*”. (3) OMNIS ASINUS EST HOMO: Here the distinction is offered again as an explanation of a kind of equivocation between two premises of the argument, as in: “*Omne animal est homo. Omnis asinus est animal. Ergo omnis asinus est homo*”.
    step1: |-
      [^note-16]: 这些地方与以下诡辩句有关：(1) OMNE COLORATUM EST：这一区分被引入，是为了解释该诡辩句的反驳中某个论证里一个被认为的错误，即 “*Omne coloratum est. Omne album est coloratum. Ergo omne album est*”。据说这个论证在 “*esse*” 上有歧义：在第一个前提里它是 “*esse operatio entis*”，而在第二个前提里它是 “*esse habitudinis sive consequentiae*”。理查德接着把前者按直言的方式理解，把后者按假言的方式理解。奥卡姆的批评（见前注）在此似乎切题，因为歧义是语义谬误，而命题类型的区分本质上是句法的。正如奥卡姆所指出的，任何命题都可以变成这一种或那一种。然而重要的观察是：理查德并没有把这一区分当作他对该诡辩句本身偏好的解答，而只是把它当作某些人关于反驳中一个论证之错误的说法。(2) OMNIS HOMO DE NECESSITATE EST ANIMAL：这里他同样给出多个解答，其中第二个又是注意到与 “*esse*” 相关的语词歧义谬误，如前。但这里似乎清楚，这并不是他对该诡辩句偏好的解答；他主张这条诡辩句最好通过应用 “*necessitas*” 的组合与拆分意义来解答。(3) OMNIS ASINUS EST HOMO：这里这一区分再次被提出来，用以解释论证的两个前提之间的某种歧义，如：“*Omne animal est homo. Omnis asinus est animal. Ergo omnis asinus est homo*”。
    step2: |-
      [^note-16]: 这些地方与下列诡辩句有关：(1) OMNE COLORATUM EST：引入这一区分，是为了解释该诡辩句反驳中某个论证的一个被认为的错误，即 “*Omne coloratum est. Omne album est coloratum. Ergo omne album est*”。据说这个论证在 “*esse*” 上有歧义：第一个前提里是 “*esse operatio entis*”，第二个前提里则是 “*esse habitudinis sive consequentiae*”。理查德接着把前者按直言命题理解，把后者按假言命题理解。奥卡姆的批评（见前注）在此似乎切中要害：歧义是语义谬误，而命题类型的区分本质上是句法层面的。正如奥卡姆所说，任何命题都可以变成这两种之一。然而重要的观察是：理查德并没有把这一区分当作他本人对该诡辩句偏好的解答，而只是把它当作某些人对反驳中一个论证之错误的说法。(2) OMNIS HOMO DE NECESSITATE EST ANIMAL：这里他同样给出多个解答，第二个解答又是注意与 “*esse*” 相关的语词歧义谬误，如前。但这里似乎清楚，这并不是他偏好的解答；他主张这条诡辩句最好通过应用 “*necessitas*” 的组合与拆分意义来解答。(3) OMNIS ASINUS EST HOMO：这里这一区分再次被提出来，用以解释论证两个前提之间的某种歧义，如：“*Omne animal est homo. Omnis asinus est animal. Ergo omnis asinus est homo*”。
