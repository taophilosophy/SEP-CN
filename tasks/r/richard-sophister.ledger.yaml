    source: |-
      Richard the Sophister (Richardus Sophista) was an English philosopher/logician who studied at Oxford most likely sometime during the second quarter of the thirteenth century. Richard’s identity is uncertain, but he is known to be the author of a collection of logically puzzling sentences, sometimes called “sophisms”, entitled *Abstractiones*. The puzzling aspect of these sophisms is variously caused by semantic or syntactic ambiguities involved in certain logical or “syncategorematic” words such as “all”, “every”, “or”, “if…then”, “and”, “not”, “begins”, “ceases”, “except”, “necessary”, “possible”, etc.
    step1: |-
      诡辩家理查德（Richard the Sophister；Richardus Sophista）是一位英国哲学家／逻辑学家，最可能是在十三世纪第二个二十五年间的某个时候在牛津求学的。理查德的身份尚不确定，但已知他是一部名为 *Abstractiones* 的书的作者；该书汇集了一批逻辑上令人困惑的句子，这些句子有时被称为“诡辩句”。这些诡辩句令人困惑的一面，其成因各式各样，都来自某些逻辑词或“非范畴词”所含的语义或句法歧义，例如 “all”、“every”、“or”、“if…then”、“and”、“not”、“begins”、“ceases”、“except”、“necessary”、“possible” 等等。
    step2: |-
      诡辩家理查德（Richard the Sophister；Richardus Sophista）是一位英国哲学家／逻辑学家，最可能在十三世纪第二个二十五年间的某个时候于牛津求学。其身份尚不确定，但可以确定他是 *Abstractiones* 一书的作者——这部书汇集了一批逻辑上令人困惑的句子，人称“诡辩句”。这些诡辩句之所以令人困惑，缘由各式各样，都出在某些逻辑词或“非范畴词”带来的语义或句法歧义上，例如 “all”、“every”、“or”、“if…then”、“and”、“not”、“begins”、“ceases”、“except”、“necessary”、“possible” 等等。
