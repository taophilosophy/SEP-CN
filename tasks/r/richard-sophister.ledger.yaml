    source: |-
      Richard the Sophister (Richardus Sophista) was an English philosopher/logician who studied at Oxford most likely sometime during the second quarter of the thirteenth century. Richard’s identity is uncertain, but he is known to be the author of a collection of logically puzzling sentences, sometimes called “sophisms”, entitled *Abstractiones*. The puzzling aspect of these sophisms is variously caused by semantic or syntactic ambiguities involved in certain logical or “syncategorematic” words such as “all”, “every”, “or”, “if…then”, “and”, “not”, “begins”, “ceases”, “except”, “necessary”, “possible”, etc.
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      ## 1. *Abstractiones*
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      The title “*Abstractiones*” was apparently meant to capture the “excerpted” nature of this collection of sophisms that are presented in a somewhat summary fashion.[^note-1] This collection of sophisms became a kind of logical textbook used to teach students to identify sophistical fallacies. This book was probably used in several medieval universities for several decades, from the late thirteenth well into the fourteenth centuries. Richard is often referred to as “Magister Abstractionum” or “Magister Richardus Sophista” to give emphasis to the masterful, albeit summary, treatment of a very large collection of over three hundred such sophism sentences.[^note-2] The title “*sophista*” simply meant “logician”.
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      The seven known manuscripts of the *Abstractiones* date from the late thirteenth to the early fourteenth centuries:[^note-3]
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      > Ms B = Brugge, Stedelike Bibliotheek, 497 Ms C = Oxford, Corpus Christi College, E 293B Ms D = Oxford, Bodleian Library, Digby 24 Ms K = København, Det Kongelige Bibliotek, Fragm.1075 Ms O = Oxford, Bodleian Library, Digby 2 Ms P = Paris, Bibliothèque Nationale lat. 14069 Ms R = London, British Library, Royal 12.F.xix
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      Only two of these manuscripts (B, D) are complete; the remaining five are in varying degrees of fragmentation. Two manuscripts (O, R) appear to be derivative texts, or redactions, of the *Abstractiones*.
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      The dating of the composition of the *Abstractiones* appears to have been around the 1230s or 40s. Earliest references to the *Abstractiones* appear from the late thirteenth century in a manuscript at Worcester Cathedral Library, Q. 13, which is confidently dated no later than 1295, and probably as early as 1270.[^note-4] Worcester Q. 13 contains four references to the “Magister Abstractionum.” Another reference to the *Abstractiones* can be found in a Quodlibetal Question of William of Alnwick, “Does God know infinitely many things (*Utrum Deus cognoscat infinita)*?”, q. 9 probably dating from around 1320. Walter Burley’s tract, *De Exceptivis*, edited by L. M. de Rijk, contains a reference to the Magister Abstractionum.[^note-5] An interesting reference can also be found in William of Ockham’s *Summa Logicae* and additional references can be found in Ps. Richard of Campsall, John of Reading and Adam Wodeham.[^note-6]
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      The fact of the existence of two derivative texts of the *Abstractiones* as well as the numerous known references by accomplished logicians some seventy years after its composition indicate that the *Abstractiones* was a quite popular book that survived the test of time. Although as compared to sophism literature of the fourteenth century Richard’s analysis of sophisms appears somewhat unsophisticated, as compared to treatments of sophisms of his contemporaries Richard’s analyses are qualitatively similar. Richard’s greatest accomplishment lay, perhaps, in his ability to encapsulate and summarize a huge number of such logical puzzles, presenting for the student a handy reference book filled with examples of a host of logical fallacies.
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      An edition of Richard’s *Abstractiones* finally appeared in 2016, edited by Sten Ebbesen, Mary Sirridge, and E. Jennifer Ashworth, published by Oxford University Press in the series *Auctores Britannici Medii Aevi*.
