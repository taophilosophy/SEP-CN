      为了让读者更好地理解 *Abstractiones* 这本书的内容，列出书中讨论的几条诡辩句作为例子，并只就其中一条说明理查德的处理方式，也许会有帮助。如前所述，我们这本书包含三百多条诡辩句。随机取样包括这些例子：
    step2: |-
      为了让读者更好地了解 *Abstractiones* 一书的内容，不妨列出书中讨论的几条诡辩句，并只就其中一条展示理查德的处理方式。如前所述，我们这本书包含三百多条诡辩句。随机取样如下：
