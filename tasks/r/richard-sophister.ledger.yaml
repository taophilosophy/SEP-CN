      ## 2. Examples of Sophisms
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      In order to give the reader a better understanding of the content of this book of *Abstractiones*, it might be helpful to list a few examples of the sophism sentences discussed in it and to illustrate Richard’s treatment of just one of these. As noted above, our book contains over three hundred sophism sentences. A random sampling includes these examples:
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      > (1) Every man is every man (*Omnis homo est omnis homo*)
      >
      > (16) Whatever exists or does not exist exists (*Quicquid est vel non est est*)
      >
      > (39) Everything other than an animal which plus Socrates are two differs from Socrates (*Omne aliud quam animal quod et Sortes sunt duo differt a Sorte*)
      >
      > (79) The whole Socrates is less than Socrates (*Totus Sortes est minor Sorte*)
      >
      > (96) If you know that you are a stone you do not know that you are a stone (*Si tu scis te esse lapidem tu non scis te esse lapidem*)
      >
      > (157) Nothing is true about nothing (*De nihilo nihil est verum*)
      >
      > (187) You have not ceased to eat iron (*Tu non cessas comedere ferrum*)
      >
      > (215) All ten except one are nine (*Omnia X praeter unum sunt IX*)
      >
      > (278) It is impossible that you know more than you know (*Impossibile est te scire plura quam scis*)
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      From the above rather small list of sophisms, it can already be noticed that some sentences are more complex, and thus more logically puzzling, than others. Some sentences do not seem puzzling in themselves at all, but become puzzling only within a certain “context” that is set up within which arguments proving and disproving the sophism must be developed. Such a context was called a “*casus*”.[^note-7] It seems likely that the proving and disproving of the sophism sentence was done along the lines of a medieval oral “*disputatio*” within the classroom setting. This is the way Richard writes up his summaries: Proposal of the sophism, sometimes within a *casus*; arguments establishing the truth of the sentence; arguments establishing the falsity of the sentence; resolution of the sophism along with identification of the sophistical fallacy involved.
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      The very first sophism sentence treated is one of the least complicated (this sophism involves no *casus*):
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      > Every man is every man
      >
      > Proof: This man is this man, that man is that man and so forth for each individual man, therefore every man is every man.
      >
      > Another proof: No proposition is more true than one in which the same thing is predicated of the same thing….
      >
      > Disproof: This proposition is true, “some man is not every man” and, similarly, “no man is every man”; therefore it is false that every man is every man.
      >
      > Solution: The solution to the sophism is to note that “every man” is equivocal as to reference to every man taken singularly (as in “any man”) and as to every man taken as a whole (as in “all men”). Mixing the two senses of “every” from subject to predicate causes the logical puzzle.
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      As noted, this sophism sentence is relatively uncomplicated and it is easy to spot the obvious fallacy involved, but Richard’s text proceeds with increasingly more difficult and intricate sophism sentences, many of which engage the mind in complex mental acrobatics. The fallacies noted throughout are the standard ones discussed in Aristotle’s *De Sophisticis Elenchis*: the fallacy of equivocation; the fallacy of accident; the fallacy of the composite and divided senses; the fallacy of the consequent; the fallacy of absolute and qualified senses; the fallacy of many causes of truth; amphiboly; improper supposition.
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      ## 3. Richard’s Identity
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      There is still no certainty as to the identity of the Magister Abstractionum. Because of the colophon appended to the two complete manuscripts of the *Abstractiones*, we know, of course, that his name was “Richard”:
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      > Expliciunt ista, quae tu, Ricarde Sophista, fecesti, morum flos et doctor logicorum. Dirige scribentis, Spiritus alme, manum. Expliciunt Abstractiones. (Digby 24, f.90rb)
      >
      > (These [sophisms] are complete, which you, Richard the Sophister, Flower of virtue and teacher of logic, have produced. Turn the scribe’s hand [from its task], nurturing Spirit. The *Abstractiones* are complete.)
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      De Rijk suggested the name Richard Fishacre, disagreeing with the suggestion of Richard Fitz-Ralph offered by Macray on the basis that the dating of the text within the second quarter of the thirteenth century is more consistent with Fishacre’s chronology.[^note-8] Jan Pinborg suggested the name Richard Rufus also on grounds that the dating of the *Abstractiones* is consistent with Rufus’ being at Oxford.[^note-9] It is generally assumed that the author is English. Pinborg offered one further bit of evidence for the name Richard Rufus in that there is some reason to think that certain doctrines of Richard Rufus, as criticised by Roger Bacon, are in the *Abstractiones*. The primary doctrine in question attributed to Richard Rufus and criticised by Roger Bacon is, in general terms, that the signification of a name can remain in the absence of any actual thing signified by that name, although, as Bacon suggests, the proponents of this view must supply some kind of “habitual being” for the lost actual significate of such names. It is this doctrine of the “*esse habituale*” that Bacon finds objectionable. That Richard Rufus does seem to have such a doctrine appears clear in his discussion of the question “Whether Christ while three days in the tomb was a man” (“*Utrum Christus in triduo mortis fuerit homo*”) in distinction 22, book III of his *Sentences Commentary*.[^note-10]
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      It would be beyond the scope of this essay to deal with the complexities of both Richard Rufus’ treatment of this question as well as Roger Bacon’s voiceful criticisms of the notion of the “*esse habituale*.” The important question here is whether the doctrine espoused by Richard Rufus exactly parallels anything that can be found in the *Abstractiones* of Richard the Sophister. It is important to find not only terminological similarities but also doctrinal similarities. The terminology within which Richard Rufus makes the above noted distinction is “*esse in habitu*” versus “*esse in actu*”, the former he also labels “*esse simpliciter*”, the latter “*esse ut nunc*.”[^note-11] Bacon seems to substitute the expression “*esse habituale*” for the expression “*esse in habitu*.” Rufus does not use the expression “*esse habituale*.” As referenced above, Pinborg noticed the expressions “*esse consequentiae sive habitudinis*” and “*esse quod est operatio entis*” in the Abstractiones. Bacon also uses the expression “*esse habitudinis*”, but he seems to recognize a distinction between “*esse habituale*” and “*esse habitudinis*”; the latter, he says, “is used about propositions and will be destroyed later when there is talk about propositions.”[^note-12] This remark might indicate that Bacon finds the same doctrinal problem with the “*esse habitudinis*” that he finds with the “*esse habituale*” (i.e., it introduces a foil for some kind of fictive being), but we cannot be certain of this, since he never returned to this topic in the Compendium. Richardus Sophista does not use the terminology of “*esse habituale*/*esse actuale*”, “*esse in habitu/esse in actu*” that we find in Bacon and Rufus respectively.[^note-13] Pinborg also noted that William of Ockham criticizes those who make the distinction between “*esse consequentiae sive habitudinis*” and “*esse quod est operatio entis*” as ignorant of the simple distinction between hypothetical and categorical propositions, which according to Ockham is all that the distincition amounts to.[^note-14] Pinborg sees Ockham’s criticism as possibly making the same point as Bacon, i.e., the terminology invites some kind of talk of fictive being. Although Ockham is probably right to want to eliminate the old terminology in favor of less problematic language, the important questions are whether Richard the Sophister’s use of the distinction “*esse habitudinis*/*esse quod est operatio entis*” entails anything other than a distinction between types of propositions and whether his use of the distinction comes under the attacks of Roger Bacon on the same way in which these attacks seem relevant to a terminologically similar distinction in Richard Rufus.
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      A complete answer to these questions would require not only a detailed examination of the use of this distinction in the resolution of sophisms in the *Abstractiones*, but also an examination of Richard’s position regarding terms that “assert non-being” and his account of negation and negatives generally.[^note-15] These tasks are clearly beyond the scope of this essay. With respect to the first question, it will have to suffice to record here that there are only three places in the *Abstractiones* where Richard employs the distinction in the resolution of sophisms and in none of these is it clear that this is his favored solution.[^note-16] More importantly, Richard’s use of the distinction in the resolution of sophisms seems to match the use made of the same distinction (under the terminology “*esse habituale*/*esse actuale*”) by William of Sherwood, that is, as essentially a way of marking a distinction between hypothetical and categorical propositions.[^note-17] It has been successfully argued by Braakhuis that the attacks of Roger Bacon do not apply to William’s use of the distinction, even though, of all the authors noted so far, only William’s terminology is exactly the same terminology used by Bacon.[^note-18] Thus, if the doctrine under attack by Bacon cannot be attributed to William, neither can it be attributed to Richard the Sophister. It appears, then, that Richard Rufus and Richard the Sophister cannot be identified, at least on the basis of these alleged doctrinal and terminological similarities.
    step1: TBD
    step2: TBD
