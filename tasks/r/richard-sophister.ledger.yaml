    kind: body
    source: |-
      From the above rather small list of sophisms, it can already be noticed that some sentences are more complex, and thus more logically puzzling, than others. Some sentences do not seem puzzling in themselves at all, but become puzzling only within a certain “context” that is set up within which arguments proving and disproving the sophism must be developed. Such a context was called a “*casus*”.[^note-7] It seems likely that the proving and disproving of the sophism sentence was done along the lines of a medieval oral “*disputatio*” within the classroom setting. This is the way Richard writes up his summaries: Proposal of the sophism, sometimes within a *casus*; arguments establishing the truth of the sentence; arguments establishing the falsity of the sentence; resolution of the sophism along with identification of the sophistical fallacy involved.
    step1: |-
      从上面这份不长的诡辩句清单已经可以看出，有些句子比另一些更复杂，因而在逻辑上更令人困惑。有些句子本身似乎一点也不令人困惑，只有在某个被设定的“情境”之内才变得令人困惑，而证明与反驳该诡辩句的论证必须在这个情境之内展开。这样的情境被称为“*casus*”。[^note-7] 对诡辩句的证明与反驳，很可能是在课堂环境中、按照中世纪口头“*disputatio*”的方式进行的。理查德撰写他的概要的方式正是如此：提出诡辩句（有时置于一个 *casus* 之内）；确立句子为真的论证；确立句子为假的论证；解答诡辩句，并指明其中涉及的诡辩性谬误。
    step2: |-
      从上面这份不长的清单已可看出，有些句子比别的更复杂，因而逻辑上更令人困惑。有些句子本身毫无困惑可言，只有在某种“情境”之内才变得令人困惑——证明与反驳诡辩句的论证，都必须在这种情境之内展开。这样的情境称为“*casus*”（情形）。[^note-7] 对诡辩句的证明与反驳，多半是仿照中世纪课堂口头“*disputatio*”（辩论）的方式进行的。理查德的概要正是这样写成的：提出诡辩句（有时置于一个 *casus* 之中）；确立句子为真的论证；确立句子为假的论证；然后解答诡辩句，并指明其中涉及的诡辩性谬误。
