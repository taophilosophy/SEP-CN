      According to Reid, episodic memory is not a current apprehension of a past event, nor is it a current apprehension of a past experience. These theoretical options were ruled out by Reid’s criticism of Locke and Hume. Rather, according to Reid, memory is an act that preserves a past apprehension. As we will see below, memory preserves past apprehension by conceiving of an event previously apprehended and believing, of this event, that it happened to me.
