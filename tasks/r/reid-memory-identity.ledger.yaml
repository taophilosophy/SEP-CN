      The distinction also allows Reid to satisfy a constraint on any adequate theory of memory; namely, that it explain why memory represents events as having the special quality of being in the past. If belief were not an ingredient in episodic memory, then though we might *believe* that the events we remember are in the past, *memory* could not represent events as past. If belief were not an ingredient in memory, then memory alone would relate us to an event previously apprehended. But the apprehension preserved is an apprehension of an event that was, at that time, represented in that apprehension as present. The pastness of the event apprehended is not part of the content of the past apprehension. But because a belief that the event happened to me is embedded in the memory itself, memory represents not merely past events, but past events as having occurred. In other words, the belief that is partly constitutive of episodic memory is tensed. (For an alternative view on which the conception that is partly constitutive of memory is tensed, see Thorpe 2021.)[^thorpe-2021]
