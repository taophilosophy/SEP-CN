      Reid traces the target of his criticisms back to the Ancients, whom he depicts as holding that the mind is a sensorium—a repository of past ideas and impressions (*Essays*, 280).[^note-1] On this theory, perception, memory and imagination are causal processes beginning with purely physiological events: impressions on the brain. These physiological states are taken to have mental correlates—sensations or ideas of sense or sense impressions—which are the objects of perception, memory and imagination. These ideas or impressions are representations in the sense that they preserve, or re-present information from their physiological correlates. According to Reid, this view recognizes no distinction between imagination and memory. Each consists in having a picture-like impression that remains after the object that impressed upon the senses is gone. The only difference between the two is in the fidelity of the imagistic impression to its cause. Memory consists in the preservation of images imprinted in the mind from previous experiences, while imagination consists in constructing images that lack a duplicate in experience.
    step1: |-
      里德把他批评的靶子上溯到古人，他把古人描绘成主张心灵是一个感觉庭——过往观念与印象的储藏所（《人类心灵论文集》，280）。[^note-1]按这一理论，知觉、记忆与想象都是始于纯生理事件——大脑上的印记——的因果过程。这些生理状态被认定有心理对应物——感觉或感官观念或感官印象——它们是知觉、记忆与想象的对象。这些观念或印象之为表象，在于它们保存或重新呈现来自其生理对应物的信息。按里德的看法，这一观点不承认想象与记忆之间的任何区别。二者都在于拥有一个图画式的印记，它在外物印于感官之后仍然留存。二者之间的惟一差别，在于映像式印记对其原因的忠实程度。记忆在于保存先前经验印在心灵中的意象，而想象在于构造在经验中没有对应物的意象。
    step2: |-
      里德把批评的靶子上溯至古人——他把古人描绘成主张心灵是一个感觉庭（sensorium），即过往观念与印象的储藏所（《人类心灵论文集》，280）[^note-1]。按这一理论，知觉、记忆与想象都是因果过程，始于纯生理事件——大脑上的印记；这些生理状态被认定有心理对应物（感觉、感官观念或感官印象），它们充当知觉、记忆与想象的对象。这些观念或印象之为表象，在于它们保存、重现其生理对应物的信息。按里德的看法，这一观点不承认想象与记忆之别：二者都在于持有一个图画式的印记，它在外物印于感官之后仍留存；惟一差别只在映像式印记对其原因的忠实程度——记忆在于保存先前经验印在心灵中的意象，想象则在于构造经验中没有对应物的意象。
