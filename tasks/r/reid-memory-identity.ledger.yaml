      熟悉当代人格同一性文献——它强调一个人随时间保持同一的必要与充分条件——的人可能会问：如果里德认为记忆不是同一性的判准，而里德的实体二元论又排除了身体同一性作为人格同一性的判准，那么人格同一性究竟*在于*什么？里德的回答是：不可能用人格同一性自身之外的任何词项来说明它。这在里德那里既不是沉默主义也不是知识论上的谦逊。毋宁说，里德论证说，人格同一性的本性——其简单性与不可分割性——排除了任何诉诸同一性之外的概念来解释一个人如何随时间持存的还原论说明。
