      Reid holds that memory, like perception, is immediate. Neither the conception nor the belief that are the ingredients of memory are formed on the basis of reasoning or testimony. Memory is an original faculty of our constitution governed by what Reid calls “the first principles of contingent truths.” In the case of memory, the governing principle is that “those things did really happen which I distinctly remember” (*Essays*, 474). On Reid’s view, a normally functioning human does not and need not infer to a past event in episodic memory. In order to infer to a past event, one must have some prior, non-inferential relation to the event if it is to be a memory rather than a belief or knowledge. But then this prior, non-inferential relation would be an episodic memory. In addition, if episodic memory involved an inference to the effect that the event happened to me, the inference would be otiose because, as Reid claims, such a belief is already an immediate, non-inferential component of episodic memory. In principle, one could infer from the conception and belief that are ingredients in memory to a further belief that the event happened. But if such a belief plays a role in preserving past apprehension then it is superfluous—such a belief, subject to the Previous Awareness Condition, is already embedded in episodic memory. If the belief does not play a role in preserving past apprehension then it is a semantic memory, which, according to Reid, is among the species of belief or knowledge rather than memory.
    step1: |-
      里德认为，记忆与知觉一样是直接的。作为记忆成分的构想与信念都不是基于推理或证言形成的。记忆是我们构造中的一种原初官能，受里德所谓“偶然真理的第一原理”支配。就记忆而言，支配性原理是“那些我清楚记得的事情确实发生过”（《人类心灵论文集》，474）。按里德的看法，一个正常运作的人不会、也不需要向情景记忆中的过去事件进行推理。要向一个过去事件推理，人们必须与该事件有某种先行的、非推理的关系，它才是记忆而非信念或知识。但这样一来，这种先行的非推理关系就会是一个情景记忆。此外，如果情景记忆包含一个关于事件发生在我身上的推理，这个推理就是多余的，因为按里德的说法，这样的信念已经是情景记忆的一个直接的、非推理的成分。原则上，人们可以从作为记忆成分的构想与信念推出一个进一步的信念：事件发生了。但如果这样一个信念在保持过去领会中起作用，它就是多余的——受先前觉知条件约束，这样的信念已经嵌入情景记忆之中。如果它不在保持过去领会中起作用，那么它是一个语义记忆，而按里德的看法，语义记忆属于信念或知识之列，而非记忆之列。
