      Contemporary philosophers and cognitive scientists recognize that memory is a diverse phenomenon and they draw some useful distinctions among varieties of memory.[^note-2] For example, Endel Tulving distinguishes between episodic memory, semantic memory and procedural memory. Remembering how to ride a bike is an example of procedural memory. Remembering that Napoleon was defeated at Waterloo is an example of a semantic memory. Remembering one’s tenth birthday party is an example of an episodic memory.
