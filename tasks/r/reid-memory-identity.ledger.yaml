      As this passage illustrates, Locke himself acknowledges that the notion that the mind is a kind of repository or storehouse is metaphorical. According to Locke’s own theory, ideas and impressions cannot be stored. Locke is committed to the thesis that ideas are momentary and non-continuous and to the thesis that the identity of ideas over time requires continuous existence. These two theses jointly entail that numerically identical ideas cannot be stored over time. Nevertheless, Reid criticizes Locke for being unable to extricate himself from metaphor when Locke claims that in memory, “the mind, as it were, paints ideas anew on it self.” On what model does the mind paint the idea anew? In order to use a previous idea as its model, the mind must remember it. But then the ability to paint ideas anew upon itself presupposes rather than explains memory.
    step1: |-
      正如这段引文所例示的，洛克本人承认，心灵是某种仓库或储藏所这一观念是隐喻性的。按洛克自己的理论，观念与印象不能被储存。洛克持这样两个论题：观念是瞬时且非连续的；观念随时间的同一需要连续存在。这两个论题共同蕴含：数值同一的观念不能随时间被储存。尽管如此，里德批评洛克在声称记忆中“心灵可谓把观念在自己身上重新描绘”时无法从隐喻中脱身。心灵按什么模型把观念重新描绘出来？为了使用一个先前的观念作为模型，心灵必须记得它。于是，把观念在自己身上重新描绘的能力，以记忆为前提而非解释记忆。
    step2: |-
      正如这段引文所示，洛克本人承认：心灵是仓库或储藏所之说只是隐喻。按洛克自己的理论，观念与印象无法被储存——他既主张观念是瞬时且非连续的，又主张观念的跨时间同一需要连续存在；两论题合起来蕴含：数值同一的观念不能随时间储存。尽管如此，里德批评洛克：当他声称记忆中“心灵可谓把观念在自己身上重新描绘”时，他摆脱不了隐喻。心灵按什么模型重新描绘观念？要用先前的观念作模型，心灵必须记得它——于是，重新描绘观念于自身的能力，以记忆为前提，而非解释记忆。
  - id: 9
    kind: body
    source: |-
      Locke offers a non-metaphorical account of memory when he claims that memory consists of two perceptions: a present perception and a belief about that present perception, namely that one has enjoyed the perception before. Because Locke is committed to the thesis that numerically identical ideas cannot be stored over time, the belief must be the belief that one has previously enjoyed a perception qualitatively similar to the present perception, rather than numerically identical with it. Reid criticizes this account as circular, once more. A first-personal belief that one’s present perception is qualitatively similar to a perception one had in the past requires remembering having had that previous perception and recalling its quality and character. As before, Locke’s account presupposes rather than explains the phenomenon of memory (*Essays*, 285).
    step1: |-
      洛克在主张记忆由两个知觉构成时——一个当下的知觉，以及对那个当下知觉的一个信念，即主体先前享有过该知觉——给出了一个非隐喻的记忆说明。因为洛克主张数值同一的观念不能随时间储存，那个信念必须是：主体先前享有过一个在性质上与当下知觉相似的知觉，而非与之数值同一的知觉。里德再一次批评这个说明是循环的。一个第一人称的信念，即自己当下的知觉在性质上类似于自己过去有过的一个知觉，需要记得自己曾有过那个知觉，并回想其性质与特征。与前面一样，洛克的说明以记忆为前提而非解释记忆现象（《人类心灵论文集》，285）。
    step2: |-
      洛克也给出过一个非隐喻的记忆说明：记忆由两个知觉构成——一个当下的知觉，以及一个关于该知觉的信念，即主体先前享有过它。但由于洛克主张数值同一的观念无法随时间储存，那个信念只能是：主体先前享有过一个性质上与当下知觉相似的知觉，而非同一的那个知觉。里德再度批评这个说明循环：要形成“当下知觉在性质上类似于我过去某个知觉”的第一人称信念，就得记得曾有过那个知觉，还得回想它的性质与特征——与前面一样，洛克的说明以记忆为前提，而非解释记忆现象（《人类心灵论文集》，285）。
