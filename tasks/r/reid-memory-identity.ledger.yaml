    source: |-
      Thomas Reid held a direct realist theory of memory. Like his direct realism about perception, Reid developed his account as an alternative to the model of the mind that he called ‘the theory of ideas.’ On such a theory, mental operations such as perception and memory have mental states—ideas or impressions—as their direct objects. These mental states are understood as representations that encode information about their causes. The mind is directed towards and reads off from these representations, information about extra-mental items. By contrast, Reid holds that the direct objects of memory and perception are extra-mental. In the case of perception, the mind is directed to present material objects and properties; in the case of memory, the mind is directed towards past events to which the person was agent or witness. In other words, according to Reid, when we remember, we do not recall previous experiences. In memory, the mind is directed neither towards a previously experienced idea nor towards an idea of a previous experience. Rather, we recall *events*, experienced previously.
    step1: |-
      托马斯·里德持有一种关于记忆的直接实在论理论。正如他关于知觉的直接实在论一样，里德发展出这一说明，作为他所称的“观念论”这一心灵模型的替代方案。在这类理论中，知觉与记忆之类的心理运作以心理状态——观念或印象——为直接对象。这些心理状态被理解为对其原因所含信息进行编码的表象。心灵朝向这些表象并从中读出关于心外事项的信息。与此相对，里德认为记忆与知觉的直接对象是心外的。就知觉而言，心灵朝向当下物质对象与性质；就记忆而言，心灵朝向此人曾为之行动者或见证者的过去事件。换言之，按里德的看法，当我们回忆时，我们并非回想先前的经验。在记忆中，心灵既不朝向一个先前被经验过的观念，也不朝向一个关于先前经验的观念；毋宁说，我们回想的是先前经验过的*事件*。
    step2: |-
      托马斯·里德持一种关于记忆的直接实在论理论。与他关于知觉的直接实在论一样，这一说明是他所倡、用以替代其所谓“观念论”（the theory of ideas）心灵模型的方案。在这类理论里，知觉、记忆等心理运作以心理状态——观念或印象——为直接对象；这些心理状态被理解为编码了其原因之信息的表象，心灵朝向它们并从中读出心外事项的信息。里德反其道而行：记忆与知觉的直接对象是心外的。知觉时，心灵朝向当下的物质对象与性质；记忆时，心灵朝向此人曾为其行动者或见证者的过去事件。换言之，按里德的看法，回忆并不是回想先前的经验：记忆中的心灵，既不朝向一个先前被经验过的观念，也不朝向一个关于先前经验的观念——我们回想的是先前经验过的*事件*。
