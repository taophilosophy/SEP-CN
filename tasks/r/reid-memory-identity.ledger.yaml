      里德的第一个批评立足于他把洛克的定义解释为 使洛克承诺于这样一个立场：人格是一个思想主体，里德认为这蕴含人格是一个能思想的实体。与此同时，洛克似乎又承诺于一种以记忆——或用洛克的话说，对过去的意识——来分析人格同一性的做法。里德注意到洛克知道记忆理论的一些后果：如果意识或记忆的同一对于人格的同一既是必要的又是充分的，那么就可能出现人格同一而无能思想的存在者同一的情形。换言之，一个人格“从一个能思想的存在者转移到另一个能思想的存在者”，或者“两个或二十个能思想的存在者是同一个人”，这在逻辑上和形而上学上都是可能的（《人类心灵论文集》，276）。洛克对这些担忧——以及对意识中断时段（如睡眠）的担忧——的回应，凸显了里德的批评：“……在所有这些情形中……人们会怀疑我们是否是同一个能思想的东西，亦即是否是同一个实体。这一点无论合理与否，都根本与*人格同一性*无关。问题在于什么使得同一个*人格*，而不在于它是否是同一个同一的实体……”（洛克，《人类理解论》，第二卷第二十七章第 10 节）。里德的批评并不是说转移或分裂的情形不融贯——尽管他确实认为如此。毋宁说，他的批评是：记忆理论所允许的、无人格同一而无能思想的存在者同一的可能性，与洛克对*一个人格*作为“能思想的存在者”的刻画不一致。鉴于里德认为这一初始刻画是正确的，他把这视为对记忆理论的一个*归谬*。
