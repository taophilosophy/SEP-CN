      Episodic memories are further distinguished from semantic memories by the Previous Awareness Condition on episodic memory. The Previous Awareness Condition has been developed and examined by Sydney Shoemaker (1970), among others. Put simply, one has an episodic memory of an event only if one was agent or witness to the event remembered. The Previous Awareness Condition is a necessary but insufficient condition on episodic memory. If one has an experience as of being lost in a store as a child, but one was not in fact lost in a store as a child, such an experience is not an episodic memory. On the other hand, each of us has been agent or witness to many events of which we have no episodic memory. For example, one may not remember one’s third birthday party and so lack an episodic memory of an event to which one was surely witness. Reid characterizes memory as exhibiting the Previous Awareness Condition. He holds that reports of episodic memory are true only if the person reporting satisfies the condition, and that experiences that otherwise *appear* to be episodic memories, but which fail the condition, are not episodic memories (*Essays*, 264).
    step1: |-
      情景记忆还通过情景记忆上的先前觉知条件与语义记忆进一步区分开来。先前觉知条件已由 Sydney Shoemaker（1970）等人发展与考察。简单地说，只有当一个人是所忆事件的行动者或见证者时，他才对该事件有情景记忆。先前觉知条件是情景记忆的必要但不充分条件。如果一个人有仿佛童年时在商店里迷路的经验，但他童年时实际上并没有在商店里迷路，那么这一经验不是情景记忆。另一方面，我们每个人都曾是许多事件的行动者或见证者，对这些事件我们却没有情景记忆。例如，一个人可能不记得自己的三岁生日聚会，因而对一个自己无疑是见证者的事件缺乏情景记忆。里德把记忆刻画为表现出先前觉知条件。他认为，只有当报告者满足该条件时，情景记忆的报告才为真；那些在其他方面*显得*是情景记忆、却不满足该条件的经验，不是情景记忆（《人类心灵论文集》，264）。
    step2: |-
      情景记忆与语义记忆还有一层区分：情景记忆上的先前觉知条件（Previous Awareness Condition）。这一条件由 Sydney Shoemaker（1970）等人发展并考察过。简言之：唯有当一个人曾是所忆事件的行动者或见证者，他才对该事件有情景记忆。它是情景记忆的必要而非充分条件——若一个人有仿佛童年时在商店迷路的经验，而他童年其实未曾如此，这经验便不是情景记忆。反过来，我们都曾是许多事件的行动者或见证者，却对它们并无情景记忆。例如，一个人可能不记得自己的三岁生日聚会，因而对一个自己无疑是见证者的事件没有情景记忆。里德把记忆刻画为表现出先前觉知条件：情景记忆的报告为真，仅当报告者满足该条件；那些在其他方面*显得*像情景记忆、却不满足条件的经验，不是情景记忆（《人类心灵论文集》，264）。
