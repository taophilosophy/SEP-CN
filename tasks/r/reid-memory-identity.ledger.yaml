      Reid, Locke and others are interested in the notion of episodic memory not only for its own sake, but also because of its conceptual connection to the notion of personal identity. If Joe remembers, episodically, winning the World Series, then Joe must have existed at the time of his winning the World Series. This is why the Previous Awareness Condition characterizes episodic but not semantic memory. Unlike Joe’s memory that Napoleon was defeated at Waterloo, his memory of winning the World Series logically entails Joe’s existence at the time of the event remembered. In other words, episodic memory is logically sufficient for personal identity: if *S* remembers at time *t*_{*n*} (episodically) an event at time *t*₁, then *S* existed at time *t*₁. In addition, memory reports are often taken to be *prima facie* evidence for statements about the past history of the person reporting.
