      According to the Memory Theory, personal identity *consists* in memory; that is, sameness of memory is metaphysically necessary and sufficient for sameness of person. On this account, given that sameness of memory is sufficient for sameness of person, if a person at time *t*_{*n*} remembers (episodically) an event that occurred at time *t*₁ then the person at time *t*_{*n*} is identical with the person who was witness or agent to the event at time *t*₁. If the brave officer who has just taken the flag of the enemy remembers being beaten at school, then the brave officer is identical with the boy who was beaten. So too, if the general remembers taking the enemy’s flag, then the general is identical with the brave officer. If the general is identical with the brave officer, and the brave officer is identical with the boy, then by the transitivity of identity, the general is identical with the boy.
