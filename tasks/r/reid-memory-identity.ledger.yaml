      On Reid’s theory of memory, an apprehension establishes a direct relation to an event, which relation is preserved in memory by the acts of conceiving the event and believing of the event conceived that it happened to the person who remembers. It is a direct realist theory of memory because it departs from the model on which memory is a current apprehension of a past event or a current apprehension of a past apprehension. On the direct realist view, memory preserves past apprehension of an event through conception and belief. While Copenhaver (2006, 2017, and Copenhaver & Rysiew forthcoming) interprets Reid’s direct realism along intentionalist / representationalist lines, he could be interpreted as not only a direct realist but also a naive realist if one were to interpret him along relationalist / disjunctivist lines. Either way, Reid’s theory captures how memory, like perception, represents the world, rather than our experiences of the world, which is what makes him a direct realist.
