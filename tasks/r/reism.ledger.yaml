  - id: 3
    kind: body
    source: |-
      When arguing for reism Brentano was conscious of some related views of Leibniz. He even referred to Leibniz’s statements (in *Nouveaux essais*) about the dangers caused by using abstract words. Brentano’s reism was an effect of his departure from Aristotelian ontology. Brentano’s first metaphysics has a rich list of categories, including substances, modifications, circumstance, etc. Later, he divided being into things and *irrealia*, and the latter into immanent objects, contents, relations and so-called *collectiva*. All items belonging to *irrealia* had the status of *entia rationis* (beings in the mind or thought objects). Ultimately, Brentano rejected all *entia rationis*, that is, intentional objects, immanent objects, states of affairs, existence and non-existence, modalities, relations, probabilities, universals, Gestalten, time and space, Aristotelian forms, contents of judgements, etc.. His final ontological theory was based on the equality: being = *entia realia* = things. According to Brentano’s later philosophy, things are concrete (particular) entities. They are fully determined in their properties and are extended in time. Brentano distinguished two kinds of things, namely bodies (temporal and spatially extended) and souls (only temporal).
    step1: |-
      布伦塔诺为事物论辩护时，意识到莱布尼茨的一些相关观点。他甚至提到莱布尼茨（在 *Nouveaux essais* 中）关于使用抽象词所生危险的论述。布伦塔诺的事物论是他偏离亚里士多德本体论的一个结果。布伦塔诺的第一种形而上学有一个繁多的范畴清单，包括实体、样态、情况等等。后来，他把存在分为事物与 *irrealia*（非实在者），又把后者分为内在对象、内容、关系与所谓 *collectiva*（集合体）。属于 *irrealia* 的一切项都具有 *entia rationis*（心灵中的存在物或思想对象）的身份。最终，布伦塔诺拒绝了所有 *entia rationis*，即意向对象、内在对象、事态、存在与非存在、模态、关系、概率、共相、格式塔（Gestalten）、时间与空间、亚里士多德式的形式、判断的内容等等。他最终的本体论理论基于这样一个等式：存在 = *entia realia*（实在存在物）= 事物。按布伦塔诺的后期哲学，事物是具体的（殊相的）实体。它们在性质上完全被确定，并在时间中延展。布伦塔诺区分两类事物：物体（在时间与空间中延展）与灵魂（只在时间中延展）。
    step2: |-
      布伦塔诺为事物论辩护时，意识到了莱布尼茨的一些相关观点。他甚至援引莱布尼茨（在 *Nouveaux essais* 中）关于使用抽象词之危险的论述。布伦塔诺的事物论，是他偏离亚里士多德本体论的一个结果。布伦塔诺最初形而上学里的范畴清单相当庞大，包括实体、样态、情况等等。后来，他把存在分为事物与 *irrealia*（非实在者），再把后者分为内在对象、内容、关系与所谓 *collectiva*（集合体）。凡属 *irrealia* 的项，都具有 *entia rationis*（心灵中的存在物或思想对象）的身份。最终，布伦塔诺拒绝了所有 *entia rationis*：意向对象、内在对象、事态、存在与非存在、模态、关系、概率、共相、格式塔（Gestalten）、时间与空间、亚里士多德式的形式、判断的内容，等等。他最终的本体论理论立足于这样一个等式：存在 = *entia realia*（实在存在物）= 事物。按布伦塔诺后期哲学，事物是具体的（殊相的）实体：性质完全确定，且在时间中延展。他区分两类事物：物体（时间与空间中都延展）与灵魂（只在时间中延展）。
