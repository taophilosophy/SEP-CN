  - id: 1
    kind: body
    source: |-
      Reism is the doctrine that only things exist. The name is derived from the Latin noun *res* (‘thing’). The interpretation of this very rough view depends on how things are understood. Reism was anticipated by many nominalists (that is, philosophers maintaining that only individuals exist) and materialists, particularly by the *Stoics*, medieval doctrines of *singularia* (particulars) or Hobbes’ considerations on *corpora* (bodies). Some tenets of reism are to be found in *Leibniz*. *Brentano* defended reism very strongly in his later philosophy, when he argued against *entia rationis* (objects of thought; he meant by this objects which exist in thought alone). Brentano became a reist in about 1904 and attracted to this position some of his younger followers (so-called younger Brentanists), like O. Kraus, A. Kastil and G. Katkov. The most developed version of reism can be credited to Tadeusz Kotarbiński (1886–1981), a Polish philosopher and one of the leading members of *the Lvov-Warsaw School*. He introduced the term ‘reism’ to denote the philosophical view that the category of things is the sole ontological category. In other words, reism reduces all categories to that of things. Yet reists differ in their views about what exactly is included in the category of things. For example, if one takes the Aristotelian table of categories (ten rubrics: substance, relation, etc.) the reist would say that substances interpreted as things are the only existents. Reism also has a semantic dimension, for it recommends that only singular names, that is, names referring to concrete things, should be used, and abstract words avoided. Eventually, one can use sentences with abstract words provided that they have translations into statements with singular terms.
    step1: |-
      事物论（reism）是这样一种学说：只有事物存在。这一名称源自拉丁名词 *res*（“事物”）。对这一非常粗略的看法的解释，取决于如何理解事物。事物论被许多唯名论者（即主张只有个体存在的哲学家）和唯物主义者先行提出，尤其是斯多亚学派、中世纪关于 *singularia*（殊相）的学说，或霍布斯关于 *corpora*（物体）的思考。在莱布尼茨那里可以找到事物论的某些信条。布伦塔诺在其后期哲学中非常坚定地为事物论辩护，当时他反对 *entia rationis*（思想对象；他意指仅存在于思想中的对象）。布伦塔诺约在 1904 年成为事物论者，并吸引了他的一些年轻追随者（所谓年轻布伦塔诺派），如 O. Kraus、A. Kastil 与 G. Katkov。事物论最成熟的版本可归于 Tadeusz Kotarbiński（1886–1981），一位波兰哲学家、华沙学派（the Lvov-Warsaw School）的主要成员之一。他引入 “reism” 一词来表示这样一种哲学观点：事物的范畴是唯一的本体论范畴。换言之，事物论把一切范畴都还原为事物范畴。然而，事物论者对事物范畴中究竟包括什么，看法并不一致。例如，如果取亚里士多德的范畴表（十项：实体、关系等），事物论者会说，被解释为事物的实体是唯一的存在者。事物论还有一个语义维度，因为它主张只应使用单称名称，即指称具体事物的名称，并避免抽象词。最终，只要含抽象词的句子有翻译成含单称词的陈述，就可以使用它们。
    step2: |-
      事物论（reism）是这样一种学说：只有事物存在。名称源自拉丁名词 *res*（“事物”）。这一相当粗略的立场作何解释，取决于如何理解“事物”。许多唯名论者（主张只有个体存在的哲学家）与唯物主义者都先行提出过类似观点，最突出的是斯多亚学派、中世纪关于 *singularia*（殊相）的学说，以及霍布斯关于 *corpora*（物体）的思考。莱布尼茨那里也能找到事物论的若干信条。布伦塔诺在后期哲学中极为坚定地为事物论辩护，反对 *entia rationis*（思想对象；他意指仅存在于思想中的对象）。布伦塔诺约在 1904 年成为事物论者，并把一些年轻追随者（所谓年轻布伦塔诺派）吸引到这一立场上来，如 O. Kraus、A. Kastil 与 G. Katkov。事物论最成熟的版本应归于 Tadeusz Kotarbiński（1886–1981）——波兰哲学家、华沙学派（the Lvov-Warsaw School）的主要成员之一。他引入 “reism” 一词，表示这样一种哲学观点：事物范畴是唯一的本体论范畴；换言之，事物论把一切范畴都还原为事物范畴。不过，事物范畴里究竟包括什么，事物论者之间看法不一。例如，若取亚里士多德的范畴表（十项：实体、关系等），事物论者会说：被解释为事物的实体是唯一的存在者。事物论还有一个语义维度：它主张只使用单称名称——即指称具体事物的名称——并避免抽象词；最终，只要能把含抽象词的句子译成含单称词的陈述，使用前者也无妨。
