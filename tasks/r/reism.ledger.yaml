      hence, the ontological commitment of (3) is reducible to individuals (red things). According to Brentano, terms referring to *entia rationis* are actually not expressions functioning as names, but they belong to so-called *syncategorematica* (or *synsemantica*), that is, the category of expressions not having an autonomous meaning, but only a contextual one as for example, logical constants (‘and’, ‘or’, etc.). Omitting sentences, only names of particulars are categorematic (or autosemantic). On the other hand, the nouns used to refer to *entia rationis* are useful because they simplify our discourse. Nevertheless, we could live without abstract terms.
    step1: |-
      由此，（3）的本体论承诺可还原为个体（红的东西）。按布伦塔诺的看法，指称 *entia rationis* 的词项实际上不是充当名称的表达式，而属于所谓 *syncategorematica*（非范畴词，或 *synsemantica*［伴语义词］），即没有自立意义、只有语境意义的表达式一类，例如逻辑常项（“并且”、“或者”等）。除句子外，只有殊相的名称是范畴词（或自立语义词）。另一方面，用来指称 *entia rationis* 的名词是有用的，因为它们简化了我们的言谈。尽管如此，没有抽象词我们也能过。
    step2: |-
      由此，（3）的本体论承诺可还原为个体（红的东西）。按布伦塔诺的看法，指称 *entia rationis* 的词项实际上并不是起名称作用的表达式；它们属于所谓 *syncategorematica*（非范畴词，或 *synsemantica*［伴语义词］）——即没有自立意义、只有语境意义的那类表达式，如逻辑常项（“并且”、“或者”等）。除句子外，只有殊相的名称才是范畴词（或自立语义词）。另一方面，用来指称 *entia rationis* 的名词自有其用：它们让我们的言谈变得简便。尽管如此，没有抽象词我们也照样能说话。
