      Although Kotarbiński was a philosophical grandson of Brentano (*via* K. Twardowski, a student of the latter), he developed his version of reism independently (Woleński 1996, 357)[^woleński-1996]. This took place in the 1920s. The most extensive treatment of Kotarbiński’s reism is to be found in his book *Elementy*, published in 1929 (in Polish). In general, Kotarbiński followed Brentano’s criticism of abstract objects. Kotarbiński worked with a simplified table of ontological categories proposed by W. Wundt at the end of the 19ᵗʰ century. This table includes: things, states of affairs, relations and properties. Accordingly, Kotarbiński stated reism by two theses:
    step1: |-
      尽管 Kotarbiński 是布伦塔诺的哲学孙辈（*via* K. Twardowski，后者的学生），他独立地发展了他自己的事物论版本（Woleński 1996, 357）[^woleński-1996]。这发生在 1920 年代。对 Kotarbiński 事物论最详尽的讨论，见于其书 *Elementy*，1929 年出版（波兰文）。总体上，Kotarbiński 跟随布伦塔诺对抽象对象的批评。Kotarbiński 使用 W. 冯特在十九世纪末提出的一个简化的本体论范畴表。这个表包括：事物、事态、关系与性质。据此，Kotarbiński 用两条论题陈述事物论：
    step2: |-
      Kotarbiński 虽是布伦塔诺的哲学孙辈（*via* K. Twardowski，后者的学生），却独立发展出了自己的一版事物论（Woleński 1996, 357）[^woleński-1996]。这发生在 1920 年代。对 Kotarbiński 事物论最详尽的讨论，见于他 1929 年出版的（波兰文）著作 *Elementy*。总体上，Kotarbiński 跟随布伦塔诺对抽象对象的批评。他使用的是 W. 冯特在十九世纪末提出的一张简化的本体论范畴表，其中包含：事物、事态、关系与性质。据此，Kotarbiński 用两条论题来陈述事物论：
