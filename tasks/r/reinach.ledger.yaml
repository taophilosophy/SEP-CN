      The question then is whether obligations are mental objects. Reinach first considers whether they are beliefs. They are not, he claims, because having a belief about an obligation does not obligate the believer: the belief can, for example, be about someone else’s obligation. Also, my belief about my obligation can be mistaken—I have the belief, but there is no obligation. Reinach then considers whether an obligation boils down to a subjective sense of commitment. Interestingly, and anticipating much literature on the matter (see Michael 2022; Tomasello 2020)[^michael-2022][^tomasello-2020], he insists that feelings like the sense of commitment (and the sense of entitlement) do indeed exist and play a crucial role in our psychology (within phenomenology, Stavenhagen 1931 amplifies on this topic)[^stavenhagen-1931]. But such feelings do not coincide with obligations—for feelings are warranted or not: just as my fear of the barking dog in front of me is warranted only if the dog is dangerous, so my feeling of commitment towards you is warranted only if I have an obligation towards you, and this obligation is then in addition to my feeling. In general, Reinach contends that any hypothesis which aims at reducing obligations to subjective experiences is doomed to misfire. To illustrate the point, imagine accepting a car loan and agreeing to pay back the loan over a 36-month period. The very fact that an obligation (or a claim) may last for years without change shows that it survives (and, in fact, that it is independent of) changes in the bearer’s psychology: the bearer can forget the obligation, can lose consciousness, can even die, but none of these impacts the existence of the obligation. But if obligations are neither mental nor physical, then they are not real objects either.
    step1: |-
      那么问题就在于，义务是否是心理对象。莱纳赫首先考察它们是否是信念。他主张并非如此，因为对一项义务抱有信念并不使信念持有者负有义务：例如，该信念可以是关于别人的义务的。而且，我关于自己义务的信念可能是错的——我有此信念，却并无该义务。莱纳赫接着考察，义务是否可归结为一种主观的承诺感。有趣的是，他预见了大量相关文献（见 Michael 2022; Tomasello 2020）[^michael-2022][^tomasello-2020]，坚持认为承诺感（以及权利感）这类感受确实存在，并在我们的心理中起关键作用（现象学内部，Stavenhagen 1931 对此话题有所申论）[^stavenhagen-1931]。但这类感受与义务并不重合——因为感受有正当与否可言：正如我对面前吠叫的狗的恐惧，只有在狗确实危险时才是正当的，我对你的承诺感也只有在我对你负有义务时才是正当的，而这项义务是我的感受之外另加的东西。总而言之，莱纳赫主张，任何旨在把义务还原为主观经验的假说都注定落空。为说明这一点，不妨设想接受一笔购车贷款，并同意在 36 个月期限内还清。义务（或请求权）可以数年不变地持续存在，这一事实本身就表明它经受住了（事实上独立于）承担者心理的变化：承担者可以忘记该义务，可以失去意识，甚至可以死去，但这些都不影响义务的存在。而如果义务既非心理的也非物理的，那么它们也不是实在对象。
    step2: |-
      于是问题变成：义务是心理对象吗？莱纳赫先考察它们是否为信念。他的回答是否定的：对一项义务抱有信念，并不使信者负有义务——那信念大可以是关于别人的义务的。何况我关于自己义务的信念可能是错的：信念在此，义务却无。接着他考察义务是否可归结为一种主观的承诺感。有趣的是，他预见了此后大量文献（见 Michael 2022; Tomasello 2020）[^michael-2022][^tomasello-2020]，坚持认为承诺感（以及权利感）这类感受确实存在，并在我们的心理中扮演关键角色（现象学内部，Stavenhagen 1931 对此有进一步申论）[^stavenhagen-1931]。可是这类感受并不等于义务——感受有正当与不正当之分：我对面前吠叫之狗的恐惧，只有在狗确实危险时才正当；我对你的承诺感，也只有在对你负有义务时才正当，而这项义务是我的感受之外另加的东西。莱纳赫总的看法是：任何想把义务还原为主观经验的假说都注定落空。为说明这一点，不妨设想接受一笔购车贷款，并同意在 36 个月内还清。义务（或请求权）能数年不变地持续下去，这一事实本身即表明它挺过了（而且实际上独立于）承担者心理的变化：承担者可以忘记它，可以失去意识，甚至可以死去，这些都不影响义务的存在。义务既非心理又非物理，那它也就不是实在对象。
