      The combination of an object with its moments is called by Reinach an “underlying situation [*zugrundelieger Tatbestand*]” or a “unitary complex [*Einheitskomplex*]” (compare the use of the term “complex” by Russell and Wittgenstein, see Potter 2008, esp. 102–108)[^potter-2008]. So, for instance, the singular term “the rose” refers to an object, where “the red rose” points to a complex that is constituted by the rose together with its moment of redness. Importantly, any complex “founds” states of affairs: in this example, the red rose founds the being-red of the rose. States of affairs (*Sachverhalte*—another term used by Wittgenstein) are categorically different from objects and complexes, as the following considerations show (many of these ideas are presented in Reinach 1911c [1989: 112–120], English translation 1982: 332–346).
    step1: |-
      对象与其诸环节的结合，被莱纳赫称为“底层事况〔*zugrundelieger Tatbestand*〕”或“统一的复合体〔*Einheitskomplex*〕”（可与罗素和维特根斯坦对“复合体”一词的用法相比较，见 Potter 2008，尤其是 102–108）[^potter-2008]。例如，单称词项“这朵玫瑰”指称一个对象，而“这朵红玫瑰”则指向一个复合体，该复合体由这朵玫瑰连同其红性环节构成。重要的是，任何复合体都“奠基”事态：在此例中，红玫瑰奠基了玫瑰之是红的。事态（*Sachverhalte*——维特根斯坦使用的另一个词）与对象和复合体在范畴上不同，下述考察将表明这一点（这些想法大多见于 Reinach 1911c [1989: 112–120]，英译 1982: 332–346）。
    step2: |-
      对象与其诸环节的结合，莱纳赫称作“底层事况〔*zugrundelieger Tatbestand*〕”或“统一的复合体〔*Einheitskomplex*〕”（比较罗素与维特根斯坦对“复合体”一词的用法，见 Potter 2008，尤其 102–108）[^potter-2008]。譬如，单称词项“这朵玫瑰”指称一个对象，而“这朵红玫瑰”指向一个复合体——由这朵玫瑰连同其红性环节构成。要紧的是，任何复合体都“奠基”事态：在此例中，红玫瑰奠基了玫瑰之是红的。事态（*Sachverhalte*——维特根斯坦用过的另一个词）在范畴上不同于对象与复合体，以下考察可作说明（这些想法大多见于 Reinach 1911c [1989: 112–120]，英译 1982: 332–346）。
