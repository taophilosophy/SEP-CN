      Reinach’s investigations into legal and social entities has also influenced a number of phenomenologists. His theory of promises is at the basis of Wilhelm Schapp’s theory of contracts (1930) and has been reactivated recently to account for economic exchanges (Massin & Tieffenbach 2017; Salice 2022)[^massin-2017][^salice-2022]. Social acts are also discussed by Edith Stein in her account of the state (1925, see González-Di Pierro 2016; Taieb 2020)[^gonzález-di-2016][^taieb-2020] and by Gerda Walther in her account of social groups (1923, see Salice & Uemura 2018)[^salice-2018].
    step1: |-
      莱纳赫对法律实体与社会实体的探究也影响了不少现象学家。他的承诺理论是威廉·沙普契约理论（1930）的基础，近来又被重新启用，用以说明经济交换（Massin & Tieffenbach 2017; Salice 2022）[^massin-2017][^salice-2022]。社会行为也在艾迪特·施泰因关于国家的说明（1925，见 González-Di Pierro 2016; Taieb 2020）[^gonzález-di-2016][^taieb-2020]与格尔达·瓦尔特关于社会群体的说明（1923，见 Salice & Uemura 2018）[^salice-2018]中得到讨论。
    step2: |-
      莱纳赫对法律实体与社会实体的探究，也影响了不少现象学家。他的承诺理论是威廉·沙普契约理论（1930）的基础，近来又被重新起用，以说明经济交换（Massin & Tieffenbach 2017; Salice 2022）[^massin-2017][^salice-2022]。社会行为还见于艾迪特·施泰因关于国家的说明（1925，见 González-Di Pierro 2016; Taieb 2020）[^gonzález-di-2016][^taieb-2020]，以及格尔达·瓦尔特关于社会群体的说明（1923，见 Salice & Uemura 2018）[^salice-2018]。
