      The third idea is that essences may or may not be instantiated. It is controversial in the literature whether or not this idea commits Reinach to Platonism (DuBois 1995; Baltzer-Jaray 2009)[^baltzer-jaray-2009][^dubois-1995]. But it can be argued that, if it does (see Salice 2009; B. Smith 1987)[^salice-2009][^smith-1987], then Reinach would not be embracing a naïve form of Platonism. For instance, Reinach explicitly rejects a notion of essences that would generate any form of third man argument. In his article, *The Supreme Rules of Rational Inference According to Kant* of 1911, he observes that essences (what he calls there “general concepts”) do not have the same properties as the objects that instantiate them. He notes that it would be an ontological mistake to assume that essences are the same sorts of things as the entities that have them. For instance, the judgment that “the triangle has three sides” does not convey the idea that the essence of the triangle itself instantiates triangularity—for that would be nonsensical. Rather, the judgment should be understood as expressing the thought that “everything that is a triangle has three sides”. It is this general and necessary state of affairs that is the specific object of our *a priori* knowledge.
    step1: |-
      第三个想法是，本质可能被实例化，也可能不被实例化。这一想法是否使莱纳赫承诺了柏拉图主义，在文献中尚有争议（DuBois 1995; Baltzer-Jaray 2009）[^baltzer-jaray-2009][^dubois-1995]。但可以论证，即使答案是肯定的（见 Salice 2009; B. Smith 1987）[^salice-2009][^smith-1987]，莱纳赫所取的也不会是一种幼稚形态的柏拉图主义。例如，莱纳赫明确拒斥那种会引出任何形式第三人论证的本质概念。在 1911 年的文章《依康德论理性推理的最高规则》中，他指出，本质（他在那里称之为“一般概念”）并不具有实例化它们的对象所具有的同样属性。他注意到，若认定本质与拥有本质的实体是同一类东西，那将是一个本体论错误。例如，“三角形有三条边”这一判断并不传达三角形这一本质本身实例化了三角形性这一想法——那将是无意义的。相反，该判断应被理解为表达了这样一个思想：“凡三角形都有三条边”。正是这一普遍而必然的事态，才是我们*先天*知识的特有对象。
