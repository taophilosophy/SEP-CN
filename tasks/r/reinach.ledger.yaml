      Reinach’s theory of states of affairs has also sparked a debate among phenomenologists focusing on whether Reinach’s maximally realist position about states of affairs should be moderated in some way to render it ontologically more parsimonious. For instance, some have argued against the idea of negative states of affairs (Ingarden 1964–65, see: Chrudzimski 2012)[^chrudzimski-2012][^ingarden-1964], others against the idea of impersonal states of affairs (Pfänder 1921)[^pfänder-1921]. Daubert draws a distinction between the state of affairs as such (described along the lines of Reinach’s notion of unitary complex) and the various ways in which the state of affairs can be apprehended and conceptualized (states of affairs “as cognized”, “as questioned”, “as commanded”, and so on, see Schuhmann 1987)[^schuhmann-1987][^schuhmann-1987-2]. Maximilian Beck (1938) rejects the idea of state of affairs as mind-independent entities altogether by claiming that these entities merely depend on minds.
    step1: |-
      莱纳赫的事态理论也在现象学家中间引发了一场争论，焦点在于：莱纳赫关于事态的最大限度实在论立场，是否应作某种缓和，以使其在本体论上更为简约。例如，有人反对否定性事态的想法（Ingarden 1964–65，见 Chrudzimski 2012）[^chrudzimski-2012][^ingarden-1964]，另有人反对无人称事态的想法（Pfänder 1921）[^pfänder-1921]。道伯特区分了事态本身（按莱纳赫的统一复合体概念来描述）与事态可被把握和概念化的各种方式（“被认知的”、“被追问的”、“被命令的”事态等等，见 Schuhmann 1987）[^schuhmann-1987][^schuhmann-1987-2]。马克西米利安·贝克（1938）则彻底拒斥事态作为独立于心灵之实体的想法，主张这些实体仅仅依赖于心灵。
    step2: |-
      莱纳赫的事态理论也在现象学家中激起一场争论：他关于事态的最大限度实在论立场，是否该有所缓和，以使之在本体论上更简约？例如，有人反对否定性事态（Ingarden 1964–65，见 Chrudzimski 2012）[^chrudzimski-2012][^ingarden-1964]，另有人反对无人称事态（Pfänder 1921）[^pfänder-1921]。道伯特则区分事态本身（按莱纳赫的统一复合体概念来描述）与事态可被把握、被概念化的各种方式（“被认知的”“被追问的”“被命令的”事态等等，见 Schuhmann 1987）[^schuhmann-1987][^schuhmann-1987-2]。马克西米利安·贝克（1938）索性否弃事态是独立于心灵之实体这一想法，主张这些实体仅仅依赖于心灵。
