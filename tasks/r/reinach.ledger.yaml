      在《逻辑研究》中，胡塞尔发展了弗朗兹·布伦塔诺提出的一个论题：意向性，即指向某个对象的属性，是心灵的一项关键能力。基于这一意向性概念，胡塞尔论证说，既然语言本质上服务于表达意向性经验，那么语言的一切使用本质上都是指涉性的。例如，一个主体在知觉到一头鲸时说出的句子“这是一头鲸”，表达了他对这头鲸的主观知觉，因而指涉该知觉的意向对象（即被知觉到的那头鲸）。为了在这一概念框架中容纳承诺、问题或命令这类非陈述句，胡塞尔主张这些句子表达的是关于主体内心经验的信念。例如，我的问题“现在几点了？”表达了我的如下信念：我有知道时间的欲望；因而它指涉该欲望（欲望是我的信念的意向对象）。同样，我对你作出的承诺“我下午 5 点会到酒馆”，表达了我的如下信念：我有下午 5 点到酒馆的意向；因而它指涉该意向。
