      How do we come to know states of affairs? Reinach claims that these entities can be given to us in perceptual acts of a specific kind. When we report a perception by using a that-clause (“I perceive *that* this animal is barking”) or a qualifier followed by a property (“I perceive this animal *as* a dog”), then we are reporting an instance of cognizing or of coming to know something (*Erkennen*, Reinach 1911c [1989: 118], English translation 1982: 342). Given that states of affairs are either positive or negative, it follows that, if certain psychological preconditions are fulfilled, one can also perceive or come to know negative states of affairs. If, e.g., I open the fridge with the expectation of finding a can of beer unbeknownst of the fact that somebody already drank it, then I can perceive that *there is no can of beer in the fridge.* Importantly, this experience is not a belief (or conviction, *Überzeugung*) because belief is polar (I either believe or disbelieve something). But cognizing is not polar: either I cognize something or I do not cognize at all. Also, beliefs endure, whereas acts of cognizing are episodic. This difference, however, should not let us overlook the important relations between the two experiences. In particular, acts of cognizing can motivate beliefs, Reinach argues: the perception that there is no beer in the fridge can motivate you to believe that there is no beer in the fridge. And the act of rehearsing that belief in conscious and linguistic thought by uttering the words “there is no beer in the fridge!” is an act of assertion (*Behauptung*). Because of the basic and fundamental role that *sui generis* acts of cognizing play in making us acquainted with states of affairs, some authors have claimed that Reinach anticipates the so-called knowledge-first approach in epistemology (see Mulligan 2014; on the knowledge-first approach, see Williamson 2000)[^mulligan-2014][^williamson-2000].
    step1: |-
      我们如何认识事态？莱纳赫主张，这类实体可以在特定种类的知觉行为中给予我们。当我们用 that 从句（“我知觉到*这动物在叫*”）或一个限定词加一个属性（“我把这动物知觉*为*一条狗”）来报告一次知觉时，我们报告的便是认知或逐渐认识某物（*Erkennen*，Reinach 1911c [1989: 118]，英译 1982: 342）的一个实例。既然事态要么肯定要么否定，那么只要满足某些心理前提，人也能知觉或认识否定事态。例如，如果我打开冰箱，指望找到一罐啤酒，却不知道已有人把它喝掉了，那么我就能知觉到*冰箱里没有啤酒罐*。重要的是，这一经验不是信念（或确信，*Überzeugung*），因为信念是两极的（我要么相信某事，要么不相信）。但认知不是两极的：要么我认知某事，要么我根本没有认知。再者，信念持续存在，而认知行为是偶发的。然而，这一差异不应让我们忽视两种经验之间的重要关联。特别是，莱纳赫主张，认知行为能够激发信念：知觉到冰箱里没有啤酒，能够使你相信冰箱里没有啤酒。而通过说出“冰箱里没有啤酒！”这句话，在有意识的语言思维中复述该信念的行为，是一种断言行为（*Behauptung*）。由于 *sui generis*（自成一类）的认知行为在使我们认识事态方面起着基本而根本的作用，一些论者声称莱纳赫预见了认识论中所谓知识优先的进路（见 Mulligan 2014；关于知识优先进路，见 Williamson 2000）[^mulligan-2014][^williamson-2000]。
