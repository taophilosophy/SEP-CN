      莱纳赫认为自己是在发展一种独特的哲学进路，其目标是忠实于不同种类的经验（语言的、宗教的、道德的、知觉的、情感的、审美的等等）中之所与。莱纳赫论证说，其中某些经验有能力使其主体认识对象及其“*先天*”结构或“本质结构（*Wesenszusammenhänge*）”。因此，莱纳赫写道：
    step2: |-
      莱纳赫自视为在开辟一种独特的哲学进路，力求忠实于各类经验（语言的、宗教的、道德的、知觉的、情感的、审美的，等等）中给出的东西。他论证说，其中有些经验能够使主体认识对象，认识对象的“*先天*”结构或“本质结构（*Wesenszusammenhänge*）”。他写道：
