      > Independently of each other, the Göttingen students of phenomenology like Wilhelm Schapp, Dietrich von Hildebrand, Alexander Koyré and Edith Stein, in their accounts of this period, refer to Reinach, not to Husserl, as their real teacher in phenomenology. Hedwig Conrad-Martius even goes so far as to call him the phenomenologist *par excellence*… It was his death in action in 1917 rather than Husserl’s going to Freiburg which cut short not only his own promise but that of the Göttingen phenomenological circle. (1982: 191–192)
    step1: |-
      > 哥廷根的现象学学生——如威廉·沙普（Wilhelm Schapp）、迪特里希·冯·希尔德布兰德（Dietrich von Hildebrand）、亚历山大·科伊雷（Alexander Koyré）与艾迪特·施泰因（Edith Stein）——在回顾这一时期的记述中彼此独立地都把莱纳赫而非胡塞尔称为自己真正的现象学老师。黑德维希·康拉德-马齐乌斯（Hedwig Conrad-Martius）甚至径直称他为最卓越的——*par excellence*——现象学家……中断了他本人前途的，也是中断了哥廷根现象学圈前途的，是 1917 年他战死沙场，而不是胡塞尔去了弗赖堡。（1982: 191–192）
    step2: |-
      > 哥廷根的那批现象学学生——威廉·沙普（Wilhelm Schapp）、迪特里希·冯·希尔德布兰德（Dietrich von Hildebrand）、亚历山大·科伊雷（Alexander Koyré）、艾迪特·施泰因（Edith Stein）——在回顾这段岁月的记述中彼此独立地都声称：自己真正的现象学老师是莱纳赫，不是胡塞尔。黑德维希·康拉德-马齐乌斯（Hedwig Conrad-Martius）甚至径直称他为最卓越的——*par excellence*——现象学家……无论中断的是他自己的前途，还是哥廷根现象学圈的前途，肇因都不是胡塞尔去了弗赖堡，而是他 1917 年战死沙场。（1982: 191–192）
