      By endorsing the view that the two most general categories in formal ontology are those of object and state of affairs, Reinach refines a number of ideas that were already circulating at his time (Husserl 1900/01; Meinong 1904, 1910)[^husserl-1900][^meinong-1904].
    step1: |-
      莱纳赫赞同如下观点：形式本体论中最普遍的两个范畴是对象与事态；由此他把当时已在流传的若干想法加以提炼（Husserl 1900/01; Meinong 1904, 1910）[^husserl-1900][^meinong-1904]。
    step2: |-
      形式本体论中最普遍的两个范畴是对象与事态——莱纳赫赞同此说，并由此把当时已在流传的若干想法加以提炼（Husserl 1900/01; Meinong 1904, 1910）[^husserl-1900][^meinong-1904]。
