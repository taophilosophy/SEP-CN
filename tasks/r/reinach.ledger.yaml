      It was in critical reaction to such theses that Reinach developed his theory of *social acts* (B. Smith 1990)[^smith-1990], a theory which bears striking similarities to the theory of speech acts later developed by Austin and Searle in the 1960s. Compare promising and reporting one’s intention to do something. According to Reinach, these two experiences belong to the category of what he calls “spontaneous” acts: these are acts which involve a subject’s bringing something about within his own psychic sphere, as contrasted with passive experiences of, say, feeling a pain or hearing an explosion (1913a [1989: 158], English translation 2012: 18). Yet, there is a crucial difference between these two spontaneous acts, namely that they have different conditions of success. In particular, the promise is successful if it generates a promissory obligation for the promisor and a claim for the promisee. We will come back to this point below, but for now it is important to highlight that the report of an intention does not stand under similar criteria of assessment. Forming an intention and reporting it are not acts that aim at the generation of obligations and claims.
