      Reinach’s ideas have been influential in shaping the thoughts of many early phenomenologists. One of those who most clearly and generously recognizes his debt towards Reinach is his close friend Dietrich von Hildebrand, who picks up and advances many of his insights. Most importantly, von Hildebrand develops an ontology that has the notion of value at its very core. This notion is explored with regard to its implications for our understanding of ethics (von Hildebrand 1959) and aesthetics (1977–1984), the foundations of which require values as indispensable and fundamental elements. By expanding on Reinach’s remarks about deliberation (1912/13), von Hildebrand contributes to our understanding of the phenomenology of action by distinguishing different kinds of conative experiences (desire, willing, intention) and their role in shaping our conduct (see his 1916; this is a project, which is pursued further by Hans Reiner in his 1927)[^reiner-1927]. Von Hildebrand also elaborates on Reinach’s idea of social acts by claiming that some of our emotions are in-need-of being heard. Romantic love, for example, which is only one particular kind of love, strives to be understood by its addressee (1930). Furthermore, he develops Reinach’s knowledge-first approach to epistemology in terms that are more explicit than those used by Reinach himself: the act of coming to know something, according to von Hildebrand, is factive insofar as it always makes its subject acquainted with a fact (1976).
    step1: |-
      莱纳赫的想法在塑造许多早期现象学家的思想上颇有影响。其中最清楚、最慷慨地承认自己受惠于莱纳赫的，是他的挚友迪特里希·冯·希尔德布兰德，他承接并推进了莱纳赫的许多洞见。最重要的是，冯·希尔德布兰德发展出一种以价值概念为核心的本体论。这一概念在其对伦理学（von Hildebrand 1959）与美学（1977–1984）之含义方面得到探讨，而这两门学科的基础都需要价值作为不可或缺的基本要素。通过扩展莱纳赫关于慎思的论述（1912/13），冯·希尔德布兰德区分了不同种类的意动经验（欲望、意愿、意向）及其在塑造我们行为中的作用，从而推进了我们对行动现象学的理解（见其 1916；这一纲领由汉斯·赖纳在其 1927 年著作中进一步推进）[^reiner-1927]。冯·希尔德布兰德还申发了莱纳赫的社会行为想法，主张我们的某些情感也是需被听闻的。例如浪漫爱情——它只是爱的一种特殊类型——就力求为其受话者所理解（1930）。此外，他以比莱纳赫本人更明确的方式发展了莱纳赫的知识优先认识论进路：按冯·希尔德布兰德之说，认识某物的行为是事实性的，因为它总使其主体认识一个事实（1976）。
