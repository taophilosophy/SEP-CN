      冯·希尔德布兰德也追随莱纳赫，主张哲学知识首先是关于*先天*事态的知识，即关于植根于本质的事态的知识。这种对本质概念本身的关注，是许多早期现象学家哲学工作的特征。两次世界大战之间的几十年里，围绕这一主题产生了整整一批出版物，它们都援引莱纳赫。其中最著名的出自让·埃兰（Jean Héring，1921）、罗曼·英伽登（1925）、赫伯特·施皮格伯格（1930）与威廉·珀尔（Wilhelm Pöll，1936）。
