      Importantly, values stand in a hierarchical order: some values are higher than others (1913b [1989: 485–515]). Reinach shares the concept of a hierarchy of values with several phenomenologists, including von Hildebrand, and particularly Scheler (for a comparison between Reinach and Scheler, see J. Smith 2017, esp. 174–178)[^smith-2017]. Higher values ground stronger duties, lower values weaker duties. The idea that duties have degrees of strength can now be brought to bear on the issue of immoral promises: if a subject promises an immoral action, are they morally compelled to keep the promise? It depends, argues Reinach: if the duty to omit the action is stronger than the duty to honor the promise, then the promisor ought not to act according to their promise (1913a [1989: 186f], English translation 2012: 45).
    step1: |-
      重要的是，价值处于一种等级秩序之中：有些价值高于另一些价值（1913b [1989: 485–515]）。莱纳赫与包括冯·希尔德布兰德、尤其是舍勒在内的若干现象学家共享价值层级这一概念（关于莱纳赫与舍勒的比较，见 J. Smith 2017，尤其 174–178）[^smith-2017]。较高的价值奠基较强的义务，较低的价值奠基较弱的义务。义务具有强度等级这一想法，如今可以用到不道德承诺的问题上：如果主体承诺了一个不道德的行动，他们在道德上是否有义务信守承诺？莱纳赫主张，这要看情况：如果不行该行动的义务强于信守承诺的义务，那么承诺者就不应按照其承诺行事（1913a [1989: 186f]，英译 2012: 45）。
