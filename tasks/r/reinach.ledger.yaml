    source: |-
      > We can surely take it as generally granted that there are *no self-evident and necessary* relations of essence in the causal relations of external events. However it is, to speak with Hume, that we come to know that fire produces smoke, this is *surely not intelligibly grounded in the essence of fire*, as it lies in the essence of the number 3 to be larger than the number 2. (1913a [1989: 155], English translation 2012: 15, emphasis added)
    step1: |-
      > 我们当然可以普遍地认定：外部事件的因果关系中并*不存在自明而必然的*本质关联。无论我们怎样——用休谟的话说——得知火产生烟，这一点*都确实不能可理解地奠基于火的本质之中*，不像 3 大于 2 奠基于 3 的本质那样。（1913a [1989: 155]，英译 2012: 15，强调为引者所加）
    step2: |-
      > 我们大可以普遍认定：在外部事件的因果关系中，并*不存在自明而必然的*本质关联。无论我们如何——用休谟的话说——得知火生烟，这一点都*确实不能从火的本质中得到可理解的奠基*，不像 3 大于 2 那样奠基于 3 的本质。（1913a [1989: 155]，英译 2012: 15，强调为引者所加）
  - id: 12
    kind: body
    source: |-
      As this passage illustrates, Reinach draws a fundamental distinction between contingent and *a priori*, i.e., general and metaphysically necessary states of affairs. Three ideas, here, shed light on Reinach’s understanding of phenomenology.
    step1: |-
      正如这段文字所示，莱纳赫在偶然事态与*先天*事态之间，即偶然事态与普遍而形而上必然的事态之间，划出了一条根本的区分。这里有三个想法，可以说明莱纳赫对现象学的理解。
    step2: |-
      这段文字透露出莱纳赫的一条根本区分：偶然事态与*先天*事态之别，也就是偶然事态与普遍而形而上必然的事态之别。以下三个想法可以说明他如何理解现象学。
  - id: 13
    kind: body
    source: |-
      First, *a priori* states of affairs are grounded in the very nature, or essence, of their underlying or “founding” objects (Reinach 1911b; for contemporary discussions of this idea, see Fine 1994a, 1994b, 1995 and Mulligan 2004)[^fine-1994a][^mulligan-2004]. For example, 3 is larger than 2 in virtue of its essence; orange lies between red and yellow in virtue of its essence; promises generate obligations in virtue of their essence; and remorse presupposes the memory of a past wrongdoing in virtue of its essence. Since each and every object, being the object that it is, carries an essence or a nature, each and every object is embedded in some *a priori* or essential structure. Importantly, such structures are mind-independent states of affairs: they are not ascribed, imposed, or projected onto the world; rather, they are grounded in the nature of the entities themselves. This is not, however, to say that the mind, for Reinach, does not have the capacity to create entities, as we will see in his account of social and institutional entities.
    step1: |-
      第一，*先天*事态植根于其底层对象或“奠基”对象的本性即本质之中（Reinach 1911b；关于这一想法的当代讨论，见 Fine 1994a, 1994b, 1995 与 Mulligan 2004）[^fine-1994a][^mulligan-2004]。例如，3 凭其本质而大于 2；橙色凭其本质而处于红与黄之间；承诺凭其本质而产生义务；悔恨凭其本质而以对过去过错的记忆为前提。既然每一个对象作为它所是的那个对象都带有一种本质或本性，那么每一个对象都嵌在某种*先天*结构或本质结构之中。重要的是，这类结构是独立于心灵的事态：它们不是被归属、被强加或被投射到世界之上的；相反，它们植根于诸实体本身的本性。不过，这并不等于说，在莱纳赫看来心灵没有创造实体的能力——我们将在他对社会实体与制度实体的说明中看到这一点。
    step2: |-
      第一，*先天*事态植根于其底层对象——即“奠基”对象——的本性或本质（Reinach 1911b；关于这一想法的当代讨论，见 Fine 1994a, 1994b, 1995 与 Mulligan 2004）[^fine-1994a][^mulligan-2004]。例如：3 凭其本质而大于 2；橙色凭其本质而位于红与黄之间；承诺凭其本质而产生义务；悔恨凭其本质而以对过去过错的记忆为前提。每个对象既然作为它所是的那个对象存在，就都带有一种本质或本性，因此也都嵌在某种*先天*结构或本质结构之中。要紧的是，这类结构是独立于心灵的事态：它们并非被归属、被强加或被投射到世界之上，而是植根于诸实体自身的本性。当然，这并不等于说在莱纳赫那里心灵没有创造实体的能力——关于社会实体与制度实体的说明将表明这一点。
  - id: 14
    kind: body
    source: |-
      A core aim of phenomenology is thus to accurately describe the *a priori* states of affairs that we find in the world. Each and every object carries an essence, but not all essences are of equal interest to the phenomenologist, whose attention goes to those essences which have a higher degree of intelligibility or of philosophical significance (von Hildebrand 1976: 128–136). The task of investigating such philosophically significant essences opens up an almost inexhaustible domain of eidetic research for the phenomenologist:
    step1: |-
      因此，现象学的一个核心目标就是准确描述我们在世界中发现的各种*先天*事态。每一个对象都带有本质，但并非所有本质都同等重要；现象学家的注意力落在那些可理解程度较高或哲学意义较大的本质之上（von Hildebrand 1976: 128–136）。研究这类具有哲学意义的本质，为现象学家开启了一个几乎取之不尽的本质研究领域：
    step2: |-
