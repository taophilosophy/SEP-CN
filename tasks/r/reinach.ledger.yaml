      First, states of affairs either obtain or not, whereas objects (and, by extension, complexes) either exist or not. Reinach does not elaborate on this point, but it stands to reason that a state of affairs obtains if and only if its underlying complex exists. The point is made by his close friend Theodor Conrad: “Clearly one can … say correctly [that states of affairs subsist] only if the (external) situation [*Tatbestand*] really is objective …” (Conrad 1953–1954)[^conrad-1953]. For instance, the being-red of the rose obtains if and only if the red rose exists.
    step1: |-
      第一，事态要么成立要么不成立，而对象（推而广之，复合体）要么存在要么不存在。莱纳赫未对此点详加阐述，但可以合理认为，一个事态成立，当且仅当其底层复合体存在。这一论点由他的挚友特奥多尔·康拉德提出：“显然，人们……只能(在外部)事况〔*Tatbestand*〕确实是客观的时候，才正确地[说事态存在]……”（Conrad 1953–1954）[^conrad-1953]。例如，玫瑰之是红的这一事态成立，当且仅当这朵红玫瑰存在。
    step2: |-
      第一，事态有成立与不成立之别，对象（因而也包括复合体）则有存在与不存在之别。莱纳赫对此未多作发挥，但可以合理推定：事态成立，当且仅当其底层复合体存在。他的挚友特奥多尔·康拉德就把这一点讲了出来：“显然，人们……唯有在（外部的）事况〔*Tatbestand*〕确实客观时，才能正确地说[事态存在]……”（Conrad 1953–1954）[^conrad-1953]。例如，“玫瑰之是红的”这一事态成立，当且仅当这朵红玫瑰存在。
