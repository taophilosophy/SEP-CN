      The first idea is that, for Reinach, promises generate promissory obligations in virtue of their nature. Promises bring about obligations because of what they are: obligation-generators. Promising is a *sui generis* phenomenon that was discovered and not invented. This can also be seen in the contrast between promising and those elements of a code of law which truly are constructed, for example specific rules concerning primogeniture or the discharging of liens. In holding this view, Reinach rejects any attempt of tracing the nature of promises back to other allegedly more well-understood accounts of obligation-generation, including via: useful social practices (Hume 1739)[^hume-1739], social institutions (Searle 1969)[^searle-1969], expectation triggers (Scanlon 1990)[^scanlon-1990], solicitations of trust (Friederich & Southwood 2011), and joint decisions (Gilbert 2018)[^gilbert-2018]. Hewrites:
    step1: |-
      第一个想法是：在莱纳赫看来，承诺凭其本性而产生承诺性义务。承诺之所以带来义务，是因为它们之所是：义务的生成者。承诺是一种被发现的、而非被发明的自成一类（*sui generis*）现象。这一点也可以从承诺与法典中那些真正被建构出来的要素的对比中看出，例如关于长子继承制或清偿留置权的具体规则。持此观点，莱纳赫拒斥任何把承诺的本性回溯到其他据称更易理解的义务生成说明的尝试，包括通过：有用的社会实践（Hume 1739）[^hume-1739]、社会制度（Searle 1969）[^searle-1969]、期待触发机制（Scanlon 1990）[^scanlon-1990]、对信任的恳求（Friederich & Southwood 2011）以及联合决定（Gilbert 2018）[^gilbert-2018]。他写道：
