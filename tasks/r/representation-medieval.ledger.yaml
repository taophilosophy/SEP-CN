      One of the first to criticize the species theory of cognition, in the late thirteenth century, was Peter Olivi. He argued, contrary to Aristotle and Aquinas, that the mind is active in its cognition of the world; it attends to the object, and it is this move on his part that puts the species theory of cognition in a completely different light. In fact, there seems little point in postulating a species through which the object is cognized. He argues:
    step1: |-
      十三世纪晚期最早批评种相认知理论的人之一是彼得·奥利维。他与亚里士多德和阿奎那相反，主张心灵在对世界的认知中是主动的；它注意对象，而正是他的这一步，使种相认知理论呈现出完全不同的面貌。事实上，设定一个借以认知对象的种相，似乎没有什么意义。他论证说：
    step2: |-
      十三世纪晚期，最早批评种相认知理论的人物之一是彼得·奥利维。他与亚里士多德、阿奎那相反，主张心灵在对世界的认知中是主动的：心灵注意对象。正是这一步，使种相认知理论显出全然不同的面貌——事实上，设定一个“借以”认知对象的种相，似乎并无多大意义。他论证道：
