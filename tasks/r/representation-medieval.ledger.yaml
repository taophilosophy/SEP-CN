      Olivi’s objection mentioned above does not apply to Aquinas’ theory since species are not real representations on that view. Olivi himself seems aware of this, however, and says that if the species has spiritual being, then they cannot: “truly and naturally flow from a natural, corporeal form, [and] not really and truly inform a natural body, e.g. the air or the eye.” (*Sententiarum* II, q. 73, 87.) On Aquinas’ theory the species cannot affect the sense organ and cause a cognition, he seems to think. The species cannot hence fulfill the role they are supposed to play in a theory of cognition or a theory of vision.
    step1: |-
      上文提到的奥利维的反对意见不适用于阿奎那的理论，因为按后者，种相不是实在的表征。然而奥利维本人似乎意识到这一点，并说：如果种相具有精神存在，那么它们就不能“真正而自然地从一个自然的、有形的形式流出，[也不能]真实而真正地充灌一个自然物体，例如空气或眼睛。”（《〈箴言〉第二卷》，q. 73, 87。）他似乎认为，按阿奎那的理论，种相无法影响感觉器官并引起认知。因此，种相无法在认知理论或视觉理论中扮演它们本应扮演的角色。
    step2: |-
      上文所述奥利维的反对意见，并不适用于阿奎那的理论——按后者，种相本非实在的表征。不过奥利维本人似乎察觉到这一点。他说：若种相具有精神存在，它们便不能“真正而自然地从一个自然的、有形的形式流出，[也不能]真实而真正地充灌一个自然物体，例如空气或眼睛”。（《〈箴言〉第二卷》，q. 73, 87。）他似乎认为，按阿奎那之说，种相无法作用于感觉器官、引发认知；于是种相便无法在认知理论或视觉理论中扮演本该扮演的角色。
