    source: |-
      The notions of mental representation and intentionality are intrinsically related in contemporary philosophy of mind, since it is usually thought that a mental state has content or is about something other than itself due to its representational nature. These notions have a parallel history in medieval philosophy as well and are now well studied, at least up to Buridan (see, for example, in Knudsen 1982, Tweedale 1990, Pasnau 1997, Perler 2001, Perler 2002, King 2007, Lagerlund 2007a, Black 2010, Amerini 2011, and Klima 2015)[^amerini-2011][^black-2010][^king-2007][^klima-2015][^knudsen-1982][^lagerlund-2007a][^pasnau-1997][^perler-2001][^perler-2002][^tweedale-1990].
    step1: |-
      在当代心灵哲学中，心理表征与意向性这两个概念内在地相关，因为通常认为，一个心理状态之所以具有内容、或关于自身之外的某物，是由于其表征本性。这些概念在中世纪哲学中也有平行的历史，如今已得到充分研究，至少直到布里丹为止（例如见 Knudsen 1982, Tweedale 1990, Pasnau 1997, Perler 2001, Perler 2002, King 2007, Lagerlund 2007a, Black 2010, Amerini 2011, 以及 Klima 2015）[^amerini-2011][^black-2010][^king-2007][^klima-2015][^knudsen-1982][^lagerlund-2007a][^pasnau-1997][^perler-2001][^perler-2002][^tweedale-1990]。
    step2: |-
      在当代心灵哲学中，心理表征与意向性是一对内在相关的概念：通常认为，一个心理状态之所以有内容、或指向自身之外的某物，正缘于它具有表征的本性。这两个概念在中世纪哲学中同样有一段平行的历史，如今研究已相当充分——至少到布里丹为止（例见 Knudsen 1982, Tweedale 1990, Pasnau 1997, Perler 2001, Perler 2002, King 2007, Lagerlund 2007a, Black 2010, Amerini 2011 与 Klima 2015）[^amerini-2011][^black-2010][^king-2007][^klima-2015][^knudsen-1982][^lagerlund-2007a][^pasnau-1997][^perler-2001][^perler-2002][^tweedale-1990]。
  - id: 2
    kind: body
    source: |-
      One reason for the interest in intentionality and representation in medieval philosophy is that it has been widely recognized that Franz Brentano was reviving a scholastic notion when he introduced intentionality as “the mark of the mental” (Brentano 1874)[^brentano-1874]. But Brentano never used the terminology of representation to explicate intentionality. This was done much later, in post-Wittgensteinian philosophy of mind. In later medieval philosophy, it was, however, standard to explain the content of a thought by referring to its representational nature.
    step1: |-
      中世纪哲学中对意向性与表征产生兴趣的一个原因在于，人们广泛承认：弗朗兹·布伦塔诺把意向性引为“心灵的标志”时，复兴的是一个经院哲学概念（Brentano 1874）[^brentano-1874]。但布伦塔诺从未用表征这一术语去阐释意向性。这是很久以后、在后维特根斯坦的心灵哲学中才做的事。然而在中世纪晚期哲学中，借一个思想的表征本性来解释其内容，本是标准做法。
    step2: |-
      中世纪哲学之所以关注意向性与表征，一个原因在于学界普遍承认：弗朗兹·布伦塔诺把意向性引为“心灵的标志”时，所复兴的乃是一个经院哲学概念（Brentano 1874）[^brentano-1874]。不过，布伦塔诺本人从未用表征这一术语去阐释意向性；那是很久以后、在后维特根斯坦的心灵哲学中才有的事。而在中世纪晚期哲学中，借思想的表征本性来解释其内容，本属标准做法。
  - id: 3
    kind: body
    source: |-
      There are a variety of theories of mental representation in medieval philosophy, which were intensely discussed from the twelfth century up to the time of Descartes. This article will briefly trace the history of the terminology and also give a brief outline of the main theories developed during the thirteenth and fourteenth centuries.
    step1: |-
      中世纪哲学中有多种心理表征理论，从十二世纪直到笛卡尔时代一直受到热烈讨论。本文简要追溯这一术语的历史，并简要勾勒十三、十四世纪发展起来的主要理论。
    step2: |-
      中世纪哲学中的心理表征理论形态多样，从十二世纪到笛卡尔时代一直是热烈讨论的对象。本文简要追溯相关术语的历史，并勾勒十三、十四世纪形成的主要理论。
