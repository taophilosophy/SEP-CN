    source: |-
      For various reasons, the late thirteenth century saw an increased interest in epistemology. One reason for this was the development of new theories of mental representations and intentionality. Some of these developments were due to problematic features of, on the one hand, Aquinas’s view of mental representation and on the other, of Henry of Ghent’s interpretation of Augustine’s view of divine cognition. Aquinas seems to have held that the intelligible species is supposed to play a dual role both as a universal common to all of us thinking it and as my individual thought. It is hard to see how such a view can be maintained without the introduction of some kind of distinction. Henry on the other hand reinterprets Augustine’s doctrine of divine ideas and introduces a distinction between the ideas and the divine nature. The ideas are possibilia or the natures of possible things to be created (de Rijk 2005: 81–84)[^rijk-2005].
    step1: |-
      由于种种原因，十三世纪晚期对认识论的兴味日增。原因之一是心理表征与意向性的新理论的发展。其中一些发展源于两类难题：一方面是阿奎那心理表征观的疑难，另一方面是根特的亨利对奥古斯丁神圣认知观的解释。阿奎那似乎认为，可理解种相应扮演双重角色：既是我们一切思考它的主体所共有的普遍者，又是我的个体思想。若不引入某种区分，很难看出这样的观点如何维持。亨利则重新解释奥古斯丁的神圣观念学说，并引入观念与神圣本性之间的区分。观念是可能者（possibilia），即可能被造之物的本性（de Rijk 2005: 81–84）[^rijk-2005]。
    step2: |-
      十三世纪晚期，认识论研究兴趣渐浓，原因不一。其一是心理表征与意向性新理论的兴起。这些进展部分源于两类难题。一是阿奎那心理表征观里的难点；二是根特的亨利对奥古斯丁神圣认知说的解释。阿奎那似乎主张，可理解种相须一身兼二任：既是众思考者共享的普遍者，又是我的个体思想——若不引入某种区分，很难看出此说如何站得住。亨利则重释奥古斯丁的神圣观念说，引入观念与神圣本性之别：观念是可能者（possibilia），即可能受造之物的本性（de Rijk 2005: 81–84）[^rijk-2005]。
