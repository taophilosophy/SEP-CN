      The theory of mental language in the fourteenth century was foremost developed by William Ockham. It rests on a theory of mental representation that combined the notions of cause and signification. A concept or a mental term on this view represents because it is caused efficiently by a thing in the world. It signifies that thing also because of the causal relation between them. On Ockham’s view, a mental representation or concept is caused by an intuitive cognition. He explains:
    step1: |-
      十四世纪的心灵语言理论主要由威廉·奥卡姆发展而来。它立足于一种结合了原因与意谓两个概念的心理表征理论。按此观点，一个概念或心灵词项之所以进行表征，是因为它由世界中的一物以动力因的方式造成。它也因二者之间的因果关系而意谓该物。按奥卡姆的看法，心理表征或概念由直观认知造成。他解释说：
    step2: |-
      十四世纪的心灵语言理论，主要由奥卡姆的威廉发展起来。它依托一种把“原因”与“意谓”结合起来的心理表征理论：按此说，一个概念或心灵词项之所以行表征之职，是因为它由世界中的某物以动力因造成；也正是由于二者之间的因果关系，它才意谓该物。依奥卡姆之见，心理表征或概念由直观认知造成。他解释道：
