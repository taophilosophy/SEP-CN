      In this passage, it seems clear that for Olivi the species is a thing in itself and that there really are three things involved in the cognition of an object: the object, the species, and the cognizer. The species is on his view a representation, namely a thing that stands in for the object in the mind. The main problem he sees with the theory is hence epistemological. How can we be sure we are cognizing the object and not the species (see Toivanen 2009, Chap. 4 and Adriaenssen 2011)[^toivanen-2009]. Olivi hence argues that this third representing thing is not needed and that the mind can attend to the object directly. Ockham is later on in the early fourteenth century to repeat a similar argument against the species theory.
    step1: |-
      在这段话里，奥利维显然认为种相是一个自在之物，而且认知一个对象确实涉及三样东西：对象、种相与认知者。按他的看法，种相是一种表征，即在心灵中代替对象的东西。因此他看到这一理论的主要问题是认识论的：我们如何能确信自己在认知对象，而不是在认知种相（见 Toivanen 2009, Chap. 4 与 Adriaenssen 2011）[^toivanen-2009]。奥利维因此主张，这第三个进行表征的东西并不需要，心灵可以直接注意对象。奥卡姆后来在十四世纪初重复了针对种相理论的类似论证。
    step2: |-
      在此，奥利维显然把种相视为一个自在之物；认知一个对象，确有三样东西参与：对象、种相与认知者。依他之见，种相是一种表征，即在心灵中代替对象者。于是他看出的主要问题便是认识论的：我们如何能确知自己在认知对象，而非在认知种相（见 Toivanen 2009, Chap. 4 与 Adriaenssen 2011）[^toivanen-2009]。奥利维由此主张，这第三个行表征之职的东西并不必要，心灵可以直接注意对象。奥卡姆后来在十四世纪初，又重复了针对种相理论的类似论证。
