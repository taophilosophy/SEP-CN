    source: |-
      Buridan is defending an internalist semantics for singular terms. It is not internalist because of the two different kinds of singular terms or that they both are collections of descriptions and circumstances in which we have interacted with something, but instead because the imposition of these terms describes a process that is completely internal to the agent. It is up to us to sort names with descriptions and circumstances and, hence, impose certain names on these descriptions and circumstances. Give this, two speakers of the same language could have the same name for an individual and even be using it for the same individual despite the fact that the names they use have different content or meaning because they have different descriptions in mind during the conversation. Meaning is, hence, in the head for Buridan. A position quite different from Ockham (for more on this see Panaccio 2017 and Lagerlund 2024)[^lagerlund-2024][^panaccio-2017].
    step1: |-
      布里丹为单称词项捍卫一种内在主义语义学。它之所以是内在主义的，不是因为单称词项有两类，也不是因为它们都是描述与我们曾与之交互的情境的集合，而是因为：这些词项的赋予所描述的，是一个完全内在于行动者的过程。把名称与描述、情境相配，从而把某些名称强加于这些描述与情境，取决于我们自己。既然如此，同一种语言的两位说话者可以对一个个体拥有同一个名称，甚至用它指同一个个体，尽管他们所用的名称具有不同的内容或意义，因为他们在交谈时所想到的描述不同。因此，对布里丹而言，意义在头脑之中。这一立场与奥卡姆颇为不同（详见 Panaccio 2017 与 Lagerlund 2024）[^lagerlund-2024][^panaccio-2017]。
    step2: |-
      布里丹为单称词项辩护的，是一种内在主义语义学。其内在主义不在于单称词项分两类，也不在于它们都是描述与我们曾交互过的情境的集合；而在于：对词项的赋予所描述的那个过程，完全内在于行动者。把名称与描述、情境相配，进而把某些名称赋予这些描述与情境，皆取决于我们自己。既然如此，同一语言的两位说话者，可以对同一个体使用同一个名称，甚至用它指同一个体——尽管由于交谈时心中所想的描述不同，他们所用名称的内容或意义并不相同。于是，在布里丹那里，意义在头脑之中。这一立场与奥卡姆相去甚远（详见 Panaccio 2017 与 Lagerlund 2024）[^lagerlund-2024][^panaccio-2017]。
