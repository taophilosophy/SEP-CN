      Buridan thinks that we always in the first instance cognize or conceive of something as singular. There are, however, two kinds of singular concepts, namely, vague and determinate singular concepts. There are also two ways a singular concept or mental term can be acquired. The vague terms are acquired through perception and involves a direct acquaintance with the perceived object. Buridan describes how we see something approaching from a distance and cognize it as ‘this thing’, then as ‘this body’, then as ‘this animal’, then as ‘this donkey’, and finally as ‘Brunellus.’ (For more on this and its significance see Normore 2007, Black 2011, Lagerlund 2006, and Lagerlund 2014.)[^black-2011][^lagerlund-2014][^lagerlund-2006][^normore-2007] These demonstratives describe circumstances in which we cognize something singularly, and they come together under a description of a singular thing, which we impose on it ourselves or have learned the name of, in this case, ‘Brunellus.’ The vague singular term is a name for a circumstance in which we cognize a non-determinate singular thing as something, for example, an individual thing, body, donkey, etc. There is, however, another way a singular can be formed and that is by imposing or associating it with a name of some descriptions or properties that we never have had a corresponding vague singular cognition of, since we have no actual acquaintance with the thing through sense perception. These are singular terms like ‘Socrates’ or ‘Plato.’ They have never directly existed before our senses and intellect. We only know them through descriptions. Buridan explains the difference in *Summulae de Dialectica* 8.2.1 (Buridan *SD*, 633):
    step1: |-
      布里丹认为，我们总是首先把某物认知或设想为单称的。然而单称概念有两类，即模糊的单称概念与确定的单称概念。单称概念或心灵词项也有两种获得方式。模糊词项通过感知获得，涉及与被感知对象的直接亲知。布里丹描述了我们如何看见某物从远处接近，先把它认知为“这个东西”，再认知为“这个物体”，再认知为“这个动物”，再认知为“这头驴”，最后认知为“布吕内卢斯”（Brunellus）。（关于这一点及其意义，另见 Normore 2007, Black 2011, Lagerlund 2006 与 Lagerlund 2014。）[^black-2011][^lagerlund-2014][^lagerlund-2006][^normore-2007] 这些指示词描述了我们单称地认知某物的种种情境，它们汇合在一个关于单称之物的描述之下，而这个描述是我们自己强加于它的，或者是我们学会了它的名称，在此例中即“布吕内卢斯”。模糊单称词项是一个情境的名称，在其中我们把一个非确定的单称之物认知为某种东西，例如一个个体物、物体、驴等等。然而，单称词项还有另一种形成方式，即把它强加于、或联系于某些描述或属性的名称，而我们从未有过与之相应的模糊单称认知，因为我们从未通过感官感知实际亲知该物。这类单称词项如“苏格拉底”或“柏拉图”。它们从未直接存在于我们的感官与理智之前。我们只是通过描述来认识它们。布里丹在《辩证法纲要》8.2.1 中解释了这个差异（Buridan *SD*, 633）：
    step2: |-
      布里丹认为，我们最初总是把某物认知或设想为单称的。单称概念却有两类：模糊的单称概念与确定的单称概念；单称概念或心灵词项的获得也有两种方式。模糊词项经由感知获得，涉及与被感知对象的直接亲知。布里丹描述了这样一幕：我们看见某物自远处靠近，先把它认知为“这个东西”，继而“这个物体”，继而“这个动物”，继而“这头驴”，最后认知为“布吕内卢斯”（Brunellus）。（详见 Normore 2007, Black 2011, Lagerlund 2006 与 Lagerlund 2014。）[^black-2011][^lagerlund-2014][^lagerlund-2006][^normore-2007] 这些指示词所描述的，是我们单称地认知某物的种种情境；它们汇合于关于某个单称之物的描述之下——这描述或由我们自己强加于它，或是我们学会了它的名称，在此例中即“布吕内卢斯”。模糊单称词项，是一个情境的名称：在其中，我们把一个非确定的单称之物认知为某种东西，例如一个个体物、一个物体、一头驴等等。然而，单称词项还有另一种形成方式：把它赋予、或联系于某些描述或属性的名称，而我们从未有过与之相应的模糊单称认知，因为从未通过感官感知实际亲知该物。这类单称词项如“苏格拉底”“柏拉图”：它们从未直接呈现于我们的感官与理智之前，我们只是通过描述认识它们。布里丹在《辩证法纲要》8.2.1 中说明了这一差异（Buridan *SD*, 633）：
