      According to Ockham’s metaphysics there are only individuals in the world so that when an individual causes a concept to exist in the mind, it causes an individual concept and hence a singular conception of itself. Nothing else can cause that concept (except perhaps God). The singular concept functions as the word of the object that caused it in our language of thought. It is an atomic constituent that can then be combined to form more complex concepts or sentences in the language.
    step1: |-
      按奥卡姆的形而上学，世界中只有个体，因此当一个个体使一个概念在心灵中存在时，它造成的是一个个体概念，从而是关于自身的一个单称概念。没有别的东西能造成那个概念（或许上帝除外）。这个单称概念在我们的思想语言中充当造成它的那个对象的词。它是一个原子成分，可以组合起来，形成语言中更复杂的概念或句子。
    step2: |-
      按奥卡姆的形而上学，世界中只有个体。因此，当某个个体使一个概念在心灵中产生时，它造成的是一个个体概念，也就是关于它自身的一个单称概念；除上帝或许例外，别无他物能造成该概念。这个单称概念在我们的思想语言中，充当那个致其产生之对象的“词”。它是一个原子成分，可与其他成分组合，形成语言中更复杂的概念或句子。
