      Both of these views contribute to the introduction of a distinction between the vehicle and the content of a representation. The distinction developed by Henry in relation to the divine nature was almost immediately taken up into the debates about human cognition. It was applied to Aquinas’s theory of mental representation, taking it a step further by introducing a distinction between the thing representing and the thing represented.
    step1: |-
      这两种观点都有助于引入表征的载体与内容之间的区分。亨利就神圣本性所发展的区分，几乎立刻被纳入关于人类认知的讨论。它被应用于阿奎那的心理表征理论，并更进一步，引入进行表征之物与被表征之物之间的区分。
    step2: |-
      这两种观点都促成了“表征的载体”与“表征的内容”之分。亨利围绕神圣本性提出的区分，几乎立即进入人类认知的论争：人们把它用于阿奎那的心理表征理论，并推进一步，引入“行表征之职者”与“被表征之物”的区分。
