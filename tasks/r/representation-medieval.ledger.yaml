      Both Olivi and Ockham seem to take it for granted that species are representations and hence a thing added to the object and the cognizer. There were, however, two versions of the species theory of cognition in the thirteenth century. The most influential one was foremost associated with Roger Bacon. According to him, species are representations, that is, real extended images like objects representing the thing cognized to the cognizer. The other version of the theory was defended by Aquinas. According to him, species were not representations but the forms themselves of the objects cognized under a different mode of being. The species were not real but spiritual and as such there are no physical change of for example the eye in a visual perception; only a spiritual one.
    step1: |-
      奥利维与奥卡姆似乎都理所当然地认为，种相是表征，因而是加在对象与认知者之上的一样东西。然而十三世纪的种相认知理论有两个版本。最有影响的版本首先与罗吉尔·培根相联系。按他之说，种相是表征，即实在而有广延、类似对象的影像，向认知者表征被认知之物。该理论的另一版本由阿奎那捍卫。按他之说，种相不是表征，而是被认知对象自身的形式，只是处于不同的存在方式之下。种相不是实在的，而是精神的；因此，例如在视觉感知中，眼睛并无物理变化，只有精神的变化。
    step2: |-
      奥利维与奥卡姆似乎都理所当然地认定：种相就是表征，也就是加在对象与认知者之上的一个东西。然而，十三世纪的种相认知理论本有两个版本。影响最大的版本首先与罗吉尔·培根相连：在他看来，种相是表征，即实在而有广延、类似对象的影像，向认知者表征被认知之物。另一版本由阿奎那捍卫：种相不是表征，而是被认知对象自身的形式，只不过处于另一种存在方式之下。种相不是实在的，而是精神的；因此，譬如在视觉感知中，眼睛并无物理变化，只有精神的变化。
