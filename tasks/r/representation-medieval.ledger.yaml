  - id: 5
    kind: body
    source: |-
      The English words ‘representation’ and ‘to represent’ derive via Old French from the Latin words ‘repraesentatio’ and ‘repraesentare,’ but these are by no means commonly used words in classical Latin. In late ancient thought it is foremost Quintilian and Tertullian that uses the terms in a philosophically interesting way. It was not until the twelfth century Latin translation of Avicenna’s *De anima* that these terms became frequently used in connection with cognition and the mind or the intellective soul (see Lagerlund 2007b)[^lagerlund-2007b].
    step1: |-
      英语词“representation”与“to represent”经由古法语源自拉丁语词“repraesentatio”与“repraesentare”，但这些词在古典拉丁语中绝非常用词。在古代晚期思想中，首先以哲学上饶有意味的方式使用这些术语的是昆体良与德尔图良。直到十二世纪阿维森纳《论灵魂》（*De anima*）的拉丁译本问世，这些词才在与认知以及心灵或理智灵魂的关联中被频繁使用（见 Lagerlund 2007b）[^lagerlund-2007b]。
    step2: |-
      英语的“representation”与“to represent”经由古法语源自拉丁语“repraesentatio”与“repraesentare”，但二者在古典拉丁语中绝非常用词。古代晚期思想中，最先以哲学上饶有意味的方式使用这两个词的，是昆体良与德尔图良。直到十二世纪阿维森纳《论灵魂》（*De anima*）的拉丁译本问世，它们才在与认知、心灵或理智灵魂的关联中被频繁使用（见 Lagerlund 2007b）[^lagerlund-2007b]。
  - id: 6
    kind: body
    source: |-
      The Latin translators of Avicenna rendered several related terms in Arabic all related to cognition and the internal senses with the Latin ‘repraesentatio’. In doing so they, intentionally or not, formed the concept of representations in the soul. Representation in the Latin translation of Avicenna is associated with all five faculties. Forms received through the common sense and stored in the phantasia are called representations. The imaginative or cogitative faculty combines and divides representations collected in the phantasia to make new representations, which might not have any real object corresponding to them. The senses apprehend the sensible forms of the objects perceived and the estimative faculty apprehends the ‘intentio’ or ‘ma’na’ of the perceived object. Representations in the imagination are also the basis for intellectual activity, according to this view of cognition:
    step1: |-
      阿维森纳的拉丁译者用拉丁语“repraesentatio”来翻译阿拉伯语中若干彼此相关、都涉及认知与内部感觉的术语。无论有意与否，他们由此形成了灵魂中的表征这一概念。在阿维森纳的拉丁译本中，表征与全部五种能力相关。经由共通感接受并储存于表象（*phantasia*）中的形式被称为表征。想象能力或思维能力把汇集在表象中的表征加以组合与划分，造成新的表征，而这些新表征可能没有任何实在对象与之对应。感觉把握所感知对象的可感形式，估量力则把握所感知对象的“意向”（*intentio*）或“ma'na”。按照这种认知观，想象之中的表征也是理智活动的基础：
    step2: |-
      阿维森纳的拉丁译者用“repraesentatio”一词，翻译阿拉伯语中若干个彼此相关、皆涉认知与内部感觉的术语。无论有意与否，他们由此造就了“灵魂中的表征”这一概念。在阿维森纳的拉丁译本里，表征与全部五种能力相关：经由共通感接受、并储存于表象（phantasia）之中的形式，便称作表征。想象能力或思维能力把汇集于表象中的表征组合、划分，造出新的表征——这些新表征可能并无任何实在对象与之对应。感觉把握所感知对象的可感形式，估量力则把握其“意向”（intentio）或“ma'na”。依这种认知观，想象之中的表征同样是理智活动的基础：
  - id: 7
    kind: body
    source: |-
      > In the intellect, the form of animal is of the sort that agrees with one and the same definition of many particular [things]. Thus, one form in the intellect will be related to many things, and it is in this respect that it is universal, because it is one intention in the intellect … which is evident since, of those [things] represented by the form in the imagination, the intellect has plundered the intention of its accidents [and] acquired the form in the intellect. (*Liber de philosophia prima sive scientia divina* V, cap. 1, p. 237)
    step1: |-
      > 在理智中，动物的形式是这样一种形式：它与许多个别[事物]的同一个定义相合。因此，理智中的一个形式将关涉许多事物，正是在这一点上它是普遍的，因为它是理智中的一个意向……这一点显而易见：理智从想象中形式所表征的那些[事物]里，剥离了其偶性的意向，[并]获得了理智中的形式。（《第一哲学或神圣科学》V, cap. 1, p. 237）
    step2: |-
      > 在理智中，动物的形式与许多个别[事物]的同一个定义相合。于是，理智中的一个形式关涉许多事物；它正是在这一点上是普遍的，因为它是理智中的一个意向……此点显而易见：理智从想象中形式所表征的那些[事物]里，剥取了偶性的意向，[并]获得了理智中的形式。（《第一哲学或神圣科学》V, cap. 1, p. 237）
  - id: 8
    kind: body
    source: |-
      Avicenna here describes the process of abstraction, or how the representation in the imagination of particular things becomes universal in the intellect. The universal forms are abstracted from representations in the imagination and flow from the active intellect into the passive. Note, however, that the terminology of representation is never used in relation to the intellect. It is always the internal senses that represent in Avicenna and not the intellect or the external senses (see Lagerlund 2007b, for a table of the whole range of terms translated by ‘representation’ in Avicenna’s works.)[^lagerlund-2007b]
    step1: |-
      阿维森纳在此描述的是抽象过程，即个别事物在想象之中的表征如何成为理智中的普遍者。普遍形式从想象之中的表征抽象而来，并从主动理智流入被动理智。然而要注意，表征这一术语从未被用于理智。在阿维森纳那里，进行表征的始终是内部感觉，而非理智或外部感觉（关于阿维森纳著作中由“表征”所译的整个术语范围，见 Lagerlund 2007b 的表格）[^lagerlund-2007b]。
    step2: |-
      阿维森纳在此描述的是抽象过程：个别事物在想象之中的表征，如何变成理智中的普遍者。普遍形式从想象之中的表征抽象而出，再由主动理智流入被动理智。但须注意：表征这一术语从未用于理智。在阿维森纳那里，行表征之事的始终是内部感觉，而非理智或外部感觉（阿维森纳著作中由“表征”所译的整个术语范围，见 Lagerlund 2007b 的表格）[^lagerlund-2007b]。
  - id: 9
    kind: body
    source: |-
      One of the reasons ‘representation’ is only used for the internal senses is that representations are thought of as images. The notion of linguistic representations or representations as signs is not present in Avicenna’s work or any other work of the time. It seems instead to derive from logic. Early logic works like Garlandus Compotista’s *Dialectica* (17) and Abelard’s *Dialectica* (II, 188) discussed a distinction between a word’s signification by imposition and representation. A denominative term such as ‘white’ signifies by imposition a substance that is white, but it signifies by representation the whiteness inhering in the substance. The white thing stands in for or is an instantiation of whiteness; white is re-presented in the object. Garlandus mentions the example of a traveler (‘*viator*’) who can be said to represent a road (‘*via*’). The term ‘traveler’ signifies by imposition the human being who is a traveler, but also represents the road the traveler travels on. It is exactly this usage of representation applied to mental signs that becomes important with Ockham and Buridan.
    step1: |-
      “表征”只用于内部感觉的原因之一，是表征被设想为影像。语言表征、或作为符号的表征这一观念，在阿维森纳的著作中并不存在，在当时的其他著作中也不存在。它似乎反而源于逻辑学。早期逻辑学著作，如加兰杜斯·孔波蒂斯塔的《辩证法》（*Dialectica*）（17）与阿伯拉尔的《辩证法》（*Dialectica*，II, 188），讨论过一个词依约定赋予而意谓与凭表征而意谓之间的区分。像“white”（白）这样的派生词，依约定赋予意谓一个白色的实体，却凭表征意谓内在于该实体的白性。白色之物代替白性、或是白性的一个实例；白在对象中被重新呈现。加兰杜斯举了旅行者（*viator*）之例：可说旅行者表征道路（*via*）。“旅行者”一词依约定赋予意谓那个身为旅行者的人，却也表征旅行者所行经的道路。正是这种把表征用于心灵符号的用法，到奥卡姆与布里丹那里变得重要起来。
    step2: |-
      “表征”之所以只用于内部感觉，原因之一在于表征被设想为影像。语言表征、或“作为符号的表征”这一观念，在阿维森纳乃至当时任何著作中都不存在；它似乎另有逻辑学的源头。早期逻辑学著作——如加兰杜斯·孔波蒂斯塔的《辩证法》（*Dialectica*，17）与阿伯拉尔的《辩证法》（*Dialectica*，II, 188）——曾讨论一个词“依约定赋予而意谓”与“凭表征而意谓”的区分。像“white”（白）这样的派生词，依约定赋予意谓一个白色的实体，却凭表征意谓内在于该实体的白性：白色之物代替白性，或说是白性的一个实例；白在对象中被重新呈现。加兰杜斯举过旅行者（*viator*）之例：可以说旅行者表征道路（*via*）。“旅行者”一词依约定赋予意谓那个身为旅行者的人，却也表征旅行者所行经的道路。正是这种把表征用于心灵符号的用法，到奥卡姆与布里丹那里变得重要起来。
