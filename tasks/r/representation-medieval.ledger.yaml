      John Duns Scotus was instrumental in adapting this view to human cognition. Scotus’s implemented Henry’s distinction and treated the thing that does the representing as a mental act or concept, which ontologically speaking is an accident of the mind, and the thing represented as the form of the object thought about. Scotus claimed that the accident or mental act is subjectively in the soul, whereas the object being represented is present objectively, or has objective being in the mind. He also said that the object exists as represented to express the content side of the mental representation (Ord. I, d. 3, pars 3, q. 1, n. 382) Scouts can through this distinction also maintain that all spiritual change supervenes on a real change (see Cross 2014)[^cross-2014].
    step1: |-
      约翰·邓斯·司各脱在把这一观点移用于人类认知方面起了关键作用。司各脱实施亨利的区分，把进行表征的东西视为心灵行为或概念——从本体论上说，这是心灵的一种偶性——把被表征的东西视为所思对象的形式。司各脱主张，偶性或心灵行为主观地存在于灵魂之中，而被表征的对象则客观地临在，或在心灵中具有客观存在。他还说，对象作为被表征者而存在，以表达心理表征的内容一面（Ord. I, d. 3, pars 3, q. 1, n. 382）。借这一区分，司各脱还能主张：一切精神变化都随附于实在变化（见 Cross 2014）[^cross-2014]。
    step2: |-
      把这一观点移用于人类认知，约翰·邓斯·司各脱居功至伟。他采纳亨利的区分：行表征之职者，是心灵行为或概念——本体论上属心灵的偶性；被表征者，则是所思对象的形式。司各脱主张，偶性或心灵行为主观地存在于灵魂之中，而被表征的对象则客观地临在，即在心灵中具有客观存在。他还说，对象“作为被表征者而存在”，用以表达心理表征的内容一面（Ord. I, d. 3, pars 3, q. 1, n. 382）。凭此区分，司各脱也得以主张：一切精神变化皆随附于实在变化（见 Cross 2014）[^cross-2014]。
