      ## 2 托马斯·阿奎那与形式同一
  - id: 11
    kind: body
    source: |-
      The most influential theory of thought in the thirteenth century goes back to Aristotle and has its foremost medieval defender in Thomas Aquinas. It rests on viewing mental representations or intelligible species, as Aquinas calls them, as sameness of form. The explanation for why thoughts are about something, exhibit intentionality, or represent is that the form of the object thought about is in the mind of the thinker. According to a popular metaphor, thinking something, on this view, is being the object thought about in the sense that the intellect becomes the object or takes on its form.
    step1: |-
      十三世纪最有影响的思想理论可追溯到亚里士多德，其最重要的中世纪捍卫者是托马斯·阿奎那。这一理论立足于把心理表征——或阿奎那所称的可理解种相——视为形式的同一。思想何以关于某物、表现出意向性、或进行表征，其解释在于：所思对象的形式在思考者的心灵之中。按一种流行的比喻，在这种观点下，思考某物就是成为所思对象，其意义是理智变成该对象、或取得该对象的形式。
    step2: |-
      十三世纪最有影响的思想理论可追溯至亚里士多德，其最突出的中世纪捍卫者是托马斯·阿奎那。此说立足于把心理表征——或阿奎那所称的“可理解种相”——理解为形式的同一。思想何以关于某物、何以表现出意向性、何以有所表征？解释在于：所思对象的形式就在思考者的心灵之中。依一种流行的比喻，按此说，思考某物便是“成为”所思对象——理智变成了该对象，或取得了它的形式。
  - id: 12
    kind: body
    source: |-
      Following Aristotle in *De anima* III.4, Aquinas argues, that the mind or the intellective part of the soul has no nature or rather it is nothing before it thinks of something. The active intellect abstracts the intelligible species from the sensitive species in the internal senses and places it in the potential intellect. Aquinas is here very close to the view we saw Avicenna defend above. The species actualizes the potential intellect as a form actualizes a potency. The intelligible species in the potential intellect constitutes the thought. The intellect is immaterial, according to Aquinas, and since he also famously thinks that matter is the principle of individuation, the intelligible species in the potential intellect is not individual, but universal. This is why Aquinas holds that a thought is always universal.
    step1: |-
      阿奎那追随亚里士多德《论灵魂》III.4，论证说心灵或灵魂的理智部分没有本性，或者毋宁说，它在思考某物之前什么也不是。主动理智从内部感觉中的感性种相抽象出可理解种相，并把它置于潜能理智之中。阿奎那在此非常接近我们上文所见阿维森纳的立场。种相使潜能理智现实化，正如形式使潜能现实化。潜能理智中的可理解种相构成思想。按阿奎那之说，理智是非物质的；又因为他同样著名地认为物质是个体化原理，所以潜能理智中的可理解种相不是个体的，而是普遍的。这就是阿奎那认为思想总是普遍的原因。
    step2: |-
      阿奎那追随亚里士多德《论灵魂》III.4，主张心灵即灵魂的理智部分并无本性，或者说，它在思考某物之前什么也不是。主动理智从内部感觉的感性种相中抽象出可理解种相，将其置入潜能理智。此处阿奎那与上文所述阿维森纳的立场极为接近：种相使潜能理智现实化，正如形式使潜能现实化；潜能理智中的可理解种相构成思想。阿奎那认为理智是非物质的；又因他同样以“物质是个体化原理”著称，潜能理智中的可理解种相便非个体，而是普遍的。这正是阿奎那断定思想总是普遍的原因。
  - id: 13
    kind: body
    source: |-
      There are many problems associated with this view of mental representation. A famous problem is: why are the daffodils outside my soul not about my thought of the daffodils? The forms inside and outside my mind are the same, suggesting that mental representation is symmetrical. Aquinas has a famous answer to this problem, which is that the daffodils in the garden are not about my thought because of the mode of the form’s presence in them. The forms in the daffodils are really or naturally present whereas in my mind the universal form is spiritually or intentionally present.
    step1: |-
      与这种心理表征观相关的问题很多。一个著名问题是：为什么我灵魂之外的水仙花并不关于我对水仙花的思想？我心灵内外的形式是相同的，这似乎表明心理表征是对称的。阿奎那对此有一个著名回答：花园里的水仙花并不关于我的思想，原因在于形式在它们之中临在的方式。水仙花中的形式是实在地或自然地临在的，而在我心灵中，普遍形式是精神地或意向地临在的。
    step2: |-
      与这种心理表征观相连的问题不少。一个著名的问题是：我灵魂之外的水仙花，为何并不“关于”我对水仙花的思想？我心灵内外的形式相同，这似乎意味着心理表征是对称的。阿奎那有一个著名的回答：园中水仙花并不关于我的思想，关键在于形式以何种方式临在于它们。水仙花中的形式实在地或自然地临在；在我心灵中，普遍形式则精神地或意向地临在。
  - id: 14
    kind: body
    source: |-
      The distinction between forms being really/naturally or spiritually/intentionally present is central to Aquinas’s theory of cognition. A form may be present somewhere without literally making whatever substance it informs into something else. Colors in the air, for example, do not make the air really colored: we see colors in the objects around us but not in the intervening air, although they must be there spiritually if sensation is to be a causal process. This means, of course, that the air must somehow contain the color, which entails that intentionality is not a mark of the mental for Aquinas. The air is not in itself a mind (for discussion, see Pasnau 1997, Chap. 2, and for a completely different take see Brower and Brower-Toland 2008)[^brower-2008][^pasnau-1997].
    step1: |-
      形式之实在/自然地临在与精神/意向地临在这一区分，是阿奎那认知理论的核心。一个形式可以在某处临在，却并不字面地使它所充灌的任何实体变成别的东西。例如空气中的颜色并不使空气真的带上颜色：我们在周围对象中看见颜色，却不在中间隔着的空气中看见，尽管若感觉要是因果过程，颜色就必须以精神的方式存在于空气中。这当然意味着空气必定以某种方式包含颜色，而这又蕴含：对阿奎那而言，意向性并不是心灵的标志。空气本身并不是一个心灵（讨论见 Pasnau 1997, Chap. 2；完全不同的解读见 Brower and Brower-Toland 2008）[^brower-2008][^pasnau-1997]。
