    source: |-
      Scotus thus had a clear way of expressing what Brentano later called intentionality, that is, the way the object of thought exists in the mind. It has objective existence in the mind on his view, which later came to be regarded as the mark of the mental (see Normore 1986; Pasnau 2003; King 2007; Cross 2014)[^cross-2014][^king-2007][^normore-1986][^pasnau-2003]. Although the advantages of this approach over Aquinas’s are clear, problems remains concerning the ontological status of these mental contents. The medieval debate here is famous and features a wide variety of opinions (for a survey, see Tachau 1988)[^tachau-1988]. Scotus himself says that thought objects have a diminished kind of being, which is supposed to be a state between real being and no being at all. Although first accepting a similar view, Ockham would later subject this view to much criticism.
    step1: |-
      司各脱因此有一种清楚的方式来表达布伦塔诺后来所称的意向性，即思想的对象在心灵中存在的方式。按他的看法，对象在心灵中具有客观存在；这一点后来被视为心灵的标志（见 Normore 1986; Pasnau 2003; King 2007; Cross 2014）[^cross-2014][^king-2007][^normore-1986][^pasnau-2003]。尽管这一进路相对于阿奎那的进路有明显优势，但关于这些心理内容的本体论地位，问题仍然存在。这里的中世纪争论很有名，意见纷繁多样（综述见 Tachau 1988）[^tachau-1988]。司各脱本人说，思想对象具有一种减弱的存在，据说那是介于实在存在与全无存在之间的状态。奥卡姆起初接受类似观点，后来却对这一观点大加批评。
    step2: |-
      司各脱由此获得一种清楚的方式，来表达布伦塔诺后来所称的意向性——即思想对象在心灵中存在的方式。依他之见，对象在心灵中具有客观存在；这一点后来被视为心灵的标志（见 Normore 1986; Pasnau 2003; King 2007; Cross 2014）[^cross-2014][^king-2007][^normore-1986][^pasnau-2003]。此进路较阿奎那之说显然有优势，但这类心理内容的本体论地位仍成问题。中世纪的相关争论十分著名，意见纷纭（综述见 Tachau 1988）[^tachau-1988]。司各脱本人说，思想对象具有一种减弱的存在，据说是介于实在存在与全无存在之间的状态。奥卡姆起初也接受类似观点，后来却对此大加批评。
