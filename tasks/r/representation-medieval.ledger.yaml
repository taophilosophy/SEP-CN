    source: |-
      Ockham and John Buridan’s accounts of thought are on the one hand very similar, but on the other hand there are fundamental differences between them. This is particularly true about their view of mental representation. A case in point is their views of singular thought. They both start out from the same idea, that is, that thinking something singular is having a singular concept in mind, but they disagree fundamentally on what a singular concept looks like and, foremost, on how it manages to latch onto the world. On Ockham’s account a concept is singular because its cause is proper, as he calls it, and proper causes are necessarily tied to one object. But on Buridan’s account, a singular concept is singular because of its semantic complexity (see Klima 2001: xxxviii–xlii and 2009: 40–56)[^klima-2001][^klima-2009]. It has a descriptive content that enables it to narrow down its signification. However, Buridan retains Ockham’s view for some terms (for the significance of this difference from Ockham, see Klima 2009: 69–89)[^klima-2009].
    step1: |-
      奥卡姆与约翰·布里丹的思想学说一方面非常相似，另一方面又有根本差异。他们的心理表征观尤其如此。单称思想之见即是一例。二人都从同一观念出发，即：思考某个单称之物，就是在心中拥有一个单称概念；但对于单称概念是什么样子、尤其是它如何设法抓住世界，二人有根本分歧。按奥卡姆之说，一个概念是单称的，因为其原因是他所称的专有原因，而专有原因必然与一个对象相联系。但按布里丹之说，一个单称概念之所以是单称的，是因为其语义上的复杂性（见 Klima 2001: xxxviii–xlii 与 2009: 40–56）[^klima-2001][^klima-2009]。它具有描述性内容，使其得以收窄自己的意谓。不过，布里丹对某些词项仍保留奥卡姆的观点（这一差异与奥卡姆之别的重要意义，见 Klima 2009: 69–89）[^klima-2009]。
    step2: |-
      奥卡姆与布里丹的思想学说，一方面极为相似，另一方面又有根本差异，其心理表征观尤其如此。单称思想便是一例：二人都从同一观念出发——思考某个单称之物，就是在心中拥有一个单称概念；但对于单称概念是什么样子，尤其是它如何设法抓住世界，二人分歧根本。按奥卡姆之说，概念之所以单称，是因为其原因乃他所谓的“专有原因”，而专有原因必然系于一个对象。按布里丹之说，单称概念之所以单称，则是因为其语义的复杂性（见 Klima 2001: xxxviii–xlii 与 2009: 40–56）[^klima-2001][^klima-2009]：它具有描述性内容，足以收窄自身的意谓。不过，布里丹对某些词项仍保留奥卡姆的观点（这一差异相对奥卡姆的意义，见 Klima 2009: 69–89）[^klima-2009]。
