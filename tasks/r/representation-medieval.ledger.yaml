      He seems to think that all proper singular terms are collections of descriptions of a thing under a name. This goes for singulars that I am acquainted with as well as singulars I have no sense acquaintance with. Assume that I have the concept ‘Brunellus’ in my mental language, which I have formed through vague singulars, that is, through circumstances in which I have perceived him as this or that. These vague singulars express the demonstrative aspect of my experience of Brunellus. They come together under the singular term ‘Brunellus’ with all the things I ‘know’ about him. I have no such demonstrative element in my singular terms of ‘Socrates’ and ‘Plato,’ since they have never and cannot exist in a direct sense cognition. In that respect, there is nothing part of such singular terms that discriminate them from other term than the sum of descriptions I have sorted under these terms. They will, to use Saul Kripke’s terminology, never rigidly pick out what they signify. ‘Brunellus’ on the other hand will, because of the demonstrative element derived from my actual interactions with him. (For a slightly different take on this preserving the rigid designation of terms like 'Socrates' or 'Plato' see Klima 2009, Chapter 4, Section 4.2.)[^klima-2009]
    step1: |-
      他似乎认为，一切真正的单称词项都是某个名称之下关于一物的描述集合。这既适用于我所亲知的单称之物，也适用于我没有感觉亲知的单称之物。假定我的心灵语言中有“布吕内卢斯”这一概念，它是我通过模糊单称之物形成的，即通过我把他感知为这个或那个的情境形成的。这些模糊单称之物表达了我对布吕内卢斯的经验中的指示性一面。它们连同我“知道”的关于他的一切，汇合在“布吕内卢斯”这一单称词项之下。在我关于“苏格拉底”与“柏拉图”的单称词项中，没有这样的指示性要素，因为他们从未、也不能存在于直接的感观认知中。就此而言，这类单称词项中没有任何部分能使它们区别于其他词项，除了我归置在这些词项之下的描述总和。用索尔·克里普克的术语说，它们将永远不能严格指示它们所意谓的东西。另一方面，“布吕内卢斯”却能够，因为其中含有源于我与他实际交互的指示性要素。（关于一种略有不同、但保留“苏格拉底”或“柏拉图”这类词项的严格指称的读法，见 Klima 2009, Chapter 4, Section 4.2。）[^klima-2009]
