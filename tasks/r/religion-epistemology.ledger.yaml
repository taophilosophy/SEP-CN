      One response to the problematic is to separate evidentialism from the hegemony of epistemology. Evidentialism may then be defended by noting how we implicitly rely upon evidentialist principles in many different areas of enquiry, or by noting which principles generalise various particular examples of justified and unjustified reasoning. Such a defence of evidentialism is part of the project of some contemporary philosophers who seek to attack theism in favour of agnosticism and/or atheism. This defence may well be implicit in Flew’s famous “The Presumption of Atheism” (1972). It is more explicit in Scriven’s *Primary Philosophy* (1966, ch 4). Scriven and Flew are relying on the Ockhamist principle that, in the absence of evidence for the existence of things of kind *X*, belief in *X*s is not reasonable. This they can defend by means of examples in which non-Ockhamist thinking is judged not to be justified. So even if the whole of evidentialism is not defended, the Ockhamist fragment of it may be.
    step1: TBD
    step2: TBD
