      Perhaps the most obvious criticism of Wittgensteinian fideism is that even if the underlying theory of forms of life and language games is granted, it is an historical fact, itself justified by the criteria of the “game” of history, that the tradition to which the majority of Jews, Christians and Muslims belong to is a form of life with heavy metaphysical commitments, and in which such utterances as “There is a God” are intended as much like “There is a star ten times more massive than the Sun” as like “There is hope”. So Wittgensteinian fideism is only appropriate for such religions as Zen Buddhism and for some, relatively recent, liberal strands of Judaism and Christianity which have rejected the traditional metaphysical commitment (as in Cupitt 1984)[^cupitt-1984].
    step1: |-
      对维特根斯坦式信仰主义最明显的批评或许是：即便承认作为其基础的生活形式与语言游戏理论，一个历史事实仍然成立——而这一事实本身又由历史“游戏”的标准加以证成：多数犹太人、基督徒与穆斯林所属的传统，是一种带有沉重形而上学承诺的生活形式；在其中，“有上帝”这类言说更类似于“有一颗质量比太阳大十倍的恒星”，而非“有希望”。因此，维特根斯坦式信仰主义只适用于禅宗之类宗教，以及犹太教和基督教中某些相对晚近、已拒斥传统形而上学承诺的自由主义支派（如 Cupitt 1984）[^cupitt-1984]。
    step2: |-
      对维特根斯坦式信仰主义最显见的批评或许是：即便承认其背后的生活形式与语言游戏理论，仍有一个历史事实。这一事实本身也由历史“游戏”的标准得到证成：多数犹太人、基督徒与穆斯林所归属的传统，乃是一种背负沉重形而上学承诺的生活形式。其中“有上帝”这类话，更像“有一颗质量十倍于太阳的恒星”，而不像“有希望”。所以，维特根斯坦式信仰主义只适合禅宗之类宗教，以及犹太教与基督教中某些相对晚近、已抛弃传统形而上学承诺的自由派支脉（如 Cupitt 1984）[^cupitt-1984]。
