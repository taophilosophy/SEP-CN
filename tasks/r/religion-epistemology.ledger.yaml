      One reason for religious exceptionalism might be the appeal to divine inspiration, as a source of private epistemic superiority, as in Plantinga’s “Aquinas/Calvin” model (Plantinga 2000)[^plantinga-2000]. It is hard to see, though, how this could apply to disputes between two religions that both rely on the role of divine inspiration. More recent discussion is contained in the anthology *Religious Disagreement and Pluralism* (Benton and Kvanvig (2021): Callahan (Ch 2) and Blanchard and Paul (Ch 6) argue that the embedding of religious beliefs in our understanding of ourselves and the world around us is a reason for not deferring to others (Compare Moser 2019)[^moser-2019]; Goldberg (Ch 3) points out that even if, accepting Reformed Epistemology as the general theory of justified or warranted belief, we permit unargued grounds for religious faith, these might be *defeated* by disagreement;King (Ch 7) warns against the intellectual arrogance seemingly displayed by apologists; Domandy (Ch 10) implicitly replies to King that apologists display loyalty not arrogance, but argues that this loyalty is often misplaced; Pittard (Ch 8) argues that conciliationism is circular unless we can recognize peers, and I would add experts, independently of what we believe on the topic in question; Kvanvig (Ch 9) argues that faith is not primarily intellectual (Again compare Moser 2019)[^moser-2019]; Finally, Choi (Ch 11) argues against reliance on majority opinion in religious disputes.
    step1: |-
      宗教例外论的一个理由，可能是诉诸神圣灵感，作为私下认知优越性的来源，如普兰丁格的“阿奎那／加尔文”模型（Plantinga 2000）[^plantinga-2000]。然而，很难看出这如何适用于两个都依赖神圣灵感作用的宗教之间的争论。更晚近的讨论见于文集《宗教分歧与多元论》（Benton and Kvanvig (2021)）：卡拉汉（第 2 章）与布兰查德、保罗（第 6 章）论证，宗教信念嵌入我们对自身与周围世界的理解之中，这是不向他人让步的理由（参较 Moser 2019）[^moser-2019]；戈德堡（第 3 章）指出，即便接受改革宗认识论作为被证成或得到保证之信念的一般理论，容许宗教信仰有无需论证的根基，这些根基也可能被分歧*击败*；金（第 7 章）警告护教者似乎表现出的理智傲慢；多曼迪（第 10 章）隐含地回应金说，护教者表现的是忠诚而非傲慢，但论证这种忠诚常常错置；皮塔德（第 8 章）论证，除非我们能独立于自己在相关问题上的信念来辨认同侪（我还要加上专家），调和主义便是循环的；克万维格（第 9 章）论证信仰主要不是理智性的（再参较 Moser 2019）[^moser-2019]；最后，崔（第 11 章）论证宗教争论中不应依赖多数意见。
