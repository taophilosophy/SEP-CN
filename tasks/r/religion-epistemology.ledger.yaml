      ## 2. The Rejection of Enlightenment Evidentialism
    step2: |-
      ## 2 对启蒙证据主义的拒斥
  - id: 11
    kind: body
    source: |-
      Most contemporary epistemology of religion may be called *post modern* in the sense of being a reaction to the Enlightenment, in particular to the thesis of the *hegemony* of evidentialism. (Compare Vanhoozer 2003.)[^vanhoozer-2003] Hegemony is discussed below, but first consider evidentialism. This is the initially plausible position that a belief is justified only if “it is proportioned to the evidence”. Here several sorts of evidence are allowed. One consists of beliefs in that which is “evident to the senses”, that is, beliefs directly due to sense-experience. Another sort of evidence is that which is “self-evident”, that is, obvious once you think about it. Evidence may also include the beliefs directly due to memory and introspection. Again moral convictions might count as evidence, even if not treated as self-evident. But in order to state the sort of evidentialism characteristic of Enlightenment thought, it is stipulated that no beliefs asserting the content of religious or mystical experiences count as evidence. For example, if Fatima had an experience that she would describe as of the presence of God she should not treat Gods presence to her as a piece of evidence. That does not prevent the claim that someone has had a religious experience with a certain content from counting as evidence. For example, the fact that Fatima had an experience as if of God’s presence would be a piece of evidence. Likewise the fact that various people report miracles counts as evidence.
    step1: |-
      当代宗教认识论大多可称为*后现代*（post modern），意思是对启蒙的一种反应，尤其是对证据主义*霸权*论题的反应。（参较 Vanhoozer 2003。）[^vanhoozer-2003] 霸权将在下文讨论，但先考虑证据主义。它是这样一种初看合理的立场：一个信念唯有“与证据相称”才被证成。这里允许若干种证据。一种是关于“对感官显而易见者”的信念，即直接由感觉经验而来的信念。另一种证据是“自明者”，即一经思考便显而易见者。证据也可以包括直接由记忆与内省而来的信念。再者，道德确信或许也算证据，即便不被当作自明者。但为了陈述启蒙思想所特有的一类证据主义，须规定：任何断称宗教或神秘经验之内容的信念都不算证据。例如，如果法蒂玛有过一种她会描述为上帝临在的经验，她不应当把上帝向她临在当作一条证据。这并不妨碍“某人曾有过具有某种内容的宗教经验”这一主张算作证据。例如，法蒂玛曾有过仿佛上帝临在的经验这一事实，会是一条证据。同样，各种人报告奇迹这一事实也算证据。
    step2: |-
      当代宗教认识论大多可冠以*后现代*（post modern）之名，意谓它是对启蒙的反应，尤其是对证据主义*霸权*论题的反应（参较 Vanhoozer 2003）[^vanhoozer-2003]。霸权问题留待后文，先看证据主义。这一立场初看颇为合理：信念唯有“与证据相称”才得到证成。此处允许若干类证据：一类是关于“对感官显而易见者”的信念，即直接源于感觉经验的信念；另一类是“自明者”，即一经思索便显而易见者；证据还可包括直接源于记忆与内省的信念。此外，道德确信或许也算证据，即使不按自明者对待。不过，为陈述启蒙思想所特有的那类证据主义，此处特作规定：凡断称宗教经验或神秘经验之内容的信念，一概不算证据。譬如，法蒂玛若有某种她会描述为上帝临在的经验，她不应把上帝向她临在当作一条证据。但这并不妨碍“某人有过具有某种内容的宗教经验”这一主张算作证据：法蒂玛曾有过仿佛上帝临在的经验，这一事实便是一条证据。同样，不同的人报告奇迹这一事实，也算证据。
  - id: 12
    kind: body
    source: |-
      Evidentialism implies that no full religious belief (i.e. a religious belief held with full confidence) is justified unless there is conclusive evidence for it, or it is self-evident. The content of religious experience has been stipulated not to count as evidence. Even if, as Descartes held, the existence of God is self-evident, beliefs such as Richard’s in the Trinity and Ramanujan’s in the divinity of Krishna are not. So the only available evidence for these beliefs would seem to be non-religious premises, from which the religious beliefs are inferred. Therefore, the only way of deciding whether the religious beliefs are justified would be to examine various arguments with the non-religious beliefs as premises and the religious beliefs as conclusions.
    step1: |-
      证据主义蕴含：没有任何完全的宗教信念被证成，除非有决定性证据支持它，或它是自明的。宗教经验的内容已被规定为不算证据。即便如笛卡尔所主张，上帝的存在是自明的，理查德对三位一体的信念、拉马努金对克里希纳神性的信念却并非自明。因此，这些信念唯一可用的证据看来只能是非宗教的前提，宗教信念由之推出。所以，判定这些宗教信念是否被证成的唯一方式，就是考察各种以非宗教信念为前提、以宗教信念为结论的论证。
    step2: |-
      证据主义蕴含：任何完全的宗教信念，除非有决定性证据、抑或本身自明，否则未获证成。宗教经验的内容已按规定不算证据。即便如笛卡尔所主张，上帝存在是自明的，理查德对三位一体的信念、拉马努金对克里希纳神性的信念却并不自明。这样一来，这些信念唯一可用的证据，似乎就只有非宗教的前提，再由之推出宗教信念。于是，要判定这些宗教信念是否得到证成，便只有一条路：逐一考察那些以非宗教信念为前提、以宗教信念为结论的论证。
  - id: 13
    kind: body
    source: |-
      According to evidentialism it follows that if the arguments for there being a God, including any arguments from religious experience, are at best probable ones, and if, as most hold, God’s existence is not self-evident then no one would be justified in having full belief that there is a God. And the same holds for other religious beliefs. Likewise, it would not be justified to believe even partially (i.e. with less than full confidence) if there is not a balance of evidence for belief.
    step1: |-
      按照证据主义，由此可推出：如果支持有上帝存在的论证——包括任何来自宗教经验的论证——充其量只是概然性的，并且如果像多数人主张的那样，上帝的存在并非自明，那么任何人都不会被证成持有“有上帝”的完全信念。其他宗教信念亦然。同样，如果没有支持信念的证据平衡，那么即便部分地相信（即以低于完全的信心相信）也不会被证成。
    step2: |-
      依证据主义可推：支持上帝存在的论证——包括一切出于宗教经验的论证——至多只是概然的。又倘若如多数人所主张，上帝存在并不自明，那么谁也没有资格持有“上帝存在”的完全信念；其他宗教信念亦同此理。同样，若证据并未在支持信念一侧形成平衡，那么即便只是部分地相信（即以低于完全的信心相信），也未获证成。
