      Theistic philosophers may grant evidentialism and even grant its hegemony, but defend their religious convictions by providing the case which evidentialists demand. Here the details of the arguments are not within the scope of an article on epistemology. What is of interest is the *kind* of argument put forward. For a start there is the project of *demonstrating* God’s existence. (See Craig 1979, Braine 1988, Miller 1991.)[^braine-1988][^craig-1979][^miller-1991] To show the justifiability of full belief that there is a God it is sufficient (a) to have a deductively valid argument from premises which are themselves justifiably held with full belief unless defeated by an objection and (b) to have considered and defeated all available objections to either the premises, the conclusion or any intermediate steps. Some of the premises of these arguments are said to be self-evident, that is, obvious once you think about it. (E.g., the denial of the explanatory power of an infinite causal regress, or the principle that the existence of any composite thing needs to be explained). And that connects with the problem of disagreement: Does somethings being self-evident to you justify your full belief in it even if you know of those of equal or greater intellectual ability to whom it is not self-evident? The affirmative answer is tenable provided we distinguish genuine self-evidence from plausible intuition.
    step1: |-
      有神论哲学家可以承认证据主义，甚至承认它的霸权，但通过提供证据主义者所要求的理由来捍卫其宗教确信。这里，论证的细节不在认识论文章的范围之内。有趣的是所提出的论证的*类型*。首先，有*证明*上帝存在的纲领。（见 Craig 1979, Braine 1988, Miller 1991。）[^braine-1988][^craig-1979][^miller-1991] 要表明“有上帝”这一完全信念的可证成性，充分条件是：(a) 有一个演绎有效的论证，其前提本身被正当地以完全信念持有，除非被某个反对意见击败；(b) 已经考虑并击败了对前提、结论或任何中间步骤的一切可用反对意见。这些论证的某些前提据说是自明的，即一经思考便显而易见。（例如，否认无限因果倒退具有解释力，或“任何复合事物的存在都需要解释”这一原则。）这就与分歧问题联系起来：某事物对你而言是自明的，这是否证成你对它的完全信念——即便你知道有智力同等或更高的人并不觉得它自明？只要我们把真正的自明与看似合理的直觉区分开来，肯定回答就是站得住的。
    step2: |-
      有神论哲学家可以接受证据主义，甚至接受它的霸权，但他们会拿出证据主义者所要求的理由，来为自己的宗教确信辩护。论证的细节不属于认识论文章的讨论范围；此处值得留意的是论证的*类型*。首先是*证明*上帝存在的纲领（见 Craig 1979, Braine 1988, Miller 1991）[^braine-1988][^craig-1979][^miller-1991]。要表明“上帝存在”这一完全信念可获证成，充分条件有二：(a) 有一个演绎有效的论证，其前提本身被正当地以完全信念持有，除非遭到反对意见击败；(b) 已考虑并击败针对前提、结论或任何中间步骤的一切可用反对意见。这类论证的某些前提据称是自明的，即一经思索便显而易见（例如，否认无限因果倒退具有解释力，或“任何复合事物的存在都需要解释”这一原则）。这就与分歧问题接上了：某个事物对你自明，是否就证成你对它的完全信念——即便你知道有智力同等甚至更高的人并不觉得它自明？只要我们分清真正的自明与貌似可信的直觉，肯定回答便站得住。
