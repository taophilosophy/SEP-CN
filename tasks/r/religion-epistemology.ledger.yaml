      拒斥认识论的霸权，与对认识论的某一碎片持有一个霸权论题，是完全相容的。例如，这样一个碎片可能包含自我指涉一致性原则，普兰丁格（1983: 60）就依赖这一原则。该原则说：持有一个按之该信念本身未被证成的信念，是不被证成的。例如，考虑那个极端例子：此人相信，除非能从人人都同意的前提加以证明，否则任何信念都未被证成。
