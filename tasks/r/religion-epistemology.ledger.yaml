      In fact it seems that many religious believers combine full belief with “doubts” in the sense of some reasons for doubting, or they combine partial belief with what they take to be weighty reasons for disbelief. According to evidentialism this is not justified. Other believers consider that, on reflection, they have little reason for doubting but that they have almost no positive evidence for their religious beliefs. According to evidentialism this too is unjustified. This raises the question, how can we adjudicate between an epistemological thesis which might otherwise be believed and a religious belief which that thesis implies is unjustified? The Enlightenment assumed two related, hegemony theses, those of epistemology and of evidentialism. The hegemony of epistemology states that (a) human beings can discover the correct epistemology in isolation from discovering actual human tendencies to form beliefs, and so (b) there is an overriding reason to use the correct epistemology (once discovered) to correct the above-mentioned tendencies. The hegemony of evidentialism adds to the hegemony of epistemology the further thesis that (c) evidentialism is the correct epistemology. If, according to evidentialism, full or even partial religious beliefs are unjustified, then, given the hegemony of evidentialism there is an overriding reason to reject those beliefs. Perhaps the clearest exponent of this position is Clifford whose use of moral vocabulary conveys well the overriding character of the reasons epistemology is said to provide. His position is summed up in the famous quotation: “It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence” (Clifford 1879: 186)[^clifford-1879].
    step1: |-
      事实上，许多宗教信徒似乎把完全信念与“怀疑”——即一些怀疑的理由——结合在一起，或者把部分信念与他们视为重大的不信理由结合在一起。按证据主义，这未被证成。另一些信徒则认为，经过反思，他们几乎没有怀疑的理由，但对自己的宗教信念也几乎没有正面证据。按证据主义，这也未被证成。这就提出一个问题：我们如何在一种否则可能会被相信的认识论论题，与一种被该论题蕴含为未被证成的宗教信念之间作出裁决？启蒙运动假定两个相关的霸权论题，即认识论的霸权与证据主义的霸权。认识论的霸权声称：(a) 人类可以在不发现实际的人类信念形成倾向的情况下，发现正确的认识论；因此 (b) 有一个压倒性的理由去运用正确的认识论（一旦发现）来纠正上述倾向。证据主义的霸权在认识论的霸权之上再加上一个论题：(c) 证据主义是正确的认识论。如果按证据主义，完全甚至部分的宗教信念都未被证成，那么，鉴于证据主义的霸权，就有一个压倒性的理由拒斥这些信念。这一立场最清晰的代表人物或许是克利福德，他使用道德词汇，很好地传达了据称由认识论提供的理由所具有的压倒性特征。他的立场总结于那句名言：“无论何时、无论何地、无论何人，凭不充分的证据相信任何事情都是错的。”（Clifford 1879: 186）[^clifford-1879]
