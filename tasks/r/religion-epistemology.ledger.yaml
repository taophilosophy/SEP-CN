      Although pre-dating the current debate, Newman’s rejection of Locke’s and Paley’s evidentialism is relevant to the problematic of contemporary epistemology of religion. First he quite clearly rejected the hegemony of epistemology. His procedure was to examine how in fact people made up their minds on non-religious issues and argue that by the same standards religious beliefs were justified. As a result he qualified evidentialism by insisting that an *implicit* and *cumulative* argument could lead to justified certainty. (See Mitchell 1990.)[^mitchell-1990]
    step1: |-
      尽管早于当前的争论，纽曼对洛克与佩利证据主义的拒斥，与当代宗教认识论的问题域相关。首先，他相当明确地拒斥了认识论的霸权。他的做法是考察人们在非宗教问题上实际上如何下定决心，并论证按同样的标准，宗教信念也应被证成。结果，他通过坚持一种*隐含的*与*累积的*论证可以导致被证成的确定性，而对证据主义作了限定。（见 Mitchell 1990。）[^mitchell-1990]
    step2: |-
      纽曼对洛克与佩利证据主义的拒斥虽早于当前争论，却与当代宗教认识论的问题域相干。首先，他十分明确地拒斥了认识论的霸权。他的做法是：考察人们在非宗教问题上实际如何拿定主意，再论证按同一标准，宗教信念同样得到证成。由此，他对证据主义作了限定，坚持一种*隐含的*、*累积的*论证亦可通向得到证成的确定性（见 Mitchell 1990）[^mitchell-1990]。
