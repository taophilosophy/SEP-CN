      Many natural theologians have, however, abandoned the search for demonstrative arguments, appealing instead to ones which are probable, either in the sense of having weight but being inconclusive or in the sense of having a mathematical probability assigned to them. Notable in this regard are Mitchell’s cumulative argument (Mitchell 1973)[^mitchell-1973] and Swinburne’s Bayesian reliance on probability (Swinburne 1979)[^swinburne-1979]. In a popular exposition of his argument Swinburne appeals instead to an inference to the best explanation (Swinburne 1995; see also Forrest 1996, 2025)[^forrest-1996]. While there are differences of approach, the common theme is that there is evidence for theism but evidence of a probable rather than a conclusive kind, justifying belief but not full belief.
