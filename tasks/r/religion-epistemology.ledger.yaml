      Another criticism is Plantinga’s claim that evidentialism is self-referentially inconsistent for there is no evidence for evidentialism (Plantinga 1983: 60)[^plantinga-1983][^plantinga-1983-2]. This might be met in either of two ways. First, it could be said that all that is being defended is the Ockhamist fragment of evidentialism and that this is not itself vulnerable to Ockham’s Razor. Or it could be argued that deriving an epistemology from a wide range of examples is evidence for it. To be sure this is far from conclusive evidence. But even a less than full belief in an epistemological thesis which showed theism to be unjustified would be damaging. This may be illustrated using an example with artificial numerical precision: 80% confidence in an epistemology which showed that no degree of belief in theism greater than 60% was justified is incompatible with a degree of belief in theism greater than 68%. The person in question could have a degree of belief of in the conjunction of theism and the (80% likely) epistemology of no greater than 48% (80% of 60%) and a degree of belief in the conjunction of theism and the denial of that epistemology of no greater than 20% (since that epistemology has a probability of 80%).
