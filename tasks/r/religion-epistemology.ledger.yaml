      In what may be called “counter-reformed epistemology” it could be allowed that a belief can be warranted if grounded in a religious tradition. (See Zagzebski 1993b.)[^zagzebski-1993b][^zagzebski-1993b-2] Such a belief would have to be caused in the right sort of way by the right sort of tradition. As in the previous cases we might note that such grounding should be partially accessible to the believer. Rather little work has been done on this extension of reformed epistemology, but the social dimension of warrant has been noted (Zagzebski 1993a).
