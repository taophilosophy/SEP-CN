      Not surprisingly the reliance of non-theist philosophers on evidentialism has been criticised. First there is an ad hominem. Shalkowski (1989) has pointed out that these defenders of evidentialism tend in fact to be atheists not agnostics, yet a careful examination, he says, of the examples used to support Ockham’s Razor show that either they are ones in which there is independent evidence for denying the existence of *X*s or ones in which suspense of judgement seems to be the appropriate response, not denial. This shows critics of religious belief are not intellectual superiors correcting the mistakes of their inferiors, but disputants.
    step1: |-
      不出所料，非有神论哲学家对证据主义的依赖遭到了批评。首先是一种人身攻击。沙尔科夫斯基（Shalkowski 1989）指出，这些证据主义的辩护者实际上往往是无神论者而非不可知论者；然而他说，仔细考察用来支持奥卡姆剃刀的例子就会发现，它们要么属于有独立证据否定 *X* 类事物存在的情形，要么属于悬置判断似乎是恰当回应、而非否定的情形。这表明，宗教信念的批评者并不是在纠正下智者错误的智力上者，而是争论的对手。
    step2: |-
      不出所料，非有神论哲学家对证据主义的倚赖招致批评。首先是人身攻击式的批评。沙尔科夫斯基（Shalkowski 1989）指出，这些证据主义辩护者实际上多是无神论者而非不可知论者；而他说，细察那些用以支持奥卡姆剃刀的例子便会发现：它们要么本身就有独立证据可否定 *X* 类事物的存在，要么属于悬置判断才算恰当回应、而非径直否定的情形。由此可见，宗教信念的批评者并非居高临下纠正下愚的智力上者，而只是论争的一方。
