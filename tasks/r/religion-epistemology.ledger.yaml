      事实上，许多宗教信徒似乎把完全信念与“怀疑”——即若干怀疑的理由——糅在一起；或者把部分信念与他们心目中的重大不信理由糅在一起。按证据主义，这未获证成。另一些信徒经过反思，认为自己几乎没有怀疑的理由，但对宗教信念也几乎拿不出正面证据。按证据主义，这同样未获证成。于是问题来了：一方是一种本来或许可信的认识论论题，另一方是被该论题判定为未获证成的宗教信念，二者之间该如何裁决？启蒙运动假定了一对相关的霸权论题：认识论的霸权与证据主义的霸权。认识论的霸权声称：(a) 人类无需先查明实际的信念形成倾向，便可发现正确的认识论；因而 (b) 一旦发现正确的认识论，便有压倒性的理由用它来纠正上述倾向。证据主义的霸权则在认识论的霸权之上再添一条：(c) 证据主义正是那正确的认识论。假如按证据主义，完全乃至部分的宗教信念都未获证成，那么，鉴于证据主义的霸权，便有压倒性的理由拒斥这些信念。克利福德或许是这一立场最清晰的代表；他善用道德词汇，恰当地传达出所谓认识论理由的压倒性。其立场可归结为那句名言：“无论何时、无论何地、无论何人，凭不充分的证据相信任何事，都是错的。”（Clifford 1879: 186）[^clifford-1879]
