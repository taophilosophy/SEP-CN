      Another reaction to the problematic is religious fideism, the thesis that religious faith is an exception to ordinary epistemological constraints, perhaps because the believers think of themselves as chosen by God with their faith as a gift. That version merely shifts the epistemological problem, although Kierkegaard’s position (1983) is more sophisticated, as is Wittgensteinian fideism (Phillips 1992)[^phillips-1992]. This asserts thesis that there are various different “language games”, and that while it is appropriate to ask questions about justification within a language game it is a mistake to ask about the justification of “playing” the game in question. In this way epistemology is relativised to language games, themselves related to forms of life, and the one used for assessing religious claims is less stringent than evidentialism. Here there seems to be both an autonomy thesis and an incommensurability thesis. The autonomy thesis tells us that religious utterances are only to be judged as justified or otherwise by the standards implicit in the religious form of life, and this may be further restricted to Christianity or Hinduism, or any other religion (Malcolm 1992)[^malcolm-1992]. The incommensurability thesis tells us that religious utterances are unlike scientific or metaphysical claims and so we are confusing different uses of language if we judge religious utterances by the standards of science or metaphysics (Phillips 1992)[^phillips-1992]. Stress on the autonomy thesis brings Wittgensteinian fideism close to the fideism of many religious conservatives, but stress on the incommensurability thesis brings it close to the extreme liberal position of Braithwaite (1955), namely that religion is about attitudes not facts, which would, of course, be rejected by religious conservatives.
    step1: TBD
    step2: TBD
