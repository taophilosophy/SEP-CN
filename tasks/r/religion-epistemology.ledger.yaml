      Reformed epistemology might be thought of as a modification of evidentialism in which the permissible kinds of evidence are expanded. Notable in this context is Alston’s work arguing that certain kinds of religious experience can be assimilated to perception (1991). The difference is that religious experience is more private, personal, emotionally charged and variable than paradigmatic cases of perception. Consider a world in which the majority are tone deaf and the minority who are not are divided between lovers of just one of Gregorian chant, Wagner or Ravi Shankar,and who deride the others as mere noise. Perception has privileged epistemic status. Hence, it is not just a verbal dispute as to whether religious experience is perception or, because God is not the right sort of thing to be perceived, merely somewhat analogous to perception. (See So 2015; Netland 2022; Perrine 2025)[^netland-2022][^perrine-2025]. Moser’s treatment is not open to that objection. For he draws our attention to the experience of being guided about how we are to live and in our search for meaning (2019).
    step1: TBD
    step2: TBD
