      Reformed epistemologists, such as Wolterstorff (1976) and Plantinga (1983) reject evidentialism , arguing that beliefs are *warranted* without Enlightenment-approved evidence provided they are (a) grounded, and (b) defended against known objections. Such beliefs may then themselves be used as evidence for other beliefs. What grounding amounts is, however, contestable: Plantinga proposes that *S*’s belief that *p* is grounded in event *E* if (a) in the circumstances *E* caused *S* to believe that *p*, and (b) *S*’s coming to believe that *p* was a case of proper functioning (Plantinga 1993b)[^plantinga-1993b]. It should be noted that the term “warrant” used elsewhere in philosophy as a synonym for “justified” (as in “warranted assertibility”) is used by Plantinga to mean that which has to be adjoined to a true belief for it to be knowledge. (See Plantinga 1993a)[^plantinga-1993a]. Accordingly the most pressing criticism of Plantinga’s later position is that it largely ignores the question of justification, or reasonableness which, as Swinburne explicates it (Swinburne 2001)[^swinburne-2001] amounts to whether the religious beliefs are probable relative to total evidence. Here it should be noted however that this requirement does not imply that we are aware of our evidence. Moreover, the evidence can be of a rather private kind that is hard to articulate even for academic philosopher, and the reasoning from that evidence implicit. (See van Inwagen 1994). It could happen then religious believers are mistaken in thinking religious experience grounds their beliefs, because those beliefs, based on implicit reasoning from evidence they cannot articulate, are part of the cause of the experience rather than the other way round (Katz 1978)[^katz-1978].
