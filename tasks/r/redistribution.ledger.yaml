  - id: 13
    kind: body
    source: |-
      Redistribution refers to modifications of the holdings of particular persons, collective agents, or groups (as defined in terms of non-resource holding characteristics), or changes in holdings by groups (as defined by resource holdings). Sometimes those from and to whom resources are redistributed are defined as individuals, other times as groups to which individuals are rigidly assigned (for example, Whites and Hispanics), and other times to groups that are defined by their holdings (for example, the top and bottom quintile). We can identify patterns in terms of rigidly identifiable persons (John and Sally) or groups (Whites and Hispanics) or, alternatively, ‘anonymously’ (for example, as a percentile graph or Lorenz curve). We can imagine a scenario in which, pursuant to some institutional reform, the average holdings of the richest quintile and the poorest quintile shift from <5,3> at time *t*₁ to <6,2> at time *t*₂, while the average holdings of Whites and Hispanics or the actual holdings of John and Sally remain unchanged. Whether redistribution has occurred, then, *can only be determined relative to the set of subjects that is identified*.
    step1: |-
      再分配指特定的人、集体行动者或群体（按非财物持有的特征界定）的持有物的改动，或者按财物持有界定的群体的持有变化。有时，再分配所自与所向的人们被界定为个体；有时是个体被刚性归入的群体（例如白人与西班牙裔）；有时是按其持有界定的群体（例如最高与最低五分位）。我们可以按刚性的可识别个人（约翰与萨莉）或群体（白人与西班牙裔）来识别模式，或者“匿名地”识别（例如作为百分位图或洛伦兹曲线）。我们可以设想这样一个情形：依据某项制度改革，最高五分位与最低五分位的平均持有从时间 *t*₁ 的<5,3> 移动到时间 *t*₂ 的 <6,2>，而白人与西班牙裔的平均持有或约翰与萨莉的实际持有保持不变。那么，再分配是否发生，*只能相对于所识别的主体集合来确定*。
    step2: |-
      再分配指特定个人、集体行动者或群体（按非财物持有特征界定）的持有改动，或按财物持有所界定群体的持有变化。有时再分配所自与所向者被界定为个体；有时是个体被刚性归入的群体（如白人与西班牙裔）；有时是按持有界定的群体（如最高与最低五分位）。识别模式时，可以用刚性的可识别个人（约翰与萨莉）或群体（白人与西班牙裔），也可以“匿名地”进行（如百分位图或洛伦兹曲线）。设想这样一个情形：依某项制度改革，最高与最低五分位的平均持有从时间 *t*₁ 的 <5,3> 变为时间 *t*₂ 的 <6,2>，而白人与西班牙裔的平均持有、约翰与萨莉的实际持有不变。那么，再分配是否发生，*只能相对于所选定的主体集合来判定*。
  - id: 14
    kind: body
    source: |-
      Discussions of redistribution are not always very specific about which kinds of subjects they are concerned with, or about the possible significance of the fact that policies will be more or less redistributive depending on how these subjects are defined. Take, for example, the following claim by Harvard economist Richard Freeman (1999, p. 12), who claims that a set of policies he proposes will result in “substantial income redistribution from those who have gained so much in the past 15 to 20 years…for it results in improving the living standards of those now at or near the bottom.” The referent of ‘those’, in both the first and second clauses, could be understood as picking out groups of specific individuals (a set of proper names), or group statistical aggregates (the top or bottom quintile). If the claim refers to groups of particular individuals, then lack of change in the pattern of holdings between the top and bottom income quintiles needn’t mean that no redistribution has taken place. If substantial numbers of people have moved up or down, then redistribution (in this sense) has taken place. My focus in this entry will be on the issue of the baseline, since this seems most fundamental.
    step1: |-
      关于再分配的讨论并不总是很明确：它们关心的是哪一类主体，也不总是说明——依这些主体如何界定，政策会在或大或小的程度上成为再分配的——这一事实可能具有的意义。以哈佛经济学家 Richard Freeman（1999, p. 12）的下述主张为例：他提出，他所倡导的一套政策将带来“从过去十五到二十年里获益甚多的那些人那里向……的实质收入再分配，因为它改善了现在处于或接近底层的人的生活水平”。“那些人”在前后两个分句中的所指，可以被理解为挑出特定个体的群体（一组专有名称），或群体统计 aggregate（最高或最低五分位）。如果该主张指的是特定个体的群体，那么最高与最低收入五分位之间持有模式的不变，并不意味着没有发生再分配。如果大量的人上移或下移了，那么（在此意义上的）再分配就发生了。本词条的关注点将是基线问题，因为它看来最为根本。
    step2: |-
      关于再分配的讨论并不总是说清：它们关心哪一类主体；也不总是点明这一事实的可能意义——依主体如何界定，政策的再分配程度会随之不同。以哈佛经济学家 Richard Freeman（1999, p. 12）的主张为例：他称自己倡导的一套政策将带来“从过去十五到二十年里获益甚多的那些人向……的实质性收入再分配，因为它改善了如今处于或接近底层者的生活水平”。“那些人”在前后两个分句里的所指，可以理解为特定个体组成的群体（一组专名），也可以理解为群体统计总集（最高或最低五分位）。若所指为特定个体组成的群体，那么最高与最低收入五分位之间的持有模式不变，并不意味着没有发生再分配——只要大量个人上移或下移，（此意义上的）再分配就已发生。本词条聚焦基线问题——它看来最为根本。
