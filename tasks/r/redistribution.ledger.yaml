      What kind of concept is redistribution when used in the senses defined above? All of these understandings of redistribution are *purely descriptive*. We needn’t evaluate a pattern change, a purposive pattern change, or a taking to identify them. These understandings identify distinct but partially overlapping sets of practices and actions as redistributive. Some policies and institutional changes, for example, may involve redistribution in all of these senses. Take, for instance, Taiwan, which, in the course of a decade, radically reduced levels of income inequality — thereby involving a case of diachronic redistribution. Some studies (e.g., Kuo *et al*. 1984)[^kuo-1984] suggest that these pattern changes were at least partly the intent of a package of policies that included agricultural reform and increased expenditure on health and education — thereby exhibiting purposive diachronic redistribution. And among the most important agricultural reforms were changes in land distribution — thereby involving redistribution as taking.
    step1: |-
      以上述各义使用的再分配是哪一类概念？对再分配的这些理解全都是*纯描述性的*。要识别一个模式变化、一个有目的的模式变化或一次夺取，我们无须对它们作出评价。这些理解把几个不同但部分重叠的实践与行动的集合标识为再分配性的。例如，某些政策与制度变动可能在所有这些意义上都涉及再分配。以台湾为例：它在十年之间急剧降低了收入不平等的水平——从而构成一个历时再分配的案例。一些研究（如 Kuo 等人 1984）[^kuo-1984]表明，这些模式变化至少部分是一项政策组合的意图，该组合包括农业改革以及增加健康与教育支出——从而表现出有目的的历时再分配。而其中最重要的农业改革是土地分配的变革——从而涉及作为夺取的再分配。
    step2: |-
      以上述各义使用的“再分配”，是哪一类概念？对再分配的这些理解全都是*纯描述性的*：识别一个模式变化、一个有目的的模式变化或一次夺取，无须对它们作任何评价。这些理解各自标识出一组不同而部分重叠的实践与行动，把它们归为再分配性的。某些政策与制度变动可能在所有这些意义上都涉及再分配。以台湾为例：十年之间，收入不平等急剧下降——此即历时再分配的案例；一些研究（如 Kuo 等人 1984）[^kuo-1984]表明，这些模式变化至少部分是一项政策组合的意图所在——该组合包括农业改革与医疗教育支出的增加——此即有目的的历时再分配；而其中最重要的农业改革正是土地分配的变革——此即作为夺取的再分配。
  - id: 28
    kind: body
    source: |-
      In other cases it may be unclear whether redistribution occurred in any of these three senses. Take, for example, the question of whether income redistribution occurred in the United States between 1979 and 1987, accepting as true the findings of a U.S. congressional study (released in March, 1989) which claimed that the average family *net* income of the poorest fifth of the American population declined by over 6 percent from 1979 to 1987, while it rose by over 11 percent for the richest fifth, and that personal income declined by 9.8 percent for the poorest fifth while rising 15.6 percent for the richest fifth.[^note-6] With respect to income quintiles, it seems very likely that diachronic income redistribution occurred between 1979 and 1987 — but only very likely, since it is possible in principle to deny that the income shifts among quintiles were caused by the policies adopted by the Reagan Administration or through other social mechanisms. As noted above, the term ‘redistribution’ is usually taken to require some social mechanism that, whether intentionally or not, causes the shift.
    step1: |-
