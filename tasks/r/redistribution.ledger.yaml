      The social practices that are sometimes *said* to involve rights infringing transfers include compulsory taxation that is used to pay for welfare, social programs provided for the poor and unemployed, and foreign development aid. It is somewhat curious that many critics of conservative and libertarian positions seem to agree that taxation involves redistribution through violation (or at least infringement) of property rights — while maintaining that this is nevertheless justified given the importance of other social goals.[^note-13] Indeed, defenses of the welfare state have typically represented taxation for welfare programs as a form of state-administered infringement of property rights — or ‘enforced charity’. These judgments depend, however, on highly specific (and contentious) understandings of economic justice and the processes that give rise to valid entitlements. They seem to suppose, for example, that people have valid moral claims to their gross incomes. A more robust egalitarian critique of these claims would question whether gross income provides the appropriate benchmark for judging whether rights-infringing transfers have occurred. U.S. citizens have a right only to their net incomes, not their gross incomes. They are legally obligated not to evade payment of income tax. The choice of a tax scheme does not reflect a commitment to infringing property rights to serve social goals; indeed, no individual or government agency may interfere with the (legal) use of net income. Rather, the tax scheme reflects a commitment to *fixing the content* of the rules that determine valid property rights in a particular way. That is, the income tax is part of the process that fixes the initial (normatively relevant) distribution, to which the right-holder is completely entitled.[^note-14] The income tax does not represent *re*distribution, since this takes for granted some different initial distribution of rightful holdings (and thus a right with a different object: in this case, gross income).[^note-15] Indeed, consideration of social goals such as general economic security, for instance, often figure in the *design* of an economic system, including its monetary policies and tax rates, but these same goals seldom figure in justifications of infringements of rights (for example, the repossession of goods that have come to be held by legal means *within* that system) (Murphy & Nagel 2003, Pogge 1989)[^murphy-2003][^pogge-1989]. Once we have fixed the content of our economic ground rules (according, of course, to some account of justice), they cannot be viewed as ‘redistributive’ in the rights-infringing sense. Rather, they ought to be viewed as governing how economic benefits and burdens are rightfully distributed in the first place. This is just a specific instance of the general distinction, stressed by Rawls (2001), between the use of forward-looking considerations in justifying a practice (or, in this case, an institutional design) and using those same considerations to justify infringement of the rules of an ongoing practice.
    step1: |-
      有时被*说成*涉及侵犯权利的转移的社会实践包括：用于支付福利的强制税收、为穷人与失业者提供的社会项目，以及外国发展援助。有点奇怪的是，保守派与自由至上主义立场的许多批评者似乎同意：征税涉及经由违反（或至少侵犯）产权的再分配——却又主张鉴于其他社会目标的重要性这仍然是正当的。[^note-13]的确，为福利国家辩护的论者通常把为福利项目征税表象为一种国家管理的产权侵犯——或“强制慈善”。然而这些判断依赖于高度特定的（且有争议的）经济正义观，以及关于有效权利主张如何产生的那些过程的看法。例如它们似乎假定人们对其毛收入有有效的道德权利主张。对这些主张作更有力的平等主义批评，就会追问毛收入是否为判断是否发生了侵犯权利的转移提供了适当的基准。美国公民只有对其净收入的权利，没有对毛收入的权利；他们在法律上有义务不逃避缴纳所得税。税收方案的选择并不反映一种为服务社会目标而侵犯产权的 commitment；的确，任何个人或政府机构都不得干预（法律上的）净收入的使用。毋宁说，税收方案反映的是一种以特定方式*固定规则内容*的 commitment，这些规则决定有效的产权。也就是说，所得税是固定初始的（规范上相关的）分布——权利人对它享有完全的权利——的过程的一部分。[^note-14]所得税并不代表*再*分配，因为那会先假定某个不同的正当持有初始分布（以及一个有不同对象的权利：在此即毛收入）。[^note-15]的确，诸如总体经济安全之类的对会目标的考虑，常常出现在一个经济系统的*设计*中，包括其货币政策与税率；但这些同样的目标很少出现在侵犯权利的证成中（例如收回在该系统*之内*以合法手段取得的财物）（Murphy & Nagel 2003, Pogge 1989）[^murphy-2003][^pogge-1989]。一旦我们固定了经济根本规则的内容（当然是按照关于正义的某种说明），它们就不能被看作侵犯权利意义上的“再分配性的”。毋宁说，它们应当被看作支配经济利益与负担起初如何正当地分布的规则。这只是罗尔斯（2001）所强调的一般区分的一个具体实例：在证成一个实践（或此处的制度设计）时使用前瞻性的考虑，与用同样的考虑来证成违反一个进行中的实践的规则，是两回事。
    step2: |-
      有时被*说成*涉及侵犯权利的转移的社会实践包括：用于福利的强制税收、为穷人与失业者提供的社会项目、外国发展援助。有点奇怪的是：保守派与自由至上主义的许多批评者似乎同意——征税涉及经由违反（或至少侵犯）产权的再分配——却又主张鉴于其他社会目标之重要，这仍属正当。[^note-13]的确，为福利国家辩护者通常把福利征税表象为国家管理的产权侵犯，或曰“强制慈善”。但这些判断依赖高度特定（且有争议）的经济正义观，以及关于有效权利主张如何产生的看法——例如它们似乎假定人们对其毛收入有有效的道德权利主张。更有力的平等主义批评则会追问：毛收入是否为判定“侵犯权利的转移是否发生”提供了适当的基准。美国公民只有对其净收入的权利，没有对毛收入的权利；他们在法律上有义务不逃缴所得税。税收方案的选择，并不反映一种“为服务社会目标而侵犯产权”的 commitment；的确，任何个人或政府机构都不得干预（法律上的）净收入使用。毋宁说，税收方案反映的是一种以特定方式*固定规则内容*的 commitment——这些规则决定有效的产权。也就是说，所得税是固定初始的（规范上相关的）分布——权利人对它享有完全权利——的过程的一部分。[^note-14]所得税并不代表*再*分配：那会先假定某个不同的正当持有初始分布（以及一个对象不同的权利——在此即毛收入）。[^note-15]的确，总体经济安全这类社会目标的考虑，常出现在经济系统的*设计*中（含货币政策与税率）；但这些目标很少出现在侵犯权利的证成中（例如收回在该系统*之内*以合法手段取得的财物）（Murphy & Nagel 2003, Pogge 1989）[^murphy-2003][^pogge-1989]。一旦经济根本规则的内容固定下来（当然按照关于正义的某种说明），它们就不能被看作侵犯权利意义上的“再分配性的”；毋宁说，它们支配着经济利益与负担起初如何正当地分布。这只是罗尔斯（2001）强调的一般区分的一个具体实例：证成一个实践（或此处的制度设计）时使用前瞻性考虑，与用同样考虑证成违反一个进行中的实践的规则，是两回事。
