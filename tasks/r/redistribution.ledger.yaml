      By employing the concept of redistribution, both libertarians and their egalitarian critics make it appear that laissez-faire institutions are natural and define the baseline distribution. They seem therefore to share the conviction that egalitarians seek to revise these distributions *ex post* through redistributive transfers. But this presupposes that the libertarians are correct in their specification of entitlement producing processes that produce the initial distribution. The fact that particular forms of taxation are often seen as redistributive in this sense is due to a tacit presupposition that a very specific kind of free-market scheme should serves as a morally privileged benchmark.[^note-17] Those who find that only a more egalitarian set of social arrangements is ethically defensible will (symmetrically) view the distributions that come about pursuant to a lasses-faire market scheme as involving rights infringing redistribution. Here again, the debate is better understood as concerning what the correct predistribution of right ought to be (O’Neill and Williamson 2012)[^o’neil-2012].
