      [^note-17]: G.A. Cohen has offered the following explanation of the ‘naturalness’ of this presupposition: “There is a tendency to take as part of the structure of human existence in general any structure around which, merely as things are, much of our activity is organized. In capitalist society, the institution of private property is such a structure. It is treated as so given, that the obstacles it puts to freedom are not perceived, while any impingement on it is readily noticed.” See Cohen [1982], p. 14.
    step1: |-
      [^note-17]: G.A. Cohen has offered the following explanation of the ‘naturalness’ of this presupposition: “There is a tendency to take as part of the structure of human existence in general any structure around which, merely as things are, much of our activity is organized. In capitalist society, the institution of private property is such a structure. It is treated as so given, that the obstacles it puts to freedom are not perceived, while any impingement on it is readily noticed.” See Cohen [1982], p. 14.
    step2: |-
      [^note-17]: G.A. Cohen 曾对这一预设的“自然性”给出如下解释：“凡是——仅就实情而言——我们的活动大量围绕其组织起来的结构，人们倾向于把它当作人类存在的一般结构的一部分。在资本主义社会，私有财产制度就是这样的结构。它被视为如此给定，以致它给自由设置的障碍无人察觉，而对它的任何触碰却动辄引人注意。”见 Cohen [1982], p. 14。
