  - id: 18
    kind: body
    source: |-
      The baseline distribution can be specified *diachronically*, in terms of some distribution that held at an earlier time. Economists, for example, often refer to policies as having redistributive effects when they engender a different pattern of holdings than obtained previously. Redistribution of wealth, in this sense, occurs whenever there is a shift in patterns of holdings over time (among some set of subjects) in response to some policy or other social mechanism. On this understanding, we can determine whether redistribution has taken place by identifying (1) a pattern of holdings at time *t*₁ that characterizes the initial distribution; (2) a pattern of holdings at time *t*₂ that characterizes the later distribution; and ^{}(3) some policy or other social mechanism that, intentionally or not, caused the change in patterns of holdings between *t*₁ and *t*₂.[^note-2] Let us call redistribution that invokes a diachronically specified baseline ‘diachronic redistribution.’ Diachronic redistribution can be brought about through many different means, including the reform of social institutions (for example, torts, rules governing competition, trade and tax policy, or the structure of markets in capital and labor), changes in the prevailing social ethos, or specific market or other interventions by governments.
    step1: |-
      基线分布可以*历时地*规定，即依据某个在较早时间持有的分布。例如，经济学家常把一些政策称作有再分配效应的，当它们造成了不同于先前持有模式的模式。在此意义上的财富再分配，只要持有模式（在某组主体之中）随时间因某项政策或其他社会机制而发生变动就会发生。按这一理解，判断再分配是否发生，需要识别（1）刻画初始分布的时间 *t*₁ 的持有模式；（2）刻画后来分布的时间 *t*₂ 的持有模式；以及 ^{}（3）某项政策或其他社会机制——无论是否有意——造成了 *t*₁ 与 *t*₂ 之间持有模式的变动。[^note-2]让我们把诉诸历时性规定的基线的再分配称为“历时再分配”。历时再分配可以经由许多不同的手段实现，包括社会制度的改革（例如侵权法、规范竞争的规则、贸易与税收政策，或资本与劳动市场的结构）、主流社会风气的变化，或政府特定的市场干预或其他干预。
    step2: |-
      基线分布可以*历时地*（diachronically）规定——依据某个较早时间的分布。例如经济学家常说某些政策具有再分配效应：它们造成了不同于先前的持有模式。此意义上的财富再分配，只要持有模式（在某组主体中）因某项政策或其他社会机制而随时间变动，即告发生。按这一理解，判定再分配是否发生，须识别：（1）刻画初始分布的时间 *t*₁ 持有模式；（2）刻画后来分布的时间 *t*₂ 持有模式；以及 ^{}（3）某项政策或其他社会机制——无论有意与否——引起了 *t*₁ 与 *t*₂ 之间持有模式的变动。[^note-2]凡诉诸这种历时性基线的再分配，称为“历时再分配”。历时再分配的实现途径多样：社会制度的改革（如侵权法、竞争规则、贸易与税收政策、资本与劳动市场的结构）、主流社会风气的变迁，或政府对市场及其他领域的特定干预。
