      [^note-15]: This is not to say that the right-holder has no claims regarding her gross income. She has, for example, the right that her employers not take the difference between her net and gross income and hold onto it. It might be tempting to say that the employee has not rights that are violated in this case, but rather the state does. But this doesn’t seem right. The only right the state has is to the payment of the tax on the appointed day. Should the employee have voluntarily offered the difference to her employer, no rights would be violated. I think we should rather look at employee rights to gross income as being understood in the same way as joint ownership of a timesharing condominium. The part owner has certain claims regarding the property that endure year-round (no one can paint it without his consent), and some that he has only at certain times (exclusionary use of the condominium for two weeks).
