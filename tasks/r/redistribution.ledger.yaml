      Both sides of this debate err, however, by simply assuming that welfare and other social programs are redistributive in either of these senses. It is often claimed, for example, that welfare and other social programs are clear examples of tax-and-transfer, because such programs are usually funded by revenues that are raised from those who will seldom, if ever, make use of them. But this assumes an overly narrow understanding of how people can benefit from such programs. In particular, it overlooks the *indirect* benefits that these programs provide to those who fund them. Programs that provide a decent social minimum, for example, may protect those who fund them from higher crime rates, or promote higher growth rates, a better educated labor force, and other social goods that benefit them in many ways (Murphy & Nagel 2003, Chapter 4)[^murphy-2003]. Suppose, however, that those who pay taxes that support a social minimum can insulate themselves from the risks of crime, or are unaffected by the other social benefits engendered by these programs. Would this show that the taxes that they pay to support these programs are redistributive? Perhaps, but it could also be plausibly claimed that insofar as they do not support such programs, their remaining taxes help to support a set of institutional arrangements that *harm* those that suffer from significant deprivations. Take, for example a social system that features a market economy whose structure tends to produce significant inequality and poverty. Under this system, many lack — through no fault of their own — access to basic educational opportunities, health care, and the foodstuffs required for them to meet their minimal nutritional needs. Some would argue that insofar as those who are extremely badly-off are not compensated or efforts are not made to provide them with enhanced opportunities, they are *harmed* by the social system. Those who support the social system by paying taxes, complying with its rules, and through other means are thus harming, rather than merely failing to benefit, less advantaged participants. Taxes that ensure that persons can meet their basic human needs may therefore need to be added to the economic system lest its imposition constitute a harming of the poor (Pogge 2002). This point has been emphasized in the work of political theorists who have framed demands for distributive justice in terms of predistribution (Hacker 2011, O’Neill and Williamson 2012, Thomas 2017)[^hacker-2011][^o’neil-2012][^thomas-2017]. These theorists call for corrective action to offset what he regards as the cost of policy shifts that have worked to the benefit of the very wealthy while undermining the position of the disadvantaged, for instance by reducing their organizing rights. In this context, tax and transfer could be seen as compensating for regressive changes in the predistribution of rights which would otherwise harm disadvantaged people.
    step1: |-
      然而，这场争论的双方都错了：他们径直假定福利与其他社会项目在这两种意义上是再分配性的。例如常有人主张，福利与其他社会项目是税收与转移的明显例子，因为这类项目通常由这样一些人缴纳的岁入来资助：他们很少——如果曾经的话——使用这些项目。但这假定了一种对人们如何能从这类项目中受益的过窄理解。特别是，它忽视了这些项目提供给资助者的*间接*利益。例如，提供一个体面的社会最低保障的项目，可以保护资助它们的人免受更高的犯罪率，或促成更高的增长率、更好的劳动力教育水平以及其他在许多方面使它们受益的社会善（Murphy & Nagel 2003, 第四章）[^murphy-2003]。然而，假设资助社会最低保障的纳税人能免于犯罪的风险，或不受这些项目产生的其他社会利益的影响。这会表明他们为支持这些项目所缴的税是再分配性的吗？也许是；但也可以有说服力地主张：正因为他们不支持这类项目，他们所缴的其余税款在资助一组制度安排，而这些安排*损害*着那些遭受严重匮乏的人。以一个以市场经济为特征的社会系统为例，其结构倾向于造成显著的不平等与贫困。在这个系统下，许多人——并非由于自己的过错——无法获得基本的教育机会、医疗保健以及满足其最低营养所需的食物。有人会论证说，只要那些境况极糟的人未得到补偿、或未作出为他们提供更多机会的努力，他们就是被这个社会系统*损害*了。那些通过缴税、遵守其规则以及其他方式支持这个社会系统的人，因而是在损害而非仅仅未使较不利的参与者受益。因此，确保人们能满足其基本人类需要的税收，可能需要加到经济系统之上，以免它的施行构成对穷人的损害（Pogge 2002）。这一点在政治理论家的工作中得到强调，他们以预分配来表述分配正义的要求（Hacker 2011, O’Neill and Williamson 2012, Thomas 2017）[^hacker-2011][^o’neil-2012][^thomas-2017]。这些理论家呼吁采取纠正行动，以抵消他们认为的政策变动的代价——那些变动有利于巨富而削弱了弱势者的地位，例如削减其组织权利。在此语境中，税收与转移可以被看作对权利预分配中的倒退性变化的补偿，否则这种变化将损害弱势者。
