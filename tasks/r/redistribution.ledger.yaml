      上面提到的政策提议颇有争议。不过它们表明，受益税与补偿税的概念本身是一个相当复杂的观念，它预设了一个基线，特定政策与制度安排可以参照它被看作使人受益或受害。作这类比较时可以诉诸几个基线，包括人们在“自然状态”中、在自由放任方案下、在一个人们的基本需要尽可能得到满足的秩序中会拥有的东西，等等。不同的基线会就这些安排给出不同的判定。而既然没有一个基线明显比其他的更“自然”或“中立”，就必须给出道德理由，把其中某一个当作评价一个特定制度秩序所造成的损害与收益之大小的适当基准。我们判定制度安排损害还是惠及了某个行动者——因而这些行动者与其他行动者所缴的税是否再分配——取决于我们关于这些安排应当如何设计的实质性规范评价。
