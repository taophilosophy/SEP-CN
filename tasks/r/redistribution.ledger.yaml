      The considerations above do not in themselves show, as Liam Murphy and Thomas Nagel (2003) have argued, that “Taxes do not take away from taxpayers what is antecedently theirs; pretax income has no status as a moral baseline for the purpose of evaluating the justice of the tax system.” Indeed, libertarians and others can still make out their case that rights-infringing redistribution has occurred by specifying and justifying entitlement producing rules that, if accepted, *would* grant pretax income significance as a moral baseline. They may argue, for example, that gross incomes have moral significance because they show the value of one’s contribution to social cooperation as assessed by others, or because they represent (at least roughly) differentials in what individuals contribute to total production.[^note-16]
    step1: |-
      上面的考量本身并没有表明——正如 Liam Murphy 与 Thomas Nagel（2003）所论证的——“税收并没有拿走纳税人事先拥有的东西；就评价税收系统的正义而言，税前收入没有作为道德基线的地位”。的确，自由至上主义者及其他人仍然可以立论说发生了侵犯权利的再分配：只要他们规定并证成一些产生权利主张的规则——这些规则若被接受，*就会*使税前收入作为道德基线具有意义。他们可以论证说，例如，毛收入有道德意义，因为它显示了一个人对社会合作的贡献在他人眼中的价值，或者因为它（至少粗略地）代表了个人对总生产之贡献的差异。[^note-16]
    step2: |-
      上述考量本身并未表明——正如 Liam Murphy 与 Thomas Nagel（2003）所论——“税收并未拿走纳税人事先拥有的东西；就评价税收系统的正义而言，税前收入没有作为道德基线的地位”。的确，自由至上主义者等仍可立论说发生了侵犯权利的再分配：只要他们规定并证成一些产生权利主张的规则——若被接受，这些规则*就会*让税前收入作为道德基线具有意义。例如他们可以论证：毛收入有道德意义，因为它显示了一个人的社会合作贡献在他人眼中的价值，或因为它（至少粗略地）代表着个人对总生产贡献的差异。[^note-16]
