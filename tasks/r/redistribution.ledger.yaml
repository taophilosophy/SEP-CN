      ## 1. Distributive Justice and Redistribution
    step1: |-
      ## 1 分配正义与再分配
    step2: |-
      ## 1 分配正义与再分配
  - id: 3
    kind: body
    source: |-
      The concept of distributive justice is sometimes understood as the moral assessment of distributions, or as the moral assessment of individual or collective decisions in light of how they affect distributions. Since the publication of Rawls’s “Theory of Justice”, however, discussions of distributive justice have tended to focus more narrowly on the moral assessment of systems of social rules in light of how they affect distributions. These distributions affecting institutions include laws and other social rules governing what kinds of things can be owned (and by whom), how they can be acquired, transferred, relinquished, and forfeited, how markets and the production systems are structured, the manner in which decisions concerning trade policy and the monetary system are made, and so on. Because international institutions such as markets in capital and labor, the structure of property rights, the international trading regimes (including the World Trade Organization), the international financial institutions marked by the agreement of Bretton Woods, and other complex systems of international rules can also be assessed in terms of their effects on distributions, talk of ‘international’ or ‘global’ distributive justice has more recently become more prominent in political theory (Beitz 1979, Caney 2005, Hinsch 2001, Miller 2007)[^beitz-1979][^caney-2005][^hinsch-2001][^miller-2007].
    step1: |-
      分配正义的概念有时被理解为对分配的道德评价，或被理解为依据个体或集体决定如何影响分配而对它们作出的道德评价。不过，自罗尔斯的《正义论》发表以来，关于分配正义的讨论趋于更窄地聚焦于对社会规则系统的道德评价，即依据它们如何影响分配来进行评价。这些影响分配的制度包括：规定何种东西可以（由谁）拥有、如何取得、转让、放弃与没收的法律和其他社会规则，市场与生产系统的结构，作出贸易政策与货币系统决定的方式，等等。由于资本与劳动的国际市场、产权结构、国际贸易体制（包括世界贸易组织）、以布雷顿森林协定为标志的国际金融机构以及其他复杂的国际规则体系，也可以按其对分配的影响来评价，“国际”或“全球”分配正义的说法近来在政治理论中愈发突出（Beitz 1979, Caney 2005, Hinsch 2001, Miller 2007）[^beitz-1979][^caney-2005][^hinsch-2001][^miller-2007]。
    step2: |-
      分配正义的概念有时被理解为对分配的道德评价，或依据个体与集体决定如何影响分配而对决定所作的道德评价。不过自罗尔斯《正义论》问世以来，分配正义的讨论趋于收窄：聚焦于对社会规则系统的道德评价——依其如何影响分配来评价。这类影响分配的制度包括：规定何种东西可以（由谁）拥有、如何取得、转让、放弃与没收的法律和其他社会规则；市场与生产系统的结构；贸易政策与货币系统决策的方式；等等。资本与劳动的国际市场、产权结构、国际贸易体制（含世界贸易组织）、以布雷顿森林协定为标志的国际金融机构，以及其他复杂的国际规则体系，同样可以按其对分配的影响来评价——“国际”或“全球”分配正义之说因此近年在政治理论中愈发突出（Beitz 1979, Caney 2005, Hinsch 2001, Miller 2007）[^beitz-1979][^caney-2005][^hinsch-2001][^miller-2007]。
  - id: 4
    kind: body
    source: |-
      The concept of redistribution has been invoked extensively in discussions of distributive justice in both the domestic and global context. Indeed, the differences between popular recent approaches to distributive justice, such as libertarianism, prioritarianism, and so-called luck egalitarianism, are sometimes characterized in terms of their attitudes towards redistribution (Scheffler 2003)[^scheffler-2003]. Even when non-philosophers debate the justice of distributions, or of distribution affecting institutional arrangements, their discussions often take the form of questioning whether and under what circumstances the ‘redistribution’ of wealth is justified. Extreme poverty in developed and developing countries, for example, has led many to question whether affluent people or countries can and ought to ‘help’ or ‘aid’ the poor by redistributing resources to them, and whether they can be compelled by law to do so (for example, through the tax system) (Narveson 2002, 2003)[^narveson-2002].
    step1: |-
      再分配的概念在国内与全球语境的分配正义讨论中被广泛援引。事实上，晚近流行的几种分配正义进路——如自由至上主义、优先主义与所谓的运气平等主义——之间的分歧，有时就按它们对再分配的态度来刻画（Scheffler 2003）[^scheffler-2003]。即便非哲学界人士争论分配或影响分配的制度安排是否正义，他们的讨论往往也采取追问财富的“再分配”是否正当、在何种条件下正当的形式。例如，发达国家与发展中国家的极端贫困，促使许多人追问：富裕的人或国家能否以及是否应当通过向穷人再分配资源来“帮助”或“援助”他们，能否以法律（例如通过税收系统）强制他们这样做（Narveson 2002, 2003）[^narveson-2002]。
    step2: |-
      再分配概念在国内外语境的分配正义讨论中被广泛援引。事实上，晚近流行的几条分配正义进路——自由至上主义、优先主义、所谓运气平等主义——之间的分歧，有时正以它们对再分配的态度来刻画（Scheffler 2003）[^scheffler-2003]。非哲学界人士争论分配或影响分配的制度安排是否正义时，往往也在追问财富的“再分配”是否正当、何时正当。例如，发达国家与发展中国家的极端贫困，促使许多人追问：富裕的个人或国家能否、是否应当通过向穷人再分配资源来“帮助”或“援助”他们，能否以法律（如税收系统）强制其为之（Narveson 2002, 2003）[^narveson-2002]。
  - id: 5
    kind: body
    source: |-
      Given its robust role in discussions of distributive justice, it is unsurprising that disagreements concerning the permissibility of redistribution have often been quite heated. Robert Nozick (1974, p 169) for example, has argued that redistribution in the form of compulsory taxation is “morally on par with forced labor.” And he has famously criticized egalitarian principles of distributive justice, such as Rawls’s difference principle (which categorizes as unjust any national economic order generating inequalities that are not to the greatest benefit of the lowest socio-economic position) on the grounds that they would require extensive redistributive transfers. In this vein, critics of so-called redistributive policies often claim that while individuals may have *positive* ethical duties to aid poor or unwell persons, it is morally impermissible to compel them to do so through state-administered tax and transfer or other means, unless universal consent for these policies can be secured (Narveson 2001, ch. 17)[^narveson-2001]. Egalitarians, on the other hand, have often argued that redistribution through compulsory taxation and other coercively imposed measures is required to meet basic material needs or to promote other valuable social goals, and provide a legitimate, though perhaps not morally costless means of doing so.
    step1: |-
      鉴于再分配在分配正义讨论中的重要作用，关于再分配之可容许性的分歧常常相当激烈，也就不足为奇。例如 Robert Nozick（1974, p 169）论证说，以强制税收为形式的再分配“在道德上与强迫劳动相当”。他还著名地批评了平等主义的分配正义原则——如罗尔斯的差别原则（它把任何产生不有利于最低社会经济地位者的不平等的国民经济秩序归为不正义）——理由是它们会要求大范围的再分配转移。循此思路，所谓再分配政策的批评者常常主张：虽然个体可以有帮助贫穷或不适者的*积极的*伦理义务，但通过国家管理的税收与转移支付或其他手段强制他们这样做，在道德上是不允许的，除非能为这些政策争取到普遍同意（Narveson 2001, ch. 17）[^narveson-2001]。另一方面，平等主义者常常论证说，要通过强制税收与其他强制性措施实现的再分配，是满足基本物质需要或推进其他有价值的社会目标所要求的，并且提供了一种正当的——尽管也许并非在道德上无代价的——实现手段。
    step2: |-
      再分配在分配正义讨论中作用如此之大，围绕其可容许性的分歧常常相当激烈，也就不足为奇。例如 Robert Nozick（1974, p 169）论证：以强制税收为形式的再分配“在道德上与强迫劳动相当”。他还著名地批评平等主义的分配正义原则——如罗尔斯的差别原则（凡产生不有利于最低社会经济地位者之不平等的国民经济秩序皆属不正义）——理由是这些原则会要求大范围的再分配转移。循此思路，所谓再分配政策的批评者常主张：个体固然可以负有援助贫穷或不适者的*积极的*伦理义务，但以国家管理的税收转移或其他手段强制之，在道德上不容许——除非能为这类政策取得普遍同意（Narveson 2001, ch. 17）[^narveson-2001]。平等主义者则常论证：经由强制税收与其他强制性措施的再分配，为满足基本物质需要、推进其他有价值的社会目标所必需，且提供了一条正当的——尽管也许并非道德上无代价的——实现途径。
