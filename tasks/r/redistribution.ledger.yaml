  - id: 8
    kind: body
    source: |-
      1. *Meaning/Status*: What does ‘redistribution’ mean? Does it have a unified and coherent meaning? What *kind* of a term is ‘redistribution’: Is it purely descriptive, so that we can classify practices as redistributive without evaluating them? Or does the correct application of the term, like democracy, liberty, and perhaps also coercion depend on evaluative judgments?[^note-1] To what kinds of social practices does redistribution refer, and in what sense are these practices redistributive? Does the concept of redistribution provide a helpful framework for understanding and evaluating institutional arrangements, or does it invite confusion?
      2. *Moral Significance*: Can social practices that are commonly said to involve redistribution be justified? In what contexts and for what purposes is it permissible to adopt these practices? Does the fact that a social practice involves redistribution count for or against it, or does it lack basic moral significance?
    step1: |-
      1. *意义／地位*：“再分配”意谓什么？它有一个统一的、融贯的意义吗？“再分配”是*哪一类*词：它是纯描述性的，以致我们能不作评价就把实践归类为再分配的？还是像民主、自由、或许还有强制那样，其正确应用依赖评价性判断？[^note-1]再分配指称哪些种类的社会实践，这些实践在何种意义上是再分配的？再分配概念为理解和评价制度安排提供了有益的框架，还是引来混乱？
      2. *道德意义*：通常被说成涉及再分配的社会实践能得到证成吗？在哪些语境中、出于哪些目的采纳这些实践是可允许的？一个社会实践涉及再分配这一事实，是对它有利还是不利，抑或缺乏基本的道德意义？
    step2: |-
      1. *意义／地位*：“再分配”意谓什么？它有统一而融贯的意义吗？“再分配”属于*哪一类*词：纯描述性的——以致无须评价即可把实践归类为再分配？还是像民主、自由乃至强制那样，其正确应用有赖评价性判断？[^note-1]再分配指称哪些社会实践？这些实践在何种意义上是再分配的？再分配概念为理解与评价制度安排提供了有益框架，还是徒然招致混乱？
      2. *道德意义*：通常被说成涉及再分配的社会实践能否得到证成？在哪些语境、出于哪些目的采纳它们是可允许的？一桩社会实践涉及再分配，这一事实为其加分还是减分，抑或根本没有基本的道德意义？
