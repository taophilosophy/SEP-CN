      Discussions of redistribution have often focused on the permissibility of levying taxes. And it may therefore be tempting simply to identify the baseline with pretax income. Not all taxes, however, are generally considered redistributive. Indeed, economists and legal theorists have typically distinguished between *‘redistributive’* and ‘*benefit’* taxation. Benefit taxes are typically understood (Biehl 1982, Cappelen 2000)[^biehl-1982] as user charges: taxes that are paid to cover the costs of the use of public and private goods, services, and enabling social conditions (for example, security, the legal system, social cohesion, public health) that are secured by the government or taxing authority.
