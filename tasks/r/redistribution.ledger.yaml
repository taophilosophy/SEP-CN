  - id: 20
    kind: body
    source: |-
      Redistribution is often understood more narrowly, referring only to socially caused changes in patterns of holdings over time that are implemented (at least in part) for the very reason that they are likely to bring about these changes.[^note-3] Let us refer to redistribution in this sense as ‘purposive diachronic redistribution.’
    step1: |-
      再分配常被更窄地理解，仅指持有模式随时间的社会性改变，且这些改变得以实施（至少部分地）正是因为它们可能带来这些改变。[^note-3]让我们把此意义上的再分配称为“有目的的历时再分配”。
    step2: |-
      再分配也常被理解得更窄：仅指持有模式随时间的社会性改变，且这些改变得以实施（至少部分地），正是料到它们会带来这些改变。[^note-3]此意义上的再分配，称为“有目的的历时再分配”。
  - id: 21
    kind: body
    source: |-
      Purposive diachronic redistribution is usually associated with (but is certainly not limited to) changes in systems of taxation and property rights. Changes in the structure of markets, the production system, monetary policy, the allocation of public funds for primary and secondary education, or the level of the minimum wage have all been adopted at least partly for the purpose of bringing about changes in the pattern of holdings. In a recent study, for instance, Alberto Alesina *et al*. (1999) have argued that Italy’s practice of heavily concentrating public sector jobs in the poorer Southern regions is ‘redistributive’ in that it is adopted for the purpose of creating a more egalitarian distribution of economic opportunities between Northern and Southern Italy. Purposive diachronic redistribution involves the successful implementation of institutions and policies whose purpose is to bring about changes in the holdings of different subjects. On this interpretation, determining whether redistribution has taken place involves identifying (1) the holdings of a set of subjects at time *t*₁; (2) the holdings of these subjects after the policy or institutional changes at *t*₂; (3) an agent or set of agents who have enacted the policy or institutional changes that have engendered changes in holdings; and (4) the purposes of these agents in bringing these changes about.
    step1: |-
      有目的的历时再分配通常与税收制度和产权制度的变化相联系（但当然不限于此）。市场结构、生产系统、货币政策、初等与中等教育公共资金分配或最低工资水平的变动，都至少部分地以改变持有模式为目的而被采纳。例如在最近的一项研究中，Alberto Alesina 等人（1999）论证说，意大利把公共部门职位重度集中于较贫穷的南方地区的做法是“再分配性的”，因为它被采纳的目的就是在意大利南北之间创造更平等的经济机会分布。有目的的历时再分配涉及以改变不同主体的持有为目的的制度与政策的成功实施。按这一解释，判断再分配是否发生涉及识别：（1）一组主体在时间 *t*₁ 的持有；（2）这些主体在时间 *t*₂ 政策或制度变动之后的持有；（3）一个或一组制定了引起持有变动的政策或制度变革的行动者；以及（4）这些行动者促成这些变动的目的。
    step2: |-
      有目的的历时再分配通常与税收、产权制度的变动相联（当然不限于此）。市场结构、生产系统、货币政策、中小学教育公共资金的分配、最低工资水平的变动，都至少部分地以改变持有模式为目的而被采纳。例如 Alberto Alesina 等人（1999）在近期研究中论证：意大利把公共部门职位重度集中于较贫穷南方地区的做法是“再分配性的”——其采纳目的正是在南北之间造就更平等的经济机会分布。有目的的历时再分配，涉及以改变诸主体持有为目的的制度与政策的成功实施。按此解释，判定再分配是否发生须识别：（1）一组主体在时间 *t*₁ 的持有；（2）这些主体在政策或制度变动后（时间 *t*₂）的持有；（3）制定了引发持有变动的政策或制度变革的一个或一组行动者；（4）这些行动者促成变动的目的。
  - id: 22
