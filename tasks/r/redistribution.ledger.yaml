      然而争论双方都错了：他们径直假定福利与其他社会项目在这两种意义上是再分配性的。例如常有人说：福利与社会项目是税收与转移的显例，因为资助它们的岁入来自那些很少（若曾有的话）使用这些项目的人。但这假定了一种过窄的理解——人们如何能从这类项目受益；尤其忽视了项目提供给资助者的*间接*利益：提供体面社会最低保障的项目，可保护资助者免受更高的犯罪率，或促成更高的增长率、受教育程度更高的劳动力，以及种种使他们多方面受益的社会善（Murphy & Nagel 2003, 第四章）[^murphy-2003]。退一步，即便资助社会最低保障者能免于犯罪风险、不受这些项目的其他社会利益影响——这能表明他们所缴之税是再分配性的吗？也许；但同样可以说得通：正因为他们不支持这类项目，其所缴其余税款在资助一组制度安排，而这些安排*损害*着深陷匮乏的人。以一个市场经济为特征的社会系统为例，其结构倾向造成显著的不平等与贫困；在此系统下，许多人——并非自己的过错——无法获得基本的教育机会、医疗保健与满足最低营养所需的食物。有人会论证：只要境况极糟者未获补偿、也无人努力为其创造更多机会，他们就被这个社会系统*损害*了；那些以缴税、守规则等方式支持该系统的人，便是在损害而非仅仅未惠及较不利的参与者。因此，确保人们满足基本需要的税收，也许必须加到经济系统之上，以免该系统的施行构成对穷人的损害（Pogge 2002）。政治理论家已强调这一点：他们以预分配（predistribution）表述分配正义的要求（Hacker 2011, O’Neill and Williamson 2012, Thomas 2017）[^hacker-2011][^o’neil-2012][^thomas-2017]——呼吁纠正性行动，抵消政策变动的代价：那些变动利在巨富、削弱弱势者（例如削减其组织权利）。在此语境下，税收与转移可视为对权利预分配中倒退性变化的补偿——否则弱势者将受其害。
