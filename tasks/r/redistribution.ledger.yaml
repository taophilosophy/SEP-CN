  - id: 24
    kind: body
    source: |-
      Sometimes redistribution is taken to refer to a particular social mechanism for bringing about changes in holdings overtime — namely, when there has been some prior distribution of resources, and those particular resources have been ‘taken’ away from some of those who initially possessed them and given to others. Let us refer to this second diachronic understanding as ‘redistribution as taking’. Identifying instances of redistribution as purposive taking requires specifying (1) a set of holdings of some rigidly identifiable agents (a, b, c) that obtains at time *t*₁; (2) the set of the holdings of these agents that obtains after the policy or institutional changes have been enacted at time *t*₂; and (3) the agent(s) that have ‘taken’ the holdings of some of these agents and distributed them to other of these agents.
    step1: |-
      有时再分配被理解为专指一种引起持有变化的社会机制——即存在某个先前的资源分布，那些特定资源被从最初拥有它们的某些人手中“夺走”并给予他人。让我们把这一第二种历时性理解称为“作为夺取的再分配”。识别作为有目的夺取的再分配的实例，需要规定：（1）某些刚性可识别的行动者（a、b、c）在时间 *t*₁ 所持有的一组财物；（2）在时间 *t*₂ 政策或制度变革实施之后这些行动者的持有集；以及（3）“夺取”了其中某些行动者的持有并把它分配给其他行动者的那个（那些）行动者。
    step2: |-
      有时，“再分配”专指一种引起持有变化的社会机制：存在某个先前的资源分布，其中一些特定资源被从最初的拥有者手中“夺走”，交给了别人。这第二种历时性理解，称为“作为夺取的再分配”。要识别“作为有目的夺取的再分配”的实例，须规定：（1）某些刚性可识别的行动者（a、b、c）在时间 *t*₁ 的持有集；（2）时间 *t*₂ 政策或制度变革实施后这些行动者的持有集；（3）“夺走”其中某些行动者的持有并分给其余行动者的那个（些）行动者。
  - id: 25
    kind: body
    source: |-
      Expropriation is a clear and familiar case of redistribution as taking. Some local government agency, for example, may expropriate a condominium from the Jones family without compensation and subsequently transfer the condominium to the Matua family. In this example, a good that was initially in the possession of some person or persons is taken out of their possession by some agent (perhaps by force or with the threat of force) and given to someone else.[^note-4] Land reform policies and some forms of taxation also appear to involve redistribution as taking. It is worth noting, however, that many purportedly ‘redistributive’ practices do not involve taking. Income tax, for instance, which is commonly thought to involve ‘redistribution as taking’, does not typically confiscate income that was initially in the possession of the taxpayer, since it is usually withheld from pay.[^note-5]
    step1: |-
      征收（expropriation）是作为夺取的再分配的一个明显而熟悉的例子。例如，某个地方政府机构可以无偿征收琼斯家的一套公寓分权房，随后把这套公寓分权房转让给 Matua 家。在这个例子中，一件最初由某些人占有的财物被某个行动者（也许靠武力或以武力相威胁）夺离他们的占有并给予他人。[^note-4]土地改革政策与某些形式的税收看来也涉及作为夺取的再分配。然而值得注意的是，许多所谓的“再分配性”实践并不涉及夺取。例如所得税——它通常被认为涉及“作为夺取的再分配”——一般并不没收最初由纳税人占有的收入，因为它通常从工资中预扣。[^note-5]
    step2: |-
      征收（expropriation）是作为夺取的再分配最明显、最常见的例子。例如某地方政府机构无偿征收琼斯家的一套分权公寓，随后把它转让给 Matua 家：一件最初由某些人占有的财物，被某个行动者（或靠武力，或以武力相威胁）夺离其占有，交给他人。[^note-4]土地改革政策与某些形式的税收，看来也涉及作为夺取的再分配。但值得注意的是：许多号称“再分配性”的实践并不涉及夺取——例如所得税，虽通常被认为属于“作为夺取的再分配”，却一般并不没收最初由纳税人占有的收入：它通常在发薪时即已预扣。[^note-5]
