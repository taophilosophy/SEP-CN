      Sometimes the baseline that is invoked in claims that redistributive policies are undertaken is the set of holdings that would have obtained *had they received that to which they were entitled*. Redistribution, then, is understood as the transfer of holdings that infringes property rights. In this sense, of course, resources could be *re*distributed from taxpayers to recipients without the taxpayers ever having these resources in their physical possession at all. Though people normally get a paycheck for their net income, and thus never have access to their gross income, they do, according to some, have a claim to their gross income, and thus the difference between gross and net income represents the transfer of holdings to which they were entitled. We can call this interpretation of redistribution ‘rights-infringing transfers’. Determinations of whether rights infringing transfers have occurred will clearly depend upon an account of the nature and scope of property rights. This requires specifying (1) who has the right; (2) what the right is a right to (the object of the right); and (3) the kinds of obligations that others have to the right-holder as a result of the right.[^note-12]
