      一个实践涉及作为税收与转移的再分配或侵犯权利，这一事实会有基本的道德意义吗？大多数人似乎同意会有。的确，诺齐克与其平等主义批评者之间的争论，一般都关系到一项政策在这两种意义上的再分配性是否提供了拒绝它们的*决定性的*道德理由。Nozick（1974, p.ix）（与其他自由至上主义者一道）主张有，他反对说：“国家不得把它的强制机器用于让一些公民援助其他公民的目的。”诺齐克的平等主义批评者则坚持，这类实践可以是一种令人遗憾的必需。例如 Thomas Scanlon（1981, p. 199）论证说：“或许正如诺齐克所说，存在着一个从税收延伸到强迫劳动的干预连续统，其中每一项都比前一项多封闭一些选择。但存在这样一个连续统这一事实，没有理由要求我们必须对它上面的任意两点漠然无别。”而 Thomas Nagel（1981, p. 201）补充说：“突然征收某人一半的储蓄，与预先给活动、支出和收入附上货币条件——税收的通常形式——之间有着巨大的区别。后者对人格的侵害远不如前者粗暴。”
