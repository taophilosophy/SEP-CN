      In equation (3), future values of $U$ are not discounted when viewed from the present moment, $t$. This particular move has provoked more debate among economists and philosophers than any other feature of Ramsey’s theory of optimum saving. The debate has on occasion been shriller than even we economists are used to (see in particular Nordhaus 2007)[^nordhaus-2007]. At the risk of generalizing wildly, economists have favoured the use of positive rates to discount future well-beings (e.g., Arrow and Kurz 1970)[^arrow-1970], whereas philosophers have insisted that the well-being of future people should be given the same weight as that of present people (e.g., Parfit 1984)[^parfit-1984].
    step1: |-
      在方程 (3) 中，从当下 $t$ 看，未来的 $U$ 值并未贴现。相对于拉姆齐最优储蓄理论的其他任何特征，这一做法在经济学家与哲学家中引发的争论更多。争论有时之激烈，连我们经济学家都感到不惯（尤其见 Nordhaus 2007）。冒着过分概化的风险说，经济学家倾向于使用正利率来贴现未来福祉（例如 Arrow and Kurz 1970），而哲学家则坚持未来人的福祉应与今人福祉同等分量（例如 Parfit 1984）。
    step2: |-
      方程 (3) 中，自当下 $t$ 观之，未来的 $U$ 值一概不贴现。拉姆齐最优储蓄理论的诸特征中，唯此一端在经济学者与哲学家中激起的争论最多，有时其激烈程度连我们经济学者也觉得不惯（尤见 Nordhaus 2007）[^nordhaus-2007]。大而化之地说：经济学者倾向于以正利率贴现未来福祉（如 Arrow and Kurz 1970）[^arrow-1970]，哲学家则坚持未来人的福祉应与今人同权（如 Parfit 1984）[^parfit-1984]。
