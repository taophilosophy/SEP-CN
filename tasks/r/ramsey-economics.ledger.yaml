      Equation (19) has shown that the optimum growth rate of consumption is bounded above by $\mu$, which explains why $g^*$ is less than 5% a year for each of the three parametric specifications we have considered. The specifications come from three studies in the welfare economics of global climate change, in which the authors worked with models that are a lot more complex than Ramsey’s. And yet their findings are exactly what his formulation would point to (Dasgupta 2008)[^dasgupta-2008], namely, that other things equal, the lower is the chosen value of $\delta$ and/or the larger is the damage to future well-being that is expected to be caused by global climate change, the greater is the investment level DM should recommend to avert climate change or soften the effects of that change on human well-being. The often shrill debate (e.g., Nordhaus 2007)[^nordhaus-2007] on the extent to which global investment should be directed at reducing the deletarious effects of climate change was spurred by differences in model specification among climate-change economists.
    step1: |-
      方程 (19) 已表明，最优消费增长率有上界 $\mu$，这就解释了为何在我们所考察的三种参数设定下，$g^*$ 都低于每年 5%。这些设定来自三份关于全球气候变化福利经济学的研究，作者们在那里使用的模型远比拉姆齐的复杂。然而他们的发现正是其表述所指向的（Dasgupta 2008）[^dasgupta-2008]：其他条件不变时，$\delta$ 的选定值越低、和／或全球气候变化预期造成的未来福祉损害越大，DM 为防范气候变化或缓和其对人类福祉的影响所应建议的投资水平就越高。关于全球投资应在多大程度上用于减少气候变化有害效应的那场时常尖锐的争论（例如 Nordhaus 2007），正是由气候变化经济学家之间模型设定的差异所激起的。
    step2: |-
      方程 (19) 已表明，最优消费增长率以 $\mu$ 为上界；这就解释了何以在三种参数设定下 $g^*$ 皆低于每年 5%。此三种设定出自三份全球气候变化福利经济学研究，其作者所用模型远较拉姆齐者复杂；然而其结论恰是拉姆齐表述所指向（Dasgupta 2008）[^dasgupta-2008]。其他条件不变时，$\delta$ 的选定值愈低、和／或全球气候变化预期造成的未来福祉损害愈大，DM 为防阻气候变化或缓和其对人类福祉的冲击所应建议的投资水平便愈高。彼场关于全球投资应在多大程度上用于减轻气候变化恶果的争论（如 Nordhaus 2007）[^nordhaus-2007]，时或唇枪舌剑，实由气候变化经济学者之间模型设定的分歧所激起。
