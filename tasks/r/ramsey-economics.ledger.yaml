      Because the $U$-function is unique up to positive affine transformations, we may without any loss of generality normalize it so that $U(0) \ne 0$. It is then obvious that for all feasible $\{C(t)\}$, $V(0)$ in *Ramsey Mark I* diverges to minus infinity if $U(0) \lt 0$, but diverges to plus infinity if $U(0) \gt 0$. That an optimum policy does not exist in the cake-eating model can be seen if we now recall that $U(C)$ has been assumed to be strictly concave. The assumption implies that any non-egalitarian distribution of consumption among the generations can be improved upon by a suitable redistribution. The ideal distribution would be equal consumption for all generations. The only consumption stream with the latter property is $C(t) = 0$ for all $t$. But that’s the worst possible distribution. QED
    step1: |-
      由于 $U$ 函数只在正仿射变换下唯一，我们可以不失一般性地把它规范化，使 $U(0) \ne 0$。于是显然：对一切可行 $\{C(t)\}$，*拉姆齐第一式* 中的 $V(0)$ 若 $U(0) \lt 0$ 则发散到负无穷，若 $U(0) \gt 0$ 则发散到正无穷。吃蛋糕模型中不存在最优政策，这一点可以这样看出：我们记得 $U(C)$ 已被假定为严格凹。该假定意味着，世代间任何不平等的消费分配都可以通过适当再分配来改善。理想的分配是各世代消费相等。唯一具有后一性质的消费流是 $C(t) = 0$（对所有 $t$）。但那是最坏的分配。证毕。
    step2: |-
      $U$ 函数只具正仿射变换下的唯一性，故可不失一般性地将其规范化，使 $U(0) \ne 0$。于是显而易见：对一切可行的 $\{C(t)\}$，若 $U(0) \lt 0$，**拉姆齐第一式** 中的 $V(0)$ 发散至负无穷；若 $U(0) \gt 0$，则发散至正无穷。吃蛋糕模型里不存在最优政策，可由下述推知：我们记得 $U(C)$ 被假定为严格凹；此假定意味着，代际间任何不平等的消费分配，都可借适当再分配而改善。理想的分配是各代消费均等；而唯一具此性质的消费流，是 $C(t) = 0$（对所有 $t$）。偏偏那又是最坏的分配。证毕。
