      1. Low rates of consumption by generations sufficiently far into the future would not be seen to be a bad thing by the current DM if future well-beings were discounted at a positive rate. So today’s DM would recommend high consumption rates for now and the near future even if that meant generations in the distant future would live in penury. But if such a policy were followed, the demands of a further moral requirement to Classical Utilitarianism that DM may hold, namely, “intergenerational equity,” would not be met. Therefore we should follow Ramsey and not discount future well-beings.
      2. Write $dF(K)/dK$ as $F_K$. From equation (1) it is simple to deduce that $F_K$ is the rate of return on investment. In Ramsey’s economy $F_K \gt 0$, which means every unit of output that is saved yields more than a unit of future consumption, other things equal. For example, if DM were to reduce consumption at $t$ by a unit, the additional consumption that would be available in the briefest of periods later – we write that as $\Delta t$ – without affecting consumption at any future date would be $1+[dF(K(t))/dK(t)]\Delta t$. The productivity of capital is thus tied to the arrow of time, which creates a bias in favour of future generations. This bias gives bite to the adage, “We can do something for posterity, but what can posterity ever do for us?” The thought inevitably arises that perhaps the bias should be countered in DM’s calculus if some attention were to be given by her to intergenerational equity in realized well-being as a supplement to Classical Utilitarianism. That in turn suggests that DM should abandon Ramsey and discount future well-beings at a positive rate.
    step1: |-
      1. 若未来福祉以正率贴现，则足够遥远之世代消费率偏低，在当下 DM 看来并不算坏事。因此今天的 DM 会建议当下与近未来保持高消费率，即使这意味着遥远未来的世代生活于贫困。但若奉行此种政策，则 DM 可能持有的、古典功利主义之外的另一道德要求——“代际公平”——便得不到满足。因此我们应当追随拉姆齐，不贴现未来福祉。
      2. 把 $dF(K)/dK$ 写作 $F_K$。由方程 (1) 容易推出，$F_K$ 是投资的收益率。在拉姆齐经济中 $F_K \gt 0$，这意味着其他条件不变时，每节约一单位产出，可换来超过一单位的未来消费。例如，若 DM 在 $t$ 时减少一单位消费，则在稍后极短一段时间（记作 $\Delta t$）内可多得的、且不影响任何未来日期消费的额外消费，将是 $1+[dF(K(t))/dK(t)]\Delta t$。资本的生产率于是与时间之箭相系，形成一种有利于未来世代的偏倚。这一偏倚使那句老话有了分量：“我们能为后代做些什么，而后代又能为我们做什么？”念头不免浮现：若 DM 在古典功利主义之外还稍加留意实现福祉上的代际公平，或许就该在她的计算中抵消这一偏倚。这又提示，DM 应当放弃拉姆齐、以正率贴现未来福祉。
