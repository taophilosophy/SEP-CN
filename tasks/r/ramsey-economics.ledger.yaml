      There is a more general point here, which was explored by Koopmans (1960, 1965, 1967, 1972) in a remarkable set of publications on the idea of economic development. In such complex exercises as those involving consumption and investment over a long time horizon, it is foolish to regard any ethical principle (e.g., Classical Utilitarianism) as sacrosanct. One can never know in advance what it may run up against. A more judicious tactic than Ramsey’s would be to to play off one set of ethical assumptions against another in not-implausible worlds, see what their implications are for the distribution of well-being across generations, and then appeal to our intuitive senses before arguing over policy. Settling *ex ante* whether to use a positive rate to discount future well-beings could be a self-defeating move.[^note-1]
    step1: |-
      这里有一个更一般的要点，科普曼斯（1960、1965、1967、1972）在一系列论经济发展的出色论著中作了探讨。在诸如涉及时长跨度消费与投资的复杂演练中，把任何伦理原则（例如古典功利主义）视为神圣不可侵犯都是愚蠢的。人永远无法预先知道它会撞上什么。比拉姆齐更审慎的策略是：在不那么难以置信的诸世界中，让一套伦理假定与另一套相互较量，看它们对代际福祉分配有何意涵，然后诉诸我们的直觉，再争论政策。预先就断定是否使用正率贴现未来福祉，可能是一步自拆台脚的棋。[^note-1]
    step2: |-
      此处尚有一个更一般的要点。科普曼斯（1960、1965、1967、1972）在一系列论经济发展的精彩论著中曾加探讨，谓：在涉及时长跨度消费与投资的复杂推演里，把任何伦理原则（如古典功利主义）奉为不可侵犯，都是愚不可及。人总不能预知它会撞上什么。较拉姆齐更为审慎的策略是：在不那么难以设想的世界中，令一套伦理假定与另一套彼此较量，看它们对代际福祉分配有何蕴含，然后诉诸吾人的直觉，再议政策。事先就断定当否以正率贴现未来福祉，恐怕是一着自拆台脚的棋。[^note-1]
