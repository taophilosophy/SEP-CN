      Write $dU/dC = U_C$ and $d^2 U/dC^2 = U_{CC}.$ Let $\{C(t)\}$ be a feasible consumption stream. We first deduce a formal expression for the marginal rate of ethically indifferent substitution between consumption at any two brief periods of time. Suppose the intention is to reduce consumption at some future date $t$ by a small quantity $\Delta C(t)$ and raise consumption at a nearby date $t+\Delta t$ while keeping consumption at all other dates the same as in $\{C(t)\}$. The loss in well-being that would follow from the move is $e^{-\delta t}U_{C(t)}\Delta C(t)$. We now seek to determine the percentage increase in consumption that would be required at $t+\Delta t$ if $V(0)$ is to remain unchanged; because that’s the marginal rate of ethically indifferent substitution between consumption at $t$ and consumption at $t+\Delta t$. Denote that rate by $\varrho(t)$. Then $\varrho(t)$ must be the percentage rate at which discounted marginal well-being declines at $t$. It also follows that $\varrho(t)$ is the rate the DM at $t = 0$ would use to discount a unit of consumption at $t$ so as to bring it to the present (because that’s what is meant by the percentage rate at which discounted marginal well-being declines at $t$ – for a formal demonstration, see Dasgupta, 2008). Some economists call $\varrho(t)$ the *consumption rate of interest* (Little and Mirrlees 1974)[^little-1974], others call it the *social rate of discount* (Arrow and Kurz 1970)[^arrow-1970]. $\varrho(t)$ is a fundamental object in social cost-benefit analysis.
    step1: |-
      写作 $dU/dC = U_C$，$d^2 U/dC^2 = U_{CC}.$ 令 $\{C(t)\}$ 为可行消费流。我们首先推出任意两个短暂时间段之间消费的伦理无差异替代边际率的一个形式表达式。假定意图是：把某个未来日期 $t$ 的消费减少一个很小的量 $\Delta C(t)$，并提高邻近日期 $t+\Delta t$ 的消费，同时使其他一切日期的消费与 $\{C(t)\}$ 中相同。此举带来的福祉损失为 $e^{-\delta t}U_{C(t)}\Delta C(t)$。我们现在要确定：若 $V(0)$ 保持不变，$t+\Delta t$ 时的消费需增加百分之几；因为那正是 $t$ 时消费与 $t+\Delta t$ 时消费之间的伦理无差异替代边际率。记该比率为 $\varrho(t)$。那么 $\varrho(t)$ 必定是贴现边际福祉在 $t$ 时下降的百分比速率。由此还可推出，$\varrho(t)$ 就是 $t = 0$ 时的 DM 用来把 $t$ 时一单位消费贴现到当下的比率（因为所谓贴现边际福祉在 $t$ 时下降的百分比速率，正指此意——形式证明见 Dasgupta, 2008）。一些经济学家把 $\varrho(t)$ 称为 *消费利息率*（Little and Mirrlees 1974）[^little-1974]，另一些人称之为 *社会贴现率*（Arrow and Kurz 1970）[^arrow-1970]。$\varrho(t)$ 是社会成本—收益分析中的一个基本对象。
    step2: |-
      记 $dU/dC = U_C$，$d^2 U/dC^2 = U_{CC}.$ 令 $\{C(t)\}$ 为可行消费流。先推出任意两个短暂时段之间消费的伦理无差异替代边际率之形式表达式。设意图是：把某个未来日期 $t$ 的消费减一小量 $\Delta C(t)$，而提高邻近日期 $t+\Delta t$ 的消费，其余一切日期的消费仍如 $\{C(t)\}$。此举所致福祉损失为 $e^{-\delta t}U_{C(t)}\Delta C(t)$。今欲确定：欲使 $V(0)$ 不变，$t+\Delta t$ 时的消费须增加百分之几——这正是 $t$ 时消费与 $t+\Delta t$ 时消费之间的伦理无差异替代边际率。记该比率为 $\varrho(t)$。则 $\varrho(t)$ 必是贴现边际福祉在 $t$ 时下降的百分比速率；由此亦可推知，$\varrho(t)$ 正是 $t = 0$ 时的 DM 用以把 $t$ 时一单位消费折现到当下的比率（所谓贴现边际福祉在 $t$ 时下降的百分比速率，即指此意——形式证明见 Dasgupta, 2008）。有经济学者称 $\varrho(t)$ 为 **消费利息率**（Little and Mirrlees 1974）[^little-1974]，亦有称之为 **社会贴现率** 者（Arrow and Kurz 1970）[^arrow-1970]。$\varrho(t)$ 是社会成本—收益分析中的基本对象。
