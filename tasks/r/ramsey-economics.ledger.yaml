  - id: 6
    kind: body
    source: |-
      Ramsey’s goal was practical: “How much of a nation’s output should it save for the future?” The demographic profile over time was taken by him to be given, meaning that future numbers of people were seen as exogenous and predictable. We were therefore to imagine that economic policies have a negligible effect on reproductive behaviour (but see Dasgupta, 1969, for a study of the joint population/saving problem, using Classical Utilitarianism as the guiding principle). Parfit (1984) christened choices involving the same demographic profile, “Same Numbers Choices.”
    step1: |-
      拉姆齐的目标是实践的：“一个国家的产出应当为未来储蓄多少？”他把随时间变化的人口状况视为给定，即未来人口数量被视为外生的、可预测的。因此我们应当设想，经济政策对生育行为的影响可以忽略（但参见 Dasgupta, 1969，该文以古典功利主义为指引原则，研究人口／储蓄的联合问题）。帕菲特（1984）把涉及同一人口状况的选择称为“同数选择”。
    step2: |-
      拉姆齐的目标务求实用：“一国产出应为未来储蓄多少？”他把长时段的人口状况当作给定，即未来人口数目被视为外生而可预知。于是我们须设想：经济政策对生育行为的影响微不足道（但参见 Dasgupta, 1969：该文以古典功利主义为指引，研究人口与储蓄的联合问题）。帕菲特（1984）把人口状况相同的选择唤作“同数选择”。
  - id: 7
    kind: body
    source: |-
      The ingredients of Ramsey’s theory are individuals’ lifetime well-beings. Government House in his world maximizes the expected sum of the lifetime well-beings of all who are here today and all who will ever be born, subject to resource constraints. The optimum distribution of lifetime well-beings across generations is derived from that maximization exercise. Of course, the passage of time is not the same as the advance of generations. An individual’s lifetime well-being is an aggregate of the flow of well-being she experiences, while intergenerational well-being is an aggregate of the lifetime well-beings of all who appear on the scene. It is doubtful that the two aggregates should have the same functional form. On the other hand, there is little evidence to suggest that we would be way off the mark in assuming they do have the same form. As a matter of practical ethics, it helps enormously to approximate by not distinguishing the functional form of someone’s well-being over time from that of well-being across the generations. Ramsey adopted this short-cut. People were also taken to be identical, so we may as well assume that there is a single individual at each date. The move removes any distinction between time and generations. An alternative interpretation would have us imagine that the economy consists of a single dynasty, where parents in each generation leave bequests for their children (Meade 1966, adopted this interpretation)[^meade-1966]. Ramsey also assumed, probably because the mathematics is simpler, that time is a continuous variable, not discrete.
    step1: |-
      拉姆齐理论的要素是个体一生的福祉。在他所设想的世界里，官邸在资源约束下最大化所有今世之人与所有未来将出生者一生福祉的期望总和。代际之间一生福祉的最优分配，即由这一最大化推演而来。当然，时间的推移并不等同于世代的更替。个体一生的福祉是其经历的福祉流之总和，而代际福祉是所有出场者一生福祉之总和。这两个总和是否应具有相同的函数形式，颇可怀疑。另一方面，也少有证据表明，假定二者形式相同会使我们大错。就实践伦理学而言，不区分某人随时间变化的福祉与跨世代的福祉在函数形式上的差别，从而作近似处理，帮助极大。拉姆齐采取了这一捷径。人也被视为同一的，因此不妨假定每个时点只有一个个体。这一做法取消了时间与世代之间的一切区分。另一种解释则要我们设想经济由单一王朝构成，每代的父母为子女留下遗赠（Meade 1966 采取了这一解释）[^meade-1966]。拉姆齐还假定时间是连续变量而非离散变量——大概因为数学上更简单。
    step2: |-
      拉姆齐理论的构成要素，是个体一生的福祉。在他设想的世界中，官邸在资源约束下最大化一切今人与一切将生者一生福祉的期望总和；代际间一生福祉的最优分配，便由此最大化推演而出。自然，时间流逝不等于世代更替。个体一生的福祉，聚合其一生所历之福祉流；代际福祉则聚合一切登场者一生之福祉。这两个聚合法是否应具同一函数形式，殊可怀疑；但另一方面，也少有证据表明假定二者同形会使我们偏离太远。就实践伦理学言，不去区分个体跨时间福祉与跨世代福祉在函数形式上的差异、径作近似，助益极大——拉姆齐便采此捷径。人又被视为彼此相同，故不妨假定每个时点只有单一个体；此举抹去了时间与世代之别。另一种解释则设想经济由单一王朝构成，每代父母向子女遗留遗产（Meade 1966 即采此解）[^meade-1966]。拉姆齐还假定时间为连续变量而非离散变量，多半是因为数学上更简便。
