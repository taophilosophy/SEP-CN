      Ramsey assumed that work is unpleasant. But because including the disutility of work in our account of his work here would add nothing of substance, we suppose that labour supply is an exogenously given constant (e.g., it is independent of the wages labour can demand). That enables us to suppress the supply of labour in both production and the factors affecting well-being.
    step1: |-
      拉姆齐假定劳动是令人不快的。但由于把劳动的负效用在本文的叙述中计入，不会增添任何实质内容，我们假定劳动供给是外生给定的常数（例如与劳动所能要求的工资无关）。这使我们能够略去生产中的劳动供给以及影响福祉的因素。
    step2: |-
      拉姆齐假定工作令人不快。但在我们此处对其学说的叙述中，把劳动的负效用计入并不会增添任何实质内容，故径直假定劳动供给为外生常数（例如不随劳动所能索取的工资而变）。如此便可略去生产中的劳动供给，以及影响福祉的诸因素。
  - id: 10
    kind: body
    source: |-
      If $K$ is the stock of capital of the economy’s one and only commodity, output is taken to be $F(K)$, where $F(0) = 0$ (i.e., output is zero if there is no capital), $dF(K)/dK \gt 0$ (i.e., the marginal product of capital is positive), and $d^2 F(K)/dK^2 \le 0$ (i.e., the marginal product of $K$ does not increase with $K$). $F(K)$ is a *flow* (production at a moment in time), in contrast to $K$, which is a *stock* (quantity of capital, period). Notice also that output depends solely on the stock of capital. No mention is made of possible improvements in the quality of capital or labour. Thus, there is no prospect of technological progress or accumulation of human capital in Ramsey’s model (but see Mirrlees 1967, for one of the first of many extensions of the Ramsey model that include technological advances in production and human capital formation)[^mirrlees-1967]; nor are there any natural resources in the model (but see Dasgupta and Heal 1974, for one of the first of many extensions of the Ramsey model that include natural capital in production)[^dasgupta-1974].
    step1: |-
      若 $K$ 是经济中唯一商品的资本存量，产出取为 $F(K)$，其中 $F(0) = 0$（即无资本则产出为零）、$dF(K)/dK \gt 0$（即资本的边际产品为正）、$d^2 F(K)/dK^2 \le 0$（即 $K$ 的边际产品不随 $K$ 增加而增加）。$F(K)$ 是一个 *流量*（某一时刻的生产），与 $K$ 相对，后者是 *存量*（资本数量，按时期计）。还须注意，产出仅取决于资本存量。文中未提及资本或劳动质量的可能改进。因此，在拉姆齐的模型中没有技术进步或人力资本积累的前景（但参见 Mirrlees 1967，那是众多在拉姆齐模型中加入生产的技术进步与人力资本形成的扩展之一）[^mirrlees-1967]；模型中也没有自然资源（但参见 Dasgupta and Heal 1974，那是众多在生产中加入自然资本的扩展之一）[^dasgupta-1974]。
    step2: |-
