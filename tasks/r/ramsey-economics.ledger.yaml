    kind: body
    source: |-
      Let $t \ge 0$ denote time. In Ramsey’s model there is no uncertainty (but see Levhari and Srinivasan, 1969, for one of the first of many extensions of the Ramsey model that incorporate uncertainty about future possibilities). The economy is endowed with a *single, non-depreciating* commodity that can be worked by labour to produce output at each date (Gale 1967 and Brock 1973, were among the first of many extensions of the Ramsey model that contain a heterogeneous collection of capital goods)[^brock-1973][^gale-1967]. The economy is assumed to be closed to international trade (opening the economy to trade involves only a minor extension to Ramsey’s model). That means some of the output can be invested so as to add to the commodity’s stock while the remainder can be consumed immediately. We call the stock of the commodity that serves to produce output, “capital.” The problem is then to find the optimum allocation of output at each date between consumption and investment.
    step1: |-
      令 $t \ge 0$ 表示时间。在拉姆齐的模型中没有不确定性（但参见 Levhari and Srinivasan, 1969，那是众多把未来可能性的不确定性纳入拉姆齐模型的扩展之一）。经济被赋予一种 *单一的、不发生折旧的* 商品，可由劳动加工而于每个时点生产产出（Gale 1967 与 Brock 1973 是最早一批把异质资本品集合纳入拉姆齐模型的扩展）[^brock-1973][^gale-1967]。经济被假定对国际贸易封闭（向贸易开放只涉及对拉姆齐模型的微小扩展）。这意味着部分产出可投资以增加该商品的存量，其余则可立即消费。我们把用来生产产出的商品存量称为“资本”。问题于是变成：在每个时点上，如何在消费与投资之间最优分配产出。
    step2: |-
      令 $t \ge 0$ 表时间。拉姆齐模型中不含不确定性（但参见 Levhari and Srinivasan, 1969：那是把未来诸可能之不确定性纳入拉姆齐模型的最早扩展之一）。经济只被赋予 **一种不折旧的商品**，可经由劳动加工而在每个时点产出产品（Gale 1967 与 Brock 1973 属最早一批把异质资本品集合纳入该模型的扩展）[^brock-1973][^gale-1967]。经济被设定为对国际贸易封闭（开放贸易只须对拉姆齐模型作微小扩展）。这意味着：一部分产出可作投资以增添该商品存量，余者则可即时消费。我们把用以生产产出的该商品存量称作“资本”。问题遂为：在每个时点，如何在消费与投资之间最优地分配产出。
