      A figure of 5% a year for $\mu$ implies a capital-output ratio $(1/\mu)$ of 20 years, which is far higher than the estimates of capital-output ratios from inter-industry studies that economists in various parts of the world have arrived at (Behrman 2001)[^behrman-2001]; a representative figure for 1/$\mu$ in that literature is 3 years. But their estimates have been based on a definition of “capital” that is confined to “produced” capital, such as factories, roads, ports, and buildings. Human capital (education, health, knowledge) is missing from them, as is natural capital (ecosystems, sub-soil resources). Ramsey’s model, as encapsulated in equation (11a), embraces all forms of capital goods. No doubt his formulation requires a heroic (read, impossible!) feat of aggregation, but when all capital goods that enter production are taken into account, we should expect an aggregate capital-output ratio (which we should call the (inclusive) wealth-output ratio), to be a lot higher than 3 years; perhaps even higher than 20 years (Arrow et al., 2012, 2013). Large categories of capital goods are absent from the national economic accounts that inform we economists’ understanding of production and consumption possibilities (Dasgupta, 2019). It would thus seem there is still a long way to go before we can reach a good approximation of what we should bequeath to our descendants.
    step1: |-
      $\mu$ 为每年 5%，意味着资本—产出比 $(1/\mu)$ 为 20 年，这远高于世界各地经济学家从产业间研究中得出的资本—产出比估计（Behrman 2001）[^behrman-2001]；该文献中 $1/\mu$ 的一个代表性数值是 3 年。但他们的估计基于一种仅限于“生产出来的”资本的“资本”定义，如工厂、道路、港口与建筑。人力资本（教育、健康、知识）在其中缺席，自然资本（生态系统、地下资源）亦然。拉姆齐的模型如方程 (11a) 所概括，囊括一切形式的资本品。无疑，他的表述需要一次英雄式（读作：不可能的！）的加总壮举；但当一切进入生产的资本品都被计入时，我们应当预期一个加总的资本—产出比（我们该称之为（包容性的）财富—产出比）远高于 3 年，或许甚至高于 20 年（Arrow et al., 2012, 2013）。国民经济账户中所缺的是许多大类资本品，而这些账户正是我们经济学家理解生产与消费可能性的依据（Dasgupta, 2019）。如此看来，要很好地近似我们应当留给子孙的遗产，还有很长的路要走。
    step2: |-
      $\mu$ 为每年 5%，意味着资本—产出比 $(1/\mu)$ 达 20 年，远高于世界各地经济学者从产业间研究得出的资本—产出比估计（Behrman 2001）[^behrman-2001]；该文献中 $1/\mu$ 的代表性数值为 3 年。然而他们的估计所据的“资本”定义，仅限于“生产出来的”资本，如厂房、道路、港口与楼宇；人力资本（教育、健康、知识）不在其中，自然资本（生态系统、地下资源）亦不在其中。拉姆齐的模型如方程 (11a) 所概括，则囊括一切形式的资本品。无怪乎其表述需要一次英雄式的（读作：不可能的！）加总；但若把一切进入生产的资本品尽数计入，我们便当预期加总的资本—产出比（宜称之（包容性的）财富—产出比）远高于 3 年，甚或高于 20 年（Arrow et al., 2012, 2013）。国民账户中缺漏了许多大类的资本品，而这些账户正是我们经济学者理解生产与消费可能性的凭据（Dasgupta, 2019）。如此看来，要较好地近似我们该留给子孙的遗产，尚有长路要走。
