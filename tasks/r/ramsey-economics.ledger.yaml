      How should we conceptualise human well-being over time and across generations? How ought the interests of people in the distant future to be taken into account when we make our own decisions? How much of its output should a nation invest for the future? In which assets should that investment be made? What should be the balance among private, public, and communitarian investments in the overall investment that a generation makes for the future? How much should the world spend in countering global climate change?
    step1: |-
      我们应当如何构想跨时间、跨世代的人类福祉？当我们作出自己的决定时，应当如何顾及遥远未来之人的利益？一个国家应为其未来投入多少产出？这种投资应当投向哪些资产？在一代为未来所作的总投资中，私人、公共与共同体投资之间应保持何种平衡？世界应当为应对全球气候变化花多少钱？
    step2: |-
      跨时间、跨世代的人类福祉应当如何构想？我们作决定时，应如何顾及遥远未来者的利益？一国应把多少产出留作未来投资？投资又当投向哪些资产？在一代为未来所作的全部投资中，私人投资、公共投资与共同体投资应各占几许？世界又该为应对全球气候变化支出多少？
  - id: 2
    kind: body
    source: |-
      In a remarkable paper Frank Ramsey developed a framework in which each of these questions can be studied in a form that is precise and tractable enough to elicit answers (Ramsey 1928; see, also, Misak 2020)[^misak-2020][^ramsey-1928]. His approach was to apply the Classical-Utilitarian calculus to identify the best match from among attainable and desirable utility streams over time and across generations. Although very famous today, the paper had no initial impact. Some economists have attributed the lack of interest to the paper’s technical character. In answering the question he posed (“How much of a nation’s output should it save?”), Ramsey had to use the calculus of variations. There is no question but that few economists then knew the required technicalities. But it is difficult to imagine that there were no economists capable of learning the necessary mathematics had they wished to do so. The reason there was little interest in Ramsey’s paper lay elsewhere. In the years following the publication, a period now known as The Great Depression, the central economic problem in industrialised countries was to find ways to increase employment. Factories lay idle, as did people. The unemployment rate in Europe and USA was in the region of 25%. Policies that were needed then had to do with creating incentives for employers to hire workers. Even though there were controversies among economists on what those policies should be, no one doubted that industrialized societies were facing a problem of the short run. In contrast, Ramsey addressed a question involving the long run; and, so as to have an uncluttered problem to analyse, he took it as given that there is full employment at every date of both capital and labour.
    step1: |-
      在一篇非凡的论文中，弗兰克·拉姆齐建立了一个框架，使上述每个问题都能以足够精确、可处理的形式加以研究，从而引出答案（Ramsey 1928; 亦见 Misak 2020）[^misak-2020][^ramsey-1928]。他的做法是运用古典功利主义的计算，在可达到的、可欲的效用流中找出最佳匹配——这些效用流既跨时间，也跨世代。尽管此文今日极为著名，最初却毫无反响。一些经济学家把缺乏兴趣归因于该文的技术性。在回答他自己提出的问题（“一国的产出应储蓄多少？”）时，拉姆齐不得不使用变分法。当年懂得所需技术细节的经济学家寥寥无几，这毫无疑问。但很难设想，当时就没有经济学家愿意学、并且学得会必要的数学。对拉姆齐论文兴趣寥寥的原因在别处。论文发表后的年月，即今称“大萧条”的时期，工业化国家的核心经济问题是设法增加就业。工厂闲置，人亦闲置。欧洲与美国的失业率约为 25%。当时所需的政策，都与激励雇主雇工有关。尽管经济学家对那些政策应当如何存在争议，却无人怀疑工业化社会面对的是短期问题。相比之下，拉姆齐所处理的问题涉及长期；而为了得到一个干净的问题来作分析，他假定资本与劳动在每个时点都充分就业。
    step2: |-
      弗兰克·拉姆齐在一篇非凡的论文中建立了一个框架，上述每一问题皆可在其中以足够精确、足够可处理的形式得到处理，从而引出答案（Ramsey 1928; 亦见 Misak 2020）[^misak-2020][^ramsey-1928]。其做法是运用古典功利主义的算法，在可得且可欲的效用流中择出最佳匹配——这些效用流跨时间、跨世代。此文今日声名极盛，初出时却几无反响。有些经济学者将该文之受冷落归因于其技术性：为回答自己提出的问题（“一国产出应储蓄多少？”），拉姆齐不得不用变分法；当年通晓所需技术细节者寥寥，自无疑义。然而总难设想：当时竟无一经济学者愿意去学、且学得会那些必要的数学。冷落的缘由另有所在。论文问世之后的那段年月，今称“大萧条”，工业化国家的核心经济难题是设法扩大就业：工厂停摆，人亦无事；欧洲与美国的失业率约在 25%。彼时所需的政策，皆系于为雇主创造雇工诱因。经济学者虽对那些政策应如何设计争论不休，却无人怀疑工业化社会面临的是短期问题。相形之下，拉姆齐所处理的却是长期问题；且为使问题免于纠缠，他径直假定资本与劳动在每个时点均充分就业。
  - id: 3
    kind: body
    source: |-
      With the emergence of post-colonial nations following the Second World War, long run economic development became prominent in economic studies. By the early 1960s it had become clear that Ramsey’s paper is the natural starting point for studying the welfare economics of the long run, not only for pursuing optimum development in centrally planned economies (Chakravarty 1969)[^chakravarty-1969], but also for use in social cost-benefit analysis of public investment in mixed economies (Arrow and Kurz 1970)[^arrow-1970], the choice of technology in labour-surplus economies (Little and Mirrlees 1968, 1974)[^little-1968], and more recently, the welfare economics of climate change (Cline 1992; Nordhaus 1994; Stern 2007)[^cline-1992][^nordhaus-1994]. The number of trails Ramsey laid was remarkable. In academic economics it is one of the dozen or so most influential papers of the 20th century.
    step1: |-
      随着二战后后殖民国家的兴起，长期经济发展在经济研究中变得突出。到 1960 年代初，人们已清楚：拉姆齐的论文是研究长期福利经济学的自然起点，不仅用于中央计划经济中的最优发展（Chakravarty 1969）[^chakravarty-1969]，也用于混合经济中公共投资的社会成本—收益分析（Arrow and Kurz 1970）[^arrow-1970]、劳动剩余经济中的技术选择（Little and Mirrlees 1968, 1974）[^little-1968]，以及更晚近的气候变化福利经济学（Cline 1992; Nordhaus 1994; Stern 2007）[^cline-1992][^nordhaus-1994]。拉姆齐开辟的路径之多令人瞩目。在学院经济学中，它是 20 世纪最有影响的十来篇论文之一。
    step2: |-
      第二次世界大战后后殖民国家纷纷兴起，长期经济发展遂在经济研究中占据显要位置。至 1960 年代初，学界已然明白：研究长期福利经济学，拉姆齐的论文是天然的起点——不仅可用于中央计划经济的最优发展（Chakravarty 1969）[^chakravarty-1969]，亦可用于混合经济中公共投资的社会成本—收益分析（Arrow and Kurz 1970）[^arrow-1970]、劳动剩余经济中的技术选择（Little and Mirrlees 1968, 1974）[^little-1968]，以及更晚近的气候变化福利经济学（Cline 1992; Nordhaus 1994; Stern 2007）[^cline-1992][^nordhaus-1994]。拉姆齐所辟蹊径之多，实堪惊叹；在学院经济学中，此文属 20 世纪最有影响的十来篇论文之列。
  - id: 4
    kind: body
    source: |-
      Classical Utilitarianism takes the good to be the expected value of the sum of utilities over time and across the generations (Sidgwick 1907)[^sidgwick-1907]. Ramsey’s formulation was built on that moral reasoning. He even used the term “enjoyment” to interpret utility. The article embodies the sort of ethical deliberation Sen and Williams (1982) called “Government House Utilitarianism.” But Ramsey’s article thrives today because Government House needs ethical guidance that isn’t a prop for paid Officials to act in nepotistic, never mind predatory ways, but are instead impartial over people’s needs and sensitivities. Although Ramsey used the Utilitarian language, a generous reading of his paper says that much would be gained if, instead of “enjoyment,” we were to work with the broader notion of “well-being.” Such a move allows one to pay greater attention to the factors, be they material or otherwise, that make for flourishing lives.
    step1: |-
      古典功利主义把善理解为效用之和的期望值，此和既跨时间，也跨世代（Sidgwick 1907）[^sidgwick-1907]。拉姆齐的表述即建立在这一道德推理之上。他甚至用“享受”一词来解释效用。这篇文章体现了森与威廉斯（1982）所谓“官邸功利主义”那类伦理慎思。但拉姆齐的文章今日仍兴盛，是因为官邸需要一种伦理指引——它不是让领薪官员以裙带乃至掠夺方式行事的拐杖，而是对人们的需要与感受保持不偏不倚。尽管拉姆齐使用了功利主义的语言，对他的论文作宽厚的解读可以说：若我们以更宽泛的“福祉”概念取代“享受”，将会大有收获。这样的转向使人能更多关注那些使人生蓬勃的因素，无论其为物质的还是别的。
    step2: |-
      古典功利主义以善为效用总和之期望，此总和兼跨时间与世代（Sidgwick 1907）[^sidgwick-1907]。拉姆齐的表述正奠基于这一道德推理；他甚至以“享受”一词训释效用。此文所体现的伦理慎思，即森与威廉斯（1982）所称的“官邸功利主义”。然而拉姆齐此文至今仍有生机，是因为官邸需要一种伦理指引：它不该充当领薪官员行裙带乃至掠夺之事的拄杖，而应对人人的需要与感受一视同仁。拉姆齐虽用功利主义语汇，若对此文作宽厚解读，则可以说：倘若以更宽泛的“福祉”取代“享受”，收获将大得多。如此一转，便可更多留意那些成就蓬勃人生的因素，无论属物质抑或其他。
