      The interesting notion here is that of a “valuable” theory. We may not agree with Campbell that the existence of analogy is “essential” for a novel theory to be “valuable.” But consider the weaker thesis that an acceptable analogy is *sufficient* to establish that a theory is “valuable”, or (to qualify still further) that an acceptable analogy provides defeasible grounds for taking the theory seriously. (Possible defeaters might include internal inconsistency, inconsistency with accepted theory, or the existence of a (clearly superior) rival analogical argument.) The point is that Campbell, following the lead of 19ᵗʰ century philosopher-scientists such as Herschel and Whewell, thinks that analogies can establish this sort of *prima facie* plausibility. Snyder (2006) provides a detailed discussion of the latter two thinkers and their ideas about the role of analogies in science.
    step1: |-
      这里有意思的概念是“有价值的”理论。我们未必同意 Campbell：类比的存在对一个大有价值的新理论来说是“必不可少的”。但考虑一个较弱的论题：一个可接受的类比*足以*确立一个理论是“有价值的”，或者（再退一步）一个可接受的类比为认真对待该理论提供了可挫败的理由。（可能的挫败者包括内部不一致、与被接受的理论不一致，或存在一个（明显更优的）竞争对手类比论证。）要点在于：Campbell 精神上追随赫尔歇（Herschel）与休厄尔（Whewell）等十九世纪哲学家—科学家，认为类比能够确立这种*初步的*可信性。Snyder（2006）详细讨论了后两位思想家及其关于类比在科学中之作用的看法。
