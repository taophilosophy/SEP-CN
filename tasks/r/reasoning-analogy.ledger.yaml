      For those who sympathize with Norton’s skepticism about universal inductive schemes and theories of analogical reasoning, yet recognize that his approach may be too local, an appealing strategy is to move up one level. We can aim for field-specific “working logics” (Toulmin 1958; Wylie and Chapman 2016; Reiss 2015)[^reiss-2015][^toulmin-1958][^wylie-2016]. This approach has been adopted by philosophers of archaeology, evolutionary biology and other historical sciences (Wylie and Chapman 2016; Currie 2013; Currie 2016; Currie 2018)[^currie-2013][^currie-2016][^currie-2018][^wylie-2016]. In place of schemas, we find ‘toolkits’, i.e., lists of criteria for evaluating analogical reasoning.
