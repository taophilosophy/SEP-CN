      More pointedly, increased systematicity is not *necessary* for greater plausibility. Indeed, in causal analogies, it may even weaken the inference. That is because *systematicity* takes no account of the *type* of causal relevance, positive or negative. (McKay 1993)[^mckay-1993] notes that microbes have been found in frozen lakes in Antarctica; by analogy, simple life forms might exist on Mars. Freezing temperatures are *preventive* or counteracting causes; they are *negatively relevant* to the existence of life. The climate of Mars was probably *more favorable* to life 3.5 billion years ago than it is today, because temperatures were warmer. Yet the analogy between Antarctica and present-day Mars is *more systematic* than the analogy between Antarctica and ancient Mars. According to the *Systematicity Principle*, the analogy with Antarctica provides stronger support for life on Mars today than it does for life on ancient Mars.
    step1: |-
      更尖锐地说，系统性的增加对于更大的可信性来说不是*必要的*。的确，在因果类比中，它甚至可能削弱推理。这是因为*系统性*不考虑因果相关的*类型*，即正面的还是负面的。（McKay 1993）[^mckay-1993]注意到，在南极洲冰冻的湖泊中发现了微生物；凭类比，简单的生命形式可能存在于火星上。冰冻的温度是*预防性的*或抵消性的原因；它们对生命的存在是*负相关的*。火星的气候在 35 亿年前很可能比今天*更有利于*生命，因为那时温度更高。然而，南极洲与今天火星之间的类比*比*南极洲与古代火星之间的类比*更系统*。按照*系统性原则*，与南极洲的类比为今天火星上的生命提供的支持，比为古代火星上的生命提供的支持更强。
    step2: |-
      说得更尖锐些：系统性的增加对更大的可信性并非*必要*；在因果类比中，它甚至可能削弱推理——因为*系统性*全然不问因果相关的*类型*：正面还是负面。（McKay 1993）[^mckay-1993] 注意到南极洲冰冻湖泊中发现了微生物，于是凭类比推想火星上或许有简单生命。冰冻温度属于*预防性*或抵消性原因，对生命的存在是*负相关的*。火星 35 亿年前的气候很可能比今天*更有利于*生命——那时更暖。然而，南极洲与今日火星之间的类比，*比*南极洲与远古火星之间的类比*更系统*。按*系统性原则*，与南极洲的类比给“今日火星有生命”的支持，反而强于给“远古火星有生命”的支持。
