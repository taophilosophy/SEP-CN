      There are grave difficulties with Harrod’s and Mill’s analyses. One obvious difficulty is the *counting* *problem*: the ‘population’ of properties is poorly defined. How are we to count similarities and differences? The ratio of shared to total known properties varies dramatically according to how we do this. A second serious difficulty is the *problem of bias*: we cannot justify the assumption that the sample of known features is random. In the case of the urn, the selection process is arranged so that the result of each choice is not influenced by the agent’s intentions or purposes, or by prior choices. By contrast, the presentation of an analogical argument is always partisan. Bias enters into the initial representation of similarities and differences: an advocate of the argument will highlight similarities, while a critic will play up differences. The paradigm of repeated selection from an urn seems totally inappropriate. Additional variations of the sampling approach have been developed (e.g., Russell 1988)[^russell-1988], but ultimately these versions also fail to solve either the counting problem or the problem of bias.
    step1: |-
      哈罗德与穆勒的分析有严重的困难。一个明显的困难是*计数问题*：性质的“总体”界定得很差。我们该如何清点相似与差异？共享性质与已知总数之比，随我们怎么做而剧烈变化。第二个严重的困难是*偏倚问题*：我们无法证成已知特征的样本是随机的这一假定。在瓮的情形中，选取过程经过安排，使得每次选择的结果不受行动者的意图或目的、也不受先前选择的影响。相比之下，类比论证的提出总是带有倾向性的。偏倚进入相似与差异的初始表示之中：论证的辩护者会突出相似，批评者则会放大差异。从瓮中反复选取的范式似乎完全不合适。抽样进路的其他变体也已被发展出来（如 Russell 1988）[^russell-1988]，但这些版本最终也既解决不了计数问题，也解决不了偏倚问题。
    step2: |-
