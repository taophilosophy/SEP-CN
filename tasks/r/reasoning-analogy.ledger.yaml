      Although the concept of analogue confirmation is not entirely new (think of animal testing, as in *Example 8*), the claims of (Dardashti et al. 2017, 2018 [Other Internet Resources])[^dardashti-2017] require evaluation. One immediate difficulty for the black hole example: if we think in terms of ordinary analogical arguments, there is *no positive analogy* because, to put it simply, we have no basis of known similarities between a ‘dumb hole’ and a black hole. As Crowther et al. (2018, Other Internet Resources) argue, “it is not known if the particular modelling framework used in the derivation of Hawking radiation *actually describes black holes in the first place.*” This may not concern Dardashti et al., since they claim that analogue confirmation is distinct from ordinary analogical arguments. It may turn out that analogue confirmation is different for cases such as animal testing, where we have a basis of known similarities, and for cases where our only access to the target domain is via a theoretical model.
