      *Example 8* (Morphine and meperidine). In 1934, the pharmacologist Schaumann was testing synthetic compounds for their anti-spasmodic effect. These drugs had a chemical structure similar to morphine. He observed that one of the compounds—*meperidine*, also known as *Demerol*—had a physical effect on mice that was previously observed only with morphine: it induced an S-shaped tail curvature. By analogy, he conjectured that the drug might also share morphine’s narcotic effects. Testing on rats, rabbits, dogs and eventually humans showed that meperidine, like morphine, was an effective pain-killer (Lembeck 1989: 11; Reynolds and Randall 1975: 273)[^lembeck-1989][^reynolds-1975].
    step1: |-
      *例 8*（吗啡与哌替啶）。1934 年，药理学家 Schaumann 正在测试一些合成化合物的抗痉挛效果。这些药物有与吗啡相似的化学结构。他观察到其中一种化合物——*哌替啶*（meperidine），又名 *Demerol*——对小鼠产生了一种此前只在吗啡那里观察到的生理效应：它诱导 S 形的尾巴弯曲。凭类比，他猜想这种药物可能也具有吗啡的麻醉效果。在大鼠、家兔、狗直至人类身上的试验表明，哌替啶与吗啡一样是有效的止痛药（Lembeck 1989: 11；Reynolds and Randall 1975: 273）[^lembeck-1989][^reynolds-1975]。
    step2: |-
      *例 8*（吗啡与哌替啶）。1934 年，药理学家 Schaumann 筛选一批合成化合物的抗痉挛活性。这些药物的化学结构与吗啡相似。他注意到其中一种——*哌替啶*（meperidine，即 *Demerol*）——在小鼠身上引起一种此前只在吗啡那里见过的生理效应：S 形尾巴弯曲。他凭类比猜想：这种药或许也具有吗啡的麻醉效应。在大鼠、兔、狗乃至人体上的试验最终表明：哌替啶与吗啡一样是有效的镇痛药（Lembeck 1989: 11；Reynolds and Randall 1975: 273）[^lembeck-1989][^reynolds-1975]。
