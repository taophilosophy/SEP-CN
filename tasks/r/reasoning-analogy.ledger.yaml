      *Analogical cognition*, which embraces all cognitive processes involved in discovering, constructing and using analogies, is broader than analogical reasoning (Hofstadter 2001; Hofstadter and Sander 2013)[^hofstadter-2001][^hofstadter-2013]. Understanding these processes is an important objective of current cognitive science research, and an objective that generates many questions. How do humans identify analogies? Do nonhuman animals use analogies in ways similar to humans? How do analogies and metaphors influence concept formation?
    step1: |-
      *类比认知*涵盖发现、构造与使用类比所涉及的一切认知过程，它比类推推理更宽（Hofstadter 2001；Hofstadter and Sander 2013）[^hofstadter-2001][^hofstadter-2013]。理解这些过程是当前认知科学研究的一个重要目标，也是一个产生许多问题的目标。人类如何识别类比？非人类动物是否以类似人类的方式使用类比？类比与隐喻如何影响概念形成？
    step2: |-
      *类比认知*（analogical cognition）涵盖发现、构造与使用类比所涉的一切认知过程，其范围比类推推理更宽（Hofstadter 2001；Hofstadter and Sander 2013）[^hofstadter-2001][^hofstadter-2013]。理解这些过程是当代认知科学的重要目标，也生发出许多问题：人类如何辨识类比？非人类动物是否也像人类那样使用类比？类比与隐喻如何影响概念形成？
