      Some recent analyses follow Aristotle in treating analogical arguments as reliant upon extra (sometimes tacit) premises, typically drawn from background knowledge, that convert the inference into a deductively valid argument––but without making the source domain irrelevant. Davies and Russell introduce a version that relies upon what they call *determination rules* (Russell 1986; Davies and Russell 1987; Davies 1988)[^davies-1988][^davies-1987][^russell-1986]. Suppose that $Q$ and $P_1 , \ldots ,P_m$ are variables, and we have background knowledge that the value of $Q$ is determined by the values of $P_1 , \ldots ,P_m$. In the simplest case, where $m = 1$ and both $P$ and $Q$ are binary Boolean variables, this reduces to

      $$\tag{8} \forall x(P(x) \supset Q(x)) \vee \forall x(P(x) \supset{\sim}Q(x)), $$
