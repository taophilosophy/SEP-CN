      Arguably, the most promising available defense of analogical reasoning may be found in its application to case law (see Precedent and Analogy in Legal Reasoning). Judicial decisions are based on the verdicts and reasoning that have governed relevantly similar cases, according to the doctrine of *stare decisis* (Levi 1949; Llewellyn 1960; Cross and Harris 1991; Sunstein 1993)[^cross-1991][^levi-1949][^llewellyn-1960][^sunstein-1993]. Individual decisions by a court are *binding* on that court and lower courts; judges are obligated to decide future cases ‘in the same way.’ That is, the reasoning applied in an individual decision, referred to as the *ratio decidendi*, must be applied to similar future cases (see *Example 10*). In practice, of course, the situation is extremely complex. No two cases are identical. The *ratio* must be understood in the context of the facts of the original case, and there is considerable room for debate about its generality and its applicability to future cases. If a consensus emerges that a past case was wrongly decided, later judgments will *distinguish* it from new cases, effectively restricting the scope of the *ratio* to the original case.
