      Arguments by analogy are extensively discussed within argumentation theory. There is considerable debate about whether they constitute a species of deductive inference (Govier 1999; Waller 2001; Guarini 2004; Kraus 2015)[^govier-1999][^guarini-2004][^kraus-2015][^waller-2001]. Argumentation theorists also make use of tools such as speech act theory (Bermejo-Luque 2012)[^bermejo-luque-2012], argumentation schemes and dialogue types (Macagno et al. 2017; Walton and Hyra 2018)[^macagno-2017][^walton-2018] to distinguish different types of analogical argument.
    step1: |-
      类比论证在论证理论中得到广泛讨论。关于它们是否构成演绎推理的一个种，存在相当多的争论（Govier 1999; Waller 2001; Guarini 2004; Kraus 2015）[^govier-1999][^guarini-2004][^kraus-2015][^waller-2001]。论证理论家还利用言语行为理论（Bermejo-Luque 2012）[^bermejo-luque-2012]、论证图式与对话类型（Macagno et al. 2017; Walton and Hyra 2018）[^macagno-2017][^walton-2018]等工具来区分不同类型的类比论证。
    step2: |-
      论证理论对类比论证有大量讨论：它们算不算演绎推理的一个种，一直争讼纷纭（Govier 1999; Waller 2001; Guarini 2004; Kraus 2015）[^govier-1999][^guarini-2004][^kraus-2015][^waller-2001]。论证理论家还动用言语行为理论（Bermejo-Luque 2012）[^bermejo-luque-2012]、论证图式与对话类型（Macagno et al. 2017; Walton and Hyra 2018）[^macagno-2017][^walton-2018]等工具，来区分不同类型的类比论证。
