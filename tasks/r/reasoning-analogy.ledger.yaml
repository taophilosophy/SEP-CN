      One predominant objective of this research has been to model the cognitive processes involved in using analogies. Early models tended to be oriented towards “understanding the basic constraints that govern human analogical thinking” (Hummel and Holyoak 1997: 458)[^hummel-1997]. Recent connectionist models have been directed towards uncovering the psychological mechanisms that come into play when we use analogies: *retrieval* of a relevant source domain, *analogical mapping* across domains, and *transfer* of information and *learning* of new categories or schemas.
    step1: |-
      这一研究的一个主要目标是建模使用类比所涉及的认知过程。早期模型倾向于面向“理解支配人类类比思维的基本约束”（Hummel and Holyoak 1997: 458）[^hummel-1997]。晚近的联结主义模型则指向揭示我们使用类比时起作用的心理机制：相关源域的*提取*、跨域的*类比映射*、信息的*迁移*以及新范畴或图式的*学习*。
    step2: |-
      这一研究的一大目标，是为使用类比所涉的认知过程建模。早期模型倾向于“理解支配人类类比思维的基本约束”（Hummel and Holyoak 1997: 458）[^hummel-1997]；晚近的联结主义模型则致力于揭示我们使用类比时入场的心智机制：相关源域的*提取*（retrieval）、跨域的*类比映射*（mapping）、信息的*迁移*（transfer）以及新范畴或图式的*学习*（learning）。
