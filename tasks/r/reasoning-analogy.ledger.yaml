      Dardashti and his co-authors concentrate on a particular example (*Example 17*): ‘dumb holes’ and other analogues to gravitational black holes (Unruh 1981; Unruh 2008)[^unruh-1981][^unruh-2008]. Unlike real black holes, some of these analogues can be (and indeed have been) implemented and studied in the lab. Given the exact formal analogy between our models for these systems and our models of black holes, and certain important additional assumptions, Dardashti et al. make the controversial claim that observations made about the analogues provide evidence about actual black holes. For instance, the observation of phenomena analogous to Hawking radiation in the analogue systems would provide confirmation for the existence of Hawking radiation in black holes. In a second paper (Dardashti et al. 2018, Other Internet Resources), the case for confirmation is developed within a Bayesian framework.
