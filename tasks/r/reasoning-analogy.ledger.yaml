      There appear to be at least three routes to avoiding these difficulties and finding a role for analogical arguments within Bayesian epistemology. First, there is what we might call *minimal Bayesianism*. Within the Bayesian framework, some writers (Jeffreys 1973; Salmon 1967, 1990; Shimony 1970)[^jeffreys-1973][^salmon-1967][^shimony-1970] have argued that a ‘seriously proposed’ hypothesis must have a sufficiently high prior probability to allow it to become preferred as the result of observation. Salmon has suggested that analogical reasoning is one of the most important means of showing that a hypothesis is ‘serious’ in this sense. If analogical reasoning is directed primarily towards *prior* probability assignments, it can provide inductive support while remaining formally distinct from confirmation, avoiding the logical difficulties noted above. This approach is minimally Bayesian because it provides nothing more than an entry point into the Bayesian apparatus, and it only applies to novel hypotheses. An orthodox Bayesian, such as de Finetti (de Finetti and Savage 1972, de Finetti 1974), might have no problem in allowing that analogies play this role.
    step1: |-
      看来至少有三条路线可以避开这些困难，并在贝叶斯知识论中为类比论证找到一个角色。第一是所谓*最小贝叶斯主义*。在贝叶斯框架内，一些作者（Jeffreys 1973; Salmon 1967, 1990; Shimony 1970）[^jeffreys-1973][^salmon-1967][^shimony-1970]论证说，一个“被严肃提出的”假说必须有足够高的先验概率，以便它能因观察而成为受青睐者。Salmon 提出，类推推理是表明一个假说在此意义上“严肃”的最重要的手段之一。如果类推推理主要指向*先验*概率指派，它就能提供归纳支持，同时在形式上保持与确证不同，从而避开上述逻辑困难。这一进路是最小贝叶斯式的，因为它不过提供了进入贝叶斯装置的一个入口，而且只适用于新颖的假说。一个正统的贝叶斯主义者，如 de Finetti（de Finetti and Savage 1972, de Finetti 1974），或许并不介意让类比扮演这个角色。
    step2: |-
