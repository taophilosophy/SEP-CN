      Hesse offers a refinement of Keynes’s strategy, once again along Carnapian lines. In her (1974), she proposes what she calls the *Clustering Postulate*: the assumption that our epistemic probability function has a built-in bias towards generalization. The objections to such postulates of uniformity are well-known (see Salmon 1967)[^salmon-1967], but even if we waive them, her argument fails. The main objection here—which also applies to Keynes—is that a purely syntactic axiom such as the *Clustering Postulate* fails to discriminate between analogical arguments that are good and those that are clearly without value (according to Hesse’s own material criteria, for example).
