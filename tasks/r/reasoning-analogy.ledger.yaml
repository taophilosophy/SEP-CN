      *Example 1*. *Hydrodynamic analogies* exploit mathematical similarities between the equations governing ideal fluid flow and torsional problems. To predict stresses in a planned structure, one can construct a fluid model, i.e., a system of pipes through which water passes (Timoshenko and Goodier 1970)[^timoshenko-1970]. Within the limits of idealization, such analogies allow us to make demonstrative inferences, for example, from a measured quantity in the fluid model to the analogous value in the torsional problem. In practice, there are numerous complications (Sterrett 2006)[^sterrett-2006].
    step1: |-
      *例 1*。*流体力学类比*利用支配理想流体流动的方程与扭转问题之间的数学相似性。为预测一座计划中结构内的应力，人们可以构造一个流体模型，即一套通水的管道系统（Timoshenko and Goodier 1970）[^timoshenko-1970]。在理想化的限度内，这类类比允许我们做证明性推理，例如从流体模型中测得的一个量推到扭转问题中相应的值。实践中有许多复杂情况（Sterrett 2006）[^sterrett-2006]。
    step2: |-
      *例 1*。*流体力学类比*利用理想流体流动方程与扭转问题之间的数学相似性：要预测一座拟建结构中的应力，可以构造一个流体模型——一套让水流通的管道系统（Timoshenko and Goodier 1970）[^timoshenko-1970]。在理想化限度内，这类类比容许证明性推理，例如从流体模型中测得的量推知扭转问题中相应的值。实际操作中有许多复杂因素（Sterrett 2006）[^sterrett-2006]。
