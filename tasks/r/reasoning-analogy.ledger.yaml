      *Example 4*. Shelley (1999, 2003) describes how ethnographic analogy was used to determine the probable significance of odd markings on the necks of Moche clay pots found in the Peruvian Andes. Contemporary potters in Peru use these marks (called *sígnales*) to indicate ownership; the marks enable them to reclaim their work when several potters share a kiln or storage facility. Analogical reasoning may be the only avenue of inference to the past in such cases, though this point is subject to dispute (Gould and Watson 1982; Wylie 1982, 1985)[^gould-1982][^wylie-1982]. Analogical reasoning may have similar significance for cosmological phenomena that are inaccessible due to limits on observation (Dardashti et al. 2017)[^dardashti-2017]. See §5.1 for further discussion.
    step1: |-
      *例 4*。Shelley（1999, 2003）描述了民族志类比如何被用来确定秘鲁安第斯山出土的莫切陶瓶颈部奇异刻痕的可能意义。当代秘鲁陶工用这些标记（称为 *sígnales*）表明所有权；当几个陶工共用一座窑或储藏设施时，这些标记使他们能认领自己的作品。在这类情形中，类推推理也许是通往过去的唯一推理途径，尽管这一点尚有争议（Gould and Watson 1982；Wylie 1982, 1985）[^gould-1982][^wylie-1982]。对于因观测限制而无法接近的宇宙学现象，类推推理可能具有类似的意义（Dardashti et al. 2017）[^dardashti-2017]。进一步讨论见 §5.1。
    step2: |-
      *例 4*。Shelley（1999, 2003）记述了民族志类比的一次运用：确定秘鲁安第斯出土的莫切陶瓶瓶颈上奇异刻痕的可能含义。当代秘鲁陶工用这类标记（所谓 *sígnales*）标示所有权——几名陶工共用一座窑或存放处时，标记让他们得以认领自己的作品。在这类情形里，类推推理或许是通往过去的唯一推理通道——尽管这一点有争议（Gould and Watson 1982；Wylie 1982, 1985）[^gould-1982][^wylie-1982]。对因观测极限而无法企及的宇宙学现象，类推推理或许也有类似意义（Dardashti et al. 2017）[^dardashti-2017]。详见 §5.1。
