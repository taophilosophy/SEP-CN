    source: |-
      *Example 6*. Descartes’s (1637/1954) correlation between geometry and algebra provided methods for systematically handling geometrical problems that had long been recognized as analogous. A very different relationship between analogy and discovery exists when a programmatic analogy breaks down, as was the ultimate fate of the acoustical analogy. That atomic spectra have an entirely different explanation became clear with the advent of quantum theory. In this case, novel discoveries emerged *against* background expectations shaped by the guiding analogy. There is a third possibility: an unproductive or misleading programmatic analogy may simply become entrenched and self-perpetuating as it leads us to “construct… data that conform to it” (Stepan 1996: 133)[^stepan-1996]. Arguably, the danger of this third possibility provides strong motivation for developing a critical account of analogical reasoning and analogical arguments.
    step1: |-
      *例 6*。笛卡尔在几何与代数之间建立的联系（1637/1954），提供了系统地处理几何问题的方法，而这些问题的彼此类似早已被承认。当纲领性类比崩溃时，类比与发现之间存在一种非常不同的关系——声学类比的最终命运即如此。原子光谱有完全不同的解释，这一点随着量子理论的出现而变得清楚。在这个案例中，新的发现是*顶着*由这一指导类比塑造的背景期望而出现的。还有第三种可能：一个不结果实或误导性的纲领性类比可能干脆变得根深蒂固、自我延续，因为它引导我们“构造……符合它的数据”（Stepan 1996: 133）[^stepan-1996]。可以说，这第三种可能的危险，为发展一个关于类推推理与类比论证的批判性理论提供了强烈动机。
    step2: |-
      *例 6*。笛卡尔在几何与代数之间建立对应（1637/1954），为人们系统处理那些早已被承认为彼此类似的几何问题提供了方法。而当一个纲领性类比崩塌时，类比与发现之间会出现大不相同的关系——声学类比的最终结局正是如此：随着量子理论问世，原子光谱有着全然不同的解释这一点变得清楚了。在这个案例中，新的发现是*顶着*指导类比塑造的背景期望出现的。还有第三种可能：一个无结果或误导性的纲领性类比可能干脆盘根错节、自我延续——它诱导我们“构造……符合它的数据”（Stepan 1996: 133）[^stepan-1996]。可以说，正是这第三种可能的危险，有力地推动人们为类推推理与类比论证发展一套批判性理论。
