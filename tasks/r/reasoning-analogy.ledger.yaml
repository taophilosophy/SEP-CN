      *Example 2*. Thomas Reid’s (1785) argument for the existence of life on other planets (Stebbing 1933; Mill 1843/1930; Robinson 1930; Copi 1961)[^copi-1961][^mill-1843][^robinson-1930][^stebbing-1933]. Reid notes a number of similarities between Earth and the other planets in our solar system: all orbit and are illuminated by the sun; several have moons; all revolve on an axis. In consequence, he concludes, it is “not unreasonable to think, that those planets may, like our earth, be the habitation of various orders of living creatures” (1785: 24).
    step1: |-
      *例 2*。托马斯·里德（Thomas Reid）关于其他行星上存在生命的论证（Stebbing 1933；Mill 1843/1930；Robinson 1930；Copi 1961）[^copi-1961][^mill-1843][^robinson-1930][^stebbing-1933]。里德注意到地球与太阳系其他行星之间的许多相似之处：都绕太阳运转并被太阳照亮；好几颗有卫星；都绕轴自转。于是他得出结论说，“认为那些行星可能像我们的地球一样，是各种各样生物的栖居之所，这并非不合理”（1785: 24）。
    step2: |-
      *例 2*。托马斯·里德（Thomas Reid）论证其他行星上存在生命（1785；参见 Stebbing 1933；Mill 1843/1930；Robinson 1930；Copi 1961）[^copi-1961][^mill-1843][^robinson-1930][^stebbing-1933]。里德列举地球与太阳系其他行星的诸多相似：都绕太阳运转、受太阳光照；好几颗有卫星；都绕轴自转。于是他断言：“认为那些行星或许也像我们的地球一样，是形形色色生物的栖居之所，这并非不合理”（1785: 24）。
