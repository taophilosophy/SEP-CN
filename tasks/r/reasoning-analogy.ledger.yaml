      The point of this example is that increased systematicity does not always increase plausibility, and reduced systematicity does not always decrease it (see Lee and Holyoak 2008)[^lee-2008]. The more general point is that systematicity can be misleading, unless we take into account the *nature* of the relationships between various factors and the hypothetical analogy. Systematicity does not magically produce or explain the plausibility of an analogical argument. When we reason by analogy, we must determine which features of both domains are relevant and *how* they relate to the analogical conclusion. There is no short-cut via syntax.
    step1: |-
      这个例子的要点是，系统性的增加并不总是提高可信性，系统性的减少也并不总是降低它（见 Lee and Holyoak 2008）[^lee-2008]。更一般的要点是：系统性可能是误导性的，除非我们把各种因素与假说类比之间关系的*性质*考虑在内。系统性并不能神奇地产生或解释类比论证的可信性。当我们凭类推推理时，我们必须确定两个域中的哪些特征是相关的，以及它们*如何*与类比结论相关联。经由句法没有捷径。
