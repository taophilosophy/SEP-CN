      用 §2.2 引入的术语来说，穆勒的想法是：正类比中的每一个元素都提升结论的概率。当代的“结构映射”理论（§3.4）采用一个受限版本：两个域之间每一个*结构性的*相似都对总体的相似性度量有贡献，从而对类比论证的强度有贡献。
    step2: |-
      用 §2.2 的术语说，穆勒的想法是：正类比中的每个元素都抬升结论的概率。当代“结构映射”理论（§3.4）取其受限版本：两域之间每一个*结构性的*相似都计入总相似性度量，从而计入类比论证的强度。
