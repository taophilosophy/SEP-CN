      So one has to work a little to apply the 1933 definition to model-theoretic languages. There are basically two approaches: (1) Take one structure $A$ at a time, and regard the nonlogical constants as constants, interpreted in $A$. (2) Regard the nonlogical constants as variables, and use the 1933 definition to describe when a sentence is satisfied by an assignment of the ingredients of a structure $A$ to these variables. There are problems with both these approaches, as Tarski himself describes in several places. The chief problem with (1) is that in model theory we very frequently want to use the same language in connection with two or more different structures – for example when we are defining elementary embeddings between structures (see the entry on first-order model theory). The problem with (2) is more abstract: it is disruptive and bad practice to talk of formulas with free variables being ‘true’. (We saw in Section 2.2 how Tarski avoided talking about truth in connection with sentences that have varying interpretations.) What Tarski did in practice, from the appearance of his textbook in 1936 to the late 1940s, was to use a version of (2) and simply avoid talking about model-theoretic sentences being true in structures; instead he gave an indirect definition of what it is for a structure to be a ‘model of’ a sentence, and apologised that strictly this was an abuse of language. (Chapter VI of Tarski 1994 still contains relics of this old approach.)[^tarski-1994]
    step1: |-
      因此，要把 1933 年定义应用于模型论语言，须稍费周章。基本有两条进路：（1）每次取一个结构 $A$，把非逻辑常项当作在 $A$ 中得到解释的常项。（2）把非逻辑常项当作变元，并用 1933 年定义描述一个句子何时被“把结构 $A$ 的诸要素指派给这些变元”的指派所满足。两条进路各有问题，塔尔斯基自己在多处描述过。进路（1）的主要问题在于：在模型论中我们常常要用同一语言联系两个或多个不同结构——例如定义结构之间的初等嵌入时（见“一阶模型论”词条）。进路（2）的问题更抽象：谈论带自由变元的公式“为真”，既有破坏性又属不良做法。（我们在 2.2 节已看到，塔尔斯基如何避免在有不同解释的句子语境中谈真理。）塔尔斯基从 1936 年教科书问世到 40 年代末的实际做法，是采用（2）的一个版本，并干脆避免谈论模型论句子在结构中为真；他改为间接定义何谓一个结构是某句子的“模型”，并致歉说严格说来这是语言的滥用。（塔尔斯基 1994 年著作第六章仍留有这一旧进路的遗迹。）[^tarski-1994]
    step2: |-
      因此，将 1933 年定义施用于模型论语言，尚需稍作迁就。基本有两条进路：（1）每次只取一个结构 $A$，把非逻辑常项视为在 $A$ 中获释的常项；（2）把非逻辑常项视为变元，并运用 1933 年定义，描述一个句子在何时被“将结构 $A$ 的诸要素指派给这些变元”的指派所满足。两条进路各自都有麻烦，塔尔斯基曾在数处予以说明。进路（1）的要害在于：模型论中我们屡屡希望以同一语言关联两个或更多不同结构——例如在定义结构间的初等嵌入之时（参见“一阶模型论”词条）。进路（2）的困难则更为抽象：谈论带自由变元的公式“为真”，既扰乱秩序又不合规范。（我们在 2.2 节已看到，塔尔斯基如何避免在解释可变的情形下谈论句子的真。）塔尔斯基自 1936 年教科书问世直至 40 年代末的实际做法，是采用（2）的一个变体，同时索性不谈模型论句子在结构中为真；他转而间接地定义何谓一个结构是某句子的“模型”，并致歉说严格讲这属于语言滥用。（塔尔斯基 1994 年著作第六章仍留有这一旧进路的残迹。）[^tarski-1994]
  - id: 56
    kind: body
    source: |-
      By the late 1940s it had become clear that a direct model-theoretic truth definition was needed. Tarski and colleagues experimented with several ways of casting it. The version we use today is based on that published by Tarski and Robert Vaught in 1956. See the entry on classical logic for an exposition.
    step1: |-
      到 40 年代末，人们已经清楚需要一种直接的模型论真理定义。塔尔斯基及其同事试验过若干表述方式。今天所用的版本基于塔尔斯基与 Robert Vaught 1956 年发表的版本。阐述见“经典逻辑”词条。
    step2: |-
      至 40 年代末，需要一种直接的模型论真理定义已成共识。塔尔斯基与同事尝试过多种表述方式。今日通行的版本，以塔尔斯基与沃特（Robert Vaught）于 1956 年刊布者为底本；其阐述见“经典逻辑”词条。
  - id: 57
    kind: body
    source: |-
      The right way to think of the model-theoretic definition is that we have sentences whose truth value varies according to the situation where they are used. So the nonlogical constants are not variables; they are definite descriptions whose reference depends on the context. Likewise the quantifiers have this indexical feature, that the domain over which they range depends on the context of use. In this spirit one can add other kinds of indexing. For example a Kripke structure is an indexed family of structures, with a relation on the index set; these structures and their close relatives are fundamental for the semantics of modal, temporal and intuitionist logic.
    step1: |-
      理解模型论定义的正确方式是：我们有一些句子，其真值随使用情境而变化。因此非逻辑常项不是变元；它们是所指依赖语境的限定摹状词。同样，量词也具有这种索引性特征：其取值域依赖于语境。循此精神还可以添加其他种类的索引。例如克里普克结构是以索引集为下标的诸结构的族，并在索引集上带一个关系；这些结构及其近亲是模态逻辑、时态逻辑与直觉主义逻辑语义学的基础。
    step2: |-
      理解模型论定义的要诀在于：我们所处理的是这样一些句子，其真值随使用情境而变。因此，非逻辑常项并非变元，而是指称依赖于语境的限定摹状词。量词同样带有这种索引性特征——其取值域取决于使用语境。顺着这一思路，还可引入其他类型的索引。例如，克里普克结构（Kripke structure）是以索引集为下标的诸结构所成之族，并在索引集上配有一个关系；这类结构及其近亲，是模态逻辑、时间逻辑与直觉主义逻辑语义学的基石。
