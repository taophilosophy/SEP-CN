      The suggestion that coherentism is the correct theory of truth for moral statements has received a little more attention. Quine suggested that a correspondence theory gives the correct account of scientific propositions but not moral propositions. Quine reaches this conclusion, not on the ground that objective truth conditions correspond to scientific propositions but not moral propositions, but on the related ground that scientific propositions, but not moral propositions, can be tested “against the independent course of observable nature.” The only basis for holding to be true a proposition about moral actions is “our moral standards themselves.” Quine concludes that “a coherence theory is evidently the lot of ethics” (1981, 63). Dorsey (2006) picks up on Quine’s suggestion and argues that a coherentist account of the truth of moral propositions is viable. The concept of wide reflective equilibrium, introduced into the philosophical literature by Rawls (1971) suggests that, moral propositions are justified when they fit with a system of moral beliefs. Rawls’ proposal has been widely interpreted as a version of a coherence theory (Knight 2025). Rawls speaks of the justification of moral judgements and not of their truth, but if the only basis for the warranted assertion of moral judgements is coherence with a system of moral beliefs, a coherentist account of the truth of moral judgements is plausibly said to be indicated.
    step1: |-
      融贯论是道德陈述之正确真理理论这一提法，受到稍多一些关注。蒯因提示，符合论对科学命题给出正确说明，对道德命题则不然。蒯因得出这一结论，其依据不是客观真值条件与科学命题相应而与道德命题不相应，而是与此相关的另一依据：科学命题可以“对照可观察自然的独立进程”加以检验，道德命题则不能。认为一个关于道德行为的命题为真的唯一依据，是“我们自己的道德标准”。蒯因得出结论：“融贯论显然是伦理学的命运”（1981, 63）。Dorsey（2006）接续蒯因的提示，论证对道德命题之真的融贯论说明是可行的。罗尔斯（1971）引入哲学文献的广义反思平衡概念提示：道德命题在与一个道德信念系统相合时得到证成。罗尔斯的提议被广泛解释为融贯论的一个版本（Knight 2025）。罗尔斯谈的是道德判断的证成而非其真，但如果道德判断之得到有理由的断言，其唯一依据就是与一个道德信念系统的融贯，那么合理地可以说，这暗示了一种关于道德判断之真的融贯论说明。
    step2: |-
      相对而言，“融贯论适用于道德陈述”这一提法引起的注意稍多。蒯因曾提示：符合论对科学命题说得对，对道德命题则不然。他的理由不在“客观真值条件只配科学命题、不配道德命题”，而在一个相关的理由：科学命题可以“对照可观察自然的独立进程”受检验，道德命题不能。认定一个道德行为命题为真的唯一依据，是“我们自己的道德标准”。因此蒯因断言：“融贯论显然是伦理学的命数”（1981, 63）。Dorsey（2006）接过这条线索，论证对道德命题之真作融贯论说明是可行的。罗尔斯（1971）提出的广义反思平衡概念提示：道德命题在同道德信念系统相合时获得证成。这一提议被普遍解读为融贯论的一个版本（Knight 2025）。罗尔斯说的是道德判断的证成，不是其真；但假如道德判断之有理由的断言，唯一依据就是同道德信念系统的融贯，那么说这暗示了一种关于道德判断之真的融贯论，是说得通的。
