    source: |-
      A coherence theory of truth states that any proposition is true if and only if it coheres with some specified set of propositions. The coherence theory differs from its principal competitor, the correspondence theory of truth, in two essential respects. The competing theories give conflicting accounts of the relation that propositions bear to their truth conditions. (In this article, ‘proposition’ is not used in any technical sense. It simply refers to the bearers of truth values, whatever they may be.) According to one, the relation is coherence, according to the other, it is correspondence. The two theories also give conflicting accounts of truth conditions. According to the coherence theory, the truth conditions of propositions consist in other propositions. The correspondence theory, in contrast, states that the truth conditions of propositions are not (in general) propositions, but rather objective features of the world. (Even the correspondence theorist holds that propositions about propositions have propositions as their truth conditions.) Although the coherence and correspondence theories are fundamentally opposed in this way, they both present (in contrast to deflationary theories of truth) a substantive conception of truth. That is, unlike deflationary theories, the coherence and correspondence theories both hold that truth is a property of propositions that can be analysed in terms of the sorts of truth-conditions propositions have, and the relations propositions stand in to these conditions.
    step1: |-
      一种真理融贯论主张：任何命题为真，当且仅当它与某个被指定的命题集相融贯。融贯论与它的主要竞争者真理符合论在两个根本方面不同。两种竞争理论对命题与其真值条件之间所持关系的说明互相冲突。（本文中“命题”不作任何技术性使用，仅指真值承担者，无论它们是什么。）按其中一种说法，这一关系是融贯；按另一种说法，它是符合。两种理论对真值条件也给出互相冲突的说明。按融贯论，命题的真值条件在于其他命题。符合论则相反，主张命题的真值条件（一般而言）不是命题，而是世界的客观特征。（即便符合论者也认为，关于命题的命题以命题为其真值条件。）尽管融贯论与符合论在这一方面根本对立，二者（与真理紧缩论相反）都提出了一种实质性的真理观。也就是说，与紧缩论不同，融贯论与符合论都认为真是命题的一种属性，可以依据命题所具有的真值条件种类、以及命题与这些条件所处的关系来加以分析。
    step2: |-
      真理融贯论的主张是：一个命题为真，当且仅当它与某一被指定的命题集相融贯。它与主要对手真理符合论在两处根本不同。其一，关于命题同其真值条件之间是何种关系，两说各执一词。（本文中“命题”不作任何技术性用法，只指真值承担者，不论那是什么。）一说这关系是融贯，一说这关系是符合。其二，两说对真值条件本身也各有说法。融贯论认为，命题的真值条件就在于其他命题；符合论则相反，认为真值条件一般不是命题，而是世界的客观特征。（符合论者也承认，关于命题的命题，其真值条件仍是命题。）两说虽如此针锋相对，却都与真理紧缩论不同，都提出了某种实质性的真理观。这就是说，二者都认为真是命题的一项属性，可按命题具有哪类真值条件、又与这些条件处于何种关系来加以分析；紧缩论则不然。
  - id: 2
    kind: body
    source: |-
      ## 1. Versions of the Coherence Theory of Truth
    step1: |-
      ## 1 真理融贯论的各种版本
    step2: |-
      ## 1 真理融贯论的各版本
  - id: 3
    kind: body
    source: |-
      The coherence theory of truth has several versions. These versions differ on two major issues. Different versions of the theory give different accounts of the coherence relation. Different varieties of the theory also give various accounts of the set (or sets) of propositions with which true propositions cohere. (Such a set will be called a *specified set*.)
    step1: |-
      真理融贯论有若干版本。这些版本在两个主要问题上不同。不同版本对融贯关系给出不同说明。不同种类理论对真命题与之相融贯的那个（或那些）命题集也给出不同说明。（这样的集合将被称为*指定集*。）
    step2: |-
      真理融贯论不止一个版本，其分歧集中在两个大问题上：一是如何说明融贯关系，二是真命题所融贯的那个（或那些）命题集是什么。（下文称此集为*指定集*。）
  - id: 4
    kind: body
    source: |-
      According to some early versions of the coherence theory, the coherence relation is simply consistency. On this view, to say that a proposition coheres with a specified set of propositions is to say that the proposition is consistent with the set. This account of coherence is unsatisfactory for the following reason. Consider two propositions which do not belong to a specified set. These propositions could both be consistent with a specified set and yet be inconsistent with each other. If coherence is consistency, the coherence theorist would have to claim that both propositions are true, but this is impossible.
    step1: |-
      按照融贯论的某些早期版本，融贯关系就是一致性。按这种看法，说一个命题与一个指定集相融贯，就是说该命题与该集合一致。这种对融贯的说明不能令人满意，理由如下。设想两个不属于某个指定集的命题。这两个命题可以都与该指定集一致，却彼此不一致。如果融贯就是一致，融贯论者就不得不主张两个命题都为真，而这是不可能的。
    step2: |-
      有些早期版本把融贯关系径直等同于一致性：说一个命题与某指定集相融贯，就是说它同该集合一致。这种说明站不住脚，理由如下。设想两个都不属于某指定集的命题。二者可以各自与该集合一致，彼此却不一致。若融贯即一致，融贯论者便只好说这两个命题都真——而这是不可能的。
  - id: 5
    kind: body
    source: |-
      A more plausible version of the coherence theory states that the coherence relation is some form of entailment. Entailment can be understood here as strict logical entailment, or entailment in some looser sense. According to this version, a proposition coheres with a set of propositions if and only if it is entailed by members of the set. Another more plausible version of the theory, held for example in Bradley (1914), is that coherence is mutual explanatory support between propositions.
    step1: |-
      一个更可信的融贯论版本主张，融贯关系是某种形式的蕴涵。蕴涵在此可以理解为严格的逻辑蕴涵，也可以理解为某种较宽松意义上的蕴涵。按这一版本，一个命题与一个命题集相融贯，当且仅当它被该集合的成员所蕴涵。另一个更可信的版本——例如布拉德利（1914）所持的版本——主张，融贯是命题之间的相互解释性支持。
    step2: |-
      较可信的一种版本认为，融贯关系是某种蕴涵——或取严格的逻辑蕴涵，或取较宽的蕴涵义。照此说，一个命题与一个命题集相融贯，当且仅当它为该集合的成员所蕴涵。另有一种较可信的版本（例如布拉德利 1914 年所持），把融贯理解为命题之间的相互解释性支持。
  - id: 6
    kind: body
    source: |-
      The second point on which coherence theorists (coherentists, for short) differ is the constitution of the specified set of propositions. Coherentists generally agree that the specified set consists of propositions believed or held to be true. They differ on the questions of who believes the propositions and when. At one extreme, coherence theorists can hold that the specified set of propositions is the largest consistent set of propositions currently believed by actual people. For such a version of the theory, see Young (1995). According to a moderate position, the specified set consists of those propositions which will be believed when people like us (with finite cognitive capacities) have reached some limit of inquiry. For such a coherence theory, see Putnam (1981). At the other extreme, coherence theorists can maintain that the specified set contains the propositions which would be believed by an omniscient being. Some idealists seem to accept this account of the specified set.
    step1: |-
      融贯论者（简称融贯论者）分歧的第二点，是指定集的构成。融贯论者一般同意，指定集由被相信或被认为真的命题组成。他们在谁相信这些命题、何时相信的问题上不同。在一个极端上，融贯论者可以主张，指定集是现实的人当前所相信的最大的相容命题集。关于这样一种版本，参见 Young（1995）。按照一种温和立场，指定集由这样一些命题组成：当我们这样的人（具有有限认知能力）达到某种探究极限时将会相信它们。关于这样一种融贯论，参见 Putnam（1981）。在另一个极端上，融贯论者可以主张，指定集包含一位全知存在着将会相信的命题。一些唯心论者似乎接受这种关于指定集的说明。
    step2: |-
      第二处分歧在于指定集由什么构成。融贯论者大体上都同意：指定集由被相信或被认为真的命题构成；分歧在于信者是谁、何时相信。一种极端主张是：指定集即现实的人当下所相信的最大相容命题集，此说见 Young（1995）。温和一点的立场则说：指定集由我们这类认知能力有限的生灵在探究达到某种极限时将会相信的命题构成，此说见 Putnam（1981）。另一种极端则主张：指定集包含一位全知存在着将会相信的命题；某些唯心论者似持此说。
  - id: 7
    kind: body
    source: |-
      If the specified set is a set actually believed, or even a set which would be believed by people like us at some limit of inquiry, coherentism involves the rejection of realism about truth. Realism about truth involves acceptance of the principle of bivalence (according to which every proposition is either true or false) and the principle of transcendence (which says that a proposition may be true even though it cannot be known to be true). Coherentists who do not believe that the specified set is the set of propositions believed by an omniscient being are committed to rejection of the principle of bivalence since it is not the case that for every proposition either it or a contrary proposition coheres with the specified set. They reject the principle of transcendence since, if a proposition coheres with a set of beliefs, it can be known to cohere with the set.
    step1: |-
      如果指定集是一个实际被相信的集合，甚至是我们在某种探究极限上将会相信的集合，那么融贯论就包含对关于真理的实在论的拒斥。关于真理的实在论包含接受二值原则（据此每一命题非真即假）与超越原则（据此一个命题即便不能被知道为真，也可能为真）。那些不认为指定集是全知存在着所相信的命题集的融贯论者，必然拒斥二值原则，因为并非对每一命题而言，要么它、要么一个相反命题与指定集相融贯。他们也拒斥超越原则，因为如果一个命题与一个信念集相融贯，它就可以被知道与该集合相融贯。
    step2: |-
      只要指定集是实际被相信的集合，或者哪怕是我们在探究极限上将会相信的集合，融贯论便含有拒斥真理实在论的意味。真理实在论接受两项原则：二值原则（每一命题非真即假）与超越原则（一个命题即便无法被知道为真，也可能为真）。凡不认为指定集即全知存在着所信命题集的融贯论者，都得拒斥二值原则：并非每个命题都能做到要么它本身、要么其反命题与指定集相融贯。他们同样要拒斥超越原则：命题若与一个信念集相融贯，这融贯本身是可以被知道的。
