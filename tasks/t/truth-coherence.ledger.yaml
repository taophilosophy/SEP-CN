      Colin McGinn has proposed the other new objection to coherentism. He argues (McGinn 2002: 195)[^mcginn-2002] that coherence theorists are committed to idealism. Like Thagard, he takes idealism to be obviously false, so the argument is a reductio. McGinn’s argument runs as follows. Coherentists are committed to the view that, for example, ‘Snow falls from the sky’ is true iff the belief that snow falls from the sky coheres with other beliefs. Now it follows from this and the redundancy biconditional (*p* is true iff *p*) that snow falls from the sky iff the belief that snow falls from the sky coheres with other beliefs. It appears then that the coherence theorist is committed to the view that snow could not fall from the sky unless the belief that snow falls from the sky coheres with other beliefs. From this it follows that how things are depends on what is believed about them. This seems strange to McGinn since he thinks, reasonably, that snow could fall from the sky even if there were no beliefs about snow, or anything else. The linking of how things are and how they are believed to be leads McGinn to say that coherentists are committed to idealism, this being the view that how things are is mind-dependent.
    step1: |-
      科林·麦金提出了另一个反对融贯论的新反驳。他论证（McGinn 2002: 195）[^mcginn-2002]说，融贯论者承诺了唯心论。像萨加德一样，他认定唯心论显然为假，所以这是一个归谬论证。麦金的论证如下。融贯论者承诺这样的看法：例如，“雪从天降”为真，当且仅当雪从天降这一信念与其他信念相融贯。现在，由此以及冗余双条件句（*p* 为真当且仅当 *p*），可以推出：雪从天降，当且仅当雪从天降这一信念与其他信念相融贯。于是看来，融贯论者承诺了这样的看法：除非雪从天降这一信念与其他信念相融贯，雪就不可能从天而降。由此推出，事物如何取决于人们对它们的信念如何。这在麦金看来似乎很奇怪，因为他合理地认为，即便没有任何关于雪或其他事物的信念，雪也可能从天而降。把事物如何与事物被相信如何连接起来，使麦金断言融贯论者承诺了唯心论，而唯心论就是主张事物如何依赖于心灵。
    step2: |-
      科林·麦金提出另一项新反驳（McGinn 2002: 195）[^mcginn-2002]：融贯论者其实承诺了唯心论。同萨加德一样，他认定唯心论显然为假，故以归谬出之。其论证如下。融贯论者主张：“雪从天降”为真，当且仅当“雪从天降”这一信念与其他信念相融贯。再配上冗余双条件句（*p* 为真当且仅当 *p*），便得：雪从天降，当且仅当“雪从天降”这一信念与其他信念相融贯。照此看来，融贯论者就得承认：除非那个信念与其他信念相融贯，雪便不会从天而降。由此还可推出：事情怎样，取决于人们怎样相信它们。麦金觉得这很荒唐，而且不无道理：即便没有任何关于雪或别的事物的信念，雪照样可以从天而降。把“事情怎样”与“人们相信它们怎样”拴在一起，使麦金断定融贯论者承诺了唯心论——即认为事情怎样依赖于心灵。
