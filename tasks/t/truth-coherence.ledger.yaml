      > 如果像历史证据所提示的那样，存在一个独立于关于它的表象的世界，那么表象的目标就应当是描述这个世界，而不只是与其他表象发生关系。我的论证并不驳倒融贯论，但它表明：融贯论让心灵在构成真理方面占据过大的位置，因而不合情理。（Thagard 2007: 29–30）[^thagard-2007]
