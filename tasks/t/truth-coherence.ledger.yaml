      Most defenders of coherentism have adopted global coherentism. Global coherentism states that all propositions are true if and only if they cohere with a specified system of beliefs. Some writers have, however, suggested that coherentism could give the correct account of what it is for propositions of certain sorts to be true while failing to give the correct account of what it is for propositions of other sorts to be true. Partial coherentism is the view that coherentism is the correct theory of truth for only certain classes of propositions. Wright (2021, 144) suggests that coherentism is attractive in the cases of counterfactual conditionals, mathematical propositions, and moral propositions. Mathematical, moral and counterfactual propositions have something in common. One can plausibly hold no objective truth conditions exist for propositions of these sorts. For example, one could hold that ‘If the Epstein files had been released in 2016, Trump would never have been president’ is true, but no objective fact corresponds to this proposition since the files were not released in 2016. The absence of an objective truthmaker for this proposition, and the belief that the proposition has the truth value true (rather than indeterminate) could be taken to suggest that it is true because it coheres with a system of beliefs.
    step1: |-
      融贯论的大多数辩护者采纳全局融贯论。全局融贯论主张，一切命题为真，当且仅当它们与一个指定信念系统相融贯。然而，有些论者提出，融贯论可以对某几类命题之真给出正确说明，而对其他类命题之真则不能。局部融贯论是这样一种看法：融贯论只是对某些类命题而言正确的真理理论。Wright（2021, 144）提示，融贯论在反事实条件句、数学命题和道德命题的场合颇具吸引力。数学命题、道德命题与反事实命题有某种共同之处。人们可以合情合理地认为，这几类命题不存在客观真值条件。例如，人们可以认为“如果爱泼斯坦文件在 2016 年公布，特朗普就绝不会当上总统”为真，但由于文件并未在 2016 年公布，没有任何客观事实与该命题相符。该命题缺乏客观真值制造者，而人们又相信它具有真这一真值（而非不确定），这可以被用来说明：它为真，是因为它与一个信念系统相融贯。
    step2: |-
      融贯论的辩护者大多取全局融贯论：一切命题为真，当且仅当它们同某一指定信念系统相融贯。也有人提出，融贯论也许对某几类命题之真说得对，对别类则不然——这就是局部融贯论：融贯论只对特定类别的命题才是正确的真理理论。Wright（2021, 144）认为，融贯论在反事实条件句、数学命题与道德命题上颇有吸引力。这三类命题有个共同点：人们有理由认为，它们不存在客观真值条件。比如，人们可以说“如果爱泼斯坦文件在 2016 年公布，特朗普就绝不会当上总统”为真；可文件并未在 2016 年公布，没有任何客观事实与之相符。该命题既无客观真值制造者，人们又相信它为真（而不是不确定），这似乎提示：它为真，是因为它同某一信念系统相融贯。
