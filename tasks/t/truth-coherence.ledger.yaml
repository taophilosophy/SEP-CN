      Few efforts have been made to defend a coherentist account of either mathematical or counterfactual conditional propositions. This is, perhaps, a little surprising since an intuitionist approach to mathematics appears to have a good deal in common with coherentism. Intuitionism has been described as the view that the “truth of a mathematical statement can only be conceived via a mental construction that proves it to be true, and the communication between mathematicians only serves as a means to create the same mental process in different minds” (Iemhoff 2019)[^iemhoff-2019]. This statement of intuition could be interpreted as saying that a mathematical proposition is true if and only if it coheres with mathematical mental processes or beliefs.
    step1: |-
      为数学命题或反事实条件命题的融贯论说明作辩护的努力很少。这或许有点令人意外，因为数学中的直觉主义进路似乎与融贯论有许多共同之处。直觉主义曾被这样描述：数学陈述的“真只能经由证明其为真的心智构造来设想，而数学家之间的交流只充当在不同心灵中造成同一心智过程的手段”（Iemhoff 2019）[^iemhoff-2019]。这一对直觉主义的陈述可以解释为：一个数学命题为真，当且仅当它与数学的心智过程或信念相融贯。
    step2: |-
      很少有人尝试为数学命题或反事实条件命题提供融贯论说明，这或许有点奇怪——直觉主义的数学进路同融贯论看来颇为投契。有人这样描述直觉主义：数学陈述的“真，只能借助证明它为真的心智构造来设想；数学家之间的交流，不过是于不同心灵中再造同一心智过程的手段”（Iemhoff 2019）[^iemhoff-2019]。照这一表述，不妨说一个数学命题为真，当且仅当它同数学的心智过程或信念相融贯。
