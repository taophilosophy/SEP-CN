      如前所述，《影像》的存世残篇中有一行，可以合理地认为它指向显现对皮浪派者的重要性：以事物的显现作为决定与行动的依据。无论《影像》这个标题本身是否暗示这一主题（见上文第二节“著作”），看起来这都是第蒙在好几部作品中反复回到的题目。对第蒙《论感觉》的唯一提及是一句引文：“蜜是甜的，我不立此说；但它显得如此，我同意”（第欧根尼·拉尔修 9.105）。第欧根尼那里的上下文，以及这句话本身明显的含义，都表明第蒙在这里也提出同一点：就实践目的而言，皮浪派者让自己受事物显现的引导，既可能也正当，尽管他们严格避免给那些事物在其真实本性上派定确定特征。在这一点上，第蒙对皮浪派传统的影响似乎至为深远；同一观点与同一例子（甚至“同意”事物显得如何这一观念，尽管希腊文措辞并不完全相同）都重新出现在塞克斯都·恩披里柯《皮浪学说纲要》的开篇几页（1.20）。
