      归在第蒙名下的其余著作是散文作品。其中最重要的是《皮同》（*Pytho*）。据说（优西比乌所存阿里斯托克勒的说法，《福音准备》14.18.14）这部作品描写了第蒙与皮浪的一次会面和一场对话；第蒙把自己写成在前往皮同（包括德尔菲在内的地区）途中，在一座神庙旁遇到皮浪。作品本身是否采用对话体，还是只是以第三人称复述一场对话，并不清楚。但这场对话似乎是对皮浪的态度与风度的完整呈现；第欧根尼·拉尔修在一处看来是指同一作品的文字（9.67）中说，第蒙在他“加以阐述”（*diexeisin*，此词常用于详尽的解说）的记述中“澄清了”（*diasaphei*）皮浪的“心境”（*diathesin*）。这段阐述想必是托在皮浪口中所说，而第蒙自己被写成一个恳切的弟子。（这一母题在第蒙的著作中似乎反复出现；《讽刺诗》与《影像》的残篇中都有向皮浪发问的内容——发问者很可能就是作为说话人的第蒙本人——问的是他如何能保持自己的宁静。）关于《皮同》，只有一段引文和一则关于其中某项论断的报道；两者都有一定的哲学意义，下文将要涉及，但都没有提供关于《皮同》总体性格的任何进一步线索。人们通常认为这部对话的场景设定具有象征意义（德尔菲是重要的阿波罗神谕所在），但各家对此的解释颇为分歧。阿里斯托克勒给出了一份摘要，内容是第蒙对通常被视为皮浪哲学核心要点的阐述。人们常以为这份阐述出自《皮同》，但这不过是近于合理的猜测。而且，尽管这段文字无疑涉及皮浪说过的某事，其中究竟多少真正复述皮浪的思想、多少是第蒙对这些思想的自我发展，也绝难看清；关于这一点可参见皮浪词条。
