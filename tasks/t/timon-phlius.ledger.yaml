      In another fragment Xenophanes is represented as regretting his failure to ‘look both ways’ (to be *amphoterobleptos*), and so embracing an ill-considered monism. (This interpretation of Xenophanes, which assimilates him to the Eleatics, is highly disputable given the surviving fragments, but was common in the ancient world.) The ability to ‘look both ways’ is therefore presented as a positive characteristic, and this is echoed in two other fragments. Zeno of Elea is described as ‘double-tongued’ (*amphoteroglôssos*)—presumably on the basis of his paradoxes arguing for two opposite conclusions—and Democritus is described as ‘two-minded’ (*amphinoon*); the contexts make clear that these, too, are intended as positive appellations. Timon is eager, then, to reject any fixed or one-sided view of reality. Again, the precise interpretation of this attitude will depend in part on one’s conception of Pyrrho’s philosophy, as Timon saw it; but the link with a Pyrrhonist outlook is, at a general level, not hard to see. In the same fragment Xenophanes is also pictured as regretting his failure to engage in *skeptosunê.* It is tempting to read this as an early occurrence of the notion of skepticism familiar to us from the later Pyrrhonist (or Neo-Pyrrhonist) Sextus Empiricus. But there is no clear reason for doing so; the term may just mean ‘inquiry’ in the usual sense, and Xenophanes may simply be bemoaning his inadequate investigation of things.
