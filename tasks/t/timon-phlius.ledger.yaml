      Timon is indebted for his style and tone in the *Silloi* to a tradition of moralizing diatribe prevalent among the Cynics. The word *tuphos*, ‘vanity,’ was a favorite Cynic term of invective, and it occurs in several fragments from the *Silloi*, as do a number of related terms. The Cynic Crates also wrote satirical verses; one of the few surviving fragments of Crates begins “And I saw Stilpo enduring severe pains in Megara,” which is a parody of a line from *Odyssey* XI and again seems to assimilate a philosophical encounter to Odysseus’ underworld encounters. Crates’ writings may well, then, have been an important influence on the *Silloi* (on this see Long 1978)[^long-1978]. A more distant inspiration was Xenophanes, who can plausibly be seen as the originator of the genre of philosophical satire in which Timon was writing. (Later sources even give *Silloi* as the title of a poem by Xenophanes; but it is not clear whether this title was attached to the poem before or only after Timon’s day.) This is surely part of the reason for Timon’s choice of Xenophanes as the main character in the second and third books.
    step1: |-
      第蒙在《讽刺诗》中的风格与语调，得自犬儒派中流行的一种道德说教式抨击传统。*tuphos*（“虚妄”）一词是犬儒派爱用的骂人话，它在《讽刺诗》的若干残篇中出现，一些相关的词也一样。犬儒派克拉特斯也写过讽刺诗；克拉特斯存世少数残篇之一开头是“而我在麦加拉看见斯提尔波忍受剧痛”，这是对《奥德赛》第十一卷一句的戏仿，同样似乎把一场哲学上的相遇比作奥德修斯在冥府的遭遇。因此，克拉特斯的作品很可能对《讽刺诗》有重要影响（论此见 Long 1978）[^long-1978]。更远的启发来自色诺芬尼，可以合情合理地把他看作第蒙所写这种哲学讽刺诗体的开创者。（后来的材料甚至把《讽刺诗》当作色诺芬尼一首诗的标题；但这一标题是在第蒙之前还是之后才加在那首诗上的，并不清楚。）这无疑是第蒙选择色诺芬尼作为第二、三卷主角的部分原因。
    step2: |-
      第蒙写《讽刺诗》，风格与语调都承自犬儒派盛行的一种道德抨击文传统。*tuphos*（“虚妄”）是犬儒派最爱用的骂词，《讽刺诗》数则残篇都见这个词，连带的同族词也有。犬儒派克拉特斯同样作过讽刺诗；他存世寥寥几则残篇中有一则开头便说“我又见斯提尔波在麦加拉苦捱剧痛”，分明是戏仿《奥德赛》第十一卷的诗行，也再次把一场哲学上的相逢写成奥德修斯式的冥府游历。如此说来，克拉特斯的作品很可能对《讽刺诗》颇有影响（参 Long 1978）[^long-1978]。更远的源头是色诺芬尼：把他看作第蒙所操这种哲学讽刺诗体的开山者，是说得通的。（后世材料甚至径把《讽刺诗》题为色诺芬尼一首诗的名字；不过这题目是加在第蒙之前还是之后，已不可考。）第蒙挑色诺芬尼做第二、三卷的主角，这想必是原因之一。
