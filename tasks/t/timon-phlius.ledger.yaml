      Literary devices appear to have been extensively employed in the *Silloi*. Diogenes Laertius tells us (9.111) that the *Silloi* was divided into three books. In the first book Timon spoke solely in the first person, whereas the second and third took the form of dialogues between Timon himself and the early (late 6th c. BCE) philosopher Xenophanes. Timon is said to have questioned Xenophanes about every philosopher—the older ones in the second book and the more recent in the third book—and Xenophanes answered him. The work as a whole, however, was devoted to abuse and ridicule of non-Pyrrhonist philosophers. It looks as if part of the work was modeled after the famous scene in *Odyssey* Book XI where Odysseus visits the underworld; several fragments include the words ‘I saw’ or ‘I recognized’ (where the person seen or recognized is a dead philosopher), and this formula is highly reminiscent of Odysseus’ language in describing his encounters with his dead comrades. There are other echoes of Homer as well, most notably from the early books of the *Iliad*, the effect being to represent philosophical disputants as literal combatants. Clayman (2009), chapter 3 identifies two other likely scenes: “Marketplace of Ideas” in which philosophers are shown selling their ideas, and “Hyde Park Corner”, in which philosophers address crowds. Clayman, however, convincingly argues against the hypothesis of a fishing scene, accepted by several earlier scholars; the fragments that have been taken to depict philosophers as fishers or as fish frequently do not need to be, or even lend themselves especially to being, interpreted in this way.
    step1: |-
      《讽刺诗》似乎大量使用了文学手法。第欧根尼·拉尔修告诉我们（9.111），《讽刺诗》分为三卷。第一卷中第蒙完全用第一人称说话，第二卷和第三卷则采取第蒙本人与早期（公元前六世纪末）哲学家色诺芬尼之间的对话形式。据说第蒙向色诺芬尼询问每一位哲学家——第二卷问较年长者，第三卷问较晚近者——由色诺芬尼作答。不过，整部作品致力于辱骂和嘲弄非皮浪派哲学家。看起来作品的一部分是仿照《奥德赛》第十一卷中奥德修斯访问冥府那著名场景写的；若干残篇含有“我看见”或“我认出”的字样（所见或所认出的是一位已死的哲学家），这一套语极像奥德修斯描述他与死去的同伴相遇时的用语。此外还有对荷马的其他呼应，最显著的是出自《伊利亚特》前几卷，其效果是把哲学争论者写成真正的战士。克莱曼（2009）第三章又辨认出两个可能的场景：“观念市场”，哲学家在其中叫卖自己的观念；“海德公园一角”，哲学家在其中向人群演说。不过，克莱曼令人信服地反驳了若干较早学者接受的钓鱼场景假说；那些被认为描绘哲学家为渔夫或鱼的残篇，往往不必、甚至并不特别适合作这种解释。
    step2: |-
      《讽刺诗》似乎通篇施展文学手腕。第欧根尼·拉尔修说（9.111），全书分为三卷。第一卷里第蒙纯用第一人称；第二、三卷则改成第蒙与早期（公元前六世纪末）哲学家色诺芬尼的对话。据说第蒙挨个问色诺芬尼：第二卷问年长一辈，第三卷问晚近一辈，由色诺芬尼一一作答。全书的主旨，却是辱骂与嘲弄一切非皮浪派的哲学家。书中有部分内容像是在仿《奥德赛》第十一卷奥德修斯游冥府的名场面：好几则残篇带着“我看见”或“我认出”的套语，所看见、所认出的是一位死去的哲学家，这口吻活脱是奥德修斯讲他与亡故同伴相遇时的腔调。荷马的回声还不止此，最显眼的是《伊利亚特》前几卷；效果是把哲学争辩者写成了字面意义上的战士。克莱曼（2009）第三章又指认出两个可能的场景：一是“观念市场”，哲学家在那里兜售自己的观念；二是“海德公园一角”，哲学家在那里对人群演讲。不过克莱曼有力地驳掉了先前几位学者认可的钓鱼场景说：那些被当作把哲学家画成渔夫或鱼的残篇，往往不必如此解，甚至并不特别宜于如此解。
