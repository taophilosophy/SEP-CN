      The remaining works attributed to Timon are prose works. Of these the most important is the *Pytho.* We are told (by Aristocles in Eusebius, *Praeparatio evangelica* 14.18.14) that this described a meeting and a dialogue between Timon and Pyrrho; Timon portrayed himself as encountering Pyrrho by a temple, as he was walking towards Pytho (the region that included Delphi). Whether the work itself was in dialogue form, or merely recounted a dialogue in the third person, is not clear. But it appears that this dialogue consisted of a thorough presentation of Pyrrho’s outlook and demeanor; Diogenes Laertius, in what seems to be a reference to the same work (9.67), says that Timon ‘clarifies’ (*diasaphei*) Pyrrho’s disposition (*diathesin*) in the account that he ‘goes through’ (*diexeisin*, a word often used of detailed exposition). This account will presumably have been placed in Pyrrho’s mouth, with Timon himself depicted as an eager pupil. (This motif seems to have been a recurring one in Timon’s writings; fragments from both the *Silloi* and the *Indalmoi* consist of questions put to Pyrrho—most probably by Timon himself as speaker—about how he manages to sustain his tranquility.) There is one quotation from the *Pytho* and one further report about a statement that it included; both are of some philosophical significance, and will be touched on below, but neither furnishes any additional clues concerning the general character of the *Pytho* itself. It has usually been thought that the setting of the dialogue has symbolic significance (Delphi being the seat of the important oracle of Apollo), but the interpretations that have been offered of this are various. Aristocles offers a summary of an exposition by Timon of what have generally been regarded as the central points of Pyrrho’s philosophy. This is often thought to have occurred in the *Pytho,* but this is no more than plausible speculation. Moreover, though this passage certainly alludes to something that Pyrrho said, it is by no means obvious how much of it actually reproduces Pyrrho’s ideas and how much is Timon’s own development of these ideas; for discussion of this see the entry on Pyrrho.
