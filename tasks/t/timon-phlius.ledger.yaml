    source: |-
      The *Silloi*, in hexameter verse, has already been mentioned. The other poem from which a few fragments survive was called *Indalmoi* (*Images* or *Appearances*), which was in elegiac couplets (alternating hexameters and pentameters). The significance of this title is by no means clear. It might refer to the “appearances” on the basis of which Pyrrhonists are compelled to make their decisions; one of the surviving lines from the poem reads “But the appearance [*to phainomenon*] is powerful everywhere, wherever it comes” (quoted in Diogenes Laertius 9.105), and most scholars have taken this to point to the importance of appearances in shaping our actions. Another possibility is that the ‘images’ referred to in the title are images of Pyrrho himself, and that the poem was a depiction of Pyrrho and his blissful tranquility; the longest surviving fragment from the poem—a sequence of seven lines pieced together from three passages in Diogenes Laertius and Sextus Empiricus—certainly fits this description. A third suggestion is that ‘images’ or ‘appearances’ is to be taken in a negative sense, referring to the fictions or illusions by which naive non-Pyrrhonists are taken in. Possible support for this comes from a single pentameter line, which is regularly assigned to the *Indalmoi* because of the meter. This reads “but these things are judged by mind [or: by convention] on the part of humans” (Sextus Empiricus *M* 11.140); the context suggests that the ‘things’ in question are things (wrongly) taken to be by nature good or bad. None of these proposals as to the character of the work can be ruled out, but none can be regarded as more than conjecture. With the exception of a four-line fragment about “the nature of the divine and the good”, which is probably the most contentious of all the fragments of Timon, no other lines survive beyond the three passages just referred to. (See the discussion of “The Nature of the Divine and the Good” in Section 6 of the entry on Pyrrho, for a brief account of the difficulties surrounding this fragment.) Nor do we have any general description of the work (unlike in the case of the *Silloi*—see the next section); Diogenes Laertius does not even include it in his list of Timon’s works, although he does elsewhere cite it. Thus despite the importance of the few surviving pieces of the *Indalmoi*, the poem as a whole is almost entirely opaque to us.
    step1: |-
      上面已经提到用六音步诗体写成的《讽刺诗》。另有少量残篇存世的另一首诗题为《影像》（*Indalmoi*，可译作“影像”或“显现”），用挽歌对句写成（六音步与五音步交替）。这个标题的意义远不清楚。它可能指皮浪派者被迫据以作出决定的那些“显现”；该诗留存的一句写道：“而显现 [*to phainomenon*] 处处有力，无论它出现在何处”（见第欧根尼·拉尔修 9.105），多数学者据此认为这指向显现对于我们行动所起的塑造作用。另一种可能是，标题所说的“影像”是指皮浪本人的影像，而该诗是对皮浪及其幸福宁静的描绘；该诗最长的存世残篇——从第欧根尼·拉尔修和塞克斯都·恩披里柯的三处引文拼合起来的七行——确实符合这一描述。第三种设想是，“影像”或“显现”应取贬义，指天真的非皮浪派者所受骗的那些虚构或幻象。可能支持这一点的是单独一行五音步，因诗律关系通常被归给《影像》。该行写道：“但这些东西由心灵 [或：由习俗] 为人所判定”（塞克斯都·恩披里柯 *M* 11.140）；上下文表明，所言之“东西”是被（错误地）认为本性为善或为恶者。关于这部作品性质的这几种设想都不能排除，但也都只能是推测。除了一首四行的残篇讲“神性与善者的本性”，这可能是第蒙全部残篇中最有争议的一个，此外再没有诗句存世，超出上文提到的三段之外。也没有任何关于这部作品的总体描述（不像《讽刺诗》——见下一节）；第欧根尼·拉尔修甚至没有把它列入第蒙著作目录，尽管他别处引用过它。因此，尽管《影像》的几处存世残篇很重要，这部诗作为整体对我们几乎全然晦暗不明。
    step2: |-
      前文已提到六音步诗体的《讽刺诗》。另一首诗也存下寥寥残篇，题为《影像》（*Indalmoi*，可译“影像”，亦可译“显现”），用挽歌对体写成，即六音步与五音步交替。这标题到底何指，极不明白。一说它指皮浪派者不得不据以决断的那些“显现”：该诗存世有一行写道“然而显现 [*to phainomenon*] 无处不强，无论它来到何处”（第欧根尼·拉尔修 9.105 所引），多数学者据此认为它点明显现对塑造我们行动的重要性。另一说以为标题中的“影像”是皮浪本人的影像，全诗描绘皮浪与其福乐的宁静；该诗最长的残篇——由第欧根尼·拉尔修与塞克斯都·恩披里柯三处引文拼成的七行——恰与此说相合。还有第三说，主张“影像”或“显现”当取贬义，指天真而未入皮浪派者所受蒙蔽的那些虚构与幻象。能给它一点支持的是孤零零的一行五音步，凭诗律判定它属于《影像》。该行写道：“但这些东西，是人由心灵 [或：由习俗] 加以判定的”（塞克斯都 *M* 11.140）；从上下文看，所指乃是那些被（误）认为本性善或本性恶的东西。这几种关于该诗性质的设想，一种也排除不掉，一种也超出猜想之外。除了一则四行残篇论及“神性与至善的本性”——它恐怕是第蒙全部残篇中最惹争议的一则——上文三处之外再无诗句传世。该诗也没有任何总体描述留下（《讽刺诗》则不然，见下一节）；第欧根尼·拉尔修甚至不曾把它编入第蒙著录，虽然他别处引用过它。所以说，《影像》的几处残篇固然要紧，全诗的样貌对我们却近乎一片漆黑。
