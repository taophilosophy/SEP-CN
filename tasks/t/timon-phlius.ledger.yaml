      Diogenes (9.105) mentions a work called *On the Senses* and Sextus (*M* 3.2) mentions a work called *Against the Physicists.* Again, the specific words or ideas that are attributed to Timon in these contexts deserve some discussion, but they tell us little or nothing about the works themselves, beyond what the titles would anyway suggest. It is worth noting, however, that there is no indication that these works consisted of or included exposition of Pyrrho’s philosophy. Finally, Diogenes tells us (9.115) that Timon praised Arcesilaus (who, during Timon’s lifetime, took the Academy in a skeptical direction) in a work called *Arcesilaus’ Funeral Banquet*—this by contrast with his attacks on him in the *Silloi*, as Diogenes mentions and as we can confirm from the surviving fragments. This work is generally taken as evidence that Timon outlived Arcesilaus. But given Timon’s penchant for elaborate narrative conceits, the inference is hazardous. As Clayman (2009), 13–15 has made clear, the funeral banquet was a recognized parodic verse form dating back to before Timon’s day, and by no means requires that its subjects be actually deceased; the genre also gives us grounds for wondering whether the praise of Arcesilaus was partly or even wholly mock-praise.
