    source: |-
      On the basis of a number of slender indications, Timon’s date of birth is generally set at around 325–320 BCE and his date of death at around 235–230 BCE. For the details of his life we are wholly dependent on the brief account in Diogenes Laertius (9.109–115) (see the entry on doxography of ancient philosophy); Diogenes wrote perhaps in the early to mid-third century CE, but his account claims to be drawn from several earlier sources. According to Diogenes, Timon initially studied (after an early career as a dancer in his home town of Phlius, an inland city of the Peloponnese not far from the gulf of Corinth) with Stilpo of Megara. After an interval in which he returned home and married, he then went to Elis, in the northwest corner of the Peloponnese, to study with Pyrrho. Diogenes makes it sound as if his stay at Elis was relatively brief; he says that it lasted until Timon had children (9.109), and that at that point he was compelled to go elsewhere to make money as a sophist, or paid teacher of philosophical and other theory to late adolescent young men. But whatever the length of his association with Pyrrho, Timon became an adherent of Pyrrho’s philosophy from then on. His activities as a sophist (whatever exactly these involved) appear to have left him financially secure; we are told that he then went to Athens and lived there (except for a short stay at Thebes) until his death. Diogenes names two kings with whom he was acquainted, and several poets with whom he collaborated; it is difficult to know what to make of this information, although the work of Clayman (2009) has shown, by means of detailed parallels with contemporary poetry, that he was deeply immersed in the poetic world of his time. During his time at Athens—probably several decades—he is likely also to have made the acquaintance of the leading philosophers of the time; Diogenes includes anecdotes featuring him making fun of Arcesilaus, who was head of the Academy during most or all of this time, but he no doubt encountered Stoics and Epicureans as well. That no representatives of any of these schools refer to him in any surviving records is perhaps not surprising, given the scathing critiques that are implicit in his portraits of them in the *Silloi*.
    step1: |-
      根据若干薄弱的线索，第蒙的出生年份一般定在约公元前 325—前 320 年，卒年定在约公元前 235—前 230 年。关于他生平的细节，我们完全依赖第欧根尼·拉尔修（9.109—115）的简短记述（参见古代哲学学说史词条）；第欧根尼也许写于公元三世纪早期到中叶之间，但他的记述自称取材于若干更早的材料。据第欧根尼说，第蒙起初师从麦加拉的斯提尔波（在此之前，他在家乡斐利亚——伯罗奔尼撒内陆一座距科林斯湾不远的城市——早年曾以舞蹈演员为业）。中间有一段时间他回家并结了婚，随后前往伯罗奔尼撒西北角的伊利斯，师从皮浪。第欧根尼的说法让人以为他在伊利斯逗留时间相对短暂；他说这段时期延续到第蒙有了孩子（9.109），到那时他不得不去往别处，以智者身份赚钱——所谓智者，就是向年近成年的青年收费教授哲学及其他学说的人。但无论他与皮浪交往多久，第蒙从此成为皮浪哲学的信奉者。他作为智者的活动（具体内容如何不得而知）似乎让他经济宽裕；据说他随后去了雅典并一直住在那里（除了短暂停留底比斯），直到去世。第欧根尼提到与他相识的两位国王，以及与他合作过的几位诗人；这些材料很难说该怎么看待，尽管克莱曼（2009）通过与当时诗歌的详细比对表明，他深深沉浸于那个时代的诗坛。他在雅典的时期——大概有好几十年——很可能也结识了当时最重要的几位哲学家；第欧根尼收录了若干轶事，讲到他曾取笑阿尔凯西劳，而此人在这一时期的大部分或全部时间都是学园的领袖，但他无疑也接触过斯多亚派和伊壁鸠鲁派。这些学派的代表人物在一切传世文献中都不曾提及他，考虑到《讽刺诗》中他为这些学派画像时所包含的尖刻批评，这一点或许并不奇怪。
    step2: |-
      凭着几条颇显单薄的线索，第蒙的生年一般定在约公元前 325—前 320 年，卒年定在约公元前 235—前 230 年。生平细节，我们全赖第欧根尼·拉尔修那段简短记述（9.109—115；参见古代哲学学说史词条）。第欧根尼的成书可能在公元三世纪上半叶，而他自己声称这段记载取自若干更早的材料。据他说，第蒙先师从麦加拉的斯提尔波——此前他在家乡斐利亚干过一阵舞蹈演员；斐利亚是伯罗奔尼撒的内陆城市，离科林斯湾不远。中间他回乡成亲，隔了一段时间，便到伯罗奔尼撒西北角的伊利斯去从皮浪求学。第欧根尼的口气像是在伊利斯逗留不久：他说这段求学生涯延续到第蒙生儿育女之时（9.109），此后他不得不到别处谋生，做了一名智者，也就是向将近成年的青年收费讲授哲学等学说的人。不过交往长短且不论，第蒙自此一直信奉皮浪的哲学。做智者这桩营生（究竟包含些什么难以确知）似乎让他家给人足；据说他随后移居雅典，除短暂客居底比斯外一直住到去世。第欧根尼点出两位与他相识的国王、几位与他唱和的诗人。这类材料不好断定位数，好在克莱曼（2009）逐条比对当时诗作，证明他深潜于那个时代的诗歌世界。居雅典期间——大约长达数十年——他多半也结识了当世最重要的哲学家；第欧根尼收录的轶事里就有他讥嘲阿尔凯西劳的段子，而此人在这一时期的全部或大部分时间执掌学园，至于斯多亚派与伊壁鸠鲁派，他想必也有来往。有意思的是，这些学派的传人见于传世文献者都不曾提到他。不过在《讽刺诗》里，第蒙给各家画的像暗含何等刻薄的抨击，由此看来，他们的沉默大概并不奇怪。
