      There are other instances where it is not clear whether Timon is simply reproducing Pyrrho’s outlook or adding creatively to it. For example, Diogenes reports that in the *Pytho* Timon offered a gloss on the phrase ‘no more’ (*ouden mallon*), namely, ‘determining nothing and withholding assent’ (9.76). The phrase *ouden mallon* became a stock Pyrrhonist expression, and occurs several times in connection with Pyrrho’s own views. But is Timon here giving his own distinctive explanation of the significance of this phrase? Given the meager evidence available, we cannot hope to settle the matter. As noted earlier, the passage of Aristocles that expounds the early Pyrrhonist position is also controversial in this respect. While the passage as a whole has generally been taken to be giving us the philosophy of Pyrrho (via the medium of a summary by Timon), it has also been suggested that large parts of the position outlined here are in fact additions by Timon to a core idea of Pyrrho’s (see the entry on Pyrrho for details, also Brunschwig (1994), Marchard (2018)). Since so much of what we know about Pyrrho comes through Timon, the line between these two possibilities is often very difficult to draw.
    step1: |-
      还有一些情形，不清楚第蒙是在单纯复述皮浪的见解，还是在创造性地加以增补。例如，第欧根尼报道说，第蒙在《皮同》中对“并不更”（*ouden mallon*）一语作了注解，即“不作任何决定，悬置判断”（9.76）。*ouden mallon* 一语后来成为皮浪派的标准表达，并几次出现在与皮浪本人观点相关的地方。但第蒙在此是否对该语的意义给出了他自己独特的解释？鉴于可用证据稀少，我们无法指望解决这个问题。如前所述，阿里斯托克勒那段阐述早期皮浪派立场的文字在这方面同样有争议。虽然这段文字作为一个整体通常被认为是在给我们皮浪的哲学（借助第蒙的摘要这一中介），也有人提出，此处概述的立场有很大部分其实是第蒙对皮浪某个核心观念的增补（详见皮浪词条，另见 Brunschwig 1994、Marchand 2018）。既然我们关于皮浪所知有这么多是经第蒙而来的，这两种可能之间的界线往往极难划清。
    step2: |-
      还有些地方，说不清第蒙是在照搬皮浪的见解，还是自有新意。比如第欧根尼说，第蒙在《皮同》里替“并不更”（*ouden mallon*）一语作注，解作“什么都不定，悬置同意”（9.76）。*ouden mallon* 后来成了皮浪派的套语，也数次出现于记述皮浪本人观点之处。那么，第蒙此处是否在给这一短语的意义提供他自己独到的解释？材料太薄，此事恐怕无从定谳。前面说过，阿里斯托克勒那段阐述早期皮浪派立场的文字，在这点上同样聚讼。那段文字整体上历来被当作皮浪的哲学（经第蒙摘要的中介）来读；但也有人主张，其中所述立场的大半，其实是第蒙对皮浪某个核心观念的增补（详见皮浪词条，另参 Brunschwig 1994、Marchand 2018）。我们关于皮浪的知识，大半假道第蒙，这两种可能之间的界线遂往往极难划定。
