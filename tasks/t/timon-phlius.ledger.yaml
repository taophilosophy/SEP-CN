      归于第蒙名下的其余著作都是散文。最重要的当推《皮同》（*Pytho*）。据优西比乌《福音准备》14.18.14 所存阿里斯托克勒的说法，这部作品写了一次会面、一场对话：第蒙自述在前往皮同（德尔菲即在其境内）的路上，于一座神庙旁遇见皮浪。全篇是否用对话体，还是只以第三人称复述一场对话，无从断定。可以确定的是，这场对话似乎在通盘呈现皮浪的见解与气象。第欧根尼有一处文字看来正指此书（9.67），说第蒙在他“逐一讲来”（*diexeisin*，此语惯用于详尽的解说）的记述中“澄清了”（*diasaphei*）皮浪的“心境”（*diathesin*）。这番讲论想必托在皮浪自己口中，而第蒙则扮作一个虚心热切的门生。这一母题在他笔下似乎一再出现：《讽刺诗》与《影像》的残篇里都有向皮浪提问的段落，提问者多半就是登场说话的第蒙本人，问的是他凭何以自守其宁静。《皮同》只留下一段引文，另有一则转述说及书中的一句论断；两处都有几分哲学意味，下文会谈到，但都不足以让我们多认识此书的全貌。学界通常以为，对话的场景设定含有象征意味——德尔菲乃阿波罗大神谕所在——不过各家解释纷歧。阿里斯托克勒所存的一段摘要，讲的是第蒙对皮浪哲学核心要点的阐述；人们常猜它出自《皮同》，然而至多算是近情理的揣想。何况这段文字确曾说到皮浪的某项主张，而其中多少是复述皮浪、多少是第蒙自己的发挥，全然难辨——论此参皮浪词条。
