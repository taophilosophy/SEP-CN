      第欧根尼（9.105）提到一部题为《论感觉》的作品，塞克斯都（*M* 3.2）提到一部题为《驳自然哲学家》的作品。同样，这两处归给第蒙的具体说法或观念值得一些讨论，但除标题本身已经提示的之外，它们关于作品本身几乎什么也没有告诉我们。不过值得注意的是，没有任何迹象表明这些作品是对皮浪哲学的阐述或包含这样的阐述。最后，第欧根尼告诉我们（9.115），第蒙曾在一部题为《阿尔凯西劳的丧宴》的作品中称赞阿尔凯西劳（此人在第蒙生前就把学园带向了怀疑论的方向）——这与他在《讽刺诗》中对他的攻击形成对照，第欧根尼提到了这一点，我们也能从存世残篇加以证实。这部作品通常被当作证据，说明第蒙比阿尔凯西劳活得长。但考虑到第蒙偏爱精心设计的叙事巧思，这一推论并不稳妥。克莱曼（2009，第 13—15 页）已经讲清，丧宴是一种公认的滑稽诗体，早在第蒙之前就已存在，其对象未必真已去世；这一体裁也让我们有理由怀疑，对阿尔凯西劳的称赞是否部分是、甚至全部是假意颂扬。
