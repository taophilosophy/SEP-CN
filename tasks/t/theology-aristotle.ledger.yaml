      最后，最著名的一点，是序言声称眼前这部著作是“亚里士多德之书”。虽然有时有人提出，这一误托是有意的——为作品赢得更广大的读者，或以虚假的名义赋予它权威——但 Zimmermann 推测，它只是一位后来者在不了解情况下所作的增补，出于对序言其余部分的误解。序言在提供上述信息之后，接着提示可以如何把《神学》整合进亚里士多德哲学。实质上，序言让我们理解为：《神学》关于上帝及其与世界的关系、关于非物质的灵魂，将说出比亚里士多德本人所透露的更多的东西。按这一可信的解释，肯迪圈子认为普罗提诺的思想与亚里士多德的思想相容、甚至补足后者；但他们实际上并不认为它出自亚里士多德之手。
