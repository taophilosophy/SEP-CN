      Perhaps during this same period or somewhat later, a text was written which re-worked the Theology much in the way that the Theology re-worked Plotinus. This is the so-called ‘Longer Version’ of the Theology with fourteen chapters rather than ten. It introduces yet further philosophical ideas to the text, postulating for instance a *logos* or ‘word’ (*kalima*) that mediates between God and the first intellect. The intellect is united to this ‘word’ without any intermediary, and since the ‘word’ is beyond the intelligible realm of being, it is said to be ‘non-being’ (*al-lays*). A series of studies on this version by Alexander Treiger (2021, 2022, 2024a and 2024b) has built on previous research (Stern 1983, Fenton 1986 and Zimmermann 1986)[^fenton-1986][^zimmerman-1986] to establish that the Longer Version draws on an earlier Platonist text, one also independently used by the Ismāʿīlī author al-Sijistānī. Most likely the Longer Version was produced in Fāṭimid Egypt, which would explain al-Sijistānī’s access to it and also its availability to the Andalusian scholar Lisān al-Dīn Ibn al Khaṭīb (d.776/1374), who quotes from it in his own works. Though much of the manuscript evidence is in Judeo-Arabic, the text also circulated in Arabic script in the medieval period. This casts doubt on the previous scholarly assumption that the Longer Version was a product of Jewish intellectual culture. The Longer Version was, finally, the basis for the Latin translation of the Theology, which was produced in 1519 by Pier Nicola Castellani and revised in 1572 by Jacques Charpentier.
