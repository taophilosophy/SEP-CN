      或许在同一时期或稍晚，有人写了一部文本，以《神学》改写普罗提诺的同样方式改写了《神学》。这就是所谓《神学长版本》（Longer Version），有十四章而非十章。它把更多哲学观念引入文本，例如设定一个逻各斯或“词”（*kalima*），在神与第一理智之间起中介作用。理智无须任何中介便与这个“词”结合；由于“词”超出存在的可理知领域，它被说成是“非存在”（*al-lays*）。Alexander Treiger 就这一版本所作的一系列研究（2021、2022、2024a 与 2024b），在前人研究（Stern 1983、Fenton 1986 与 Zimmermann 1986）[^fenton-1986][^zimmerman-1986]的基础上确立：长版本取材于一部更早的柏拉图主义文本，而伊斯玛仪派作者西吉斯塔尼也独立使用过该文本。长版本最可能产生于法蒂玛王朝治下的埃及，这既可以解释西吉斯塔尼何以能接触它，也可以解释它何以能被安达卢西亚学者利桑·丁·伊本·哈提卜（Lisān al-Dīn Ibn al-Khaṭīb，卒于 776/1374 年）所得——后者在自己的著作中引用了它。尽管大量抄本证据是犹太-阿拉伯语，该文本在中世纪也以阿拉伯字母流传。这使此前的一个学术假设——认为长版本是犹太智识文化的产物——受到质疑。最后，长版本是《神学》拉丁文译本的底本；该译本 1519 年由 Pier Nicola Castellani 制作，1572 年由 Jacques Charpentier 修订。
