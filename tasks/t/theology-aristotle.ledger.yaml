      The Arabic Plotinus and Proclus not only have a similar textual history, but also overlap to a surprising degree philosophically. It has been persuasively argued (see especially the pieces collected in D’Ancona 1995; for the context of the Arabic Proclus in the Kindī circle see Taylor 2021)[^d’ancona-1995][^taylor-2021] that this is no accident: the Arabic Plotinus exerted a direct influence on the Arabic Proclus. To give one obvious example, the more baroque system set forth in Proclus’ *Elements* is simplified in the *Book of the Pure Good* to yield a hierarchy identical to that of the Arabic Plotinus (God, Intellect, Soul, material world). On the other hand it has been suggested (D’Ancona 2011a)[^d’ancona-2011a] that the *Elements* helped to inspire the program of study outlined in the preface to the *Theology*.
