      如刚才的例子所示，阿拉伯文普罗提诺的独特之处，往往与太一或第一本原有关。在阿拉伯文中，太一非常清楚地被设想为创造之神，常被赋予“创始者”（originator）、“创造者”（creator）之类的称号。另一方面，阿拉伯文普罗提诺并不认为这种作为创造者的神观念与普罗提诺的“流溢”隐喻之间有何张力（阿拉伯文中意为“流溢”“流出”的词，如 *fayd*，在文本中随处可见）。总体上说，阿拉伯文普罗提诺同意普罗提诺本人：神直接创造（制作）理智，然后“通过理智的中介”创造其余一切（见 D'Ancona 1992, Adamson 2002, 137–42）[^adamson-2002][^d’ancona-1992]。另一方面，人们已注意到，阿拉伯文版本常常把普罗提诺的理智（*nous*）同化于太一。阿拉伯文版本接受“第一因在思维”或“第一因是理智”的观念——这一观念在普罗提诺那里或遭拒斥，或只以极度审慎的方式提及（见 D'Ancona 1997）[^d’ancona-1997]。在此我们看到，阿拉伯文版本在一定程度上取消了普罗提诺对亚里士多德那位自我思维的理智神与真正第一的至高本原所作的区分。这也影响了“回归太一”被设想的方式：阿拉伯文普罗提诺倾向于把它与“回归理智”的观念混同起来（Somma 2021, 87）[^somma-2021]。
