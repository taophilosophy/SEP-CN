      Because of all these differences between Plotinus and the Arabic Plotinus—and only a few of the most important have been mentioned here—it is worth bearing in mind that it was this reworked version used by later authors in the Arabic tradition. In light of the Aristotelianizing tendencies of the Arabic version, it is appropriate that the *Theology* is cited in the *Harmony of the Two Sages, Plato and Aristotle*, a work ascribed to al-Farabi. The *Harmony* cites the *Theology* in support of the compatibility of Platonic and Aristotelian metaphysics, on the issues of the a-temporal creation of the universe and the existence of Platonic Forms (Adamson 2021)[^adamson-2021]. When al-Farabi refers here to the *Theology*, he evidently has in mind a more capacious work than our *Theology of Aristotle*, because he includes propositions from the Arabic Proclus under this title.
