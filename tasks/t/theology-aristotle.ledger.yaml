      A more obvious sort of change comes in the form of interpolated excurses that have no direct basis in the Greek. A good example is found at the conclusion of the first *mimar* of the *Theology* (Badawi 1955, 27–8)[^badawi-1955]. This interpolation defends a ‘non-literal’ understanding of Plato’s account of the creation of the physical universe. We are told that, although Plato speaks as if the world came into being with a first moment of time, actually this is misleading. He speaks in this fashion only because of the difficulty of expressing causal priority without expressions that imply temporal priority. The passage would seem to relate to ancient Platonist treatments of the *Timaeus*, though that text is not mentioned explicitly here (for the Arabic Plotinus and *Timaeus* see D’Ancona 2003)[^d’ancona-2003][^d’ancona-2003-2].
