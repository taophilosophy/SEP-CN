      由于普罗提诺与阿拉伯文普罗提诺之间的所有这些差异（此处只提及最重要的少数几处），应当记住：后来阿拉伯传统中的作者所使用的，正是这一改写过的版本。鉴于阿拉伯文版本的亚里士多德化倾向，《神学》被援引于一部归于法拉比名下的著作《两圣（柏拉图与亚里士多德）之和合》（*Harmony of the Two Sages, Plato and Aristotle*）之中，便是顺理成章的事。《和合》援引《神学》，以支持柏拉图主义与亚里士多德主义形而上学在宇宙的非时间性创生与柏拉图型相存在这两个问题上的相容性（Adamson 2021）[^adamson-2021]。法拉比在此谈到《神学》时，心里显然是一部比我们的《亚里士多德的神学》更宏富的著作，因为他把阿拉伯文普罗克洛斯的命题也纳入了这一题名之下。
