      Finally, we can mention the influence of the *Theology* in the Safavid period. Many of our manuscripts of the work were produced in Iran under the Safavids and Qajars. It seems to have been read eagerly from early in the Safavid age, as we can tell from a preface added to the text by the important early sixteenth-century philosopher Ghiyat-al-Din Dashtaki, who may also have written a commentary to the text (Di Branco 2014)[^di-2014]. It was also used by al-Nayrizi, a student of Dashtaki (on him see Pourjavady 2011)[^pourjavady-2011]. Commentaries to the text were written by later Safavid thinkers: the famous Mulla Sadra (for a work drawing on the Arabic Plotinus see Nasr 2014)[^nasr-2014], and the seventeenth century by Sa‘id al-Qummi (for the latter see Rizvi 2007)[^rizvi-2007].
