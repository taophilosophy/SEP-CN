      那么，假定阿拉伯文普罗提诺直接以《九章集》的希腊文为底本，而不是叙利亚文版本或波菲利（或任何别人）的希腊文释义。这样一来，我们便剩下一个更简单的假设：是肯迪圈子本身对《九章集》作了改写。但即便在此，仍可提出一个问题：应把这种对普罗提诺思想的改造归功于肯迪圈子中的哪一位成员？人们还可以进一步追问：《神学》与《论神圣科学书简》中各段落那种颇为混乱的次序，究竟只是文本灾难的结果（松散的部分被缝合起来，组成《神学》的各章），还是也保存了某种有意的重新编排？这两个问题都仍有争议。Zimmermann 1986 与 Adamson 2002 认为，首要责任在希姆西，肯迪贡献相对较小；D'Ancona 1995、2001 则提出肯迪可能发挥了更大的作用。不过，Adamson 与 D'Ancona（而非 Zimmermann）认为，在早期阶段可能有过有意的选材与重新编排。怀疑这一点的理由之一是：各章确实似乎具有内在的主题统一性，尽管各章的次序与序言所列的主题次序并不相符（D'Ancona 2011a）[^d’ancona-2011a]。
