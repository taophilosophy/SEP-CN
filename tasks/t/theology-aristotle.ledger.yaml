      This is only one example of the Arabic version’s Aristotelianizing tendencies. Another case, again having to do with God, is a passage describing God as ‘pure actuality’ (*al-fi‘l al-mahd*, at Badawi 1955, 51-2)[^badawi-1955] which intellect strives to imitate. This passage seems to betray the influence of Aristotle’s *Metaphysics*, book 12—and here it is apposite to reiterate that the Kindi circle produced an Arabic version of that work. On the other hand, one might argue that in such passages the Arabic version simply brings out the Aristotelian aspects of Plotinus himself. After all, he too occasionally (especially in the unusual treatise *Enneads* VI.8) flirts with the idea that the One thinks or is to be described as actuality. And Porphyry famously remarks in his *Life of Plotinus* (§14) that the whole of Aristotle’s *Metaphysics* is present in compressed fashion in the *Enneads*.
