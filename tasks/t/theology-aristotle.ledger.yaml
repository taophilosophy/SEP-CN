      现存阿拉伯文普罗提诺材料中着墨最多的主题是灵魂。不出所料，在这一主题上，同样值得把我们的文本与原初的普罗提诺作比较对照。阿拉伯文普罗提诺一如其所本，承认灵魂有不同类型或层级。其释义格外忠实地保留了“世界灵魂”的观念，而这一观念在其他阿拉伯哲学家（包括肯迪本人）的宇宙论中往往消失。有人指出，文本坚持世界灵魂与理智之间的明确区分。这一点与波菲利形成对照，因而也成为反对“我们的文本代表波菲利对普罗提诺的改写”这一看法的又一理由（见 D'Ancona 1999）[^d’ancona-1999]。
