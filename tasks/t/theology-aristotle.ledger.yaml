      它的影响高峰或许在十世纪，即其成书之后大约一个世纪。这一时期，阿布·雅库布·西吉斯塔尼、基尔马尼（al-Kirmānī）等好几位伊斯玛仪派作者，把普罗提诺的层级结构改编进他们自己的新柏拉图主义形而上学，并把层级的各个层次与伊斯兰神学要素关联起来。西吉斯塔尼比阿拉伯文普罗提诺的否定神学更进一步，坚持在谈论神时必须连否定也予以否定（详见 Walker 2005）[^walker-2005]。大约同一时期，阿米里（al-ʿĀmirī）与米斯凯韦（Miskawayh）等新柏拉图主义作者，也直接或间接地受到阿拉伯文普罗提诺的影响。米斯凯韦的《小得救》（*al-Fawz al-Asghar*，即 *Shorter Healing*）充斥着阿拉伯文普罗提诺的术语与学说（见 Adamson 2007b）[^adamson-2007b]，其圈子所编的一部哲学材料汇编也取材于该文本（Wakelnig 2014）[^wakelnig-2014]。与此同时，阿米里是把普罗克洛斯材料的普罗提诺式版本传述下来的作者之一（见 Wakelnig 2006）[^wakelnig-2006]。与该文本相关的新柏拉图主义观念，也出现在阿布·苏莱曼·西吉斯塔尼及其圈子等作者那里（关于他们见 Kraemer 1986）[^kraemer-1986]。十世纪稍早时候，犹太哲学家伊萨克·以色列汲取了阿拉伯文普罗提诺以及肯迪本人的著作（见 Altmann and Stern 1958）[^altmann-1958]。
