      We know of Ibn Na‘ima al-Himsi from other sources, too: he was a translator of the Kindi circle, and also rendered Aristotle (the *Sophistical Refutations* and parts of the *Physics*) into Arabic. Al-Himsi, like many translators of the period, was a Syrian Christian. This raises the question of whether he translated directly from Greek or from an intermediary Syriac version, which was a common practice in the Arabic translation movement. Zimmermann argues that there is no need to postulate a Syriac intermediary, though this has been questioned more recently (Bucur and Bucur 2006, but against postulating a Syriac intermediary Brock 2007)[^brock-2007][^bucur-2006].
