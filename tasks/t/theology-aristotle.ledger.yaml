      阿拉伯文版本对亚里士多德灵魂说的同情，在《九章集》IV.7.8⁵ 的译文中也显而易见。在这一章里，普罗提诺批评亚里士多德关于灵魂是身体之完善或隐德来希（*entelecheia*）的学说。与此相对，保存在《神学》第三章中的阿拉伯文版本却说，正是“最卓越的哲学家们”把灵魂描述为隐德来希（使用该希腊词的阿拉伯文音译），并由此出发去探究应当在何种意义上理解这一学说。换言之，阿拉伯文版本把亚里士多德的观点视为正确，并认为这一观点必定以某种方式与普罗提诺的观点相容（关于此见 Adamson 2002, ch.3）[^adamson-2002]。简言之，解决办法是：唯有理性灵魂才是真正的灵魂，它独立于身体；但灵魂仍然如亚里士多德所想，是“身体的形式”，就它是身体之形式或完善性的源头而言。
