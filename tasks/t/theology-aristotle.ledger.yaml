    step2: |-
      更耐人寻味的是对波菲利的提及。他是普罗提诺的学生，把后者的著作编成六组、每组九篇，即所谓《九章集》。我们知道《神学》依赖这个版本，因为它保留了波菲利为把普罗提诺著作的数目凑到 54 部而拆分较长论著时所造成的断裂。因此，当序言暗示我们面对的是波菲利对《九章集》的注疏或“阐释”时，这可能只是指原初的阿拉伯文版本以他的版本为底本。不过，既然波菲利本人说过他为普罗提诺写过注释，有些人便希望在阿拉伯文普罗提诺中看到一部波菲利著作的译本——那将是对其师思想的改写，比波菲利现存的《要义》（*Sentences*）在文本上更紧密地依附《九章集》。如果这一看法成立，前述的释义与哲学增补就会成为关于波菲利思想、以及他对其师普罗提诺思想之理解的极重要证据。然而，这一波菲利假说被 Zimmermann 否定，后来的学界在此再度随从他。不过，所谓“标题”倒可能确实出自波菲利。人们已注意到，这些标题表现出对普罗提诺体系的熟稔，与波菲利的作者身份相符；并且有哲学与语文学的证据提示，波菲利那部失传的《九章集》要点索引很可能正是阿拉伯文普罗提诺中这一成分的底本（D'Ancona 2012a, Chase 2021）[^chase-2021][^d’ancona-2012a]。
