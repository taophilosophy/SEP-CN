    step2: |-
      > 哲学家亚里士多德之书的第一章，希腊语称为“神学”（Theologia），意即“论神性”。此乃叙利亚的波菲利的阐释，由伊本·纳伊玛·希姆西（Ibn Naʿīma al-Ḥimsī）译为阿拉伯文，并由肯迪为艾哈迈德·伊本·穆阿塔西姆（Aḥmad ibn al-Muʿtaṣim）校正。〔按：为清晰起见，阿拉伯人名已作简省。〕
  - id: 12
    kind: body
    source: |-
      Ahmad ibn al-Mu‘tasim is the son of the ‘Abbasid caliph who reigned from 833–842 AD (218–227 AH), so this gives us a fairly reliable date for the production of the *Theology*, or at least for al-Kindi’s ‘correction’ of it. This date may in fact apply to the whole original Arabic translation of Plotinus. It is worth noting that this makes the Greek exemplar on which the translation was based earlier than our oldest Greek manuscripts of the *Enneads*. In fact we know that the Greek basis of the Arabic version represented an independent branch of the tradition, since all our Greek manuscripts lack a section (at Enn. IV.7.8) from the *Enneads* that is transmitted indirectly by Eusebius, but is found in the Arabic translation (in chapter three of the *Theology*).
    step1: |-
      Ahmad ibn al-Mu'tasim is the son of the 'Abbasid caliph who reigned from 833–842 AD (218–227 AH), so this gives us a fairly reliable date for the production of the *Theology*, or at least for al-Kindi's 'correction' of it. This date may in fact apply to the whole original Arabic translation of Plotinus. It is worth noting that this makes the Greek exemplar on which the translation was based earlier than our oldest Greek manuscripts of the *Enneads*. In fact we know that the Greek basis of the Arabic version represented an independent branch of the tradition, since all our Greek manuscripts lack a section (at Enn. IV.7.8) from the *Enneads* that is transmitted indirectly by Eusebius, but is found in the Arabic translation (in chapter three of the *Theology*).
    step2: |-
      艾哈迈德·伊本·穆阿塔西姆是公元 833–842 年（伊斯兰历 218–227 年）在位的阿拔斯王朝哈里发之子，这就为《神学》的产生——至少为肯迪对它的“校正”——提供了一个相当可靠的年代。这个年代实际上可能适用于整个原初的阿拉伯文普罗提诺译本。值得注意的是，这使该译本所依据的希腊文底本早于我们现存最古老的《九章集》希腊抄本。事实上我们知道，阿拉伯文版本的希腊文底本代表着传承中的一个独立分支：我们所有的希腊抄本都缺《九章集》IV.7.8 处的一节，该节经优西比乌的间接引述而流传，却见于阿拉伯文译本（《神学》第三章）。
