      Telesio’s cosmology puts an end to metaphysical explanations. Telesio thought space to be absolute (DRN book I, ch. XXV–XXVIII), thus abolishing the Aristotelian notion of a bipartite cosmos divided into a sublunary world, in which generation and corruption take place, and a supralunary sphere with eternal regular movements. The existence of vacuum within space is admitted, but things are said to have a natural inclination to avoid empty space. In the cosmological chapters of book IV Telesio critizised the Aristotelian explanation of the movement of the cosmos by a transcendent telos, the God of Aristotle’s metaphysics: the sky doesn’t move because of a desire for a being more perfect than itself, but because it is its own nature to move and thus to sustain its own life (DRN book IV, ch. XXIV; Aristotle, *Metaph*. XII, ch. 6–7). Likewise, he rejected the idea that the motions of the subordinate spheres were caused by unmoved movers, the pure intelligences of the Aristotelian and Christian traditions, an assumption which he reprimanded to be obscure and incomprehensible even via imagination (Bondì 1018).
    step1: |-
      特莱西奥的宇宙论终结了形而上学的解释。特莱西奥认为空间是绝对的（DRN 第 1 卷第 25–28 章），由此废除了亚里士多德二分宇宙的概念——宇宙被分为发生生灭变化的月下世界与具有永恒规则运动的月上天球。空间中存在真空是被承认的，但据说事物有一种避开虚空的自然倾向。在第 4 卷的宇宙论章节中，特莱西奥批评了亚里士多德用超越的目的因——亚里士多德形而上学的神——解释天球运动的作法：天球运动并非因为渴望一个比自身更完善的存在者，而是因为运动并由此维系自身的生命乃是它的本性（DRN 第 4 卷第 24 章；亚里士多德《形而上学》第 12 卷第 6–7 章）。同样，他拒绝下级天球的运动由不动的推动者——亚里士多德与基督教传统中的纯粹理智——所引起的观点，他认为这一假定晦涩难解，甚至无法设想（Bondì 1018）。
