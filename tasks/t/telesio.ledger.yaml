      The things of nature are not created, governed and sustained by divine providence. In Telesio’s philosophy, there is no such thing as a transcendent mind or idea. All things act solely according to their own nature, starting from the primary forces of cold and heat. The Epicurean chance is enclosed in Telesio’s Stoic-influenced philosophy of nature (Kessler 1992)[^kessler-1992]: everything can produce everything, an idea which was soon to be sharply rejected by Francesco Patrizi da Chierso, one of the most important contemporary readers of Telesio (“Obiectiones”, in the appendix of Telesio’s *Varii libelli*, p. 467 f.). In order to sustain themselves, these primary forces and all beings which arise through their antagonistic interaction must be able to sense themselves as well as the opposite force, that is, they must sense what is convenient and what is inconvenient or damaging for their survival and well-being. Sensation, therefore, is not the property of embodied souls. Telesio’s philosophy can thus be described as a pansensism in the sense that all beings, animate or inanimate, are said to have the power of sensation.
    step1: |-
      自然物并非由神圣天意所创造、治理和维系。在特莱西奥的哲学中，不存在超越的心灵或理念这样的东西。万物仅按其自身本性而行动，始于冷与热这两种原初力量。伊壁鸠鲁式的偶然被包含在特莱西奥受斯多亚影响的自然哲学中（Kessler 1992）[^kessler-1992]：一切都能产生一切——这一观念很快遭到弗朗切斯科·帕特里齐的尖锐拒斥，后者是特莱西奥最重要的同时代读者之一（“Obiectiones”，载《论自然诸题小集》附录，第 467 页以下）。为了自我维系，这些原初力量及由其对抗互动而产生的一切存在物必须既能感觉到自身、也能感觉到对立的力量，也就是说，它们必须能感知什么有利于自己的存活与福祉、什么不利或有害。因此，感觉并不是寓于身体中的灵魂才有的属性。特莱西奥的哲学因此可被描述为一种泛感觉论：一切存在物，无论有生命还是无生命，都被认为具有感觉能力。
