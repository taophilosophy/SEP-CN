      为解释有生命的存在物如何行使不同的功能与运作，传统的心理学理论与生理学理论都诉诸三分的灵魂。亚里士多德在《论灵魂》中区分了植物灵魂（*anima vegetativa*）、感觉灵魂（*anima sensitiva*）与思维灵魂（*anima cogitativa*）（这一区分也对应于植物、动物与人及其各自特殊的能力）；柏拉图则确立了灵魂的三个部分（《理想国》434d–443e），并在《蒂迈欧》（69a 以下）中把它们与不同的器官联系起来：灵魂的理性部分（*logistikon*）对应大脑，激情部分（*thumoeides*）对应心脏，欲望部分即低等激情（*épithumêtikon*）对应肝脏。斯多亚派医师盖伦沿袭了这一三分（《论希波克拉底与柏拉图的学说》第 7 卷第 1、3 章），又加上三重精气：自然精气（*spiritus naturalis*）产生于肝脏，活力精气（*spiritus vitalis*）在血液中精炼，动物精气（*spiritus animalis*）在脑中蒸馏。《论物性》抨击的是亚里士多德的灵魂学说，而特莱西奥则把一整部论著献给对盖伦的批评，即《一切动物皆由单一灵魂实体所支配：驳盖伦》。按照特莱西奥，有机体的运作不能通过预设多个支配者来解释。在主张灵魂（即精气）的统一性时，特莱西奥追随医学理论家乔瓦尼·阿真泰里奥（Giovanni Argenterio，1513–1572），后者捍卫精气的统一性，以对抗亚里士多德传统与医学传统。
