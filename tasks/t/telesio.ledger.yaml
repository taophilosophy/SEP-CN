      Besides the natural soul or spirit Telesio accepted the existence of an immortal soul superimposed by God (DRN book V, ch. II–III). But in his theory of psychology and ethics the soul does not play any significant role, for which reason researchers have often held it to be an addition designed to avoid conflicts with the Church. On the other hand, there do exist certain modes of behavior which cannot be explained in a purely naturalistic and materialistic way, such as the human striving for eternity and the martyrs’ denial of the highest objective of self-preservation. But far from building a bridge to the philosophical tradition, Telesio’s definition of a second, divinely superimposed soul as “forma corporis et praecipue spiritus” deals a deathblow to Aristotle’s teachings. According to Telesio, the idea of an immortal soul was totally unknown to the heathen Aristotle, who is severely criticized for confusing the concept of a natural spirit with the religious idea of a soul (DRN book V, ch. II–III):
    step1: |-
      除了自然灵魂或精气之外，特莱西奥还承认一个由上帝叠加于人的不朽灵魂的存在（DRN 第 5 卷第 2–3 章）。但在他的心理学与伦理学理论中，这个灵魂并不扮演任何重要角色，因此研究者常常认为它是为避免与教会冲突而添设的。另一方面，确实存在某些行为方式无法以纯自然主义、唯物主义的方式解释，例如人对永恒的追求、殉道者对自我保存这一最高目标的放弃。然而，特莱西奥把第二个、由神叠加的灵魂定义为“身体并尤其精气的形式”（*forma corporis et praecipue spiritus*），这一定义远非向哲学传统架桥，而是给了亚里士多德的学说致命一击。按照特莱西奥，不朽灵魂的观念对异教的亚里士多德来说全然陌生；亚里士多德因把自然精气的概念与宗教的灵魂观念相混淆而受到严厉批评（DRN 第 5 卷第 2–3 章）：
    step2: |-
      在自然的灵魂即精气之外，特莱西奥还承认一个由上帝所加赋的不朽灵魂（DRN 第 5 卷第 2–3 章）。但在他的心理学与伦理学里，这个灵魂并不担纲任何要角，因此研究者每每视之为避免与教会冲突而添设的补笔。另一方面，确乎存在某些无法以纯自然主义、唯物主义方式说明的行为样态——例如人对永恒的追求，又如殉道者对自我保存这一最高目标的弃绝。然而，特莱西奥把这第二个、由神加赋的灵魂定义为“身体并尤其精气的形式”（forma corporis et praecipue spiritus）——这一定义远非向哲学传统递出橄榄枝，而是给了亚里士多德的学说致命一击。按特莱西奥，不朽灵魂的观念对异教的亚里士多德全然陌生；亚里士多德因混淆自然精气的概念与宗教的灵魂观念而遭严辞抨击（DRN 第 5 卷第 2–3 章）：
