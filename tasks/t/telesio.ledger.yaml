      Nonetheless, the few pages which Telesio dedicated to the immortal soul do not open a path to metaphysical or theological theories. In science, Telesio adheres to a naturalistic worldview. It was Tommaso Campanella who combined Telesian naturalism with a theory of the anima creata and human mind which he based upon sceptical doubts. (Boenke 2005, Ernst 2014, Bondì 2018)[^boenke-2005][^ernst-2014].
    step1: |-
      尽管如此，特莱西奥为不朽灵魂写下的那几页，并未开辟一条通往形而上学或神学理论的道路。在科学上，特莱西奥坚持一种自然主义的世界观。是托马索·康帕内拉把特莱西奥的自然主义与一种建基于怀疑论怀疑之上的受造灵魂（*anima creata*）与人类心灵理论结合了起来（Boenke 2005, Ernst 2014, Bondì 2018）[^boenke-2005][^ernst-2014]。
    step2: |-
      尽管如此，特莱西奥为不朽灵魂所写的寥寥数页，并未开启一条通往形而上学或神学理论的道路。在科学上，特莱西奥坚守一种自然主义的世界观。把特莱西奥式自然主义与受造灵魂（anima creata）及人类心灵理论结合起来的，是托马索·康帕内拉——其结合以怀疑论的疑虑为根基（Boenke 2005, Ernst 2014, Bondì 2018）[^boenke-2005][^ernst-2014]。
