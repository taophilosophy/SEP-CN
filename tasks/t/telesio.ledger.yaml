      The ethics exposed in the 9ᵗʰ book of *De rerum natura* is strictly naturalist. The only objective which Telesio ascribes to the spirit is self-preservation and self-improvement, the former lying in its ability to react suitably to influences from the external world, the latter in its capability of finding means to improve its state of being. This comes about through theoretical knowledge, specifically through natural philosophy and medicine (cf. DRN book VIII, ch. XXI) and through learning to control one’s own emotions and desires. According to Telesio, we can voluntarily provoke and suppress affections and their related actions (DRN book IX, ch. I; vol. III, p. 332f.); what is more, we are able to master the degree to which we desire and are affected (DRN book IX, ch. II; vol. III, p. 334). The principle of moral virtue is said to be a knowledge of what is helpful and what is damaging for survival and well-being in human society. All virtues and vices are reduced to self-conservation.
    step1: |-
      《论物性》第 9 卷所阐述的伦理学是严格的自然主义伦理学。特莱西奥归于精气的唯一目标是自我保存与自我改善：前者在于精气恰当地回应外部世界影响的能力，后者在于它找到改善自身存在状态之手段的能力。自我改善通过理论知识来实现，特别是通过自然哲学与医学（参见 DRN 第 8 卷第 21 章），也通过学会控制自己的情感与欲望。按照特莱西奥，我们可以自愿地引发和抑制情感及其相关行动（DRN 第 9 卷第 1 章；第 3 卷第 332 页以下）；不仅如此，我们还能掌控我们欲望和受影响的程度（DRN 第 9 卷第 2 章；第 3 卷第 334 页）。道德德性的原则据说是一种知识——关于什么有助于人类社会中的存活与福祉、什么有害的知识。一切德性与恶习都被还原为自我保存。
    step2: |-
      《论物性》第 9 卷所陈的伦理学是彻底的自然主义伦理学。特莱西奥赋予精气的唯一目标是自我保存与自我改善：前者在于它对外部世界的影响作出恰当回应的能力，后者在于它寻得改善自身存在状态之手段的能力。自我改善经由理论知识达成——尤其是自然哲学与医学（参见 DRN 第 8 卷第 21 章）——也经由学会控制自己的情感与欲望。按特莱西奥，我们能够自愿地引发和抑制情感及其相关行动（DRN 第 9 卷第 1 章；第 3 卷第 332 页以下）；不止于此，我们还能掌控自己欲望与受感的程度（DRN 第 9 卷第 2 章；第 3 卷第 334 页）。道德德性之本，据说在于这样一种知识：知道在社会生活中什么有助于存活与福祉、什么有害。一切德性与恶习尽皆还原为自我保存。
