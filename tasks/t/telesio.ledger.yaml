  - id: 6
    kind: body
    source: |-
      Telesio’s vision of the genesis of nature is simple to the point of being archaic, yet at the same time astonishingly modern in the sense that he seems to have been one of the very first defenders of a theory of natural evolution without metaphysical or theological presuppositions. According to his *De rerum natura*, the only things which must be presupposed are passive matter and active force, the latter of which Telesio thought of as twofold, heat and cold. These principles were meant to replace the Aristotelian metaphysical principles of matter and form. In order to explain how all natural beings came into existence by these opposing forces, Telesio presumed that in the beginning God had created two primary globes, the sun and the earth, the sun being the seat of heat, the earth that of coldness, and that He had separated them with such a distance in space that they could not extinguish each other (DRN book I, ch. IV). All natural things result from the battle of these antagonistic forces for the possession of matter. The main region of that creative battle is the surface of the earth, where they create metals, stones and animate beings. The primary activity of warmth is to move fast and to dilate and rarefy matter, whereas that of cold is to hinder movement and to condense matter. Things differ according to the amount of heat or cold they possess (and therefore according to their density and derivative qualities such as velocity and colour). The quantity of matter is not changed through the action of these forces upon it. The role of heat, cold and matter as ‘natural principles’ had been highlighted before by Girolamo Fracastoro in the first version of the *Homocentrica* and in the dialogue *Fracastorius sive De anima* (Lerner 1992)[^lerner-1992][^lerner-1992-2], as well as by Girolamo Cardano in his *Liber unicus de natura.*
    step1: |-
      特莱西奥关于自然生成的图景简单到近乎古朴，却又惊人地现代——就他似乎是最早捍卫一种无形而上学或神学预设的自然演化理论的人之一而言。按照他的《论物性》，必须预设的只有受动的物质与能动的力，后者在特莱西奥看来是二重的：热与冷。这些本原意在与亚里士多德的形式与物质这两种形而上学本原相替换。为解释一切自然存在物如何由这些对立的力产生，特莱西奥假定：起初上帝创造了两个原初的球体——太阳与大地，太阳是热的居所，大地是冷的居所——并以足够的空间距离将它们分开，使它们不能彼此熄灭（DRN 第 1 卷第 4 章）。一切自然物都源于这两种敌对力量争夺物质的战斗。这场创造性战斗的主要区域是大地的表面，在那里它们创造出金属、石头与有生命的存在物。热的首要活动是快速运动并使物质膨胀、稀化，冷的活动则是阻碍运动并使物质凝聚。事物因其所含热或冷的量而彼此不同（因此也因密度及速度、颜色等派生性质而不同）。物质在力的作用下数量不变。热、冷与物质作为“自然本原”的角色此前已由吉罗拉莫·弗拉卡斯托罗（Girolamo Fracastoro）在《同心天球》第一版和对话篇《弗拉卡斯托里乌斯，或论灵魂》（*Fracastorius sive De anima*）中予以强调（Lerner 1992）[^lerner-1992][^lerner-1992-2]，吉罗拉莫·卡尔达诺（Girolamo Cardano）在其《论自然单卷》（*Liber unicus de natura*）中亦然。
    step2: |-
