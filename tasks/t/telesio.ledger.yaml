    source: |-
      Bernardino Telesio (1509–1588) belongs to a group of independent philosophers of the late Renaissance who left the universities in order to develop philosophical and scientific ideas beyond the restrictions of the Aristotelian-scholastic tradition. Authors in the early modern period referred to these philosophers as ‘novateurs’ and ‘modern’. In contrast to his successors Patrizi and Campanella, Telesio was a fervent critic of metaphysics and insisted on a purely empiricist approach in natural philosophy—he thus became a forerunner of early modern empiricism. He had a remarkable influence on Tommaso Campanella, Giordano Bruno, Pierre Gassendi, Francis Bacon, Thomas Hobbes and on freethinkers like Guillaume Lamy and Giulio Cesare Vanini.
    step1: |-
      贝尔纳迪诺·特莱西奥（Bernardino Telesio，1509–1588）属于文艺复兴晚期一批独立的哲学家，他们离开大学，以便在亚里士多德-经院哲学传统的限制之外发展哲学与科学思想。近代早期的作者们称这些哲学家为“novateurs”（革新者）和“modern”（现代人）。与他的后继者克尔索的弗朗切斯科·帕特里齐和托马索·康帕内拉不同，特莱西奥是形而上学的激烈批评者，并坚持在自然哲学中采取纯经验主义的进路——由此他成为近代早期经验主义的先驱。他对托马索·康帕内拉、乔尔丹诺·布鲁诺、皮埃尔·伽桑狄、弗朗西斯·培根、托马斯·霍布斯以及纪尧姆·拉米（Guillaume Lamy）、尤利奥·切萨雷·瓦尼尼（Giulio Cesare Vanini）等自由思想者都有显著影响。
    step2: |-
      贝尔纳迪诺·特莱西奥（Bernardino Telesio，1509–1588）属于文艺复兴晚期一批特立独行的哲学家：他们走出大学，为的是在亚里士多德-经院传统的束缚之外发展哲学与科学思想。近代早期的作者称他们为“novateurs”（革新者）与“modern”（现代人）。与后继者克尔索的弗朗切斯科·帕特里齐和托马索·康帕内拉不同，特莱西奥猛烈批评形而上学，坚持在自然哲学中走一条纯经验主义的进路——他由此成为近代早期经验主义的先驱。他对托马索·康帕内拉、乔尔丹诺·布鲁诺、皮埃尔·伽桑狄、弗朗西斯·培根、托马斯·霍布斯影响显著，对纪尧姆·拉米（Guillaume Lamy）、尤利奥·切萨雷·瓦尼尼（Giulio Cesare Vanini）等自由思想者亦然。
