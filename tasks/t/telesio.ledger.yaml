      特莱西奥把精气的医学理论与一个基本属于斯多亚派的观念——统治部分（*hegemonikon*）——结合起来：按照这一观念，大脑中的精气负责传统上归于三分灵魂的一切状态与运作。“动物……由居于大脑中的单一实体所支配”（《一切动物皆由单一灵魂实体所支配》第 25 章；*Var. lib.* 第 254 页）。在《一切动物皆由单一灵魂实体所支配》中他以生理学解释情感，而在《论物性》中他又在物理基础上增加了感觉知觉理论与知识理论。
