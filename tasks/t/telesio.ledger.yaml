  - id: 3
    kind: body
    source: |-
      Bernardino Telesio was born at Cosenza in Calabria in 1509 as the son of a noble and quite wealthy family. Having been educated by his uncle Antonio Telesio, a humanist of note, he studied in Milan, Rome and the famous university of Padua, which he left in 1535. There is no evidence that Telesio gained a doctorate. Instead of undertaking a university career, he spent several years in a Benedictine monastery (1535–44) without taking oaths. Later he lived in the Neapolitan home of Alfonso III Carafa, Duke of Nocera. In 1553 he married and settled in Cosenza, becoming the dominant figure of the Accademia Cosentina, which came to focus on natural philosophy under his tutelage. Telesio never held a salaried position. After the death of his wife in 1561, which marked the beginning of his financial difficulties, he seems to have spent some time in Rome under the patronage of Pope Pius IV. He rejected the Archbishopric of Cosenza offered by Pius IV in 1565, leaving this position to his brother. From 1576 on he was moving between Cosenza and Naples; in Naples he lived with the son and heir of Alfonso Carafa, Ferrante, to whom he dedicated the final version of his *De rerum natura*. He died in his hometown in 1588.
    step1: |-
      贝尔纳迪诺·特莱西奥 1509 年生于卡拉布里亚的科森扎，出身一个颇为富有的贵族家庭。他由声名卓著的人文主义者、叔父安东尼奥·特莱西奥抚教成人，先后在米兰、罗马和著名的帕多瓦大学求学，1535 年离开帕多瓦。没有证据表明特莱西奥获得过博士学位。他没有走大学任教之路，而是在一座本笃会修道院中度过了几年（1535–44），但未发愿。后来他住在那不勒斯的诺切拉公爵阿方索三世·卡拉法家中。1553 年他结婚并定居科森扎，成为科森扎学院的主导人物，该学院在他的指导下渐以自然哲学为重心。特莱西奥从未担任过有俸禄的职位。1561 年妻子去世，他的经济困难由此开始；此后他似乎在罗马度过了一段时间，受教宗庇护四世的庇护。1565 年他拒绝了庇护四世提供的科森扎大主教之职，把这一职位让给他的兄弟。1576 年起他往来于科森扎与那不勒斯之间；在那不勒斯，他与阿方索·卡拉法的儿子兼继承人费兰特同住，《论物性》的最终版正是题献给费兰特的。1588 年他在故乡去世。
    step2: |-
      贝尔纳迪诺·特莱西奥 1509 年生于卡拉布里亚的科森扎，出身颇为富有的贵族家庭。他由声名卓著的人文主义者、其叔安东尼奥·特莱西奥抚教成人，先后就读于米兰、罗马与著名的帕多瓦大学，1535 年离开帕多瓦。没有证据表明特莱西奥取得过博士学位。他未走大学任教的常路，而是在一座本笃会修道院中度过了数年（1535–44），但未立誓。其后他寄居那不勒斯，住在诺切拉公爵阿方索三世·卡拉法家中。1553 年他成婚并定居科森扎，成为科森扎学院的主导人物——该学院在他的指导下渐以自然哲学为重心。特莱西奥从未领过有俸的职位。1561 年妻子去世，他的财政困难自此开始；此后他似乎一度旅居罗马，受教宗庇护四世庇护。1565 年他谢绝了庇护四世相赠的科森扎大主教之职，让与自己的兄弟。1576 年起他辗转于科森扎与那不勒斯之间；在那不勒斯他与阿方索·卡拉法之子兼继承人费兰特同住，《论物性》的最终版正是题献给费兰特的。1588 年他在故乡辞世。
  - id: 4
    kind: body
    source: |-
      Telesio dedicated his whole life to establishing a new kind of natural philosophy, which can be described as an early defense of naturalism and empiricism bound together with a rigorous criticism of Aristotelian natural philosophy and Galenic physiology. Telesio blamed both Aristotle and Galen for relying on elaborate reasoning rather than sense perception and empirical research. His fervent attacks against the greatest authorities of the Western philosophical and medical traditions led Francis Bacon to speak of him as “the first of the moderns” (*Opera omnia* vol. III, 1963, p. 114). He was perhaps the most strident critic of metaphysics in late Renaissance times. It was obviously due to his excellent relationships with popes and clerics that he was not persecuted and was able during his own lifetime to publish his rather heterodox writings, which went on the index shortly after his death. His principal work is the aforementioned *De rerum natura iuxta propria principia* (“On the Nature of Things according to their Own Principles”), which in the last augmented edition of the author’s hand appeared in Naples in 1586. The *De rerum natura* is a huge treatise in nine books which deals with cosmology, biology, sense perception, reason and ethics. Another treatise of major importance is *Quod animal universum ab unica animae substantia gubernatur. Contra Galenum*, in which Telesio critizised central conceptions of Galenic physiology and psychology. This work was never printed, but circulated in manuscript copies (De Franco, 1981, p. XXII). Smaller treatises deal with a variety of themes such as colours, dreams, geology and meteorology, some of which were published in Rome in 1565 (*De iis quae in aere fiunt et de terremotibus*; *De colorum generatione*; *De mari*). Telesio’s philosophy was disseminated by friends and students such as Tommaso Campanella, whose writings contain long paraphrases of Telesian ideas; by Sertorio Quattromani, Telesio’s successor as head of the Accademia Cosentina, who published a synthesis of his predecessor’s philosophy in 1589; and by Antonio Persio, who gave lessons on Telesio’s thought in Venice and published a collection of smaller works, the *Varii de naturalibus rebus libelli*, in 1590. Giordano Bruno speaks of the “giudiciosissimo Telesio” in the third dialog of *De la causa*, whilst Francis Bacon based his own speculative philosophy of nature on a blend of Telesian and Paracelsian conceptions (Giachetti Assenza 1980; Rees 1977; 1984)[^giachetti-1980][^rees-1977]. Thomas Hobbes followed Telesio in the rejection of species (Schuhmann 1990; Leijenhorst 1998, p. 116ff.)[^leijenhorst-1998][^schuhmann-1990][^schuhmann-1990-2] The physiology of René Descartes in *De homine* shows close similarities to Telesio’s physiological theories as they are presented in *De natura rerum* (Hatfield 1992)[^hatfield-1992]. Telesio also had some influence on Gassendi and on libertine thinkers (Bianchi 1992)[^bianchi-1992].
    step1: |-
      特莱西奥毕生致力于建立一种新的自然哲学，可以把它描述为对自然主义与经验主义的早期辩护，同时辅以对亚里士多德自然哲学与盖伦生理学的严厉批判。特莱西奥指责亚里士多德和盖伦依赖精巧的推理而非感官知觉与经验研究。他对西方哲学与医学传统中最高权威的猛烈攻击，使弗朗西斯·培根称他为“现代人之首”（*Opera omnia* vol. III, 1963, p. 114）。他或许是文艺复兴晚期最尖锐的形而上学批评者。显然，正是由于他与教宗和教士的良好关系，他没有受到迫害，得以在生前出版他那些相当离经叛道的著作——这些著作在他去世后不久即被列入《禁书目录》。他的主要著作是前述《论物性》（*De rerum natura iuxta propria principia*，“按照其自身本原论万物本性”），最后由作者亲手增订的版本于 1586 年在那不勒斯出版。《论物性》是一部九卷本的巨著，论及宇宙论、生物学、感官知觉、理性与伦理。另一部重要著作是《一切动物皆由单一灵魂实体所支配：驳盖伦》（*Quod animal universum ab unica animae substantia gubernatur. Contra Galenum*），特莱西奥在其中批评了盖伦生理学与心理学的核心概念。这部著作从未印行，而以抄本形式流传（De Franco, 1981, p. XXII）。一些小论著讨论颜色、梦、地质学与气象学等多种主题，其中一些于 1565 年在罗马出版（《论空气中发生的事情及地震》[De iis quae in aere fiunt et de terremotibus]；《论颜色的产生》[De colorum generatione]；《论海》[De mari]）。特莱西奥的哲学由朋友与学生传播：如托马索·康帕内拉，其著作包含特莱西奥思想的长篇转述；如塞尔托里奥·夸特罗马尼（Sertorio Quattromani）——特莱西奥在科森扎学院的继任者，1589 年出版了一部其师哲学的纲要；还有安东尼奥·佩尔西奥（Antonio Persio），他在威尼斯讲授特莱西奥思想，并于 1590 年出版了一部小作品集《论自然诸题小集》（*Varii de naturalibus rebus libelli*）。乔尔丹诺·布鲁诺在《论原因、本原与太一》（*De la causa*）第三篇对话中称他为“giudiciosissimo Telesio”（判断力至为敏锐的特莱西奥），而弗朗西斯·培根则把一种特莱西奥式与帕拉切尔苏斯式概念的混合当作自己的思辨自然哲学的基础（Giachetti Assenza 1980; Rees 1977; 1984）[^giachetti-1980][^rees-1977]。托马斯·霍布斯追随特莱西奥拒斥种相（Schuhmann 1990; Leijenhorst 1998, p. 116ff.）[^leijenhorst-1998][^schuhmann-1990][^schuhmann-1990-2]。勒内·笛卡尔在《论人》（*De homine*）中的生理学与《论物性》所呈现的特莱西奥生理学理论极为相似（Hatfield 1992）[^hatfield-1992]。特莱西奥对伽桑狄和自由思想派思想家也有一定影响（Bianchi 1992）[^bianchi-1992]。
    step2: |-
      特莱西奥毕生致力于建立一种新的自然哲学：它可以描述为对自然主义与经验主义的早期辩护，并配以对亚里士多德自然哲学与盖伦生理学的严厉批判。特莱西奥责备亚里士多德与盖伦二人依赖精巧的推理，而不是感官知觉与经验研究。正是他对西方哲学与医学传统这两大最高权威的猛烈攻击，令弗朗西斯·培根称他为“现代人之首”（*Opera omnia* vol. III, 1963, p. 114）。他或许是文艺复兴晚期形而上学最尖锐的批评者。显然，正因为他与教宗及教士们交好，他才未遭迫害，得以在生前出版那些相当离经叛道的著作——它们在他死后不久即被列入《禁书目录》。他的主要著作即前述《论物性》（*De rerum natura iuxta propria principia*，“按照其自身本原论万物本性”），由作者亲手增订的最后一版于 1586 年在那不勒斯刊行。《论物性》是一部九卷巨制，论及宇宙论、生物学、感官知觉、理性与伦理。另一部同等重要的论著是《一切动物皆由单一灵魂实体所支配：驳盖伦》（*Quod animal universum ab unica animae substantia gubernatur. Contra Galenum*），特莱西奥在其中批驳盖伦生理学与心理学的核心观念。此著从未刊印，仅以抄本流传（De Franco, 1981, p. XXII）。若干小论著讨论颜色、梦、地质与气象等各种主题，其中一部分 1565 年在罗马出版（《论空气中发生的事情及地震》[De iis quae in aere fiunt et de terremotibus]；《论颜色的产生》[De colorum generatione]；《论海》[De mari]）。特莱西奥的哲学由朋友与学生传播开来：托马索·康帕内拉的著作中有对特莱西奥思想的长篇转述；塞尔托里奥·夸特罗马尼（Sertorio Quattromani）——特莱西奥在科森扎学院的继任者——1589 年出版了一部师说纲要；安东尼奥·佩尔西奥（Antonio Persio）则在威尼斯讲授特莱西奥思想，并于 1590 年汇刊小作成《论自然诸题小集》（*Varii de naturalibus rebus libelli*）。乔尔丹诺·布鲁诺在《论原因、本原与太一》（*De la causa*）第三篇对话里称许这位“giudiciosissimo Telesio”（判断力至为敏锐的特莱西奥）；弗朗西斯·培根则把特莱西奥式概念与帕拉切尔苏斯式概念熔于一炉，以此奠定他自己的思辨自然哲学（Giachetti Assenza 1980; Rees 1977; 1984）[^giachetti-1980][^rees-1977]。托马斯·霍布斯追随特莱西奥拒斥种相（Schuhmann 1990; Leijenhorst 1998, p. 116ff.）[^leijenhorst-1998][^schuhmann-1990][^schuhmann-1990-2]。勒内·笛卡尔在《论人》（*De homine*）中的生理学与《论物性》所陈的特莱西奥生理学理论颇多酷似（Hatfield 1992）[^hatfield-1992]。特莱西奥对伽桑狄及自由思想派思想家亦有影响（Bianchi 1992）[^bianchi-1992]。
