      Today Kepler is remembered in the history of sciences above all for his three planetary laws, which he produced in very specific contexts and at different times. While it is questionable whether he would have understood these scientific statements as “laws”—and it is even arguable that he used this term with a different meaning than we do today—it seems to be clear that all three laws (as a linguistic convention, we may continue to use the term) suppose some fundamentals of Kepler’s philosophy: (a) realism, (b) causality, (c) the geometric structure of the cosmos. Besides this, it should be remarked that the common denominator of all three laws is Kepler’s defense of the Copernican worldview, a cosmological system which he was not able to defend without reforming it radically (see Goldstein and Hon, 2005). It took, of course, more than ten years of sustained work to establish the new astronomy on a physical basis, as Kepler had always intended. However, he was convinced early on of the central, both positional and physical, role that must be attributed to the Sun (see Granada 2022)[^granada-2022]. It is noteworthy that already at the very beginning of his career Kepler vehemently defended the reality of the Copernican worldview in a way that he characterized, taking over the terminology from the standard Aristotelian epistemology, as “a priori” (see above Section 3 above and Di Liscia 2009)[^di-2009].
    step1: |-
      今天，开普勒在科学史中首先以三大行星定律为人铭记；它们是在非常特定的语境中、于不同时间提出的。虽然他是否会把这些科学陈述理解为“定律”是可疑的——甚至可以争论他对这个词的用法与我们今天不同——但似乎清楚的是：三条定律（作为语言约定，我们可以继续用这个词）都以开普勒哲学的某些基础为前提：（a）实在论；（b）因果性；（c）宇宙的几何结构。除此之外应当指出：三条定律的共同分母是开普勒对哥白尼世界观的辩护——这是一个他若不彻底改革便无法为之辩护的宇宙论体系（见 Goldstein and Hon, 2005）。当然，把新天文学建立在物理基础之上——如开普勒一贯所愿——花了十多年持续的工作。然而他很早就确信太阳所占据的中心地位——既是位置上的，也是物理上的（见 Granada 2022）[^granada-2022]。值得注意的是，早在他生涯的最初，开普勒就激烈地为哥白尼世界观的实在性辩护，其方式被他借用标准亚里士多德认识论的术语刻画为“先天的”（见上文第 3 节及 Di Liscia 2009）[^di-2009]。
    step2: |-
