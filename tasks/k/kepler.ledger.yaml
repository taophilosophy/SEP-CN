      Kepler contributed to the special field of optics with two seminal works, the *Ad* *Vitellionem paralipomena* (=APO) and the *Dioptrice* (=DI), the latter motivated in large part by the publication in 1610 of Galileo’s *Sidereal Messenger* (*Sidereus Nuncius*). In his *Conversation with the Sidereal Messenger* (*Dissertatio cum Nuncio Sidereo* … *a Galillaeo Galilaeo*, KGW 4, pp. 281–311), he supported the factual information given by Galileo, indicating at the same time the necessity of giving an account of the causes of the observed phenomena. The background for his investigation into optics was undoubtedly the different particular questions of astronomical optics (see Straker 1971). In this context he concentrated his efforts on an explanation of the phenomena of eclipses, of the apparent size of the Moon and of atmospheric refraction. Kepler investigated the theory of the *camera obscura* very early and recorded its general principles (see commentary by M. Hammer in KGW 2, pp. 400–1 and Straker 1981)[^straker-1981]. In addition, he worked intensively on the theory of the telescope and invented the refracting astronomical or ‘Keplerian’ telescope, which involved a considerable improvement over the Galilean telescope (see especially DI, Problem 86, KGW 4, pp. 387–88). Besides these impressive contributions, Kepler expanded his research program to embrace mathematics as well as anatomy, discussing for instance conic sections and explaining the process of vision (see Crombie 1991 and especially Lindberg 1976b)[^crombie-1991][^lindberg-1976b].
    step1: |-
      开普勒以两部开创性的著作对光学这一特殊领域做出了贡献：《补编，天文学的光学部分》（＝*APO*）与《折射光学》（＝*DI*）；后者的动机很大程度上来自 1610 年伽利略《星际信使》的出版。在《与星际信使的对话》（*Dissertatio cum Nuncio Sidereo…a Galillaeo Galilaeo*, KGW 4, pp. 281–311）中，他为伽利略给出的事实信息辩护，同时指出必须对观测到的现象之原因作出说明。他研究光学的背景无疑是天文光学的种种具体问题（见 Straker 1971）。在此语境中，他把精力集中于解释月食现象、月球的视大小与大气折射。开普勒很早就研究了*暗箱*理论并记录了它的一般原理（见 M. Hammer 载 KGW 2, pp. 400–1 的评注，及 Straker 1981）[^straker-1981]。此外，他深入研究了望远镜理论，发明了折射式天文望远镜即“开普勒式”望远镜——相比伽利略式望远镜有相当大的改进（特别见 DI, Problem 86, KGW 4, pp. 387–88）。除了这些令人印象深刻的贡献，开普勒把研究计划扩展到数学与解剖学：例如讨论圆锥曲线、解释视觉过程（见 Crombie 1991，尤其 Lindberg 1976b）[^crombie-1991][^lindberg-1976b]。
