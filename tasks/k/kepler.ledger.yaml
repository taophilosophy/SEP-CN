      with $T_1$ and $T_2$ representing the periodic times of two planets and $a_1$ and $a_2$ the length of their semi-major axes. A further formulation of this relationship, which is often found in the literature, is: $a^3/T^2 = K$, which expresses with $K$ that the relationship between the third power of the distances and the square of the times is a constant (however, see Davis 2005, pp. 171–172; for the third planetary law see especially Stephenson 1987)[^davis-2005][^stephenson-1987]. As a consequence of the third law, the time a planet takes to travel around the Sun will significantly increase the farther away it is or the longer the radius of its orbit. Thus, for instance, Saturn’s sidereal period is almost 30 years, while Mercury needs fewer than 88 days to go around the Sun. For the history of cosmology, it is important to make clear that the third law fulfils Kepler’s search for a *systematic* representation and defense of the Copernican worldview, in which planets are not absolutely independent of each other but integrated in a harmonic world system.
    step1: |-
      其中 $T_1$ 与 $T_2$ 表示两颗行星的公转周期，$a_1$ 与 $a_2$ 表示它们半长轴的长度。这一关系的另一种表述在文献中也很常见：$a^3/T^2 = K$，它以 $K$ 表示距离的三次方与时间的平方之间的关系是一个常数（不过见 Davis 2005, pp. 171–172；关于第三行星定律特别见 Stephenson 1987）[^davis-2005][^stephenson-1987]。作为第三定律的推论，行星绕太阳一周所需的时间会随着它离得更远、或其轨道半径更长而显著增加。例如，土星的恒星周期接近 30 年，而水星绕太阳一周只需不到 88 天。就宇宙论的历史而言，重要的是讲清楚：第三定律实现了开普勒对哥白尼世界观之*系统性*表象与辩护的追求——在其中，行星并非彼此绝对独立，而是被整合进一个和谐的世界体系。
    step2: |-
      其中 $T_1$ 与 $T_2$ 表示两颗行星的公转周期，$a_1$ 与 $a_2$ 表示它们半长轴的长度。这一关系的另一种表述在文献中也很常见：$a^3/T^2 = K$——它以 $K$ 表示距离的三次方与时间的平方之比为常数（不过见 Davis 2005, pp. 171–172；关于第三行星定律特别见 Stephenson 1987）[^davis-2005][^stephenson-1987]。作为第三定律的推论：行星绕太阳一周所需的时间，随它离得更远、轨道半径更长而显著增加。例如土星的恒星周期接近 30 年，而水星绕太阳一周只需不到 88 天。就宇宙论的历史而言，重要的是讲清楚：第三定律实现了开普勒对哥白尼世界观之*系统性*表象与辩护的追求——在其中，行星并非彼此绝对独立，而是被整合进一个和谐的世界体系。
