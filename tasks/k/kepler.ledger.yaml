  - id: 64
    kind: body
    source: |-
      Besides psychology and gnoseology, the other main spectrum of questions Kepler deals with in Book 4 is his theory of “aspects”, i.e., astrology (HM, IV, Cap. 4–7), a further field of application of his psychology and further evidence of the role of geometry in his philosophy. The “aspects”, i.e., the angles between the planets, Moon and Sun, are all he wishes to save from the old astrology, which he harshly criticizes; for the aspects are or can be reduced to geometrical structures, the archetypes, which can be recognized by the soul. According to Kepler, there is no ‘mechanical influence’ of the heavens: stars and constellations are not relevant in his astrology. Nevertheless, Kepler devoted considerable effort to determining the size of the stars and their role within his Copernican astronomy (see Graney 2019)[^graney-2019], while maintaining, however, that the astrological configuration of the planets influences events on Earth and human life. Rather, both the Earth and human beings, ultimately, like all other living entities, are provided with a soul in which the geometrical archetypes are present. By the formation of an aspect in the heavens, symmetry arises and stimulates the soul of the Earth or of human beings. “The Earth,” Kepler writes, responds to “what the aspects whistle” (KGW 11.2, p. 48; for his astrology see especially Field 1984 and Rabin 1997, Boner 2005 and 2006)[^boner-2005][^boner-2006][^field-1984][^field-1997][^rabin-1997].
    step1: |-
      除心理学与认识论之外，开普勒在第 4 卷中处理的另一主要问题谱系是他的“方位相”理论，即占星学（HM, IV, Cap. 4–7）——他的心理学的又一应用领域，也是几何学在其哲学中作用的又一证据。“方位相”即行星、月亮与太阳之间的角度，是开普勒想从旧占星学中拯救的全部——他对后者作了严厉的批评；因为方位相是、或可以还原为几何结构，即灵魂能够认出的那些原型。照开普勒的看法，不存在天界的“机械影响”：恒星与星座在他的占星学中不起作用。尽管如此，开普勒为确定恒星的大小及其在哥白尼天文学中的作用付出了相当的努力（见 Graney 2019）[^graney-2019]，同时坚持：行星的占星学构型影响尘世的事件与人的生活。毋宁说，地球与人类——最终与所有其他生命实体一样——都被赋予一个灵魂，几何原型即在灵魂之中。当天空中形成一个方位相时，对称性产生，刺激地球或人的灵魂。开普勒写道：“地球”回应“方位相所吹奏的调子”（KGW 11.2, p. 48；关于他的占星学特别见 Field 1984 与 Rabin 1997, Boner 2005 与 2006）[^boner-2005][^boner-2006][^field-1984][^field-1997][^rabin-1997]。
