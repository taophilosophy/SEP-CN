      Contrary to Tycho and Kepler, Ursus held a fictionalist position in astronomy. Yet in the very beginning of his work *De hypothesibus*, Ursus makes a clear declaration about the nature of astronomical theories, which is very similar to the approach suggested by Osiander in his forward to Copernicus’ *De revolutionibus*: a hypothesis is a “fictitious supposition”, introduced just for the sake of “saving the motions of the heavenly bodies” and to “calculate them” (trans. Jardine 1988, p. 41)[^jardine-1988]
    step1: |-
      与第谷和开普勒相反，乌尔苏斯在天文学中持一种虚构主义的立场。然而，乌尔苏斯在其著作《论假说》的一开头就对天文学理论的性质作出了清晰的声明，与奥西安德尔在哥白尼《天球运行论》导言中提示的进路非常相似：假说是一种“虚构的设定”，引入它只是为了“拯救天体的运动”并“计算它们”（英译 Jardine 1988, p. 41）[^jardine-1988]
