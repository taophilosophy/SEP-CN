      Many of Kepler’s thoughts about epistemology can be found in his *Defense of Tycho against Ursus* or *Contra Ursum* (=CU), a work which emerged from a polemical framework, the plagiarism conflict between Nicolaus Raimarus Ursus (1551–1600) and Tycho Brahe: causality and physicalization of astronomical theories, the concept and status of astronomical hypotheses, the polemic “realism-instrumentalism”, his criticism of skepticism in general, the epistemological role of history, etc. It is one of the most significant works ever written on this subject and is sometimes compared with Bacon’s *Novum organum* and Descartes’ *Discourse on Method* (Jardine 1988, p. 5; for an excellent new edition and complete study of this work see Jardine / Segonds 2008)[^jardine-1988][^jardine-2008].
    step1: |-
      开普勒关于认识论的许多思想见于其《为第谷辩护驳乌尔苏斯》或《驳乌尔苏斯》（＝*CU*）。这部著作诞生于一个论战性的框架：尼古劳斯·莱马鲁斯·乌尔苏斯（1551–1600）与第谷·布拉赫之间的剽窃冲突。其议题包括：天文理论的因果性与物理化、天文学假说的概念与地位、“实在论-工具论”的论战、他对一般怀疑论的批评、历史的认识论作用等等。它是关于这一主题所写过的最有意义的著作之一，有时被与培根的《新工具》和笛卡尔的《谈谈方法》相提并论（Jardine 1988, p. 5；关于这部著作的优秀新版与完整研究，见 Jardine / Segonds 2008）[^jardine-1988][^jardine-2008]。
