      在文艺复兴对正多面体的普遍兴趣之中，开普勒特别关心的是它们在解决一个宇宙论问题——哥白尼体系的实在性（见下文第 5 节）——上的应用。为实现这一目标，他早在 *MC* 中就引入了多面体假说，在那里他为哥白尼体系寻找一种“先天”的奠基（见 Aiton 1977, Di Liscia 2009）[^aiton-1977][^di-2009]。这种进路的背景似乎是：按照开普勒的看法，“后天”的道路——哥白尼本人走的正是这条路——无法导向对新世界体系实在性的必然肯定，只能导向一个盖然的、因而是“工具论的”表象，把它当作计算装置。这就是对哥白尼的“奥西安德尔”或“维滕贝格诠释”，开普勒不仅在 *MC* 中、后来还在 *AN* 中直接攻击了它（见 Westman 1972, 1975 与 2011）[^westman-1972]。在 *MC* 中，他声称找到了以下三个主要问题的答案：1）行星的数目；2）轨道的大小，即距离；3）行星在轨道中的速度。借助多面体假说（见图 1），开普勒对第一个问题找到了决定性而简洁的答案：把多面体内接于承载行星的诸球之间，人们必然止步于包围立方体的土星之球——再没有多面体可内接，而按照文艺复兴与现代天文学的标准情形，也再没有行星可由诸球承载。对论证的一致性而言，绝对决定性的一点是：假说的必然性由如下事实保证——它已经作为数学演示存在（欧几里得《原本》第十三卷命题 18 之后的附录），据此只有五种正多面体（对传统而言即“柏拉图立体”）。对第二与第三个问题，答案当然不像第一个那样明显。然而开普勒能够表明：由五种正多面体的几何模型导出的距离，与哥白尼体系的吻合远胜于与托勒密体系的吻合。第三个问题的回答还需要引入一个来自太阳、一直延伸到宇宙最外端的 power（力）的概念（见 Stephenson 1987, pp. 9–20）[^stephenson-1987]。
