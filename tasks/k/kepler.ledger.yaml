      在数学相关的哲学问题上，普罗克洛与柏拉图是开普勒最重要的灵感来源；但他并不总把柏拉图与亚里士多德看作完全对立，因为后者——照开普勒的诠释——也接受“数学实体的某种存在”（KGW 14, let. N° 226, p. 265；见 Peters, p. 130）。开普勒在很大程度上把他在 *HM* 中的数学研究理解为欧几里得《几何原本》的延续，尤其是第十卷对无理量的分析。他在此阐发的核心概念是“可构造性”。照开普勒的看法，每一门知识原则上都必须可还原为几何学，才能被承认为严格意义上的知识（不过正如 *AN* 所强调的，就物理学而言，这一条件只是必要的而非充分的）。于是，他多年来在占星学中精心阐述的新原理都是几何的原理。类似的情况也出现在和声的基本概念上——经开普勒之手，它们可以被还原为几何学。当然，并非每一个几何命题都同等重要、同等根本。对开普勒而言，特别根本的几何实体、原理与命题是那些能在经典意义上构造出来的东西，即只使用直尺（不带刻度）与圆规。在此基础上，又有按不同“可知性”（*scibilitas*）程度的进一步概念——它始于圆及其直径。开普勒再次在他的宇宙论与神学哲学的框架内理解这一点：几何学、尤其是几何上可构造的实体，比其他种类的知识有更高的意义，因为上帝用它们来描绘并创造这个完美和谐的世界。照这一视角，显然开普勒为数学辩护的是一种柏拉图主义的构想；他不能接受亚里士多德的抽象理论，也无法接受代数——至少照他所理解的代数。例如，有些图形无法“几何地”构造出来，尽管它们常被当作可靠的几何知识。最好的例子也许是七边形：这个图形无法在圆外描述，而在圆内它的边当然有确定的大小，但这是不可知的。开普勒自己说这一点很重要，因为他在这里找到了解释：为什么上帝没有用这类图形来构造世界。因此，他花了许多页讨论这个问题（KGW 6, Prop. 45, pp. 47–56；另见 KGW 9, p. 147）。对一个像开普勒这样的几何学家而言，近似——作为*数学*理论——是一种痛苦而不可靠的前进方式。他拒斥代数的哲学背景，至少部分地在某些基本预设上是亚里士多德式的：几何量是连续量，因此不能用数来处理——数反过来是离散量。但与亚里士多德科学理想的差别仍是一个重要的差别：对亚里士多德而言，算术与几何之间的交叉只在“中间科学”的情形下才被允许；而对开普勒，一切知识都必须还原为它的几何基础。晚近的研究试图表明：开普勒在研究光的折射现象时遵循了“毕达哥拉斯式方法论”的判准。这在他对“同类者为同类者所知”这一原则的应用中显而易见，此外还见于他回避无限、毋宁说给无限量设限的倾向（Cardona Suárez 2016）[^cardona-2016]。
