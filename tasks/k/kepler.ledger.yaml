      Finally, it should be mentioned that a similar significance is assigned to experience and empirical data in Kepler’s harmonic-musical and astrological theories, two fields which are subordinated to his greater cosmological project of HM. For astrology, he uses meteorological data, which he recorded for many years, as confirmation material. This material shows that the Earth, as a whole living being, reacts to the aspects which occur regularly in the heavens (see Boner 2013, pp. 69–99)[^boner-2013]. In his musical theory Kepler was a modern thinker, especially because of the role he gave to experience. As has been noted (Walker, 1978, p. 48), Kepler made acoustic experiments with a monochord long before he wrote his HM. In a letter to Herwart von Hohenburg (KGW 15, ep. 424, p. 450), he describes how he checked the sound of a string at different lengths, establishing in which cases the ear judges the sound to be pleasurable. Kepler does not accept that this limitation is founded on arithmetical speculations, even if this was already assumed by Plato, whom he often follows, and by the Pythagoreans. On the basis of his experiments, Kepler found that there are other divisions of the string that the ear perceives as consonant, i.e., thirds and sixths.
    step1: |-
      最后应当提到，在开普勒的和声-音乐理论与占星理论中，经验与经验数据也被赋予了类似的意义——这两个领域从属于他 *HM* 的更大宇宙论计划。在占星学中，他使用自己记录多年的气象数据作为确证材料。这一材料表明：地球作为一个整体的生命存在者，对天空中规律出现的诸方位相（aspects）作出反应（见 Boner 2013, pp. 69–99）[^boner-2013]。在音乐理论中，开普勒是一位现代思想家，尤其因为他赋予经验的角色的。如已有人指出的（Walker, 1978, p. 48），开普勒早在写作 *HM* 之前很久就用单弦琴做过声学实验。在致赫瓦特·冯·霍恩堡的信中（KGW 15, ep. 424, p. 450），他描述了自己如何检验一根弦在不同长度下的声音，确立在哪些情形下耳朵判断声音为悦耳。开普勒不接受这一限制建立在算术思辨之上——即使这已为柏拉图（他常常追随的）与毕达哥拉斯学派所假定。基于他的实验，开普勒发现弦还有其他的划分也为耳朵感知为谐和，即三度与六度。
