      The first two laws were published initially in AN (1609), although it is known that Kepler had arrived at these results much earlier. His first law establishes that the orbit of a planet is an ellipse with the Sun in one of the foci (see Figure 2). According to the second law, the radius vector from the Sun to a planet P sweeps out equal areas, for instance $SP_1P_2$ and $SP_3P_4$, in equal times. The planet *P* is therefore faster at perihelion, where it is closer to the Sun, and slower at aphelion, where it is farther from the Sun. In accordance with his dynamical approach, Kepler first found the second law and, then, as a further result because of the effect produced by the supposed force, the elliptical path of the planets (for the two first planetary laws see especially Aiton 1973, 1975a, Davis 1992a–e, and 1998a; Donahue 1994; Wilson 1968 and 1972; for Kepler’s system of conics in connection with his optics see the recent study by Del Centina, 2016)[^aiton-1973][^davis-1992a][^donahue-1994][^wilson-1968][^wilson-1972].
    step1: |-
      前两条定律最初发表于 *AN*（1609），尽管众所周知开普勒更早便已得出这些结果。第一定律确立：行星的轨道是一个椭圆，太阳位于其中一个焦点（见图 2）。照第二定律，从太阳到行星 P 的向径在相等的时间里扫过相等的面积，例如 $SP_1P_2$ 与 $SP_3P_4$。因此，行星 P 在近日点更快——那里它离太阳更近；在远日点更慢——那里它离太阳更远。按照他的动力学进路，开普勒先找到第二定律，然后作为假设力的效果所产生的进一步结果，得到行星的椭圆路径（关于前两条行星定律，特别见 Aiton 1973, 1975a, Davis 1992a–e 与 1998a; Donahue 1994; Wilson 1968 与 1972；开普勒与光学相关的圆锥曲线系统见 Del Centina 2016 的近作）[^aiton-1973][^davis-1992a][^donahue-1994][^wilson-1968][^wilson-1972]。
