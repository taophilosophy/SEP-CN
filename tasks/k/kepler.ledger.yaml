    kind: body
    source: |-
      Johannes Kepler (1571–1630) is one of the most significant representatives of the so-called Scientific Revolution of the 16ᵗʰ and 17ᵗʰ centuries. Although he received only the basic training of a “magister” and was professionally oriented towards theology at the beginning of his career, he rapidly became known for his mathematical skills and theoretical creativity. As a convinced Copernican, Kepler was able to defend the new system on different fronts: against the old astronomers who still sustained the system of Ptolemy, against the Aristotelian natural philosophers, against the followers of the new “mixed system” of Tycho Brahe—whom Kepler succeeded as Imperial Mathematician in Prague—and even against the standard Copernican position according to which the new system was to be considered merely as a computational device and not necessarily a physical reality. Kepler’s complete corpus can be hardly summarized as a “system” of ideas like scholastic philosophy or the new Cartesian systems which arose in the second half of the 17th century. Nevertheless, it is possible to identify two main tendencies, one linked to Platonism and giving priority to the role of geometry in the structure of the world, the other connected with the Aristotelian tradition and accentuating the role of experience and causality in epistemology. While he attained immortal fame in astronomy because of his three planetary laws, Kepler also made fundamental contributions in the fields of optics and mathematics. To the little-known facts regarding Kepler’s indefatigable scientific activity belong his efforts to develop different technical devices, for instance, a water pump, which he tried to patent and apply in different practical contexts (for the documents, see KGW 21.2.2., pp. 509–57 and 667–691). To his contemporaries he was also a famous mathematician and astrologer; for his own part, he wanted to be considered a philosopher who investigated the innermost structure of the cosmos scientifically.
    step1: |-
      约翰内斯·开普勒（Johannes Kepler，1571–1630）是所谓十六、十七世纪科学革命最重要的代表人物之一。尽管他只受过“硕士”级别的基础训练，且职业取向在生涯之初是神学，他却很快以数学才能与理论创造力闻名。作为坚定的哥白尼主义者，开普勒能够在不同战线上为新体系辩护：反对仍坚持托勒密体系的旧天文学家，反对亚里士多德主义的自然哲学家，反对第谷·布拉赫的新“混合体系”的追随者——开普勒在布拉格继任其帝国数学家之职——甚至反对标准的哥白尼立场，后者认为新体系只应被当作计算装置，而不必然是物理实在。开普勒的全部著作很难像经院哲学或十七世纪下半叶兴起的笛卡尔式新体系那样被概括为一个观念“系统”。尽管如此，仍可以辨认出两种主要倾向：一种与柏拉图主义相联，把几何学在世界结构中的作用置于优先地位；另一种与亚里士多德传统相联，强调经验与因果性在认识论中的作用。虽然他因三大行星定律在天文学中赢得不朽声名，开普勒在光学与数学领域也做出了根本性贡献。关于开普勒不懈的科学活动，鲜为人知的事实包括：他努力开发不同的技术装置——例如一台水泵——他试图为其申请专利并用于不同的实际场合（文件见 KGW 21.2.2, pp. 509–57 与 667–691）。对他的同时代人而言，他也是有名的数学家与占星学家；就他自己而言，他希望被看作一位以科学方式探究宇宙最深结构的哲学家。
    step2: |-
      约翰内斯·开普勒（Johannes Kepler，1571–1630）是所谓十六、十七世纪科学革命最重要的代表之一。他虽只受过“硕士”级的基础训练，职业取向在生涯之初也偏向神学，却很快以数学才能与理论创造力闻名。作为坚定的哥白尼主义者，开普勒能在多条战线上为新体系辩护：反对仍坚持托勒密体系的旧天文学家，反对亚里士多德主义的自然哲学家，反对第谷·布拉赫之新“混合体系”的追随者——开普勒在布拉格继任其帝国数学家之职——甚至反对标准的哥白尼立场：后者认为新体系只应被当作计算装置，而不必然是物理实在。开普勒的全部著作很难像经院哲学或十七世纪下半叶兴起的笛卡尔式新体系那样被概括成一个观念“系统”。尽管如此，仍可辨认出两种主要倾向：一种接续柏拉图主义，把几何学在世界结构中的作用置于优先；另一种接续亚里士多德传统，强调经验与因果性在认识论中的分量。他因三大行星定律在天文学中赢得不朽声名，但在光学与数学领域同样做出了根本性贡献。开普勒不懈的科学活动中还有一些鲜为人知的事实：他努力开发不同的技术装置——例如一台水泵——试图申请专利并用于多种实际场合（文件见 KGW 21.2.2, pp. 509–57 与 667–691）。在同时代人眼中，他也是有名的数学家与占星学家；而就他自己的期望而言，他是一位以科学方式探究宇宙最深结构的哲学家。
