      Kepler mastered, like the best scientists, the most complicated technical issues, especially in astronomy, but he always emphasized his philosophical, even theological, approach to the questions he dealt with: God manifests himself not only in the words of the Scriptures but also in the wonderful arrangement of the universe and in its conformity with the human intellect. Thus, astronomy represents for Kepler, if done philosophically, the best path to God (see Hübner 1975; Methuen 1998 and 2009; Jardine 2009, Kirby 2019)[^hübner-1975][^jardine-2009][^kirby-2019][^methuen-1998][^methuen-2009]. As Kepler at the core of his greatest astronomical work confesses (AN, Part II, chap. 7, KGW 6, p. 108, Engl. trans., p. 183), at the beginning of his career he “was able to taste the sweetness of philosophy … with no special interest whatsoever in astronomy.” And, even in his later work, after having calculated many ephemerides and different astronomical data, Kepler writes in a letter of February 17, 1619 to V. Bianchi: “I also ask you, my friends, that you do not condemn me to the treadmill of mathematical calculations; allow me time for philosophical speculation, my only delight!” (KGW 17, let. N° 827, p. 327, lin. 249– 51).
    step1: |-
      与最优秀的科学家一样，开普勒精通最复杂的技术问题，尤其是在天文学中；但他始终强调自己处理问题时的哲学进路，甚至神学进路：上帝不仅显现在《圣经》的话语中，也显现在宇宙的奇妙秩序及其与人类理智的契合之中。因此，对开普勒来说，天文学若以哲学的方式来做，便是通往上帝的最佳道路（见 Hübner 1975；Methuen 1998 与 2009；Jardine 2009；Kirby 2019）[^hübner-1975][^jardine-2009][^kirby-2019][^methuen-1998][^methuen-2009]。正如开普勒在其最伟大的天文学著作的核心处所坦承的（AN 第二编第 7 章，KGW 6, p. 108；英译 p. 183），生涯之初他“品尝到哲学的甘美……对天文学没有任何特别的兴趣”。而即使在后期著作中——在计算了众多星历表与各种天文数据之后——开普勒在 1619 年 2 月 17 日致 V. 比安基的信中写道：“我也请求你们，我的朋友们，不要把我钉在数学计算的踏车上；给我留出哲学思辨的时间吧，那是我唯一的快乐！”（KGW 17, let. N° 827, p. 327, lin. 249–51）。
