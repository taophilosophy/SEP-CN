      One of the most important philosophical aspects of Kepler’s *Astronomia Nova* from 1609 (=AN) is its methodological approach and its causal foundation (see Mittelstrass 1972)[^mittelstrass-1972]. Kepler was sufficiently conscious of the change of perspective he was introducing into astronomy. Hence, he decided to announce this in the full title of the work: *Astronomia Nova, Aitiologetos, seu physica coelestis, tradita commentariis de motibus stellae Martis. Ex observationibus G. V. Tychonis Brahe*: *New Astronomy Based upon Causes or Celestial Physics Treated by Means of Commentaries on the Motions of the Star Mars from the observations of Tycho Brahe* … (trans. Donahue). In the introduction to AN Kepler insists on his radical change of view: his work is about physics, not pure kinematical or geometrical astronomy. “Physics”, as in the traditional, Aristotelian understanding of the discipline, deals with the causes of phenomena, and for Kepler that constitutes his ultimate approach to deciding between rival hypotheses (AN, Engl. trans., p. 48; see Krafft 1991)[^krafft-1991]. On the other hand, since his celestial physics uses not only geometrical axioms but also other, non-mathematical axioms, the knowledge obtained often has a kernel of guesswork.
    step1: |-
      开普勒 1609 年《新天文学》（＝*AN*）最重要的哲学方面之一，是它的方法论进路与因果奠基（见 Mittelstrass 1972）[^mittelstrass-1972]。开普勒对自己引入天文学的观点转变有足够清醒的意识，因此决定在全书的标题中宣告这一点：《新天文学，因果论，或天界物理学，以关于火星运动的评注呈献，据第谷·布拉赫的观测》：*Astronomia Nova, Aitiologetos, seu physica coelestis, tradita commentariis de motibus stellae Martis. Ex observationibus G. V. Tychonis Brahe*（英译 Donahue：*New Astronomy Based upon Causes or Celestial Physics Treated by Means of Commentaries on the Motions of the Star Mars from the observations of Tycho Brahe*……）。在 *AN* 的导言中，开普勒坚持他的根本观点转变：他的著作关乎物理学，而非纯粹运动学的或几何学的天文学。“物理学”——按这门学科的传统、亚里士多德式的理解——处理现象的原因；对开普勒而言，这正是他在竞争假说之间作出裁决的最终进路（AN 英译 p. 48；见 Krafft 1991）[^krafft-1991]。另一方面，由于他的天界物理学不仅使用几何公理，还使用其他非数学的公理，所获得的认识常常带有猜测的成分。
