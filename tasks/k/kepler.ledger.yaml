      The situation changed completely when Kepler came into contact at Prague with Tycho’s observations (which, as Kepler often reports, were seldom at his disposal). However, a change of attitude is evident in AN, where he used Tycho’s observations without restriction (which is something he makes clear in the work’s title). In part 2 (chap. 7–21), he presents the “vicarious hypothesis”, which in the end he refutes. This hypothesis represents the best result which can be reached within the limits of traditional astronomy. This works with circular orbits and with the supposition that the motion of a planet appears regular from a point on the lines of apsides. Against the traditional method, here, Kepler does not cut the eccentricity into equal parts but leaves the partition open. To check his hypothesis, he needs observations of Mars in opposition, where Mars, the Earth, and the Sun are at midnight on the same line. From Tycho, he “inherited” ten such observations between the years 1580 and 1600, and to them he added another two for 1602 and 1604. In chapters 17–21, Kepler carries out an observational and computational check of his vicarious hypothesis. On the one hand, he points out that this hypothesis is good enough, since the variations of the calculated positions from the observed positions fall within the limits of acceptability (2 minutes of arc). In fact, Kepler presents this hypothesis as the best hypothesis which can be proposed within the framework of a “traditional astronomy”, as opposed to his new astronomy, which he will offer in the following parts of the work. On the other hand, this hypothesis can be falsified if one takes the observations of the latitudes into consideration. Further calculations with these observations produce a difference of eight minutes, something that cannot be assumed because the observations of Tycho are reliable enough. Kepler’s famous sentence runs: “these eight minutes alone will have led the way to the reformation of all of astronomy” (AN, KGW 3, p. 286; Engl. trans., p. 286). There seems to be agreement that Kepler’s AN contains the first explicit consideration of the problem of observational error (for this question see Hon 1987 and Field 2005)[^field-2005][^hon-1987].
    step1: |-
      当开普勒在布拉格接触到第谷的观测时（据他常说的，这些观测很少在他手边），情况完全改观。然而，态度的转变在 *AN* 中显而易见：他不受限制地使用第谷的观测（这一点他在书名中已经讲明）。在第 2 部分（第 7–21 章），他给出“替代假说”——最终又被他自己驳倒的假说。这一假说代表传统天文学的限度内所能达到的最好结果：它使用圆轨道，并假定行星的运动从拱线上的某点看是规则的。与传统方法相反，开普勒在这里不把偏心率等分，而是让划分保持开放。为检验这一假说，他需要火星在冲日的观测——火星、地球与太阳在午夜位于同一条线上。他从第谷那里“继承”了 1580 至 1600 年间的十次这样的观测，又补上 1602 与 1604 年的两次。在第 17–21 章，开普勒对替代假说进行了观测与计算的双重检验。一方面，他指出这一假说已经足够好，因为计算位置与观测位置的偏差落在可接受的限度之内（2 角分）。事实上，开普勒把这一假说呈现为“传统天文学”框架内所能提出的最好假说——与他在本书后面部分将要提出的新天文学相对。另一方面，如果考虑黄纬的观测，这一假说可以被证伪。用这些观测作进一步计算，产生 8 角分的差——这不能被接受，因为第谷的观测足够可靠。开普勒的名言是：“仅仅这 8 分就已为改革全部天文学指明了道路”（AN, KGW 3, p. 286；英译 p. 286）。人们似乎一致同意：开普勒的 *AN* 包含了对观测误差问题的第一次明确处理（关于这一问题见 Hon 1987 与 Field 2005）[^field-2005][^hon-1987]。
