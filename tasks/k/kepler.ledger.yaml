      The next central question directly concerns gnoseology, for Kepler gives a psychological account of the path followed by sensible things into the mind. He resumes the scholastic species theory: immaterial species radiate from the sensible things and affect the sense organs by acting firstly on the “forecourts” and then on the internal functions (for the notion of ‘species’ in Kepler see Rabin 2005, which has found both favorable and critical reception in the literature)[^rabin-2005]. They arrive at the imagination and from there go over to the *sensus communis*, so that, according to the traditional teaching, the sensible information received is now able to be processed and used in statements. From here onwards, the sensible things are “preserved in the memory, brought forth by recollection, [and] distinguished by the higher faculty of the soul” (Caspar 1993, p. 269, cf. KGW 6, p. 214, lines 18–23; Engl. trans., p. 293)[^caspar-1993]. While harmony arises as an activity of the soul/mind consisting in relating quantitatively, Kepler adds, taking over the Aristotelian doctrine of categories, that harmony is a “qualitative relation” as well, involving the “quality of shape, being formed from the regular figures”, which provides the grounds for comparison (KGW 6, p. 216, lines 37–41; Engl. trans., p. 296). If this is how “things”, i.e., sensible entities, find their way into the soul in order to be compared, it by no means represents—as Kepler admitted—a sufficient explanation of how non-sensible things, i.e., mathematical entities, find their way into the mind. How do they come into the soul? Kepler accepted Aristotle’s criticism of Pythagorean philosophy concerning numbers: both Kepler and Aristotle are convinced that numbers constitute ontologically a lower class within mathematical entities (for Kepler, they are derived from geometrical entities). Nevertheless, Aristotle’s philosophy is insufficient to grasp the essence of mathematics. By aligning himself with Proclus, from whom he quotes a long passage of his *Commentary on Euclides*, Kepler defends Plato’s theory of *anamnêsis* against Aristotle’s doctrine of the *tabula rasa*. His discussion lies at the origin of the classical debate between empiricism and rationalism which was to dominate the philosophical scene for generations to come. A connection with idealism is, of course, apparent (see, for instance, Caspar 1993, Engl. trans., p. 269)[^caspar-1993], and it is a fact that Kepler was positively received within German Idealism of the 19ᵗʰ century (Schwaetzer 2016, esp. 217–19)[^schwaetzer-2016]. Historically, however, it seems to be more accurate to link his position with the philosophical tradition of St. Augustine.
    step1: |-
      下一个核心问题直接关乎认识论，因为开普勒对可感事物进入心灵的路径给出了一种心理学说明。他重述了经院哲学的种相理论：非物质的种相从可感事物中辐射出来，作用于感官——首先作用于“前庭”，继而作用于内部官能（关于开普勒的“种相”概念见 Rabin 2005，该说在文献中既有支持也有批评）[^rabin-2005]。它们抵达想象，再从那里转入*共通感*；于是按传统教义，所接受的感性信息现在能够被加工并被用于陈述。从这里开始，可感事物“被保存在记忆中，由回忆唤起，［并］被灵魂的更高官能所分辨”（Caspar 1993, p. 269；参 KGW 6, p. 214, lines 18–23；英译 p. 293）[^caspar-1993]。和谐作为灵魂/心灵的一种活动产生，它在于定量地建立关系；开普勒补充道——接过亚里士多德的范畴学说——和谐也是一种“性质的关系”，涉及“形状的质，它由规则的图形形成”，后者为比较提供根据（KGW 6, p. 216, lines 37–41；英译 p. 296）。如果“事物”即可感实体就是这样找到进入灵魂之路以便被比较的，那么——正如开普勒所承认的——它绝不构成对非可感事物即数学实体如何进入心灵的充分解释。它们如何进入灵魂？开普勒接受了亚里士多德对毕达哥拉斯哲学关于数的批评：开普勒与亚里士多德都相信，数在本体论上构成数学实体中较低的一个类（对开普勒而言，它们派生自几何实体）。尽管如此，亚里士多德的哲学不足以把握数学的本质。通过把自己与普罗克洛对齐——他从后者的《欧几里得几何原本评注》中引用了一大段——开普勒为柏拉图的*回忆说*（*anamnêsis*）辩护，反对亚里士多德的*白板说*。他的讨论位于经验主义与理性主义之间经典论争的源头，这场论争将在随后几代人中支配哲学舞台。与唯心论的联系当然显而易见（例如见 Caspar 1993 英译 p. 269）[^caspar-1993]；而事实上，开普勒在十九世纪德意志唯心论内部得到了积极的接受（Schwaetzer 2016, esp. 217–19）[^schwaetzer-2016]。然而从历史上看，把他的立场与圣奥古斯丁的哲学传统联系起来似乎更为准确。
