      In pursuit of an accurate printer for the *Tabulae Rudolphinae*, he moved to Ulm near the end of 1626 and remained there until the end of 1627. In July 1628 he went to Sagan to enter the service of Albrecht von Wallenstein (1583–1634). He died on November 15, 1630 at Regensburg, where he was to present his financial claims before the imperial authorities (for Kepler’s life, Caspar’s biography (1993) is still the best work. KGW 19 contains biographically relevant documents. For a brief overview of Kepler’s ideas and achievements in a broadly biographical context, see Osterhage 2020).
    step1: |-
      为《鲁道夫星表》寻找一家可靠的印刷商，他于 1626 年末前后迁居乌尔姆，并待到 1627 年底。1628 年 7 月他前往萨根，进入阿尔布雷希特·冯·华伦斯坦（1583–1634）帐下效力。1630 年 11 月 15 日，他在雷根斯堡去世——他原要去那里向帝国当局陈述自己的财务诉求（关于开普勒的生平，卡斯帕尔的传记（1993）至今仍是最佳著作；KGW 19 收有与生平相关的文献。关于开普勒思想与成就的简要概览及其传记语境，见 Osterhage 2020）。
