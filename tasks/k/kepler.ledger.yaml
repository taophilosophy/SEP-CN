      This kind of speculation also belongs to the basic principles of Kepler’s philosophical optics. In Chapter 1 of APO (“On the Nature of Light”), Kepler gives a new account of this “Trinitarian Cosmogony.” As he admits in a letter to Thomas Harriot (1560–1621), his approach here is more theological than optical (KGW 15, let. 394, p. 348, lin. 18). Similar to his speculations in MC, Kepler explains again the symmetry between God and the Creation, but now he goes slightly beyond the limits of a theologico-geometrical reflection. Firstly, he seems to assume that the bodies of the world were provided in the Creation with some powers which enable them to exceed their geometrical limits and to act on other bodies (magnetic power is a good example of this). Secondly, the principle of symmetry introduced into matter constitutes “the most excellent thing in the whole corporeal world, the matrix of the animate faculties, and the chain linking the corporeal and spiritual world” (APO, Engl. trans., p. 19). Thirdly, as expressed by Kepler in a wonderful, long Latin sentence, with multiple subordinations, this principle “has passed over into the same laws (*in leges easdem*) by which the world was to be furnished” (ibid., p. 20; the original passage is in KGW 2, p. 19: the marginal note in the edition is “*lucis encomium*”). Finally, these reflections are concluded with a remark, in which—as with Copernicus, Marsilio Ficino, and others—the central position of the Sun is legitimated because of its function in spreading light and, indirectly, life. Similar speculations are still present in EAC (KGW 7, pp. 47–48 and 267). It is also worth noting that these speculations are of vital importance to the special way in which Kepler conceived of astrology (see, for instance, *De fundamentis astrologiae certioribus* with Engl. trans. and commentary in Field 1984)[^field-1984].
    step1: |-
      这类思辨同样属于开普勒哲学光学的基本原则。在 *APO* 第 1 章（“论光的性质”）中，开普勒对这一“三一创世论”给出了新的论述。正如他在致托马斯·哈里奥特（1560–1621）的信中所承认的，他在此的进路更是神学的而非光学的（KGW 15, let. 394, p. 348, lin. 18）。与他在 *MC* 中的思辨类似，开普勒再次解释上帝与创造之间的对称性，但这次他稍稍越出了神学-几何学反思的界限。首先，他似乎假定世界的物体在创世时被赋予了一些能力，使它们能够超出其几何界限并作用于其他物体（磁力就是一个好例子）。其次，引入物质中的对称性原则构成了“整个形体世界中最卓越的东西、诸有生命官能的母体、连接形体世界与精神世界的链条”（APO 英译 p. 19）。第三，正如开普勒在一个出色的、多重从句的冗长拉丁句中所表达的，这一原则“已转入世界赖以被装备起来的同一批法则之中”（*in leges easdem*）（同上 p. 20；原文见 KGW 2, p. 19：该版边注为“*lucis encomium*”）。最后，这些反思以下述评论作结：与哥白尼、马尔西利奥·费奇诺等人一样，太阳的中心位置因其散播光并间接散播生命的作用而得到辩护。类似的思辨在 *EAC* 中仍然可见（KGW 7, pp. 47–48 与 267）。同样值得注意的是：这些思辨对开普勒构思占星学的特殊方式至关重要（例如《论占星学更可靠的基础》，英译与评注见 Field 1984）[^field-1984]。
