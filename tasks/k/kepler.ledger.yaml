      There is probably no such thing as “Kepler’s philosophy” in any pure form. Nevertheless, many attempts to deal with the “philosophy of Kepler” have been made, all of which are very valuable in their own way. Some studies have concentrated on a particular text (see, for instance, Jardine 1988, for the *Defense of Tycho against Ursus*)[^jardine-1988], or have followed some particular ideas of Kepler over a longer period of his life and scientific career (see, for instance, Martens 2000, on Kepler’s theory of the archetypes)[^martens-2000]. Others have tried to determine from a philosophical point of view his place in the development of the astronomical revolution from the 15ᵗʰ to the 17ᵗʰ centuries (Koyré 1957 and 1961)[^koyré-1957][^koyré-1961] or in the more general context of the scientific movement of the 17ᵗʰ century (Hall, 1963 and especially Burtt, 1924). Still others have discussed a long list of philosophical principles operating in Kepler’s scientific world, and have claimed to have found, by means of such an analysis, compelling evidence for the interaction between science, philosophy, and religion (Kozhamthadam, 1994). If, in the particular case of Kepler, philosophy is immediately related to astronomy, mathematics and, finally, “cosmology” (a notion which arises much later), the core of these speculations is to be sought in the spectrum of problems with which he dealt in his *Mysterium Cosmographicum* and *Harmonice Mundi* (on this topic, Field 1988 is one of the most representative works on Kepler)[^field-1988]. In addition, because of the particular circumstances of his life and his fascinating personality and genius, the literature on Kepler is extremely wide-ranging, covering a spectrum from literary pieces like Max Brod’s *Tycho Brahes Weg zu Gott* (1915)—though still not free from mistakes concerning Kepler—to general introductions in the genre of historical novels, and even fictional stories and charlatanry on astrology or, running for some years now, portraying him as the assassin of Tycho Brahe. However, according to recent reports, it is still a matter of controversy whether Tycho was assassinated at all (see the [report at phys.org](https://phys.org/news/2012-11-mercury-poisoning-tycho-brahe-death.html)).
    step1: |-
      恐怕不存在任何纯粹形态的“开普勒哲学”。尽管如此，处理“开普勒的哲学”的尝试已有许多，各自都很有价值。一些研究集中于某一部文本（例如关于《为第谷辩护驳乌尔苏斯》的研究，见 Jardine 1988）[^jardine-1988]，或追踪开普勒某些特定思想在其生命与科学生涯较长时段中的演变（例如关于开普勒原型论的Martens 2000）[^martens-2000]。另一些研究试图从哲学角度确定他在十五至十七世纪天文学革命的发展中（Koyré 1957 与 1961）[^koyré-1957][^koyré-1961]，或在十七世纪科学运动这个更宽泛语境中（Hall 1963，尤其是 Burtt 1924）的位置。还有一些研究讨论了在开普勒科学世界中起作用的一长串哲学原则，并声称通过这种分析找到了科学、哲学与宗教之间相互作用的令人信服的证据（Kozhamthadam 1994）。如果就开普勒这个特例而言，哲学与天文学、数学以及最后与“宇宙论”（一个晚得多的概念）直接相关，那么这些思辨的核心就应到他在《宇宙的奥秘》与《世界的和谐》中处理的问题谱系中寻找（就这一主题，Field 1988 是开普勒研究中最有代表性的著作之一）[^field-1988]。此外，由于他一生的特殊际遇、迷人的个性与天才，关于开普勒的文献极为驳杂：从马克斯·布罗德《第谷·布拉赫走向上帝之路》（1915）这样的文学作品——尽管其中涉及开普勒处仍不免错误——到历史小说体裁的一般性介绍，甚至还有虚构故事和关于占星学的江湖骗术，以及多年来把他描绘成第谷·布拉赫刺客的作品。不过据近来的报告，第谷究竟是否被谋杀仍有争议（见 phys.org 上的报告：https://phys.org/news/2012-11-mercury-poisoning-tycho-brahe-death.html）。
    step2: |-
