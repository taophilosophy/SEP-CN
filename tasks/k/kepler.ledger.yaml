      Following his approach in MC and anticipating the opening pages of his later AN (see particularly AN, II.21: “Why, and to what extent, may a false hypothesis yield the truth?” Engl. trans., pp. 294–301), Kepler addresses the question of Copernicanism and its reception by thinkers such as Osiander, who emphasized that the truth of astronomical hypotheses cannot necessarily be deduced from the correct prediction of astronomical facts. According to this interpretation, Copernican hypotheses are not necessarily true even if they are able to save the phenomena, otherwise one would commit a *fallacia affirmationis consequentis*. However, according to Kepler, “this happens only by chance and not always, but only when the error in the one proposition meets another proposition, whether true or false, appropriate for eliciting the truth” (trans. Jardine, p. 140). To be noted is that, as Jardine (2005, p. 137) has pointed out, the modern scientific realist departs from a real independent world, while Kepler’s notion of truth presupposes that neither nature nor the human mind are independent of God’s mind (Jardine 2005, p. 137)[^jardine-2005].
    step1: |-
      开普勒延续他在 *MC* 中的进路，并预示了后来 *AN* 的开篇几页（尤其见 AN II.21：“为什么以及在何种程度上，一个假假说可以产生真理？”英译 pp. 294–301），处理了哥白尼主义及其被奥西安德尔一类思想家接受的问题——这些人强调：天文学假说的真，不能必然地从对天文事实的正确预测中推出。照这种诠释，哥白尼假说即便能够拯救现象，也未必为真，否则人们就会犯下“肯定后件的谬误”（*fallacia affirmationis consequentis*）。然而照开普勒的看法，“这只是碰巧发生，并非总是如此；只有当某一命题中的错误遇上另一条适合引出真理的命题（无论真假）时，才会如此”（英译 Jardine, p. 140）。值得注意的是，正如贾丁（2005, p. 137）所指出的：现代的科学实在论者从一个实在的独立世界出发，而开普勒的真理概念预设了自然与人类心智都不独立于上帝的心智（Jardine 2005, p. 137）[^jardine-2005]。
