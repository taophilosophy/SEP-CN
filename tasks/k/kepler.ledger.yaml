      A general presentation of Kepler’s philosophical attitude and principles is not complete without reference to his link to the world of experience. For, despite his mainly theoretical approach in the natural sciences, Kepler often emphasized the significance of experience and, in general, of empirical data. In his correspondence there are many remarks about the significance of observation and experience, as for instance in a letter to Herwart von Hohenburg from 1598 (KGW 13, let. N° 91, lines 150–152) or from 1603 to Fabricius (KGW 14, let. N° 262, p. 191, lines 129–130), to mention only two of his most important correspondents. Looking for empirical support for the Copernican system, Kepler compares different astronomical tables in his MC, and in AN he makes extensive use of Tycho’s observational treasure trove. In MC (chapter 18) he quotes a long passage from Rheticus for the sake of rhetorical support when, as was the case here, the data of the tables he used did not fit perfectly with the calculated values from the polyhedral hypothesis. In this passage, the reader learns that the great Copernicus, whose world system Kepler defends in MC, said one day to Rheticus that it made no sense to insist on absolute agreement with the data, because these themselves were surely not perfect. After all, it is questionable whether Kepler, using for instance the *Prutenic Tables* (1551) of Erasmus Reinhold (1511–1553), had access to complete and correct empirical information to confirm the Copernican hypothesis in grand style, as he claimed (for an analysis of Reihold’s tables and their influence see Gingerich 1993, pp. 205–255)[^gingerich-1993].
    step1: |-
      对开普勒哲学态度与原则的一般性阐述，若不提他与经验世界的联系便不完整。因为尽管他在自然科学中的进路以理论为主，开普勒仍常常强调经验——以及一般而言经验数据——的重要性。在他的通信中有许多关于观察与经验之意义的评论，例如 1598 年致赫瓦特·冯·霍恩堡的信（KGW 13, let. N° 91, lines 150–152），或 1603 年致法布里修斯的信（KGW 14, let. N° 262, p. 191, lines 129–130）——这里只提他最重要的两位通信者。为哥白尼体系寻找经验支持，开普勒在 *MC* 中比较了不同的星表；在 *AN* 中，他大量使用第谷的观测宝库。在 *MC*（第 18 章）中，当所用星表的数据与多面体假说算出的数值不完全吻合时——此处正是如此——他引用雷蒂库斯的一段长文以作修辞上的支持。在这段文字中，读者得知：开普勒在 *MC* 中所辩护的世界体系的伟大创立者哥白尼，曾有一天对雷蒂库斯说，坚持与数据绝对一致是没有意义的，因为数据本身肯定不完美。毕竟，这是可疑的：开普勒使用例如伊拉斯谟·莱因霍尔德（1511–1553）的《普鲁士星表》（1551），是否拥有充分而正确的经验信息来大张旗鼓地确认哥白尼假说——如他所宣称的那样（关于莱因霍尔德星表及其影响的分析，见 Gingerich 1993, pp. 205–255）[^gingerich-1993]。
