      The focus of the epistemological issues could be ranked *mutatis mutandi* with modern discussion surrounding the scientific status of astronomical theories (however, as Jardine has pointed out, it would be sounder to read Kepler’s CU more as a work against skepticism than in the context of the modern realism/instrumentalism polemic). For Pierre Duhem (1861–1916), for instance, the position of Andreas Osiander, which was adopted by Ursus and which was, according to Duhem, naively criticized by Kepler in his MC, represents the modern approach known as “instrumentalism”. According to this epistemological position, held by Duhem himself, scientific theories are not to be closely linked to the concepts of truth and falsehood. Hypotheses and scientific laws are nothing more than “instruments” for describing and predicting phenomena (seldom for explaining them). The aim of physical theories is not to offer a causal explanation or to study the causes of phenomena, but simply to represent them. In the best-case scenario, theories are able to order and classify what is decisive for their predictive capacity (Duhem 1908, 1914)[^duhem-1908].
    step1: |-
      这些认识论议题的焦点，可以 mutatis mutandis 地与现代围绕天文学理论之科学地位的讨论对应排列（不过，正如贾丁指出的，更稳妥的做法是把开普勒的 *CU* 更多地读作一部反对怀疑论的著作，而不是放在现代实在论/工具论论战的语境中）。例如，对皮埃尔·迪昂（1861–1916）而言，安德烈亚斯·奥西安德尔的立场——乌尔苏斯采纳了它，而按迪昂的看法开普勒在 *MC* 中对它作了天真的批评——代表着现代所谓的“工具主义”进路。照这一认识论立场（迪昂本人即持此立场），科学理论不应与真理和虚假的概念紧密相联。假说与科学定律不过是描述与预测现象的“工具”（很少用于解释现象）。物理学理论的目的不是提供因果解释或研究现象的原因，而只是表象它们。在最好的情形下，理论能够整理并分类那些对它们的预测能力至关重要的东西（Duhem 1908, 1914）[^duhem-1908]。
