      Two questions are intensively discussed by modern specialists. Firstly, to what extent is the attribution of a mechanistic approach to Kepler justified? Secondly, how should one determine his place in the history of sciences, especially in the field of optics: do the main lines of thought in Kepler’s optics indicate a *continuity* or rather a *rupture* with tradition? There are well–grounded arguments for different positions on both questions. For Crombie (1967, 1991) and Straker, Kepler develops a mechanical approach, which can be particularly appreciated in his explanation of vision using the model of the *camera obscura*. Besides this, Straker stresses that Kepler’s basic mechanicism is also powerfully assisted by his conception of light as a non-active, passive entity. In addition, the concept of motion and the explanations using the model of the balance are indicative of a commitment to mechanicism (Straker 1970, pp. 502–3)[^straker-1970]. On the contrary, Lindberg (1976a), who supports the “continuity side” of the dispute, has quite convincingly showed that, for Kepler, light has a constructive and active function in the universe, not only in optics but also in astrology, astronomy, and natural philosophy (for Kepler’s criticism of the medieval tradition see also Chen-Morris / Unguru, 2001).
    step1: |-
      两个问题受到现代专家的集中讨论。第一，把一种机械论的进路归于开普勒在多大程度上是正当的？第二，应如何确定他在科学史——尤其光学领域——中的位置：开普勒光学的主要思想路线表明的是与传统的*连续*，还是毋宁说是*断裂*？对这两个问题都存在有充分根据的不同立场。克龙比（1967, 1991）与斯特雷克认为，开普勒发展了一种力学的进路——这在他的视觉解释中用*暗箱*模型可以特别清楚地看到。除此之外，斯特雷克强调：开普勒的基本机械论也得到他把光构想为非主动的、被动实体的有力支持。此外，运动概念与使用天平模型的解释，都表明对机械论的承诺（Straker 1970, pp. 502–3）[^straker-1970]。相反，林德伯格（1976a）支持这场争论的“连续性一方”，他相当有说服力地表明：对开普勒而言，光在宇宙中具有建构性的、主动的功能——不仅在光学中，也在占星学、天文学与自然哲学中（关于开普勒对中世纪传统的批评，另见 Chen-Morris / Unguru, 2001）。
