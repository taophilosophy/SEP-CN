      Beyond his own original talent, it is clear that Kepler was trained in mathematics from his earliest studies at Tübingen. At least officially, his positions at Graz, Prague, Linz, Ulm and Sagan can be characterized as the typical professional occupations of a mathematician in the broadest sense, i.e., including astrology and astronomy, theoretical mechanics and pneumatics, metrology, and every topic that could in some way be related to mathematics. Besides the field of astronomy and optics, where mathematics is ordinarily applied in different ways, Kepler produced original contributions to the theory of logarithms and above all within his favorite field, geometry (especially with his stereometrical investigations. For the medieval proportions theory as a background for Kepler’s logarithms, see Rommevaux-Tani, 2018). Thus, on account of his natural predilection and talent and the importance of mathematics, particularly of geometry, for his thought, it is not surprising to find many different passages in his works where he articulated his philosophy of mathematics. However, Kepler’s principal exposition on this topic is to be found in his HM, a work in which the first two books are purely mathematical in content. As he himself declares, in HM he played the role “not of a geometer in philosophy but of a philosopher in this part of geometry” (KGW 6, p. 20, Engl. trans., p. 14).
    step1: |-
      除了他本人的天赋，显然开普勒从在图宾根求学的最早时期起就接受数学训练。至少在名义上，他在格拉茨、布拉格、林茨、乌尔姆与萨根的职位，都可以刻画为最广义的数学家的典型职业——包括占星学与天文学、理论力学与气体力学、计量学，以及一切能以某种方式与数学相联的题目。除天文与光学这些通常以不同方式应用数学的领域外，开普勒对对数理论、尤其在他最钟爱的领域——几何学（特别是他的立体几何学研究）——做出了原创贡献（关于中世纪比例理论作为开普勒对数的背景，见 Rommevaux-Tani, 2018）。因此，出于他天生的偏好与才能、出于数学——尤其是几何学——对他思想的重要性，在他的著作中找到许多阐明其数学哲学的段落并不令人意外。然而，开普勒对这一主题的主要阐述见于 *HM*——这部著作的前两卷在内容上是纯数学的。正如他自己宣告的：在 *HM* 中他扮演的角色“不是哲学中的几何学家，而是几何学这一部分中的哲学家”（KGW 6, p. 20；英译 p. 14）。
