      Kepler also gave an important place to experience in the field of optics. As a matter of fact, he began his research on optics because of a disagreement between theory and observation, and he made use of scientific instruments he had designed himself (see, for instance, KGW 21.1, p. 244). Recent research on the problem of the *camera obscura* and the “images in the air” shows, however, the limits of a traditional approach to Kepler’s optics following the main current of the history of physics. Rather, his notion of *experimentum* needs to be contextualized within the social practices and epistemological commitments of his time (see Dupré 2008)[^dupré-2008].
    step1: |-
      开普勒在光学领域也给了经验一个重要的位置。事实上，他开始光学研究正是因为理论与观察之间的分歧；他使用自己设计的科学仪器（例如见 KGW 21.1, p. 244）。然而，关于*暗箱*与“空气中的像”问题的晚近研究表明：沿物理学史主流的传统进路处理开普勒光学有其限度。毋宁说，他的 *experimentum*（实验）概念需要被置于他那个时代的社会实践与认识论承诺之中（见 Dupré 2008）[^dupré-2008]。
