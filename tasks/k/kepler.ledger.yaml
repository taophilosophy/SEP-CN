      From a philosophical point of view, Kepler considered the HM to be his main work and the one he most cherished. Containing his third planetary law, this work represents definitively a seminal contribution to the history of astronomy. But he did not reduce his long prepared project to an astronomical investigation—his first thoughts on the notion of “harmony” arose already in 1599, although he did not publish his work until 1619—but instead extensively discussed its mathematical foundations and its philosophical implications, including astrology, natural philosophy and psychology. Thus, Kepler’s third planetary law appears in a context which goes far beyond astronomy and to a great extent takes up again the perspective of his youthful MC. When talking about “harmony” in Kepler, one needs to keep in mind that the background giving its full significance to this notion goes far beyond music theory. Of course, music is involved and plays a determining role – and along with it the corresponding mathematical concepts stemming from the Pythagorean tradition. However, in Kepler “harmony” represents the most general idea, the very core of the world as an ordered whole and, therefore, the ultimate goal to be pursued in his philosophical investigations. Social and political aspects are also included. It is surely not a minor detail that Kepler, on the threshold of the Thirty Years’ War, dedicated his HM to King James I of England “the man whom Kepler believed was best suited to apply its lessons to the most pressing harmony of all: the harmony of church and state” (Rothman 2017, p. 6)[^rothman-2017].
    step1: |-
      从哲学的角度看，开普勒把 *HM* 视为他最主要的、也是他最珍爱的著作。这部包含第三行星定律的著作，无疑是天文学史上开创性的贡献。但他没有把这个酝酿已久的项目还原为天文学研究——关于“和谐”的最初想法早在 1599 年就已出现，尽管著作迟至 1619 年才出版——而是广泛讨论了它的数学基础与哲学含义，包括占星学、自然哲学与心理学。因此，开普勒的第三行星定律出现在一个远远超出天文学的语境中，并在很大程度上重新接续了他青年时期 *MC* 的视角。谈论开普勒的“和谐”时，需要记住：赋予这一概念以完整意义的背景远远超出音乐理论。当然，音乐牵涉其中并扮演决定性的角色——与之相伴的是源自毕达哥拉斯传统的相应数学概念。然而在开普勒那里，“和谐”代表最普遍的观念，是作为一个有秩序的整体的世界之核心，因而也是他哲学探究所要追求的终极目标。社会与政治的方面也被包括在内。细节并非无关紧要：开普勒在三十年战争的前夜，把 *HM* 献给英格兰国王詹姆斯一世——“开普勒相信最适合把它的教训应用于最迫切的和谐——教会与国家的和谐——的那个人”（Rothman 2017, p. 6）[^rothman-2017]。
