      Perhaps the most significant impact of Kepler’s two laws can be found by considering their cosmological consequences. The first law abolishes the old axiom of the circular orbits of the planets, an axiom which was still valid not only for pre-Copernican astronomy and cosmology but also for Copernicus himself, and for Tycho and Galileo. The second law breaks with another axiom of traditional astronomy, according to which the motion of the planets is uniform in swiftness. The Ptolemaic tradition in astronomy was, of course, aware of this difficulty and applied a particularly effective device for saving the “appearance” of acceleration: the equant. Copernicus, for his own part, insisted on the necessity of the axiom of uniform circular motion. Ptolemy’s equant was understood by Copernicus as a technical device based on the violation of this axiom. Kepler, on the contrary, affirms the reality of changes in the velocities of the planetary motions and provides a physical account for them. After struggling strenuously with established ideas which were located not only in the tradition before him but also in his own thinking, Kepler abandoned the circular path of planetary motion and in this way initiated a more empirical approach to cosmology (though see Brackenridge 1982)[^brackenridge-1982].
    step1: |-
      开普勒两条定律最重大的影响，也许可以在其宇宙论后果中找到。第一定律废除了行星轨道为圆周这一古老公理——它不仅对前哥白尼的天文学与宇宙论有效，对哥白尼本人、第谷与伽利略也仍然有效。第二定律则与传统天文学的另一条公理决裂：行星的运动在速度上是均匀的。托勒密的天文学传统当然意识到这一困难，并应用了一种格外有效的装置来拯救加速的“表象”：偏心匀速点（equant）。哥白尼则坚持均匀圆周运动公理的必要性：他把托勒密的偏心匀速点理解为基于违反该公理的一种技术装置。开普勒恰恰相反：他肯定行星运动速度变化的实在性，并为它们提供物理学的说明。在与既有观念——它们不仅位于他之前的传统中，也在他自己的思想中——艰苦搏斗之后，开普勒放弃了行星运动的圆形路径，由此开启了通向宇宙论的更经验性的进路（不过参见 Brackenridge 1982）[^brackenridge-1982]。
    step2: |-
      开普勒两条定律最重大的影响，也许在宇宙论后果中可见。第一定律废除了行星轨道为圆周这一古老公理——它不仅对前哥白尼的天文学与宇宙论有效，对哥白尼本人、第谷与伽利略也仍有效。第二定律与传统天文学的另一条公理决裂：行星运动在速度上均匀。托勒密的天文学传统当然意识到这一困难，并应用一种格外有效的装置拯救加速的“表象”：偏心匀速点（equant）。哥白尼则坚持均匀圆周运动公理的必要性：他把托勒密的偏心匀速点理解为违反该公理的一种技术装置。开普勒恰恰相反：他肯定行星运动速度变化的实在性，并为它们提供物理学说明。与既有观念——不仅在他之前的传统中，也在他自己的思想中——艰苦搏斗之后，开普勒放弃行星运动的圆形路径，由此开启通向宇宙论的更经验性的进路（不过参见 Brackenridge 1982）[^brackenridge-1982]。
