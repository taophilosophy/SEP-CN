      On the other hand, “causality” implies in Kepler, according to the Aristotelian conception of physical science, the concrete “physical cause”, the efficient cause which produces a motion or is responsible for keeping the body in motion. Original to Kepler, however, and typical of his approach is the resoluteness with which he was convinced that the problem of equipollence of the astronomical hypotheses can be resolved and the consequent introduction of the concept of causality into astronomy – traditionally a mathematical science. This approach is already present in his MC, where he, for instance, relates for the first time the distances of the planets to a *power* *which emerges from the Sun* and decreases in proportion to the distance of each planet, up to the sphere of the fixed stars (see Stephenson 1987, pp. 9–10)[^stephenson-1987].
    step1: |-
      另一方面，照亚里士多德的物理科学构想，“因果性”在开普勒那里意味着具体的“物理原因”，即产生运动或负责维持物体运动的动力因。不过，开普勒的原创之处、其进路的典型特征在于：他坚定地相信天文假说的等价性问题可以得到解决，并随之把因果性概念引入天文学——这门传统上的数学科学。这种进路已见于 *MC*：例如，他第一次把诸行星的距离与一种从太阳发出、随各行星距离递减而递减、直至恒星天球的*力*联系起来（见 Stephenson 1987, pp. 9–10）[^stephenson-1987]。
    step2: |-
      另一方面，照亚里士多德的物理科学构想，“因果性”在开普勒那里意味着具体的“物理原因”：产生运动、或负责维持物体运动的动力因。不过开普勒的原创之处、其进路的典型特征在于：他坚定地相信天文假说的等价性问题可以解决，并随之把因果性概念引入天文学——这门传统上的数学科学。这种进路已见于 *MC*：例如，他第一次把诸行星的距离与一种*力*联系起来——该力发自太阳，随各行星距离递减而递减，直至恒星天球（见 Stephenson 1987, pp. 9–10）[^stephenson-1987]。
