      Especially where Kepler deals with the geometrical structure of the cosmos, he always returns to his Platonic and Neoplatonic framework of thought (Michalik, J., 2019, Rudenko and Lastovets, 2023). Thus, the polyhedral hypothesis (see Section 3 below) he postulated for the first time in his MC represents a kind of “formal cause” constituting the foundational structure of the universe. In addition, an “efficient cause,” which realizes this structure in the corporeal world, is also needed. This is, of course, God the Creator, who accomplished His work according to the model of the five regular polyhedra. Kepler reinterprets the traditional statements about the Creation as an image of the Creator giving to the ancient ideas a more systematic and a quantitative character. Even the doctrine of the Trinity could be geometrically represented, taking the center for the Father, the spherical surface for the Son, and the intermediate space, which is mathematically expressed in the regularity of the relationship between the point and the surface, for the Holy Spirit. In Kepler’s model, we have to be able to reduce all appearances to straightness and curvature as providing the foundation for the geometrical structure of the world’s creation. The very first category, through which God produced a fundamental similitude of the created World to Himself, is that of quantity (see MC, chapter 2, KGW pp. 23–26). Furthermore, quantity was also introduced into the human soul for the specific purpose that this fundamental symmetry could be apprehended and known scientifically.
    step1: |-
      尤其是在处理宇宙的几何结构时，开普勒总是回到他的柏拉图主义与新柏拉图主义思想框架（Michalik, J., 2019；Rudenko and Lastovets, 2023）。因此，他在 *MC* 中首次提出的多面体假说（见下文第 3 节）代表了一种构成宇宙根基结构的“形式因”。此外，还需要一种“动力因”，在形体世界中实现这一结构。这当然是造物主上帝：他依照五种正多面体的模型完成了他的作品。开普勒把关于创世的传统论述重新诠释为造物主的一个形象，赋予古代理念更系统、更定量的品格。甚至三位一体的教义也可以几何地表示：以中心为圣父，以球面为圣子，以中间的空间——它在数学上表现为点与面之间关系的规则性——为圣灵。在开普勒的模型中，我们必须能够把一切显现还原为直与曲，它们为世界之创造的几何结构提供基础。上帝借以使被造世界与自己根本相似的第一范畴，就是量这个范畴（见 MC 第 2 章，KGW pp. 23–26）。此外，量也被引入人类灵魂，其特定目的正是使这种根本对称性能够被科学地把握和认识。
    step2: |-
      尤其在处理宇宙的几何结构时，开普勒总是回到他的柏拉图主义与新柏拉图主义思想框架（Michalik, J., 2019；Rudenko and Lastovets, 2023）。因此，他在 *MC* 中首次提出的多面体假说（见下文第 3 节）代表一种“形式因”——宇宙根基结构的构成者。此外还需要一种“动力因”，在形体世界中实现这一结构：这当然是造物主上帝，他依照五种正多面体的模型完成了他的作品。开普勒把关于创世的传统论述重新诠释为造物主的一个形象，赋予古代理念更系统、更定量的品格。甚至三位一体的教义也可以几何地表示：以中心为圣父，以球面为圣子，以中间的空间——数学上表现为点与面之间关系的规则性——为圣灵。在开普勒的模型中，我们必须能够把一切显现还原为直与曲：它们为世界之创造的几何结构奠基。上帝借以使被造世界与自己根本相似的第一范畴，就是量（见 MC 第 2 章，KGW pp. 23–26）。此外，量也被引入人类灵魂——其特定目的，正是使这种根本对称性能够被科学地把握和认识。
