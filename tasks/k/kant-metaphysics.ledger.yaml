      康德对理性心理学的批评动用了若干不同的源泉，其中之一是康德的统觉学说或先验自我意识（常以把“我思”附于我的一切表象之必要可能性来表述（B132））。康德否认形而上学家有权得出其实质结论，理由是自我意识的活动不为思想产出任何对象。然而，理性被其投射与对象化的倾向所引导。依照这些倾向，自我意识被“实体化”或对象化。这里康德再次主张，一种“自然的幻象”迫使我们把被统觉的意识统一当作对一个对象的直观（A402）。自我意识之不可消除的主观性，以及“我”在该活动语境中的难以捉摸，因此是康德回应理性心理学的著名基础；统觉学说在康德的拒斥中扮演重要角色。因为在每一种情形中，康德认为自我意识的一个特征（统觉的“我”的本质上主词性的、单一与同一的本性）被变形为一个自我（作为对象）的形而上学——它表面上仅通过理性“被认识”为有实体的、单纯的、同一的，等等。这一从统觉的“我”到一个对象（灵魂）之构成的滑移，在二手文献中受到了相当多的关注，并激发了人们对康德心灵理论与心理活动的大量关注。
