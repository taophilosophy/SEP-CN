      照康德的看法，这一论证有若干问题。显然，一个问题位于大前提中——在被制约者“已经被给予”的假定中。康德坚持认为，问题在于这样的总体永远无法在经验中遭遇。一切条件的总序列已经被给予的理性假定只对物自体成立。在显象的领域中，总体从不被给予我们这些有限的推论性认识者。就显象而言，我们最有资格说的是：不被制约者被*设定为一个任务*，存在一个继续寻求解释的理性诫命（A498/B526-A500/B528）。然而作为有限的（感性的）认识者，我们永远无法实现知识的绝对完成。假定我们能做到这一点，就是采纳可怕的先验实在主义者所特有的以神为中心的知识模型。
