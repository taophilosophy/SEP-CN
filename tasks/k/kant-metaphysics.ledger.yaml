      形而上学的动力与对不被制约者的要求，似乎在上帝的理念中找到了它们的自然安息之地——一个绝对必然且最高实在的存在者，其概念“为每一个所以然包含一个所以然的理由”（A585/B613）。正是在上帝的概念中，对知识之系统统一与完备性的要求找到它们的“客观对应物”。康德把这一理念称为一个理念（Ideal），暗示它把自己定义为“一个仅通过理念就被完全规定的个别对象的概念”（A574/B602）。理念代表理性对不被制约者的要求的最高单一显现。
