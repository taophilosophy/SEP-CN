      照康德的看法，所有这些论证的一个本质方面是它们试图*先天地*——仅仅从对思维活动的分析——推导出关于“灵魂”之本性与构成的结论。这类尝试的经典例子由笛卡尔提供：他从命题（或毋宁说活动）“我思”演绎出自我的实体性。这一动作在笛卡尔从“我思”到“我”因此是思维着的“一个物”的主张的推理中显而易见。对笛卡尔而言这一动作不成问题：思想是一个属性，因此预设一个它内在于其中的实体。康德强调灵魂的形而上学学说的*先天*基础，主张在理性心理学中，“我思”应当提供“唯一的文本”（A343–4/B401–02）。正是这一学科的特征把它与任何经验性的自我学说（任何经验心理学）区分开来，并确保它作为一个号称提供综合*先天*知识的“形而上学”的地位。
