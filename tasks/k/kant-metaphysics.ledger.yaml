      除了批评理性理念的“实体化”，康德还试图暴露理念使用中涉及的“僭越”。“僭越”一词指一种特别涉及不同*种类*的词项与概念的偷偷替换的谬误。康德通常用这个词指这样的错误：混淆或替换意在经验中使用的概念与原则（那些正确地适用于显象者）与“纯粹理性”的原则。由此，一个是我们经验之条件的概念或原则（如统觉的原则）被以假定其对“一般对象”或物自体的应用的方式使用。或者，一个只对一般事物成立的最一般的、形式的原则，被单独当作产出关于显象的知识。贯穿辩证论的这第二类批评，因此关乎康德暴露奠基幻象性形而上学论证的僭越的努力。最终，康德将*还*试图揭示损害形而上学论证的那些非常具体的 formal 谬误，以表明（尽管它们有可靠性的外观）每一情形中的立场都隐含地奠基于或使用词项与概念的辩证使用、原则的误用、以及显象与物自体的混淆。换言之，我们在康德对形而上学的批评中发现的是一个复杂的说明——它奠基于一个相当有力的人类理性理论。相应地，他把理性确认为某些原则与倾向、某些“幻象”的所在——它们与概念和原则的误用合作，造成先验分析论中已经暴露的错误。尽管这多种目标与抱怨确实使康德在辩证论中的讨论复杂化，它也使对形而上学的批评更丰富、更透彻。
