      在动力学的二律背反中，康德 somewhat 改变了他的策略。他不是（如在数学二律背反中那样）论证两个结论都是*假的*，而是暗示论争的双方可能结果都是正确的。这一选项在这里可用，而在两个数学二律背反中不可用，因为正题论证的拥护者并未把自己完全限定在关于时空对象的主张上。在第三个二律背反中，正题主张：除机械因果性之外，我们必须设定某种最初的、不被引起的因果力（先验自由）；反题则否认除机械因果性之外的任何东西。于是这里的论争是自由与决定论之间的标准（在此情形中，具体是宇宙论的）论争。最后，在第四个二律背反中，必然存在者的要求与它的对立面相对立。正题立场论证必然存在者，而反题否认有任何这样的存在者。
