      卡斯皮为他的读者提供了过上一种有德生活指南。作为一个彻头彻尾的理性主义者，他建议人获得可能得到的最好教育。应当尽一切努力积累为改进教育所必需的钱财，用来购买书籍、延聘教师。每个人都应当建立家庭：妻子会扶持他，儿女会使他晚年有所依靠，“好让他有时间获取智慧……此外，他的儿子们若是良善的，会加入他的学习，若他的双眼已因年老而昏花，则更是如此”（《箴言注释》，pp. 59–60）。这是一种彻头彻尾的功利主义的、利己主义的哲学，它建议每个人都实现自我。卡斯皮在其圣经释经的语境中阐发这些指南，主要依据的是按犹太传统出自所罗门王——人中最有智慧者——之手的智慧文学。他还从圣经故事中引出他的规则，援引其中英雄们的行为。
