      1. *Kaspi’s birth until his return from Egypt*. Joseph b. Abba Mari ibn Kaspi was born circa 1280 in Arles in Provence (or in Argentière, in the Languedoc region). In 1314, he traveled to Egypt in 1314 for five months:
    step1: |-
      1. *卡斯皮的出生直至自埃及归返*。约瑟夫·本·阿巴·马里·伊本·卡斯皮约 1280 年生于普罗旺斯的阿尔勒（或生于朗格多克地区的阿让蒂耶尔）。1314 年，他于 1314 年前往埃及，停留五个月：
    step2: |-
      1. *从出生到自埃及归返*。约瑟夫·本·阿巴·马里·伊本·卡斯皮（Joseph b. Abba Mari ibn Kaspi）约于 1280 年生在普罗旺斯的阿尔勒（一说生于朗格多克地区的阿让蒂耶尔）。1314 年他远赴埃及，停留五个月：
  - id: 5
