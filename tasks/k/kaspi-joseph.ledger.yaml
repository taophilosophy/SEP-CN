      Generally speaking, contemporary linguistics discerns two key types of meaning differentiation: (a) between word *designata*, in which each synonym is designated differently: quantitatively—*rekhev* vs. *mekhonith* (motor vehicle vs. automobile); qualitatively—*shikor* vs. *mevusam* (inebriated vs. tipsy); (b) among registers or layers of language (*layish* vs. *aryeh/*lion).
    step1: |-
      大体而言，当代语言学分辨出两类关键的词义区分：（a）词的*所指对象*之间的区分，其中每个同义词的所指不同：量的区分——*rekhev* 与 *mekhonith*（机动车与汽车）；质的区分——*shikor* 与 *mevusam*（烂醉与微醺）；（b）语域或语言层次的区分（*layish* 与 *aryeh*／狮子）。
    step2: |-
      大体而言，当代语言学分辨出两类关键的词义区分：（a）词的*所指对象*之间的区分——每个同义词各有所指：量上的，如 *rekhev* 与 *mekhonith*（泛指的机动车与特指的汽车）；质上的，如 *shikor* 与 *mevusam*（烂醉与微醺）；（b）语域或语言层次的区分（*layish* 与 *aryeh*，狮子的旧称与新称）。
  - id: 29
    kind: body
    source: |-
      Kaspi also insists on an additional type of differentiation among synonyms, maintaining that there is but one designatum and even the designates do not differ. Differences among words are embodied in the aspects of the designatum that they emphasize. For example, Kaspi explains that the words *ḥerev, sakkin, maakheleth* and *shelaḥ* (javelin) are not synonymous because each designates a different aspect of the object. Kaspi maintains, that all these objects are cutting instruments: knives. One is called *ḥerev* because it attests to the destruction (*ḥurban*) of those struck by it; a *sakkin* designates the stricken victim as subject to danger and then severed from living creatures (according to Kaspi’s interpretation of the root *samekh-kaf-nun*). The instructive word *maakhelet* informs us that the stricken one is slaughtered, consumed (*neekhal*), terminated and so on. The words *ḥerev, sakkin, maakhelet*, and *shelaḥ* thus designate the same type of tool, a cutting instrument. Different words indicate and describe different phenomena concerning the designatum, but these are not synonyms.
    step1: |-
      卡斯皮还坚持同义词之间另一种类型的区分，主张只有一个所指对象，甚至所指者也没有差异。词与词之间的差异，体现在它们所强调的所指对象的诸方面之中。例如，卡斯皮解释说，*ḥerev*、*sakkin*、*maakheleth* 与 *shelaḥ*（镖枪）这几个词并非同义词，因为每一个都标示对象的不同方面。卡斯皮主张，所有这些对象都是切割器具：刀。其中一个被称为 *ḥerev*，因为它见证了被它击中者的毁灭（*ḥurban*）；*sakkin* 则把被击中的受害者标示为处于危险之中、随后与活物分离者（按卡斯皮对词根 *samekh-kaf-nun* 的解释）；富于教益的词 *maakhelet* 告诉我们，被击中者被宰杀、被吞吃（*neekhal*）、被终结，等等。*ḥerev*、*sakkin*、*maakheleth* 与 *shelaḥ* 诸词因而标示同一类工具——切割器具。不同的词标示并描述关于所指对象的不同现象，但它们不是同义词。
    step2: |-
