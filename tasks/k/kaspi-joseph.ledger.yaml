      Another significant difference between dictionaries produced before and up to Kaspi’s time and *Sharshoth Kesef* is the order of discussion of lexical forms. Ibn Janaḥ and Radaq, who preceded Kaspi, begin by presenting the forms of the verbs derived from a given Biblical root, followed by the noun forms. Unlike earlier lexicographers of Hebrew and Arabic, Kaspi composed a dictionary in which the nouns derived from the root were described first and the relevant verb form system was only shown afterward. This change in order is by no means coincidental. In *Retuqot Kesef*, Section 40, Kaspi analyzes the structure of the Hebrew language. First, its founders agreed on the general meaning of each root. Then they coined an abstract name designating its meaning that is not connected to any particular object or occurrence. Subsequently, they coined the verb’s infinitive, thereby creating the reality to which the noun refers. The infinitive is an abstract noun expressing an occurrence. Subsequently, they formed adjectives that are concretely connected with specific objects. After completing the nouns, they invented a system that addresses tangible activity and occurrences. In other words, Kaspi maintains that the formation of nouns and the various weights accorded to them proceed from the most abstract to the most tangible. As the verb system is the most tangible of all, it was devised last.
    step1: |-
      卡斯皮时代之前及其时代的词典与 *Sharshoth Kesef* 之间另一个重大差异，是词条讨论的次序。先于卡斯皮的伊本·贾纳赫与拉达克，先列出由某一圣经词根派生的动词诸形式，随后才是名词形式。与更早的希伯来语与阿拉伯语词典编纂者不同，卡斯皮编成了一部词典：其中先描述由词根派生的名词，相关的动词形式系统只在随后才展示。这一次序的变化绝非偶然。在 *Retuqot Kesef* 第 40 节，卡斯皮分析了希伯来语言的结构。首先，语言的奠基者们就每个词根的一般意义达成一致。随后，他们铸出一个标示其意义的抽象名称，这一名称不与任何特定对象或事例相连。接着，他们铸出动词的不定式，由此创造出名词所指涉的实在。不定式是表达一个事例的抽象名词。随后，他们造出与特定对象具体相连的形容词。名词完成之后，他们才发明一个处理具体活动与事例的系统。换言之，卡斯皮主张：名词的形成及其被赋予的不同分量，是从最抽象到最具体推进的；而动词系统既然是最具体的，便被留到最后。
