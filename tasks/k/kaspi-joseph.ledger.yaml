      As noted above, Kaspi himself, wrote a brief compendium on logic (Ẓ*eror ha-Kesef*) in which he summarized what he believed were important principles for a correct interpretation of Scripture. He omitted discussion of dialectic, rhetoric, and poetics, which he considered irrelevant to his task. His exegesis applies various techniques: categorizing genera and species, distinguishing between essential and non-essential qualities, asserting the symmetry of relation, understanding the law of contradiction, and recognizing valid and invalid syllogisms, in addition to logical fallacies. For example, he criticizes commentators who conclude from the truth of a proposition that its parts are also true. To illustrate this, he cites the verse “There was no man to till the soil” (Genesis 2:5). This verse does not imply that there were no human beings at the time, a proposition at variance with the Aristotelian thesis (to which Kaspi apparently subscribed) that the world has always existed alongside God.
    step1: |-
      如上所述，卡斯皮本人写了一部关于逻辑的简要纲要（Ẓ*eror ha-Kesef*），其中总结了他认为对正确解释《圣经》至关重要的诸原则。他省去了辩证法、修辞学与诗学的讨论，认为这些与他的任务无关。他的释经运用了多种技术：对属与种的归类，对本质性质与非本质性质的区分，对关系对称性的断言，对矛盾律的理解，以及对有效与无效三段论和逻辑谬误的辨认。例如，他批评那些从一命题为真推出其各部分亦真的注释家。为说明这一点，他援引“又没有耕种土地的人”（《创世记》2:5）这节经文。这节经文并不蕴涵当时没有人类——那是一个与亚里士多德的论题（卡斯皮显然也持这一论题）相抵触的命题，即世界与上帝并存而永恒存在。
    step2: |-
