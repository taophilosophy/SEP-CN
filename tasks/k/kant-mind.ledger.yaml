      In this article, we will focus on Immanuel Kant’s (1724–1804) work on the mind and consciousness of self and related issues.
    step1: |-
      本文将聚焦伊曼努尔·康德（1724–1804）关于心灵、自我意识及相关问题的著作。
    step2: |-
