    source: |-
      In general structure, Kant’s model of the mind was the dominant model in the empirical psychology that flowed from his work and then again, after a hiatus during which behaviourism reigned supreme (roughly 1910 to 1965), toward the end of the 20ᵗʰ century, especially in cognitive science. Central elements of the models of the mind of thinkers otherwise as different as Sigmund Freud and Jerry Fodor are broadly Kantian, for example.
    step1: |-
      在总体结构上，康德的心灵模型是源自其著作的经验心理学中的主导模型，在行为主义称雄的一段间歇（约 1910–1965）之后，又是二十世纪末——尤其在认知科学中——的主导模型。例如，西格蒙德·弗洛伊德与杰瑞·福多这两位在其他方面迥异的思想家，其心灵模型的核心要素都大体是康德式的。
    step2: |-
