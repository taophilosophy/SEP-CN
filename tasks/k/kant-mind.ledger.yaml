      Then we get to the second chapter of the Transcendental Logic, the brilliant and baffling Transcendental Deduction (TD). Recall the two movements just discussed, the one from experience to its conditions and the one from Aristotelian functions of judgment to the concepts that we must use in all judging (the Categories). This duality led Kant to his famous question of right (*quid juris)* (A84=B116): with what right do we apply the Categories, which are not acquired from experience, to the contents of experience? (A85=B117). Kant’s problem here is not as arcane as it might seem. It reflects an important question: How is it that the world as we experience it conforms to our logic? In briefest form, Kant thought that the trick to showing how it is *possible* for the Categories to apply to experience is to show that it is *necessary* that they apply (A97).[^note-4]
    step1: |-
      然后我们来到先验逻辑的第二章——才华横溢又令人困惑的先验演绎（TD）。回顾刚讨论过的两个运动：一个从经验到其条件，一个从亚里士多德的判断功能到我们在一切判断中必须使用的概念（范畴）。这一二元性引出了康德著名的问题：权利问题（*quid juris*）（A84=B116）：我们凭什么权利把不是从经验获得的范畴应用于经验的内容？（A85=B117）。康德在这里的问题并不像看上去那么晦涩。它反映一个重要问题：我们所经验的世界为何与我们的逻辑相契合？以最简形式，康德认为表明范畴*可能*适用于经验的诀窍，是表明它们*必然*适用（A97）。[^note-4]
    step2: |-
      然后我们来到先验逻辑的第二章——才华横溢又令人困惑的先验演绎（TD）。回顾刚讨论的两个运动：一个从经验到其条件，一个从亚里士多德的判断功能到我们在一切判断中必须使用的概念（范畴）。这一二元性引出康德著名的问题：权利问题（*quid juris*）（A84=B116）：我们凭什么权利把不从经验获得的范畴应用于经验的内容？（A85=B117）。康德此处的问题并不像看上去那么晦涩，它反映一个重要问题：我们所经验的世界为何与我们的逻辑相契合？以最简形式，康德认为表明范畴*可能*适用于经验的诀窍，是表明它们*必然*适用（A97）。[^note-4]
