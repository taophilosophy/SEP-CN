      To be sure, Kant thought that he could get more out of his transcendental arguments than just ‘best explanations’. He thought that he could get *a priori* (experience independent) knowledge out of them. Kant had a tripartite doctrine of the *a priori.* He held that some features of the mind and its knowledge had *a priori* origins, i.e., must be in the mind prior to experience (because using them is necessary to have experience). That mind and knowledge have these features are *a priori* truths, i.e., necessary and universal (B3/4)[^note-1]. And we can come to know these truths, or that they are *a priori* at any rate, only by using *a priori* methods, i.e., we cannot learn these things from experience (B3) (Brook 1993)[^brook-1993]. Kant thought that transcendental arguments were *a priori* or yielded the *a priori* in all three ways. Nonetheless, at the heart of this method is inference to the best explanation. When introspection fell out of favour about 100 years ago, the alternative approach adopted was exactly this approach. Its nonempirical roots in Kant notwithstanding, it is now the major method used by experimental cognitive scientists.
    step1: |-
      诚然，康德认为他能从先验论证中得到的不只是“最佳解释”。他认为他能从中得到*先天的*（独立于经验的）知识。康德有一套关于*先天*的三分学说。他主张：心灵及其知识的某些特征有*先天的*起源，即必然先于经验而在心灵之中（因为使用它们是拥有经验之必要条件）。心灵与知识具有这些特征，这是*先天*真理，即必然而普遍的真理（B3/4）[^note-1]。而我们要认识这些真理——或至少认识它们是*先天的*——只能使用*先天的*方法，即我们无法从经验中学到这些事情（B3）（Brook 1993）[^brook-1993]。康德认为先验论证在全部三种意义上都是*先天的*或产生*先天的*东西。尽管如此，这一方法的核心仍是最佳解释推理。约 100 年前内省法失宠时，被采纳的替代进路恰是这一进路。尽管其在康德那里有非经验的根源，它如今是实验认知科学家使用的主要方法。
    step2: |-
      诚然，康德认为他能从先验论证中得到的不只是“最佳解释”：他认为能从中得到*先天的*（独立于经验的）知识。康德有一套关于*先天*的三分学说。他主张：心灵及其知识的某些特征有*先天的*起源——即必然先于经验而在心灵之中（因为使用它们是拥有经验之必要条件）。心灵与知识具有这些特征，这是*先天*真理，即必然而普遍的真理（B3/4）[^note-1]。而我们要认识这些真理（或至少认识它们是*先天的*），只能使用*先天的*方法——我们无法从经验中学到这些事情（B3）（Brook 1993）[^brook-1993]。康德认为先验论证在全部三种意义上都是*先天的*或产生*先天的*东西。尽管如此，这一方法的核心仍是最佳解释推理：约 100 年前内省法失宠时，被采纳的替代进路恰是它。尽管其在康德那里有非经验的根源，它如今是实验认知科学的主要方法。
