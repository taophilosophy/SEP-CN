      [^note-9]: One can compare what Kant says about reference to self to his doctrine that existence is not a predicate (A598=B626). In the same way that to be conscious of something's existence is not to be conscious of any quality of it, being conscious of oneself as oneself could be something over and above being conscious of qualities of oneself. In his criticism of Leibniz's Amphiboly, Kant says much the same thing about space and time — to be conscious of space and time is to be conscious of something over and above the qualities of space and time (A276=B332; see A281=B337).
    step1: |-
      [^note-9]: 可以把康德关于对自我的指称所说的话，与其“存在不是谓词”的学说（A598=B626）相比较。正如意识到某物的存在并不是意识到它的任何性质，意识到自己是自己也可以是超出意识到自身性质之外的某事。在他对莱布尼茨歧义的批评中，康德就空间与时间说了几乎同样的话——意识到空间与时间，就是意识到超出空间与时间的性质之外的某事（A276=B332；参 A281=B337）。
    step2: |-
