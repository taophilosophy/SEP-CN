      The same was true until recently of the unity of consciousness and Kant’s work on it. However, this is changing. In the past twenty years, the unity of consciousness has come back onto the research agenda and there are now hundreds of papers and a number of books on the topic. However, claims such as Kant’s that a certain form of synthesis and certain links among the contents of experience are required for unity continue to be ignored in cognitive science, though a few philosophers have done some work on them (Brook 2004)[^brook-2004]. The same is true of Kant’s views on consciousness of self; cognitive science has paid no attention to non-ascriptive identification of self and the idea of the essential indexical. Here, too, a few philosophers have worked on these issues, apparently without knowing of Kant’s contribution (Brook & DeVidi, 2001), but not cognitive scientists.
    step1: |-
      直到不久之前，意识的统一及康德关于它的研究也是如此。然而情况正在改变。在过去二十年里，意识的统一重新回到研究议程，如今已有数百篇论文与若干著作。不过，康德式的主张——某种形式的综合与经验内容之间的某些联结是统一所必需的——在认知科学中继续被忽视，尽管少数哲学家对它们做了一些工作（Brook 2004）[^brook-2004]。康德关于自我意识的观点亦然：认知科学没有注意自我认同的非归属认定与本质索引词的理念。这里同样，少数哲学家研究了这些问题，显然并不知道康德的贡献（Brook & DeVidi, 2001），但认知科学家没有。
