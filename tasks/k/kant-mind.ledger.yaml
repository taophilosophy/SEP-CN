      Kant calls the first stage the Transcendental Aesthetic.[^note-3] It is about what space and time must be like, and how we must handle them, if our experience is to have the spatial and temporal properties that it has. This question about the necessary conditions of experience is for Kant a ‘transcendental’ question and the strategy of proceeding by trying to find answers to such questions is, as we said, the strategy of transcendental argument.
    step1: |-
      康德称第一阶段为先验感性论。[^note-3] 它关乎：如果我们的经验要具有它所具有的空间性与时间性属性，空间与时间必须是什么样的、我们必须如何处理它们。这个关于经验之必要条件的问题，对康德而言是一个“先验”问题；而通过寻找这类问题的答案来展开的策略，如我们所说，就是先验论证的策略。
    step2: |-
