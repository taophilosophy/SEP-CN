      事实上，正如这段话告诉我们的，通过认定行动综合成一个对象需要两件事。一是记忆。二是过去表象中的某物必须被认定*为与*现在的表象相关。而要认定较早与较晚的表象都表象着一个单一的对象，我们必须使用一个概念、一条规则（A121, A126）。事实上，我们必须使用若干概念：数、质、模态，当然还有我们正在认定的那个对象的特定经验概念。
