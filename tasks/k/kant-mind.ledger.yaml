      But that is not that. In fact, as we said earlier, we are only about one-third of the way through the chapter. The syntheses of apprehension, reproduction, and recognition of single objects march in a single temporal/object-generational line. Suddenly at A106 Kant makes a kind of 90ᵒ turn. From the generation of a representation of individual objects of experience *over time*, he suddenly turns to a form of recognition that requires the unification and recognition of multiple objects existing *at the same time.* He moves from acts of recognition of individual objects to unified acts of recognition of multiple objects which “stand along side one another in one experience” (A108). This 90ᵒ turn is a pivotal moment in TD and has received less attention than it deserves.
