    source: |-
      1. The mind is a complex set of abilities (functions). (As Meerbote 1989 and many others have observed, Kant held a functionalist view of the mind almost 200 years before functionalism was officially articulated in the 1960s by Hilary Putnam and others.)[^meerbote-1989]
      2. The functions crucial for mental, knowledge-generating activity are spatio-temporal processing of, and application of concepts to, sensory inputs. Cognition requires concepts as well as percepts.
      3. These functions are forms of what Kant called synthesis. Synthesis (and the unity in consciousness required for synthesis) are central to cognition.
    step1: |-
      1. 心灵是一套复杂的能力（功能）。（正如 Meerbote 1989 与许多其他人观察到的：在功能主义于 1960 年代由希拉里·普特南等人正式提出之前近 200 年，康德就持有关于心灵的功能主义观点。）[^meerbote-1989]
      2. 对产生知识的心理活动至关重要的功能，是对感官输入的时空处理与把概念应用于其上。认知既需要知觉（percepts），也需要概念。
      3. 这些功能是康德所谓综合的诸形式。综合（以及综合所需的意识中的统一）是认知的核心。
    step2: |-
      1. 心灵是一套复杂的能力（功能）。（正如 Meerbote 1989 与许多观察者指出的：在功能主义于 1960 年代由希拉里·普特南等人正式提出之前近 200 年，康德已持有关于心灵的功能主义观点。）[^meerbote-1989]
      2. 对产生知识的心理活动至关重要的功能，是对感官输入的时空处理与把概念应用其上。认知既需要知觉（percepts），也需要概念。
      3. 这些功能是康德所谓综合的诸形式。综合（以及综合所需的意识中的统一）是认知的核心。
