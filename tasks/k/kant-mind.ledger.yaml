      In the two editions of *CPR,* there are seven main discussions of the mind. The first is in the Transcendental Aesthetic, the second is in what is usually called the Metaphysical Deduction (for this term, see below). Then there are two discussions of it in the first-edition TD, in parts 1 to 3 of Section 2 (A98 up to A110) and in the whole of Section 3 (A115-A127)[^note-2] and two more in the second-edition TD, from B129 to B140 and from B153 to B159, the latter seemingly added as a kind of supplement. The seventh and last is found in the first edition version of Kant’s attack on the Paralogisms, in the course of which he says things of the utmost interest about consciousness of and reference to self. (What little was retained of these remarks in the second edition was moved to the completely rewritten TD.) For understanding Kant on the mind and self-knowledge, the first edition of *CPR* is far more valuable than the second edition. Kant’s discussion proceeds through the following stages.
    step1: |-
      在 *CPR* 的两版中，有七个关于心灵的主要讨论。第一个在先验感性论中；第二个在通常所谓形而上学演绎的一章中（关于这一术语，见下文）。然后是第一版 TD 中的两个讨论——在第 2 节的第 1 至 3 部分（A98 至 A110）与整个第 3 节（A115-A127）[^note-2]——以及第二版 TD 中的另外两个：从 B129 到 B140、从 B153 到 B159，后者似乎是作为某种补充而加上的。第七个也是最后一个，见于第一版版本来康德对谬误推理的攻击——在其中，他关于对自我的意识与指称说出了极为有趣的东西。（这些评论在第二版中保留下来的部分被移入了完全重写的 TD。）为理解康德论心灵与自我知识，*CPR* 第一版远比第二版有价值。康德的讨论经由如下阶段展开。
    step2: |-
