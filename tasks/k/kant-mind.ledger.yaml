      This *transcendental designation,* i.e., referring to oneself using ‘I’ without ‘noting any quality’ in oneself, has some unusual features. One can refer to oneself in a variety of ways, of course: as the person in the mirror, as the person born on such and such a date in such and such a place, as the first person to do *X*, and so on, but one way of referring to oneself is special: it does not require identifying or indeed any ascription to oneself. So Kant tells us.[^note-9]
    step1: |-
      这种*先验指称*——即使用‘我’指称自身而不在自己身上‘注意任何性质’——有一些不寻常的特征。当然，人可以以多种方式指称自己：作为镜中的那个人、作为某日某地出生的那个人、作为做*X*的第一人，等等；但指称自己有一种方式是特殊的：它不需要认同、甚至不需要对自己的任何归属。康德就是这样告诉我们的。[^note-9]
    step2: |-
      这种*先验指称*——用‘我’指称自身而不在自己身上‘注意任何性质’——有不寻常的特征。人可以以多种方式指称自己：作为镜中的那个人、作为某日某地出生者、作为做*X*的第一人，等等；但有一种方式特殊：它不需要认同、甚至不需要对自己的任何归属。康德就是这样告诉我们的。[^note-9]
