      The latter position, that we can have no cognition of supersensible objects, is likewise correct but only in a restricted sense: We can have no *theoretical* cognition of them, i.e., they have no determinate theoretical meaning and their concepts have no role to play in our theoretical knowledge. However, the alleged implication that this makes meaningful thought about them impossible is false. Kant does not reject the thinkability of the supersensible but in fact asserts it on many occasions. The deeper question is what “thinkable” means in this context. Many scholars have asserted that this amounts to nothing more than representing the logically possible, ideas of pure reason. However, this would seem to violate the Discursivity Thesis, which holds that concepts without intuitions are empty and so without sense or meaning, and to conflict with Kant’s explicit claims in the first *Critique* that such ideas are not ideas of real beings at all. These problems can, however, be avoided if we recognize that Kant often includes under “thinking” various forms of indirect representation by means of analogy. Indeed, several texts either directly state or strongly suggest that all thought about the supersensible is of this symbolic character (e.g. 5:353 [1790], 20:279–280). As he states in the *Religion:* “We always need a certain analogy with natural being in order to make supersensible characteristics comprehensible to us” (6:65n. [1793]). Consequently, when we think about the supersensible, we do not represent it theoretically, as it would be in itself as an object of knowledge, but instead through a certain analogy with concepts and objects taken from sensible nature.
    step1: |-
      后一种立场——我们对超感性对象不能有认识——同样正确，但只在一个受限的意义上：我们不能有关于它们的*理论*认识，即它们没有确定的理论意义，其概念在我们的理论知识中没有角色可扮演。然而，由此推出的“这使关于它们的意义之思成为不可能”则是假的。康德并不拒绝超感性者的可思性，反而在许多场合断言它。更深的问题在于，此语境中“可思”是什么意思。许多学者断言，这不过意味着表象逻辑上可能者，即纯粹理性的理念。然而这似乎会违反“推论性论题”——该论题主张无直观的概念是空的、因而没有意义——并与康德在第一《批判》中的明确主张冲突：这类理念根本不是实在存在者的理念。不过，若我们认识到，康德常在“思维”名下包括借类比而进行的各种间接表象形式，这些问题便可避免。确实，若干文本或直接陈述、或强烈暗示，一切关于超感性者的思维都具有这种象征品格（例如 5:353 [1790], 20:279–280）。如他在《宗教》中所说：“我们总需要与自然存在者的某种类比，才能使超感性的特征对我们成为可理解的”（6:65n. [1793]）。因此，当我们思维超感性者时，我们并不理论地表象它，仿佛它自身就是知识的对象，而是通过与取自感性自然的概念和对象的某种类比来表象它。
    step2: |-
      后一立场——我们对超感性对象无认识——同样对，但须加以限定：我们无*理论*认识，即它们没有确定的理论意义，其概念在我们的理论知识中也无角色可演。但由此推出“关于它们的意义之思不可能”，却是错的。康德不否认超感性者之可思，反而屡屡断言其可思。更深的问题是：此处的“可思”何意？不少学者断言，这不过是表象逻辑上可能者，即纯粹理性的理念。可这似乎触犯“推论性论题”——无直观的概念是空的，因而无意义——也与康德在第一《批判》中的明言相抵触：这类理念根本不是实在存在者的理念。不过，只要我们承认康德常把借类比而来的各种间接表象形式归入“思维”，这些麻烦便可避开。确实，多处文本或直陈、或强暗示：一切关于超感性者的思维都带这种象征品格（如 5:353 [1790]、20:279–280）。康德在《宗教》中说：“我们总需与自然存在者的某种类比，方能使超感性的特征对我们可理解”（6:65n. [1793]）。所以，当我们思维超感性者时，并非理论地表象它、仿佛它自身即是知识对象，而是借与感性自然中的概念和对象的某种类比来表象它。
