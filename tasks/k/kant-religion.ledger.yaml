      尽管还有其他批评靶子，他们的主要论点是：康德不一致地既接受（a）奥古斯丁式原罪观——按此观，我们的道德能力因堕落而受损，以致若无圣化恩典便无力道德改善；又接受（b）他们所谓他的“斯多亚准则”，即“一个人的道德价值完全由他自己决定”（Wolterstorff 1991: 48）[^wolterstorff-1991]。晚近，Andrew Chignell 接受了“难题”反驳的要旨，并以其为康德必须诉诸希望的一个理由：既然康德所谓“斯多亚准则”不给神圣援助留余地，而神圣援助似乎又是必需的，它至多只能是希望的对象——因为与其他命题态度不同，只要不上升到“最根本模态层次”的不可能，希望面对一种（看似）不可能在理性上是可允许的（Chignell 2014: 114–115）[^chignell-2014]。
