      In connection with section 3.1.2.1 below, it is important to note that Kant rejects the Ontological Argument in both the *New Elucidation* and in *The Only Possible Argument*, though for different reasons in each case. In the former, Kant employs a version of the objection formulated by Johannes Caterus (1590–1655) in his response to Descartes’ *Meditations* (AK 1:395 [1755a]). In essence, the objection is that although the Ontological Argument proves that the concept of existence is necessarily contained in the concept of God, this is only an ideal connection among concepts. For the argument to work, then, one would first have to have already shown that the concept of God is the concept of something actual. By the time of *The Only Possible Argument*, however, Kant seems to no longer accept this criticism. Instead, he mainly rejects the argument based upon his analysis of the concept of existence, which purportedly shows that it is not a real predicate (AK 2:72–77, AK 2:156–157 [1763b]). The positive theological idea underlying this claim seems to be one not uncommon in previous Christian theology, namely, that God’s existence is the prior ground of the reality of all our concepts, including that of God himself, and so it would be viciously circular to attempt to prove the former by appeal to the latter. Kant’s preferred pre-Critical reason for rejecting the Ontological Argument is thus similar but not identical to the Critical position discussed below in section 3.1.2.1. Nevertheless, at this time Kant also articulates a version of the objection used by Gaunilo of Marmoutiers (eleventh century) in response to Anselm of Canterbury (1033–1109) (AK 2:156–157 [1763b]).
    step1: |-
      结合下文 3.1.2.1 节，有一点很重要：康德在《新阐明》与《唯一可能的论证根据》中都拒绝本体论论证，尽管两处理由不同。在前者中，康德采用约翰内斯·卡特尔（1590–1655）在回应笛卡尔《沉思集》时提出的那种反对意见的版本（AK 1:395 [1755a]）。本质上，这一反对意见是说：尽管本体论论证证明了存在概念必然包含在上帝概念之中，但这只是概念之间的观念性联系。因此，论证若要成立，人们首先必须已经表明上帝概念是某个现实之物的概念。然而到《唯一可能的论证根据》时，康德似乎不再接受这一批评。相反，他主要基于对存在概念的分析来拒绝该论证——该分析意在表明存在不是一个实在谓词（AK 2:72–77, AK 2:156–157 [1763b]）。这一主张背后的肯定性神学观念，似乎在先前的基督教神学中并不罕见，即：上帝的存在是我们一切概念（包括上帝自身概念）之实在性的先在根据，因此诉诸后者来证明前者会陷于恶性循环。所以，康德前批判时期拒绝本体论论证的首选理由，与下文 3.1.2.1 节所讨论的批判时期立场相似而不相同。不过，在这一时期，康德还表述了马尔穆捷的戈尼罗（11 世纪）回应坎特伯雷的安瑟伦（1033–1109）时所用反对意见的一个版本（AK 2:156–157 [1763b]）。
