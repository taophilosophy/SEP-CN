    source: |-
      However, due to the relational character of human sensibility, the determinations of empirical objects are in principle infinite. Consequently, the concept we have of such an object at any given moment will always be understood by us as an incomplete representation of the already completely determined, real concept or essence in the thing itself. The latter concept, as that designating something intrinsically unique, is what Kant refers to as an “ideal” and, in most instances, such is used by us regulatively as an archetype guiding reflection. Now, the predicates in all such beings must be regarded by us as real, if we are to regard any of the determinations thought by us as in these things as meaningful and as true of them. For example, if it is true that “this lump of lead is hot,” then presumably my concept of heat must correspond to a real predicate inhering in the lead itself independently of my representation of it. But, following an old metaphysical line of thought, all realities, whether found in actual things or even just in really possible ones, are limited and presuppose, as a condition of their very possibility, the existence of a corresponding infinite or pure reality of the same type, an *ens realissimum* or most real being. It is in this way, according to Kant, that reason arrives at a new idea, one which “crowns the whole of human cognition” (A641/B669), namely, that of a being whose predicates are just the infinite realities that provide the grounds of the reality of all finite realities in all possible finite things. Moreover, since it can be shown that the assumption of two or more beings of such a kind contradicts the very idea of an *ens realissimum,* this idea is also properly entitled the sole ideal of pure reason.
    step1: |-
