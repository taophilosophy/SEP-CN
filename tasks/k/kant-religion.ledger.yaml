      在康德研究圈内，他们以对康德《宗教》的所谓“难题”（Conundrum）解释最为出名：这些作者抗议说，康德涉足哲学神学不仅与先验观念论的认识论限制不相容（Wolterstorff 1998）[^wolterstorff-1998]，而且本身内部不一致，因为其对原罪的理解本质上是奥古斯丁式的，而对道德恢复的理解却是佩拉纠式的。沃尔特斯多夫甚至声称，康德的哲学神学“不仅有不可信或紧张之处，而且有内部矛盾”（Wolterstorff 1991: 49）[^wolterstorff-1991]。同样，John Hare（1996）宣称它是彻底的“失败”，而 Gordon Michalson（1990）主张《宗教》包含一长串在不相容的基督教承诺与启蒙承诺之间的“摇摆”。
