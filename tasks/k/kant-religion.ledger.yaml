      With the introduction of Transcendental Idealism’s epistemic strictures, Kant came to the conclusion that religion must fall outside the scope of theoretical reason. However, instead of atheism or agnosticism, Kant advanced a novel philosophical theology that grounds religion on the “needs” of practical reason. In the B-Preface to the *Critique of Pure Reason*, he in fact intimates that his interest in religion is part of what motivated Transcendental Idealism. That is, as quoted earlier, Kant sought to establish the limits of knowledge “in order to make room for faith” (Bxxx). Such a faith has its source in the needs of pure practical reason (AK 8:137 [1785a], AK 5:142 [1788], AK 6:139 [1793]), and it is through these needs that Kant maintains that we can extend our cognition for practical purposes, allowing us to form a warranted conception of God and the afterlife in the service of the highest good (A814/B843–A819/B847). Kant coins the term “pure rational faith” (AK 8:142) in *What does it mean to Orient oneself in Thinking* (1785a) and later uses this term as well as the “pure philosophical doctrine of religion” (AK 6:10 [1793]), “pure religion of reason” (AK 6:12), “pure rational system of religion” (AK 6:12) and simply “pure rationalism” to refer to his positive philosophy of religion. Note, however, that Kant always intends by these terms specifically *practical* rather than theoretical reason, as the “needs” which serve as the basis for faith pertain to our practical, moral lives.
    step1: |-
      随着先验观念论的认识论限制被引入，康德得出结论：宗教必定落在理论理性的范围之外。然而，康德并未走向无神论或不可知论，而是提出一种新颖的哲学神学，把宗教奠基于实践理性的“需要”之上。在《纯粹理性批判》B 版序言中，他实际上暗示，他对宗教的兴趣是促使他提出先验观念论的动因之一。也就是说，如前所引，康德力图划定知识的界限，“以便为信仰腾出地盘”（Bxxx）。这样的信仰源自纯粹实践理性的需要（AK 8:137 [1785a], AK 5:142 [1788], AK 6:139 [1793]），而正是通过这些需要，康德主张我们可以为实践目的扩展认识，使我们能够为至善服务而形成一个有正当根据的上帝概念与来世概念（A814/B843–A819/B847）。康德在《在思想中确定方向意味着什么》（1785a）中铸造了“纯粹理性信仰”一词（AK 8:142），后来用这个词以及“纯粹哲学宗教学说”（AK 6:10 [1793]）、“纯粹理性宗教”（AK 6:12）、“纯粹理性的宗教体系”（AK 6:12）乃至“纯粹理性主义”，来指称他肯定性的宗教哲学。然而须注意，康德用这些词时始终特指*实践的*而非理论的理性，因为作为信仰基础的“需要”关乎我们的实践道德生活。
    step2: |-
      先验观念论的认识论禁限一旦引入，康德便断定宗教必落在理论理性之外。但他没有走向无神论或不可知论，而是提出一种新的哲学神学，把宗教奠基于实践理性的“需要”。在《纯粹理性批判》B 版序言里，他甚至暗示：对宗教的关切正是促使他提出先验观念论的动因之一——如前所引，他要划定知识的界限，“以便为信仰腾出地盘”（Bxxx）。这种信仰源于纯粹实践理性的需要（AK 8:137 [1785a]、AK 5:142 [1788]、AK 6:139 [1793]）；康德主张，正因这些需要，我们能为实践目的扩展认识，从而为至善之故形成有正当根据的上帝概念与来世概念（A814/B843–A819/B847）。他在《在思想中确定方向意味着什么》（1785a）里造出“纯粹理性信仰”一词（AK 8:142），后来又以该词及“纯粹哲学宗教学说”（AK 6:10 [1793]）、“纯粹理性宗教”（AK 6:12）、“纯粹理性的宗教体系”（AK 6:12）、乃至“纯粹理性主义”来指称其肯定性的宗教哲学。须注意：这些词在康德笔下始终特指*实践的*理性而非理论理性，因为充当信仰基础的“需要”关乎我们的实践道德生活。
