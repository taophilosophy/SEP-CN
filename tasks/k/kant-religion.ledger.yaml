      Of key significance here is Kant’s distinction between “logical” versus “real” predicates. The former is best understood as a syntactic notion, that is, as the second term, along with the subject term, of a complete and well-formed proposition. A real predicate, by contrast, is distinguished by its semantic function. As Kant describes it, a real predicate “goes beyond the concept of the subject and enlarges it” (A598/B626). Hence, logical and real predicates involve two different orders of analysis, one syntactic, one semantic. They are neither mutually exclusive (Abaci 2008)[^abaci-2008] nor exhaustive (Pasternack 2018)[^pasternack-2018]. They instead distinguish between two different roles that one and the same term can play.
    step1: |-
      此处关键在于康德对“逻辑的”谓词与“实在的”谓词的区分。前者最好理解为一种句法概念，即一个完整且良构的命题中与主词项并列的第二项。相反，实在谓词以语义功能见别。如康德所描述，实在谓词“超出主词概念并使之扩大”（A598/B626）。因此，逻辑谓词与实在谓词涉及两种不同的分析秩序，一句法、一语义。它们既不相互排斥（Abaci 2008）[^abaci-2008]，也不穷尽一切（Pasternack 2018）[^pasternack-2018]；毋宁说，它们区分了同一个词项可以扮演的两种不同角色。
    step2: |-
      关键在康德对“逻辑”谓词与“实在”谓词的分辨。前者宜看作句法概念，即一个完整良构命题中与主词项并列的第二项；后者则以语义功能为标志。按康德的描述，实在谓词“超出主词概念而扩大之”（A598/B626）。可见逻辑谓词与实在谓词分属两个分析层次，一为句法，一为语义。二者既非互斥（Abaci 2008）[^abaci-2008]，也不穷尽全部（Pasternack 2018）[^pasternack-2018]；它们标示的是同一词项可担当的两种不同角色。
