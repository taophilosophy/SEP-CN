      Absent all “information” about the conditioned, Transcendental Theology is thus without the resources to develop the concept of God used in either Natural or Moral Theology, i.e, the “wise author of nature” or the judge and “ruler” of nature, respectively (AK 28:452 [1968], AK 28:596 [1821], AK 28:1002 [1817]). Consequently, Kant claims that Transcendental Theology is inadequate, yielding “only a silhouette of a theology” (AK 28:605, AK 28:452 [1968]). Its conception of God is “useless” (AK 28:596 [1821]), “unusable” (AK 28:452 [1968]), and “quite superfluous to us” (AK 28:1020 [1817]). It provides us with only the god of Deism, and according to the lectures, this God is “useless” and “unusable”.
