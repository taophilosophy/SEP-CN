      After an initial overview of Kant’s philosophy of religion, this entry will turn to his views during the pre-Critical and then the Critical periods. Regarding the former period, we will discuss Kant’s religious background, his views on the relationship between God and nature, and then how some of the key figures of the period influenced his philosophy of religion. We will also discuss his conception of God and his approach to the arguments for God’s existence during this period.
    step1: |-
      本词条先概述康德的宗教哲学，然后转向他在前批判时期与批判时期的观点。关于前一时期，我们将讨论康德的宗教背景、他关于上帝与自然之关系的观点，以及该时期一些关键人物如何影响了他的宗教哲学。我们还将讨论他在这时期的上帝概念及其处理上帝存在论证的方式。
    step2: |-
      本词条先给康德宗教哲学一个概览，再依次考察其前批判时期与批判时期的观点。前批判部分将讨论他的宗教背景、上帝与自然关系的看法，以及该时期几位关键人物如何塑造了他的宗教哲学；也会论及他此时的上帝概念与对上帝存在诸论证的处理。
  - id: 3
