      Kant’s own argument for God’s existence is closely connected to his conception of God as all-sufficient and the ground of all real possibility. In the *New Elucidation*, the argument is extremely brief with its core consisting in the claim that “nothing can be conceived as possible unless whatever is real in every possible concept exists and indeed exists absolutely necessarily”; “for if this be denied, nothing at all would be possible; in other words, there would be nothing but the impossible” (AK 1:395). A very similar argument features later in *The Only Possible Argument* where it is presented in much greater detail. Here again the central idea is that possibility, as the real thinkable content in any concept, presupposes something actual, and so there is a being which, if it did not exist, then nothing would be possible; but such a being is absolutely necessary (AK 2:83).
    step1: |-
      康德本人关于上帝存在的论证，与他把上帝设想为自足无待者、一切实在可能性之根据的构想密切相关。在《新阐明》中，这一论证极其简短，其核心在于这一主张：“除非每个可能概念中凡实在者都现实存在、且确实绝对必然地存在，否则没有任何东西能被设想为可能”；“因为若否认这一点，就根本没有任何东西可能；换言之，除了不可能者之外，将一无所有”（AK 1:395）。一个极为类似的论证后来出现在《唯一可能的论证根据》中，并以远为详尽的方式呈现。此处核心观念同样是：可能性作为任何概念中实在的可思内容，预设了某种现实的东西；因此存在这样一个存在者，若它不存在，则没有任何东西可能；而这样的存在者是绝对必然的（AK 2:83）。
    step2: |-
      康德自己的上帝存在论证，与他“上帝即自足无待者、一切实在可能性之根据”的构想紧密相连。《新阐明》中此论证极简，核心只有一句：“除非每个可能概念中的实在者皆现实存在，且确系绝对必然地存在，否则无物可被设想为可能”；“因为一旦否认这点，便根本无物可能；换句话说，除不可能者外一无所有”（AK 1:395）。后来《唯一可能的论证根据》中有一极相似的论证，铺陈远为详尽。其中心观念仍是：可能性作为概念中实在的可思内容，必预设某种现实之物；于是有这样一个存在者，倘若它不存在，则无物可能；而这样的存在者便是绝对必然的（AK 2:83）。
