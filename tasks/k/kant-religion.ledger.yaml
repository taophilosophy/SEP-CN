      Like all of his German contemporaries, Kant could not have avoided being affected by memories of the acrimonious conflict that had occurred between the Pietists and Christian Wolff (1679–1754) at the University of Halle just a generation prior. However, by the time Kant arrived at the Collegium Fridericianum, Pietism—particularly in Königsberg—had taken on a milder form, one which often sought to adopt but also revise the teachings of Wolff according to Pietist principles (De Vleeschauwer 1962; Kuehn 2001)[^kuehn-2001]. The most significant example of this is found in Kant’s influential teacher at the University of Königsberg, Martin Knutzen (1713–1751), whose *Philosophical Proof of the Truth of the Christian Religion* (1740) argues that the core of Christianity lies in “presenting us with a genuine means of atonement” (Knutzen 1740: §39)[^knutzen-1740] and that the necessary revelation of such a means can be rationally demonstrated using largely, but not exclusively, Wolffian principles.
    step1: |-
      与所有德意志同代人一样，康德不可能不受一代人之前哈勒大学虔敬派与克里斯蒂安·沃尔夫（1679–1754）之间那场激烈冲突之记忆的感染。然而，到康德进入 Collegium Fridericianum 时，虔敬主义——尤其在柯尼斯堡——已采取较温和的形态，常常设法依虔敬派原则采纳、但也修订沃尔夫的学说（De Vleeschauwer 1962; Kuehn 2001）[^kuehn-2001]。最重大的例子见于康德在柯尼斯堡大学影响深远的老师马丁·克努岑（1713–1751），其《基督教真理的哲学证明》（1740）主张基督教的要义在于“向我们提供一种真正的赎罪手段”（Knutzen 1740: §39）[^knutzen-1740]，并主张这一手段的必要启示可借大体上、但并非专一的沃尔夫式原则作理性证明。
    step2: |-
      与所有德意志同代人一样，康德难免受一代人之前哈勒大学虔敬派与克里斯蒂安·沃尔夫（1679–1754）激烈冲突之余波的影响。不过到康德入读 Collegium Fridericianum 之时，虔敬主义——尤其在柯尼斯堡——已趋于温和，往往设法按虔敬派原则采纳、同时修订沃尔夫的学说（De Vleeschauwer 1962; Kuehn 2001）[^kuehn-2001]。最显著的例子是康德在柯尼斯堡大学影响最大的老师马丁·克努岑（1713–1751）：其《基督教真理的哲学证明》（1740）主张基督教的核心在于“向我们提供一种真正的赎罪手段”（Knutzen 1740: §39）[^knutzen-1740]，并主张这一手段之必要启示可凭大体上、而非专属的沃尔夫式原则作理性证明。
