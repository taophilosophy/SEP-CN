      Some interpreters have claimed that the *Religion* serves as Kant’s philosophical defense of traditional Christian doctrines, and that it succeeds in this regard. This is a view advanced by Chris Firestone and Nathan Jacobs in their *In Defense of Kant’s Religion*. For example, these authors hold that Kant’s portrayal of moral evil in Part One is shaped by an “Augustinian metaphysic” (Firestone & Jacobs 2008: 136)[^firestone-2008], that in Part Two Kant promotes the idea of the Incarnation, utilizing a “Scotistic understanding of divine being” (Firestone & Jacobs 2008: 161)[^firestone-2008] and that Part Four not only concludes with an argument for the “priority of belief in Christianity” but defends the necessity of special revelation which, as they earlier claim, is necessary for Kant’s critical philosophy as a whole (Firestone & Jacobs 2008: 115)[^firestone-2008].
    step1: |-
      一些解释者主张，《宗教》是康德对传统基督教教义的哲学辩护，且在这方面是成功的。这是克里斯·法尔斯通与内森·雅各布斯在《为康德的宗教辩护》中所提的看法。例如，两位作者认为，康德在第一部分对道德恶的刻画由一种“奥古斯丁式形而上学”塑造（Firestone & Jacobs 2008: 136）[^firestone-2008]；在第二部分康德提倡道成肉身的观念，运用了“司各脱式神性理解”（Firestone & Jacobs 2008: 161）[^firestone-2008]；而第四部分不仅以“基督教信仰之优先性”的论证作结，还辩护了特殊启示的必要性——如他们早先所说，这对康德的批判哲学整体是必要的（Firestone & Jacobs 2008: 115）[^firestone-2008]。
