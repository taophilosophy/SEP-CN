    source: |-
      Kant has long been seen as hostile to religion. Many of his contemporaries, ranging from his students to the Prussian authorities, saw his Critical project as inimical to traditional Christianity. The impression of Kant as a fundamentally secular philosopher became even more deeply entrenched through the twentieth century, although this is belied by a closer inspection of his writings both before and after the publication of his *Critique of Pure Reason* (1781), i.e., what are commonly referred to as his “pre-Critical” and “Critical” periods.
    step1: |-
      康德长期以来被视为敌视宗教。他的许多同代人，从学生到普鲁士当局，都把其批判事业看作对传统基督教的敌意。康德作为彻底世俗哲学家的印象，在 20 世纪变得更为牢固，尽管只要更仔细地考察他在《纯粹理性批判》（1781）出版前后的著作——即通常所谓“前批判”与“批判”时期——这一印象便不攻自破。
    step2: |-
      长期以来，康德被看作敌视宗教的人。从学生到普鲁士当局，同代人中不少都把其批判事业视为与传统基督教为敌。到 20 世纪，“康德是彻底世俗的哲学家”这一印象愈发根深蒂固；然而，只要细读他 1781 年《纯粹理性批判》前后——即通常所谓“前批判”与“批判”时期——的著作，这印象便站不住脚。
