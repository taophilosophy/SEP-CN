      1794 年 10 月，康德收到腓特烈·威廉二世宫廷的一道敕谕，斥责他关于基督教的异端著作，并禁止他再发表“歪曲和贬损”基督教的文字（参 AK 7:6 [1798]）。在其正式答复中（日期不详，但 1794 年 10 月下旬最可能），康德同意“此后在讲演或写作中完全不再公开谈论宗教”，但也抗议说，他的著作毕竟并未“对基督教作出任何*评价*”（AK 7:8 [1798]）。
