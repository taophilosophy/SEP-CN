      Despite Kant’s explicit claim that one of the underlying drivers of Transcendental Idealism is to defend faith against theoretical reason, it is widely believed that his philosophical system powerfully challenges, if not outright bars, religious belief. His criticisms of the traditional arguments for God’s existence are taken as illustrative of his opposition to religion, and the so-called “Restriction Thesis” of Transcendental Idealism is regarded as a barrier against all legitimate religious assent (Wolterstorff 1998, Rawls 2000, DiCenso 2012)[^dicenso-2012][^rawls-2000][^wolterstorff-1998].
    step1: |-
      尽管康德明确主张，先验观念论的深层动因之一是守护信仰免受理论理性侵害，人们却普遍认为，他的哲学体系对宗教信仰构成有力挑战、甚至径直封杀之。他对上帝存在传统论证的批评被当作他反对宗教的例证，而先验观念论所谓“限制论题”则被视为阻挡一切正当宗教认同的屏障（Wolterstorff 1998, Rawls 2000, DiCenso 2012）[^dicenso-2012][^rawls-2000][^wolterstorff-1998]。
    step2: |-
      康德明言先验观念论的深层动因之一是护卫信仰、抵挡理论理性，可人们仍普遍认为他的体系对宗教信仰构成强力挑战，甚至径直封死。他对上帝存在传统证明的批评被拿来当作反宗教的例证；先验观念论的所谓“限制论题”则被看作挡住一切正当宗教认同的堤坝（Wolterstorff 1998, Rawls 2000, DiCenso 2012）[^dicenso-2012][^rawls-2000][^wolterstorff-1998]。
