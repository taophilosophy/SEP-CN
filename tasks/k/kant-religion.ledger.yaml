      The Thomasian-Pietistic School: Under this heading falls a group of philosophers that perhaps should not be called a school, but nevertheless arise from two common sources, namely the writings of Christian Thomasius and the culture of Lutheran Pietism, and generally share one common opponent, namely the rationalism associated with René Descartes and Christian Wolff. In terms of their influence on Kant, the most important of these is undoubtedly Christian August Crusius (1715–1775). Although Kant is never an uncritical follower of Crusius, it is clear that Kant studied his works intensely from the late 1750s until the middle of the 1760s, often taking Crusius’s side against that of Leibniz and Wolff. Like others in this group, Crusius argues that the Principle of Non-Contradiction is an empty principle and thus is insufficient for founding metaphysics, that human actions are radically free and so not subject to the Principle of Sufficient Reason, and that moral laws can only be known through the revelation of the divine will (in scripture or within one’s own conscience). Nearly all of these disagreements with Wolff stem from the contention that his system is inconsistent with the real significance of such religious concepts as the duty and obedience to God, obligation, guilt, and conscience.
    step1: |-
      托马斯—虔敬学派：此名下的一组哲学家，或许不该称为学派，但他们毕竟出自两个共同源头，即克里斯蒂安·托马修斯的著作与路德宗虔敬主义文化，并且大体上共享一个共同对手，即与勒内·笛卡尔和克里斯蒂安·沃尔夫相关联的理性主义。就他们对康德的影响而言，其中最重要者无疑是克里斯蒂安·奥古斯特·克鲁修斯（1715–1775）。尽管康德从不是克鲁修斯不加批判的追随者，但显然从 1750 年代末到 1760 年代中，康德着力研读其著作，常常站在克鲁修斯一边反对莱布尼茨与沃尔夫。与本组其他人一样，克鲁修斯主张矛盾律是一条空洞的原理，因而不足以奠基形而上学；人的行为根本上是自由的，因而不受充足理由律支配；而道德法则只能通过神圣意志的启示（在圣经中或在个人良知中）被认识。这些与沃尔夫的分歧，几乎都源于这一主张：沃尔夫的体系与义务、对上帝的顺从、责任、罪责与良知等宗教概念的真正意义不相容。
    step2: |-
      托马斯—虔敬学派：归在此名下的哲学家或许算不得一个学派，但他们毕竟同出两源——克里斯蒂安·托马修斯的著作与路德宗虔敬主义文化——且大体共有一个对手，即与勒内·笛卡尔、克里斯蒂安·沃尔夫相关联的理性主义。就对康德的影响而言，其中最重要者无疑是克里斯蒂安·奥古斯特·克鲁修斯（1715–1775）。康德从不是克鲁修斯的不加批判的追随者，却显然自 1750 年代末至 1760 年代中用力研读其书，屡屡站在克鲁修斯一边驳莱布尼茨与沃尔夫。如本组他人一样，克鲁修斯主张：矛盾律是一条空洞的原理，不足以奠基形而上学；人的行为根本自由，故不受充足理由律管束；道德法则只能借神圣意志的启示（或在圣经中、或在个人良知中）为人所知。这些与沃尔夫的分歧，几乎都出于一个论断：沃尔夫的体系与义务、对上帝的顺从、责任、罪责、良知等宗教概念的真实含义不相容。
