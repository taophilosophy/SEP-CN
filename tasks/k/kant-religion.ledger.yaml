      Kant’s initial attempt to articulate a metaphysics that could justify all these views is found in two works of 1755, *A New Elucidation of the First Principles of Metaphysical Cognition* and *Universal Natural History and Theory of the Heavens, Or Essay on the Constitution of the Mechanical Origin of the Whole Universe according to Newtonian Principles*. The former focuses on laying the foundation for a metaphysical system including points (i–v) above. The latter then focuses on (vi) by purporting to show that even just the Newtonian laws of nature exhibit such a tendency to bring about order and perfection in nature as can only be explained by a conception of God as the all-sufficient ground of the essences of things. The continued influence of the religious outlook of Pope’s *Essay on Man* (and hence also of the specific brand of Deism, similar to Shaftesbury’s and Lord Bolingbroke’s, to which it is related) is evidenced in the fact that the *Universal Natural History* contains no less than six separate passages from this work, three of which Kant uses to introduce the three divisions of his book.
    step1: |-
      康德为阐发一种能证成上述一切观点的形而上学所作的最初尝试，见于 1755 年的两部著作：《形而上学认识第一原理的新阐明》与《宇宙通史与天体理论，或按牛顿原理论整个宇宙机械起源之构造的论文》。前者着力为包含上面（i–v）各点的形而上学体系奠基。后者则着力于（vi），力图表明即便仅凭牛顿式自然法则，也呈现出一种在自然中造成秩序与完善的倾向，而这种倾向只能通过把上帝设想为事物本质之自足无待的根据来解释。蒲柏《论人》宗教观的持续影响（因而也涉及其所属的、类似沙夫茨伯里与博林布鲁克勋爵的特定自然神论）可由以下事实得到证明：《宇宙通史》包含不少于六段取自该书的段落，其中三段被康德用来引出全书的三编。
