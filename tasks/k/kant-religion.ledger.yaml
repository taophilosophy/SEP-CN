      Kant’s denial of theoretical cognition of the supersensible is not meant to challenge the intelligibility of religious doctrines but rather to help us better situate the unique sort of claims they involve. So long as they are not self-contradictory, they are thinkable by means of some analogy. However, such representations are not theoretically truth apt and thus can be neither proven nor refuted by theoretical means. Moreover, since they are not within the spectrum of epistemic evaluation, we cannot opine regarding them, for opinion [*Meinung*], as Kant understands the term, is a mode of assent based upon the weighing of theoretical grounds (evidence and argument) for and against truth.
    step1: |-
      康德否认对超感性者的理论认识，并非要挑战宗教教义的可理解性，而是要帮我们更好地定位它们所含的那类独特主张。只要它们不自相矛盾，就可以借某种类比而被思维。然而，这类表象不具有理论真值性，因而既不能被理论手段证明、也不能被理论手段反驳。此外，既然它们不在认识评价的谱系之内，我们就不能对它们持意见，因为按康德对“意见”［*Meinung*］的理解，意见是一种基于权衡赞成与反对真理之理论根据（证据与论证）的认同方式。
