      A third school holds that despite appearances to the contrary, the *Religion* does not engage in “theological speculation concerning the doctrine of grace in any form” (DiCenso 2012: 117)[^dicenso-2012]. This view is advanced by James DiCenso in his 2012 commentary on the *Religion*, and more recently by Allen Wood in his *Kant and Religion* (2020). The former’s 2012 commentary advises that we avoid any literal reading of religious doctrines in the text, and that we should instead interpret Kant’s treatment of them as presenting no more than our moral ideals in “imaginatively enhanced or pictorial form” (2012: 28). Likewise, in the latter’s *Kant and Religion* (2020), the author presents the *Religion* as a study of how we can understand Christianity’s presentation of a “second-person relationship between myself and God” (Wood 2020: 137)[^wood-2020] as instead symbols for a first-person “self-relation” (Wood 2020: 137, 143)[^wood-2020] through which we gain “a meaningful and emotionally enriched way of relating to our own past” (Wood 2020: 145)[^wood-2020]. Interestingly, these interpretations cohere with certain interpretations of Kant’s philosophical theology in the *Opus Postumum* (see Section 4 below), with both extending not only the thesis that God, for Kant, is nothing but a symbol of our moral ideals, but that all religious doctrines involving the supersensible should likewise be interpreted as such.
    step1: |-
      第三个学派认为，尽管表面相反，《宗教》并未从事“任何形式的关于恩典教义的神学思辨”（DiCenso 2012: 117）[^dicenso-2012]。此说由 James DiCenso 在其 2012 年《宗教》评注中提出，晚近又由 Allen Wood 在《康德与宗教》（2020）中提出。前者 2012 年的评注建议，我们不要对文本中的宗教教义作任何字面解读，而应把康德对它们的处理理解为不过是以“想象性增强的或图画式的形式”呈现我们的道德理想（2012: 28）。同样，后者的《康德与宗教》（2020）把《宗教》呈现为一项研究：我们如何能把基督教所呈现的“我与上帝之间的第二人称关系”（Wood 2020: 137）[^wood-2020] 理解为第一人称“自我关系”的象征（Wood 2020: 137, 143）[^wood-2020]，借此后一关系我们获得“一种与自身过去相关联的、有意义且情感丰富的方式”（Wood 2020: 145）[^wood-2020]。有趣的是，这些解释与对康德《遗著》中哲学神学的某些解释相一致（见下文第 4 节）：两者都不只延伸了“对康德而言上帝不过是我们道德理想的象征”这一论题，还主张一切涉及超感性者的宗教教义都应作如此解释。
