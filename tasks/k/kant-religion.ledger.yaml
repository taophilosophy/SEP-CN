      Although there are a number of other targets of criticism, their main contention is that Kant inconsistently accepts (a) the Augustinian conception of Original Sin which holds that our moral capacities have through the Fall been damaged in such a way that we are incapable of moral improvement without Sanctifying Grace; and yet (b) Kant subscribes to what they call his “Stoic Maxim” that “a person’s moral worth is determined entirely by that person himself” (Wolterstorff 1991: 48)[^wolterstorff-1991]. Recently, Andrew Chignell has accepted the essence of the “Conundrum” objection, relying upon it as a reason why Kant must appeal to hope: since Kant’s alleged “Stoic Maxim” leaves no room for divine aid, and yet divine aid seems to be needed, it can be (at best) an object of hope, since unlike other propositional attitudes, hope is rationally permissible in the face of a (seeming) impossibility so long as it does not rise to an impossibility of “the most fundamental modal level” (Chignell 2014: 114–115)[^chignell-2014].
