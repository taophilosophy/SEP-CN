    source: |-
      We will then turn to his Critical period, where we will discuss: how Transcendental Idealism shaped his philosophy of religion, his Critical treatment of the arguments for God’s existence, his conception of God, his epistemology of religion, the distinction he draws between Deism and Theism, the relationship he asserts between our concept of the highest good and the practical postulates, the various interpretations of his approach to Christian doctrine. We will end with an overview of the four parts of *Religion within the Boundaries of Mere Reason*, and, finally, his *Opus Postumum*. Throughout, attention will be paid to many of the points of interpretative dispute over key aspects of his philosophy of religion.
    step1: |-
      随后我们转向他的批判时期，讨论：先验观念论如何塑造了他的宗教哲学；他对上帝存在论证的批判性处理；他的上帝概念；他的宗教认识论；他在自然神论与有神论之间所作的区分；他所主张的至善概念与实践设准之间的关系；关于他处理基督教教义之方式的种种解释。最后，我们将概述《单纯理性限度内的宗教》四部分，以及他的《遗著》。通篇将关注围绕其宗教哲学关键方面的诸多解释争议。
    step2: |-
      接着进入批判时期，议题包括：先验观念论如何塑造其宗教哲学；他对上帝存在诸论证的批判处理；其上帝概念；其宗教认识论；自然神论与有神论之别；至善概念与实践设准之关系；以及对其处理基督教教义方式的各种解读。篇末概述《单纯理性限度内的宗教》四部分与《遗著》。全篇随时留意围绕其宗教哲学关键问题上的解释分歧。
