      A similar position is advanced by Stephen Palmquist who finds in the *Religion* not only an examination of those aspects of rational religion which conform with Christian doctrine, but also a philosophical defense of the need for revelation. Palmquist claims, for example, that *Religion’s* treatment of Original Sin is used by Kant to articulate “what we might call a Christ-sized ‘hole’ in the heart of humanity’s rational capacity” (Palmquist 2016: 165)[^palmquist-2016], that Kant “regarded the Christian Gospel as a genuine revelation” (Palmquist 2016: 166)[^palmquist-2016] and that an otherwise deficient “bare reason” requires revelatory content in order that we may “believe” in our own capacity to imitate the “archetype of perfection” (Palmquist 2016: 166)[^palmquist-2016]. That is, Palmquist contends that, in line with traditional Christianity, Kant regards our salvation as dependent upon having faith in the historical reality of the Incarnation.
    step1: |-
      斯蒂芬·帕姆奎斯特提出类似立场：他在《宗教》中不仅看到对理性宗教中与基督教教义相合的那些方面的考察，还看到对启示之需要的哲学辩护。例如，帕姆奎斯特主张，《宗教》对原罪的处理被康德用来表述“我们或可称为人类理性能力心脏中一个基督般大小的‘洞’”（Palmquist 2016: 165）[^palmquist-2016]；康德“把基督教福音视为真正的启示”（Palmquist 2016: 166）[^palmquist-2016]；而本有缺陷的“纯粹理性”需要启示性内容，以便我们能“相信”自己有模仿“完善之原型”的能力（Palmquist 2016: 166）[^palmquist-2016]。也就是说，帕姆奎斯特主张，与传统基督教一致，康德认为我们的得救取决于对道成肉身之历史实在性的信仰。
