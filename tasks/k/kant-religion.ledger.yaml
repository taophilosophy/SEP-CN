      To help Kant make his case that existence is not a real predicate, i.e., a predicate that “enlarges” the subject term, he appeals to the distinction between an actual and non-actual unit of currency, say one hundred dollars. Between the two, there is no difference in the concepts of each: existence adds nothing to the concept of one hundred dollars. So, when one claims that “one hundred dollars exist”, one is not picking out one of its predicates, part of the nature of a hundred dollars, but rather one is just “positing” (A598/B626) its existence. Likewise, to claim that “God exists” is merely to posit God’s existence. It is not a statement that attributes the property of “existence” to the subject of the term “God”.
    step1: |-
      为帮助康德论证存在不是实在谓词、即不“扩大”主词项的谓词，他诉诸一单位现实货币与一单位非现实货币之间的区分，比如一百美元。二者之间，各自概念并无差异：存在对一百美元的概念毫无增益。所以，当人们声称“一百美元存在”时，并不是在挑出它的某个谓词、即一百美元本性的一部分，而只是在“设定”（A598/B626）其存在。同样，声称“上帝存在”只是设定上帝的存在，并不是把“存在”这一属性赋予“上帝”一词之主词的陈述。
