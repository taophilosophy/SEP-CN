      此外，两种解释都抓住《宗教》中的若干评论：康德把宗教的历史面与我们借象征来把握“理性的最高概念与根据”（AK 6:109 [1793]）的需要联系起来，并希望将来有一天我们不再需要“一切建立在历史上的规章”（AK 6:121 [1793]）。然而，康德处理宗教的这一面相并不适用于设准，也不适用于具体教义中被象征化的那些底层道德/神学议题（例如《创世记》故事所表现的人性向恶的先天倾向，或十字架受难所表现的我们对神助的希望）。
