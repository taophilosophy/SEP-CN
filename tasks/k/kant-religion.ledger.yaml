      While the *Critique of Pure Reason* shows some sympathy for the Argument from Design, Kant remarks that it can only get us to a “Wise Author of Nature”, a being who is responsible for the order of nature, rather than a creator, a being with infinite capacities, or a moral being. By contrast, the Canon of the First *Critique* advances a conception of God as omnipotent, omniscient, and omnibenevolent. Hence, as there argued, in order for the highest good to obtain, there must be a being capable of arranging the world such that happiness is exactly proportioned to moral worth. This being must further have the cognitive powers necessary to judge our moral worth and, presumably, a will aligned with morality.
    step1: |-
      尽管《纯粹理性批判》对设计论证表现出一些同情，康德指出它只能把我们带到“明智的自然作者”——一个对自然秩序负责的存在者——而非创造者、具有无限能力的存在者或道德存在者。相比之下，第一《批判》的“法规”章提出一个全能、全知、全善的上帝概念。因此，如那里所论证，为使至善实现，必须有一个存在者能够安排世界，使幸福恰与道德价值成比例。这一存在者还必须具备判断我们道德价值所需的认识能力，想必还有与道德相一致的意志。
    step2: |-
      《纯粹理性批判》对设计论证虽露同情，康德却指出它只能领我们到“明智的自然作者”——对自然秩序负责的存在者——而非创造者、具无限能力者或道德存在者。反之，第一《批判》“法规”章提出的上帝概念是全能、全知、全善的。故如该章所论，至善若要实现，就须有一个能安排世界、使幸福恰与道德价值成比例的存在者。此存在者还得具备判断我们道德价值所需的认识能力，想必也须有与道德相合的意志。
