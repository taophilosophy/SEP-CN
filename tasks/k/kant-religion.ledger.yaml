      What principally differentiates DiCenso (2012) and Wood (2020), however, is that the former’s hermeneutic denies outright that Kant ever engages with any doctrine in its literal form, whereas the latter sees the core goal of the *Religion* to “interpret revealed Christianity in such a way … [to] show that reason and Christianity are allies, not enemies” (Wood 2020: 20)[^wood-2020]. But in order to realize that goal, doctrines have to be rendered as just symbols. So, while Wood recognizes that Kant rejects various doctrines (e.g. the story of Abraham and Isaac on Wood 2020: 14; and the inheritability of sin on Wood 2020: 62)[^wood-2020], such rejections occur only when doctrines are understood literally. Accordingly, Wood would have us look past Kant’s engagements with literal doctrines and take Kant as claiming that they need to be understood just as symbols. This would then allow for the thesis that “everything in revealed (Christian) faith is compatible with rational faith” (Wood 2020: 20)[^wood-2020], which Wood asserts is the aim of the so-called “Second Experiment” of the *Religion*, i.e. the goal of the Second Experiment is to “disprove the hypothesis... [that] there are parts of revealed Christianity that are demonstrably and permanently incompatible with rational religion” (Wood 2020: 20)[^wood-2020].
    step1: |-
      然而，DiCenso（2012）与 Wood（2020）的主要区别在于：前者的解释学断然否认康德曾以字面形式处理任何教义，而后者视《宗教》的核心目标为“以这样一种方式解释启示的基督教……［以］表明理性与基督教是盟友而非敌人”（Wood 2020: 20）[^wood-2020]。但要实现这一目标，教义必须被化约为单纯的象征。所以，尽管 Wood 承认康德拒斥各种教义（例如 Wood 2020: 14 处亚伯拉罕与以撒的故事；Wood 2020: 62 处罪的可继承性）[^wood-2020]，这种拒斥只在教义被字面理解时才发生。据此，Wood 要我们越过康德对字面教义的处理，认为康德是在主张它们只应被理解为象征。这便容许“启示（基督教）信仰中的一切都与理性信仰相容”这一论题（Wood 2020: 20）[^wood-2020]；Wood 断言，这正是《宗教》所谓“第二实验”的目的，即第二实验的目标是“证伪……［即］启示的基督教中有部分内容可证明且永久地与理性宗教不相容这一假说”（Wood 2020: 20）[^wood-2020]。
    step2: |-
      然而，DiCenso（2012）与 Wood（2020）的分歧主要在于：前者的解释学一口否认康德曾以字面形式处理任何教义；后者则认为《宗教》的核心目标是“以某种方式解释启示的基督教……［以］表明理性与基督教是盟友而非敌人”（Wood 2020: 20）[^wood-2020]。但要达到这个目标，教义就必须被降为单纯象征。于是，Wood 虽承认康德拒斥种种教义（如亚伯拉罕与以撒的故事，2020: 14；罪的可继承性，2020: 62）[^wood-2020]，这些拒斥却只在教义被字面理解时发生。据此，Wood 要我们越过康德对字面教义的处理，认定康德是说它们只该被当作象征来理解。这便容得下“启示（基督教）信仰中的一切皆与理性信仰相容”（Wood 2020: 20）[^wood-2020]；Wood 断言这正是《宗教》所谓“第二实验”的目的——第二实验要“证伪……［即］启示基督教中有些部分可被证明且永久地与理性宗教不相容这一假说”（2020: 20）[^wood-2020]。
