      Within Kant circles, they are best known for the so-called “Conundrum” interpretation of Kant’s *Religion,* where these authors protest that Kant’s venture into philosophical theology is not only inconsistent with the epistemic strictures of Transcendental Idealism (Wolterstorff 1998)[^wolterstorff-1998], but also is internally inconsistent in virtue of the fact that its understanding of Original Sin is essentially Augustinian while its understanding of moral restoration is Pelagian. Wolterstorff goes so far as to claim that Kant’s philosophical theology suffers from “not just implausibility or tension, but internal contradiction” (Wolterstorff 1991: 49)[^wolterstorff-1991]. Likewise, John Hare (1996) declares it an outright “failure” and Gordon Michalson (1990) contends that the *Religion* contains a litany of “wobbles” between incompatible Christian and Enlightenment commitments.
