      所以，*ens realissimum* 是一个在理性关于它的概念本身中就被完全规定的个体对象之概念。在到达这一理想时，理性尚未违反康德在先验观念论中设定的任何标准，因为此处理性只是把完全规定的形式原则应用于可能实在谓词之思，并构造一个关于其实在性之终极根据的理念（更确切地说，理想）。这一构造随后可被知性当作一个“无瑕的理想”（A641/B669）来容纳，并且确实在某些批判性限制下必然且正面地作为调节性原则服务于知性。然而，就其本身而言，它是“一个单纯的虚构，我们借此把我们的理念之杂多统摄并实现在一个理想中，当作一个特殊的存在者”——对于这一步，“我们没有任何根据，甚至没有根据直接假定这样一种假设的可能性”（A580/B608）。与其他先验错误一样，证明这样一个存在者之存在的传统错误，在于暗中偷换：把由我们知性产生的主观原则、以及它在经验界限内虽仅调节性却真实的运用，偷换成一种证明客观、实在的、非由思想构造、而是通过思想被发现且具有绝对意义的存在者的运用。在此情形下，人们把*经验*事物之可能谓词的总体——它确实预设其经验实在性的一个集合性物理根据——同事物*本身*之一切可能谓词总体这个多半空洞的理念混为一谈，然后从后者推出一切实在性本身之根据的必然存在。例如，斯宾诺莎对实体概念的非法使用，以及一元论形而上学中的类似错误，都基于这类错误。
