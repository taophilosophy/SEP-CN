      According to Kant, we can have no knowledge of anything outside of experience, outside the scope of the spatio-temporal-causal order. Hence, there can be no knowledge of God, of the soul, of the afterlife, or anything else beyond that order. To compound this restriction, Kant further seems to assert that we also can have no “cognition” [*Erkenntnis*] of objects outside the scope of experience. While the former is less ambiguous, the latter has generated more debate, hanging very much on what it is to have a “cognition” (e.g., Watkins & Willaschek 2017, Chignell 2017)[^chignell-2017][^watkins-2017]. Many have taken “cognition” to be a semantic notion, and so have taken Kant’s denial of the cognizability of the supersensible as a denial of even the intelligibility of religious concepts. Thus, it is not merely that we cannot prove whether or not God exists, but the concept of God itself, like all other concepts of supersensible entities and properties, (allegedly) cannot even have meaning for us.
    step1: |-
      按康德，我们对经验之外、时空因果秩序范围之外的任何东西都不能有知识。因此，不可能有关于上帝、灵魂、来世或该秩序之外任何东西的知识。使这一限制更复杂的是，康德似乎还断言，我们对经验范围之外的对象也不能有“认识”［*Erkenntnis*］。前者较为明确，后者则引发更多争论，很大程度上取决于“认识”是什么（例如 Watkins & Willaschek 2017, Chignell 2017）[^chignell-2017][^watkins-2017]。许多人把“认识”当作语义概念，因而把康德否认超感性者的可认识性理解为否认宗教概念甚至有可理解性。于是，不仅是我们无法证明上帝是否存在，而且上帝概念本身，如同一切超感性实体与属性的概念一样，（据称）甚至不能对我们有意义。
    step2: |-
      按康德，凡在经验之外、在时空因果秩序之外者，我们都无从知道。故无上帝知识、无灵魂知识、无来世知识，也无该秩序之外任何东西的知识。限制还不止此：康德似乎还断言，对经验范围之外的对象，我们连“认识”［*Erkenntnis*］也不可能有。前一层较为明确；后一层引出更多争论，关键看“认识”作何解（例如 Watkins & Willaschek 2017, Chignell 2017）[^chignell-2017][^watkins-2017]。许多人把“认识”当作语义概念，于是把康德否认超感性者之可认识，读成否认宗教概念甚至可理解。这样，问题就不只是我们无法证明上帝存在与否，而是上帝概念本身——如同一切超感性实体与属性的概念——（据称）对我们甚至不能有意义。
