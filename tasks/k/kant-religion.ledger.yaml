      If *C* = triangle and *P* = red, *P* would be, following this definition, a real predicate, since it is possible that there exists an *x* which is a triangle and is not red. By contrast, if *P* = three-sidedness, then we do not, by this definition, have a real predicate of *C*, since there are no triangles that are not three-sided. In other words, where *C* = triangle and *P* = three-sidedness, since $\forall x (Cx \supset Px)$, *P* fails to meet the test for conceptual enlargement of *C*. Likewise, existence will fail to meet the definition above since for any concept *C*, $\exists x (Cx \supset \langle\textrm{exists}\rangle x)$. That is, if there exists some *x* such that *x* is a *C*, then *x* exists. Hence, Van Cleve treats existence as not an enlarging concept since, per his analysis, he is “letting the existential quantifier express existence” (Van Cleve 1999: 188)[^van-1999].
    step1: |-
      若 *C* = 三角形而 *P* = 红，则按此定义，*P* 会是实在谓词，因为可能存在一个 *x*，它是三角形而非红。相反，若 *P* = 有三边，则按此定义，我们并没有 *C* 的实在谓词，因为不存在不是三边的三角形。换言之，当 *C* = 三角形而 *P* = 有三边时，由于 $\forall x (Cx \supset Px)$，*P* 未通过概念扩大之检验。同样，存在也将不符上述定义，因为对任何概念 *C* 都有 $\exists x (Cx \supset \langle\textrm{exists}\rangle x)$。也就是说，若存在某个 *x* 使得 *x* 是 *C*，则 *x* 存在。因此，范·克莱夫把存在视为非扩大性概念，因为按其分析，他“让存在量词表达存在”（Van Cleve 1999: 188）[^van-1999]。
    step2: |-
      设 *C* 为三角形、*P* 为红，则据上述定义，*P* 是实在谓词，因为可能存在某个 *x*，为三角形而不红。反之，若 *P* 为“有三边”，则据定义，它不算 *C* 的实在谓词，因为不存在非三边的三角形。也就是说，当 *C* 为三角形、*P* 为“有三边”时，由于 $\forall x (Cx \supset Px)$，*P* 通不过概念扩大之检验。存在亦然：对任一概念 *C*，皆有 $\exists x (Cx \supset \langle\textrm{exists}\rangle x)$。即：若有某个 *x* 是 *C*，则 *x* 存在。因此范·克莱夫判存在为非扩大性概念，因为按其分析，他“让存在量词来表存在”（Van Cleve 1999: 188）[^van-1999]。
