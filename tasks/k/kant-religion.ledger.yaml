      For instance, there are many passages in the *Opus Postumum* which present God not as a substance or a being outside of us, but rather an ideal or thought-object. For some, this is taken as an indication that in Kant’s final years, he withdrew from his more affirmative religious views seen up through the mid-1790s (Förster 2000)[^förster-2000]. While for others, it finally articulates the view that Kant held throughout the Critical period, namely that despite textual evidence to the contrary, Kant never advanced any argument, moral or otherwise, for belief in God (W. Sullivan 1971, Guyer 2000, Byrne 2007)[^byrne-2007][^guyer-2000][^sullivan-1971].
    step1: |-
      例如，《遗著》中有许多段落把上帝呈现为并非我们之外的实体或存在者，而是一个理想或思想对象。对一些人来说，这被视为康德晚年撤回了直到 1790 年代中期仍可见的较为肯定的宗教观点（Förster 2000）[^förster-2000]。而对另一些人来说，它终于道出了康德在整个批判时期所持的观点：尽管有相反的文本证据，康德从未为信仰上帝提出任何论证，无论道德的还是别的（W. Sullivan 1971, Guyer 2000, Byrne 2007）[^byrne-2007][^guyer-2000][^sullivan-1971]。
    step2: |-
      例如，《遗著》中不少段落把上帝说成不是我们之外的实体或存在者，而是一个理想、一个思想对象。有人据此认为，康德晚年舍弃了直到 1790 年代中期仍见的较肯定宗教观（Förster 2000）[^förster-2000]。另一些人则认为，这终于道出康德批判期的始终之见：尽管文本证据相反，他从未为信仰上帝给出任何论证，无论是道德的还是别的（W. Sullivan 1971, Guyer 2000, Byrne 2007）[^byrne-2007][^guyer-2000][^sullivan-1971]。
  - id: 182
    kind: body
    source: |-
      Nevertheless, amidst the passages in the *Opus Postumum* which present God as merely an ideal or thought-object, there are others which are not so deflationary, presenting God in a manner similar to the more familiar works of the Critical period (AK 21:13–14 [OP 220–222], AK 22:126–127 [OP 206–207]).
    step1: |-
      然而，在《遗著》那些把上帝仅呈现为理想或思想对象的段落之间，还有一些不那么“紧缩”的段落，以一种类似批判时期较熟悉著作的方式呈现上帝（AK 21:13–14 [OP 220–222], AK 22:126–127 [OP 206–207]）。
    step2: |-
      不过，《遗著》中虽有不少段落把上帝仅当作理想或思想对象，另有一些段落并不那么“紧缩”，其呈现上帝的方式近于批判期较熟悉的著作（AK 21:13–14 [OP 220–222]、AK 22:126–127 [OP 206–207]）。
  - id: 183
    kind: body
    source: |-
      One way to understand these discrepancies is to recognize that the *Opus Postumum* is a collection of notes written over more than a decade, unedited, and possibly different from what would have been the final version of the treatise. Hence, Kant might have been rethinking his philosophy of religion, exploring possibilities, or working through some ideas which could fill his perceived “gap in the critical philosophy”, ideas that neither undercut the epistemic strictures of the *Critique of Pure Reason* nor the religiously affirmative language in his practical philosophy.
    step1: |-
      理解这些差异的一条路，是承认《遗著》是十余年间写成、未经编辑的札记汇编，可能不同于该书最终版本会有的样子。因此，康德或许在重新思考其宗教哲学、探索各种可能，或推敲某些可填补他所感“批判哲学缝隙”的想法——这些想法既未削弱《纯粹理性批判》的认识论限制，也未削弱其实践哲学中肯定宗教的语言。
    step2: |-
      要理解这些参差，可以承认《遗著》是十余年写成、未经编定的札记汇编，与最终定稿或许不同。因此，康德也许正在重新思考其宗教哲学、试探各种可能，或推敲某些能填补他所感“批判哲学缝隙”的想法——这些想法既不损《纯粹理性批判》的认识论限制，也不损其实践哲学中肯定宗教的措辞。
  - id: 184
    kind: body
    source: |-
      Further, though Kant sometimes describes God as an ideal or thought-object, he also says the same about the world and man-in-the-world, raising the possibility that his discussions of God took place in two separate spheres: transcendental philosophy proper, which provides the purely formal conditions of metaphysics and so includes only the ideals we must construct in order to posit ourselves in the world (namely, God, the world, and man-in-the-world); and metaphysics, which is transcendental philosophy applied to certain objects (“[the transcendental philosopher] addresses merely what is formal, [the metaphysician] what is material (the object, the material)” [AK 21:79 [OP: 246]]). If this is right, then it could be that Kant does not repudiate or deflate his prior philosophy of religion, but merely adds a new layer to it. Unfortunately, the *Opus Postumum*’s unfinished state makes it difficult to come to a secure conclusion about where Kant’s thinking on religion stood in his final years.
    step1: |-
      此外，尽管康德有时把上帝描述为理想或思想对象，他对世界与世界之中的人也这样说，这就引出一种可能：他关于上帝的讨论发生在两个不同领域。其一是先验哲学本身，它提供形而上学的纯粹形式条件，因而只包含我们为在世界中设定自身而必须构造的理想（即上帝、世界、世界中的人）；其二是形而上学，即应用于某些对象的先验哲学（“［先验哲学家］只谈形式的东西，［形而上学家］谈质料的东西（对象、质料）”［AK 21:79 [OP: 246]］）。若这是对的，那么康德也许并未否定或“紧缩”他先前的宗教哲学，而只是为它添了一层。不幸的是，《遗著》未完成的状态使人难以就康德晚年宗教思想的立场得出稳妥结论。
    step2: |-
      再者，康德虽有时把上帝说成理想或思想对象，他对世界、对“世界之中的人”也这样说。这提示：他论上帝的讨论分属两个领域。一是先验哲学本身，它给出形而上学的纯粹形式条件，故只含我们为在世界中设定自身而必须构造的理想（上帝、世界、世界中的人）；二是形而上学，即应用于特定对象的先验哲学（“［先验哲学家］只谈形式者，［形而上学家］谈质料者（对象、质料）”［AK 21:79 [OP: 246]］）。若然，则康德未必否弃或“紧缩”了先前的宗教哲学，不过为它添了一层。遗憾的是，《遗著》未完成，难以就康德晚年宗教思想的立场得出稳当结论。
