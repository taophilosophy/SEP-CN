      Kant then presents the highest good as a synthesis of morality and happiness in order to meet the axiological principles of supremacy and completeness. More specifically, he presents the highest good as an ideal state of affairs in which there is a proportional distribution of happiness in accordance with moral worth (A809/B837, AK 5:110 & 5:145 [1788]; AK 5:471 [1790]; AK 6:8n & 6:99 [1793]; AK 8:139 [1785a]; AK 8:281 [1764]). Nevertheless, some interpreters have proposed that Kant withdrew this formulation in later years, supporting instead the notion that the highest good reflects the idea of maximal happiness and maximal morality as two independent variables (Reath 1988, Guyer 2011, Moran 2012)[^guyer-2011][^moran-2012][^reath-1988]. However, Pasternack (2017a) argues at length that the corpus neither supports this nor the putative abandonment of one or both of the postulates of God and immortality (see section 3.5.2 below).
    step1: |-
      康德随后把至善呈现为道德与幸福的综合，以满足至上性与完整性这两条价值论原则。更具体地说，他把至善呈现为一种理想事态：其中幸福按道德价值成比例地分配（A809/B837, AK 5:110 & 5:145 [1788]; AK 5:471 [1790]; AK 6:8n & 6:99 [1793]; AK 8:139 [1785a]; AK 8:281 [1764]）。然而，一些解释者提出，康德晚年撤回了这一表述，转而支持“至善反映最大幸福与最大道德作为两个独立变量的理念”这一主张（Reath 1988, Guyer 2011, Moran 2012）[^guyer-2011][^moran-2012][^reath-1988]。不过，Pasternack（2017a）详尽论证：全部著作既不支持此说，也不支持所谓他放弃上帝与不朽两个设准之一或全部的断言（见下文 3.5.2 节）。
    step2: |-
      康德随后把至善表述为道德与幸福的综合，以兼顾至上与完整两条价值论原则。更具体说，他把至善描画为一种理想事态：幸福依道德价值按比例分配（A809/B837、AK 5:110 & 5:145 [1788]；AK 5:471 [1790]；AK 6:8n & 6:99 [1793]；AK 8:139 [1785a]；AK 8:281 [1764]）。但有解释者主张，康德晚年撤回了这一表述，转而认为至善是“最大幸福与最大道德两个独立变量”的理念（Reath 1988, Guyer 2011, Moran 2012）[^guyer-2011][^moran-2012][^reath-1988]。Pasternack（2017a）则详加论证：全部著作既不支持此说，也不支持所谓他放弃上帝、不朽两设准之一或全部的断言（见下文 3.5.2 节）。
