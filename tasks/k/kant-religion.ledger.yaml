      By way of this interpretative framework, Pasternack (2014) maintains that the *Religion* is both compatible with the epistemic strictures of Transcendental Idealism (contrary the interpretations summarized above) as well as internally consistent. As for the discussions where Kant appears to be guided by an “Augustinian metaphysic” (Firestone & Jacobs 2008: 136)[^firestone-2008], “firmly ensconced within the Augustinian tradition” (Quinn 1988: 91)[^quinn-1988] or “accommodating” (Wood 1970: 246)[^wood-1970] tenets “fundamental to Augustine” (Beiser 2006: 594)[^beiser-2006], he is rather examining such tenets in order to determine whether or not they have “unity” or “compatibility” with rational religion. Such doctrines as Original Sin, Grace, the Incarnation, Vicarious Atonement and so forth are thus examined by Kant in the *Religion* in order to, in each case, assess whether or not they cohere with his moral anthropology and doctrine of the highest good.
    step1: |-
      借助这一解释框架，Pasternack（2014）主张《宗教》既与先验观念论的认识论限制相容（与上述解释相反），又内部一致。至于那些康德似乎受“奥古斯丁式形而上学”引导（Firestone & Jacobs 2008: 136）[^firestone-2008]、“稳稳栖身于奥古斯丁传统之内”（Quinn 1988: 91）[^quinn-1988] 或“迁就”（Wood 1970: 246）[^wood-1970]“奥古斯丁之根本”教义（Beiser 2006: 594）[^beiser-2006] 的讨论，他毋宁是在考察这些教义，以判定它们与理性宗教是否有“统一”或“相容”。因此，原罪、恩典、道成肉身、代赎等教义之所以被康德在《宗教》中考察，是为了逐一评估它们是否与他的道德人类学及至善学说相合。
