      Until the recent spate of commentaries on the *Religion*, little work has been done on its overall aims and structure. Although Part One of the text has long been mined for insights into Kant’s picture of moral agency, such studies did not consider how the overall text might inform the passages minded therefrom. The last decade, however, has seen the publication of a number of commentaries on the *Religion*, each with their own distinctive interpretations (Firestone & Jacobs 2008, DiCenso 2012, Pasternack 2014, Miller 2015, Palmquist 2016)[^dicenso-2012][^firestone-2008][^miller-2015][^palmquist-2016][^pasternack-2014], most of whose authors are mentioned in this entry. The above section also provides a brief overview of their respective positions with regards to the relationship between Kant’s *Religion* and core Christian doctrines. In this section, we will briefly review what Kant himself says about his project and how it unfolds through its four parts.
    step1: |-
      在晚近一批《宗教》评注问世之前，关于其总体目的与结构的研究甚少。尽管文本第一部分久被用来发掘康德道德能动性图景的洞见，此类研究却未考虑整体文本如何能说明从中开掘出的段落。不过，过去十年出现了一批《宗教》评注，各有其独特解释（Firestone & Jacobs 2008, DiCenso 2012, Pasternack 2014, Miller 2015, Palmquist 2016）[^dicenso-2012][^firestone-2008][^miller-2015][^palmquist-2016][^pasternack-2014]，其作者大多在本词条中被提及。上一节也已简要概述了他们各自关于康德《宗教》与核心基督教教义之关系的立场。本节将简要回顾康德本人关于其计划的说法，以及这一计划如何在其四部分中展开。
    step2: |-
      晚近评注纷纷问世之前，学界对《宗教》的总体目的与结构研究甚少。第一部分虽久被采掘，以窥康德道德能动性图景，但这类研究并不追问全书如何照亮被采掘的段落。近十年来，《宗教》评注迭出，各有独特读法（Firestone & Jacobs 2008, DiCenso 2012, Pasternack 2014, Miller 2015, Palmquist 2016）[^dicenso-2012][^firestone-2008][^miller-2015][^palmquist-2016][^pasternack-2014]，其作者大多在本词条中出现。上一节已简述他们各自关于《宗教》与核心基督教教义之关系的立场。本节则简要梳理康德本人对其计划的说法，以及该计划在四部分中的展开。
