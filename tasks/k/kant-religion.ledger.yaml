      Lastly, note that Kant’s account of Deism is not disconnected from the “common seventeenth- and eighteenth-century usage” and thus “idiosyncratic” (*pace* Wood 1991)[^wood-1991]. Rather, it is indicative of the term’s usage in a German rather than a British context. For example, Wolff, in his *Theologia naturalis* highlights the areas of agreement between Deism and Atheism, arguing that Deism can easily devolve into a “practical atheism” (*Theologia naturalis*, §547). Baumgarten as well, in the *Metaphysica*, the textbook that Kant used in his courses on Metaphysics and Natural Theology, follows Wolff in this, describing Deism as “the doctrine [which] maintains that almost nothing is conceivable about God, except perhaps his existence” (§862). Hence, however idiosyncratic this use of “Deism” may seem to the modern reader, it would not have been so for Kant’s German audience.
    step1: |-
      最后请注意，康德对自然神论的说明并未脱离“17—18 世纪的通行用法”，因而并非怪僻（contra Wood 1991）[^wood-1991]。毋宁说，它表明该词是在德意志而非不列颠语境中被使用的。例如，沃尔夫在《自然神学》中突出了自然神论与无神论的一致之处，主张自然神论很容易沦为“实践的无神论”（《自然神学》，§547）。鲍姆加登在《形而上学》——康德形而上学与自然神学课程所用教材——中也追随沃尔夫，把自然神论描述为“这样一种学说［它］主张，关于上帝几乎无物可设想，也许除了他的存在”（§862）。因此，无论这一“自然神论”用法在当代读者看来多么怪僻，对康德的德意志听众而言却并非如此。
