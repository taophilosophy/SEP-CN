      The former position, that we can have no knowledge of the supersensible, is textually well supported. Knowledge [*Wissen*], for Kant, follows its traditional tripartite model as justified-true-belief, and if there is neither experience nor rational proof of any supersensible claim, no such claim can meet with suitable justification. The one notable exception found in Kant’s writings is the claim, found in the *Critique of the Power of Judgment,* that freedom can be counted among the *“scibilia”* or things that are knowable (AK 5:468 [1790]).
    step1: |-
      前一种立场——我们对超感性者不能有知识——在文本上得到有力支持。对康德而言，知识［*Wissen*］依循其传统的三元模型，即有正当根据的真信念；若任何超感性主张既无经验、又无理性证明，它就得不到适当的正当根据。康德著作中一个值得注意的例外见于《判断力批判》：自由可被算入“*scibilia*”、即可知之物（AK 5:468 [1790]）。
