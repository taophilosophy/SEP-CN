      Kant maintains that underlying all the traditional proofs for God’s existence is the concept of the *ens realissimum*, the most real being. Reason comes to the idea of this being through the principle that every individuated object is subject to the “principle of *complete* determination”. The generality of ordinary concepts, as representations, is due to their being less than fully determined (e.g., our concept of a horse extends over horses that are different colors, heights, etc.), and so the idea of an existing, individuated object is that of a completely determined being (e.g., an individual horse must have specific colors, a specific height, etc.).
    step1: |-
      康德主张，一切上帝存在的传统证明背后，都是*ens realissimum*、即最实在的存在者的概念。理性通过这样一条原则达到这一存在者的理念：每个个体化对象都服从“*完全*规定原则”。普通概念作为表象之所以具有一般性，是因为它们未获完全规定（例如，我们的马概念涵盖颜色、高度等各不相同的马），所以一个存在着的、个体化的对象之理念，就是一个完全被规定的存在者之理念（例如，某一匹个别的马必须有特定的颜色、特定的高度等等）。
    step2: |-
      康德认为，一切上帝存在的传统证明底下都藏着*ens realissimum*（最实在的存在者）这一概念。理性凭一条原则抵达这一存在者的理念：每个个体化对象都服从“*完全*规定原则”。普通概念既然是表象，其一般性便来自规定之不完全（例如我们的“马”概念统摄毛色、高矮各异的马）；因此，一个存在着的个体化对象之理念，即一个完全被规定的存在者之理念（例如某一匹个别的马必有特定的毛色、特定的高度等）。
