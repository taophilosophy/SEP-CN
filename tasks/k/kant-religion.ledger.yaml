      Moreover, Kant sees faith, unlike knowledge, as engaging with our will, calling it a “free assent”. This is important for the practical function of faith, since our commitment to morality does not simply depend on our affirmation of the postulates but on our free act of faith through which we more completely bind ourselves to morality. Morality “inevitably leads to religion” (AK 6:6 [1793]), according to Kant, since such faith is the only adequate response to the needs that inevitably threaten to undermine our commitment to morality. This, however, must not be interpreted as leading to a “theological ethics”, as if the authority of the moral law depended upon God. It is not its authority that is in question but only how we give that authority an extended content by connecting it to the appropriate idea of an all-powerful being (perhaps with the exception of the argument at AK 5:114 in the *Critique of Practical Reason* [1788]). This advance from morality to religion thus concerns only how we represent our obligation and its consequences (cf. A632/B660, AK 5:481 [1788], AK 6:3 [1793]).
    step1: |-
      此外，康德认为信仰不同于知识，它牵动我们的意志，称之为“自由的认同”。这对信仰的实践功能很重要，因为我们对道德的坚守并不只取决于我们对设准的肯定，而取决于我们借以更完整地把自己系于道德的、自由的信之行动。按康德，道德“不可避免地导向宗教”（AK 6:6 [1793]），因为这种信仰是对那些不可避免地威胁要瓦解我们道德坚守的需要唯一恰当的回应。然而，这不可解释为导致一种“神学伦理学”，仿佛道德法则的权威依赖于上帝。成问题的不是它的权威，而只是我们如何通过把它与一个全能存在者的恰当理念相联系，赋予这一权威以扩展的内容（也许除了《实践理性批判》AK 5:114 处的论证 [1788] 之外）。因此，从道德到宗教的这一推进，只关乎我们如何表象我们的义务及其后果（参 A632/B660, AK 5:481 [1788], AK 6:3 [1793]）。
    step2: |-
      康德还认为，信仰与知识不同，它牵涉意志，故称之为“自由的认同”。这对信仰的实践功能要紧：我们对道德的持守不只系于对设准的肯定，更系于我们借以更彻底地把自己绑定于道德的、自由的信之行动。按康德，道德“不可避免地引向宗教”（AK 6:6 [1793]），因为这种信仰是应答那些时时威胁瓦解道德坚守之需要的唯一恰当方式。不过，这不可读成“神学伦理学”，仿佛道德法则的权威依赖上帝。成问题的不是权威本身，而只是我们如何借把它同一个全能存在者的恰当理念相连，为这权威添上扩展的内容（也许《实践理性批判》AK 5:114 的论证 [1788] 除外）。所以，从道德到宗教的这一步，只关乎我们如何表象自己的义务及其后果（参 A632/B660、AK 5:481 [1788]、AK 6:3 [1793]）。
