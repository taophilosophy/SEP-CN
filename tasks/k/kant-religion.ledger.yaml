      The twentieth-century impression of Kant as a fundamentally secular philosopher was due in part to various interpretative conventions (such as Strawson’s “principle of significance” – Strawson 1966, 16)[^strawson-1966] that denied the meaningfulness and/or thinkability of the supersensible, and in part to an almost exclusive focus on his objections to the traditional proofs of God’s existence, which is evinced in the popular anthologies of the period.
    step1: |-
      20 世纪关于康德是彻底世俗哲学家的印象，部分源于各种解释惯例（如斯特劳森的“意义原则”——Strawson 1966, 16）[^strawson-1966]，它们否认超感性者有意义和/或可思；部分源于几乎只关注他对上帝存在传统证明的反对——该时期流行文选即显出此点。
    step2: |-
      20 世纪“康德彻底世俗”的印象，一半来自各种解释成规（如斯特劳森的“意义原则”——Strawson 1966, 16）[^strawson-1966]，它们否认超感性者有意义、可思；一半来自人们几乎只盯住他对上帝存在传统证明的驳难——当时流行的文选即是明证。
  - id: 6
    kind: body
    source: |-
      Kant’s philosophy in the pre-Critical period has been characterized variously as a progression from rationalism to empiricism to criticism (Paulsen 1898 [1902, 1963])[^paulsen-1898], as the continued search for a more proper method for metaphysics (De Vleeschauwer 1962), as a reconciliation of Newtonian and Leibnizian-Wolffian ideas (Friedman 1994)[^friedman-1994] or of natural science and metaphysics (Schönfeld 2000; cf. Anderson 2015)[^anderson-2015][^schönfeld-2000], and as an attempted articulation of a metaphysical alternative to Leibnizian “logicism,” i.e., the view that “anything that is not logically contradictory is possible” (Stang 2016)[^stang-2016]. But what nearly all of Kant’s pre-Critical writings have in common is the desire to frame a more adequate concept of God and of the relation of this being to the created universe. Thus among his earliest unpublished notes (the so-called *Reflexionen*) we find all the major themes of Kant’s pre-Critical philosophy within a detailed sketch of a religious outlook extracted from Alexander Pope’s “An Essay on Man” (1734) and a discussion, among other things, of why this position is philosophically superior to that of Gottfried Wilhelm Leibniz (1646–1716) and Christian Wolff (1679–1754).
    step1: |-
      康德前批判时期的哲学曾被各种刻画：从理性主义到经验主义再到批判主义的进展（Paulsen 1898 [1902, 1963]）[^paulsen-1898]；为形而上学寻找更恰当方法的持续探索（De Vleeschauwer 1962）；牛顿式与莱布尼茨—沃尔夫式观念的调和（Friedman 1994）[^friedman-1994]；或自然科学与形而上学的调和（Schönfeld 2000; 参 Anderson 2015）[^anderson-2015][^schönfeld-2000]；以及对莱布尼茨式“逻辑主义”——即“凡不逻辑矛盾者皆可能”这一观点——之形而上学替代方案的努力表述（Stang 2016）[^stang-2016]。但康德几乎所有前批判著作的共同点，是渴望构拟一个更充分的上帝概念，以及这一存在者与被造宇宙之关系的概念。因此，在他最早的一批未刊札记（所谓*反思录*）中，我们便能看到康德前批判哲学的全部主要主题：一幅取自亚历山大·蒲柏《论人》（1734）的宗教观详细草图，以及（除其他外）关于这一立场为何在哲学上优于戈特弗里德·威廉·莱布尼茨（1646–1716）与克里斯蒂安·沃尔夫（1679–1754）的讨论。
    step2: |-
      对康德前批判时期的哲学，历来有种种刻画：或视为从理性主义经经验主义走向批判主义的过程（Paulsen 1898 [1902, 1963]）[^paulsen-1898]；或视为对更恰当的形而上学方法的持续寻求（De Vleeschauwer 1962）；或视为对牛顿式与莱布尼茨—沃尔夫式观念的调和（Friedman 1994）[^friedman-1994]，乃至对自然科学与形而上学的调和（Schönfeld 2000; 参 Anderson 2015）[^anderson-2015][^schönfeld-2000]；或视为对莱布尼茨式“逻辑主义”——“凡不逻辑矛盾者皆可能”——之形而上学替代方案的尝试表述（Stang 2016）[^stang-2016]。然而，康德前批判著作几乎都有一处共同点：力图构拟更充分的上帝概念，以及这一存在者与被造宇宙之关系的概念。于是，从他最早的一批未刊札记（所谓*反思录*）中，我们便已看到其前批判哲学的全部主要主题：一幅取自亚历山大·蒲柏《论人》（1734）的宗教观详图；以及（其中还有）关于这一立场何以在哲学上胜过戈特弗里德·威廉·莱布尼茨（1646–1716）与克里斯蒂安·沃尔夫（1679–1754）的讨论。
  - id: 7
    kind: body
    source: |-
      Within Kant’s Critical period, not only do all three *Critiques* {1781, 1788, 1790} contain powerful defenses of religious faith, but a considerable share of his work in the 1790s is also devoted to developing the positive side of his philosophy of religion. This includes parts of the *Critique of the Power of Judgment* (1790), his 1791 “Theodicy” essay, *Religion within the Boundaries of Mere Reason* (1793), “The End of All Things” (1794), and the *Conflict of the Faculties* (1798). Moreover, his lectures on logic, *Reflexionen* and the Jäsche Logic present a robust account of the nature of religious belief/faith [*Glaube*]. So, while Kant does deny the possibility of religious knowledge (as well as opinion), he characterizes this denial as necessary to safeguard faith, which he endorses as the proper mode of religious assent and considers an essential element in any earnest moral life. One must, therefore, understand the negative elements in his philosophy of religion, such as his infamous objections to the traditional proofs for God’s existence, in this context. As stated in the B-Preface to the *Critique of Pure Reason*, a central goal of the Critical project is to establish the limits to knowledge “in order to make room for faith” (Bxxx).
    step1: |-
      在康德的批判时期，不仅三部*《批判》*{1781, 1788, 1790}都包含对宗教信仰的有力辩护，而且他 1790 年代相当一部分工作也致力于发展其宗教哲学的肯定面。这包括《判断力批判》（1790）的部分内容、1791 年《神义论》论文、《单纯理性限度内的宗教》（1793）、《万物之终结》（1794），以及《学科之争》（1798）。此外，他关于逻辑学的讲座、《反思录》与《耶舍逻辑》对宗教信仰［*Glaube*］的本性给出了有力说明。所以，康德确实否认宗教知识（以及意见）的可能性，但他把这一否认刻画为守护信仰所必需——他认可信仰是宗教认同的恰当方式，并视之为任何真诚道德生活的一个本质要素。因此，必须在这一语境中理解其宗教哲学中的否定性要素，例如他对上帝存在传统证明的著名反对。如《纯粹理性批判》B 版序言所说，批判事业的一个中心目标，是划定知识的界限，“以便为信仰腾出地盘”（Bxxx）。
    step2: |-
      在批判时期，不仅三部*《批判》*{1781, 1788, 1790}都含有对宗教信仰的有力辩护，他 1790 年代的许多工作也用以阐发其宗教哲学的肯定面：包括《判断力批判》（1790）的部分章节、1791 年的《神义论》论文、《单纯理性限度内的宗教》（1793）、《万物之终结》（1794）与《学科之争》（1798）。他关于逻辑学的讲稿、《反思录》与《耶舍逻辑》还就宗教信仰［*Glaube*］的本性作了扎实的论述。可见康德虽否认宗教知识（连同意见）的可能，却称这一否认是护卫信仰之必需——他认可信仰为宗教认同的正当方式，并视之为任何真诚道德生活不可或缺的成分。因此，他宗教哲学里的否定性部分（例如他那些声名不佳的对上帝存在传统证明的驳难）必须放在这一脉络里读。《纯粹理性批判》B 版序言说得很清楚：批判事业的中心目标之一，是划出知识的界限，“以便为信仰腾出地盘”（Bxxx）。
  - id: 8
    kind: body
    source: |-
      Throughout Kant’s writings, we find ample discussions of further religious issues. These are, in many instances, clearly affirmative, though they are often framed within objections to theoretical reason’s encroachments into the domain that is instead proper to moral faith. Although his discussions of God and immortality are familiar to most Kantians, the Critical corpus moves well beyond just these. Especially in the 1790s, we find detailed treatments of biblical hermeneutics, miracles, revelation, as well as many distinctively Christian doctrines such as Original Sin, the Incarnation, Vicarious Atonement, and the Trinity.
    step1: |-
      通观康德的著作，我们能看到对更多宗教问题的充分讨论。其中许多显然是肯定的，尽管它们常被置于对理论理性侵越道德信仰固有领域的反对之中。虽然他对上帝与不朽的讨论对多数康德研究者来说耳熟能详，批判著作的整体远不止于此。尤其在 1790 年代，我们看到对圣经解释学、奇迹、启示的细致处理，以及许多独特的基督教教义，如原罪、道成肉身、代赎与三位一体。
    step2: |-
      翻检康德全部著作，还能读到许多宗教问题的充分讨论。其中不少明显是肯定的，尽管常被包在对理论理性越界侵入道德信仰固有地盘的驳难之中。上帝与不朽固然是康德研究者熟悉的题目，但批判著作的整体远不止此。尤其在 1790 年代，可见对圣经解释学、奇迹、启示的细致论述，以及原罪、道成肉身、代赎、三位一体等颇具基督教特色的教义。
  - id: 9
    kind: body
    source: |-
      Unfortunately, however, the many positive elements of Kant’s philosophy of religion have been eclipsed by its initial negative moments, moments not meant to oppose religion, but rather reflective of the Lutheranism (or more precisely, the anti-liturgical Lutheran Pietism) of his youth. Just as with Luther’s own negative polemics against religious despotism and scholastic arcana, we see in Kant a parallel dialectic, where he, rather than opposing religion, sought to free it from the “monopoly of the schools” and set it on a footing suitable to “the common human understanding” (Bxxxii). Hence, as we will discuss through this entry, the statement that Kant sought out the limits to knowledge [*Wissen*] in order to “make room for faith [*Glaube*]” (Bxxx) is not an empty bromide, but rather the key anthem for his overall philosophy of religion.
    step1: |-
      然而不幸的是，康德宗教哲学的许多肯定要素被其最初的否定环节遮蔽了——这些环节并非意在反对宗教，而是反映了他青年时代的路德宗（更确切说，是反礼仪的路德宗虔敬主义）背景。正如路德本人对宗教专制与经院秘义的否定性论战一样，我们在康德那里看到一种平行的辩证：他并不反对宗教，而是要把它从“学派的垄断”中解放出来，置于适合“普通人类知性”的基础之上（Bxxxii）。因此，如本词条将要讨论的，康德为知识［*Wissen*］划定界限以“为信仰［*Glaube*］腾出地盘”（Bxxx）这一说法，并非空洞的陈词，而是他整个宗教哲学的基调。
    step2: |-
      可惜的是，康德宗教哲学中的许多肯定要素，被开头那些否定环节掩盖了。那些环节本不意在反宗教，而是映现出他青年时代的路德宗——更确切说，是反礼仪的路德宗虔敬主义——背景。路德本人对宗教专制与经院秘义的论战是否定性的；康德这里有一种平行的辩证：他不反宗教，反要把宗教从“学派的垄断”中解放出来，安放在适合“普通人类知性”的地基上（Bxxxii）。所以，本词条将反复说明，康德为知识［*Wissen*］划界以“为信仰［*Glaube*］腾出地盘”（Bxxx）这话绝非空洞套话，而是其整个宗教哲学的基调。
