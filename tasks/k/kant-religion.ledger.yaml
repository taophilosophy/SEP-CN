  - id: 14
    kind: body
    source: |-
      Among the most important influences on Kant’s understanding of religion is no doubt his experience of Pietism, a reform movement within German Lutheranism which aimed to fulfill what it saw as the original intention of Martin Luther. According to the founders of Pietism, such as Philip Jacob Spener (1635–1705), this original intention required a more scrupulous religious and moral outlook, a deep personal devotion to increasing one’s own piety and that of others (through *collegia pietatis*, i.e., through private meetings among lay persons for development of personal holiness), and consequently exacting self-examination as well as the creation of a general culture of supporting progress in these matters. Pietists saw Orthodox Lutheranism, by contrast, as having become frozen in vain intellectualism, an adherence to over-subtle and lifeless formalisms, and ecclesiastical politics. As a consequence, Pietists sought a return to what Spener referred to as “apostolic simplicity” in theological matters.
    step1: |-
      对康德宗教理解最重要的影响之一，无疑是他对虔敬主义的体验——那是德意志路德宗内部的一场改革运动，旨在实现它眼中马丁·路德的初衷。按虔敬主义创始人（如菲利普·雅各布·施佩纳，1635–1705）的说法，这一初衷要求更一丝不苟的宗教与道德观，要求深切地献身于增进自己与他人的虔敬（通过*collegia pietatis*，即平信徒为培养个人圣洁而举行的私下聚会），因而要求严格的自我审查，并要求营造一种支持在这些事上进步的一般文化。相比之下，虔敬派视正统路德宗为已僵化于空洞的理智主义、拘守过分微妙而无生气的形式主义以及教会政治。因此，虔敬派寻求回归施佩纳所谓神学事务上的“使徒式的纯朴”。
    step2: |-
      对康德宗教理解最重要的影响之一，无疑是他亲历的虔敬主义。那是德意志路德宗内部的改革运动，意在落实它心目中的马丁·路德初衷。按虔敬主义创始人如菲利普·雅各布·施佩纳（1635–1705）之见，这一初衷要求更严苛的宗教与道德态度，深切献身于增进本人与他人的虔敬（借*collegia pietatis*，即平信徒为培养个人圣洁而举行的私下聚会），因而也要求严格的自我省察，并要求养成一种支持此类进步的一般风气。相对而言，虔敬派眼里正统路德宗已冻结在空洞的理智主义、拘泥于过分精细而无生气的形式主义以及教会政治之中。于是，虔敬派力求回归施佩纳所称神学事务上的“使徒式纯朴”。
  - id: 15
    kind: body
    source: |-
      Kant lived his entire life in the city of Königsberg, the second largest center of Pietism after Halle. His parents were Pietists and he was educated at the Collegium Fridericianum, a Pietist gymnasium directed by Franz Albert Schultz (1692–1763). Although the positive influence of Protestantism in general, and Pietism in particular, has been strongly disputed (Wood 1970: 197n.; Kuehn 2001)[^kuehn-2001][^wood-1970], the majority of scholars have argued otherwise. Kant’s use of Pietist terminology such as the “change of heart” (*Herzensänderung*), classic theological language such as “radical evil” (*radix malorum*), his detailed engagement with Augustinian themes throughout the *Religion* and focus on Pietist and Moravian models of grace (AK 7:54–57 [1798]), which were prevalent in his region, all indicate the lasting influence of his religious upbringing.
    step1: |-
      康德一生都生活在柯尼斯堡城，那是仅次于哈勒的虔敬主义第二大中心。他的父母是虔敬派，他在弗兰茨·阿尔贝特·舒尔茨（1692–1763）主持的虔敬派文理中学 Collegium Fridericianum 受的教育。尽管新教一般、尤其虔敬主义的正面影响备受争议（Wood 1970: 197n.; Kuehn 2001）[^kuehn-2001][^wood-1970]，大多数学者却持相反看法。康德使用虔敬派术语（如“心灵转变”*Herzensänderung*）、经典神学语言（如“根本恶”*radix malorum*）、贯穿《宗教》对奥古斯丁主题的细致回应，以及对其所在地区流行的虔敬派与摩拉维亚式恩典典范的关注（AK 7:54–57 [1798]），都表明他宗教教养的持久影响。
