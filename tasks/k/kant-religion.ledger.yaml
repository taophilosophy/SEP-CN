      Nick Stang follows Van Cleve in “letting the existential quantifier express existence” and further argues that Kant subscribes to an “actualism” whereby there are no non-existing objects (i.e., if unicorns do not exist, “unicorn” does not name an object, but rather references a string of predicates). As such, Stang asserts that since “*exists* applies to every object, it does not distinguish some objects from other objects” (Stang 2015: 599)[^stang-2015]. Notice, however, that Stang’s rationale for why existence is not a predicate is that it is actually a “predicate that applies to every object there is”. That is, Stang interprets existence as an internal mark of our concept of objecthood itself (Stang 2015: 599)[^stang-2015].
    step1: |-
      尼克·斯唐追随范·克莱夫“让存在量词表达存在”，并进一步论证康德持一种“现实主义”，即不存在非存在对象（例如，若独角兽不存在，“独角兽”并不命名一个对象，而是指涉一串谓词）。因此，斯唐断言：既然“*存在* 适用于每一个对象，它就不把某些对象与其他对象区别开来”（Stang 2015: 599）[^stang-2015]。然而请注意，斯唐关于存在为何不是谓词的理由，是它实际上是“一个适用于所存在一切对象的谓词”。也就是说，斯唐把存在解释为我们的对象性概念本身的一个内在标记（Stang 2015: 599）[^stang-2015]。
    step2: |-
      尼克·斯唐跟随范·克莱夫，“让存在量词来表存在”，并进而主张康德持“现实主义”：并无不存在的对象（若独角兽不存在，“独角兽”并不命名对象，只是指涉一串谓词）。于是斯唐断言：“*存在* 既适用于每一对象，便不能把某些对象与其他对象区别开”（Stang 2015: 599）[^stang-2015]。不过请注意，斯唐论证存在非谓词的理由，其实是它乃“适用于所存在之一切对象的谓词”——他把存在读作我们“对象性”概念本身的一个内在标记（Stang 2015: 599）[^stang-2015]。
