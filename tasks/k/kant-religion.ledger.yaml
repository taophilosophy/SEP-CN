      As with many philosophers of the modern period, Kant’s religious views are deeply influenced by the scientific picture of nature that took root in the wake of Copernicus. Most significant during the pre-Critical period are the ideas that the universe is a possibly centerless, ceaselessly expanding, totality of things, which evolves towards ever greater perfection according to physical (Newtonian) and spiritual laws. Kant draws support for this view as well as inspiration for interpreting its religious significance from the writings of, among others, Alexander Pope (1688–1744), Thomas Wright (1711–1786), Pierre Louis Moreau de Maupertuis (1698–1759), Johann Heinrich Lambert (1728–1777), and Jean-Jacques Rousseau (1712–1778) (see Kant’s important note on Newton and Rousseau justifying God and so proving Pope’s “theorem” that “Whatever is, is right” AK 20:58–59). Consequently, much of Kant’s thinking about God during this period is focused on framing a conception of God and of this being’s relation to nature that adequately takes into account this revised picture of the universe. No less important is his attempt to resolve the related dispute over authority between revelation, on the one hand, and philosophy and natural science on the other.
    step1: |-
      与近代许多哲学家一样，康德的宗教观深受哥白尼之后扎根的自然科学图景影响。前批判时期最重要的，是这样一些观念：宇宙是可能无中心的、不断膨胀的事物总体，依物理（牛顿式）法则与精神法则朝越来越大的完善演化。康德从亚历山大·蒲柏（1688–1744）、托马斯·赖特（1711–1786）、皮埃尔·路易·莫罗·德·莫佩尔蒂（1698–1759）、约翰·海因里希·兰伯特（1728–1777）与让—雅克·卢梭（1712–1778）等人的著作中既获得这一观点的支持，也获得解释其宗教意义的灵感（见康德关于牛顿与卢梭为上帝辩护、从而证明蒲柏“凡存在着皆合理”这一定理的著名笔记，AK 20:58–59）。因此，康德这一时期关于上帝的思考，大多聚焦于构拟一个充分顾及这一修订版宇宙图景的上帝概念，以及这一存在者与自然之关系的概念。同样重要的是他试图解决启示与哲学及自然科学之间关于权威的相关争端。
    step2: |-
      与近代许多哲学家一样，康德的宗教观深受哥白尼之后扎根的自然科学图景之影响。前批判时期最要紧的，是如下观念：宇宙是可能无中心、不断膨胀的事物总体，按物理（牛顿式）法则与精神法则趋向愈益完善的境地。这一观点的支持与解释其宗教意义的灵感，康德得自亚历山大·蒲柏（1688–1744）、托马斯·赖特（1711–1786）、皮埃尔·路易·莫罗·德·莫佩尔蒂（1698–1759）、约翰·海因里希·兰伯特（1728–1777）、让—雅克·卢梭（1712–1778）等人的著作（见康德那则著名笔记：牛顿与卢梭为上帝辩护，从而证明蒲柏“凡存在者皆合理”之“定理”，AK 20:58–59）。因此，他此时的上帝之思，多半围绕一个能充分容纳这幅修订宇宙图景的上帝概念，以及该存在者与自然的关系概念。此外，他试图排解启示同哲学、自然科学之间关于权威的争执，其分量同样不轻。
