      As discussed through this subsection, Kant’s views on the postulate of immortality through the Critical period involve these three core issues: (a) the standard for moral worth articulated by Kant in various texts; (b) whether Kant continues to regard the highest good as a distribution of happiness in proportion to moral worth versus as maximal happiness and maximal morality as two independent variables; and (c) whether or not the distribution of happiness (especially if taken as proportionate to moral worth) depends upon the postulate of immortality (i.e., cannot take place within the causal order of nature). Beyond these three core issues, further issues include: (d) the limitations to and relevance of our speculations about the nature of the afterlife (see AK 6:69n–6:71n [1793] and AK 8:328–332 [1794]) and (e) the historical backdrop for Kant’s engagement with various models of the afterlife (see Bunch 2010)[^bunch-2010].
