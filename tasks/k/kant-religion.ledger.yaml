      第四，放弃论的支持者断言，康德不再需要不朽设准（也许还有上帝设准），因为他在 1790 年代进一步放弃了早先那种“幸福按道德价值比例分配”的至善图景，转而采纳“这一理想由最大幸福与最大道德两个独立变量构成”的观念。该主张的依据是他 1793 年的论文《论俗语：这在理论上也许正确，但在实践上无用》，康德在其中把至善描述为“普遍幸福与最纯粹的道德相结合、并与之相一致地贯穿全世界”（AK 8:279）。然而，一旦留意康德为此加上的脚注——他解释自己并非指幸福本身，“而只是它同主体配享性之间的比例”（AK 8:280n）——建立在这一段落上的解释价值便大打折扣。
