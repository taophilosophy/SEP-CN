      Crusius also rejected the Principle of Sufficient Reason and the Ontological Argument in terms that are very close to what we find in Kant’s writings of this period. Philosophers of this school developed a far more robust account of rational faith than is found in the writings of Wolff. Thus, in a way reminiscent of the later Kant, Crusius argues that we are necessitated to believe something if its denial would undermine or render impossible the pursuit of an end towards which we have a duty (Crusius 1751: §339)[^crusius-1751], the most important of which is our obligation to God (Crusius 1751: §345)[^crusius-1751]. This obligation, according to Crusius, necessitates, among other things, a belief in freedom, immortality and even in the reliability of reason itself (see Chance 2019)[^chance-2019].
    step1: |-
      克鲁修斯还以非常接近康德这一时期著作的措辞，拒绝了充足理由律与本体论论证。这一学派的哲学家对理性信仰发展出远比沃尔夫著作中更厚实的说明。因此，以一种令人想起晚年康德的方式，克鲁修斯主张：若否认某物会损害或使追求我们负有义务的某个目标的努力成为不可能，我们就被迫相信它（Crusius 1751: §339）[^crusius-1751]，而最重要的目标是我们对上帝的义务（Crusius 1751: §345）[^crusius-1751]。按克鲁修斯，这一义务除其他外迫使我们相信自由、不朽，甚至相信理性本身的可靠性（见 Chance 2019）[^chance-2019]。
    step2: |-
      克鲁修斯还以极近于康德此期著作的用语，否弃了充足理由律与本体论论证。这一学派对理性信仰的阐述，远比沃尔夫书中厚实。于是，克鲁修斯以令人想到晚年康德的方式主张：某项事物若被否认，便会破坏、或使追求我们负有义务之目标的努力不可能实现，我们便被迫相信它（Crusius 1751: §339）[^crusius-1751]；而首要的目标便是我们对上帝的义务（Crusius 1751: §345）[^crusius-1751]。按克鲁修斯，这项义务迫使人相信自由、不朽，乃至相信理性本身的可靠（见 Chance 2019）[^chance-2019]。
