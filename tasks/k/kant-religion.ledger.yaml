      The *ens realissimum* is thus the concept of an individual object that is completely determined in reason’s very concept of it. In arriving at this ideal, reason does not yet violate any of the standards Kant sets out within Transcendental Idealism, for here reason is merely applying the formal principle of complete determination to the thought of possible real predicates and constructing an idea (or more precisely, an ideal) of the ultimate ground of their reality. This construction can then be entertained by the intellect as a “faultless ideal” (A641/B669) and indeed serves it necessarily and positively as a regulative principle under certain critical restrictions. However, by itself, it is “a mere fiction, through which we encompass and realize the manifold of our idea in an ideal, as a particular being”, a move for which “we have no warrant, not even for directly assuming the possibility of such a hypothesis” (A580/B608). As with other transcendental errors, the traditional error behind the proof of the existence of such a being lies in the subreptive conflation of a subjective principle generated by our intellects and of genuine, though only regulative, use within the bounds of experience, with one that proves an objective, real being not constructed in thought, but discovered through thought and of absolute significance. In this case, one conflates the totality of the possible predicates of *empirical*things, which does indeed presuppose a collective physical ground of its empirical reality, with the largely empty idea of a totality of all possible predicates of things *as such,* and then concludes from the latter to the necessary existence of a ground of all reality as such. An error of this sort underlies, for instance, Spinoza’s illegitimate use of the concept of substance and similar mistakes found in monistic metaphysics.
