      The problem, thus, is not whether we can entertain coherent or even meaningful representations of supposed supersensible objects. It is, rather, by what standard we can determine whether these thoughts are mere idle fancies or perhaps something more. Absent experience or pure rational grounds of proof, reason would seem to be without a touchstone whereby its hypotheses could be tested. This is where Kant’s account of practical cognition steps in to fill the gap. Although largely overlooked until recently, Kant almost routinely asserts that we can practically cognize all sorts of supersensible objects, including freedom and God (AK 5:30 [1788], 5:353 [1790], 5:456 [1790], 5:474 [1790], 6:225 [1797–1798], 6:380n. [1797–1798], 6:418 [1797–1798], 8:418 [1796], 20:279–280, 20:301 & 311). As he writes, “I can indeed have no theoretical cognition of the supersensible, e.g., of God, but can yet have cognition by analogy, and such as it is necessary for reason to think” (AK 20:280). The standard for a particular analogical representation, which thus guarantees its status as genuine cogniton with “objective reality”, lies in the demonstration that there is necessary ground for reason to employ it rather than any other. And as its title indicates, the ground for such practical cognition always lies in the connection of a certain representation with the moral law itself, either insofar as it is necessary for representing its possibility (freedom) or the possibility of the object that it makes it necessary for the will to pursue (i.e., the highest good) (AK 5:4 [1788]).
    step1: |-
      因此，问题不在于我们能否对所谓超感性对象持有连贯甚至有意义的表象；问题在于，我们凭什么标准判定这些思想只是空想，还是也许另有分量。缺了经验或纯粹理性证明根据，理性似乎就没有试金石来检验其假设。正是在这里，康德的实践认识说明出场填补空缺。尽管直到晚近大多被忽视，康德几乎例行地断言我们可以实践地认识各种超感性对象，包括自由与上帝（AK 5:30 [1788], 5:353 [1790], 5:456 [1790], 5:474 [1790], 6:225 [1797–1798], 6:380n. [1797–1798], 6:418 [1797–1798], 8:418 [1796], 20:279–280, 20:301 & 311）。如他所写：“我确实不能有关于超感性者（例如上帝）的理论认识，但仍能有类比的认认，以及理性必须思维的那种认识”（AK 20:280）。某一类比表象之为真正认识（具有“客观实在性”）的标准，在于证明理性有必要的根据去使用它而非任何别的表象。而如其标题所示，这种实践认识的根据总在于某一表象与道德法则本身的联系——或因为该表象对表象其可能性（自由）是必要的，或因为它所使意志必须追求的对象（即至善）之可能性是必要的（AK 5:4 [1788]）。
    step2: |-
      所以，问题不在于我们能否持有关于所谓超感性对象的连贯、乃至有意义的表象；问题在于，凭什么标准判定这些思想只是空想，还是别有分量。若无经验、又无纯粹理性的证明根据，理性似乎就没有检验假设的试金石。康德关于实践认识的说明，正是在这里补缺。虽直到晚近多被忽略，康德几乎不厌其烦地断言：我们可以实践地认识种种超感性对象，包括自由与上帝（AK 5:30 [1788]、5:353 [1790]、5:456 [1790]、5:474 [1790]、6:225 [1797–1798]、6:380n. [1797–1798]、6:418 [1797–1798]、8:418 [1796]、20:279–280、20:301 & 311）。他写道：“我固然不能有关于超感性者（如上帝）的理论认识，却能有类比的认认，以及理性必须思维的那种认识”（AK 20:280）。某一类比表象何以算真正的认识（具“客观实在性”），标准在于证明理性有必要的根据使用它、而非别的表象。如其标题所示，这种实践认识的根据总系于某一表象与道德法则本身的关联：或是该表象为表象其可能性（自由）所必需，或是为该表象使意志必须追求的对象（即至善）之可能性所必需（AK 5:4 [1788]）。
