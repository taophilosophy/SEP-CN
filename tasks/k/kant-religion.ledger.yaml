      Note that while there are a considerable number of texts where Kant endorses the need for religious assent, we may nevertheless distinguish between a number of positions. One holds that the adoption of a belief-state that is more akin to the symbolic use of the postulates, adopting them only in the form of an “as if”, without a commitment to their objective reality (Ferreira 2014)[^ferreira-2014]. The most famous indication of the “as if” attitude appears at 4:448. Another position (Pasternack 2011, Insole 2016)[^insole-2016][^pasternack-2011] is that Kant regarded faith as including a commitment to the objective reality of its objects. Passages in support of this view include AK 5:4 & 5:134 [1788], AK 5:456 & 5:469 [1790], AK 8:139 [1785a], AK 20:299. Note further that the spirit behind the “as if” attitude may be reemerging in a new form within the recent interest in Kant’s conception of moral hope.
