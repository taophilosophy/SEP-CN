      Finally, among the personal influences on Kant’s view of religion, whether positive or negative, there must be numbered his long associations with Johann Georg Hamann (1730–1788) and Johann Gottfried Herder (1744–1803). Hamann, who at points was part of Kant’s small circle of friends, fiercely defended a mystical fideism and railed against the Enlightenment’s confidence in reason. Through both his published writings and his direct personal contacts, Hamann continually challenged Kant to develop and defend his own views regarding the relation between faith and reason, often drawing support from the skepticism of David Hume (see e.g., Hamann’s letters to Kant dated 27 July 1759 [AK 10:7–17; C 47–54] and December 1759 [AK 10:26–31; C 61–66; also Kuehn 2001: 118–126)[^kuehn-2001]. Although less radical in outlook, Herder played a similar role, particularly later in Kant’s life.
    step1: |-
      最后，在对康德宗教观产生影响的个人因素中，无论正面还是负面，还必须算上他与约翰·格奥尔格·哈曼（1730–1788）和约翰·戈特弗里德·赫尔德（1744–1803）的长期交往。哈曼有时是康德小圈子中的一员，他激烈辩护一种神秘主义的信仰主义，痛斥启蒙对理性的信心。通过已刊著作与直接的个人接触，哈曼不断挑战康德去发展与辩护自己对信仰与理性之关系的看法，常借大卫·休谟的怀疑论为助（例如见哈曼 1759 年 7 月 27 日致康德书［AK 10:7–17; C 47–54］与 1759 年 12 月书［AK 10:26–31; C 61–66; 亦见 Kuehn 2001: 118–126］）[^kuehn-2001]。赫尔德的观点虽不那么激进，却起了类似的作用，尤其是在康德晚年。
    step2: |-
      最后，论及个人因素对康德宗教观的影响——无论正面负面——还得算上他与约翰·格奥尔格·哈曼（1730–1788）、约翰·戈特弗里德·赫尔德（1744–1803）的长期往来。哈曼一度是康德小圈子里的朋友，他悍然捍卫神秘主义的信仰主义，痛诋启蒙对理性的信心。无论是著书立说还是当面交谈，哈曼都不断逼康德形成并辩护自己对信仰与理性关系的看法，且常借大卫·休谟的怀疑论助阵（例如见哈曼 1759 年 7 月 27 日与 12 月致康德书［AK 10:7–17; C 47–54］［AK 10:26–31; C 61–66; 亦见 Kuehn 2001: 118–126］）[^kuehn-2001]。赫尔德见解虽较温和，作用却相仿，尤其康德晚年。
