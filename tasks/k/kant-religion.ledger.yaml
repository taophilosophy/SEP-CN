      Kant’s doctrine of the highest good is the foundation of his positive philosophy of religion. With the exception of some musings (esp. in the *Critique of Pure Reason*) about an assent driven by our regulative employment of purposiveness (cf. B426, A670/B698 and A826/B854), the path to religion is through the highest good. This doctrine grounds Kant’s endorsement of belief in God’s existence as well as in the immortality of the soul. It is also through this doctrine that Kant sets out what in the *Religion* he calls the Pure Rational System of Religion. Therein, Kant appraises Christian doctrines to determine whether or not they are conducive to our duty to pursue the highest good (see section 3.6.4 and section 3.7 below).
    step1: |-
      康德的至善学说是其肯定性宗教哲学的基础。除了某些关于由我们调节性地运用合目的性所驱动的认同的思考（尤其在《纯粹理性批判》中，参 B426, A670/B698 与 A826/B854）之外，通向宗教的道路是经由至善的。这一学说为康德认可对上帝存在与灵魂不朽的信念奠基。也正是通过这一学说，康德提出了他在《宗教》中所谓纯粹理性的宗教体系。在其中，康德评价基督教教义，以判定它们是否有助于我们追求至善的义务（见下文 3.6.4 节与 3.7 节）。
    step2: |-
      康德的至善学说是其肯定性宗教哲学的地基。除了若干关于“由我们调节性地运用合目的性所驱动的认同”的思忖（主要在《纯粹理性批判》中，参 B426、A670/B698、A826/B854）之外，通往宗教的路都经由至善。这一学说为康德认可“上帝存在”与“灵魂不朽”的信念奠定基础；也正是借它，康德提出了《宗教》中所谓纯粹理性的宗教体系。他在其中评断基督教教义，看它们是否有助于我们追求至善的义务（见下文 3.6.4 节与 3.7 节）。
