      Yet, this does not leave us with agnosticism either. Along with knowledge and opinion, Kant identifies faith as our third legitimate mode of holding-to-be-true [*Fürwahrhalten*] it is this that properly applies to cases of practical cognition (excluding possibly freedom). Faith is, for Kant, a mode of justified assent although the nature of its justification, which lies in a certain connection between a representation and the moral law, is quite different from opinion and knowledge. That connection is not rooted in experience or argument, but rather in what he characterizes as the “needs” of practical reason. Hence, for Kant, religious faith finds its proper seat not in intellectual reflection but in our practical lives.
    step1: |-
      然而，这也没有把我们留给不可知论。与知识、意见并列，康德把信仰认定为我们第三种正当的“视为真”［*Fürwahrhalten*］方式；正是它恰当地适用于实践认识的情形（也许自由除外）。对康德而言，信仰是一种有正当根据的认同方式，尽管其正当根据的性质——在于某一表象与道德法则之间的某种联系——与意见和知识颇为不同。那种联系并不植根于经验或论证，而植根于他所刻画的实践理性的“需要”。因此，对康德来说，宗教信仰的恰当位置不在理智反思，而在我们的实践生活。
    step2: |-
      但这也不把我们抛给不可知论。与知识、意见并列，康德把信仰列为第三种正当的“视为真”［*Fürwahrhalten*］方式；实践认识的情形（或许自由除外）正归它管。在康德那里，信仰是有正当根据的认同，只是其正当根据的性质——某些表象与道德法则的关联——迥异于意见与知识。这关联不植根于经验或论证，而植根于他所谓实践理性的“需要”。因此，宗教信仰的正当位置不在理智反思，而在我们的实践生活。
