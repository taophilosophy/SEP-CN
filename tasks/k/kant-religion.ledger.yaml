      A fourth interpretative position is that the aim of *Religion* is to (a) examine the scope of “unity” or “compatibility” between rational religion and historical faith and (b) evaluate which aspects of historical faith (with Christianity being the primary focus) are apt vehicles for rational religion versus those which are incompatible with it (Pasternack 2014)[^pasternack-2014]. Hence, the *Religion* was not written as a Christian apologetic, but rather is Kant’s inquiry into the relationship between natural theology and revealed religion. However, unlike the many other such inquiries written during the era, Kant’s own version of natural theology is one that is shaped by moral rather than theoretical reason.
    step1: |-
      第四种解释立场是：《宗教》的目的在于（a）考察理性宗教与历史信仰之间“统一”或“相容”的范围，并（b）评估历史信仰（以基督教为主要焦点）的哪些方面是理性宗教的恰当载体，哪些与之不相容（Pasternack 2014）[^pasternack-2014]。因此，《宗教》并非作为基督教护教论而写，而是康德对自然神学与启示宗教之关系的探究。然而，与该时代许多同类探究不同，康德自己的自然神学版本由道德理性而非理论理性塑造。
