  - id: 15
    kind: body
    source: |-
      Of Kūkai’s so-called theoretical works, the philosophically most significant are *Benkenmitsu nikkyōron*, *Himitsu mandara jūjūshinron*, *Hizō hōyaku*, *Sokushinjōbutsugi*, *Shōjijissōgi*, and *Unjigi*. The former three provide comparative analyses exploring what distinguishes Shingon esoteric Buddhism from other forms of religious thought and practice, including the exoteric forms of Buddhism. The latter three are expositions of the Shingon worldview and its concepts, and are grouped together to comprise the so-called *Sanbu-sho* (“Three Writings”). *Benkenmitsu nikkyōron* (2 vols.) written in 814/815 sets forth the differences between esoteric and exoteric Buddhism to emphasize the superiority of the former. Starting from this foundation (i.e. of the distinction and superiority of the esoteric standpoint), Kūkai composed the *Sanbu-sho*, in rapid succession from around 821 to 824. These “Three Writings” provide expositions of what commentators have called the “metaphysics” of Shingon, dealing in detail with the three so-called mysterious aspects of the cosmic truth (Dharma): its “body, speech, and mind.” *Sokushinjōbutsugi* explicates the concept of *sokushinjōbutsu* or enlightenment in one’s immediate embodied existence. *Shōjijissōgi* and *Unjigi* are unique works of a “metaphysical linguistics.” They examine the interrelationship (which is ultimately non-dualistic) between the phenomenal world, its sounds (or “voices”) as “signs” (or “letters”), and reality itself, the “meaning,” they convey. In doing so, those two works explicate the Shingon concept of *hosshin seppō*, the Buddha’s preaching of the Dharma *via* cosmic phenomena. In fact all three of these “Three Writings” deal with the embodied realization of the Dharma. But they do this from the different angles of the microcosm of the human body and the macrocosm of the cosmic body. Embodiment then plays an important role in Kūkai’s Buddhism. As we shall see below, the embodiment of the Dharma as such also involves the incorporation of the mantra and the mandala along with other esoteric features. The work that represents the culmination of Kūkai’s thought, completed at the age of 57 in 830, is his *Jūjūshinron* (10 vols.) along with its abridged version, *Hizō hōyaku* (3 vols.). These two works position Shingon esotericism as the culmination of all Buddhist and religious standpoints. They make the grand claim that Shingon provides the most comprehensive view to truth, the Dharma. All other religious views on the other hand are mere approximations of that truth in various degrees and from various perspectives. Each religious standpoint then corresponds to a specific level of development of the human mind, which in ten states leads up to the enlightened mind. The final culminating stage of enlightenment then is what corresponds to Shingon doctrine as the most comprehensive, and hence “most true.” Nevertheless, the pre-Shingon and exoteric teachings each have their rightful place within this scheme so that they are not utterly discounted. In addition to the above-mentioned six major works, there is also Kūkai’s first work – written prior to his trip to China –, the *Sangōshīki*. This was his first look at Buddhism in comparison with Taoism and Confucianism. In the following however, I shall focus on Kūkai’s thought in the six major works. These are his mature works, and also universally recognized as his most important theoretical works.
    step1: |-
      在空海所谓的理论著作中，哲学上最重要的当属《辨显密二教论》《秘密曼荼罗十住心论》《秘藏宝钥》《即身成佛义》《声字实相义》与《吽字义》。前三部提供了比较性的分析，探讨真言密教有别于其他宗教思想与实践形态——包括佛教的显教形态——之处。后三部是真言宗世界观及其概念的阐述，合称所谓“三部书”（*Sanbu-sho*）。《辨显密二教论》（两卷）写于 814/815 年，陈说密教与显教之差异，以强调前者之优胜。以此为根基（即密教立场的殊异与优胜），空海自约 821 年至 824 年相继快速写成“三部书”。这三部书阐述了评论家们所称真言宗的“形而上学”，细致处理宇宙真理（法）的三个所谓的神秘方面：即“身、口、意”。《即身成佛义》阐明即身成佛（*sokushinjōbutsu*）这一概念，即在当下身体性的存在中成佛（开悟）。《声字实相义》与《吽字义》是“形而上学语文学”的独特著作。它们考察现象世界、其作为“符号”（或“文字”）的声音（或“音声”）、与它们所传达的作为“意义”的实在本身之间的相互关系（归根到底是不二的）。由此，这两部著作阐明了真言宗的法身说法（*hosshin seppō*）概念，即佛陀经由宇宙现象而对法的宣说。事实上，这“三部书”全部处理法的身体性实现，只是分别从人身之微观宇宙与宇宙身之宏观宇宙的不同角度入手。如此，“身体性”在空海佛教中扮演着重要角色。如下文所示，法本身的身体性还涉及真言与曼荼罗以及其他密教要素的纳入。代表空海思想之极致的著作，是 830 年、57 岁时完成的《十住心论》（十卷）及其缩略本《秘藏宝钥》（三卷）。这两部著作把真言密教置于一切佛教与宗教立场的顶点。它们宣称：真言宗提供了对真理——法——的最全面的观点；而所有其他宗教观点，只是从不同程度、不同视角对那一真理的近似。每一宗教立场对应于人类心灵发展的特定层级，后者经过十个状态而达至觉悟之心。于是，觉悟的最终顶点阶段对应于最全面的、因而在“最真”意义上的真言宗教义。不过，前真言与显教的教诲在这一架构中各有其应得的位置，因而并未被全然抹杀。除上述六部主要著作外，还有空海赴华之前写成的第一部著作《三教指归》（*Sangōshīki*）。这是他初次以佛教对照道教与儒教。不过下文我将聚焦于六部主要著作中的空海思想。这些是他的成熟之作，也被公认为他最重要的理论著作。
    step2: |-
