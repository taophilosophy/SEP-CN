      Kūkai’s claim was that this esoteric method of ritual-bodily-meditational practice – involving the three media (or “mysteries”) of body, speech, and mind – will allow one to realize one’s direct embodied participation in the Dharmic *samadhi* of the *hosshin*, i.e., “enlightenment in this very embodied existence” (*sokushinjōbutsu*). The lack of any systematic esoteric ritual practice in exoteric Buddhism – from Kūkai’s perspective, their rituals were unsystematized, haphazard –, fails to lead to immediate enlightenment. Moreover the orthodox teaching of the exoteric schools was that it would take innumerable rebirths of training until one could attain Buddhahood. Kūkai instead claimed that esoteric Buddhism, with its rituals and meditational methods, can lead one, regardless of *karmic* dispositions, to instant enlightenment “in this very body.” Through *yogic* and *mantric* practices involving the body, the practitioner was to eliminate all attachments to the substantiality of self and of things and to their dichotomization – this for the sake of immediately realizing non-duality with the *hosshin*. In this way the idea of *sokushinjōbutsu* is put forth as a major distinguishing characteristic of esoteric from exoteric Buddhism, demonstrating the possibility of attaining enlightenment in one’s *presently* embodied existence in distinction from the long and gradual process over countless aeons of rebirths as taught by the exoteric schools.
    step1: |-
      空海主张，这种涉及身、口、意三媒介（或“三密”）的仪轨-身体-禅修实践，将使人实现自己直接以身体参与法身的法性三昧，即“在当下这个具身存在中觉悟”（*sokushinjōbutsu*）。显教中缺乏任何系统的密教仪轨实践——从空海的角度看，他们的仪轨未经系统化、杂乱无章——因而无法引向即时的觉悟。而且显教诸宗的正统教法是，需要无数次转生修行才能成佛。空海则相反地主张，密教以其仪轨与禅修方法，不论业力倾向如何，都能引导人“在此身中”即刻开悟。通过涉及身体的瑜伽与真言实践，修行者要消除对自我与事物之实体性的一切执著，以及对二者的二分执著——这是为了当下实现与法身的不二。这样，即身成佛的观念就被提出，作为密教区别于显教的一大特征，表明人有可能在目前具身的存在中达到觉悟，这与显教诸宗所教的历经无数大劫转生的漫长渐进过程不同。
    step2: |-
      空海主张：这一仪轨-身体-禅观三合一的密教方法——涉及身、口、意三媒介（“三密”）——将使人亲证自己直接以身参与法身的法性三昧，即“于此具身存在中成佛”（*sokushinjōbutsu*）。显教缺乏任何系统的密教仪轨实践——在空海看来，其仪轨未经系统化、杂乱无章——故不能引生当下觉悟。且显教诸宗的正统教说认为，须经无量次转生修行方能成佛。空海则主张，密教以其仪轨与禅观方法，无论业性如何，皆能引人在“此身”中即得顿悟。经由涉及身体的瑜伽与真言实践，修行者要断除对自我与诸事物之实体性的执著、对二者的二分执著——为的是当下证得与法身的不二。如是，即身成佛之说被树立为密教区别于显教的主要特质，表明人可以在此生此身的存在中成佛，而有别于显教所教的历无量劫转生的漫长渐进过程。
