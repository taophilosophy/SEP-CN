      ## 1. Biography
    step1: |-
      ## 1 传记
    step2: |-
      ## 1 生平
  - id: 3
    kind: body
    source: |-
      Kūkai grew up during the Nara period (710–784CE) when the Nara Buddhist schools flourished and the country was centralized under the rule of the imperial family. And he was active during the beginning of the Heian period (794–1185CE) when institutionalized Nara Buddhism underwent reform due to the influence of newer ideas coming from China, including Kūkai’s own importations. He comes from an aristocratic family, the Saeki, and as a boy, he was educated by his maternal uncle, a Confucian scholar. At the age of seventeen or eighteen, he entered the state university at the then-capital Nagaoka but was soon disillusioned with its Confucian education. He suddenly dropped out of the university and retired into the natural setting of the mountains, where as legend has it, he devoted himself to various forms of esoteric practices. A few years later at the age of 24, he completed the final version of his first treatise, the *Sangō shīki* (*Indications of the Goals of the Three Teachings*) that covers and compares the teachings of Confucianism, Taoism, and Buddhism. Herein one can discern Kūkai’s reasons for turning from Confucianism to Buddhism. In the text, Kūkai relates how as a student he met a Buddhist priest who taught him an esoteric meditative practice called the *Kokūzōgumonji no ho* (“Ākāśagarbha’s method for seeking hearing and retaining”), which involved the recitation of a mantra a million times and was supposed to endow the practitioner with miraculous powers of memory and understanding.
    step1: |-
      空海成长于奈良时代（710–784年），当时奈良的佛教诸宗派正值兴盛，国家在皇室统治下实现了中央集权。而他的活动则始于平安时代（794–1185年）之初，那时制度化的奈良佛教因来自中国的新思想——包括空海自己传回的学问——的影响而经历改革。他出身贵族佐伯氏，少年时师从其舅父，一位儒学学者，接受教育。十七八岁时，他进入当时都城长冈的大学寮就读，但很快就对那里的儒学教育感到失望。他突然从大学退学，隐入山野自然之中，据传说，他在那里潜心修习各种形式的密教修行。几年后，24岁的他完成了第一部著作《三教指归》（*Sangō shīki*）的最终版本，此书涵盖并比较了儒教、道教与佛教的教义。从中可以看出空海由儒学转向佛教的缘由。书中空海自述，学生时代的他遇到一位僧人，僧人传授他一种密教禅修法门，名为“虚空藏求闻持法”（*Kokūzōgumonji no ho*），修此法须持诵真言百万遍，据说能赋予修行者记忆与理解的神奇力量。
    step2: |-
      空海成长于奈良时代（710–784 年），彼时奈良佛教诸宗兴盛，国家在皇室治下归于中央集权；而他的活跃期则始于平安时代（794–1185 年）初期，此时制度化的奈良佛教正因中国新思想的传入——其中就有空海本人携归的学问——而兴起改革。他出身贵族佐伯氏，少年时代受教于舅父，一位儒学学者。十七八岁时，他进入当时都城长冈京的大学寮，却很快对其儒学教育心生幻灭。他骤然退学，遁入山野，相传在那里专志修习种种密教法门。数年之后，24 岁的他写定平生第一部论著《三教指归》（*Sangō shīki*）的最终稿，此书总揽并比较儒、道、佛三教教义，空海由儒入佛的缘由于此可见。书中他自述求学期间曾遇一位僧人，教他修习称作“虚空藏求闻持法”（*Kokūzōgumonji no ho*）的密教禅法——此法须持诵真言百万遍，相传能赋予行者超凡的记忆与领悟之力。
  - id: 4
    kind: body
    source: |-
      What Kūkai found in Buddhism was a concrete path towards enlightenment (and liberation from suffering) that involves bodily practice and direct experience rather than mere theoretical speculation. Kūkai however did not involve himself in the official schools of the Nara Buddhist orthodoxy for they emphasized the exegetical study of the scriptures without providing any theoretical grounding for ritual practice. Instead he remained in the remote mountain regions of his native Shikoku as an unofficial and privately ordained mendicant. It appears that between the ages of 24 and 31, he wandered through its various mountains and sacred sites, practicing asceticism. Noticing the many different branches and *sūtras* (scriptures) of Buddhism, he hoped to find its unifying essence that would also bridge the gap between ritual and experience on the one hand and doctrine and theory on the other hand. It was during this search that he came across the mid-seventh century esoteric Buddhist text of the *Dainichi-kyō* (Skrt: *Mahāvairocana Sūtra*; Chn: *Ta-ji Ching*; “Great Sun scripture”). Intuiting that this text, with its dual emphasis upon esoteric practice and doctrine, would provide the kind of knowledge that he was seeking, Kūkai decided to travel to China to study it.
    step1: |-
      空海在佛教中发现的，是一条通向开悟（以及从苦中解脱）的具体路径，它诉诸身体的修行与直接的经验，而非单纯的理论思辨。然而空海并未投身奈良佛教正统的官办诸宗，因为那些宗派只重经典的注疏之学，却不为仪礼修行提供任何理论根基。他转而留在故乡四国的深山之中，做一名非官方的、私下受戒的乞食行者。看来在24岁到31岁之间，他遍历四国的诸山与圣地，修持苦行。注意到佛教支派与经典（*sūtras*）之繁多，他希望找到一种能把诸派统一起来的精髓，使仪礼与经验、教义与理论之间的鸿沟得以弥合。正是在这一寻求中，他遇到了七世纪中叶的密教经典《大日经》（*Dainichi-kyō*；梵：*Mahāvairocana Sūtra*）。他直觉到，这部经典对密教修行与教义的双重强调，恰好能提供他寻求的那种知识，于是决意前往中国研习。
    step2: |-
      空海在佛教中所寻得的，是一条通向开悟——亦即脱离诸苦——的具体道路：这条道路诉诸身体的践行与切身的证验，而非徒然的理论玄思。不过，空海没有投身奈良佛教正统的官办宗门，因为这些宗派偏重经典的注疏研究，却未能为仪礼实践提供任何理论根据。他宁肯栖身故乡四国的偏僻山区，做一名不入官籍、私自受戒的托钵行者。在 24 岁至 31 岁之间，他遍历四国诸山与各处圣地，修习苦行。面对佛教支派林立、经典（*sūtra*）浩繁的局面，他希望寻得一种贯通诸派的精髓，既能弥合仪礼与体验的隔阂，也能弥合教义与理论的隔阂。正是在这种求索中，他遇见了七世纪中叶的密教经典《大日经》（*Dainichi-kyō*；梵文题 *Mahāvairocana Sūtra*）。他直觉到：此经兼重密教修行与教义两面，正能给出他所追寻的那种知识，于是决意赴华研习。
  - id: 5
    kind: body
    source: |-
      It was only in 804 at the age of 30 or 31 that Kūkai was thus officially ordained so that he could travel with an official government embassy to China. He travelled to Ch’ang-an, the great cosmopolitan capital of the T’ang (Tang) dynasty, where he resided for thirty months. During this period, he studied Indian Buddhism, Hindu teachings, and Sanskrit with two Indian monks. But more significantly he met Hui-kuo (Huiguo; Jpn: Keika) (746–805), the seventh patriarch of Chen-yen (Zhenyan; Jpn: Shingon; Skrt: Mantrayāna) Buddhism, from whom he received initiation into the two lineages of Chen-yen esoteric Buddhism, one centered around the Vajradhātu (Diamond realm) mandala based on the *Vajraśekhara Sūtra* (“Adamantine {or Diamond} Pinnacle scripture”) and the other focussing upon the Garbha (Womb) mandala based on the *Mahāvairocana Sūtra*. Kūkai’s accomplishment during his stay in China is phenomenal in that not only did he manage to succeed Hui-kuo in becoming the eighth patriarch of esoteric Buddhism, he also managed to study Sanskrit, Chinese poetry and calligraphy, and various other minor arts.
    step1: |-
      直到804年，30岁或31岁的空海才正式受戒，得以随官方政府使节团赴中国。他抵达唐朝（Tang）气象恢宏的国际都会长安，在那里居住了三十个月。期间他随两位印度僧人研习印度佛教、印度教教义与梵文。更重要的是，他遇见了惠果（Huiguo；日语读作 Keika）（746–805）——真言宗（Chen-yen；日语 Shingon；梵 Mantrayāna）佛教的第七代祖师，从他受入真言密教两系传承：一系以依《金刚顶经》（*Vajraśekhara Sūtra*）而立的金刚界（Vajradhātu，金刚界）曼荼罗为中心，另一系专注于依《大日经》（*Mahāvairocana Sūtra*）而立的胎藏（Garbha，胎藏界）曼荼罗。空海留华期间的成就堪称惊人：他不仅继承了惠果的法位，成为密教第八代祖师，还研习了梵文、汉诗、书法以及各种其余技艺。
    step2: |-
      直到 804 年，年届三十的空海方才正式受戒，得以随官方遣唐使团西渡中国。他来到唐朝气象恢宏的国际都会长安，一住三十个月。其间，他随两位印度僧人研习印度佛教、印度教义与梵文。尤为关键的是，他拜见了惠果（Huiguo；日语读作 Keika，746–805）——真言宗（Chen-yen；日语 Shingon；梵 Mantrayāna）第七代祖师——从他受入真言密教两大传承：其一以依《金刚顶经》（*Vajraśekhara Sūtra*）建立的金刚界曼荼罗为中心，其二以依《大日经》（*Mahāvairocana Sūtra*）建立的胎藏曼荼罗为归趣。空海留华期间的成就堪称卓异：他不仅得惠果衣钵而嗣为密教第八祖，更兼习梵文、汉诗、书法及诸般杂艺。
  - id: 6
    kind: body
    source: |-
      Kūkai returned to Japan in 806 at the age of 33. He arrived in Kyushu with a voluminous amount of sūtras, collections of mandala paintings, treatises and commentaries, books of poetry, and ritual paraphernalia. In Kyushu, he composed the *Shorai mokuroku* (*A Memorial Presenting a List of Newly Imported Sūtras and Other Items*) that gives a brief account of his activities in China, describes what distinguishes esoteric Buddhism, and lists the items he had collected and brought back to Japan. However he was not permitted to enter the capital due to political unrest and was obliged to remain in Kyushu for another three years. Only with the retirement of Emperor Heizei (r. 806–809), did the new Emperor Saga order Kūkai in 809 to move to the new capital of Kyoto to reside at Takaosan-ji, the center of the Kyoto Buddhist world, where he remained until 823. Under the patronage of the new emperor, Kūkai became appointed over the years to various administrative positions of several important official temples. This allowed him to perform the first public esoteric ritual for “nation-protection,” followed by other public esoteric ceremonies, including mass initiation rituals and the founding of an annual ritual (the *Mishuhō*) to be held at court, hence gaining official recognition for the efficacy of esoteric Buddhism and preparing the rise of Buddhism as an ideological force in medieval Japan.
    step1: |-
      空海于806年返回日本，时年33岁。他抵达九州时带回了大量经典、曼荼罗画集、论书与注疏、诗集以及法器。在九州期间，他写成《御请来目录》（*Shorai mokuroku*），简要记述自己在中国的活动，说明密教的独特之处，并列出他搜集带回日本的物品清单。然而由于政局动荡，他未能获准入京，只得又在九州滞留三年。直到平城天皇（806–809在位）退位，新即位的嵯峨天皇才于809年命空海迁至新都京都，入住京都佛教界的中心高雄山寺，他在那里一直住到823年。在新天皇的庇护下，空海数年间陆续受任几座重要官寺的各种行政职务。这使他得以举行第一场公开的“镇护国家”密教法会，随后又有其他公开的密教仪式，包括大众灌顶法会，以及创立每年在宫廷举行的御修法（*Mishuhō*），由此密教的灵验获得了官方承认，也为佛教在中世日本作为一种意识形态力量的兴起铺平了道路。
    step2: |-
      806 年，33 岁的空海归国。他在九州登岸，携回的经典、曼荼罗画作、论书注疏、诗集与法器不计其数。滞留九州期间，他撰成《御请来目录》（*Shorai mokuroku*），其中简述自己入唐求法的经历，阐明密教之所以为密教者何在，并开列携归日本的请来品清单。然而因政局动荡，他未被准入京城，不得不再滞留九州三年。及至平城天皇（806–809 在位）退位，新帝嵯峨天皇于 809 年敕命空海迁入新都京都，住持京都佛教界中枢高雄山寺，直至 823 年。在天皇的护持之下，空海历年相继受任数座重要官寺的行政要职，得以首开公开为“镇护国家”行密教法会之例，其后各种公开密教法会接踵而至：有万人受戒的大众灌顶，也有每年在宫廷定期举行的御修法（*Mishuhō*）。密教由此获得朝廷对其灵验的正式承认，也为佛教日后在中世日本兴起为一股意识形态力量准备了条件。
