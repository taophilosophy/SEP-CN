      Together these two mandalic forms depict the form of the cosmos as a dynamic process interrelating and uniting the transcendent and the mundane, the enlightened and the ignorant, Buddha and man, macrocosmos and microcosmos, matter and mind, pattern and wisdom. They visually represent two simultaneous overlapping aspects of enlightenment, variously described as emptiness and form, compassion and wisdom, object and subject, the dimension *from which* the practitioner is guided by the Buddha and the dimension *towards which* the practitioner evolves. In Kūkai’s reading, these are inseparable aspects of the *hosshin*, depicted in the two mandalas from different but non-dualistic perspectives. Enlightenment would be the experiential realization of their non-duality: *richi funi*. In Shingon practice, therefore the Taizō mandala (*rishin*) is hung on the east wall of the meditation hall; and the Kongōkai mandala (*chishin*) is hung on the west wall.
