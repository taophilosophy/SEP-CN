      In addition to its four forms of embodiment, Kūkai (in his *Sokushinjōbutsugi* chs. 3, 4, 5) systematically elucidates three aspects as belonging to the *hosshin* in its cosmic significance: the six universal elements (*rokudai*) as comprising its own body or somaticity (*hontai*), the four mandalas (*shimandara*) as constituting its “marks” or forms of appearance (*yōsō*), and the three mysteries (*sanmitsu*) constituting its functions (*sayō*). In all three aspects, there is involved an interrelationship of non-duality between its macro-cosmic significance and its micro-cosmic significance, that is, between the *hosshin* *qua* cosmos as a whole and the practitioner as a being forming a part of, and partaking in, the cosmos. The three aspects interpenetrate to make-up the macrocosmos while in their non-duality with cosmic constituents, they become manifest through successful Shingon practice and in one’s consequent enlightenment.
    step1: |-
      除四身之外，空海（在其《即身成佛义》第三、四、五章中）还系统阐明属于宇宙意义之法身的三个层面：六大（*rokudai*）构成其自身的身体或身体性（体大，*hontai*）；四曼荼罗（*shimandara*）构成其“相”或显现形态（相状，*yōsō*）；三密（*sanmitsu*）构成其作用（作业，*sayō*）。在所有这三个层面中，都涉及宏观宇宙意义与微观宇宙意义之间的不二关系：即作为整体宇宙的法身，与作为构成宇宙之一部分并分有宇宙的修行者之间的不二。这三个层面相互贯通而构成宏观宇宙；同时，凭借它们与宇宙构成要素的不二，它们经由成功的真言修行而显现，并在随之而来的觉悟中实现。
    step2: |-
      除四身之外，空海（在其《即身成佛义》第三、四、五章）又系统阐明了法身在宇宙论意义上所属的三个层面：六大（*rokudai*）构成它自身的身体亦即体大（*hontai*）；四种曼荼罗（*shimandara*）构成它的“相”亦即显现形态（相状，*yōsō*）；三密（*sanmitsu*）构成它的作用（作业，*sayō*）。三个层面无一不牵涉宏观宇宙意义与微观宇宙意义之间的不二关系——亦即作为整体宇宙的法身，与作为宇宙之一部分、分有宇宙的修行者之间的不二。三个层面互相贯通，共同构成大宇宙；又凭其与宇宙构成要素的不二，经由成功的真言修行而显现，并落实于随之而来的觉悟之中。
