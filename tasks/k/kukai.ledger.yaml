      9ᵗʰ state: “The mind of one who realizes the absence of substance within ultimate truth” (*goku mujishō-shin*): The state of Hua-yen with its standpoint of the mutual non-obstruction and interpenetration between the patternment (Chn: *li*; Jpn: *ri*) of all and the concrete thing-events (Chn: *shih*; Jpn: *ji*) on the basis of their emptiness, whereby one and many are non-dualistic. This non-duality is extended to the level of the entire *dharmadhātu*.
    step1: |-
      第九状态：“证悟究竟真理中无自性之心”（*goku mujishō-shin*）：华严的状态，其立场为：基于空，一切的理（汉语 *li*；日 *ri*，纹样）与具体事物（汉语 *shih*；日 *ji*）之间互不相碍、相互渗透，一与多因此不二。这一不二被扩展到整个法界（*dharmadhātu*）的层面。
    step2: |-
      第九住心：“证知究竟真理中无自性之心”（*goku mujishō-shin*，即“极无自性心”）：华严的状态，其立场是：基于空，一切的纹样之理（汉语 *li*；日 *ri*）与具体事物（汉语 *shih*；日 *ji*）互不相碍、相互涉入，一与多由此不二。这一不二延展到整个法界（*dharmadhātu*）的层面。
