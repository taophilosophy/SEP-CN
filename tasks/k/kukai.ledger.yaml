      This identification between Dainichi and *hosshin* held many implications for Kūkai, which became worked out in his various doctrines. For example, the equation of Dainichi’s body-and-mind with the cosmos itself also means the immanent presence of the Buddha within, and *as*, the body-and-mind of each and every one of us. And so Dainichi’s “enlightened mind” (*bodhicitta*) becomes synonymous with the Mahāyāna doctrine of “original enlightenment” (*hongaku*) within all beings. But as the Dharma signifies the interdependent origination, hence, emptiness (*kū*) of all beings, its embodiment may be said to be an “empty body.” We will examine these ideas in greater detail later.
