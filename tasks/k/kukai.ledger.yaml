  - id: 12
    kind: body
    source: |-
      Kūkai has been regarded as the first comprehensively philosophical thinker in Japanese intellectual history. The influence of Mahāyāna philosophy is noticeable but they are interpreted through the lens of Mantrayāna with its emphasis upon the inseparability of ritual practice from theoretical doctrine. Traditionally, his thought has been divided into the following aspects: 1) the theoretical (*kyōsō*) which explicates the uniqueness and distinction of esoteric Buddhism (*mikkyō*) as opposed to exoteric Buddhism (*kengyō*) and demonstrates its validity and efficaciousness; and 2) the practical (*jisō*), which prescribes his method of meditation and ritual. Ultimately however the theoretical and the practical are inseparable in Kūkai’s thought. Within the deep profundity and subtleties of his doctrine, one recognizes philosophical elements inherited from Madhyamaka, Yogācāra, T’ien-t’ai (Tiantai), and Huayen (Huayan) Buddhist thought. But with these are incorporated the elements of devotional piety and magico-esoteric practice even in his theoretical writings. What is especially pronounced and distinct in his thought is the significance of bodily experience and practice. Buddhist truths for Kūkai were not simply meant to be intellectually mused over but to be *experienced through bodily practice*. One might say then that for Kūkai it is the body that provides the medium whereby theory and practice, doctrine and ritual, thought and experience, are non-dualistic.
    step1: |-
      空海被公认为日本思想史上第一位全面具有哲学性的思想家。大乘（Mahāyāna）哲学的影响显而易见，但这些思想都是透过真言乘的透镜得到诠释的——真言乘强调仪礼实践与理论教义不可分离。传统上，他的思想被分为以下方面：1) 教相（*kyōsō*），阐明密教（*mikkyō*）相对于显教（*kengyō*）的独特与殊异，并论证其有效性与灵验性；2) 事相（*jisō*），规定他的禅定与仪式方法。然而归根到底，在空海的思想中，教相与事相不可分离。在其教义的深邃与精微之中，可以辨认出从中观（Madhyamaka）、瑜伽行（Yogācāra）、天台（Tiantai）与华严（Huayan）佛教思想继承而来的哲学要素。但即使在理论著作中，也揉入了虔信敬拜与法术密教实践的要素。在他的思想中特别显著而独特的一点，是身体经验与实践的意义。对空海而言，佛教真理不只是要用理智去冥想，更要**通过身体实践去体验**。可以说，对空海而言，正是身体提供了媒介，使理论与实践、教义与仪礼、思想与经验成为不二的。
    step2: |-
      空海向来被推为日本思想史上第一位真正全面的哲学思想家。大乘哲学的影响清晰可辨，但这些思想无不透过真言乘的透镜得到诠释——真言乘强调仪轨践行与理论教义密不可分。传统上，人们把他的思想分为两个层面：其一为教相（*kyōsō*），阐明密教（*mikkyō*）相对于显教（*kengyō*）的独特与殊胜，论证其有效与灵验；其二为事相（*jisō*），规定他本人的禅定与仪轨方法。然而究极而言，教相与事相在空海思想中本不可分。在其教义的深奥精微处，可以辨认出从中观（Madhyamaka）、瑜伽行（Yogācāra）、天台与华严诸派佛教思想承袭而来的哲学成分；但即使在他纯粹的理论著述中，也揉入了虔信与法术式密教修行的要素。空海思想中格外鲜明而独特的一点，是身体经验与身体践行之意义。在他看来，佛教真理不单单是供人冥思玄想的对象，而须**经由身体践行加以体验**。因此可以说，对空海而言，正是身体充当中介，使理论与实践、教义与仪轨、思想与经验归于不二。
