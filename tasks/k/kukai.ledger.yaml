      By 830 Kūkai has shifted his interest from an earlier focus upon the controversy between Madhaymaka and Yogācāra concerning the emptiness or existence of the dharmas and his critique of their view on language as not conveying truth (the Dharma), to evaluating Buddhist doctrines as a whole, including the other major Buddhist schools. This shift is most likely connected to the dispute on-going during that period between the founder of the Tendai school, Saichō, and the older Nara Buddhist schools. In providing a comprehensive scheme that would explain the place of each religious teaching as well as the place of esoteric Buddhism in relation to the other Buddhist doctrines, Kūkai aimed to demonstrate the significance of his version of Buddhism.
    step1: |-
      到 830 年，空海的兴趣已经从早先集中于中观与瑜伽行关于诸法空或有的争论、以及他对二者语言观不传达真理（法）的批判，转向对佛教教说的整体评估，包括其他主要佛教宗派。这一转向很可能与那个时期正在进行的天台宗创始人最澄与旧的奈良佛教诸宗之间的争论有关。通过提供一个综合的图式来说明每一宗教教说的位置，以及密教相对于其他佛教教说的位置，空海意在表明他那一种佛教的意义。
