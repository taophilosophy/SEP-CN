      This use and understanding of the mandala was another distinction of Shingon Buddhism differentiating it in Kūkai’s mind as esoteric from exoteric Buddhism. The mandala proves to be “a metaphor for a new envisioning of reality, self, and world” (Gardiner 2008, 44)[^gardiner-2008], a vehicle for the transformation of vision, whereby one *envisions* the world *as a mandala*. Kūkai’s contention was that exoteric teachings move the practitioner towards the central summit of the mandala, step-by-step from its own specific vantage point without taking a comprehensive view of the whole. Esoteric teachings on the other hand take the entirety of the cosmic mandala into one comprehensive view, allowing for the practitioner to leap, as it were, into the center to realize non-duality with the *hosshin*.
    step1: |-
      曼荼罗的这种使用与理解是真言佛教的另一特质，在空海心中把它与显教区别开来。曼荼罗被证明是“对实在、自我与世界的新构想的隐喻”（Gardiner 2008, 44）[^gardiner-2008]，是视觉转变的载体，由此人把世界**构想为曼荼罗**。空海的主张是：显教引导修行者逐步走向曼荼罗的中央峰顶，从其自身特定的视点出发而不取对整体的综观；密教则把宇宙曼荼罗的整体纳入一个综观，让修行者可以说一跃而入中心，证得与法身的不二。
    step2: |-
      对曼荼罗的这种使用与理解，是真言佛教另一特质——在空海心中，正是密教之于显教的分野所在。曼荼罗乃“对实在、自我与世界之新构想的隐喻”（Gardiner 2008, 44）[^gardiner-2008]，是视觉转变的载体：人由此**构想**世界**即是曼荼罗**。空海主张：显教引修行者一步一步走向曼荼罗的中央峰顶，从各自特定的视点出发，不对整体作综观；密教则把宇宙曼荼罗的整体收入一观，令修行者仿佛一跃而入中心，证得与法身的不二。
