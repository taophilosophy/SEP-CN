      The realization of enlightenment cannot be attained on one’s own. For one is not a substantial, i.e., ontologically independent, being to begin with. As the cosmos itself is a web of interdependently originating thing-events, nothing can stand alone to claim complete self-sufficiency. The same interdependency that obtains horizontally between the constituents of the cosmos also obtains vertically. That is, the whole is what it is in virtue of its parts just as the parts are what they are in partaking of the whole. The realization of enlightenment then as an event, as well as the relative degrees of spiritual development, entails a micro-cosmic and macro-cosmic correlativity. This is expressed in *Sokushinjōbutsugi*, ch. 5, in Kūkai’s notion of *kaji* (Skrt: *adhisthāna*), which has been variously translated as “empowerment” or “grace.” In religious (or devotional) terms, this is explained to involve *both* the Buddha’s great compassion and the practitioner’s piety, devotion, or faith, which in their correspondence, act together in the attainment of enlightenment. But one must keep in mind that *kaji* in itself is not necessarilly enlightenment because the empowerment is in proportion to the level of spirituality attained by the practitioner. Through such mutuality, one’s own effort partakes in the omnipresencing of the *hosshin*, realized in various degrees. This *mutuality* is expressed in the meanings of the two characters that make up *kaji*: *Ka*, literally meaning “adding” or “increasing,” is explained to be the Buddha’s compassion that pours down upon, entering into, the practitioner’s mind (*shin*) like sunrays on water. And *ji*, literally meaning “retaining” or “holding,” is explained to refer to the practitioner’s mind that keeps a-hold of, absorbs, the compassion just as water retains and reflects the sunlight. *Ka* is the *gift* that Dainichi *gives*; and *ji* is our acknowledgment of that gift by *cherishing* it. Practically speaking this becomes expressed in the bodily ritual training that the practitioners undergo as they strive to ascend “upwards,” to meet Dainichi’s compassionate descent “downwards.” In the terminology that becomes later popularized with Pure Land Buddhism, this would signify a mutuality and non-duality between self-power (*jiriki*) and other-power (*tariki*). The two movements are aspects of a single movement of enlightenment. In other words, one’s own striving *is* the “grace” of the Buddha helping one towards enlightenment. But this cannot simply be construed to mean one’s reliance upon other-power but entails that one must appropriate that “grace” in self-power. This mutuality of *kaji* is also expressed in Kūkai’s phrase, *nyūga ganyū* (“[Buddha] entering into me, and I entering [into Buddha]”).
    step1: |-
      觉悟的实现不能靠自己达到。因为人一开始就不是实体性的、即在本体论上独立的存在者。既然宇宙本身就是一张相互缘起的事物事件之网，就没有任何东西能独自站立而主张完全的自足。在宇宙诸构成成分之间横向上成立的相互依存，在纵向上也同样成立。也就是说，整体之所以为整体，是由于其部分；部分之所以为部分，是由于分有整体。觉悟之实现作为一个事件，以及精神发展的相对程度，于是都包含一种微观宇宙与宏观宇宙的相互关联。这在《即身成佛义》第五章中，表述为空海的“加持”（*kaji*；梵 *adhisthāna*）概念，此语有“赋能”或“恩典”等不同译法。就宗教（或虔敬）而言，此说被解释为兼摄佛陀的大悲与修行者的虔敬、虔诚或信心，二者在相应中共同作用于觉悟的获得。但必须记住，加持本身并不必然就是觉悟，因为赋能与修行者所达到的精神性水平成比例。通过这种相互性，自身的努力分有法身的遍在，并以不同程度的实现。这种**相互性**表现在构成“加持”二字的含义中：“加”字本义为“添加”或“增加”，被解释为佛陀的慈悲如阳光照在水上，倾注而进入修行者之心（*shin*）；“持”字本义为“保持”或“执持”，被解释为修行者之心执持、吸收那慈悲，正如水保持并映照阳光。“加”是大日**给予**的**赠礼**；“持”是我们以**珍重**来承认那赠礼。就实践而言，这表现在修行者所受的身体仪轨训练中，他们奋力“向上”升进，以迎接大日慈悲的“向下”降临。用后来随净土佛教流行起来的术语说，这将标示自力（*jiriki*）与他力（*tariki*）之间的相互性与不二。两种运动是同一觉悟运动的不同方面。换言之，自身的奋求**就是**佛陀助人成佛的“恩典”。但这不能简单解释为依赖他力，而是要求人必须以自力去取用那“恩典”。加持的这种相互性也表现在空海的“入我我入”（*nyūga ganyū*）一语中，即“（佛）入于我，而我入（于佛）”。
    step2: |-
      觉悟的实现不能凭自身而得。因为人首先并非实体性的、即在本体论上独立的存在。宇宙本身既是一张相互缘起的事物之网，便无物能独自树立而自称完足。宇宙诸成分之间横向的相互依存，同样也纵向地成立：整体之为整体，赖于其部分；部分之为部分，在于分有整体。于是觉悟之实现作为一个事件，以及精神修行的相对阶位，皆涵有微观宇宙与宏观宇宙的相互关联。这一点在《即身成佛义》第五章中，表述为空海的“加持”（*kaji*；梵 *adhisthāna*）概念，或译“赋能”，或译“恩典”。就宗教（或虔敬）而言，此说兼摄佛陀的大悲与修行者的虔敬、虔诚或信心，二者相应，共同作用于觉悟的获得。但须记住：加持本身不必即是觉悟，因为赋能与修行者所臻的精神水平成比例。经由这种相互性，自身的努力分有法身的遍在，而以种种程度实现。这种**相互性**表于“加持”二字的含义中：“加”字本义为“加添”“增上”，释为佛陀的慈悲如日光注水，倾注、进入修行者之心（*shin*）；“持”字本义为“执持”“保持”，释为修行者之心执持、吸纳此慈悲，如水之持受并映现日光。“加”是大日**所予**的赠礼，“持”是我们以**珍重**领受此礼。就实践而言，这表现为修行者所受的身体仪轨训练：他们努力“向上”升进，以迎接大日慈悲的“向下”降临。用后来随净土佛教流行的术语说，这标示自力（*jiriki*）与他力（*tariki*）之间的相互性与不二。两种运动是同一觉悟运动的两面。换言之，自身的奋求**即是**佛陀助人成佛的“恩典”。但这不能简单解为倚赖他力：它要求人必须以自力去取用那“恩典”。加持的这种相互性，也表于空海“入我我入”（*nyūga ganyū*）一语——“（佛）入于我，而我入（于佛）”。
