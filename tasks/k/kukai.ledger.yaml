      The world emerges in the articulation of the Dharma through such mutual differentiations in pattern. From out of the sea of emptiness, through Dainich’s articulation *qua* mutual interplay of the five material elements, the cosmos is ordered into distinct and discrete things and events, and the *hosshin* transforms itself into a legible – albeit ambiguous – cosmic (con)text. This linguistic cosmogeny is simultaneously ontological and me-ontological. For each thing as sign in differential reference to the rest of the cosmic text, mirrors the infinity of all the other mutually referring and mutually differing thing-events. In its own emptiness, each thing-letter mirrors the emptiness of the cosmos, i.e., the Dharma. They are traces of the *hosshin*’s omnipresencing non-substantiality, emptiness as the “primal non-originating” source of these thing-events in their beginningless and endless interrelations. Kūkai takes this linguistic cosmo-genesis in emptiness *via* the *hosshin*’s world-play, to be the meaning behind the “playful striding of great emptiness,” mentioned in the *Dainichi-kyō* (T18:21a) and which he quotes in his *Sokushinjōbutsugi*. Furthermore this cosmogeny that is an articulation of truth, the writing of the cosmic text, is open-ended and on-going, dynamically being continuously reworked. This accounts for the ambiguity of the cosmic text and every sign within it.
    step1: |-
      世界在法的宣说中、经由这样的纹样相互差别而生起。从空之海中，经由大日作为五大要素相互互动的宣说，宇宙被序化为相互区别、相互离散的事物与事件，法身则将自身转化为一个可读的——尽管含混的——宇宙（上）下文。这种语言的宇宙发生论同时是存在论的与非存在论的。因为每一事物作为符号，在对宇宙文本其余部分的差别指涉中，映照一切其它相互指涉、相互差别之事的无穷。在其自身的空之中，每一物之字母映照宇宙的空，即法。它们是法身遍在的非实体性的踪迹，即作为这些事物在其无始无终的相互关系中的“本不生”源头的空。空海认为，这种经由法身的世界游戏而在空之中的语言性宇宙发生，就是《大日经》（T18:21a）所提到、而他在《即身成佛义》（*Sokushinjōbutsugi*）中所引用的“大空的游戏步履”一语背后的意义。而且，这种作为真理宣说的宇宙发生——宇宙文本的书写——是开放的、进行中的，动态地被不断重写。这说明了宇宙文本及其间每一个符号的含混性。
