      The *Kongō-kai mandara* (Srkt: *Vajradhātu mandala*; “*Vajra*-realm mandala”) represents the “male priciple” and embodies the *vajra*-wisdom, a wisdom that is adamantine and imperishable and that illuminates and enfolds all beings. This symbolizes the sixth element, the mental element of *chi* (wisdom), referring to the mental realm of the knower, the subject of cognitive experience. But it also represents the Buddha’s adamantine power of illumination that realizes enlightenment, symbolized by the *vajra* (an adamantine weapon with many points). In this respect the mind it symbolizes is not only the practitioner’s mind but also the all-comprehensive mind of Dainichi as indestructible potentials of the cosmos, as the Buddha’s “embodiment of wisdom” (*chishin*).
    step1: |-
      金刚界曼荼罗（梵：*Vajradhātu mandala*；“*Vajra* 界曼荼罗”）代表“男性原理”，体现金刚智慧——一种金刚不坏、能照能摄一切众生的智慧。这象征第六种要素，即智（*chi*，智慧）的心之要素，指能知者的心之领域，认知经验的主体。但它也代表佛陀实现觉悟的金刚般照察之力，以 *vajra*（多齿的金刚杵）为象征。就此而言，它所象征的心不仅是修行者的心，也是大日作为宇宙不可摧毁之潜能的综观一切之心，即佛陀的“智慧之身”（*chishin*）。
    step2: |-
      金刚界曼荼罗（梵 *Vajradhātu mandala*，“*Vajra* 之界曼荼罗”）代表“男性原理”，体现金刚智——金刚不坏、照摄一切众生的智慧。此即第六要素——智（*chi*）之心的要素——的象征，指能知者的心灵领域、认知经验的主体一面。它又表佛陀证悟的金刚照察之力，以 *vajra*（多齿的金刚杵）为象征。就此而言，它所象征的心，不只是修行者之心，也是大日作为宇宙不可摧潜能的遍含之心——佛陀的“智慧之身”（*chishin*）。
