      8ᵗʰ state: “The mind of one who realizes harmony with the one path of truth” (*nyojitsu ichidō-shin* or *ichidō muishin*): The state of T’ien-t’ai with its standpoint of “oneness of all,” wherein one realizes that one moment contains eternity, a single thought contains all possible worlds, and a sesame seed contains a mountain, i.e. the non-duality between one and many; and between emptiness, dependent origination, and their “middle.”
    step1: |-
      第八状态：“觉悟与真如之一道相合之心”（*nyojitsu ichidō-shin* 或 *ichidō muishin*）：天台的“一切一”立场的状态。在这里，人证知一念包含永恒，一念思想包含一切可能的世界，一粒芝麻包含一座山，也就是一与多的不二，以及空、缘起与它们的“中道”的不二。
    step2: |-
      第八住心：“与真如唯一之道相契之心”（*nyojitsu ichidō-shin*，或 *ichidō muishin*，即“一道无为心”）：天台“一切一”立场的状态。在这里，人证知：一念含摄永恒，一念思想含摄一切可能的世界，一粒胡麻含摄一座大山——亦即一与多的不二，以及空、缘起与二者之“中道”的不二。
