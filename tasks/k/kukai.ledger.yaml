      In traditional Mahāyāna Buddhist theory, the Buddha is conceived in terms of three modes or forms of embodiments (*trikāya*): *dharmakāya* (Jpn: *hosshin*), *nirmanakāya*, and *sambhogakāya*. While originally the term *buddha*, meaning “enlightened one,” was reserved for Śakyamuni, the historical founder of Buddhism, it eventually came to designate the ideal for humanity. This ideal became equated with the “truth” (Skrt: *Dharma*; Jpn: *hō*), taught by the Buddha, of the nature of being. To be a “buddha” is then to be enlightened to that truth, which came to also mean the realization of one’s non-duality with the Dharma. It is in this significance that one way of understanding the Buddha is in terms of the universal “embodiment of the Dharma” (Skrt: *dharmakāya*; Jpn: *hosshin*). For traditional Mahāyāna, this *hosshin* is an abstract principle and hence impersonal and non-preaching. However as implied in the foregoing section, for Kūkai the *hosshin* is identified with the Buddha Dainichi. That is, in one aspect the *hosshin* may be understood to be a personal being who preaches the Dharma by concretizing it in the cosmos as his own body. (Of course though to avoid anthropomorphism, the *hosshin* cannot be reduced to this aspect.) In the traditional three-body doctrine, however, it is the other two forms of embodiment that preach. The Buddha, when regarded as embodying the Dharma in an historical earthly being, such as Śakyamuni, who preaches the Dharma to humans, is called the *nirmanakāya* (“embodiment of transformation”). And the Buddha as enjoying his fruits of enlightenment by residing in a celestial buddha-realm, while unfolding further truths for advanced bodhisattva beings and acting as a savior to the earthly, is called the *sambhogakāya* (“embodiment of bliss”). An example of would be Amida residing in his “Pure Land.”
    step1: |-
      在传统大乘佛教理论中，佛陀以三种身形（*trikāya*，三身）来构想：法身（梵 *dharmakāya*；日 *hosshin*）、应身（*nirmanakāya*）与报身（*sambhogakāya*）。虽然“佛”（*buddha*）一词——意为“觉悟者”——最初专指佛教的历史创始人释迦牟尼，但它最终指称人类应趋的理想。这一理想与佛陀所教导的关于存在本性的“真理”（梵 *Dharma*；日 *hō*，法）等同。成为“佛”即是对那一真理的觉悟，这也意味着实现自身与法的不二。正是基于这一意义，理解佛陀的一种方式便是普遍的“法之身”（梵 *dharmakāya*；日 *hosshin*）。对传统大乘而言，这一法身是抽象原理，因而是无位格的、不说法的。然而如上一节所暗示，对空海而言，法身即等同于大日如来。也就是说，法身在一个方面可以被理解为一位位格性的存在者，它把法具体化在宇宙中作为自己的身体，由此而说法。（当然，为避免拟人化，法身不能被还原为这一方面。）不过在传统的三身说中，说法的是另外两种身。被视为在一个历史性的地上存在者（如释迦牟尼）之中体现法、向人类说法的佛，称为应身（*nirmanakāya*，“变化之身”）；而居于天界佛国、为高级菩萨展开更进一步的真理并救助地上众生、同时享受觉悟果报的佛，称为报身（*sambhogakāya*，“受乐之身”）。后者的一个例子是住于其“净土”的阿弥陀佛。
    step2: |-
      在传统大乘佛教理论中，佛陀是从三种身相（即三身，*trikāya*）来构想的：法身（梵 *dharmakāya*；日 *hosshin*）、应身（*nirmanakāya*）与报身（*sambhogakāya*）。“佛”（*buddha*）一词本义“觉悟者”，最初专指佛教的历史创始人释迦牟尼，后来则指称人类所应趋赴的理想；这一理想又与佛陀所教导的“真理”——关于存在本性的法（梵 *Dharma*；日 *hō*）——相等同。所谓成“佛”，即是对那一真理的觉悟，这也意味着实现自身与法的不二。正循此意义，理解佛陀的一条路径便是普遍的“法之身”（梵 *dharmakāya*；日 *hosshin*）。在传统大乘那里，这一法身是抽象原理，故而是非位格的、不说法的。然而，正如上一节已暗示的，对空海而言，法身即是大日如来。也就是说，法身在一个层面上可以被理解为一个位格性的存在者：它把法具体化为宇宙、以之为自己的身体，由此宣说法要。（当然，为免于拟人论，法身不可被还原为这一层面。）不过在传统的三身说中，说法的乃是另外两种身。当佛被视为在一个历史性的地上人物（如释迦牟尼）中体现法并向人类说法时，称为应身（*nirmanakāya*，“变化之身”）；当佛居于天界佛土、为上位菩萨开显更深的真理并救护地上众生，同时受用觉悟的果报时，称为报身（*sambhogakāya*，“受乐之身”）。后者的例证，便是住于其“净土”的阿弥陀佛。
