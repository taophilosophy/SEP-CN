      With successful completion, this practice of the three mysteries, which initially has the aspect of “with form” (*usō*) – that is, in rituals –, comes to occur naturally, no longer restricted to its ritualized context. That is, the individual’s every action in daily life, without ritual form (*musō*), comes to intentionally reflect the enlightened body-and-mind of the Buddha and its three mysteries. Every word uttered is thus a mantra, every bodily movement a *mudra*, and every thought *samadhi*. It is in this culmination of bodily practice, that all of Kūkai’s major concepts, *hosshin seppō*, *hongaku*, *sanmitsu*, *sokushinjōbutsu*, *nyūga ganyū*, converge in the attainment of Buddhahood. While from the Shingon esoteric perspective, this attainment is instant, from another perspective, viewed in light of all other (i.e., exoteric) doctrines, the attainment is gradual and relative. We now turn to this final topic in our discussion of Kūkai, the development of the mind through ten states from the animal to the enlightened.
    step1: |-
      圆满成就之后，这一起初具有“有相”（*usō*）一面——即在仪轨之中——的三密实践，便自然发生，不再局限于其仪轨化的场合。也就是说，个人日常生活中的每一行动，离于仪轨之相（*musō*），而有意地映现佛陀觉悟的身心及其三密。于是每一句说出的话都是真言，每一个身体动作都是印契，每一个念头都是三昧。正是在这一身体实践的极致处，空海的一切主要概念——法身说法、本觉、三密、即身成佛、入我我入——汇归于成佛。从真言密教的视角看，此成就是顿然的；但从另一视角看，即依一切其他（显教）教说观之，此成就则是渐进的、相对的。现在我们转向讨论空海此文的最后一个题目：心自畜生至觉悟的十种状态中的发展。
