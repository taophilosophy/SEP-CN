      One of the most distinguishing characteristic of Kūkai’s Buddhist thought is his concept of *sokushinjōbutsu*, the attainment of enlightenment in this very embodied existence. This idea of *sokushinjōbutsu* represents the apex of Kūkai’s synthesis of Buddhist *theoria* and *praxis*. The doctrine itself is not explicit in the two major esoteric sūtras, the *Dainichikyō* and the *Kongōchōgyō*. The idea first appears rather in I-hsing’s commentary on the *Dainichikyō* (*Ta-jih Ching Su*; *Commentary on the Mahāvairocana Sūtra*). Kūkai was the first however to provide the idea with a systematic explication in his *Sokushinjōbutsugi*, which has been regarded by commentators as the most important of his philosophical expositions. Kūkai’s appropriation and systematic development of the theory takes the form of a unique philosophy of *praxis* that is simultaneously a philosophy of the body.
    step1: |-
      空海佛教思想中最具特色的一个方面是他的即身成佛概念，即在当下这个具身存在中达到觉悟。这个即身成佛的观念代表空海综合佛教理论与实践（*theoria* 与 *praxis*）的顶点。该教义本身在两部大密教经典《大日经》和《金刚顶经》中并不明确。这个观念首先出现于一行对《大日经》的注疏（*Ta-jih Ching Su*；《大毗卢遮那成佛经疏》）之中。然而，空海是第一个对这一观念给出系统阐释的人，见其《即身成佛义》，评注家认为这是他最重要的哲学阐述。空海对这一理论的采用与系统发展，采取了一种独特的实践哲学形态，同时也是一种身体哲学。
