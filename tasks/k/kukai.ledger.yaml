    source: |-
      Kūkai (e.g. in his *Sokushinjōbutsugi*, ch.3) discusses Dainichi as a “body of the six great elements” (*rokudaishin*, *rokudai-taidai*), which are the five universal material elements (*godai*) of earth, water, fire, wind/air, and space, representing the “known,” plus the universal mental element (*shindai*) of consciousness, representing the “knower.” Ultimately the five material elements make up the body of Dainichi and the sixth element designates the mind of Dainichi. Their dynamic but harmonious interplay constitute the “timeless yoga” or *samadhi* (Jpn: *jō*) of Dainichi’s body-and-mind. But since Dainichi is equated with the cosmos, all things comprising the whole world are generated and perish through the interplay – “non-obstruction” and “interfusion” – of these elemental constituents. Kūkai then is definitely not an *idealist* taken in its western philosophical significance, and Shingon thought in this aspect is distinct from the teachings of the “mind-only” (*Yuishiki*; Skrt: *Vijñapti-mātratā*) school of Buddhism. For the mental and the material, for Kūkai, are two non-dualistic (interpenetrating and mutually non-obstructing) aspects of the same Dharma – as depicted in the two mandalic embodiments, which we shall discuss below. In other words Kūkai does not reduce reality to either mind or matter; his perspective is neither merely idealist nor merely materialist.
    step1: |-
      空海（如在其《即身成佛义》第三章中）把大日讨论为“六大身”（*rokudaishin*，*rokudai-taidai*）：六大是地、水、火、风（气）与空这五大普遍的物质元素（五大，*godai*），代表“被知者”，再加上作为普遍心元素的识（识大，*shindai*），代表“能知者”。归根到底，五大物质元素构成大日之身，第六大指称大日之心。它们动态而和谐的相互作用，构成大日身心的“无时间瑜伽”即三昧（日 *jō*）。但由于大日等同于宇宙，构成整个世界的一切事物都经由这些元素性构成要素的相互作用——“无碍”与“交融”——而生灭。因此空海绝不是一个在西方哲学意义上理解的*唯心论者*，真言宗思想在这一方面区别于佛教“唯识”（日 *Yuishiki*；梵 *Vijñapti-mātratā*）宗的教义。因为对空海而言，心与物是同一法的两个不二的（相互贯通且相互无碍的）方面——正如将在下文讨论的两重曼荼罗之身所描绘的那样。换言之，空海不把实在还原为心或物；他的视角既非单纯的唯心论，也非单纯的唯物论。
    step2: |-
      空海（如其《即身成佛义》第三章）将大日论说为“六大身”（*rokudaishin*，*rokudai-taidai*）：其中地、水、火、风、空五普遍物质元素（五大，*godai*）代表“被知者”，识大（*shindai*）这一普遍心元素代表“能知者”。究极而言，五大物质元素构成大日之身，第六大则指称大日之心。六大动态而和谐地相互作用，构成大日身心的“无时间的瑜伽”，即三昧（日 *jō*）。既然大日即宇宙，构成整个世界的一切事物便都经由这些元素性构成要素的相互作用——“无碍”与“交融”——而生灭。故此，空海绝非西方哲学意义上的*唯心论者*；真言宗思想在此方面也区别于佛教唯识宗（日 *Yuishiki*；梵 *Vijñapti-mātratā*）的教义。对空海而言，心与物是同一法的两个不二的（相互贯通、相互无碍的）方面——下文将讨论的两重曼荼罗之身所描绘的正是这一点。换言之，空海不把实在还原为心或物；他的视角既非单纯唯心论，亦非单纯唯物论。
  - id: 38
    kind: body
    source: |-
      The interrelationship amongst the elements signifies their non-substantiality, i.e. the fact that they are not ontologically independent, and in Buddhist parlance this means “emptiness” (*śūnyatā*, *kū*). Hence all elements and things they constitute, including the entire cosmos is empty. Dainichi’s body, as the *hosshin* that embodies the Dharma, is an embodiment of emptiness, analogically understood as a vast empty space – it is in part analogical but also exemplary of emptiness. Rather than obstructing the emergence of things, this emptiness permits it through their interdependent origination, which is the meaning of emptiness. Their materiality is then just as real as their emptiness, and emptiness and matter are non-dualistic. True to the “middle way” of Buddhism, Kūkai treads a path that avoids reifying substantialism on the one hand as well as utter nihilism on the other hand. And in the non-dualistic interrelationships between body and mind, matter and emptiness, known and knower, the Dharma itself, as the truth of non-duality in interdependent origination *qua* emptiness is revealed in every physical and mental process of the cosmos as the embodiment of the Dharma.
    step1: |-
      元素之间的相互关系标示它们的非实体性，即它们在存在论上不独立这一事实；用佛教的术语说，这就是“空”（*śūnyatā*，*kū*）。因此一切元素及其所构成的事物，包括整个宇宙，都是空的。大日之身作为体现法的法身，是空的体现，可以类比地理解为一个浩大的虚空——它部分地是类比性的，同时也是空的范例。这一空不是阻碍事物的出现，而是经由它们的缘起容许其出现，这正是空的意义。于是它们的物质性与其空性同样真实，空与物质不二。忠实于佛教的“中道”，空海所走的路径既避免实体论的固化，也避免彻底的虚无主义。而在身与心、物质与空、被知者与能知者的不二相互关系中，法本身——作为缘起即空的非二真理——在宇宙的每一个物理与心理过程中显现为法的体现。
    step2: |-
