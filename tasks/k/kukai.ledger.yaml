      In this scheme, Kūkai is adamant in using the above-discussed concepts to distinguish esoteric from exoteric Buddhism. And yet, given a bird’s eye view, the truth, the Dharma, in Kūkai’s scheme is encompassing enough to include exoteric Buddhism and all other teachings as its unfoldings or manifestations, in relative degrees in accordance with the appropriate circumstance or context and the level of attainment. In order to explain the different levels or states (*jū*, literally “dwellings” or “lodgings”) of mind (*jūjūshin*) that correspond to the various doctrines of other schools and religious sects, Kūkai developed an hierarchical scheme. Shingon Buddhism is placed at the top of the hierarchy as providing the most comprehensive view to the Dharma. Kūkai provides this systematization in what many consider to be his *magnum opus*, *Himitsu mandara jūjūshinron* (*Treatise on the Secret Mandala of the Ten States of Mind*) in ten volumes, composed around 830, five years before his death. It was written in response to an order of Emperor Junna that each Buddhist sect present an introductory treatise of its teachings. When the text proved to be too difficult for the emperor, Kūkai produced an abridged and more accessible treatise on the same theme, *Hizō hōyaku* (*Precious Key to the Secret Treasury*) in three volumes. At the core of both works is this classification of the various doctrines whereby each is critically evaluated under the light of the culminating and most comprehensive view of Shingon. A similar sort of system of classifying doctrines, called *p’an-chiao* (*panjiao*) or *chiao-pan* (*jiaoban*) (Jpn: *kyōsō hanjaku* or *kyō-han*) already existed in China, e.g. within the T’ien-t’ai and the Hua-yen traditions. Such a system of classification proved helpful in their attempts to distinguish themselves from, and at the same time, incorporate previous doctrines as expedient means that are relatively true. The *Lotus Sūtra* had also already expressed the similar idea that various doctrines were meant as expedient means that lead eventually to a fuller truth (expressed within its own text). It is Kūkai’s own invention however to associate the different doctrines evaluated and classified with specific states of mind or stages of spiritual attainment. That is, each state in the development of the mind is correlated with a specific set of doctrines appropriate to it, as its perspective and lived experience of reality, true to a certain extent within its limited purview but not yet the whole truth until the final state is reached. In other words, to move up this hierarchy of levels of mind, is to experience the unfolding of the Dharma as one becomes further awakened until one fully realizes one’s enlightenment in non-duality with the Dharma itself, i.e. the attainment of Buddha-hood. From a mandalic perspective, this unfolding of the Dharma is also indicative of one’s evolution from the periphery towards the center of the mandalic universe. However as each level of mind is a “dwelling” or “lodging” place for the mind, the hierarchy from the lowest to the highest “stages” is sequential only in the exoteric dimension. That is to say that the sequential ordering is not necessary in itself when viewed from the esoteric, i.e., holistic, standpoint. In other words, it is possible to move directly from any state or “dwelling” to the most comprehensive realm.
    step1: |-
      在这一图式中，空海坚决使用上面讨论过的概念来区分密教与显教。然而，从鸟瞰的观点看，在空海的图式中，真理即法足够宽广，可以把显教以及一切其他教说都包含为它自己的开展或显现，依适当的机缘或语境以及所达到的水平而有相对的程度。为了解释与其他宗派和教门的诸教说相应的心（*jūjūshin*）的不同层级或状态（*jū*，字面义为“住处”或“ lodging”），空海发展出一个等级图式。真言佛教被置于等级顶端，因为它提供最包罗万象的观点。空海在许多学者视为其代表作的《秘密曼荼罗十住心论》（十卷，约作于 830 年，其去世前五年）中提供了这一系统化。此书是为回应淳和天皇命佛教各宗呈进一部教说入门论著而作。当这篇文字对天皇来说太难时，空海就同一主题写出了一部删节而更易读的论著，即《秘藏宝钥》（三卷）。两种著作的核心，都是这一对各教说的分类，其中每一教说都在真言这一顶极而最包罗的观照的光照下受到批判性评估。中国原本已有类似的教说分类系统，称为判教（*p’an-chiao* 或 *chiao-pan*；日读 *kyōsō hanjaku* 或 *kyō-han*），例如在天台与华严的传统之内。这类分类系统在它们试图把自己与以前的教说区别开来、同时又把以前的教说纳入为相对真实的方便时颇为有用。《法华经》也已经表达过类似的观念：各种教说都是作为方便而施设的，最终通向一个更完全的真理（在其自己的经文之内表达）。然而空海自己的独创，是把被评估和被分类的各种教说与心的特定状态或精神成就的阶段联系起来。也就是说，心之发展中的每一个状态都与一组适合它的特定教说相关联，作为它对实在的观点和体验，在其有限的范围内某程度上为真，但在达到最后的状态之前还不是全部的真理。换言之，沿着心的层级的等级上升，就是在人进一步觉醒的过程中经验法的开展，直到人在与法本身的不二中完全实现自己的觉悟，即成就佛果。从曼荼罗的观点看，这一法的开展也指示人从曼荼罗宇宙的周边向中心的演进。然而，由于心的每一个层级都是心的一个“住处”或“ lodging”，从最低到最高的“阶段”的等级只在显教的维度上才是序列性的。也就是说，从密教的即整体的立场看时，序列的排序本身并不是必然的。换言之，可以从任何状态或“住处”直接移动到最包罗的领域。
    step2: |-
      在这一图式中，空海坚决使用上述概念来判别密教与显教。然而综观全局，在空海的图式中，真理——法——的涵容之广，足以把显教及一切其他教说都收为自己的开展或显现，依应机之宜、语境之差与所臻之位而有相对的程度。为说明与其余诸宗诸派教说相应的心的不同层级或状态（*jū*，字面义为“住”或“止息处”；心之十住即 *jūjūshin*「十住心」），空海建立了一个阶位的图式：真言佛教居于顶端，因为它提供对法最综贯的观照。他在一般视为其代表作的《秘密曼荼罗十住心论》（*Himitsu mandara jūjūshinron*，十卷，作于 830 年前后、其辞世前五年）中作了这一系统化。此书是应淳和天皇令佛教各宗呈进一部其教说入门论著之命而作。此文对天皇而言太难，空海遂就同一主题撰成删节而易读之作，即《秘藏宝钥》（*Hizō hōyaku*，三卷）。二书的核心，都是这一教说判分：在真言所臻极顶、最为综贯的观照之光照下，对每一教说作批评性的评估。中国本已有类似的教说判分系统，称为判教（*p’an-chiao*／*panjiao* 或 *chiao-pan*／*jiaoban*；日读 *kyōsō hanjaku* 或 *kyō-han*），例如天台与华严二宗的传统之中。这类判分系统在其自身的宗派与前说相别、同时又把前说纳为相对真实的方便时颇有用处。《法华经》也早已表达过类似的观念：诸种教说皆为方便而施设，终导向更圆满的真理——此真理即其自经所表者。然而空海自己的创发，是把被评估判分的诸教说与心的特定状态或精神证位的特定层级相关联。也就是说，心之开展的每一状态，都与一整套适合它的教说相关联，作为它对实在的观点与生活体验——在其有限的视野内某程度上为真，但在达到最终状态之前尚非全体之真。换言之，沿此心之层级的阶梯上升，就是在人愈趋觉醒的经验中经历法的开展，直至在法的不二中圆满证得自己的觉悟，即成就佛果。自曼荼罗的观点看，这一法的开展也标示一人从曼荼罗宇宙的周缘向中心的演进。然而，既然心的每一层级都是心的一个“住”或“止息处”，从最低到最高的阶位序列就只在显教的维度上成立。也就是说，若自密教的——亦即全体的——立场观之，序列的排序本身并非必然。换言之，从任何状态或任何“住”出发，都有可能径入最综贯的境地。
