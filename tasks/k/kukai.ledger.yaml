      As a descending view from the summit, this Taizō mandala represents the enlightened universe from the perspective of compassion, an expression of the “female” principle. Just as a mother enfolds her child in the care of her womb, the Buddha’s compassion nurtures the original enlightenment in all. With the lotus as chief symbol, the picture represents the manifestation of Dainichi through his cosmic activities. Dainichi occupies the unmoving center with myriad buddhas, bodhisattvas, and other deities layered around it, while Dainichi simultaneously pervades all up to the outermost edges of the diagram. From that center, enlightenment radiates outward in a spiral, passing through the various buddhas and bodhisattvas, descending through various levels of being and mind, outward to the phenomenal world as it becomes more and more concrete, reaching the human world and further into the realms of animals, hell-beings, and hungry ghosts. Thus a wellspring of activity is depicted to be endlessly flowing out of the center. This activity manifests the welling-up of compassion from the Buddha’s wisdom as it moves outwards and downwards. Simultaneously all beings are directed inwards and upwards towards enlightenment depicted in the mandalic center. The two movements are non-dualistic.
    step1: |-
      作为自峰顶而下的俯视，这胎藏曼荼罗从慈悲的视角表现觉悟的宇宙，是“女性”原理的表达。正如母亲以胎藏的怀抱呵护其子，佛陀的慈悲养育一切众生的本觉。画面以莲花为主要象征，表现大日经由其宇宙活动的显现。大日居于不动的中心，无数佛陀、菩萨与其它尊格层层环绕，同时大日又遍满一切，直至图式最外的边缘。从那中心，觉悟螺旋状地向外辐射，经由诸佛与菩萨，下降于层层不同的存在与心的层面，向外抵达愈加具体的现象世界，达于人间，进而达于畜生、地狱与饿鬼之界。于是画面描绘了一口从中心无尽流出的活动之泉。这活动表现佛陀智慧中慈悲的涌动，向外向下运行；同时一切众生被引向内、向上，趋往曼荼罗中心所绘的觉悟。两种运动不二。
