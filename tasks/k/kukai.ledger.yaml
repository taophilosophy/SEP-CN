      The text of the *Dainichi-kyō* itself is taken by Kūkai to be a condensation in scriptural form of that cosmic text of the mantra, comprising of the most comprehensive language of the Buddha-realm. And that same mantric text is then further condensed into each syllabic-root letter of the Sanskrit alphabet itself, which thus serves as a means for meditation. In Kūkai’s scheme (set out in his *Dainichikyō* *kaidai*), the true original text of the *Dainichi-kyō* is the eternal Dharma itself as the cosmic (con)text or mantra and cosmic mandala, existing permanently and comprising the universe and all phenomena. Within the world, an abridged translation appeared that supposedly consisted of 20,000 volumes and was circulated in India but became lost. The version Kūkai brought back from China is a much smaller one, but his claim is that every word, character, stroke or dot, within it in its mantric nature encompasses countless meanings and truths. Thus while the most abbreviated text is implaced within the original cosmic text, the entire content of the cosmic text is itself encapsulated within the characters of its abridgment representing a condensation. This “inter-textuality” exemplifies the Hua-yen (Huayan; Jpn: Kegon) sense of interpenetration whereby the entire whole is contained within each part, but here this Hua-yen idea is translated in mantric terms. This same scheme used in explaining the *Dainichi-kyō* was used by Kūkai to explain the relationship of the *Kongōchōgyō* and other esoteric texts to the world as well.
    step1: |-
      空海认为《大日经》（*Dainichi-kyō*）文本本身即是那真言宇宙文本以经典形式的浓缩，由佛界最广大的语言所构成。而这一真言文本又被进一步浓缩于梵文字母表的每一个音根字母之中，因而后者成为禅定的法门。在空海的方案（见于其《大日经开题》（*Dainichikyō kaidai*））中，《大日经》的真实原本是永恒的法本身——作为宇宙（上）下文或真言、宇宙曼荼罗的法——它永恒存在，包含宇宙与一切现象。在世间，出现过一部节译本，据说多达两万卷，流通于印度，后告亡佚。空海从中国带回的版本要小得多，但他主张：其中每一个词、每一个字、每一笔画、每一点，在其真言本性中都囊括无数意义与真理。于是，最简略的文本既被置于原本的宇宙文本之内，宇宙文本的全部内容又自身被封装于作为浓缩的节本文字之中。这种“互文性”正体现了华严（Huayan；日：Kegon）的相即相入义——整体全体内在于每一部分——只是此处华严思想被转译为真言的术语。空海解释《大日经》所用的同一方案，也被他用来解释《金刚顶经》（*Kongōchōgyō*）与其它密教经典同世界的关系。
    step2: |-
      空海认为，《大日经》（*Dainichi-kyō*）的经文本身即是真言之宇宙文本的经典化浓缩，由佛界最广大的语言所构成；而这一真言文本又被进一步凝缩于梵文字母表的每一个音根字母之中，遂成禅观法门。在空海的方案里（见于《大日经开题》（*Dainichikyō kaidai*）），《大日经》的真实原本，乃是永恒的法自身——作为宇宙（上）下文、作为真言、作为宇宙曼荼罗的法——它恒常存在，囊括宇宙与一切现象。世间曾出现一部节译本，相传多达两万卷，流布印度，终至亡佚。空海自中国携归的版本远为短小，但他主张：经中每一个词、每一个字、每一笔画、每一点，就其真言本性而言，无不囊括无量的意义与真理。于是，最简的文本既植根于原本的宇宙文本之中，宇宙文本的全部内容又恰恰被封藏于节本的文字之内——此即浓缩。这种“互文性”正是华严（Huayan；日：Kegon）相即相入义的例证：整体全体内在于每一部分；只不过此处华严思想被转译为真言的语汇。空海以同一方案解释《大日经》，也以它解释《金刚顶经》（*Kongōchōgyō*）及其它密教经典与世界的关系。
