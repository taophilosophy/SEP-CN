      In *Benkenmitsu nikkyōron*, Kūkai sets out to establish the basic differences between the brand of Buddhism he was introducing to Japan, which he regarded as “esoteric teachings” (*mikkyō*; “secret teaching”) on the one hand, and the forms of Buddhism already officially recognized and practiced in Japan, which he classified as “exoteric teachings” (*kengyō*; “revealed teaching,” “public teaching”). This distinction between “esoteric” (*mitsu*) and “exoteric” (*ken*) Buddhism is not found in his Indian predecessors. But some of his Japanese predecessors had already been using the binary *ken*-*mitsu* categories. Kūkai’s contribution was to interpret them in a new way through appropriation of the esoteric texts he had brought back from China. In Kūkai’s thinking, that distinction is crucial. While we shall discuss some of these ideas in the following sections with greater depth, we may here summarize the general distinctions laid out in *Benkenmitsu nikkyōron* for now as follows: 1) For exoteric Buddhism, the “embodiment of truth” (Skrt: *dharmakāya*; Jpn: *hosshin*) is abstract and transcendent and hence does not preach. But for esoteric Buddhism, the phenomenal world from the enlightened perspective – that is, the standpoint of the Buddha – *is* the preaching activity of the cosmic Buddha Dainichi (Skrt: *Mahāvairocana*) and *as* that “embodiment of truth.” Hence while exoteric teachings may be traced to Śakyamuni, the historical Buddha, esoteric teachings come directly from the Buddha Dainichi. 2) For exoteric Buddhism, the absolute truth, i.e., the Dharma, transcends world and language, and thus cannot be explained. But for esoteric Buddhism, that Dharma itself is being perpetually expressed *in* and *as* its embodiment in the phenomenal world, in its sounds, movements, and forms, and even in the thoughts of sentient beings. In other words, its embodiment refers not only to the meditation of the Buddha but also to the Buddha’s creative and communicative activities. 3) Exoteric Buddhism lacks, according to Kūkai, a practical methodology for *experiencing* esoteric truths. While exoteric Buddhism emphasizes the intellectual study and comprehension of the doctrines set forth in the sūtras, esoteric Buddhism provides a bodily hermeneutic whereby esoteric truths hidden in the sūtras as well as in the world at large can be experienced. And: 4) For exoteric Buddhism, it takes three infinitely long epochs of repeated rebirths of training in order for one to attain enlightenment (Buddhahood); but esoteric Buddhism makes it possible for anyone, irrespective of karmic dispositions, to immediately become a buddha in one’s present embodied state.
    step1: |-
      在《辨显密二教论》中，空海着手确立他所引入日本的佛教形态——他称之为“密教”（*mikkyō*，秘密之教）——与日本官方已经承认并实践的诸种佛教形态——他归为“显教”（*kengyō*，显现之教、公开之教）——之间的基本差异。这一“密”（*mitsu*）与“显”（*ken*）佛教的区分，在他的印度先行者那里并不存在，但他的一些日本先行者已经使用显密二分的范畴。空海的贡献在于，借由吸纳他从中国带回的密教文献，以一种新的方式诠释了这一对范畴。在空海的思考中，这一区分至关重要。虽然我们将在下面几节更深入地讨论其中一些观念，这里先概括《辨显密二教论》所铺陈的总体区分如下：1) 对显教佛教而言，“真理之身”（梵 *dharmakāya*；日 *hosshin*，法身）是抽象而超越的，因此不说法。但对密教佛教而言，从觉悟的视角——即佛的立场——看来的现象世界**就是**宇宙佛陀大日（梵 *Mahāvairocana*）的说法活动，并且**作为**那种“真理之身”。因此，显教教法可以追溯到历史佛陀释迦牟尼，密教教法却直接来自大日如来。2) 对显教而言，绝对真理即法，超越世界与语言，因而不可解说。但对密教而言，法本身正在永久地被表达于现象世界、作为其在现象世界中的身体性存在，在声音、运动与形态之中，甚至在有情众生的思想之中。换言之，其身体性不仅指佛陀的禅定，也指佛陀的创造与交流活动。3) 在空海看来，显教缺少一种**体验**密教真理的实践方法论。显教强调对经典所立教义进行理智的学习与理解，密教则提供一种身体的解释学，使隐于经典乃至整个世界之中的密教真理得以被体验。4) 对显教而言，需要经历三大无限漫长劫的反复转生修习才能开悟（成佛）；但密教使任何人，无论业性如何，都能在当下的身体性存在中即刻成佛。
    step2: |-
      在《辨显密二教论》中，空海着力确立他所传入日本的这一佛教形态——他名之为“密教”（*mikkyō*，“秘密之教”）——与日本官界早已承认并奉行的诸种佛教形态——他归之于“显教”（*kengyō*，“显现之教”、“公开之教”）——之间的根本差异。“密”（*mitsu*）与“显”（*ken*）这一二分，在印度前贤那里无处可寻，但若干日本前人已在沿用这对范畴；空海的贡献在于，通过吸纳自己从中国携归的密教文献，赋予这对范畴一种全新的诠释。在空海的运思中，这一区分居于枢纽地位。虽然下文会更深入地展开其中若干观念，此处先概括《辨显密二教论》铺陈的总体区别如下：其一，显教以“真理之身”（梵 *dharmakāya*；日 *hosshin*，法身）为抽象而超越者，故不说法；而密教则认为，从觉悟的视角——亦即佛的立场——观之，现象世界**就是**宇宙佛陀大日（梵 *Mahāvairocana*）的说法活动，且**作为**那“真理之身”。因此，显教教法可以溯源至历史佛陀释迦牟尼，密教教法却径直出自大日如来。其二，显教认为绝对真理即法，超越世界与语言，故不可解说；而密教认为，法本身正永恒地**于**其现象世界中的身体性存在之中、**作为**其身体性存在而被表达——在其音声、运动与形相之中，乃至在有情众生的意念之中。换言之，法的“身”不仅指佛陀的禅定，也指佛陀的创造与交流活动。其三，空海认为显教缺少**体验**密教真理的实践方法论：显教注重对经典所立教义的理智研习与领会，密教则提供一套身体的解释学，使隐于经典乃至整个世界之中的密教真理得以被亲身体验。其四，显教主张须历经三大无量劫中反复转生的修习方可成佛（开悟）；密教却使任何人，不拘业力根器，都能在当下的身体性存在之中即刻成佛。
