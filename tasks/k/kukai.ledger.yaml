      2ⁿᵈ state: “The mind of the child tempered but ignorantly obsessed with moral precepts” (*gudō jisai-shin*): The state of ethical actions and virtue that promote social order but without any “religious” goal; the stage to which belong Confucianism and the Buddhist precepts (*ritsu*) for the laity.
    step1: |-
      第二状态：“受陶铸而愚执道德戒律的儿童之心”（*gudō jisai-shin*）：促成的伦理行动与德行促进社会秩序但没有任何“宗教”目标的状态；属于此阶段的有儒家以及为在家居士设立的佛教戒律（*ritsu*）。
    step2: |-
      第二住心：“已受管教却昧然执著道德戒律的儿童之心”（*gudō jisai-shin*，即“儿童戒戒心”）：行伦理之举、修德以维系社会秩序，却无任何“宗教”鹄的的状态；属此阶位的有儒家，以及为居士所立的佛教戒律（*ritsu*，律）。
