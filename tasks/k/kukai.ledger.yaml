      就真言的广义而论，整个宇宙即是一门语言、一部文本，必待“阅读”方能领受其意义（法）。空海以声字实相（*shōjijissō*）一语概括此义。声字（*shōji*）意为“声与符号”。声（*shō*，或作 *sō*）是大日的气息，是五大要素相互无碍、交相碰撞的振动在空气中共鸣出的声响；狭义言之，即仪轨中所诵的真言。字（*ji*）意为“符号”“词”“字母”或“字”，指声之具有指谓性格者——命名某物、意指某物。作为**字母**，字又提供一个物质基底，使符号之间的区别得以保存、固定：使一物成为指谓此义而非彼义的符号者，正是差别（*shabetsu*）。凡凭自身纹样（*mon*）——视觉对象中形、色、运动的种种组合——而显其与它物之别者，在空海看来即是符号、即是字（*ji*）；此类事物既标示独特的纹样，便称“文字”（*monji*，“纹样-字母”）。于是，在最广的宇宙意义上，六种感官的一切现象（五身体感官加能思之心）——由五大要素相互振动、经其相互差别（*shabetsu*）而成——都充当宇宙（上）下文的字母，各自从不同侧面最终指谓法。狭义的字，则是饱含法的密教意义的手书梵字。实相（*jissō*）意为“实在”：由**声**之成**字**所唤起的、被命名、被意向、被意指者。世界之为文本，其终极所指即是法——法身于自在游戏中发挥其体现时的法。而法身宣说法的过程，又生成宇宙的一切：无量众生、种种界域、法的种种体现形态——诸天佛与历史上的人间佛陀皆在其中；它也生成人类语言一般，故人间语言无非这一宇宙宣说的显现。如是，宇宙便是在法身广大无涯、无形无相之身的空里宣说法的文本；宇宙之为真言，因而**就是**法身说法（*hosshin seppō*）。
