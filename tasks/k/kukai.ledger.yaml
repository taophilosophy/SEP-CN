      In addition to the two mandalic embodiments of the *hosshin*, Kūkai (in *Sokushinjōbutsugi*, ch.4) classifies mandalas in general into four types, depicting the different ways whereby the Dharma is manifest: 1. The “great mandala” (Skrt: *mahā-mandala*; Jpn: *daimandara*) symbolizes the cosmic Buddha in its physical extension along with all the stages of being, including the buddhas, bodhisattvas, and deities that are depicted in perfect anthropormophic form surrounding Dainichi at the center and painted in different colors to represent different material elements. 2. The “*samaya* mandala” (Skrt: *samaya-mandala*; Jpn: *sanmaya mandara*) pictures the Buddha-*cum*-universe through a variety of articles or signs, symbolizing the omnipresencing of Dainichi’s intention (Skrt: *samaya*; Jpn: *sanmaya*). They include swords, gems, lotus, vajra, etc., as each signifying a specific improvisation of a skillful mean to enlighten the unenlightened. This also represents the unity-in-diversity of all thing-events as forms of Dainichi’s body. 3. The “Dharma mandala” (Skrt: *Dharma-mandala*; Jpn: *hō mandara*) pictures the universe as the sphere of Dainichi’s continuous communication of truth (Dharma), as depicted in the arrangement of *mantric* seed syllables. And 4. The “karma mandala” (Skrt: *karma-mandala*; Jpn: *katsuma mandara*) was originally a three-dimensional mandala in sculpted form – including the physical layout of the temple compound at Mt. Kōya – but which more often became a painted one instead. Showing the activities (*karma*) of buddhas and bodhisattvas implied in the other three, this mandala depicts the fact that every change in any form within the cosmos is an act of the *hosshin* and conversely that every act of the *hosshin* is an occurrence of things and events in the cosmos. The four then depict four different aspects of truth: body (the five material elements), mind (intention, compassion, the sixth element), speech (communication), and action (all movements). Through meditation upon them one comes to view everything as a mandala, the cosmos as a mandalic unfolding of the Dharma. Ultimately the mandala depicts not only the cosmos or the Dharma as object but also one’s own interior self in meditation as one interiorizes it or as one visualizes it within.
    step1: |-
      除了法身的两种曼荼罗式体现，空海（在《即身成佛义》第四章）把曼荼罗总分为四种类型，描绘法得以显现的不同方式：1. “大曼荼罗”（梵 *mahā-mandala*；日 *daimandara*）象征宇宙佛的物理延展，连同存在的所有阶段，包括以完美人形围绕中央大日而描绘的诸佛、菩萨与神祇，并以不同颜色画出以代表不同的物质要素。2. “三摩耶曼荼罗”（梵 *samaya-mandala*；日 *sanmaya mandara*）通过种种器物或标志来描绘佛陀兼宇宙，象征大日之意（梵 *samaya*；日 *sanmaya*）的遍在。这些包括剑、宝珠、莲花、金刚杵等，各自表示为使未觉悟者觉悟而权设的某种方便。这也代表一切事物作为大日身体之形态的多样统一。3. “法曼荼罗”（梵 *Dharma-mandala*；日 *hō mandara*）把宇宙描绘为大日持续传达真理（法）的领域，表现于真言种子字的排列。4. “羯磨曼荼罗”（梵 *karma-mandala*；日 *katsuma mandara*）原本是雕塑形态的立体曼荼罗——包括高野山寺院的实体布局——但后来更常见的是绘画形式。此曼荼罗显示前三种所涵的诸佛与菩萨的事业（*karma*），描绘宇宙中任何形态的任何变化都是法身的行动，反过来法身的每一行动都是宇宙中事物与事件的发生。四者因而描绘真理的四个不同方面：身（五大物质要素）、心（意、慈悲、第六要素）、语（传达）与行（一切运动）。通过对它们的禅观，人会逐渐把一切视为曼荼罗，把宇宙视为法的曼荼罗式开展。归根结底，曼荼罗不仅描绘作为对象的宇宙或法，也描绘修行者在禅观中将其内化或于内观想时的自身内部。
    step2: |-
      除上述法身的两种曼荼罗体现之外，空海（见《即身成佛义》第四章）又把曼荼罗通分为四类，分别表法显现的四种方式：

      1. “大曼荼罗”（梵 *mahā-mandala*；日 *daimandara*）：象征宇宙佛在空间上的延展，连同存在的诸层级——诸佛、菩萨与诸尊皆以完美的人形绘于中央的大日周围，并以不同颜色表不同的物质要素。

      2. “三摩耶曼荼罗”（梵 *samaya-mandala*；日 *sanmaya mandara*）：以种种器物或标帜图绘佛陀与宇宙，象征大日之意（*samaya*，三摩耶）的遍在。所绘有剑、宝珠、莲花、金刚杵等，每一标帜各表一种为化度未觉者而权设的方便。此亦表一切事作为大日之身的形态而在多样中的统一。

      3. “法曼荼罗”（梵 *Dharma-mandala*；日 *hō mandara*）：把宇宙图绘为大日相续传布真理（法）的领域，其表现即真言种子字的排列。

      4. “羯磨曼荼罗”（梵 *karma-mandala*；日 *katsuma mandara*）：原为雕塑形态的立体曼荼罗——包括高野山寺院伽蓝的实体布局——后来多转成绘画。此曼荼罗表前三种所涵的诸佛菩萨的事业（*karma*），图绘宇宙中任何形相的任何变化皆为法身之业，反之法身的每一业皆为宇宙中事物与事件的发生。

      四者遂表真理的四个面向：身（五大物质要素）、心（意——慈悲，第六要素）、语（传达）与行（一切运动）。经由对它们的禅观，人渐能把一切视为曼荼罗，把宇宙视为法的曼荼罗式开展。归根到底，曼荼罗所绘者不只是作为对象的宇宙或法，也是修行者随之内化或于内观想时的自身内在。
