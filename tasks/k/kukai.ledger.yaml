      Rather than rejecting or negating the previous states, this final state fulfills and encompasses their standpoints from what is claimed to be the most comprehensive standpoint, in view of – or rather in non-duality with – the Dharma. In light of the Dharma, the truths taught in those previous states are but relative or provisional truths, expedient means that are helpful only insofar as they lead one towards this final truth but which can also serve as fetters if one becomes attached to them. Each state is referred to as a “palace” (*kyū* or *gū*), which are all combined in the one grand cosmic palace (*hokkaigū* or *hokkai shinden*). This grand palace constitutes the entire cosmos as a mandala, with the tenth and highest state, the innermost secret palace of Dainichi, at the center and summit from which the Dharma emanates into its various manifestations in the lower states, the outer palaces. The closer one is to the center, the stronger one feels the pull of *kaji* drawing one up towards the central summit. But as stated above, the sequential ordering of the hierarchy is not necessary when the whole is viewed from this most comprehensive standpoint. For the grand cosmic palace penetrates and comprehends all of the specific palaces or dwellings of the mind. Hence one can make a sudden leap from any point in this cosmic mandala towards the center by successfully engaging in the esoteric practice of Shingon Buddhism. It is this mandalic structure that the term *mandala* in the title of the longer version of this work (*Treatise on the Secret Mandala of the Ten States of Mind*) signifies. It refers to the blueprint of the cosmic embodiment of the Dharma (*hosshin*), which in turn structures one’s (ritual) practice in its arrangement and how one accordingly experiences the Dharma.
    step1: |-
      这最后的住心并不拒斥或否定前诸住心，而是从其所自称的最综贯的立场，也就是从——或更确切地说不二于——法看来，成全并涵摄诸前住的立场。在法的光照下，前诸住心所教的真理只是相对的或权便的真理，是方便：它们只有在引向这最终真理时才有帮助，而人若执著于它们，它们同样能成为系缚。每一住心都被称为一座“宫殿”（*kyū* 或 *gū*），而这些宫殿皆合为一座宏大的宇宙宫殿（法界宫，*hokkaigū* 或 *hokkai shinden*）。这大宫殿把整个宇宙构成为一幅曼荼罗：第十、最高的住心，大日的最内秘密之宫，居于中心与峰顶，法从那里流溢为下层诸住心即外诸宫中的种种显现。一个人越靠近中心，就越强烈地感到把他向上拉向中心峰顶的加持之牵引。但如前所述，当整体从这个最综贯的立场来观时，等级制度的序列排序并非必然，因为宏大的宇宙宫殿贯穿并涵摄心的一切具体的宫殿或住处。于是人能够从这个宇宙曼荼罗的任何一点，通过成功修习真言佛教的密教实践，向中心作突然的一跃。正是这一曼荼罗结构，本书长题（《秘密曼荼罗十住心论》）中的“曼荼罗”一词所意指的。它指法的宇宙体现（法身）的蓝图，而这蓝图又结构着人的（仪轨）实践及其安排，以及人据此经验法的方式。
    step2: |-
      这最后的住心并不拒斥或否定前诸住心，而是从其所自称最综贯的立场——即依于法，或更确切地说，与法不二——来成全并涵摄诸前住的立场。在法的光照下，前诸住心所教的真理只是相对的或权便的真理，是方便：它们唯在引向这最终真理时才有帮助，而人若执著于它们，它们也同样能成为系缚。每一住心都被称为一座“宫殿”（*kyū* 或 *gū*），而诸宫皆合为一座宏大的宇宙宫殿——法界宫（*hokkaigū* 或 *hokkai shinden*）。这大宫殿把整个宇宙构成为一幅曼荼罗：第十、最高的住心，即大日的最内秘密之宫，居于中心与峰顶；法从那里流溢而出，在下层诸住心即外诸宫中作种种显现。愈近中心，人便愈强地感到加持的摄引，把自己向上拉向中心的峰顶。但如上所述，当整体自这最综贯的立场来观时，阶位的序列排序并非必然，因为宏大的宇宙宫殿贯穿并涵摄心的诸别宫、诸“住”。于是人可以从这宇宙曼荼罗的任何一点，藉由真言密教实践的成功修习，向中心顿然一跃。本书长题《秘密曼荼罗十住心论》中的“曼荼罗”一词，所指正是这一曼荼罗结构：它是法的宇宙体现（法身）的蓝图，而这蓝图又结构着人的（仪轨）实践及其安排，以及人据此经验法的方式。
