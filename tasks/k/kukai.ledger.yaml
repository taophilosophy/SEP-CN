      5ᵗʰ state: “The mind freed from karmic seeds” (*batsu gōinju-shin*): The state of the *pratyeka-buddhas*, who, masterless on their own, attain insight into the chain of dependent origination to recognize the impermanence, self-less-ness, and non-substantiality of all, thus preventing new karma to arise. But in enjoying a certain level of “enlightenment,” they fall back into the “egoism” of self-complacency, compassionless apathy towards fellow beings, and the narrow vision of other-worldliness. Hence they have not yet reached complete enlightenment. The Sautrāntika school belongs to this stage.
    step1: |-
      第五状态：“从业因种子得解脱之心”（*batsu gōinju-shin*）：独觉的状态，他们无师自证，洞察缘起之链，认识到一切的无常、无我与无实体性，从而防止新的业生起。但在享受某种程度的“觉悟”时，他们又退回自我满足的“我执”、对同类众生的无情漠视以及眼界狭隘的出世倾向。因此他们尚未达到完全的觉悟。经量部属于此阶段。
    step2: |-
      第五住心：“拔除业因种子而得解脱之心”（*batsu gōinju-shin*，即“拔业因种心”）：缘觉（独觉）的状态——无师自悟，观照缘起之链，证知一切的无常、无我与无实体性，从而止息新业的生起。然而耽于某种水平的“觉悟”，他们便退回自我满足的“我执”、对同类众生的冷漠无情，以及眼界逼窄的出世倾向，故尚未达到圆满的觉悟。经量部属此阶位。
