      In the broader sense of mantra, the whole cosmos is a language or text that must be “read” if one is to receive its meaning (the Dharma). Kūkai expresses this in the term *shōjijissō*. *Shōji* means “sound-and-sign.” *Shō* (or: *sō*), meaning “sound,” is the breath of Dainichi, the vibrations of the five material elements in their mutually non-obstructively colliding interplay that resonate sounds through the air. In the narrower sense, this would be the mantras voiced in ritual. *Ji*, meaning “sign,” “word,” “letter,” or “character/graph,” is sound in its signifying character as naming or meaning something. As *letter*, it also provides a material base whereby the sign’s distinction from other signs becomes retained and fixed. For what makes something a sign signifying a specific meaning rather than another is difference (*shabetsu*). Anything that manifests its distinction from others in virtue of its pattern (*mon*) – the various combinations of shape, color, and movement among visual objects – then, for Kūkai, is a sign or letter (*ji*). Marking distinct patterns (*mon*), such things are “characters” (*monji*; “pattern-letter”). In the broadest and cosmic sense then, all phenomena of the six senses (i.e., the five physical senses plus the thinking mind) as constituted by the inter-vibrations of the five material elements and *via* their mutual distinctions (*shabetsu*), serve as letters of the cosmic (con)text, ultimately signifying the Dharma but in its different aspects. In its narrower significance, however, *ji* would be the written Sanskrit letters as saturated with that esoteric meaning of the Dharma. *Jissō*, meaning “reality,” is that which is named, intended, meant, as evoked by *sho* becoming *ji*. The ultimate referent or meaning of the world as text is the Dharma in the spontaneous playing of its embodiment, the *hosshin*. In turn the process of articulation of the Dharma by the *hosshin* generates everything in the cosmos, including the myriad beings, their various realms, and its various forms of embodiment such as the celestial buddhas and the historical human buddha. It also generates human languages in general which are thus seen as manifestations of this cosmic articulation. The cosmos as such is a text articulating the Dharma within the empty space of the vast limitless and formless body of the *hosshin*. The cosmos as mantra *is* hence *hosshin seppō*.
    step1: |-
      就真言的广义而言，整个宇宙是一门语言、一个文本，人必须“阅读”它才能领受其意义（法）。空海以 *shōjijissō*（声字实相）一语表达这一点。*Shōji* 意为“声与符号”。*Shō*（或作 *sō*）意为“声”，是大日的气息，是五大物质要素在相互无碍的碰撞互动中发出的振动，于空气中共鸣为声。就狭义而言，此即仪轨中诵出的真言。*Ji* 意为“符号”、“词”、“字母”或“字／字符”，是就其指谓性格——命名或意指某物——而言的声。作为**字母**，它还提供一个物质基底，使一符号与其它符号的区分得以保存和固定。因为使一物成为指谓特定意义而非另一意义的符号的，是差别（*shabetsu*）。凡凭其纹样（*mon*）——视觉对象中形、色、运动的种种组合——而显出与它物之区别者，在空海看来即是符号或字母（*ji*）。此类事物标示出独特的纹样（*mon*），故为“文字”（*monji*；“纹样-字母”）。于是，在最广的宇宙意义上，六种感官的一切现象（即五种身体感官加能思之心）——由五大要素的相互振动、并经由其相互差别（*shabetsu*）所构成——充当宇宙（上）下文的字母，最终指谓法，但各指其不同的侧面。而在狭义上，*ji* 则是书写的梵文字母，饱含法的密教意义。*Jissō* 意为“实在”，是被命名、被意向、被意指者，由**声**之成为**字**所唤起。世界作为文本，其终极所指或意义，便是处于其体现者法身之自在游戏中的法。反过来，法身对法的宣说过程生成宇宙中的一切：无数众生、它们的种种界域，以及法的种种体现形态，如诸天中的佛与历史上的人间佛陀。它也生成一般的人类语言，故人类语言被视为这一宇宙宣说的显现。这样的宇宙，便是在法身广大无边、无形无相之身的空的空间中宣说法的一个文本。宇宙作为真言，因而**就是**法身说法（*hosshin seppō*）。
