      The phrase *sokushinjōbutsu* means literally, “attaining enlightenment in this very body” or “becoming buddha in this very body.” “Body” (*shin*) – as Kūkai explains in *Sokushinjōbutsugi*, ch. 6 – here is not merely one’s corporeal body but one’s lived embodied existence of body-and-mind as one whole. In addition “body” here takes on myriad significances when one views *sokushinjōbutsu* in light of Kūkai’s other concepts such as *hosshin seppō* and *sanmitsu*. *Sokushin* (“this body”), for example, can signify the cosmos of the *hokkai* as the macrocosmic body of the *hosshin* with which one’s own embodiment is non-dualistic. It can mean each of the six universal elements or all of them together that comprise the cosmic body and its *samadhi*. It can also mean the four embodiments of the *hosshin*. It can mean the bodies of all living things other than one’s self. In correspondence with the “three mysteries” of body, speech, and mind, or *mudra*, mantra, and mandala, it can mean bodily gestural symbols (*in*), figures of letters (*ji*), and expressive demeanor or countenance (*gō*). All of these senses of “body” are interrelated and inseparable, mutually mirroring one another.
    step1: |-
      即身成佛一语字面上意思是“在这个身体中达到觉悟”或“在这个身体中成佛”。“身”（*shin*）——如空海在《即身成佛义》第六章所解释——在这里不仅是指肉身，而是指人身心一体、活生生的具身存在。此外，当人把即身成佛放在空海的其他概念如法身说法与三密的光照下来看时，“身”在这里便具有无数的含义。例如“即身”（*sokushin*）可以指法界（*hokkai*）的宇宙作为法身的宏观身体，而人自身的具身存在与此不二。它可以指六个普遍要素中的每一个，或六者合起来构成宇宙身体及其三昧。它也可以指法身的四种身。它可以指自我之外一切众生的身体。与身、口、意“三密”即印契、真言、曼荼罗相应，它可以指身体的姿势符号（*in*）、文字的形相（*ji*）以及富于表现力的举止或容色（*gō*）。所有这些“身”的含义都相互关联、不可分离，彼此互为镜像。
    step2: |-
      “即身成佛”一语字面即“于此身成佛”。此处之“身”（*shin*）——如空海在《即身成佛义》第六章所释——并不只是人的肉身，而是身心一体、活生生的具身存在。此外，若把即身成佛置于空海的其他概念（如法身说法、三密）之下观照，“身”便具有无量含义。例如“即身”（*sokushin*）可指法界（*hokkai*）宇宙作为法身的宏观身体，而人自身的具身存在与之不二；可指六大要素中的每一要素，或六者全体所构成的宇宙之身及其三昧；可指法身的四种身；可指自身之外的众生之身。与身、口、意“三密”，即印契、真言、曼荼罗相应，它又可指身之印相（*in*）、文字之形（*ji*）与表情容色（*gō*）。凡此“身”义，皆相互关联、不可分离，彼此互镜。
