  - id: 10
    kind: body
    source: |-
      Kūkai called his form of Buddhism, *Shingon*, which means “the word of truth.” This is the Japanese pronunciation of the Chinese *chen-yen* (*zhenyan*) and the Sanskrit *mantra*. The form of Buddhism that he learned in China was an importation from India of *Mantrayāna* (Mantra vehicle {or: “school”}) Buddhism, more often known as *Vajrayāna* (Diamond {or: “Lightning Fast”} vehicle). The word *mantra* signifies a secret teaching inexpressible in ordinary words or linguistic formulations. This form of Buddhism, whose origin dates back to the mid-seventh century India, is more popularly known today in the West as “Tantric Buddhism,” especially in its Tibetan incarnation. It is characterized by its emphasis upon rituals, involving the use of mantras, mandalas, and other means in order to control both body and mind to experience the “ultimate.” Two major texts, associated with this form of Buddhism, made their way into China from India: *Mahāvairocana Sūtra* (Jpn: *Dainichi-kyō*) from the mid-seventh century and *Vajraśekhara Sūtra* (Jpn: *Kongōchō-gyō*) from the later-seventh century. Mantrayāna made its way east to China during the T’ang dynasty (713–765) around the beginning of the eighth century through the translating and propagating efforts of the Indian priests Śubhākarasimha (Jpn: Zenmui; 637–735) who brought the *Mahāvairocana Sūtra* to China; Vajrabodhi (Jpn: Kongōchi; 671–741), the sixth patriarch of Mantrayāna, who brought the *Vajraśekhara Sūtra* to China; and Amoghavajra (Jpn: Fukū, an abbreviation for Fukūkongō; 705–74), Vajrabodhi’s disciple, who won the support of successive emperors during the T’ang period; and the Chinese priest, I-hsing (Yixing; Jpn: Ichigyō; 683–727) who learned the teachings of *Mahāvairocana Sūtra* from Śubhākarasimha and the teachings of *Vajraśekhara Sūtra* from Varjabodhi. Kūkai’s own teacher Hui-kuo had also received initiation under both lineages of these two major sūtras, and is credited with gathering together their teachings into one system. In the meantime during the eighth century, another branch of Mantrayāna made it north from India to Tibet. But Chen-yen Buddhism in China did not survive the severe persecution of Buddhism in general in 845. Kūkai however had by then already succeeded in transmitting to Japan the esoteric doctrines he had studied in China. For much of the doctrines and practices, which he had imported, became influential amongst the official Nara monasteries. But his form of Buddhism was not just a product of his inheritance and appropriation of the Buddhism he encountered in China. As it involved developments and contributions uniquely his own, we may regard him not only as the transmitter but as the *founder* of the Japanized version of Mantrayāna known as *Shingon*.
    step1: |-
      空海把他所传的佛教称为“真言”（*Shingon*），意为“真实之语”。这是汉语“真言”（chen-yen/zhenyan）和梵语 *mantra* 的日语读音。他在中国学到的佛教，是从印度传入的真言乘（Mantrayāna，真言之乘）佛教，更常被称为金刚乘（Vajrayāna，金刚之乘）。“真言”（mantra）一词指一种无法用寻常语言或语言程式表达的秘教。这一形态的佛教起源于七世纪中叶的印度，今天在西方更广为人知的名称是“密宗佛教”（Tantric Buddhism），尤其是其西藏形态。它的特征是强调仪式，使用真言、曼荼罗等手段来调控身心以体验“终极”。与这一形态的佛教相关的两部重要经典从印度传入中国：七世纪中叶的《大日经》（梵 *Mahāvairocana Sūtra*；日 *Dainichi-kyō*）与七世纪后半的《金刚顶经》（*Vajraśekhara Sūtra*；日 *Kongōchō-gyō*）。真言乘约在八世纪初、唐朝（713–765）时期东传至中国，靠的是印度法师们的译经与弘传之功：善无畏（Śubhākarasimha；日 Zenmui；637–735）将《大日经》带入中国；金刚智（Vajrabodhi；日 Kongōchi；671–741），真言乘第六祖，将《金刚顶经》带入中国；不空（Amoghavajra；日 Fukū，为 Fukūkongō 的简称；705–774），金刚智的弟子，赢得了唐朝历代皇帝的支持；以及中国法师一行（I-hsing/Yixing；日 Ichigyō；683–727），从善无畏学《大日经》之教，从金刚智学《金刚顶经》之教。空海自己的老师惠果也在这两大经系之下受灌顶，并因把两系教法汇归为一个体系而受称道。同一时期的八世纪，真言乘的另一支由印度北传至西藏。但中国的真言宗（Chen-yen）没有挺过 845 年对佛教整体的严酷迫害。不过空海在那之前已成功把他在中国所学的密教教义传到了日本。因为他传回的许多教义与实践，在奈良官方寺院中间产生了影响。但他所传的佛教并不只是他对在华所遇佛教的继承与吸纳的产物。由于其中包含着他独有的发展与贡献，我们不仅可以把他视为传法者，更可以把他视为日本化真言乘——即所谓“真言宗”（*Shingon*）——的**创立者**。
    step2: |-
      空海把自己所传的佛教称为“真言”（*Shingon*），意为“真实之语”——这是汉语“真言”（chen-yen，拼音 zhenyan）与梵语 *mantra* 的日语读法。他在中国所学到的这一佛教形态，是从印度输入的真言乘（*Mantrayāna*，“真言之乘”）佛教，也就是更常见的金刚乘（*Vajrayāna*）。“真言”一词所指标的，是难以用寻常语汇或语言程式道出的秘密教法。这一形态的佛教肇源于七世纪中叶的印度，今日西方更习称“密宗佛教”（Tantric Buddhism），尤指其西藏形态。其特色在于重视仪轨：借真言、曼荼罗等种种手段调控身心，以体证“终极”。与这一形态相系的两部核心经典自印度传入中国：一是七世纪中叶的《大日经》（梵 *Mahāvairocana Sūtra*；日 *Dainichi-kyō*），一是七世纪后半的《金刚顶经》（*Vajraśekhara Sūtra*；日 *Kongōchō-gyō*）。真言乘约于八世纪初、唐王朝（713–765）时期东渐中土，得力于诸位印度法师的译传：善无畏（Śubhākarasimha；日 Zenmui，637–735）携《大日经》入华；真言乘第六祖金刚智（Vajrabodhi；日 Kongōchi，671–741）携《金刚顶经》入华；金刚智弟子不空（Amoghavajra；日 Fukū，Fukūkongō 之略，705–774）先后博得唐朝数代皇帝的支持；又有中国法师一行（Yixing；日 Ichigyō，683–727），从善无畏受《大日经》之教、从金刚智受《金刚顶经》之教。空海的师父惠果本人即在这两大经系之下受灌顶，并因将两系教法会归一统而见称。同一世纪的八世纪间，真言乘的另一支由印度北传西藏。然而中国的真言宗未能挺过 845 年那场波及整个佛教的严酷法难。彼时空海却已成功地将自己在华所学的密教教义传回日本——他携归的许多教法与行仪，在奈良官寺之间声势渐起。不过，他所传的佛教并非仅仅是在华所遇佛教的承袭与挪用；由于其中含有他独有的开展与贡献，我们不仅可以称他为传持者，更应当称他为日本化真言乘——即“真言宗”（*Shingon*）——的**开创者**。
