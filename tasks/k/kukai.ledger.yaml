      The idea of *hosshin seppō* also expresses a universalization in Shingon of the Mahāyāna Buddhist notion of expedient (or: skillful) means. The Shingon doctrine of *hōben kukyō* (“ultimacy of expedient means”) means that any phenomenon or thing-event of the cosmos can serve as a means to enlightenment, entailing a gradation of understanding, hinging on how the event speaks to the person relative to the time, place, and situational context. This also corresponds to the levels of mental states discussed in Kūkai’s *Jūjūshinron* (which we will examine in a further section below). The key to immediate and complete enlightenment however is to understand the *comprehensive* (or *holistic*) sense of the truth being spoken by the cosmos as a whole even if through the medium of a particular thing-event.
    step1: |-
      法身说法的观念也表达了真言宗对大乘佛教方便（或善巧）手段观念的普遍化。真言宗的方便究竟（*hōben kukyō*，“方便的究竟性”）教义意味着：宇宙的任何现象或事物事件都可以作为通向觉悟的手段，其中蕴含理解的梯度，取决于该事件相对于时间、地点与情境语境如何向这个人言说。这也对应于空海《十住心论》中所讨论的心理状态的层级（我们将在后面一节考察）。然而，即刻而完全的觉悟之关键，在于领会宇宙作为整体所说的真理的**全面的**（或**整体的**）意义，即使它是经由某个特定的事物事件为媒介。
    step2: |-
      法身说法的观念也表达了真言宗对大乘“方便”（善巧方便）观念的普遍化。真言宗“方便究竟”（*hōben kukyō*，“方便之究竟性”）的教义意味着：宇宙中的任何现象或事物事件皆可充作通往觉悟的手段；其中蕴含着理解的层级，端视该事件相对于时间、地点与情境如何向此人言说。这也对应于空海《十住心论》所讨论的心理状态诸层级（详见后面一节）。然而，即达而圆满的觉悟，其关键在于领会宇宙作为整体所说真理的**全面**（或**整全**）之义——纵然它是经由某一特定事物事件为媒介。
