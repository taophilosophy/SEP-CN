      In the esoteric tradition that Kūkai inherited from Hui-kuo, there are two major mandalas that depict the *hosshin* in two different mandalic forms. Each mandala originally belonged to one of the two esoteric lineages, which became combined in China, and is associated with either of the two sūtras. All Shingon doctrines, traceable to the two sūtras, are supposed to be pictorially depicted in these two mandalas: the *Taizō* (Skrt: *Garbha*, “Womb of enlightenment”) and the *Kongōkai* (Srkt: *Vajradhātu*, “*Vajra* realm,” “Diamond realm” or “Realm of the adamantine thunderbolt”) mandalas. Together they are called *ryōbu mandara* and represent a comprehensive unity. Each are also associated with one of the two different concepts of *ri* (pattern, order – referring to emptiness as the reason discerned in patternment) and *chi* (wisdom, i.e., the wisdom of emptiness). Accordingly the *hosshin* can be understood in its embodied form as *ri-hosshin* (or *rishin*) and as *chi-hosshin* (or *chishin*), two aspects which are ultimately non-dualistic (*richi funi*). The *ri-hosshin* is depicted in the Taizō mandara that expresses truths expounded in the *Dainichi-kyō*. And the *chi-hosshin* is depicted in the Kongōkai mandara that expresses truths expounded in the *Kongōchō-gyō*. Both depict Dainichi as the central deity, with buddhas and bodhisattvas surrounding him in geometric arrangement.
    step1: |-
      在空海承自惠果（Hui-kuo）的密教传统中，有两幅大曼荼罗，以两种不同的曼荼罗形态描绘法身。每一曼荼罗原属两大密教传承之一（二者在中国合流），并与两部经典之一相关联。可溯源至这两部经典的一切真言教义，都应在这两部曼荼罗中得到图像描绘：胎藏（梵：*Garbha*，“觉悟之胎藏”）曼荼罗与金刚界（梵：*Vajradhātu*，“*Vajra* 之界”、“金刚界”或“金刚杵界”）曼荼罗。两者合称两部曼荼罗（*ryōbu mandara*），代表一种综观的统一。每一曼荼罗又与理（*ri*：纹样、秩序——指在纹样化中被辨识的作为理由的空）与智（*chi*：智慧，即空之智）两个不同概念之一相关。据此，法身在其体现形态中可被理解为理法身（*ri-hosshin*，或 *rishin*）与智法身（*chi-hosshin*，或 *chishin*），这两个面向终极而言不二（*richi funi*）。理法身描绘于胎藏曼荼罗之中，此曼荼罗表达《大日经》所阐的真理；智法身描绘于金刚界曼荼罗之中，此曼荼罗表达《金刚顶经》所阐的真理。两者都以大日为中心尊，佛陀与菩萨以几何排列环绕于其周。
