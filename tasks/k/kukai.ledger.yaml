      4ᵗʰ state: “The mind of one affirming only the elements and negating the self” (*yuiun muga-shin*): The state of the *śrāvaka* who analyzes phenomena into the psycho-physical “aggregates” (*skandhas*) and/or the elements (*dharmas*), to thus negate any belief in a permanent ego (*atman*); the stage to which belong the teachings of the historical Buddha and his direct disciples and of the *Abhidharma* scholastics. While the substantiality of reality is thus deconstructed into its elemental *dharmas*, the *dharmas* themselves however become fetters, thus taking from three lives to sixty aeons to achieve liberation.
    step1: |-
      第四状态：“只肯定要素而否定自我之心”（*yuiun muga-shin*）：声闻分析现象为心理物理的“蕴”（*skandhas*）和／或要素（*dharmas*），从而否定对恒常自我（*atman*）之信仰的状态；属于此阶段的有历史佛陀及其直接弟子以及阿毗达磨论师们的教说。实在的实体性虽如此被解构为它的要素性的法，法自身却成为系缚，因此需要三生至六十劫才能获得解脱。
    step2: |-
      第四住心：“唯认要素、否定自我之心”（*yuiun muga-shin*，即“唯蕴无我心”）：声闻把现象分析为心理物理的“蕴”（*skandha*，五蕴）和／或要素（*dharma*，法），从而否定对恒常自我（*ātman*）之信仰的状态；属此阶位的有历史佛陀及其直传弟子、以及阿毗达磨论师们的教说。实在的实体性虽如是被解构为其要素性的法，法自身却成为系缚，故须经三生至六十劫方得解脱。
