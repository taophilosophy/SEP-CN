      The function of the *hosshin* is equated with all movements and change that occur in the cosmos. Such cosmic alterations are categorized in three ways in terms of visible form (e.g., loco-motion or change of place, and trans-formation or change in shape), the audible (sound), and the mental (the thinking process). Visible alterations are movements of Dainichi’s body (*shin*), audible alterations are movements of Dainichi’s speech (*ku*), and mental alterations are movements of Dainichi’s thoughts (*i*). Together they are called the “three mysteries” (Skrt: *tri-guyha*; Chn: *san-mi*; Jpn: *sanmitsu*) making up the functions (*yū*) of the *hosshin*. Since the body of Dainichi is the cosmos itself, these “three mysteries” of its functions are at work in all thing-events and are ultimately non-dualistic with the corresponding movements of ourselves.
    step1: |-
      法身的作用等同于宇宙中发生的一切运动与变化。这类宇宙变化按三个方面归类：可见形态（如位置移动或场所变化、形变或形状改变）、可听者（声音）、以及心（思维过程）。可见的变化是大日之身（身，*shin*）的运动；可听的变化是大日之言（口，*ku*）的运动；心的变化是大日之念（意，*i*）的运动。三者合称“三密”（梵 *tri-guyha*；汉 *san-mi*；日 *sanmitsu*），构成法身的作用（用，*yū*）。既然大日之身就是宇宙本身，其作用的“三密”便在一切事物事件中运作，并且与我们的相应运动终究不二。
    step2: |-
      法身的作用等同于宇宙中发生的一切运动与变化。这类宇宙变化按三方面归类：可见之形（如位移或处所的变化、变形或形状的改变）、可听之声（音声）、以及心（思维过程）。可见的变化是大日身（身，*shin*）的运动，可听的变化是大日语（口，*ku*）的运动，心的变化则是大日意（意，*i*）的运动。三者合称“三密”（梵 *tri-guyha*；汉 san-mi；日 *sanmitsu*），构成法身之作用（用，*yū*）。既然大日之身即是宇宙本身，其作用的三密便在一切事物事件中运行，并且与我们的相应运动究极不二。
