      6ᵗʰ state: “The mind of the Mahāyāna adherent who is concerned with others” (*taen daijō-shin*): The state of Yogācāra with its *Vijñapti-mātratā* (Jpn: *yuishiki*) standpoint that everything is “mind-only,” reached by its analysis of thing-events as phenomena of consciousness originating from a deep un-conscious “storehouse” or “receptacle consciousness” (*ālaya-vijñāna*). Its point is to detach oneself from the discriminating objectification of phenomena in order to realize the tranquility of “mind-only” from a non-discriminating perspective, which would allow the practice of “great compassion.” And yet this still takes several aeons of practice to achieve and is not the final state.
    step1: |-
      第六状态：“关切他人的大乘行者之心”（*taen daijō-shin*）：瑜伽行的状态，持唯识（*Vijñapti-mātratā*；日 *yuishiki*）立场，谓一切唯“心”，这是通过分析事物事件作为意识的现象而达到的，这些现象起源于一种深层的非意识的“藏”或“藏识”（*ālaya-vijñāna*）。其要点在于使自己脱离对现象的分别性对象化，以便从无所分别的立场实现“唯识”的寂静，从而使得修习“大慈悲”成为可能。然而这仍然需要数劫的修行才能达到，并且不是最终状态。
    step2: |-
      第六住心：“关切他人之大乘行者之心”（*taen daijō-shin*，即“他缘大乘心”）：瑜伽行的状态，持唯识（*Vijñapti-mātratā*；日 *yuishiki*）之见，谓一切唯“心”：其分析事象为意识的现象，根源于一层深的非意识性的“藏”或“藏识”（*ālaya-vijñāna*，阿赖耶识）。其旨要在于使自己离于对现象的分别性对象化，从无所分别的立场证得“唯识”的寂静，由此方得修行“大悲”。然而这仍需数劫修行方能达成，并非最终状态。
