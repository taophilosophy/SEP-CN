      The point of Shingon practice is to intentionally accord with, or inter-resonate with, Dainichi’s movements, mirroring the macrocosmic world in one’s own microcosm. Thereby original enlightenment is realized in one’s very own embodied dynamism of bodily, verbal, and mental acts. Shingon ritual meditative practice, as such, involving all three activities is meant to intentionally express the realization of one’s participation in the cosmic mantra language of the *hosshin*. This practice then provides the means of penetrating Dainichi’s cosmic mantric language so that one may directly comprehend and experientially verify *hosshin seppō*. By making use of all of the faculties of one’s embodied existence – thinking, feeling, sensing, acting, visualizing, etc. –, one is led *via kaji* to comprehend the Dharma, not merely conceptually or intellectually but through one’s body-and-mind. In non-duality with the Buddha’s cosmic embodiment, one’s own three human activities (Srkt: *trikarma*; Jpn: *sangō*) – bodily, verbal, and mental – immediately become experienced *as* the Buddha’s own acts, the three cosmic mysteries, as immanent to one’s self. Thereby one is now intentionally participating in the *yoga* or *samadhi* of Dainichi, thus realizing one’s own original enlightenment. In this state called “secret” or “mysterious *samadhi*” (*himitsu sanmaji*) or “secret meditation” (*himitsu zen*), with the help of *kaji*, the integration between man’s “three acts” and Buddha’s “three mysteries” is realized, and Buddha “enters me and I enter” Buddha. As one’s mind thus becomes enlightened and one’s body becomes “adamantine,” one attains Buddhahood. (See *Sokushinjōbutsugi*, ch.5) In bodily-mental co-respondence with the *hosshin*’s omnipresencing *via* the three mysteries, Kūkai claims, the non-duality between self and Buddha is thus realized immediately in one’s embodied existence, thus *sokushinjōbutsu*.
    step1: |-
      真言密教实践的要旨，是有意地与法身的运动相合、相互共振，以自身的微观宇宙镜映宏观宇宙。本觉由此在自身身、语、意业的具体动态中得以实现。真言仪轨的禅修实践既然涉及全部三种活动，就意在有意表达人参与法身宇宙真言语言这一实现。此实践于是提供了穿透大日宇宙真言语言的手段，使人能够直接领会并在经验上验证法身说法。通过运用具身存在的一切能力——思考、感受、感知、行动、观想等——人经由加持被引导去领会法，不只是以概念或智性的方式，而是通过身心。在与佛陀宇宙体现的不二中，人自身的身、语、意三种活动（梵 *trikarma*；日 *sangō*）当下即被经验为佛陀自身的业、宇宙的三密，并且内在于自身。人于是有意地参与大日的瑜伽或三昧，从而实现自身的本觉。在这个称为“秘密三摩地”（*himitsu sanmaji*）或“秘密禅”（*himitsu zen*）的状态中，靠着加持的帮助，人的“三业”与佛的“三密”的合一得以实现，佛“入于我而我入”佛。随着心如是觉悟、身成为“金刚”，人便成佛。（见《即身成佛义》第五章）空海主张，在与法身借三密而遍在的身心相应中，自我与佛的不二遂在人的具身存在中当下实现，这就是即身成佛。
