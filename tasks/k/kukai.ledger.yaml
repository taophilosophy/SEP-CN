      In 816 Kūkai began building a monastic center in Mt. Kōya, and there he died in 835 at the age of 61. In 921, he posthumously received from Emperor Daigo and his court, the honorific title, *Kōbō Daishi* (“Great Teacher Who Spread the Dharma”).
