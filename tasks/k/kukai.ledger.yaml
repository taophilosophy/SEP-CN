      Kūkai in several works (especially in *Shōjijissōgi* and *Unjigi*) explicates the syllabic letter *A* as signifying the above-mentioned “primal non-originating” character of all thing-events, as the “mother” of all syllables, letters, and languages, and the king of all mantras. The sound *A* is also the primal sound made when the mouth first opens to exhale. And in its written form, *A* constitutes the first stroke of every other syllable. *A* is the first syllable of the Sanskrit alphabet as well as of the Sanskrit words for “origin” (*ādi*) and “unborn” (*anutpāda*), combined in the Sanskrit word “primal non-origination” (*ādyanutpāda*). It is also the first letter of the root mantra of Dainichi as depicted in the Taizō Mandara (which we shall discuss below): *A Vi Ra Hūṃ Kham* (Jpn: *A Bira Un Ken*). Furthermore in Sanskrit, *A* is used as a negative prefix. All of these manifold meanings are combined in Shingon’s *mantric* use of *A* to represent the primal vocalization of Dainichi. Its omnipresence in form and sound symbolizes the Buddha-nature of the *hosshin* pervading everywhere, while condensing the significance of that all-prevalence within its singular form and sound. But its all-pervasiveness also means the origin of all things in their interdependence, that is, their interdependent origination, hence emptiness. This emptiness of substance is denoted by its use as a negative prefix, i.e., the absence of self-presence in infinite referentiality. As stated above, *A* signifies the “primal non-originating” character of all being. For in signifying the origin of all in their on-going dependent origination *A* is thus the “origin of no origin.” What this points to is the endlessness of the chain of conditions behind each thing-event, never reaching an ultimate origin or first cause. But paradoxically this primal absence of any distinguishing origin, this ubiquitous in-difference of all differentiation, is itself the ultimate origin of all thing-events in their mutual differentiations and co-relativity. Or put differently, Dainichi’s mind (along with his body), making no discrimination between this and that, is like a great space (“emptiness”; *kū*) from out of which he transforms himself through self-differentiation into the myriad thing-events and beings. This causeless cause is symbolized in the last letter in Sanskrit, the letter *H*, the first letter of the mantra *Hūṃ* (Jpn: *Un*). Its meaning thus coincides with the “primal non-origination” denoted by the first letter of the alphabet, *A*. The syllable *A*, together with *H* then embodies the meanings of emptiness, dependent origination, and primal non-origination, all expressing the beginningless and endless dynamic non-substantiality of the entire cosmos and all being, the empty space that is the body of the *hosshin*, the Dharma of all dharmas.
    step1: |-
      空海在多部著作（尤其《声字实相义》与《吽字义》（*Unjigi*））中阐明字母 *A* 指谓上述一切事的“本不生”性格：它是诸音节、诸字母、诸语言的“母亲”，是真言之王。音 *A* 也是口初开呼气时所发的原初之声；而就其书写形态而言，*A* 构成一切其它音节的首笔。*A* 是梵文字母表的首字母，也是梵文“起源”（*ādi*）与“不生”（*anutpāda*）二词的首音，二词合成梵语“本不生”（*ādyanutpāda*）。它也是胎藏曼荼罗（下文将论）中大日根本真言的首字母：*A Vi Ra Hūṃ Kham*（日：*A Bira Un Ken*）。此外，在梵文中 *A* 用作否定前缀。凡此种种含义，都结合于真言佛教对 *A* 的真言用法之中，以代表大日的原初发声。它在形与声上的遍在，象征着法身的佛性遍满一切处，同时又把这种遍满的意义凝缩于其单一的形式与声音之中。但它的遍在也意味着诸物在其相互依存中的起源，即缘起，故而是空。这种实体的空由其作否定前缀的用法所标示，即：在无限的指谓性中无自身的在场。如上所述，*A* 指谓一切存在的“本不生”性格。因为 *A* 指谓诸物在其持续依缘生起中的起源，故是“无起源之起源”。这指向每一事背后因缘之链的无尽，永不抵达一个终极起源或第一因。但吊诡的是，这种任何区分性起源的原初缺席、一切差别的这种遍在的无差别，本身又是一切事在其相互差别与共属相关性中的终极起源。换言之，大日的心（及其身）不作此与彼的分别，如同一个大空（“空”；*kū*），大日由此经由自我差别而转化为无数的事事与众生。这一无因之因，象征于梵文字母表的末字母 *H*——真言 *Hūṃ*（日：*Un*）的首字母。其意义于是与字母表首字母 *A* 所标示的“本不生”相合。音节 *A* 与 *H* 合起来，便体现了空、缘起与本不生的意义——一切都在表达整个宇宙与一切存在的无始无终的动态非实体性，即那作为法身之身的空的空间，诸法之法。
