      Kūkai’s claim was that only through the Buddhism of esoteric teachings can one attain to an experiential recognition of *hosshin seppō*, i.e. that the cosmos itself is describing the immediate enlightened body-and-mind state of the Buddha. By contrast exoteric truths preached by other forms of Buddhism are meant for a specific audience in a specific place and time, and hence are conditional, relative, and provisional. Moreover exoteric truths are limited by human language, which is inadequate to describe the state of enlightenment and the absoluteness of the Dharma. The esoteric truth revealed in *hosshin seppō* on the other hand unfolds through a non-human language, that is, a cosmic and esoteric language originating in the *hosshin* itself. This is the language of the mantra or in Japanese, *shingon*, literally meaning “the word of truth,” and from which Kūkai’s brand of Buddhism derives its name. Mantra (*shingon*) is the language of the cosmos involving all mental and physical-sensible phenomena. The esoteric truths expressed in this mantric language of the Buddha/cosmos reveal themselves only in accordance with the reader’s capacity to attune himself to, and read, this cosmic (con)text of the mantric universe.
    step1: |-
      空海的宣称是：只有通过密教教法的佛教，人才能获得对法身说法的体验性认识，即认识到宇宙本身正在描述佛陀当下觉悟的身心状态。相比之下，其他佛教形态所宣讲的显教真理，面向特定时间地点的特定听众，因而是有条件的、相对的、权宜的。而且显教真理受人类语言的限制，后者不足以描述觉悟的状态与法的绝对性。另一方面，在法身说法中揭示的密教真理则通过一种非人类的语言展开，即源于法身自身的宇宙的、秘教的密教语言。这就是真言的语言，日语称 *shingon*，字面义为“真实之语”，空海所传佛教的名称即源于此。真言（*shingon*）是宇宙的语言，涉及一切心理与物理可感的现象。表达于佛陀/宇宙的真言语言中的密教真理，只有当读者有能力调适自身去解读这一真言宇宙的宇宙（语）境文本时，才会向其显现。
    step2: |-
      空海的宣称是：唯有经由密教的佛教，人才能对法身说法获得体验性的认识——即认识到宇宙本身正在描述佛陀当下觉悟的身心状态。相比之下，其他佛教形态所宣说的显教真理，面向特定时空中的特定听众，故而是有条件的、相对的、权宜的。而且，显教真理受人类语言的限囿，后者不足以描述觉悟之境与法的绝对性。另一方面，在法身说法中开显的密教真理，则循一种非人的语言展开——即源于法身自身的、宇宙性的秘教语言。这便是真言的语言，日语谓之 *shingon*，字面义“真实之语”，空海所传佛教之名即源于此。真言（*shingon*）是宇宙的语言，遍涉一切心理与物理可感现象。佛陀/宇宙的真言语言所表达的密教真理，唯有当读者有能力调谐自身、去解读这一真言宇宙的宇宙（语）境文本时，方才向其开显。
