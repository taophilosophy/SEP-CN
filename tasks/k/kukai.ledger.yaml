      Shingon ritual practice attempts to trigger this realization through the mantric pronunciations of the five basic syllables of Sanskrit – *A*, *Va*, *Ra*, *Ha*, *Kha*, (and sometimes adding a sixth syllable *Hūṃ*) –, emulating the primordial utterance of Dainichi. This is to attune the practitioner to the inter-resonance of the basic elements underlying all phenomena, so that he may hear the “true words” being preached by Dainichi. The mantra’s power is in its incomprehensibility to human understanding. Its significance cannot be explained analytically or understood conceptually; it is instead to be experienced in ritual. Through ritualized experience, these intellectually incomprehensible sounds, in the self-deconstruction of any assumed or projected meaningfulness, paradoxically evoke the emptiness they mean and the emptiness of their meaning, the emptiness of all in their mutual non-obstruction and interdependence. Its incomprehension makes explicit the materiality and dynamic process involved behind the emergence of signs. This undermines any linguistic assumption of the substantiality of things and hence any delusory attachments to them. What is invoked is a paradigm shift from seeing the surface pattern of things to seeing their underlying emptiness. (Abe 1999, 297–98)[^abe-1999] In addition to mantric intonations, another form of practice was *a-ji* meditation, wherein the written form of the Sanskrit letter *A* is treated as an object of meditation. The purpose of such concentrated attention on the material form of a sign is to gain some sort of an experiential comprehension of its esoteric significance, somewhat similar to that of mantra incantation as just discussed. However we must note the special significance of the particular letter *A*, which we shall discuss below.
    step1: |-
      真言仪轨修持试图以梵文五个基本音节的真言诵念——*A*、*Va*、*Ra*、*Ha*、*Kha*（有时加上第六音节 *Hūṃ*）——来触发这种证悟，模拟大日的原初言语。这是为了使修行者与一切现象底下诸基本要素的相互共振相调谐，从而能听见大日所宣说的“真言”。真言的力量在于它对人类知性的不可理解性。它的意义无法被分析地解释或被概念地把握；它毋宁要在仪轨中被经验。通过仪轨化的经验，这些智性上不可理解的音声，在其所假定或投射的意义性的自我解构中，吊诡地唤起它们所指谓的空、其意义自身的空、一切在相互无碍与相互依存之中的空。这种不可理解使符号涌现背后的物质性与动态过程显豁可见。这削弱了任何以事物为实体的语言学预设，从而削弱任何对事物的迷惑性执着。所唤起的是一种范式转变：从看事物的表层纹样，转到看它们底层的空。（Abe 1999, 297–98）[^abe-1999] 除真言诵念外，另一种修持形式是阿字（*a-ji*）观，其中梵文字母 *A* 的书写形态被当作禅观的对象。如此专注于一个符号的物质形态，目的在于对其密教意义获得某种经验性的领会，与刚才讨论的真言持诵有些类似。但我们必须注意字母 *A* 的特殊意义，下文将予以讨论。
