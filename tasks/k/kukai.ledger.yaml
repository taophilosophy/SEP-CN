      This *Kongō-kai* mandala is a rectangle consisting of a combination of nine smaller mandalas, each an originally independent mandala, juxtaposed to depict a double spiraling movement, centrifugal and centripetal: on the one hand outward of the Buddha’s enlightenment towards the phenomenal world, and on the other hand inward of beings on the periphery from the mundane world in spiritual progression towards enlightenment at the center. Of the nine smaller mandalas, the most basic, which are on the lower left corner, are representations of the so-called “four mandalas” (*shimandara*) that Kūkai classified as the form of appearance of the *hosshin*. (More on the *shimandara* in the next section.) All together the nine depict the unending activity of the enlightened mind, moving clockwise from the center, to take on increasingly concrete forms, engaging in skillful means to help the unenlightened, while the unenlightened evolve towards the center. From the Buddha’s perspective, the center is moving outwards; and from the individual practitioner’s perspective, the periphery is being drawn inwards. Enlightened wisdom cannot remain aloof from the realities of unenlightened life. Skillful means thus embodies wisdom in concrete phenomenal activity. In this respect, the mandala emphasizes the non-duality between wisdom (*hannya*) and skillful means. And it symbolizes the wisdom that knows truth, the Dharma, in all its separate manifestations.
    step1: |-
      这金刚界曼荼罗是一个矩形，由九个小曼荼罗组合而成，每一小曼荼罗原本都是独立的曼荼罗，并置以描绘一个双重螺旋运动：一方面是佛陀的觉悟向现象世界离心地展开，另一方面是居于周缘的众生自凡俗世界向心地、在精神的进阶中趋往中心的觉悟。九个小曼荼罗中，位于左下角的最基本者，是所谓“四种曼荼罗”（*shimandara*）的表象——空海把四种曼荼罗归类为法身的显现形态。（四种曼荼罗详见下一节。）九者合起来描绘觉悟之心的无尽活动：自中心顺时针运行，取得愈加具体的形式，施展方便以助未觉者，而未觉者则向中心进化。从佛陀的视角看，中心向外运行；从个体修行者的视角看，周缘被向内牵引。觉悟的智慧不能自外于未觉生活的实相。方便因而在具体的现象活动中体现智慧。就此而言，曼荼罗强调智慧（*hannya*，般若）与方便之间的不二。它也象征那在一切分离的显现中认知真理——法——的智慧。
