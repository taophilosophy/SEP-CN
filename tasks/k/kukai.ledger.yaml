      *Hosshin* in its somaticity is identified with the cosmos as an organic whole wherein thing-events come and go *via* interdependent origination. The cosmos as such is called *hokkai* (Skrt: *dharmadhātu*; world/realm of the Dharma), and in turn *as* the *hosshin*, it is the body or *soma* (*tai*) of the Buddha Dainichi. (However it should not be understood as *substantial* in the western philosophical sense because it is “empty” – more on “emptiness” below.) Hence Kūkai in *Shōjijissōgi* cites lines from the *Avatamsaka Sūtra* that “all lands are in the body of the Buddha,” or that “each hair [of the Buddha] contains myriad lands as vast as oceans…” And yet simultaneously the truth, the Dharma, embodied in the entire cosmos is manifest within each of its micro-cosmic parts. This view that the whole permeates its parts – reminding us perhaps of the more recent theories of holonics or the holographic model of the universe – allows Kūkai to show that the *hosshin* does indeed preach the Dharma throughout the cosmos in its every single aspect.
    step1: |-
      就其身体性而言，法身等同于作为一个有机整体的宇宙，事物事件在其中经由缘起而生灭。这样的宇宙称为法界（*hokkai*；梵 *dharmadhātu*；法的世界/法之界），而它反过来**作为**法身，便是佛陀大日的身体或躯体（体，*tai*）。（不过不应在西方哲学的意义上把它理解为*实体性的*，因为它是“空的”——“空”详见下文。）因此空海在《声字实相义》中引用《华严经》的句子：“一切刹土皆入佛身”，或“佛之一一毛孔，含纳如海无量的刹土……”然而与此同时，体现于整个宇宙的真理——法——也显现在它的每一个微观宇宙的部分之中。整体渗透于部分的这一观点——或许令人想起晚近的整体子学理论或宇宙的全息模型——使空海得以表明：法身确实遍于宇宙的每一个方面而说法。
    step2: |-
      就其身体性而言，法身等同于作为一个有机整体的宇宙：事物事件在其中**经由**缘起而生灭流转。如此被理解的宇宙称为法界（*hokkai*；梵 *dharmadhātu*，法之世界/法之界），而它反过来**作为**法身，便是佛陀大日的身体或躯体（体，*tai*）。（不过，不应在西方哲学的意义上把它理解为*实体性的*——因为它是“空的”；关于“空”，详见下文。）因此空海在《声字实相义》中引用《华严经》的文句：“一切刹土皆入佛身”，或“佛之一一毛孔，含纳如海无量的刹土……”然而与此同时，体现于整个宇宙的真理——法——也显现于它的每一个微观宇宙的部分之中。整体渗透于部分的这一观点——或许令人想起晚近的整体子论或宇宙的全息模型——使空海得以表明：法身确实遍于宇宙的每一个侧面而说法。
