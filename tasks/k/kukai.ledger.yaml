      From the mantric articulation of the Dharma emerge ten realms and their respective languages (of hell dwellers, hungry ghosts, animals, asuras, humans, celestial heaven dwellers, *śrāvakas*, *pratyeka-buddhas*, *bodhisattvas*, and buddhas). Each realm as an articulation of the Dharma, has its own “sounds-and-signs,” i.e., its own language, in accordance with a specific perspective corresponding to the degree of enlightenment and illusion of its inhabitants. But only the language of the highest, the most comprehensive realm, i.e., the realm of the Buddha, is identified with the “true word” (*shingon*, *mantra*), designating the Dharma as it is. The nine other languages are by contrast “illusory words” (*mōgo*). And yet they nevertheless do express the Dharma, each from its own relative and limited perspective. In this restricted sense, they are all mantras as well. For they take part in the cosmic text of the *hosshin* written in the same inter-referential interrelationships obtaining in all thing-events *via* the interplay of the same universal elements. The difference is that while the other languages are not conscious of their source, the most comprehensive language, the “sounds-and-signs” of the Buddha-realm, entails self-awareness of its mysterious origin.
    step1: |-
      由法的真言宣说中生出十界，及其各自的语言：地狱众生、饿鬼、畜生、阿修罗、人、天界住民、声闻（*śrāvakas*）、缘觉（*pratyeka-buddhas*）、菩萨（*bodhisattvas*）与佛。每一界作为法的一种宣说，都有其自身的“声与符号”，即其自身的语言，与其住民觉悟与迷惑的程度所对应的特定视角相合。但唯有最高、最广大之界——即佛界——的语言，才被等同于“真言”（*shingon*，*mantra*），如其本然地指谓法。其余九种语言相对而言则是“妄语”（*mōgo*）。然而它们仍然表达法，各自从其相对而有限的视角表达。在这限定的意义上，它们也都是真言。因为它们同样参预法身（*hosshin*）的宇宙文本——这文本书写于一切事事的同一互指关系之中，经由同一普遍要素的互动而成。区别只在于：其它语言不觉其源头，而最广大的语言、佛界的“声与符号”，则对自身神秘的源头具有自觉。
    step2: |-
      法以真言而宣说，由此生出十界及其各自的语言：地狱、饿鬼、畜生、阿修罗、人、天、声闻（*śrāvakas*）、缘觉（*pratyeka-buddhas*）、菩萨（*bodhisattvas*）、佛。每一界既是法的一种宣说，便各有其“声与符号”，亦即各有其语言，与该界住民觉悟与迷惑的程度所对应的特定视角相应。然而唯有最高、最广大的一界——佛界——的语言，才与“真言”（*shingon*，*mantra*）同一，如其本然地指谓法；其余九种语言相对而言皆是“妄语”（*mōgo*）。但妄语亦未尝不表达法——各自从其相对而有限的视角表达。就此限定的意义而言，九种语言也都是真言：它们同参法身（*hosshin*）的宇宙文本，这文本书写于一切事事的互指关系之中，而此关系由同一普遍要素的互动而成。所异者仅在：他种语言不觉其源，而最广大的语言——佛界的“声与符号”——则自觉其神秘源头。
