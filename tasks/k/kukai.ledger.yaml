      1ˢᵗ state: “The mind of the goat foolishly transmigrating in the six destinies (or realms)” (*ishō teiyō-shin*): The state of desire driven by animal instincts without moral restraint; the stage to which belong common people, hell-beings, hungry-ghosts, beasts, *asuras* (“titans”), and various deities or celestial beings trapped in their *samsaric* destinies.
    step1: |-
      第一状态：“如羊般愚痴地流转于六道（或诸界）之心”（*ishō teiyō-shin*）：由动物本能驱动、无道德节制的欲望状态；属于此阶段的有普通人、地狱众生、饿鬼、畜生、阿修罗（“巨灵”）以及种种困于轮回诸趣的神祇或天人。
    step2: |-
      第一住心：“如羊般愚痴流转于六道（或诸趣）之心”（*ishō teiyō-shin*，即“异生昏缠心”）：为动物本能所驱、无道德节制的欲望状态；属此阶位的有凡俗常人、地狱、饿鬼、畜生、阿修罗（“巨灵”）以及种种困于轮回诸趣的神灵或天人。
