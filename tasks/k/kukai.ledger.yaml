      The *Taizō-mandara* (full name: *Daichitaizōsei mandara*; Skrt: *Garbhakośadhātu mandala*; “Great compassion womb repository birth mandala”) represents the “female principle” and expresses the material world in its underlying empatternment of *ri*, which is the Buddha’s view to truth from the summit of enlightenment downward to the mundane world of humans. *Ri* (Chn: *li*) often translated into English as “principle,” in fact has the sense of “pattern,” and in the esoteric Buddhist context signifies the pattern found in the interplay of the five material elements that constitute the myriad thing-events and phenomena. As the material elements form the objects of cognition, the mandala depicting the *rishin* represents the known. In his commentary on the *Dainichi-kyō* (*Dainichi-kyō* *kaidai*), Kūkai equates the nature of Dainichi taken as *jishō hosshin* with this *rishin*. He then in turn identifies the *rishin* as the original enlightenment intrinsic to all sentient beings but hidden in its unmanifest potentiality as what is to be known.
    step1: |-
      胎藏曼荼罗（全名：大悲胎藏生曼荼罗（*Daichitaizōsei mandara*）；梵：*Garbhakośadhātu mandala*，意即“大悲胎藏所生之曼荼罗”）代表“女性原理”，表达物质世界在其理之深层纹样构成中的形态——这是佛陀的真理之观，自觉悟的顶峰向下俯临人的凡俗世界。理（汉语作 *li*）常被英译为 “principle”，实则有“纹样”之意，在密教语境中指构成无数事象的五大要素互动之中的纹样。由于物质要素构成认知的对象，描绘理法身的曼荼罗便代表所知。空海在《大日经开题》（*Dainichikyō kaidai*）中把大日作为自证法身（*jishō hosshin*）的本性与这一理法身相等同。他进而又把理法身等同于一切有情本具的本觉——它作为所知而潜藏于未显的潜能之中。
