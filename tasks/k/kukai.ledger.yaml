      Implaced within this vibrating cosmos, we are all then taking part in Dainichi’s bodily, verbal, and mental activities as “originally enlightened,” non-dualistic with the Buddha. On the basis of *kaji*, which we discussed above, the three mysteries of the *hosshin* and the three corresponding forms of activities of sentient beings inter-permeate. That is, our own bodily, verbal, and mental activities are already expressions of the three mysteries of the *hosshin*. This inter-permeation is hence “always already,” and yet what is lacking for the most part is our awareness of it that would realize it. That is why Kūkai, following the *Dainichikyō*, prescribes the ritual practice of bodily acts, verbal acts, and mental acts. Bodily acts involve *mudra*-formations – these are complex series of gestural movements of the hands and fingers in coordination with mantra-chanting and visualizations –, meditative bodily postures, and the handling of ritual instruments. Verbal acts involve mantra-recitations and other forms of prayer formulas or chants and verses (*dhāranīs*). And mental acts involve visualizing or focussing upon mandalas or the figures of Sanskrit mantra letters as well as visualizations (*kansō*, *kannen*) of deities or buddhas – a realization of self and world in the sense of *both* transformation *and* awakening as their fruit. Together with *ingei* (*mudra*) and *shingon* (*mantra*), the practitioner’s *kansō* allows the mandalic structure inseparable from the insight attained in such practice – an “image” that in itself is visually unrepresentable and hence irreducible to the visual mandalic icon – to unfold. The three acts are performed simultaneously in a practice wherein the practitioner utters a mantra, forms *mudras*, and visualizes their form and meditates their meaning and lets his mind abide in *samadhi*, all at the same time.
    step1: |-
      置身于这个振动的宇宙中，我们于是都以“本觉”者、与佛不二的身份，参与大日的身、语、意活动。基于我们上面讨论过的加持，法身的三密与众生相应的三种活动形式相互渗透。也就是说，我们自己的身、语、意活动已经是法身三密的表达。因此这种相互渗透是“始终已经”的，然而大多数情况下所缺少的，是我们对它的、能使它实现的那种觉知。这就是为什么空海遵循《大日经》，规定身业、语业、意业的仪轨实践。身业涉及印契的结成——这些是手与手指配合真言诵念与观想的复杂身势动作系列——、禅定身姿以及法器的执持。语业涉及真言诵念以及其他形式的祈祷文句、唱诵与偈颂（*dhāranīs*）。意业涉及观想或专注于曼荼罗或梵文真言字母的形相，以及对神祇或佛的观想（*kansō*、*kannen*）——在转化与觉醒二者皆为其果的意义上实现自我与世界。与印契（*ingei*）及真言（*shingon*）一起，修行者的观想（*kansō*）使与此实践中所得洞见不可分离的曼荼罗结构得以展开——这是一个自身在视觉上不可表现、因而不可还原为视觉曼荼罗图像的“像”。三种业在一门实践中同时进行，修行者诵真言、结印契、观想其形相、思维其义，并令心安住三昧，一切同时。
