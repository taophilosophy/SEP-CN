      空海的佛陀观的独特之处在于，他字面地、彻底地对待“法之身”这一观念。真言宗思想中的法身不是超越尘世的抽象真理。毋宁说，这一宇宙的**一切**现象与事物事件，就在其迁流无常之中，各自本身就是真理的体现；而由这些无常且相互依存的存在者构成的整体宇宙，永恒地是真理的体现，即法身。而且，佛陀、真理与事物事件的宇宙之间这一具体的宇宙论同一，是“位格性的”：法身等同于大日如来。作为真理——法——之显现的宇宙，因此被等同于位格性佛陀大日的身体。反过来，大日以其宇宙之身，成为内在于一切存在者的普遍佛性、以及无处不在显现的法之体现人格化。在惠果之前，真言乘佛教中这一大日与法身的同一仍是含混而不彻底的。《大日经》以太阳的隐喻命名其中心佛陀“大日”（*Mahāvairocana*，音译 *Makabirushana*），意为“大太阳”，即以其光如同太阳给予生命的光那样照彻并觉悟一切众生的存在者。所有其他神格都被视为这一光的显现。但大日与法身的同一仍然含混。虽然惠果或许在这一等同上影响了空海，但他本人没有留下任何成文的阐释。因此空海被视为第一个对佛陀大日**作为**法身的本性提供完整而系统的阐述的人。光的隐喻——作为存在与知识（觉悟）二者的来源——完美地契合于法身的普遍性。“大太阳”（大日）的照彻因此被理解为法在宇宙中的无处不在，这种无处不在又等同于佛陀的说法。这一法身确实说法的“证明”，帮助空海把他的密教教义区别于显教。
    step2: |-
      空海佛陀观的独到之处在于：他把“法之身”的观念按其字面、且彻底地对待。在真言宗思想中，法身并非超越尘世的抽象真理。毋宁说，此一宇宙的**一切**现象与事物事件，就在其迁流无常之中，各自即是真理的体现；而由这些无常而相互依待的存在者所构成的整体宇宙，则永恒地是真理的体现——即法身。而且，佛、真理与事物事件的宇宙之间这一具体的宇宙论同一，还是“位格性的”：法身被等同于大日如来。作为真理——法——之显现的宇宙，由此被等同于位格佛陀大日之身；反过来，大日以其宇宙之身，成为遍在一切存在者的普遍佛性与无处不在显现之法的人格化体现。在惠果之前，真言乘佛教中这一大日与法身的同一仍属含混而未彻。《大日经》以太阳为喻命名其中枢佛陀“大日”（*Mahāvairocana*，音译 *Makabirushana*），意为“大太阳”：他犹如给予生命的日光，照彻并点醒一切众生，而其他一切神格皆被视为此光的显现。尽管如此，大日与法身的同一依然含混。惠果或许在这一等同上启发了空海，但他本人未留下成文的解说。因此，空海被视为第一人，就佛陀大日**作为**法身的本性给出完整而系统的论述。光之喻——既是存在的来源、又是知识（觉悟）的来源——完美地契合法身的普遍性。“大太阳”（大日）的照彻相应地被理解为法在整个宇宙中的遍在；这一遍在又被等同于佛陀的说法。法身确实说法——这一“证明”帮助空海把他的密教教义区别于显教。
