    source: |-
      The *hosshin* in its cosmic significance appears in the form or figure (*sō*) of a *mandara* (Skrt: mandala). That is, its cosmic body appears in a mandalic pattern, as represented in the mandalas used in Shingon ritual. Correspondingly the mind of a sentient being is also supposed to take on the form of a mandala especially as one advances in practice to realize non-duality with the mandalic *hosshin*. That is, the mind-and-body experience of each sentient being mirrors in its own way the mandalic pattern of the cosmos. As one becomes enlightened, one comes to realize this inter-mirroring. In the envisioning of reality as a mandala, the practitioner, who on the one hand is aiming for Buddhahood, is *at the same time also* the Buddha existing in the mandalic reality and expressing itself in mandalic form. Whether seen as the form experienced in the mind or as the form of the cosmos, the mandalic figure is the Buddha’s mode of expressing the Dharma. This mandalic appearance of the Buddha is categorized into four types, which we will discuss in a section below.
    step1: |-
      就其宇宙意义而言，法身以曼荼罗（*mandara*；梵 mandala）的形态或形貌（相，*sō*）显现。也就是说，它的宇宙之身以曼荼罗的模式显现，正如真言仪式所用曼荼罗所描绘的那样。相应地，有情的内心也被认为应采取曼荼罗的形态，尤其当修行者进阶而实现与曼荼罗化法身的不二之时。也就是说，每一有情的身心经验以自己的方式映现宇宙的曼荼罗模式。当人觉悟时，便开始领会这种相互映现。在把实在观想为曼荼罗时，修行者一方面以成佛为目标，**同时也**是存在于曼荼罗实在之中、以曼荼罗形态表达自身的佛。无论被看作心中经验的形态，还是宇宙的形态，曼荼罗形貌都是佛陀表达法的方式。佛陀的这种曼荼罗显现分为四类，我们将在后面一节讨论。
    step2: |-
      就其宇宙意义而言，法身以曼荼罗（*mandara*；梵 mandala）的形相（相，*sō*）显现：它的宇宙之身以曼荼罗的图式显现，正如真言仪轨所用曼荼罗所描绘的那样。相应地，有情的内心也被认为应呈现曼荼罗之形——尤其当修行者进阶而实现与曼荼罗化法身的不二之时。也就是说，每一有情的身心经验都以自己的方式映照着宇宙的曼荼罗图式；人一旦觉悟，便领会这种相互映照。在把实在观想为曼荼罗之际，修行者一方面以成佛为目标，**同时也**是住在曼荼罗实在之中、以曼荼罗之形表达自身的佛。无论被看作心中经验的形相，还是宇宙的形相，曼荼罗形貌都是佛陀表达法的方式。佛陀的这种曼荼罗显现分为四种类型，详见后面一节的讨论。
