      It is interesting to note that the celestial buddhas and the historical buddha (Śakyamuni) are here included as themselves forms of the *hosshin*, when in the traditional *trikāya* doctrine of Mahāyāna, they were distinguished from the *hosshin*, which in turn was seen as abstract and impersonal. Furthermore, according to this doctrine of the four forms of the *hosshin*, it is not only the celestial buddhas in the heavens and the historical buddha on earth who preach, but *all* four forms. From Kūkai’s esoteric standpoint, the *hosshin* even in its *samadhic* self-enjoyment is preaching the Dharma in its cosmic monologue – for its very embodiment is the cosmos itself so that its *samadhic* experiencing of the Dharma permeates everywhere and everywhen. Simply put, Dainichi *as* the *hosshin* and *as* the personification of the Dharma concretely embodied in the cosmos, is directly preaching the Dharma to the world *via* his omni-presencing being. And while in the broader sense the *hosshin* is thus preaching *via* the cosmos, in the narrower sense its preaching is manifest in the teachings of esoteric Buddhism itself. On the other hand the doctrines of what Kūkai classified as exoteric are traced to either what the historical buddha, Śakyamuni, preached or what the celestial buddhas are preaching in the heavenly dimensions. Insofar as they themselves are embodiments of the *hosshin*, what they preach are indirectly teachings of the *hosshin*. But their teachings are provisional, relative only to the comprehension of their audience and the circumstance of time and place wherein they are preached. Kūkai claims, however, that through training in Shingon esotericism, one can receive the teachings of the *hosshin* *directly* – that is, receive the timeless and absolute, cosmic and holistic, truth of the Dharma in its very embodiment. This was a radical and heterodox claim at the time since the teaching common to all orthodox Buddhist schools was that the sūtras can all be traced back to the preachings of Śakyamuni and this lineage is what legitimated their use of the sūtras. But for Kūkai, the historical Buddha was but one manifestation of the cosmic Buddha, Dainichi, who embodies the truth (Dharma, *hō*) it preaches as the *hosshin*.
    step1: |-
      值得注意的是，天界诸佛与历史佛陀（释迦牟尼）在此都被纳入为法身自身的形态；而在大乘传统的三身说中，它们本区别于被视为抽象而无位格的法身。而且，依据这一法身四身说，不只天上的诸佛与地上的历史佛陀说法，而是**全部**四种身都在说法。从空海的密教立场看，法身即使在三昧自受之乐中也以其宇宙独白宣说法——因为它的体现就是宇宙本身，它对法之三昧式体验渗透于一切时间与空间。简言之，大日**作为**法身、**作为**在宇宙中具体体现的法的化身人格，正**经由**其遍在的存在直接向世界说法。在广义上，法身如此经由宇宙而说法；在狭义上，其说法显现于密教教法本身。另一方面，被空海归为显教的诸教义，则被追溯至历史佛陀释迦牟尼所说、或天界诸佛在天界所说。就它们自身是法身的体现而言，它们所说的是法身的间接教法。但它们的教法是权宜的、相对的，只相对于听众的理解力与说法时地而定。然而空海宣称，通过真言密教的修习，人可以**直接**领受法身的教法——也就是说，在法的身体性存在之中，领受那无时间的、绝对的、宇宙性的、整体性的法之真理。这在当时是一个激进而离经的宣称，因为一切正统佛教宗派的共同教义是：诸经典都可以追溯到释迦牟尼的说法，这一传承谱系正是它们使用经典的合法性来源。但对空海而言，历史佛陀只是宇宙佛陀大日的一种显现，而大日**作为**法身体现着它所说的真理（法，*hō*）。
    step2: |-
      耐人寻味的是，天界诸佛与历史佛陀（释迦牟尼）在此都被纳入法身自身的形态；而在大乘传统的三身说中，它们本区别于法身，后者被视作抽象而非位格。而且依此四种法身说，说法者不限于天上的诸佛与地上的历史佛陀，而是**全部**四种身都在说法。从空海的密教立场观之，法身纵在三昧自受之乐中，也正以其宇宙独白宣说法要——因为它的体现即是宇宙本身，它对法之三昧体验渗彻于一切处所与一切时。简言之，大日**作为**法身、**作为**在宇宙中具体体现的法的化身人格，正**经由**其遍在的存在向世界直接说法。广义上，法身如此经由宇宙而说法；狭义上，其说法则显现于密教教法本身。另一方面，被空海归为显教的种种教义，或溯源至历史佛陀释迦牟尼所说，或溯源至天界诸佛在天界所说。既然它们自身也是法身的体现，它们所说的便是法身的间接教法；但这些教法是权宜的、相对的，仅相对于听众的理解力与说法的时空情境而立。空海却宣称：经由真言密教的修习，人能够**直接**领受法身的教法——亦即，就在法的身体性存在之中，领受那无时间、绝对、宇宙性、整体性的法之真理。这在当时是一个激进而离经的宣称：一切正统佛教宗派的共同教义本是诸经皆可溯至释迦牟尼的说法，而这一传承谱系正是它们使用经典的正当性所系。但对空海而言，历史佛陀不过是宇宙佛陀大日的一种显现；大日**作为**法身，体现着它所宣说的真理（法，*hō*）。
