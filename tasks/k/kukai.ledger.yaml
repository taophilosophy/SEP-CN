      Shingon has inherited much of the metaphysics of Chinese Mahāyāna thought: e.g., the equation of *hosshin* and *hokkai*, traceable to Hua-yen Buddhism; and the equation of the *hosshin* with the universal Buddha-nature inherent in all beings as their “original enlightenment”, traceable to T’ien-t’ai (Tiantai; Jpn: Tendai) Buddhism. Combining these Mahāyāna equations, in Shingon, the embodiment of the Dharma equals the cosmos as the realm of truth, the Dharma, which in turn means the inherent universal original enlightenment (*honnu hongaku*) in all beings. But what distinguishes Kūkai’s thought is in his focus upon the body and its concrete practice. The cosmos is the “body of truth” and our own bodies take part in that cosmic body. It is this bodily aspect, as a universal medium or plenum that allows for the concretization of universal enlightenment to be realized through ritualized bodily experience. Both Hua-yen and T’ien-t’ai had similar notions of universal original enlightenment although that idea was quite new to Japan at the time. But what they lacked was any concrete ritual means for realizing that enlightenment aside from basic meditation. Kūkai contended that their teachings were thus lacking in the area of practice. His emphasis upon a bodily ritual *praxis* that cohered with scriptural doctrine provided them with soteriological – rather than just magico-secular – significance. This helped to bridge the gap between theory and practice, doctrine and ritual, that was previously left unexplained by the orthodox Nara schools of Buddhism. As a consequence of his explication of *sokushinjōbutsu*, Kūkai thus provided *both* a coherent explanation of the relationship between theory and practice, *and* a concrete method for realizing through bodily experience those teachings, a practical method for realizing what Mahāyāna already taught in China as *hongaku*.
    step1: |-
      真言密教继承了中国大乘思想的许多形而上学：例如法身与法界的等同，可以追溯到华严佛教；以及法身与一切众生本具的普遍佛性即其“本觉”的等同，可以追溯到天台（T’ien-t’ai；日 Tendai）佛教。综合这些大乘的等式，在真言密教中，法的体现等于宇宙作为真理即法的领域，而这又意味着一切众生本具的普遍本觉（*honnu hongaku*）。但空海思想的独特之处在于他关注身体及其具体实践。宇宙是“真理之身”，而我们自己的身体参与那个宇宙身体。正是这个身体方面，作为普遍媒介或充满一切者，使普遍觉悟的具体化得以通过仪轨化的身体经验而实现。华严与天台都有类似的普遍本觉观念，尽管那个观念在当时对日本来说颇为新奇。但他们所缺少的是除基本禅修之外实现那种觉悟的任何具体仪轨手段。空海因此主张他们的教法在实践方面有所欠缺。他强调一种与经典教义相一致的身体仪轨实践，为这些教法提供了救度的——而非仅仅是法术世俗的——意义。这有助于弥合理论与实践、教义与仪轨之间此前未被正统奈良佛教诸宗解释的鸿沟。作为其即身成佛阐释的结果，空海因此既提供了理论与实践关系的融贯解释，也提供了一种通过身体经验实现那些教义的具体方法，一种实现大乘在中国早已宣说的“本觉”的实践方法。
    step2: |-
