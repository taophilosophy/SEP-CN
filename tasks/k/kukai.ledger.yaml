      *Kaji* is realized as one becomes aware of one’s self and activity as the micro-cosmic manifestation of the macro-cosmic activity and mystery of the cosmos itself. One could then also say that *kaji* expresses the mutuality and coherence or co-responding that obtains between the two major concepts characterizing esoteric Buddhism for Kūkai: *hosshin seppō* and *sokushinjōbutsu*, as two ways of conceiving from different angles the same interrelationality of the cosmos in its *mantric* and mandalic expressions. That is to say, in the *mantric* and mandalic nature of this interrelationality, the Buddha’s *hosshin seppō* on the one hand descends from the summit and spreads-out from the center, and the practitioner’s *sokushinjōbutsu* on the other hand raises him from below and gravitates him to the center. Their simultaneity means their non-duality as different aspects of the same dynamism of a cosmic emptiness. To realize this, is to affirm one’s own original enlightenment in one’s present body in simultaneous reception of Dainichi’s expounding of the Dharma.
    step1: |-
      加持是在人意识到自我与自己的活动就是宇宙自身宏观活动的微观显现、就是宇宙自身的奥秘时实现的。人们也可以说，加持表达了空海眼中标志密教的两大概念——法身说法与即身成佛——之间存在的相互性与一致性或相互应和，二者是从不同角度构想同一宇宙相关性（在其真言与曼荼罗的表达中）的两种方式。也就是说，在这种相关性的真言性与曼荼罗性中，佛陀的法身说法一方面从峰顶降下并从中心向外展开，而修行者的即身成佛另一方面则把他从下方抬起并使他向中心靠拢。二者的同时性意味着它们的不二性，即它们是同一宇宙之空这一动态的不同方面。实现这一点，就是在同时领受大日说法的当下，确认自身在现有身体中的本觉。
    step2: |-
      当人意识到自我与自己的活动即是宇宙自身宏观活动的微观显现、即是宇宙自身的秘密时，加持便得以实现。也可以说，加持表达了空海眼中密教两大特征概念——法身说法与即身成佛——之间的相互性与一致性或相互应和：二者是从不同角度构想同一宇宙相关性（在其真言与曼荼罗表现中）的两种方式。也就是说，在这一相关性的真言性与曼荼罗性中，佛陀的法身说法一方面自峰顶降下、自中心向外铺展，修行者的即身成佛另一方面则自下而上升起、向中心汇聚。二者的同时性意味着其不二性：它们是同一宇宙之空的动态的不同面向。实现这一点，便是在领受大日说法的同时，确认自身在此身中的本觉。
