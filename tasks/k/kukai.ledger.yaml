      What exactly is the Dharma, the truth that all languages and all texts point to as their mysterious source? Kūkai explicates its significance *qua* emptiness in terms of “primal non-origination” (Skrt: *ādyanutpāda*; Jpn: *honpushō*). What Kūkai means by “non-origination” is related to his understanding of the emptiness of things and the differential referentiality of signs. By incorporating the Mahāyāna thought of emptiness, Kūkai’s linguistic ontology of the mantra proves to be simultaneously a linguistic “an-ontology” (or: “meontology”) of sorts. Every phenomenon of the cosmos, being empty of substantiality, is what it is through its interdependent origination (Skrt: *pratītya-samutpāda*; Jpn: *engi*). Likewise each signifying letter of the cosmic text is *what it is* not because of its own substantial identity but rather through its difference from other signifying letters. Its identity is constituted not on the basis of a self-same essence but rather in reference to, and difference from, others. Signification then for Kūkai is nothing but differentiation (*shabetsu*), which is another way of speaking of the non-substantiality, i.e., emptiness, of phenomena. Every thing – rocks, mountains, ants, etc. – is what it is in mutual distinction with everything else. And this differentiation occurs *via* its implacement into a specific situation or context vis-à-vis other things in an endless chain of mutually referring (and differing) correlative thing-events. In reference to others and without substantial self-presence, each thing-event is hence empty. In this respect, every thing, as signifying letter, is an embodiment of emptiness. And as such a sign or letter manifesting emptiness and differential referentiality, each thing-event is thus a mantra, Dainichi’s “seal of wisdom of differentiation” (*shabetsu chiin*). The cosmic text constituted of mutually differing signs is then the empty place of empty things, and as such, the ultimate scripture of emptiness. The *hosshin* as the embodiment of this truth, the Dharma, is thus itself differentiation, emptiness.
    step1: |-
      法究竟是什么——一切语言、一切文本所指为其神秘源头的那个真理？空海以“本不生”（梵：*ādyanutpāda*；日：*honpushō*）来阐明法就其空性而言的意义。空海所谓“不生”，与他对于物之空性、符号之差别指谓性的理解相关。通过纳入大乘的空之思想，空海的真言语言存在论同时表明自身是某种语言上的“非存在论”（或“无有论”（meontology））。宇宙中的每一现象，因其无实体性而空，是经由其缘起（梵：*pratītya-samutpāda*；日：*engi*）而是其所是。同样，宇宙文本中每一个指谓性的字母，其**是其所是**并非由于自身实体性的同一，而是由于它与其它指谓字母的差别。它的同一性不是建立在自同的本质之上，而是在指涉他者、与他者相异之中构成。于是，对空海而言，指谓不过是差别（*shabetsu*），而这不过是换一种说法谈论现象的非实体性，即空性。每一事物——岩石、山、蚂蚁等等——都是在与一切他物的相互区别之中而是其所是。而这种差别发生于一无尽的事事相缘链条之中：一物被置入相对于他物的特定处境或脉络之中。指涉他者而无实体性的自身在场，故每一事是空的。就此而言，每一事物作为指谓性的字母，皆是空的体现。而作为显现空性与差别指谓性的符号或字母，每一事便是一个真言，大日的“差别智印”（*shabetsu chiin*）。由相互差别的符号所构成的宇宙文本，于是是空的事物的空位，如此，也就是空的究竟经文。法身作为这一真理——法——的体现，因而自身即是差别、即是空。
    step2: |-
      法究竟是什么？——一切语言、一切文本共同指向的那个神秘源头，那个真理。空海以“本不生”（梵 *ādyanutpāda*；日 *honpushō*）阐明法之为空的意义。他所谓“不生”，牵连着他对物之空性与符号之差别指谓性的理解。纳入大乘空观之后，空海的真言语言存在论同时显身为一种语言的“非—存在论”（an-ontology），毋宁说“无有论”（meontology）。宇宙的每一现象都空无实体，皆由缘起（梵 *pratītya-samutpāda*；日 *engi*）而是其所是；同样，宇宙文本中的每一个指谓字母，其**是其所是**不靠自身的实体同一，而靠它与其它指谓字母的差别。它的同一性不立基于自同的本质，而在指涉他者、异于他者之中构成。故在空海，指谓无他，正是差别（*shabetsu*）；这不过是换一套说法讲现象的非实体性——空。一物——岩石、山岳、蝼蚁——皆在与一切他物的相互区分之中是其所是；而这一区分，发生在无穷的事事相缘之链中：一物相对于他物被置入特定处境与脉络。指涉他者而无实体的自身在场，故事事皆空。就此而言，一物之为指谓字母，即是空的具体化；而作为显现空性与差别指谓性的符号或字母，每一事便是一真言——大日的“差别智印”（*shabetsu chiin*）。由相互差别的符号织成的宇宙文本，便是空物之空位，从而是空的究竟经文。法身既是此真理（法）的体现，其自身便即差别、即空。
