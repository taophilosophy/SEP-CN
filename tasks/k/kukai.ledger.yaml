    source: |-
      A major contribution made by Kūkai for the orthodoxy of Nara Buddhism with his systematization of esoteric doctrines, was to bridge the gap between textual study and ritual practice. Kūkai’s works provided for the first time a theoretical grounding for the incantation of mantras and *dhāranīs* and other esoteric practices already present in Nara Buddhism. It did this by explicating their relationship to the doctrines expressed in the scriptural texts. While esoteric elements were already present in Nara Buddhism, their very *raison d’etre*, other than as forms of magic, and their very connection to Buddhist doctrines had been left in the dark. Kūkai’s success may be attributable to his ability to provide a sound and intelligible systematic exposition of the meanings of the esoteric elements of Buddhism and of the interrelationships between text, ritual, and icon. In doing so it succeeded in bridging the gap between esoteric rituals and scriptural doctrines. (Abe 1999, 11)[^abe-1999] Kūkai had to work out such an exposition in order to establish and legitimize the independence and role of his Shingon Buddhism vis-à-vis the other forms of Buddhism already existent in Nara Japan.
    step1: |-
      空海通过对密教教义的系统化，为奈良佛教的正统性做出的一项重大贡献，是弥合了经文研习与仪礼实践之间的鸿沟。空海的著作首次为真言与陀罗尼（*dhāranīs*）的持诵以及奈良佛教中已有的其他密教实践提供了理论根基。其做法是阐明这些实践与经典文本所表达的教义之间的关系。密教要素虽已存在于奈良佛教之中，但除了作为法术之外，它们的*raison dʼetre*（存在理由）及其与佛教教义的关联一直隐而未明。空海的成功或许可以归因于他的能力：为佛教密教要素的意义、以及文本、仪式与圣像之间的相互关系，提供一种健全而可理解的系统阐述。由此，他成功地弥合了密教仪式与经典教义之间的鸿沟。（Abe 1999, 11）[^abe-1999] 空海必须拿出这样一种阐述，才能确立并证成他的真言宗佛教相对于奈良日本既存诸种佛教形态的独立性与地位。
    step2: |-
      空海以他对密教教义的系统化，为奈良佛教的正统地位做出了重大贡献：弥合了文本研习与仪轨践行之间的鸿沟。真言与陀罗尼（*dhāranī*）的持诵以及种种密教行法本已存在于奈良佛教之中，而空海的著作首次为它们提供了理论根基——其途径是阐明这些行法与经典文本所宣示的教义之间的关系。密教要素虽然早已存在，但其*raison dʼetre*（存在理由）——除视之为法术之外——以及它与佛教教义的关联，却一直晦暗不明。空海之所以成功，或许应归功于他的能力：对佛教密教要素的含义、对文本、仪轨与圣像三者间的相互关系，给出一种健全而明晰的系统论述；由此他便弥合了密教仪轨与经典教义之间的鸿沟。（Abe 1999, 11）[^abe-1999] 空海必须锻造出这样一套论述，方能确立并证成其真言宗佛教相对于奈良日本既存诸种佛教形态的独立性与角色。
