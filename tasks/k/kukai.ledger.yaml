      As the *hosshin*, the Buddha Dainichi preaches the Dharma *via* his omnipresencing, that is, through every sensible media of the cosmos. Kūkai called this, *hosshin seppō* (literally: “the *dharmakāya*’s expounding of the Dharma”), and used its concept (e.g. in his *Benkenmitsu nikkyōron*) as an important criterion for distinguishing esoteric Buddhism from exoteric Buddhism. In his work *Shōjijissōgi*, this concept of *hosshin seppō* serves as the starting point. The *seppō* (“preaching,” “expounding”) therein is equated with the phenomena of the cosmos as comprising *shōjijissō*, that is, sound, sign, reality, and their meanings. (We will discuss the linguistic or semiological significance of this idea in the following section.) The point is that every thing and every event in the universe, as objects of our six senses, are the Buddha’s preaching of the Dharma. Each phenomenon manifest serves to explain (*setsu*) the truth, the Dharma. The *hosshin* in its omnipresencing throughout the cosmos, permeating every aspect of it, is perpetually informing all things of the Dharma. This cosmic omnipresencing of the Dharma via *hosshin seppō* entails a dynamism of continuous activity that accounts for the movements within the universe – both physical and mental.
    step1: |-
      作为法身，佛陀大日**经由**其遍在而说法，即通过宇宙的每一个可感知媒介。空海称之为法身说法（*hosshin seppō*，字面义：“法身的说法”），并把这一概念（如在《辨显密二教论》中）用作区分密教与显教的重要判准。在其著作《声字实相义》中，法身说法这一概念作为出发点。其中的说法（*seppō*，“宣说”、“阐明”）等同于构成声字实相（*shōjijissō*）的宇宙现象，即声、符（字）、实（相）及其意义。（这一观念的语言学或符号学意义将在下一节讨论。）要点在于：宇宙中的每一事物、每一事件，作为我们六根的对象，都是佛陀对法的宣说。每一显现的现象都在解说（*setsu*）真理——法。法身在宇宙中遍在、渗透其每一方面，正在永恒地把法告知一切事物。法经由法身说法而遍在，这蕴含一种持续活动的动力，说明了宇宙中的种种运动——物理的与心理的。
