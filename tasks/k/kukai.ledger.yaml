      Kūkai’s Shingon Buddhism postulated four forms of embodiment *as* the *hosshin* itself. This notion of the four forms of the *hosshin* (*shishu hosshin*) roughly corresponds to, while reworking, the Mahāyāna *trikāya* doctrine. 1) First there is the *hosshin* in its absolute sense, called *jishō* *hosshin*. This is the embodiment of the Dharma as Dainichi eternally remaining in the state of *samadhi* but also engaging in a monologue, which reveals its “self-nature” and unfolds the Dharma through its omni-presencing manifestations in the cosmos. 2) Secondly there is the *juyū* *hosshin*, which is the *hosshin* enjoying bliss. But this is characterized in its two aspects: A) “the self-oriented embodiment” (*jijuyūshin*) describing the *hosshin* as enjoying its own state of *samadhic* bliss; and B) “the other-oriented embodiment” (*tajuyūshin*) describing the *hosshin* in the form of various celestial buddhas directing the blissful fruits of self-enlightenment for the benefit of others. 3) Thirdly there is the *hosshin* in its historical and earthly transformation, called *henge* *hosshin* as manifest in the enlightened personage of Śakyamuni. This historical Buddha guides ordinary, ignorant, and irreligious people towards the Dharma, but for this sake must improvise skillful (or: expedient) means (Skrt: *upāya*; Jpn: *hōben*) appropriate to the time, place, and comprehension of a given audience. 4) And fourthly there is the *hosshin* in its universal emanation, called *tōru hosshin*. This is its manifestation in all sorts of bodily forms appropriate to the situation in order to expound the Dharma, often appearing in the same form as the listener in order to share in his suffering. This conception also became generalized by Kūkai to include all phenomenal thing-events – together with their respective environments or “realms” – as “bodies” filling up the entire cosmos. As such every phenomenon plays the role of a “buddha,” teaching some aspect of the Dharma and expressing the Buddha’s enlightened wisdom and compassion, to realize the original enlightenment of all. Interestingly this implies that each one of us are *already* buddhas expounding some aspect of the Dharma to one another, but which we must then become aware of in order to realize our own Buddhahood.
    step1: |-
      空海的真言宗佛教设定了四种**作为**法身本身的身形。这一法身四身（*shishu hosshin*）之说，大致对应于大乘的三身说，同时加以改造。1) 首先是绝对意义上的法身，称自性法身（*jishō hosshin*）。这是法之为法的体现：大日永恒住于三昧（*samadhi*）之中，同时进行独白，通过其在宇宙中无处不在的显现而揭示其“自性”、展开法。2) 其次是受用法身（*juyū hosshin*），即受享安乐的法身。它有两个方面：A)“自受用身”（*jijuyūshin*），描述法身享受自己的三昧之乐；B)“他受用身”（*tajuyūshin*），描述法身以各种天界佛陀的形态，把自觉的安乐果报导予他人利益。3) 第三是历史上的、地上的变化形态之法身，称变化法身（*henge hosshin*），显现在释迦牟尼这一觉悟者身上。这位历史佛陀引导平凡、无知与无宗教的民众趋向于法，但为此必须随机施设善巧（或：方便）手段（梵 *upāya*；日 *hōben*），以契合特定听众的时间、地点与理解力。4) 第四是普遍流衍形态的法身，称等流法身（*tōru hosshin*）。这是法身为宣说法要以切合情境的种种身体形态所做的显现，常常以与听者相同的形态出现，以分担其苦难。这一概念也被空海普遍化，把一切现象性的事物事件——连同它们各自的环境或“界”——都纳入为充满整个宇宙的“身”。如此，每一现象都扮演着“佛”的角色：教说法的某个面向，表达佛陀觉悟的智慧与慈悲，以实现一切众生的本觉。有趣的是，这意味着我们每一个人都**已经**是佛，彼此宣说法的某个面向，只是我们必须觉察到这一点，才能实现自己的佛果。
    step2: |-
      空海的真言宗佛教设定了四种**作为**法身本身的身相。这一“四种法身”（*shishu hosshin*）之说，是对大乘三身说的改造性对应。其一，绝对意义上的法身，称自性法身（*jishō hosshin*）：这是法之为法的体现——大日永恒住于三昧（*samadhi*）之境，同时又做独白，以其遍在宇宙的显现揭示“自性”、开显法。其二，受用法身（*juyū hosshin*），即受享安乐的法身；它有两个层面：A）“自受用身”（*jijuyūshin*），谓法身自受用其三昧之乐；B）“他受用身”（*tajuyūshin*），谓法身化现为种种天界佛陀之相，将自觉之乐果导向他人利益。其三，历史与地上的变化形态之法身，称变化法身（*henge hosshin*），显见于释迦牟尼这一觉悟者。这位历史佛陀引导凡俗、无知与无宗教之众趋向于法；为此，他必须随机施设善巧方便（梵 *upāya*；日 *hōben*），以应特定听众之时、地与理解力。其四，普遍流衍形态的法身，称等流法身（*tōru hosshin*）：这是法身为宣说法要而以切合情境的种种身相所做的显现，往往示现与听者相同之形，以共担其苦。这一概念又被空海普遍化：一切现象性的事物事件——连同其各自的环境或“界”——都被纳入为充塞整个宇宙的“身”。如此，每一现象都扮演“佛”的角色：教说法的某一面向，表达佛陀觉悟的智慧与慈悲，以实现一切众生的本觉。有趣的是，这意味着我们每一个人都**已经**是佛，正在彼此宣说法的某一面向；只是我们必须觉察及此，方能实现自己的佛果。
