      It should be remembered however that while Kūkai thus links the *hosshin*’s preaching to the *mantric* sound and letter of *A*, this same preaching, symbolized in *A*, in fact encompasses all movements of the cosmos, involving colors, shapes, silence, bodily movements, etc., not just the explicitly vocal. Dainichi preaches the Dharma *via* all phenomenal means through the three media, the “three mysteries,” of body, speech, and mind, omnipresencing himself through all objects of the six senses (the five physical senses plus thought). The entire cosmos is hence the language of the Buddha, inseparable from the Buddha’s body that is in fact the embodiment of the Dharma (i.e., *hosshin*, *dharmakāya*). We now turn to the mandalic aspect of the embodiment of the Dharma and of Dainichi’s preaching of the Dharma.
    step1: |-
      然而应当记住：虽然空海如此把法身的说法与真言之声及字母 *A* 相连，这同一说法——象征于 *A*——其实涵盖宇宙的一切运动，涉及颜色、形状、静默、身体动作等等，而不限于显性的发声。大日经由身、口、意三门径——“三密”——以一切现象手段宣说法，经由六种感官的一切对象（五身体感官加思虑）遍在现身。整个宇宙因而是佛陀的语言，与佛陀之身不可分离——此身其实即是法的体现（即法身，*hosshin*，*dharmakāya*）。现在我们转向法的体现与大日说法的曼荼罗面向。
    step2: |-
