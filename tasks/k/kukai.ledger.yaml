    source: |-
      This great cosmic body of the *hosshin* embraces all phenomena through the mutual “non-obstruction” of the six universal elements (*rokudai muge*). (Mutual “non-obstruction” or *muge* here must be understood to mean what allows for their interrelations and interpenetrations that constitute things. In being non-substantial, they do not obstruct each other. And “universal” or *dai* here must be understood in its literal sense as “great,” meaning that it does not exclude any phenomena or thing-event in the cosmos at all.) As the cosmos, the *hosshin* is made up of the six “great” elements (fire, earth, water, air, space, consciousness) which interrelate to constitute thing-events in their interdependent origination. Their interaction thus constitutes the somaticity of an ever-evolving whole. But as dependent origination equals emptiness (Skrt: *śūnyatā*; Jpn: *kū*) in Buddhism, this cosmic body is an embodiment of the Dharma *qua* emptiness. Moreover emptiness also signifies “space,” for the same graph (*kū*) is used to mean “emptiness” and “space.” Hence the cosmic body in its endless vastness, as space embracing everything, can be seen as providing the space for the emergence of thing-events through the intermingling of the six elements. Thus Dainichi’s body as the cosmic embodiment of the Dharma pervades *all* beings to make up, through the six elements, each of their own bodies. And yet from another perspective, as the cosmic body is a vast emptiness that makes room for the emergence of beings, each of these beings are in turn empty. For being and emptiness in the Buddhist understanding are two intertwining aspects of the same truth. (We shall discuss the more precise sense of “emptiness” in the following sections.) So the *hosshin* in its somaticity designates the ontological ground of all beings but also designates their underlying de-ontologizing (or: me-ontologizing; or even better: anontological) emptiness, their non-substantiality.
    step1: |-
      法身这一伟大的宇宙之身，通过六大（*rokudai*）的相互“无碍”（*rokudai muge*）而拥抱一切现象。（这里的相互“无碍”即 *muge*，须理解为使诸大得以相互关联、相互贯通而构成事物者：它们非实体，故彼此不碍。“普遍的”即 *dai*，须按其字面义理解为“大”，意谓它完全不排除宇宙中的任何现象或事物事件。）作为宇宙，法身由六大元素——火、地、水、风（气）、空、识——构成；六大相互关联，在缘起中构成事物事件。它们的互动由此构成一个不断演化的整体的身体性。但由于在佛教中缘起即等于空（梵 *śūnyatā*；日 *kū*），这一宇宙之身是法就其为空而言的体现。而且“空”也意指“空间”，因为同一个字（*kū*）兼表“空”与“空间”。因此，宇宙之身在其无尽广漠之中，作为拥抱一切的空间，可以被看作经由六大的相互交融而为事物事件的出现提供空间。如此，大日之身作为法的宇宙性体现，渗透**一切**存在者，经由六大而构成它们各自的身体。而从另一个视角看，宇宙之身既然是为存在者之出现腾出空间的浩大空无，这些存在者反过来也都是空的。因为在佛教的理解中，存在与空是同一真理相互交织的两个方面。（我们将在后面几节讨论“空”的更精确含义。）于是，就其身体性而言的法身，既指示一切存在者的存在论根基，也指示它们更深层的去存在论化（或：非存在论化；甚至更好：无存在论化）的空，即它们的非实体性。
    step2: |-
      法身这一伟大的宇宙之身，凭借六大（*rokudai*）的相互“无碍”（*rokudai muge*）摄纳一切现象。（此处的相互“无碍”即 *muge*，须理解为容许诸大相互关联、相互贯通而构成事物的那个东西：正因为非实体，它们彼此无碍。“普遍的”即 *dai*，须按其字面义解作“大”，意谓它绝无例外地不排除宇宙中的任何现象或事物事件。）作为宇宙，法身由六大——地、水、火、风、空、识——构成；六大相互关联，于缘起中构成事物事件。它们的互动由此构成一个不断演化的整体的身体性。既然佛教中缘起即空（梵 *śūnyatā*；日 *kū*），这一宇宙之身便是法**就其为空而言**的体现。而且“空”亦意指“空间”：同一个字（*kū*）兼表“空”与“空间”。因此，宇宙之身在其无尽广漠中，作为拥纳一切的空间，可被看作经由六大的交融为事物事件的涌现提供空间。如此，大日之身作为法的宇宙性体现，渗入**一切**存在者，经由六大而构成它们各自的身体。而从另一视角观之：宇宙之身既然是为存在者之涌现留出空位的浩大空无，这些存在者反过来也是空的。因为在佛教的理解中，存在与空是同一真理相互缠绕的两个面向。（关于“空”的更确切含义，详见后面几节。）于是，就其身体性而言的法身，既是一切存在者的存在论根基，也标示着它们更深层的去存在论化（或：非存在论化；或者更恰当地说：无存在论化）的空——它们的非实体性。
