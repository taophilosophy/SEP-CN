      作为法身，佛陀大日**经由**其遍在而说法，即通过宇宙的一切可感知媒介。空海称之为法身说法（*hosshin seppō*，字面义即“法身之说法”），并以这一概念（如在其《辨显密二教论》中）作为区分密教与显教的重要判准。在其著作《声字实相义》里，法身说法正是出发点：其中的说法（*seppō*，“宣说”、“阐明”）等同于构成声字实相（*shōjijissō*）的宇宙现象，即声、字、实相及其意义。（这一观念的语言学或符号学意涵将在下一节讨论。）要旨在于：宇宙中的每一事物与每一事件，作为我们六根的对象，都是佛陀对法的宣说。每一显现的现象都在解说（*setsu*）真理即法。法身遍在于宇宙、渗透其方方面面，正恒常把法晓告一切事物。法经由法身说法而遍在，这蕴含着一种持续活动的动力，足以说明宇宙内部的种种运动——物理的与心理的。
