      The idea of the mantra, inherited from Indian Mantrayāna, occupies a significant position in Kūkai’s philosophy, which he elucidates in each of his *Sanbu-sho* and systematically and most comprehensively in his *Shōjijissōgi*. Mantras denote the reality of all *dharmas* (*shohō*) – the elemental constituents of reality – as themselves signifying the Dharma preached by the *hosshin*. (In Buddhism, the term *dharma* (*hō*) has many meanings, among which are the significances of truth itself and the elemental constituents of reality. When speaking of truth in its absolute sense as preached by Dainichi or as embodied in the *dharmakāya* (*hosshin*), I have been capitalizing *Dharma*, and when speaking of the elements that constitute reality, I leave *dharma* uncapitalized.) It represents the primordial speech of the Buddha Dainichi uttering and expositing the Dharma, taken in both its restricted human significance and its broader cosmic significance. That is, Dainichi’s sermon as a mantra in the broad sense means *all* phenomena in general as vibrations emanating from Dainichi’s eternal *samadhi* through the interplay of the elements *via* the three media of body, speech, and mind. *All* objects of the six senses as based upon those three media of visible and tangible forms, audible sounds, and thoughts, embody mantras as syllables uttered by Dainichi. And in its narrower sense the mantra takes the abbreviated verbal form of syllables written in the esoteric sūtras and uttered in esoteric ritual practice by the practitioner. That is, the mantras uttered by practitioners in ritual practice are to be taken as focused condensations of those cosmic vibrations in a particular sound. They are condensed manifestations of the content of Dainichi’s sermon, namely the truth of enlightenment, the Dharma.
    step1: |-
      承自印度真言乘（*Mantrayāna*）的真言（mantra）观念，在空海哲学中占据要位；他对真言的阐发遍及《三部书》（*Sanbu-sho*）的每一部，而以《声字实相义》（*Shōjijissōgi*）所论最为系统、最为全面。真言指谓一切诸法（*shohō*）——即构成实在的种种要素——的实在：诸法本身即在指谓法身（*hosshin*）所宣说的法。（佛教中，*dharma*（*hō*）一词含义繁多，其中既指真理本身，也指构成实在的诸要素。凡论及大日所宣说的、或法身所体现的绝对意义上的真理，我一直将 *Dharma* 写作大写；凡论及构成实在的诸要素，则将 *dharma* 写作小写。）真言代表佛陀大日宣说、阐扬法的原初言语，兼取其限定的人类意义与更广的宇宙意义。也就是说，作为广义真言的大日说法，意指一切现象的总体：这些现象是从大日永恒的三昧（*samadhi*）中发出的振动，经由身、口、意三种媒介的要素互动而成。以此三媒介——身对可见可触的形色、口对可闻的声音、意对思虑——为基础，六种感官的一切对象，皆作为大日所诵出的音节而体现真言。而在狭义上，真言则取缩略的言语形式：书写于密教经典中的音节，由修行者在密教仪轨修持中诵出。也就是说，修行者在仪轨中诵出的真言，应被理解为那些宇宙振动凝聚焦于特定声音的浓缩形态；它们是大日说法内容的浓缩显现，而此内容即觉悟的真理，即法。
    step2: |-
      承自印度真言乘（*Mantrayāna*）的真言观念，在空海的哲学中举足轻重：他对真言的阐发遍布《三部书》（*Sanbu-sho*）的每一部，而以《声字实相义》（*Shōjijissōgi*）所论最成系统、也最为周全。真言指谓一切诸法（*shohō*）——构成实在的种种要素——的实在，而诸法自身又在指谓法身（*hosshin*）所宣说的法。（佛教中 *dharma*（*hō*）一词多义：既指真理本身，也指构成实在的诸要素。凡论大日所宣、法身所体现的绝对真理，我一直将 *Dharma* 大写；凡论构成实在的要素，则将 *dharma* 小写。）真言是佛陀大日宣说法、阐扬法的原初言语，兼有人类意义上的限定义与宇宙意义上的广大义。进而言之，作为广义真言的大日说法，意味着一切现象的总体：这些现象是从大日永恒三昧（*samadhi*）发出的振动，经由身、口、意三种媒介的要素互动而成形。以三媒介——身之可见可触的形色、口之可闻的声音、意之思虑——为基础，六种感官的一切对象都体现着真言，即大日诵出的音节。狭义的真言则取其缩略的言语形态：书写于密教经典中的音节，由行者于密教仪轨中诵出。行者仪轨中所诵的真言，应视为宇宙振动凝聚焦于特定声音的浓缩形态——大日说法内容的浓缩显现，而此内容即觉悟的真理，即法。
