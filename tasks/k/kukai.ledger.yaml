      7ᵗʰ state: “The mind of one who realizes non-origination” (*kakushin fushō-shin*): The state of Madhyamaka with its *śūnyavāda* (Jpn: *kūgan*) standpoint that everything is empty. Here reifying and substantializing conceptions – including both objects and mind – that act as fetters are eliminated through Nāgārjuna’s eight-fold negations which *via* their dependent origination show their emptiness.
    step1: |-
      第七状态：“觉悟不生之心”（*kakushin fushō-shin*）：中观的状态，持空（*śūnyavāda*；日 *kūgan*）立场，谓一切皆空。在这里，起系缚作用的实体化与实在化的概念——包括对象与心——通过龙树的八不否定而被消除，这些否定经由它们的缘起而显示它们的空。
    step2: |-
      第七住心：“觉知心不生之心”（*kakushin fushō-shin*，即“觉心不生心”）：中观的状态，持空宗（*śūnyavāda*；日 *kūgan*）之见，谓一切皆空。在这里，充当系缚的实体化、实在化的观念——对象与心皆在其中——借龙树的八不否定而遣除：此否定经由诸法的缘起而显示其空。
