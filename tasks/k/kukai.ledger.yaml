      It was during his period at Takaosan-ji that he wrote some of his major treatises of philosophical interest to us, such as *Benkenmitsu nikkyōron* (*Treatise on the Differences Between Esoteric and Exoteric Teachings*) around 814, and the so-called *Sanbu-sho* (“Three Writings”) of *Sokushinjōbutsugi* (*On the Meaning of “Attaining Buddhahood in this Very Embodied Existence”*), *Shōjijissōgi* (*On the Meanings of “Sound, Sign, and Reality”*), and *Unjigi* (*On the Meaning of the Syllable Hūṃ*) in the 820s. And towards the end of his life he completed in 830 what has been considered to be his *magnum opus*, the *Himitsu mandara jūjūshinron* (*Treatise on the Ten States of the Mind as a Secret Mandala*) in ten volumes, and soon afterward, completed its summary version, the *Hizō hōyaku* (*The Precious Key to the Secret Treasury*) in three volumes.
    step1: |-
      正是在住持高雄山寺期间，他写下了若干对我们而言具有哲学意趣的主要论著，如约814年的《辨显密二教论》（*Benkenmitsu nikkyōron*），以及820年代的所谓“三部书”（*Sanbu-sho*）——《即身成佛义》（*Sokushinjōbutsugi*）、《声字实相义》（*Shōjijissōgi*）与《吽字义》（*Unjigi*）。及至晚年，他于830年完成了被视为其毕生巨著的《秘密曼荼罗十住心论》（*Himitsu mandara jūjūshinron*）十卷，不久之后又完成其缩略本《秘藏宝钥》（*Hizō hōyaku*）三卷。
    step2: |-
      正是在高雄山寺的岁月里，空海写出了今天看来最具哲学意趣的几部主要论著：约 814 年的《辨显密二教论》（*Benkenmitsu nikkyōron*），以及 820 年代的“三部书”（*Sanbu-sho*）——《即身成佛义》（*Sokushinjōbutsugi*）、《声字实相义》（*Shōjijissōgi*）与《吽字义》（*Unjigi*）。到了晚年，他于 830 年完成向来被推为毕生巨著的《秘密曼荼罗十住心论》（*Himitsu mandara jūjūshinron*）十卷，随后不久又写成其纲要本《秘藏宝钥》（*Hizō hōyaku*）三卷。
