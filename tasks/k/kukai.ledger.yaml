      Kūkai’s elucidation of these three aspects provide both a theoretical and a practical grounding for his own conception of *sokushinjōbutsu* or “becoming Buddha in this very embodied existence,” by clarifying both its possibility and its method. Japanese commentators have often classified his thought along the following lines: the theory of the six universal elements as providing a metaphysic, the theory of the four mandalas as providing an epistemology, and the theory of the three mysteries as providing a metapraxis. But one must also keep in mind that all three concerns – metaphysical, epistemological, and practical – are intertwined and inseparable in Kūkai’s thinking. Furthermore all three involve the significance of the body so that even in his so-called “epistemology,” embodiment cannot be ignored.
    step1: |-
      空海对这三个层面的阐明，通过澄清即身成佛的可能性与方法两面，为他自己的即身成佛（*sokushinjōbutsu*）——“在此当下身体性存在中成佛”——观念提供了理论与实践的双重根基。日本的注释者常按如下思路为他的思想分类：六大论提供形而上学，四曼荼罗论提供认识论，三密论提供元实践。但也须记住，这三个关注点——形而上学的、认识论的与实践的——在空海的思考中交织而不可分。而且三者都牵涉身体的意义，因此即使在他所谓的“认识论”中，身体性也不可忽略。
    step2: |-
