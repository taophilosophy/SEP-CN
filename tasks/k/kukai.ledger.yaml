      10ᵗʰ state: Both Tendai and Kegon for Kūkai however lack the crucial element of direct experiential understanding to truly realize what they preach. One must thus proceed further by means of bodily ritual practice provided by the next and final state: Mantrayāna: “The mind of secret sublimity” (*himitsu shōgon-shin*). This is the state of Shingon, whose esoteric teachings and bodily experiential practice constitute the summit of the development of the mind. At this summit *hosshin seppō* is revealed and one attains *sokushinjōbutsu* through the micro-macro-cosmic correlativity of the three mysteries and through *kaji*.
    step1: |-
      第十状态：然而在空海看来，天台与华严都缺少直接的经验性理解这一关键要素，因而不能真正实现其所宣说者。人必须借助下一个也是最后的阶位所提供的身体仪轨实践更进一步，即真言乘：“秘奥庄严之心”（*himitsu shōgon-shin*）。这是真言宗的状态，其密教教义与身体性经验实践构成心之发展的顶极。在此顶极，法身说法得以开显，人通过三密的微观—宏观宇宙相关性以及通过加持，证得即身成佛。
    step2: |-
      第十住心：然而在空海看来，天台与华严都缺少直接的经验体悟这一关键要素，因而不能真正实现其所宣说者。人必须借下一个、也是最后的阶位所提供的身体仪轨实践更进一层，即真言乘：“秘奥庄严之心”（*himitsu shōgon-shin*，即“秘密庄严心”）。此即真言宗的状态：其密教教义与身体性的经验实践，构成心之开展的顶极。在此顶极，法身说法得以开显，人借三密的微观—宏观宇宙相关性、并借加持，证得即身成佛。
