      ### 7.1 The Sellarsian Dilemma
    step1: |-

    step2: |-

  - id: 82
    kind: body
    source: |-
      In developing the view, we have already responded to one of its most common criticisms. As was noted above, it has been argued (most famously by Sellars 1963)[^sellars-1963] that even if there were such a thing as acquaintance with individuals, properties, or facts, that relation wouldn’t give one knowledge of *truths*. The observation is correct (since acquaintance with something does not amount to a judgment, let alone a true judgment, about it), but it is irrelevant to the more sophisticated view according to which the acquaintance with the relevant fact is only a *constituent* of the ground of propositional knowledge. As we have seen (section 3), acquaintance theorists typically add conditions that make the fact with which one is acquainted directly relevant to the truth of some thought or belief—e.g., by requiring awareness of the correspondence or fit (or perhaps some other relation) between the thought and the fact, or by requiring that the fact constitute part of the content of the belief.
