      You can, to be sure, think of Jack the Ripper, but the thought when analyzed is broken down into constituents each of which is something we can apprehend directly. The name “Jack the Ripper” gets reduced to a description embedded in a quantified statement. The thought that *Jack the Ripper is vicious* just is the thought that there exists one and only one individual who has certain properties—e.g., who is the most famous 19ᵗʰ Century murderer*—*and who also has the property of being vicious. Russell has always struggled with the question of how to view our understanding of the quantifier—expressions of quantity such as ‘a’ or ‘the’—but it is clear that he believed that we have the capacity to entertain in thought (directly) the properties (universals) picked out by predicate expressions. If having a thought essentially involves acquaintance with universals, then it ceases to be a mystery how thought can represent the world, since the world partly consists in instances or exemplifications of universals; and if a thought involves acquaintance with universals that happen to be instantiated or exemplified by some object of acquaintance, then it makes sense that one can, at least in some cases, directly compare and become acquainted with the correspondence or fit between the two.
