      BonJour’s account of noninferentially justified belief similarly requires not only direct awareness of some fact, but also a *“direct recognition” of the “fit”* between that fact and the conceptual description embodied in the belief (BonJour 2003: 73–4)[^bonjour-2003]. Both Fumerton and BonJour thus require some sort of awareness or grasp of the correspondence between a thought and what it is about. However, while Fumerton’s acquaintance with correspondence is acquaintance with a fact and not a judgment that a proposition is true, BonJour seems to understand the “recognition” of fit or correspondence as judgmental or propositional—something like a judgment to the effect that the conceptual description embodied in the belief fits or correctly describes one’s experience. This naturally leads to the question, must this judgment of fit itself be justified? And if so, what justifies it? BonJour insists (2003: 65 and 193) that while the judgment of fit requires justification, its justification depends on one’s direct awareness of the propositional content believed and a direct awareness of the relevant experiential feature, and that there is no need for any further awareness, judgmental or otherwise. This response seems problematic, however, for we now have at least one sort of belief or judgment, the higher-order judgment of fit itself, that is noninferentially justified without there being any awareness or recognition that *its* propositional content fits the facts. If a judgment of fit is required for the first-order belief, shouldn’t the same be required for the judgment of fit itself? But if it is required then we are off on a regress of judgments of fit, with no foundation in sight. This suggests, in line with Fumerton’s view, that if some awareness of fit or correspondence is required, then it must at the most fundamental level be a nonconceptual and nonpropositional awareness of fit or correspondence.
    step1: |-
      邦茹对非推论地被证成信念的说明同样要求：除对某个事实的直接觉察外，还须对该事实与信念所体现的概念性摹状之间的 *“符合”有“直接的识别”*（BonJour 2003: 73–4）[^bonjour-2003]。富默顿与邦茹因此都要求对思想与其所指之间的符合有某种觉察或把握。然而，富默顿对符合的亲知是对一个事实的亲知，不是对一个命题为真的判断；邦茹则似乎把对符合或一致的“识别”理解为判断性的、命题性的——大意是这样一个判断：信念所体现的概念性摹状符合、或正确描述了一个人的经验。这自然引出问题：这一符合判断本身必须被证成吗？若必须，又凭什么证成？邦茹坚称（2003: 65 与 193）：符合判断固然需要证成，但其证成依赖于对所信命题内容的直接觉察与对相关经验特征的直接觉察，无需任何进一步的觉察——判断性的或其他。这一回应似乎有问题：我们现在至少有一种信念或判断——高阶的符合判断本身——是在没有任何觉察或识别 *其* 命题内容符合事实的情况下就获得非推论证成的。如果一阶信念需要符合判断，符合判断自身难道不需要同样的东西？若需要，我们便滑入一串符合判断的回溯，而看不到任何基础。这提示我们（与富默顿的看法一致）：如果确需对符合的某种觉察，那么在最根本的层面上，它必须是对符合或符合关系的非概念、非命题的觉察。
    step2: |-
      邦茹说明非推论地被证成的信念，也同样要求两件：既有对某事实的直接觉察，复有对该事实与信念所承载的概念性摹状之间 *“契合”的“直接识别”*（BonJour 2003: 73–4）[^bonjour-2003]。是故富默顿与邦茹都索求某种对“思想与其所关于者相互符合”的觉察或把握。但两家的路数不同：富默顿对符合的亲知，亲知的是一个事实，并非“某命题为真”的判断；邦茹却似把契合或符合的“识别”解作判断性、命题性之事——仿佛下一个判断：信念所承载的概念性摹状与人的经验相契、或如实描述之。这就顺理成章地引出追问：契合判断本身要不要证成？要的话，凭什么叫它成立？邦茹力言（2003: 65 与 193）：契合判断固须证成，而其证成只系于对所信命题内容的直接觉察、对相关经验特征的直接觉察，再无任何进一步觉察之必要，判断式的也罢，别的也罢。此答似有难处：如今至少有一种信念或判断——高阶的契合判断自身——在不曾觉察或识别 *其* 命题内容与事实相符的情况下，已然非推论地得到证成。一阶信念既须契合判断，契合判断自身岂可独免？若不能免，我们便一路滑进契合判断的回溯，基础杳然无踪。这提示我们（正与富默顿一致）：倘真需要某种对契合或符合的觉察，那它在最根本的层面上，必是对契合、对符合的非概念的、非命题的觉察。
