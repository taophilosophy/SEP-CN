      按富默顿的看法，一个 *p* 信念是非推论地被证成的，当且仅当：主体亲知 *p* 这一思想，亲知一个相符的事实，并且亲知 *p* 这一思想与那个相符事实之间的符合。（富默顿为容纳假的非推论地被证成信念而对这一分析作了限定，但此处暂且不管。）设想我亲知我的头痛，亲知我头痛这一思想，并且亲知我头痛这一思想与我头痛这件事之间的符合。当此之时，构成该思想为真的一切，都当下呈现在我的心灵之前。就知识论而言，再没有比这更好的了。
