      如果通行的看法是对的，亲知是简单且不可分析的，那么也许仍可用某种只为亲知所有、因而富有启发的方式来描述它，从而把它指点出来。遗憾的是，这种指点牵涉到有争议的预设。不过且设想下述常见情形。一个人正在疼痛，但因投入一场有趣的谈话，他有一阵子没有注意到疼痛。谈话结束后，他重新觉察到疼痛。这里有两种可能。一是疼痛暂时停止了。二是疼痛一直在，只是主体暂时未能觉察。倘若后一种说法讲得通，那么亲知就是谈话之前主体与疼痛之间的那个关系、谈话期间中止了的那个关系、以及此后不久重新开始的那个关系。
