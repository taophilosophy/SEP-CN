      It is tempting to suppose that Russell equivocates between the relation of acquaintance and the special kind of knowledge of truth (foundational knowledge) whose sole source is acquaintance. That we ordinarily talk about knowing things and people might encourage this equivocation. Moreover, perhaps the fact that acquaintance is a form of awareness of the most direct, most secure kind, and is fundamental to all knowledge of truths, led Russell to think it deserves to be called “knowledge” of the thing in question. The issue here is largely terminological. In order to guard against confusing *acquaintance* on the one hand with *foundational knowledge of truths acquired by acquaintance* on the other, and facilitate an examination of the relation between them, we should be more careful than Russell and restrict *knowledge* *by acquaintance* to foundational knowledge of *truths*. By contrast, one can have *acquaintance* with items that are not truths, items that cannot be said to be true or false. Knowledge by description, on the other hand, is nonfoundational knowledge of truths; it “always involves…some knowledge of truths as its source and ground” (Russell 1912: 72–3)[^russell-1912]. We adopt this usage in what follows.
    step1: |-
      人们容易认为，罗素在亲知关系与那种唯一来源是亲知的特殊真理知识（基础知识）之间摇摆含糊。我们日常确实谈论认识事物、认识人，这或许助长了这种含糊。此外，也许正是如下事实使罗素觉得，亲知值得被称为对相关对象的“知识”：亲知是最直接、最可靠的觉察形式，且对一切真理知识都根本。这里的问题多半是术语性的。为了防止把一方面的 *亲知* 与另一方面 *凭亲知获得的真理基础知识* 混为一谈，并便于考察两者之间的关系，我们应当比罗素更谨慎，把 *亲知知识* 限于 *真理* 的基础知识。相比之下，一个人可以对并非真理的项目、无所谓真假的项目拥有 *亲知*。而摹状知识则是非基础的真理知识；它“总是包含……某些真理知识作为其来源与根据”（Russell 1912: 72–3）[^russell-1912]。下文即采用这一用法。
