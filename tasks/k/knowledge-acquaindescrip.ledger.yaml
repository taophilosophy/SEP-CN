      BonJour’s view of acquaintance seems to explain why, as proponents of the acquaintance approach tend to hold, one cannot be acquainted with external world objects or external world facts (BonJour 2001: 31)[^bonjour-2001]. If acquaintance is a “built-in” feature of conscious states in virtue of which one can be aware only of intrinsic features of that very state, then on the plausible assumption that ordinary physical objects and their intrinsic features are not intrinsic features of mental states, one cannot have acquaintance with such objects or their features. On the other hand, Fumerton’s relational view of acquaintance, like the traditional Russellian view, seems to allow for the possibility of acquaintance with abstract entities such as universals, which some acquaintance theorists appeal to in order to make sense of the possibility of thought and *a priori* knowledge (see section 4). There is room for more work here in investigating the nature of acquaintance and its implications.
