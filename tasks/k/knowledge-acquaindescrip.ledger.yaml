      上面我们说过，古典的、罗素式的亲知观念，最少限度上以两点为特征：（i）它是非意向性的觉察形式：亲知某物，不在于对它形成任何判断或思想，也不在于对它应用任何概念；（ii）它是要求其 *关系项* 存在的真实关系：人不能亲知不存在的事物、属性或事实。我们不妨广义地使用“亲知理论”这个标签，指称心灵哲学或知识论中任何让如此理解的亲知扮演核心角色的观点。大约在过去 25 年间，亲知理论的兴趣有所复兴。当代的倡导者包括 BonJour（2001, 2003）、Chalmers（2010）、Fales（1996）、Fumerton（1995, 2001, 2016）、Gertler（2001, 2011, 2012）、Hasan（2011, 2013）、McGrew（1995, 1999）、Moser（1989）、Stoutenburg（即将出版）与 Taylor（2013）。我们将会看到，其中一些哲学家在重要方面偏离了罗素。然而与他一样，他们都承诺存在一种直接的、非判断性的觉察形式（事实上，他们许多人就称它为“亲知”），这使我们有理由把他们全部当作“亲知理论家”。他们中的大多数还明确赞同古典基础主义：与罗素一样，他们认为一切知识或被证成的信念最终都依赖于凭亲知获得的知识或被证成的信念这一基础。接受亲知理论而不接受古典基础主义，也有融贯的路径。例如，有些人可以同意我们确实拥有某些亲知知识，并在心灵哲学中关于二元论的辩论中诉诸这种知识（参见感受性：知识论证词条），而不赞成“一切知识或被证成的信念最终必须依赖于亲知”这一主张。除非另有说明，下文对“亲知理论”与“古典基础主义”将互换使用。
