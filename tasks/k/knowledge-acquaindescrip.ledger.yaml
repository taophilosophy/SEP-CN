      The acquaintance theorists are aware that their claim to being acquainted with acquaintance is unlikely to be of much help to those who claim not to understand what acquaintance is, and may point out that there are other, dialectical considerations in favor of their view (see Fumerton 1995: 77; Chalmers 2010: 287; and Taylor 2015)[^chalmers-2010][^fumerton-1995][^taylor-2015]. We end by summarizing a number of such considerations. While these considerations are controversial, they suggest that acquaintance theories deserve more serious attention than they have recently received. Most of these have already been covered above. First, acquaintance theorists have defended sophisticated accounts of noninferentially justified belief, and offered responses to classical arguments against the possibility of such beliefs, like the Sellarsian dilemma. Second, a view that accepts the possibility of acquaintance with universals seems able to explain not only how knowledge is possible, but also how thought itself is possible, and how a thought can be *about* something else. Third, the acquaintance theorist who accepts acquaintance with complex universals is in a position to provide an account of our knowledge of necessary truths. Fourth, those who accept acquaintance with logical or probability relations between propositions can give a unified treatment of foundational and nonfoundational knowledge—a unified treatment of knowledge by acquaintance and knowledge by description—and are not as vulnerable to the threat of skepticism. Fifth, the sophisticated acquaintance theory seems to accommodate two constraints on epistemic justification that many find intuitive (though not everyone accepts; many accounts end up rejecting one or the other): justification is *truth-conducive*, since it requires acquaintance with facts that make true (or at least make probable) our beliefs; and justification is *internal* in the sense that the subject has a secure perspective on the truth, or possesses a kind of assurance of the truth (or probability) via acquaintance with truth-making and probability-making relations.
    step1: |-
      亲知理论家们知道，他们“亲知到亲知”的主张，对那些自称不懂亲知为何物的人帮助不大；他们或会指出，尚有其他论辩方面的理由支持其观点（参见 Fumerton 1995: 77；Chalmers 2010: 287；以及 Taylor 2015）[^chalmers-2010][^fumerton-1995][^taylor-2015]。我们最后概述其中若干理由。这些理由固然有争议，但它们表明：亲知理论值得比近来所受的更认真的对待。多数已在上面论及。第一，亲知理论家已为非推论地被证成的信念辩护出精致的说明，并回应了针对这类信念可能性的经典论证，如塞拉斯式两难。第二，接受对共相之亲知的观点，似乎不但能解释知识如何可能，还能解释思想本身如何可能，以及一个思想如何能 *关于* 别的东西。第三，接受对复杂共相之亲知的亲知理论家，有资格就我们关于必然真理的知识给出说明。第四，接受对命题之间逻辑关系或概率关系之亲知的人，可以对基础知识与非基础知识给出统一的处理——对亲知知识与摹状知识的统一处理——并且不那么容易受怀疑论威胁。第五，精致的亲知理论似乎能同时安顿许多人对知识论证成的两条直觉约束（虽非人人接受；许多说明最终会舍弃其一）：证成是 *导向真的*，因为它要求亲知那些使我们的信念为真（或至少使之具概率）的事实；证成又是 *内在的*，在此意义上：主体借亲知使真关系与使概率关系，对真相持有一个稳靠的视角，或握有一种对真相（或概率）的担保。
