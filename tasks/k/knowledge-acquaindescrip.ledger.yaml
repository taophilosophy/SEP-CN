      邦茹的亲知观似乎可以解释：为何亲知进路的支持者往往主张，人不能亲知外部世界的对象或外部世界的事实（BonJour 2001: 31）[^bonjour-2001]。如果亲知是意识状态“内置”的特征，凭它人只能觉察该状态自身的内在特征，那么，只要接受一个合理的假定——寻常物理对象及其内在特征并非心灵状态的内在特征——人就不能对这些对象或其特征有亲知。另一方面，富默顿的亲知关系观，同罗素传统观点一样，似乎容许对共相之类的抽象实体有亲知；有些亲知理论家正是诉诸这一点来说明思想与 *先天* 知识的可能性（参见第 4 节）。在亲知的本性及其蕴含这方面，仍有大量工作可做。
