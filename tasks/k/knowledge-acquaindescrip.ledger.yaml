      亲知进路的支持者每每主张：外部世界的对象、外部世界的事实，人皆不能亲知（BonJour 2001: 31）[^bonjour-2001]——邦茹的亲知观似可解释何以如此。若亲知是意识状态“内置”的特征，而人凭它只觉知该状态自身的内在性状，那么，一旦承认这个合理的假定——寻常物理对象及其内在特征并不就是心灵状态的内在特征——人对这些对象或其特征便无从亲知。反观富默顿的关系式亲知观，则与罗素传统一样，似乎容许亲知共相一类抽象实体；有些亲知理论家正是要靠这一点，为思想与 *先天* 知识的可能作说明（参见第 4 节）。亲知的本性与其种种蕴含，此处仍可大有作为。
