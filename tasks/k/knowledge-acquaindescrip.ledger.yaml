      The acquaintance theory is controversial, the idea that some things can simply be “given” to the subject has often been denounced as a “myth” (Sellars 1963)[^sellars-1963], and those committed to acquaintance disagree about its nature and its objects. All this may seem to be a source of embarrassment for the acquaintance theorist, for how could doubts and disagreements arise regarding what is supposed to be immediately and transparently present to consciousness? But there is no need for embarrassment. For the proponent of acquaintance or the given, the lesson of these doubts and disagreements is that from the fact that something is given it does not follow that everything about the nature of the given or its epistemic role is itself given; “profound puzzles can arise, and legitimately demand solution, even in connection with that which is indubitable” (Fales 1996: 2)[^fales-1996]. (For some elaboration on the acquaintance theorist’s response to the existence of such doubts and disagreements, see the concluding remarks.)
    step1: |-
      亲知理论本身就有争议，事物可以简单地“给予”主体的观念，更常被斥为“神话”（Sellars 1963）[^sellars-1963]；而认同亲知的论者之间，对亲知的本性及其对象也意见不一。这一切看来都该让亲知理论家难堪：对于本应当下、透明地呈现在意识中的东西，怎么还会有疑问和分歧？其实不必难堪。对亲知或所与的支持者来说，这些疑问与分歧的教训在于：某物是所与，并不意味着关于所与之本性及其知识论地位的一切也都是所与；“即使就那些无可怀疑的东西而言，也会产生深刻的问题，并且正当地要求解决”（Fales 1996: 2）[^fales-1996]。（关于亲知理论家如何回应这类疑问与分歧的存在，另见结尾的几点说明。）
    step2: |-
      亲知理论本属讼端不绝之物；事物可径直“给予”主体这一想法，更屡被斥为“神话”（Sellars 1963）[^sellars-1963]；即便倾心亲知的论者，于其本性、其对象也各说各话。凡此种种，看上去都足令亲知理论家汗颜：本该当下、澄明地呈临于意识之前者，如何还容置疑、容分歧？其实并无汗颜的理由。在亲知或所与的拥护者看来，疑问与分歧恰恰留下一课：某物虽为所与，有关所与本性及其知识论角色的全部却不必同样是所与；“即使针对那无可怀疑者，深刻的疑难亦可得起，且理直气壮地要求解决”（Fales 1996: 2）[^fales-1996]。（亲知理论家如何面对这类疑难与分歧，参见本文结尾几段的说明。）
