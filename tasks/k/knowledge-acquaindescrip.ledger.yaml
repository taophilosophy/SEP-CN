      上文已述，古典的、罗素式的亲知观念，起码以两件事为标记：（i）它是非意向性的觉察方式——亲知某物，不构成对它的任何判断或思想，也不构成对它施用任何概念；（ii）它是一种真实关系，要求 *关系项* 存在——不存在的事物、属性或事实，无人能够亲知。我们不妨宽泛地用“亲知理论”这块招牌，统称心灵哲学或知识论中让这般理解的亲知居于枢纽地位的任何学说。亲知理论的兴趣，大约在最近 25 年间有所回潮。当代的提倡者有 BonJour（2001, 2003）、Chalmers（2010）、Fales（1996）、Fumerton（1995, 2001, 2016）、Gertler（2001, 2011, 2012）、Hasan（2011, 2013）、McGrew（1995, 1999）、Moser（1989）、Stoutenburg（即出）与 Taylor（2013）。下文将见，其中数位哲学家在紧要处已背离罗素。然而同罗素一样，他们都认可：确有一种直接而非判断性的觉察形式存在，且具有哲学意义（他们中许多人径以“亲知”名之）——据此，把他们一概称为“亲知理论家”是站得住的。他们大多还公开认同古典基础主义：与罗素一样，主张一切知识、一切被证成的信念，最终都托底于凭亲知得来的知识与被证成的信念这一基础。不过，只接受亲知理论而不接受古典基础主义，也有前后一致的走法。比如，有人尽可同意我们确有部分亲知知识，并在心灵哲学的二元论之争中援用这种知识（参见感受性：知识论证词条），却不必赞成“一切知识或被证成的信念终须归本于亲知”。若无另行声明，下文“亲知理论”与“古典基础主义”两名通用。
