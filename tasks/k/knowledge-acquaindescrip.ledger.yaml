      Although it is not always offered explicitly as an argument, many no doubt reject the acquaintance theorist’s account of both noninferential and inferential knowledge out of fear that the account will inevitably lead to a radical skepticism. If knowledge by acquaintance is restricted to belief in propositions where one’s epistemic situation precludes the possibility of error, critics might well be right in suggesting that we have a tiny body of knowledge secured by direct acquaintance. The rest of what we know or justifiably believe must be secured by inference, and the fear is that we simply don’t have anything like the inferential resources to get from such a narrow base to commonsense beliefs about the world around us. Even if we allow for some fallible foundational beliefs, as many contemporary acquaintance theorists do (see section 6), one might still worry that the class of facts with which we are acquainted do not constitute a very impressive base. How legitimate that fear is depends very much on the analysis of inferential knowledge one accepts. If one requires access to probabilistic or explanatory connections as a condition for inferential knowledge, then unless one can be acquainted with such connections holding between propositions, skepticism does, indeed, loom on the horizon. A number of acquaintance theorists are more optimistic, however, that skepticism regarding the external world can be avoided (see McGrew 1995; Moser 1989; BonJour 2003; and Hasan 2018)[^bonjour-2003][^hasan-2018][^mcgrew-1995][^moser-1989].
    step1: |-
      虽然并不总被明确地当作论证提出，但无疑有许多人反对亲知理论家关于非推论知识与推论知识的说明，是出于担心这种说明必将导致彻底的怀疑论。如果亲知知识被限于这样的命题信念——其认识处境排除了出错的可能——那么批评者也许说得对：由直接亲知所保证的知识，其体量小得可怜。我们所知或合理相信的其余一切，都必须由推理来保证；而令人担心的是，我们根本没有像样的推理资源，能从如此狭窄的基础走到关于周遭世界的常识信念。即便我们像许多当代亲知理论家那样容许某些可错的基础信念（参见第 6 节），人们仍可能担心：我们所亲知的事实之类，构不成一个很可观的基础。这份担心是否正当，很大程度上取决于人们接受的推论知识分析。如果一个人要求以通达概率联系或解释联系为推论知识的条件，那么除非他能亲知命题之间成立的这类联系，怀疑论确实就要在地平线上浮现。不过，不少亲知理论家更为乐观，认为关于外部世界的怀疑论是可以避开的（参见 McGrew 1995；Moser 1989；BonJour 2003；以及 Hasan 2018）[^bonjour-2003][^hasan-2018][^mcgrew-1995][^moser-1989]。
    step2: |-
      虽未必明言为论证，许多人反对亲知理论家关于非推论知识与推论知识的说明，心底所惧者正是：此说势必引向彻底的怀疑论。若亲知知识只及于那些“认识处境已排错”的命题信念，那么批评者或许不无道理：由直接亲知担保的知识，其量微乎其微。其余所知、所合理相信者，皆须由推理担保；而所惧者正在于此——我们压根没有那样的推理本钱，能从如此逼仄的基座走到关于周遭世界的常识信念上去。纵使如许多当代亲知理论家一般，容许若干可错的基础信念（参见第 6 节），人仍可忧心：我们所亲知的那类事实，撑不起一个像样的基座。此项忧惧是否正当，大半取决于所取的推论知识分析。若以“通达概率联系、解释联系”为推论知识之条件，则除非人能亲知命题间成立的此类联系，怀疑论确已在地平线上探头。不过不少亲知理论家颇为乐观，以为关于外部世界的怀疑论可被避开（参见 McGrew 1995；Moser 1989；BonJour 2003；Hasan 2018）[^bonjour-2003][^hasan-2018][^mcgrew-1995][^moser-1989]。
