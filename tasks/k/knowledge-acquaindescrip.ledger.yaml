      Most sophisticated versions of classical foundationalism are perhaps best understood as grasping the nonpropositional horn of the dilemma, since acquaintance is a nonpropositional form of awareness. Fumerton (1995: 75) replies that while acquaintance itself is nonpropositional, that does not rule out that propositions or thoughts are objects of acquaintance or constituents of objects of acquaintance, and if one is acquainted with a relation of correspondence between a thought and a fact, that would seem to provide all the justification one could need or want. As we have seen, BonJour (2003) gives a similar reply that appeals to direct awareness of some fact and a direct recognition of the fit between the fact and the proposition believed. He regards this recognition as judgmental or propositional, and that may lead some to push the propositional horn again: we need something further to justify the judgment of fit, and so the regress of justification has not yet come to an end. (For a response, see BonJour 2003: 193. For some critical discussion, see Bergmann 2006: Ch. 2.)[^bergmann-2006][^bonjour-2003] McGrew, Chalmers, and others who adopt the demonstrative or phenomenal concept strategy might reply that at least in the case of demonstratively formed beliefs the relevance of the truth maker to the proposition believed is transparent and guaranteed by the manner in which the belief is formed: acquaintance simply picks out some feature of experience and takes it up into the content of a belief or judgment that asserts that the feature exists or is instantiated.
    step1: |-
      多数精致版本的古典基础主义，也许最好理解为抓住了两难中的非命题那一角，因为亲知是一种非命题的觉察形式。Fumerton（1995: 75）回应说：亲知本身固然非命题，但这并不排除命题或思想可以是亲知的对象、或亲知对象的构成部分；而如果一个人亲知到思想与事实之间的符合关系，那似乎就已提供了他所需或所欲的一切证成。如我们所见，BonJour（2003）给出了类似的回应，诉诸对某个事实的直接觉察与对事实与所信命题之间契合的直接识别。他把这种识别看作判断性的或命题性的，这可能促使一些人再次推向命题那一角：我们还需要别的东西来证成契合判断，于是证成的回溯仍未终止。（回应见 BonJour 2003: 193。批评性讨论见 Bergmann 2006：第 2 章。）[^bergmann-2006][^bonjour-2003] McGrew、Chalmers 以及其他采取指示性概念或现象概念策略的人则可以回应说：至少在指示性形成的信念的情形中，使真者与所信命题的相关性是透明的，并由信念形成的方式所保证——亲知径直挑出经验的某个特征，把它纳入一个断言该特征存在或被例示的信念或判断的内容之中。
    step2: |-
      多数精致的古典基础主义版本，怕只能算抓住了两难中的非命题那一角——盖亲知本是非命题的觉察形式。Fumerton（1995: 75）的回应是：亲知自身非命题，却不排斥命题、思想可为亲知的对象、或为亲知对象的构成项；人若亲知到思想与事实之间的符合关系，似的已尽供其所须、所欲之证成。如前所见，BonJour（2003）的回应大同小异，所靠者是对某事实的直接觉察、以及对“事实与所信命题相契”的直接识别。他把这份识别算作判断性、命题性的，这或又招人再推向命题那一角：契合判断还需别的东西来证成，证成回溯于是仍未走完。（回应见 BonJour 2003: 193；批评性讨论见 Bergmann 2006：第 2 章。）[^bergmann-2006][^bonjour-2003] 至于 McGrew、Chalmers 等取指示性概念或现象概念策略者，则可答曰：至少在指示性地形成的信念那里，使真者同所信命题的相干性本是透明的，且由信念生成的方式担保——亲知径直挑出经验的某个特征，把它收进一个断言“该特征存在”“该特征被例示”的信念或判断的内容里去。
