      反对这一理论的人也许试图寻找这类关系或实体，却找不到，或者至少没有意识到自己找到的正是亲知。亲知理论家固然可能认真看待现象学的考虑，但他们也许可以合理地主张：第一，我们 *不* 亲知刚才提到的这类实体，这远非显而易见（事实上，许多人觉得难以否认：至少在某些非常简单的情形中，我们能径直“看出”命题之间的蕴含关系）；第二，其他哲学家在这件事上的分歧，并不构成专属于亲知理论的难题。此外，由此赢得的显著理论优势，或许足以补偿现象学上的任何不显豁。
