      诚然，人们可以用这样或那样的比喻来解释这个概念，但比喻的误导可能和帮助一样多。人们也许会说，人所感到的疼痛在心灵“前面”；在人与他所感的疼痛之间没有“中间物”。但这些都是空间比喻，而自我与所亲知者之间的关系，实在并不那么像空间关系。即便一张椅子和一张桌子之间没有物体，它们之间的空间也由更小的空间构成，正因如此我们可以对不同的空间或距离作定量比较；相比之下，对某物的亲知并不由更多的关系构成，因而不同的亲知关系无法以同样方式作定量比较。你还可以补充说，亲知是非意向性、非判断性的觉察形式，而且不以某物存在为条件就不可能对它有这种觉察；可是“觉察”这个概念仍未得到分析，这些条件只是断言亲知具有这些特征，却没有说明它为何具有这些特征。
