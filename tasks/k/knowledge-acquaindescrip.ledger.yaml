      那些确实觉得“能直接觉察命题与事实之间的符合关系”可信、又接受某种内在论要求——一个人必须觉察到某事实与命题之真相的相关性，该命题才算对他被证成——的人，也许会倾向于再进一步，接受对命题性项目与非命题性项目之间其他逻辑关系或概率关系的亲知是可能的。如我们上文讨论推论知识时所见的，有些亲知理论家已经接受：我们能亲知命题之间的蕴含关系，以及更有争议的知识论概率关系。如果我们能觉察基础层面上某些命题与我们亲知的事实之间的类似关系，那就可能显著扩展满足强内在论要求的基础信念之种类。仅举几个简单的例子：设想我直接觉察到我视场中的一个红三角形，同时也觉察到一种逻辑排斥或不相容关系（或者，如果你愿意，也可说是“不符合”关系），它存在于“该图形是红三角形”与“它是绿的”“它是圆的”“它有五条边”这些命题之间。如果对符合的亲知是非推论证成的来源，那么也许对这些不相容关系的亲知，可以成为非推论证成的来源，使人不相信这些命题，或相信它们的否定——分别相信该图形不是绿的、不是圆的、不是五边的。按 Moser（1989），我们还能直接觉察命题与非命题性项目之间的概率关系或解释关系——例如“这里有一本蓝书”这一命题与给定的蓝书显现之间的关系（不过，如第 3.1 节已提及的，他似乎把这当作对信念态证成而非命题态证成的要求）。
    step2: |-
      有些人确以为“能直接觉察命题与事实间的符合关系”之说可信，又接受某种内在论要求——人须觉察到某事实与命题真相的相干性，该命题才算对他被证成——他们或愿再进一步，承认亲知还可能施及命题性项目与非命题性项目之间的其他逻辑关系、概率关系。前文论推论知识时已见，有些亲知理论家早已认下：我们能亲知命题间的蕴含关系，以及—争议更大—命题间的知识论概率关系。设若在基础层面上，我们也能觉察某些命题同所亲知事实之间的类似关系，那么合乎强内在论要求的基础信念，其品类便可大为拓宽。聊举数例：设想我直接觉察视场中一个红三角形，同时觉察到“该图形为红三角形”同“它为绿”“它为圆”“它有五边”诸命题之间的一种逻辑排斥或不相容关系（若愿意，也可唤作“不符合”）。倘若对符合之亲知是非推论证成之源，那么对这些不相容关系之亲知，或也可成非推论证成之源，教人不信那些命题、或信其否定——分信该图形非绿、非圆、非五边。依 Moser（1989），我们还能直接觉察命题与非命题项目之间的概率关系、解释关系——举如“此处有一本蓝书”这一命题同所予的蓝书显现之间的关系（不过如第 3.1 节所提，他似把它算作对信念态证成而非命题态证成的要求）。
