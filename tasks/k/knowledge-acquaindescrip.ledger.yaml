      亲知通常被认为是简单的，因此不可定义。那些让亲知扮演关键哲学角色的哲学家，对于自己无法定义这个概念，往往坦然不讳（例如 Fumerton 1995: 76–7）[^fumerton-1995]。他们相当有道理地论证：分析需要概念上的“原子”——由之构筑其他观念的简单观念。在他们看来，亲知概念可以说是一切知识论、也许还有一切心灵哲学所由建立的最根本概念。不过，一位哲学家的概念原子，可能是另一位哲学家完全的谜；除非一个人能说服自己弄明白亲知是什么，他就无法理解那些援引亲知的观点。
