      One might also respond that even if one is acquainted with one’s being appeared to 48-speckledly, one might fail either to have the right sort of thought or fail to be directly aware of a correspondence relation holding between this fact and the corresponding thought. It may be that we do not have the simple concepts for such properties, and so cannot compare them directly with the contents of experience. Perhaps, when one thinks of something’s having 48 speckles, one can think of it, as Russell might say, *only by* *description* (e.g., that number that is picked out by the numeral ‘48’, or by some other description) such that one’s having the thought does not involve acquaintance with the property of being 48-speckled. A Russellian about the nature of thoughts (see section 4) might say that we cannot be directly aware of the property (universal) of being 48-speckled, and so cannot compare that property directly with what is experienced. Alternatively, some might say that while we have phenomenal concepts for color and perhaps some basic shapes and numbers, we (most of us anyway) lack the phenomenal concept of being 48-speckled (Feldman 2004)[^feldman-2004]. On such a view, if my thought that I am appeared to 48-speckledly does not involve such Russellian or phenomenal concepts, but rather involves descriptive or complex contents, then it is no surprise that I am not foundationally justified in believing that I am appeared to 48-speckledly.
