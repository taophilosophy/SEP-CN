      亲知一个同思想相符的事实，何以为证成所不足？回看上例。我尽可直接觉察视场中有个十边形，尽可相信视场中有个十边形，却仍可能未被证成——只要我如此相信之故，不在于我未见视场中有十边形，而在于这一信念无非一猜，或在于我（无证而成地）认定视场中向来有十边形。据此也许有人提议：亲知理论家只须添上一条，谓主体必 *因* 觉察到相符事实而信 *p*。多数亲知理论家却不会就此安心。盖亲知理论家乃证成内在论的标准样板：他们一般接受内在论题——人之所以有理由相信 *p*，只在他握有偏袒 *p* 之真相的理由或证据，即从其自身视角看去 *p* 之为真绝非偶然的某种东西；外在论者正是拒绝这一题（参见知识证成的内在论与外在论构想词条）。故亲知理论家多半要力主：主体若不以某种方式同时觉察到该事实之于 *p* 真相的关涉，则对 *p* 这一事实的觉察就无法为相信 *p* 供给证成。这份对“某事实与 *p* 真相相关”的觉察，可归入知识论的基据关系，于是为“信念态证成”所必需：要使 *S* 本于某根据或证据 e 而有理由相信 *p*，*S* 须觉察到 e 与 *p* 真相的关涉，并正因这一觉察而直接相信 *p*。也可换一副要求：把它算作“命题态证成”的条件——要使 *S* 持有相信 *p* 的非推论证成（纵然 *S* 实际不信 *p*，或未把信念如法安放在该证成上），*S* 不光要亲知某个与 *p* 真相相关的事实，还须以某种方式觉察到那事实与 *p* 真相的关涉。Moser（1989: 141–5）似取前一解，Fumerton（1995）则取后一解。（命题态证成与信念态证成之别自是紧要，但为省事，下文不再细加区分。）
