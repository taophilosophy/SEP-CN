      What about the possibility of acquaintance with ourselves? Can an individual be directly acquainted with him or herself? Russell takes the question of whether we are ever acquainted with the self to be a difficult one. He says that acquaintance with the self is “hard to disentangle from other things,” but tentatively concludes that “it is probable, though not certain, that we have acquaintance with Self” (1912: 78–81.) However, he later denies that we have acquaintance with the self (see Russell 1914: part III)[^russell-1914]. In a recent paper, Duncan (2015) uses the method of doubt, or something very much like it, to argue that we are acquainted with ourselves.
    step1: |-
      那么亲知我们自身的可能性又如何呢？个人能直接亲知他或她自己吗？罗素认为，我们是否曾经亲知自我，是个困难的问题。他说，对自我的亲知“难以同其他东西剥离开来”，但他试探性地得出结论：“我们大概——尽管不能确定——亲知自我”（1912: 78–81）。然而他后来否认我们亲知自我（参见 Russell 1914: 第三部分）[^russell-1914]。在晚近一篇论文中，邓肯（Duncan 2015）运用怀疑的方法，或与之非常相似的东西，论证我们亲知我们自己。
