      There are a number of responses available to the acquaintance theorist (see BonJour 2003 and Fumerton 2005)[^bonjour-2003][^bonjour-2005][^fumerton-2005]. It need not be part of the acquaintance theorist’s view that in being directly acquainted with an experience one is directly acquainted with all aspects of the experience. One might be directly acquainted with the fact that one is being appeared to many-speckledly without being acquainted with the fact that one is appeared to 48-speckledly. Think, for example, about how you can be aware of a car’s having a dark color without being aware of its having a determinate shade. Some may deny that cases like the latter are clearly possible, for is one not aware of the specific shade as well, even if one does not have a term or concept for it? Indeed, as we have seen, some acquaintance theorists hold that one is acquainted with or directly aware of all intrinsic sensory or phenomenal features of one’s experience, including specific shades of color. However, they require in addition that the subject *attend* to the relevant feature or fact, and so they are still able to distinguish between a selective, attentive awareness and a more minimal consciousness or peripheral awareness. They may attempt in this way to accommodate the intuition that we are conscious of or aware of a great deal more than we attend to or notice, while insisting that this attention or noticing is a nonjudgmental awareness that secures its object—a form of acquaintance in our sense. (See for example, BonJour 2003: 192 and Chalmers 2010: 88, n. 5. See section 2 above for some elaboration.)[^bonjour-2003][^chalmers-2010] On this view, one might attend to one’s being appeared to many-speckledly without attending to one’s being appeared to 48-speckledly.
    step1: |-
      亲知理论家手边有若干回应（参见 BonJour 2003 与 Fumerton 2005）[^bonjour-2003][^bonjour-2005][^fumerton-2005]。亲知理论家的观点不必包含这样一条：在直接亲知一个经验时，人直接亲知该经验的一切方面。一个人可以直接亲知自己正被呈现为“多斑的”，而不亲知自己正被呈现为“48 斑的”。例如想想：你如何能觉察一辆车有深色，却不觉察它有某个确定色调。有人可能否认后一类情形显然可能，因为即使人没有相应的词或概念，难道不也觉察到那个具体色调吗？确实，如我们所见，有些亲知理论家主张，人亲知或直接觉察自己经验的一切内在感官特征或现象特征，包括具体的颜色色调。然而他们还额外要求主体 *注意* 相关特征或事实，因此仍能区分选择性的、注意的觉察与更为起码的意识或边缘觉察。他们也许以这种方式安顿如下直觉：我们所意识、所觉察的远比我们所注意、所留意的多得多；同时坚持这种注意或留意是一种保证其对象的非判断性觉察——在我们意义上的亲知。（例如参见 BonJour 2003: 192 与 Chalmers 2010: 88, 注 5。另见上文第 2 节的一些阐述。）[^bonjour-2003][^chalmers-2010] 照这一观点，一个人可以注意自己被呈现为“多斑的”，而不注意自己被呈现为“48 斑的”。
    step2: |-
      亲知理论家手头备有数种回应（参见 BonJour 2003 与 Fumerton 2005）[^bonjour-2003][^bonjour-2005][^fumerton-2005]。亲知理论家无须承认：直接亲知一个经验，就等于直接亲知该经验的一切方面。人尽可直接亲知自己正被呈现为“多斑的”，却不亲知自己正被呈现为“48 斑的”。试想：你如何能觉察一辆车颜色深，却不曾觉察它是哪一种确定的色调。有人或否认后一类情形确有可能——即便没有相应的词或概念，人难道不也觉察到那个具体的色调吗？诚然，如前所见，有些亲知理论家认定：人亲知、直接觉察自己经验的一切内在感官特征、现象特征，具体色调亦在其内。然而他们另添一条：主体须 *注意* 相关特征或事实；故仍能分辨选择性的注意觉察与更为起码的意识、边缘觉察。他们借此或可安顿一条直觉——我们所意识、所觉察者远多于所注意、所留意者——同时又坚称：这注意、这留意即是一种保证其对象的非判断性觉察，即我们所谓亲知。（例如参见 BonJour 2003: 192 与 Chalmers 2010: 88, 注 5；另见上文第 2 节的若干阐述。）[^bonjour-2003][^chalmers-2010] 依此说，人可注意“自己正被呈现为多斑的”，而不注意“自己正被呈现为 48 斑的”。
