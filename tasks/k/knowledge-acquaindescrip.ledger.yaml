      如前所述，全神贯注于谈话而一时没有注意到自己疼痛这种平常经验，可以充作亲知的一个例示。至少在某些此类情形中，疼痛并未完全消失，尽管人已不再注意到它。有人可能倾向于否认：一个人能在以某种方式觉察或意识到疼痛之外还保有疼痛。（邦茹 2003 似乎持此观点。另参见 Chalmers 2010: 291。）[^bonjour-2003][^chalmers-2010] 但富默顿所描述的那种情形，确实看起来是真可能的、甚至常见的；而注意自己疼痛这一动作，也不是简单地把一个概念述说给另一个概念（例如把 *疼痛* 概念述说给 *当前经验* 概念），而是一种活动——可以说，是把心灵的目光固定于经验的某个特定特征或侧面。亲知关系似乎正提供了此处所需：如果亲知是一个人可以对经验、或对经验的某个特征处于其中的关系，那就能解释下述可能——对某物的经验，如疼痛或其他感觉，可以暂时不被注意，随后又被注意到。邦茹的说明能否同样处理这类情形？邦茹对证成所要求的觉察作了一种特殊的限缩，这也许有助于他安置这类情形。我可以同时意识到、直接觉察到许多特征，但在任何时刻只能 *注意* 少数特征。在邦茹看来，注意与内置觉察并不全然分离，而是“以可称为选择性聚焦的方式在其上建立起来”（2003: 192）。因此，我不可能在疼痛而不觉察疼痛的情况下疼痛，却可能在疼痛而不特别地、选择性地注意疼痛。格特勒（Gertler 2001）提出了一种内省信念之证成的说明，把注意当作一种原始的、直接的觉察。虽则那里并未明言其与亲知的关联，但在较近的工作中，格特勒把同一观点辩护为内省知识的“亲知进路”，之所以如此称呼，是因为它受罗素亲知理论的启发（2011, 2012）。她似乎认为，指示性注意（使具有指示内容的内省判断——例如“我正在经验 *这个* 属性”——成为可能的那种注意）是由亲知使可能的（2012）。泰勒（Taylor 2013）讨论了把亲知认同一注意觉察的若干现象学优点与理论优点。
