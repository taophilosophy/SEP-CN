      Not all acquaintance theorists require acquaintance with the correspondence (or some other epistemically relevant relation) between some thought or proposition and a distinct fact for one to have knowledge by acquaintance. Rather than require a further act of awareness, some acquaintance theorists add constraints to the nature of the foundational belief or the manner in which it is formed so that acquaintance with some mental state or mental feature provides part of the content of the belief itself, and does so in such a way as to guarantee the truth of the belief. For example, according to McGrew (1995, 1999), for any object of acquaintance or direct awareness, it is possible to form a belief in which a demonstrative concept refers directly to it. By virtue of my acquaintance with a painful experience, I believe directly of it that it exists, or that the property (painfulness) is instantiated. We could express the belief roughly by saying “I am experiencing *this*” (McGrew 1995, 1999)[^mcgrew-1995], or “*this* is instantiated (in me, now)” (Gertler 2012)[^gertler-2012]*.* For this kind of belief (unlike most other beliefs regarding contingent facts), to genuinely understand or grasp the content of the belief *is* to grasp its truth.
    step1: |-
      并非所有亲知理论家都要求：亲知到某思想或命题与一个截然不同的事实之间的符合（或其他知识论上相关的关系），人才能拥有亲知知识。他们不加一层觉察行为，而是对基础信念的本性或其形成方式附加限制，使得对某个心灵状态或心灵特征的亲知本身构成信念内容的一部分，并且以保证信念为真的方式如此构成。例如，按 McGrew（1995, 1999），对任何亲知对象或直接觉察对象，都可以形成一个以指示性概念直接指称它的信念。凭我对一次疼痛经验的亲知，我直接关于它相信它存在，或相信那个属性（疼痛性）被例示。我们可以约略把这一信念表达为“我正经验着 *这个*”（McGrew 1995, 1999）[^mcgrew-1995]，或“ *这个* 被例示（于我，现在）”（Gertler 2012）[^gertler-2012]*.* 对这类信念（不同于大多数关于偶然事实的信念），真正理解或把握信念的内容 *就是* 把握其真。
    step2: |-
      并非人人都要那第三重条件。有些亲知理论家并不要求：人须亲知到某思想或命题与一个迥异的事实之间的符合（或别种知识论上相关的关系），方得亲知知识。他们不另立一层觉察，转而在基础信念的本性、其生成方式上设限，让对某心灵状态或心灵特征的亲知径直充当信念内容的一部分，且其充当之法足以保真。譬如依 McGrew（1995, 1999）：凡亲知对象、直接觉察对象，皆可据之成一个信念，其中指示性概念直指其上。凭我对疼痛经验的亲知，我直接就它相信它存在，或相信那属性（疼痛性）已被例示。这信念可粗略表述为“我正经验着 *这个*”（McGrew 1995, 1999）[^mcgrew-1995]，或“ *这个* 被例示（于我，当下）”（Gertler 2012）[^gertler-2012]*.* 此类信念（异于大多数关涉偶然事实者），真切理解或把握其内容，*即是* 把握其为真。
