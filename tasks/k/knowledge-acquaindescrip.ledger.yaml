    kind: body
    source: |-
      These sophisticated views also seem capable of handling a closely related, influential objection. Inspired by Sellars, BonJour (1978, 1985) presented the following dilemma for any foundationalist view that takes one’s justification to consist in or depend essentially on some sort of awareness, acquaintance, or apprehension. (See also, Sellars 1963: Part I, 1975; Davidson 1983; McDowell 1994; and Williams 2005.)[^davidson-1983][^mcdowell-1994][^sellars-1963][^williams-2005] Is the awareness or acquaintance that is the alleged source of noninferential justification propositional or conceptual? That is, does it involve the acceptance of a proposition or thought, or at least the categorization of some sensory item or the application of some concept to experience? If, on the one hand, the acquaintance or awareness is propositional or conceptual in this way, then while such acts or episodes of awareness seem capable, in principle, of justifying other beliefs, they would surely need to be justified themselves. The episode of awareness would involve something like the acceptance of a proposition, and such an attitude clearly needs justification if it is to justify anything else. But then, the allegedly foundational belief is not foundational after all. If, on the other hand, we can regard direct awareness as nonpropositional and nonconceptual, then while these acts or states of awareness do not require or even admit of justification—for simply being aware of something is a mental state that is clearly neither justified nor unjustified—they also don’t seem capable on their own of providing a reason or justification for propositional items like beliefs. Therefore, the classical foundationalist’s acquaintance or direct awareness cannot serve as a foundational source of knowledge or justified belief.
    step1: |-

    step2: |-

  - id: 84
    kind: body
    source: |-
      Most sophisticated versions of classical foundationalism are perhaps best understood as grasping the nonpropositional horn of the dilemma, since acquaintance is a nonpropositional form of awareness. Fumerton (1995: 75) replies that while acquaintance itself is nonpropositional, that does not rule out that propositions or thoughts are objects of acquaintance or constituents of objects of acquaintance, and if one is acquainted with a relation of correspondence between a thought and a fact, that would seem to provide all the justification one could need or want. As we have seen, BonJour (2003) gives a similar reply that appeals to direct awareness of some fact and a direct recognition of the fit between the fact and the proposition believed. He regards this recognition as judgmental or propositional, and that may lead some to push the propositional horn again: we need something further to justify the judgment of fit, and so the regress of justification has not yet come to an end. (For a response, see BonJour 2003: 193. For some critical discussion, see Bergmann 2006: Ch. 2.)[^bergmann-2006][^bonjour-2003] McGrew, Chalmers, and others who adopt the demonstrative or phenomenal concept strategy might reply that at least in the case of demonstratively formed beliefs the relevance of the truth maker to the proposition believed is transparent and guaranteed by the manner in which the belief is formed: acquaintance simply picks out some feature of experience and takes it up into the content of a belief or judgment that asserts that the feature exists or is instantiated.
    step1: |-

    step2: |-

  - id: 85
    kind: body
    source: |-
      ### 7.2 The Problem of the Speckled Hen
    step1: |-

    step2: |-

  - id: 86
    kind: body
    source: |-
      Recently, Sosa (2003a,b), Poston (2007) and Markie (2009) have raised the problem of the speckled hen in objection to the acquaintance theorist’s conception of noninferential justification. The speckled hen presents an appearance of, say, 48 speckles. One is, they assume, directly acquainted with one’s visual field replete with the 48 speckles. Yet unless one has counted the speckles, one is unlikely to have justification for believing that one’s visual field contains the 48 speckles. Even if one guesses correctly the number of speckles in the field, one’s guess hardly counts as a justified belief. Direct acquaintance with truthmakers for one’s belief is, then, clearly not sufficient for noninferential justification.
    step1: |-

    step2: |-

  - id: 87
    kind: body
    source: |-
      There are a number of responses available to the acquaintance theorist (see BonJour 2003 and Fumerton 2005)[^bonjour-2003][^bonjour-2005][^fumerton-2005]. It need not be part of the acquaintance theorist’s view that in being directly acquainted with an experience one is directly acquainted with all aspects of the experience. One might be directly acquainted with the fact that one is being appeared to many-speckledly without being acquainted with the fact that one is appeared to 48-speckledly. Think, for example, about how you can be aware of a car’s having a dark color without being aware of its having a determinate shade. Some may deny that cases like the latter are clearly possible, for is one not aware of the specific shade as well, even if one does not have a term or concept for it? Indeed, as we have seen, some acquaintance theorists hold that one is acquainted with or directly aware of all intrinsic sensory or phenomenal features of one’s experience, including specific shades of color. However, they require in addition that the subject *attend* to the relevant feature or fact, and so they are still able to distinguish between a selective, attentive awareness and a more minimal consciousness or peripheral awareness. They may attempt in this way to accommodate the intuition that we are conscious of or aware of a great deal more than we attend to or notice, while insisting that this attention or noticing is a nonjudgmental awareness that secures its object—a form of acquaintance in our sense. (See for example, BonJour 2003: 192 and Chalmers 2010: 88, n. 5. See section 2 above for some elaboration.)[^bonjour-2003][^chalmers-2010] On this view, one might attend to one’s being appeared to many-speckledly without attending to one’s being appeared to 48-speckledly.
    step1: |-

    step2: |-

  - id: 88
    kind: body
    source: |-
      One might also respond that even if one is acquainted with one’s being appeared to 48-speckledly, one might fail either to have the right sort of thought or fail to be directly aware of a correspondence relation holding between this fact and the corresponding thought. It may be that we do not have the simple concepts for such properties, and so cannot compare them directly with the contents of experience. Perhaps, when one thinks of something’s having 48 speckles, one can think of it, as Russell might say, *only by* *description* (e.g., that number that is picked out by the numeral ‘48’, or by some other description) such that one’s having the thought does not involve acquaintance with the property of being 48-speckled. A Russellian about the nature of thoughts (see section 4) might say that we cannot be directly aware of the property (universal) of being 48-speckled, and so cannot compare that property directly with what is experienced. Alternatively, some might say that while we have phenomenal concepts for color and perhaps some basic shapes and numbers, we (most of us anyway) lack the phenomenal concept of being 48-speckled (Feldman 2004)[^feldman-2004]. On such a view, if my thought that I am appeared to 48-speckledly does not involve such Russellian or phenomenal concepts, but rather involves descriptive or complex contents, then it is no surprise that I am not foundationally justified in believing that I am appeared to 48-speckledly.
    step1: |-

    step2: |-

  - id: 89
    kind: body
    source: |-
      As long as one has an account of why one of the conditions for noninferential justification fails, one is in a position to respond to the objection.
    step1: |-

    step2: |-

