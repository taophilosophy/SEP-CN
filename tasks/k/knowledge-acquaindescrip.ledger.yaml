  - id: 4
    kind: body
    source: |-
      To get clear on the distinction between knowledge by acquaintance and knowledge by description, let us briefly examine how its originator, Bertrand Russell, characterized it (see Russell 1910–11 and 1912: Ch. 5)[^russell-1910][^russell-1912]. First, what is meant by “acquaintance” and “description”?
    step1: |-
      为了弄清亲知知识与摹状知识的区分，让我们简要考察这一区分的创始者伯特兰·罗素是如何刻画它的（参见 Russell 1910–11 与 1912：第 5 章）[^russell-1910][^russell-1912]。首先，“亲知”与“摹状”分别是什么意思？
    step2: |-
      要弄清亲知知识与摹状知识之间的区分，不妨先简要看看该区分的创立者伯特兰·罗素如何刻画它（参见 Russell 1910–11 及 1912：第 5 章）[^russell-1910][^russell-1912]。先说“亲知”与“摹状”各自的含义。
  - id: 5
    kind: body
    source: |-
      > We shall say that we have *acquaintance* with anything of which we are directly aware, without the intermediary of any process of inference or any knowledge of truths. (Russell 1912: 78)[^russell-1912]
      >
      > I say that I am *acquainted* with an object when I have a direct cognitive relation to that object, i.e., when I am directly aware of the object itself. When I speak of a cognitive relation here, I do not mean the sort of relation which constitutes judgment, but the sort which constitutes presentation. In fact, I think the relation of subject and object which I call acquaintance is simply the converse of the relation of object and subject which constitutes presentation. That is, to say that *S* has acquaintance with *O* is essentially the same thing as to say that *O* is presented to *S*. (Russell 1910/11: 108)[^russell-1910]
    step1: |-
      > 我们将说，凡是我们可以直接觉察、而无需任何推理过程或任何真理知识作中介的东西，我们就对它拥有 *亲知*。（Russell 1912: 78）[^russell-1912]
      >
      > 我说，当我与一个对象处于直接的认知关系之中，也就是当我直接觉察到对象本身时，我就 *亲知* 该对象。我这里所说的认知关系，不是构成判断的那类关系，而是构成呈现（presentation）的那类关系。事实上我认为，我称之为亲知的这种主体与对象的关系，恰恰就是构成呈现的对象与主体关系的逆关系。也就是说，说 *S* 亲知 *O*，与说 *O* 呈现给 *S*，本质上是一回事。（Russell 1910/11: 108）[^russell-1910]
    step2: |-
      > 凡是我们可以直接觉察、无须任何推理过程或任何真理知识居中为介的东西，我们都将说：我们对之拥有 *亲知*。（Russell 1912: 78）[^russell-1912]
      >
      > 我说，当我与一个对象结成直接的认知关系，即是说，当我直接觉察到对象本身时，我便 *亲知* 该对象。此处所谓认知关系，并非构成判断的那一类，而是构成呈现（presentation）的那一类。我以为，我称为亲知的主体对对象的关系，其实不过是构成呈现的对象对主体关系之逆。换言之，说 *S* 亲知 *O*，与说 *O* 呈现于 *S*，本为一事。（Russell 1910/11: 108）[^russell-1910]
  - id: 6
    kind: body
    source: |-
      Russell thus characterizes acquaintance as a relation of *direct awareness*, a relation in which, as Russell and some others have put it, something is “presented” or simply “given” to the subject (see e.g., Lewis 1929 and 1946; Moser 1989: 80ff.; Fales 1996.)[^fales-1996][^lewis-1929][^lewis-1946][^moser-1989] Various positions can accept some sort of distinction between direct and indirect “awareness”: roughly, an awareness of *X* is indirect if it depends on awareness of something else, and direct otherwise. But this characterization of the distinction leaves open what counts as direct awareness.
    step1: |-
      罗素由此把亲知刻画为一种 *直接觉察* 的关系；正如罗素和其他一些人所说，在这种关系中，某物被“呈现”给主体，或干脆被“给予”主体（参见例如 Lewis 1929 与 1946；Moser 1989: 80 及以下；Fales 1996。）[^fales-1996][^lewis-1929][^lewis-1946][^moser-1989] 各种立场都可以接受某种关于直接“觉察”与间接“觉察”的区分：粗略地说，若对 *X* 的觉察依赖于对别的某物的觉察，它就是间接的；否则就是直接的。但这一刻画并未说明什么才算直接觉察。
    step2: |-
      于是罗素把亲知界说为 *直接觉察* 的关系——用他本人和其他论者的话说，在这种关系里，某物被“呈现”于主体，或径被“给予”主体（参见例如 Lewis 1929 与 1946；Moser 1989: 80 以下；Fales 1996。）[^fales-1996][^lewis-1929][^lewis-1946][^moser-1989] 各家立场都能接受某种直接“觉察”与间接“觉察”之别：大略言之，对 *X* 的觉察若倚赖于对另一物的觉察，便属间接；反之则属直接。然而这一界说并未交代：究竟什么才够得上直接觉察。
  - id: 7
    kind: body
    source: |-
      What distinguishes acquaintance is, minimally, the following two closely related features. First, it is a nonjudgmental and nonconceptual form of awareness. Judgments, thoughts and concepts are essentially *intentional or representational* in nature, i.e., they are *about* or *represent* other things. Acquaintance with something does not consist in forming any judgment or thought about it, or in having any concept or representation of it. (In the second passage above Russell does characterize it as a special “cognitive” relation, but one must immediately wonder what this means given that he explicitly denies that it is judgmental in nature.) Second, it is a form of awareness constituting a real, genuine relation, a relation that cannot obtain without its *relata* (the things or items related). One cannot be acquainted with something that does not exist. Acquaintance is thus like the relation of kicking or throwing, for one cannot kick or throw without there being something that is kicked or thrown—something that is the object of the kicking or throwing. (Of course, these are not forms of *awareness*!) In contrast, judgments and concepts may represent or be about things that don’t exist. Philosophers sometimes refer to this second feature by saying that acquaintance is “infallible”. However, this term is most often used to refer to a property of *beliefs*: roughly, a belief is infallible if it is immune to error or is guaranteed to be true. Given the first feature above, being acquainted with something is not to be understood in terms of having a belief or judgment about it, not even an infallible one.
    step1: |-
      亲知之区别于他物，最少有以下两个密切相关的特征。第一，它是一种非判断性的、非概念性的觉察形式。判断、思想与概念在本性上本质上是 *意向性的或表征性的*，也就是说，它们 *关于* 或 *表征* 别的事物。对某物拥有亲知，并不在于对它形成任何判断或思想，也不在于拥有关于它的任何概念或表征。（在上文第二段引文中，罗素确实把它刻画为一种特殊的“认知”关系，但既然他明确否认它具有判断性，人们立刻就会问这究竟是什么意思。）第二，它是一种构成真实、真正关系的觉察形式，这种关系离开其 *关系项*（被关联的事物或项目）便不能成立。人不可能亲知不存在的东西。因此亲知就像踢或扔这类关系：若无物被踢或被扔，人就不能踢或扔——总得有个被踢或被扔的对象。（当然，踢与扔本身并不是 *觉察* 的形式！）与此相对，判断与概念却可以表征或关于不存在的事物。哲学家有时用“不可错的”来指称第二个特征。然而，这个词最常用来指 *信念* 的一种属性：粗略地说，若一个信念免于错误，或保证为真，它就是不可错的。鉴于上述第一个特征，亲知某物不能理解为对它具有某种信念或判断，即便是一个不可错的信念或判断也不行。
    step2: |-
      亲知之所以为亲知，至少系于两个密切相关的特征。其一，它是非判断性、非概念性的觉察方式。判断、思想与概念在本性上都是 *意向性的或表征性的*：它们 *关于* 或 *表征* 他物。亲知某物，既不成之于对它作出判断或形成思想，也不成之于对它持有概念或表征。（上文第二段引文里，罗素确曾把它称作一种特殊的“认知”关系；但他既已明言它非判断性，读者当即要问：此语当作何解？）其二，它是一种构成真实关系、货真价实关系的觉察，此种关系若无 *关系项*（被关联的事物或项目）便无从成立。不存在之物，人不能亲知。故而亲知类乎踢、扔：无所踢、无所扔，便踢不成、扔不成——总须有被踢被扔之物。（自然，踢与扔本身并非 *觉察* 之形式！）反观判断与概念，却可表征或关涉不存在之物。哲学家有时以“不可错的”指称上述第二个特征。但这个说法多半用于 *信念* 的属性：约略言之，信念若免于出错、或保证为真，便算不可错。基于第一个特征，亲知某物断不可解作对之持有信念或判断——哪怕是不可错的信念或判断。
  - id: 8
    kind: body
    source: |-
      By a “description” Russell means any phrase of the form “a so-and-so” (an “ambiguous” or “indefinite” description) or “the so-and-so” (a “definite” description), though he focuses on the latter in his discussion of knowledge by description. Russell’s definition of knowledge by description builds naturally on this: To know some thing or object by a definite description is to know that it is the so-and-so or that the so-and-so exists, i.e., that there is exactly one object that is so-and-so (Russell 1912: 82–3)[^russell-1912]. On Russell’s view, proper nouns, and most common words, are really disguised descriptions (1912: 84–5). We might claim to know who Jack the Ripper was, that he was a vicious human being, and so on, but we can only think of and know the individual about whom the claim is made through a description of that individual—Jack the Ripper is that person (whoever he was) who committed certain atrocities in London in 1888. We have no “first hand” knowledge of the person about whom our judgment is made—we don’t even have “first hand” knowledge that only one individual committed the murders or, for that matter, that the murders took place. Put another way, we are not directly acquainted with either the crimes or the perpetrator of those crimes since he is long dead and we have surely never met him.
    step1: |-
      罗素所谓的“摹状”，指任何具有“一个某某”（“模糊的”或“不定的”摹状词）或“那个某某”（“限定的”摹状词）形式的短语，尽管他在讨论摹状知识时主要关注后者。罗素对摹状知识的定义自然由此而来：通过限定摹状词知道某个事物或对象，就是知道它是那个某某，或知道那个某某存在，也就是说，知道恰好有一个对象是某某（Russell 1912: 82–3）[^russell-1912]。在罗素看来，专名以及大多数普通词实际上都是伪装的摹状词（1912: 84–5）。我们或许会声称知道开膛手杰克是谁，知道他是个凶残的人，等等；但我们只能通过关于那个个人的摹状词来思考和知道这个被论断的个人——开膛手杰克就是那个人（不管他是谁），他于 1888 年在伦敦犯下某些暴行。我们对那个被论断的个人没有“第一手”知识；我们甚至没有“第一手”知识去知道只有一个人犯了那些谋杀案，或者说，不知道那些谋杀案确实发生过。换个说法：我们既不直接亲知那些罪行，也不直接亲知那些罪行的实施者，因为他早已死去，我们肯定从未见过他。
    step2: |-
      罗素所说的“摹状”，泛指“一个某某”（“模糊的”或“不定的”摹状词）与“那个某某”（“限定的”摹状词）两类短语；不过在论摹状知识时，他着眼的主要是后者。摹状知识的定义由此顺理成章：凭限定摹状词知道某物或某对象，即是知道它就是那个某某，或知道那个某某存在，亦即知道恰有一个对象是某某（Russell 1912: 82–3）[^russell-1912]。依罗素之见，专名以及大多数普通词语，其实都是乔装起来的摹状词（1912: 84–5）。我们未尝不可自称知道开膛手杰克是何许人，知道他凶残成性，诸如此类；然而对于被论断的那个人，我们只能借关于他的摹状词去思想、去认知——开膛手杰克就是 1888 年在伦敦犯下若干暴行的那个家伙（无论他是谁）。对于被论断的那个人，我们并无“第一手”知识；甚至“只有一人犯下这些凶案”或“这些凶案确曾发生”，我们也没有“第一手”知识。换个说法：那些罪行，以及犯下罪行的凶手，我们都不曾直接亲知——他早已作古，我们必定从未与他谋面。
  - id: 9
    kind: body
    source: |-
      Talk of descriptions naturally suggests the use of *language*, and as we have just seen, Russell himself often characterizes descriptions in linguistic terms, e.g., as *phrases* having such-and-such a form. However, for Russell, description does not essentially involve the use of words or phrases of a language; it involves the use or application of *concepts*. To know something “by description” does not require the use of language or linguistic terms, but it does require the use or application of concepts.
    step1: |-
      谈论摹状自然让人想到 *语言* 的使用；正如我们刚才所见，罗素本人常以语言学的方式刻画摹状，例如把它说成具有如此这般形式的 *短语*。然而在罗素看来，摹状本质上并不涉及使用某种语言的词或短语，而涉及 *概念* 的使用或应用。通过“摹状”知道某物，并不要求使用语言或语言词项，但确实要求使用或应用概念。
    step2: |-
      一谈摹状，自然联想到 *语言* 的运用；上文已见，罗素本人也每每以语言学措辞刻画摹状，例如说它是具有某种形式的 *短语*。但在罗素那里，摹状并不在本质上牵涉某种语言的词或短语，牵涉的是 *概念* 的运用或施用。凭“摹状”知道某物，无须动用语言或语言词项，却非得运用或施用概念不可。
