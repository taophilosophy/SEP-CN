      有些亲知理论家看似在亲知的本问题上就有分歧。富默顿把亲知视为一种 *自成一类的关系*，它“不能提供信息地归入某个属，也不能分析为问题更少的概念”（1995: 76）。它是一种不可还原的关系，可以成立在自我与某个对象、状态、属性或事实之间。与富默顿及其他亲知理论家一样，邦茹也同意存在一种非判断性的觉察形式，并且在要求对象存在的意义上“不可错”；也像其他古典基础主义者一样，他把一切被证成的信念（或至少一切被证成的经验信念）最终都归于这种觉察。但与富默顿不同，邦茹（2003）认为这种觉察是意识状态或经验状态“内置”的或内在的属性。照这一看法，觉察不是自我与别物之间的关系，而是心灵状态本身的内在特征——尽管它在某种意义上仍是关系性的，因为它是朝向某物的；而一个人所觉察的，正是那个觉察状态的特殊性状或内容。因此，富默顿把根本的觉察或亲知看作关系，邦茹却把它看作一切经验或意识状态的内在特征。觉察或亲知最自然地被认为是自我与别物之间的关系：我们通常说 *人、动物、人格、自我、心灵，等等* 觉察 *到* 事物、状态、属性或事实。然而，把最根本的觉察视为某些心灵状态之内在属性的观点，仍可使上述说法说得通：说我对 *X* 有直接觉察，只是说我处于一种对 *X* 有“内置”觉察的状态。
    step2: |-
      亲知理论家之间，看似连亲知的本性都未达成一致。富默顿视亲知为 *自成一类的关系*：它“无法有所增益地归入任何属，也无法拆解为任何更少麻烦的概念”（1995: 76），是一种不可还原的关系，可以缔结于自我与某对象、某状态、某属性或某事实之间。邦茹与富默顿以及别的一些亲知理论家同样承认：确有一种非判断性的觉察形式，且在要求其对象存在的意义上“不可错”；他也如诸古典基础主义者，把一切被证成的信念——至少一切被证成的经验信念——最终系于此种觉察。不同的是，邦茹（2003）把这种觉察算作意识状态或经验状态的“内置”属性、内在性状。如此则觉察并非自我与外物的关系，而是心灵状态自身的内在特征，只不过它仍是朝向某物的，故仍带关系色彩；而人所觉者，恰是那觉察状态的具体样相或内容。于是：富默顿把根本的觉察、亲知认作关系，邦茹则认作一切经验、一切意识状态的内在属性。把觉察或亲知想成自我与别物之间的关系，最是顺理成章：我们平日总说 *人、动物、人格、自我、心灵，诸如此类* 觉察 *到* 事物、状态、属性或事实。不过，把最根本的觉察判为若干心灵状态之内在属性者，也可使这类说法得到安置：说我对 *X* 有直接觉察，不过是说我正处在一个“内置”了对 *X* 之觉察的状态里。
