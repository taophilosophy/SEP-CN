      McGrew is not alone in holding that experiential or phenomenal features can, by virtue of our direct awareness of them, constitute the content of a special class of concepts. Gertler (2001, 2011, 2012), Chalmers (2003, 2010), and Nida-Rümelin (2004) defend views very much in the same spirit. Gertler (2001) distinguishes between ordinary demonstratives, which typically involve an intention to pick out an entity that satisfies some description, and a *pure* demonstrative, which picks out its referent solely by a fundamental act of attention or acquaintance. Chalmers (2003, 2010) defends a similar view according to which some noninferential beliefs are justified by virtue of involving a “direct phenomenal concept,” a concept whose content is *constituted* by a phenomenal quality with which one is acquainted. The view is supported by considering Frank Jackson’s (1982) hypothetical case of Mary, who has learned all of the physical facts about color but has never had a visual experience in color until one day she experiences red. Jackson argues there that Mary thereby learns some new information; she acquires some new knowledge. And since Mary already knows all the physical facts about color, this new item of knowledge must, Jackson argues, be of a non-physical fact. Chalmers (2010) and Nida-Rümelin (2004) argue that it is difficult to make sense of the epistemic progress of subjects like Jackson’s Mary unless we accept that there is a core phenomenal concept whose content is constituted by an underlying phenomenal or experiential quality with which the subject is acquainted. Chalmers (2004) relies on the acquaintance approach to phenomenal concepts to defend the knowledge argument for dualism—i.e., the claim that Mary acquires new knowledge, and that this must be knowledge of a *non-physical fact*. (He notes (2003: 227) that demonstratives are naturally used to express direct phenomenal concepts (e.g., “I am experiencing *this* quality”), and that there may be a sense in which a direct phenomenal concept is a “demonstrative” concept, but he avoids such a label at least in part because of the danger of confusing direct phenomenal concepts with demonstrative ones as usually understood.) It is worth noting that, in contrast, some philosophers appeal to knowledge by acquaintance to make sense of Mary’s new knowledge in order to oppose, rather than to support, the success of the knowledge argument for a dualistic conclusion (e.g., Conee 1994 and Balog 2012)[^balog-2012][^conee-1994].
    step1: |-
      认为经验的或现象的特征可凭我们对它们的直接觉察构成一类特殊概念的内容，持此论者不止 McGrew。Gertler（2001, 2011, 2012）、Chalmers（2003, 2010）与 Nida-Rümelin（2004）所辩护的观点在精神上非常接近。Gertler（2001）区分了通常的指示词——它们典型地包含挑出一个满足某摹状词的实体之意向——与 *纯粹* 指示词——后者仅凭一项根本的注意行为或亲知行为挑出指称物。Chalmers（2003, 2010）为类似的观点辩护：某些非推论信念之所以被证成，是由于它们涉及一个“直接现象概念”——其内容 *由* 人所亲知的某个现象性质 *构成* 的概念。这一观点的支撑来自对 Frank Jackson（1982）的玛丽思想实验的考虑：玛丽学得了关于颜色的全部物理事实，却从未有过颜色视觉经验，直到某天她经验到红色。Jackson 在那里论证：玛丽由此学到了某些新信息，获得了一些新知识。而既然玛丽已经知道关于颜色的全部物理事实，这条新知识，Jackson 论证道，必定是关于某个非物理事实的知识。Chalmers（2010）与 Nida-Rümelin（2004）论证：除非我们接受存在一个核心现象概念、其内容由主体所亲知的某个深层现象性质或经验性质构成，否则难以理解像杰克逊笔下的玛丽那样的主体在认识上的进展。Chalmers（2004）则倚重现象概念的亲知进路，为支持二元论的知识论证辩护——即玛丽获得新知识、且这必定是关于 *非物理事实* 的知识这一主张。（他注意到（2003: 227），指示词自然地被用来表达直接现象概念，例如“我正经验着 *这个* 性质”；而直接现象概念在某种意义上或许也是一个“指示性”概念，但他避免用这一标签，至少部分是因为怕把直接现象概念同通常理解的指示性概念混淆。）值得注意的是，相反地，有些哲学家诉诸亲知知识来安顿玛丽的新知识，其目的却是反对而非支持知识论证之双元论结论的成功（例如 Conee 1994 与 Balog 2012）[^balog-2012][^conee-1994]。
    step2: |-
      经验特征、现象特征，可凭直接觉察而构成一类特殊概念的内容——持此说者并非 McGrew 一人。Gertler（2001, 2011, 2012）、Chalmers（2003, 2010）、Nida-Rümelin（2004）所辩各说，其神理皆与之一贯。Gertler（2001）区分寻常指示词与 *纯粹* 指示词：前者通常带着“挑出一个满足某摹状词的实体”之意向；后者则单凭一项根本性的注意或亲知行为便锁定指称物。Chalmers（2003, 2010）所辩与之近同：某些非推论信念之所以有证成，正因其动用“直接现象概念”——一种内容 *由* 主体所亲知的某个现象性质 *构成* 的概念。此说的凭借，是对 Frank Jackson（1982）之玛丽设想的考量：玛丽尽学颜色之物理事实而终身未尝有色觉，直至一日经验到红色。Jackson 论称：玛丽由此得到新信息、获得新知识；既然她先前已知关于颜色的全部物理事实，这条新知识必是关于非物理事实的知识。Chalmers（2010）与 Nida-Rümelin（2004）接着论证：如不承认有一个核心现象概念、其内容由主体亲知的深层现象性质或经验性质所构成，便难以解释玛丽式主体的认识进展。Chalmers（2004）更倚现象概念的亲知进路，来为支持二元论的知识论证作辩护——即玛丽获得新知识、且此知识必系于 *非物理事实* 之主张。（他留意到（2003: 227），指示词天然地宜于表达直接现象概念，如“我正经验着 *这个* 性质”；直接现象概念在某种意义上或亦算“指示性”概念，但他不取此标签，至少部分是怕它与通常所解的指示性概念相混。）尤须一提的是，另有一路哲学家同样借亲知知识安顿玛丽的新知识，用意却是拒斥而非支持知识论证达于二元论结论（例如 Conee 1994 与 Balog 2012）[^balog-2012][^conee-1994]。
