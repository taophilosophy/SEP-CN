      上文已提：人专心谈话时一时不觉自己的疼痛——这桩家常经验可拿来充当亲知的一个实例。至少某些此类场合，疼痛并未全然消退，只是不再被人注意到。有人会倾向于否认：一个人可以拥有疼痛而不在任何意义上觉察它、意识到它（邦茹 2003 似持此见；又见 Chalmers 2010: 291）[^bonjour-2003][^chalmers-2010]。然而富默顿描绘的那种情形，看上去确属真实可能、甚至屡见不鲜；而“注意到自己的疼痛”这一步，也不是把一个概念简单归摄到另一个概念之下（譬如把 *疼痛* 概念归到 *当前经验* 概念名下），而是一个动作——不妨说，是把心灵的目光定住在经验的某一特定特征或侧面之上。亲知关系恰恰供给了此处所需之物：倘若亲知是人可以同其经验、或同经验的某一特征所处的关系，那么下述事便有了着落——对某物的经验（疼痛也好、别的感受也罢）可以先不被注意，继而重新被注意。邦茹的架构能否也接住这类情形？他对证成所需的觉察作了一项特别限定，或可助他把这些情形安置妥当。我能同时意识到、直接觉察到许多特征，可任一时刻只能 *注意* 其中少数几个。在邦茹看来，注意与“内置”觉察并非两不相干，而是“以一种可称为选择性聚焦的方式，在其上搭建起来”（2003: 192）。于是我固然不可能在毫无觉察的情况下疼痛，却完全可能疼痛而不曾专门地、挑选地注意那疼痛。格特勒（Gertler 2001）就内省信念的证成给出一套说明，把注意当作一项不可再析的直接觉察。那里虽未点明它与亲知的瓜葛，但较近的工作里，格特勒已把同一立场申说为内省知识的“亲知进路”——如此命名，正因它出自罗素亲知理论的启发（2011, 2012）。她似乎主张：指示性注意——使“我正在经验 *这个* 属性”一类具指示内容的内省判断得以可能的那种注意——其可能就系于亲知（2012）。泰勒（Taylor 2013）则列举了把亲知等同注意觉察的多重现象学之利与理论之利。
