      These sophisticated views also seem capable of handling a closely related, influential objection. Inspired by Sellars, BonJour (1978, 1985) presented the following dilemma for any foundationalist view that takes one’s justification to consist in or depend essentially on some sort of awareness, acquaintance, or apprehension. (See also, Sellars 1963: Part I, 1975; Davidson 1983; McDowell 1994; and Williams 2005.)[^davidson-1983][^mcdowell-1994][^sellars-1963][^williams-2005] Is the awareness or acquaintance that is the alleged source of noninferential justification propositional or conceptual? That is, does it involve the acceptance of a proposition or thought, or at least the categorization of some sensory item or the application of some concept to experience? If, on the one hand, the acquaintance or awareness is propositional or conceptual in this way, then while such acts or episodes of awareness seem capable, in principle, of justifying other beliefs, they would surely need to be justified themselves. The episode of awareness would involve something like the acceptance of a proposition, and such an attitude clearly needs justification if it is to justify anything else. But then, the allegedly foundational belief is not foundational after all. If, on the other hand, we can regard direct awareness as nonpropositional and nonconceptual, then while these acts or states of awareness do not require or even admit of justification—for simply being aware of something is a mental state that is clearly neither justified nor unjustified—they also don’t seem capable on their own of providing a reason or justification for propositional items like beliefs. Therefore, the classical foundationalist’s acquaintance or direct awareness cannot serve as a foundational source of knowledge or justified belief.
    step1: |-
      这些精致的观点似乎也能处理一个密切相关而颇有影响的反对意见。受塞拉斯启发，BonJour（1978, 1985）对任何主张证成在于、或本质上依赖于某种觉察、亲知或把握的基础主义观点，提出了如下两难。（另参见 Sellars 1963：第一部分，1975；Davidson 1983；McDowell 1994；以及 Williams 2005。）[^davidson-1983][^mcdowell-1994][^sellars-1963][^williams-2005] 那被断定为非推论证成之来源的觉察或亲知，是命题性的还是概念性的？也就是说，它是否涉及接受一个命题或思想，或至少涉及对某个感官项目作归类、对经验施用某个概念？一方面，如果亲知或觉察以这种方式是命题性的或概念性的，那么，这类觉察行为或经历虽然在原则上似乎能为其他信念提供证成，它们本身却肯定也需要证成。觉察经历会涉及类似接受一个命题的东西，而这样的态度若要证成别的什么，显然需要证成。但这样一来，那个据说基础的信念终究并不基础。另一方面，如果我们能把直接觉察看作非命题的、非概念的，那么，这类觉察行为或状态虽然不需要、甚至不容有证成——因为仅仅觉察到某物，显然是一种既谈不上被证成、也谈不上不被证成的心理状态——它们本身也似乎无法为信念这样的命题性项目提供理由或证成。因此，古典基础主义者的亲知或直接觉察，不能充当知识或被证成信念的基础来源。
    step2: |-
      这些精致之说，似也接得住一记贴身且有力的驳难。BonJour（1978, 1985）承塞拉斯之绪，对一切“以证成寄于某种觉察、亲知或把握、或使之本质地依赖于此”的基础主义，摆出如下两难。（又见 Sellars 1963：第一部分，1975；Davidson 1983；McDowell 1994；Williams 2005。）[^davidson-1983][^mcdowell-1994][^sellars-1963][^williams-2005] 号称非推论证成之源的那份觉察、亲知，究竟是命题性的，还是概念性的？换言之，它是否含有对某一命题或思想的接受，或至少含有对某个感官项目的归类、对经验施用某个概念？设若它是命题性、概念性的：这类觉察行为或经历，原则上似能为别的信念提供证成，可是它自身必定也要证成。觉察经历须含某种类乎“接受一个命题”的东西，而如此态度若要证成他物，显然先得自己被证成。于是那个号称基础的信念，到头来并不基础。设若我们转认直接觉察为非命题、非概念的：这类觉察行为或状态固然不必、甚至不容有证成——仅仅觉察某物，显然既谈不上被证成，也谈不上不被证成——然而它们自身似也无力为信念之类的命题性项目提供理由或证成。是故，古典基础主义者的亲知、直接觉察，终究当不成知识与被证成信念的基础来源。
