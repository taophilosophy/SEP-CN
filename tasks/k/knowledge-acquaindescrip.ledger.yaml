      多数古典基础主义者至少含蓄地反对如下想法：只要一个人的非推论证据 *P* 与由之推出的命题 *Q* 之间成立概率关系，就足以获得推论证成或推论知识。他们坚持：人必须觉察到、或能够通达前提与结论之间成立的概率联系。对事实的直接亲知曾被提出来终止可能恶性的证成回溯（参见第 3 节），但如今回溯又在关于概率联系的知识上重新逼近。人如何获得关于前提与结论之间概率联系的知识？如果一个人从某个其他不同的命题 *F* 之为真推出这些概率联系存在，那么他不仅需要相信 *F* 的证成，还需要相信“ *F* 确实使‘该概率联系成立’具有概率”的证成！这里的困难本质上正是刘易斯·卡罗尔（Lewis Carroll 1895）所指出的那个困难，尽管他把该困难施用于演绎推理。BonJour（2005）援引这一困难，作为把对逻辑关系的直接的、非命题的把握视为推论证成之关键的理据，至少对演绎推理是如此；同样，Fumerton（2015）论证：要止住回溯，内在论者应当要求对命题之间使具有概率的关系有直接的觉察。但我们觉察到这样的关系吗？若按频率理解概率，问题似乎无望，因为我们似乎无法直接通达诸如“一个命题相对于另一个（逻辑上独立的）命题为真的比率”这样复杂而偶然的事实。这种事实似乎只有通过大量观察、数据采集或经验研究才能知道，而我们如何知道某次观察使我们的概率判断具有概率，这个问题又原样浮现。然而，若一个人能说服自己：命题之间确实存在使具有概率的真实逻辑关系，那么亲知理论家或许能再次通过亲知获得关于这些联系的必需知识。拉姆齐（Ramsey 1926）有一句名言，反对我们似乎并不能知觉到这类使具有概率的关系；但 Hasan（2017）论证这些反对意见是弱的，并且有很好的理由认为我们能直接觉察这类关系。这一版本的亲知理论，在理解非推论知识与推论知识两方面都关键地倚赖亲知这一根本概念。非推论知识由对使真者的直接亲知来保证。推论知识由对已知命题与其他命题之间逻辑联系和概率联系的直接亲知来保证。
    step2: |-
      多数古典基础主义者，至少是心照不宣地，不肯承认：只要一个人的非推论证据 *P* 同由之推出的命题 *Q* 之间立有一层概率关系，便足以取得推论证成或推论知识。他们坚持，人须觉察到、或得以通达前提与结论之间那层概率联系。前文曾借对事实的直接亲知来截断可能恶性的证成回溯（参见第 3 节）；如今回溯又借概率联系之知卷土重来。前提与结论之间的概率联系，人如何得知？倘若人是从另一个命题 *F* 之真推出这些概率联系存在，那么他不光需要“相信 *F*”的证成，还需要“ *F* 确实使之具有概率——即该概率联系确实成立”的证成！此处的难处，实质上正是刘易斯·卡罗尔（Lewis Carroll 1895）所指的那一难处，只不过他把它安在演绎推理头上。BonJour（2005）即引此为据，主张对逻辑关系的直接、非命题的把握乃推论证成之命脉，至少就演绎推理而言如此；Fumerton（2015）同样论证，要截住回溯，内在论者就该要求对命题间“使具概率”关系有直接觉察。可我们当真觉察到这般关系吗？若以频率解概率，此问几近绝望：对于“一命题相对于另一（逻辑上独立的）命题为真之比率”这类繁复而偶然的事实，我们似乎全无直接通达之途。这种事实，似乎只能靠大量观察、搜集数据、经验研究才得知；而我们又如何知道某次观察使我那概率判断具有概率？旧问题又原样立起。反过来，若有人能说服自己：命题间确有真实的“使具概率”之逻辑关系，那么亲知理论家或可再借亲知取得关于这些联系的必需之知。拉姆齐（Ramsey 1926）有一句常被援引的驳难，说我们似乎并不知觉到此类概率关系；Hasan（2017）则反驳说这些驳难软弱无力，我们有充分理由相信自己能直接觉察这类关系。这一版亲知理论，无论解非推论知识抑或推论知识，都紧要地依傍亲知这一根本概念：非推论知识由对使真者的直接亲知担保；推论知识由对已知命题与其他命题之间逻辑联系、概率联系的直接亲知担保。
