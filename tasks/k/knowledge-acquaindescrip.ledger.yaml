      还值得一提的是，尽管谈到亲知常让人想起感觉与料理论，但对亲知本身的承诺并不蕴含这种承诺。按感觉与料理论，只要一个人有似乎某对象具有属性 *F* 的感官经验，就有一个具有 *F* 的对象在场。例如，若我有似乎一个绿色三角形的感官经验，那么就有一个既绿且三角的东西在场。而由于即使幻觉中我也可能有这种感官经验（至少感觉与料理论家如此说），这个既绿且三角的对象就不是物理对象。与把所觉属性 *F* 当作主体所觉察的某对象之特征的感觉与料理论家相反，副词论者或呈现论的拥护者把它当作感觉或经验的一种方式。跳一支华尔兹，并不是去做一个叫“跳舞”的动作而以华尔兹为它的对象，而是跳舞的一种方式或样态——华尔兹式地跳；同样，经验到绿色或有绿色的呈现，并不是有一个以绿色对象为对象的觉察行为，而是经验的一种方式、被呈现的一种方式——“绿式地经验”或“被绿式地呈现”。亲知进路与关于感官经验的副词论相容：一个人可以亲知经验状态、亲知自己正在绿式地经验，而不是亲知某个绿色对象及它的绿。（例如参见 Fumerton 1985: 94–5；McGrew 1995: 93–4；Chalmers 2010: 291。）[^chalmers-2010][^fumerton-1985][^mcgrew-1995] 另有一些亲知理论家则认为，知觉或感官经验牵涉对 *共相* 的亲知，并期望由此避开感觉与料理论与副词理论各自的困难。关于这一观点的一个有意味的辩护，见 Forrest（2005）。（关于感觉与料理论与副词论的更多信息，参见知觉问题词条。）
    step2: |-
      另有一点值得指出：亲知之论一出口，总容易牵人想到感觉与料理论，但对亲知本身的承诺，并不必然带上这份承诺。感觉与料理论谓：凡有似乎某对象具属性 *F* 的感官经验，必有一具 *F* 者在场。譬如有“一个绿色三角形”之感官经验，则在场者中便有一物既绿且三角。而按感觉与料论者之说，即便我在幻觉中也可有这一经验，那既绿且三角之物便不是物理对象。感觉与料论者把所觉的 *F* 算作主体所觉某对象身上的特征；副词论者——呈现论的提倡者——则把它算作感觉或经验的一种方式。跳一支华尔兹，并非去做某件名为“跳舞”的事、另取一支华尔兹作其对象，而只是跳舞的一种样式、一种样态——华尔兹式地跳。同样的道理，经验到绿色、有绿色之呈现，并非有一个拿绿色对象当靶子的觉察行为，而是经验的一种方式、被呈现的一种方式——“绿式地经验”“被绿式地呈现”。亲知进路与感官经验上的副词论并行不悖：人所亲知者，可以是经验状态、是自己正在绿式地经验，而非某个绿色对象及其为绿。（例如参见 Fumerton 1985: 94–5；McGrew 1995: 93–4；Chalmers 2010: 291。）[^chalmers-2010][^fumerton-1985][^mcgrew-1995] 亦有亲知理论家主张：知觉或感官经验本身即含对 *共相* 的亲知，盼借此同时躲开感觉与料理论与副词论各自的麻烦。此说一例较有兴味的辩护见 Forrest（2005）。（感觉与料理论与副词论的详情，参见知觉问题词条。）
