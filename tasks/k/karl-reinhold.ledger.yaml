      ## 4. Rational Realism
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      After intense study of Bardili’s *Grundriß der Ersten Logik, gereinigt von den Irrthümmern bisheriger Logiken überhaupt, der Kantischen insbesondere; Keine Kritik sondern eine Medicina mentis, brauchbar hauptsächlich für Deutschlands Kritische Philosophie* [*Outline of First Logic, Cleansed of the Errors of Previous Logics in General and of the Kantian Logic in Particular. Not a Critique but a Medicine for the Mind, Especially Useful for Germany*’*s Critical Philosophy*], Reinhold declared his allegiance to Bardili’s system in December 1799. Reinhold’s explicit commitment to rational realism would last until his “linguistic turn.” However, this final phase of Reinhold’s philosophical development, focused on language, was still strongly informed by rational realism.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      Rational realism can be conceived of as a kind of ontological logic insofar as the logical laws of thought are constitutive of nature. It foregrounds the concept of thinking *qua* thinking (*Denken als Denken*). Thinking *qua* thinking is not to be understood representationally as involving the relation between subject and object, but as an original unity of thought and being. The principle of thinking *qua* thinking is expressed formally as “A as A in A and through A.” This principle indicates the essence, or “inner character,” of thinking *qua* thinking, namely “eternally absolute identity” (*BzÜ* 1, p. 108–109). Absolute identity excludes all distinguishability, distinction, and difference. For this reason, the essence of thinking *qua* thinking cannot consist in concepts, judgments, or inferences, and cannot admit of categorial determinations of quantity, quality, relation, or modality. These hold only for the *application* of thinking *qua* thinking to some matter. This matter is not derived directly from the principle of thinking *qua* thinking but is postulated (*BzÜ* 1, p. 111), since it is the condition of something being thought (*BzÜ* 2, p. 182f; Bardili 1800: 67). Formally, matter is represented as C, which, in relation to *reality* (B) and *possibility* (–B), yields a determinate object (b). These terms are—somewhat obscurely—employed in various mathematical operations (addition, multiplication, division) to derive the forms of intuition, the essence of a “thing *qua* thing,” the essence of judgment, organisms, life, and the categories of *substance*, *cause*, and *ground* (*BzÜ* 2, pp. 182–199). For Reinhold, the manifestation of pure thinking in nature is to be conceived of theologically: at bottom, rational realism represents “the *manifestation of the original being in the essence* of things, or the revelation of God in nature” (*BzÜ* 4, p. 219; for discussion of rational realism’s Neo-Platonist and religious overtones, see Ahlers 2012)[^ahlers-2012].
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Reinhold and Bardili’s joint project faced significant criticism. Fichte was quick to rebuke his former disciple in his two-part review of Bardili’s *Grundriß*, where he also attacked Reinhold’s earlier review of the same work. Despite his critical stance toward rational realism, lecture notes from 1804–1807 indicate that Fichte incorporated some of its elements into his own system (see Ferraguto 2020)[^ferraguto-2020]. Hegel, too, lost no time in joining the fray, assailing Reinhold in his *Differenzschrift* of 1801. Hegel would join forces with Schelling, co-editing the *Kritisches Journal der Philosophie*, which contained fierce criticisms of rational realism. Reinhold replied to these onslaughts in subsequent issues of his *Beyträge*, taking aim especially at Schelling. The exchanges between these thinkers were bitter, leading Reinhold to call the dispute a “war of annihilation” (*BzÜ* 5, iii). This debate did not go unnoticed by the philosophical public, Joseph Kurz addressing the incendiary discourse in a short treatise in 1803, *Der philosophische Vertilgungskrieg* [*The Philosophical War of Annihilation*]. Marked by considerable mutual misunderstanding, the controversy also highlights implicit lines of influence and important contrasts in the protagonists’ conceptions of the relationships between thought and being, form and matter, and subjectivity and objectivity (for studies of this constellation, see: Ahlers 2006; Ahlers 2012; Bondeli 1995a: 314–414; Bondeli 1995b; Bondeli 1997a; and di Giovanni 2006)[^ahlers-2006][^ahlers-2012][^bondeli-1995a][^bondeli-1995b][^bondeli-1997a][^giovanni-2006].
