      A further strand of recent scholarship concerns Reinhold’s philosophy of history and his related understanding of the history of philosophy. Ameriks (2006) and Breazeale (2010) highlight the novelty of Reinhold’s historical conception of reason’s needs or interests, with Ameriks identifying Reinhold as the catalyst for the historical turn in modern philosophy. More recently, Reichl (2021) challenges this view, arguing that Reinhold’s conception of history is already anticipated by Kant. Heinz (2004) shows the connection between Reinhold’s conceptions of history and of systematicity in the Elementary Philosophy. While several scholars have noted the connection between Reinhold’s and Hegel’s conceptions of history, a comprehensive study of this connection is still outstanding.
