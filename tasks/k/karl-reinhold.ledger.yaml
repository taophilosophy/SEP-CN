      也许有人会记得，莱因霍尔德的意图不仅是为康德在第一部《批判》中阐述的理论哲学提供新根基，而是为整个批判哲学——包括康德的实践哲学——提供新根基。然而事实上，莱因霍尔德给读者的，只是关于他的元素哲学如何可能容纳康德对意志与实践理性的说明的最粗略的暗示。值得注意的是，这发生在其认识能力理论的最后、篇幅 19 页的一节——欲求能力理论——之中：莱因霍尔德把自己限制在他所描述的、用以证明理论理性与实践理性之统一的策略的纯粹“纲要”之内：如果意愿是现实的（而非仅仅可能的）表象与认识的可能性的条件，那么欲求能力就制约着认识能力与表象能力。
