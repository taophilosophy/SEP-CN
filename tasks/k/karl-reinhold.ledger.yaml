      ## 5. Linguistic Turn
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      A definitive starting point for Reinhold’s philosophy of language, the final phase of his philosophical development, is difficult to determine. He is reported to have spoken of a “new standpoint” in 1805 (Ernst Reinhold 1825: 337; cf. Bondeli 1995a: 267)[^bondeli-1995a][^reinhold-1825], and in 1806 he published *Versuch einer Critik der Logik aus dem Gesichtspunkt der Sprache* [*Attempt at a Critique of Logic from the Perspective of Language*]. In this work, Reinhold asserts the indispensable relationship between thought and language, which would become a hallmark of his mature works in philosophy of language. However, at this point, the relationship between thought and language is assumed to be undeniable and is not further developed, with the bulk of the 1806 *Critik* focusing on establishing a hierarchy of logical concepts. Reinhold appears to break with Bardili in the preface to his 1808 *Die Anfangsgründe der Erkenntnis der Wahrheit in einer Fibel für noch unbefriedigte Forscher nach dieser Erkenntnis* [*Foundations of the Cognition of Truth in a Primer for Still Dissatisfied Inquirers of this Cognition*], making this a convenient marker for the end of Reinhold’s phase of rational realism and the beginning of his linguistic turn. Yet, the preface to his *Grundlegung einer Synonymik für den allgemeinen Sprachgebrauch in den philosophischen Wissenschaften* [*Groundwork of a Synonymic for the Universal Use of Language in the Philosophical Sciences*] (1812) suggests that *this* work signals a new direction in his philosophical thought since his endorsement of rational realism. Whatever difficulties there might be in sharply categorizing distinct phases of Reinhold’s late philosophical development, so much is clear: linguistic concerns garnered Reinhold’s attention for some time and his project of basing philosophy on a critique of language comes to fruition in the *Grundlegung einer Synonymik* and subsequent works, including *Das menschliche Erkenntnißvermögen aus dem Gesichtspunkt des durch die Wortsprache vermittelten Zusammenhang zwischen der Sinnlichkeit und dem Denkvermögen* [*The Human Faculty of Cognition from the Perspective of the Connection, Mediated by Spoken Word, Between Sensibility and the Faculty of Thought*] (1816) and *Die Alte Frage: Was ist die Wahrheit?* [*The Old Question: What is Truth?*] (1820).
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      While Reinhold claims in the 1806 *Critik* that no one doubts thought is conditioned by language, he comes to appreciate that many philosophers hold a contrary, instrumentalist view of the relationship between thought and language (e.g. Fichte, Jakob Friedrich Fries, and Gottlob Ernst Schulze), according to which language merely expresses thought, where thought is independent of language. Reinhold rejects this instrumentalist view of language. In his view, language and thought are mutually conditioning and essentially intertwined (*Grundlegung einer Synonymik*, p. 3). As a result of this connection, ambiguities and inconsistencies in language carry over to thought. This, Reinhold maintains, explains philosophy’s lack of systematic consistency and the lack of unanimity among philosophers: philosophical disputes are attributable to linguistic ambiguities. Broadly following Johann Gottfried Herder and Johann Georg Hamann, Reinhold proposes a critique of language as a meta-critique of reason.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      For Reinhold, critique of language consists in rectifying the ambiguities of language, an enterprise Reinhold calls “synonymic.” The “primary task” of this critique, and of “philosophy as science” more generally, is to define the “fundamental concepts of human cognition” (*Grundlegung einer Synonymik*, p. 185). There is a general consensus in the literature that synonymic promises more than it can deliver (Cloeren 1972; Cloeren 1988; Gerten 2006; Imhof 2015; Valenza 2003)[^cloeren-1972][^cloeren-1988][^gerten-2006][^imhof-2015][^valenza-2003]. One problem concerns the justification of the definitions Reinhold proposes and their hierarchical ordering: at times, these seem little more than arbitrarily stipulated. Another problem concerns the ontological underpinning of Reinhold’s system. In particular, he appeals to the rational realist notion of the unity of thought and being (on the prefiguration of Reinhold’s linguistic phase in his early correspondence with Bardili, see Valenza 2004)[^valenza-2004]. Thus, in addition to human, representational thought—which is inextricably tied up with language—Reinhold presupposes speechless thinking (*sprachloses Denken*), identified with God’s thinking. This non-representational thinking, which Reinhold variously calls “thinking in the narrowest sense” (*Grundlegung einer Synonymik*, p. 116) and—harking back to rational realism—“thinking *qua* thinking,” is to be understood as the “*immutable*, *subordinating order of being* in itself” (*Das menschliche Erkenntniß*, p. 57). Especially in *Das menschliche Erkenntniß*, Reinhold emphasizes the indispensable relationship between representational thought and language in order to distinguish the former from divine thinking *qua* thinking. However, it is unclear whether this ontological foundation, which draws on rational realism, is properly accounted for within the framework of Reinhold’s philosophy of language.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Despite these perceived shortcomings, scholars agree that Reinhold’s final philosophical phase offers many insights. Reinhold actively engages with various philosophers who thematize language: in addition to referring to thinkers in his proximity (e.g. Bernhardi, Bouterwek, Fichte, Fries, Hamann, Herder, Jacobi, and Schulze), he cites Leibniz as a forerunner of synonymic (*Grundlegung einer Synonymik*, p. 185f.) and draws on the British tradition in figures such as Bacon, Locke, and Hume. Reinhold anticipates Wilhelm von Humboldt’s rejection of instrumentalist views of language in support of the interdependence of thought and language, as well as aspects of Frege (Bondeli 1995a: 271)[^bondeli-1995a] and Wittgenstein (Bernecker 2018: 3374f.)[^bernecker-2018]. There is still much to be investigated in the history of the philosophy of language in general (for studies of this history in German philosophy, see Cloeren 1988; Forster 2010; and Forster 2011)[^cloeren-1988][^forster-2010][^forster-2011] and Reinhold’s place in it in particular.
