      ## 6. Reception of Reinhold’s Philosophy
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      During Reinhold’s own lifetime, or at least during certain phases of the same, he was among the more influential philosophers in Germany — first as an immensely successful popularizer of the Kantian revolution and then, with his effort to construct an Elementary Philosophy, as one of the founders of “post-Kantian idealism.” This, however, nearly exhausts his positive influence upon his contemporaries.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Following the heyday of German idealism, Reinhold’s name has generally been relegated to the history of philosophy, within which he is assigned the role of serving as a small, but not insignificant rung on the alleged ladder “from Kant to Hegel,” and this is precisely how he is still treated in most general histories of philosophy. In this context, Reinhold is usually credited with (or blamed for) putting the issues of systematic form and “philosophical foundations” at the center of philosophical concern. Even those, such as Fichte, who roundly criticized the details of his Elementary Philosophy professed sincere admiration for Reinhold’s “systematic spirit.” And many of those who rejected his contention that the Principle of Consciousness could serve as the first principle of a philosophy as a whole, nevertheless praised him as the philosopher who first recognized the need for some such principle and first sought to provide Kantianism with a solid “foundation.” In both of these respects, Reinhold served as an important catalyst or stimulus for further philosophical developments.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      Given this situation, it his hardly surprising that until recently the only works of Reinhold familiar even to most scholars—with a few minor exceptions—were the *Letters on the Kantian Philosophy* and the three, above-mentioned volumes in which he expounded his Elementary Philosophy. This, however, is unfortunate, inasmuch as these texts represent only a small fraction of Reinhold’s literary output and do not include some of his most original ideas, projects, and literary productions, such as his final writings on philosophy and language and his pioneering, lifelong efforts to get philosophers to take seriously the history of their own discipline and to understand the “history of philosophy” philosophically.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      This situation has begun to change, however. In 1998 Reinhold’s philosophy was the subject of an international academic conference—the first such conference ever to be devoted to Reinhold—in Bad Homburg, Germany. The second international Reinhold conference was held in Luzern, Switzerland in 2002; the third, in Rome, Italy in 2004; the fourth in Montreal, Canada in 2007; the fifth in Siegen, Germany in 2010; and the sixth in Kiel, Germany in 2017. This renewed scholarly interest has been accompanied by significant editorial activity. The first critical edition of Reinhold’s complete works, *Karl Leonhard Reinhold: Gesammelte Schriften*, was inaugurated in 2007. Furthermore, the critical edition of Reinhold’s voluminous and important philosophical correspondence, *Karl Leonhard Reinhold: Korrespondenzausgabe*, has resumed regular output since 2007, after a 25-year hiatus. Newly edited editions of some of Reinhold’s major works have also begun to appear, most notably the two volumes of his *Beyträge zur Berichtigung bisheriger Missverständnisse der Philosophen*, edited by Faustino Fabbianelli, and an edition of *Versuch einer neuen Theorie des menschlichen Vorstellungsvermögen*, edited by Ernst-Otto Onnasch, all issued in the “Philosophische Bibliothek” series published by Felix Meiner. Also worth mentioning is Alexander von Schönborn’s annotated bibliography of Reinhold’s writings, a fine example of scholarly detective work and an essential tool for further research.
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Appreciation and discussion of Reinhold among Anglophone readers can be expected to spread more widely as more of Reinhold’s writings become available in English. Recently, several partial translations of works by Reinhold have appeared: one, by George di Giovanni, of excerpts from the *Fundament*; another, by Sabine Rohr, of portions of the *Verhandlung über die Grundbegriffe und Grundsätze der Moralität aus dem Gesichtspunke des gemeinen und gesunden Verstandes*; and two, by Jörg Noller and John Walsh, of excerpts from the *Beyträge II* and *Vermischter Schriften II* relevant to the post-Kantian debate on free will. In 2005 a fine translation of the first series of Reinhold’s “Letters on the Kantian Philosophy,” translated by James Hebbeler and edited by Karl Ameriks, was published in the series of “Cambridge Texts in the History of Philosophy.” Furthermore, *The Cambridge Reinhold Translations*, a noncomprehensive five-volume translation edition of Reinhold’s works, is currently under contract with Cambridge University Press.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      For many years, the serious secondary literature on Reinhold was very sparse and was dominated by Alfred Klemmt’s monograph (1958). Recent years, however, have seen a resurgence of interest, reflected in several monographs (e.g. Bondeli 1995a; Fabbianelli 2016)[^bondeli-1995a] and a spate of new articles, book chapters, and broader monographic studies engaging with aspects of Reinhold’s philosophy. Influential discussions of Reinhold’s role in the development of post-Kantian philosophy include Beiser (1987), Breazeale (1982), and Franks (2005). In conjunction with and as part of the renaissance of Fichte studies over the past decades, there have been numerous efforts to reexamine the relationship between Reinhold and Fichte, and, in particular, to reassess the precise debt of the *Wissenschaftslehre* to the Elementary Philosophy (e.g. Messina 2011; Neuhauser 1990; Walsh 2023; Ware 2020)[^messina-2011][^walsh-2023][^ware-2020]. Moreover, Reinhold’ relationship to Schiller (Bondeli 2020; Fabbianelli 2026; Roehr 2003)[^bondeli-2020][^roehr-2003], Schelling (Ahlers 2006; Frketich 2023; Gardner 2017; Kosch 2006; Radrizzani 2023; Stolzenberg 2004)[^ahlers-2006][^frketich-2023][^gardner-2017][^kosch-2006][^radrizzani-2023][^stolzenberg-2004], and Hegel (Ahlers 2005; Bondeli 1995b; Di Giovanni 2007; Reid 2010; Westerkamp 2010; Westerkamp 2021)[^ahlers-2005][^bondeli-1995b][^giovanni-2007][^reid-2010][^westerkamp-2021] has received sustained scholarly attention.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Beyond his general role in the development of post-Kantian philosophy, Reinhold’s account of free will has generated considerable discussion. Several studies investigate this account within the broader context of the immediate reception of Kant’s theory of freedom (Fabbianelli 2019; Guyer 2024; Noller 2024; Ware 2019; Ware 2023)[^guyer-2024][^noller-2024][^ware-2019][^ware-2023]. Particular aspects of Reinhold’s conception of free will have also garnered considerable interest. One such aspect concerns the constellation of autonomy, imputability, and the scope of freedom, especially whether leeway freedom undermines the binding force of the moral law (Ameriks 2012; Baum 2013; Bojanowski 2023; Fugate 2012; Guyer 2018; Kleingeld 2020)[^ameriks-2012][^baum-2013][^bojanowski-2023][^fugate-2012][^guyer-2018][^kleingeld-2020]. Another concerns the epistemic warrant for the claim that we possess free will: while a number of scholars maintain that Reinhold asserts knowledge of freedom as an immediate fact (Breazeale 2012; Kosch 2006; Ware 2019)[^breazeale-2012][^kosch-2006][^ware-2019], others hold that he predicates such knowledge on consciousness of the moral law (Bondeli 2018; Roehr 1995; Walsh 2020; Walsh 2025)[^bondeli-2018][^roehr-1995][^walsh-2020][^walsh-2025].
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      A further strand of recent scholarship concerns Reinhold’s philosophy of history and his related understanding of the history of philosophy. Ameriks (2006) and Breazeale (2010) highlight the novelty of Reinhold’s historical conception of reason’s needs or interests, with Ameriks identifying Reinhold as the catalyst for the historical turn in modern philosophy. More recently, Reichl (2021) challenges this view, arguing that Reinhold’s conception of history is already anticipated by Kant. Heinz (2004) shows the connection between Reinhold’s conceptions of history and of systematicity in the Elementary Philosophy. While several scholars have noted the connection between Reinhold’s and Hegel’s conceptions of history, a comprehensive study of this connection is still outstanding.
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      There is also a growing body of scholarship on Reinhold’s aesthetics (e.g. Bondeli 2017; Bondeli 2023; Lohmann 2006)[^bondeli-2017][^bondeli-2023][^lohmann-2006], including a monographic study Schmidt (2024). Reinhold’s conception of aesthetics offers particular insight into the eighteenth-century development of the discipline, as it straddles the publication of Kant’s *Critique of the Power of Judgment* and engages with a variety of thinkers both before and after Kant.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Beyond these areas of focus, recent scholarship has examined Reinhold’s accounts of deduction (Lang 2021)[^lang-2021] and of intellectual intuition (Breazeale 2006; Frketich 2024)[^frketich-2024]. The level of scholarship and philosophical acumen on display in all these discussions is very high and augurs well for the future. Indeed, one could argue that the future of Reinhold Studies is brighter today than at any time since Reinhold’s death.
