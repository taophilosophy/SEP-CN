      莱因霍尔德语言哲学——其哲学发展的最后阶段——的一个确定起点，难以判定。据报道，他 1805 年曾谈到一个“新立场”（Ernst Reinhold 1825: 337; cf. Bondeli 1995a: 267）[^bondeli-1995a][^reinhold-1825]；1806 年他出版了《从语言的视角对逻辑的批判[*Attempt at a Critique of Logic from the Perspective of Language*]》。在这部著作中，莱因霍尔德断言思维与语言之间不可或缺的关系——这将成为他成熟的语言哲学著作的标志。然而在这一点上，思维与语言的关系被当作无可否认的，未获进一步展开；1806 年《批判》的大部分篇幅专注于建立逻辑概念的层级。在其 1808 年《在尚不满足的真理探究者的识字课本中的真理认识之基础[*Foundations of the Cognition of Truth in a Primer for Still Dissatisfied Inquirers of this Cognition*]》的序言中，莱因霍尔德看起来与巴尔迪利决裂，这为理性实在论阶段的终结与语言学转向的开始提供了一个方便的标记。然而，其《为哲学科学中普遍语言用法而作的同义词学基础[*Groundwork of a Synonymic for the Universal Use of Language in the Philosophical Sciences*]》（1812）的序言则表明，正是*这一*著作标示着自他拥护理性实在论以来其哲学思想的新方向。无论对莱因霍尔德晚期哲学发展中不同阶段的截然划分有多少困难，有一点是清楚的：语言关切在相当长的时间里吸引了莱因霍尔德的注意，而他把哲学奠基于语言批判的计划，在《同义词学基础》及后续著作中结出果实，包括《从由言语中介的感性与思维能力之间的联系看人类认识能力[*The Human Faculty of Cognition from the Perspective of the Connection, Mediated by Spoken Word, Between Sensibility and the Faculty of Thought*]》（1816）与《古老的问题：真理是什么？[*The Old Question: What is Truth?*]》（1820）。
