      Ever committed to the Enlightenment ideal of making philosophy universally recognizable, Reinhold’s conversion to the *Wissenschaftslehre* was coupled with a missionary zeal to impart its truth (cf. Reinhold to Fichte, 17 February 1797: GA III/2, 50). Nevertheless, there is widespread consensus that Reinhold’s commitment to Fichte’s philosophy was lukewarm at best (e.g. Breazeale 2020; Bondeli 1995a; Bondeli 2020a; Klemmt 1958: 537)[^bondeli-1995a][^bondeli-2020a][^breazeale-2020][^klemmt-1958]. In particular, it is doubtful that Reinhold fully understood the *Wissenschaftslehre*; much of his omnibus review of Fichte’s system evinces only a superficial understanding of it. Furthermore, by 1799 Reinhold adopted a middle position between Fichte and Jacobi. In his *Ueber die Paradoxien* and open letters to J.C. Lavater and Fichte, Reinhold addresses the apparent paradox between the validity of the *Wissenschaftslehre* and the impossibility of grasping its results by means of ordinary understanding (see Breazeale 2020:29ff; di Giovanni 2003)[^breazeale-2020][^giovanni-2003]. He attempts to resolve this tension by prioritizing faith and moral conscience, arguing that philosophy depends on these for its certainty. Yet, this effort to mediate between Fichte and Jacobi was short-lived: by the end of 1799, Reinhold had become enthralled with J.G. Bardili’s logical realism and his relationship with Fichte soon came to an end.
    step1: |-
      莱因霍尔德始终致力于使哲学得到普遍承认的启蒙理想；他皈依*知识学*之时，也带着传递其真理的传教热情（参见 Reinhold to Fichte, 17 February 1797: GA III/2, 50）。然而学界广泛共识是：莱因霍尔德对费希特哲学的忠诚至多是温吞的（如 Breazeale 2020; Bondeli 1995a; Bondeli 2020a; Klemmt 1958: 537）[^bondeli-1995a][^bondeli-2020a][^breazeale-2020][^klemmt-1958]。尤其可疑的是，莱因霍尔德是否真正理解了*知识学*：他评费希特体系的综合性书评，大部分只显示出对该系统的肤浅理解。此外，到 1799 年，莱因霍尔德在费希特与雅可比之间采取了一种中间立场。在其《论悖论》以及致 J.C. 拉瓦特与费希特的公开信中，莱因霍尔德处理了*知识学*的有效性与无法以通常知性把握其结果之间的表面悖论（见 Breazeale 2020: 29ff; di Giovanni 2003）[^breazeale-2020][^giovanni-2003]。他试图通过优先考虑信仰与道德良知来化解这一紧张，论证哲学的确定性依赖于它们。然而，这场在费希特与雅可比之间调停的努力同样短命：到 1799 年底，莱因霍尔德已为 J. G. 巴尔迪利的逻辑实在论所倾倒，他与费希特的关系不久便告终结。
