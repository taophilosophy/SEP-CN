      What then is the “first principle” of the Elementary Philosophy? It is the “Principle of Consciousness,” namely, the proposition that “in consciousness, the subject distinguishes the representation from the subject and the object and relates it to both” (*Beyträge* I, p. 167; 2003: 113). In this proposition, the term “representation” [*Vorstellung*] designates the basic synthetic unity between subject and object, which is constitutive of consciousness; the term “subject” designates the one who “is conscious” of whatever one is conscious of (the “conscious subject” or “subject of consciousness”); and the term “object” designates that “of which” the representation is a representation. Reinhold distinguishes between three senses of “object”: object as *thing* [*Ding*], that to which the representation refers; object as *represented* [*Vorgestelltes*], the intentional object of the representation; object as thing in itself [*Ding an sich*], i.e. considered in abstraction from the representation (*Beyträge I*, p. 171; 2003: 116).
    step1: |-
      那么，元素哲学的“第一原则”是什么？它是“意识命题”，即这样一个命题：“在意识中，主体把表象与主体和客体区分开来，并将其与两者都关联起来”（*Beyträge* I, p. 167; 2003: 113）。在这一命题中，“表象”［*Vorstellung*］一词标示主体与客体之间的基本综合统一，它是意识的构成性要素；“主体”一词标示“意识到”其所意识之物的那个东西（“意识主体”或“意识的主体”）；“客体”一词标示表象“所关于”的那个东西。莱因霍尔德区分“客体”的三种意义：作为*物*［*Ding*］的客体，即表象所指向的东西；作为*被表象者*［*Vorgestelltes*］的客体，即表象的意向对象；作为物自体［*Ding an sich*］的客体，即抽离于表象而被考虑的客体（*Beyträge I*, p. 171; 2003: 116）。
