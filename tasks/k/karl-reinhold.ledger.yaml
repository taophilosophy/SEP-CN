      莱因霍尔德对系统性所做探究与第一原则研究的影响，施及整整一代哲学家，怎么夸大都不为过。尽管晚近关于莱因霍尔德与 1780 年代末“耶拿圈子”的一些研究，强调了莱因霍尔德本人很快便对“从单一原则出发的哲学”这一计划产生怀疑的程度（见迪特尔·亨利希及其学生如马尔切洛·施塔姆的工作），这一计划仍然得到费希特与青年谢林的热情拥抱，并启发了其他人——最著名的是黑格尔——去重新检视（并质疑）系统形式与自明第一原则之间所谓的联系。尽管莱因霍尔德后来对自己的元素哲学有所保留，元素哲学仍然是欧洲哲学史上一个彻底的“基础主义”计划最清晰的例证之一。
