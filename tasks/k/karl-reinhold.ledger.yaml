    source: |-
      Karl Leonhard Reinhold was born in Vienna October 26, 1757 (though many older sources erroneously give 1758 as his year of his birth). He studied at the Jesuit Seminary in Vienna for a year, until the order was suppressed in 1773, at which time he entered the Barnabite seminary. Following his ordination, he became a Barnabite monk and served for several years as a parish priest and teacher of philosophy. Reinhold’s first publications were book reviews and short essays in popular journals, in which he showed himself to be a zealous advocate of Josephite reforms and an enthusiastic exponent of radical Enlightenment and religious toleration.
    step1: |-
      卡尔·莱昂哈德·莱因霍尔德 1757 年 10 月 26 日生于维也纳（许多较早的资料误把 1758 年当作其出生年）。他在维也纳的耶稣会神学院学习了一年，直至 1773 年该会被取缔，那时他进入巴尔纳伯会神学院。晋铎之后，他成为巴尔纳伯会修士，并作为堂区神父与哲学教师服务了数年。莱因霍尔德最早的出版物是大众期刊上的书评与短论，在其中他表明自己是约瑟夫改革的热情拥护者、激进启蒙与宗教宽容的热心鼓吹者。
    step2: |-
      卡尔·莱昂哈德·莱因霍尔德 1757 年 10 月 26 日生于维也纳（许多较早的资料误以其出生年为 1758 年）。他在维也纳的耶稣会神学院就读一年，1773 年该会被取缔后转入巴尔纳伯会神学院。晋铎后他成为巴尔纳伯会修士，以堂区神父与哲学教师的身份服务数年。莱因霍尔德最早的出版物是大众期刊上的书评与短论：在其中，他表明自己是约瑟夫改革的热情拥护者，也是激进启蒙与宗教宽容的热心鼓吹者。
  - id: 4
    kind: body
    source: |-
      In 1783 Reinhold moved to Leipzig and converted to Protestantism. He also became a Freemason and a member of the *Illuminati*, and he remained an active Freemason until the end of his life. Possessed of a restless, inquiring spirit, Reinhold’s early intellectual trajectory led him from orthodox Catholicism, to reformed Catholicism, to materialism and atheism, and then to Leibnizianism and to Humean skepticism. Yet he always remained true to the ideal of “Enlightenment,” at least as he understood that ideal, and he never ceased to insist that philosophy ought to make a practical difference in the world. For all of his forays into the most technical and arcane philosophical debates and issues, he never wavered in his insistence that true “popularity” must remain the goal of philosophy, and that the ultimate test of any system is its capacity for convincing everyone of its truth. Enlightenment, for Reinhold, was no abstract pursuit of truth, but a program of religious, moral, social, and political reform. Coupled with this commitment to popularity, was a pedagogic zeal to do everything in his power to spread the message of popular Enlightenment—whether in its materialist, its neo-Leibnizian, its skeptical, its Kantian, its Fichtean, its Bardilian, or its distinctively “Reinholdian” form—as widely and as effectively as possible.
    step1: |-
      1783 年莱因霍尔德迁居莱比锡并改宗新教。他还成为共济会员与*光明会*成员，并且终生都是活跃的共济会员。莱因霍尔德精神不安分、好探究，其早期智识轨迹把他从正统天主教带到改革派天主教，再到唯物论与无神论，然后是莱布尼茨主义与休谟式怀疑论。然而他始终忠于“启蒙”的理想——至少照他对这一理想的理解——并且从未停止坚持：哲学应当对世界产生实际的改变。尽管他多次涉足最技术性、最晦涩的哲学争论与问题，他从未动摇过自己的坚持：真正的“通俗性”必须始终是哲学的目标，而任何体系的最终检验标准是其让每个人都信服其真理的能力。对莱因霍尔德而言，启蒙不是对真理的抽象追求，而是一项宗教、道德、社会与政治改革的纲领。与这一对通俗性的执着相伴的，是一种教学的热情：竭尽全力，把大众启蒙的讯息——无论其唯物论的、新莱布尼茨式的、怀疑论的、康德式的、费希特式的、巴尔迪利式的，还是独具一格的“莱因霍尔德式”形态——尽可能广泛而有效地传播出去。
