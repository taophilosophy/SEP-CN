      随着莱因霍尔德更多的著作有了英译，英语读者对他的欣赏与讨论可望传播得更广。近来已出现几种莱因霍尔德著作的部分译本：其一为乔治·迪·乔瓦尼译《基础》选段；其二为萨宾娜·罗尔译《从常识的立场论道德性的基本概念与原则》选段；还有两种为约尔格·诺勒与约翰·沃尔什译《补遗 II》与《杂文集选 II》中与后康德自由意志论战相关的选段。2005 年，由詹姆斯·赫贝勒翻译、卡尔·阿默里克斯编辑的莱因霍尔德第一辑《关于康德哲学的书信》的优秀译本，在“剑桥哲学史文本”丛书中出版。此外，《剑桥莱因霍尔德译丛》——一套非完备的五卷本莱因霍尔德著作翻译——目前正与剑桥大学出版社签约中。
