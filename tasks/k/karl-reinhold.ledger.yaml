      晚近学术研究的另一条线索，关乎莱因霍尔德的历史哲学及其对哲学史的相关理解。阿默里克斯（2006）与布雷泽尔（2010）突出了莱因霍尔德关于理性之需要或利益的历史性构想的独创性：阿默里克斯认定莱因霍尔德是现代哲学历史转向的催化剂。更近，赖希尔（2021）挑战了这一观点，论证莱因霍尔德的历史构想已为康德所预见。海因茨（2004）则表明莱因霍尔德的历史构想与元素哲学中的系统性构想之间的联系。虽有几位学者注意到莱因霍尔德与黑格尔历史构想之间的联系，对这一联系的全面研究仍付阙如。
