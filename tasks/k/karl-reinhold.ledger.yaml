      By far the most original and influential portion of the Elementary Philosophy is its first part, the Theory of Representation, which is devoted entirely to an analysis of the fundamental faculty of the mind—the faculty of representation itself [*Vorstellungsvermögen*]—in an effort to determine “everything that can be known a priori concerning the representations of sensibility, understanding, and reason.” This foundational portion of the Elementary Philosophy thus purports to provide a thorough and complete analysis of the necessary features of representation *qua* representation, an analysis that claims to show “that *space, time*, the *twelve categories*, and the *three forms of the ideas* are *originally* nothing but properties of *mere representations*” (*Fundament*, pp. 72–73; *RGS* 4, 47). This same analysis of our faculty of representation also claims to establish the distinction between the form and content of representations, the necessity of both receptivity and spontaneity on the part of the faculty of representation, the necessary multiplicity of sensations, and the unknowability of things in themselves.
    step1: |-
      元素哲学迄今最具原创性与影响的部分，是它的第一部分——表象理论。它完全致力于分析心灵的根基能力——表象能力本身［*Vorstellungsvermögen*］，力求确定“关于感性、知性与理性的表象所能先天知道的一切”。元素哲学的这一根基性部分，因而意在提供对表象*作为*表象之必然特征的透彻而完整的分析——一个声称表明“*空间*、*时间*、*十二范畴*与*理念的三个形式* *原本*不外是*单纯表象*的属性”的分析（*Fundament*, pp. 72–73; *RGS* 4, 47）。对我们表象能力的同一分析还声称确立：表象的形式与内容之分；表象能力方面感受性与自发性的必然性；感觉的必然杂多；以及物自体的不可知性。
