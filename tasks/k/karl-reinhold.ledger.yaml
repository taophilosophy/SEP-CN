      A definitive starting point for Reinhold’s philosophy of language, the final phase of his philosophical development, is difficult to determine. He is reported to have spoken of a “new standpoint” in 1805 (Ernst Reinhold 1825: 337; cf. Bondeli 1995a: 267)[^bondeli-1995a][^reinhold-1825], and in 1806 he published *Versuch einer Critik der Logik aus dem Gesichtspunkt der Sprache* [*Attempt at a Critique of Logic from the Perspective of Language*]. In this work, Reinhold asserts the indispensable relationship between thought and language, which would become a hallmark of his mature works in philosophy of language. However, at this point, the relationship between thought and language is assumed to be undeniable and is not further developed, with the bulk of the 1806 *Critik* focusing on establishing a hierarchy of logical concepts. Reinhold appears to break with Bardili in the preface to his 1808 *Die Anfangsgründe der Erkenntnis der Wahrheit in einer Fibel für noch unbefriedigte Forscher nach dieser Erkenntnis* [*Foundations of the Cognition of Truth in a Primer for Still Dissatisfied Inquirers of this Cognition*], making this a convenient marker for the end of Reinhold’s phase of rational realism and the beginning of his linguistic turn. Yet, the preface to his *Grundlegung einer Synonymik für den allgemeinen Sprachgebrauch in den philosophischen Wissenschaften* [*Groundwork of a Synonymic for the Universal Use of Language in the Philosophical Sciences*] (1812) suggests that *this* work signals a new direction in his philosophical thought since his endorsement of rational realism. Whatever difficulties there might be in sharply categorizing distinct phases of Reinhold’s late philosophical development, so much is clear: linguistic concerns garnered Reinhold’s attention for some time and his project of basing philosophy on a critique of language comes to fruition in the *Grundlegung einer Synonymik* and subsequent works, including *Das menschliche Erkenntnißvermögen aus dem Gesichtspunkt des durch die Wortsprache vermittelten Zusammenhang zwischen der Sinnlichkeit und dem Denkvermögen* [*The Human Faculty of Cognition from the Perspective of the Connection, Mediated by Spoken Word, Between Sensibility and the Faculty of Thought*] (1816) and *Die Alte Frage: Was ist die Wahrheit?* [*The Old Question: What is Truth?*] (1820).
