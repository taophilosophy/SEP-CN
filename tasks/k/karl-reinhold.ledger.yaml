      Rational realism can be conceived of as a kind of ontological logic insofar as the logical laws of thought are constitutive of nature. It foregrounds the concept of thinking *qua* thinking (*Denken als Denken*). Thinking *qua* thinking is not to be understood representationally as involving the relation between subject and object, but as an original unity of thought and being. The principle of thinking *qua* thinking is expressed formally as “A as A in A and through A.” This principle indicates the essence, or “inner character,” of thinking *qua* thinking, namely “eternally absolute identity” (*BzÜ* 1, p. 108–109). Absolute identity excludes all distinguishability, distinction, and difference. For this reason, the essence of thinking *qua* thinking cannot consist in concepts, judgments, or inferences, and cannot admit of categorial determinations of quantity, quality, relation, or modality. These hold only for the *application* of thinking *qua* thinking to some matter. This matter is not derived directly from the principle of thinking *qua* thinking but is postulated (*BzÜ* 1, p. 111), since it is the condition of something being thought (*BzÜ* 2, p. 182f; Bardili 1800: 67). Formally, matter is represented as C, which, in relation to *reality* (B) and *possibility* (–B), yields a determinate object (b). These terms are—somewhat obscurely—employed in various mathematical operations (addition, multiplication, division) to derive the forms of intuition, the essence of a “thing *qua* thing,” the essence of judgment, organisms, life, and the categories of *substance*, *cause*, and *ground* (*BzÜ* 2, pp. 182–199). For Reinhold, the manifestation of pure thinking in nature is to be conceived of theologically: at bottom, rational realism represents “the *manifestation of the original being in the essence* of things, or the revelation of God in nature” (*BzÜ* 4, p. 219; for discussion of rational realism’s Neo-Platonist and religious overtones, see Ahlers 2012)[^ahlers-2012].
    step1: |-
      理性实在论可以被构想为一种存在论的逻辑，因为思维的逻辑法则构成着自然。它把“作为思维的思维”（*Denken als Denken*）的概念推到前台。作为思维的思维，不能以表象方式被理解为涉及主体与客体的关系，而要被理解为思维与存在的原初统一。作为思维的思维的原则，被形式地表述为“A 作为 A 在 A 中并通过 A”。这一原则标示作为思维的思维的本质或“内在品格”，即“永恒绝对同一”（*BzÜ* 1, p. 108–109）。绝对同一排除一切可分辨性、区分与差异。因此，作为思维的思维的本质不能在于概念、判断或推理，也不能容许量、质、关系或模态的范畴规定。这些只适用于作为思维的的思维向某种质料的应用。这一质料并非直接从作为思维的思维的原则推导而来，而是被设定（*BzÜ* 1, p. 111），因为它是某物被思考的条件（*BzÜ* 2, p. 182f; Bardili 1800: 67）。形式上，质料被表象为 C，它相对于*实在*（B）与*可能*（–B）而产生一个规定对象（b）。这些术语——有些晦涩地——被用于各种数学运算（加法、乘法、除法），以导出直观形式、“作为物的物”的本质、判断的本质、有机体、生命，以及*实体*、*原因*与*根据*诸范畴（*BzÜ* 2, pp. 182–199）。对莱因霍尔德而言，纯粹思维在自然中的显现要被神学地构想：归根结底，理性实在论表象“原初存在者在诸物之*本质*中的显现，或上帝在自然中的启示”（*BzÜ* 4, p. 219；关于理性实在论的新柏拉图主义与宗教色彩，见 Ahlers 2012）[^ahlers-2012]。
