      照莱因霍尔德的看法，系统形式的根本标志是一致性与完备性，但吸引他最多注意的是前者。要确定任何两个命题彼此真正一致——从而判定若干哲学命题是否实际构成一个“系统”——唯一的办法，是表明它们全都可以追溯到同一条第一原则或根基［*Grundsatz*］。而要表明它们确实可以“追溯”到这样一条第一原则，唯一的办法是实际地从它“推导”出它们。（尽管莱因霍尔德努力澄清这一点，他的哲学“推导”概念——它显然不能被理解为简单的逻辑演绎——仍然异乎寻常地含混。）
