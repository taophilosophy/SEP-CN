      However, Kant’s position concerning perception, understood in terms of conscious sensory representation, is complicated by various remarks he makes concerning non-human animal (hereafter “animal”) consciousness. For example, in various descriptions of the “ladder” of cognition in the logic lectures, Kant allows that animals have representations with consciousness and consciously discriminate between objects on that basis. Moreover, Kant allows for such representational capacities in animals even though, lacking an intellect, animals thereby fail to have any capacity for cognition (at least in its narrow sense), understanding, or comprehension (*Jäsche Logik* 9:64–5; see also *Dohna-Wundlacken Logik* (c. 1792) 24:730–1; *Wiener Logik* (1780) 24:846; *Blomberg Logik* (c. 1771) 24:132–3, 134–5, 136). Kant also says of animals that they may be conscious of individual representations, while lacking any consciousness of the “unity” of those representations (letter to Herz, 26 May 1789, C 11:52). Such texts suggest that animals are conscious of their representations but lack any *self*-consciousness with respect to those representations (Paton 1936: 332–5; Naragon 1990; Ameriks 2000: ch. 7; Allais 2009; McLear 2011; Tolley 2016a; Golob 2020)[^allais-2009][^ameriks-2000][^golob-2020][^mclear-2011][^naragon-1990][^paton-1936][^tolley-2016a]. Moreover, Kant’s description of consciousness as necessary for making distinctions, and as coming in degrees (B414–15), also suggests that animals must be conscious of their representations to a degree sufficient for explaining how they make the distinctions between objects in their environment that they obviously do. However, interpreting these texts, and the significance of Kant’s remarks on animals, remains contested (Kemp Smith 1918 [2003: lii–liv]; Grüne 2014b: §2; Fisher 2017; Land 2018; Leland 2018a,b;; Callanan 2020)[^callanan-2020][^callanan-2020-2][^fisher-2017][^grüne-2014b][^kemp-1918][^land-2018][^leland-2018a]. Thus it remains contested as to whether perception, in Kant’s sense, is possible without intellectual capacities involving conceptual representation.
    step1: |-
      然而，若把知觉理解为有意识的感性表象，康德关于非人动物（以下简称“动物”）意识的种种评论就使他的立场复杂起来。例如，在逻辑学讲演中对认识“阶梯”的各种描述里，康德容许动物拥有有意识的表象，并据此有意识地区分对象。此外，康德容许动物具有此类表象能力，尽管动物缺乏知性，因而没有任何认识（至少狭义上）、知性或统摄的能力（《耶舍逻辑》9:64–5；亦见《多纳—冯德拉克逻辑学》（约 1792）24:730–1；《维也纳逻辑学》（1780）24:846；《布隆贝格逻辑学》（约 1771）24:132–3, 134–5, 136）。康德还说，动物可以意识到个别的表象，却缺乏对这些表象之“统一性”的任何意识（致赫茨书，1789 年 5 月 26 日，C 11:52）。此类文本提示：动物意识到其表象，但对这些表象缺乏任何*自我*意识（Paton 1936: 332–5; Naragon 1990; Ameriks 2000: ch. 7; Allais 2009; McLear 2011; Tolley 2016a; Golob 2020）[^allais-2009][^ameriks-2000][^golob-2020][^mclear-2011][^naragon-1990][^paton-1936][^tolley-2016a]。此外，康德把意识描述为作出区分所必需、且有程度之分（B414–15），这也提示动物对其表象的意识程度，必足以解释它们显然能对环境中对象作出区分。然而，如何解释这些文本以及康德论动物之评论的意义，仍有争议（Kemp Smith 1918 [2003: lii–liv]; Grüne 2014b: §2; Fisher 2017; Land 2018; Leland 2018a,b; Callanan 2020）[^callanan-2020][^callanan-2020-2][^fisher-2017][^grüne-2014b][^kemp-1918][^land-2018][^leland-2018a]。因此，康德意义上的知觉能否在没有涉及概念表象的理智能力的情况下成立，仍有争议。
    step2: |-
      然而，若把知觉理解为有意识的感性表象，康德关于非人动物（下称“动物”）意识的种种说法就令其立场复杂化。例如，逻辑学讲稿在描述认识“阶梯”时，容许动物拥有有意识的表象，并据此有意识地区分对象。康德甚至容许动物具此表象能力，尽管动物无知性，因而没有认识（至少狭义）、知性或统摄的能力（《耶舍逻辑》9:64–5；又见《多纳—冯德拉克逻辑学》（约 1792）24:730–1、《维也纳逻辑学》（1780）24:846、《布隆贝格逻辑学》（约 1771）24:132–3, 134–5, 136）。康德还说，动物可意识到个别表象，却对这些表象的“统一性”毫无意识（致赫茨，1789 年 5 月 26 日，C 11:52）。这类文本暗示：动物意识到其表象，却对这些表象没有*自我*意识（Paton 1936: 332–5; Naragon 1990; Ameriks 2000: ch. 7; Allais 2009; McLear 2011; Tolley 2016a; Golob 2020）[^allais-2009][^ameriks-2000][^golob-2020][^mclear-2011][^naragon-1990][^paton-1936][^tolley-2016a]。再者，康德说意识是区分之所需，且有程度之别（B414–15），这也暗示动物对其表象的意识程度足以解释它们确实能区分环境中的对象。但如何解读这些文本、康德论动物之说意义何在，仍有争议（Kemp Smith 1918 [2003: lii–liv]; Grüne 2014b: §2; Fisher 2017; Land 2018; Leland 2018a,b; Callanan 2020）[^callanan-2020][^callanan-2020-2][^fisher-2017][^grüne-2014b][^kemp-1918][^land-2018][^leland-2018a]。所以，康德意义上的知觉能否无需涉及概念表象的理智能力而成立，仍无定论。
