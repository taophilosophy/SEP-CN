      Perception, like intuition, is also sometimes described as representation of an undetermined object (e.g., B422n). However, perception also involves a consciousness of the “manifold” or “content” (*Inhalt*; more on this notion of “content” below) of the intuition (A99, A119–20, B160, B162, B202–3; Pr 4:300). What Kant means by this is not entirely obvious. However, Kant is clear that perception necessarily requires the activity of the imagination in combining together the content of the intuition into what Kant calls an “image” (*Bild*), which yields or constitutes consciousness of the content of intuition itself (A120, B160; see Sellars 1978; Young 1988; Allison 2015: 254–264; Matherne 2015; Tolley 2019, 2020)[^allison-2015][^matherne-2015][^sellars-1978][^tolley-2019][^young-1988]. Kant also indicates that in perception the “mathematical” categories of quality and quantity are employed, though not the relational or modal categories, which are constitutive of experience only (A161–2/B201; see Allison 2015: 414–426)[^allison-2015].
    step1: |-
      知觉与直观一样，有时也被描述为对未被规定对象的表象（例如 B422n）。然而，知觉还涉及对直观的“杂多”或“内容”（*Inhalt*；关于“内容”这一观念详见下文）的意识（A99, A119–20, B160, B162, B202–3; Pr 4:300）。康德此意并不全然显然。不过康德清楚，知觉必然要求想象力把直观的内容结合为康德所谓“图像”（*Bild*），从而产生或构成对直观内容本身的意识（A120, B160; 见 Sellars 1978; Young 1988; Allison 2015: 254–264; Matherne 2015; Tolley 2019, 2020）[^allison-2015][^matherne-2015][^sellars-1978][^tolley-2019][^young-1988]。康德还指出，在知觉中，质与量这些“数学的”范畴被使用，而关系范畴或模态范畴则不然——后者只对经验有构成作用（A161–2/B201; 见 Allison 2015: 414–426）[^allison-2015]。
    step2: |-
      知觉同直观一样，有时也被说成对未被规定对象的表象（如 B422n）。但知觉还包含对直观“杂多”或“内容”（*Inhalt*；下详）的意识（A99、A119–20、B160、B162、B202–3；Pr 4:300）。此意并不全然明白。不过康德说得很清楚：知觉必赖想象力把直观内容结合为所谓“图像”（*Bild*），由此产生或构成对直观内容本身的意识（A120、B160；见 Sellars 1978; Young 1988; Allison 2015: 254–264; Matherne 2015; Tolley 2019, 2020）[^allison-2015][^matherne-2015][^sellars-1978][^tolley-2019][^young-1988]。康德还指出，知觉用及质、量这些“数学的”范畴，却不用关系范畴与模态范畴——后者只对经验有构成作用（A161–2/B201；见 Allison 2015: 414–426）[^allison-2015]。
