      Hence, the debate over the relation between intuition and concept is of significant historical and philosophical interest for at least two reasons. First, because it promises to provide answers to central questions in Kant’s conception of experience, such as those concerning the *acquisition* of the content of thought and the *warrant* for holding such thoughts as true. Second, because it serves as proxy for a related, and perhaps even more fundamental, dispute concerning Kant’s conception of the nature of rationality and its manifestation in animal life, particularly insofar as rationality is conceived as requiring sensitivity to norms or reasons as such (McDowell 2009, 2010; Korsgaard 2011: §6)[^korsgaard-2011][^mcdowell-2009].
    step1: |-
      因此，关于直观与概念之关系的争论，至少在两个理由上具有重大的历史与哲学意义。第一，因为它有望回答康德经验构想中的核心问题，例如关于思想内容的*获得*，以及把此类思想视为真的*根据*。第二，因为它充当一场相关、或许更为根本的争论的代理：康德关于理性之本性及其在动物生命中之表现的构想，尤其就理性被设想为要求对规范或理由本身的敏感而言（McDowell 2009, 2010; Korsgaard 2011: §6）[^korsgaard-2011][^mcdowell-2009]。
    step2: |-
      可见，直观与概念之争至少有两重历史与哲学意义。其一，它有望回答康德经验学说中的核心问题，比如思想内容如何*获得*、又凭什么*有理由*被视为真。其二，它是一场更根本之争的代理：康德如何理解理性的本性及其在动物生命中的显现，尤其当理性被设想为要求对规范或理由本身的敏感时（McDowell 2009, 2010; Korsgaard 2011: §6）[^korsgaard-2011][^mcdowell-2009]。
