      ### 3.3 Concepts and Correctness Conditions
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      Conceptualism states that concepts or conceptual synthesis determine the cognitive relation an intuition has to its object. How should we understand this notion of a ‘cognitive relation’ to the object? Conceptualism typically understands this in terms of the correctness conditions possessed by the intuition and in virtue of which the intuition represents a (putatively) mind-independent object and its properties (Sellars 1968: ch. 1; McDowell 1996; Ginsborg 2008)[^ginsborg-2008][^mcdowell-1996][^sellars-1968]. This constitutes the attribution to Kant, in more or less explicit terms, of what is now called the ‘Content View’, which, in contemporary terms, understands perceptual experience to present or convey information about a subject’s environment to the subject of that experience in virtue of the experience’s having content (Siegel 2010: §1; 2011: ch. 2). Thus, according to the Content View, part of what it is for a mental state to count as an *objective* experience is that it can be evaluated for its correctness, and the conditions of its correctness are determined by its content.
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      It is important that the content attributed to a sensory state by the Content View requires more than the state’s merely being non-arbitrarily *associated* with a representational content. For one might plausibly agree that there are non-arbitrary conditions for associating experiences with particular correctness conditions, without thereby thinking that experience is something that is had in virtue of a relation to a content that sets such a correctness condition. It is this ‘in virtue of’ claim that I take to be the distinctive claim of the Content View.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      What does it mean to say that a sensory experience has ‘content’ in the sense relevant to the Content View? Contemporary philosophy typically construes the phrase “mental content” as referring to that thing which fulfills a certain set of functional roles—namely, it is that which (i) may be the object of different cognitive states within the same subject (e.g., of belief and desire), (ii) which may be the object of the same (or a different) cognitive state in other subjects (e.g., that you and I might be able to believe the same thing and thus communicate), and (iii) which has veridicality conditions (e.g., that which you and I both believe is true or both perceive correctly) (see, e.g., Frege 1956; McGinn 1982; Searle 1983; Fodor 1987; Peacocke 1992; McDowell 1996; Heck 2000, 2007; Byrne 2005; McGrath 2005 [2014]; Hanks 2009; Chalmers 2011)[^byrne-2005][^chalmers-2011][^fodor-1987][^frege-1956][^hanks-2009][^heck-2000][^mcdowell-1996][^mcginn-1982][^mcgrath-2005][^peacocke-1992][^searle-1983].
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Typically, when contemporary philosophers ask about the content of a mental state, they are asking about something which is supposed to fulfil these three roles. The traditional satisfier for this functional specification is an abstract entity—a proposition. According to this propositionalist view such a proposition can be the object of different attitudes –– e.g., I might both see *that there is snow on Mt Washington* and (thereby) believe *that there is snow on Mt Washington*. Moreover, I may see *that there is snow on Mt Washington*, and the contents of my visual experiences may well be accurate. In any case, whether the satisfier of these functional roles for mental content is a proposition or something else, it must be the kind of thing to which a mental state can be related, and in virtue of which a sensory state counts as an experience of something (typically, something in the experiencer’s environment).
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Sticking with the propositional notion of content, for simplicity, we can also note the different kinds of “vehicles” through which that content can be conveyed. For example a particular token sentence “There is snow on Mt. Washington” conveys the content *there is snow on Mt. Washington*. But there may be other vehicles for such content as well, including mental vehicles, such as the act of judging that *there is snow on Mt. Washington*, or the event of seeing that *there is snow on Mt. Washington*. For the purposes of our toy example, all of these different vehicles convey the same abstract propositional content, which sets the correctness conditions for each instance.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Hence, in asking whether it is correct to understand Kant as endorsing the Content View, we first need to know whether it is even coherent to ascribe to him a notion of “content”, conceptual or not (and irrespective of whether he would use the corresponding German word “*Inhalt*” for this notion), in the terms set out above.
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      It seems highly plausible that Kant did accept the existence of content as it is functionally specified above. This is his notion of a “judgment” (*Urteil*). The vehicles for judgment are mental states—“representations” (*Vorstellungen*). Judgments (or equivalently for Kant, thoughts) are the product of “relating” representations, in the act of judging, in one consciousness (Prol §22, 4:304; cf. JL §17, 9:101; V-Lo/Wiener, 24:928)
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      In addition to serving as the content of psychological vehicles (i.e., mental states) and the bearers of truth, Kant also considers judgements to be the objects of different epistemic attitudes. For example, he distinguishes between varieties of “holding-for-true” or “assent” (*Fürwahrhalten*) in the Canon of Pure Reason at the end of the First *Critique* (A820/B848; see Stevenson 2003; Chignell 2007b; Pasternack 2014)[^chignell-2007b][^pasternack-2014][^stevenson-2003].
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Hence, Kant seems to acknowledge the existence of content in the relevant sense. There is something—judgement—that is carried or expressed by psychological states, which can be the object of different epistemic attitudes, and which is the bearer of truth and falsity. Furthermore, since judgements are constituted by concepts, Kant obviously accepts that at least some mental states—i.e., acts of judging—have conceptual content.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      The next question is whether Kant allows that any other mental state is *also* a bearer of conceptual ‘content’ in the relevant sense. Plausibly, Kant’s conception of ‘*experience*’ (*Erfahrung*), insofar as this is a mental state, possesses conceptual content in some sense. Since Kant often characterizes experience as a complex state consisting of both intuition and judgment, it may be that experience possesses conceptual content simply in virtue of being partly constituted by a conceptual judgment. It is somewhat less clear, given the discussion above, whether there is conceptual content in what Kant calls “perception” (*Wahrnehmung*). But since intuition is the primary locus of the contemporary debate, our question here is whether the Content View is true of intuition.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Some advocates of Conceptualism (e.g., McDowell 1996, 1998; Ginsborg 2006b; Grüne 2009: 53–71)[^ginsborg-2006b][^grüne-2009][^mcdowell-1996] think that it is at least partially constitutive of intuition that it have correctness conditions. However, this view is also shared by nonconceptualist interpreters (e.g., Hanna 2005)[^hanna-2005]. In this way, both Conceptualism and Nonconceptualism typically agree that an intuition’s cognitive relation to an object depends on correctness conditions constituting its ‘content’ (in the contemporary sense), but disagree as to whether that content is conceptual.But, if Kant rejects the Content View, and so rejects the claim that it is in virtue of having content that intuition counts as related to an object, a central means for framing the dispute between Conceptualism and Nonconceptualism’s understanding of intuition is undermined.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Why think that Kant rejects the Content View? McLear (2016b) provides three arguments against the applicability of the Content View to Kant’s conception of intuition:
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      1. Kant denies that illusion/hallucination is to be explained by appeal to veridicality conditions of intuitive representation.
      2. Kant holds that a state’s possession of correctness conditions requires combination, which can only occur via acts of the understanding.
      3. Kant’s “modal condition” on cognition requires that sense experience contribute something over and above a correctness condition to the “proof” of the real possibility of a represented object.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      According to the first argument, Kant denies that error due to hallucination or illusion may be traced to misrepresentation by intuition. As Kant says,
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      > truth and illusion are not in the object in so far as it is intuited, but are in the judgment made about the object in so far as it is thought. (A293–4/B350)
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      This would be a surprising thing to say if Kant endorsed the Content View, for one of the central reasons for endorsing the Content View stems from the straightforward manner in which misleading experience (i.e., illusion and hallucination) is explained by erroneous representational content in the experience.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      The second argument points out the connection Kant draws between possession of a correctness condition and combination or synthesis. As Kant says at the beginning of the B-edition of the Transcendental Deduction,
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      > a manifold’s combination as such can never come to us through the senses; nor, therefore, can it already be part of what is contained in the pure form of sensible intuition. (B129–30)
    step1: TBD
    step2: TBD
