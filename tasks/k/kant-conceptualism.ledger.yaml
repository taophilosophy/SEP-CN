      ### 5.7 Imagination, Perception, and Images
    step1: TBD
    step2: TBD
  - id: 151
    kind: body
    source: |-
      Kant famously describes the imagination (*Einbildungskraft*) as a necessary ingredient of perception itself (A120n). This claim has played an important role in several contemporary interpretations of Kant’s theory of experience, in both his sense (Young 1988, 1992; Makkreel 1990; Gibbons 2002; Kneller 2007; Horstmann 2018; Tolley 2019)[^gibbons-2002][^horstmann-2018][^kneller-2007][^makkreel-1990][^tolley-2019][^young-1988] and in our modern English sense (see Strawson 1970; Sellars 1978; Matherne 2015, 2024)[^matherne-2015][^sellars-1978][^strawson-1970].
    step1: TBD
    step2: TBD
  - id: 152
    kind: body
    source: |-
      There are at least three important questions regarding the Imagination that are of particular note with respect to the debate between Intellectualism and Sensibilism. First, how imagination is to be understood as a faculty—i.e., as spontaneous or receptive, as sensory or intellectual (Hanna 2008: 62)[^hanna-2008]. Second, whether imaginative activity is a form of mental activity that does not require synthesis in the “part-to-whole” sense (see especially Waxman 1991, 2014; Land 2014; Williams 2018)[^land-2014][^waxman-1991][^williams-2018]. Third, whether the role of imagination in the formation of images, and the necessary role of such image formation in cognition (A121) indicates a way in which an Intellectualist conception of *perception* (as opposed to intuition) might find a plausible footing (Matherne 2015; Gomes 2017a; Stephenson 2017; Tolley 2019; Matherne 2024)[^gomes-2017a][^matherne-2015][^matherne-2024][^stephenson-2017][^tolley-2019].
    step1: TBD
    step2: TBD
  - id: 153
    kind: body
    source: |-
      Discussion of imagination’s role in perception (in Kant’s sense) and image formation is an area which could stand further attention. In particular, it seems clear that Kant conceives of images as, in some sense, sensory representations. But what kind of sensory representations? Are they intuitions? If so, how do images differ from ‘immediately given’ intuitions? If, as Kant sometimes suggests (e.g., A120–1), image formation is a necessary intermediate stage between given sensory states and constructed intellectual states, how might the structure or content of an image possess features that make it more than a “mere” sensory state, while being nevertheless different from judgment (Tracz 2020)[^tracz-2020]? Moreover, in what sense does image formation require a “schema” and in what sense does such schematization present an intermediary between the sensible and the intellectual? Kant’s notion of a schema is itself much contested, but it seems clearly relevant to the case of perception (Longuenesse 2000; Grüne 2009; Dunlop 2012; Williams 2012; Matherne 2015; Tolley 2019; Matherne 2024)[^dunlop-2012][^grüne-2009][^longuenesse-2000][^matherne-2015][^matherne-2024][^tolley-2019][^williams-2012].
    step1: TBD
    step2: TBD
