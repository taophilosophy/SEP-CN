      One of the central areas of dispute in the reception of Kant’s critical philosophy concerns his distinction between the cognitive faculties of sensibility (*Sinnlichkeit*) and intellect (*Verstand*), and their characteristic representational outputs—viz. intuition (*Anschauung*) and concept (*Begriff*). Though the dispute is multi-faceted, it centers on disagreement concerning the interpretation of Kant’s conception of the contribution made by the higher cognitive faculties (or the “intellect” in the broadest sense of that term) to a subject’s sensory apprehension of the world around it. The status of Kant’s distinction has been repeatedly questioned. In the immediate reception of Kant’s critical philosophy, major works by figures such as Solomon Maimon (*Essay on Transcendental Philosophy*, 1790) and G.W.F. Hegel (*Faith and Knowledge*, 1802) criticized the coherence of construing sensibility and intellect as independent faculties. The issue has also seen significant discussion in the latter half of the twentieth-century by Anglophone philosophers such as P.F. Strawson, Wilfrid Sellars, and John McDowell. Their work takes up Kant’s distinction between intuition and concept as an important vehicle for asking and answering questions regarding the relation between thought and reality. Such questions include both the issue of how thought could be so much as *about* an objective reality (Strawson 1959: ch. 2; McDowell 1994a; Ginsborg 2006b)[^ginsborg-2006b][^mcdowell-1994a][^strawson-1959], and the issue of how sense experiences caused by a subject’s environment could have a normative, rather than merely causal, significance for the subject’s thinking (Sellars 1968; McDowell 1994b)[^mcdowell-1994b][^sellars-1968].
    step1: |-
      在接受康德批判哲学的过程中，一个核心争论领域关乎他对感性（*Sinnlichkeit*）与知性（*Verstand*）这两种认识能力的区分，以及它们各自特有的表象产物——即直观（*Anschauung*）与概念（*Begriff*）。这场争论虽有多面，却集中于一点分歧：如何解释康德关于较高认识能力（或该词最广义上的“知性”）对主体感官把握周围世界所作贡献的构想。康德这一区分的地位屡遭质疑。在康德批判哲学的直接接受中，索洛蒙·迈蒙（《先验哲学论》，1790）与 G.W.F. 黑格尔（《信仰与知识》，1802）等的重要著作，都批评把感性与知性解释为彼此独立的能力有欠融贯。20 世纪后半期，P.F. 斯特劳森、威尔弗里德·塞拉斯与约翰·麦克道尔等英语哲学家也对此有大量讨论。他们的工作把康德直观与概念的区分当作提出并回答思想与实在关系问题的重要载体。这类问题既包括思想如何竟能*关于*一个客观实在（Strawson 1959: ch. 2; McDowell 1994a; Ginsborg 2006b）[^ginsborg-2006b][^mcdowell-1994a][^strawson-1959]，也包括由主体环境引起的感官经验如何能对主体的思想具有规范性、而非单纯因果性的意义（Sellars 1968; McDowell 1994b）[^mcdowell-1994b][^sellars-1968]。
    step2: |-
      在康德批判哲学的接受史上，一个核心争点是他对感性（*Sinnlichkeit*）与知性（*Verstand*）两种认识能力的区分，以及二者特有的表象产物——直观（*Anschauung*）与概念（*Begriff*）。争论面相虽多，焦点却在一处：如何解读康德关于较高认识能力（或最广义的“知性”）对主体感官把握世界所作贡献的看法。这一区分的正当性屡受质疑。在康德哲学最初的接受中，索洛蒙·迈蒙（《先验哲学论》，1790）、G.W.F. 黑格尔（《信仰与知识》，1802）等的重要著作就批评：把感性与知性当作彼此独立的能力，并不融贯。20 世纪后半叶，P.F. 斯特劳森、威尔弗里德·塞拉斯、约翰·麦克道尔等英语哲学家又作了大量讨论。他们借康德直观与概念之别，提出并回答思想与实在的关系问题：思想如何竟能*关于*客观实在（Strawson 1959: ch. 2; McDowell 1994a; Ginsborg 2006b）[^ginsborg-2006b][^mcdowell-1994a][^strawson-1959]；环境引起的感官经验又如何对思想具有规范性、而非仅仅因果性的意义（Sellars 1968; McDowell 1994b）[^mcdowell-1994b][^sellars-1968]。
