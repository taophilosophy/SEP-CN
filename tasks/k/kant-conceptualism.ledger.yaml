    source: |-
      One of the goals of Kant’s critical philosophy is to articulate the conditions of the possibility of what he calls “experience” (*Erfahrung*). As we’ll see below, Kant’s use of the term is rather more technical than is typically meant in English by talk of, e.g., a subject’s “experience” of the color red. Indeed, Kant sometimes speaks of there being only a single or universal experience (A110, A493/B521), which at least strongly suggests that he is not construing experience in a purely subjective or phenomenological manner. Rather, in talking of the conditions of “experience” in this way, Kant is most obviously concerned with the conditions under which objective empirical knowledge (*Wissen*) is possible—including knowledge that Kant thinks we actually have, such as is exemplified in the sciences of mathematics and physics. Kant’s hope is that by articulating the conditions under which such knowledge is possible, he will be able to indicate how it is that metaphysics itself could become a science. He pursues this goal via an examination of those features of the mind relevant to the conditions of “experience” so construed. This amounts to an examination of the conditions for “cognition” (*Erkenntnis*), or as Kant often puts it, the mind’s “relation to an object” (B137). There is some controversy about the best way to understand Kant’s use of this phrase, but for the moment we’ll understand it as involving relation to a possible object of experience, and as being a necessary condition for the positive substantive knowledge characteristic of a proper science (i.e., a *Wissenschaft*).
    step1: |-
      康德批判哲学的目标之一，是阐明他所谓“经验”（*Erfahrung*）之可能性的条件。如下文所见，康德对该词的用法，比英语中通常所谓主体对红色的“经验”要技术化得多。事实上，康德有时说只有唯一的、普遍的经验（A110, A493/B521），这至少强烈暗示他并未以纯粹主观或现象学的方式来解释经验。毋宁说，如此谈论“经验”的条件时，康德显然关心的是客观经验知识（*Wissen*）得以可能的条件——包括康德认为我们实际拥有的知识，例如数学与物理科学中所体现者。康德的希望是：通过阐明此类知识得以可能的条件，他就能指明形而上学本身如何可能成为科学。他通过考察心中与如此解释的“经验”条件相关的那些特征来追求这一目标。这等于考察“认识”（*Erkenntnis*）的条件，或如康德常说的，心的“与对象的关系”（B137）。关于如何最好地理解康德这一短语的用法，尚有一些争议，但暂时我们将把它理解为涉及与一个可能经验对象的关系，并且是作为一门真正科学（即 *Wissenschaft*）所特有的肯定性实质知识的必要条件。
    step2: |-
      康德批判哲学的目标之一，是阐明他所谓“经验”（*Erfahrung*）的可能性条件。下文将见，该词的用法远比英语中“主体对红色的经验”之类说法技术化。康德有时甚至说只有唯一而普遍的经验（A110、A493/B521），这至少强烈暗示：他并不在纯粹主观或现象学的意义上谈经验。他谈“经验”的条件，显然是在问客观经验知识（*Wissen*）如何可能——包括他认为我们实际拥有的知识，如数学、物理学中的知识。康德的希望是：阐明这类知识的可能条件，便能指明形而上学本身如何成为科学。他为此考察心中与“经验”条件相关的特征，也就是考察“认识”（*Erkenntnis*）的条件，或如他常说的，心的“与对象的关系”（B137）。这一短语如何理解尚有争议；暂且把它理解为与可能经验对象的关系，且是真正科学（*Wissenschaft*）那种肯定性实质知识的必要条件。
