      按这种关于判断中概念活动的看法，直观中感官材料的概念化应当如何运作？按一种流行解释——我们称之为“判断论”（Land 2015b）[^land-2015b]——直观要求主体作出判断：事情在经验上如此如此（Strawson 1970; Carl 1992: 165）[^carl-1992][^strawson-1970]。然而，这种康德解读会产生一些直截了当的问题（Grüne 2009: §2.2; Land 2015b）[^grüne-2009][^land-2015b]。第一，康德的判断概念似乎要求谓述（在这个意义上，概念是可能判断的谓词）。然而，由概念施行的感性综合似乎并不等同于作出判断；毋宁说，康德心中所想的似乎是某种类似感官图像之形成的东西（例如 B154, B162）。事实上，康德在 1791 年的一封信中明确否认直观是通过判断行为、或相关地通过把直观归摄于概念而与对象相关的（C 11:311）。第二，康德强调有两种截然不同的综合——“智性”综合生成概念性判断，“形象”综合生成经验（康德意义上的“经验”；见 B151）。若判断论是对的，就很难看出康德如何能维持综合种类之间的这种区分。第三，判断论解释至少有表面的循环性：它把概念性判断视为直观生成的必要条件，而康德关于概念形成的说明却把一切概念（甚至先天范畴）视为反思的结果，而反思本身又预设感官直观（Ginsborg 2006b; Grüne 2009; Anderson 2015: ch. 13）[^anderson-2015][^ginsborg-2006b][^grüne-2009]。
