      Kant distinguishes between two basic classes of mental processing. The first is association, which is carried out by sensibility, and specifically the imagination (inclusive of memory). Association is primarily a passive process by which the mind comes to connect representations due to the repeated exposure of the subject to certain kinds of regularities. One might (e.g.) associate chicken soup with being ill, because one only ever had chicken soup when one was ill. Association is thus capable of engendering content-sensitive connections between a subject’s mental states, though such connections depend entirely on the local and contingent circumstances in which the subject comes to have such states. This is part of why Kant denies that association could ever account for our ability to represent universality or necessity.
    step1: |-
      康德区分两类基本心理过程。第一类是联想，由感性、尤其是想象力（包括记忆）执行。联想主要是一种被动过程：由于主体反复接触某些规律性，心便把诸表象联系起来。例如，人们可能把鸡汤与生病联想起来，因为自己只在生病时才喝鸡汤。因此，联想能够在主体的诸心理状态之间产生对内容敏感的联系，尽管这类联系完全取决于主体获得这些状态时的局部而偶然的环境。这也是康德否认联想能说明我们表象普遍性或必然性之能力的一部分理由。
    step2: |-
      康德把心理过程分为两大类。第一类是联想，由感性、特别是想象力（含记忆）执行。联想大体是被动的：主体反复遭遇某类规律，心便把相关表象连在一起。比如有人把鸡汤同生病联系起来，只因他每次生病才喝鸡汤。可见联想能在主体诸心理状态间造成对内容敏感的联系，但这种联系全系于主体获得这些状态时的局部偶然环境。这也是康德否认联想足以说明我们表象普遍性或必然性之能力的一个理由。
