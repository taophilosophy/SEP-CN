    source: |-
      At the most basic explanatory level, Kant conceives of the mind as constituted by two different kinds of capacity (*Fähigkeit*), or power (*Vermögen*), which he labels “receptivity” (*Receptivität*) and “spontaneity” (*Spontaneität*). Receptivity, as the name suggests, constitutes the mind’s capacity to be affected, whether by itself (i.e., one “part” or capacity of the mind affecting another) or something else (i.e., something distinct from the mind). For Kant, any exercise of the mind’s receptive power essentially requires some external prompting in order to engage in the production of representations. In contrast, the power of spontaneity needs no such prompting. It is able to initiate its activity from itself, without any external influence.
    step1: |-
      在最基本的解释层面上，康德把心构想为由两类不同能力（*Fähigkeit*）或力量（*Vermögen*）构成，他称之为“接受性”（*Receptivität*）与“自发性”（*Spontaneität*）。接受性，顾名思义，构成心被影响的能力，无论是被自身（即心的某一“部分”或能力影响另一部分）还是被别的东西（即有别于心者）影响。对康德而言，心的接受性力量的任何运用，本质上都需要某种外部触发，才能从事表象的生产。相反，自发性的力量无需这种触发：它能够自行启动其活动，不受任何外部影响。
    step2: |-
      在最基础的解释层次上，康德把心看成由两类能力（*Fähigkeit*）或力量（*Vermögen*）构成，即“接受性”（*Receptivität*）与“自发性”（*Spontaneität*）。接受性，如其名所示，是心受触动而产生表象的能力——无论触动来自心自身（心的一部分或一种能力作用于另一部分），还是来自他物（有别于心者）。在康德看来，接受性力量要运作、要生产表象，本质上总需某种外部引发。自发性则无须这种引发，它能自行发起活动，不受外物左右。
  - id: 7
    kind: body
    source: |-
      Kant thus construes all mental activity either in terms of its resulting from affection (receptivity) or from the mind’s self-prompted activity (spontaneity). From these two very general aspects of the mind Kant then identifies three basic cognitive faculties (*Vermögen*), termed by Kant “sensibility” (*Sinnlichkeit*), “understanding” (*Verstand*), and “reason” (*Vernunft*). These faculties characterize specific cognitive powers, none of which is reducible to any of the others, and to each of which is assigned a particular cognitive task and a specific kind of characteristic representational output. In the case of sensibility the characteristic representations are sensation (*Empfindung*) and intuition (*Anschauung*). In the case of the understanding and reason (or the ‘intellect’ more broadly), concepts (*Begriffe*), judgment (*Urteil*), and inference (*Schluß*).
    step1: |-
      因此，康德把一切心理活动要么解释为出自被触动（接受性），要么解释为出自心的自我发起活动（自发性）。从心的这两个极一般的方面出发，康德进而辨识出三种基本认识能力（*Vermögen*），他称之为“感性”（*Sinnlichkeit*）、“知性”（*Verstand*）与“理性”（*Vernunft*）。这些能力刻画了特定的认识力量，其中任何一种都不可还原为其他任何一种，且各自被指派了特定的认识任务与特定种类的特征性表象产物。就感性而言，其特征性表象是感觉（*Empfindung*）与直观（*Anschauung*）。就知性与理性（或更广义的“知性”）而言，则是概念（*Begriffe*）、判断（*Urteil*）与推理（*Schluß*）。
    step2: |-
      于是，一切心理活动在康德笔下，或出于被触动（接受性），或出于心的自我启动（自发性）。由这两个极一般的方面，康德进而指出三种基本认识能力（*Vermögen*），即“感性”（*Sinnlichkeit*）、“知性”（*Verstand*）、“理性”（*Vernunft*）。三者各管一种特定的认识力量，彼此不可化约，各有其认识任务与特有的表象产物：感性的产物是感觉（*Empfindung*）与直观（*Anschauung*）；知性与理性（或广义的“知性”）的产物则是概念（*Begriffe*）、判断（*Urteil*）与推理（*Schluß*）。
