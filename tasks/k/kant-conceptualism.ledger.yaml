      Synthesis is carried out by the unitary subject of representation on representations that are either given to it in sensibility (i.e., intuition and/or sensation) or produced by it via the intellect (e.g., in an act of judgment). When synthesis is carried out on representations forming the content of a concept or judgment, it is called “intellectual” synthesis; when carried out by the imagination on material provided by sensibility (i.e., on intuition and sensation), it is called “figurative” synthesis (B150–1). In the *Critique of Pure Reason* Kant discusses in some depth the synthesis performed on representations provided by sensibility, and discusses three central kinds of synthesis—viz. apprehension, reproduction (or imagination), and recognition (or conceptualization) (A98–110/B159–61). Though Kant discusses these forms of synthesis in a way that suggests they are discrete types of mental acts, it is also plausible that they always go together (Paton 1936: 271–272; Kemp Smith 1918 [2003: 245–246])[^kemp-1918][^paton-1936], or at least that the first two forms must always occur together, with the third being (perhaps) an optional addition (Brook 1997; Allais 2009)[^allais-2009][^brook-1997].
    step1: |-
      综合由表象的统一主体施行于如下表象：或是感性中给予它的（即直观和/或感觉），或是由它经知性产生的（例如在判断行为中）。当综合施行于构成概念或判断之内容的表象时，称为“智性”综合；当想象力施行于感性所提供的材料（即直观与感觉）时，称为“形象”综合（B150–1）。在《纯粹理性批判》中，康德较深入地讨论了施行于感性所提供表象的综合，并讨论了三种核心的综合——即把握、再生（或想象力）与认定（或概念化）（A98–110/B159–61）。尽管康德的讨论方式暗示它们是彼此分离的心理行为类型，但也有理由认为它们总是一起发生（Paton 1936: 271–272; Kemp Smith 1918 [2003: 245–246]）[^kemp-1918][^paton-1936]，或至少前两种必定同时发生，第三种（或许）是可选的附加（Brook 1997; Allais 2009）[^allais-2009][^brook-1997]。
