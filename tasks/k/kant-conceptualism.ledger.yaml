    source: |-
      One of the central areas of dispute in the reception of Kant’s critical philosophy concerns his distinction between the cognitive faculties of sensibility (*Sinnlichkeit*) and intellect (*Verstand*), and their characteristic representational outputs—viz. intuition (*Anschauung*) and concept (*Begriff*). Though the dispute is multi-faceted, it centers on disagreement concerning the interpretation of Kant’s conception of the contribution made by the higher cognitive faculties (or the “intellect” in the broadest sense of that term) to a subject’s sensory apprehension of the world around it. The status of Kant’s distinction has been repeatedly questioned. In the immediate reception of Kant’s critical philosophy, major works by figures such as Solomon Maimon (*Essay on Transcendental Philosophy*, 1790) and G.W.F. Hegel (*Faith and Knowledge*, 1802) criticized the coherence of construing sensibility and intellect as independent faculties. The issue has also seen significant discussion in the latter half of the twentieth-century by Anglophone philosophers such as P.F. Strawson, Wilfrid Sellars, and John McDowell. Their work takes up Kant’s distinction between intuition and concept as an important vehicle for asking and answering questions regarding the relation between thought and reality. Such questions include both the issue of how thought could be so much as *about* an objective reality (Strawson 1959: ch. 2; McDowell 1994a; Ginsborg 2006b)[^ginsborg-2006b][^mcdowell-1994a][^strawson-1959], and the issue of how sense experiences caused by a subject’s environment could have a normative, rather than merely causal, significance for the subject’s thinking (Sellars 1968; McDowell 1994b)[^mcdowell-1994b][^sellars-1968].
    step1: TBD
    step2: TBD
  - id: 2
    kind: body
    source: |-
      Hence, the debate over the relation between intuition and concept is of significant historical and philosophical interest for at least two reasons. First, because it promises to provide answers to central questions in Kant’s conception of experience, such as those concerning the *acquisition* of the content of thought and the *warrant* for holding such thoughts as true. Second, because it serves as proxy for a related, and perhaps even more fundamental, dispute concerning Kant’s conception of the nature of rationality and its manifestation in animal life, particularly insofar as rationality is conceived as requiring sensitivity to norms or reasons as such (McDowell 2009, 2010; Korsgaard 2011: §6)[^korsgaard-2011][^mcdowell-2009].
    step1: TBD
    step2: TBD
  - id: 3
    kind: body
    source: |-
      Despite, and perhaps because of, the foundational nature of the interpretive and philosophical issues involved here, a significant number of the interpretive issues regarding Kant’s view turn simply on the way in which the dispute is framed. Indeed, much of the good work in the last twenty-five years or so concerning the relation between intuition and concept has served largely to clarify the terms and fundamental points at issue between disputants. To that end, this entry surveys both the basic framing assumptions of the dispute (§§1–4) and various loci of disagreement within it (§5).
    step1: TBD
    step2: TBD
  - id: 4
    kind: body
    source: |-
      ## 1. Mental Faculties and Mental Representation
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      One of the goals of Kant’s critical philosophy is to articulate the conditions of the possibility of what he calls “experience” (*Erfahrung*). As we’ll see below, Kant’s use of the term is rather more technical than is typically meant in English by talk of, e.g., a subject’s “experience” of the color red. Indeed, Kant sometimes speaks of there being only a single or universal experience (A110, A493/B521), which at least strongly suggests that he is not construing experience in a purely subjective or phenomenological manner. Rather, in talking of the conditions of “experience” in this way, Kant is most obviously concerned with the conditions under which objective empirical knowledge (*Wissen*) is possible—including knowledge that Kant thinks we actually have, such as is exemplified in the sciences of mathematics and physics. Kant’s hope is that by articulating the conditions under which such knowledge is possible, he will be able to indicate how it is that metaphysics itself could become a science. He pursues this goal via an examination of those features of the mind relevant to the conditions of “experience” so construed. This amounts to an examination of the conditions for “cognition” (*Erkenntnis*), or as Kant often puts it, the mind’s “relation to an object” (B137). There is some controversy about the best way to understand Kant’s use of this phrase, but for the moment we’ll understand it as involving relation to a possible object of experience, and as being a necessary condition for the positive substantive knowledge characteristic of a proper science (i.e., a *Wissenschaft*).
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      At the most basic explanatory level, Kant conceives of the mind as constituted by two different kinds of capacity (*Fähigkeit*), or power (*Vermögen*), which he labels “receptivity” (*Receptivität*) and “spontaneity” (*Spontaneität*). Receptivity, as the name suggests, constitutes the mind’s capacity to be affected, whether by itself (i.e., one “part” or capacity of the mind affecting another) or something else (i.e., something distinct from the mind). For Kant, any exercise of the mind’s receptive power essentially requires some external prompting in order to engage in the production of representations. In contrast, the power of spontaneity needs no such prompting. It is able to initiate its activity from itself, without any external influence.
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      Kant thus construes all mental activity either in terms of its resulting from affection (receptivity) or from the mind’s self-prompted activity (spontaneity). From these two very general aspects of the mind Kant then identifies three basic cognitive faculties (*Vermögen*), termed by Kant “sensibility” (*Sinnlichkeit*), “understanding” (*Verstand*), and “reason” (*Vernunft*). These faculties characterize specific cognitive powers, none of which is reducible to any of the others, and to each of which is assigned a particular cognitive task and a specific kind of characteristic representational output. In the case of sensibility the characteristic representations are sensation (*Empfindung*) and intuition (*Anschauung*). In the case of the understanding and reason (or the ‘intellect’ more broadly), concepts (*Begriffe*), judgment (*Urteil*), and inference (*Schluß*).
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      Kant characterizes intuition in terms of two basic characteristics—viz. immediacy (*Unmittelbarkeit*) and particularity (*Einzelheit*) (cf. A19/B33, A68/B93; JL 9:91). This is in contrast to the mediacy and generality (*Allgemeinheit*) characteristic of conceptual representation (A68/B93; JL 9:91). Kant’s distinction between these two sorts of representation might at first pass be taken as a kind of phenomenological distinction between how things seem to a perceiving subject independently of thought about what is so experienced, and this is indeed how at least some interpreters have construed Kant (e.g., Prichard 1909; Russell 1913; Broad 1978; Parsons 1992b)[^broad-1978][^parsons-1992b][^prichard-1909][^russell-1913]. However, as others have noted (e.g., Paton 1936: 98)[^paton-1936], Kant’s method for distinguishing the various contributions made by our cognitive faculties proceeds not by appeal to phenomenology but rather philosophical abstraction (e.g., A20–1/B34–5). Moreover, Kant at least sometimes seems to deny that a representation (or its content) could be present to consciousness at all—i.e., be something “for” the subject—without conceptualization (e.g., A116–17, B132). Hence Kant seems concerned not so much with the phenomenology of conceptual vs. non-conceptual experience as he is with the role the sensory and the conceptual play in constituting cognition and knowledge.
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      In discursive rational beings such as ourselves, intuition and concept cooperate in the generation of what Kant calls “cognition”. Kant employs the term “cognition” (*Erkenntnis*) in different ways (Smit 2000, 2009; Schafer 2022, 2023a; Gomes and Stephenson 2016; Tolley 2020; Willaschek and Watkins 2020; Watkins and Willaschek 2017b)[^gomes-2016][^schafer-2022][^smit-2000][^tolley-2020][^watkins-2017b][^willaschek-2020]. In the ‘Stepladder’ passage from the first *Critique* Kant provides a very general definition of cognition as a conscious representation of an object (A320/B376; see also JL 9:91). In this sense both intuitions and concepts may be cognitions. Kant also has a narrower sense of cognition “in the proper sense” (A78/B103), which in finite discursive beings like us concerns only those states that are the outcome of a synthesis of concepts and an intuited manifold. Proper cognition satisfies three conditions: (i) consciousness; (ii) “agreement” (*Übereinstimmung*) or truth-aptness; (iii) real possibility. The consciousness condition is clearly stated in Kant’s “Stepladder” passage. Cognition must be a conscious relation to an object. Kant indicates the “agreement” or “conformity” (*Übereinstimmung*) of a cognition with its object in his discussion of truth in the first *Critique*. He says that the “nominal definition of truth, namely that it is the agreement of cognition with its object, is here granted and presupposed” (A58/B82). Since Kant allows for false cognition, his view must be that representations that are cognitions are such as *to be able* to agree or conform with their objects, and Kant construes such agreement as truth. Kant regards judgment (i.e., a specific sort of non-associatively structured unity of concepts) as the bearer of truth, while denying that intuition is the sort of thing that can be true or false (see Heis 2013: 277–8; McLear 2016b)[^heis-2013][^mclear-2016b]. Finally, Kant construes cognition as always needing to be of a really—i.e., metaphysically—possible subject matter. As Kant states in a famous footnote in the B-preface of the first *Critique*:
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      > To *cognize* an object, it is required that I be able to prove its possibility (whether by the testimony of experience from its actuality or *a priori* through reason). (Bxxvin.)
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      Proper cognition may be pure, as when synthesizing a manifold of pure intuition (e.g., the pure intuition of space or time) with a concept (e.g., the concept of space as discussed in the Metaphysical Exposition of Space in the Transcendental Aesthetic). Proper cognition may also be empirical, as when synthesizing an empirical intuition (e.g., of touch or vision) with a concept. Kant often describes empirical cognition as “experience” (*Erfahrung*; see, e.g., B166, A176/B218, A189/B234), though empirical intuition and concepts are also related in what Kant calls “perception” (*Wahrnehmung*).
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      Kant takes the terms “intuition” (*Anschauung*), “perception” (*Wahrnehmung*), and “experience” (*Erfahrung*) to designate different things (McLear 2014b: 771–772; Allais 2016: 2–5; Tolley 2016a: 86–91, 2019, 2020)[^allais-2016][^mclear-2014b][^tolley-2016a]. For example, in the headings to the first three chapters of the Principles of the first *Critique* Kant distinguishes between the “Axioms of Intuition,” the “Anticipations of Perception,” and the “Analogies of Experience.” If Kant weren’t thinking that the terms “intuition”, “perception”, and “experience” designated distinct mental states, then it would be difficult to understand why he ordered a central part of his architectonic around them. All three are forms of representation of objects. Insofar as each is a conscious representation of an object they are all forms of “cognition” in the broad (though not necessarily the “proper”) sense of that term. Let’s look at each representational kind in a bit more detail.
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      Intuition is a relation to an “undetermined” (*unbestimmt*) object or an “appearance” (*Erscheinung*). Kant uses this phrase to characterize the object of intuition both in the opening of the Transcendental Aesthetic (A20/B34) in the first *Critique*, and in later discussion in both the Analytic (A69/B94, B154, B163, A141/B180, B309) and the Dialectic (A310/B367, B422n, A443/B471, A718/B746)). Though interpretation of these texts is controversial, the sense in which the object of intuition is “undetermined” seems to specifically involve its lack of *conceptual* determination, either explicitly in judgment (see, e.g., A69/B94) or via a rule of “figurative” synthesis that guides the imagination (e.g., A141/B180).
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      Perception, like intuition, is also sometimes described as representation of an undetermined object (e.g., B422n). However, perception also involves a consciousness of the “manifold” or “content” (*Inhalt*; more on this notion of “content” below) of the intuition (A99, A119–20, B160, B162, B202–3; Pr 4:300). What Kant means by this is not entirely obvious. However, Kant is clear that perception necessarily requires the activity of the imagination in combining together the content of the intuition into what Kant calls an “image” (*Bild*), which yields or constitutes consciousness of the content of intuition itself (A120, B160; see Sellars 1978; Young 1988; Allison 2015: 254–264; Matherne 2015; Tolley 2019, 2020)[^allison-2015][^matherne-2015][^sellars-1978][^tolley-2019][^young-1988]. Kant also indicates that in perception the “mathematical” categories of quality and quantity are employed, though not the relational or modal categories, which are constitutive of experience only (A161–2/B201; see Allison 2015: 414–426)[^allison-2015].
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      Finally, “experience” (*Erfahrung*) involves the combination or “synthesis” of these perceptions (*Wahrnehmungen*) by the categories, particularly the categories of relation (i.e., substance, cause, community). As Kant puts it, “experience is cognition through connected perceptions (*durch verknüpfte Wahrnehmungen*)” (B161; cf. B218; Pr 4:300). Experience is thus the most cognitively demanding and sophisticated form of having a cognitive relation to an object.
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      Given these distinctions we’ll next look at how to understand the proper locus of debate concerning the intellect’s contribution to sense experience.
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      ## 2. The Locus of Debate: Experience, Perception, or Intuition?
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      When inquiring about the nature of the relationship between the intellect and sense experience it is important to keep in mind the technical sense with which Kant uses various terms, as introduced above. There are at least two reasons for doing so. First, to be as clear as we can regarding Kant’s understanding of his own theory. Second, to avoid confusion regarding the relation between Kant’s conception of such terms and our modern Anglophone tradition of use. This latter issue is especially significant since, as we’ve already seen, it is not at all clear that Kant’s conception of “experience” admits of straightforward translation into our modern notion. For example, Kant is clear that “experience,” in his sense of an “empirical cognition” (*empirische Erkenntnis*), includes conceptual synthesis, since such synthesis is what binds the various elements of an empirical cognition together such that they are non-arbitrarily connected (see, e.g., B12, B161, B201, B218, and B233). As a result, all should concede that his usage of “experience” (*Erfahrung*) and “empirical cognition” (*empirische Erkenntnis*) typically is meant in a way that assumes a cognitive contribution in the form of conceptual synthesis by the understanding (Allais 2016: 4)[^allais-2016]. Thus, and rather confusingly, if there is a debate to be had concerning Kant’s view of the conceptual or intellectual character of “experience” in its contemporary English sense of a kind of phenomenally conscious state, it may well be located at somewhere other than the level of “experience” in Kant’s technical sense (though for worries about our contemporary philosophical usage of “experience” see Byrne 2009)[^byrne-2009].
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      More controversial is the issue of whether “perception” (*Wahrnehmung*) in Kant’s technical sense constitutively involves concepts or otherwise depends on conceptual synthesis. There is at least some evidence for thinking it does. For example, Kant says in the second version of the Transcendental Deduction, that “all synthesis, through which even perception itself becomes possible, stands under the categories” (B161). It may be that Kant’s use of “perception” (*Wahrnehmung*) here is largely in line with preceding German usage (e.g., in Wolff, Baumgarten, Meier, and Tetens) to mean the becoming conscious of a sensory representation in the mind (alternatively, becoming conscious of that which is presented via such representation), rather than either the mere occurrence of such a representation, or the occurrence of a judgment concerning the representation (Tolley 2016b, 2020)[^tolley-2016b]. In this way perception, as empirical consciousness of a representation (or what is presented through it; B207) is intermediate between the mere occurrence of an intuition in a subject’s mind and experience or empirical cognition, which Kant describes as involving judgment. Kant’s claim concerning perception in the Deduction could then be read as a claim concerning how categorial synthesis is necessary for empirical consciousness (perception) of the objects that are given to the mind in intuition, prior to making any judgment (in experience) concerning those objects.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      However, Kant’s position concerning perception, understood in terms of conscious sensory representation, is complicated by various remarks he makes concerning non-human animal (hereafter “animal”) consciousness. For example, in various descriptions of the “ladder” of cognition in the logic lectures, Kant allows that animals have representations with consciousness and consciously discriminate between objects on that basis. Moreover, Kant allows for such representational capacities in animals even though, lacking an intellect, animals thereby fail to have any capacity for cognition (at least in its narrow sense), understanding, or comprehension (*Jäsche Logik* 9:64–5; see also *Dohna-Wundlacken Logik* (c. 1792) 24:730–1; *Wiener Logik* (1780) 24:846; *Blomberg Logik* (c. 1771) 24:132–3, 134–5, 136). Kant also says of animals that they may be conscious of individual representations, while lacking any consciousness of the “unity” of those representations (letter to Herz, 26 May 1789, C 11:52). Such texts suggest that animals are conscious of their representations but lack any *self*-consciousness with respect to those representations (Paton 1936: 332–5; Naragon 1990; Ameriks 2000: ch. 7; Allais 2009; McLear 2011; Tolley 2016a; Golob 2020)[^allais-2009][^ameriks-2000][^golob-2020][^mclear-2011][^naragon-1990][^paton-1936][^tolley-2016a]. Moreover, Kant’s description of consciousness as necessary for making distinctions, and as coming in degrees (B414–15), also suggests that animals must be conscious of their representations to a degree sufficient for explaining how they make the distinctions between objects in their environment that they obviously do. However, interpreting these texts, and the significance of Kant’s remarks on animals, remains contested (Kemp Smith 1918 [2003: lii–liv]; Grüne 2014b: §2; Fisher 2017; Land 2018; Leland 2018a,b;; Callanan 2020)[^callanan-2020][^callanan-2020-2][^fisher-2017][^grüne-2014b][^kemp-1918][^land-2018][^leland-2018a]. Thus it remains contested as to whether perception, in Kant’s sense, is possible without intellectual capacities involving conceptual representation.
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      If there is some question whether perception is possible without an intellect and conceptual capacities, the issue is even more fraught with respect to intuition, and this is indeed where much of the contemporary discussion has focused (e.g., Sellars 1968: ch. 1; McDowell 1996; Hanna 2001: ch. 4; Hanna 2005; Ginsborg 2008; Allais 2009; Grüne 2009; Friedman 2012; Tolley 2013; McLear 2015)[^allais-2009][^friedman-2012][^ginsborg-2008][^grüne-2009][^hanna-2001][^hanna-2005][^mcdowell-1996][^mclear-2015][^sellars-1968][^tolley-2013]. Moreover, since intuition is the most basic object-related representation, if Kant construes intuition as inextricably linked with conceptual representation then he would clearly also be committed to thinking so of perception and experience. Conversely, however, if Kant denies any intrinsic connection between intuition and conceptualization he is nevertheless free to argue that conceptual capacities play an important role at the level of perception or experience.
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      In what follows this entry assumes that intuition and its faculty of sensibility is the relevant locus of debate. It also assumes that Kant’s notion of intuition has some correlation with our contemporary conception of what is described by the English term “experience”, though this entry will largely leave the nature of that connection open in what follows. Given this locus of discussion, the next section examines two frameworks within which to think about the dependence of intuition on conceptualization.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      ## 3. Frame I: Conceptual Content
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      The reception of Kant’s philosophy in the latter half of the twentieth century (e.g., Sellars 1968; McDowell 1996; Hanna 2005; Ginsborg 2006b; Haag 2007; Allais 2009)[^allais-2009][^ginsborg-2006b][^haag-2007][^hanna-2005][^mcdowell-1996][^sellars-1968] typically presents him as either accepting or rejecting the view that experience has “conceptual content.” One way to frame this dispute is in terms of the acceptance or rejection of the following statement of ‘Conceptualism’:
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      **Conceptualism:** The ‘content’ (*Inhalt*) of an intuition is conceptual, and constitutes its cognitive relation to a (putatively) mind-independent object
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      Conceptualist readings of Kant thus claim that there is a relevant sense in which (i) intuitions have content; (ii) the content of the intuition is conceptual; (iii) it is this conceptual content that constitutes or determines the cognitive relation of the intuition (as a mental state) to a mind-independent object (or in the case of inner sense, to the object that is oneself). According to the contrasting position, ‘Nonconceptualism’:
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      **Nonconceptualism:** The ‘content’ of an intuition is at least partly nonconceptual, and is sufficient to constitute a cognitive relation to a (putatively) mind-independent object
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      One caveat worth noting: the qualification concerning “putatively” mind-independent objects is meant to allow for hallucination and illusion (see Allais 2010, 2011a; Roche 2011; Stephenson 2015, 2017; Grüne 2017a; McLear 2017)[^allais-2010][^grüne-2017a][^mclear-2017][^roche-2011][^stephenson-2015]. This qualification also provides leeway concerning exactly what is meant by “mind-independent”, especially since Kant’s articulation of Transcendental Idealism entails that finite beings intuit (in some sense) mind-dependent appearances and not (in some sense) mind-independent things as they are in themselves (Allais 2015; see also the entry on Kant’s transcendental idealism)[^allais-2015].
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      One might argue that Kant articulates an endorsement of Conceptualism in §17 of B-Deduction of the first *Critique*, where he says that
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      > The understanding is, to speak generally, the faculty of cognitions. This consists in the determinate relation of given representations to an object. But an object is that in the concept of which the manifold of a given intuition is united. Now, all unification of representations requires the unity of consciousness in the synthesis of the same [i.e., the representations]. It follows that the unity of consciousness alone establishes [*ausmacht*] the relation of representations to an object, their objective validity, and thus their becoming cognitions. (B137; cf. A197/B242–3)
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      The language used here has seemed to many to indicate that the unity of consciousness achieved via categorial synthesis is necessary for any cognitive relation to an object (e.g., Bird 1962: 130–131; Guyer 1987: 11–24; Pereboom 2006: 160; Pereboom 2009; cf. Land 2012)[^bird-1962][^guyer-1987][^land-2012][^pereboom-2006][^pereboom-2009]. Put another way, intuitions must have conceptual content if they are to have cognitive relation to an object.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      While there may be a variety of reasons for reading Kant as endorsing Conceptualism, so understood, two stand out. The first is philosophically motivated by the position that sense experience can play a rational or justificatory role with respect to belief or judgment only if such experience possesses conceptual content (see §5.1 for discussion). Second, many think that the only plausible way of interpreting Kant’s argument in the Transcendental Deduction of the *Critique of Pure Reason* requires that he endorse Conceptualism (see §5.5 for discussion).
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Hence, interpreters endorsing some form or another of ‘Nonconceptualism’ typically take a contrasting stance regarding Kant’s position concerning either the justificatory relationship between sense experience and belief or judgment, or the proper interpretation of his argument in the Deduction.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      However, the framing of the dispute between Conceptualism and Nonconceptualism as one concerning conceptual content faces straightforward interpretive challenges, independently of where one stands as to the justificatory role of experience or the best way to interpret the argument of the Deduction. These challenges concern each element of the Conceptualist thesis. First (§3.1), it seems that when close attention is paid to Kant’s notion of ‘content’ (*Inhalt*) it cannot be the case that intuitions have conceptual content. Second (§3.2), Kant’s conception of concepts as always employed in judgment appears incompatible with the claim that concepts provide intuition with cognitive relation to an object. Third (§3.3), attempts to avoid these challenges by attributing a conception of ‘content’ to Kant in line with our contemporary notion of *representational* content do not obviously cohere with his view of the contribution of intuition to cognition. The next three subsections detail these challenges. Again, it is important to note that though these challenges are often raised by advocates of some form or another of Nonconceptualism, the challenges themselves are independent of any specific answer concerning, first, whether and how intuition justifies judgment, and second, how Kant proceeds in the argument of the Deduction. After discussing these three challenges to the conceptual content frame regarding its plausibility as an interpretation of Kant (this entry shall largely prescind from discussing Conceptualism’s independent philosophical plausibility), §4 then examines an alternative way of framing the debate that does not raise these concerns.
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      ### 3.1 Relation to An Object
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      One straightforward challenge to the Conceptualism thesis comes from close examination of Kant’s conception of ‘content’ (*Inhalt*), which he understands in terms of the relation of a representation to an object (Tolley 2011, 2013)[^tolley-2011]. As we have seen in B137 above, Kant often construes the content of cognition in terms of a relation to an object (see also B79, B83, B87), and he also says of sensory intuition that it
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      > contain[s] [*enthalten*] in its representation only the relation [*Verhältniß*] of an object to the subject, and not that which is internal to the object in itself. (B67)
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Moreover, Kant describes intuition and concept as having opposing kinds of relation to the object they represent. Intuitions are immediately related to their objects while concepts are only mediately so related (B93; see also B33, B41, A109, B3767; Prolegomena, §8 (4: 281); What Real Progress, 20: 266). This gives us the material for the following argument.
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      1. The content of a cognition (whether intuition or concept) consists in—i.e., is nothing but—a relation to an object
      2. Concepts and intuitions relate to objects in different ways—viz. mediately and immediately
      3. ∴ The content of intuition is different from the content of concepts
      4. Representations are individuated as to type—i.e., intuition or concept—at least partly in virtue of their content
      5. ∴ Intuitions cannot have conceptual content
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      This argument, if sound, shows that intuition cannot be related to an object (and thus have ‘content’) by virtue of a *conceptual* content. Thus, one initial worry about Conceptualism is that its framing of its position in terms of ‘content’ does not obviously cohere with how Kant thinks of content. However, the above argument fails to show that concepts (or conceptual synthesis, or the capacity for concept employment) do not play any *other* role in the constitution of an intuition’s relation to an object—perhaps concepts are not the contents of intuitions but are nevertheless necessary for an intuition’s having a relation to an object. Let’s turn then to discussion of how conceptual synthesis could constitute this relation.
