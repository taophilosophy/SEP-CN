      The particularity of intuition seems to be such that it singularly and immediately relates us to particular objects without adverting to general marks common to all such objects, and which are constitutive of conceptual representation (A19/B33).
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      In Gomes’ second argument, he points out that Kant rejects any interpretation of the relation of intuition to its object solely in terms of the intuition as the causal result of the inferred object’s effect on the subject’s senses. Kant instead claims that in perceptual experience I have “an immediate consciousness of the existence of other things outside me” (B276). Gomes elucidates how this point has been picked up and developed in contemporary literature on the nature of perceptual experience (Gomes 2017a: 549; see also Child 1994: 147–149; Campbell 2002: 132–133)[^campbell-2002][^child-1994][^gomes-2017a].
    step1: TBD
