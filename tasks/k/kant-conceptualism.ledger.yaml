      ### 3.2 Concepts and Conceptual Synthesis
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      According to Conceptualism, the cognitive relation of an intuition to an object is, in some sense, conceptual. A version of this claim is seemingly articulated by Kant at B137, quoted above, in which it is a synthesis by concepts that constitutes what Kant calls a “determinate relation” (*bestimmten Beziehung*) to an object. After first discussing what Kant means by “synthesis” here we’ll go on to address the prospects and problems facing an account of intuition as dependent on conceptual synthesis.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      Kant distinguishes between two basic classes of mental processing. The first is association, which is carried out by sensibility, and specifically the imagination (inclusive of memory). Association is primarily a passive process by which the mind comes to connect representations due to the repeated exposure of the subject to certain kinds of regularities. One might (e.g.) associate chicken soup with being ill, because one only ever had chicken soup when one was ill. Association is thus capable of engendering content-sensitive connections between a subject’s mental states, though such connections depend entirely on the local and contingent circumstances in which the subject comes to have such states. This is part of why Kant denies that association could ever account for our ability to represent universality or necessity.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      The second kind of mental processing is “combination” (*Verbindung*) or “synthesis”, carried out by the intellect broadly conceived (i.e., the “higher” cognitive faculties of understanding, judgment, and reason). Kant characterizes synthesis as that activity by which the understanding “runs through” and “gathers together” representations given to it by sensibility in order to form concepts, judgments, and ultimately, for any cognition (in its “proper” sense) at all to take place (A77–8/B102–3). Synthesis is not something we are always, or even typically, aware of doing. As Kant says, it is “a blind though indispensable function of the soul…of which we are only seldom even conscious (A78/B103).” Kant typically contrasts synthesis with other ways in which representations might be related, most importantly, by association (e.g., B139–40). In contrast with association, synthesis is a fundamentally active process, dependent upon the mind’s spontaneity, and is the means by which genuine judgment is possible. Moreover, at least by the time of Kant’s writing of the B-Deduction of the first *Critique*, he is clear that judgments, as outcomes of synthesis, are unique in our mental economy in that they are complex representations that possess the capacity to be true or false. As Kant’s discussion in §19 of the B-Deduction shows, a judgment isn’t simply a “representation of a relation between two concepts” (B140), which doesn’t rule out mere association between concepts, but is rather a representation of an objectively valid relationship in virtue of which the judgment may be seen as an objective claim to truth (B142).
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Synthesis is carried out by the unitary subject of representation on representations that are either given to it in sensibility (i.e., intuition and/or sensation) or produced by it via the intellect (e.g., in an act of judgment). When synthesis is carried out on representations forming the content of a concept or judgment, it is called “intellectual” synthesis; when carried out by the imagination on material provided by sensibility (i.e., on intuition and sensation), it is called “figurative” synthesis (B150–1). In the *Critique of Pure Reason* Kant discusses in some depth the synthesis performed on representations provided by sensibility, and discusses three central kinds of synthesis—viz. apprehension, reproduction (or imagination), and recognition (or conceptualization) (A98–110/B159–61). Though Kant discusses these forms of synthesis in a way that suggests they are discrete types of mental acts, it is also plausible that they always go together (Paton 1936: 271–272; Kemp Smith 1918 [2003: 245–246])[^kemp-1918][^paton-1936], or at least that the first two forms must always occur together, with the third being (perhaps) an optional addition (Brook 1997; Allais 2009)[^allais-2009][^brook-1997].
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      Given that Kant distinguishes between intellectual and figurative synthesis, what does it then mean to claim that an intuition constitutively depends on conceptual synthesis for its relation to an object?
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      Kant describes a concept as a “function” (*Funktion*), which he characterizes as “the unity of the act through which different representations are ordered under a common one” (A68/B93). Concepts are merely “predicates of possible judgments” (A69/B94) “grounded on the spontaneity of thinking” and the faculty of understanding “can make no other use of these concepts than that of judging by means of them” (A68/B93).
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      From these passages we can conclude that concepts are (i) actualizations of the spontaneity of (the power of) thought through which (ii) different representations are ordered under a common one. This ordering is carried out specifically by means of (iii) a judgment. Hence, an act of conceptualization is an act of subordinating one representation “under” another, as a species (or the members thereof) is to its genus (or the members thereof), and it is this subordination relation that is captured in the cognitive activity of judging (Paton 1936: 285; Strawson 1966: 94; Pippin 1982: 33; Longuenesse 1998: ch. 4; Engstrom 2019: 245–252)[^engstrom-2019][^longuenesse-1998][^paton-1936][^pippin-1982][^strawson-1966].
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      How, on this view of conceptual activity in judgment, is the conceptualization of sensory material in intuition supposed to work? According to one prominent interpretation—call this ‘judgmentalism’ (Land 2015b)[^land-2015b]—intuition requires a judgment on the part of the subject, that things are experientially thus-and-so (Strawson 1970; Carl 1992: 165)[^carl-1992][^strawson-1970]. However, this interpretation of Kant generates some straightforward problems (Grüne 2009: §2.2; Land 2015b)[^grüne-2009][^land-2015b]. First, Kant’s conception of judgment seems to require predication (and in this sense concepts are predicates of possible judgments). However, a sensible synthesis carried out by concepts does not seem equivalent to the making of a judgment, rather it seems that Kant has in mind something like the formation of a sensory image (e.g., B154, B162). Indeed, in a 1791 letter Kant explicitly denies that intuitions are related to objects via an act of judgment or, relatedly, by the subsumption of the intuition under a concept (C 11:311). Second, Kant emphasizes that there are two distinctively different kinds of synthesis—viz. the “intellectual” synthesis generative of conceptual judgment, and the “figurative” synthesis generative of experience (in Kant’s sense of “experience”; see B151). If the judgmentalist view were correct, then it is difficult to see how Kant could maintain such a distinction between varieties of synthesis. Third, there is at least a *prima facie* circularity to the judgmentalist account, which construes conceptual judgment as a necessary condition of the generation of intuition, and Kant’s account of concept formation, which construes all concepts (even the a priori categories) as the result of reflection, which itself presupposes sensory intuition (Ginsborg 2006b; Grüne 2009; Anderson 2015: ch. 13)[^anderson-2015][^ginsborg-2006b][^grüne-2009].
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Such problems have lead some (e.g., Sellars 1968; McDowell 1996; Longuenesse 1998; Haag 2007; Grüne 2009)[^grüne-2009][^haag-2007][^longuenesse-1998][^mcdowell-1996][^sellars-1968] to argue that the dependence of intuition on conceptual representation must be understood in a way other than that of application of a concept in judgment (or the subordination of an intuition under a concept). This entry examines below one way such an alternative view might proceed (and challenges it faces) before discussing further extensions of it in the context of the second way of framing the debate about the relation between intuition and concept.
    step1: TBD
    step2: TBD
