      ### 5.8 Modality & Cognition
    step1: TBD
    step2: TBD
  - id: 155
    kind: body
    source: |-
      As we saw in §1, Kant uses the term ‘cognition’ (*Erkenntnis*) in different ways. But the sense of “proper cognition” is often that with which he is most concerned, as it marks out the way in which both stems of our cognitive capacity (i.e., sensibility and intellect) must cooperate for cognition, and ultimately substantive scientific knowledge, of objects to occur.
    step1: TBD
    step2: TBD
  - id: 156
    kind: body
    source: |-
      Kant construes such cognition as always of a really—i.e., metaphysically—possible subject matter. As Kant states in a famous footnote in the B-preface of the first *Critique*:
    step1: TBD
    step2: TBD
  - id: 157
    kind: body
    source: |-
      > To *cognize* an object, it is required that I be able to prove its possibility (whether by the testimony of experience from its actuality or *a priori* through reason). But I can *think* whatever I like, as long as I do not contradict myself, i.e., as long as my concept is a possible thought, even if I cannot give any assurance whether or not there is a corresponding object somewhere within the sum total of all possibilities. But in order to ascribe objective validity to such a concept (real possibility, for the first sort of possibility was merely logical) something more is required. (Bxxvi, note)
    step1: TBD
    step2: TBD
  - id: 158
    kind: body
    source: |-
      In finite discursive beings the structure of thought is governed ultimately by the rule of non-contradiction, and in this way concerns what is logically possible. But an analysis of the contents and laws of thought tells us nothing as to whether there really could be an object such as the thought specifies. Thus the real possibility of an object for theoretical cognition can only be determined from an actual ground provided via experience or via a priori transcendental reflection (Chignell 2010; McLear 2016a)[^chignell-2010][^mclear-2016a]. And as Kant goes on to note, the “more” that is required for a thought to achieve cognition need not always come from theoretical sources, as there may be practical sources of cognition as well (Chignell 2007a; Kain 2010; Schafer 2023a)[^chignell-2007a][^kain-2010][^schafer-2023a].
    step1: TBD
    step2: TBD
  - id: 159
    kind: body
    source: |-
      A challenge for Intellectualism is to explain how the modal condition on cognition may be satisfied if intuition is itself the outcome of some synthetic intellectual process (Gomes and Stephenson 2016; McLear 2016b: §4.3; 2016a: §8.5; cf. Parsons 1964, 1992b; Carson 1997)[^carson-1997][^gomes-2016][^mclear-2016b][^parsons-1964]. There are at least two issues here. The first is that it seems that such intellectual processes could supply only logical as opposed to “real” representational constraints. The second (and related issue) is that Kant’s emphasis on the “the testimony of experience from [the object’s] actuality” is at least some evidence for thinking that intuition—as the sensory component of empirical cognition or “experience”—provides the needed “real” constraint on cognition by giving proof of the real possibility of the subject matter of cognition. This real constraint intuition provides via its presentation of some *actuality* that grounds this possibility.
    step1: TBD
    step2: TBD
  - id: 160
    kind: body
    source: |-
      Replies to these two challenges dispute the emphasis on the actuality of what is presented through intuition, and instead interpret the modal condition fairly weakly, as saying simply that a really possible object must be one that can have spatio-temporal structure (Gomes and Stephenson 2016: §3.4.1; Grüne 2017a)[^gomes-2016][^grüne-2017a], and so the ‘proof’ provided through experience is compatible with the non-actuality of the object of experience. According to this proposal, every object of experience or intuition conforms to the conceptual formal conditions of experience, namely the categories, because every intuition is generated by a synthesis that takes place in accordance with the categories. Thus, every intuition, regardless of whether the object it represents is actual or not, conforms to the formal conditions of experience, and is therefore the representation of an object that is really possible.
    step1: TBD
    step2: TBD
  - id: 161
    kind: body
    source: |-
      McLear (2016a) has argued against such a response in two ways. First, if the representations of space and time, as Intellectualism typically argues, are dependent on the intellect, then it is unclear how space and time operate as formal but “real” constraints, independent of the intellect, on what is really possible. Second, any Intellectualist position that construes the modal condition as satisfied merely by the formal conditions of experience commits itself to at least two problematic positions. First, imagined and hallucinated experiences will count as cognitions (cf. Beck 1978)[^beck-1978]. Second, Kant’s emphasis on actuality in the Bxxvi note, quoted above, is left unexplained.
    step1: TBD
    step2: TBD
  - id: 162
    kind: body
    source: |-
      However, a corresponding challenge for the Sensibilist position lies in explaining how intuitions could be relations to actualities even in the “pure” case of the intuitions of space and time—i.e., those a priori intuitions whose features are described in their respective Metaphysical Expositions of space and time in the Transcendental Aesthetic. Kant is quite clear that the pure intuitions are intuitions of “*ens imaginaria*” or imaginary beings (see Amphiboly, A291/B347). As imaginary beings, they do not exist. If that is correct then it cannot be the case that intuition *as such* is existentially dependent on its relata, since a priori intuitions are certainly intuitions, and they lack existing relata. So it would seem that either it is false to construe intuitions as always relations to actualities or Kant is inconsistent in his treatment of intuition across pure and empirical cases.
    step1: TBD
    step2: TBD
  - id: 163
    kind: body
    source: |-
      Here, however, the Sensibilist can pursue a strategy of distinguishing actuality from existence (Stang 2016a: 34 and 322; McLear 2017: 91 n10)[^mclear-2017][^stang-2016a]. Kant makes two explicit discussions of this point. First he is reported as having explicitly distinguished the concept of actuality (*Wirklichkeit*) from existence (*Existenz*) in a lecture from the mid 1790s (*Metaphysik K₃*, 29:986). Second, in *reflexion* R6324, 18:647 (between 1790 and 1793), Kant specifically names time and space as actual but not existing things.
    step1: TBD
    step2: TBD
  - id: 164
    kind: body
    source: |-
      If Sensibilism can make good on the plausibility of a distinction between actuality and existence then it can interpret all intuition as a relation to an actuality, even if not always to an *existent* actuality, and thus give a straightforward explanation of why intuition in especially suited to satisfying the modal condition on cognition.
    step1: TBD
    step2: TBD
