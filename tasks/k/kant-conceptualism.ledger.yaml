      ### 5.5 The Transcendental Deduction
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      The argument of the Transcendental Deduction, and its relation to the Transcendental Aesthetic (and thus to Kant’s philosophy of Mathematics), is a central area of dispute between Sensibilism and Intellectualism (Waxman 1991; Longuenesse 1998; Allais 2016: §1.5; Golob 2016b; Allais 2017b)[^allais-2016][^allais-2017b][^golob-2016b][^longuenesse-1998][^waxman-1991]. Critics charge that Sensibilism at best renders ineffectual Kant’s apparent strategy for demonstrating the legitimacy of the categories in the argument of the Transcendental Deduction and at worst shows Kant to be totally confused in his argumentative strategy (Ginsborg 2008: 68–69; Griffith 2012; Gomes 2014; Land 2015a; cf. Hegel 1977: 69–72; Pippin 1989: 29–31; Keller 1998: 107–112, 254; McDowell 2004, 2007a)[^ginsborg-2008][^gomes-2014][^griffith-2012][^hegel-1977][^keller-1998][^land-2015a][^mcdowell-2004][^pippin-1989]. However, since interpretation of the argument of the Deduction is at least as controversial as any claim made by either side of the dispute, dialectical traction on the basis of the text of the Deduction itself is difficult to come by.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      The basic approach required by Intellectualism sees Kant’s strategy for legitimating the categories, however else the details are construed, as culminating in the argument that even the pure intuitions of space and time (i.e., the representations that are the topic of their respective Metaphysical Expositions in the Transcendental Aesthetic) depend for their generation on intellectual, though not obviously conceptual, activity.
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      Intellectualism interprets Kant as providing this argument in a notoriously difficult footnote in §26:
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      > Space, presented as object (as we are actually required to represent it in geometry), contains more than [the] mere form of intuition—viz. it contains also the gathering together [*Zusammenfassung*] of the manifold given according to the form of sensibility, in an intuitive representation—so that the form of intuition gives us merely a manifold, but formal intuition gives us unity of representation. In the Transcendental Aesthetic I had merely included this unity with sensibility, wanting only to point out that it precedes any concept. But this unity indeed presupposes a synthesis which does not belong to the senses, through which all concepts of space and time first become possible. For through this unity (inasmuch as understanding determines sensibility), space or time is first given as intuitions, and hence, the unity of this intuition belongs a priori to space and time, and not to the concept of understanding (§24). (B160–1, note)
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      Lorne Falkenstein describes this footnote as “so obscure that it can be made to serve the needs of any interpretation whatsoever” because the text is “close enough to exhibiting a contradiction that it makes it possible to get virtually any conclusion one pleases out of the passage with only minor effort” (Falkenstein 1995: 91)[^falkenstein-1995].
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Despite the difficulties presented by the text, the Intellectualist takes the very intelligibility of Kant’s strategy in the Deduction to hinge on the dependence of pure intuition on the intellect (Cohen 1871, 1907; Longuenesse 1998: ch. 8; Dufour 2003; Ginsborg 2008: 69; Bowman 2011: 421; Grüne 2011: 465–466; Friedman 2015; McDowell 2016: 318; Conant 2016: 110)[^bowman-2011][^cohen-1871][^conant-2016][^dufour-2003][^friedman-2015][^ginsborg-2008][^grüne-2011][^longuenesse-1998][^mcdowell-2016]. The idea here is that, by making the pure intuitions of space and time themselves depend on intellectual activity, along with some further connection of that intellectual activity to categorial synthesis, Kant assures his desired conclusion for the Deduction overall—viz. that any possible empirical intuition must depend on the categories and thus that all possible objects of empirical intuition must fall under the categories. The Intellectualist thus construes any approach to reading the Deduction that doesn’t posit such a dependence relation as rendering the argument there hopeless and Kant’s strategy deeply confused. Of note here is the fact that when Kant says that the unity of intuition “precedes any concept” one might plausibly read him as endorsing a form of Nonconceptualism—viz. that the pure intuitions are prior to any conceptual content. However, this nonceptualist point is compatible with Intellectualism since it is possible that the unity of intuition lacks conceptual content but is nevertheless dependent on the intellect in some other sense (e.g., Waxman 1991, 2014; Longuenesse 1998; Messina 2014; Freidman 2015; Indregard 2021)[^indregard-2021][^longuenesse-1998][^messina-2014][^waxman-1991].
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      One issue for the Intellectualist interpretation is that it seems to make the success conditions of the Deduction too easy. If Kant’s project in the Deduction is to show that all intuition, or perhaps more generally “everything that may ever come before our senses” (B160) must stand under the categories (Guyer 2010a; Allison 2015: 407–408)[^allison-2015][^guyer-2010a], then it cannot be the case the intuition is defined in terms of its dependence on the intellect. If intuition were so defined, it would be unclear why anything more than a trivial inference would be needed to show that intuition depends on the intellect. To avoid this Intellectualism must advocate either for a reading of “intuition” that allows for at least two different senses of the term (Sellars 1968: ch. 1)[^sellars-1968] or a “re-reading” of Kant’s initial presentation of the nature of sensibility and the intuitions it provides (Longuenesse 1998: ch. 8; Bauer 2012; Conant 2016)[^bauer-2012][^conant-2016][^longuenesse-1998].
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      Certainly, very basic aspects of the argument of the Deduction, even such as its method and aims (beyond, in some sense, showing the legitimacy of the categories), much less the details and cogency of its specific arguments, are open to significant dispute (e.g., Henrich 1989; Pereboom 1995; Hatfield 2003; Guyer 2010a; Allais 2015: ch. 11)[^allais-2015][^guyer-2010a][^hatfield-2003][^henrich-1989][^pereboom-1995]. Such dispute naturally includes whether Kant’s strategy in the Deduction might well be intelligible in some fashion that does not presuppose or otherwise require Intellectualism. For example, according to various Sensibilist readings, the Deduction might be concerned with conditions governing referential thought (Allais 2015: ch. 11)[^allais-2015] or the representation of a privileged set of spatial and temporal relations beyond those required for objective representation in its most primitive form (Golob 2016b)[^golob-2016b], or the conditions for relating particular property instantiations to some underlying entity (McLear 2015: §3; 2020a)[^mclear-2015]. In each such case, the Deduction is intelligible as attempting to legitimize the categories without adverting to Intellectualism.
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      The Sensibilist case for an alternative reading of the Deduction is abetted by a significant problem with the Intellectualist proposal that the pure intuitions depend on an intellectual unity. This will be examined in the next subsection.
    step1: TBD
    step2: TBD
