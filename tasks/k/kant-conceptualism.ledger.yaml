      Kant takes the terms “intuition” (*Anschauung*), “perception” (*Wahrnehmung*), and “experience” (*Erfahrung*) to designate different things (McLear 2014b: 771–772; Allais 2016: 2–5; Tolley 2016a: 86–91, 2019, 2020)[^allais-2016][^mclear-2014b][^tolley-2016a]. For example, in the headings to the first three chapters of the Principles of the first *Critique* Kant distinguishes between the “Axioms of Intuition,” the “Anticipations of Perception,” and the “Analogies of Experience.” If Kant weren’t thinking that the terms “intuition”, “perception”, and “experience” designated distinct mental states, then it would be difficult to understand why he ordered a central part of his architectonic around them. All three are forms of representation of objects. Insofar as each is a conscious representation of an object they are all forms of “cognition” in the broad (though not necessarily the “proper”) sense of that term. Let’s look at each representational kind in a bit more detail.
    step1: |-
      康德认为“直观”（*Anschauung*）、“知觉”（*Wahrnehmung*）与“经验”（*Erfahrung*）三名指称不同之物（McLear 2014b: 771–772; Allais 2016: 2–5; Tolley 2016a: 86–91, 2019, 2020）[^allais-2016][^mclear-2014b][^tolley-2016a]。例如，在第一《批判》“原理”头三章的标题中，康德区分了“直观的公理”、“知觉的预测”与“经验的类比”。倘若康德不认为“直观”、“知觉”、“经验”指称不同的心理状态，就很难理解他为何围绕它们安排其建筑术的一个核心部分。三者都是对象的表象形式。就每一者都是对对象的有意识表象而言，它们都是广义（未必“严格”）意义上的“认识”。我们稍为详细地看看每一类表象。
    step2: |-
      在康德笔下，“直观”（*Anschauung*）、“知觉”（*Wahrnehmung*）、“经验”（*Erfahrung*）各有所指（McLear 2014b: 771–772; Allais 2016: 2–5; Tolley 2016a: 86–91, 2019, 2020）[^allais-2016][^mclear-2014b][^tolley-2016a]。例如第一《批判》“原理”头三章的标题，即“直观的公理”、“知觉的预测”、“经验的类比”，便可见其分际。若康德不认为三者标示不同的心理状态，就难以解释他何以围绕它们安排建筑术的核心部分。三者都是对象的表象形式；既然都是对对象的有意识表象，便都算广义（未必“严格”）的“认识”。下面稍详地看各类表象。
