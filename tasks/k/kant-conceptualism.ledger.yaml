    kind: body
    source: |-
      ## 5. Points of Dispute
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      This section canvasses eight different areas of dispute between contemporary interpreters of Kant concerning the contributions of sensibility and intellect to cognition. Each dispute is presented in terms of the second, dependence, frame (i.e Intellectualism vs. Sensibilism). However, proponents of the first, content, frame (i.e., Conceptualism vs. Nonconceptualism) will also see these different areas of dispute as relevant, given that many of their concerns remain in the motivation for holding one form or another of Intellectualism. That said, particularly important points of discrepancy between the two frames’ approaches to the issues will be noted below.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      ### 5.1 Experience & Justification
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      A central reason for pursuing an Intellectualist reading of Kant is that such a reading is taken (most notably by Sellars and McDowell) to be the best or even only way to secure an explanation of how perception can play a justificatory rather than merely causal role in the adoption of empirical belief. If intuition is autonomous of intellectual capacities, so the objection goes, it cannot play a justificatory role in the acquisition or adoption of empirical belief. Versions of this objection have often, since Wilfred Sellars’ famous paper (Sellars 1956, reprinted in Sellars 1963)[^sellars-1956][^sellars-1963], gone under the moniker of the “Myth of the Given” (McDowell 1996, 1998, 2007b, 2008)[^mcdowell-1996]. While it is not straightforward as to how Kant’s texts or arguments yield any substantive connection with the concerns articulated by Sellars and McDowell, this entry examines three possible ways of understanding such a connection.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      The exact nature of objections to a supposedly mythical “Given” vary, as do their putative connections to Kant’s arguments (Watkins 2008, 2012)[^watkins-2008]. One objection made by Sellars is that justifiers for belief must have a compositional, fact-like structure that mirrors the propositional structure of belief. Sensory experiences (understood as sensations), on Sellars’ view, are particulars rather than facts and so cannot play any justificatory role (Sellars 1963: 128; cf. BonJour 1985: ch. 4)[^bonjour-1985][^sellars-1963]. Thus, the view goes, if the belief caused by an experience (such as the belief you might have that there is a computer screen before you) and thereby adopted by you is also to be justified by that experience, then the experience itself must be able to function as a premise in an argument for which the relevant belief is the conclusion. This is the “premise principle,” as it has been called in contemporary epistemology (Pryor 2005)[^pryor-2005]. Acceptance of the premise principle thus plays a significant role in motivating the position that sensory experience without propositional (i.e., conceptual) content cannot justify belief.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      A passage in Kant typically adduced in support of this point is the “same function” passage at A79/B104–5 (e.g., Sellars 1968: 4–5; McDowell 2004: 79; Haag 2007: 150–151, 199, and ch. 8; Kalderon 2011: 235–236; cf. Pippin 1982: 99–101; Heidegger 1997: 45–46; Longuenesse 1998: 200; Grüne 2009: 107–111)[^grüne-2009][^haag-2007][^heidegger-1997][^kalderon-2011][^longuenesse-1998][^mcdowell-2004][^pippin-1982][^sellars-1968]. On this reading of Kant, sense experience would have the requisite proposition-like structure, and thus be capable of standing in justificatory relations to beliefs, only if the same capacities that structure the contents of judgment for Kant (viz. the logical forms) would also structure sensory experience (via application of the categories). While such interpreters are surely correct that Kant’s aim, as exemplified in that passage, is to show that the very same cognitive capacities that connect representations in a mental act of judging are also in play in the connection of representations in a sensory experience, it is not obvious how the passage directly supports any argument concerning the epistemic significance of sensory experience to empirical belief and knowledge. What is particularly unclear is whether Kant endorses the premise principle in the substantive manner required for the Sellars/McDowell position. Hence, further work needs to be done to show that Kant actually (or even counterfactually) endorses the premise principle.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      A second objection against the Given, which might also be attributed to Kant, is that the mere occurrence of a sensory experience cannot justify any particular belief that is the causal result of that experience. Instead, sensory experience can only play its justificatory role against a background of concepts possessed by the experiencing subject (Sellars 1963: 170; McDowell 1998: 435–436)[^mcdowell-1998][^sellars-1963]. Though this position is often taken to support some form of Intellectualism (e.g., McDowell 1996; Ginsborg 2006b)[^ginsborg-2006b][^mcdowell-1996], it is also compatible with forms of Sensibilism that construe the conditions for empirical knowledge as resting at least in part on the possession of intellectual capacities, even if such capacities are not necessary for perceptual intentionality as such (e.g., Hanna 2001: 46–65; 2005: 256–257; Bird 2006: 193–207; Watkins 2008, 2012; Allais 2009: 392–394; Tolley 2013: 125–127; McLear 2015: 98–106, 2020a; Golob 2016a, 2020)[^allais-2009][^bird-2006][^golob-2016a][^hanna-2001][^mclear-2015][^tolley-2013][^watkins-2008].
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Third, both Sellars and McDowell claim that it is simply a mistake to think that mental states that are purely the upshot of causal interactions with the world could themselves stand as reasons for empirical belief. Sellars (1963) remarks that such a mistake is “of a piece with the so-called ‘naturalistic fallacy’ in ethics” (146). Sellars himself gives no clear argument for this claim. McDowell focuses on the distinction between the kind of mental state for which its bearer is in some way responsible, such as a belief, and the kind of state that simply happens to one, like a headache (McDowell 1996: chs. 1–2; 1998: 433–434; 2004: 80–85; cf. Engstrom 2006: 8–13)[^engstrom-2006][^mcdowell-1996]. The suggested parallel in an Intellectualist reading of Kant is that if intellectual capacities are necessary for the occurrence of perceptual experience, then experience is not merely something that causally happens to the subject but rather is something for which the subject herself is at least partially responsible, in much the same way that she is responsible for her endorsement in belief of the content of a propositional judgment. It is certainly a centrally held tenet of Kant’s critical view that the intellect, including understanding and reason, actively contributes to the content of cognition and the acquisition of knowledge (Paton 1947: 218; Pippin 1987; Allison 1990, 1996: chs. 4, 7 and 9; Willaschek 2006; McLear 2020b)[^allison-1990][^mclear-2020b][^paton-1947][^pippin-1987][^willaschek-2006]. As Kant famously says,
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      > [O]ne cannot possibly think of a reason that would consciously receive direction from any other quarter with respect to its judgments; since the subject would then attribute the determination of his judgment, not to his reason but to an impulse. Reason must regard itself as the author of its principles independently of alien influences. (*Groundwork* 4:448)
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      But it is not at all clear whether appreciation of this point requires Intellectualism. For example, perhaps sensory experiences do not themselves stand as reasons on Kant’s view, but rather provide *access* to the reasons or evidence for holding a particular belief (McLear 2016a: §8.5)[^mclear-2016a], knowledge of the successful reference of the concepts constituting the content of that belief (McLear 2016b: 127–134)[^mclear-2016b], or the possibility of reference *überhaupt* (Allais 2015: ch. 11)[^allais-2015]. Moreover, if Kant does not accept the premise principle or its analogue, this opens up additional possibilities for defending a Sensibilist interpretation of his theory of perception.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      ### 5.2 Non-rational Minds
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      In the discussion of perception in §2 we saw that the case of non-rational animals raises a variety of interpretive challenges. But the animal case also raises special challenges for Intellectualism, for it is not clear how Intellectualism is compatible with attributing representations of *any sort* to non-rational beings.
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      Kant is extremely clear on the point that non-rational animals lack an intellect, in the sense that they lack the capacity for use of the first-person concept, and with it any of the ‘higher’ cognitive faculties of understanding, judgment, or reason (*An* 7:127; LM 28:277 (c. 1777–80); LA 25:1215 (c. 1784/5)). Hence, if one were to deny that, according to Kant, sensibility alone is capable of producing mental states that were cognitively significant in character, then it would seem that any animal that lacks a faculty of understanding, and thus the capacity for any intellectual or conceptual synthesis, would thereby lack not only a capacity for thought but also any capacity for perceptual experience. The mental lives of non-rational animals would thus, at best, consist of essentially unconscious, non-cognitive sensory states that causally correlate with changes in the animal’s environment. It is not clear that we should characterize such states as representations, in Kant’s sense, at all.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      Aside from what we now consider to be a straightforwardly false characterization of the cognitive capacities of animals, this non-cognitive reading faces textual hurdles. Kant claims that animals enjoy mental representations, and that postulating such representations is necessary for explaining sophisticated animal behavior. Kant is on record in various places as saying that animals have sensory representations of their environment (CPJ 5:464; cf. An 7:212), that they have intuitions (LM 28:449 (c. 1784/85); LM 28:594 (c. 1790/91); LL 24:702 (c. 1792); OP 21:82), and that they are acquainted with objects though they do not cognize them (JL 9:64–5; see also *Notes on Logic* 16:342–4 (c. mid/late 1760s); LL 24:845ff (c. 1780–1); LL 24:730–1 (c. 1792)). However, interpretation of these texts, and others, is not uncontested (e.g., Fisher 2017; van den Berg 2018; see also the sources cited in §2 above)[^berg-2018][^fisher-2017]. It is also not entirely clear that Kant’s views on this matter remain consistent throughout his career, with some arguing that at least his pre-critical views are clearly incompatible with a cognitivist position regarding animal minds (Leland 2018a,b)[^leland-2018a].
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      If it is correct to read Kant as at least entertaining the possibility of a cognitivist position regarding animal minds, then Intellectualism faces a challenge. Intellectualism construes Kant as claiming that synthetic acts carried out by the intellect are necessary for the cognitive standing of a mental state. But if this is correct then—on the cognitivist reading of the animal mind—Kant is contradicting fundamental elements of his own position in crediting intuitions (or their possibility) to non-rational animals. In contrast Sensibilism has no problem accommodating the possibility that animals have representations of their environment, and that these representations are (potentially) conscious and thus count as intuitions.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      One way of replying to this challenge that may not require endorsing non-cognitivism with respect to animal minds is to allow that non-rational minds may well have some way of representing the world, but posit that rational minds constitute an *altogether different kind* of mind than their non-rational counterparts. On this view, rational and non-rational animality are conceived as two completely different species of animality whose generic similarity does not require that there share any of the same fundamental mental capacities (Herder 1772 [2002: 81–87]; Hegel 1830/1991: §2; McDowell 1996: ch. 6; Boyle 2012, 2016, 2017; Conant 2016; Land 2018)[^boyle-2012][^conant-2016][^land-2018][^mcdowell-1996]. On this view, “rational” does not specify some characteristic among others of a creature, but rather its “distinctive manner of having characteristics” (Boyle 2012: 410)[^boyle-2012]. Thus rationality “transforms” the manner in which a rational creature has other kinds of mental state (e.g., experience and desire) and is not merely added to an otherwise independently characterizable stock of the creature’s mental powers.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Moreover, according to its proponents, a central reason for holding this “transformative” view of rationality is that it is the only way to explain how sensory experience and desire can play properly rationalizing roles in our cognition and action (Boyle 2016; see also §5.1)[^boyle-2016]. And since rational and non-rational minds are construed as radically different, this view allows that non-rational minds might have their own sorts of (non-rational) intuitive representations, thus avoiding any attribution of contradictory claims to Kant. The “transformative” label is itself highly contentious, and it is not obvious that a Sensibilist position cannot co-opt the label for itself (Schafer 2021, McLear 2023)[^mclear-2023].
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      Alternatively, one broadly sympathetic to Intellectualism might argue that sensibility depends on the intellect in a specifically *teleological* sense (Schafer 2021, 2023b; Pendlebury 2021)[^pendlebury-2021]. On this sort of approach the aims of sensibility are different in a being with an intellect than in a being without. Depending on one’s view of the individuation of the faculties, this difference in end results in a difference in the essence or nature of sensibility, and thus, in this specific sense, are the sensible capacities of a human being “transformed”. However it unclear that this approach remains consistent with Kant’s own views, or avoids collapse into one of the other “transformative” views discussed above (McLear 2023)[^mclear-2023].
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
