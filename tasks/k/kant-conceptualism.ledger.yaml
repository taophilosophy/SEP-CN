      When inquiring about the nature of the relationship between the intellect and sense experience it is important to keep in mind the technical sense with which Kant uses various terms, as introduced above. There are at least two reasons for doing so. First, to be as clear as we can regarding Kant’s understanding of his own theory. Second, to avoid confusion regarding the relation between Kant’s conception of such terms and our modern Anglophone tradition of use. This latter issue is especially significant since, as we’ve already seen, it is not at all clear that Kant’s conception of “experience” admits of straightforward translation into our modern notion. For example, Kant is clear that “experience,” in his sense of an “empirical cognition” (*empirische Erkenntnis*), includes conceptual synthesis, since such synthesis is what binds the various elements of an empirical cognition together such that they are non-arbitrarily connected (see, e.g., B12, B161, B201, B218, and B233). As a result, all should concede that his usage of “experience” (*Erfahrung*) and “empirical cognition” (*empirische Erkenntnis*) typically is meant in a way that assumes a cognitive contribution in the form of conceptual synthesis by the understanding (Allais 2016: 4)[^allais-2016]. Thus, and rather confusingly, if there is a debate to be had concerning Kant’s view of the conceptual or intellectual character of “experience” in its contemporary English sense of a kind of phenomenally conscious state, it may well be located at somewhere other than the level of “experience” in Kant’s technical sense (though for worries about our contemporary philosophical usage of “experience” see Byrne 2009)[^byrne-2009].
    step1: |-
      在探究知性与感官经验之关系的本性时，重要的是记住上文所介绍的康德对各术语的技术性用法。这样做至少有两个理由。第一，尽可能清楚地把握康德对其自身理论的理解。第二，避免在康德对这些术语的构想与我们现代英语传统的用法之间产生混淆。后一问题尤其重大，因为如前所见，康德的“经验”构想是否可直截了当地译入我们的现代概念，完全不显然。例如，康德清楚地说，他意义上的“经验”即“经验认识”（*empirische Erkenntnis*）包含概念性综合，因为正是这种综合把经验认识的各种要素结合起来，使它们以非任意的方式相连（例如见 B12, B161, B201, B218, B233）。因此，所有人都应承认：康德对“经验”（*Erfahrung*）与“经验认识”（*empirische Erkenntnis*）的用法，通常预设了以知性所作概念性综合为形式的认识贡献（Allais 2016: 4）[^allais-2016]。于是（颇令人困惑），若有一场关于康德如何看待“经验”之概念性或理智品格的争论——这里“经验”取当代英语中某种现象上有意识状态之义——它很可能不在康德技术意义上的“经验”层面（尽管对当代“经验”哲学用法的疑虑见 Byrne 2009）[^byrne-2009]。
    step2: |-
      探究知性与感官经验的关系，须牢记上文交代的康德术语之技术义。理由有二：一是尽量厘清康德对自家理论的理解；二是免于把康德的构想同现代英语传统的用法搅混。后一点尤要，因为如前所见，康德的“经验”概念能否径直译成我们的现代概念，实在不显然。比如，康德明说，他意义上的“经验”即“经验认识”（*empirische Erkenntnis*）含有概念综合——正是这种综合把经验认识的各要素绑在一起，使它们非任意地相关联（例如 B12、B161、B201、B218、B233）。所以大家都该承认：康德用“经验”（*Erfahrung*）与“经验认识”（*empirische Erkenntnis*）时，通常已预设知性以概念综合形式作出的认识贡献（Allais 2016: 4）[^allais-2016]。由此（不免令人困惑），若有人就“经验”的概念性或理智品格争论不休——此“经验”取当代英语里某种现象上有意识状态之义——那么争论恐怕并不落在康德技术义的“经验”层面（关于当代“经验”用法的疑虑，见 Byrne 2009）[^byrne-2009]。
