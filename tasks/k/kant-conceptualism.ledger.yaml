      ## 4. Frame II: Dependence on the Intellect
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      The alternative frame for understanding the relation between intuition (and ultimately perception and experience as well) and concept eschews any focus on representational content per se. Instead, it frames the debate in terms of various cognitive abilities a subject might possesses and the way in which intuition is or is not dependent upon such abilities either for its generation or for the kind of structure it possesses.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      ### 4.1 Intellectualism & Sensibilism
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      The alternative frame distinguishes two broad camps, each of which construes these dependence conditions differently (see McLear 2015, 2016a; Gomes 2017a)[^gomes-2017a][^mclear-2015]. On the one side is “Intellectualism” (see, e.g., McDowell 1996; Longuenesse 1998; Grüne 2009; Friedman 2015; Conant 2016; Indregard 2021)[^conant-2016][^friedman-2015][^grüne-2009][^indregard-2021][^longuenesse-1998][^mcdowell-1996] and on the other is “Nonintellectualism” or “Sensibilism” (Rohs 2001; Hanna 2005; McLear 2015; Allais 2015: 148ff, 2017a; Tolley 2019)[^allais-2015][^hanna-2005][^mclear-2015][^rohs-2001][^tolley-2019].
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      **Intellectualism:** the generation of intuition is at least partly dependent on the intellect.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      **Sensibilism:** at least some intuitions are generated independently of the intellect itself
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      According to Sensibilism at least some objective sensory states, including the “pure” representations of space and time, possess structure which is not the product of the activity of the “intellect” so construed, and so do not depend for their structure or unity on the pure apperceptive power or downstream manifestations of that power in conceptualization, judgment, or inference.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Here, as above, “intellect” is understood as the generic term for the “higher” cognitive faculties which include understanding, judgment, and reason. Kant often characterizes these faculties as “spontaneous” or essentially “active”, in contrast to the “receptive” or essentially “passive” character of sensibility (e.g., A50–1/B74–5). How exactly these distinctions should be understood is controversial. Part of the problem comes in determining how to construe activity of the mind that is not overtly “conceptual”, in the sense that it does not consist in application of concepts in judgment, but nevertheless still involves a rule-governed synthesis, or is otherwise dependent on a spontaneous power for combining representations that is not present in sensibility (B129–30). There does not yet seem to be a settled consensus on this point.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      However, one potential means of explaining what “dependence on the intellect” comes to is dependence on the power of (pure) apperception. Kant consistently characterizes the power of apperception and the unity it brings about as the “original” or unconditioned condition of all employment of concepts, including the categories (B131, B133–4n, A401–2). Indeed, Kant explicitly states that “the possibility of the logical form of all cognition necessarily rests on the relationship to this apperception as a faculty” (A117n) and that even the “possibility of the understanding itself” rests on the pure unity of consciousness made possible by the power of apperception (B137; see also *Metaphysik Mrongovius* 29:889 (1782–1783)).
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      Kant does occasionally say that the actualization of the apperceptive power, in the synthetic unity of understanding, depends on the use of the categories (e.g., B145–6). This might make Kant’s account seem circular, with the understanding depending on apperception which in turn depends on the understanding, as the faculty of synthesis. But Kant can hold that while the power or faculty of pure apperception is distinct from any of its actualizations, when it is so actualized it entails a synthetic combination via the categories (B143, B144). Thus the fact that apperception does not occur without the categorial synthesis doesn’t mean that apperception is grounded in such synthesis. This way Kant can both say that the understanding is made possible by the power of apperception, and that apperception (as actualized unity) depends on—in the sense that it cannot actualize without—conceptual/categorial synthesis.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      This dependence of the understanding (and hence the logical form of all cognition) on the power of apperception contrasts with the receptive faculty of sensibility, whose activities, at least in their generic conception, are not defined as depending on the existence of an apperceptive power capable of bringing about such a unity of consciousness. Thus to say that the generation of intuition is at least partially dependent on the intellect is, on the current proposal, to say one of two things. Either, that the intuition depends on the exercise of the power or capacity for apperception itself, or that intuition depends on the exercise of one or more capacities whose possibility rests on the pure power of apperception. This allows for significant flexibility in the way in which the Intellectualist might express their position, while still providing unity to the overall approach.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      According to this framing, Sensibilism and Intellectualism can agree that sensing and thinking involve distinct (and distinctive) cognitive abilities. In this regard, Sensibilism is not to be confused with a crude empiricism. Moreover, both Sensibilism and Intellectualism explain the generation and structure of representations or mental states at least partly in terms of the relevant cognitive capacity or faculty. The key difference is that Intellectualism construes the structure and generation of intuitive representations as dependent not only on sensibility but also on some intellectual capacity. For the Intellectualist, the only representations which do not admit of this dependence are the simple sensations that are the supposed initial product of sensibility (e.g., the sensations of “sheer receptivity” in Sellars 1968: ch. 1)[^sellars-1968].
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      ### 4.2 Benefits of Reframing the Debate in Terms of Intellectual Dependence
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Proponents of the second frame have argued that there are a variety of benefits of recasting the concept-intuition debate in this way. First, it avoids requiring any attribution to Kant of the controversial assumption that intuition essentially has a correctness condition that could be the object of epistemic attitudes. Of course, a proponent of Intellectualism might argue to the conclusion that intuitions essentially have correctness conditions as a result of their generation by acts of synthesis. But such a position would be an outcome of the Intellectualist’s argument, rather than as an assumption thereof.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Second, the framework allows for a wide plurality of nevertheless related ways in which intuition, perception, and experience might depend on (or be independent from) the intellect. For example, intuition might depend on a *pre-conceptual* pure apperceptive power to unify one’s representations (e.g., Waxman 2014)[^waxman-2014], while perception depends on the recognition of what is so unified in a concept, though not yet in an explicit judgment (e.g., Gomes 2017a)[^gomes-2017a], and experience on the predication of that concept in an act of judgment (e.g., Strawson 1970)[^strawson-1970]. Now, instead of thinking of this series as three distinct positions, two of which are “conceptualist”, and one of which is “judgmentalist”, we can construe them as each developments of a single Intellectualist position. The Intellectualism/Sensibilism frame thus provides a way of unifying a variety of different approaches around a single central “bright line” distinction (McLear 2015, 2016a; Gomes 2017a; Indregard 2021)[^gomes-2017a][^indregard-2021][^mclear-2015].
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Even with respect to the single issue of the generation of intuition, we can see a plurality of ways in which an Intellectualist view might be developed, in increasing order of demandingness. First, we have those that construe the dependence of intuition on the power of apperception itself, prior to how that power is manifested in discursive acts of conceptualization, judgment, and inference (e.g., Waxman 1991, 2014; Longuenesse 1998; Messina 2014; Friedman 2015)[^friedman-2015][^longuenesse-1998][^messina-2014][^waxman-1991]. Second, we have positions according to which intuition depends on the application of a concept, but not in judgment (e.g., Grüne 2009; Land 2015a; McDowell 1998)[^grüne-2009][^land-2015a][^mcdowell-1998]. Third, we have positions according to which intuition depends on overt acts of judgment (e.g., Strawson 1970; Pippin 1982: 28)[^pippin-1982][^strawson-1970]. While there are obvious and important differences between these views, they are all united by a commitment to construing intuition as the outcome of a process that depends upon the intellectual capacity to unify one’s mental states as one and all states of single self-conscious individual.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      Similarly, positions that might be grouped together as “nonconceptualist” according to the first frame are, on this frame, organized quite differently. For example, a variety of interpreters reject the position that pure intuition depends on a conceptual synthesis (e.g., Longuenesse 1998: ch. 8; Waxman 2014; Allais 2015: ch. 7; McLear 2015; Friedman 2015; Golob 2016a)[^allais-2015][^friedman-2015][^golob-2016a][^longuenesse-1998][^mclear-2015][^waxman-2014]. According to the Conceptualism frame, one might thus think of these positions as all in agreement concerning a basic (and controversial) element of Kant’s view, and thus all as forms of ‘Nonconceptualism’. However, these positions in fact radically *disagree* concerning whether intuition is dependent on the intellect. Their disagreement hinges on the issue of the dependence of intuition on intellectual acts *per se* rather than on conceptual content or conceptual synthesis (for further discussion see §5 below). So, according to the second frame, interpreters who consider intuition to depend on *non*conceptual but still *intellectual* acts (e.g., Longuenesse 1998; Waxman 2014; Indregard 2021)[^indregard-2021][^longuenesse-1998][^waxman-2014] will be put on the Intellectualist side while those who reject such dependence (e.g., Allais 2015; McLear 2015)[^allais-2015][^mclear-2015] will be put on the Nonintellectualist or Sensibilist side. Within Sensibilism there may be significant differences between how different interpreters construe the manner in which intuition gives an object for cognition, or in the manner in which perception and experience are generated from mental acts performed on intuition (compare, e.g., Allais 2017a and Tolley 2019)[^allais-2017a][^tolley-2019], but all will agree on the fundamental point that intuition may be generated independently of any intellectual act.
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      Intellectualism thus captures much of what seems to have originally motivated Conceptualism, but without appealing to problematic conceptions of ‘content’, and allowing that there may be a way that the intellect plays a role in sense experience apart from overt conceptual judgment concerning that experience. Recall that two motivations underlying the dispute between Conceptualism and Nonconceptualism concerned, first the justificatory or broader rational role of sense experience with respect to belief or judgment and, second, the most plausible way of interpreting Kant’s argument in the Transcendental Deduction. These motivations remain present in the dispute between Sensibilism and Intellectualism. Hence, the substantive motivations of Conceptualism remain even if the framing regarding representational content is dropped in favor of focus on dependence on the intellect.
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Thus, the division between Intellectualism and Sensibilism concerning the dependence of intuition on the pure apperceptive power and/or those intellectual capacities downstream from it captures a central point (and perhaps *the* central point) of contention between an otherwise large plurality of views, and in this way helps to organize a dispute that might otherwise seem to lack unity. In the next section we look at what have emerged as the most promising, central, or stubborn points of dispute between these two camps.
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      ## 5. Points of Dispute
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      This section canvasses eight different areas of dispute between contemporary interpreters of Kant concerning the contributions of sensibility and intellect to cognition. Each dispute is presented in terms of the second, dependence, frame (i.e Intellectualism vs. Sensibilism). However, proponents of the first, content, frame (i.e., Conceptualism vs. Nonconceptualism) will also see these different areas of dispute as relevant, given that many of their concerns remain in the motivation for holding one form or another of Intellectualism. That said, particularly important points of discrepancy between the two frames’ approaches to the issues will be noted below.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      ### 5.1 Experience & Justification
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      A central reason for pursuing an Intellectualist reading of Kant is that such a reading is taken (most notably by Sellars and McDowell) to be the best or even only way to secure an explanation of how perception can play a justificatory rather than merely causal role in the adoption of empirical belief. If intuition is autonomous of intellectual capacities, so the objection goes, it cannot play a justificatory role in the acquisition or adoption of empirical belief. Versions of this objection have often, since Wilfred Sellars’ famous paper (Sellars 1956, reprinted in Sellars 1963)[^sellars-1956][^sellars-1963], gone under the moniker of the “Myth of the Given” (McDowell 1996, 1998, 2007b, 2008)[^mcdowell-1996]. While it is not straightforward as to how Kant’s texts or arguments yield any substantive connection with the concerns articulated by Sellars and McDowell, this entry examines three possible ways of understanding such a connection.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      The exact nature of objections to a supposedly mythical “Given” vary, as do their putative connections to Kant’s arguments (Watkins 2008, 2012)[^watkins-2008]. One objection made by Sellars is that justifiers for belief must have a compositional, fact-like structure that mirrors the propositional structure of belief. Sensory experiences (understood as sensations), on Sellars’ view, are particulars rather than facts and so cannot play any justificatory role (Sellars 1963: 128; cf. BonJour 1985: ch. 4)[^bonjour-1985][^sellars-1963]. Thus, the view goes, if the belief caused by an experience (such as the belief you might have that there is a computer screen before you) and thereby adopted by you is also to be justified by that experience, then the experience itself must be able to function as a premise in an argument for which the relevant belief is the conclusion. This is the “premise principle,” as it has been called in contemporary epistemology (Pryor 2005)[^pryor-2005]. Acceptance of the premise principle thus plays a significant role in motivating the position that sensory experience without propositional (i.e., conceptual) content cannot justify belief.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      A passage in Kant typically adduced in support of this point is the “same function” passage at A79/B104–5 (e.g., Sellars 1968: 4–5; McDowell 2004: 79; Haag 2007: 150–151, 199, and ch. 8; Kalderon 2011: 235–236; cf. Pippin 1982: 99–101; Heidegger 1997: 45–46; Longuenesse 1998: 200; Grüne 2009: 107–111)[^grüne-2009][^haag-2007][^heidegger-1997][^kalderon-2011][^longuenesse-1998][^mcdowell-2004][^pippin-1982][^sellars-1968]. On this reading of Kant, sense experience would have the requisite proposition-like structure, and thus be capable of standing in justificatory relations to beliefs, only if the same capacities that structure the contents of judgment for Kant (viz. the logical forms) would also structure sensory experience (via application of the categories). While such interpreters are surely correct that Kant’s aim, as exemplified in that passage, is to show that the very same cognitive capacities that connect representations in a mental act of judging are also in play in the connection of representations in a sensory experience, it is not obvious how the passage directly supports any argument concerning the epistemic significance of sensory experience to empirical belief and knowledge. What is particularly unclear is whether Kant endorses the premise principle in the substantive manner required for the Sellars/McDowell position. Hence, further work needs to be done to show that Kant actually (or even counterfactually) endorses the premise principle.
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      A second objection against the Given, which might also be attributed to Kant, is that the mere occurrence of a sensory experience cannot justify any particular belief that is the causal result of that experience. Instead, sensory experience can only play its justificatory role against a background of concepts possessed by the experiencing subject (Sellars 1963: 170; McDowell 1998: 435–436)[^mcdowell-1998][^sellars-1963]. Though this position is often taken to support some form of Intellectualism (e.g., McDowell 1996; Ginsborg 2006b)[^ginsborg-2006b][^mcdowell-1996], it is also compatible with forms of Sensibilism that construe the conditions for empirical knowledge as resting at least in part on the possession of intellectual capacities, even if such capacities are not necessary for perceptual intentionality as such (e.g., Hanna 2001: 46–65; 2005: 256–257; Bird 2006: 193–207; Watkins 2008, 2012; Allais 2009: 392–394; Tolley 2013: 125–127; McLear 2015: 98–106, 2020a; Golob 2016a, 2020)[^allais-2009][^bird-2006][^golob-2016a][^hanna-2001][^mclear-2015][^tolley-2013][^watkins-2008].
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Third, both Sellars and McDowell claim that it is simply a mistake to think that mental states that are purely the upshot of causal interactions with the world could themselves stand as reasons for empirical belief. Sellars (1963) remarks that such a mistake is “of a piece with the so-called ‘naturalistic fallacy’ in ethics” (146). Sellars himself gives no clear argument for this claim. McDowell focuses on the distinction between the kind of mental state for which its bearer is in some way responsible, such as a belief, and the kind of state that simply happens to one, like a headache (McDowell 1996: chs. 1–2; 1998: 433–434; 2004: 80–85; cf. Engstrom 2006: 8–13)[^engstrom-2006][^mcdowell-1996]. The suggested parallel in an Intellectualist reading of Kant is that if intellectual capacities are necessary for the occurrence of perceptual experience, then experience is not merely something that causally happens to the subject but rather is something for which the subject herself is at least partially responsible, in much the same way that she is responsible for her endorsement in belief of the content of a propositional judgment. It is certainly a centrally held tenet of Kant’s critical view that the intellect, including understanding and reason, actively contributes to the content of cognition and the acquisition of knowledge (Paton 1947: 218; Pippin 1987; Allison 1990, 1996: chs. 4, 7 and 9; Willaschek 2006; McLear 2020b)[^allison-1990][^mclear-2020b][^paton-1947][^pippin-1987][^willaschek-2006]. As Kant famously says,
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      > [O]ne cannot possibly think of a reason that would consciously receive direction from any other quarter with respect to its judgments; since the subject would then attribute the determination of his judgment, not to his reason but to an impulse. Reason must regard itself as the author of its principles independently of alien influences. (*Groundwork* 4:448)
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      But it is not at all clear whether appreciation of this point requires Intellectualism. For example, perhaps sensory experiences do not themselves stand as reasons on Kant’s view, but rather provide *access* to the reasons or evidence for holding a particular belief (McLear 2016a: §8.5)[^mclear-2016a], knowledge of the successful reference of the concepts constituting the content of that belief (McLear 2016b: 127–134)[^mclear-2016b], or the possibility of reference *überhaupt* (Allais 2015: ch. 11)[^allais-2015]. Moreover, if Kant does not accept the premise principle or its analogue, this opens up additional possibilities for defending a Sensibilist interpretation of his theory of perception.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      ### 5.2 Non-rational Minds
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      In the discussion of perception in §2 we saw that the case of non-rational animals raises a variety of interpretive challenges. But the animal case also raises special challenges for Intellectualism, for it is not clear how Intellectualism is compatible with attributing representations of *any sort* to non-rational beings.
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      Kant is extremely clear on the point that non-rational animals lack an intellect, in the sense that they lack the capacity for use of the first-person concept, and with it any of the ‘higher’ cognitive faculties of understanding, judgment, or reason (*An* 7:127; LM 28:277 (c. 1777–80); LA 25:1215 (c. 1784/5)). Hence, if one were to deny that, according to Kant, sensibility alone is capable of producing mental states that were cognitively significant in character, then it would seem that any animal that lacks a faculty of understanding, and thus the capacity for any intellectual or conceptual synthesis, would thereby lack not only a capacity for thought but also any capacity for perceptual experience. The mental lives of non-rational animals would thus, at best, consist of essentially unconscious, non-cognitive sensory states that causally correlate with changes in the animal’s environment. It is not clear that we should characterize such states as representations, in Kant’s sense, at all.
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      Aside from what we now consider to be a straightforwardly false characterization of the cognitive capacities of animals, this non-cognitive reading faces textual hurdles. Kant claims that animals enjoy mental representations, and that postulating such representations is necessary for explaining sophisticated animal behavior. Kant is on record in various places as saying that animals have sensory representations of their environment (CPJ 5:464; cf. An 7:212), that they have intuitions (LM 28:449 (c. 1784/85); LM 28:594 (c. 1790/91); LL 24:702 (c. 1792); OP 21:82), and that they are acquainted with objects though they do not cognize them (JL 9:64–5; see also *Notes on Logic* 16:342–4 (c. mid/late 1760s); LL 24:845ff (c. 1780–1); LL 24:730–1 (c. 1792)). However, interpretation of these texts, and others, is not uncontested (e.g., Fisher 2017; van den Berg 2018; see also the sources cited in §2 above)[^berg-2018][^fisher-2017]. It is also not entirely clear that Kant’s views on this matter remain consistent throughout his career, with some arguing that at least his pre-critical views are clearly incompatible with a cognitivist position regarding animal minds (Leland 2018a,b)[^leland-2018a].
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      If it is correct to read Kant as at least entertaining the possibility of a cognitivist position regarding animal minds, then Intellectualism faces a challenge. Intellectualism construes Kant as claiming that synthetic acts carried out by the intellect are necessary for the cognitive standing of a mental state. But if this is correct then—on the cognitivist reading of the animal mind—Kant is contradicting fundamental elements of his own position in crediting intuitions (or their possibility) to non-rational animals. In contrast Sensibilism has no problem accommodating the possibility that animals have representations of their environment, and that these representations are (potentially) conscious and thus count as intuitions.
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      One way of replying to this challenge that may not require endorsing non-cognitivism with respect to animal minds is to allow that non-rational minds may well have some way of representing the world, but posit that rational minds constitute an *altogether different kind* of mind than their non-rational counterparts. On this view, rational and non-rational animality are conceived as two completely different species of animality whose generic similarity does not require that there share any of the same fundamental mental capacities (Herder 1772 [2002: 81–87]; Hegel 1830/1991: §2; McDowell 1996: ch. 6; Boyle 2012, 2016, 2017; Conant 2016; Land 2018)[^boyle-2012][^conant-2016][^land-2018][^mcdowell-1996]. On this view, “rational” does not specify some characteristic among others of a creature, but rather its “distinctive manner of having characteristics” (Boyle 2012: 410)[^boyle-2012]. Thus rationality “transforms” the manner in which a rational creature has other kinds of mental state (e.g., experience and desire) and is not merely added to an otherwise independently characterizable stock of the creature’s mental powers.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Moreover, according to its proponents, a central reason for holding this “transformative” view of rationality is that it is the only way to explain how sensory experience and desire can play properly rationalizing roles in our cognition and action (Boyle 2016; see also §5.1)[^boyle-2016]. And since rational and non-rational minds are construed as radically different, this view allows that non-rational minds might have their own sorts of (non-rational) intuitive representations, thus avoiding any attribution of contradictory claims to Kant. The “transformative” label is itself highly contentious, and it is not obvious that a Sensibilist position cannot co-opt the label for itself (Schafer 2021, McLear 2023)[^mclear-2023].
    step1: TBD
    step2: TBD
  - id: 115
    kind: body
    source: |-
      Alternatively, one broadly sympathetic to Intellectualism might argue that sensibility depends on the intellect in a specifically *teleological* sense (Schafer 2021, 2023b; Pendlebury 2021)[^pendlebury-2021]. On this sort of approach the aims of sensibility are different in a being with an intellect than in a being without. Depending on one’s view of the individuation of the faculties, this difference in end results in a difference in the essence or nature of sensibility, and thus, in this specific sense, are the sensible capacities of a human being “transformed”. However it unclear that this approach remains consistent with Kant’s own views, or avoids collapse into one of the other “transformative” views discussed above (McLear 2023)[^mclear-2023].
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      ### 5.3 The ‘Blindness’ of Intuition
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Perhaps the most obvious objection to the Sensibilist reading of intuition as autonomous from the intellect stems from Kant’s famous statement that
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      > Intuition and concepts therefore constitute the elements of all our cognition [*Erkenntnis*] … Thoughts without content [*Inhalt*] are empty, intuitions without concepts are blind… The understanding is not capable of intuiting anything, and the senses are not capable of thinking anything. Only from their unification can cognition arise. (A50–51/B74–75)
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      The so-called “blindness” problem raises two issues: first, that intuitions without concepts or conceptual synthesis are not intentional states (George 1981; Pereboom 1988; Grüne 2009)[^george-1981][^grüne-2009][^pereboom-1988] and so cannot provide the mind with relation to an object and, second, that we cannot even *identify* the cognitive contribution made by sensory experience independent of its conceptualization (Falkenstein 1995; McDowell 1996: 51; Pippin 2005; cf. Bird 2006: ch. 7.2)[^bird-2006][^falkenstein-1995][^mcdowell-1996][^pippin-2005].
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Concerning the first point, one question is whether Kant is really concerned with the conditions of intentionality *per se* (Van Cleve 1999: 95–97)[^van-1999], or merely with the conditions under which a certain kind of rational relation to objects is possible, one that could support rational cognition and the acquisition of scientific knowledge. On this latter reading Kant’s talk of “relation to an object” takes on a specific and technical significance that should not be confused with intentionality *per se* (Hanna 2005; Allais 2015: ch. 7; McLear 2020a)[^allais-2015][^hanna-2005][^mclear-2020a]. There is no settled consensus on this issue, but the fact that intuition is “blind” does not seem to entail the strong position that intuition fails to provide *any* awareness of a mind-independent object.
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      Allais (2009: 393–4; 2015: ch. 7) has argued against both the first and second points, pointing out that if we take Kant’s definition of intuition (and likewise of concepts) seriously, then we must be able to identify an independent contribution of sensibility to cognition—viz. singular and immediate representation of an object—lest we fail to make sense of Kant’s division between intuition and concept (cf. Kolb 1986; Falkenstein 1995: 63)[^falkenstein-1995][^kolb-1986]. Relatedly, others have remarked on the oddness of denying the possibility of articulating the distinct contribution made by sensibility given that Kant goes so far as to organize the structure of argument in the first *Critique* around the distinction between those contributions made by sensibility (the Transcendental Aesthetic) and those made by the understanding (the Transcendental Logic, and in particular, the Analytic) (e.g., Bird 2006: 127; but cf. Bauer 2012; Conant 2016)[^bauer-2012][^bird-2006][^conant-2016]. The claim of “blindness,” it is thus argued, should not be interpreted as so extreme as to render unintelligible fundamental aspects of Kant’s architectonic, or of his repeated statements concerning the individual cognitive roles of the faculties of sensibility and understanding.
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      On an alternative and much weaker conception of the blindness problem, the “blindness” of intuition might well only concern the difficulties involved in articulating the nature of sensory content without drawing on concepts in the process of providing the articulation. As Bird (2006: 129–130) notes however, this can be conceded without thereby admitting that there is no sensory content (or positive cognitive contribution) independent of conceptual articulation.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      ### 5.4 Mathematical Construction
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      There has been extensive discussion of the non-conceptuality of intuition in the secondary literature on Kant’s philosophy of mathematics. For example, Michael Friedman has argued that the expressive limitations of the prevailing logic in Kant’s time required the postulation of intuition as a form of singular, non-conceptual representation (Friedman 1992: ch. 2)[^friedman-1992]. Charles Parsons (1964, 1992a) and Emily Carson (1997, 1999) have argued that space must be given in a phenomenological manner as an original, non-conceptual representation in order that we be able to demonstrate the real possibility of constructed mathematical objects as required for geometric knowledge (cf. Shabel 2010: 100–102)[^shabel-2010]. All of this at least suggests that Kant’s conception of mathematical construction includes an important nonconceptual element.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Ultimately, however, there are difficulties in assessing whether Kant’s philosophy of mathematics can be decisive for the debate concerning the dependence of intuition on the intellect. One issue is that the sense in which intuition must be nonconceptual in accounting for mathematical knowledge is not obviously incompatible with claiming that intuitions themselves (including pure intuition; see §5.6 below) are dependent upon a conceptually guided synthesis (e.g., Land 2014)[^land-2014]. A second issue is that one might agree that intuitions are in some sense “nonconceptual” while holding that the pure forms of intuition (as discussed in the relevant Metaphysical Expositions in the Transcendental Aesthetic) are themselves generated by a non- or pre-conceptual synthesis by the intellect, or the imagination as a function thereof (e.g., Waxman 1991; Longuenesse 1998: ch. 8; Friedman 2012, 2015, 2019)[^friedman-2012][^longuenesse-1998][^waxman-1991]. Such views are forms of Intellectualism even if they reject the claim that intuition, in making synthetic a priori knowledge in mathematics possible, possesses conceptual content or is otherwise conceptually dependent.
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      Hence, the sense in which the dependence relation alluded to by Kant in claiming that mathematical principles are “derived from” (A160/B199) pure intuition is one that seems open to both Intellectualist and Sensibilist interpretations (cf. Shabel 2017)[^shabel-2017]. Thus it is unclear whether mathematical considerations could be decisive in adjudicating the debate between Intellectualism and Sensibilism.
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      ### 5.5 The Transcendental Deduction
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      The argument of the Transcendental Deduction, and its relation to the Transcendental Aesthetic (and thus to Kant’s philosophy of Mathematics), is a central area of dispute between Sensibilism and Intellectualism (Waxman 1991; Longuenesse 1998; Allais 2016: §1.5; Golob 2016b; Allais 2017b)[^allais-2016][^allais-2017b][^golob-2016b][^longuenesse-1998][^waxman-1991]. Critics charge that Sensibilism at best renders ineffectual Kant’s apparent strategy for demonstrating the legitimacy of the categories in the argument of the Transcendental Deduction and at worst shows Kant to be totally confused in his argumentative strategy (Ginsborg 2008: 68–69; Griffith 2012; Gomes 2014; Land 2015a; cf. Hegel 1977: 69–72; Pippin 1989: 29–31; Keller 1998: 107–112, 254; McDowell 2004, 2007a)[^ginsborg-2008][^gomes-2014][^griffith-2012][^hegel-1977][^keller-1998][^land-2015a][^mcdowell-2004][^pippin-1989]. However, since interpretation of the argument of the Deduction is at least as controversial as any claim made by either side of the dispute, dialectical traction on the basis of the text of the Deduction itself is difficult to come by.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      The basic approach required by Intellectualism sees Kant’s strategy for legitimating the categories, however else the details are construed, as culminating in the argument that even the pure intuitions of space and time (i.e., the representations that are the topic of their respective Metaphysical Expositions in the Transcendental Aesthetic) depend for their generation on intellectual, though not obviously conceptual, activity.
    step1: TBD
    step2: TBD
  - id: 130
    kind: body
    source: |-
      Intellectualism interprets Kant as providing this argument in a notoriously difficult footnote in §26:
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      > Space, presented as object (as we are actually required to represent it in geometry), contains more than [the] mere form of intuition—viz. it contains also the gathering together [*Zusammenfassung*] of the manifold given according to the form of sensibility, in an intuitive representation—so that the form of intuition gives us merely a manifold, but formal intuition gives us unity of representation. In the Transcendental Aesthetic I had merely included this unity with sensibility, wanting only to point out that it precedes any concept. But this unity indeed presupposes a synthesis which does not belong to the senses, through which all concepts of space and time first become possible. For through this unity (inasmuch as understanding determines sensibility), space or time is first given as intuitions, and hence, the unity of this intuition belongs a priori to space and time, and not to the concept of understanding (§24). (B160–1, note)
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      Lorne Falkenstein describes this footnote as “so obscure that it can be made to serve the needs of any interpretation whatsoever” because the text is “close enough to exhibiting a contradiction that it makes it possible to get virtually any conclusion one pleases out of the passage with only minor effort” (Falkenstein 1995: 91)[^falkenstein-1995].
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Despite the difficulties presented by the text, the Intellectualist takes the very intelligibility of Kant’s strategy in the Deduction to hinge on the dependence of pure intuition on the intellect (Cohen 1871, 1907; Longuenesse 1998: ch. 8; Dufour 2003; Ginsborg 2008: 69; Bowman 2011: 421; Grüne 2011: 465–466; Friedman 2015; McDowell 2016: 318; Conant 2016: 110)[^bowman-2011][^cohen-1871][^conant-2016][^dufour-2003][^friedman-2015][^ginsborg-2008][^grüne-2011][^longuenesse-1998][^mcdowell-2016]. The idea here is that, by making the pure intuitions of space and time themselves depend on intellectual activity, along with some further connection of that intellectual activity to categorial synthesis, Kant assures his desired conclusion for the Deduction overall—viz. that any possible empirical intuition must depend on the categories and thus that all possible objects of empirical intuition must fall under the categories. The Intellectualist thus construes any approach to reading the Deduction that doesn’t posit such a dependence relation as rendering the argument there hopeless and Kant’s strategy deeply confused. Of note here is the fact that when Kant says that the unity of intuition “precedes any concept” one might plausibly read him as endorsing a form of Nonconceptualism—viz. that the pure intuitions are prior to any conceptual content. However, this nonceptualist point is compatible with Intellectualism since it is possible that the unity of intuition lacks conceptual content but is nevertheless dependent on the intellect in some other sense (e.g., Waxman 1991, 2014; Longuenesse 1998; Messina 2014; Freidman 2015; Indregard 2021)[^indregard-2021][^longuenesse-1998][^messina-2014][^waxman-1991].
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      One issue for the Intellectualist interpretation is that it seems to make the success conditions of the Deduction too easy. If Kant’s project in the Deduction is to show that all intuition, or perhaps more generally “everything that may ever come before our senses” (B160) must stand under the categories (Guyer 2010a; Allison 2015: 407–408)[^allison-2015][^guyer-2010a], then it cannot be the case the intuition is defined in terms of its dependence on the intellect. If intuition were so defined, it would be unclear why anything more than a trivial inference would be needed to show that intuition depends on the intellect. To avoid this Intellectualism must advocate either for a reading of “intuition” that allows for at least two different senses of the term (Sellars 1968: ch. 1)[^sellars-1968] or a “re-reading” of Kant’s initial presentation of the nature of sensibility and the intuitions it provides (Longuenesse 1998: ch. 8; Bauer 2012; Conant 2016)[^bauer-2012][^conant-2016][^longuenesse-1998].
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      Certainly, very basic aspects of the argument of the Deduction, even such as its method and aims (beyond, in some sense, showing the legitimacy of the categories), much less the details and cogency of its specific arguments, are open to significant dispute (e.g., Henrich 1989; Pereboom 1995; Hatfield 2003; Guyer 2010a; Allais 2015: ch. 11)[^allais-2015][^guyer-2010a][^hatfield-2003][^henrich-1989][^pereboom-1995]. Such dispute naturally includes whether Kant’s strategy in the Deduction might well be intelligible in some fashion that does not presuppose or otherwise require Intellectualism. For example, according to various Sensibilist readings, the Deduction might be concerned with conditions governing referential thought (Allais 2015: ch. 11)[^allais-2015] or the representation of a privileged set of spatial and temporal relations beyond those required for objective representation in its most primitive form (Golob 2016b)[^golob-2016b], or the conditions for relating particular property instantiations to some underlying entity (McLear 2015: §3; 2020a)[^mclear-2015]. In each such case, the Deduction is intelligible as attempting to legitimize the categories without adverting to Intellectualism.
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      The Sensibilist case for an alternative reading of the Deduction is abetted by a significant problem with the Intellectualist proposal that the pure intuitions depend on an intellectual unity. This will be examined in the next subsection.
    step1: TBD
    step2: TBD
