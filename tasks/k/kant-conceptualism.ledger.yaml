      严格认识可为纯粹：把纯粹直观的杂多（如空间或时间的纯粹直观）同一个概念（如《先验感性论》空间形而上学阐明中的空间概念）综合起来即是。它也可为经验：把经验直观（如触觉、视觉的直观）同概念综合起来即是。康德常把经验认识称为“经验”（*Erfahrung*；例如 B166、A176/B218、A189/B234）；不过经验直观与概念也在他所谓“知觉”（*Wahrnehmung*）中相关联。
