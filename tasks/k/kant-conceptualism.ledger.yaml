      From these passages we can conclude that concepts are (i) actualizations of the spontaneity of (the power of) thought through which (ii) different representations are ordered under a common one. This ordering is carried out specifically by means of (iii) a judgment. Hence, an act of conceptualization is an act of subordinating one representation “under” another, as a species (or the members thereof) is to its genus (or the members thereof), and it is this subordination relation that is captured in the cognitive activity of judging (Paton 1936: 285; Strawson 1966: 94; Pippin 1982: 33; Longuenesse 1998: ch. 4; Engstrom 2019: 245–252)[^engstrom-2019][^longuenesse-1998][^paton-1936][^pippin-1982][^strawson-1966].
    step1: |-
      从这些段落可以得出结论：概念是（i）思想（的力量）之自发性的实现，借此（ii）不同表象被归置在一个共同表象之下。这种归置具体是借（iii）一个判断来施行的。因此，概念化的行为就是把一个表象隶属于“在”另一个表象“之下”，如同种（或其成员）之于属（或其成员）；而正是这一隶属关系，被判断的认识活动所把握（Paton 1936: 285; Strawson 1966: 94; Pippin 1982: 33; Longuenesse 1998: ch. 4; Engstrom 2019: 245–252）[^engstrom-2019][^longuenesse-1998][^paton-1936][^pippin-1982][^strawson-1966]。
