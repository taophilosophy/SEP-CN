      ### 5.4 Mathematical Construction
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      There has been extensive discussion of the non-conceptuality of intuition in the secondary literature on Kant’s philosophy of mathematics. For example, Michael Friedman has argued that the expressive limitations of the prevailing logic in Kant’s time required the postulation of intuition as a form of singular, non-conceptual representation (Friedman 1992: ch. 2)[^friedman-1992]. Charles Parsons (1964, 1992a) and Emily Carson (1997, 1999) have argued that space must be given in a phenomenological manner as an original, non-conceptual representation in order that we be able to demonstrate the real possibility of constructed mathematical objects as required for geometric knowledge (cf. Shabel 2010: 100–102)[^shabel-2010]. All of this at least suggests that Kant’s conception of mathematical construction includes an important nonconceptual element.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Ultimately, however, there are difficulties in assessing whether Kant’s philosophy of mathematics can be decisive for the debate concerning the dependence of intuition on the intellect. One issue is that the sense in which intuition must be nonconceptual in accounting for mathematical knowledge is not obviously incompatible with claiming that intuitions themselves (including pure intuition; see §5.6 below) are dependent upon a conceptually guided synthesis (e.g., Land 2014)[^land-2014]. A second issue is that one might agree that intuitions are in some sense “nonconceptual” while holding that the pure forms of intuition (as discussed in the relevant Metaphysical Expositions in the Transcendental Aesthetic) are themselves generated by a non- or pre-conceptual synthesis by the intellect, or the imagination as a function thereof (e.g., Waxman 1991; Longuenesse 1998: ch. 8; Friedman 2012, 2015, 2019)[^friedman-2012][^longuenesse-1998][^waxman-1991]. Such views are forms of Intellectualism even if they reject the claim that intuition, in making synthetic a priori knowledge in mathematics possible, possesses conceptual content or is otherwise conceptually dependent.
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      Hence, the sense in which the dependence relation alluded to by Kant in claiming that mathematical principles are “derived from” (A160/B199) pure intuition is one that seems open to both Intellectualist and Sensibilist interpretations (cf. Shabel 2017)[^shabel-2017]. Thus it is unclear whether mathematical considerations could be decisive in adjudicating the debate between Intellectualism and Sensibilism.
    step1: TBD
    step2: TBD
