      The view that space and time are actual entities is meant to represent the Newtonian position, and the view that they are determinations or relations of things, the Leibnizian position (but cf. Hatfield 2006, 77–8)[^hatfield-2006]. Later in the Transcendental Aesthetic, he refers to the Newtonians as the “mathematical investigators” of nature, who contend that space and time “subsist” on their own, and to the Leibnizians as the “metaphysicians of nature,” who think that space and time “inhere” in objects and their relations (see A39–40/B56–57).
    step1: |-
      认为空间与时间是现实存在者的观点，意在代表牛顿的立场；认为它们是事物的规定或关系的观点，则代表莱布尼茨的立场（但参 Hatfield 2006, 77–8）[^hatfield-2006]。在《先验感性论》后文，他把牛顿派称为自然的“数学研究者”，主张空间与时间自行“持存”，而把莱布尼茨派称为“自然的形而上学家”，认为空间与时间“内居”于对象及其关系（见 A39–40/B56–57）。
