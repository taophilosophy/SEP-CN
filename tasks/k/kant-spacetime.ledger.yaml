      Some commentators have noted that Locke—or another classical empiricist—may not be the only focus for Kant’s first argument. At some moments, Leibniz seems committed to the view that the representation of space is constructed from particular perceptions of distance relations (and the like). For instance, in a famous passage in his final letter to Clarke, Leibniz claims that in order to obtain a representation of space, one can consider a system of objects, some of which are in motion, and abstract the notion *same place* from that system.[^note-9] For A and B to occupy the same place is for them to have the same relation to the same bodies in space at different times. Space is what encompasses all such places.[^note-10] Kant’s first argument may have some bite against the view in this passage as well. Whether Kant’s argument also undermines Leibniz’s relationalism about space is a separate issue, and a matter of controversy.[^note-11]
