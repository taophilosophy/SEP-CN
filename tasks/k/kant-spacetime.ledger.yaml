    source: |-
      There is no doubt that the debate between the Leibnizians and the Newtonians concerning the status of space and time forms part of the essential background to Kant’s views throughout his career. Although Newton originally formulated his conception of space and time in response to Descartes’s views in the *Principles of Philosophy* (1644), by the turn of the eighteenth century, Newton and his followers were embroiled in an extensive debate with Leibniz and his supporters on the Continent. This reflected, in part, the famous priority dispute regarding the calculus, but it also reflected some of Leibniz’s fundamental criticisms of Newton’s views of space, time and motion in *Principia mathematica* (1687, 1713—second edition). Leibniz raised many of those criticisms in his correspondence with Samuel Clarke, who defended Newton’s ideas. Kant mentions this debate frequently in the *Critique* (see, e.g., A23/B37, A39/B56, & A46/B64). Broadly speaking, Newton and his followers argued for the importance of thinking of space, time and motion as “absolute” or at least from an absolute point of view. This means that one regards space and time as existing independently of matter and relations amongst material bodies. As Newton (1999, 408) puts it, “Absolute space, of its own nature without reference to anything external, always remains homogeneous and immovable.” So absolute space, or space regarded from an absolute point of view, has a nature and has the properties of homogeneity and immovability independently of anything else. Since space on this conception has a nature and has properties independently of any relations, Newton was often interpreted as saying that space is a being or perhaps a substance. To the chagrin of many philosophers, Newton avoided using these categories in the *Principia* itself, although in a famous unpublished manuscript he denied that one should think of space as either a substance or as an accident (Newton 2014, 35–36)[^newton-2014]. In his correspondence with Clarke (1715–1716), Leibniz then argued that Newton’s conception of space and time conflicts with the principle of sufficient reason: if space were to exist independently of all matter and material relations, then there could be no reason for God to have chosen to create matter in one location rather than any other; independently of matter, all locations are indistinguishable (see L 5: 3–4). In part to solve this problem involving the principle of sufficient reason, Leibniz then argues that space is merely the order of relations amongst material bodies. So on his view, space depends on objects and their relations, which solves the problem: since space does not exist independently of matter, God never faced the question of “where” to place bodies in space. To create a bunch of matter just is to create space.
    step1: |-
      毫无疑问，莱布尼茨派与牛顿派关于空间时间地位的论争，构成康德整个学术生涯观点的基本背景的一部分。尽管牛顿最初是在回应笛卡尔《哲学原理》（1644）中的观点时提出自己的空间时间构想，但到 18 世纪之交，牛顿及其追随者已同莱布尼茨及其欧陆的支持者卷入了广泛论战。这在一定程度上反映了关于微积分发明权的著名优先权之争，但也反映了莱布尼茨对牛顿在《数学原理》（1687，1713 年第二版）中空间、时间与运动观点的一些根本批评。莱布尼茨在与萨缪尔·克拉克的通信中提出了其中许多批评，后者则为牛顿的观点辩护。康德在《批判》中频繁提到这场论战（例如见 A23/B37, A39/B56, A46/B64）。大体而言，牛顿及其追随者主张，把空间、时间与运动设想为“绝对的”、或至少从绝对的观点来设想，有其重要性。这意味着把空间与时间看作独立于物质以及物体间关系而存在。如牛顿（1999, 408）所说：“绝对空间，就其本性而言，不参照任何外部事物，始终保持齐一且不动。”所以绝对空间、或从绝对观点看的空间，拥有一种本性，并独立于任何其他事物而具有齐一性与不动性。既然按此构想空间独立于任何关系而具有本性与属性，牛顿就常被解释为在说空间是一个存在者，或许还是实体。令许多哲学家恼火的是，牛顿在《数学原理》本文中避免使用这些范畴，尽管在一份著名的未刊手稿中他否认人们应把空间想成实体或偶性（Newton 2014, 35–36）[^newton-2014]。随后，在与克拉克的通信（1715–1716）中，莱布尼茨主张牛顿的空间时间构想与充足理由律冲突：若空间独立于一切物质与物质关系而存在，则上帝就没有理由选择在某一位置而非任何其他位置创造物质；脱离物质，一切位置都无法区分（见 L 5: 3–4）。部分是为了解决这个涉及充足理由律的难题，莱布尼茨进而主张空间只是物体间关系的秩序。于是在他看来，空间依赖于对象及其关系，这解决了难题：既然空间不独立于物质而存在，上帝就从未面临把物体“放在”空间何处的选择。创造一堆物质，就等于创造空间。
    step2: |-
      莱布尼茨派与牛顿派关于空间时间地位的论争，无疑是康德一生观点的基本背景之一。牛顿最初的构想是针对笛卡尔《哲学原理》（1644）而发，到了 18 世纪之交，牛顿一系已同莱布尼茨及欧陆的追随者陷入长期论战。其中既有微积分发明权的著名优先权之争，也有莱布尼茨对牛顿《数学原理》（1687；1713 年第二版）中空间、时间与运动观的根本批评。莱布尼茨在与萨缪尔·克拉克的通信里提出这些批评，克拉克则为牛顿辩护。康德在《批判》中屡屡提及这场论战（如 A23/B37、A39/B56、A46/B64）。粗略说来，牛顿一派主张，把空间、时间与运动当作“绝对的”——或至少从绝对的观点来看——至关重要。这即是说，空间与时间独立于物质及物体间的关系而存在。牛顿（1999, 408）写道：“绝对空间，就其自身本性而言，不关涉任何外在之物，永远保持齐一且不动。”可见绝对空间、或从绝对观点看空间，自有其本性，且不待他物即具齐一与不动之性。既然按此构想，空间不依任何关系即有其本性与属性，牛顿便常被解读为宣称空间是一个存在者、甚或实体。令不少哲学家不快的是，牛顿在《数学原理》正文中避用这些范畴；不过在一份著名的未刊手稿里，他否认应把空间视为实体或偶性（Newton 2014, 35–36）[^newton-2014]。其后莱布尼茨在致克拉克的通信（1715–1716）中指出，牛顿的构想与充足理由律相冲突：空间若独立于一切物质及物质关系而存在，上帝便没有理由把物质创造在某一处而非别处；一旦离开物质，所有位置都无从区分（见 L 5: 3–4）。莱布尼茨部分正是为解决这个充足理由律的难题，才主张空间不过是诸物体间关系的秩序。照他的看法，空间依赖对象及其关系，难题随之化解：空间不独立于物质而存在，上帝也就不曾面临把物体“置于”空间何处的抉择。创造一堆物质，本身就是创造空间。
