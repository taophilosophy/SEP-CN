      > Space is not something objective and real, nor a substance, nor an accident, nor a relation; instead, it is subjective and ideal, and originates from the mind’s nature in accord with a stable law as a scheme, as it were, for coordinating everything sensed externally. (Ak 2: 403)
    step1: |-
      > 空间既不是某种客观而实在的东西，也不是实体，也不是偶性，也不是关系；毋宁说，它是主观的、观念的，依一条稳固的法则出于心的本性，犹如一个图型，用来协调一切在外部被感知的东西。（Ak 2: 403）
    step2: |-
      > 空间并非客观实在之物，既非实体，亦非偶性，亦非关系；它是主观的、观念性的，依一条恒定法则源自心的本性，仿佛一张图型，用以协调一切在外被感知者。（Ak 2: 403）
  - id: 6
    kind: body
    source: |-
      In this one pithy sentence, we find a list of many important early modern questions concerning space. Is space “real,” or is it “ideal” in some sense? Is it a substance in its own right, a property of some substance, or perhaps neither? Is it somehow dependent on the relations among objects, or independent of those relations? What is the relationship between space and the mind? And finally, how do these various issues intersect with one another?
    step1: |-
      在这句简洁的话里，我们发现一串重要的早期近代问题，皆关乎空间。空间是“实在的”，还是在某种意义上“观念的”？它是自成一类的实体，是某实体的属性，抑或两者皆非？它在某种意义上依赖于对象之间的关系，还是独立于那些关系？空间与心之间是什么关系？最后，这些不同议题彼此如何交错？
    step2: |-
      短短一句，便列出了一串早期近代关于空间的重要问题。空间是“实在的”，还是某种意义上的“观念的”？它是自在的实体，是某物的属性，抑或两者都不是？它或在某种意义上取决于对象间的关系，或独立于这些关系？空间与心又有何关联？末了，这些议题彼此怎样交织？
  - id: 7
    kind: body
    source: |-
      The passage from the *Inaugural Dissertation* hints at five distinct questions or issues concerning space and time. First, there is the question of the ontology of space and time considered within the framework of what Kant would regard as the dogmatic metaphysics of the seventeenth century. This framework might suggest that if space and time are to exist, or to characterize the physical world, they must be considered either substances in their own right, or else properties of some substance. Neither option seems particularly attractive. Space and time seem distinct from substances because they are causally inert, causally inaccessible—their aspects or properties cannot be altered by interacting with any other substance—and imperceptible. Since they are often regarded as infinite, moreover, some thinkers have doubted that they could be substances, as God is often thought of as the sole infinite substance (Descartes may have conceived of space as “indefinite” for this reason). However, it is also difficult to think of space and time as properties of any substance, for then they would presumably be dependent on that substance for their existence. If we regard them as dependent on any contingent substance, it seems that we would be committed to the idea that space and time could fail to exist, or could disappear, depending on the happenings of that contingent substance. One might think instead that space and time depend on the one necessary substance, but this obviously raises a host of other issues. To think of space and time as properties of God is potentially to regard God as spatiotemporal, which is *verboten* from the point of view of many seventeenth-century thinkers (Janiak 2008, chapter five)[^janiak-2008].
    step1: |-
      《就职论文》那段话暗示了关于空间与时间的五个不同问题或议题。第一，是在康德会视为 17 世纪独断形而上学的框架内考察空间与时间的本体论问题。这一框架或许会提示：空间与时间若要存在、或要刻画物理世界，就必须被看作自成一类的实体，或被看作某实体的属性。两种选项似乎都不太有吸引力。空间与时间看来不同于实体，因为它们因果上惰性、因果上不可及——它们的方面或属性无法通过与任何其他实体相互作用而被改变——且不可感知。又因其常被视为无限的，一些思想家怀疑它们能否是实体，因为上帝常被设想为唯一的无限实体（笛卡尔或正因如此才把空间构想为“无定的”）。然而，把空间与时间想成任何实体的属性也同样困难，因为那样一来，它们想必就依赖该实体而存在。若我们认为它们依赖于任何偶然实体，那似乎就得接受空间与时间可能不存在、可能消失，取决于那个偶然实体的遭遇。人们或许转而认为空间与时间依赖于那唯一的必然实体，但这显然又引出一大堆其他问题。把空间与时间想成上帝的属性，可能就是把上帝视为在时空之中，而从许多 17 世纪思想家的立场看，这是*禁忌*（Janiak 2008, chapter five）[^janiak-2008]。
    step2: |-
      《就职论文》那段话暗含关于空间与时间的五个不同问题。其一，是在康德眼中的 17 世纪独断形而上学框架内考察空间与时间的本体论。按此框架，空间与时间若要存在、若要刻画物理世界，便须被认作自成一类的实体，或认作某实体的属性。两个选项都不很诱人。空间与时间看上去有别于实体：它们因果上惰怠、因果上不可接近（其方面或属性不会因与别的实体互动而改变），而且不可感知。它们又常被当作无限的，于是有思想家怀疑它们当不成实体，因为上帝常被设想为唯一的无限实体（笛卡尔把空间说成“无定的”，或许正由于此）。可是把空间与时间当作某实体的属性同样为难：那样它们想必依赖该实体而存在。若说它们依赖某个偶然实体，似乎就得承认空间与时间可能不存在、可能消失，端看那偶然实体的际遇。人们也许会改说空间与时间依赖那唯一的必然实体，但这显然又牵出一堆新问题。把空间与时间当作上帝的属性，可能等于把上帝视为在时空之中，而按许多 17 世纪思想家的看法，这是*禁忌*（Janiak 2008, chapter five）[^janiak-2008]。
  - id: 8
    kind: body
    source: |-
      A second topic arises if we consider the ontology of space and time independently from the substance-property metaphysical framework, e.g. by considering the relationship of space and time to physical objects. Following Newton’s discussion in the first (1687) edition of the Scholium following the Definitions in the *Principia*, the modern debate concerning space’s ontology has been centered on two overarching conceptions: absolutism (now sometimes called “substantivalism,” although that label raises certain issues), the view that space and time exist independently of all possible objects and object relations, or perhaps the view that space-time points exist; and relationalism, the view that space and time depend for their existence on possible objects and relations, or perhaps the view that space-time points do not exist (DiSalle 2006; Messina 2018)[^disalle-2006][^messina-2018].
    step1: |-
      第二个论题出现在我们脱离实体—属性这一形而上学框架、独立考察空间与时间的本体论之时，例如考察空间与时间同物理对象的关系。循牛顿在《数学原理》定义之后的附注（Scholium）1687 年初版中的讨论，近代关于空间本体论的论争一直围绕两种总括性构想：绝对主义（今或称为“实体论”，不过这一标签会引出某些问题），即认为空间与时间独立于一切可能对象及其关系而存在，或认为时空点存在；以及关系主义，即认为空间与时间的存在依赖于可能对象及其关系，或认为时空点不存在（DiSalle 2006; Messina 2018）[^disalle-2006][^messina-2018]。
    step2: |-
      第二个论题，是把空间与时间的本体论从实体—属性的形而上学框架中抽出、单独加以考察，例如考察它们同物理对象的关系。自牛顿在《数学原理》诸定义之后那篇附注（Scholium，1687 年初版）中的讨论以来，近代关于空间本体论的争论便围绕两种总纲性构想展开。其一是绝对主义（如今或称“实体论”，此标签本身却带来一些问题），主张空间与时间独立于一切可能对象及对象关系而存在，或主张时空点存在。其二是关系主义，主张空间与时间的存在有赖于可能对象及其关系，或主张时空点并不存在（DiSalle 2006; Messina 2018）[^disalle-2006][^messina-2018]。
  - id: 9
    kind: body
    source: |-
      Leaving aside questions about ontology, there is a distinct—or at least potentially distinct—issue regarding space and time: what is the origin of our representation of space and of time? This third issue arises from the sense in the early modern period that our idea or representation of space and time must somehow be importantly distinct from our idea or representation of ordinary physical objects. Many believed that space and time are causally inert and therefore imperceptible—how then are we are able to represent space and time at all? Few are willing to deny that we have a representation, not merely of spatial and of temporal objects, but also of space and time themselves, so there is a genuine puzzle lurking here.
    step1: |-
      撇开本体论问题，关于空间与时间还有一个不同——或至少潜在地不同——的议题：我们对空间与时间的表象从何而来？这第三个议题起于早期近代的一种感觉：我们关于空间与时间的观念或表象，必定在某种重要意义上不同于我们关于普通物理对象的观念或表象。许多人相信，空间与时间因果上惰性、因而不可感知——那么我们究竟如何竟能表象空间与时间？很少有人愿意否认我们拥有一种表象，不仅关于空间性对象与时间性对象，而且关于空间与时间本身，所以这里潜伏着一个真正的谜。
    step2: |-
      先放下本体论，另有一个不同（至少可能不同）的议题：我们对空间与时间的表象源自何处？这第三个议题来自早期近代的一种感受——我们关于空间与时间的观念或表象，必定在某重要意义上不同于我们关于寻常物理对象的观念或表象。多数人相信空间与时间因果上惰怠，因而不可感知；那么我们究竟凭什么表象空间与时间？几乎无人愿意否认：我们确实有表象，不止表象空间中的对象与时间中的对象，也表象空间与时间本身。于是这里确有一个谜。
  - id: 10
    kind: body
    source: |-
      The fourth topic follows on the heels of the third: what is the content of our idea or representation of space and time? From Kant’s point of view, the content of a representation might provide us with a guide to its possible origin. Alternatively, we might be able to consider the origin of a representation as providing us with a clue as to what its content might be. In the case of space, there may be reason to think that the content of our representation must somehow reflect what we know about space from Euclidean geometry.
    step1: |-
      第四个论题紧接第三个而来：我们关于空间与时间的观念或表象，其内容是什么？从康德的立场看，表象的内容或可为我们指示它可能的来源。反过来说，我们或许也能把表象的来源当作线索，去推想它的内容可能是什么。就空间而言，也许有理由认为，我们表象的内容必定以某种方式反映我们从欧几里得几何学所知道的关于空间的东西。
    step2: |-
      第四个论题紧跟第三个：我们关于空间与时间的观念或表象，其内容为何？在康德看来，表象的内容可以指示它可能的来源；反过来，表象的来源也可以成为线索，帮助我们推测其内容。就空间而论，或许有理由认为，我们表象的内容必定以某种方式映照出我们从欧几里得几何学所知的关于空间的一切。
  - id: 11
    kind: body
    source: |-
      The fifth and potentially final topic is closely connected with the third and fourth, and indeed, connects all four previous topics with one another: what is the relationship between space and time, on the one hand, and the human mind, on the other? This question obviously cries out for clarification. Part of what this question might mean can be characterized by the third and fourth questions above: if we think of the mind as representing space and time in a certain way, then perhaps this is part of our understanding of the mind’s relationship with space and time themselves. But within the context of Kant’s work, there is, at least *prima facie*, another issue lurking here—are space and time somehow dependent upon the mind for their existence? It may be that some kind of dependence is suggested by the origin—or by the content—of our representation of space and time (or perhaps by these two jointly). But Kant also seems to think that a view recognizing the dependence of space and time on the mind might offer advantages in addressing the ontological problems mentioned above.
    step1: |-
      第五个、也许是最末一个论题，与第三、第四紧密相连，并且确实把前面四个论题彼此联结起来：一方面空间与时间、另一方面人心，二者关系如何？这一问题显然亟需澄清。它可能意味着什么，有一部分可用上面第三、第四个问题来刻画：若我们把心想成以某种方式表象空间与时间，那么这也许就是我们理解心与空间时间本身之关系的一部分。但在康德著作的语境中，至少表面上还潜伏着另一个议题——空间与时间是否在某种意义上依赖心而存在？某种依赖也许由我们空间时间表象的来源——或内容——暗示出来（也许由二者共同暗示）。但康德似乎还认为，一种承认空间与时间依赖心的观点，或能在处理上述本体论难题时带来好处。
    step2: |-
      第五个、也许是最后一个论题，同第三、第四个紧密相关，并且确实把前四个论题串在一起：空间与时间同人心之间，究竟是什么关系？这个问题显然亟待澄清。它可能指什么，其中一部分可以用上面第三、第四问来界定：倘若我们把心想作以某种方式表象空间与时间，那么这或许就是我们对心与时空本身之关系的一种理解。不过在康德著作的脉络里，表面上看还另有议题潜伏：空间与时间是否在某种意义上赖心而存在？我们空间时间表象的来源——或其内容——也许暗示了某种依赖（也可能两者合起来暗示）。康德似乎还认为，承认空间与时间依赖心的观点，或许有助于化解上述本体论难题。
  - id: 12
    kind: body
    source: |-
      Each of these five philosophical issues concerning space and time is relevant for understanding Kant’s views. As we will see below, part of the difficulty in interpreting Kant arises from the fact that he evidently transforms various aspects of the early modern debates concerning space and time through the perspective presented in the first *Critique* (Allison 2004, 120–1)[^allison-2004]. Within the context of the first issue raised above, the view that space and time are *real* may mean that space and time are substances in their own right, rather than merely properties; yet within the context of the absolutism-relationalism debate, if space and time are *real*, they exist independently of all objects and relations. But Kant uses the terms *real* and *ideal* to express views concerning the relation between space and time and the mind, leaving aside any views concerning objects and relations. This entry aims to clarify matters by separating these various considerations.
    step1: |-
      这五个关于空间与时间的哲学议题，每一个都与理解康德的观点相关。我们在下文将看到，解释康德的困难有一部分来自这样一个事实：他显然借第一《批判》所呈现的视角，转化了早期近代关于空间与时间之论争的各个方面（Allison 2004, 120–1）[^allison-2004]。在上面第一个议题的语境中，“实在的”空间与时间观也许意味着空间与时间是自成一类的实体，而不只是属性；然而在绝对主义—关系主义论争的语境中，若空间与时间是“实在的”，它们就独立于一切对象与关系而存在。但康德用“实在的”与“观念的”这两个词来表达关于空间时间与心之关系的观点，而不涉及任何关于对象与关系的观点。本词条旨在通过区分这些不同的考量来澄清问题。
    step2: |-
      上述五个关于空间与时间的哲学议题，个个都关系到理解康德。下文将会看到，解释康德的难处有一部分源于这样一个事实：他显然透过第一《批判》的视角，把早期近代空间时间论争的方方面面都作了转化（Allison 2004, 120–1）[^allison-2004]。在第一个议题的脉络中，说空间与时间是“实在的”，也许意为它们是自成一类的实体而非单纯属性；而在绝对主义—关系主义之争的脉络中，空间与时间若“实在”，便独立于一切对象与关系而存在。但康德使用“实在的”与“观念的”二词，所表达的却是空间时间同心的关系，撇开了关于对象与关系的看法。本词条即通过区分这些不同考量来澄清问题。
