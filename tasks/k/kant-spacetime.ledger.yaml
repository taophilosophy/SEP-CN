      [^note-16]: Kant’s contention that space is represented as an infinite given magnitude has generated substantial scholarly discussion. For a helpful analysis of recent scholarship on that question, see Patton 2011 and also Posy 2008. In a recent paper, Guyer argues that according to Kant’s considered view in the *Critique*, we do not represent space as an infinite given magnitude because space is not an object – and therefore not an infinite object – but rather merely a form of intuition, so it actually has no determine magnitude (Guyer 2018, 189, 191, 196)[^guyer-2018]. There is also the question of how to understand the relation between the claim in the Aesthetic that space and time are infinite given magnitudes and the discussion of spaces and times in the Axioms of Intuition. For instance, in the former Kant seems to suggest that there is a priority of the whole over the parts for space and time, but in the latter, the suggestion seems to be that since space and time are intuitions and all intuitions are magnitudes, it follows that there is a priority of the parts over the whole, as for all magnitudes. These puzzles, and many related issues, are deftly handled in Daniel Sutherland’s recent book, where he distinguishes between Kant’s analysis of space and time *per se* and his analysis of particular spaces and times (Sutherland 2022, 36–40)[^sutherland-2022]. More generally, Sutherland provides a detailed analysis of Kant’s general view that mathematics is the science of magnitudes.
    step1: |-
      [^note-16]: 康德关于空间被表象为无限被给予量的主张，引发了大量学术讨论。关于近期研究的有益分析，见 Patton 2011 与 Posy 2008。在最近一篇文章中，盖耶论证，按康德在《批判》中的深思观点，我们并不把空间表象为无限的被给予量，因为空间不是对象——因而也不是无限对象——而只是直观的形式，所以它实际上没有确定的量（Guyer 2018, 189, 191, 196）[^guyer-2018]。还有一个问题是：如何理解《感性论》中“空间与时间是无限的被给予量”这一主张，与“直观的公理”中对诸空间与诸时间的讨论之间的关系。例如，在前者中康德似乎提示，对空间与时间而言整体优先于部分；而在后者中，提示似乎在于：既然空间与时间是直观，而一切直观都是量，那么正如下所有量那样，部分优先于整体。这些谜题及许多相关问题，在丹尼尔·萨瑟兰的近著中得到妥善处理；他区分了康德对空间时间*本身*的分析与对特定空间时间的分析（Sutherland 2022, 36–40）[^sutherland-2022]。更一般地说，萨瑟兰详细分析了康德的一般观点：数学是关于量的科学。
