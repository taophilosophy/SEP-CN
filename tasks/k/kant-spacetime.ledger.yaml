      Daniel Warren clarifies this argument in an especially helpful way (Warren 1998; cf. Allison 2004, 100–104)[^allison-2004][^warren-1998]. Certainly, it is not true in general that in any order to represent any two entities, A and B, as related in some way, I must represent them as falling into a larger “space” of some relevant character. Warren gives a useful example: in order to represent A as “brighter than” B, I need not represent A and B as being part of a larger “brightness” space. I *could* do so: I could represent A and B via the “brightness” relation precisely by representing A as lying at one end of a brightness spectrum, and B as lying near its other end. But I need not do so: I could simply represent A and B themselves, and represent A as brighter than B, as I might do with two lights (Warren 1998, 200*ff*)[^warren-1998]. The suggestion is that in order to represent A and B as bearing a *spatial* relation with one another—say, to represent them as being some distance apart—I must represent A and B as *in space*. In that sense, the representation of objects as spatially related may presuppose the representation of space. The problem for Locke is that he begins with my perception, or idea, of a distance between two objects, and then proceeds to construct my idea of space from that initial point. But if my representation of a distance relation between any two objects already presupposes a representation of those objects as in space, then the former cannot be the beginning point of a process that issues in the latter.
    step1: |-
      丹尼尔·沃伦以极为有益的方式澄清了这个论证（Warren 1998；参 Allison 2004, 100–104）[^allison-2004][^warren-1998]。当然，一般而言并不真地是：为了把任何两个实体 A 与 B 表象为以某种方式相关联，我就必须把它们表象为落入某个相关的更大的“空间”。沃伦给了一个有用的例子：为了把 A 表象为“亮于”B，我无需把 A 与 B 表象为一个更大的“亮度”空间的一部分。我*可以*这么做：我可以通过“亮度”关系来表象 A 与 B，办法是把 A 表象为位于亮度谱的一端，而把 B 表象为靠近其另一端。但我不必这么做：我可以径直表象 A 与 B 本身，把 A 表象为亮于 B，正如对待两盏灯那样（Warren 1998, 200*ff*）[^warren-1998]。其提示是：为了把 A 与 B 表象为彼此具有*空间*关系——比如把它们表象为相距一定距离——我必须把 A 与 B 表象为*在空间之中*。在这个意义上，把对象表象为空间性关联的表象，或许以空间表象为前提。洛克的问题在于，他从我对两对象间距离的知觉或观念出发，然后从这一起点构造我的空间观念。但如果我对任何两对象间距离关系的表象已经预设了把它们表象为在空间之中，那么前者不可能成为产生后者的过程的起点。
    step2: |-
