      In what follows, the *Critique of Pure Reason* is cited by the usual A/B method; other references are to *Kants gesammelte Schriften* (via “Ak” [for Akademie edition] followed by volume and page number). The Leibniz-Clarke correspondence is cited by referring to author-letter-section (e.g., L 3:1 refers to the first section of Leibniz’s third letter). All translations are by the author of this entry, unless otherwise noted. The following convention is adopted: concepts are referred to by using brackets; e.g., the concept gold is referred to by <gold>. By contrast, we employ ‘gold’ to refer to the word.
