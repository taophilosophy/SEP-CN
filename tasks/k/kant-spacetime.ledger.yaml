      Space is the order of the actual and possible relations of objects; since objects reflect the order of substances (in some very-difficult-to-specify sense), space itself reflects the order of substances, albeit in a confused manner (see Langton 1998, 68–96)[^langton-1998]. Whereas a conceptual representation of this circumstance would provide one with a representation of the monadic order, sensibility misrepresents space as an independent entity. Hence space is independent of intuition in that it is the order of relations, and that order reflects or expresses the order of substances, which itself is independent of intuition.[^note-22] Hence space is viewed as “a certain order in the community of substances,” a variant of which Kant himself defended in the pre-critical period (see Friedman’s introduction to *Metaphysical Foundations*, 174).
    step1: |-
      空间是对象现实关系与可能关系的秩序；既然对象（在某种极难指定的意义上）反映实体的秩序，空间本身也就以混淆的方式反映实体的秩序（见 Langton 1998, 68–96）[^langton-1998]。对这一情形的一个概念性表象会提供关于单子秩序的表象，而感性则把空间错表象为一个独立的实体。所以空间独立于直观，意义是它是关系的秩序，而那一秩序反映或表达实体的秩序，后者独立于直观。[^note-22] 于是空间被视为“实体交互中的某种秩序”——康德本人在前批判时期为它的一个变体辩护过（见《自然科学的形而上学基础》弗里德曼导言，174）。
    step2: |-
      空间是对象现实与可能关系的秩序；对象（在某种极难界定的意义上）映照实体的秩序，空间本身便也以混淆的方式映照它（见 Langton 1998, 68–96）[^langton-1998]。这情形若以概念表象之，给出的是单子秩序的表象；感性却把空间错当成独立实体。所以空间独立于直观，在于它是关系的秩序，而该秩序映照、表达着实体的秩序——后者独立于直观。[^note-22] 于是空间被看作“实体交互中的某种秩序”；康德本人在前批判期为它的一个变体辩护过（见《自然科学的形而上学基础》弗里德曼导言，174）。
