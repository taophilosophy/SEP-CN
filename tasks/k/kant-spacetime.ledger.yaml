      Why might Kant characterize Leibniz as holding some version of the “transcendental realist” perspective that he also attributes to Newton? This characterization is puzzling, as we have seen. If we return to the conceptual matrix above, it is not merely that Leibniz considers space to be the order of the possible relations among objects, and therefore to be dependent upon objects and their relations; it is also the case that he explicitly adopts the common early modern view that relations are *ideal* in the sense that they are somehow dependent upon the mind.[^note-20] So *prima facie*, if space is a relational order, or dependent upon relations, and relations, in turn, are dependent upon the mind, then it seems that space is itself dependent upon the mind. Thus Leibniz appears to deny that space is *real* in a *Kantian* sense. Denying that space is real can be equivalent to denying that space is absolute; but Leibniz’s relationalism, *coupled* with his familiar early modern view of relations (an independent metaphysical thesis), seems to entail that space is *also* not real in the sense that it is not independent of the mind. In what sense, then, can Leibniz be called a transcendental realist? *Prima facie*, it is unfair to interpret him in this way.
    step1: |-
      康德为何把莱布尼茨刻画为持有他也归于牛顿的某种“先验实在论者”视角的版本？如前所见，这一刻画令人困惑。若回到上面的概念矩阵，情况不只是莱布尼茨认为空间是对象间可能关系的秩序、因而依赖于对象及其关系；他还明确采纳了早期近代的共同观点，即关系是*观念的*，意义是它们以某种方式依赖于心。[^note-20] 所以表面上看，若空间是关系秩序、或依赖于关系，而关系又依赖于心，那么空间本身似乎就依赖于心。因此莱布尼茨似乎否认空间在*康德*意义上是*实在的*。否认空间实在可以等值于否认空间绝对；但莱布尼茨的关系主义*加上*他熟悉的早期近代关系观（一个独立的形而上学论题），似乎蕴含空间*也*不实在，意义是它不独立于心。那么，在何种意义上能称莱布尼茨为先验实在论者？表面上看，这样解释他有失公允。
    step2: |-
