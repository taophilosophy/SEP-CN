      Kant consistently writes in the *Critique* of ideality and reality in the more familiar modern sense, where mind-dependence is at issue. His usage serves to shift the philosophical discussion concerning space from a focus on relationalism and absolutism to one on idealism and realism. Hence when he reflects on the Newtonian and Leibnizian conceptions of space and time in general terms in the Transcendental Aesthetic, he eschews a discussion of the relative merits of absolutism and relationalism in favor of discussing the common mistake of his predecessors. For instance, after outlining his conception of space and time, Kant claims: “Those, however, who assert the absolute reality [*absolute Realität*] of space and time, whether they take it to be subsisting or only inhering, must themselves come into conflict with the principles [*Principien*] of experience” (A39/B56). The former group, also called “the mathematical investigators of nature,” is clearly identified with the Newtonians, and the latter, the “metaphysicians of nature,” with the Leibnizians (cf. Shabel 2005, 31, 45–9)[^shabel-2005]. So transcendental idealism is articulated as a kind of *replacement* for the Leibnizian and Newtonian conceptions of space and time, but it is not their status as relationalist and absolutist conceptions, respectively, that calls for their replacement. Rather, it is their status as representatives of a separate and overarching conception of space, a conception according to which space (like time) is said to bear an “absolute reality.” This occurrence of ‘absolute’ clearly cannot have the meaning that Leibniz and Clarke intend.
    step1: |-
      康德在《批判》中一贯以更熟悉的近代意义讨论观念性与实在性，那里成问题的是依赖心。他的用法把关于空间的哲学讨论从聚焦关系主义与绝对主义，转向聚焦观念论与实在论。因此，当他在《先验感性论》中一般地反思牛顿式与莱布尼茨式的空间时间构想时，他避开讨论绝对主义与关系主义各自的优劣，转而讨论其前辈的共同错误。例如，在概述自己的空间时间构想之后，康德主张：“然而，那些断言空间与时间之绝对实在性［*absolute Realität*］的人，无论把它们看作自存的还是仅内居的，都必定与经验的原则［*Principien*］冲突”（A39/B56）。前一组人也被称为“自然的数学研究者”，显然指牛顿派；后一组人即“自然的形而上学家”，指莱布尼茨派（参 Shabel 2005, 31, 45–9）[^shabel-2005]。所以先验观念论被表述为对莱布尼茨式与牛顿式空间时间构想的某种*替代*，但要求替代的并不是它们分别为关系主义与绝对主义构想这一身份。毋宁说，是它们作为一种单独的、总括性的空间构想的代表这一身份——按那种构想，空间（像时间一样）据说具有“绝对实在性”。此处“绝对的”一词显然不可能具有莱布尼茨与克拉克所意指的含义。
