      According to Kant, however, we represent space as having an infinite number of constituents, namely places.[^note-16] If our representation of space were conceptual, we would be required to represent each of these constituents *in order to represent space itself*, just as we are required to represent metal in order to represent gold (for <gold> catergorizes gold as a metal). Yet we cannot represent every place within space in an effort to represent space itself. If we can take it as settled that we represent space, and as settled that we represent it as having an infinite number of places within it, then our representation of space presumably cannot be conceptual in Kant’s sense. The third argument in the Metaphysical Exposition seems to imply, as we have seen, that the representation of any place presupposes the representation of space itself. This fourth argument makes a distinct point: if the representation of space itself were to require the representation of each part that we represent space as having, then we could not represent space at all. Since we do represent space, and since we do represent it as having an infinite number of places within it, our representation of space is not conceptual in Kant’s sense. Of course, Kant’s readers may deny one of his apparent assumptions here, viz., that we represent space as infinite. Readers with broadly empiricist sympathies in particular may be skeptical of this assumption.
    step1: |-
      然而，按康德，我们把空间表象为拥有无限多个构成成分，即位置。[^note-16] 若空间表象是概念性的，我们就须表象每一个这样的构成成分*以便表象空间本身*，正如须表象金属才能表象金子（因为 <gold> 把金子范畴化为金属）。然而我们不能为表象空间本身而表象空间中的每一个位置。若我们可以认定我们确实表象空间，且认定我们把它表象为其中含无限多个位置，那么我们的空间表象想必不是康德意义上的概念。如前所见，形而上学阐明的第三个论证似乎蕴含：任何位置的表象都以空间本身表象为前提。这第四个论证则提出一个不同的论点：如果空间本身的表象要求表象我们把它表象为具有的每一个部分，那么我们就根本不能表象空间。既然我们确实表象空间，且确实把它表象为其中含无限多个位置，我们的空间表象就不是康德意义上的概念。当然，康德的读者可以否认他的一个显见假定，即我们把空间表象为无限的。持有宽泛经验主义同情的读者尤其可能怀疑这一假定。
