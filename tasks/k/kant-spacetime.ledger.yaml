      [^note-10]: One of Leibniz’s points seems to be that his relationalism is perfectly *compatible* with the contention that the representation of space is empirical (for the view that some of the arguments in the Metaphysical Exposition are intended to undermine Leibnizian relationalism, see Guyer 1987, 349; Wojtowicz 1997, 79, 84, 87; Brandt 1997, 96–7; Walker 1978, 42–4; Parsons 1992, 68)[^brandt-1997][^guyer-1987][^parsons-1992][^walker-1978][^wojtowicz-1997]. He apparently employs this tactic to show that perceivers can obtain a representation of space via the perception of spatial relations among objects without recourse to the view that space is ontologically independent of objects. This parallels Locke’s attempt to show that one can obtain an Idea of space while having distinct ideas of space and of body. So the idea—popular among Newton’s supporters like Locke—that the representation of space is empirical in origin is perfectly compatible with relationalism. Indeed, Locke’s view may very well have been on Leibniz’s mind when he argued for the compatibility of an empiricist conception of the representation of space with his relationalist conception of space’s ontological status because of his considerable interest in Locke’s theory of ideas. This is a clever tactic on Leibniz’s part: when writing to Newton’s most prominent defender in England, Samuel Clarke, he accepts an empiricist view of the representation of space in order to show that this acceptance does nothing to upset his defense of the relationalist conception of space’s ontological status.
