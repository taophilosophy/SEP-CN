      Kant’s view that we have an intuition, rather than a concept, of space can be seen to raise a difficult problem: space is not an object, and yet intuition seems to provide us with something akin to a perception of something. As Lucy Allais puts it, intuition involves “presence to consciousness of an object” (Allais 2015, 197*ff*)[^allais-2015], and yet space is not an object. It is difficult to see why we should think of ourselves as perceiving space at all. It is easy enough to understand the idea that some ordinary thing, like a tomato, is an object that is present to my consciousness, say when I look at the tomato on a farm stand. There are, of course, many philosophical theories of perception, and these theories will differ in their discussions even of simple cases of perception such as this one. But it seems uncontroversial to suppose that the tomato is present to my consciousness as an object at least in the sense that the tomato is one of the things that I’m looking at. And it also seems uncontroversial to think that there are many other things, besides tomatoes, that might be present to my consciousness in a similar way, from clouds to fog to rainbows, even though they are not “objects” in the simple sense in which a tomato is an object. However, it certainly seems like a stretch to say that space itself might be one of those things. That is not merely because space is not an object in any clear sense; it is also because space itself, in this historical and philosophical context, is not something that has a causal impact on me. So it remains doubly difficult to see how I might conclude, with Kant, that I have something akin to a perception of space. Kant assures us, of course, that we have an *a priori* intuition of space, so although he is discussing something akin to perception in one sense, in another sense what he is discussing is supposed to be quite distinct from ordinary perception. Whether that assurance helps to clarify this issue for his readers is a matter of debate. What is clear, however, is that this aspect of Kant’s conception of space remains one of the most controversial, and most difficult, aspects of his theoretical philosophy.
    step1: |-
      康德认为我们拥有关于空间的直观而非概念，这会被视为引发一个难题：空间不是对象，而直观似乎向我们提供了类似于对某物的知觉的东西。如露西·阿莱所说，直观包含“对象向意识的在场”（Allais 2015, 197*ff*）[^allais-2015]，而空间不是对象。很难看出我们为什么应把自己看作在知觉空间。理解某个普通事物——比如一只西红柿——是向我意识在场的对象，这很容易，例如当我看着农场摊位上的西红柿时。知觉的哲学理论当然很多，即便对像这样简单的知觉案例，这些理论的讨论也会不同。但假定西红柿至少在如下意义上作为对象向我意识在场——西红柿是我正看着的东西之一——似乎没有争议。同样没有争议的是，除了西红柿，还有许多别的东西也可能以类似的方式向我意识在场，从云到雾到彩虹，尽管它们不是西红柿之为对象的简单意义上的“对象”。然而，说空间本身可能是那些东西之一，看来确属勉强。这不仅是由于空间在任何清楚的意义上都不是对象；也是因为在这样的历史与哲学语境中，空间本身不是对我有因果影响的东西。所以，我如何在康德那里得出我有类似对空间的知觉之物，依然两重困难。当然，康德向我们保证我们拥有空间先天直观，因此尽管他在一种意义上讨论类似知觉的东西，在另一种意义上他所讨论的东西被认为与普通知觉截然不同。这一保证是否有助于读者澄清问题，仍有争论。但清楚的是：康德空间构想的这一面相，始终是他理论哲学中最有争议、也最艰难的方面之一。
