      One question here is whether Leibniz and Kant agree sufficiently in their views of concepts for Kant’s arguments to have any bite against the kind of view Leibniz expresses in the *New Essays*, a text that Kant read sometime after it was first available in 1765 (Vaihinger 1922, 2: 133, 414 and 428–9)[^vaihinger-1922]. Leibniz, famously, has the idea of a complete concept of a substance, and it seems that such as concept would contain an infinite number of constituents—God grasps the complete concept of a substance by grasping all its constituents. Given this view, it may be that the considerations adduced in Kant’s fourth argument in the Metaphysical Exposition are unlikely to worry Leibniz, since he would simply accept the idea that the representation of space, as with any concept, might have an infinite number of constituents (Posy 2000)[^posy-2000]. However, the third argument may have more bite: if Kant is right in contending that the representation of any place presupposes the representation of space itself, then perhaps that representation lacks the ordinary part-whole structure of a concept. Leibniz may in fact accept that general conception of the part-whole structure of concepts. If so, this third argument may present a problem for his view.
    step1: |-
      这里的一个问题是：莱布尼茨与康德关于概念的看法是否足够一致，以至于康德的论证对莱布尼茨在《人类理智新论》中表达的那类观点有任何效力——康德在 1765 年该书初版可得之后某个时候读过它（Vaihinger 1922, 2: 133, 414 and 428–29）[^vaihinger-1922]。莱布尼茨有一个著名的观念：实体的完全概念；这样的概念似乎会包含无限多个构成成分——上帝通过把握一个实体的全部构成成分来把握其完全概念。鉴于这一观点，康德在形而上学阐明第四个论证中提出的那些考量，很可能不会令莱布尼茨忧虑，因为他会径直接受这一观念：空间表象如同任何概念，可以有无限多个构成成分（Posy 2000）[^posy-2000]。不过，第三个论证可能更有效力：如果康德主张任何位置的表象都预设空间本身的表象是对的，那么这一表象或许缺乏概念的通常部分—整体结构。莱布尼茨实际上可能接受概念部分—整体结构的这一一般构想。若是这样，这第三个论证就可能给他的观点出难题。
    step2: |-
      此处的问题是：莱布尼茨与康德对概念的看法是否足够接近，以至康德的论证能咬住《人类理智新论》里那种观点——康德在该书 1765 年问世后某个时候读过它（Vaihinger 1922, 2: 133, 414 and 428–29）[^vaihinger-1922]。莱布尼茨有一著名观念：实体的完全概念；这种概念似乎会含无限多成分——上帝正是通过把握实体的全部成分来把握其完全概念。照此说来，康德形而上学阐明第四论证所举的那些考量，多半难不住莱布尼茨：他会径直接受“空间表象同任何概念一样可以有无限多成分”（Posy 2000）[^posy-2000]。但第三个论证可能咬得更深：若康德主张任何位置的表象都预设空间本身的表象是对的，那么空间表象或许就欠缺概念通常那种部分—整体结构。莱布尼茨实际上可能接受关于概念部分—整体结构的这一一般构想。若然，第三个论证就会给他的观点添麻烦。
