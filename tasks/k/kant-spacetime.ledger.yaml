      So from Kant’s point of view, Berkeley rejects transcendental realism—he rejects the notion that space is a thing in itself, or a property of things in themselves.[^note-28] He presumably also rejects the idea that space and time are independent of intuition. In the Transcendental Aesthetic, Kant admits that one cannot “blame” Berkeley for falling into a radical version of idealism in an attempt to avoid the “absurdities” of transcendental realism, absurdities into which Kant takes the Newtonians to have fallen (B70–1)—these are the very absurdities discussed above in the section on Kant’s criticisms of Newton. Kant seems to be suggesting with this remark that Berkeley—who was himself a fierce critic of the Newtonian idea of absolute or mathematical space—defended the view that space and time are dependent on intuition, that they are not “transcendentally real,” in order to evade the Newtonian conception. And just before the Refutation of Idealism, Kant emphasizes again that Berkeley avoids transcendental realism (B274—see Wilson 1999, 276–93)[^wilson-1999]. From Kant’s point of view, Berkeley correctly avoids transcendental realism, but does so by falsely claiming that space is dependent on *empirical* intuition. This is a mistake, as we have seen, because Kant thinks that the representation of space cannot be empirical. It is precisely this sort of view, in turn, that Kant cites when concluding that space must be dependent on *a priori* intuition in some sense. So perhaps transcendental idealism is *transcendental*—and not merely *idealist*—because it contains the view that our representation of space is non-empirical as an essential component.
    step1: |-
      所以从康德的立场看，贝克莱拒绝先验实在论——他拒绝空间是物自身、或物自身之属性这一观念。[^note-28] 想必他也拒绝空间时间独立于直观这一想法。在《先验感性论》中，康德承认人们不能“责怪”贝克莱为了避免先验实在论的“荒谬”而陷入一种激进版本的观念论——康德认为牛顿派陷入了那些荒谬（B70–71）——它们正是上文论康德对牛顿的批评那一节所讨论的荒谬。康德这一评论似乎提示：贝克莱本人是牛顿式绝对空间或数学空间观念的激烈批评者，他为了避开牛顿的构想，辩护了空间时间依赖于直观、它们并非“先验实在的”这一观点。而在“反驳观念论”之前，康德再次强调贝克莱避免了先验实在论（B274——见 Wilson 1999, 276–93）[^wilson-1999]。从康德的立场看，贝克莱正确地避免了先验实在论，但这样做的代价是错误地主张空间依赖于*经验的*直观。如我们已见，这是一个错误，因为康德认为空间表象不可能是经验的。反过来，正是这类观点，被康德引来得出空间必须在某种意义上依赖于*先天*直观的结论。所以，先验观念论之所以是*先验的*——而不只是*观念论的*——也许正因为它把“我们的空间表象是非经验的”这一观点作为本质成分包含在内。
    step2: |-
      于是在康德看来，贝克莱拒斥先验实在论——他不认为空间是物自身，或物自身的属性。[^note-28] 想必他也不会认为空间时间独立于直观。康德在《先验感性论》中承认：贝克莱为躲避先验实在论的“荒谬”（康德认为牛顿派正陷其中，B70–71）而跌入一种激进观念论，这不能“怪”他——那些荒谬正是上文论康德批牛顿一节所谈的。这句评论似乎暗示：贝克莱本人是牛顿式绝对空间或数学空间的激烈批评者，为了避开牛顿的构想，他才主张空间时间依赖直观、并非“先验实在的”。而在“反驳观念论”之前，康德再次强调贝克莱避开了先验实在论（B274——见 Wilson 1999, 276–93）[^wilson-1999]。在康德看来，贝克莱正确避开了先验实在论，代价却是错误地主张空间依赖*经验的*直观。如前所见，这是个错误，因为康德认为空间表象不可能是经验的。反过来，正是这类观点被康德引来推出：空间必定在某种意义上依赖*先天*直观。因此，先验观念论之所以是*先验的*、而不只是*观念论的*，或许正因为它把“空间表象是非经验的”当作本质成分。
