      One of Kant’s surprising ideas is that each type of objective representation, intuition and concept, can be either empirical or *a priori*. The idea that some concepts are not empirical may not be surprising because of the famous early modern tradition concerning innate ideas. Of course, Kant’s conception of the *origin* of such concepts—outlined in what he calls the “metaphysical deduction” (B159, B377)—contains surprises because he does not embrace innate ideas (Longuenesse 1998)[^longuenesse-1998]. But leaving that complication aside, it is surely very surprising to hear that intuition, which in some regards is akin to perception (Parsons 1992, 65–66; Allais 2015, 147*ff*)[^allais-2015][^parsons-1992], can also be empirical or *a priori* in character. Here it helps to recall that Kant distinguishes sensation from intuition. There remains a question, however, of how we are to understand the very idea that we can have pure—or *a priori*, i.e., non-empirical—intuition at all. This idea comprises a central piece of Kant’s views on space and time, for he famously contends that space and time are nothing but forms of intuition, a view connected to the claim in the Transcendental Aesthetic that we have pure intuitions of space and of time. This means, as we have seen, that we have non-empirical, singular, immediate representations of space and of time. One goal of this entry is to clarify this idea. It is not a stretch to contend that it represents one of Kant’s most distinctive contributions to modern philosophy. Characteristically, it is profoundly difficult to grasp.
    step1: |-
      康德一个令人意外的想法是：每一类客观表象，直观与概念，都既可以是经验的，也可以是*先天的*。有些概念不是经验的，这一想法或许并不令人意外，因为早期近代有著名的天赋观念传统。当然，康德关于这类概念之*来源*的构想——概述于他所谓“形而上学演绎”（B159, B377）——包含意外，因为他不接受天赋观念（Longuenesse 1998）[^longuenesse-1998]。但撇开这一复杂因素，听到直观——在某些方面类似知觉（Parsons 1992, 65–66; Allais 2015, 147*ff*）[^allais-2015][^parsons-1992]——也可以是经验的或*先天的*，无疑十分令人意外。这里有助于回想：康德区分了感觉与直观。然而仍有一个问题：我们究竟该如何理解我们能够拥有纯粹——或*先天*，即非经验——直观这一想法本身？这一想法构成康德空间时间观的一个核心部分，因为他说过一句名言：空间与时间不过是直观的形式，这一观点与《先验感性论》中我们拥有关于空间与时间的纯粹直观这一主张相连。如我们已见，这意味着我们拥有非经验的、单一的、直接的关于空间与时间的表象。本词条的一个目标就是澄清这一想法。说它是康德对近代哲学最具特色的贡献之一，并不夸张。而照他一贯的风格，这极难领悟。
    step2: |-
      康德有个出人意料的想法：直观与概念这两类客观表象，都可以是经验的，也可以是*先天的*。说有些概念非经验，或许并不骇人，因为早期近代本有天赋观念的著名传统。康德关于此类概念*来源*的构想——即他所谓“形而上学演绎”（B159, B377）所述——仍然出人意表，只因他不取天赋观念（Longuenesse 1998）[^longuenesse-1998]。但即便搁下这层纠葛，听说直观——它在某些方面近于知觉（Parsons 1992, 65–66; Allais 2015, 147*ff*）[^allais-2015][^parsons-1992]——也可以是经验的或*先天的*，仍足够惊人。此处须回想：康德把感觉与直观分开。问题仍在：我们究竟怎样理解“能有纯粹直观、即*先天*（非经验）直观”这一想法本身？这一想法是康德空间时间观的枢纽，因为他有句名言：空间与时间不过是直观的形式；此说与《先验感性论》中“我们对空间与时间有纯粹直观”的主张相连。如前所见，这意味着我们对空间与时间拥有非经验的、单一的、直接的表象。本词条的目标之一，正是澄清这一想法。说它是康德对近代哲学最具特色的贡献之一，并不为过。而按他一贯作风，它极难把握。
