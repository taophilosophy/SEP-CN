    source: |-
      Even a casual reader of Kant’s *Critique of Pure Reason* (*Kritik der reinen Vernunft*, first published in 1781) will notice the prominence he gives to his discussion of space and time. In tandem, scholars consider this discussion to be central to Kant’s so-called critical philosophy. Given Kant’s reputation for developing difficult, not to say obscure, philosophical views, it will also not surprise the reader to learn that there is no consensus on how Kant’s conception of space and time ought to be characterized and explicated. So the goal of this entry is to bring some clarity to Kant’s views by situating them historically and philosophically within the milieu of some central debates concerning space and time in the early modern period, especially the rich century between the first edition of Newton’s *Principia mathematica*, which was first published in 1687, and the publication of the second edition of the *Critique of Pure Reason* exactly a hundred years later. The difficulty of comprehending Kant’s views gives interpreters a reason to place a special emphasis on context—I will especially highlight Kant’s reactions to his most significant predecessors in this area, Leibniz and Newton. The focus throughout will be on Kant’s magnum opus, the *Critique of Pure Reason*. Following tradition, and to some extent Kant’s own lead, the focus will also be on space and on our representation of space, although parallel points concerning time (and its representation) will sometimes be indicated.
    step1: |-
      即便是康德《纯粹理性批判》（*Kritik der reinen Vernunft*，初版于 1781 年）的随便一位读者，也会注意到他对空间与时间的讨论所占的显著位置。研究者们同样认为，这一讨论是康德所谓批判哲学的核心。鉴于康德以提出艰深（不啻说晦涩）哲学观点著称，读者得知关于应当如何刻画与阐释康德的空间时间观并无共识，也不会感到意外。因此，本词条的立意，是把康德的观点置于早期近代有关空间与时间的若干核心论争的思想氛围之中——尤其是牛顿《数学原理》初版（1687）与《纯粹理性批判》第二版（恰在一百年后）出版之间那个丰富的世纪——从而在历史与哲学两方面为其带来一些清晰性。理解康德观点的困难，给解释者一个理由特别倚重语境：我将尤其突出康德对他在此领域最重要的前辈莱布尼茨与牛顿的回应。全篇焦点放在康德的代表作《纯粹理性批判》上。循惯例，并在一定程度上循康德本人的指引，焦点也放在空间以及我们对空间的表象上，尽管涉及时间（及其表象）的平行论点有时也会点出。
    step2: |-
      只要随手翻阅康德《纯粹理性批判》（*Kritik der reinen Vernunft*，1781 年初版），读者便会注意到其中论空间与时间的篇幅格外显眼。学界同样视这部分讨论为康德所谓批判哲学的中枢。康德以提出艰深乃至晦涩的哲学见解闻名，因此得知学界对如何刻画与阐释其空间时间观尚无共识，读者当不意外。本词条的目标即在于：把康德的观点放回早期近代围绕空间与时间的几场核心论争的思想氛围之中——尤其是从牛顿《数学原理》初版（1687）到恰在百年之后刊行的《纯粹理性批判》第二版之间那个内容丰厚的世纪——借此在历史与哲学两个层面求得一些清晰。理解康德观点的困难，使解释者更有理由倚重语境；我将特别着重康德对其在本领域最重要前辈莱布尼茨与牛顿的回应。全篇重心是康德的扛鼎之作《纯粹理性批判》。依照传统，也部分依照康德本人的指引，重心同样落在空间以及我们对空间的表象，涉及时间（及其表象）的平行论点则不时点出。
