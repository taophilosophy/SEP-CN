      这里的意思大致如下：空间表象若是概念而非直观，我们就应当能够把它的各部分拼合起来构造它。这好像要求：无须表象那个待构造的概念，就能表象它的部分。对其他概念而言确实如此：可以表象 <human> 内涵的任一部分（比如 <material being>），而不必顺带表象整个概念 <human>。康德主张，空间表象的情形行不通，因为位置表象的获得，只有通过对那个统摄一切的空间之表象划出某个子区。借用一个与形而上学阐明第一论证相平行的说法：任何位置的表象都以空间表象为前提。所以我们不可能表象空间的任何“部分”——任何位置——而不顺带表象空间本身。可见，空间表象的部分—整体关系，不同于概念所适用的部分—整体关系。
