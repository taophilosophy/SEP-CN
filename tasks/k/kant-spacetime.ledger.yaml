      Kant contends that the Newtonians conceive of space as a kind of quasi-object. He seems to return here to the classical discussion of the ontology of space mentioned at the outset of this entry. He emphasizes that on the Newtonian view, space and time are akin to substances—in that they are independent of all objects and relations, on the one hand, and independent of the mind (and of intuition), on the other—and yet lack causal relations. They are also imperceptible, and certainly in the case of space, infinite. Thus for Kant, the Newtonians regard space as an infinite substance-like entity that is imperceptible and causally inert, a view that Kant regards as absurd on general metaphysical grounds. Numerous philosophers throughout the eighteenth century, from Leibniz to Berkeley to Du Châtelet, concurred. Kant adds that the Newtonian view seems to conflict with what he calls “the principles of experience” (see Shabel 2005, 46–7)[^shabel-2005]. Perhaps the idea behind this second criticism can be discerned from Kant’s comments elsewhere in the *Critique* and in the *Metaphysical Foundations of Natural Science*—in those texts, Kant notes that absolute space is not an object of possible experience and that one cannot prove its existence by appealing to experience.[^note-26] In this way, Kant’s criticisms of the Newtonian view seem to rest on very general metaphysical and epistemic considerations—they seem to be largely divorced from the sort of specific views of intuition and of representation that played a substantial role in Kant’s criticisms of Leibniz.
    step1: |-
      康德主张牛顿派把空间想成某种准对象。他似乎在此回到本词条开头提到的关于空间本体论的古典讨论。他强调，按牛顿的观点，空间与时间类似实体——一方面独立于一切对象与关系，另一方面独立于心（与直观）——却又缺乏因果关系。它们也不可感知，且就空间而言肯定是无限的。因此在康德看来，牛顿派把空间视为一个类似实体的无限存在者，它不可感知、因果上惰性；康德基于一般形而上学理由视之为荒谬。18 世纪许多哲学家，从莱布尼茨到贝克莱到夏特莱，都同意这一点。康德补充说，牛顿的观点似乎与他所谓“经验的原则”冲突（见 Shabel 2005, 46–7）[^shabel-2005]。这第二个批评背后的想法，也许可以从康德在《批判》别处与《自然科学的形而上学基础》中的评论看出——在那些文本中，康德指出绝对空间不是可能经验的对象，人们不能通过诉诸经验来证明其存在。[^note-26] 这样看来，康德对牛顿观点的批评似乎基于非常一般的形而上学与认识论考量——它们似乎在很大程度上与那种在康德对莱布尼茨的批评中起实质作用的、关于直观与表象的具体观点相脱离。
