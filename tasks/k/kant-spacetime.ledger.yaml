      [^note-24]: Yet if Leibniz thinks that space is a relational order, that relations are mind-dependent, and that our <space>_{confused} is dependent upon sense perception, is he committed to the idea that space itself is somehow dependent upon sense perception? If so, it is not clear that Kant’s characterization of him through the lens of transcendental realism is fair. First, as Kant well knew, Leibniz contends in the *New Essays* that relations are not merely mind-dependent, but in fact dependent on the understanding, rather than on sense perception. This may suggest that when we consider space through the lens of the understanding—when we focus on our <space>_{clear & distinct}—we find that space is a relational order that depends upon the understanding because it depends upon relations, which in turn are “added” by the understanding to the objects that exist. Perhaps the suggestion here is that relations themselves are not an aspect of our <space>_{confused} but in fact are an aspect of our <space>_{clear & distinct}. One might think our confused representation of space represents space as a kind of independent entity, and not as a relational order, since for Leibniz, the ordinary conception is mistaken in its portrayal of space as a kind of quasi-entity. Of course, space is not actually a quasi-entity, and therefore the correct view of the origin of our representation of space, outlined in Leibniz’s last letter to Clarke, should not present space in that fashion. Instead, the correct view of the origin of our representation of space ought to presuppose that space is merely a relational order, and ought to be able to explain that origin while making that presupposition, despite the fact that the representation itself represents space *as something other than a relational order*. When we focus on our <space>_{clear & distinct}, we find that space is represented *as* a relational order, and as we have seen, those relations are dependent upon the understanding.
    step1: |-
      [^note-24]: 然而，若莱布尼茨认为空间是关系秩序、关系依赖心、且我们的 <space>_{混淆} 依赖感官知觉，他是否承诺空间本身以某种方式依赖感官知觉？若是，则康德透过先验实在论透镜对他的刻画是否公允就不清楚了。第一，如康德深知，莱布尼茨在《人类理智新论》中主张关系不只是依赖心，而是实际上依赖知性，而非感官知觉。这或许提示：当我们透过知性的透镜考察空间——当我们聚焦于 <space>_{清晰分明}——我们发现空间是一个依赖知性的关系秩序，因为它依赖关系，而关系又是知性“加”给存在着的对象的。也许这里的提示是：关系本身并非 <space>_{混淆} 的一个方面，而实际上是 <space>_{清晰分明} 的一个方面。人们或许会想，我们对空间的受混淆表象把空间表象为一种独立实体，而非关系秩序，因为对莱布尼茨而言，寻常构想把空间描绘成某种准实体是错的。当然，空间实际并不是准实体，因此莱布尼茨末封致克拉克信中所勾勒的关于空间表象来源的正确观点，就不应以这种方式呈现空间。毋宁说，关于空间表象来源的正确观点应当预设空间只是一个关系秩序，并且应当能够在作出这一预设的同时解释那一来源，尽管表象本身把空间表象为*某种有别于关系秩序的东西*。当我们聚焦于 <space>_{清晰分明}，我们发现空间被表象*为*关系秩序，而如前所见，那些关系依赖知性。
    step2: |-
      [^note-24]: 可是，若莱布尼茨认为空间是关系秩序、关系依赖心、而我们的 <space>_{混淆} 又依赖感官知觉，那么他是否承诺：空间本身也以某种方式依赖感官知觉？若然，康德透过先验实在论透镜对他的刻画是否公道，就不好说了。第一，如康德深知，莱布尼茨在《人类理智新论》里主张：关系不只是依赖心，而是依赖知性，而非感官知觉。这或许暗示：透过知性的透镜看空间——聚焦 <space>_{清晰分明}——我们看到空间是一个依赖知性的关系秩序，因为它依赖关系，而关系又是知性“加”到现存对象上去的。也许其暗示是：关系本身不属于 <space>_{混淆}，而属于 <space>_{清晰分明}。有人或许会说：我们对空间的混淆表象把空间表象为一种独立实体，而非关系秩序；因为按莱布尼茨，寻常构想把空间描绘成某种准实体，这是错的。当然，空间其实并非准实体，故莱布尼茨末封致克拉克信所勾勒的空间表象来源之正解，不应如此呈现空间。毋宁说，正解应当预设空间只是关系秩序，并在作此预设的同时解释那一来源，纵然表象本身把空间表象为*某种不同于关系秩序的东西*。聚焦 <space>_{清晰分明} 之时，我们发现空间被表象*为*关系秩序；而如前所示，那些关系依赖知性。
