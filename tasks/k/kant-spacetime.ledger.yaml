      We might return to the first description in the *Critique* of the Leibnizian position regarding space and time, which appears just before Kant begins the Metaphysical Exposition of Space. He asks of space and time: “Are they only determinations or also relations of things, yet such as would belong to things even if they were not intuited?” (A23/B38).[^note-21] This may suggest what Kant has in mind when he contends that the Leibnizians think of space and time as bearing an “absolute reality.” Perhaps what he means is that for Leibniz, space has a reality *independent of intuition*, or that space exists independently of intuition *per se*, even though it may not be independent of the mind *per se*. But then what might this idea mean in more detail?
