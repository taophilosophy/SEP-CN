      As is well known, the distinction between concepts and intuition is also fundamental to Kant’s thought. Whereas intuitions are singular, immediate representations, concepts are general, mediate ones (Engstrom 2006)[^engstrom-2006]. Each item represents properties, objects, or states of affairs, but they do so distinctly. Unfortunately, there is no consensus on the right way to understand this idea.[^note-4]But roughly speaking, intuition represents some *X*—where *X* might be an object, a property, or perhaps even an event—as one represents *X* in perception. Thus it represents *X* as, for instance, *that there*.[^note-5]In contrast, a concept represents *X*—where, again, *X* might be a property, an object, or perhaps even an event—by placing *X* within one or more classes. Suppose that I want to represent my desk, at which I am sitting right now. To represent my desk in intuition is to represent it as something I point to, as *that there*. This does not indicate, of course, that this is a desk, my desk, a piece of furniture, made of wood, etc., but it does pick out a particular, something with a spatial location relative to me and to other things (like the carpet on the floor). It does so *immediately* at least in the sense that it makes use of no other representation. To represent my desk with a concept is to represent it as a *desk*, or as a *piece of furniture*, or as a *wooden thing*, etc. From Kant’s point of view, this is to represent my desk *mediately* at least in the sense that the concept, <desk>, represents an object through other concepts, such as <furniture>.[^note-6] It is also important to remember that in representing my desk through intuition, i.e., in representing it as a thing with some spatial location but not yet *qua* desk, I am *perceiving* the desk but not *judging* it to be a desk (or anything else). In order to *judge* that there is a desk in front of me, or indeed, in order to judge that there is something in front of me, I require concepts and the complex machinery discussed in the famous Transcendental Deduction, a key section of the *Critique* that arrives after the arguments of the Transcendental Aesthetic have been presented. Intuition alone is akin to perception--it plays a role in judgment, but it is not itself akin to judgment.[^note-7]
    step1: |-
      众所周知，概念与直观的区分也是康德思想的根本。直观是单一的、直接的表象，概念则是一般的、中介的表象（Engstrom 2006）[^engstrom-2006]。二者都表象属性、对象或事态，但方式有别。不幸的是，关于如何正确理解这一想法并无共识。[^note-4]但粗略地说，直观表象某个*X*——*X*或许是对象、属性、甚至事件——正如人们在知觉中表象*X*那样。因此它把*X*表象为，例如，*在那里*。[^note-5]相反，概念通过把*X*置入一个或多个类之中来表象*X*——此处*X*同样或许是属性、对象、甚至事件。假设我想表象我此刻正坐其前的书桌。以直观表象我的书桌，就是把它表象为我所指向的某个东西，表象为*在那里*。这当然并不表明这是一张书桌、我的书桌、一件家具、木制的，等等，但它确实挑出一个殊相，即相对于我与别的事物（比如地上的地毯）有空间位置的某物。它这样做至少在如下意义上*直接*：它不使用任何别的表象。用概念表象我的书桌，则是把它表象为一张*书桌*、或一件*家具*、或一个*木制的东西*，等等。从康德的立场看，这至少在如下意义上*中介地*表象我的书桌：概念 <desk> 通过其他概念（如 <furniture>）表象对象。[^note-6] 同样重要的是记住：在以直观表象我的书桌、即把它表象为有某种空间位置但尚未*作为*书桌的某物时，我是在*知觉*书桌，而不是在*判断*它是书桌（或任何别的什么）。要*判断*我面前有一张书桌、乃至判断我面前有某物，我需要概念以及那套著名《先验演绎》所讨论的复杂机制——那是《批判》的关键一节，出现在《先验感性论》的论证之后。单凭直观类似于知觉——它在判断中扮演角色，但它本身并不类似于判断。[^note-7]
    step2: |-
      概念与直观的区分同样是康德思想的基础，这一点尽人皆知。直观是单一的、直接的表象，概念则是一般的、中介的表象（Engstrom 2006）[^engstrom-2006]。两者都表象属性、对象或事态，只是方式不同。可惜学界对怎样理解这一想法尚无定论。[^note-4]粗略说来，直观表象某个*X*——*X*可以是对象、属性，甚至是事件——方式如同人们在知觉中表象*X*。于是它把*X*表象为，比方说，*在那里*。[^note-5]反之，概念是把*X*放进一个或多个类里来表象*X*——*X*照样可以是属性、对象或事件。设想我要表象此刻坐在其前的书桌。以直观表象书桌，就是把它表象为我手指所向的那一个、表象为*在那里*。这当然并不说出它是书桌、是我的书桌、是一件家具、是木头的，等等；但它确实挑出了一个殊相，一个相对于我和别的东西（如地上地毯）有空间位置的某物。它之*直接*，至少在于不动用任何别的表象。以概念表象书桌，则是把它表象为*书桌*、为*家具*、为*木制之物*，等等。在康德看来，这至少在如下意义上*间接*：概念 <desk> 通过别的概念（如 <furniture>）来表象对象。[^note-6] 还要记住：以直观表象书桌——把它表象为占着某处空间却尚未*作为*书桌的东西——我是在*知觉*书桌，而不是在*判断*它是书桌（或任何别的什么）。要*判断*我面前有一张书桌，甚或只判断我面前有某物，就需要概念，以及那套著名《先验演绎》里讨论的复杂机制；该节是《批判》的关键部分，置于《先验感性论》的论证之后。单凭直观类似知觉——它在判断里出力，其自身却并不类似判断。[^note-7]
