      The fact that Kant focuses on the debate between the Leibnizians and the Newtonians is perplexing given his evident lack of interest, within the context of the *Critique*, in problems concerning motion. One of Newton’s principal reasons for distinguishing between an “absolute” (or “mathematical”) and a “relative” (or “common”) conception of space is to ground a distinction between true and merely relative motion. Newton construes the true motion of an object, as opposed to its merely “apparent” motion, not in terms of its change in relations to other objects, as Descartes had done in his *Principles*, but in terms of its change of absolute place (Janiak 2008, chapter five)[^janiak-2008]. So the very idea of absolute or mathematical space helps to express what true motion is. Discovering the true, as opposed to the merely apparent, motions of objects, so that one can then determine the forces that cause these true motions, represents one of the principal goals of Newton’s *Principia*.
    step1: |-
      康德聚焦莱布尼茨派与牛顿派之争，这令人困惑，因为他在《批判》语境中显然对运动问题不感兴趣。牛顿区分“绝对的”（或“数学的”）与“相对的”（或“通俗的”）空间构想，其首要理由之一，是要为真实运动与单纯相对运动之间的区分奠基。牛顿把物体的真实运动、而非单纯“表观的”运动，不按笛卡尔《原理》那样用物体与其他物体关系的变化来说明，而用其绝对位置的变化来说明（Janiak 2008, chapter five）[^janiak-2008]。所以绝对空间或数学空间这一观念本身，就有助于表达真实运动是什么。发现物体的真实运动而非单纯表观运动，从而进一步确定引起这些真实运动的力，正是牛顿《数学原理》的主要目标之一。
    step2: |-
      康德如此看重莱布尼茨派与牛顿派之争，颇费解，因为他在《批判》的语境中明明对运动问题兴致索然。牛顿之所以要区分“绝对的”（或“数学的”）与“相对的”（或“通俗的”）空间构想，首要理由之一，是想为真实运动与单纯相对运动之别奠定基础。牛顿说明物体的真实运动（而非仅仅“表观的”运动），不像笛卡尔《原理》那样凭物体同其他物体关系的变化，而是凭其绝对位置的改变（Janiak 2008, chapter five）[^janiak-2008]。可见绝对空间或数学空间这一观念本身，已足以表达真实运动为何。查明物体的真实运动而非仅表观运动，进而确定造成这些真实运动的力，正是牛顿《数学原理》的主要目标之一。
