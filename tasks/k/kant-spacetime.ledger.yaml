      This seems to suggest that Kant’s interest in the absolutism-relationalism debate does not originate with his concern to discuss *motion* in any sense of the term. In what follows, then, one goal is to specify why Kant remains focused in the Aesthetic on the views of Leibniz and Newton (and their respective followers). It may be that Kant’s interest derives from his general interest in the views of what he calls the “metaphysicians,” the Leibnizians, and of what he calls the “mathematicians,” the Newtonians. Throughout the pre-critical and critical periods, Kant evinces considerable interest in various attempts to reconcile certain aspects of Leibnizian metaphysics with the Newtonian view of nature (Friedman 1992, 1–52)[^friedman-1992]. But there is also more to be said about Kant’s focus on the absolutism-relationalism debate (see especially Messina 2018)[^messina-2018], which we do below.
    step1: |-
      这似乎提示，康德对绝对主义—关系主义之争的兴趣，并非源于他要在任何意义上讨论*运动*的关切。那么下文的一个目标，就是指明康德为何在《感性论》中仍聚焦于莱布尼茨与牛顿（以及各自的追随者）的观点。康德的兴趣或许源于他对所谓“形而上学家”即莱布尼茨派、以及所谓“数学家”即牛顿派观点的普遍兴趣。在前批判与批判时期，康德都对调和莱布尼茨式形而上学某些方面与牛顿式自然观的种种尝试表现出相当的兴致（Friedman 1992, 1–52）[^friedman-1992]。但关于康德聚焦绝对主义—关系主义之争，还有更多可说的（尤其见 Messina 2018）[^messina-2018]，我们下文再谈。
    step2: |-
      看来康德对绝对主义—关系主义之争的兴趣，并不出于他要谈论*运动*（无论取何义）。那么下文的目标之一，便是指明康德在《感性论》里为何仍围着莱布尼茨与牛顿（及各自追随者）的观点打转。这番兴趣或许来自他对所谓“形而上学家”（莱布尼茨派）与所谓“数学家”（牛顿派）观点的普遍关切。无论前批判期还是批判期，康德都热衷于种种调和尝试：试图把莱布尼茨式形而上学的某些方面同牛顿式自然观接榫（Friedman 1992, 1–52）[^friedman-1992]。不过关于康德何以聚焦绝对主义—关系主义之争，还有可说之处（尤其是 Messina 2018）[^messina-2018]，留待下文。
