      In the context of interpreting Kant’s views concerning space and time, a number of philosophical questions are relevant. Kant himself provides a litany of these questions in his so-called *Inaugural Dissertation* of 1770, a text in which he broke with his previous broadly “Leibnizian” views from the pre-critical period (Hatfield 2006, 72–6)[^hatfield-2006]. He writes:
    step1: |-
      在解释康德关于空间与时间的观点时，有若干哲学问题与之相关。康德本人就在他 1770 年的所谓《就职论文》中列举了一连串这样的问题——在这篇文本里，他告别了前批判时期那种大体上“莱布尼茨式”的旧观点（Hatfield 2006, 72–6）[^hatfield-2006]。他写道：
    step2: |-
      解释康德关于空间与时间的观点，牵涉若干哲学问题。康德自己在 1770 年的《就职论文》里就开列了一串这样的问题；这篇文本标志他同前批判时期大体“莱布尼茨式”的旧见分手（Hatfield 2006, 72–6）[^hatfield-2006]。他如此写道：
  - id: 5
