      Kant claims that since we represent space as containing an infinite number of places within it, our representation of space cannot be conceptual. Why should that be? The idea is that although concepts can have an infinite extension—a potentially infinite number of subordinate concepts *under* them—they cannot have an infinite intension, an infinite number of representations *within* them. A concept that is infinite in the latter sense could not be grasped by a finite mind.[^note-15] For a concept to have an infinite extension would be for it to have an infinite number of species, i.e. for it to be possible to distinguish an infinite number of sub-types “under” it on the conceptual tree. This does not harm our ability to grasp any concept within the tree, for to grasp any arbitrarily chosen concept within the tree, I merely need to grasp its constituents (those concepts *within it*), and those would be “above” it on the tree. But our ability to grasp concepts would be affected if they could contain an infinite number of constituents *within themselves*: if, say, <fish> contained an infinite number of constituents—if there were an infinite number of higher-level conceptual taxa “above” <fish> on the tree—it could not be grasped, and might even lack determinate content. Or at least, to specify its content would take an infinite number of steps.
    step1: |-
      康德主张：既然我们把空间表象为其中包含无限多个位置，我们的空间表象就不可能是概念性的。为什么？其想法是：虽然概念可以有无限的外延——其下有潜在无限多个从属概念——它们却不能有无限的内涵，即其内不能有无限多个表象。后一种意义上无限的概念不可能被有限心灵把握。[^note-15] 概念有无限外延，就是它有无限多个种，也就是在概念树上可以区分出无限多个“在它之下”的子类型。这并不损害我们把握树上任何概念的能力，因为要把握树上任选的一个概念，我只需要把握它的构成成分（那些“在它之内”的概念），而那些成分在树上位于它“之上”。但若概念能把无限多个构成成分包含*在自身之内*，我们把握概念的能力就会受损：比如说，若 <fish> 包含无限多个构成成分——若概念树上“在” <fish> 之“上”有无限多个更高阶的概念分类单元——它就不可能被把握，甚至可能缺乏确定的内容。或者至少，指明它的内容需要无限多个步骤。
