      Kant may have other reasons for thinking that our representation of space is not a concept. If we recall Kant’s view that concepts are general, mediate representations, and his view of how these facts are reflected in the conceptual trees discussed above, then there is indeed at least a *prima facie* puzzle as to how we could have a concept, in Kant’s sense, of space. Consider a contrast class. Even if we think that <God> represents only a single entity, that fact does not undermine Kant’s view that this concept is a general, mediate representation (cf. Thompson 1972, 318–19, 328–29)[^thompson-1972]. For we represent God, in Kant’s view, by representing it through other concepts: for instance, God is a necessary substance (A678/B706), so <God> is a mediate representation. This is distinct from the way in which an intuition represents something. And the concept <substance>—which is one of the categories (A80/B106)—is a representation that we can grasp independently of grasping <God>. Hence <substance> is a constituent of <God>, but not *vice versa*. Moreover, <God> is a *general* representation because it places God within another class, namely the class of substances. It will then be a matter of some dispute whether the *generality* criterion and the *mediacy* criterion amount to the same thing (cf. Parsons 1992, 63–6)[^parsons-1992]. But the key point here is this: the fact that <God> picks out a single individual—and perhaps even, *can pick out only a single individual*—does not entail that this concept is not general or mediate. This suggests, in turn, that Kant’s point in the Metaphysical Exposition cannot be that our representation of space picks out a single individual and therefore cannot be a concept. Rather, he presumably thinks that we do not represent space either: (1) by representing its constituents, namely places; or (2) by representing it *through* other concepts. We have discussed (1) above; what about (2)?
    step1: |-
      康德认为空间表象不是概念，或许还有其他理由。若回想康德的看法——概念是一般的、中介的表象——以及他关于这些事实如何反映在上述概念树中的看法，那么至少表面上确实存在一个谜：我们怎么可能拥有康德意义上的空间概念？试考虑一个对照类。即便我们认为 <God> 只表象单一实体，这一事实也不削弱康德认为该概念是一般的、中介的表象这一观点（参 Thompson 1972, 318–19, 328–29）[^thompson-1972]。因为按康德的看法，我们表象上帝，是通过其他概念表象它：例如，上帝是必然实体（A678/B706），所以 <God> 是中介表象。这与直观表象某物的方式不同。概念 <substance>（范畴之一，A80/B106）则是我们可以独立于把握 <God> 而把握的表象。所以 <substance> 是 <God> 的构成成分，但反之不然。此外，<God> 是*一般的*表象，因为它把上帝置于另一个类之中，即实体类。普遍性标准与中介性标准是否等同，仍会有争议（参 Parsons 1992, 63–6）[^parsons-1992]。但这里的关键是：<God> 挑出单一个体——甚至也许*只能挑出单一个体*——这一事实并不蕴含该概念不是一般的或中介的。这反过来提示，康德在形而上学阐明中的要点不可能在于：我们的空间表象挑出单一个体，因此不可能是概念。毋宁说，他大概认为我们对空间既不：（1）通过表象其构成成分即位置来表象；也不（2）*通过*其他概念来表象。我们在上文中讨论了（1）；（2）又如何？
    step2: |-
      康德认定空间表象不是概念，也许还有别的理由。若回想他的主张——概念是一般的、中介的表象——连同他关于这套事实如何在上述概念树上体现的看法，那么至少表面上看，确有一个谜：我们怎么可能拥有康德意义上的空间概念？看一个对照类。就算 <God> 只表象单个实体，也不妨碍康德认定这个概念是一般的、中介的表象（参 Thompson 1972, 318–19, 328–29）[^thompson-1972]。因为按康德，我们经由其他概念表象上帝：例如上帝是必然实体（A678/B706），故 <God> 是中介表象。这与直观表象事物的方式判然有别。概念 <substance>（范畴之一，A80/B106）则可独立于 <God> 而被把握。所以 <substance> 是 <God> 的成分，反之则不然。况且 <God> 是*一般的*表象，因为它把上帝放进另一个类——实体类。普遍性标准与中介性标准是否为一回事，仍可争论（参 Parsons 1992, 63–6）[^parsons-1992]。但关键在此：<God> 挑出单个个体——甚至也许*只能挑出单个个体*——并不蕴含这个概念非一般或非中介。这反过来提示：康德在形而上学阐明中的要点，不可能是说我们的空间表象挑出单个个体，所以不可能是概念。毋宁说，他大概认为我们对空间既不：（1）借表象其构成成分（位置）来表象；也不（2）*经由*其他概念来表象。（1）上文已谈；（2）呢？
