      What Kant calls the Metaphysical Exposition of the Concept of Space presents the first arguments of the Transcendental Aesthetic. Kant defines the “exposition” of a concept as follows: “By an exposition (*expositio*) I understand the clear (if it is not explicit) representation of what belongs to a concept; it is metaphysical if it contains what the concept presents as *a priori* given” (A23/B38). By a concept (*Begriff*) in this context I take Kant simply to mean a representation.[^note-8] So his goal is to characterize the content of the representation of space. For Kant, an “exposition” is different from a definition: he is not undertaking a definition of space, the word ‘space,’ or the concept <space> (for helpful discussion, see Dunlop 2012)[^dunlop-2012]. In this regard, Kant follows a long tradition emanating from Newton’s Scholium following the Definitions in the *Principia*, where Newton explains that space, time and motion are familiar to everyone and therefore will not be defined in his work, unlike unfamiliar technical concepts like mass or impressed force, which are defined (Newton 1999, 408)[^newton-1999]. Unlike Newton, however, Kant focuses primarily on our representation of space, rather than on space itself. That seems to be expressed by his notion of an exposition.
    step1: |-
      康德所谓空间概念的“形而上学阐明”，呈现了《先验感性论》的第一批论证。康德把概念的“阐明”定义如下：“我把阐明（*expositio*）理解为把属于一个概念的东西清楚地（尽管不明晰也可以）表象出来；若它包含概念*先天*给出的东西，则是形而上学的”（A23/B38）。在此语境中，我理解康德所说的概念（*Begriff*）不过就是表象。[^note-8] 所以他的目标是刻画空间表象的内容。对康德来说，“阐明”不同于定义：他不是在给空间、给“空间”这个词、或给概念 <space> 下定义（有助益的讨论见 Dunlop 2012）[^dunlop-2012]。就此而言，康德追随一条源自牛顿《数学原理》诸定义之后附注的悠久传统：牛顿解释说，空间、时间与运动为人人熟悉，因此不会在其著作中被定义，不熟知的专门概念如质量或冲力则被定义（Newton 1999, 408）[^newton-1999]。然而与牛顿不同，康德主要聚焦于我们对空间的表象，而非空间本身。这似乎由他的阐明观念表达出来。
    step2: |-
      康德所谓空间概念的“形而上学阐明”，构成《先验感性论》的头一批论证。康德如此界定概念的“阐明”：“我把阐明（*expositio*）理解为把属于一个概念的东西清晰地表象出来（即便不是明证的）；若阐明所含为概念*先天*所予者，则为形而上学的”（A23/B38）。在此语境中，我理解康德所谓概念（*Begriff*）无非就是表象。[^note-8] 他要做的，是刻画空间表象的内容。对康德而言，“阐明”不同于定义：他并非要为空间、“空间”一词或概念 <space> 下定义（可参 Dunlop 2012 的有益讨论）[^dunlop-2012]。这一步他沿袭了源自牛顿《数学原理》定义附注的悠久传统：牛顿在那里说明，空间、时间与运动人尽皆知，故不在书中定义；质量、冲力之类生僻的专门概念才有定义（Newton 1999, 408）[^newton-1999]。但与牛顿不同，康德把焦点放在我们对空间的表象、而非空间本身上。他的“阐明”观念似乎正表达了这一点。
