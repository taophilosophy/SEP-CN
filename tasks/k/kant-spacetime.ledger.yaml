      But what if we abstract away from questions of physical motion? What if we consider motion within a much more abstract context: for instance, can the motion of a *mathematical point* through space be considered in the Aesthetic? Kant makes it clear that this remains empirical because the concept of motion itself is empirical, and so should still be deferred to the *Metaphysical Foundations*. Indeed, the latter begins with a consideration of motion in abstraction from various physical questions like the mass of the objects and then slowly progresses by adding further physical (or empirical) elements.
    step1: |-
      但若我们撇开物理运动问题呢？若我们在一个远为抽象的语境中考察运动，例如，一个*数学点*穿过空间的运动，能否在《感性论》中考察？康德表明这仍是经验的，因为运动概念本身就是经验概念，所以仍应交由《自然科学的形而上学基础》。确实，该书以抽象于质量等种种物理问题的运动之考察开篇，然后逐步添加更多物理（或经验）要素。
