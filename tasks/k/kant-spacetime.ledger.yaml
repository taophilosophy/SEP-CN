      我们可以回到《批判》中对莱布尼茨式空间时间立场的第一个描述，它出现在康德开始空间的形而上学阐明之前。他问空间与时间：“它们只是事物的规定或也是事物的关系，却仍是即使事物未被直观也属于事物的？”（A23/B38）[^note-21] 这或许暗示康德主张莱布尼茨派把空间时间视为具有“绝对实在性”时心中所想。也许他的意思是：对莱布尼茨而言，空间具有*独立于直观*的实在性，或空间就其本身而言独立于直观而存在，尽管它可能不就其本身而言独立于心。但这观念更细说是什么意思？
