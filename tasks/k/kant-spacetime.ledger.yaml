      It is not clear that this argument is successful. It seems, e.g., to conflate the following: (1) the relation between space and its parts; and, (2) the relation between the representation of space and its constituents. Without this conflation, it is not clear why we should expect to construct our concept of space from our concept of place. It would seem more sensible to construct our concept of space from other concepts, such as that of infinity, or that of a magnitude, and so on, rather than from the concept of a place. The claim of the conflation is predicated on the notion that Kant’s third argument concerns the representation of space rather than space itself. This notion, in turn, may conflict with the letter, although perhaps not with the spirit, of the first sentence of the third argument, which mentions that “Der Raum,” or space, is not a concept, but rather is an intuition. If one follows the letter of the argument, one can avoid this apparent conflation. But the price is somewhat high: what does it mean to wonder whether space itself is a concept, and who held something like that view? On the face of it, such a view may seem rather odd to the contemporary reader.[^note-14] One way to make progress in understanding this view is to re-read Leibniz. It is possible to read Leibniz as arguing that space itself is a kind of abstraction, rather than a real entity or substance, and perhaps it is not a stretch to contend that space must be a conceptual abstraction, like the entities of what Leibniz might call pure mathematics. That is, space itself, on this view, is a kind of conceptual abstraction in the way that an isosceles triangle is an abstraction, or a line is an abstraction, rather than a real entity or substance. Of course, this requires us to understand Leibniz’s position through a Kantian lens. Even so, if the view in focus is that space itself is a kind of concept, it remains unclear why one wouldn’t say that this concept is dependent on other constitutive concepts, such as the concept of infinity or that of homogeneity, which Kant himself tackles in the next numbered argument. Perhaps the best answer here is to read Kant as engaging specifically with Leibniz’s argument in his last (fifth) exchange with Clarke, mentioned above. The idea is that Leibniz’s argument might be understood as involving the claim that the concept of place is constitutive of the concept of space, and that space itself is really nothing but a kind of concept, which licenses the exclusive focus on the concept of space. Then the claim would be that the Leibnizian view that space itself is a conceptual abstraction obtained through some process of perceiving objects occupying various places is wrong on both counts.
    step1: |-
      这一论证是否成功并不清楚。它似乎，例如，混淆了：（1）空间与其部分之间的关系；与（2）空间表象与其构成成分之间的关系。若没有这种混淆，就不清楚我们为何应期待从位置概念构造出空间概念。从其他概念（如无限性概念、或大小概念等等）构造空间概念，似乎比从位置概念出发更合理。混淆论的主张，以康德的第三个论证关涉空间表象而非空间本身这一理解为前提。这一理解又可能与第三个论证第一句话的字面意思——尽管或许不与其精神——冲突：那句话提到，“Der Raum”或空间，不是概念，而是直观。若循论证的字面意思，就可以避免这一明显的混淆。但代价有些高昂：疑问空间本身是否是一个概念，是什么意思？谁持有类似的观点？表面上看，这样的观点在当代读者看来可能颇为怪异。[^note-14] 理解这一观点的一条路是重读莱布尼茨。可以把莱布尼茨读作主张空间本身是一种抽象，而非实在的实体或实体，也许说空间必定是一种概念抽象——类似莱布尼茨或许会称之为纯数学的那些实体——并不夸张。也就是说，按此观点，空间本身就是一种概念抽象，就像等腰三角形是一种抽象、或线是一种抽象那样，而不是实在的实体或实体。当然，这要求我们透过康德的透镜理解莱布尼茨的立场。即便如此，若焦点中的观点是空间本身是一种概念，仍不清楚人们为何不说这个概念依赖于其他构成性概念，如无限性概念或齐一性概念——康德本人在下一个编号论证中处理了它们。也许此处最好的回答，是把康德读作专门针对莱布尼茨在上述与克拉克的最后一次（第五次）交锋中的论证。其想法是：莱布尼茨的论证或许可以理解为包含这样的主张——位置概念构成空间概念，空间本身其实不过是一种概念，这就为只聚焦于空间概念提供了依据。于是，主张就是：莱布尼茨式的观点——空间本身是通过感知对象占据各种位置的过程获得的概念抽象——在两头上都错了。
