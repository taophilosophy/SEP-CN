      > Those, however, who assert the absolute reality [absolute Realität] of space and time, whether they take it to be subsisting or only inhering, must themselves come into conflict with the principles [Principien] of experience. For if they decide in favor of the first (which generally is the position of the mathematical investigators of nature), then they must assume two eternal and infinite self-subsisting non-entities (space and time), which are there (yet without there being anything actual) only in order to comprehend everything actual within themselves. (A39/B56–A40/B57)[^note-25]
