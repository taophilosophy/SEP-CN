      Kant is perfectly well aware of these details from the Scholium to the *Principia*, but he makes it clear in the Transcendental Aesthetic that he wishes to bracket questions concerning the motion of objects. The reason is that he regards <motion> as an empirical concept, and the Aesthetic aims to articulate a purely *a priori* conception of space (see A 41/B 58; also MFNS, 4: 482). Instead, Kant tackles physical motion in the *Metaphysical Foundations*, where he contends that one can distinguish true from relative motion by determining the center of mass frame of the solar system (4: 482, 487, 555–6, 559–63), thereby avoiding the postulation of Newton’s mathematical (absolute) space.
    step1: |-
      康德对这些《数学原理》附注中的细节了如指掌，但他在《先验感性论》中表明，他要把关于物体运动的问题搁置起来。原因在于他把 <motion> 视为经验概念，而《感性论》旨在阐明一种纯粹*先天*的空间构想（见 A 41/B 58；亦见 MFNS, 4: 482）。康德转而在《自然科学的形而上学基础》中处理物理运动，他主张只要确定太阳系的质心系，就能区分真实运动与相对运动（4: 482, 487, 555–6, 559–63），从而避免设定牛顿的数学（绝对）空间。
    step2: |-
      康德对《数学原理》附注中的这些细节一清二楚，却在《先验感性论》中明言要把物体运动的问题括起来。理由是他把 <motion> 当作经验概念，而《感性论》意在阐明纯粹*先天*的空间构想（见 A 41/B 58；又见 MFNS, 4: 482）。物理运动另由康德在《自然科学的形而上学基础》中处理：他认为，只要确定太阳系的质心系，就能判别真实运动与相对运动（4: 482, 487, 555–6, 559–63），由此不必设定牛顿的数学（绝对）空间。
