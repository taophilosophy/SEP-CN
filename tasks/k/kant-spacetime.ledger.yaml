      The distinction between sensation and intuition in Kant’s thinking is fundamental to his overarching conception of space and time. This is the case for several reasons, not least because one should avoid thinking that Kant takes us to have a sensation of space; we have, rather, an intuition of it (see Carson 1997)[^carson-1997]. The distinction has many facets, but the basic idea is as follows. Sensations are subjective in the sense that they do not represent objects, they are modifications of the subject. A good example of a sensation would be an itch that I feel. Of course, an itch might be caused (e.g.) by some flour that fell on my nose while baking cookies, but the itch does not represent the flour, or indeed anything outside myself; the itch is simply what I feel. If we felt only sensations, we would lack representations of things other than ourselves, even if such things caused or helped to cause our sensations. Perhaps sensations would enable us to avoid injury or pain--one might, say, jump back when feeling heat from a fire. But without intuition, we would lack spatial awareness: that is, we would lack an awareness of things in spatial locations around us. In order to represent things other than ourselves, we require intutition, which Kant regards as a singular, immediate, objective representation (where sensations are merely subjective, as we have seen). In what sense is intuition an objective representation that is singular and immediate? That complex idea means, for starters, that intuition represents particulars, i.e., things with some spatial location vis-à-vis me and also other things. So when I feel an itch, I have a sensation; when I see the pile of flour in front of me next to the bowl on my counter, I have an intuition, a representation of something in space with a location relative to me and to other things. However, although intuition can represent flour on the counter next to the bowl, it does not represent it *as* flour. For that, one would require a *concept*.[^note-3]
    step1: |-
      康德思想中感觉与直观的区分，对其关于空间时间的总体构想是根本性的。这有若干理由，尤其因为人们不应以为康德认为我们对空间有感觉；我们毋宁是对空间有直观（见 Carson 1997）[^carson-1997]。这一区分有许多侧面，基本想法如下。感觉是主观的，意思是它们不表象对象，它们是主体的变状。一个好的感觉例子是我感到的一阵痒。当然，一阵痒可能（例如）由烘焙饼干时落在我鼻子上的面粉引起，但痒并不表象面粉，也不表象任何外在于我的东西；痒不过是我所感到的。若我们只有感觉，我们就会缺少关于自身以外之物的表象，即便这些物引起了或有助于引起我们的感觉。也许感觉能使我们避受伤痛——比如感到火的热时可能往后跳。但没有直观，我们就缺少空间意识：也就是说，我们将缺少对周围空间中事物的觉察。要表象自身以外之物，我们需要直观，康德视之为单一的、直接的客观表象（而我们已见，感觉只是主观的）。直观在何种意义上是单一而直接的客观表象？这一复杂观念首先意味着：直观表象殊相，即相对于我以及其他事物具有某种空间位置的东西。所以当我感到一阵痒，我有感觉；当我看见我面前、柜台上的碗旁边那一堆面粉，我有直观，即对空间中某物的表象，该物相对于我与别的事物有位置。然而，尽管直观能表象柜子上碗旁的面粉，它并不表象其为面粉。那需要概念。[^note-3]
    step2: |-
      感觉与直观之别，是康德空间时间总体构想的基石。理由不止一端，尤其要避免以为康德主张我们对空间有感觉；我们有的是对空间的直观（见 Carson 1997）[^carson-1997]。这一区分侧面甚多，基本意思如下。感觉是主观的，意即它不表象对象，只是主体的变状。感到一阵痒，就是感觉的好例子。痒当然可能由某物引起（比如烤饼时落到鼻子上的面粉），但它并不表象面粉，也不表象任何在我之外的东西；痒就是我所感到的而已。若我们只有感觉，便不会有关于自身之外事物的表象，纵然那些事物引起了或促成了我们的感觉。感觉或可帮我们避痛——感到火的热便往后跳。但若无直观，我们便无空间意识，也就是没有对周围空间中之物的觉察。要表象自身之外的事物，就须有直观；康德把它看作单一的、直接的客观表象（感觉则如前所述，只是主观的）。直观何以是单一而直接的客观表象？这一复合观念首先意味着，直观表象殊相，即相对于我和其他事物占据某种空间位置的东西。我觉出痒，那是感觉；我看见面前柜上碗旁那堆面粉，那是直观，即对空间中一物的表象，该物相对于我、相对于他物皆有位置。但直观虽能表象柜上碗旁的面粉，却不能把它表象*为*面粉。那要概念才办得到。[^note-3]
