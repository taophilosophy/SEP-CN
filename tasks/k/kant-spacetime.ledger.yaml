      > 但我把一切显象的*先验观念论*理解为这样一种学说：一切显象都应被视为单纯的表象，而非物自身，因而空间与时间只是我们直观的感性形式，而不是自在地被给予的规定，也不是作为物自身的对象之条件。与这种观念论相对的是*先验实在论*，它把空间与时间视为自在地被给予的某物（独立于我们的感性）。所以先验实在论者把外部显象（当人们承认其实在性时）表象为物自身，这些物自身会独立于我们与我们的感性而存在，因而也会依纯粹知性概念而在我们之外。（A369）
