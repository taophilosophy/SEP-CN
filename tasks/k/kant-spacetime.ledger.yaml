      We have seen in the Metaphysical Exposition that we have a pure (or *a priori*) intuition of space, that is, a non-empirical, singular, immediate representation of space. But how is such a representation so much as possible? If we are considering an *empirical*, singular, immediate representation, we can easily understand that in cases of ordinary perception, we can (e.g.) see a rose in a vase in front of us. Hence our perception may include a singular, immediate representation—that is, we may represent *that there*, an object with a spatial location. This empirical case is reasonably clear, but what does it mean to contend that we have a non-empirical, singular, immediate representation? This cannot be akin to a case of seeing an object directly in front of us, for one of Kant’s points in the Metaphysical Exposition, as we have seen, is that the representation of places, and of objects as bearing spatial relations, *presupposes* the (non-empirical) representation of space. But if our representation of space is not akin to seeing something directly in front of us, then what makes it immediate and singular? Kant’s suggestion in the passage above appears to be that intuition must somehow have its seat in the subject—it must somehow be a “form” of the mind, or more precisely, of what Kant calls here “outer sense”. This obviously brings us very close to the formulation of transcendental idealism—that view is stated explicitly for the first time in the *Critique* in the very next paragraph of the Transcendental Aesthetic. But the paragraph quoted above, coupled with Kant’s discussion of what a Transcendental Exposition is meant to be, suggests that part of Kant’s goal here is to *explain how a non-empirical, singular, immediate representation of space is possible*. (This is parallel to explaining how synthetic *a priori* knowledge within geometry is possible.)
    step1: |-
      我们在形而上学阐明中已经看到：我们拥有关于空间的纯粹（或*先天*）直观，即一个非经验的、单一的、直接的空间表象。但这样的表象何以可能？若我们考虑的是*经验的*、单一的、直接的表象，我们可以轻松理解，在普通知觉的情形中，我们（例如）能看见面前花瓶中的一枝玫瑰。于是我们的知觉可以包含单一的、直接的表象——也就是说，我们可以表象*那里那个*，即一个有空间位置的对象。这一经验情形相当清楚，但主张我们拥有一个非经验的、单一的、直接的表象，是什么意思？这不可能类似于直接看见面前某物的情形，因为康德在形而上学阐明中的要点之一，如前所见，正是位置的表象、以及把对象表象为有空间关系，*预设了*空间的（非经验）表象。但若我们的空间表象不类似于直接看见面前的某物，那么什么使它成为直接的与单一的？康德在上面那段话中的提示似乎是：直观必须以某种方式在主体中有其位置——它必须以某种方式是心的一个“形式”，或更精确地说，是康德此处所谓“外感官”的一个形式。这显然把我们带到非常接近先验观念论表述之处——该观点在《批判》中首次被明确陈述，就在《先验感性论》紧接着的下一段。但上面引用的段落，连同康德关于先验阐明之所是的讨论，提示康德此处的部分目标是*说明一个非经验的、单一的、直接的空间表象如何可能*。（这与解释几何学中的综合*先天*知识如何可能相平行。）
    step2: |-
      形而上学阐明已让我们看到：我们拥有关于空间的纯粹（或*先天*）直观，即非经验的、单一的、直接的空间表象。可是这样的表象怎么可能？若所论是*经验的*、单一的、直接的表象，我们不难理解：在寻常知觉里，我们可以（比方说）看见面前花瓶里的一枝玫瑰。于是知觉可以含一个单一的、直接的表象——我们表象*那里那个*，即占有一个空间位置的对象。经验情形相当明白。但“我们拥有一个非经验的、单一的、直接的表象”究竟何意？它不可能像直接看见面前的某物那样，因为康德在形而上学阐明中的要点之一（如前所见）正是：位置的表象、把对象表象为具有空间关系，已*预设了*空间的（非经验）表象。可若空间表象并不像直接看见面前某物，那它凭什么直接、凭什么单一？康德在上段话里的暗示似乎是：直观必须以某种方式安顿在主体之中——必须是心的一个“形式”；更精确说，是康德此处所谓“外感官”的形式。这显然已非常接近先验观念论的表述——该观点在《批判》中第一次被明确说出，就在《先验感性论》紧接的下一段。不过上面这段引文，连同康德对先验阐明之所是的讨论，暗示他在这里的部分目标是*说明非经验的、单一的、直接的空间表象如何可能*。（这与解释几何学内综合*先天*知识如何可能相平行。）
