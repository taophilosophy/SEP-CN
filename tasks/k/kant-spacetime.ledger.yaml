      One might read Kant’s second argument instead as straightforwardly targeting the view that the representation of space is empirical. Kant claims that we cannot represent the absence of space, but that we can represent space as empty of objects. His point may be that empiricist philosophers who contend that the representation of space is obtained from the perception of objects must bear the burden of explaining how it is possible for us to conceive of space as empty of such objects. This consideration appears to be rather weak. But the further contention that one cannot represent the absence of space may be more difficult for an empiricist to accept. *Prima facie*, it is difficult to see why, if our representation of space is indeed empirical in origin, we should lack the ability to conceive of space’s *absence*. This might be read as Kant’s *prima facie* point against an empiricist view of the representation of space.
