      许多解释者认为，在《纯粹理性批判》中、尤其是在其第一节“先验感性论”里，康德试图以先验观念论来应对莱布尼茨式“关系主义”与牛顿式“绝对主义”的空间构想。[^note-1] 如查尔斯·帕森斯所说，“如今称为绝对主义与关系主义两种空间时间构想之间的争端，由牛顿与莱布尼茨典范地代表”，构成了“［康德］一切思考”关于空间与时间的“背景”（Parsons 1992, 67; 参 Torretti 1999, 105）[^parsons-1992]。在《先验感性论》开头，康德以对照莱布尼茨派与牛顿派未能恰当构想空间的失败来框定自己的观点：
