      [^note-23]: The contention that transcendental idealism and transcendental realism differ in their conceptions of the relation between *space* and *intuition*, rather than *space* and *the mind*, is significant. For as we have seen, Leibniz does not think that space is real in the sense of being independent of the mind *per se*; space is a relational order and relations are dependent on “the understanding.” Rather, on Kant’s reading, he thinks space is independent of intuition *per se*.
    step1: |-
      [^note-23]: 主张先验观念论与先验实在论的差别在于对*空间*与*直观*（而非*空间*与*心*）关系的构想，这一点意义重大。因为如前所见，莱布尼茨并不认为空间是独立于心本身意义上的实在；空间是一个关系秩序，而关系依赖“知性”。毋宁说，按康德的解读，他认为空间独立于直观本身。
