      Absolutism raises other difficulties. It is possible to think of space as an instantaneous framework projected onto reality by the mind.[^note-18] If space is such a mind-dependent framework, it could still be thought of as independent of objects. At any rate, if absolutism indicates that space is independent of all objects and relations, and if that is held to entail that it must be independent of the mind as well, we probably require some clarification of this entailment, for it is not obvious (Ishiguro 1972, 109)[^ishiguro-1972]. In fact, Kant may have defended an absolutist-idealist conception of space in the *Inaugural Dissertation* of 1770 (Friedman 1992, 29–31)[^friedman-1992]. Clarity can be achieved only if one avoids conflating these myriad views.
    step1: |-
      绝对主义还带来别的困难。可以设想空间是心投射到实在之上的一个瞬时框架。[^note-18] 若空间是这样一个依赖心的框架，它仍可被想成独立于对象的。无论如何，若绝对主义表明空间独立于一切对象与关系，而人们又认为这蕴含空间也必须独立于心，那我们大概需要澄清这一蕴含，因为它并不显然（Ishiguro 1972, 109）[^ishiguro-1972]。事实上，康德在 1770 年《就职论文》中可能辩护过一个绝对主义—观念论的空间构想（Friedman 1992, 29–31）[^friedman-1992]。只有避免混淆这些纷繁观点，才能获得清晰性。
