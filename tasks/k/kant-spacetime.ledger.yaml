      康德确实明显影射了这一理论背景，但值得注意的是，他在《感性论》中所辩护的那类观点——空间与时间是先验观念的、它们只是直观的“形式”、它们依赖于“心的主观构造”，等等——并不明显与莱布尼茨—牛顿之争相接。这就引出关于康德如何运用莱布尼茨—牛顿背景的问题。第一，康德如何理解莱布尼茨式与牛顿式的空间时间构想？他是否只把它们当作关于我所谓空间相对于对象与关系之地位的观点，还是认为它们包含、或也许蕴含关于其他议题的观点，例如我们空间时间表象的品格？康德是否认为自己需要削弱这些先前景象中的一方或双方，以支持空间与时间是先验观念的结论？康德把莱布尼茨式与牛顿式构想*双双*斥为“先验实在论”的类型，这是否照亮了他所谓先验观念论的含义？最后，康德如此刻画其前辈的观点，是否站得住脚？这些问题将有助于引导下文的讨论。
