      Various confusions can plague one’s understanding of the modern debate between absolutism and relationalism about space and time—some of these confusions are especially pervasive in discussions of Kant’s views. For instance, absolutism is sometimes conflated with realism, and idealism with relationalism. One reason for the first conflation may be historical in nature. In their celebrated correspondence, which forms part of the essential background to Kant’s work on space and time in the *Critique*, Clarke and Leibniz often consider the proposition: *space is real*. By our lights, realism and anti-realism concern the question of whether something is in some sense dependent on the mind. We ask this question about tables and chairs, numbers and sets, and all manner of other things. But when Leibniz and Clarke discuss the “reality,” or the “absolute reality,” of space, they are typically concerned with the question of space’s status vis-à-vis objects. This is clearly the case when Leibniz and Clarke consider one of the principal questions of their correspondence, whether their common acceptance of the principle of sufficient reason entails that one of them holds the correct conception of space (cf. L3: 4 and C 3: 4–5). Leibniz contends, while Clarke denies, that if space were independent of objects, God would lack a sufficient reason for placing the objects of the universe into space with one orientation rather than another. Leibniz concludes from this that space lacks “reality” or that it lacks “absolute reality” (see L5: 29 and L5: 36). *Based on precisely the same considerations*, Leibniz denies that space is “absolute” (L3: 2–3, L3: 5, L4: 16, L4: 9–10) and contends that it is “relative” (L3: 4). Hence in this context, for space to be *real* is for space to exist independently of objects and relations.
    step1: |-
      种种混淆会妨害人们对近代关于空间时间之绝对主义与关系主义之争的理解——其中一些混淆在关于康德观点的讨论中尤为普遍。例如，绝对主义有时被混同于实在论，观念论被混同于关系主义。第一种混淆的一个理由可能是历史性的。在他们那场著名的通信中——它构成康德《批判》中空间时间工作的基本背景之一——克拉克与莱布尼茨常常考察这个命题：*空间是实在的*。按我们的眼光，实在论与反实在论关乎某物是否在某种意义上依赖于心。我们对桌椅、数、集合以及各种各样的事物都问这个问题。但当莱布尼茨与克拉克讨论空间的“实在性”或“绝对实在性”时，他们通常关心的是空间相对于对象的地位问题。当莱布尼茨与克拉克考察他们通信中的主要问题之一——他们共同接受的充足理由律是否蕴含其中一人持有正确的空间构想（参 L3: 4 与 C 3: 4–5）——时，情形显然如此。莱布尼茨主张（克拉克否认）：若空间独立于对象，上帝就会缺乏充足理由以某一朝向而非另一朝向把宇宙的对象置入空间。莱布尼茨由此推出空间缺乏“实在性”或缺乏“绝对实在性”（见 L5: 29 与 L5: 36）。*恰恰基于同样的考量*，莱布尼茨否认空间是“绝对的”（L3: 2–3, L3: 5, L4: 16, L4: 9–10），并主张它是“相对的”（L3: 4）。因此在此语境中，空间是*实在的*，等于空间独立于对象与关系而存在。
    step2: |-
      理解近代关于空间时间的绝对主义—关系主义之争时，种种混淆会作祟，其中一些在讨论康德时尤为流行。比如，绝对主义有时被当作实在论，观念论被当作关系主义。头一种混淆或出于历史原因。在克拉克与莱布尼茨那场著名通信中——它是康德《批判》空间时间思考的基本背景之一——双方常讨论这样一个命题：*空间是实在的*。按今日眼光，实在论与反实在论问的是某物是否在某种意义上依赖心。我们对桌椅、数、集合乃至万事万物都会问这个。可莱布尼茨与克拉克谈空间的“实在性”或“绝对实在性”时，通常问的是空间相对于对象的地位。两人讨论通信中的主要问题之一——双方共同接受的充足理由律是否蕴含其中一人拥有正确的空间构想（参 L3: 4 与 C 3: 4–5）——时，情形显然如此。莱布尼茨主张而克拉克否认：空间若独立于对象，上帝便缺少充足理由以某一朝向、而非别的朝向把宇宙对象放进空间。莱布尼茨据此断定空间缺乏“实在性”、或缺乏“绝对实在性”（见 L5: 29 与 L5: 36）。*依据同一套考量*，他又否认空间是“绝对的”（L3: 2–3、L3: 5、L4: 16、L4: 9–10），并主张它是“相对的”（L3: 4）。故在此语境中，说空间*实在*，即说空间独立于对象与关系而存在。
