      The view that space cannot exist independently of objects at any given instant does seem to entail that space cannot be utterly devoid of objects. Leibniz thinks that space is the order of the actual and *possible* relations among objects, so he has the resources to say that space can contain empty sectors—see *New Essays*, 127, and L 5: 43—but it seems he cannot claim that space is *altogether* empty, for then object relations would be absent. Yet this view seems perfectly compatible with the idea that we can *conceive* of empty space. Leibniz himself makes repeated and explicit use of the thought of such a situation when attempting to undermine the Newtonian view that space is absolute. Instead of arguing that the idea that space could be independent of objects is incoherent, Leibniz contends that it violates the principle of sufficient reason (see L3: 5; L 5: 53), a principle Clarke himself defends in a distinct version. The “fiction” (L5: 29; cf. L5: 55) that space could exist independently of objects violates the principle because the homogeneity and uniformity of space prevent there from being any reason for God to place the objects of the universe with one particular orientation within absolute space rather than with any other possible orientation. The idea that God could place objects within a pre-existing absolute space with one orientation rather than another is evidently not incoherent; rather, God would lack a *reason* for doing this. Similarly, Leibniz contends that absolutism violates the principle of the identity of indiscernibles (L4: 16) and that it bears theological difficulties (L4: 10).
    step1: |-
      空间在任何给定瞬间都不能独立于对象而存在，这一看法确实蕴含空间不可能完全没有对象。莱布尼茨认为空间是对象间现实的与*可能的*关系的秩序，所以他有资源说空间可以包含空的区段——见《人类理智新论》，127，及 L 5: 43——但看来他不能宣称空间*完全*为空，因为那样对象关系就会缺席。然而这一观点与我们能*设想*空空间的想法似乎完全相容。莱布尼茨本人在试图削弱牛顿的空间绝对主义时，反复且明确地使用了对这种情形的设想。莱布尼茨不是主张“空间可以独立于对象”这一观念不融贯，而是主张它违反充足理由律（见 L3: 5；L 5: 53）——克拉克自己也以一种不同的版本为该原则辩护。“空间可以独立于对象而存在”这一“虚构”（L5: 29；参 L5: 55）之所以违反该原则，是因为空间的齐一性与均匀性使得没有任何理由让上帝以某一特定朝向、而非任何其他可能的朝向，把宇宙的对象安置于绝对空间之中。上帝可以把对象安置于一个先已存在的绝对空间之中、以这一朝向而非那一朝向——这一观念显然并非不融贯；毋宁说，上帝会缺乏这样做的*理由*。类似地，莱布尼茨主张绝对主义违反不可分辨者的同一原则（L4: 16），并带有神学困难（L4: 10）。
