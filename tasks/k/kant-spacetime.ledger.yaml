      What, then, of Kant’s famous contention that endorsing transcendental realism commits one to empirical idealism (A368–9)? It would seem, *prima facie*, that Berkeley ought to be committed to empirical idealism, and yet Kant interprets him as *rejecting* transcendental realism. I take it that Berkeley avoids transcendental realism, and therefore merely empirical idealism, by defending a more radical *dogmatic* idealism (B274–5). According to that view, there are no objects or properties that are independent of intuition.[^note-29] In contrast, Kant interprets the Leibnizians as thinking both that the order of substances is transcendentally real, i.e. independent of intuition *per se*, and also as thinking that well-founded phenomena and their relations are not real—the latter emerge from our misrepresentation of the underlying non-relational monadic reality. The phenomenal world of objects bearing spatial and causal relations is merely ideal. It is perhaps in *that* sense that the Leibnizians are committed to empirical idealism.[^note-30]
    step1: |-
      那么，康德那个著名主张——认可先验实在论就使人承诺经验观念论（A368–369）——又如何？表面上看，贝克莱似乎应当承诺经验观念论，然而康德却把他解释为*拒绝*先验实在论。我认为，贝克莱通过辩护一种更激进的*独断*观念论（B274–275）而避开了先验实在论、因而只落到经验观念论。按那种观点，不存在独立于直观的对象或属性。[^note-29] 相反，康德把莱布尼茨派解释为既认为实体秩序是先验实在的（即独立于直观本身），又认为有根有依的现象及其关系不是实在的——后者出自我们对底层非关系的单子实在的错表象。具有空间与因果关系的对象的显象世界只是观念的。莱布尼茨派正是在*那个*意义上承诺经验观念论。[^note-30]
    step2: |-
      那么，康德那句名言——认可先验实在论便落入经验观念论（A368–369）——又当如何理解？表面看来，贝克莱按理该承诺经验观念论，可康德偏偏把他解作*拒斥*先验实在论。我的理解是：贝克莱借辩护一种更激进的*独断*观念论（B274–275）而避开先验实在论，因而只限于经验观念论。按此观点，并无独立于直观的对象或属性。[^note-29] 反之，康德把莱布尼茨派解作两面兼有：实体秩序是先验实在的（即独立于直观本身）；有根可依的现象及其关系却不实在——后者出自我们对底层无关系的单子实在的错表象。对象带着空间与因果关系而成的显象世界，只是观念的。莱布尼茨派或许正是在*此*意义上落入经验观念论。[^note-30]
