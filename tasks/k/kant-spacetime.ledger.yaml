      但莱布尼茨关于空间表象的构想如何与康德的解读相容？在致克拉克的末封信中，莱布尼茨试图表明，我们可以形成空间的观念而不必依赖空间以某种方式独立于对象关系这一观念（L 5: 47）。由于他谈到人们“观察”各种对象及其相互关系，听起来好像他认为空间观念得自对对象关系的感官经验。但他心中所想的是空间的哪个观念？换言之，他心中所想的空间观念的内容是什么？他也许是指，人们可以按他所描述的方式获得一个粗略现成的空间观念——关于一个本身不是任何对象或对象组合之属性的三维量的观念。但人们肯定不能以此方式获得数学的空间观，理由有数端，莱布尼茨在《人类理智新论》中已表达（如上所记）：（a）空间与时间是纯粹数学中的实体；（b）空间是连续体，而人们肯定无法从对对象关系的感官知觉中获得连续体的观念；以及（c）感官知觉将产生受混淆的观念，而要有关于空间的清晰分明的观念——指明其作为数学实体的属性——需要感官知觉以外的某物。所以把普通日常的空间构想——在其中我们无须考虑空间是无限还是有限、无限可分还是有限可分，或平行公设是否成立等等——与我们的几何学空间构想区分开来，似乎是合理的。康德在整部《先验感性论》中心中所想的都是我们的几何学空间构想，这几乎毫无疑问——这在形而上学阐明的第三个论证与整个先验阐明中都很清楚。
