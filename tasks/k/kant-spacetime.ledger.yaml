      This raises a difficult question. Kant contends that transcendental idealism as a general conception of space is to be contrasted with transcendental realism, a position he attributes both to Newton and to Leibniz. Yet from Leibniz’s point of view, the only elements of reality are substances and their properties. Relations, which are neither substances nor properties, are not among such elements, if we are speaking with metaphysical rigor. This is evident in a number of texts; for instance, in response to his Lockean interlocutor, Leibniz writes in the *New Essays*: “This division of the objects of our thoughts into substances, modes, and relations is pretty much to my liking. I believe that qualities are nothing but modifications of substances and the understanding adds relations [l’entendement y adjoute les relations].” He adds that relations are “the work of the understanding” (*New Essays*, 145). Since space for Leibniz is just the order of object relations, and relations are ideal, space too is ideal in some sense (*New Essays*, 145; cf. Cassirer 1902, 248)[^cassirer-1902]. That is to say, there is a sense in which spatiality does not characterize reality (Adams 1994, 254–5)[^adams-1994]. These views are to be found in the letters to Clarke and in the *New Essays*, both of which Kant read, and Kant himself explicitly mentions some of them.[^note-19] The obvious obstacles to understanding Leibniz as a realist complicate the interpretation of transcendental idealism, since Kant clearly thinks it is an alternative to both Leibniz’s and Newton’s allegedly realist views. This problem is tackled in the next section.
    step1: |-
      这里引出一个难题。康德主张，作为一般空间构想的先验观念论要与先验实在论相对照，而他把先验实在论同时归于牛顿与莱布尼茨。然而从莱布尼茨的观点看，实在的要素只有实体及其属性。若我们严格按形而上学来说，关系既非实体也非属性，因而不在这类要素之列。这在若干文本中显而易见；例如，在回应其洛克式对话者时，莱布尼茨在《人类理智新论》中写道：“把我们思想的对象分为实体、样式与关系，这种分法颇合我意。我相信，性质不过是实体的变状，而知性则加上关系［l’entendement y adjoute les relations］。”他又说，关系是“知性的作品”（《人类理智新论》，145）。既然在莱布尼茨那里空间只是对象关系的秩序，而关系是观念的，那么空间在某种意义上也是观念的（《人类理智新论》，145；参 Cassirer 1902, 248）[^cassirer-1902]。也就是说，在某种意义上，空间性并不刻画实在（Adams 1994, 254–5）[^adams-1994]。这些观点见于致克拉克的书信与《人类理智新论》，康德两者都读过，且他本人明确提到过其中一些。[^note-19] 把莱布尼茨理解为实在论者的明显障碍，使先验观念论的解释变得复杂，因为康德显然认为它是莱布尼茨与牛顿那些所谓的实在论观点的替代品。这个问题在下一节处理。
