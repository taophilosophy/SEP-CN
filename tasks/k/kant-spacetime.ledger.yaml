      > 4. 空间被表象为一个无限的*被给予的*量。现在，人们必须把每一个概念设想为包含在无限多个不同可能的表象之中（作为它们的共同标记）、因此把这些表象包含*于自身之下*的表象；但没有任何概念就其自身而言能被设想为仿佛把无限多个表象包含*于自身之内*。然而空间正是以后一种方式被思考的（因为空间的一切部分无限地同时并存［denn alle Teile des Raumes ins Unendliche sind zugleich］）。因此，空间的源始表象是一个*先天直观*，而不是一个*概念*。（B40）
