      A realist can be a relationalist if she thinks space is the order of actual and possible relations among actual (and maybe possible) objects and she thinks those relations are *real*. This indicates, incidentally, that realists about space need not think of it as a kind of *object*: it can be perfectly real *and* the order of possible relations among objects. Indeed, Kant himself may have held this view in his *Physical Monadology* of 1755: he still accepted Leibinzian relationalism, but he rejected the Leibnizian construal of relations, holding them to be aspects of reality.[^note-17] Similarly, some contemporary defenders of relationalism seem to hold the view that space is the order of actual and possible relations among actual and possible objects, and those relations are perfectly real, that is, they are not dependent on the mind in any sense.
    step1: |-
      实在论者可以是关系主义者，如果她认为空间是现实（也许还有可能）对象间现实关系与可能关系的秩序，并且认为这些关系是*实在的*。这顺带表明，关于空间的实在论者不必把空间想成某种*对象*：空间完全可以既是实在的，又是对象间可能关系的秩序。事实上，康德本人在 1755 年的《物理单子论》中可能持有这一观点：他仍接受莱布尼茨式关系主义，但拒绝莱布尼茨对关系的解释，认为关系是实在的方面。[^note-17] 同样，一些当代的关系主义辩护者似乎认为，空间是现实与可能对象间现实关系与可能关系的秩序，而那些关系是完全实在的，即它们在任何意义上都不依赖于心。
    step2: |-
