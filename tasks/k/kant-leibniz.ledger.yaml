      Leibniz was often mistakenly credited in the 18ᵗʰ century with the view that organic nature contained no gaps, i.e., between any two different-looking organisms, another can be found. Though such a view might seem consistent with Leibniz’s Principle of Plenitude — that the universe is as full as possible — and his Law of Continuity — his denial that nature makes leaps (GM 6: 240) — it is inconsistent with his view that not everything possible exists, but only what is compossible with other existents, and Leibniz held no such view in any case. Kant describes the idea of perfect continuity in any case as mere intellectual prejudice, since observation of nature does not objectively support it. However, he allows the “law of the ladder of continuity among creatures” has regulative importance in natural history (KRV A 668/ B 696).
    step1: |-
      十八世纪，莱布尼茨常被误认为持有如下观点：有机自然没有空隙，即在任何两个看起来不同的生物之间，还能找到另一个。虽然这样的观点似乎与莱布尼茨的充实原则——宇宙尽可能地满——及其连续性法则——他否认自然作飞跃（GM 6: 240）——一致，它却与他的这一观点不一致：并非一切可能的东西都存在，只有与其他存在者可共存的东西才存在；而且莱布尼茨无论如何都不持这种观点。康德无论如何都把完善连续性的观念描述为纯粹的理智偏见，因为对自然的观察并不客观地支持它。不过，他允许“造物之间连续阶梯的法则”在自然志中具有调节性的重要性（KRV A 668/ B 696）。
