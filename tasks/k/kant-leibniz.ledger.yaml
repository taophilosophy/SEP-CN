      尽管他警告人类理性能力有限，康德也相信有可能*先天地*推导出物质的某些特征——如物理科学必须理论化的物质。不存在物质原子；物质可分至无穷，其各部分都是物质的（4:503f）。然而康德认识到——先在《物理单子论》中、后在《形而上学基础》中——以吸引力和排斥力中心的形式存在的粒子，它们说明了物质的空间填充性与不可入性（4: 533ff）。这一相对独断的处理，与他批判性的主张——物质是一个完全未知的基体的显象——并存。正如他在《纯粹理性批判》中所解释的：彩虹相对于雨滴只是显象，而雨滴在物理意义上是物自体而非幻象。然而进一步思考，我们意识到雨滴也只是显象，“甚至它们的圆形，甚至它们坠落所穿过的空间，本身都不是什么，而只是我们感性直观的单纯变状或基础；先验对象却依然为我们所未知。”（KRV A 45f/B 63f）。“关于这些显象，可以先天说出许多关乎其形式的东西；但对可能奠定它们的那些物自体，却什么也说不出。”（KRV A49/B66）。这表明：那种可分至无穷、承载吸引与排斥力的东西，是某种未知且不可知者的显象。“除了随身带着直观中与我们词语相应的某种东西，我们什么也不能理解。当我们抱怨看不透事物的内在本性时，这只能意味着：我们不能通过纯粹理性把握向我们显现的事物本身会是什么……对显象的观察与分割把我们带入自然的内部，我们无法说这将走多远。但每一个把我们带出［可感］自然的先验问题都永远无法回答……”（KRV（A277f/B333f）。
