      As many of Leibniz’s writings were not published until the 19ᵗʰ or 20ᵗʰ century, an accurate assessment of the relation between the Leibniz and Kant can take into account only those works in circulation in the second half of the 18ᵗʰ century and available to Kant, his teachers and his interlocutors. These comprised the *Meditations on Knowledge, Truth and Ideas*, the *New System of the Nature and Communication of Substances*, the *Specimen Dynamicum*, the *Theodicy*, the *Monadology* and the *Principles of Nature and Grace*, the *Leibniz-Clarke Correspondence*, and the posthumous *New Essays*, which Kant read four years after their publication, in 1769. A collection of diverse pieces, edited by Pierre Desmaizeaux was published in 1720; followed by the more comprehensive *Oeuvres philosophiques* edited by Raspé in 1765 , and the *Opera Omnia* issued by Dutens in 1768. Christian Wolff, who may have had privileged access to some of Leibniz’s unpublished writings, wrote a series of textbooks under the title *Vernunftige Gedancken* beginning in 1719, reformulating Leibniz’s scattered thoughts on atomism, determinism, pre-established harmony, and theodicy into scholastic format, that served to bring these doctrines into prominence, as did some writings of Alexander Baumgarten and G.F. Meier, Euler’s *Letters to a German Princess* (1768–1772), and Emilie du Chatelet’s *Naturlehre an Ihren Sohn* which deal with major Leibnizian themes, including substance, soul-body relations, and the problem of evil. If Kant brooded on Leibnizian topics, however, it was not, except perhaps in the period of the controversy with J.A. Eberhard, in which Kant was concerned to distinguish Leibniz from his followers and to champion what he saw as Leibniz’s special Platonic contributions, with an eye to understanding Leibniz’s system as a whole or extracting the best possible interpretation from it, but rather with an eye to avoiding his errors.
    step1: |-
      由于莱布尼茨的许多著作直到十九或二十世纪才出版，对莱布尼茨与康德之间关系的准确评估，只能考虑十八世纪下半叶流通的、康德及其师友所能得到的作品。这些包括《论知识、真理与观念的沉思》《论实体的本性与交通的新系统》《动力学样本》《神义论》《单子论》与《自然与神恩原则》、《莱布尼茨-克拉克通信》，以及身后出版的《人类理智新论》——康德在其出版四年之后，即 1769 年读到它。皮埃尔·德迈佐编的一部杂集于 1720 年出版；随后是拉斯佩 1765 年编的更全面的《哲学著作集》，以及杜滕 1768 年刊行的《全集》。克里斯蒂安·沃尔夫——他可能拥有接触莱布尼茨某些未刊著作的特权——自 1719 年起以《理性思考》为题写了一系列教科书，把莱布尼茨关于原子论、决定论、前定和谐与神义论的散见思想重新编整为经院格式，使这些学说得以凸显；亚历山大·鲍姆嘉通与 G.F. 迈耶的部分著作、欧拉《致一位德国公主的信》（1768–1772）、以及艾米莉·杜夏特莱的《给儿子的自然学说》（它处理实体、心身关系与恶的问题等主要莱布尼茨主题）也起到了同样作用。不过，如果康德在莱布尼茨主题上冥思苦想，那不是——除了也许在与 J.A. 埃伯哈德论战的时期——为了把莱布尼茨的体系当作一个整体来理解或从中提取最佳诠释；在那场论战中，康德关心的是把莱布尼茨与其追随者区分开，并捍卫他所认为的莱布尼茨独特的柏拉图式贡献；毋宁说，他是着眼于避免其错误。
