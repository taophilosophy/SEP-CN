    source: |-
      Kant’s interest in the physics, metaphysics, epistemology, and theology of his predecessor G.W. Leibniz is evident in his writings in the philosophy of natural science as well as in the passages of the *Critique of Pure Reason* dealing with transcendental ideas and his essays on history and progress. The conventional view that Kant sought to steer a middle course between the rationalism of 18ᵗʰ century German school philosophy initiated by Leibniz’s follower Christian Wolff and the empiricism of David Hume furnishes a useful point of departure for understanding Kant’s intellectual context and his aims and intentions. However, Kant’s aim in propounding his critical philosophy was not merely to transcend the stalemate of dogmatism vs. skepticism in general epistemology, but to address what he regarded as a crisis: the inability of metaphysics, as taught in the Universities, to secure the meta-ethical objectivity of morality and the threat to human confidence and moral discipline posed by the atheism, materialism, and fatalism of contemporary forms of naturalism. Kant took Leibniz’s as a failed dogmatic enterprise in metaphysics and philosophical theology, but as one that was partially redeemed by its parallel treatment of nature and value. He addressed the Leibnizian topics of the nature of substance, the human soul and its powers, space, time, and forces, mechanism and teleology, and divine creation in passages scattered throughout his major and minor writings.
    step1: |-
      康德对其前辈 G.W. 莱布尼茨的物理学、形而上学、认识论与神学的兴趣，在他的自然哲学著作、《纯粹理性批判》中处理先验理念的段落以及他关于历史与进步的文章中都清晰可见。一种流行的看法是：康德试图在莱布尼茨的追随者克里斯蒂安·沃尔夫开创的十八世纪德国学院哲学的理性主义与大卫·休谟的经验主义之间走一条中间道路；这一看法为理解康德的智识语境及其目标与意图提供了有益的出发点。然而，康德提出其批判哲学的目的，不仅是超越一般认识论中独断论与怀疑论的僵局，更是要处理他所认为的一场危机：大学里所传授的形而上学无力保障道德的元伦理客观性，以及当代自然主义诸形态的无神论、唯物论与宿命论对人类信心与道德纪律构成的威胁。康德把莱布尼茨的方案视为形而上学与哲学神学中一项失败的独断事业，但认为它因对自然与价值平行处理而得到部分救赎。莱布尼茨的诸主题——实体的本性、人类灵魂及其能力、空间、时间与力、机械论与目的论、神的创造——康德在其大小著作中散布的段落里一一处理。
