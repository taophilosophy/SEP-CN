      莱布尼茨认为某些形式的奴隶制是正义的，因为有些人类似哑的、不可教育的动物，且因为生命是永恒的，奴隶制是偶然的和暂时的（Riley, 78）。康德坚持更尖锐的动物-人类分界，对不朽并不确定，但他认为只有对罪犯的奴役是正义的（6: 332–3）。美洲原住民与非洲人也被描述为“只配做奴隶”（XV:181）。劣等种族将消亡或被灭绝（(XV: 878)。白人、男性、基督教的欧洲人——他希望——能够及时把文明带给整个世界。莱布尼茨早年的观点也并不更体面；“野蛮人”——他认为他们是“野兽”（见 Perkins, 111）——可以被消灭，以便教化他们。莱布尼茨的种族主义反映廷臣的势利——那种对女性至少保持礼貌的势利；而康德把他者病理化的倾向，则更多源于过度的道德热情与他强烈的反女性主义。忠实于他对矛盾律的拒斥，康德把人的灵魂看作动物性本能与道德义务交战的战场。自我放纵、轻信与怠惰——不幸地内置于女性与非欧洲人的性格之中——要用道德正直、教育与批判、以及勤勉来对抗。
