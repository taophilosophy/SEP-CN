      莱布尼茨的注释者沃尔夫与鲍姆嘉通更独断地宣告了灵魂中存在单一表象能力的理论，知觉与认识对应于它的低级与高级部分。正是这一观点，被康德呈现为与他自己的灵魂官能学说截然对立的东西。对康德而言，感性是“主体的接受性，凭借它，主体自身的表象状态能够因某个对象的存在而以特定方式被影响”。思想是“主体的官能，主体凭借它有能力表象那些凭其自身性质不能进入该主体感官的事物”（2:392）。思想意谓一种能力：经验不涉及感性形式——空间、时间与因果性——的另一类表象。时空特征附着于我们的一切知觉与知觉性思想，但不附着于我们以描述方式持有的概念。我们可以*想到*物自体，甚至想到上帝、灵魂与此类实体，承认其存在甚至其能力，但我们不知觉它们，也不能以感性形式表象它们。
