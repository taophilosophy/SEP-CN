      然而，一个具有坚强道德品格的人行使善良意志所必须忍受的匮乏，康德认识到，是真实的匮乏。如果他向读者鼓吹的自我掌控与自我改进的斗争显得——而且确实——是一场无意义的操练，那么正如他在《纯粹理性批判》第二版序言中所表达的，就必须扬弃知识，以便为信仰留出位置（B xxx）。康德为殖民劫掠而惊心，但他仍把社会与地缘政治的冲突视为必要的——至少直到他在 1795 年《论永久和平》中的重新思考为止。像莱布尼茨一样，他试图为群体侵略与种族冲突找到救赎性的方面，把它们作为和平、文明与进步的前提条件。他自己的发展概念、潜在潜能的展开概念，是人类学与历史哲学的核心。然而，发展既是必然，也同样是一种义务。他接受了莱布尼茨的历史目的论：“我们应当满足于天道与人类事务的整体进程，它不是从善开始然后走向恶，而是从更坏逐渐发展为更好……”（8:123）。在 1795 年的著作中，他得出如下观点：战争是一种祸害，当疲惫而开明的人们最终拒绝为诸侯的争斗与荣耀买单时，它将自行消除。莱布尼茨比康德更依赖君主的恩宠，他似乎也在晚年放弃了自己早年的军国主义（见 Wilson）。
