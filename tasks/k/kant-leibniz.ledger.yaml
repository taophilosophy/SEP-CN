      Kant was not so sure. By the late 18ᵗʰ century, the theory of inorganic nature, thanks to Laplace, Black, Priestley, Franklin, and other chemists and electricians was flourishing, but so too was the study of physiology, embryology, and natural history, thanks especially to Bourguet, Boerhaave, Haller, and Buffon. Newtonian forces acting over a distance were no longer seen as incompatible with a commitment to mechanism, opening the door to the supposition of vital forces that might act in a lawlike fashion. Preformation was no longer a credible doctrine; the possibility of self-assembling “organic molecules,” working according to “organic mechanism,” was much discussed. Epigenesis reduced the need for a divine creator. Kant addresses the ensuing intellectual-theological crisis in the *Critique of Judgment*, a two-part essay dealing with beauty, beautiful forms in nature, and forms in nature generally. He tries to show that we are caught up in an antinomy. We are strongly disposed to view visible nature as a unity in which a single set of mechanical forces operates, not to divide it into an inorganic realm that came to be by the forces inherent in nature and an organic realm of plants and animals evidencing design and supernatural creation. Yet we cannot envision explaining generation or organic growth mechanistically. The solution to the dilemma is to adopt teleology as a regulative principle. We should not positively declare that organic beings could not have arisen and cannot reproduce themselves from the forces of nature, or that God must have a hand in their genesis; nevertheless, in investigating them, we look for the function and interrelation of parts, as though they were designed and built intelligently (5: 416ff). The claim that the parts of a living creature are organized *in infinitum* as Leibniz supposed is however, “something that cannot be thought at all.” (KRV A 526/B 554).
    step1: |-
      康德不那么肯定。到十八世纪晚期，得益于拉普拉斯、布莱克、普里斯特利、富兰克林及其他化学家与电学家，无机自然的理论欣欣向荣；但生理学、胚胎学与自然志的研究同样欣欣向荣，这尤其要归功于布尔盖、布尔哈夫、哈勒与布丰。超距作用的牛顿力不再被看作与机械论的承诺不相容，这为假定可能以合乎法则的方式起作用的生命力打开了大门。预成论不再是一个可信的学说；按“有机机械”运作的自组装“有机分子”的可能性被广泛讨论。渐成说减少了对神圣创造者的需要。康德在《判断力批判》——一篇处理美、自然中的美的形式与自然中的一般形式的两部分文章——中处理随之而来的智识-神学危机。他试图表明我们陷入了一个二律背反。我们强烈地倾向于把可见的自然看作一个统一体，其中运作着单一的一组机械力；而不是把它分割为一个靠自然固有的力而产生的无机领域，与一个动植物的、显示设计与超自然创造的有机领域。然而我们无法设想以机械的方式解释生成或有机的生长。走出两难的办法，是采纳目的论作为一条调节性原则。我们不应正面宣告有机存在者不可能从自然之力中产生、不能自我繁殖，或上帝必得插手其起源；然而在研究它们时，我们寻找各部分的功能与相互关系，仿佛它们被智慧地设计与建造（5: 416ff）。但是，一个活物的各部分如莱布尼茨所设想的那样 *in infinitum*（无限）地被组织起来，这是“根本无法思考的东西”（KRV A 526/B 554）。
