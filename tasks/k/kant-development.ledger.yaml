      [^note-1]: Western philosophy after the middle ages can be divided into four periods: the Renaissance, the Enlightenment or modern philosophy, 19ᵗʰ Century philosophy, and 20ᵗʰ Century/ the contemporary period. While determining the boundaries of the periods is a matter of debate, one could say that the Renaissance ended in the early 1600s; that the Enlightenment or modernity lasted from the late 1600s to the late 1700s; and that 19ᵗʰ Century philosophy began with Kant’s critique of rational theology and metaphysics, while 20ᵗʰ Century philosophy begins with the inception of positivism and the Vienna circle. Many of the philosophical questions in the modern period are eclipsed by Kant’s critique and much of 19ᵗʰ and 20ᵗʰ Century philosophy responds to the shift in philosophical paradigm we find in Kant’s works.
    step1: |-
      [^note-1]: 中世纪以后的西方哲学可分为四个时期：文艺复兴、启蒙或现代哲学、19 世纪哲学、20 世纪／当代。各期的界限虽有争议，但可以说：文艺复兴终于 1600 年代初；启蒙或现代性自 1600 年代后期延续至 1700 年代后期；19 世纪哲学始于康德对理性神学与形而上学的批判，而 20 世纪哲学始于实证主义与维也纳学圈的兴起。现代时期的许多哲学问题都因康德的批判而失色，19、20 世纪哲学的大部分都在回应康德著作中出现的哲学范式转变。
