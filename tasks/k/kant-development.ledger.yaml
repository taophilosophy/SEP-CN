      The anonymous publication of the *Universal Natural History* was prudent but not without risk. The dedication indicates Königsberg as the place of composition; the publisher Petersen was a local company, and eventually the identity of the author would have come out.[^note-23] Petersen went bankrupt just when copies of the *Universal Natural History* were off the press and in a warehouse. The warehouse was sealed—and then mysteriously burned down, which allowed Petersen to collect insurance and pay off creditors. Bankruptcy and fire prevented the book’s distribution (Rahts 1902: 545–6; Krafft 1971: 193)[^krafft-1971][^rahts-1902]. But this was not necessarily a bad turn for Kant. As the fates of Spinoza, Tschirnhaus, or Toland illustrate, you cannot be a dynamic freethinker and a professor in the conservative university system at the same time. Considering Kant’s goals, the misfortune over the book was a blessing in disguise.
