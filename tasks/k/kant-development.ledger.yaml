      Hence the *New Elucidation* does not begin with the principle of identity, like other ontological templates. Kant states that “there is no unique, absolutely first, universal principle of all truths” (prop. 1, 1:388.11–12). Instead, the identity-pair of opposites is absolutely primary (*absolute prima*): “whatever is, is, and whatever is not, is not” (prop. 2, 1:389.3–6). Affirmative and negative identity, when juxtaposed, suggest contradiction. This means that contradiction is a derivative of the primary identity-pair.[^note-25] It also means that contradiction is governed by a prior (*prae*) identity (prop. 3, 1:390.30–2). Just consider any real knowledge: truth rests on an intuition of its ground (*intuiti niti*, 1:394.3–4), and if one wants to go beyond tautological transformations, ground of truth will differ from truth grounded. Analogously, actual states of affairs are grounded in other events (prop. 6, 1:394.10–11). Hence distinct antecedent reasons determine truths; distinct prior grounds determine things. At the same time, the truths determined give meaning to the antecedent as their reason, and the things determined give context to the prior as their ground. Reality emerges as soon as the dynamic center patterns alterity, while being placed and defined by the patterned alterity when doing so. The resulting interaction is essential. And it is accessible. Metaphysical cognition begins with communal identity (*communiter principium identitatis*) governing contradiction (prop. 2, 1:389.3–6).
    step1: |-
      因此《新阐明》不像其他本体论模板那样从同一性原理出发。康德说，“没有任何唯一的、绝对第一的、普遍的诸真理原理”（命题 1, 1:388.11–12）。相反，对立面的同一性对是绝对在先的（*absolute prima*）：“凡是者，是；凡不是者，不是”（命题 2, 1:389.3–6）。肯定与否定同一性并置，便暗示矛盾。这意味着矛盾是原初同一性对的派生物。[^note-25] 这也意味着矛盾受一个在先的（*prae*）同一性支配（命题 3, 1:390.30–2）。想想任何真实的知识：真理奠基于对其根据的直觉（*intuiti niti*，1:394.3–4）；而若要超出同语反复的转换，真理的根据便与被奠基的真理不同。类似地，现实的事态奠基于别的事件（命题 6, 1:394.10–11）。因此，殊异的先行理由决定真理；殊异的在先根据决定事物。与此同时，被决定的真理把先行者作为其理由而赋予意义，被决定的事物把在先者作为其根据而赋予语境。实在一俟动力中心把他者格式化便出现，而在这样做时又被被格式化的他者所定位与定义。由此产生的交互是本质性的。而且它是可通达的。形而上学认知始于支配矛盾的共同同一性（*communiter principium identitatis*）（命题 2, 1:389.3–6）。
