  - id: 9
    kind: body
    source: |-
      1. the pre-critical period (1745–1770), during which Kant works within the tradition of Leibniz/Wolff and writes his impressive early works on natural phenomena;
      2. “silent decade” (1770–1781), during which Kant refrained from publishing texts other than advertisements and endorsements for classes;
      3. the critical period (1781–1791), which marks the time of insights or “the astonishing decade” (Beck 1969: 433)[^beck-1969] of his critical philosophy; and
      4. the post-critical period (1798–1802), often cited as works of old age.[^note-4]
    step1: |-
      1. 前批判时期（1745–1770）：康德在此期处于莱布尼茨／沃尔夫传统之中，写出关于自然现象的令人印象深刻的早期著作；
      2. “沉默的十年”（1770–1781）：此期康德除课程广告与推荐语外不再刊布文字；
      3. 批判时期（1781–1791）：此期是其批判哲学获得洞见之时，或称“惊人的十年”（Beck 1969: 433）[^beck-1969]；
      4. 后批判时期（1798–1802）：常被称为晚年著作。[^note-4]
    step2: |-
      1. 前批判时期（1745–1770）：康德在此期处于莱布尼茨／沃尔夫的传承之中，就自然现象写出若干气象可观的早期著作；
      2. “沉默的十年”（1770–1781）：除课程广告与推荐语之外，此期康德不再刊行任何文字；
      3. 批判时期（1781–1791）：批判哲学的洞见期，亦称“惊人的十年”（Beck 1969: 433）[^beck-1969]；
      4. 后批判时期（1798–1802）：通常称为晚年之作。[^note-4]
  - id: 10
    kind: body
    source: |-
      Recent studies indicate that Kant’s philosophical development was far more unified (Schönfeld 2000)[^schönfeld-2000], and, in terms of its stages, involved deeper continuities (Edwards 2000)[^edwards-2000] than previously recognized. From the start, Kant was pushing quite a unique agenda. Recent scholarship contends Kant’s earliest works are not only commensurate and continuous with his late claims, but also offer insight into some oddities of the critical period, such as the Third Analogy of the *Critique*.[^note-5] The new picture of Kant’s development indicates that his intellectual trajectory was not as fractured and erratic as scholarship used to assume, and it also indicates that Kant was not a late bloomer, but, rather, that he was innovative from the start.
    step1: |-
      晚近研究显示，康德的哲学发展远比先前所认识到的更为统一（Schönfeld 2000）[^schönfeld-2000]，其各阶段的连续性也更深（Edwards 2000）[^edwards-2000]。从一开始，康德就在推行一个相当独特的议程。晚近学界主张，康德最早的著作不仅与晚期主张相称而连续，还能揭示批判时期的一些怪异之处，例如《批判》的第三类比。[^note-5] 关于康德发展的这幅新图景表明：他的思想轨迹并不像学界过去设想的那样断裂而摇摆；它也表明康德并非大器晚成，而是从一开始就富于创新。
    step2: |-
      晚近研究表明，康德的思想发展远比过去认定的更为统一（Schönfeld 2000）[^schönfeld-2000]，各阶段之间的连续也更深（Edwards 2000）[^edwards-2000]。康德自始就在推进一个颇具特色的纲领。晚近学界认为，他最早的几部著作不但与晚期主张相称、相连续，还能解释批判时期的一些费解之处，如《批判》中的第三类比。[^note-5] 这幅新图景说明：康德的思想轨迹并不像学界从前设想的那样断裂、飘忽；也说明他并非大器晚成，而是自始即富创新。
