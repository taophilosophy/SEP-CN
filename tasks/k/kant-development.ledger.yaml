      这一洞见绝非碰运气的猜测。康德明白力涉及什么。他主张力是行动的本质（#4）。这一行动是一种“向外拓宽”的脉冲（#9–10）。力的向外铺展（*ausbreiten*; 1:24.23）是空间的外延（*Ausdehnung*; 1:24.6）。力构成连续体，反过来又受被造结构的支配（#10）。对力之本性的这一理解转变，相应地改变了人们必须对物质对象与动力交互的设想。本源与源泉是力，而非实体——后者是笛卡尔派所坚执的。是力造成实体、量化与自然律，而不是相反。在这一大胆命题中，康德预示了他更有名的“哥白尼式转向”——一种我们观看自然之方式的倒转——但在此语境中，他仍在自己时代的自然哲学领域内工作。动力交互把力变成场，把虚空变成充实。康德预示了动量-能量是时空的实体性对应物。绕过牛顿，他赶上了爱因斯坦。[^note-13]
