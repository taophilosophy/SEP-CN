      [^note-13]: Briefly, Einstein’s first great insight (1905) is that spacetime tells mass how to move, while mass tells spacetime how to curve (Wheeler 1990: 12)[^wheeler-1990]. That is, force and space mutually determine each other—“force” understood as momentum-energy (the measure of mass, and spacetime’s grip on mass), and “space” understood as spacetime (the four-dimensional continuum). Consider the planets on their orbits around the Sun. While Newton assumed that gravitational forces act over spatial distances to hold Sun and planets in mutual grip, Einstein realized that gravitational forces form a field that locally curves space, primarily around the Sun, such that planets move along the spatial curvature, tracing out orbits. Hence (to quote Wheeler again, ibid.: 11–13) mass grips spacetime, telling it how to curve; spacetime grips spacetime, transmitting curvature from near to far; and spacetime grips mass, telling it how to move. Force and space are not independent absolutes, as Newton had stipulated. Instead, and as Einstein discovered, both are relative to one another (hence “special theory of relativity” as label for the explication of this idea). Kant realized that force acts by *Ausbreitung*—“out-broadening” or radiation, and that the resulting space has *Ausdehnung*—“out-stretching” or extension/expansion. As radiation determines extension (by structuring space), extension determines radiation (by an inverse-square law). In this sense, by recognizing that radiation and extension hang together, that neither force nor space stand alone, Kant bypassed Newton and caught up with Einstein.
    step1: |-
      [^note-13]: 简言之，爱因斯坦第一个伟大洞见（1905）是：时空告诉质量如何运动，质量告诉时空如何弯曲（Wheeler 1990: 12）[^wheeler-1990]。也就是说，力与空间相互规定——“力”被理解为动量-能量（质量的量度，亦即时空对质量的把握），“空间”被理解为时空（四维连续体）。试看诸行星绕太阳的轨道。牛顿假定引力在空间距离上作用，使太阳与行星相互把持；爱因斯坦则认识到，引力构成一个场，在局部（主要在太阳周围）弯曲空间，使行星沿空间的曲率运动，描出轨道。因此（再引 Wheeler，同上：11–13）：质量抓住时空，告诉它如何弯曲；时空抓住时空，把曲率由近传远；时空抓住质量，告诉它如何运动。力与空间并非如牛顿所规定的那样是彼此独立的绝对者；相反，正如爱因斯坦所发现，二者相互相对（故有“狭义相对论”之名，用以表述这一观念）。康德认识到，力通过*Ausbreitung*——“向外铺展”或辐射——而作用，由此产生的空间具有*Ausdehnung*——“外延”或广延／膨胀。辐射规定广延（通过为空间赋予结构），广延规定辐射（通过反平方定律）。在这个意义上，由于认识到辐射与广延相依、力与空间皆非孤立，康德绕过牛顿，赶上了爱因斯坦。
    step2: |-
      [^note-13]: 简言之，爱因斯坦的第一个伟大洞见（1905）是：时空告诉质量如何运动，质量告诉时空如何弯曲（Wheeler 1990: 12）[^wheeler-1990]。也就是说，力与空间相互规定——“力”即动量-能量（质量之量度，亦即时空对质量的把握），“空间”即时空（四维连续体）。试看诸行星绕日之轨道。牛顿假定引力跨空间距离而作用，使日与行星相互把持；爱因斯坦则看出：引力构成一个场，在局部（主要绕日）使空间弯曲，行星遂沿空间曲率而行，描出轨道。故（再引 Wheeler，同上：11–13）：质量抓住时空，告之以如何弯曲；时空抓住时空，把曲率由近传远；时空抓住质量，告之以如何运动。力与空间不是牛顿所定的彼此独立的绝对者；恰如爱因斯坦所发现，二者彼此相对（“狭义相对论”之名即由此而来）。康德认识到：力靠*Ausbreitung*——“向外铺开”、即辐射——而作用，由此成的空间则有*Ausdehnung*——“外延”、即广延／膨胀。辐射规定广延（为空间赋形），广延规定辐射（依反平方定律）。就此而言，康德既已看出辐射与广延相依、力与空间皆非孤存，便绕过了牛顿，赶上爱因斯坦。
