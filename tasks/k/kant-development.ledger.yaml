      [^note-5]: One critical oddity is Kant’s contention that space is a force field (a “plenum” instead of a void). The early Kant claims that force created space by stretching itself out as a continuum. The late Kant claims that cognitive tools that organize experience are aspects of an energetic, material, and interactive fabric. This energy-field sustains consciousness and cognition—energetic space is the ultimate condition of experience. Even the *Critique of Pure Reason* contains suggestions of this sort, but there they conflict with the cautious tenor of the work (such that cognitive conditions are formal, not physical, or that the underlying fabric, the thing in itself, is inaccessible). For the early claims, cf. *Thoughts on the True Estimation of Living Forces*, #1–10 (1:17–25). For the late claims, cf. the *Opus Postumum*-material, especially *Reflexion 3986* (17:376–7), *Oktaventwurf* (21:378–9, 383); *Transition 1–14* (21:219, 223–4, 226–30, 233, 247, 535, 539, 547–8, 564–5, 588–9, 592); *Fascicle 11* (22:425–31, 440, 457); compare also *Fascicle 1* (21:87.29–31 and 21:101.5–12). For the “plenum-proof” in the first *Critique*, cf. A211/B256–A214/B261; for an informative analysis, compare Edwards 2000: 13–47, esp. 38–40. For an interpretation of this ontological oddity in its cross-cultural context, compare Edwards & Schönfeld 2006.
    step1: |-
      [^note-5]: 一处批判期的怪异是：康德主张空间是一个力场（“充实”而非虚空）。早期康德主张，力通过把自身伸展为连续体而创造了空间。晚期康德主张，组织经验的认知工具是一个能量性的、物质的、交互的织体的诸方面。这一能量场维系着意识与认知——能量性的空间是经验的终极条件。即便《纯粹理性批判》也含有此类暗示，但在那里它们与全书的谨慎基调相冲突（例如：认知条件是形式的而非物理的，或：底层的织体即自在之物，不可通达）。关于早期主张，参《关于活力的真正估算的思考》#1–10（1:17–25）。关于晚期主张，参《遗著》材料，尤其是《反思 3986》（17:376–7）、《八开本稿》（21:378–9, 383）；《过渡 1–14》（21:219, 223–4, 226–30, 233, 247, 535, 539, 547–8, 564–5, 588–9, 592）；《第 11 分册》（22:425–31, 440, 457）；另参《第 1 分册》（21:87.29–31 与 21:101.5–12）。关于第一《批判》中的“充实证明”，参 A211/B256–A214/B261；有益的分析见 Edwards 2000: 13–47，尤其 38–40。关于这一本体论怪异之处在跨文化语境中的解释，参 Edwards & Schönfeld 2006。
