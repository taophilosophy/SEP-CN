      [^note-2]: The discovery of Kant’s ambivalence towards Christianity (documented during Kant’s lifetime) is due to the efforts of Manfred Kuehn, University of Marburg. Kant’s first biographers were L.E. Borowski, R.B. Jachmann, and E.A.C. Wasianski. Their accounts appeared in Königsberg, in the year of Kant’s death (12 Feb. 1804). As the three writers knew their subject personally—Borowski had been his frequent guest; Jachmann had been his research assistant; and Wasianski had been his assistant and executor of will—their portraits were accepted as authoritative. All three had degrees in theology; Jachmann held church services, Wasianski was a deacon, and Borowski was a church administrator. They stressed the importance of Pietism for Kant and presented their subject as a good Christian. This distortion was partly due to an innocent projection of the biographers’ preferences, but to some extent, it was also a systematic effort at spinning the facts, especially in the case of Borowski. Borowski worried that his association with Kant would harm his career and tried to preempt critics, for Kant’s scorn for fundamentalists (*Schwärmer*) was notorious, and his influence was blamed for the empty churches in town. Kant was cool towards Christianity and did not support its doctrines. For the distortions of Kant’s relation to Christianity, see Kuehn 2001: 2–16. For Kant’s contempt for organized religion, disbelief in an afterlife, and rejection of a monotheistic God, see ibid.: 45–55, 328, 369–78, 382, and 392.
    step1: |-
      [^note-2]: 关于康德对基督教抱矛盾心理的发现（在康德生前即有文献），应归功于马堡大学的曼弗雷德·库恩。康德最早的传记作者是 L. E. 博罗夫斯基、R. B. 雅赫曼与 E. A. C. 瓦西安斯基。他们的记述都在康德去世之年（1804 年 2 月 12 日）于哥尼斯堡刊行。三位作者都亲身认识传主——博罗夫斯基常为座上客；雅赫曼曾任其研究助手；瓦西安斯基曾任其助手与遗嘱执行人——故他们的画像被奉为权威。三人都有神学学位：雅赫曼主持礼拜，瓦西安斯基是执事，博罗夫斯基是教会行政人员。他们强调虔敬派对康德的重要性，并把传主呈现为一个好基督徒。这一扭曲部分源于传记作者偏好的天真投射，但在某种程度上，也是系统地编排事实，博罗夫斯基尤然。博罗夫斯基担心与康德的往来会妨害自己的前程，因而设法先发制人：康德对基要主义者（*Schwärmer*）的鄙夷人所共知，而城中教堂的空荡也被归咎于他的影响。康德对基督教冷淡，并不支持其教义。关于康德与基督教关系的扭曲，见 Kuehn 2001: 2–16。关于康德对有组织宗教的轻蔑、对来世的不信、对一神论上帝的拒斥，见同上：45–55, 328, 369–78, 382, 392。
    step2: |-
      [^note-2]: 康德对基督教态度矛盾，此事在康德生前即有记载；揭出之功属于马堡大学的曼弗雷德·库恩。康德最早的传记作者为 L. E. 博罗夫斯基、R. B. 雅赫曼、E. A. C. 瓦西安斯基，三部传记皆于康德卒年（1804 年 2 月 12 日）在哥尼斯堡出版。三人与传主皆有私交——博罗夫斯基是他家常客，雅赫曼做过他的研究助手，瓦西安斯基做过他的助手与遗嘱执行人——故其记述被奉为定论。三人皆获神学学位：雅赫曼领礼拜，瓦西安斯基任执事，博罗夫斯基任教会行政。他们强调虔敬派对康德的意义，把传主写成一个好基督徒。这种失真，一半出自传记作者偏好之无心投射，一半则是刻意编排事实，博罗夫斯基尤甚。博罗夫斯基生怕与康德交往有损前程，故先自设防：康德鄙夷基要主义者（*Schwärmer*）是出了名的，而城中教堂之空荡也被算在他头上。康德对基督教冷淡，并不拥护其教义。关于康德与基督教关系之失真，见 Kuehn 2001: 2–16；关于康德鄙薄建制宗教、不信来世、拒斥一神论的上帝，见同上：45–55, 328, 369–78, 382, 392。
