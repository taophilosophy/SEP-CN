      The following account covers Kant’s development from his upbringing to the critical period. Its theme is his intellectual formation: the influences in his youth and education; his views on natural philosophy, ontology and cosmology shaped during his early adulthood; the questions subsequently pursued; and the historical fate of his answers.[^note-6]
    step1: |-
      以下叙述涵盖康德从养育到批判时期的发展。其主题是他的思想形成：他青年与受教育时期所受的影响；他在成年早期形成的自然哲学、本体论与宇宙论观点；随后追究的问题；以及他的答案在历史上的命运。[^note-6]
    step2: |-
      下文叙述康德自幼及于批判时期的发展，主线是其思想养成：少年与求学时期所受的熏染；成年早期形成的自然哲学、本体论与宇宙论见解；此后继续追究的问题；以及这些答案在历史上的遭际。[^note-6]
