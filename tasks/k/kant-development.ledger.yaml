      During high school this moderation was not felt. The instructors at the *Collegium* were stern. Pietist schooling involved a rigorous schedule, strict adherence to religious dogma, and instruction by repetitive drills. The school’s goals were two-fold, to save it’s pupils from “religious corruption” and to improve their “worldly well-being” (Kuehn 2001a: 46)[^kuehn-2001a]. Strict adherence to regimen, dogma and practical applications were essential to these two goals. A former classmate, David Ruhnken, criticized the “discipline of the fanatics” (letter to Kant 10 Mar. 1771; 10:117.15); another classmate and life-long friend, Theodor Hippel (1741–96), spoke of Kant’s “terror and fear” whenever Kant would later recall the “slavery of his youth” (Malter 1992: 95; tr. Kuehn 2001a: 45)[^kuehn-2001a][^malter-1992].
    step1: |-
      在中学期间，这种缓和并未被感受到。*Collegium*的教师很严厉。虔敬派的学校教育包括严格的作息、对宗教教义的严格遵奉，以及反复操练式的教学。学校的目标有双重：使学生免于“宗教上的败坏”，并增进其“世俗福祉”（Kuehn 2001a: 46）[^kuehn-2001a]。严格遵奉规章、教义与实际应用，对这两个目标都不可或缺。一位旧同学达维德·鲁恩肯批评这种“狂热者的纪律”（1771 年 3 月 10 日致康德信；10:117.15）；另一位同学、终身之友特奥多尔·希佩尔（1741–96）提到，康德后来每忆及“他青年时代的奴役”，便显出“惊恐与畏惧”（Malter 1992: 95；tr. Kuehn 2001a: 45）[^kuehn-2001a][^malter-1992]。
    step2: |-
      中学期间，这种缓和却感受不到。*Collegium*的教师严厉。虔敬派的学校生活作息严苛，教义须严格遵奉，教学靠反复操练。学校的目标有二：使学子免于“宗教上的腐化”，并增进其“世俗的幸福”（Kuehn 2001a: 46）[^kuehn-2001a]；而严守规章、教义与实际应用，对两者都不可或缺。旧同学达维德·鲁恩肯讥之为“狂热者的纪律”（1771 年 3 月 10 日致康德信；10:117.15）；另一位同窗、终身好友特奥多尔·希佩尔（1741–96）则说，康德日后每忆起“青年时代的奴役”，便流露出“惊恐与畏惧”（Malter 1992: 95；tr. Kuehn 2001a: 45）[^kuehn-2001a][^malter-1992]。
