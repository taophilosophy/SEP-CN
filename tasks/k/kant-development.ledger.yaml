      Newton had thought that cosmic organization required the hand of God, but Kant eliminated any need for divine interference. Newton had supposed that God regularly infuses nature with new motion to keep the world machine from running down due to entropy; he had accepted the notion of final causes as ways in which God makes himself known; and he had appealed to God’s miraculous adjustments whenever physical explanations failed him, as in the case of the ecliptic plane.[^note-19] Newton could not explain the coplanar orbits of planets and surmised, “such a wonderful uniformity in the planetary system must be allowed the effect of choice” (1979 [1730]: 402).
    step1: |-
      牛顿认为宇宙的组织需要上帝之手，而康德排除了任何神圣干预的必要。牛顿设想上帝定期向自然注入新的运动，以防世界机器因熵而停转；他接受了终极因的观念，视之为上帝让人认识自己的方式；而每当物理解释失灵，他便诉诸上帝的奇迹式调整，如黄道面的问题。[^note-19] 牛顿解释不了诸行星的共面轨道，于是揣想：“行星系统中如此奇妙的齐一，必得视为选择的效果”（1979 [1730]: 402）。
    step2: |-
