      康德的登场是试图了断这场争论的众多尝试之一，但就一切实际目的而言，它是失败的。《活力论》出现得太晚，无从起作用，而康德对达朗贝尔与欧拉的研究一无所知。但在公众眼中注定此书命运的是：康德似乎押错了马。他主张综合笛卡尔式运动学与莱布尼茨式动力学，且是以牺牲牛顿力学为代价这样做的。当时他只部分地把握了牛顿的观念。他还不理解运动如同静止是一种状态（伽利略已发现这一点），也不理解力只对状态的改变、而非对状态的保持才需要（这是牛顿第一运动定律）。他不仅以这类错误暗中拒斥牛顿，还明确质疑其权威（序言，1:7）。在书中较后处，他批评第一运动定律（#50–51, #97–8），提出替代牛顿式惯性的方案（#124–5, #132–3），并把牛顿关于运动损失显露自然趋向熵的观点斥为“绝望的借口”（#50; 1:59）。他甚至未提及把力定义为质量与加速度之积的第二运动定律，就想确定力。对康德而言，牛顿力学无关紧要。书中引用笛卡尔与莱布尼茨之处数以百计，而提到牛顿的地方屈指可数。
