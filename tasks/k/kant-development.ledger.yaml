      Schulz’s brand of Pietism differed from either Spener’s or Francke’s and “was fraught with deep ambiguities, having a component that was seen elsewhere as contrary to the basic tenets of true faith”(Kuehn 2001a: 39)[^kuehn-2001a]. Schulz’s Pietism straddled the line between Wolffian, rationalistic philosophy and enthusiastic religious sentiment. It stood for the equality of all to interpret the Bible and a practical faith through charitable acts, while at the same time endorsing the political ambitions of Frederick I. It was a grassroots movement that the emphasized the personal nature of religion in contrast to establishment orthodoxy; politically, it allied itself with the common citizen over the nobility. In Königsberg it was a divisive influence that was in constant struggle with local authorities. In Kant’s formative years, Königsberg was a place of religious upheaval, Pietists vs Orthodox Lutheranism, and this marked, local conflict, in addition to the more widespread decimation of the 30 Years War, was to inform his position of religious toleration and a separation of religion and philosophy.
    step1: |-
      舒尔茨那一派虔敬主义与施佩纳或弗兰克的都有所不同，“充满深层的含混，其中有一成分在别处被视为与真信仰的基本教义相悖”（Kuehn 2001a: 39）[^kuehn-2001a]。舒尔茨的虔敬主义横跨沃尔夫式理性主义哲学与狂热的宗教情感之间。它主张人人平等地解释圣经，主张以慈善行为践行实践信仰，同时又拥护腓特烈一世的政治野心。它是一场草根运动，强调宗教的个人性，与建制正统相对；在政治上，它站在平民一边而非贵族一边。在哥尼斯堡，它是一种造成分裂的影响，与地方当局不断角力。在康德思想形成的年代，哥尼斯堡正经历宗教动荡——虔敬派与正统路德宗的对峙；除三十年战争更广泛的破坏之外，这一地方冲突也塑造了他对宗教宽容、以及宗教与哲学相分离的立场。
    step2: |-
      舒尔茨式的虔敬主义既不同于施佩纳，也不同于弗兰克，“充满深层的歧义，其中一分子在别处被视为有悖真信仰的基本教理”（Kuehn 2001a: 39）[^kuehn-2001a]。它在沃尔夫式理性主义哲学与狂热的宗教情感之间骑墙：一面主张人人皆可释经、以慈善践行信仰，一面又拥护腓特烈一世的政治抱负。它是草根运动，突出宗教的个人性而对立于建制正统；政治上则站在平民而非贵族一边。在哥尼斯堡，它是一股造成分裂的势力，与地方当局长期角力。康德成长的年代，哥尼斯堡正处于宗教动荡之中——虔敬派与正统路德宗相争；这一地方冲突，加上三十年战争更为普遍的摧折，共同塑造了他主张宗教宽容、主张宗教与哲学分途的立场。
