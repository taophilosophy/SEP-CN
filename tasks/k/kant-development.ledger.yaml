      [^note-17]: Kepler, in *Harmonice Mundi*, composed melodies for planets, which allowed him to discover the Harmonic Law—the square of the periodic times are to each other as the cubes of the mean distance. The Harmonic Law is Kepler’s third planetary law; it concerns the relation of planetary orbits and solar distances, such that the squares of the periodical times *t* of the planets in their orbits around the Sun are to one another as the cubes of their distances *r* from the sun, or *t*² = *r*³.
    step1: |-
      [^note-17]: 开普勒在《世界的和谐》中为诸行星谱曲，这使他发现了和谐定律——周期的平方彼此之比，等于平均距离的立方之比。和谐定律即开普勒第三行星定律，它关涉行星轨道与日距的关系：诸行星绕日轨道上的周期*t*的平方，彼此之比等于它们到太阳的距离*r*的立方之比，即*t*² = *r*³。
    step2: |-
      [^note-17]: 开普勒在《世界的和谐》中为诸行星谱曲，因而发现和谐定律：诸周期之平方互比，等于平均距离之立方互比。此即开普勒第三行星定律，论行星轨道与日距之关系——诸行星绕日周期*t*之平方互比，等于其距日*r*之立方互比，即*t*² = *r*³。
