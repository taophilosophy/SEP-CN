      That is, Kant not only regarded momentum and energy as relevant quantities, as d’Alembert had done, but he grasped that their union points to the universal nature of force. This was sharper than even Euler’s insight. Euler had discovered that these quantities are derivable from Newtonian force and that there is accordingly a quantitative connection among them. But Kant invested this connection with qualitative meaning, arguing that the structure of nature must be understood in dynamic terms, and that Newton really misses the point. The title of the book, “Thoughts on the True Estimation of Living Forces” is no idle boast, for Kant’s “true estimation” is the insight that “living force” and “dead pressure” are two sides of the same coin. Throughout the book, he wrestles with the harmony of opposites, Cartesian kinematics and Leibnizian dynamics, trying to marry momentum and energy—while having the audacity to criticize Newton. This is the thrust of the work. Taken as a prediction, it is superb. With his first publication, Kant intuited not only that matter is ultimately energetic, but also that its dynamic measure is momentum-energy.[^note-12]
