      [^note-18]: See *Universal Natural History*, 1:264–6 for the general structural-dynamic formation of the cosmos, 231.18–209 for star motions, 250.5–24 for galactic formation, 255.24–6 for analogous formation of distant galaxies; 250.34–6 for analogous formation of planetary systems; and 256.11–14 for the galactic field. Kant’s nebular hypothesis of star and galaxy formation was proposed once more, in a slightly different version, by P.S. de Laplace (1796), and was confirmed by C.F.v. Weizsäcker and J.G. Kuiper (1944). The discovery that the “foggy stars” (*neblichte Sterne*) are star clusters and galaxies is sometimes credited to T. Wright (1750). But as various commentators pointed out, the credit goes to Kant, not Wright. Wright states the idea as a conjecture; Kant integrated it in the correct Newtonian framework. Kant’s galactic hypothesis was reformulated by H. Curtis and confirmed by E. Hubble (1921).
    step1: |-
      [^note-18]: 关于宇宙的一般结构性-动力学形成，见《自然通史》1:264–6；恒星运动见 231.18–209；星系形成见 250.5–24；遥远星系的类似形成见 255.24–6；行星系统的类似形成见 250.34–6；星系场见 256.11–14。康德关于恒星与星系形成的星云假说，后来由 P. S. 德·拉普拉斯（1796）以略有不同的版本再次提出，并由 C. F. v. 魏茨泽克与 J. G. 柯伊伯（1944）加以证实。“雾状星”（*neblichte Sterne*）是星团与星系这一发现，有时被归功于 T. 赖特（1750）。但正如多位评论者所指出的，功劳应归康德，而非赖特。赖特只是把这一想法作为猜想提出；康德则把它整合进正确的牛顿框架。康德的星系假说由 H. 柯蒂斯重新表述，并由 E. 哈勃（1921）证实。
