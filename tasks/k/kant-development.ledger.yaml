    source: |-
      In the 18ᵗʰ Century university system defending such views often led to dismissal and/or lack of promotion. Kant, himself, was always cautious when writing on such topics. In the context of censorship, writers tend to become circumspect. To avoid trouble, they may publish something anonymously; or they may make oblique remarks instead of direct statements; or they may have second thoughts and retract earlier statements. Kant did all three things. But, for later readers in increasingly secular ages, it is easy to miss Kant’s subtleties and implications.
    step1: |-
      在 18 世纪的大学体制中，持此类观点往往导致解职和／或不得晋升。康德本人在写这类题目时总是谨慎的。在书报检查的语境中，作者们往往变得审慎。为免麻烦，他们可能匿名发表；或用迂曲的评述代替直陈；或改变想法而收回先前的说法。这三件事康德都做过。但对日益世俗化的后世读者而言，很容易错过康德的微妙与言外之意。
    step2: |-
      在 18 世纪的大学体制里，持守这类观点常常招致免职，或至少不得升迁。康德写这类题目时一向审慎。身处书报检查之下，作者自然趋于谨慎：或者匿名刊布，或者以迂回的评说代替直言，或者改弦更张、收回旧说。这三样康德都干过。然而对身处日益世俗化时代的后世读者来说，康德的细微之处与弦外之音极易被忽略。
  - id: 7
    kind: body
    source: |-
      Third, in terms of culture, Kant’s early views may be placed in a global rather than a purely Western context. Recent research suggests that key ideas of Kant’s natural philosophy also have sources in Taoist, Buddhist, Hindu and Confucian thought, which were disseminated in continental Europe by Jesuits based in China, popularized by Leibniz and Wolff, and further developed by Wolff’s Sinophile student Bilfinger.[^note-3] One example is the idea of dialectics that Bilfinger found in the Chinese classics, and which Kant encountered in the proceedings of the Russian academy. Importation and serious consideration of eastern thought was in its infancy during the end of the modern period, and Kant was unaware of the Far Eastern roots of the notions that influenced him. The historical irony is that he dismissed nonwestern cultures while being deeply influenced by their insights.
    step1: |-
      第三，就文化而言，康德的早期观点可以放进全球语境、而不只是纯西方的语境来看。晚近研究表明，康德自然哲学的若干核心观念也有道教、佛教、印度教与儒家思想的来源；这些思想由驻华耶稣会士传播到欧洲大陆，经莱布尼茨与沃尔夫推广，再由沃尔夫那位倾慕中国的学生比尔芬格加以发展。[^note-3] 一个例子是比尔芬格从中国典籍中发现的辩证法观念，而康德是在俄国科学院的会议记录中接触到它的。在现代时期末期，输入并认真对待东方思想尚处初创阶段，康德并不知道影响了自己的那些概念的远东根源。历史的讽刺在于：他轻视非西方文化，却又深受其洞见的浸染。
    step2: |-
      第三，在文化方面，康德的早期观点可以放在全球脉络中考察，而不必局限于纯西方脉络。晚近研究显示，康德自然哲学的若干关键观念亦源自道家、佛教、印度教与儒家思想：这些思想由在华耶稣会士传至欧洲大陆，经莱布尼茨、沃尔夫宣扬，又由沃尔夫那位好尚中国的学生比尔芬格推衍。[^note-3] 一例便是比尔芬格在中国典籍中发现的辩证法观念——康德是在俄国科学院的会议记录里遇到它的。近代末期，东方思想的输入与认真对待尚在起步，康德并不知晓影响自己的那些概念的远东根源。史学的反讽是：他鄙夷非西方文化，却深深受惠于其洞见。
