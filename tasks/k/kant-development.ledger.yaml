      借他著名的星云假说，康德辨明了行星、恒星与星系如何形成。其诞生是一场伟力的过程。引力把粒子收缩成云，斥力则在近处使其偏转。持续吸积增大偏转，把角动量赋予越转越快的云。旋转产生离心力，把云的赤道向外拉、把两极压扁，直到那外鼓而内落、绕其中心越转越快的球体压扁成盘。这一纽带——在牛顿的万有引力模型中——继续以动量与自旋聚合，直到宇宙盘的中心能量如此之大以致燃烧。能量的增长转化为结构的增长，把黄道面组织成团块的聚合。当盘面沉积成旋转的带，团块沿其轨道弹跳着增大质量。运动的物质扫清自己的路径，长成沿黄道面串起的行星，绕着如今空旷空间中的一颗太阳运行——或者，在更高一级的数量级上，长成庄严地绕明亮星系中心旋转的太阳。无论旋涡星系中的恒星，还是太阳系中的行星，公转的卫星在相等时间扫过相等面积，其周期与其到引力中心的距离同步。[^note-18]
