      康德思想中有一个主题，在前批判时期占主导，在批判时期不可少，到晚年他又重新拾起：人是自然的一部分。他对笛卡尔哲学及其问题太过熟悉，不会接受实体的心身二元论——一方是能思的实体，另一方是广延的实体。他循比尔芬格的启发式，早在《活力论》中便解决了笛卡尔的心身交互之谜，主张心灵在空间上定位于其身体之内，而二者都是相互影响的能量结构（1:20–21）。在后来的《获奖论文》（1764）中，他会判定基督教关于非物质灵魂的观念不可证明（2:293），并在批判著作中重申此论（A339/B397–A405/B432）。虽然心灵并非严格意义上的物质，他将在那里论证它们很可能是与自然之物质框架相称的某种能量束。在《自然通史》中，他把人描述为物质的存在者；理性的构成与作为动力之力产物的物质的构造相关联（1:335）。
