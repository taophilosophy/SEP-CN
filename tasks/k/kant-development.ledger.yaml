      [^note-24]: If one wanted to visualize this fluidly rising energy, then Kant’s precursor Kepler would propose the use of light. It is as hot as it gets when focused to a point, and it radiantly pulses upward toward complexity. Its shine flares out material dust, floods of particles, like streamers of smoke. Since it impels the dust as their vector, the blaze illuminates the particles. A suggestive image by Albrecht Altdorfer (1480–1538) is the sun at the fiery bottom of a tunnel of clouds, fleeing the slaughter of the East, on the canvas *Alexanderschlacht* (“Alexander’s Battle,” 1529). See Johannes Kepler, *Astronomia pars optica* (1604: chap. 1), “De natura lucis,” *Werke* 2:18–45, especially the section “Lucis encomium,” *Werke* 2:18–20. See also Alexanderschlacht—Albrecht Altdorfer.
    step1: |-
      [^note-24]: 若要把这流体般升腾的能量视觉化，康德的先驱开普勒会提议用光。光聚于一点时最热，并辐射性地向上脉冲，趋向复杂性。其光辉把物质尘埃、粒子之流灼散开来，如烟缕一般。既然光作为尘埃的矢量推动它们，光焰便照亮了诸粒子。阿尔布雷希特·阿尔特多费尔（1480–1538）在画作《亚历山大战役》（*Alexanderschlacht*，1529）中有一个富于提示的意象：云隧深处燃烧的太阳，正逃离东方的杀戮。见约翰内斯·开普勒《天文学的光学部分》（1604：第 1 章）“论光的本性”，《全集》2:18–45，尤其是“光的赞辞”一节，《全集》2:18–20。另见《亚历山大战役》——阿尔布雷希特·阿尔特多费尔。
    step2: |-
      [^note-24]: 若要把这流体般升腾的能量化为可见之象，康德的先驱开普勒会举光为例：光聚于一点则最热，且辐射地向上脉冲，趋向复杂；其辉把物质尘埃与粒子之流灼散如烟缕。光既为尘埃之矢量而推动之，焰便照亮诸粒子。阿尔布雷希特·阿尔特多费尔（1480–1538）在《亚历山大战役》（*Alexanderschlacht*，1529）中有一富提示之象：隧道般的云层底部那轮炽日，正逃离东方的屠戮。参约翰内斯·开普勒《天文学的光学部分》（1604：第 1 章）“论光之本性”，《全集》2:18–45，尤“光的赞辞”一节，《全集》2:18–20；并参《亚历山大战役》——阿尔布雷希特·阿尔特多费尔。
