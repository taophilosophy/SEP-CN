      神圣的纽带是统一的、不可或缺的*dynamis*。宇宙结构的相应特征——统一与和谐——使康德的设计论证成为可能。《唯一可能根据》的第三也是最后一部分，包含他对本体论论证与目的论论证的评估。严格说来，只有前者够得上证明（2:161–1）。比较之下可见二者的差异：前者是严格的概念性演证，后者是其概率性的、经验性的应用。但真理在于二者的和谐；二者都扎根于同一个关键概念——可能性。既然经验性的设计被内置入对象的可理解*dynamis*，两个论证便在纽带的本质上取得和谐。这就是此书结构奇特的原因：两个论证（*Beweise*），却只有一个根据（*Beweisgrund*）——即可能性，康德所谓*Möglichkeit*，亚里士多德所谓*dynamis*。
