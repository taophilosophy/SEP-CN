      As Immanuel grew older, hardships befell the family. After the death of his maternal grandfather (1729), the Kants suffered from a series of events that would eventually ruin the family. The death left the harness-shop downtown without leadership and Anna’s mother without a provider. To compensate, the Kant’s moved into the home of Anna’s mother on the outskirts of the city, in the *Sattlerstrasse*, the saddler-street, a less prosperous part of the city. The saddlers, a guild distinct from harness-makers while producing similar goods, did not welcome the competition. Johann Kant became the target of the saddle-makers’ hostility, and the business failed to prosper in the new location. Income steadily declined, and further hardship occurred with the death of Anna Regina (1737). Just thirteen years old, Immanuel must have keenly felt the loss of his first tutor regarding nature and religious sentiment.[^note-7]
    step1: |-
      随着伊曼努尔长大，困厄降临这个家庭。外祖父去世（1729）之后，康德家接连遭遇一系列事件，最终使家道败落。这份遗产使城里的马具铺失去主事者，也使安娜的母亲失去供养者。作为弥补，康德一家搬进城郊安娜母亲的住所，位于*Sattlerstrasse*（鞍匠街），那是城中较不富裕的地段。鞍匠是与马具匠相区别、却生产相似货品的行会，并不欢迎这份竞争。约翰·康德成了鞍匠们敌意的对象，生意在新址未能兴旺。收入持续下滑，而安娜·蕾吉娜的去世（1737）带来了更深的困苦。伊曼努尔才十三岁，必定痛切感到失去了一位在自然与宗教情感上的启蒙者。[^note-7]
    step2: |-
      伊曼努尔渐长，家中的困厄也随之而来。外祖父于 1729 年去世后，康德家接连遭逢变故，终于家道中落。老人一去，城里的马具铺没了主心骨，安娜的母亲也失去依靠。为求补济，康德一家搬进城郊的*Sattlerstrasse*（鞍匠街）安娜母亲的宅子——那是城中较为拮据的地段。鞍匠行会与马具匠虽属两行，货品却相近，自然不欢迎这份竞争。约翰·康德遂成鞍匠们敌视的对象，生意在新址始终不振。进项日渐减少，1737 年安娜·蕾吉娜的辞世又添一层困苦。伊曼努尔年方十三，失去的正是他自然与宗教情感上的第一位老师，其痛切可想而知。[^note-7]
