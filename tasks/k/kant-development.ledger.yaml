      Moreover, the education was not even of great quality. Only rather elementary math was offered, and natural philosophy (biology, chemistry, geology, physics, and astronomy) was not taught at all. Pupils were groomed for administrative and clerical careers, so science was considered a luxury not to be indulged. The sciences were also suspect from the theological perspectives of his instructors. Pietist indifference to inquiry and fundamentalist denial of facts resulted in contemptuous hostility toward science. As late as the 1750s, the clergy rejected the heliocentric system and frowned on Newton’s celestial mechanics as fiction. Pietist theologians such as Franz Budde (1667–1729), Joachim Lange (1670–1744), and Andreas Rüdiger (1673–1731) argued that the Bible teaches everything worth knowing of nature. The later Pietist thinker Christian August Crusius (1715–75) essentially concurred. For Pietism, particularly in its Saxon center, Halle, education was for practical management of life’s affairs, not an endeavor with intrinsic worth. Mathematics was useful for bookkeeping but worthless for describing reality. Physics was acceptable as long as its findings did not undermine the Bible. As independent research programs, however, the sciences were deemed wellsprings of heresy.[^note-8] Standard curriculum included a heavy dose of theology, catechism memorization and biblical stories. Although the school did offer a variety of topics: Latin, Greek, Hebrew, logic, history (both church and philosophy) and geography, the primary use of this instruction was in preparation for further theological study at the university. Education at the *Collegium* was always in the service of the Pietist programmatic, conversion and salvation of souls.
    step1: |-
      而且，教育质量甚至并不高。数学只教相当初浅的内容，自然哲学（生物学、化学、地质学、物理学与天文学）则完全不教。学生被培养去从事行政与文书职业，因而科学被视为不应沾染的奢侈。从教师的神学立场看，科学也值得怀疑。虔敬派对探究的漠然与基要主义对事实的否认，导致对科学的轻蔑敌意。直到 1750 年代，教士们仍拒斥日心体系，并把牛顿的天体力学视为虚构而皱眉。弗朗茨·布德（1667–1729）、约阿希姆·朗格（1670–1744）与安德烈亚斯·吕迪格（1673–1731）等虔敬派神学家主张，圣经教导了关于自然的一切值得知道的东西。稍后的虔敬派思想家克里斯蒂安·奥古斯特·克鲁修斯（1715–75）实质上赞同此说。对虔敬派——尤其在其萨克森中心哈勒——而言，教育是为了实际料理生活事务，而非具有内在价值的追求。数学对记账有用，对描述实在则无价值。物理学只要其发现不损害圣经便可接受。然而作为独立的研究纲领，诸科学被视为异端的泉源。[^note-8] 标准课程包括大量神学、教义问答背诵与圣经故事。尽管学校确实开设多种科目——拉丁文、希腊文、希伯来文、逻辑、历史（教会史与哲学史）与地理——这些教学的主要用途是为进一步在大学研习神学作准备。*Collegium*的教育始终服务于虔敬派的纲领：灵魂的皈依与得救。
