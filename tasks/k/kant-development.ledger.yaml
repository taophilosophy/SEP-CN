      This aperçu was no lucky guess. Kant understood what force involves. He argues that force is the essence of action (#4). This action is a pulse that “broadens out” (#9–10). Out-broadening of force (*ausbreiten*; 1:24.23) is an out-stretching of space (*Ausdehnung*; 1:24.6). Force makes the continuum, being governed, in turn, by the created structure (#10). This shift in understanding the nature of force correspondingly alters the nature one must think of material objects and dynamic interaction. The origin and source is force, and not substance, as the Cartesians had insisted. Force is responsible for substance, quantification and laws of nature—not the other way around. In this bold thesis Kant anticipates his more famous “Copernican turn”—an inversion of the way we view nature—but in this context he is still working in the field of natural philosophy of his day. Dynamic interaction turns force into a field and the void into a plenum. Kant anticipated that momentum-energy is the substantial correlate of spacetime. Bypassing Newton, he caught up with Einstein.[^note-13]
