      [^note-15]: Johannes Kepler formulated the inverse-square law in the *Astronomia pars optica* (1604). Kepler showed that the intensity of light decreases with the square of the distance (prop. 9); cf. *Werke* 2:22. He characterized light as the primordial living force, cf. chap. 1 (sec. “Lucis encomium”), *Werke* 2:19. He suspected the identity of the radiation of light and gravity, and applied the inverse-square law to gravitation; cf. letter to David Fabricius (11 Oct. 1605), *Werke* 15:241, and *Astronomia nova* (1609), introduction (sec. “Vera doctrina de gravitate”), *Werke* 3:25. Newton tied the inverse-square to Kepler’s planetary laws (1684) and derived it for gravity (1687).
    step1: |-
      [^note-15]: 约翰内斯·开普勒在《天文学的光学部分》（*Astronomia pars optica*，1604）中表述了反平方定律。开普勒表明，光的强度随距离的平方而减弱（命题 9）；参《全集》2:22。他把光描述为原初的活力，参第 1 章（“光的赞辞”一节），《全集》2:19。他猜疑光的辐射与引力同一，并把反平方定律应用于引力；参致达维德·法布里齐乌斯的信（1605 年 10 月 11 日），《全集》15:241，以及《新天文学》（1609）导论（“论引力的真学说”一节），《全集》3:25。牛顿把反平方与开普勒的行星定律联系起来（1684），并为引力导出该定律（1687）。
    step2: |-
      [^note-15]: 约翰内斯·开普勒在《天文学的光学部分》（*Astronomia pars optica*，1604）中表述了反平方定律：光强随距离之平方而减（命题 9）；参《全集》2:22。他称光为原初的活力，参第 1 章“光的赞辞”一节，《全集》2:19。他疑心光的辐射与引力同一，遂以反平方定律施于引力：参致达维德·法布里齐乌斯书（1605 年 10 月 11 日），《全集》15:241；《新天文学》（1609）导论“论引力之真学说”一节，《全集》3:25。牛顿把反平方与开普勒行星定律相连（1684），并据以导出引力定律（1687）。
