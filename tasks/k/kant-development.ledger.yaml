      With his famous nebular hypothesis, Kant discerned how planets, stars, and galaxies form. Their birth is a process of titanic power. Attractive forces contract particles into clouds, but repulsive forces deflect them up close. Continued accretion increases deflection, imparting angular momentum on the ever quicker rotating cloud. Rotation generates centrifugal forces, pulling the cloud’s equators outwards, crushing the poles, until the out-bulging yet in-falling sphere, revolving ever faster around its center, flattens into a disc. The bond, in Newton’s model of universal gravitation, continues coalescing in momentum and spin, until the center of the cosmic disc is so energized that it combusts. Increased energy translates into increased structure, organizing the ecliptic plane into lumpy coalescence. When the disc plane sediments into spinning bands, the lumps grow massive, while caroming along their orbits. The moving masses vacuum their paths and grow into planets strung along an ecliptic plane, orbiting a sun in now empty space—or, on a higher order of magnitude, into suns majestically revolving around a brightly lit galactic center. Whether suns in spiral galaxies, or planets in solar systems, the orbiting satellites sweep out equal areas in equal times, with their periods in sync with their distances from the gravitational centers.[^note-18]
