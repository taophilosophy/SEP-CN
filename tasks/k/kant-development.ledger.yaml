      With this essay, Kant synthesizes Newton with his own theory of forces, leading Kant to the cutting edge of current knowledge. Nature, in the *Universal Natural History*, streams outward in a wavefront of organization (1:314.1–2), generating worlds (1:314.8), biospheres and sentience (1:317.5–13, 352–3), and finally reason, human and otherwise (1:351–66). Organization is fragile, and spontaneity, pushed far enough, invites chaos. Mature cosmic regions decay, chaos sets in, and entropy follows in the wake of complexity. But entropy provides the very conditions that allow the cosmic pulse to bounce material points back to order. Thus the expanding chaos coalesces at its center into order, followed by chaos, by order, by chaos. Like a rising and burning phoenix, nature cycles between life and death (1:312.13).
    step1: |-
      借这篇文章，康德把牛顿与他自己的力论综合起来，走到当前知识的边缘。在《自然通史》中，自然以组织化的波前向外流涌（1:314.1–2），生成诸世界（1:314.8）、生物圈与感受性（1:317.5–13, 352–3），最终生成理性——人类的与别的（1:351–66）。组织是脆弱的；自发性一旦被推得够远，便招致混沌。成熟的宇宙区域衰变，混沌登场，熵随复杂性而来。但熵恰恰提供了让宇宙脉冲把物质点弹回秩序的条件。于是扩张的混沌在中心聚合成秩序，继而是混沌，继而是秩序，继而是混沌。如同一只升起又燃烧的凤凰，自然在生与死之间循环（1:312.13）。
