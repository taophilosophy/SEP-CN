      What kind of life? Ultimately, Kant argues, planets aim to sustain intelligent life. Inspired by Fontenelle’s vision of inhabited worlds, he conjectures that there may well be extraterrestrial life.[^note-22] Nothing, however, guarantees that humans are the crowns of creation nor even atop the chain of being. Humans, Kant conjectures, occupy a “middle rung” on the ladder of creatures (1:359.29)—and are possibly infinitely distant from the top tier of intelligent beings (1:353.35–6). A sober look at ourselves shows that we are on a risky course (*gefährliche Mittelstrasse*, 1:366.7) halfway between wisdom and irrationality. We are cosmically mediocre.
    step1: |-
      什么样的生命？康德最终主张，行星以维持有智识的生命为目标。受丰特奈尔“有居民的世界”这一想象激发，他推测很可能存在地外生命。[^note-22] 然而，没有任何东西保证人类是造物的桂冠，甚至不能保证人类居于存在之链的顶端。康德推测，人在受造物之梯上占“中间一档”（1:359.29），而且可能与最上层的智性存在者相距无限（1:353.35–6）。清醒地审视自身，可见我们正走在一条危险的中道（*gefährliche Mittelstrasse*，1:366.7）上，介于智慧与非理性之间。我们在宇宙中是平庸的。
    step2: |-
      怎样的生命？康德最终主张：行星以维系有智慧的生命为目标。受丰特奈尔“有居民诸世界”之想象启发，他推测很可能存在地外生命。[^note-22] 然而没有任何东西担保人类是造物的冠冕，甚至不能担保人类居存在之链之巅。康德推测，人在受造物之梯上占“中间一档”（1:359.29），且可能与最上层的智性存在相距无限（1:353.35–6）。清醒地打量自身便知，我们正走在介于智慧与非理性之间的一条险径（*gefährliche Mittelstrasse*，1:366.7）上。就宇宙而论，我们是平庸的。
