      [^note-16]: Bilfinger was known for a work on Confucianism (1724), a quasi-Taoist commentary on Wolff’s *German Metaphysics* (1725), and a tract on force (1728). Wolff’s speech on the Chinese (1721)—a watershed event in the Enlightenment—had motivated him, then at Tübingen, to study these provocative pagans (in 1726 Wolff would cite Bilfinger when preparing his speech for print). In Taoist ontology, the dynamic principle (Tao) weaves the world by “stretching out” the void (*dao zhong*) and that produces things and life by individuating the resulting field into lingering wholes. Nature and the good are opposites but harmonize in their parallel thrust toward sustainable complexity. Moral practice is their alignment. Bilfinger stressed the significance of this thrust, in the guise of Aristotle’s *possibilitas* or *dynamis*, in his Wolffian commentary. The theologians at Tübingen were upset, and Bilfinger lost his job. He joined Daniel Bernoulli (1700–82) at the Russian Academy to study dynamics—and the resulting tract on force inspired Kant in not-too-distant Königsberg two decades later. Bilfinger’s book on Chinese philosophy is *Specimen doctrinae veterum Sinarum moralis et politicae* (1724; “Specimen of the Moral and Political Teachings of the Ancient Chinese”); his commentary on Wolff’s *German Metaphysics* (1719) is *Dilucidationes philosophicae de Deo, anima humana, mundo et generalibus rerum affectionibus* (1725, “Philosophical Dilucidations of God, the Human Soul, the Word, and the General Impressions of Things”); and his treatise on force is *De viribus corpori moto insitis et illarum mensura*, (w. 1725–6, p. 1728; “On the Essential Forces of Bodily Motion and their Measure”). He states his heuristic rule in *De viribus* #16. In his study of Chinese thought, Bilfinger was taken by the *Doctrine of the Mean* (*Zhong Yong*). This Confucian classic strikes a bridge to Taoism (whose chief text, the *Tao Te Ching*, would arrive in the West later). The *Doctrine of the Mean* describes nature as a web of force-points and humans as nodes in the web. It begins with,

      > what cosmos imparts to humans is called vitality; following vitality is called the Way; and cultivating the Way is called education

      cf. *Zhongyong Jiyi* (Taibei: Sangyang 1985), 2 (my trans.). The text had been printed twice; Wolff knew the work in Noël’s translation (*Immutabile medium*, 1711), and Bilfinger in Couplet’s earlier version (*Medium sempiternum*, 1687). In the *Specimen*, Bilfinger explains that vitality and Tao are aspects of a unified idea constitutive of creation and good, and refers to his idea as “light of reason” (*lumen rationis*; #41, margin). See Schönfeldb. Kant was ignorant of the Chinese but absorbed the Taoist motif. The middle way is not a lukewarm compromise but a dialectical harmony of opposites in a golden mean. Bilfinger’s transmission of the Tao involved a Western spin: while Taoism stresses the paradoxical essence of nature, the Jesuit translators of Tao as “light of nature” (*lumen naturalis*) and “rational nature” (*natura rationalis*) had read it to mean that nature is consistent and rational—which is, of course, a premise of scientific research. Kant says that he put Bilfinger’s rule to good use (#20; 1:32), and he certainly did—it led him to reconcile momentum and energy, force and space, field and void, mind and matter, and God and nature. It was Kant’s universal rule, guiding him at the time. It is an irony that one of the West’s greatest thinkers was first inspired by the Tao of the East.
    step1: |-
      [^note-16]: 毕尔芬格以三事著称：一部论儒学的著作（1724）、一部近乎道家式的沃尔夫《德国形而上学》评注（1725）、一篇论力的短著（1728）。沃尔夫论中国人的演讲（1721）——启蒙运动的一个分水岭事件——促使当时在图宾根的他研究这些富于挑衅的异教徒（1726 年沃尔夫准备付印其演讲时，还引及毕尔芬格）。在道家本体论中，动力性原则（道）通过“伸展”虚空（*dao zhong*）而编织世界，并借把由此产生的场个体化为延续的整体而生出万物与生命。自然与善相对立，却在朝向可持续复杂性的平行冲力中取得和谐。道德实践即是二者的对齐。毕尔芬格在其沃尔夫式评注中强调这一冲力的意义，其形态为亚里士多德的*possibilitas*或*dynamis*。图宾根的神学家们大为不满，毕尔芬格因此丢了职位。他前往俄国科学院与丹尼尔·伯努利（1700–82）一同研究动力学——由此产生的那篇论力的短著，二十年后在并不遥远的哥尼斯堡启发了康德。毕尔芬格论中国哲学的著作是《古代中国人道德与政治学说样本》（*Specimen doctrinae veterum Sinarum moralis et politicae*，1724）；他对沃尔夫《德国形而上学》（1719）的评注是《关于上帝、人的灵魂、世界与事物一般情状的哲学阐发》（*Dilucidationes philosophicae de Deo, anima humana, mundo et generalibus rerum affectionibus*，1725）；其论力的专著是《论物体运动的内在之力及其量度》（*De viribus corpori moto insitis et illarum mensura*，撰于 1725–6，1728 年刊）；他在《论力》#16 中陈其启发式规则。在研究中国思想时，毕尔芬格倾心于《中庸》。这部儒家经典搭起通往道家的桥梁（后者的主要文本《道德经》日后才传入西方）。《中庸》把自然描述为由力点构成的网，而人是网上的节点。其开篇云：

      > 天所赋予人的叫作性，遵循性叫作道，修治道叫作教

      参《中庸集义》（台北：三阳 1985），2（拙译）。此书曾两度刊印；沃尔夫通过诺埃尔的译本（*Immutabile medium*，1711）知其书，毕尔芬格则通过柏应理的较早译本（*Medium sempiternum*，1687）。在《样本》中，毕尔芬格解释说，性与道是同一个统一观念的两面，该观念构成创造与善，并把自己的观念称为“理性之光”（*lumen rationis*；#41，边注）。见 Schönfeldb。康德不通中文，却吸收了道家的母题。中道不是温吞的折中，而是对立面在黄金中项中的辩证和谐。毕尔芬格对道的传述带有一层西方的转写：道家强调自然的悖论性本质，而耶稣会译者把道译为“自然之光”（*lumen naturalis*）与“理性自然”（*natura rationalis*），读之为自然融贯而有理性——这当然是科学研究的一个前提。康德说他善用了毕尔芬格的规则（#20; 1:32），他确实如此——这条规则引导他调和了动量与能量、力与空间、场与虚空、心与物、上帝与自然。它是康德当时的普遍规则，为他导航。历史的讽刺是：西方最伟大的思想家之一，最初竟受东方之道的启发。
    step2: |-
      [^note-16]: 毕尔芬格有三部著作知名：论儒学一种（1724）、近乎道家式的沃尔夫《德国形而上学》评注一种（1725）、论力短著一种（1728）。沃尔夫论中国人的演讲（1721）——启蒙运动的一大分野——驱使他（时在图宾根）去研究这些富于挑衅的异教徒（1726 年沃尔夫准备把演讲付印时，还引及毕尔芬格）。在道家本体论中，动力性原则（道）以“伸展”虚空（*dao zhong*）来编织世界，又把由此而成的场个体化为绵延的整体，从而生出万物与生命。自然与善相对反，却在朝向可持续复杂性的同一冲力中和解；道德实践即是二者的调准。毕尔芬格在沃尔夫式评注中强调这股冲力的意义，其形态即亚里士多德的*possibilitas*或*dynamis*。图宾根的神学家大为愤慨，毕尔芬格因而失职。他赴俄国科学院，与丹尼尔·伯努利（1700–82）同研动力学——由此而成的论力短著，二十年后在并不遥远的哥尼斯堡启发了康德。其论中国哲学者为《古代中国人道德与政治学说样本》（*Specimen doctrinae veterum Sinarum moralis et politicae*，1724）；其评注沃尔夫《德国形而上学》（1719）者为《关于上帝、人之灵魂、世界与事物一般情状的哲学阐发》（*Dilucidationes philosophicae de Deo, anima humana, mundo et generalibus rerum affectionibus*，1725）；其论力专著为《论物体运动的内在之力及其量度》（*De viribus corpori moto insitis et illarum mensura*，撰于 1725–6，1728 年刊）。其启发式规则见《论力》#16。研究中国思想时，毕尔芬格尤好《中庸》：这部儒家经典是通向道家的桥梁（道家要籍《道德经》晚后才入西方）；《中庸》以自然为力点之网，以人为网上之节。其开篇云：

      > 天命之谓性，率性之谓道，修道之谓教

      参《中庸集义》（台北：三阳，1985），2（拙译）。此书曾两度刊行：沃尔夫据诺埃尔译本（*Immutabile medium*，1711）知之，毕尔芬格则据柏应理更早的译本（*Medium sempiternum*，1687）。《样本》中，毕尔芬格释“性”与“道”为同一观念之两面，此观念构成创造与善，并自称其说为“理性之光”（*lumen rationis*；#41，边注）。见 Schönfeldb。康德不通中文，却承袭了道家母题。中道并非温吞的折中，而是对立面在黄金中项里的辩证和谐。毕尔芬格传道时带了西方的转写：道家强调自然的悖论性，而耶稣会译者把道译作“自然之光”（*lumen naturalis*）、“理性自然”（*natura rationalis*），读为自然融贯而合理——这自是一切科学研究的前提。康德自言善用毕尔芬格之则（#20; 1:32），确乎如此：此则引他调和动量与能量、力与空间、场与虚空、心与物、上帝与自然。这是他当时的普遍规则，为他导航。历史的讽刺是：西方最伟大的思想家之一，最初竟为东方之道所启发。
