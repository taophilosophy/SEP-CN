      除体罚外，违纪的典型惩罚是今天所谓的“罪恶感轰炸”。与天主教（罪在告解中得赦）不同，新教的得救取决于恩典。信徒不能靠仪式获得赦免；非天主教的基督徒不断积攒罪愆。他们只能尽力而为，靠悔恨的自省来增大得救的几率。虔敬派把悔恨磨成了一门精细的艺术。得救的关键是一种罪感——其实更是一种情感而非感觉（*Schuldgefühl*）。上帝的恩典会抹去一切，但恩典既不可预测，也不可验证。唯一的尺度（如果有的话）是羞耻的强度：培养出的罪感越强，得救的机会越大。*Collegium*的教育把这种罪感制度化，并设法以悔罪的精神与保守得体的意识来正确教导其学子。人应当怀着热切的罪感与卑劣感，以求在灵性上与实践上成为更好的公民。
