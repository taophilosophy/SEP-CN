      Following this cosmic model, in which Kant rejects extrinsic teleology for an immanent version, everything is connected. Taking his cue from Pope’s “chain of being”, Kant likens the universe to a *Kette der Natur*, the “chain of nature” (1: 308, 365).[^note-20] Humans are merely links in the greater chain of being. Dismissing the anthropocentric teleology of Wolff, Derham, and the physico-theologians, Kant finds the claim that the universe was created for human purposes exaggerated—and provincial.[^note-21] An intelligent louse, he says, might as well imagine that the scalp it lives on and the forest of hair that surrounds it were created just for the sake of its happiness; from a louse’s point of view, things surely look that way (1:353–4). In the chain of nature, all beings are equal. Nature does not play favorites, none of the organic links, whether it be an insect or a rational being, is more important than another (1:354). As the goal of force is complexity, the goal of nature (commonly understood) is biodiversity, the goal of planets is to sustain biospheres, the goal of terrestrial existence is to increase biota—the *telos* of nature is life (1:353), at least until it reaches maximum density and begins to fracture in cosmic collapse.
    step1: |-
      循着这一宇宙模型——康德在其中拒斥外在目的论而取内在版本——万物相互关联。他取蒲柏“存在之链”的意旨，把宇宙比作*Kette der Natur*、“自然之链”（1:308, 365）。[^note-20] 人只是更大存在之链上的环节。他摒弃沃尔夫、德勒姆与自然神学家们的人类中心主义目的论，认为“宇宙为人类目的而受造”的主张夸大其词——而且眼界狭隘。[^note-21] 他说，一只聪明的虱子不妨设想它所寄生的头皮与周围的毛发森林正是为它的幸福而造；从虱子的视角看，事情多半就是如此（1:353–4）。在自然之链上，众生平等。自然不偏爱谁，有机的环节——无论昆虫还是理性存在者——没有一个比另一个更重要（1:354）。既然力的目标是复杂性，自然的目标（通常理解的）便是生物多样性，行星的目标是维持生物圈，地上存在的目标是增加生物——自然的*目的*是生命（1:353），至少在其达到最大密度并开始在宇宙崩塌中破裂之前如此。
    step2: |-
      循此宇宙模型——康德在其中弃外在目的论而取内在之说——万物交互相连。他取蒲柏“存在之链”之意，把宇宙比作*Kette der Natur*、“自然之链”（1:308, 365）。[^note-20] 人不过是更大存在之链上的环节。他弃置沃尔夫、德勒姆与自然神学家们的人类中心主义目的论，视“宇宙为人类目的而受造”之说为夸张——而且偏远。[^note-21] 他说，一只聪明的虱子不妨想象，它寄生的头皮与四围的毛发森林正是为它的幸福而造；从虱子的眼光看，事情多半就是这样（1:353–4）。在自然之链上，众生平等：自然不偏爱任何环节，昆虫也好，理性存在者也罢，无一比别的环节更重要（1:354）。力的目标既是复杂性，自然的目标（就通常所解）便是生物多样性，行星的目标是维持生物圈，地上存在的目标是繁增生物——自然的*目的*是生命（1:353），至少在它达到最大密度、开始在宇宙崩塌中破裂之前如此。
