      The lack of scientific training would hamper his later explorations of nature. He tried to make up for it at the university in 1740, but his mathematics instructor, *Privatdozent* Christian Ammon (1696–1742) was ignorant of the calculus (Kuehn 2001b: 13–16)[^kuehn-2001b]—an essential tool for understanding the cutting-edge physical research of the day. Kant’s quantitative skills were to remain substandard; when he calculated, the results usually came out all wrong (Adickes 1924a: 73–83; 1924b: 1:38–9)[^adickes-1924a]. This lack in mathematical training played into his belated comprehension of Newton’s work, yet did not harm Kant’s appreciation for him. Such a substandard education in arithmetic, philosophy and the sciences were the norm at the *Collegium Fridericianum*, and Kant would have to continually work to make up for this early deficit.
    step1: |-
      科学训练的缺乏，妨碍了他日后对自然的探索。1740 年他试图在大学弥补，但他的数学老师、编外讲师克里斯蒂安·阿蒙（1696–1742）对微积分一无所知（Kuehn 2001b: 13–16）[^kuehn-2001b]——而微积分是理解当时最前沿物理研究的关键工具。康德的定量能力始终不达标；他一算，结果通常全错（Adickes 1924a: 73–83; 1924b: 1:38–9）[^adickes-1924a]。这一数学训练的欠缺，使他对牛顿工作的理解来得迟，却未损害康德对牛顿的推崇。这种在算术、哲学与科学上的次等教育，乃是*Collegium Fridericianum*的常态，康德不得不持续努力去弥补早年的亏空。
