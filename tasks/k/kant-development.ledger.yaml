      与此同时，康德在那里对自己先前的可感与理知之分作了限定；他这样做是好的，因为正如其早期洞见所示，他的动力论本体论虽然为时过早，却始终走在正路上。于是交互性进入《批判》，成为一种认知装置，用以整理数据（选言关系或交互性；A70/B95 与 A80/B106），并用以知觉空间对象（共存原理；A211/B256–A215/B262）。能量场（伸展为空间的力）也在那里回归，成为康德批判规则——不谈独立于心灵之自然的可知特征——的唯一例外。但他意识到，这条规则必须被打破，因为能量场维系着对空间事物的交互经验（A211/B257–A213/B260）。
