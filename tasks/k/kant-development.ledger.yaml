      [^note-8]: Budde rejected in his *Elementa philosophiae theoreticae* (“Elements of Theoretical Philosophy”) the Copernican heliocentric model because it does not harmonize with the Scripture (IV.1). The *Elementa* was published in 1703—more than a century after Copernicus’s *De Revolutionibus* (1543) and two generations after Galileo’s *Two World Systems* (1632). Lange deplored in his *Medicina Mentis* (1704; “Medicine of the Mind”) that the disease at the root of Adam’s fall is intellect (part I, chapter 1); its cure depends on prayer and catechetical tenets (I.2, II.2–8). Logic, ontology, and natural philosophy are threats (I.3, V.7); science, as a secular enterprise, produces heresies and lies (V.5). Rüdiger argued in *De sensu veri et falsi* (1722; On the Meaning of Truth and Falsehood”) that the mathematics only concerns what is possible and cannot be applied to reality, thus rejecting quantifications of natural phenomena (II 4:3). Crusius insisted in *Anleitung über natürliche Begebenheiten ordentlich und vorsichtig nachzudenken* (1749; “Instructions on Thinking Orderly and Carefully about Natural Events”) that a physics that quantifies empirical data is misguided (p. 508) and rejected Newton’s physics as a meaningful model of nature (ibid.: 536).
