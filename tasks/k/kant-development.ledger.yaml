      According to Kant’s later judgment (Wasianski 1804: 246; tr. Kuehn 2001a: 31)[^kuehn-2001a][^wasianski-1804], his mother lived out a positive form of Pietism, blending love, tolerance, and spirituality into a faith that was “genuine” and “not in the least enthusiastic” (‘enthusiasm’ or *Schwärmerei* means fundamentalism). The child’s formation was apparently not hurt by Anna’s piety; instead of turning into an intolerant zealot, as many Pietist’s “enthusiasm” did, she instilled a reverence for nature and spiritualism, a plausible sense of right and wrong, and always respected him as a person.
