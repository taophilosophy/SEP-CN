      万物交互关联，心灵塑造物质，物质也塑造心灵。粗糙的物质使心灵纤维僵而不灵（1:356）。限制智商的粗糙度与密度成正比。就宇宙而言，这意味着理性的力取决于空间位置。在恒星云（胚胎太阳系）中，由密度各异的元素组成的物质随机分布。但一旦交互的力把物质云拉入并使其旋转，较密的粒子便不像较轻的粒子那样容易被推来推去；当不等的碎块相撞，轻的弹开，密的留在轨道上。较密的元素偏转得晚，巡航在较低的轨道；较轻的元素偏转得早，在更高处运行。轨道高度与物质密度成反比（1:270）；因此轨道带越靠近太阳，便形成越密的行星（1:277；康德的“静态定律”）。康德推测，真正卓越的智性将只在外行星的稀薄物质中涌现（1:359）。行星越密（如靠近太阳的地球），其居民不幸也越密。
