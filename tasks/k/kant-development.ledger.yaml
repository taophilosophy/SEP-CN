      同时，康德在那里对先前可感与理知之分作了限定——这是好事。正如其早期洞见所示，他的动力论本体论虽为时过早，方向却一直是对的。于是交互性进入《批判》：作为整理数据的认知装置（选言关系或交互性；A70/B95、A80/B106），也作为知觉空间对象的条件（共存原理；A211/B256–A215/B262）。能量场（伸展为空间的力）也重现于其中，且是康德那条批判规则——不谈独立于心灵之自然的可知特征——的唯一例外。然而他明白，这条规则非破不可，因为正是能量场维系着对空间事物的交互经验（A211/B257–A213/B260）。
