      What disturbed Kant was that he saw in the farting mystic a parody of himself (Laywine 1993: 71)[^laywine-1993]. The visionary’s world of angels is the *reductio* of dynamic cosmology—the absurd final consequence of Kant’s own contentions. He had always assumed that reality is radically coherent. Science and metaphysics join hands in its investigation because the cosmos involves an intelligible as well as an empirical side: humans are unqualified parts of nature; mind and body are energetic interacting presences; rationality depends on matter; freedom in nature is just a question of resisting force; and so forth. There is only force, and its product, nature. Kant’s ideas had amounted to a dynamic parallelism of the corporeal and the mental—just like Swedenborg’s philosophy of heaven.
    step1: |-
      令康德不安的是，他在这位放屁的神秘主义者身上看到了自己的漫画像（Laywine 1993: 71）[^laywine-1993]。这位通灵者的天使世界是动力宇宙论的*归谬*——是康德自己主张的荒诞终局。他一直假定实在是彻底融贯的。科学与形而上学在探究实在时携手，因为宇宙既有可理解的一面，也有经验的一面：人是自然地地道道的部分；心与身是能量性的交互在场；理性取决于物质；自然中的自由只是抵抗力的问题；如此等等。只有力，以及它的产物——自然。康德的想法等于一种身体与心灵的动态平行论——正如史威登堡的天堂哲学。
    step2: |-
      使康德不安的是：他在这位放屁的通灵者身上，看见了自己的漫画像（Laywine 1993: 71）[^laywine-1993]。此人的天使世界，正是动力宇宙论的*归谬*——康德自己主张的荒唐终局。他一向假定实在彻底融贯，故科学与形而上学在探究中携手：宇宙既有可理解的一面，又有经验的一面——人是自然地道的成分；心与身是能量性的交互在场；理性系于物质；自然中的自由不过是抗御力的问题；如此等等。只有力，及其产物——自然。康德的想法，恰是一种身心两界的动力学平行论，与史威登堡的天堂哲学无异。
