      [^note-12]: The principle of the conservation of momentum and energy results from the convertibility of mass and energy. It applies to masses moving in spacetime and is visible in collisions. Momentum and energy, or more precisely, their combination, are the joint measure of mass. Momentum-energy is proportional to mass; it is a vector quantity (it depends on direction); and its arrow points in the same direction as the world line of the object in spacetime. When masses collide, their momentum and energy differ before and after impact, but their sum remains equal. Momentum-energy is fundamental: its conservation governs every collision in the universe, and it is also frame-invariant, remaining the same regardless of the chosen frame of reference.
    step1: |-
      [^note-12]: 动量与能量守恒原理源于质量与能量的可互换性。它适用于在时空中运动的诸质量，并在碰撞中显现。动量与能量——更确切说，二者的结合——是质量的共同量度。动量-能量与质量成正比；它是矢量（取决于方向）；其箭头指向物体在时空中世界线的同一方向。诸质量相撞时，碰撞前后的动量与能量各不相同，但其总和保持相等。动量-能量是根本性的：其守恒支配宇宙中每一次碰撞，且它是参照系不变的，无论选取何种参照系都保持不变。
    step2: |-
      [^note-12]: 动量与能量守恒原理，出自质量与能量之可互换。它适用于时空中运动的诸质量，于碰撞之际可见。动量与能量——更确切地说，二者的合成——是质量的共同量度：动量-能量与质量成正比，是矢量（有方向之别），其箭头与物体在时空中的世界线同向。诸质量相撞，撞前撞后的动量与能量各异，其总和却相等。动量-能量是根本的：其守恒主宰宇宙中每一次碰撞，且具参照系不变性——无论取何参照系，皆不变。
