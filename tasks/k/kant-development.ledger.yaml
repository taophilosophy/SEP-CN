      When Kant entered the University of Königsberg in 1740, he was sixteen. Financial considerations at home left much to be desired. His widowed father filed his taxes as a pauper. But, a maternal uncle, shoemaker Richter, supported Immanuel’s studies. In addition, Immanuel supplemented his uncle’s beneficence by working as a tutor to fellow students. Often he did so for free, but, on occasion, Kant would accept luxuries to supplement his modest means. He was a sober and quiet student, not engaging in the frivolous activities common to university students.[^note-9] Yet Kant was no drudge either. He enjoyed playing billiards, and did so with such skill that he and his companions often won small sums of money to help defray the cost of living. As a member of the university, Kant had risen to a new rank within society. In so doing, he enjoyed privileges of this class and exemptions from duties e.g., military service/conscription, to which the lower classes were susceptible. For a person of slight build and fragile constitution, Kant’s upward social status concomitant exemptions very likely saved his life.
