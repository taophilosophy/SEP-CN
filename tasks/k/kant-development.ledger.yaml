      [^note-11]: Using the term “mass” here is somewhat anachronistic. Descartes spoke of “quantity of matter” (*quantité de la matière*), which he identified mostly with size and occasionally with weight. Leibniz talked about “magnitude of the body” (*magnitude corporis*), which he identified mostly with weight and occasionally with size. Newton introduced the concept of “mass” in *De Motu* (1684; hypothesis 2) and explicated it in the *Principia* (1686; first law). Mass is the measure of the amount of matter that determines a body’s resistance to acceleration by an applied force. Newton’s assumption that mass is constant works for local situations and speeds. A general definition of mass requires Einstein’s correction that mass will increase at (very high) velocities.
    step1: |-
      [^note-11]: 在此使用“质量”一词略有时代错置。笛卡尔说的是“物质的量”（*quantité de la matière*），他多半以大小、偶尔以重量来认它。莱布尼茨谈的是“物体的大小”（*magnitude corporis*），他多半以重量、偶尔以大小来认它。牛顿在《论运动》（*De Motu*，1684；假设 2）中引入“质量”概念，并在《原理》（1686；第一定律）中加以阐明。质量是物质数量的量度，它决定物体对外加力所致加速度的抵抗。牛顿假定质量恒定，这在局域情形与常速下可行。质量的一般定义需要爱因斯坦的修正：质量在（极）高速下会增加。
    step2: |-
      [^note-11]: 此处用“质量”一词略有时代错置之嫌。笛卡尔说“物质的量”（*quantité de la matière*），多以大小认之，偶尔指重量；莱布尼茨说“物体之大小”（*magnitude corporis*），多以重量认之，偶尔指大小。牛顿在《论运动》（*De Motu*，1684；假设 2）中引入“质量”，并于《原理》（1686；第一定律）中加以阐明。质量是物质数量的量度，决定物体对外加力所致加速度的抵抗。牛顿假定质量恒定，于局域情形与常速下尚可；质量的一般定义须待爱因斯坦修正：在（极）高速下质量会增大。
