    source: |-
      Modern philosophy begins with Kant, and yet he marks the end of the “Modern” epoch (1600–1800 CE) in the history of philosophy.[^note-1] The appearance of the *Critique of Pure Reason* in 1781 marks the end of the modern period and the beginning of something entirely new. Today his texts are read on all continents, and his thought has had a profound impact on nearly all subsequent philosophical discussions. The 2004 bicentennial of his death, for instance, was reflected in conferences in Austria, Canada, China, France, Germany, Hungary, Japan, Iran, Italy, Mexico, New Zealand, Paraguay, Poland, Portugal, Russia, Senegal, Spain, Sweden, Taiwan, and Turkey.
    step1: |-
      现代哲学始于康德，然而他又标志着哲学史上“现代”时期（公元 1600–1800 年）的终结。[^note-1] 《纯粹理性批判》1781 年的问世，标志着现代时期的结束与某种全然崭新之事的开端。如今他的文本在各大洲都有人阅读，其思想对几乎所有后续哲学讨论都有深远影响。例如，2004 年他逝世二百周年之际，奥地利、加拿大、中国、法国、德国、匈牙利、日本、伊朗、意大利、墨西哥、新西兰、巴拉圭、波兰、葡萄牙、俄罗斯、塞内加尔、西班牙、瑞典、中国台湾与土耳其都举办了纪念会议。
    step2: |-
      哲学史上的“现代”时期（公元 1600–1800 年）因康德而落幕，而现代哲学又由康德发端。[^note-1] 1781 年《纯粹理性批判》问世：现代时期就此终结，某种全然崭新之物就此开启。今天，他的文本在每一个大洲都有读者，其思想几乎影响了此后的每一场哲学讨论。仅举一例：2004 年康德逝世二百周年，奥地利、加拿大、中国、法国、德国、匈牙利、日本、伊朗、意大利、墨西哥、新西兰、巴拉圭、波兰、葡萄牙、俄罗斯、塞内加尔、西班牙、瑞典、中国台湾与土耳其各地都举行了纪念会议。
  - id: 2
    kind: body
    source: |-
      Like other watershed figures, Kant has contributed to the shape of world civilization, and the conceptualization we have of the world today. His practical ideas, such as the Categorical Imperative and its implications (1785), informed the Universal Declaration of Human Rights (1948), the Political and Economic Covenants (1966), and the International Criminal Court (2002). His exploration of natural sciences and his metaphysical ideas, particularly those of his pre-critical period (1747–1770), are stunning. Kant gave the first account of the evolutionary reciprocity of spacetime and momentum-energy, and formulated the first general law of free field radiation (1747). He suggested the conceptual solution of the three body problem, which emerges in the interplay of Earth, Moon, and Sun (1754). He was the first to construct a detailed evolutionary cosmology (1755). His ideas on biospherical dynamics allowed him to predict the rhythms of the monsoon and the oscillation of coastal winds (1755–1757). He suggested that the building blocks of matter are energy bubbles (1756)—an idea that is useful today in superstring theory in the guise of Calabi-Yau manifolds.
    step1: |-
      与其他划时代人物一样，康德也参与塑造了世界文明的形态，以及我们今天关于世界的概念构想。其实践理念——如定言命令及其蕴含（1785）——影响了《世界人权宣言》（1948）、《公民权利和政治权利国际公约》与《经济、社会及文化权利国际公约》（1966）以及国际刑事法院（2002）。他对自然科学的探索与他的形而上学思想，尤其是前批判时期（1747–1770）的思想，令人惊叹。康德首次阐述了时空与动量-能量的演化互易性，并提出了第一个自由场辐射的一般定律（1747）。他提出了三体问题的概念性解决方案，该问题在地球、月球与太阳的相互作用中显现（1754）。他第一个建构了详尽的演化宇宙论（1755）。他关于生物圈动力学的思想使他得以预测季风的节律与沿岸风的振荡（1755–1757）。他提出，物质的构成单元是能量泡（1756）——这一想法今天在超弦理论中以卡拉比-丘流形的形态仍有用处。
    step2: |-
      与其他划时代人物一样，康德参与塑造了世界文明的样貌，也参与塑造了我们今日构想世界的方式。他的实践理念——定言命令及其蕴含（1785）——滋养了《世界人权宣言》（1948）、两项国际人权公约（1966）与国际刑事法院（2002）。他对自然科学的探索、他的形而上学思想，尤其前批判时期（1747–1770）的，至今令人惊叹：他第一个说明了时空与动量-能量之间的演化互易性，并给出自由场辐射的首个一般定律（1747）；他提出了三体问题的概念性解法，该问题在地球、月球与太阳的交互中出现（1754）；他第一个构造出详尽的演化宇宙论（1755）；他关于生物圈动力学的洞见使他能够预测季风节律与沿岸风振荡（1755–1757）；他还提出物质的构成单元是能量泡（1756）——这一想法今天在超弦理论中以卡拉比-丘流形的形态仍然有用。
  - id: 3
    kind: body
    source: |-
      A number of recent findings have helped to shed more light on Kant’s philosophical development.
    step1: |-
      晚近若干发现有助于更清楚地阐明康德的哲学发展。
    step2: |-
      晚近的若干研究成果，使康德哲学发展的问题得到了更充分的说明。
  - id: 4
    kind: body
    source: |-
      First, in terms of science, it now appears that his metaphysics has withstood the test of time. While traditional scholars largely dismiss his holistic ontology prior to the *Critique*, innovations in the environmental and physical sciences have validated Kant’s claims as realistic insights in the workings of nature. His evolutionary theory of the universe is now seen as “the essence of modern models” in cosmology (Coles 2001: 240)[^coles-2001], and his natural philosophy is seen as the last milestone of western philosophy prior to its “comedown” to skepticism (Hawking 2003, 166)[^hawking-2003]. In light of climate change, it stands to reason that Kant’s grasp on biospherical dynamics and sustainable policies may well spur a philosophical return to Kant in the near future.
    step1: |-
      第一，就科学而言，如今看来他的形而上学经受住了时间的检验。尽管传统学者大多不取其《批判》之前的整体论本体论，但环境科学与物理科学的创新却证实了康德的种种主张，视之为对自然运行方式的现实洞见。他的宇宙演化论如今被视为宇宙论中“现代模型的精髓”（Coles 2001: 240）[^coles-2001]，他的自然哲学则被视为西方哲学“跌落”到怀疑论之前的最后一座里程碑（Hawking 2003, 166）[^hawking-2003]。鉴于气候变化，可以合理预期：康德对生物圈动力学与可持续政策的把握，很可能在不久的未来促动哲学重返康德。
    step2: |-
      第一，在科学方面，他的形而上学如今看来经得起时间考验。传统学者大体不取他《批判》以前的整体论本体论；然而环境科学与物理科学的进展却为康德的论断作了背书，视之为对自然运作的现实洞见。他的宇宙演化论今天被看作宇宙学中“现代模型的精髓”（Coles 2001: 240）[^coles-2001]；他的自然哲学则被誉为西方哲学在“跌落”为怀疑论之前的最后里程碑（Hawking 2003, 166）[^hawking-2003]。面对气候变化，有理由推断：康德对生物圈动力学与可持续政策的把握，很可能在不久的将来促成哲学界重返康德。
  - id: 5
    kind: body
    source: |-
      Second, in terms of religion, important recent scholarship indicates an ambivalence, if not dislike of Christianity—something that his early biographers, all of them Lutheran theologians, took pains to avoid revealing.[^note-2] Kant can be seen as defending pantheism, naturalism, evolution, cosmic expansion theory and holism, even when doing so was incompatible with an academic career.
    step1: |-
      第二，就宗教而言，晚近的重要研究显示出一种矛盾心理——若非厌恶的话——对基督教的不满；而他的早期传记作者都是路德宗神学家，他们竭力避免透露这一点。[^note-2] 可以说，康德在为泛神论、自然主义、演化论、宇宙膨胀论与整体论辩护，即便这样做与学术生涯不相容。
    step2: |-
      第二，在宗教方面，晚近的重要研究指出，康德对基督教抱有一种矛盾心态——或者说厌恶；而他早年的传记作者皆为新教神学家，都小心避免暴露这一点。[^note-2] 可以说，康德在替泛神论、自然主义、演化论、宇宙膨胀论与整体论说话，尽管这样做与学术前程并不相容。
  - id: 6
