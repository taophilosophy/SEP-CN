      [^note-5]: 批判期有一处怪异：康德说空间是一个力场（“充实”而非虚空）。早期康德认为，力把自身伸展为连续体，从而造出空间；晚期康德则说，组织经验的认知工具，是一个能量性、物质性、交互性织体的诸侧面——能量场维系着意识与认知，能量性空间是经验的终极条件。即便《纯粹理性批判》也含此类暗示，只是与全书的谨慎基调相抵（如谓认知条件是形式的而非物理的，或谓底层织体即自在之物、不可通达）。早期主张参《关于活力的真正估算的思考》#1–10（1:17–25）；晚期主张参《遗著》材料，尤《反思 3986》（17:376–7）、《八开本稿》（21:378–9, 383）、《过渡 1–14》（21:219, 223–4, 226–30, 233, 247, 535, 539, 547–8, 564–5, 588–9, 592）、《第 11 分册》（22:425–31, 440, 457），并参《第 1 分册》（21:87.29–31、21:101.5–12）。第一《批判》中的“充实证明”参 A211/B256–A214/B261；翔实的分析见 Edwards 2000: 13–47，尤 38–40；关于此本体论怪异之处的跨文化语境解读，参 Edwards & Schönfeld 2006。
