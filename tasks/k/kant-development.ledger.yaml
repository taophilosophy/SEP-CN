  - id: 13
    kind: body
    source: |-
      Immanuel Kant was born April 22, 1724 in Königsberg, East Prussia (now Kaliningrad, Russia), as the eldest son of Anna Regina Kant, née Reuter, (1697–1737) and Johann Georg Kant (1683–1746). The Reuters were shoe- and harness-makers; the Kants were harness-makers (*Riemer*, a guild similar to saddlers). Originally, the Reuters were from Nuremberg in Bavaria; the Kants were from not-too-distant Tilsit (now Sovietsk, Oblast Kaliningrad; Russia). The union of Kants and Reuters provided an initial economic, emotional and religious stability for Kant during his early years. His grandfather and father were competent businessmen, initially flourishing and respected in their strata of society. Anna was Lutheran and fit well into the like-minded Königsberg culture.
    step1: |-
      伊曼努尔·康德于 1724 年 4 月 22 日生于东普鲁士的哥尼斯堡（今俄罗斯加里宁格勒），是安娜·蕾吉娜·康德（娘家姓罗伊特，1697–1737）与约翰·格奥尔格·康德（1683–1746）的长子。罗伊特家是做鞋具与马具的；康德家则是马具匠（*Riemer*，一种与鞍匠相近的行会）。罗伊特家原籍巴伐利亚的纽伦堡；康德家则来自不太远的蒂尔西特（今俄罗斯加里宁格勒州苏维埃茨克）。康德家与罗伊特家的结合，在康德幼年为家庭提供了经济、情感与宗教上的初始稳定。他的祖父与父亲都是能干的生意人，起初在其社会阶层中兴旺而受敬重。安娜是路德宗信徒，与同气相求的哥尼斯堡文化十分契合。
    step2: |-
      伊曼努尔·康德 1724 年 4 月 22 日生于东普鲁士哥尼斯堡（今俄罗斯加里宁格勒），为安娜·蕾吉娜·康德（娘家姓罗伊特，1697–1737）与约翰·格奥尔格·康德（1683–1746）之长子。罗伊特一族制作鞋具与挽具，康德一族则为马具匠（*Riemer*，与鞍匠相近的行会）。罗伊特家原出巴伐利亚纽伦堡，康德家则自不算远的蒂尔西特（今俄罗斯加里宁格勒州苏维埃茨克）迁来。两家的结合，使康德幼年获得了经济、情感与宗教上的初步安稳。其祖父与父亲均为干练的商人，早年在各自阶层中兴旺且受敬重。安娜信奉路德宗，与气味相投的哥尼斯堡文化颇为融洽。
