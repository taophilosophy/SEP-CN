      The central thesis of Kant’s account of the uniqueness of mathematical reasoning is his claim that mathematical cognition derives from the “construction” of its concepts: “to **construct** a concept means to exhibit *a priori* the intuition corresponding to it” (A713/B741) (Friedman 1992, 2010; Shabel 2006)[^friedman-1992][^shabel-2006]. For example, while the concept <triangle> can be discursively defined as a rectilinear figure contained by three straight lines (as is done in Euclid’s *Elements*), the concept is *constructed*, in Kant’s technical sense of the term, only when a corresponding intuition is exhibited; in this case, the corresponding intuition is a singular and immediately evident representation of a three-sided figure. Kant argues that when one so renders a triangle for the purposes of performing the auxiliary constructive steps necessary for geometric proof, one does so *a priori*, whether the triangle is produced on paper or only in the imagination. This is because in neither case does the object displayed borrow its pattern from any experience (A713/B741). Moreover, one can derive universal truths about all triangles from such a singular display of an individual triangle since the particular determinations of the displayed object, e.g., the magnitude of its sides and angles, are “entirely indifferent” to the rendered triangle as an exhibition of the general concept <triangle> (A714/B742). Kant’s account must thus be defended against the commonly held position that universal truths *cannot* be derived from reasoning that depends on particular representations (Friedman 2012, 2020)[^friedman-2012]. Relatedly, the less than perfectly straight sides of an empirically rendered triangle are similarly “indifferent” to the general concept <triangle> and so such an empirical intuition is considered adequate for geometric proof. This raises questions about how one can be sure that an intuition adequately displays the content of a concept (Dunlop 2012)[^dunlop-2012]; the relation between pure and empirical intuition (Friedman 2012; Shabel 2003)[^friedman-2012][^shabel-2003]; and, in particular, which of the intuitively displayed features can safely be ignored (Friedman 2010, 2012)[^friedman-2010]. These features of Kant’s theory of construction also invite discussion about the acquisition conditions of mathematical concepts (Callanan 2014)[^callanan-2014]; the role of construction in indirect *reductio* proofs (Goodwin 2018)[^goodwin-2018]; the relation between construction and definition (Heis 2014, 2020; Nunez 2014)[^heis-2014][^nunez-2014]; and the role of imagination in construction (Land 2014)[^land-2014].
    step1: |-
      康德关于数学推理之独特性的说明，其核心论题是他的这一主张：数学认识源自其概念的“构造”：“**构造** 一个概念意味着先天地（*a priori*）展示与它相对应的直观”（A713/B741）（Friedman 1992, 2010; Shabel 2006）[^friedman-1992][^shabel-2006]。例如，〈三角形〉概念可以被推论地定义为由三条直线围住的直线形（如欧几里得（Euclid）在《几何原本》中所做的那样），但只有当与之对应的直观被展示出来时，这个概念才是被 **构造** 出来的（按康德对这一术语的技术性用法）；在这里，对应的直观是对一个三边形图形单一的、直接明证的表象。康德论证说，当一个人为了进行几何证明所必需的辅助性构造步骤而如此描绘一个三角形时，他这样做是先天的，无论这个三角形是被画在纸上，还是只在想象中产生。这是因为在这两种情形中，被展示的对象都不从任何经验借取它的图样（A713/B741）。此外，人们可以从对一个别三角形的这样一次单一展示中推导出关于所有三角形的普遍真理，因为被展示对象的那些特殊规定——例如其边与角的大小——对于作为普遍概念〈三角形〉之展示的被描绘三角形来说是“完全无所谓的”（A714/B742）。因此，康德的说明必须针对一种流行的立场来辩护，即普遍真理 **不能** 从依赖于特殊表象的推理中推导出来（Friedman 2012, 2020）[^friedman-2012]。与此相关，经验地描绘的三角形那不完全笔直的边，对普遍概念〈三角形〉来说同样是“无所谓的”，因此这样一种经验直观被认为足以用于几何证明。这就引出了几个问题：人们如何能确定一个直观充分地展示了一个概念的内容（Dunlop 2012）[^dunlop-2012]？纯粹直观与经验直观之间的关系是什么（Friedman 2012; Shabel 2003）[^friedman-2012][^shabel-2003]？以及尤其是，直观地展示出来的哪些特征可以被放心地忽略（Friedman 2010, 2012）[^friedman-2010]？康德构造理论的这些特点也引发了对如下问题的讨论：数学概念的获得条件（Callanan 2014）[^callanan-2014]；构造在间接反证（*reductio*）证明中的作用（Goodwin 2018）[^goodwin-2018]；构造与定义之间的关系（Heis 2014, 2020; Nunez 2014）[^heis-2014][^nunez-2014]；以及想象力在构造中的作用（Land 2014）[^land-2014]。
