      Kant claims further that the pure concept of magnitude is suitable for construction because, unlike other pure concepts, it does not represent a synthesis of *possible* intuitions, but “already contains a pure intuition in itself.” But since the only candidates for such “pure intuitions” are space and time (“the mere form of appearances”), it follows that only spatial and temporal magnitudes can be exhibited in pure intuition, i.e., constructed. Such spatial and temporal magnitudes can be exhibited qualitatively, by displaying the shapes of things, e.g. the rectangularity of the panes of a window, or they can be exhibited merely quantitatively, by displaying the number of parts of things, e.g., the number of panes that the window comprises. In either case, what is displayed counts as a pure and “formal intuition”, inspection of which yields judgments that “go beyond” the content of the original concept with which the intuition was associated. Such judgments are paradigmatically synthetic *a priori* judgments (to be discussed at greater length below) since they are ampliative truths that are warranted independent of experience (Shabel 2006)[^shabel-2006].
    step1: |-
      康德还主张，量的纯粹概念之所以适合构造，是因为它不像其他纯粹概念那样表象一种 **可能的** 直观的综合，而是“自身已经包含一种纯粹直观”。但是，由于这类“纯粹直观”的候选者只有空间与时间（“现象的单纯形式”），因此只有空间的与时间的量才能在纯粹直观中被展示，即被构造。这些空间与时间的量可以在质上得到展示——通过展示事物的形状，例如窗户玻璃格的矩形；也可以只在量上得到展示——通过展示事物部分的数量，例如窗户所包含的玻璃格数目。无论哪种情形，被展示出来的东西都算作一种纯粹的“形式的直观”，对它的检视产生那些“超出”与该直观相关联的原初概念之内容的判断。这类判断是典型的先天综合判断（下文将更详细地讨论），因为它们是独立于经验而获得辩护的扩展性真理（Shabel 2006）[^shabel-2006]。
    step2: |-
      康德进一步主张：量的纯粹概念之所以适合构造，是因为它不像其他纯粹概念那样表象一种 **可能的** 直观之综合，而是“自身已经包含一种纯粹直观”。但既然这类“纯粹直观”的候选者只有空间与时间（“现象的单纯形式”），结论便是：只有空间与时间上的量才能在纯粹直观中被展示，亦即被构造。这些空间与时间的量，可以在质上得到展示——呈现事物的形状，例如窗户玻璃格的矩形；也可以只在量上得到展示——呈现事物部分的数量，例如窗户含有多少块玻璃格。无论哪种情形，被展示的东西都算作一种纯粹的“形式的直观”；对它的检视产生出一些“超出”原初概念内容的判断，而这些原初概念正是该直观所系的概念。这类判断是典型的先天综合判断（下文将更详细讨论），因为它们是扩展性的真理，其辩护独立于经验（Shabel 2006）[^shabel-2006]。
