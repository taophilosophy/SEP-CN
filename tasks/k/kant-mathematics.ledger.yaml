      The interpretive debate over how to understand Kant’s view of the role of intuition in mathematical reasoning has had the strongest influence on the shape of scholarship in Kant’s philosophy of mathematics; this debate is directly related to the question (described above) of the syntheticity of mathematical axioms, theorems and inferences. In his general discussion of mental representation, Kant implies that immediacy and singularity are both criteria of non-conceptual, intuitive representation, the species of representation that grounds synthetic judgment. In a series of papers, Charles Parsons (Parsons 1964, 1969, 1984)[^parsons-1964] has argued that the syntheticity of mathematical judgments depends on mathematical intuitions being fundamentally immediate, and he explains the immediacy of such representations in a perceptual way, as a direct, phenomenological presence to the mind. Jaakko Hintikka (Hintikka 1965, 1967, 1969)[^hintikka-1965], developing an idea from E.W. Beth’s earlier work, counters that the syntheticity of mathematical judgments instead depends only on the singularity of their intuitive constituents. Hintikka assimilates mathematical intuitions to singular terms or particulars, and explains the use of intuition in a mathematical context by analogy to an application of the logical rule of existential instantiation. These two positions have come to be known as the “phenomenological” and “logical” interpretations, respectively.
    step1: |-
      围绕如何理解康德关于直观在数学推理中之作用的观点，这场解释论之争对康德数学哲学研究的格局影响最大；这场论战与（上文所述的）数学公理、定理与推理之综合性的问题直接相关。康德在他对心灵表象的一般讨论中暗示，直接性与单一性都是非概念的直观表象的判准，这种表象是奠定综合判断的那类表象。查尔斯·帕森斯（Parsons 1964, 1969, 1984）[^parsons-1964] 在一系列论文中论证，数学判断的综合性依赖于数学直观在根本上是直接的，并且他以知觉的方式解释这类表象的直接性，即作为对心灵的一种直接的、现象学的在场。雅科·欣提卡（Hintikka 1965, 1967, 1969）[^hintikka-1965] 发展了 E.W. 贝特（E.W. Beth）早期著作中的一个想法，他反驳说，数学判断的综合性恰恰只依赖于其直观构成成分的单一性。欣提卡把数学直观同化于单称词项或殊项，并通过类比于存在例示这一逻辑规则的一次应用来解释直观在数学语境中的使用。这两种立场分别被称为“现象学的”解释与“逻辑的”解释。
    step2: |-
      围绕如何理解康德关于直观在数学推理中之作用的观点，解释论上的这场争辩对康德数学哲学研究的格局影响最大；它与上文所述的问题——数学公理、定理与推理是否综合——直接相关。康德在关于心灵表象的一般讨论中暗示：直接性与单一性都是非概念直观表象的判准，而这种表象正是奠定综合判断的那类表象。查尔斯·帕森斯（Parsons 1964, 1969, 1984）[^parsons-1964] 在一系列论文中论证：数学判断的综合性，依赖数学直观在根本上是直接的；他又以知觉化的方式解释这类表象的直接性——直观就是向心灵直接地、现象学地在场。雅科·欣提卡（Hintikka 1965, 1967, 1969）[^hintikka-1965] 发展了 E.W. 贝特（E.W. Beth）早期著作中的一个想法，反驳道：数学判断的综合性其实只依赖其直观构成成分的单一性。欣提卡把数学直观比作单称词项或殊项，并把直观在数学语境中的使用解释为对“存在例示”这条逻辑规则的一次应用的类比。这两种立场后来分别以“现象学的”解释与“逻辑的”解释知名。
