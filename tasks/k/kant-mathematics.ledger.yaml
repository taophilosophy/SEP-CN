      While Kant’s theory of mathematical concept construction can be thought of as providing an explanation of mathematical practice as Kant understood it[^note-2], the theory is intertwined with Kant’s broader commitments to strict distinctions between intuitions and concepts, as modes of representation (Smyth 2014)[^smyth-2014]; between synthetic and analytic judgments (Anderson 2004, 2015; Hogan 2020)[^anderson-2004][^hogan-2020]; between the roles of different cognitive faculties (Land 2014; Laywine 2014)[^land-2014][^laywine-2014]; and between *a priori* and *a posteriori* evidence and reasoning (Anderson 2015)[^anderson-2015]. Ultimately, the picture of mathematics developed in the “Discipline of Pure Reason in Dogmatic Use” depends on the full theory of judgment that the Critical philosophy aims to provide, and crucially on the theory of sensibility that Kant offers in The Transcendental Aesthetic (Parsons 1992; Carson 1997; Risjord 1991)[^carson-1997][^parsons-1992][^risjord-1991], as well as in corresponding passages in the *Prolegomena*’s Main Transcendental Question, First Part, where he investigates the “origin” of the pure sensible concepts of mathematics, and the “scope of their validity” (A725/B753).[^note-3]
    step1: |-
      虽然康德的数学概念构造理论可以被视为对康德所理解的数学实践提供了一种解释[^note-2]，但这一理论与康德更广泛的承诺交织在一起，即坚持若干严格的区分：作为表象模式的直观与概念之间的区分（Smyth 2014）[^smyth-2014]；综合判断与分析判断之间的区分（Anderson 2004, 2015; Hogan 2020）[^anderson-2004][^hogan-2020]；不同认识官能的角色之间的区分（Land 2014; Laywine 2014）[^land-2014][^laywine-2014]；以及先天的（*a priori*）与后天的（*a posteriori*）证据和推理之间的区分（Anderson 2015）[^anderson-2015]。归根结底，“独断运用中的纯粹理性训练”一节所发展出的数学图景，依赖于批判哲学旨在提供的完整的判断理论，并且关键地依赖于康德在先验感性论中提出的感性理论（Parsons 1992; Carson 1997; Risjord 1991）[^carson-1997][^parsons-1992][^risjord-1991]，也依赖于《未来形而上学导论》“先验的主要问题”第一部分中的相应段落，在那里他考察了数学的纯粹感性概念的“来源”及其“有效性范围”（A725/B753）[^note-3]。
