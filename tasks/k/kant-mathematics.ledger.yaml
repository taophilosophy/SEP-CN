      Finally, in the Analytic of Principles, Kant derives the synthetic judgments that “flow *a priori* from pure concepts of the understanding” and which ground all other *a priori* cognitions, including those of mathematics (A136/B175). The principles of pure understanding that are associated with the categories of quantity (i.e., unity, plurality and totality) are the Axioms of Intuition. Whereas mathematical principles proper are “drawn only from intuition” and so do not constitute any part of the system of principles of pure understanding, the explanation for the possibility of such mathematical principles (outlined above) must be supplemented by an account of the highest possible transcendental principles (A148–9/B188–9) (Shabel 2017)[^shabel-2017]. Accordingly, the Axioms of Intuition provide a meta-principle, or principle *of* the mathematical principles of quantity, namely that “All intuitions are extensive magnitudes” (A161/B202). Most commentators interpret Kant here to be indicating why the principles of mathematics, which have to do with pure space and time, are applicable to the appearances: the appearances can only be represented “through the same synthesis as that through which space and time in general are determined” (A161/B202). So, *all* intuitions, whether pure or empirical, are “extensive magnitudes” that are governed by the principles of mathematics. (For an alternative view of the Axioms, see Sutherland 2005b)[^sutherland-2005b].
    step1: |-
      最后，在原理分析论中，康德推导出那些“从知性的纯粹概念先天流出（*a priori*）”的综合判断，它们为一切其他先天的认识——包括数学的认识——奠定基础（A136/B175）。与量的范畴（即单一性、多数性与全体性）相关联的纯粹知性原则是直观的公理。恰当意义上的数学原则“仅仅取自直观”，因而不构成纯粹知性原则体系的任何部分；但是，这类数学原则之可能性的说明（上文已概述）必须由对最高可能的先验原则的说明来补充（A148–9/B188–9）（Shabel 2017）[^shabel-2017]。据此，直观的公理提供了一个元原则，或者说量的数学原则 **之** 原则，即“一切直观都是广延的量”（A161/B202）。多数评注者把康德在这里的意思解读为：他在指明与纯粹空间和时间有关的数学原则为何适用于现象——现象只能“通过空间与时间一般得以被规定的同一种综合”被表象（A161/B202）。这样，**一切** 直观，无论纯粹的还是经验的，都是受数学原则支配的“广延的量”。（关于公理的另一种观点，见 Sutherland 2005b）[^sutherland-2005b]。
    step2: |-
      最后，在原理分析论中，康德推导出那些“从知性的纯粹概念先天涌流（*a priori*）”的综合判断；它们为其他一切先天认识奠定基础，数学的认识也包括在内（A136/B175）。与量的范畴（即单一性、多数性与全体性）相关联的纯粹知性原则，就是直观的公理。恰当意义上的数学原则“仅仅取自直观”，因而不是纯粹知性原则体系的组成部分；但这类数学原则何以可能（上文已概述），还须由对最高可能先验原则的说明来补充（A148–9/B188–9）（Shabel 2017）[^shabel-2017]。据此，直观的公理提供了一条元原则——即量的数学原则 **之** 原则——“一切直观都是广延的量”（A161/B202）。多数评注者把康德在这里的话解读为：他在指明，与纯粹空间和时间打交道的数学原则为何能适用于现象——因为现象只能“通过空间与时间一般得以规定的同一种综合”而被表象（A161/B202）。于是，**一切** 直观，无论纯粹的还是经验的，都是受数学原则支配的“广延的量”。（关于这几条公理的另一种看法，见 Sutherland 2005b）[^sutherland-2005b]。
