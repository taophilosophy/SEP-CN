      在这里，康德著名地援引了算术命题“7 + 5 = 12”，并论证这类判断是综合的。他从反面论证，主张“无论我多么长久地分析我的这样一个可能的总和［七与五之和］的概念，我也不会在其中找到十二”；又从正面论证，主张“必须超出这两个概念［七与五］，在与二者之一相对应的直观中寻求援助，比如说自己的五根手指……把直观中所给予的五的单位一个接一个地加到七的概念上……从而看到 12 这个数产生出来”（B15）。他认为由此可以推出：像“7 + 5 = 12”这样的算术命题的必然真理，不能通过任何逻辑分析或概念分析的方法来确立（Anderson 2004, 2015）[^anderson-2004]，但 **能够** 通过直观的综合来确立（Parsons 1969）[^parsons-1969]。近来，关于康德算术理论的讨论已经把焦点从算术判断的综合性与先天性问题转移到对康德数的说明的研究上。这里出现的话题包括：序数性与基数性（Sutherland 2017, 2020）[^sutherland-2017]；实数（Tait 2020; van Atten 2012）[^tait-2020][^atten-2012]；有穷主义（Tait 2016; Sieg 2016）[^sieg-2016][^tait-2016]；无穷与无穷小（Brittan 2020; Smyth 2014, 2021; Warren 2020）[^brittan-2020][^smyth-2014][^warren-2020]；以及数的概念在康德关于经验可能性的构想中的核心地位（Carson 2020）[^carson-2020]。
