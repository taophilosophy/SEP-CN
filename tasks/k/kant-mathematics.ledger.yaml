      关注康德数学哲学中的这一解释问题至关重要，因为它照亮了一个更一般的问题：是什么使得先天的（*a priori*）综合认识成为可能——这正是康德《纯粹理性批判》的中心问题。就这个更一般的问题而言，重要的是区分康德对“分析的”与“综合的”这两个术语的两种用法：一种用法标记判断类型之间的一种逻辑-语义区分——康德用它来捍卫数学认识是先天综合的这一独特论题；另一种用法标记一个传统的数学区分，即分析方法与综合 **方法** 之间的区分。他部署后一种区分，是为了辨明回答“纯粹数学之可能性”问题的两种不同的论证策略。分析方法的特征在于这样的推理：把一个被给予的知识体——例如数学——追溯到它在心灵中的起源或源泉。相比之下，综合方法旨在直接从这类原初的认知源泉导出实在的认识；这些源泉或能力首先被独立于任何特定知识体（包括数学）地加以阐明，尽管这些能力最终可能产生这些知识体。康德在《未来形而上学导论》中采取前一种方法，从数学判断的综合性和先天性质出发，论证空间与时间是人类感性的形式；他在《纯粹理性批判》中采取后一种方法，论证人类感性的形式——空间与时间——提供了推导出综合的且先天的数学判断的基础（Shabel 2004）[^shabel-2004]。这些论证，连同他对一切数学判断之综合性与先天性质的说明的细节，为数学的可能性问题提供了一个回答：产生数学科学那些典型的综合的且先天的判断的种种实践，植根于人类感性的本性并由之得到解释，尤其是由人类经验的一切对象（且仅是人类经验的对象）的时空形式得到解释（Van Cleve 1999）[^cleve-1999]。但是，这个回答又引出进一步的问题，尤其是如何区分空间的形而上学表象与几何学表象（Carson 1997; Friedman 2000, 2015, 2020; Onof and Schulting 2014; Tolley 2016）[^carson-1997][^friedman-2000][^onof-2014][^tolley-2016]。
