      Here Kant famously invokes the arithmetical proposition “7 + 5 = 12” and argues that such a judgment is synthetic. He argues negatively, claiming that “no matter how long I analyze my concept of such a possible sum [of seven and five] I will still not find twelve in it”, and also positively, claiming that “One must go beyond these concepts [of seven and five], seeking assistance in the intuition that corresponds to one of the two, one’s five fingers, say…and one after another add the units of the five given in the intuition to the concept of seven…and thus see the number 12 arise” (B15). He takes it to follow that the necessary truth of an arithmetic proposition such as “7 + 5 = 12” cannot be established by any method of logical or conceptual analysis (Anderson 2004, 2015)[^anderson-2004], but *can* be established by intuitive synthesis (Parsons 1969)[^parsons-1969]. Recently, discussions of Kant’s theory of arithmetic have shifted focus from questions about the syntheticity and apriority of arithmetic judgments to investigations into Kant’s account of number. Topics that arise here include ordinality and cardinality (Sutherland 2017, 2020)[^sutherland-2017]; real numbers (Tait 2020; van Atten 2012)[^tait-2020][^atten-2012]; finitism (Tait 2016; Sieg 2016)[^sieg-2016][^tait-2016]; infinity and infinitesmals (Brittan 2020; Smyth 2014, 2021; Warren 2020)[^brittan-2020][^smyth-2014][^warren-2020]; and the centrality of the concept of number in Kant’s conception of the possibility of experience (Carson 2020)[^carson-2020].
