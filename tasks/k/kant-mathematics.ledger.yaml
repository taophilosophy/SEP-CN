      Kant follows his discussion of arithmetic reasoning and truth with corresponding claims about Euclidean geometry, according to which the principles of geometry express synthetic relations between concepts (such as between the concept of the straight line between two points and the concept of the shortest line between those same two points), neither of which can be analytically “extracted” from the other. The principles of geometry thus express relations among basic geometric concepts inasmuch as these can be “exhibited in intuition” (Shabel 2003; Sutherland 2005a)[^shabel-2003][^sutherland-2005a]. Elsewhere, Kant also includes geometric *theorems* as the sorts of propositions (in addition to geometric principles) that count as synthetic, and offers thoughts about geometric proof (A716–7/B744–5) (Friedman 1992, 2010; Shabel 2004)[^friedman-1992][^shabel-2004]. One way to understand the syntheticity of geometric theorems is by recognizing an indispensable diagrammatic role for intuitions in geometric proof (Shabel 2004, 2004)[^shabel-2004].
    step1: |-
      康德在讨论完算术推理与算术真理之后，转而提出关于欧几里得几何的相应主张：几何的原则表达概念之间的综合关系（例如两点之间直线这个概念与同样这两点之间最短线这个概念之间的关系），两个概念中没有一个能够从另一个中被分析地“抽取”出来。因此，几何的原则表达基本几何概念之间的关系，只要这些概念能够“在直观中被展示”（Shabel 2003; Sutherland 2005a）[^shabel-2003][^sutherland-2005a]。在别处，康德还把几何的 **定理**（除几何原则之外）也归入算作综合的那类命题，并对几何证明提出了若干想法（A716–7/B744–5）（Friedman 1992, 2010; Shabel 2004）[^friedman-1992][^shabel-2004]。理解几何定理之综合性的一条途径，是承认直观在几何证明中扮演一种不可或缺的图形角色（Shabel 2004, 2004）[^shabel-2004]。
    step2: |-
      康德讨论完算术推理与算术真理，接着对欧几里得几何提出相应的主张：几何的原则表达的是概念之间的综合关系——例如“两点之间的直线”这一概念与“同样这两点之间的最短线”这一概念之间的关系——而且任何一个概念都不能从另一个概念中被分析地“抽取”出来。就此而言，几何的原则所表达的，乃是诸基本几何概念之间的关系；这些概念则必须能“在直观中被展示”（Shabel 2003; Sutherland 2005a）[^shabel-2003][^sutherland-2005a]。在别处，康德还把几何 **定理**（与几何原则并列）也归入可算作综合的命题，并对几何证明提出了自己的思考（A716–7/B744–5）（Friedman 1992, 2010; Shabel 2004）[^friedman-1992][^shabel-2004]。要理解几何定理何以是综合的，一条途径是承认：直观在几何证明中扮演着不可或缺的图形角色（Shabel 2004, 2004）[^shabel-2004]。
