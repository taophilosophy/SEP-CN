      分析传统中关于康德数学哲学的英语学术研究（本文的关注焦点）受到三种来源的影响最为强烈：一是雅科·欣提卡（Jaakko Hintikka）与查尔斯·帕森斯（Charles Parsons）之间围绕康德关于直观在数学中的作用的观点的持久论战，它引出了如今被称为“逻辑的”解释与“现象学的”解释的两种进路；二是迈克尔·弗里德曼（Michael Friedman）的开创性著作《康德与精密科学》（*Kant and the Exact Sciences*）（Friedman 1992）[^friedman-1992]，以及他如今已成为经典的文章《康德的几何学理论》与《康德及其后继者中的几何学、构造与直观》（Friedman 1985, 2000）[^friedman-1985]；三是卡尔·波西（Carl Posy）的文集《康德的数学哲学：现代论文》（*Kant's Philosophy of Mathematics: Modern Essays*）所收录的论文（其中包括欣提卡、帕森斯与弗里德曼的贡献，以及斯蒂芬·巴克（Stephen Barker）、戈登·布里坦（Gordon Brittan）、威廉·哈珀（William Harper）、菲利普·基切尔（Philip Kitcher）、阿瑟·梅尔尼克（Arthur Melnick）、卡尔·波西（Carl Posy）、曼利·汤普森（Manley Thompson）与 J. 迈克尔·扬（J. Michael Young）的贡献；这些论文全部发表于二十五年以前（Posy 1992）[^posy-1992]。）
