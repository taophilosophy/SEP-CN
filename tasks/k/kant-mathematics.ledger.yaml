      In the Schematism, Kant undertakes to identify the particular mechanism that enables the pure concepts of the understanding to subsume sensible intuitions, with which they are heterogeneous. The categories must be “schematized” because their non-empirical origin in pure understanding prevents their having the sort of sensible content that would connect them immediately to the objects of experience; transcendental schemata are mediating representations that are meant to establish the connection between pure concepts and appearances in a rule-governed way. Mathematical concepts are discussed in this context since they are unique in being pure but also sensible concepts: they are pure because they are strictly *a priori* in origin, and yet they are sensible since they are constructed *in concreto*. (Kant further complicates this issue by identifying number as the pure schema of the category of magnitude (Longuenesse 1998)[^longuenesse-1998].) There arises an interpretive question as to whether mathematical concepts, whose conceptual content is given sensibly, require schematization by a distinguishable “third thing”, and, if so, what it amounts to (Leavitt 1991; Young 1984)[^leavitt-1991][^young-1984]. More broadly, the question arises as to how the transcendental imagination, the faculty responsible for schematism, operates in mathematical contexts (Domski 2010)[^domski-2010][^domski-2010-2].
    step1: |-
      在图型论中，康德着手辨明那种特殊机制，它使知性的纯粹概念能够把感性直观归摄于其下——尽管纯粹概念与感性直观是异质的。范畴必须被“图型化”，因为它们在纯粹知性中的非经验来源使它们不可能具有那种能把它们直接与经验对象连接起来的感性内容；先验图型是中介性的表象，旨在以受规则支配的方式建立纯粹概念与现象之间的联结。数学概念在这个语境中得到讨论，因为它们独一无二地既是纯粹概念又是感性概念：说它们纯粹，是因为它们的来源严格地是先天的（*a priori*）；说它们感性，则是因为它们在具体中（*in concreto*）被构造。（康德还通过把数认定为量范畴的纯粹图型而使这个问题更加复杂（Longuenesse 1998）[^longuenesse-1998]。）由此产生一个解释问题：概念内容被感性地给予的数学概念，是否需要由一个可辨识的“第三者”来图型化？如果需要，这个第三者又是什么（Leavitt 1991; Young 1984）[^leavitt-1991][^young-1984]？更宽泛地说，还产生了这样一个问题：作为图型论之担当者的先验想象力，如何在数学语境中运作（Domski 2010）[^domski-2010][^domski-2010-2]。
    step2: |-
      在图型论中，康德着手辨明一种特殊机制：知性的纯粹概念与感性直观是异质的，正是这种机制使纯粹概念得以把感性直观归摄于自身之下。范畴必须被“图型化”，因为它们源于纯粹的知性而非经验，因而不可能具有那种能把它们直接连到经验对象上的感性内容；先验图型则是一些中介性表象，旨在以受规则支配的方式建立纯粹概念与现象之间的联结。数学概念正是在这里得到讨论，因为它们独一无二：既是纯粹概念，又是感性概念——说它们纯粹，是因为其来源严格地是先天的（*a priori*）；说它们感性，则是因为它们在具体中（*in concreto*）被构造。（康德还把数认定为量范畴的纯粹图型，这使问题更加复杂（Longuenesse 1998）[^longuenesse-1998]。）由此产生一个解释问题：数学概念的概念内容是感性地给予的，它们是否还需要一个可辨识的“第三者”来加以图型化？如果需要，这个“第三者”又是什么（Leavitt 1991; Young 1984）[^leavitt-1991][^young-1984]？更宽泛地说，还产生另一个问题：负责图型论的先验想象力，在数学语境中如何运作（Domski 2010）[^domski-2010][^domski-2010-2]。
