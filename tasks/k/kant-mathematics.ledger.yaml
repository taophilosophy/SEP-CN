      Notably, the scope of Kant’s claim that geometric theorems are synthetic is not transparent. Having denied that the *principles* (Grundsätze) could be cognized analytically from the principle of contradiction, he admits that mathematical inference of the kind needed to establish geometric *theorems* does proceed “in accordance with the principle of contradiction”, and also that “a synthetic proposition can of course be comprehended in accordance with the principle of contradiction” though “only insofar as another synthetic proposition is presupposed from which it can be deduced, never in itself” (B14). So, while he is clear that all mathematical judgments, including geometric theorems, are synthetic, he is less clear about exactly what it means for such propositions or the inferences that support them to “accord with” the principle of contradiction, derivability from which he takes to be the paradigm test of *analyticity* (Hogan 2020)[^hogan-2020]. This leads to an interpretive disagreement as to whether demonstrable mathematical judgments follow from the synthetic principles via strictly logical or conceptual inference—and so in strict accordance with *only* the principle of contradiction—or whether they are deduced via inferences that are themselves reliant on intuition, but which do not violate the law of contradiction. There is thus disagreement over whether Kant is committed merely to the syntheticity of the axioms of mathematics (which transmit syntheticity to demonstrable theorems via logical inference), or is also committed to the syntheticity of mathematical inference itself. The former interpretive position is originally associated with Ernst Cassirer and Lewis White Beck; the latter position with Bertrand Russell (Hogan 2020)[^hogan-2020]. Gordon Brittan (Brittan 2006)[^brittan-2006] conceives both such positions “evidentialist”, which is his label for any interpretation according to which intuitions provide indispensable evidence for the truth of mathematics, whether that evidence is provided in support of axioms or inferences, or both (Brittan 2006)[^brittan-2006].
    step1: |-
      值得注意的是，康德关于几何定理是综合的这一主张，其适用范围并不清楚。他否定了 **原则**（Grundsätze）能够从矛盾原则出发被分析地认识，但他承认，确立几何 **定理** 所需要的那类数学推理确实“依照矛盾原则”进行，而且还承认“一个综合命题当然可以依照矛盾原则被理解”，尽管“只有在预设了另一个可以从中把它演绎出来的综合命题时才行，绝不是就其自身而言”（B14）。所以，尽管他清楚地表明包括几何定理在内的一切数学判断都是综合的，但对于这类命题或支持它们的推理“与矛盾原则相一致”究竟意味着什么，他就不那么清楚了；在他看来，能否从矛盾原则推导出来，是 **分析性** 的典型检验（Hogan 2020）[^hogan-2020]。由此产生了一个解释上的分歧：可演证的数学判断究竟是经由严格的逻辑推理或概念推理从综合原则中推出——因而严格地只与矛盾原则相一致——还是经由那些自身依赖于直观却不违反矛盾律的推理被演绎出来。因此，分歧还在于：康德是只承诺数学公理的综合性质（公理经由逻辑推理把综合性传递给可演证的定理），还是也承诺数学推理本身具有综合性。前一种解释立场最初与恩斯特·卡西尔（Ernst Cassirer）和刘易斯·怀特·贝克（Lewis White Beck）相联系；后一种立场与伯特兰·罗素（Bertrand Russell）相联系（Hogan 2020）[^hogan-2020]。戈登·布里坦（Gordon Brittan）（Brittan 2006）[^brittan-2006]把这两种立场都构想为“证据主义的”（evidentialist），这是他给任何一种解释贴的标签：按照这种解释，直观为数学的真理提供不可或缺的证据，无论这种证据是支持公理还是支持推理，还是二者都支持（Brittan 2006）[^brittan-2006]。
    step2: |-
      值得注意的是，康德主张几何定理是综合的，但这一主张的适用范围并不明晰。他否认 **原则**（Grundsätze）能从矛盾原则出发得到分析的认识；但他又承认，确立几何 **定理** 所需要的那类数学推理确实“依照矛盾原则”进行，甚至承认“一个综合命题当然可以依照矛盾原则得到理解”——尽管“只有在预设另一个综合命题、并能从中把它演绎出来的限度内才行，绝不是就其自身而言”（B14）。这样，他虽然明白无误地主张一切数学判断（包括几何定理）都是综合的，但对于这类命题以及支持它们的推理“依照”矛盾原则究竟意味着什么，他就说得没那么清楚了；在他看来，能否从矛盾原则推导出来，正是 **分析性** 的范型判准（Hogan 2020）[^hogan-2020]。这就导致一个解释上的分歧：可演证的数学判断，究竟是经由严格的逻辑或概念推理从综合原则推出——因而严格地只与矛盾原则相一致——还是经由本身依赖直观却不违反矛盾律的推理演绎出来？于是又有进一步的分歧：康德是只承诺数学公理是综合的（公理经由逻辑推理把综合性传递给可演证的定理），还是也承诺数学推理本身就是综合的？前一种解释立场最初系于恩斯特·卡西尔（Ernst Cassirer）与刘易斯·怀特·贝克（Lewis White Beck）；后一种立场系于伯特兰·罗素（Bertrand Russell）（Hogan 2020）[^hogan-2020]。戈登·布里坦（Gordon Brittan）则把这两种立场都视为“证据主义的”（evidentialist）（Brittan 2006）[^brittan-2006]：这是他给任何一种解释贴的标签——按照这种解释，直观为数学真理提供不可或缺的证据，无论证据是支持公理、支持推理，还是两者都支持（Brittan 2006）[^brittan-2006]。
