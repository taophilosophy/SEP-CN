      Kant asks two related leading questions of his critical philosophy: (1) How are synthetic judgments *a priori* possible?; and, (2) How is metaphysics possible as a science (B19; B23)? Mathematics provides a special avenue for helping to answer these questions by providing a model of a codified scientific discipline the possibility of which is clear and, moreover, guaranteed by its own achievement of cognition that is both synthetic and *a priori* (Anderson 2015)[^anderson-2015]. In other words, an explanation of how synthetic *a priori* judgments are affirmed in mathematical contexts, together with the resulting and related explanation of how a systematic body of demonstrable knowledge comprises such judgments, allow mathematical truth to be invoked as a paradigm of the substantive yet necessary and universal truths that metaphysics hopes to achieve. Kant’s theory of mathematical concept construction (discussed above) can only be fully appreciated in conjunction with his treatment of such broader questions about the very nature and possibility of mathematical and metaphysical knowledge (Jauernig 2013)[^jauernig-2013].
    step1: |-
      康德向其批判哲学提出两个相互关联的引导性问题：（1）综合判断如何可能是先天的（*a priori*）？（2）形而上学如何可能作为一门科学（B19; B23）？数学为帮助回答这些问题提供了一条特别的途径：它提供了一个已被编纂成体系的科学学科的范型，这一学科的可能性是清楚的，而且更进一步，是由它自己在认识上既综合又先天的成就所保证的（Anderson 2015）[^anderson-2015]。换言之，说明先天综合判断如何在数学语境中得到确认，再加上随之而来的、对可演证的知识体系如何包含这类判断的相关说明，就使得人们可以援引数学真理，作为形而上学所希望达成的那些实体的却又是必然的、普遍的真理的范型。康德的数学概念构造理论（上文已讨论）只有与他对这些更广泛问题的处理——即关于数学知识与形而上学知识的本性及其可能性的问题——结合起来，才能得到充分的理解（Jauernig 2013）[^jauernig-2013]。
