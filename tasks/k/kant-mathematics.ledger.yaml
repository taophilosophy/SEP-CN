      English language scholarship in the analytic tradition on Kant’s philosophy of mathematics (the focus of this article) has been influenced most strongly by an enduring debate between Jaakko Hintikka and Charles Parsons over Kant’s view of the role of intuition in mathematics, leading to what have come to be known as the “logical” and “phenomenological” interpretations; by Michael Friedman’s seminal book, *Kant and the Exact Sciences* (Friedman 1992)[^friedman-1992], as well as his now classic articles “Kant’s Theory of Geometry” and “Geometry, Construction and Intuition in Kant and his Successors” (Friedman 1985, 2000)[^friedman-1985]; and by the papers collected in Carl Posy’s volume *Kant*’*s Philosophy of Mathematics: Modern Essays* (which includes contributions by Hintikka, Parsons and Friedman, as well as by Stephen Barker, Gordon Brittan, William Harper, Philip Kitcher, Arthur Melnick, Carl Posy, Manley Thompson, and J.Michael Young, all of which were published more than twenty five years ago (Posy 1992)[^posy-1992].)
