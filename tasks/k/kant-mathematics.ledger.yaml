      迈克尔·弗里德曼关于直观在数学推理中之作用的原本立场（Friedman 1985, 1992）[^friedman-1985]，承自贝特与欣提卡，但实质上不同于两家，而且在他晚近的著作中已有修正。在《康德与精密科学》（Friedman 1992）[^friedman-1992] 中，弗里德曼主张：我们现代的逻辑观应当用作解释康德的工具，而不是批评康德的工具。他指出，现代量化理论的多原子逻辑能对无穷多的数学对象给出显式表象；这种表象在概念上是康德时代的数学家与逻辑学家无法企及的。一元逻辑不足以表象无穷多的对象；正因为这一点，十八世纪的数学家要靠直观来提供数学推理所必需的表象。弗里德曼正是基于这一历史洞见，阐明了康德数学哲学的种种细节。
