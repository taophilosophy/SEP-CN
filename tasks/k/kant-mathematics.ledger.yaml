      Friedman has modified his original position in response to criticism from Emily Carson (Carson 1997)[^carson-1997], who has developed an interpretation of Kant’s theory of geometry that is Parsonsian in its anti-formalist emphasis on the epistemological and phenomenological over the logical role for intuition in mathematics. In recent work (Friedman 2000, 2010)[^friedman-2000], Friedman argues that the intuition that grounds geometry is fundamentally kinematical, and is best explained by the translations and rotations that describe both the constructive action of the Euclidean geometer and the perceptual point of view of the ordinary, spatially oriented observer. This account provides a synthesis between the logical and phenomenological interpretive accounts, in large part by connecting the geometrical space that is explored by the imagination via Euclidean constructions to the perspectival space that is, according to Kant, the form of all outer sensibility. More specifically, Friedman reconciles the logical interpretation with the phenomenological by “[embedding] the purely logical understanding of geometrical constructions (as Skolem functions) within space as the pure form of our outer sensible intuition (as described in the Transcendental Aesthetic)” (Friedman 2012, n.17)[^friedman-2012]. Additionally, Friedman has argued against diagrammatic interpretations of Kantian intuition (Friedman 2012)[^friedman-2012] and has marshalled evidence from the B-Deduction to support his understanding of the connections among geometrical construction, the space of perception, and physical space (Friedman 2020)[^friedman-2020], and the relation between geometry and experience (Friedman 2015)[^friedman-2015].
    step1: |-
      弗里德曼已回应埃米莉·卡森（Emily Carson）（Carson 1997）[^carson-1997] 的批评而修改了他的原本立场；卡森发展出一种对康德几何学理论的解释，其反形式主义的立场强调直观在数学中的认识论角色与现象学角色胜过逻辑角色，在这点上它是帕森斯式的。在晚近著作中（Friedman 2000, 2010）[^friedman-2000]，弗里德曼论证，为几何学奠基的直观在根本上是运动学的，最好由平移与旋转来解释——它们既描述欧几里得几何学家的构造行动，也描述普通的、有空间定向的观察者的知觉观点。这一说明为逻辑的解释与现象学的解释提供了一种综合，在很大程度上靠的是把想象力经由欧几里得构造所探究的几何空间，连接到按康德的观点构成一切外感官之形式的那种透视空间。更具体地说，弗里德曼通过“把对几何构造的纯粹逻辑理解（作为斯科伦函数）嵌入作为我们外感性直观之纯粹形式的空间（如先验感性论所描述的那样）”来调和逻辑的解释与现象学的解释（Friedman 2012, n.17）[^friedman-2012]。此外，弗里德曼还论证反对对康德直观的图形化解释（Friedman 2012）[^friedman-2012]，并汇集了来自 B 版演绎的证据来支持他关于几何构造、知觉空间与物理空间之间联系的理解（Friedman 2020）[^friedman-2020]，以及几何学与经验之间关系的理解（Friedman 2015）[^friedman-2015]。
    step2: |-
      弗里德曼随后因埃米莉·卡森（Emily Carson）的批评（Carson 1997）[^carson-1997] 而修正了原本立场。卡森对康德几何理论发展出一种解释：它反对形式主义，强调直观在数学中的认识论与现象学角色重于其逻辑角色，在这一点上与帕森斯一脉相承。在晚近著作中（Friedman 2000, 2010）[^friedman-2000]，弗里德曼论证：为几何学奠基的直观在根本上是运动学的；对它最好的解释是平移与旋转——它们既刻画欧几里得几何学家的构造操作，也刻画寻常观察者带空间定向的知觉视角。这一说明在逻辑解释与现象学解释之间达成了一种综合；这主要靠的是把两个空间连接起来：想象力经由欧几里得构造所探究的几何空间，与按康德的看法构成一切外感性的形式的那种透视空间。更具体地说，弗里德曼这样调和逻辑解释与现象学解释：“把对几何构造的纯粹逻辑理解（作为斯科伦函数）嵌入空间之中——空间是我们外感性直观的纯粹形式（如先验感性论所描述）”（Friedman 2012, n.17）[^friedman-2012]。此外，弗里德曼还反驳对康德直观的图形化解释（Friedman 2012）[^friedman-2012]，并从 B 版演绎汇集证据，支持他关于几何构造、知觉空间与物理空间三者之间联系的理解（Friedman 2020）[^friedman-2020]，以及关于几何学与经验之关系的理解（Friedman 2015）[^friedman-2015]。
