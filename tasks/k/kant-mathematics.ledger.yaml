      Ultimately, Kant claims that it is “only the concept of magnitudes” (quantities) that can be constructed in pure intuition, since “qualities cannot be exhibited in anything but empirical intuition” (A714/B742) (Sutherland 2004a, 2004b, 2005a, 2021)[^sutherland-2004a]. This leads to a principled distinction between mathematical and philosophical cognition: while philosophical cognition is confined to the results of an abstract conceptual analysis, mathematical cognition is the result of a “chain of inferences that is always guided by intuition”, that is, by a concrete representation of its objects (Hintikka 1967; Parsons 1969; Friedman 1992; Hogan 2020)[^friedman-1992][^hintikka-1967][^hogan-2020][^parsons-1969]. Kant strains somewhat to explain how the mathematician constructs arithmetic and algebraic magnitudes, which are distinct from the spatial figures that are the object of geometric reasoning. Drawing a distinction between “ostensive” and “symbolic” construction, he identifies ostensive construction with the geometer’s practice of showing or displaying spatial figures, whereas symbolic construction correlates to the act of concatenating arithmetic or algebraic symbols (as when, for example, “one magnitude is to be divided by another, [mathematics] places their symbols together in accordance with the form of notation for division…”) (A717/B745) (Brittan 1992; Shabel 1998)[^brittan-1992][^shabel-1998].
    step1: |-
      最终，康德主张，唯有“量的概念”（quantities）能够在纯粹直观中被构造，因为“性质只能在经验直观中得到展示，别无其他”（A714/B742）（Sutherland 2004a, 2004b, 2005a, 2021）[^sutherland-2004a]。由此引出数学认识与哲学认识之间一个有原则根据的区分：哲学认识局限于抽象概念分析的结果，而数学认识则是一条“始终由直观引导的推理链”的结果，也就是说，由其对象的具体表象所引导（Hintikka 1967; Parsons 1969; Friedman 1992; Hogan 2020）[^friedman-1992][^hintikka-1967][^hogan-2020][^parsons-1969]。数学家如何构造算术的与代数的量——它们不同于作为几何推理对象的空间图形——对此康德的解释有些吃力。他区分了“演证的”（ostensive）构造与“符号的”（symbolic）构造，把演证构造等同于几何学家展示或陈列空间图形的做法，而符号构造则对应于连结算术符号或代数符号的行动（例如，当“一个量要被另一个量除时，［数学］依照除法记号的形式把二者的符号并置在一起……”）（A717/B745）（Brittan 1992; Shabel 1998）[^brittan-1992][^shabel-1998]。
