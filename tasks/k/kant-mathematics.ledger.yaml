      In the Transcendental Analytic, Kant deduces the table of twelve categories, or pure concepts of the understanding, the first six of which he describes as “mathematical” (as opposed to “dynamical”) categories because of their concern with objects of intuition (B110). The concept of number is treated as “belonging” to the category of “allness” or totality, which is itself thought to result from the combination of the concepts of unity and plurality (Parsons 1984; see 2.2 above for other topics related to Kant’s account of number)[^parsons-1984]. But, Kant claims further that difficulties that arise in the representation of infinities—in which one allegedly represents unity and plurality with no resulting representation of *number*—reveal that a concept of number must require the mediation of “a special act of the understanding” (B111). (This special act is presumably the *synthesis* that Kant describes as a function of both imagination and understanding, and which it is the business of the full theory of judgment—including the Transcendental Deduction and the Schematism—to explain (Carson 2017; Longuenesse 1998)[^carson-2017][^longuenesse-1998].) So, though he also claims that arithmetic “forms its concepts of numbers through successive addition of units in time” (4:283), it is misleading to infer that arithmetic is to time as geometry is to space, since a formal intuition of time is inadequate to explain the general and abstract science of number.[^note-5] In fact, Kant declares mechanics to be the mathematical science that is to time what geometry is to space (Sutherland 2014)[^sutherland-2014].
    step1: |-
      在先验分析论中，康德演绎出十二个范畴的表，即知性的纯粹概念；他把其中前六个描述为“数学性的”（相对于“力学性的”）范畴，因为它们关涉直观的对象（B110）。数的概念被处理为“归属”于“全体性”或总体性范畴，而这一范畴本身被认为是单一性与多数性概念相结合的结果（Parsons 1984；康德数的说明的其他相关话题见上文 2.2）[^parsons-1984]。但是，康德还主张，在表象无穷时产生的困难——在无穷表象中，据说一个人表象了单一性与多数性却没有得出 **数** 的表象——表明数的概念必须要求“知性的一种特殊行动”为中介（B111）。（这种特殊行动大概就是康德描述为想象力与知性之共同功能的 **综合**；而完整的判断理论——包括先验演绎与图型论——的任务正是要解释它（Carson 2017; Longuenesse 1998）[^carson-2017][^longuenesse-1998]。）因此，尽管他也主张算术“通过在时间中相继累加单位而形成其数的概念”（4:283），但如果由此推断算术之于时间就如同几何之于空间，那是误导性的，因为时间的形式直观不足以解释普遍而抽象的数的科学[^note-5]。事实上，康德宣布力学是这样一门数学科学：它之于时间，恰如几何之于空间（Sutherland 2014）[^sutherland-2014]。
