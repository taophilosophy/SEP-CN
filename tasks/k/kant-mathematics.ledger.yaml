      Michael Friedman’s original position (Friedman 1985, 1992)[^friedman-1985] with respect to the role of intuition in mathematical reasoning descends from Beth’s and Hintikka’s, though it is substantially different from theirs and has been modified in his most recent writings. In his *Kant and the Exact Sciences*(Friedman 1992)[^friedman-1992], Friedman takes the position that our modern conception of logic ought to be used as a tool for interpreting (rather than criticizing) Kant, noting that the explicit representation of an infinity of mathematical objects that can be generated by the polyadic logic of modern quantification theory is conceptually unavailable to the mathematician and logician of Kant’s time. As a result of the inadequacy of monadic logic to represent an infinity of objects, the eighteenth-century mathematician relies on intuition to deliver the representations necessary for mathematical reasoning. Friedman explicates the details of Kant’s philosophy of mathematics on the basis of this historical insight.
    step1: |-
      迈克尔·弗里德曼关于直观在数学推理中之作用的原本立场（Friedman 1985, 1992）[^friedman-1985] 承自贝特与欣提卡，尽管它实质上不同于二者的立场，并且在他最近的著作中已被修改。在他的《康德与精密科学》（Friedman 1992）[^friedman-1992] 中，弗里德曼采取的立场是：我们现代的逻辑观念应当被用作解释（而非批评）康德的工具；他指出，由现代量化理论的多原子逻辑所能产生的对无穷多数学对象的显式表象，在概念上是康德时代的数学家与逻辑学家所无法获得的。由于一元逻辑不足以表象无穷多的对象，十八世纪的数学家依赖直观来提供数学推理所必需的表象。弗里德曼在这一历史洞见的基础上阐明了康德数学哲学的细节。
