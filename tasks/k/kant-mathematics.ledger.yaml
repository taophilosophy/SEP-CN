      Kant’s conception of mathematics was debated by his contemporaries; influenced and provoked Frege, Russell and Husserl; and provided inspiration for Brouwerian Intuitionism. His conception of mathematics was rejuvenated as worthy of close historical study by Gottfried Martin’s 1938 monograph *Arithmetik und Kombinatoric bei Kant* (Martin 1985)[^martin-1985]. Despite the very different positions that contemporary commentators develop as to how best to understand Kant’s thought, they are broadly united in opposing a long-standard story (perhaps originally promoted by Bertrand Russell in his *Principles of Mathematics* and by Rudolph Carnap in his *Philosophical Foundations of Physics*) according to which the development of modern logic in the 19ᵗʰ and 20ᵗʰ centuries, the discovery of non-Euclidean geometries, and the formalization of mathematics renders Kant’s intuition-based theory of mathematics and related philosophical commitments obsolete or irrelevant. Contemporary commentators seek to reconstruct Kant’s philosophy of mathematics from the vantage of Kant’s own historical context and also to identify the elements of Kant’s philosophy of mathematics that are of eternal philosophical interest (Parsons 2014)[^parsons-2014].
    step1: |-
      康德的数学观曾被他的同时代人讨论；它影响并刺激了弗雷格（Frege）、罗素（Russell）与胡塞尔（Husserl）；它还为布劳威尔式直觉主义提供了灵感。戈特弗里德·马丁（Gottfried Martin）1938 年的专著《康德的算术与组合论》（*Arithmetik und Kombinatoric bei Kant*）使康德的数学观重获新生，被视为值得深入历史研究的对象（Martin 1985）[^martin-1985]。尽管当代评注者就如何最好地理解康德的思想发展出了非常不同的立场，但他们在宽泛的意义上团结一致，反对一个长期流行的故事（它或许最初由伯特兰·罗素（Bertrand Russell）在其《数学原理》（*Principles of Mathematics*）中、由鲁道夫·卡尔纳普（Rudolph Carnap）在其《物理学的哲学基础》（*Philosophical Foundations of Physics*）中所推动）：按照这个故事，19 世纪与 20 世纪现代逻辑的发展、非欧几何的发现以及数学的形式化，使得康德基于直觉的数学理论及相关的哲学承诺过时或无关紧要。当代评注者力求从康德自身的历史语境出发重构康德的数学哲学，同时也力图辨识康德数学哲学中那些具有永恒哲学趣味的要素（Parsons 2014）[^parsons-2014]。
    step2: |-
