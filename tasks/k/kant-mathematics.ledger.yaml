    source: |-
      In 1763, Kant entered an essay prize competition addressing the question of whether the first principles of metaphysics and morality can be proved, and thereby achieve the same degree of certainty as mathematical truths. Though his essay was awarded second prize by the Royal Academy of Sciences in Berlin (losing to Moses Mendelssohn’s “On Evidence in the Metaphysical Sciences”), it has nevertheless come to be known as Kant’s “Prize Essay”. The Prize Essay was published by the Academy in 1764 under the title “Inquiry Concerning the Distinctness of the Principles of Natural Theology and Morality” and stands as a key text in Kant’s pre-critical philosophy of mathematics.
    step1: |-
      1763 年，康德参加了一场有奖征文竞赛，征题是形而上学与道德的第一原理能否得到证明，从而获得与数学真理相同程度的确定性。尽管他的论文被柏林皇家科学院评为二等奖（败给了摩西·门德尔松（Moses Mendelssohn）的《论形而上学诸科学中的明证性》），它仍然以康德的“获奖论文”（Prize Essay）之名为人所知。这篇获奖论文由科学院于 1764 年出版，题为《关于自然神学与道德诸原则之明晰性的研究》，是康德前批判期数学哲学中的一篇关键文本。
    step2: |-
      1763 年，康德参加了一场有奖征文，征题是：形而上学与道德的第一原理能否得到证明，从而具备与数学真理同等的确定性。他的论文虽被柏林皇家科学院评为二等奖——败给了摩西·门德尔松（Moses Mendelssohn）的《论形而上学诸科学中的明证性》——却仍以康德的“获奖论文”（Prize Essay）之名为人所知。该文由科学院于 1764 年出版，题为《关于自然神学与道德诸原则之明晰性的研究》，堪称康德前批判期数学哲学的关键文本。
  - id: 4
    source: |-
      In the Prize Essay, Kant undertook to compare the methods of mathematics and metaphysics (Carson 1999; Sutherland 2010)[^carson-1999][^sutherland-2010]. He claimed that “the business of mathematics…is that of combining and comparing given concepts of magnitudes, which are clear and certain, with a view to establishing what can be inferred from them” (2:278). He claimed further that this business is accomplished via an examination of figures or “visible signs” that provide concrete representations of universal concepts that have been synthetically defined (Dunlop 2014, 2020)[^dunlop-2014]. For example, one defines the mathematical concept <trapezium> by arbitrary combination of other concepts (“four straight lines bounding a plane surface so that the opposite sides are not parallel to each other”[^note-1]), accompanied by a “sensible sign” that displays the relations among the parts of all objects so defined. Definitions as well as fundamental mathematical propositions (that space can only have three dimensions, for example) must be “examined *in concreto* so that they come to be cognized intuitively”, but such propositions can never be proved since they are not inferred from other propositions (2:281). Theorems are established when simple cognitions are combined “by means of synthesis” (2:282), as when, for instance, it is demonstrated that the products of the segments formed by two chords intersecting inside a circle are equal. In the latter case, one proves a theorem about any and all pairs of lines that intersect inside a circle not by “drawing all the possible lines which could intersect each other within [the circle]” but rather by drawing only two lines, and identifying the relationship that holds between them (2:278). The “universal rule” that results is inferred via a synthesis among the sensible signs that are displayed, and, as a result, among the concepts that the sensible signs illustrate.
    step1: |-
      在《获奖论文》中，康德着手比较数学与形而上学的方法（Carson 1999; Sutherland 2010）[^carson-1999][^sutherland-2010]。他主张：“数学的事务……在于结合并比较给定的量的概念——它们是清晰而确定的——以期确立从其中能够推演出什么”（2:278）。他进一步主张，这一事务是通过考察图形或“可见的符号”来完成的，这些符号为那些已被综合地定义的普遍概念提供了具体的表象（Dunlop 2014, 2020）[^dunlop-2014]。例如，人们通过对其他概念的任意组合来定义数学概念〈梯形〉（“四条直线围住一个平面，使得对边彼此不平行”[^note-1]），并配有一个“感性符号”，用以展示所有如此定义的对象各部分之间的关系。定义以及基本的数学命题（例如空间只能有三维）必须“在具体中加以检验（*in concreto*），从而被直观地认识到”，但这类命题永远不能被证明，因为它们不是从其他命题推演出来的（2:281）。当简单的认识“凭借综合”被结合起来时，定理就确立了（2:282），例如，当人们演证在圆内相交的两条弦被交点分出的线段之积相等时。在后一种情形中，人们证明一条关于任何与所有在圆内相交的线对的定理，不是靠“画出所有可能在［圆］内彼此相交的线”，而是只画出两条线，并辨识出它们之间成立的关系（2:278）。由此得出的“普遍规则”，是通过所展示的各感性符号之间的综合推演出来的，因而也是通过这些感性符号所例示的各概念之间的综合推演出来的。
    step2: |-
      在《获奖论文》中，康德着手比较数学与形而上学的方法（Carson 1999; Sutherland 2010）[^carson-1999][^sutherland-2010]。他说：“数学的事务……在于把给定的量的概念——它们清晰而确定——结合起来、加以比较，以期确立从中能推出什么”（2:278）。他进一步说，这件事要靠考察图形或“可见的符号”来完成：这些符号为那些已按综合方式定义的普遍概念提供了具体的表象（Dunlop 2014, 2020）[^dunlop-2014]。例如，人们把别的概念任意组合起来，定义出数学概念〈梯形〉（“四条直线围住一个平面，而对边彼此不平行”[^note-1]），并配上一个“感性符号”，用它展示所有如此定义的对象中各部分之间的关系。定义与基本的数学命题（例如空间只能有三维）都必须“在具体中（*in concreto*）加以检验，从而得到直观的认识”；但这类命题永远无法证明，因为它们不是从别的命题推出来的（2:281）。而当若干简单的认识“凭借综合”结合起来时，定理便告确立（2:282）——比如，演证圆内相交的两条弦被交点分出的线段之积相等。在后一种情形里，人们证明的是一条对任何与所有在圆内相交的线对都成立的定理；办法不是“画出所有可能在［圆］内彼此相交的线”，而是只画两条线，再辨识出二者之间成立的关系（2:278）。由此得到的“普遍规则”，是通过所展示的各感性符号之间的综合推出来的，因而也是通过这些感性符号所例示的各概念之间的综合推出来的。
  - id: 5
    source: |-
      Kant concludes that the mathematical method cannot be applied to achieve philosophical (and, in particular, metaphysical) results, for the primary reason that “geometers acquire their concepts by means of *synthesis*, whereas philosophers can only acquire their concepts by means of *analysis*—and that completely changes the method of thought” (2:289). Yet at this pre-critical stage, he also concludes that, even lacking synthetic definitions of its primary concepts, “metaphysics is as much capable of the certainty which is necessary to produce conviction as mathematics” (2:296). (Later, in the critical period, Kant will expand the notion of synthesis to describe not only the genesis and combination of mathematical concepts, but also the act of unifying manifold representations. He will also, of course, use the terms “synthetic” and “analytic” to distinguish two mutually exclusive ways in which the subject and predicate concepts relate to one another in distinct judgments of any kind, and he will emphasize an expanded sense of this distinction that encompasses a methodological contrast between two modes of argumentation, one synthetic or progressive and the other analytic or regressive. These various senses of the analytic/synthetic distinction will be addressed briefly, below.)
    step1: |-
      康德总结道，数学方法不能被用来达成哲学的（尤其是形而上学的）结果，主要理由是：“几何学家凭借综合（*synthesis*）获得他们的概念，而哲学家只能凭借分析（*analysis*）获得他们的概念——这完全改变了思想的方法”（2:289）。然而在这个前批判阶段，他还总结道，即使缺少对基本概念的综合定义，“形而上学也和数学一样，有能力具备产生信念所必需的确定性”（2:296）。（后来在批判时期，康德将扩展综合概念的含义，用它描述的不仅是数学概念的发生与结合，还有统一杂多表象的行动。当然，他还会用“综合的”与“分析的”这两个术语来区分任何一类判断中主词概念与谓词概念彼此关联的两种互斥方式；他还会强调这一区分的一种扩展意义，即涵盖两种论证模式之间的方法论对照，一种是综合的或前进的，另一种是分析的或回溯的。分析/综合区分的这几种含义将在下文简要讨论。）
    step2: |-
      康德的结论是：数学方法无法用来达成哲学的（尤其是形而上学的）结果，主要理由在于：“几何学家凭借综合（*synthesis*）获得概念，哲学家却只能凭借分析（*analysis*）获得概念——这完全改变了思想的方法”（2:289）。不过在从前批判阶段，他也得出另一结论：即使缺少对基本概念的综合定义，“形而上学与数学一样，有能力具备产生信念所必需的那种确定性”（2:296）。（到了批判时期，康德将扩展“综合”一词的含义：它不仅描述数学概念的发生与结合，还描述统一杂多表象的行动。当然，他还会用“综合的”与“分析的”两个术语，来区分任何一类判断中主词概念与谓词概念相互关联的两种互斥方式；他还会强调这一区分的扩展义，用以涵盖两种论证模式之间的方法论对照——一种是综合的、前进的，另一种是分析的、回溯的。分析/综合区分的这几层含义，下文将略作讨论。）
  - id: 6
    source: |-
      In the essays “Concerning the Ultimate Ground of the Differentiation of Directions in Space” and “On the Form and Principles of the Sensible and the Intelligible World [Inaugural Dissertation]” of 1768 and 1770, respectively, Kant’s thoughts about mathematics and its results begin to evolve in the direction of his critical philosophy as he begins to recognize the role that a distinct faculty of sensibility will play in an account of mathematical cognition (Carson 2004; Carson 2017; Posy 2020)[^carson-2004][^carson-2017][^posy-2020][^posy-2020-2]. In these essays, he attributes the success of mathematical reasoning to its access to the “principles of sensitive form” and the “primary data of intuition”, which results in “laws of intuitive cognition” and “intuitive judgments” about magnitude and extension. One such judgment serves to establish the possibility of an object that is “exactly equal and similar to another, but which cannot be enclosed in the same limits as that other, its *incongruent counterpart*” (2:382) (Buroker 1981; Van Cleve and Frederick 1991; Van Cleve 1999)[^buroker-1981][^cleve-1991][^cleve-1999]. Kant invokes such “incongruent counterparts” in “Directions in space” to establish the orientability and actuality of a Newtonian-style absolute space, the object of geometry as he then understands it. He invokes the same example in the “Inaugural Dissertation” to establish that spatial relations “can only be apprehended by a certain pure intuition” and so show that “geometry employs principles which are not only indubitable and discursive, but which also fall under the gaze of the mind.” As such, mathematical evidence is “the *paradigm* and the means of all evidence in the other sciences” (2:403). (Later, in the critical period’s *Prolegomena*, he will invoke incongruent counterparts to establish the transcendental ideality of space, thereby disavowing his earlier argument in support of absolute space.)
    step1: |-
      在 1768 年与 1770 年先后发表的两篇文章《论空间中方位区分的最初根据》与《论可感世界与理知世界的形式及原则［就职论文］》中，康德关于数学及其成果的思想开始朝着其批判哲学的方向演化，因为他开始认识到，一个独特的感性官能将在关于数学认识的说明中扮演何种角色（Carson 2004; Carson 2017; Posy 2020）[^carson-2004][^carson-2017][^posy-2020][^posy-2020-2]。在这些文章里，他把数学推理的成功归因于它得以通达“感性形式的原则”与“直观的原初材料”；由此产生出关于量与广延的“直观认识的法则”与“直观判断”。其中一个判断确立了这样一个对象的可能性：“与另一物完全相等且相似，却不能被围限在与那一物相同的界限之内——即它的不等称对应物（*incongruent counterpart*）”（2:382）（Buroker 1981; Van Cleve and Frederick 1991; Van Cleve 1999）[^buroker-1981][^cleve-1991][^cleve-1999]。康德在《论空间中方位区分的最初根据》中援引这类“不等称对应物”，以确立一种牛顿式绝对空间的可定向性与现实性——按他当时的理解，这种绝对空间正是几何学的对象。他在《就职论文》中援引同一个例子，以确立空间关系“只能被某种纯粹直观所把握”，并由此表明“几何学运用的那些原则不仅无可怀疑、是推论性的，而且还落在心灵的目光之下”。因此，数学的明证性是“其他一切科学中一切明证性的范型（*paradigm*）与手段”（2:403）。（后来，在批判时期的《未来形而上学导论》（*Prolegomena*）中，他将援引不等称对应物来确立空间的先验观念性，从而否定他早先支持绝对空间的论证。）
    step2: |-
      在 1768 年与 1770 年先后发表的《论空间中方位区分的最初根据》与《论可感世界与理知世界的形式及原则［就职论文］》两篇文章中，康德关于数学及其成果的思想开始朝着其批判哲学的方向演化；因为他开始认识到，一个独特的感性官能将在关于数学认识的说明中扮演何种角色（Carson 2004; Carson 2017; Posy 2020）[^carson-2004][^carson-2017][^posy-2020][^posy-2020-2]。在这些文章里，他把数学推理的成功归因于它得以通达“感性形式的原则”与“直观的原初材料”；由此产生出关于量与广延的“直观认识的法则”与“直观判断”。其中一个判断用来说明这样一个对象何以可能：“它与另一物完全相等且相似，却不能被围限于与那一物相同的界限之内——这就是它的不等称对应物（*incongruent counterpart*）”（2:382）（Buroker 1981; Van Cleve and Frederick 1991; Van Cleve 1999）[^buroker-1981][^cleve-1991][^cleve-1999]。康德在《论空间中方位区分的最初根据》里援引这类“不等称对应物”，以确立一种牛顿式绝对空间的可定向性与现实性；按他当时的理解，这种绝对空间正是几何学的对象。在《就职论文》里，他援引同一个例子，以确立空间关系“只能被某种纯粹直观所把握”，并由此表明“几何学所运用的原则不仅无可怀疑、是推论性的，而且还落在心灵的目光之下”。于是，数学的明证性便成了“其他一切科学中一切明证性的范型（*paradigm*）与手段”（2:403）。（后来在批判时期的《未来形而上学导论》（*Prolegomena*）中，他将再次援引不等称对应物，以确立空间的先验观念性，从而放弃他早先支持绝对空间的论证。）
  - id: 7
    source: |-
      Kant’s critical philosophy of mathematics finds fullest expression in the section of the *Critique of Pure Reason* entitled “The Discipline of Pure Reason in Dogmatic Use”, which begins the second of the two main divisions of the *Critique*, the “Transcendental Doctrine of Method.” In previous sections of the *Critique*, Kant has subjected pure reason “in its transcendental use in accordance with mere concepts” to a critique in order to “constrain its propensity to expansion beyond the narrow boundaries of possible experience” (A711/B739). But Kant tells us that it is unnecessary to subject mathematics to such a critique because the use of pure reason in mathematics is kept to a “visible track” via intuition: “[mathematical] concepts must immediately be exhibited *in concreto* in pure intuition, through which anything unfounded and arbitrary instantly becomes obvious” (A711/B739). Nevertheless, the practice and discipline of mathematics does require an explanation, in order both to account for its success at demonstrating substantive and necessary truths, and also to license its invocation as a model of reasoning. Kant thus directs himself, as he did in the pre-critical period, to the question of what accounts for the “happy and well grounded” mathematical method, and also of whether it is useful in any discipline other than mathematics. To answer this latter question in the negative, Kant must explain the uniqueness of mathematical reasoning.
    step1: |-
      康德批判期的数学哲学，在《纯粹理性批判》中题为“纯粹理性在独断运用中的训练”（The Discipline of Pure Reason in Dogmatic Use）的一节中得到了最充分的表达；这一节开启了《批判》两大部分中的第二部分，即“先验方法论”。在《批判》此前的章节里，康德已把“按单纯概念作先验运用的”纯粹理性交付批判，为的是“约束它越出可能经验的狭窄边界去扩张的癖好”（A711/B739）。但康德告诉我们，不必对数学作这样的批判，因为纯粹理性在数学中的运用，经由直观被保持在一道“可见的路径”上：“［数学的］概念必须立刻在纯粹直观中被具体地（*in concreto*）展示出来；有了直观，任何无根据的、任意的东西都立刻暴露无遗”（A711/B739）。尽管如此，数学的实践与训练仍然需要一个说明：既要解释数学为何能成功演证实体的、必然的真理，也要为把数学当作推理范型来援引提供依据。因此，康德像在前批判时期一样，转向这样两个问题：是什么造就了“幸运而有充分根据的”数学方法？这种方法在数学之外的任何学科中是否有用？要对后一个问题作否定的回答，康德就必须解释数学推理的独特性。
    step2: |-
