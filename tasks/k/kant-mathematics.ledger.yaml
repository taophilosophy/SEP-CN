      New generations of scholars contribute to a lively, fertile and ongoing discussion about the interpretation and legacy of Kant’s philosophy of mathematics that originated with the literature mentioned in 3.1 and 3.2, above. However, recent work is not easily categorized as landing on either side of one or another interpretive debate; most scholars are using the field’s foundational discussions as a springboard from which to explore the variety of ways in which mathematics plays a role in the critical philosophy. In 2020, Carl Posy and Ofra Rechter published the first volume of a two-volume successor to Posy’s 1992 collection, entitled *Kant*’*s Philosophy of Mathematics, Volume I: The Critical Philosophy and Its Roots*. This first volume includes twelve essays on topics that range from the pre-critical origins of Kant’s philosophy of mathematics to his critical thoughts on mathematical method, logic, geometry and arithmetic. The essays in the forthcoming second volume will focus on the reception and influence of Kant’s philosophy of mathematics. Also notable is a collection of articles first published in a special issue of the Canadian Journal of Philosophy, *Kant: Studies on Mathematics in the Critical Philosophy*, edited by Emily Carson and Lisa Shabel (Carson and Shabel 2014). The nine contributions collected here aim to explore the centrality of mathematics in Kant’s overall philosophical system. Daniel Sutherland has recently written a book-length treatment of Kant’s philosophy of mathematics, *Kant*’*s Mathematical World: Mathematics, Cognition, and Experience* (Sutherland 2021)[^sutherland-2021], in which he focuses on Kant’s theory of magnitudes as the key to Kant’s account of our cognition and experience of the world. A second volume is forthcoming.
    step1: |-
      新一代学者继续参与关于康德数学哲学的解释与遗产的热烈、多产且仍在进行的讨论，这场讨论发源于上文 3.1 与 3.2 提到的文献。然而，晚近的工作不容易被归类为在某场解释论争中的这一边或那一边；大多数学者都在利用该领域的基础性讨论作为跳板，去探索数学在批判哲学中扮演角色的种种方式。2020 年，卡尔·波西（Carl Posy）与奥夫拉·雷克特（Ofra Rechter）出版了波西 1992 年文集的两卷本后继之作的第一卷，题为《康德的数学哲学（第一卷）：批判哲学及其根源》（*Kant's Philosophy of Mathematics, Volume I: The Critical Philosophy and Its Roots*）。这第一卷包括十二篇文章，话题范围从康德数学哲学的前批判起源一直到他对数学方法、逻辑、几何与算术的批判期思考。即将出版的第二卷中的文章将聚焦于康德数学哲学的接受与影响。同样值得注意的是一批文章，最初发表于《加拿大哲学期刊》的一期特刊，题为《康德：批判哲学中的数学研究》（*Kant: Studies on Mathematics in the Critical Philosophy*），由埃米莉·卡森（Emily Carson）与丽莎·谢贝尔（Lisa Shabel）编辑（Carson and Shabel 2014）。这里收集的九篇文章旨在探索数学在康德整个哲学体系中的中心地位。丹尼尔·萨瑟兰（Daniel Sutherland）最近写了一部对康德数学哲学的书卷级研究，《康德的数学世界：数学、认识与经验》（*Kant's Mathematical World: Mathematics, Cognition, and Experience*）（Sutherland 2021）[^sutherland-2021]，在其中他聚焦于康德的量理论，把它当作康德说明我们关于世界的认识与经验的关键。第二卷即将出版。
