    source: |-
      Kant was a student and a teacher of mathematics throughout his career, and his reflections on mathematics and mathematical practice had a profound impact on his philosophical thought (Martin 1985; Moretto 2015)[^martin-1985][^moretto-2015]. He developed considered philosophical views on the status of mathematical judgment, the nature of mathematical concepts, definitions, axioms and proof, and the relation between pure mathematics and the natural world. Moreover, his approach to the general question “how are synthetic judgments *a priori* possible?” was shaped by his conception of mathematics and its achievements as a well-grounded science.
    step1: |-
      康德（Immanuel Kant）一生既是数学的学习者，也是数学的教师；他对数学与数学实践的反思，对他的哲学思想产生了深远的影响（Martin 1985; Moretto 2015）[^martin-1985][^moretto-2015]。他就数学判断的地位、数学概念的本性、定义、公理与证明，以及纯粹数学与自然界之间的关系，发展出了经过深思的哲学观点。此外，他对“综合判断如何可能是先天的（*a priori*）”这一一般问题的处理方式，也受到了他关于数学的看法的塑造——在他看来，数学是一门根基牢固的科学。
    step2: |-
      康德（Immanuel Kant）一生既研习数学，也讲授数学；他对数学及数学实践的反思，深刻影响了他的哲学思想（Martin 1985; Moretto 2015）[^martin-1985][^moretto-2015]。对于数学判断的地位、数学概念的本性、定义、公理与证明，以及纯粹数学与自然界的关系，他都发展出了经过深思的哲学观点。此外，在他看来，数学是一门根基牢固的科学；正是他对数学及其成就的这一理解，塑造了他处理“综合判断如何可能是先天的（*a priori*）”这一普遍问题的进路。
