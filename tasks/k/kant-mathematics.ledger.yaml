      In both the Preamble to the *Prolegomena to Any Future Metaphysics* and the B-Introduction to the *Critique of Pure Reason*, Kant introduces the analytic/synthetic distinction, which distinguishes between judgments the predicates of which belong to or are contained in the subject concept and judgments the predicates of which are connected to but go beyond the subject concept, respectively. In each text, he follows his presentation of this distinction with a discussion of his claim that all mathematical judgments are synthetic and *a priori*.[^note-4] There he claims, first, that “properly mathematical judgments are always *a priori* judgments” on the grounds that they are necessary, and so cannot be derived from experience (B14). He follows this with an explanation of how such non-empirical judgments can yet be synthetic, that is, how they can serve to synthesize a subject and predicate concept rather than merely explicate or analyze a subject concept into its constituent logical parts.
    step1: |-
      在《未来形而上学导论》的序言与《纯粹理性批判》的 B 版导言中，康德引入了分析/综合的区分：它区分开这样两类判断，前者的谓词属于主词概念或包含在主词概念之中，后者的谓词与主词概念相联结却超出主词概念。在两部文本中，他都是在提出这一区分之后，紧接着讨论他的这一主张：一切数学判断都是综合的且先天的（*a priori*）[^note-4]。在那里他首先主张，“严格意义上的数学判断总是先天判断”，理由是它们是必然的，因而不能从经验中推导出来（B14）。随后他解释这类非经验的判断如何仍能是综合的，也就是说，它们如何能够用来综合一个主词概念与一个谓词概念，而不只是把一个主词概念剖解或分析成其构成性的逻辑部分。
