      Kant argues that mathematical reasoning cannot be employed outside the domain of mathematics proper for such reasoning, as he understands it, is *necessarily* directed at objects that are “determinately given in pure intuition *a priori* and without any empirical *data*” (A724/B752). Since only formal mathematical objects (i.e. spatial and temporal magnitudes) can be so given, mathematical reasoning is useless with respect to *materially* given content (though the truths that result from mathematical reasoning about formal mathematical objects are fruitfully applied to such material content, which is to say that mathematics is applicable to and *a priori* true of the appearances (Shabel 2005)[^shabel-2005]. Consequently, the “thorough grounding” that mathematics finds in its definitions, axioms, and demonstrations cannot be “achieved or imitated” by philosophy or physical sciences (A727/B755).
    step1: |-
      康德论证说，数学推理不能在严格意义上的数学领域之外被运用，因为按他的理解，这种推理 **必然地** 指向那些“在纯粹直观中先天地（*a priori*）且不凭任何经验性 **材料**（*data*）而被确定地给予的”对象（A724/B752）。既然只有形式性的数学对象（即空间的与时间的量）能被如此给予，数学推理对于 **质料性地** 被给予的内容便无用武之地（尽管关于形式性数学对象的数学推理所产生的真理可以富有成效地应用于这类质料性内容；也就是说，数学既适用于现象，又对现象先天地为真（Shabel 2005）[^shabel-2005]）。因此，数学在其定义、公理与演证中所找到的“彻底奠基”，是哲学或物理科学所不能“达成或仿效的”（A727/B755）。
    step2: |-
      康德论证说，数学推理无法在严格意义上的数学领域之外使用；因为按他的理解，这种推理 **必然地** 指向这样一些对象：“在纯粹直观中先天地（*a priori*）被确定地给予，而不凭任何经验性 **材料**（*data*）”（A724/B752）。既然只有形式性的数学对象（即空间与时间上的量）能被如此给予，数学推理对 **质料性地** 被给予的内容便派不上用场。不过，关于形式性数学对象的数学推理所得出的真理，可以卓有成效地应用于这类质料性内容——也就是说，数学既适用于现象，又对现象先天为真（Shabel 2005）[^shabel-2005]。因此，数学凭其定义、公理与演证而获得的“彻底奠基”，哲学与物理科学都无法“达成或仿效”（A727/B755）。
