      但究竟什么*是*先天综合判断？把先天—后天区分与分析—综合区分结合起来，康德导出四种可能的判断类型：(1) 先天分析；(2) 后天分析；(3) 先天综合；(4) 后天综合。由于分析判断必然为真，又鉴于康德“必然性蕴涵先天性”的论题，可知一切分析判断都是先天的，而后天分析判断这类东西并不存在。相比之下，综合判断可以先天，也可以后天。后天综合判断是经验的、偶然的判断，尽管其概括程度可以大不相同。与之相对，先天综合判断是非经验的、非偶然的判断。
