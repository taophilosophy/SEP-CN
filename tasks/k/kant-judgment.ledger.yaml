      By contrast yet again and finally, the three kinds of *modality* of a judgment are supposed by Kant to capture the three basic ways in which the copula of a simple 1-place subject-predicate proposition “contributes nothing to the content of the judgment … but rather concerns only the value of the copula in relation to thinking in general” (A74/B99–100). This doctrine might seem to confuse the three propositional attitudes of “opining” (*Meinen*), epistemic belief, and certainty (A820–823/B848–851), as discussed in the supplementary document [Judging, Believing, and Scientific Knowing](kant-judgment.supplement2.md), with the alethic modal notions of possibility, actuality, and necessity. Or even worse, it might seem to psychologize modality.
    step1: |-
      最后，康德认为判断的三种*模态*刻画了简单一目主谓命题的系词“对判断的内容毫无贡献……而仅仅关系到系词相对于一般思想的值”（A74/B99–100）的三种基本方式。这一学说似乎会把“意见”（*Meinen*）、认识性信念与确定性（A820–823/B848–851）这三种命题态度——如补充文献[判断、信念与科学认识](kant-judgment.supplement2.md)所论——与可能性、现实性、必然性这些真势模态概念混淆起来，甚至更糟，似乎会把模态心理学化。
