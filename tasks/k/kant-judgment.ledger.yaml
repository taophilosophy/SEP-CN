      Kant also uses the term ‘spontaneity’ in a somewhat different sense in a metaphysical context, to refer to a mental cause that can sufficiently determine an effect in time while also lacking any temporally prior sufficient cause of itself (A445/B473). Call this *practical* spontaneity. What is shared between the two senses of spontaneity, practical and cognitive, is the unprecedented, creative character of the mind’s operations. But in the cognitive sense of spontaneity, what is crucial is that the sensory data manifest “poverty of the stimulus” (Cook & Newson 1996, 81–85)[^cook-1996]—significant underdetermination of the outputs of an embodied cognitive capacity by the relevant inputs to that capacity, plus previous experiences or habituation—although the faculty’s spontaneity must also always be minimally conditioned by external sensory triggering (B1–2). Correspondingly, a Kantian cognitive faculty is innate in the threefold sense that (i) it is intrinsic to the mind, hence a necessary part of the nature of the rational animal possessing that faculty, (ii) it contains internal structures that are necessarily or strictly underdetermined by any and all sensory impressions and/or empirical facts—which is the same as their being *a priori* (B2), and (iii) it automatically systematically synthesizes those sensory inputs according to special normative rules that directly reflect the internal structures of the faculty, thereby generating its correlatively-structured outputs. So Kantian innateness is essentially a *procedure-based* innateness, consisting in an a priori active readiness of the mind for implementing normative rules of synthesis, as opposed to the *content-based* innateness of Cartesian and Leibnizian innate ideas, according to which an infinitely large supply of complete (e.g., mathematical) beliefs, propositions, or concepts themselves are either occurrently or dispositionally intrinsic to the mind. But as Locke pointed out, this implausibly overloads the human mind’s limited storage capacities.
    step1: |-
      康德也在形而上学语境中以略为不同的意义使用“自发性”一词，指这样一种心智原因：它能在时间中充分决定一个结果，同时自身又没有任何在时间上先于它的充分原因（A445/B473）。可称之为*实践*自发性。实践自发性与认知自发性两种意义的共同之处，是心的运作所具有的那种前所未有的创造性品格。但在自发性的认知意义上，关键在于感性材料表现出“刺激的贫乏”（Cook & Newson 1996, 81–85）[^cook-1996]——即具身认知能力的输出显著地不由该能力的相关输入加上先前经验或习惯化所决定——尽管该机能的自发性也总须受外部感性触发的起码限定（B1–2）。相应地，康德式认知机能在三重意义上是先天的：(i) 它内在于心，因而是拥有该机能的理性动物之本性的必要部分；(ii) 它包含一些内部结构，这些结构必然地或严格地不由任何感性印象和/或经验事实所决定——这等同于它们是*先天*的（B2）；(iii) 它自动地按照直接反映该机能内部结构的特殊规范性规则系统地综合那些感性输入，从而生成结构与之相应的输出。因此，康德式的先天性本质上是*基于程序*的先天性，在于心为实施综合的规范性规则而具有的先天主动准备状态；它与笛卡尔式与莱布尼茨式天赋观念那种*基于内容*的先天性相对照——后者认为，无限大量的完整信念、命题或概念本身（如数学的）或现成地、或倾向性地内在于心。但正如洛克所指出的，这会以不可信的方式使人心的有限存储能力超载。
