  - id: 3
    kind: body
    source: |-
      Theories of cognitive judgment both prior to and after Kant tend to divide dichotomously into the *psychologistic* and *platonistic* camps, according to which, on the one hand, cognitive judgments are nothing but mental representations of relations of ideas, as, e.g., in the Port Royal Logic (Arnaud & Nicole 1996)[^arnaud-1996], or mentalistic ordered combinings of real individuals, universals, and logical constants, as, e.g., in Russell’s early theory of judgment (Russell 1966)[^russell-1966], or on the other hand, cognitive judgments are nothing but assertoric psychological states or attitudes aimed at mind-independent, abstract propositions or thoughts, as, e.g., in Bolzano’s and Frege’s theories of judgment (Bolzano 1972, Frege 1979, Frege 1984)[^bolzano-1972][^frege-1979][^frege-1984]. And, seemingly, never the twain shall meet (Martin 2006, Hanna 2006a, ch. 1)[^hanna-2006a][^martin-2006]. But by sharp contrast to both the psychologistic and platonistic camps, Kant’s theory of judgment is at once cognitivist, anti-psychologistic, and anti-platonistic. More precisely, according to Kant, judgments are complex conscious cognitions that (i) refer to objects either directly (via intuitions) or indirectly (via concepts), (ii) include concepts that are predicated either of those objects or of other constituent concepts, (iii) exemplify pure logical concepts and enter into inferences according to pure logical laws, (iv) essentially involve both the following of rules and the application of rules to the objects picked out by intuitions, (v) express true or false propositions (truth-aptness), (vi) mediate the formation of beliefs and other intentional acts, and (vii) are unified and self-conscious.
    step1: |-
      康德之前与之后的认知判断理论，往往二分地划入*心理主义*与*柏拉图主义*两大阵营。按照前者，认知判断不过是观念之间关系的心智表象——如《波尔·罗亚尔逻辑》（Arnaud & Nicole 1996）[^arnaud-1996] 之所见——或是真实个体、共相与逻辑常项的心智主义有序组合，如罗素早期判断理论之所见（Russell 1966）[^russell-1966]；按照后者，认知判断不过是指向心灵无关的抽象命题或思想的断言性心理状态或态度，如博尔查诺与弗雷格的判断理论之所见（Bolzano 1972, Frege 1979, Frege 1984）[^bolzano-1972][^frege-1979][^frege-1984]。而且看来两者永不相遇（Martin 2006, Hanna 2006a, ch. 1）[^hanna-2006a][^martin-2006]。然而与心理主义、柏拉图主义两阵营都形成鲜明对照的是：康德的判断理论同时是认知主义的、反心理主义的与反柏拉图主义的。更确切地说，依康德之见，判断是复杂的有意识认识，它们 (i) 或直接（经由直观）或间接（经由概念）指涉对象；(ii) 包含谓述于那些对象或其他构成性概念之上的概念；(iii) 例示纯粹逻辑概念，并依纯粹逻辑法则进入推理；(iv) 本质上既涉及遵循规则，也涉及把规则应用于直观所挑出的对象；(v) 表达真或假的命题（可论真性）；(vi) 中介信念与其他意向行为的形成；(vii) 是统一的、自我意识的。
    step2: |-
      康德之前与之后的认知判断理论，往往二分地划入*心理主义*与*柏拉图主义*两大阵营：前者认为认知判断不过是观念间关系的心智表象——如《波尔·罗亚尔逻辑》（Arnaud & Nicole 1996）[^arnaud-1996] 之所见——或是真实个体、共相与逻辑常项的心智主义有序组合，如罗素早期判断理论之所见（Russell 1966）[^russell-1966]；后者认为认知判断不过是指向心灵无关的抽象命题或思想的断言性心理状态或态度，如博尔查诺与弗雷格的判断理论之所见（Bolzano 1972, Frege 1979, Frege 1984）[^bolzano-1972][^frege-1979][^frege-1984]。两者看来永不相遇（Martin 2006, Hanna 2006a, ch. 1）[^hanna-2006a][^martin-2006]。但康德的判断理论与这两大阵营都判然不同：它同时是认知主义的、反心理主义的与反柏拉图主义的。更确切地说，依康德之见，判断是复杂的有意识认识：(i) 或直接（经由直观）、或间接（经由概念）地指涉对象；(ii) 包含谓述于那些对象或其他构成性概念之上的概念；(iii) 例示纯粹逻辑概念，并依纯粹逻辑法则进入推理；(iv) 本质上既涉及遵循规则，也涉及把规则应用于直观所挑出的对象；(v) 表达真或假的命题（可论真性）；(vi) 中介信念与其他意向行为的形成；(vii) 是统一的、自我意识的。
