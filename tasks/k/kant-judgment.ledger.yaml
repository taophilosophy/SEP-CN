      In contrast to both Rationalists and Empiricists, who hold that the human mind has only one basic cognitive faculty—reason or sense perception, respectively—Kant is a cognitive-faculty *dualist* who holds that the human mind has *two* basic cognitive faculties: (i) the “understanding” (*Verstand*), the faculty of concepts, thought, and discursivity, and (ii) the “sensibility” (*Sinnlichkeit*), the faculty of intuitions/non-conceptual cognitions, sense perception, and mental imagery (A51/B75). The essential difference between the faculties of understanding and sensibility, and correspondingly the essential difference between concepts and intuitions (A50–52/B74–76), as distinct kinds of cognition, is a fundamental commitment of Kant’s theory of cognition generally and of his theory of judgment more specifically. Concepts are at once (a) general representations having the logical form of universality (9: 91), (b) discursive representations expressing pure logical forms and falling under pure logical laws (A68–70/B92–94, A239/B298), (c) complex intensions ranging over “comprehensions” (*Umfangen*) that contain all actual and possible objects falling under those intensions, as well as other narrower comprehensions (9: 95–96), (d) mediate or indirect (i.e., attributive or descriptive) representations of individual objects (A320/B376–377), (e) rules for classifying and organizing perceptions of objects (A106), and (f) “reflected” representations expressing the higher-order unity of rational self-consciousness, a.k.a. “apperception” (B133 and 133n.). Intuitions by contrast are conscious object-directed representations that are (1) singular (A320/B377) (9: 91), (2) sense-related (A19/B33, A51/B75), (3) object-dependent (B72) (4: 281), (4) immediate, or directly referential (A90–91/B122–123, B132, B145), and, above all, (5) non-conceptual (A284/B340) (9: 99) (Hanna 2001, ch. 4)[^hanna-2001].
    step1: |-
      与唯理论者和经验论者都不同——他们分别认为人心只有一种基本认知机能（理性或感官知觉）——康德是认知机能的*二元论者*，认为人心有*两种*基本认知机能：(i) “知性”（*Verstand*），概念、思维与推论性的机能；(ii) “感性”（*Sinnlichkeit*），直观/非概念性认识、感官知觉与心智意象的机能（A51/B75）。知性与感性两机能的本质区别，以及相应地概念与直观作为不同类型认识的本质区别（A50–52/B74–76），是康德一般认识论、更具体地是其判断理论的一项根本承诺。概念同时是：(a) 具有普遍性逻辑形式的一般表象（9: 91）；(b) 表达纯粹逻辑形式、隶属纯粹逻辑法则的推论性表象（A68–70/B92–94, A239/B298）；(c) 复杂的內涵，其范围涵盖包含所有落入该内涵的实际与可能对象、以及其他较窄内涵的“涵括”（*Umfangen*）（9: 95–96）；(d) 对个体对象的中介性或间接性（即属性性或描述性）表象（A320/B376–377）；(e) 对对象的知觉加以分类与组织的规则（A106）；(f) 表达理性自我意识（即“统觉”）之高阶统一性的“被反思的”表象（B133 及 133n.）。直观则是有意识的对象指向表象，它们是 (1) 单一的（A320/B377）（9: 91）；(2) 与感官相关的（A19/B33, A51/B75）；(3) 对象依赖的（B72）（4: 281）；(4) 直接的，或直接指称的（A90–91/B122–123, B132, B145）；并且最重要的是 (5) 非概念性的（A284/B340）（9: 99）（Hanna 2001, ch. 4）[^hanna-2001]。
