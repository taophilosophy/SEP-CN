      As we have seen in Sections 4.1 to 4.3, Kant’s theory of judgment leads to at least three serious problems when it is taken in conjunction with the issue about his conceptualism vs. his non-conceptualism (in the supplement [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md)) and his metaphysics of strong transcendental idealism (Section 3.1 and the supplement [Completing the Picture of Kant’s Metaphysics of Judgment](kant-judgment.supplement5.md)). Does this mean his theory of judgment is philosophically unacceptable and at best an antiquarian curiosity of 18th century German philosophy? No. This is because it seems very likely that the problems in Kant’s theory of judgment are principally due to his conjoining the centrality thesis and the priority-of-the-proposition thesis with the thesis of transcendental idealism. But suppose that the strongest version of transcendental idealism is false, and that the transcendental idealism thesis is either logically detached from the other two theses or else retained but instead based on a significantly weaker version of transcendental idealism (Hanna 2006b, ch. 5)[^hanna-2006b]: what remains? We are left with a general Kantian theory of human rationality that is essentially oriented towards judgment, and then in turn with specific Kantian accounts of the nature of judgment and of the various irreducibly different kinds of judgment, that are essentially oriented towards the anthropocentric empirical meaningfulness and truth of the proposition. As such, Kant’s theory of judgment is thoroughly cognitivist but also anti-psychologistic and anti-platonistic, and it thereby smoothly combines the several “faces” of judgment into a unified doctrine. So the fact that Kantian non-conceptualism (see the supplement [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md)) makes serious trouble for the B Deduction (Section 4.1), together with the further fact that the strongest version of transcendental idealism is very likely false—since the unqualified transcendental ideality thesis, when conjoined with the centrality thesis and the priority-of-the-proposition thesis, collectively entail contradictions in Kant’s theory that are not entailed by the conjunction of the other two theses alone—do not ultimately compromise the inherent philosophical interest, contemporary relevance, and critical defensibility of the other basic parts of Kant’s theory of judgment.
