      The table of judgments, in turn, captures a fundamental part of the science of pure general logic: *pure*, because it is a priori, necessary, hence strictly universally true, and also without any associated sensory content; *general*, because it is strictly underdetermined by all objectively valid representational contents and also abstracts away from all specific or particular differences between represented objects (cf. MacFarlane 2002)[^macfarlane-2002], and thereby “has to do with nothing but the mere form of thinking” (A54/B78); and *logic* because, in addition to the table of judgments, it also systematically provides categorically normative *conditio sine qua non* rules for the truth of judgments (i.e., the law of non-contradiction or logical consistency) and for valid inference (i.e., the law of logical consequence) (A52–55/B76–79) (9: 11–16).
    step1: |-
      判断表又构成纯粹一般逻辑这门科学的一个基本部分：说它*纯粹的*，是因为它是先天的、必然的、因而严格普遍为真的，且不带任何相应的感性内容；说它*一般的*，是因为它严格地不被一切客观有效的表象内容所充分决定，并且抽离于被表象对象之间一切特殊的或个别的差异（参见 MacFarlane 2002）[^macfarlane-2002]，从而“只与思维的单纯形式打交道”（A54/B78）；说它*逻辑*，是因为除判断表之外，它还系统地提供范畴性的规范性*必要条件*规则，用于判断之真（即不矛盾律或逻辑一致性）与有效推理（即逻辑后承法则）（A52–55/B76–79）（9: 11–16）。
    step2: |-
      判断表又构成纯粹一般逻辑这门科学的一个基本部分：谓之*纯粹的*，是因为它是先天的、必然的，因而严格普遍为真，且不带任何相应的感性内容；谓之*一般的*，是因为它严格地不被一切客观有效的表象内容所充分决定，并抽离于被表象对象之间一切特殊或个别的差异（参见 MacFarlane 2002）[^macfarlane-2002]，从而“只与思维的单纯形式打交道”（A54/B78）；谓之*逻辑*，是因为除判断表之外，它还系统地为判断之真（即不矛盾律或逻辑一致性）与有效推理（即逻辑后承法则）提供范畴性的规范性*必要条件*规则（A52–55/B76–79）（9: 11–16）。
