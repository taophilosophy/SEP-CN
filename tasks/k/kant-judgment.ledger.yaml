      Given the seminal role of the judgment’s propositional content, it is easy to see then that for Kant the propositional function of the judgment is more basic than its inferential role—although every judgment does indeed play an inferential role (Longuenesse 1998, 90–95)[^longuenesse-1998]—and for this reason Kant’s logical constants (i.e., all, some, this/the, affirmation, propositional negation, predicate-negation, the predicative copula, if-then, disjunction, necessarily, possibly, and actually) are defined strictly in terms of their specific roles in the propositional content of judgments, quite apart from the ways those judgments can enter into inferences (A69–76/B94–102). In recent years, however, *inferentialist* treatments of Kant’s theory of judgment and Kant’s logic, which treat the semantic contents and logical constants of judgment as essentially dependent on and determined by their inferential roles, have become increasingly popular and influential (see, e.g., Landy 2009 and Leech 2012)[^landy-2009].
    step1: |-
      鉴于判断的命题性内容所起的奠基性作用，容易看出，对康德来说判断的命题功能比其推理角色更基本——尽管每个判断确实扮演一个推理角色（Longuenesse 1998, 90–95）[^longuenesse-1998]——并且因此康德的逻辑常项（即：全称 all、特称 some、指示词 this/the、肯定、命题否定、谓词否定、谓述性系词、如果—那么、析取、必然、可能、实然）被严格地按它们在判断的命题性内容中的特定角色来定义，而与这些判断能以何种方式进入推理完全无关（A69–76/B94–102）。然而近年来，把判断与康德逻辑的语义内容和逻辑常项处理为本质上依赖并决定于其推理角色的*推理论*（inferentialist）处理方式，变得日益流行和有影响（参见，例如 Landy 2009 与 Leech 2012）[^landy-2009]。
