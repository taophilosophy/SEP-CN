  - id: 6
    kind: body
    source: |-
      According to Kant, a “judgment” (*Urteil*) is a specific kind of “cognition” (*Erkenntnis*)—which he generically defines as any conscious mental representation of an object (A320/B376)—that is the characteristic output of the “power of judgment” (*Urteilskraft*). The power of judgment, in turn, is a cognitive “capacity” (*Fähigkeit*) but also specifically a *spontaneous* and *innate* cognitive capacity, and in virtue of these it is the “faculty of judging” (*Vermögen zu urteilen*) (A69/B94), which is also the same as the “faculty of thinking” (*Vermögen zu denken*) (A81/B106).
    step1: |-
      依康德之见，“判断”（*Urteil*）是特定的一类“认识”（*Erkenntnis*）——他一般地把它界定为对对象的有意识心智表象（A320/B376）——它是“判断力”（*Urteilskraft*）的特征性产物。判断力则是一种认知“能力”（*Fähigkeit*），但具体说来又是一种*自发的*与*先天的*认知能力；正因如此，它是“判断的能力”（*Vermögen zu urteilen*）（A69/B94），也等同于“思维的能力”（*Vermögen zu denken*）（A81/B106）。
    step2: |-
      依康德之见，“判断”（*Urteil*）是特定的一类“认识”（*Erkenntnis*）——他一般地把认识界定为对对象的有意识心智表象（A320/B376）——即“判断力”（*Urteilskraft*）的特征性产物。判断力则是一种认知“能力”（*Fähigkeit*），但具体说来又是一种*自发的*、*先天的*认知能力；正因如此，它既是“判断的能力”（*Vermögen zu urteilen*）（A69/B94），也等同于“思维的能力”（*Vermögen zu denken*）（A81/B106）。
  - id: 7
    kind: body
    source: |-
      For Kant the mind is essentially active and vital—“the mind (*Gemüt*) for itself is entirely life (the principle of life itself)” (5: 278)—and a cognitive capacity in turn is a determinate conscious propensity of the mind to generate objective representations of certain kinds under certain conditions. What do spontaneity and innateness add to a mere *capacity* for cognition, so that it becomes a “*faculty* of cognition” (*Erkenntnisvermögen*)? A cognitive faculty is spontaneous in that whenever it is externally stimulated by raw unstructured sensory data as inputs, it then automatically organizes or “synthesizes” those data in an unprecedented way relative to those inputs, thereby yielding novel structured cognitions as outputs (B1–2, A50/B74, B132, B152). So cognitive spontaneity is a *structural creativity* of the mind with respect to its representations. It is a controverted question of recent Kant-interpretation whether cognitive spontaneity derives exclusively from the conceptual or discursive capacity of the rational human mind (B152) (Longuenesse 1998, chs. 1–3, 5, 8)[^longuenesse-1998], or can also derive independently from the intuitional, non-conceptual, or sensible capacity of the rational human mind, shared with minded non-rational human or non-human animals (B151) (Hanna 2006b, ch. 1, McLear 2011)[^hanna-2006b][^mclear-2011]. Correspondingly, it is also a controverted question whether according to Kant there is only one basic kind of synthesis, i.e., conceptual/discursive synthesis, or two basic kinds, i.e., conceptual/discursive synthesis and intuitional/non-conceptual/sensible synthesis. These controverted questions, in turn, are closely connected with the recent vigorous debate about Kant’s conceptualism vs. Kant’s non-conceptualism in relation to his theory of judgment, and the implications of this for interpreting and critically evaluating Kant’s transcendental idealism and the Transcendental Deduction of the Pure Concepts of the Understanding, a.k.a. “the Categories” (see the supplementary document [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md) and Sections 4.1 to 4.2 below).
    step1: |-
      对康德而言，心本质上是活动的、有生命的——“心（*Gemüt*）就其自身而言完全是生命（生命本身的原理）”（5: 278）——而认知能力则是心在特定条件下生成某类客观表象的一种确定的有意识倾向。自发性与先天性为单纯的认知*能力*增添了什么，使它成为认知“*机能*”（*Erkenntnisvermögen*）？认知机能是自发的，其意义是：每当它受未加结构的感性材料从外部刺激时，它就自动地以相对于那些输入而言前所未有的方式组织或“综合”这些材料，从而产出新的有结构认识（B1–2, A50/B74, B132, B152）。因此，认知自发性是心在其表象方面的*结构创造性*。晚近的康德解释中有一个有争议的问题：认知自发性是仅源自理性人心的概念性或推论性能力（B152）（Longuenesse 1998, chs. 1–3, 5, 8）[^longuenesse-1998]，还是也能独立地源自理性人心的直观性、非概念性或感性能力——后者与有心灵的非理性人或非人动物所共有（B151）（Hanna 2006b, ch. 1, McLear 2011）[^hanna-2006b][^mclear-2011]。相应地，按康德之见综合只有一种基本类型（即概念性/推论性综合），还是有两种基本类型（即概念性/推论性综合与直观性/非概念性/感性综合），同样是有争议的问题。这些有争议的问题又与晚近关于康德概念论与康德非概念论（相对于其判断理论）的激烈论辩密切相关，也与它对解释和批判地评估康德的先验观念论及纯粹知性概念（即“范畴”）的先验演绎有何意涵密切相关（见补充材料[同在性原则、康德的概念论与康德的非概念论](kant-judgment.supplement1.md)及下文 4.1–4.2 节）。
    step2: |-
      对康德而言，心本质上是活动的、有生命的——“心（*Gemüt*）就其自身而言完全是生命（生命本身的原理）”（5: 278）——认知能力则是心在特定条件下生成某类客观表象的一种确定的有意识倾向。那么，自发性与先天性为单纯的认知*能力*增添了些什么，使它成为认知“*机能*”（*Erkenntnisvermögen*）？认知机能之所以是自发的，是因为每当未加结构的感性材料从外部刺激它，它就自动地以相对于那些输入而言前所未有的方式组织或“综合”这些材料，从而产出新的有结构认识（B1–2, A50/B74, B132, B152）。可见，认知自发性是心在其表象方面的*结构创造性*。晚近的康德解释中有两个有争议的问题与其相关：其一，认知自发性是仅源自理性人心的概念性或推论性能力（B152）（Longuenesse 1998, chs. 1–3, 5, 8）[^longuenesse-1998]，还是也能独立地源自理性人心的直观性、非概念性或感性能力——后者与有心灵的非理性人或非人动物所共有（B151）（Hanna 2006b, ch. 1, McLear 2011）[^hanna-2006b][^mclear-2011]；其二，按康德之见，综合只有一种基本类型（概念性/推论性综合），还是有概念性/推论性综合与直观性/非概念性/感性综合两种。这两个问题又与晚近关于康德概念论与康德非概念论的激烈论辩密切相关，也与这场论辩对解释和批判地评估康德先验观念论及纯粹知性概念（即“范畴”）之先验演绎的意涵密切相关（见补充材料[同在性原则、康德的概念论与康德的非概念论](kant-judgment.supplement1.md)及下文 4.1–4.2 节）。
