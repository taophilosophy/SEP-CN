      Kant’s distinction between analytic and synthetic judgments is the historical origin of, and therefore significantly related to, but—crucially—not precisely equivalent, either in intension or extension, with the nowadays more familiar analytic-synthetic distinction, according to which (1) analyticity is truth by virtue of linguistic meaning alone, exclusive of empirical facts, (2) syntheticity is truth by virtue of empirical facts, and (3) the necessary statement vs. contingent statement distinction is formally and materially equivalent to the analytic-synthetic distinction. By 1950 this more familiar distinction was accepted as gospel truth by virtually all analytic philosophers: but in the two decades after the publication of W.V.O. Quine’s iconoclastic “Two Dogmas of Empiricism” in 1951 (Quine 1961)[^quine-1961], it was gradually replaced by the new-and-improved post-Quinean gospel truth that there is no such thing as an acceptable analytic-synthetic distinction. This plain historical fact is closely related to the highly regrettable further fact that Kant’s analytic-synthetic distinction is nowadays often wrongly interpreted (i) in terms of the more familiar and now largely discredited analytic-synthetic distinction, and also (ii) as reducible to an epistemic distinction between uninformatively or trivially true a priori judgments and informative judgments. Ironically Frege, the father or grandfather of analytic philosophy, was much nearer the mark in the *Foundations of Arithmetic* when he correctly construed Kant’s theory of analyticity *semantically*, as a theory about necessary internal relations between concepts; although at the same time he not quite so correctly said that Kantian analyticity boils down to “simply taking out of the box again what we have just put into it” (Frege 1953, 101)[^frege-1953]. Frege’s 19th century characterization of Kantian analyticity, it turns out, has significant parallels with the 18th century Leibnizian and Wolffian theories of conceptual and/or logical truth that heavily influenced Kant’s work on analyticity (Anderson 2015)[^anderson-2015]. Backing away now from Frege and the Leibniz-Wolff tradition, however, the crucial fact is that Kant’s analytic-synthetic distinction concerns two irreducibly different kinds of semantic content within objectively valid propositions (Hanna 2001, chs. 3–4)[^hanna-2001], and this distinction is neither primarily epistemic in character (although it does have some important epistemic implications [Hanna 2006b, 362–379])[^hanna-2006b] nor does it specifically concern the logical form of judgments (4: 266).
    step1: |-
      康德对分析判断与综合判断的区分，是今日更为人熟悉的分析—综合区分的历史来源，因而与之有重要关联——但关键在于，无论在外延还是内涵上都不与它精确等价。今日更熟悉的区分主张：(1) 分析性是仅凭语言意义的真，排除经验事实；(2) 综合性是凭经验事实的真；(3) 必然陈述与偶然陈述的区分在形式与实质上都等价于分析—综合区分。到 1950 年，这一更熟悉的区分已被几乎所有分析哲学家奉为福音真理。但在 1951 年 W.V.O. 蒯因标新立异的《经验主义的两个教条》发表（Quine 1961）[^quine-1961]之后的二十年间，它逐渐被一种新的、改良的后蒯因福音真理所取代：根本不存在可接受的分析—综合区分。这一平实的历史事实，与另一件令人深为遗憾的事实紧密相关：如今康德的分析—综合区分常被错误地解读为 (i) 依据那个更为人熟悉、如今已大失信誉的分析—综合区分来解读，而且 (ii) 被解读为可还原为一种认识论区分，即不提供信息或平凡为真的先天判断与提供信息的判断之间的区分。吊诡的是，弗雷格——分析哲学的父亲或祖父——在《算术基础》中反而更接近真理：他正确地*从语义上*把康德的分析性理论解读为关于概念之间必然内部关系的理论；尽管与此同时，他又不太正确地说康德的分析性归根结底是“把刚放进盒子里的东西再取出来”（Frege 1953, 101）[^frege-1953]。事实证明，弗雷格对康德分析性的这一 19 世纪刻画，与 18 世纪莱布尼茨式和沃尔夫式的概念真理和/或逻辑真理理论有重要平行之处，而后者深深影响了康德关于分析性的工作（Anderson 2015）[^anderson-2015]。不过，暂且离开弗雷格与莱布尼茨—沃尔夫传统，关键的事实是：康德的分析—综合区分涉及客观有效命题之内两种不可还原地不同的语义内容（Hanna 2001, 第 3–4 章）[^hanna-2001]，而且这一区分既不主要具有认识论性质（尽管它确实有某些重要的认识论蕴含［Hanna 2006b, 362–379］）[^hanna-2006b]，也不特定地涉及判断的逻辑形式（4: 266）。
    step2: |-
      康德对分析判断与综合判断的区分，是如今更常见的分析—综合区分的历史源头，故与后者有重要关联——但关键在于，二者无论内涵还是外延都不精确等价。更常见的区分主张：(1) 分析性是仅凭语言意义而为真，不含经验事实；(2) 综合性是凭经验事实而为真；(3) 必然陈述与偶然陈述之区分在形式与实质上都等价于分析—综合区分。到 1950 年，几乎所有分析哲学家都把这一区分奉为福音真理。但 W.V.O. 蒯因 1951 年那篇立异之作《经验主义的两个教条》（Quine 1961）[^quine-1961]发表后的二十年间，它逐渐被一条新的、升级版的后蒯因福音真理取代：根本不存在可接受的分析—综合区分。这条平实的历史事实，同另一件令人至为遗憾的事实紧密相连：如今康德的分析—综合区分常被误读为 (i) 依那个更常见、如今已大失信誉的区分来解读，(ii) 并可还原为一种认识论区分——不提供信息或平凡为真的先天判断与提供信息的判断之间的区分。吊诡的是，分析哲学之父或祖父弗雷格在《算术基础》里反而更接近实情：他正确地*从语义上*把康德的分析性理论解读为关于概念间必然内部关系的理论；尽管他随后又不太正确地说，康德式分析性归根结底不过是“把刚放进盒子的东西再取出来”（Frege 1953, 101）[^frege-1953]。事实证明，弗雷格这一 19 世纪对康德分析性的刻画，与 18 世纪莱布尼茨—沃尔夫的概念真理和/或逻辑真理理论颇有平行之处，而康德关于分析性的工作深受后者影响（Anderson 2015）[^anderson-2015]。然而，暂且退离弗雷格与莱布尼茨—沃尔夫传统：关键事实是，康德的分析—综合区分关涉客观有效命题之内两种不可还原地不同的语义内容（Hanna 2001, 第 3–4 章）[^hanna-2001]；这一区分既不主要是认识性的（尽管它确有若干重要认识论蕴含［Hanna 2006b, 362–379］）[^hanna-2006b]，也不专门关涉判断的逻辑形式（4: 266）。
