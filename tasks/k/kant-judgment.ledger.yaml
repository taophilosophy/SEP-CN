      正如知性与感性受想象力自下而上的认知加工所*辅助*，它们也反过来受“理性”（*Vernunft*）机能自上而下的认知加工所*统领*：理性产生逻辑推理，作出实用或道德的选择与决定（即“实践判断”），把连贯性与一致性加于各类认识，并且最重要的是，以法则式“原理”（*Principien*, *Grundsätze*）的形式辨识并实施诸如必然真理与无条件义务之类具有强模态性与绝对规范性的概念（A299–304/B355–361, A800–804/B828–832）。
