      The modern conception of logical form—as found, e.g., in the symbolic and mathematical logic of Gottlob Frege’s *Begriffsschrift* (“Conceptual Notation”) (Frege 1972)[^frege-1972], Bertrand Russell and A.N. Whitehead’s *Principia Mathematica* (Whitehead and Russell 1962)[^whitehead-1962], and Ludwig Wittgenstein’s *Tractatus Logico-Philosophicus* (Wittgenstein 1922)[^wittgenstein-1922]—owes much to Kant’s conception of logical form, if not so very much to his particular conception of logic, which from a contemporary point of view can seem “terrifyingly narrow-minded and mathematically trivial,” as Allen Hazen has drily put it (Hazen 1999)[^hazen-1999]. On the other hand, however, it is clearly true that Kant’s conception of *mathematical* form, which is found in his theory of pure or formal intuition, substantially influenced Wittgenstein’s view of logical form in the *Tractatus* (Wittgenstein 1922, props. 2.013, 5.552, 5.61, and 6.13)[^wittgenstein-1922]. There is an ongoing scholarly debate about whether Kant’s conception of mathematical form is a direct expression of the narrow-mindedness of his logical theory, or instead a direct expression of the striking originality of his philosophy of mathematics (Parsons 1983, Friedman 1992, Shabel 2003, Hanna 2006b, ch. 6, Shabel 2006)[^friedman-1992][^hanna-2006b][^shabel-2003][^shabel-2006]. But even more importantly, Kant’s deep idea *that logic and logical form can exist only in the context of the judging activities and judging capacities of rational human animals*, has heavily influenced some heavily influential philosophers of logic, linguists, philosophers of language, and cognitive scientists from Boole and Wilhelm von Humboldt (Von Humboldt 1988)[^von-1988], to Frege, the later Wittgenstein, and Noam Chomsky (Wittgenstein 1953, para. 241–242, Chomsky 1975, Bell 1979, Bell 1987)[^bell-1979][^bell-1987][^chomsky-1975][^wittgenstein-1953].
    step1: |-
      逻辑形式的现代构想——例如见于戈特洛布·弗雷格的 *Begriffsschrift*（《概念文字》）（Frege 1972）[^frege-1972]、伯特兰·罗素与 A.N. 怀特海的 *Principia Mathematica*（《数学原理》）（Whitehead and Russell 1962）[^whitehead-1962]以及路德维希·维特根斯坦的 *Tractatus Logico-Philosophicus*（《逻辑哲学论》）（Wittgenstein 1922）[^wittgenstein-1922]中的构想——在很大程度上归功于康德的逻辑形式构想，尽管归功于他特定的逻辑构想的成分要少得多；从当代的观点看，后者可以显得“狭隘得可怕、在数学上平淡无奇”，正如艾伦·黑森干巴巴地所说（Hazen 1999）[^hazen-1999]。然而另一方面，明确为真的是：康德的*数学*形式构想——见于他的纯粹直观或形式直观理论——实质性地影响了维特根斯坦在《逻辑哲学论》中的逻辑形式观（Wittgenstein 1922, 命题 2.013, 5.552, 5.61 与 6.13）[^wittgenstein-1922]。关于康德的数学形式构想究竟是他的逻辑理论之狭隘性的直接表达，还是他的数学哲学之惊人原创性的直接表达，存在一场持续的学术争论（Parsons 1983, Friedman 1992, Shabel 2003, Hanna 2006b 第6章, Shabel 2006）[^friedman-1992][^hanna-2006b][^shabel-2003][^shabel-2006]。但更重要的是，康德的深刻思想——*逻辑与逻辑形式只能存在于理性人类动物的判断活动与判断能力的语境之中*——深刻影响了从布尔与威廉·冯·洪堡（Von Humboldt 1988）[^von-1988]到弗雷格、后期维特根斯坦与诺姆·乔姆斯基的一些极具影响力的逻辑哲学家、语言学家、语言哲学家与认知科学家（Wittgenstein 1953, 第241–242节, Chomsky 1975, Bell 1979, Bell 1987）[^bell-1979][^bell-1987][^chomsky-1975][^wittgenstein-1953]。
    step2: |-
      逻辑形式的现代构想——如见于弗雷格的 *Begriffsschrift*（《概念文字》）（Frege 1972）[^frege-1972]、罗素与怀特海的 *Principia Mathematica*（《数学原理》）（Whitehead and Russell 1962）[^whitehead-1962]、维特根斯坦的 *Tractatus Logico-Philosophicus*（《逻辑哲学论》）（Wittgenstein 1922）[^wittgenstein-1922]者——在很大程度上受惠于康德的逻辑形式构想，尽管受惠于他那一特定逻辑构想的成分要少得多；从当代视角看，后者可以显得“狭隘得可怕、在数学上无足轻重”，正如艾伦·黑森干巴巴地评说道（Hazen 1999）[^hazen-1999]。然而另一方面，有一点确凿无疑：康德见于其纯粹直观或形式直观理论中的*数学*形式构想，实质性地影响了维特根斯坦在《逻辑哲学论》（*Tractatus*）中的逻辑形式观（Wittgenstein 1922, 命题 2.013, 5.552, 5.61 与 6.13）[^wittgenstein-1922]。康德的数学形式构想究竟是其逻辑理论之狭隘性的直接表达，抑或其数学哲学之惊人原创性的直接表达，学界至今争论不休（Parsons 1983, Friedman 1992, Shabel 2003, Hanna 2006b 第6章, Shabel 2006）[^friedman-1992][^hanna-2006b][^shabel-2003][^shabel-2006]。但更要紧的是，康德这一深刻思想——*逻辑与逻辑形式只能存在于理性人类动物的判断活动与判断能力的语境之中*——深刻影响了自布尔与威廉·冯·洪堡（Von Humboldt 1988）[^von-1988]以降，直至弗雷格、后期维特根斯坦与乔姆斯基的一众极具影响力的逻辑哲学家、语言学家、语言哲学家与认知科学家（Wittgenstein 1953, 第241–242节, Chomsky 1975, Bell 1979, Bell 1987）[^bell-1979][^bell-1987][^chomsky-1975][^wittgenstein-1953]。
