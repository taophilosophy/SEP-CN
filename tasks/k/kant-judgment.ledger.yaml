      Understanding and sensibility are both subserved by the faculty of “imagination” (*Einbildungskraft*), which when taken generically is the source or engine of all sorts of synthesis, but which when taken as a “dedicated” or task-sensitive cognitive faculty, construed as either “productive” or “reproductive,” more specifically generates (α) the spatial and temporal forms of intuition, (β) novel mental imagery in conscious sensory states, (γ) reproductive imagery or memories, and (δ) “schemata,” which are supplementary rules for interpreting general conceptual rules in terms of more specific figural (spatiotemporal) forms and sensory images (A78/B103, B151, A100–102, A137–142/B176–181) (7: 167). At least in principle, then, the imagination mediates between the understanding and the sensibility by virtue of being an autonomous third basic cognitive capacity containing elements of each of the basic dual capacities (see,e.g., A115–119 and A139–142/B178–181)—which would, in effect, make Kant a cognitive-capacity *trinitarian*. But sometimes, contrariwise and somewhat incoherently, Kant seems instead to say that the imagination at once (i) *belongs* to sensibility and yet also (ii) *is caused* by the action of the understanding on sensibility. This deep unclarity about the nature of the imagination, in addition to being a flashpoint for important longstanding disagreements in Kant-scholarship on his theory of judgment (see, e.g., Heidegger 1990, Waxman 1991, Longuenesse 1998)[^heidegger-1990][^longuenesse-1998][^waxman-1991], also has some serious implications for Kant’s theory of judgment itself (again, see the supplementary document [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md) and Sections 4.1 to 4.2 below).
    step1: |-
      知性与感性都受“想象力”（*Einbildungskraft*）机能的辅助：就一般意义而言，想象力是一切综合的源泉或引擎；但作为“专任的”或依任务而定的认知机能（无论是“生产性的”还是“再生性的”）时，它更具体地生成 (α) 直观的空间与时间形式，(β) 有意识感官状态中的新心智意象，(γ) 再生性意象或记忆，以及 (δ) “图型”——即用更具体的图形（时空）形式与感官意象来解释一般概念规则的补充规则（A78/B103, B151, A100–102, A137–142/B176–181）（7: 167）。因此，至少在原则上，想象力通过作为包含两种基本二元能力各自要素的自主的第三种基本认知能力，而在知性与感性之间起中介作用（例如见 A115–119 与 A139–142/B178–181）——这实际上会使康德成为认知能力的*三位论者*。但有时相反，而且有些不一致：康德似乎反而说，想象力 (i) *属于*感性，却又 (ii) *由*知性对感性的作用*所引起*。这种关于想象力本性的深层含混，除了是康德学界在其判断理论上长期重要分歧的引爆点之外（见如 Heidegger 1990, Waxman 1991, Longuenesse 1998）[^heidegger-1990][^longuenesse-1998][^waxman-1991]，本身对康德的判断理论也有一些严重意涵（同样见补充材料[同在性原则、康德的概念论与康德的非概念论](kant-judgment.supplement1.md)及下文 4.1–4.2 节）。
