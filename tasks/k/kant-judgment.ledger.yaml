      So analytic and synthetic a priori judgments sharply differ not only in the nature of their semantic content (i.e., concept-based/truth-functional-logic-based/monadic-predicate-logic-based vs. intuition-based) but also in their modal scope (true in all logically possible worlds vs. true in all and only humanly experienceable worlds and truth-valueless otherwise). Nevertheless, despite this sharp difference in modal scope—from which it follows, perhaps surprisingly, that for Kant there are logically possible worlds in which synthetic a priori propositions such as “7+5=12” are thinkably deniable—since synthetic a priori judgments are *either true or truth-valueless in every logically possible world*, it also follows that they are *never false in any logically possible world* and thus satisfy Kant’s general definition of a necessary truth, i.e., that a proposition is necessary if and only if it is strictly universally true, in that it is true in every member of a complete class of possible worlds and has no possible counterexamples or falsity-makers (Hanna 2001, ch. 5)[^hanna-2001]. Less abstractly and gallumphingly put, a synthetic a priori judgment is *a necessary truth with a human face*.
    step1: |-
      因此，分析的与先天的综合判断不仅在其语义内容的本性上判然有别（基于概念/基于真值函项逻辑/基于一元谓词逻辑 vs. 基于直观），而且在模态范围上也有别（在所有逻辑可能世界中为真 vs. 在所有且仅有的人类可经验世界中为真、此外无真值）。然而，尽管模态范围上有这一尖锐差异——由此得出、或许令人惊讶的结论是：对康德而言，存在一些逻辑可能世界，其中像“7+5=12”这样的先天综合命题是可以设想地否认的——但由于先天综合判断*在每个逻辑可能世界中要么为真要么无真值*，同样可知它们*在任何逻辑可能世界中都绝不虚假*，从而满足康德对必然真理的一般定义，即：一个命题是必然的，当且仅当它严格普遍地为真，亦即它在可能世界的完备类的每个成员中都为真，且没有任何可能的反例或为假制造者（Hanna 2001, 第 5 章）[^hanna-2001]。说得少一点抽象、也少一点笨重：先天综合判断是*一张有着人类面孔的必然真理*。
    step2: |-
      因此，分析判断与先天综合判断不仅语义内容之本性判然有别（前者基于概念/真值函项逻辑/一元谓词逻辑，后者基于直观），模态范围亦然（前者在所有逻辑可能世界中为真，后者在所有且仅有的人类可经验世界中为真、此外无真值）。然而，尽管模态范围上有这一尖锐差异——由此得出一个或许令人惊讶的结论：对康德而言，存在一些逻辑可能世界，其中“7+5=12”这样的先天综合命题是可以在思想上否认的——但由于先天综合判断*在每个逻辑可能世界中要么为真要么无真值*，同样可知它们*在任何逻辑可能世界中都绝不虚假*，从而满足康德关于必然真理的一般定义：一个命题是必然的，当且仅当它严格普遍地为真，即在可能世界完备类的每个成员中都为真，且没有任何可能的反例或为假制造者（Hanna 2001, 第 5 章）[^hanna-2001]。说得直白些（少些抽象与笨重）：先天综合判断是*有着人类面孔的必然真理*。
