      Transcendental idealism is the conjunction of two theses: (1) *cognitive idealism*, which says that all the proper objects of human cognition are nothing but mind-dependent sensory appearances or phenomena, not things-in-themselves or noumena (A369), and (2) *representational transcendentalism*, which says that all representations and their contents necessarily conform to the forms or structures of our innate spontaneous cognitive capacities (Bxvi, A11/B25) (4: 373 n.). There are weaker and stronger interpretations of these theses (see, e.g., Allais 2015)[^allais-2015], but in any case transcendental idealism in its *strongest* version directly entails that all the objects of human experience are token-identical with objectively-valid sensory representational contents:
