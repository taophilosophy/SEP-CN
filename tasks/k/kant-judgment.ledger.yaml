      ### 4.2 The top-down problem: judgment, transcendental affinity, and the systematic unity of nature
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The bottom-up problem has a metaphysical mirror-image, which can be called *the top-down problem*. This problem afflicts Kant’s transcendental doctrine of judgment, and consequently also his theory of the principles of pure understanding (see the supplement [Completing the Picture of Kant’s Metaphysics of Judgment](kant-judgment.supplement5.md)). The worry here is simply that even allowing for the transcendental schematism of the judgment, there is still no absolute guarantee that a given universal transcendental principle or transcendental concept of the understanding, construed as a rule for ordering sensory appearances or sensory objects, has been *completely* applied to sensory appearances or objects. In other words, even allowing for his transcendental doctrine of the judgment, Kant has not given us good reason to think that there cannot be any sensory appearances or objects that fail to be subsumed under the transcendental principles of nature. In the *Critique of Pure Reason*, Kant calls the specifically causal-law-governed or nomological interconnection of all sensory appearances or objects under transcendental principles the “transcendental affinity”of the sensory manifold of intuitions (A114). In the A edition of the first Critique, Kant asserts that if the categories are objectively valid, then the transcendental affinity of the manifold automatically follows. Then, assuming the strongest version of transcendental idealism, he further asserts that from transcendental affinity, an “empirical affinity” of the sensory manifold of intuitions also directly follows (A115). Now since empirical affinity is the complete application to actual empirical nature of the system of causal laws under transcendental principles, it follows that empirical affinity is the same as *the systematic unity of nature*. So Kant is saying that the systematic unity of nature is a trivial consequence of transcendental affinity.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      In the first *Critique*’s Appendix to the Transcendental Dialectic however, Kant quietly but very significantly backtracks on this crucial point and treats the principle of the systematic unity of nature as stemming only from a *regulative* but not a constitutive use of judgment, although this principle is also asserted to have some sort of transcendental force (see the supplement [Kinds of Use](kant-judgment.supplement4.md)). Then in the first Introduction to the *Critique of the Power of Judgment*, Kant explicitly says that
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      > [it] is quite possible in itself (at least as far as the understanding can make out a priori), [that] the multiplicity of these [empirical] laws, along with the natural forms corresponding to them, being infinitely great, [could] … present to us a raw chaotic aggregate and not the least trace of a system, even though we must presuppose such a system in accordance with transcendental laws. (20: 209)
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      In other words, now Kant is saying that the transcendental affinity of the manifold does *not* entail an empirical affinity of the manifold or the systematic unity of nature. To be sure, in the third *Critique*, he also explicitly ties together the principle of systematic unity with the regulative use of reflective judgments of taste, and says that it is a subjectively necessary transcendental principle presupposed by legitimate judgments of taste (see the supplement [Kinds of Use](kant-judgment.supplement4.md)). But if the principle of systematic unity is only subjectively and not in fact *objectively* necessary, then Kant has *not* shown us that the system of causal laws of nature *must be* completely applied to sensory appearances or objects. Rather he has shown only that we *must epistemically believe it to be* completely applied to sensory appearances or objects. So there remains the real possibility of relatively or absolutely chaotic aggregates of sensory appearances or objects that are not subsumed or even in principle cannot be subsumed under the transcendental affinity of the manifold, i.e., the real possibility of the categorial anarchy of rogue objects. In other words, for all that Kant has argued, and by his own reckoning, even assuming transcendental affinity there might still be no complete application of transcendental laws to nature. So the transcendental schematism of the pure concepts is insufficient to bridge the gap between categories and sensory appearances, and the transcendental doctrine of judgment fails.
    step1: TBD
    step2: TBD
