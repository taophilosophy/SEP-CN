      The basic parts of Kant’s theory of judgment are now all in place. In this concluding section, we will look briefly at several serious problems for Kant’s theory. These problems, which come to a head in the debate about Kant’s conceptualism vs. Kant’s non-conceptualism (see the supplementary document [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md)), all ultimately stem from the interplay between either the centrality thesis or the priority-of-the-proposition thesis, and the transcendental ideality thesis. This in turn suggests that the other two parts of Kant’s theory can be logically detached from his transcendental idealism and defended independently of it.
