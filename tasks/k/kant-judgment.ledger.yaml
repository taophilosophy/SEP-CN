      As mentioned in Section 1, every judgment for Kant has an intrinsic logical form. These logical forms correspond one-to-one to the pure concepts of the understanding or categories, a claim which is argued-for in what Kant calls the **metaphysical deduction** of the categories (A76–83/B102–109, B159). On the basis of this, it is possible to argue that all concepts, whether pure or empirical, have a logical ground (Newton 2015)[^newton-2015]. In any case, the total set of such logical forms/pure concepts is the “table of judgments,” which Kant also describes as “the functions of unity *in judgments*” (A69/B94, emphasis added). He does this in order to draw special attention to the fact that for him the very idea of a logical form/pure concept is essentially judgment-based: logical form is nothing but the intrinsic logico-syntactic and logico-semantic form *of* and *in* a proposition. So for Kant the propositional content of a judgment is more explanatorily basic than its logical form or pure-conceptual structure.
    step1: |-
      如第1节所述，对康德来说每个判断都有一种内在的逻辑形式。这些逻辑形式与知性纯粹概念即范畴一一对应，这一主张在康德所谓范畴的**形而上学演绎**中得到论证（A76–83/B102–109, B159）。在此基础上，可以论证一切概念——无论纯粹的还是经验的——都有一个逻辑根据（Newton 2015）[^newton-2015]。无论如何，这类逻辑形式／纯粹概念的集合就是“判断表”，康德也把它描述为“判断中的统一性功能”（A69/B94，着重为引者所加）。他这样做是为了特别提醒人们注意：对他来说，逻辑形式／纯粹概念这一观念本质上是以判断为基础的：逻辑形式无非是命题之中和命题之上的内在逻辑-句法与逻辑-语义形式。因此对康德来说，判断的命题性内容比其逻辑形式或纯粹概念结构在解释上更为基本。
    step2: |-
      如第 1 节所述，对康德来说每个判断都有一种内在的逻辑形式。这些逻辑形式与知性纯粹概念（范畴）一一对应；这一主张在康德所谓范畴的**形而上学演绎**中得到论证（A76–83/B102–109, B159）。在此基础上可以论证：一切概念——无论纯粹或经验——都有一个逻辑根据（Newton 2015）[^newton-2015]。无论如何，这类逻辑形式／纯粹概念的总体就是“判断表”，康德又将其描述为“*判断中的*统一性功能”（A69/B94，着重为引者所加）。他之所以如此，是要特别提请注意：在他看来，逻辑形式／纯粹概念这一观念本质上以判断为基础——逻辑形式无非是命题的内在逻辑-句法与逻辑-语义形式，存在于命题之中。故对康德而言，判断的命题性内容比其逻辑形式或纯粹概念结构在解释上更为基本。
