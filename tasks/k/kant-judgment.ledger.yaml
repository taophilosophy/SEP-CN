      By contrast, all judgments that are not objectively valid are “empty” (*leer*) or truth-valueless. Nevertheless, it must be noted that for Kant empty judgments can still be rationally intelligible and not in any way nonsensical, if all the concepts contained within them are at least logically consistent or “thinkable” (Bxxvi n.). In this way, e.g., some judgments containing concepts of noumenal objects (things-in-themselves, or real essences) or noumenal subjects (rational-agents-in-themselves, or persons) are empirically meaningless and truth-valueless, hence empty, yet *also* are rationally intelligible targets of what Kant calls “doctrinal” belief (see the supplementary document [Judging, Believing, and Scientific Knowing](kant-judgment.supplement2.md)), and even, at least from a certain Critical meta-philosophical standpoint, essential both to Kant’s theoretical metaphysics (A254–255/B309–310, A650–654/B678–682) and also to his practical metaphysics of freedom and morality (A530–558/B566–586).
    step1: |-
      相比之下，一切不客观有效的判断都是“空的”（*leer*）或无真值的。然而必须注意，对康德来说，如果一个空判断所包含的所有概念至少在逻辑上一致或“可思想”（Bxxvi n.），它仍然可以是理性上可理解的、绝非无意义的胡说。以此方式，例如，某些包含本体对象（物自身或实在本质）概念或本体主体（自存的理性行动者或人格）概念的判断，在经验上无意义且无真值，因而是空的，然而*也*是康德所谓“教义性”信念的理性上可理解的目标（参见补充文献 [判断、信念与科学认识](kant-judgment.supplement2.md)），甚至——至少从某种批判的元哲学立场看——对康德的理论形而上学（A254–255/B309–310, A650–654/B678–682）和他的自由与道德的实践形而上学（A530–558/B566–586）都是本质性的。
    step2: |-
      相比之下，一切不客观有效的判断都是“空的”（*leer*）、无真值的。但必须注意：对康德而言，若一个空判断所含的全部概念至少逻辑上融贯或“可思想”（Bxxvi n.），它仍可以是理性上可理解的，绝非无意义的呓语。例如，某些含有本体对象（物自身或实在本质）概念或本体主体（自身中的理性行动者或人格）概念的判断，在经验上无意义且无真值，故而是空的，却*同时*是康德所谓“教义性”信念的理性上可理解的目标（参见补充文献 [判断、信念与科学认识](kant-judgment.supplement2.md)），甚至——至少从某种批判的元哲学立场看——对康德的理论形而上学（A254–255/B309–310, A650–654/B678–682）与他的自由和道德的实践形而上学（A530–558/B566–586）都是本质性的。
