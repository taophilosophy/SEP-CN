  - id: 41
    kind: body
    source: |-
      First, pure general logic is sharply distinct from *transcendental* logic, in that, although both logics are pure and a priori, whereas pure general logic is “general” in that it is strictly underdetermined by all objectively valid representational contents and also abstracts away from all specific or particular differences between represented objects, hence is *ontically unrestricted*, nevertheless transcendental logic is “special” in that it is *ontically restricted*, i.e., objectually-committed, and thereby presupposes the existence of certain specific categories or kinds (including natural kinds) of objects (A55–57/B79–82). In this way, transcendental logic presupposes pure general logic, and is synthetic a priori, not analytic. Some recent Kant-commentators, however, have argued that on the contrary, pure general logic presupposes transcendental logic (see, e.g., Rödl 2008, Tolley 2012)[^tolley-2012], on the grounds that for Kant, thought by its very nature is object-directed. But the generality and inherently formal character of pure general logic is fully consistent with its being objectively valid: hence the fact that thought by its very nature is *object-directed* does not by itself imply that the logic governing thought is *ontically restricted* or objectually-committed.
    step1: |-
      首先，纯粹一般逻辑与*先验*逻辑判然有别：两种逻辑虽然都是纯粹的、先天的，但纯粹一般逻辑之所以是“一般的”，在于它严格地不被一切客观有效的表象内容所规定，并且抽离一切被表象对象之间的特殊或个别差异，因而是*存在论上无限制的*（ontically unrestricted）；而先验逻辑之所以是“特殊的”，在于它是*存在论上受限制的*（ontically restricted），即对对象有所承诺，从而预设了某些特定范畴或种类的对象（包括自然种类）的存在（A55–57/B79–82）。这样一来，先验逻辑预设纯粹一般逻辑，并且是综合先天的，而非分析的。然而近来一些康德注释者反而论证说，纯粹一般逻辑预设先验逻辑（参见如 Rödl 2008、Tolley 2012）[^tolley-2012]，其理由是：对康德而言，思想就其本性而言是指向对象的。但纯粹一般逻辑的一般性与内在形式性品格，与它具有客观有效性完全相容：因此，思想就其本性而言是*指向对象的*，这一点本身并不蕴涵支配思想的逻辑是*存在论上受限制的*或对对象有所承诺。
