      但综合性又当如何？既然对康德而言分析—综合区分是穷尽的——每一命题要么分析要么综合、不可兼得——他的两分分析性学说便相应给出两分的否定性综合性学说：一个命题是综合的，当且仅当其真*不*单独由其概念微结构或概念外延间的关系严格决定，也不单独由真值函项逻辑或一元谓词逻辑严格决定（对康德而言，这一表达力范围由判断表与知性纯粹概念表刻画）；一个判断综合地为真，当且仅当它为真且其否定*不*蕴涵矛盾。但这一否定性刻画当然未告诉我们：综合判断的真究竟正面地在于什么。为回答此问，康德把综合性的语义学与直观的语义学直接相连，恰如他把分析性的语义学与概念的语义学（包括经验概念与知性纯粹概念二者）直接相连。正面地说：一个判断是综合的，当且仅当其意义与真被其构成直观严格决定——无论经验直观还是纯粹直观（A8, A154–155/B193–194, A721/B749）（8: 245）（11: 38）。这既不是说综合判断不含任何概念（事实上它们总是*含有*经验概念或纯粹概念），甚至也不是说其概念成分与意义或真无关（事实上经验概念或纯粹概念在语义上总是*相关的*），而只是说：在综合判断中*严格决定*其意义与真的是直观成分，而非经验概念成分或纯粹概念成分。简言之，综合判断是*基于直观的命题*。
