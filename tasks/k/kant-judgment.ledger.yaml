      Despite the superficial differences in emphasis and formulation, these six characterizations all converge on the same basic account: a judgment is a higher-order complex conscious cognition that refers to objects either directly (via the essentially indexical content of intuitions/non-conceptual cognitions)or indirectly (via the essentially attributive or descriptive content of concepts); in which concepts are predicated either of those objects or of other constituent concepts; in which concepts are intrinsically related to one another and to intuitional/non-conceptual cognitions by pure general logical forms/pure concepts of the understanding that express various modifications and, apparently, truth-functional compounds of the predicative copula; which enters into inferences according to a priori laws of pure general logic; which essentially involves both the following of rules and the application of rules to the perceptual objects picked out by intuition/non-conceptual cognition; and in which a composite objective representation is generated and unified by the higher-order executive mental processing of a single self-conscious rational subject. The crucial take-away points here are (a) a judgment’s referential bottoming-out in intuitions/non-conceptual cognitions, which thereby constitute directly-referential singular terms in singular categorical judgments, that cannot be semantically replaced by individual concepts or definite descriptions without change or loss of meaning (contrast, e.g., Thompson 1972 and Hanna 2001, ch. 4)[^hanna-2001][^thompson-1972], (b) the “privileging of predication” (Longuenesse 1998, 104)[^longuenesse-1998] over other sorts of logical operations, (c) the intrinsic logico-syntactic and logico-semantic form of the judgment, based on modifications or compound truth-functional relations of the predicative copula, (d) the rule-like character of the judgment, (e) the judgment’s unified conscious objective representational (i.e., semantic) content, and above all (f) its higher-order rationally self-conscious ground of objective unity. As such, Kantian judgments are *neither* merely psychological objects or processes (as in psychologistic theories of judgment), *nor* are they essentially mind-independent, abstract objects (as in platonistic theories of judgment), *nor* again are they inherently assertoric takings of propositions to be true (as, e.g., in Frege’s theory of judgment). Instead, Kantian judgments are intersubjectively shareable, rationally communicable, cognitively-generated mental-act structures or types whose logically-structured truth-apt semantic contents can be the targets of many different kinds of epistemic or non-epistemic propositional attitudes.
    step1: |-
      撇开侧重点与表述上的表面差异，这六种刻画全都汇聚于同一个基本说明：判断是一种高阶复合的有意识认识，它或直接（经由直观／非概念认识本质上指示性的内容）或间接（经由概念本质上归属性的或描述性的内容）指涉对象；在其中概念或者被谓述于那些对象，或者被谓述于其他构成性概念；在其中诸概念凭借纯粹普通逻辑形式／知性纯粹概念而彼此内在相关、并与直观／非概念认识内在相关，这些形式／概念表达谓述性系词的各种变体以及显然的真值函项复合；判断依据纯粹普通逻辑的先天法则进入推理；判断本质上既包含遵循规则，也包含把规则应用于由直观／非概念认识所拣选的知觉对象；并且在其中一种复合的客观表象由单一自我意识的理性主体的高阶执行性心理加工所生成和统一。这里的关键要点是：(a) 判断在直观／非概念认识中的指涉底线，它们因此在单称定言判断中构成直接指涉的单称词项，这些词项在语义上不能被个体概念或确定摹状词在不改变或不损失意义的情况下替换（对比，例如，Thompson 1972 与 Hanna 2001 第4章）[^hanna-2001][^thompson-1972]；(b) 优先于其他类型逻辑操作的“谓述的优先地位”（Longuenesse 1998, 104）[^longuenesse-1998]；(c) 判断的内在逻辑-句法与逻辑-语义形式，基于谓述性系词的变体或复合真值函项关系；(d) 判断的类规则性质；(e) 判断的统一的、有意识的客观表象（即语义）内容；尤其是 (f) 判断的客观统一的高阶理性自我意识根据。因此，康德式判断*既非*单纯的心理对象或过程（如判断的心理主义理论所主张），*亦非*本质上独立于心灵的抽象对象（如判断的柏拉图主义理论所主张），*同样非*对命题之为真的内在断言式接受（如弗雷格的判断理论）。毋宁说，康德式判断是主体间可分享的、理性上可传达的、认知上生成的心理行为结构或类型，其具有逻辑结构的、可论真假的语义内容可以成为许多不同种类的认识性或非认识性命题态度的指向目标。
