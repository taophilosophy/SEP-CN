      So much for truth-valuedness: but what is truth? According to Kant, truth is a predicate of whole judgments, and not a predicate of the representational proper parts of judgments, i.e., intuitions/non-conceptual cognitions and concepts (A293/B350). Furthermore we already know that objective validity is a necessary but not sufficient condition of the truth of a judgment. Kant also holds that logical consistency is a necessary but not sufficient condition of the truth of a judgment (A60/B85). Most importantly however, according to Kant the “nominal definition” of truth is that it is the “agreement” or “correspondence” (*Übereinstimmung*) of a cognition (i.e., in this context, an objectively valid judgment) with its object (A58/B82). Now a Kantian nominal definition is a special type of analytic definition that picks out the “logical essence” of that concept—i.e., the generic and specific intensional criteria for bringing things under that concept—but *without* also picking out the “inner determinations” or real essences of the things falling within the comprehension of that concept, which would be the job of a *real* definition (9: 142–143). So the nominal definition of truth means that for Kant truth *just is* agreement or correspondence, which can then be further unpacked as a relation between a judgment and an object such that (i) the form or structure of the object is isomorphic with the logico-syntactic and logico-semantic form of the proposition expressed by the judgment, (ii) the judger cognitively orients herself in the world by projecting the object under specific “points of view” (*Gesichtspunkte*) or modes of presentation that would also be typically cognitively associated with the constituent concepts of the judgment by any other rational human animal in that context (8: 134–137) (9: 57, 147) (24: 779), and (iii) the object represented by the judgment really exists (Hanna 2006b, ch. 5)[^hanna-2006b]. Another way of putting this is to say that truth is *nothing but the* *objective reality of the total propositional form-and-content of the judgment*: that is, nothing but the real existence of that which is precisely specified by the logico-syntactic and logico-semantic features of the judgment taken together with the judger’s intersubjectively rationally communicable cognitive orientation. Or in still other words, true judgments are *nothing but ways of rationally projecting ourselves onto actual truth-makers*. This is *not* what is nowadays called a “deflationist” conception of truth, however, because Kant is not saying that truth is nothing but asserting the corresponding actual facts. On the contrary, for Kant truth is irreducible to merely asserting the facts, because for him the concept of truth also inherently expresses both the judger’s fundamental rational interest in “getting it right” (whether theoretically via true judgment or practically via good intentional action) and also her intersubjectively shareable and rationally communicable *cognitive orientation*, as well as belonging intrinsically to the core moral concept of *sincerity*.
    step1: |-
      关于真值性就谈到这里：但什么是真？按康德，真是整全判断的谓词，而不是判断的表象性正当部分——即直观／非概念认识与概念——的谓词（A293/B350）。此外我们已经知道，客观有效性是判断之为真的必要而非充分条件。康德还主张，逻辑一致性是判断之为真的必要而非充分条件（A60/B85）。然而最重要的是，按康德，真的“名义定义”是：真是一个认识（即在此语境中，一个客观有效的判断）与其对象的“一致”或“符合”（*Übereinstimmung*）（A58/B82）。康德式的名义定义是一种特殊的分析定义，它挑选出该概念的“逻辑本质”——即把事物置于该概念之下的属的与种的内涵标准——但*并不*同时挑选出落入该概念外延中的事物的“内在规定”或实在本质，后者是*实在*定义的任务（9: 142–143）。因此，真的名义定义意味着：对康德来说，真*恰恰就是*一致或符合，而一致或符合可以进一步展开为判断与对象之间的一种关系，使得 (i) 对象的形式或结构与判断所表达的命题的逻辑-句法与逻辑-语义形式同构，(ii) 判断者通过在特定的“观点”（*Gesichtspunkte*）或呈现模式下投射对象而在世界中认知地定向，这些模式在该语境中通常也会被任何其他理性人类动物认知地关联于判断的构成性概念（8: 134–137）（9: 57, 147）（24: 779），并且 (iii) 判断所表象的对象真实存在（Hanna 2006b, 第5章）[^hanna-2006b]。另一种说法是：真*不过是*判断的整全命题形式与内容的*客观实在性*：也就是说，不过是判断的逻辑-句法与逻辑-语义特征连同判断者主体间理性可传达的认知定向所精确指定的东西的真实存在。或者再说一遍：真判断*不过是把我们自己理性地投射到实际真之制造者上去的方式*。然而，这*不是*当今所谓“紧缩论”的真概念，因为康德并不是说真不过是对相应实际事实的断定。相反，对康德来说真不可还原为单纯断定事实，因为在他看来，真概念也内在地表达判断者“求正确”的根本理性旨趣（无论理论上经由真判断还是实践上经由好的意图行动），表达她主体间可分享、理性上可传达的*认知定向*，并且内在地属于*诚挚*这一核心道德概念。
    step2: |-
      真值性就谈到这里：那么什么是真？按康德，真是整全判断的谓词，而非判断的表象性正当部分——即直观／非概念认识与概念——的谓词（A293/B350）。此外，我们已经知道客观有效性是判断之真的必要而非充分条件。康德还主张逻辑一致性是判断之真的必要而非充分条件（A60/B85）。然而最要紧的是，按康德，真的“名义定义”是：真是一个认识（在此语境中即一个客观有效的判断）与其对象的“一致”或“符合”（*Übereinstimmung*）（A58/B82）。康德式名义定义是一种特殊的分析定义：它挑出该概念的“逻辑本质”——即把事物置于该概念之下的属与种的内涵标准——但*不*同时挑出落入该概念外延中的事物的“内在规定”或实在本质，后者是*实在*定义的任务（9: 142–143）。于是，真的名义定义意味着：对康德而言真*恰恰就是*一致或符合，而后者可进一步展开为判断与对象之间的一种关系，使得：(i) 对象的形式或结构与判断所表达命题的逻辑-句法与逻辑-语义形式同构；(ii) 判断者通过在特定“观点”（*Gesichtspunkte*）或呈现模式下投射对象而在世界中认知地定向，这些模式在该语境中通常也会被任何其他理性人类动物认知地关联于判断的构成性概念（8: 134–137）（9: 57, 147）（24: 779）；并且 (iii) 判断所表象的对象真实存在（Hanna 2006b 第5章）[^hanna-2006b]。换一种说法：真*不过是*判断之整全命题形式与内容的*客观实在性*——亦即，不过是判断的逻辑-句法与逻辑-语义特征连同判断者主体间理性可传达的认知定向所精确指定者的真实存在。再换一种说法：真判断*不过是把我们自己理性地投射到实际真之制造者上去的一些方式*。然而，这*并非*时下所谓“紧缩论”的真概念，因为康德并不是说真不过是对相应实际事实的断定。相反，对康德来说真不可还原为对事实的单纯断定，因为在他看来，真概念还内在地表达判断者“求正确”的根本理性旨趣（理论上经由真判断、实践上经由良好的意图行动），表达她主体间可分享、理性上可传达的*认知定向*，并且内在地属于*诚挚*这一核心道德概念。
