      Frege regarded Kant’s notion of analyticity as trivial; and, correspondingly, it is also true that if the Leibniz-Wolff approach to conceptual and/or logical truth largely determined Kant’s theory of analyticity, then Kant’s notion of analyticity is impoverished (Anderson 2015)[^anderson-2015]. But on the contrary Kant’s notion of analyticity is substantive, by virtue of five important ideas: first, Kant’s *pro-Leibnizian* idea that all concepts have intensional microstructures, or what he calls “logical essences” or “conceptual essences” (9: 61); second, his *anti-Leibnizian* idea that logically possible worlds are nothing but maximal logically consistent sets of concepts, not things-in-themselves (A571–573/B599–601); third, his *referentialist* idea that all grammatically well-formed, sortally correct, and logically consistent concepts have non-empty cross-possible-worlds extensions (a.k.a. “comprehensions”) (A239/B298–299) (9: 95–96); fourth, his *semantic restrictionist* idea that all and only objectively valid propositions have truth-values; and fifth, finally, and most importantly, his *logical analyticity* idea that the notion of analyticity covers not only the so-called “containment”of predicate-concepts in subject-concepts in categorical propositions, and not only the intensional identity of subject-concepts and predicate-concepts, *but also* all the logical truths of truth-functional logic and monadic predicate logic. Then for Kant a judgment is analytic if and only if its propositional content is necessarily true either by virtue of necessary internal relations between its objectively valid conceptual microstructures and/or its conceptual comprehensions, or by virtue of its truth-functional logical connectives, or by virtue of its monadic predicate logical connectives (Hanna 2001, ch. 3)[^hanna-2001], leaving open the question of whether for Kant all logical connectives are strictly truth-functional. In any case, let this be repeated with strong emphasis: Kant does *not* define analyticity in terms of either the containment or the identity of concepts, which are at best sufficient conditions for analyticity and *not* also necessary conditions for analyticity. On the contrary, Kant explicitly states a universal, necessary, and sufficient semantic criterion for the truth of analytic judgments, namely that a judgment is analytically true if and only if its denial entails a contradiction, in a broad sense of “entailment” that includes intensional entailment and not merely classical deductive entailment (A151/B190–191). This criterion also directly connects the notion of an *analytic truth* with the notion of a *logical truth* in a correspondingly broad sense that fully includes the tautologies and valid sentences of truth-functional logic and monadic predicate logic, but is neither restricted to nor reducible to (with the addition of “logical definitions” [Frege 1953], whatever *they* actually turn out to be on Frege’s account, which is not at all clear [Benacerraf 1981])[^benacerraf-1981][^frege-1953] the truth-functional tautologies and valid sentences of classical polyadic predicate logic.
