      ### 4.1 The bottom-up problem: essentially non-conceptual intuitions, rogue objects, and the gap in the B Deduction
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      What can be called *the bottom-up problem* for Kant’s metaphysics of judgment follows directly from his non-conceptualism (see the supplement [The Togetherness Principle, Kant’s Conceptualism, and Kant’s Non-Conceptualism](kant-judgment.supplement1.md)), and exposes a fundamental gap in the B Deduction. In our discussion of the B Deduction (see the supplement [Completing the Picture of Kant’s Metaphysics of Judgment](kant-judgment.supplement5.md)) it was noted that Kant’s argument for the objective validity of the categories will go through only if all the objects of human intuition are necessarily *also* objects of human experience, that is, are necessarily *also* objects correctly represented by true judgments of experience, that is, are necessarily *also* objects falling under all of the categories, or at the very least under the principle of the Second Analogy of Experience, which provides the criterion of the objectivity of objects of experience. But if this claim fails, then there can in principle be nomologically ill-behaved or “rogue” objects of human intuition that fall outside the scope of judgments of experience and thus also outside the categories, or at least outside the scope of the Second Analogy. As several Kant-interpreters have pointed out, given the possibility of essentially non-conceptual intuitions, then the B Deduction is in big trouble (Kitcher 1990, Hanna 2016b)[^hanna-2016b][^kitcher-1990]. More precisely, Kant’s non-conceptualism entails that there can be objectively valid empirical intuitions that are both autonomous from and also independent of concepts, and thereby directly refer to objects. Since the cognition of these objects does not require either concepts or the faculty of understanding, and since these intuitions consciously represent objects over and above any conceptual content whatsoever, then some of these intuitions can pick out rogue objects that fall outside the constraints of all the categories, and thereby outside the constraints of the Second Analogy in particular. So it is not true that the categories and principles of pure understanding *necessarily* apply to all objects of conscious human perception, and the categorial anarchy of at least some sensory objects is really possible. Therefore the B Deduction is unsound.
    step1: TBD
    step2: TBD
