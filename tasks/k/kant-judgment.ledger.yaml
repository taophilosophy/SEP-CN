      More precisely however, synthetic a priori judgments have three essential features. First, because a synthetic a priori judgment is a priori, its meaning and truth are strictly underdetermined by sensory impressions and/or contingent natural objects or facts, and it is also necessarily true. Second, because a synthetic a priori judgment is synthetic, not analytic, its truth is not determined by conceptual/truth-functional-logical/monadic-predicate-logical factors alone, and its denial is logically consistent. Third, as is the case with all synthetic judgments, the meaning and truth of a synthetic a priori judgment is intuition-based. This third factor is the crucial one. For while the meaning and truth of synthetic a posteriori judgments is based on *empirical* *intuitions*, the meaning and truth of synthetic a priori judgments is based on *pure intuitions* or our a priori formal representations of space and time (B73) (8: 245) (11: 38). Now since according to Kant our a priori formal representations of space and time are both necessary conditions of the possibility of human experience and *also* necessary conditions of the objective validity or empirical meaningfulness of judgments, which in turn confers truth-valuedness upon propositions, it then follows that a synthetic a priori judgment is a proposition that is true in all and only the humanly experienceable possible worlds and truth-valueless otherwise (Hanna 2001, 239–245)[^hanna-2001]. By sharp contrast, analytic judgments, as logical truths in either a narrow (truth-functional or syllogistic) or broad (intensional logic) sense, are true in all logically possible worlds, including those logically possible worlds in which human experience is *not* possible, i.e., the worlds containing non-phenomenal or non-apparent entities, especially including things-in-themselves, i.e., the “noumenal worlds.”
    step1: |-
      不过更精确地说，先天综合判断有三个本质特征。第一，因为先天综合判断是先天的，其意义与真不被感性印象和/或偶然的自然对象或事实严格决定，而且它必然为真。第二，因为先天综合判断是综合的而非分析的，其真不单独由概念/真值函项逻辑/一元谓词逻辑的因素决定，且其否定在逻辑上一致。第三，一如所有综合判断，先天综合判断的意义与真是基于直观的。第三个因素是关键。因为，虽然后天综合判断的意义与真基于*经验直观*，先天综合判断的意义与真却基于*纯粹直观*，即我们对空间与时间的先天形式表象（B73）（8: 245）（11: 38）。既然按康德，我们对空间与时间的先天形式表象既是人类经验之可能性的必要条件，又*同时*是判断之客观有效性或经验可理解性的必要条件——后者反过来又赋予命题以真值——那么可知：先天综合判断是这样的命题，它在所有且仅有人类可经验的可能世界中为真，此外则无真值（Hanna 2001, 239–245）[^hanna-2001]。与之形成鲜明对照的是，分析判断作为狭义（真值函项或三段论）或广义（内涵逻辑）意义下的逻辑真理，在所有逻辑可能世界中为真，其中包括人类经验*不*可能的那些逻辑可能世界，即包含非现象或非显现实体的世界，尤其是物自身所在的世界，即“本体世界”。
