    source: |-
      Theories of judgment, whether *cognitive* (i.e., object-representing, thought-expressing, truth-apt) judgment or *practical* (i.e., act-representing, choice-expressing, evaluation-apt) judgment, bring together fundamental issues in semantics, logic, cognitive psychology, and epistemology (collectively providing for what can be called the four “faces” of cognitive judgment [see also Martin 2006])[^martin-2006], as well as action theory, moral psychology, and ethics (collectively providing for the three “faces” of practical judgment): indeed, the notion of judgment is central to any general theory of human rationality. But Kant’s theory of judgment differs sharply from many other theories of judgment, both traditional and contemporary, in three ways: (1) by taking the innate capacity for judgment to be *the central cognitive faculty of the rational human mind*, (2) by insisting on the semantic, logical, psychological, epistemic, and practical *priority of the propositional content of a judgment*, and (3) by systematically embedding judgment within *the metaphysics of transcendental idealism*. Several serious problems are generated by the interplay of the first two factors with the third. This in turn suggests that the other two parts of Kant’s theory of judgment can be logically detached from the strongest version of his transcendental idealism and defended independently of it. This entry also includes five supplementary documents covering (i) the debate about Kant’s conceptualism vs. Kant’s non-conceptualism, (ii) the epistemology of Kantian judgment and the ethics of Kantian belief, (iii) Kant’s logic in relation to his theory of judgment, (iv) kinds of use for judgments, and (v) completing the picture of Kant’s metaphysics of judgment.
    step1: |-
      判断理论——无论是*认知性*判断（即表象对象、表达思想、可论真假的判断）还是*实践性*判断（即表象行动、表达选择、可作评价的判断）——都把语义学、逻辑学、认知心理学与认识论中的根本问题汇聚在一起（合而构成可称为认知判断的四个“面向”者［亦见 Martin 2006］）[^martin-2006]，也把行动理论、道德心理学与伦理学汇聚在一起（合而构成实践判断的三个“面向”）：的确，判断概念是任何一般人类理性理论的核心。但康德的判断理论在三个方面与许多其他判断理论（无论传统的还是当代的）判然有别：(1) 它把判断的先天能力视为*理性人心的核心认知机能*；(2) 它坚持判断的命题内容在语义、逻辑、心理、认识与实践上的*优先性*；(3) 它系统地把判断嵌入*先验观念论的形而上学*之中。前两个因素与第三个因素的相互作用产生了若干严重问题。这又提示：康德判断理论的另外两个部分，可以在逻辑上与其先验观念论的最强版本相剥离，并独立于该版本而得到辩护。本词条另含五份补充材料，分别涉及：(i) 康德概念论与康德非概念论之争；(ii) 康德式判断的认识论与康德式信念的伦理学；(iii) 康德逻辑学与其判断理论的关系；(iv) 判断的各类使用；(v) 补全康德判断形而上学之图景。
    step2: |-
      判断理论——无论*认知性*判断（表象对象、表达思想、可论真假）还是*实践性*判断（表象行动、表达选择、可作评价）——都把语义学、逻辑学、认知心理学与认识论的根本问题汇聚在一起（合而构成所谓认知判断的四个“面向”［亦见 Martin 2006］）[^martin-2006]，也把行动理论、道德心理学与伦理学汇聚在一起（合而构成实践判断的三个“面向”）：判断概念确实是任何一般人类理性理论的核心。但康德的判断理论在三点上与众多传统与当代的判断理论判然有别：(1) 把判断的先天能力视为*理性人心的核心认知机能*；(2) 坚持判断的命题内容在语义、逻辑、心理、认识与实践上的*优先性*；(3) 系统地把判断嵌入*先验观念论的形而上学*之中。前两个因素与第三个因素相互作用，产生了若干严重问题。这又提示：康德判断理论的另外两个部分可以在逻辑上与其先验观念论的最强版本相剥离，并独立得到辩护。本词条另含五份补充材料：(i) 康德概念论与非概念论之争；(ii) 康德式判断的认识论与康德式信念的伦理学；(iii) 康德逻辑学与其判断理论的关系；(iv) 判断的各类使用；(v) 补全康德判断形而上学之图景。
