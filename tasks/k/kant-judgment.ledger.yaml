      Longuenesse aptly dubs this Kantian thesis “the internalization to representation of the object of representation” (Longuenesse 1998, 20, 108)[^longuenesse-1998]. But perhaps even more importantly, Kant’s “internalization to representation of the object of representation” entails that all the basic phenomenal forms or structures of those objects of experience are type-identical with the forms or structures introduced into representations by the innately pre-programmed spontaneous operations of our cognitive faculties, and in particular with the spatiotemporal structures of our subjective forms of sensory intuition. Indeed, Kant explicitly holds that space and time are *nothing but* our subjective forms of intuition, which is his controversial thesis of “the transcendental ideality of space and time” (A28–30/B44–45, A36/B52–53, A42–43/B59–60). The upshot is that according to the strongest version of transcendental idealism, all the objects of human experience are *nothing but what we represent them to be, when we represent sensory objects according to the a priori normative principles of our understanding and our reason*: so our cognition does not conform to the objects we cognize, rather those objects necessarily conform to our innate a priori normatively-governed faculties of cognition (Bxvi, A92/B125–126).
    step1: |-
      Longuenesse 把康德这一论题恰当地命名为“表象对象的表象化内化”（Longuenesse 1998, 20, 108）[^longuenesse-1998]。但或许更要紧的是，康德的“表象对象的表象化内化”蕴涵：那些经验对象的一切基本现象形式或结构，都与我们的认知机能先天预编程的自发运作引入表象之中的形式或结构在类型上同一，尤其是与我们感性直观的主观形式的时空结构同一。事实上，康德明确主张空间与时间*不过是*我们感性的主观形式，这就是他富有争议的“空间与时间的先验观念性”论题（A28–30/B44–45, A36/B52–53, A42–43/B59–60）。结论是：按先验观念论的最强版本，人类经验的一切对象都*不过是当我们按知性与理性的先天规范原理表象感觉对象时我们所表象的样子*：因此，不是我们的认知符合我们所认识的对象，而是那些对象必然符合我们先天受规范支配的认知机能（Bxvi, A92/B125–126）。
    step2: |-
      Longuenesse 把康德这一论题贴切地称作“表象之对象的表象化内化”（Longuenesse 1998, 20, 108）[^longuenesse-1998]。但或许更要紧的是，这一论题蕴涵：那些经验对象的一切基本现象形式或结构，都与认知机能先天预编程的自发运作引入表象的形式或结构类型同一——尤其是与感性直观之主观形式的时空结构类型同一。事实上康德明确主张：空间与时间*不过是*我们感性的主观形式，这就是他那富有争议的“空间与时间之先验观念性”论题（A28–30/B44–45, A36/B52–53, A42–43/B59–60）。归结起来：按先验观念论的最强版本，人类经验的一切对象都*不过是我们在知性与理性的先天规范原理之下表象感觉对象时所表象的样子*：故不是我们的认知去符合所认识的对象，而是那些对象必然符合我们先天受规范支配的认知机能（Bxvi, A92/B125–126）。
