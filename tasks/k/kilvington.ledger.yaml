  - id: 7
    kind: body
    source: |-
      Like many other English thinkers, Kilvington was a leader in three main disciplines: terminist logic, mathematical physics, and the new, “mathematical” theology. Methods and procedures developed in the first two disciplines were used in the third. The application of the terminist logic and the refutation of the Aristotelian prohibition against *metabasis* resulted in Kilvington’s broad use of logic and mathematics in all branches of inquiry to gain certain knowledge. Four types of measurements were involved in his research. The predominant form of measurement by limits, i.e., by the beginning and ending of successive or permanent things (*incipit/desinit*), by the first and last instants of the beginning and ending of continuous processes (*de primo et ultimo instanti*), and by the intrinsic and extrinsic limits of capacities of passive and active potencies (*de maximo et minimo*), does not appear to be straightforwardly mathematical, though it raises mathematical considerations insofar as it prescribes measure for natural processes, such as changing the elements, heating, changing the speed of motion, acquiring knowledge, getting better or forming the habit to perform meritorious deeds. The second type of measurement, by latitude of forms, describes processes in which accidental forms are intensified or diminished in terms of the distribution of natural qualities such as heat or whiteness or moral qualities such as love, grace, sin, will, or desire. In his measurement of the intension and remission of forms, Kilvington is interested in determining how the highest degree of a quality can be introduced into a subject already possessing the same quality to a certain degree by undergoing an alteration, and consequently in establishing the possibility of a most intense or diminished degree of, e.g., heat and cold, or virtue and vice. The third type of measurement, the strictly mathematical, employs a new calculus of compounding proportions to measure speed in local motion or speed in the distribution of love. Finally, the fourth type of measurement describes a ‘rule’ permitting the comparison of infinities, treated as infinite sets containing infinite subsets, and determining which of them is equal, lesser, or greater.
    step1: |-
      与许多其他英格兰思想家一样，基尔文顿在三大主学科中都是领军人物：词项逻辑、数学物理学，以及新兴的“数学化”神学。在前两个学科中发展出的方法与程序，被用于第三者。词项逻辑的运用，加上对亚里士多德禁止跨类论证（*metabasis*）之禁令的驳斥，使基尔文顿在一切探究分支中广泛使用逻辑与数学，以求得确定的知识。他的研究涉及四种度量。主导的度量形式是极限度量，即以相继或恒存之物的开始与终止（*incipit/desinit*）、以连续过程的开始与终止之最初与最后瞬间（*de primo et ultimo instanti*）、以主动与被动能力的内在与外在极限（*de maximo et minimo*）来度量——它看起来并不直接是数学的，但只要它为自然过程规定度量——如元素的转化、加热、运动速度的改变、知识的获得、变好、或形成行有功之事的习惯——就会引出数学上的考量。第二种度量，即形式的纬度，以热或白等自然性质、爱、恩典、罪、意志或欲望等道德性质的分布来描述偶性形式被增强或减弱的过程。在度量形式的增强与减弱时，基尔文顿关心的是：如何通过一个变态过程，把某种性质的最高程度引入一个已在某种程度上具有同一性质的载体，进而确立热与冷、或德与恶之最高或最低程度的可能性。第三种度量是严格数学的：它运用一种新的比例复合演算，来度量位置运动中的速度或爱之分布中的速度。最后，第四种度量描述一条允许比较无穷的“规则”：无穷被当作包含无穷子集的无穷集合来处理，并判定其中哪些相等、哪些较小、哪些较大。
    step2: |-
      与许多英格兰思想家一样，基尔文顿在三大主科中都是领军人物：词项逻辑、数学物理学，以及新兴的“数学化”神学；前两科发展出的方法与程序，被他移用于第三科。词项逻辑的运用，加之对亚里士多德跨类论证（*metabasis*）禁令的驳斥，使基尔文顿在一切探究分支中广泛调用逻辑与数学，以求确定的知识。他的研究涉及四种度量。占主导的是极限度量：以相继或恒存之物的开始与终止（*incipit/desinit*）、以连续过程的开始与终止之最初与最后瞬间（*de primo et ultimo instanti*）、以主动与被动能力的内在与外在极限（*de maximo et minimo*）来度量。它看起来并不直接是数学的，但只要它为自然过程规定度量——元素转化、加热、运动速度的改变、获得知识、变好、养成行有功之事的习惯——便引出数学上的考量。第二种度量是形式的纬度：以热或白等自然性质，以爱、恩典、罪、意志、欲望等道德性质的分布，描述偶性形式被增强或减弱的过程。在度量形式的增强与减弱时，基尔文顿关心的是：经过一个变态过程，某性质的最高程度如何能被引入一个已以某种程度具有同一性质的载体；并进而确立诸如热与冷、德与恶之最高或最低程度的可能性。第三种度量是严格数学的：运用新的比例复合演算，度量位置运动中的速度或爱之分布中的速度。第四种度量描述一条允许比较无穷的“规则”：无穷被当作包含无穷子集的无穷集合来处理，并判定哪些相等、哪些较小、哪些较大。
  - id: 8
    kind: body
    source: |-
      Kilvington’s concept of infinity is one of his greatest achievements. He takes for granted Ockham’s definition of a continuum, according to which each continuum is a being that contains an actually infinite number of smaller and smaller proportional parts. When we are given any continuum, we are also given its halves, the halves of these halves and, consequently, Ockham claims, an infinite number of its parts. The actual infinity is not understood here as an actually infinite continuum “that is so great that there cannot be any greater one”. Thus, it is impossible for a process of infinite division to be accomplished, for if it were accomplished, it would no longer be infinite, but finite. For Ockham, an actually infinite continuum is a set of actually existing parts which could be enumerated without end. Kilvington supports Ockham’s view in all his works, starting from *Sophismata* up to the commentary on the *Sentences*. Ockham, however, never gives any mathematical proof for this statement and limits himself to exploring Duns Scotus’s geometrical arguments against indivisibility. Kilvington puts more effort into demonstrating that infinite proportional parts actually exist in a continuum (S 42[43]: 112–15; Kretzmann 1990b: 307; see also Jung & Podkoński 2009a; Podkoński 2016)[^jung-2009a][^podkoński-2016]. In his philosophical and theological works, Kilvington provides many examples proving that infinite sets are not equal, that is, that they are not of the same density. He also explains how to establish a one-to-one correspondence of the elements of such infinite sets. Kilvington affirms that all created infinities, being infinite, are equal ‘in multitude.’ This, however, does not imply that infinities are necessarily equal ‘in magnitude’, since two created infinities can be at once equal and unequal with respect to multitude of their parts or their dimensions. Infinities can also be ‘qualitatively’ unequal because there is a qualitative difference between God’s infinity and every created being’s infinity. God as the most perfect is the only being absolutely infinite, whereas creatures as contingent beings can only be relatively infinite. As Podkoński affirms “Kilvington must have been convinced that an infinite set can be put in one-to-one correspondence with infinite subsets. And it is worth noting that this paradoxical feature of infinite sets nowadays serves as a criterion of determining them” (see Podkoński 2009: 142)[^podkoński-2009].
    step1: |-
      基尔文顿的无穷概念是他最伟大的成就之一。他视奥卡姆的连续体定义为理所当然：每个连续体都是一个包含实际无限多的、越来越小的比例部分的存在者。给定任一连续体，我们也就被给予它的一半、这些一半的一半，从而——照奥卡姆的说法——它的无限多个部分。这里的实际无限，不被理解为“大到不可能有更大者”的实际无限的连续体。因此，无限分割的过程不可能完成，因为一旦完成，它就不再是无限的，而是有限的。对奥卡姆而言，实际无限的连续体是一个由实际存在的部分组成的集合，这些部分可以无休止地列举下去。基尔文顿在其全部著作中——从《诡辩题》直到《箴言集》注释——都支持奥卡姆的观点。然而奥卡姆从未给出这一命题的任何数学证明，只限于探讨司各脱反对不可分性的几何论证。基尔文顿则付出更多努力来证明：无限的比例部分确实存在于连续体之中（S 42[43]: 112–15；Kretzmann 1990b: 307；另见 Jung & Podkoński 2009a；Podkoński 2016）[^jung-2009a][^podkoński-2016]。在他的哲学与神学著作中，基尔文顿举出许多例子证明无穷集并不相等，即不同样稠密。他还说明了如何建立这类无穷集元素之间的一一对应。基尔文顿断言：一切被造的无穷，既然无限，便“在数目上”相等。然而这并不蕴涵无穷“在量上”必然相等，因为两个被造的无穷，就其部分的数目或其维度而言，可以同时既相等又不相等。无穷也可以在“质上”不等，因为上帝的无穷与每一个被造存在者的无穷之间有质的差异。上帝作为最完善者，是唯一绝对无限的存在者；而被造物作为偶然的存在者，只能是相对无限的。正如波德科恩斯基所断言：“基尔文顿必定已确信，一个无穷集可以与无穷子集建立一一对应。值得注意的是，无穷集的这一悖论性特征如今正是判定无穷集的判准”（见 Podkoński 2009: 142）[^podkoński-2009]。
    step2: |-
