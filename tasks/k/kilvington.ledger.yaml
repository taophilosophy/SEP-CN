      Although Kilvington does not enjoy the reputation in natural philosophy that he does in logic, recent research reveals that his questions on Aristotle’s *De generatione et corruptione* and *Physics* inspired Thomas Bradwardine’s theory of motion and his famous rule of the proportions of velocities in motion (see Jung 2022a)[^jung-2022a]. Both works stemmed from lectures Kilvington delivered in the Arts Faculty before 1328, i.e., before Bradwardine’s famous treatise *On the Proportions of Velocities in Motions*.
    step1: |-
      尽管基尔文顿在自然哲学中的声誉不及他在逻辑中的声誉，晚近的研究表明，他关于亚里士多德《论生灭》与《物理学》的问题启发了托马斯·布拉德沃丁的运动理论及其著名的运动速度比例规则（见 Jung 2022a）[^jung-2022a]。这两部著作源自基尔文顿 1328 年之前——即布拉德沃丁名著《论运动中的速度比例》问世之前——在文学院讲授的课。
