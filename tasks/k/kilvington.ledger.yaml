      The last four sophisms are ostensibly connected with epistemology and the logic of knowledge, i.e., sentences on knowing and doubting involving intentional contexts, such as S45: “You know this to be everything that is this”. The most interesting among them is S47, “You know that the king is seated”, where Kilvington calls some rules of obligational disputation into question (see Kretzmann and Kretzmann 1990: 330—47; d’Ors 1991). In the opinion of Stump, “what Kilvington has done in his work on S47, by his change in the rule for irrelevant propositions, is to shift the whole purpose of obligations” (Stump 1982: 332)[^stump-1982].
    step1: |-
      最后四个诡辩题表面上与认识论及知识的逻辑相关，即涉及意向性语境的关于知与疑的语句，如 S45：“你知道这成为是此的每一样东西”。其中最有趣的是 S47：“你知道国王在坐着”，基尔文顿在其中对义务性论辩的某些规则提出质疑（见 Kretzmann and Kretzmann 1990: 330–47；d’Ors 1991）。照斯顿普的看法，“基尔文顿在处理 S47 时，通过改变无关命题的规则，转变了义务论辩的整个目的”（Stump 1982: 332）[^stump-1982]。
    step2: |-
      最后四个诡辩题表面上关乎认识论与知识的逻辑：即涉及意向性语境的关于知与疑的语句，如 S45：“你知道这成为是此的每一样东西”。其中最有趣的是 S47“你知道国王在坐着”——基尔文顿在其中质疑义务性论辩的某些规则（见 Kretzmann and Kretzmann 1990: 330–47；d’Ors 1991）。照斯顿普的看法，“基尔文顿处理 S47 时，通过改变无关命题的规则，转变了义务论辩的整个目的”（Stump 1982: 332）[^stump-1982]。
