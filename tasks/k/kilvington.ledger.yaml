      For Kilvington, prudence is one of the primary virtues. It is a habit, which cooperates with right reason (*recta ratio*) in the process of making good or bad decisions. Even though Ockham is not mentioned by name, his theory of the relation between prudence and moral knowledge is present in Kilvington’s discussion. Ockham distinguishes two types of moral knowledge. The first, which concerns universal truths, is gained through learning; the second, which concerns particular statements and particular situations, is gained through experience. Prudence is understood in two ways: as knowledge about singular propositions and as universal practical knowledge. In his opinion, both types of prudence are gained only through experience, the former concerning singular statements and the latter universal practical statements. The former is properly called prudence, whereas the latter is commonly known as prudence. In Ockham’s view, the first kind of knowledge—i.e., of universal truths—must be distinguished from prudence concerning singular statements. The second type of knowledge, however, is the same as prudence, since it is also gained through experience (*Quaestiones* q.6, a.10). Kilvington identifies two kinds of moral knowledge. The first is called *scientia necessaria*, which is composed of general statements and refers to universal truth. The other is called *scientia ad utrumlibet*, which comprises particular statements. The *scientia necessaria*, achieved by means of deduction, is not sufficient to make good moral decisions and so it must be complemented by a reference to *scientia ad utrumlibet*, achieved by experience (see Michałowska 2016: 13)[^michałowska-2016]. Gaining knowledge through experience is an indispensable part becoming prudent. Kilvington states that someone can err with regard to a moral choice even though they possess certain and complete knowledge about universal moral truths; a skilled logician is not necessarily a moral person. To make good moral decisions, one needs a fully-developed prudence, which is the same as *scientia ad utrumlibet*. Kilvington claims that someone who possesses moral knowledge is not automatically prudent, but a prudent person is always wise (see Michałowska & Jung 2010: 109–111)[^michałowska-2010][^michałowska-2010-2].
    step1: |-
      对基尔文顿而言，审慎是首要德性之一。它是一种习惯，在作出善恶决定的过程中与正确理性（*recta ratio*）合作。尽管奥卡姆没有被点名，其关于审慎与道德知识关系的理论却见于基尔文顿的讨论。奥卡姆区分两类道德知识：第一类涉及普遍真理，通过学习获得；第二类涉及特殊命题与特殊情境，通过经验获得。审慎被理解为两种：关于单称命题的知识，与普遍的实践知识。照他的看法，这两类审慎都只能通过经验获得：前者关于单称命题，后者关于普遍实践命题。前者严格地称为审慎，后者通常被称为审慎。在奥卡姆看来，第一种知识——即关于普遍真理的知识——必须与关于单称命题的审慎区分开；而第二种知识则与审慎相同，因为它同样通过经验获得（*Quaestiones* q.6, a.10）。基尔文顿区分两种道德知识。第一种称为*必然知识*（*scientia necessaria*），由一般命题构成，指涉普遍真理。另一种称为*两可知识*（*scientia ad utrumlibet*），由特殊命题构成。经由演绎获得的*必然知识*不足以作出好的道德决定，因此必须由经由经验获得的*两可知识*来补充（见 Michałowska 2016: 13）[^michałowska-2016]。通过经验获得知识，是成为审慎者不可缺少的部分。基尔文顿指出，即使拥有关于普遍道德真理的确定而完整的知识，一个人在道德选择上仍可能出错：一个熟练的逻辑家未必是一个有道德的人。要作出好的道德决定，需要充分发展的审慎，它与*两可知识*是同一的。基尔文顿主张：拥有道德知识的人并不必然审慎，但审慎的人总是智慧的（见 Michałowska & Jung 2010: 109–111）[^michałowska-2010][^michałowska-2010-2]。
