      Taking substance and quality as the only two absolute things (*res absolutae*), Kilvington concludes that the reality of motion is limited to what is in motion: the places, qualities, and quantities that are successively acquired. Consequently, he is more interested in measuring local motion in terms of the actions of the causes of motion, the distance traversed, and the time elapsed, than in the intensity of speed. In his questions on physics, Kilvington describes the differences between various types of change, such as generation, alteration, and augmentation; determines the measurements of active and passive capacities that cause change; finds rules for the division of various types of continua; and formulates a mathematically consistent rule of local motion. He examines the problem of motion from two points of view: with regard to its causes and with regard to its effects (see Jung-Palczewska 2002b)[^jung-palczewska-2002b].
    step1: |-
      把实体与性质当作仅有的两种绝对之物（*res absolutae*），基尔文顿得出结论：运动的实在性限于运动中的东西：相继获得的位置、性质与量。因此，比起速度的强度，他更关心按运动原因的行动、经过的距离与流逝的时间来度量位置运动。在其物理学问题中，基尔文顿描述了各种变化类型——如生成、变态与增大——之间的差异；确定了引起变化的主动与被动能力的度量；找出了划分各种连续体的规则；并制定了数学上一致的位置运动规则。他从两个视角考察运动问题：就其原因与就其效果（见 Jung-Palczewska 2002b）[^jung-palczewska-2002b]。
