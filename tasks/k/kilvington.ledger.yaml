      There are four levels in Kilvington’s *secundum imaginationem* analyses. These levels may be classified according to their increasing abstraction and decreasing probability. On the first level, there are imaginary cases which are potentially observable and which might occur in nature, such as Socrates’ becoming white. On the second level are imaginary cases which cannot be observed, even though they belong to the natural order. These cases illustrate the necessary consequences of the application of rules properly describing natural phenomena—the best example being the Earth’s rectilinear motion, which is caused by its desire to unite the center of gravity with its own center. On the third level are cases not observable but theoretically possible, such as reaching infinite speed in an instant. The fourth level concerns cases that are only theoretically possible. Kilvington uses the last two groups of imaginable, i.e., hypothetical cases to reveal inconsistencies in received theories, especially from Aristotle, demonstrating mathematically the paradoxes that arise from Aristotle’s laws of motion. If hypothetical cases do not involve contradiction, there is no reason to reject them or exclude them from the realm of speculation (see Jung 2016)[^jung-2016].
    step1: |-
      基尔文顿的*依据想象*分析有四个层次。这些层次可以按其抽象程度的递增与可信程度的递减来分类。第一层次是潜在可观察、可能于自然中发生的想象的情形，如苏格拉底变白。第二层次是无法观察、却属于自然秩序的想象的情形。这些情形展示的是正确描述自然现象的规则之应用的必然推论——最好的例子是地球的直线运动，它源于地球使其重心与自身中心合一的欲望。第三层次是不可观察但理论上可能的情形，如在一瞬间达到无限速度。第四层次涉及仅在理论上可能的情形。基尔文顿用后两组想象的、即假设的情形，来揭示既有理论——尤其是亚里士多德——中的不一致，以数学方式展示亚里士多德运动定律所产生的悖论。如果假设情形不含矛盾，就没有理由拒斥它们，或把它们排除出思辨的领域（见 Jung 2016）[^jung-2016]。
    step2: |-
      基尔文顿的*依据想象*（secundum imaginationem）分析分四个层次，可按抽象程度的递增与可信程度的递减排列。第一层次：潜在可观察、可能于自然中发生的想象情形，如苏格拉底变白。第二层次：无法观察、却属于自然秩序的想象情形——它们展示的是正确描述自然现象的规则之应用的必然推论，最好的例子是地球的直线运动，它源于地球使重心与自身中心合一的欲望。第三层次：不可观察但理论上可能的情形，如在一瞬间达到无限速度。第四层次：仅在理论上可能的情形。基尔文顿用后两组想象的（即假设的）情形揭示既有理论——尤其是亚里士多德——的不一致，以数学方式展示亚里士多德运动定律引发的悖论。假设情形若不含矛盾，就没有理由拒斥它们，或把它们逐出思辨的领域（见 Jung 2016）[^jung-2016]。
