      Besides the particular topics he discussed, Kilvington’s extensive use of *sophisma* argumentation, his mathematization of ethics and theology, and his frequent use of hypothetical (*secundum imaginationem*) cases, place his thought in the mainstream of fourteenth-century English philosophy and theology. His teachings on logic were influential both in England and on the Continent. Richard Billingham, Roger Rosetus, William Heytesbury, Adam Wodeham, and Richard Swineshead were among the English scholars who benefited from Kilvington’s *Sophismata*. His *Quaestiones super De generatione et corruptione* was quoted by Richard Fitzralph, Adam Wodeham, and Blasius of Parma, and his *Quaestiones super Physicam* was familiar to the next generation of Oxford Calculators, William Heytesbury, John Dumbleton and Roger Swineshead (who also may have influenced Parisian masters such as Nicolas Oresme and John Buridan). But Thomas Bradwardine was perhaps the most famous beneficiary of Kilvington’s theory of motion. In his renowned treatise, *On the Ratios of Velocities in Motions*, Bradwardine included most of Kilvington’s arguments for a new function describing the relation of motive power and resistance (see Jung 2022a)[^jung-2022a]. Kilvington’s views on future contingents were discussed by masters at the University of Vienna in the first decade of the fifteenth century such as Nicholas of Dinkelsbühl, John Berwart of Villingen, Peter of Pulkau, and the Carmelite Arnold of Seehausen. His questions on the *Ethics* and the *Sentences* enjoyed a reputation not only in Oxford but also Paris and were frequently quoted by Adam Junior, John of Mirecourt, Johanes de Burgo, and Thomas of Krakow (see Jung-Palczewska 2000b)[^jung-palczewska-2000b].
    step1: |-
      除了他讨论的具体论题之外，基尔文顿对*诡辩题*论证的广泛使用、他对伦理学与神学的数学化、以及他对假设的（*依据想象*）情形的频繁使用，把他的思想置于十四世纪英格兰哲学与神学的主流。他的逻辑学说在英格兰与欧陆都有影响。理查德·比林厄姆、罗杰·罗塞图斯、海特斯伯里的威廉、亚当·伍德汉姆与理查德·斯温斯黑德，是受惠于基尔文顿《诡辩题》的英格兰学者。他的《论生灭诸卷问题》被理查德·菲茨拉尔夫、亚当·伍德汉姆与帕尔马的布拉修斯引用；其《物理学诸卷问题》则为下一代牛津计算者——海特斯伯里的威廉、约翰·邓布尔顿与罗杰·斯温斯黑德——所熟知（他们也可能影响了巴黎的教师们，如尼古拉·奥雷姆与约翰·布里丹）。而托马斯·布拉德沃丁或许是基尔文顿运动理论最著名的受益者。在其名著《论运动中的速度之比》中，布拉德沃丁收入了基尔文顿为描述动力与阻力关系的新函数提出的大部分论证（见 Jung 2022a）[^jung-2022a]。基尔文顿关于未来偶然之事的观点，在十五世纪头十年被维也纳大学的教师们讨论，如丁克尔斯比尔的尼古拉、维林根的约翰·贝瓦特、普尔考的彼得，以及加尔默罗会士泽豪森的阿诺德。他的《伦理学》与《箴言集》问题不仅在牛津享有声誉，在巴黎亦然，常被小亚当、米雷库尔的约翰、布尔戈的约翰内斯与克拉科夫的托马斯引用（见 Jung-Palczewska 2000b）[^jung-palczewska-2000b]。
