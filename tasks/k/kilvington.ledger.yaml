      Kilvington, like Scotus, also rejects the view that God knows future contingents via Ideas because Ideas necessarily represent what they represent, as in the sentence, “Socrates is white”, where it is said that Socrates is white. Although Kilvington does not explain his position clearly, it seems that he takes for granted Scotus’s explanation (DV: 178). Scotus says that perhaps Ideas could represent simple or complexes terms necessarily, although, as Chris Schabel puts it: “They could not represent contingent complexes (…), which we can call *X*. If God had the Idea only, eternally he would know only part of the contradiction, and there would be no contingency. If He knew both parts, *X* and ~*X* , He would know contradictories to be true simultaneously. Second, since Ideas represent both futures that are possible but will not exist, and futures that are possible and will exist, one needs to posit a way to distinguish between what will exist and what will not exist” (Schabel 2000: 42)[^schabel-2000].
    step1: |-
      与司各脱一样，基尔文顿也拒斥这样的观点：上帝经由诸理念知道未来的偶然之事，因为理念必然地表象它们所表象的东西，如在“苏格拉底是白的”这个句子中，据说苏格拉底是白的。尽管基尔文顿没有清楚地解释他的立场，看来他把司各脱的解释当作理所当然（DV: 178）。司各脱说，理念或许能必然地表象简单词项或复合词项，尽管——正如克里斯·沙贝尔所概括的——“它们无法表象偶然的复合物（……），我们可以称之为 *X*。如果上帝只有理念，他在永恒中就只能知道矛盾的一方，于是就不会有偶然性。如果他知道双方，*X* 与 ~*X*，他就会同时知道两个矛盾命题为真。其次，既然理念既表象可能但将不存在之未来，也表象可能且将存在之未来，就需要设定一种区分将存在者与将不存在者的方式”（Schabel 2000: 42）[^schabel-2000]。
