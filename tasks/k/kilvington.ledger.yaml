      Kilvington believes that not only God’s will but also God’s knowledge is contingent with regard to future contingents. This produces a distinction between types of prophecies, with some of them being absolutely necessary and others being conditionally necessary and in this way contingent. Everything absolutely and unconditionally revealed by God necessarily comes about with ordained necessity. Everything revealed by God’s ordained power—e.g., articles of faith—depends on God’s will and could be changed. Once revealed, however, they would have ordained necessity, and so they would form a new law. The contingency *ad utrumlibet* of future events is guaranteed by the conditions under which such future events come about. Although God absolutely foreknows that something will come about by absolute and ordained power, he reveals it absolutely with regard to circumstances, that is, conditionally. In conditional revelation, the change of status from being contingent to not being contingent is warranted by the conditions. When the revealed conditions are fulfilled, the future event will no longer be contingent. The same concerns future contingent deeds. Solely those foretold by God are necessary, but the others are not because they depend on people’s voluntary choices. Nothing that depends on created free will *ad utrumlibet* can be revealed absolutely relative to God’s ordained power (see Jung & Michałowska 2022: 62–63 )[^jung-2022]
    step1: |-
      基尔文顿相信：不仅上帝的意志，而且上帝的知识就未来偶然之事而言也是偶然的。这产生了一种预言类型的区分：一些预言绝对必然，另一些则条件性地必然，从而是偶然的。凡上帝绝对且无条件地启示者，必以有序的必然性发生。凡由上帝的有序能力所启示者——如信条——依赖于上帝的意志，本可以被改变；然而一旦被启示，它们就有了有序的必然性，从而形成一部新律法。未来事件的*两可*偶然性，由这类未来事件发生的条件来保证。尽管上帝凭绝对与有序能力绝对地预知某事将发生，他却是就境况绝对地——即条件性地——启示它。在条件性的启示中，从偶然到非偶然的地位变化由诸条件来保证。当被启示的条件被满足时，未来事件就不再是偶然的。对未来的偶然行为亦然：唯有上帝预言的那些是必然的，其余的则不然，因为它们依赖人的自愿选择。凡依赖受造自由意志*两可*之事，都不能相对于上帝的有序能力被绝对地启示（见 Jung & Michałowska 2022: 62–63）[^jung-2022]
