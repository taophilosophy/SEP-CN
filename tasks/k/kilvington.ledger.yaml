      In theology, Kilvington applied the new methods of terminist logic and mathematics to the most popular issues discussed in the fourteenth-century, such as human and divine love, human and divine will, God’s absolute and ordained power and human free decision, divine knowledge of future contingents and predestination. Nothing is considered separately from the Creator; therefore, Kilvington relates each human action to God. Kilvington’s questions on the *Sentences* testify to his involvement in the lively, contemporary discussions with semi-Pelagians. Thomas Bradwardine argued with John Duns Scotus, William Ockham, Adam Wodeham, Robert Holcot, and Thomas Buckingham, all of whom he regarded as Pelagians. In his commentary on the *Sentences*, on which he lectured in 1332–1333, Ockham was the theologian he most fiercely attacked. Kilvington most likely lectured on the *Sentences* in the same year. It also seems obvious that each took part in other's lectures as *socii*. In his question *Utrum actus volunatis per se malus sit per aliquid*, Kilvington debates and criticizes Bradwardine’s views (see Jung & Michałowska 2022: 6)[^jung-2022].
    step1: |-
      在神学中，基尔文顿把词项逻辑与数学的新方法应用于十四世纪讨论最热烈的论题，如人的爱与神的爱、人的意志与神的意志、上帝的绝对能力与有序能力及人的自由决定、上帝对未来偶然之事的知识与预定。没有什么被认为可以与创造者分离开来考虑；因此基尔文顿把每一人类行动都与上帝联系起来。基尔文顿的《箴言集》问题证明他卷入了与半贝拉基主义者 lively 的当代论争。托马斯·布拉德沃丁与约翰·邓斯·司各脱、奥卡姆的威廉、亚当·伍德汉姆、罗伯特·霍尔科特及托马斯·白金汉论战，他把这些人统统视为贝拉基主义者。在其《箴言集》注释——他于 1332–1333 年就此授课——中，奥卡姆是他攻击得最猛烈的神学家。基尔文顿最可能也在同一年讲授《箴言集》。同样明显的是，两人曾以*同伴*（*socii*）的身份出席彼此的讲课。在其问题《恶的意志行动自身是否是某物》中，基尔文顿辩论并批评了布拉德沃丁的观点（见 Jung & Michałowska 2022: 6）[^jung-2022]。
