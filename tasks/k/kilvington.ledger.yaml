      For Kilvington it is obvious that prudence plays an essential role in producing good moral acts. When the habit of prudence is not fully developed, the will is indecisive. Repeated good moral decisions makes it hesitate (*non-velle*) less, so that the agent is able to reach a decision in any context, whether affirmatively *velle* or negatively *nolle*. Supported by fully developed prudence, the will makes proper and good moral choices more easily or even effortlessly (see Michałowska 2016: 14)[^michałowska-2016]. Kilvington, however, is of the opinion that most of us rarely make good moral decisions because we often remain in doubt, stuck in the state of *non-velle*.
    step1: |-
      对基尔文顿而言，审慎在产生好的道德行动中扮演关键角色，这是显而易见的。当审慎的习惯尚未充分发展时，意志犹疑不决。反复作出好的道德决定使它较少迟疑（*non-velle*），从而行动者能够在任何语境中作出决定——无论是肯定地*意愿*还是否定地*不意愿*。在充分发展的审慎支持下，意志更容易、甚至毫不费力地作出恰当而好的道德选择（见 Michałowska 2016: 14）[^michałowska-2016]。然而，基尔文顿的看法是：我们大多数人很少作出好的道德决定，因为我们常常停留在怀疑之中，困在*不愿*的状态里。
    step2: |-
