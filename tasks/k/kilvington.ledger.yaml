    kind: body
    source: |-
      The manuscript tradition of Kilvington’s works is complex. The question on the *Ethics* and on the *Sentences* are often edited in different ways, with many omissions and corrections by scribes (Michałowska 2011b)[^michałowska-2011b]. The most complicated, however, is the tradition of his questions on Aristotles’ *libri naturales*, that is, on the *On generation and corruption* and the *Physics*. It testifies perfectly well to the dispersion of these works, which probably occurred shortly after the questions were written. The reconstruction of these commentaries was possible thanks to cross references to be found in the questions (Jung & Podkoński 2020: 16–17)[^jung-2020].
    step1: |-
      基尔文顿著作的手稿传统颇为复杂。其《伦理学》与《箴言集》问题常以不同方式编订，抄工多有省略与改动（Michałowska 2011b）[^michałowska-2011b]。最复杂的则是他关于亚里士多德自然诸卷——即《论生灭》与《物理学》——问题的传统。它极好地见证了这些著作的流散，流散大概就发生在诸问题写成后不久。这些注释的重建之所以可能，靠的是诸问题中可以找到的交叉引用（Jung & Podkoński 2020: 16–17）[^jung-2020]。
    step2: |-
      基尔文顿著作的手稿传统颇为复杂。他的《伦理学》与《箴言集》问题常以不同方式编订，抄工多有省略与改动（Michałowska 2011b）[^michałowska-2011b]。最复杂的则是他关于亚里士多德自然诸卷（《论生灭》与《物理学》）问题的传统：它极好地见证了这批著作的流散——流散大概就发生在诸问题写成后不久。这些注释得以重建，靠的是诸问题内部可寻的交叉引用（Jung & Podkoński 2020: 16–17）[^jung-2020]。
