      The temporal motion of a simple body in a vacuum is the most difficult to explain. In the opinion of Averroes, a simple body such as a piece of earth has an elementary form, prime matter, and different quantitative parts. Because form cannot resist matter, no resistance can come from its qualitative parts. But there can be resistance coming from its quantitative parts resisting one another. This time Kilvington uses Grosseteste’s idea, recognizing that the temporal motion of a simple body in a vacuum is possible due to the internal resistance that arises when the peripheral parts of a body that move along oblique lines resist its central parts moving along straight lines. Such an internal resistance produces motion, and does not impede; nevertheless, it guarantees temporal motion. Consequently, if a vacuum existed, the natural motion of a simple body would be possible. Moreover, the speed of such a motion would be the fastest, since there is no external resistance to be overcome (Jung-Palczewska 2002a: 169)[^jung-palczewska-2002a].
    step1: |-
      单纯体在虚空中的时间性运动是最难解释的。在阿威罗伊看来，一块土这样的单纯体有元素形式、原初质料以及不同的量的部分。由于形式不能抵抗质料，阻力不可能来自其性质部分；但阻力可以来自其量的部分之间的相互抵抗。这一次基尔文顿使用了格罗斯泰斯特的思想，承认单纯体在虚空中的时间性运动是可能的，原因是当物体沿斜线运动的外周部分抵抗沿直线运动的中心部分时，会产生一种内阻力。这种内阻力产生运动而不阻碍运动；尽管如此，它保证运动是时间性的。因此，如果虚空存在，单纯体的自然运动就是可能的。此外，这种运动的速度将是最快的，因为没有要克服的外部阻力（Jung-Palczewska 2002a: 169）[^jung-palczewska-2002a]。
