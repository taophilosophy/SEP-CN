      It is clear that Kilvington’s belief that mathematics is the legitimate method of describing natural phenomena also allowed him to formulate a new rule of local motion. Kilvington agrees that the proper way of measuring the speed of motion is to describe variations of proportion of forces to resistances. He was aware that Aristotle’s and Averroes’s rules of motion, given in *Physics* VII, were not universally applicable, and was convinced that the correct calculus of proportions was formulated by Euclid in his *Elements*. As a consequence, he noticed that the proper understanding of Euclid’s definition of operations on proportions necessitates a new interpretation of Aristotle’s and Averroes’s theory of motion. On the one hand, Euclid’s and Archimedes’s theory of operations on proportions concludes that doubling a ratio corresponds to squaring the fraction which we form from the ratio. On the other hand, Aristotle’s and Averroes’s statements clearly indicate that speed is proportional to the proportion of an active power to resistance, which is not squared but simply multiplied by two. Having noticed the inconsistency between these two views, Kilvington first presented two main arguments against the Aristotelian proposition and finally concluded that, when talking about a power moving one half of a mobile (that is, something moveable), Aristotle means precisely a double ratio between F and R; when talking about a power moving a mobile twice as heavy, he means taking the square root of the ratio of F : R. The new mathematical rule describing the speed of motion is in accord with those of Aristotle only in one case: if the ratio of the power of the mover to that of its mobile is 2 : 1, the same power will move half the mobile with exactly twice the speed. Kilvington’s reinterpretation of Aristotle’s and Averroes’s rules of motion reveals that the speed cannot be described by multiplication alone. Kilvington’s calculus provides values of the ratio of F to R greater than 1 : 1 for any speed down to zero, since any root of a ratio greater than 1 : 1 is always a ratio greater than 1 : 1. And, with his additional assumption that any excess, however small, of an active power over resistance is sufficient to initiate and continue motion, he may have described a very slow motion with a speed greater than 0 and less than 1 (0 > v < 1). Hence, he avoids a serious weakness of Aristotle’s theory, which cannot explain the mathematical relation of F and R in very slow motions, at speeds less than 1 (Jung 2022a: 76–77)[^jung-2022a].
    step1: |-
      显然，基尔文顿关于数学是描述自然现象之正当方法的信念，也使他能够制定一条新的位置运动规则。基尔文顿同意：度量运动速度的正当方式，是描述力与阻力之比的变化。他意识到亚里士多德与阿威罗伊在《物理学》第七卷给出的运动规则并非普遍适用，并确信正确的比例演算已由欧几里得在《几何原本》中制定。结果，他注意到，对欧几里德关于比例运算之定义的恰当理解， 要求 对亚里士多德与阿威罗伊运动理论的新诠释。一方面，欧几里得与阿基米德的比例运算理论得出：把一个比加倍，对应于我们由该比构成的分数的平方。另一方面，亚里士多德与阿威罗伊的陈述清楚地表明：速度与主动力对阻力之比成正比，而这一比不是被平方，而是简单地乘以二。注意到这两种观点之间的不一致之后，基尔文顿首先提出反对亚里士多德命题的两条主要论证，最后得出结论：当亚里士多德谈及推动一个可动体之半的力（即某种可被推动的东西）时，他指的正是 F 与 R 之间的双倍比；当他谈及推动一个两倍重的可动体的力时，他指的是取 F : R 之比的平方根。描述运动速度的新数学规则只在一种情形下与亚里士多德的规则一致：如果推动者的力与其可动体的力之比是 2 : 1，那么同一力将以恰好两倍的速度推动半个可动体。基尔文顿对亚里士多德与阿威罗伊运动规则的重新诠释表明：速度不能单靠乘法来描述。基尔文顿的演算为任何直到零的速度给出大于 1 : 1 的 F 与 R 之比的值，因为任何大于 1 : 1 的比的根总是大于 1 : 1 的比。而且，加上他的附加假设——主动力对阻力的任何过剩，无论多么微小，都足以引发并维持运动——他可能已经描述了一种非常缓慢的运动，其速度大于 0 且小于 1（0 > v < 1）。因此，他避免了亚里士多德理论的一个严重弱点：后者无法解释在非常缓慢的运动中，速度小于 1 时 F 与 R 的数学关系（Jung 2022a: 76–77）[^jung-2022a]。
    step2: |-
