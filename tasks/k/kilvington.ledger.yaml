  - id: 3
    kind: body
    source: |-
      Richard Kilvington (we know almost seventy different spellings of his name) was born at the beginning of the fourteenth century in the village of Kilvington, Yorkshire. He was the son of a priest from the diocese of York. He studied at Oxford, where he became Master of Arts (1324/25) then Doctor of Theology (ca. 1335) (for biographical details, see Kretzmann and Kretzmann 1990b, Jung-Palczewska 2000b)[^jung-palczewska-2000b]. His academic career was followed by a diplomatic and an ecclesiastical one, working in the service of Edward III and taking part in diplomatic missions. His career culminated in his appointment as Dean of St. Paul’s Cathedral in London. Along with Richard Fitzralph, Kilvington was involved in the battle against the mendicant friars, an argument that continued almost until his death in 1361.
    step1: |-
      理查德·基尔文顿（其名字的拼写我们知道近七十种）于十四世纪初生于约克郡的基尔文顿村。他是一位约克教区神父的儿子。他在牛津求学，1324/25 年获文科硕士，约 1335 年获神学博士（生平细节见 Kretzmann and Kretzmann 1990b；Jung-Palczewska 2000b）[^jung-palczewska-2000b]。学术生涯之后是外交与教会生涯：他效力于爱德华三世，并参加外交使团。其生涯的顶点是出任伦敦圣保罗大教堂教长。基尔文顿与理查德·菲茨拉尔夫一道参与了对托钵修士的斗争，这场论争几乎持续到他 1361 年去世。
    step2: |-
      理查德·基尔文顿（其名字的拼写我们所知近七十种）于十四世纪初生在约克郡的基尔文顿村，是一位约克教区神父之子。他在牛津求学，1324/25 年获文科硕士，约 1335 年获神学博士（生平细节见 Kretzmann and Kretzmann 1990b；Jung-Palczewska 2000b）[^jung-palczewska-2000b]。学术生涯之后是外交与教会生涯：他效力于爱德华三世，多次随外交使团出使。其生涯的顶点是出任伦敦圣保罗大教堂教长。基尔文顿还与理查德·菲茨拉尔夫一道卷入对托钵修士的斗争——这场论争几乎持续到他 1361 年去世。
  - id: 4
    kind: body
    source: |-
      Other than a few sermons, all of Kilvington’s known works stem from his lectures at Oxford. None is written in the usual commentary fashion, following the order of books in the respective works of Aristotle. In accordance with the fourteenth-century Oxford practice, the number of topics discussed was reduced to certain central issues, which were fully developed with no more than ten questions in each set. The reduction in the range of topics is counterbalanced by deeper analysis in the questions chosen for treatment. Some of Kilvington’s questions cover fifteen folios, which in a modern edition yield about 120 pages. His philosophical works, the *Sophismata* and *Quaestiones super libros De generatione et corruptione*, composed before 1325, came from his lectures as a Bachelor of Arts; the *Quaestiones super libros Physicorum* (1325/26) and *Quaestiones super libros Ethicorum* (1326/32) date from his time as an Arts Master; after he advanced to the Faculty of Theology, he penned eight questions on Peter Lombard’s *Sentences*, composed before 1334.
    step1: |-
      除几篇布道文外，基尔文顿已知的全部著作都源自他在牛津的讲课。没有一部按通常的注释方式写成，即跟随亚里士多德相应著作中各卷的次序。按照十四世纪牛津的惯例，所讨论的论题数目被缩减为若干核心问题，每组问题不超过十个，而得到充分展开。论题范围的缩减，由所选问题更深入的分析来补偿。基尔文顿的某些问题占十五对开页，在现代版本中约合 120 页。他的哲学著作《诡辩题》与《论生灭诸卷问题》作于 1325 年之前，源自他任文学士时的讲课；《物理学诸卷问题》（1325/26）与《伦理学诸卷问题》（1326/32）作于他任文科学硕士的时期；升入神学院之后，他写了关于彼得·伦巴德《箴言集》的八个问题，作于 1334 年之前。
    step2: |-
      除几篇布道文外，基尔文顿已知的全部著作都源于他在牛津的讲课，没有一部按通常的注释方式——即跟随亚里士多德相应著作各卷的次序——写成。按照十四世纪牛津的惯例，所讨论的论题被缩减为若干核心问题，每组不超过十个，逐一充分展开；论题范围的收缩，由所选问题更深入的分析来补偿。基尔文顿的某些问题占了十五对开页，在现代版本中约合 120 页。他的哲学著作《诡辩题》与《论生灭诸卷问题》作于 1325 年前，出自他任文学士时的讲课；《物理学诸卷问题》（1325/26）与《伦理学诸卷问题》（1326/32）则出自他任文硕的时期；升入神学院后，他又就彼得·伦巴德《箴言集》写下八个问题（作于 1334 年前）。
