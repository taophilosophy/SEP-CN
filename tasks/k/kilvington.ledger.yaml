      Like the divine will, human free will is endowed with absolute and ordained power to perform good and bad deeds. Kilvington argues that God produces the substance of people’s volitional act, that is, their ability to make choices, and interacts with human free will to intensify good deeds and to produce certain degrees of these acts. He argues that if free will were solely responsible for the degree of its act, then someone could love God whether endowed with grace or not, and someone without grace could love God above everything else, which is absurd. God only contributes to the performance of good deeds, and evil deeds result from the choices of human free will alone, because “truly we are good because of God, and <we are> evil all by ourselves.”(Jung & Michałowska 2022: 46)[^jung-2022] It is obvious, however, that even if humans perform good deeds, God does not have to take them into account or reward humans for their meritorious acts. People cannot be the primary cause of their reward, but they are the primary cause of their punishment because they voluntarily make wrong choices and perform evil acts. The capacity to sin testifies to the freedom of people to make free choices (see Jung & Michałowska 2022: 51–52 )[^jung-2022]
    step1: |-
      与神圣意志一样，人的自由意志也被赋予绝对与有序的能力去行善或作恶。基尔文顿论证：上帝产生人的意志行动的实体，即人作出选择的能力，并与人的自由意志互动，以增强善行并产生这些行动的特定程度。他论证说：如果自由意志单独负责其行动的程度，那么一个人无论有没有恩典都能爱上帝，而没有恩典的人能爱上帝胜过一切——这是荒谬的。上帝只对善行的实施有贡献，恶行则单出人的自由意志的选择，因为“确实，我们因上帝而善，而＜我们是＞全靠自己而恶”（Jung & Michałowska 2022: 46）[^jung-2022]。然而显而易见，即使人行善，上帝也不必把善行考虑在内，或因人有功的行动而酬报人。人不能是其酬报的首要原因，但却是其惩罚的首要原因，因为他们自愿作出错误的选择并行恶。犯罪的能力证明了人作出自由选择的自由（见 Jung & Michałowska 2022: 51–52）[^jung-2022]
    step2: |-
      与神圣意志一样，人的自由意志也被赋予绝对与有序的能力，可行善亦可作恶。基尔文顿论证：上帝产生人的意志行动之实体——即人作出选择的能力——并与人的自由意志互动，以增强善行、产生这些行动的特定程度。他论证：若自由意志单独决定其行动的程度，那么一个人无论有没有恩典都能爱上帝，没有恩典的人竟能爱上帝胜过一切——荒谬。上帝只对善行的实施有贡献；恶行则单出人的自由意志的选择——“确实，我们因上帝而善，＜我们是＞全靠自己而恶”（Jung & Michałowska 2022: 46）[^jung-2022]。然而显而易见：即使人行了善，上帝也不必把善行考虑在内、不必因人有功的行动而酬报他。人不能是其酬报的首要原因，却是其惩罚的首要原因——因为他们自愿作出错误选择并行恶。犯罪的能力恰恰证明人有作出自由选择的自由（见 Jung & Michałowska 2022: 51–52）[^jung-2022]
