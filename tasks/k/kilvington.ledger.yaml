      The first eleven sophisms deal with the process of whitening, in which the motion of alteration is conceived as a successive entity extrinsically limited at its beginning and end. There is no first instant of alteration, claims Kilvington, but only a last instant before the alteration begins; likewise, there is no last instant of alteration, but only the first instant at which the final degree has been introduced. There is no minimum degree of whiteness or speed gained in motion, but rather smaller and smaller degrees ad infinitum down to zero, since the qualities change continuously. Integers are potentially infinite because one can always find a higher integer, but not actually infinite since there is no single infinite number. In Kilvington’s view, since any continuity—e.g., time, space, motion, heat, whiteness—is infinitely divisible, it can be spoken of quantitatively and measured in terms of infinite sets of integers. The subjects of sophisms 29–44 reveal Kilvington’s special interest in local motion with respect to causes, i.e., active and passive potencies, and effects, i.e., time, distance traversed, and speed in motion. He considers both uniform and difform motion caused by voluntary agents and points out the questionable measure of instantaneous speed through the comparison of speed in uniform and accelerated motion (see Kretzmann 1982)[^kretzmann-1982].
    step1: |-
      前十一个诡辩题处理变白的过程，其中变态运动被构想为一个在开始与结束处受外在限制的相继存在者。基尔文顿主张：没有变态开始的第一瞬间，只有变态开始之前的最后瞬间；同样，没有变态的最后瞬间，只有最终程度被引入的第一瞬间。运动中获得的白度或速度没有最小的程度，而只有越来越小、以至于零以至于无穷的程度，因为诸性质是连续变化的。整数潜在地无限，因为总能找到更高的整数，但不实际无限，因为没有单独一个无限数。在基尔文顿看来，既然任何连续体——如时间、空间、运动、热、白——都无限可分，它就可以被量化地谈论，并按无穷的整数集来度量。第 29–44 个诡辩题的主题显示基尔文顿对位置运动的特别兴趣：就原因（即主动与被动能力）与效果（即时间、经过的距离、运动速度）两方面。他既考虑由自愿行动者引起的均匀运动，也考虑非均匀运动，并指出通过比较均匀运动与加速运动中的速度来度量瞬时速度的做法是可疑的（见 Kretzmann 1982）[^kretzmann-1982]。
    step2: |-
      前十一个诡辩题处理变白的过程：变态运动被构想为一个在开始与结束处受外在限制的相继存在者。基尔文顿主张：没有变态开始的第一瞬间，只有变态开始前的最后瞬间；同样，没有变态的最后瞬间，只有最终程度被引入的第一瞬间。运动中获得的白度或速度没有最小程度，只有越来越小、以至于零乃至无穷的程度，因为诸性质连续变化。整数潜在地无限——总能找到更高的整数——但不实际无限，因为没有单独一个无限数。在基尔文顿看来，既然任何连续体（时间、空间、运动、热、白）都无限可分，它便可被量化地谈论、按无穷整数集来度量。第 29–44 个诡辩题的主题显示他对位置运动的特别兴趣：就原因（主动与被动能力）与效果（时间、经过的距离、运动速度）两方面而论。他既考虑自愿行动者引起的均匀运动，也考虑非均匀运动，并指出以均匀运动与加速运动之速度的比较来度量瞬时速度的做法是可疑的（见 Kretzmann 1982）[^kretzmann-1982]。
