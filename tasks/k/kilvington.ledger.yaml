      According to Kilvington, in order to characterize changes in the speed of motion, one must analyze the problem of local motion in its kinematic aspect, which takes into account distance traversed and time consumed. He correctly recognizes that to measure the speed of motion that lasts some time, it is enough to establish relations between time and distance traversed. In his opinion, the same distances traversed in equal intervals of time characterize uniform motion. Uniformly difform motions are characterized respectively: accelerated motion by the same distance traversed in a shorter interval of time; decelerated motion by the same distance traversed in a longer time; or, according to modern definitions: the motion is uniformly difforme if the speed changes by equal amounts in equal intervals. Kilvington provides a proper description of free fall, noting that speed increases by the same amount in each time interval, and that speed is equally slower at the beginning of each interval than at the end of it. Difformly difform motion is characterized by unequal distances traversed in unequal intervals of time; the speed of such motion changes unequally (see Jung-Palczewska 2002b)[^jung-palczewska-2002b].
    step1: |-
      照基尔文顿的看法，为了刻画运动速度的变化，必须在其运动学方面分析位置运动问题，这一方面考虑到经过的距离与消耗的时间。他正确地认识到：要度量持续一段时间的运动速度，建立时间与经过距离之间的关系就足够了。照他的看法，在相等时间间隔中经过相同距离刻画均匀运动。均匀非均匀运动分别刻画为：加速运动是相同距离在更短时间间隔中被经过；减速运动是相同距离在更长时间中被经过；或者按现代定义：如果速度在相等时间间隔中改变相等的量，运动就是均匀非均匀的。基尔文顿对自由落体提供了正确的描述，指出速度在每一时间间隔中以相同的量增加，且在每一间隔开始时的速度同等慢于间隔结束时的速度。非均匀地非均匀运动的特征是在不相等的时间间隔中经过不相等的距离；这种运动的速度非均匀地变化（见 Jung-Palczewska 2002b）[^jung-palczewska-2002b]。
