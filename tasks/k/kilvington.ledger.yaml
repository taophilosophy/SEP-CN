      Virtues and vices have an absolute or relative character, and can be possessed absolutely (*simpliciter*) or in a certain respect (*secundum quid*). There are highest—i.e., most perfect—degrees of intensity of our moral virtues, but there are no absolutely greatest degrees, like Platonic ideas. In Kilvington’s opinion, people are never absolutely generous or virtuous. The ultimate perfection, i.e., the highest degree of moral virtue, is the product of a person’s natural dispositions, socializations, and moral acts. But since people relevantly differ, each of us is virtuous in our own way. So too, the highest degree of moral virtue is unique in each of us. In Kilvington’s opinion, if someone is prudent in the highest degree, they must have all the other virtues in the highest degree as well (Michałowska 2011a: 488–92)[^michałowska-2011a].
    step1: |-
      德性与恶德有绝对或相对的品格，可以被绝对地（*simpliciter*）或在某种意义上（*secundum quid*）拥有。我们的道德德性有最高的——即最完善的——强度程度，但没有像柏拉图式理念那样绝对最大的程度。照基尔文顿的看法，人从来不是绝对慷慨或绝对有德的。终极的完善，即道德德性的最高程度，是一个人的自然禀赋、社会化与道德行动的产物。但由于人们有相关差异，我们每个人都以自己的方式有德；同样，道德德性的最高程度在我们每个人身上都是独一无二的。照基尔文顿的看法，如果一个人在最高程度上审慎，他就必须也在最高程度上拥有所有其他德性（Michałowska 2011a: 488–92）[^michałowska-2011a]。
