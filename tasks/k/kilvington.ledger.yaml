      The third Aristotelian work on which Richard Kilvington commented during his regency in the Arts Faculty was the *Nicomachean Ethics*. His commentary on the second and tenth books of the *Ethics* takes a form of ten questions, which deal only with selected issues that were the subjects of Kilvington’s lectures at Oxford: e.g., creating and destroying moral virtue, free acts of volition, the behavior of honest people and the delight taken in their actions (or conversely, the punishment of those who act evilly), and questions concerning particular virtues such as courage, generosity, magnanimity, justice, and prudence. As Michałowska has shown, Kilvington uses terminist logic and mathematical physics to solve ethical problems (see Michałowska 2011a, 2016)[^michałowska-2011a]. Michałowska also shows that, just as he did in his questions on the *Physics*, Kilvington follows Ockham’s minimalist ontology by treating ethical qualities—i.e., vices and virtues, cognition and wisdom, good and evil—as volition-like objects, calling them *res*. Being real things and not merely mental concepts, they can be measured by addition, subtraction, and division into parts, for they undergo change via increase or decrease and so have varying degrees of intensity. Such changes—e.g., undergoing punishment for an evil act—cannot be instantaneous and must happen in time. Each change is the result of an acting power overcoming resistance. In the case of moral acts, the changes do not produce any external effects but internal modifications in terms of the intensity of virtues and vices. When a vice acts upon a virtue, it causes its continuous change, and so someone’s courage can vary in intensity. Virtues and vices are opposed in Kilvington’s physical theory, so it is impossible for someone to be vicious and virtuous at the same time, although it is possible for them to be generous at one time, miserly at another.
    step1: |-
      理查德·基尔文顿在文学院摄政期间注释的第三部亚里士多德著作是《尼各马可伦理学》。他对《伦理学》第二卷与第十卷的注释采取十个问题的形式，只处理他在牛津讲课时选定的论题，例如：道德德性的造成与毁坏、意志的自由行动、正直之人的行为及对其行为的喜悦（或反过来说，对作恶者的惩罚），以及关于特定德性的问题，如勇敢、慷慨、大度、正义与审慎。正如米哈乌夫斯卡所表明的，基尔文顿用词项逻辑与数学物理学来解决伦理问题（见 Michałowska 2011a, 2016）[^michałowska-2011a]。米哈乌夫斯卡还表明，正如他在《物理学》问题中所做的那样，基尔文顿遵循奥卡姆的极简本体论，把伦理性质——即恶德与德性、认识与智慧、善与恶——当作类意志的对象来处理，称之为 *res*（物）。它们是实在之物而不仅是心灵概念，因此可以通过加、减与分割成部分来度量，因为它们经由增加或减少而变化，从而有不同的强度程度。这类变化——例如因恶行而受罚——不可能是瞬间的，必须在时间中发生。每一变化都是一种行动能力克服阻力的结果。就道德行动而言，这些变化不产生外部效果，而是就德性与恶德的强度而言产生内在改变。当一个恶德作用于一个德性时，它引起后者的连续变化，因此一个人的勇敢可以在强度上变化。在基尔文顿的物理学理论中，德性与恶德相互对立，所以一个人不可能同时既恶又有德，尽管他可以一时慷慨、一时吝啬。
