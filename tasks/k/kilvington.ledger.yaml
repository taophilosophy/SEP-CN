      In his discussion of predestination, Kilvington again appears to be following Duns Scotus, who maintains that predestination is simply a choice of salvation and as such has only positive connotations. Reprobation is solely a consequence of human misdeeds. God is the primary and sole cause of predestination from eternity, but he also takes into account the conduct of creatures, that is, their good or bad use of free will. Kilvington does not accept the concept of double predestination. The good use of free will, which is a concomitant act of the intellect, may be a partial cause of predestination when it comes to the decision on baptism. The bad use of free will is the primary cause of sin and punishment and the only cause of the condemnation of adults who are endowed with grace. Although God is the first cause of people being accepted without any preceding merit or redemption, God is not the first cause revoking grace without any preceding demerit. That is because justification and acceptance are the same as God’s goodness and clemency (that is, God’s substance), whereas forsaking and rejection are merely acts of God’s righteousness (that is, God’s justice). Therefore, the evil deeds of grace-filled adults are the only reason why God, by divine righteousness, abandons people (see Jung & Michałowska 2022: 56–57)[^jung-2022]
    step1: |-
      在讨论预定论时，基尔文顿似乎又一次跟随邓斯·司各脱——后者主张预定只是对拯救的一种选择，因而只有积极的含义。摈弃完全是人之为恶的后果。上帝从永恒起就是预定的首要且唯一的原因，但他也把受造物的行为——即他们自由意志的善恶使用——考虑在内。基尔文顿不接受双重预定的概念。自由意志的善用——它是知性的一个伴随行动——在涉及洗礼决定时，可以成为预定的部分原因。自由意志的恶用是罪与惩罚的首要原因，也是拥有恩典的成年人被定罪的唯一原因。尽管上帝是人被接纳的第一因——无须任何先行功德或救赎——上帝却不是在没有任何先行过犯的情况下撤销恩典的第一因。这是因为，称义与接纳等同于上帝的善与仁慈（即上帝的实体），而离弃与拒斥只是上帝之义的行动（即上帝的正义）。因此，拥有恩典的成年人行恶，是上帝凭神圣之义离弃人的唯一原因（见 Jung & Michałowska 2022: 56–57）[^jung-2022]
