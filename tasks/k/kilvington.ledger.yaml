      Kilvington applies his new rule of motion to describe the uniformly difform motion of mixed bodies and the motion of simple bodies both in a medium and in a vacuum. Explaining Kilvington’s theory, we must keep in mind that temporal motion is possible only if there is some resistance playing the role of a *virtus impeditiva*. The motion of a mixed body in a medium is easiest to explain, since then the acting power has to overcome the external resistance of the medium as well as the internal resistance of that element which is moved away from its natural place. The local motion of a simple body in a medium is not problematic either, since it can be explained by its natural desire to attain the natural place determined by its heaviness or lightness. Nor does Kilvington have a problem with explaining the natural motion of a mixed body in a vacuum. He once again adopts Ockham’s view that if there were a void, it would be a place. Since place in the Aristotelian sense is something natural that has essential qualities, it determines the natural motion of elementary bodies and, moreover, their inclination to remain at rest in their natural places. Accordingly, says Kilvington, one could imagine a void in four natural spheres, which despite being empty preserve the proper qualities characteristic of the natural places of earth, water, air, and fire. Hence, the temporal motion of a mixed body in a void is the result of the natural inclination of heavy or light elements to attain their natural places. The heaviness and lightness play the roles of force and resistance, respectively. Although there would be no external resistance in a vacuum, the motion of a mixed body could occur without any difficulty (see Jung-Palczewska 1997)[^jung-palczewska-1997].
    step1: |-
      基尔文顿把他的新运动规则应用于描述混合体的均匀非均匀运动，以及单纯体在介质中与在虚空中的运动。解释基尔文顿的理论时，我们必须记住：只有当存在某种扮演*阻碍能力*（*virtus impeditiva*）角色的阻力时，时间性的运动才可能。混合体在介质中的运动最容易解释，因为此时行动能力既要克服介质的外部阻力，也要克服那个被移离自然位置的元素的内阻力。单纯体在介质中的位置运动也不成问题，因为它可以由其获得由其重或轻所规定的自然位置的自然欲望来解释。基尔文顿解释混合体在虚空中的自然运动也没有困难。他再次采纳奥卡姆的观点：如果虚空存在，它就会是一个位置。既然亚里士多德意义上的位置是具有本质性质的某种自然之物，它就规定元素体的自然运动，此外还规定它们保持在自然位置上静止的倾向。因此基尔文顿说，可以设想四个自然球中的虚空，它们尽管空无所有，却保存土、水、气、火诸自然位置特有的性质。于是，混合体在虚空中的时间性运动，是重元素或轻元素获得其自然位置的自然倾向的结果。重与轻分别扮演力与阻力的角色。尽管虚空中不会有外部阻力，混合体的运动仍可以毫无困难地发生（见 Jung-Palczewska 1997）[^jung-palczewska-1997]。
    step2: |-
      基尔文顿把新运动规则应用于描述混合体的均匀非均匀运动，以及单纯体在介质中与虚空中的运动。解释他的理论时须记住：只有当存在某种扮演*阻碍能力*（*virtus impeditiva*）角色的阻力时，时间性的运动才可能。混合体在介质中的运动最容易解释：此时行动能力既要克服介质的外部阻力，又要克服那个被移离自然位置的元素的内阻力。单纯体在介质中的位置运动也不成问题：它可以由其获得自然位置的自然欲望（由重或轻规定）来解释。混合体在虚空中的自然运动同样难不倒他。他再次采纳奥卡姆的观点：如果虚空存在，它就会是一个位置。既然亚里士多德意义上的位置是具有本质性质的某种自然之物，它就规定元素体的自然运动，此外还规定它们安于自然位置的倾向。因此基尔文顿说：可以设想四个自然球中的虚空，它们虽空无所有，却保存土、水、气、火诸自然位置特有的性质。于是，混合体在虚空中的时间性运动，是重元素或轻元素获得其自然位置的自然倾向的结果；重与轻分别扮演力与阻力的角色。虚空中虽无外部阻力，混合体的运动仍可毫无困难地发生（见 Jung-Palczewska 1997）[^jung-palczewska-1997]。
