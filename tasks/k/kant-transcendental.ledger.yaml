      ## 3. Contemporary World-Directed Transcendental Arguments
    step1: TBD
    step2: TBD
  - id: 116
    kind: body
    source: |-
      Kant-inspired transcendental arguments against skepticism about the external world were developed with vigor in the mid-twentieth century, notably by P. F. Strawson, most famously in his Kantian reflections in *The Bounds of Sense* (1966). These arguments are often reinterpretations of, or at least inspired by, Kant’s Transcendental Deduction and his Refutation of Idealism. Some are more ambitious than Kant’s would seem to be, insofar as they attempt to refute some variety of skepticism by showing that there is an essential commitment of the skeptical position for which the falsity of that position is a necessary condition (Nagel 1997: 60ff.)[^nagel-1997]. Strawson’s most famous transcendental argument (1966: 97–104) is modeled on the Transcendental Deduction, but explicitly without a commitment to synthesis or any other aspect of Kant’s transcendental psychology. His target is a purely sense-datum experience, which does not feature objects, “conceived of as distinct from any particular states of awareness of them,” that is, a Berkeleyan experience of spatial objects whose *esse* is *percipi* (1966: 98). The core of the argument is as follows. From the premise that every (human) experience is such that it is possible for its subject to become aware of it and ascribe it to herself, we can infer that in every experience the subject must be capable of distinguishing a recognitional component not wholly absorbed by, and thus distinct from, the item recognized (1966: 100). From this we can infer that the subject must conceptualize her experiences in such a way so as to contain the basis for a distinction between a subjective component – how the experienced item seems to the subject, and an objective component – how the item actually is. Strawson specifies that “collectively,” this comes to “the distinction between the subjective order and arrangement of a series of such experiences on the one hand, and the objective order and arrangement of the items of which they are the experiences on the other” (1966: 101). Conceptualizing experience as involving an objective order and arrangement of items amounts to making objectively valid judgments about it, which, in turn, implies that experience must consist of a rule-governed connectedness of representations (1966: 98). Summarizing, from a premise about self-consciousness, we can infer that the subject must conceptualize her experience so as to feature a distinction between “the subjective route of his experience and the objective world through which it is a route,” where the experience of the objective world consists in a rule-governed order of representations (1966: 105).
    step1: TBD
    step2: TBD
  - id: 117
    kind: body
    source: |-
      Barry Stroud, in his 1968 article “Transcendental Arguments,” issued a formidable challenge to the enterprise of defeating the external-world skeptic by transcendental arguments of this sort (Stroud 1968)[^stroud-1968]. There Stroud contends that such transcendental arguments are undermined by a problem which can be stated quite generally. These arguments feature reasoning from some aspect of experience or knowledge to the claim that the contested feature of the external world in fact exists. In each case the *existence* of the external feature will not be a necessary condition of the aspect of experience or knowledge in question, for a *belief* about the external feature would always suffice. Although the claim about existence of the aspect of the external world could be secured if certain kinds of verificationism or idealism were presupposed, these views are highly controversial. Besides, one could make as much of an inroad against the skeptic armed with the verificationism or idealism alone, without adducing the transcendental argument at all (cf. Brueckner 1983, 1984)[^brueckner-1983].
    step1: TBD
    step2: TBD
  - id: 118
    kind: body
    source: |-
      Although Strawson’s transcendental argument in *The Bounds of Sense* is not a specific target in Stroud’s (1968), Anthony Brueckner suggests that it is susceptible to the line of criticism that Stroud develops (Brueckner 1983: 557–8)[^brueckner-1983]. For, arguably, Strawson can only conclude that experience must be conceptualized in a certain way, such as to allow the subject to make the distinction between an objective world and her subjective path through it. This is not a conclusion about how a mind-independent world must be, but only about how it must be thought. (Alternatively, Strawson might be read as drawing only a conclusion about how experience must be conceptualized, which would render the transcendental argument as one of a more modest variety (see below)).
    step1: TBD
    step2: TBD
  - id: 119
    kind: body
    source: |-
      Recent developments of transcendental arguments reflect a struggle to accommodate Stroud’s criticism, and often chastened expectations about what such arguments might establish by way of refuting skepticism. One more modest sort of transcendental argument begins with a premise about experience or knowledge that is acceptable to the skeptic in question, and then proceeds not to the existence of some aspect of the external world, but in accord with Stroud’s criticism, to a belief in the existence of some aspect of the external world. Stroud himself advocates a strategy of this sort (Stroud 1994, 1999)[^stroud-1994], as does Robert Stern (1999). The kind proposed by Stroud begins with the premise that we think of the world as being independent of us, and it concludes, as a necessary condition of this premise, that we must think of it as containing enduring particulars. Such an argument does not claim that as a necessary condition of this premise there must exist such particulars. It contends only for “a connection solely within our thought: if we think in certain ways, we must think in certain other ways” (Stroud 1999: 165)[^stroud-1999]. A belief or thought to which one reasons in this way would, in Stroud’s conception, have a certain *indispensability*, “because no belief that must be present in any conception or any set of beliefs about an independent world could be abandoned consistently with our conception of the world at all,” and it would be *invulnerable* “in the special sense that it could not be found to be false consistently with its being found to be held by people” (Stroud 1999: 166)[^stroud-1999].
    step1: TBD
    step2: TBD
  - id: 120
    kind: body
    source: |-
      Stern advances a conception of this kind of argument on which it addresses a skeptic who questions whether certain beliefs cohere with others in one’s set, as opposed to a skeptic who questions whether certain beliefs are true (Stern 1999)[^stern-1999]. A modest transcendental argument would then aim to show that a belief whose coherence with the other beliefs is challenged so coheres after all. The requisite coherence might be demonstrated by showing that the belief in question is actually a necessary condition of a belief that is indispensable (in some coherentist sense) to one’s set. Mark Sacks (1999) objects that if at the same time one were to admit that the belief might not be true, one’s sense that one is justified in holding the belief would be undermined. This worry is a serious one. Sacks argues that it arises because of a tension between the coherentist theory of justification and the realist correspondence theory of truth that the external world skeptic presupposes. One might respond, he points out, by accepting a coherence theory of truth as well, but this would be to adopt a version of idealism. Moreover, it seems that Sacks’s proposal would not solve the problem, for the reason that even if one accepted a coherence theory of truth, one would still have to admit that for specific instances of a belief one might be mistaken, even if one maintained that one was justified in holding that belief on grounds of coherence.
    step1: TBD
    step2: TBD
  - id: 121
    kind: body
    source: |-
      An important criticism of Stroud’s proposed sort of modest transcendental argument is raised by Brueckner (1996). Brueckner addresses the fit between the claim that certain non-skeptical beliefs are invulnerable in Stroud’s sense, and the admission that they might not be true. More precisely, he challenges the claim that one can simultaneously affirm the following two principles, each gleaned from Stroud (1994):
    step1: TBD
    step2: TBD
  - id: 122
    kind: body
    source: |-
      > (CT) If we attribute beliefs to speakers (if we believe that they have beliefs with determinate contents), then we must also believe that there is an independent world of enduring objects with which they interact.
    step1: TBD
    step2: TBD
  - id: 123
    kind: body
    source: |-
      and
    step1: TBD
    step2: TBD
  - id: 124
    kind: body
    source: |-
      > (SK) Although we believe many things about a world independent of us and our experiences, … none of those beliefs is true.
    step1: TBD
    step2: TBD
  - id: 125
    kind: body
    source: |-
      Brueckner divides (SK) into
    step1: TBD
    step2: TBD
  - id: 126
    kind: body
    source: |-
      1. We believe many things about an external reality independent of us and our experiences; and:
      2. None of these beliefs is true.
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      Stroud argues, in effect, that given CT we cannot believe that (i) and (ii) are true, but nonetheless, we can believe that (i) and (ii) are logically compossible given CT. Brueckner argues that using similar reasoning, given CT we cannot conceive of a possible world in which both (i) and (ii) hold, and this fact undermines Stroud’s claim. To conceive of a world W in which (i) is true is to conceive of a world in which we (in the actual world) attribute beliefs about mind-independent objects to counterfactual versions of us (CVs) in W. But given CT, we must now also conceive of W as featuring mind-independent objects with which these CVs interact. Consider the CVs’ belief *that there exist mind-independent objects* – a belief they share with us. This belief of theirs will be true. And thus in W (ii) will be false. Hence we have not conceived of a world in which given CT, SK is nevertheless true, and indeed, we will not be able to conceive of such a world. But our not being able to conceive of a possible world in which given CT, SK is true, constitutes strong evidence against the claim that SK is logically possible given CT (1996: 274–75). Brueckner does not think that this argument demonstrates that it is inconsistent to accept CT and assert that SK is logically possible, but that there will be no evidence of the usual kind for this claim – evidence from conceivability. Thus given the transcendental argument he advances, Stroud will be pushed in the direction of the immodest conclusion that it is not possible for us to be mistaken in our belief that there exist mind-independent objects.
    step1: TBD
    step2: TBD
  - id: 128
    kind: body
    source: |-
      From this one might be tempted to conclude that despite his critique of 1968, Stroud, with Brueckner’s assistance, has found a transcendental argument that does in fact establish a conclusion about the external world. However, so far nothing has been said to turn back Stroud’s 1968 critique, and it seems much more likely that the argument Stroud now advances can at best conclude with a version of CT in which the term “independent” must be read in a transcendentally ideal sense – in which, for example, the nature of certain physical objects is determined by our best scientific theories about them, and our sensory experiences can be in error about these objects. And if this is so, then the argument would secure a belief about the external world only on the presupposition of metaphysical idealism, and this is one of the ways in which anti-skeptical transcendental arguments might be doomed according to Stroud’s 1968 critique.
    step1: TBD
    step2: TBD
  - id: 129
    kind: body
    source: |-
      Despite these sorts of challenges, the aspiration to forge transcendental arguments with considerable anti-skeptical force has not waned. Qassim Cassam (1999), Sacks (2000), and Stern (2000), for example, have developed creative and nuanced versions of transcendental arguments designed to negotiate the type of problem Stroud has pressed.
    step1: TBD
    step2: TBD
