      Second, consider the claim that my mental states (or the mental subject itself) are as suited as objects in space to function as a reference whereby I can correctly judge the temporal order of my past experiences. Suppose I had available as such a reference only the mere mental appearance of a digital clock in one corner of my field of consciousness. This would not clearly be less effective than an actual clock in space. To this one might reply, with Dicker, that there are no actual mental states that are adequate to serve as such a reference. However, and this is the deeper worry, on Berkeley’s idealist view according to which the *esse* (to be) of objects in space is their *percipi* (to be perceived), any spatial objects would be nothing more than mental states of some subject, or aspects of those states, but Berkeleyan spatial perceptions would be as adequate a reference by which to determine the temporal order of my past experiences as perceptions of spatial objects that are in some sense distinct from my mental states (cf. Allison 1983: 300–1; Vogel 1993; Chignell 2010)[^allison-1983][^chignell-2010][^vogel-1993].
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Third, one might contend that Kant’s Refutation demonstrates that the reference in question must be (relatively) permanent, and that there is nothing in the Berkeleyan spatial realm that satisfies this requirement. However, to this one might respond that the reference by which I determine the temporal order of my past experiences need not be permanent in a way that cannot be satisfied by Berkeleyan spatial objects. If in the corner of my field of consciousness featured distinct momentary flashes, every second, indicating the date and time to the second, I would be able to determine the temporal order of my past experiences by their means (cf., van Cleve, reported in Dicker 2004: 207)[^dicker-2004].
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      A note on the second of these concerns: Several commentators have argued that Kant’s Refutation of Idealism is meant to undermine any metaphysical sort of idealism, including metaphysical idealisms that have been attributed to Kant (Guyer 1987: 317–29)[^guyer-1987]. But while this reading has interesting support, one should hesitate to endorse it solely on the ground that Kant maintains that spatial objects are distinct from the states of the perceiver. On a plausible metaphysical interpretation of Kant’s idealism, the *esse* of objects in space is not their *percipi* since Kant’s spatial objects, by contrast with Berkeley’s, transcend what we immediately perceive by sensation – they are in this sense recognition-transcendent. In Berkeley’s position, a subject’s perception of an oar in the water as crooked is not a misperception, for “what he immediately perceives by sight is not in error, and so far he is in the right,” and it is misleading only because it is apt to give rise to mistaken inferences (Berkeley 1713: Third Dialogue)[^berkeley-1713]; while for Kant this perception is in error. In Kant’s view, the oar is recognition-transcendent by virtue of the Second Postulate’s provision that the actuality of such objects is determined causally:
    step1: TBD
    step2: TBD
  - id: 110
    kind: body
    source: |-
      > That which is bound up with the material conditions of experience, that is, with sensation, is actual (*wirklich*). (A218=B266)
    step1: TBD
    step2: TBD
  - id: 111
    kind: body
    source: |-
      The actual is that which conforms to the system of empirical causal laws (A225/B272ff.), and because the crookedness of the oar does not so conform, it is not actual. How the Second Postulate rules out the existence of the apparent spatial objects of dreams and hallucinations is spelled out in the third note to the Refutation of Idealism:
    step1: TBD
    step2: TBD
  - id: 112
    kind: body
    source: |-
      > Note 3. From the fact that the existence of outer things is required for the possibility of a determinate consciousness of the self, it does not follow that every intuitive representation of outer things involves the existence of those things, for their representation can very well be the product merely of the imagination (as in dreams and delusions). Such representation is merely the product of previous outer perceptions, which, as has been shown, are possible only through the reality of outer objects… Whether this or that supposed experience be not purely imaginary, must be ascertained from its special determinations, and through its congruence with the criteria of all actual experience (*wirklichen Erfahrung*). (B278–79 cf.A376, cf. A492/B520–21)
    step1: TBD
    step2: TBD
  - id: 113
    kind: body
    source: |-
      The objects of dreams and hallucinations don’t meet the criterion of actuality of the Second Postulate, that is, according with the laws of causality. Thus while in Berkeley’s view the *esse* of spatial things consists in their being perceived by the senses, for Kant they are the objects of the correct causal/scientific account of the contents of our outer experience. This causal criterion allows that a spatial object, or, more precisely, the matter from which it is constituted, is (at least relatively) permanent – which would seem ruled out in Berkeley’s position, since the spatial object does not last any longer than the idea does. (Berkeley does say that the ideas of what “are called real things” differ from “those excited in the imagination” by “being less regular, vivid, and constant” (Berkeley 1710, *Principles* Part I, 33)[^berkeley-1710], but for him this difference does not challenge or undermine the claim that the *esse* of a physical object is its *percipi*.) None of this forces a metaphysical realist as opposed to an idealist reading of Kant.
    step1: TBD
    step2: TBD
  - id: 114
    kind: body
    source: |-
      Yet at the same time, according to the second concern, the Refutation is inadequate even if its ambition is restricted to demonstrating the existence of merely metaphysically ideal but nonetheless recognition-transcendent objects outside us in space. For granting that the Refutation establishes that for me to determine the temporal order of my past experiences I must perceive objects in space, it fails to show that I need to perceive spatial objects any more realistic than the Berkeleyan ones. More generally, the worry is that Berkeleyan version of idealism has the resources to yield as adequate a reference for me to determine the temporal order of my past experiences as any rival position Kant is plausibly interpreted as endorsing, and that for this reason the Refutation falls short of its aim.
    step1: TBD
    step2: TBD
