      George Dicker provides a compelling initial representation of Kant’s argument (Dicker 2004, 2008)[^dicker-2004]:
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      1. I am conscious of my own existence in time; that is, I am aware, and can be aware, that I have experiences that occur in a specific temporal order. (premise)
      2. I can be aware of having experiences that occur in a specific temporal order only if I perceive something permanent by reference to which I can determine their temporal order. (premise)
      3. No conscious state of my own can serve as the permanent entity by reference to which I can determine the temporal order of my experiences. (premise)
      4. Time itself cannot serve as this permanent entity by reference to which I can determine the temporal order of my experiences. (premise)
      5. If (2), (3), and (4), are true, then I can be aware of having experiences that occur in a specific temporal order only if I perceive persisting objects in space outside me by reference to which I can determine the temporal order of my experiences. (premise)
      6. Therefore, I perceive persisting objects in space outside me by reference to which I can determine the temporal order of my experiences. (1–5)
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Several points of interpretation should be noted. First, it is generally agreed that the notion of awareness in Premise (1) should be interpreted as a success notion, i.e., that to be aware that I have experiences that occur in a specific temporal order is to correctly determine that they occur in this order (Allison 1983: 290ff, Guyer 1987: 293ff, Dicker 2004, 195ff., 2008; Chignell 2010)[^allison-1983][^chignell-2010][^dicker-2004][^guyer-1987]. Second, most commentators concur that the experiences at issue are my past experiences. Guyer suggests that the argument might be extended to combinations of my past and my present experience, but Dicker objects that the fact that past experiences occurred before the present one is directly knowable by introspection, and so doesn’t require the external reference (Guyer 1987; Dicker 2004: 195ff.)[^dicker-2004][^guyer-1987]. Third, Jonathan Bennett points out that we have single memories whose content spans an appreciable length of time that allow us to determine the order of past mental states . When one remembers hearing a certain word, one can accurately determine by the content of a single memory that certain phoneme-experiences occurred prior to other phoneme-experiences – for example, that one heard ‘mad’ and not ‘dam’ (Bennett 1966: 228–29)[^bennett-1966]. Dicker (2004: 201–2) remarks that we may be able to determine accurately the order some of our past states by means of such memories, but we cannot ascertain the order of most of our past experiences in this way. He therefore advocates a restriction of the argument to the experiences we can correctly order but not in the way Bennett adduces. Fourth, many commentators have noted that we might have perceived time directly. Guyer, as we just saw, suggests that all of our conscious experiences might have featured a time clock, much like a television sportscast or a video camera (1987: 244; cf. Strawson 1966)[^strawson-1966]. But as Dicker points out, in actual fact our experience does not have any such feature, and he is content for Premise (4), that time itself cannot serve as the reference whereby I correctly determine the temporal order of my past experiences, to state a merely contingent fact about us (2004, 2008). Andrew Chignell (2010) expresses a concern about interpretations of the Refutation in which it is merely a contingent fact about us that the alternative methods for determining the temporal order of my past experiences are unavailable, for then the conclusion, that we perceive objects in space, would inherit such mere contingency, which he argues to be at odds with Kant’s hopes for the Refutation. Fifth, commentators differ on the relation that must obtain between the objects in space and the experiences whose temporal order we can correctly determine. Guyer argues that the relation must be causal, since “the states of the self are judged to have a unique order just insofar as they are judged to be caused… by the successive states of enduring objects” (Guyer 1987: 309; cf. Dicker 2004: 200, 2008)[^dicker-2004][^guyer-1987]. By contrast, in Allison’s view we require the temporal order of objects in space only as a backdrop against which to determine the temporal order of our experiences; “an enduring, perceivable object (or objects) is required to provide a frame of reference by means of which the succession, coexistence, and duration of appearances in a common time can be determined” (Allison 1983: 201)[^allison-1983]. If the object in space that provides the reference is the sun, for example, the states of the sun don’t need to cause my experiences for me to determine their temporal order by means of those states.
    step1: TBD
    step2: TBD
  - id: 106
