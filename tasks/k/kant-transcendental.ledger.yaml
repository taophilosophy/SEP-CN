      (S) asserts that all of the individual elements of the selected intuition are such that the subject is or can become conscious of them simultaneously. In Howell’s interpretation, only if the elements of an intuition together and at the same time are accompanied by the same *I think* will it be plausible that the subject must synthesize these elements (Howell 1992: 162)[^howell-1992]. On van Cleve’s reading, it is required that for any intuition that I have, I actually become simultaneously conscious of its elements. If this co-consciousness were just merely possible, Kant could only conclude is that the resulting representation is only possibly subject to the categories (van Cleve 1999: 84)[^cleve-1999]. On an interpretation of this type, the mechanism of the argument of §16 is to adduce a kind of unity or combination that my representations actually exhibit, and then to argue that this unity requires synthesis by means of the categories as a condition or for its explanation. Kant is thus read as contending that actual co-consciousness is a type of unity that demands synthesis by means of the categories, and that any variety of unity short of co-consciousness will be inadequate to establishing this objective of the Deduction.
