      Thus my representation of the identity of the subject comes about “only in so far as I conjoin one representation with another, and am conscious of the synthesis of them” (B133). This consciousness is not of the act or process of synthesis itself, but of the unity that is its outcome (Strawson 1966: 94–96; Dicker 2004: 133–4)[^dicker-2004][^strawson-1966]). What sort of unity must I consciously recognize among my representations that would account for my representation of this identity? Note that it is not plausibly co-consciousness, for I represent the subject as identical for self-attributed representations that are not co-conscious, so actual co-consciousness could not explain generally how I represent this sort of identity. A credible alternative is that the unity consists in certain intimate ways in which representations in a single subject are typically related. Arguably, the essential feature of this unity is that a single subject’s representations be inferentially and causally integrated to a high degree, and in this respect they are unified in a way in which representations possessed by discrete subjects are not. Alternatively, several commentators have argued that the relevant unity might be a temporal order among my representations, thereby linking the B-Deduction with the arguments of the Second Analogy and the Refutation of Idealism (Guyer 1977: 267; Dicker 2004: 137–44)[^dicker-2004][^guyer-1977]. A concern about this route is that a cognitive sensitivity to the time-ordering of representations does not obviously facilitate our representing them as belonging to a single subject (Brueckner 1984: 199–208)[^brueckner-1984]. By contrast, when mental states fail to exhibit inferential and causal integration, as in the case of multiple-personality disorder, we have a tendency to posit multiple subjects, while we do not do so when such integration is present.
    step1: |-
      于是，我对主体同一性的表象“只是在我把一个表象与另一个表象结合、并意识到它们之综合的时候”才产生（B133）。这种意识所对的不是综合的行为或过程本身，而是作为其结果的统一性（Strawson 1966: 94–96; Dicker 2004: 133–4）[^dicker-2004][^strawson-1966]。那么，我必须在自己的诸表象中自觉地认出哪种统一性，才能说明我对这一同一性的表象？注意，它不大可能是共同意识，因为对并非共同被意识的自我归属表象，我也把主体表象为同一的；所以实际的共同意识无法一般地解释我如何表象这类同一性。一个可信的替代是：这种统一性在于单一主体的诸表象通常具有的某些切近关联方式。可以说，这种统一性的本质特征在于：单一主体的诸表象在推理与因果上高度整合，就此而言它们获得了一种离散主体的诸表象所没有的统一。另一条思路则见于若干评论者：相关的统一性也许是我的诸表象之间的时间秩序，从而把 B 版演绎同第二类比与驳斥唯心论的论证联系起来（Guyer 1977: 267; Dicker 2004: 137–44）[^dicker-2004][^guyer-1977]。这条路径有个隐忧：对表象时间次序的认知敏感性，并不显然有助于我们把它们表象为属于单一主体（Brueckner 1984: 199–208）[^brueckner-1984]。反过来看，当心理状态缺乏推理与因果上的整合时，例如在多重人格障碍的案例中，我们倾向于设定多个主体；而当这种整合存在时，我们却不如此设定。
    step2: |-
      于是，我对主体同一性的表象“只是在我把一个表象与另一个表象结合起来、并意识到它们之综合的时候”才产生（B133）。此种意识所对的并非综合的行为或过程，而是综合所成就的统一性（Strawson 1966: 94–96; Dicker 2004: 133–4）[^dicker-2004][^strawson-1966]。我必须在自己的诸表象间自觉地认出何种统一性，才能说明我对这一同一性的表象？不妨注意：它不大可能是共同意识，因为对那些并未共同被意识的自我归属表象，我同样把主体表象为同一的；故实际的共同意识无法一般地解释这类同一性表象。较可信的替代是：统一性在于单一主体的诸表象通常彼此关联的某些切近方式。可以说，其本质特征在于：单一主体的诸表象在推理与因果两个维度上高度整合，就此而言，它们所获得的统一是离散主体的诸表象所不具备的。另一条思路则见于若干评论者：相关统一性也许是我的诸表象间的时间秩序，由此把 B 版演绎与第二类比、驳斥唯心论的论证勾连起来（Guyer 1977: 267; Dicker 2004: 137–44）[^dicker-2004][^guyer-1977]。此路径的隐忧在于：对表象时间次序的认知敏感性，并不显然有助于我们把它们表象为同属单一主体（Brueckner 1984: 199–208）[^brueckner-1984]。反观另一面：当心理状态缺乏推理与因果整合时（如多重人格障碍），我们倾向于设定多个主体；而当此种整合在场时，我们却不作此设定。
