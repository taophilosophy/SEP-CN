      Critics have in effect taken issue with a number of steps of this argument, for example that expectations for good will and respect require susceptibility to the reactive attitudes, and that justified expectations for good will and respect presuppose that the participants are apt recipients of the reactive attitudes. Perhaps human relationships do not require susceptibility to moral resentment and indignation, but only to the nonreactive attitudes of moral protest, disappointment, and sorrow (Pereboom 2021)[^pereboom-2021]. Another avenue of criticism involves separating moral responsibility from being an apt target of the reactive attitudes. It may be that a forward-looking, that is, what Strawson calls an ‘optimistic’ notion of responsibility, is all that’s required for good relationships, and it is not characterized by being an apt target of the reactive attitudes. But these criticisms are controversial, and Strawson’s argument is widely accepted and acclaimed.
