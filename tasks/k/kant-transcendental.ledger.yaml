      It’s widely agreed that a crucial feature of the second step is the claim that our intuitions of space and time are constituted in such a way as to necessitate the unification of the manifold of appearance by the application of the categories. In the Transcendental Aesthetic, Kant aimed to show that space and time are forms of our sensible intuition, and that for us appearances can only occur in accord with these forms. But now, in the note to B160–1, Kant draws our attention to the fact that space and time are not only forms of intuition, but are intuitions themselves, and that they are intuitions that feature unity. What’s more, Kant specifies that this unity ‘precedes all concepts, though to be sure it presupposes a synthesis, which does not belong to the senses but through which all concepts of space and time first become possible.’ By the synthesis that is presupposed ‘the understanding determines the sensibility.’ So the unity of space and time is to be explained with reference to the effect of the understanding upon sensibility itself (Longuenesse 1998: 211–33; Keller 1998: 88–94; Dickerson 2004: 196–201; Pollok 2008; Vinci 2014: 197–229; Onof and Schulting 2015; Allison 2015: 374–432; Rosefeldt 2022)[^allison-2015][^dicker-2004][^dickerson-2004][^keller-1998][^longuenesse-1998][^onof-2015][^pollok-2008][^rosefeldt-2022][^vinci-2014].
    step1: |-
      人们普遍同意，第二步的一个关键特征是如下主张：我们对空间与时间的直观，其构成方式使得现象杂多必须借范畴的运用而得到统一。在《先验感性论》中，康德意在表明空间与时间是我们的感性直观形式，而对我们来说，现象只能依照这些形式出现。但如今在 B160–1 的注释中，康德要我们注意：空间与时间不仅是直观形式，而且本身就是直观，并且是带有统一性的直观。此外康德还指明，这种统一性“先于一切概念，虽然它确实预设了一种综合——这综合不属于感官，但一切空间与时间的概念都唯有通过它才成为可能”。通过这一被预设的综合，“知性规定感性”。因此，空间与时间的统一性须参照知性对感性本身的作用来加以说明（Longuenesse 1998: 211–33; Keller 1998: 88–94; Dickerson 2004: 196–201; Pollok 2008; Vinci 2014: 197–229; Onof and Schulting 2015; Allison 2015: 374–432; Rosefeldt 2022）[^allison-2015][^dicker-2004][^dickerson-2004][^keller-1998][^longuenesse-1998][^onof-2015][^pollok-2008][^rosefeldt-2022][^vinci-2014]。
