      The second stage of the argument of §16 highlights another implication of the claim that “the empirical consciousness, which accompanies different representations, is dispersed and without relation to the identity of the subject” (B133). Kant contends that Hume’s theory lacks the resources to account for my representation of that which is conscious of its various representations *as one and the same subject*, to account for how I “represent to myself the *identity of the consciousness in [i.e. throughout] these representations*” (B133). We might imagine several kinds of explanation for my representation of this identity. One candidate appeals to sensory awareness: the way I represent the identity of the subject is akin to how I commonly represent the identity over time of ordinary objects: directly by sensory awareness of similarities among both intrinsic and relational properties of these objects. For example, I reidentify my car after returning to it in the parking lot by sensory awareness of its color, shape, and location. In the case of the conscious subject, such sensory awareness would be by inner sense. However, Kant and Hume concur that this model does not capture how I represent the identity of the conscious subject, since they agree that by inner sense I cannot represent any intrinsic properties of this subject. A second kind of explanation, which Kant endorses, is that this representation instead accounted for indirectly since it depends on my apprehending *relational properties of the subject’s representations*; specifically, an order they stand in, which Kant calls a *unity* (Allison 1983: 142–44; Guyer 1977: 267, 1987: 133–39; Pereboom 1995; Patricia Kitcher 2011: 147)[^allison-1983][^guyer-1977][^kitcher-2011][^pereboom-1995]. If the representations I can attribute to myself possess such a unity, and if I am conscious of and represent it, then I will be able to represent the conscious subject of any one of these representations as identical with that of any other.
    step1: |-
      §16 论证的第二阶段凸显了另一层含义，它出自这一主张：“伴随不同表象的经验意识是分散的，并且与主体的同一性无关”（B133）。康德断言，休谟的理论缺乏必要的资源，来说明我如何表象那个意识到其诸表象作为同一个主体者，亦即说明我如何“在这些表象之中表象意识的同一性”（B133）。可以设想，对我这一同一性表象有几种解释。一种候选诉诸感官觉察：我表象主体同一性的方式，类似于我通常表象普通对象在时间中同一性的方式——直接凭借感官觉察这些对象在内在属性与关系属性上的相似。例如，我回到停车场取车时，凭借对颜色、形状与位置的感官觉察重新认出我的车。就意识主体而言，这种感官觉察将由内感官提供。然而康德与休谟一致认为，这一模型没有抓住我表象意识主体同一性的方式，因为他们都同意：通过内感官，我无法表象这一主体的任何内在属性。第二种解释为康德所赞同：这一表象其实是间接得到说明的，因为它依赖于我把握主体诸表象之间的关系属性，确切说是一种它们所处其中的秩序，康德称之为统一性（Allison 1983: 142–44; Guyer 1977: 267, 1987: 133–39; Pereboom 1995; Patricia Kitcher 2011: 147）[^allison-1983][^guyer-1977][^kitcher-2011][^pereboom-1995]。若我能归属于自己的诸表象具有这样一种统一性，而且我意识到并且表象它，那么我就能把这些表象中任何一个的意识主体表象为与任何其他者的意识主体同一。
    step2: |-
      §16 论证第二阶段凸显上述主张的另一层含义。那就是：“伴随不同表象的经验意识是分散的，与主体的同一性无关”（B133）。康德据此主张：休谟理论缺少必要的资源，来说明我如何把那个意识到自己诸表象者表象为同一个主体，来说明我如何“在〔这些〕表象中向我表象意识的同一性”（B133）。对我这一同一性表象，可以设想几类解释。一类诉诸感官觉察：我表象主体同一性的方式，近似于通常表象普通对象历时同一性的方式——径直凭感官觉察这些对象在内属性与关系属性上的相似。譬如，回到停车场后，我凭对颜色、形状与位置的感官觉察重新认出自己的车。就意识主体而论，这种感官觉察须由内感官提供。然而康德与休谟都认为，这一模型并未抓住我表象意识主体同一性的方式，因为二人皆同意：借内感官，我无法表象这一主体的任何内在属性。第二类解释是康德所赞同的：这一表象反而依赖于我把握主体诸表象的关系属性，具体说，依赖于它们所处其中的一种秩序，康德称此种秩序为统一性（Allison 1983: 142–44; Guyer 1977: 267, 1987: 133–39; Pereboom 1995; Patricia Kitcher 2011: 147）[^allison-1983][^guyer-1977][^kitcher-2011][^pereboom-1995]。如果说归我所属的诸表象具有这样一种统一性，且我意识到并表象了它，那么我便能把其中任一表象的意识主体，表象为与其余任何表象的意识主体相同一。
