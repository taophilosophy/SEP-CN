      Stern and Cheng (2023) explain this argument as follows. To act is to do or choose something for a reason. However, an agent has reasons to act only because of her practical identity; she does not have reasons to act independently of that identity. But a practical identity can yield such a reason only if she regards that identity as valuable. Merely being a parent gives one no reason to care for one’s children. Rather, valuing one’s parenthood has this force. At the same time, an agent cannot regard a particular practical identity as valuable in itself; Korsgaard argues that this sort of realism about value is implausible. The only remaining explanation is that she regards it as valuable because of the contribution it makes to providing her with reasons and values by which to live. But then she must believe that it matters that her life has the sort of rational structure that having such identities provides. However, to see that as mattering, she must regard leading a rationally structured life as valuable. Then, in conclusion, to regard leading such a life as valuable, an agent must see her rational nature as valuable.
    step1: |-
      Stern 与 Cheng（2023）对这一论证作了如下解释。行动就是为着理由而做某事或选择某事。然而，行为者之所以有行动的理由，只是因为她的实践同一性；她并不独立于那一同一性而拥有行动的理由。但实践同一性唯有在她把该同一性看作有价值时，才能产生这样的理由。仅仅身为父母，并不能给人照顾自己子女的理由；倒是对自己身为父母这一点的评价，才有这种力量。与此同时，行为者无法把一个特定的实践同一性看作本身有价值的；Korsgaard 论证说，这种关于价值的实在论不可信。剩下的唯一解释是：她之所以把它看作有价值，是因为它有助于为她提供借以生活的理由与价值。但这样一来，她就必须相信：她的生活具有拥有此类同一性所提供的那种理性结构，这很重要。然而，要看出这很重要，她就必须把过一种理性地结构起来的生活看作有价值。最后，若要认为过这样一种生活有价值，行为者就必须把自己的理性本性看作有价值的。
    step2: |-
      Stern 与 Cheng（2023）对此论证解之如下。行动即为着某种理由而做某事、或选择某事。然而行为者之所以有行动的理由，全因她的实践同一性；离开该同一性，她便无行动理由。可实践同一性唯有在她视其为有价值时，方能生出此种理由。仅仅身为父母，并不给人照料子女的理由；唯当看重自己的父母身份，方有此力量。同时，行为者不能把某一特定实践同一性视为本身即有价值；Korsgaard 论证，此种价值实在论殊不可信。于是唯一剩下的解释是：她视其为有价值，乃因它有助于赋予她借以生活的理由与价值。但既然如此，她就必得相信：自己的生活具有“拥有此类同一性”所赋予的那种理性结构，这至关紧要。而要看出其紧要，她就须把过一种理性地结构起来的生活视为有价值。最后，若要视此种生活为有价值，行为者便须把自己的理性本性视为有价值。
