      A note on the second of these concerns: Several commentators have argued that Kant’s Refutation of Idealism is meant to undermine any metaphysical sort of idealism, including metaphysical idealisms that have been attributed to Kant (Guyer 1987: 317–29)[^guyer-1987]. But while this reading has interesting support, one should hesitate to endorse it solely on the ground that Kant maintains that spatial objects are distinct from the states of the perceiver. On a plausible metaphysical interpretation of Kant’s idealism, the *esse* of objects in space is not their *percipi* since Kant’s spatial objects, by contrast with Berkeley’s, transcend what we immediately perceive by sensation – they are in this sense recognition-transcendent. In Berkeley’s position, a subject’s perception of an oar in the water as crooked is not a misperception, for “what he immediately perceives by sight is not in error, and so far he is in the right,” and it is misleading only because it is apt to give rise to mistaken inferences (Berkeley 1713: Third Dialogue)[^berkeley-1713]; while for Kant this perception is in error. In Kant’s view, the oar is recognition-transcendent by virtue of the Second Postulate’s provision that the actuality of such objects is determined causally:
    step1: |-
      关于上述第二个疑虑，还有一点可说。若干评论者主张，康德的驳斥唯心论意在削弱一切形而上学意义上的唯心论，包括归于康德名下的那些形而上学唯心论（Guyer 1987: 317–29）[^guyer-1987]。尽管这一读法有有趣的依据，但若仅凭康德主张空间对象不同于知觉者的状态这一点就加以采信，则未免仓促。按对康德唯心论的一种可信的形而上学解读，空间对象的*esse*并不是它们的*percipi*，因为与贝克莱的对象不同，康德的空间对象超越了我们经由感觉而直接知觉到的东西——就此而言，它们是超越识别的。在贝克莱的立场中，主体把水中之桨知觉为弯的并不是错觉，因为“他凭视觉直接知觉到的东西并不出错，就此而言他是对的”；其所以有误导性，只是因为它容易引起错误的推论（Berkeley 1713: Third Dialogue）[^berkeley-1713]；而在康德看来，这一知觉是错的。按康德的看法，桨是超越识别的，这凭第二公设的规定：此类对象的实在性由因果关系来确定：
