      This discussion will focus on the Transcendental Deduction in the second edition of the *Critique of Pure Reason* (1787) – the *B-Deduction* – thoroughly rewritten and rethought relative to the *A-Deduction* of the first edition (1781). On my reading, in §§16–20 of the B-Deduction Kant employs a two-pronged strategy for defeating associationism as a complete theory of human mental processing and establishing the need for synthesis. The first, contained in §§15–16, is designed to show that association cannot account for an aspect of one’s consciousness of one’s self that Kant refers to as *the consciousness of its unity*, and that synthesis is required to provide this explanation. This type of argument he calls an *argument from above*, signifying that it begins with a premise about self-consciousness. Correlatively, in §§17–20 we find an *argument from below*, by which Kant intends to establish that synthesis by means of the categories is needed as a necessary condition of how we represent objects (the above/below terminology is derived from A119; for relevant historical background, see Carl 1989, 1992)[^carl-1989]. On several other readings, as we shall see, the B-Deduction is a more unified argument. There are reasons to accept and reasons to resist interpretations of this kind.
    step1: |-
      本文讨论将聚焦《纯粹理性批判》第二版（1787）中的先验演绎——即*B 版演绎*——它相对于第一版（1781）的*A 版演绎*经过了彻底重写与重新思考。按我的解读，在 B 版演绎第 16–20 节中，康德采用一种双管齐下的策略，以击败作为人类心理加工完整理论的联想主义、确立综合之必要。第一条策略（第 15–16 节）意在表明：联想不到说明人对自己之意识的一个方面——康德称之为*对其统一性的意识*——而说明此点需要综合。这类论证他称为*自上而下的论证*，意指它始于关于自我意识的前提。相应地，在第 17–20 节中我们看到*自下而上的论证*：康德借此意在确立，以范畴进行的综合乃我们如何表象对象的必要条件（上／下之名取自 A119；相关历史背景见 Carl 1989, 1992）[^carl-1989]。按其他几种解读，如我们将见，B 版演绎是一个更为统一的论证。接受这类解读有理由，抵制它们也有理由。
