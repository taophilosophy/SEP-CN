      The text, and in particular the B160–61 note, gives rise to a number of interpretive issues for Kant’s overall position. One is whether here Kant countenances a kind of unity in our representations that is not a result of categorical synthesis, but is instead is independent of the categories. Hermann Cohen (1871/1885/1918) and Eric Dufour (2003) are strict categorical conceptualists about any such unity, while Martin Heidegger (1929/1997) argues that there is a unity that is accounted for by the productive imagination independently of the categories; (Falkenstein 1995, Fichant 1997, Hanna 2008, 2011, Grüne 2011, Schulting 2012b, Messina 2014, McLear 2015, and Williams 2018 also contain defenses of nonconceptualist positions on this score; see McLear 2014, 2025 for overviews)[^falkenstein-1995][^fichant-1997][^grüne-2011][^hanna-2008][^mclear-2014][^mclear-2015][^messina-2014][^schulting-2012b][^williams-2018]. Longuenesse (1998) contends that unity-yielding synthesis is always a function of the understanding, but that there is a kind of synthesis of the understanding that does not involve the categories, while it yet anticipates them. Messina (2014), McLear (2015), Onof and Schulting (2015), and Williams (2018) argue that there are multiple kinds of unity for Kant, and while some require categorical synthesis, others do not. In particular, they maintain that space as intuited by us has a unity that Onof and Schulting (2015) call unicity, which consists of its singularity, its infinity, and its mereological inversion, i.e., a metaphysical structure involving parts ontologically depending on the whole, by contrast with the whole ontologically depending on parts, as is the case for material objects generally (here see Desmond Hogan 2021)[^hogan-2021]. Intuitive awareness of space as featuring unicity does not, on their account, require categorical synthesis.
    step1: |-
      这段文字、尤其是 B160–61 的注释，给康德的整体立场带来若干解释问题。其一是：康德在此是否容许我们表象中有一类统一性，它不是范畴综合的结果，而是独立于范畴的。Hermann Cohen（1871/1885/1918）与 Eric Dufour（2003）对任何此类统一性都持严格范畴概念论立场，而 Martin Heidegger（1929/1997）则主张有一类统一性由生产性想象力说明、独立于范畴（Falkenstein 1995、Fichant 1997、Hanna 2008, 2011、Grüne 2011、Schulting 2012b、Messina 2014、McLear 2015 与 Williams 2018 也就此提出了非概念论立场的辩护；综述见 McLear 2014, 2025）[^falkenstein-1995][^fichant-1997][^grüne-2011][^hanna-2008][^mclear-2014][^mclear-2015][^messina-2014][^schulting-2012b][^williams-2018]。Longuenesse（1998）主张，产生统一的综合始终是知性的功能，但知性有某种综合并不涉及范畴，却已预先指向它们。Messina（2014）、McLear（2015）、Onof 与 Schulting（2015）以及 Williams（2018）主张，在康德那里有多类统一性，其中一些需要范畴综合，另一些则不需要。他们尤其坚持：我们所直观的空间具有一种统一性，Onof 与 Schulting（2015）称之为“独一性”（unicity），它由空间的单一性、无限性及其部分—整体结构倒转（mereological inversion）构成——所谓倒转，即一种形而上学结构，其中部分在存在论上依赖于整体，而不同于一般物质对象那里整体在存在论上依赖于部分的情形（参见 Desmond Hogan 2021）[^hogan-2021]。按他们的说明，对具有独一性的空间之直观觉察并不要求范畴综合。
