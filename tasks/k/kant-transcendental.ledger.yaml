      In §19, Kant argues that there must be a certain way in which each of my representations is unified in the subject, and he identifies this way with judgment: “I find that a judgment is nothing but the manner in which given cognitions are brought to the objective unity of apperception” (B141). Judgment, Kant proposes, is objectively rather than subjectively valid, and hence exhibits the type of universality and necessity that characterizes objective validity (B142). He then claims that without synthesis and judgment as its vehicle, an ordering of representations might reflect what appears to be the case, but it would not explain how we make distinctions between objective valid phenomena (i.e., objects) and the subjective states they induce (e.g., Allison 2015: 363–69; Sethi 2020)[^allison-2015][^sethi-2020].
    step1: |-
      在 §19 中，康德论证说，我的每一个表象在主体中必定以某种方式得到统一，而他把这种方式等同于判断：“我发现，判断无非就是把被给予的认识带到统觉的客观统一性之下的方式”（B141）。康德提出，判断是客观有效的而非主观有效的，因而表现出客观有效性所特有的那种普遍性与必然性（B142）。他随后主张：若无综合以及作为其载体的判断，表象的排序也许能反映事情看起来如何，却无法说明我们如何区分客观有效的现象（即对象）与它们所引发的主观状态（例如 Allison 2015: 363–69; Sethi 2020）[^allison-2015][^sethi-2020]。
    step2: |-
      §19 中，康德论证：我的每一表象在主体中必以某种方式得到统一，而他把这种方式认作判断：“我发现，判断无非是把被给予的认识带向统觉客观统一性的方式”（B141）。康德提出，判断具客观有效性而非主观有效性，因而显出客观有效性所特有的普遍性与必然性（B142）。他继而主张：若没有综合，也没有充当其载体的判断，表象的排序或可反映事情显得如何。但它解释不了我们何以区分客观有效的现象（即对象）与它们所引起的主观状态（例如 Allison 2015: 363–69; Sethi 2020）[^allison-2015][^sethi-2020]。
