      梦与幻觉的对象不符合第二公设的实在性判据，即不符合因果律。因此，虽然在贝克莱看来，空间事物的*esse*在于它们被感官知觉到，但在康德看来，它们是我们外在经验内容的正确的因果性／科学性说明的对象。这一因果判据容许空间对象——更确切地说，构成它的质料——是（至少相对）持存的；这似乎在贝克莱的立场中遭到排除，因为空间对象的持续不超过观念的持续。（贝克莱确实说过，所谓“真实事物”的观念与“想象中激起”的观念之别，在于“前者较少规则、较不生动、较不恒常”（Berkeley 1710, *Principles* 第一部第 33 节）[^berkeley-1710]，但对他而言，这一差别并不挑战、也不削弱物理对象的*esse*即其*percipi*的主张。）凡此并不强使我们把康德读成形而上学实在论者而非唯心论者。
