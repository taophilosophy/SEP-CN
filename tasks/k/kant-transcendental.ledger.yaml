      1. We have representations of objects, i.e., of objectively valid phenomena. (premise)
      2. All of our representations of objects are (in part) of universal and necessary features of experience. (premise)
      3. Necessary and universal features of experience cannot be explained by association. (premise, from reflection on the nature of association))
      4. If (2) and (3) are true, all of our representations of objects require a faculty for ordering mental states distinct from association. (premise)
      5. All of our representations of objects require a faculty for ordering mental states distinct from association. (3, 4)
      6. If (5) is true, all of our representations of objects require a faculty for synthesis by *a priori* concepts. (premise)
      7. We have representations of objects, all of which require a faculty for synthesis by *a priori* concepts. (1, 5, 6)
    step1: |-
      1. 我们有关于对象的表象，即关于客观有效现象的表象。（前提）
      2. 我们所有关于对象的表象都（部分地）是关于经验的普遍而必然特征的。（前提）
      3. 经验的必然而普遍的特征无法由联想说明。（前提，出自对联想本性的反思）
      4. 若 (2) 与 (3) 为真，则我们所有关于对象的表象都需要一种区别于联想的、为心理状态排序的能力。（前提）
      5. 我们所有关于对象的表象都需要一种区别于联想的、为心理状态排序的能力。（3, 4）
      6. 若 (5) 为真，则我们所有关于对象的表象都需要一种借先天概念进行综合的能力。（前提）
      7. 我们有关于对象的表象，它们全都需要一种借先天概念进行综合的能力。（1, 5, 6）
    step2: |-
      1. 我们拥有关于对象的表象，即关于客观有效现象的表象。（前提）
      2. 我们一切关于对象的表象，都（部分地）涉及经验的普遍而必然的特征。（前提）
      3. 经验的必然且普遍的特征，不能由联想来解释。（前提，得自对联想本性的反思）
      4. 倘若 (2) 与 (3) 成立，则我们一切关于对象的表象，都有赖于一种与联想不同的、为心理状态排序的能力。（前提）
      5. 我们一切关于对象的表象，都有赖于一种与联想不同的、为心理状态排序的能力。（3, 4）
      6. 倘若 (5) 成立，则我们一切关于对象的表象，都有赖于一种借先天概念进行综合的能力。（前提）
      7. 我们拥有关于对象的表象，而它们全都有赖于一种借先天概念进行综合的能力。（1, 5, 6）
