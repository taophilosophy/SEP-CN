      One might note three aspects of the meaning of this principle. First, as pointed out earlier, Kant maintains that the apperceiving subject is not itself a collection of representations. Kant affirms that I have no inner intuition of the subject (e.g. B157), and this claim would conflict with the subject’s being a collection of representations, since he holds that I can intuit my representations by inner sense (e.g. A33/B49). Also, in §16 Kant remarks: “through the ‘I’, as simple representation, nothing manifold is given; only in intuition, which is distinct from the ‘I’, can a manifold be given” (B135). If he held the apperceiving subject to be a collection of representations, it would be surprising for him to deny that anything manifold is given through my representation of it. Second, my ability to attribute representations to myself as subject of them is *pure*, as opposed to *empirical* apperception. This means that I have this ability not in virtue of Humean inner perception, or Kantian inner sense but rather independently of any such empirical faculties and instead by virtue of the faculty of the understanding. However, Kant repeatedly affirms that the purity of this apperception does not imply that the subject to which one’s representations can be attributed is intuited – represented as an object – in a purely rational or *a priori* way (e.g., B406–9; Smit 2009, 2026)[^smit-2009]. Third, Kant states that pure apperception is *original*, and the explication he provides is that “it is that self-consciousness which, while generating the representation ‘I think’ … cannot itself be accompanied by any further representation” (B132). I cannot have a representation of myself as apperceiving subject other than by way of ‘I think…’-type thoughts, and hence these thoughts are the original representations of this subject (e.g., A350). At the same time, by virtue of my capacity for apperception, I can have a kind of propositional grasp of the apperceiving subject; Kant affirms that in apperception, I am conscious *that* I exist as subject (B157). (For recent extensive discussions of Kant on self-knowledge, see Rosefeldt 2000, Kitcher 2011, and Longuenesse 2017; cf. Howell 2001.)[^howell-2001][^kitcher-2011][^longuenesse-2017][^rosefeldt-2000]
    step1: |-
      可以指出这一原则意义的三个方面。第一，如前所述，康德主张统觉的主体本身不是表象的集合。康德断言我对主体没有内直观（例如 B157），而这一主张会与“主体是表象集合”之说相冲突，因为他认为我能通过内感官直观我的表象（例如 A33/B49）。此外，康德在 §16 中说：“通过‘我’这一单纯表象，并没有给出任何杂多；只有在不同于‘我’的直观中，杂多才能被给出”（B135）。若他主张统觉的主体是表象的集合，那么他否认通过我对它的表象给出了任何杂多，便会令人惊讶。第二，我把表象归赋给自己（作为其主体）的能力是*纯粹的*，与*经验性*统觉相对。这意味着：我拥有这一能力，不是凭休谟式内知觉或康德式内感官，而是独立于任何此类经验性能力，凭的是知性能力。然而康德反复申明：这种统觉的纯粹性并不意味着，表象可被归赋于其上的那个主体会以纯理性或*先天*的方式被直观——被表象为一个对象（例如 B406–9；Smit 2009, 2026）[^smit-2009]。第三，康德说纯粹统觉是*本源的*；他给出的阐释是：“它是这样一种自我意识：在产生‘我思’这一表象的同时……它本身不能再被任何进一步的表象所伴随”（B132）。除了通过“我思……”型的思想，我不能拥有关于自己作为统觉主体的表象；因此这些思想就是该主体的本源表象（例如 A350）。与此同时，凭借我的统觉能力，我能对统觉主体有一种命题性的把握：康德申明，在统觉中我意识到*我*作为主体而存在（B157）。（关于康德自我知识的晚近详尽讨论，见 Rosefeldt 2000、Kitcher 2011 与 Longuenesse 2017；参 Howell 2001。）[^howell-2001][^kitcher-2011][^longuenesse-2017][^rosefeldt-2000]
