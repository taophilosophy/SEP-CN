      An uncontroversial role of §17 is to provide a characterization of an object, or more to the point, of a representation of an object, that facilitates a challenge to Humean associationism. Kant’s proposal is that an object is “that in the concept of which a manifold of a given intuition is united” (B137). Here ‘object’ should be read in the broad sense of *objective feature of reality* – a feature whose existence and nature is independent of how it is perceived (B 142; Bird 1962/1973 130–31; Strawson 1966: 98–104; Guyer 1987: 11–24)[^bird-1962][^guyer-1987][^strawson-1966]. Allison is a proponent of the view that §17 contain not only this challenge to Hume, but also an attempt to demonstrate that we represent objects on the basis of the conclusions about self-consciousness established in §16. This interpretation is a component of Allison’s broader vision of the B-Deduction, according to which Kant demonstrates that the unity of apperception entails that we represent objects, and, conversely, that our representing objects entails the necessary unity of apperception (Allison 1983: 144ff; 2015: 352–55; 2015: 335–55, esp. 352)[^allison-1983] Indeed, the crucial claim for Allison’s interpretation is that the unity of apperception is not only a necessary but also sufficient condition for our representing of objects. This he calls the *reciprocity thesis*. Other commentators, including Richard Aquila (1989: 159), Howell (1992: 227–8) and Schulting (2012a) agree that the B-Deduction features the reciprocity thesis and an attempt to establish its truth, while Ameriks (1978), for example, disagrees. On an account of the sort Ameriks favors, the unity of apperception, and more exactly, the synthesis that explains our consciousness of the identity of the subject, is only a necessary condition for the representation of objects (cf. Allais 2011)[^allais-2011].
    step1: |-
      §17 的一个无争议作用，是给出对对象、更确切地说对对象的表象的一种刻画，这种刻画便于对休谟式联想主义提出挑战。康德的提议是：对象是“在其概念中一个被给予直观的杂多被联合起来者”（B137）。这里的“对象”应作广义理解，即实在的客观特征——其存在与本性不依赖于它如何被知觉（B 142; Bird 1962/1973 130–31; Strawson 1966: 98–104; Guyer 1987: 11–24）[^bird-1962][^guyer-1987][^strawson-1966]。Allison 主张，§17 不仅包含对休谟的这一挑战，还企图依据 §16 所确立的自我意识结论来证明我们表象对象。这一解读是 Allison 对 B 版演绎更宏大构想的一个部分：按此构想，康德证明统觉的统一性蕴含我们表象对象，反过来说，我们表象对象也蕴含统觉的必然统一性（Allison 1983: 144ff; 2015: 352–55; 2015: 335–55, esp. 352）[^allison-1983]。对 Allison 的解读而言，关键主张是：统觉的统一性不仅是我们表象对象的必要条件，而且也是充分条件。他称之为互惠论题。包括 Richard Aquila（1989: 159）、Howell（1992: 227–8）与 Schulting（2012a）在内的其他评论者同意，B 版演绎含有互惠论题以及确立其为真的尝试；而例如 Ameriks（1978）则不同意。在 Ameriks 所偏好的那种说明中，统觉的统一性——更确切地说，说明我们对自己主体同一性之意识的综合——只是表象对象的必要条件（参 Allais 2011）[^allais-2011]。
    step2: |-
      §17 有一项无争议的作用：给出对对象、更确切说是对对象之表象的刻画，而这一刻画便于向休谟式联想主义发起挑战。康德的提议是：对象即“在其概念中一个被给予直观的杂多被联合起来者”（B137）。此处“对象”宜取广义，指实在的客观特征——其存在与本性独立于它如何被知觉（B 142; Bird 1962/1973 130–31; Strawson 1966: 98–104; Guyer 1987: 11–24）[^bird-1962][^guyer-1987][^strawson-1966]。Allison 力主，§17 除含对休谟的这一挑战之外，还试图依据 §16 确立的自我意识结论，证明我们表象对象。此解读属于 Allison 对 B 版演绎的更大构想：依该构想，康德证明统觉的统一性蕴含我们表象对象；反之，我们表象对象也蕴含统觉的必然统一性（Allison 1983: 144ff; 2015: 352–55; 2015: 335–55, esp. 352）[^allison-1983]。对 Allison 而言，关键主张在于：统觉的统一性不仅是我们表象对象的必要条件，亦是其充分条件。他称之为互惠论题。另有评论者——Richard Aquila（1989: 159）、Howell（1992: 227–8）、Schulting（2012a）——同样认为，B 版演绎含有互惠论题及确立其为真的尝试；Ameriks（1978）等人则不以为然。按 Ameriks 所偏好的一类说明，统觉的统一性——更确切说，说明我们关于主体同一性之意识的综合——只是表象对象的必要条件（参 Allais 2011）[^allais-2011]。
