      Allison’s interpretation is attractive particularly because it promises leverage against the skeptic who denies that we represent objects, and also because this leverage is generated by premises about self-consciousness that this skeptic is likely to accept. Nevertheless, there are textual and charitable reasons to resist this reading (Ameriks 1978, Pereboom 1995; Patricia Kitcher 2011: 115–60; Vinci 2014: 193–94)[^ameriks-1978][^kitcher-2011][^pereboom-1995][^vinci-2014]. First of all, in §§18–20 Kant makes significant assumptions about features of our representations of objects that exceed anything that he has argued for in §17 or earlier. In particular, §18 he assumes that our representations of objects manifest a certain kind of necessity and universality, and this he does not purport to establish in §17 or earlier. Moreover, in the summary of the preceding steps of the B-Deduction in §20 Kant does not include premises from §§15–16. What we actually encounter in §20 indicates that Kant intends §§17–20, with some help from §13, to constitute a single, self-contained argument that does not depend on the conclusions about self-consciousness developed in §§15–16.
    step1: |-
      Allison 的解读有吸引力，尤其因为它许诺对否认我们表象对象的怀疑论者取得制胜的杠杆，而这一杠杆又由该怀疑论者很可能接受的自我意识前提所产生。不过，有文本上与善意解释上的理由抵制这一读法（Ameriks 1978, Pereboom 1995; Patricia Kitcher 2011: 115–60; Vinci 2014: 193–94）[^ameriks-1978][^kitcher-2011][^pereboom-1995][^vinci-2014]。首先，在 §18–20 中，康德对我们的对象表象之特征作出了重大假设，这些假设超出了他在 §17 或更早处所论证的任何东西。特别是，§18 假设我们的对象表象表现出某种必然性与普遍性，而他在 §17 或更早处并未声称确立这一点。此外，在 §20 对 B 版演绎前述步骤的概述中，康德并未纳入 §15–16 的前提。我们在 §20 中实际看到的内容表明：康德意在让 §17–20（借助 §13 的一点帮助）构成一个单一而自足的论证，它不依赖于 §15–16 所发展的自我意识结论。
