      Although Strawson’s transcendental argument in *The Bounds of Sense* is not a specific target in Stroud’s (1968), Anthony Brueckner suggests that it is susceptible to the line of criticism that Stroud develops (Brueckner 1983: 557–8)[^brueckner-1983]. For, arguably, Strawson can only conclude that experience must be conceptualized in a certain way, such as to allow the subject to make the distinction between an objective world and her subjective path through it. This is not a conclusion about how a mind-independent world must be, but only about how it must be thought. (Alternatively, Strawson might be read as drawing only a conclusion about how experience must be conceptualized, which would render the transcendental argument as one of a more modest variety (see below)).
    step1: |-
      虽然 Strawson 在《意义的界限》中的先验论证并不是 Stroud（1968）的具体靶子，但 Anthony Brueckner 提示，它也难逃 Stroud 所展开的那条批评路线（Brueckner 1983: 557–8）[^brueckner-1983]。因为可以说，Strawson 只能结论说经验必须以某种方式被概念化，以便主体能作出客观世界与其主观路径之间的区分。这不是关于一个独立于心灵的世界必定如何的结论，而只是关于它必须如何被思想的结论。（或者，也可以把 Strawson 读作只得出关于经验必须如何被概念化的结论，那样一来，这一先验论证便属于较为温和的一类（见下文）。）
    step2: |-
      Strawson 在《意义的界限》中的先验论证，虽非 Stroud（1968）的明确靶子，但 Anthony Brueckner 提示：它同样易受 Stroud 那条批评路线的攻击（Brueckner 1983: 557–8）[^brueckner-1983]。因为 Strawson 至多只能结论说：经验须以某种方式得到概念化，使主体得以区分客观世界与其主观路径。这并非关于独立于心灵的世界必如何的结论，而只是关于它必如何被思想的结论。（另有一种读法：Strawson 只得出经验必如何被概念化的结论；如此则该先验论证属于较温和的一类（见下文）。）
