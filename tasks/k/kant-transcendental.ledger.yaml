      In the *Metaphysical Deduction* (A66–83, B92–116) Kant intends to derive the categories from the specific modes or forms of any human thought about the world, the *logical forms of judgment*. The Metaphysical Deduction has an essential role in the Transcendental Deduction, and we will discuss this argument at an appropriate juncture (when we reach §19 of the B-Deduction).
    step1: |-
      在*形而上学演绎*（A66–83, B92–116）中，康德意欲从任何人类关于世界的思想之特定模式或形式即*判断的逻辑形式*，推导出范畴。形而上学演绎在先验演绎中具有本质作用；我们将在适当关节（讨论到 B 版演绎第 19 节时）讨论这一论证。
    step2: |-
      在*形而上学演绎*（A66–83, B92–116）中，康德意欲从任何人类关于世界的思想之特定模式或形式——即*判断的逻辑形式*——推导出范畴。形而上学演绎在先验演绎中具有本质作用；我们将在适当关节（讨论到 B 版演绎第 19 节时）讨论这一论证。
