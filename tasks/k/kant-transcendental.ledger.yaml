    source: |-
      The Transcendental Deduction (A84–130, B116–169) is Kant’s attempt to demonstrate against classical empiricism that certain *a priori* concepts correctly apply to objects featured in our experience. Dieter Henrich (1989; cf., Proops 2003)[^proops-2003] points out that Kant’s use of ‘*Deduktion*’ redeploys German legal vocabulary; in Holy Roman Empire Law, ‘*Deduktion*’ signifies an argument intended to yield a historical justification for the legitimacy of a property claim. In Kant’s derivative epistemological sense, a deduction is an argument that aims to justify the use of a concept, one that demonstrates that the concept correctly applies to objects. For Kant a concept is *a priori* just in case its source is the faculty of the understanding of the subject and not in sensory experience (A80/B106; Strawson 1966: 86)[^strawson-1966]. The specific *a priori* concepts whose applicability to objects of experience Kant aims to vindicate in the Transcendental Deduction are given in his Table of Categories (A80/B106); they are Unity, Plurality, and Totality (the Categories of Quantity); Reality, Negation, and Limitation (the Categories of Quality); Inherence and Subsistence, Causality and Dependence, and Community (the Categories of Relation), and Possibility-Impossibility, Existence-Nonexistence, Necessity-Contingency (the Categories of Modality).
    step1: |-
      先验演绎（A84–130, B116–169）是康德针对古典经验论、用以证明某些先天概念确实适用于我们经验中的对象的尝试。迪特·亨利希（Dieter Henrich 1989；参 Proops 2003）[^proops-2003]指出，康德对“*Deduktion*”一词的使用挪用了德国法律语汇；在神圣罗马帝国法中，“*Deduktion*”指一种旨在为某项财产主张的正当性提供历史性辩护的论证。在康德派生的知识论意义上，演绎是一种旨在证成一个概念之使用的论证，它表明该概念确实适用于对象。对康德而言，一个概念是先天的，当且仅当其来源是主体的知性能力，而非感官经验（A80/B106；Strawson 1966: 86）[^strawson-1966]。康德在先验演绎中力图证成其适用于经验对象的那些特定先天概念，见其范畴表（A80/B106）：单一性、多数性、全体性（量之范畴）；实在性、否定性、限制性（质之范畴）；依存性与自存性、因果性与依赖性、协同性（关系之范畴）；以及可能性—不可能性、存在—不存在、必然性—偶然性（模态之范畴）。
    step2: |-
