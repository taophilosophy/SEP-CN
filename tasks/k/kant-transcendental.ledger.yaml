    kind: body
    source: |-
      For Kant, the most significant rival theory of mental processing is that of his main empiricist target, Hume. Hume concurs that a theory of experience requires an account of the processing of mental items, but he denies that such an account demands *a priori* concepts or issues in their legitimate applicability to experience. According to his theory, *associationism*, our mental repertoire consists solely of perceptions, all of which are sensory items – the more vivid *impressions*, which constitute sensory experience, and their less vivid copies, *ideas*, which function in imagination, memory, reasoning, and conceptualization (1748, §§2, 3). Association is the process by which these perceptions are related and ordered. A signature feature of association on Hume’s view is that it requires no resources distinct from the perceptions themselves. How perceptions are ordered is solely a function of what perceptions alone can provide. Significantly, a subject not constituted solely of perceptions has no role in Hume’s theory; the Humean subject is just a collection of perceptions (1739: I, IV, vi). These last two features in particular make Humean associationism a highly economical theory, which provides it with an initial advantage over Kant’s more complex view. However, Kant contends that associationism cannot account for the facts to which the premises of the Transcendental Deduction appeal, and that synthesis by *a priori* concepts, that is, the categories, is required in addition.
    step1: |-
      对康德而言，最重要的心理加工竞争理论，来自他的主要经验论对手休谟。休谟同意经验理论需要一种关于心理事项加工的说明，但他否认这种说明需要先天概念、或能得出它们对经验的合法适用性。按他的理论即*联想主义*，我们的心理储备仅由知觉构成，而一切知觉都是感官事项——较生动的*印象*构成感官经验，其较不生动的复本*观念*则在想象、记忆、推理与概念化中起作用（1748, §§2, 3）。联想就是把这些知觉关联并排序的过程。休谟观点中联想的一个标志性特征是：它不需要知觉本身之外的任何资源；知觉如何被排序，纯粹是仅凭知觉所能提供者而来的函数。值得注意的是，在休谟的理论中，并非仅由知觉构成的主体没有位置；休谟式的主体只是一个知觉的集合（1739: I, IV, vi）。尤其后两个特征使休谟式联想主义成为一种高度经济的理论，这使它相对于康德更复杂的观点具有初始优势。然而康德主张：联想主义无法说明先验演绎诸前提所诉诸的事实；除联想之外，还需要由*先天*概念即范畴而来的综合。
