      In §20, Kant ties this notion of judgment to the twelve forms of judgment presented in the Metaphysical Deduction (A70/B95), and he then connects these forms of judgment to the twelve categories (A76–83/B102–9; see Longuenesse 1998 and Stang 2024 for detailed discussion)[^longuenesse-1998][^stang-2024]. The claim has often been made that the links Kant specifies between synthesis and judgment, judgment and the forms of judgment, the forms of judgment and the categories are not sufficiently supported. Guyer, for example, argues that Kant has not adequately established the last of these connections, that although Kant claims that the categories are simply the forms of judgment as they are employed in the synthesis of representations in an intuition (A79/B104–A80/B105, B143), he has failed to make this claim plausible (Guyer 1987: 94–102)[^guyer-1987]. These concerns have merit. Kant’s assertions about these ties remain more obscure than the preceding part of the Transcendental Deduction, and it continues to be a serious challenge for interpreters to clarify and vindicate them.
    step1: |-
      在 §20 中，康德把这一判断概念同形而上学演绎中列出的十二种判断形式联系起来（A70/B95），随后又把这些判断形式同十二范畴联系起来（A76–83/B102–9；详见 Longuenesse 1998 与 Stang 2024）[^longuenesse-1998][^stang-2024]。人们常指出，康德在综合与判断、判断与判断形式、判断形式与范畴之间所指定的那些联系，并未得到充分支持。例如 Guyer 论证说，康德未能充分确立其中最后一种联系：尽管康德声称范畴无非就是判断形式在直观中表象综合里的运用（A79/B104–A80/B105, B143），他却未能使这一主张显得可信（Guyer 1987: 94–102）[^guyer-1987]。这些疑虑有其道理。康德关于这些联系的断言，仍比先验演绎的前面部分更为晦暗；对解释者而言，澄清并证成它们也仍是一项严峻的挑战。
    step2: |-
      §20 中，康德把上述判断概念与形而上学演绎所列的十二种判断形式挂钩（A70/B95），继而把这些判断形式与十二范畴挂钩（A76–83/B102–9；详论见 Longuenesse 1998、Stang 2024）[^longuenesse-1998][^stang-2024]。论者常说：康德在综合与判断之间、判断与判断形式之间、判断形式与范畴之间所指定的那些联系，支撑不足。例如 Guyer 认为，最后一种联系康德并未充分确立：他虽说范畴无非是判断形式在直观中诸表象之综合里的运用（A79/B104–A80/B105, B143），却没能让这一说法显得可信（Guyer 1987: 94–102）[^guyer-1987]。这些疑虑确有道理。康德对这些联系的断言，仍比先验演绎此前部分更为隐晦；澄清并证成它们，至今仍是解释者面临的严峻课题。
