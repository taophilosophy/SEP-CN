      ## 4. Contemporary Practical Transcendental Arguments
    step1: TBD
    step2: TBD
  - id: 131
    kind: body
    source: |-
      Kant ethical writings (1785, 1788) feature several widely and intensely discussed transcendental arguments (see the entry Kant’s moral philosophy). As in metaphysics and epistemology, in recent times anti-skeptical transcendental arguments have also been developed in the practical sphere.
    step1: TBD
    step2: TBD
  - id: 132
    kind: body
    source: |-
      One of P. F. Strawson’s most influential works is his essay on moral responsibility, “Freedom and Resentment” (Strawson 1962)[^strawson-1962]. The reasoning in this article has not traditionally been interpreted as a transcendental argument, but recently Justin Coates has made a strong case for such a reading (Coates 2017; cf. Pereboom 2016)[^coates-2017][^pereboom-2016]. In Coates’s account, the argument begins with the premise to which the moral responsibility skeptic would agree, that meaningful adult interpersonal relationships are possible for us. It continues by pointing out that relationships of this sort require that the participants show each other good will and respect, and that they be justified in expecting this of one another. Expectations for good will and respect in turn require susceptibility to the reactive attitudes, such as moral resentment, indignation, and gratitude, and in particular, justified expectations for good will and respect presuppose that the participants are apt recipients of these reactive attitudes. But to be an apt target of the reactive attitudes is just what it is to be a morally responsible agent. Consequently, that we are morally responsible agents is a necessary condition of the possibility for us of meaningful adult interpersonal relationships.
    step1: TBD
    step2: TBD
  - id: 133
    kind: body
    source: |-
      Note that not all the connections among the steps of the argument are plausibly instances of appeals to logical or even metaphysical necessary conditions. True, some are: if being an apt target of the reactive attitudes is what it is to be a morally responsible agent, the necessary connection invoked would be conceptual or metaphysical. But if expectations for good will and respect do require susceptibility to the reactive attitudes, this would be plausibly a case of nomological necessitation, where the relevant laws are psychological. But given the sort of skepticism targeted, nomological necessitation is not too weak a connection; it is not called into question by the arguments of the moral responsibility skeptic.
    step1: TBD
    step2: TBD
  - id: 134
    kind: body
    source: |-
      Critics have in effect taken issue with a number of steps of this argument, for example that expectations for good will and respect require susceptibility to the reactive attitudes, and that justified expectations for good will and respect presuppose that the participants are apt recipients of the reactive attitudes. Perhaps human relationships do not require susceptibility to moral resentment and indignation, but only to the nonreactive attitudes of moral protest, disappointment, and sorrow (Pereboom 2021)[^pereboom-2021]. Another avenue of criticism involves separating moral responsibility from being an apt target of the reactive attitudes. It may be that a forward-looking, that is, what Strawson calls an ‘optimistic’ notion of responsibility, is all that’s required for good relationships, and it is not characterized by being an apt target of the reactive attitudes. But these criticisms are controversial, and Strawson’s argument is widely accepted and acclaimed.
    step1: TBD
    step2: TBD
  - id: 135
    kind: body
    source: |-
      Another prominent transcendental argument in the practical sphere is the sort Christine Korsgaard (1996) develops for Kantian claim that we must value ourselves as rational agents. Here is Robert Stern and Tony Cheng’s (2023) representation of one argument of this sort. The initial premise concerns rational choice, and crucially features the notion of an agent’s practical identity, the distinctive nature of a person as an agent, which may include, for example, being a parent or a philosophy professor:
    step1: TBD
    step2: TBD
  - id: 136
    kind: body
    source: |-
      1. To rationally choose to do X, you must take it that doing X is the rational thing to do.
      2. Since there is no reason in itself to do X, you can take it that X is the rational thing to do only if you regard your practical identity as making X the rational thing to do.
      3. You cannot regard your practical identity as making doing X the rational thing to do unless you can see some value in that practical identity.
      4. You cannot see any value in any particular practical identity as such, but can regard it as valuable only because of the contribution it makes to giving you reasons and values by which to live.
      5. You cannot see having a practical identity as valuable in this way unless you think your having a life containing reasons and values is important.
      6. You cannot regard it as important that your life contain reasons and values unless you regard your leading a rationally structured life as valuable.
      7. You cannot regard your leading a rationally structured life as valuable unless you value yourself qua rational agent.
      8. Therefore, you must value yourself qua rational agent, if you are to make any rational choice.
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      Stern and Cheng (2023) explain this argument as follows. To act is to do or choose something for a reason. However, an agent has reasons to act only because of her practical identity; she does not have reasons to act independently of that identity. But a practical identity can yield such a reason only if she regards that identity as valuable. Merely being a parent gives one no reason to care for one’s children. Rather, valuing one’s parenthood has this force. At the same time, an agent cannot regard a particular practical identity as valuable in itself; Korsgaard argues that this sort of realism about value is implausible. The only remaining explanation is that she regards it as valuable because of the contribution it makes to providing her with reasons and values by which to live. But then she must believe that it matters that her life has the sort of rational structure that having such identities provides. However, to see that as mattering, she must regard leading a rationally structured life as valuable. Then, in conclusion, to regard leading such a life as valuable, an agent must see her rational nature as valuable.
    step1: TBD
    step2: TBD
