      To illustrate and support these claims, Kant invokes examples of the ordering of phenomena in time that also have the key role in the discussion of the Second Analogy (cf. Guyer 1987: 87–90; Dicker 2004: 137–44)[^dicker-2004][^guyer-1987]. There Kant argues that our representations, considered independently of their content, are always successive. For example, when I view the front, sides, and back of the house when walking around it, and when I watch a boat float downstream, my representations of the individual parts and states occur successively. The content of these successive representations, however, can be represented as either determinately and objectively successive or as determinately and objectively simultaneous. And as it in fact turns out, despite the representations in each of these sequences being subjectively successive, we represent the parts of the house as objectively simultaneous, and the positions of the boat as objectively successive. How might we account for this difference in objectivity despite the similarity in subjectivity? (Melnick 1973: 89)[^melnick-1973]
    step1: |-
      为说明并支持这些主张，康德举出若干现象在时间中排序的例子，这些例子在第二类比的讨论中也起关键作用（参 Guyer 1987: 87–90; Dicker 2004: 137–44）[^dicker-2004][^guyer-1987]。在那里康德论证说，我们的表象若不顾其内容，便总是相继的。例如，我绕着一座房子走动并观看其正面、侧面与背面，或者我注视一条船顺流而下时，我对各个部分与状态的表象都是相继发生的。然而，这些相继表象的内容，却可以被表象为确定地、客观地相继，也可以被表象为确定地、客观地同时。而事实上，尽管这两组序列中的表象在主观上都是相继的，我们却把房子的各个部分表象为客观上同时的，把船的位置表象为客观上相继的。尽管主观方面相似，这一客观性上的差异该如何说明？（Melnick 1973: 89）[^melnick-1973]
    step2: |-
      为阐明并支持上述主张，康德援引了若干现象在时间中排序的例子，这些例子在第二类比的讨论中同样举足轻重（参 Guyer 1987: 87–90; Dicker 2004: 137–44）[^dicker-2004][^guyer-1987]。康德的论证是：我们的表象若撇开内容来看，总是相继的。譬如，我绕房而行，看它的正面、侧面与背面；或注目一舟顺流而下——我对各个部分、各种状态的表象都是先后发生的。但这些相继表象的内容，却可以表象为确定而客观的相继，也可以表象为确定而客观的同时。事实上，尽管两个序列中的表象在主观上皆属相继，我们仍把房屋各部分表象为客观同时，把船的诸位置表象为客观相继。主观方面如此相似，客观性上却有此差异，该如何解释？（Melnick 1973: 89）[^melnick-1973]
