      Kant hasn’t established, according to van Cleve, that the categories actually apply to experience. As Gomes (2010: 121) puts it, “perhaps our application of the categories in experience is always mistaken, and there is nothing which corresponds to the way in which we have synthesized the manifold.” As he points out, the second step reaches its conclusion through the analysis of the structure of our representation of space and time, from which Kant then draws the conclusion that space and time themselves have that very structure (Gomes 2010: 130; Gomes cites a similar claim by Longuenesse 1998, 213)[^gomes-2010][^longuenesse-1998]. If space and time themselves have the structure of our representations of them, then the requisite correspondence is in place, and van Cleve’s objection is answered.
    step1: TBD
    step2: TBD
