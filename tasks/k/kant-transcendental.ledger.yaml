      6. My mental states have this particular kind of unity, (4, 5)
      7. This particular kind of unity of my mental states cannot be accounted for by association. (premise)
      8. If (6) is true, then this particular kind of unity of my mental states is accounted for by synthesis by *a priori* concepts. (premise)
      9. My mental states have a particular kind of unity that is accounted for by synthesis by *a priori* concepts. (7, 8)
