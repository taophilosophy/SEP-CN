      A further concern of Guyer’s is that Kant assumes without defense that all knowledge of necessity is grounded in *a priori* concepts, the categories specifically. But, in response, perhaps we need not interpret Kant as arguing directly from (U-N) to the claim that the categories correctly apply to objects in our experience. Rather, we can see him as advancing his claim for the applicability of the categories by ruling out association as an explanation for (U-N). The challenge Kant issues is to explain why, under normal conditions, the ordering in question is universal and necessary. Part of the best explanation, he believes, is that we must have a faculty for ordering the representations. Hume might agree with this conclusion, supposing a sufficiently thin conception of ‘faculty,’ and that this faculty is association. Kant counters by arguing that association cannot account for the truth of propositions such as (U-N), since the very paradigms of association, such as word association and the association of topics in a conversation, do not exhibit the requisite universality and necessity. The alternative that can account for the truth of propositions such as (U-N) involves affirming that the faculty in question must be one that employs the categories.
    step1: |-
      Guyer 还有一个疑虑：康德未经辩护便假定，一切关于必然性的知识都奠基于*先天*概念、尤其是范畴之上。但作为回应，我们也许不必把康德理解为直接从 (U-N) 论证范畴正确适用于我们经验中的对象。毋宁说，可以把他看作通过排除联想作为 (U-N) 的解释，来推进其关于范畴可适用性的主张。康德提出的挑战是：解释为什么在正常条件下，所论的那种排序是普遍而必然的。他相信，最佳解释的一部分在于：我们必须具有一种为表象排序的能力。若对“能力”作足够单薄的理解，并且承认这种能力就是联想，休谟或许会同意这一结论。康德的反驳是：联想无法说明诸如 (U-N) 这类命题之真，因为联想本身的范式——如词语联想与对话中各话题的联想——并不表现出所需的普遍性与必然性。能够说明 (U-N) 这类命题之真的替代方案，则须肯定所论能力必须是一种运用范畴的能力。
    step2: |-
      Guyer 另有疑虑：康德未经辩护便假定，凡关于必然性的知识都奠基于*先天*概念、特别是范畴。对此不妨回应说：我们未必非要把康德读成由 (U-N) 直接推出“范畴正确适用于我们经验中的对象”。更可取的读法是：他排除联想作为 (U-N) 之解释，以此推进范畴可适用性的主张。康德所下的挑战是：说明为何在正常条件下，所论排序是普遍而必然的。他认为，最佳解释之一环，在于我们必须具备为表象排序的能力。若把“能力”理解得足够单薄，且承认此能力即联想，休谟或可同意这一结论。康德的反驳则是：联想说明不了 (U-N) 一类命题之真，因为联想自己的范式——词语联想、对话中话题的联想——并不呈现所需的普遍性与必然性。而能够说明 (U-N) 一类命题之真的替代方案，则须确认所论能力乃是一种运用范畴的能力。
