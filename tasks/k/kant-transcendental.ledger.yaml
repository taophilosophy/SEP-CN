      This is a contending and plausible hypothesis for a role for the second step in the B-Deduction. One might ask, however, whether the account Kant provides on that hypothesis can respond convincingly to van Cleve’s objection. Even on certain idealist views, such as that of G. W. Leibniz (1646–1716) according to Robert Adams (1983, 1994: 217–61, cf. Wilson 1987)[^wilson-1987], our ordinary sensible representations of space, and of physical entities more generally, may not represent them as they really are. By contrast, on the idealist position of George Berkeley’s (1685–1753) as represented in the third of the *Three Dialogues between Hylas and Philonous* (1713/1998), the properties of physical entities match our sensible representations of them exactly, without a possibility of a mismatch; the oar in the water really is bent when I see it as bent. On the type of idealism Kant endorses (and one might of course question whether it has been established), the possibility of a mismatch remains in place even if our representation of space structures space itself (Pereboom 1988; Stang 2018; Jauernig 2021)[^jauernig-2021][^pereboom-1988][^stang-2018]. For instance, we may sensibly represent space as Euclidean while is in fact Riemannian. One might respond that the representation that structures space would then also be Riemannian, and we would have a match. But then a crucial feature of our representation of space would be inaccessible absent serious empirical investigation, and the nature of the project would be altered.
    step1: |-
      这是一个有竞争力且可信的假说，用以说明第二步在 B 版演绎中的作用。然而人们可以问：按这一假说，康德所提供的说明能否令人信服地回应 van Cleve 的反对？即便在某些唯心论观点下——例如据 Robert Adams（1983, 1994: 217–61，参 Wilson 1987）[^wilson-1987]所解释的莱布尼茨（G. W. Leibniz, 1646–1716）观点——我们对空间、以及更一般地对物理对象的日常感性表象，也许并未把它们表象为其本来所是。相反，在乔治·贝克莱（1685–1753）的唯心论立场下——如《希勒斯与菲洛诺斯的三篇对话》（1713/1998）第三篇所表述的——物理对象的性质与我们的感性表象完全吻合，不可能出现不符；我见水中的桨是弯的，桨便真是弯的。而在康德所主张的那类唯心论下（人们当然可以质疑它是否已被确立），即便我们对空间的表象构造了空间本身，不符的可能性依然存在（Pereboom 1988; Stang 2018; Jauernig 2021）[^jauernig-2021][^pereboom-1988][^stang-2018]。例如，我们可以在感性上把空间表象为欧几里得式的，而它实际上是黎曼式的。或可回应说：那么构造空间的表象便也会是黎曼式的，我们便有了吻合。但这样一来，我们对空间之表象的一个关键特征，若不经过严肃的经验探究便无法通达，而整个工程的性质也就随之改变。
    step2: |-
      这是个有竞争力、也说得通的假说，用来说明第二步在 B 版演绎中所司何职。但人们不妨追问：依此假说，康德所给的说明能否有力地回应 van Cleve 的诘难？即便在某些唯心论观点之下——例如 Robert Adams（1983, 1994: 217–61；参 Wilson 1987）[^wilson-1987]所诠释的莱布尼茨（G. W. Leibniz, 1646–1716）之说——我们关于空间、进而关于一般物理对象的日常感性表象，未必把它们表象为其本来面目。反之，乔治·贝克莱（1685–1753）的唯心论立场（如《希勒斯与菲洛诺斯的三篇对话》〔1713/1998〕第三篇所述）则主张：物理对象的性质与我们关于它们的感性表象严丝合缝，不容错位。我见水中之桨为弯，桨便真弯。至于康德所主张的那类唯心论（其是否成立，自然大可存疑），纵使我们关于空间的表象构造了空间本身，错位的可能性仍未消除（Pereboom 1988; Stang 2018; Jauernig 2021）[^jauernig-2021][^pereboom-1988][^stang-2018]。譬如，我们或可在感性上把空间表象为欧氏空间，而它实际上是黎曼式的。有人会回应：那么构造空间的表象便也是黎曼式的，正好吻合。可这样一来，我们空间表象的一个关键特征，便非经严肃的经验探究而不可得；整个工程的性质也随之改变。
