      Kant’s view is that given only the resources of association, the truth of (U-N) cannot be explained. The reason is “whether I can become empirically conscious of the manifold as simultaneous or as successive depends on circumstances or empirical conditions,” and so “the empirical unity of consciousness, through association of representations, itself concerns an appearance, and is wholly contingent” (B139–40). Association cannot explain the truth of (U-N), for given only the resources of association, the parts of the house will not necessarily or universally be represented as objectively simultaneous even supposing only normal empirical conditions. Kant asks us to consider an activity, word association, which functions as a paradigm for association. Word association, familiarly, does not yield universal and necessary patterns; “one person connects the representation of a certain word with one thing, the other [person] with another thing…” (B140). Hume’s own paradigm for association in is the relations among parts of a conversation (1748: §3). In such conversations, people make different associations in the same circumstances. Kant’s point is that if the very paradigms for association fail to exhibit the sort of necessity and universality at issue, then the hypothesis that association is powerful enough to yield such an ordering of representations – wherever we find it – is ruled out. (Pereboom 1995; Dickerson 2004: 170–77; for an account of a more general relationship in Kant between universality and necessity on the one hand and apriority on the other, see Smit 2009)[^dicker-2004][^dickerson-2004][^pereboom-1995][^smit-2009].
    step1: |-
      康德的看法是：仅凭联想所提供的资源，(U-N) 之真无法得到说明。理由在于：“我能否经验地意识到杂多是同时的或相继的，取决于各种情况或经验条件”，所以“通过表象联想而来的意识之经验统一性本身只涉及现象，并且完全是偶然的”（B139–40）。联想无法说明 (U-N) 之真，因为仅凭联想的资源，即便只设想正常的经验条件，房子的各部分也不会必然地或普遍地被表象为客观同时。康德要我们考虑一种活动即词语联想，它可作联想的范式。众所周知，词语联想并不会产生普遍而必然的模式；“一个人把某个词的表示与一件事物结合起来，另一个人则与另一件事物结合……”（B140）。休谟本人为联想所立的范式是对话各部分之间的关系（1748: §3）。在此类对话中，人们在同样的情况下作出不同的联想。康德的要点是：如果连联想本身的范式都无法表现出所论的必然性与普遍性，那么“联想强大到足以产生这样一种表象排序——无论我们在何处发现它”这一假设便被排除（Pereboom 1995; Dickerson 2004: 170–77；关于康德那里普遍性与必然性同先天性之间更一般关系的说明，见 Smit 2009）[^dicker-2004][^dickerson-2004][^pereboom-1995][^smit-2009]。
    step2: |-
      康德的观点是：仅凭联想的资源，(U-N) 之真无从解释。理由在于“我能否经验地意识到杂多为同时的抑或相继的，取决于情形或经验条件”，故“由表象联想而来的意识之经验统一性，本身只关涉现象，且全然是偶然的”（B139–40）。联想解释不了 (U-N) 之真：仅凭联想的资源，哪怕只假定正常的经验条件，房屋各部分也未必必然地、普遍地被表象为客观同时。康德请我们考虑词语联想这一活动——它是联想的范式。众所周知，词语联想生不出普遍而必然的模式；“某人把某个词的表示与一物联结，另一人则与另一物联结……”（B140）。休谟本人给联想所立的范式，是对话各部分之间的关系（1748: §3）；而在此类对话中，同一情形之下人们的联想各不相同。康德的要点是：倘若连联想的范式本身都显现不出所论那种必然性与普遍性，那么“联想之力量足以生成这样一种表象排序——无论它在何处出现”这一假设便告不成立（Pereboom 1995; Dickerson 2004: 170–77；关于康德那里普遍性、必然性与先天性之间更一般关系的论述，见 Smit 2009）[^dicker-2004][^dickerson-2004][^pereboom-1995][^smit-2009]。
