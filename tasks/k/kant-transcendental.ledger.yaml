      The empiricist David Hume (1711–1776) in effect denies that a deduction can be provided for a number of metaphysical concepts – *ideas*, in his terminology – including the ideas of personal identity, of identity over time more generally, of the self as a subject distinct from its perceptions, and of causal power or force (1739, 1748). In Hume’s view, a concept can be validated only by finding a sensory experience, that is, an *impression*, in particular the one that is the ‘original’ of that idea, that resembles the idea. But because, for example, any attempt to find an impression of causal power turns out to be fruitless, Hume concludes that this idea does not legitimately apply (1748: §7). In Kant’s terminology, Hume is determining whether it’s possible to provide an *empirical* deduction of the concept of causal power (A85/B117), and from the failure of the attempt to do so, he concludes that this concept lacks *objective validity*, that is, it does not apply to the objects of our experience as they are independently of our subjective states (e.g., Kraus 2020, 22–24)[^kraus-2020].
    step1: |-
      经验论者大卫·休谟（1711–1776）实际上否认能为若干形而上学概念——用他的术语说，是若干*观念*——提供演绎，其中包括人格同一性、更一般的时间中的同一性、作为区别于其知觉的主体之自我，以及因果力或因果力的观念（1739, 1748）。在休谟看来，一个概念唯有找到与之相似的感官经验，即一个*印象*——尤其是作为该观念“原本”的那个印象——才能得到证成。但由于例如任何寻找因果力之印象的尝试都归于徒劳，休谟便结论说这一观念并不合法地适用（1748: §7）。用康德的术语说，休谟是在判定能否为因果力概念提供一种*经验性*演绎（A85/B117）；而由这一尝试的失败，他结论说该概念缺乏*客观有效性*——即它并不适用于我们经验的对象，就这些对象独立于我们主观状态而言（例如 Kraus 2020, 22–24）[^kraus-2020]。
    step2: |-
      经验论者大卫·休谟（1711–1776）实际上否认能为若干形而上学概念——用他的术语说，是若干*观念*——提供演绎，其中包括人格同一性、更一般的时间中的同一性、作为区别于其知觉的主体之自我，以及因果力或因果作用力的观念（1739, 1748）。在休谟看来，一个概念唯有找到与之相似的感官经验——即一个*印象*，尤其是作为该观念“原本”的那个印象——才能得到证成。但由于例如任何寻找因果力之印象的尝试都归于徒劳，休谟便结论说：这一观念并不合法地适用（1748: §7）。用康德的术语说，休谟是在判定能否为因果力概念提供一种*经验性*演绎（A85/B117）；由这一尝试的失败，他结论说该概念缺乏*客观有效性*——即它并不适用于我们经验的对象，就这些对象独立于我们主观状态而言（例如 Kraus 2020, 22–24）[^kraus-2020]。
