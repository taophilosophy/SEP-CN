      Kant characterizes synthesis as “the act of putting different representations together, and grasping what is manifold in them in one cognition” (A77/B103); it is a process that “gathers the elements for cognition, and unites them to form a certain content” (A78/B103). Synthesis takes multiple representations – in Kant’s terminology, a ‘manifold’ – and connects them with one another to produce a single further representation with cognitive content (Patricia Kitcher 1990, 2011)[^kitcher-1990]. This process employs concepts as modes or ways of ordering representations. A claim critical to the Transcendental Deduction is that it is the categories by means of which manifolds of our representations are synthesized. Since the understanding of the subject is the source of the categories, and also a faculty that yields synthesis, the subject plays a crucial role in mental processing. It is important for Kant’s view on mental processing that this subject is distinct from its representations or perceptions, and this is another respect in which it differs from Hume’s theory.
    step1: |-
      康德把综合刻画为“把不同表象放在一起、并在一个认识中把握其中之杂多的活动”（A77/B103）；它是“为认识收集要素、并联合它们以形成某种内容”的过程（A78/B103）。综合取多个表象——用康德的术语，取一个“杂多”——把它们彼此联结，以产生一个具有认知内容的单一进一步表象（Patricia Kitcher 1990, 2011）[^kitcher-1990]。这一过程把概念用作排序表象的模式或方式。对先验演绎至关重要的一个主张是：正是凭借范畴，我们表象的杂多才得到综合。既然范畴源于主体的知性，而知性又是产生综合的能力，主体便在心理加工中起关键作用。对康德的心理加工观来说要紧的是：这一主体区别于其表象或知觉——这又是它不同于休谟理论的一个方面。
