      > 空间被表象为对象（如几何学中实际所需的那样），所包含的多于直观的单纯形式，即：包含按照感性形式被给予的杂多在一种直观表象中的总括，以至于直观形式只给出杂多，而形式直观则给出表象的统一性。在感性论中，我把这种统一性仅仅归于感性，只是为了指明它先于一切概念，虽然它确实预设了一种综合——这综合不属于感官，但一切空间与时间的概念都唯有通过它才成为可能。因为，由于通过它（知性规定感性），空间或时间才首次作为直观被给予，所以这种先天直观的统一性便属于空间与时间，而不属于知性的概念（§24）。
