      According to one widespread reading of the B-Deduction, §§15–20 comprise a an argument whose only assumption is the premise about self-consciousness that Kant defends in §16. Strawson, for example, is a proponent of such an interpretation (1966), as are Robert Paul Wolff (1963), Jonathan Bennett (1966), Henry Allison (1983), Edwin McCann (1985), and Dennis Schulting (2012a). Demonstrating that we represent objects or an objective world has a key role in most versions of this reading. On Strawson’s interpretation, for instance, “the fact that my experience is of a unified objective world is a necessary consequence of the fact that only under this condition could I be conscious of my diverse experiences as one and all my own” (1966: 94). Some interpreters dissent; Karl Ameriks, for example, contends that Strawson’s conception of the Deduction is motivated by a desire to see it as showing that the skeptic about the external world is mistaken, while in fact refuting this sort of skeptic is not one of Kant’s aims for this argument (Ameriks 1978; also Allais 2011, 2015)[^allais-2011][^ameriks-1978]. Patricia Kitcher (2011: 115–18) argues against the single premise about self-consciousness interpretation on historical and textual grounds.
    step1: |-
      按一种流传甚广的读法，B 版演绎的 §15–20 构成一个论证，其唯一的假设是康德在 §16 中为之辩护的那个关于自我意识的前提。例如 Strawson 就是这种解读的支持者（1966），Robert Paul Wolff（1963）、Jonathan Bennett（1966）、Henry Allison（1983）、Edwin McCann（1985）与 Dennis Schulting（2012a）亦然。在多数版本的这种读法中，证明我们表象对象或一个客观世界都起关键作用。例如按 Strawson 的解读，“我的经验是一个统一的客观世界的经验这一事实，是如下事实的必然结果：只有在这一条件下，我才能把我的各种经验意识为同一个、且全都属于我的经验”（1966: 94）。有些解释者不赞成。例如 Karl Ameriks 主张，Strawson 对演绎的构想出于一种愿望，即把它看作证明了关于外部世界的怀疑论者是错的，而事实上驳倒这类怀疑论者并不是康德这一论证的目标之一（Ameriks 1978；另见 Allais 2011, 2015）[^allais-2011][^ameriks-1978]。Patricia Kitcher（2011: 115–18）则从历史与文本两方面反对“单一自我意识前提”的解读。
    step2: |-
      按一种颇为流行的读法，B 版演绎 §15–20 构成一个论证，其唯一假设就是康德在 §16 中为之辩护的自我意识前提。Strawson（1966）即持此种解读，Robert Paul Wolff（1963）、Jonathan Bennett（1966）、Henry Allison（1983）、Edwin McCann（1985）与 Dennis Schulting（2012a）亦然。在这一读法的多数版本中，“我们表象对象、或表象一个客观世界”一点起着关键作用。以 Strawson 的解读为例：“我的经验乃是一个统一的客观世界之经验，这一事实是下述事实的必然结果：唯有在此条件下，我才可能把我的种种不同经验意识为全都属于同一个我”（1966: 94）。亦有解释者持异议。例如 Karl Ameriks 认为，Strawson 对演绎的构想源于一种愿望——想让它表明关于外部世界的怀疑论者错了；而驳倒这类怀疑论者其实并不在康德此论证的目标之列（Ameriks 1978；另见 Allais 2011, 2015）[^allais-2011][^ameriks-1978]。Patricia Kitcher（2011: 115–18）则从历史与文本两方面反驳“单一自我意识前提”的解读。
