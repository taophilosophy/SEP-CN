      Among Immanuel Kant’s (1724–1804) most influential contributions to philosophy is his development of the transcendental argument. In Kant’s conception, an argument of this kind begins with a compelling premise about our thought, experience, or knowledge, and then reasons to a conclusion that is a substantive and unobvious presupposition and necessary condition of this premise. The crucial steps in this reasoning are claims to the effect that a subconclusion or conclusion is a presupposition and necessary condition of a premise. Such a necessary condition might be a logically necessary condition, but often in Kant’s transcendental arguments the condition is necessary in the sense that it is the only possible explanation for the premise, whereupon the necessity might be weaker than logical. Typically, this reasoning is intended to be *a priori* in some sense, either strict (Smit 1999)[^smit-1999] or more relaxed (Philip Kitcher 1981, Pereboom 1990)[^kitcher-1981][^pereboom-1990]. The conclusion of the argument is often directed against skepticism of some sort. For example, Kant’s Transcendental Deduction targets Humean skepticism about the applicability of *a priori* metaphysical concepts, and his Refutation of Idealism takes aim at skepticism about external objects. These two transcendental arguments are found in the *Critique of Pure Reason* (1781, 1787), but such arguments are found throughout Kant’s writings, for example in the *Groundwork of the Metaphysics of Morals* (1785), in the *Critique of Practical Reason* (1788), in the *Critique of the Power of Judgment* (1790), and in the *Opus Posthumum* (1804; Förster 1989)[^förster-1989]. This article focuses on the Transcendental Deduction, the Refutation of Idealism, several transcendental arguments that are inspired by Kant’s work. (For recent general accounts of the nature of transcendental arguments, see Stern and Cheng 2023 and Jędrczak 2026.)[^jędrczak-2026][^stern-2023]
    step1: |-
      伊曼努尔·康德（1724–1804）对哲学最具影响力的贡献之一，是他对先验论证的发展。在康德的构想中，这类论证从一个关于我们思想、经验或知识的强前提开始，然后推论出一个作为该前提之实质而并不显见的预设与必要条件的结论。这一推理的关键步骤，是主张某个子结论或结论乃某前提的预设与必要条件。这样的必要条件可以是逻辑上必要的条件，但在康德的先验论证中，这一条件常常是“唯一可能的解释”意义上的必要——就此而言，其必要性也许弱于逻辑必然性。通常，这一推理意在某种意义上成为先天的，或取严格意义（Smit 1999）[^smit-1999]，或取较宽松的意义（Philip Kitcher 1981, Pereboom 1990）[^kitcher-1981][^pereboom-1990]。论证的结论常针对某种怀疑论。例如，康德的先验演绎针对休谟关于先天形而上学概念之适用性的怀疑论，而其驳斥唯心论则针对关于外部对象的怀疑论。这两项先验论证见于《纯粹理性批判》（1781, 1787），但这类论证遍见于康德著作，例如《道德形而上学奠基》（1785）、《实践理性批判》（1788）、《判断力批判》（1790）以及《遗著》（1804；Förster 1989）[^förster-1989]。本文聚焦先验演绎、驳斥唯心论，以及若干受康德工作启发的先验论证。（关于先验论证本性的晚近综论，见 Stern and Cheng 2023 与 Jędrczak 2026。）[^jędrczak-2026][^stern-2023]
    step2: |-
      伊曼努尔·康德（1724–1804）对哲学最具影响力的贡献之一，是他对先验论证（transcendental argument）的发展。在康德的构想中，这类论证以一个关于我们思想、经验或知识的强前提开篇，进而推论出一个结论：该结论是这一前提的实质而并不显见的预设与必要条件。推理的关键步骤，是主张某个子结论或结论乃某前提的预设与必要条件。这样的必要条件可以是逻辑上必要的条件；但在康德的先验论证中，该条件常常是“唯一可能的解释”意义上的必要——就此而言，其必要性也许弱于逻辑必然性。通常，这一推理意在某种意义上成为先天的，或取严格意义（Smit 1999）[^smit-1999]，或取较宽松的意义（Philip Kitcher 1981, Pereboom 1990）[^kitcher-1981][^pereboom-1990]。论证的结论常针对某种怀疑论。例如，康德的先验演绎针对休谟关于先天形而上学概念之适用性的怀疑论，其驳斥唯心论则针对关于外部对象的怀疑论。这两项先验论证见于《纯粹理性批判》（1781, 1787），但这类论证遍见于康德著作，例如《道德形而上学奠基》（1785）、《实践理性批判》（1788）、《判断力批判》（1790）以及《遗著》（1804；Förster 1989）[^förster-1989]。本文聚焦先验演绎、驳斥唯心论，以及若干受康德工作启发的先验论证。（关于先验论证本性的晚近综论，见 Stern and Cheng 2023 与 Jędrczak 2026。）[^jędrczak-2026][^stern-2023]
