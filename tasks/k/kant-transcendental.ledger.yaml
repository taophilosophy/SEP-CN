      Three of the most pressing problems that have been raised for the Refutation are the following. First, a skeptic might well reject Premise (1) on the ground of a general skepticism about memory (Allison 1983: 306–7)[^allison-1983]. Bertrand Russell, for example, suggests that for all I know I was born five minutes ago (Russell 1912)[^russell-1912]. On this skeptical hypothesis, I would be mistaken in my belief that I had experiences A, B, and C which occurred more than five minutes ago, first A, then B, and lastly C. Plausibly, a skeptic who claimed that we lack adequate justification for a belief that external objects exist would likely also be disposed to claim that I lack justification for my belief that I had experiences that occurred in the past in that specific temporal order. Thus Kant’s supposition that Premise (1) yields leverage against an external-world skeptic is mistaken (cf. Dicker 2008, Chignell 2010)[^chignell-2010][^dicker-2008].
    step1: TBD
    step2: TBD
