      Hume’s position on the deducibility of *a priori* metaphysical concepts is Kant’s quarry in the Transcendental Deduction. But Kant concurs with Hume’s proposal that no empirical deduction can be supplied for such concepts. Instead, he sets out to provide a different sort of justification for their use, one that is *transcendental* rather than empirical. Such a transcendental deduction begins with a premise about any possible human experience, a premise to which reasonable participants in the debate can be expected initially to agree, and then contends that a presupposition and necessary condition of the truth of that premise is the applicability of the *a priori* concepts in question to the objects of experience. Kant’s Transcendental Deduction features a number of component transcendental arguments. Each begins with a premise either about the self-attributability of mental items, *apperception*, or else a premise about the necessity and universality of some feature of our experience of objects. Kant’ strategy is to establish a theory of mental processing, *synthesis*, by arguing that its truth is a necessary condition for the truth of such a premise, and then to show that the *a priori* concepts at issue – the categories – play an essential role in this sort of mental processing. On a metaphysical idealist interpretation of his position, the objects of experience result from this mental processing, and it is in virtue of the role that the categories play in this processing that they correctly apply to objects. In the Transcendental Deduction Kant would thus intend to secure a normative claim, that the categories correctly apply to the objects of our experience, by establishing a psychological theory (Henrich 1989; Patricia Kitcher 1990: 2–29; for information on related argumentative strategies in Kant’s historical context, see Kuehn 1997 and Dyck 2011)[^dyck-2011][^henrich-1989][^kitcher-1990][^kuehn-1997]. The Transcendental Deduction presents general considerations supporting the applicability of all the categories to the objects of our experience; it does not concentrate on the applicability of specific categories. This more focused task is taken up in the Analytic of Principles (A130–235/B169–287).
    step1: |-
      休谟关于先天形而上学概念可演绎性的立场，是康德在先验演绎中的猎物。但康德同意休谟的提议：此类概念无法提供经验性演绎。他转而着手为它们的使用提供另一种证成——一种先验的而非经验性的证成。这样的先验演绎始于一个关于任何可能人类经验的前提，一个论辩中理性的参与者起初可望同意的前提；然后主张：该前提之真的一个预设与必要条件，就是所论先天概念对经验对象的可适用性。康德的先验演绎包含若干组成部分性的先验论证。每一论证或始于关于心理事项之自我归赋——即统觉——的前提，或始于关于我们对象经验之某特征的必要性与普遍性的前提。康德的策略是：先论证一种心理加工理论即综合之真乃此类前提之真的必要条件，从而确立该理论；然后再表明所论先天概念——范畴——在这种心理加工中起本质作用。按其立场的形而上学唯心论解读，经验的对象由这一心理加工产生，而范畴正是凭借在此加工中所起的作用而正确地适用于对象。于是，康德在先验演绎中便意在通过确立一种心理学理论，来确保一个规范性主张：范畴正确地适用于我们经验的对象（Henrich 1989；Patricia Kitcher 1990: 2–29；关于康德历史语境中相关论证策略的信息，见 Kuehn 1997 与 Dyck 2011）[^dyck-2011][^henrich-1989][^kitcher-1990][^kuehn-1997]。先验演绎呈现的是支持一切范畴适用于我们经验对象的一般性考虑，并不专注于特定范畴的可适用性；这一更聚焦的任务由《原理分析论》（A130–235/B169–287）承担。
