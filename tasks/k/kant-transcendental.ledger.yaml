      The argument from above in §16 can be divided into two stages. The goal of the first is to establish the various components of *the principle of the necessary unity of apperception*. The second stage aims to show that synthesis is a necessary condition for the aforementioned aspect of self-consciousness, which this principle highlights. *Apperception* is the apprehension of a mental state – of a representation, in Kant’s terminology – as one’s own; one might characterize it as the self-ascription or self-attribution of a mental state (Strawson 1966: 93–94)[^strawson-1966]. In Kant’s conception, my apperception has *necessary unity* since all of my representations *must* be grounded “in pure apperception, that is, in the thoroughgoing *identity* of the self in all possible representations” (B131–32, emphasis mine). By this he means that:
    step1: |-
      §16 的自上而下的论证可分为两个阶段。第一阶段旨在确立*统觉的必然统一性原则*的各个组成部分。第二阶段意在表明：综合是上述自我意识面向的必要条件，而这一原则所凸显的正是该面向。*统觉*是把一个心理状态——用康德的术语，把一个表象——把握为自己的；人们可以把它刻画为对一个心理状态的自我归赋或自我归属（Strawson 1966: 93–94）[^strawson-1966]。在康德的构想中，我的统觉具有*必然的统一性*，因为我的一切表象都*必须*被奠基“于纯粹统觉之中，即在一切可能表象中自我的彻底*同一性*”（B131–32，着重为我所加）。他以此意指：
