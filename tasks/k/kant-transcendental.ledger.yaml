      Premise (1) is intended as a claim the skeptic about the legitimate applicability of *a priori* concepts will at least initially accept. The crucial necessary conditions, expressed by (3) and (7), are necessary conditions of only possible explanation. However, Paul Guyer forcefully argues that establishing the need for synthesis by means of *a priori* concepts would require ruling out the alternative explanation that empirical information and concepts derived from it is sufficient to account for the recognition of the unity at issue (Guyer 1987:146–47)[^guyer-1987]. And in his view it remains open, given what Kant has shown, that this recognition requires only awareness of information derived from inner sense or introspective experience. Kant does not attempt at this point in the argument to rule out such a rival empiricist hypothesis, but he arguably would need to do so to establish the need for *a priori* synthesis. To advance his claims, one might appeal to features of this unity that would render such an empiricist account inadequate. As we shall see, Kant employs this tactic in the next phase of the argument, which introduces his account of our representations of objects.
    step1: |-
      前提 (1) 意在成为一个主张：关于先天概念之合法适用性的怀疑论者至少起初会接受它。(3) 与 (7) 所表达的关键必要条件，是“唯一可能的解释”意义上的必要条件。然而，保罗·盖耶（Paul Guyer）有力地论证说：要确立借先天概念进行综合之必要，就必须排除另一种解释，即经验信息及由之派生的概念足以说明对所论统一性的识别（Guyer 1987:146–47）[^guyer-1987]。在他看来，就康德已经表明的东西而言，仍有可能：这种识别只需要对来自内感官或内省经验的信息有所觉察。康德在论证的这一节点并未试图排除这种竞争性的经验论假说，但要说确立先天综合之必要，他大概需要这样做。为推进其主张，人们可以诉诸这一统一性的某些特征，使这种经验论说明显得不充分。我们将看到，康德在论证的下一阶段——引入其关于对象表象的说明之处——正采用了这一策略。
