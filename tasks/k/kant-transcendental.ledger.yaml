      For Kant, a defining feature of our representations of objects is their objective validity. For a representation to be objectively valid it must be a representation of an objective feature of reality, that is, a feature whose existence and nature is independent of how it is perceived (Guyer 1987:11–24)[^guyer-1987]. In this argument, it appears that Kant just assumes that the representations that make up experience are objectively valid. He then aims to establish that association is inadequate because it can yield only representations that are not objectively valid. In the above passage, Kant contends that our objectively valid representations must in a sense be necessary and universal. However, the empirical unity of consciousness, which involves an ordering of representations achieved by association, can only be non-universal, contingent, and hence merely subjectively valid, by contrast with the transcendental unity of apperception, which involves an ordering that is universal and necessary, and is therefore objectively valid. In Kant’s conception, it is the fact that the transcendental unity of apperception is generated by *a priori* synthesis that allows it to yield an ordering that is universal, necessary, and objectively valid. (Ameriks 1978, Pereboom 1995, Patricia Kitcher 2011: 115–60; Allais 2011, 2015, 2022; Vinci 2014)[^allais-2011][^ameriks-1978][^kitcher-2011][^pereboom-1995][^vinci-2014]. On Lucy Allais’s proposal, empirically we are acquainted with objects, but absent a priori synthesis, empirical representations would be of objects that are indeterminate with respect to multiple possible ways of conceptualizing and individuating them. Only with a priori synthesis is the representation of determinate objects possible. The concept of cause has a key role here, since determinacy is paradigmatically a function of represented causal unity of objects (Allais 2015: 275–85; cf. Beck 1978; Vinci 2014: 134–44)[^allais-2015][^beck-1978][^beck-1978-2][^vinci-2014]. This determinacy, by virtue of a shared scheme of a priori concepts, yields the universality and necessity Kant has in mind.
    step1: |-
      在康德看来，我们对象表象的一个定义性特征就是其客观有效性。一个表象要具有客观有效性，它就必须是对实在之客观特征的表象，即这样一个特征：其存在与本性不依赖于它如何被知觉（Guyer 1987:11–24）[^guyer-1987]。在这一论证中，康德似乎径行假定：构成经验的那些表象是客观有效的。他进而意在确立：联想并不充分，因为它只能产生不具客观有效性的表象。在上引段落中，康德主张，我们客观有效的表象在某种意义上必须是必然的与普遍的。然而，意识的经验统一性涉及由联想达成的表象排序，只能是非普遍的、偶然的，因而是纯主观有效的；与之相对，统觉的先验统一性所涉及的排序是普遍而必然的，因而是客观有效的。在康德的构想中，正是统觉的先验统一性由先天综合所产生这一事实，使它能够给出普遍、必然而客观有效的排序（Ameriks 1978, Pereboom 1995, Patricia Kitcher 2011: 115–60; Allais 2011, 2015, 2022; Vinci 2014）[^allais-2011][^ameriks-1978][^kitcher-2011][^pereboom-1995][^vinci-2014]。按 Lucy Allais 的提议，我们在经验中与对象有亲知，但若无先天综合，经验性表象所对的对象在“以何种方式概念化并个体化”上会是未定的，存在多种可能；唯有借助先天综合，确定对象的表象才可能。原因概念在此起关键作用，因为确定性典型地是对象之被表象的因果统一性的函数（Allais 2015: 275–85; cf. Beck 1978; Vinci 2014: 134–44）[^allais-2015][^beck-1978][^beck-1978-2][^vinci-2014]。借由一套共享的先天概念图式，这种确定性便产生出康德所想的普遍性与必然性。
    step2: |-
      对康德而言，我们关于对象的表象有一个定义性特征：客观有效性。一个表象若具客观有效性，它便须是关于实在之客观特征的表象——该特征的存在与本性不因它如何被知觉而变（Guyer 1987:11–24）[^guyer-1987]。在此论证中，康德似乎径直假定：构成经验的诸表象皆具客观有效性。随后他要确立的是：联想不中用，因为它所产出的表象只能是不具客观有效性的。在上引段落里，康德主张：我们客观有效的表象，在某种意义上必是必然的、普遍的。可是，经验性的意识统一性靠联想给表象排序，只能非普遍、偶然，因而仅具主观有效性；统觉的先验统一性则给表象以普遍而必然的排序，故具客观有效性。在康德看来，统觉的先验统一性由先天综合所生成，正是这一点使它能够给出普遍、必然、客观有效的排序（Ameriks 1978, Pereboom 1995, Patricia Kitcher 2011: 115–60; Allais 2011, 2015, 2022; Vinci 2014）[^allais-2011][^ameriks-1978][^kitcher-2011][^pereboom-1995][^vinci-2014]。按 Lucy Allais 的提议：经验上我们与对象有亲知；但若无先天综合，经验性表象所对的对象，在“以哪些方式概念化、个体化”上便有多种可能而未确定；唯当有先天综合，确定对象的表象方才可能。原因概念于此至关重要，因为确定性典型地就是对象之被表象的因果统一性所成就的函数（Allais 2015: 275–85; cf. Beck 1978; Vinci 2014: 134–44）[^allais-2015][^beck-1978][^beck-1978-2][^vinci-2014]。靠着一套共享的先天概念图式，此种确定性便带来康德所意指的普遍性与必然性。
