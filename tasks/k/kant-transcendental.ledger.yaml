      批评者实际上对这一论证的若干步骤提出了异议，例如：对善意与尊重的期待要求对反应性态度的易感性；有理由的善意与尊重之期待预设参与者是反应性态度的适格接受者。也许人际关系并不要求对道德怨恨与义愤的易感性，而只要求对道德抗议、失望与悲伤这些非反应性态度的易感性（Pereboom 2021）[^pereboom-2021]。另一条批评路径是把道德责任与“作为反应性态度的适格对象”分开。也许良好关系所需的只是一种前瞻性的、即 Strawson 所谓“乐观的”责任概念，而它并不以“作为反应性态度的适格对象”为特征。但这些批评都有争议，而 Strawson 的论证广被接受、备受称许。
    step2: |-
      批评者实际上已就论证的若干步骤发难，例如“对善意与尊重的期待要求易感于反应性态度”“对善意与尊重之正当期待预设参与者乃反应性态度之适格接受者”。也许人际关系并不要求易感于道德怨恨与义愤，而只要求易感于道德抗议、失望与悲伤这类非反应性态度（Pereboom 2021）[^pereboom-2021]。另一路批评则要把道德责任与“作为反应性态度之适格对象”剥离开来。良好关系所需的或许只是一种前瞻性的、即 Strawson 所称“乐观式”的责任概念；它并不以“作为反应性态度之适格对象”为标志。这些批评虽皆有争议，但 Strawson 的论证仍广受接受与赞誉。
