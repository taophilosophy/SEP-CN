      On one interpretation, the sense in which a representation would be impossible or nothing to me if it could not be accompanied by the ‘I think’ is simply that I could not then become conscious of it (Guyer 1987: 139–44)[^guyer-1987]. It is credible that for any representation of which I am conscious, I can attribute it to myself as subject, assuming my mental faculties are in working order, and if no controversial account of the nature of the subject is presupposed. However, the claim that I can become conscious of *each* of my representations, and that it is therefore possible for me attribute each of them to myself as their subject, is likely false. Plausibly, some of my representations are so thoroughly subconscious that I cannot attribute them to myself, while they are nevertheless mine due to the causal relations they bear to other representations and to actions that are paradigmatically mine. Fortunately, however, the premise that each of my representations is such that I can attribute it to myself is not crucial for the argument from above. Rather, the premise Kant ultimately singles out is less committed, and focuses more specifically on the identity or sameness of the subject of different self-attributions, and my being conscious of this identity.
    step1: |-
      按一种解读，一个表象若不能被“我思”所伴随便“不可能”或“对我等于无”，其意思不过是：我那时无法意识到它（Guyer 1987: 139–44）[^guyer-1987]。可信的是：对于我所意识到的任何表象，只要心理能力运转正常、且不预设任何有争议的主体本性学说，我就能把它归赋给自己、作为主体。然而，“我能意识到我的每一表象、因而能把每一表象归赋给自己作为其主体”这一主张，很可能是假的。说得通的是：我的某些表象深深处于潜意识，以致我无法把它们归赋给自己，而它们凭其与其他表象及那些典型地属于我的行动之间的因果关系，仍是我的表象。不过幸运的是，“我的每一表象都使我能把它归赋给自己”这一前提对自上而下的论证并不关键。康德最终挑出的前提承诺更少，它更具体地聚焦于不同自我归赋之主体的同一性或同一，以及我对这一同一的意识。
    step2: |-
      按一种解读，一个表象若不能被“我思”所伴随，便“不可能”或“对我等于无”，其意思不过是：我届时无法意识到它（Guyer 1987: 139–44）[^guyer-1987]。可信的是：对于我所意识到的任何表象，只要心理能力运转正常、且不预设任何有争议的主体本性学说，我就能把它归赋给自己、作为主体。然而，“我能意识到自己的每一表象、因而能把每一表象归赋给自己作为其主体”这一主张，很可能是假的。说得通的是：我的某些表象深深处于潜意识，以致我无法把它们归赋给自己；而它们仍是我的表象，凭的是它们与其他表象、以及与那些典型属于我的行动之间的因果联系。不过幸运的是，“我的每一表象都使我能把它归赋给自己”这一前提对自上而下的论证并不关键。康德最终挑出的前提承诺更少，它更具体地聚焦于不同自我归赋之主体的同一性，以及我对这一同一的意识。
