      > (*The principle of the necessary unity of apperception*) It must be the case that each of my representations is such that I can attribute it to my self, a subject which is the same, i.e., numerically identical, for all of my self-attributions, which is distinct from its representations, and which can be conscious of its representations (A116, B131–32, B134–35).
