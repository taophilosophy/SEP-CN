      Béatrice Longuenesse (1998), in her interpretation of the Metaphysical Deduction, takes up this challenge. In her view, the faculty at issue in the production and use of concepts, the understanding, is the power to judge (*Vermögen zu Urteilen*), which is ultimately a disposition or a *conatus* to make judgments and to shape how we are affected so that we can make them (Longuenesse 1998: 208, 394)[^longuenesse-1998]. The logical forms of judgment are in essence the forms of combination of concepts in judgments. One such form is the categorical, which is the form of subject-predicate judgments; another is the hypothetical, the form of conditional judgments. Kant contends that the logical form of a judgment is what makes it capable of truth or falsity, for by means of such a form a judgment can constitute a relation of a subject’s representations to an objective feature of reality (Longuenesse 2000, 93–4)[^longuenesse-2000]. For instance, by its categorical form, the judgment ‘the boat is moving’ can constitute the relation of my representations of a boat and of motion to an objectively existing boat in motion, and as a result this judgment can be true or false.
    step1: |-
      Béatrice Longuenesse（1998）在其对形而上学演绎的解读中接下了这一挑战。在她看来，概念的生成与使用所涉及的能力即知性，乃是判断的能力（*Vermögen zu Urteilen*），它最终是一种作出判断、并塑造我们被影响之方式以便作出判断的倾向或*conatus*（努力）（Longuenesse 1998: 208, 394）[^longuenesse-1998]。判断的逻辑形式本质上就是概念在判断中的结合形式。其中一种是直言式，即主谓判断的形式；另一种是假言式，即条件判断的形式。康德主张，判断的逻辑形式使判断能够为真或为假，因为凭借这种形式，判断才能构成主体诸表象与实在之某个客观特征的关系（Longuenesse 2000, 93–4）[^longuenesse-2000]。例如，凭借其直言形式，判断“船在移动”能够构成我对一条船与运动的表象同一条客观存在着的运动之船的关系，因而这一判断能够为真或为假。
    step2: |-
      Béatrice Longuenesse（1998）在解读形而上学演绎时，正面应对了这一诘难。她主张：概念的生成与运用所涉的能力即知性，乃是判断的能力（*Vermögen zu Urteilen*），归根到底是一种作判断的倾向或*conatus*（努力），它同时塑造我们受影响的方式，使我们得以作出判断（Longuenesse 1998: 208, 394）[^longuenesse-1998]。判断的逻辑形式，实质上是概念在判断中结合的形式。其一为直言式，即主谓判断之形式；其二是假言式，为条件判断之形式。康德主张：判断的逻辑形式使判断得以真或假，因为借由此种形式，判断才能构成主体诸表象与实在某一客观特征之间的关联（Longuenesse 2000, 93–4）[^longuenesse-2000]。举例来说，靠其直言形式，判断“船在移动”得以构成我关于船与运动的表象同一条客观存在且正在运动的船之间的关联；因此这一判断可为真，亦可为假。
