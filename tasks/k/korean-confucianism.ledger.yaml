      The refining nature of moral education was a central pillar of Korean Confucianism, vigorously asserted by scholars and institutionalized at every level of society—even the king underwent formal Confucian training, receiving lectures on orthodox morality (see Sohn 2000: ch. 1)[^sohn-2000]. Korean Confucians embraced the Mencian view of education as a process of cultivating innate goodness, grounded in the belief that “human nature” (性, C. *xing*, K. *sŏng*) is inherently good. Education, therefore, was not merely instructional but transformative—a vehicle for refining one’s moral disposition and aligning it with universal Principle (理, *i*). In this sense, Mencius’ ideas provided the metaphysical foundation for Chosŏn’s intellectual life, stimulating profound philosophical recalibrations and sparking debates that would define Korean Neo-Confucian thought for centuries.
    step1: |-
      道德教育的化育性质是朝鲜儒学的核心支柱，学者们大力主张，并在社会的每一层级加以制度化——连君主也要接受正式的儒家训练，听讲正统道德（见 Sohn 2000: 第 1 章）[^sohn-2000]。朝鲜儒者接受孟子的教育观，即教育是培养固有善性的过程，其根据是“性”（汉 *xing*，韩 *sŏng*）本善的信念。因此教育不只是传授，而是转化性的——是砥砺人的道德禀性、使之与普遍的理（汉 *li*，韩 *i*）相合的载体。在此意义上，孟子的观念为朝鲜王朝的思想生活提供了形而上学基础，激发了深刻的哲学重校，并引发了此后数百年界定朝鲜性理学的论辩。
