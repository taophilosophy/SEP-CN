      An Hyang (1243–1306) occupies a foundational place in Korean intellectual history, introducing Neo-Confucianism as not merely a scholarly system but as a cosmological and moral vision. His act of hand-copying the Confucian Classics and bringing Zhu Xi’s image to Korea (Deuchler 1992: 17)[^deuchler-1992] symbolized the transmission of an entire worldview—one that sought to align human society with the universal *Principle* (理, *i*) governing the cosmos. Paek I-jŏng (1247–1323) and other scholars deepened this philosophical exchange through encounters with Chinese Neo-Confucians, including direct heirs of the Cheng-Zhu tradition, at the Man’gwŏndang library—the “Hall of Ten Thousand Scrolls”—established by King Ch’ungsŏn (1308–1313) in the Yuan capital (Deuchler 1992: 19)[^deuchler-1992]. Yi Che-hyŏn (1287–1367) advanced this vision by endorsing the printing of *The Four Books* and asserting that rulership must embody sagely virtue, thereby fusing governance with moral cosmology. His son, Yi Saek (1328–1396), further disseminated these texts as Neo-Confucian prestige soared, serving as educational intendant for the Yuan in Korea (De Bary & Haboush 1985b: 41). In this synthesis, Neo-Confucianism became the axis of education and statecraft, prescribing an ethical order that regulated not only political authority but also family hierarchy and gender roles—embedding cosmic harmony into the fabric of social life.
    step1: |-
      安珦（1243–1306）在朝鲜思想史上居于奠基性地位：他所引入的性理学，不只是一套学术体系，而是一种宇宙论与道德的愿景。他手抄儒家经典、并把朱熹画像带到朝鲜（Deuchler 1992: 17）[^deuchler-1992]，这一举动象征着一整套世界观的传布——该世界观力图使人类社会与统摄宇宙的普遍理（理，*i*）相合。白颐正（1247–1323）与其他学者在“万卷堂”通过与汉地性理学者——包括程朱传统的直接传人——的往还，深化了这一哲学交流；万卷堂由忠宣王（1308–1313）建于元大都（Deuchler 1992: 19）[^deuchler-1992]。李齐贤（1287–1367）推进了这一愿景：他赞成刊印《四书》，并主张统治必须体现圣德，从而把治术与道德宇宙论熔为一体。其子李穑（1328–1396）在性理学声望日隆之际进一步传播这些典籍，并出任元朝在朝鲜的教育提举（De Bary & Haboush 1985b: 41）。在这一综合中，性理学成为教育与治国的轴心，规定了一套不仅规制政治权威、也规制家庭等级与性别角色的伦理秩序，把宇宙和谐嵌入社会生活的肌理。
