      这使他得以坚持人性本善的主张：因为理是善的，不善者则归因于气（见 Choi M.-H. 1980: 37–38；译文略有调整）[^choi-1980]。此外，他还是朝鲜第一位把理与气同人心联系起来讨论的性理学者，并把人心与“四端”和“七情”关联起来：“四端”见于孟子（2A:6；见 SB-Chan: 65）：恻隐之情、羞恶之情、辞让之情、是非之情［情，汉 *qing*，韩 *chŏng*］，这些情加以扩充便通向儒家的基本德目（仁、义、礼、智）。仁（汉 *ren*，有时作 *jen*，韩 *in*）被视为儒家最高的德，常译作“benevolence”或“kind-heartedness”（仁慈）。《礼记》第九章提到“七情”：喜、怒、哀、惧、爱、恶、欲。权近把四端（始终是善的）系于理，把七情（可能为恶）系于气，由此开启了一场名副其实的元心理学连锁反应，至今未息。这些观念凝结在其《天人心性合一之图》（韩 *Ch’ŏnin simsŏng habil-to*）中；在权近看来，“天”指理在万物（包括人心）中的运作，因此（男）人之心与宇宙的道德理相联，而由圣人体现（见 Halla Kim 2017: 1–23）[^kim-2017][^kim-2017-2][^kim-2017-3][^kim-2017-4]。
