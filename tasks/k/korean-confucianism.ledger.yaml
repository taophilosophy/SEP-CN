      Confucian philosophy was strategically deployed to delegitimize Buddhism during the formative years of the Chosŏn dynasty. This was not merely a political maneuver but an intellectual campaign grounded in metaphysical critique. Neo-Confucian scholars argued that Buddhism’s emphasis on transcendence and monastic withdrawal disrupted the moral fabric of society and violated the cosmological principle of harmonizing human life with the natural and social order. By contrast, Confucianism presented itself as a philosophy of immanence—anchoring virtue in familial obligations, ritual propriety, and hierarchical relationships that mirrored the structure of the cosmos. Buddhism was condemned as socially corrosive, economically parasitic, and metaphysically misguided, accused of neglecting the ethical responsibilities that sustain both governance and lineage. Through this discourse, Confucian thinkers reframed the Buddhist pursuit of enlightenment as an abandonment of worldly duties, positioning Neo-Confucianism as the sole legitimate path to moral cultivation and cosmic harmony. This ideological shift was reinforced through law, education, and ritual, ensuring that Confucian norms permeated every level of society (Sancho 2025a: 106-114)[^sancho-2025a].
    step1: |-
      在朝鲜王朝的成形年代，儒家哲学被战略性地用来剥夺佛教的正当性。这不仅是政治手腕，更是以形而上学批评为根基的思想运动。性理学者论证：佛教强调超越与出家隐修，破坏了社会的道德肌理，违反了使人生与自然及社会秩序相协调的宇宙论原则。与之相对，儒学把自己呈现为一种内在性的哲学——把德性锚定于家庭义务、礼仪规范与映现宇宙结构的等级关系之中。佛教被斥为社会上有腐蚀性、经济上有寄生性、形而上学上迷误，被指忽略维系治术与世系的伦理责任。通过这套话语，儒家思想家把佛教对觉悟的追求重新框定为对世间职责的背弃，并把性理学定位为道德修养与宇宙和谐的唯一正途。这一意识形态转向又经由法律、教育与礼仪加以强化，确保儒家规范渗透社会的每一层级（Sancho 2025a: 106-114）[^sancho-2025a]。
