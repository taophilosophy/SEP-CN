      The time frame of the Horak debate also coincided with Catholic texts being read by Korean Neo-Confucian philosophers. The most important text from this period was *Tianzhu shiyi* (天主實義; K. *Chŏnju sirŭi*) [The True Meaning of the Lord of Heaven], which had a great impact in Korea after being read by scholars there (see Ricci 1985)[^ricci-1985]. It was actually written by Matteo Ricci (1552–1610), an Italian Jesuit missionary who had lived for many years (and died) in China. Ricci weaved in the mediaeval Scholastic philosophy of his European tradition into a newly enlarged tapestry including his newly discovered Confucian ideas. He retraced the trajectory of Neo-Confucianism, revealing its Buddhist and Daoist legacy that has been carefully coloured over by Zhu Xi, whose ideas also dictated how Koreans received the Confucian canon, something that clearly irked the Korean scholars. These ideas and messages had serious repercussions in Korea, where, as Seoh Munsang (1977: 46–47) points out, the intellectual milieu had retained Zhu Xi’s orthodoxy where metaphysical speculation was “still a vital force polarising the *i* and *ki* schools”.
    step1: |-
      湖洛之辩的时段，恰与朝鲜性理学者阅读天主教文本相重合。这一时期最重要的文本是《天主实义》（韩 *Chŏnju sirŭi*）［《天主的真义》］，朝鲜学者阅读后反响巨大（见 Ricci 1985）[^ricci-1985]。该书实为利玛窦（1552–1610）所撰——他是一位意大利耶稣会传教士，在华居住多年并终老于斯。利玛窦把其欧洲传统的中世纪经院哲学编织进一幅新而扩展的织锦，其中还包括他新发现的儒家观念。他重溯性理学的轨迹，揭示其被朱熹细心涂饰过的佛教与道教遗产；朱熹的学说也规定了朝鲜人接受儒家经典的方式，这显然令朝鲜学者不快。这些观念与讯息在朝鲜产生了严重回响；如 Seoh Munsang（1977: 46–47）所指出的，那里的思想氛围仍保有朱熹的正统，形而上学思辨“仍是使理学派与气学派两极分化的活的动力”。
