      Tasan’s theological reconfiguration bears directly on how he understands human moral agency. Although one might expect a theistic framework to introduce a notion of “freedom of the will,” Tasan does not explicitly employ such terminology. Instead, he speaks of *chaju chikkwŏn* (自主職權, the power of autonomy) and *kwŏnhyŏng* (權衡, balance), concepts that frame human agency not in terms of abstract volition but in terms of the mind’s capacity for self‑regulation and moral equilibrium. Most importantly, his account of the mind’s self‑determinative power—often expressed through *yŏngmyŏng* (英明, intelligence or luminous awareness)—rests on his distinctive understanding of human nature as preference or inclination (*sŏnggi hosŏl*, 性嗜好說). In contrast to Neo‑Confucian models grounded in an ontological principle (*i*), Tasan roots moral agency in the dynamic, affectively‑charged tendencies of human nature itself. Thus, the same shift that elevates an anthropomorphic *Sangje* also reshapes his theory of moral psychology, producing a framework that is theistic in cosmology yet distinctively non‑volitional in its account of human autonomy (for a detailed examination see, Kam 2025; Kalton 1981)[^kalton-1981].
    step1: |-
      茶山的神学重构直接关涉他如何理解人的道德能动性。人们或会期待有神论框架引入“意志自由”的观念，但茶山并未明确使用这类术语。他谈的是自主职权（*chaju chikkwŏn*）与权衡（*kwŏnhyŏng*）——这两个概念不把人的能动性框定为抽象的意志，而是框定为心的自我调节与道德平衡的能力。最重要的是，他关于心的自我决定力的说明——常以英明（*yŏngmyŏng*，明觉或灵明的觉知）表达——奠基于其对人性的独特理解：性即嗜好（*sŏnggi hosŏl*，性嗜好说）。与奠基于本体论原则（*i*）的性理学模型相对，茶山把道德能动性植根于人性自身动态的、带有情感倾向的趋向之中。于是，抬高人格化上帝的同一次转向，也重塑了他的道德心理学说，产生了一个在宇宙论上有神论、而在人的自主性说明上却明显非意志论的框架（详细考察见 Kam 2025；Kalton 1981）[^kalton-1981]。
