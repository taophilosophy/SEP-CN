      Park Chong-hong (2004: 396) critiques the trend of the (later-called) *Sirhak* [Practical] scholars, who “made the mistake of arranging encyclopedic knowledge” and other “trivial matters”, clearly unable to fathom what was coming, and unable to provide Chosŏn with the tools it needed to survive the “modernisation” that would soon be thrust upon the peninsula, leading to Japan’s eventual colonial rule over the peninsula (1910–1945). As the situation on the peninsula disintegrated, Koreans sought alternatives to Confucianism to deal with social issues and inequality. The first of these New Religious Movements (NRMs) was known as *Tonghak* (東學), or Eastern Learning, to contrast directly with the foreign “Western Learning”, and it attempted to help hopeless poor peasants whose lives were getting progressively worse, especially in the southern regions far from the capital. Tonghak was founded by Ch’oe Che-u (1824–1864), known by his followers as Su-un, and while providing an alternative to Confucianism, it used the name of the “Sovereign on High” (*Sangje*) from the Confucian Classics to refer to its deity, while also using the Catholic term “Lord of Heaven” (*Ch’ŏnju*) as well. There were splinter groups formed out of this NRM such as Chŭngsando (more commonly written Jeungsando), and Daesoon Jinrihoe, both worshipping different iterations of *Sangje*—a monotheistic Korean deity with Confucian origins (see Cawley 2019: ch. 5)[^cawley-2019].
