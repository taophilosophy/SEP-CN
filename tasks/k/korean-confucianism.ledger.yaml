      At the same time, another intellectual current emerged that championed *ki*, exemplified by Ch’oe Han-ki (1803–1879), who sought to liberate thought from entrenched prejudices. Recent scholarship has significantly re-evaluated Ch’oe’s work. For instance, Chang (2025) analyzes his hermeneutical philosophy and reinterpretation of the Confucian Classics, highlighting how Ch’oe reframed canonical texts through a processual lens, emphasizing dynamic interaction rather than static metaphysical categories. This approach reflects his broader attempt to reconcile Confucian thought with emerging scientific and socio-political realities. Other scholars underscore his empiricist orientation and methodologically sophisticated engagement with experience—an approach reminiscent of John Locke (1632–1704), though adapted to challenge the notion of an innately good mind prior to learning through accumulated experience (Park 2004)[^park-2004]. Deeply conversant with European science, Ch’oe articulated an ontology grounded in a “One-Dimensional ki theory,” positing ki as the formative principle shaping all things, even preceding form itself, while simultaneously rejecting the Zhu Xi school’s conception of innate reasoning power (Choi M.-H. 1980: 205)[^choi-1980]. His thought was also attuned to the shifting realities of his time—critical of the rigid class hierarchy and the inhumane treatment of the populace—concerns that also echoed themes raised earlier by Tasan.
    step1: TBD
    step2: TBD
