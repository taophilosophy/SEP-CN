      Neo-Confucianism can be traced to the writings of “The Five Sages of Song”: Shao Yong (1011–1077), Zhou Dunyi (1017–1073), Zhang Zai (1020–1077), and two brothers, Cheng Hao (1032–1085) and Cheng Yi (1033–1107). However, their main ideas were recognised and appreciated only later when their various contributions were synthesised by the impressive scholar Zhu Xi, particularly the ideas of the Cheng brothers (Fairbank & Goldman 1999: 98)[^fairbank-1999]. Ames and Rosemont (1998: 17) highlight how “Zhu Xi’s commentaries […] became the definitive of the [Neo-Confucian] tradition from the early fourteenth century through the twentieth centuries”, and this influence also extended to Korea, becoming deeply rooted there. Zhu’s compendium on Neo-Confucian thought, *Jinsilu* (近思錄) [Reflections on Things at Hand], written with Lu Zu-qian (1137–1181), became the handbook on this great philosophical synthesis, and was integral to the Korean development of those ideas. Zhu focused on self-cultivation, a necessary ingredient in Confucian sagehood that became central to Korean’s interpretation of those ideas (Chan 1987: 122–124; Tillman 1992: 114–118)[^chan-1987][^tillman-1992].
    step1: |-
      性理学可追溯至“宋代五子”的著作：邵雍（1011–1077）、周敦颐（1017–1073）、张载（1020–1077），以及程颢（1032–1085）与程颐（1033–1107）兄弟。然而他们的主要观念要到后来才得到认识与赏识：由学识宏富的朱熹把诸家贡献加以综合，尤其是二程的思想（Fairbank & Goldman 1999: 98）[^fairbank-1999]。安乐哲与罗思文（Ames and Rosemont，1998: 17）强调，“朱熹的注释［……］自十四世纪初至二十世纪一直成为［性理学］传统的权威界定”，这一影响也远及朝鲜，并在那里深深扎根。朱熹与吕祖谦（1137–1181）合撰的性理学思想纂集《近思录》成为这一伟大哲学综合的手册，也是朝鲜发展这些观念时不可或缺的读本。朱熹注重修养工夫，这是儒家成圣的必要成分，后来成为朝鲜人对这些观念之解释的核心（Chan 1987: 122–124；Tillman 1992: 114–118）[^chan-1987][^tillman-1992]。
