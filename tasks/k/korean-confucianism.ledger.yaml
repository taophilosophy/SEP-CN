      Tasan, like many others, renounced the religion after witnessing close relations and friends brutally executed, and as a result his authorial control had been clearly compromised through the fear of his own execution, as well as the fact that his wife and children could have been sold as slaves (Cawley 2014b)[^cawley-2014b]. Some scholars, such as Kim Shin-ja (2006 [2010: 92–102]), comment on the philosophical inclinations in Tasan’s writings, and consider him as having returned to the “original theory of Confucius”, known as *Susahak* (洙泗學). However, Tasan’s commentaries are full of references to “The Sovereign on High”, *Sangje* (which is the Korean pronunciation of *Shangdi* from the Chinese characters 上帝), despite the fact that the *Analects* never mention this term, not even a single time. It appears only five times in the entire *Four Books*! This term was used in the *Five Classics*, as highlighted by Matteo Ricci, and was of great importance to the early Catholics in Korea, who, having read Ricci’s text, considered *Sangje* to be God. Why might this be important? Seen in this light, Tasan’s interest in “original” Confucianism (*Susahak*), may have been merely a ploy to detract from his religious affiliation with Catholicism. The *Sangje* one encounters in Tasan’s writings is a personal, monotheistic, creator deity, and *not* an impersonal *Principle.* Indeed, Tasan’s “dis-assembling” of Neo-Confucianism, extracting the Cheng-Zhu influenced metaphysical discourse, and reorienting it towards *Sangje*, resembles the strategy of Matteo Ricci, though supplemented with a sense of active social morality (see Cawley 2014a)[^cawley-2014a]. Keum (1980 [2000: 189]) insists that
    step1: |-
