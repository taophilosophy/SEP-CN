      Chŏng, while investigating the phenomenological issues concerning human nature and their ethical implications, was completely unwilling to acknowledge any conceptual dependence on Buddhist doctrines, while reinforcing the staunch position of Neo-Confucians in Korea to link philosophical principles to one’s social reality (see Muller 2015: introduction)[^muller-2015]. For Confucians, Buddhists had cut themselves off from both social and filial obligations. His ideas, therefore, “provide grounded guidelines for individuals as social beings who faced daily challenges” and this is exemplified by the recent translation of his writings as *Seeking Order in a Tumultuous Age* (Robinson (trans.) 2016: here 5). These writings reflect the need to help the people, as well as the need to rectify the mind of the ruler, but also the obligation to rectify oneself before trying to rectify others (Robinson (trans.) 2016: 128–129). They also recount the practical reasons behind his philosophical attack of Buddhism:
