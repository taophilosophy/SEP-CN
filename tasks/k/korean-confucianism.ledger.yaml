      leading to a creative synthesis. This development may also be described as “post-Confucian,” not only because it moves beyond the classical metaphysical frameworks of Ihak 理學, the School of Principle) and Sŏngnihak 性理學, the School of Nature and Principle), but also because it departs from classical Confucianism in the centrality it assigns to Sangje within its overall schema of reality. In this reinterpretation, Sangje functions less as an impersonal moral order and more as a deity who actively governs and directs creation. One might even characterize the system as a subtle form of “Christo‑Confucianology,” insofar as Christian motifs quietly inform its moral discourse—now oriented around an anthropomorphic understanding of Sangje (discussed in detail in Cawley 2014b)[^cawley-2014b]. Indeed, Gim (2020) argues that the ontological framework of Tasan’s entire thought is deeply informed by Catholic concepts.
