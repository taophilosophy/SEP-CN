      These revitalized Confucian ethics reconfigured the moral and cosmological foundations of the emerging Chosŏn dynasty (1392–1910). At the center of this transformation stood Chŏng Tojŏn (1342–1398), whose philosophical vision legitimated the new kingship by rooting political authority in an ethical order mirroring the structure of the cosmos. His project sought to reconstruct society through the disciplined enactment of propriety (*ye*), expressed in ritual practice, thereby harmonizing governance with universal Principle (理, *i*) and material force (氣, *ki*) (Deuchler 2004: 46)[^deuchler-2004]. This cosmological ethic penetrated the intimate sphere of family and gender. As Lee Sang-wha (2005) notes, Neo-Confucian metaphysics inscribed patriarchal norms through the polarity of Yin (Ŭm in Korean), associated with weakness and passivity, and Yang, linked to strength and activity—mapping cosmic dualities onto social roles: women as passive, men as active. The four cardinal rites—coming of age (capping), wedding, mourning, and ancestral rites—functioned as instruments for embedding these gendered hierarchies into everyday life. The capping ceremony marked a boy’s transition into adulthood, symbolizing his active role in governance and lineage continuity, while wedding rites reinforced male authority as household head and positioned women within a framework of obedience and domesticity. Mourning and ancestral rites further codified these roles: men led ritual obligations as moral exemplars, while women’s participation was circumscribed, emphasizing their supportive and subordinate position. Through manuals such as *Zhuzi jiali* (朱子家禮) [Zhu Xi’s *Family Rites*], these practices linked personal self-cultivation and mental discipline to the cosmic order, ensuring that gendered social roles were not arbitrary but reflections of a metaphysical hierarchy, also drawing on the *Liji*, *The Record of Rites* (Deuchler 1992: 108–111, for a study onthe influence of the *Liji* in Chosŏn, see Gehlmann 2023)[^deuchler-1992][^gehlmann-2023]. In Korea, these rites were not merely moral prescriptions—they became legal mandates, codified in the national “Grand Code for State Administration” (*Kyŏngguk taejŏn*, 經國大典), first promulgated in the late fifteenth century. Failure to observe the prescribed rituals could result in severe penalties, including corporal punishment, imprisonment, and even execution—as tragically occurred with thousands of Catholics in the nineteenth century. By embedding ritual obligations into law, the state asserted a Neo-Confucian cosmological order as the foundation of governance and social life. This legal framework did more than regulate behavior; it institutionalized a hierarchical moral system that suppressed competing traditions, most notably Buddhism, and rendered any challenge to its authority a threat to both political stability and cosmic harmony.
    step1: |-
      这些重振的儒家伦理重新配置了新兴朝鲜王朝（1392–1910）的道德与宇宙论基础。这场变革的中心是郑道传（1342–1398）：他的哲学构想把政治权威奠基在一种映现宇宙结构的伦理秩序之上，从而为新王权提供了正当性。其方案力图通过对礼（*ye*）的有纪律的践行——体现于礼仪实践——来重构社会，从而使治术与普遍的理（理，*i*）和气（气，*ki*）相协调（Deuchler 2004: 46）[^deuchler-2004]。这种宇宙论的伦理渗透到家庭与性别的私密领域。如Lee Sang-wha（2005）所指出的，性理学的形而上学以阴（韩 Ŭm）——关联于柔弱与被动——与阳——关联于强健与活动——的两极性来铭刻父权规范，把宇宙的二元性映射到社会角色上：女性被动，男性主动。四大礼——冠礼（加冠）、婚礼、丧礼与祭礼——成为把这些性别化等级嵌入日常生活的工具。加冠礼标志男孩成年，象征他在治术与世系延续中的能动角色；婚礼则强化男性作为家长的权威，并把女性安置在顺从与持家的框架之内。丧礼与祭礼进一步把这些角色法典化：男性作为道德表率主持礼仪义务，女性的参与则受到限制，凸显其辅助与从属的位置。通过《朱子家礼》（汉 *Zhuzi jiali*）这类礼书，这些实践把个人的修养与心性工夫同宇宙秩序联系起来，确保性别化的社会角色并非任意，而是形而上学等级的映现；这些实践也取资于《礼记》（Deuchler 1992: 108–111；关于《礼记》在朝鲜的影响，见 Gehlmann 2023）[^deuchler-1992][^gehlmann-2023]。在朝鲜，这些礼不只是道德规诫——它们成为法律强制，编入十五世纪末首次颁行的国家《经国大典》（*Kyŏngguk taejŏn*，經國大典）。不遵行规定的礼仪可能招致严惩，包括体罚、监禁乃至处死——十九世纪数千名天主教徒的遭遇即是惨例。国家把礼仪义务嵌入法律，也就把性理学的宇宙论秩序确立为治术与社会生活的基础。这一法律框架不只规制行为；它把一套等级性的道德体系制度化，压制竞争性的传统——最显著的是佛教——并把对该权威的任何挑战都视为对政治稳定与宇宙和谐的双重威胁。
