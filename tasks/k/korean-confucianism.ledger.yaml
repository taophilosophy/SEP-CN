      Choi Young-jin (2011: 9) describes this as “a state of moderation […] bent neither one way or another […] the state of balance”. This actual state of mind had never been analysed in such minute detail before, nor had it been considered in such detail in relation to the sage, normal humans, and other animals: were they the same, or not, at the microcosmic level of their mind in terms of *ki* or *Principle*? Han Wŏn-jin’s essay on the “Explanation of the Original Nature and the Psycho-Physical Nature”, sowed the seeds of the debate. In this essay he suggested that the original nature, even before being aroused in the mind (*mibal*, as argued by T’oegye), was already interacting with *ki*, in other words, energised by material force, or as Richard Kim (2017: 92) puts it, Han viewed “*gi* [*ki*] as constitutive of the inactivated mind”. For Han, *Principle* required *ki*, so *ki* already had to exist in the mind and this *ki* had to be originally good or in equilibrium, balanced and unmotivated by desires. Clearly Han was “adhering more strictly to the materialist core of the *ki* school”, while claiming that “nature is not an abstract [undifferentiated] entity”, and that *Principle* “is nothing but a law of the dynamics of *ki*,” in other words, *Principle* had no concrete existence of any sort (Seoh 1977: 48)[^seoh-1977]. He ultimately saw the nature of a human and other animals as different even in their unaroused or *mibal* state where *ki* was inactive, and used their different psycho-physical make-up (due to the variant manifestations of material force when activated) as the basis for his thesis. Han ultimately considered the sage to possess a pure form of *ki*, already balanced and pure even in an unaroused state, unlike other beings (which for him also included women and children) and in this sense he is more hierarchically inclined in his approach, with a more idealistic vision of the sage—something usually linked with proponents of *Principle*.
    step1: |-
      Choi Young-jin（2011: 9）把它描述为“一种节制的状态［……］不偏于一方也不偏于另一方［……］平衡的状态”。这种实际的心境此前从未被如此精细地分析过，也从未在圣人、常人与其他动物的关系中被如此细致地考虑过：就其心的微观层面而言，就气或理而言，它们是同还是异？韩元震论“本然之性与气质之性”的文章播下了这场论辩的种子。在此文中他提出：本然之性甚至在心中未发之时（如退溪所主张的 *mibal*）就已与气交互；换言之，它已由质料之力所鼓动；或者如 Richard Kim（2017: 92）所说，韩元震把“气（*gi*［*ki*］）看作未发动之心的构成要素”。对韩元震而言，理需要气，因此气已经先于理；他最终把理看作“不过是气的动态运作之法则”，换言之，理没有任何具体的存在（Seoh 1977: 48）[^seoh-1977]。他最终认为，人与其他动物之性即便在气未发动的未发（*mibal*）状态中也不相同，并以二者不同的形气构成（源于气发动时显现的差异）作为其论旨的基础。韩元震最终认为圣人拥有纯粹的气，即使在未发状态也已平衡而纯净，不同于其他存在者（在他看来这也包括女性与儿童）；在此意义上，他的进路更具等级倾向，对圣人也持更理想化的看法——这通常与理派的主张者相联系。
