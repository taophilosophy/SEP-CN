      In the Korean Confucian tradition, social position and age were not merely markers of status but integral to maintaining a hierarchical order believed to reflect cosmic harmony. Women were particularly disadvantaged under these interpretations, expected to remain perpetually subordinate to men—fathers, husbands, and even sons—roles reinforced through gendered education. This subordination was framed as part of a universal principle of order, where fulfilling one’s prescribed role was essential for achieving societal “harmony.” Harmony, in this sense, was not egalitarian but hierarchical: a well-functioning society was imagined as a moral cosmos in which each person’s duties were clearly delineated and rigorously observed (see Cawley 2025: 139-147)[^cawley-2025]. Nevertheless, the “superior” person in these hierarchical relationships was expected to embody moral integrity and social responsibility—most notably the king, whose authority carried reciprocal obligations toward the people he governed. This ideal of good or virtuous rulership is a recurring theme in the literature on *Sage Learning* (聖學, C. *shengxue*, K. *sŏnghak*), which profoundly shaped Korean Neo-Confucianism. Another relationship, possibly emphasized more in Korea than in China, was filial piety (孝, C. *xiao*, K. *hyo*). *Hyo* remains one of the defining features of Korean Confucian culture, where respect for parents and elders continues to be deeply ingrained. Within the family, the eldest male occupied the highest position of honor, underscoring the gendered hierarchy that Confucian norms institutionalized on the peninsula. This patriarchal structure—once regarded as essential for social harmony—is now the subject of intense debate in contemporary Korea, particularly in light of gender equality movements such as #MeToo, which challenge the enduring legacy of these Confucian ideals.
    step1: |-
      在朝鲜儒学传统中，社会地位与年龄不只是身份的标记，更是维持一种被认为映现宇宙和谐的等级秩序所不可缺的要素。在这种解释下，女性处境尤为不利：她们被期待永远从属于男性——父、夫乃至子——这些角色又通过按性别区分的教育加以强化。这种从属被说成普遍秩序原理的一部分：各人履行其被规定的角色，是实现社会“和谐”的必要条件。在此意义上，和谐不是平等主义的，而是等级性的：一个运作良好的社会被想象为一个道德的宇宙，其中每个人的职责都界限分明并得到严格遵行（见 Cawley 2025: 139-147）[^cawley-2025]。不过，在这些等级关系中，处于“上位”者被期待体现道德操守与社会责任——尤其是君主，其权威对他所统治的人民负有相互的义务。这种良好或德性统治的理想，是《圣学》（汉 *shengxue*，韩 *sŏnghak*）文献中反复出现的主题，它深刻塑造了朝鲜性理学。另一种关系——孝（汉 *xiao*，韩 *hyo*）——在朝鲜或许比在中国更受强调。孝至今仍是朝鲜儒家文化的界定性特征之一，对父母与长辈的敬重至今仍根深蒂固。在家庭内部，最年长的男性居于最尊荣的位置，凸显了儒家规范在半岛上加以制度化的性别等级。这一父权结构——曾被视为社会和谐所必需——如今在当代朝鲜成为激烈争论的对象，尤其在 #MeToo 等性别平等运动的映照下，这些运动挑战着这些儒家理想的持久遗产。
    step2: |-
