      In this instance, both *Principle* and material force interpenetrate each other, but this was not T’oegye’s initial interpretation, which had changed due to his “Four-Seven” debate with another scholar. The “Four-Seven” debate (which was clearly deeply related to *Principle* and material force) originated from a series of correspondences between T’oegye and Kobong, penname of Ki Taesŭng (1527–1572), and later it was continued on between Yulgok and Ugye, penname of Sŏng Hon (1536–1598). T’oegye originally suggested that the four beginnings and seven feelings had different origins, and this instigated the original debate with Kobong, who did not agree with T’oegye’s dualistic approach: that *Principle* (*i*) was the source of the four beginnings, while the material force was the source of the seven feelings. Kobong was more interested in *ki*’s moral and activating function, and considered *i* and *ki* as inseparable, especially when it came to “their presence in actual things” (Kalton 1994: 6)[^kalton-1994]. The issue at hand was how could the morally good *Principle*, manifested to its highest form in (wo)mankind, be corrupt, or led astray, in the sense that people clearly do not always conduct themselves in a kind-hearted manner towards others. Though T’oegye revised his view, he still gave primacy to *Principle* and maintained that it always initially preceded *ki* when we act morally, or rather that *Principle* guided *ki*, like a rider guiding a horse. Hence, T’oegye upheld the moralistic perfection and integrity of *Principle* by suggesting that things could be less than perfect, and human behaviour sometimes not good, as a result of the interaction with the material force, which could be affected/corrupted depending on the concrete circumstances of its actualisation in concrete form/action.
    step1: |-
      在此情形下，理与气相互渗透；但这并非退溪最初的解释，其初解因与另一位学者的“四端七情”之辩而改变。“四端七情”之辩（显然与理气问题密切相关）源于退溪与高峰——奇大升（1527–1572）的号——的一系列通信，后来又在栗谷与牛溪——成浑（1536–1598）的号——之间继续。退溪最初主张四端与七情有不同的起源，由此引发了与高峰的论辩；高峰不同意退溪的二元论进路，即理（*i*）是四端之源、气是七情之源。高峰更关注气的道德与发动功能，认为理气不可分离，尤其就“它们在实事中的在场”而言（Kalton 1994: 6）[^kalton-1994]。争执的问题在于：道德上善的理，在人身上显现为最高形态，何以会腐败或被引入歧途——毕竟人们显然并不总是以仁厚之心待人。退溪虽修正了自己的看法，仍以理为先，并坚持：当我们进行道德行动时，理总在先是；或者毋宁说，理引导气，如御者驭马。于是，退溪一面主张事物可能不尽完满、人的行为有时不善，是因其与气交互所致——气会依其在具体形式与行动中实现的境况而受影响或败坏——一面又以此维护理的道德完满与整全。
