      It was Zhu Xi’s profound rearticulation of the Cheng brothers’ doctrine of *Principle* (理, C. *li*, K. *i*) that decisively shaped its Korean reception. In this Neo-Confucian vision, *Principle*—italicized here to distinguish it from its Western analogues—signifies the primordial, ordering ground of all reality. Every entity bears its own determinate principle, yet each is but a particularization of the overarching, immaterial, and universally structuring *Principle* that governs the cosmos. Cheng Yi famously asserted that *Principle* is one, though its manifestations are many, and that its consummate expression is found in humanity—especially in the mind, endowed with an inherently “good” nature (SB-Chan: 544). In Korea, this metaphysical orientation came to define Neo-Confucianism, commonly designated as the *School of Principle* (理學, K. *ihak*) or, more fully, the *School of Principle and Human Nature* (性理學, K. *sŏngnihak*), signaling an intellectual trajectory that pursued metaphysical inquiry to an unprecedented microcosmic depth (Keum 1980 [2000]; Kang 2003 [2006])[^kang-2003][^keum-1980].
    step1: |-
      正是朱熹对二程理（理，汉 *li*，韩 *i*）说的深刻重新表述，决定性地塑造了它在朝鲜的接受。在这一性理学视野中，理——此处用斜体，以区别于西方类似概念——意指一切实在的原初秩序根据。每一事物各有其确定之理，而每一理都只是统摄宇宙的、非物质的、普遍构造性的理的个别化。程颐有一句名言：理一而分殊，其至完满的表达见于人——尤其见于本具“善”性的心（SB-Chan: 544）。在朝鲜，这一形而上学取向界定了性理学，通常称“理学”（韩 *ihak*），更完整地称“性理学”（韩 *sŏngnihak*），标示出一条把形而上学探究推进到前所未有的微观深度的思想轨迹（Keum 1980 [2000]；Kang 2003 [2006]）[^kang-2003][^keum-1980]。
