      One interesting contribution in regard to this debate, came from one of the few women of the Chosŏn period to write on Neo-Confucianism (hence trained in Classical Chinese), Im Yunjidang (1721–1793). She disagreed somewhat with Yulgok’s interpretation of *ki*, whom her own brothers had agreed with, and instead claimed “that each thing [or species] in the universe possesses a particularised and embodied nature”, while ultimately convinced of the role of “Heaven endowed” *Principle* (Kim Sungmoon 2017: 190–191)[^kim-2017][^kim-2017-2][^kim-2017-3][^kim-2017-4]. This idea intersects with the philosophical core of the Horak debate, which questioned whether human and nonhuman beings share an identical moral nature or differ fundamentally due to variations in *ki* (material force). By emphasizing the embodied and differentiated character of nature, Im aligns conceptually with the *ki*-centered perspective advanced by Han Wŏn-jin, which privileges material conditions over abstract *Principle*. Yet, her interpretation carries radical ethical implications: while acknowledging differentiation, she insists that women possess the same moral potential as men because their original nature, grounded in *Principle*, remains intact despite psycho-physical variance. In this way, Im reframes the Horak debate’s metaphysical question into a discourse on gender equality, arguing that sagehood is attainable through self-cultivation rather than predetermined by status or gender. Her position thus extends Neo-Confucian ontology into a socially transformative vision, challenging hierarchical norms while preserving the dynamic interplay of *i* and *ki* at the heart of Korean philosophical thought. Im Yunjidang’s emphasis on the moral equality of men and women was a conviction later echoed by early Korean Catholics. Kang Chŏngiltang (1772–1832), another female Neo-Confucian scholar from this period, emphasised that human nature is good, as well as the importance of putting Confucian ideals into practice (for a recent translation and study of Im Yunjidang and Gang Jeongildang’s work see Ivanhoe and Wang (2023). Kang’s short poem on “Concentrating on Mindfulness” [or reverence] manages to capture with exquisite conciseness the main themes and the ultimate goal of Neo-Confucian learning in Chosŏn, namely, sagehood (Kim Youngmin 2007: 226, slightly altered translation)[^kim-2007]:
    step1: |-
      这场论辩有一份饶有兴味的贡献，出自朝鲜时代少数撰写性理学文字（因而受过汉文训练）的女性之一：任允挚堂（Im Yunjidang，1721–1793）。她对其兄长们所赞同的栗谷的气之解释不甚同意，转而主张“宇宙中的每一事物［或物种］都各有其特殊化而具体化的性”，同时最终确信“天所赋予”之理的作用（Kim Sungmoon 2017: 190–191）[^kim-2017][^kim-2017-2][^kim-2017-3][^kim-2017-4]。这一观念与湖洛之辩的哲学核心相交叉，后者质询人与非人存在者是否共有同一的道德本性，还是因气的差异而有根本不同。任允挚堂强调性的具体化与差异化的品格，在概念上与韩元震推进的以气为中心的视角相合——后者把质料条件置于抽象的理之上。然而，她的解释带有激进的伦理意涵：在承认差异化的同时，她坚持女性拥有与男性相同的道德潜能，因为她们的本性奠基于理，尽管形气有偏胜，仍然完好。就这样，任允挚堂把湖洛之辩的形而上学问题重构为一篇关于性别平等的论述：圣境可以通过修养达成，而非由身份或性别预先注定。她的立场由此把性理学的本体论延展为一种社会变革的愿景，既挑战等级规范，又保存朝鲜哲学思想核心的理气动态交互。任允挚堂对男女道德平等的强调，后来为早期朝鲜天主教徒所呼应。姜静一堂（Kang Chŏngiltang，1772–1832）是这一时期的另一位女性性理学者，她强调人性本善，也强调把儒家理想付诸实践的重要性（关于任允挚堂与姜静一堂著作的晚近译本与研究，见 Ivanhoe 与 Wang 2023）。姜氏关于“凝神于敬”的短诗以极精练的笔触捕捉了朝鲜性理学之学的主要主题与终极目标，即圣境（Kim Youngmin 2007: 226；译文略有改动）[^kim-2007]：
