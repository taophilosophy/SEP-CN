      Earlier scholars such as Yun Hyu (1617–1680) and Pak Sedang (1629–1703) had dared to be critical of Zhu Xi’s interpretations of texts and rituals, but Mark Setton (1997: 102–103) notes how Tasan took this to another level, arguing that even his conception of Confucian virtue was “diametrically opposed” to Zhu Xi’s. Setton also notes how Tasan even rejected the introspective aspects of self-cultivation, advocating an outward ethical practice based on our moral priorities. This, then, depends on a notion akin to self‑determining agency, a strikingly innovative idea in Tasan’s thought, for which good and evil are not inherent features of one’s material force but operate on the psychological level, existing only “in the context of concrete human relations” (Setton 1989: 380)[^setton-1989]. In this framework, the defining feature of the human being becomes its capacity for:
    step1: |-
      较早的学者如尹鑴（1617–1680）与朴世堂（1629–1703）已敢于批评朱熹对文本与礼仪的解释，但 Mark Setton（1997: 102–103）指出，茶山把这推向了另一层次：他甚至主张自己对儒家德性的构想与朱熹“正相对立”。Setton 还指出，茶山甚至拒斥修养的内省面向，倡导一种基于我们道德优先性的向外伦理实践。这便依赖一种类似自我决定能动性的观念——这是茶山思想中一个极为革新的观念：善恶不是一个人之气的固有特征，而是在心理层面运作，只“在具体人际关系的语境中”存在（Setton 1989: 380）[^setton-1989]。在这一框架中，人的界定性特征成为其如下能力：
