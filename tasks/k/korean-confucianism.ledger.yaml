      Similar to Matteo Ricci, Tasan reorients his ideas away from these widely accepted Neo-Confucian metaphysical norms towards an all-seeing *Sangje* to provide an alternative foundation for his moral framework. It is *Sangje* who re-stabilises Tasan’s re-conceptualised ontotheological-cosmology, disentangling it from *Principle*, the Supreme Ultimate, yin and yang, as well as the five elements. It is *Sangje* who renders Tasan’s philosophy distinctly theistic in orientation, for this *Sangje* is conceived as a creator‑deity, fundamentally unlike the more impersonal *Sangje* of the Confucian classics. Whereas classical Confucianism treats *Sangje* as a highest moral‑cosmic order or Heaven’s mandate operating through P*rinciple*, Tasan reinterprets *Sangje* as a personal, volitional being who intentionally creates, governs, and sustains the world. This shift transforms the metaphysical landscape of his thought: instead of grounding ethics solely in human nature, ritual propriety, or the moral patterns of Heaven, Tasan anchors moral authority in the will and agency of a transcendent, anthropomorphic *Sangje*. In this sense, his philosophy moves decisively beyond traditional Confucian cosmology toward a theistic framework that parallels—though does not wholly replicate—monotheistic models.
    step1: |-
      与利玛窦相似，茶山把其观念从这些广被接受的性理学形而上学规范上移开，转向一位全知的上帝，为其道德框架提供另一种基础。正是上帝重新稳住了茶山重新概念化的本体—神学—宇宙论，使之从理、太极、阴阳与五行中脱离出来。正是上帝使茶山的哲学在取向上明显有神论化：这位上帝被设想为一位创世之神，与儒家经典中那个较为无人格的上帝根本不同。古典儒学把上帝视为最高的道德—宇宙秩序，或通过理运作的天命；茶山则把上帝重释为一位有人格、有意志的存在者，他有意地创造、治理并维系世界。这一转向改变了他思想的形而上学地貌：茶山不再仅把伦理奠基在人性、礼仪规范或天的道德图式上，而是把道德权威锚定于一位超越的、具有人格形态的上帝的意志与能动性。在此意义上，他的哲学决定性地越出传统儒家宇宙论，走向一种与一神论模型平行——虽不完全复制——的有神论框架。
