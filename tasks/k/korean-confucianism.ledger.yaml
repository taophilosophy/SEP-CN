    source: |-
      Koreans have played a pivotal role in shaping Asian intellectual history, serving as dynamic agents of intercultural synthesis. By the fifth century CE, the “Three Teachings” of China—Buddhism, Confucianism, and Daoism—had permeated Korean society, merging with indigenous traditions and institutions. This encounter was not merely cultural but profoundly philosophical: ideas became instruments for structuring life, guiding conduct, and envisioning order. Korean Confucians, drawing on principles of hierarchy and moral governance, forged a bureaucratic framework that offered society a disciplined modus vivendi. Here, philosophy was inseparable from praxis, bearing tangible consequences for the individual, the family, and the state—indeed, for the cosmos itself. While Confucian thought prioritized ethical and social harmony over spiritual introspection, it sought to articulate an organized moral discourse capable of sustaining communal life. Inevitably, tensions among competing schools of thought sparked rigorous debates, culminating in the maturation of Korean Confucianism during the Chosŏn dynasty (1392–1910), when Neo-Confucianism emerged as a recalibrated system, eclipsing Buddhism as Korea’s dominant philosophical paradigm (for an overview of Confucianism in Korea, see Sancho 2025b)[^sancho-2025b].
    step1: |-
      朝鲜人在塑造亚洲思想史方面起了关键作用，是跨文化综合的推动者。至公元五世纪，中国的“三教”——佛教、儒学与道教——已渗入朝鲜社会，并与本土传统和制度融合。这一相遇不只是文化的，而且有深刻的哲学意义：观念成为安排生活、引导行为、构想秩序的工具。朝鲜儒者依循等级与德治的原则，锻成一套官僚框架，为社会提供了一种有纪律的共处之道。在这里，哲学与实践不可分离，对个人、家庭与国家——乃至宇宙本身——都有切实后果。儒家思想虽把伦理与社会和谐置于精神内省之上，却力图阐发一套能维系共同生活的有组织的道德话语。学派之间的张力难免引发激烈论辩，最终促成朝鲜儒学的成熟：在朝鲜王朝（1392–1910）时期，性理学作为一种重新校准的体系兴起，取代佛教成为朝鲜主导的哲学范式（关于朝鲜儒学的概况，见 Sancho 2025b）[^sancho-2025b]。
    step2: |-
      朝鲜人在塑造亚洲思想史方面起了关键作用，是跨文化综合的能动推动者。至公元五世纪，中国的“三教”——佛教、儒学与道教——已渗入朝鲜社会，并与本土传统和制度融合。这一相遇不只是文化性的，更有深刻的哲学意义：观念成了安排生活、引导行为、构想秩序的工具。朝鲜儒者依循等级与德治的原则，锻成一套官僚框架，为社会提供了一种有纪律的共处之道。在这里，哲学与实践不可分离，对个人、家庭与国家——乃至宇宙本身——都有切实后果。儒家思想虽把伦理与社会和谐置于精神内省之上，却力图阐发一套足以维系共同生活的有组织的道德话语。各学派之间的张力难免引发激烈论辩，最终促成朝鲜儒学的成熟：在朝鲜王朝（1392–1910）时期，性理学作为一种重新校准的体系兴起，取代佛教成为朝鲜主导性的哲学范式（关于朝鲜儒学的概况，见 Sancho 2025b）[^sancho-2025b]。
