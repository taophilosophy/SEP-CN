      Yi Kan advocated the primacy of *Principle* in all living things, and therefore the immanence of goodness embedded within the Confucian virtues. The idea of the immanence of *Principle* in all things is also addressed in a more macrocosmic sense in Zhang Zai’s *Diagram of the Western Inscription*, which appears in T’oegye’s Diagrams, though here again, in the Korean context these ideas are analysed in a more microcosmic manner. Yi asserted that human and nonhuman animals had the potential to manifest the universal “original mind” (本心, K. *bonsim*). This, according to Yi, was not always manifest by humans because their “physical nature” and, thereby, their psycho-physical preponderances varied: some humans were good, but some acted badly, just as was the case for nonhuman animals. He rather suggested that the apparent differences, were actually nothing other than differences in temperaments due to the turbidity of *ki* after feelings were aroused, but that the underlying *Principle* meant that they were morally unified in an unaroused state (R. Kim 2017)[^kim-2017][^kim-2017-2][^kim-2017-3][^kim-2017-4]. This also meant that theoretically, women too, even children, could aspire to be sages because their “original mind”, which was “the foundation of for human morality” was no different from that of a sage, what mattered was that one controlled one’s desires because “sages are those who maintain their moral self”: those who develop themselves to the optimum level of *humanity* (Lee 2011: 108)[^lee-2011]. As Lee (2011: 111) asserts, Yi
