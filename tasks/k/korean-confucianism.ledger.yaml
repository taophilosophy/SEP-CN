      Further complicating the intellectual impetus of Korean Confucianism was its reaction to (or rather against) Sinitic Chan meditational developments that shaped the Sŏn school in Korea. Korean Sŏn ideas had arguably reached their maturity in the teachings of the Koryŏ monk Chinul (1158–1210), especially his text *Secrets on Cultivating the Mind* (修心訣, K. *Susim kyŏl*). Chinul’s approach recognises the mind as the essence (體, K. *che*) of one’s Buddha Nature, which requires continual practice and cultivation aids to refine its function (用 K. *yong*), bringing together the important essence-function (*che-yong*) feature of Korea’s Buddhist tradition, which would deeply influence the Neo-Confucian thought of Chosŏn (for an in depth examination of Chinul’s ideas see, Buswell Jr. 2016)[^buswell-2016]. The Sŏn practice of seated meditation would also shape Neo-Confucianism’s own mind-focused concept of “quiet-sitting” (靜坐; C. *jingzuo*, K. *chŏngjwa*), also known as *chŏngjwa chonsim* (靜坐存心): to sit quietly and preserve the mind (Palais 1996: 181)[^palais-1996].
    step1: |-
      使朝鲜儒学的思想动力更趋复杂的，是它对塑造朝鲜禅宗的汉地禅修传统所作的反应（毋宁说是反拒）。朝鲜禅宗的观念可说在高丽僧知讷（1158–1210）的教说中达到成熟，尤其是他的《修心诀》（韩 *Susim kyŏl*）。知讷的进路把心认作佛性的体（韩 *che*），须以持续的修行与助道工夫来砥砺其用（韩 *yong*），从而会合朝鲜佛教传统中重要的体用（*che-yong*）特征，这一特征后来深刻影响了朝鲜王朝的性理学（关于知讷思想的深入考察，见 Buswell Jr. 2016）[^buswell-2016]。禅宗的坐禅实践也塑造了性理学自身以心为焦点的“静坐”概念（汉 *jingzuo*，韩 *chŏngjwa*），又称 *chŏngjwa chonsim*（静坐存心）：静坐以存心（Palais 1996: 181）[^palais-1996]。
