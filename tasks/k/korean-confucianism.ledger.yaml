      Amid this turbulence, Choi Min-Hong (1980: 191–217) observes a notable resurgence of philosophical interest in *Principle* (*i*) during the nineteenth century, particularly among scholars associated with the Namin faction—intellectual heirs to T’oegye’s metaphysical vision. Figures such as Ki Chŏngjin (1798–1879) and Yi Hangno (1792–1868) exemplify this revival. Yi Hangno regarded *Principle* as the fundamental substance of the universe, describing it as “something spiritual” (1980: 194), thereby reaffirming its ontological primacy. Similarly, Ki Chŏngjin returned to Zhu Xi’s writings, re-engaging with the study of ‘sage learning’ and the Classics. For Ki, *Principle* functioned as a spiritual Supreme Ultimate, generating yin and yang and, subsequently, *ki*—thus asserting that *Principle* precedes material force. Moreover, he argued that this *Principle* manifests differently in humans and animals, thereby reinforcing a hierarchical vision of cosmic order—a view that further develops themes from the Horak debate (Choi M.-H. 1980: 196–198)[^choi-1980].
    step1: TBD
    step2: TBD
  - id: 127
    kind: body
    source: |-
      Yi Chin-sang (1818–1885) also considered *Principle* as preceding *ki*, but also as that which generated it, therefore, self-cultivation lay in the study of the mind and not in knowing external things due to man’s “Heaven-bestowed cognitive powers” which depended on “transcendental *i* [*Principle*]” (Choi M.-H. 1980: 191–217)[^choi-1980]. Such idealistic ideas were hardly needed at a time when society was in such a state of disarray, already foreboded in the writings of Tasan.
