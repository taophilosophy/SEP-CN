      Contrary to T’oegye and Ugye, Yulgok advanced a more pragmatic interpretation of the relationship between i 理, Principle) and ki 氣, material force), arguing that *ki* was the activating factor behind both the ch’ilchŏng 七情, seven feelings) and the sadan (四端, four beginnings). In his view, moral psychology must be grounded in the dynamic operations of *ki*, for *i* could never exert influence in isolation; it required a locus—a material substrate—in which to “settle” (*chŏngch’aek*) before it could guide or shape reality, and that locus was *ki*. T’oegye, by contrast, refined his mature theory of hobal (互發, *ho-bal*, “alternate issuance”) to argue that although *i* and *ki* are always intertwined, they can nevertheless display distinct initiating forces within moral emotions: the *sadan* arise through the issuing of *i*, which then guides *ki*, while the *ch’ilchŏng* originate in *ki* and are subsequently harmonized by *i*. This allowed T’oegye to develop a finely differentiated moral psychology anchored in the ethical primacy of *i*. Yulgok, however, criticized the dualistic structure implicit in this model and insisted on the inseparability and constant co‑activity of *i* and *ki*, encapsulating his position in the unitary formulations *kibal isŭng* 氣發理乘, “*ki* issues and *i* rides along”) and *it’ong kiguk* 理通氣局, “*i* universally permeates while *ki* forms concrete configurations”). Thus, whereas T’oegye maintained a functional distinction between different modes of issuance, Yulgok dissolved such distinctions by emphasizing a single, integrated process of moral and psychological activity (discussed in detail in Kim 2018)[^kim-2018]. Yulgok (in Lee 1993: 633)[^lee-1993] clarifies this succintly when he writes:
    step1: |-
      与退溪和牛溪相反，栗谷对理（理）与气（氣）的关系提出更为实用主义的解释，主张气是七情与四端两者的发动因素。在他看来，道德心理学必须奠基于气的动态运作，因为理绝不能孤立地施影响；它需要一个处所——一种质料基底——“安顿”（*chŏngch’aek*）其中，而后才能引导或塑造现实，而那个处所就是气。与之相对，退溪把其成熟期的互发（*ho-bal*，“交替发动”）说加以精炼，主张理与气虽始终交织，却仍可在道德情感中显示各自不同的发动力量：四端由理发而生，理随即引导气；七情则起于气，随后由理加以调谐。这使退溪得以发展出一套精细区分的道德心理学，锚定于理的伦理优先性。然而栗谷批评这一模式所含的二元论结构，坚执理气的不可分离与恒常共作，并以两个一体化的表述概括其立场：气发理乘（“气发而理乘之”）与理通气局（“理普遍贯通而气形成具体构型”）。于是，退溪在不同发动方式之间维持功能区分，栗谷则强调道德与心理活动的单一整合过程，从而消解了这类区分（详见 Kim 2018）[^kim-2018]。栗谷（见 Lee 1993: 633）[^lee-1993]简洁地阐明这一点，他写道：
