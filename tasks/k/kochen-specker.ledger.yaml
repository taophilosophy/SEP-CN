      The KS Theorem claims the existence of a set M with a certain property (i.e. being such that KS1 and KS2 are contradictory)[^note-6] and the proof proceeds by explicitly presenting such a set, for different choices of *x* and *y*. In the original KS proof *x*=3 and *y*=117. More recently proofs involving less observables have been given by (among many others) Peres (1991, 1995) for *x*=3 and *y*=33, by Kernaghan (1994) for *x*=4 and *y*=20 and by Cabello *et al*. (1996) for *x*=4 and *y*=18. The KS proof is notoriously complex, and we will only sketch it in Section 3.4. The Peres proof establishes the KS result in full strength, with great simplicity, and, moreover, in an intuitively accessible way, since it operates in three dimensions; we refer the reader to Peres (1995: 197–99). The proofs by Kernaghan and Cabello *et al*. each establish a contradiction in four dimensions. These are weaker results, of course, than the KS theorem (since every contradiction in 3 dimensions is also a contradiction in higher dimensions, but not conversely). However, these other proofs are very simple and instructive. Moreover, it can be shown (Pavičić *et al*. 2005)[^pavičić-2005] that *y*=18 is the lowest number for which the KS theorem holds true, so we start by presenting the proof of Cabello and his co-workers in Section 3.2. Finally, in Section 3.5, we explain an argument by Clifton (1993) where *x*=3 and *y*=8 and an additional statistical assumption yields an easy and instructive KS argument.
    step1: |-
      KS 定理断言：存在一个具有特定性质（即 KS1 与 KS2 相矛盾）的集合 M[^note-6]，其证明通过为不同的 *x* 与 *y* 选择明确呈示这样的集合而展开。在原始 KS 证明中 *x*=3、*y*=117。更晚近，涉及更少可观察量的证明由（其他许多人之中）Peres（1991, 1995）给出 *x*=3 与 *y*=33；Kernaghan（1994）给出 *x*=4 与 *y*=20；Cabello *et al*.（1996）给出 *x*=4 与 *y*=18。KS 证明出了名地复杂；我们只在 3.4 节勾勒它。Peres 证明以完全的力度、极大的简洁性建立 KS 结果， moreover 在直觉上可达，因为它在三维中运作；我们请读者参 Peres（1995: 197–99）。Kernaghan 与 Cabello 等人的证明各自在四维中建立矛盾。这些当然是弱于 KS 定理的结果（因为三维中的矛盾也是更高维中的矛盾，反之不然）。然而这些证明非常简单且有教益。 moreover，可以证明（Pavičić *et al*. 2005）[^pavičić-2005]：*y*=18 是 KS 定理成立的最小数目。因此我们从 3.2 节呈现 Cabello 及其合作者的证明开始。最后，在 3.5 节我们解释 Clifton（1993）的一个论证：*x*=3 与 *y*=8，加上一个额外的统计假定，产生一个容易而有教益的 KS 论证。
