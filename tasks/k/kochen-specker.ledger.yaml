      A second, independent line of thought leading to the KS theorem is provided by Gleason’s theorem (Gleason 1957)[^gleason-1957]. The theorem states that on a Hilbert space of dimension greater than or equal to 3, the only possible probability measures are the measures μ(*P*_{α}) = Tr(*P*_{α} *W*), where *P*_{α} is a projection operator, *W* is the statistical operator characterizing the system’s actual state and Tr is the trace operation.[^note-4] The *P*_{α} can be understood as representing yes-no observables, i.e. questions for whether a QM system ‘living’ in such a Hilbert space has a property α or not, and every possible property α is associated uniquely with a vector |α> in the space — so, the task is to unambiguously assign probabilities to all vectors in the space. Now, the QM measure μ is continuous, so Gleason’s theorem in effect proves *that every probability assignment to all the possible properties in a three-dimensional Hilbert space must be continuous*, i.e. must map all vectors in the space continuously into the interval [0, 1]. On the other hand, an HV theory (if characterized by VD + NC) would imply that of every property we can say whether the system has it or not. This yields a trivial probability function which maps all the *P*_{α} to either 1 or 0, and, provided that values 1 and 0 both occur (which follows trivially from interpreting the numbers as probabilities), this function must clearly be discontinuous (cf. Redhead 1987: 28)[^redhead-1987].
    step1: |-
      引向 KS 定理的第二条独立思路由格利森定理提供（Gleason 1957）[^gleason-1957]。该定理陈述：在维度大于或等于 3 的希尔伯特空间上，唯一可能的概率测度是 μ(*P*_{α}) = Tr(*P*_{α} *W*)，其中 *P*_{α} 是投影算符，*W* 是刻画系统实际态的统计算符，Tr 是迹运算。[^note-4] *P*_{α} 可以被理解为表示是-否可观察量，即对“生活”在这样的希尔伯特空间中的 QM 系统是否具有性质 α 的问题的提问；而每一个可能的性质 α 都唯一地与空间中的一个矢量 |α> 相联——于是任务是无歧义地为空间中的所有矢量指派概率。现在，QM 测度 μ 是连续的，所以格利森定理实际上证明：*对三维希尔伯特空间中一切可能性质的概率指派必须是连续的*，即必须把空间中的所有矢量连续地映入区间 [0, 1]。另一方面，HV 理论（如果由 VD + NC 刻画）将蕴涵：对每一个性质我们都能说系统有它还是没有。这产生一个把所有 *P*_{α} 映到 1 或 0 的平凡概率函数；而只要值 1 与 0 都出现（这从把数字解释为概率平凡地得出），这个函数显然必须不连续（参 Redhead 1987: 28）[^redhead-1987]。
    step2: |-
