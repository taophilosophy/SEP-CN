      Now consider *A*, *B*, *C*, as above, and assume they have definite values *v*(*A*), *v*(*B*), *v*(*C*). Consider a ‘hidden state’ *V* which determines *v*(*A*), *v*(*B*), *v*(*C*). We can then derive from *V* trivial ‘expectation values’ which are just the possessed values themselves: <*A*>_{*V*} = *v*(*A*), and so on.[^note-2] Of course, these ‘expectation values’ do not, in general, equal the QM ones: <*A*>_{*V*} ≠ <*A*> (we would indeed think of the latter as averages over the former for different hidden states *V*!). However, von Neumann requires that the <*A*>_{*V*}, like the <*A*>, conform to (2). This automatically entails that the values themselves must conform to a condition parallel to (2), i.e.:
    step1: |-
      现在考虑如上的 *A*、*B*、*C*，并假定它们有确定值 *v*(*A*)、*v*(*B*)、*v*(*C*)。考虑一个决定 *v*(*A*)、*v*(*B*)、*v*(*C*) 的“隐态” *V*。于是我们可以从 *V* 推导出平凡的“期望值”——它们恰是所拥有的值本身：<*A*>_{*V*} = *v*(*A*)，等等。[^note-2] 当然，这些“期望值”一般不等于 QM 的那些：<*A*>_{*V*} ≠ <*A*>（我们确实会把后者想成是对不同隐态 *V* 的前者的平均！）。然而冯·诺依曼要求 <*A*>_{*V*} 像 <*A*> 一样满足 (2)。这自动蕴涵：值本身必须满足一个与 (2) 平行的条件，即：
    step2: |-
