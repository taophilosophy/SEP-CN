      [^note-17]: “在一种意义上”这一限定来自如下事实：对应于 R₃ 中全部方向的可观察量集合的可着色子集，既然是后者的真子集，在直观意义上本身不是连续的。不过我们可以定义一个从这样的可着色子集到 [0, 1] 的概率函数，它满足初等微积分的通常连续性定义。
