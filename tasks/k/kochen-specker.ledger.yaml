      [^note-12]: The argument here is due to Redhead (1987: 132). Redhead himself suggests that there is an internal tension in his argument. He remarks that STAT FUNC, as derived from the QM formalism, is a statement about (probabilities for) *measured values*, (see his remark that when QM → STAT FUNC, the latter is “understood in terms of the statistics of measurement results”, p. 132), while FUNC talks about “the *possessed values* of the observables” (p. 121, my italics). This distinction seems to devaluate Redhead’s reasoning to some extent. If there is a real difference between possessed values and measured values and no explicit assumption equating both types of values is made, then STAT FUNC (version 1) derivable from FUNC talks about a statistical relation among functions of *possessed values*, while STAT FUNC (version 2) is derived from QM, hence by definition talks about the statistics of *measured values*. The two versions initially are entirely unconnected and FUNC → STAT FUNC (version 1) cannot lend plausibility to STAT FUNC (version 1). Now, don’t we have good reason to carefully distinguish measured and possessed values in QM?

      Fortunately, no such distinction is really necessary. First, distinguish a strong sense of possessed values where possessed value are values a system possesses independently from being measured and a weak sense of possessed values where possessed values are possessed *simpliciter*, i.e. the system just has them, perhaps as a result of measurement, perhaps not. Second, consider the hedge phrase of a system ‘displaying a value’ as a result of a measurement. It is minimally a phrase like this which must go into the description of the events for which the Statistical Algorithm yields probabilities. But the hedge phrase is actually superfluous. Physical systems do not display anything unless they have it. Accordingly, if a system displays a value upon measurement, then it possesses this value (in the weak sense). By contrast, if a system displays a value upon measurement and measurement is faithful, then it possesses that value independently of measurement (thus, possessed it in the strong sense). (See the main text below, § 5.3, for more on faithful measurement; see also Redhead, p. 131 after eq. (11), for the connection between faithful measurement and possessed values.) Now, the weak sense of possessing a value is fully sufficient to formulate FUNC and Redhead’s plausibility argument for STAT FUNC remains untouched. (Indeed, the derivation FUNC → STAT FUNC itself uses the Statistical Algorithm, which would be an illegitimate procedure if the latter did not refer to probabilities for possessed values, in some sense.)
    step1: |-
      [^note-12]: 这里的论证出自 Redhead（1987: 132）。雷德海本人暗示他的论证有内在的张力。他评论说：从 QM 形式主义导出的 STAT FUNC 是关于（的概率的）*被测值*的陈述（见他的评论：当 QM → STAT FUNC 时，后者“按测量结果的统计来理解”，p. 132），而 FUNC 谈论“可观察量的*拥有的值*”（p. 121，我的强调）。这一区分在某种程度上贬低了雷德海推理的价值。如果在拥有的值与被测的值之间存在实在的差异、且没有明确假定等同两类值，那么可从 FUNC 导出的 STAT FUNC（版本 1）谈论的是*拥有的值*的函数之间的统计关系，而 STAT FUNC（版本 2）从 QM 导出，因而按定义谈论*被测值*的统计。两个版本起初完全不相干，FUNC → STAT FUNC（版本 1）不能为 STAT FUNC（版本 1）提供可信性。那么，难道我们没有好的理由在 QM 中仔细区分被测值与拥有的值吗？

      幸运的是，这样的区分其实并不必要。首先，区分拥有的值的强意义与弱意义：强意义中拥有的值是系统独立于被测量而拥有的值；弱意义中拥有的值是系统*单纯地*拥有的值——系统就是有它们，也许是测量的结果，也许不是。其次，考虑系统因测量而“显示一个值”这一限定短语。至少必须是这样的短语进入统计算法为其给出概率的事件的描述。但这一限定短语实际上是多余的：物理系统若不拥有某物，就不会显示任何东西。因此，如果系统在测量时显示一个值，那么它拥有这个值（弱意义上）。相反，如果系统在测量时显示一个值且测量是忠实的，那么它独立于测量拥有该值（因此强意义上拥有它）。（关于忠实测量的更多内容见正文下文 5.3 节；关于忠实测量与拥有的值的联系另见 Redhead, p. 131 after eq. (11)。）现在，拥有值的弱意义足以表述 FUNC，而雷德海关于 STAT FUNC 的可信性论证未受触动。（事实上 FUNC → STAT FUNC 的推导本身使用统计算法；如果后者不指某种意义上拥有的值的概率，这将是非法的程序。）
    step2: |-
      [^note-12]: 这里的论证出自 Redhead（1987: 132）。雷德海本人暗示其论证有内在张力：他评论说，从 QM 形式主义导出的 STAT FUNC 是关于（的概率的）*被测值*的陈述（见其评论：当 QM → STAT FUNC 时，后者“按测量结果的统计来理解”，p. 132），而 FUNC 谈论“可观察量的*拥有的值*”（p. 121，我的强调）——这一区分在某种程度上贬低了雷德海推理的价值：若在拥有的值与被测值之间存在实在差异、且没有明确假定等同两类值，那么可从 FUNC 导出的 STAT FUNC（版本 1）谈论的是*拥有的值*的函数之间的统计关系，而 STAT FUNC（版本 2）从 QM 导出，因而按定义谈论*被测值*的统计。两个版本起初完全不相干，FUNC → STAT FUNC（版本 1）不能为 STAT FUNC（版本 1）提供可信性。那么，难道我们没有好的理由在 QM 中仔细区分被测值与拥有的值吗？

