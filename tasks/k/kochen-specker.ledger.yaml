      The proof of Gleason’s theorem is notoriously intricate. It is notable, however, that this corollary of Gleason’s theorem can be obtained more directly via means much more elementary than those employed in Gleason’s proof. Bell (1982: 994, 1987: 164) credits J. M. Jauch with drawing his attention (in 1963) to Gleason’s theorem, and with pointing out that it implies the strengthening of von Neumann’s result, with the additivity requirement only for commuting observables. Bell then went on to prove the result in an elementary way, without use of Gleason’s proof (Bell 1966)[^bell-1966]. Unknown to Bell, Specker had already arrived at this result, alluded to (but not presented) in Specker (1960), as *ein elementargeometrisches Argument*.[^note-5] The argument was presented in Kochen and Specker (1967). Bell’s proof and the Kochen-Specker proof utilize similar constructions in 3-dimensional Hilbert space, though they differ in their details. Kochen and Specker go on to explicitly construct a finite set of projections that cannot be assigned values subject to the constraint that the additivity requirement (3) hold when *A* and *B* commute. Though Bell does not do so, one can readily obtain from Bell’s construction also a finite set of observables that cannot be assigned values subject to the additivity constraint for commuting observables (see Mermin 1993)[^mermin-1993].
    step1: |-
      格利森定理的证明出了名地繁复。但值得注意的是：格利森定理的这一推论可以经由比格利森证明所用的手段初等得多的手段更直接地得到。贝尔（1982: 994, 1987: 164）把（1963 年）使她注意到格利森定理、并指出它蕴涵对冯·诺依曼结果——附加性要求只对可交换算符成立——之加强的功劳归于 J. M. 若赫。贝尔接着以初等方式证明了这一结果，未使用格利森的证明（Bell 1966）[^bell-1966]。贝尔不知道的是，斯佩克早已得出这一结果——在 Specker (1960) 中被暗示（但未呈示），作为*一个初等几何的论证*。[^note-5]该论证呈示于 Kochen and Specker (1967)。贝尔的证明与 Kochen-Specker 证明在三维希尔伯特空间中使用相似的构造，尽管细节不同。Kochen 与 Specker 接着明确构造了一个有限投影集——在要求附加性要求 (3) 当 *A* 与 *B* 可交换时成立的约束下，这些投影无法被赋值。虽然贝尔没有这样做，从贝尔的构造人们同样容易得到一个有限的、在可交换算符的附加性约束下无法被赋值的可观察量集合（见 Mermin 1993）[^mermin-1993]。
