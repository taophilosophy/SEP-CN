      It should be stressed that at this point there is no direct connection between R₃ and physical space. KS wish to show that for an arbitrary QM system requiring a representation in a Hilbert space of at least three dimensions, the ascription of values in conjunction with condition (KS2) (Sum Rule and Product Rule) is impossible, and in order to do this it is sufficient to consider the space R₃. This space R₃, however, does not represent physical space for the quantum system at issue. In particular, orthogonality in R₃ is not to be confused with orthogonality in physical space. This becomes obvious if we move to an example of a QM system sitting in physical space and at the same time requiring a QM representation in H₃, e.g. the spin degree of freedom of a one-particle spin-1 system. Given an arbitrary direction α in physical space and an operator *S*_{α} representing the observable of a spin component in direction α, H₃ is spanned by the eigenvectors of *S*_{α}, namely |*S*_{α}=1>, |*S*_{α}=0>, |*S*_{α}=−1>, which are mutually orthogonal in H₃. The fact that these three vectors corresponding to three possible results of measurement in one spatial direction are mutually orthogonal illustrates the different senses of orthogonality in H₃ and in physical space. (The reason lies, of course, in the structure of QM, which represents different values of an observable by different directions in H₃.)
    step1: |-
      应当强调：在这一点上，R₃ 与物理空间之间没有直接联系。KS 想要表明：对要求以至少三维的希尔伯特空间表示的任意 QM 系统，与条件 (KS2)（和规则与积规则）相结合的值的归属是不可能的；为做到这一点，考虑空间 R₃ 就足够了。然而这个 R₃ 并不表示该量子系统所处的物理空间。特别地，R₃ 中的正交性不应与物理空间中的正交性混淆。如果我们转到物理空间中坐落着的、同时又要求 H₃ 表示的 QM 系统的例子——例如单粒子自旋-1 系统的自旋自由度——这就变得显而易见。给定物理空间中的任意方向 α 与表示方向 α 的自旋分量这一可观察量的算符 *S*_{α}，H₃ 由 *S*_{α} 的本征矢 |*S*_{α}=1>、|*S*_{α}=0>、|*S*_{α}=−1> 张成——它们在 H₃ 中彼此正交。对应于一个空间方向上三个可能测量结果的这三个矢量彼此正交，这一事实例示了 H₃ 与物理空间中正交性的不同含义。（原因当然在于 QM 的结构：QM 用 H₃ 中的不同方向表示一个可观察量的不同值。）
