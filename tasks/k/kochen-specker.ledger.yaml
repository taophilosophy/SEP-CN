      [^note-16]: What we mean here is the following. A definition of observable *f*(*A*) (or observable *A* + *B*, or observable *A*·*B*, both constructed from observables *A* and *B*) would be that it is an observable which takes a value calculated by measuring *v*(*A*) (or measuring *v*(*A*) and *v*(*B*)) and applying *f* to the result (or calculating *v*(*A*) + *v*(*B*), or calculating *v*(*A*) *v*(*B*)). FUNC, the Sum Rule and the Product Rule, as restricted to one measurement context, trivially repeat these definitions, and there obviously is no point in testing, e.g., whether *v*(*A*·*B*) really equals *v*(*A*) *v*(*B*), if the former expression is defined by the latter.
    step1: |-
      [^note-16]: 我们的意思如下。可观察量 *f*(*A*)（或可观察量 *A* + *B*、*A*·*B*——都从可观察量 *A* 与 *B* 构造）的定义是：它是一个可观察量，其值通过测量 *v*(*A*)（或测量 *v*(*A*) 与 *v*(*B*)）并把 *f* 应用于结果（或计算 *v*(*A*) + *v*(*B*)，或计算 *v*(*A*) *v*(*B*)）而算得。限定于一个测量语境的 FUNC、和规则与积规则，平凡地重复这些定义；显然检验诸如 *v*(*A*·*B*) 是否真的等于 *v*(*A*) *v*(*B*) 没有意义——如果前一表达式由后一定义的话。
    step2: |-
      [^note-16]: 我们的意思如下：可观察量 *f*(*A*)（或可观察量 *A* + *B*、*A*·*B*——都从可观察量 *A* 与 *B* 构造）的定义是：其值通过测量 *v*(*A*)（或测量 *v*(*A*) 与 *v*(*B*)）并把 *f* 应用于结果（或计算 *v*(*A*) + *v*(*B*)、*v*(*A*) *v*(*B*)）而算得。限定于一个测量语境的 FUNC、和规则与积规则，平凡地重复这些定义；显然检验诸如 *v*(*A*·*B*) 是否真的等于 *v*(*A*) *v*(*B*) 没有意义——若前一表达式由后一定义的话。
