      The present section states some elements of the historical and systematic background of the KS theorem. Most importantly, an argument by von Neumann (1932), a theorem by Gleason (1957), and a critical discussion of both plus a later argument by Bell (1966) have to be considered. Von Neumann, in his famous 1932 book *Die mathematischen Grundlagen der Quantenmechanik*, disputed the possibility of providing QM with an HV underpinning. He gave an argument that boils down to the following: Consider the mathematical fact that, if A and B are self-adjoint operators, then any real linear combination of them (any C = αA + βB, where α, β are arbitrary real numbers) is also a self-adjoint operator. QM further dictates that:
    step1: |-
      本节陈述 KS 定理的历史与系统背景的一些要素。最重要的是：冯·诺依曼（1932）的一个论证、格利森（1957）的一条定理、对两者的批判性讨论，以及贝尔（1966）稍后的一个论证，都必须加以考虑。冯·诺依曼在其 1932 年的名著《量子力学的数学基础》中否定为 QM 提供 HV 基础的可能性。他给出的论证可归结如下：考虑一个数学事实——如果 A 与 B 是自伴算符，则它们的任意实线性组合（任意 C = αA + βB，其中 α、β 为任意实数）也是自伴算符。QM 进一步规定：
    step2: |-
      本节陈述 KS 定理的历史与系统背景的若干要素。最重要的是：冯·诺依曼（1932）的一个论证、格利森（1957）的一条定理、对两者的批判讨论，以及贝尔（1966）稍后的一个论证。冯·诺依曼在 1932 年名著《量子力学的数学基础》中否定为 QM 提供 HV 基础的可能；其论证可归结为：若 A 与 B 是自伴算符，则其任意实线性组合（任意 C = αA + βB，α、β 为任意实数）也是自伴算符。QM 进一步规定：
  - id: 16
    kind: body
    source: |-
      1. If *A* and *B* (represented by self-adjoint operators A and B) are observables on a system, then there is an observable *C* (represented by self-adjoint operator C defined as before) on the same system.
      2. If, for any QM state, the expectation values of *A* and *B* are given by <*A*> and <*B*>, then the expectation value of *C* is given by <*C*>=α<*A*> + β<*B*>.
    step1: |-
      1. 如果 *A* 与 *B*（由自伴算符 A 与 B 表示）是一个系统上的可观察量，那么同一系统上存在可观察量 *C*（由前述定义的自伴算符 C 表示）。
      2. 如果对任意 QM 态，*A* 与 *B* 的期望值由 <*A*> 与 <*B*> 给出，则 *C* 的期望值由 <*C*>=α<*A*> + β<*B*> 给出。
    step2: |-
      1. 如果 *A* 与 *B*（由自伴算符 A 与 B 表示）是系统上的可观察量，则同一系统上存在可观察量 *C*（由前述定义的自伴算符 C 表示）。
      2. 若对任意 QM 态，*A* 与 *B* 的期望值由 <*A*>、<*B*> 给出，则 *C* 的期望值由 <*C*>=α<*A*> + β<*B*> 给出。
