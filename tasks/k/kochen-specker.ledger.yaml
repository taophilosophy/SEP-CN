      This, however, is impossible, in general. An example very easily shows how (3) is violated, but because of its simplicity it also shows the argument’s inadequacy. (This example is not due to von Neumann himself, but to Bell![^note-3]) Let *A* = σₓ and *B* = σ_{y}, then operator *C* = (σₓ + σ_{y})/√2 corresponds to the observable of the spin component along the direction bisecting *x* and *y*. Now all spin components have (in suitable units) possible values ±1 only, thus, the HV proponent is forced to ascribe ±1 to *A*, *B*, *C* as values, and thus as ‘expectation values’. But (3) now obviously cannot be fulfilled, since ±1 ≠ (±1 + ±1)/√2.
    step1: |-
      然而这一般是不可能的。一个例子极容易表明 (3) 如何被违反；但正因其简单，它也暴露了论证的不足。（这个例子不是冯·诺依曼本人所举，而是贝尔！[^note-3]）令 *A* = σₓ、*B* = σ_{y}，则算符 *C* = (σₓ + σ_{y})/√2 对应于沿平分 *x* 与 *y* 的方向的自旋分量这一可观察量。现在所有自旋分量（在合适的单位下）的可能值只有 ±1，于是 HV 的拥护者被迫把 ±1 赋给 *A*、*B*、*C* 作为值，从而作为“期望值”。但 (3) 显然无法满足，因为 ±1 ≠ (±1 + ±1)/√2。
    step2: |-
      然而这一般不可能。一个例子极易表明 (3) 如何被违反；但正因其简单，它也暴露论证的不足（此例非冯·诺依曼所举，而是贝尔！[^note-3]）：令 *A* = σₓ、*B* = σ_{y}，则算符 *C* = (σₓ + σ_{y})/√2 对应沿平分 *x*、*y* 方向的自旋分量这一可观察量。所有自旋分量（在合适单位下）的可能值只有 ±1，于是 HV 拥护者被迫把 ±1 赋给 *A*、*B*、*C* 作为值，从而作为“期望值”；但 (3) 显然无法满足——±1 ≠ (±1 + ±1)/√2。
  - id: 20
    kind: body
    source: |-
      The example illustrates why von Neumann’s argument is unsatisfying. Nobody disputes the move from (2) to (3) for compatible observables, i.e. those which, according to QM, are jointly measurable in one arrangement. The above choice of *A*, *B*, *C*, however, is such that any two of them are incompatible, i.e. are not jointly observable. For these we will not want to require any HV interpretation to meet (3), but only (2). The hidden values need not conform with (3) in general, only the averages of their values in a series of tests must conform with (2). The authority of von Neumann’s argument comes from the fact that requirements (1) and (2), *for QM states*, are consequences of the QM formalism, but this does not in itself justify extending these requirements to the hypothetical *hidden states*. Indeed, if (3) were unrestrictedly true, this would nicely explain, in the presence of hidden values, why (2) is. Von Neumann apparently thought that the HV proponent is committed to this explanation, but this seems an implausible restriction.
    step1: |-
      这个例子说明了为什么冯·诺依曼的论证不令人满意。没有人争议从 (2) 到 (3) 的推移对于相容可观察量——即照 QM 的说法可以在一个装置中被联合测量的那些——的适用性。然而上面对 *A*、*B*、*C* 的选择是：其中任何两个都不相容，即不可联合测量。对它们，我们不会要求任何 HV 解释满足 (3)，而只要求满足 (2)。隐值一般不必与 (3) 一致；只有其值在一系列检验中的平均必须与 (2) 一致。冯·诺依曼论证的权威来自如下事实：要求 (1) 与 (2) *对 QM 态而言*是 QM 形式主义的推论；但这本身并不证明把这些要求扩展到假想的*隐态*是正当的。事实上，如果 (3) 无限制地为真，这将漂亮地解释（在隐值存在的情形下）为什么 (2) 为真。冯·诺依曼显然认为 HV 的拥护者承诺了这一解释，但这似乎是一个不合理的限制。
