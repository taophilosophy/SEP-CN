      [^note-17]: The proviso ‘in a sense’ comes from the fact that a colourable subset of the set of observables corresponding to all directions in R3, since it is a proper subset of the latter, is not itself continuous in the intuitive sense. We can, however, define a probability function from such a colourable subset into [0, 1] which obeys the usual continuity definition of elementary calculus.
