      ### 3.4 The Original KS Argument. Sketch of the Proof.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      KS proceed in two steps.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      (1) In the first (and decisive) step they show *that two rays with opposite colours cannot be arbitrarily close*. They first show that the diagram Γ₁ depicted in Fig. 1 (where for the time being we ignore the colours specified in the figure) can be constructed, only if a₀ and a₉ are separated by an angle θ with 0 ≤ θ ≤ sin^{−1}(1/3) ([Step 1 Proof](kochen-specker.step1.md)).
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      > ![fig1](../assets/kochen-specker/fig1.gif) Figure 1: Ten-point KS graph Γ₁ with inconsistent colouring.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Consider now (for a *reductio ad absurdum*) that a₀ and a₉ have different colours. We arbitrarily colour a₀ white and a₉ black. The colouring constraints then force us to colour the rest of the diagram as is done in Fig. 1, but this requires that a₅ and a₆ are orthogonal and both white — which is forbidden. Hence, two points closer than sin^{−1}(1/3) cannot have different colours. Contrapositively, two points of different colour cannot be closer than sin^{−1}(1/3).
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      (2) KS now construct another quite complicated KS diagram Γ₂ in the following way. They consider a realization of Γ₁ for an angle θ=18° < sin^{−1}(1/3). Now they choose three orthogonal points *p*₀, *q*₀, *r*₀ and space interlocking copies of Γ₁ between them such that every instance of point a₉ of one copy of Γ₁ is identified with the instance of a₀ of the next copy. In this way five interlocking copies of Γ₁ are spaced between *p*₀ and *q*₀ and all five instances of a₈ are identified with *r*₀ (likewise five such interlocking copies are spaced between *q*₀ and *r*₀, identifying all copies of a₈ with *p*₀, and between *p*₀ and *r*₀, identifying all copies of a₈ with *q*₀). That Γ₂ is constructible is borne out directly by the construction itself. Spacing out five copies of Γ₁ with angles θ=18° between instances of a₀ will space out an angle of 5x18° = 90° which is exactly what is required. Moreover, wandering from one copy of Γ₁ to the next between, say, *p*₀ and *q*₀ is equivalent to a rotation by 18° of the copy about the axis through the origin and *r*₀, which evidently conserves the orthogonality between the points a₀ and a₉ of the copy and *r*₀.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      > ![fig2](../assets/kochen-specker/fig2.gif) Figure 2: 117-point KS graph Γ₂ (*From* Kochen and Specker 1967, 69; *by permission of the Indiana University Mathematics Journal*)[^kochen-1967]
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      However, although Γ₂ is constructible it is *not* consistently colourable. From the first step we know that a copy of Γ₁ with θ=18° requires that points a₀ and a₉ have equal colour. Now, since a₉ in one copy of Γ₁ is identical to a₀ in the next copy, a₉ in the second copy must have the same colour as a₀ in the first. Indeed, by repetition of this argument all instances of a₀ must have the same colour. Now, *p*₀, *q*₀, *r*₀ are identified with points a₀, so they must be either all white or all black — both of which are inconsistent with the colouring constraint that exactly one of them be white.
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      If from the 15 copies of Γ₁ used in the process of constructing Γ₂ we subtract those points that were identified with each other, we end up with 117 different points. So, what KS have shown is that a set of 117 yes-no observables cannot consistently be assigned values in accordance with VC1 (or, equivalently, VC2).
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      Note that in the construction of Γ₁, i.e. the set of 10 points forming 22 interlocking triples, all points except a₉ appear in more than one triple. In Γ₂ every point appears in a multiplicity of triples. It is here that the noncontextuality premise is crucial to the argument: we assume that an arbitrary point keeps its value 1 or 0 as we move from one orthogonal triple to the next (i.e. from one maximal set of compatible observables to another).
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      ### 3.5 A Statistical KS Argument in Three Dimensions (Clifton)
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Recall KS’s first step, which establishes that two points with opposite colour cannot be arbitrarily close. It is this first step which carries the whole force of the argument. Bell had established it in a different way and had then argued that in a noncontextual HV interpretation points with opposite colour must be arbitrarily close. It is this first step that Clifton exploits in an argument that combines Bell’s and KS’s ideas.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      > ![fig3](../assets/kochen-specker/fig3.gif) Figure 3: 8-point KS-Clifton graph Γ₃ with inconsistent colouring.
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Consider the KS diagram Γ₃ shown in Figure 3 which obviously is a part of KS’s Γ₁, but which has additional concrete assignments of eight points satisfying the orthogonality relations (and thus proving directly that Γ₃ is constructible). From our previous colouring constraints (joined points are not both white and a triangle has exactly one white point) we see immediately that Γ₃ is colourable only if the outermost points are not both white (which would require, as shown in Fig. 3, that two joined points are white — contrary to the constraints). Moreover, we easily calculate the angle between the two outermost points to be cos^{−1}(1/3).[^note-8] So we conclude that if one wants to colour all eight points and wants to colour white one of the outer ones, then the other must be black. Taking into account that we can insert a diagram between any two points in R₃ which are separated by exactly the angle cos^{−1}(1/3) and translating our problem back from a colouring problem into KS’s example (constraint VC2), we end with a constraint VC2′:
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      > (VC2′)   If, for a spin-1 system, a certain direction *x* of spin in space is assigned value 0, then any other direction *x*′ which lies away from *x* by an angle cos^{−1}(1/3) must be assigned value 1, or, in symbols: If *v*(*S*_{*x*})=0, then *v*(*S*_{*x*′})=1.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      The argument so far has made use of the original KS conditions KS1 and KS2. We now assume, in addition, that any constraint on value assignments will show up in the measurement statistics. In particular:
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      > (3) If prob[*v*(*A*)=*a*] = 1, and *v*(*A*)=*a* implies *v*(*B*)=*b*, then prob[*v*(*B*)=*b*] = 1.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      Despite the use of statistics, this reasoning crucially differs from von Neumann’s argument. Von Neumann had argued that algebraic relations between values should transfer into the statistics of the measured values, therefore the QM constraints on these statistics should have value constraints as their exact mirror images — which reasoning leads us to derive value constraints from statistical constraints (for arbitrary observables). Here, on the contrary, we derive a value constraint independently from any statistical reasoning, and then conclude that this constraint should transfer into the measurement statistics.[^note-9]
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Now, VC2′ and the statistical condition (3) entail: If prob[*v*(*S*_{*x*})=0]=1, then prob[*v*(*S*_{*x*′})=1]=1. This, however, contradicts the statistics derived from QM for a state where prob[*v*(*S*_{*x*})=0] = 1.[^note-10] In fact, there is a probability of 1/17 that *v*(*S*_{*x*′}=0). So, in a long-run test 1/17 of the spin-1 particles will violate the constraint.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      If we accept Clifton’s statistical reasoning, we have an entirely valid KS argument establishing a contradiction between an HV interpretation of QM and the very predictions of QM. Clifton presents also a slightly more complex set of 13 observables yielding, along the same lines, a statistical contradiction of 1/3.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Clifton’s argument uses 8 (or 13) observables, fixes a value of one of them (*S*_{*x*}) and derives a HV prediction at variance with a QM prediction for a second one (*S*_{*x*′}). Hence, if a state can be produced where the QM system definitely has value *v*(*S*_{*x*})=0 the predictions can be tested empirically. But fixing such a state experimentally is not an easy matter. So Clifton’s argument depends on a state that may be difficult to produce or isolate. Recently, a construction of 13 observables has been found that allows for a state-independent statistical argument (Yu and Oh 2012).
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      ## 4. The Functional Composition Principle
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      The key ingredients of the KS theorem are the constraints on value assignments spelled out in (2): the Sum Rule and Product Rule. They can be derived from a more general principle, called the *Functional Composition Principle* (FUNC).[^note-11] The principle trades on the mathematical fact that for a self-adjoint operator A operating on a Hilbert space, and an arbitrary function f: **R**→**R** (where **R** is the set of the real numbers), we can define f(A) and show that it also is a self-adjoint operator (hence, we write f(A)). If we further assume that to every self-adjoint operator there corresponds a QM observable, then the principle can be formulated thus:
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      > **FUNC:**  Let A be a self-adjoint operator associated with observable A, let f: **R** → **R** be an arbitrary function, such that f(A) is another self-adjoint operator, and let |φ> be an arbitrary state; then f(A) is associated uniquely with an observable *f*(*A*) such that:
      >
      > > *v*(*f*(*A*))^{|φ>} = *f*(*v*(*A*))^{|φ>}
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      (We introduce the state superscript above to allow for a possible dependence of values on the particular quantum state the system is prepared in.) The Sum Rule and the Product Rule are straightforward consequences of FUNC [[Sum and Product Rules Proof](kochen-specker.srprfunc.md)]. FUNC itself is not derivable from the formalism of QM, but a statistical version of it (called STAT FUNC) is [[Derivation of STAT FUNC](kochen-specker.sfderiv.md)]:
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      > **STAT FUNC:**  Given *A*, *f*, |φ> as defined in FUNC, then, for an arbitrary real number *b*:
      >
      > > prob[*v*(*f*(*A*))^{|φ>}=*b*] = prob[f*(v*(*A*))^{|φ>}=*b*]
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      But STAT FUNC cannot only be derived from the QM formalism; it also follows from FUNC [[STAT FUNC Proof](kochen-specker.statfunc.md)]. This can be seen as providing “a plausibility argument for FUNC” (Redhead 1987: 132)[^redhead-1987]: STAT FUNC is true, as a matter of the mathematics of QM. Now, if FUNC were true, we could derive STAT FUNC, and thus understand part of the mathematics of QM as a consequence of FUNC.[^note-12]
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      But how can we derive FUNC itself, if not from STAT FUNC? It is a direct consequence of STAT FUNC and three assumptions (two of which are familiar from the introduction):
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      > **Value Realism (VR):** If there is an operationally defined real number α, associated with a self-adjoint operator A and if, for a given state, the statistical algorithm of QM for A yields a real number β with β = prob(*v*(A)=α), then there exists an observable *A* with value α.
      >
      > **Value Definiteness (VD):** All observables defined for a QM system have definite values at all times.
      >
      > **Noncontextuality (NC):** If a QM system possesses a property (value of an observable), then it does so independently of any measurement context.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      VR and NC require further explanation. First, we need to explain the content of VR. The statistical algorithm of QM tells us how to calculate a probability from a given state, a given observable and its possible value. Here we understand it as a mere mathematical device without any physical interpretation: Given a Hilbert space vector, an operator and its eigenvalues, the algorithm tells us how to calculate new numbers (which have the properties of probabilities). In addition, by ‘operationally defined’ we here simply mean ‘made up from a number which we know to denote a real property’. So, VR, in effect, says that, if we have a real property Γ (value Γ of an observable G), and we are able to construct from Γ a new number α and find an operator A such that α is an eigenvalue of A, then (we have fulfilled everything necessary to apply the statistical algorithm; thus) A represents an observable A and its value α is a real property.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Second, a failure of NC could be understood in two ways. Either the value of an observable might be context-dependent, although the observable itself is not; or the value of an observable might be context-dependent, because the observable itself is. In either case, the independence from context of an observable implies that there is a correspondence of observables and operators. This implication of NC is what we will use presently in the derivation of FUNC. We will indeed assume that, if NC holds, this means that the *observable* — and *thereby* also its value — is independent of the measurement context, i.e. is independent of how it is measured. In particular, the independence from context of an observable implies that there is a 1:1 correspondence of observables and operators. This implication of NC is what we will use presently in the derivation of FUNC. *Conversely*, failure of NC will be construed solely as failure of the 1:1 correspondence.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      From VR, VD, NC and STAT FUNC, we can derive FUNC as follows. Consider an arbitrary state of a system and an arbitrary observable *Q*. By VD, *Q* possesses a value *v*(*Q*)=*a*. Thus, we can form the number *f*(*v*(*Q*))=*b* for an arbitrary function *f*. For this number, by STAT FUNC, prob[*f*(*v*(*Q*))=*b*] = prob[*v*(*f*(*Q*))=*b*]. Hence, we have, by transforming probabilities according to STAT FUNC, created a new self-adjoint operator f(Q), and associated it with the two real numbers *b* and prob[*f*(*v*(*Q*))=*b*]. Thus, by VR, there is an observable corresponding to f(Q) with value *b*, hence *f*(*v*(*Q*))=*v*(*f*(*Q*)). By NC, that observable is unique, hence FUNC follows.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      ## 5. Escaping the KS Argument
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      The previous section clarifies which possibilities the HV theorist has to escape the KS argument: denying one of the three premises which together entail FUNC (hence the Sum Rule and Product Rule).
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      ### 5.1 No General Value Definiteness
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      VD, we recall, was the fundamental presupposition of a fully-fledged HV interpretation. So, if, in order to escape a powerful argument against the possibility of HV interpretations, these interpretations drop their fundamental premise, this seems not to make much sense. But some interpreters point out that, between holding that only those observables which QM prescribes to have values[^note-13] and holding that all of them have values, there is some leeway, namely, to propose that a set of observables, different from the one prescribed in QM (but neither, in general, more than these, nor, of course, all) have values. This option is called ‘partial value definiteness.’ One way to do this is to choose, once and for, a set of observables that can be assigned definite values without running afoul of the KS Theorem. The best-known example of this is the de Broglie-Bohm pilot wave theory, on which position and functions of position always have definite values. Another approach is to let the set of definite observables vary with the state; this is the approach taken by various modal interpretations. A variant on this approach is that of Bub (1997), on which some observable *R* is chosen to to be always-definite; the set of definite observables is then expanded to the maximal set that avoids a KS obstruction.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      The rocks and shoals of modal interpretations are beyond the scope of this article (see the entry on modal interpretations). We just note that it is by no means clear how these interpretations can manage to always pick out the right set of observables assumed to have values. ‘Right set’ here minimally means that observables we perceive as having values (i.e. those corresponding to the measurement apparatus’s pointer position) must always be included and must always reproduce the QM statistics. We also mention two important results which cast doubt on the feasibility of modal interpretations: First, it can be shown that either partial value definiteness collapses into total value definiteness (i.e., VD) or classical reasoning about physical properties must be abandoned (Clifton 1995)[^clifton-1995]. Second, it is possible to derive KS theorems even in certain modal interpretations (Bacciagaluppi 1995, Clifton 1996)[^bacciagaluppi-1995][^clifton-1996].
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      Recently it has been argued that the denial of VD is inconsistent with QM itself (Held 2008, 2012a, 2012b)[^held-2008]. The argument tries to show that VD is a consequence of the theory itself (QM → VD). If this is indeed the case we have — recalling that KS establish that QM & VD & NC implies a contradiction — an argument for the claim that QM alone implies contextuality. Since, in that case, QM also implies VD we get, all in all, an argument for the claim that QM must be interpreted in terms of contextual hidden variables.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      ### 5.2 Denial of Value Realism
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      The derivation of FUNC essentially consists in the construction of an observable (i.e. *f*(*Q*)) via an operator (i.e., f(Q)) from the probability distribution of a variable (i.e. *f*(*v*(*Q*)) which number in turn is constructed from another variable, (i.e. *v*(*Q*)). Now, instead of denying that *v*(*Q*) exists in all cases (as the first option (5.1) would have it), we can reject that the existence of a number α and the construction of f(Q) automatically lead to an observable, i.e. we reject VR. This amounts to rejecting that for every self-adjoint operator, there is a well-defined observable.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Now, in order to formulate VR we had to give a reduced reading to the statistical algorithm, i.e. that it is a mere mathematical device for calculating numbers from vectors, operators and numbers. This reading is very artificial and presupposes that a minimal interpretive apparatus required to make physical sense of some operators (like Q) can be withheld for others (like f(Q)).
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      Moreover, it seems entirely implausible to assume that some operators — sums and products of operators that are associated with well-defined observables — are themselves not associated with well-defined observables, even if they mathematically inherit exact values from their summands or factors. Put in a crude example, this would amount to saying that to ask for a system’s energy is a well-defined question, while to ask for the square of the system’s energy is not, even if, from our answer to the first question and trivial mathematics, we have a well-defined answer at hand. There seems no good a priori reason to justify this restriction. So, to make rejecting VR plausible at all, an additional proposal is made: It is crucial to the KS argument that one and the same operator is constructed from different maximal ones which are incompatible: f(Q) is identical to g(P), where PQ − QP ≠ 0. We now assume that only the construction of f(Q) via *Q*, but not the one via *P*, leads to a well-defined observable in a certain context.[^note-14]
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
    source: |-
      This move however, automatically makes some observables context-sensitive. So, this way of motivating the denial of VR amounts to a kind of contextualism, which we might come by cheaper, by directly rejecting NC, and without any tampering with the statistical algorithm. (This fact explains why we did not mention denial of VR as a separate option in the introduction.).
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      ### 5.3 Contextuality
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      Finally, we might accept VD and VR, but deny that our construction of an observable *f*(*Q*) is unambiguous. Thus, though f(Q) and g(P) are mathematically identical, we could assume that they correspond to different observables, arguing that an actual determination of *v*(*f*(*Q*)) must proceed via measuring *Q*, but the determination of *v*(*g*(*P*)) involves measuring *P* which is incompatible with *Q*. Since *v*(*f*(*Q*)) and *v*(*g*(*P*)) are thus outcomes of different measurement situations, there is no reason to assume that *v*(*f*(*Q*)) = *v*(*g*(*P*)). This way to block the KS proof comes to understanding *f*(*Q*) and *g*(*P*) as different observables (because of sensitivity to context), thus it amounts to rejecting NC. There are mainly two ways, in the literature, to further motivate this step. Accordingly, there are two important brands of contextuality to be discussed — causal and ontological contextuality.
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      The KS argument has been presented for possessed values of a QM system — independently of considerations about measurement. Indeed, in the argument measurement was mentioned only once and in the negative — in NC. However, since now we consider the rejection of NC, we must also take into account measurement and its complications. For that purpose it is good to explicate yet another principle that manifests our innocuous realism (see the introduction above), i.e. a principle of faithful measurement:
    step1: TBD
    step2: TBD
  - id: 99
    kind: body
    source: |-
      > **Faithful Measurement (FM):** QM measurement of an observable faithfully delivers the value which that observable had immediately prior to the measurement interaction.
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      FM is also an extremely plausible presupposition of natural science, in general. (Note that FM entails VD, hence we could have given a KS argument for possible measurement results, using FM). Consider now the motivation, for the HV proponent, to reject NC. Obviously, the aim is to save other presuppositions, especially VD. Now, VD and NC are independent realist convictions, but NC and FM are not quite so independent. Indeed, we will see that rejection of NC entails the rejection of FM in one version of contextuality, and strongly suggests it in the other. (This makes more precise the somewhat cryptic remark from the introduction that it is not obvious what an interpretation endorsing the realist principle VD, but rejecting the realist principle NC, should look like. Such an interpretation would have to violate a third realist principle, i.e. FM.)
    step1: TBD
    step2: TBD
