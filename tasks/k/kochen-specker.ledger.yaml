  - id: 103
    kind: body
    source: |-
      If an interpreter wanted to defend causal contextuality, this would entail abandoning FM, at least for observables of the type *f*(*Q*) (non-maximal observables): Since their values causally depend on the presence of certain measurement arrangements, these arrangements are causally necessary for the values to come about, thus the values cannot be present before the system-apparatus interaction, and FM is violated. As an advantage of causal contextualism the following might be pointed out. It does not imply that the ontological status of the physical properties involved must change, i.e. does not imply that they become relational. If the property in an object is brought about via interaction with another one, it can still be one which the object has for itself after the interaction. However, the idea of causal contextuality is sometimes discussed critically, since there is reason to think that it may be empirically inadequate (see Shimony 1984, Stairs 1992)[^shimony-1984][^stairs-1992].
    step1: |-
      如果一位解释者想要为因果语境性辩护，这将要求放弃 FM——至少对 *f*(*Q*) 型的可观察量（非极大可观察量）而言：既然它们的值因果地依赖某些测量装置的存在，这些装置对值的产生是因果地必需的，因此值不能在系统-装置相互作用之前就存在，FM 被违反。作为因果语境主义的一个优点，可以指出如下：它不蕴涵所涉物理性质的存在论地位必须改变，即不蕴涵它们变成关系性的。如果对象中的性质经由与另一对象的相互作用而产生，它仍然可以是相互作用之后对象自身拥有的性质。然而，因果语境性的理念有时被批判地讨论，因为有理由认为它可能在经验上不适当（见 Shimony 1984, Stairs 1992）[^shimony-1984][^stairs-1992]。
    step2: |-
      若解释者想为因果语境性辩护，这将要求放弃 FM——至少对 *f*(*Q*) 型可观察量（非极大可观察量）而言：既然其值因果地依赖某些测量装置的存在，这些装置对值的产生因果地必需，值不能在系统-装置相互作用之前就存在，FM 被违反。因果语境主义的一个优点可指出：它不蕴涵所涉物理性质的存在论地位必须改变（即不蕴涵它们变成关系性的）——若对象中的性质经由与另一对象的相互作用产生，它仍可以是相互作用之后对象自身拥有的性质。然而因果语境性的理念有时被批判讨论：有理由认为它可能经验不适当（见 Shimony 1984, Stairs 1992）[^shimony-1984][^stairs-1992]。
