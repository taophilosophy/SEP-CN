      [^note-6]: It has been claimed that the theorem’s statement requires a third condition:

      > (KS2)(c): There exists at least one observable *X* with *v*(*X*) ≠ 0.
      >
      > […] Without condition KS2c the theorem is actually false — the trivial valuation where for all observables *X* one sets *v*(*X*) = 0 provides an explicit counter-example.

      (See Rajan and Visser 2017, p. 2, in Other Internet Resources.) But this is a mistake. The theorem claims the existence of a valuation such that KS1 and KS2 jointly are contradictory. Arguably, this claim can only be proved by explicit examples. Presenting a valuation such that KS1 and KS2 jointly are compatible (non-contradictory) – i.e., the “trivial valuation” – is itself compatible with the theory’s claim but irrelevant to its proof.
