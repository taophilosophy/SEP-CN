      最后，我们可以接受 VD 与 VR，但否认我们对可观察量 *f*(*Q*) 的构造是无歧义的。这样，尽管 f(Q) 与 g(P) 在数学上同一，我们可以假定它们对应不同的可观察量，理由是：*v*(*f*(*Q*)) 的实际确定必须经由测量 *Q* 进行，而 *v*(*g*(*P*)) 的确定涉及测量与 *Q* 不相容的 *P*。由于 *v*(*f*(*Q*)) 与 *v*(*g*(*P*)) 因而是不同测量情形的结果，没有理由假定 *v*(*f*(*Q*)) = *v*(*g*(*P*))。这一阻断 KS 证明的方式，是把 f(Q) 与 g(P) 理解为不同的可观察量（因为对语境的敏感），因此等于拒绝 NC。在文献中，主要有两种方式进一步推动这一步。相应地，有两种重要的语境性要讨论——因果的与存在论的语境性。
