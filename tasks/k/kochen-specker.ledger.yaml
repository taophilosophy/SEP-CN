    kind: body
    source: |-
      Finally, it seems plausible to assume that probabilities vary continuously as we change directions in R₃, so small imperfections of selection of observables that block the argument (but only for measured values!) in the single case will wash out in the long run (see Mermin 1999, in Other Internet Resources). This in itself does not constitute an argument, since in the colourable sets of observables in MKC’s constructions probabilities also vary (in a sense) continuously.[^note-17] We might, however, exploit Mermin’s reasoning in the following way. Reconsider Clifton’s set of eight directions (in Figure 3) leading to a colouring constraint for the outermost points which statistically contradicts the QM statistics by a fraction of 1/17. Using Clifton and Kent’s colourable set of directions D_{CK} we are unable to derive the constraint for the eight points, since these eight points do not lie in D_{CK}; namely, as we move, in the colourable subset, from one mutually orthogonal triple of rays to the next, we never hit upon exactly the same ray again, but only on one approximating it arbitrarily closely. Assume a set S of systems wherein observables, corresponding to members of D_{CK} and approximating the eight directions in Fig. 3 arbitrarily closely, all have values — in accordance with the HV premise. Then we *can* derive Clifton’s constraint for the outermost points in the following sense. Consider the subset *S*′ ⊂ *S* of systems where any direction approximating point (1, 1, 1) gets value 1 (or colour white). In order to meet the predictions of QM, in *S*′ all directions approximating (1, 0, −1) and (1, −1, 0) must receive values such that the probability of value 0 (or colour black) is extremely close to 1. Analogously, in another subset *S*″ ⊂ *S* of systems with directions approximating (−1, 1, 1) as having value 1 (colour white) all directions approximating (1, 0, 1) and (1, 1, 0) must receive values such that the probability of value 0 (colour black) is extremely close to 1. Consider now members of *S*′ ∩ *S*″. In any of them there will be, for any approximation to (1, 0, −1) with value 0 (colour black), an exactly orthogonal point that approximates (1, 0, 1) and also has value 0 (colour black) such that there is a third orthogonal point approximating (0, 1, 0) and having value 1 (colour white). Likewise for (0, 0, 1). But (0, 1, 0) and (0, 0, 1) are orthogonal, and for all members of *S*′ ∩ *S*″ the directions *approximating* them both have value 1 (colour white), while QM predicts that the probability for values 1 for the *approximated* directions values is 0. In order to ensure that this prediction is met, *S*′ ∩ *S*″ must be an extremely small subset of *S*, which is to say that the probability for both (1, 1, 1) and (−1, 1, 1) (the leftmost and rightmost points in fig. 3) must be close to 0 and approximate 0 better and better as *S* grows. QM, on the contrary, predicts a probability of 1/17. (Recall also that this number can be pushed up to 1/3 by choosing a set of 13 directions!)
    step1: |-
      最后，假定概率随我们在 R₃ 中改变方向而连续变化似乎是有道理的；因此，在单一情形中阻碍论证的可观察量选择的小缺陷（但只对被测的值！）会在长期中消解（见 Mermin 1999，载其他网络资源）。这本身不构成论证，因为在 MKC 构造的可着色可观察量集合中，概率也（在一种意义上）连续变化。[^note-17] 不过我们可以按如下方式利用梅明的推理。重新考虑 Clifton 的八方向集合（图 3），它导向一个对最外点的着色约束，与 QM 统计以 1/17 的比例统计性地矛盾。使用 Clifton 与 Kent 的可着色方向集合 D_{CK}，我们无法为这八个点导出约束，因为这八点不在 D_{CK} 中；即当我们在可着色子集中从一个互相正交的射线三元组走到下一个时，我们绝不会恰好碰到同一射线，只会碰到任意接近它的射线。假定一个系统集合 S，其中对应于 D_{CK} 的成员、逼近图 3 的八方向到任意接近的可观察量都有值——符合 HV 前提。那么我们*可以*在如下涵义上为最外点导出 Clifton 的约束。考虑系统子集 *S*′ ⊂ *S*：其中任何逼近点 (1, 1, 1) 的方向都得到值 1（或白色）。为满足 QM 的预测，*S*′ 中所有逼近 (1, 0, −1) 与 (1, −1, 0) 的方向必须得到使值 0（或黑色）的概率极接近 1 的值。类似地，在另一个以逼近 (−1, 1, 1) 的方向有值 1（白色）的系统子集 *S*″ ⊂ *S* 中，所有逼近 (1, 0, 1) 与 (1, 1, 0) 的方向必须得到使值 0（黑色）的概率极接近 1 的值。考虑 *S*′ ∩ *S*″ 的成员。在其中任何一个中，对任何以值 0（黑色）逼近 (1, 0, −1) 的方向，都会有一个恰好正交的点逼近 (1, 0, 1) 且也有值 0（黑色），使得有第三个正交点逼近 (0, 1, 0) 且有值 1（白色）。对 (0, 0, 1) 亦然。但 (0, 1, 0) 与 (0, 0, 1) 是正交的，且对 *S*′ ∩ *S*″ 的所有成员，*逼近*它们的方向都有值 1（白色），而 QM 预测*被逼近*方向的值为 1 的概率是 0。为确保满足这一预测，*S*′ ∩ *S*″ 必须是 *S* 的极小子集——也就是说，(1, 1, 1) 与 (−1, 1, 1)（图 3 最左与最右的点）两者的概率必须接近 0，并随 *S* 的增大而越来越好地逼近 0。QM 相反预测概率为 1/17。（还回想：通过选择 13 个方向的集合，这个数字可以推高到 1/3！）
    step2: |-
      最后假定概率随我们在 R₃ 中改变方向而连续变化似乎有道理：因此单一情形中阻碍论证的可观察量选择的小缺陷（但只对被测的值！）会在长期消解（见 Mermin 1999，载其他网络资源）。这本身不构成论证——因为在 MKC 构造的可着色可观察量集合中，概率也（在一种意义上）连续变化。[^note-17] 不过可按如下方式利用梅明的推理。重新考虑 Clifton 的八方向集合（图 3）——它导向对最外点的着色约束，与 QM 统计以 1/17 的比例统计矛盾。使用 Clifton 与 Kent 的可着色方向集合 D_{CK}，无法为这八点导出约束（八点不在 D_{CK} 中）：在可着色子集中从一个互相正交的射线三元组走到下一个时，绝不会恰好碰到同一射线，只会碰到任意逼近它的射线。假定系统集合 S：其中对应 D_{CK} 成员、逼近图 3 八方向到任意接近的可观察量都有值（符合 HV 前提）。那么我们*可以*在如下涵义为最外点导出 Clifton 的约束：考虑系统子集 *S*′ ⊂ *S*——任何逼近点 (1, 1, 1) 的方向都得到值 1（白色）。为满足 QM 的预测，*S*′ 中所有逼近 (1, 0, −1) 与 (1, −1, 0) 的方向必须得到使值 0（黑色）概率极接近 1 的值；类似地，在另一个以逼近 (−1, 1, 1) 的方向有值 1（白色）的子集 *S*″ ⊂ *S* 中，所有逼近 (1, 0, 1) 与 (1, 1, 0) 的方向必须得到使值 0（黑色）概率极接近 1 的值。考虑 *S*′ ∩ *S*″ 的成员：其中任何一个，对任何以值 0（黑色）逼近 (1, 0, −1) 的方向，都会有一个恰好正交的点逼近 (1, 0, 1) 且也有值 0（黑色），使得有第三个正交点逼近 (0, 1, 0) 且有值 1（白色）；对 (0, 0, 1) 亦然。但 (0, 1, 0) 与 (0, 0, 1) 正交，且对 *S*′ ∩ *S*″ 的所有成员，*逼近*它们的方向都有值 1（白色），而 QM 预测*被逼近*方向的值为 1 的概率是 0。为确保满足这一预测，*S*′ ∩ *S*″ 必须是 *S* 的极小子集——即 (1, 1, 1) 与 (−1, 1, 1)（图 3 最左与最右的点）的概率必须接近 0，并随 *S* 增大越来越好地逼近 0；QM 相反预测概率 1/17（还回想：选 13 个方向的集合，这个数字可推高到 1/3！）
