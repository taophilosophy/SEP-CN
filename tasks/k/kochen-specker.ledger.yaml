      (Note that for Bohmian Mechanics often viewed as an HV interpretation of QM, this statement would have to be qualified.) [^note-1] VD is motivated by an apparently innocuous assumption about experimental results, which is reflected in the custom of referring to quantum experiments as "measurements," namely, that these experiments reveal vales that exist independently of being measured. (Note that we do not need to assume here that the values are faithfully revealed by measurement, but only that they exist!) This suggest a second, seemingly innocuous assumption, that of *noncontextuality*:
    step1: |-
      （注意：对常被视为 QM 的 HV 解释的玻姆力学，这一陈述须加以限定。）[^note-1] VD 的动机是一个关于实验结果的、表面上无害的假定——它反映在把量子实验称为“测量”的习惯中：这些实验揭示的是独立于被测量而存在的值。（注意：我们在此不需要假定这些值被测量忠实地揭示，只需假定它们存在！）这提示了第二个、表面上同样无害的假定，即*非语境性*：
    step2: |-
