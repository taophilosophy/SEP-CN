      > Let H be a Hilbert space of QM state vectors of dimension *x* ≥ 3. There is a set *M* of observables on H, containing *y* elements, such that the following two assumptions are contradictory:
      >
      > (KS1) All *y* members of *M* simultaneously have values, i.e. are unambiguously mapped onto real numbers (designated, for observables *A*, *B*, *C*, …, by *v*(*A*), *v*(*B*), *v*(*C*), …).
      >
      > (KS2) Values of all observables in M conform to the following constraints:
      >
      > > (a) If *A*, *B*, *C* are all compatible and *C* = *A*+*B*, then *v*(*C*) = *v*(*A*)+*v*(*B*);
      > >
      > > (b) if *A*, *B*, *C* are all compatible and *C* = *A*·*B*, then *v*(*C*) = *v*(*A*)·*v*(*B*).
    step1: |-
      > 设 H 是维度 *x* ≥ 3 的 QM 态矢量希尔伯特空间。存在 H 上的可观察量集合 *M*，含 *y* 个元素，使得以下两个假设相矛盾：
      >
      > (KS1) *M* 的全部 *y* 个成员同时有值，即无歧义地被映到实数（对可观察量 *A*、*B*、*C*……记为 *v*(*A*)、*v*(*B*)、*v*(*C*)……）。
      >
      > (KS2) M 中所有可观察量的值满足以下约束：
      >
      > > (a) 若 *A*、*B*、*C* 全部相容且 *C* = *A*+*B*，则 *v*(*C*) = *v*(*A*)+*v*(*B*)；
      > >
      > > (b) 若 *A*、*B*、*C* 全部相容且 *C* = *A*·*B*，则 *v*(*C*) = *v*(*A*)·*v*(*B*)。
