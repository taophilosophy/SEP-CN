      (1) Obviously, we can unambiguously specify any ray in R₃ through the origin by just giving one point contained in it. KS thus identify rays with points on the unit sphere E. KS do not need to refer to concrete coordinates of a certain point, since their argument is ‘coordinate-free’. We will, however, for illustration sometimes mention concrete points and then (a) use Cartesian coordinates to check orthogonality relations and (b) specify rays by points not lying on E. (Thus, e.g., the triple of points (0, 0, 1), (4, 1, 0), (1, –4, 0) is used to specify a triple of orthogonal rays.) Both usages conform with the recent literature (see e.g. Peres (1991) and Clifton (1993)).
    step1: |-
      (1) 显然，我们只需给出包含于其中的一点，就能无歧义地规定 R₃ 中过原点的任意射线。KS 因此把射线与单位球 E 上的点等同起来。KS 不需要引用某个点的具体坐标，因为他们的论证是“无坐标的”。不过为了说明，我们有时会提到具体的点，然后（a）用笛卡尔坐标检查正交性关系，（b）用不在 E 上的点规定射线。（例如，三元点 (0, 0, 1), (4, 1, 0), (1, –4, 0) 被用来规定一个正交射线三元组。）两种用法都符合近来的文献（见例如 Peres (1991) 与 Clifton (1993)）。
    step2: |-
      (1) 显然，只需给出包含于其中的一点，就能无歧义地规定 R₃ 中过原点的任意射线。KS 因此把射线与单位球 E 上的点等同。KS 不需引用某点的具体坐标，因为其论证是“无坐标的”。不过为说明，我们有时提到具体的点，然后（a）用笛卡尔坐标检查正交性关系，（b）用不在 E 上的点规定射线（例如三元点 (0, 0, 1), (4, 1, 0), (1, –4, 0) 被用来规定一个正交射线三元组）。两种用法都符合近来文献（见例如 Peres (1991) 与 Clifton (1993)）。
