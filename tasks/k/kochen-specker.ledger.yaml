      [^note-13]: It is not exactly true that the QM formalism prescribes *any* observable to have a value. In fact, the formalism itself is entirely silent about values, apart from the statistical predictions it entails via the statistical algorithm (see Redhead 1987: 8)[^redhead-1987]. But a crucial assumption of orthodox interpretations is the eigenstate-eigenvalue link (see Fine 1973: 20)[^fine-1973]: Observable *A* on a system has value a_{*k*} iff the system is in state |a_{*k*}>. The only if direction of this principle which leads to a minimum of value ascriptions is endorsed in van Fraassen’s original version of the modal interpretation (this direction is equivalent to the Eigenvector Rule in Redhead 1987: 73, 120)[^redhead-1987] while it denies the if direction, which prevents that more than a minimum of values are ascribed to a system.
    step1: |-
      [^note-13]: 说 QM 形式主义规定*任何*可观察量有值并不完全正确。事实上，形式主义本身对值完全沉默，除了它经统计算法蕴涵的统计预测（见 Redhead 1987: 8）[^redhead-1987]。但正统解释的一个关键假定是本征态-本征值联结（见 Fine 1973: 20）[^fine-1973]：系统上的可观察量 *A* 有值 a_{*k*}，当且仅当系统处于态 |a_{*k*}>。模态解释的范弗拉森原始版本赞同这一原则的“仅当”方向——它导向最小限度的值归属（这一方向等价于 Redhead 1987: 73, 120 的本征矢规则）[^redhead-1987]——而否认“当”方向，后者防止把多于最小限度的值归属给系统。
    step2: |-
      [^note-13]: 说 QM 形式主义规定*任何*可观察量有值并不完全正确：事实上形式主义本身对值完全沉默（除了它经统计算法蕴涵的统计预测，见 Redhead 1987: 8）[^redhead-1987]。但正统解释的关键假定是本征态-本征值联结（见 Fine 1973: 20）[^fine-1973]：系统上的可观察量 *A* 有值 a_{*k*}，当且仅当系统处于态 |a_{*k*}>。模态解释的范弗拉森原始版本赞同这一原则的“仅当”方向（导向最小限度的值归属；这一方向等价于 Redhead 1987: 73, 120 的本征矢规则）[^redhead-1987]，而否认“当”方向——后者防止把多于最小限度的值归属给系统。
