      其次，NC 的失败可以两种方式理解：要么可观察量的值可能是语境依赖的（虽可观察量本身不是）；要么可观察量的值语境依赖，因为可观察量本身如此。无论哪种情形，可观察量对语境的独立性都蕴涵可观察量与算符之间有对应关系——这一 NC 的推论正是稍后 FUNC 推导中将要使用的。我们确实将假定：若 NC 成立，这意味着*可观察量*——*从而*其值——独立于测量语境（即独立于如何被测量）。特别地，可观察量对语境的独立性蕴涵可观察量与算符间存在 1:1 对应；这一推论正是稍后 FUNC 推导中将要使用的。*反过来*，NC 的失败将被仅仅解释为 1:1 对应的失败。
