    source: |-
      Cabello (2002), using a very similar reasoning, has shown that the MKC models lead to predictions that testably differ from the ones of QM. For D_{CK}, he effectively uses the strategy sketched above: QM gives probabilities for directions in the Clifton-Kent set which their model must match in order to reproduce QM predictions. As these directions are arbitrarily close to directions from a KS-uncolourable set (or directions leading to Clifton’s constraint), this leads to restrictions for these nearby points that are measurably violated by the QM predictions. For Meyer’s D_{M} Cabello’s case is even stronger. He explicitly presents a set of nine *rational* vectors leading to predictions different from QM (for three of these directions). Hence, the Meyer argument is effectively rebutted (without recourse to Mermin’s requirement): Even if there were only observables corresponding to the rational directions in R₃ (which in itself is an implausible assumption) a theory assuming that they all have noncontextual values faithfully revealed by measurement will be measurably at variance with QM. Assume now that the Cabello directions were tested and the QM predictions reliably confirmed, then this would (modulo the reliability of the tests) constitute a proof that Nature is contextual.
    step1: |-
      Cabello（2002）用非常类似的推理表明：MKC 模型导致与 QM 可检验地不同的预测。对 D_{CK}，他实际使用上面勾勒的策略：QM 给出 Clifton-Kent 集合中方向的概率，其模型必须匹配这些概率才能复制 QM 的预测。由于这些方向任意接近 KS 不可着色集合中的方向（或导向 Clifton 约束的方向），这对邻近的点导出的限制被 QM 的预测可测地违反。对 Meyer 的 D_{M}，Cabello 的论证更强。他明确给出九个*有理*矢量的集合，导向与 QM 不同的预测（对其中三个方向）。因此 Meyer 论证被有效地反驳（不诉诸梅明的要求）：即使只有对应 R₃ 中有理方向的可观察量（这本身就是一个难以置信的假定），一个假定它们全都有被测量忠实揭示的非语境值的理论，也将与 QM 可测地不一致。现在假定 Cabello 方向被检验、QM 预测被可靠地确认，那么这将（在检验可靠性的限度内）构成自然ness 是语境性的证明。
    step2: |-
      Cabello（2002）用非常类似的推理表明：MKC 模型导致与 QM 可检验地不同的预测。对 D_{CK}，他实际使用上面勾勒的策略：QM 给出 Clifton-Kent 集合中方向的概率，其模型须匹配这些概率才能复制 QM 的预测；由于这些方向任意接近 KS 不可着色集合中的方向（或导向 Clifton 约束的方向），这对邻近点导出的限制被 QM 的预测可测地违反。对 Meyer 的 D_{M}，Cabello 的论证更强：他明确给出九个*有理*矢量的集合，导向与 QM 不同的预测（对其中三个方向）——Meyer 论证被有效反驳（不诉诸梅明的要求）：即使只有对应 R₃ 中有理方向的可观察量（这本身难以置信），一个假定它们全都有被测量忠实揭示的非语境值的理论，也将与 QM 可测地不一致。现在假定 Cabello 方向被检验、QM 预测被可靠确认，这将（在检验可靠性的限度内）构成自然ness 是语境性的证明。
