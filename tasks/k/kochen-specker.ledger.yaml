      However, the choice of a specific O that selects observables *Sₓ*², *S_{y}*², *S_{z}*² at the same time selects three orthogonal rays in physical space, namely by fixing a coordinate system ±*x*, ±*y*, ±*z* (which defines along which orthogonal rays the squared spin components are to be measured) *in physical space*. So now, by choice of an observable O, there *is* a direct connection of directions in space with directions in H₃: orthogonality in H₃ now *does* correspond to orthogonality in physical space. The same holds for R₃, if, in order to give an argument for H₃, we consider R₃. Orthogonality in R₃ now corresponds to orthogonality in physical space. It is important to notice that this correspondence is not necessary to give the argument, even if we insist that the pure mathematical facts should be supplemented by a physical interpretation — since we have, just before, seen an example without any correspondence. The point is only that we *can* devise an example such that there is a correspondence. In particular, we can now follow the proof in R₃ and all along imagine a system sitting in physical space, namely a spin-1 particle, returning three values upon measurement of three physical magnitudes, associated directly with orthogonal directions in physical space, namely *v*(*Sₓ*²), *v*(*S_{y}*²), *v*(*S_{z}*²), for arbitrary choices of *x*, *y*, *z*. The KS proof then shows that it is impossible (given its premises, of course) to assign to the spin-1 particle values for all these arbitrary choices. That is, the KS argument shows that (given the premises) a spin 1 particle cannot possess all the properties at once which it displays in different measurement arrangements.
    step1: |-
      然而，选择一个具体的 O——它选择可观察量 *Sₓ*²、*S_{y}*²、*S_{z}*²——同时选择物理空间中的三条正交射线：即通过固定坐标系 ±*x*、±*y*、±*z*（它规定沿哪些正交射线测量自旋分量的平方）*在物理空间中*。于是现在，通过选择可观察量 O，空间中的方向与 H₃ 中的方向之间*确实*存在直接联系：H₃ 中的正交性现在*确实*对应于物理空间中的正交性。对 R₃ 亦然——如果为给 H₃ 提供论证而考虑 R₃。R₃ 中的正交性现在对应于物理空间中的正交性。重要的是要注意：这一对应并非给出论证所必需——即使我们坚持纯数学的事实应由物理诠释来补充——因为我们刚才刚刚看到了一个没有任何对应的例子。要点只是：我们*能够*设计一个有对应的例子。特别地，我们现在可以跟随 R₃ 中的证明，同时想象一个坐落于物理空间中的系统——自旋-1 粒子——在测量三个物理量时返回三个值，这些量直接与物理空间中的正交方向相联，即对任意选择的 *x*、*y*、*z* 而言的 *v*(*Sₓ*²)、*v*(*S_{y}*²)、*v*(*S_{z}*²)。KS 证明然后表明：把这些值赋给自旋-1 粒子的一切任意选择是不可能的（当然，给定其前提）。也就是说，KS 论证表明（给定前提）：自旋 1 粒子不能同时拥有它在不同测量装置中显示的所有性质。
    step2: |-
      然而选择具体的 O——它选择可观察量 *Sₓ*²、*S_{y}*²、*S_{z}*²——同时选择物理空间中的三条正交射线：即固定坐标系 ±*x*、±*y*、±*z*（规定沿哪些正交射线测量自旋分量的平方）*在物理空间中*。于是现在，通过选择可观察量 O，空间中的方向与 H₃ 中的方向之间*确实*有直接联系：H₃ 中的正交性现在*确实*对应物理空间中的正交性。对 R₃ 亦然（若为给 H₃ 提供论证而考虑 R₃）：R₃ 中的正交性现在对应物理空间中的正交性。重要的是注意：这一对应并非给出论证所必需——即使坚持纯数学事实应由物理诠释补充——因为刚才刚看到一个没有任何对应的例子。要点只是：我们*能*设计一个有对应的例子。特别地，现在可以跟随 R₃ 中的证明，同时想象一个坐落于物理空间中的系统——自旋-1 粒子——在测量三个物理量时返回三个值，这些量直接与物理空间中的正交方向相联：对任意选择的 *x*、*y*、*z* 而言的 *v*(*Sₓ*²)、*v*(*S_{y}*²)、*v*(*S_{z}*²)。KS 证明然后表明：把这些值赋给自旋-1 粒子的一切任意选择不可能（当然给定其前提）。即 KS 论证表明（给定前提）：自旋 1 粒子不能同时拥有它在不同测量装置中显示的所有性质。
