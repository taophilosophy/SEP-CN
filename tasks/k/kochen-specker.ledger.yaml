      > |*S*_{*x*}=0> = cos φ (1 + sin² φ) ^{−½} |*S*_{*x*′} = 0> + sin φ (1 + sin² φ) ^{−½} (|*S*_{*x*′} = −1> − |*S*_{*x*′} = +1>)

      Now, with cos φ=1/3, we get:

      > | prob(*v*(*S*_{*x*′}²) = 0) | = | prob(*v*(*S*_{*x*′}) = 0) |
