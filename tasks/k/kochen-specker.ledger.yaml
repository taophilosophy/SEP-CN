      #### Causal Contextuality
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      A property (value of an observable) might be *causally* context-dependent in the sense that it is causally sensitive to how it is measured. The basic idea is that the observed value comes about as the effect of the system-apparatus interaction. Hence, measuring a system via interaction with a *P*-measuring apparatus might yield a value *v*(*g*(*P*)), measuring the same system via interaction with a *Q*-measuring apparatus a different value *v*(*f*(*Q*)), although both observables are represented by the same operator f(Q) = g(P). The difference in values is explained in terms of a context-dependence of the observables: The latter are context-dependent, since the different ways to physically realize them causally influence the system in different ways and thereby change the observed values.
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      If an interpreter wanted to defend causal contextuality, this would entail abandoning FM, at least for observables of the type *f*(*Q*) (non-maximal observables): Since their values causally depend on the presence of certain measurement arrangements, these arrangements are causally necessary for the values to come about, thus the values cannot be present before the system-apparatus interaction, and FM is violated. As an advantage of causal contextualism the following might be pointed out. It does not imply that the ontological status of the physical properties involved must change, i.e. does not imply that they become relational. If the property in an object is brought about via interaction with another one, it can still be one which the object has for itself after the interaction. However, the idea of causal contextuality is sometimes discussed critically, since there is reason to think that it may be empirically inadequate (see Shimony 1984, Stairs 1992)[^shimony-1984][^stairs-1992].
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      #### Ontological Contextuality
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      A property (value of an observable) might be *ontologically* context-dependent in the sense that in order for it to be well-defined the specification of the observable it ‘comes from’ is necessary. Thus, in order to construct a well-defined observable from operator f(Q) = g(P), we need to know whether it is physically realized via observable *P* or observable *Q*. This way out of the KS problem, was first noted (but not advocated) by van Fraassen (1973). There are, then, as many observables and kinds of physical properties for an operator f(Q) as there are ways to construct f(Q) from maximal operators. Without further explanation, however, this idea just amounts to an *ad hoc* proliferation of physical magnitudes. A defender of ontological contextuality certainly owes us a more explicit story about the dependence of observable *f*(*Q*) on observable *Q*. Two possibilities come to mind:
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      (a) We might think that *v*(*f*(*Q*)) just is not a self-sustained physical property, but one which ontologically depends on the presence of another property *v*(*Q*). (Recall that in the proof of FUNC *v*(*f*(*Q*)) *is* constructed from *v*(*Q*).) But, since the position does not reject questions about values of *f*(*Q*) in a *P*-measurement situation as illegitimate (because it does not trade on a notion of an observable being well-defined in one context only!), this seems to lead to new and pressing questions, to say the least. As an attempt to defend a contextualist *hidden variables* interpretation, this position must concede that not only does the system have, in the *Q*-measurement situation, a value *v*(*Q*), but also, in a *P*-measurement situation, it has a value *v*′(*Q*), although perhaps *v*′(*Q*) ≠ *v*(*Q*). Now, questions for values of *f*(*Q*) in this situation at least are legitimate. Does *v*′(*Q*) imply another *v*′(*f*(*Q*)) ≠ *v*(*f*(*Q*))? Or does *v*′(*Q*), in opposition to *v*(*Q*), not lead to a value of *f*(*Q*), at all? Neither option seems plausible, for could we not, just by switching for a certain prepared system between a *P*- and *Q*-measurement situation either switch *v*(*f*(*Q*)) in and out of existence or switch between *v*(*f*(*Q*)) and *v*′(*f*(*Q*))? (b) We might think that, in order for *f*(*Q*) to be well-defined, one measurement arrangement rather than the other is necessary. The idea is strongly reminiscent of Bohr’s 1935 argument against EPR, and indeed may be viewed as the appropriate extension of Bohr’s views on QM to the modern HV discussion (see Held 1998, ch.7)[^held-1998]. In this version of ontological contextualism the property *v*(*f*(*Q*)), rather than depending on the presence of another property *v*(*Q*), is dependent on the presence of a *Q*-measuring apparatus. This amounts to a holistic position: For some properties it only makes sense to speak of them as pertaining to the system, if that system is part of a certain system-apparatus whole. Here, the question for values of *f*(*Q*) in a P-measurement situation *does* become illegitimate, since *f*(*Q*)’s being well-defined is tied to a *Q*-measurement situation. But again further clarification is required. Does the position hold that, in opposition to *f*(*Q*), *Q* itself is well-defined in a *P*-measurement situation? If it does not, *Q* can hardly have a value (since not being well-defined was the reason to deny *f*(*Q*) a value), which means that we are not considering an HV interpretation of the given type any longer, and that there is no need to block the KS argument at all. If it does, what explains that, in the *P*-measurement situation, *Q* remains well-defined, but *f*(*Q*) loses this status?
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      What becomes of FM in both versions of ontological contextualism? Well, if we remain agnostic about how the position could be made plausible, we can save FM, while, if we choose version (a) or (b) to make it plausible, we lose it. Consider first an agnostic denial of NC. FM says that every QM *observable* is faithfully measured. Now, contextualism splits an operator which can be constructed from two different noncommuting operators into two observables, and ontological contextualism does not try to give us a causal story which would ruin the causal independence of the measured value from the measurement interaction embodied in FM. We simply introduce a more fine-grained conception of observables, but can still impose FM for these new contextual observables.
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      However, the concrete versions of ontological contextualism, by attempting to motivate the contextual feature, ruin FM. Version (a) allows *f*(*Q*) to be switched ‘on and off’ or to switch between different values upon the change between *P*- and *Q*-measurement situations — which is a flagrant violation of FM. Version (b) fares no better. It introduces the ontological dependence on the measuring arrangement. It is hard to see what else this should be, but the same causal dependence pushed to a higher, ‘ontological’ key. Again, could we not, just by flipping back and forth the measurement arrangement, change back and forth whether *f*(*Q*) is well-defined, thus flip *v*(*f*(*Q*)) in and out of existence?
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      Finally, we note that both types of ontological contextualism, in opposition to the causal version, *do* entail that system properties which we earlier thought to be intrinsic become relational in the sense that a system can only have these properties either if it has certain others, or if it is related to a certain measurement arrangement.
    step1: TBD
    step2: TBD
