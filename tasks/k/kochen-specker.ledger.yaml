  - id: 111
    kind: body
    source: |-
      Famously, the violation of Bell’s inequalities, prescribed by QM, has been confirmed experimentally. Is something similar possible for the KS theorem? We should distinguish three questions: (1) Is it possible to realize the experiment proposed by KS as a motivation of their theorem? (2) Is it possible to test the principles leading to the theorem: the Sum Rule and Product Rule, FUNC, or NC? (3) Is it possible to test the theorem itself?
    step1: |-
      著名的是，QM 所规定的对贝尔不等式的违反已被实验证实。对 KS 定理是否可能有类似之事？我们应区分三个问题：(1) 是否可能实现 KS 作为其定理的动机而提出的实验？(2) 是否可能检验导向该定理的原则：和规则与积规则、FUNC、或 NC？(3) 是否可能检验定理本身？
    step2: |-
      著名的是：QM 所规定的对贝尔不等式的违反已被实验证实。对 KS 定理是否可能有类似之事？应区分三个问题：(1) 是否可能实现 KS 作为定理动机而提出的实验？(2) 是否可能检验导向该定理的原则：和规则与积规则、FUNC、或 NC？(3) 是否可能检验定理本身？
  - id: 112
    kind: body
    source: |-
      (1) KS themselves describe a concrete experimental arrangement to measure *S*_{*x*}², *S*_{*y*}², *S*_{*z*}² on a one-particle spin-1 system as functions of one maximal observable. An orthohelium atom in the lowest triplet state is placed in a small electric field E of rhombic symmetry. The three observables in question then can be measured as functions of one single observable, the perturbation Hamiltonian Hₛ. Hₛ, by the geometry of E, has three distinct possible values, measurement of which reveals which two of *S*_{*x*}², *S*_{*y*}², *S*_{*z*}² have value 1 and which one has value 0 (see Kochen and Specker 1967: 72/311)[^kochen-1967]. This is, of course, a proposal to realize an experiment exemplifying our above value constraint (VC2). Could we also realize a (VC1) experiment, i.e. measure a set of commuting projectors projecting on eigenstates of one maximal observable? Peres (1995: 200) answers the question in the affirmative, discusses such an experiment, and refers to Swift and Wright (1980) for details about the technical feasibility. Kochen and Specker’s experimental proposal has, however, not been further pursued, because it does not provide a direct test of NC. Obviously, a measurement of H_{S} measures one orthogonal triple only. An HV proponent might well assume that the hidden state changes from one measurement of H_{S} to the next (even if we prepare the same QM state again) and thus maintain NC.
    step1: |-
      (1) KS 本人描述了一个具体的实验装置，用以在单粒子自旋-1 系统上测量 *S*_{*x*}²、*S*_{*y*}²、*S*_{*z*}²，作为某个极大可观察量的函数。一个处于最低三重态的正氦原子被置于具有菱形对称的小电场 E 中。所论的三个可观察量于是可以作为单个可观察量——微扰哈密顿量 Hₛ——的函数被测量。由 E 的几何，Hₛ 有三个不同的可能值；对它们的测量揭示 *S*_{*x*}²、*S*_{*y*}²、*S*_{*z*}² 中哪两个的值为 1、哪一个的值为 0（见 Kochen and Specker 1967: 72/311）[^kochen-1967]。这当然是一个实现我们上述值约束 (VC2) 的实验的提案。我们能否也实现一个 (VC1) 实验，即测量一个投射到某极大可观察量的本征态上的交换投影算符集合？Peres（1995: 200）对这一问题给出肯定回答，讨论了这样一个实验，并就技术可行性参见 Swift and Wright（1980）。然而 Kochen 与 Specker 的实验提案没有被进一步追寻，因为它不提供对 NC 的直接检验。显然，对 H_{S} 的一次测量只测量一个正交三元组。HV 的拥护者很可能假定隐态从对 H_{S} 的一次测量到下一次会改变（即使我们重新制备同一 QM 态），从而坚持 NC。
