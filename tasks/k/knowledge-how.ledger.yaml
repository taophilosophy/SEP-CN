      This response might be less plausible, though, when it comes to lower animals, or insects. Here too, we might describe ants as knowing how to carry food back to their nest. And yet, there is less evidence from cognitive science that insects are capable of concepts too (though see Gallistel & King 2009)[^gallistel-2009]. In response, a different line of argument might be more promising (cf. McDowell 2007)[^mcdowell-2007]: it does not follow from the fact that we are disposed to ascribe knowledge-how to lower animals that what explains their goal-directed behavior is the same sort of psychological state that underlies human knowledge-how and human action. For from the fact that their behavior resembles humans’ in some respects (for example, in its goal-directedness) does not entail that it resembles humans’ skilled behavior in *all respects that matter* (for example, in the susceptibility of the relevant behavior to rational revision).
