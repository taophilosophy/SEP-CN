      Knowledge-how is related to but distinct from *practical knowledge* (Anscombe 1957)[^anscombe-1957]. Practical knowledge is occurrent during intentional action: when one intentionally acts, one knows what one is doing while knowing it. While being capable of practical knowledge might require knowledge-how, knowing how to perform an action does not entail performing that action, and so does not entail practical knowledge (Setiya 2008; Schwenkler 2019; Small 2020)[^schwenkler-2019][^setiya-2008][^small-2020]. Some have argued knowledge-how is the norm of intention (Habgood-Coote 2018b)[^habgood-coote-2018b], so that one can properly intend to perform an act only if one knows how to perform it.
    step1: |-
      知识-如何与*实践知识*相关而有别（Anscombe 1957）[^anscombe-1957]。实践知识在有意行动中当下发生：当人有意行动时，他在知道自己在做什么的同时知道它。具备实践知识的能力虽然可能要求知识-如何，但知道如何执行一个行动并不蕴涵执行该行动，因而也不蕴涵实践知识（Setiya 2008；Schwenkler 2019；Small 2020）[^schwenkler-2019][^setiya-2008][^small-2020]。有人主张，知识-如何是意向的规范（Habgood-Coote 2018b）[^habgood-coote-2018b]：因此，人唯有知道如何执行一个行动，才能正当地意向去执行它。
    step2: |-
      知识-如何与 **实践知识** 相关而有别（Anscombe 1957）[^anscombe-1957]。实践知识在有意行动中当下发生：当人有意行动时，他在知道自己在做什么的同时知道它。具备实践知识的能力虽然可能要求知识-如何，但知道如何执行一个行动并不蕴涵执行该行动，因而也不蕴涵实践知识（Setiya 2008；Schwenkler 2019；Small 2020）[^schwenkler-2019][^setiya-2008][^small-2020]。有人主张：知识-如何是意向的规范（Habgood-Coote 2018b）[^habgood-coote-2018b]——因此，人唯有知道如何执行一个行动，才能正当地意向去执行它。
