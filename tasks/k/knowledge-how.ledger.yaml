      Susie has the ability to annoy Joe, since she has the disposition to annoy Joe whenever she attempts to do so. But, intuitively, she does not know how to annoy him. A natural explanation of this is that she cannot annoy him *intentionally* (for structurally similar cases, see Carr 1979, 1981 and Bengson, Moffett, & Wright 2009)[^carr-1979]. Pretty much all sides of the dispute agree on the following claim (Ryle 1949; Stanley & Williamson 2001; Hawley 2003; Hornsby 2004, 2011; Stanley 2011b; Setiya 2012)[^hawley-2003][^hornsby-2004][^ryle-1949][^setiya-2012][^stanley-2011b][^stanley-2001]:
    step1: |-
      苏西有惹恼乔的能力，因为她有“每次尝试便能惹恼乔”的倾向。但直觉上，她并不知道如何惹恼他。对此的一个自然解释是：她不能**有意地**惹恼他（结构上类似的例子，见 Carr 1979, 1981 与 Bengson, Moffett, & Wright 2009）[^carr-1979]。争论的各方几乎都同意如下主张（Ryle 1949；Stanley & Williamson 2001；Hawley 2003；Hornsby 2004, 2011；Stanley 2011b；Setiya 2012）[^hawley-2003][^hornsby-2004][^ryle-1949][^setiya-2012][^stanley-2011b][^stanley-2001]：
    step2: |-
      苏西有惹恼乔的能力，因为她有“每次尝试便能惹恼乔”的倾向。但直觉上，她并不知道如何惹恼他。对此的一个自然解释是：她不能 **有意地** 惹恼他（结构上类似的例子，见 Carr 1979, 1981 与 Bengson, Moffett, & Wright 2009）[^carr-1979]。争论各方几乎都同意如下主张（Ryle 1949；Stanley & Williamson 2001；Hawley 2003；Hornsby 2004, 2011；Stanley 2011b；Setiya 2012）[^hawley-2003][^hornsby-2004][^ryle-1949][^setiya-2012][^stanley-2011b][^stanley-2001]：
