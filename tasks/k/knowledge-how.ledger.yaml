      What is the relation between knowledge-how and skill? For many tasks at least, it is intuitive that one cannot be skilled at it without knowing how to perform it. At first, it also seems as if knowledge-how entails skill: one does not really know how to swim if one does not have the skill to swim; and one cannot know how to tell apart birds without the skills of a bird watcher. One might object to the sufficiency of knowledge-how for skill on the grounds that it is natural to say things such as “John may know how to make risotto, but I would not say he is skilled at it”. However, knowing how to make risotto *sufficiently well* (relative to contextually determined standards) might entail being skilled at it (relative to the same standards) (Cath 2020)[^cath-2020].
    step1: |-
      知识-如何与技能之间是什么关系？至少对许多任务而言，直觉上，一个人若不知道如何完成它，就不能擅长它。起初，知识-如何似乎也蕴涵技能：若没有游泳的技能，人就不是真的知道如何游泳；若没有观鸟者的技能，人就不能知道如何辨别鸟类。有人可能以“约翰也许知道如何做意大利烩饭，但我不会说他擅长做它”这类说法之为自然，来反对“知识-如何足以构成技能”。然而，知道如何把意大利烩饭做得*足够好*（相对于语境所定的标准），也许就蕴涵着擅长做它（相对于同样的标准）（Cath 2020）[^cath-2020]。
