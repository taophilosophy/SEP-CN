      Some authors argue that while skills may be related to propositional knowledge, they do not reduce to it. Dickie (2012) suggests that an agent is skilled at Φ whenever her intentions to Φ are non-lucky selectors of non-lucky means to Φ; while, in turn, these means might manifest propositional knowledge. Some argue that control is necessary for skills, and control cannot fully be understood in terms of propositional knowledge (Fridland 2014, 2017a, 2017b)[^fridland-2014]. In order to provide a theory of skill that makes room for control, Fridland (2020) develops a “functional” account of skills. In this view, a skill is a function from intentions to action, implemented through certain “control structures”, which include attention and strategic control. Among these control structures, there is also propositional knowledge, which is required for strategic control. In contrast, intellectualists about skills argue that being in control is not intelligible unless it is understood in terms of knowing what one is doing in virtue of knowing how to perform that action. Therefore, they argue that agentive control itself is best understood in terms of the capacity for propositional knowledge.
    step1: |-
      一些作者主张，技能虽可能与命题知识相关，却不还原为命题知识。Dickie（2012）提出，当行动者关于 Φ 的意向是非幸运地选取非幸运的 Φ 手段时，她就擅长 Φ；而这些手段反过来可能展现命题知识。有人主张控制对技能是必要的，而控制不能完全用命题知识来理解（Fridland 2014, 2017a, 2017b）[^fridland-2014]。为了提供一种为控制留出空间的技能理论，Fridland（2020）发展出一种“功能式”技能说明。按此观点，技能是从意向到行动的一个函数，经由某些“控制结构”实现，其中包括注意与策略性控制。在这些控制结构之中也有命题知识，它是策略性控制所需要的。相反，关于技能的理智主义者主张：除非用“凭知道如何执行该行动而知道自己正在做什么”来理解，控制便不可理解。因此他们主张，行动者性的控制本身最好用命题知识的能力来理解。
