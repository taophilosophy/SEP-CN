      An important question is whether knowledge-how is connected to distinctive kinds of epistemic injustice (Fricker 2007; Dotson 2011; Collins 1990, 1998; Medina 2011)[^collins-1990][^dotson-2011][^fricker-2007][^medina-2011]. Hawley (2011) discusses the phenomena whereby people ascribe less knowledge-how and ability to female musicians (Goldin & Rouse 2000)[^goldin-2000] and whereby standards for judgments of success due to ability rather than luck or “instinct” tend to be higher for women and non-white men (Biernat & Kobrynowicz 1997)[^biernat-1997]. In these cases, agents may be transmitting knowledge by being direct sources of information, rather than by testifying to the truth of a proposition. If so, the harms that they suffer might call for a different account than standard cases of epistemic injustices like Fricker’s (2007), which focus on testimonial transmission of knowledge-that.
    step1: |-
      一个重要问题是：知识-如何是否与若干独特形态的知识论不义相关联（Fricker 2007；Dotson 2011；Collins 1990, 1998；Medina 2011）[^collins-1990][^dotson-2011][^fricker-2007][^medina-2011]。Hawley（2011）讨论了这样一些现象：人们归赋给女性音乐家较少的知识-如何与能力（Goldin & Rouse 2000）[^goldin-2000]；以及“因能力而非运气或‘本能’判定成功”的标准，对女性与非白人男性往往更高（Biernat & Kobrynowicz 1997）[^biernat-1997]。在这些情形中，行动者也许是通过作为直接的信息来源、而非通过证言某个命题之真来传递知识。若如此，她们所受的伤害也许需要一种不同于标准知识论不义（如 Fricker 2007）的说明——后者的焦点是命题知识的证言传递。
    step2: |-
      一个重要问题是：知识-如何是否与若干独特形态的知识论不义相关联（Fricker 2007；Dotson 2011；Collins 1990, 1998；Medina 2011）[^collins-1990][^dotson-2011][^fricker-2007][^medina-2011]。Hawley（2011）讨论了这样一些现象：人们归赋给女性音乐家较少的知识-如何与能力（Goldin & Rouse 2000）[^goldin-2000]；以及“因能力而非运气或‘本能’判定成功”的标准，对女性与非白人男性往往更高（Biernat & Kobrynowicz 1997）[^biernat-1997]。在这些情形中，行动者也许是通过作为直接的信息来源、而非通过证言某个命题之真来传递知识。若如此，她们所受的伤害也许需要一种不同于标准知识论不义（如 Fricker 2007）的说明——后者聚焦于命题知识的证言传递。
