      So, practical modes of representation are hard to escape if intellectualism is to be defended against the sufficiency objection. To assuage concerns about the intelligibility of practical modes of presentation, Pavese (2015b) proposes we think of them along the lines of practical senses, which in turn can be modeled after computer programs. Programs determine an output, just like Fregean senses determine a referent; and they are practical in that they break down a task into the smallest parts that the system can execute (the primitive operations of the system as well as into primitive ways of combining those parts) so they ground the ability to perform a complex task in terms of the ability to perform all of its parts. On this view, if one represents a task practically, one represents all of its parts, and the combination of those parts, through instructions that one has the ability to execute. So representing practically a task entails that one has the ability to perform the corresponding task. (For a critical discussion of practical ways of thinking, see Mosdell 2019. Habgood-Coote 2018c argues that the classical generality problem for reliabilism (Feldman 1985; Conee & Feldman 1998)[^conee-1998][^feldman-1985] arises for intellectualism.)
    step1: |-
      所以，若要以理智主义抵抗不充分性反对意见，实践表征方式很难避开。为了缓解人们对实践呈现方式之可理解性的担忧，Pavese（2015b）提议我们可以仿照实践意义来理解它们，而实践意义又可以仿照计算机程序来建模。程序决定输出，正如弗雷格式意义决定指称；它们之所以是实践的，在于它们把任务分解为系统所能执行的最小部分（系统的原初操作，以及组合这些部分的原初方式），从而以执行任务全部诸部分的能力为根基，为执行复杂任务的能力奠基。按这种观点，若人以实践方式表征一个任务，则他通过自己有能力执行的指令，表征了该任务的全部部分及这些部分的组合。因此，以实践方式表征一个任务，蕴涵着人具有执行相应任务的能力。（关于实践思维方式的批判性讨论，见 Mosdell 2019。Habgood-Coote 2018c 主张，可靠主义所面对的经典普遍性问题（Feldman 1985；Conee & Feldman 1998）[^conee-1998][^feldman-1985] 也会出现在理智主义上。）
