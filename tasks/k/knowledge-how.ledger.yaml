      Stanley replies that knowledge-wh *in general* seems to be Gettierable and that might be explained in terms of features having to do with *knowing the answer*. For example, consider Hawthorne’s (2000) example of a teacher giving each child in their class a note with the name of a city. “Vienna” is written only on one of the notes. In this context, it seems true that one child knows the correct answer to the question “what is the capital of Austria”, even though the child’s belief is true by luck. (Though see Carter & Pritchard 2015c for a reply that while knowledge-how is similar to knowledge-that and knowledge-wh in that it is incompatible with intervening luck, it differs with these kinds of knowledge in being compatible with environmental luck.)[^carter-2015c] Others still have responded that intuitions are subtle and not all of them favor anti-intellectualism (Marley-Payne 2016; Pavese forthcoming-a)[^marley-payne-2016]. For a recent experimental study with mixed results, see Carter, Pritchard, and Shepherd (2019). Hawley (2003: 28) argues that knowledge-how, like propositional knowledge, requires “warrant” on the ground that success on the basis of a lucky guess does not seem to manifest one’s knowledge-how. A similar theoretical argument for thinking that lucky belief cannot suffice for knowledge-how starts from the thesis that knowledge-how enters in explanations of success and that satisfactory explanations must be “modally robust”. From this, the argument concludes that the sort of belief that robustly explains intentional success must be knowledge, for knowledge has the relevant modal profile (Sosa 1999; Williamson 2000; D. Greco 2016)[^greco-2016][^sosa-1999][^williamson-2000]. Another line of argument starts from the observations that knowledge-how to Φ explains the ability to intentionally Φ (see section 4) and that only knowledge can explain intentional action (Gibbons 2001: 589–590)[^gibbons-2001]. On these bases, some argue that knowledge-how cannot fall short of non-getteriable knowledge (Cath 2015b for objections to this line of argument)[^cath-2015b].
    step1: |-
      Stanley 回应说：**一般而言**，wh-知识似乎都可被盖梯尔化，而这也许可以用与**知道答案**相关的特征来解释。例如，看 Hawthorne（2000）的例子：老师给班上的每个孩子一张写着城市名字的纸条，其中只有一张写着“维也纳”。在此语境下，似乎可以说有一个孩子知道“奥地利的首都是什么”这一问题的正确答案，尽管该孩子的信念只是碰巧为真。（不过，Carter & Pritchard 2015c 回应说：知识-如何虽与命题知识和 wh-知识一样不容许介入性的运气，却与后二者有别的不同。）
    step2: |-
      Stanley 回应说：**一般而言**，wh-知识似乎都可被盖梯尔化，而这也许可以用与 **知道答案** 相关的特征来解释。例如，看 Hawthorne（2000）的例子：老师给班上每个孩子一张写着城市名字的纸条，其中只有一张写着“维也纳”。在此语境下，似乎可以说有一个孩子知道“奥地利的首都是什么”这一问题的正确答案，尽管其信念只是碰巧为真。（不过，Carter & Pritchard 2015c 回应说：知识-如何虽与命题知识和 wh-知识一样不容许介入性的运气，却与后二者不同，因为它容许环境性的运气。）[^carter-2015c] 另一些人则回应说，直觉颇为微妙，并非全都支持反理智主义（Marley-Payne 2016；Pavese 即将出版 a）[^marley-payne-2016]。关于晚近一项结果混杂的实验研究，见 Carter, Pritchard, and Shepherd（2019）。Hawley（2003: 28）主张，知识-如何与命题知识一样要求“保证”，理由是：基于幸运猜测的成功似乎并未展现人的知识-如何。另一种理论论证支持“幸运信念不足以构成知识-如何”，其出发点是：知识-如何进入对成功的解释，而令人满意的解释必须“模态稳固”。由此，论证得出结论：那种稳健地解释意向性成功的信念必是知识，因为知识具有相关的模态侧写（Sosa 1999；Williamson 2000；D. Greco 2016）[^greco-2016][^sosa-1999][^williamson-2000]。另一条论证路线从两个观察出发：知道如何 Φ 解释了有意地 Φ 的能力（见第 4 节）；且只有知识才能解释意向行动（Gibbons 2001: 589–590）[^gibbons-2001]。据此，有人论证说：知识-如何不能低于不可盖梯尔化的知识（对这一论证路线的反对，见 Cath 2015b）[^cath-2015b]。
