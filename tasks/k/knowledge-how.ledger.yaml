      Among those engaging with the linguistic argument, many have objected that it fails to adequately capture the truth conditions of knowledge-how ascriptions (Roberts 2009; Brogaard 2009, 2011; Michaelis 2011; Bengson & Moffett 2011a; Ginzburg 2011; Abbott 2013; Santorio 2016; Hornsby 2016)[^abbott-2013][^bengson-2011a][^brogaard-2009][^ginzburg-2011][^hornsby-2016][^michaelis-2011][^roberts-2009][^santorio-2016]. Some have argued against the claim that knowledge-wh is a matter of knowing a proposition that answers a question (**Semantics for knowledge-wh)**. For example, Carr (1979, 1981) argues that when you know how to do something, you have an attitude that essentially takes an act as its object. But when you know that something is the case, you have an attitude that essentially takes a proposition as its object. Yet, intellectualists might reply that knowledge-how might be an attitude towards an act *in virtue of* being an attitude towards a proposition about that act.
