      The notion of skill is central also in Eastern philosophy. Garfield and Priest (2020) examine the various roles that the notion of skill plays in the Indian school of Mahayana Buddhism, in Daoism, and in Chan/Zen thought. In Daoism as well as in Chan/Zen Buddhism, the emphasis on skill is also connected, fundamentally, to concerns about living a good and ethical life. Sarkissan (2020) argues that two prominent types of expertise often encountered in ancient Chinese thought from the sixth to third centuries BCE: The first is expertise at a particular craft, occupation, or *dao*, as is most famously presented in the Daoist anthology *Zhuangzi*. The second is ethical expertise in the Ruist (Confucian) and Mohist schools (cf. for more on skill in Buddhism, see also MacKenzie 2020)[^mackenzie-2020].
