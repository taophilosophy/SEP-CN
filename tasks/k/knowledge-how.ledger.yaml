      Now, suppose that knowing how to Φ does require the ability to intentionally perform Φ. If so, whether knowledge-how requires a propositional attitude depends on whether or not one can intentionally Φ without having a propositional attitude about how to Φ. But according to many influential views of intentional action, intentionally Φ-ing does require a propositional attitude, namely a belief about how to Φ. In particular, intentionally Φ-ing requires having an action plan, which is characterizable in terms of a belief about how to perform Φ. For example, on Goldman’s (1970) view, one intentionally Φs when one has a plan to Φ, where a plan to Φ is a belief that specifies the means to Φ (see, also, e.g., Harman 1976; Audi 1986; Bratman 1987; Velleman 1989; Ginet 1990; Mele & Moser 1994; Gibbons 2001)[^audi-1986][^bratman-1987][^gibbons-2001][^ginet-1990][^harman-1976][^mele-1994][^velleman-1989]. From this, we get:
    step1: |-
      现在，设知道如何 Φ 确实要求有意地执行 Φ 的能力。若如此，知识-如何是否要求一种命题态度，便取决于人是否能有意地 Φ 而不具有关于如何 Φ 的命题态度。但按许多有影响的意向行动观，有意地 Φ 确实要求一种命题态度，即一个关于如何 Φ 的信念。具体说，有意地 Φ 要求拥有一个行动计划，而该计划可用关于如何执行 Φ 的信念来刻画。例如，按 Goldman（1970）的观点，当人拥有一个 Φ 的计划时，他就有意地 Φ；而 Φ 的计划是一个指明 Φ 之手段的信念（另见，例如 Harman 1976；Audi 1986；Bratman 1987；Velleman 1989；Ginet 1990；Mele & Moser 1994；Gibbons 2001）[^audi-1986][^bratman-1987][^gibbons-2001][^ginet-1990][^harman-1976][^mele-1994][^velleman-1989]。由此我们得到：
