      The usual evidence marshaled in favor of C1 relies on amnesiac case studies (Milner 1962; see Cohen & Squire 1980 for discussion)[^cohen-1980][^milner-1962]. A typical example is HM. After bilateral removal of the hippocampus, parahippocampal gyrus, entorhinal cortex, and most of the amygdala to relieve debilitating symptoms of epilepsy, HM was unable to form new memories of facts or events and he could no longer access memories he acquired in the few years leading up to his surgery. Nevertheless, it was found that over 10 trials, HM tuned his motor skill to trace the outline of a five-pointed star based only on looking at reflection in a mirror. Since he could not store new memories, HM’s declarative knowledge of the means of performing the task did not change from one trial to the next. But his performance improved. So, the reasoning goes, the improvement of motor skills is governed by a distinct cognitive system from that which governs the retention of declarative facts.
    step1: |-
      通常用来支持 C1 的证据依赖失忆症病例研究（Milner 1962；讨论见 Cohen & Squire 1980）[^cohen-1980][^milner-1962]。典型病例是 H.M.。为缓解严重的癫痫症状，他的海马、海马旁回、内嗅皮层与大部分杏仁核被双侧切除；此后 H.M. 无法形成关于事实或事件的新记忆，也无法再获取手术前数年间的记忆。然而人们发现，在十次试次中，H.M. 仅凭看镜子里的映像，就改进了描画五角星轮廓的运动技能。由于他无法储存新记忆，H.M. 关于执行该任务之手段的陈述性知识在试次之间没有变化。
    step2: |-
      通常用来支持 C1 的证据依赖失忆症病例研究（Milner 1962；讨论见 Cohen & Squire 1980）[^cohen-1980][^milner-1962]。典型病例是 H.M.。为缓解严重的癫痫症状，他的海马、海马旁回、内嗅皮层与大部分杏仁核被双侧切除；此后 H.M. 无法形成关于事实或事件的新记忆，也无法再获取手术前数年间的记忆。然而人们发现：在十次试次中，H.M. 仅凭看镜子里的映像，就改进了描画五角星轮廓的运动技能。由于他无法储存新记忆，H.M. 关于执行该任务之手段的陈述性知识在试次之间并无变化。
