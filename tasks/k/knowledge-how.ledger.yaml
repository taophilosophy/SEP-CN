      According to C3, propositional knowledge corresponds to “declarative” knowledge—to a sort of knowledge that is, at least in principle, verbalizable. Opponents of intellectualism often uses C3 in a novel argument against intellectualism: if propositional knowledge has to be verbalizable, then knowledge-how cannot be propositional knowledge, for often subjects know how to perform tasks even though they cannot explain how they do it (Schiffer 2002; Devitt 2011; Adams 2009; Wallis 2008)[^adams-2009][^devitt-2011][^schiffer-2002][^wallis-2008]. On behalf of intellectualism, there do seem to be cases in which you come to know how to do something precisely by consulting a manual and learning some propositions (see, e.g., Snowdon 2004: 12; Bengson and Moffett 2011a: 8; and Katzoff 1984: 65ff)[^bengson-2011a][^katzoff-1984][^snowdon-2004]. Moreover, it is not clear that the anti-intellectualist demand that propositional knowledge be always verbalizable is motivated. In fact, it seems to conflate knowing how to perform a task with *knowing how to explain how the task is performed* (cf. Fodor 1968: 634; Stalnaker 2012)[^fodor-1968][^stalnaker-2012]. Stanley (2011b: 161) points out that there is a sense in which knowledge-how *is* always verbalizable. A punch-drunk boxer who can at best demonstratively refer to his re-enactment of the way of boxing against southpaws, and says, “This is the way I fight against a southpaw” intuitively knows that this is the way he fights against southpaws. This knowledge has an essential demonstrative or indexical component. But the same goes for much other propositional knowledge like, for example, the knowledge we express by saying, “This is the tool for the job”, or “That is going to be trouble”. This reply assumes that ways to execute tasks are *ostensible* and as such can be picked up by a demonstrative. This does not need to be so: on any single occasion, one may only act on *parts* of a way. So, one will not thereby be able to pick up the *general* way one’s knowledge-how is about. Another reply on behalf of intellectualism is to point out that practical concepts for tasks differ from “semantic” concepts for the same tasks precisely in that, even if propositional, they are not necessarily verbalizable.
    step1: |-
      按 C3，命题知识对应于“陈述性”知识——即一种至少在原则上可用语言表述的知识。理智主义的反对者常借 C3 提出一个反对理智主义的新论证：若命题知识必须可用语言表述，则知识-如何便不能是命题知识，因为主体常常知道如何完成任务，却无法解释自己如何做到（Schiffer 2002；Devitt 2011；Adams 2009；Wallis 2008）[^adams-2009][^devitt-2011][^schiffer-2002][^wallis-2008]。为理智主义辩护，确实似乎存在这样的情形：人正是通过查阅手册、学会某些命题，才知道如何做某事的（例如见 Snowdon 2004: 12；Bengson and Moffett 2011a: 8；Katzoff 1984: 65 以下）[^bengson-2011a][^katzoff-1984][^snowdon-2004]。此外，反理智主义要求命题知识总可用语言表述，这一要求是否有动机也不清楚。事实上，它似乎把知道如何完成一个任务，与*知道如何解释该任务是如何完成的*混为一谈（参 Fodor 1968: 634；Stalnaker 2012）[^fodor-1968][^stalnaker-2012]。Stanley（2011b: 161）指出，在某种意义上，知识-如何**确实**总可用语言表述。一个被打得晕头转向的拳手，至多只能指示性地指称自己对“对付左撇子拳手之打法”的重演，说“我打左撇子就是这么打的”；他直觉上知道自己打左撇子就是这么打的。这一知识有一个本质性的指示或索引成分。但其他许多命题知识亦然，例如我们通过说“这就是干这活儿的工具”或“那会惹麻烦”所表达的知识。这一回应假定：执行任务的方式是**显见的**，故可被指示词所拾取。但这不必如此：在任何单一场合，人也许只按一种方式的**部分**行动。所以，人并不能借此拾取其知识-如何所关涉的**一般**方式。为理智主义辩护的另一回应是指出：任务之实践概念与同一任务之“语义”概念的区别恰在于：即便它们是命题性的，也不必然可用语言表述。
