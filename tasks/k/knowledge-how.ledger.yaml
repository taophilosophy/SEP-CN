      Finally, some have questioned whether **Semantics for knowledge-wh** applies to ascriptions embedding infinitival complements, like knowledge-how ascriptions. Roberts (2009) argues that, as opposed to other wh complements, the meaning of “how” denotes a property rather than a proposition when embedded in infinitival clauses. Santorio (2016) defends a Gibbardian semantics for knowledge ascriptions embedding infinitive interrogatives, on which these ascriptions ascribe maximal performance plans compatible with an agent’s plans (for more objections to **Semantics for knowledge-wh**, see also Sgaravatti & Zardini 2008 and George 2013)[^george-2013][^sgaravatti-2008][^zardini-2013].
    step1: |-
      最后，有些人质疑**wh-知识语义学**是否适用于嵌入不定式补语的归赋，如知识-如何归赋。Roberts（2009）主张，与其他 wh-补语不同，“how”嵌入不定式从句时，其意义指谓一种属性而非命题。Santorio（2016）为嵌入不定式疑问句的知识归赋辩护一种吉伯德式语义学：按此，这类归赋归赋的是与行动者计划相容的最大表现计划（对**wh-知识语义学**的更多反对意见，另见 Sgaravatti & Zardini 2008 与 George 2013）[^george-2013][^sgaravatti-2008][^zardini-2013]。
