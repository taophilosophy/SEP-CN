      The view that intentional action requires belief has been challenged for the particular case of *basic actions*. Setiya (2012) observes that one can perform a basic action of clenching one’s fist without even having the belief that one can succeed at doing it. For example, someone might have had a paralyzing injury, fail to believe they have healed, and still form the intention to clench their fist. Intellectualists might reply that, although that subject does not believe that one will succeed, they might have a sufficiently high credence and that credence can amount to knowledge too (Pavese 2020)[^pavese-2020]. (For other possible responses to the idea that intentional action requires knowledge or belief, see Elzinga forthcoming).
    step1: |-
      “意向行动要求信念”这一观点，在**基本行动**的特定情形中已受到挑战。Setiya（2012）观察到：人可以在甚至不拥有“自己能成功”这一信念的情况下，执行握拳这一基本行动。例如，有人可能因伤瘫痪、不相信自己已经康复，却仍形成握拳的意向。理智主义者可能回应说：尽管该主体不相信自己会成功，但他可能拥有足够高的置信度，而该置信度也可以构成知识（Pavese 2020）[^pavese-2020]。（对于“意向行动要求知识”这一想法的其他可能回应，见相关文献。）
