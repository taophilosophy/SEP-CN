      In contemporary times, the notion of skill is central to the philosophy of the twentieth-century French phenomenologist Maurice Merleau-Ponty. Merleau-Ponty (1945 [1962]) distinguishes between *motor intentionality*—the sort of intentionality relevant for motor skills—and *cognitive intentionality*. While the latter is conceptual and representational, Merleau-Ponty thought that motor intentionality is non-representational and non-conceptual. Central to Merleau-Ponty is the role of motor skills in shaping perceptual experience: in paradigmatic cases of perception, the flow of information taken in by perceivers is inseparable from the way they move through a scene. On this view, even superficially static perceptions engage motor skills, such as seeing the color of a table as uniform when different parts of it are differently illuminated (see Siegel 2020 for an helpful introduction)[^siegel-2020].
    step1: |-
      在当代，技能这一概念在二十世纪法国现象学家梅洛-庞蒂的哲学中居于核心。梅洛-庞蒂（1945 [1962]）区分了*运动意向性*——与运动技能相关的那类意向性——与*认知意向性*。后者是概念的、表征性的；梅洛-庞蒂则认为运动意向性是非表征的、非概念的。梅洛-庞蒂的核心关切是运动技能在塑造知觉经验中的作用：在典型的知觉情形中，知觉者所接收的信息流，与他们在场景中移动的方式不可分离。按这种观点，即便表面上静态的知觉也牵动运动技能，例如在不同部分受光不同的情况下把桌子的颜色看作均匀的（有用的导论见 Siegel 2020）[^siegel-2020]。
    step2: |-
      在当代，技能这一概念在二十世纪法国现象学家梅洛-庞蒂的哲学中居于核心。梅洛-庞蒂（1945 [1962]）区分了 **运动意向性**——与运动技能相关的那类意向性——与 **认知意向性**。后者是概念的、表征性的；梅洛-庞蒂则认为，运动意向性是非表征的、非概念的。梅洛-庞蒂的核心关切，是运动技能在塑造知觉经验中的作用：在典型知觉情形中，知觉者接收的信息流，与他们在场景中移动的方式不可分离。按这种观点，即便表面静态的知觉也牵动运动技能。例如，在不同部分受光各异时，人仍会把桌子颜色看作均匀的（有用的导论见 Siegel 2020）[^siegel-2020]。
