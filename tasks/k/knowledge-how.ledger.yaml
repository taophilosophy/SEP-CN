      Ryle (1946, 1949) used “skill” and “knowledge-how” interchangeably in his criticism of the “Intellectualist legend” (for discussion, see Kremer 2020)[^kremer-2020]. In fact, Ryle’s view of knowledge-how is stated, literally, as the view that “skill” is a complex of dispositions (Ryle 1949: 33; see also Ryle 1967, 1974, 1976 for his views on how skill as a form of knowledge is distinguished by the forms on how it is taught and learned through training)[^ryle-1949][^ryle-1967]. This discussion brings us to whether intellectualism about knowledge-how and *intellectualism about skill* stand or fall together. Should intellectualists about knowledge-how identify skill too with propositional knowledge? While Stanley and Williamson (2001) embrace the view that knowledge-how is propositional knowledge, in a recent paper (Stanley & Williamson 2017)[^stanley-2017], they refuse to think of *skill* as a standing propositional knowledge state. Rather, they argue that skills are dispositions to know. One motivation for this view is that this addresses the novelty challenge raised by Dreyfus (1991, 2005). According to this challenge, propositional knowledge cannot explain the ability to respond intelligently to situations that have not been encountered by the agent before. If skills are dispositions to know, it is no mystery how novel situations can be handled by skillful agents. Stanley & Williamson (2017) claim that the resulting view is still broadly intellectualist in a sense, because on it, skillful action manifests propositional knowledge (for a criticism of this response to the novelty objection, see Pavese 2016 in Other Internet Resources).
    step1: |-
      赖尔（1946, 1949）在批评“理智主义传说”时把“技能”与“知识-如何”互换使用（讨论见 Kremer 2020）[^kremer-2020]。事实上，赖尔关于知识-如何的观点，字面上就是“技能是倾向之复合体”的观点（Ryle 1949: 33；关于他如何认为作为知识形式的技能由教授与训练的方式所区分，另见 Ryle 1967, 1974, 1976）[^ryle-1949][^ryle-1967]。这一讨论引出一个问题：关于知识-如何的理智主义与*关于技能的理智主义*是否同存同亡？知识-如何上的理智主义者是否也应把技能等同于命题知识？Stanley 与 Williamson（2001）接受知识何以为命题知识，但在晚近一篇论文（Stanley & Williamson 2017）[^stanley-2017]中，他们拒绝把*技能*视为一种常存的命题知识状态；他们主张，技能是“知道的倾向”。这一观点的一个动机，是它回应了德雷福斯（1991, 2005）所提的新颖性挑战。按此挑战，命题知识无法解释人对自己此前未曾遭遇的情境作聪明回应的能力。若技能是知道的倾向，那么熟练行动者如何处理新颖情境便不再神秘。Stanley & Williamson（2017）声称，所得观点在某种意义上仍宽泛地是理智主义的，因为按它，熟练行动展现了命题知识（对这一回应新颖性反对意见之做法的批评，见 Other Internet Resources 中 Pavese 2016）。
