      The topic of skill and expertise is central since ancient philosophy through the notion of *technē*. Although both Plato and Aristotle took *technē* to be a kind of knowledge, there is significant controversy about their conceptions regarding the nature of this kind of knowledge and its relation to experience (*empeiria*) on one hand, and scientific knowledge (*epistēmē*) on the other (Johansen 2017; Lorenz & Morison 2019; Coope 2020)[^coope-2020][^johansen-2017][^lorenz-2019]. Annas (1995, 2001, 2011) develops an interpretation on which skill and virtue (or *phronēsis*) are closer in Aristotle’s action theory than usually thought and they are both conceived along a broadly intellectualist model.
    step1: |-
      技能与专长这一题目自古希腊哲学以来便是核心，其线索是*技艺*（*technē*）这一概念。尽管柏拉图与亚里士多德都把*技艺*视为一种知识，但关于他们如何理解这类知识的本性、它同经验（*empeiria*）的关系、以及它同科学知识（*epistēmē*）的关系，仍有重大争议（Johansen 2017；Lorenz & Morison 2019；Coope 2020）[^coope-2020][^johansen-2017][^lorenz-2019]。Annas（1995, 2001, 2011）提出一种解读：在亚里士多德的行为理论中，技能与德性（或*实践智慧*，*phronēsis*）比通常所想的更为接近，且二者都按一种宽泛的理智主义模型来构想。
