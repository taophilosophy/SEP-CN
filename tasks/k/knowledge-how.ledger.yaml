      This phenomenological tradition inspires Dreyfus’ (1991, 2000, 2002, 2005, 2007) critique of standard action theory. According to Dreyfus, theories on which an action is intentional only if the agent is in a mental state that represents the goal of her action (cf. Searle 1980, 2001)[^searle-1980] or on which actions are permeated by conceptual rationality (cf. McDowell 2007)[^mcdowell-2007] are not supported by the phenomenology of purposive activity. Paradigmatic examples of these purposive activities are, for Dreyfus, skillful activities like playing tennis or habitual activity like rolling over in bed or making gestures while speaking. In this sort of skillful coping, Dreyfus thought that the mind does not represent the world as detached from it. Rather, it is fundamentally embedded, absorbed, and embodied (see Gehrman & Schwenkler 2020 for an helpful introduction to Dreyfus on skills)[^gehrman-2020].
