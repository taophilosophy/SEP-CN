      A further related question is how to think of knowledge-how in the case of joint actions. When two agents act jointly towards a goal, as when they row a boat together, they responsively coordinate and monitor each other’s movements in ways that produce a joint action. What kind of knowledge-how is manifested by successful joint action? It must be possible for the agents to coordinate without each having to know the different ways in which each must act to achieve their common goals: you and I can jointly make risotto even if I do not know how to season it and you do. Correspondingly, Birch (2019) suggests that joint knowledge-how must be accounted for *distributively*. If this is correct, then the agents can jointly know how to do something without *each* having a belief about how they jointly do it, but only in virtue of having a collective, or group, belief about how to do it. (For more discussion on group knowledge-how, see Palermos & Tollefsen 2018 and Strachan, Knoblich & Sebanz 2020)[^palermos-2018]
    step1: |-
      一个进一步的相关问题是：在联合行动的情形中应如何看待知识-如何。当两个行动者共同朝一个目标行动——如共同划一条船——他们以彼此呼应、相互协调与监控对方动作的方式，产生一个联合行动。成功的联合行动所展现的是何种知识-如何？行动者们必须能够在不必各自知道对方须以何种不同方式行动的情况下协调一致：即使我不知道如何给意大利烩饭调味而你知道，你我仍能共同做出它。相应地，Birch（2019）提出，联合的知识-如何必须按**分布式**方式来说明。若这是对的，那么联合的知识-如何便不能被还原为任何单个行动者的知识-如何。
    step2: |-
      一个进一步的相关问题是：在联合行动的情形中应如何看待知识-如何。当两个行动者共同朝一个目标行动——如共同划一条船——他们以彼此呼应、相互协调与监控对方动作的方式，产生一个联合行动。成功的联合行动所展现的是何种知识-如何？行动者必须能够在不必各自知道对方须以何种不同方式行动的情况下协调一致：即使我不知道如何给意大利烩饭调味而你知道，你我仍能共同做出它。相应地，Birch（2019）提出：联合的知识-如何必须按 **分布式** 方式来说明。若这是对的，行动者便能共同知道如何做某事，而不必 **各自** 都拥有关于他们如何共同做此事的信念，只需凭借拥有一个关于如何做此事的集体信念或群体信念。（关于群体知识-如何的更多讨论，见 Palermos & Tollefsen 2018 与 Strachan, Knoblich & Sebanz 2020）[^palermos-2018]
