      Many embrace C2 (e.g., Lewicki, Czyzewska, & Hoffman 1987: 523; Devitt 2011; Wallis 2008)[^devitt-2011][^wallis-2008]. But some object that a closer look at the details of HM’s case (as reported in Milner 1962)[^milner-1962] supports a different diagnosis, on which knowledge-how is realized by a combination of the procedural and the declarative system (Pavese 2013; Stanley & Krakauer 2013)[^pavese-2013][^stanley-2013]. At the beginning of each trial, prior to being given verbal instructions on how to perform the motor task, HM lacked the ability to intentionally perform it: HM was able to perform the motor task *only after being reminded of what the task consisted in*. This suggests, against C2, that there was an important declarative component to HM’s ability to perform the motor task (for the role of declarative knowledge in skillful action, see also Christensen, Sutton, & Bicknell 2019).
