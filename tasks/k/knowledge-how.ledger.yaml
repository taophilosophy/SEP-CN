      Pavese (2017) distinguishes between two kinds of gradability of knowledge-how ascriptions: one might know how to do something in part or entirely (quantitative gradability) or one might know how to do something better than somebody else (qualitative gradability). Crucially, these two kinds of gradability are also present more generally in other knowledge-wh (knowledge-when, who, why, where) ascriptions, which do seem to reduce to propositional knowledge. For instance, one might know in part *who* came to the party (Lahiri 1991, 2000; Roberts 2009)[^lahiri-1991][^roberts-2009] or know a better answer to that question than somebody else (see also Stanley 2011b: 31–5)[^stanley-2011b]. If parts of an answer are propositions, then knowing an answer might still amount to knowledge of all of its parts. Knowing in part an answer would then amount to knowing at least one of the propositions that is part of that answer. Similarly, knowing a better answer amounts to knowing a proposition that better answers the relevant question. If this is true of other knowledge-wh ascriptions, it is certainly plausible that it is true for knowledge-how. One might know how to Φ in part by knowing only certain (propositional) parts of the answer to “how does one Φ?” and one might know a better answer to that question than someone else.
    step1: |-
      Pavese（2017）区分了知识-如何归赋的两种可分级性：人可能部分地或完全地知道如何做某事（量的可分级性），也可能比别人更好地知道如何做某事（质的可分级性）。关键在于，这两种可分级性也更普遍地存在于其他 wh-知识的归赋（如知道何时、何人、为何、何处）之中，而这些归赋确实似乎可还原为命题知识。例如，人可能部分地知道*谁*来了聚会（Lahiri 1991, 2000；Roberts 2009）[^lahiri-1991][^roberts-2009]，或者比别人更好地知道那个问题的答案（另见 Stanley 2011b: 31–5）[^stanley-2011b]。若答案的部分是命题，则知道一个答案仍可能等于知道其全部部分；部分地知道一个答案，便等于至少知道构成该答案的其中一个命题。类似地，知道一个更好的答案，便等于知道一个能更好地回答相关问题的命题。若这对其他 wh-知识归赋为真，那么对知识-如何也极可能为真。人可能只凭知道“人如何 Φ？”这一答案中的某些（命题性）部分而部分地知道如何 Φ，也可能比别人更好地知道该问题的答案。
    step2: |-
      Pavese（2017）区分了知识-如何归赋的两种可分级性：人可能部分地或整个地知道如何做某事（量上的可分级性），也可能比别人更好地知道如何做某事（质上的可分级性）。关键在于，这两种可分级性也更普遍地存在于其他 wh-知识归赋（知道何时、何人、为何、何处）之中，而这些归赋确实似乎可还原为命题知识。例如，人可能部分地知道 **谁** 来了聚会（Lahiri 1991, 2000；Roberts 2009）[^lahiri-1991][^roberts-2009]，或者比别人更好地知道那个问题的答案（另见 Stanley 2011b: 31–5）[^stanley-2011b]。若答案的部分是命题，则知道一个答案仍可能等于知道其全部部分；部分地知道一个答案，便等于至少知道构成该答案的其中一个命题。类似地，知道一个更好的答案，便等于知道一个能更好地回答相关问题的命题。若这对其他 wh-知识归赋成立，那么对知识-如何也极可能成立。人可能只凭知道“人如何 Φ？”这一答案中的某些（命题性）部分，而部分地知道如何 Φ；也可能比别人更好地知道该问题的答案。
