      The Contemplation Argument also assumes CP—i.e., that in order to employ propositional knowledge when acting, one ought to contemplate the relevant proposition. Against CP, Ginet (1975: 7) observes that one might manifest one’s knowledge that one can get the door open by turning the knob and pushing it (as well as my knowledge that there is a door there) by performing that operation quite automatically as one leaves the room; and one may do this without formulating (in one’s mind or out loud) that proposition or any other relevant proposition. Ginet concludes that Ryle’s original argument does not teach us that intellectualism about knowledge-how is false but only that knowledge can be acted upon and manifested without requiring any contemplation on the part of the agent. Indeed, some scholars think that this last weaker claim was the only goal of Ryle’s original argument (Rosefeldt 2004; Sax 2010)[^rosefeldt-2004][^sax-2010].
    step1: |-
      沉思论证还假定 CP——即在行动中运用命题知识时，人应当沉思相关的命题。针对 CP，Ginet（1975: 7）指出：人可以在离开房间时相当自动地执行“转动把手并推门”这一操作，从而展现自己知道转动把手并推门就能把门打开（以及知道自己知道那里有门）；而人这样做时，并不在心里或出声地表述那个命题或任何其他相关命题。Ginet 由此得出结论：赖尔原来的论证并没有教我们知识-如何上的理智主义是假的，而只是说知识可以被据以行动、可以被展现，而无须行动者方面作任何沉思。的确，一些学者认为这后一较弱的论断才是赖尔原论证的唯一目标（Rosefeldt 2004；Sax 2010）[^rosefeldt-2004][^sax-2010]。
