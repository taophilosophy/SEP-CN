    step1: |-
      为了评估这一反对意见，不妨从一种玩具式的理智主义理论入手：按该理论，知识-如何就在于知道——对于完成某任务 *w* 的某种方式或方法——*w* 事实上是完成该任务的一种方式。第 4 节将更详细地看到一种语言学论证，它把知识-如何等同于这类命题知识（Stanley & Williamson 2001；Snowdon 2004）[^snowdon-2004][^stanley-2001]。不充分性反对意见说：一个人怎么可能仅凭知道某个关于完成任务的某种方式的命题，就知道如何完成该任务呢？考虑下面这个反对理智主义的反例：
