      另一些人质疑**逻辑形式**——即主张在知识-如何归赋中，嵌入的补语是疑问句。**对象论者**主张，知识-如何归赋的补语（“如何 Φ”）不是疑问句，而是“对象性”补语——它指谓 Φ 的方式，而非表征这些方式的命题（Bengson & Moffett 2011a）[^bengson-2011a]。对象论的动机有二：几乎在每个语境中，“知道如何 Φ”似乎都等同于“知道一种 Φ 的方式”；以及“知道如何”归赋的表面可分级性（参第 3 节）。对象性语义学很适于解释知识-如何归赋的可分级性，因为对象性知识归赋也允许程度修饰——人可以拥有关于巴黎的部分知识，或比别人更了解巴黎。沿着相似路线，Bach（2012）与 Abbott（2013）主张，在知识-如何归赋中，“如何 Φ”可能充当**自由关系从句**（free relative）。自由关系从句是指谓个体的 wh-短语。例如，“我被给作晚餐的东西”既可在“我问我被给作晚餐的是什么”中用作疑问句，也可在“我吃了我被给作晚餐的东西”中用作自由关系从句；在后一归赋中，它指谓某种被给我作晚餐的食物。在这个意义上，按该提议，在“*S* 知道如何 Φ”中，“如何 Φ”应被解读为指谓一种 Φ 方式的自由关系从句，而非对“如何 Φ？”这一问题的回答。
