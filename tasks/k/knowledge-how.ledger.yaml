      Understanding the nature of skill and its relation with knowledge is of crucial importance for virtue epistemology—the view that knowledge is to be defined in terms of the success of our cognitive skills (Zagzebski 2003, 2008; Sosa 2007, 2009; J. Greco 2003, 2010; Pritchard 2012; Turri 2013, 2016; Beddor & Pavese 2020; Pritchard 2020)[^beddor-2020][^greco-2003][^pavese-2020][^pritchard-2012][^pritchard-2020][^sosa-2007][^turri-2013][^zagzebski-2003]. Nevertheless, if it turns out that skill must be explained in terms of knowledge, virtue epistemology would be trying to account for knowledge in terms of knowledge and so would be viciously circular (see Millar 2009; Stanley & Williamson 2017 for an argument in this spirit)[^millar-2009][^stanley-2017]. Some virtue epistemologists have responded by offering an anti-intellectualist account of knowledge-yielding cognitive skills. Sosa and Callahan (2020) describe the relevant skills as dispositions to succeed when one tries—such that knowledge is obtained when agents in the right shape and in the right situation enact these skills appropriately.
    step1: |-
      理解技能的本性及其与知识的关系，对德性知识论至关重要——德性知识论主张，知识要用我们认知技能的成功来定义（Zagzebski 2003, 2008；Sosa 2007, 2009；J. Greco 2003, 2010；Pritchard 2012；Turri 2013, 2016；Beddor & Pavese 2020；Pritchard 2020）[^beddor-2020][^greco-2003][^pavese-2020][^pritchard-2012][^pritchard-2020][^sosa-2007][^turri-2013][^zagzebski-2003]。然而，若技能最终须用知识来解释，德性知识论便是在用知识来说明知识，从而陷入恶性循环（持此精神的一个论证见 Millar 2009；Stanley & Williamson 2017）[^millar-2009][^stanley-2017]。一些德性知识论者回应说，可以对产生知识的认知技能提出一种反理智主义说明。Sosa 与 Callahan（2020）把相关技能描述为“尝试即成功”的倾向——当处于恰当状态、恰当情境中的行动者恰当地施展这些技能时，知识便得以获得。
