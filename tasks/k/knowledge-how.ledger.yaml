      The notion of practical modes of presentation has received several criticisms (Schiffer 2002; Koethe 2002; Noë 2005; Fantl 2011; Glick 2015)[^glick-2015][^koethe-2002][^noë-2005][^schiffer-2002], on the ground that it seems excessively obscure or even question begging. Koethe (2002: 327) worries that practical modes of presentation smuggle in an antecedent notion of knowledge-how (though see Fantl 2008: 461 for a response)[^fantl-2008]. This widespread skepticism about practical modes of presentation has led some intellectualists to explore ways of responding to the insufficiency objection that do not appeal to practical modes of presentation. For example, Stanley (2011b: 126) considers answering the sufficiency challenge in **Swimming** by appealing to the context-sensitivity of the ability modal “could”. According to Stanley, depending on how the context for the modal is restricted, “That is how you could swim” could mean either that that is how you can swim *given your current physical state* or that that is how you could swim *after training*. But coming to know that that is how I could swim after training is clearly not enough for me to come to know how to swim now. Instead, the argument goes, what one needs to know is the former proposition: *that that is a way to swim given my current physical state*.
    step1: |-
      实践呈现方式这一观念受到若干批评（Schiffer 2002；Koethe 2002；Noë 2005；Fantl 2011；Glick 2015）[^glick-2015][^koethe-2002][^noë-2005][^schiffer-2002]，理由是它似乎过于晦涩，甚至有窃取论题之嫌。Koethe（2002: 327）担心实践呈现方式偷偷引入了一个先行的知识-如何概念（不过回应见 Fantl 2008: 461）[^fantl-2008]。这种对实践呈现方式的普遍怀疑，使一些理智主义者去探索不诉诸实践呈现方式来回应不充分性反对意见的途径。例如，Stanley（2011b: 126）考虑通过诉诸能力情态词“could”的语境敏感性来回答**游泳**中的充分性挑战。据 Stanley，视该情态词的语境如何受限，“That is how you could swim”既可以指那是你在当前身体状况下可以游泳的方式，也可以指那是你经训练后可以游泳的方式。但得知“那是我经训练后可以游泳的方式”，显然不足以让我现在就知道如何游泳。论证说，人所需要知道的其实是前一命题：“那是我在当前身体状况下游泳的一种方式”。
    step2: |-
      实践呈现方式这一观念受到若干批评（Schiffer 2002；Koethe 2002；Noë 2005；Fantl 2011；Glick 2015）[^glick-2015][^koethe-2002][^noë-2005][^schiffer-2002]，理由是它似乎过于晦涩，甚至有窃取论题之嫌。Koethe（2002: 327）担心：实践呈现方式偷偷引入了一个先行的知识-如何概念（回应见 Fantl 2008: 461）[^fantl-2008]。对实践呈现方式的这种普遍怀疑，使一些理智主义者去探索不诉诸实践呈现方式来回应不充分性反对意见的途径。例如，Stanley（2011b: 126）考虑通过诉诸能力情态词“could”的语境敏感性，来回答 **游泳** 中的充分性挑战。据 Stanley，视该情态词的语境如何受限，“那就是你据以游泳的方式”既可以指那是你在当前身体状况下可以游泳的方式，也可以指那是你经训练后可以游泳的方式。但得知“那是我经训练后可以游泳的方式”，显然不足以让我现在就知道如何游泳。于是论证说，人所需要知道的其实是前一命题：“那是我在当前身体状况下游泳的一种方式”。
