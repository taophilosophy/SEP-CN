      Another way of challenging the intellectualist claim that knowledge-how is a species of knowledge-that is to question whether knowledge-how can be Gettiered. If knowledge-how survives Gettierization, that would be evidence that knowledge-how is not a species of knowledge-that, on the assumption that Gettiered justified true belief cannot constitute propositional knowledge (Gettier 1963)[^gettier-1963]. Stanley & Williamson (2001) argue that knowledge-how cannot be Gettiered. However, Cath (2011) responds by proposing the **Lucky Light Bulb** case, where Charlie wants to learn how to change a lightbulb, but he knows almost nothing about light fixtures or bulbs. Charlie consults *The Idiot’s Guide to Everyday Jobs*. Inside, he finds an accurate set of instructions describing the shape of a light fixture and bulb, and the way to change a bulb. Charlie grasps these instructions perfectly. And so there is a way such that Charlie now believes truly that that way is a way for him to change a light bulb, namely, the way described in the book. However, unbeknownst to Charlie, he is extremely lucky to have read these instructions, for the disgruntled author of *The Idiot’s Guide* filled her book with otherwise misleading instructions. Cath (2011) argues that intuitively Charlie still knows how to fix the light bulb, despite his belief being Gettiered (cf. also Poston 2009: 744)[^poston-2009].
    step1: |-
      挑战“知识-如何是命题知识之一类”这一理智主义主张的另一方式，是追问知识-如何能否被盖梯尔化。若知识-如何经受得住盖梯尔化，那便会成为证据，表明知识-如何不是命题知识之一类——前提是：盖梯尔化的得到辩护的真信念不能构成命题知识（Gettier 1963）[^gettier-1963]。Stanley & Williamson（2001）主张，知识-如何不能被盖梯尔化。然而，Cath（2011）以**幸运灯泡**（Lucky Light Bulb）一例回应：查理想要学会如何换灯泡，但他对灯具和灯泡几乎一无所知。查理查阅《白痴的日常活儿指南》（*The Idiot’s Guide to Everyday Jobs*）。书中有一组准确的说明，描述灯具和灯泡的形状以及换灯泡的方法。查理完全把握了这些说明。于是存在一种方式，使查理现在真地相信那种方式是换灯泡的一种方式——即书中描述的那种方式。然而，查理并不知道，他读到这些说明是极其幸运的：那本指南的编者心怀不满，在书里塞满了在其他方面会引人误入歧途的说明。Cath（2011）主张，直觉上查理仍然知道如何换灯泡，尽管他的信念已被盖梯尔化（另参 Poston 2009: 744）[^poston-2009]。
