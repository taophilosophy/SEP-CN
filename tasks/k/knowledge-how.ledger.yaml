      As Kremer (2020: 102) points out, here Ryle is making two distinguishable points: (i) ascriptions of knowledge-how are gradable, whereas ascriptions of know-that are not; (ii) the gradability of these ascriptions is explained by the fact that knowledge-how must come in degrees, because learning-how brings improvement in knowledge-how. There is no parallel phenomenon in learning-that, and so no need for degrees of knowledge-that. Others have followed Ryle in thinking that the gradability argument shows intellectualism wrong. For example, Bengson and Moffett (2011b) argue that because knowledge-how is gradable, knowledge-how is more similar to acquaintance knowledge, which also comes in degrees (see also Ryle 1949: 46; Wiggins 2012; Santorio 2016; Kremer 2020: 102)[^kremer-2020][^ryle-1949][^santorio-2016][^wiggins-2012].
    step1: |-
      如 Kremer（2020: 102）所指出的，赖尔在这里提出了两个可区分的论点：（i）知识-如何的归赋是可分级的，而命题知识的归赋则不是；（ii）这些归赋的可分级性，可由知识-如何必然有程度之别来解释，因为学会如何会带来知识-如何上的长进。学会命题知识则无平行的现象，因而无需命题知识的程度。其他人追随赖尔，认为可分级性论证表明理智主义是错的。例如，Bengson 与 Moffett（2011b）主张，既然知识-如何是可分级的，知识-如何就更接近亲知，而后者也是有程度的（另见 Ryle 1949: 46；Wiggins 2012；Santorio 2016；Kremer 2020: 102）[^kremer-2020][^ryle-1949][^santorio-2016][^wiggins-2012]。
    step2: |-
      如 Kremer（2020: 102）所指出的，赖尔在这里提出两个可区分的论点：（i）知识-如何的归赋可分级，命题知识的归赋则不然；（ii）这些归赋的可分级性，可由知识-如何必然有程度之别来解释——因为学会如何会带来知识-如何上的长进。学会命题知识则无平行现象，因而无需命题知识的程度。其他人追随赖尔，认为可分级性论证表明理智主义是错的。例如，Bengson 与 Moffett（2011b）主张：既然知识-如何可分级，它就更接近亲知，而后者亦有程度之别（另见 Ryle 1949: 46；Wiggins 2012；Santorio 2016；Kremer 2020: 102）[^kremer-2020][^ryle-1949][^santorio-2016][^wiggins-2012]。
