      In recent years, however, some have emphasized the role of attention and consciousness in skillful performance (Montero 2016, 2020; Wu 2016, 2020)[^montero-2016]. Montero argues against the Dreyfusian idea of skillful and mindless coping, by noting that online conscious thought about what one is doing is compatible with expertise and by surveying empirical evidence that suggests revisiting the choking argument. Christensen, Sutton and McIlwain (2016) and Christensen, Sutton, and Bicknell’s (2019) argue for the centrality of cognition in explaining the flexibility of skilled action in complex situations and advance a “mesh theory” of skilled action, according to which skilled action results for a mesh of both automatic and cognitively controlled processes (for a survey of some of these issues, Christensen 2019. See also Sutton 2007 and Fridland 2017b)[^christensen-2019][^christensen-2019-2][^fridland-2017b][^sutton-2007].
    step1: |-
      然而近年来，有人强调注意与意识在熟练表现中的作用（Montero 2016, 2020；Wu 2016, 2020）[^montero-2016]。Montero 反对德雷福斯式的“熟练而无心的应对”观念：她指出，关于自己正在做什么的在线有意识思考与专长是相容的；并综览了提示应重新审视失常论证的实证证据。Christensen、Sutton 与 McIlwain（2016）以及 Christensen、Sutton 与 Bicknell（2019）主张，认知在解释复杂情境中熟练行动的灵活性上居于核心，并提出熟练行动的“网合理论”：按此，熟练行动源于自动过程与认知控制过程二者的网合（关于其中一些问题的综述，见 Christensen 2019；另见 Sutton 2007 与 Fridland 2017b）[^christensen-2019][^christensen-2019-2][^fridland-2017b][^sutton-2007]。
