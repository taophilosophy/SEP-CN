      To this proposal, some respond that knowledge-how ascriptions do not pass the standard tests for detecting free relative complements (Schaffer 2009: 486–91; Habgood-Coote 2018a)[^habgood-coote-2018a][^schaffer-2009]. Take the coordinated use of knowledge-how and other knowledge-wh ascriptions in “*S* has always known how to swim and never has wondered how”. This coordination suggests that both kinds of ascriptions have an interrogative as a complement (Bresnan & Grimshaw 1978: 332; M. Baker 1996: 204–7)[^baker-1996][^bresnan-1978]. Further, knowledge-how ascriptions can be extended to embed a multiple interrogative, as in “Mark knows how to do what?” , whereas free relative complements do not tolerate multiple wh-phrases (C. Baker 1968; Bresnan & Grimshaw 1978: 335)[^baker-1968][^bresnan-1978]. Moreover, infinitival wh phrases, such as “what to do”, “how to do”, “who to ask” never allow for free relative reading (Huddleston & Pullum 2002: 1070–3)[^huddleston-2002]. Finally, a standard test for telling apart free relatives and interrogatives is to see if they embed under “believe”, for “believe” does not take interrogatives as complements but it does tolerate free relatives. (For example, “Mark believed who was charged guilty” cannot mean “Mark believed the answer to the question “Who was charged guilty?””. Rather, it means that Mark believed the person who was charged guilty.) However, interestingly, “believe” can never embed infinitival constructions such as “what to do”, “how to do”, or “who to ask”.
    step1: |-
      对这一提议，有人回应说，知识-如何归赋不能通过检测自由关系从句补语的标准测试（Schaffer 2009: 486–91；Habgood-Coote 2018a）[^habgood-coote-2018a][^schaffer-2009]。试看“*S* 一直知道如何游泳，且从未想知道如何”中知识-如何与其他 wh-知识归赋的并列使用。这种并列表明，两类归赋都以疑问句为补语（Bresnan & Grimshaw 1978: 332；M. Baker 1996: 204–7）[^baker-1996][^bresnan-1978]。进一步说，知识-如何归赋可以扩展为嵌入多重疑问句，如“马克知道如何做什么？”；而自由关系从句补语不容许多重 wh-短语（C. Baker 1968；Bresnan & Grimshaw 1978: 335）[^baker-1968][^bresnan-1978]。此外，“该做什么”“如何做”“该问谁”这类不定式 wh-短语，从不允许自由关系从句读法（Huddleston & Pullum 2002: 1070–3）[^huddleston-2002]。最后，区分自由关系从句与疑问句的一项标准测试，是看它们能否嵌入“相信”之下，因为“相信”不以疑问句为补语，却容许自由关系从句。（例如，“马克相信谁被指控有罪”不能意指“马克相信‘谁被指控有罪？’这一问题的答案”，而是意指马克相信那个被指控有罪的人。）然而有趣的是，“相信”从不能嵌入“该做什么”“如何做”或“该问谁”这类不定式构造。
