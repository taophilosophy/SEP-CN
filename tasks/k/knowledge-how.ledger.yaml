      The perhaps most serious objection to the linguistic argument is that it ignores cross-linguistic evidence about how knowledge-how is ascribed in languages other than English (Rumfitt 2003; Roberts 2009; Glick 2012; Wiggins 2012; Abbott 2013; Douskos 2013; Ditter 2016)[^abbott-2013][^ditter-2016][^douskos-2013][^glick-2012][^roberts-2009][^rumfitt-2003][^wiggins-2012]. Rumfitt (2003) argues that the linguistic facts on behalf of intellectualism are overstated. Many languages—e.g., French, Italian, Spanish, and Russian—ascribe knowledge-how not just through ascriptions embedding interrogatives (“*S* knows how to Φ”) but also through ascriptions embedding bare infinitivals (“*S* knows + (bare infinitive) to Φ” (= “*S* knows to Φ”)) as in “*Marie sait nager*” and “*Maria sa nuotare*”. Stanley (2011b, 2011c) responds that these ascriptions are to be analyzed as embedding an *implicit* interrogative—one where the question word “how” is not explicitly articulated. However, Abbott (2013), Hornsby (2016), and Ditter (2016) have observed that this response does not help with yet other languages, such as Russian, in which knowledge-how ascriptions—of the form “*S* (attitude verb) *V*s + (infinitive) to Φ”—feature an embedding verb *V* (“*umetj*”) that *never* licenses an interrogative complement nor a declarative complement (i.e., a *that*-clause).
    step1: |-
      对语言学论证也许最严重的反对意见是：它忽视了关于英语之外语言如何归赋知识-如何的跨语言证据（Rumfitt 2003；Roberts 2009；Glick 2012；Wiggins 2012；Abbott 2013；Douskos 2013；Ditter 2016）[^abbott-2013][^ditter-2016][^douskos-2013][^glick-2012][^roberts-2009][^rumfitt-2003][^wiggins-2012]。Rumfitt（2003）主张，支持理智主义的语言学事实被夸大了。许多语言——例如法语、意大利语、西班牙语与俄语——不仅通过嵌入疑问句的归赋（“*S* 知道如何 Φ”）来归赋知识-如何，也通过嵌入光杆不定式的归赋（“*S* 知道 +（光杆不定式）Φ”（＝“*S* 知道去 Φ”））来归赋，如“*Marie sait nager*”与“*Maria sa nuotare*”。Stanley（2011b, 2011c）回应说，这类归赋应分析为嵌入了**隐含的**疑问句——即疑问词“how”未被明确说出的疑问句。然而，Abbott（2013）、Hornsby（2016）与 Ditter（2016）指出，这一回应无助于另一些语言，如俄语：在俄语中，形式为“*S*（态度动词）*V*s +（不定式）Φ”的知识-如何归赋，其嵌入动词 *V*（*umetj*）**从不**允许疑问句补语，也不允许陈述句补语（即 that-从句）。
