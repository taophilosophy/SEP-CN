      Now it seems plausible that one’s manifestation of propositional knowledge can be intelligent in some cases but not in others. For example, one might manifest one’s knowledge intelligently by bringing to bear one maxim that is appropriate instead of any other that is not to the particular situation which the agent faces. By IPP, if one’s manifestation of knowledge-that in a particular situation is intelligent, it requires one’s manifesting one’s knowledge-how. If intellectualism is true, that would in turn require manifesting one’s knowledge-that. If this manifesting of propositional knowledge is intelligent too, though unintentional, it requires knowledge-how. And so on. We get an infinite regress if one accepts that manifesting propositional knowledge can be an intelligent performance, also when it is not an intentional action. (For similar lines of argument, see also Fridland 2013, 2015; Löwenstein 2016: 276–80; Small 2017: 62–3)[^fridland-2013][^löwenstein-2016][^small-2017].
    step1: |-
      现在，人的命题知识之展现，在某些情形下可以是聪明的，在另一些情形下则不然，这看起来是合理的。例如，人可以通过就行动者所面对的具体情境动用一条恰当的原则、而不是任何其他不恰当的原则，来聪明地展现自己的知识。由 IPP，如果人在某一情境中展现命题知识是聪明的，那么这种展现要求他展现自己的知识-如何。如果理智主义为真，那又要求他展现自己的命题知识。如果这一命题知识的展现也是聪明的——尽管非意向性——则它要求知识-如何。如此以致无穷。如果人接受展现命题知识可以是一种聪明的表现（即便它不是意向性行动），我们就得到无穷倒退。（类似的论证路线，另见 Fridland 2013, 2015；Löwenstein 2016: 276–80；Small 2017: 62–3）[^fridland-2013][^löwenstein-2016][^small-2017]。
    step2: |-
      现在看起来合理的是：人对命题知识的展现，在某些情形下可以是聪明的，在另一些情形下则不然。例如，人可以通过就行动者所处的具体情境选用一条恰当原则、而非其他不恰当原则，来聪明地展现自己的知识。由 IPP，若人在某一情境中展现命题知识是聪明的，则该展现要求他展现自己的知识-如何。若理智主义为真，那又要求他展现自己的命题知识。若这一命题知识的展现同样是聪明的——尽管非意向性——则它要求知识-如何。如此以至无穷。人若接受：展现命题知识可以是一种聪明的表现（即便它不是意向性行动），我们便得到无穷倒退。（类似的论证路线，另见 Fridland 2013, 2015；Löwenstein 2016: 276–80；Small 2017: 62–3）[^fridland-2013][^löwenstein-2016][^small-2017]。
