      Whether this response is compelling might depend on what one takes beliefs to be. On this topic, philosophers widely disagree. On an “intellectualist” account of belief, on which believing that *p* requires the subject to acknowledge that *p*, it is implausible that the athletes have the relevant belief. But intellectualists about knowledge-how might advocate replacing this intellectual notion of belief with a less demanding one. According to a prominent functional characterization of belief, to believe that *p* entails being disposed to act in ways that would tend to satisfy one’s desires, whatever they are, in a world in which *p* (together with one’s other beliefs) are true” (cf. Stalnaker 1984: 15; Stalnaker 2012)[^stalnaker-1984][^stalnaker-2012]. Now, suppose that in game after game, Athena catches the ball using a certain method *m*, and that whenever she does so, her behavior is intentional. From this it seems to follow that Athena is disposed to perform the actions specified by *m*. Since, *ex hypothesi*, *m* is a way of catching the ball, it follows that in all the worlds where she performs these actions, she satisfies her desire of catching the ball (or at least is sufficiently likely to do so). By the previous functional characterization of belief, it follows that Athena believes that *m* is a way for her to catch the ball. The lesson of this debate might be, following Stalnaker (2012), that intellectualism about knowledge-how is best construed as a form of anti-intellectualism about knowledge, belief, and the mental.
    step1: |-
      这一回应是否有说服力，也许取决于人如何理解信念。在这个题目上，哲学家分歧甚大。按关于信念的“理智主义”说明——即相信 *p* 要求主体承认 *p*——很难说这些运动员拥有相关信念。但知识-如何上的理智主义者可能主张，用一种要求较低的信念概念取代这个智性式信念概念。按一种著名的信念功能刻画，相信 *p* 蕴涵：在一个 *p*（连同自己其他信念）为真的世界中，倾向于以会趋于满足自己欲望（无论是什么欲望）的方式行动（参 Stalnaker 1984）。按这一理解，运动员确实可能相信其接球方式。
    step2: |-
      这一回应是否有说服力，也许取决于人如何理解信念。在这个题目上，哲学家分歧甚大。按关于信念的“理智主义”说明——即相信 *p* 要求主体承认 *p*——很难说这些运动员拥有相关信念。但知识-如何上的理智主义者可能主张，用一种要求较低的信念概念取代这个智性式信念概念。按一种著名的信念功能刻画，相信 *p* 蕴涵：在一个 *p*（连同自己其他信念）为真的世界中，倾向于以会趋于满足自己欲望（无论是什么欲望）的方式行动（参 Stalnaker 1984: 15；Stalnaker 2012）[^stalnaker-1984][^stalnaker-2012]。现在，设雅典娜在一场又一场比赛中用某种方法 *m* 接球，且每当她这样做时，其行为都是意向性的。由此似乎可以推出：雅典娜倾向于执行 *m* 所指定的那些动作。既然——按假设——*m* 是接球的一种方式，便可推出：在她执行这些动作的一切世界中，她都满足了自己接球的欲望（或至少很可能满足）。按前述信念的功能刻画，便推出雅典娜相信 *m* 是她接球的一种方式。这场争论的教训也许是（循 Stalnaker 2012）：知识-如何上的理智主义最好被理解为关于知识、信念与心灵的反理智主义的一种形式。
