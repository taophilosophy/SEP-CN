      A variety of actions—say, remembering to check the car’s blindspot when reversing—can be intelligent even though they are not intentional. Or one might manifest intelligence through *processes*—e.g., by coming to understand a difficult proposition, without them even being actions. If one accepts that intelligent performances, whether intentional or not, are necessarily guided by knowledge-how, one might try to recast the regress argument by replacing AP with IPP (Weatherson 2017)[^weatherson-2017]:
    step1: |-
      各种行动——比如说，倒车时记得查看车子的盲区——即使不是意向性的，也可以是聪明的。或者，人也可以通过一些过程来展现聪明——例如逐渐理解一个困难的命题，而这些过程甚至算不上行动。如果人接受：聪明的表现无论是否意向性，都必然受知识-如何引导，那么他可能尝试重铸倒退论证，用 IPP 取代 AP（Weatherson 2017）[^weatherson-2017]：
    step2: |-
