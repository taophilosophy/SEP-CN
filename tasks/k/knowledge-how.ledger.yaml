      A final objection is that intellectualism overintellectualizes knowledge-how in a way that is incompatible with what we know about animals’ cognition (Noë 2005; Hornsby 2007; Dreyfus 2007; Elzinga forthcoming)[^dreyfus-2007][^noë-2005]. According to this objection, unsophisticated and non- (or pre-) linguistic agents such as babies and non-human animals can know how to perform certain tasks, while lacking the concepts that are required for propositional knowledge. Some intellectualists respond that ordinary speakers routinely also ascribe propositional knowledge to animals and babies, as we say that Fido knows that its owner is arriving or that a baby knows that their mother is present (Stanley & Williamson 2001)[^stanley-2001]. Thus, while propositional knowledge may require concept possession, our ordinary knowledge ascriptions suggest that we regard relatively unsophisticated agents as possessing the relevant concepts. Comparative psychologists do routinely credit many non-human and non-linguistic animals with the possession of concepts. (See Allen & Bekoff 1999 for a comprehensive overview)[^allen-1999].
    step1: |-
      最后一个反对意见是：理智主义把知识-如何过度智性化，其程度与我们对动物认知所知者不相容（Noë 2005；Hornsby 2007；Dreyfus 2007；Elzinga 即将出版）[^dreyfus-2007][^noë-2005]。按这一反对意见，婴儿与非人动物这类不复杂且非（或前）语言的行动者，能够知道如何完成某些任务，却缺乏命题知识所需的概念。一些理智主义者回应说，平常说话者本就惯于把命题知识也归赋给动物与婴儿，比如我们说菲多知道主人快回来了，或婴儿知道母亲在场（Stanley & Williamson 2001）[^stanley-2001]。所以，命题知识虽然可能要求拥有概念，但我们的日常知识归赋表明：我们把相对不复杂的行动者也视为拥有相关概念。比较心理学家确实惯于认为许多非人且非语言的动物拥有概念。（综述见 Allen & Bekoff 1999）[^allen-1999]。
