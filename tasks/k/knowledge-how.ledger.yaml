    source: |-
      In introductory classes to epistemology, we are taught to distinguish between three different kinds of knowledge. The first kind is *acquaintance knowledge*: we know our mothers, our friends, our pets, etc., by being acquainted with them. The second kind is knowledge of facts, propositional knowledge, or *knowledge-that*: this is the sort of knowledge we acquire when we learn that, say, Ithaca is in New York State or that Turin is located in Italy. It is customary to add to the list a *third* kind of knowledge that is supposed to be distinct both from acquaintance knowledge and from propositional knowledge. One possesses this knowledge when one can be truly described as *knowing how* to do something: play the piano, make a pie, walk, speak, create, build, and so on.
    step1: |-
      在知识论的导论课上，我们被教导去区分三种不同的知识。第一种是亲知（*acquaintance knowledge*）：我们认识自己的母亲、朋友、宠物等等，是因为我们与它们相识。第二种是关于事实的知识、命题知识，或“知道那”（*knowledge-that*）：这是我们学到，比如说，伊萨卡在纽约州、或都灵在意大利时，所获得的那种知识。按惯例还要在这份清单上加上第三种知识，它应当既不同于亲知，也不同于命题知识。当一个人可以被真正地描述为“知道如何”（*knowing how*）做某事——弹钢琴、做馅饼、走路、说话、创造、建造等等——他就拥有这种知识。
    step2: |-
      在知识论的入门课上，我们被教导区分三种不同的知识。第一种是 **亲知**（*acquaintance knowledge*）：我们认识自己的母亲、朋友、宠物等等，靠的是与他们相识。第二种是关于事实的知识，即命题性知识，或 **命题知识**（*knowledge-that*）：这是我们得知，比方说，伊萨卡位于纽约州、都灵位于意大利时，所获得的知识。按惯例还要在清单上加上 **第三种** 知识，它应当既不同于亲知，也不同于命题知识。当一个人可以被真正地描述为 **知道如何** 做某事——弹钢琴、做馅饼、走路、说话、创造、建造等等——他便拥有这种知识。
  - id: 2
    kind: body
    source: |-
      The distinction between knowledge-how and knowledge-that was brought to scrutiny in analytic philosophy by Ryle in his seminal *The Concept of Mind* (1949), where he raised some of the now classical objections to the so-called “intellectualist legend”: the view that knowledge-how amounts to knowledge-that. Ryle instead advocated an “anti-intellectualist” view of knowledge-how according to which knowledge-how and knowledge-that are distinct kinds of knowledge, and manifestations of knowledge-how are not necessarily manifestations of knowledge-that. This anti-intellectualism has been the received view among philosophers for a long time. Even psychologists and neuroscientists have explicitly appealed to Ryle’s classical distinction when discussing their empirical findings (e.g., Cohen & Squire 1980; Anderson 1983)[^anderson-1983][^cohen-1980]. Nevertheless, in the last twenty years, a renewed interest by epistemologists in the nature of knowledge-how has brought new life to the debate, where new versions of intellectualism and anti-intellectualism have been developed and argued for. The debate is partly epistemological: is knowledge-how an altogether distinct kind of knowledge, different from knowledge-that? But it is also about a psychological question: what kind of psychological state is knowledge-how? The goal of this entry is to overview the debate between intellectualists and anti-intellectualists, while highlighting the implications of this debate for related questions concerning intelligence, cognition, language, and skills.
    step1: |-
      知识-如何与命题知识之间的区别，被赖尔在其开创性著作《心的概念》（*The Concept of Mind*，1949）中带入分析哲学的审视，他在书中提出了若干如今已成经典的反对意见，针对所谓的“理智主义传说”：即知识-如何等于命题知识的观点。赖尔则主张一种关于知识-如何的“反理智主义”观点，据此知识-如何与命题知识是不同种类的知识，知识-如何的展现不必然是命题知识的展现。这种反理智主义长期以来是哲学家的公认之见。甚至心理学家和神经科学家在讨论其实证发现时也明确援引赖尔的经典区分（例如 Cohen & Squire 1980；Anderson 1983）[^anderson-1983][^cohen-1980]。然而在过去二十年里，知识论学者对知识-如何之本性的重新兴趣，使这场争论重获生机，其间提出了新的理智主义与反理智主义版本并加以论证。这场争论部分是知识论的：知识-如何是否是完全不同的一种知识，有别于命题知识？但它也关乎一个心理学问题：知识-如何是何种心理状态？本文的目标是概述理智主义者与反理智主义者之间的争论，同时凸显这场争论对智能、认知、语言与技能等相关问题的意涵。
    step2: |-
      知识-如何（knowledge-how）与命题知识之别，由赖尔（Ryle）在其奠基之作《心的概念》（*The Concept of Mind*，1949）中带入分析哲学的视野。他在书中提出若干至今已成经典的反对意见，针对所谓“理智主义传说”（intellectualist legend）——即知识-如何可归结为命题知识的观点。赖尔则主张一种“反理智主义”（anti-intellectualist）的知识-如何观：知识-如何与命题知识分属不同种类，知识-如何的展现不必是命题知识的展现。这一反理智主义长期是哲学家的公认之见。甚至心理学家与神经科学家在讨论其实证发现时，也明确援引赖尔的经典区分（例如 Cohen & Squire 1980；Anderson 1983）[^anderson-1983][^cohen-1980]。然而近二十年来，知识论学者对知识-如何之本性的重新关注，使这场争论重获生机：其间发展出理智主义与反理智主义的新版本，并为之论证。这场争论一部分是知识论的：知识-如何是否是完全不同的一种知识，有别于命题知识？但它也关乎一个心理学问题：知识-如何是何种心理状态？本文的目标是概述理智主义者与反理智主义者之间的争论，并凸显这场争论对智能、认知、语言与技能等相关问题的意涵。
