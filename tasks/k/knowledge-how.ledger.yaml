      Early intellectualists argued that knowledge-how does not entail ability (Ginet 1975; Stanley & Williamson 2001; Snowdon 2004)[^ginet-1975][^snowdon-2004][^stanley-2001]. For example, a pianist who lost their arms in a car accident may have lost her ability to play but still preserve her knowledge-how to play the piano (cf. Snowdon’s 2004: 8 expert omelette maker)[^snowdon-2004]; or a ski instructor might know how to do a ski stunt and, according to Stanley & Williamson (2001), still fail to have the ability to do it. By contrast, anti-intellectualists argue that it is important to distinguish between knowing how to perform a task, which corresponds to a general ability, and being (actually and circumstantially) able to perform it (Noë 2005; Glick 2012; Setiya 2012)[^glick-2012][^noë-2005][^setiya-2012]. So the pianist might have both general ability as well as knowledge-how, though they lack circumstantial ability. By contrast, the ski instructor does not clearly have knowledge-how to perform the ski stunt themselves, while they know how *one*, in general, can do it. Recent intellectualist views also take knowledge-how to go together with abilities (understood along Hawley’s 2003 notion of counterfactual success)[^hawley-2003] and argue that rightly construed intellectualism can vindicate this connection (Pavese 2015b; Cath 2020)[^cath-2020][^pavese-2015b].
    step1: |-
      早期理智主义者主张，知识-如何并不蕴涵能力（Ginet 1975；Stanley & Williamson 2001；Snowdon 2004）[^ginet-1975][^snowdon-2004][^stanley-2001]。例如，一位在车祸中失去双臂的钢琴家，可能失去了演奏的能力，却仍保有其如何弹钢琴的知识（参 Snowdon 2004: 8 的煎蛋专家）[^snowdon-2004]；又如滑雪教练可能知道如何做某个滑雪特技，而据 Stanley & Williamson（2001），仍不拥有做它的能力。相反，反理智主义者主张，重要的是区分知道如何完成一个任务（对应于一种一般能力）与实际地、境况性地能够完成它（Noë 2005；Glick 2012；Setiya 2012）[^glick-2012][^noë-2005][^setiya-2012]。所以那位钢琴家可能既有一能力、又有知识-如何，只是缺乏境况性能力；相反，滑雪教练自己并不清楚地拥有做该特技的知识-如何，尽管他知道一个人一般可以如何做它。晚近的理智主义观点也认为知识-如何与能力相随（能力按 Hawley 2003 的反事实成功概念理解）[^hawley-2003]，并主张正确理解的理智主义可以申明这一关联（Pavese 2015b；Cath 2020）[^cath-2020][^pavese-2015b]。
    step2: |-
      早期理智主义者主张，知识-如何并不蕴涵能力（Ginet 1975；Stanley & Williamson 2001；Snowdon 2004）[^ginet-1975][^snowdon-2004][^stanley-2001]。例如，一位在车祸中失去双臂的钢琴家，可能失去了演奏能力，却仍保有其如何弹钢琴的知识（参 Snowdon 2004: 8 的煎蛋专家）[^snowdon-2004]；又如滑雪教练可能知道如何做某个滑雪特技，而据 Stanley & Williamson（2001），仍不拥有做它的能力。相反，反理智主义者主张，重要的是区分知道如何完成一个任务（对应于一种一般能力）与实际地、境况性地能够完成它（Noë 2005；Glick 2012；Setiya 2012）[^glick-2012][^noë-2005][^setiya-2012]。所以那位钢琴家可能既有一能力、又有知识-如何，只是缺乏境况性能力；相反，滑雪教练自己并不清楚地拥有做该特技的知识-如何，尽管他知道一个人一般可以如何做它。晚近的理智主义观点也认为知识-如何与能力相随（能力按 Hawley 2003 的反事实成功概念理解）[^hawley-2003]，并主张正确理解的理智主义可以申明这一关联（Pavese 2015b；Cath 2020）[^cath-2020][^pavese-2015b]。
