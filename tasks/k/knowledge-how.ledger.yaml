      Following Stanley’s (2011b: 126) modal restriction proposal (cf. section 3), Cath (2017, 2019) responds that depending on how the context for the modal is restricted, (i) could mean *either* that Mark knows how John could swim *given his current physical state or* how John could swim *after training*. If only the latter, that is not the sort of proposition that John needs to know in order for (iii) to be true: for that, John ought to know that that is how he could swim under his current physical state. (Though see section 2 for qualms about this intellectualist strategy.) Another avenue for reply to the challenge from testimony may be to insist that not every propositional knowledge is transferable through testimony. A comparison: visual knowledge that Mark murdered Tina differs in content and mode of presentation from the knowledge that of the murder obtained by being told by his prosecutor. The former observational knowledge is not transferable through mere testimony but (exactly because of that!) it is more helpful for the purpose of convicting Mark than second-hand knowledge. That does not mean that observational knowledge is not propositional. Like in the case of perceptual knowledge, the proposition that one knows by knowing how to do something involves distinct modes of presentation of ways of doing things (section 2, section 3). We should not expect propositions under this mode of presentation to be transferable through testimony. (For a response to Poston 2016, see also Peet 2019)[^peet-2019][^poston-2016].
    step1: |-
      循 Stanley（2011b: 126）的情态限制方案（参第 3 节），Cath（2017, 2019）回应说：视该情态词语境如何受限，(i) 可以意指马克知道约翰**在当前身体状态下**可以如何游泳，**或**约翰**经训练后**可以如何游泳。若只是后者，那并不是约翰为使 (iii) 为真所需要知道的那种命题：为此，约翰所应当知道的是，那就是他在当前身体状态下可以游泳的方式。（关于这一理智主义策略的疑虑，见第 2 节。）回应证言挑战的另一途径，也许是指出并非一切命题知识都可经证言传递在实践上被接受为知识。
    step2: |-
      循 Stanley（2011b: 126）的情态限制方案（参第 3 节），Cath（2017, 2019）回应说：视该情态词语境如何受限，(i) 可以意指马克知道约翰 **在当前身体状态下** 可以如何游泳，**或** 约翰 **经训练后** 可以如何游泳。若只是后者，那并不是约翰为使 (iii) 为真所需要知道的那种命题：为此，约翰所应当知道的是，那就是他在当前身体状态下可以游泳的方式。（关于这一理智主义策略的疑虑，见第 2 节。）回应证言挑战的另一途径，也许是指出：并非一切命题知识都能经证言传递。试作比较：关于马克杀害蒂娜的视觉知识，在内容与呈现方式上不同于通过检察官告知而获得的关于该凶案的知识。前一种观察性知识不能仅凭证言传递，但（正因如此！）它比二手知识更有助于给马克定罪。这并不意味着观察性知识不是命题知识。如同知觉知识的情形，人通过知道如何做某事而知道的命题，涉及对做事方式的独特呈现方式（第 2 节、第 3 节）。我们不应期待处于这种呈现方式下的命题能经证言传递。（对 Poston 2016 的回应，另见 Peet 2019）[^peet-2019][^poston-2016]。
