      One might respond (cf. Stanley 2011b)[^stanley-2011b] to this regress challenge that the student does not really understand the premises of an argument by *modus ponens* (*p*, if *p* then *q*), for that involves grasping the concept of a conditional, and on an inferentialist understanding (Boghossian 1996, 2003)[^boghossian-1996], that would dispose one to accept the conclusion of an inference by that rule. Inferentialism about meaning is, however, a controversial doctrine (for several criticisms, see Williamson 2011, 2012)[^williamson-2011]. Other replies might be available. Maybe the student does not represent the rule practically (see next section), or she is simply incapable of granting that the rule applies to this case, for that would explain her failure to be appropriately disposed to arrive at the conclusion, given the truth of the premises. (For yet other versions of the regress challenge, see Noë 2005: 285–6 and Hetherington 2006)[^hetherington-2006][^noë-2005].
    step1: |-
      对这一倒退挑战，有人可能回应（参 Stanley 2011b）[^stanley-2011b]说：这名学生其实并未真正理解由肯定前件式（*modus ponens*：*p*，若 *p* 则 *q*）所构成论证的前提，因为那要求把握条件句的概念；而按推论主义理解（Boghossian 1996, 2003）[^boghossian-1996]，把握该概念会使人倾向于接受依该规则所作推论的结论。然而，关于意义的推论主义本身是有争议的学说（若干批评见 Williamson 2011, 2012）[^williamson-2011]。其他回应也可能存在。也许这名学生并未以实践的方式表征该规则（见下一节），或者他根本无法承认该规则适用于此情形，而这恰好说明在前提为真的条件下，他为何未能适当地倾向于得出该结论。（关于该倒退挑战的另一些版本，见 Noë 2005: 285–6 与 Hetherington 2006）[^hetherington-2006][^noë-2005]。
