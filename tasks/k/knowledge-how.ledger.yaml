      为评估这一跨语言证据究竟确立了些什么，考虑语言学论证的一个新版本。令“*S* *V*s Φ”是某种语言 *L* 中知识-如何的归赋，它在英语中被正确地译为“*S* knows +（疑问句）how（*de se*）to Φ”。假定翻译至少保全真值条件，则“*S* *V*s Φ”在 *L* 中为真，当且仅当“*S* knows +（疑问句）how（*de se*）to Φ”在英语中为真。称此前提为**解释前提**。由去引号图式，“*S* 知道如何 Φ”在英语中为真，当且仅当 *S* 知道如何 Φ；于是我们有：“*S* *V*s Φ”在 *L* 中为真，当且仅当 *S* 知道如何 Φ。
