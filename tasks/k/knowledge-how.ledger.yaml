      The most recent debate on knowledge-how has intertwined with a debate on the nature of skills. While there is no consensus on what counts as a skill, by and large people take skills to manifest in purposeful and goal-directed activities and to be learnable and improvable through practice (Fitts & Posner 1967; Stanley & Krakauer 2013; Willingham 1998; Yarrow, Brown, & Krakauer 2009)[^fitts-1967][^stanley-2013][^willingham-1998]. Skills are usually contrasted with *knacks* (or mere talents). Some contrast them with habits (Pear 1926; Ryle 1949)[^pear-1926][^ryle-1949] in that these are performed automatically, whereas the exercise of intelligent capacities involves self-control, attention to the conditions, and awareness of the task. Others, instead, argue that understanding skill requires a better understanding of what habits amount to (Gallagher 2017; Hutto & Robertson 2020)[^gallagher-2017][^hutto-2020].
    step1: |-
      晚近关于知识-如何的争论，与关于技能本性的争论交织在一起。虽说对于什么算作技能尚无共识，但大体上人们认为技能表现于有目的、目标导向的活动中，且可通过练习学会并提高（Fitts & Posner 1967；Stanley & Krakauer 2013；Willingham 1998；Yarrow, Brown, & Krakauer 2009）[^fitts-1967][^stanley-2013][^willingham-1998]。技能通常与*诀窍*（或单纯的天赋）相对照。有些人把它与习惯相对照（Pear 1926；Ryle 1949）[^pear-1926][^ryle-1949]，理由是习惯自动执行，而智能能力的运用涉及自我控制、对条件的注意与对任务的觉察。另一些人则主张，理解技能需要更好地理解习惯究竟是什么（Gallagher 2017；Hutto & Robertson 2020）[^gallagher-2017][^hutto-2020]。
    step2: |-
