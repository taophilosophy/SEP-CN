      According to orthodox intellectualism, knowledge-how is a species of propositional knowledge. Revisionary intellectualism, instead, contends that although knowledge-how is a kind of knowledge-that, the relevant knowledge is *sui generis* and differs from standard propositional knowledge in some important ways. For example, Brogaard (2009, 2011) argues that, in general, knowledge can have cognitive abilities or practical abilities as its justificatory grounds. In the latter case, agents know in virtue of ability states that are not subject to the usual epistemic constraints that characterize belief states generated by cognitive abilities. Correspondingly, knowledge-how fits the bill for this practically grounded knowledge. Cath (2015b) argues that we should distinguish between *theoretical* knowledge-that and *practical* knowledge-that. The former is subject to the usual epistemic constraints, like being sensitive to Gettierization (cf. also Zardini 2013)[^zardini-2013]. The latter, instead, is not sensitive to the usual epistemic constraints of theoretical knowledge-that—and can therefore constitute knowledge-that even if Gettierized. Waights Hickman (2019) suggests that knowledge-how is a distinct kind of knowledge-that relation, characterized by knowing something in “the executive way”, which requires
    step1: |-
