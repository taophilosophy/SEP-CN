      Several philosophers have objected that intellectualists are giving undue weight to linguistic considerations and that other considerations, coming from the cognitive sciences, should be taken into account too, when thinking about the nature of knowledge-how (Noë 2005, 2011; Devitt 2011; Brown 2013; Johnson 2006; Glick 2011; Roth & Cummins 2011)[^brown-2013][^devitt-2011][^glick-2011][^johnson-2006][^noë-2005][^roth-2011]. It does not follow from this worry that the linguistic argument ought to be dismissed as lacking *any* evidential value. Consider an analogy. Arguably, the best theory of beliefs and desires is one on which these are propositional attitudes. This theory is compatible with how we ascribe beliefs and desires (i.e., ascriptions of beliefs are of the form “*S* believes that *p*”, where “*p*” is standardly taken to stand for proposition). But it is also compatible with folk psychology, according to which thinking of beliefs and desires as propositional attitudes helps explain behavior. By parity of reasoning, ideally, the best theory of knowledge-how should presumably be compatible *both* with our best psychological theory and our best linguistic theory of knowledge-how ascriptions (cf. Stanley 2011a, 2011b, 2011c; Cath 2015a for a defense of the linguistic methodology)[^cath-2015a][^stanley-2011a].
    step1: |-
      若干哲学家反对说，理智主义者给予了语言学考虑过重的分量；在思考知识-如何的本性时，也应把来自认知科学的其他考虑纳入进来（Noë 2005, 2011；Devitt 2011；Brown 2013；Johnson 2006；Glick 2011；Roth & Cummins 2011）[^brown-2013][^devitt-2011][^glick-2011][^johnson-2006][^noë-2005][^roth-2011]。但由此并不推出语言学论证应被视为毫无证据价值而弃置。试看一种类比。可以说，关于信念与欲望的最佳理论，是把它们视为命题态度的理论。该理论与我们如何归赋信念与欲望相容（即信念归赋的形式是“*S* 相信 *p*”，其中“*p*”按标准被理解为代表一个命题）。但它也与常识心理学相容：按后者，把信念与欲望视为命题态度有助于解释行为。依同理，理想地说，关于知识-如何的最佳理论，应当既与我们最好的心理学理论相容，也与我们最好的关于知识-如何归赋的语言学理论相容（参 Stanley 2011a, 2011b, 2011c；Cath 2015a 对语言学方法论的辩护）[^cath-2015a][^stanley-2011a]。
