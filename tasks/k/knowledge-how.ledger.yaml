      Some have observed that knowledge-how may differ from propositional knowledge in that, whereas the latter plausibly entails belief, knowledge-how does not (Dreyfus 1991, 2005; Wallis 2008; Brownstein & Michaelson 2016)[^brownstein-2016][^dreyfus-1991][^wallis-2008]. For example, consider Brownstein & Michaelson (2016)’s example. When catching a ball, ball players make anticipatory saccades to shift their gaze ahead of the ball one or more times during the course of its flight towards them. These players know how to catch a ball, and their way of catching a ball requires making anticipatory saccades when watching the ball as it falls. Yet, the players do not believe that making anticipatory saccades is part of how they catch the ball. Rather they believe that they are tracking the ball the whole time. However, from the fact that the subject has false beliefs about how she catches the ball, it does not follow that the subject does not *also* have correct beliefs about it. So, a natural response is that there is *some* sense in which the player correctly believes that his manner of tracking the ball has a chance of resulting in success.
    step1: |-
      有人观察到：知识-如何可能与命题知识不同——后者似乎蕴涵信念，前者则不然（Dreyfus 1991, 2005；Wallis 2008；Brownstein & Michaelson 2016）[^brownstein-2016][^dreyfus-1991][^wallis-2008]。例如，看 Brownstein & Michaelson（2016）的例子。接球时，球员会作预期性的眼跳，在球朝自己飞来期间一至多次把目光移到球的前方。这些球员知道如何接球，而他们接球的方式要求他们在看着球下落时作预期性眼跳。然而，球员并不相信作预期性眼跳是接球的方式。
    step2: |-
      有人观察到：知识-如何可能与命题知识不同——后者似乎蕴涵信念，前者则不然（Dreyfus 1991, 2005；Wallis 2008；Brownstein & Michaelson 2016）[^brownstein-2016][^dreyfus-1991][^wallis-2008]。例如，看 Brownstein & Michaelson（2016）的例子。接球时，球员会作预期性眼跳（anticipatory saccades），在球朝自己飞来期间一至多次把目光移到球的前方。这些球员知道如何接球，而他们接球的方式要求他们在看着球下落时作预期性眼跳。然而，球员并不相信作预期性眼跳是接球的方式。
