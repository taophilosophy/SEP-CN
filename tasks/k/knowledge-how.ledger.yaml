      Carter and Pritchard (2015a,b,c) develop an alternative view which does not equate knowledge-how with an ability, but it still gives ability a central theoretical role. In their view, knowing how to Φ is a cognitive achievement, *given* our abilities to Φ: if one successfully Φs because of one’s ability, then one knows how to Φ. And if one knows how to Φ, then one is positioned to successfully Φ because of one’s ability. Therefore, for them, knowledge-how does not reduce to the mere possession of abilities but it essentially involves the successful enactment of these abilities. Habgood-Coote (2019) defends the view that knowing how to Φ just is the ability to generate the right answers to the question of how to Φ. Although on this view, knowledge-how is a relation an agent bears to a proposition—one that answers the relevant practical question—this relation to a proposition is not understood in epistemic terms but in terms of dispositions (see also Audi 2017 and Farkas 2017)[^audi-2017][^farkas-2017].
    step1: |-
      Carter 与 Pritchard（2015a,b,c）发展了一种替代观点，它不把知识-如何等同于能力，但仍赋予能力以核心的理论角色。在他们看来，知道如何 Φ 是一种认知成就，**鉴于**我们 Φ 的能力：若人因其能力而成功地 Φ，则他知道如何 Φ；反之，若他知道如何 Φ，则他处于能够因其能力而成功 Φ 的位置。因此，对他们而言，知识-如何并不还原为单纯拥有能力，而是本质上涉及这些能力的成功实施。Habgood-Coote（2019）辩护的观点是：知道如何 Φ 恰恰就是能够就如何 Φ 这一问题生成正确答案的能力。尽管按这种观点，知识-如何是行动者与一个命题（即回答相关实践问题的命题）之间的关系，这一与命题的关系却不是以知识论术语、而是以倾向来理解的（另见 Audi 2017 与 Farkas 2017）[^audi-2017][^farkas-2017]。
