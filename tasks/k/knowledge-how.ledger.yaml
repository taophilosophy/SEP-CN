      Others have questioned **Logical form**—the claim that in knowledge-how ascriptions, the embedded complement is an interrogative. *Objectualists* claim that the complement of knowledge-how ascriptions (“how to Φ”) is not an interrogative but an “objectual” complement—one denoting ways to Φ instead of propositions representing these ways (Bengson & Moffett 2011a)[^bengson-2011a]. Objectualism is motivated by the consideration that “knowing how to Φ” seems to be equivalent to “knowing a way to Φ” in pretty much every context and by the apparent gradability of “knows-how” ascriptions (cf. section 3). An objectual semantics is in a good place to explain the gradability of knowledge-how ascriptions, since objectual knowledge ascriptions also permit degree modifiers—one can have partial knowledge of Paris, or know Paris better than someone else. Along similar lines, Bach (2012) and Abbott (2013) argue that in knowledge-how ascriptions “how to Φ” might work as a *free relative*. A free relative is a wh-phrase that denotes an individual. So for example, “what I was given for dinner” can be used as an interrogative in “I asked what I was given for dinner” but also as a free relative in “I ate what I was given for dinner”. In the latter ascription, it denotes some food that was given to me for dinner. In that sense, “how to Φ” according to this proposal, in “*S* knows how to Φ” should be interpreted as a free relative denoting a way to Φ, rather than an answer to the question “how to Φ?”
