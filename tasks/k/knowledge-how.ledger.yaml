      Intellectualists might object to EP in ways similar to how CP was resisted—i.e., that not every action requires for its performance the employment of one’s knowledge-how: only intentional actions do, as the clown example suggests. According to this line of reply, employing one’s propositional knowledge might be more like a reflex in response to stimuli, rather than an action. Further, this version of the regress challenge may be accused of assuming that knowledge-that is “behaviorally inert” and needs to be intentionally selected or employed in order to be manifested. Yet, intellectualists have independent reasons to resist this picture (Stalnaker 2012)[^stalnaker-2012]. On the other hand, if Ryleans insist that employments of knowledge-that are actions of sort, it seems there is no principled reason why employments of knowledge-how would not be subject to the same requirement. Therefore, it looks like any regress generated for the intellectualist is generated for Ryle as well (Stanley 2011b: 14, 26; though see Fantl 2011 for a possible difference between the regress generated for Ryle and the regress generated for intellectualism)[^stanley-2011b].
    step1: |-
      理智主义者可能以类似于抵抗 CP 的方式来反对 EP——也就是说，并非每个行动在执行时都要求运用知识-如何：只有意向性行动才如此，如小丑的例子所示。照这条回应路线，运用命题知识也许更像是对刺激的反射，而不是行动。进一步说，这一版本的倒退挑战可能被指责为假定命题知识是“行为上惰性的”，须被有意地选取或运用才能展现。但理智主义者有独立的理由来抵制这幅图景（Stalnaker 2012）[^stalnaker-2012]。另一方面，如果赖尔派坚持命题知识的运用也是一种行动，那么似乎没有原则性的理由说明为何知识-如何的运用不受同一要求约束。因此，看起来为理智主义生成的任何倒退，也同样为赖尔生成（Stanley 2011b: 14, 26；不过 Fantl 2011 认为为赖尔生成的倒退与为理智主义生成的倒退可能不同）[^stanley-2011b]。
    step2: |-
      理智主义者可能以类似抵抗 CP 的方式来反对 EP——即并非每个行动在执行时都要求运用知识-如何：只有意向性行动才如此，如小丑之例所示。按这条回应路线，运用命题知识或许更像对刺激的反射，而非行动。进一步说，这一版本的倒退挑战可能被指为：它假定命题知识“行为上惰性”，须有意地选取或运用方能展现。然而，理智主义者有独立的理由来抵制这幅图景（Stalnaker 2012）[^stalnaker-2012]。另一方面，若赖尔派坚持：运用命题知识本身也是一种行动，那么似乎没有原则性的理由说明为何运用知识-如何不受同一要求的约束。因此，看起来为理智主义生成的任何倒退，也同样为赖尔生成（Stanley 2011b: 14, 26；不过 Fantl 2011 认为为赖尔与为理智主义生成的倒退可能有所不同）[^stanley-2011b]。
