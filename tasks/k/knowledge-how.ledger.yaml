      Levy (2017) argues that a form of intellectualism that only invokes practical ways of thinking and practical concepts might not be able to explain skillful motor behavior, for motor representations of the sort required for skilled action and posited by cognitive psychologists are non-conceptual. Along similar lines, Fridland (2014, 2017) argues motor control and motor representation cannot be countenanced by Stanley & Williamson’s (2001) and Stanley’s (2011b) forms of intellectualism. So, more promising forms of intellectualism might have to invoke, in addition to practical ways of thinking, *non-conceptual practical representations* (Pavese 2019; Krakauer 2020)[^krakauer-2020][^pavese-2019]. Just like perceptual concepts are distinguished from non-conceptual perceptual representations, we might distinguish between practical conceptual representations and practical non-conceptual representations. Motor representations would fall under the latter heading. Nonconceptual motor representations also represent practically, as they break down a task in terms of the most basic operations that a system can perform.
    step1: |-
      Levy（2017）主张，一种只援引实践思维方式与实践概念的理智主义，也许无法解释熟练的运动行为，因为熟练行动所需的、且为认知心理学家所设定的那类运动表征是非概念的。沿着相似的路线，Fridland（2014, 2017）主张，Stanley & Williamson（2001）与 Stanley（2011b）形式的理智主义无法容纳运动控制与运动表征。所以，更有希望的理智主义形式也许必须在实践思维方式之外，还援引**非概念的实践表征**（Pavese 2019；Krakauer 2020）[^krakauer-2020][^pavese-2019]。正如知觉概念区别于非概念的知觉表征，我们也可以区分实践概念表征与实践非概念表征；运动表征属于后一类。非概念的运动表征也以实践方式表征，因为它们按系统所能执行的最基本操作来分解任务。
