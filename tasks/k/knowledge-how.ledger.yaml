      The notion of distinctively practical concepts is motivated by work outside the debate on intellectualism about knowledge-how. Other scholars have discussed concepts that are practical in that they dissociate from semantic and observational concepts and play a central role in explaining behavior. Peacocke (1986: 49–50) talks of “action-based ways of thinking”, Israel, Perry,and Tutiya (1993: 534) of “executable ideas”, and Pacherie (2000, 2006) of “action concepts”. Mylopoulous and Pacherie (2017) suggest that executable action concepts might be needed to overcome the interface problem—the problem of how cognitive representations (intentions) interact with motor representations (Butterfill & Sinigaglia 2014)[^butterfill-2014]. Pavese (forthcoming-b) advances an empirical-functional case for practical concepts, arguing that they are needed to explain a distinctive sort of productive reasoning. Yet, other intellectualists argue we can dispense with practical modes of presentation altogether and instead appeal to *ways of knowing* that are distinctively practical or executive (Waights Hickman 2019; Cath 2020)[^cath-2020][^waights-2019].
    step1: |-
      独特实践概念这一观念，其动机来自知识-如何之理智主义争论之外的研究。其他学者讨论过一些概念：它们之所以是实践的，在于它们与语义概念和观察概念相分离，并在解释行为时起核心作用。Peacocke（1986: 49–50）谈到“基于行动的思想方式”，Israel、Perry 与 Tutiya（1993: 534）谈到“可执行的观念”，Pacherie（2000, 2006）谈到“行动概念”。Mylopoulous 与 Pacherie（2017）提出，可能正需要可执行的行动概念来克服界面问题——即认知表征（意图）如何与运动表征相互作用的问题（Butterfill & Sinigaglia 2014）[^butterfill-2014]。Pavese（即将出版 b）为实践概念提出了一种经验-功能论证，主张需要它们来解释一种独特的生产性推理。然而，其他理智主义者主张，我们完全可以不用实践呈现方式，转而诉诸独特的实践性或执行性的**知道方式**（Waights Hickman 2019；Cath 2020）[^cath-2020][^waights-2019]。
