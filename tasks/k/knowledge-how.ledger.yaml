      Others have questioned whether the complement “which team is winning” in “*S* knows which team is winning” is, semantically, just like an interrogative (Brogaard 2009, 2011; Ginzburg 1995a, 1995b, 1996, 2011; Ginzburg & Sag 2000)[^brogaard-2009][^ginzburg-1995a][^ginzburg-2000]. One argument against this assumption is that, if, e.g., “which team is winning” denoted a question, we would expect it to co-refer with “the question of which team is winning”. Yet we cannot substitute such expression-pairs *salva veritate*. Suppose Jenny knows/discovered/revealed an interesting question and suppose the interesting question discovered by Jenny is “who left yesterday?”. Even so, it does not follow that Jenny knows/discovered/revealed who left yesterday. A response to this objection might be that these examples exploit a subtle equivocation (Stanley 2011b: ch. 2, following King 2002)[^king-2002][^stanley-2011b]. Consider “Jamaal discovered a new element”. In it, “discovered” denotes a relation between Jamaal and an object, a chemical element. On the other hand, in the sentence “Jamaal discovered who left yesterday”, “discovered” denotes a different relation, one that holds between Jamaal and something of a different sort, namely, the proposition answering the question expressed by “who left yesterday”. It is this second relation which is relevant for the intellectualist. This is supported by the fact that the “[t]he former relation would be expressed in German by ‘*kennen*’, and the latter by ‘*wissen*’” (Stanley 2011b: 66)[^stanley-2011b]. (For more relevant discussion, see Parent 2014.)[^parent-2014]
    step1: |-
      另一些人质疑，“*S* 知道哪支队伍在获胜”中的补语“哪支队伍在获胜”，在语义上是否就等同于一个疑问句（Brogaard 2009, 2011；Ginzburg 1995a, 1995b, 1996, 2011；Ginzburg & Sag 2000）[^brogaard-2009][^ginzburg-1995a][^ginzburg-2000]。针对这一假定的一个论证是：若“哪支队伍在获胜”指谓一个问题，我们就应期待它与“哪支队伍在获胜这个问题”同指；然而我们无法在保全真值的条件下替换这样的表达式对。设珍妮知道／发现／揭示了一个有趣的问题，并设珍妮发现的这个有趣问题是“昨天谁离开了？”；即便如此，也推不出珍妮知道／发现／揭示了昨天谁离开了。对这一反对意见的一个回应可以是：这些例子利用了一种微妙的歧义（Stanley 2011b: 第 2 章，循 King 2002）[^king-2002][^stanley-2011b]。试看“贾马尔发现了一种新元素”。其中“发现”指谓贾马尔与一个对象（一种化学元素）之间的关系。另一方面，在“贾马尔发现昨天谁离开了”这句话中，“发现”指谓另一种关系，它成立于贾马尔与某种别的东西之间，即回答“昨天谁离开了”所表达问题的命题。对理智主义者相关的正是这第二种关系。这一点为如下事实所支持：“前一种关系在德语中以 *kennen* 表达，后一种关系以 *wissen* 表达”（Stanley 2011b: 66）[^stanley-2011b]。（更多相关讨论见 Parent 2014。）[^parent-2014]
