      Recent discussions on skill include a renewed debate on the nature of skilled action—i.e., on the sort of processes that are involved in the manifestation of skills. The most recent discussion on skilled action concerns the extent to which they are automatic or under conscious control. A long tradition has taken skilled action to be paradigmatically a matter of “absorbed coping” (Heidegger 1927; Merleau-Ponty 1945 [1962]; Dreyfus 1991)[^dreyfus-1991][^heidegger-1927][^merleau-ponty-1945]—characterized as immersion in the situation and intuitive response to its demands, with little awareness of the body, tools or even possibly the activity itself. Following Dreyfus and the phenomenological tradition, some enactivists (e.g., Noë 2004)[^noë-2004] highlight the analogies between skillful behavior and perception; other enactivists (e.g., Gallagher 2017; Hutto & Robertson 2020)[^gallagher-2017][^hutto-2020] argue that in order to understand the automaticity and unreflectiveness of skilled action, we ought to better understand habitual behavior. Even outside the phenomenological tradition, people have emphasized the unreflective aspect of skilled action. For example, Papineau (2013) argues that skilled actions are typically too fast for conscious control. One important argument for the unreflectiveness of skilled action starts from the phenomenon of choking under pressure, where an individual performs significantly worse than would be expected in a high-pressure situation. This phenomenon has been taken to be evidence that skillful action proceeds without conscious attention, because choking episodes are thought to arise from the fact that anxiety leads one to focus and direct one’s mind on the performance, which would proceed smoothly if mindless (Baumeister 1984; Masters 1992; Beilock & Carr 2001; Ford, Hodges, & Williams 2005; Jackson, Ashford, & Norsworthy 2006; Gucciardi & Dimmock 2008)[^baumeister-1984][^beilock-2001][^gucciardi-2008][^masters-1992]. Some argue that unreflectiveness also characterizes skillful joint action (Høffding 2014; Gallagher and Ilundáin-Agurruza 2020)[^gallagher-2020][^høffding-2014].
    step1: |-
      晚近关于技能的讨论，包括一场关于熟练行动本性——即技能展现涉及何种过程——的重新开启的争论。关于熟练行动最新的讨论，关涉它在多大程度上是自动的、或在有意识控制之下。悠久的传统把熟练行动典型地理解为“沉浸式应对”（Heidegger 1927；Merleau-Ponty 1945 [1962]；Dreyfus 1991）[^dreyfus-1991][^heidegger-1927][^merleau-ponty-1945]——其特征在于沉浸于情境、对其要求作直觉回应，对身体、工具乃至活动本身都少有觉察。循德雷福斯与现象学传统，一些生成论者（如 Noë 2004）[^noë-2004]强调熟练行为与知觉之间的类比；另一些生成论者（如 Gallagher 2017；Hutto & Robertson 2020）[^gallagher-2017][^hutto-2020]主张，为理解熟练行动的自动性与非反思性，我们应当更好地理解习惯性行为。即便在现象学传统之外，人们也强调熟练行动的非反思面向。例如，Papineau（2013）主张，熟练行动通常快到无法受意识控制。支持熟练行动非反思性的一个重要论证始于“高压下失常”（choking under pressure）现象：在高压情境中，个体的表现显著差于预期。这一现象被当作熟练行动无意识进行的证据，因为失常事件被认为源于焦虑使人把心神聚焦并导向表现本身，而若无心地让表现自行展开便不会失常（Baumeister 1984；Masters 1992；Beilock & Carr 2001；Ford, Hodges, & Williams 2005；Jackson, Ashford, & Norsworthy 2006；Gucciardi & Dimmock 2008）[^baumeister-1984][^beilock-2001][^gucciardi-2008][^masters-1992]。有人主张，非反思性也是熟练联合行动的特征（Høffding 2014；Gallagher and Ilundáin-Agurruza 2020）[^gallagher-2020][^høffding-2014]。
    step2: |-
