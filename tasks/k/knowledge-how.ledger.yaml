      The argument from cognitive science against intellectualism starts by pointing out that cognitive scientists distinguish between different kinds of cognitive systems: It is often held that the *declarative system* is responsible for encoding propositional knowledge, whereas knowledge-how is encoded in the *procedural system*. Given empirical evidence that the declarative and procedural systems are separate (about which more below), it would seem to follow that knowledge-how is not reducible to propositional knowledge (Wallis 2008; Devitt 2011; Roth & Cummins 2011)[^devitt-2011][^roth-2011][^wallis-2008]:
    step1: |-
      反对理智主义的认知科学论证，首先指出认知科学家区分了不同种类的认知系统：人们常认为，**陈述性系统**负责编码命题知识，而知识-如何则编码于**程序性系统**。鉴于有实证证据表明陈述性系统与程序性系统是分离的（详见下文），似乎便可推出：知识-如何不可还原为命题知识（Wallis 2008；Devitt 2011；Roth & Cummins 2011）[^devitt-2011][^roth-2011][^wallis-2008]：
    step2: |-
      反对理智主义的认知科学论证，首先指出认知科学家区分了不同种类的认知系统：人们常认为，**陈述性系统** 负责编码命题知识，而知识-如何则编码于 **程序性系统**。鉴于实证证据表明陈述性系统与程序性系统彼此分离（详见下文），似乎便可推出：知识-如何不可还原为命题知识（Wallis 2008；Devitt 2011；Roth & Cummins 2011）[^devitt-2011][^roth-2011][^wallis-2008]：
