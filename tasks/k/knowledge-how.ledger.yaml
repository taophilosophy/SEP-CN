      According to the standard syntactic analysis, (2)–(5) have an interrogative as complement—“where is her piano located in the house?”, “who can play the piano?”, “what to do in case of an emergency?” are all interrogatives. Having said this, in broad outline, the linguistic argument for intellectualism has three steps. The first step is to follow the syntactic cues from (1)–(5) and identify the logical form of “*S* knows how to Φ” with that of “*S* knows + interrogative *Q* (= “how to Φ”). Call this premise **Logical Form**. The second step is to accept the orthodox semantics of knowledge-wh ascriptions, according to which in “*S* knows + interrogative *Q*”, *Q* denotes a question (C. Baker 1968)[^baker-1968] and according to which “*S* knows + *Q*” is true just in case *S* knows a proposition answering to the question expressed by *Q*. Call this premise **Semantics for Knowledge-Wh** (cf., among many others, Hamblin 1958, 1973; Hintikka 1976; Karttunen 1977; Heim 1994; Groenendijk & Stokhof 1982, 1997; and Higginbotham 1996)[^groenendijk-1982][^hamblin-1958][^heim-1994][^higginbotham-1996][^hintikka-1976][^karttunen-1977]. Finally, the third step is to extend this semantics to knowledge-how ascriptions, such that knowing how to Φ requires knowing a proposition that answers the question “how can one Φ?”
    step1: |-
      按标准的句法分析，(2)–(5) 以疑问句为补语——“她的钢琴在屋里何处？”“谁能弹钢琴？”“在紧急情况下该做什么？”都是疑问句。话虽如此，大体上，理智主义的语言学论证分三步。第一步是循 (1)–(5) 的句法线索，把“*S* 知道如何 Φ”的逻辑形式与“*S* 知道 + 疑问句 *Q*（＝“如何 Φ”）”的逻辑形式等同起来。称此前提为**逻辑形式**。第二步是接受 wh-知识归赋的正统语义学：按此，在“*S* 知道 + 疑问句 *Q*”中，*Q* 指谓一个问题（C. Baker 1968）[^baker-1968]；且“*S* 知道 + *Q*”为真，当且仅当 *S* 知道一个回答 *Q* 所表达问题的命题。称此前提为**wh-知识语义学**（参见 Hamblin 1958, 1973；Hintikka 1976；Karttunen 1977；Heim 1994；Groenendijk & Stokhof 1982, 1997；Higginbotham 1996 等）[^groenendijk-1982][^hamblin-1958][^heim-1994][^higginbotham-1996][^hintikka-1976][^karttunen-1977]。最后第三步，把这一语义学扩展至知识-如何归赋：知道如何 Φ，要求知道一个回答“人如何能 Φ？”这一问题的命题。
    step2: |-
      按标准的句法分析，(2)–(5) 都以疑问句为补语——“她的钢琴在屋里何处？”“谁能弹钢琴？”“在紧急情况下该做什么？”都是疑问句。话虽如此，大体上，理智主义的语言学论证分三步。第一步，循 (1)–(5) 的句法线索，把“*S* 知道如何 Φ”的逻辑形式与“*S* 知道 + 疑问句 *Q*（＝“如何 Φ”）”的逻辑形式等同起来。称此前提为 **逻辑形式**。第二步，接受 wh-知识归赋的正统语义学：按此，在“*S* 知道 + 疑问句 *Q*”中，*Q* 指谓一个问题（C. Baker 1968）[^baker-1968]；“*S* 知道 + *Q*”为真，当且仅当 *S* 知道一个回答 *Q* 所表达问题的命题。称此前提为 **wh-知识语义学**（参见 Hamblin 1958, 1973；Hintikka 1976；Karttunen 1977；Heim 1994；Groenendijk & Stokhof 1982, 1997；Higginbotham 1996 等）[^groenendijk-1982][^hamblin-1958][^heim-1994][^higginbotham-1996][^hintikka-1976][^karttunen-1977]。第三步，把这一语义学扩展至知识-如何归赋：知道如何 Φ，要求知道一个回答“人如何能 Φ？”这一问题的命题。
