    source: |-
      The contemplation argument aims at showing the falsity of SI, by showing that its truth, together with the truth of AP and CP, triggers an infinite regress. If SI were true, then performing any action would require contemplating an infinite number of propositions of ever-increasing complexity. On the assumption that this cannot be done in a finite amount of time, the argument goes, accepting SI would lead to the clearly absurd conclusion that no agent could ever perform an action within a finite time (see Fantl 2011: 122).
    step1: |-
      沉思论证意在表明 SI 是假的：表明它的真，连同 AP 与 CP 的真，会触发无穷倒退。如果 SI 是真的，那么执行任何行动都将要求沉思无穷多个复杂度不断增加的命题。在这个无法在有限时间内完成的假定下，论证继续说，接受 SI 就会导致一个明显荒谬的结论：没有任何行动者能在有限时间内执行任何行动（见 Fantl 2011: 122）。
    step2: |-
      沉思论证意在表明 SI 为假：其真，连同 AP 与 CP 为真，会触发无穷倒退。若 SI 为真，则执行任何行动都将要求沉思无穷多个复杂度递增的命题。该论证接着说，假定这无法在有限时间内完成，则接受 SI 将导致一个显然荒谬的结论：任何行动者在有限时间内都无法执行任何行动（见 Fantl 2011: 122）。
  - id: 21
    kind: body
    source: |-
      The question is whether AP and CP are plausible premises. Following Ginet (1975), Stanley & Williamson (2001) argue that AP is plausible only if the relevant Φ is an *intentional* action. To use one of Ryle’s (1949: 33) own examples, if a clumsy person inadvertently tumbles, it does not follow that in doing so, they employ their knowledge-how to tumble. By contrast, the clown employs their knowledge-how when they tumble on purpose. Nevertheless, if we restrict AP to intentional actions, then the regress can be stopped by observing that contemplating a proposition might happen non-intentionally. For example, when I employ my knowledge that there is a red light ahead by applying the brakes, I need not intentionally contemplate the proposition that there is a red light ahead. Correspondingly, if contemplating a proposition can be done non-intentionally, such contemplation is not the kind of action that requires us to know how to perform it—therefore, it does not trigger the restricted AP and the regress is blocked altogether. Some object that the contemplation in this example might be intentional but *unconscious* (as suggested by Noë 2005: 282)[^noë-2005]. But it is unclear what reasons there are for thinking that every time one employs one’s knowledge, one intentionally contemplates the relevant proposition (Cath 2013: 365–366)[^cath-2013].
    step1: |-
      问题在于 AP 和 CP 是否是合理的前提。继 Ginet（1975）之后，Stanley & Williamson（2001）认为 AP 只有在相关 Φ 是意向性行动时才合理。用赖尔（1949: 33）自己的一个例子说，如果一个笨拙的人不留意跌倒，并不能推出他这样做时运用了自己关于如何跌倒的知识。相反，小丑有意跌倒时才运用了自己的知识-如何。然而，如果我们把 AP 限制于意向性行动，那么可以通过指出沉思一个命题可能是非意向地发生的来阻断倒退。例如，当我踩刹车以运用“前方有红灯”这一知识时，我不必有意地沉思“前方有红灯”这个命题。相应地，如果沉思一个命题可以非意向地完成，那么这种沉思就不是那种要求我们知道如何去做的行动——因此它不触发受限的 AP，倒退便被完全阻断。有人反驳说，这个例子中的沉思可能是有意的，但却是潜意识的（如 Noë 2005: 282 所提示）[^noë-2005]。但很难说有什么理由认为，人每次运用自己的知识，都在有意地沉思相关的命题（Cath 2013: 365–366）[^cath-2013]。
    step2: |-
      问题在于 AP 与 CP 是否为合理的前提。继 Ginet（1975）之后，Stanley & Williamson（2001）主张：AP 只有在相关 Φ 为 **意向性** 行动时才合理。用赖尔（1949: 33）自己的一个例子说，若一个笨拙的人不慎跌倒，并不能推出他这样做时运用了自己关于如何跌倒的知识；相反，小丑有意跌倒时才运用了其知识-如何。然而，若把 AP 限于意向性行动，则可通过指出沉思一个命题可能是非意向地发生的来阻止倒退。例如，当我踩刹车以运用“前方有红灯”这一知识时，我不必有意地沉思“前方有红灯”这个命题。相应地，若沉思一个命题可以非意向地完成，则这种沉思便不是那种要求我们知道如何去做的行动——因此它不触发受限的 AP，倒退便被完全阻断。有人反驳说，此例中的沉思可能有意为之，只不过 **是无意识的**（如 Noë 2005: 282 所提示）[^noë-2005]。但很难说有什么理由认为：人每次运用自己的知识，都在有意地沉思相关命题（Cath 2013: 365–366）[^cath-2013]。
