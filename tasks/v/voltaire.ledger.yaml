      Yet standing against those that leave the matter there by concluding that there is no liberty in human action at all, Voltaire adopts a more nuanced understanding. Asserting that the word “liberty” means “to be able,” and must be distinguished from the word “wish,” which means “to desire,” it is essential that we understand that “to will is to wish, and to be free is to be able” (142). For any choice to be an exercise of “free will,” therefore, it must be a choice enabled by the deterministic power to act, or, to use his terms, the power that makes us able to realize the wish. A human wish, or desire, alone is impotent unless it acts with a power capable of acting in the world. “What is this power,” Voltaire asks? “It is the effect of the constitution and present state of our organs,” he responds, stressing again the deterministic physiological character of this power in human being (144).
