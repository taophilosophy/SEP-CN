      Answering in this way the charge that such a view reduces human moral conduct to the level of animals and to a machine-like determinism, Voltaire counters by offering an example of how human moral conduct can be improved even if the solution can only be achieved through a physiological altering of the powers motivating our sensate experience of morally righteous actions. “If a brigand is executed,” Voltaire theorizes, “his accomplice who sees him expire has the liberty of not being frightened at the punishment,” a response which means that his organs are not generating horror at that spectacle. If his will is determined by this absence of horror, the accomplice very well might go from the scaffold to assassinate on the highway again. “But if the organs of the accomplice are stricken with horror,” Voltaire concludes, “and make him experience an unconquerable terror, he will stop robbing” (144).
