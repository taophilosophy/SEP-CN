      Vives holds that the best means to secure the reform of society is through the moral and practical training of the individual. In his view, there are two related paths which are necessary to develop our humanity: education and action. Education is fundamental in order for us to rise above our animal instincts and realize our full potential as human beings. However, learning needs to be applied in every day life, especially for the public good (see Verbeke, 2014)[^verbeke-2014]. Man, by his own nature, is a social being: “Experience proves every day that man was created by God for society, both in this and in the eternal life. For this reason God inspired in man an admirable disposition of benevolence and good will toward other men” (VI, 222–3). In the first book of *De subventione pauperum*, which consists of a theoretical discussion of the human condition, he stresses not only our need for and dependency on others, but also our natural inclination to love and help one another. He regards the development of society as a distinctly human achievement, based on the ability to profit from experience and turn knowledge to useful ends. Social problems, such as poverty and war, are the result of emotional disorders. During Vives’ lifetime, Europe experienced dissension and war between princes and within the church, as well as the increased threat posed by Muslim expansion into Western Europe. He addressed the problem of political and religious disturbances in several works, which also deal with the psychological origins of discord, the proper conduct of all the offices of the commonweal, and the theme of Christian harmony. His mayor political text on European war and peace is *De concordia et discordia in humano genere* where he sets out the case for the origins of discord in society and he aims to show how peace and concord can be fostered through knowledge of human nature, especially the emotions. According to him, the virtue of the people can only be maintained and promoted in peace. “In war, as in a sick body, no member exercises its office properly” (V, 180–1). Vives deplored the Italian war between France and Spain (1521–6), which, he felt, completely ignored the rights of the suffering population, and accused Francis I and Charles V of irresponsibility and criminal ambition (VI, 480). In these circumstances, he often referred to the notion of natural law, which, as he explains in his preface to Cicero’s *De legibus* (*On the Laws*), has the same validity everywhere because it was impressed on the heart of every human being before birth (V, 494).
    step1: |-
      比韦斯认为，确保社会改革的最佳手段是对个人进行道德与实践的训练。在他看来，有两条相关的路径为人性的发展所必需：教育与行动。教育是根本，使我们超脱动物本能、实现作为人的全部潜能。然而学问须在日常中运用，尤其是为公共利益（参 Verbeke 2014）[^verbeke-2014]。人依其本性是社会性的存在：“经验日日证明，人是上帝为社会而造的，无论在今生还是在永生。因此上帝在人心中植入了对他人的仁厚与善意的可佩禀性”（VI，222–223）。《论济贫》第一卷是对人类状况的理论讨论，他在其中不仅强调我们对他人之所需与所赖，也强调我们相互爱护、相互扶助的自然倾向。他把社会的发展看作一项独特的人类成就，其基础在于从经验中获益、把知识用于有用目的的能力。社会问题，如贫困与战争，是情感失序的结果。比韦斯在世时，欧洲经历诸侯之间与教会内部的纷争与战争，又面临穆斯林向西域扩张所带来的日益加剧的威胁。他在数部著作中处理政治与宗教动荡问题，这些著作还讨论不和的心理根源、公共福祉各部门的恰当运作，以及基督教和谐的主题。他论欧洲战争与和平的主要政治文本是《论人类的和睦与不和》，其中陈述社会不和之起源，并力图说明如何借对人性的认识、特别是对情感的认识来培育和平与和睦。依他之见，人民的德性只有在和平中才能维持与增进。“在战争中，正如在病体之中，没有哪个成员能各尽其职”（V，180–181）。比韦斯谴责法国与西班牙之间的意大利战争（1521–1526），认为它全然无视受苦民众的权利，并指斥法兰西一世与查理五世不负责任、野心罪恶（VI，480）。在此局势下，他常援引自然法观念；正如他在西塞罗《论法律》序言中所解释的，自然法在到处同样有效，因为它在每个人出生之前就已印在其心上（V，494）。
    step2: |-
      社会改革的最好办法，比韦斯以为在于对个人施以道德与实践的训练。在他看来，发展人性有两条相关的路：教育与行动。教育是根本，使人超脱兽性本能，尽显为人的潜能；但学问须在日常中施用，尤其要谋公共利益（参 Verbeke 2014）[^verbeke-2014]。人就其本性而言是社会性的存在者：“经验日日证明，人是上帝为社会所造，今生与永生皆然。因此上帝在人心里植入了对他人的仁厚与善意”（VI，222–223）。《论济贫》第一卷从理论上讨论人的处境，既强调我们对他人的需要与依赖，也强调我们相互爱护扶助的自然倾向。他把社会的发展看作一项特属于人的成就，其根基是从经验得益、把知识用于有用目的的能力。贫困、战争这类社会问题，都是情感失调的结果。比韦斯在世之时，欧洲诸侯相争、教会内讧，又有穆斯林向西欧扩张的威胁日增。他屡屡著文讨论政治与宗教的骚动，兼及不和的心理学根源、公共福祉诸部门的正当运作、基督教和谐之题。其论欧洲战与和的主要政治文本是《论人类的和睦与不和》：陈明社会不和的起源，力图说明如何凭对人性的认识——尤其是对情感的认识——培育和平与和睦。他以为，民德唯在和平中得以维持、得以长进。“战时的身体如同病体，没有一个肢体能尽其职分”（V，180–181）。他痛斥法西两国间的意大利战争（1521–1526）全不顾罹难民众的权利，责法兰西一世与查理五世不负责任、野心滔天（VI，480）。处此境地，他常举自然法为说；如他在西塞罗《论法律》序中所解，自然法到处有效，因它在人出生之前已刻入人心（V，494）。
