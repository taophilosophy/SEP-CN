  - id: 9
    kind: body
    source: |-
      Vives’ career as a leading northern European humanist starts with the publication in 1519 of *In pseudodialecticos*, a satirical diatribe in which he voices his opposition to scholastic logic on several counts. He follows in the footsteps of earlier humanists such as Lorenzo Valla (1406–57) and Rudolph Agricola (1443–85), who set about to replace the scholastic curriculum, based on syllogistic and disputation, with a treatment of logic oriented toward the use of the topics, a technique of verbal association aiming at the invention and organization of material for arguments, and persuasion. Vives’ severe censure of scholastic logic derived from his own unhappy experience with the scholastic curriculum at Paris. Therefore, as he himself emphasized, no one could accuse him of “condemning it because he did not understand it” (*Opera omnia*, 1964, III, 38; all quotations below are from this edition). Erasmus wrote to More that no one was better suited for the battle against the dialecticians, in whose ranks he had served for many years.
    step1: |-
      比韦斯作为北欧人文主义领军人物的事业，始于 1519 年《驳伪辩证论者》的出版。这是一篇讽刺性的檄文，他在其中从若干方面表达了对经院逻辑的反对。他追随劳伦佐·瓦拉（1406–1457）与鲁道夫·阿格里科拉（1443–1485）等前辈人文主义者的脚步：这些人着手以面向论题术（一种旨在发明并组织论证材料、服务于说服的语词联想技术）的逻辑论述，取代以三段论与论辩为基础的经院课程。比韦斯对经院逻辑的严厉责难，源于他本人在巴黎修习经院课程的不快经历。因此，如他本人所强调的，谁也不能指责他“因为不懂而加以谴责”（《全集》，1964 年版，第 III 卷，第 38 页；下文引文均出此版）。伊拉斯谟致信莫尔说，没有人比他更适合投身于对辩证论者的战斗——他曾在这些人中间效力多年。
    step2: |-
      比韦斯之成为北欧人文主义的领军人物，自 1519 年《驳伪辩证论者》问世始。这篇讽刺檄文从几个方面表明他对经院逻辑的敌意。他步劳伦佐·瓦拉（1406–1457）、鲁道夫·阿格里科拉（1443–1485）等前辈人文主义者的后尘。这些人要废掉以三段论和论辩为底的经院课程，代之以面向论题术的逻辑；后者是一种语词联想的技术，用来发明、组织论证材料，并服务于说服。比韦斯对经院逻辑的苛责，本于他在巴黎亲历经院课程的痛苦经验。所以他特别声明：谁也不能说他“因不懂而贬斥”（《全集》1964 年版，第 III 卷，38 页；以下引文皆出此版）。伊拉斯谟写信告诉莫尔：再没有谁比他更适于同辩证论者作战了——他曾在他们的行伍里待过多年。
