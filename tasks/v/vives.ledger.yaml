      The structure of the treatise is indebted to the traditional approach of faculty psychology, in which the soul is said to be composed of a number of different faculties or powers, each directed toward a different object and responsible for a distinct operation. The first book covers the functions of the vegetative soul (nutrition, growth and reproduction), of the sensitive soul (the five external senses), and of the cogitative soul (the internal senses, i.e., a variety of cognitive faculties, including imagination, fantasy and the estimative power, which are located in the three ventricles of the brain, and whose acts follows from the acts of the external senses). The second book deals with the functions of the rational soul and its three faculties (mind, will, and memory), as well as with topics stemming from Aristotle’s *Parva naturalia*, such as sleep, dreams, and longevity. The third and final book explores the emotions, which Vives, rejecting the Stoic view, regards as natural responses to the way things appear to us and as essential constituents of human life.
    step1: |-
      该论著的结构受益于官能心理学的传统进路：灵魂由若干不同的官能或能力组成，各各指向不同对象、司掌不同运作。第一卷论植物灵魂的功能（营养、生长与生殖）、感觉灵魂的功能（五种外部感官）以及思维灵魂的功能（内部感官，即想象、幻想、估计力等种种认知官能，位于大脑的三个脑室，其活动随外部感官的活动而起）。第二卷论理性灵魂的功能及其三种官能（心智、意志与记忆），并论源于亚里士多德《自然短篇》的题目，如睡眠、梦与长寿。第三卷亦即末卷探究情感；比韦斯拒斥斯多葛观点，视情感为对事物向我们显现之方式的自然反应，是人生不可或缺的构成。
