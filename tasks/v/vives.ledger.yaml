      The main targets of Vives’ criticism are Peter of Spain’s *Summule logicales*, a work dating from the thirteenth century but which still held an important place in the university curriculum, and the theory of the property of terms, a semantic theory dealing with properties of linguistic expressions such as signification, i.e., the meaning of a word regardless of context, and supposition, i.e., the meaning of a word within the context of its use in a proposition. He repudiates the use of technical jargon, accessible only to a narrow group of professionals, and maintains that if scholastic logicians made an effort to speak plainly and according to common usage, many of their conundrums would disappear. Instead, they choose to fritter away their ingenuity on logically ambiguous propositions known as *sophismata*. Vives provides many examples of such propositions, which in his view make no sense whatever and are certainly of no use. Many of these, such as “Some animal is not man, therefore some man is not animal” (III, 54), were standard scholastic examples. Others, such as “Only any non-donkey *c* of any man except Socrates and another *c* belonging to this same man begins contingently to be black” (III, 40), are intended as a mockery of the futile quibbling he associated with scholastic method. Since dialectic, like rhetoric and grammar, deals with language, its rules should be adapted to the rules of ordinary language; but with what language, he asks, have these propositions to do? Moreover, dialectic should not be learned for its own sake, but as a support for the other arts; therefore, no more effort should be spent on it than is absolutely necessary. Vives’ criticism is also informed by ethical concerns and the demand for a method that would be of use in everyday life rather than in academic disputations. In contrast to the standard interpretation, it has been argued that *In pseudodialecticos* is not a serious refutation of scholasticism, but rather a sophistical exercise replete with fallacious arguments, whose purpose is to teach a valuable lesson in scholastic dialectic challenging the reader to detect the many logical fallacies that it contains. According to this interpretation, *In pseudodialecticos* offers no serious arguments against scholastic logical theory or principles (see Perreiah, 2014, ch.4)[^perreiah-2014].
    step1: |-
      比韦斯批评的主要对象，是西班牙的彼得的《逻辑纲要》——一部成于十三世纪、却仍在大学课程中占重要地位的著作——以及词项属性理论。后者是一种语义理论，处理语言表达式的种种属性，如意谓（词在语境之外的意义）与指代（词在命题中使用语境中的意义）。他拒斥只有少数专业人士才懂的行话，主张经院逻辑学家若能平实说话、依循通行用法，许多难题自会消失。他们却偏要把巧思耗在逻辑上有歧义的命题上，即所谓诡辩题（*sophismata*）。比韦斯举了许多此类命题的例子，认为它们全无意义，更无用处。其中不少是经院例题，如“有的动物不是人，所以有的人不是动物”（III，54）；另一些则是为讥讽他所联想的经院方法的无谓诡辩而造，如“唯有任何人的任一非驴的 *c*（苏格拉底除外）与属于同一个人的另一个 *c* 才开始偶然地变黑”（III，40）。既然辩证法与修辞学、语法一样处理语言，其规则就应适应日常语言的规则；但他问：这些命题究竟与何种语言有关？再者，辩证法不该为自身而学，而应作为其他技艺的辅助；因此，花在它上面的工夫不应超过绝对必需。比韦斯的批评还出于伦理关切，以及一种要求：方法应对日常生活有用，而非用于学院论辩。与标准解释相反，有论者主张《驳伪辩证论者》并非对经院哲学的严肃驳斥，而是一篇充斥谬误论证的诡辩练习，其用意在于教授一堂有价值的经院辩证法课程，让读者去发现其中大量的逻辑谬误。依此解释，《驳伪辩证论者》并未提出任何反对经院逻辑理论或原则的严肃论证（参 Perreiah 2014，第 4 章）[^perreiah-2014]。
    step2: |-
      比韦斯攻击的靶心有二：其一，西班牙的彼得《逻辑纲要》——十三世纪旧作，却仍在大学课程中占一席要地；其二，词项属性理论。后者属语义学，讨论语言表达式的诸种属性：意谓，即词在语境之外的意义；指代，即词在命题使用语境中的意义。他厌弃只有少数行家才懂的行话，断言经院逻辑学家若肯按通行用法平实说话，许多难题自会烟消云散。他们却宁可把聪明耗在逻辑上有歧义的命题上，即所谓诡辩题（*sophismata*）。比韦斯列举了许多这类命题，认为它们毫无意义，更无用处。其中不少是经院例题，如“有的动物不是人，所以有的人不是动物”（III，54）；有些则是为嘲弄他所归咎于经院方法的无聊诡辩而造，如“唯有任何人的任一非驴的 *c*（苏格拉底除外）与属于此人的另一个 *c* 才开始偶然地变黑”（III，40）。辩证法既与修辞学、语法同属语言之事，其规则便应合于日常语言的规则；可他追问：这些命题究竟关涉何种语言？何况辩证法不该为自身而学，只应充当其他技艺的辅翼，故不该在它身上多费一丝气力。比韦斯的批评还含伦理关切：他要求一种在日常生活中管用的方法，而非供学院论辩之用。与通行解释相反，也有论者认为《驳伪辩证论者》并非对经院哲学的严肃反驳，而是一场充满谬误论证的诡辩演练。其用意在授一堂有价值的经院辩证法课：请读者自行寻出其中的重重谬误。照此说，《驳伪辩证论者》对经院逻辑的理论与原则并无严肃论证（参 Perreiah 2014，第 4 章）[^perreiah-2014]。
