      他主张，人类探究最可靠的向导，是人天生向善向真的倾向。他称之为心灵之光；这光总是直接或间接地朝向善与真，可视为明智以及一切科学与技艺的开端与本原。这种自然倾向若能接受教导与练习，便可臻于完善，犹如植物的种子经农夫勤手栽培而长得更好。他在西塞罗的记述中为这一想法找到哲学依据（参《论神性》I.43–45）：希腊化理论中的前概念（*anticipationes*）与自然概念（*naturales informationes*），我们并非从师授或习俗学得，而是得自自然（III，356–357）。论题术——比韦斯视之为存在秩序的映现——是人类探究的另一件利器。在他看来，论题是事物的一组普遍面相，有助于为自然的繁复多样建立秩序；因此它们作为知识的组织原则十分重要。它们像一张网格，知识可经此获得，论证可借此构成（参 Nauta 2015）[^nauta-2015]。然而，人类知识终究只能是对创造的有限分有。由于人堕落状态所特有的限制，对自然领域的探究只能引出猜测，而不能引出牢固不疑的知识——那既非我们所应得，也非我们所需。比韦斯在《论第一哲学》中写道：“人类探究得出的是猜测性结论，因为我们不配拥有确定的知识（*scientia*）——我们既为罪所污，便背负身体的沉重负担；我们也不需要它，因为我们看到人被命为月下世界万物的主宰”（III，188）。在他看来，确定性并非科学与哲学进步的前提；作为科学进步与理性生活的标准，他提倡一种基于经验的健全判断的方法。
