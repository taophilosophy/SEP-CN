      汉斯（本名约翰内斯）·费英格的早年生活，在许多方面都像十九世纪德国一位典型知识分子的生活。他 1852 年 9 月 25 日生于图宾根附近，是牧师约翰·格奥尔格·费英格（Johann Georg Vaihinger）之子，家人本意要他担任神职。1870 年他进入图宾根大学开始学习神学，但他从来算不上特别虔诚，很快便把注意力转向其他学科，主要是哲学与自然科学。此后四年间，费英格的课业以德国哲学经典——康德、费希特、谢林、黑格尔与施莱尔马赫——为重点，但他也以极大的强度投入对叔本华和达尔文的独立钻研。1874 年，费英格在逻辑学家克里斯托夫·冯·西格瓦特（Christoph von Sigwart）指导下完成博士论文，题为《根据其形而上学基础及其对心理学的意义看晚近的意识理论》（*Recent Theories of Consciousness according to their Metaphysical Foundation and their Significance for Psychology*），并获得奖项。
