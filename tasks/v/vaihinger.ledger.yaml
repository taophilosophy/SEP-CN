      But, the *PAO* also builds on Lange’s position in non-trivial ways. Vaihinger’s autobiographical essay “The Origin of the Philosophy of ‘As If’” points to two further significant influences, Arthur Schopenhauer and Charles Darwin. Vaihinger’s interest in Schopenhauer was sparked by the doctrine that the intellect is “a mere tool in the service of the will” (Schopenhauer 1958, 2:205)[^schopenhauer-1958]. This view is based in part on Schopenhauer’s metaphysics, according to which the ultimate nature of reality is nothing other than a suprapersonal, aimless, quasi-volitional striving or “will.” Schopenhauer holds that this “will” expresses itself empirically in the striving of organic beings to preserve their individual existence, and the intellect has accordingly developed as a mere tool to aid more complex organisms in this task. Vaihinger believed that Darwin’s theory of natural selection had provided an empirical grounding for Schopenhauer’s hypothesis (*PAO* xviii). This was crucial, since Vaihinger’s own Kantianism prevented him from endorsing Schopenhauer’s speculative vitalist metaphysics (*PAO* xvii). At the same time, Vaihinger comes to view Kant’s doctrine of the essential limits of our cognition through this Schopenhauerian-Darwinian lens: the “limitations of human knowledge,” he says, are “a necessary and natural result of the fact that thought and knowledge are originally only a means, to attain the Life-purpose, so that their actual independence signifies a breaking-away from their original purpose; indeed, by the fact of this breaking-loose, thought is confronted by impossible problems” (*PAO* xviii). Vaihinger will use this idea to motivate his own fictionalism, and to provide a radical reinterpretation of Kantianism.
    step1: |-
      但 *PAO* 也以并非琐碎的方式建基于朗格的立场。费英格的自传性文章“‘仿佛’哲学的起源”指出两个进一步的重要影响来源：阿图尔·叔本华与查尔斯·达尔文。费英格对叔本华的兴趣，被这样一个学说激起：理智“是服务于意志的一个单纯工具”（Schopenhauer 1958, 2:205）[^schopenhauer-1958]。这一观点部分基于叔本华的形而上学：实在的终极本性不外是一种超个人的、无目的的、类似意志的欲求或“意志”。叔本华认为，这一“意志”在经验上表现为有机体保存其个体存在的欲求，而理智相应地发展为一个单纯工具，帮助更复杂的机体完成这项任务。费英格相信，达尔文的自然选择学说为叔本华的假说提供了经验奠基（*PAO* xviii）。这一点至关重要，因为费英格自己的康德主义使他无法赞同叔本华思辨的生机论形而上学（*PAO* xvii）。与此同时，费英格透过这种叔本华-达尔文式的透镜来看待康德关于我们认知之根本界限的学说：“人类知识的局限”，他说，“是思想与知识原本只是达到人生目的的手段这一事实的必然而自然的结果，以至于它们实际的独立性意味着对其原初目的的背离；的确，正是凭借这种挣脱，思想才遭遇到不可能的问题”（*PAO* xviii）。费英格将用这一想法来论证他自己的虚构主义，并为康德主义提供一种激进的重新解释。
