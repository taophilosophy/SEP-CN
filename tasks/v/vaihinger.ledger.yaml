      There are other important, and more substantive, respects in which the *Commentary* was at the vanguard of Kant scholarship. The dominant trend in the interpretation of Kant’s theoretical philosophy throughout most of the nineteenth century had been the physio-psychological reading advanced by such figures as Schopenhauer, Jakob Fries, Friedrich Beneke, Jürgen Bona Meyer, Helmholtz, and of course Lange (Beiser 2018, 64–72, 81–84; 2014, 209–11, 460–63)[^beiser-2018]. According to this tradition, Kant’s main goal in the *Critique* was the discovery of the *causal mechanisms* underlying perception. Kant’s conception of the *a priori* was accordingly understood as referring to innate or ingrained properties of the psychological subject that played an active role in the construction of perception and acquisition of empirical knowledge. The first to break decisively with this tradition was probably Hermann Cohen. Cohen (1871) highlighted the *epistemological* side of Kant’s project—his interest in *justifying* various claims to knowledge. Accordingly, Cohen interpreted the *a priori* as referring to the logical, rather than psychological, conditions of knowledge (1871, 208). In this respect, Cohen’s influence on the *Commentary* was decisive. Vaihinger insists at the outset that Kant’s “philosophy is, in the first instance, *epistemology* [*Erkenntnistheorie*]” (1881–92, 1:8).
    step1: |-
      就其他一些更重要也更实质性的方面而言，《评注》同样处在康德研究的前沿。整个十九世纪大部分时间里，康德理论哲学解读中的主导趋势是所谓生理-心理学解读，其代表人物包括叔本华、雅各布·弗里斯（Jakob Fries）、弗里德里希·贝内克（Friedrich Beneke）、于尔根·博纳·迈耶（Jürgen Bona Meyer）、亥姆霍兹，当然还有朗格（Beiser 2018, 64–72, 81–84; 2014, 209–11, 460–63）[^beiser-2018]。按照这一传统，康德在《批判》中的主要目标是发现知觉底下的因果机制。相应地，康德的先天（*a priori*）概念被理解为指心理主体的内在或固有属性，这些属性在知觉的构造与经验知识的获得中发挥能动作用。第一个与这一传统决裂的人大概是赫尔曼·柯亨（Hermann Cohen）。柯亨（1871）突出了康德规划的认识论一面——他对证成各种知识主张的兴趣。相应地，柯亨把先天的东西解释为指知识的逻辑条件而非心理条件（1871, 208）。在这方面，柯亨对《评注》的影响是决定性的。费英格开宗明义地强调：康德的“哲学首先就是认识论[*Erkenntnistheorie*]”（1881–92, 1:8）。
