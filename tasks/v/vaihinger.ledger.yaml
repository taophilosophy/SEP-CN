      Vaihinger’s reading of the *KrV*, and especially of the Deduction, has become known as the “patchwork thesis.” The patchwork reading has been influential in Anglophone scholarship, due largely to its adoption by Norman Kemp Smith (1918), but it remains controversial. Since the reading apparently requires us to assume that Kant failed to understand that combining views he knew were inconsistent with one another would produce a view that is itself inconsistent, it may be objected that, “if such a conclusion is true, we must say that Immanuel Kant was either abnormally stupid, or else that he took his thinking in a frivolous spirit” (Paton 1930, 157)[^paton-1930]. However, the thesis that the Deduction, regardless of its precise method of composition, at least contains multiple inconsistent lines of argument, rather than a single unified argument, has found able defenders since Vaihinger (see e.g., Wolff 1963; Guyer 1987)[^guyer-1987][^wolff-1963]. For a recent challenge to this revised patchwork reading see (Allison 2015).
    step1: |-
      费英格对《纯粹理性批判》尤其是先验演绎的解读，后来以“拼缀论”（patchwork thesis）之名为人所知。由于很大程度上得到诺曼·肯普·史密斯（Norman Kemp Smith）（1918）的采纳，拼缀解读在英语学界颇有影响，但它仍有争议。既然这一解读显然要求我们假定：康德未能理解，把几种他明知相互不一致的观点合并起来，会产生一个本身不一致的观点；那么或许有人会反驳说，“如果这样一个结论为真，我们就必须说伊曼努尔·康德要么异常愚蠢，要么以轻率的态度对待自己的思考”（Paton 1930, 157）[^paton-1930]。然而，先验演绎无论其具体的成文方式如何，至少包含多条不一致的论证线索而非单一融贯论证——这一论题自费英格以来已不乏有力的辩护者（例如 Wolff 1963; Guyer 1987）[^guyer-1987][^wolff-1963]。对这一修订版拼缀解读的近期质疑见（Allison 2015）。
