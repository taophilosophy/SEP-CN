      除了这种激进的经验论之外，*PAO* 继续坚持大体康德式的观点：认知必然是受限制的，或者用费英格有时的话说，“思维与存在”之间没有“同一性”。不过，如今认知的受限不再是指与某个超越的物自体领域隔绝，而是指本质上不完备。领会这一点的最佳方式，是注意 *PAO* 的另一个核心区分——虚构与假说之分。假说（不要与所谓“假言判断”混淆）是在形式上“成问题的”判断，即具有“可能是 *A* 是 *B*”形式的判断（其中可能性是认识论意义上的）。因此，如果“物质由原子构成”这一判断是一个假说，作出该判断的人就是在主张它可能为真，并对它将来可能得到证实或证伪抱有希望。相比之下，如前所见，虚构判断的形式是“*A* 应当被看作仿佛是 *B*（而实际上 *A* 不是 *B*）”。既然费英格主张这类判断可以由其实践效用获得特许，而正是我们的实践目标最终引导并约束着理论探究，费英格便推出：任何理论都必然包含某些虚构；连最好的理论也不会完全由假说构成，更不用说全由真的假说构成了。
