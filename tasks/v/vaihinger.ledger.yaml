      Vaihinger’s interpretation of the Ideas as fictions is highly controversial, and was already subjected to withering criticism in his own day by Erich Adickes (1927). Adickes accuses Vaihinger of ignoring countless passages that flatly contradict his fictionalist reading, and of misleadingly paraphrasing or eliding passages he does cite. In one way, at least, this criticism is unfair. Vaihinger explicitly concedes: “in Kant we also find in the same contexts many passages which permit or even demand a contrary interpretation… . Two tendencies are revealed, a critical and a dogmatic, a revolutionary and a conservative” (*PAO* 212). Vaihinger’s interpretation is not, unlike his work in the *Commentary*, intended to be strictly historical; he is rather presenting one strand in Kant’s thought that he finds especially promising. Adickes nevertheless makes a compelling case that even those passages on which Vaihinger does rely do not speak decisively in favor of his interpretation. Most contemporary Kant scholars follow Adickes in rejecting the fictionalist interpretation of the Ideas, though it continues to find some supporters (see e.g., Shaper 1966; Korsgaard 1996, 162–76; and esp. Rauscher 2015)[^korsgaard-1996][^rauscher-2015][^shaper-1966].
    step1: |-
      费英格把理念解读为虚构的做法极具争议，在他自己的时代就已遭到埃里希·阿迪克斯（Erich Adickes）（1927）的严厉批评。阿迪克斯指责费英格无视无数与他的虚构主义解读直接抵触的段落，并以误导性的改述或删节处理他所引用的段落。至少在某个方面，这种批评是不公平的。费英格明确承认：“在康德那里，我们在相同语境中也能发现许多容许甚至要求相反解读的段落……两种倾向显露出来，一种是批判的，一种是独断的；一种是革命的，一种是保守的”（*PAO* 212）。与《评注》中的工作不同，费英格的解读并非意在成为严格的历史研究；他毋宁是在呈现康德思想中他认为特别有希望的一条线索。尽管如此，阿迪克斯提出了一个令人信服的论证：即便费英格所依赖的那些段落，也未能决定性地支持他的解读。大多数当代康德学者追随阿迪克斯拒绝关于理念的虚构主义解读，尽管它仍有一些支持者（例如 Shaper 1966; Korsgaard 1996, 162–76; 尤其 Rauscher 2015）[^korsgaard-1996][^rauscher-2015][^shaper-1966]。
