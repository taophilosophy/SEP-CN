      阿皮亚的解读使那些对次协调逻辑心存戒备的人得以从费英格关于矛盾的谈论中抢救出某些哲学上有希望的东西。它或许还有一个优点：更公允地对待费英格虚构理论的多副面孔。因为，虽然费英格声称虚构判断有一个“假言要素”，但他并不把虚构判断单纯还原为条件句（*PAO* 194）。另一方面，这一解读在费英格提示真虚构的矛盾存在于理论或模型之内而非之间的文本面前会绊倒。例如，（经典）原子的概念之所以被当作真虚构，是因为设想某种占据空间却没有任何广延的东西是荒谬的。这就是说，原子论虚构本身是自相矛盾的，而不只是它与其他为物质建模的方式相冲突。表达这一担忧的另一方式是：该解读模糊了半虚构与真虚构之间看似分明的界线——只要我们把一个模型与另一个与之不兼容的模型一起使用，任何模型都会成为真虚构。
