      Anthony Appiah rejects this kind of interpretation, on the grounds that such counterpossibles are unintelligible (2017, 11–17; cf. Wilholt 2014, 112)[^wilholt-2014]. Instead, he suggests Vaihinger’s talk of useful contradictions is more fruitfully understood as referring to the use of multiple mutually incompatible models. In particular, the point is that we may find it useful to regard certain phenomena in one way for some purposes, but in another, incompatible way for other purposes. Even when it turns out to be useful to combine incompatible models for understanding one and the same phenomenon (or range of phenomena), Appiah suggests, Vaihinger need not be committed to a paraconsistent logic. Rather, drawing on (Cartwright 1999)[^cartwright-1999], he suggests that using a model does not involve drawing out each of its logical implications, but instead a kind of skill of “knowing which lines of inference one should and which one should not follow” (2017, 13). Moreover, because our main aim in using models is not ultimately to obtain the truth about the physical world, but to get around in it, there is no reason to avoid such inconsistency (2017, 14–17).
    step1: |-
      安东尼·阿皮亚（Anthony Appiah）拒绝这种解读，理由是这类反可能条件句不可理解（2017, 11–17; 参见 Wilholt 2014, 112）[^wilholt-2014]。他转而提出，费英格关于有用矛盾的谈论，更富成果的理解是指向多个相互不兼容的模型的使用。关键在于：我们会发现，为某些目的以一种方式看待某些现象、为另一些目的以另一种不兼容的方式看待它们，是有用的。阿皮亚指出，即使为了理解同一现象（或现象域）而把不兼容的模型组合起来被证明是有用的，费英格也无须因此承诺一种次协调逻辑。不如说，借助于（Cartwright 1999）[^cartwright-1999]，他提出使用模型并不涉及展开模型的每一条逻辑推论，而是涉及一种“知道哪些推理线索应当遵循、哪些不应当遵循”的技能（2017, 13）。此外，由于我们使用模型的主要目标终究不是获得关于物理世界的真理，而是在其中通行无阻，我们没有理由避免这种不一致（2017, 14–17）。
