      It is not, however, only Lange’s in-principle restriction of knowledge to appearances that Vaihinger wishes to champion. More importantly, he holds that Lange has demonstrated that the empirical sciences *themselves* conclusively support the transcendental idealist’s position. In Chapter IV, Part 3 of the second volume of his magnum opus *The History of Materialism and Critique of its Contemporary Significance*, Lange draws on the work of Johannes Müller and Helmholtz to argue that “the physiology of the sense organs is the developed, or corrected Kantianism, and Kant’s system can, as it were, be viewed as a program for the more recent discoveries in this field” (1873–75, 2:409). The basic idea was that such research had shown that our perceptual apparatus plays an active role in structuring our experience, and that the output of such a process does not qualitatively resemble the initial external stimulus, for which it is a mere “sign.” Since what we perceive is always the product of such unconscious physiological processes, it supposedly follows that we have no knowledge of the objects that ultimately cause our perceptions (for more on these sorts of arguments, see [Hatfield 1990, 165–71, 195–208, and esp. 208–218; Beiser 2014, 199–205, 381–86], and the entries on Hermann von Helmholtz, and Friedrich Lange)[^beiser-2014][^hatfield-1990]. Thus, if Dühring rejects transcendental idealism, he simply has not consistently followed his own prescription that philosophy should base itself on the empirical sciences. And if Hartmann claims to know the nature of things in themselves, he can do so only by flagrantly ignoring the results of those sciences.
    step1: |-
      然而，费英格所要力挺的并不只是朗格在原则上把知识限制于现象的立场。更重要的是，他主张朗格已经证明：经验科学*本身*就有力支持先验唯心论的立场。在其代表作《唯物论史及其对当代意义的批判》（*The History of Materialism and Critique of its Contemporary Significance*）第二卷第三部分第四章，朗格借助约翰内斯·米勒（Johannes Müller）与亥姆霍兹的研究论证说：“感官生理学是发展了的、或纠正了的康德主义，而康德的体系可以说可以被看作这一领域中更晚近发现的一个纲领”（1873–75, 2:409）。其基本想法是：这类研究表明，我们的知觉装置在构造经验时发挥着能动作用，而这一过程的产物在性质上与最初的外部刺激并不相似，对后者而言它只是一个“记号”。既然我们所知觉到的东西始终是这种无意识生理过程的产物，那么据说由此可以推出：我们对于最终引起我们知觉的那些对象没有任何知识（关于这类论证的更多内容，见 [Hatfield 1990, 165–71, 195–208, and esp. 208–218; Beiser 2014, 199–205, 381–86]，以及赫尔曼·冯·亥姆霍兹与弗里德里希·朗格词条）[^beiser-2014][^hatfield-1990]。于是，如果杜林拒绝先验唯心论，那他就根本没有贯彻自己“哲学应奠基于经验科学”的主张；而如果哈特曼声称认识物自体的本性，他只有悍然无视这些科学的成果才能做到。
