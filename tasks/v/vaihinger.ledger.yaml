      Vaihinger’s emphasis on the deep connection between cognition and action have led many interpreters to liken his views to those of the American pragmatists (e.g., Appiah 2017, 4; Koridze 2014; Fine 1993, 4; and esp. Ceynowa 1993)[^appiah-2017][^ceynowa-1993][^koridze-2014]. Others have disputed this connection (Bouriau 2016)[^bouriau-2016]. Vaihinger himself tells us that fictionalism and pragmatism share important similarities, but nevertheless are distinguished by the fact that pragmatism accepts, whereas fictionalism rejects, the principle that “an idea which is found to be useful in practice proves thereby that it is also true in theory” (*PAO* viii). So, if one defines a pragmatist narrowly as someone who endorses this Jamesian definition of truth, Vaihinger is no pragmatist; his core contention is that “we may not argue from the utility of a psychical and logical construct that it is right” (*PAO* 51). Nevertheless, given Vaihinger’s emphasis on the inseparability of practical and theoretical thought, his view that the use of a concept can be justified on purely practical grounds, and so forth, it does not seem unfair to liken him to the pragmatist tradition in a wider sense.
    step1: |-
      费英格对认知与行动之间深层联系的强调，使许多解读者把他的观点与美国的实用主义者相提并论（例如 Appiah 2017, 4; Koridze 2014; Fine 1993, 4; 尤其是 Ceynowa 1993）[^appiah-2017][^ceynowa-1993][^koridze-2014]。另一些人则否认这种联系（Bouriau 2016）[^bouriau-2016]。费英格本人告诉我们，虚构主义与实用主义有重要相似之处，但二者的区别在于：实用主义接受而虚构主义拒绝如下原则，即“一个在实践中被证明有用的观念，由此也就证明它在理论上是真实的”（*PAO* viii）。所以，如果把实用主义者狭义地定义为赞同这一詹姆斯式真理定义的人，那么费英格就不是实用主义者；他的核心主张是“我们不能从一个心理构造与逻辑构造的效用论证它是正确的”（*PAO* 51）。尽管如此，鉴于费英格强调实践思想与理论思想不可分离，主张概念的运用可以基于纯实践的根据得到证成，等等，把他比作宽泛意义上的实用主义传统似乎并不为过。
