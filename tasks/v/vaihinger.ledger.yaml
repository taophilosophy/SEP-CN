      这些不同的影响汇集于 *PAO* 的导论各章。在这里，费英格提出一种关于“心灵”（psyche）的观点：心灵是一种纯粹自然的官能，类似于身体器官，并受有机世界其余部分同样的法则约束。一切心灵活动，包括“科学思维”，都“应当从有机功能的观点来考虑”（*PAO* 1）。如同身体器官，心灵被设计（毋宁说是被选择）来在机体的总体经济中履行特定的角色。它的目的是“把知觉材料改变和加工成那些观念、观念的联结与概念构造”，这些产物构成“一个[在其中]客观事态可以被计算、我们的行为可以成功地就诸现象得到执行的世界”（*PAO* 2）。因此它的目的不是“成为实在的摹本[*Abbild*]”，而是“*an instrument for finding our way about more easily in this world*”（一把使我们更容易在这个世界中找到路的工具）（*PAO* 22，译文有改动）。虽然大体符合叔本华与达尔文的精神，但正如 Ceynowa 所论证的（1993, 35–132），这种工具主义的心灵观也更具体地受惠于十九世纪心理学家阿道夫·霍尔维茨（Adolf Horwicz）。
