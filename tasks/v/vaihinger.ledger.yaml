      If this is Vaihinger’s view, however, it would appear to face a serious difficulty. For, his main interest is in the so-called “real fictions,” which, as noted above, are not merely false, but *contradictory*. Since everything follows from a contradiction, any counterfactual whose antecedent is a real fiction will be trivially true, and this is to say they cannot possibly do the work Vaihinger envisions (Appiah 2017, 11; Cohen 1923, 485)[^appiah-2017][^cohen-1923]. One way to respond, here, is to note that the logic with which Vaihinger operates is still essentially the version of Aristotelian logic found in Kant and throughout much of the nineteenth century. Such pre-twentieth-century logics often implicitly reject the principle *ex contradictione quodlibet*. See, e.g., the discussion of conditionals in the influential *Port-Royal Logic* (Arnauld and Nicole 1996, 100)[^arnauld-1996].
    step1: |-
      然而，如果这是费英格的观点，那它似乎面临一个严重困难。因为，他主要关心的是所谓“真虚构”，而如上所述，真虚构不只是假的，而是自相矛盾的。既然从矛盾可以推出一切，任何前件为真虚构的反事实条件句都将平凡地为真，也就是说，它们不可能胜任费英格设想的任务（Appiah 2017, 11; Cohen 1923, 485）[^appiah-2017][^cohen-1923]。对此的一种回应是指出：费英格所运用的逻辑，本质上仍是康德以及十九世纪大部分时间里通行的亚里士多德逻辑的版本。这类二十世纪之前的逻辑往往隐含地拒绝“从矛盾推出任意之物”（*ex contradictione quodlibet*）原则。例如，见影响深远的《波尔罗亚尔逻辑》（*Port-Royal Logic*）中关于条件句的讨论（Arnauld and Nicole 1996, 100）[^arnauld-1996]。
