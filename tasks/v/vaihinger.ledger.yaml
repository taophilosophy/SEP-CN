      Vaihinger certainly does not, however, accept Cohen’s interpretation *tout court*. Though Cohen too had emphasized the need for historical sensitivity in interpreting Kant, his aims were ultimately still polemical: he believed more careful attention to Kant’s texts could exonerate his system from some of the perennial charges of inconsistency. For example, Kant’s doctrine that things in themselves exist independently of us and causally affect our minds to produce our representations had long been thought to violate his doctrine that the categories have validity only for objects of possible experience. Another charge, very much alive at the time, was that Kant’s key arguments for the non-spatiotemporality of things in themselves failed on the grounds that they showed, at best, only the subjectivity of space and time, not their *mere* subjectivity. According to this criticism, Kant overlooked the possibility that space and time might be *both* subjective forms of intuition and objective properties of things in themselves (the classic statement of this criticism is [Trendelenburg 1867])[^trendelenburg-1867]. Cohen’s response to both charges was to argue that interpreters were wrong to read Kant’s doctrine of things in themselves as positing a class of entities ontologically distinct from appearances. Instead, he maintained, the Kantian thing in itself is a mere “limiting concept” (*Grenzbegriff*), to whose actual existence Kant was never committed (1871, 252, 268).
    step1: |-
      然而，费英格当然并不全盘接受柯亨的解读。虽然柯亨也强调解读康德需要历史敏感性，但他的目标终究仍是论战性的：他相信，更细致地关注康德的文本，可以为康德体系洗脱某些经久不衰的不一致指控。例如，康德关于物自体独立于我们存在、并因果地作用于我们心灵以产生表象的学说，长期以来被认为违反了他关于范畴只对可能经验对象有效的学说。另一项在当时甚为流行的指控是：康德为物自体的非时空性提出的关键论证之所以失败，是因为它们至多只表明了空间与时间的主观性，而非其单纯的主观性。按照这种批评，康德忽视了空间与时间可能既是直观的主观形式、又是物自体的客观属性的可能性（这一批评的经典陈述见 [Trendelenburg 1867]）[^trendelenburg-1867]。柯亨对这两项指控的回应是：解读者把康德的物自体学说读作设定一个在本体论上与现象有别的实体类，这是错误的；相反，他主张康德式的物自体只是一个“限界概念”（*Grenzbegriff*），康德从未承诺其实际存在（1871, 252, 268）。
