      Vaihinger died in 1933, on the eve of the rise of the Third Reich. A long-time liberal and pacifist, Vaihinger and his work were treated with hostile silence throughout the Nazi period. A final, posthumous tragedy would thus befall him during these years: once among Germany’s most celebrated and influential philosophers, Vaihinger became a virtual nobody, and his works were quickly forgotten. Though contemporary philosophical literature reveals a renewed interest in his ideas, it is fair to say that his reputation has never fully recovered. For a more detailed treatment of Vaihinger’s biography, see (Simon 2014)[^simon-2014]. Vaihinger himself discusses his intellectual development at length in his autobiographical (1921b) (also included as the introduction to C.K. Ogden’s 1925 English translation of *PAO*).
    step1: |-
      费英格于 1933 年去世，正值第三帝国崛起的前夜。作为长期的自由主义者与和平主义者，费英格本人及其著作在整个纳粹时期遭到敌意的冷遇。这些年间，一场最后的身后悲剧也降临到他头上：曾跻身德国最负盛名、最有影响的哲学家之列的费英格，成了一个近乎无名之辈，其著作很快被人遗忘。尽管当代哲学文献显示出对其思想的重新兴趣，但可以说，他的声誉从未完全恢复。关于费英格生平更详细的论述，见（Simon 2014）[^simon-2014]。费英格本人对其思想发展有长篇自述（1921b）（该文亦作为 C.K.奥格登 1925 年英译本 *PAO* 的导言收入）。
