      在（1876）中，费英格几乎无助于缓解这些问题。他有时暗示，这些问题植根于如下事实：物自体这个概念本身就包含一个矛盾，尽管这个矛盾“植根于我们认知能力自身的矛盾构造”（1876, 34）。换言之，费英格试图沿康德二律背反的路线来处理物自体问题——一种必然源于我们理性本性的冲突，但至少可以被认出是这种冲突。然而这无济于事。其一，成问题的是，（1876）的基本认识论立场若不承诺物自体，是否还能融贯地陈述出来。其二，康德二律背反的一个关键特征是，它们被他的先验唯心论解决了，从而为该学说提供了一种间接证明（*KrV*, A 506/B 534）。如果批判哲学自身就会产生不可解决的矛盾，那将是拒斥而非接受它的理由。在 *PAO* 中费英格还会继续与这些问题纠缠，*PAO* 仍然旨在推进朗格式的、把康德主义自然化的宽泛规划。不过我们将在 §6 看到，费英格的康德主义观发生了相当大的转变，如今采取他所谓“唯心论实证主义”（idealistic positivism）、“实证主义唯心论”（positivist idealism），甚至（显然是该短语的首次使用）“逻辑实证主义”（logical positivism）的形式。关于费英格受朗格影响的更多内容，见（Ceynowa 1993, 133–72; Heidelberger 2014）[^ceynowa-1993][^heidelberger-2014]。
