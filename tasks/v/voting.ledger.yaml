      ### 6.1 Democratic Challenges to One Person, One Vote
    step1: TBD
    step2: TBD
  - id: 96
    kind: body
    source: |-
      The idea of “One person, one vote” is supposedly grounded on a commitment to egalitarianism. Some philosophers believe that democracy with equal voting rights is necessary to ensure that government gives equal consideration to everyone’s interests (Christiano 1996, 2008)[^christiano-1996]. However, it is not clear that giving every citizen an equal right to vote reliably results in decisions that give equal consideration to everyone’s interests. In many decisions, many citizens have little to nothing at stake, while other citizens have a great deal at stake. Thus, one alternative proposal is that citizens’ votes should be weighted by how much they have a stake in the decision. This preserves equality not by giving everyone an equal chance of being decisive in every decision, but by giving everyone’s interests equal weight. Otherwise, in a system of one person, one vote, issues that are deeply important to the few might continually lose out to issues of only minor interest to the many (Brighouse and Fleurbaey 2010)[^brighouse-2010].
    step1: TBD
    step2: TBD
  - id: 97
    kind: body
    source: |-
      There are a number of other independent arguments for this conclusion. Perhaps proportional voting enhances citizens’ autonomy, by giving them greater control over those issues in which they have greater stakes, while few would regard it as significant loss of autonomy were they to have reduced control over issues that do not concern them. Further, though the argument for this conclusion is too technical to cover here in depth (Brighouse and Fleurbaey 2010; List 2013)[^brighouse-2010][^list-2013], it may be that apportioning political power according to one’s stake in the outcome can overcome some of the well-known paradoxes of democracy, such as the Condorcet Paradox (which show that democracies might have intransitive preferences, i.e., the majority might prefer A to B, B to C, and yet also prefer C to A).
    step1: TBD
    step2: TBD
  - id: 98
    kind: body
    source: |-
      However, even if this proposal seems plausible in theory, it is unclear how a democracy might reliably instantiate this in practice. Before allowing a vote, a democratic polity would need to determine to what extent different citizens have a stake in the decision, and then somehow weight their votes accordingly. In real life, special-interests groups and others would likely try to use vote weighting for their own ends. Citizens might regard unequal voting rights as evidence of corruption or electoral manipulation (Christiano 2008: 34–45)[^christiano-2008]. More recently, Bengston and Albertsen (2023) have considered at length what the “defining the demos” problem implies about the voting rights of senior citizens. They argue that many of the principles philosophers have defended when considering who counts as one of “the people” imply senior citizens should have lower weighted votes. For instance, if what makes someone a member of the public is that they are affected by a decision, then many seniors are not much affected by political decisions, since they will likely pass away before many decisions have any real effect. (See also Bengston 2022.)[^bengston-2022]
    step1: TBD
    step2: TBD
