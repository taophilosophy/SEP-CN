    source: |-
      ## 1. The Rationality of Voting
    step1: TBD
    step2: TBD
  - id: 5
    kind: body
    source: |-
      The act of voting has an opportunity cost. It takes time and effort that could be used for other valuable things, such as working for pay, volunteering at a soup kitchen, or playing video games. Further, identifying issues, gathering political information, thinking or deliberating about that information, and so on, also take time and effort which could be spent doing other valuable things. Economics, in its simplest form, predicts that rational people will perform an activity only if doing so maximizes expected utility. However, economists have long worried that, that for nearly every individual citizen, voting does not maximize expected utility. This leads to the “paradox of voting”(Downs 1957)[^downs-1957]: Since the expected costs (including opportunity costs) of voting appear to exceed the expected benefits, and since voters could always instead perform some action with positive overall utility, it’s surprising that anyone votes.
    step1: TBD
    step2: TBD
  - id: 6
    kind: body
    source: |-
      However, whether voting is rational or not depends on just what voters are trying to do. Instrumental theories of the rationality of voting hold that it can be rational to vote when the voter’s goal is to influence or change the outcome of an election, including the “mandate” the winning candidate receives. (The mandate theory of elections holds that a candidate’s effectiveness in office, i.e., her ability to get things done, is in part a function of how large or small a lead she had over her competing candidates during the election.) In contrast, the expressive theory of voting holds that voters vote in order to express themselves and their fidelity to certain groups or ideas. Alternatively, one might hold that voting is rational because it is has consumption value; many people enjoy political participation for its own sake or for being able to show others that they voted. Finally, if one believes, as most democratic citizens say they do (Mackie 2010)[^mackie-2010], that voting is a substantial moral obligation, then voting could be rational because it is necessary to discharge one’s obligation.
    step1: TBD
    step2: TBD
  - id: 7
    kind: body
    source: |-
      ### 1.1 Voting to Change the Outcome
    step1: TBD
    step2: TBD
  - id: 8
    kind: body
    source: |-
      One reason a person might vote is to influence, or attempt to change, the outcome of an election. Suppose there are two candidates, *D* and *R*. Suppose Sally prefers *D* to *R*. Suppose she correctly believes that *D* would do a trillion dollars more overall good than *R* would do. If her beliefs were correct, then by hypothesis, it would be best if *D* won.
    step1: TBD
    step2: TBD
  - id: 9
    kind: body
    source: |-
      Here, casting the expected value difference between the two candidates in monetary terms is a simplifying assumption. Whether political outcomes can be described in monetary terms as such is not without controversy. To illustrate, suppose the difference between two candidates came down entirely to how many lives would be lost in the way they would conduct a current war. Whether we can translate “lives lost” into dollar terms is controversial. Further, whether we can commensurate all the distinct goods and harms a candidate might cause onto a common scale is also controversial.
    step1: TBD
    step2: TBD
  - id: 10
    kind: body
    source: |-
      Even if the expected value difference between two candidates could be expressed on some common value scale, such as in monetary terms, this leaves open whether the typical voter is aware of or can generally estimate that difference. Empirical work generally finds that most voters are badly informed, and further, that many of them are not voting for the purpose of promoting certain policies or platforms over others (Achen and Bartels 2016; Kinder and Kalmoe 2017; Mason 2017)[^achen-2016][^kinder-2017][^mason-2017]. Beyond that, estimating the value difference between candidates requires evaluating complex counterfactuals, estimating what various candidates are likely to achieve, and determining what the outcomes of these actions would be (Freiman 2020)[^freiman-2020].
    step1: TBD
    step2: TBD
  - id: 11
    kind: body
    source: |-
      These worries aside, even if Sally is correct that *D* will do a trillion dollars more good than *R*, this does not yet show it is rational for Sally to vote for *D*. Instead, this depends on how likely it is that her vote will make a difference. In much the same way, it might be worth $200 million to win the lottery, but that does not imply it is rational to buy a lottery ticket.
    step1: TBD
    step2: TBD
  - id: 12
    kind: body
    source: |-
      Suppose Sally’s only goal, in voting, is to change the outcome of the election between two major candidates. In that case, the expected value of her vote ($U_v$) is:

      $$ U_v = p[V(D) - V(R)] - C $$
    step1: TBD
    step2: TBD
  - id: 13
    kind: body
    source: |-
      where *p* represents the probability that Sally’s vote is decisive, $[V(D) - V(R)]$ represents (in monetary terms) the difference in the expected value of the two candidates, and *C* represents the opportunity cost of voting. In short, the value of her vote is the value of the difference between the two candidates discounted by her chance of being decisive, minus the opportunity cost of voting. In this way, voting is indeed like buying a lottery ticket. Unless $p[V(D) - V(R)] > C$, then it is (given Sally’s stated goals) irrational for her to vote.
    step1: TBD
    step2: TBD
  - id: 14
    kind: body
    source: |-
      The equation above models the rationality of Sally’s choice to vote under the assumption that she is simply trying to change the outcome of the election, and gets no further benefit from voting. Further, the equation assumes her vote confers no other benefit to others than having some chance of changing which candidate wins. However, these are controversial simplifying assumptions. It is possible that the choice to cast a vote may induce others to vote, might improve the quality of the ground decision by adding cognitive diversity, might have some marginal influence on which candidates or platforms parties run, or might have some other effect not modeled in the equation above.
    step1: TBD
    step2: TBD
  - id: 15
    kind: body
    source: |-
      Again, it is controversial among some philosophers whether the difference in value between two candidates can be expressed, in principle, in monetary terms. Nevertheless, the point generalizes in some way. If we are discussing the instrumental value of a vote, then the general point is that the vote depends on the expected difference in value between the chosen candidate and the next best alternative, discounted by the probability of the vote breaking a tie, and we must then take into account the opportunity cost of voting. For instance, if two candidates were identical except that one would save one more life than another, but one had a 1 in 1 billion chance of being decisive, and instead of voting one could save a drowning toddler, then it seems voting is not worthwhile, even if we cannot assign an exact monetary value to thee consequences.
    step1: TBD
    step2: TBD
  - id: 16
    kind: body
    source: |-
      There is some debate among economists, political scientists, and philosophers over the precise way to calculate the probability that a vote will be decisive. Nevertheless, they generally agree that the probability that the modal individual voter in a typical election will break a tie is small. Binomial models of voting estimate the probability of a vote being decisive by modeling voters as if they were weighted coins and then asking what the probability is that a weighted coin will come up heads exactly 50% of the time. These models generally imply that the probability of being decisive, if any candidate has a lead, is vanishingly small, which in turn implies that the expected benefit of voting (i.e., $p[V(D) - V(R)]$) for a good candidate is worth far less than a millionth of a penny (G. Brennan and Lomasky 1993: 56–7, 119)[^brennan-1993]. A more optimistic estimate in the literature, which uses statistical estimate techniques based on past elections, claims that in a typical presidential election, American voters have widely varying chances of being decisive depending on which state they vote in. This model still predicts that a typical vote in a “safe” states, like California, has a vanishingly small chance of making a difference, but suggests that that a vote in very close states could have on the order of a 1 in 10 million chance of breaking a tie (Edlin, Gelman, and Kaplan 2007). Thus, on both of these popular models, whether voting for the purpose of changing the outcome is rational depends upon the facts on the ground, including how close the election is and how significant the value difference is between the candidates. The binomial model suggests it will almost never be rational to vote, while the statistical model suggests it will be rational for voters to vote in sufficiently close elections or in swing states. Barnett (2020) offers an alternative model of the expected value of a vote which implies voting is rational, in the sense of having a high enough expected utility (or disutility) in even more common conditions. Barnett defends the view that the probability of casting a deciding vote is at least $1/N$, where $N$ is the number of voting citizens; thus, he generates his results partly by having a more optimistic view about voters’ chances of making a difference. (For a critique of the realism of Barnett’s model, see Liron and Enoch 2023.)[^liron-2023]
    step1: TBD
    step2: TBD
  - id: 17
    kind: body
    source: |-
      However, some claim even these assessments are optimistic. One worry is that if a major election in most places came down to a single vote, the issue might be decided in the courts after extensive lawsuits (Somin 2013)[^somin-2013]. Further, in making such estimates, we have assumed that voters can reliably identify which candidate is better and reliably estimate how much better that candidate is. But perhaps voters cannot. After all, showing that individual votes matter is a double-edged sword; the more expected good an individual vote can do, the more expected harm it can do (J. Brennan 2011a; Freiman 2020)[^brennan-2011a][^freiman-2020]. If Barnett (2020) is correct about the efficacy of individual votes, then voting might be a risky endeavor (Brennan and Freiman 2023)[^brennan-2023].
    step1: TBD
    step2: TBD
  - id: 18
    kind: body
    source: |-
      ### 1.2 Voting to Change the “Mandate”
    step1: TBD
    step2: TBD
  - id: 19
    kind: body
    source: |-
      One popular response to the paradox of voting is to posit that voters are not trying to determine who wins, but instead trying to change the “mandate” the elected candidate receives. The assumption here is that an elected official’s efficacy—i.e., her ability to get things done in office—depends in part on how large of a majority vote she received. If that were true, I might vote for what I expect to be the winning candidate in order to increase her mandate, or vote against the expected winner to reduce her mandate. The virtue of the mandate hypothesis, if it were true, is that it could explain why it would be rational to vote even in elections where one candidate enjoys a massive lead coming into the election.
    step1: TBD
    step2: TBD
  - id: 20
    kind: body
    source: |-
      However, the mandate argument faces two major problems. First, even if we assume that such mandates exist, to know whether voting is rational, we would need to know how much the *nth* voter’s vote increases the marginal effectiveness of her preferred candidate, or reduces the marginal effectiveness of her dispreferred candidate. Suppose voting for the expected winning candidate costs me $15 worth of my time. It would be rational for me to vote only if I believed my individual vote would give the winning candidate at least $15 worth of electoral efficacy (and I care about the increased efficiency as much or more than my opportunity costs). In principle, whether individual votes change the “mandate” this much is something that political scientists could measure, and indeed, they have tried to do so.
    step1: TBD
    step2: TBD
  - id: 21
    kind: body
    source: |-
      But this brings us to the second, deeper problem: Political scientists have done extensive empirical work trying to test whether electoral mandates exist, and they now roundly reject the mandate hypothesis (Dahl 1990b; Noel 2010)[^dahl-1990b][^noel-2010]. A winning candidate’s ability to get things done is generally not affected by how small or large of a margin she wins by.
    step1: TBD
    step2: TBD
  - id: 22
    kind: body
    source: |-
      Perhaps voting is rational not as a way of trying to change how effective the elected politician will be, but instead as a way of trying to change the *kind* of mandate the winning politician enjoys (Guerrero 2010)[^guerrero-2010]. Perhaps a vote could transform a candidate from a delegate to a trustee. A delegate tries to do what she believes her constituents want, but a trustee has the normative legitimacy to do what she believes is best.
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      Suppose for the sake of argument that trustee representatives are significantly more valuable than delegates, and that what makes a representative a trustee rather than a delegate is her large margin of victory. Unfortunately, this does not yet show that the expected benefits of voting exceed the expected costs. Suppose (as in Guerrero 2010: 289)[^guerrero-2010] that the distinction between a delegate and trustee lies on a continuum, like difference between bald and hairy. To show voting is rational, one would need to show that the marginal impact of an individual vote, as it moves a candidate a marginal degree from delegate to trustee, is higher than the opportunity cost of voting. If voting costs me $15 worth of time, then, on this theory, it would be rational to vote only if my vote is expected to move my favorite candidate from delegate to trustee by an increment worth at least $15 (Guerrero 2010: 295–297)[^guerrero-2010].
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Alternatively, suppose that there were a determinate threshold (either known or unknown) of votes at which a winning candidate is suddenly transformed from being a delegate to a trustee. By casting a vote, the voter has some chance of decisively pushing her favored candidate over this threshold. However, just as the probability that her vote will decide the election is vanishingly small, so the probability that her vote will decisively transform a representative from a delegate into a trustee would be vanishingly small. Indeed, the formula for determining decisiveness in transforming a candidate into a trustee would be roughly the same as determining whether the voter would break a tie. Thus, suppose it’s a billion or even a trillion dollars better for a representative to be a trustee rather than a candidate. Even if so, the expected benefit of an individual vote is still less than a penny, which is lower than the opportunity cost of voting. Again, it’s wonderful to win the lottery, but that doesn’t mean it’s rational to buy a ticket.
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      ### 1.3 Other Reasons to Vote
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      Other philosophers have attempted to shift the focus on other ways individual votes might be said to “make a difference”. Perhaps by voting, a voter has a significant chance of being among the “causally efficacious set” of votes, or is in some way causally responsible for the outcome (Tuck 2008; Goldman 1999)[^goldman-1999][^tuck-2008].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      On these theories, what voters value is not changing the outcome, but being agents who have participated in causing various outcomes. These causal theories of voting claim that voting is rational provided the voter sufficiently cares about being a cause or among the joint causes of the outcome. Voters vote because they wish to bear the right kind of causal responsibility for outcomes, even if their individual influence is small.
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      What these alternative theories make clear is that whether voting is rational depends in part upon what the voters’ goals are. If their goal is to in some way change the outcome of the election, or to change which policies are implemented, then voting is indeed irrational, or rational only in unusual circumstances or for a small subset of voters. However, perhaps voters have other goals.
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      The expressive theory of voting (G. Brennan and Lomasky 1993)[^brennan-1993] holds that voters vote in order to express themselves. On the expressive theory, voting is a consumption activity rather than a productive activity; it is more like reading a book for pleasure than it is like reading a book to develop a new skill. On this theory, though the act of voting is private, voters regard voting as an apt way to demonstrate and express their commitment to their political team. Voting is like wearing a Metallica T-shirt at a concert or doing the wave at a sports game. Sports fans who paint their faces the team colors do not generally believe that they, as individuals, will change the outcome of the game, but instead wish to demonstrate their commitment to their team. Even when watching games alone, sports fans cheer and clap for their teams. Perhaps voting is like this.
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      This “expressive theory of voting” is untroubled by and indeed partly supported by the empirical findings that most voters are ignorant about basic political facts (Somin 2013; Delli Carpini and Keeter, 1996)[^somin-2013]. The expressive theory is also untroubled by and indeed partly supported by work in political psychology showing that most citizens suffer from significant “intergroup bias”: we tend to automatically form groups, and to be irrationally loyal to and forgiving of our own group while irrationally hateful of other groups (Lodge and Taber 2013; Haidt 2012; Westen, Blagov, Harenski, Kilts, and Hamann 2006; Westen 2008)[^haidt-2012][^lodge-2013][^westen-2008]. Voters might adopt ideologies in order to signal to themselves and others that they are certain kinds of people. For example, suppose Bob wants to express that he is a patriot and a tough guy. He thus endorses hawkish military actions, e.g., that the United States nuke Russia for interfering with Ukraine. It would be disastrous for Bob were the US to do what he wants. However, since Bob’s individual vote for a militaristic candidate has little hope of being decisive, Bob can afford to indulge irrational and misinformed beliefs about public policy and express those beliefs at the polls.
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Another simple and plausible argument is that it can be rational to vote in order to discharge a perceived duty to vote (Mackie 2010)[^mackie-2010]. Surveys indicate that most citizens in fact believe there is a duty to vote or to “do their share” (Mackie 2010: 8–9)[^mackie-2010]. If there are such duties, and these duties are sufficiently weighty, then it would be rational for most voters to vote.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      ## 2. The Moral Obligation to Vote
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Surveys show that most citizens in contemporary democracies believe there is some sort of moral obligation to vote (Mackie 2010: 8–9)[^mackie-2010]. Other surveys show most moral and political philosophers agree (Schwitzgebel and Rust 2010)[^schwitzgebel-2010]. They tend to believe that citizens have a duty to vote even when these citizens rightly believe their favored party or candidate has no serious chance of winning (Campbell, Gurin, and Mill 1954: 195). Further, most people seem to think that the duty to vote specifically means a duty to turn out to vote (perhaps only to cast a blank ballot), rather than a duty to vote a particular way. On this view, citizens have a duty simply to cast a vote, but nearly any good-faith vote is morally acceptable.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Many popular arguments for a duty to vote rely upon the idea that individual votes make a significant difference. For instance, one might argue that that there is a duty to vote because there is a duty to protect oneself, a duty to help others, or to produce good government, or the like. However, these arguments face the problem, as discussed in section 1, that individual votes have vanishingly small instrumental value (or disvalue)
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      For instance, one early hypothesis was that voting might be a form of insurance, meant to to prevent democracy from collapsing (Downs 1957: 257)[^downs-1957]. Following this suggestion, suppose one hypothesizes that citizens have a duty to vote in order to help prevent democracy from collapsing. Suppose there is some determinate threshold of votes under which a democracy becomes unstable and collapses. The problem here is that just as there is a vanishingly small probability that any individual’s vote would decide the election, so there is a vanishingly small chance that any vote would decisively put the number of votes above that threshold. Alternatively, suppose that as fewer and fewer citizens vote, the probability of democracy collapsing becomes incrementally higher. If so, to show there is a duty to vote, one would first need to show that the marginal expected benefits of the *nth* vote, in reducing the chance of democratic collapse, exceed the expected costs (including opportunity costs).
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      A plausible argument for a duty to vote would thus not depend on individual votes having significant expected value or impact on government or civic culture. Instead, a plausible argument for a duty to vote should presume that individual votes make little difference in changing the outcome of election, but then identify a reason why citizens should vote anyway.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      One suggestion (Beerbohm 2012)[^beerbohm-2012] is that citizens have a duty to vote to avoid complicity with injustice. On this view, representatives act in the name of the citizens. Citizens count as partial authors of the law, even when the citizens do not vote or participate in government. Citizens who refuse to vote are thus complicit in allowing their representatives to commit injustice. Perhaps failure to resist injustice counts as kind of sponsorship. (This theory thus implies that citizens do not merely have a duty to vote rather than abstain, but specifically have a duty to vote for candidates and policies that will reduce injustice.)
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Another popular argument, which does not turn on the efficacy of individual votes, is the “Generalization Argument”:
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      > What if everyone were to stay home and not vote? The results would be disastrous! Therefore, I (you/she) should vote. (Lomasky and G. Brennan 2000: 75)[^lomasky-2000]
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      This popular argument can be parodied in a way that exposes its weakness. Consider:
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      > What if everyone were to stay home and not farm? Then we would all starve to death! Therefore, I (you/she) should each become farmers. (Lomasky and G. Brennan 2000: 76)[^lomasky-2000]
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      The problem with this argument, as stated, is that even if it would be disastrous if no one or too few performed some activity, it does not follow that everyone ought to perform it. Instead, one conclude that it matters that sufficient number of people perform the activity. In the case of farming, we think it’s permissible for people to decide for themselves whether to farm or not, because market incentives suffice to ensure that enough people farm.
    step1: TBD
    step2: TBD
  - id: 43
    kind: body
    source: |-
      However, even if the Generalization Argument, as stated, is unsound, perhaps it is on to something. There are certain classes of actions in which we tend to presume everyone ought to participate (or ought not to participate). For instance, suppose a university places a sign saying, “Keep off the newly planted grass.” It’s not as though the grass will die if one person walks on it once. If I were allowed to walk on it at will while the rest of you refrained from doing so, the grass would probably be fine. Still, it would seem unfair if the university allowed me to walk on the grass at will but forbade everyone else from doing so. It seems more appropriate to impose the duty to keep off the lawn equally on everyone. Similarly, if the government wants to raise money to provide a public good, it could just tax a randomly chosen minority of the citizens. However, it seems more fair or just for everyone (at least above a certain income threshold) to pay some taxes, to share in the burden of providing police protection.
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      We should thus ask: is voting more like the first kind of activity, in which it is only imperative that enough people do it, or the second kind, in which it’s imperative that everyone do it? One difference between the two kinds of activities is what abstention does to others. If I abstain from farming, I don’t thereby take advantage of or free ride on farmers’ efforts. Rather, I compensate them for whatever food I eat by buying that food on the market. In the second set of cases, if I freely walk across the lawn while everyone else walks around it, or if I enjoy police protection but don’t pay taxes, it appears I free ride on others’ efforts. They bear an uncompensated differential burden in maintaining the grass or providing police protection, and I seem to be taking advantage of them.
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      A defender of a duty to vote might thus argue that non-voters free ride on voters. Non-voters benefit from the government that voters provide, but do not themselves help to provide government.
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      There are at least a few arguments for a duty to vote that do not depend on the controversial assumption that individual votes make a difference:
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      1. *The Generalization/Public Goods/Debt to Society Argument*: Claims that citizens who abstain from voting thereby free ride on the provision of good government, or fail to pay their “debts to society”.
      2. *The Civic Virtue Argument*: Claims that citizens have a duty to exercise civic virtue, and thus to vote.
      3. *The Complicity Argument*: Claims that citizens have a duty to vote (for just outcomes) in order to avoid being complicit in the injustice their governments commit.
      4. *The Role Morality Argument*: Claims that citizens have a duty to fulfill their roles as members of a democratic order (Elliott 2023)[^elliot-2023].
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      However, there is a general challenge to these arguments in support of a duty to vote. Call this the *particularity problem*: To show that there is a duty to vote, it is not enough to appeal to some goal *G* that citizens plausibly have a duty to support, and then to argue that voting is one way they can support or help achieve *G*. Instead, proponents of a duty to vote need to show specifically that voting is the only way, or the required way, to support *G* (J. Brennan 2011a)[^brennan-2011a]. The worry is that the four arguments above might only show that voting is one way among many to discharge the duty in question. Indeed, it might not be even be an especially good way, let alone the only or obligatory way to discharge the duty.
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      For instance, suppose one argues that citizens should vote because they ought to exercise civic virtue. One must explain why a duty to exercise civic virtue specifically implies a duty to vote, rather than a duty just to perform one of thousands of possible acts of civic virtue. Or, if a citizen has a duty to to be an agent who helps promote other citizens’ well-being, it seems this duty could be discharged by volunteering, making art, or working at a productive job that adds to the social surplus. If a citizen has a duty to to avoid complicity in injustice, it seems that rather than voting, she could engage in civil disobedience; write letters to newspaper editors, pamphlets, or political theory books; donate money; engage in conscientious abstention; protest; assassinate criminal political leaders; or do any number of other activities. It’s unclear why voting is special or required. On this point, B. Brown argues that citizens do not have a duty to vote, but only to do their fair-share of useful civic work (Brown 2023)[^brown-2023]. One of her main concerns is that voting is not unique; the properties which might imply voting is a duty are shared by other civic actions.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      Note that the particularity problem need not be framed in consequentialist terms, i.e., both defenders and critics of the duty to vote need not say that what determines whether voting is morally required depends on whether voting has the highest expected consequences. Rather, the issue is whether voting is simply one of many ways to discharge an underlying duty or respond to underlying reasons, or whether voting is in some way special and unique, such that these reasons select voting in particular as an obligatory means of responding to these underlying reasons.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Maskivker (2019) responds partly to this objection by saying, in effect, “Why not both?” J. Brennan (2011a) and Freiman (2020) say that the underlying grounds for any duty to vote can be discharged (and discharged better) through actions other than voting. Maskivker takes this to suggest not that voting is optional, but that one should vote (if one is already sufficiently well-informed and publicly-spirited) and also performs these other actions. Maskivker grounds her argument on a deontological duty of easy aid: if one can provide aid to others at very low cost to oneself, then one should do so. For already well-informed citizens, voting is an instance of easy aid.
    step1: TBD
    step2: TBD
