      ### 2.1 A General Moral Obligation Not to Vote?
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      While many hold that it is obligatory to vote, a few have argued that many people have an obligation not to vote under special circumstances. For instance, Sheehy (2002) argues that voting when one is indifferent to the election is unfair. He argues that if one’s vote makes a difference, it could be to disappoint what otherwise would be have been the majority coalition, whose position is now thwarted by those who, by hypothesis, have no preference.
    step1: TBD
    step2: TBD
  - id: 54
    kind: body
    source: |-
      Another argument holds that voting might be wrong because it is an ineffective form of altruism. Freiman (2020) argues that when people discharge their obligations to help and aid others, they are obligated to pursue effective rather than ineffective forms of altruism (see also MacAskill 2015)[^macaskill-2015]. For instance, suppose one has an obligation to give a certain amount to charity each year. This obligation is not fundamentally about spending a certain percentage of one’s money. If a person gave 10% of their income to a charity that did no good at all, or which made the world worse, one would not have discharged the obligation to act beneficently. Similarly, Freiman argues, if a person is voting for the purpose of aiding and helping others, then they would at the very least need to be sufficiently well-informed to vote for the better candidate, a condition few voters meet (see section 3.2 below). In part because most voters are in no position to judge whether they are voting for the better or worse candidates, and in part simply because individual votes make little difference, votes and most other forms of political action (such as donating to political campaigns, canvassing, volunteering, and the like) are highly ineffective forms of altruism. Freiman claims that we are instead obligated to pursue effective forms of altruism, such as collecting and making donations to the Against Malaria Foundation.
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      ## 3. Moral Obligations Regarding How One Votes
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Most people appear to believe that there is a duty to cast a vote (perhaps including a blank ballot) rather than abstain (Mackie 2010: 8–9)[^mackie-2010], but this leaves open whether they believe there is a duty to vote in any particular way. Some philosophers and political theorists have argued there are ethical obligations attached to how one chooses to vote. For instance, many deliberative democrats (see Christiano 2006)[^christiano-2006] believe not only that every citizen has a duty to vote, but also that they must vote in publicly-spirited ways, after engaging in various forms of democratic deliberation. In contrast, some (G. Brennan and Lomasky 1993; J. Brennan 2009, 2011a)[^brennan-1993][^brennan-2009] argue that while there is no general duty to vote (abstention is permissible), those citizens who do choose to vote have duties affecting how they vote. They argue that while it is not wrong to abstain, it is wrong to vote *badly*, in some theory-specified sense of “badly”.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Note that the question of how one ought to vote is distinct from the question of whether one ought to have the right to vote. The right to vote licenses a citizen to cast a vote. It requires the state to permit the citizen to vote and then requires the state to count that vote. This leaves open whether some ways a voter could vote could be morally wrong, or whether other ways of voting might be morally obligatory. In parallel, my right of free association arguably includes the right to join the Ku Klux Klan, while my right of free speech arguably includes the right to advocate an unjust war. Still, it would be morally wrong for me to do either of these things, though doing so is within my rights. Thus, just as someone can, without contradiction, say, “You have the right to have racist attitudes, but you should not,” so a person can, without contradiction, say, “You have the right to vote for that candidate, but you should not.”
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      A theory of voting ethics might include answers to any of the following questions:
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      1. *The Intended Beneficiary of the Vote*: Whose interests should the voter take into account when casting a vote? May the voter vote selfishly, or should she vote sociotropically? If the latter, on behalf of which group ought she vote: her demographic group(s), her local jurisdiction, the nation, or the entire world? Is it permissible to vote when one has no stake in the election, or is otherwise indifferent to the outcome?
      2. *The Substance of the Vote*: Are there particular candidates or policies that the voter is obligated to support, or not to support? For instance, is a voter obligated to vote for whatever would best produce the most just outcomes, according to the correct theory of justice? Must the voter vote for candidates with good character? May the voter vote strategically, or must she vote in accordance with her sincere preferences?
      3. *Epistemic Duties Regarding Voting*: Are voters required to have a particular degree of knowledge, or exhibit a particular kind of epistemic rationality, in forming their voting preferences? Is it permissible to vote in ignorance, on the basis of beliefs about social scientific matters that are formed without sufficient evidence?
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      ### 3.1 The Expressivist Ethics of Voting
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      Recall that one important theory of voting behavior holds that most citizens vote not in order to influence the outcome of the election or influence government policies, but in order to express themselves (G. Brennan and Lomasky 1993)[^brennan-1993]. They vote to signal to themselves and to others that they are loyal to certain ideas, ideals, or groups. For instance, in the United States, I might vote Democrat to signal that I’m compassionate and fair, or Republican to signal I believe “America first”. If voting is primarily an expressive act, then perhaps the ethics of voting is an ethics of expression (G. Brennan and Lomasky 1993: 167–198)[^brennan-1993]. We can assess the morality of voting by asking what it says about a voter that she voted like that:
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      > To cast a Klan ballot is to *identify oneself* in a morally significant way with the racist policies that the organization espouses. One thereby lays oneself open to associated moral liability whether the candidate has a small, large, or zero probability of gaining victory, and whether or not one’s own vote has an appreciable likelihood of affecting the election result. (G. Brennan and Lomasky 1993: 186)[^brennan-1993]
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      The idea here is that if it’s wrong (even if it’s within my rights) for me to express sincere racist attitudes, then by extension it’s wrong for me to express sincere racist commitments at the polls. Similar remarks apply to other wrongful attitudes. To the extent it is wrong for me to express sincere support for illiberal, reckless, or bad ideas, it would also be wrong for me to vote for candidates who support those ideas.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Of course, the question of just what counts as wrongful and permissible expression is complicated. There is also a complicated question of just what voting expresses. What I think my vote expresses might be different from what it expresses to others, or it might be that it expresses different things to different people. The expressivist theory of voting ethics acknowledges these difficulties, and replies that whatever we would say about the ethics of expression in general should presumably apply to expressive voting.
    step1: TBD
    step2: TBD
