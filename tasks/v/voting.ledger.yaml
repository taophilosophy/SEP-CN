      ## 4. The Justice of Compulsory Voting
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Voting rates in many contemporary democracies are (according to many observers) low, and seem in general to be falling. The United States, for instance, barely manages about 60% in presidential elections and 45% in other elections (Brennan and Hill 2014: 3)[^brennan-2014]. Many other countries have similarly low rates. Some democratic theorists, politicians, and others think this is problematic, and advocate compulsory voting as a solution. In a compulsory voting regime, citizens are required to vote by law; if they fail to vote without a valid excuse, they incur some sort of penalty.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      One major argument for compulsory voting is what we might call the Demographic or Representativeness Argument (Lijphart 1997; Engelen 2007; Galston 2011; Hill in J. Brennan and Hill 2014: 154–173; Singh 2015)[^brennan-2014][^engelen-2007][^galston-2011][^lijphart-1997][^singh-2015]. The argument begins by noting that in voluntary voting regimes, citizens who choose to vote are systematically different from those who choose to abstain. The rich are more likely to vote than the poor. The old are more likely to vote than the young. Men are more likely to vote than women. In many countries, ethnic minorities are less likely to vote than ethnic majorities. More highly educated people are more likely to vote than less highly educated people. Married people are more likely to vote than non-married people. Political partisans are more likely to vote than true independents (Leighley and Nagler 1992; Evans 2003: 152–6)[^evans-2003][^leighley-1992]. In short, under voluntary voting, the electorate—the citizens who actually choose to vote—are not fully representative of the public at large. The Demographic Argument holds that since politicians tend to give voters what they want, in a voluntary voting regime, politicians will tend to advance the interests of advantaged citizens (who vote disproportionately) over the disadvantaged (who tend not to vote). Compulsory voting would tend to ensure that the disadvantaged vote in higher numbers, and would thus tend to ensure that everyone’s interests are properly represented.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      Relatedly, one might argue compulsory voting helps citizens overcome an “assurance problem” (Hill 2006)[^hill-2006]. The thought here is that an individual voter realizes her individual vote has little significance. What’s important is that enough other voters like her vote. However, she cannot easily coordinate with other voters and ensure they will vote with her. Compulsory voting solves this problem. For this reason, Lisa Hill (2006: 214–15) concludes, “Rather than perceiving the compulsion as yet another unwelcome form of state coercion, compulsory voting may be better understood as a coordination necessity in mass societies of individual strangers unable to communicate and coordinate their preferences.”
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      Whether the Demographic Argument succeeds or not depends on a few assumptions about voter and politician behavior. First, political scientists overwhelmingly find that voters do not vote their self-interest, but instead vote for what they perceive to be the national interest. (See the dozens of papers cited at Brennan and Hill 2014: 38–9n28.)[^brennan-2014] Second, it might turn out that disadvantaged citizens are not informed enough to vote in ways that promote their interests—they might not have sufficient social scientific knowledge to know which candidates or political parties will help them (Delli Carpini and Keeter 1996; Caplan 2007; Somin 2013)[^caplan-2007][^delli-1996][^somin-2013]. Third, it may be that even in a compulsory voting regime, politicians can get away with ignoring the policy preferences of most voters (Gilens 2012; Bartels 2010)[^bartels-2010][^gilens-2012].
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      In fact, contrary to many theorists’ expectations, it appears that compulsory voting has no significant effect on individual political knowledge (that is, it does not induce ignorant voters to become better informed), individual political conversation and persuasion, individual propensity to contact politicians, the propensity to work with others to address concerns, participation in campaign activities, the likelihood of being contacted by a party or politician, the quality of representation, electoral integrity, the proportion of female members of parliament, support for small or third parties, support for the left, or support for the far right (Birch 2009; Highton and Wolfinger 2001)[^birch-2009][^highton-2001]. Political scientists have also been unable to demonstrate that compulsory voting leads to more egalitarian or left-leaning policy outcomes. The empirical literature so far shows that compulsory voting gets citizens to vote, but it’s not clear it does much else.
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      ## 5. The Ethics of Vote Buying
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      Many citizens of modern democracies believe that vote buying and selling are immoral (Tetlock 2000)[^tetlock-2000]. Many philosophers agree; they argue it is wrong to buy, trade, or sell votes (Satz 2010: 102; Sandel 2012: 104–5)[^sandel-2012][^satz-2010]. Richard Hasen reviews the literature on vote buying and concludes that people have offered three main arguments against it. He says,
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      > Despite the almost universal condemnation of core vote buying, commentators disagree on the underlying rationales for its prohibition. Some offer an equality argument against vote buying: the poor are more likely to sell their votes than are the wealthy, leading to political outcomes favoring the wealthy. Others offer an efficiency argument against vote buying: vote buying allows buyers to engage in rent-seeking that diminishes overall social wealth. Finally, some commentators offer an inalienability argument against vote buying: votes belong to the community as a whole and should not be alienable by individual voters. This alienability argument may support an anti-commodification norm that causes voters to make public-regarding voting decisions. (Hasen 2000: 1325)[^hasen-2000]
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Two of the concerns here are consequentialist: the worry is that in a regime where vote-buying is legal, votes will be bought and sold in socially destructive ways. However, whether vote buying is destructive is a subject of serious social scientific debate; some economists think markets in votes would in fact produce greater efficiency (Buchanan and Tullock 1962; Haefele 1971; Mueller 1973; Philipson and Snyder 1996; Hasen 2000: 1332)[^buchanan-1962][^haefele-1971][^hasen-2000][^mueller-1973][^philipson-1996]. The third concern is deontological: it holds that votes are just not the kind of thing that ought be for sale, even if it turned out that vote-buying and selling did not lead to bad consequences.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Many people think vote selling is wrong because it would lead to bad or corrupt voting. But, if that is the problem, then perhaps the permissibility of vote buying and selling should be assessed on a case-by-case basis. Perhaps the rightness or wrongness of individual acts of vote buying and selling depends entirely on how the vote seller votes (J. Brennan 2011a: 135–160; Brennan and Jaworski 2015: 183–194)[^brennan-2011a][^brennan-2015]. Suppose I pay a person to vote in a good way. For instance, suppose I pay indifferent people to vote on behalf of women’s rights, or for the Correct Theory of Justice, whatever that might be. Or, suppose I think turnout is too low, and so I pay a well-informed person to vote her conscience. It is unclear why we should conclude in either case that I have done something wrong, rather than conclude that I have done everyone a small public service.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Certain objections to vote buying and selling appear to prove too much; these objections lead to conclusions that the objectors are not willing to support. For instance, one common argument against voting selling is that paying a person to vote imposes an externality on third parties. However, so does persuading others to vote or to vote in certain ways (Freiman 2014: 762)[^freiman-2014]. If paying you to vote for *X* is wrong because it imposes a third party cost, then for the sake of consistency, I should also conclude that persuading you to vote for *X*, say, on the basis of a good argument, is equally problematic.
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      As another example, some object to voting markets on the grounds that votes should be for the common good, rather than for narrow self-interest (Satz 2010: 103; Sandel 2012: 10)[^sandel-2012][^satz-2010]. Others say that voting should “be an act undertaken only after collectively deliberating about what it is in the common good” (Satz 2010: 103)[^satz-2010]. Some claim that vote markets should be illegal for this reason. Perhaps it’s permissible to forbid vote selling because commodified votes are likely to be cast against the common good. However, if that is sufficient reason to forbid markets in votes, then it is unclear why we should not, e.g., forbid highly ignorant, irrational, or selfish voters from voting, as their votes are also unusually likely to undermine the common good (Freiman 2014: 771–772)[^freiman-2014]. Further these arguments appear to leave open that a person could permissibly sell her vote, provided she does so after deliberating and provided she votes for the common good. It might be that if vote selling were legal, most or even all vote sellers would vote in destructive ways, but that does not show that vote selling is inherently wrong.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      One pressing issue, though, is whether vote buying is compatible with the secret ballot (Maloberti 2018)[^maloberti-2018]. Regardless of whether vote buying is enforced through legal means (such as through enforceable contracts) or social means (such as through the reputation mechanism in eBay or through simply social disapproval), to enforce vote buying seems to require that voters in some way actively prove they voted in various ways. But, if so, then this will partly eliminate the secret ballot and possibly lead to increased clientelism, in which politicians make targeted promises to particular bands of voters rather than serve the common good (Maloberti 2018)[^maloberti-2018].
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      Not all objections to vote-buying have this consequentialist flavor. Some argue that vote buying is wrong for deontological grounds, for instance, on the grounds that vote buying in some way is incompatible with the social meaning of voting (e.g. Walzer 1984)[^walzer-1984]. Some view voting is an expressive act, and the meaning of that expression is socially-determined. To buy and sell votes may signal disrespect to others in light of this social meaning.
    step1: TBD
    step2: TBD
