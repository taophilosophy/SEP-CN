      ## 6. Who Should Be Allowed to Vote? Should Everyone Receive Equal Voting Rights?
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The dominant view among political philosophers is that we ought to have some sort of representative democracy, and that each adult ought to have one vote, of equal weight to every other adult’s, in any election in her jurisdiction. This view has recently come under criticism, though, both from friends and foes of democracy.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      Before one even asks whether “one person, one vote” is the right policy, one needs to determine just who counts as part of the demos. Call this the boundary problem or the problem of constituting the demos (Goodin 2007: 40; Ron 2017)[^goodin-2007][^ron-2017]. Democracy is the rule of the people. But one fundamental question is just who constitutes “the people”. This is no small problem. Before one can judge that a democracy is fair, or adequately responds to citizens’ interests, one needs to know who “counts” and who does not.
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      One might be inclined to say that everyone living under a particular government’s jurisdiction is part of the demos and is thus entitled to a vote. However, in fact, most democracies exclude children and teenagers, felons, the mentally infirm, and non-citizens living in a government’s territory from being able to vote, but at the same time allow their citizens living in foreign countries to vote (López-Guerra 2014: 1)[^lópez-guerra-2014].
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      There are a number of competing theories here. The “all affected interests” theory (Dahl 1990a: 64)[^dahl-1990a] holds that anyone who is in fact affected by a political decision or a political institution is part of the demos. The basic argument is that anyone who is affected by a political decision-making process should have some say over that process. However, this principle suffers from multiple problems. It may be incoherent or useless, as we might not know or be able to know who is affected by a decision until after the decision is made (Goodin 2007: 52)[^goodin-2007]. For example (taken from Goodin 2007: 53)[^goodin-2007], suppose the UK votes on whether to transfer 5% of its GDP to its former African colonies. We cannot assess whether the members of the former African colonies are among the affected interests until we know what the outcome of the vote is. If the vote is yay, then they are affected; if the vote is nay, then they are not. (See Owen 2012 for a response.)[^owen-2012] Further, the “all affected interests” theory would often include non-citizens and exclude citizens. Sometimes political decisions made in one country have a significant effect on citizens of another country; sometimes political decisions made in one country have little or no effect on some of the citizens of that country.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      One solution (Goodin 2007: 55)[^goodin-2007] to this problem (of who counts as an affected party) is to hold that all people with *possibly* or *potentially* affected interests constitute part of the polity. This principle implies, however, that for many decisions, the demos is smaller than the nation-state, and for others, it is larger. For instance, when the United States decides whether to elect a warmongering or pacifist candidate, this affects not only Americans, but a large percentage of people worldwide.
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      Other major theories offered as solutions to the boundary problem face similar problems. For example, the coercion theory holds that anyone subject to coercion from a political body ought to have a say (López-Guerra 2005)[^lópez-guerra-2005]. But this principle might be also be seen as over-inclusive (Song 2009)[^song-2009], as it would require that resident aliens, tourists, or even enemy combatants be granted a right to vote, as they are also subject to a state’s coercive power. Further, who will be coerced depends on the outcome of a decision. If a state decides to impose some laws, it will coerce certain people, and if the state declines to impose those laws, then it will not. If we try to overcome this by saying anyone *potentially* subject to a given state’s coercive power ought to have a say, then this seems to imply that almost everyone worldwide should have a say in most states’ major decisions.
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      The commonsense view of the demos, i.e., that the demos includes all and only adult members of a nation-state, may be hard to defend. Goodin (2007: 49) proposes that what makes citizens special is that their interests are interlinked. This may be an accidental feature of arbitrarily-decided national borders, but once these borders are in place, citizens will find that their interests tend to more linked together than with citizens of other polities. But whether this is true is also highly contingent.
    step1: TBD
    step2: TBD
  - id: 95
    kind: body
