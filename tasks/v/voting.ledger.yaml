    source: |-
      ### 6.2 Non-Democratic Challenges to One Person, One Vote
    step1: TBD
    step2: TBD
  - id: 100
    kind: body
    source: |-
      Early defenders of democracy were concerned to show democracy is superior to aristocracy, monarchy, or oligarchy. However, in recent years, *epistocracy* has emerged as a major contender to democracy (Estlund 2003, 2007; Landemore 2012)[^estlund-2003][^landemore-2012]. A system is said to be epistocratic to the extent that the system formally allocates political power on the basis of knowledge or political competence. For instance, an epistocracy might give university-educated citizens additional votes (Mill 1861)[^mill-1861], exclude citizens from voting unless they can pass a voter qualification exam, weigh votes by each voter’s degree of political knowledge while correcting for the influence of demographic factors, or create panels of experts who have the right to veto democratic legislation (Caplan 2007; J. Brennan 2011b; López-Guerra 2014; Mulligan 2015)[^brennan-2011b][^caplan-2007][^lópez-guerra-2014][^mulligan-2015].
    step1: TBD
    step2: TBD
  - id: 101
    kind: body
    source: |-
      Arguments for epistocracy generally center on concerns about democratic incompetence. Epistocrats hold that democracy imbues citizens with the right to vote in a promiscuous way. Ample empirical research has shown that the mean, median, and modal levels of basic political knowledge (let alone social scientific knowledge) among citizens is extremely low (Somin 2013; Caplan 2007; Delli Carpini and Keeter 1996)[^caplan-2007][^delli-1996][^somin-2013]. Further, political knowledge makes a significant difference in how citizens vote and what policies they support (Althaus 1998, 2003; Caplan 2007; Gilens 2012)[^althaus-1998][^caplan-2007][^gilens-2012]. Epistocrats believe that restricting or weighting votes would protect against some of the downsides of democratic incompetence.
    step1: TBD
    step2: TBD
  - id: 102
    kind: body
    source: |-
      One argument for epistocracy is that the legitimacy of political decisions depends upon them being made competently and in good faith. Consider, as an analogy: In a criminal trial, the jury’s decision is high stakes; their decision can remove a person’s rights or greatly harm their life, liberty, welfare, or property. If a jury made its decision out of ignorance, malice, whimsy, or on the basis of irrational and biased thought processes, we arguably should not and probably would not regard the jury’s decision as authoritative or legitimate. Instead, we think the criminal has a right to a trial conducted by competent people in good faith. In many respects, electoral decisions are similar to jury decisions: they also are high stakes, and can result in innocent people losing their lives, liberty, welfare, or property. If the legitimacy and authority of a jury decision depends upon the jury making a competent decision in good faith, then perhaps so should the legitimacy and authority of most other governmental decisions, including the decisions that electorates and their representatives make. Now, suppose, in light of widespread voter ignorance and irrationality, it turns out that democratic electorates tend to make incompetent decisions. If so, then this seems to provide at least presumptive grounds for favoring epistocracy over democracy (J. Brennan 2011b)[^brennan-2011b].
    step1: TBD
    step2: TBD
  - id: 103
    kind: body
    source: |-
      Some dispute whether epistocracy would in fact perform better than democracy, even in principle. Epistocracy generally attempts to generate better political outcomes by in some way raising the average reliability of political decision-makers. Political scientists Lu Hong and Scott Page (2004) adduced a mathematical theorem showing that under the right conditions, cognitive diversity among the participants in a collective decision more strongly contributes to the group making a smart decision than does increasing the individual participants’ reliability. According to the Hong-Page theorem, it is possible that having a large number of diverse but unreliable decision-makers in a collective decision will outperform having a smaller number of less diverse but more reliable decision-makers. There is some debate over whether the Hong-Page theorem supports the intended interpretation (Thompson 2014 claims it does not)[^thompson-2014], whether real-world political decisions meet the conditions of the theorem, and if so, to what extent that justifies universal suffrage, or merely shows that having widespread but restricted suffrage is superior to having highly restricted suffrage (Landemore 2012; Somin 2013: 113–5)[^landemore-2012][^somin-2013].
    step1: TBD
    step2: TBD
  - id: 104
    kind: body
    source: |-
      Relatedly, Condorcet’s Jury Theorem holds that under the right conditions, provided the average voter is reliable, as more and more voters are added to a collective decision, the probability that the democracy will make the right choice approaches 1 (List and Goodin 2001)[^list-2001]. However, assuming the theorem applies to real-life democratic decisions, whether the theorem supports or condemns democracy depends on how reliable voters are. If voters do systematically worse than chance (e.g., Althaus 2003; Caplan 2007)[^althaus-2003][^caplan-2007], then the theorem instead implies that large democracies almost always make the wrong choice.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      One worry about certain forms of epistocracy, such as a system in which voters must earn the right to vote by passing an examination, is that such systems might make decisions that are biased toward members of certain demographic groups. After all, political knowledge is not evenly dispersed among all demographic groups. (At the very least, the kinds of knowledge political scientists have been studying are not evenly distributed. Whether other kinds of knowledge are better distributed is an open question.) On average, in the United States, on measures of basic political knowledge, whites know more than blacks, people in the Northeast know more than people in the South, men know more than women, middle-aged people know more than the young or old, and high-income people know more than the poor (Delli Carpini and Keeter 1996: 137–177)[^delli-1996]. If such a voter examination system were implemented, the resulting electorate would be whiter, maler, richer, more middle-aged, and better employed than the population at large. Democrats might reasonably worry that for this very reason an epistocracy would not take the interests of non-whites, women, the poor, or the unemployed into proper consideration.
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      However, at least one form of epistocracy may be able to avoid this objection. Consider, for instance, the “enfranchisement lottery”:
    step1: TBD
    step2: TBD
  - id: 107
    kind: body
    source: |-
      > The enfranchisement lottery consists of two devices. First, there would be a sortition to disenfranchise the vast majority of the population. Prior to every election, all but a random sample of the public would be excluded. I call this device the exclusionary sortition because it merely tells us who will not be entitled to vote in a given contest. Indeed, those who survive the sortition (the pre-voters) would not be automatically enfranchised. Like everyone in the larger group from which they are drawn, pre-voters would be assumed to be insufficiently competent to vote. This is where the second device comes in. To finally become enfranchised and vote, pre-voters would gather in relatively small groups to participate in a competence-building process carefully designed to optimize their knowledge about the alternatives on the ballot. (López-Guerra 2014: 4; cf. Ackerman and Fishkin 2005)[^ackerman-2005][^lópez-guerra-2014]
    step1: TBD
    step2: TBD
  - id: 108
    kind: body
    source: |-
      Under this scheme, no one has any presumptive right to vote. Instead, everyone has, by default, equal eligibility to be selected to become a voter. Before the enfranchisement lottery takes place, candidates would proceed with their campaigns as they do in democracy. However, they campaign without knowing which citizens in particular will eventually acquire the right to vote. Immediately before the election, a random but representative subset of citizens is then selected by lottery. These citizens are not automatically granted the right to vote. Instead, the chosen citizens merely acquire permission to earn the right to vote. To earn this right, they must then participate in some sort of competence-building exercise, such as studying party platforms or meeting in a deliberative forum with one another. In practice this system might suffer corruption or abuse, but, epistocrats respond, so does democracy in practice. For epistocrats, the question is which system works better, i.e., produces the best or most substantively just outcomes, all things considered.
    step1: TBD
    step2: TBD
  - id: 109
    kind: body
    source: |-
      One important deontological objection to epistocracy is that it may be incompatible with public reason liberalism (Estlund 2007)[^estlund-2007]. Public reason liberals hold that distribution of coercive political power is legitimate and authoritative only if all reasonable people subject to that power have strong enough grounds to endorse a justification for that power (Vallier and D’Agostino 2013)[^vallier-2013]. By definition, epistocracy imbues some citizens with greater power than others on the grounds that these citizens have greater social scientific knowledge. However, the objection goes, reasonable people could disagree about just what counts as expertise and just who the experts are. If reasonable people disagree about what counts as expertise and who the experts are, then epistocracy distributes political power on terms not all reasonable people have conclusive grounds to endorse. Epistocracy thus distributes political power on terms not all reasonable people have conclusive grounds to endorse. (See, however, Mulligan 2015.)[^mulligan-2015]
