      #### 3.2.3 Christianity
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      For Yorck, the Christian life is the breakthrough to a fully historical life. Unencumbered by the projection of objective knowledge (Greek metaphysics and ocularity) and freed from the expectation of a messiah (hope for the promised future), the Christian lives the temporality of “absolute aliveness” [*absolute Lebendigkeit*] in the depths of inwardness or interiority[^note-20] (ST, p. 4). Since Christian consciousness has its dominant focus in interiority and feeling, it is free from the cognitive and volitional bonds to any objectivity, but free for the rhythm of temporality and history. The Christian “freedom from the world” [*Weltfreiheit*] (ST, p. 81) is at the same time freedom *for* history and transcendence, i.e., the world-transcendent God, and the personal, felt relationship to him, which is based on the personal responsibility for one’s historical life before God. Yorck writes:
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      > Through Christianity an essentially transcendent stance of consciousness is achieved, namely by way of the basic factor of feeling. This is a transcendent stance, in contradistinction to a metaphysical one,[^note-21] because feeling [*Gefühl*]—the focal point of aliveness [*Lebendigkeit*]—is here turned inwards, even turned against itself and hence free of all givenness [*Gegebenheit*]. (ST, pp. 13/14)
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      The release from cognitive and volitional projection facilitates an inversion of life’s tendency; it leaves behind the goals of “certainty and security” (CR, p. 143) and grounds life in the personal and intrinsically historical relationship to God.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      On the one hand, Yorck emphasizes the absolute focus on inner life and individual conscience, and the entirely unpredictable and historical relationship to God, this side of all objective worldly realities and public opinion.[^note-22] The individual person is singled out in his relationship to God. On the other hand, Yorck also holds that the Christian inversion of the projective tendency of life ultimately results in “self-renunciation” [*Selbstaufgabe*], which expresses the religious pole, opposite to ethical self-affirmation through philosophy and science. But precisely through this self-renunciation, life is lived *as* life, instead of being lost in the preoccupation with that which is merely intended through life—the objectively known and desired world. With reference to *Matthew* (10:39), Yorck writes:
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      > He who finds his life, will lose it, he who loses it, will find it. This word of the Lord describes the law of life itself, the basic condition of all life. Death is a mark of life and the radical transcendence of the deepest, the Christian standpoint postulates life as a mark of death. (ST, p. 58)
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Yorck’s well-known love for paradox has its definitive origin here.[^note-23]
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Freed from the bonds to objective representation and the objective world, Christian religion realizes the most concentrated or enhanced form of living life *as* life; it is “supreme aliveness” [*höchste Lebendigkeit*] and thus supreme historicity (ST, p. 104; CR, p. 154). The Christian life is not distracted by the aims of cognition (objectivity) or the ties to objects of desire within the world (in the past, present, or future). Accordingly, Yorck holds that the historical “origin” and “supreme” manifestation of life—fully lived as *historical life*—lies in Christianity.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      In his *Einleitung in die Geisteswissenschaften* (1883), Dilthey had made a similar, but by no means identical, point, arguing that “historical consciousness” first came into existence through the Christian freedom from the outer world (the cosmos) and the newfound centre of life in inwardness (Dilthey 1959, p. 254)[^dilthey-1959]. Dilthey writes:
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      > For the Greek mind, knowledge was the depiction [*Abbilden*] of something objective, [given] to intelligence. Now [after the emergence of Christianity], lived experience [*Erlebnis*] becomes the centre point of all interests for the new communities; but this is nothing other than the simple, inner awareness [*Innewerden*] of what is given to the person in self-consciousness. (Dilthey 1959, p. 251)[^dilthey-1959]
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      Yet Dilthey sees this as the first potential breakthrough to a new science, the science of inner experience and the historical disciplines, the Humanities or *Geisteswissenschaften*. According to Dilthey, Augustine’s fateful dependence on Greek conceptuality made it impossible to fully articulate the new Christian sense of inwardness and history (Dilthey 1959, p. 264)[^dilthey-1959]. Only through the work of Schleiermacher and Kant has there been progress in articulating the original Christian insight into inwardness and historicity of life (Dilthey 1959, p. 267)[^dilthey-1959]. Not only does Dilthey fully accept that the meaning of the original Christian experience is thus adequately comprehended and harnessed for the understanding, but he also sees his own work on the logic of the historical sciences as a continuation and fulfilment of this same project.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      By contrast, Yorck eschews all cooptation of the Christian breakthrough to supreme historical aliveness and historicity for the establishment of a science, fearing that this would not only conceptualize life as something “ontic,” always present and available for the understanding, but also ignore the vital consciousness of transcendence, or bury it in a new scholasticism.[^note-24] Yorck, who always regarded Luther’s work as the vital re-affirmation of the early Christian historical life, suggests, therefore, that instead of Kant and Schleiermacher, a return to Luther’s conception of life is the more fruitful way of safeguarding and cultivating the breakthrough to historical life. Acknowledging this difference, Yorck writes to Dilthey:
    step1: TBD
    step2: TBD
