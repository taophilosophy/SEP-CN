      According to Yorck, in Ancient Greece consciousness displayed a particular configuration of the primacy of cognition. For the Greeks, the stance of consciousness towards the world is pure looking. It is through looking that reality is understood. Affectivity (feeling) and volition are not countenanced as functions that disclose the world as such.[^note-18] Truth lies in the beholding eye alone; contemplation, *theoria*, and intuition take centre stage.
    step1: |-
      依约克之见，在古希腊，意识展现出认知居先的一种特定配置。对希腊人来说，意识对世界的态度是纯粹的观看。实在正是通过观看而被理解。情感性（感觉）与意志不被承认为如其所示地开显世界的机能。[^note-18] 真理只在于观看的眼睛；静观、*theoria* 与直观居于舞台中央。
