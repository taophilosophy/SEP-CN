      汉斯·路德维希·保罗·约克·冯·瓦滕堡伯爵（1835–1897）是德国哲学家。他之为人所知，首先在于他与朋友威廉·狄尔泰（1833–1911）的长期合作，以及他对马丁·海德格尔（1889–1976）与汉斯-格奥尔格·伽达默尔（1900–2002）的影响。约克与狄尔泰一道，是最早阐发**历史性**[*Geschichtlichkeit*]这一特定概念的哲学家，即把它当作人的**存在论**的规定性特征。约克尤其强调**存在者层面之物与历史之物的一般差别**，即：被看作或被概念化（或被审美地观照）为永恒自然、本质或理念的东西，与被感受到的生命历史节律之间的差别——所谓生命的历史节律，即生命之沉浸于并归属于那笼罩一切、不断变动的历史波涛。与狄尔泰致力于澄清历史科学相对于自然科学的认识论基础不同，约克只以历史生命的存在论为目标，尤其是把世代生命联结起来的那条历史纽带（*syndesmos*）与实效关联（*virtuality*）。基于历史生命的优先性，约克采取了一种断然反形而上学的立场，拒斥一切“永恒之相”（*sub specie aeternitatis*）下的知识主张。他又把这一点同一种基督教的、尤其是路德宗的上帝观结合在一起：这位上帝是历史的、人格的，却完全超越；相对于这位上帝，每一个人都以不可逃脱的唯一性界定自己的人生故事。约克的思想最初公之于众，是 1923 年他与狄尔泰《通信集》的身后出版（Yorck 1923）。借助这一出版物，他影响的不仅是海德格尔（见 Farin 2016, Fagniez 2013, Dastur 2011, Ruin 1994）[^dastur-2011][^fagniez-2013][^farin-2016][^ruin-1994]与伽达默尔（1990），还有米施、罗特哈克、朔勒姆、布尔特曼、马尔库塞等人。1956 至 1970 年间，约克著述的一些未完成断片陆续出版（见参考文献）。其中包含约克系统的历史心理学与哲学史的轮廓，也有关于时间性在思想与形而上学中被部分否定或抑制的广泛思考（其原因是表象与思想本身固有的空间性格）。这些晚期著作所受的关注，不如他早期《通信集》中的观点那样多。
