      According to Yorck, the characteristics of human psychology and the economy of primary life delimit the course of history, since historical life merely repeats or amplifies the primary stances of consciousness. Although there is thus a natural ground for history, Yorck is at pains to emphasize that the three psychological functions outline “possibilities” only, without any inbuilt teleology or fixed equilibrium, or a relation to “an unchanging *ordo*” as a permanent backdrop for history (ST, p. 4). Against such approximations of history to nature, Yorck argues for a thoroughly historical conception of the historical: “History has nothing of the isolation [*Selbständigkeit*] of the natural [order]” (ST, p. 6), but rather, in each of its phases, history is self-reflexively involved in its own historicity—“as the ferment of its aliveness”—and thus opens itself to the ever new “historical *contrapposto*” (ST, p. 6). Nothing is exempt from historical change. Philosophical categories through which the world is understood are historical products of life and hence inextricably bound up with the historicity of humankind. For instance, Yorck explicitly claims that the category of “being” is itself “a result of life” (ST, p. 8). This liberates history from all relation to an unchanging, fixed point of reference outside historical life.[^note-16]
    step1: |-
      依约克之见，人类心理学的特征与原初生命的配比划定了历史的进程，因为历史生命只是重演或放大原初的意识立场。虽然历史因此有一个自然基地，约克却着力强调：三种心理机能只勾画出一些“可能性”，其中没有任何内置的目的论或固定均衡，也没有与“不变的*秩序*（*ordo*）”的关系——仿佛历史有一个永久背景（ST, p. 4）。针对这类把历史自然化的取径，约克主张一种彻底历史的、关于历史的概念：“历史丝毫没有自然[秩序]的那种自立性[*Selbständigkeit*]”（ST, p. 6）；毋宁说，在它的每一个阶段，历史都自反地牵涉于自身的历史性之中——“作为其生命性的酵素”——从而向不断更新的历史“对置”（*contrapposto*）敞开自己（ST, p. 6）。没有什么能豁免于历史变化。人们借以理解世界的哲学范畴，是生命的历史产物，因而与人类的历史性难解难分。例如，约克明确主张，“存在”范畴本身就是“生命的一个结果”（ST, p. 8）。这就把历史从它与历史生命之外某个不变的、固定的参照点的一切关系中解放出来。[^note-16]
