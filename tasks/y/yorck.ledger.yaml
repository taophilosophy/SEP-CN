      #### 3.2.1 The Greek World
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      According to Yorck, in Ancient Greece consciousness displayed a particular configuration of the primacy of cognition. For the Greeks, the stance of consciousness towards the world is pure looking. It is through looking that reality is understood. Affectivity (feeling) and volition are not countenanced as functions that disclose the world as such.[^note-18] Truth lies in the beholding eye alone; contemplation, *theoria*, and intuition take centre stage.
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      > It is as if the clear-sighted eye is expressed in words. On the basis of this condition of consciousness, the function of looking [*Anschauung*], ocularity [*Okularität*], becomes the organ of all free work of the mind, particularly of philosophy. (ST, p. 30)
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Yorck finds evidence for the prevalence of ocularity or the aesthetic attitude, which is centred on plasticity [*Gestaltlichkeit*], in Homer, Pythagoras, Plato, and Aristotle, among others.
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      > Form and content constitute the aesthetic dichotomy which governs Greek thought in its entirety, the result of the liberation of ocularity from all other sensuality, the aesthetic liberation, which strikes a chord in everyone who has entered the threshold of Greek life. Looking is the essential comportment; hence, Gestalt or Form [qualifies as] ousia or substance.[^note-19] (ST, p. 31)
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      That Greek metaphysics seeks the unchangeable and impassable is the result of the relative suppression of feeling and willing latent in all cognition, which abstracts from desires, feelings, and temporality (ST, p. 42). Put differently, the structural timelessness of thought as such is intensified in metaphysical thought where it becomes “absolute” (ST, p. 42). Yorck emphasizes that “negation of temporality” marks “the decisive metaphysical step” (ST, p. 66). Metaphysics constitutes the counter-move against the feeling of temporality (that everything passes away), as well as the liberation from the dependence on objects desired by the will. According to Yorck, the escape from temporality and attachment determines the entire metaphysical tradition up to and including Hegel (because even Hegel “ontologizes” life and renders it ontic) (ST, p. 83).
    step1: TBD
    step2: TBD
