      Although Yorck provides only an unfinished sketch of the empirical course of the history of life, he marks three decisive turning-points: (1) The breakthrough to philosophy and science on the basis of the dominant stance of the psychological function of representation or cognition, primarily in ancient Greece and India; (2) the predominance of willing in the Roman and Jewish stance towards the world; and (3) the focal centrality of feeling and interiority in Christianity, particular in the Reformation, i.e., Luther. Somewhat like Hegel, Yorck holds that history unfolds through particular primary stances towards life which then become dominant in particular historical peoples.[^note-17]
    step1: |-
      约克对生命之历史的经验进程只提供了一个未完成的草图，但他标出了三个决定性的转折点：（1）以表象或认知这一心理机能的主导态度为基础、向哲学与科学的突破，主要发生在古代希腊与印度；（2）意愿在罗马与犹太世界态度中的支配地位；（3）情感与内在性在基督教中的焦点中心地位，尤其是在宗教改革、即路德那里。约克多少像黑格尔，认为历史经由特定的原初生活态度而展开，这些态度继而在特定的历史民族中成为主导。[^note-17]
    step2: |-
      关于生命之历史的经验进程，约克给出的只是一幅未完成的草图；但他标出了三个决定性的转折点：（1）以表象或认知这一心理机能的主导态度为基础，向哲学与科学突破——主要发生在古代希腊与印度；（2）意愿在罗马与犹太的世界态度中取得支配；（3）情感与内在性在基督教中占据焦点中心——尤见于宗教改革，即路德。约克有点像黑格尔：他认为历史经由特定的原初生活态度而展开，这些态度继而在特定的历史民族那里成为主导。[^note-17]
