      From the early 1890s Yorck worked on a manuscript on Heraclitus (Yorck 1896/97) and a book about the *Stances of Consciousness and History* (Yorck 1892–1897).[^note-1] Before his death, Yorck declared the two works unfinished and not ready for publication. Published only posthumously, they are, in the words of Karlfried Gründer (1970, 55), “sketches” of first drafts for “great philosophical books.” Paul Yorck died at Klein-Oels, September 12, 1897. His grandson, Count Peter Yorck, who had studied Yorck’s unfinished works, was a leading member of the Kreisauer Circle, the German resistance cell responsible for the failed attempt to assassinate Hitler on July 20, 1944.
    step1: |-
      自 1890 年代初起，约克写作一部论赫拉克利特的手稿（Yorck 1896/97）和一部关于《意识立场与历史》的书（Yorck 1892–1897）。[^note-1] 临终之前，约克声明这两部著作未完成、不宜出版。它们只在身后刊行；用卡尔弗里德·格林德（1970, 55）的话说，它们是“伟大哲学著作”初稿的“草图”。保罗·约克 1897 年 9 月 12 日死于克莱因厄尔斯。他的孙子彼得·约克伯爵研读过约克未完成的手稿，后来成为克莱绍圈的核心成员——那个德国抵抗团体策动了 1944 年 7 月 20 日刺杀希特勒的未遂行动。
    step2: |-
      自 1890 年代初，约克着手写一部论赫拉克利特的手稿（Yorck 1896/97）和一部题为《意识立场与历史》的书（Yorck 1892–1897）。[^note-1] 临终前，约克声明两书俱未完成、不宜出版。两书都在他身后刊行；用卡尔弗里德·格林德（Karlfried Gründer，1970, 55）的话说，它们不过是“伟大哲学著作”初稿的“草图”。保罗·约克 1897 年 9 月 12 日卒于克莱因厄尔斯。他的孙子彼得·约克伯爵研读过祖父未完成的手稿，后来成为克莱绍圈的核心成员——正是那个德国抵抗小组，策动了 1944 年 7 月 20 日行刺希特勒的未遂行动。
