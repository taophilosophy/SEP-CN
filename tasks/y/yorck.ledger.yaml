      Yorck claims that the three psychological “functions” or comportments circumscribe the fixed and unalterable “natural ground” [*Naturboden*], or the parameters within which all human history is played out (ST, p. 26). There is no history without such fixed reference points. The economy of the three functions is not fixed (unlike the functions as such), but is always open to the play of shifting configurations and imbalances (ST, p. 24 & 54). More specifically, the three functions are neither reducible to each other nor derivable from another source, making them in effect equiprimordial. However, they stand in a variable and inverse relationship to each other, where the relative preponderance of one function is offset by the relative subordination of the remaining ones, but at no time can any particular function be cancelled out altogether (ST, p. 98). This inverse relationship, coupled with the internal polarity within each function, accounts for “the restlessness of primary life” (ST, p. 32). Since life does not exist in some generality, but only as a particular configuration or alignment of its functions, the overall “totality” of the shape of a particular life is always determined by a pre-dominant position of one of its functions (ST, p. 55). This onesidedness, which necessarily fails to express life in its “entire fullness”[^note-10] (ST, p. 54), results in the instability of each particular shape of consciousness. Each real configuration of consciousness and its particular bias to one function, as well as one of the antithetical poles within, lends itself to a new transformation, without ever reaching a stable or final state. Since “historical life” is nothing other than “primary life” writ large, Yorck holds that this inbuilt instability and restlessness in primary life also constitutes the “motor of history” (ST, 33). (See Section 3.2 below.)
    step1: |-
      约克主张，这三种心理“机能”或行为方式划定了固定而不可更易的“自然基地”[*Naturboden*]，即一切人类历史于其中演出的参数（ST, p. 26）。没有这样的固定参照点，就没有历史。三种机能的配比不是固定的（不同于机能本身），而是始终敞开于配置移动与失衡的游戏（ST, p. 24 & 54）。更确切地说，三种机能既不能相互还原，也不能从别的源头导出，因而实际上是同等原初的。不过，它们彼此处于一种可变的、反向的关系之中：一种机能的相对优势，被其余机能的相对从属所抵偿；但任何时候，任何特定机能都不能被全然取消（ST, p. 98）。这种反向关系，加上每种机能内部的对立性，说明了“原初生命的躁动不宁”（ST, p. 32）。既然生命不是以某种普遍性存在，而只是作为其诸机能的一种特定配置或编配而存在，一个特定生命形态的总体“总体性”就总是由其某一机能的占先地位所决定（ST, p. 55）。这种片面性必然无法把生命表达于其“整全的充盈”之中[^note-10]（ST, p. 54），它导致每一种特定的意识形态都不稳定。每一个现实的意识配置，连同它对某一机能的特定偏倚、连同其内部两极中的一极，都容许新的转变，永不达到稳定或终极的状态。既然“历史生命”无非是放大了的“原初生命”，约克便认为，原初生命中这种固有的不稳定与躁动不宁，也构成“历史的发动机”（ST, 33）。（见下文 3.2 节。）
    step2: |-
