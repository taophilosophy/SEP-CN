    kind: body
    source: |-
      Yorck emphasizes that cognition of objects in space amounts to an act of “liberation,” because what has been “placed” at a “psychological distance” in the realm of an eternal, and neutral objectivity has lost its power over the representing subject, has no impact on the person’s affectivity, and can no longer excite the feeling that everything passes away (ST, p. 74).
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      There is thus a positive correlation between cognition and volition. Cognitive projection is already an attempt to gain a foothold relative to “the flight of impressions, appearances, and strivings,” and the fixation of an object in space goes hand in hand with the search for self-constancy and “self-affirmation” [*Selbstbehauptung*] (ST, p. 66). Therefore, Yorck holds that philosophy and science, as cognitive comportments in life, are rooted in the striving for self-affirmation. He thus attributes an eminent ethical impetus to them. “Freedom” and “autonomy” are the psychological motivation for philosophy and science (ST, p. 42).
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      In contrast to cognition and volition, which are “eccentric” and directed towards the “outer,” feeling or affectivity [*Gefühl* or *Empfindung*] is the awareness of inwardness or interiority. Yorck writes: “The essence of the inner [*des Innen*] is feeling [*Empfindung*]” (ST, p. 71). At the limit, feeling is object-less and an immersion in subjective life. As Yorck explains, feelings are only secondarily attached to objects. Pain or pleasure, for instance, has no “representational content” [*Vorstellungsinhalt*]. Yorck writes: When “I feel, I stay within me” (ST, 71)—*chez moi*, *bei mir*. Feeling is only minimally projective. However, since polarity permeates all psychological functions, Yorck is quick to recognize “a relation” to the other, for there is no “inner” without an “outer.”[^note-12] But the centre of feeling or affectivity is the sphere of one’s own, pure interiority, not as representation, but as something felt. Therefore, it is the actual seat of “all things personal” [*alles Persönliche*], the innermost centre of personal life (ST, p. 85). It is the “central” and immediate pulse of life, antecedent to the objectifications by cognition and volition (ST, p. 14). Yorck writes: “The relation of self to feeling is more immediate” than the subject’s relation to representation (ST, p. 99). Since the personal is something *felt* in the interiority of one’s life, and not something *thought* or represented and projected outwards, Yorck concludes that self-relation is not cognitive in the first place; it is not “knowledge” (ST, p. 72). Therefore, Yorck also finds it a misguided effort “to grasp natural and historical communities by means of representation,” because it misses the felt personal attachment, which alone lends reality to the historical connectivity and relation (ST, p. 72). Already in the *Correspondence*, Yorck had stated that “historical reality is a reality of feeling [*Empfindungsrealität*]” (CR, p. 113).
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      Next, Yorck also claims that “time originates in feeling” (ST, p. 135). But as feeling is non-projective, it follows that, originally, “temporality” is not “objective”[^note-13] (ST, 146). Yorck distinguishes between the feeling of transitoriness, i.e., that everything passes away [*Vergänglichkeitsgefühl*] (ST, p. 33), and the feeling or awareness of one’s own mortality [*Sterblichkeitsgefühl*][^note-14] (ST, p. 90). Acquiescence into one’s own mortality constitutes the opposite pole to self-affirmation: “self-renunciation” [*Selbsthingabe*] (ST, p. 14), which is thus distinct from and even antithetical to the ethical impetus in philosophy and science. Yorck argues that the inversion of volitional and cognitive projection in feeling and its concentration in pure, passive interiority amounts to a “religious comportment” and the feeling of dependency (ST, 121). To the extent that the religious concentration of life in interiority is inversely related to projective representation, Yorck understands religious life in terms of its “freedom from the world” or *Weltfreiheit* (ST, p. 81 & 112). Psychologically, freedom from the world is the precondition for the consciousness of a world-transcendent God, or the consciousness of transcendence (ST, p. 105). Yorck only hints at the projection *sui generis* involved in transcendence. But it is a projection that has no cognitive or volitional content: God is intended without becoming “an object,” and willing becomes a “non-willing,” albeit without loss of energy (ST, 104).
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Drawing on Dilthey and Schleiermacher, Yorck argues that the immediate and indubitable reality of life is exclusively “guaranteed” through volition and affectivity alone. Yorck writes: “That which opposes me or that which I feel, I call real,” because I cannot doubt what resists my will or affects my personal life, whereas it is always possible to doubt objects neutrally represented in space outside me (ST, p. 89). What is thought and grasped as an unchanging, stable and self-same object in the space of thought does not affect me or solicit a desire. For Yorck, cognition, in abstraction from feeling and volition, is the realm of pure “phenomenality,” which is always open to doubt in virtue of its being merely represented or thought (ST, p. 88). Because “the category of reality is a predicate of feeling and willing” alone (ST, p. 128), Yorck concludes that it is an “utterly uncritical” and self-contradictory undertaking to attempt to prove “the reality of the world” by means of the understanding (ST, p. 129). What Yorck writes to Dilthey in a more general vein is also applicable to this particular problem:
    step1: TBD
    step2: TBD
