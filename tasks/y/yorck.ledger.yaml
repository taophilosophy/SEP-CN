      汉斯·路德维希·保罗·约克·冯·瓦滕堡伯爵（1835–1897）是一位德国哲学家。人们知道他，首先是因为他与友人威廉·狄尔泰（Wilhelm Dilthey，1833–1911）多年的合作，也因为他对马丁·海德格尔（Martin Heidegger，1889–1976）和汉斯-格奥尔格·伽达默尔（Hans-Georg Gadamer，1900–2002）的影响。约克与狄尔泰一道，最先阐发了**历史性**[*Geschichtlichkeit*]这一概念，把它当作人的**存在论**的规定性特征。他特别强调**存在者层面之物与历史之物的一般差别**，也就是被看作、被概念化（或被审美观照）为永恒自然、本质或理念的东西，同生命的历史节律——生命沉浸其中、归属其下的那片笼罩一切而不断变动的历史波涛——之间的差别。狄尔泰致力于澄清历史科学相对于自然科学的认识论基础；约克不同，他只以历史生命的存在论为务，尤其关注把世代生命联结起来的那条历史纽带（*syndesmos*）与实效关联（*virtuality*）。以历史生命的优先性为根基，约克持一种断然反形而上学的立场，拒斥一切“永恒之相”（*sub specie aeternitatis*）下的知识主张。与这一立场相伴的，是一种基督教的、尤其是路德宗的上帝观：上帝是历史的、人格的，却又完全超越；面对这位上帝，每一个人都在无可逃脱的唯一性中书写自己的人生故事。约克的思想最初为公众所知，靠的是 1923 年他同狄尔泰《通信集》的身后出版（Yorck 1923）。凭借这部书，他影响所及不止于海德格尔（见 Farin 2016、Fagniez 2013、Dastur 2011、Ruin 1994）[^dastur-2011][^fagniez-2013][^farin-2016][^ruin-1994]和伽达默尔（1990），还有米施、罗特哈克、朔勒姆、布尔特曼、马尔库塞等人。1956 到 1970 年间，约克著述的几部未完成断片陆续刊行（见参考文献）。这些文本既勾勒出约克那套系统的历史心理学与哲学史的轮廓，也包含大量思考，讨论时间性如何在思想与形而上学中遭到部分否定或抑制——缘由在于表象与思想本身固有的空间性格。比起他早期《通信集》中的观点，这些晚期著作受到的关注要少得多。
