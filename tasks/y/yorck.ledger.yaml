      For Yorck, as for Dilthey, human life is incorrectly understood if it is subsumed under the generic catch-all category of “existence.” The first point is that human life is inconceivable without temporal and historical development, movement, and change; life always transcends itself, hence it never simply “is.” The mode of being for humans is “life,” not “existence.”[^note-3] And life, unlike existence, is intrinsically historical. Precisely this distinction is brought home by Yorck’s demand to always observe “the generic difference between the ontic and the historical” (CR, p. 191). The ontic is what is simply “there” without inner life, temporality, or history. It includes the physical entities in the world, as well as abstract objects, numbers, essences, ideas, etc. The “ontic” is *toto caelo* other than “the historical.” Yorck’s second point is that all history is a development of human powers or *human psychology*, where psychology does not mean some inert or fixed “nature,” but the constant play of forces, the ever shifting configurations between understanding, affectivity, and volition. (See Section 3.1 below.)
    step1: |-
      对约克如同对狄尔泰，如果把人的生命归笼到“生存”这一笼而统之的类概念之下，就误解了它。第一点：人的生命离开时间性与历史性的发展、运动与变化便不可设想；生命总是超出自身，因此它从不单纯“存在”。人的存在方式是“生命”，而不是“生存”。[^note-3] 而且，与生存不同，生命本质上是历史的。约克要求始终注意“存在者层面之物与历史之物的一般差别”（CR, p. 191），正是要让人记住这一区分。存在者层面之物是单纯“在那里”的东西，没有内在生命、时间性或历史。它包括世界中的物理实体，也包括抽象对象、数、本质、理念等等。“存在者层面之物”与“历史之物”有天壤之别（*toto caelo*）。约克的第二点是：一切历史都是人的诸种力量的展开，即*人的心理学*；这里说的心理学，不是某种惰性的、固定的“自然”，而是诸力量的恒常运作，是知性、情感性与意志之间不断变动的配置。（见下文 3.1 节。）
    step2: |-
      无论约克还是狄尔泰都认为：把人的生命归入“生存”这个笼而统之的类概念之下，便误解了生命。第一点：人的生命若离开时间性与历史性的发展、运动与变化，便无从设想；生命总是越出自身，因而从不单纯“存在”。人的存在方式是“生命”，不是“生存”。[^note-3] 况且，生命不同于生存之处，正在于它本质上是历史的。约克要求人们始终注意“存在者层面之物与历史之物的一般差别”（CR, p. 191），为的就是记住这一区分。存在者层面之物，是单纯“在那里”的东西：没有内在生命，没有时间性，也没有历史。它既包括世界中的物理实体，也包括抽象对象、数、本质、理念等等。“存在者层面之物”与“历史之物”之间，有天壤之别（*toto caelo*）。约克的第二点是：一切历史都是人的种种力量的展开，也就是*人的心理学*的展开；这里说的心理学，不是某种惰性而固定的“自然”，而是诸力量的恒常运作，是知性、情感性与意志之间不断变动的配置。（见下文 3.1 节。）
