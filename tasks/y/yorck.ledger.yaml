      Consequently, Yorck rejects from the start the transcendental method in philosophy as insufficient for grasping lived historical reality. Transcendental philosophy reduces historical life to the merely “subjective,” which misses the genuine characteristic of *Geist*, spirit or mind, namely its real, historical extension and connection. As Yorck puts it, “the transcendental method” merely suspends or sublates “the realm of the objective,” but it fails to “extend the region of *Geist*” (CR, p. 194). Insisting that “the character of subjectivity does not even reach the realm of *Geist*” (CR, p. 194), Yorck clearly implies that the “realm of history” is the proper domain for *Geist*. It follows that, despite his criticism of the narrow confines of transcendental and/or subject-centred philosophy, Yorck’s philosophical conception of history is still inscribed within the confines of *Geist*-philosophy. Following Hegel, who argues that everything hinges on the understanding that “substance is subject” (Hegel 1807, p. 19), Yorck agrees that everything hinges on the understanding that “substance is history” or “substance is historical spirit.”[^note-4]
    step1: |-
      因此，约克从一开始就拒斥哲学中的先验方法，认为它不足以把握被活过的历史实在。先验哲学把历史生命还原为单纯“主观的”东西，因而错过了*精神*（*Geist*）——精神或心灵——的真正特征，即它实在的、历史的延展与联结。正如约克所说，“先验方法”只是悬搁或扬弃“客观者之领域”，却未能“扩展*精神*的疆域”（CR, p. 194）。约克坚持“主观性的品格甚至够不到*精神*的领域”（CR, p. 194），这清楚地暗示：“历史之领域”才是*精神*的固有领地。由此可以得出：尽管批评先验哲学或主体中心哲学的狭隘藩篱，约克的历史哲学构想仍然刻写在*精神*哲学的界限之内。黑格尔主张一切系于“实体即主体”这一理解（Hegel 1807, p. 19）；追随黑格尔，约克也认为一切系于“实体即历史”或“实体即历史精神”的理解。[^note-4]
