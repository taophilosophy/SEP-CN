      > 我们仅仅知道一门唯一的科学，即历史科学。历史可以从两方面来考察，可以把它划分为自然史与人类史。但这两方面不可看作彼此独立的实体。只要有人存在，人与自然就彼此影响。自然史，即所谓博物学，在这里与我们全然无关。但我们将不得不讨论人类史，因为几乎全部意识形态要么是对这部历史的歪曲解释，要么是对它的完全抽离。（Karl Marx, *Selected Writings*, Lawrence H. Simon (ed.), Indianapolis: Hackett, 1994, p. 107）
