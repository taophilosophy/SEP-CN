      [^note-8]: In recent years, Charles Bambach has forcefully argued that Yorck’s rejection of groundlessness [*Bodenlosigkeit*] amounts to the *de facto* claim for the rootedness of authentic thought in the “native earth,” the soil of the homeland (*Heidegger’s Roots: Nietzsche, National Socialism, and the Greeks*, Ithaca: Cornell University Press, 2003, p. 18). According to this reading, Yorck’s project is an attempt to vindicate the dependency of thought on the earth, autochthony [*Bodenständigkeit*], a more or less reactive move against the massive waves of modern urbanization and the growth of cosmopolitanism. There is no question that, on the socio-political level at least, Yorck looks askance at the “ground-less” or “property-less” condition [*boden-loser Status*] of the modern city dweller (CR, 20). Yorck claims that “the alienation from the ground” takes away the necessary centre of gravity in people. Bereft of the ties to the ground, people achieve only “an unstable balance,” and they become liable to great fluctuations in their behaviours, thoughts, etc. (CR, 20). Coupled with Yorck’s anti-bourgeois, anti-democratic, and anti-Semitic sentiments with which he tends to lace his comments in the *Correspondence* with Dilthey, one can easily picture the intellectual physiognomy of Yorck as a member of the landed nobility, defending the interests of the Prussian Junker class by validating the “stability” and “necessity” of landed property as a precondition for authentic thought. On the other hand, an early critic of Yorck, the philosopher Fritz Kaufmann, has pointed out that in the *Correspondence* Yorck never uses the term *Bodenständigkeit*, autochthony (1928, 40). The “ground” on which thinking is to be based is the ground of consciousness or life, which for Yorck always means the living self-consciousness of an individual person in the context of his or her historical reality and the felt relation to the transcendent God. The evidence found in one’s *own* life (considered in its entirety) provides what Yorck calls “the legitimating ground” [*Rechtsgrund*] for all claims (CR, 66). However, in his philosophical manuscripts (see section 3 below) to which Kaufmann had no access in 1928, Yorck once directly relates “groundlessness” or *Bodenlosigkeit*—taken as the physical lack of a home—to the particular shape of thought of the Hebrew people. Yorck writes about their exile:

      > It has been remarked that the landlessness [*Landlosigkeit*] over many years of the exiled caused the groundlessness [*Bodenlosigkeit*] of the Jewish consciousness of God. (Yorck 1892–97, 16)

      However, Yorck immediately continues by contesting this view: “Yet, events of this sort have an effect only if the psychological preconditions are in place” (16). Hence, Iring Fetscher comments that for Yorck “landlessness” as such is “not a sufficient condition” for “groundlessness” because only a preceding historical stance of *consciousness*—a stance of life—can be the effective ground for it (1991, 197, note 23).
