      > It is my growing conviction that today we stand at a historical turning point similar to the one of the 15ᵗʰ century. In contradistinction to the scientific-technological progress, which consists in increased abstraction and isolation, a new formation comes into being because the human being in his entirety [*der ganze Mensch*] once again takes a stand and faces the problems of life. Every time it is a new stance towards life [*Lebensstellung*] and a new conception of it that ushers in a new epoch, not any old discovery or invention, even if it is of the greatest import. The thread on which science hangs has become so long and spun ever so thin, that now it is snapping in the face of the impetuous question: What is truth? (CR, p. 128)
    step1: |-
      > 我日益确信，今天我们正站在一个历史的转折点上，与 15ᵗʰ 世纪的转折相类似。科学技术的进步在于日益抽象与隔离；与之相反，一种新构形正在形成，因为完整的人[*der ganze Mensch*]重新站立起来，直面种种生活问题。每一个时代之开启，都是由于一种新的生活态度[*Lebensstellung*]和关于生活的新构想，而不是由于任何旧的发现或发明，无论后者多么重大。科学所悬于其上的那根线，已变得如此之长、纺得如此之细，以致在“何为真理？”这一急切问题面前，它就要断了。（CR, p. 128）
    step2: |-
      > 我日益确信：今天我们正站在一个历史的转折点上，情形与 15ᵗʰ 世纪相仿。科学技术的进步在于日益的抽象与隔离；与之相反，一种新的构形正在成形，因为完整的人[*der ganze Mensch*]重新挺身而立，直面种种生活问题。开启每一个新时代的，总是一种新的生活态度[*Lebensstellung*]、一种关于生活的新构想，而不是任何旧的发现或发明——无论后者多么重大。科学悬于其上的那根线，已经放得如此之长、纺得如此之细，以致在“何为真理”这一急迫问题面前，眼看就要断了。（CR, p. 128）
