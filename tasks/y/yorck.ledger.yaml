      [^note-7]: It remains unclear whether Yorck’s recourse to transcendence reinserts a supra-historical point of reference into historical life. For instance, Yorck himself says that “the Christian” stands “above history” (CR, 70). That would hardly make the Christian standpoint a fitting reference-point for a thoroughly historical life. Walter Schulz has argued, clearly with Yorck among others in mind, that the attempt to advance a counter-concept to Greek metaphysics and modern objectivism by starting from the fact of historical life can be successful only on the condition that “the basic Christian approach” and particularly “the idea of transcendence” is abandoned, because it is “ahistorical” (Walter Schulz, *Philosophie in der Veränderten Welt*, Pfullingen: Neske, 1972, p. 480).
