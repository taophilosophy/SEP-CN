      With Dilthey, Yorck attempts to highlight the “full human being” [*den ganzen Menschen*] (CR, p. 157), as opposed to the rationalistically reduced, one-dimensional individual that has preoccupied modern philosophy and shaped modern culture. The historicization of philosophy belongs to this project, as does the acknowledgment of transcendence. According to Yorck, transcendence (CR, pp. 120, 144) facilitates the withdrawal from the world in its objective reality (as represented by thought and metaphysics). It lets human life pivot around the personal, historical, and affective dimension, foregrounding personal responsibility and accountability to the transcendent God. Against the theoretical-metaphysical stance directed at an ever present objective reality, Yorck insists on the primacy of the personal, historical relation to the transcendent God. Yorck’s dictum “Transcendence contra metaphysics!” expresses not only a very strong leitmotif in his philosophical thought (CR, p. 42); it is actually the very capstone.[^note-7] For this reason, Yorck has been interpreted as a religious existentialist (Kaufmann, 1928). This sets him apart from Dilthey. Yorck’s conception of Christianity is heavily biased in favour of Luther’s theology. According to Yorck, Luther’s anti-metaphysical, historical stance towards transcendence remains a historical task for the future development of philosophy (CR, pp. 144 & 145).
    step1: |-
      与狄尔泰一道，约克试图凸显“完整的人”[*den ganzen Menschen*]（CR, p. 157），以别于那种被理性主义化约为一维的个人——现代哲学为之倾倒、现代文化也由之塑形的，正是这种一维个人。哲学的历史化属于这项事业，对超越的承认亦然。在约克看来，超越（CR, pp. 120, 144）使人得以从客观实在（如思想与形而上学所表象的那样）的世界中抽身。它让人的生活转向人格的、历史的与情感的维度，凸显人对超越上帝的人格责任与担当。针对那种指向永远在场的客观实在的理论—形而上学姿态，约克坚持与超越上帝的人格的、历史的关系的优先性。约克的格言“超越对抗形而上学！”不仅表达了他哲学思想中一个极强的主导动机（CR, p. 42）；它实际上就是顶石。[^note-7]因此，约克被解读为一位宗教实存主义者（Kaufmann, 1928）。这一点使他与狄尔泰分别开来。约克的基督教观深深偏向路德的神学。依约克之见，路德对超越的反形而上学的、历史的姿态，仍然是哲学未来发展的一项历史任务（CR, pp. 144 & 145）。
    step2: |-
      与狄尔泰一道，约克试图凸显“完整的人”[*den ganzen Menschen*]（CR, p. 157），以别于那种被理性主义削平为一维的个人——现代哲学为之倾心、现代文化也由之塑形者，正是这种一维个人。哲学的历史化属于这项事业，对超越的承认亦然。在约克看来，超越（CR, pp. 120, 144）使人得以从世界抽身——从那个如思想与形而上学所表象的客观实在的世界中抽身。它让人的生活转以人格的、历史的与情感的维度为轴心，凸显人在超越上帝面前的人格责任与担当。针对那种指向永远在场的客观实在的理论—形而上学姿态，约克坚持：与超越上帝的人格的、历史的关系才是首出的。约克的格言“超越对抗形而上学！”不只是他哲学思想中一个极强的主导动机（CR, p. 42）；它简直就是整座建筑的顶石。[^note-7]因此，有人把约克解读为一位宗教实存主义者（Kaufmann, 1928）。这一点使他与狄尔泰分道。约克的基督教观深深偏向路德的神学：依他之见，路德对超越所取的反形而上学的历史姿态，仍是哲学未来发展面前的一项历史任务（CR, pp. 144 & 145）。
