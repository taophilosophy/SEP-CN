      All this is predicated on the supposition of our intuitive access to psychological or primary life through “self-reflection” [*Selbstbesinnung*]. Yorck interprets Dilthey’s insight that one cannot go beyond life to mean that one cannot surpass or transcend “the empirical givenness of self-consciousness,” which entails that philosophy is “empirical,” not speculative (ST, pp. 8, 3). Evidence can only be found in self-consciousness. What does not pass the test in one’s own life cannot count as a valid expression of life: The seat of all necessary truth is “self-experimentation” (ST, 9, also 54).[^note-9]
    step1: |-
      这一切都预设了：我们能经由“自我反思”[*Selbstbesinnung*]直观地通达心理生命或原初生命。狄尔泰有个洞见：人不能越出生命。约克把它解释为：人不能超越或超出“自我意识的被给予性”；这就意味着哲学是“经验的”，而非思辨的（ST, pp. 8, 3）。证据只能在自我意识中寻找。凡未能在自己的生活里通过检验的，就不能算作生命的有效表达：一切必然真理的座位是“自我实验”（ST, 9，另见 54）。[^note-9]
    step2: |-
      这一切都基于一个预设：我们能够经由“自我反思”[*Selbstbesinnung*]而直观地通达心理生命或原初生命。狄尔泰有个洞见——人无法越出生命；约克把它解释为：人无法超越“自我意识的被给予性”。由此可得：哲学是“经验的”，而非思辨的（ST, pp. 8, 3）。证据只能在自我意识里找。凡在一个人自己的生活中经不起检验的，就不得算作生命的有效表达：一切必然真理的宝座，是“自我实验”（ST, 9，另见 54）。[^note-9]
