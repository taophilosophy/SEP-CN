      When in 1923 the *Correspondence* between Yorck and Dilthey (Yorck 1923) (abbreviated hereafter as CR) was published as “a memorial” to their philosophical friendship (CR, VI), it established Yorck not only as an equal to Dilthey and a faithful interlocutor and eager co-worker on Dilthey’s project(s),[^note-2] but also as a philosopher and keen observer of his times in his own right.
    step1: |-
      1923 年，约克与狄尔泰的《通信集》（Yorck 1923）（下文简称 CR）作为他们哲学友谊的“纪念”出版（CR, VI）。它不仅确立了约克作为与狄尔泰平等者的地位、作为狄尔泰事业（一项或多项）之忠实对话者与热忱合作者的地位，[^note-2] 也确立了他本人作为哲学家、作为其时代之敏锐观察者的独立地位。
    step2: |-
      1923 年，约克与狄尔泰的《通信集》（Yorck 1923，下文简称 CR）作为两人哲学友谊的一座“纪念”问世（CR, VI）。这部书确立的东西有二：其一，约克堪与狄尔泰比肩，是他忠实的对话者、其事业的热忱合作者；[^note-2] 其二，约克本人就是一位哲学家、一位时代敏锐的观察者，自有其独立地位。
