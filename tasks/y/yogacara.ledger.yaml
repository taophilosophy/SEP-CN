      ## 3. The *cittamātra* doctrine: The priority of the mind
    step1: TBD
    step2: TBD
  - id: 44
    kind: body
    source: |-
      ### 3.1 The idealism debate
    step1: TBD
    step2: TBD
  - id: 45
    kind: body
    source: |-
      Arguably, the most famous and, at the same time, hotly debated doctrine of the Yogācāra tradition in modern scholarship is the *cittamātra* or *vijñaptimātra* teaching. While not every Yogācāra work advocates the mind- or cognition-only position in any robust sense, the strand of Yogācāra thought that does is frequently referred to in the secondary literature by the neologism “Yogācāra-Vijñānavāda”. The doctrine has often been understood to encapsulate the Western conception of idealism, i.e., the philosophical position that assigns some fundamental priority to the mind or cognition over the (apparently external or material) sensible world (for various Western variants of idealism, see the entry on idealism).
    step1: TBD
    step2: TBD
  - id: 46
    kind: body
    source: |-
      When considering possible ways to spell out this priority in the context of Yogācāra it is useful, and customary, to distinguish between three levels of interpretation: the level of (i) the objects of perception, (ii) the causes of our perceptions, and (iii) ultimate reality (for slightly different three-level analyses, see Finnigan 2017 and the entry on Vasubandhu)[^finnigan-2017]. While, as we shall see, it is quite difficult to determine whether the doctrine of “mere consciousness” holds true at the ultimate level of reality, the priority of mind at the first two levels seems fairly straightforward. According to the Yogācāra-Vijñānavāda position, the objects constituting the (apparently external) sensible world are mind-dependent in the sense that they are nothing but appearances in our cognitions, that is to say, they exist only insofar as they are cognised. The proponents of Yogācāra-Vijñānavāda also hold that our cognitions of sensible objects have a mental cause, since they arise directly from the *ālayavijñāna*’s seeds. Nevertheless, there is considerable disagreement over the exact ontological implications of these views.
    step1: TBD
    step2: TBD
  - id: 47
    kind: body
    source: |-
      More specifically, Yogācāra has standardly been understood as either ontological or epistemological idealism (for an overview of these positions, see Trivedi 2005; Kellner and Taber 2014; the entries on mind in Indian Buddhist philosophy and Vasubandhu; note that a significant part of the idealism debate concerns Vasubandhu’s Yogācāra works)[^kellner-2014][^kellner-2014-2][^trivedi-2005]. According to both readings, the Yogācāra-Vijñānavāda position states that material hypotheses fail to account for the occurrence and appearance of our perceptions, and that we need to appeal to our mind’s own activities to explain the features of our experiences. The epistemological reading, however, emphasises that this does not necessarily mean that there is nothing beyond our perceptions. On this interpretation, the proponents of Yogācāra-Vijñānavāda merely argued that what we are aware of and have access to in cognition is nothing more than the very contents of our own minds caused, or at least deeply influenced, by the *ālayavijñāna*’s seeds. (Despite some important differences, interpretations along these lines have been offered, for example, by Wayman 1965; Kochumuttom 1982; Hayes 1988; Harris 1991; Oetke 1992; and King 1998.)[^harris-1991][^hayes-1988][^king-1998][^kochumuttom-1982][^oetke-1992][^wayman-1965] This interpretation might be compared to the “transcendental idealism” of Immanuel Kant, who, despite his idealist view of the *sensible* world, posited a mind-independent reality that, as it exists in itself, is completely inaccessible to us. A variant of this epistemological approach, by contrast, holds that Yogācāras completely bracket the ontological questions behind the appearances we perceive. Proponents of this interpretation appeal to the Yogācāras’ apparent reluctance to deal with metaphysics, engaging only with what can be described in experiential terms. Accordingly, they prefer to construe their views through the lens of (Husserlian) phenomenology (Lusthaus 2002; Garfield 2015a: 186–189 and 2015b)[^garfield-2015a][^garfield-2015b][^lusthaus-2002].
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      The other, traditionally more dominant route is to interpret Yogācāra-Vijñānavāda as ontological idealism, at least on the basis of certain works such as Vasubandhu’s *Viṃśikā* or the *Trisvabhāvanirdeśa* (e.g., Griffiths 1986: 82–84; Kapstein 1988; Garfield 2002: 152–169; Schmithausen 2005a, 2005b; Siderits 2007: 147; Arnold 2008: 15–18, 2021: 103–107; Kellner & Taber 2014; Westerhoff 2018: 176–179)[^arnold-2008][^garfield-2002][^griffiths-1986][^kapstein-1988][^kellner-2014][^kellner-2014-2][^schmithausen-2005a][^siderits-2007][^westerhoff-2018].[^note-32] Ontological idealism differs from epistemological idealism and phenomenology in that it straightforwardly rejects anything beyond our minds and mental states. In other words, the idealist position they advocate also involves immaterialism, that is, the denial of the existence of a material world.[^note-33] But even if we accept that Yogācāra-Vijñānavāda authors questioned the mind-independence of reality, it is still controversial whether labelling their view as ontological *idealism* is helpful or illuminating. As many have noted, we are dealing with a peculiarly *Buddhist* form of idealism. These peculiarities mainly concern the third level of interpretation: the nature of ultimate reality. Although the Yogācāras often emphasise that consciousness really or fundamentally exists, it is not to be understood (in line with the Buddhist *anātman* or no-self doctrine) as either an individual or a universal mental *substance*, as we typically find in the works of Western idealist philosophers. In particular, the Yogācāra concept of mind differs equally from Berkeley’s perceiving souls and Hegel’s absolute spirit (not to mention the theistic connotations of these Western theories, which are generally alien to the Buddhist tradition).[^note-34]
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Moreover, Yogācāra authors rejected the subject-object (*grāhaka-grāhya*) duality of consciousness at the ultimate level of reality. Non-duality can be understood in two ways: first, that there is no object independent of consciousness, construed as a cognising “subject”; second, that neither the objective nor the subjective side of experience is ultimately real (Gold 2006)[^gold-2006]. This latter interpretation is sometimes developed into a full-blown illusionism about consciousness, claiming that, according to the Yogācāras’ final position, the act of consciousness itself, with all its phenomenal features, is only a conceptual construct or cognitive illusion with no foundation in reality (see Garfield 2016; Chaturvedi 2024)[^chaturvedi-2024][^garfield-2016]. From this perspective, the Yogācāra position would bear similarities to the Madhyamaka view of the ultimate emptiness of consciousness. Others, however, have argued that the Yogācāra denial of non-duality (even in the second sense) does not rule out the ultimate existence of an ineffable non-dual form of consciousness (Williams 2009: 95–96)[^williams-2009]. That this non-dual form of consciousness transcends our conceptual and linguistic capacities has also made scholars (such as Gold 2011 [2022])[^gold-2011] reluctant to explicitly classify Yogācāra as “standard” ontological idealism. Although *mental* predicates come closest to what reality is ultimately like, even these fail to do justice to its intrinsic nature.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      ### 3.2 The three natures (*trisvabhāva*) doctrine
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      Some of these subtleties of the Yogācāra position are expressed through a theoretical framework called the doctrine of three natures (*trisvabhāva*) (for a detailed analysis of the theory see Garfield 2002: 128–151; D’Amato 2005; Williams 2009: 88–92; Gold 2015: 148–169; Brennan 2018)[^brennan-2018][^d’amato-2005][^garfield-2002][^gold-2015][^williams-2009]. According to the doctrine, all phenomena have three natures: (1) a “constructed” or “imagined nature” (*parikalpita-svabhāva*); (2) a “dependent nature” (*paratantra-svabhāva*); and (3) a “perfected nature” (*pariniṣpanna-svabhāva*). The imagined nature is the way things appear to us as ordinary, unenlightened beings. More specifically, it refers to our abovementioned misconceptions about the real existence of subjects and objects. As, for instance, the *Saṃdhinirmocana Sūtra* suggests, the imagined nature is related to our use of language, insofar as we ordinarily assume that the structure of the world is correctly represented by our linguistic conventions distinguishing between subjects, objects, properties, their relations, etc. The dependent nature is explained as the fact that our perceptions of imagined phenomena arise depending on various causes and conditions. These causes are often identified with the *ālayavijñāna*, or more precisely the seeds contained therein (e.g., *Trisvabhāvanirdeśa* verse 29). The perfected nature, in turn, refers to the ultimate nature of phenomena, commonly described by the term *tathatā*, i.e., “suchness” or “thusness” (e.g., *Triṃśikā* verses 24–25). In Yogācāra works such as Asaṅga’s *Mahāyānasaṃgraha* or Vasubandhu’s *Triṃśikā* the “perfected nature” is glossed as the absence of the imagined nature from the dependent nature. Accordingly, one grasps the perfected nature as a result of sustained meditative practice by realising that imagined entities (such as subjects and objects) are unreal products or superimpositions of the mind’s conceptualising activity.
    step1: TBD
    step2: TBD
  - id: 52
    kind: body
    source: |-
      It must be noted that while *svabhāva* (intrinsic nature or existence) is a key concept in Abhidharma philosophy, the three-nature analysis is not meant to be an endorsement of the Abhidharma metaphysics of ultimately real *dharma*s. On the contrary, in keeping with the ethos of the Mahāyāna, its purpose is to dispel the misconception that phenomena, as conceived by ordinary people and even by the more refined view of the Ābhidharmikas, have an intrinsic existence. Some Yogācāra sources (e.g., *Triṃśikā* verses 23–24) seek to emphasise this by characterising the three natures as three non-natures or naturelessnesses (*niḥsvabhāvatā*), that is, three ways in which the Abhidharmic sense of *svabhāva* is absent from phenomena. Accordingly, the imagined nature is naturelessness in that phenomena do not have the nature or mind-independent properties they appear to have (such as extension, solidity, colour). The dependent nature is naturelessness in the sense that phenomena are not causally independent, because they depend on something external to themselves, especially the cognising mind. Finally, the perfected nature is the realisation of naturelessness itself, defined as the absence of the imagined from the dependent (Garfield 2002: 109–127)[^garfield-2002].
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      While this description of the perfected nature sounds rather negative, on the standard reading it presupposes the ultimate reality of a basis (i.e. the flow of experiences or the dependent nature), which is empty of false conceptualisation, non-dual, and ineffable.[^note-35] Thus the doctrine of three natures, despite its rebuttal of the *svabhāva* metaphysics of Abhidharma, reveals a fundamental agreement between the Abhidharma and Yogācāra traditions: namely, that there must be something that serves as the ultimate foundation of reality (a view often referred to as ontological foundationalism). For Abhidharma, this foundation is the *dharma*s; for Yogācāra, it is consciousness. As the Yogācāras argue, something has to exist fundamentally to ground our false superimpositions. Such an approach would set the Yogācāra position in stark contrast to Madhyamaka anti-foundationalism. Accordingly, the Yogācāra position in general, and the theory of three natures in particular, are characterised by Yogācāra sources such as the *Saṃdhinirmocana Sūtra* as the ultimately correct doctrine, construed as a middle way between the “nihilistic” interpretation of emptiness attributed to the Madhyamaka and the Abhidharmic reification of phenomena (on the complex relationship between Yogācāra and Madhyamaka, see for instance Harris 1991: especially 102–131; King 1994; and the relevant contributions in Garfield & Westerhoff 2015: especially Thakchöe 2015)[^garfield-2015][^harris-1991][^king-1994][^thakchöe-2015].
