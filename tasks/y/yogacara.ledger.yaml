      ### 3.5 Later idealist arguments: Dignāga and Dharmakīrti
    step1: TBD
    step2: TBD
  - id: 65
    kind: body
    source: |-
      The tradition of Dignāga and Dharmakīrti also contributed to the Yogācāra defence of idealism. In denying that what we perceive are material objects, Dignāga’s *Ālambanaparīkṣā* can be seen as a continuation and elaboration of Vasubandhu’s idealist arguments in the *Viṃśikā*. The starting point of Dignāga’s argument is that in order for something to be considered an object of perception (*ālambana*) it must fulfil two conditions. First, it has to cause the corresponding percept. Second, it needs to exist in the way it appears to us in consciousness, that is, be similar to the percept. Otherwise, we could not distinguish it from other causes of perception that are equally dissimilar to the object, such as the sense organs.[^note-49]
    step1: TBD
    step2: TBD
  - id: 66
    kind: body
    source: |-
      Dignāga argues that neither a multiplicity of atoms nor their agglomerations can satisfy these two conditions, therefore they cannot be what we perceive. As for the causal criterion, his argument turns on the mereological reductionist principle, frequently deployed by Ābhidharmikas, that composite objects, including atomic agglomerations, are ultimately unreal insofar as they can be analysed into more fundamental constituents. On this basis, Dignāga infers that atomic agglomerations cannot actually cause our perceptions, since unreal things cannot cause anything. The alternative view that the objects we cognise are multiplicities of atoms is also problematic, as they are fundamentally dissimilar to how we perceive the world around us. He points out that our perceptions appear in the form of unified objects, such as cups and pots, as opposed to mere multiplicities of atoms. Therefore, even though these atoms could cause our perceptions, they cannot fulfil the resemblance criterion.[^note-50]
    step1: TBD
    step2: TBD
  - id: 67
    kind: body
    source: |-
      On the basis of such arguments, Dignāga concludes that the objects of perception must be mental representations, because only they can satisfy both criteria. It is important to note that in the *Ālambanaparīkṣā* Dignāga puts forward a mental explanation for the origin of our perceptions, proposing that the appearance of perception is actually caused by impressions left in our minds by previous cognitions. Furthermore, Dignāga makes it clear that the sense faculties are not material either. While these remarks might suggest that Dignāga’s ultimate view is ontological idealism, it is noteworthy that he does not explicitly assert it or call into question the coherence of atomism as Vasubandhu does. While atoms are definitely not the objects of our perceptions, they may, as far as the *Ālambanaparīkṣā*’s arguments go, exist outside our minds.
    step1: TBD
    step2: TBD
  - id: 68
    kind: body
    source: |-
      Dharmakīrti, too, offered important considerations in favour of idealism. While he also recycles Dignāga’s arguments about the object of perception discussed above, his perhaps most famous idealist argument is called *sahopalambhaniyama* inference, variously translated as “necessary joint cognition”, “restriction to invariable co-cognition”, or “certainty of [subject and object] being perceived together”.[^note-51] The argument appeals to the notion of self-awareness or reflexive awareness (*svasaṃvedana* or *svasaṃvitti*), which Dharmakīrti borrows from Dignāga. According to them, in any act of cognition, the mind is not only aware of an object but also of itself cognising the object. Relying on this idea, Dharmakīrti’s *sahopalambhaniyama* inference argues that it is impossible to perceive an object, such as a blue patch, without also being aware of the act of cognition itself. With this move, Dharmakīrti aims to undercut the realists’ attempt to use perception to substantiate our belief in the existence of external objects. To prove that there are external objects, they have to show that these objects are distinct from our consciousness. However, as Dharmakīrti argues, this cannot be done by appealing to our perceptions, since the objects of perception are always bound up with consciousness.[^note-52] Accordingly, the argument establishes an epistemological idealist position: the mind only experiences itself and its own states, but cannot cognitively access external objects *as external objects*. Whether Dharmakīrti’s intention with the *sahopalambhaniyama* inference was to make a leap from this epistemological point to an ontological idealist position is uncertain. While some scholars suggest that Dharmakīrti seeks to make this step, others contend that deriving metaphysical conclusions from claims of inconceivability is a fallacious move that Dharmakīrti would have wanted to avoid (on this controversy, see Finnigan 2017: 190)[^finnigan-2017].
    step1: TBD
    step2: TBD
