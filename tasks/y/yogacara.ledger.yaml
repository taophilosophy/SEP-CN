  - id: 5
    kind: body
    source: |-
      The tradition is most commonly referred to as Yogācāra, with its followers called Yogācāras.[^note-2] Various explanations were proposed as to why the school has been given this particular name. One possibility is that it refers to the foundational treatise (*śāstra*) of the tradition, the *Yogācārabhūmi* (“The Stages of Yogācāra”). This naming practice would be analogous to that of, for instance, the Abhidharmic Vaibhāṣika school, which takes its name from the tradition’s seminal work, the *Abhidharmamahāvibhāṣā* (“The Great Exegesis of Abhidharma”). Accordingly, the Yogācāras are those who study and follow the *Yogācārabhūmi*.[^note-3]
    step1: |-
      这一传统最常被称为 Yogācāra（瑜伽行派），其追随者被称为 Yogācāras。[^note-2] 关于该派为何获得这一特定名称，人们提出了各种解释。一种可能是，它指的是该传统的基本论著（*śāstra*）《瑜伽师地论》（*Yogācārabhūmi*，“瑜伽行者的诸地”）。这种命名方式可类比于，例如，阿毗达磨的毗婆沙宗：该派得名于传统的开创性著作《大毗婆沙论》（*Abhidharmamahāvibhāṣā*，“阿毗达磨大疏”）。据此，瑜伽行者就是研习并遵循《瑜伽师地论》的人。[^note-3]
    step2: |-
      这一传统通常称为“瑜伽行派”（Yogācāra），其追随者称为“瑜伽行者”（Yogācāras）。[^note-2] 该派何以得此名称，历来有各种解释。一种可能是：名称取自该传统的基本论著（*śāstra*）《瑜伽师地论》（*Yogācārabhūmi*，意为“瑜伽行者的诸地”）。这种命名方式可类比于阿毗达磨的毗婆沙宗——该派得名于本传统的开创性著作《大毗婆沙论》（*Abhidharmamahāvibhāṣā*，意为“阿毗达磨大疏”）。照此说，瑜伽行者便是研习并遵循《瑜伽师地论》的人。[^note-3]
  - id: 6
    kind: body
    source: |-
      While this might explain the direct origin of the school’s name, it does not shed light on the meaning of the term *yogācāra* itself. The compound *yogācāra* consists of the words *yoga* and *ācāra*. The latter means practice. The meaning of *yoga*, however, is less straightforward. It can be understood more broadly as discipline, but in this context it presumably refers to meditation or some sort of mental cultivation. Indeed, scholars often assume that the term *yogācāra* was originally applied to a community of accomplished meditation practitioners in the Śrāvakayāna (i.e., mainstream Buddhist) tradition (Deleanu 2006: 158)[^deleanu-2006]. Accordingly, the name Yogācāra was arguably meant to indicate that the tradition placed particular emphasis on transforming the mind and gaining insight into the nature of reality through sustained meditative practice.
    step1: |-
      这或许能解释该派名称的直接来源，却未阐明 *yogācāra* 一词本身的含义。复合词 *yogācāra* 由 *yoga* 与 *ācāra* 两词构成。后者意为实践。然而 *yoga* 的含义不那么直接。它可以较宽泛地理解为修持，但在这一语境中，它大概指冥想或某种心智修养。确实，学者们常假定 *yogācāra* 一词最初用于声闻乘（即主流佛教）传统中一群有成就的禅修者（Deleanu 2006: 158）[^deleanu-2006]。据此，瑜伽行派之名大概意在表明：该传统特别强调通过持续的禅修实践转化心识、洞见实在的本性。
    step2: |-
      这或许能解释该派名称的直接来源，却没有说明 *yogācāra* 一词本身的含义。复合词 *yogācāra* 由 *yoga* 与 *ācāra* 构成，后者意为“实践”。*yoga* 的含义则不那么直接：广义上可解为“修持”，但在这一语境中，它大概指冥想或某种心智修养。学者们常认为，*yogācāra* 一词最初用于声闻乘（即主流佛教）传统中一群有成就的禅修者（Deleanu 2006: 158）[^deleanu-2006]。照此理解，瑜伽行派之名意在表明：该传统特别重视通过持续的禅修实践转化心识、洞见实在的本性。
  - id: 7
    kind: body
    source: |-
      The Yogācāra school is also known by various other names, including *vijñānavāda* (“doctrine of consciousness”), *cittamātra* (“mind only”), and *vijñaptimātra* (“cognition only”). The term *vijñānavāda* (“doctrine of consciousness”) highlights that the Yogācāras were keenly interested in studying the nature of consciousness and its transformation on the path to liberation. The names *cittamātra* (“mind only”) and *vijñaptimātra* (“cognition only”) more overtly express the school’s signature doctrine that there is “only” or “nothing but” (*mātra*) “mind” (*citta*) or “cognition” (*vijñapti*). Accordingly, the tradition attributes some kind of (epistemological or ontological) priority to the mind, implying, most importantly, that the sensible world depends for its nature and existence on being cognised by a mind. In Western philosophy, this position is commonly labelled as “idealism”, an umbrella term that encompasses a wide variety of senses in which the mind, with its various mental operations, can have priority over the objects it cognises.
    step1: |-
      瑜伽行派还有其他各种名称，包括 *vijñānavāda*（“识论”）、*cittamātra*（“唯心”）和 *vijñaptimātra*（“唯识”）。*vijñānavāda*（“识论”）一词突出表明，瑜伽行者热衷于研究识的本性及其在解脱道上的转化。“唯心”（*cittamātra*）与“唯识”（*vijñaptimātra*）这两个名称更直白地表达了该派的标志性学说：只有或无非是（*mātra*）“心”（*citta*）或“了别”（*vijñapti*）。据此，该传统赋予心某种（认识论或本体论的）优先性，最重要的是意味着：可感世界的本性与存在依赖于被心所认知。在西方哲学中，这一立场通常被标为“唯心论”（idealism），这是一个统称，涵盖心及其各种心理运作能够优先于其所认知对象的多种含义。
    step2: |-
      瑜伽行派另有若干名称，包括 *vijñānavāda*（“识论”）、*cittamātra*（“唯心”）与 *vijñaptimātra*（“唯识”）。“识论”这一名称突出表明，瑜伽行者热衷于研究识的本性及其在解脱道上的转化；“唯心”与“唯识”则更直白地表达了该派的标志性学说：唯有或无非是（*mātra*）“心”（*citta*）或“了别”（*vijñapti*）。据此，该传统赋予心某种认识论或本体论上的优先性，其要义在于：可感世界的本性与存在，依赖于它被心所认知。在西方哲学中，这一立场通常称为“唯心论”（idealism）——一个统称，涵盖心以其各种心理运作优先于所认知对象的多种含义。
