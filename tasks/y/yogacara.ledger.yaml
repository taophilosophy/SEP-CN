      Building on and systemising these early materials, it is Asaṅga and Vasubandhu who should be credited with the development of Yogācāra as a distinctive philosophical school. The tradition ascribes a significant number of works to each of them, but their authenticity is still subject to scholarly debate. The two most important works attributed by scholars to Asaṅga are the *Abhidharmasamuccaya* (“Compendium of Abhidharma”) and the *Mahāyānasaṃgraha* (“Summary of the Great Vehicle”). The former provides a comprehensive explanation of various categories of *dharma*s (i.e., mental and physical phenomena considered to be the ultimate building blocks of reality in the Abhidharma system) from a Yogācāra and Mahāyāna viewpoint; the latter is an influential treatise on general aspects of Yogācāra theory and practice.
    step1: |-
      在这些早期材料的基础上并加以系统化，应当把瑜伽行派发展为一个独特哲学学派归功于无著与世亲。传统把相当多的著作分别归于二人，但其真实性仍受学界争论。学者归于无著的最重要的两部著作是《大乘阿毗达磨集论》（*Abhidharmasamuccaya*，“阿毗达磨集要”）与《摄大乘论》（*Mahāyānasaṃgraha*，“大乘要义”）。前者从瑜伽行派与大乘的立场，全面解释诸法（*dharma*，即阿毗达磨体系中被视为实在之终极构成要素的心理与物理现象）的各种范畴；后者是一部有影响的论著，讨论瑜伽行派理论与实践的一般方面。
