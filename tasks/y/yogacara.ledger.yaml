  - id: 1
    kind: body
    source: |-
      Alongside Madhyamaka, Yogācāra is one of the two major philosophical traditions of Mahāyāna Buddhism that originated in India. The philosophical and soteriological ideas set forth in the Yogācāra works had a great impact on the development of Buddhist thought not only in the Indian subcontinent but also in other parts of Asia, especially in China, Japan and Tibet. Besides its highly influential exposition of the stages of the Mahāyāna path to liberation, the tradition developed several emblematic philosophical doctrines, such as the mind-only (*cittamātra*) teaching, the theory of three natures (*trisvabhāva*), and the eightfold classification of consciousness, including the introduction of the so-called defiled mind (*kliṣṭamanas*) and the substratum or store consciousness (*ālayavijñāna*). Through the systematic elucidation and justification of these doctrines, the Yogācāra school made a significant contribution to the metaphysical, epistemological, and phenomenological study of consciousness.
    step1: |-
      与中观派并列，瑜伽行派是起源于印度的大乘佛教两大哲学传统之一。瑜伽行派著作所提出的哲学与解脱论观念，不仅对印度次大陆、也对亚洲其他地区（尤其是中国、日本与西藏）佛教思想的发展产生了巨大影响。除了对菩萨道解脱诸阶段极具影响力的阐述之外，这一传统还发展出若干标志性的哲学学说，例如唯心（*cittamātra*）教说、三性（*trisvabhāva*）理论，以及将识分为八类的分类法，其中包括引入所谓的染污意（*kliṣṭamanas*）与基底识或藏识（*ālayavijñāna*）。通过对这些学说的系统阐明与论证，瑜伽行派对意识的形而上学、认识论与现象学研究作出了重要贡献。
    step2: |-
      与中观派并列，瑜伽行派是起源于印度的大乘佛教两大哲学传统之一。瑜伽行派著作所提出的哲学与解脱论观念影响深远，不仅塑造了印度次大陆的佛教思想，也波及亚洲其他地区，尤其是中国、日本和西藏。这一传统对菩萨道解脱诸阶位的阐述极具影响力；除此之外，它还发展出若干标志性的哲学学说，如唯心（*cittamātra*）教说、三性（*trisvabhāva*）理论，以及把识分为八类的分类法——其中引入了所谓的染污意（*kliṣṭamanas*）和基底识或藏识（*ālayavijñāna*）。瑜伽行派系统地阐明并论证了这些学说，对意识的形而上学、认识论与现象学研究贡献卓著。
  - id: 2
    kind: body
    source: |-
      Yogācāra is a spatio-temporally extensive and philosophically diverse tradition. According to the later Tibetan doxographical literature, Yogācāra developed into two main branches in India. One is directly connected with the works of the school’s founders or first systemisers, the (half-)brothers Asaṅga and Vasubandhu (c. 4ᵗʰ–5ᵗʰ century CE), and their followers, most notably Sthiramati and Dharmapāla (both dated to the c. 6ᵗʰ century CE). The other branch is the logico-epistemological or *pramāṇavāda* (“doctrine of valid knowledge”) tradition associated with the works of Dignāga (c. late 5ᵗʰ to early 6ᵗʰ century CE) and Dharmakīrti (c. mid-6ᵗʰ to mid-7ᵗʰ century CE) and their successors.[^note-1] While this distinction was not self-consciously adopted by these figures themselves, it reflects some important differences between their doctrinal and methodological commitments. Asaṅga and Vasubandhu’s tradition aimed at laying down and fortifying the theoretical foundations of Yogācāra by providing a sustained explanation and defence of the school’s key ideas introduced in the Yogācāra *sūtra* literature. By contrast, Dignāga and Dharmakīrti focused more on topics in logic and epistemology that allowed them to engage in meaningful (and formally valid) debates with their non-Buddhist contemporaries. Accordingly, they were less concerned with spelling out the meaning of Yogācāra *sūtra*s or discussing their characteristic concepts such as the *ālayavijñāna*. This entry will focus primarily on the Indian Yogācāra tradition as explicated in the works of Asaṅga and Vasubandhu and their commentators. It will, nonetheless, incorporate those arguments of the logico-epistemological tradition that complement Asaṅga and Vasubandhu’s attempts to develop the unique doctrinal and conceptual framework of Yogācāra.
    step1: |-
      瑜伽行派是一个时空分布广泛、哲学上多元的传统。根据后来的西藏判教文献，瑜伽行派在印度发展出两大支系。一支直接与该派创始人或最早的系统化者——“（半）兄弟”无著与世亲（约公元 4—5 世纪）——及其追随者（最著名的是安慧与护法，二人均定为约公元 6 世纪）的著作相连。另一支是与陈那（约公元 5 世纪末至 6 世纪初）和法称（约公元 6 世纪中至 7 世纪中）及其后继者的著作相关的逻辑—认识论传统，即量论（*pramāṇavāda*，“正量之学”）。[^note-1] 这一区分虽非这些人物自己有意识地采纳，却反映了他们在教义与方法论承诺上的若干重要差异。无著与世亲的传统旨在为瑜伽行派奠定并加固理论基础，为此持续解释和辩护该派在瑜伽行派经论文献中提出的核心观念。相比之下，陈那与法称更关注逻辑与认识论问题，这使他们能够与非佛教的同时代人展开有意义（且形式上有效）的辩论。因此，他们不那么关心阐明瑜伽行派诸经的含义，也不那么关心讨论阿赖耶识之类的标志性概念。本词条将主要聚焦于无著、世亲及其注释者著作中所阐明的印度瑜伽行派传统。不过，它也会纳入逻辑—认识论传统中那些补充无著与世亲建立瑜伽行派独特教义与概念框架之努力的论证。
    step2: |-
      瑜伽行派在时空上分布广泛，哲学上面貌多样。据后来的西藏判教文献，瑜伽行派在印度分为两大支系。一支直接承接该派创始人或最早系统化者——无著与世亲“（半）兄弟”（约公元 4—5 世纪）——及其追随者的著作，其中最著名的是安慧与护法（二人均定于约公元 6 世纪）。另一支是逻辑—认识论传统，即量论（*pramāṇavāda*，“正量之学”），与陈那（约公元 5 世纪末至 6 世纪初）、法称（约公元 6 世纪中至 7 世纪中）及其后继者的著作相关。[^note-1] 这些人物自己并未有意识地作此区分，但这一区分反映了他们在教义与方法论承诺上的若干重要差异。无著与世亲的传统着力奠定并加固瑜伽行派的理论基础，持续解释和辩护该派在经论文献中提出的核心观念；相比之下，陈那与法称更关注逻辑与认识论问题，因而能够与非佛教的同时代人展开有意义且形式有效的辩论。也正因如此，他们较少措意于阐发瑜伽行派诸经的含义，也较少讨论阿赖耶识之类的标志性概念。本词条主要讨论无著、世亲及其注释者著作所阐明的印度瑜伽行派传统，同时也会纳入逻辑—认识论传统中那些与无著、世亲建立瑜伽行派独特教义与概念框架之努力相补充的论证。
