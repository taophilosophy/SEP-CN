      [^note-33]: On the distinction between “immaterialism”—the view that there are no material or external objects—and “idealism”—the view that sensible objects are merely ideas in the mind—in Berkeley scholarship, see Stoneham 2002: 31–38; Rickless 2013: 1; or Bartha 2020: 1074–1075. Ontological (or immaterialist) idealism is also often labelled as “anti-realism” insofar as it denies “reality” in the sense of mind-independent existence. However, the terms realism and anti-realism have other applications as well. One of these is particularly relevant to the interpretation of Yogācāra idealism, as it concerns the question of whether, and, if so, to what extent, the mind’s own *conceptual* activity contributes to the construction of the sensible world. A comparison with a Kantian sort of idealism or anti-realism might suggest that, also for the Yogācāras, the sensible world is the product of our minds, not only in the sense that it exists only when a mind cognises it, but also in the sense that the content of our perceptions is essentially determined by the (innate) conceptual structure of our minds. On certain readings (Siderits 2016: 63, 95–96)[^siderits-2016], however, Yogācāras want to maintain the “realist” view that there is a non-conceptual content given to us through conscious experience, which—even if mentally cognised and caused—can be regarded as a “reality” immune to the conceptual activity of our minds.
