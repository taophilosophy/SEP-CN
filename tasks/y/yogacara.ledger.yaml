      The six forms of consciousness associated with the five sense organs and the *manas* are often called “manifesting”, “arising” or “occurrent” consciousnesses (*pravṛttivijñāna*). On the one hand, the term indicates the contrast between the six (ordinary) forms of *vijñāna*, which become manifest in our cognitive acts and operate in a supraliminal way, and the *kliṣṭamanas* and the *ālayavijñāna*, which operate in an unmanifest, subliminal way. On the other hand, it also shows that while the *ālayavijñāna* functions uninterruptedly throughout one’s existence, the *pravṛttivijñāna*s arise discontinuously (for instance, they do not operate in deep sleep or deep meditation or when their appropriate objects are not present). From this perspective, it is not surprising that certain works (such as the *Madhyāntavibhāgaṭīkā* or the *Trisvabhāvanirdeśa*) speak of not six but seven *pravṛttivijñāna*s, including the *kliṣṭamanas* as well as the six ordinary forms of consciousness (Delhey 2016: 18–20)[^delhey-2016]. This classification underlines that these seven forms of *vijñāna* have the *ālayavijñāna*, or more precisely the karmic seeds (*bīja*) contained in the *ālayavijñāna*, as their source, and that they arise only when their seeds are ready to ripen. The six forms of consciousness are also sometimes referred to as the “perception of objects” (e.g., *Triṃśikā* verse 2) since each of them emerges in conjunction with its respective object (visible form, sound, etc.) or, in a more idealist-friendly terminology, has the appearance of a well-defined object.
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      It might be helpful to add at this point that the concept of *vijñāna* is generally defined in Buddhist philosophical sources as a cognition of an object. Accordingly, many Yogācāra texts claim that the *kliṣṭamanas* and the *ālayavijñāna*, in addition to the six sensory consciousnesses, are also object-directed or intentional mental states. Otherwise, they could not be regarded as genuine forms of cognition. In line with their subliminal functioning, their objects (as opposed to the objects of ordinary perceptions) are vague or difficult to determine. The *kliṣṭamanas* is directed at the *ālayavijñāna* as its object, while the objects of the *ālayavijñāna* are often held to be the surrounding world (*bhājana*/*bhājanaloka*) and one’s own body (*āśraya* i.e., “basis”).[^note-13]
    step1: TBD
    step2: TBD
  - id: 28
    kind: body
    source: |-
      ### 2.1 The defiled mind
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      The defiled mind, one of the new forms of *vijñāna* introduced by the Yogācāra tradition, is responsible for our mistaken belief in the self and our sense of personal identity. In some Yogācāra texts, this layer of the mind is simply referred to as *manas*, but insofar as it is always characterised by the presence of four kinds of defilement (*ātmadṛṣṭi*, i.e., false view of the self; *ātmamoha*, i.e., delusion about the self; *ātmamāna*, i.e., self-conceit; and *ātmasneha*, i.e., self-love), it is often described as “defiled” or “afflicted” (*kliṣṭa*).[^note-14] The origin of the concept is difficult to determine. According to one hypothesis, it goes back to early textual passages (e.g., in the *Viniścayasaṃgrahaṇī* section of the *Yogācārabhūmi*) that conceive of the subliminally operating *ālayavijñāna* as the object of our subtle and innate self-related thoughts. This subliminal process, arguably, called for the introduction of a separate form of consciousness, the *kliṣṭamanas*, which clings to the *ālayavijñāna* and, in a similarly subliminal way, conceptualises it as an ultimately real self (Schmithausen 1987: 151–153)[^schmithausen-1987].[^note-15] The reification of our notion of “I” into a distinct stratum of consciousness (instead of associating it with other forms of consciousness, including the *ālayavijñāna* itself) was probably further inspired by the notion of *ahaṃkāra* (egoism or literally “I-making”) found in the classical Indian Sāṃkhya philosophical tradition (Schmithausen 1987: 29, 151)[^schmithausen-1987].
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Another incentive for introducing the concept might have been the peculiar nature of the traditional *manas* (i.e., the sixth sense faculty). In the Vaibhāṣika Abhidharma tradition, an important difference between the five sense consciousnesses and the mental consciousness is that each of the former has a simultaneously present sense faculty as its “support” or “basis” (*āśraya*).[^note-16] Visual consciousness, for instance, comes into existence from a simultaneously present eye faculty (and, of course, a visual object). Such a simultaneous basis, however, is missing in the case of the *manovijñāna*. The term *manas* was commonly held to be a mere shorthand for the earlier moment of consciousness that instigated or conditioned the present one. Mental consciousness was, therefore, considered to be a (special) form of consciousness that has only a “past basis”, the *manas*, but not a simultaneously present one.[^note-17] While some Yogācāras were apparently unfazed by the lack of a simultaneous basis for the *manovijñāna*, certain authors and texts (e.g., the *Mahāyānasaṃgraha* or the *Pravṛtti Portion* of the *Yogācārabhūmi*) regarded the *kliṣṭamanas* as the simultaneous, faculty-like basis of mental consciousness (Waldron 2003: 122–123; Kramer 2016b: 160–161)[^kramer-2016b][^waldron-2003].[^note-18]
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      The afflictive functioning of the defiled mind not only instigates a mistaken sense of “I”, but also fundamentally determines the way we conceive and even perceive the world. As the simultaneous support of our conceptualising mental activities, the egoistic tendencies of the *kliṣṭamanas* permeate the manifesting consciousnesses (*pravṛttivijñāna*), as a result of which we habitually misconceive our experiences in terms of selves interacting with independent objects. Since the defiled mind is the proximate cause of our mistaken attitudes towards the self (and separate objects it might appropriate), it is often depicted as the fundamental cause of our entanglement in the cycle of existence (*saṃsāra*). Certain texts, such as Vasubandhu’s *Triṃśikā*, emphasise that the *kliṣṭamanas* operates continuously, ceasing only in exceptional states such as (1) liberation, (2) the supramundane path (*lokottaramārga*), which refers to more advanced practitioners, and (3) a very deep meditative state called “absorption into cessation” (*nirodhasamāpatti*), where all mental activities cease except for the *ālayavijñāna*.
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      ### 2.2 The store or substratum consciousness and its functions
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      The term *ālayavijñāna* is commonly translated as store or substratum consciousness.[^note-19] One of its roles, which warrants the translation “store” (or sometimes “storehouse”) consciousness, is related to the Buddhist notion of karma, i.e., that one’s ethically relevant intentional actions produce results in the future that correspond to the moral nature of the actions. Scholars generally maintain that the concept of *ālayavijñāna* largely developed from Yogācāra attempts to solve common Buddhist and Abhidharmic problems posed by the doctrine of no-self (*anātman*) and the impermanent or momentary existence of all conditioned phenomena (*dharma*). If a person does not have an enduring self underlying their experiences, but is merely a bundle of psychophysical elements that come and go in every single moment, then how can we explain, for instance, personal identity or karmic efficacy and responsibility? Relying on the theory of *ālayavijñāna*, the Yogācāra answer holds that actions produce karmic seeds (*bīja*) or impressions (*vāsanā*), i.e., potentialities or dispositions for future experiences and perceptions, which are retained, as in a sort of “container” or “store”, in the *ālayavijñāna* until they are ready to produce their effects.[^note-20] These perceptions, as we have seen, appear in the bifurcation of subjects and objects due to the influence of the defiled mind. According to the Yogācāras, the continuous operation of the *ālayavijñāna* grounds karmic continuity and efficacy over both one and multiple lifetimes and ensures that karmic results belong to the same personal “continuum” that committed the action.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      While it cannot be ruled out that the *ālayavijñāna* was originally introduced to cover multiple functions, certain scholars argue that its inception can be traced back more specifically to problems raised by deep meditative practice. Schmithausen (1987: 18) suggests that the passage representing the starting point for the *ālayavijñāna* theory is found in the *Samāhitā* *Bhūmi* section of the *Yogācārabhūmi*, which discusses the *ālayavijñāna* in relation to the meditative state of “absorption into cessation” (*nirodhasamāpatti*).[^note-21] The temporary cessation of all conscious mental activity in *nirodhasamāpatti* posed two interrelated challenges to the proponents of mainstream Buddhist schools. First, insofar as consciousness is regarded in the Buddhist tradition as (one of) the bearer(s) of life, how can the meditator survive the absence of any conscious activity? Secondly, where do ordinary forms of consciousness re-emerge from after *nirodhasamāpatti* if there is no immediately preceding moment of consciousness causing them? According to the *Samāhitā* *Bhūmi*, the subliminal *ālayavijñāna*, which abides or hides in the sense faculties during meditation, functions even when all other conscious states cease to operate.[^note-22] Due to the continuous operation of the *ālayavijñāna*, the meditator can survive the meditative state, and the manifesting consciousnesses (*pravṛttivijñāna*s) can be reactivated from the seeds contained in it.[^note-23] In a related biological role, the *ālayavijñāna* was also seen as the form of consciousness that takes possession of a new life at the time of conception, merging with (proto-)embryonic matter in the womb. Moreover, its uninterrupted presence keeps the body alive throughout one’s existence, only withdrawing from it (with the body becoming cold) at the time of death. Accordingly, the *ālayavijñāna* is the part of the being that undergoes rebirth and forms a link between this life and the next.[^note-24]
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      As we have seen, in some Yogācāra texts (especially in the *Yogācārabhūmi*) the *ālayavijñāna* is placed in a realist framework insofar as it supports and operates together with the physical body. The concept, however, gains even more importance in an idealist context by explaining how the causes of our perceptions can be understood in purely mental terms. It is no longer necessary to posit external objects as the causes of perceptions, since our cognitions of objects can arise directly from the seeds ripened in the *ālayavijñāna*. The ripening of these seeds accounts for the appearance of the sensible world not only as a private but also as an intersubjective experience. While critics of the Yogācāra tradition doubted that a purely mental reality can accommodate intersubjectivity, that is, our conviction that multiple individuals at the same place and time can agree on the content of their experiences, certain Yogācāra works emphasise that our similar experiences are produced by seeds common to all relevant *ālayavijñāna*s. These common seeds, in turn, are the result of previous shared actions and experiences stretching back through beginningless time. Thus the world we experience in an intersubjective manner is determined by a complex causal process involving many minds interacting in a variety of ways.[^note-25]
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      Since the *ālayavijñāna* performs some of the traditional roles attributed to the self (*ātman*) in the Indian tradition (e.g., ensures personal identity, karmic responsibility, undergoes rebirth), it is not surprising that the Yogācāras were often accused of resuscitating the idea of an unchanging, permanent self rejected by all Buddhist traditions. Even though the *ālayavijñāna* is mistakenly conceived by the defiled mind as a substantial self, the Yogācāras insisted that it is in fact nothing like the non-Buddhist concept of the *ātman*. Rather, in works such as the *Saṃdhinirmocana Sūtra*, the *ālayavijñāna* is often likened to a river. Just as a river flows in an unbroken stream while its body of water is constantly changing, so too the *ālayavijñāna* is understood as an uninterrupted series of transitory karmic seeds, traces or tendencies.[^note-26] Moreover, several Yogācāra works stress that the *ālayavijñāna* ceases upon the attainment of liberation, entailing that it is by no means an eternal substance, as the non-Buddhist *ātman* is standardly thought to be.[^note-27]
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      Some of the theoretical benefits of the *ālayavijñāna* discussed above overlap with the proofs given by Yogācāra authors for the existence of such a layer of consciousness. Perhaps the best known is the list of eight proofs found in the so-called *Proof Portion* of the *Yogācārabhūmi*.[^note-28] Some of these concern the *ālayavijñāna*’s relation to the physical body. For instance, they point out that without the existence of the *ālayavijñāna* we could not explain how rebirth and death occur. It is only this form of consciousness that can take possession of a new existence and physical body at the beginning of life, and consequently it must be the same entity that gradually abandons the body at the time of death. As seen above, we would also be unable to explain how the body is kept alive throughout one’s life, especially in apparently unconscious states such as *nirodhasamāpatti* (or deep sleep and fainting, as added by Vasubandhu’s *Pañcaskandhaka*), or how there can be bodily sensations in meditation (e.g., the feeling of ease, see Yamabe 2018)[^yamabe-2018] when ordinary tactile perception is not functioning.[^note-29]
    step1: TBD
    step2: TBD
  - id: 38
    kind: body
    source: |-
      Another proof, which is unrelated to the aforementioned bodily aspects, shows that there has to be an *ālayavijñāna* that conditions the emergence of our various ordinary forms of consciousness, since these cannot be one another’s “seeds” or conditioning factors. The justification relies on the observation that successive *pravṛttivijñāna*s sometimes have dissimilar or even incompatible qualities, for example, when a virtuous or wholesome moment of thought immediately follows a non-virtuous or unwholesome one. *Pravṛttivijñāna*s with such dissimilar qualities, however, cannot condition each other’s emergence, so there must be a morally neutral (*avyākṛta*) entity, namely the *ālayavijñāna*, which holds the seeds of virtuous, non-virtuous, and neutral *pravṛttivijñāna*s alike, and enables them to be actualised under the right circumstances (Griffiths 1986: 101; Schmithausen 1987: 132–133)[^griffiths-1986][^schmithausen-1987].
    step1: TBD
    step2: TBD
  - id: 39
    kind: body
    source: |-
      The remaining proofs concern the simultaneous presence of multiple consciousnesses. In order to adequately account for the apparently simultaneous presence of multiple sense cognitions and, relatedly, for the phenomenal synchronic unity of our consciousness (i.e., that our experiences of particular qualities and things at a given time are not disparate, but appear to us as if they were aspects of a unified conscious state), we must posit the existence of the *ālayavijñāna*, which allows for the seeds of multiple *pravṛttivijñāna*s to ripen simultaneously (Chadha 2015; Schmithausen 1987: 45–46)[^chadha-2015][^schmithausen-1987]. This view is in stark contrast to the Abhidharmic unisensory model of consciousness, according to which we cannot see or hear at the same time, but these cognitions merely follow each other in rapid succession.
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      The Yogācāra thesis of the simultaneity of multiple consciousnesses has (at least) three important aspects. First, it allows for a multisensory view of perception, according to which several *pravṛttivijñāna*s, such as visual or auditory consciousnesses, can arise simultaneously, for instance, I can see the red colour of the kettle and hear its whistling sound at the same time. Moreover, the fact that a particular object or quality can be perceived simultaneously by both the sensory consciousnesses and the mental consciousness (*manovijñāna*) explains why our mental cognitions of that thing (e.g., our immediate thoughts and judgements about it, or our conative attitudes towards it) are so clear or vivid. If, in keeping with the Abhidharmic unisensory model, the mental cognition of an object arises later than, say, the visual cognition of that object, then the mental cognition would be directed at a past object. But such cognition of a past object is basically an act of remembering. Memories, however, are typically less clear or vivid than the conative or cognitive contents of the *manovijñāna* we normally experience in sense perception (Griffiths 1986: 100–101; Chadha 2015: 752)[^chadha-2015][^griffiths-1986].[^note-30] Secondly, the Yogācāra simultaneity thesis encompasses the functioning of three layers of consciousness:
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      1. the intermittent *pravṛttivijñāna*s (both sensory and mental) directed at various objects,
      2. the *kliṣṭamanas*, which permeates these with a mistaken cognition of the “I”, and
      3. the continuously operating *ālayavijñāna*, with its twofold operation of subliminally perceiving the surrounding world and one’s own body.
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      According to the Yogācāras, this (fourfold) complexity of our mental processes in each ordinary moment of life cannot be explained in terms of a “one-dimensional” Abhidharma model. Thirdly, the ability of the *ālayavijñāna* to condition the simultaneous emergence of other forms of consciousness is essential from a soteriological perspective as well. While this point is not mentioned among the eight proofs enumerated in the *Yogācārabhūmi*, other texts such as Vasubandhu’s *Pañcaskandhaka* or Sthiramati’s *Pañcaskandhakavibhāṣā* emphasise that without a multi-layered mind the mental defilements (*kleśa*) that hinder liberation could not be eliminated. This is because a defilement and its counteragent cannot be active in the same instance of consciousness. Therefore, as the argument goes, we need to posit a multi-layered mind where the counteracting mental states are able to act directly on the defilements that are in a dispositional “seed” state in the *ālayavijñāna*.[^note-31]
