      ### 3.6 Solipsism and other minds
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      As a consequence of their idealist tendencies, the Yogācāras had to face the charge that their view leads to solipsism. In this context, solipsism primarily refers to the ontological position that only one’s own mind exists but there are no other minds. However, it can also be given an epistemological reading, according to which we can only know the existence of our own minds (for a general introduction to the problem of other minds and solipsism, see the entry on other minds). Although the epistemological problem of other minds poses a challenge to anyone who believes in some privileged access to our own minds, the spectre of solipsism is often raised as a specific objection to idealism, especially ontological idealism. It might be argued, for instance, that the argument from ignorance Vasubandhu uses against the existence of a mind-independent world might just as well work against the existence of other minds. Indeed, in the light of the Yogācāras’ rejection of the (subject-object) duality of consciousness, solipsism seems particularly problematic for the Yogācāra type of idealism (Westerhoff 2018: 164)[^westerhoff-2018]. This rejection, as we have seen, concerns the false reification of the apparently dual structure of an act of consciousness, that is, the mistaken belief that there are separate perceiving subjects and perceived objects. Non-duality seems to apply to anything that is an “object” external to a “subject”, including other minds as well as material objects. Moreover, the Yogācāras’ apparent reliance on the principle of lightness in motivating idealism raises another unique problem. Since solipsism, which presupposes nothing but one’s own mind, is the lightest of all possible theories, why not prefer it to a form of idealism that accepts the plurality of minds (Perrett 2017: 64)[^perrett-2017]? It might be worth noting that the epistemological idealist reading of Yogācāra starts from a much better position here.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Solipsism would be an unwelcome conclusion for Yogācāra—no less than for any other Buddhist tradition. Perhaps the most obvious problem is that solipsism is incompatible with the Mahāyāna soteriological goal of liberating all sentient beings. Accordingly, Vasubandhu and other early Yogācāras never explicitly embraced solipsism. In fact, they made statements to the contrary. In the *Twenty Verses* (verse 21 and commentary), for instance, Vasubandhu claims that the buddhas (non-dually) cognise other minds. He believes not only that there are other minds, but also that they can act on each other directly, e.g., harm or kill one another without having bodies to mediate these actions.[^note-53] But even if Yogācāra can consistently include other minds in its ontology, and justify why this assumption is not incompatible with its idealist arguments against the existence of mind-independent objects (such as the argument from ignorance or the principle of lightness), the epistemological concern of how we can know that there are other minds still needs to be addressed.
    step1: TBD
    step2: TBD
  - id: 72
    kind: body
    source: |-
      The standard realist arguments for the existence of other minds rely on observable physical actions (bodily and verbal). These actions are appealed to as the basis for an analogical argument. Since I perceive that my physical actions depend on my mental volitions, I reason analogically that physical actions not caused by me are willed by some other minds. One might also resort to an inference to the best explanation to argue for the existence of other minds: the supposition of other minds amounts to the best explanation of the physical actions that are perceived but not caused by me. But by denying material bodies, or our perceptual access to them, an idealist loses the only observable sign that could indicate the presence of another mind.
    step1: TBD
    step2: TBD
  - id: 73
    kind: body
    source: |-
      Dharmakīrti addresses this very objection in his “Proof of Other Mental Continua” (*Saṃtānāntarasiddhi*). Dharmakīrti’s overarching aim is to show that idealists can use the same strategy as realists to argue for the existence of other minds. Since neither the realist nor the idealist has direct experience of other minds, they both have to appeal to inference. The inference, as we saw above, starts from the observation that my intentional actions are preceded and caused by my volitions. However, I perceive that there are other actions that appear to be similarly intentional, but are not preceded or caused by my volition. Assuming that their cause is similar to that of my intentional actions, we can conclude that there are other volitions, and therefore other minds, causing these behaviours. This looks like a classic analogical argument (Ganeri 2012: 202; Perrett 2017: 65)[^ganeri-2012][^perrett-2017]. The main point Dharmakīrti makes is that what we actually use for this inference is not the physical actions themselves, but merely the *experiences* or *appearances* of them. Therefore, the same strategy is available to the idealist as it is to the realist.
    step1: TBD
    step2: TBD
  - id: 74
    kind: body
    source: |-
      As for the certainty of this sort of inference, Dharmakīrti acknowledges that his analogical argument does not, *strictly speaking*, prove the existence of other minds. It is only an inductive argument that renders the conclusion *probable* that some of our experiences are caused by the volitions of other minds. This probability is sufficient for our everyday purposes, allowing us to interact with others successfully. It might also help to address our earlier concerns about how Yogācāras can include other minds in their ontology in a way that is consistent with their denial of material objects. While Yogācāras argue that the existence of other minds can be shown to be probable, the assumption of external objects as the basis of our perceptions is incoherent. Another limitation of Dharmakīrti’s argument is that no inference can reveal the intrinsic essence or nature of other minds. This could only be achieved through direct perceptual acquaintance. According to his epistemology, inferences concern only universals or types, not specific individuals or tokens (Inami 2001: 467)[^inami-2001]. So, while we can validly conclude that there are *some* other minds because there is a regular correspondence between observed actions and volitions, we cannot know the specific characteristics of those minds. In any event, none of these limitations affect Dharmakīrti’s main argument that the realist is in no better position than the idealist to prove the existence of other minds.
    step1: TBD
    step2: TBD
  - id: 75
    kind: body
    source: |-
      In the light of these caveats, it is not surprising that Ratnakīrti revisited the problem of other minds in the eleventh century. In fact, in his *Santānāntaradūṣaṇa*, he bites the bullet, and accepts that we cannot prove that there are other minds. He also seems to embrace ontological solipsism when arguing that other minds do not exist at the ultimate level of reality. Ratnakīrti straightforwardly rejects the validity of Dharmakīrti’s argument. Ratnakīrti contends that a proper inference only works if we have established that there is an invariable correspondence (co-presence or co-absence) between an observed sign, in this case an observed action, and its cause, the preceding volition. However, we perceive this connection only in relation to our own minds and actions, in a singular case. Since this correspondence between observed action and preceding volition cannot be verified with respect to others, we have no justification for establishing the existence of other minds. The invalidity of Dharmakīrti’s inference, according to Ratnakīrti, comes down to the fact that the volitions and mental states of others are imperceptible to us. If mental states are *in principle* imperceptible, then we cannot establish either the co-presence or the co-absence of mental states and observable actions. As for co-presence, even if the mental state is present, we can only perceive the action, not the mental state itself. As for establishing co-absence, even when we do not perceive an observable action, the mental state might still be there due to its imperceptibility. Ratnakīrti also considers the possibility that others’ mental states are theoretically perceptible, but we never actually perceive them. In this case, however, the very fact that we do not perceive them indicates that they do not exist (Chakrabarti 2011: 26–27; Kachru 2019: 71–72)[^chakrabarti-2011][^kachru-2019].
    step1: TBD
    step2: TBD
  - id: 76
    kind: body
    source: |-
      A related argument proposed by Ratnakīrti is that we cannot distinguish instances of consciousness belonging to another mind from those belonging to my own mind, because I only experience instances of my own consciousness. According to Ratnakīrti, our ability to distinguish between two things depends on our cognitive access to both things, but insofar as we only perceive our own minds, it is impossible to distinguish between mental streams, that is, to individuate other minds from our own (Chakrabarti 2011: 27; Perrett 2017: 66)[^chakrabarti-2011][^perrett-2017]. Here Ratnakīrti raises not merely the epistemological concern of how we can know that there are other minds, but also the problem of how we can form a coherent concept of other minds in the first place. Besides the inconceivability of other minds, an important implication of this argument, as some scholars have pointed out, is that even our own consciousness cannot be individuated after all (Ganeri 2007: 205–208 and 2012: 212–213; Westerhoff 2018: 165–166; Kachru 2019: 72–76)[^ganeri-2007][^ganeri-2012][^kachru-2019][^westerhoff-2018]. This interpretation also makes it clear that Ratnakīrti’s argument should not be interpreted as intending ontological solipsism in the sense that it is only my own mind that exists (Inami 2001: 479, n. 32)[^inami-2001]. In any event, despite his apparent solipsism, Ratnakīrti nevertheless accepted the distinct existence of (other) minds at the conventional level, thus maintaining the meaningfulness of the bodhisattva path and the cultivation of compassion towards others.
