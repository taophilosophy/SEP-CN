      The works of Asaṅga, Maitreya and Vasubandhu are accompanied and elaborated upon by a rich commentarial tradition. One of the most prolific commentators of the Yogācāra tradition is Sthiramati, who not only provided extensive explanations of the treatises of the school’s founders, but also made important original contributions to the development of Yogācāra thought. The Yogācāra commentaries and compilations attributed to Sthiramati by their colophons are the *Pañcaskandhakavibhāṣā*, the *Triṃśikāvijñaptibhāṣya*, the *Abhidharmasamuccayavyākhyā*, the *Madhyāntavibhāgaṭīkā* and the **Sūtrālaṃkāravṛttibhāṣya*.[^note-7] As for the Chinese reception of the Yogācāra doctrines, it is important to mention Dharmapāla, whose lineage was brought to China by the well-known Chinese monk and pilgrim Xuanzang after his studies in India. In his *Cheng weishi lun*—a summary of ten commentaries on Vasubandhu’s *Triṃśikā*—Xuanzang took Dharmapāla’s commentary on the *Triṃśikā* as the correct interpretation of Vasubandhu’s text. A similarly important figure in the Chinese context is Paramārtha (c. 6ᵗʰ century CE), a translator (into Chinese) and exegete of several Yogācāra works. Paramārtha’s name is closely associated with the doctrine of taintless consciousness (**amalavijñāna*), according to which, upon liberation and the cessation of ordinary forms of consciousness, a pure ninth form of consciousness arises. The doctrine is often seen as an attempt to synthesise Yogācāra and *tathāgatagarbha* thought.[^note-8]
