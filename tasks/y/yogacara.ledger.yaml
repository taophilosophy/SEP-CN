      The authors and works discussed so far belong to the branch of Yogācāra that draws more directly on the teachings and methods of Asaṅga and Vasubandhu. The other branch, often regarded as a later stage in the development of Yogācāra, is the logico-epistemological (*pramāṇavāda*) tradition, associated with the works of Dignāga and Dharmakīrti. Their doctrinal standpoint cannot be easily classified as Yogācāra since they put forward arguments in favour of both Yogācāra and Sautrāntika positions (hence, they are sometimes called Yogācāra-Sautrāntikas). The Yogācāra stance, moreover, is less prevalent or conspicuous in their works, insofar as they either formulate their epistemological and metaphysical views in a way that is compatible with both realists and idealists, or even (at least provisionally) assume the mind-independent existence of the objects of perception (Siderits 2007: 208–209; Carpenter 2014: 170; Kellner 2017: 311–312)[^carpenter-2014][^kellner-2017][^siderits-2007]. This does not necessarily mean, however, that Dignāga and Dharmakīrti eschewed in their final positions the sort of idealism often espoused by other Yogācāra texts (see the entry on Dharmakīrti). According to scholars, such as Dunne (2004: 53–79), Dharmakīrti, for instance, expresses his philosophical views at various levels of accuracy—an approach termed “sliding scales of analysis”—the highest of which is represented by Yogācāra idealism.
