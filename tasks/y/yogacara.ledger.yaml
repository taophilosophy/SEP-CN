      As for Vasubandhu’s corpus, the numerous works traditionally attributed to him display an even greater doctrinal diversity. His, arguably, most famous work, the *Abhidharmakośa* (“Treasury of Abhidharma”) with its *bhāṣya* (“commentary”), for instance, is not a Yogācāra treatise, but an Abhidharma manual discussing a variety of issues and debates in Abhidharma thought.[^note-5] Turning to Vasubandhu’s Yogācāra works, one of his most widely studied treatises in Western scholarship is the *Viṃśikā* (“Twenty Verses”), which is an argumentative philosophical text defending the mind-only doctrine against various realist objections. It is accompanied by a commentary (*vṛtti*) also traditionally attributed to Vasubandhu. Vasubandhu’s other important Yogācāra treatise, the *Triṃśikā* (“Thirty Verses”), contains fewer arguments. Its primary purpose is to provide a synopsis of the school’s foundational doctrines and their soteriological significance. Despite its Yogācāra content, the work has a palpable Abhidharmic character in its way of exposition. A similar observation can be made of Vasubandhu’s *Karmasiddhiprakaraṇa* (“A Discussion of the Demonstration of Action”), which focuses on topics such as action and karmic continuity, as well as of the *Pañcaskandhaka* (“Explanation of the Five Aggregates”), which presents a concise analysis of the five *skandha*s, i.e., the aggregates constituting sentient beings. While these two works contain some of the characteristic doctrines of Yogācāra, such as the notion of the store or substratum consciousness or the defiled mind, they are reminiscent of the *Abhidharmakośa*(*bhāṣya*) in terms of their scholastic character and the philosophical positions discussed. Another significant text worthy of mention is the *Trisvabhāvanirdeśa* (“Teaching on the Three Natures”). Although the authorship of the work is a matter of contention (see in particular Kapstein 2018)[^kapstein-2018], it is an invaluable source for studying the development of the Yogācāra theory of three natures.[^note-6]
