      Dharmakīrti, Dignāga’s successor, is regarded as the author of seven treatises, many of which are inspired by Dignāga’s ideas. His most famous works are the *Pramāṇavārttika* (“Commentary on the Means of Valid Cognition”) and the *Pramāṇaviniścaya* (“Ascertainment of the Means of Valid Cognition”). The former is a vast but unfinished text commenting and expanding on Dignāga’s *Pramāṇasamuccaya*. The latter deals with analogous topics in logic and epistemology to those discussed in the *Pramāṇavārttika*, but in a more concise and organised way. Both works present arguments in favour of Yogācāra idealism. With regard to Dharmakīrti’s contributions to other cardinal Yogācāra issues, it is important to mention his treatise against solipsism, the *Saṃtānāntarasiddhi* (“Proof of Other Mental Continua”).[^note-9]
