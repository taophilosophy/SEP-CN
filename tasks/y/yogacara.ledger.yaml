  - id: 9
    kind: body
    source: |-
      One of the earliest and, arguably, most influential collections of Mahāyāna scriptures, the *Prajñāpāramitā* (“Perfection of Wisdom”) literature—and its characteristic conception of the emptiness (*śūnyatā*) or insubstantiality (*nairātmya*) of all phenomena (*dharma*)—gained great importance in both the Madhyamaka and Yogācāra traditions. Certain *sūtra*s, however, rose to prominence in the Yogācāra school specifically, such as the *Saṃdhinirmocana Sūtra* (“Discourse Unravelling the Intent [of the Buddha]”) or the *Laṅkāvatāra Sūtra* (“Discourse on the Descent into Laṅka”). These *sūtra*s, together with the *Yogācārabhūmi* treatise mentioned earlier, are the foundational sources for studying the origins and early development of key Yogācāra doctrines.
    step1: |-
      最早且大概最有影响的大乘经典集成之一，即《般若波罗蜜多经》（*Prajñāpāramitā*，“般若的圆满”）文献——连同其关于一切法（*dharma*）皆空（*śūnyatā*）或无我（*nairātmya*）的独特构想——在中观派与瑜伽行派两个传统中都获得了极大重要性。然而有些经特别在瑜伽行派中崭露头角，例如《解深密经》（*Saṃdhinirmocana Sūtra*，“解开[佛陀]密意之经”）或《楞伽经》（*Laṅkāvatāra Sūtra*，“入楞伽之经”）。这些经连同前面提到的《瑜伽师地论》，是研究瑜伽行派核心教说的起源与早期发展的基础文献。
    step2: |-
      最早且大概最有影响的大乘经典集成之一，是《般若波罗蜜多经》（*Prajñāpāramitā*，即“般若的圆满”）文献；它关于一切法（*dharma*）皆空（*śūnyatā*）、皆无我（*nairātmya*）的独特构想，在中观派与瑜伽行派中都占有重要地位。不过，有些经特别在瑜伽行派中脱颖而出，如《解深密经》（*Saṃdhinirmocana Sūtra*，意为“解开[佛陀]密意之经”）和《楞伽经》（*Laṅkāvatāra Sūtra*，意为“入楞伽之经”）。这些经连同前文提到的《瑜伽师地论》，是研究瑜伽行派核心教说之起源与早期发展的基础文献。
  - id: 10
    kind: body
    source: |-
      Dating these texts is notoriously difficult. The *Saṃdhinirmocana Sūtra* is the earliest characteristically Yogācāra *sūtra*, which in its present form could not have existed earlier than the end of the third century CE (Powers 1993: 5)[^powers-1993]. With its elucidation of key Yogācāra doctrines (especially in chapters 5 to 7), the text served as one of the main sources for the philosophical elaborations of Asaṅga and Vasubandhu. The *Saṃdhinirmocana Sūtra* is particularly known for its self-description as the “third turning of the wheel of the doctrine”, by which it means that the Yogācāra tenets represent the culmination and definitive interpretation of the Buddha’s teachings, in contrast to the earlier “inadequate” expositions offered by the Abhidharma and Madhyamaka schools. While, within a tradition, the composition of *śāstra*s tends to follow that of the *sūtra*s, scholars assume that parts of the *Saṃdhinirmocana Sūtra* postdate certain sections of the voluminous *Yogācārabhūmi*(*śāstra*) (Schmithausen 1987: 12–13; Williams 2009: 85)[^schmithausen-1987][^williams-2009].
    step1: |-
      为这些文本断代是出了名的困难。《解深密经》是最早具有瑜伽行派特征的经，其现存形态不可能早于公元 3 世纪末（Powers 1993: 5）[^powers-1993]。该文本阐明了瑜伽行派的关键教说（尤其是在第五至第七章），成为无著与世亲哲学阐发的主要来源之一。《解深密经》尤其以其自我描述为“法轮第三转”而著称，意思是：瑜伽行派的教义代表了佛陀教法的顶点与决定性解释，与阿毗达磨和中观派较早提供的“不充分”阐述相对。在一个传统内部，论（*śāstra*）的撰作往往继经（*sūtra*）之后，但学者们假定《解深密经》的某些部分晚于卷帙浩繁的《瑜伽师地论》（*śāstra*）的某些章节（Schmithausen 1987: 12–13; Williams 2009: 85）[^schmithausen-1987][^williams-2009]。
    step2: |-
      为这些文本断代是出了名的困难。《解深密经》是最早具有瑜伽行派特征的经，其现存形态不可能早于公元 3 世纪末（Powers 1993: 5）[^powers-1993]。该经阐明了瑜伽行派的关键教说（尤其是第五至第七章），是无著与世亲进行哲学阐发的主要来源之一。《解深密经》尤其以自称“法轮第三转”而著称：在它看来，瑜伽行派的教义代表佛陀教法的顶点与决定性解释，而阿毗达磨与中观派先前的阐述则“不够充分”。在一个传统内部，论（*śāstra*）的撰作通常晚于经（*sūtra*），但学者们认为，《解深密经》的某些部分晚于卷帙浩繁的《瑜伽师地论》（*śāstra*）的若干章节（Schmithausen 1987: 12–13; Williams 2009: 85）[^schmithausen-1987][^williams-2009]。
