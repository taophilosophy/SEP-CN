      Most of these texts provide a comprehensive outline of the Mahāyāna path to enlightenment while introducing practitioners to the foundational doctrines of Yogācāra. There are also a few distinctive themes appearing in some of these works that are worth mentioning. The *Madhyāntavibhāga*, for instance, as the title suggests, depicts Yogācāra as a middle way between the extreme of permanence, referring to the mind-independent existence of objects endorsed by the Ābhidharmikas, and the extreme of annihilation, understood as the Madhyamaka view of universal emptiness. The *Abhisamayālaṃkāra* is a versified synopsis of the teachings of the *Prajñāpāramitā Sūtra*s. The *Ratnagotravibhāga*, in turn, is an important overview of the *tathāgatagarbha* doctrine.[^note-4]
