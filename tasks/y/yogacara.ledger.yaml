      ## 2. Yogācāra philosophical psychology: A new model of the mind
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      As its alternative names show, the Yogācāra tradition was particularly interested in understanding the nature, structure and various functions of consciousness. Indeed, one of the school’s most prominent philosophical innovations consists in the development of a new model of the mind. Traditional Abhidharma psychology posits six types of consciousness: one for each external sense modality, i.e., the visual, auditory, olfactory, gustatory and tactile consciousness, and one for mentation (*manas*), i.e., the mental consciousness (*manovijñāna*). Buddhists attribute diverse functions to the *manas*. For instance, it apprehends a range of mental objects (e.g., memories, imaginations), but it also has access to the sensory data supplied by the external sense faculties, synthesising them into unified (mental) objects and making various judgements about them.[^note-11] In contrast to this traditional model, classical Yogācāra distinguishes eight types of consciousness or cognition.[^note-12] In addition to the six forms of ordinary consciousness mentioned above, they posited a seventh type, commonly referred to as defiled or afflicted mind (*kliṣṭamanas*), and an eighth form of consciousness, called store or substratum consciousness (*ālayavijñāna*).
