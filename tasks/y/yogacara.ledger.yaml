      Attempts were made to harmonise the Yogācāra teachings with other branches of Buddhist thought not only in relation to the *tathāgatagarbha* and Sautrāntika doctrines but also Madhyamaka. Śāntarakṣita and his disciple Kamalaśīla (both dated to the c. 8ᵗʰ century CE) are often referred to as the “great synthesisers” of Madhyamaka and Yogācāra. In contrast to earlier Mādhyamikas who were ardent critics of the Yogācāra doctrines, Śāntarakṣita’s *Madhyamakālaṃkāra* (“Ornament of the Middle Way”) and Kamalaśīla’s *Madhyamakāloka* (“Illumination of the Middle Way”) consider Yogācāra to be a provisional teaching, effective in overcoming certain misconceptions about reality and preparing practitioners for the realisation of the “more profound” Madhyamaka doctrine of universal emptiness. The position adopted by Śāntarakṣita and Kamalaśīla is described by Tibetan doxographers as “Yogācāra-Svātantrika-Madhyamaka” (Svātantrika-Madhyamaka being one of the two main sub-schools of Madhyamaka, along with Prāsaṅgika-Madhyamaka).[^note-10]
