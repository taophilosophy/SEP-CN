      The *Yogācārabhūmi* is traditionally ascribed to Asaṅga (or, according to the Chinese tradition, to Asaṅga’s teacher, Maitreya), but most scholars today agree that it is a compilation consisting of several heterogeneous layers and was composed over an extended period of time (Schmithausen 1987: 13; Kramer 2005: 3–4; Deleanu 2006: 154–156; Delhey 2013: 502)[^deleanu-2006][^delhey-2013][^kramer-2005][^schmithausen-1987]. The two most renowned sections of the *Yogācārabhūmi* are the *Śrāvakabhūmi* and the *Bodhisattvabhūmi*. The former deals with practices associated with the *śrāvaka* practitioners of mainstream Buddhism, while the latter elucidates the *bodhisattva* path to Buddhahood and some of the central doctrines of Yogācāra. It is important to note, however, that the *Yogācārabhūmi* corpus lacks certain characteristic teachings of the more mature Yogācāra tradition, most importantly the *cittamātra* or *vijñaptimātra* doctrine and its idealist connotations (Schmithausen 2005: 244).
    step1: |-
      《瑜伽师地论》传统上归于无著（或按汉传传统，归于无著的老师弥勒），但如今大多数学者同意，它是一部由若干异质层次组成的汇编，经历了长期编纂（Schmithausen 1987: 13; Kramer 2005: 3–4; Deleanu 2006: 154–156; Delhey 2013: 502）[^deleanu-2006][^delhey-2013][^kramer-2005][^schmithausen-1987]。《瑜伽师地论》最著名的两部分是《声闻地》和《菩萨地》。前者讨论与主流佛教声闻修行者相关的实践，后者阐明菩萨成佛之道以及瑜伽行派的若干核心教说。然而必须指出，《瑜伽师地论》这一文献群缺少较成熟瑜伽行派传统的某些标志性教说，最重要的是唯心或唯识学说及其唯心论意涵（Schmithausen 2005: 244）。
