      Dignāga and Dharmakīrti’s thesis that cognition involves a representational form or image (*ākāra*) of an object (Kellner 2017: 312–313)[^kellner-2017] was particularly influential and controversial among later proponents of the Yogācāra doctrines. This view was adopted, for instance, by the Yogācāra philosopher Jñānaśrīmitra (c. 11ᵗʰ century CE) in his *Sākārasiddhiśāstra* (“Proof of the Form-Possession View”) and *Sākārasaṃgrahasūtra* (“A Summary of the Form-Possession View”). Jñānaśrīmitra’s “with-form” (*sākāra*) thesis was formulated in response to Ratnākaraśānti’s (c. late 10ᵗʰ to early 11ᵗʰ century CE) “without-form” (*nirākāra*) interpretation of Yogācāra. While both agreed that, in the light of the *cittamātra* doctrine, there are no real, mind-independent objects, they disagreed about the ultimate reality of the forms or images that appear within cognition itself. Ratnākaraśānti assumed that these forms or images are ultimately unreal, whereas Jñānaśrīmitra claimed that they actually exist (McCrea 2019)[^mccrea-2019]. It is also important to mention Jñānaśrīmitra’s disciple, Ratnakīrti (c. 11ᵗʰ century CE), amongst the proponents of Dignāga and Dharmakīrti’s tradition. In contrast to Dharmakīrti’s efforts to dispel the charge of solipsism levelled against the Yogācāra view, Ratnakīrti rejects the ultimate existence of other minds in his famous *Santānāntaradūṣaṇa*.
