      ### 3.4 Idealism in Vasubandhu’s *Twenty Verses*
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      As noted above, much of the idealism debate revolves around determining the exact position proposed and defended in Vasubandhu’s *Viṃśikā*.[^note-42] One of the main clusters of arguments Vasubandhu puts forward in favour of the mind-only position (in verses 2 to 4) is aimed at demonstrating that the Yogācāra doctrine is a viable explanation of our everyday experiences and, as such, can withstand the realists’ criticisms. Vasubandhu’s (hypothetical) opponent gives three reasons why the presupposition of material objects is necessary to explain the generally accepted features of our experiences. The first objection is based on the observation that our experiences are not random, but apparently follow the spatio-temporal patterns in which external objects cause them. In other words, if the objects we perceive were not mind-independent entities, or at least were not caused by such things, then it would be unaccountable why our perceptions of things occur at specific places and times. The second objection relies on the intersubjective nature of our perceptions. The opponent asks how multiple beings could have similar experiences at a given place and time, if not because the same external objects are present to all of them, causing their perceptions. The third objection is based on the common-sense belief that external objects perform various functions that merely mental or illusory objects cannot. Specifically, the external objects we perceive bring about observable changes in the world as well as in us; for instance one can feel full after eating a real but not an illusory dinner. Vasubandhu replies by arguing that these three conditions can equally be met by states in which, as even the opponent should concede, no external objects are involved. In dreams, for instance, objects can appear to us in patterns of spatio-temporal determination. The problem of intersubjectivity can be answered by appealing to the shared experiences of *preta*s (hungry ghosts) and beings in hell, who all undergo similar gruesome hallucinations or visions.[^note-43] Moreover, even unreal objects can produce real changes in our waking life, as is the case with wet or erotic dreams (or, one might add, nightmares).[^note-44]
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Another important cluster of arguments is meant to show that no materialist account of the sensible world is tenable. In verses 11 to 15 of the *Viṃśikā*, Vasubandhu raises and rejects various possible materialist accounts of the macrophysical objects we perceive. These theories include both Buddhist and non-Buddhist views; for instance Vasubandhu criticises the form of atomism embraced by the Vaibhāṣikas, as well as the Vaiśeṣika theory that posits “whole” objects over and above their (atomic or qualitative) parts. It is worth noting that the broader context of this argumentation is the opponent’s contention that the Buddha himself taught the existence of external objects. According to Vasubandhu’s reply, the Buddha taught it only as a conventional doctrine, and not as an ultimate truth, because even our best material theories of objects, such as theories of atomic agglomeration, turn out to be inconsistent with how we perceive the world.[^note-45]
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      According to a widespread reading of the *Twenty Verses*, the first cluster of arguments aims only to show that the mind-only doctrine is a viable alternative to realism as it can account for the most important features of our ordinary experiences. Vasubandhu attempts to establish the doctrine of mind-only in a more positive manner only in the second cluster of arguments, where he argues that there is no adequate physical or materialistic theory to explain our experiences of the sensible world. His strategy is to show that, in the absence of any viable alternative to explain our experiences, only the mind-only teaching can be true. This line of argument is sometimes called an inference to the best explanation (Gold 2011 [2022])[^gold-2011].[^note-46] On a slightly different reading (Kapstein 1988: 36–37)[^kapstein-1988], Vasubandhu uses a *modus tollens* argument in verses 11 to 15 to show that atomism is necessary to maintain that there are mind-independent, external objects, but atomism is false. Finnigan (2017: 181) and Arnold (2008: 16–17 and 2021: 103–107) also read Vasubandhu as aiming to prove the impossibility of external objects in these verses. While most scholars believe that this cluster of arguments implies an ontological idealist or immaterialist position, there is an influential strand of interpretation that disagrees, arguing that Vasubandhu is merely seeking to show the untenability of materialist theories *as explanations of our experiences.* For instance, Oetke (1992) contends that these verses only prove that mind-independent objects cannot be the (direct) objects of perception, but not that they do not exist at all.
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      There are some further considerations that might support an ontological idealist reading of the text. Many suggest that Vasubandhu could argue for ontological idealism on the grounds that it is rationally preferable to realism because, while it is equally capable of explaining all the phenomena at hand, it is an ontologically simpler or more parsimonious theory, appealing to fewer kinds of entities.[^note-47] This strategy, which Siderits (2007: 157–158) calls the “principle of lightness”, appears most clearly in verses 6–7, where Vasubandhu challenges the realist opponent by saying that if they are willing to admit that karma, construed as mental intention, produces physical entities (e.g., hell guardians), which in turn cause suffering in the mental streams of the tormented beings, then why do they not eliminate the intermediate physical step? The supposition that hell guardians are collective hallucinations in the minds of tormented beings is a “lighter” theory of how our experiences in hell come about, appealing only to *mental* entities.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      Even if we do not rely specifically on the second cluster of arguments, some scholars argue that we could still propose an ontological idealist reading of the *Viṃśikā*. Kellner and Taber (2014), for instance, read Vasubandhu’s various arguments in the *Viṃśikā* not only as naturally suggesting such a position, but also as part of an overall argumentative strategy that can be regarded as an argument from ignorance. On this reading, with the first cluster of arguments Vasubandhu shows that no *inference* drawn from the widely accepted features of our perceptual experiences can prove the existence of external objects. But since, as he goes on to show in the second part of the work, none of the other epistemic instruments (namely, *scriptural authority* in the second cluster of arguments, and *perceptual acquaintance* in the rest of the work) can demonstrate the existence of external objects, we have no evidence whatsoever in favour of realism. On the basis that the existence of external objects cannot be proved by any of the epistemic instruments, Vasubandhu concludes that the mind-only position is positively established.[^note-48]
