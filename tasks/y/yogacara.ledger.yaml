      ### 3.3 The origins of Yogācāra idealism
    step1: TBD
    step2: TBD
  - id: 55
    kind: body
    source: |-
      Despite the widespread association of Yogācāra with idealism, it is important to stress that not every Yogācāra scripture or treatise advocates the *cittamātra* or *vijñaptimātra* doctrine. As scholars (Griffiths 1986: 82–84; Schmithausen 1987: 32–33 and 297, n. 221; Schmithausen 2005b: 244–245; Kellner 2017: 307)[^griffiths-1986][^kellner-2017][^schmithausen-1987][^schmithausen-2005b] pointed out, the mind-only doctrine is conspicuously absent from the earliest strata of Yogācāra literature. The *Yogācārabhūmi*, for instance, mostly takes for granted the realist ontology of the mainstream Buddhist traditions. According to some scholars, we find some inconsistency in adopting an ontological idealist position even in the works of considerably later authors, such as Sthiramati, whose terminology and statements sometimes appear to be incompatible with idealism (Schmithausen 1987: 298 n. 222)[^schmithausen-1987].[^note-36] It should be added, however, that the *Yogācārabhūmi* corpus does contain some claims or allusions that can be seen as precursors of idealism. These include for instance the ideas that things are mere designations (*prajñapti*), that objects with their characteristics are products of false conceptualisation (*vikalpa*), or that meditative objects are purely mental in nature. This latter remark contrasts with the realist attitude towards the objects of meditation that prevails elsewhere in the work, where they are regarded as subtle material forms perceivable only by the mental cognition (Schmithausen 2005b: 245–246)[^schmithausen-2005b].
    step1: TBD
    step2: TBD
  - id: 56
    kind: body
    source: |-
      Scholars have offered various hypotheses to explain the origins of Yogācāra idealism. Griffiths (1986: 82) and Schmithausen (2005b: 246), for instance, argue that some of the core teachings of Yogācāra, especially its idealist philosophy, grew out of sustained contemplation of the nature of meditative experience rather than mere theoretical speculation. This is suggested by the earliest extant Yogācāra source that endorses idealism and uses the term *vijñaptimātra* to express it, the *Saṃdhinirmocana Sūtra* (Schmithausen 2005b: 245–246)[^schmithausen-2005b].[^note-37] Like the position mentioned above, the work adopts an idealist approach to the ontological status of meditative objects, emphasising that they are mental. The *Saṃdhinirmocana Sūtra*, however, goes further and extrapolates this idea to the objects of “reality”, considering them to be mere cognitions (*vijñaptimātra*) as well.[^note-38] But the centrality of meditative practice to the origins of Yogācāra doctrines is not universally accepted. Other scholars (e.g., Sharf 2005: 262–263)[^sharf-2005] have argued that the role attributed to meditative experience in the formation of Buddhist philosophical theories is exaggerated, and the idealist tendencies of the Yogācāra tradition can rather be traced back to philosophical inquiries into the status, and ontological implications, of misperceptions and dreams.[^note-39] Such a line of argument might be supported by the fact that Yogācāra philosophers often appeal to various illusory or hallucinatory states, including dreams and magic tricks, to illustrate and demonstrate the coherence of their position that no cognition whatsoever has a mind-independent object. Vasubandhu, for instance, begins the *Twenty Verses* by likening our ordinary perceptual experiences to a web of hairs or floaters that appear to people with an eye disease.
    step1: TBD
    step2: TBD
  - id: 57
    kind: body
    source: |-
      The development of Yogācāra idealism is also thought to have been catalysed by the Abhidharmic Sautrāntika theory of perception.[^note-40] The Sautrāntikas rejected the Abhidharmic Vaibhāṣika direct realist theory of perception, according to which we are directly acquainted with external objects in perception. Instead, as is generally assumed, they favoured the representative realist (or “representationalist”) view that one is in immediate contact only with mental objects, which in turn represent the external world (Dhammajoti 2007: 152–170; Siderits 2007: 130–137; Westerhoff 2018: 79–82)[^dhammajoti-2007][^siderits-2007][^westerhoff-2018].[^note-41] While external objects are still accepted as real according to the Sautrāntika theory, we can only infer their existence and nature from the resembling representations they cause. That Yogācāra was influenced by the Sautrāntika critique of Vaibhāṣika direct realism is evident, for instance, from verse 16 of Vasubandhu’s *Viṃśikā*. This passage argues that the realist cannot appeal to perceptual knowledge or direct acquaintance (*pratyakṣa*) to prove the existence of an external object. Since the cognitive processing of sensory information takes time, once the mental cognition forms the belief that the object is perceived, we are no longer directly aware of the object itself, but, arguably, only an internal representation of a past state of it. Moreover, given the doctrine of momentariness widely accepted in the Abhidharma tradition, by the time we make the judgement that “this object is perceived by me”, both the visual consciousness and the visible object have already ceased to exist. Hence, the allegedly mind-independent object the direct realist knows through perception does not actually exist. This argument bears certain similarities to the time-lag argument used against direct realism in contemporary philosophy (Siderits 2007: 133–134, 169; Mills 2017; Westerhoff 2018: 173)[^mills-2017][^siderits-2007][^westerhoff-2018]. But if we have perceptual knowledge only of unreal objects or mental representations, and the external sense objects are merely inferred as the (prior) causes of our perceptions, as the Sautrāntika position claims, then it seems natural that Yogācāras would also raise questions about the necessity or tenability of this inference, turning to an idealist or phenomenological position.
