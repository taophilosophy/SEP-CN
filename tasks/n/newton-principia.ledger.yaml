      > Mathematics requires an investigation of those quantities of forces and their proportions that follow from any conditions that may be supposed. Then, coming down to physics, these proportions must be compared with the phenomena, so that it may be found out which conditions of forces apply to each kind of attracting bodies. And then, finally, it will be possible to argue more securely concerning the physical species, physical causes, and physical proportions of these forces. [**P**, 588f]
    step1: TBD
    step2: TBD
  - id: 69
    kind: body
    source: |-
      He had other reasons as well. The theory of gravity entails that gravity below the surface of a uniformly dense sphere varies linearly with the distance from the center, and hence, at least to a first approximation, this is how gravity varies below the surface of the Earth. Centripetal forces that vary as 1/*r*³ hold if and only if the trajectory is a spiral;[^note-31] and, given any stationary orbit governed by centripetal forces, superposition of a 1/*r*³ centripetal force will cause that orbit to precess, as in the case of the lunar orbit.[^note-32] Still, Newton's main reason appears to have been the one given in the quotation.
    step1: TBD
    step2: TBD
  - id: 70
    kind: body
    source: |-
      In one curious respect that Newton mentions only once in passing, the theory does not cover all “conditions that may be supposed.” Newton's theory treats centripetal forces that vary only with the distance from the force center, that is, ones for which the force on two bodies equally distant from that center is always the same. It does not treat centripetal forces that vary with *θ* and *φ*, the two angular components of (*r*, *θ*, *φ*) spherical coordinates. This is notable for two reasons. First, the central forces arising in Cartesian vortices would almost certainly have varied with both of these angular components, and hence Newton is tacitly begging a question. Second, as Newton himself realized and noted in Section 13 of Book 1, gravity around a spheroid does not vary simply as 1/*r*², but must also vary with latitude.[^note-33] From Newton's point of view, therefore, gravity around Jupiter and the Earth, and surely the Sun as well, does not vary simply as 1/*r*². This is one of many often ignored cues pointing to the extent to which the evidential reasoning in the *Principia* has to be more intricate and subtle than was appreciated at the time, or for that matter even now.
    step1: TBD
    step2: TBD
  - id: 71
    kind: body
    source: |-
      Up to the end of Section 10, Book 1 considers forces that are directed toward geometric centers rather than bodies. As a consequence, only the first two laws of motion enter into any of the proofs until late in Book 1. Even further, as Newton develops the theory to that point, only the accelerative measure of force is employed, and hence even *mass* plays no role. Included in this segment are by far the most widely read parts of Book 1, then and now: Section 2, which deals with centripetal forces generally, and Section 3, which develops Newton's fundamental discovery that a body moves in a conic section, sweeping out equal areas in equal times about a focus, if and only if the motion is governed by an inverse-square centripetal force directed toward this focus. The stick-figure picture of Book 1 that results from viewing these two sections as its high point blinds the reader not only to the richness of the theory developed in it, but also to several no less important results derived in the rest of it.
