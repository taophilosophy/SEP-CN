      The second edition appeared in 1713, twenty six years after the first. It had five substantive changes of note. First, the structure of the argument for universal gravity at the beginning of Book 3 was made more evident, and the word ‘hypothesis’ was dropped from it. Second, because of disappointment with pendulum-decay experiments and an erroneous claim about the rate a liquid flows vertically through a hole in the bottom of a container, the second half of Section 7 of Book 2 was entirely replaced, ending with new vertical-fall experiments to measure resistance forces versus velocity and a forcefully stated rejection of all vortex theories.[^note-17] Third, the treatment of the variation of surface gravity with latitude (Book 3, Proposition 20) was significantly extended, partly in response to Huygens's alternative treatment of this variation, but also because of more recent data from near the Equator. Fourth, the treatment of the wobble of the Earth producing the precession of the equinoxes was revised in order to accommodate a much reduced gravitational force of the Moon on the Earth than in the first edition. Fifth, several further examples of comets were added at the end of Book 3, taking advantage of Halley's efforts on the topic during the intervening years. In addition to these, two changes were made that were more polemical than substantive: Newton added the General Scholium following Book 3 in the second edition, and his editor Roger Cotes provided a long anti-Cartesian (and anti-Leibnizian) Preface.
    step1: |-
      第二版于 1713 年问世，距第一版二十六年。它有五处值得注意的实质性改动。第一，第三卷开头关于万有引力的论证结构变得更加明晰，并且删去了“假设”一词。第二，由于对摆的衰减实验感到失望，以及关于液体从容器底部小孔垂直流出的速率有一项错误主张，第二卷第七节的后半部分被完全替换，结尾是新的垂直下落实验，用以测量阻力与速度的关系，并有力陈述了对一切涡旋理论的拒斥。[^note-17] 第三，关于表面重力随纬度变化的处理（第三卷命题 20）被大幅扩展，部分是为了回应惠更斯对这一变化的替代处理，部分是因为来自赤道附近的新数据。第四，关于地球晃动产生二分点岁差的处理被修订，以容纳比第一版小得多的月球对地球的引力。第五，第三卷末尾增添了若干新的彗星例子，利用了哈雷在这些年间对这一主题的研究。除此之外，还有两处改动更多是论战性的而非实质性的：牛顿在第二版第三卷之后增添了《总释》，其编者罗杰·科茨则提供了一篇长篇反笛卡尔（且反莱布尼茨）的序言。
