      Newton's eschewing the method of hypotheses produced no controversy at the time. In a manuscript revision of his “Essay on the causes of celestial motions” Leibniz even adopted Newtonian phrasing: “What follows is not based on hypotheses but is deduced from phenomena by the laws of motion” [Aiton, 1972, 132][^aiton-1972]. A large fraction of those who had read at most small portions of the *Principia* and depended on others for their knowledge of it most likely saw Newton as having hypothesized inverse-square attraction and hence as in fact following the method of hypotheses. In the years after Newton died, the most celebrated issues receiving concentrated research arose not from how Newton had arrived at universal gravity, but from the claims he had derived from it concerning the figure of the Earth, the vagaries in the motions of Jupiter and Saturn, and the motion of the Moon. The individuals at the center of this research certainly saw these issues as a test of Newton's theory of gravity, but the distinction between taking the theory as a hypothesis and taking it as a provisionally established conclusion was a distinction without much difference for them. Still, it is worth noting that the conclusion Clairaut first drew from the factor of 2 discrepancy in the motion of the lunar apogee was not that Newton's theory of gravity was false, but that the inverse-square needed to be supplemented by a 1/*r*⁴ term — a response fully in keeping with Newton's fourth rule of reasoning.
    step1: |-
      牛顿摒弃假设方法在当时并未引起争议。莱布尼茨在其《论天体运动的原因》的手稿修订中甚至采用了牛顿式措辞：“以下内容不是基于假设，而是通过运动定律从现象推出的” [Aiton, 1972, 132][^aiton-1972]。那些至多读过《原理》小部分、并依赖他人了解该书的人，很大一部分很可能认为牛顿假设了平方反比吸引，因而实际上遵循了假设方法。在牛顿去世后的岁月里，受到集中研究的最著名问题，并非源于牛顿如何达到万有引力，而是源于他从万有引力推出的关于地球形状、木星和土星运动偏差以及月球运动的主张。处于这些研究核心的人确实把这些议题视为对牛顿引力理论的检验，但“把理论当作假设”与“把理论当作暂定确立的结论”之间的区分，对他们而言是没有多大差别的区分。尽管如此，值得注意的是：克莱罗最初从月球远地点运动的 2 倍差异中得出的结论，并不是牛顿引力理论为假，而是平方反比需要补充一个 1/r⁴ 项——这一回应完全符合牛顿的第四推理法则。
