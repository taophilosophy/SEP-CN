      Under this interpretation, Newton's second law would not have seemed novel at the time. The consequences of impact were also being interpreted in terms of the distance between where the body would have been after a given time, had it not suffered the impact, and where it was after this time, following the impact, with the magnitude of this distance depending on the relative bulks of the impacting bodies. Moreover, Huygens's account of the centrifugal force (that is, the tension in the string) in uniform circular motion in his *Horologium Oscillatorium* used as the measure for the force the distance between where the body would have been had it continued in a straight line and its location on the circle in a limiting small increment of time; and he then added that the tension in the string would also be proportional to the weight of the body. So, construed in the indicated way, Newton's second law was novel only in its replacing bulk and weight with mass.[^note-22]
