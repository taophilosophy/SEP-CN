      The continuity with Huygens's theory of centrifugal force is important in another respect. In his brief defense of the first two laws of motion Newton remarks, “What has been demonstrated concerning the times of oscillating pendulums depends on the same first two laws and first two corollaries, and this is supported by daily experience with clocks” [**P**, 424]. In Huygens's *Horologium Oscillatorium*, the only place any counterpart to the second law surfaces is in the theory of centrifugal force and uniform circular motion. The theory Huygens presents extends to conical pendulums, including a conical pendulum clock that he indicates has advantages over simple pendulum clocks. In the 1670s Newton had used a conical pendulum to confirm Huygens's announced value of the strength of surface gravity as measured by simple cycloidal and small-arc circular pendulums.[^note-26] (Huygens himself had measured the strength of surface gravity with a conical pendulum, obtaining the same value to four significant figures as he had obtained with simple pendulums.[^note-27]) The precise agreement between these two theory-mediated measures of surface gravity, one of them predicated on Newton's first two laws of motion and the other not, in fact constituted the strongest evidence for the first two laws at the time the *Principia* was first published. For, the simple pendulum measure was known to be stable and accurate into the fourth significant figure. The evidence in hand for the first two laws, taken as a basis for measuring forces, was thus much stronger than has often been appreciated.
    step1: TBD
    step2: TBD
  - id: 64
    kind: body
    source: |-
      Save perhaps for the attribution of the *F=ma* form of the second law to the *Principia*, the most widespread mistake about Newton's three laws of motion is that they alone sufficed for all problems in classical mechanics. Those who developed what we now call Newtonian mechanics during the eighteenth century at all times appreciated how far from the truth this is. Newton's three laws of motion suffice for problems involving what Euler dubbed “point-masses.” Indeed, once given the forces acting on a point mass, the three laws hold for all point-masses, including those that lie within bodies. But the three laws must be supplemented by further principles for a whole host of celebrated problems involving bodies, rigid or otherwise, that are not mere point-masses. Perhaps the simplest prominent example at the time was the problem of a small arc circular pendulum with two (or more) point-mass bobs along the string. Huygens had solved this problem in the part of his *Horologium Oscillatorium* entitled “The Center of Oscillation,” in the process providing the theoretical basis for using added masses to tune pendulum clocks.[^note-28] The reason why Newton's three laws of motion have to be supplemented to solve this problem is easy to see. Consider the case of a pendulum with two point-masses along the length of a rigid string. The outer point-mass has the effect of reducing the speed of the inner one, versus what it would have had without the outer one, and the inner point-mass increases the speed of the outer one. In other words, motion is transferred from the inner one to the outer one along the segment of the string joining them. Once the force transmitted to each point-mass along the string is known, Newton's three laws of motion are sufficient to determine the motion. But his three laws are not sufficient to determine what this force transmitted along the string is. Some other principle beyond them is needed to solve the problem. Which principle is to be preferred in solving this problem became a celebrated issue extending across most of the eighteenth century.[^note-29]
