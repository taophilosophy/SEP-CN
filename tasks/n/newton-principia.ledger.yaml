      [^note-24]: Newton goes on to say, “By means of the first two laws and the first two corollaries Galileo found that the descent of heavy bodies is in the squared ratio of the time and that the motion of projectiles occurs in a parabola, as experiment confirms, except insofar as these motions are somewhat retarded by the resistance of the air.” In fact, Galileo does not employ the notion of force at all in his derivation of these two relationships, and contrary to legend however much Galileo may have anticipated the first law, he never showed the least sign of appreciating the implication that Descartes emphasized, that curvilinear motion requires something to deflect the body out of its motion in a straight line. In the second edition of the *Principia* Newton adds a passage indicating how the two Galilean relationships can be derived using the first two laws and first two corollaries. All the evidence indicates that Newton never read Galileo's *Two New Sciences* and knew of the results in it only through secondary sources, including Huygens's *Horologium Oscillatorium*. His claim about Galileo accordingly was more likely just presumptuous, and not dishonest.
    step1: |-
      [^note-24]: 牛顿接着说：“借助前两条定律和前两条推论，伽利略发现重物下落按时间的平方比，抛体运动沿抛物线进行，实验证实了这一点，除非这些运动因空气阻力而有所减缓。”事实上，伽利略在推导这两个关系时根本未使用力的概念；而且与传说相反，无论伽利略可能多么预见到第一定律，他从未表现出丝毫领会笛卡尔所强调的蕴含：曲线运动需要某种东西使物体偏离其直线运动。在《原理》第二版中，牛顿增添了一段文字，说明如何用前两条定律和前两条推论推导伽利略的两个关系。所有证据都表明，牛顿从未读过伽利略的《两门新科学》，只是通过二手来源（包括惠更斯的《摆钟论》）得知其中的结果。因此，他关于伽利略的说法更可能只是冒昧，而非不诚实。
