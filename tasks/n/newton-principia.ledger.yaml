      > For the whole difficulty of philosophy seems to be to discover the forces of nature from the phenomena of motions and then to demonstrate the other phenomena from these forces. It is to these ends that the general propositions in books 1 and 2 are directed, while in book 3 our explication of the system of the world illustrates these propositions. For in book 3, by means of propositions demonstrated mathematically in books 1 and 2, we derive from celestial phenomena the gravitational forces by which bodies tend toward the sun and toward the individual planets. Then the motions of the planets, the comets, the moon, and the sea are deduced from these forces by propositions that are also mathematical. If only we could derive the other phenomena of nature from mechanical principles by the same kind of reasoning! For many things lead me to have a suspicion that all phenomena may depend on certain forces by which particles of bodies, by causes not yet known, either are impelled toward one another and cohere in regular figures, or are repelled from one another and recede. Since these forces are unknown, philosophers have hitherto made trial of nature in vain. But I hope that the principles set down here will shed some light on either this mode of philosophizing or some truer one. [**P**, 382][^note-2]
    step1: |-
      > 因为哲学的全部困难似乎在于，从运动的诸现象中发现自然之力，然后从这些力证明其余现象。普遍命题在第一卷和第二卷中正是指向这些目的，而在第三卷中我们对世界体系的阐释则说明这些命题。因为在第三卷中，我们借第一卷和第二卷中数学地证明的命题，从天体现象推出物体朝向太阳和各个行星的引力。然后行星、彗星、月球以及海洋的运动，由这些力借同样是数学的命题推出。但愿我们能以同类的推理从力学原理推出自然的其他现象！因为许多事情使我猜想，所有现象都可能依赖某些力，物体微粒借这些力，由尚未知的成因，或者被推动彼此趋近并按规则形状聚合，或者彼此排斥而退离。由于这些力未知，哲学家迄今对自然的试探都是徒劳的。但我希望此处立下的原理能对这种方式或某种更真的哲学思考方式有所启发。[**P**, 382][^note-2]
