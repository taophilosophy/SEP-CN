      In spite of extravagant claims made about the *Principia* by some in the years after it first appeared — “… he seems to have exhausted his Argument, and left little to be done by those that shall succeed him”[^note-1] — the most positive view of it that anyone could have substantiated during the first half of the eighteenth century would have emphasized its promise more than its achievements. The theory of gravity had too many loose ends, the most glaring of which was a factor of 2 discrepancy in the mean motion of the lunar apogee, a discrepancy that undercut the claim that the Moon is held in orbit by an inverse-square force. No one knew these loose ends better than Newton himself, yet no one had a greater sense of the potential of the theory of gravity to resolve a whole host of questions in planetary astronomy — which may well explain why he made these loose ends difficult to see except by the most technically skilled, careful readers. Between the late 1730s and the early 1750s the situation changed dramatically when several of the loose ends were tied up, in some cases yielding such extraordinary results as the first truly successful descriptive account of the motion of the Moon in the history of astronomy. During the second half of the eighteenth century the promise of the *Principia* was not only universally recognized by those active in empirical research, but a large fraction of this promise was realized. What we now call “Newtonian mechanics” emerged in this process, as did the gravity-based accounts of the often substantial divergences of the planets from Keplerian motion, the achievement of Newton's theory of gravity that ultimately ended all opposition to it.
    step1: |-
      尽管在《原理》问世后的岁月里，有人对它作出过夸张的断言——“……他似乎已经穷尽了他的论证，几乎没给后继者留下什么可做之事”[^note-1]——但在 18 世纪上半叶，任何人所能证成的最积极看法，都会更强调它的前景而非成就。引力理论有太多未了结的疑难，其中最刺眼的是 **月球远地点** 的 **平均运动** 中一个 2 倍的差异；这一差异削弱了“月球由平方反比力维持在其轨道上”这一主张。没有人比牛顿本人更了解这些疑难，但也没有人比他更强烈地意识到引力理论在解决行星天文学中一大批问题上的潜力——这或许足以解释，他为何要让这些疑难难以被察觉，除非读者是技术最为娴熟、最为仔细的人。18 世纪 30 年代末至 50 年代初，随着若干疑难被厘清，情况发生了戏剧性变化，某些情形甚至产生了非凡的成果，例如天文学史上首个真正成功的月球运动描述性说明。到 18 世纪下半叶，《原理》的前景不仅被从事经验研究的人普遍承认，而且其中很大一部分已经实现。我们今天所称的“牛顿力学”便在这一过程中形成；以引力为基础、对行星偏离开普勒运动（这种偏离往往相当可观）所作的说明也一并形成——这是牛顿引力理论最终终结一切反对意见的成就。
