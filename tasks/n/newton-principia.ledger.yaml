      It is important to recognize that, in calling the referents of the defined terms “quantities,” Newton is assigning them to the ontological category of quantity in Aristotle's sense. Thus force and motion are quantities that have direction as well as magnitude, and it makes no sense to talk of forces as individuated entities or substances. Newton's laws of motion and the propositions derived from them involve relations among quantities, not among objects. In place of “no entity without identity,” we have “no quantity without definite proportions;”[^note-19] and the demand on measurement is to supply values that unequivocally yield an adequate approximation to these definite proportions.
    step1: |-
      重要的是要认识到，牛顿把被定义术语的所指称为“量”，是把它们归入亚里士多德意义上的“量”这一本体论范畴。因此，力与运动都是既有方向又有大小的量；把力当作个体化的实体或实体来谈论是没有意义的。牛顿的运动定律以及由它们推出的命题，涉及的是量之间的关系，而不是物体之间的关系。我们不说“没有同一性就没有实体”，而说“没有确定的比率就没有量”；[^note-19] 而测量要求提供这样的值：它们明确地给出对这些确定比率的充分近似。
