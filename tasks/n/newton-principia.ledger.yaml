      The historical context in which Newton wrote the *Principia* involved a set of issues that readers of the first edition saw it as addressing: Was Kepler's approach to calculating the orbits, or some other, to be preferred? Was there some empirical basis for resolving the issue of the Copernican versus the Tychonic system? Were the true motions complicated and irregular versus the calculated motions? Can mathematical astronomy be an exact science? No reader of the *Principia* at the time had the benefit of seeing how Newton had these questions tied together in the “Copernican Scholium” because it did not appear in print until two hundred years later.[^note-12] Nothing, however, brings out more clearly the extent to which the expanded scope of the *Principia* stemmed from Newton's preoccupation with the problem of reaching conclusions that had claim to being exact from evidence that, by his reckoning, held at best to high approximation. This is why the “Copernican scholium” provides the most illuminating context for reading the *Principia*. Equally, its being unknown for so long helps to explain why the *Principia* has generally been read so simplistically.
    step1: |-
      牛顿写作《原理》时的历史背景，涉及一组问题，而第一版的读者认为该书正是在处理这些问题：应当优先采用开普勒的轨道计算进路，还是某种其他进路？是否存在某种经验依据来解决哥白尼体系与第谷体系之争？与计算出的运动相比，真实运动是否复杂而不规则？数学天文学能否成为一门精确科学？当时《原理》的读者没有一个能得益于看到牛顿如何把这些在“哥白尼附释”中串起来，因为该附释直到两百年后才付印。[^note-12] 然而，没有任何东西比这一点更清楚地表明：《原理》范围的扩大，源于牛顿执意要从按他估计充其量只高度近似成立的证据中，得出有资格被称为精确的结论。这就是为什么“哥白尼附释”为阅读《原理》提供了最富启发性的语境。同样，它长期不为人知，也有助于解释《原理》为何一般被读得如此简单化。
