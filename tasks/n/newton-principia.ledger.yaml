      Newton originally planned a two-book work, with the first book consisting of propositions mathematically derived from the laws of motion, including a handful concerning motion under resistance forces, and the second book, written and even formatted in the manner of Descartes's *Principia*, applying these propositions to lay out the system of the world. By the middle of 1686 Newton had switched to a three-book structure, with the second book devoted to motion in resisting media. What appears to have convinced him that this topic required a separate book was the promise of pendulum-decay experiments to allow him to measure the variation of resistance forces with velocity.[^note-14] When Hooke raised a priority issue on inverse-square forces, Newton dropped the original version of the last book, switching to presenting the system of the world in a sequence of mathematically argued propositions, many of which demand far more of the reader than anything in the original version. The original “System of the World” did appear in print the year after Newton died. No complete text for the original version of Book 1 has ever been found.
    step1: |-
      牛顿最初计划写一部两卷本著作：第一卷由从运动定律数学地推出的命题组成，其中包括少数关于阻力作用下运动的命题；第二卷则按笛卡尔《哲学原理》的方式撰写甚至排版，应用这些命题来铺陈世界体系。到 1686 年中期，牛顿已改为三卷结构，第二卷专门讨论在阻力介质中的运动。看来使他确信这一主题需要单独成卷的，是摆的衰减实验有望让他测量阻力随速度的变化。[^note-14] 当胡克就平方反比力的优先权提出异议时，牛顿放弃了最后一卷的原始版本，改为以一系列数学论证的命题来呈现世界体系，其中许多命题对读者的要求远高于原始版本中的任何内容。原始的《世界体系》确实在牛顿去世后第二年出版。原始第一卷的完整文本从未被发现。
