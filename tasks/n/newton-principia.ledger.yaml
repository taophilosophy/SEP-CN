      ## 10. The Methodology of the *Principia*
    step1: TBD
    step2: TBD
  - id: 137
    kind: body
    source: |-
      In two passages that remained word for word the same in all three editions Newton announced that the *Principia* was meant to illustrate a new approach to empirical inquiry. Neither the remark about deriving forces from phenomena of motion and then motions from these forces in the Preface to the first edition nor the remark about comparing a generic mathematical theory of centripetal forces with the phenomena in order to find out which conditions of force actually hold at the end of Book 1, Section 11, however, shed much light on just what this new approach is supposed to be. Other than these two passages, the only notable remark about methodology is the famous passage, quoted earlier, from the General Scholium added in the second edition as a final, parting statement:
    step1: TBD
    step2: TBD
  - id: 138
    kind: body
    source: |-
      > I have not as yet been able to deduce from phenomena the reason for these properties of gravity, and I do not feign hypotheses. For whatever is not deduced from the phenomena must be called a hypothesis; and hypotheses, whether metaphysical or physical, or based on occult qualities, or mechanical, have no place in experimental philosophy. In this experimental philosophy, propositions are deduced from the phenomena and are made general by induction. The impenetrability, mobility, and impetus of bodies, and the laws of motion and law of gravity have been found by this method. And it is enough that gravity should really exist and should act according to the laws that we have set forth and should suffice for all the motions of the heavenly bodies and of our sea. [**P**, 943]
    step1: TBD
    step2: TBD
  - id: 139
    kind: body
    source: |-
      Much of the discussion of the methodology of the *Principia* in the philosophical literature, from the eighteenth century down to the present time, has taken this clearly polemical passage as the starting point, generating unfortunately more heat than light.[^note-57] This is not the place to grapple with all the controversies surrounding this passage. Some guarded comments about the methodology of the *Principia* may nevertheless prove helpful.
    step1: TBD
    step2: TBD
  - id: 140
    kind: body
    source: |-
      It is scarcely surprising that the unprecedented success of Newton's theory of gravity stimulated interest in the methodology of the *Principia*. The obvious thought was to emulate this success in other areas by following the same method. But then, even independently of questions about what the method was, one has to consider exactly how it contributed to the success. Viewed in retrospect, Book 2 makes clear that this question has no simple answer. If Newton followed the same method in Book 2, then the failure of his effort on resistance forces — even worse, the failure that he did not recognize — shows that the method was no guarantee of success. The empirical world must cooperate for it to succeed.
    step1: TBD
    step2: TBD
  - id: 141
    kind: body
    source: |-
      Two aspects of the general thrust of the method are perfectly clear. First, Newton viewed it as contrasting with what was then called the method of hypotheses — that is, the method of putting forward hypotheses that reached far beyond the available data and then marshalling evidence for them by deducing testable conclusions from them.[^note-58] Second, Newton viewed the method as requiring that questions be regarded as open when empirical considerations had not yet yielded answers to them. Whatever may have been required for empirical consideration to establish a theoretical conclusion, and whatever the status, provisional or otherwise, any such established conclusion was supposed to have, Newton viewed the method as allowing — even mandating — that theoretical answers to some questions could be established even while other closely related questions remained in abeyance. In particular, to use Newton's phrasing from the Scholium that ends Section 11, the physical species and physical proportions of forces could, in the appropriate sense, be established even though the question of their physical causes remained open. The clear aim of the method was accordingly to limit theoretical claims to “inductive generalizations,” as specified by the Rules of Reasoning, of conclusions dictated by experiment and observation.
    step1: TBD
    step2: TBD
  - id: 142
    kind: body
    source: |-
      Newton's eschewing the method of hypotheses produced no controversy at the time. In a manuscript revision of his “Essay on the causes of celestial motions” Leibniz even adopted Newtonian phrasing: “What follows is not based on hypotheses but is deduced from phenomena by the laws of motion” [Aiton, 1972, 132]. A large fraction of those who had read at most small portions of the *Principia* and depended on others for their knowledge of it most likely saw Newton as having hypothesized inverse-square attraction and hence as in fact following the method of hypotheses. In the years after Newton died, the most celebrated issues receiving concentrated research arose not from how Newton had arrived at universal gravity, but from the claims he had derived from it concerning the figure of the Earth, the vagaries in the motions of Jupiter and Saturn, and the motion of the Moon. The individuals at the center of this research certainly saw these issues as a test of Newton's theory of gravity, but the distinction between taking the theory as a hypothesis and taking it as a provisionally established conclusion was a distinction without much difference for them. Still, it is worth noting that the conclusion Clairaut first drew from the factor of 2 discrepancy in the motion of the lunar apogee was not that Newton's theory of gravity was false, but that the inverse-square needed to be supplemented by a 1/*r*⁴ term — a response fully in keeping with Newton's fourth rule of reasoning.
    step1: TBD
    step2: TBD
  - id: 143
    kind: body
    source: |-
      The aspect of Newton's method that did produce controversy at the time was his insisting that he had established conclusions about the physical species and physical proportions of celestial forces while holding questions about their physical causes in abeyance. This was the core of the complaint by Cartesians that the *Principia* was a work of mathematics, not physics. For Newton's two most important critics, however, Huygens and Leibniz, the objection was not to holding the question of physical causes open, but to accepting certain conclusions that in their mind ruled out the very possibility of a proper answer to the question of physical cause. The defect in Newton's method lay in its not imposing the constraint on theory that all action be through contact, and not at a distance. The violation of this constraint lay behind Huygens's remarking,
    step1: TBD
    step2: TBD
