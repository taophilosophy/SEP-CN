      Careful reading of the *Principia* makes clear that, although unforthcoming about any of the loose ends, Newton was perfectly aware of them all, in one way or another flagging each for the benefit of the highly astute reader. An instructive way to present the history of eighteenth century research in the wake of the *Principia* is to trace how each of the loose ends became a prominent matter of concern and was then resolved, at least to the point of being removed as in any way a threat to Newton's theory of gravity. This process of addressing the loose ends in Book 3 did not get underway until the 1730s, after Newton had died. During his lifetime the most pressing complaint against the *Principia* was the absence of a mechanism to account for its action save for action at a distance, which Newton himself regarded as “so great an absurdity, that I believe no man who has in philosophical matters a competent faculty of thinking can ever fall into it.”[^note-56] The absence of a mechanism, however, was not something that Newton himself regarded as a loose-end in the *Principia*, for he insisted that all the conclusions listed above could be established, and any loose ends in them resolved, through the law of universal gravity alone, independently of the mechanism responsible for it. Over the decades after he died, those engaged in research predicated on his theory of gravity came increasingly to this same view of the question of mechanism.
    step1: |-
      仔细阅读《原理》会清楚表明：尽管牛顿对任何未了结疑难都不明言，但他完全知道所有这些疑难，并以某种方式为极为敏锐的读者逐一标出。呈现《原理》之后 18 世纪研究史的一种富有启发的方式，是追踪每个未了结疑难如何成为突出的关切事项，然后如何被解决，至少解决到不再对牛顿引力理论构成任何威胁的程度。处理第三卷未了结疑难的这一过程直到 1730 年代牛顿去世后才开始。在牛顿生前，针对《原理》最迫切的抱怨是缺少一种机制来解释其作用，只能依靠超距作用；牛顿本人认为超距作用是“如此巨大的荒谬，我相信任何在哲学事务上具有健全思考能力的人都不可能陷入其中。”[^note-56] 然而，缺少机制并非牛顿本人视为《原理》中未了结疑难的东西，因为他坚持认为上文所列的一切结论都可以仅通过万有引力定律建立起来，其中的任何未了结疑难也都可以由此解决，而与造成引力的机制无关。在他去世后的几十年里，以他的引力理论为前提从事研究的人越来越接受关于机制问题的这同一看法。
