      > 我在此把“吸引”一词用于一般意义，指物体彼此接近的任何努力，无论这种努力是因为物体彼此相吸，还是因为物体借由发射出的精气而相互作用；也无论它是出自以太、空气或任何其他介质的作用——无论该介质是有形的还是无形的——以任何方式推动漂浮其中的物体彼此接近。我也在同样的一般意义上使用“推动”（impulse）一词；在这部论著中，我考虑的不是力的种类及其物理性质，而是力的量值与数学比例，正如我在定义中所解释的那样。数学要求研究那些由任何可被设想的条件推出的力的量值与比例。然后，下降到物理学，这些比例必须与现象相比较，以便发现哪些力的条件适用于每一类吸引物体。最后，才有可能就这些力的物理种类、物理原因与物理比例更可靠地论证。（**P**, 588）
