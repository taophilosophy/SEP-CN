      Newton's Proposition 6 generalizes this result to not necessarily uniform motion *under centripetal forces* along an arbitrary trajectory in which equal areas are swept out in equal times with respect to S, in accord with Proposition 1 of Book 1. The central force at P is again proportional to the displacement from the tangent QR over a short increment of time divided by the square of this time; but now the time is proportional not to the arc PQ, but to the area swept out, which in the limit as Q approaches P, is the triangular area SPxQT/2. Therefore, to keep a body moving along a given non-circular trajectory, the centripetal force must vary along the trajectory as (1/SP²) — that is, 1/*r*² — times the limit of (QR/QT²) as Q approaches P. In the second edition Newton adds a corollary that displays another way of seeing the result as a generalization of uniform circular motion: the centripetal force along the trajectory must everywhere vary as *v*²/(*ρ*sinSPR), where *ρ* is the radius of curvature of the trajectory at P. With this, the body can be viewed as driven from one instantaneous circle to the next by the component of force tangential to the motion, a component that disappears in the case of uniform circular motion.
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      Newton illustrates the value of Proposition 6 with a series of examples, the two most important of which involve motion in an ellipse. If the force center is at a focus S of the ellipse, then the limit of (QR/QT²) is everywhere equal to half the constant latus rectum of the ellipse, and hence the force varies as 1/SP², or 1/*r*². But if the force center is at the center C of the ellipse, the force turns out to vary as PC, that is, linearly with *r*. This contrast raises an interesting question. What conclusion can be drawn in the case of motion in an ellipse for which the foci are very near the center, and the center of force is not known to be exactly at the focus? Newton clearly noticed this question and supplied the means for answering it in the Scholium that ends Section 2.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Section 10 includes a philosophically important result that has gone largely unnoticed in the literature on the *Principia*. Newton's argument that terrestrial gravity extends to the Moon depends crucially on Huygens's precise measurement of the strength of surface gravity. This theory-mediated measurement was based on the isochronism[^note-36] of the cycloidal pendulum under uniform gravity directed in parallel lines toward a flat Earth. But gravity is directed toward the center of the (nearly) spherical Earth along lines that are not parallel to one another, and according to Newton's theory it is not uniform. So, does Huygens's measurement cease to be valid in the context of the *Principia*? Newton recognized this concern and addressed it in Propositions 48 through 52 by extending Huygens's theory of the cycloidal pendulum to cover the hypocycloidal pendulum — that is, a cycloidal path produced when the generating circle rolls along the inside of a sphere instead of along a flat surface. Proposition 52 then shows that such a pendulum, although not isochronous under inverse-square centripetal forces, is isochronous under centripetal forces that vary linearly with the distance to the center. Insofar as gravity varies thus linearly below the surface in a uniformly dense sphere, the hypocycloidal pendulum is isochronous up to the surface, and hence it can in principle be used to measure the strength of gravity. A corollary to this proposition goes further by pointing out that, as the radius of the sphere is increased indefinitely, its surface approaches a plane surface and the law of the hypocycloidal asymptotically approaches Huygens's law of the cycloidal pendulum. This not only validates Huygens's measurement of surface gravity, but also provides a formula that can be used to determine the error associated with using Huygens's theory rather than the theory of the hypocycloidal pendulum.
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      Thus, what Newton has taken the trouble to do in Section 10 is to show that Huygens's theory of pendulums under uniform parallel gravity is a limit-case of Newton's theory of pendulums under universal gravity. At the end of Section 2 he points out in passing that this limit strategy also captures Galileo's theory of projectile motion. In other words, Newton took the trouble to show that the Galilean-Huygensian theory of local motion under their uniform gravity is a particular limit-case of his theory of universal gravity, just as Einstein took the trouble to show that Newtonian gravity is a limit-case of the theory of gravity of general relativity. Newton's main reason for doing this appears to have been the need to validate a measurement pivotal to the evidential reasoning for universal gravity in Book 3. From a philosophic standpoint, however, what is striking is not merely his recognizing this need, but more so the trouble he went to to fulfill it. Section 10 may thus illustrate best of all that Newton had a clear reason for including everything he chose to include in the *Principia*.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Section 9 includes another often overlooked result that is pivotal to the evidential reasoning for universal gravity in Book 3. Proposition 45 applies the result on precessing orbits mentioned earlier to the special case of nearly circular orbits, that is, orbits like those of the then known planets and their satellites. This proposition establishes that such orbits, under purely centripetal forces, are stationary — that is, do not precess — if and only if the centripetal force governing them is *exactly* inverse-square. It does this by deriving a formula relating the exponent *n* in the force law to the angle *θ* between the point where the orbiting body is furthest from the force center to the point where it is nearest, that is, the apsidal angle: *n* = (180/*θ*)²-3. (To illustrate, if the apsidal angle is 180 degrees, as in a Keplerian ellipse, then the exponent in the force law is -2, and if the apsidal angle is 90 degrees, as in an ellipse for which the force center is in the center, the exponent is +1.) This result is striking in three ways. First, insofar as the cumulative effect of even a very small precession is detectable after several revolutions, this formula turns the rate of precession (2*θ* per revolution) into a sensitive measure of the exponent in the force law. Second, it yields a conditional beyond “*If the orbit is stationary, then the centripetal force is inverse-square*,” namely, “*If the orbit is nearly stationary, then the centripetal force is nearly inverse-square*.” Using Newton's preferred phrasing, *quam proxime* (literally, “most nearly as possible”), this latter conditional has an “If…*quam proxime*, then…*quam proxime*” form. Newton illustrates this by taking the mean precession rate of the lunar orbit, 3 degrees per revolution, to conclude that the exponent for the net centrifugal force acting on the Moon is -2 and 4/243. Third, even when an orbit does precess, once such a fractional departure of the exponent from -2 is shown to result from the perturbing effect of outside bodies, then one can still conclude that the force toward the central body is exactly -2. This is precisely the strategy Newton follows in concluding that the centripetal force on the Moon, once a correction is made for the perturbing effects of the Sun, is inverse-square.
    step1: TBD
    step2: TBD
