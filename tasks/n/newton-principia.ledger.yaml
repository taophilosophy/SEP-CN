      > I have now set forth the two major cases of attractions, namely when the centripetal forces decrease in the squared ratio of the distances or increase in the simple ratio of the distances, causing bodies to revolve in conics, and composing centripetal forces of spherical bodies that decrease or increase in proportion to the distance from the center according to the same law — which is worthy of note. [**P**, 599][^note-34]
