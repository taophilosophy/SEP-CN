      Newton presents his first two laws as already “accepted by mathematicians and confirmed by experiments of many kinds” [**P**, 424].[^note-24] For the third law, by contrast, he offers a variety of forms of support, including experiments on impact. One important element that becomes clear in his discussion of evidence for the third law — and also in Corollary 2 — is that Newton's impressed force is the same as static force that had been employed in the theory of equilibrium of devices like the level and balance for some time. Newton is not introducing a novel notion of force, but only extending a familiar notion of force. Indeed, Huygens too had employed this notion of static force in his *Horologium Oscillatorium* when he identified his centrifugal force with the tension in the string (or the pressure on a wall) retaining an object in circular motion, in explicit analogy with the tension exerted by a heavy body on a string from which it is dangling. Huygens's theory of centrifugal force was going beyond the standard treatment of static forces only in its inferring the magnitude of the force from the motion of the body in a circle. Newton's innovation beyond Huygens was first to focus not on the force on the string, but on the correlative force on the moving body, and second to abstract this force away from the mechanism by which it acts on the body. Three steps were thus involved in passing from the already familiar static forces to the more abstract Newtonian “dynamic” forces, one by Huygens and two by Newton.[^note-25]
    step1: |-
      牛顿把前两条定律表述为已经“为数学家所接受，并得到许多种实验的证实” （**P**, 424）。[^note-24] 相比之下，对于第三定律，他提供了多种支持形式，包括碰撞实验。在他对第三定律证据的讨论中——以及在推论 2 中——变得清楚的一个重要因素是：牛顿的 **外加力**，与天平、杆秤这类装置的平衡理论中早已使用的静力，是同一个力。牛顿并未引入一个新的力的概念，而只是扩展了一个熟悉的力的概念。事实上，惠更斯在《摆钟论》中也使用了这种静力概念：他把自己的离心力等同于使物体作圆周运动的绳中张力（或对墙的压力），并明确类比于重物对悬挂它的绳子所施加的张力。惠更斯的离心力理论超出静力标准处理的唯一之处，在于从物体在圆中的运动推出力的大小。牛顿超出惠更斯的创新，第一是不再关注绳上的力，而关注运动物体上的相关力；第二是把这种力从它作用于物体的机制中抽象出来。因此，从已经熟悉的静力过渡到更抽象的牛顿“动力学”力，涉及三步：惠更斯一步，牛顿两步。[^note-25]
