      Unfortunately, pendulum-decay turned out not to be as well behaved a phenomenon as Newton anticipated it was going to be while he was working on the first edition. The problem, as he later realized, was that he had to let the pendulum swing many times in order to measure the rate of decay, and in the process it gave rise to a “to and fro” motion in the surrounding fluid, so that the *relative* velocity between the bob and the fluid, which is the velocity that matters in resistance, could not be determined or controlled. The General Scholium following Section 6[^note-39] reports detailed decay-rate data for an impressive range of experiments, including different size bobs in air and bobs moving as well in water and mercury. The reader is also shown in detail how to proceed from the data in each case to a polynomial as above defining the resistance force. Any reader who worked through the data discovered what Newton knew, but was less than candid about: no polynomial fit the data. The experiments did clearly indicate that resistance forces involve no power of velocity greater than 2, and they provided good evidence that a velocity squared effect was dominant, even to the extent of masking any effect involving some other power. Newton also managed to extract some highly qualified evidence that the velocity squared effect varies as the density of the fluid and the frontal area (that is, the square of the diameter) of spheres.
    step1: |-
      不幸的是，摆衰减并不像牛顿在第一版工作中所预期的那样行为良好。他后来意识到，问题在于他必须让摆摆动许多次才能测量衰减率，而在此过程中会在周围流体中引起“往复”运动，使得摆锤与流体之间的 **相对** 速度——即阻力中真正起作用的速度——无法确定或控制。第六节之后的《总释》[^note-39] 报告了一系列令人印象深刻实验的详细衰减率数据，包括不同大小的摆锤在空气中的实验，以及摆锤在水和水银中的运动。读者还被详细告知如何从每种情形的数据得出如上定义阻力的多项式。任何认真处理这些数据的读者都会发现牛顿知道但不够坦率的事：没有多项式能拟合数据。实验确实清楚表明，阻力不涉及高于 2 次幂的速度；它们也提供了良好证据，表明速度平方效应占主导，甚至掩盖了任何涉及其他幂次的效应。牛顿还设法提取了一些极有保留的证据，表明速度平方效应随流体密度和球体的迎风面积（即直径的平方）变化。
