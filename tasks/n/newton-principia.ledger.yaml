      末了，第二段与第三段合在一起，不仅指出开普勒式运动只是对真实运动的近似，而且提醒人们注意把开普勒等人发表的轨道当作关于行星系统之主张的证据所存在的潜在陷阱。例如，如果真实运动如此复杂，那么所有不同的计算进路都达到可比精度就不足为奇，因为它们充其量都只是近似成立。同样，计算轨道的成功也不能作为反对笛卡尔涡旋的依据，因为涡旋所蕴含的不规则性不能简单地被打发掉。由此唤起的幽灵，正是牛顿在早先关于光的论文之争中曾反对过的那个：太多假设都能被弄得适合同一批数据。[^note-10] 更糟的是，可成立的假设之多，是从 16 世纪末以来一直困扰数学天文学作为一门学科的那个幽灵。[^note-11] 因此，“计算出的轨道充其量只能是近似”这一结论，会被看作提出了真理与精确性非数学天文学所能企及的可能性。《原理》之所以包含远超《论运动》论文的内容，主要原因就是牛顿力图得出有资格被称为精确而真实的结论，尽管实际运动极其复杂。
