      Propositions 25 through 35 derive quantitative results for three lunar inequalities — the systematic departure from the area rule called “the variation,” the 18 year motion of the line of nodes, and the fluctuating inclination of the orbit — from the perturbing action of the Sun. For all three Newton starts with a circular orbit, so these too involve departures from an idealization. The values he obtained for the different components of the solar perturbing force in Proposition 25 and subsequently, as needed, were accurate to several significant figures. All three derivations, which are mathematically demanding, were successful in obtaining agreement with the values of the inequalities obtained from observation, especially so the derivation for the recession of the lunar nodes, for which he achieves agreement with the known value to better than 98 percent. (Newton must have been mystified by the failure of his seemingly parallel derivation of the 9 year precession of the line of apsides to achieve better than 50 percent agreement.)
    step1: |-
      命题 25 至 35 从太阳的摄动作用定量推导了三个月球不等项——对面积规则的系统偏离（称为“二均差”）、交点线 18 年的运动，以及轨道倾角的波动。对这三者，牛顿都从圆轨道出发，因此它们也涉及对理想化的偏离。他在命题 25 中以及随后按需得到的太阳摄动力各分量的值，精确到若干有效数字。所有这些数学要求很高的推导，都成功与观测所得不等项的值取得吻合，尤其是月球交点退行的推导，其与已知值的吻合优于 98%。（牛顿一定对自己看似平行的拱线 9 年进动推导未能达到优于 50% 的吻合感到困惑。）
