      This analysis of the “deduction” of universal gravity does not answer two further complaints lodged against it. First, in concluding that the centripetal force acting on the Moon is inverse-square, Newton grants that the precession of the lunar orbit implies an exponent of -2 and 4/243 for the force rather than exactly -2, but then claims that the small fraction can be accounted for by the perturbing action of the Sun's gravity. But the magnitude for the action of the Sun that he gives in Proposition 3[^note-49] is twice the value he later in Book 3 indicates is the correct value. This lacuna was not resolved by Alexis-Claude Clairaut until two decades after Newton died. Second, when Newton invokes the third law of motion in the corollaries to Proposition 5, he is tacitly assuming that, for example, Jupiter and the Sun are, in effect, directly interacting. In other words, he is ignoring the alternative favored by Huygens that some unseen medium is effecting the centripetal force on Jupiter, a medium that can in principle absorb the linear momentum which Newton is assuming is being transferred to the Sun. Huygens may well have perceived this lacuna, to which Cotes explicitly called Newton's attention while he was preparing the second edition.[^note-50]
    step1: |-
      这一对万有引力“推导”的分析，并未回答针对它的另外两项抱怨。第一，在得出作用于月球的向心力为平方反比的结论时，牛顿承认月球轨道的进动蕴含力的指数为 -2 又 4/243，而非恰好 -2；但他随后声称，这一小部分可由太阳引力的摄动作用解释。然而，他在命题 3 中给出的太阳作用大小[^note-49] 是他在第三卷后文所指出正确值的两倍。这个缺陷直到牛顿去世二十年后才由亚历克西-克洛德·克莱罗解决。第二，当牛顿在命题 5 的推论中援引第三定律时，他暗中假设例如木星和太阳实际上直接相互作用。换言之，他忽略了惠更斯所偏好的替代方案：某种看不见的介质正在对木星施加向心力；这种介质原则上可以吸收牛顿假设被转移给太阳的线动量。惠更斯很可能察觉到了这个缺陷，而科茨在准备第二版时明确提请牛顿注意。[^note-50]
