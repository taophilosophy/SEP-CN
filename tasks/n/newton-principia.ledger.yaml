      Section 10 includes a philosophically important result that has gone largely unnoticed in the literature on the *Principia*. Newton's argument that terrestrial gravity extends to the Moon depends crucially on Huygens's precise measurement of the strength of surface gravity. This theory-mediated measurement was based on the isochronism[^note-36] of the cycloidal pendulum under uniform gravity directed in parallel lines toward a flat Earth. But gravity is directed toward the center of the (nearly) spherical Earth along lines that are not parallel to one another, and according to Newton's theory it is not uniform. So, does Huygens's measurement cease to be valid in the context of the *Principia*? Newton recognized this concern and addressed it in Propositions 48 through 52 by extending Huygens's theory of the cycloidal pendulum to cover the hypocycloidal pendulum — that is, a cycloidal path produced when the generating circle rolls along the inside of a sphere instead of along a flat surface. Proposition 52 then shows that such a pendulum, although not isochronous under inverse-square centripetal forces, is isochronous under centripetal forces that vary linearly with the distance to the center. Insofar as gravity varies thus linearly below the surface in a uniformly dense sphere, the hypocycloidal pendulum is isochronous up to the surface, and hence it can in principle be used to measure the strength of gravity. A corollary to this proposition goes further by pointing out that, as the radius of the sphere is increased indefinitely, its surface approaches a plane surface and the law of the hypocycloidal asymptotically approaches Huygens's law of the cycloidal pendulum. This not only validates Huygens's measurement of surface gravity, but also provides a formula that can be used to determine the error associated with using Huygens's theory rather than the theory of the hypocycloidal pendulum.
    step1: |-
      第十节包含一个在《原理》文献中大多未被注意的、具有哲学重要性的结果。牛顿关于地面重力延伸到月球的论证，关键依赖于惠更斯对表面重力强度的精确测量。这一受理论中介的测量，基于摆线摆在平行指向平坦地球的均匀重力下的等时性。[^note-36] 但重力沿并不彼此平行的直线指向（近乎）球形地球的中心，而且按照牛顿的理论，它并非均匀。那么，惠更斯的测量在《原理》的语境中是否失效？牛顿意识到这一关切，并在命题 48 至 52 中通过把惠更斯的摆线摆理论扩展到内摆线摆来处理它——所谓内摆线摆，是生成圆沿球体内侧而非沿平面滚动时产生的摆线路径。命题 52 随后表明：这种摆在平方反向心力下虽然不是等时的，但在随到中心距离线性变化的向心力下是等时的。由于在均匀密度球体中重力在表面以下如此线性变化，内摆线摆在表面以内是等时的，因此原则上可用于测量重力强度。该命题的一条推论进一步指出：当球体半径无限增大时，其表面趋近平面，内摆线摆的定律渐近趋近惠更斯的摆线摆定律。这不仅验证了惠更斯对表面重力的测量，还提供了一个公式，可用于确定使用惠更斯理论而非内摆线摆理论所关联的误差。
