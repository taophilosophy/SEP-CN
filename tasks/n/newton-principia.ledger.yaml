      [^note-3]: Two changes have been made to the Cohen-Whitman translation of the last sentence, which in Latin reads, “*Et satis est quod gravitas revera existat, & agat secundum leges a nobis expositas, & ad corporum caelestium & maris nostril motus omnes sufficiat.”* First, the phrase “to explain,” no counterpart of which occurs in the Latin, has been dropped from the last clause and second, the three verbs *existat*, *agat*, and *sufficiat* have been translated “should exist,” should act,“ and ”should suffice,“ for all three are in the subjunctive in the Latin.
    step1: |-
      [^note-3]: 对最后一句的 Cohen-Whitman 译文作了两处改动，该句拉丁文为：“*Et satis est quod gravitas revera existat, & agat secundum leges a nobis expositas, & ad corporum caelestium & maris nostril motus omnes sufficiat.*”第一，最后一小句中删去了“to explain”（解释）一语，拉丁文并无对应词；第二，三个动词 *existat*、*agat* 与 *sufficiat* 译为“should exist”“should act”与“should suffice”，因为三者在拉丁文中均为虚拟式。
    step2: |-
      [^note-3]: 对最后一句的 Cohen-Whitman 译文作了两处改动，该句拉丁文为：“*Et satis est quod gravitas revera existat, & agat secundum leges a nobis expositas, & ad corporum caelestium & maris nostril motus omnes sufficiat.*”第一，最后一小句中删去了“to explain”（解释）一语，拉丁文并无对应词；第二，三个动词 *existat*、*agat* 与 *sufficiat* 译为“should exist”“should act”与“should suffice”，因为三者在拉丁文中均为虚拟式。
