      The thrust of the argument in Section 9 is that fluid vortices are incompatible with Kepler's area and 3/2 power rules. The argument has two shortcomings, both of them recognized by Newton's opponents at the time. First, the entire argument is predicated on a hypothesis: “The resistance that arises from want of slipperiness of the parts of the fluid is, *ceteris paribus*, proportional to the velocity with which the parts of the fluid are separated from one another.” Fluids of this sort are now called “Newtonian.” The absence of evidence for the hypothesis left Newton's opponents free to adopt other rules for the velocity gradient in a vortex generated around a rotating cylinder or sphere, rules that could undercut his conclusions. Second, his analysis of the vortex generated around a rotating cylinder or sphere involves fundamentally wrong physics: it defines steady state in terms of a balance of forces instead of torques across each shell element comprising the vortex. To use Johann Bernoulli's words from 1730, Newton “completely neglects to take into account the action of the lever, the consideration of which however is absolutely necessary here, it being obvious that the same force, applied along the tangent to the circumference of a large wheel, has a greater efficacity for making it turn than it has when applied to the circumference of a smaller radius.”[^note-38] (This is not the only place in the *Principia* where it is clear that Newton had not thought through the mechanics of angular motion.)
    step1: |-
      第九节论证的要旨是：流体涡旋与开普勒的面积规则和 3/2 幂规则不相容。这一论证有两个缺陷，当时牛顿的对手都认识到了。第一，整个论证建立在一个假设上：“由于流体各部分缺乏滑性而产生的阻力，在其他条件不变时，与流体各部分彼此分离的速度成正比。”这类流体今天被称为“牛顿流体”。该假设缺乏证据，使牛顿的对手可以自由采用其他关于旋转圆柱或球体周围涡旋中速度梯度的规则，而这些规则可能削弱他的结论。第二，他对旋转圆柱或球体周围涡旋的分析涉及根本错误的物理学：它以力的平衡而非跨越构成涡旋的每个壳层的力矩平衡来定义稳态。用约翰·伯努利 1730 年的话说，牛顿“完全忽略了对杠杆作用的考虑，然而在这里这种考虑是绝对必要的；显然，同一个力沿大轮圆周切线施加时，比施加于较小半径圆周时更能使之转动。”[^note-38]（这并不是《原理》中唯一清楚表明牛顿未曾透彻思考角运动力学的地方。）
