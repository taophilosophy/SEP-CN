      In one curious respect that Newton mentions only once in passing, the theory does not cover all “conditions that may be supposed.” Newton's theory treats centripetal forces that vary only with the distance from the force center, that is, ones for which the force on two bodies equally distant from that center is always the same. It does not treat centripetal forces that vary with *θ* and *φ*, the two angular components of (*r*, *θ*, *φ*) spherical coordinates. This is notable for two reasons. First, the central forces arising in Cartesian vortices would almost certainly have varied with both of these angular components, and hence Newton is tacitly begging a question. Second, as Newton himself realized and noted in Section 13 of Book 1, gravity around a spheroid does not vary simply as 1/*r*², but must also vary with latitude.[^note-33] From Newton's point of view, therefore, gravity around Jupiter and the Earth, and surely the Sun as well, does not vary simply as 1/*r*². This is one of many often ignored cues pointing to the extent to which the evidential reasoning in the *Principia* has to be more intricate and subtle than was appreciated at the time, or for that matter even now.
    step1: |-
      在一个他仅顺带提及一次的奇特方面，这一理论并未覆盖“任何可被设想的条件”。牛顿的理论只处理随到力心距离变化的向心力，也就是说，对于到力心等距的两个物体，力总是相同。它不处理随 (r, θ, φ) 球坐标中两个角分量 θ 与 φ 变化的向心力。这一点值得注意，原因有二。第一，笛卡尔涡旋中产生的中心力几乎肯定随这两个角分量变化，因此牛顿在这里暗中回避了一个问题。第二，正如牛顿本人所意识到并在第一卷第十三节中指出的，椭球体周围的重力并非简单按 1/r² 变化，而必定还随纬度变化。[^note-33] 因此，从牛顿的观点看，木星和地球周围的重力——太阳周围无疑也是如此——并非简单按 1/r² 变化。这是许多常被忽视的线索之一，它们指向：《原理》中的证据推理，其错综与微妙程度远超当时乃至今天人们所认识到的。
