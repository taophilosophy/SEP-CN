      [^note-18]: The philosophical discussion of Newtonian space and time divides across three distinct eras. During most of the eighteenth century, before the extent to which Newton's theory of gravity succeeds in dealing with the actual orbital motions became clear, the burden of proof fell more or less equally on the supporters and critics of Newton. During the nineteenth century the burden of proof fell heavily on Newton's critics. During the twentieth century, following Einsteinian relativity, the discussion, much of it highly sophisticated, has centered on stating with precision the Newtonian assumptions that were in error, as illustrated by the classic philosophical discussion in Stein 1967. For an illuminating examination of the history of the discussion, as well as a very careful analysis of Newton's position, see DiSalle 2006. The position in the text derives from Stein and DiSalle.
    step1: |-
      [^note-18]: 关于牛顿空间与时间的哲学讨论分为三个不同时代。在 18 世纪大部分时间里，在牛顿引力理论处理实际轨道运动究竟成功到什么程度尚未明朗之前，举证责任或多或少平等地落在牛顿的支持者与批评者双方。在 19 世纪，举证责任沉重地落在牛顿的批评者身上。在 20 世纪，随着爱因斯坦相对论的出现，讨论（其中许多极为精细）集中于精确陈述牛顿那些错误的假设，Stein 1967 的经典哲学讨论即为示例。关于这一讨论史的有启发考察，以及对牛顿立场的非常仔细的分析，见 DiSalle 2006。正文中的立场源自 Stein 与 DiSalle。
    step2: |-
