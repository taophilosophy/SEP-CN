      [^note-55]: As Halley observed, if the comet that now bears his name had appeared at regular intervals in the past, these intervals were not precisely 75 years long, but varied from roughly 73 to 77 years. Clairaut provided an explanation for this when he included the gravitational effects of Jupiter and Saturn in his successful calculation of the return of this comet in 1759. The question then arose, however, whether the nearly one-month discrepancy in Clairaut's calculation might not be evidence of some small resistance acting on the comet. Euler subsequently suggested that the unexplained secular motion of the Moon might also be from fluid resistance. So, as historically compelling as Newton's argument was against resisting fluid in space, it did not end all discussion.
