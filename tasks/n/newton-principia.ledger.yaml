      Newton's first two rules of reasoning appeared in the first edition (there labeled as hypotheses[^note-41]), the third rule was added in the second edition, and the fourth rule, in the third edition. These are rules intended to govern evidential reasoning in natural philosophy, akin to rules of deductive reasoning except for their very much not guaranteeing true conclusions from true premises. In particular, Rule 2 authorizes the inference from same effect to same cause, a notoriously invalid inference, and Rule 3 authorizes inductive generalization to all bodies universally of those qualities of bodies “that belong to all bodies on which experiments can be made.” Newton's phrasing carries no suggestion that these rules yield truths or even a high probability of truth. The operative phrase in both Rules 3 and 4, for example, is properly translated “should be taken,” and Rule 4 makes the provisional character of the authorized inferences explicit:
    step1: |-
      牛顿的前两条推理法则出现在第一版中（当时标为假设[^note-41]），第三条法则在第二版中增补，第四条法则在第三版中增补。这些法则是用来支配自然哲学中证据推理的规则，类似于演绎推理规则，只是它们远不能保证从真前提得出真结论。特别是，法则 2 授权从相同结果推断相同原因——这是一个出了名的无效推理；法则 3 授权把物体“一切可对其做实验的物体都具有的”性质归纳地推广到一切物体。牛顿的措辞并未暗示这些法则产生真理，甚至不暗示产生高概率真理。例如，法则 3 和法则 4 中的关键短语应恰当地译为“应被当作”；法则 4 明确表达了所授权推断的暂定性质：
