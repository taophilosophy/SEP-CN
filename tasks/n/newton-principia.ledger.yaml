      move from P to Q, and hence the force varies as QR/*t*². But the time is proportional to PQ divided by the velocity *v*, and in the limit as Q approaches P, PQ approaches PR, so that *t*² becomes equal to PR²/*v*². Proposition 36 of Book 3 of Euclid entails that in this limit PR² is equal to the product of QR and twice the radius SP, and hence the force for uniform motion in a circle varies as *v*²/SP or *v*²/*r*.[^note-35]
    step1: TBD
