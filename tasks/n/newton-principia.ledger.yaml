      Section 9 includes another often overlooked result that is pivotal to the evidential reasoning for universal gravity in Book 3. Proposition 45 applies the result on precessing orbits mentioned earlier to the special case of nearly circular orbits, that is, orbits like those of the then known planets and their satellites. This proposition establishes that such orbits, under purely centripetal forces, are stationary — that is, do not precess — if and only if the centripetal force governing them is *exactly* inverse-square. It does this by deriving a formula relating the exponent *n* in the force law to the angle *θ* between the point where the orbiting body is furthest from the force center to the point where it is nearest, that is, the apsidal angle: *n* = (180/*θ*)²-3. (To illustrate, if the apsidal angle is 180 degrees, as in a Keplerian ellipse, then the exponent in the force law is -2, and if the apsidal angle is 90 degrees, as in an ellipse for which the force center is in the center, the exponent is +1.) This result is striking in three ways. First, insofar as the cumulative effect of even a very small precession is detectable after several revolutions, this formula turns the rate of precession (2*θ* per revolution) into a sensitive measure of the exponent in the force law. Second, it yields a conditional beyond “*If the orbit is stationary, then the centripetal force is inverse-square*,” namely, “*If the orbit is nearly stationary, then the centripetal force is nearly inverse-square*.” Using Newton's preferred phrasing, *quam proxime* (literally, “most nearly as possible”), this latter conditional has an “If…*quam proxime*, then…*quam proxime*” form. Newton illustrates this by taking the mean precession rate of the lunar orbit, 3 degrees per revolution, to conclude that the exponent for the net centrifugal force acting on the Moon is -2 and 4/243. Third, even when an orbit does precess, once such a fractional departure of the exponent from -2 is shown to result from the perturbing effect of outside bodies, then one can still conclude that the force toward the central body is exactly -2. This is precisely the strategy Newton follows in concluding that the centripetal force on the Moon, once a correction is made for the perturbing effects of the Sun, is inverse-square.
    step1: |-
      第九节包含另一个常被忽视、却对第三卷万有引力证据推理至关重要的结果。命题 45 把前文提到的进动轨道结果应用于近乎圆形轨道的特殊情形，即当时已知行星及其卫星那样的轨道。该命题确立：这类轨道在纯向心力下是静止的——即不进动——当且仅当支配它们的向心力 **恰好** 是平方反比。为此，它推导出一个公式，把力律中的指数 n 与轨道物体离力心最远点到最近点之间的夹角 θ（即拱点角）联系起来：n = (180/θ)² - 3。（举例说，如果拱点角为 180 度，如开普勒椭圆，则力律中的指数为 -2；如果拱点角为 90 度，如力心位于中心的椭圆，则指数为 +1。）这一结果在三个方面引人注目。第一，既然即便很小的进动在若干圈后其累积效应也可被察觉，这个公式就把进动率（每圈 2θ）变成力律指数的一个灵敏量度。第二，它产生了一个超出“如果轨道静止，则向心力为平方反比”的条件句，即“如果轨道近乎静止，则向心力近乎平方反比”。用牛顿偏好的说法 *quam proxime*（字面意思是“尽可能接近地”），后一个条件句具有“如果……*quam proxime*，那么……*quam proxime*”的形式。牛顿以月球轨道的平均进动率（每圈 3 度）为例，得出结论：作用于月球的净离心力的指数为 -2 又 4/243。第三，即便轨道确实进动，一旦表明指数对 -2 的这种分数偏离源于外部物体的摄动效应，人们仍可得出结论：指向中心物体的力恰好为 -2。这正是牛顿在得出“校正太阳摄动效应后，作用于月球的向心力为平方反比”这一结论时所遵循的策略。
