      The “deduction” of the law of universal gravity from the phenomena in the first eight propositions of Book 3 has provoked a great deal of controversy in the philosophical literature over the last century or so.[^note-42] At the heart of this controversy is the challenge posed by Pierre Duhem: how can a deduction proceed from premises (the planets sweep out equal areas in equal times and their orbits are stationary) to a conclusion, the law of gravity, that then implies that the premises are false (the planets do not sweep out equal areas in equal times and the orbits are not stationary, but instead precess)?[^note-43] The answer is simple: Newton's reasoning is approximative. He is using “if, then” statements that have been shown in Book 1 to hold in “if … *quam proxime*, then … *quam proxime*” form to infer conclusions from premises that hold at least *quam proxime* over a restricted period of time. Of course, this means that the deduction shows only that the conclusions, most notably the law of gravity, hold *quam proxime* over the restricted period of time for which the premises hold. The Rules of Reasoning then license the conclusion to be taken exactly, without restriction of space or time. The conclusions, so taken, do indeed then show that the premises hold only *quam proxime*, and not exactly. This conclusion in no way contradicts the premises.
    step1: TBD
    step2: TBD
  - id: 105
    kind: body
    source: |-
      Recognizing that Newton's reasoning is approximative answers another complaint about the “deduction” of universal gravity: Newton invokes the proposition, *if bodies move uniformly in concentric circular orbits whose periods vary as the 3/2 power of the radii, then the centripetal forces acting on these bodies vary as the inverse-square of the radii of the orbits*, knowing full well that observation had established for centuries that the planets do not move uniformly in circular orbits.[^note-44] Newton does indeed invoke this proposition first to conclude (in Prop. 1) that, in modern parlance, there is an inverse-square centripetal acceleration field around Jupiter and Saturn and next to conclude (in Prop. 2) that there is an inverse-square centripetal acceleration field around the Sun.[^note-45] The orbits of the satellites of Jupiter were then considered to be circular, and hence Newton's inference from their motion was not so problematic. While, however, the orbits of Venus, Jupiter, and Saturn were considered to be very nearly circular, the motion in them had been known from before Ptolemy not to be uniform. Newton expressly concedes that his inference of the inverse-square from the 3/2 power rule for the planets is only approximate when, in the very next sentence, he remarks, “But this second part of the proposition is proved with the greatest exactness from the fact that the aphelia are at rest.” The absence of precession, however, can be used to infer the inverse-square only for each orbit individually, not a single, unified inverse-square centripetal acceleration field encompassing all of the orbits. Newton is accordingly using the 3/2 rule for circular orbits to establish that an inverse-square field holds around the Sun to at least a first approximation, and then using the absence of precession of the individual orbits to tighten the approximation.
    step1: TBD
    step2: TBD
  - id: 106
    kind: body
    source: |-
      Interpreting Newton's deduction of universal gravity as an exercise in approximative reasoning answers a further complaint of Duhem's: insofar as the area rule holds only to high approximation, so too do any number of alternatives to it, such as Boulliau's geometric construction, and hence Newton's “deduction” begs the question of why the area rule is to be preferred to these alternatives.[^note-46] This question, however, is irrelevant so long as the conclusion remains in the weak form, the law of gravity holds *quam proxime* for the planets and their satellites over the time period for which observations have shown the phenomena to hold *quam proxime*. The phenomena really are sufficient to reach the conclusion in this weak form. So, the complaint has bite only when the law of gravity is taken to be exact. But there, however, Newton does provide a response to it when he concludes in Propositions 13 and 14 that the planets *would* describe areas exactly proportional to the times in stationary orbits if “the Sun *were* at rest and the remaining planets did not act upon one another.”[^note-47] The reason, then, why the phenomena from which Newton proceeded in the deduction have claim to being preferred to alternatives to them is that the theory deduced from them, when taken to hold exactly, identifies circumstances under which the phenomena would hold exactly, as well. That this be the case amounts to a requirement on the deduction from phenomena: the leap to taking the law of gravity as exact is justified only if it yields circumstances in which the phenomena from which it was inferred *would* hold exactly.[^note-48]
