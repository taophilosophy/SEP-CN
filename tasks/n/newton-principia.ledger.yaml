    source: |-
      No work of science has drawn more attention from philosophers than Newton's *Principia*. The reasons for this, however, and consequently the focus of the attention have changed significantly from one century to the next. During the 20ᵗʰ Century philosophers have viewed the *Principia* in the context of Einstein's new theory of gravity in his theory of general relativity. The main issues have concerned the relation between Newton's and Einstein's theories of gravity and what the need to replace the former with the latter says about the nature, scope, and limits of scientific knowledge. During most of the 18ᵗʰ Century, by contrast, Newton's theory of gravity remained under dispute, especially because of the absence of a mechanism — in particular, a contact mechanism — producing gravitational forces. The philosophic literature correspondingly endeavored to clarify and to resolve, one way or the other, the dispute over whether the *Principia* should or should not be viewed as methodologically well founded. By the 1790s Newton's theory of gravity had become established among those engaged in research in orbital mechanics and physical geodesy, leading to the *Principia* becoming *the* exemplar of science at its most successful. Philosophic interest in the *Principia* during the 19ᵗʰ Century therefore came to focus on how Newton had achieved this success, in part to characterize the knowledge that had been achieved and in part to pursue comparable knowledge in other areas of research. Unfortunately, a very large fraction of the philosophic literature in all three centuries has suffered from a quite simplistic picture of the *Principia* itself. The main goal of this entry is to replace that simplistic picture with one that does more justice to the richness of both the content and the methodology of the *Principia*.
    step1: |-
      没有哪部科学著作比牛顿的《原理》更受哲学家关注。然而关注的理由、并因而关注的重心，从一个世纪到另一个世纪已发生显著变化。在 20 世纪，哲学家是在爱因斯坦广义相对论这一新的引力理论背景中看待《原理》的。主要问题涉及牛顿引力理论与爱因斯坦引力理论的关系，以及用后者取代前者的必要性说明了科学知识的本性、范围与限度。相比之下，在 18 世纪大部分时间里，牛顿的引力理论仍处于争论之中，尤其因为缺少一种产生引力的机制，特别是缺少接触机制。哲学文献也相应地努力澄清并解决这一争论：《原理》是否应当被看作在方法论上有充分根据。到 1790 年代，牛顿的引力理论已在从事轨道力学与物理大地测量研究的人中确立起来，这使《原理》成为科学处于最成功状态时的典范。因此，19 世纪对《原理》的哲学兴趣集中到牛顿如何取得这一成功：一部分是为了刻画所获得的知识，一部分是为了在其他研究领域追求类似的知识。不幸的是，三个世纪中很大一部分哲学文献都受制于一幅相当简单化的《原理》图景。本词条的主要目标，是用一幅更公正地对待《原理》内容与方法论之丰富性的图景，取代那幅简单化图景。
    step2: |-
      没有哪部科学著作比牛顿的《原理》更受哲学家关注。但关注的理由，以及由此形成的关注焦点，一个世纪与另一个世纪之间已大不相同。在 20 世纪，哲学家是在爱因斯坦广义相对论这一新的引力理论背景下看待《原理》的。主要问题涉及牛顿引力理论与爱因斯坦引力理论的关系，以及用后者取代前者的需要说明了科学知识的本性、范围与限度。相比之下，在 18 世纪的大部分时间里，牛顿的引力理论仍处于争论之中，尤其是因为不存在产生引力的机制，特别是不存在接触机制。哲学文献也相应地努力澄清并解决如下争论：《原理》是否应当被视为在方法论上有充分根据。到 1790 年代，在从事轨道力学与物理大地测量研究的人当中，牛顿的引力理论已确立起来，这使《原理》成为科学在最成功状态下的典范。因此，19 世纪对《原理》的哲学兴趣集中到牛顿如何取得这一成功：一部分是为了刻画所获得的知识，一部分是为了在其他研究领域追求类似的知识。不幸的是，三个世纪中相当大一部分哲学文献都受制于一幅过于简单的《原理》图景。本词条的主要目标，是用一幅更公正地对待《原理》内容与方法论之丰富性的图景取代那幅简单化图景。
