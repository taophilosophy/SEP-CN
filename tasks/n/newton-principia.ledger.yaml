      Book 1 develops a mathematical theory of motion under centripetal forces. In keeping with the Euclidean tradition, the propositions mathematically derived from the laws of motion are labeled either as theorems or as problems. The theorems all have an “if-then” form, enabling them to authorize inferences of their consequents, given their antecedents.[^note-30] But then so too do the problems in effect have an “if-then” logical form, for the (geometric style) solutions they provide authorize inferences from given information to unknowns. The best way to think of the derived propositions, therefore, is as “inference-tickets.” As such, the propositions fall into three categories: (1) ones that license conclusions about forces from information about motions, (2) ones that license conclusions about motions from information about forces, and (3) ones that license conclusions about (net) forces directed toward whole bodies from information about (contributing) forces directed toward the individual parts of the bodies.
    step1: |-
      第一卷发展了一套关于向心力下运动的数学理论。按照欧几里得传统，从运动定律数学地推出的命题被标为定理或问题。所有定理都具有“如果—那么”的形式，使它们能够在给定前件时授权推出后件。[^note-30] 但问题实际上也具有“如果—那么”的逻辑形式，因为它们所提供的（几何风格）解法授权从给定信息推出未知量。因此，思考这些派生命题的最佳方式，是把它们视为“**推理许可证**”。作为这样的东西，这些命题分为三类：（1）从关于运动的信息授权得出关于力的结论；（2）从关于力的信息授权得出关于运动的结论；（3）从关于指向物体各个部分的（分）力的信息，授权得出关于指向整个物体的（合）力的结论。
