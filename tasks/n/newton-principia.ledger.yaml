      使事情更复杂的是，莱布尼茨 1689 年发表了《论天体运动的原因》，提出一种涡旋理论，其中“行星以一种双重运动运行，该运动由其流体载运球的谐和环流与近心运动组成，仿佛它具有某种吸引的重力，即一种朝向太阳的推动”[**L**, 132]。[^note-16] 莱布尼茨进一步断定：当物体“以谐和环流被带在椭圆（或另一圆锥截线）中，而吸引中心与环流中心同在椭圆的焦点上时，重力的吸引或牵引将正比于环流的平方，或反比于到焦点的半径或距离的平方”[**L**, 137]。于是，《原理》出版后一年半之内，就出现了一种与开普勒运动相竞争的涡旋理论，而它与牛顿的结论——开普勒运动中的向心力是平方反比的——相一致。这使牛顿有理由强化《原理》中反对涡旋的论证。
