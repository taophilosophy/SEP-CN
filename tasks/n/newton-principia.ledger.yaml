      [^note-41]: In classic use the term “hypothesis” marked propositions from which deductions were to be made. During the seventeenth century it came also to mark conjectured theoretical claims. The first edition of Book 3 begins with a list of nine hypotheses that were clearly intended to be propositions from which the deductions of the Book were to be made, and not theoretical conjectures. The shift to “Rules” and “Phenomena” in the second edition clarified the logical structure of the derivation of the law of universal gravity and removed any thought that this derivation gave the law an only hypothetical status. Newton did not entirely abandon the label “hypothesis” in the second and third editions. Section 9 of Book 2, as noted earlier, opens with a Hypothesis, and Proposition 11, asserting that the center of gravity of our planetary system is at rest, is immediately preceded by the Hypothesis, “The center of the system of the world is at rest.”
    step1: |-
      [^note-41]: 在古典用法中，“假设”一词标记的是据以作出演绎的命题。到 17 世纪，它也用来标记推测性的理论主张。第三卷第一版以九条假设的清单开篇，这些假设显然意在作为该卷演绎所据的命题，而非理论猜测。第二版转向“法则”和“现象”，澄清了万有引力定律推导的逻辑结构，并消除了任何认为该推导只赋予该定律假设性地位的想法。牛顿在第二版和第三版中并未完全放弃“假设”这一标签。如前所述，第二卷第九节以一条假设开篇；而断言我们行星系统重心静止的命题 11，其前面紧接的假设是：“世界体系的中心静止。”
    step2: |-
