      [^note-8]: The reasoning behind Newton's conclusion does not presuppose the law of gravity, for all Newton required was something established in the original ”De Motu“ tract, namely that the relative strengths of the centripetal accelerations (at equal distances) toward Saturn, Jupiter, the Earth, and the Sun vary as the invariant ratio between the squares of the periods and cubes of the mean distances of the bodies orbiting each. Textual evidence from the other scholium added to ”De Motu“ — the one on resistance — shows that Newton did not yet have the law of gravity, for he had not yet formulated the concept of mass. For details, see G. E. Smith, ”How Did Newton Discover Universal Gravity?“ in *Beyond Hypothesis: Newton's Experimental Philosophy*, *The St. John's Review*, vol. xlv, no. 2 (1999), pp. 32-63).
    step1: |-
      [^note-8]: 牛顿结论背后的推理并不预设引力定律，因为牛顿所需的只是原“论运动”论文中已确立的东西，即指向土星、木星、地球和太阳的向心加速度（在等距处）的相对强度，随绕各自天体运行物体的周期平方与平均距离立方之间的不变比率变化。增补到“论运动”的另一篇附释——论阻力那篇——的文本证据表明，牛顿当时尚未掌握引力定律，因为他尚未形成质量概念。细节见 G. E. Smith，“How Did Newton Discover Universal Gravity?”，载 *Beyond Hypothesis: Newton's Experimental Philosophy*，*The St. John's Review*，第 xlv 卷第 2 期（1999），第 32–63 页。
    step2: |-
      [^note-8]: 牛顿结论背后的推理并不预设引力定律，因为牛顿所需的只是原“论运动”论文中已确立的东西，即指向土星、木星、地球和太阳的向心加速度（在等距处）的相对强度，随绕各自天体运行物体的周期平方与平均距离立方之间的不变比率变化。增补到“论运动”的另一篇附释——论阻力那篇——的文本证据表明，牛顿当时尚未掌握引力定律，因为他尚未形成质量概念。细节见 G. E. Smith，“How Did Newton Discover Universal Gravity?”，载 *Beyond Hypothesis: Newton's Experimental Philosophy*，*The St. John's Review*，第 xlv 卷第 2 期（1999），第 32–63 页。
