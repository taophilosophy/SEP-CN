      The *Principia* opens with a section called “Definitions” that includes Newton's discussion of absolute space, time, and motion. No part of the *Principia* has received more discussion by philosophers over the three centuries since it was published. Unfortunately, however, a tendency not to pay close attention to the text has caused much of this discussion to produce unnecessary confusion.[^note-18]
