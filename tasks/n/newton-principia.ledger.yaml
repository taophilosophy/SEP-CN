      Newton's Proposition 6 generalizes this result to not necessarily uniform motion *under centripetal forces* along an arbitrary trajectory in which equal areas are swept out in equal times with respect to S, in accord with Proposition 1 of Book 1. The central force at P is again proportional to the displacement from the tangent QR over a short increment of time divided by the square of this time; but now the time is proportional not to the arc PQ, but to the area swept out, which in the limit as Q approaches P, is the triangular area SPxQT/2. Therefore, to keep a body moving along a given non-circular trajectory, the centripetal force must vary along the trajectory as (1/SP²) — that is, 1/*r*² — times the limit of (QR/QT²) as Q approaches P. In the second edition Newton adds a corollary that displays another way of seeing the result as a generalization of uniform circular motion: the centripetal force along the trajectory must everywhere vary as *v*²/(*ρ*sinSPR), where *ρ* is the radius of curvature of the trajectory at P. With this, the body can be viewed as driven from one instantaneous circle to the next by the component of force tangential to the motion, a component that disappears in the case of uniform circular motion.
    step1: |-
      牛顿的命题 6 把这一结果推广到沿任意轨迹、在 **向心力** 作用下未必匀速的运动；该轨迹相对于 S 在相等时间内扫过相等面积，符合第一卷命题 1。P 处的中心力同样与短时间增量内偏离切线的位移 QR 成正比，除以该时间的平方；但现在时间不与弧 PQ 成正比，而与扫过的面积成正比；当 Q 趋近 P 时，该面积是三角形面积 SP×QT/2。因此，要使物体沿给定非圆轨迹运动，向心力沿轨迹必须按 (1/SP²)——即 1/r²——乘以 Q 趋近 P 时 (QR/QT²) 的极限而变化。在第二版中，牛顿增添了一条推论，以另一种方式表明这一结果是匀速圆周运动的推广：沿轨迹的向心力处处必须按 v²/(ρ sinSPR) 变化，其中 ρ 是轨迹在 P 处的曲率半径。由此，可以把物体视为被与运动相切的力分量从一个瞬时圆驱动到下一个瞬时圆；而在匀速圆周运动情形中，这一分量消失。
