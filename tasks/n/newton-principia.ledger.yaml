      Complicating the matter further was the publication in 1689 of Leibniz's “Essay on the causes of celestial motions,” which offered a vortex theory in which “*a planet moves with a double motion composed of the harmonic circulation of its fluid deferent orb, and the paracentric motion*, as if it had a certain gravity of attraction, namely an impulsion *towards the Sun*” [**L**, 132].[^note-16] Leibniz further concluded that when the body “*is carried in an ellipse* (or another conic section) *with a harmonic circulation, and the centre both of attraction and of circulation is at the focus of the ellipse, then the attractions or solicitations of gravity will be directly as the squares of the circulations, or inversely as the squares of the radii or distances from the focus*” [**L**, 137]. So, within a year and a half of the publication of the *Principia* a competing vortex theory of Keplerian motion had appeared that was consistent with Newton's conclusion that the centripetal forces in Keplerian motion are inverse-square. This gave Newton reason to sharpen the argument in the *Principia* against vortices.
    step1: |-
      使情况更加复杂的是，莱布尼茨于 1689 年发表了《论天体运动的原因》，其中提出一种涡旋理论：在该理论中，“**行星以双重运动运行，由其所处流体载运轨道的谐和环流与近心运动组成**，仿佛它具有某种吸引重力，即一种 **朝向太阳** 的推动” （**L**, 132）。[^note-16] 莱布尼茨进一步得出结论：当物体“**以谐和环流沿椭圆**（或其他圆锥曲线）**运行，且吸引中心与环流中心都位于椭圆的焦点时，重力的吸引或牵引（solicitations）将直接与环流的平方成正比，或与到焦点的半径或距离的平方成反比**” （**L**, 137）。因此，在《原理》出版后一年半内，就出现了一种与牛顿结论相容的、关于开普勒运动的竞争性涡旋理论——牛顿的结论是，开普勒运动中的向心力为平方反比。这使牛顿有理由锐化《原理》中反对涡旋的论证。
