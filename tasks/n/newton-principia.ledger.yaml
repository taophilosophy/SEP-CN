      The view is commonplace that what Newton did was to put forward his theory of gravity to explain Kepler's already established “laws” of orbital motion; and the universality of the law of gravity then ended up explaining the deviations from Keplerian motion by attributing them to gravitational interaction of the planets. This is wrong on several counts, the most immediate of which is that Kepler's “laws” were by no means established before the *Principia*. The rules for calculating orbital motion that Kepler put forward in the first two decades of the seventeenth century had indeed achieved a spectacular gain in accuracy over anything that had come before. Kepler's rules, however, did not yield comparable accuracy for the motion of the Moon, and even in the case of the planets the calculated locations were sometimes off by as much as a fourth of the width of the Moon. More importantly, by 1680 several other approaches to calculating the orbits had been put forward that achieved the same level of not quite adequate accuracy as Kepler's. In particular, Newton was familiar with seven different approaches to calculating planetary orbits, all at roughly the same accuracy. Only two of these, Kepler's and Jeremiah Horrocks's, used Kepler's area rule — planets sweep out equal areas in equal times with respect to the Sun — to locate planets along their trajectories. Ismaël Boulliau and, following him, Thomas Streete (from whose *Astronomia Carolina* Newton first learned orbital astronomy) replaced the area rule with a geometric construction. Vincent Wing had adopted still another geometric construction in the late 1660s after having earlier used a point of equal angular motion oscillating about the empty focus of the ellipse; and Nicolaus Mercator in 1676 added still a further geometric construction.[^note-4] Of these six alternative approaches, only Horrocks and, following him, Streete, took Kepler's 3/2 power rule — the periods of the planets vary as the square root of the cube of their mean distances from the Sun — seriously enough to use the periods rather than positional observations to determine their mean distances.[^note-5]
    step1: |-
      有一种流俗之见：牛顿所做的，就是把他的引力理论提出来，以解释开普勒已经确立的轨道运动“定律”；而引力定律的普遍性最终解释了与开普勒运动的偏离，办法是把这些偏离归因于诸行星的引力相互作用。这在好几处都是错的，其中最直接的是：开普勒的“定律”在《原理》之前绝非已经确立。开普勒在 17 世纪头二十年提出的计算轨道运动的规则，确实比以往任何东西在精度上都取得了惊人的提高。但开普勒的规则并未对月球运动给出可比的精度，即便在行星的情形中，计算出的位置有时也偏差达月球宽度的四分之一。更重要的是，到 1680 年，已有人提出若干其他计算轨道的进路，它们达到了与开普勒同样水平、但同样并不完全够用的精度。尤其是，牛顿熟悉七种不同的计算行星轨道的进路，精度都大致相同。其中只有两种，即开普勒的与杰里迈亚·霍罗克斯的，用开普勒的面积规则——行星相对于太阳在相等时间内扫过相等面积——来沿轨迹确定行星的位置。伊丝玛埃尔·布利奥以及追随他的托马斯·斯特里特（牛顿最初正是从后者的《卡罗来纳天文学》学会轨道天文学的）用几何作图取代了面积规则。文森特·温在 1660 年代晚期采用了又一种几何作图，此前他曾用过一个绕椭圆空焦点摆动的等角运动点；尼古劳斯·梅卡托在 1676 年再添一种几何作图。[^note-4] 在这六种替代进路中，只有霍罗克斯以及追随他的斯特里特认真到用开普勒的 3/2 次幂规则（行星周期随其到太阳平均距离的立方之平方根变化）以周期而非位置观测来确定平均距离。[^note-5]
