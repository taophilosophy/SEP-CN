      牛顿起初计划写一部两卷本的著作：第一卷由从运动定律数学地推出的命题组成，其中包括少数关于阻力作用下运动的命题；第二卷按笛卡尔《原理》的方式写作甚至排版，用这些命题来展开世界体系。到 1686 年中，牛顿已改为一卷三册的结构，第二卷专门讨论阻性介质中的运动。看来使他相信这一主题需有单独一卷的，是摆的衰减实验有望让他测量阻力随速度的变化。[^note-14] 当胡克就平方反比力提出优先权问题时，牛顿放弃了最后一卷原来的版本，改为以一系列数学论证的命题来呈现世界体系，其中许多命题对读者的要求远高于原版本中的任何内容。原版“世界体系”在牛顿去世后的次年付印。起初那一卷的完整文本始终没有被发现。
