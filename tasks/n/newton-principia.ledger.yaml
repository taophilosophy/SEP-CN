      The first segment highlights a further component of the historical context in which the *Principia* was written and read. Galileo's discovery of the phases of Venus in 1613 had provided decisive evidence against the Ptolemaic system,[^note-6] but it could not provide grounds favoring the Copernican over the Tychonic system. In the latter, Mercury, Venus, Mars, Jupiter and Saturn circumnavigate the Sun, and the Sun circumnavigates the Earth, with the consequence that these seven bodies are at all times in the same position in relation to one another as they are in the Copernican system. Whether any decisive empirical grounds could be found favoring the Copernican over the Tychonic system became one of the most celebrated issues of the seventeenth century. Kepler, Galileo, and Descartes all published major books in the first half of the century purporting to resolve this issue,[^note-7] Kepler and Descartes basing their arguments on the physical mechanism each had proposed as governing the orbital motion. Nevertheless, the leading observational astronomer of the second half of the century, G. D. Cassini, was a Tychonist. In the first segment of the “Copernican Scholium” Newton identifies the center of gravity of the planetary system as the appropriate point to which all the motion should be referred — the technical issue behind the issue over the two systems — and then announces that the centripetal forces identified in the text of “De Motu” as governing the orbital motion open the way to establishing a slightly qualified form of the Copernican system.[^note-8] Newton's discovery of this line of reasoning was surely a major factor urging him on to the *Principia*.
    step1: |-
      第一段凸显了《原理》写作与阅读之历史语境的又一个组成部分。伽利略 1613 年发现金星位相，为反对托勒密体系提供了决定性证据，[^note-6] 但它无法提供支持哥白尼体系而非第谷体系的理由。在第谷体系中，水星、金星、火星、木星和土星绕太阳运行，而太阳绕地球运行；其结果是，这七个天体在彼此关系中的位置，在任何时候都与哥白尼体系中的位置相同。能否找到决定性的经验根据来支持哥白尼体系而非第谷体系，成为 17 世纪最著名的问题之一。开普勒、伽利略和笛卡尔都在该世纪上半叶出版了力图解决这一问题的重要著作，[^note-7] 其中开普勒和笛卡尔把论证建立在各自提出的、支配轨道运动的物理机制之上。然而，该世纪下半叶最杰出的观测天文学家乔瓦尼·多梅尼科·卡西尼却是第谷派。在“哥白尼附释”的第一段中，牛顿把行星系统的重心确定为一切运动都应参照的恰当之点——这是两个体系之争背后的技术问题——然后宣告：在《论运动》正文中被认定支配轨道运动的向心力，开辟了建立一种稍作限定的哥白尼体系的道路。[^note-8] 牛顿发现这一推理线索，必定是推动他走向《原理》的主要因素。
