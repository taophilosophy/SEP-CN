      The Scholium following Proposition 35 opens with the explanation for the preceding efforts on the lunar inequalities: “I wished to show by these computations of the lunar motions that the lunar motions can be computed from their causes by the theory of gravity” [**P**, 869]. Newton never found a way of deriving the precession of the lunar apogee from the theory of gravity, and consequently he never succeeded with a complete, gravity-derived account of the lunar orbit.[^note-53] The mathematical treatment of the three lunar inequalities nevertheless did provide added support for his theory of gravity. It also introduced the idea of attacking the problem of the true orbit in a sequence of successive approximations by calculating perturbations in motion in an assumed orbit caused by the gravitational action of the Sun. This was not only an entirely new approach to the then unsolved problem of simply describing the motion of the Moon, an approach that proceeded from the physical cause to the motion; it was also the beginnings of the perturbational approach that dominated all of celestial mechanics from the middle of the eighteenth century until late in the twentieth.[^note-54] As difficult as Propositions 25 through 35 were for readers at the time — and still are for readers now — they crucially promoted the further research on the complicated orbital motions that ultimately supplied overwhelming support for Newton's theory of gravity.
    step1: |-
      命题 35 之后的附释以对前述月球不等项工作的解释开篇：“我想通过这些对月球运动的计算表明，月球运动可以由其引力理论从原因计算出来” （**P**, 869）。牛顿始终未能找到从引力理论推导月球远地点进动的方法，因此他从未成功给出一个完整的、由引力导出的月球轨道说明。[^note-53] 不过，对三个月球不等项的数学处理确实为他的引力理论提供了额外支持。它还引入了这样的观念：通过计算太阳引力作用在假设轨道中引起的运动摄动，以一系列逐次逼近来攻克真实轨道问题。这不仅是一种处理当时尚未解决的“描述月球运动”问题的全新进路——从物理原因推进到运动——也是从 18 世纪中叶直到 20 世纪末主导整个天体力学的摄动方法的开端。[^note-54] 无论命题 25 至 35 对当时读者多么艰深——对今天的读者仍然如此——它们都关键地推动了关于复杂轨道运动的进一步研究，而这项研究最终为牛顿的引力理论提供了压倒性支持。
