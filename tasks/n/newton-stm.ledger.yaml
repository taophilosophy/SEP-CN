      The untitled and unfinished manuscript which begins “De Gravitatione et aequipondio fluidorum et solidorum …”, written perhaps a decade or more before the *Principia*, consists for the most part of an extensive and scathing critique of Descartes' doctrine of motion. The document, published for the first time in (Hall and Hall, 1962), is well worth the study for a glimpse at the development of Newton's thinking at a relatively young age. It manifestly embraces the doctrines of space and time later codified in the *Principia*. Notable, as well, is that each of the five arguments from the properties, causes and effects of motion advanced in the Scholium has a clearly identifiable antecedent in *De Gravitatione*. (See Rynasiewicz 1995 for details.) This makes it clear the extent to which the Scholium is concerned to argue specifically against the Cartesian system (as pointed out by Stein 1967)[^stein-1967], which Newton perceived to be the only other viable contender at the time.
    step1: |-
      那部以“De Gravitatione et aequipondio fluidorum et solidorum……”开头、无题而未完成的手稿，写成或许比《原理》早十年或更多，其大部分内容是对笛卡尔运动学说的广泛而严厉的批评。该文献首次发表于（Hall and Hall, 1962），很值得研究，可借以窥见牛顿较年轻时思想的发展。它明显接受了后来在《原理》中被定型的空间与时间学说。同样值得注意的是，附释中提出的“运动的性质、原因与效应”五个论证，每一个在《论重力》中都有清晰可辨的先声。（细节见 Rynasiewicz 1995。）这清楚地表明，附释在多大程度上专门针对笛卡尔体系而发（如斯坦 1967 所指出）[^stein-1967]；在牛顿看来，该体系是当时唯一可行的另一选项。
