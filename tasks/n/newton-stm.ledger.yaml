      **天体物理学的应用**。导出这一结论之后，牛顿运用前两个来自性质的论证的前提，连同来自效应的论证的前提，来批评行星运动的涡旋理论。按该理论，每颗行星（尤其是地球）相对于我们太阳的天界涡旋的“精微”物质相对静止。因此，按笛卡尔自己对真实运动的定义（以及他的明白坚持），它们没有真实运动。然而，明显的是，它们并不彼此保持固定位置。于是，按第一个论证所援引的性质，它们不可能［都］真正静止。此外，按第二个论证所援引的性质，它们参与了太阳涡旋的圆周运动［假定该运动是真实运动，正如笛卡尔默认的那样］。最后，既然它们因此参与这个假想涡旋的真实圆周运动，它们就应当有离开其旋转轴的趋向。
