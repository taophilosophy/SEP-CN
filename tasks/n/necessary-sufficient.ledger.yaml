      Ian Wilson (in Wilson 1979)[^wilson-1979] proposes that there are five possible relations symbolised by “if, … then …” including the *reason why* reading. Subsequent authors have not adopted this proposal, preferring to focus mainly on three of these relations, each of which bears on questions of necessity and sufficiency. First is the implication relation symbolised by the hook operator, “⊃” or perhaps some relevant implication operator. Such an operator captures some inferential relations as already noted. For example, we saw that from the truth of a conjunction, it can be inferred that each component is true (from “*p* and *q*”, we can infer that “*p*” is true and that “*q*” is true). Hook, or a relevant implication operator, seems to capture one of the relations encountered in the sea battle case, a relation which can be thought of as holding paradigmatically between bearers of truth values, but can also be thought of in terms of states of affairs. For this relation, we are able to maintain the standard theory’s reciprocity thesis with the limitations already noted.
    step1: |-
      Ian Wilson（见 Wilson 1979）[^wilson-1979] 提出，“如果……那么……”所标示的可能关系有五种，其中包括*原因性理由*解读。后来的作者没有采纳这一提案，而是主要聚焦于其中三种关系，每一种都涉及必然性与充分性问题。第一种是由蹄铁算子“⊃”（或某种相干蕴涵算子）标示的蕴涵关系。如前所述，这类算子捕捉了某些推理关系。例如，我们看到，从合取的真可以推出每个支命题为真（从“*p* 且 *q*”可推出“*p*”为真、“*q*”为真）。蹄铁算子或相干蕴涵算子似乎捕捉了海战情形中出现的关系之一；这种关系可以被想成典型地成立于真值承担者之间，但也可以从事态的角度来思考。对于这种关系，在已指出的限制之下，我们能够维持标准理论的互反论题。
