      As mentioned at the start of the article, the specification of necessary and sufficient conditions has traditionally been part of the philosopher’s business of analysis of terms, concepts and phenomena. Philosophical investigations of knowledge, truth, causality, consciousness, memory, justice, altruism and a host of other matters do not aim at stating evidential or explanatory relations, but rather at identifying and developing conceptual ones (see Jackson 1998 for a detailed account of conceptual analysis, and the supplementary entry on conceptions of analysis in analytic philosophy for an overview)[^jackson-1998]. But even here, the temptation to look for *reasons why* or *reasons for thinking that* is not far away. While conceptual analysis, like dictionary definition, eschews evidential and explanatory conditions, evidential conditions seem to be natural consequences of definition and analysis. That Nellie is an elephant may not be a (or the) reason why she is an animal, any more than that a figure is a square is a reason why it has four sides. But some evidential claims seem to make sense even in such contexts: being an elephant apparently gives a reason for thinking that Nellie is an animal, and a certain figure may be said to have four sides because it is a square, in an evidential sense of “because”.
    step1: |-
      如文章开头所说，规定必要与充分条件，传统上是哲学家分析术语、概念与现象的业务之一。对知识、真理、因果性、意识、记忆、正义、利他主义以及一大堆其他问题的哲学研究，并不以陈述证据关系或解释关系为目标，而是以识别与发展概念关系为目标（概念分析的详细说明见 Jackson 1998；概览见分析哲学中的分析概念补充词条）[^jackson-1998]。但即使在这里，寻找*原因性理由*或*证据性理由*的诱惑也并不遥远。概念分析与词典定义一样，回避证据条件与解释条件；但证据条件似乎是定义与分析的自然后果。奈莉是一头大象，或许并不是她是一个动物的原因性理由（或那个原因性理由），正如一个图形是正方形并不是它有四条边的原因性理由。但有些证据主张即便在此类语境中似乎也讲得通：是一头大象显然给出了奈莉是一个动物的证据性理由；而某个图形可以说有四条边，因为它是一个正方形——这是“因为”的证据性意义。
    step2: |-
      如开头所说，规定必要与充分条件，传统上是哲学家分析术语、概念与现象这份营生的一部分。对知识、真理、因果性、意识、记忆、正义、利他主义等诸多问题的哲学研究，并不以陈述证据关系或解释关系为目标，而是要识别并发展概念关系（概念分析的详尽阐述见 Jackson 1998；概览见补充词条“分析哲学中的分析概念”）[^jackson-1998]。但即使在这里，寻找 *原因性理由* 或 *证据性理由* 的诱惑也相去不远。概念分析与词典定义一样回避证据条件与解释条件；然而证据条件似乎又是定义与分析的自然产物。奈莉是一头大象，或许并不是“她是一个动物”的原因性理由（或那个原因性理由），正如图形是正方形并不是“它有四条边”的原因性理由。但有些证据主张即便在这类语境中也说得通：是一头大象，显然给出奈莉是动物的证据性理由；而某个图形之所以有四条边，可以说是因为它是正方形——这里取的是“因为”的证据性意义。
