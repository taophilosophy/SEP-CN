      It is also possible—according the standard theory—to use “only if” to identify a necessary condition: we can say that Jonah was swallowed by a whale only if he was swallowed by a mammal, for if a creature is not a mammal, it is not a whale. Equivalent to (i) above, on this account, is the sentence “I opened the door only if I used the key”—a perfectly natural way of indicating that use of the key was necessary for opening the door.
    step1: |-
      按照标准理论，还可以用“only if”（仅当）来标识必要条件：我们可以说，约拿被鲸吞下，仅当他被一头哺乳动物吞下；因为一个生物若不是哺乳动物，就不是鲸。在这种理解下，与上面 (i) 等值的语句是“我开了门，仅当我用了钥匙”——这是表明用钥匙为开门所必要的一种完全自然的说法。
    step2: |-
      按标准理论，还可以借“only if”（仅当）来标识必要条件：我们可以说，约拿为鲸所吞，仅当吞他的是哺乳动物；因为不是哺乳动物的生物不会是鲸。在这种理解下，与 (i) 等值的语句是“我开了门，仅当我用了钥匙”——用它表示“用钥匙对开门是必要的”，再自然不过。
  - id: 14
    kind: body
    source: |-
      This account of necessary and sufficient conditions is particularly apposite in dealing with logical inferences. For example, from the truth of a conjunction, it can be inferred that each component is true (if “*p* and *q*” is true, then “*p*” is true and “*q*” is true). Suppose, then, that it is true that it is both raining and sunny. This is a sufficient condition for “it is raining” to be true. That it is raining is—contrariwise—a necessary condition for it being true that it is both raining and sunny. A similar account seems to work for conceptual and definitional contexts. So if the concept of memory is analysed as the concept of a faculty for tracking actual past events, the fact that an event is now in the past is a necessary condition of my presently recollecting it. If water is chemically defined as a liquid constituted mainly of H₂O, then if a glass contains water, it contains mainly H₂O. That the glass contains mostly H₂O is a necessary condition of its containing water.
    step1: |-
      这种对必要条件与充分条件的说明，在处理逻辑推理时尤其贴切。例如，由合取的真可以推出每个支命题为真（如果“*p* 且 *q*”为真，则“*p*”为真且“*q*”为真）。设“天既下雨又出太阳”为真。这是“天在下雨”为真的充分条件。反过来，天在下雨则是“天既下雨又出太阳”为真的必要条件。类似的说明似乎也适用于概念与定义的语境。于是，若记忆的概念被分析为追踪真实过去事件之官能的概念，那么某事件现已属于过去，就是我此刻回忆起它的必要条件。若水在化学上被定义为主要由 H₂O 构成的液体，那么一只杯子若装有水，就主要含有 H₂O。杯中主要含有 H₂O，是它装有水的必要条件。
    step2: |-
      这种对必要与充分条件的说明，用来处理逻辑推理尤为贴切。例如，从合取为真可推出每个支命题为真（“*p* 且 *q*”为真，则“*p*”为真、“*q*”为真）。设“天既下雨又出太阳”为真：这便是“天在下雨”为真的充分条件；反过来，天在下雨又是“天既下雨又出太阳”为真的必要条件。类似的说明似乎也适用于概念与定义的语境。于是，若把记忆概念分析为追踪真实过去事件的官能概念，则某事件如今已成过去，就是我此刻回忆起它的必要条件。若水在化学上定义为主要由 H₂O 构成的液体，则杯子装着水，就主要装着 H₂O；“杯中主要是 H₂O”是“杯中有水”的必要条件。
  - id: 15
