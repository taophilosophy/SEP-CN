      While it is possible to distinguish these different roles the “if” clause may play (there may be others too), it is not always easy to isolate them in every case. The appeal to “reasons why” and “reasons for thinking” enables us to identify what seem to be ambiguities both in the word “if” and in the terminology of necessary and sufficient conditions. Unfortunately, the concept of *what is explanatory* itself may be too vague to be very helpful here, for we can explain a phenomenon by citing a reason for thinking it is the case, or by citing a reason why it is the case. A similar vagueness infests the word “because”, as we see below. Consider, for example, cases where mathematical, physical or other laws are involved (one *locus classicus* for this issue is Sellars 1948)[^sellars-1948]. The truth of “that figure is a polygon” is sufficient for inferring “the sum of that figure’s exterior angles is 360 degrees”. Likewise, from “the sum of the figure’s exterior angles is not 360 degrees” we can infer “the figure is not a polygon”. Such inferences are not trivial. Rather they depend on geometrical definitions and mathematical principles, and so this is a case of mathematically necessary and sufficient conditions. But it appears quite plausible that mathematical results also give us at least a reason for thinking that because a figure is a polygon its exterior angles will sum to 360 degrees. We may even be able to think of contexts in which someone claims that a figure’s being a polygon is a reason why its exterior angles sum to 360 degrees. And it might not be unnatural for someone to remark that a certain figure is a polygon because its exterior angles sum to 360 degrees.
    step1: |-
      虽然可以区分“if”从句可能扮演的这些不同角色（也许还有别的角色），但在每个情形中都把它们分离出来并不总是容易。诉诸“原因性理由”与“证据性理由”，使我们能够识别出“if”一词与必要、充分条件术语中似乎存在的歧义。遗憾的是，*什么是解释性的*这一概念本身可能过于含混而帮助不大，因为我们既可以通过援引一个证据性理由来解释一个现象，也可以通过援引一个原因性理由来解释它。类似的含混也缠着“因为”一词，如下文所示。例如，考虑涉及数学、物理学或其他定律的情形（这一问题的一处经典出处[*locus classicus*]见 Sellars 1948）[^sellars-1948]。“那个图形是多边形”之真，足以推出“该图形外角之和为 360 度”。同样，从“该图形外角之和不是 360 度”可以推出“该图形不是多边形”。这类推理并非琐屑；它们依赖于几何定义与数学原理，因此这是数学性必要条件与充分条件的情形。但以下情形同样貌似可信：数学结果也至少给了我们一个证据性理由，让我们认为由于图形是多边形，其外角之和将为 360 度。我们甚至可以设想这样的语境：有人主张图形是多边形，是其外角之和为 360 度的原因性理由。而且，某人说一个图形是多边形，因为它外角之和为 360 度，也未必不自然。
    step2: |-
      尽管可以区分“if”从句的这些不同角色（或许还有别的），但并非在每一情形里都容易把它们剥离开来。诉诸“原因性理由”与“证据性理由”，我们能识别出“if”一词与必要、充分条件术语中似乎存在的歧义。遗憾的是，*何为解释性* 这一概念本身可能太过含混，帮不上大忙：我们既可援引证据性理由来解释一个现象，也可援引原因性理由来解释它。“因为”一词同样染有类似的含混，下文可见。例如，考虑涉及数学、物理学或其他定律的情形（这一问题的一处经典出处[*locus classicus*]见 Sellars 1948）[^sellars-1948]。“那个图形是多边形”为真，便足以推出“该图形外角之和为 360 度”；同样，从“该图形外角之和不是 360 度”可推出“该图形不是多边形”。这类推理并非琐屑，它们依赖几何定义与数学原理，因此属于数学性的必要与充分条件。但下面这一点同样可信：数学结果至少为我们提供了一个证据性理由，让我们认定：正因为该图形是多边形，其外角之和才为 360 度。我们甚至可以设想有人主张：该图形是多边形，这一点是其外角之和为 360 度的原因性理由。而若有人说“这个图形之所以是多边形，是因为它外角之和为 360 度”，也未必不自然。
