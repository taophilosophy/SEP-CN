      Finally, it should be noted that not all conditional sentences primarily aim at giving either necessary or sufficient conditions. A common case involves what might be called *jocular conditionals*. A friend of Octavia’s mistakenly refers to “Plato’s *Critique of Pure Reason*” and Octavia says, “If Plato wrote the *Critique of Pure Reason*, then I’m Aristotle”. Rather than specifying conditions, Octavia is engaging in a form of *reductio* argument. Since it is obvious that she is not Aristotle, her joke invites the listener to infer (by contraposition) that Plato did not write the *Critique of Pure Reason*. Another case is the so-called *concessive conditional,* where the antecedent does not appear to be a condition on the consequent of even an inferential kind. Suppose we plan on having picnic and hope it will be sunny. But *even if* rain comes, we will still go. In such a case it does not seem plausible to maintain that the threat of rain provides any condition at all on accepting the consequent. Such concessive conditionals do not admit of contraposition (Crupi and Iacona 2022, and compare Gomes 2020)[^crupi-2022][^gomes-2020]. Others have argued that in cases where a conditional construction does not appear to be putting forward any genuine conditions, these are “nonconditional” conditionals (Geis and Lycan 1993)[^geis-1993]—in other words they may just be disguised affirmations.
    step1: |-
      最后应当指出，并非所有条件句都以给出必要或充分条件为主要目的。一个常见情形涉及所谓的*玩笑式条件句*。奥克塔维娅的一位朋友误称“柏拉图的《纯粹理性批判》”，奥克塔维娅说：“如果柏拉图写了《纯粹理性批判》，那我就是亚里士多德了。”奥克塔维娅并不是在规定条件，而是在进行一种归谬（*reductio*）论证。既然她显然不是亚里士多德，她的玩笑就邀请听者（通过逆否）推出柏拉图并没有写《纯粹理性批判》。另一情形是所谓的*让步条件句*：前件甚至不表现为后件的推论性条件。设想我们计划野餐并希望天晴。但*即使*下雨，我们仍然会去。在这种情形中，断言下雨的威胁为接受后件提供了任何条件，似乎难以成立。这类让步条件句不容许逆否（Crupi and Iacona 2022；并比较 Gomes 2020）[^crupi-2022][^gomes-2020]。另一些作者则论证：在条件句构造并未提出任何真正条件的情形中，这些是“非条件性”条件句（Geis and Lycan 1993）[^geis-1993]——换句话说，它们也许只是伪装的断言。
    step2: |-
      最后应当指出：并非所有条件句都以给出必要或充分条件为主要目的。一个常见情形，涉及所谓的 *玩笑式条件句*。奥克塔维娅的一位朋友误称“柏拉图的《纯粹理性批判》”，奥克塔维娅便说：“如果柏拉图写了《纯粹理性批判》，那我就是亚里士多德了。”奥克塔维娅并非在规定条件，而是在玩一种归谬（*reductio*）论证。她显然不是亚里士多德，于是这个玩笑邀请听者（经由逆否）推出：柏拉图并没有写《纯粹理性批判》。另一情形是所谓的 *让步条件句*：前件甚至不构成后件的推论性条件。设想我们打算野餐，盼着天晴；但 *即使* 下雨，我们照样去。在这种情形里，要说下雨的威胁为接受后件提供了任何条件，似乎难以成立。这类让步条件句不容许逆否（Crupi and Iacona 2022；并比较 Gomes 2020）[^crupi-2022][^gomes-2020]。另一些作者则主张：当条件句构造并未真正提出条件时，它们是“非条件性”条件句（Geis and Lycan 1993）[^geis-1993]——换言之，它们或许只是伪装起来的断言。
