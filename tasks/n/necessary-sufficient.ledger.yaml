      If memory is a capacity for tracking our own past experiences and witnessings then a *necessary* condition for Penelope remembering giving a lecture is that it occurred in the past. Contrariwise, that Penelope now remembers the lecture is *sufficient* for inferring that it was given in the past. In a well-known attempt to use the terminology of necessary and sufficient conditions to illuminate what it is for one thing to be cause of another thing, J. L. Mackie proposes that causes are at a minimum INUS conditions, that is, “Insufficient but Necessary parts of a condition which is itself Unnecessary but Sufficient” for their effects (Mackie 1965)[^mackie-1965]. A schema like Mackie’s became the foundation for the “sufficient cause model” of disease in epidemiology (see Rothman 1976)[^rothman-1976] and continues to have influence on medical thinking about disease causation, as well as on definitions of causation in psychology and law (VanderWeele 2017)[^vanderweele-2017].
    step1: |-
      如果记忆是一种追踪我们过去经验与亲见的能力，那么佩内洛普记得自己讲过一次课的*必要*条件，是那次讲课发生在过去。反过来，佩内洛普现在记得那次讲课，这一点*充分*到足以推断那次讲课发生在过去。J. L. Mackie 在一次著名的尝试中，用必要条件与充分条件的术语来阐明一物为他物之因是什么；他提出，原因至少是 INUS 条件，即“对其结果而言不充分但必要的部分，属于本身不必要却充分的条件”（Mackie 1965）[^mackie-1965]。Mackie 式的图式后来成为流行病学中疾病“充分原因模型”的基础（见 Rothman 1976）[^rothman-1976]，并且持续影响着医学关于疾病因果的思考，也影响着心理学与法学中因果关系的定义（VanderWeele 2017）[^vanderweele-2017]。
    step2: |-
      如果记忆是一种追踪自己过去经验与亲见的能力，那么佩内洛普记得自己讲过一次课，其 *必要* 条件是：那次讲课发生在过去。反过来，佩内洛普现在记得那次讲课，这一点 *充分* 到可以推断讲课发生在过去。J. L. Mackie 曾有一次著名的尝试，用必要与充分条件的术语来阐明“一物是另一物之因”究竟是什么。他提出，原因至少是 INUS 条件，即“对其结果而言不充分但必要的部分，属于本身不必要却充分的条件”（Mackie 1965）[^mackie-1965]。这一 Mackie 式图式后来成为流行病学中疾病“充分原因模型”的基础（见 Rothman 1976）[^rothman-1976]，至今仍影响着医学对疾病因果的思考，也影响着心理学与法学中因果关系的定义（VanderWeele 2017）[^vanderweele-2017]。
