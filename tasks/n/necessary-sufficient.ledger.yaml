      One scenario for (xiii) is the situation where Solange is invariably a lively contributor to any seminar she attends. Moreover, the contributions she makes are always insightful, hence guaranteeing an interesting time for all who attend. In this case, Solange’s presence at least in part explains or is a *reason why* the seminar was good. Note that some writers distinguish explanatory reasons of this sort from full-bodied explanations (Nebel 2018). A different scenario depicts Solange as someone who has an almost unerring knack for spotting which seminars are going to be good, even though she is not always active in the discussion. Her attendance at a seminar, according to this story, provides a *reason for thinking*—or is *evidence*—that the seminar is good. We might say that according to the first story, the seminar is good because Solange is at it. In the second case, Solange is at it because it is good. Examples of this kind were first introduced in Wilson (1979) following on from the attack on the validity of contraposition in Downing (1975). Notice that the hook (as understood in classical logic) does not capture the *reason for thinking* relation, for it permits any true consequent to be inferred from any other statement whatever. Where the conditional is a *reason for thinking* relation, then the antecedent must provide some support for the consequent—hence has to provide some supporting evidence for accepting the consequent. A formal exploration of one *reason for thinking* relation is given in Vincenzo Crupi and Andrea Iacona’s study of the *evidential conditional* (Crupi and Iacona 2020, and see the fully developed logic of the evidential conditional in Raidl, Iacona and Crupi 2021)[^crupi-2020]. These writers treat the *reason for thinking* or evidentiary relation as one in which the antecedent provides a “reason for accepting” the consequent. See also Igor Douven on the “evidential support thesis” (Douven 2008, 2016)[^douven-2008].
    step1: |-
      (xiii) 的一种情形是：索朗日无论参加哪次研讨班，都总是活跃的发言者；而且她的发言总是富有洞见，因而保证所有与会者都过得有趣。在这种情形中，索朗日的到场至少部分地解释了研讨班为何很好，或者说，是研讨班很好的*原因性理由*。注意，一些作者把这类解释性理由与完全意义上的解释区分开来（Nebel 2018）。另一种情形把索朗日描绘成一个几乎从不出错地辨认哪次研讨班会好的人，尽管她在讨论中并不总是活跃。按照这个说法，她出席某次研讨班，提供了这次研讨班很好的一个*证据性理由*——或者说是*证据*。我们可以说，按照第一个说法，研讨班很好是因为索朗日在场；在第二种情形中，索朗日在场是因为研讨班很好。这类例子最初由 Wilson (1979) 引入，接续 Downing (1975) 对逆否推理有效性的攻击。注意，蹄铁算子（如经典逻辑所理解）捕捉不到*证据性理由*关系，因为它允许从任何语句推出任何为真的后件。当条件句是*证据性理由*关系时，前件必须为后件提供某种支持——因而必须为接受后件提供某种支持性证据。Vincenzo Crupi 与 Andrea Iacona 对*证据条件句*的研究给出了对一种*证据性理由*关系的形式化探讨（Crupi and Iacona 2020；证据条件句的完整逻辑见 Raidl, Iacona and Crupi 2021）[^crupi-2020]。这些作者把*证据性理由*或证据关系理解为前件为后件提供“接受的理由”的关系。另见 Igor Douven 论“证据支持论题”（Douven 2008, 2016）[^douven-2008]。
