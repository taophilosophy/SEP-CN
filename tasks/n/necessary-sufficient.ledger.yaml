      In defence of contraposition, it might be argued that in the case of causal claims there is at least a weak form of contraposition that is valid. Gomes proposes (Gomes 2009)[^gomes-2009] that where ‘*A*’ is claimed to be a causally sufficient condition for ‘*B*’, or ‘*B*’ a causally necessary condition of ‘*A*’, then some form of reciprocity between the two kinds of conditions holds, and so some version of contraposition will be valid. Going back to example (ii), suppose we read this as stating a causal condition—that your touching me would cause me to scream. Gomes suggests that ‘*A*’ denotes a sufficient cause of *B*, provided that (1) ‘*A*’ specifies the occurrence of an event that would cause another event ‘*B*’, and does this by (2) stating a condition the truth of which is sufficient for inferring the truth of ‘*B*’. In such a case, we could further maintain that ‘*B*’, in turn, denotes a necessary effect of ‘*A*’, meaning that the truth of *B* provides a necessary condition for the truth of *A* (Gomes 2009, 377–9)[^gomes-2009]. It is notable that Crupi and Iacona’s evidential conditional also preserves contraposition, which they claim as a distinctive feature of of their analysis, based on their understanding that “provides evidence for” is another way of saying “supports” (section 6 of Crupi and Iacona 2020)[^crupi-2020]. For them, if Solange’s presence provides evidence for the seminar being good (see (xiii) above), then the seminar’s not being good is evidence of Solange’s absence. They—like Gomes (2019)—thus reject Downing’s (1975) general scepticism about contraposition. Wilson, by contrast, argues that the seminar not being good might also be a reason why Solange does not attend. But this, he claims, “saves only the appearance of contraposition” (Wilson 1979, 274–5)[^wilson-1979].
    step1: |-
      为逆否推理辩护，可以说在因果主张的情形中至少存在一种有效的弱逆否。Gomes 提出（Gomes 2009）[^gomes-2009]：如果主张“*A*”是“*B*”的因果充分条件，或“*B*”是“*A*”的因果必要条件，那么两类条件之间就成立某种互反性，因而某种形式的逆否将有效。回到例子 (ii)，设我们把它读作陈述一个因果条件——你碰我会导致我尖叫。Gomes 建议，“*A*”标示 *B* 的一个充分原因，只要 (1) “*A*”规定了某个会引起另一事件“*B*”的事件的发生，并且 (2) 通过陈述一个条件来做到这一点，该条件之真足以推出“*B*”之真。在这种情形中，我们还可以进一步主张，“*B*”反过来标示“*A*”的一个必然结果，意思是 *B* 之真为 *A* 之真提供了一个必要条件（Gomes 2009, 377–9）[^gomes-2009]。值得注意的是，Crupi 与 Iacona 的证据条件句同样保持逆否，他们把这一点主张为其分析的显著特征，依据是他们对“提供证据”即“支持”的理解（Crupi and Iacona 2020 第 6 节）[^crupi-2020]。对他们来说，如果索朗日的到场为研讨班很好提供了证据（见上面的 (xiii)），那么研讨班不好就是索朗日缺席的证据。他们——与 Gomes (2019) 一样——因此拒绝 Downing (1975) 对逆否推理的一般怀疑论。Wilson 恰恰相反，他论证研讨班不好也可能是不出席的原因性理由。但他声称，这只是“保住了逆否推理的样子”（Wilson 1979, 274–5）[^wilson-1979]。
    step2: |-
      为逆否推理辩护的人可以说：就因果主张而言，至少有一种弱形式的逆否是有效的。Gomes 提出（Gomes 2009）[^gomes-2009]：若主张“*A*”是“*B*”的因果充分条件，或“*B*”是“*A*”的因果必要条件，两类条件之间便有某种互反性成立，从而某种形式的逆否有效。回到例子 (ii)，设我们把它读作一个因果条件：你碰我，会致使我尖叫。Gomes 建议，“*A*”标示 *B* 的一个充分原因，只要 (1) “*A*”规定了某个会引起另一事件“*B*”的事件之发生，并且 (2) 它是通过陈述一个条件来这样做的——该条件之真足以推出“*B*”之真。在这种情形下，我们还可以进一步主张，“*B*”反过来标示“*A*”的一个必然结果，即 *B* 之真为 *A* 之真提供了一个必要条件（Gomes 2009, 377–9）[^gomes-2009]。值得注意的是，Crupi 与 Iacona 的证据条件句同样保住逆否，且他们把这当作其分析的独有特征，依据是对“提供证据”即“支持”的理解（Crupi and Iacona 2020 第 6 节）[^crupi-2020]。在他们看来，若索朗日的到场为研讨班很好提供了证据（见上面的 (xiii)），那么研讨班不好就是索朗日缺席的证据。因此，他们——与 Gomes (2019) 一样——拒绝 Downing (1975) 对逆否推理的一般怀疑论。Wilson 则相反，他论证研讨班不好也可能是不出席的原因性理由；但他声称，这“只保住了逆否推理的表象”（Wilson 1979, 274–5）[^wilson-1979]。
