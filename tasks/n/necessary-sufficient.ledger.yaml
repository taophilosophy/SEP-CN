      Can we use the truth-functional understanding of “if” to propose that the consequent of any conditional (in (i), the consequent is “I used the key”) specifies a necessary condition for the truth of the antecedent (in (i), “I opened the door”)? Many logic and critical thinking texts use just such an approach, and for convenience it can be called “the standard theory” (see Blumberg 1976, pp. 133–4, Hintikka and Bachman 1991, p. 328, Moore and Parker 2009, 310–11, and Southworth and Swoyer 2020, ch. 3.2 for examples of this approach)[^blumberg-1976][^hintikka-1991][^moore-2009][^southworth-2020].
    step1: |-
      我们能否用“if”的真值函项理解来主张：任何条件句的后件（在 (i) 中，后件是“我用过钥匙”）都为其前件（在 (i) 中，“我开了门”）的真值规定了一个必要条件？许多逻辑学与批判性思维教材正是采用这一进路；为方便起见，可称之为“标准理论”（这一进路的例子见 Blumberg 1976, pp. 133–4、Hintikka and Bachman 1991, p. 328、Moore and Parker 2009, 310–11、Southworth and Swoyer 2020, ch. 3.2）[^blumberg-1976][^hintikka-1991][^moore-2009][^southworth-2020]。
    step2: |-
      能否借助对“if”的真值函项理解，主张任何条件句的后件（在 (i) 中即“我用过钥匙”）都为其前件（在 (i) 中即“我开了门”）的真值规定一个必要条件？许多逻辑与批判性思维教材正是这样做的；为方便起见，可称之为“标准理论”（持这一进路的例子见 Blumberg 1976, pp. 133–4；Hintikka and Bachman 1991, p. 328；Moore and Parker 2009, 310–11；Southworth and Swoyer 2020, ch. 3.2）[^blumberg-1976][^hintikka-1991][^moore-2009][^southworth-2020]。
  - id: 11
    kind: body
    source: |-
      The standard theory makes use of the fact that in classical logic, the truth-function “*p* ⊃ *q*” (“If *p*, *q*”) is false only when *p* is true and *q* is false. The relation between “*p*” and “*q*” in this case is sometimes referred to as *material implication* (see the entry on the logic of conditionals). On this account of “if *p*, *q*”, if the conditional “*p* ⊃ *q*” is true, and *p* holds, then *q* also holds; likewise if *q* is false, then *p* must also be false (if the conditional is true). The standard theory claims that when the conditional “*p* ⊃ *q*” is true the truth of the consequent, “*q*”, is *necessary* for the truth of the antecedent, “*p*”, and the truth of the antecedent is in turn *sufficient* for the truth of the consequent. This reciprocal relation between necessary and sufficient conditions matches the formal equivalence between a conditional formula and its contrapositive (“~*q* ⊃ ~*p*” is the *contrapositive* of “*p* ⊃ *q*”). Descending from talk of truth of statements to speaking about states of affairs, we can equally correctly say, on the standard theory, that using the key was a necessary condition of opening the door.
    step1: |-
      标准理论利用了如下事实：在经典逻辑中，真值函项“*p* ⊃ *q*”（“如果 *p*，则 *q*”）只在 *p* 为真且 *q* 为假时为假。*p* 与 *q* 之间的这种关系有时被称为*实质蕴涵*（见条件句逻辑词条）。按照对“如果 *p*，则 *q*”的这种理解，如果条件句“*p* ⊃ *q*”为真且 *p* 成立，则 *q* 也成立；同样，如果 *q* 为假，则 *p* 也必为假（前提是该条件句为真）。标准理论主张：当条件句“*p* ⊃ *q*”为真时，后件“*q*”的真值对前件“*p*”的真值是*必要的*，而前件的真值反过来对后件的真值是*充分的*。必要条件与充分条件之间的这种互反关系，对应于条件公式与其逆否命题之间的形式等值（“~*q* ⊃ ~*p*”是“*p* ⊃ *q*”的*逆否命题*）。从谈论语句的真值下移到谈论事态，按标准理论我们同样可以正确地说：用钥匙是开门的必要条件。
    step2: |-
      标准理论利用了经典逻辑中的一个事实：真值函项“*p* ⊃ *q*”（“如果 *p*，则 *q*”）仅在 *p* 真而 *q* 假时为假。*p* 与 *q* 之间的这种关系，有时被称作 *实质蕴涵*（见条件句逻辑词条）。按这种对“如果 *p*，则 *q*”的理解，若条件句“*p* ⊃ *q*”为真且 *p* 成立，则 *q* 也成立；同样，若 *q* 为假，则 *p* 必为假（只要该条件句为真）。标准理论主张：当“*p* ⊃ *q*”为真时，后件“*q*”之真对前件“*p*”之真是 *必要的*；而前件之真对后件之真则是 *充分的*。必要条件与充分条件的这种互反关系，正好对应条件公式与其逆否命题之间的形式等值（“~*q* ⊃ ~*p*”是“*p* ⊃ *q*”的 *逆否命题*）。从语句真值的层面降到事态层面，按标准理论同样可以正确地说：用钥匙是开门的必要条件。
  - id: 12
    kind: body
    source: |-
      Given the standard theory, necessary and sufficient conditions are converses of each other: *B*’s being a necessary condition of *A* is equivalent to *A*’s being a sufficient condition of *B* (and vice versa). So it seems that any truth-functional conditional sentence states both a sufficient and a necessary condition as well. Suppose that if Nellie is an elephant, then she has a trunk. Being an elephant is a sufficient condition of her having a trunk; having a trunk in turn is a necessary condition of Nellie’s being an elephant. Indeed, the claim about the necessary condition appears to be another way of putting the claim about the sufficient condition, just as the contrapositive of a formula is logically equivalent to the original formula.
    step1: |-
      按照标准理论，必要条件与充分条件互为换位：*B* 是 *A* 的必要条件，等值于 *A* 是 *B* 的充分条件（反之亦然）。这样看来，任何真值函项条件句同时陈述了一个充分条件和一个必要条件。设如果奈莉是一头大象，那么她有象鼻。是一头大象是她有象鼻的充分条件；有象鼻反过来是奈莉是一头大象的必要条件。确实，关于必要条件的这一主张看起来只是关于充分条件主张的另一种说法，正如一个公式的逆否命题在逻辑上等值于原公式一样。
    step2: |-
      按标准理论，必要条件与充分条件互为换位：*B* 是 *A* 的必要条件，等值于 *A* 是 *B* 的充分条件（反之亦然）。如此说来，任何真值函项条件句便同时陈述了充分条件与必要条件。设：如果奈莉是一头大象，那么她有象鼻。“是一头大象”是她有象鼻的充分条件；“有象鼻”反过来是奈莉身为大象的必要条件。诚然，关于必要条件的说法看起来不过是充分条件说法的另一种表述——正如一个公式的逆否命题在逻辑上等值于原公式。
