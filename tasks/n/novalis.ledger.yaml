      *Bildung* 与哲学，作为通向自我责任的教育，与艺术领域密切相关。这一关系至少有两个维度。第一，诺瓦利斯深知，*Bildung*——通过与传统及其他文化的交道而走向自我理解与自主的召唤——不能靠诉诸形式化的方法论来推进。没有任何规则能保证个体在文化中的教育必定成功。这里涉及的是从特殊走向普遍，而手边却没有一个可据以证成这一过渡的普遍。所需要的是语境敏感的判断。*Bildung* 过程本身就是一种艺术（*Kunst*），因为它需要得体感或反思性判断（如此使用“艺术”一词，与纯机械过程相对，当时相当常见，也见于赫尔德、康德与施莱尔马赫之作）。沿着这一思路，诺瓦利斯谈到以艺术方式费希特化的意志（LFI #11），也批评费希特与康德不具诗性（AB #924）。艺术、哲学与 *Bildung* 相关联的第二种意义在于：艺术是实现 *Bildung* 的媒介之一，甚至可能是特权性的媒介。在此语境中，重要的是记住：就艺术哲学而言，诺瓦利斯所处的时代是一个过渡期。大约此时，美学作为康德式对纯粹趣味判断之有效性主张的探究，随《判断力批判》而确立为一门自主的哲学学科。然而，直到并贯穿这一时期，历史与跨文化的介入在很大程度上仍是研究来自时间或地理上遥远时代的宗教与文化人工物。人们未必以审美方式接近这些对象——即在康德意义上使之接受纯粹审美判断——而也像在赫尔德与黑格尔的著作中那样，把它们视为道德科学更大织体的一部分。诺瓦利斯常倾向于这一方向，某处甚至随赫尔德把美学当作一门心理学学科来讨论（AB #423）。
