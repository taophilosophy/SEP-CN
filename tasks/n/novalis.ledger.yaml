      Hegel’s negative assessment proved influential to later times and readings of Novalis’s work. Even though Novalis’s experimenting with the philosophical form of the fragment paved the way for such stylistically bold and innovative thinkers as Kierkegaard and Nietzsche, these figures would, with few exceptions, stage themselves as critics rather than followers of romantic philosophy. In a wider intellectual context, we find Novalis’s writing attacked in Heinrich Heine’s work on recent German literature (1836 [1995]), Rudolf Haym’s *Die romantische Schule* (1870), Arnold Ruge and the young Hegelian philosophy of history (which viewed romanticism through the lens of the later Friedrich Schlegel’s engagement with Metternich and the restoration), and Karl Mannheim’s sociological explanation of the rise of German conservatism (1925 [1986]). Whereas the young Georg Lukács applauds Novalis’s aesthetics and philosophy of nature, the late Lukács worries about the irrationalism of post-Enlightenment German thought. From the other side of the political spectrum, there is Carl Schmitt’s 1919 critique of the romantic movement as effecting a dangerous occasionalism in modern political life.
