      断片作为一种哲学形式，常被系于早期耶拿浪漫派，但它并非此派所创。断片源流甚古，可追溯至古希腊，也见于尚福尔、拉罗什富科、利希滕贝格等近代作家（尚福尔之作在1790年代译成德文，一时争相传阅）。在与浪漫派相近的圈子里，赫尔德自1760年代后期起便已在试探断片的哲学潜力。他之所以转向断片，是因为对总体化、目的论的理性体系怀有广泛的怀疑；青年赫尔德把这种怀疑上溯至苏格兰启蒙哲学。诺瓦利斯屡屡称引赫尔德的著作与人。
