      尽管断片作为一种哲学形式常与早期耶拿浪漫派联系在一起，它并非这一群体的发明。断片有悠久的历史，可以上溯到古希腊人，也可上溯到尚福尔、拉罗什富科与利希滕贝格等近代作家。（尚福尔的著作在1790年代被译成德语，当时颇受追捧与讨论。）在更靠近浪漫派的圈子里，赫尔德自1760年代后期起就在探索断片的哲学潜能。赫尔德之转向断片，出于他对总体化或目的论的理性体系这一观念的广泛怀疑。青年赫尔德把这种怀疑追溯到苏格兰启蒙哲学。诺瓦利斯屡屡提到赫尔德的著作与人格。
