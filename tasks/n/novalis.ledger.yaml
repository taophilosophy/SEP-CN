      作为一种哲学形式，断片反映着现代性的状况。在弗里德里希·施莱格尔看来，反讽与幽默这类高度反思性的表达语域特别适合表达现代心态，因而与断片内在地联系在一起（这种看法也见于诺瓦利斯的著作，只是相比弗里德里希·施莱格尔而言未受强调）。诺瓦利斯转向断片则有不同的哲学动机。断片质疑这样一种观念：哲学体系建构——无论是演绎式的还是目的论式的——足以把握实在的本性。像《花粉》一样——尽管这一标题是弗里德里希·施莱格尔编辑诺瓦利斯文本付印时加上去的——断片表现为一粒思想的种子或花粉，意在培育批判性的、独立的思考，而非呈现一个自足的理论体系。
