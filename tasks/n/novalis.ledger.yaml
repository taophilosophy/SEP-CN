      尽管诺瓦利斯钦佩费希特，他的态度却比许多同代人更为审慎。在《费希特研究》中，他论战性地问道：费希特是否“过于任意地把一切都塞进了‘我’”（FS #5）。而在数年之后写成的《浪漫百科笔记》（*Das Allgemeine Brouillon*）中，他的批评借费希特式自我与丹尼尔·笛福著名小说中那位孤寂主人公之间的类比，得到了尖锐的表达：“费希特的自我——是一个鲁滨逊·克鲁索——一个科学上的*虚构*”（AB #717）。
