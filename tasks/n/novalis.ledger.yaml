      “浪漫主义”一词本身常被追溯到中世纪的骑士小说：主人公孤身对抗恶、罪与道德软弱，其动力来自信仰与爱这一双重动机，从而映现出一个宇宙——在其中，个体借由他所效忠的*事实上的*传统而与他人合一，并通过这一传统理解自身。然而，转向中世纪主要并不是对往昔的感伤式涵养，它早已是德国启蒙运动及其对政治专制批判的一部分。与启蒙哲学家一样，耶拿浪漫派始终清楚：前现代社会的有机统一已经一去不返。当诺瓦利斯在《基督教或欧洲》等文本中希望复兴中世纪精神时，他所指的往往是汉萨同盟的世界主义取向，而不是一种同质、以传统为基础、威权式的中世纪文化。就此而言，诺瓦利斯的哲学回应着现代性的状况。在他的著作中，现代哲学被视为本质上是自我反思的，属于自我批判理性的时代；也就是说，它不仅要探求关于自然与人的第一阶知识，也要探求关于人类知识本身究竟包含什么的第二阶知识。
