      然而在康德体系中，自由与必然之间的桥梁仅限于审美判断的领域。纯粹审美判断只能被赋予一种主观的普遍性。而费希特则发掘出康德自由观念的全部哲学潜能。在费希特的理论中，想象力的创造自发性可以说被普遍化了——它被变成绝对设定之“我”的标志性特征，这个“我”甚至自由到可以把它的本体论对应物设定为限制性的“非我”。于是，审美经验中自然合目的性的那种谨慎的“仿佛”地位被扬弃了。在先验层面上，就连因果地被规定的自然，也依据自我设定的自我而得到解释。主体性与自然、自由与必然、自发性与接受性之间的鸿沟最终被架通。诺瓦利斯与许多同代人认为，这就是费希特哲学的成就。
