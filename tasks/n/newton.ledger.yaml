      要论述牛顿的著作与影响，有三重障碍。第一，是公开的牛顿与私下的牛顿之间的反差：前者是生前及其死后一二十年刊行的著作，后者是未刊的数学与物理学工作、化学炼金术（即 17 世纪炼金术与化学的混合体）方面的努力，以及激进神学著述——这些材料大多在二战以后才公开。只有公开的牛顿影响了 18 世纪与 19 世纪初；然而，仅凭这些材料来论述牛顿其人，最多只能得到残缺的图景。第二，是牛顿公开著作的实际内容与他人（最重要的是其普及者）所归给他的立场之间往往令人震惊的反差。“牛顿主义者”一词指 18 世纪展开的若干不同思想脉络，其中一些更贴近伏尔泰、彭伯顿与麦克劳林——或者更贴近那些自认为在推进其工作的人，如克莱罗、欧拉、达朗贝尔、拉格朗日与拉普拉斯——而非牛顿本人。第三，是牛顿在 60 年智识生涯中先后全力投入的学科范围之广——数学、光学、力学、天文学、实验化学、炼金术与神学——与我们对其动力或自我认识所知之少之间的反差。试图拼出牛顿及其智识事业统一图景的传记作者与分析者，往往讲出的关于他们自己的东西，几乎不亚于关于牛顿的。
