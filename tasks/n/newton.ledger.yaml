      尽管牛顿在伦敦岁月用于独自研究的时间远少于剑桥，他并未完全停止产出。其《光学》第一版（英文）终于在 1704 年问世，书后附两篇数学论文，是他首次付印的微积分著作。此版之后有 1706 年拉丁文版与 1717 年英文第二版，各版都增添了关于自然哲学关键议题的重要“疑问”，为前版所无。其他早期数学工作也陆续印行，包括 1707 年的代数著作《普遍算术》（*Arithmetica Universalis*），以及 1711 年的《无穷多项方程分析》与论有限差分的小册《微分方法》（“Methodis differentialis”）。《原理》第二版于 1713 年出版（牛顿 1709 年 66 岁时开始着手），1726 年出第三版。彻底重构的原计划虽早已放弃，但第二版几乎每一页都有修改，可见牛顿（常经其编者罗杰·科茨催促）何等仔细地重审全书；重要部分大幅改写，既回应大陆的批评，也采纳新数据，包括伦敦所做的阻力实验数据。第三版的集中修订始于 1723 年，时年 80；改动远不及第二版广泛，但确有实质性增补与修改，理应是代表其最成熟看法的版本。
