  - id: 3
    kind: body
    source: |-
      Newton's life naturally divides into four parts: the years before he entered Trinity College, Cambridge in 1661; his years in Cambridge before the *Principia* was published in 1687; a period of almost a decade immediately following this publication, marked by the renown it brought him and his increasing disenchantment with Cambridge; and his final three decades in London, for most of which he was Master of the Mint. While he remained intellectually active during his years in London, his legendary advances date almost entirely from his years in Cambridge. Nevertheless, save for his optical papers of the early 1670s and the first edition of the *Principia*, all his works published before he died fell within his years in London.[^note-1]
    step1: |-
      牛顿的一生自然分为四段：1661 年进入剑桥大学三一学院之前的岁月；1687 年《原理》出版之前在剑桥的岁月；该著作出版后紧接着的近十年，以它带来的声名和他对剑桥日益增长的不满为标志；以及在伦敦的最后三十年，其中大部分时间他担任造币局局长。虽然他在伦敦的岁月里仍保持智识上的活跃，其传奇性的进展几乎完全来自剑桥岁月。然而，除了 1670 年代初的光学论文与《原理》第一版之外，他生前出版的全部作品都落在伦敦岁月之内。[^note-1]
    step2: |-
      牛顿的一生自然分为四段：1661 年入剑桥大学三一学院之前；1687 年《原理》出版之前在剑桥；此后近十年，因《原理》带来的声名而显赫，也因对剑桥日益不满而苦恼；最后是伦敦的三十年，其中大部分时间他担任造币局局长。他在伦敦岁月仍勤于思考，但其堪称传奇的突破几乎全部完成于剑桥。不过，除 1670 年代初的光学论文与《原理》第一版外，他生前刊行的全部著作都出自伦敦时期。[^note-1]
