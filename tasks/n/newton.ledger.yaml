      Over the course of the next fifteen years as Lucasian Professor Newton presented his lectures and carried on research in a variety of areas. By 1671 he had completed most of a treatise length account of the calculus,[^note-2] which he then found no one would publish. This failure appears to have diverted his interest in mathematics away from the calculus for some time, for the mathematical lectures he registered during this period mostly concern algebra. (During the early 1680s he undertook a critical review of classical texts in geometry, a review that reduced his view of the importance of symbolic mathematics.) His lectures from 1670 to 1672 concerned optics, with a large range of experiments presented in detail. Newton went public with his work in optics in early 1672, submitting material that was read before the Royal Society and then published in the *Philosophical Transactions of the Royal Society*. This led to four years of exchanges with various figures who challenged his claims, including both Robert Hooke and Christiaan Huygens — exchanges that at times exasperated Newton to the point that he chose to withdraw from further public exchanges in natural philosophy. Before he largely isolated himself in the late 1670s, however, he had also engaged in a series of sometimes long exchanges in the mid 1670s, most notably with John Collins (who had a copy of “De Analysi”) and Leibniz, concerning his work on the calculus. So, though they remained unpublished, Newton's advances in mathematics scarcely remained a secret.
    step1: |-
      此后十五年担任卢卡斯数学教授期间，牛顿授课并在多个领域继续研究。到 1671 年，他已完成一部篇幅近于专著的微积分论述，[^note-2] 随后发现无人愿意出版。这一挫折似乎使他对数学的兴趣一度离开微积分，因为此期登记的数学讲稿大多关于代数。（1680 年代初，他对古典几何文本作了一次批判性审视，这次审视降低了他对符号数学重要性的看法。）他 1670 至 1672 年的讲稿关于光学，详述了大量实验。1672 年初，牛顿公开其光学工作，提交的材料先在皇家学会宣读，随后发表于《皇家学会哲学会刊》。这招致他与多位质疑者长达四年的往来，其中包括罗伯特·胡克与克里斯蒂安·惠更斯——这些交锋有时令他恼怒至极，以至于选择退出自然哲学方面的进一步公开交流。然而，在 1670 年代后期大体上自我封闭之前，他还在 1670 年代中期进行了一系列有时很长的通信，最著名的是与约翰·柯林斯（他有一份《无穷项方程分析》）和莱布尼茨，内容关于其微积分工作。因此，尽管始终未刊，牛顿在数学上的进展几乎算不上秘密。
    step2: |-
      此后十五年，牛顿在卢卡斯教席上授课，并在多个领域继续研究。到 1671 年，他已写就一部近于专著规模的微积分论述，[^note-2] 却发现无人肯出版。这次挫折似乎使他的数学兴趣一度离开微积分——此期登记的数学讲稿大多关于代数。（1680 年代初，他批判性地重审古典几何文本，对符号数学之重要性的评价反而因此降低。）他 1670 至 1672 年的讲稿讲光学，详述了大量实验。1672 年初，牛顿公开其光学成果：提交的材料先经皇家学会宣读，随后刊于《皇家学会哲学会刊》。此后四年，他与多位质疑者往返论辩，其中包括罗伯特·胡克与克里斯蒂安·惠更斯；这些交锋有时令他极为恼怒，索性退出自然哲学方面的公开交流。不过，在 1670 年代后期大体隐居之前，他于 1670 年代中期还与约翰·柯林斯（持有《无穷多项方程分析》抄本）、莱布尼茨等人有过一系列长通信，讨论其微积分工作。可见，尽管始终未刊，牛顿在数学上的进展几乎算不上秘密。
