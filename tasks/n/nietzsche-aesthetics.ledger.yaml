      What, then, is that problem? The natural suggestion is to locate it in Schopenhauer’s pessimism (e.g. Young 1992, 26–9; Young 2006, 14–15; Soll 1990, 1998; Came 2005)[^came-2005][^soll-1990][^young-1992][^young-2006]. Schopenhauer’s pessimism combines the descriptive thesis that life necessarily involves more suffering than happiness, with the normative thesis that life is therefore not worth living, or that non-existence is preferable to existence. That this is Nietzsche’s main concern is strongly suggested by his repeated references to the so-called “wisdom of Silenus” (*BT* 3/ KSA 1:35, *BT* 4/KSA 1:39–41, *BT* 7/KSA 1:57, *BT* 24/KSA 1:151). This “wisdom”—which is reported in a fragment of a lost dialogue of Aristotle’s (see *F 44 R³* [Aristotle *CW*, 2401–2]), and alluded to in Sophocles (see *Oedipus at Colonus*, 1211)—is that “the best of all things for you is entirely unattainable: never to have been born, not to *be*, to be *nothing*. But the second best is for you—to die soon” (*BT* 3/KSA 1:35). Nietzsche, on this story, accepts the descriptive thesis of pessimism, and he also believes the Greeks of the 6ᵗʰ and 5ᵗʰ centuries BC recognized its truth. The question, then, is how to respond to the “terrors and horrors of existence” (*BT* 3/KSA 1:35); the best answer is contained in Greek tragedy (specifically, the tragedies of Aeschylus and Sophocles). One might suppose that another, perhaps preferable, way to phrase the problem would be in terms of how to *overcome* the “terror and horror of existence,” or how to accept the descriptive thesis of pessimism while rejecting Silenus’ (and Schopenhauer’s) verdict on the value of human life. But, for reasons canvassed below (see §2.3), some scholars believe that *The Birth* remains committed in some sense to Schopenhauer’s negative verdict on the value of life. What is important for now is simply that, on the present proposal, Nietzsche views *suffering*—in particular, its predominance and inextricability—as the main problem facing us.
