      Like his successors in the Romantic tradition, Schiller thought that the ancient world was characterized by a now-lost sense of unity and harmony. This issue is thematized in his influential treatises *On the Aesthetic Education of Man in a Series of Letters* (1795) and *On Naïve and Sentimental Poetry* (1795/6). In the latter, Schiller distinguishes between two novel types of aesthetic response to nature and art, the titular naïve and sentimental. Cultures like Homeric and Classical Greece typically produce works of naïve art. Such art expresses their easy oneness with themselves and nature, a state in which the human being “operates as an undivided sensuous unity, as a harmonizing whole” (NA 20:436). Sentimental art, by contrast, expresses our longing for this bygone time when “we were happy and perfect” (NA 20:427). In other words, it presents such harmony, not as a fact, but as an *ideal*, and is thus the art proper to the modern world, in which the two sides of our nature—reason and feeling—have been divided and set against one another. The distinction between naïve and sentimental seems not only to have been the inspiration for the slightly later distinction between Classical and Romantic art (see Eckermann 1837 [1981, 379–80])[^eckermann-1837], but possibly also for Nietzsche’s Apollonian-Dionysian duality (Kalar 2008; cf. *BT* 2–3; NF 1870: 7[126])[^kalar-2008]. Crucially, however, Nietzsche does not see the ancient world as purely “naïve.” The Greeks’ naïveté was not a natural endowment, but an achievement—a coping mechanism developed in response to a world of unspeakable cruelty (see e.g. letter to Rohde 16 July, 1872 [SB 1872: 239]). Moreover, Nietzsche finds a degree of sentimentality already characteristic of the Greek outlook, in particular of the Dionysian mysteries (*BT* 2/KSA 1:33).
    step1: |-
      与浪漫主义传统中的后继者一样，席勒认为古代世界具有一种如今已经失落的统一感与和谐感。这一主题见于他有影响的论文《论人的审美教育书简》（1795）与《论素朴的诗与感伤的诗》（1795/6）。在后文中，席勒区分了两种新的审美反应类型，即标题所称的素朴与感伤。荷马时代与古典希腊那样的文化，通常产生素朴的艺术。这种艺术表达了它们与自身、与自然的轻易合一，在这种状态中，人“作为一个未分裂的感性统一体、作为一个和谐的整体而运作”（NA 20:436）。相形之下，感伤的艺术表达我们对那个“我们曾经幸福而完善”的逝去时代的渴望（NA 20:427）。换言之，它把这种和谐呈现为一种*理想*，而非事实，因而它是现代世界所固有的艺术——在现代世界中，我们本性的两个方面，即理性与情感，已被分裂并相互对立。素朴与感伤的区分似乎不仅启发了稍后古典艺术与浪漫艺术之间的区分（见 Eckermann 1837 [1981, 379–80]）[^eckermann-1837]，而且可能也启发了尼采的阿波罗式-狄奥尼索斯式二元性（Kalar 2008; 参 *BT* 2–3; NF 1870: 7[126]）[^kalar-2008]。然而关键在于，尼采并不把古代世界看作纯粹“素朴”的。希腊人的素朴并非天赋，而是一种成就——一种为应对一个不可言说的残酷世界而发展出来的应对机制（例如见1872年7月16日致洛德的信 [SB 1872: 239]）。此外，尼采发现某种程度的感伤性已经构成希腊人——尤其是狄奥尼索斯秘仪——的特征（*BT* 2/KSA 1:33）。
