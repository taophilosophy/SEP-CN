      What, if anything, can be said in favor of such a view, and how is it connected with Nietzsche’s criticism of disinterestedness? One suggestion is that the spectator’s standpoint cannot account for the artist’s motivation to create a work (Soll 1998, 108; Reginster 2014, 24)[^reginster-2014][^soll-1998]. This is particularly problematic if the genius is conceived along Schopenhauerian lines—as someone possessing a heightened ability for perceiving nature in the purely intellectual, will-less manner, supposedly characteristic of all aesthetic enjoyment. The question is why, having achieved this state themselves, the artist should be motivated to make it available to others in the form of an artwork. One might of course wonder what this psychological question has to do with the question of the nature of beauty. After all, it is hardly clear that a successful theory of beauty has also to explain what motivates artistic creation. A potential response, here, would be that Nietzsche operates under the general assumption, shared with Schopenhauer, that the state from which the artist creates is the same as the state that their work aims to produce (Young 1992, 120)[^young-1992]. If conceiving the latter in terms of disinterestedness cannot explain the possibility of the former, such a theory would then need to be rejected. (For a critical assessment of the argument here, see (ibid., 121–25).)
