      《悲剧的诞生》首先是试图提供一种关于悲剧的本性与价值的哲学理论，在这个意义上，它属于一个从亚里士多德《诗学》一直延伸到黑格尔《美学讲演录》及其后的传统。有两个问题一直支配着这一传统：（1）悲剧经验的价值究竟在于何处（假如它确实有价值的话）？（2）如何解释我们观看悲剧时所获得的快感？（1）之迫切，源于柏拉图在《理想国》卷十中关于悲剧腐蚀观众的论证。（2）则源于一个常见却悖谬的事实：我们从悲剧中获得的快感，依赖于怜悯、恐惧、焦虑等本质上令人不快的情绪反应。可以预料，《悲剧》确实试图回答这两个问题（（1）是贯穿全书的主题；（2）尤其见 *BT* 22/KSA 1:141–44、*BT* 24/KSA 1:152–53）。但出乎意料的是，二者都不是它真正的核心问题。尼采在此书中的主要目标，毋宁是暗示人类面临一个深刻的存在论问题，并论证悲剧（更具体地说，阿提卡悲剧及其在瓦格纳 *Musikdrama* 中被认为的再生）是解决这一问题的*唯一*方式。他对（1）与（2）的回答，于是便从这一更为一般的论证中派生出来，而不是其哲学的出发点。
