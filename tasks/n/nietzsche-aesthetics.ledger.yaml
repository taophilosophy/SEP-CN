      In these contexts, Nietzsche seems to adopt the conception of beauty, common amongst the eighteenth-century rationalists, as a kind of “perfection” or *organic* *unity* (see Hassan 2022, for a particularly sophisticated treatment of Nietzsche on organic unity; cf. Soll 1998, 102–105)[^hassan-2022][^soll-1998]. Here, beauty (or at least aesthetic value of some kind) seems to be treated as a perfectly objective property of beautiful objects rather than, say, a mere invitation to further activity. This is not to say that these two strands could not in principle be connected. Ridley (2013, 419–20), for example, emphasizes the close connection Nietzsche often draws between creativity and *form-giving*. If Nietzsche does endorse the above-mentioned Schopenhauerian view that there is a kind of parity between creative activity and the aesthetic experience, he might maintain that seeing an object as “formed chaos” is precisely what incites us to creativity ourselves.
