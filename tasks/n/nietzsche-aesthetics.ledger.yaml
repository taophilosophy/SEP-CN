      文本中不乏证据表明，尼采同时关心痛苦问题与现代文化的碎裂。我们无须执定其中之一，二者甚至彼此关联（见 Huddleston 2019, 13–14）[^huddleston-2019]。感到自己的生命缺少一处渴慕的归所，这本身就可能带来巨大的心理痛苦；反过来，若觉得我们“同在其中”，生命固有的寻常苦痛或许更易承受，于是人便去寻求这样的意义。两个问题之间还可以有更紧、更一般的联系：叔本华的悲观结论，恐怕只有在把他关于人生必然充满痛苦的论题同他拒斥传统意义叙事*合而观之*以后，才能成立。基督徒尽可承认痛苦是个难题，却仍断定此生值得一过，因为它成就了某种价值（如赎偿原罪）。如此，《悲剧的诞生》或可读作既不专论痛苦，也不专论*作为如此*的意义，而是论*无意义的痛苦*（Came 2022, 44–45）[^came-2022]。即便二者可以这样相连，侧重仍有分别：把尼采的主要关切归于叔本华式的痛苦正当性问题，还是归于浪漫派对文化兴盛的忧思，会影响到我们对《悲剧》的读法。
