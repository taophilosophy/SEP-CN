      *The Birth of Tragedy*’s debt to this Wagnerian vision is unmistakable. But Nietzsche would soon become disillusioned, and by the time of his last writings his attitude toward Wagner is overwhelmingly, even irrationally hostile. Whether this means Nietzsche jettisoned his early Wagnerian ideals, or whether he only felt Wagner, the man and the artist, failed to live up to them, is difficult to say (see Gemes 2022, 33)[^gemes-2022]. What is certain is that Wagner and his art would remain central concerns of Nietzsche’s for the duration of his career—so much so that he would devote two full books to criticizing Wagner in 1888 (*The Case of Wagner* and *Nietzsche contra Wagner*).
