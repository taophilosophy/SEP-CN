      The early Nietzsche took much from Schopenhauer. *The Birth of Tragedy* appears to operate under the assumption that Schopenhauer’s descriptive claim about suffering is true. Nietzsche also officially endorses Schopenhauer’s basic picture of aesthetic enjoyment as essentially will-less (see, e.g., *BT* 5). Schopenhauer’s metaphysical distinction between representation and will is also evidently taken on board, as is his theory of music, according to which music, unlike the other arts, is a direct “copy” the noumenal will. Matters may not be quite this straightforward, however. Some scholars have noted divergences between *The Birth*’s and Schopenhauer’s respective theories of music (Janaway 1998; Vandenabeele 2003)[^janaway-1998][^vandenabeele-2003]. And the question of whether *The Birth* accepts Schopenhauer’s metaphysics has been a subject of considerable dispute in recent years (see §2.2 below). Whatever should be said about *The Birth*, Nietzsche’s later aesthetics is clearly set up in opposition to Schopenhauer’s. In works such as *Beyond Good and Evil* (1886), *On the Genealogy of Morals* (1887), and *Twilight of the Idols* (1888), Nietzsche rejects Schopenhauer’s conception of disinterested aesthetic appreciation, as well as his more general attempt to connect aesthetic experience to the ethics of pessimism. Schopenhauer remains an important foil against which Nietzsche formulates his own aesthetic position and, precisely for this reason, his influence is never entirely absent.
