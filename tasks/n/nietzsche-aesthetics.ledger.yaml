      ## 5. Aesthetics and Physiology
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      In the *Genealogy*, Nietzsche remarks parenthetically that he will one day write a “*Physiology of Aesthetics*” (*GM* III.8), and in *The Case of Wagner* (published the following year) he refers prospectively to “a chapter of my magnum opus, which carries the title ‘toward a physiology of art’” (*CW* 7). The plan for this work never came to fruition, though some material appearing under that heading in Nietzsche’s notebooks seems to have been utilized in the writings of his final year, particularly in *Twilight of the Idols* (cf. NF 1888: 17[9], *TI* “Skirmishes” 8–11, 19–24)*.* One of the most extreme claims from this period comes in *Nietzsche contra Wagner*: “Aesthetics is indeed nothing but an applied physiology” (*NCW* “Objections”). These remarks are largely promissory, and further textual evidence for the shape of the envisioned “physiology of art/aesthetics” is relatively thin. Nevertheless, some scholars have argued that the biological sciences are central to Nietzsche’s mature aesthetic theory.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      Moore (2002, 85–111) sees Nietzsche as part of a post-Darwinian tradition of German thinkers, along e.g. with Ernst Haeckel (1834–1919), aiming for evolutionary explanations of aesthetic experience. A Darwinist interpretation is developed, in particular, in Richardson 2004 (219–70). According to Richardson, Nietzsche believes that evolution selects for a tendency to discriminate between traits associated with fitness and those not so associated, and to find pleasure in the former and displeasure in the latter (236–43; cf. Stern 2020, 58)[^stern-2020]. This reading can explain well Nietzsche’s tendency to associate aesthetic experience with sexuality (e.g., *GM* III.6; *TI* “Skirmishes” 22–23), as well as his occasional privileging of human beauty (*TI* “Skirmishes” 20). It will apparently struggle to explain why we find beautiful a vast array of things—instrumental music, abstract art, non-human animals, landscapes, etc.—that are not humans (cf. Janaway 2007, 190)[^janaway-2007]. Nietzsche might suggest that the features we find beautiful in non-human objects are those that remind us in some way of physical human beauty. Such a suggestion might be broadly in the spirit of Burke’s theory that the same general qualities which make for beautiful human bodies (smoothness, relative smallness, etc.) are the qualities which also cause us to find beautiful non-human objects. Alternatively, Nietzsche might appeal, in proto-Freudian fashion, to a sublimation of the sex-drive (e.g., *GM* III.8; cf. Moore 2002, 106–7)[^moore-2002]. As noted in the previous section, one plausible reading holds that the experience of the beautiful, for Nietzsche as for Plato, involves being spurred toward creativity. Thus, the pleasure taken in a sunset or a Beethoven symphony might be said to be “erotic” to the extent that it puts us in this general sort of state, even if it does not involve arousal or the desire for literal procreation.
    step1: TBD
    step2: TBD
