      There is ample evidence in the text that Nietzsche is concerned both with the problem of suffering and the problem of modern cultural fragmentation. One need not place exclusive emphasis on either problem, and they can even be seen as interrelated (see Huddleston 2019, 13–14)[^huddleston-2019]. The feeling that one’s life lacks some sought for place of belonging may itself be the cause of great psychological suffering. On the other hand, the ordinary suffering endemic to life might be easier to bear if one feels that we are “in it together,” so to speak, and this may prompt one to seek such meaning. It is possible to see an even tighter and more general connection between the two problems. For, arguably, Schopenhauer’s pessimistic conclusion only follows from his thesis that life is inescapably full of suffering *together* with his rejection of traditional narratives about its meaning. The Christian, for example, may admit that suffering is a problem, but still conclude that life is worth living insofar as it achieves something of value (e.g., an atonement for original sin). *The Birth of Tragedy* might then be read as occupied neither with the problem of suffering nor with the problem of meaning *as such*, but with the problem of *meaningless suffering* (Came 2022, 44–45)[^came-2022]. Even if the two issues can be seen as related in this way, there is still a question of emphasis. For, it may make a difference to our interpretation of *The Birth* whether we see Nietzsche’s main interests as stemming from the Schopenhauerian question about the justification of suffering, or from the Romantic concern with cultural flourishing.
    step1: |-
      文本中有充分的证据表明，尼采既关心痛苦问题，也关心现代文化碎片化问题。人们不必对其中任一问题作排他性的强调，二者甚至可以看作相互关联（见 Huddleston 2019, 13–14）[^huddleston-2019]。觉得自己生命缺少某种渴求的归属之地，这本身就可能造成巨大的心理痛苦。另一方面，如果一个人觉得我们“共在其中”，生命中国有的寻常痛苦或许会更容易承受，而这又可能促使他去寻求这样的意义。还可以看到两个问题之间更紧密、更一般的联系。因为，可以说，叔本华的悲观主义结论，只有把他关于生活不可避免地充满痛苦的论题与他拒斥关于生活意义的传统叙事*结合起来*，才能推得出来。例如，基督徒可能承认痛苦是个问题，却仍然得出结论说，生活值得过，因为它成就了某种有价值的东西（例如对原罪的赎偿）。于是，《悲剧的诞生》或许可以被读作既不关心痛苦问题、也不关心*作为这样的*意义问题，而是关心*无意义的痛苦*这一问题（Came 2022, 44–45）[^came-2022]。即便两个问题可以这样关联起来看，仍然存在侧重问题。因为，我们究竟把尼采的主要兴趣看作源自叔本华式的关于痛苦之正当性的问题，还是源自浪漫主义对文化繁荣的关切，这可能会影响我们对《悲剧》的阐释。
