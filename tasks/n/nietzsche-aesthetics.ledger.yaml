      《悲剧的诞生》最著名的方面，无疑是尼采关于“阿波罗式”与“狄奥尼索斯式”的区分。这两个术语最初被引入时（*BT* 1、2），是作为两种“*艺术冲动*”（*Kunsttriebe*）的名称，它们本来就在自然中起作用，随后才被派生地同不同的艺术范式联系起来。以“形式”为业的、典型再现性的艺术（绘画、雕塑、史诗）与阿波罗相联系，而典型非再现性的、或更典型地“表现性的”艺术（音乐与抒情诗）则与狄奥尼索斯相联系。尼采在《悲剧》中的主要主张之一是：希腊悲剧是一种独特的混合艺术形式，它结合并统一了阿波罗式与狄奥尼索斯式的冲动。前者显现在戏剧对话与行动中，后者则在合唱队的音乐伴奏中找到表达。
