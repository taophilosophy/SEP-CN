      那么，那个问题究竟是什么？自然的建议是把它定位在叔本华的悲观主义中（例如 Young 1992, 26–9; Young 2006, 14–15; Soll 1990, 1998; Came 2005）[^came-2005][^soll-1990][^young-1992][^young-2006]。叔本华的悲观主义把这样一个描述性论题——生活必然包含多于幸福的痛苦——与一个规范性论题结合起来：因此生活不值得过，或者说不存在优于存在。尼采反复提及所谓“西勒诺斯的智慧”（*BT* 3/KSA 1:35, *BT* 4/KSA 1:39–41, *BT* 7/KSA 1:57, *BT* 24/KSA 1:151），这强烈表明这才是他的主要关切。这一“智慧”——见于亚里士多德一部佚失对话的残篇（见 *F 44 R³* [Aristotle *CW*, 2401–2]），并在索福克勒斯笔下有所暗指（见《俄狄浦斯在科罗诺斯》，1211）——是说：“对你而言最好的事物完全不可企及：从未出生，不曾*存在*，成为*虚无*。但第二好的，是——早死”（*BT* 3/KSA 1:35）。按照这一解读，尼采接受了悲观主义的描述性论题，并且相信公元前6世纪与5世纪的希腊人已认识到它的真理。那么，问题就在于如何回应“存在的恐怖与惊骇”（*BT* 3/KSA 1:35）；最好的答案就包含在希腊悲剧之中（具体说，是埃斯库罗斯与索福克勒斯的悲剧）。人们或许会设想，另一种也许更可取的表述方式，是把问题表述为如何*克服*“存在的恐怖与惊骇”，或者如何接受悲观主义的描述性论题而拒绝西勒诺斯（以及叔本华）关于人类生命价值的判定。但如下文（见 §2.3）所论，一些学者相信《悲剧》在某种意义上仍然坚持叔本华关于生命价值的否定性判定。就目前而言，重要的是：按此提议，尼采把*痛苦*——尤其是它的普遍与不可摆脱——视为我们面临的主要问题。
