      A contrasting approach to Nietzsche’s views on artistic falsity is developed by Stoll (2019; cf. Page 2024)[^page-2024]. According to this approach, Nietzsche’s primary interest is in mimetic falsity, in the fact emphasized by Plato that much art is centrally occupied with imitating, with producing semblances or simulacra of the things it depicts. It was, recall, this sense of falsity that was at issue in Schiller’s conception of *Schein* (see §1.3 above), which had been important for Nietzsche since early in his career. Nietzsche can thus consistently say that art is false while denying that it should falsely beautify things; its falsity is a function of the medium not the representational content. Divorced as it is from the content of specific works, this account of artistic falsehood can arguably make good sense of the tight connection Nietzsche seems to see between art and illusion (though certain artforms, such as music or architecture, may still pose problems). It also suggests that the aim of art is not to instil in us a set of false, but useful beliefs. Instead, art glorifies or celebrates illusion and falsity themselves, inviting us to reconsider our—mostly negative and, Nietzsche thinks, unhealthy—attitude toward them. Stoll argues that this interpretation allows us to locate the underlying consistency between Nietzsche’s ideal of uncompromising honesty and his valorization of art in a way that does not require the balancing approach suggested by Ridley and Anderson (Stoll 2019, 339–42)[^stoll-2019].
