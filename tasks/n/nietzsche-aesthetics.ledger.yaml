      席勒与其浪漫主义后继者一样，认为古代世界有一种今已失落的统一与和谐。此意在《论人的审美教育书简》（1795）与《论素朴的诗与感伤的诗》（1795/6）两部有影响的论文中得到主题化处理。后一篇区分了两种新的审美反应类型，即以标题所称的素朴与感伤。荷马时代与古典希腊那样的文化，通常产生素朴的艺术，其中透出人与自身、与自然的轻易合一，此时人“作为一个未分裂的感性统一体、作为一个和谐的整体而活动”（NA 20:436）。感伤的艺术则表达我们对那个“我们曾幸福而完善”的往昔的渴慕（NA 20:427）。换言之，它把这种和谐当作*理想*而非事实来呈现，因而正是属于现代世界的艺术——在现代世界里，我们本性的两面即理性与情感已分道扬镳、彼此对峙。素朴与感伤之分似乎不仅启发了稍后古典艺术与浪漫艺术之别（见 Eckermann 1837 [1981, 379–80]）[^eckermann-1837]，或许还启发了尼采的阿波罗式与狄奥尼索斯式二元（Kalar 2008; 参 *BT* 2–3; NF 1870: 7[126]）[^kalar-2008]。但要点在于：尼采并不把古代世界看作纯然“素朴”的。希腊人的素朴不是天赐，而是成就，是面对一个残酷得难以言说的世界发展出来的应对之法（例如见1872年7月16日致洛德的信 [SB 1872: 239]）。尼采还发现，希腊人的心态——尤其狄奥尼索斯秘仪——已带有几分感伤色彩（*BT* 2/KSA 1:33）。
