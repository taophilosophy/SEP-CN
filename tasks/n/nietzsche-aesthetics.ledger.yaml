      While a reasonable conclusion to draw from the above passage taken in isolation, this suggestion is surprising, given the later Nietzsche’s clear opposition to Schopenhauer’s metaphysics and his ideal of self-transcendence. Those wishing to resist this conclusion might note that the passage concludes a chapter entitled “What I Owe to the Ancients,” in which Nietzsche attempts to summarize the influence that his studies of antiquity have had on his broader thought. It is possible that he here intends only to be recalling rather than reasserting the position of *The Birth of Tragedy*, and to be emphasizing that some elements of his later thought—his opposition to Schopenhauer’s pessimism, his view that life must be affirmed in spite of its “terror and absurdity”—were already nascent there. There are difficulties that such a reading would need to meet (see Ridley 2019, 321–22)[^ridley-2019], but the impression that the above passage does not exactly capture Nietzsche’s mature view is reinforced by the fact that he elsewhere presents an apparently quite different conception of tragedy:
