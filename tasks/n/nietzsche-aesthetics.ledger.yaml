      Yet, *The Birth* does not speak unequivocally in favor of this “optimistic” reading. For example, Nietzsche also says that tragedy contains “a profound and *pessimistic* worldview,” and communicates to us “the conception of individuation as the primordial ground of evil, … the hope that the spell of individuation may be broken” (*BT* 10/KSA 1:73). That suffering arises from the pursuit of one’s individual interests and that salvation lies in freeing oneself from these interests by piercing the “veil” of individuation is, of course, precisely Schopenhauer’s position. This Schopenhauerian interpretation of tragedy is especially prominent in Nietzsche’s 1870 lecture course on *The Tragedy of Sophocles*, where he states bluntly “life appeared no longer as worth living. Tragedy is pessimistic” (KGA II.3, 10) and that Sophocles’ “teaching is unconditional submission and resignation” (KGA II.3, 27). Elsewhere he straightforwardly identifies “the content of the tragic myth” with “the wisdom of Silenus” (*BT* 24/KSA 1:151)—the view that the best thing for human beings is never to have been born. And, after telling us that tragedy aims at transfiguration, he clarifies that what it transfigures is “least of all the ‘reality’ of this world of appearance, for it says to us precisely: ‘Look! Look closely! This is your life! This is the hour hand on the clock of your existence!” (*ibid.*). These seem odd ways, to put it mildly, of expressing the idea that life is, in spite of it all, justified and worth living. Proponents of a pessimistic reading can also point to evidence that Nietzsche thinks both Apollonian art and tragedy “justify” existence only by means of *illusions* (e.g., *BT* 18/KSA 1:115–16). For if, as this may suggest, art helps us affirm life only by deceiving us about its quality, “this implies that in the fullness of knowledge one would *not* affirm life as worth living. It implies, more briefly, that life is not worth living” (Young 1992, 48)[^young-1992].
