      德国浪漫主义对早期尼采的影响还来自其他方面。尤值得一提的是 A.W. 施莱格尔，尼采在写作《悲剧的诞生》之前曾仔细研读其《论戏剧艺术与文学讲演录》（Schlegel *VKL*）（见 NF 1869: 1[85]–1[105]）。施莱格尔关于悲剧合唱队的构想及其对希腊神话的阐释，影响了尼采在《悲剧》中的呈现；尼采对欧里庇得斯的许多著名攻击，也已在《讲演录》中初具轮廓（尽管两者很可能也都借鉴了更早的批评传统）。同样重要的还有诗人弗里德里希·荷尔德林（1770–1843），他是尼采少年时代所喜爱的诗人，也可能是其著名的阿波罗式与狄奥尼索斯式区分的来源之一（Young 2013, 96–98）[^young-2013]。关于尼采与瓦格纳在思想与私人关系上的联系，可参看 Köhler 1998；Young 2010, 105–34, 2014, 131–40；以及 Scruton 2014。关于尼采与更广泛的浪漫主义传统的近期处理，见 Williamson 2004, 234–84、Ameriks 2012 与 Gemes 2023。
