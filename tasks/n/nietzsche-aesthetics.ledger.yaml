      Will-Monism, together with a broadly Epicurean theory maintaining that willing is a source of ceaseless suffering, underwrites a key descriptive claim of Schopenhauer’s philosophy: human life necessarily involves more suffering than pleasure or happiness. From this descriptive claim, Schopenhauer infers his major normative thesis, the doctrine of philosophical pessimism: life is not worth living, or, the world’s non-existence would be preferable to its existence (for an excellent in-depth treatment of Schopenhauer’s arguments for pessimism, see Simmons 2024)[^simmons-2024]. Inspired by (certain versions of) Christianity and Buddhism, Schopenhauer holds the appropriate response to this pessimistic truth to be “denial of the will to life,” understood as the ascetic repudiation of desire. Schopenhauer’s aesthetics is best understood against the backdrop of this pessimistic ethics and its attendant metaphysics.
    step1: |-
      意志一元论，连同一种大体上属于伊壁鸠鲁式的理论——该理论主张意愿是无尽痛苦的根源——共同支持了叔本华哲学的一个关键描述性主张：人类生活必然包含多于快乐或幸福的痛苦。从这一描述性主张出发，叔本华推出其主要的规范性论题，即哲学悲观主义的学说：生活不值得过，或者说，世界的不存在会优于其存在（关于叔本华为悲观主义所作论证的出色深入处理，见 Simmons 2024）[^simmons-2024]。受（某些版本的）基督教与佛教的启发，叔本华认为对这一悲观主义真理的恰当回应是“否定求生的意志”，其含义即对欲望的禁欲式弃绝。叔本华的美学最好放在这一悲观主义伦理学及其相伴的形而上学背景下来理解。
    step2: |-
      意志一元论再加上一种大体属伊壁鸠鲁式的理论——意愿乃是无尽痛苦的根源——便支撑起叔本华哲学的一个关键描述性论断：人的一生必然苦多于乐、痛多于福。由这一描述性论断，叔本华推出其主要的规范性论题，即哲学悲观主义之说：生命不值得过；或者说，世界不如不存在。依（某些版本的）基督教与佛教，叔本华以为对治这一悲观真理的恰当办法是“否定求生意志”，也就是以禁欲的方式弃绝欲望。要理解叔本华的美学，最好以此为背景，连同与之相配的形而上学（关于叔本华为悲观主义所作论证的深入而精到的处理，见 Simmons 2024）[^simmons-2024]。
