      Interpreters diverge over the question of *The Birth*’s commitment to Schopenhauer’s pessimism just as they do over its commitment to his metaphysics. One natural view, supported especially by some of Nietzsche’s retrospective comments about *The Birth*, holds that the book contains a “complete rejection of the normative ethics of pessimism” (Nussbaum 1999, 362; cf. Kaufmann 1974, 131; Schacht 2001; Soll 1998, 100–101; Ridley 2019, 318–19)[^nussbaum-1999][^ridley-2019][^schacht-2001][^soll-1998]. A competing view maintains that Nietzsche in fact “endorsed Schopenhauer’s inference from the pain and purposelessness of human existence to its worthlessness” (Young 1992, 26; cf. Young 2006, 15–16; Geuss 2012, 47, 61; Huddleston 2019, 15, 19)[^geuss-2012][^huddleston-2019][^young-1992][^young-2006]. Predictably, decisive textual evidence in favor of either reading proves elusive. To be clear, the disagreement is not over whether Nietzsche accepts the descriptive pessimistic thesis that suffering is life’s fundamental constituent—it is generally agreed that the early Nietzsche is pessimistic in this sense. Rather, the disagreement concerns his answer to the normative question of whether life is, or is not, deserving of negation, whether it would be better not to be.
