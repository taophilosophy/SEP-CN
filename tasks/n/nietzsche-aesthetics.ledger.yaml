      叔本华对早期尼采的影响固然关键，但若说它完全压倒一切，则会误导。或许同等重要的，是作曲家兼剧作家理查德·瓦格纳（1813–1883）的影响。在拜罗伊特节日剧院（*Festspielhaus*）的筹划与建造期间，尼采与瓦格纳相识，并与之保持友好乃至亲密的关系。在这一时期（约1869–1876），尼采不仅对瓦格纳的艺术成就与计划印象深刻，也对瓦格纳为其艺术事业建立理论框架的尝试深为敬佩。当两人结识时，瓦格纳本人已皈依叔本华哲学，尤其倾心于叔本华的音乐理论（瓦格纳将在《贝多芬》（1870）中阐述这一理论的一种颇有个性的版本）。然而，瓦格纳的审美思想——包含在四十年间写成的卷帙浩繁、艰深难读的理论著作中——相当多变，其得益于德国浪漫主义旧传统的，至少不亚于得益于叔本华。瓦格纳哲学中有两个要素值得在此强调：他关于“总体艺术作品”的观念，以及他关于“新神话”的构想。
