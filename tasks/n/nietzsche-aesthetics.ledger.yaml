      A third critical influence on Nietzsche’s early aesthetics was the German poet, dramatist, historian, and philosopher Friedrich Schiller. That Nietzsche felt an affinity with Schiller at this period of his career is hardly surprising—Schiller was generally recognized as a “German Shakespeare”, a consummate master of the artform that most interested the young philology profressor; Schiller’s theoretical works were amongst the most important sources of inspiration for the younger Romantic generation that had in turn inspired Wagner’s thought; and Schopenhauer and German pessimists also often enlisted Schiller as a key predecessor (Beiser 2018)[^beiser-2018]. Above all, the period of artistic collaboration between Schiller and Goethe, the extraordinary era of Weimar Classicism, seemed to hint at the true creative potential of the “German spirit”—potential which Nietzsche thought was being squandered on staid academic specialism and crude, militaristic nationalism.
