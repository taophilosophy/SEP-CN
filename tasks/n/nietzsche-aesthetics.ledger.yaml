      一种竞争性的提议则把*意义*的缺失——尤其是赋予意义的文化制度的缺失——视为尼采所面对的主要问题，而非痛苦本身（Gemes & Sykes 2014, 2015; 参 Tanner 2000, 8）[^gemes-2014][^tanner-2000]。例如，Gemes 与 Sykes 把尼采在《悲剧》中的方案解读为更多受到瓦格纳与浪漫主义传统而非叔本华的启发（Gemes & Sykes 2014, 100–101）[^gemes-2014]。如前所述，那一传统认为现代性的特征在于一种“无家可归感”，即一种日益增长的感觉：我们在世界上不再有“归属”之地。按照这一解读，尼采主要被同类的关切所驱动。而他在《悲剧》中的目标，是表明悲剧节庆如何能够帮助文化获得一种总体的、统一性的“神话”世界观，从而恢复我们失去的归属感。因此，尼采在批判性地评论德国文化的当代状况时说：“没有神话，任何文化都会丧失其健康的、创造性的自然力量；只有被神话环绕的地平线才能把整个文化运动带向统一”（*BT* 23/KSA 1:145）。
