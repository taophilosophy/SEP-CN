      Here, Nietzsche appears to be sounding a theme that was with him since *The Birth of Tragedy*—that art is one of humanity’s fundamental means for coping with the suffering endemic to life. Now, however, he comes to think that not all suffering is equal; some suffering is “healthy,” while other suffering is “sick.” Nietzsche clearly signals his approval for art that responds to suffering of the former kind. Note, however, that this need not mean he disapproves of the latter sort of art on functional grounds; such art may be genuinely good for those who need it, and otherwise innocuous. Instead, his objection may be to the fact that such art perforce expresses an evaluative outlook of which he disapproves (cf. Ridley 2007, 124)[^ridley-2007].
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      In still other contexts, Nietzsche develops this general idea in the direction of what appears to be an unusual form of aesthetic non-cognitivism. After claiming that “aesthetics is irrevocably tied to these biological presuppositions [of ‘ascending’ or ‘declining’ life],” he suggests that “these opposing forms in the optics of values … are ways of seeing, which one cannot get at with reasons and refutations. ... One does not refute a disease of the eye. ... The concepts ‘true’ and ‘untrue,’ it seems to me, have no meaning in optics” (*CW* Epilogue). The suggestion appears to be that, when we make judgments of the form ‘x is beautiful,’ we are not making truth-apt claims so much as expressing our general (“healthy” or “diseased”) evaluative perspective. It is not obvious, however, that the passage must be read in this irrealist way. The image of the diseased eye, e.g., seems to imply that some such perspectives are wrong or distorted. And the insistence that “reasons and refutations” are out of place in the context of aesthetic disagreement might simply be a way of indicating that they are dialectically *ineffective*, not that they are conceptually inappropriate.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      However one resolves these various unclarities, the important point is that Nietzsche’s idea for a “physiology of aesthetics” may be about looking at art from a diagnostic perspective, rather than investigating its evolutionary origins (though, of course, it is also possible that it be both; see Moore 2002 (165–92) for an interpretation along these lines). Now, much of Nietzsche’s language here—which calls to mind 19ᵗʰ-century “degeneration theory” and its connections with racism, misogyny, and eugenics—is rather ugly. One might wonder how literally he intends such talk—whether he really believes, e.g., that Wagner’s art is the product of some physiological malady, or whether the notions of health and sickness are being used more metaphorically. The latter option is bound to seem more attractive to contemporary readers, though it should be borne in mind that degeneration theories enjoyed wide acceptance in Nietzsche’s day, and he may well have taken them seriously in a way that we cannot. Discussing this issue in any depth would take us far beyond the ambit of this entry. But, it bears mentioning that Nietzsche, atypically for a nineteenth-century degeneration theorist, often does not treat degeneration as unqualifiedly bad (Gemes 2021)[^gemes-2021]. He will even suggest, paradoxically, that “sickness itself can be a stimulus to life” (*CW* 5).
