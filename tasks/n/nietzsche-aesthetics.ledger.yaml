      One of the more significant developments Nietzsche’s aesthetics undergoes in the time between *The Birth* and his later works concerns the idea of disinterested aesthetic appreciation. While the early Nietzsche apparently accepts some version of the thesis that aesthetic pleasure is disinterested, he consistently rejects it by at least 1886 (e.g., *BGE* 33; though, for a dissenting view according to which Nietzsche’s later aesthetics is still wedded to a broadly Schopenhauerian version of aesthetic disinterest, see (Denham 2014)[^denham-2014]). The best-known discussion of this issue in the later works comes in *GM* III.6, where it is connected with an intriguing, albeit obscure, criticism of aestheticians—Kant and Schopenhauer are singled out in particular—who take their cue “purely from the standpoint of the ‘spectator’ [*vom* *‘Zuschauer’ aus*]” (KSA 5:346).
    step1: TBD
    step2: TBD
