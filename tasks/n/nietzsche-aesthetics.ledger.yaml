      早期尼采从叔本华那里取用了许多。《悲剧的诞生》似乎是在假定叔本华关于痛苦的描述性主张为真的前提下运作的。尼采也正式认可叔本华关于审美享受本质上是无意愿的基本图景（例如见 *BT* 5）。叔本华关于表象与意志的形而上学区分显然也被接受，其音乐理论同样如此：按照该理论，音乐与其他艺术不同，是本体意志的直接“摹本”。然而，事情可能并不如此简单。一些学者已经注意到《悲剧》与叔本华各自音乐理论之间的分歧（Janaway 1998; Vandenabeele 2003）[^janaway-1998][^vandenabeele-2003]。而《悲剧》是否接受叔本华的形而上学这一问题，近年来一直是相当多争论的主题（见下文 §2.2）。无论关于《悲剧》应当怎么说，尼采后来的美学显然是在与叔本华的对立中建立起来的。在《善恶的彼岸》（1886）、《论道德的谱系》（1887）与《偶像的黄昏》（1888）等著作中，尼采拒斥叔本华关于无利害审美欣赏的观念，也拒斥他更一般的试图把审美经验与悲观主义伦理学联系起来的努力。叔本华始终是尼采借以形成自己审美立场的重要对照，正因如此，他的影响从未完全缺席。
