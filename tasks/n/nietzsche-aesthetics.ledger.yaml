      In addition to its critical reflections on earlier aesthetic theories, *GM* III.6 also gives us some indication of Nietzsche’s own positive account of beauty or positive aesthetic value. The section quotes approvingly a claim from Stendhal’s *Rome, Naples et Florence* (1817) that “the beautiful is a promise of happiness,” and Stendhal is said to constitute, in contrast to Kant and Schopenhauer, a “*genuine* spectator.” One important question, here, is whether the fact that Stendhal is called a “spectator” means that Nietzsche regards even his definition of beauty as in some sense deficient (Ridley 2011)[^ridley-2011]. Most, however, take Nietzsche to be adopting Stendhal’s definition. What, then, is the import of this definition? In his later works, Nietzsche often associates the experience of beauty with the feeling of power and with erotic arousal. A particularly developed interpretation focusing on these associations is (Reginster 2014; cf. Soll 1998; Ridley 2011, 319–25)[^reginster-2014][^ridley-2011][^soll-1998]. Reginster’s reading takes inspiration from Nehamas’s recent theory of beauty (2007). According to this theory, to find something beautiful is not to experience or judge it to be of positive value—aesthetic experience is not a “verdict.” To find something beautiful is rather to be impelled to continue engaging with it, to get to know it better. The version of this theory that Reginster locates in Nietzsche holds similarly that to find something beautiful is, not to find oneself in a state of passive enjoyment, but to be impelled by it toward “*new artistic creation*” (2014, 31). This sort of account offers a way of making sense of Nietzsche’s somewhat surprising approval (*TI* “Skirmishes” 22–23) of Plato’s definition of love in the *Symposium* as “reproduction and birth in beauty” (206e). Here, one might think too of the way in which we speak both of artistic geniuses as “inspired,” and of their works as “inspiring.” It also promises to cast further light on Nietzsche’s dissatisfaction with conceptions of aesthetic pleasure as disinterested. If we assume that activity is inherently interested, and if to find something beautiful is to be impelled by it to some kind of activity, then it would seem appreciation of the beautiful could not be disinterested. (For another sophisticated account of Nietzsche’s conception of beauty that emphasizes the dimension of erotic arousal, see Leiter 2018, and for a compelling proposal connecting it to Nietzsche’s remarks about glorification and praise, Fox 2020.)[^fox-2020][^leiter-2018]
