      How can proponents of the more orthodox metaphysical reading respond to these apparently compelling pieces of evidence? With respect to the first, some have suggested that, while Nietzsche did reject Schopenhauer’s identification of the thing-in-itself with the Will on the grounds that the former is completely unknowable, he still cleaved for a time to the basic dichotomy between a monistic Will and a spatiotemporal realm of discrete individuals. On this revised Schopenhauerian reading, the Will itself is degraded to the status of an appearance, but an appearance that “provides a deep*er* account of the world than its description in terms of material bodies… . ‘Will’ is, then, … a description of penultimate rather than ultimate reality” (Young 2010, 92; cf. Ridley 2007, 26)[^ridley-2007][^young-2010]. Julian Young has suggested that this sort of view in fact represents the position of the later Schopenhauer himself (2010, 92; 2005, 96–98), thus making *The Birth*’s metaphysical picture still genuinely Schopenhauerian. (Whether the later Schopenhauer actually degrades the Will to the status of an appearance in this way is, of course, controversial (see, e.g., Janaway 1999, 162–63; Özen 2021, 261–63)[^janaway-1999].)
