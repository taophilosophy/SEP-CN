      1792至1803年间，席勒还就悲剧写了大量文字。他的论文《论悲剧中合唱队的运用》预示了《悲剧》的一个核心主张：悲剧合唱队对于正当的悲剧体验是本质性的。他论证说，合唱队使悲剧观众得以对剧情采取一种“有距离的”视角，把它看作诗人想象的理想化产物，而非对现实的粗陋模仿（关于这一观点的进一步讨论见 Stoll 2022）[^stoll-2022]。尼采在其关于索福克勒斯的讲演中以及在《悲剧的诞生》本身中，都明确认可席勒对合唱队的说明（KGA II.3, 25–27; *BT* 7/KSA 1:54–55）。他也不能忽视席勒在致歌德信中的一句话：“我一直对歌剧抱有某种信念——悲剧将从中发展为一种更高贵的形式，正如它当年从古代酒神节合唱队中发展出来一样”（NA 29:179; 参 NF 1871: 9[83]）。然而，对于席勒关于悲剧快感的说明，尼采则更为挑剔。在《论悲剧对象欣赏的根据》与《论崇高》等论文中，席勒主张我们从悲剧中获得的快感是崇高感的一种形式。他提出，悲剧英雄典型地为某种更高原则而牺牲自己的福祉乃至生命（索福克勒斯同名剧中的安提戈涅即是一例）。而这以某种方式使观众意识到自身也有类似的力量，席勒认为这就是康德所说的先验自由的能力。正是这种意识构成了我们在悲剧中的快感。因此，席勒的策略是把康德的“力学的崇高”概念应用于悲剧：按照这一概念，一个“反目的的”对象可以通过激发我们对道德官能之力量的认识而给我们一种崇高感。在《悲剧》中，尼采确实暗示悲剧快感是崇高感的一个种（*BT* 7/KSA 1:57），但他明确拒绝以“道德上崇高的”东西来解释它（*BT* 24；评论见 Raymond 2014）[^raymond-2014]。
