      Between 1792 and 1803, Schiller also wrote extensively about tragedy. His essay “On the Use of the Chorus in Tragedy,” prefigures a central claim of *The Birth*—that the tragic chorus is essential to the proper experience of tragedy. The chorus, he argues, allows the spectators of a tragedy to adopt a “distanced” perspective on the drama and to view it as an idealized product of the poet’s imagination rather than a crude imitation of reality (see Stoll 2022 for further discussion of this view)[^stoll-2022]. In both his lectures on Sophocles and in *The Birth of Tragedy* itself, Nietzsche explicitly endorses Schiller’s account of the chorus (KGA II.3, 25–27; *BT* 7/KSA 1:54–55). Nor could he ignore Schiller’s remark in a letter to Goethe that “I have always had a certain faith in the opera—that tragedy would develop out of it into a nobler form, just as it did from the choruses of the ancient Bacchic festivals” (NA 29:179; cf. NF 1871: 9[83]). Of Schiller’s account of tragic pleasure, however, he is more critical. In essays such as “On the Ground of the Enjoyment in Tragic Objects” and “On the Sublime,” Schiller argues that the pleasure we take in tragedy is a form of the sublime. Tragic heroes, he suggests, paradigmatically sacrifice their well-being or even their lives for the sake of some higher principle (the Antigone of Sophocles’ eponymous play is a good example). And this somehow makes the audience aware of a similar power in themselves, which Schiller takes to be the Kantian faculty of transcendental freedom. It is this awareness that constitutes our pleasure in tragedy. Schiller’s strategy is thus to apply to tragedy Kant’s notion of the “dynamically sublime,” according to which a “counter-purposive” object can give us a feeling of ennoblement by stimulating awareness of the power of our moral faculties. In *The Birth*, Nietzsche does suggest that tragic pleasure is a species of the sublime (*BT* 7/KSA 1:57), though he explicitly refuses an explanation in terms of “the morally sublime” (*BT* 24; for comment, see Raymond 2014)[^raymond-2014].
