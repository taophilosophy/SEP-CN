      As with his attitude toward Schopenhauer and Wagner, Nietzsche’s feelings toward Schiller would sour in his later years. During these years there is little explicit engagement with Schiller, and when his name is mentioned, he is dismissed as a “moral trumpeter” (*TI* “Skirmishes” 1). However, a number of scholars have made the case that elements of Schiller’s thought, and the broader German Classicist tradition to which it belongs, continue to exercise considerable influence on Nietzsche beyond *The Birth of Tragedy* (see Martin 1996; Bishop & Stephenson 2005; Katsafanas 2011; Stoll 2019; and Lichtenstein 2019)[^bishop-2005][^katsafanas-2011][^lichtenstein-2019][^martin-1996][^stoll-2019]. Noteworthy is that Nietzsche’s emphasis on the importance of artistic *Schein* would continue into his later works, as would his positively valanced use the term ‘naïve’ in reference to members of the ancient nobility (*GM* I.10/KSA 5:272, *GM* II.7/KSA 5:304).
