      The influence of German Romanticism on the early Nietzsche came from other quarters too. Of particular importance is A.W. Schlegel, whose *Lectures on Dramatic Art and Literature* (Schlegel *VKL*) Nietzsche read carefully prior to writing *The Birth of Tragedy* (see NF 1869: 1[85]–1[105]). Schlegel’s conception of the tragic chorus and his interpretation of Greek mythology influenced Nietzsche’s presentation in *The Birth*, and many of Nietzsche’s notorious broadsides against Euripides are prefigured in the *Lectures* (though both are likely drawing on an older critical tradition as well). Also of importance was the poet Friedrich Hölderlin (1770–1843), a favorite of Nietzsche’s as a schoolboy and one possible source for his famous distinction between the Apollonian and the Dionysian (Young 2013, 96–98)[^young-2013]. Studies of Nietzsche’s intellectual and personal connections to Wagner include Köhler 1998; Young 2010, 105–34, 2014, 131–40; and Scruton 2014. For recent treatments of Nietzsche and the wider romantic tradition, see Williamson 2004, 234–84, Ameriks 2012, and Gemes 2023.
