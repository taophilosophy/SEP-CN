      A competing proposal instead views lack of *meaning*—in particular, the lack of meaning-conferring cultural institutions—as the main problem to which Nietzsche addresses himself, and not suffering per se (Gemes & Sykes 2014, 2015; cf. Tanner 2000, 8)[^gemes-2014][^tanner-2000]. Gemes and Sykes, e.g., read Nietzsche’s project in *The Birth* as inspired more by Wagner and the Romantic tradition than by Schopenhauer (Gemes & Sykes 2014, 100–101)[^gemes-2014]. As noted above, that tradition saw modernity as characterized by a kind of “homelessness”—a growing sense that we no longer have a place of “belonging” in the world. On this reading, Nietzsche is animated mainly by the same sorts of concerns. And his aim in *The Birth* is to show how the tragic festival can help us regain our lost sense of belonging by providing our culture with an overarching, unifying “mythic” worldview. Thus, remarking critically on the contemporary state of German culture, Nietzsche says that “without myth, every culture forfeits its healthy, creative natural power; only a horizon encircled by myth brings a whole cultural movement to a unity” (*BT* 23/KSA 1:145).
