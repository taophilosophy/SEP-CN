      In the works written between 1878 and 1887, the impression is strong that Nietzsche is experimenting with various accounts (cf., *HH* I.103, 166, *D* 172) of tragic experience without having settled on a considered, developed view (though, see Prince 1998 and Kirwin 2023 for contrasting assessments)[^kirwin-2023][^prince-1998]. Noteworthy too is the fact that in this period Nietzsche makes few claims for the positive value tragedy. Matters change somewhat dramatically in the works of his final productive year, especially *Twilight of the Idols*. Here, Nietzsche devotes much more sustained attention to the tragic artform and is once again keen to insist on its central importance to his ethical outlook. One question that arises in this connection is whether this renewed focus on tragedy also brings with it a return to *The Birth*’s substantive doctrines. Young (1992, 136–39) and Ridley (2007, 126–27; 2019), in particular, have argued that it does. Consider, for example, the following suggestive, but characteristically gnomic, passage:
    step1: TBD
    step2: TBD
