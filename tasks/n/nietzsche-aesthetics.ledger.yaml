      In this respect, then, the lesson Nietzsche thinks tragedy teaches us closely resembles Leibniz’s response to the problem of evil (1697 [1989, 153]; on analogies between Nietzsche’s project and traditional projects in philosophical theodicy, see esp. Came 2004, 2005, 2022; May 2011)[^came-2004][^may-2011]. The mechanism by which Nietzsche thinks tragedy communicates this lesson is obscure. However, the basic idea relies on his idea that Greek spectators identified, not with the characters on the stage, but with the tragic chorus, and from this perspective experienced the drama as a mere ephemeral “vision” (*BT* 8). And just as the chorus-audience relates to the spectacle on the stage, so too does the primal unity relate to the empirical world as a whole. The analogy, then, intimates to the audience something of their metaphysical-cum-aesthetic significance (*BT* 8, 10).
