    kind: body
    source: |-
      Zangwill (2013) provides one plausible set of answers to these sorts of questions. On his reading, Nietzsche’s objection to Kantian aesthetics concerns more its emphasis on the universality of judgements of taste than their disinterestedness (though, of course, the two issues are not unrelated for Kant). More specifically, Nietzsche’s main target, on this reading, is the idea that beauty is *universally available*. Nietzsche need not be read as claiming that no beauty is so available, only that “some beauty, higher beauty, can be grasped only by a select few” (Zangwill 2013, 84)[^zangwill-2013]. This yields one potential way of understanding the objection to aesthetic disinterest and its connection with the spectator. The thought would be that there are some types or instances of beauty which are best or only accessible through “enhanced ecstatic experiences” (ibid., 90), not through dispassionate reflection. And if it is specifically artists who are capable of such experiences, or who are most saliently aware of having had such experiences, then there is reason to find fault with an aesthetics that focuses solely on the experience of the artistic laity. This account, of course, raises questions of its own. Why, for example, should the “select few” capable of grasping higher beauty be identified with artists? And why should disinterested aesthetic experience itself not also be the province of a select few? Even if Kant is right that I can only legitimately require agreement from everyone if my aesthetic judgment is disinterested, it might still be the case that, as a matter of fact, most are unable to judge disinterestedly. Schopenhauer, for one, appears to think that the capacity for genuine will-less cognition is exceedingly rare.
