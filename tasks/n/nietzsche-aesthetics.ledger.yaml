      For our purposes, the most important claim of Schopenhauer’s aesthetics is that the pleasure we take in art (and beauty more generally) is a disinterested one. When confronted with a beautiful object, Schopenhauer thinks, our consciousness becomes possessed, so to speak, by its purely objective properties, focusing simply on *what* the object itself is (or the “Platonic idea” it expresses) rather than on its relations to other objects. This means, amongst other things, that aesthetic appreciation ignores the relations the object has to our will, i.e. how it conduces to or impedes the satisfaction of our subjective interests. Schopenhauer puts a peculiar twist on this relatively common modern conception of aesthetic appreciation by conceiving of such enjoyment as a *silencing* of the will. Since willing, for Schopenhauer, is a—indeed *the*—source of suffering, aesthetic pleasure constitutes a relief from the burden of our existence. Aesthetic experience, then, resembles and, so to speak, presages salvation from the world and its ills, which is to be attained through asceticism (see, e.g., Shapshay 2024)[^shapshay-2024]. Though such will-lessness is a feature of all aesthetic appreciation, the negation of the will is overtly thematized in *tragedy*, and Schopenhauer accordingly reserves particularly high praise for this artform. Tragedy makes “palpable the futility of human striving and the nothingness of this whole existence in a great and striking example, thus revealing the deepest meaning of life; this is why tragedy is acknowledged to be the most sublime form of literature” (*SW* 3:730–31/*WWR* 2:651). It is Schopenhauer’s own pessimistic philosophy, then, which constitutes the ultimate content of the tragic genre.
    step1: |-
      就我们的目的而言，叔本华美学中最重要的主张是：我们从艺术（以及更一般地从美）中获得的快乐是无利害的。叔本华认为，当我们面对一个美的对象时，我们的意识可以说被其纯粹客观的性质所占据，仅仅专注于对象自身是什么（或它所表达的“柏拉图式理念”），而非它与其他对象的关系。这意味着，除其他外，审美欣赏忽略对象与我们的意志之间的关系，即它如何有助于或妨碍我们主观利益的满足。叔本华给这一相对常见的现代审美欣赏观念加上了奇特的转折：他把这种享受设想为对意志的* silencing*。既然在叔本华看来，意愿是——确实是*那个*——痛苦的根源，那么审美快乐就构成对我们存在重负的解脱。于是，审美经验可以说类似于并预兆着从世界及其祸患中的得救，而这种得救要通过禁欲来达到（例如见 Shapshay 2024）[^shapshay-2024]。尽管这种无意愿状态是一切审美欣赏的特征，但意志的否定在*悲剧*中被公然主题化，叔本华因此对这种艺术形式给予了特别高的赞扬。悲剧“在一个伟大而醒目的例证中使人类追求的徒劳与这整个存在的虚无变得可触可感，从而揭示了生命的最深意义；这就是为什么悲剧被公认为文学最崇高的形式”（*SW* 3:730–31/*WWR* 2:651）。因此，构成悲剧体裁终极内容的，正是叔本华自己的悲观主义哲学。
    step2: |-
      就本节而言，叔本华美学中最重要的主张是：我们从艺术（并更广泛地从美）中所得的愉悦是无利害的。叔本华以为，面对美的对象时，我们的意识仿佛被其纯然客观的属性所占满，只注目于对象本身是什么（或它所表达的“柏拉图式理念”），而不及其与其他对象的关系。这意味着，审美欣赏不理会对象同我们意志的关联，即它如何促成或阻碍我们主观利益的满足。对于这一颇为常见的近代审美欣赏观念，叔本华加了一层奇特的转折：他把此种享受设想为意志的*缄默*。既然在叔本华那里，意愿是痛苦的根源——而且是*那个*根源——审美快乐便成了对存在之重负的解脱。于是审美经验近似于、并且可以说预演了通过禁欲而获得的、对世界及其苦难的拯救（例如见 Shapshay 2024）[^shapshay-2024]。这种无意愿状态虽为一切审美欣赏所共有，意志的否定却在*悲剧*中得到显豁的主题化，叔本华因此对这一艺术门类格外推崇。悲剧“以一个伟大而触目的实例，使人类追求的徒劳、这整个存在的虚无变得可触可感，从而揭示了生命最深的意义；悲剧之所以被公认为文学中最崇高的形式，正在于此”（*SW* 3:730–31/*WWR* 2:651）。可见，构成悲剧体裁之终极内容的，正是叔本华本人的悲观主义哲学。
