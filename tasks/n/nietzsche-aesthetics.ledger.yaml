      Note that Zangwill’s approach treats ‘experiences of the artist’ and ‘the aesthetic problem’ as referring to judgements or perceptions of beauty. A more radical interpretation finds Nietzsche critical of the very idea that the aesthetic state is to be construed in such “passive” terms to begin with. On this view, “the significance of art is to be found less in its *products* than in the *creative activity* by which they are produced” (Reginster 2014, 25; cf. Soll 1998, 108ff.)[^reginster-2014][^soll-1998]. Here, the problem with a spectator’s aesthetics is that it locates aesthetic value in the wrong place—works of art, or the experiences they cause—or at least fails to see that such value can be located elsewhere as well (cf. Huddleston 2020, 5)[^huddleston-2020]. In its most extreme version, the view is that beautiful objects are “only by-products, and their beauty is merely a reflection of a … beauty that is, in the first place and most authentically, the artist’s own” (Ridley 2011, 321)[^ridley-2011].
