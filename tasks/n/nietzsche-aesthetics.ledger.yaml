      The third datum for non-metaphysical readings is Nietzsche’s valorization throughout *The Birth* of “myth.” A major theme of Nietzsche’s early work, as noted above, is that shared mythologies are essential for the flourishing of a culture: Nietzsche’s emphasis on the importance of myth is not as such evidence against a metaphysical interpretation of the book, since the fact that he valorizes myth does not on its own show that he views his metaphysics as a myth. However, it does provide a plausible rationale for the otherwise baffling *BT* 18 (our second piece of evidence). The idea is that, in those places of *The Birth* where Nietzsche appears to advance a grand metaphysical theory, he is really trying to supply late 19ᵗʰ-century German culture with the sort of myth that he thinks it needs to flourish. His confession in §18 that that “theory” is an illusion is an indication to the reader that this is what is going on. The most developed version of this reading in found in Gemes & Sykes 2014, 2015.
