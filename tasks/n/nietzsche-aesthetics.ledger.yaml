      There are a few obvious questions to be had here. First, what is Nietzsche’s criticism of the notion of aesthetic disinterest? This notion has meant different things to different philosophers, and how extensive and successful his criticism is will depend in part on how he understands the notion. Second, how is this criticism related to his apparent preference for an aesthetics that focuses on “the experiences of the artist (the creator)” rather than on those of the spectator? Schopenhauer, after all, believes that the creative genius is someone uniquely capable of attaining a state of pure, will-less cognition (*SW* 3:430–31/*WWR* 2:393–94); it is not immediately obvious that looking at the artist will cast suspicion on disinterestedness. Perhaps Nietzsche’s point is that Schopenhauer only reads his faulty theory of aesthetic spectatorship into the creative process. If this is right, then we may still wonder why we should prefer an aesthetics of the creator. Answers to these obvious questions may depend on answers to some more subtle questions. For instance, what precisely would we be looking at in considering “the experiences of the artist?” Artists’ own judgments of what is beautiful/aesthetically valuable? The nature of the creative process? Something else entirely? Nietzsche faults Kant and Schopenhauer for “envisioning the aesthetic problem” from the spectator’s point of view. What is this “aesthetic problem?” It is plausible to suppose that he has in mind the question of the nature of the beautiful (Ridley 2011)[^ridley-2011], but Nietzsche does not explicitly say.
    step1: TBD
    step2: TBD
