      1792至1803年间，席勒还写了大量论悲剧的文字。其《论悲剧中合唱队的运用》已预示《悲剧》的一个核心主张：合唱队对于正当的悲剧体验不可或缺。他论证说，合唱队让观众对剧情保持一种“有距离的”视角，把它看成诗人想象力的理想化产物，而不是对现实的粗陋摹写（详见 Stoll 2022）[^stoll-2022]。尼采在论索福克勒斯的讲演中、也在《悲剧的诞生》本文里，都明确赞同席勒对合唱队的说明（KGA II.3, 25–27; *BT* 7/KSA 1:54–55）。他也无法忽视席勒致歌德信中的一句话：“我对歌剧素来怀有一种信念——悲剧将从歌剧中发展为更高贵的形式，正如它当年从古代酒神节的合唱队中发展出来”（NA 29:179; 参 NF 1871: 9[83]）。但对席勒论悲剧快感的说法，尼采较为挑剔。席勒在《论悲剧对象欣赏的根据》《论崇高》等文中主张，我们从悲剧中所得的快感是崇高感的一种。他说，悲剧英雄典型地为某种更高原则牺牲福祉乃至性命（索福克勒斯同名剧中的安提戈涅即是一例），而这多少使观众意识到自身亦有同样的力量，即席勒所谓康德的先验自由能力；正是这一意识构成我们的悲剧快感。席勒的做法，因此是把康德的“力学的崇高”用于悲剧：按此说，一个“反目的”的对象能唤起我们对道德官能之力量的认识，从而给人以崇高感。在《悲剧》中，尼采确曾暗示悲剧快感属于崇高感（*BT* 7/KSA 1:57），却又明确拒绝用“道德上崇高的”东西来加以解释（*BT* 24；评论见 Raymond 2014）[^raymond-2014]。
