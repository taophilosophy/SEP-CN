      There are several problems, both philosophical and textual, with the above sort of view. One philosophical problem with the kind of aesthetic beautification Nietzsche sometimes seems to have in mind is that it arguably conflates representing something as beautiful with representing it beautifully (cf. Huddleston 2022, 125)[^huddleston-2022]. So, the portraitist might depict her subject as more beautiful than he is, and thus misrepresent him. But, it is far from clear that Homer’s *Iliad*—or Malick’s *The Thin Red Line*, for that matter—misrepresent war as beautiful simply in virtue of being beautiful stories about war. Relatedly, we do not often infer that properties attributed to objects by works of art are properties those objects actually possess. If Nietzsche’s conception of artistic falsity depends on the assumption that we are deceived by it, then he is assuming art appreciators to be far more gullible than they typically are (though, for a reading according to which Nietzsche does not need this assumption, see Reginster 2014, 15–23)[^reginster-2014].
    step1: TBD
    step2: TBD
