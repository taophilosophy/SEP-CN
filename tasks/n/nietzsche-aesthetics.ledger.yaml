      Thus, while Nietzsche never accepted Schiller’s conception of the Greeks wholesale, that conception significantly influenced his interpretation of the “Apollonian” element of Greek culture. This influence is evident in other ways as well. In the *Aesthetic Letters*, Schiller develops an influential notion of “beautiful semblance” (*schöner* *Schein*) (see esp. NA 20:398–405). Such semblances are distinctive types of illusions produced by works of fine art: they are paradigmatically non-deceptive and enjoyed for their own sake. The phrase ‘beautiful semblance’ plays on the double meaning of the German word *Schein*, which can signify both “semblance,” “illusion,” “appearance,” as well as “gleam,” “brilliance,” “radiance.” Schiller’s point is that aesthetic appreciation involves taking joy in the mere look of things without being concerned with what they are, though also without confusing appearance and reality. We recognize, for example, that the appearance of three-dimensionality on the flat surface of the canvas is a mere illusion, and this is part of what we enjoy. Nietzsche would make this sense of beautiful semblance central to his account of both Apollonian art and culture in *The Birth of Tragedy* (Stoll 2019)[^stoll-2019].
    step1: |-
      因此，尼采从未全盘接受席勒对希腊人的构想，但这一构想显著影响了他对希腊文化中“阿波罗式”要素的阐释。这一影响在其他方面也可见到。在《审美教育书简》中，席勒发展出一个有影响的“美的外观”（*schöner* *Schein*）概念（尤其见 NA 20:398–405）。这种外观是美的艺术作品所产生的独特幻觉类型：它们典型地不带欺骗性，并且因其自身之故而受到欣赏。“美的外观”一语利用了德语词 *Schein* 的双重含义，它既可表示“外观”、“幻觉”、“显现”，也可表示“微光”、“光辉”、“光芒”。席勒的要点是：审美欣赏在于从万物的纯粹外观中获得快乐，而不关心它们究竟是什么，同时又不混淆外观与实在。例如，我们认识到画布平面上三维性的外观只是幻觉，而这正是我们所欣赏的东西的一部分。尼采将使这种美的外观的意义成为他在《悲剧的诞生》中对阿波罗式艺术与文化之说明的核心（Stoll 2019）[^stoll-2019]。
