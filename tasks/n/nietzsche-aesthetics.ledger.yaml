      There are a number of potential responses to this last difficulty. One is to suggest that Nietzsche fails to entirely resolve it (Ridley 2007, 123–27)[^ridley-2007], or leaves it unresolved specifically to call attention to what he takes to be genuine tensions in our values (Janaway 2014, 51–56)[^janaway-2014]. Another proposal holds that his view develops away from the idea that art should be in any sense false (Reginster 2014)[^reginster-2014]. More ecumenically, one might suggest that Nietzsche sees art and truthfulness as competing “regulative ideals” which have to be appropriately balanced against one another (Anderson 2005, 203–11)[^anderson-2005], or that art is permitted to misrepresent, but only those aspects of life that we cannot change or otherwise accept (Ridley 2007, 80–83; 2013, 422–23)[^ridley-2007]. According to these sorts of readings, Nietzsche may advocate *maximal* honesty while still recognizing that life-affirmation might ultimately require some degree of falsification. One problem for this suggestion is that Nietzsche appears to insist that it is precisely the *necessary* aspects of existence we must acknowledge and affirm (*EH* “Clever” 10; cf. NF 1888: 16[32]).
