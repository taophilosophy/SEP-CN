      Yet, in many places throughout the book, Nietzsche appears to accord the Apollonian/Dionysian duality a quite distinct, if distantly related, significance. In this second sense, ‘Apollonian’ and ‘Dionysian’ are ways of referring to two metaphysical sides of the world à la Schopenhauer. The merely apparent world of spatiotemporally discrete individuals, governed by causal laws, is associated with Apollo, whereas the non-spatiotemporal monistic reality underlying the appearances is associated with Dionysus. The clear impression is that Nietzsche thus commits himself to Schopenhauer’s Transcendental Idealism and Will-Monism, that his “Apollo and Dionysus are … simply Representation and Will in Greek costume” (Nussbaum 1999, 358)[^nussbaum-1999].
