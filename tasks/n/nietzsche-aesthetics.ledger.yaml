      The prevailing tendency is to see Nietzsche as claiming that art is representationally false, and specifically as misrepresenting the undesirable or unaffirmable aspects of life. The following remarks seem to capture his position his well: “the role of art is to supply a (dishonest) fantasy that is to replace a reality that one cannot face” (Ridley 2007, 140)[^ridley-2007]; “art must represent life as beautiful, as affirmable, precisely because life is *not* beautiful” (Young 1992, 134)[^young-1992]; “artistic representation falsifies its object by depicting it as other than it is” (Came 2013, 220; cf. May 1999, 29–36; Janaway 2014)[^came-2013][^janaway-2014][^may-1999]. Assuming that Nietzsche is best interpreted in something like this manner, there are still several different ways art might be taken to be misrepresentational. First, and most straightforwardly, art might misrepresent what it overtly depicts. For example, a portrait painter might idealize some of her subject’s features, remove certain blemishes, and so forth. Second, art might misrepresent “life” or the “world” in some more general way, say, by implicitly or explicitly expressing false propositions about it, or otherwise suggesting a non-veridical outlook of some sort. For example, while *Macbeth* is on one level about specific members of the medieval Scottish nobility, perhaps its “real” message is that traitors meet a sorry end, and this message is not (without exception) true. Along similar lines, but much more generally, Nietzsche sometimes suggests that the world “in itself” simply lacks “beauty” and “order” (e.g. *GS* 109, 299). So, perhaps he thinks that art misrepresents the world simply to the extent that it represents things beautifully. Third, art might misrepresent by being fictional, in the sense of representing things which do not exist, rather than distorting what does exist. Greek art, for example, is preoccupied with mythical stories about non-existent gods, heroes, monsters, and so forth. And, presumably, Nietzsche would consider Christian art—with its various narratives about saints, prophets, miracles, and the like—false in just the same way.
