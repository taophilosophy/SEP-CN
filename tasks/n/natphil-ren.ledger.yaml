      一些中世纪哲学家承认 *minima naturalia*（自然最小体）的存在，即形式不再得以保持的界限。*minima*（最小体）的学说意在解决亚里士多德在《论生灭》（327a30–328b24）中提出的一个问题，即为结合——一种介于生成与毁灭之间的居间现象——寻找哲学上的正当性。在文艺复兴进程中，*minima naturalia* 的学说由阿戈斯蒂诺·尼福（约1469–约1539）与尤利乌斯·凯撒·斯卡利杰（1484–1558）等作者进一步阐发。斯卡利杰赋予 *minima* 某种坚固性，使它们不再只是界限，而是真实的、不可再分的物理组分。此外，他拒斥传统的原子论，因为传统原子论未能实现构成一个物体的微粒之间的连续性。范·海尔蒙特与丹尼尔·森纳特（1572–1637）的微粒论尽管反对逍遥派哲学，却植根于这一传统。特别是森纳特，他无法拒斥亚里士多德的形式概念，而是力图在亚里士多德主义与原子论之间建立协调。即便在一部题为《反亚里士多德的自然哲学》（*Philosophia Naturalis adversus Aristotelem*，1621）的纲领性著作中，为微粒论辩护的塞巴斯蒂安·巴松也否认虚空的存在，并拒斥对自然界的机械化。真正大胆地背离亚里士多德质料的质性背景的是伽利略·伽利莱，他捍卫一种机械论的原子论，其中原子不具有维度。尽管皮埃尔·伽桑狄（1592–1655）努力使之与基督教相调和，原子论仍因其神学含义而令传统主义者不安，这些含义既有大的（对世界的目的论看法），也有小的（圣体变体）。甚至勒内·笛卡尔（1596–1650）也因此遭到攻击。关于虚空是否存在的争论在整个17世纪也很活跃，这在很大程度上要归功于埃万杰利斯塔·托里切利（1608–1647）、瓦莱里亚诺·马尼（1586–1661）、奥托·冯·盖里克（1602–1686）与罗伯特·波义耳（1627–1691）的实验工作，他们与所谓“充盈论者”的传统观点相对立。
    step2: |-
      有些中世纪哲学家承认 *minima naturalia*（自然最小体）的存在，即形式不再得以保持的下限。*minima* 之说旨在解决亚里士多德在《论生灭》（327a30–328b24）中提出的难题：结合（mixis）介于生成与毁灭之间，须为它觅得哲学上的正当理由。文艺复兴期间，阿戈斯蒂诺·尼福（约1469–约1539）与尤利乌斯·凯撒·斯卡利杰（1484–1558）等人进一步推阐 *minima naturalia* 之说。斯卡利杰使 *minima* 具有实在的凝聚性，不再只是界限，而是不可再分的真实物理组分；他又拒斥传统原子论，因它未能达致构成物体的诸微粒之间的连续性。范·海尔蒙特与丹尼尔·森纳特（1572–1637）的微粒论虽反对逍遥派，却仍以此传统为根。森纳特尤其不能舍弃亚里士多德的形式概念，反而力求使亚里士多德主义与原子论彼此协调。即便在书名即标举纲领的《反亚里士多德的自然哲学》（*Philosophia Naturalis adversus Aristotelem*，1621）中，为微粒论辩护的塞巴斯蒂安·巴松也否认虚空，并拒绝把自然界机械化。真正大胆挣脱亚里士多德质料之质性背景的是伽利略·伽利莱，他所捍卫的机械论原子论中，原子并无尺寸。原子论虽经皮埃尔·伽桑狄（1592–1655）设法与基督教调和，其神学含义仍令传统派不安，大者如对世界的目的论看法，小者如圣体变体。勒内·笛卡尔（1596–1650）亦因此遭到攻击。虚空存在与否之争，整个17世纪都甚为热烈，这在很大程度上得力于埃万杰利斯塔·托里切利（1608–1647）、瓦莱里亚诺·马尼（1586–1661）、奥托·冯·盖里克（1602–1686）与罗伯特·波义耳（1627–1691）的实验工作——他们与所谓“充盈论者”（plenists）的传统见解相抗。
