      Natural philosophy interacted with many other disciplines. The close relationship between natural philosophy and medicine had already been stressed by Aristotle himself at the beginning of *On Sense and Sensible* (436a19–436b2). Medicine often competed with natural philosophy within the universities: philosophy was a curricular requirement for those who wanted to study medicine in the Italian universities and many of the greatest Renaissance natural philosophers were also physicians (e.g., Alessandro Achillini (1463–1512) and Simone Porzio (1496–1554); there were also professional physicians who wrote on natural philosophy, such as Balthassar Pisanellus (fl. 1559) and Daniel Furlanus (d. 1600)). *Ubi desinit philosophus* (or *physicus*), *incipit medicus* (“where the philosopher ends, the physician begins”): so went a proverb which implied an ambiguous boundary between the two disciplines: on the one hand, it reflected the need to move beyond the theory represented by philosophy and into the actual practice of medicine; on the other, it affirmed the idea that natural philosophy was necessary in order to prepare for medical studies. From this perspective, natural philosophy represented either a mere preparatory stage on the way to the more perfect and concrete knowledge of medicine, or, alternatively, medicine was subordinate to natural philosophy (others, like the philosopher Jacopo Zabarella (1533–1589), preferred to distinguish natural philosophy from medicine because these two disciplines did not share subject and method).
    step1: |-
      自然哲学与许多其他学科相互影响。自然哲学与医学之间的密切关系，亚里士多德本人在《论感觉与被感觉者》开篇（436a19–436b2）就已强调。在大学之中，医学常与自然哲学竞争：在意大利的大学里，想学医的人必须先修哲学这门课程，而许多最伟大的文艺复兴自然哲学家本人也是医生（例如亚历山德罗·阿基利尼（1463–1512）和西蒙内·波尔齐奥（1496–1554）；也有一些职业医生撰写自然哲学著作，如巴尔塔萨尔·皮萨内洛（约1559年活跃）和丹尼尔·富尔拉努斯（卒于1600年））。*Ubi desinit philosophus*（或 *physicus*），*incipit medicus*（“哲学家止步之处，便是医生开始之地”）：这是一句谚语，它暗示两个学科之间的边界并不分明：一方面，它反映出超越哲学所代表的理论、进入医学实际需要的必要；另一方面，它又肯定自然哲学是为医学学习作准备所必需的。在这一视角下，或者自然哲学不过是通往更完善、更具体的医学知识的一个预备阶段，或者医学从属于自然哲学（另有一些人，如哲学家贾科莫·萨巴雷拉（1533–1589），宁可将自然哲学与医学区分开来，因为这两个学科并不共享对象与方法）。
    step2: |-
      自然哲学与众多其他学科彼此交涉。自然哲学与医学关系密切，这一点亚里士多德本人在《论感觉与被感觉者》卷首（436a19–436b2）便已着重指出。在大学里，医学时常与自然哲学争胜：在意大利的大学中，习医者必先修哲学课程，而文艺复兴时期许多最杰出的自然哲学家本身就是医生（如亚历山德罗·阿基利尼（1463–1512）与西蒙内·波尔齐奥（1496–1554））；也有不少职业医生著述自然哲学，如巴尔塔萨尔·皮萨内洛（约1559年活跃）与丹尼尔·富尔拉努斯（卒于1600年）。“哲学家止步之处，便是医生起步之地”（*Ubi desinit philosophus*（或 *physicus*），*incipit medicus*）——这句谚语意味着两科之间的界线颇为模糊：它一面表示有必要越过哲学所提供的理论、进到医学的实际操作；另一面又确认自然哲学是医学学习的必要准备。就此而言，自然哲学要么只是通往更完善、更具体的医学知识的一道门阶，要么医学反倒从属于自然哲学。也有人另取立场，例如哲学家贾科莫·萨巴雷拉（1533–1589）就宁愿把自然哲学同医学区别开来，理由是二者对象不同、方法亦异。
