      Closely related to these problems was Aristotle’s doctrine of prime matter, which had controversial implications: as matter was eternal, so was the world, and therefore the Christian dogma of the creation of the world was untenable. Scholastic philosophers had long struggled with this subject during the Middle Ages, and the most interesting developments during the Renaissance were driven by the confrontation between Aristotelianism and Platonism. Plato, in the *Timaeus*, had clearly spoken of a God-creator, and once again his doctrines were adopted by authors anxious to establish a new philosophical foundation for Christianity. Bessarion (d. 1472), for example, admitted that according to Plato matter was eternal, but that he distinguished it clearly from the creator, who possesses a superior eternity. In similar fashion, Marsilio Ficino expressly described prime matter as created and therefore not subject to generation and corruption. Aristotelians were not always afraid, however, to argue for the eternity of the prime matter: Francesco Vimercato (1512–1569), in his posthumous *De rerum principiis*, is the most remarkable example. As late as the beginning of the seventeenth century, the debate continued: Cesare Crivellati composed a dialogue (1617) between Plato and Aristotle in which the master rebukes his unfaithful student for teaching such an impious doctrine. On the other hand, there were also authors who attempted to establish an accord between Plato and Aristotle on this sensitive issue: a good example is the *De naturae philosophia seu de Platonis et Aristotelis consensione* (1554) by Sebastian Fox Morcillo (1526–1560), in which the Spanish philosopher compares the doctrines of the *Timaeus* and the *Physics*, and emphasizes the limits of both in front of the perfection of religion.
    step1: |-
      与这些问题密切相关的是亚里士多德的第一质料学说，它具有争议性的含义：既然质料永恒，世界也就永恒，因此基督教关于世界被造的教义便站不住脚。经院哲学家在中世纪长期为此问题挣扎，而文艺复兴时期最有趣的进展，则是由亚里士多德主义与柏拉图主义之间的对峙所推动的。柏拉图在《蒂迈欧篇》中明确谈到了作为创造者的神，他的学说再次被那些急于为基督教建立新哲学基础的作者所采纳。例如贝萨里翁（卒于1472年）承认，按照柏拉图，质料是永恒的，但他把质料与创造者清楚地区分开来，后者拥有更高的永恒性。与此类似，马尔西利奥·费奇诺明确地把第一质料描述为被造的，因而不受生灭的支配。然而，亚里士多德派并不总是害怕论证第一质料的永恒性：弗朗切斯科·维梅尔卡托（1512–1569）在其遗著《论万物的本原》中，就是最显著的例子。直到17世纪初，这一争论仍在继续：切萨雷·克里韦拉蒂写了一部柏拉图与亚里士多德之间的对话（1617），其中老师斥责自己不忠的学生讲授如此不虔敬的学说。另一方面，也有作者试图在柏拉图与亚里士多德之间就这一敏感问题建立一致：一个很好的例子是塞巴斯蒂安·福克斯·莫西略（1526–1560）的《论自然哲学或论柏拉图与亚里士多德之一致》（1554），在这部著作中，这位西班牙哲学家比较了《蒂迈欧篇》与《物理学》的学说，并强调二者在宗教的完善面前都有其限度。
    step2: |-
      与此紧密相关的，是亚里士多德的第一质料学说，其含义颇具争议：质料若永恒，世界亦永恒，于是基督教关于世界受造的教义便难以维持。经院哲学家在中世纪早已为此纠缠不休，而文艺复兴时期最可注意的进展，则由亚里士多德主义与柏拉图主义的正面交锋所促成。柏拉图在《蒂迈欧篇》中明言有一位造物之神，急于为基督教奠定新哲学基础的作者遂再度取用其说。譬如贝萨里翁（卒于1472年）承认按柏拉图之说质料永恒，但把质料与造物者判然分开，后者具有更高的永恒性。马尔西利奥·费奇诺也径直把第一质料说成受造的，因而免于生灭。然而亚里士多德派并不总是忌惮论证第一质料的永恒：弗朗切斯科·维梅尔卡托（1512–1569）的遗著《论万物的本原》即为最著的例子。直到17世纪初争论仍未止息：切萨雷·克里韦拉蒂作了一篇柏拉图与亚里士多德的对话（1617），其中老师痛责不肖门徒传授如此不虔敬的学说。另一方面，也有作者试图在这敏感问题上使柏拉图与亚里士多德归于一致，塞巴斯蒂安·福克斯·莫西略（1526–1560）的《论自然哲学或论柏拉图与亚里士多德之一致》（1554）即是一例：这位西班牙哲学家比对《蒂迈欧篇》与《物理学》的学说，并强调在宗教的圆满面前二者皆有其限。
