      Other thinkers instead had a pragmatic approach to prime matter: alchemists like the Swiss physician Paracelsus (1493–1541) sought to find a principle to which every substance could be reduced. Though openly challenging traditional university teaching, Paracelsus did not reject canonical motifs. For example, he relied on the four elements (air, fire, water, earth), but he also proposed a new triad: sulfur, mercury, and salt. Yet, even this proposal was not as iconoclastic as it appears, since it was partially founded on the Aristotelian doctrine of the formation of metals contained in the *Meteorology* (341b 6ff.). Nonetheless, by emphasizing the processes of association and dissociation of substances, Paracelsus offered an important contribution to the transformation of alchemy into chemistry (even if the two terms were often intended as interchangeable). Gradually chemistry separated from physics, understood as the science of bodies subject to movement, and positioned itself as the science of bodies associated and dissociated. Johann Baptist Van Helmont (1579–1644), who opposed the Paracelsian principles, developed a corpuscular doctrine of matter, a variant of atomistic theory. Atomism in the Renaissance was typically related to the Neoplatonic concept of *semina* and to the Epicurean philosophy, and was usually advocated by radical anti-Aristotelian thinkers like Giordano Bruno. And while it is true that Aristotle rejected atomism and the existence of the void, there were ways to argue for a Peripatetic version of atomism.
    step1: |-
      另一些思想家对第一质料则采取实用主义的态度：帕拉塞尔苏斯（1493–1541）这样的炼金术士，试图找到一种可以把一切实体都还原于其上的本原。虽然公开挑战传统的大学教学，帕拉塞尔苏斯并未拒斥经典母题。例如他依赖四元素（气、火、水、土），但也提出了一种新的三元组：硫、汞与盐。然而，即便这一提议也不像它表面上那样标新立异，因为它部分奠基于《气象学》（341b6及以下）所载的亚里士多德关于金属生成的学说。尽管如此，帕拉塞尔苏斯通过强调物质的结合与分解过程，为炼金术转变为化学作出了重要贡献（尽管这两个词当时常被当作可以互换的用语）。化学逐渐从物理学——被理解为关于服从运动的物体的科学——中分离出来，把自己定位为关于结合与分解的物体的科学。约翰·巴普蒂斯塔·范·海尔蒙特（1579–1644）反对帕拉塞尔苏斯的本原说，发展出一种微粒论的质料学说，这是原子论的一个变体。文艺复兴时期的原子论通常与新柏拉图主义的 *semina*（种子）概念以及伊壁鸠鲁哲学相关联，通常由乔尔丹诺·布鲁诺这样的激进反亚里士多德思想家所主张。尽管亚里士多德确实拒斥原子论与虚空的存在，仍有一些途径可以论证一种逍遥派的原子论版本。
    step2: |-
      另一些思想家对第一质料取实用的态度：帕拉塞尔苏斯（1493–1541）这类炼金术士，想找出一种能把一切实体都还原其上的本原。帕拉塞尔苏斯虽公然挑战传统的大学教学，却未抛弃经典母题。例如他仍倚重四元素（气、火、水、土），同时又另立硫、汞、盐之三元。即便如此，这提议也不像乍看那样离经叛道，因为它部分建立在《气象学》（341b6及以下）所载亚里士多德论金属生成的学说之上。不过帕拉塞尔苏斯着重于物质的结合与离解过程，对炼金术向化学的转变贡献不小（尽管当时这两个词常可互换）。化学渐渐从物理学——即关于服从运动之物体的科学——中析出，自立为研究结合与离解之物体的科学。约翰·巴普蒂斯塔·范·海尔蒙特（1579–1644）反对帕拉塞尔苏斯的本原说，发展出一种微粒论的质料学说，可视为原子论的一个变体。文艺复兴的原子论通常与新柏拉图主义的 *semina*（种子）观念及伊壁鸠鲁哲学相联，倡之者多为乔尔丹诺·布鲁诺一流的激进反亚里士多德思想家。亚里士多德固然否弃原子论与虚空，却仍有路径可以论证一种逍遥派版本的原子论。
