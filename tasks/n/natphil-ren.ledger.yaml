      Most Aristotelian interpreters believed matter to be *prope nihil*, pure potentiality, while others believed that it possessed a certain degree of reality and actuality. The discussion on the nature of matter was further complicated by the suggestions offered by other traditions of thought, Platonism above all. According to Marsilio Ficino (1433–1499) in his *Platonic Theology*, prime matter had an existence which is not dependent upon form. Closely following the *Timaeus*, he claimed that matter can therefore be intelligible, though in a weaker way. Giordano Bruno (1548–1600) proposed an even more radical departure from traditional views of the passivity of matter. In the *De la causa, principio et uno*, Bruno affirmed that matter is an active principle, not passive. Matter contains within itself every form, both corporeal and incorporeal, and can be described as a kind of infinite life. Bruno’s conception of matter also served as the basis for his cosmological views (see below), and in particular for his claim that the universe is infinite. A few years later, Tommaso Campanella returned to a more traditional position. In the *Del senso delle cose e della magia* (printed in 1620) he argued for the synonymity between matter and body, and against the identification of matter with the Aristotelian *prope nihil*, though he did emphasize its passivity: matter receives forms from external agents and does not produce them from within itself.
    step1: |-
      大多数亚里士多德注释者认为质料是 *prope nihil*（近乎虚无），是纯粹潜能，另一些人则认为质料具有一定程度的实在性与现实性。关于质料本性的讨论，还因其他思想传统——首先是柏拉图主义——所提供的暗示而更为复杂。按照马尔西利奥·费奇诺（1433–1499）在《柏拉图神学》中的说法，第一质料有一种不依赖于形式的存在。他紧循《蒂迈欧篇》，主张质料因此可以是可理解的，尽管是以较弱的方式。乔尔丹诺·布鲁诺（1548–1600）提出了一种更为激进地背离传统质料被动性观点的方案。在《论原因、本原与太一》中，布鲁诺断言质料是能动的本原，而非被动的。质料自身之中包含一切形式，无论有形还是无形，可以被描述为一种无限的生命。布鲁诺的质料观也为其宇宙论观点（见下文）提供了基础，尤其是他关于宇宙无限的断言。数年后，托马索·康帕内拉回到较为传统的立场。在《论事物的感觉与魔法》（1620年印行）中，他主张质料与物体是同义的，并反对把质料等同于亚里士多德的 *prope nihil*，尽管他确实强调了质料的被动性：质料从外部动因接受形式，而非从自身内部产生形式。
    step2: |-
      亚里士多德的大多数注释者以为质料是 *prope nihil*（近乎虚无），即纯粹的潜能；另一些人则认为它尚有几分实在性与现实性。其他思想传统——首先是柏拉图主义——所提供的暗示，又使关于质料本性的讨论更形复杂。马尔西利奥·费奇诺（1433–1499）在《柏拉图神学》中主张，第一质料的存在并不仰赖形式。他紧贴《蒂迈欧篇》立论，认为质料因而可以是可理解的，只是方式较为微弱。乔尔丹诺·布鲁诺（1548–1600）则更为激进地背离了质料被动这一传统见解：在《论原因、本原与太一》中，他断言质料是能动的本原而非被动者；质料自身含具一切形式，无论有形无形，简直可称之为一种无限的生命。布鲁诺的质料观又成为其宇宙论（见下文）的基石，尤其支撑了他关于宇宙无限的论断。数年之后，托马索·康帕内拉复归于较为传统的立场。他在《论事物的感觉与魔法》（1620年印行）中主张质料与物体同义，反对把质料等同于亚里士多德的 *prope nihil*，不过他也确实强调了质料的被动性：形式由外部动因授予质料，质料并不从自身内部产生形式。
