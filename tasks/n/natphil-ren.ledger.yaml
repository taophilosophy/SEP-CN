      The same desire for accuracy that motivated the production of scientific images also led to more rigorous editions and translations of classic scientific texts, whose impact was magnified by the printing press. Between 1495 and 1498 Aldus Manutius printed the “Greek Aristotle” in Venice, an edition prepared by a team which included the humanist-physicians Niccolò Leoniceno and Thomas Linacre under the guidance of another physician, Francesco Cavalli. Consequently, Manutius’s edition, which incorporated significant improvements of the Aristotelian texts such as those proposed years before by Theodor Gaza for the *Historia Animalium*, favored the scientific works by Aristotle and did not include, for example, either *Rhetoric* or *Poetics*. Yet the scientific text that received the most attention from philologists was Pliny’s *Natural History*. Between the fifteenth and sixteenth centuries Pliny’s work was emended by philologists such as Ermolao Barbaro, Angelo Poliziano, and Niccolò Leoniceno—and also translated several times in the vernaculars—in increasingly sophisticated versions. Both the editions and the translations were intended to allow for a correct understanding of the text, which was often used by doctors and apothecaries. The same thing happened with Dioscorides’ *Materia medica*, a text that unlike the encyclopedic *Natural History* was plainly addressed to a medical audience, and which was then repeatedly emended and translated by professional physicians and natural philosophers. Yet, also authors like Virgil, Horace and Ovid were common presences in discussions about botany, and even a philological evaluation of the text of the *Bible* could provide material to natural philosophers.
    step1: |-
      推动科学生产图像的同一股追求精确的欲求，也促成了对经典科学文本更严谨的校勘本与译本，其影响因印刷术而放大。1495至1498年间，阿尔杜斯·马努提乌斯在威尼斯刊行了“希腊文亚里士多德”，这一版本由一个团队编校，成员包括人文主义医生尼科洛·莱奥尼切诺与托马斯·林纳克，并由另一位医生弗朗切斯科·卡瓦利主持。因此，马努提乌斯的版本收录了对亚里士多德文本的若干重要改进（例如泰奥多罗斯·加扎多年前为 *Historia Animalium* 所提议者），偏重亚里士多德的科学著作，而未收入《修辞学》与《诗学》。然而，语文学家投入最多注意的科学文本却是普林尼的《自然史》。15至16世纪间，普林尼的著作经埃尔莫劳·巴尔巴罗、安杰洛·波利齐亚诺、尼科洛·莱奥尼切诺等语文学家校订——也被多次译为方言——版本日益精密。校勘本与译本都旨在使人正确理解这一文本，而医生与药剂师常要使用它。迪奥斯科里德斯的《药物论》也是这样：它与百科式的《自然史》不同，明白地面向医学读者，因而被职业医生与自然哲学家长期反复校订和翻译。然而，维吉尔、贺拉斯、奥维德这样的作家也常出现在关于植物学的讨论之中，甚至对《圣经》文本的语文学考订也能为自然哲学家提供材料。
    step2: |-
      同样的求确之心，既推动了科学图像的制作，也推动了对经典科学文本更严格的校勘与翻译，而印刷术又把这种影响成倍放大。1495至1498年间，阿尔杜斯·马努提乌斯在威尼斯刊出“希腊文亚里士多德”；此版由一个班子编校，其中有人文主义医生尼科洛·莱奥尼切诺与托马斯·林纳克，另一医生弗朗切斯科·卡瓦利居于指导之列。马努提乌斯本版吸收了若干对亚氏文本的重要改进（例如多年前泰奥多罗斯·加扎为《动物志》所提者），偏取亚里士多德的科学著作，《修辞学》与《诗学》皆未收录。不过在语文学家笔下得到最多加工的科学与自然文本，还是普林尼的《自然史》。15、16两世纪间，埃尔莫劳·巴尔巴罗、安杰洛·波利齐亚诺、尼科洛·莱奥尼切诺等人都曾校订此书，它还被一再译成方言，译本愈发精密。无论校勘还是翻译，用意都在使人确解文本，而医生与药剂师正是常用此书之人。迪奥斯科里德斯的《药物论》际遇相类：与百科式的《自然史》不同，它明白地面向医学读者，因此不断由职业医生与自然哲学家重新校订、转译。同时，维吉尔、贺拉斯、奥维德等作家也常在植物学的讨论中登场；甚至对《圣经》文本所作的语文学考订，也能为自然哲学提供资料。
