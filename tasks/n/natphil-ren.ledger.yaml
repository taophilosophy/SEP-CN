    source: |-
      Between the fifteenth and sixteenth centuries, the works of other, more ancient commentators on Aristotle were also adopted: those of Alexander of Aphrodisias and Simplicius were particularly popular, the first because of its radical mortalism, the second for its Neoplatonic and conciliatory tendencies. The rediscovery of the ancient commentators was accompanied by an increasing reliance on the Greek texts in universities, despite the enduring predominance of medieval Latin material. New commentaries also appeared alongside the ancient ones: practically all of the most prominent professors composed their own commentaries to the Aristotelian natural texts, in particular between the sixteenth and seventeenth centuries. Usually these commentaries followed the texts according to the Averroistic divisions, but sometimes they were organized in *quaestiones*.
    step1: |-
      在15、16世纪之间，其他更古老的亚里士多德注释家的著作也被采纳：阿弗罗狄西亚的亚历山大和辛普里丘的注释尤其流行，前者因其激进的灵魂有死论，后者因其新柏拉图主义与调和倾向。古代注释家的重新发现伴随着大学中对希腊文文本日益增长的依赖，尽管中世纪拉丁材料仍占优势。新的注释也与古代的注释一同出现：几乎所有最杰出的教授都为自己的亚里士多德自然哲学文本撰写了注释，16、17世纪之际尤其如此。这些注释通常按照阿威罗伊式的划分来跟随文本，但有时也按 *quaestiones*（问题）的形式组织。
    step2: |-
      15至16世纪间，更为古老的亚里士多德注释家之作也被采用：阿弗罗狄西亚的亚历山大与辛普里丘的注释格外流行——前者因激进的灵魂有死论，后者因其新柏拉图主义与调和倾向。古代注释家的重见天日，伴随着大学对希腊文原本日益倚重，尽管中世纪拉丁材料仍旧占据优势。与古代注释并行，新的注释也不断涌现：几乎所有最知名的教授都曾为亚里士多德的自然哲学文本撰写注释，16、17世纪之交尤为集中。此类注释通常依阿威罗伊式的划分随文展开，有时则以 *quaestiones*（问题集）的形式组织。
  - id: 8
    kind: body
    source: |-
      Furthermore, the advent of printing made a large selection of textbooks more widely available: some of them were very short introductions for younger students, others were *compendia*, others paraphrases (like those by Jacques Lefèvre d’Etaples (1455–1536), printed for the first time in 1492), and still others dialogues (again, Lefèvre d’Etaples created some of the most significant examples). Other popular works used for teaching were abridged versions of the Aristotelian treatises reduced to *conclusiones*, like the popular *Textus abbreviatus philosophiae naturalis* by the French theologian Thomas Bricot (d. 1516). There were also many different textbooks, which generally followed canonical organizations: either they explained the Aristotelian works according to their order in the *corpus*, or they highlighted subjects like principles, causes, movement, infinity, place, void, and time. The famous *Commentarii Conimbricenses*, which from 1594 on became the standard text in the Jesuit *curriculum,* contains a whole course on natural philosophy organized as a commentary of the Aristotelian corpus. Particularly after the second half of the sixteenth century, vernacular treatments of Aristotelian natural philosophy also began to circulate, such as the translations by Antonio Brucioli (1498–1566), the paraphrases by Alessandro Piccolomini (1508–1579), the summaries by Jean de Champaignac (fl. 1595) and Scipion Dupleix (1569–1661), and the works by Cesare Crivellati (1553–1640), the latter explicitly addressed to university students.
    step1: |-
      此外，印刷术的出现使大量教科书更广泛地流通：其中一些是供年幼学生使用的极短导论，另一些是 *compendia*（纲要），还有一些是释义（如雅克·勒费弗尔·德·埃塔普勒（1455–1536）所作、1492年首次印行的释义），再有一些是对话体（同样，勒费弗尔·德·埃塔普勒创作了其中最重要的几种范例）。其他用于教学的流行作品，是把亚里士多德论著缩编为 *conclusiones*（结论）的节本，例如法国神学家托马斯·布里科（卒于1516年）广受欢迎的 *Textus abbreviatus philosophiae naturalis*。此外还有许多不同的教科书，它们一般遵循既定的编排方式：或者按照亚里士多德著作在全集中的顺序加以解说，或者突出原理、原因、运动、无限、地点、虚空和时间等主题。著名的 *Commentarii Conimbricenses* 自1594年起成为耶稣会课程中的标准教材，其中包含一整套自然哲学课程，按亚里士多德全集的注释形式编排。尤其在16世纪下半叶之后，用方言撰写的亚里士多德自然哲学论著也开始流传，例如安东尼奥·布鲁乔利（1498–1566）的译本、亚历山德罗·皮科洛米尼（1508–1579）的释义、让·德·尚帕尼亚克（约1595年在世）与西皮翁·迪普莱克斯（1569–1661）的摘要，以及切萨雷·克里韦拉蒂（1553–1640）的著作——后者明确面向大学生。
    step2: |-
      再者，印刷术的兴起使大批教科书得以更广泛地流通：有的极简短，是给年少学生的入门书；有的是 *compendia*（纲要）；有的是释义，如雅克·勒费弗尔·德·埃塔普勒（1455–1536）所作、1492年首次付印的释义；还有的采取对话体（同样出自勒费弗尔·德·埃塔普勒之手，其中几种堪称最重要的范例）。教学上另有一些流行读物，是把亚里士多德各论著缩编为 *conclusiones*（结论）的节本，例如法国神学家托马斯·布里科（卒于1516年）所著、流传甚广的 *Textus abbreviatus philosophiae naturalis*。教科书的种类还有很多，编排大体不出两途：或依亚里士多德著作在全集中原有的次序逐部解说，或围绕原理、原因、运动、无限、地点、虚空、时间等主题加以凸显。著名的《科英布拉注释》（*Commentarii Conimbricenses*）自1594年起成为耶稣会课程的标准教材，其中包含一整门自然哲学课程，即以注释亚里士多德全集的方式组织。尤其在16世纪下半叶以后，以方言撰写的亚里士多德自然哲学论著也开始流行，如安东尼奥·布鲁乔利（1498–1566）的译本、亚历山德罗·皮科洛米尼（1508–1579）的释义、让·德·尚帕尼亚克（约1595年在世）与西皮翁·迪普莱克斯（1569–1661）的摘要，以及切萨雷·克里韦拉蒂（1553–1640）的著作——后者明确以大学生为读者。
