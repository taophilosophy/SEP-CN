      对自然的研究，从一种以文本为基础、以对少数作者的研究为根据的进路，转向一种以扩充了的百科、尤其是以直接观察为基础的新进路——这一转变在伽利略·伽利莱时代达于最充分的表达；但在洛伦佐·瓦拉（约1406–1457）的著作中它已可察觉——瓦拉诉诸常识，以反对某些亚里士多德信条的荒谬——在列奥纳多·达·芬奇的著作中同样如此，后者呼吁科学与实践之间良性的互动。当托马索·康帕内拉（1568–1639）声称，他从一只蚂蚁或一株草药的解剖所学到的，多于从任何一部写成的书本所学到的，他不过是以一种优美而富于诗性的方式，表达了一种共同的方法论信条。
