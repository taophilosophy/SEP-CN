  - id: 3
    kind: body
    source: |-
      Renaissance natural philosophy defies easy definition, since descriptions of it may oversimplify, either by reducing it to its connections with medieval science or, alternatively, forcing it into a teleology that culminates in the Scientific Revolution of the seventeenth century. Hence, there have been two opposing tendencies in scholarship: one which conflates the natural philosophy of the fifteenth and sixteenth centuries with the variety practiced in the Middle Ages, even going so far as to interpret the Renaissance as a period of conservatism in this regard; another which emphasizes the role of Renaissance natural philosophy as a “precursor” of modern science, even at the cost of ignoring or removing its connections to disciplines today considered pseudo-scientific, such as physiognomy, astrology, and magic. Recent contributions, however, have helped to outline the characteristics of Renaissance natural philosophy in their own terms. Medieval natural philosophy was usually based in the *corpus aristotelicum* and practiced in universities. Yet this did not mean that its approach was purely static or regressive; on the contrary, thinkers like Jean Buridan, Biagio Pelacani, and Nicole Oresme took Aristotelian physics and mechanics in new directions in medieval Europe. Nevertheless, the nature of medieval universities was such that teaching was heavily controlled by authorities, and especially outside of Italy both metaphysics and theology exercised a strong influence. This imposed some limitation to the directions in which scientific theorization could advance. Paradoxically, it was the return of another, rival school of thought—Platonism—that ultimately allowed for more freedom within the Aristotelian tradition. Though Plato’s philosophy had never completely disappeared during the course of the Middle Ages, the consolidation of a Neoplatonic school in the fifteenth century led to the clear distinctions between the spheres which properly belonged to the two great thinkers of the ancient world. While Plato was regarded as a theologian and master of the metaphysical realities, Aristotle was seen as an investigator of the sublunar world subject to generation and corruption. The recovery of this ancient dichotomy had the effect of undermining the longstanding ties between Aristotelianism and Scholasticism, and opened up new spaces for philosophy unimpaired by metaphysical limitations. Moreover, an open dialogue with the Platonic tradition, caused several professors to question Aristotle’s coherence and reliability. At the same time, also Platonism and other brands of ancient philosophy—Stoicism, Skepticism, and Epicureanism—stimulated reflection on the natural world in different ways, also in terms of method. The application of these ideas to various fields of inquiry gave Renaissance natural thought a distinctive identity, forged in continuous dialectic with Aristotelianism itself. Aristotelianism therefore represented the driving force behind Renaissance philosophy of nature, both because of its plurality of approaches and internal debates, and also because it served as the polemical target of those who challenged the traditional paradigm of university teaching: both followers and adversaries of Aristotle had constantly to negotiate with his authoritative legacy, and manipulate it. Finally, other factors of a non-speculative character also had an impact on natural philosophy: technological innovations such as printing, the telescope and the microscope, geographical discoveries, and developments within the universities themselves, such as the institution of botanical gardens.
    step1: |-
      文艺复兴时期的自然哲学难以简单界定，因为对它的描述容易流于过度简化：或者把它化约为它与中世纪科学的联系，或者反过来，把它强行纳入一种以17世纪科学革命为终点的目的论。于是学界出现了两种对立的倾向：一种把15、16世纪的自然哲学与中世纪流行的各种自然哲学混为一谈，甚至据此把文艺复兴看作这一领域的保守时期；另一种强调文艺复兴自然哲学作为现代科学“先驱”的作用，为此不惜忽视或剥离它与今天被视为伪科学的学科（相面术、占星术和魔法）之间的联系。不过，晚近的研究已帮助人们按文艺复兴自然哲学自身的语汇勾勒其特征。中世纪的自然哲学通常以 *corpus aristotelicum*（亚里士多德全集）为基础，并在大学中讲授。然而这并不意味着它的进路纯粹静止或退化；相反，让·布里丹、比亚焦·佩拉卡尼和尼科尔·奥雷斯姆等思想家在欧洲中世纪就把亚里士多德的物理学与力学推向了新的方向。尽管如此，中世纪大学的性质决定了教学受权威的严格控制，尤其在意大利以外，形而上学与神学都发挥着强大的影响。这在某种程度上限制了科学理论化可以推进的方向。悖谬的是，正是另一派敌对思想——柏拉图主义——的回归，最终使亚里士多德传统内部获得了更大的自由。柏拉图哲学在中世纪从未完全消失，但15世纪新柏拉图学派的巩固，促成了古代世界两位伟大思想家各自所属领域的清晰划分。柏拉图被视为神学家和形而上学实在的宗师，亚里士多德则被视为月下世界的探究者——那个世界服从生灭。这一古代二分法的恢复，瓦解了亚里士多德主义与经院哲学之间由来已久的纽带，并为哲学开辟了不受形而上学限制的新空间。此外，与柏拉图传统的公开对话也使若干教授开始质疑亚里士多德学说的一致性与可靠性。与此同时，柏拉图主义以及古代哲学的其他流派——斯多亚主义、怀疑主义和伊壁鸠鲁主义——也以不同方式刺激了对自然界的思考，其中也包括方法层面的刺激。这些观念在各个探究领域中的应用，赋予文艺复兴自然思想一种独特的身份，而这种身份是在与亚里士多德主义本身的持续辩证中锻造出来的。因此，亚里士多德主义构成了文艺复兴自然哲学背后的驱动力：一方面因为它自身进路多样、内部争论不断，另一方面也因为它是那些挑战传统大学教学范式者的论战靶子——亚里士多德的追随者与反对者都不得不持续地同他的权威遗产打交道，并对其加以摆布。最后，一些非思辨性的因素也影响了自然哲学：印刷术、望远镜和显微镜等技术革新，地理发现，以及大学自身的发展，例如植物园的设立。
    step2: |-
      要界定文艺复兴时期的自然哲学并非易事，因为任何一种描述都可能把它简化过头：不是把它化约为它与中世纪科学的关联，就是把它塞进一个以17世纪科学革命为归宿的目的论叙事。由此，学界形成了两种彼此对立的倾向。一种把15、16世纪的自然哲学与中世纪所实践的各色自然哲学混同起来，甚至据此断定文艺复兴在这一领域是一个保守时期；另一种则突出文艺复兴自然哲学作为现代科学“先驱”的角色，为此宁可无视或切割它与相面术、占星术、魔法这类今日被视为伪科学的学科之间的联系。不过，晚近的研究已使我们能够按照文艺复兴自然哲学自身的语汇来勾画其特征。中世纪的自然哲学一般以 *corpus aristotelicum*（亚里士多德全集）为本，在大学里讲授。但这并不意味着它的进路纯然静止或退化：恰恰相反，让·布里丹、比亚焦·佩拉卡尼、尼科尔·奥雷斯姆等人在中世纪的欧洲已把亚里士多德的物理学与力学引向新的方向。只是中世纪大学的体制使教学深受权威控制，在意大利之外尤其如此——形而上学与神学都具有强大的影响力。这就为科学理论化的推进方向设下了若干限制。悖谬的是，最终给亚里士多德传统内部带来更大自由的，竟是另一派竞争性思想即柏拉图主义的回归。柏拉图哲学在中世纪从未彻底消失，而15世纪新柏拉图学派的成形，使古代两位大思想家各自的本有领域得到了明确划分：柏拉图被奉为神学家、形而上学实在的宗师，亚里士多德则被视为对月下世界——那个有生有灭的世界——的探究者。这一古老二分法的复得，动摇了亚里士多德主义与经院哲学之间长期维系的纽带，也为哲学腾出了不受形而上学束缚的新空间。不仅如此，与柏拉图传统的公开对话还促使若干教授怀疑亚里士多德学说是否自洽、是否可靠。与此同时，柏拉图主义与古代哲学的其他流派——斯多亚主义、怀疑主义、伊壁鸠鲁主义——同样以各自的方式推动了人们对自然界的思考，方法问题亦在其中。这些观念被运用于各个探究领域，使文艺复兴的自然思想获得了一种独具一格的身份；这一身份是在与亚里士多德主义的持续辩证中锻造出来的。可见，亚里士多德主义实为文艺复兴自然哲学背后的驱动力量：既因其进路多元、内部争论活跃，也因它充当了那些挑战传统大学教学范式者的论战靶标。无论是亚里士多德的追随者还是反对者，都必须不断与他的权威遗产周旋，并设法对其加以利用和改造。此外，还有一些非思辨性质的因素影响了自然哲学：印刷术、望远镜与显微镜等技术革新，地理大发现，以及大学自身的变迁，例如植物园的创设。
