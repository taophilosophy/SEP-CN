      Nonetheless, even when they did not sponsor academies, Renaissance lords and patrons often had a particular interest in scientific works and treatises, especially those devoted to subjects of military value (such as the works on metalworking by Vannoccio Biringuccio and George Agricola, or Niccolò Tartaglia’s treatise on ballistics, in the mid-sixteenth century), or booklets dedicated to *parva naturalia*, which were intended as forms of intellectual entertainment and usually contained descriptions of *miranda naturae* or astrological predictions. Exceptional natural events such as earthquakes—a famous one occurred in Pozzuoli in 1537—led to the publication of a number of short treatises that interpreted the calamity as either a natural phenomenon or as a sign sent by the celestial influences: these works were particularly sought after by powerful men, who wanted to be reassured about the significance of natural events and their possible consequences. Several Renaissance rulers cultivated an interest in sciences like alchemy, and patronized or participated first-hand in investigations of the natural world: disciplines like zoology, which depended on the collection of material, information, and drawings, relied particularly heavily on the sponsorship of the wealthy and powerful. The zoological and botanical works and catalogues which, though composed by university professors, started from the 1540s to circulate around Europe, were often addressed to or sponsored by rulers, who had the means to employ artists and other specialists needed to complete these costly volumes. Drawings were not simply ornaments to a text, but a necessity for accurate classification of plants and animals.
    step1: |-
      然而，即使并不庇护学院，文艺复兴的君主与赞助人往往也对科学著作和论著抱有特别的兴趣，尤其是涉及军事价值主题的著作（例如范诺乔·比林古乔与格奥尔格·阿格里科拉论金属加工的著作，或尼科洛·塔尔塔利亚16世纪中叶论弹道学的著作），或是献给 *parva naturalia* 的小册子——它们被当作一种智识娱乐，通常包含 *miranda naturae*（自然奇事）的描述或星象预言。地震之类的异常自然事件——1537年波佐利的一次著名地震——催生了许多短小论著，它们把这场灾祸解释为自然现象，或解释为天体影响所遣之征兆：这些著作特别受到权贵之士的求取，他们希望就自然事件的意义及其可能后果得到安抚。若干文艺复兴统治者培养了对炼金术之类学科的兴趣，并庇护甚至亲身参与对自然界的探究：诸如动物学这类依赖材料、信息与图画收集的学科，尤其倚重富者与权者的资助。那些由大学教授撰写、却自1540年代起开始在欧洲流传的动物与植物的著作和目录，往往是题献给统治者或由他们资助的——只有他们才有财力雇用完成这些昂贵图籍所需的画家与其他专门人才。图画并不只是文本的装饰，而是准确分类动植物所必需。
    step2: |-
      不过，文艺复兴的君主与赞助人即使不庇护学院，往往也对科学著作和论著怀有特别的兴趣：或涉军事价值的主题，如范诺乔·比林古乔与格奥尔格·阿格里科拉论冶金之作、尼科洛·塔尔塔利亚16世纪中叶论弹道之文；或为写给 *parva naturalia* 的小册子，作为一种智识消遣，通常载有自然奇事（*miranda naturae*）的记述或星象预言。地震这类反常自然事件——1537年波佐利那次有名的地震——曾促成一批短论问世，其中把灾异解作自然现象，或解作天体影响所示的征兆；这类著作尤为权贵所争求，因为他们渴望就自然事件的意义及其后果获得宽慰。好些文艺复兴统治者乐于研习炼金术之类的学科，或资助、或亲身参与对自然界的考察。动物学一类学科要靠标本、消息与图样的搜集为生，因而格外依赖富室权门的资助。那些出自大学教授之手、却从1540年代起便传布欧洲的动植物著作与名录，多半题献给统治者或由他们出资——唯有他们才雇得起完成这些昂贵图籍所必需的画师与其他专技之人。在这里，图画并非文本的点缀，而是准确类分动植物不可或缺的条件。
