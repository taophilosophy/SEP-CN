      Oresme was a determined opponent of astrology, which he attacked on religious and scientific grounds. In *De proportionibus proportionum* Oresme first examined raising rational numbers to rational powers before extending his work to include irrational powers. The results of both operations he termed *irrational ratios*, although he considered the first type commensurable with rational numbers, and the latter not. His motivation for this study was a suggestion of Thomas Bradwardine that the relationship between forces $(F)$, resistances $(R)$, and velocities $(V)$ is exponential (Grant 1966, 24–40; Clagett 1974, 224)[^clagett-1974][^grant-1966]. In modern terms:

      $$ \frac{F_2}{R_2} = \left( \frac{F_1}{R_1} \right)^{(V_2 /V_1)} $$
    step1: |-
      奥雷斯姆坚决反对占星术，并从宗教与科学两方面加以抨击。在《论比的比》（*De proportionibus proportionum*）中，奥雷斯姆首先考察把有理数提升到有理幂，随后把工作扩展到无理幂。他称这两种运算的结果为“非理比”（*irrational ratios*），尽管他认为前一种与有理数可通约，后一种则不可通约。这项研究的动机来自托马斯·布拉德沃丁的一个提示：力 $(F)$、阻力 $(R)$ 与速度 $(V)$ 之间的关系是指数式的（Grant 1966, 24–40; Clagett 1974, 224）[^clagett-1974][^grant-1966]。用现代术语表示即：

      $$ \frac{F_2}{R_2} = \left( \frac{F_1}{R_1} \right)^{(V_2 /V_1)} $$
    step2: |-
      奥雷斯姆是占星术的坚决反对者，从宗教与科学两面加以抨击。在 *De proportionibus proportionum* 中，他先考察有理数的有理幂，继而扩展到无理幂；他把这两种运算的结果统称为“非理比”（*irrational ratios*），不过认为前者与有理数可通约，后者则否。这项研究缘于托马斯·布拉德沃丁的一个提示：力 $(F)$、阻力 $(R)$ 与速度 $(V)$ 之间的关系呈指数关系（Grant 1966, 24–40; Clagett 1974, 224）[^clagett-1974][^grant-1966]。用现代术语表示即：

      $$ \frac{F_2}{R_2} = \left( \frac{F_1}{R_1} \right)^{(V_2 /V_1)} $$
