      ### 2.6 Mathematics
    step1: TBD
    step2: TBD
  - id: 29
    kind: body
    source: |-
      Oresme’s main contributions to mathematics are contained in his *Questiones super geometriam Euclidis* and his *Tractatus de configurationibus qualitatum et motuum*. In these works Oresme conceived of the idea of using rectangular coordinates (*latitudo* and *longitudo*) and the resulting geometric figures (*configurationes*) to distinguish between uniform and nonuniform distributions of various quantities, such as the change of velocity in relation to time or the distribution of the intensities of a quality in relation to the extension of the subject. In the discussion of motions the base line (*longitudo*) is the time, while the perpendiculars raised on the base line (*latitudines*) represent the velocity from instant to instant in the motion. Thus uniform acceleration is represented by a right triangle. Oresme even extended his definition to include three-dimensional figures (Clagett 1974, 226–228)[^clagett-1974]. Thus, he helped lay the foundation that later led to the discovery of analytic geometry by René Descartes (1596–1650).
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Furthermore, Oresme used his figures to give the first proof of the Merton theorem, discovered at Oxford in the 1330’s: the distance traveled in any given period by a body moving under uniform acceleration is the same as if the body moved at a uniform speed equal to its speed at the midpoint of the period (Clagett 1974, 225–226; Smorynski 2017, 216–222)[^clagett-1974][^smorynski-2017]. Some scholars believe that Oresme’s graphical representation of velocities was of great influence in the further development of kinematics, affecting in particular the work of Galileo (1564–1642).
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      Further noteworthy achievements in the field of mathematics are Oresme’s geometric proofs of the sums of certain converging series, particularly in his *Questiones super geometriam Euclidis* and his *Tractatus de configurationibus qualitatum et motuum* (Clagett 1974, 228)[^clagett-1974]. Most interestingly, Oresme seems to have given a general rule of how to find the sum of all convergent series of the form:

      $$ a + \frac{a}{m} + \frac{a}{m^2} + \frac{a}{m^3} + \ldots + \frac{a}{m^n} + \frac{a}{m^{n+1}} + \ldots , $$
    step1: TBD
    step2: TBD
  - id: 32
    kind: body
    source: |-
      with $a$ being any quantity (*aliqua quantitas*) and $m$ any natural number greater than or equal to 2 (cf. Murdoch 1964; Mazet 2003)[^mazet-2003][^murdoch-1964]. He informs us that we have to take the difference of two successive terms, that is $a/m^n - a/m^{n+1}$, and divide it through the first of these terms, that is $a/m^n$, so that we get:

      $$ \frac{a/m^n - a/m^{n+1}}{a/m^n} = \frac{m - 1}{m}.$$
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      The reverse of this fraction, i.e. $\frac{m}{m-1}$, will be the proportion of the sum of the whole series to the first term of the series, $a$. Thus, if we have the series

      $$ 1 + \frac{1}{3} + \frac{1}{9} + \frac{1}{27} + \ldots \frac{1}{3^n} + \ldots, $$
    step1: TBD
    step2: TBD
  - id: 34
