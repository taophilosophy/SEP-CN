      Among the few who opposed Aristotle’s doctrine of time was Petrus Johannis Olivi (b. c. 1248, d. 1298), who criticized Aristotle for regarding motion, rather than the actual existence of things, as the subject of time (Maier 1955, 110–111)[^maier-1955]. The Franciscan Gerardus Odonis (c. 1290–1349) was also a proponent of the independence of time from motion (Maier 1955, 134–137)[^maier-1955]. Oresme’s theory of time foreshadows that of classical physics to a certain degree, but, as is true of place and space, there are certain differences concerning the ontological status of time (Kirschner 2000a, 176–178)[^kirschner-2000a].
    step1: |-
      在少数反对亚里士多德时间学说的人中，有彼得·约翰·奥利维（约 1248–1298），他批评亚里士多德把运动而非事物的现实存在当作时间的载体（Maier 1955, 110–111）[^maier-1955]。方济各会士杰拉德·奥多尼斯（约 1290–1349）也主张时间独立于运动（Maier 1955, 134–137）[^maier-1955]。奥雷斯姆的时间理论在某种程度上预示了古典物理学的理论，但正如处所与空间的情形一样，时间的存在论地位仍有某些差异（Kirschner 2000a, 176–178）[^kirschner-2000a]。
