      Oresme is generally considered the greatest medieval economist. He presented his economic ideas in commentaries on the *Ethics*, *Politics*, and *Economics*, as well as an earlier treatise, *De origine, natura, jure et mutationibus monetarum*, the first comprehensive work upon money. In his *De origine, natura, jure et mutationibus monetarum*, of which he himself made a French translation under the title *Traictié de la premiere invention des monnoies*, Oresme argued that coinage belongs to the public, not to the prince, who has no right to vary arbitrarily the content or weight (Woodhouse 2017)[^woodhouse-2017]. By clearly delineating the destructive effects on a nation’s economy of a debasement of the currency, he influenced Charles V’s monetary and tax policies.
    step1: |-
      奥雷斯姆通常被视为最伟大的中世纪经济学家。他在《伦理学》《政治学》《经济学》的注疏中，以及在一部更早的论著《论货币的起源、性质、法权与变动》（*De origine, natura, jure et mutationibus monetarum*）中阐述了自己的经济思想；后者是第一部论货币的综合性著作。在《论货币的起源、性质、法权与变动》中（他本人还把它译成法文，题为《论货币的最初发明》*Traictié de la premiere invention des monnoies*），奥雷斯姆主张铸币属于公众，而不属于君主，君主无权任意改变铸币的成色或重量（Woodhouse 2017）[^woodhouse-2017]。他清楚地揭示了货币贬值对国民经济的破坏性影响，从而影响了查理五世的货币与税收政策。
    step2: |-
      奥雷斯姆通常被视为最伟大的中世纪经济学家。他的经济思想见于对《伦理学》《政治学》《经济学》的注疏，以及一部更早的专论 *De origine, natura, jure et mutationibus monetarum*——这是第一部论货币的综合性著作。在该书中（他本人又将其译为法文，题为 *Traictié de la premiere invention des monnoies*），奥雷斯姆主张铸币属于公众，而非君主；君主无权任意变更铸币的成色或重量（Woodhouse 2017）[^woodhouse-2017]。他清楚勾勒出货币贬值对一个国家经济的破坏性后果，从而影响了查理五世的货币与税收政策。
