      In his *Livre du ciel et du monde* and in other works (*Questiones super De celo*, *Questiones de spera*) Oresme brilliantly argues against any proof of the Aristotelian theory of a stationary Earth and a rotating sphere of the fixed stars. Although Oresme showed the possibility of a daily axial rotation of the Earth, he finished by affirming his belief in a stationary Earth (Clagett 1974, 225; Di Liscia/Szapiro 2020)[^clagett-1974]. Similarly, Oresme proves the possibility of a plurality of worlds, but ultimately keeps to the Aristotelian tenet of a single cosmos (Clagett 1974, 224–225; Harvey 2011)[^clagett-1974][^harvey-2011].
    step1: |-
      在其《天与世界之书》（*Livre du ciel et du monde*）以及其他著作（《〈论天〉问答》*Questiones super De celo*、《〈论天球〉问答》*Questiones de spera*）中，奥雷斯姆精彩地反驳了亚里士多德关于地球静止、恒星天球旋转的理论的任何证明。尽管奥雷斯姆展示了地球每日绕轴自转的可能性，他最终仍申明自己相信地球静止（Clagett 1974, 225; Di Liscia/Szapiro 2020）[^clagett-1974]。同样，奥雷斯姆证明了多个世界存在的可能性，但最终仍坚持单一宇宙的亚里士多德信条（Clagett 1974, 224–225; Harvey 2011）[^clagett-1974][^harvey-2011]。
    step2: |-
      在 *Livre du ciel et du monde* 以及其他著作（*Questiones super De celo*、*Questiones de spera*）中，奥雷斯姆精彩地驳斥了亚里士多德“地球静止、恒星天球旋转”这一理论的种种证明。他虽展示了地球每日绕轴自转的可能性，最终却仍申明相信地球静止（Clagett 1974, 225; Di Liscia/Szapiro 2020）[^clagett-1974]。同样，他证明了多个世界存在的可能，最终仍信守单一宇宙的亚里士多德信条（Clagett 1974, 224–225; Harvey 2011）[^clagett-1974][^harvey-2011]。
