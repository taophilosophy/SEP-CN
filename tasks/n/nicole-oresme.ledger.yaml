      奥雷斯姆主张物体的处所即其所充满或占据的空间，这并非单纯复活希腊古代的旧说；他与贾恩弗朗切斯科·皮科·德拉·米兰多拉（1469—1533）（Grant 1981, 275–276, n. 63）[^grant-1981]、弗朗切斯科·帕特里齐（1529—1597）（Grant 1981, 201; Schmitt 1967, 143）[^grant-1981][^schmitt-1967]、乔尔丹诺·布鲁诺（1548—1600）（Grant 1981, 186–187; Schmitt 1967, 142–143）[^grant-1981][^schmitt-1967]等人一样，堪称处所与绝对空间理论中牛顿（1643—1727）的先驱。然而，尽管两人的处所观与空间观颇为相近，在空间的存在论地位上却有本质差别。
