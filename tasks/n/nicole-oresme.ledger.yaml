      ### 2.3 Non-Aristotelian Concept of Time
    step1: |-
      ### 2.3 非亚里士多德的时间概念
    step2: |-
      ### 2.3 非亚里士多德的时间概念
  - id: 16
    kind: body
    source: |-
      What has just been said about Oresme’s rejection of Aristotelian tenets on the nature of place is also true for his theory of time. Aristotle defines time as the number (that is, the measure) of motion with respect to before and after. Thus he deduces the existence of time from the existence of motion, which means that time is nothing independent of motion. In contrast to Aristotle, Oresme in his Physics Commentary defines time as the successive duration of things (*duratio rerum successiva*, also *duratio successiva rerum* or *rerum duratio successiva*), that is, the duration of the actual existence of things. By deducing his concept of time from the duration of things, which duration is prior to and independent of motion, Oresme clearly deviates from Aristotle’s point of view and the conventional manner in which this topic was discussed among medieval scholastics (Kirschner 2000a, 171–176; Zanin 2000, 257–259; Caroti 2001)[^caroti-2001][^kirschner-2000a][^zanin-2000].
    step1: |-
      刚刚关于奥雷斯姆拒斥亚里士多德处所本性学说的论述，同样适用于他的时间理论。亚里士多德把时间定义为就先后而言的运动的数（即度量）。他由此从运动的存在推出时间的存在，这意味着时间并非独立于运动的东西。与亚里士多德相反，奥雷斯姆在其《物理学注疏》中把时间定义为事物的相继持存（*duratio rerum successiva*，亦作 *duratio successiva rerum* 或 *rerum duratio successiva*），即事物现实存在的持存。由于他从事物的持存——这种持存先于并独立于运动——推出其时间概念，奥雷斯姆显然偏离了亚里士多德的观点，也偏离了中世纪经院学者讨论这一主题的常规方式（Kirschner 2000a, 171–176; Zanin 2000, 257–259; Caroti 2001）[^caroti-2001][^kirschner-2000a][^zanin-2000]。
    step2: |-
      以上关于奥雷斯姆拒斥亚里士多德处所学说的论述，同样适用于他的时间理论。亚里士多德把时间定义为就先后而言的运动的数（即度量），因而从运动的存在推出时间的存在：时间并不独立于运动。奥雷斯姆则相反。他在《物理学注疏》中把时间定义为事物的相继持存（*duratio rerum successiva*，亦作 *duratio successiva rerum* 或 *rerum duratio successiva*），即事物现实存在的持续。他以先于并独立于运动的事物持存为出发点推出时间概念，显然背离了亚里士多德，也背离了中世纪经院学者讨论此题的常规路数（Kirschner 2000a, 171–176; Zanin 2000, 257–259; Caroti 2001）[^caroti-2001][^kirschner-2000a][^zanin-2000]。
