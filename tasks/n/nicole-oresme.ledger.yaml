      To a certain degree Oresme’s theory of the ontological status of accidents is reminiscent of Adam Wodeham’s (c. 1298–1358) and Gregory of Rimini’s (c. 1300–1358) theory of complexly signifiables (*complexe significabilia*) (Adam de Wodeham 1990, dist. 1, qu. 1, 180–208; Gregory of Rimini 1981, Prologus, qu. 1, artic. 1–3, 1–40; Nuchelmans 1973, 227–242; Biard 2004; Conti 2004; Gaskin 2004)[^adam-1990][^gregory-1981][^biard-2004][^conti-2004][^gaskin-2004][^nuchelmans-1973]. On some occasions Oresme explicitly uses the expression ‘complexe significabile’ in the framework of his ontology of accidents. However, despite these similarities between Oresme’s ontology of accidents and the theory of complexly signifiables it seems that this connection is of a secondary nature. For Oresme the determination of the ontological status of accidents is in the foreground, while Adam Wodeham and Gregory of Rimini had quite another aim. They wanted to determine what the object of knowledge is. Their solution that the *significatum totale* or *significatum adaequatum* of a conclusion or proposition is the object of knowledge is not confined to conclusions or propositions concerning accidents, such as ‘homo est albus’, whose *significatum totale* is *hominem esse album* (which itself is a *significabile per complexum*). Rather, their solution applies to any kind of conclusion or proposition: for instance, ‘Deus est’ or ‘homo est animal’. Neither Adam Wodeham nor Gregory of Rimini made any attempt to identify accidents with the correspondent complexly signifiables such as ‘hominem esse album’. Oresme does not derive the ontological status of accidents from their being complexly signifiables. Instead, the converse is true: given that Oresme rejects the traditional view that accidents are accidental forms, he must avoid the use of substantives in denominating the ontological status of accidents and thus quasi-automatically arrives at formulations that are characteristic of the theory of complexly signifiables.
    step1: |-
      在某种程度上，奥雷斯姆关于偶性存在论地位的理论令人想到亚当·德·沃德汉姆（约 1298–1358）与里米尼的格里高利（约 1300–1358）的复合可意谓者（*complexe significabilia*）理论（Adam de Wodeham 1990, dist. 1, qu. 1, 180–208; Gregory of Rimini 1981, Prologus, qu. 1, artic. 1–3, 1–40; Nuchelmans 1973, 227–242; Biard 2004; Conti 2004; Gaskin 2004）[^adam-1990][^gregory-1981][^biard-2004][^conti-2004][^gaskin-2004][^nuchelmans-1973]。奥雷斯姆有时确实在其偶性存在论的框架内使用“复合可意谓者”这一说法。然而，尽管奥雷斯姆的偶性存在论与复合可意谓者理论有这些相似之处，这一联系看来仍是次要的。奥雷斯姆的首要关切是确定偶性的存在论地位，而亚当·德·沃德汉姆与里米尼的格里高利的目标则大不相同：他们要确定什么是知识对象。他们主张，一个结论或命题的总体意谓（*significatum totale*）或充分意谓（*significatum adaequatum*）就是知识对象；这一解决方案并不限于关于偶性的结论或命题，例如“homo est albus”（“人是白的”），其总体意谓是“hominem esse album”（“人之为白”，它本身是一个 *significabile per complexum*）。相反，他们的方案适用于任何种类的结论或命题，例如“Deus est”（“上帝存在”）或“homo est animal”（“人是动物”）。亚当·德·沃德汉姆与里米尼的格里高利都没有试图把偶性与相应的复合可意谓者（如“hominem esse album”）相等同。奥雷斯姆并不从偶性之作为复合可意谓者推出其存在论地位；实际情况恰好相反：既然奥雷斯姆拒斥偶性即偶性形式这一传统观点，他就必须避免用实体词来称谓偶性的存在论地位，于是几乎自动地采用了复合可意谓者理论所特有的表述方式。
    step2: |-
      奥雷斯姆关于偶性存在论地位的理论，在某种程度上令人联想到亚当·德·沃德汉姆（约 1298–1358）与里米尼的格里高利（约 1300–1358）的复合可意谓者（*complexe significabilia*）学说（Adam de Wodeham 1990, dist. 1, qu. 1, 180–208; Gregory of Rimini 1981, Prologus, qu. 1, artic. 1–3, 1–40; Nuchelmans 1973, 227–242; Biard 2004; Conti 2004; Gaskin 2004）[^adam-1990][^gregory-1981][^biard-2004][^conti-2004][^gaskin-2004][^nuchelmans-1973]。奥雷斯姆有时确实在其偶性存在论的框架内径用“复合可意谓者”一语。然而，尽管两家学说有这些相似之处，这一关联看来仍是次要的。奥雷斯姆首要关心的是确定偶性的存在论地位，亚当·德·沃德汉姆与里米尼的格里高利却另有所图：他们要确定知识对象是什么。他们主张，结论或命题的总体意谓（*significatum totale*）或充分意谓（*significatum adaequatum*）即知识对象；这一答案并不局限于涉及偶性的结论或命题——如“homo est albus”（“人是白的”），其总体意谓为“hominem esse album”（“人之为白”，本身是一个 *significabile per complexum*）——而适用于任何结论或命题，例如“Deus est”（“上帝存在”）或“homo est animal”（“人是动物”）。两人都没有试图把偶性与相应的复合可意谓者（如“hominem esse album”）等同起来。奥雷斯姆也不从“偶性是复合可意谓者”推出其存在论地位；情况恰好相反：既然他拒斥偶性即偶性形式这一传统观点，就不能再用实体词称谓偶性的存在论地位，于是几乎不假思索地采用了复合可意谓者学说的典型表述。
