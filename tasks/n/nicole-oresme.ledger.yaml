      is divergent by arguing that this series consists of an infinity of parts that are greater than $1/2$, so that the whole is infinite. His demonstration rests on the fact that the third and the fourth term taken together $(1/3 + 1/4)$ are greater than $1/2$, which also applies to the sum of the fifth through the eighth term $1/5 + 1/6 + 1/7 + 1/8$, which is greater than $4 \times 1/8$ and the sum of the ninth through the 16ᵗʰ term and so on (Oresme, *loc. cit.*, Qu. 2, ll. 58–68).
