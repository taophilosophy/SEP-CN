      In the first redaction of his Commentary on Aristotle’s Meteorology Oresme stated the supralunar location of comets, a unique opinion for a medieval philosopher (Kirschner 2000c; for the identification of the anonymous manuscript as Oresmian see Panziza 2015)[^kirschner-2000c]. Oresme’s view of the celestial nature of the Milky Way was also unconventional, otherwise only held by Albert the Great and Henry of Langenstein.
    step1: |-
      在其《亚里士多德〈气象学〉注疏》的第一个修订本中，奥雷斯姆提出彗星位于月上区域，这对中世纪哲学家来说是独一无二的见解（Kirschner 2000c; 关于该匿名抄本出自奥雷斯姆的鉴定，见 Panziza 2015）[^kirschner-2000c]。奥雷斯姆关于银河具有天体性质的看法同样不合常规，此前只有大阿尔伯特与朗根施泰因的亨利持同样观点。
    step2: |-
      在《亚里士多德〈气象学〉注疏》的第一个修订本中，奥雷斯姆主张彗星位于月上区域——这对中世纪哲学家而言是绝无仅有的见解（Kirschner 2000c; 该匿名抄本出自奥雷斯姆的手笔，鉴定见 Panziza 2015）[^kirschner-2000c]。他关于银河具有天体性质的看法同样不合流俗，此前唯大阿尔伯特与朗根施泰因的亨利持此说。
