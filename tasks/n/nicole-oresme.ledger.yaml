      Oresme then asserted that the ratio of any two celestial motions is probably incommensurable (Grant 1971, 67–77)[^grant-1971]. This excludes precise predictions of successively repeating conjunctions, oppositions, and other astronomical aspects, and he subsequently claimed, in *Ad pauca respicientes* (its name derives from the opening sentence “Concerning some matters …”), that astrology was thereby refuted (Grant 1966, 83–111)[^grant-1966]. In his *Livre de divinacions* and his *Tractatus contra astronomos* Oresme tries to show that astrology is “most dangerous to those of high estate, such as princes and lords to whom appertains the government of the commonwealth” (Coopland 1952, 51)[^coopland-1952]. As with astrology, he fought against the widespread belief in occult and “marvelous” phenomena by explaining them in terms of natural causes. Oresme’s writings against astrology and magic were due to his concern over the king’s and his court’s addiction to these practices. Interestingly, in the first redaction of his Questions on Meteorology Oresme does not yet turn out to be the resolute opponent of astrology as we know him from his later works, but, quite the contrary, adheres to its principles (Panzica 2021, 2)[^panzica-2021].
    step1: |-
      奥雷斯姆随后断言，任意两种天体运动之比很可能是不可通约的（Grant 1971, 67–77）[^grant-1971]。这就排除了对依次重复的会合、冲以及其他天文相位的精确预测，他随即在《答少数人》（*Ad pauca respicientes*，其名取自开篇句“关于若干事项……”）中宣称，占星术由此被驳倒（Grant 1966, 83–111）[^grant-1966]。在《论占卜》（*Livre de divinacions*）与《驳占星家》（*Tractatus contra astronomos*）中，奥雷斯姆试图表明，占星术“对高居尊位者最为危险，例如身负共同体治理之责的君主与领主”（Coopland 1952, 51）[^coopland-1952]。与对待占星术一样，他也反对广泛流行的对隐秘现象与“奇异”现象的信仰，办法是用自然原因加以解释。奥雷斯姆撰写反占星术与反魔法之作，是出于对国王及其宫廷沉溺于这类实践的忧虑。有趣的是，在其《气象学问题》的第一个修订本中，奥雷斯姆尚未表现出后世著作中那种坚决的反占星术立场，恰恰相反，他仍信守占星术的原则（Panzica 2021, 2）[^panzica-2021]。
    step2: |-
      奥雷斯姆继而断言，任意两种天体运动之比很可能不可通约（Grant 1971, 67–77）[^grant-1971]。如此便排除了对周而复始的会合、冲及其他天文相位的精确预测；他随即在 *Ad pauca respicientes*（其名取自开篇句“关于若干事项……”）中宣称，占星术由此不攻自破（Grant 1966, 83–111）[^grant-1966]。在 *Livre de divinacions* 与 *Tractatus contra astronomos* 中，奥雷斯姆力图表明，占星术“对身居高位者最为危险，例如身负共同体治理之责的君主与领主”（Coopland 1952, 51）[^coopland-1952]。占星术如此，流行的隐秘现象与“奇异”现象之信仰亦然：他都用自然原因来解释。他之所以撰写反占星术、反魔法之作，是忧虑国王及其宫廷沉溺此道。有趣的是，在《气象学问题》的第一个修订本中，奥雷斯姆还不是后来著作中那个坚决的反占星术者；恰恰相反，他此时仍信守占星术的原则（Panzica 2021, 2）[^panzica-2021]。
