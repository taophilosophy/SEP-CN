      Further noteworthy achievements in the field of mathematics are Oresme’s geometric proofs of the sums of certain converging series, particularly in his *Questiones super geometriam Euclidis* and his *Tractatus de configurationibus qualitatum et motuum* (Clagett 1974, 228)[^clagett-1974]. Most interestingly, Oresme seems to have given a general rule of how to find the sum of all convergent series of the form:

      $$ a + \frac{a}{m} + \frac{a}{m^2} + \frac{a}{m^3} + \ldots + \frac{a}{m^n} + \frac{a}{m^{n+1}} + \ldots , $$
    step1: |-
      数学领域另一些值得注意的成就，是奥雷斯姆对某些收敛级数之和的几何证明，尤其见于其《〈欧几里得几何学〉问答》与《论性质与运动的构形》（Clagett 1974, 228）[^clagett-1974]。最有趣的是，奥雷斯姆似乎给出了求下列形式的一切收敛级数之和的一般规则：

      $$ a + \frac{a}{m} + \frac{a}{m^2} + \frac{a}{m^3} + \ldots + \frac{a}{m^n} + \frac{a}{m^{n+1}} + \ldots , $$
    step2: |-
      数学方面另有一些值得称道的成就：奥雷斯姆对若干收敛级数之和给出几何证明，尤见于 *Questiones super geometriam Euclidis* 与 *Tractatus de configurationibus qualitatum et motuum*（Clagett 1974, 228）[^clagett-1974]。最有趣的是，他似乎给出了一条求一切如下形式收敛级数之和的一般规则：

      $$ a + \frac{a}{m} + \frac{a}{m^2} + \frac{a}{m^3} + \ldots + \frac{a}{m^n} + \frac{a}{m^{n+1}} + \ldots , $$
  - id: 32
    kind: body
    source: |-
      with $a$ being any quantity (*aliqua quantitas*) and $m$ any natural number greater than or equal to 2 (cf. Murdoch 1964; Mazet 2003)[^mazet-2003][^murdoch-1964]. He informs us that we have to take the difference of two successive terms, that is $a/m^n - a/m^{n+1}$, and divide it through the first of these terms, that is $a/m^n$, so that we get:

      $$ \frac{a/m^n - a/m^{n+1}}{a/m^n} = \frac{m - 1}{m}.$$
    step1: |-
      其中 $a$ 为任一量（*aliqua quantitas*），$m$ 为任一大于或等于 2 的自然数（参 Murdoch 1964; Mazet 2003）[^mazet-2003][^murdoch-1964]。他告诉我们，须取两个相邻项之差，即 $a/m^n - a/m^{n+1}$，再除以其中第一项，即 $a/m^n$，于是得到：

      $$ \frac{a/m^n - a/m^{n+1}}{a/m^n} = \frac{m - 1}{m}.$$
    step2: |-
      其中 $a$ 是任一量（*aliqua quantitas*），$m$ 是任一不小于 2 的自然数（参 Murdoch 1964; Mazet 2003）[^mazet-2003][^murdoch-1964]。他说，取相邻两项之差 $a/m^n - a/m^{n+1}$，除以其中第一项 $a/m^n$，便得：

      $$ \frac{a/m^n - a/m^{n+1}}{a/m^n} = \frac{m - 1}{m}.$$
