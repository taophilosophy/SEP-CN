      From 1362, when he left the university, until his death in 1382, Oresme served Charles, the dauphin of France, who was regent during his father’s captivity (1356–1364) and was crowned King Charles V on his father’s death (1364) (Burton 2007, 11–13)[^burton-2007]. Oresme was appointed canon (1362) and later dean (1364) of the Cathedral of Rouen and also canon at Sainte-Chapelle in Paris (1363) (Clagett 1974, 223)[^clagett-1974]. Oresme was elected bishop of Lisieux in 1377 and was consecrated in 1378. He died on July 11, 1382.
    step1: |-
      从 1362 年离开大学到 1382 年去世，奥雷斯姆一直效力于法国王太子查理：后者在其父被俘期间（1356–1364）摄政，并在其父去世后（1364）加冕为国王查理五世（Burton 2007, 11–13）[^burton-2007]。奥雷斯姆于 1362 年获任鲁昂主教座堂咏礼司铎，1364 年升任该座堂主任，1363 年兼任巴黎圣礼拜堂咏礼司铎（Clagett 1974, 223）[^clagett-1974]。1377 年，奥雷斯姆当选利雪主教，1378 年祝圣。他于 1382 年 7 月 11 日去世。
    step2: |-
      1362 年奥雷斯姆离开大学，此后直至 1382 年去世，他一直效力于法国王太子查理。查理在其父被俘期间（1356—1364）摄政，父死之后（1364）加冕为国王查理五世（Burton 2007, 11–13）[^burton-2007]。奥雷斯姆 1362 年获任鲁昂主教座堂咏礼司铎，1364 年擢升座堂主任，1363 年又兼任巴黎圣礼拜堂咏礼司铎（Clagett 1974, 223）[^clagett-1974]。1377 年，他当选利雪主教，1378 年受祝圣。1382 年 7 月 11 日，奥雷斯姆去世。
