      In his *De visione stellarum* Oresme departs from the standard view of earlier authors in optics such as Ptolemy (2ⁿᵈ century), Ibn al-Haytham (965–c. 1040), Roger Bacon (c. 1214–c. 1292), and Witelo (c. 1230/35–after 1275), who all held that refraction can only occur at the interface of two media of differing densities and thus would not take place in a single medium of uniformly varying density. He states – more than 300 years before Robert Hooke (1635–1703) and Newton – that atmospheric refraction occurs along a curve and proposes to approximate the curved path of a ray of light in a medium of uniformly varying density, in this case the atmosphere, by an infinite series of line segments each representing a single refraction (Burton 2007, 33–64; Szapiro 2022)[^burton-2007][^szapiro-2022].
    step1: |-
      在《论星辰的视觉》（*De visione stellarum*）中，奥雷斯姆背离了此前光学作者的标准观点，如托勒密（2 世纪）、伊本·海赛姆（965–约 1040）、罗吉尔·培根（约 1214–约 1292）与维特洛（约 1230/35–1275 之后）的观点：他们都认为折射只能发生在密度不同的两种介质的界面上，因此在密度均匀变化的单一介质中不会发生。奥雷斯姆指出——比罗伯特·胡克（1635–1703）与牛顿早三百多年——大气折射沿曲线发生，并提出用无穷多线段来逼近光线在密度均匀变化的介质（此处即大气）中的弯曲路径，每一线段代表一次折射（Burton 2007, 33–64; Szapiro 2022）[^burton-2007][^szapiro-2022]。
    step2: |-
      在 *De visione stellarum* 中，奥雷斯姆背离了先前光学作者的标准看法。托勒密（2 世纪）、伊本·海赛姆（965—约 1040）、罗吉尔·培根（约 1214—约 1292）与维特洛（约 1230/35–1275 之后）都认为，折射只发生在两种不同密度介质的交界处，在密度均匀变化的单一介质中则不会发生。奥雷斯姆却指出，大气折射沿曲线进行——这比罗伯特·胡克（1635–1703）和牛顿早三百多年。他提出以无穷多线段逼近光线在大气这类密度均匀变化的介质中的路径，每一线段代表一次折射（Burton 2007, 33–64; Szapiro 2022）[^burton-2007][^szapiro-2022]。
