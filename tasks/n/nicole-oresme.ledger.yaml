      For Oresme space is neither substance nor accident. It is nothing that can be signified by a noun or pronoun, but only by adverbs like ‘here’ and ‘there’. That means that space is not absolutely non-existent, but it has by no means the high ontological status accorded to it by Newton. While for Newton space approaches more nearly to the nature of substance than of accident, for Oresme it ranks on a far lower ontological level than an accident (Kirschner 1997, 103–104; Kirschner 2000a, 163–164)[^kirschner-1997][^kirschner-2000a].
    step1: |-
      对奥雷斯姆来说，空间既非实体也非偶性。它不是什么可以用名词或代词指称的东西，而只能用“这里”“那里”一类副词表示。这意味着空间并非绝对不存在，但它绝没有牛顿所赋予的那种高的存在论地位。对牛顿而言，空间更接近实体而非偶性的本性；对奥雷斯姆而言，空间的地位却远低于偶性（Kirschner 1997, 103–104; Kirschner 2000a, 163–164）[^kirschner-1997][^kirschner-2000a]。
    step2: |-
      在奥雷斯姆看来，空间既不是实体，也不是偶性。它不是任何可以用名词或代词指称的东西，只能用“这里”“那里”这样的副词来表示。这并不意味着空间绝对不存在，但它远不具备牛顿赋予空间的那种崇高存在论地位：牛顿的空间近乎实体而非偶性，奥雷斯姆的空间却连偶性都不如（Kirschner 1997, 103–104; Kirschner 2000a, 163–164）[^kirschner-1997][^kirschner-2000a]。
