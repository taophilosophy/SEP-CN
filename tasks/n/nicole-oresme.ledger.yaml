      Oresme’s discussion of the infinite in his Physics Commentary is another fascinating testimony to the originality of this outstanding medieval philosopher. Oresme demonstrates by thought experiments that of two actual infinites neither is bigger or smaller than the other. Oresme’s proof is somewhat reminiscent of Georg Cantor’s (1845–1918) demonstration that certain infinite sets are equinumerous. Thus Oresme shows by the principle of one-to-one correspondence that the collection of odd natural numbers is not smaller than the collection of natural numbers, because it is possible to count the odd natural numbers by the natural numbers (Sesiano 1996; Kirschner 1997, 79–83, 88–92)[^kirschner-1997][^sesiano-1996].
    step1: TBD
    step2: TBD
  - id: 41
    kind: body
    source: |-
      Oresme was not the first to use the principle of one-to-one correspondence in discussing the properties of actual infinites. Bradwardine, whose main aim was to refute Aristotle’s opinion that the world is eternal, applied the principle of one-to-one correspondence to show that two infinites would be equal or – in modern terms – that an infinite subset is equal to the set of which it is a part (Bradwardine 1618, 121C–124C). On the other hand Bradwardine takes it for granted that an infinite subset is smaller than the set of which it is a part. Thus he is of the opinion that under the assumption of an eternal world that has no beginning the multitude of all human souls, which until now have been created, must be greater than the multitude of the male or the female souls alone (Bradwardine 1618, 132E–133A). From this contradiction – an infinite subset cannot be both smaller than and equal to the set of which it is a part – Bradwardine draws the inference that the eternity of the world is impossible (Thakkar 2009, 626–629)[^thakkar-2009].
    step1: TBD
    step2: TBD
  - id: 42
    kind: body
    source: |-
      Unlike Bradwardine, Oresme shows that of two actual infinites neither is greater or smaller than the other. This result is different from Bradwardine’s, because Oresme’s result does not necessarily imply equality between actual infinites. Moreover Oresme shows that cases can be conceived in which two infinites can be regarded as unequal, but this unequality is not to be understood in the sense of ‘smaller’ or ‘greater’ (Oresme does not contradict himself), but rather in the sense of ‘different’. Since comparable quantities are either equal to one another or one is smaller or greater than the other, Oresme concludes that actual infinites are incomparable: that is, that notions like ‘smaller’, ‘bigger’, and ‘equal’ do not apply to infinites (Sesiano 1996; Kirschner 1997, 79–83, 88–92)[^kirschner-1997][^sesiano-1996]. Oresme’s treatment of the infinite was extensively used by Pierre Ceffons when he commented the *Sentences* in Paris in 1348–1349 (Mazet 2004, 175–182)[^mazet-2004].
