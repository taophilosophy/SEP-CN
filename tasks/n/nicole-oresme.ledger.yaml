      ### 2.2 Non-Aristotelian Concepts of Place, and Space
    step1: |-
      ### 2.2 非亚里士多德的处所与空间概念
    step2: |-
      ### 2.2 非亚里士多德的处所与空间概念
  - id: 10
    kind: body
    source: |-
      There were only very few authors since late antiquity – that is, since Simplicius (b. c. 500, d. after 533) and his contemporary John Philoponus – who rejected Aristotle’s definition of place as the innermost surface of the surrounding body. In his Commentary on Aristotle’s Physics Oresme argued for the non-Aristotelian position that the (physical) place of a body is the space filled or occupied by the body (Kirschner 1997, 101, 116–123; Kirschner 2000a, 146–159; Sylla 2020)[^kirschner-1997][^kirschner-2000a][^sylla-2020]. Prior to Oresme Geraldus Odonis (c. 1290–1349) (Bakker/de Boer 2009; Robert 2012, 85–90)[^bakker-2009][^robert-2012], Walter Chatton (c. 1290–1343) (Robert 2012, 83–85)[^robert-2012] and William Crathorn (fl. 1330s) (Robert 2012, 90–94)[^robert-2012] held the same view. It remains unknown whether their arguments exerted a direct influence on Oresme. Another anti-Aristotelian theory of place was propounded by Petrus Aureoli (c. 1280–1322). Aureoli held that place is the determinate position of the located body in the universe (Schabel 2000, 126–138; Robert 2012, 79–82)[^robert-2012][^schabel-2000].
    step1: |-
      自晚古以来——即自辛普里丘（约生于 500 年，卒于 533 年之后）及其同时代人约翰·菲洛波努斯以来——只有极少数作者拒斥亚里士多德把处所定义为包围物体最内层表面的做法。在其《亚里士多德〈物理学〉注疏》中，奥雷斯姆主张一种非亚里士多德立场：物体的（物理）处所就是该物体所充满或占据的空间（Kirschner 1997, 101, 116–123; Kirschner 2000a, 146–159; Sylla 2020）[^kirschner-1997][^kirschner-2000a][^sylla-2020]。在奥雷斯姆之前，杰拉德·奥多尼斯（约 1290–1349）（Bakker/de Boer 2009; Robert 2012, 85–90）[^bakker-2009][^robert-2012]、沃尔特·查顿（约 1290–1343）（Robert 2012, 83–85）[^robert-2012]与威廉·克雷索恩（活跃于 1330 年代）（Robert 2012, 90–94）[^robert-2012]也持同样观点；他们的论证是否直接影响了奥雷斯姆，已不可考。另一种反亚里士多德的处所理论由彼得鲁斯·奥雷奥利（约 1280–1322）提出。奥雷奥利认为，处所是被定位物体在宇宙中的确定位置（Schabel 2000, 126–138; Robert 2012, 79–82）[^robert-2012][^schabel-2000]。
    step2: |-
      自晚古以来——也就是自辛普里丘（约 500 年生，533 年后卒）及其同时代人约翰·菲洛波努斯以来——拒斥亚里士多德“处所即包围物体最内层表面”这一定义的作者寥寥无几。奥雷斯姆在《亚里士多德〈物理学〉注疏》中主张一种非亚里士多德立场：物体的（物理）处所，就是它充满或占据的空间（Kirschner 1997, 101, 116–123; Kirschner 2000a, 146–159; Sylla 2020）[^kirschner-1997][^kirschner-2000a][^sylla-2020]。在奥雷斯姆之前，杰拉德·奥多尼斯（约 1290–1349）（Bakker/de Boer 2009; Robert 2012, 85–90）[^bakker-2009][^robert-2012]、沃尔特·查顿（约 1290–1343）（Robert 2012, 83–85）[^robert-2012]与威廉·克雷索恩（活跃于 1330 年代）（Robert 2012, 90–94）[^robert-2012]即持此说；其论证是否曾直接影响奥雷斯姆，今已无从查考。彼得鲁斯·奥雷奥利（约 1280–1322）提出了另一种反亚里士多德的处所理论：处所是被定位物体在宇宙中的确定位置（Schabel 2000, 126–138; Robert 2012, 79–82）[^robert-2012][^schabel-2000]。
  - id: 11
    kind: body
    source: |-
      In stating that the place of a body is the space filled or occupied by it Oresme does not merely revive an opinion of Greek antiquity; he can also be regarded, together with philosophers like Gianfrancesco Pico della Mirandola (1469–1533) (Grant 1981, 275–276, n. 63)[^grant-1981], Francesco Patrizi (1529–1597) (Grant 1981, 201; Schmitt 1967, 143)[^grant-1981][^schmitt-1967], and Giordano Bruno (1548–1600) (Grant 1981, 186–187; Schmitt 1967, 142–143)[^grant-1981][^schmitt-1967], as a precursor of Newton (1643–1727) in the theory of place and absolute space. None the less, despite the close resemblance that Oresme’s view of place and space bears to Newton’s, there are characteristic differences concerning the ontological status of space.
    step1: |-
