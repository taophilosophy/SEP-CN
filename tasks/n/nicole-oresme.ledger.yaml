      ### 2.1 偶性的存在论地位
  - id: 7
    kind: body
    source: |-
      One of the most interesting features in Oresme’s Commentary on Aristotle’s Physics is his view on the ontological status of accidents. Characteristic of Oresme’s view on accidents is that he does not consider them accidental forms, but only so-called *condiciones* or *modi* *(se habendi)* of the substance. But this does not mean that Oresme identifies accidents with the substance in the way that Ockham had identified the quantity of a substance with the substance itself. Rather, Oresme regards accidents as distinct from the substance, but he assigns them a lower ontological status than the commonly accepted accidental forms. For Oresme motion, being-in-a-place (*esse in loco*), the quantity of a substance, its *esse tantam*, and qualities (such as the *esse album* of a substance) are such *condiciones* or *modi* (Celeyrette/Mazet 1998; Caroti 2000; Caroti 2001; Caroti 2004; Mazet 2000; Kirschner 1997, 52–61, 73–76, 121, 141–142; Kirschner, 2000b, pp. 263–272; Pasnau 2011, pp. 247–252; Bruno 2019, pp. 86–121)[^bruno-2019][^caroti-2000][^caroti-2001][^caroti-2004][^celeyrette-1998][^kirschner-1997][^mazet-2000][^pasnau-2011]. As Panzica has solved the complex question of Oresme’s authorship of his Commentary on Aristotle’s Meteorology by identifying two different redactions (Panzica 2015; Panzica 2017)[^panzica-2015][^panzica-2017], we can now be certain that Oresme took the first steps in establishing his condicio theory of accidents in the first redaction of his Meteorology Commentary (Kirschner 2010)[^kirschner-2010], which is probably his earliest work (Panzica 2017, 27–33)[^panzica-2017].
    step1: |-
      奥雷斯姆《亚里士多德〈物理学〉注疏》中最引人注目的特点之一，是他关于偶性存在论地位的观点。其偶性观的特色在于：他不把偶性看作偶性形式，而只看作实体所谓 *condiciones* 或 *modi* *(se habendi)*。但这并不意味着奥雷斯姆像奥卡姆把实体的量与实体本身等同那样，把偶性与实体等同起来。相反，他认为偶性有别于实体，却赋予其比通常接受的偶性形式更低的存在论地位。对奥雷斯姆来说，运动、在处所存在（*esse in loco*）、实体的量、其 *esse tantam*，以及各种性质（例如实体的“白性存在”*esse album*），都是这样的 *condiciones* 或 *modi*（Celeyrette/Mazet 1998; Caroti 2000; Caroti 2001; Caroti 2004; Mazet 2000; Kirschner 1997, 52–61, 73–76, 121, 141–142; Kirschner, 2000b, pp. 263–272; Pasnau 2011, pp. 247–252; Bruno 2019, pp. 86–121）[^bruno-2019][^caroti-2000][^caroti-2001][^caroti-2004][^celeyrette-1998][^kirschner-1997][^mazet-2000][^pasnau-2011]。由于 Panzica 辨识出两个不同的修订本，解决了奥雷斯姆《亚里士多德〈气象学〉注疏》著作权这一复杂问题（Panzica 2015; Panzica 2017）[^panzica-2015][^panzica-2017]，我们现在可以确定：奥雷斯姆是在该注疏的第一个修订本中迈出建立其偶性样态论的最初步伐的（Kirschner 2010）[^kirschner-2010]，而这部注疏很可能是他最早的作品（Panzica 2017, 27–33）[^panzica-2017]。
    step2: |-
      奥雷斯姆《亚里士多德〈物理学〉注疏》中最引人注目的一点，是他对偶性存在论地位的看法。其特色在于：他不把偶性视为偶性形式，而只看作实体的所谓 *condiciones* 或 *modi* *(se habendi)*。这并不等于像奥卡姆那样，把实体的量与实体本身相等同。奥雷斯姆认为偶性有别于实体，但赋予它的存在论地位低于通常承认的偶性形式。在他那里，运动、在处所存在（*esse in loco*）、实体的量、其 *esse tantam*，以及各种性质（如实体的“白性存在”*esse album*），都属于此类 *condiciones* 或 *modi*（Celeyrette/Mazet 1998; Caroti 2000; Caroti 2001; Caroti 2004; Mazet 2000; Kirschner 1997, 52–61, 73–76, 121, 141–142; Kirschner, 2000b, pp. 263–272; Pasnau 2011, pp. 247–252; Bruno 2019, pp. 86–121）[^bruno-2019][^caroti-2000][^caroti-2001][^caroti-2004][^celeyrette-1998][^kirschner-1997][^mazet-2000][^pasnau-2011]。Panzica 辨识出两个不同的修订本，解决了奥雷斯姆《亚里士多德〈气象学〉注疏》著作权的复杂问题（Panzica 2015; Panzica 2017）[^panzica-2015][^panzica-2017]；据此可以确定，奥雷斯姆正是在该注疏的第一个修订本中开始建立其偶性样态论的（Kirschner 2010）[^kirschner-2010]，而这部注疏很可能是他最早的作品（Panzica 2017, 27–33）[^panzica-2017]。
