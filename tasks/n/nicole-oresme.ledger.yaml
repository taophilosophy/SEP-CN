      Another central conclusion that Oresme draws in his Physics Commentary in his discussion of the nature of place is that beyond the world, that is, outside the last sphere, there exists an infinite void space. Oresme’s conception of an extracosmic infinite void space is well known from other works by him (*Le livre du ciel et du monde*, *Questiones super De celo*) (Kirschner 2000a, 164–168)[^kirschner-2000a]. Besides Oresme there were few medieval philosophers who assumed the existence of an infinite void space beyond the world. The Jewish philosopher Hasdai Crescas (c. 1340–1410/11) (Crescas 1929, 189; Grant 1969, 50, n. 50; Grant 1981, 271, n. 33, 321, n. 5)[^crescas-1929][^grant-1969][^grant-1981], Thomas Bradwardine (c. 1290–1349) (Grant 1969, 44–47; Grant 1981, 135–144)[^grant-1969][^grant-1981], Robert Holkot (d. 1349) (Grant 1981, 350, n. 130)[^grant-1981] and William Crathorn (fl. 1330s) (Robert 2012, 77, n. 2)[^robert-2012] may be mentioned among them.
    step1: |-
      奥雷斯姆在其《物理学注疏》讨论处所本性时得出的另一个核心结论是：在世界之外，即在最后一重天球之外，存在一个无限的虚空空间。奥雷斯姆关于宇宙之外无限虚空空间的构想，也见于他的其他著作（《天与世界之书》[*Le livre du ciel et du monde*]、《〈论天〉问答》[*Questiones super De celo*]）（Kirschner 2000a, 164–168）[^kirschner-2000a]。除奥雷斯姆之外，假定世界之外存在无限虚空空间的中世纪哲学家很少。犹太哲学家哈斯代·克雷斯卡斯（约 1340–1410/11）（Crescas 1929, 189; Grant 1969, 50, n. 50; Grant 1981, 271, n. 33, 321, n. 5）[^crescas-1929][^grant-1969][^grant-1981]、托马斯·布拉德沃丁（约 1290–1349）（Grant 1969, 44–47; Grant 1981, 135–144）[^grant-1969][^grant-1981]、罗伯特·霍尔柯特（卒于 1349）（Grant 1981, 350, n. 130）[^grant-1981]与威廉·克雷索恩（活跃于 1330 年代）（Robert 2012, 77, n. 2）[^robert-2012]都可以列入其中。
    step2: |-
      奥雷斯姆在《物理学注疏》讨论处所本性时还得出一个核心结论：在世界之外，即最后一重天球之外，存在一个无限的虚空空间。他关于宇宙之外无限虚空空间的构想，亦见于其他著作（*Le livre du ciel et du monde*、《〈论天〉问答》*Questiones super De celo*）（Kirschner 2000a, 164–168）[^kirschner-2000a]。中世纪假定世外存在无限虚空空间的哲学家屈指可数，除奥雷斯姆外，还可举出犹太哲学家哈斯代·克雷斯卡斯（约 1340—1410/11）（Crescas 1929, 189; Grant 1969, 50, n. 50; Grant 1981, 271, n. 33, 321, n. 5）[^crescas-1929][^grant-1969][^grant-1981]、托马斯·布拉德沃丁（约 1290—1349）（Grant 1969, 44–47; Grant 1981, 135–144）[^grant-1969][^grant-1981]、罗伯特·霍尔柯特（卒于 1349）（Grant 1981, 350, n. 130）[^grant-1981]与威廉·克雷索恩（活跃于 1330 年代）（Robert 2012, 77, n. 2）[^robert-2012]。
