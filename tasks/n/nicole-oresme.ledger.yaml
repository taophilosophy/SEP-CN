      ### 2.5 Cosmology, Astronomy, and Opposition to Astrology
    step1: TBD
    step2: TBD
  - id: 23
    kind: body
    source: |-
      In his *Livre du ciel et du monde* and in other works (*Questiones super De celo*, *Questiones de spera*) Oresme brilliantly argues against any proof of the Aristotelian theory of a stationary Earth and a rotating sphere of the fixed stars. Although Oresme showed the possibility of a daily axial rotation of the Earth, he finished by affirming his belief in a stationary Earth (Clagett 1974, 225; Di Liscia/Szapiro 2020)[^clagett-1974]. Similarly, Oresme proves the possibility of a plurality of worlds, but ultimately keeps to the Aristotelian tenet of a single cosmos (Clagett 1974, 224–225; Harvey 2011)[^clagett-1974][^harvey-2011].
    step1: TBD
    step2: TBD
  - id: 24
    kind: body
    source: |-
      Oresme was a determined opponent of astrology, which he attacked on religious and scientific grounds. In *De proportionibus proportionum* Oresme first examined raising rational numbers to rational powers before extending his work to include irrational powers. The results of both operations he termed *irrational ratios*, although he considered the first type commensurable with rational numbers, and the latter not. His motivation for this study was a suggestion of Thomas Bradwardine that the relationship between forces $(F)$, resistances $(R)$, and velocities $(V)$ is exponential (Grant 1966, 24–40; Clagett 1974, 224)[^clagett-1974][^grant-1966]. In modern terms:

      $$ \frac{F_2}{R_2} = \left( \frac{F_1}{R_1} \right)^{(V_2 /V_1)} $$
    step1: TBD
    step2: TBD
  - id: 25
    kind: body
    source: |-
      Oresme then asserted that the ratio of any two celestial motions is probably incommensurable (Grant 1971, 67–77)[^grant-1971]. This excludes precise predictions of successively repeating conjunctions, oppositions, and other astronomical aspects, and he subsequently claimed, in *Ad pauca respicientes* (its name derives from the opening sentence “Concerning some matters …”), that astrology was thereby refuted (Grant 1966, 83–111)[^grant-1966]. In his *Livre de divinacions* and his *Tractatus contra astronomos* Oresme tries to show that astrology is “most dangerous to those of high estate, such as princes and lords to whom appertains the government of the commonwealth” (Coopland 1952, 51)[^coopland-1952]. As with astrology, he fought against the widespread belief in occult and “marvelous” phenomena by explaining them in terms of natural causes. Oresme’s writings against astrology and magic were due to his concern over the king’s and his court’s addiction to these practices. Interestingly, in the first redaction of his Questions on Meteorology Oresme does not yet turn out to be the resolute opponent of astrology as we know him from his later works, but, quite the contrary, adheres to its principles (Panzica 2021, 2)[^panzica-2021].
    step1: TBD
    step2: TBD
  - id: 26
    kind: body
    source: |-
      In his *De visione stellarum* Oresme departs from the standard view of earlier authors in optics such as Ptolemy (2ⁿᵈ century), Ibn al-Haytham (965–c. 1040), Roger Bacon (c. 1214–c. 1292), and Witelo (c. 1230/35–after 1275), who all held that refraction can only occur at the interface of two media of differing densities and thus would not take place in a single medium of uniformly varying density. He states – more than 300 years before Robert Hooke (1635–1703) and Newton – that atmospheric refraction occurs along a curve and proposes to approximate the curved path of a ray of light in a medium of uniformly varying density, in this case the atmosphere, by an infinite series of line segments each representing a single refraction (Burton 2007, 33–64; Szapiro 2022)[^burton-2007][^szapiro-2022].
    step1: TBD
    step2: TBD
  - id: 27
    kind: body
    source: |-
      In the first redaction of his Commentary on Aristotle’s Meteorology Oresme stated the supralunar location of comets, a unique opinion for a medieval philosopher (Kirschner 2000c; for the identification of the anonymous manuscript as Oresmian see Panziza 2015)[^kirschner-2000c]. Oresme’s view of the celestial nature of the Milky Way was also unconventional, otherwise only held by Albert the Great and Henry of Langenstein.
