      Furthermore, Oresme used his figures to give the first proof of the Merton theorem, discovered at Oxford in the 1330’s: the distance traveled in any given period by a body moving under uniform acceleration is the same as if the body moved at a uniform speed equal to its speed at the midpoint of the period (Clagett 1974, 225–226; Smorynski 2017, 216–222)[^clagett-1974][^smorynski-2017]. Some scholars believe that Oresme’s graphical representation of velocities was of great influence in the further development of kinematics, affecting in particular the work of Galileo (1564–1642).
    step1: |-
      此外，奥雷斯姆利用其图形首次证明了 14 世纪 30 年代发现于牛津的默顿定理：匀加速运动的物体在任一时段内走过的距离，等同于它以该时段中点时的速度做匀速运动所走的距离（Clagett 1974, 225–226; Smorynski 2017, 216–222）[^clagett-1974][^smorynski-2017]。一些学者认为，奥雷斯姆对速度的图示对运动学的进一步发展有很大影响，尤其影响了伽利略（1564–1642）的工作。
    step2: |-
      奥雷斯姆还用他的图形首次证明了默顿定理（14 世纪 30 年代发现于牛津）：匀加速物体在任一时段内所走的距离，等同于它以该时段中点速度做匀速运动所走的距离（Clagett 1974, 225–226; Smorynski 2017, 216–222）[^clagett-1974][^smorynski-2017]。有学者认为，奥雷斯姆对速度的图示大大推动了运动学的发展，伽利略（1564–1642）的工作尤其受其影响。
