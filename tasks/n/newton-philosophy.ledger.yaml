      If we attempt to understand Newton’s work from an historical point of view, however, a more complex conception emerges. When Newton published his principal works, he was not contributing to a well-established field, he was helping to create modern mathematical physics. This meant that few of his ideas, methods, or approaches, whether in mathematics or in experimental physics, could be taken for granted. From his first papers in the early 1670s, on optics, until his last days working on the third and final edition of his magnum opus the *Principia* decades later, philosophers, mathematicians and experimenters challenged Newton’s approach. This frequently upset Newton, who had a famous, lifelong aversion to intellectual debate and controversy. But in a sense, it helped to ensure the importance of Newton’s ideas for philosophy. Obviously, Newton never wrote a philosophical text on the order of Descartes’s *Meditations*, Locke’s *Essay*, or Spinoza’s *Ethics*. He never produced what the *lumières* who studied him would have called a “system” of philosophy. But the intense controversies produced by his mathematical, empirical and philosophical methods and ideas continually prompted him to broach philosophical topics (Janiak 2015)[^janiak-2015]. As a result, he was widely considered a leading philosopher throughout the Enlightenment. In the first modern history of philosophy, Brucker’s *Historia Critica Philosophiae*, Newton plays a central role in discussions of the modern era (Volume 4.2: 639-55). He is also a central figure in D’Alembert’s discussion of the emergence of modern science and philosophy: Newton is listed along with Bacon, Descartes, Locke and Leibniz as a key figure in the *Preliminary Discourse* (80-83).
    step1: |-
      然而，如果我们试图从历史的观点理解牛顿的工作，一个更复杂的概念便会浮现。当牛顿发表其主要著作时，他并不是在为一个已确立的领域作贡献，而是在帮助创建现代数学物理学。这意味着，无论在数学还是在实验物理学中，他的观念、方法或进路很少有能被视作理所当然的。从他十七世纪七十年代初关于光学的第一批论文，直到数十年后他晚年编订其巨著《原理》第三即最终版，哲学家、数学家和实验家一直在挑战牛顿的进路。这常常令牛顿不快，他终身以厌恶智识论辩与争论著称。但在某种意义上，这反而确保了牛顿的观念对哲学的重要性。显然，牛顿从未写过一部可与笛卡尔《沉思集》、洛克《人类理解论》或斯宾诺莎《伦理学》相比的哲学著作。他从未写出研究他的启蒙思想家（*lumières*）会称之为哲学“体系”的东西。但他那些数学的、经验的和哲学的方法与观念所激起的激烈争论，不断促使他触及哲学论题（Janiak 2015）[^janiak-2015]。因此，在整个启蒙运动期间，他被广泛视为一位首要的哲学家。在最早的现代哲学史、布鲁克的《批判哲学史》中，牛顿在关于近代的讨论里占据核心位置（第 4.2 卷：639–55）。他在达朗贝尔关于现代科学与哲学之兴起的讨论中同样是中心人物：在《预备性论述》中，牛顿与培根、笛卡尔、洛克和莱布尼茨并列为关键人物（80–83）。
    step2: |-
      可是，若从历史的观点去理解牛顿的工作，浮现出来的便是一幅更复杂的图景。牛顿发表其主要著作时，他所贡献的并非一个已确立的领域，而正在帮助创建现代数学物理学。这意味着，无论在数学还是在实验物理学中，他的观念、方法与进路都少有可视为当然者。从他十七世纪七十年代初关于光学的头几篇论文，到数十年后他晚年编订巨著《原理》第三即最终版的日子，哲学家、数学家与实验家一直在挑战他的进路。这常令牛顿恼怒——他终身厌恶智识论辩与学术争吵，此事尽人皆知。但从某种意义上说，这恰恰确保了牛顿的观念对哲学的重要性。显然，牛顿从未写过一部堪比笛卡尔《沉思集》、洛克《人类理解论》或斯宾诺莎《伦理学》的哲学著作，也从未造出研究他的启蒙思想家（*lumières*）会称作哲学“体系”的东西。然而，他那些数学的、经验的和哲学的方法与观念所激起的激烈论争，不断把他推向哲学论题（Janiak 2015）[^janiak-2015]。于是，整个启蒙时代都普遍把他视为卓越的哲学家。在最早一部现代哲学史、布鲁克的《批判哲学史》里，牛顿在有关近代的论述中居于核心（第 4.2 卷：639–55）；在达朗贝尔论述现代科学与哲学之兴起的文字里，他同样是中心人物：在《预备性论述》中，牛顿与培根、笛卡尔、洛克、莱布尼茨并列为关键人物（80–83）。
