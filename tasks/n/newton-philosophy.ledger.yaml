      In Cartesian natural philosophy, all natural change is due to the impacts that material bodies make upon one another’s surfaces (this is reflected in Descartes’s first two laws of nature). The concept of a force plays little if any role. Unlike Descartes, Newton placed the concept of a force at the very center of his thinking about motion and its causes within nature. In that regard, his reactions to the shortcomings of Cartesian natural philosophy parallel Leibniz’s, who coined the term “dynamics”, and who obviously regarded force as a fundamental concept in metaphysics as well (Westfall 1971)[^westfall-1971]. But Newton’s attitude toward understanding the forces of nature involved an especially intricate method that generated intense scrutiny and debate amongst many philosophers and mathematicians, including Leibniz (Garber 2012)[^garber-2012]. Newton’s canonical notion of a force, which he calls a *vis impressa* or “impressed force”, is the notion of an “action exerted on a body” that changes its state of motion. This was a confusing notion at the time. Perhaps it is not difficult to see why that should be so. To take one of Newton’s own examples: suppose I hit a tennis ball with my racquet—according to Newton, I have impressed a force on the tennis ball, for I have changed its state of motion (hopefully!). We have a reasonably good idea of what the tennis ball is, of what the racquet is, and even of what I am, and a Cartesian might wish to stop her analysis there. But what exactly is this “force” that I impressed on the tennis ball? The ball, the racquet and I are physical things of one sort or another, but is the force physical? Is it not physical? It does not seem likely that a force is itself a physical thing in the sense of being a substance, to use a philosophical notion popular in Newton’s day (as we saw above in his first optics paper). The reason is that in Definition Four in the *Principia*, which defines an impressed force for the first time, Newton remarks: “This force consists solely in the action and does not remain in a body after the action has ceased”. So when I hit the tennis ball over the net, the force I impressed on it was the action of hitting the ball, or an action associated with hitting the ball, and not a property of me or of the ball after the action had ceased. This idea confused many of Newton’s readers. By the mid-eighteenth century, the time of Hume’s analysis of causation in the *Treatise* and the *Enquiry*, many philosophers started to think that actions and other kinds of event are important items to have in one’s ontology, and they often contended in particular that causal relations hold between *events*. But in Newton’s day, philosophers typically regarded objects or substances as the causal relata. Indeed, one actually finds an equivocation between thinking of events and thinking of objects as the relevant causal relata even in Hume: in his *Enquiry*, he first defines a “cause” so that “objects” are the causal relata, but then gives an example in which one of the relata is the vibration of a string (*Enquiry*, §VII, 51). So actions were difficult to analyze, left out of analyses, or conflated with objects. As a result, Newton’s conception of force proved confusing, even to his most sympathetic interpreters. Moreover, it was unclear to many of Newton’s mechanist readers how his forces fit into their rather austere ontological view that material bodies consist solely of properties such as size, shape, mobility and solidity.
    step1: |-
      在笛卡尔式自然哲学中，一切自然变化都源于物质物体彼此表面之间的碰撞（这反映在笛卡尔的前两条自然法则中）。力的概念几乎不起作用，如果说它还有作用的话。与笛卡尔不同，牛顿把力的概念置于其关于运动及自然中运动之原因的全部思考的中心。在这方面，他对笛卡尔自然哲学缺陷的反应与莱布尼茨相似——后者创造了“动力学”一词，并且显然也把力视为形而上学中的一个基本概念（Westfall 1971）[^westfall-1971]。但牛顿理解自然之力的态度涉及一种格外精微的方法，这种方法在包括莱布尼茨在内的许多哲学家与数学家中间引发了强烈的审视与论辩（Garber 2012）[^garber-2012]。牛顿关于力的标准概念，即他称为 *vis impressa* 或“外加力”的东西，是“施加于物体之上”、改变其运动状态的一种“作用”的概念。这在当时是一个令人困惑的概念。或许不难看出为何如此。举牛顿自己的一个例子：假设我用球拍击打网球——按牛顿的说法，我在网球上施加了一个力，因为我改变了它的运动状态（但愿如此！）。我们对网球是什么、球拍是什么、甚至我是什么，都有相当不错的概念，而笛卡尔派或许愿意在此打住她的分析。但我施加在网球上的这个“力”究竟是什么？球、球拍和我都是某种物理的东西，但力是物理的吗？它不物理吗？力本身似乎不大可能是牛顿时代流行的那种哲学意义上的实体（正如我们在上文他第一篇光学论文中所见）。理由是，在《原理》中首次定义外加力的定义四里，牛顿说：“这个力仅存在于作用之中，作用停止后并不留在物体之内”。所以，当我把网球击过网时，我施加于它的力就是击球这一作用，或与击球相关的一种作用，而不是作用停止之后我或球的某种属性。这一观念令牛顿的许多读者困惑。到十八世纪中叶，即休谟在《人性论》与《人类理解研究》中分析因果性的时代，许多哲学家开始认为作用与其他种类的事件是本体论中的重要项目，他们尤其常主张因果关系成立于*事件*之间。但在牛顿的时代，哲学家通常把对象或实体视为因果相关项。事实上，甚至在休谟那里也能发现把事件与对象当作相关因果相关项的摇摆：在《人类理解研究》中，他先给出一个定义，使“对象”成为因果相关项，随后却举了一个例子，其中一项相关项是弦的振动（《人类理解研究》，§VII，51）。于是，作用难以分析、被排除在分析之外、或被与对象混为一谈。结果，牛顿的力的概念被证明令人困惑，甚至对他最富同情的解释者也是如此。此外，对牛顿的许多机械论读者来说，他的力如何嵌入他们那套颇为朴素的本体论——物质物体仅由大小、形状、可动性与坚实性这类属性构成——也并不清楚。
    step2: |-
      在笛卡尔式自然哲学里，一切自然变化都出于物质物体彼此表面的碰撞（笛卡尔前两条自然法则即其写照），力的概念几乎不起作用，甚至全无作用。牛顿则与笛卡尔相反，把力的概念摆在关于运动及运动中原因的全部思考的正中央。在这一点上，他对笛卡尔自然哲学短处的反应与莱布尼茨如出一辙——后者造出“动力学”一词，显然也把力当成形而上学的基本概念（Westfall 1971）[^westfall-1971]。然而牛顿理解自然之力的路数格外精微，以致包括莱布尼茨在内的许多哲学家与数学家对它严加审视、往复论辩（Garber 2012）[^garber-2012]。牛顿关于力的标准概念，即他所谓 *vis impressa*（外加力），指的是“施加于物体之上”、改变其运动状态的一种“作用”。这在当时是个令人困惑的概念。何以如此，或许并不难想见。举牛顿自己的例子：假设我用球拍拍打网球——照牛顿的说法，我便在网球上外加了一个力，因为我改变了它的运动状态（但愿如此！）。网球是什么、球拍是什么、我是什么，我们大致都还清楚，笛卡尔派或许就此打住、不再追问。可我外加于网球的这个“力”究竟是什么？球、拍、我，都是这样那样的物理之物；力是物理的吗？抑或不是？力本身恐怕不大可能是牛顿时代流行的那种哲学意义上的实体（上文他第一篇光学论文已见此意）。因为《原理》定义四头一回界定外加力时，牛顿便说：“此力仅存在于作用之中，作用一旦停止，便不留在物体之内。”如此，我把网球拍过网时外加于它的力，就是击球这一作用、或与击球相连的一种作用，而非作用停止之后仍属于我或属于球的某种属性。此说令牛顿的许多读者大惑不解。到十八世纪中叶，即休谟在《人性论》与《人类理解研究》里剖析因果性的年月，不少哲学家渐以为作用及其他类型的事件是本体论里的要紧项目，尤其常主张因果关系成立于*事件*之间。可牛顿在世时，哲学家多半把对象或实体当作因果相关项。事实上，即便是休谟，也时而在事件、时而在对象之间摇摆：他在《人类理解研究》里先立一定义，让“对象”充当因果相关项，随后所举之例却把弦的振动当作其中一项（《人类理解研究》§VII，51）。于是，作用或难以分析，或被排除在分析之外，或与对象混作一谈。结果，牛顿的力的概念竟令最同情他的解释者也困惑不已。再者，对牛顿的许多机械论读者而言，他的力究竟如何安放进他们那套颇为素朴的本体论——物质物体只由大小、形状、可动性、坚实性这类属性构成——也始终不明。
