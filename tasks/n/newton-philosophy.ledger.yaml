      在其他方面，法国的思想状况与英格兰相当不同。牛顿 1670 年代以光学论文、1680 年代后期以《原理》登场之后，笛卡尔式观念仍统治了数十年；它们在皇家科学院尤其流行，与皇家学会的情形不同（Henry 2013: 120）[^henry-2013]。伏尔泰因挑战法国的笛卡尔正统而闻名，他赴英格兰作了一次著名的访问，带回了关于哲学、政治及其他许多领域的“开明”观念，力图推动法国牛顿纲领的产生与发展。他在这方面最重要的出版物大概是《牛顿哲学原理》（Voltaire 1738/1992）[^voltaire-1738]，该书试图指出笛卡尔的“错误”，并突出牛顿纲领在“物理学”（*Physique*）中的优势。当然，笛卡尔式观念与方法在法国仍有众多拥护者与辩护者，因此笛卡尔式与牛顿式观念之间的论战在这种环境中兴盛起来（参 Aiton 1972: ch. 8）[^aiton-1972]。但即便在法国，笛卡尔主义最终也让位于与莱布尼茨及其德国追随者、阐释者沃尔夫相关联的较新版本形而上学。1740 年，埃米莉·杜·夏特莱出版了重要文本《物理学基础》（*Institutions de physique*）（尤见 Brading 2019 的分析）[^brading-2019]。在这部书中——它于 1742 年再版，并迅速被译为德文与意大利文——她所作的正是几年后迫使休谟阐明一种与实验哲学相一致的 *vis inertiae* 构想的那类论证。她论证，笛卡尔关于广延是物体本质的观点是错误的；若要正确理解物质对象的物理相互作用，我们就必须把它们设想为表现出“*force d'inertie*”（惰性力）（Du Châtelet 1742: ch. 1, §2）。或许并不意外，达朗贝尔在其《动力学论》中赞许地引用了她的文本。在杜·夏特莱看来，这种牛顿式的物体构想本身并不成问题。然而，当一些牛顿派把万有引力理论解释为证明物体具有上帝赋予的吸引性质或吸引力时，问题就出现了（Du Châtelet 1742: ch. 16, §385）。她接受引力与物体质量成正比、与它们空间距离的平方成反比这一想法，论证这一牛顿式的吸引观念“奇妙地”解释了地球上的物体下落、潮汐以及各种天文现象，而笛卡尔派的涡旋说未能做到这一点。但她否认接受这一点就意味着她也必须接受物体具有称为引力或吸引力的“本质属性”这一结论，主张该结论超出了哲学家所能拥有的知识（Du Châtelet 1742: ch. 16, §388）。理由是：尚无人证明不存在引力的介质，如涡旋或以太；既然引力可能依赖某种介质，它便可能并非物质本身所本质具有的。正是以这种方式，夏特莱的著作以下述熟悉观念为前提：尽管笛卡尔主义已被牛顿式观念与方法推翻，哲学家仍须对牛顿引力理论及其蕴涵作出恰当解释。然而，与伏尔泰不同——伏尔泰不仅拒斥笛卡尔主义，还因《老实人》中对莱布尼茨哲学的嘲弄而闻名——夏特莱论证，哲学家应当继续致力于发展恰当的方法论，其途径之一便是认真对待莱布尼茨与沃尔夫的观念与方法。特别是，夏特莱论证，充足理由律应成为形而上学理论化的指导力量；正如莱布尼茨所论证的，它揭示了牛顿绝对空间概念的根本错误。她还补充说，克拉克回应莱布尼茨论证的方法——即人们可以发展一种非莱布尼茨式的或意志主义的充足理由律构想，以回避绝对空间的难题——并不令人信服（Du Châtelet 1742: ch. 5, §74）。她还论证，若我们用充足理由律来指导关于科学的思考，我们就会对洛克关于如何理解牛顿万有引力理论之哲学蕴涵这一问题的解决方案持怀疑态度。牛顿的理论支持“上帝必定把引力‘附加’给了物质”这一结论的想法，回避了断言引力对物质是“本质的”所可能带来的问题——她对后者同样持怀疑态度——但它只是遇到了别的问题。第一，既然尚无人了解引力相互作用背后是否存在任何介质，如以太，那么断定引力是物质的一种性质——即便是上帝命令“附加”于其上的性质——就为时过早。毕竟，若存在以太，那么物质可能因与以太的相互作用而有引力，而不是因为任何附加的性质。第二，充足理由律要求我们在科学中为自然现象寻求理性的解释，但附加说恰恰以下述想法为前提：我们根本无法理解物质如何吸引其他物质。牛顿的科学只是被当作表明它确实如此。她不愿把科学革命最重要的结论留作纯粹的谜。
