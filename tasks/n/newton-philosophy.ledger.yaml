      Once the *Principia* was published, Newton had a vexed relationship with the mechanical philosophy, an orientation within natural philosophy that is associated with nearly every significant early modern philosopher, including Descartes, Boyle, Huygens, Leibniz, and Locke.[^note-22] One of the reasons for this complex relationship can be understood if we consider Newton’s attitude toward forces in an abstract way. His second law indicates that a body moving rectilinearly will continue to do so unless a force is impressed on it. This is not equivalent to claiming that a body moving rectilinearly will continue to do so unless another body impacts upon it. A *vis impressa*—an impressed force—in Newton’s system is not the same as a body, nor even a quality of a body, as we have seen; but what is more, some impressed forces need not involve contact between bodies at all. For instance, gravity is a kind of centripetal force, and the latter, in turn, is a species of impressed force. Hence a body moving in a straight line will continue to do so until it experiences a gravitational pull, in which case it will deviate from a straight line motion, even if no body impacts upon it. Indeed, the gravitational pull might originate with a mass that is millions of miles away. As we have seen, an impressed force is an action exerted on a body. Hence the gravity exerted on a moving body is an action (the Latin term is *actio*), which is obviously a causal notion. This is not an empirical claim *per se*; it is merely a reflection of Newton’s laws, together with his notion of an impressed force, and his further idea that gravity is one kind of impressed force. These elements of the *Principia* make conceptual room for a causal interaction between two bodies separated by a vast distance, one enabled by Newton’s concept of an impressed force. Aspects of this idea became known in philosophical circles as the problem of action at a distance (Hesse 1961)[^hesse-1961]. Many of Newton’s most influential contemporaries objected vigorously to the fact that his philosophy had made room for—if not explicitly defended—the possibility of distant action between material bodies. Leibniz and Huygens in particular rejected this aspect of Newton’s work in the strongest terms, and it remained a point of contention between Newton and Leibniz for the rest of their lives. Both Leibniz and Huygens were convinced that all natural change occurs through contact action, and that any deviation from this basic mechanist principle within natural philosophy would lead to serious difficulties, including the revival of outmoded Aristotelian ideas. By the seventh proposition of Book III of the *Principia*, as we have seen, Newton reached the following conclusion (1999: 810): “Gravity acts on all bodies universally and is proportional to the quantity of matter in each”. Leibniz eventually accused Newton of regarding gravity as a kind of “occult quality”, that is, as a quality of bodies that is somehow hidden within them and beyond the philosopher’s understanding. They understood Newton to be saying that gravity is a kind of hidden power to attract embedded in material bodies.
    step1: |-
      《原理》出版之后，牛顿与机械论哲学——一种与几乎每一位重要的早期近代哲学家都相关联的自然哲学取向，包括笛卡尔、波义耳、惠更斯、莱布尼茨与洛克——的关系变得棘手。[^note-22] 这种复杂关系的原因之一，如果我们以抽象的方式考虑牛顿对力的态度，便可以理解。他的第二定律表明，沿直线运动的物体将继续如此运动，除非有力施加于它。这不等价于主张：沿直线运动的物体将继续如此运动，除非另一物体撞击它。牛顿体系中的 *vis impressa*（外加力）既不是物体，甚至也不是物体的属性，如我们所见；而更重要的是，有些外加力根本无需涉及物体之间的接触。例如，引力是一种向心力，而后者又是外加力的一种。因此，沿直线运动的物体会继续如此运动，直到它经历一次引力牵引，届时它会偏离直线运动，即使没有任何物体撞击它。的确，这种引力牵引可能源自数百万英里之外的一个质量。如我们所见，外加力是施加于物体之上的一种作用。因此，施加于运动物体之上的引力就是一种作用（拉丁语作 *actio*），这显然是一个因果性概念。这本身并非经验主张；它只是牛顿诸法则、他关于外加力的概念、以及“引力是外加力之一种”这一进一步想法的反映。《原理》的这些要素，为相隔遥远距离的两个物体之间的因果互动留出了概念空间，而这一空间正是由牛顿的外加力概念所开启。这一观念的若干方面在哲学圈中作为超距作用问题而为人所知（Hesse 1961）[^hesse-1961]。牛顿许多最有影响的同侪激烈地反对他的哲学为——即便不是明确为之辩护——物体之间远距作用的可能性留出余地这件事。莱布尼茨与惠更斯尤其以最强烈的措辞拒斥牛顿工作的这一方面，而它作为牛顿与莱布尼茨之间的争论点，一直持续到两人生命的尽头。莱布尼茨与惠更斯都确信：一切自然变化都经由接触作用发生；自然哲学中任何对这一基本机械论原理的偏离都会导致严重困难，包括过时的亚里士多德观念的复活。如我们所见，到《原理》第三卷第七命题，牛顿得出如下结论（1999: 810）：“引力普遍地作用于一切物体，并与每个物体中物质的量成比例。”莱布尼茨最终指控牛顿把引力当作一种“隐秘的质”，即那种以某种方式隐藏在物体之内、超出哲学家理解力的性质。他们把牛顿理解为在说：引力是嵌入物体之中的一种隐蔽的吸引能力。
    step2: |-
      《原理》一经出版，牛顿与机械论哲学的关系就变得微妙而棘手——那种取向几乎同每一位重要的早期近代哲学家都有牵连：笛卡尔、波义耳、惠更斯、莱布尼茨、洛克，无一例外。[^note-22] 只须以抽象的方式看一眼牛顿对力的态度，这种复杂关系的缘由之一便清楚了。他的第二定律说：沿直线运动的物体将继续如此，除非有力施加于它。这可不等价于说：沿直线运动的物体将继续如此，除非另一物体撞上它。牛顿体系里的 *vis impressa*（外加力）如前所见，既不是物体，甚至也不是物体的属性；更要紧的是，有些外加力根本无须物体之间的接触。例如引力是一种向心力，向心力又是外加力之一种。于是，沿直线运动的物体将一直走下去，直到它经受一次引力牵引，届时便偏离直线运动——哪怕没有任何物体撞击它。而这引力牵引，可能来自数百万英里之外的一个质量。如前所见，外加力是施加于物体之上的一种作用；故施加于运动物体之上的引力便是一种作用（拉丁文 *actio*），这分明是个因果性概念。这本身并不是一条经验主张；它只是牛顿诸定律、他关于外加力的概念，以及“引力即外加力之一种”这一层想法的自然结果。《原理》的这些要素，为相隔遥远之两物体间的因果互动备下了概念余地，而这余地正是牛顿的外加力概念开启的。这一观念的若干面相，在哲学圈中成了所谓超距作用问题（Hesse 1961）[^hesse-1961]。牛顿最有影响的那些同侪，对他为——即便算不上公然辩护——物体之间远距作用的可能性留出余地一事反应激烈。莱布尼茨与惠更斯尤其以最决绝的口吻拒斥牛顿工作的这一方面；它作为两人之间的争执点，一直纠缠到生命尽头。两人都深信：一切自然变化皆经由接触作用发生；自然哲学一旦背离这条基本机械论原理，便会招致严重困难，包括陈旧亚里士多德观念的死灰复燃。如前所见，《原理》第三卷第七命题处，牛顿得到如下结论（1999: 810）：“引力普遍地作用于一切物体，并与每个物体中物质的量成比例。”莱布尼茨最终指控牛顿把引力当作一种“隐秘的质”——即某种藏匿于物体之中、超出哲学家理解力的性质。在他们的理解里，牛顿是在说：引力是一种嵌在物体之中的隐蔽吸引能力。
