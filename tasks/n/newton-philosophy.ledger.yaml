      Leibniz’s most extensive debate with the Newtonians would not occur until the very end of his life. His celebrated correspondence with Samuel Clarke, Newton’s friend and supporter in London in the early part of the eighteenth century, is his most famous interaction with the Newtonians, occurring right before his death in 1716 (Clarke and Leibniz 1717)[^clarke-1717]. Leibniz fomented the correspondence in November of 1715 by sending a brief, provocative letter to Princess Caroline of Wales, one designed to provoke a response from Newton’s circle in London. Leibniz knew well that Princess Caroline was a leading intellectual and political figure in England at the time, one who would surely be concerned by Leibniz’s shocking claims about the religious consequences of Newtonian thinking. He opens his initial letter by mentioning both Locke and Newton, along with the issues about materiality and thinking that arose in his near exchange with Newton in 1712:
    step1: TBD
