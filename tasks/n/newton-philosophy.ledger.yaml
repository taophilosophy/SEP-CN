      Thus Leibniz charges both Lockeans and Newtonians with presenting philosophical views of the human and of the divine that lead to theologically unsavory consequences, such as the idea that the human soul might be material and the view that God must employ something akin to an organ in order to perceive happenings in the world. These were fighting words. Although Locke had died in 1704, he had various followers in England at the time (Gascoigne 1985: 172–3)[^gascoigne-1985], and Newton himself was at the height of his influence: he had by then been knighted, as Leibniz acknowledges by calling him “Sir” in his letter, and was at that time President of the Royal Society. Moreover, Samuel Clarke had given the Boyle lectures in 1704 and again in 1705, so he was a public figure associated with the state of Christianity in England. Once Clarke took the bait, replying that same month to Leibniz’s charges, Locke’s views quickly dropped from view and the two focused specifically on Leibniz’s numerous objections to Newtonian ideas and methods. But why did Clarke respond on Newton’s behalf, and what was Newton’s actual role in the correspondence? These questions continue to puzzle scholars (see Cohen and Koyré 1962; Bertoloni Meli 1999 and 2002; Vailati 1997)[^bertoloni-1999][^bertoloni-2002][^cohen-1962][^vailati-1997]. There is no documentary evidence, such as letters, between Clarke and Newton indicating the contours of his role; then again, at this time, both men lived in London and Clarke was Newton’s parish priest, so the lack of letters or other papers is perhaps unsurprising. That fact alone is intriguing, for the theological differences between the two are salient: since Newton was a committed anti-Trinitarian—a fact known to figures like Locke and to others such as William Whiston—he may have decided that Leibniz’s contentions about “natural religion” in England would best be answered by what we might now call a more mainstream theological figure like Clarke. In any event, there is no doubt that Clarke was taken by Leibniz and his followers to be speaking for Newton and his circle. Nonetheless, there are certainly aspects of Clarke’s views that may deviate from Newton’s own opinions, so it would be unwise to (as it were) remove Clarke from our conception of the correspondence by regarding it effectively as Newton’s work.
    step1: |-
      于是莱布尼茨指控洛克派与牛顿派，说他们关于人与神的哲学观点引出了神学上令人不快的后果，例如人的灵魂可能是物质的这一想法，以及上帝必须使用类似器官之物才能感知世间发生之事这一观点。这些话可谓挑衅。虽然洛克已于 1704 年去世，但他当时在英格兰仍有众多追随者（Gascoigne 1985: 172–3）[^gascoigne-1985]；牛顿本人则正值影响力巅峰：他当时已受封爵士（莱布尼茨在信中以“爵士”称之），并且时任皇家学会会长。此外，塞缪尔·克拉克曾于 1704 年与 1705 年两度主讲波义耳讲座，因此他是一位与英格兰基督教状况相关联的公众人物。克拉克一上钩，同月即回信答复莱布尼茨的指控，洛克的观点便迅速退出视线，二人专门聚焦于莱布尼茨对牛顿式观念与方法的众多反对。但克拉克为何代牛顿作答，牛顿在这场通信中究竟扮演什么角色？这些问题至今困扰学者（见 Cohen and Koyré 1962; Bertoloni Meli 1999 and 2002; Vailati 1997）[^bertoloni-1999][^bertoloni-2002][^cohen-1962][^vailati-1997]。克拉克与牛顿之间没有书信之类的文献证据能显示其角色的轮廓；不过当时的另一情况是，两人都住在伦敦，而克拉克是牛顿的堂区牧师，因此缺少书信或其他文稿或许并不奇怪。仅此一点就已耐人寻味，因为二人之间的神学差异十分显著：牛顿是坚定的反三一论者——这一事实洛克等人以及威廉·惠斯顿等人都知道——所以他或许认定，对莱布尼茨关于英格兰“自然宗教”的论点，最好由我们今日会称为较主流的神学人物克拉克来作答。无论如何，莱布尼茨及其追随者无疑认为克拉克是代表牛顿及其圈子发言。尽管如此，克拉克的观点确有一些方面可能偏离牛顿本人的意见，因此若把这场通信实际上当作牛顿的作品，从而（可以说）把克拉克从我们对这场通信的理解中抹去，那就不明智了。
