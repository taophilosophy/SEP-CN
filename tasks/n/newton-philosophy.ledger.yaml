      本特利尤其寻求牛顿的帮助，是因为他想得到指引，以参透《原理》的理论如何表明太阳系必定由一位理智的施动者设计，而不可能通过物质物体的物理相互作用而产生。在 1687 年《原理》第一版中，牛顿已在一则非常简短的陈述中提出过这样的主张（Newton 1972: vol. 2: 582–3; Cohen 1971: 154–6）[^cohen-1971][^newton-1972]。在该书第二版（1713 年出版）中，他删去了那则陈述，代之以书末新增的、名为“总释”的新章节（前文已提及）中一段更为详尽的讨论。通过通信，本特利了解到，在牛顿看来，诸行星彼此的相对位置——尤其是它们相对于太阳的位置——表明，单纯的偶然，或行星体的寻常物理相互作用，不可能把每颗行星都放在恰好的轨道上，使像我们这样的太阳系长期维持。借这个论证，牛顿似乎在提示：单纯的偶然会造出一个不稳定的行星系统，其中行星最终要么受太阳吸引过强而落入太阳，要么吸引过弱而飞入太空。在这一事例中，一位神学家在试图削弱无神论时，诉诸牛顿自然哲学的新权威。而这显然正是波义耳捐设讲座系列时所设想的交流方式。
