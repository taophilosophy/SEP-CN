      Newton also took issue with Cartesian ideas about motion. His rejection of Cartesian views of space, and his embrace of space as a fundamental concept in philosophy following More’s influence, aligns with his famous discussion of space and time in the Scholium that follows the opening definitions in the *Principia*. This text influenced nearly every subsequent philosophical discussion of space and time for the next three centuries, so its contours are well known (see DiSalle 2006: ch. 2)[^disalle-2006]. In his *Principles of Philosophy* of 1644, Descartes had distinguished between the “ordinary” and the “proper” view of motion: whereas the ordinary view presents motion as a body’s change of place, the philosopher knows that properly speaking, motion is a body’s change of relations to the bodies that surround it (recall Descartes’s plenum). Newton contends in *De Gravitatione* that this idea of proper motion, according to which the motion of a body is at least partially a function of its relations to other bodies, is in tension with Descartes’s own laws of nature, also presented in the *Principles*. For according to the conception of (what we now call) inertia that Descartes presents as his first two laws, a body moving rectilinearly will continue to do so unless caused to deviate from its path—hence a body’s motion is not a function of its spatial relations to other bodies, but rather of its *causal* relations. That is, according to the first two laws, changing a body’s spatial relations to others bodies will not alter its rectilinear motion unless a causal interaction occurs. This tension runs deep in the Cartesian system. Newton’s Scholium reflects his idea that the concept of motion in the *Principia* ought to cohere with the laws of motion he endorses. He distinguishes between absolute and relative motion, true and apparent motion, and mathematical and common motion (the same distinctions hold for time, space and place). The former item in each of these three pairings is a concept that coheres with the laws of motion. Newton’s first law reflects Descartes’s laws: it is a new version of the principle of inertia, one incorporating the concept of an impressed force. Since this law indicates that a body’s motion is not a function of its spatial relations to other bodies, but rather of whether forces are impressed on it—which replaces the Cartesian concept of causal interactions that involve only impact (see below)—Newton cannot rely on a body’s motion relative to other bodies if he is to avoid the kind of tension he found in the Cartesian view. Hence he indicates that a body’s true motion—rather than its apparent motion, which depends on our perceptions, or its relative motion, which depends on its spatial relations—is a body’s change of position within space itself. That is, true motion should be understood as absolute motion. This means, in turn, that we must distinguish between the common idea of space, according to which space is conceived of as involving relations among various objects (like the space of our air), and the mathematical idea, one presumably obtained from geometrical reasoning, that space is independent of any objects or their relations. In order to account for the idea that true motion is absolute motion, then, the famous “absolute space” is postulated.
    step1: |-
      牛顿也对笛卡尔关于运动的观念提出了异议。他拒斥笛卡尔的时空观、并在莫尔影响下把空间奉为哲学的基本概念，这与他关于《原理》开篇定义之后附释中空间与时间的那段著名讨论相合。这一文本影响了此后三个世纪几乎每一场关于空间与时间的哲学讨论，其轮廓因此广为人知（见 DiSalle 2006: 第 2 章）[^disalle-2006]。在 1644 年的《哲学原理》中，笛卡尔曾区分运动的“通常”观点与“恰当”观点：通常观点把运动呈现为物体位置的改变，而哲学家知道，恰当地说，运动是物体与其周围物体之关系的变化（回想笛卡尔的充满说）。牛顿在 *De Gravitatione* 中主张，这种关于恰当运动的观念——按此观念，物体的运动至少部分地是其与其他物体之关系的函数——与笛卡尔自己在《原理》中提出的自然法则相冲突。因为按照笛卡尔作为其前两条法则提出的（我们今天所谓）惯性概念，沿直线运动的物体将继续如此运动，除非有原因使之偏离轨道——因此物体的运动不是其与其他物体之空间关系的函数，而是其*因果*关系的函数。也就是说，按照前两条法则，改变物体与其他物体的空间关系，不会改变它的直线运动，除非发生因果互动。这一张力在笛卡尔体系中根深蒂固。牛顿的附释反映了他的想法：《原理》中的运动概念应当与他所认可的运动法則相一致。他区分绝对运动与相对运动、真实运动与表观运动、数学运动与通常运动（同样的区分也适用于时间、空间与位置）。这三对中的前一项，都是与运动法则相一致的概念。牛顿第一定律反映了笛卡尔的法则：它是惯性原理的新版本，其中纳入了外加力的概念。既然该定律表明物体的运动不是其与其他物体之空间关系的函数，而是取决于是否有外力施加于它——这取代了笛卡尔那种只涉及碰撞的因果互动概念（见下文）——那么牛顿若要避免他在笛卡尔观点中发现的那种张力，就不能依赖物体相对于其他物体的运动。因此他指出：物体的真实运动——而非依赖我们知觉的表观运动，或依赖其空间关系的相对运动——是物体在空间本身之中的位置变化。也就是说，真实运动应被理解为绝对运动。这又意味着，我们必须区分通常的空间观念——按此观念，空间被构想为涉及各种对象之间的关系（如我们周围空气的空间）——与数学的空间观念，后者大概得自几何推理，即空间独立于任何对象及其关系。于是，为了说明“真实运动即绝对运动”这一观念，著名的“绝对空间”便被设定下来。
