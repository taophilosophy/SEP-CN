      When the great English natural philosopher Robert Boyle died at the end of 1691, he endowed a lecture series designed to promote Christianity against what Boyle took to be the atheism that had infected English culture after the revolutionary period of the mid-century. Famous Newtonians such as Samuel Clarke and William Whiston would eventually give the Boyle lectures. The first “Boyle lecturer” was the theologian Richard Bentley, who would eventually become the Master of Newton’s *alma mater*, Trinity College, Cambridge, and who also worked under Locke’s correspondent, Bishop Stillingfleet, himself an admirer of Newton’s (Gascoigne 1985: 65)[^gascoigne-1985]. When preparing his lectures for publication—they had been presented to a public audience in London in 1692—Bentley conferred with Newton, hoping to solicit his help in deciphering enough of the *Principia* to use its results as a bulwark against atheism (Bentley 1976)[^bentley-1976]. Newton obliged, and a famous correspondence between the two began (eventually published as Bentley 1756)[^bentley-1756]. The exchange is of great philosophical interest, for Bentley elicited a number of important clarifications that have no peer within Newton’s published *oeuvre*.
    step1: |-
      1691 年末，伟大的英国自然哲学家罗伯特·波义耳去世时，捐设了一系列讲座，旨在弘扬基督教，对抗波义耳所认为的、在本世纪中叶革命时期之后侵染英国文化的无神论。塞缪尔·克拉克、威廉·惠斯顿等著名的牛顿派人物后来都曾主讲波义耳讲座。第一位“波义耳讲座主讲人”是神学家理查德·本特利；他后来成为牛顿的母校剑桥大学三一学院的院长，也曾受教于洛克的书信友斯蒂林弗利特主教——此人本人也是牛顿的仰慕者（Gascoigne 1985: 65）[^gascoigne-1985]。本特利在准备将讲稿付印时——这些讲稿曾于 1692 年在伦敦向公众听众宣讲——与牛顿商量，希望求他帮助解读《原理》的足够内容，以便用其结果作为抵御无神论的堡垒（Bentley 1976）[^bentley-1976]。牛顿答应了，两人之间开始了著名的通信（后来以 Bentley 1756 出版）[^bentley-1756]。这场往还对哲学极具意义，因为本特利引出了一些重要的澄清，而这些澄清在牛顿已出版的著作中无可匹敌。
