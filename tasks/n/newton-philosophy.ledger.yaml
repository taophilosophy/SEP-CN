      Newton was perfectly well aware that the notion of absolute space is not unproblematic.[^note-15] For instance, if a body’s true motion just *is* its absolute motion, its motion with respect to space itself, then the imperceptibility of space would appear to render any detection of true motion difficult, if not hopeless. Indeed, how would we detect any body’s true motion on this view? We might be able to detect a body’s changing spatial relations with its neighbors, but not its changing relationship with space itself! Newton’s solution to this problem is ingenious. Under certain circumstances, we can detect a body’s true motion by detecting its acceleration. We can do so when the body is rotating or has a circular motion, for such motions often have detectable effects. This is one way of understanding what has become one of the most famous, if not infamous, experiments**of the early modern period, Newton’s bucket. (He grew up in part on a farm in the English countryside, and often used deceptively simple examples.) If one takes an ordinary bucket and fills it with water, and then attaches a rope to the top of the bucket, one can then twist the rope and let it go in order to make the bucket spin. When the bucket full of water spins around, we can detect the water’s acceleration by its changing surface. As Newton puts it, using his laws of motion, the water endeavors to recede from the axis of its motion (hence its changing surface). But even an observer untutored in physics would grasp the importance of the water’s changing surface--that is, perceiving the effect does not depend on understanding the laws. In this way, despite the fact that Newton wishes to conceive of the water’s true motion as its absolute motion within space itself, which cannot be perceived, he shows his readers how they might detect the water’s true motion through its effects. Newton provides another simple experiment to illustrate a similar point. If two balls are joined together by a rope and then spun around, say over one’s head, then the changing tension in the rope will indicate that the balls are accelerated. Since any acceleration is a true motion—although not all true motions are accelerations, since a so-called inertial motion is not—this case indicates that we can detect a body’s true motion even though space itself is imperceptible. In this way, Newton did not merely develop an alternative to the Cartesian view of motion, along with its allied conception of space; he presented a view that could be employed to pick out some of the true motions of objects within nature. Once one has found a true motion, one can then ask what *caused* that motion (for Newton, as we will see, it is forces that are understood to cause motions). As the last line of the Scholium in the *Principia* indicates, that is one reason that Newton wrote his *magnum opus* in the first place.
    step1: |-
      牛顿完全清楚，绝对空间这一概念并非没有问题。[^note-15] 例如，如果物体的真实运动就*是*它的绝对运动，即它相对于空间本身的运动，那么空间之不可感知，似乎就会使对真实运动的任何探测变得困难，甚至毫无希望。确实，按这种观点，我们如何探测任何物体的真实运动呢？我们或许能够探测物体与其邻物之空间关系的变化，却探测不到它与空间本身之关系的变化！牛顿对这个问题的解决办法很巧妙。在某些情形下，我们可以通过探测物体的加速度来探测其真实运动。当物体旋转或作圆周运动时我们能够这样做，因为这类运动往往有可探测的效应。这是理解近代早期最著名、乃至最臭名昭著的实验之一——牛顿的水桶——的一种方式。（他部分地是在英国乡下的农场上长大的，常常使用看似简单实则巧妙的例子。）如果拿一只普通水桶装满水，再把一根绳子系在桶顶上，然后拧紧绳子并松开，就能让水桶旋转起来。当装满水的水桶旋转时，我们可以通过水面形状的变化探测到水的加速度。正如牛顿运用其运动法则所说，水力图离开其运动的轴线（故水面改变）。但即便是一个未受过物理学训练的人，也会领会水面变化的重要性——也就是说，感知到这一效应并不依赖对法则的理解。这样，尽管牛顿想把水的真实运动设想为它在空间本身之内的绝对运动，而这种运动无法被感知，他却向读者表明了他们如何能够通过效应来探测水的真实运动。牛顿还提供另一个简单实验来说明类似的要点。如果把两个球用绳子连起来，然后旋转（比如说在头顶上方），那么绳中张力变化便表明两球被加速。既然任何加速度都是真实运动——尽管并非一切真实运动都是加速度，因为所谓惯性运动不是——这个例子表明，即使空间本身不可感知，我们也能探测物体的真实运动。这样，牛顿就不只是提出了笛卡尔运动观及其相伴随的空间构想的替代方案；他提出的观点可以被用来辨认自然界中物体的某些真实运动。一旦发现了某种真实运动，人们就可以追问是什么*引起*了那种运动（对牛顿来说，如我们将见到的，被理解为引起运动的是力）。正如《原理》附释的最后一行所表明的，这正是牛顿当初写作其巨著的理由之一。
    step2: |-
      牛顿深知，绝对空间这个概念并非没有问题。[^note-15] 比如，物体的真实运动若*就是*它的绝对运动，即相对于空间本身的运动，那么空间既然不可感知，对真实运动的任何探测似乎就无从谈起，甚至全无指望。按这种观点，我们究竟怎样才能探测某个物体的真实运动？物体与邻物的空间关系有变化，我们或可探知；可它与空间本身的关系有变化，却探知不到！牛顿对此的解决办法十分巧妙。在某些情形下，可以借探测加速度来探测真实运动：物体旋转或作圆周运动时便可如此，因为这类运动常留下可探测的效应。近代早期最著名、甚至最臭名昭著的实验之一——牛顿的水桶——便可以这样来理解。（他在英国乡间农场上长大，惯用看似简单实则刁钻的例子。）拿一只寻常水桶盛满水，在桶顶系绳，拧紧后松手，桶便旋转起来。桶中之水旋转之际，水面形状随之改变，我们借此探测水的加速度。用牛顿自己的话（借其运动法则）：水力图离开其运动的轴线（故水面改变）。可即便没学过物理学的人，也看得出水面变化关乎紧要——也就是说，感知这一效应无需懂那些法则。就这样，牛顿一面想把水的真实运动设想为它在空间本身之中的绝对运动（此运动不可感知），一面又向读者展示如何经由效应探测到它。牛顿还举了另一个简单实验来说明同样的道理。把两球以绳相连，在头顶上方旋转，绳中张力的变化便表明两球受了加速。加速度皆是真实运动——虽说并非一切真实运动都是加速度，所谓惯性运动便不是——故此例表明：即便空间本身不可感知，我们也能探测物体的真实运动。由此看来，牛顿不只给出了笛卡尔运动观及其配套空间构想的替代品；他提出的观点还能用来辨明自然界中物体的某些真实运动。既已找到某项真实运动，便可追问是什么*引起*了它（对牛顿而言，如后文所见，被理解为致动者的是力）。《原理》附释的末行表明，这正是牛顿当初动笔写那部巨著的理由之一。
