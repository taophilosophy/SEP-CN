      Although the first editions of Newton’s *Principia* and of Locke’s *Essay* were published a mere three years apart (in 1687 and 1690, respectively) their authors worked independently and did not influence the first editions of one another’s principal texts. But then in 1688, Locke wrote a sympathetic (anonymous) review of the *Principia*. And right around the time of the publication of the first edition of the *Essay*, Newton and Locke became close friends and apparently influenced each other’s thinking about philosophy, religion, and theology in various ways (they first met in London in 1689). For his part, Locke called him the “incomparable Mr. Newton” on several occasions (e.g., in correspondence: Locke 1823: vol. 4: 55; and the next long quotation below)[^locke-1823]. Most historians think that each questioned the standard Anglican interpretation of the Trinity, contending that Jesus of Nazareth was not a divine figure on the same level as God the creator. Interpreting the Bible through historical and philosophical analysis in a fashion that was not constrained by standard Anglican doctrine in the late seventeenth century was fantastically important to Newton, occupying his attention for many years. Given their controversial and politically sensitive nature, his so-called anti-Trinitarian views were largely kept secret among a small circle of friends. However, Newton trusted Locke enough to send him a very long letter—entitled “Two Notable Corruptions of Scripture”—to present him with the evidence for Newton’s view that the original version of Christianity was corrupted beginning in the 4ᵗʰ century by the introduction of the doctrine of the Trinity (Newton 1959–, vol. 3: 83–129)[^newton-1959]. Locke was apparently sympathetic with Newton’s approach. With respect to their public views, Newton and Locke were often taken to represent two aspects of the same experimental-philosophical approach toward the close of the seventeenth century (Stein 1990; Wilson 1999: 196–214; and Domski 2012)[^domski-2012]. It is perhaps not difficult to understand why, for Newton was mentioned in one of the most famous passages in all of Locke’s writings. In the Epistle to the reader of Locke’s *Essay Concerning Human Understanding*, we read:
    step1: TBD
    step2: TBD
