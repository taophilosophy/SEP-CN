      The difference between Locke and Hume might be that the former, unlike the latter, nonetheless insisted that mechanism continued to provide philosophers with a canon for the intelligibility of causation within nature (Hume’s critique of earlier conceptions of causation, including Locke’s, is certainly well known). Hume also expended considerable effort in interpreting some of the philosophical aspects or consequences of Newton’s theory of gravity and his corresponding understanding of the nature of matter. In particular, he wished to provide what we would now call an empiricist interpretation of Newton’s three laws of motion, his concept of mass (quantity of matter), and his understanding of gravity; in the process, he does not shy away from interpreting Newton’s sometimes confusing notion of the *vis inertiae* or force of inertia. When students learn the canonical idea of a Newtonian force, they learn about what Newton called a *vis impressa*, an impressed force. They also learn that the mass of a body is not a force at all. But in all three editions of the *Principia*, Newton himself said that although the mass of a body is not an impressed force, it could be called by the “very significant name of force of inertia” because bodies with mass with resist acceleration (Newton 1999, 404)[^newton-1999]. And to resist acceleration seemed to Newton like an action that a body performs, say when some other body collides with it. Now for Hume, this issue was particularly difficult because he had already contended that strictly speaking, we have no idea (no representation) of force or power—these are merely words employed by natural philosophers without any ideas corresponding to them. Thus he must find an interpretation of Newton that is not predicated on our ability to form an idea of forces or powers. In a famous footnote in his *Enquiry Concerning Human Understanding*, he writes (Hume 1777 [1993: §vii.i note 2, 48–49])[^hume-1777]:
    step1: |-
      洛克与休谟的差异也许在于：前者与后者不同，仍然坚持机械论继续为哲学家提供自然之内因果可理解性的准则（休谟对包括洛克在内的早期因果概念的批评当然众所周知）。休谟也耗费了相当精力，解释牛顿引力理论及其相应的物质本性理解的一些哲学方面或后果。特别是，他想提供我们今天会称为经验主义解释的东西，来解释牛顿的三条运动定律、他的质量（物质的量）概念以及他对引力的理解；在此过程中，他并不回避解释牛顿有时令人困惑的 *vis inertiae* 或惰性力概念。当学生学习牛顿力的正典观念时，他们学到的是牛顿所称的 *vis impressa*，即外加力。他们也学到，物体的质量根本不是一种力。但在《原理》的三个版本中，牛顿本人都说，物体的质量虽不是外加力，却可以用“惰性力这一极有意味的名称”来称呼，因为具有质量的物体会抵抗加速度（Newton 1999, 404）[^newton-1999]。而在牛顿看来，抵抗加速度似乎是物体所施行的一种作用——比如当另一物体与它碰撞时。对休谟来说，这个问题特别困难，因为他已经主张，严格说来，我们对力或能力没有任何观念（没有任何表象）——这些只是自然哲学家使用的词语，并无与之相应的观念。因此，他必须找到一种不以我们形成力或能力观念的能力为前提的牛顿解释。在《人类理解研究》一条著名的脚注中，他写道（Hume 1777 [1993: §vii.i note 2, 48–49]）[^hume-1777]：
    step2: |-
