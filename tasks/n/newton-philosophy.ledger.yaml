      看起来，牛顿确实对超距作用这一观念本身感到不安。但当然，在解读艰深哲学文本时，事情并不总是如表象所示：一些历史学家和哲学家坚决主张，这封信还有其他读法。[^note-25] 他们论证说，牛顿所拒斥的或许不是物质物体之间的远距作用本身，而是这一观念的某个特定版本——它关联于“伊壁鸠鲁派”的观点，即引力在某种意义上是一切物质物体的本质特征；这一观点比牛顿可能愿意认可的更强。这一想法大致如下：牛顿想保留这样一种可能性，即上帝赋予了物体在远处彼此作用的能力；这一立场至少令人想起洛克在与斯蒂林弗利特通信中的观点（见上文）。理由在于，牛顿持有当时的标准观点：物质本身是被动的，要与其他物质发生因果相互作用，就需要某种神性干预。这里又一次可以听到这一观念的洛克式回声（这或许并非偶然）：洛克有时暗示，物质本身是被动的，意即它不能自行运动；运动必须由上帝“附加”给它。假如世界仅由一堆物质对象构成，比如漂浮在星际空间的岩石，那么除非有某种外力作用于它们，它们运动状态不会发生任何变化。任其自便，物质是被动的，不会运动。像某些“伊壁鸠鲁派”哲学家可能做过的那样论证物质本身本质上以引力为一种特征，就是否认物质是被动的；就是在暗示星际空间的岩石会彼此吸引并“自行”开始运动，不受任何外力影响。而这又可能把我们引上通向无神论的滑坡，因为按这种观点，物质会自行作用，无需任何神性干预。本特利与牛顿或可作如是解。
