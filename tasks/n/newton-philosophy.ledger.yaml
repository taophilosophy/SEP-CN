      于是莱布尼茨指控洛克派与牛顿派：他们关于人与神的哲学观点，会引出神学上难以消受的后果——比如人的灵魂可能是物质的，又比如上帝必须借助类似器官之物才能感知世间之事。这些话都是挑衅。洛克虽已于 1704 年去世，当时在英格兰仍有不少追随者（Gascoigne 1985: 172–3）[^gascoigne-1985]；牛顿本人则正值影响力巅峰：他已受封爵士（莱布尼茨信中称他“爵士”，即指此），时任皇家学会会长。塞缪尔·克拉克又曾于 1704、1705 年两度主讲波义耳讲座，是关联着英格兰基督教状况的公众人物。克拉克一经应战，同月便回信驳斥莱布尼茨的指控；洛克的观点随即退出视线，双方专论莱布尼茨对牛顿式观念与方法的种种反对。可是，克拉克为何代牛顿立言？牛顿在这场通信中到底扮演什么角色？这些问题至今困扰学界（见 Cohen and Koyré 1962; Bertoloni Meli 1999 and 2002; Vailati 1997）[^bertoloni-1999][^bertoloni-2002][^cohen-1962][^vailati-1997]。克拉克与牛顿之间没有书信一类文献能显示其角色的轮廓；不过当时两人同住伦敦，克拉克又是牛顿的堂区牧师，缺少书信文稿倒也不足为怪。仅此一点便耐人寻味，因为二人神学立场相去甚远：牛顿是坚定的反三一论者——洛克、威廉·惠斯顿等人都知道这一点——所以他或许认为，莱布尼茨关于英格兰“自然宗教”的那些论点，最好由今人所谓较主流的神学人物克拉克这样的角色来回应。无论如何，莱布尼茨及其追随者无疑把克拉克看作牛顿及其圈子的代言人。尽管如此，克拉克的观点确有一些地方可能偏离牛顿本人的意见；因此，若把这场通信实质上当成牛顿的作品，从而（可以说）把克拉克从我们的理解中抹去，那就不明智了。
