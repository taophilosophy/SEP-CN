      众所周知，十三世纪至十六世纪亚里士多德传统中的自然哲学，包含对亚里士多德关于自然世界之观念的分析，尤其在中世纪基督教化的语境之内。研究自然的哲学家实际上常常是在研究文本——例如对亚里士多德的评注——而不是做实验或从事观察，他们往往也不使用数学技术。传统上，亚里士多德学圈并不把自然哲学理解为一门数学学科（不像光学或天文学那样）；毋宁说，它特别关注对象的本性与因果。在十七世纪，伽利略、波义耳、笛卡尔和牛顿这样的自然哲学家开始不仅拒斥亚里士多德派的学说，也拒斥他们的技术，发展出若干新的数学的、概念的和实验的方法。牛顿尊重笛卡尔对亚里士多德观念的拒斥，但认为笛卡尔派在理解自然时既未充分运用伽利略的数学技术，也未充分运用波义耳的实验方法。当然，这些发展常被视为科学革命的核心。然而，尽管这些变化在十七世纪居于中心地位，自然哲学的*范围*却没有发生剧变。牛顿这样的自然哲学家投入大量精力，试图理解例如空间、时间与运动的本性，但他们把这种努力视为一个总括性事业的组成部分，该事业还包括对神圣存在的分析。牛顿是一位自然哲学家——与笛卡尔不同，他不是现代哲学的奠基者，因为他从未写过一部堪比《沉思集》的论著。尽管如此，他对十八世纪哲学的*影响*是深远的，远远超出研究自然的哲学家的边界，涵盖英国、欧洲大陆乃至新世界的众多人物与传统。[^note-4] 牛顿的影响至少有两个显著的方面。
