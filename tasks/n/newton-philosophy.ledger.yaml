      The eighteenth-century tendency to discuss Newton’s *philosophy*, rather than his *science*, may have an odd ring to modern ears. In this case, however, the evolution of the English language tracks a substantive intellectual development. As a matter of historical fact, the category of the scientist—along with that word in English—is a nineteenth-century invention. Specifically, at a meeting of the British Association for the Advancement of Science in June of 1833, the Cambridge philosopher William Whewell coined the word “scientist”. Whewell said that just as the practitioners of art are called “artists”, the practitioners of science ought to be called “scientists”, indicating that they should no longer be called philosophers.[^note-1] Indeed, before the early nineteenth century, people like Newton were called “philosophers”, or more specifically, “natural philosophers”. During the seventeenth century, and well into the eighteenth (at least until 1750, if not later), figures like Newton worked within the century’s old tradition of natural philosophy.[^note-2] The modern disciplines of physics, chemistry, biology and so on, had not yet been formed. (The *words* ‘physics’ in English, ’physique’ in French, and ‘physica’ in Latin were often used, but had a very broad meaning, like “natural philosophy.”) Philosophers who studied nature investigated such things as planetary motions, the nature of matter, and the possibility of a vacuum, but they also discussed many aspects of human beings, including the psyche, and how nature reflects its divine creator (Hatfield 1996)[^hatfield-1996]. As the title of Newton’s magnum opus, *Philosophiæ Naturalis Principia Mathematica* (*Mathematical Principles of Natural Philosophy*), suggests, he intended his work to be in dialogue with Descartes’s *Principia Philosophiae* (*Principles of Philosophy*, 1644). Descartes’s *Principles* is a complex text that includes discussions of everything from the laws of nature to the nature of God’s causal influence on the world. Descartes had famously promised that his physics required nothing more than the principles of geometry and pure mathematics (*Principles*, Part Two, §64). Although Descartes was a great mathematician, the author of a major work in geometry in 1637, Newton thought nonetheless that he had not lived up to this promise, so he would assuredly introduce *mathematical principles* for natural philosophy. Just as Descartes had sought to replace Aristotelian or “Scholastic” methods and doctrines in natural philosophy, Newton sought to replace Descartes’s. It is therefore more historically accurate and more illuminating to interpret Newton within the historical stream of natural philosophy.[^note-3]
    step1: |-
      十八世纪的倾向是讨论牛顿的*哲学*而非他的*科学*，这在今人听来或许有些古怪。然而在这个例子里，英语的演变恰好追踪着一项实质性的智识发展。就历史事实而言，科学家这一范畴——连同英语中那个词——是十九世纪的发明。具体地说，1833 年 6 月英国科学促进协会的一次会议上，剑桥哲学家威廉·惠威尔创造了“scientist”（科学家）一词。惠威尔说，正如艺术从业者被称为“artist”（艺术家），科学从业者也应被称为“scientist”，意指他们不应再被称为哲学家。[^note-1] 的确，在十九世纪初以前，像牛顿这样的人物被称为“哲学家”，或更确切地说，被称为“自然哲学家”。在十七世纪，并一直延续到十八世纪很长时间（至少到 1750 年，甚至更晚），像牛顿这样的人物都在那个已历时数百年的自然哲学传统内工作。[^note-2] 现代意义上的物理学、化学、生物学等学科尚未形成。（英语的‘physics’、法语的‘physique’、拉丁语的‘physica’这些*词*常被使用，但含义非常宽泛，类似于“自然哲学”。）研究自然的哲学家考察诸如行星运动、物质的本性、真空的可能性之类的事情，但他们也讨论人的许多方面，包括灵魂，以及自然如何反映其神圣创造者（Hatfield 1996）[^hatfield-1996]。正如牛顿巨著的标题 *Philosophiæ Naturalis Principia Mathematica*（《自然哲学的数学原理》）所暗示的，他有意让自己的工作与笛卡尔的 *Principia Philosophiae*（《哲学原理》，1644）对话。笛卡尔的《原理》是一部复杂的文本，讨论的内容从自然法则直到上帝对世界的因果影响的本性。笛卡尔曾有一句著名的承诺：他的物理学所需的，不过是几何学与纯粹数学的原理（《原理》第二部分，§64）。尽管笛卡尔是大数学家，1637 年写出过一部重要的几何学著作，牛顿仍然认为他没有兑现这一承诺，因此他理所当然要为自然哲学引入*数学原理*。正如笛卡尔曾试图取代自然哲学中的亚里士多德式或“经院式”方法与学说，牛顿也试图取代笛卡尔的那些。因此，把牛顿放在自然哲学的历史长河中加以解释，在历史方面更准确，也更有启发性。[^note-3]
    step2: |-
      十八世纪人们倾向于讨论牛顿的*哲学*而非他的*科学*，在今人听来或许有些异样。不过在这个例子上，英语的演变恰好标记了一次实质性的智识变迁。就历史事实而言，“科学家”这个范畴——连同英语里那个词——都是十九世纪的产物。确凿地说，1833 年 6 月英国科学促进协会的一次会议上，剑桥哲学家威廉·惠威尔造出了“scientist”（科学家）一词。惠威尔说：正如搞艺术的人称为“artist”（艺术家），搞科学的人也该称作“scientist”，言下之意，他们不再该被唤作哲学家了。[^note-1] 诚然，在十九世纪初以前，牛顿式的人物都被唤作“哲学家”，或更确切地说是“自然哲学家”。整个十七世纪，直到十八世纪很长时间（至少 1750 年，或许更晚），牛顿式的人物都在那已有数百年之久的自然哲学传统里活动。[^note-2] 现代意义上的物理学、化学、生物学等学科当时尚未成形。（英语 physics、法语 physique、拉丁语 physica 这些*词*固然常用，含义却极宽，与“自然哲学”相仿。）研究自然的哲学家考察行星运动、物质的本性、真空是否可能这类问题，同时也讨论人的诸多方面，包括灵魂，以及自然如何映现其神圣创造者（Hatfield 1996）[^hatfield-1996]。牛顿巨著题为 *Philosophiæ Naturalis Principia Mathematica*（《自然哲学的数学原理》），这暗示他有意与笛卡尔的 *Principia Philosophiae*（《哲学原理》，1644）对话。笛卡尔的《原理》是一部复杂的书，从自然法则一直讲到上帝对世界之因果影响的本性。笛卡尔有句名言：他的物理学不需别的，只需几何学与纯粹数学的原理（《原理》第二部分 §64）。笛卡尔是大数学家，1637 年还写过一部重要的几何学著作，可牛顿仍认为这个承诺没有兑现，于是他决意为自然哲学引入*数学原理*。笛卡尔当年要取代自然哲学中亚里士多德式（即“经院式”）的方法与学说，牛顿如今要取代笛卡尔的这一套。可见，把牛顿放回自然哲学的历史水流中去解读，既更合史实，也更能发人深思。[^note-3]
