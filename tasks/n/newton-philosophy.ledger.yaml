      > These things being so, it can be no longer disputed, whether there be colours in the dark, nor whether they be the qualities of the objects we see, no nor perhaps, whether Light be a Body. For, since Colours are the *qualities* of Light, having its Rays for their entire and immediate subject, how can we think those Rays *qualities* also, unless one quality may be the subject of and sustain another; which in effect is to call it *substance*. We should not know Bodies for substances, were it not for their sensible qualities, and the Principal of those being now found due to something else, we have as good reason to believe that to be a substance also. (Newton 1959–, vol. 1: 100)[^newton-1959]
    step1: |-
      > 既然如此，则黑暗中是否有颜色，便不再可争；这些颜色是否我们所见的物体的性质，亦然；或许连光是否一个物体，也不再可争。因为，颜色既是光的*性质*，以光的射线为其全部而直接的主体，我们又怎能认为那些射线也是*性质*呢——除非一种性质可以成为另一性质的主体并承载另一性质；而这实际上就是称它为*实体*。若非凭借可感性质，我们便不会知道物体是实体；而既然这些性质的首要承载者如今被认定当归于别的东西，我们便有同样充分的理由相信那东西也是实体。（Newton 1959–，第 1 卷：100）[^newton-1959]
    step2: |-
      > 事情既然如此，则黑暗中究竟有没有颜色，便无可再争；这些颜色究竟是不是我们所见的物体的性质，亦无可再争；或许连“光是否一个物体”，也无可再争。因为颜色既然是光的*性质*，以光的射线为它全部而直接的主体，我们又怎能把这些射线也当作*性质*呢？除非一种性质可以充当另一性质的主体、承托另一性质——那实际上就是称它为*实体*了。倘若没有可感性质，我们本不会知道物体是实体；而现在，这些性质的首要承载者既然被发现当归于别的东西，我们便有同样充分的理由相信，那东西也是实体。（Newton 1959–，第 1 卷：100）[^newton-1959]
