      Bentley sought Newton’s assistance in particular because he wanted guidance in divining how the theory of the *Principia* indicates that the solar system must have been designed by an intelligent agent and could not have arisen through the physical interactions of material bodies. In the first edition of the *Principia* in 1687, Newton had made such a claim in a very brief statement (Newton 1972: vol. 2: 582–3; Cohen 1971: 154–6)[^cohen-1971][^newton-1972]. In the second edition of the text (published in 1713), he removed that statement, replacing it with a more extensive discussion in the new section of the text, added to its end, called the “General Scholium” (mentioned above). Through their correspondence, Bentley learned that from Newton’s point of view, the positions of the planets relative to one another—and especially to the sun—indicate that mere chance, or the ordinary physical interactions of the planetary bodies, could not have placed each planet in precisely the right orbit to maintain a solar system like ours for an extended period of time. With this argument, Newton seems to be indicating that mere chance would have produced an unstable planetary system, one in which the planets would eventually either be too strongly attracted to the sun, falling into it, or too weakly attracted, flying off into space. In this episode, a theologian appeals to the new authority of Newtonian natural philosophy when attempting to undermine atheism. And that was apparently the very kind of interchange that Boyle had envisioned when endowing the lecture series.
