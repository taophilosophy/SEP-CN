      For his part, Hume had a more nuanced reaction to the emergence of the Newtonian program (cf. Schliesser 2007 and DePierris 2012)[^depierris-2012][^schliesser-2007][^schliesser-2012]. He certainly signaled his endorsement of the experimental philosophy—itself strongly associated with the Newtonians, along with figures like Boyle and Hooke, as we have seen—when he gave his *Treatise* the following subtitle: “being an attempt to introduce the experimental method of reasoning into moral subjects”. And one might argue that Hume made a kind of Lockean move when he chose to endorse the Newtonian program specifically in preference to the mechanical philosophy, which he regarded with suspicion. A famous comment from his *History of England* bolsters this interpretation:
    step1: |-
      就休谟而言，他对牛顿纲领的兴起反应更为细致（参 Schliesser 2007 与 DePierris 2012）[^depierris-2012][^schliesser-2007][^schliesser-2012]。当他给《人性论》加上如下副题时，无疑表明了他对实验哲学的认可——如前所见，实验哲学本身与牛顿派以及波义耳、胡克等人物紧密相联：“一个试图把实验推理方法引入道德题材的尝试”。人们还可以论证，休谟在特意选择认可牛顿纲领而非他心存疑虑的机械哲学时，作出了某种洛克式的举动。《英国史》中一段著名评论支持这一解读：
