      > Natural religion itself seems to decay [in England] very much. Many will have human souls to be material; others make God himself a corporeal being. Mr. Locke and his followers are uncertain at least whether the soul is not material and naturally perishable. Sir Isaac Newton says that space is an organ which God makes use of to perceive things by. But if God stands in need of any organ to perceive things by, it will follow that they do not depend altogether on him, nor were produced by him. (Clarke and Leibniz 1717: L 1: 1–3)[^clarke-1717]
    step1: TBD
