      Newton’s influence on the development of philosophy did not end with the close of the eighteenth century. Most obviously, the concepts of absolute space and absolute motion continued to play fundamental roles in philosophical theorizing about space and motion more generally for the next two centuries, and they remain fundamental to discussions today (DiSalle 2006)[^disalle-2006]. Newton has also had a deep and lasting influence on numerous other topics in what we now call the philosophy of science, including the status of our knowledge of natural phenomena, the best ideas about scientific methodology, the status of the laws of nature, and much else besides (McMullin 2001 and Smith 2001)[^mcmullin-2001][^smith-2001]. It is no exaggeration to say that Newton has a permanent place in the history of modern philosophy.
