      These attempts by canonical philosophers like Berkeley and Hume to find what they regarded as a defensible interpretation of Newtonian forces are mirrored by similar attempts in the writings of leading mathematicians. For instance, the very same issue discussed by Hume had already been debated by two of the leading figures in Continental science, D’Alembert and Euler. For his part, in his famous work, the *Traité de dynamique*(1743), D’Alembert expressed a view that is very similar to Hume’s (in certain respects). He proclaimed right at the outset that he wished to develop a physics that would dispense with the concept of a force altogether on the grounds that it was an “obscure” idea. He would “reduce all the principles of mechanics to three, the force of inertia, compound motion, and equilibrium” (D’Alembert 1743, 3)[^d’alembert-1743]. He immediately explained the first item: the reason that he could accept Newton’s force of inertia is that it’s characterized as a property of bodies, one in virtue of which they follow the laws of motion, rather than a force or power. So it was not an obscure notion. Ironically, the great Swiss mathematician Euler had precisely the opposite reaction: from his point of view, the “force of inertia” was simply a misnomer, for it was not a force at all and should therefore be expunged from physics altogether. Instead, physics should employ only the idea of an impressed force, a cause of acceleration, which he regarded as a perfectly clear idea. Of course, history was on Euler’s side, indeed so much so that future generations would not even imagine that so many leading philosophers and mathematicians during the Enlightenment debated this topic.
    step1: |-
      贝克莱、休谟这样的正典哲学家为寻找他们所认为可辩护的牛顿力解释所作的这些努力，在一流数学家的著作中有类似的对应尝试。例如，休谟所讨论的同一问题，早已由欧洲大陆科学界两位首要人物达朗贝尔与欧拉争论过。就达朗贝尔而言，在其名著《动力学论》（1743）中，他表达了一种（在某些方面）与休谟非常相似的观点。他在开篇即宣称，他希望发展一种完全不需要力概念的物理学，理由是力是一个“晦暗的”观念。他要“把力学的一切原则归结为三条：惰性力、复合运动与平衡”（D'Alembert 1743, 3）[^d’alembert-1743]。他随即解释了第一项：他能接受牛顿的惰性力，是因为它被刻画为物体的一种性质，物体凭这种性质遵循运动定律，而不是一种力或能力。所以它并不是一个晦暗的概念。讽刺的是，伟大的瑞士数学家欧拉的反应恰恰相反：在他看来，“惰性力”纯属误称，因为它根本不是一种力，因此应从物理学中彻底删除。物理学反而只应采用外加力的观念，即加速度之因；他认为这是一个完全清楚的观念。当然，历史站在欧拉一边，以至于后世甚至不会想到，启蒙运动期间有那么多一流哲学家与数学家曾辩论过这个题目。
    step2: |-
