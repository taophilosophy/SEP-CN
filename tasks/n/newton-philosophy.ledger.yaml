      Newton took special interest in the Cartesian view of space and body, and in related views concerning the causal relations between minds and bodies and between God and the bodies that constitute the natural world. Like many of Newton’s contemporaries in Cambridge in those days, he encountered these Cartesian views within the context of Henry More’s then famous discussions of Cartesianism (a term coined by More himself). Beginning with his correspondence with Descartes in 1648 (Lewis 1953)[^lewis-1953], and continuing with a series of publications in later years, many of which Newton owned in his personal library (Harrison 1978)[^harrison-1978], More argued that Descartes made two fundamental mistakes: first, he wrongly contended that extension and matter are identical (and that the world is therefore a plenum); and second, he mistakenly believed that God and the mind were not extended substances, which made their causal interactions with such substances mysterious. Just as Princess Elisabeth of Bohemia had raised fundamental objections to Cartesian dualism (see Shapiro 2007)[^shapiro-2007] in the early 1640s, More raised similar objections against the Cartesian view of the divine a few years later (Lewis 1953)[^lewis-1953]. Descartes agreed with More’s suggestion that God can act anywhere on nature if he so chooses, and came very close to accepting More’s contention that such a view entails that God must be present within the world wherever he in fact chooses to act. For how could God part the Red Sea, suggested More, unless God were present precisely where the Red Sea is located? Of course, More agreed that God is not made of parts, cannot be imagined, and cannot be affected by the causal activity of material bodies—the causal arrow flows only in one direction. But More concluded that God is extended in his own way. If one fixes Descartes’s two basic mistakes, one obtains what More regarded as a proper philosophical view: space is distinct from matter because it is extended but penetrable, whereas matter is extended but impenetrable; and, in tandem, all substances are extended, but whereas some, such as tables and chairs, are impenetrable, others, such as the mind and God, are penetrable and therefore not material.[^note-13] Newton was deeply influenced both by More’s criticisms of Descartes and by his positive philosophical conception of space and the divine.
    step1: |-
      牛顿对笛卡尔关于空间与物体的观点，以及关于心灵与物体之间、上帝与构成自然界的物体之间的因果关系的观点，抱有特别的兴趣。与当时剑桥的许多同侪一样，他是在亨利·莫尔当时著名的笛卡尔主义讨论的语境中接触到这些笛卡尔观点的（“笛卡尔主义”一词正是莫尔自己造的）。莫尔从 1648 年与笛卡尔的通信开始（Lewis 1953）[^lewis-1953]，随后数年间又有一系列出版物（其中许多牛顿的私人藏书里都有，Harrison 1978）[^harrison-1978]，他主张笛卡尔犯了两个根本错误：第一，他错误地主张广延与物质同一（因而世界是充满的）；第二，他错误地相信上帝与心灵不是广延的实体，这使得它们与这类实体的因果互动变得神秘。正如波希米亚的伊丽莎白公主在十七世纪四十年代初对笛卡尔二元论提出根本性诘难（见 Shapiro 2007）[^shapiro-2007]一样，莫尔在几年后针对笛卡尔的神性观提出了类似的诘难（Lewis 1953）[^lewis-1953]。笛卡尔同意莫尔的提议，即上帝若愿意便可以在自然的任何地方行动，并且几乎接受了莫尔的论点：这种观点蕴含着上帝必须临在于世界中他实际选择行动的任何地方。莫尔提示说：若上帝不恰在红海所在之处，上帝怎能分开红海呢？当然，莫尔也同意，上帝不由部分构成，不可被想象，也不会受物体因果活动的影响——因果之箭只朝一个方向流。但莫尔的结论是：上帝以他自己的方式是广延的。只要修正笛卡尔的两个基本错误，就得到莫尔眼中恰当的哲学观点：空间与物质不同，因为空间是广延的但可穿透，而物质是广延的但不可穿透；相应地，一切实体都是广延的，但其中一些（如桌椅）不可穿透，另一些（如心灵与上帝）则可穿透，因而不是物质的。[^note-13] 牛顿深受莫尔对笛卡尔的批评以及他关于空间与神圣的正面哲学构想的影响。
    step2: |-
      牛顿格外关心的，是笛卡尔关于空间与物体的观点，以及相关的两组因果关系：心灵与物体之间、上帝与构成自然界的诸物体之间。与当时剑桥的许多同侪一样，他是在亨利·莫尔那场名噪一时的笛卡尔主义讨论中碰到这些观点的（“笛卡尔主义”一词正是莫尔本人所造）。莫尔自 1648 年与笛卡尔通信始（Lewis 1953）[^lewis-1953]，此后连年著述（其中多部就在牛顿的私人藏书里，Harrison 1978）[^harrison-1978]，力陈笛卡尔犯了两桩根本错误：其一，他错误地主张广延与物质同一（于是世界必是充满的）；其二，他误以为上帝与心灵不是广延实体，这使得它们与广延实体的因果互动成了谜。波希米亚的伊丽莎白公主在十七世纪四十年代初曾对笛卡尔二元论提出根本诘难（见 Shapiro 2007）[^shapiro-2007]；几年之后，莫尔对笛卡尔的神性观提出了同类诘难（Lewis 1953）[^lewis-1953]。笛卡尔同意莫尔的提法：上帝若愿意，可在自然的任何处所行动；他也几乎接受了莫尔的论断：这蕴含着，上帝必须临在于世界中他实际选择行动之处。莫尔提示道：上帝若不恰在红海所在之处，怎能分开红海？当然，莫尔也承认：上帝不由部分构成、不可想象、不受物体因果活动影响——因果之箭只单向流。但莫尔的结论是：上帝以他自己的方式广延。把笛卡尔的两桩基本错误纠正过来，便得到莫尔心目中恰当的哲学图景：空间广延而可穿透，物质广延而不可穿透，二者判然有别；相应地，一切实体皆广延，其中一类（如桌椅）不可穿透，另一类（如心灵与上帝）可穿透，故而非物质。[^note-13] 莫尔对笛卡尔的批评、以及他关于空间与神圣者的正面哲学构想，都深深影响了牛顿。
