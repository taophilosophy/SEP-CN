      第一，牛顿在《光学》与《原理》里的成就，被公认具有极重的哲学分量，十八世纪几乎没有哲学家能绕得开。这一时期名列正典的哲学家大多设法在自己体系的措辞里解读牛顿的种种认识论主张，不少人还把自家观点与牛顿观点是否融贯当作评判哲学优劣的标准。世纪之初，贝克莱在《分析者》（1734）里同牛顿的微积分工作交锋，在《论运动》（1721）里同他的动力学交锋，甚至在其流传很广的《海拉斯与菲洛诺斯三篇对话》（1713）中也提到了引力——那最具典范性的牛顿式力。贝克莱在《对话》里清点哲学家所谓物质物体的第一性质时，竟在习见的尺寸、形状、运动、坚实之外添上“引力”，这说明《原理》第二版尚未广泛流传，通行的物体观已然生变。同样值得注意的是，就在同一年，牛顿《原理》第二版的编者罗杰·科茨在编者序里也主张：引力确应与那些前几年聚讼不已的机械论性质同列第一性质。（牛顿本人谈这个话题则谨慎得多。）至于休谟，他按经验主义路数解读牛顿式自然哲学，并在《人性论》（1739）与《人类理解研究》（1750）中点出它的一些更广泛意涵。牛顿的工作还是本世纪初莱布尼茨与牛顿主义者塞缪尔·克拉克那场影响极大的通信的起因，而这场通信即便对世纪末的写作者也显出其分量。笛卡尔派与莱布尼茨派之间关于活力（*vis viva*）的争论及其他争端，到世纪中叶便已消歇；莱布尼茨派与牛顿派之间的论战却不同，它在数十年间始终具有哲学上的显著地位，既催生了法国启蒙运动中夏特莱侯爵夫人影响深远的《物理学基础》（1740），也是康德 1770 年代发展“批判”哲学的推动力之一，其终点是 1781 年的《纯粹理性批判》。此外，牛顿的工作还催生了一大批用英语、法语、拉丁语写成的评注文献：约翰·凯尔《自然哲学导论》（1726）、弗朗切斯科·阿尔加罗蒂《为女士而作的牛顿主义》（1738）、亨利·彭伯顿《牛顿爵士哲学一瞥》（1728）、伏尔泰《牛顿哲学要义》（1738）、威廉·格拉夫桑德《自然哲学的数学要素》（1747）、科林·麦克劳林《牛顿爵士哲学发现述评》（1748），如此等等。不只如此，牛顿文本后来在欧洲大陆出的两个版本，都不只是处理他本人的观念，还与他的潜在论敌——大数学家约翰·伯努利、莱布尼茨——的观念作了实质性的哲学交锋。勒瑟尔与雅基耶两神父 1739–1744 年在三卷本中推出的著名“耶稣会”（或“日内瓦”）版《自然哲学的数学原理》，便与莱布尼茨派观念有大量交锋（Guicciardini 2015）[^guicciardini-2015]；夏特莱侯爵夫人则在她身后于 1759 年出版的《原理》法文全译本里附写了一篇规模可观的“分析性评注”，用意之一是把牛顿旧的“几何”物理学进路转换为新的分析语言，而这一计划牵动着诸多哲学问题。可见，牛顿在数学、物理学与哲学上的观念与方法，直至启蒙运动深处都仍然举足轻重。
