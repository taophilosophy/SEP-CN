      尽管牛顿显然成功地得到了我们今天所称的万有引力定律，他承认自己对引力还缺乏另一种知识；这种知识匮乏直接反映了他对力之抽象刻画的一个方面。在总附释中，他提醒读者：引力与物体的物质的量（其质量）成正比，并在我们的太阳系中跨越广袤距离而起作用，随后又说：“我至今还不能从现象中推出引力的这些性质的原因，我也不杜撰假设。”[^note-19] 借这句牛顿全部著作中最著名的话之一，他回到了四十年前他第一篇光学论文的一个关键主题，即假设与假设性推理在自然哲学中的正当作用。[^note-20] 牛顿的一些解释者把这句话视为表示一种强烈承诺：原则上应当避免一切关于自然现象的假设。这种解释有时还伴随着这样一种看法：十七世纪晚期的一些英国哲学家认为，笛卡尔主义在就现象得出结论时过分依赖假设。但这种解释恐怕难以与牛顿的文本相容。例如，在《原理》第一卷命题 96 的附释中，牛顿讨论了关于光线的假设。同样，在《光学》疑问 21 中，他提出可能存在一种以太，其密度差异解释了物体之间作用的引力。鉴于这类例子，对总附释中那句宣言可以这样理解：一位关心解释自然之某种特征的哲学家——例如引力与空间间隔的*平方*成反比、而非与*立方*成反比这一事实——可以正当地设想并提出假设以供考虑，但她不得以如下意义“杜撰”假设，即把它当作已经通过实验、观察或某种推理（包括数学推理）而确立的东西。因此牛顿认为，他已确立引力按物质的量作用于一切物体这一事实，但他*尚未*确立以太的存在。那么，牛顿的口号 *hypotheses non fingo* 究竟排除了什么？到总附释时，牛顿已日益卷入与莱布尼茨的哲学争执。莱布尼茨读了牛顿寄给他的《原理》之后，为著名刊物《博学学报》写了一篇论行星运动原因的论文（“Tentamen”）。为了在其 1689 年发表的《Tentamen》中说明行星体的运动，莱布尼茨*依假设*引入前提：某种流体包围并毗连各行星体；然后论证这种流体必定运动，才能说明它们的轨道。[^note-21] 牛顿也许会说，莱布尼茨“杜撰”了涡旋假设。也就是说，他会反对莱布尼茨的结论——太阳系中必定存在涡旋（而不是建议我们例如通过观测彗星之类的东西来探测其存在）。两位哲学家在这点上的论辩会把它们引向机械论哲学的问题：牛顿会基于方法论理由反对莱布尼茨的推理，而莱布尼茨则会回答说，牛顿的引力理论涉及超距作用，而他的涡旋假设避免了这一点（详见下文）。
    step2: |-
      牛顿在获得今所谓万有引力定律上固然成绩斐然，却也承认自己对引力另有一类知识尚付阙如；这一欠缺，直接映现出他对力之抽象刻画的某一面相。总附释里他提醒读者：引力与物体的物质的量（质量）成正比，且在太阳系中跨越极远距离起作用，随后又说：“我至今未能从现象中推出重力这些性质的原因，而我不杜撰假设。”[^note-19] 这句话是牛顿全部文字中最著名者之一；借它，他又回到四十年前第一篇光学论文的一大主题：假设、以及假设性推理，在自然哲学中究竟该占什么位置。[^note-20] 有些解释者把这句话读作一种强硬承诺：凡关于自然现象的假设，原则上皆当避免。这种解读有时还连着一种看法：十七世纪晚期若干英国哲学家认为，笛卡尔主义在就现象下结论时过于倚重假设。可这种解读恐怕难以与牛顿的文本相容。譬如《原理》第一卷命题 96 的附释里，牛顿便讨论了关于光线的假设；《光学》疑问 21 里，他又提出可能存在一种以太，其密度之差造成物体之间作用的引力。有鉴于此，总附释那句宣言不妨这样读：一位旨在解释自然之某特征的哲学家——比如引力与空间间隔的*平方*成反比，而不是与*立方*成反比——大可以正当地设想假设、提出假设供人考虑；但不得以如下意义“杜撰”假设，即把它当作业经实验、观察或某种推理（数学推理在内）确立的东西。所以牛顿认为自己已确立“引力按物质的量作用于一切物体”这一事实，却*尚未*确立以太的存在。那么，牛顿那句口号 *hypotheses non fingo* 究竟排除了什么？到写总附释时，牛顿已深陷与莱布尼茨的哲学争执。莱布尼茨读过牛顿寄赠的《原理》后，为名刊《博学学报》撰文论行星运动之原因（“Tentamen”）。在他 1689 年刊出的《Tentamen》里，为说明行星体的运动，莱布尼茨*依假设*引入一个前提：有某种流体包裹并毗连各行星体；继而论证此流体必须运动，方能说明诸行星的轨道。[^note-21] 牛顿也许会说，莱布尼茨这是“杜撰”了涡旋假设。换言之，他所反对的是莱布尼茨的结论——太阳系中必有涡旋（而非例如建议我们借观测彗星之类去探寻其踪迹）。两位哲学家的这场交锋终将把他们引到机械论哲学的问题上：牛顿会以方法论为由反对莱布尼茨的推理，莱布尼茨则回敬说，牛顿的引力理论涉乎超距作用，而他的涡旋假设恰可避开（详见下文）。
