      首先，牛顿在《光学》和《原理》中的成就被认为具有如此重大的哲学意义，以致十八世纪很少有哲学家忽视它。这一时期大多数正典哲学家都试图在自身体系的术语内解释牛顿的各类认识论主张，许多人还把自家观点与牛顿观点是否融贯，当作哲学是否优异的判准。本世纪初期，贝克莱在《分析者》（1734）中与牛顿关于微积分的工作角力，在《论运动》（1721）中与他的动力学角力，甚至在其通俗著作《海拉斯与菲洛诺斯三篇对话》（1713）里提到了引力——那种典范的牛顿式力。贝克莱在《对话》中列举哲学家们视为物质物体之所谓第一性质的东西时，引人注目地在较为习见的尺寸、形状、运动与坚实之外加上了“引力”，这就表明在《原理》第二版广泛流传之前，关于物质物体的通行观点已经改变。同样值得注意的是，就在同一年，牛顿《原理》第二版的编者罗杰·科茨在编者序中也主张，引力确实应当与那些在此前数年引起大量讨论的习见机械论性质一道，算作第一性质。（牛顿本人处理这一话题则更为谨慎。）至于休谟，他以经验主义的路数解释牛顿式自然哲学，并在《人性论》（1739）与《人类理解研究》（1750）中指出其若干更广泛的意涵。牛顿的工作还成为本世纪早期莱布尼茨与牛顿主义者塞缪尔·克拉克之间那场影响极大的通信的动因，这场通信即便对接近世纪末写作的思想家也证明是重要的。与笛卡尔派和莱布尼茨派之间到本世纪中叶便已消歇的活力（*vis viva*）争论及其他争端不同，莱布尼茨派与牛顿派之间的论战在数十年间一直保持哲学上的显著地位，既推动了法国启蒙运动期间夏特莱侯爵夫人影响深远的著作《物理学基础》（1740），也是康德在 1770 年代发展“批判”哲学的驱动力之一，其成果最终是 1781 年的《纯粹理性批判》。此外，牛顿的工作还催生了英语、法语与拉丁语中数量庞大的评注文献，包括约翰·凯尔的《自然哲学导论》（1726）、弗朗切斯科·阿尔加罗蒂的《为女士而作的牛顿主义》（1738）、亨利·彭伯顿的《牛顿爵士哲学一瞥》（1728）、伏尔泰的《牛顿哲学要义》（1738）、威廉·格拉夫桑德的《自然哲学的数学要素》（1747）、科林·麦克劳林的《牛顿爵士哲学发现述评》（1748）等等。不仅如此，牛顿文本其后在欧洲大陆的两个版本，不仅包含对其本人观念的实质性哲学处理，也包含与他的潜在对手——如大数学家约翰·伯努利，以及莱布尼茨——的观念的交锋。勒瑟尔与雅基耶两位神父于 1739–1744 年出版的三卷本著名的“耶稣会”（或“日内瓦”）版《自然哲学的数学原理》，就实质性地处理了莱布尼茨派的观念（Guicciardini 2015）[^guicciardini-2015]。夏特莱侯爵夫人则在她 1759 年身后出版的《原理》法文全译本中写下了一篇篇幅宏大的“分析性评注”。其用意之一，是把牛顿旧的“几何式”物理学进路转译为新的分析语言，这一计划与诸多哲学问题纠缠在一起。因此，牛顿在数学、物理学与哲学中的观念和方法，直到启蒙运动纵深之处仍具有实质的重要性。
