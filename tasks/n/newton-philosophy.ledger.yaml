      A second aspect of Newton’s influence involves thinkers who attempted in one way or another to articulate, follow, or extend, the Newtonian “method” in natural philosophy when treating issues and questions that Newton ignored. Euclidean geometry and its methods were seen as a fundamental epistemic model for much of seventeenth-century philosophy—as is well known, Descartes’ *Meditations* attempts to achieve a type of certainty he likens to that found in geometry, and Spinoza wrote his *Ethics* according to the “geometrical method”. Propositions deduced from axioms in Euclidean geometry were seen as paradigm cases of knowledge. We might see Newton’s work as providing eighteenth-century philosophy with one of its primary models, and with a series of epistemic exemplars as well. But part of philosophy’s task was to articulate precisely what the new Newtonian method involved. David Hume is perhaps clearest about this aspect of Newton’s influence: his *Treatise* of 1739 has the subtitle, “An Attempt to Introduce the Experimental Method of Reasoning Into Moral Subjects”, and there can be little doubt that he meant (at least in part) the method of the *Opticks* and the *Principia* (DePierris 2012)[^depierris-2012]. Indeed, as Hume’s text makes abundantly clear, various eighteenth-century philosophers, including not only Hume in Scotland but Jean-Jacques Rousseau on the Continent, were taken to be, or attempted to become, “the Newton of the mind”.[^note-5] For Hume, this meant following what he took to be Newton’s empirical method by providing the proper description of the relevant phenomena and then finding the most general principles that account for them. Of course, one aspect of Hume’s work is to provide an analysis of the concept of causation that is far more extensive than anything found in Newton, which has a substantial impact on what counts as an “account” of a phenomenon. This method would allow us to achieve the highest level of knowledge attainable in the realm of what Hume calls “matters of fact”.[^note-6]
    step1: |-
      牛顿影响的第二个方面，涉及这样一批思想家：他们在处理牛顿所忽略的议题与问题时，以这样或那样的方式试图阐明、遵循或推广牛顿自然哲学中的“方法”。欧几里得几何学及其方法被视为十七世纪哲学大部分内容的基本认识论模型——众所周知，笛卡尔的《沉思集》力求获得一种他比作几何学之确定性的确定性，斯宾诺莎则按照“几何学方法”写作他的《伦理学》。从欧几里得几何的公理中演绎出来的命题，被视为知识的典范案例。我们不妨把牛顿的工作看作给十八世纪哲学提供了其主要模型之一，同时也提供了一系列认识论范例。但哲学的任务有一部分恰恰是确切阐明这种新的牛顿式方法究竟包含什么。就此而言，大卫·休谟或许说得最清楚：他 1739 年的《人性论》副标题是“把实验推理方法引入道德主题的一次尝试”，而几乎毫无疑问，他所指的（至少部分地）是《光学》与《原理》的方法（DePierris 2012）[^depierris-2012]。的确，正如休谟的文本充分表明的，十八世纪的诸多哲学家——不仅包括苏格兰的休谟，也包括欧洲大陆的让-雅克·卢梭——都被认为是、或正试图成为“心灵的牛顿”。[^note-5] 对休谟来说，这意味着遵循他所理解的牛顿经验方法：先对相关现象作出恰当描述，再找出能够说明它们的最普遍原理。当然，休谟工作的一面，是对因果概念给出远比牛顿任何著作都更广泛的分析，这对什么才算作对一个现象的“说明”有实质影响。这套方法将使我们能够在休谟所谓的“事实问题”领域达到可企及的最高知识等级。[^note-6]
    step2: |-
      牛顿影响的第二个方面，关乎这样一批思想家：他们在处理牛顿不曾置意的议题与问题时，或明或暗地试图阐明、遵循、推广牛顿自然哲学里的“方法”。欧几里得几何及其方法，被视为十七世纪哲学大半的根本认识论范本——众所周知，笛卡尔《沉思集》力求一种他自己比作几何确定性的确定性，斯宾诺莎干脆按“几何学方法”写《伦理学》。从欧几里得几何公理演释出来的命题，被当作知识的典范实例。我们不妨说，牛顿的工作为十八世纪哲学提供了它的主要模型之一，也提供了一串认识论上的范例。不过哲学的一项任务，恰恰是把这套新牛顿方法究竟包含什么说清楚。就这一面相而言，休谟或许讲得最明白：他 1739 年的《人性论》副标题是“把推理的实验方法引入道德题材的尝试”，而几乎毋庸置疑，他指的（至少部分地指）就是《光学》与《原理》的方法（DePierris 2012）[^depierris-2012]。休谟的文本本身也充分表明，十八世纪不少哲学家——不只是苏格兰的休谟，还有大陆上的让-雅克·卢梭——都被看作想当、或在努力当“心智的牛顿”。[^note-5] 就休谟而言，这意味着循着他所理解的牛顿经验方法：先对有关现象作出恰当描述，再找出足以说明它们的最普遍原理。当然，休谟工作的一面，是对因果概念给出远比牛顿任何著作都更充分的分析，而这对“什么才算对一现象的说明”产生了实质影响。凭这套方法，我们便能在休谟所谓“事实问题”的领域内达到可及的最高一级知识。[^note-6]
