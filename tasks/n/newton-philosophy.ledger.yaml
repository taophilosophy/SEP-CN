      > But Mr. Leibniz goes on. “The ancients and the moderns, who own that gravity is an occult quality, are in the right, if they mean by it that there is a certain mechanism unknown to them whereby all bodies tend towards the center of the earth. But if they mean that the thing is performed without any mechanism by a simple primitive quality or by a law of God who produces that effect without using any intelligible means, it is an unreasonable and occult quality, and so very occult that it is impossible that it should ever be done though an angel or God himself should undertake to explain it”. (Newton 2004: 116)[^newton-2004]
