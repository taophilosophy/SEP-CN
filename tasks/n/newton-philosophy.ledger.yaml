      > It is true, I say, that ‘bodies operate by impulse and nothing else’. And so I thought when I writ it, and can yet conceive no other way of their operation. But I am since convinced by the judicious Mr. Newton’s incomparable book, that it is too bold a presumption to limit God’s power, in this point, by my narrow conceptions. The gravitation of matter toward matter by ways inconceivable to me, is not only a demonstration that God can, if he pleases, put into bodies, powers and ways of operations, above what can be derived from our idea of body, or can be explained by what we know of matter, but also an unquestionable and every where visible instance, that he has done so. And therefore in the next edition of my book, I shall take care to have that passage rectified. (Locke 1823: vol. 4: 467–8)[^locke-1823].
