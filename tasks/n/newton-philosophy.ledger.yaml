      如此，洛克持有一种常见看法：牛顿的万有引力理论与机械哲学不相容——或许正因此，它对我们不可理解——而当被迫在这两者之间抉择时，他显然站在牛顿一边，认为牛顿的理论得到了“经验”的支持。他这样做的办法，是认可这样一种观点：上帝必定给物质物体添加了“能力”或“作用方式”，而这些无法从我们关于物体的观念中推出来。在此情形下，这类能力或作用方式会产生引力相互作用，想必发生于空间上彼此相隔甚远的物体之间。然而在洛克看来，牛顿的理论使他相信这类能力确实存在，这一事实并不蕴涵该理论使引力变得“可设想”：即使万有引力理论正确，它也不允许我们理解物质——洛克会称之为“广延的固体实体”——在物质的各部分彼此不接触时，如何能以引力方式与其他物质相互作用（Downing 1997）[^downing-1997]。所以洛克断定，物体可以通过撞击以外的某种途径彼此发生作用，但他仍然坚持他牢固持有的信念：任何这类作用对我们都是不可理解的。洛克接受了这一结论：空间上分隔的物体依照万有引力定律彼此因果地相互作用；但他也断定，定律本身并未使这种因果相互作用变得可理解。这正是莱布尼茨所哀叹的那类对牛顿万有引力理论的反应；莱布尼茨会论证，凡归于物质物体的作用或能力，都必须满足机械论进路所确立的基本可理解性判准；他还可能倾向于论证，凡被视为支配物体相互作用的定律，也必须满足该判准，即以某种方式可以从我们关于物质的基本概念推导出来（见下文）。无论如何，这是一个极好的例子，说明《原理》中牛顿的理论如何直接影响了十七世纪晚期关于因果性的哲学观点的发展。
