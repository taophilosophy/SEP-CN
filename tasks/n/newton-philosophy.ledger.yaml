      > The Commonwealth of Learning, is not at this time without Master-Builders, whose mighty designs, in advancing the sciences, will leave lasting monuments to the admiration of posterity; but every one must not hope to be a Boyle, or a Sydenham; and in an age that produces such masters, as the great Huygenius, and the incomparable Mr. Newton, with some other of that strain; ’tis ambition enough to be employed as an under-labourer in clearing ground a little, and removing some of the rubbish, that lies in the way to knowledge; which certainly had been very much more advanced in the world, if the endeavors of ingenious and industrious men had not been much cumbred with the learned but frivolous use of uncouth, affected, or unintelligible terms, introduced into the sciences, and there made an art of, to that degree, that philosophy, which is nothing but the true knowledge of things, was thought unfit, or uncapable to be brought into well-bred company, and polite conversation. (Locke 1975: 10)[^locke-1975]
