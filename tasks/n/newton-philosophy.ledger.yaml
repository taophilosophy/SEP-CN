      > For since celestial motions are more regular than if they arose from vortices and observe other laws, so much so that vortices contribute not to the regulation but the disturbance of the motions of planets and comets; and since all phenomena of the heavens and of the sea follow precisely, so far as I am aware, from nothing but gravity acting in accordance with the laws described by me; and since nature is very simple, I have myself concluded that all other causes are to be rejected and that the heavens are to be stripped as far as may be of all matter, lest the motions of planets and comets be hindered or rendered irregular. But if, meanwhile, someone explains gravity along with all its laws by the action of some subtle matter, and shows that the motion of planets and comets will not be disturbed by this matter, I shall be far from objecting. (Newton 2004: 108–9)[^newton-2004]
    step1: TBD
    step2: TBD
  - id: 60
