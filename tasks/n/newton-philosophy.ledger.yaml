      Many legends concerning momentous events in history are apocryphal, but the legend of Halley’s visit to Newton in 1684 is not: it explains what prompted Newton to write his *magnum opus*. In August of 1684, Edmond Halley—for whom the comet is named—came to visit Newton in Cambridge in order to discover his opinion about a subject of much dispute in celestial mechanics. At this time, many in the Royal Society and elsewhere were at work on a cluster of problems that might be described as follows: how can one take Kepler’s Laws, which were then considered among the very best descriptions of the planetary orbits, and understand them in the context of dynamical or causal principles? What kind of cause would lead to planetary orbits of the kind described by Kepler? In particular, Halley asked Newton the following question: what kind of curve would a planet describe in its orbit around the Sun if it were acted upon by an attractive force that was inversely proportional to the square of its distance from the Sun? Newton immediately replied that the curve would be an ellipse (rather than, say, a circle).[^note-17] Halley was amazed that Newton had the answer at the ready. But Newton also said that he had mislaid the paper on which the relevant calculations had been made, so Halley left empty handed (whether there was any such paper is a subject of dispute). But he would not be disappointed for long. In November of that year, Newton sent Halley a nine-page paper, entitled *De Motu* (on motion), that presented the sought-after demonstration, along with several other advances in celestial mechanics. Halley was delighted, and immediately returned to Cambridge for further discussion. It was these events that precipitated the many drafts of *De Motu* that eventually became *Principia mathematica* by 1686. Several aspects of the *Principia* have been central to philosophical discussions since its first publication, including Newton’s novel methodology in the book, his conception of space and time, and his attitude toward the dominant orientation within natural philosophy in his day, the so-called mechanical philosophy, which had important methodological consequences.
    step1: |-
      关于历史上重大事件的许多传说都是虚构的，但 1684 年哈雷拜访牛顿的传说并非虚构：它说明了是什么促使牛顿写出其巨著。1684 年 8 月，埃德蒙·哈雷——那颗彗星即以他命名——来到剑桥拜访牛顿，想了解他对天体力学中一个争议颇多的问题的看法。当时，皇家学会内外有许多人正在研究一组问题，可以这样描述：如何把当时被视为对行星轨道最佳描述之一的开普勒定律，放到动力学或因果原理的语境中加以理解？什么样的原因会导致开普勒所描述的那类行星轨道？哈雷特别向牛顿提出了如下问题：如果一个行星受到一个与它到太阳距离的平方成反比吸引力的作用，它在绕日轨道上会描出什么样的曲线？牛顿当即回答说，曲线会是椭圆（而不是比如说圆）。[^note-17] 哈雷对牛顿有现成答案感到惊讶。但牛顿又说，他把做过相关计算的那篇纸弄丢了，于是哈雷空手而归（是否真有那样一篇纸，学界尚有争议）。不过他不会失望太久。同年 11 月，牛顿寄给哈雷一篇九页的论文，题为 *De Motu*（《论运动》），其中给出了那项众所期待的证明，以及天体力学方面的若干其他进展。哈雷大喜，立刻回到剑桥作进一步讨论。正是这些事件促成了 *De Motu* 的许多稿本，它们到 1686 年最终变成了《自然哲学的数学原理》。自首次出版以来，《原理》的若干方面一直是哲学讨论的核心，包括牛顿在书中的新颖方法论、他的时空构想，以及他对当时自然哲学中主导取向——即所谓机械论哲学——的态度，这一态度带来了重要的方法论后果。
