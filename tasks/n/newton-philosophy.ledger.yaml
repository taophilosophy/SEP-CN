      Newton’s idea of space, then, fulfilled at least two roles. First, it enabled him to avoid the tension between the concept of true motion and the laws of motion of the kind found in Descartes. Second, it also enabled him to articulate what he took to be God’s relation to the natural world. Many regarded his achievements as an important advance over the Cartesian system. However, it would be a mistake to think that Newton vanquished Cartesian ideas within his lifetime: even in England, and certainly on the Continent, Cartesianism remained a powerful philosophical force for several decades after Newton published his primary works.[^note-16] Typically, however, Descartes’s followers emphasized the importance of his ideas about the mechanisms that pervade nature rather than his views of space and time. In that arena, Newton’s views were especially prominent, and came in for significant criticism from Leibniz.
    step1: |-
      于是，牛顿的空间观念至少履行了两项职能。第一，它使他得以避开在笛卡尔那里发现的那种真实运动概念与运动法则之间的张力。第二，它也使他得以阐述他所理解的上帝与自然世界的关系。许多人把他的成就视为对笛卡尔体系的重要推进。然而，若认为牛顿在有生之年就战胜了笛卡尔观念，那就错了：即使在英国，更不用说欧洲大陆，笛卡尔主义在牛顿发表其主要著作之后仍作为强大的哲学力量持续了数十年。[^note-16] 不过，笛卡尔的追随者通常强调的是他关于遍布自然的机制的观念，而非他的时空观。在那个领域，牛顿的观点格外突出，并招致莱布尼茨的重要批评。
    step2: |-
