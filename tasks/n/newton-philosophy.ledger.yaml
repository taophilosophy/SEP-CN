      > The same ought to be said of hardness. So then gravity and hardness must go for unreasonable occult qualities unless they can be explained mechanically. And why may not the same be said of the *vis inertiae* [force of inertia] and the extension, the duration and mobility of bodies, and yet no man ever attempted to explain these qualities mechanically, or took them for miracles or supernatural things or fictions or occult qualities. They are the natural, real, reasonable, manifest qualities of all bodies seated in them by the will of God from the beginning of the creation and perfectly incapable of being explained mechanically, and so may be the hardness of primitive particles of bodies. And therefore if any man should say that bodies attract one another by a power whose cause is unknown to us, or by a power seated in the frame of nature by the will of God, or by a power seated in a substance in which bodies move and float without resistance and which has therefore no *vis inertiae* but acts by other laws than those that are mechanical: I know not why he should be said to introduce miracles and occult qualities and fictions into the world. For Mr. Leibniz himself will scarce say that thinking is mechanical as it must be if to explain it otherwise be to make a miracle, an occult quality, and a fiction. (Newton 2004: 116)[^newton-2004]
    step1: TBD
    step2: TBD
