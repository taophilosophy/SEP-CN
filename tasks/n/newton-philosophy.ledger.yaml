      The history of eighteenth-century philosophy cannot be written without extensive discussion of Newton’s own views and of his influence on the views of other figures both in England and on the Continent. As we have seen, when Newton was a young student at Trinity College, Cambridge, Cartesian views in natural philosophy and much else besides had replaced the ideas and methods of Aristotle and his followers as the most important subject for discussion amongst philosophers. In many ways, Newton eventually succeeded in convincing philosophers that his own ideas and methods were superior to those of the Cartesians—especially when it came to thinking about motion and its causes—but this historical fact did not mean that Newtonianism, even broadly construed, became the dominant trend in natural philosophy during Newton’s lifetime. On the contrary, Newton’s views continued to be the subject of intense scrutiny and debate. As we have seen, this was true amongst Leibniz and his followers (such as Christiaan Wolff) and among fellow mechanists (such as Huygens). Indeed, a late-seventeenth-century debate between Cartesian and Newtonian ideas was supplanted by an early eighteenth century debate between Leibnizian and Newtonian views; the latter debate would continue in one form or another for the rest of the century. But even amongst leading Continental mathematicians, some of Newton’s most basic ideas, for instance concerning the forces of nature, remained the subject of dispute until well into the eighteenth century. To give just one prominent example that influenced the development of philosophy, D’Alembert and Euler, two of the greatest mathematicians of the Enlightenment, had opposite reactions to Newton’s idea that the mass of an object could also be referred to by the “very significant name” of the *vis inertiae*, or force of inertia (Newton 1999, 404—see below for details)[^newton-1999]. These discussions, along with numerous other debates about space, time, motion were a driving force during the French Enlightenment. They remained a powerful stimulant to philosophical theorizing in the 1770s and 1780s, when Kant forged his magisterial “critical” system of philosophy, an approach that almost single-handedly set the philosophical agenda of the early nineteenth century. Hence Newton’s influence on the eighteenth century did not take the form of a single philosophical program or movement; instead, it was the controversial nature of his ideas and methodology that drove much of the philosophical discussion.
    step1: |-
      若不广泛讨论牛顿本人的观点及其对英格兰与欧洲大陆其他人物观点的影响，就无法撰写十八世纪哲学史。如前所见，牛顿在剑桥三一学院求学时，自然哲学及诸多其他领域中的笛卡尔式观点，已取代亚里士多德及其追随者的观念与方法，成为哲学家中讨论的最重要主题。在许多方面，牛顿最终成功使哲学家相信，他自己的观念与方法优于笛卡尔派——尤其是在思考运动及其原因方面——但这一历史事实并不意味着，即便作宽泛理解，牛顿主义在牛顿有生之年成为自然哲学的主导趋势。相反，牛顿的观点继续受到激烈审视与争论。如前所见，这在莱布尼茨及其追随者（如克里斯蒂安·沃尔夫）之间，以及在同道机械论者（如惠更斯）之间都是如此。的确，十七世纪晚期笛卡尔式与牛顿式观念之间的论战，被十八世纪初莱布尼茨式与牛顿式观点之间的论战所取代；后一论战将以这样或那样的形式持续到这个世纪结束。但即便在欧洲大陆一流的数学家中，牛顿的一些最基本观念，例如关于自然之力的观念，也一直是争论的主题，直到十八世纪中叶以后仍如此。只举一个影响哲学发展的著名例子：启蒙运动最伟大的两位数学家达朗贝尔与欧拉，对牛顿的这一想法反应相反——物体的质量也可以用“极有意味的名称” *vis inertiae*（惰性力）来指称（Newton 1999, 404——详见下文）[^newton-1999]。这些讨论，连同关于空间、时间、运动的许多其他论战，是法国启蒙运动的一股推动力。在 1770 与 1780 年代，它们仍是哲学理论化的强大刺激；正是在那时，康德锻造出其宏大的“批判”哲学体系，这一进路几乎单凭一己之力设定了十九世纪初的哲学议程。因此，牛顿对十八世纪的影响并未采取单一哲学纲领或运动的形式；相反，正是他观念与方法论中的争议性推动了大部分哲学讨论。
    step2: |-
      要写十八世纪哲学史，就不能不充分讨论牛顿本人的观点，以及他对英格兰与欧陆其他人物观点的影响。如前所见，牛顿在剑桥三一学院读书时，自然哲学以及许多别的领域里的笛卡尔式观点，已取代亚里士多德及其追随者的观念与方法，成为哲学家讨论的头等题目。从许多方面看，牛顿最终使哲学家们相信，他的观念与方法优于笛卡尔派——在思考运动及其原因时尤其如此；但这一史实并不意味着，即便作宽泛理解，牛顿主义在牛顿生前已成为自然哲学的主流。恰恰相反，牛顿的观点一直受到严密的审视与激烈的争论——如前所见，莱布尼茨及其追随者（如克里斯蒂安·沃尔夫）如此，同道的机械论者（如惠更斯）亦如此。十七世纪晚期笛卡尔派与牛顿派的论战，到十八世纪初已被莱布尼茨派与牛顿派的论战取代；后者又以种种形式延续了整整一个世纪。即便在欧陆一流数学家中间，牛顿的一些最基本观念（比如关于自然之力的观念）也争论不休，直到十八世纪中叶以后仍未平息。只举一个影响过哲学发展的著名例子：启蒙运动最伟大的两位数学家达朗贝尔和欧拉，对牛顿的同一想法反应截然相反——牛顿认为，物体的质量也可以用“极有意味的名称”即 *vis inertiae*（惰性力）来指称（Newton 1999, 404——详见下文）[^newton-1999]。这类讨论，连同关于空间、时间、运动的众多论战，共同推动了法国启蒙运动。到 1770、1780 年代，它们仍是哲学理论化的强劲刺激；康德正是在那时锻造出气象宏大的“批判”哲学体系，而这一进路几乎单枪匹马地设定了十九世纪初的哲学议程。可见，牛顿对十八世纪的影响并不表现为某一哲学纲领或运动；推动大部分哲学讨论的，毋宁是他观念与方法论中的争议性。
