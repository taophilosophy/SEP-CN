      欧拉对 *vis inertiae* 的拒斥，并不是他对牛顿科学的唯一重大反应。是否接受、以及如何解释绝对空间、时间与运动的问题，以及与之相关的、如何构想牛顿自然哲学工作与欧洲大陆兴盛中的莱布尼茨—沃尔夫形而上学之关系的问题，在十八世纪中期继续推动着讨论。夏特莱出版《物理学基础》仅几年后，欧拉在一篇题为《关于空间与时间的思考》的短文中对这两个问题提出了新颖进路；该文 1748 年首次发表于《柏林科学院论文集》。柏林科学院自 1740 年以来一直目睹沃尔夫派与牛顿派之间的激烈争论（这场争论约持续到 1759 年），欧拉在其中扮演了一定角色。人们可以把英国哲学家——尤其是贝克莱与休谟——视为在论证：哲学原则与承诺在驱动人们对力、运动、空间与时间概念的解释时具有某种优先性；而欧拉则论证，自然哲学——具体说，力学——应具有优先性。其论文著名的首句表明了理由：他主张，力学的原则——例如惯性原则——已确立得如此牢固，怀疑它们便是愚蠢（Euler 1748: 324）[^euler-1748]。特别是，若一个人的形而上学承诺与几何学、力学中的空间与运动概念相抵触，他就必须相应调整那些承诺。欧拉随后提出一个巧妙的论证：惯性定律把直线运动挑出为一种特殊的运动，因此要把它应用于自然界中的物体，直线观念就必须有清楚的含义。但若空间仅仅是物质物体之间关系的秩序，那么我们用来判断哪种运动是直线的任何参照物体集合本身也可能在运动。因此，要使用直线运动的观念，我们就需要绝对空间的概念（见 DiSalle 2006, 36–37）[^disalle-2006]。
    step2: |-
      欧拉拒斥 *vis inertiae*，但这并非他对牛顿科学的唯一重要反应。是否接受绝对空间、时间与运动，又该如何解释它们；与此相关，牛顿的自然哲学工作与欧陆方兴未艾的莱布尼茨—沃尔夫形而上学是何关系——这些问题在十八世纪中叶仍主导着讨论。夏特莱的《物理学基础》问世仅数年，欧拉便在一篇短文《关于空间与时间的思考》中，对这两个问题提出了新解；该文 1748 年首刊于《柏林科学院论文集》。自 1740 年起，柏林科学院内沃尔夫派与牛顿派争论不断，声势浩大（约至 1759 年方止），欧拉亦参与其中。可以说，英国哲学家——尤其贝克莱和休谟——主张：在解释力、运动、空间、时间诸概念时，哲学原则与承诺具有某种优先地位；欧拉则主张，自然哲学（具体说是力学）才应居先。文章开篇的名句道出了理由：他主张，力学原理——比如惯性原理——确立得如此牢靠，怀疑它们纯属愚妄（Euler 1748: 324）[^euler-1748]。具体说，若某人的形而上学承诺与几何、力学中的空间和运动概念相冲突，他就必须调整这些承诺。欧拉接着提出一个巧妙的论证：惯性定律把直线运动挑出来作为特殊的一类运动；要用它说明自然界的物体，就必须先让“直线”这一概念有清楚的含义。可若空间仅是物质物体之间关系的秩序，我们用来判定何者作直线运动的任何参照物系，本身也可能在运动。所以，要运用直线运动这一观念，就得有绝对空间的概念（见 DiSalle 2006, 36–37）[^disalle-2006]。
