      When Newton wrote the *Principia* between 1684 and 1686, he was not contributing to a preexisting field of study called mathematical physics; he was attempting to show how philosophers could employ various mathematical and experimental methods in order to reach conclusions about nature, especially about the motions of material bodies (Janiak 2015, Chapter One)[^janiak-2015]. In his lectures presented as the Lucasian Professor at Cambridge, Newton had been arguing since at least 1670 that natural philosophers ought to employ geometrical methods in order to understand various phenomena in nature.[^note-18] The *Principia* represented his attempt to reorient natural philosophy, taking it in a direction that neither his Aristotelian predecessors, nor his Cartesian contemporaries, had envisioned. He did not immediately convince many of them of the benefits of his approach. Just as his first publication in optics in 1672 sparked an intense debate about the proper methods for investigating the nature of light—and much else besides—his *Principia* sparked an even longer lasting discussion about the methodology that philosophers should adopt when studying the natural world. This discussion began immediately with the publication of the *Principia*, despite the fact that its first edition contained few explicit methodological remarks (Smith 2002: 138–39)[^smith-2002]. It intensified considerably with the publication of its second edition in 1713, which contained many more remarks about methodology, including many attempts at defending the Newtonian method. Indeed, many of Newton’s alterations in that edition changed the presentation of his methods. Discussions of methodology would eventually involve nearly all of the leading philosophers in England and on the Continent during Newton’s lifetime.
    step1: |-
      当牛顿在 1684 至 1686 年间写作《原理》时，他并不是在为一个名为数学物理学的既有研究领域作贡献；他是在试图表明，哲学家可以如何运用各种数学与实验方法，就自然——尤其是物质物体的运动——得出结论（Janiak 2015, 第一章）[^janiak-2015]。在作为剑桥卢卡斯教席教授所开的讲座中，牛顿至少从 1670 年起就一直主张：自然哲学家应当运用几何学方法，以理解自然中的各种现象。[^note-18] 《原理》体现了他重新定向自然哲学的尝试，把它引向一个既非其亚里士多德派前辈、也非其笛卡尔派同侪所曾设想的方向。他并未立刻使其中许多人相信其进路的益处。正如他 1672 年关于光学的首次发表引发了一场关于探究光之本性的正当方法（以及其他许多问题）的激烈论战，他的《原理》也引发了一场更为持久的讨论，关乎哲学家在研究自然世界时应当采用何种方法论。这场讨论随《原理》的出版即刻开始，尽管其第一版几乎不含明确的方法论评述（Smith 2002: 138–39）[^smith-2002]。到 1713 年第二版出版时，讨论大为加剧，因为第二版包含更多关于方法论的评述，其中许多是为牛顿式方法所作的辩护尝试。的确，牛顿在该版中的许多改动改变了其方法的呈现方式。方法论讨论最终几乎牵涉了牛顿在世期间英国与欧洲大陆的所有首要哲学家。
    step2: |-
      牛顿 1684 至 1686 年间撰写《原理》时，并不是在为“数学物理学”这样一个既有的研究领域添砖加瓦；他要表明的是：哲学家怎样动用各种数学与实验方法，对自然、尤其对物质物体的运动得出结论（Janiak 2015, 第一章）[^janiak-2015]。至少在 1670 年起，牛顿在剑桥卢卡斯教席的讲座中就一直在说：自然哲学家应当用几何学方法来理解自然中的种种现象。[^note-18] 《原理》正是他重新给自然哲学定向的尝试，要把这门学问引向一个亚里士多德派前辈与笛卡尔派同辈都未曾设想的方向。他并没有立刻让多少同行信服其进路的好处。他 1672 年关于光学的头一次发表，就曾掀起一场关于探究光之本性该用什么方法的激烈论战（还牵动了许多别的议题）；《原理》引发的争论则更为持久，争的是哲学家研究自然世界时应当采用何种方法论。这场讨论随《原理》初版即刻展开，尽管初版几乎没有明确的方法论议论（Smith 2002: 138–39）[^smith-2002]。待到 1713 年第二版问世，讨论陡然加剧：那一版添了许多方法论评述，其中不少是为牛顿式方法作辩护的尝试。诚然，牛顿在该版中的诸多改动，改变了他呈现方法的方式。方法论之争最终几乎把牛顿在世时英国与大陆的头等哲学家都卷了进来。
