      Newton’s line of argument quoted above became one of the centerpieces of the debate that his paper generated. In some parts of his paper, when Newton wrote of the “rays” of light, he had evidently intended to remain neutral on the question of whether the rays are particles or waves (this is reminiscent of the ancient Greek practice of avoiding physical discussions of visual rays). But then towards the paper’s end, Newton added his new line of argument, which employed some philosophical analysis together with some experimental evidence to support the conclusion that rays of light cannot be waves after all. Newton’s critics pounced. This led to the first problem he encountered in response to his paper: what he calls his “theory” of light and colors was not merely rejected, but rather immediately misunderstood, at least from his own perspective. Just days after Newton’s paper was read at the Royal Society, Robert Hooke responded with a detailed letter to Oldenburg. In the first few sentences, Hooke indicates that from his point of view, Newton’s “Hypothesis of saving the phenomena of colours” essentially involves the contention that rays of light are particulate, rather than wavelike.[^note-8] Hooke argues, in contrast, that light “is nothing but a pulse or motion propagated through an homogeneous, uniform and transparent medium;” that is, he argues that light is indeed wavelike. He makes it perfectly clear, moreover, that his hypothesis—the name did not carry a negative connotation in his work—can save the phenomena of colors just as well as Newton’s, which is to say, his hypothesis is compatible with the experimental evidence Newton had gathered. Evidently, the line of argument in the passage quoted above caught Hooke’s eye. Among philosophers, he was not alone. In a letter to Huygens explaining Newton’s theory of light, Leibniz writes that Newton takes light to be a “body” propelled from the sun to the earth which, according to Leibniz, Newton takes to explain both the differential refrangibility of rays of light and the phenomena of colors.[^note-9] Since Newton had employed the concepts of substance, quality and sensible quality when concluding in his paper that light is (presumably) particulate, we are apt to regard the paper as contributing to important discussions within philosophy. After the extensive correspondence, and controversy, generated in response to Newton’s early optical views and experiments, he often threatened to avoid engaging in mathematical and philosophical disputes altogether. He insisted to friends and colleagues that he found intellectual controversy unbearable. But he never followed through with his threat to disengage from discussions in natural philosophy, sending many important letters throughout his long intellectual career.
    step1: |-
      上面引述的牛顿这条论证路线，成了他那篇论文所引发论战的中心议题之一。在论文的某些部分，牛顿写到光的“射线”时，显然有意在射线究竟是粒子还是波这个问题上保持中立（这令人想起古希腊人避免对视觉光线作物理讨论的做法）。但到了论文末尾，牛顿补入了他的新论证路线，这条路线借助一些哲学分析以及一些实验证据，来支持“光线终究不可能是波”这一结论。牛顿的批评者们立刻扑了上来。这引出了他因这篇论文而遭遇的第一个问题：他所谓的关于光与颜色的“理论”不仅被拒绝，而且立即被误解——至少从他的角度看是如此。牛顿的论文在皇家学会宣读后仅仅几天，罗伯特·胡克就写了一封详细的信给奥尔登伯格作答。在开头几句里，胡克表明：在他看来，牛顿那套“拯救颜色现象的假设”实质上主张光线是粒子性的，而非波状的。[^note-8] 胡克则论证说，光“不过是借一种同质、均匀而透明的介质传播的脉冲或运动”；也就是说，他主张光确实是波状的。而且他讲得很清楚：他的假设——这个名称在他的工作中并无贬义——能够像牛顿的假设一样好地拯救颜色现象，也就是说，他的假设与牛顿所收集的实验证据相容。显然，上述引文中的论证路线引起了胡克的注意。在哲学家中，他并非孤例。在给惠更斯解释牛顿光说的一封信中，莱布尼茨写道：牛顿把光视为一种从太阳被推送到地球的“物体”，而据莱布尼茨说，牛顿认为这既能解释光线在折射程度上的差异，也能解释颜色现象。[^note-9] 既然牛顿在论文中得出“光（大概）是粒子性的”这一结论时动用了实体、性质与可感性质等概念，我们便容易把这篇论文看作对哲学内部重要讨论的贡献。在回应牛顿早期光学观点与实验所产生的大量通信与论战之后，他常常威胁说干脆不再参与数学和哲学的争论。他向朋友与同行坚称，他觉得智识论争难以忍受。但他从未真正兑现脱离自然哲学讨论的威胁，在其漫长的智识生涯中寄出了许多重要的书信。
    step2: |-
      上文引的那条论证，成了这篇论文所掀论战的台柱之一。在论文某些段落里，牛顿提到光的“射线”时，显然有意在“射线是粒子还是波”这一问题上不置可否（这让人想起古希腊人回避对视觉光线作物理讨论的旧习）。可到了文末，牛顿又添上他的新论证：借几分哲学分析、几分实验证据，撑起“光线归根到底不可能是波”的结论。批评者立刻扑了上来。于是他因为这篇论文碰上了头一桩麻烦：他所谓的关于光与颜色的“理论”，不仅遭到拒斥，而且当即被误解——至少在他自己看来如此。牛顿的论文在皇家学会宣读不过数日，罗伯特·胡克便写了一封长信给奥尔登伯格。开篇几句，胡克就表明：依他之见，牛顿那套“拯救颜色现象的假设”，实质上就是主张光线为微粒而非波状。[^note-8] 胡克反过来说，光“不过是借一种同质、均匀且透明的介质传播的脉冲或运动”，也就是坚持光是波状的。他还讲得极明白：他的假设——此名在其著作中并无贬义——照样能拯救颜色现象，不输于牛顿的假设，换言之，与牛顿所收集的实验证据同样相容。可见上文那段论证，确实引起了胡克的注意。哲学家中，他并非孤例。莱布尼茨在给惠更斯解说牛顿光说的信里写道：牛顿把光看成一种自太阳推送至地球的“物体”，而据莱布尼茨的理解，牛顿用它同时解释光线折射程度的差异与颜色现象。[^note-9] 牛顿既是在动用实体、性质、可感性质这些概念之后才断定光（大概）为微粒的，我们自然容易把这篇文章看作对哲学内部重要讨论的一份贡献。牛顿早期光学观点与实验招来的大量通信与论战之后，他时常扬言要彻底退出数学与哲学的争端，向朋友同行坚称智识论争令他难以忍受；然而他从未真正兑现脱离自然哲学讨论的威胁，漫长一生中照旧寄出许多重要书信。
