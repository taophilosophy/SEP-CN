      Newton seems here to be arguing as follows: since rays of light have colors as basic features, we should regard these colors as qualities or properties of the rays (despite the fact that these properties are imperceptible under any ordinary circumstance); but doing so requires us to think of the rays as bearers of qualities, which is to say, as substances in their own right. And if rays of light are substances, this means that we cannot also think of them as qualities or properties of anything else. This last point follows from a widely accepted notion of a substance at the time, one easily found in Descartes[^note-7], viz., that substances are those items that can exist independently of other items (whether they can exist independently even of God is a further question that we can ignore here). And if we cannot think of rays of light as properties or qualities, then they are not waves, for waves are features of some medium—think of waves on the surface of a lake. Newton concludes: light is a stream of particles (he does use the word ‘perhaps’ to hedge a bit here). Clearly, philosophical argumentation is a significant aspect of Newton’s reasoning in this paper, as are various philosophical concepts. It is intriguing to ponder the question, what overall conception of “sensible qualities” does Newton presuppose in this piece? If a ray of sunlight passes through my window, the fact that it appears white to me does not undermine Newton’s view (or so he thinks) that the ray actually contains a series of colors as its “qualities”. Are these qualities “sensible” if their presence can be detected only through the use of one or more prisms but never through the inspection of the sunlight through ordinary means (unaided perception, glasses, a magnifying glass, etc.)? These are apt to strike us as canonical philosophical problems.
    step1: |-
      牛顿在这里似乎是这样论证的：既然光线以颜色为基本特征，我们就应当把这些颜色视为光线的性质或属性（尽管这些属性在任何寻常情形下都不可感知）；但这样做就要求我们把光线设想为性质的承载者，也就是说，把它们设想为本身自成一类的实体。而如果光线是实体，这就意味着我们不能同时把它们设想为任何别的东西的性质或属性。最后这一点源自当时广为接受的一种实体观念，在笛卡尔那里很容易找到[^note-7]，即：实体是那些可以独立于其他东西而存在的东西（它们能否甚至独立于上帝而存在，是另一个我们可以在此忽略的问题）。而如果我们不能把光线设想为属性或性质，那么它们就不是波，因为波是某种介质的特征——想想湖面上的波浪。牛顿的结论是：光是粒子流（他在这里确实用了“或许”一词稍作保留）。显然，哲学论证是牛顿这篇论文推理的一个重要方面，各种哲学概念亦然。一个引人深思的问题是：牛顿在这篇文字中预设了怎样一种关于“可感性质”的总观念？如果一束阳光穿过我的窗户，它在我看来呈白色，这并不削弱牛顿的观点（至少他这么认为）：这束光实际上把一系列颜色作为其“性质”包含在内。如果这些性质的存在只能借一个或多个棱镜才能探测到，而永远无法通过寻常手段（不借助仪器的知觉、眼镜、放大镜等）检视阳光而探得，它们还算“可感”的吗？这些问题很容易被我们视为典型的哲学问题。
    step2: |-
      牛顿在这里的论证似乎是这样的：光线既以颜色为基本特征，这些颜色就该看作光线的性质或属性（尽管在任何寻常情形下都感知不到）；可这样一来，就得把光线想成性质的承载者，也就是自成一类的实体。而光线若是实体，便不能同时又看作别的东西的性质或属性。末一点出自当时通行的实体观——在笛卡尔那里俯拾即是[^note-7]：实体者，能够脱离其他东西而独立存在者也（至于能否连上帝也脱离，那是另一个问题，此处不谈）。反过来说，光线既然不能看作属性或性质，那它就不是波——波是某种介质的形态，湖面的波浪可为譬。牛顿由此断定：光是粒子流（此处他确实用了“或许”二字，稍作保留）。可见，哲学论证是这篇论文推理的一大关节，各种哲学概念亦然。值得琢磨的是：牛顿在文中预设的“可感性质”总观念究竟是什么？一束阳光穿过我的窗户，在我看来呈白色，这并不动摇牛顿的看法（他自以为如此）：光实际上把一系列颜色作为其“性质”含在里面。可是，若这些性质只能借一面或多面棱镜探得，永远无法凭寻常手段（肉眼、眼镜、放大镜等）观察阳光而检出，它们还算“可感”吗？这类问题，很容易被我们视为典型的哲学难题。
