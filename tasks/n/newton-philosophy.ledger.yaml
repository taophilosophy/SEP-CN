      与许多在伽利略与笛卡尔之后工作的哲学家一样，牛顿似乎从未广泛分析过亚里士多德关于自然的观念。他在三一学院的课程中会接触到这类观念，但没有多少证据表明他认真对待过它们。相反，他把注意力集中在那些被鼓励在标准课程之外阅读的“现代”思想家身上。[^note-10] 而在牛顿时代的英国，最伟大的现代自然哲学家被认为是笛卡尔（Heilbron 1982: 30）[^heilbron-1982]。有大量证据表明，牛顿非常认真地对待笛卡尔的观念，耗费了相当大的精力去思考它们，并最终转而批评它们。其中一些证据来自一部手稿，它由科学史大家玛丽·博阿斯·霍尔与 A. 鲁珀特·霍尔于 1962 年首次誊录并出版。这部无题手稿如今按其首行被称为“*De Gravitatione*”（《论重力》），过去五十年间被广泛讨论，因为它表明牛顿对笛卡尔在形而上学与自然哲学中的观念兴趣之深。尽管它对当代关于牛顿与笛卡尔主义关系的理解（以及许多其他方面）颇为重要，*De Gravitatione* 并非没有问题。首先且最重要的是，该手稿没有标注日期，学界对其确切来历也没有共识。[^note-11] 其次，手稿从未完成，因此难以评估它与牛顿成熟哲学思想的关系。最后，手稿在牛顿生前未曾出版，因此它是否代表牛顿深思熟虑的观点也存在疑问。尽管如此，这部文本包含一个关于笛卡尔观念的论证宝库。例如，它驱散了一种容易形成的印象，即牛顿在《原理》中想要推翻的是莱布尼茨式的时空构想——如他的辩护者塞缪尔·克拉克多年后在 1715–16 年通信中试图做的那样（见下文讨论）。诚然，莱布尼茨最终表达了后来成为早期近代标准表述的时空“关系主义”——大致是说，空间不过是物理对象之间关系秩序，时间不外乎涉及那些对象的事件的接续——而且牛顿与克拉克对这种观点高度怀疑；但通过后来与莱布尼茨派论战这副透镜来读《原理》，则会产生误导。牛顿在 *De Gravitatione* 中为驳斥笛卡尔的时空构想而作的大量尝试表明，《附释》应当被读作对笛卡尔构想的替代。[^note-12] 也就是说，当牛顿写下他那段关于时空“绝对主义”的著名表述时，他心目中的对手主要是笛卡尔派，而非莱布尼茨派。与关于牛顿方法以及他对笛卡尔、波义耳这类机械论哲学家所立规范的明显偏离的问题不同，牛顿的时空构想连同他的神圣存在观，并未立即引发一场哲学论战。最终成功挑起一场以“牛顿式”空间、时间与神圣构想为核心的哲学论战的，是莱布尼茨，而非任何其他哲学家（见下文）。但莱布尼茨的哲学观点在牛顿初次形成自己构想时还相对无人知晓——对写作《原理》的年轻牛顿而言，莱布尼茨只是又一位数学家，还不是自然哲学的参与者。相反，他在青年时代反复思索并最终拒斥的，是笛卡尔关于空间、世界与上帝的观点。
