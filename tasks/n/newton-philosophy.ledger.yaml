      显然，莱布尼茨反对牛顿派的论证，凸显出他与克拉克对充足理由律的解释有一根本差异：莱布尼茨持有我们可以称为“理性主义”的观点，即一切意欲、一切选择都必须因理由而发生——连神圣存在者也不能豁免这一要求；克拉克则持有我们可以称为“意志主义”的观点，即意欲或选择本身无需因任何理由而发生，因为它本身就是某些事态成立或事件发生的充分理由。在莱布尼茨看来，这使意志（包括神圣意志）变得不透明或不可理解：若一个施动者可以在没有任何理由的情况下行动或作出选择，那么它显然不是理性的；而若充足理由律对世界有什么要求，那便是世界须对我们理性上可理解。这一要求也必须适用于施动者及其意志。但在克拉克看来，这一要求过于严苛，在神圣情形中尤其如此：若我们主张连上帝也必须为选择创造某一事态而非另一事态（比如说，选择分开红海而非密西西比河）而有理由，那我们就是（*ipso facto*）在限制上帝的自由。上帝当然有自由选择去做任何事，或至少去做任何不包含或实例化矛盾的事；就莱布尼茨而言，他也同意矛盾律并不蕴涵充足理由律——后者是另一条独立的原则，形而上学与自然哲学要超出只需矛盾律的数学，就必须依靠它（Clarke and Leibniz 1717: L 2: 1）[^clarke-1717]。但他认为，克拉克的观点留给我们的是一位——以及普通的施动者——可以毫无理由地任意行动的上帝。这不是哲学所寻求的那种自由；哲学希望看到施动者从事理性行动。在二人对充足理由律的不同解释、以及相应不同的自由与理性构想中，莱布尼茨与克拉克的论战触及了底层。
