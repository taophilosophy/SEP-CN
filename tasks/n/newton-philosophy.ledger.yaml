      牛顿论证的第一个方面是指出：机械解释在研究自然现象时，必须以援引某些类型的性质为前提，因此这些性质本身并不服从机械解释。例如，既然机械论解释——比如关于磁石隔着桌面吸引铁屑之方式的解释——必须援引被解释物体的广延之类的性质，那么我们就无法对广延本身给出机械论解释。当然，莱布尼茨或许会回答说，我们无须对机械解释中出现的基本性质作出任何解释，因为这些属性正是“近代人”所挑选的，恰恰因为它们本身完全可理解——或许不同于归于“经院派”自然现象解释的各种性质。牛顿论证的第二个方面更耐人寻味——它也回溯到洛克与斯蒂林弗利特的讨论，因为洛克曾主张，上帝可能不仅把引力、也把思维的能力附加给了物质物体，他把两者联系起来，是因为他相信，用他所掌握的任何哲学手段都无法使二者变得可理解。也就是说，在洛克看来，我们知道人类——人类是，或至少包含，具有大小、形状、运动与坚实性、且其各部分也具有这些性质的物质物体——能够思维；但既然我们无法看出任何物质之物怎么可能具有这种能力，我们便断定，上帝可能把这一特征附加给了我们，或附加给了我们的身体。思维与引力在一种意义上是不可类比的：我们无须牛顿那样的理论就能确信人类能思维；但除此之外，二者是可类比的。于是牛顿试图作出如下论证：既然莱布尼茨不得不承认思维不是一个机械过程，也不能以机械方式解释，他就必须承认世界上至少有一个方面具有以下两个特征：（1）它不是机械的；（2）显然不能仅因这一点就被拒斥。他试图把引力（按他的理解）比作思维（按他认为莱布尼茨不得不作的理解），论证说：尽管引力不是机械的——无法以机械方式解释——也不应因此就拒斥它。这一论证或许以下述观点为前提：进行思维的是人类、物质之物，或至少是部分物质的东西，而不是心智或灵魂之类非物质的东西；因为若把一切思维都归于非物质的心智或灵魂，那就没有压力要说自然中的任何事物——或许甚至自然中任何事物的任何方面——具有无法以机械方式阐明的特征。若接受洛克的观点（牛顿显然也认可），即我们应把思维归于物质之物，或物质之物的诸方面，那么牛顿或许已成功地追随洛克，把引力比作思维，从而为终究非机械的自然诸方面腾出空间。这一棘手问题将继续在英格兰与欧洲大陆上牛顿和莱布尼茨各自的众多追随者之间引发争论。
