      莱布尼茨的论证一开始就很巧妙：他绕开了那个棘手问题——牛顿的绝对空间观念是否使他承诺把空间当作实体（顺带说，这一观点牛顿在《论引力》中明确考虑过并加以拒斥）（Newton 2004: 21–2）[^newton-2004]——只预设牛顿认为空间独立于物体及其关系而存在。若空间确实以这种方式独立存在，那么上帝似乎面临一个选择：在创造世界或物质时，为什么（例如）把地球置于空间的某一特定部分，而不是任何其他部分？空间各部分独立于一切对象与一切关系，显然在任何方面彼此都无差别，因此看来人们甚至无法在理论上设计出一个理由，说明为何要把地球置于某处而非别处。（顺带说，这一论证并不依赖于我们具有指称虚空之中位置的能力。）但既然空间连同其一切位置独立于地球及其他一切而存在，那么上帝就必定确有某种理由把地球置于一处而非另一处——对莱布尼茨来说，甚至神圣意志若不依任何理由（可以说）朝一个方向而非另一方向运动，也是惰性的。最后，莱布尼茨论证，他本人通过主张空间不过是世界中的对象及其一切可能关系之上之外的空无，从而避开了这个问题（因此用更现代的术语说，他持有一种模态关系论的看法）。按这种观点，上帝不面临任何成问题的选择，因为空间并不先于世界或物质对象的创造而存在：创造具有空间关系的对象，就是（*ipso facto*）创造空间本身，因为空间不过是对象及其关系，别无其他。若你愿意，对莱布尼茨来说，空间恰恰就是同时从概念上把握一切对象及其一切可能关系的方式。时间同样如此，它是把握构成历史的整个事件序列的方式。克拉克的答复令人有些失望：他干脆否认神圣意志必须有理由把（比如说）地球置于一处而非另一处，以此堵住莱布尼茨的推论（Clarke and Leibniz 1717: C 3: 5）[^clarke-1717]。按克拉克对充足理由律的解释，此例并不违反该原则，因为它只要求：若地球出现在一处而非另一处，就必须有它出现在那里的理由，而此例中的理由正是神圣意志；至于神圣存在者为何作出这一特定选择而非别的选择，并无进一步的问题。在上引文中，莱布尼茨说牛顿派认可“空间的实在性”，而他视之为“虚妄的”。这一评论凸显了莱布尼茨空间与时间构想的另一个重要方面，而当代讨论往往忽略这一点——当代讨论倾向于强调莱布尼茨式的“关系论”以对抗牛顿式的“绝对论”。莱布尼茨的时空观与其形而上学立场的更广泛方面紧密相联：与由部分构成（因而是离散的）、并表现出涉及部分之间内部区分的特征的普通物理对象不同，他认为空间与时间是连续而同质的。像他在与克拉克的通信中那样把单子论搁置一旁，这意味着：对莱布尼茨来说，实在之物是物理对象；空间与时间只是“观念的”或抽象的存在者，其连续性与同质性标示出这一特殊地位。这不仅是说空间与时间不过是存在于我们世界中的事件与对象关系，别无其他；而且是说它们是观念的：它们的存在以某种方式依赖于人类心智。至少莱布尼茨似乎是这样暗示的。他观点的这一方面，对后来（例如康德）关于莱布尼茨—牛顿空间本性之争的构想，将变得至关重要。
