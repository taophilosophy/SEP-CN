      牛顿确实试图澄清他刻画力的方法。如果把“如何理解力——那些在因果互动停止后并不持续的作用”这个问题悬置起来，人们就可以通过把力构想为*量*来取得进展。特别是，既然牛顿的八个定义与三条法则表明力与质量、加速度成正比，而质量——即物质的量，牛顿把这一概念从其笛卡尔式起源（在那里它被理解为物体体积的度量）加以改造——与加速度都是可测量的量，牛顿就给了我们测量力的手段。这对他的方法至关重要。此外，如果把力设想为可测量的量，人们就可以通过思考如何测量它们，来把两种看似不同的力认定为实际上同一种力。例如，在《原理》第三卷中，牛顿在命题五及其附释中著名地论证：维持行星轨道的向心力实际上与重力是同一种力，即导致地球上物体自由下落的那种力。这在当时是一个革命性的观念，而它之所以可能，首先归功于牛顿把力设想为量的方式。这一观念随后把牛顿引向第三卷命题七中更具革命性的观点：一切物体都按其物质的量相互吸引。也就是说，它把他引向万有引力的观念——这一观点以其大胆震动了他在欧洲大陆的许多读者。这有助于统一过去被称为月上与月下现象的两类现象，而这种统一显然对此后的物理学研究至关重要。这一观念之所以可能，靠的是牛顿理解力的抽象方式——他不把力设想为涉及任何特定机制或物理互动类型的东西，而是把力设想为与自然之其他特征成比例的量。
