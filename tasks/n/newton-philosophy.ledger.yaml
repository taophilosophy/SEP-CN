      光学这一领域起源于古希腊时期，欧几里得与托勒密都写过这方面的著作，但他们往往主要聚焦于视觉科学，分析（例如）有时被认为是自眼中挤出、使之能感知远处物体的视觉光线。在早期近代，开普勒与笛卡尔各自为该领域作出了根本性贡献，包括（前者）发现视网膜图像的倒置，以及（后者）对折射的解释。牛顿的工作帮助把光学的焦点从对视觉的分析转向对光的研究。在 1672 年发表于《哲学汇刊》的“关于光与颜色的新理论”中，牛顿展示了一系列实验：让阳光穿过一个或两个棱镜，以探查光的某些基本特征。论文记述了牛顿自称几年前做过的若干实验。但究竟什么才算光的*特征*？十七世纪的许多哲学家，包括胡克与惠更斯，围绕如下问题发展出关于光之基本物理本性的学说：光是粒子流（或“微粒”），还是波？胡克与惠更斯都是波动论者。这个问题显然一直关联到二十世纪波粒二象性的发现。然而，牛顿在棱镜实验中显然想研究的是别的东西，即他所谓的“著名的颜色现象”。牛顿深入描述的各种棱镜实验，指向他所谓的一种“学说”，他以十三个连续编号的命题加以表述。这些命题中包括如下关于光线特征的断言：第一，阳光穿过棱镜后射出的光线呈现各种颜色；第二，这些颜色在“折射程度”上彼此不同，这意味着它们展示并保持各自的折射率，即使再穿过第二个棱镜亦然；第三，这些颜色——或带色的光线——并不是阳光本身的变体，而是阳光“*原本的*与*与生俱来的性质*”；第四，这些事实意味着，尽管普通的阳光在我们的知觉中显得白色乃至无色，它实际上内含众多颜色，可以通过实验揭示出来。这最后一点反过来表明：在牛顿看来，颜色并非物理对象单被感知、甚至单可感知的方面；它们也可以被设想为光之隐藏特征，在任何寻常情形下都无法直接感知（须借助棱镜的物理作用，它们才变得可感知）。
    step2: |-
      光学起源于古希腊：欧几里得、托勒密都写过此领域的著作，不过他们多半专注于视觉科学，分析（比方说）那种时而被认为从眼中射出、使眼得以看见远处物体的视觉光线。进入早期近代，开普勒与笛卡尔各为此领域立下根本功绩：前者发现视网膜图像倒置，后者解释了折射。牛顿的工作则推动光学把焦点从“视觉的分析”转到“对光的研究”。1672 年刊于《哲学汇刊》的“关于光与颜色的新理论”里，牛顿摆出一连串实验：让阳光穿过一两个棱镜，借以探查光的某些基本特征。文中记下的实验，据他自述多在数年前完成。可什么才算光的*特征*？十七世纪众家——胡克、惠更斯在内——围绕一个问题各成其说：光究竟是粒子流（“微粒”），还是波？胡克与惠更斯都持波动说。这个问题显然一路关涉到二十世纪波粒二象性的发现。然而牛顿的棱镜实验所求的显然另有所在，即他所谓的“著名的颜色现象”。他描述得相当深入的各种棱镜实验，指向他所谓的一条“学说”，分作十三个连续编号的命题来陈述。其中关于光线特征的断言有：第一，阳光过棱镜而出的光线呈现多种颜色；第二，这些颜色的“折射程度”各不相同——亦即各自展示并保持一个折射率，哪怕再过第二面棱镜也不变；第三，这些颜色（带色的光线）并非阳光本身的变形，而是它“*原本的*与*与生俱来的性质*”；第四，既然如此，寻常阳光在我们的知觉里虽呈白色乃至无色，实际却内含众多颜色，可由实验揭示。这最后一层又反过来表明：在牛顿看来，颜色并不只是物理对象被感知或可感知的方面；它们还可以被想成光的隐藏特征——在任何寻常情形下都无法直接知觉（须靠棱镜的物理作用才变得可感知）。
