      > I have many demonstrations to confute the fancy of those who take space to be a substance or at least an absolute being. But I shall only use, at present, one demonstration, which the author here gives me occasion to insist upon. I say, then, that if space were an absolute being, something would happen for which it would be impossible that there should be a sufficient reason—which is against my axiom. And I prove it thus: space is something absolutely uniform, and without the things placed in it, one point of space absolutely does not differ in any respect whatsoever from another point of space. Now from this it follows (supposing space to be something in itself, besides the order of bodies among themselves) that it is impossible there should be a reason why God, preserving the same situations of bodies among themselves, should have placed them in space after one certain particular manner and not otherwise—why everything was not placed the quite contrary way, for instance, by changing east into west. But if space is nothing else but this order or relation, and is nothing at all without bodies but the possibility of placing them, then those two states, the one such as it is now, the other supposed to be the quite contrary way, would not at all differ from one another. Their difference therefore is only to be found in our chimerical supposition of the reality of space. (Clarke and Leibniz 1717: L 3: 5)[^clarke-1717]
    step1: |-
      > 我有许多论证可以驳倒那些把空间当作实体、或至少当作绝对存在者的臆想。但此刻我只用一个论证，即作者在此给了我机会坚持的那一个。那么我说：若空间是绝对存在者，就会发生某事，而对此不可能有充足理由——这违反我的公理。我这样证明：空间是绝对均匀的，若不考虑置于其中的事物，空间的一点与另一点在任何方面都绝对没有差别。由此便得出（设空间本身是某种东西，而不仅是物体彼此之间的秩序）：不可能有理由说明，上帝在保持物体彼此相同位置的情况下，为什么以一种特定方式把它们置于空间中而非别的方式——例如，为什么不把一切置于完全相反的方向，把东变成西。但若空间不过是这种秩序或关系，若没有物体便根本不是任何东西，只是安置物体的可能性，那么这两种状态，即现在这样的状态与被设想为完全相反的状态，就根本不会有任何差别。因此二者的差别只能在我们关于空间之实在性的虚妄假设中找到。（Clarke and Leibniz 1717: L 3: 5）[^clarke-1717]
    step2: |-
      > 要驳倒那些把空间当作实体、至少当作绝对存在者的臆想，我另有许多论证。但此刻我只用一个，即作者在此给了我机会坚持的那一个。我说：假使空间是绝对存在者，那便会发生某事，而对此不可能有充足理由——这违我的公理。我这样证明：空间绝对均匀；除去置于其中的事物，空间的一点与另一点在任何方面都绝无差别。由此可知（前提是空间本身自成一物，而非物体彼此之间的秩序）：不可能有什么理由说明，上帝在保持诸物体彼此相对位置不变的情况下，何以偏偏以这种方式而非别的方式把它们置于空间——譬如，何以不把一切置于全然相反的方向，把东换成西。但若空间无非是这种秩序或关系，若无物体便一无所有、只剩安置物体的可能，那么这两种状态——眼下的状态与被设想为全然相反的状态——便毫无差别。所以，二者的差别只能见于我们对空间之实在性的虚妄假设。（Clarke and Leibniz 1717: L 3: 5）[^clarke-1717]
