    step2: |-
      依热力学第二定律，无生命物质世界中的结构差异与倾向差异，终将归于不可逆的熵与无序。可是在生物圈里，我们看到的却是自然种类与物种日趋繁多的趋势。自新柏拉图主义的立场看，后一事实不难解释：只需假定自然种类的永恒形式存在于意识位格之中（这一假定全然不合达尔文），它们便在某种进化式的有机过程中逐渐现身于世界，并受时间与空间限制。前已言之，新柏拉图主义者奉为公理的一条是：凡在此世下方出现者，无不已以范式的方式在可知领域预先成形。
