      ## 8. Influence
    step1: TBD
    step2: TBD
  - id: 40
    kind: body
    source: |-
      It is an undeniable fact, although nowadays rarely acknowledged, that the general outlook and the principal doctrines of the Neoplatonists proved exceedingly influential throughout the entire history of western philosophy. Through Augustine (354–430) in the West and the 4ᵗʰ-century Cappadocian Fathers (Basil, Gregory of Nyssa, Gregory of Nazianzus) in the East as well as the pseudo-epigraphic writings of Dionysius the Areopagite (early 6ᵗʰ century), Neoplatonism profoundly influenced the emergence of mainstream and not so mainstream Christian theology (John Scotus Eriugena, Thomas Aquinas, Duns Scotus, Meister Eckhart). In addition, by way of a pseudo-epigraphical treatise entitled *Theology of Aristotle*, Neoplatonic thought facilitated the integration of ancient philosophy and science into both Islam (especially through Al-Kindi, Al-Farabi and Avicenna [Ibn Sina]) and Judaism (Maimonides).
