      The term “Neoplatonism” refers to a philosophical school of thought that first emerged and flourished in the Greco-Roman world of late antiquity, roughly from the time of the Roman Imperial Crisis to the Arab conquest, i.e., the middle of the 3ʳᵈ to the middle of the 7ᵗʰ century. In consequence of the demise of ancient materialist or corporealist thought such as Epicureanism and Stoicism, Neoplatonism became the dominant philosophical ideology of the period, offering a comprehensive understanding of the universe and the individual human being’s place in it. However, in contrast to labels such as “Stoic”, “Peripatetic” or “Platonic”, the designation “Neoplatonic” is of modern coinage and to some extent a misnomer. Late antique philosophers now counted among “the Neoplatonists” did not think of themselves as engaged in some sort of effort specifically to revive the spirit and the letter of Plato’s dialogues. To be sure, they did call themselves “Platonists” and held Plato’s views, which they understood as a positive system of philosophical doctrine, in higher esteem than the tenets of the pre-Socratics, Aristotle, or any other subsequent thinker. However, and more importantly, their signature project is more accurately described as a grand synthesis of an intellectual heritage that was by then exceedingly rich and profound. In effect, they absorbed, appropriated, and creatively harmonized almost the entire Hellenic tradition of philosophy, religion, and even literature—with the exceptions of Epicureanism, which they roundly rejected, and the thoroughgoing corporealism of the Stoics. The result of this effort was a grandiose and powerfully persuasive system of thought that reflected upon a millennium of intellectual culture and brought the scientific and moral theories of Plato, Aristotle, and the ethics of the Stoics into fruitful dialogue with literature, myth, and religious practice. In virtue of their inherent respect for the writings of many of their predecessors, the Neoplatonists together offered a kind of meta-discourse and reflection on the sum-total of ideas produced over centuries of sustained inquiry into the human condition.
    step1: |-
      “新柏拉图主义”一词指一种哲学学派，它最初兴起并繁盛于晚古时期的希腊—罗马世界，大致从罗马帝国危机时期到阿拉伯征服，即公元 3 世纪中叶至 7 世纪中叶。由于伊壁鸠鲁主义与斯多葛主义等古代唯物主义或物体论思想的衰落，新柏拉图主义成为该时期占主导地位的哲学意识形态，提供对宇宙与个体人在其中位置的全面理解。然而，与“斯多亚派”“逍遥派”或“柏拉图派”等标签不同，“新柏拉图主义的”这一名称是现代铸造的，在某种程度上是误称。如今被算作“新柏拉图主义者”的晚古哲学家，并不认为自己致力于某种专门复兴柏拉图对话之精神与字句的努力。诚然，他们确实自称“柏拉图主义者”，并且把他们理解为一种实证哲学学说体系的柏拉图观点，看得比前苏格拉底派、亚里士多德或任何其他后继思想家的主张更高。然而更重要的是，他们标志性的工作更准确地说是对当时已极其丰富深刻的思想遗产的伟大综合。实际上，他们吸收、挪用并创造性地调和了几乎整个希腊的哲学、宗教乃至文学传统——例外是伊壁鸠鲁主义（他们断然拒斥）与斯多葛派彻底的物体主义。这一努力的结果是一个宏大而极具说服力的思想体系，它反思了千年的智识文化，并使柏拉图、亚里士多德的科学与道德理论以及斯多葛派的伦理学，同文学、神话与宗教实践展开富有成果的对话。由于他们对许多前辈著作抱有内在的敬意，新柏拉图主义者共同提供了一种元话语，反思数百年持续探究人类境况所产生的一切观念之总和。
    step2: |-
      “新柏拉图主义”指晚古时期希腊—罗马世界兴起并繁盛的一个哲学学派，时间大致从罗马帝国危机沿至阿拉伯征服，即公元 3 世纪中叶到 7 世纪中叶。随着伊壁鸠鲁主义、斯多葛主义等古代唯物主义或物体论思想衰落，新柏拉图主义成为该时期占主导的哲学意识形态，就宇宙以及个体人在宇宙中的位置给出整全理解。不过，与“斯多亚派”“逍遥派”“柏拉图派”一类标签不同，“新柏拉图主义的”之名系现代铸造，某种程度上属于误称。今天被归入“新柏拉图主义者”的晚古哲学家，并不认为自己专以复兴柏拉图对话的精神与字句为业。他们固然自称“柏拉图主义者”，也确实把柏拉图观点（在他们看来是一套实证的哲学学说）置于前苏格拉底派、亚里士多德及任何后继思想家之上；但更要紧的是，其标志性事业更宜称为对一份当时已极丰厚的思想遗产的伟大综合。事实上，他们吸收、挪用并创造性调和了几乎整个希腊哲学、宗教乃至文学传统，只有伊壁鸠鲁主义（遭其断然拒斥）与斯多葛派彻底的物体主义除外。由此形成的是一个宏阔而极具说服力的思想体系：它反思千年智识文化，让柏拉图、亚里士多德的科学理论与道德学说以及斯多葛派伦理学，同文学、神话和宗教实践展开富有成果的对话。出于对众多前辈著作的内在敬意，新柏拉图主义者合力提供了一种元话语，反思数百年持续探究人类境况所积累的全部观念。
