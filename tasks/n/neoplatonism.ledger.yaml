      During the Renaissance, ancient Greek learning, and Neoplatonism in particular, experienced a dramatic revival in the West in the wake of the work of Gemistus Plethon (1355–1452), Bessarion (1403–1472) and, above all, Marsilio Ficino (1433–1499), whose translation and interpretation of Plato and Plotinus in the second half of the 15ᵗʰ century influenced not only the philosophy, but also the art and literature of the period. It may even be true to say that even more than the writings of Plato and Aristotle themselves Neoplatonic ideas have continued to influence Western thinkers of the idealist persuasion, such as the Cambridge Platonists (who were really Neoplatonists), Leibniz, Hegel, Schelling, Fichte, Bergson and Teilhard de Chardin, to name but a few.
