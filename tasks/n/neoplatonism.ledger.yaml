      The most vigorous group of Neoplatonists, living in Athens and still adhering to the old rituals, disbanded in the aftermath of Emperor Justinian’s legislation of 529, which resulted in the closing of the Platonist academy. Hellenic philosophy and the teaching of its attendant disciplines went on in Alexandria and Constantinople until the end of the 6ᵗʰ century, but were now being taught by people who had either embraced or otherwise come to terms with the new religion. The Arab conquest in the 7ᵗʰ century obliterated and appropriated in equal measure, but the real revival of Neoplatonism occurred when humanists made the treasures of late antique Greece available to the Renaissance intelligentsia of Italy, France, and Germany.
