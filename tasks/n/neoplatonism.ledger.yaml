    source: |-
      Rightly or wrongly, the Egyptian-born Plotinus (204/5–270) is commonly regarded as the founder of Neoplatonism. He was a pupil of the Alexandrian philosopher Ammonius Saccas (3ⁿᵈ century), who reportedly did not publish anything and remains one of the most enigmatic philosophers of all antiquity. Around 245, at the age of 40, Plotinus moved from Alexandria to Rome and founded a school of philosophy there. At first, his instruction too was entirely oral, until his most talented pupil, Porphyry, persuaded him to commit his seminars to the page. After Plotinus’ death, Porphyry edited and published these writings, having arranged them in a collection of six books consisting of nine essays each (the so-called “Enneads” or “nines”).
    step1: |-
      无论对错，生于埃及的普罗提诺（204/5–270）通常被视为新柏拉图主义的创立者。他是亚历山大里亚哲学家阿摩尼乌斯·萨卡斯（3 世纪）的学生，据说后者未曾发表任何著作，至今仍是整个古代最神秘的哲学家之一。约 245 年，40 岁的普罗提诺从亚历山大里亚迁往罗马，并在那里创办了一所哲学学校。起初，他的讲授也完全是口头的，直到他最出色的学生波菲利说服他把研讨课内容形诸文字。普罗提诺去世后，波菲利编辑并出版了这些著作，把它们编成六卷、每卷九篇的合集（即所谓《九章集》）。
    step2: |-
      普罗提诺（204/5–270）生于埃及，无论功过如何评说，通常被奉为新柏拉图主义的创立者。他师从亚历山大里亚哲学家阿摩尼乌斯·萨卡斯（3 世纪）；据说此人未曾刊布任何著作，至今仍是整个古代最费解的哲学家之一。约 245 年，40 岁的普罗提诺迁居罗马，创办哲学学校。最初他的讲授同样全凭口说，后经其最富才华的学生波菲利劝说，才把研讨内容笔之于书。普罗提诺身后，波菲利将这些文字编辑出版，编为六卷、每卷九篇（即所谓《九章集》，“九篇”之意）。
  - id: 7
    kind: body
    source: |-
      By any standard of intellectual prowess, Plotinus is one of the intellectual giants of antiquity, on a par with the likes of Plato, Aristotle, and Chrysippus, even if modernity is still hesitant to accord him such an exalted status. As in the case of his preeminent precursors, Plotinus’ philosophical system combines innovation with tradition. The question of precisely which predecessors inspired him is still unclear and in need of further investigation. Carefully selected passages from Plato’s dialogues and Aristotle’s *Metaphysics* often serve him as starting points for his own speculations; Stoic ethics is very much in evidence, as are the views of the Peripatetic philosopher Alexander of Aphrodisias (2ⁿᵈ-3ʳᵈ centuries). A general intellectual background is provided by the so-called Middle Platonists, above all Numenius of Apamea (2ⁿᵈ century). Moreover, it is not impossible that Gnosticism (which Plotinus vehemently opposed) as well as the writings circulating under the name of Hermes Trismegistus confirmed or even informed his metaphysical monism. Lastly, Plotinus may have been well aware of the rise of Christianity, but if so, he was not as alarmed by it as his pupil Porphyry.
    step1: |-
      以任何智识才能的标准衡量，普罗提诺都是古代的思想巨人之一，可与柏拉图、亚里士多德、克律西波斯之流比肩，尽管现代性仍不愿给他如此崇高的地位。与其卓越的前辈一样，普罗提诺的哲学体系把创新与传统结合起来。究竟哪些前辈启发了他，迄今仍不清楚，尚需进一步研究。从柏拉图对话与亚里士多德《形而上学》中精心选取的段落，常被他用作自己思辨的出发点；斯多葛派伦理学十分显眼，逍遥派哲学家阿弗洛狄西亚的亚历山大（2–3 世纪）的观点亦然。总体智识背景则由所谓中期柏拉图主义者提供，首先是阿帕梅亚的努梅尼乌斯（2 世纪）。此外，诺斯替主义（普罗提诺激烈反对它）以及以三重伟大的赫尔墨斯之名流传的著作，也并非不可能确认甚至塑造了他的形而上学一元论。最后，普罗提诺或许清楚基督教的兴起，但若果真如此，他并不像其学生波菲利那样为之惊惶。
    step2: |-
      无论以何种智识标准衡量，普罗提诺都堪称古代思想巨人，与柏拉图、亚里士多德、克律西波斯诸人比肩——尽管现代学界仍迟疑于给他这般崇高地位。与那些卓越先驱一样，他的哲学体系兼有创新与传统。究竟哪些前辈启发了他，至今仍不明朗，有待进一步考察。他往往从柏拉图对话与亚里士多德《形而上学》中精选段落，作为自己思辨的起点；斯多葛派伦理学的痕迹十分明显，逍遥派哲学家阿弗洛狄西亚的亚历山大（2—3 世纪）的观点亦然。总体的智识背景由所谓中期柏拉图主义者提供，其中首推阿帕梅亚的努梅尼乌斯（2 世纪）。此外，诺斯替主义（普罗提诺激烈反对之）以及托名三重伟大的赫尔墨斯而流传的著作，也未必没有确认、甚至塑造他的形而上学一元论。最后，普罗提诺或许知晓基督教的兴起；倘若如此，他并不像弟子波菲利那样为之惊惶。
  - id: 8
