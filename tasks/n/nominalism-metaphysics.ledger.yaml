      Perhaps the most influential arguments in defense of nominalism are those premised upon the allegedly non-causal nature of paradigmatic abstract entities like numbers and sets. The *locus classicus* is Benacerraf 1973, which poses an epistemic challenge for anti-nominalist theories: to account for justified beliefs about mathematical entities in the absence of causal interaction between believers and mathematical entities. This challenge stems from the apparently non-causal nature of abstract entities and an allegedly causal dimension of epistemic justification. As Benacerraf remarks, “a typical ‘standard’ account (at least in the case of number theory or set theory) will depict truth conditions in terms of conditions on objects whose nature, as normally conceived, places them beyond the reach of the better understood means of human cognition (e.g., sense perception and the like)” (p. 668). Benacerraf’s initial presentation of the epistemic argument remains influential; however, Field (1980, 1989) offers an alternative formulation and defense of the causal-epistemic argument in support of nominalism. Field’s version of the argument is premised, not upon a causal constraint on justification, but on an allegedly insurmountable problem for anti-nominalists: to explain plausibly the justified mathematical beliefs we take mathematicians and others to possess in the absence of a causal relationship between epistemic agents and mathematical reality. (On causal-epistemic arguments, see Cheyne 1998, Nutting 2020, Liggins 2010, Sjölin Wirling forthcoming.)[^cheyne-1998][^liggins-2010][^nutting-2020]
    step1: TBD
    step2: TBD
  - id: 30
    kind: body
    source: |-
      Causal-epistemic arguments hinge upon whether anti-nominalists can account for our knowledge of abstract entities if such entities are indeed non-causal and therefore not epistemically accessible through ordinary means. Subsequent discussions of anti-nominalist epistemology have sought to provide a credible account of our awareness of abstract entities and our justified beliefs regarding them (see Chudnoff 2012, Bengson 2015, Lewis 1986: 108–115, and Clarke-Doane 2017)[^bengson-2015][^chudnoff-2012][^clarke-doane-2017][^lewis-1986]. As some have noted, a parallel issue arises if we assume causal interaction is necessary for *semantic relations* like reference between speakers and abstract entities like numbers. This parallel causal-semantic version of the above argument against abstract entities is more usually mentioned than defended, however (see Jubien 1977, Lear 1977, and Davies 2019)[^davies-2019][^jubien-1977][^lear-1977].
    step1: TBD
    step2: TBD
  - id: 31
    kind: body
    source: |-
      A different causation-based argument for nominalism relies upon a metaphysical thesis, sometimes called the Eleatic Principle or Alexander’s Dictum, according to which entities must stand in causal relations or be causally active in order to exist (see Oddie 1982 and Colyvan 1998)[^colyvan-1998][^oddie-1982]. Granted this controversial thesis as well as the essentially non-causal nature of abstract entities, nominalism would seem to follow. Versions of anti-nominalism that claim fictional characters, musical works, types, and other apparently created entities are abstract are significantly less likely to grant that abstract entities are essentially non-causal, given the causal character of creation. Anti-nominalist views about these kinds of entities are diverse, however, with some asserting they are abstract yet, unlike mathematical entities, nevertheless able to stand in causal relations (see Caplan and Matheson 2006, Mag Uidhir 2013, and Friedell 2020)[^caplan-2006][^friedell-2020][^mag-2013].
    step1: TBD
    step2: TBD
