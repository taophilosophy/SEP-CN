      ### 4.2 Nominalist Accounts of Qualitative Natures
    step1: TBD
    step2: TBD
  - id: 77
    kind: body
    source: |-
      The preceding section considered how nominalists about abstract entities might develop theories in the absence of ontological commitment to numbers, propositions, fictionalia, and other putative abstracta. As we have noted, nominalists about universals are more specific in their exclusionary thesis: they reject universals, but they may nevertheless accept that there are properties and, on some views, the properties they posit the existence of are also abstract entities—e.g., tropes or sets of individuals. The debate between defenders of universals and competing theorists of qualitative natures is wide-ranging, but in this section we examine those versions of nominalism that reject qualitative natures altogether. As noted in Section One, we take such views to be versions of what we call “strict nominalism.”
    step1: TBD
    step2: TBD
  - id: 78
    kind: body
    source: |-
      Strict nominalists face an especially broad metaphysical challenge. The reason why is clear: what we will call “property discourse” is immensely wide-ranging. For it is intuitive to suppose that every object either qualitatively resembles or varies from every other. Correspondingly, everything seems to be a potential subject of descriptive classification. By contrast, it is certainly *not* intuitive to hold that every object is, say, mathematical, non-actual, fictional, or musical. Thus, while not everything is such that our discourse about it prima facie indicates that there are numbers or (mere) possibilities or creative works, plausibly *everything* is such that our discourse about it indicates that there are qualitative natures.
    step1: TBD
    step2: TBD
  - id: 79
    kind: body
    source: |-
      The key task for the strict nominalist, which will be the focus of this section, is to develop a strategy for explaining property discourse without invoking qualitative natures. The issue at hand concerns not just first-order predicative discourse like “That apple is red”, but also discourse about similarity between objects (“That apple and my house are both red”), explanatory discourse (“I bought the apples because they’re red”), and higher-order discourse about properties themselves (“Red is a color”), which can get increasingly complicated when descriptive designation and gradient similarity are invoked (“The color of Bob’s favorite fruit is more like the color of my most expensive possession than it is like the color of yours”). The challenge of accounting for such discourse has been cited by a variety of pro-qualitative-nature theorists as the basis for assessing the prospects of strict nominalism (see, for example, Jackson 1977, Armstrong 1978, Campbell 1990, and Yi 2018)[^armstrong-1978][^campbell-1990][^jackson-1977].
    step1: TBD
    step2: TBD
  - id: 80
    kind: body
    source: |-
      Of course, the breadth of the challenge does not by itself tell us whether it can be met, and strict nominalists have generated a rich variety of proposals for how to do so. Below we introduce several species of strict nominalism about properties, each of which eschew commitment to qualitative natures, and then briefly note the complexity involved in pairing them with the general nominalist strategies. The objective will be to supply an introductory glimpse of the issues, rather than an exhaustive guide.
    step1: TBD
    step2: TBD
  - id: 81
    kind: body
    source: |-
      Strict nominalisms about properties include *austere*, *class*, *predicate*, *concept*, *resemblance*, *metalinguistic*, *causal*, *mereological*, *reistic*, *second-order*, and *grounding* nominalism. The taxonomy of these positions is complicated, since some occupants of this theoretical space partially overlap and the relevant literature’s terminology is not uniform. The present survey is organized around the guiding question of whether the form of nominalism at hand supplies a stock of entities eligible to populate the extension of predicates like “property”, “feature”, and “attribute” although none of these views accept qualitative natures, understood as sui generis posits required to explain variety and resemblance (e.g. universals, tropes, or constructions therefrom).
    step1: TBD
    step2: TBD
  - id: 82
    kind: body
    source: |-
      We count five strict nominalisms as furnishing candidate members for the extension of “property”, while still eschewing qualitative natures. These are class, mereological, reistic, causal, and grounding nominalisms, respectively.
    step1: TBD
    step2: TBD
  - id: 83
    kind: body
    source: |-
      *Class nominalism* holds that the metaphysical structure of class membership is necessary and sufficient to explain the qualitative status of concrete particular objects, like apples and fire engines. (We assume here that “classes” and “sets” can be used interchangeably.) It says that properties are nothing more than classes of their instances, where “instances” of properties are concrete particular objects, not tropes. For example, the class nominalist holds that there is redness, but that it just is the class of red objects, or—on certain versions of the view—the class of metaphysically possible red objects (see Quinton 1957, Lewis 1983)[^lewis-1983][^quinton-1957].
    step1: TBD
    step2: TBD
  - id: 84
    kind: body
    source: |-
      Other strict nominalisms focus not on classes of ordinary concrete particular objects, but on individual non-ordinary objects. According to *mereological nominalism*, properties are mereological fusions of their instances with “instances” understood as concrete particular objects, rather than tropes. On such a view, redness is the fusion of all (or all metaphysically possible (red)) stop signs, ripe strawberries, Santa suits, etc. (Zemach 1982, Effingham 2020)[^effingham-2020][^zemach-1982]. According to *reistic* *nominalism*, which is based on work by Franz Brentano, qualitative variation is metaphysically governed by spatially overlapping concrete particular objects of a much finer qualitatively classifiable grain than ordinary objects like apples (see Kriegel 2015 and the entry on reism)[^kriegel-2015]. For example, the view distinguishes the-apple-qua-red from the-apple-qua-round, and holds that the existence of the former (but not the latter) explains that the apple is red.
    step1: TBD
    step2: TBD
  - id: 85
    kind: body
    source: |-
      *Causal nominalism* is the thesis that the existence and nature of properties is determined by particular concrete objects’ causal profiles (where causal profiles are not reified in any property realist sense), as opposed to those causal profiles being somehow explained by primitive qualitative natures (Whittle 2009; see also Tugby 2013)[^tugby-2013][^whittle-2009]. Precisely what kind of entity this view takes as the extension of “property” is an interesting question. What is clear is that the identity of an arbitrary property is determined by particular concrete objects’ causal profiles.
    step1: TBD
    step2: TBD
  - id: 86
    kind: body
    source: |-
      *Grounding nominalism* bases the nominalistic project on fundamentality rather than existence, contending that properties are derivative entities grounded in comparatively-more-fundamental concrete particular individuals (see Imaguire 2018 and Schulte 2019)[^imaguire-2018][^schulte-2019]. Whether (and in what ways) the view thereby differs substantially from other forms of strict nominalism is an interesting open question. On one precisification, the relevant grounded entities just are qualitative natures, albeit non-fundamental ones, but other conceptually possible versions identify derivative properties with constructions from concrete particular objects.
    step1: TBD
    step2: TBD
  - id: 87
    kind: body
    source: |-
      Among those versions of strict nominalism that do not posit entities that serve as the extension of “property” and similar predicates are austere, predicate, concept, and metalinguistic nominalisms.
    step1: TBD
    step2: TBD
  - id: 88
    kind: body
    source: |-
      The key idea behind *austere nominalism*—sometimes called ‘ostrich’ nominalism (originally a pejorative jab by Armstrong 1978)[^armstrong-1978]—is that no underlying metaphysical structure is needed in order to explain that individuals are qualitatively classifiable, for example, that a stop sign or an apple is red, or that both are (equally) red (see Quine 1948, Devitt 1980, Van Cleve 1994, Parsons 1999, Imaguire 2014)[^devitt-1980][^imaguire-2014][^parsons-1999][^quine-1948][^van-1994]. In the standard austere case, this is in part because no metaphysical explanation whatsoever of qualitative classification is thought to be needed.
    step1: TBD
    step2: TBD
  - id: 89
    kind: body
    source: |-
      *Predicate* and *concept nominalism* assert that objects warrant qualitative classification just in case—and *because*—certain predicates or concepts, respectively, apply to them, where the relevant application conditions do not invoke any mind-independent entities that might play the role of a “property” (Searle 1969)[^searle-1969]. The chief difference between these two versions of nominalism is that predicates are linguistic while concepts are mental. But both versions are typically taken to treat the metaphysics of properties as a mind-dependent issue, since predicates and concepts are both mind-dependent. (Note: Searle (1969) says that there *are* properties; however, he treats this as equivalent to holding that predicates have meanings.)
    step1: TBD
    step2: TBD
  - id: 90
    kind: body
    source: |-
      *Metalinguistic nominalism* (here following the terminology of Loux 2002)[^loux-2002] says that discourse seeming to refer to properties is best construed metalinguistically, as being about language itself (Carnap 1934, Sellars 1963)[^carnap-1934][^sellars-1963]. Roughly, an utterance of ‘the apple is red’ says not that the apple has some non-linguistic qualitative status, but rather that it (or perhaps the description ‘the apple’) is related in a certain way to the predicate ‘red.’ One useful upshot is an interesting paraphrase scheme for higher-order talk of properties, whereby, for example, ‘red is a color’ becomes a claim about ‘red’ being a color predicate. Predicate nominalism and metalinguistic nominalism overlap in certain ways, and the former can potentially be construed as a species of the latter although versions of these views (e.g. Searle 1969 and Sellars 1963)[^searle-1969][^sellars-1963] differ in significant details.
    step1: TBD
    step2: TBD
  - id: 91
    kind: body
    source: |-
      Resemblance and second-order nominalism are more complicated with respect to whether they provide entities as semantic values of “property.” Resemblance nominalism says that qualitative classification is governed by primitive resemblance facts (even if there is, strictly speaking, no resemblance relation), rather than resemblance being explanatorily dependent on qualitative natures (Rodriguez-Pereyra 2002)[^rodriguez-pereyra-2002]. Thus the view can be developed to allow for entities that fall under the extension of “property”, namely, classes of concrete particular objects that satisfy the relevant resemblance conditions. Alternatively, since the view makes no special theoretical appeal to such classes, it can also be developed to eschew properties and “property” talk entirely.
    step1: TBD
    step2: TBD
  - id: 92
    kind: body
    source: |-
      Finally, second-order nominalism treats predication as its central concern in the metaphysics of properties and examines it through the lens of second-order quantification into predicate position (Jones 2018, Trueman 2020)[^jones-2018][^trueman-2020]. (Note: “is” takes its predicative use in locutions like “*x* is F” throughout this paragraph.) Second-order nominalism says that if some first-order individual *x* is F (for some predicate “F”), then there is something Y, in the second-order sense of “there is”, such that: (i) *x* is Y, and (ii) whenever any first order individual *z* is Y, *z* is F (Jones 2018)[^jones-2018]. The view is a version of strict nominalism insofar as it eschews qualitative natures, but it may be considered a kind of “nominalist realism”, following Jones 2018, depending on how one reads the existential commitments of second-order quantifiers. It may also count as allowing entities eligible to populate the extensions of some “property”-like higher-order predicates. It is a further question whether any such predicate may be more (or less) metaphysically perspicuous than English predicates like “property” and “attribute.”
    step1: TBD
    step2: TBD
  - id: 93
    kind: body
    source: |-
      As the above survey indicates, the emphasis and details of general nominalist strategies and property-specific versions of nominalism can vary substantially. Assessing the relationships between these kinds of views remains an area of significant further study for nominalists. It is tempting, for instance, to view strict nominalist theories which offer extensions for “property” like classes or mereological sums as well-positioned to pursue the “replacement” of discourse apparently about qualitative natures in ontologically leaner terms. Alternatively, more radical versions of strict nominalism, according to which there are no entities within the extension of “property”, may be easier to reconcile with general nominalist strategies on which much of our qualitative discourse is non-literal or figurative in character. We should be careful not to assume that these positions line up so conveniently, however. Quine, for example, was certainly not a fictionalist, figuralist, or non-cognitivist about qualitative predication, despite being the leading austere nominalist (Quine 1980)[^quine-1980]. Among other things, the prospects for any such views will depend on the posited connections and affinities between the theoretical roles claimed for properties and other putative abstracta like propositions. (On unified conceptions of abstracta, see Zalta 1983 and Fine 1977.)[^fine-1977][^zalta-1983]
    step1: TBD
    step2: TBD
  - id: 94
    kind: body
    source: |-
      On the flipside, we should also exercise caution before simply assuming that, say, class or mereological nominalists cannot be or ought not to be, say, fictionalists or figuralists about property discourse. While to our knowledge actual class and mereological nominalists *do* take talk of “properties” literally to be about classes or fusions of objects, one could develop a version of those metaphysical theses that treated classes or fusions, respectively, rather like fictionalists might treat the concrete materials constitutive of tokens of novels or films—the pages and the celluloid. On this imagined view, property discourse is fictional, and the pertinent materials we distinctively interact with in learning and engaging in the fiction are classes (or fusions) of concrete individual objects.
