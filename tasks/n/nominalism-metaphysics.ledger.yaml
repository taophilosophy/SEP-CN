      The abstract-concrete distinction that separates entities and structures the debate over this version of nominalism is often held to be an exclusive and exhaustive distinction that partitions all of reality (see Hale 1988 and Grossman 1992: 7)[^hale-1988]. Mathematical entities like the number seven or the Pythagorean theorem serve as paradigm examples of abstract entities and ordinary objects like tables and tap shoes are paradigm examples of concrete entities. In turn, entities are often assumed to have their abstract or concrete status permanently and necessarily (see Melia 2008a: 146, but cf. Williamson 2010 and Linsky and Zalta 1996)[^linsky-1996][^melia-2008a][^williamson-2010]. Although the concept of an abstract (or concrete) entity can be adopted as a primitive notion, philosophers have more usually sought to provide an analysis of what it is for an entity to be abstract (or concrete). And, given the assumed exclusiveness and exhaustiveness of the distinction, an analysis of either the concept *abstract entity* or *concrete entity* would suffice for defining the complementary concept. (On alleged features of the abstract-concrete distinction, see Cowling 2017: 70–74.)[^cowling-2017]
    step1: |-
      区分实体并支撑这一版唯名论论战的抽象—具体之分，常被视为一个既排斥又穷尽的区分，把全部实在划分开来（见 Hale 1988 与 Grossman 1992: 7）[^hale-1988]。七这个数或毕达哥拉斯定理之类数学实体是抽象实体的范例，桌子与踢踏舞鞋之类普通对象是具体实体的范例。进而，人们常假定实体具有其抽象或具体地位是永久而必然的（见 Melia 2008a: 146，但参 Williamson 2010 与 Linsky and Zalta 1996）[^linsky-1996][^melia-2008a][^williamson-2010]。抽象（或具体）实体概念虽可作为初始概念采用，哲学家却更常设法分析"一实体是抽象的（或具体的）"究竟何意。而鉴于该区分被假定为既排斥又穷尽，分析*抽象实体*或*具体实体*任一概念，便足以界定其互补概念。（关于抽象—具体之分的所谓特征，见 Cowling 2017: 70–74。）[^cowling-2017]
    step2: |-
      区分实体、并支撑这一版唯名论论战的抽象—具体之分，常被视为既排斥又穷尽，把全部实在划分为两半（见 Hale 1988、Grossman 1992: 7）[^hale-1988]。七这个数、毕达哥拉斯定理之类数学实体是抽象实体的范例；桌子、踢踏舞鞋之类普通对象是具体实体的范例。人们还常假定，一实体之抽象或具体身份是永久而必然的（见 Melia 2008a: 146，但参 Williamson 2010、Linsky and Zalta 1996）[^linsky-1996][^melia-2008a][^williamson-2010]。抽象（或具体）实体概念固然可以作为初始概念采用，哲学家却更常设法分析"一实体之为抽象的（或具体的）"究竟是什么意思。既然该区分被假定为既排斥又穷尽，那么分析*抽象实体*或*具体实体*任一概念，便足以界定其互补概念。（关于抽象—具体之分的所谓特征，见 Cowling 2017: 70–74。）[^cowling-2017]
