      Perhaps the most influential arguments in defense of nominalism are those premised upon the allegedly non-causal nature of paradigmatic abstract entities like numbers and sets. The *locus classicus* is Benacerraf 1973, which poses an epistemic challenge for anti-nominalist theories: to account for justified beliefs about mathematical entities in the absence of causal interaction between believers and mathematical entities. This challenge stems from the apparently non-causal nature of abstract entities and an allegedly causal dimension of epistemic justification. As Benacerraf remarks, “a typical ‘standard’ account (at least in the case of number theory or set theory) will depict truth conditions in terms of conditions on objects whose nature, as normally conceived, places them beyond the reach of the better understood means of human cognition (e.g., sense perception and the like)” (p. 668). Benacerraf’s initial presentation of the epistemic argument remains influential; however, Field (1980, 1989) offers an alternative formulation and defense of the causal-epistemic argument in support of nominalism. Field’s version of the argument is premised, not upon a causal constraint on justification, but on an allegedly insurmountable problem for anti-nominalists: to explain plausibly the justified mathematical beliefs we take mathematicians and others to possess in the absence of a causal relationship between epistemic agents and mathematical reality. (On causal-epistemic arguments, see Cheyne 1998, Nutting 2020, Liggins 2010, Sjölin Wirling forthcoming.)[^cheyne-1998][^liggins-2010][^nutting-2020]
    step1: |-
      支持唯名论最有影响的论证，或许是以数、集合之类范例抽象实体据称的非因果本性为前提的那些论证。*经典出处*是 Benacerraf 1973，它对反唯名论理论提出一个认识论挑战：在信仰者与数学实体之间没有因果相互作用的情况下，如何说明关于数学实体的有辩护信念。这一挑战源于抽象实体显然的非因果本性，以及认识论辩护据称的因果维度。正如贝纳塞拉夫所言，"一种典型的'标准'说明（至少在数论或集合论的情形中）会以对象所满足的条件来刻画真值条件，而按通常设想，这些对象的本性使它们处于人类认知较为易懂的手段（如感官知觉之类）所不能及之处"（第 668 页）。贝纳塞拉夫对认识论论证的最初表述至今仍有影响；不过，菲尔德（1980、1989）为支持唯名论提出了因果—认识论论证的另一种表述与辩护。菲尔德版的论证并不以辩护的因果约束为前提，而以反唯名论者一个据称无法逾越的难题为前提：在认识主体与数学实在之间没有因果关系的情况下，如何可信地解释我们认为数学家等人所具有的有辩护的数学信念。（关于因果—认识论论证，见 Cheyne 1998、Nutting 2020、Liggins 2010、Sjölin Wirling 即出。）[^cheyne-1998][^liggins-2010][^nutting-2020]
