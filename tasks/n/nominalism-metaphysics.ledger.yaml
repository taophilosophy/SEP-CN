      Other arguments against abstract entities seek to show that nominalist theories are stronger, better justified, or otherwise more virtuous than anti-nominalist competitors. These arguments are dependent upon the specific content of nominalist and anti-nominalist rivals, but the most familiar arguments are premised upon ontological parsimony—roughly speaking, nominalists believe in fewer entities than anti-nominalists and hold that, other things being equal, we ought to prefer simpler theories to less simple alternatives. This parsimony-driven defense of nominalism assumes that parsimony is a theoretical virtue, which makes belief in certain theories better justified (see Parsons 1976, Nolan 1999, and Bricker 2020)[^bricker-2020][^nolan-1999][^parsons-1976]. For this line of argument to succeed, dispensing with ontological commitment to abstract entities must not require excessive theoretical vices like undue complexity in formulation, additional primitive notions, or other significant theoretical costs. Additionally, as Melia (2008b) notes, the option of dispensing with abstract entities is only one way to secure ontological simplicity. For example, an alternative would be to dispense with concrete entities and develop a Pythagorean metaphysics of exclusively abstract entities. This illustrates how the evaluation of theories occurs in a complex and interconnected way where additional virtues like conservativeness—roughly, conformity with extant commitments—play an under-recognized role.
    step1: |-
      其他反对抽象实体的论证，意在表明唯名论理论比反唯名论对手更强、更有辩护，或在其他方面更为可取。这些论证取决于唯名论与反唯名论对手的具体内容，但最熟悉的论证以本体论简约性为前提——大致说，唯名论者相信的实体比反唯名论者少，并主张在其他条件相同的情况下，我们应偏爱较简单的理论。这一由简约性驱动的唯名论辩护，假定简约性是一种理论德性，能使对某些理论的信念更有辩护（见 Parsons 1976、Nolan 1999 与 Bricker 2020）[^bricker-2020][^nolan-1999][^parsons-1976]。这一路论证若要成功，弃绝对抽象实体的本体论承诺便不得招致过度的理论缺陷，如表述上不必要的复杂、额外初始概念或其他重大理论代价。此外，正如 Melia（2008b）所指出的，弃绝抽象实体只是获得本体论简单性的一种途径。例如，另一种办法是弃绝具体实体，发展一种只含抽象实体的毕达哥拉斯式形而上学。这表明理论评价的方式复杂而相互关联，其中保守性——大致指与既有承诺的一致——之类额外德性起着未被充分认识的作用。
    step2: |-
      其他反对抽象实体的论证，意在表明唯名论理论比反唯名论对手更强、更有辩护，或在其他方面更可取。这些论证取决于双方理论的具体内容，但最常见的一路以本体论简约性为前提：大体说，唯名论者相信的实体更少，并主张其他条件相同时应偏爱较简单的理论。这一由简约性驱动的辩护，预设简约性是一种理论德性，能使对某些理论的信念更有辩护（见 Parsons 1976、Nolan 1999、Bricker 2020）[^bricker-2020][^nolan-1999][^parsons-1976]。这条路要走得通，弃绝对抽象实体的本体论承诺就不得招致过度的理论缺陷——表述上不必要的复杂、额外的初始概念，或其他重大理论代价。此外，如 Melia（2008b）所言，弃绝抽象实体只是求得本体论简单性的一条途径。另一种办法是弃绝具体实体，发展一种只含抽象实体的毕达哥拉斯式形而上学。这正说明理论评价复杂而相互勾连，其中保守性——大致指与既有承诺相符——这类德性所起的作用，一向未被充分认识。
