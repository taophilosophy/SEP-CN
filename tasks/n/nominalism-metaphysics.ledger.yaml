      真值制造者式进路通过追问何实体充当 (1)–(3) 之类句子的真值制造者，来辨别其本体论后果。按这一进路，真值制造关系是一种独特的关系，一端是句子或命题，另一端是事实、事态或对象之类实体。（关于真值制造者理论，见 Armstrong 2004 与"真值制造者"词条；关于真值制造与唯名论，见 Armstrong 1997: 115、Melia 2005、Asay 2020: 175–197。）[^armstrong-1997][^armstrong-2004][^asay-2020][^melia-2005] 借真值制造者理论提取本体论承诺，关键在于相关真值制造者与真值制造理论的细节，而不是 (1)–(3) 之类主张的语义或句法。例如，一些真值制造者理论家认为，"苏格拉底是人"这一句子的真值制造者是涉及苏格拉底与*为人*这一属性的事实或事态。与之相对的真值制造者进路则认为，"苏格拉底是人"之为真既不要求事实、事态，也不要求属性；它要求的是特普，或只需苏格拉底以其实际所是而存在作为真值制造者。除了对真值制造的一般进路各异，为某个句子设定何种真值制造者也常是争议所在。为反唯名论辩护的真值制造者进路会主张：若无七、毕达哥拉斯定理、超人这类抽象实体，我们便无法可信地说明 (1)–(3) 之类主张之为真。然而，若真值制造者理论家能提供一种说明，为 (1)–(3) 之类主张找出可行且亲唯名论的真值制造者，唯名论者便有资格抵制基于真值制造者的反唯名论论证。
