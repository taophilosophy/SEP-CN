      Alternative approaches for analyzing the abstract-concrete distinction draw upon the above features—e.g., by taking abstract entities to be *essentially* non-spatiotemporal—or require altogether different resources—e.g., by holding abstract entities to lack certain kinds of qualitative or intrinsic properties (see Cowling 2017: 74–92, and Hoffman and Rosenkrantz 2003: 46–52)[^cowling-2017][^hoffman-2003]. There remains no uncontroversial way to draw the abstract-concrete distinction, but the consequences of nominalism regarding abstract entities depend directly upon the correct account of the distinction. For example, if abstract entities are held to be distinctively non-spatiotemporal, nominalism proves equivalent to the thesis that reality is entirely spatiotemporal.
