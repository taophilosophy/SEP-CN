  - id: 10
    kind: body
    source: |-
      Nominalism about universals is the thesis that there are no universals (see Armstrong 1978)[^armstrong-1978]. While this sounds simple enough, the notion of a universal is complicated. To begin, we can introduce a separate notion of a *qualitative nature*, where such natures, if they exist, are responsible for the world’s qualitative variation and sameness. Consider, for example, a red apple and a green avocado. If there are qualitative natures, then the apple and the avocado have distinct color-relevant qualitative natures, one relevant to redness and one relevant to greenness. They also enjoy distinct texture-relevant qualitative natures, one relevant to smoothness and the other to bumpiness. Further examples are easy to generate, and, if there are qualitative natures, then there is potentially one for every possible qualitative classification.
    step1: |-
      关于共相的唯名论是"没有共相"的论旨（见 Armstrong 1978）[^armstrong-1978]。这话听起来简单，共相的概念却复杂。先引入一个单独的*质性本性*概念：这类本性若存在，则负责世界的质性差异与相同。试想一个红苹果与一个绿牛油果。若有质性本性，则苹果与牛油果各有不同的颜色相关质性本性，一个关乎红，一个关乎绿。它们也各有不同的质地相关质性本性，一个关乎光滑，一个关乎凹凸。更多例子不难举出；若有质性本性，则原则上每一种可能的质性分类都有一种。
    step2: |-
      关于共相的唯名论，就是"没有共相"这一论旨（见 Armstrong 1978）[^armstrong-1978]。听着简单，共相的概念却不简单。先引入一个单独的概念——*质性本性*：这类本性若存在，便负责世界在质上的差异与相同。试想一个红苹果、一个绿牛油果。若有质性本性，二者便各有不同的颜色相关质性本性，一关乎红，一关乎绿；也各有不同的质地相关质性本性，一关乎光滑，一关乎凹凸。这类例子不难再举；若质性本性存在，那么原则上每一种可能的质性分类都有一种。
