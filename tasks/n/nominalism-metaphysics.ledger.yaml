      Alethic arguments proceed from the truth of sentences like (1)–(3) plus an additional principle that links the truth of these claims to the existence of the abstract entities that are their apparent subject matter. A variety of principles have been proposed to play this linking role and thereby support the anti-nominalist conclusion. We will briefly note three broad approaches to providing such a principle, which we will group as Fregean, truthmaker-based, and Quinean.
    step1: TBD
    step2: TBD
  - id: 48
    kind: body
    source: |-
      The Fregean approach invokes a thesis about the linguistic category of terms like “seven”, “The Pythagorean Theorem”, and “Superman” in sentences like (1)–(3) and notes that in such cases these expressions function as singular terms. So, given the truth of such claims, the existence of the number seven, the Pythagorean Theorem, and Superman is held to follow. This broad approach, inspired by Frege (1884), takes questions about the existence of entities to be properly answered by determining whether they are the referents of singular terms in true sentences. Discussing the argument for the existence of numbers in Frege 1884, Hale (1996: 438) summarizes this argument schema as follows: “statements of the kind in question… are to be regarded as involving expressions… functioning as singular terms; thus, since the function of a singular term is precisely to effect reference to an object, the truth of those statements requires the existence of the objects to which the expressions refer.” The existence of the number seven is therefore a consequence of the truth of (1) and the linguistic category of the term “seven” as it occurs within (1). Importantly, this approach holds that the notion of object is conceptually connected with the semantics and syntax of certain expressions and that truth is a guide to ontological fact. (On Fregean arguments for abstract entities, see Wright 1983, Rosen 1993, and MacBride 2003.)[^macbride-2003][^rosen-1993][^wright-1983]
    step1: TBD
    step2: TBD
  - id: 49
    kind: body
    source: |-
      Truthmaker-based approaches discern the ontological consequences of sentences like (1)–(3) by asking what entity (or entities) serve as their truthmaker(s). On this approach, the truthmaking relation is a distinctive one that holds between sentences or propositions, on the one hand, and entities like facts, states of affairs, or objects on the other. (On truthmaker theory, see Armstrong 2004 and the entry on truthmakers. On truthmaking and nominalism, see Armstrong 1997: 115, Melia 2005, and Asay 2020: 175–197.)[^armstrong-1997][^armstrong-2004][^asay-2020][^melia-2005] The extraction of ontological commitments via truthmaker theory crucially depends upon the details of the relevant theory of truthmakers and truthmaking rather than the semantics or syntax of claims like (1)–(3). For instance, some truthmaker theorists hold the sentence ‘Socrates is a human’ has as its truthmaker a fact or state of affairs involving Socrates and the property *being human.* Contrasting truthmaker approaches instead hold that neither facts, states of affairs, or properties are required by the truth of ‘Socrates is human’; it requires instead tropes or perhaps only the existence of Socrates as he actually is as a truthmaker. Along with differing general approaches to truthmaking, the precise truthmaker posited for a sentence is regularly a matter of controversy. The truthmaker approach for defending anti-nominalism will hold that, without abstract entities like seven, the Pythagorean Theorem, and Superman, we cannot plausibly account for the truth of claims like (1)–(3). If, however, truthmaker theorists can supply an account of truthmaking that identifies viable, nominalist-friendly truthmakers for claims like (1)–(3), nominalists are in a position to resist a truthmaker-based argument for anti-nominalism.
    step1: TBD
    step2: TBD
  - id: 50
    kind: body
    source: |-
      The Quinean approach supplements the truth of claims (1)–(3) with a criterion of ontological commitment, which provides a method for determining what entities must exist if such claims are true. Roughly speaking, the Quinean criterion takes the ontological commitments of a sentence to be the values of the variables that fall within the scope of the quantifiers of the sentence when translated into first-order logic as part of a theory. Where truthmaker-based arguments depend upon a background theory of truthmaking, arguments of this sort hinge upon a distinctive role for quantifiers and variables as means of discerning the commitments of theories (see Quine 1948 and the relevant sections of the entry on ontological commitment)[^quine-1948]. For instance, the sentence “Socrates is human” would be translated as “∃x Socratizes(x) & Is-Human(x)” and thus any theory in which “Socrates is human” occurs is ontologically committed to something that is Socrates by virtue of the variable bound by the existential quantifier ranging over a domain that includes such an entity. The Quinean criterion for ontological commitment provides a highly specific answer to questions regarding the ontological commitments of sentences; however, the Quinean criterion leaves open which theories to accept as well as the proper regimentation of theories and their constituent sentences. As we will see below, some nominalist responses to Quinean arguments proceed by denying that claims like (1)–(3) are properly regimented in ways that require quantification over putatively abstract entities.
    step1: TBD
    step2: TBD
  - id: 51
    kind: body
    source: |-
      In developing arguments for anti-nominalism, Quine’s criterion of ontological commitment is widely adopted; however, Quine pairs his deployment of the criterion with a more general commitment to the thesis of ontological naturalism, according to which our best, mature scientific theories are the proper arbiters of what sentences we ought to accept. In turn, these theories are our best guides to what exists. The conjunction of Quine’s criterion and ontological naturalism along with the apparent indispensability of mathematical entities for our best physical theories is the basis of what is often-called the Quine-Putnam indispensability argument for mathematical realism. This argument has been the subject of intense interest in the philosophy of mathematics (see Quine 1970, Putnam 1971, Colyvan 2001 and entry on Indispensability Arguments in the Philosophy of Mathematics)[^colyvan-2001][^putnam-1971][^quine-1970]. Many who reject ontological naturalism nevertheless rely upon Quine’s criterion in order to determine what the ontological commitments of true sentences might be. Quine’s criterion is therefore a premise in various arguments for different kinds of abstract entities. For instance, Quine’s criterion would seem to suggest that, despite the fact that (3) is not part of any scientific theory, its truth requires the existence of fictional characters and musical works provided that one accepts that (3) ought to regimented in a manner that requires quantification over entities that have the property of *being Superman* or *being Liszt’s Piano Sonata in B Minor.*
    step1: TBD
    step2: TBD
