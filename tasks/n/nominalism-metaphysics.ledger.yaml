      ### 2.2 Other Arguments for Nominalism
    step1: TBD
    step2: TBD
  - id: 33
    kind: body
    source: |-
      Other arguments against abstract entities seek to show that nominalist theories are stronger, better justified, or otherwise more virtuous than anti-nominalist competitors. These arguments are dependent upon the specific content of nominalist and anti-nominalist rivals, but the most familiar arguments are premised upon ontological parsimony—roughly speaking, nominalists believe in fewer entities than anti-nominalists and hold that, other things being equal, we ought to prefer simpler theories to less simple alternatives. This parsimony-driven defense of nominalism assumes that parsimony is a theoretical virtue, which makes belief in certain theories better justified (see Parsons 1976, Nolan 1999, and Bricker 2020)[^bricker-2020][^nolan-1999][^parsons-1976]. For this line of argument to succeed, dispensing with ontological commitment to abstract entities must not require excessive theoretical vices like undue complexity in formulation, additional primitive notions, or other significant theoretical costs. Additionally, as Melia (2008b) notes, the option of dispensing with abstract entities is only one way to secure ontological simplicity. For example, an alternative would be to dispense with concrete entities and develop a Pythagorean metaphysics of exclusively abstract entities. This illustrates how the evaluation of theories occurs in a complex and interconnected way where additional virtues like conservativeness—roughly, conformity with extant commitments—play an under-recognized role.
    step1: TBD
    step2: TBD
  - id: 34
    kind: body
    source: |-
      Another family of arguments sometimes held to favor nominalism about abstract entities stems from worries about indeterminacy or non-uniqueness that result from positing abstract entities in our mathematical, semantic, or metaphysical theories. As Benacerraf (1965) argues, some anti-nominalist accounts of mathematics face a serious challenge: how to choose from among incompatible yet equally plausible candidate reductions of arithmetical notions like *natural number* to set theory. For example, should we accept the account that identifies the number two with the set {{0}} in one sequence or with {0,{0}} in a different yet equally viable sequence? Roughly speaking, anti-nominalists seem required to either privilege a unique set-theoretic reduction without principled reasons or instead accept that certain theoretical notions like *natural number* are surprisingly indeterminate in meaning. As subsequent commentators have noted, a parallel non-uniqueness problem arises when providing a theory of propositions or properties in terms of set theory. Additional versions of the problem have been alleged to arise when anti-nominalists accept ontologically rich conceptions of properties (see Moore 1999, Caplan and Tillman 2013, Melia 1992)[^caplan-2013][^melia-1992][^moore-1999]. In addition, Field (1980: ii) suggests that worries about the “desirability of eliminating certain sorts of ‘arbitrariness’ or ‘conventional choice’” are quite general and serve as important motivations for nominalism. The non-uniqueness problem has prompted the development of certain structuralist approaches to the philosophy of mathematics. While some of these are nominalist in character, other anti-nominalist versions hold structures to be abstract entities (see Chihara 2004, Shapiro 1997, Resnik 1981, Hellman 1989, and the entry on structuralism in the philosophy of mathematics)[^chihara-2004][^hellman-1989][^resnik-1981][^shapiro-1997].
    step1: TBD
    step2: TBD
  - id: 35
    kind: body
    source: |-
      Despite the fact that some philosophers hold our thought and talk about possibilities to require a commitment to possibilities as abstract entities, modal considerations have also been used to support the case for nominalism. For example, Humeans about modality reject necessary connections between distinct entities, and, for most anti-nominalists, commitment to properties, propositions, or mathematical entities specifically require such connections. (On Humeanism, see Lewis 1986, Wilson 2015, Nolan 1996.)[^lewis-1986][^nolan-1996][^wilson-2015] For instance, on a standard anti-nominalist view, the truth of certain claims about individuals and properties is analyzed in terms of the instantiation of properties. For instance, if May is human, then, according to the proposed anti-nominalist analysis, May must instantiate *being human.* Such an analysis, in turn, entails additional claims about properties—e.g., that, if May is human, then May instantiates the property *having some property or other* and that *being human* instantiates the property *being a property*. Anti-nominalist analyses of this sort often connect properties with propositions. So, in our present example, if May is human, then the proposition *that May is human* must exist and instantiate the property *being true*. Necessary connections among properties and propositions are standard features of these kinds of metaphysical analyses and, for this reason, a commitment to Humeanism is in tension with those theories committed to abstract entities that stand in such metaphysically necessary relationships.
    step1: TBD
    step2: TBD
  - id: 36
    kind: body
    source: |-
      Modality-based arguments against anti-nominalist theories have also been advanced with weaker assumptions and without a dependence upon Humeanism. For instance, Dorr (2008) notes that anti-nominalists are obliged to accept a vast number of “brute necessities” if abstract entities are to play their required theoretical role. (Unlike Humeanism, this stricture against brute necessities is potentially consistent with necessary connections between entities.) A prohibition against admitting brute necessities into our theories has therefore been cited as a reason to reject anti-nominalism. Brute necessities also play a key role in an argument Lewis (1986: 174–191) offers against certain anti-nominalist theories of possible worlds—views he describes as forms of “magical ersatzism.” Whether Lewis’s argument against magical ersatzism can be deployed against some or perhaps all other abstract entities remains unclear, but van Inwagen (1986) discusses the application of this modality-driven argument to the case of sets (see Nolan 2020 and Himelright 2023)[^himelright-2023][^nolan-2020]. An additional modal challenge for anti-nominalism arises in explaining the distinctive necessary existence of abstract entities–e.g., precisely why they are necessary rather than contingent beings. See Rosen 2002 on whether anti-nominalism is more plausibly viewed as a contingent or necessary thesis.
    step1: TBD
    step2: TBD
  - id: 37
    kind: body
    source: |-
      Immediately after their bold proclamation that the justification of nominalism requires no further support, Quine and Goodman suggest that the case for nominalism can be “fortified” by other considerations. Specifically, they say that “what seems to be the most natural principle for abstracting classes or properties leads to paradoxes” and “[e]scape from these paradoxes can apparently be effected only by recourse to alternative rules whose artificiality and arbitrariness arouse suspicion that we are lost in a world of make-believe” (1943: 105). This remark makes salient the threat of paradox that looms in the development of formal theories regarding mathematical entities like classes as well as properties, propositions, and others (see entry on Russell’s Paradox). Nominalist alternatives to set theory premised upon mereology are notable responses to such paradoxes (for discussion, see entry on [Stanisław Leśniewski](https://plato.stanford.edu/entries/lesniewski/#EarMer)). In addition to the worry that specific theories regarding abstract entities like classes or properties might succumb to paradox, there is the further worry that the interaction of certain independently plausible anti-nominalist theories might lead to paradox—e.g., Kaplan’s Paradox, which involves set theory and its interaction with the metaphysics of propositions and possibilities (Kaplan 1995)[^kaplan-1995]. While worries about paradox might militate against specific theories of sets, properties, propositions, and so on, there is little compelling evidence that it is the abstractness of the relevant entities that makes them endemically or unavoidably paradoxical. Nor is the formal character of the relevant theories plausibly thought to be the unique source of difficulty. For instance, F.H. Bradley’s influential regress argument threatens to show that certain conceptions of properties, facts, or states of affairs yield vicious, infinite explanatory regresses, but Bradley-style arguments have been deployed against anti-nominalist theories that are largely informal in their presentation and development (see Bradley 1893 and the entry on Bradley’s regress)[^bradley-1893]. It seems, then, the allegedly “fortifying” considerations mentioned by Quine and Goodman do little to constitute a general case against the existence of abstract entities.
