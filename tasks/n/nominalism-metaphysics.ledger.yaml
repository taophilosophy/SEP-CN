      Related approaches posit distinct meanings of quantifiers and cognate expressions, only some of which are privileged for the purposes of ontology. So, if our concerns are metaphysical in kind (e.g., when we debate the existence of abstract entities), nominalists hold that claims like (1)–(3) prove false on this privileged interpretation. However, in ordinary contexts, claims like (1)–(3) are true and this is because of a non-ontologically-committing meaning associated with the relevant quantifiers and cognate expressions. Roughly speaking, when (1)–(3) are ordinarily used they incur no metaphysical consequences and are therefore consistent with the truth of nominalism. But, if asserted in metaphysical contexts and thus expressing their privileged, ontologically committal meanings, they are incompatible with nominalism and entail the truth of anti-nominalism (Hofweber 2005, Sider 2011, Dorr 2008, Korman 2015)[^dorr-2008][^hofweber-2005][^korman-2015][^sider-2011].
    step1: |-
      相关进路设定量词及相关表达式有不同意义，其中只有一些在 ontology 目的上享有特权。于是，若我们的关切在种类上是形而上学的（例如当我们争论抽象实体是否存在时），唯名论者便主张：在此特权解释下，(1)–(3) 之类主张为假。然而在日常语境中，(1)–(3) 之类主张为真，这是因为相关量词与同源表达式带有一种不涉本体论承诺的意义。大致说，(1)–(3) 被日常使用时并不产生形而上学后果，因而与唯名论之为真相容；但若在形而上学语境中断言，从而表达其享有特权的、有本体论承诺的意义，它们便与唯名论不相容，并蕴涵反唯名论之为真（Hofweber 2005、Sider 2011、Dorr 2008、Korman 2015）[^dorr-2008][^hofweber-2005][^korman-2015][^sider-2011]。
    step2: |-
      相关进路设定：量词与同源表达式有不同意义，其中只有一些享有本体论上的特权。于是，若我们的关切在种类上是形而上学的（比如争论抽象实体是否存在），唯名论者便主张：在此特权解释下，(1)–(3) 之类主张为假。可在日常语境中，(1)–(3) 为真，原因是相关量词与同源表达式带有一种不涉本体论承诺的意义。大致说，(1)–(3) 被日常使用时并不产生形而上学后果，故与唯名论之为真相容；但若在形而上学语境中断言，从而表达其特权的、有本体论承诺的意义，它们便与唯名论不相容，并蕴涵反唯名论之为真（Hofweber 2005、Sider 2011、Dorr 2008、Korman 2015）[^dorr-2008][^hofweber-2005][^korman-2015][^sider-2011]。
