    kind: body
    source: |-
      ### 4.1 General Nominalist Strategies
    step1: TBD
    step2: TBD
  - id: 58
    kind: body
    source: |-
      Suppose that we accept nominalism about abstract entities and also hold that some category of entities, *F*s, would be properly categorized as abstract. It follows that, on our view, there are no *F*s. How, then, can we make sense of the apparent meaningfulness, truth, and usefulness of our thought and talk about *F*s? As we noted in Section Three, claims such as (1)–(3) are often used to motivate a commitment to abstract entities. So, if nominalism about abstract entities is to prove an attractive metaphysical position, nominalists are obliged to explain how these claims might be (or merely appear to be) meaningful, true, and useful, given the nonexistence of their ostensible subject matter.
    step1: TBD
    step2: TBD
  - id: 59
    kind: body
    source: |-
      General nominalist strategies seek to provide an account of what we will call “abstract discourse”—roughly, theories or claims such as (1)–(3) that apparently refer to and quantify over entities like numbers, theorems, properties, fictional characters, and so on. Given their commitment to abstract entities, anti-nominalists are well positioned to treat abstract discourse as meaningful, intended literally, true, as well as ontologically committal. In contrast, nominalists must reject some component of the anti-nominalist stance toward abstract discourse. In cataloging various general nominalist strategies, we will leave aside certain approaches that eschew abstract entities, but involve even broader disagreements with anti-nominalists—e.g., idealism, solipsism, and certain forms of skepticism. (On anti-nominalism and idealism, see Hofweber 2016.)[^hofweber-2016]
    step1: TBD
    step2: TBD
  - id: 60
    kind: body
    source: |-
      Perhaps the most radical nominalist view of abstract discourse is *non-cognitivism*, according to which claims like (1)–(3) are without ordinary semantic content. Such a view enjoys little plausibility if we focus solely on the commonalities between abstract discourse and ordinary discourse. This is because (1)–(3) seem unexceptional when compared with parallel claims about concrete entities. There are, however, a range of instrumentalist views regarding our discourse about unobservable entities within scientific theories that, if otherwise defensible, would provide a precedent for accommodating abstract discourse. On these views, claims such as (1)–(3) have no descriptive semantic function and serve instead as “instruments” for systematizing our descriptive claims about concrete entities. Instrumentalist views of this kind have been specifically developed with regard to mathematical discourse and the avoidance of ontological commitment to mathematical entities (see Burgess 1983 and Leng 2010)[^burgess-1983][^leng-2010].
    step1: TBD
    step2: TBD
  - id: 61
    kind: body
    source: |-
      For nominalists who accept that abstract discourse has semantic content yet warrants a kind of non-literal construal, a different strategy is to deny that claims like (1)–(3) are typically used to assert their apparent semantic content and instead communicate metaphorical or figurative information. Such views acknowledge merely apparent commitment to numbers or propositions in claims like (1)–(3) but recast them as “representational aids” rather than entities named by singular terms. The taxonomy of strategies that rely on this approach is controversial. Moreover, several views about the content of abstract discourse may turn out to undermine the possibility of literally denying the existence of abstract entities, since attempts to assert the thesis of nominalism would be surreptitiously non-literal. Figuralist and fictionalist approaches of this sort, which seek to explain the representational contribution of abstract discourse as broadly metaphorical, remain actively debated. (For discussion, see Yablo 2002a, 2002b, 2005, and the entries on fictionalism and fictionalism in the philosophy of mathematics.)[^yablo-2002a]
    step1: TBD
    step2: TBD
  - id: 62
    kind: body
    source: |-
      For nominalists who grant that abstract discourse is meaningful and intended literally, a remaining alternative is to deny its truth. This strategy sets nominalism about abstract entities in apparent conflict with common sense, since nominalists must plausibly explain away the robust intuition that at least some claims like (1)–(3) are true.
    step1: TBD
    step2: TBD
  - id: 63
    kind: body
    source: |-
      An influential strategy for nominalists who take abstract discourse to be meaningful and intended literally is to hold that our alethic intuitions about claims like (1)–(3) are best explained in parallel to our intuitions that Sherlock Holmes is a detective or that Garfield is a cat. All such claims are false *simpliciter* yet true according to familiar and contextually salient fictions. (See, e.g., Field 1980 on mathematical entities and Rosen 1990 on possible worlds.)[^field-1980][^rosen-1990] Although it is not true that Sherlock Holmes is a detective, the following claim is held to be true: according to the Sherlock Holmes stories, Sherlock Holmes is a detective. Once made explicit, speakers are inclined to recognize the distinction between these kinds of claims and the corresponding difference in their truth values. Moreover, for nominalists who accept this sort of fictionalist approach, the denial of claims like (1)–(3) can be paired with the claim that there are contextually salient “fictions” like arithmetic, property theory, or realism about propositions, any of which can be used to explain our apparent confidence in the truth of (1)–(3). Furthermore, the development and adoption of these fictions is explained by their expedience or value in reasoning about concrete entities. For instance, the development of a robust fiction regarding numbers or about a plurality of abstract possible worlds is of value precisely because it allows us to speak and reason in concise or powerful ways about a world of exclusively concrete entities.
    step1: TBD
    step2: TBD
