      According to the *spatiotemporal approach*, the distinction between abstract and concrete entities should be understood in terms of spatial or spatiotemporal location: abstract entities lack locations, while concrete entities have them. With regard to our paradigm examples, this approach renders a plausible verdict: numbers do not seem to be anywhere (even if inscriptions that name them are), and pieces of furniture surely seem to be located in spacetime. As we move beyond paradigm cases, tough questions multiply quickly. Are spacetime regions located at themselves, or are they abstract? Is the set that has Obama as a member, {Obama}, located where Obama is or nowhere at all? What of views on which universals are wholly located where they are instantiated? And, when we turn to more controversial cases, it is far from clear that this approach offers any useful guidance. For instance, while Hamlet and *Hamlet* do not seem to have spatial locations, they do seem to have come into existence around 1600. Might they have temporal but not spatial locations? And what would that fact mean for their status as abstract or concrete entities? Additional challenges for this approach revolve around the case of souls or deities that are purported to exist outside space or time. On most views, such entities are not plausibly included in the category of abstract entity, especially given relationships they are thought to bear to concrete reality. (On spatial and spatiotemporal approaches, see Hale 1988, Lowe 1995, and Hoffman and Rosenkrantz 2003.)[^hale-1988][^hoffman-2003][^lowe-1995]
    step1: |-
      按*时空进路*，抽象实体与具体实体之分应以空间或时空位置来理解：抽象实体没有位置，具体实体有位置。就范例而言，这一进路给出可信的裁断：数似乎不在任何地方（纵然命名它们的书写痕迹在），家具当然似乎在时空中。一旦超出范例，难题便迅速增多。时空区域位于自身处，还是抽象的？以奥巴马为成员的那个集合 {Obama}，位于奥巴马所在处，还是根本无处？那些认为共相完全位于其被实例化处的观点又当如何？至于更具争议的情形，这一进路是否提供任何有用的指引，就更不清楚了。例如，哈姆雷特与《哈姆雷特》似乎没有空间位置，却似乎约在 1600 年产生。它们可以有时间位置而无空间位置吗？若如此，这一事实对它们的抽象或具体地位意味着什么？这一进路还有别的挑战，围绕据称存在于时空之外灵魂或神祇的情形。按多数观点，这类实体不宜归入抽象实体范畴，尤其考虑到它们被认为与具体实在所持的关系。（关于空间进路与时空进路，见 Hale 1988、Lowe 1995 与 Hoffman and Rosenkrantz 2003。）[^hale-1988][^hoffman-2003][^lowe-1995]
    step2: |-
      按*时空进路*，抽象与具体之分应就空间或时空位置来理解：抽象实体没有位置，具体实体有位置。就范例而言，这一进路裁断可信：数似乎不在任何地方（纵然命名它们的书写痕迹在），家具当然在时空中。可一超出范例，难题便迅速丛生。时空区域位于自身处，还是抽象的？以奥巴马为成员的那个集合 {Obama}，位于奥巴马所在处，还是根本无处？若持"共相完全位于其被实例化处"之说，又当如何？至于更具争议的情形，这条进路能否提供有用的指引，就更不清楚了。例如，哈姆雷特与《哈姆雷特》似乎没有空间位置，却似乎约在 1600 年产生；它们可以有时间位置而无空间位置吗？若如此，这对它们的抽象或具体身份意味着什么？这一进路还有别的麻烦，围绕据称存在于时空之外的灵魂或神祇：按多数观点，这类实体不宜归入抽象实体，尤其考虑到它们被认为与具体实在的关系。（关于空间进路与时空进路，见 Hale 1988、Lowe 1995、Hoffman and Rosenkrantz 2003。）[^hale-1988][^hoffman-2003][^lowe-1995]
