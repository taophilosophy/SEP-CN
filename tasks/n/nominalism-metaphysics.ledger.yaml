      The arguments above proceed from the truth of claims that apparently express or refer to abstract entities. Other anti-nominalist arguments focus on the explanatory role of abstract entities or universals as theoretical posits. *Explanatory* or abductive arguments for anti-nominalism aim to show that theories committed to the existence of abstract entities provide the best or perhaps the only viable explanations of certain phenomena. Generally speaking, anti-nominalist theories enjoy an advantage in simplicity of formulation even if they require the existence of abstract entities. In contrast, nominalist theories often seek to replace or translate claims like (1)–(3) into claims that make no reference to (and therefore require no quantification over) abstract entities. Focus on explanatory considerations in ontology has brought questions about theoretical virtues and their correct application to the forefront of metaphysical debate, while raising broader concerns about the (dis)analogies between metaphysical posits like properties or propositions and scientific posits like electrons or genes. (On theoretical virtues, see Schindler 2018 and Nolan 1999.)[^nolan-1999][^schindler-2018]
    step1: TBD
    step2: TBD
  - id: 53
    kind: body
    source: |-
      Explanatory anti-nominalist arguments are wide-ranging. For example, arguments for the existence of propositions allege that theories without such entities are incapable of suitably explaining semantic phenomena like meaning, linguistic practices like translation, or cognitive phenomena like belief and doubt (see Church 1951)[^church-1951]. Parallel arguments for anti-nominalist views about possible worlds hold that we cannot satisfactorily explain our modal reasoning or the content of our counterfactual thought and talk without positing such entities. Additional arguments hold that our best theories of laws of nature require commitment to universals and relations among universals, which some hold to be abstract entities (see, e.g., Armstrong 1982 and Tooley 1977)[^armstrong-1982][^tooley-1977]. Other anti-nominalist arguments in the philosophy of art claim that we cannot account for the phenomena of musical appreciation or authentic performance without commitment to the existence of musical works (see Dodd 2000)[^dodd-2000]. In advancing an argument for properties, propositions, and other entities, the remarks of Church (1951: 104) are representative of explanatory anti-nominalist efforts: “To those who find forbidding the array of abstract entities and principles concerning them which is here proposed, I would say that the problems which give rise to [an anti-nominalist theory] are difficult and a simpler theory is not known to be possible.” Although propositions, properties, and possible worlds are familiar posits of philosophical theories, the breadth and power of explanatory anti-nominalist arguments is significantly increased if the pervasive reference to and theorizing about entities like linguistic types, biological kinds, and chemical properties like *malleability* is best understood as abstract discourse. On such a view, our commitments to abstract entities are exceptionally broad in scope. (For a remarkable catalogue of the deployment of types in various contexts, see Wetzel 2009: 3–21.)[^wetzel-2009]
    step1: TBD
    step2: TBD
